  details: |
    Genetics pass for #12192. CPT2 was already wired to the fatty-acid-oxidation node. Two things were fixed. First, the entry carried two separate `genetic:` records for the same gene - 'CPT2 gene variants' (carrying the variants and inheritance) and a bare 'CPT2' holding only the ClinGen Definitive assertion - which rendered as two gene nodes for one gene. Merged the ClinGen evidence into the variant-bearing record and removed the duplicate. Second, none of the three `has_subtypes` rows carried a gene, so the fact that the myopathic, severe infantile and lethal neonatal forms are allelic rather than locus-heterogeneous was not machine-readable; bound CPT2 (hgnc:2330) on all three. MONDO reconciliation: MONDO:0009704, MONDO:0010914 and MONDO:0012136 all record CPT2 and all three are now bound at their subtype rows. No new literature needed.

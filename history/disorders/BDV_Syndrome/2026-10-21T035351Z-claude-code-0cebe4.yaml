  details: |
    De novo curation of BDV syndrome (MONDO:0859150), autosomal recessive carboxypeptidase E (CPE) deficiency. Falcon was requested but EDISON_API_KEY was empty in this environment, so the run fell back to OpenScientist (research/BDV_Syndrome-deep-research-openscientist.md records fell_back: true). That report resolved 20/20 references; needs_review was set by three paraphrased HPO labels, none of which were bound here. Three of its PMIDs (22290118, 24170181, 37898798) concern Borna disease virus, an acronym homonym; the report itself flagged and excluded them, and none are cited. Primary human evidence: Alsters 2015 (PMID:26120850), Durmaz 2021 (PMID:32936766), Bosch 2021 (PMID:34383079), Canoruc Emet 2026 (PMID:39864412). Mechanism nodes (proinsulin, appetite-regulating neuropeptides, pro-GnRH, pro-TRH, hippocampal neurodegeneration) rest on Cpe fat/fat and knockout mouse studies and are tagged MODEL_ORGANISM. just preflight-dr against MONDO:0859150 returned PASS (expected gene CPE mentioned 70 times). No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER). Validated with just validate (schema, terms, all snippets), check-entity-refs, check-causal-targets and check-duplicate-keys.

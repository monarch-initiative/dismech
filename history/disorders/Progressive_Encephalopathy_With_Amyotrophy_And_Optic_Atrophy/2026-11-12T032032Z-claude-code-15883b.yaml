  summary: 'Review round 1: ataxia term, white matter frequency, diagnosis snippet'
  details: |
    The cerebellar ataxia phenotype was bound to the HPO root HP:0001251 Ataxia. It is now bound to HP:0002073 Progressive cerebellar ataxia: ClinGen calls the ataxia cerebellar, MRI shows cerebellar atrophy, and the 2026 cohort (PMID:41833177) describes a progressive spastic-ataxic tetraparesis. That sentence is added as evidence for the progression.

    Cerebral white matter abnormalities move from OCCASIONAL to FREQUENT. The c.464T>A column of the PMID:39153170 comparison table records posterior periventricular T2 hyperintensity in 2 of 7 patients and peri-dentate hyperintensity with a hypomyelinating leukodystrophy in 1 of 7, and the 2026 cohort reports that brain imaging 'often' showed white matter abnormalities. The table text is added as evidence and the description gives the count.

    The molecular diagnosis item quoted a general conclusion about next-generation sequencing. It now quotes the PMID:34134906 result that sequencing of the hypomyelinating leukodystrophy genes found the two TBCE variants.


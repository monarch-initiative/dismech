  summary: 'Create: Progressive Encephalopathy With Amyotrophy And Optic Atrophy'
  details: |
    New entry for PEAMO (MONDO:0014968, OMIM:617207), the autosomal recessive early-onset neurodegenerative disorder caused by biallelic hypomorphic TBCE variants, mainly the recurrent Southern Italian missense allele p.Ile155Asn. It covers 17 phenotypes, all causally connected, and an eight-node pathograph running from the TBCE variants through reduced TBCE protein, impaired alpha/beta-tubulin heterodimer assembly and reduced microtubule polymerization to a distal motor axon degeneration and a progressive cerebral and cerebellar neurodegeneration, with a Golgi-fragmentation and axonal-tubulin-routing branch taken from the pmn mouse.

    Name: the MONDO label inverted into natural word order, matching the TBCD sibling entry (Progressive Encephalopathy With Brain Atrophy And Thin Corpus Callosum). No TBCE dyad is established for this scope: MONDO, ClinGen and OMIM use the descriptive title, there is no GeneReviews chapter, and recent papers use TBCE-related only for the whole allelic spectrum, which would be an umbrella name.

    Gene-disease validity: ClinGen Brain Malformations GCEP rates TBCE Moderate for this disease (2025-02-25); the tier is copied into gene_disease_validity. relationship_type is left unset because the schema defines CAUSATIVE as ClinGen Definitive or Strong; the reason is recorded in the genetic notes.

    Scope: the Sanjad-Sakati / AR Kenny-Caffey type 1 spectrum (curated separately) and the milder c.100+1G>A amyotrophy-with-testicular-failure phenotype are differential diagnoses, not subtypes. The milder complex spastic paraparesis described in the 2026 cohort abstract is mentioned in notes but not modelled, because the abstract does not say which genotypes produce it. The Golgi and axonal-transport steps rest on mouse and cultured-neuron data and are flagged in a HUMAN_MODEL_MISMATCH discussion.

    Sources: the phenotype baseline is the gene-discovery abstract, the ClinGen evidence summary, a 2021 case report, the PEAMO column of a 2025 systematic review (full text) and a 2026 cohort abstract. Deep research: falcon was rejected (HTTP 403) and the run fell back to OpenScientist (research/Progressive_Encephalopathy_With_Amyotrophy_And_Optic_Atrophy-deep-research-openscientist.md). Its reference validation resolved all 12 cited references; term validation resolved 34 of 35 terms with none unresolved but named two identifiers as different terms (HP:0002509, GO:0005874), and its NCIT treatment suggestions were not used. just preflight-dr passed (TBCE, OMIM:617207). The report was used as leads only; every cited reference was fetched and every snippet verified against the cache (90 of 90).

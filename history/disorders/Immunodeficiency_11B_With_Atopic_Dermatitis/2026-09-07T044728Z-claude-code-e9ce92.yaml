  summary: 'Edit: address the PR #11295 review'
  details: |
    Review round on PR #11295 (changes requested: four important findings, five optional). Finding 1: the two infection phenotypes (Recurrent respiratory infections, Recurrent skin infections) that rested only on a mouse-paper background sentence graded HUMAN_CLINICAL now cite human clinical series, PMID:30170123 (lung disease in 68% of the DN cohort) and PMID:36405754 (skin infections in 8/10 patients); the mouse quote is retained on the respiratory phenotype regraded MODEL_ORGANISM. Finding 2: Decreased regulatory T cell proportion downgraded from FREQUENT to OCCASIONAL, with a REFUTE evidence item from PMID:30170123 recording that the larger cohorts found generally normal Treg frequencies. Finding 3: added Impaired specific antibody response (HP:0012475), Decreased mitogen-induced T-cell proliferation (HP:0031381, the combined-immunodeficiency readout), Failure to thrive (HP:0001508), Bronchiectasis (HP:0002110), Chronic sinusitis (HP:0011109), Allergic rhinitis (HP:0003193), Eosinophilic infiltration of the esophagus (HP:0410151) and Oral ulcer (HP:0000155), each with a human clinical snippet. Finding 4: added Immunoglobulin replacement therapy (NCIT:C62710) and Topical corticosteroids and calcineurin inhibitors (NCIT:C122078). Optional: the three uncited DOI reference caches (33057950, 37033173, 39945219) removed; the notes claim about the term cache reworded to say the closest HP terms describe the lesions rather than the syndromic susceptibility; an infantile-onset onset descriptor with mean 5.9 months added to the atopic dermatitis phenotype; biological_scale on the atopic-inflammation node changed from TISSUE to ORGANISM. The three-lineage pathophysiology node was left as one node, a judgement call the reviewer flagged as non-blocking. Corrected the PMID:40625738 reference_title to match the cache. Validation: just validate pass, count-verified-snippets 81/81, validate-terms pass, term-cache integrity clean, check-causal-targets, check-entity-refs, check-enum-values, reference-title, snippet-grading, snippet-length and title-snippet gates clean.

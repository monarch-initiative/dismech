  summary: 'Create: Immunodeficiency_11B_With_Atopic_Dermatitis (CARD11 dominant negative,
    MONDO:0054697)'
  details: |
    Created CADINS (immunodeficiency 11B with atopic dermatitis) as a Disease entry (stub entry_type decision: DISEASE), separate from the allelic recessive complete CARD11 deficiency entry curated in the same tranche. Chain: heterozygous dominant-negative CARD11 variant, oligomer poisoning of the CARD11 signalling cycle, attenuated NF-kB/JNK/mTORC1 signalling downstream of the antigen receptor, Th2 skewing via loss of JNK-dependent GATA3 repression, partial T/Treg/NK dysfunction, atopic inflammation with hyper-IgE and eosinophilia. Variants R30W, E57K, R75W and the de novo MAGUK-region S775L. Treatments: dupilumab and omalizumab (case series), investigational glutamine supplementation, infection management and HPV vaccination, genetic counselling. Models: the R30W/+ knock-in mouse and patient/transfected T-cell assays. Sources: PMID:28628108, PMID:28826773 (2017 discovery), PMID:30170123 (allelic series), PMID:35198875, PMID:40111223, PMID:37086690 (mechanism), PMID:34341167 (mouse), PMID:36405754, PMID:35651609, PMID:38311684, PMID:38231347, PMID:39414811 (clinical), PMID:31060714, PMID:36334349, PMID:40625738 (reviews). Deep research: the first Edison/falcon run died with a provider connection error and the entry was drafted from PubMed abstracts; the relaunched run completed afterwards and passed just preflight-dr (CARD11 59 mentions, OMIM 617638); its reference list was cross-checked and added the S775L case report and the Pomerantz 2022 review. The report's own term-validation pass could not be completed because the OLS service timed out; the report is committed without that section. Corrections during validation: one snippet trimmed because a bracketed HGVS span is stripped before matching. Validation: just validate pass, just validate-terms pass, count-verified-snippets 68/68, check-causal-targets and check-entity-refs clean.

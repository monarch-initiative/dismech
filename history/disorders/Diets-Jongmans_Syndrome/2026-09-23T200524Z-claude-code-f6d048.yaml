  summary: 'Create: Diets-Jongmans_Syndrome'
  details: |
    Created the Diets-Jongmans syndrome (MONDO:0030012, KDM3B) entry as a single Disease.

    Deep research: one report. Falcon was requested and returned HTTP 402 (out of credits); the claude_code fallback produced research/Diets-Jongmans_Syndrome-deep-research-claude_code.md (frontmatter records requested_provider falcon, fell_back true). The run exited before writing its validation sections because OLS timed out during term validation, so both were added afterwards with just validate-research-reference and just validate-research-terms. Reference validation: 13/13 references resolved, 6 of 7 quotes found; the one not found is a paraphrase of a PMID:30929739 sentence ("13/14 had high CADD scores"), so the report needs review. Term validation: 53/55 resolved, 0 unresolved, 8 CURIEs named as a different term (HP:0011342, HP:0000824, HP:0009884, HP:0011832, HP:0001696, HP:0012156, NCIT:C1691, and MONDO:0030012 with a prose label). None of the mislabelled CURIEs was used; every binding was looked up in the term caches or OLS. just preflight-dr returned PASS (KDM3B mentioned 47 times, OMIM 618846 matches).

    Sources: the phenotype baseline is the founding 17-individual cohort (PMID:30929739, full text cached, Table 2 frequencies) plus the pooled 27-individual review (PMID:41898828, Table 3). No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER). Structured sources: ClinGen CGGV Definitive for KDM3B with syndromic intellectual disability (MONDO:0000508, broader than this entry), and Orphanet ORPHA:633004. The CGGV cache was built with --csv-only from the ClinGen gene-validity CSV downloaded on 2026-09-23, whose sha256 differs from the manifest pin (snapshot 2026-08-13); the cache header therefore carries the manifest's 2026-08-13 date. The KDM3B row's classification date is 2024-02-21, so the row predates both snapshots. ClinGen has no dosage-sensitivity curation for KDM3B.

    Mechanism: KDM3B loss of function (PROVISIONAL, because missense effect is unassayed) -> increased H3K9me1/2 (Kdm3b+/- cerebellum, PMID:34217333; Kdm3b knockout ovary/uterus, PMID:25892958) -> altered plasticity-gene expression -> impaired memory consolidation, conforming to epigenetic_machinery_neurodevelopmental_dysregulation at four nodes. The last node's edges to intellectual disability, developmental delay, speech and motor delay are marked as inference with no evidence. Growth branch via reduced IGF-1 (Kdm3b knockout mouse) to short stature. Hematopoietic branch (Jmjd1b-/- mouse, PMID:29641999) is left unconnected to the AML, Hodgkin lymphoma and neutropenia phenotypes.

    Germline versus somatic: AML (age 13) and Hodgkin lymphoma (age 17) are recorded as phenotypes because individuals with the syndrome were reported with them, but the founding authors note both were ascertained through a childhood cancer predisposition study. The 5q31 somatic tumor-suppressor literature (PMID:11687974, PMID:21536236, PMID:28540746, PMID:22615488) is confined to an OPEN_QUESTION discussion. Two further discussions record the missense-mechanism gap and the mouse-to-human neurodevelopment mismatch.

    Ontology note: MONDO has a second class for the same disease, MONDO:0858999 (from ORPHA:633004), recorded as a skos:exactMatch mapping.

    Searches run on 2026-09-23 and recorded in notes: PubMed "5q31.2 AND deletion AND (intellectual OR developmental) AND KDM3B" returned 0 records; "KDM3B AND (episignature OR DNA methylation signature)" returned 2, neither about the syndrome.

    Validation: just validate, count-verified-snippets (96/96), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence, check-enum-values, check-coarse-phenotypes, check-reference-titles, list-gene-term-mismatches, pytest tests/test_data.py -k Diets, and validate-disorders.

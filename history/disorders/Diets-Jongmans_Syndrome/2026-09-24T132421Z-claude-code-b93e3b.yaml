  summary: Fix stale GH-deficiency wording and unsupported ID frequency
  details: |
    Review round 2, acting on two non-blocking findings from the approving review of PR #12637.

    Growth hormone deficiency phenotype: the evidence explanation still described the quoted PMID:41878155 sentence as 'a second individual with stimulation-test-confirmed GH deficiency', a count left over from an earlier version that also cited the founding cohort's individual. That citation was removed in the preceding round because its quote is unreachable under linkml-reference-validator 0.3.0rc1 (PMID:30929739 is html-cached and the publisher blocks the XML route), so the entry now documents one individual and the explanation contradicted its own description. The explanation now states what the quoted sentence supports without asserting a count.

    Intellectual disability phenotype: frequency: FREQUENT was left without quotable support after the per-severity counts (8/17 mild, 4/17 moderate) were removed in the same round. Neither cached source scores intellectual disability apart from developmental delay: Table 3 of PMID:41898828 carries a single pooled row, 'Intellectual disability or developmental delay ... 22/27 (81.5%)', and the founding report's own table pools them as well (94.1%, 16/17). The pooled figure is already carried by the Developmental delay phenotype as VERY_FREQUENT, so reusing it here would both double-count the row and contradict the FREQUENT band it was paired with. The band is dropped and the description records that no source scores the two separately.

    No snippet was changed. Verified snippet count is unchanged at 84/84.

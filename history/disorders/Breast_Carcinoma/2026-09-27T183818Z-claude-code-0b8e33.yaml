  summary: Decline the CTNNA1 syndrome row; bind the missing ERBB2 gene_term
  details: |
    Ruling and one binding fix for the series-069 row MONDO:0100256 CTNNA1-related
    diffuse gastric and lobular breast cancer syndrome.

    Row ruling: declined structurally, already curated elsewhere. MONDO:0100256 reaches
    this entry's subtree by MONDO:0000552 breast lobular carcinoma and MONDO:0004988
    breast adenocarcinoma, which I traced to MONDO:0004989 with a parent walk. It is an
    autosomal dominant two-organ cancer predisposition syndrome, and design decision 3a
    keeps germline predisposition syndromes separate from the somatic cancer entries
    they predispose to. Its content is already curated on the gastric side:
    Gastric_Adenocarcinoma carries an HDGC has_subtypes row binding MONDO:0007648 with
    both CDH1 and CTNNA1 in genes, the CTNNA1 nonsense-mediated-decay mechanism, and the
    lobular breast cancer phenotype of CTNNA1-truncating carriers; the CDH1 half of the
    same MONDO pair, MONDO:0100488, is the disease_term of
    CDH1-Related_Hereditary_Diffuse_Gastric_Cancer. The ruling is recorded in notes.

    So the row is spurious in two ways at once: the CURIE grep finds nothing because the
    covering row binds a different CURIE, and the parent the issue names is not where
    the content lives.

    Anchor audit: disease_term MONDO:0004989 breast carcinoma is an exact match for the
    entry, its thirteen children are all breast carcinoma classes, and none of the
    entry's four biomarker-stratum rows binds a CURIE, so both the over-broad and the
    reciprocal test pass. The entry's mappings already record the exactMatch. No change.

    Fix: the ERBB2 genetic record had no gene_term at all, the only one of the four
    without a binding. It now binds hgnc:3430, read from rest.genenames.org in the same
    step.

    Not done, and reported rather than attempted: the four somatic driver records
    (ESR1, ERBB2, PIK3CA, TP53) reach no mechanism node, and the five phenotypes have no
    causal inlink, so the measurement is unchanged at 0/4 genes and 0/5 phenotypes with
    3 of 5 nodes lacking an outgoing edge. This entry's pathophysiology is
    metastasis-stage biology and its phenotypes are metastatic symptoms; wiring the
    drivers needs a molecular-drivers node and wiring the symptoms needs site-specific
    sources this entry does not yet cite. Neither is a wiring pass, so both are left for
    a dedicated round rather than bolted on from the sources at hand.

    Validation on the committed tree: just validate 0 issues; just validate-terms
    passed; just count-verified-snippets 25/25.

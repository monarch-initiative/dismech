  summary: Decide the pathograph wiring of ESR1, ERBB2, PIK3CA and TP53
  details: |
    Issue #13130 reports this entry wiring none of its four causal genes into
    the pathograph (0/4) and asks for a per-gene decision: the node each acts
    through, or a recorded reason that it acts through none. The decisions:

    TP53 is wired. It is the only one of the four whose lesion is not curated
    at a promoted-stratum entry, and PMID:23000897 (TCGA 2012) places it among
    the three genes mutated at more than 10% across all breast cancers, so it is
    shared biology belonging in the base entry. A new node, TP53 Loss of
    Function, binds hgnc:11998 with GO:0000981 DNA-binding transcription factor
    activity, RNA polymerase II-specific under modifier LOSS_OF_FUNCTION,
    GO:0072331 signal transduction by p53 class mediator DECREASED, and
    CL:0002327 mammary gland epithelial cell (looked up on OLS; the direct
    parent of the luminal cell term, chosen because the lesion recurs in
    basal-like tumours too). GO:0001228 DNA-binding transcription activator
    activity, RNA polymerase II-specific was considered as the narrower child
    and not used: the node's claim is loss of p53's sequence-specific
    transcription factor activity as a whole, not only its activator role. It carries a downstream edge to the existing EMT-Driven Dissemination
    node, typed INDIRECT_KNOWN_INTERMEDIATES because the intermediate is the
    miR-200c to ZEB1 axis. PMID:21336307 (Chang et al. 2011) was fetched and
    cached; its in vitro sentence on loss of p53 in mammary epithelial cells
    activating the EMT programme is the edge evidence, and its human breast
    tumour cohort sentence is node evidence. No genetic_context was added to
    the node: a somatic genetic_context would make it the entry's derived cell
    of origin, and TP53 mutation is present in a minority of breast carcinomas.
    The somatic origin is recorded as variant_origin on the genetic: record.

    ESR1, ERBB2 and PIK3CA are deliberately not wired, and each genetic: record
    now says so in a review_notes paragraph beginning "Deliberately not wired."
    naming the node and entry where the lesion is curated: ESR1 Mutation-Driven
    Endocrine Resistance in ER_Positive_Breast_Cancer, ERBB2 Gene Amplification
    in HER2_Positive_Breast_Cancer, and PIK3CA Oncogenic Mutations in
    PIK3CA_Mutant_Breast_Cancer (wired in the same PR). The reason is design
    decisions section 3a L4 item (d): on promotion the parent keeps a pointer
    subtype naming the split file rather than a divergent copy of the
    stratum's content, so adding a lesion node here for each would curate the
    same lesion at two rungs. The review_notes say each lesion "is modelled
    by" the named node rather than that the node binds the gene, because on
    main the ER-positive node binds ESR1 only once PR #13116 merges and the
    HER2-positive node carries hgnc:3430 only in its genetic: record; the
    HER2_Positive_Breast_Cancer wiring gap is noted in the PR as a lead. The heterogeneity
    node is not a landing node for any of them because it describes discordance
    among three receptors, which PR #13128 records on the node itself. The three
    records stay because treatments in this entry depend on them (elacestrant,
    trastuzumab deruxtecan, capivasertib).

    The four pointer subtypes now carry curated_in, the slot section 3e
    (Correction 1) introduced as the structural form of the same "curated
    elsewhere" decision. check-granularity --scope all had
    reported all four as DOUBLE_MODELLED for lacking it; they now report as
    POINTER. The DUPLICATE_ANCHOR finding (the MONDO term shared with
    PIK3CA_Mutant_Breast_Cancer) is left alone; it is issue #12894's subject.

    ERBB2 was also bound: the record had no gene_term at all. It is renamed from
    "ERBB2 (HER2)" to the plain symbol, bound to hgnc:3430 from
    cache/hgnc/terms.csv, and the HER2 alias moved into notes. Nothing referenced
    the old name. PMID:17483330 (Palmieri et al. 2007) was fetched and cached;
    its archival human brain-metastasis series sentence is the record's
    evidence, graded HUMAN_CLINICAL. All four records gained variant_origin:
    SOMATIC, and PIK3CA and TP53 gained the TCGA sentence as evidence.

    The KNOWLEDGE_GAP discussion on primary-tumour mechanisms is left open and
    unchanged: one lesion node feeding the metastatic chain is not the
    primary-tumour chain it asks for.

    Checks: just validate passed; count-verified-snippets 46/46 across both
    files in the PR; validate-terms passed and added CL:0002327 to the CL term
    and cell-type enum caches; list-gene-term-mismatches examined five
    bindings, all naming the gene they bind; check-entity-refs,
    check-causal-targets, check-duplicate-keys, check-enum-values,
    check-qualifier-terms and the whole-KB snippet, title, grading, hyphen,
    reference-title, coarse-phenotype, environmental-evidence, delivery-system
    and case-collision gates passed with no new findings;
    check-gene-activity-grounding against origin/main reported no new finding;
    compliance-connectivity now reports 1/4 causal genes wired. No
    deep-research provider was run: this is a wiring edit on an existing entry,
    and the three new references were found by direct PubMed lookups. The
    existing cache file for PMID:23000897 was rewritten by the fetch in a
    newer extraction format; it was restored to the committed version, against
    which the quoted sentence still verifies, so the PR does not churn a cache
    file other entries cite. validate-disorders rewrote sixteen further
    pre-existing cache files the same way (whitespace and frontmatter only);
    those were restored too.

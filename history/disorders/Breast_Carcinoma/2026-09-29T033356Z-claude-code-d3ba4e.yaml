  summary: Record why no estrogen receptor gene is bound on the estrogen-annotated
    node
  details: |
    Third tranche of the estrogen-signalling pathograph work in issue #12925.
    The issue lists this entry's estrogen-annotated node among fourteen that
    bind GO:0030520 while naming no gene, as candidates for an ESR1 descriptor.
    Read against the node's own claim and sources, ESR1 is not the gene this
    node is about, so the node carries a recorded reason instead of a binding.
    The issue treats that as a closed task rather than an avoided one.

    The node describes discordance in ER, PR and HER2 status between sampled
    regions of one tumor. Three receptors are involved symmetrically, so no one
    receptor gene drives it, and a set spanning a nuclear receptor and a
    receptor tyrosine kinase has no single molecular function. That is the
    many-genes shape check_gene_activity_grounding documents as wanting a node
    split rather than a term.

    This also answers the issue's second list, which names this entry among
    five binding ESR1 in genetic: only. The entry's five pathophysiology nodes
    model metastatic dissemination, receptor heterogeneity, angiogenesis and
    immune evasion; none is a hormone-driven proliferation mechanism, so the
    ESR1 genetic record has no node to reach without adding one. No node in
    this entry carries any gene descriptor at present.

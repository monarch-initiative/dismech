    # Evidence review — Autoimmune_Gastritis

    File: `kb/disorders/Autoimmune_Gastritis.yaml` (987 lines)

    ## Stats
    - Evidence items checked: 43
    - References read (full cache bodies): 21 cited + 1 listed-but-uncited (PMID:31864909) = 22
    - Verified clean: 42 of 43 substantively support their claim; 1 evidence item carried a wrong `reference_title` (fixed)
    - Edits made: 1 (`reference_title` correction, L731)

    ## Findings

    1. **mechanistic_hypotheses#alternative_hpylori_molecular_mimicry_origin, third evidence item (L730-735), PMID:38976374.** `reference_title` read "Results From the Autoimmune gastRItis Study grOup (ARIOSO)"; the cached title is "Results From the Autoimmune gastRitis **Italian netwOrk** Study grOup (ARIOSO)." The snippet and PMID were correct — this is the "correct PMID, verified snippet, invented/garbled title" pattern the references skill warns about. Severity: DEFECT (metadata). ACTION: **fixed** — copied the title verbatim from `references_cache/PMID_38976374.md` frontmatter. `just validate` (43/43 snippets verified, all validations passed) and `just count-verified-snippets` (43/43) both pass after the edit.

    2. **`evidence_source: HUMAN_CLINICAL` on ex-vivo human T-cell work** — PMID:35911678 "Gastric LPMCs from all AIG patients ... were able to proliferate and produce high levels of IL-17A and IL-17F" (L97, L812); PMID:31080562 "Most of these clones (94%) showed a T helper 17 or T helper 1 profile." (L824); PMID:15763992 "The majority of the autoreactive T cell clones secreted IFN-gamma and showed a T helper 1 (Th1) profile." (L771). Each quoted sentence reports an assay on cultured patient-derived cells/clones, which CLAUDE.md's rules put under `IN_VITRO` ("cultured cells or tissue explants (human or animal) ... ex vivo"), not `HUMAN_CLINICAL`. Severity: MINOR. ACTION: reported only — the underlying studies are human patient cohorts (PMID:35911678 also measures serum IL-17 in 43 patients), so the call is genuinely arguable, and `check-snippet-grading` requires changing every occurrence of each sentence in lockstep. Flagging for a curator rather than re-grading four items on a judgement call.

    3. **phenotypes#Gastric Adenocarcinoma (L362-367) and phenotypes#Gastric Neuroendocrine Tumor (L343-348), PMID:42367768.** Both quote the review's own roadmap sentence — "we explore precision risk stratification models for gastric neuroendocrine tumors (gNETs) and gastric adenocarcinoma, emphasizing the roles of endoscopic surveillance and molecular biomarkers". That establishes the review discusses these risks, not that the risk exists; it is closer to a title/aims fragment than a finding. Severity: MINOR. ACTION: reported only — a better exact quote is available in the same cache ("...leading to impaired acid secretion, vitamin B12 deficiency, and an increased risk of gastric malignancies."), and I would suggest swapping it in for the adenocarcinoma phenotype (where it is the only evidence). Not applied because the existing snippet does name both tumour types in an AIG review and the gNET phenotype is independently supported by PMID:31963924. The same aims sentence is the right quote where it is used for treatments#Endoscopic Surveillance (L559-564), since it does mention surveillance.

    4. **environmental#Helicobacter pylori Infection (L459-464), PMID:21174235.** The snippet — "a role for Helicobacter pylori as an infective trigger through molecular mimicry" — is a clause from a list of "cutting edge issues", i.e. the review naming an open question, graded `SUPPORT`. Severity: MINOR. ACTION: reported only — the entry's `description` and the `explanation` both say "proposed"/"candidate", and the same snippet is graded `SUPPORT` in the ALTERNATIVE hypothesis block (L718-723) where the hypothesis status itself carries the uncertainty. `PARTIAL` would be the more honest grade in both places; `supports` is claim-relative so this is a curator call, not a mechanical fix.

    5. **treatments#Helicobacter pylori Eradication (L650-655), PMID:42254085.** The quote ("Rapid eradication of H. pylori can significantly improve hematologic parameters and prevent the progression of autoimmune gastritis.") is the authors' summary claim in a single **case report** (Clin Case Rep), graded `SUPPORT`. Severity: MINOR (overreach — n=1 supporting a management recommendation). ACTION: reported only. Note the same sentence is graded `PARTIAL` at L724-729 in the mimicry hypothesis; that is legitimate (grade is claim-relative, and `check-snippet-grading` only pins `evidence_source`, which is `HUMAN_CLINICAL` in both places and correct for a case report).

    6. **pathophysiology#Hypergastrinemia and ECL Cell Hyperplasia (L207-212), PMID:31963924.** The CCK2R snippet is prefaced in the source by "Based on a large amount of experimental data" and rests largely on rodent work, yet is graded `HUMAN_CLINICAL`. Severity: NOTE. ACTION: reported only — the paper is a human-focused clinical review and the companion snippet at L337-342 ("persistent hypergastrinemia, generally accepted as causing g-NETs in CAG and ZES") is squarely human, so `HUMAN_CLINICAL` for the pair is defensible.

    7. **pathophysiology#Intrinsic Factor Deficiency and B12 Malabsorption (L172-177), PMID:31080562.** The `explanation` says the quote establishes intrinsic factor "whose loss (and autoantibody targeting) causes the B12 malabsorption of pernicious anemia"; the quoted sentence establishes only that intrinsic factor is the major humoral autoantigen. Severity: MINOR (explanation reaches past the quote). ACTION: reported only — the causal step is uncontroversial textbook physiology and is separately supported at L178-183 (PMID:21174235, "megaloblastic pernicious anemia arising from vitamin B12 deficiency"); trimming the explanation is a wording change I judged not worth the churn.

    8. **biochemical#Serum Pepsinogen I (L405-410), PMID:40831016.** The claim is "low serum pepsinogen I and a low PGI/II ratio"; the quote supports the **ratio** ("a reduced PGI/PGII ratio combined with elevated G-17 levels provided excellent discrimination"), not absolute PGI. Same sentence is reused for biochemical#Serum Gastrin (L393-398), where the direction (elevated G-17) matches exactly. Severity: NOTE. ACTION: reported only — direction and disease context (autoimmune gastritis in corpus AG) are both correct.

    9. **Non-evidence observations.** (a) `prevalence[0].percentage: 2.0` (L485) uses the field CLAUDE.md deprecates; the structured `measure_type` / `prevalence_class` / `rate_per_100000` fields are absent, though the snippet ("prevalence of ~2% in the general population and up to 10% in patients with other autoimmune diseases...") supports the number. (b) PMID:31864909 (thyro-entero-gastric autoimmunity, L32-33) is listed in `references:` but cited by no evidence item. Severity: NOTE. ACTION: reported only — both are outside the evidence-review fix policy.

    Confirmed correct and worth recording: all seven murine/model-system snippets in `mechanistic_hypotheses` (PMID:9272282, PMID:16237067, PMID:18641328, PMID:22777705, PMID:40471463) are graded `MODEL_ORGANISM`, which is right, and the two `PARTIAL` gradings (PMID:16237067 on thymic tolerance, PMID:22777705 on IFN-γ/IL-17 co-requirement) are used precisely to qualify the hypothesis they sit under. The ARIOSO cohort quote (n=1,598) matches its `PARTIAL` grading and its "limits the mimicry hypothesis to a subset" explanation. The GWAS snippet (PMID:34145262) names PTPN22 and the paper's other loci match the `inheritance` description (HLA-DQB1, IL2RA); the disease studied is pernicious anemia, which is the hematologic presentation of AIG, so this is not Named Entity Confusion.

    ## Sections reviewed
    pathophysiology (incl. downstream edges), phenotypes, biochemical, genetic, environmental, inheritance, prevalence, histopathology, treatments, mechanistic_hypotheses, discussions, references, datasets, classifications

    ## Verdict
    Evidence quality is good and unusually disciplined in the hypothesis layer, where model-organism work is correctly tagged and `PARTIAL` is used to record the exact ways each hypothesis is qualified. The one real defect was a garbled `reference_title` on the ARIOSO cohort, now fixed from the cache. The residual issues are calibration rather than fabrication: a handful of `SUPPORT` gradings that a case report or a review's list-of-open-issues can only carry as `PARTIAL`, two neoplasia phenotypes leaning on the review's aims sentence rather than its findings, and four human ex-vivo T-cell items graded `HUMAN_CLINICAL` where `IN_VITRO` is arguably the schema's answer.

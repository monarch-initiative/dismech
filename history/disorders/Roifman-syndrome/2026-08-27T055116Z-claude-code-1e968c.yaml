  summary: Rebuild the pathograph, remove two unsound evidence items, add 2026 findings
  details: |
    This entry had the worst pathograph in the group: four nodes, zero causal edges, no biological scales, and the causal gene not wired to any mechanism (0/5 phenotypes and 0/1 genes connected). It also carried two evidence items that do not support their claims. The Decreased NK Cell Function node cited PMID:35063500, a study of TOP2B mutations in a different syndrome, with an explanation that reasoned by analogy - 'due to the similarity in the impact on NK cells'. The Hypogammaglobulinemia node cited PMID:32017208, a general review of hypogammaglobulinemia in infancy, reasoning that Roifman syndrome is a primary immunodeficiency and those are often associated with hypogammaglobulinemia. Neither paper is about Roifman syndrome. Both were removed rather than repaired. The pathophysiology was rebuilt as a six-node chain grounded in the actual Roifman literature: the genotype rule from the 2026 reevaluation (PMID:41808109), minor-intron splicing failure, the MAPK1/BAFF transitional B-cell arrest measured in patients (PMID:29391254), the megakaryocyte differentiation defect from the same study, and secondary ciliary dysfunction with the 86-gene enrichment figure (PMID:36802443). Added from 2026: autoimmunity and immune dysregulation with the HLA-DR/PD-1 T-cell signature, renal disease, and infancy-onset autoimmune diabetes (PMID:41864208), none of which the older picture of a pure antibody deficiency would predict. Also added thrombocytopenia and spondyloepiphyseal dysplasia, which the entry lacked despite both being in the defining description. Result: 10/10 phenotypes and 1/1 genes connected; 46/46 snippets verified.

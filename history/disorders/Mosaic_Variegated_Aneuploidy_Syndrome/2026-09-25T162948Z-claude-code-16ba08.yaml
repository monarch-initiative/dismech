  summary: 'Genetics pass (series-045): Mosaic_Variegated_Aneuploidy_Syndrome'
  details: |
    Genetics pass for the series-045 gap list (issue #12252). Enumerated the seven hierarchical descendants of MONDO:0000141 in OLS4 and found that the gap list omitted mosaic variegated aneuploidy syndrome 4 (MONDO:0859329), which carries no causal-gene edge in MONDO or Monarch; CENATAC was identified instead from the OMIM 620153 / MedGen C5774267 record and the ClinVar submissions against that concept, then confirmed against the gene-discovery report. Added four genetic records (CENATAC hgnc:30460, MAD1L1 hgnc:6762, SLF2 hgnc:17814, SMC5 hgnc:20465), bound subtype_term MONDO ids to the three pre-existing has_subtypes rows, and added four new rows for MVA4, Atelis syndrome 1, Atelis syndrome 2 and MVA7. Wired all four genes into the pathograph: MAD1L1 onto the existing checkpoint-disruption and spindle-assembly-checkpoint nodes with its own functional evidence, plus three new nodes (minor spliceosome AT-AC intron splicing failure for CENATAC, SMC5/6 genome stability pathway failure for SLF2 and SMC5, and aneuploidy-associated systemic inflammation for the MVA7 phenotype). Recorded in the entry notes that OMIM titles Atelis syndrome 1 and 2 as MVA5 and MVA6 while MONDO carries no such synonym, so a synonym-inclusive MONDO search returns only members 1-4 and 7.

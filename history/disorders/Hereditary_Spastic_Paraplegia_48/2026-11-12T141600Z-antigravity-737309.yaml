  details: |
    Replaced GO:0035615 (clathrin-cargo adaptor activity) with GO:0140312 (cargo adaptor activity) on AP5Z1/AP-5 Complex Deficiency; split Impaired Autophagic Lysosome Reformation (PMID:30930081) out as a separate cellular node while preserving Aberrant Endolysosome Accumulation (PMID:26085577); split Corticospinal Axon Degeneration into corticospinal-tract axonopathy and Cortical and Subcortical Neurodegeneration; added Cerebral white matter hyperintensities, Ataxia, Dystonia, Pigmentary retinopathy, Cataract, and Hearing impairment phenotypes from Jin et al. 2023 (PMID:37077568) with notes explaining unwired ocular/auditory mechanisms; replaced SPG7 PMID:9635427 on Upper motor neuron involvement with SPG48-specific PMID:37077568; added multi-decade onset progression record; bound baclofen/tizanidine to NCIT:C15986 (Pharmacotherapy) and Physical Therapy to NCIT:C15302 with indirect HSP review evidence (PMID:30723448); and added Ap5z1 knockout mouse animal_models record (PMID:30930081).

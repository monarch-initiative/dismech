  summary: Bind post-exercise lactate to the ischemic forearm test; record that no
    ammonia challenge code exists
  details: |
    LOINC Diagnostics tranche G, batch 27 (functional and provocative tests with diagnostic thresholds). Two sources, each answering a different question and named as such in every finding: the pinned Tuva LOINC 2.83 export recorded in data/loinc/MANIFEST.yaml, sha256 verified against the pin, for observation and panel codes; and the Monarch KG for Part codes, because that export carries no LP or LG rows at all. Every KG query was paginated to its stated total. New cache/loinc/terms.csv rows were seeded by the term validator against the KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the six changed files reported 435 snippets and 466 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments and check-case-collisions all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound LOINC:59849-0 (serum or plasma lactate post exercise) to the ischemic forearm exercise test row. Only the lactate limb of this test is codeable and the limb that carries the diagnosis is not: no ammonia code in LOINC 2.83 is qualified by any challenge, and the KG's 38 ammonia records, paginated in full, include four Parts, all unqualified components. So the flat ammonia rise that identifies this deficiency has nothing to bind to while the normal lactate rise it is read against does, and that asymmetry is recorded on the row rather than papered over. Two near misses were avoided: the release's only pre-exercise lactate code is for D-lactate, a different enantiomer measured for unrelated reasons, and the KG carries a D-Lactate Part next to the plain one, so neither is a baseline for this test. No reference range was added; the row reports the pattern in words and states no concentration.

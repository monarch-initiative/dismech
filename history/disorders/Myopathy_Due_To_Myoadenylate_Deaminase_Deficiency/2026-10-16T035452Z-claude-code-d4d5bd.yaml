  details: |
    De-novo curation of AMPD1 (myoadenylate deaminase) deficiency myopathy (MONDO:0014220 / OMIM:615511). The claude_code deep-research run did not yield a committed report in this environment (nested-run output repeatedly filled the small shared tmpfs; disk was near-full across parallel worktrees), so curation was done from direct NCBI E-utilities literature work and every claim cached with just fetch-reference. Backbone PMIDs: 1631143 (Morisaki 1992 PNAS, molecular basis / common c.34C>T nonsense allele / no immunoreactive peptide / allele frequencies), 9211191 (Gross 1997, exercise-induced metabolic myopathy symptom complex and asymptomatic-homozygote discordance), 1529104 (Van den Berghe 1992, purine nucleotide cycle biochemistry and exercise role), 36107988 (Hafen 2022, mouse AMPD1-knockdown model: AMP accumulation and AMPK responses), 8032342 (Gross 1994, double-mutation allele C34T+C143T), 644316 (Fishbein 1978, original description), 10495640 (Riggs 1999, forearm test specificity), 15378456 (Pantoja 2004, flat ammonia/normal lactate forearm test, homozygous Q12X), 8335021 (Baumeister 1993, severe rhabdomyolysis, recessive inheritance). Validated: just validate (schema+terms+references) 41/41 snippets 41/41 titles 0 issues; entity-refs, causal-targets, qualifier-terms, duplicate-keys, block-scalar-comments, enum-values all OK; list-disconnected-phenotypes 9/9 phenotypes causally connected; no GeneReviews chapter (offline bookshelf index). No ClinGen/Orphanet record cached so gene_disease_validity omitted.

  details: |
    New entry for Chilton-Okur-Chung neurodevelopmental syndrome (MONDO:0859239, CDC42BPB), from claim issue #14586. Deep research: falcon was requested and failed with a 403 credential error; the run fell back to openscientist, whose report was about Okur-Chung neurodevelopmental syndrome (CSNK2A1, MONDO:0014893), never naming CDC42BPB, despite 15/15 references resolving. just preflight-dr returned FAIL with that rival disease, so the report was discarded, not committed, and the reference-cache files it had rewritten were reverted. A second run with claude_code (committed) passed preflight-dr (WARN only for CDC42, the upstream GTPase of MRCKbeta, which belongs to this disease). Evidence comes from the founding series (PMID:32031333), a review of MRCK kinases (PMID:24553779), a neuronal MRCKbeta study (PMID:33933448), an atypical cerebral palsy cohort (PMID:40243517) and the Cdc42bpb mouse study (PMID:42873655). The 2026 BMC Med Genomics cohort (DOI:10.1186/s12920-026-02448-w) had no PubMed record and no retrievable abstract or full text, so its phenotype frequencies are not cited; the entry notes record this. The brain chain past the variant rests on normal-function studies and is tagged as an EMERGING hypothesis; the missense mechanism and the heterozygous mouse phenotype are recorded as discussions. A fresh-context review subagent raised eight findings; all were applied (snippet replacements, hypothesis group, associative edge descriptions, reframed mouse discussion with a proposed experiment, quote_role/evidence_source fix, notes wording). Validated with just validate, count-verified-snippets (25/25), validate-disorders, and the offline gates.

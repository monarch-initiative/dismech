  summary: Correct the review_notes claim that curated_in would make the ASD7 pointer
    machine-readable
  details: |
    Prose-only correction to one paragraph of review_notes. The entry as merged in PR #16854 said that making the ASD7 cross-reference machine-readable 'would mean adding curated_in to its ASD7 row'. That sentence was written without checking the slot's semantics, and it is wrong about the mechanism. curated_in marks a stratum promoted to its own entry, where the entry is the stratum, its mechanism, phenotype and treatment content lives there in full, and a consumer counting diseases skips the pointer row. Neither condition holds for ASD7: this entry is broader than that stratum, covering four further structural lesions plus the conduction and myopathic arms, and the ASD7 row in Atrial_Septal_Defect.yaml keeps its own description and evidence for the atrial-septal component, which nothing else curates in full. The terms disagree accordingly, MONDO:0007173 for the ASD7 stratum against MONDO:0800441 for this entry. This was established empirically rather than argued: the slot was filled in on a throwaway branch off origin/main and just check-granularity reported DANGLING_POINTER=1, a deterministic class that exits 1 under --strict, because the entry was not yet on main; with both files present it reported POINTER_TERM_MISMATCH=1 and reclassified the ASD7 row as POINTER. That branch and its worktree were deleted and never pushed. The paragraph now records that curated_in is not the right mechanism and why, so the next curator does not repeat the attempt, and states that the cross-reference stays prose on both sides. It deliberately does not say that the slot was tried and dropped: a reviewer on this PR pointed out that such a clause describes the work session rather than the disease entry, which is what CLAUDE.md asks to keep out of review_notes, so that provenance lives here in this record instead. Atrial_Septal_Defect.yaml is deliberately not touched. A round-1 reviewer on PR #16854 had endorsed the original suggestion and placed it in a follow-up, so the mistaken proposal survived one review; it was caught only by running the check before opening the follow-up PR. Validation: just validate passes; just count-verified-snippets reports 67/67; just check-granularity reports zero DANGLING_POINTER and zero POINTER_TERM_MISMATCH; check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-entity-refs, check-retired-support-prose and check-folded-yaml all pass.

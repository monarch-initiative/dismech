  summary: 'Create: NKX2-5-Related Congenital, Conduction and Myopathic Heart Disease'
  details: |
    Created the entry for MONDO:0800441 from the local reference cache and the cached ClinGen gene-validity record, pending deep research (see below). Pathophysiology is modelled as one chain from NKX2-5 haploinsufficiency through an impaired cardiac transcriptional program, which then branches into the three arms the disease is named for: septum morphogenesis, conduction-system hypoplasia, and trabecular compaction. All 12 phenotypes are causally wired. Sources: PMID:9651244 (Schott 1998, the defining linkage study), PMID:20932824 (the family with ASD, AV block, noncompaction, syncope and sudden death), PMID:29979676 plus its dataset geo:GSE113251 (trabecular-restricted Nkx2-5 deletion in mouse, the myopathic and Purkinje-hypoplasia arm), PMID:22534315 (Nkx2-5 heterozygous knockout septal defects), and CGGV:assertion_c429ebe5-43ec-40e7-9d73-55bbbb44f6d1-2024-11-07T170000.000Z. The lump/split decision is ClinGen's, not this session's: its evidence summary records that the Hereditary Cardiovascular Disease GCEP applied the ClinGen Lumping and Splitting Working Group criteria to ASD7, variable conotruncal malformations, hypoplastic left heart syndrome 2, tetralogy of Fallot and ventricular septal defect 3 and found no difference in molecular mechanism or inheritance, so this entry covers all five as alternative structural outcomes rather than as subtypes. Deep research: the requested provider, falcon, could not be used. EDISON_API_KEY is present but Edison authentication failed, and --fallback could not cover it because Edison raises a bare Exception and deep-research-client's is_fallback_worthy returns False for unrecognised exception types, so no fallback provider was reachable through that path. openscientist and claude_code were therefore run explicitly, each under its own provider name so attribution stays correct; they were still running when this record was written. GeneReviews: just check-genereviews --online returned NO_CHAPTER on both the GeneReviews and StatPearls lines, from the disease side and the NKX2-5 gene side with four synonyms present, but NCBI esearch returned HTTP 500 (Cannot connect to SOLR) for the whole session, so only the committed Bookshelf index snapshot of 2026-09-10 backs that statement; the entry notes say so. Two identifiers written from memory were caught and corrected before commit: PMID:9535663, recalled for Schott 1998, is an unrelated DNA-repair paper (correct identifier PMID:9651244), and NCIT:C62011, recalled as Pacemaker, is Bupivacaine; just check-qualifier-terms-online caught the second, which linkml-term-validator cannot see. The CGGV cache file was first built against an unpinned ClinGen export this session had just downloaded, then rebuilt from the committed cache/clingen/gene_validity.csv so its source_snapshot is reproducible on a fresh checkout. Validation: just validate passes (schema, terms, references); just count-verified-snippets reports 37/37; just verify-datasets resolves geo:GSE113251; just check-qualifier-terms-online, check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-block-scalar-comments, check-coarse-phenotypes, check-logical-rules, check-delivery-system, check-name-collisions, check-shared-disease-terms, check-cache-order, check-term-cache-integrity and check-reference-titles all pass; compliance 82.6%.

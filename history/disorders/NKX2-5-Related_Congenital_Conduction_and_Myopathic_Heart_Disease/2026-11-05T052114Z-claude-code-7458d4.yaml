  summary: Integrate deep research and red-team review findings
  details: |
    Second pass on the entry created earlier in the same session, integrating two deep-research reports and a red-team self-review run in a fresh-context subagent before any PR existed. Deep research: falcon was the requested provider and could not be used (Edison authentication failed, and --fallback cannot cover it because Edison raises a bare Exception and deep-research-client's is_fallback_worthy returns False for unrecognised types). openscientist and claude_code were run explicitly instead, each under its own provider name. Both reports were read for their reference_validation and term_validation blocks before use: claude_code reported needs_review true for one unsupported quote attributed to PMC:PMC4773750, which was therefore not used, and two mislabelled CURIEs, which were not copied; openscientist reported 5/5 references verified and 15/15 quotes valid. just preflight-dr was run on both. Both raised a second-gene WARN that was read and dismissed on inspection: SCD in the claude_code report is the abbreviation for sudden cardiac death, not the stearoyl-CoA desaturase gene, and BMP10 in the openscientist report is a downstream NKX2-5 target rather than a second disease entity. openscientist supplied PMID:15085192 and PMID:15109497, which the claude_code report wanted but had no identifiers for. Mechanism added from them: a Postnatal Conduction Cell Dropout node, which is the step that makes the block progressive rather than fixed, and an Ectopic Ventricular BMP10 Expression node with a necessity-and-sufficiency edge into the compaction node. The conduction-hypoplasia node's evidence was upgraded from a BACKGROUND restatement to Jay's primary dose-response result. Review findings acted on: the non-septal structural lesions (conotruncal defect, tetralogy of Fallot, double outlet right ventricle, Ebstein anomaly, tricuspid abnormality, hypoplastic left ventricle) were mis-parented under a cardiac-septum-morphogenesis node, which asserted a developmental claim no source makes and which the previous pass had made worse by adding three more such edges; they now hang off a new Defective Outflow Tract and Valve Morphogenesis node bound to GO:0003151. GO:0048738 cardiac muscle tissue development was an off-claim binding on a transcriptional node and is now GO:0006357 regulation of transcription by RNA polymerase II with modifier DECREASED. review_notes named the wrong ClinGen panel: the Congenital Heart Disease GCEP made the classification and the lumping call, and the Hereditary Cardiovascular Disease GCEP only later updated the summary text. Two snippets that were aim or methods statements rather than findings were replaced or had quote_role removed. An edge description naming reduced dose and reduced DNA binding was widened to match its quote, which describes failed nuclear import. An explanation asserting serial electrocardiography, a method the quoted sentence does not report, was corrected. Two notes paragraphs were rewritten: one duplicated the history record's own session log verbatim and is now one durable sentence, and one asserted that the GeneReviews Dilated Cardiomyopathy Overview names NKX2-5 among its gene tables, which nothing in this repository can check because the cached chapter body contains no such text; that sentence was deleted rather than left unverifiable. Content added: human primary sources for phenotypes that previously rested on ClinGen synthesis or a single family (PMID:10587520 for the outflow-tract, tricuspid and double-outlet lesions and for postnatal onset of block; PMID:26679770 for the 74 percent septal-defect-with-conduction figure and the 15 percent and 8 percent sudden-death figures, which is the first frequency evidence in the entry; PMID:27855642 for dilated cardiomyopathy with segregation; PMID:34277740 for the OCCASIONAL band on the overlapping phenotype), a three-phase progression block, an implantable-cardioverter-defibrillator treatment carrying ClinGen-independent evidence and recorded explicitly as a review proposal rather than a guideline recommendation, a maternal-age environmental modifier from PMID:22534315 whose exposure_term is deliberately left unbound with the ECTO search recorded, and a second modeled_mechanisms link on the Cx40-creERT2 mouse so its Purkinje readout attaches to the node it measures. The pacing treatment's claim to address sudden-death risk was narrowed to the bradyarrhythmic mode. A paragraph was added reconciling this entry against the four other entries carrying NKX2-5 content, and recording why no OMIM or MONDO mappings are claimed for the five lumped entities: four of the five map only to generic phenotype classes that other entries anchor, so narrowMatch would falsely assert that all tetralogy of Fallot or all left-heart hypoplasia is narrower than this disease, and the one gene-defined class MONDO:0013752 is already mapped from Hypoplastic_Left_Heart_Syndrome. A third CURIE written from memory was caught: NCIT:C50244, recalled as Implantable Defibrillator, is Control Valve Device; the bound terms are now NCIT:C80435 and NCIT:C93238, both read from OLS. A cached-replay duplicate of the claude_code report (cached true, 0.01 s, same session_id) was deleted rather than committed. Reference-cache churn from validator re-fetches was reverted twice, once after a re-fetch shrank PMID:20932824 from 46 lines to 10. Validation: just validate passes; just count-verified-snippets reports 66/66; 16 of 16 phenotypes causally connected; compliance 84.4 percent over 186 scored slots; just model-scale-audit reports both model links scale-aligned; check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-block-scalar-comments, check-coarse-phenotypes, check-logical-rules, check-qualifier-terms (and --online), check-delivery-system and check-environmental-evidence all pass. GeneReviews remains NO_CHAPTER; NCBI esearch was intermittently returning HTTP 500 throughout, so the offline Bookshelf snapshot is still the whole of the evidence for that.

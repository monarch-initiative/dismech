  summary: Review and enrich Paroxysmal Familial Ventricular Fibrillation channelopathy
    cascade, diagnosis, and 2023 DPP6 cohort
  details: |
    Removed session/issue process narration from notes, added MONDO exact synonyms, CARDIOVASCULAR and GENETICS_ENVIRONMENT_DISEASE classifications plus evidence on cardiac channelopathy, and Autosomal dominant inheritance (HP:0000006). Replaced AIMS abstract quotes in PMID:31114860 with RESULTS/CONCLUSION quotes and tagged background citations. Enriched five pathophysiology nodes (preserving protected node Ventricular Fibrillation) with biological_scale, UBERON locations, GO:0099106 ion channel regulator activity, cardiac_ion_channel_repolarization conformance, and evidence-backed downstream edges wiring all five phenotypes including Premature ventricular contraction (HP:0006682) and Syncope (HP:0001279) supported by the 2023 Dutch DPP6 cohort update (PMID:37498467). Added three NCIT diagnostic procedures and therapeutic_modality plus target_mechanisms evidence across all three treatments.

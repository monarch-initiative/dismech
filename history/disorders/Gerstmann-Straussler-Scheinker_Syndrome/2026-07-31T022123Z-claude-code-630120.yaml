  summary: 'Fix: replace refuted native-state-destabilization model with observed
    conversion framing'
  details: |
    Issue #7256 (raised during review of PR #7134): the "Destabilization of the
    PrP-C Native Fold" pathophysiology node asserted a native-state
    thermodynamic/kinetic destabilization mechanism that is directly contradicted
    for the exact GSS variant it purports to explain (P102L) and carried no
    evidence at all.

    Verified: PMID:9813003 (Swietnicki et al.) assayed recombinant human
    PrP(90-231) carrying P102L directly and found its stability indistinguishable
    from wild-type ("The stability properties of the P102L variant were
    indistinguishable from those of wild-type PrP"); PMID:10079068 (Liemann &
    Glockshuber) independently measured all eight C-terminal familial
    substitutions and found stability does not correlate with disease phenotype.
    Both PMIDs were freshly fetched into references_cache/ for this fix (they
    exist on the still-open PR #7134 branch but not yet on main).

    Changes to kb/disorders/Gerstmann-Straussler-Scheinker_Syndrome.yaml, mirroring
    PR #7134's treatment of the analogous Fatal_Familial_Insomnia.yaml node:
    - Renamed "Destabilization of the PrP-C Native Fold" to "Acquisition of a
      Conversion-Competent PrP-C Conformer" and rewrote its description to the
      observed property (P102L recovered soluble, WT-like fold/stability) rather
      than the refuted destabilization mechanism; preserved the A117V
      transmembrane-topogenesis alternative.
    - Added a curation `notes` block on the node explaining what it does NOT
      claim and why, citing both refuting PMIDs plus Wildegger et al. (Nat Struct
      Biol 1999, fast folding without a detectable intermediate) as prose context.
    - Added SUPPORT evidence to the node (PMID:9813003, the soluble/WT-like
      secondary-structure observation) and removed the unsupported
      `GO:0050821 protein stabilization DECREASED` claim from the upstream
      "PRNP Germline Missense Variant" node, since it encoded the same refuted
      assumption and carried no evidence.
    - Changed `GO:0043335 protein unfolding INCREASED` to
      `GO:0006457 protein folding ABNORMAL` on the renamed node - GO:0043335 is
      defined as a chaperone/disaggregase activity, the wrong term regardless of
      the claim.
    - Added a disease-level `mechanistic_hypotheses` entry
      (`hypothesis_group_id: native_state_destabilization`, `status: DEPRECATED`)
      carrying both REFUTE evidence items, per the `Alpha-gal_Syndrome.yaml`
      worked pattern, so the refuted framing is not reintroduced.
    - Updated the one `downstream.target` reference and the one
      `discussions[].attaches_to` reference that pointed at the old node name.

    Validated: `just validate`, `just validate-references`, `just validate-terms`,
    `just check-reference-cache-frontmatter`, and
    `uv run pytest tests/test_data.py -k Gerstmann` all pass. Deliberately did not
    touch PMID:10360358 (Wildegger, kinetic-folding argument) as a formal
    `evidence:` item - it's cited as prose context in `notes`, mirroring exactly
    how PR #7134 treated the same paper for FFI.

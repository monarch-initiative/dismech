  summary: 'Create: Gerstmann-Straussler-Scheinker Syndrome (PRNP genetic prion disease)'
  details: |
    De-novo curation of GSS (MONDO:0007656, PRNP). Deep research via claude_code (full report). Unbundled 9-node pathophysiology (PRNP variant -> PrP-C destabilization -> template-directed PrP-Sc conversion -> GSS-specific 8/21 kDa fragments -> multicentric amyloid vs spongiform arms -> synaptic dysfunction/neuronal death -> neuroinflammation + regional loss; parallel variant-restricted tau node). Four clinical-cluster subtypes (Tesar 2019). Evidence anchored on verified abstracts (Hsiao 1989, Parchi 1998 fragments, Rudge 2019 spinal cord, Minikel 2016 penetrance/PrP-lowering safety, Mead 2022 PRN100, base-editing 2025). GeneReviews (Genetic Prion Disease, PMID:20301407) tagged. Active ASO trial NCT06153966. KNOWLEDGE_GAP (penetrance/modifiers) + EMERGING_HYPOTHESIS (PrP-lowering) discussions. Validated schema+terms; all 18 snippets verified as exact substrings.

  summary: Address review feedback on GSS destabilization-model fix
  details: |
    Follow-up to the initial fix addressing the PR #7259 review. Rewrote the disease-level description, which still asserted the deprecated native-state-destabilization/barrier-lowering model even though the entry's own mechanistic_hypotheses record marks that model DEPRECATED for P102L - this was the review's one blocking item. Swapped the pathophysiology-node evidence snippet for one that names the P102L variant directly (PMID:9813003) instead of an ambiguous 'the two soluble variants' phrase. Added a guard clause to the DEPRECATED hypothesis notes clarifying that Liemann and Glockshuber (PMID:10079068) found stability does not correlate with phenotype, not that no PRNP substitution is thermodynamically destabilized - five of eight tested substitutions, none of them P102L, are destabilized - preventing the DEPRECATED status from being misread as covering all familial PRNP variants. Added biological_scale MOLECULAR to the PRNP Germline Missense Variant node. Left the discussions-block restructuring suggestion unaddressed as non-blocking polish; the open question is already captured in node notes and an existing KNOWLEDGE_GAP discussion. Verified via just validate, just count-verified-snippets (31/31), and pytest -k Gerstmann (11 passed).

  summary: Review and enrich Gerstmann-Straussler-Scheinker Syndrome
  details: |
    Added MONDO exact synonym and classifications (NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE, amyloidopathy, proteotoxic disease with HUMAN_CLINICAL background evidence); completed truncated snippets across subtypes, pathophysiology, histopathology, treatments, and discussions; added PMID:9653185 21-kDa fragment evidence to CJD-like GSS; grounded PRNP Germline Missense Variant with hgnc:9449, GO:0042802 molecular_functions, and GERMLINE HETEROZYGOUS GAIN_OF_FUNCTION genetic_context; removed revision narration from Acquisition of a Conversion-Competent PrP-C Conformer notes; added human postmortem neuropathology and microglial/astrocytic activation evidence (PMID:39376689, PMID:27617269, PMID:36331509) on Synaptic Dysfunction and Neuronal Death, Neuroinflammation, and Gliosis; replaced indirect pyramidal-tract evidence on Hyperreflexia with direct human clinical evidence (PMID:20154442, PMID:9786248); rebound Progressive cerebellar ataxia to HP:0002073, added Lower limb muscle weakness (HP:0007340) and Dysesthesia (HP:0012534), broadened Myoclonus with disease-level Orphanet frequency/evidence, added Orphanet frequencies across phenotypes, and wired all 18 phenotypes to upstream mechanisms; added rate_denominator on annual incidence, NCIT diagnosis_term on early neurophysiological biomarkers, and therapeutic_modality and target_mechanisms on treatments.

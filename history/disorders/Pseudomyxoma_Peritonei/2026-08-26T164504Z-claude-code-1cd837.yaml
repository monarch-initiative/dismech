  summary: 'Create: Pseudomyxoma Peritonei'
  details: |
    New entry for pseudomyxoma peritonei (MONDO:0017048), a non-Mendelian neoplastic entity. Seven pathophysiology nodes trace the mechanism from somatic KRAS and GNAS driver mutations through constitutive Ras-MAPK and Gs-cAMP signalling to MUC2 hypersecretion, appendiceal distension and perforation, peritoneal redistribution and implantation, progressive intraperitoneal mucin accumulation with sclerosis, and mechanical visceral compromise. KRAS, GNAS and TP53 are curated as SOMATIC_DRIVER genetic entries. Treatments bind the specific NCIT terms for cytoreductive surgery (NCIT:C132068) and hyperthermic intraperitoneal chemotherapy (NCIT:C91835) rather than a generic surgical action term. Validated with just validate (33/33 snippets), term validation, and the offline duplicate-key, entity-ref, folded-hyphen and snippet-length gates.

  summary: 'Address review findings: biomarkers, hypoxia loop, BRAF, models'
  details: |
    Second round on PR #9535, addressing the reviewer's IMPORTANT items. Adds a biochemical section for the serum tumour markers (CEA, CA19-9, CA125 and the combined panel), including the clinically important negative that serum CEA was normal in the aggressive nonpolarized-staining cases who died within five years. Adds an Intratumoral Hypoxia pathophysiology node with a downstream edge back to MUC2 Hypersecretion, closing the HIF-1alpha amplification loop on the entry's pivot node. Adds BRAF and SMAD4 as somatic drivers. Adds therapeutic_agent bindings (mitomycin C, oxaliplatin) to HIPEC, a PIPAC treatment curated at case-report strength, and two animal models with modeled_mechanisms plus a HUMAN_MODEL_MISMATCH discussion about the murine origin of the PDX inflammatory signal. Note: the reviewer's premise that low-grade PMP does not xenograft comes from the deep-research narrative and is contradicted by the primary source, PMID:26833741, which states that low- and high-grade PDX models were both generated; the model-fidelity discussion is therefore built on the species-of-stroma limitation the abstract actually documents. Also corrected two false-pass snippets that used 'HIF-1alpha' where the source has 'HIF-1a' with a Greek alpha - the validator normalizes the two, so they passed while not being verbatim. Snippets 33/33 -> 50/50.

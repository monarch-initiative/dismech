  summary: Add neuroblastoma as a differential diagnosis
  details: |
    Appends a Neuroblastoma row after the existing differential_diagnoses rows. The description gives why the two are confused: an abdominal neuroblastoma can be taken for Wilms tumour at presentation, which can lead to nephrectomy (Dickson 2008, PMID:18558200). Four distinguishing features, including PHOX2B immunohistochemistry (absent in Wilms tumours in Hata 2015, PMID:25822764, and Hung 2017, PMID:28640941, each with its sensitivity caveat) and imaging findings from the same review. Part of the neuroblastoma expansion series (issue 15822); the same PR gives five other paediatric tumour entries a matching Neuroblastoma row. The row binds MONDO:0005072, copied from kb/disorders/Neuroblastoma.yaml, so the rendered page links to that entry. Every distinguishing feature is a finding from a quoted sentence. No other part of the entry changes. Validation on the branch rebased onto main: the run_c4 gate set over all six entries (validate-disorders, count-verified-snippets --strict, check-snippet-grading and the whole-repo gates), check-reference-titles-present, check-cache-order, check-logical-rules and check-qualifier-terms all passed.

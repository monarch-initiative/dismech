  summary: Add CCDI pediatric oncology diagnosis group (hand-assigned)
  details: |
    Recorded classifications.ccdi_pediatric_oncology_category as Renal Tumors (caDSR CDE 16607972). Assigned by hand: the audit derives no value, because the NCIT cross-reference of MONDO:0006058 is NCIT:C3267 (Wilms Tumor), which NCIt keeps independent of site and which is therefore not under NCIT:C3150 (Kidney Neoplasm), the concept caDSR binds Renal Tumors to. Its child NCIT:C40407 (Kidney Wilms Tumor) is under NCIT:C3150, checked against OLS. The audit reports the entry as CURATED.

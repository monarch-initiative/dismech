  summary: Rule four MONDO Wilms tumor predisposition classes out of the somatic entry;
    curate REST and TRIM28 mechanisms
  details: |
    Recovered the Wilms tumour part of the genetics gap job in dismech#12259, which
    an earlier pass deferred as a lump and split question rather than subtype
    curation. Four MONDO classes were reconciled: Wilms tumor 1 (MONDO:0008679,
    WT1), Wilms tumor 5 (MONDO:0011112, POU6F2), Wilms tumor 6 (MONDO:0014779,
    REST) and Wilms tumor 7 (MONDO:0979876, TRIM28).

    Anchor decision: disease_term stays MONDO:0006058 Wilms tumor. The entry is that
    class, so this is not the over-broad anchor pattern of dismech#12184. The four
    rows reach the entry because MONDO files hereditary Wilms tumor (MONDO:0003321)
    as a child of Wilms tumor, beside kidney Wilms tumor (MONDO:0019004), and the
    seven WT1 to WT7 predisposition classes sit under it.

    Granularity ruling: all four declined as subtypes of this entry. They are
    germline predisposition conditions, which design decisions 3a keeps in their own
    Mendelian entries separate from the tumour they predispose to, and none is a
    biomarker or therapy stratum of the somatic tumour. ClinGen's Hereditary Cancer
    GCEP grades WT1 to MONDO:0008679 Definitive under an autosomal dominant model and
    states that it split that curation from the WT1 congenital malformation
    syndromes, so MONDO:0008679 is neither a subtype here nor a duplicate of the
    existing Denys-Drash, WAGR and Meacham entries. Recorded as a hereditary Wilms
    tumor differential diagnosis record bound to MONDO:0003321, plus a top level
    notes scope boundary, plus four stubs: Wilms_Tumor_1 moved from UNDECIDED to
    DISEASE, and new stubs for Wilms tumor 5, 6 and 7.

    POU6F2 (Wilms tumor 5) is dispositioned as investigated and not supported. The
    PubMed query POU6F2 AND Wilms returns four records in total, the most recent from
    2016; the ClinGen gene validity CSV downloaded 2026-09-26 has no POU6F2 row among
    3,685 assertions; and the 2020 Human Molecular Genetics review of Wilms tumour
    predisposition names WT1, the 11p15 locus, CTR9, REST and TRIM28 without POU6F2.
    The attribution traces to PMID:15459955, whose own conclusion is hedged. No
    POU6F2 mechanism was curated.

    Curated: two pathophysiology nodes, REST Repressor Inactivation and TRIM28 Tumor
    Suppressor Loss, both wired to the existing Blocked Nephron Differentiation node,
    with GO molecular function bindings taken from the sentences that state them;
    genetic records for REST and TRIM28 with case fractions; the DROSHA and DICER1
    row and the SIX1 and SIX2 row split so each gene carries its own HGNC binding and
    reaches the node it acts at; relationship_type added on CTNNB1 and TP53; five
    phenotype edges from Wilms Tumor Outgrowth; the GeneReviews Wilms Tumor
    Predisposition chapter cited and tagged.

    Measurements before and after on this file: phenotype causal inlink 0/7 to 5/7,
    gene to mechanism wiring 5/9 to 11/13. Aniridia and Hemihypertrophy are left
    unconnected on purpose: they are features of WAGR syndrome and Beckwith-Wiedemann
    syndrome, not consequences of the tumour, and wiring them would assert the
    conflation this pass declines. The two unwired genetic rows are copy number
    markers with no gene to bind.

    Validation: linkml-validate clean, term validation passed, 92/92 snippets
    verified, gene term identity 22/22 compared against HGNC with 0 findings,
    whole repo gates clean. linkml-reference-validator 0.3.0rc3.

    Reported but not changed: the entry's Hypertension description carries an
    unsourced mechanism (renin secretion or renal artery compression) that none of
    the cached references states; and MONDO:0019004 kidney Wilms tumor is the renal
    restricted class while every one of this entry's NCIT subtype mappings is a
    kidney Wilms tumor term, which is an anchor question for a maintainer rather than
    a defect this pass should settle.

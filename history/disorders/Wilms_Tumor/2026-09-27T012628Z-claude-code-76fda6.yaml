  summary: 'Review round 1: retype DROSHA as a somatic driver, restore a rewritten
    MONDO synonym in the stub'
  details: |
    Review round 1 on PR #12955. Two blocking findings, both accepted.

    DROSHA was typed relationship_type: RISK_FACTOR on the strength of the
    PMID:25018051 sentence that uses the word predisposition for Drosha, Dicer and
    Dis3L2 together. That reading is wrong for DROSHA. PMID:25670083, already cached
    and already cited elsewhere in this entry, reports DROSHA/DGCR8 microprocessor
    mutations in 18.2 per cent of blastemal cases from exome and transcriptome
    sequencing of the tumours, beside the SIX1/SIX2 hotspot that this entry types
    SOMATIC_DRIVER. The record is now SOMATIC_DRIVER, carries that sentence as its own
    evidence item, and its notes say which gene the predisposition wording applies to.
    The same sentence was added to the MicroRNA Processing Defect node, whose only
    evidence was the predisposition sentence. DICER1 stays RISK_FACTOR: germline DICER1
    is an established pleiotropic tumour predisposition with its own entry, and that is
    the relationship the DICER1 record describes.

    The Wilms_Tumor_1 stub had one of MONDO's synonyms rewritten. A blanket British to
    American spelling normalisation, applied to keep new prose consistent with the
    entry, was run over the whole stub file instead of only over prose, and changed
    "Wilms' tumour" to "Wilms' tumor" in the synonyms list, which already contained
    "Wilms' tumor" separately. That deleted a MONDO synonym and created a duplicate.
    Restored. The stub now differs from its committed version only in entry_type and
    the added notes.

    Two review suggestions taken. The lump and split prose in the hereditary Wilms
    tumour differential diagnosis notes restated what the two quoted ClinGen rows
    immediately above it already say, and was trimmed to point at them. The POU6F2
    evidence item's explanation now states its direction outright: it is cited for the
    existence of the proposal, not for its truth, with the two germline substitutions
    in two patients and the hedged conclusion named.

    Two declined. GO:0001227, DNA-binding transcription repressor activity, RNA
    polymerase II-specific, was suggested as one step more specific for the REST node.
    The node's evidence says only that the variants compromise REST transcriptional
    repression; it does not establish polymerase specificity, so the narrower term
    would assert something the cited sentence does not. GO:0001217 stands. The
    suggestion that PMID:32412586's gene list sentence be graded HUMAN_CLINICAL for
    consistency with its other two sentences was also declined: evidence_source is
    graded per sentence, that sentence states what the review covers rather than
    reporting a measurement, and one publication legitimately carries several values
    across different sentences.

    Validation after the round: linkml-validate clean, term validation passed, 94/94
    snippets verified, gene term identity 22 of 22 compared against HGNC with 0
    findings, whole repo gates clean, validate-disorders clean.

  summary: 'Wilms tumor: add the return differential row for clear cell sarcoma of
    kidney'
  details: |
    Adds one differential_diagnoses row to the Wilms tumor entry, Clear Cell Sarcoma of Kidney (MONDO:0005006). It is the return of the Wilms Tumor row that the Clear Cell Sarcoma of Kidney entry already has. Part of the neuroblastoma-related series (issue 15822). Nothing else in the entry is changed.

    The row. A description, five distinguishing features (BCOR internal tandem duplication, cyclin D1 immunostaining, BCOR immunostaining, cytokeratin immunostaining, no association with familial cancer predisposition syndromes) and 14 evidence items from nine papers. All nine were already in the reference cache, because the Clear Cell Sarcoma of Kidney entry cites them, and every quoted sentence keeps the evidence_source it has there (HUMAN_CLINICAL throughout). Two items are graded directness INDIRECT, as in that entry: the 1985 conclusion that the tumour should be identified as a non-Wilms sarcoma, which names no distinguishing feature, and the study whose 193 comparison tumours are not broken down by type in the abstract. Three items are background sentences of primary papers (quote_role BACKGROUND).

    Limits stated in the row. The duplication is absent from some clear cell sarcomas (11.8 per cent of 159 carried neither it nor the YWHAE-NUTM2 fusion). Cyclin D1 was strong and diffuse in 11 of 18 clear cell sarcomas in one series, and in 3 of 10 Wilms tumours there; the contrast holds for Wilms tumour blastema, not for its epithelial component. The cytokeratin result comes from a review of 351 cases in which stains were done on 45.

    Left out. The entry has no row for congenital mesoblastic nephroma either; none is written here, because that tumour has no entry yet. Features of clear cell sarcoma that the sources do not compare with Wilms tumour, such as age and bone metastasis, are not listed as distinguishing features.

    After review. The reviewer of the pull request suggested listing BCOR immunostaining as a distinguishing feature of its own. The result was already in a quoted sentence (PMID:34673711): strong, diffuse staining in 15 of 18 clear cell sarcomas and in 2 of 10 Wilms tumours, with no Wilms tumour positive for both BCOR and cyclin D1. It is now the third feature. No evidence item was added.

    Validation: just validate, validate-terms and validate-disorders pass; 113 of 113 snippets verify against the cached references; the whole-repo gates and the kb test lane were run locally and pass. No cache file changed.

  details: |
    Resolved the TP53 self-contradiction between genetic[6] (50-60% of diffuse anaplastic tumors) and histopathology[4] (nearly all), both citing the same source: the 50-60% figure reflected assay limitations and was replaced with the near-universal framing plus the reason earlier series underestimated it. Corrected genetic[5], whose explanation claimed the source confirmed prognostic relevance while its snippet states combined 1p/16q LOH has limited impact as a prognostic marker. Removed the ferroptosis/GPX4 claim from the DROSHA/DICER1 entry, which the cited snippet did not mention, replacing it with DIS3L2/Perlman syndrome and the let-7/LIN28 axis. Dropped hematuria and hypertension from FREQUENT to OCCASIONAL: the shared cited snippet caps the union of four presenting symptoms at 35%, which cannot yield a 30-79% band for two of them. Source: docs/reports/pediatric-cancer-claim-evidence-review-2026-07-25.md. Validated with linkml-validate, linkml-term-validator (--labels), and linkml-reference-validator; all pass. New PMIDs were cached via the reference validator, never hand-written.

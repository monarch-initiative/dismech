  summary: 'Review round 1: Autosomal Dominant Lamellar Ichthyosis'
  details: |
    Addressed the CI gene-activity-grounding failure and the optional review suggestions on PR 15737. NKPD1 has no molecular function in GO (QuickGO returned 0 molecular-function annotations for UniProt Q17RQ9), so its pathophysiology node carries a note saying so and the gene is exempted in tests/gene_activity_grounding_baseline.txt instead of being bound to an invented function. Added causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES to the profilaggrin-processing to granular-cornified-transition edge; added the Boyden 2020 IN_VITRO quote as direct evidence on the autoprocessing to filaggrin-processing edge; re-graded the PMID:16098038 immunohistochemistry quote from HUMAN_CLINICAL to IN_VITRO (ex vivo tissue sections); changed prevalence measure_type from UNKNOWN to CASES_IN_LITERATURE; added a KNOWLEDGE_GAP discussion on replication of the single-family NKPD1 association. Kept NKPD1 as CAUSATIVE, as the reviewer recommended. A forced re-fetch of PMID:32516568 still returned abstract-only, so hypohidrosis, pruritus and keratolytic treatment were not added. 58/58 snippets verified; validate, validate-terms, check-entity-refs, check-snippet-grading and the gene-activity gate pass.

  summary: 'Create: Autosomal_Dominant_Lamellar_Ichthyosis'
  details: |
    New entry for autosomal dominant lamellar ichthyosis (MONDO:0007812), the
    ASPRV1 (SASPase) disorder MONDO records as causal, curated from the stub
    queue (stubs/Ichthyosis_Lamellar_Autosomal_Dominant.yaml, deleted here).

    Scope. A second dominant locus, NKPD1, was reported in 2024 in one family
    described as autosomal dominant lamellar ichthyosis (PMID:38642798). MONDO
    has no separate term for it, so the entry carries two subtypes, ASPRV1 ADLI
    and NKPD1 ADLI, and scopes each pathophysiology node, histology finding,
    biochemical finding and genetic row to the subtype it describes.

    Mechanism. The ASPRV1 chain runs: heterozygous missense variants near the
    autocatalytic cleavage sites, aberrant SASPase autoprocessing, impaired
    profilaggrin-to-filaggrin processing, an abnormal granular-to-cornified
    transition and abnormal scale lipids, a thickened poorly hydrated stratum
    corneum, and the two phenotypes (generalized lamellar scaling and
    palmoplantar keratoderma). Three nodes conform to
    epidermal_cornification_failure. The NKPD1 chain runs through the raised
    protein-bound to omega-esterified ceramide ratio. Both phenotypes are
    causally connected. Knockout mice do not reproduce lamellar ichthyosis,
    which is recorded as a FAILS_TO_RECAPITULATE model link and a
    HUMAN_MODEL_MISMATCH discussion.

    Sources. Deep research was requested from falcon; it was not configured,
    and the run fell back to claude_code (the report records fell_back: true).
    The report's references all resolved; preflight-dr confirmed ASPRV1 as the
    report's gene and flagged NKPD1, which is a second locus of the same named
    disease rather than a different disease. Evidence comes from abstracts and
    open full texts cached with just fetch-reference, mainly Traupe 1984,
    Kolde 1985, Toribio 1986, Melnik 1989, Bernard 2005, Matsui 2006 and 2011,
    Bauer 2017 (dog), Boyden 2020, Golda 2020, Komlosi 2024, Motyan 2024
    (review) and Feng 2026. The Boyden 2020 full text is not cached, so the
    hypohidrosis, pruritus, pseudoainhum and keratolytic-response details in
    the report were left out rather than cited. Wang 2026 (PMID:42338387,
    p.Arg208Met) and Traupe 2024 (PMID:39001722) have no abstract in the cache
    and are mentioned only in notes or not at all. No treatment section was
    written because no cached source describes treatment of this disorder. No
    GeneReviews chapter exists (just check-genereviews --online).

    Validation. just validate, just validate-terms, just
    count-verified-snippets (56/56), check-causal-targets, check-entity-refs,

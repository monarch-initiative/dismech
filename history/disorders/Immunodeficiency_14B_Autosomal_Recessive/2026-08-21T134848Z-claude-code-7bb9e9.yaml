  details: |
    Addressed all four IMPORTANT findings from the ai4c-reviewer review of PR 9163, each verified against the cached reference before acting. Finding 1: added a Paradoxical T-Cell Hyperactivation node between the metabolic-reprogramming node and Loss of Immune Tolerance, replacing an unexplained INDIRECT_UNKNOWN_INTERMEDIATES jump. Confirmed the reviewer's quote by grep against references_cache/PMID_41026257.md. The node records the counterintuitive finding that losing an activating kinase produces T-cell hyperactivation, with the authors' proposed substrate-rerouting explanation (PIP2 accumulation redirected through PLC-gamma1) curated at PARTIAL because they state it as a possibility rather than a demonstration, plus the murine effector-T-cell/Treg route to colitis. Finding 2: added an animal_models section with the p110-delta kinase-dead mouse carrying a RECAPITULATES link on the tolerance node with two evidence items, replacing the unsourced Treg prose in the node description; limitations record that a kinase-dead knock-in is not the human genotype, since patients carry truncating alleles that remove the protein and also destabilise p85-alpha. Finding 3: added an Immunosuppressive and Anti-Inflammatory Therapy treatment with target_mechanisms against the tolerance node, evidenced by the index case's response to corticosteroid/cyclosporine/infliximab and by relapse on weaning, which is what makes it suppressive rather than curative. Finding 4: added a structured prevalence record (CASES_IN_LITERATURE, ULTRA_RARE) quoting the ten-patient count together with the three-concurrent-mutation confound in the same sentence, so the caveat travels with the number. Snippets rose from 30/30 to 38/38. Validated: just validate passed; just validate-terms passed; count-verified-snippets 38/38; check-duplicate-keys OK; check-title-snippets OK; check_folded_hyphens OK; check_snippet_length OK; check_environmental_evidence OK; check-cache-order OK.

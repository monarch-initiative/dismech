  summary: 'Create: Immunodeficiency 14B, Autosomal Recessive (PIK3CD loss of function)'
  details: |
    New entry for immunodeficiency 14B (MONDO:0023655, OMIM 619281), autosomal recessive biallelic loss of function in PIK3CD (hgnc:8977). Curated as its own Disease rather than a subtype of the existing Activated_PI3K-delta_Syndrome entry, which covers only the heterozygous gain-of-function subtypes APDS1 (PIK3CD) and APDS2 (PIK3R1): same gene, opposite direction of effect, different disease. Deep research: claude_code provider; the report resolved 5/5 references with confabulation_rate 0.0 but cited NO PMIDs or DOIs anywhere in its body, so it was used only for orientation and the entire reference set was assembled by direct PubMed search. Its PMC identifiers were converted via the PMC ID Converter to recover PMIDs. GeneReviews baseline checked and found ABSENT for this disease, verified by reading: the single PIK3CD GeneReviews chapter (PMID:39899769) was fetched and read, is titled Activated PI3K Delta Syndrome, defines APDS1 and APDS2 as heterozygous disorders, and contains no occurrence of recessive, biallelic or homozygous; it is a chapter about a different disease and is therefore not cited. Ten pathophysiology nodes tracing biallelic loss to two effector arms (humoral and cytotoxic) plus a tolerance arm, all converging on infection and autoimmune endpoints. HSCT curated with target_mechanisms against the tolerance node. Two discussions: HUMAN_MODEL_MISMATCH on human versus mouse B-cell class-switch recombination (raised by the cited authors themselves) and KNOWLEDGE_GAP on confounded phenotype attribution. Confounding recorded explicitly rather than smoothed over: three of about ten reported patients carry a concurrent second immune-gene mutation, and the index case was immunophenotyped after rituximab, which its own authors say makes the B-cell findings ambiguous - so the humoral phenotype is sourced to the four unconfounded prior patients and the untreated 2025 sibship instead. No frequency bands assigned. The founding clinical Letter (PMID:30040974) caches with no abstract and no retrievable full text, so it carries no evidence item and is not listed in references. Validated: just validate passed; just validate-terms passed; count-verified-snippets 30/30; check-duplicate-keys OK; check-title-snippets OK; check_folded_hyphens OK; check_snippet_length OK; check_environmental_evidence OK.

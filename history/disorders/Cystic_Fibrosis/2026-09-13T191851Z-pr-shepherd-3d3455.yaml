  details: |
    PR Shepherd round on PR #8507, which had been sitting behind main with conflicts since 2026-08-14.

    Merged origin/main into the branch (no rebase, no force-push). Six disorder files conflicted, in three patterns:

    - Four infection entries (Fibromyalgia, Myasthenia_Gravis, Sickle_Cell_Disease, Ulcerative_Colitis): this branch had rewritten notes: to record why ECTO:3000000 was chosen over the previous XCO:0000236, while main had added an evidence: block beneath the original notes: line as part of the #8296 environmental-evidence backfill. Kept both - this branch's notes text and main's evidence items. For Myasthenia_Gravis main's notes had also grown substantive content this branch's base did not have (infection as the most common identified precipitant of myasthenic crisis, and that no specific pathogen is established), so the two note texts were merged rather than one replacing the other.
    - Cystic_Fibrosis: conflict on preferred_term alone. Kept this branch's 'tobacco smoke exposure' over main's 'exposure to tobacco smoking'. The review's non-blocking item 2 objected to flattening preferred_term to be byte-identical to the ontology label, and this entry's own notes: rely on preferred_term to carry the active-and-passive scope the binding cannot.
    - Silicosis: no content on this branch's side; main had added an exposure_classifications block. Took main's version unchanged.

    The blocking review finding - that the binding rationale was not recorded in notes: - was already addressed on this branch by commit 125077ca3a on 2026-09-01, before this round.

    The silica convergence on ECTO:7000030 for Silicosis and Granulomatosis_with_Polyangiitis is already present on main, so those two files no longer differ from main and that part of the PR is superseded.

    Validation: just validate on all 7 files, just check-enum-values, just check-entity-refs, just check-duplicate-keys, just check-causal-targets, just check-qualifier-terms, just check-environmental-evidence, just check-title-snippets, just check-snippet-grading and just check-folded-hyphens all pass. just environmental-term-audit prints no conflict section, which is the outcome this PR exists to produce. Diff of the merge result against origin/main is 222 insertions and 6 deletions; every deletion is a notes: line replaced by its expanded version.

  summary: Fix evidence-claim mismatches (#13621)
  details: |
    Reviewed the Jev evidence-claim assessments for Cystic_Fibrosis (#13621). The main defect was one general pediatric review abstract (PMID:33526571, Dickinson and Collaco 2021) and two other general reviews (PMID:27053340, PMID:30986316) cited for specific claims they do not contain.

    Environmental: replaced generic evidence for S. aureus (PMID:34578208, PMID:20551409 MRSA survival), B. cepacia complex (PMID:6420530, PMID:36815622 cepacia syndrome), non-tuberculous mycobacteria (PMID:26666259 CFF/ECFS consensus), Aspergillus fumigatus (PMID:41537324), tobacco smoke (PMID:37142525, PMID:34281808) and air pollution (PMID:14718248). Descriptions trimmed where no source supported a detail (nitrogen dioxide, B. cenocepacia as a transplant contraindication, IgE mechanism of ABPA). Rewrote the organism-link descriptions that explained why the old evidence was weak.

    Mutation-class subtypes I, IV, V and VI: replaced a therapy sentence with class definitions from Veit et al. 2016 (PMID:26823392) and the genotype-pancreatic function data of Kristidis 1992 (PMID:1376016).

    Treatments: airway clearance (PMID:30676656), hypertonic saline (PMID:16421364, PMID:16421365), inhaled tobramycin (PMID:9878641), azithromycin (PMID:14519709), PERT (PMID:32761612), CFRD insulin (PMID:21115772), ursodeoxycholic acid (PMID:28891588). Insulin description now gives the guideline's reason that oral agents are not recommended.

    Phenotypes: hemoptysis and pneumothorax (US registry, PMID:16100161, PMID:16100160; pneumothorax frequency OCCASIONAL -> VERY_RARE at 3.4%), ABPA, GERD (PMID:33202431), reduced female fertility (PMID:42167573), osteoporosis (PMID:19949942; frequency FREQUENT -> OCCASIONAL at 23.5% pooled prevalence) and the CF Bone Disease node and vitamin-deficiency edge (PMID:15613415). Dropped the generic item on rectal prolapse, which keeps its Orphanet row.

    Prevalence: the African American row now cites Hamosh 1998 (PMID:9506637, 1 in 15,000). The unsourced Asian row (1 in 30,000-100,000) was replaced by Japan (PMID:9161949, about 1 in 350,000) and China (PMID:35313924, about 1 in 128,434 from carrier frequencies, measure_type UNKNOWN). Atypical CF and CRMS/CFSPID subtypes now quote defining sentences.

    Not changed: hemoptysis frequency stays FREQUENT although the cited registry measures only massive hemoptysis; the malnutrition -> bone disease edge and a number of items citing PMID:33526571 for pancreatic, malabsorption or growth claims were left for a follow-up because Jev did not rate them as mismatches and the sentence covers part of each claim. Validation: just validate, validate-terms and count-verified-snippets pass.

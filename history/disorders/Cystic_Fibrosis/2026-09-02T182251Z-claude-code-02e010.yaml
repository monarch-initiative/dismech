  summary: 'Integrate assessed OpenScientist findings: ASL acidification, macrophage
    CFTR, modifiers'
  details: |
    Integrated the RETAINED and QUALIFIED claims of the existing codex assessment of the OpenScientist report for hypothesis canonical_cftr_loss_of_function_model (kb/hypotheses/Cystic_Fibrosis/canonical_cftr_loss_of_function_model/assessments/openscientist-assessment-by-codex.yaml). No new assessment sidecar was written because one already exists. Added: (1) two evidence items on the canonical mechanistic_hypotheses entry, the newborn CF-pig bidirectional airway-surface-liquid pH perturbation (PMID:22763554) and the randomized rare-variant elexacaftor/tezacaftor/ivacaftor trial (PMID:41738096); (2) a new pathophysiology node 'Airway Surface Liquid Acidification' with an upstream edge from CFTR Dysfunction and a downstream edge to Chronic Bacterial Infection, evidenced by PMID:22763554, PMID:27114540 and PMID:38573173, whose description states explicitly that the bicarbonate dose-limiting result comes from porcine and cultured human epithelium and is not a universal bicarbonate-over-chloride hierarchy; (3) a new pathophysiology node 'Macrophage CFTR Dysfunction' with an upstream edge from CFTR Dysfunction and an INDIRECT_UNKNOWN_INTERMEDIATES edge to Chronic Bacterial Infection, evidenced by PMID:36265882, recording that the assays are ex vivo on blood-derived cells; (4) three genetic modifier entries, SLC26A9, ATP12A and SLC6A14, with relationship_type MODIFIER, evidenced by PMID:30807572, restricted to the meconium ileus and lung-severity traits actually reported, with PRSS1 omitted because that locus was only suggestive, and with no HGNC binding because those identifiers are absent from the repository term caches; (5) three evidence items on the elexacaftor/tezacaftor/ivacaftor treatment entry covering registry effectiveness, its non-uniform individual response, and rare-variant theratyping (PMID:42033769, PMID:41738096); (6) a new discussions block with two KNOWLEDGE_GAP entries and proposed experiments, one on the mechanism of residual airway inflammation after highly effective modulator therapy (PMID:42128740, PMID:33613309, PMID:40227282) and one on the unquantified contribution of immune-cell-autonomous CFTR dysfunction (PMID:39574739, flagged in-line as a bioRxiv preprint). Deliberately not integrated: the CFTR2 necessary-and-sufficient qualification, because the cached abstract of PMID:40265445 is a newborn-screening guideline that does not carry the variant-classification counts the assessment quotes and the existing notes plus PMID:23974870 already record the qualification; the vanzacaftor previously-untreatable-variant claim, already recorded as a lead in the hypothesis notes; the ER-stress claim, which the assessment shows concerns acquired CFTR dysfunction rather than classic cystic fibrosis; the prenatal CF-sheep result, which reports cell-abundance differences without airway physiology or infection; the non-obstructive male infertility claim, which is review-level and emerging; and the pulmonary ionocyte cell-type binding, because CL:0017000 is not present in this repository's term caches and no term is better than a wrong one.

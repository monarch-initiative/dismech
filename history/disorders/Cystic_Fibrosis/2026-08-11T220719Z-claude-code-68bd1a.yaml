  summary: Link four airway pathogens; repair six overclaiming evidence explanations
  details: |
    Backfill for issue #8085. Four of the seven exposures are linked and three deliberately are not, and the reason in every case is what the cited sentence actually contains. The chronic bacterial infection node names Staphylococcus aureus, Pseudomonas aeruginosa, Burkholderia cepacia complex and non-tuberculous mycobacteria in its own text, so all four organism links are TRIGGERS with DIRECT on the node's wording. Only the Pseudomonas link has a sentence that names its own organism: PMID:22711878, already cached in this entry, states that chronic lung infection is characteristic and names this species as one of the most prevalent contributors to shortened life expectancy. The other three carry the entry's general clinical-characteristics sentence at PARTIAL, and each link description says plainly that the directness rests on the node listing the pathogens rather than on the strength of any sentence. Aspergillus fumigatus was NOT linked: it is a fungus and the only infection node in this entry is bacterial, with no allergic bronchopulmonary aspergillosis or fungal node for it to reach. Tobacco smoke exposure and air pollution were NOT linked either: the only evidence attached to both is a sentence about median survival improving through newborn screening, guidelines and specialist care, which mentions neither exposure. Separately, six pre-existing evidence explanations in this entry asserted things their snippets do not contain, which is the same defect class blocked on in PRs #8168 and #8301. Examples: an explanation reading that progressive lung disease can be accelerated by virulent pathogens like Burkholderia sits above a snippet naming no organism, and one reading that evidence-based guidelines include avoidance of tobacco smoke sits above the survival sentence. All six explanations were rewritten to describe what their snippet actually says, and the two items whose snippet does not mention the exposure at all were regraded from SUPPORT to NO_EVIDENCE. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 199 of 199 verified.

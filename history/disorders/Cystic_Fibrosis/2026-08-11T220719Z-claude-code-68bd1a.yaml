  summary: Link four airway pathogens; repair six overclaiming evidence explanations
  details: |
    Backfill for issue #8085. Four of the seven exposures are linked and three deliberately are not, and the reason in every case is what the cited sentence actually contains. The chronic bacterial infection node names Staphylococcus aureus, Pseudomonas aeruginosa, Burkholderia cepacia complex and non-tuberculous mycobacteria in its own text, so all four organism links are TRIGGERS with DIRECT on the node's wording. Only the Pseudomonas link has a sentence that names its own organism. It cites PMID:42198683, fetched for this change, which states that the CFTR-driven loss of airway hydration and mucociliary clearance creates a microenvironment facilitating infection particularly with this species. An earlier version of this link cited PMID:22711878 instead; that was wrong twice over, since the sentence sat in that paper's introduction as background prose rather than as its result, and the study itself is mouse ileal explant work that the same file already tags MODEL_ORGANISM elsewhere, so tagging the new item HUMAN_CLINICAL contradicted the file. The other three carry the entry's general clinical-characteristics sentence at PARTIAL, and each link description says plainly that the directness rests on the node listing the pathogens rather than on the strength of any sentence. Aspergillus fumigatus IS linked, to the allergic bronchopulmonary aspergillosis phenotype. This corrects a claim made in the first version of this record and in the pull request, that no such target existed: the entry declares that phenotype bound to MONDO:0015243, it already sits in the pathograph via a downstream edge, and both the schema and tests/test_data.py permit an influences_mechanisms target to be a phenotype as well as a pathophysiology node. The false claim came from a tooling limitation rather than from the entry: the script used to generate these links validated targets against pathophysiology names only, so phenotype targets were invisible to it and their absence was reported as the entry's fault. The script now checks both sections. The link is the tightest organism-to-target fit in this entry, since the phenotype is defined as a hypersensitivity response to colonisation by this organism, and PMID:41537324 was fetched for it because nothing already cached here mentions Aspergillus at all. Tobacco smoke exposure and air pollution were NOT linked either: the only evidence attached to both is a sentence about median survival improving through newborn screening, guidelines and specialist care, which mentions neither exposure. Separately, six pre-existing evidence explanations in this entry asserted things their snippets do not contain, which is the same defect class blocked on in PRs #8168 and #8301. Examples: an explanation reading that progressive lung disease can be accelerated by virulent pathogens like Burkholderia sits above a snippet naming no organism, and one reading that evidence-based guidelines include avoidance of tobacco smoke sits above the survival sentence. All six explanations were rewritten to describe what their snippet actually says, and the two items whose snippet does not mention the exposure at all were regraded from SUPPORT to NO_EVIDENCE. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 199 of 199 verified.

  summary: Add mechanistic computational models for cystic fibrosis
  details: |
    Added three complementary paper-derived models spanning nasal epithelial ion transport, purinergic airway-surface-liquid homeostasis, and regional mucociliary clearance. Linked models to existing CFTR dysfunction, ENaC hyperactivity, ASL depletion, and impaired-clearance nodes with explicit fidelity and limitations; preserved the negative phase-III context for Denufosol and treated alternative delivery as an unvalidated simulation prediction. No exact deposited implementations were identified for the paper-only models. OpenScientist hypothesis exploration was attempted but could not be submitted because the service hostname did not resolve. Validated schema, terms, and all cached evidence snippets.

  summary: Add blood DNA-methylation epigenetic age acceleration marker (#12837)
  details: |
    Added a biochemical marker for blood DNA-methylation epigenetic age acceleration, triggered by preprint scan issue 12837 (PPR:PPR1322615). Primary support is the peer-reviewed 52-patient Naples cohort (PMID:40724864; Horvath Skin and Blood clock): half the cohort had accelerated epigenetic age at baseline, the ratio correlated inversely with FEV1, and it fell after one year of ETI in the accelerated half. The preprint (DNAmGrimAge2, n=8) is cited only as corroboration. One readout links the marker to Small-Airway Obstruction (CORRELATES_WITH, MONITORING). The preprint's inflammatory-marker association was not wired to Neutrophilic Airway Inflammation because it would be the sole support. Assay bound to NCIT:C63328 following design decisions section 12. Validated with just validate-disorders, count-verified-snippets (275/275), validate-terms and the whole-repo gates.

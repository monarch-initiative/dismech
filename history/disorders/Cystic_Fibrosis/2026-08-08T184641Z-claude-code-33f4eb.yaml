  summary: 'Fix: correct HP term for elevated sweat chloride'
  details: |
    Issue #7681 identified an incorrect HP term mapping: definitions[].criteria_sets[].core_clinical_characteristics annotated 'Elevated sweat chloride' with HP:0410017 (Otitis externa, an ear condition). Corrected to HP:0012236 (Elevated sweat chloride), the canonical HPO term matching the preferred_term. Note the stored label ('Abnormal sweat electrolyte concentration') did not match the stored ID either, so the YAML read plausibly to a human while the ID was wrong. The error survived prior validation because CriteriaItem.term lacks a dynamic-enum binding, so linkml-term-validator never checks it; systemic follow-up tracked in #4757. Rebuilt from main with only the intended edit, superseding PR #7687's commit, which carried ~7,600 files of unrelated references_cache/ frontmatter re-quoting and CRLF churn.

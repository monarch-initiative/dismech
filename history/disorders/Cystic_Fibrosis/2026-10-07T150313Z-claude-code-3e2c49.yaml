  summary: Bind the defining functional test and its guideline thresholds as LOINC
    measurements
  details: |
    LOINC tranche G batch 1 (issue 13650). On the existing Sweat Chloride Test diagnosis row, added the method-less sweat chloride measurement (LOINC:2077-6) and a reference range carrying the CF Foundation 2017 decision limits as three half-open bands: below 30 CF unlikely, 30 to 59 intermediate, 60 and above diagnostic (CRITICAL_HIGH, phenotype HP:0012236). Boundaries cited to the CFF 2017 nonscreened-population consensus paper (PMID:28129813, intermediate threshold lowered from 40 to 30 mmol/L), the 2025 Australasian sweat-testing guideline (PMID:40476459, 30 to 59 intermediate and 60 or more supportive, restating the international consensus) and the already-cited De Boeck review (PMID:28576637, above 60 confirms in screen-positive infants; its one-point discrepancy from the consensus 60-or-more is disclosed in notes). The CFF 2017 main guideline abstract (PMID:28129811) does not carry the numbers and is already cited on the row for the recommendation itself. Added loinc_term LOINC:2077-6 on the Sweat Chloride biochemical marker. The row's existing diagnosis_term (NCIT:C18020) was left unchanged. The IRT newborn-screening row is tranche A batch 2 (PR 13643) and was not touched; the edits here sit on different rows and markers. LOINC labels from just loinc-seed-cache. Validation as for the batch.

  summary: 'Review round 1: add Table 2 phenotypes'
  details: |
    Response to review round 1 on PR 12863. Added 11 phenotypes from Haghshenas et al. 2024 (PMID:38553851) Tables 1-2, each citing the exact table row or narrative sentence, with frequency derived from the pooled ZZ/TAZ2/ID4 counts: cardiovascular anomaly (HP:0001626, 11/42, OCCASIONAL), renal anomaly (HP:0000077, 9/40, OCCASIONAL), laryngeal anomaly (HP:0001600, 5/36, OCCASIONAL; TAZ2/ID4), hormonal anomalies (HP:0000818, 4/8 in ZZ, FREQUENT; ZZ), joint hypermobility (HP:0001382, 3/8 in ZZ; ZZ), scoliosis (HP:0002650, 8/41), inguinal hernia (HP:0000023, 6/40; TAZ2/ID4), myopia (HP:0000545, 8/40), high palate (HP:0000218, 86% ZZ, 59% ID4), upslanted palpebral fissure (HP:0000582, 71% ID4) and prominent forehead (HP:0011220, 75% ID4). The cardiovascular, renal, laryngeal and endocrine phenotypes use organ-level HPO terms with coarse_binding_basis SOURCE_UNSPECIFIED because the source does not name the individual lesions (endocrine row groups thyroid disorders, growth hormone deficiency and type II diabetes). Set intellectual disability to VERY_FREQUENT citing the Table 2 ID row (39/40), strabismus FREQUENT (24/40) and constipation FREQUENT (20/37) with their Table 2 rows. Rebound the Dysregulated Neurodevelopmental Transcriptional Program process from GO:0045944 to the parent GO:0006357 regulation of transcription by RNA polymerase II so it matches the preferred_term (the direction of the change is unknown). New phenotypes are not wired into the pathograph because no source links a mechanism to them; they fall under the existing mkhk_unexplained_phenotypes knowledge gap. All CURIEs taken from cache/hp/terms.csv, cache/go/terms.csv or runoak ols:hp. Validation: just validate passes; count-verified-snippets 118/118; validate-terms, check-entity-refs, check-coarse-phenotypes and check-snippet-grading pass; validate-disorders passes.

  details: |
    New entry for Menke-Hennekam syndrome (MONDO:0020774), recorded as entry_type DISEASE (lumped): MKHK1 (CREBBP, MONDO:0020763) and MKHK2 (EP300, MONDO:0020769) are has_subtypes, verified against the MONDO build (is_a MONDO:0020774; RO:0004003 CREBBP and EP300). The domain-based subtypes MKHK-ZZ, MKHK-TAZ2 and MKHK-ID4 from Haghshenas et al. 2024 (PMID:38553851) are added as further has_subtypes without ontology terms and used to scope subtype-specific phenotypes. Rubinstein-Taybi syndrome (kb Rubinstein-Taybi_Syndrome, MONDO:0019188) and chromosome 16p13.3 duplication syndrome are differential diagnoses. The mechanism is modeled as two EMERGING mechanistic hypotheses (altered zinc-finger-mediated protein interaction; gain of CBP/p300 HAT function) with hypothesis-grouped edges, plus an OPEN KNOWLEDGE_GAP discussion; functional_impact_category is deliberately unset. Deep research: Perplexity report (research/Menke-Hennekam_Syndrome-deep-research-perplexity.md). Its reference_validation resolved 3/3 extracted references (PMID:38553851, PMID:35626936, PMC11040166), no unresolved; most of its 19 citations are URLs (OMIM, Orphanet, MedlinePlus, Simons Searchlight, commercial clinic pages, ClinVar) and were not used. Term validation flagged 16 mislabelled and 4 obsolete CURIEs (for example NCIT:C16084 given as Supportive Care is Observational Study; GO:0006306 and GO:0016573 obsolete); no CURIE was taken from the report, all bindings were looked up in the term caches or via runoak ols/sqlite. just preflight-dr returned SKIP (MONDO records no causal gene on the grouping class); manual check against MONDO: report OMIM 618332/618333 and genes CREBBP/EP300 match the MONDO children, so identity is confirmed. Primary literature was found through PubMed E-utilities: 19 PMIDs cited (Menke 2016/2018 cohorts, Banka 2019, Haghshenas 2024, Tang 2026 episignature study, case reports, and CBP/p300 domain biochemistry). PMID:39306848 (duplicate record of the Haghshenas paper, no text) and PMID:36207857 (Chinese-language case) were fetched and not cited. check-genereviews --online: NO_CHAPTER for GeneReviews and StatPearls. Validation: just validate passes; count-verified-snippets 100/100; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms pass; list-disconnected-phenotypes 3/35 connected. A first draft wired 32/35 phenotypes through two hub nodes; those edges were removed before commit because no cited source makes the mechanism-to-phenotype claim. Removed: the whole Multisystem Developmental Dysregulation node (22 uncited phenotype edges plus its inferred incoming edge) and 7 uncited edges from Impaired Brain Development (to global developmental delay, intellectual disability, autistic behavior, self-injurious behavior, seizure, microcephaly, strabismus). Kept: Impaired Brain Development to abnormal brain morphology, ventriculomegaly and agenesis of corpus callosum, which the node's own evidence (PMID:29460469, PMID:30892814) reports as the structural anomalies. The unexplained phenotypes are recorded in a second KNOWLEDGE_GAP discussion (mkhk_unexplained_phenotypes); whole-KB snippet-length, title-snippets, snippet-grading, folded-hyphens, coarse-phenotypes and reference-titles report nothing new; validate-disorders passes (100 snippets checked, 0 issues).

  summary: Wire beta-blocker therapy to the beta-adrenergic blockade module
  details: |
    Added a therapeutic_vulnerability pathophysiology node, Beta-Adrenergic Receptor Blockade (Beta-Blocker Target), conforming to beta_adrenergic_receptor_blockade#Beta-Adrenergic Receptor Antagonist Occupancy, and gave the Beta Blockers treatment its first target_mechanisms entry. That treatment previously carried no mechanism link and no evidence at all. The node's description names both routes by which blockade lowers blood pressure in this entry's own terms: reduced cardiac output, and reduced renin release feeding Renin-Angiotensin-Aldosterone System Dysregulation. Evidence is PMID:17998992 for competitive receptor occupancy and PMID:22124804 for the dependence of renin expression and release on beta-adrenergic input, the latter graded INDIRECT because it is stated for the receptor's role rather than for its blockade. Validated with just validate-disorders (0 issues).

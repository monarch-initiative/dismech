  summary: Wire Essential_Hypertension to the AT1 receptor blockade module
  details: |
    Adds an AT1 Receptor Blockade (Angiotensin Receptor Blocker Target) pathophysiology node conforming to at1_receptor_blockade#Angiotensin II Type 1 Receptor Antagonist Occupancy, and points the existing Angiotensin Receptor Blockers treatment at it. The entry's ACE Inhibitors treatment is deliberately pointed at the existing Renin-Angiotensin-Aldosterone System Dysregulation node instead, not at the receptor node: an ACE inhibitor reduces angiotensin II generation and never occupies AT1, which is the scope line the module's own notes draw. Both treatments previously had an empty target_mechanisms, so neither reached the pathograph at all. The new node carries no downstream edge, following the treatment-anchor convention used by the beta-blockade and GLP-1 conformers.

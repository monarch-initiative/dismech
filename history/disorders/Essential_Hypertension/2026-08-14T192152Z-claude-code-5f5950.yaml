  summary: 'Fix: Rebind Alcohol Consumption exposure to ECTO:0001082'
  details: |
    Rebound the 'Alcohol Consumption' environmental entry from ECTO:9000027 (exposure to
    ethanol) to ECTO:0001082 (exposure to alcohol consumption), completing the alcohol arm of
    issue #8469.

    This entry was not in the original #8469 conflict list; it acquired its binding on main
    after that issue was filed, which is why the first pass of this pull request missed it.
    Caught by re-running the repository's own audit against a simulated merge with current
    main rather than against the pull request branch alone.

    The entry's whole claim is 'Excessive intake raises blood pressure' -- a statement about
    drinking quantity as a behaviour, with no ethanol or acetaldehyde chemistry curated. The
    behaviour term is therefore correct. ECTO:0001082 involves NCIT:C16273 (Alcohol
    Consumption); ECTO:9000027 involves CHEBI:16236 (ethanol).

    No evidence items were added, removed, or re-quoted; this entry carries none.

  summary: Link sodium and obesity to the immune activation node
  details: |
    Backfill for issue #8085. Both exposures point at immune and inflammatory activation rather than at vascular resistance, because that is where the cited sentences land. High sodium diet is TRIGGERS with DIRECT: one sentence names a high-salt environment alongside neoantigens, the NLRP3 inflammasome, sympathetic outflow and several cytokines as contributors to immune activation in this disease, which is the node's own content. Its second item is carried because it limits the first, associating high salt with dysbiosis, inflammation and oxidative stress while stating outright that the mechanistic contribution to salt sensitivity of blood pressure is not clearly understood, so the route beyond this node stays open. Obesity is graded below it at PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES, and the difference is in the sentences rather than in the biology: its only sentence says these mechanisms link the disease with obesity, autoimmunity, periodontitis and COVID-19, which asserts a connection without a direction or a route. On evidence_source: the generator's target-node cross-check flagged that these references are tagged OTHER on the new links and untagged on the nodes. Only 8 of 43 evidence items in this file carry the field at all, so retagging to match would mean imposing a convention on 35 pre-existing items in a link backfill; the new items are tagged explicitly instead, which is strictly better than defaulting, and the file-wide question belongs to issue #8184. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 39 of 39 verified.

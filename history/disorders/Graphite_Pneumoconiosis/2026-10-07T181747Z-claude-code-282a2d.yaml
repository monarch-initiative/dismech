  summary: 'Create: Graphite Pneumoconiosis'
  details: |
    New disorder entry for graphite pneumoconiosis (MONDO:0023286), curated from a Falcon deep-research report plus six primary references fetched into references_cache. Four-node pathograph: respirable graphite dust deposition in the distal lung (ORGANISM) -> alveolar macrophage retention of graphite particles (CELLULAR) -> transient particle-driven alveolar inflammation (CELLULAR) -> mixed dust fibrotic remodeling (TISSUE), with the last edge typed INDIRECT_UNKNOWN_INTERMEDIATES because the route from acute particle-driven inflammation to established fibrosis is not demonstrated for graphite specifically. A KNOWLEDGE_GAP discussion (graphite-fibrogenicity-unestablished) records that the independent fibrogenicity of pure graphite, as against the crystalline silica that contaminates most industrial graphite, is unsettled. The exposure is bound to ECTO:7000023 exposure to mineral dust as the nearest available parent; the notes field records all eight ECTO searches run and what each returned, since no graphite-specific exposure class exists. A Fischer 344 rat model comparing graphite with silica carries two readouts including a negative result (direction UNCHANGED) and two typed divergences (PROXY_QUANTITY, BOUNDARY_OMISSION). Two prevalence records from occupational cohorts. Review round 1 on PR #13664 then addressed in the same branch: the radiographic phenotype was rebound off HP:0002113 Pulmonary infiltrates into three honest phenotypes, a reticular HRCT pattern (HP:0025390), a nodular HRCT pattern (HP:0025392) and uncharacterized cohort opacities (HP:0031457), all three wired into the pathograph; the retention node's GO:0042116 macrophage activation was replaced by GO:0006909 phagocytosis, since that node's own description and the 1-100 mg/m3 negative result say retention happens without activation; a Dyspnea phenotype (HP:0002094) was added from the index case's full text and wired downstream of the remodeling node; human autopsy fibrosis evidence was added to the Pulmonary fibrosis phenotype with the free-silica co-exposure recorded in the explanation; a diagnosis section was added for sputum cytology and mineralogical analysis of biopsy tissue, with a Coal Workers Pneumoconiosis differential and a histopathology entry for the nonasbestos ferruginous body; the dust-control treatment's evidence item was swapped from a bare caveat to the source's own tentative conclusion graded INDIRECT; GO:0009636 was dropped from the physical deposition step; and the treatment term moved from NCIT:C15900 Lifestyle Therapy to NCIT:C15843 Preventive Intervention with the has-input qualifier removed. Validated with just validate (59 snippets, 65 titles, 0 issues), term validation, and the full 23-gate CI set.

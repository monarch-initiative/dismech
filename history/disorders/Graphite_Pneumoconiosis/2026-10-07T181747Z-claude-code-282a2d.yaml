  summary: 'Create: Graphite Pneumoconiosis'
  details: |
    New disorder entry for graphite pneumoconiosis (MONDO:0005272), curated from a Falcon deep-research report plus six primary references fetched into references_cache. Four-node pathograph: respirable graphite dust deposition in the distal lung (ORGANISM) -> alveolar macrophage retention of graphite particles (CELLULAR) -> transient particle-driven alveolar inflammation (CELLULAR) -> mixed dust fibrotic remodeling (TISSUE), with the last edge typed INDIRECT_UNKNOWN_INTERMEDIATES because the route from acute particle-driven inflammation to established fibrosis is not demonstrated for graphite specifically. A KNOWLEDGE_GAP discussion (graphite-fibrogenicity-unestablished) records that the independent fibrogenicity of pure graphite, as against the crystalline silica that contaminates most industrial graphite, is unsettled. The exposure is bound to ECTO:7000023 exposure to mineral dust as the nearest available parent; the notes field records all eight ECTO searches run and what each returned, since no graphite-specific exposure class exists. A Fischer 344 rat model comparing graphite with silica carries two readouts including a negative result (direction UNCHANGED) and two typed divergences (PROXY_QUANTITY, BOUNDARY_OMISSION). Two prevalence records from occupational cohorts. Validated with just validate (47 snippets, 53 titles, 0 issues) and the full 23-gate CI set, all passing.

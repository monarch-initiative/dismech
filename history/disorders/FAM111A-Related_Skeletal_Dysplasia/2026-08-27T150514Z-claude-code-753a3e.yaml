  details: |
    Addressed the ai4c-reviewer REQUEST_CHANGES review. Added the c.1706G>A p.(Arg569His) dominant hotspot and the recessive Tyr414 alleles as structured variants with functional_effects; recorded the graded-activation account that reconciles dominant and recessive inheritance in one gene, and the first documented father-to-daughter transmission. Split the umbrella ocular phenotype into hypermetropia and cataract, replaced HP:0001743 (Abnormality of the spleen) with HP:0006270 (Hypoplastic spleen), and added carious teeth, hypocalcemic seizures, cerebral calcification, treatment-associated nephrocalcinosis and growth hormone deficiency. Added a diagnosis section from GeneReviews. Added the Fam111a knockout mouse as FAILS_TO_RECAPITULATE for both consequence nodes, with the direction-of-effect limitation stated explicitly: a null cannot model a hypermorphic allele. Validation: schema clean, 55/55 snippets verified.

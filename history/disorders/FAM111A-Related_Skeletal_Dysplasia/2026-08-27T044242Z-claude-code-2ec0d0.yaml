  summary: 'Create: FAM111A-Related Skeletal Dysplasia'
  details: |
    New entry covering two ISDS Nosology 2023 group 21 rows: NOS 21-0050 (dominant Kenny-Caffey syndrome, OMIM 127000) and NOS 21-0060 (osteocraniostenosis, OMIM 602361). Lumping decision: one entry with KCS2 and OCS as has_subtypes, following GeneReviews (PMID:37023242) and the source literature, which treat them as allelic disorders of different severity rather than two diseases. Both rows are in the same group so the classification stays single-valued. Mechanism curated as gain of function: the discovery paper (PMID:23684011) places the disease residues away from the catalytic site, and PMID:39932783 quantifies a graded series of hypermorphic alleles whose degree of activation determines dominant KCS2 vs recessive KCS2 vs OCS, which is why the entry carries two Inheritance blocks. Two naming traps are recorded in the description: Kenny-Caffey type 1 is TBCE, not FAM111A, and the OMIM numbering inverts historical usage; and osteocraniostenosis has repeatedly been confused with Hallermann-Streiff syndrome. A KNOWLEDGE_GAP records that nothing connects an over-active protease to hypoparathyroidism or cortical thickening. Validation: just validate-disorders passes, 31/31 snippets verified.

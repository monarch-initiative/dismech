  details: |
    The deep-research report for this disorder completed after the entry was first written from primary literature, and surfaced a 2023 mechanism paper the initial PubMed searches had missed: PMID:37793778, which shows FAM111A supports replication origin activation and that unrestrained expression of wild type or patient mutants causes DNA damage and cell death only when the peptidase domain is intact. Added as a new pathophysiology node between the hypermorphic-variant trigger and the two organ-level consequences, so the chain is no longer variant-to-phenotype with nothing in between. The KNOWLEDGE_GAP rationale was narrowed accordingly: it previously said everything between the variant and the clinical picture was a gap, which is now too strong. What remains open is the substrate repertoire and the tissue selectivity, and the entry cites the paper's own statement that substrates have yet to be identified. Report checks: NEC preflight PASS with FAM111A dominant at 67 mentions; reference validation 25/25 resolved, 2/2 quotes verified, 0 off topic. Validation after the edit: just validate-disorders passes, 34/34 snippets verified.

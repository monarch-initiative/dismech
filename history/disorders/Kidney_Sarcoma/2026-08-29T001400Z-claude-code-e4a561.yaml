  summary: 'Create: Kidney Sarcoma (MONDO:0002930)'
  details: |
    New root Disease entry for primary renal sarcoma, curated for issue #9604.

    Concept decision. Curated as a root Disease with histological has_subtypes rather than a kb/groupings/ union. The Grouping route was seriously considered and rejected for two reasons, recorded in the entry's first pathophysiology node. First, the subtypes do share a real anatomic-and-clinical pathograph: mesenchymal (non-epithelial) origin, silent retroperitoneal expansion to large size, renal venous and vena caval invasion with early haematogenous spread, and the absence of any epithelial target for RCC-directed systemic therapy. That chain is more specific than the generic cancer hallmarks and holds across the subtypes. Second, a Grouping's members[].member must resolve to an existing entry, and the only candidates in the KB (Leiomyosarcoma, Liposarcoma, Angiosarcoma, Synovial_Sarcoma) are pan-site histology entries whose extent is not renal; listing them would mis-state their scope. That is the point of difference from Paranasal_Sinus_Carcinoma, the compare case, which already had site-specific member entries to unite. The in-KB precedent for the shape adopted here is Sarcoma_Of_Cervix_Uteri.

    Content. Six subtypes with NCIT terms: leiomyosarcoma (commonest), liposarcoma, angiosarcoma (most lethal), synovial sarcoma, rhabdomyosarcoma, Ewing sarcoma. Six pathophysiology nodes running from mesenchymal transformation through driver divergence, silent retroperitoneal expansion, vascular invasion, absence of an epithelial therapeutic target, and the sarcomatoid-RCC differential. Driver divergence is handled in per-subtype genetic blocks (SS18/SSX1 for synovial, EWSR1/FLI1 for Ewing) rather than blended into shared nodes. Two conforms_to declarations against hallmark modules (genome_instability_mutation#Mutator Phenotype and Chromosomal Instability, invasion_and_metastasis#Local Invasion and Intravasation); the module's EMT node is explicitly NOT claimed, because these cells are mesenchymal from the outset and never undergo a phenotype switch.

    Three KNOWLEDGE_GAP discussions: the discordance between the Japanese registry's radiotherapy survival association and the standard description of radioresistance; whether the renal site has a molecular correlate (renal Ewing sarcoma's 53 percent metastasis-at-diagnosis rate against 20-25 percent for the family is the one partial answer); and the unmeasured cost of managing these under renal cancer rather than soft-tissue sarcoma guidelines.

    Prevalence records both circulating figures for the share of renal malignancy (0.25 percent from the SEER/NCDB registry, 1-3 percent from case-report literature) rather than silently picking one, and gives the registry age-adjusted incidence of 0.53 per million person-years normalised to 0.053 per 100000.

    Deep research. falcon (Edison), report at research/Kidney_Sarcoma-deep-research-falcon.md, reference_validation 5/5 verified, confabulation_rate 0.0, 3/5 assessed on topic. The report surfaced the Uhlig 2024 SEER/NCDB series (PMID:38693188) and the renal Ewing pooled analysis (PMID:32282650), both of which are now the entry's strongest epidemiology sources. The report's suggested HP:0031605 for flank pain was wrong; corrected to HP:0030157 after OAK lookup, which is why every term binding was independently verified rather than copied.

    Named Entity Confusion triage. Sarcomatoid renal cell carcinoma, Wilms tumour, clear cell sarcoma of the kidney and rhabdoid tumour of the kidney are explicitly excluded in the entry description, and the sarcomatoid-RCC differential is modeled as its own pathophysiology node because it is the default diagnosis a spindle-cell renal mass must be argued out of. One candidate reference (PMID:38642139) was discarded during screening after it proved to be about metastasising uterine leiomyoma.

    Validation. just validate passes (schema, terms, references); 42/42 snippets verified against the local cache; just check-entity-refs and just check-duplicate-keys clean; scripts/check_reference_titles.py --against-ref origin/main clean. All reference titles copied verbatim from references_cache frontmatter.

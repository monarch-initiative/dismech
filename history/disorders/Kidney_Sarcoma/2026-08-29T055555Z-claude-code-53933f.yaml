  summary: 'Review response: Kidney Sarcoma PR #9972'
  details: |
    Response to the automated review on PR #9972 (CHANGES_REQUESTED). All four blocking findings addressed, plus five of the six optional suggestions.

    Blocking finding 1 - wrong HPO term. The Tumor Hemorrhage phenotype bound HP:0001892 "Abnormal bleeding", whose HPO definition is a bleeding diathesis under Abnormality of blood and blood-forming tissues. A patient bleeding from an angiosarcoma has a normal haemostatic system, so this was a false match. Rebound to HP:0011029 "Internal hemorrhage", a direct child of the term previously used.

    Blocking finding 2 - no diagnosis section. Added a five-entry diagnosis: block covering image-guided core needle biopsy (NCIT:C15189), cytokeratin/EMA immunohistochemical exclusion of sarcomatoid renal cell carcinoma (NCIT:C23020), MDM2 FISH with CDK4 immunohistochemistry for renal liposarcoma (NCIT:C17563), SS18-SSX immunohistochemistry as a FISH surrogate for renal synovial sarcoma, and EWSR1 rearrangement confirmation for renal Ewing sarcoma. Evidence is quoted from references already cached in this PR, chiefly the full text of PMID:38693188 (the Figure 3 legend naming the cdk-4/mdm-2 panel, and the pre-treatment biopsy discussion). The Diagnosis class has no subtype slot, so the subtype is carried in the entry name instead of a foreign key.

    Blocking finding 3 - genetic entry named for three genes but binding one. Renamed "TP53, RB1 and ATRX (complex-karyotype subtypes)" to "TP53"; RB1 and ATRX already had their own entries. The complex-karyotype framing remains in notes.

    Blocking finding 4 - orphaned pathophysiology node. "Diagnostic Confusion with Sarcomatoid Renal Cell Carcinoma" had no incoming or outgoing edges. Added an incoming DIRECT edge from "Malignant Transformation of Renal Mesenchyme" (the absent epithelial differentiation programme is what a dedifferentiated carcinoma mimics, so mesenchymal origin has to be demonstrated rather than assumed) and an outgoing DIRECT edge to "Absence of Epithelial Therapeutic Target" (resolving the differential in favour of a sarcoma is what forecloses checkpoint therapy). The pathograph is now a single connected component: every node has an incoming edge except the root, and an outgoing edge except the terminal node.

    Optional suggestion 5 - added a four-entry histopathology: block (tumour necrosis, dedifferentiated liposarcoma pleomorphic spindle morphology, renal Ewing small round blue cell morphology, renal angiosarcoma atypical endothelial-lined vascular spaces), all quoted from the PMID:38693188 full text.

    Optional suggestion 6 - added therapeutic_agent bindings (doxorubicin CHEBI:28748, ifosfamide CHEBI:5864) to Adjuvant Chemotherapy, with the description expanded to name the anthracycline backbone for the complex-karyotype subtypes and VDC/IE for renal Ewing, and a new evidence item from PMID:32282650 naming the VDC/IE regimen.

    Optional suggestion 7 - added two surgical-margin evidence items to the nephrectomy treatment: R+ vs R0 HR 1.36 (95% CI 1.1-1.68, p = 0.004), and R+ in 21.3% of all resections rising to 40.6% in T4 disease.

    Optional suggestion 8 - the prevalence notes now state that 0.53 per million is the incidence of the registry's whole 43-histiotype category, not of the six subtypes modeled here, since malignant rhabdoid tumour of the kidney is one of the two commonest histiotypes in that count and is explicitly excluded from this entry. The same caveat is extended to the clear cell sarcoma survival figure quoted on the driver-divergence node.

    Optional suggestion 9 - regraded five evidence items on PMID:29660202 and PMID:30852045 from OTHER to HUMAN_CLINICAL. The reviewer is right that evidence_source classifies the evidence type reported, not the publication format, and what these two report is human tumour genomics (TCGA and whole-exome sequencing). The explanations were rewritten to say so. The PARTIAL grading and the non-renal-cohort caveats are unchanged.

    Optional suggestion 10 - prevalence population changed from "Adults, share of renal malignancy" (which folded the measure type into the population field) to "Adults, United States and international series".

    Not done, deliberately: the compliance report's remaining gaps are evidence on individual causal edges and on the four discussions. Edge-level evidence would duplicate the node-level evidence either side of each edge, and the discussions are knowledge gaps whose content is the absence of evidence. Left at 91.8% weighted compliance.

    Validation after the changes: just validate passes; 59/59 snippets verified against the local cache; just check-entity-refs and just check-duplicate-keys clean; scripts/check_reference_titles.py --against-ref origin/main clean. Branch rebased on origin/main after PRs #9954 and #9955 merged.

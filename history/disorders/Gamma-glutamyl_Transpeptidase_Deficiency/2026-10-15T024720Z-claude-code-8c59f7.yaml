  summary: 'Create: Gamma-glutamyl_Transpeptidase_Deficiency'
  details: |
    New entry for gamma-glutamyl transpeptidase deficiency (glutathionuria; MONDO:0009285; GGT1, hgnc:4250). Deep research: falcon failed with an Edison authentication error. An asta run returned only papers about other diseases and was not committed. The entry was first curated from direct PubMed searches for GGT deficiency, glutathionuria and GGT1; an openscientist report (research/Gamma-glutamyl_Transpeptidase_Deficiency-deep-research-openscientist.md; 17/17 references resolved, 17/17 quotes valid, one off-topic bacterial GGT structure paper) then completed and was cross-checked against the entry. Its clinical, genetic and mouse-model content matches the entry and its cited case and mouse papers are already used; it adds mouse reproductive and skeletal papers (PMID:11089562, PMID:12810527) that were not needed for the human entry, and its proposal that GGT-family paralogs and dietary cysteine buffer human cysteine supply is a hypothesis, recorded only as an untested explanation in the mouse-human mismatch discussion. Its HTML/PDF artifacts were not committed. Evidence rests on the 2018 GGT1-deletion family (PMID:29483667), the Wright 1980, Iida 2005 and Griffith/Meister case reports, the Mayatepek 2004 leukotriene study, the Ristoff and Larsson 2007 review, and three GGT-deficient mouse papers. Curation choices: the neurological phenotype is modelled as a node of uncertain attribution with UNKNOWN edges to the phenotypes and a KNOWLEDGE_GAP discussion, because patients were ascertained largely through intellectual disability and the review states attribution remains to be established; phenotype frequencies are omitted for the neurological features. The mouse tissue glutathione-depletion mechanism carries a REFUTE item (human cellular glutathione reported normal) and a HUMAN_MODEL_MISMATCH discussion. The older amino-acid-transport hypothesis carries a REFUTE item (normal plasma amino acids and renal reabsorption). A tall slender habitus reported in one family is recorded but left unconnected. No GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER). Two Ristoff 2007 snippets were shortened or reproduce line-break hyphenation because the committed cache is PDF-derived text. Validation: just validate, validate-terms, count-verified-snippets (51/51), check-entity-refs, check-causal-targets, check-duplicate-keys and validate-disorders all pass.

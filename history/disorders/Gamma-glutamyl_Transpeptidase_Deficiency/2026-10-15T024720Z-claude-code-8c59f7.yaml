  summary: 'Create: Gamma-glutamyl_Transpeptidase_Deficiency'
  details: |
    New entry for gamma-glutamyl transpeptidase deficiency (glutathionuria; MONDO:0009285; GGT1, hgnc:4250). Deep research: falcon failed with an Edison authentication error; an openscientist run was queued server-side and abandoned; an asta run completed but all 19 returned papers are about other diseases (metabolomics, progeria, mitochondrial disease), so it contributed no content and is committed only as the provider record. Literature was therefore gathered directly from PubMed searches for GGT deficiency, glutathionuria and GGT1. Evidence rests on the 2018 GGT1-deletion family (PMID:29483667), the Wright 1980, Iida 2005 and Griffith/Meister case reports, the Mayatepek 2004 leukotriene study, the Ristoff and Larsson 2007 review, and three GGT-deficient mouse papers. Curation choices: the neurological phenotype is modelled as a node of uncertain attribution with UNKNOWN edges to the phenotypes and a KNOWLEDGE_GAP discussion, because patients were ascertained largely through intellectual disability and the review states attribution remains to be established; phenotype frequencies are omitted for the neurological features. The mouse tissue glutathione-depletion mechanism carries a REFUTE item (human cellular glutathione reported normal) and a HUMAN_MODEL_MISMATCH discussion. The older amino-acid-transport hypothesis carries a REFUTE item (normal plasma amino acids and renal reabsorption). A tall slender habitus reported in one family is recorded but left unconnected. No GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER). Two Ristoff 2007 snippets were shortened or reproduce line-break hyphenation because the committed cache is PDF-derived text. Validation: just validate, validate-terms, count-verified-snippets (51/51), check-entity-refs, check-causal-targets, check-duplicate-keys and validate-disorders all pass.

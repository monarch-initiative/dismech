  summary: Review and enhance Pulmonary_Hemosiderosis.yaml with classifications, inheritance, biochemical biomarkers, differential diagnoses, and expanded causal and treatment target_mechanisms links.
  details: >-
    Added Harrison's chapter classifications (RESPIRATORY and IMMUNE_RHEUMATOLOGIC),
    sporadic inheritance (HP:0003745) with notes on rare familial clustering and
    Down syndrome co-occurrence, a 7-marker biochemical section (Hemoglobin, Serum Iron,
    Transferrin Saturation, Serum Ferritin, Reticulocyte Count, Serum Total Bilirubin,
    and Autoantibody Serology Panel) with LOINC/NCIT bindings and pathograph readouts,
    6 differential diagnoses (Celiac Disease / Lane-Hamilton Syndrome, Anti-Glomerular
    Basement Membrane Disease, Granulomatosis with Polyangiitis, Systemic Lupus
    Erythematosus, Nutritional Iron Deficiency Anemia, and Tuberculosis), expanded
    downstream phenotype wiring across pathophysiology nodes, and added target_mechanisms
    to all treatments.

  summary: 'Review round 1: folic acid is counterproductive not inert, OMIM/ORPHA
    identifiers, GO breadth note'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #11981, answered in one push.

    Blocking item. PMID:36341171 was fetched by this PR and cited nowhere, and the treatment description made the weaker version of the claim it supports. The description said folic acid 'is not a substitute' because it needs DHFR to be activated, which frames it as inert. The paper shows it is counterproductive: unmetabolized folic acid impairs 5-MTHF transport across the blood-CSF barrier, and stopping it normalized CSF 5-MTHF. The description now says that, and the paper is cited on the folinic acid treatment with directness INDIRECT. The INDIRECT grade is load-bearing rather than decorative: the two measured cases are Kearns-Sayre syndrome and homozygous MTHFR C677T, not DHFR deficiency, so the mechanism is a property of the blood-CSF barrier shared across the cerebral folate deficiencies and this paper does not measure it in a DHFR patient. The explanation says exactly that.

    Suggestion 1, GO:0006729. Kept the binding and added a notes block on the node recording that it is broader than the claim: the term is the de novo biosynthetic process while the node models salvage reduction of dihydrobiopterin, no GO term for the salvage arm was found, and preferred_term carries the specific concept. This mirrors how the unbound dihydrofolate substrate was already handled in the entry notes, which is what the review asked for.

    Suggestion 2, identifiers. OMIM:613839 (phenotype), OMIM:126060 (gene) and ORPHA:319651 added as external_assertions, not mappings: DiseaseMappings carries only ICD-10-CM, ICD-11, MONDO and NCIT, there is no omim_mappings slot (#9922 withdrew the proposal) and no Orphanet slot either. The gene MIM is recorded alongside the phenotype MIM deliberately, for the same reason it was on DOCK2 in this batch: the pair is what stops one being read as the other. The Orphanet record's description states that no ORPHA cache file is committed, so nothing in the entry quotes Orphanet.

    Suggestion 3, antifolate avoidance. Added to the treatment notes as prose, explicitly marked as following from the drugs' mechanism rather than from any source in this entry's cache. No cached reference makes the recommendation for DHFR deficiency, and the two structural DHFR papers in the cache are about an experimental antifolate rather than about clinical avoidance.

    Suggestion 4, CSF biopterins. Added to the diagnosis description, with the reason: cerebral tetrahydrobiopterin deficiency is what the entry's own differential names as the feature pointing specifically at DHFR, and CSF 5-MTHF alone cannot show it. Marked in place as a workup recommendation that follows from the BH4 node rather than from a reported measurement, since no DHFR case series reports those values.

    Suggestion 5, FOLR1 papers. Both cited on the folinic acid treatment with directness INDIRECT, and the treatment notes now use them as a matched pair on the treatment-window question: PMID:34008900 is folinic acid started after fifteen years of illness with no improvement, PMID:41132636 is a ten-year-old treated at diagnosis with improvement. The notes say plainly that they are a different gene and cannot settle the question for this disease, which is why the original 'not established in the published cases' sentence was kept rather than replaced.

    Not taken: PMID:21931219 and PMID:25453083 remain uncited. The entry notes already record why, and that reasoning is unchanged: they describe the normal enzyme and antifolate pharmacology rather than this disease's mechanism.

    Validation: just validate clean, 22/22 snippets verified (up from 19/19), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values all clean.

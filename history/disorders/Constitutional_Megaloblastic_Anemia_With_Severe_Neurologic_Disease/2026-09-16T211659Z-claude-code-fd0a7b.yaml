  details: |
    Created kb/disorders/Constitutional_Megaloblastic_Anemia_With_Severe_Neurologic_Disease.yaml (DHFR deficiency) from claim issue #11963. Deep research: openscientist (research/Constitutional_Megaloblastic_Anemia_With_Severe_Neurologic_Disease-deep-research-openscientist.md). This run's report carried BOTH validation sections, unlike the DOCK2 and CMS7 runs in the same batch whose term-validation step aborted on an EBI timeout. Reference validation: 10/10 resolved, 6/6 quoted claims found in source, 0 off topic. Term validation: 36 terms checked, 34 resolved, 0 named as a different term, 11 flagged as worth a second look. Reading that list mattered: the report offers CHEBI:20506 as 7,8-dihydrofolate, and the term is actually 5,6,7,8-tetrahydrofolic acid. It is bound in this entry as tetrahydrofolate, the concept the node needs, and dihydrofolate is left unbound and described in prose because no sourced CURIE was available for it. Pathograph: 5 nodes from DHFR destabilization (normal mRNA, reduced protein, so a stability lesion rather than a catalytic-site one) through collapse of the reduced folate pool into three arms - thymidylate/purine synthesis, cerebral folate deficiency, and tetrahydrobiopterin salvage failure. The BH4 arm is the discriminator from the other cerebral folate deficiencies and drives a knowledge-gap discussion: folinic acid bypasses DHFR for folate but not for biopterin, and no published case reports post-treatment CSF biopterin. The thymidylate node is explicitly marked as inferred from folate biochemistry rather than measured in these patients, and carries its own discussion saying so. Validation: just validate and just validate-disorders pass (19/19 snippets verified); duplicate-key, entity-ref, causal-target, enum-value, qualifier-term gates clean; list-gene-term-mismatches confirms the DHFR binding names the gene the entry names.

  summary: 'Create: Mannose-binding Lectin Deficiency'
  details: |
    De-novo curation of MBL deficiency (MONDO:0013714, MBL2 hgnc:6922) from the committed Perplexity sonar-deep-research report, whose references and terms were pre-validated. Curated as a common, low-penetrance, context-dependent susceptibility state rather than a fully penetrant immunodeficiency: a five-node causal chain (MBL2 partial-LOF structural/promoter variants -> defective oligomerization/reduced serum MBL -> impaired lectin-pathway complement activation -> reduced opsonophagocytic clearance -> infection susceptibility only under a second immune stressor), plus a protective 'MBL paradox' branch node. Inheritance ambiguity (OMIM AD vs functionally codominant vs unclear) recorded via Semidominant (HP:0032113) and Typified-by-incomplete-penetrance (HP:0003829) inheritance blocks. Conflicting literature curated with SUPPORT+REFUTE items on the respiratory and meningitis phenotype nodes. MBL2 D/B/C exon-1 alleles and the -221 X promoter allele recorded as UNCERTAIN_SIGNIFICANCE risk alleles. Mbl-null mouse model linked with an upward-caveated modeled_mechanisms link. Treatments: antimicrobials, vaccination, supportive/pulmonary care, and experimental MBL replacement (trials NCT00886496/NCT00138736). Every CURIE/label looked up (OLS/NCIT) in the step written; HP:0032305 label corrected from the report. Validated: just validate, validate-terms, count-verified-snippets (36/36), validate-disorders PASS, entity-refs, causal-targets, logical-rules, coarse-phenotypes, qualifier-terms, duplicate-keys, enum-values, snippet-grading, reference-titles, block-scalar-comments all clean. 5/6 phenotypes causally connected (the 6th is an intentional laboratory readout node).

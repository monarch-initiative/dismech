  summary: 'Review fixes: Mannose-binding Lectin Deficiency'
  details: |
    Addressed the 2026-10-30 review of PR 16006. Bronchiectasis: replaced the SUPPORT item, which quoted a sentence about severe respiratory infection, with a REFUTE item quoting the PMID:37503644 finding that bronchiectasis prevalence was similar in MBL-deficient and MBL-sufficient children. Mannan-dependent lectin-pathway functional activity: removed the evidence item, which reported CSF MBL concentration rather than a functional assay; no cited source reports the patient functional assay, and the notes now say so. Added reference_title to the two DOI:10.1084/jem.20032207 animal-model items, copied from the cache frontmatter. Clinical trials: fetched both ClinicalTrials.gov records and quoted each as evidence. The ClinicalTrials.gov API reports NCT00886496 as WITHDRAWN (was COMPLETED) and NCT00138736 as PHASE2 (was PHASE_I); both corrected. Removed the HP:0002205 target phenotype, since neither registry record names recurrent respiratory infection, and removed the unsupported outcome claim from the NCT00138736 description and from the Experimental MBL replacement treatment description. Added a DIRECT downstream edge from Defective MBL Oligomerization and Reduced Serum MBL to Decreased serum mannose-binding lectin, and removed the sentence saying the laboratory node had no upstream cause; all six phenotypes are now causally connected. Suggestions taken: the Chronic Diarrhea phenotype (HP:0002028) is now Recurrent Cryptosporidium Infection (HP:5210120, looked up in OLS hp), which matches its PMID:19827946 snippet; added NCIT:C1151 Mannose-Binding Lectin as therapeutic_agent on Experimental MBL replacement (OLS ancestors include NCIT:C1909 Pharmacologic Substance). Validated with just validate (0 issues, 37/37 snippets), validate-terms, check-duplicate-keys, check-enum-values, check-entity-refs, check-causal-targets, check-logical-rules and check-coarse-phenotypes.

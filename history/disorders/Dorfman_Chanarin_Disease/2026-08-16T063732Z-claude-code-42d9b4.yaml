  details: |
    Weekly compliance sweep (focus: taxonomies/classification for metabolic disorders). Added a classifications block: harrisons_chapter ENDOCRINOLOGY_METABOLISM + DERMATOLOGY, and icimd_category 'glycerolipid_metabolism' (ICIMD group 'Disorders of glycerolipid metabolism' under category 'Disorders of lipid metabolism'; Ferreira et al. 2021, PMID:33340416), matching the assignment made in the same sweep to Triglyceride_Storage_Disease_Type_1, which the entry prose calls essentially synonymous. The notes record that no lysosomal_storage_category is assigned: this is a cytoplasmic lipid-droplet disorder, not a lysosomal hydrolase deficiency. Provenance in notes rather than a fabricated evidence snippet, per the disease-classification skill. Also added a biomarker_term to the previously unbound Jordans anomaly entry: CHEBI:17855 (triglyceride), with the clinically specific framing kept in preferred_term. HPO was searched first for a Jordans-anomaly or vacuolated-granulocyte term and none exists; HP:0001922 Vacuolated lymphocytes was rejected as the wrong cell lineage, per the dismech-terms rule that no term beats a bad one. Validated with 'just validate' - schema, term and reference validation all passed.

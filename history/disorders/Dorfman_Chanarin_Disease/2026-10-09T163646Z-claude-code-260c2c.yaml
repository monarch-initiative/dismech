    The ABHD5 genetic record carried only the free-text association Causative; it now has relationship_type CAUSATIVE, variant_origin GERMLINE and a ClinGen Definitive AR gene_disease_validity assertion copied from the CGGV record for MONDO:0010155, quoting the cached ClinGen row. The molecular node's activity was bound to the generic GO:0008047 enzyme activator activity; it now uses GO:0060229 lipase activator activity (the core function in the ai-gene-review ABHD5 review), adds GO:0010898 positive regulation of triglyceride catabolic process DECREASED alongside the existing GO:0019433, and records the lipid droplet (GO:0005811) as the cellular component. Validated with just validate (schema, terms, references), count-verified-snippets 17/17, and check-gene-validity clean.

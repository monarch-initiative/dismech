  summary: 'GO term audit: bind the named enzyme''s molecular function'
  details: |
    The 'ABHD5/CGI-58 Deficiency and Loss of ATGL Co-activation' node bound only the downstream biological process. Added GO:0008047 (enzyme activator activity, DECREASED). GO:0004806 (triacylglycerol lipase activity) was deliberately NOT used despite appearing in ABHD5's GOA, because the entry's own description states that ABHD5 'itself lacks hydrolase activity but is required to activate PNPLA-family triacylglycerol lipolysis' - the activator term matches the curated claim, the lipase term would contradict it. Validated with just validate-terms and just validate.

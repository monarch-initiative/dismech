  summary: 'Create: Spermatogenic Failure 72'
  details: |
    New entry for WDR19-related nonsyndromic asthenoteratozoospermia with MMAF (MONDO:0030809), claimed in issue 15188. The gene-disease link rests on one proband (PMID:32323121, abstract only), so phenotypes and mechanism describe that case: homozygous p.Lys1271Glu, WDR19 absent from sperm, IFT140/IFT88 mislocalized, destroyed flagellar ultrastructure, zero progressive motility, successful ICSI. IFT-A function cited from PMID:22019273 (patient fibroblast sentence, graded IN_VITRO; the retrograde-transport sentence is graded inconsistently elsewhere in the KB so was not reused). Brown Swiss bull WDR19 cryptic-splice allele (PMID:32407316) added as a low-fidelity animal model. ClinGen WDR19 Definitive is for lumped ciliopathy (MONDO:0005308), so no validity tier recorded. Validated with just validate-disorders, validate-terms and the offline gates.

  summary: 'Create: Thymic_Neuroendocrine_Carcinoma'
  details: |
    De-novo curation of thymic neuroendocrine carcinoma (MONDO:0020516) for issue #7465.

    Deep research: Edison/Falcon [research/Thymic_Neuroendocrine_Carcinoma-deep-research-falcon.md, 398s, 5 citations, 1 artifact]. The Falcon report returned no usable primary PMIDs and proposed three semantically wrong ontology IDs - HP:0002664 offered as "Cushing syndrome" is actually Neoplasm, HP:0000846 offered as "hypercortisolism" is actually Adrenal insufficiency, and UBERON:0003406 offered as "mediastinum" is actually cartilage of respiratory system - so it was used as leads only and the literature base was rebuilt from direct PubMed E-utilities searching. Every ontology ID was independently re-resolved with OAK and every snippet verified against the cached abstract.

    Named Entity Confusion preflight run against MONDO:0020516 [Orphanet:99869, NCIT:C171031, ICD-11 2C27.1]: report identity confirmed as the thymic neuroendocrine entity, no synonym or eponym collision.

    Content: 10 pathophysiology nodes, all carrying biological_scale and role - menin loss, three atomic tumor-suppressor triggers split by pathway [RB-axis, chromatin regulator, mTOR restraint], neuroendocrine clonal expansion, ectopic ACTH/CRH secretion, ACTH-dependent hypercortisolism, SSTR expression, mediastinal mass effect, metastatic dissemination. 13 phenotypes, all wired into the pathograph. 10 treatments with target_mechanisms joins back to the pathograph. 5 genetic records, 6 biochemical, 3 histopathology, 4 has_subtypes [typical carcinoid MONDO:0016976, atypical carcinoid MONDO:0016977, LCNEC MONDO:0003047, small cell MONDO:0004122], 3 structured prevalence records using the structured slots, 3 epidemiology records, 4 structured differential_diagnoses, 2 clinical trials, 1 environmental record for smoking, 3 KNOWLEDGE_GAP discussions. 119 evidence items over 20 distinct references.

    Declares conforms_to evading_growth_suppressors#Tumor Suppressor Inactivation on the RB1 node only, with an explicit conformance caveat noting that KMT2D/APC/TSC2 are outside the module's RB/p53-axis scope and are modeled as separate nodes.

    Boundary against the pre-existing Thymic_Carcinoma.yaml and Thymoma.yaml entries is handled by an explicit scope note plus structured differential_diagnoses entries rather than duplication; a pointer paragraph was added to the Neuroendocrine subtype facet of Thymic_Carcinoma.yaml directing readers here for the mechanistic content.

    Validation: just validate passes - schema clean, term validation clean, 118/118 snippets verified against cached references. Compliance 86.6 percent global, 87.0 percent weighted. validate-graphs clean. 13/13 phenotypes connected to the pathograph. 37 relevant tests in tests/test_data.py pass.

    Pre-PR red-team review run against the dismech-pr-review skill in a fresh-context subagent; all CRITICAL and IMPORTANT findings were addressed: GeneReviews PMID:20301710 deep-mined across prevention, surveillance and transmission-risk sections rather than cited once; smoking risk factor added with a refuting counter-item from the MD Anderson series; the bundled four-gene tumor-suppressor node split into three atomic nodes; the CD5/CD117 discriminator claim narrowed and sourced; target_mechanisms joins added; lung and pleural metastasis phenotypes added; bone metastasis re-termed from HP:0002653 Bone pain to HP:0010622; advanced-disease frequency denominators made explicit with context qualifiers; the MEN1 better-prognosis counterweight and the Finnish founder-pedigree caveat added.

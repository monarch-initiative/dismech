  summary: 'Cross-check audit + reviewer response: histopathology finding terms, grade-agnostic
    tumour term, DDx MONDO binding, metastasis phenotypes'
  details: |
    Independent fresh-context audit (adversarial cross-check of a self-reviewed PR), merged with the ai4c-reviewer CHANGES_REQUESTED findings.

    REVIEWER IMPORTANT FINDING - histopathology finding_term reused the disease class. All three histopathology records bound NCIT:C171031 Thymus Neuroendocrine Carcinoma, a disease class rather than a finding, which validates but carries no discriminating information. Independently found in the same audit before reading the review. Replaced with the reviewer's verified in-scope terms: NCIT:C43574 Neuroendocrine Differentiation for the architecture/marker record, NCIT:C177567 WHO Neuroendocrine Tumor Grade for the mitotic-count and necrosis record, NCIT:C122809 Lack of Expression of PD-L1 for the PD-L1 record. All three re-resolved with OAK and their is_a ancestry confirmed.

    FOUND BY INDEPENDENT AUDIT:
    1. Primary-tumour phenotype term was narrower than the disease. HP:0034954 Thymic carcinoid tumor was used for the defining lesion, but under the 2021 WHO scheme "carcinoid" covers only the well- and moderately-differentiated grades, whereas this entry deliberately spans all four grades including large cell neuroendocrine carcinoma and small cell carcinoma. Replaced with HP:0100521 Neoplasm of the thymus and added a notes block recording the NTR candidate. This is the class of error that passes term validation cleanly: the ID exists, the label matched exactly, and only reading the definition against the entry's own subtype list exposes it.
    2. Two of four differential_diagnoses carried no disease_term. Bound mediastinal paraganglioma to MONDO:0000448 and pulmonary neuroendocrine carcinoma to MONDO:0005454.

    REVIEWER SUGGESTIONS ADDRESSED:
    - Added the NTR-style notes caveat to the Pulmonary metastasis phenotype, matching the caveat the Bone and Pleural metastasis records already carried.
    - Added Hepatic metastasis (HP:0002896) and Cerebral metastasis (HP:0030692) phenotypes, both evidenced by the already-verified PMID:23110006 snippet, and wired both into the pathograph from Nodal and Distant Metastatic Dissemination. Deliberately no frequency band: the only thymic-specific source is a qualitative list of common metastatic sites with no denominator, so asserting a band would not be licensed.
    - INSM1 biomarker: NOT added. No cited, cached source carries a snippet-verifiable INSM1 statement for thymic neuroendocrine carcinoma, and fabricating or stretching one would be worse than the omission.

    CONSIDERED AND WITHDRAWN: the audit initially flagged NCIT:C74780 Adrenocorticotropic Hormone Measurement and NCIT:C74781 Cortisol Measurement as measurement terms occupying an analyte slot. A survey of biomarker_term usage across the KB shows both conventions in active use (Creatine Kinase Measurement and Hemoglobin Measurement alongside Alkaline Phosphatase and Creatine Kinase), so there is no house convention being violated. Finding withdrawn rather than pressed.

    VERIFICATION PERFORMED: all 87 ontology identifiers in the entry re-resolved with OAK and their definitions read, not just their labels. All 118 original evidence snippets checked against the cached references with a normalisation ladder that distinguishes line-wrap differences from real character substitution; zero character substitutions (no NBSP, ligature, dash or curly-quote repairs needed). All reference_title values diffed against the cached paper titles; no misattributions.

    VALIDATION: just validate, just validate-terms and just validate-references all pass. 120/120 snippets verified. Weighted compliance 86.5 to 86.3 percent; the small decrease is the expected effect of adding two deliberately frequency-free phenotypes, which add optional-field denominators.

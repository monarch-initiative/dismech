  summary: 'Create: Hereditary Spastic Paraplegia 44 (SPG44, GJC2)'
  details: |
    De-novo curation of SPG44 (MONDO:0013179) from an OpenScientist deep-research report plus primary literature fetched into references_cache. Modelled the GJC2 channel-loss chain: connexin-47 conductance loss, panglial oligodendrocyte-astrocyte uncoupling, CNS hypomyelination, corticospinal dysfunction. Conformance declared to cns_myelin_failure at the insult and myelin-sheath nodes. Three mouse models curated with explicit relationship types, including a FAILS_TO_RECAPITULATE link for the single Cx47 knockout, which has vacuolated myelin but no overt phenotype, and RESCUES links for transgenic Cx32 replacement and AAV.MBP.Cx47myc gene therapy. Two discussions filed: an OPEN_QUESTION on one homozygous GJC2 variant producing HSP in a proband and HLD2 in his two sisters, and a HUMAN_MODEL_MISMATCH on mouse connexin redundancy. The deep-research report resolved 18 of 18 citations with zero confabulation but mislabelled 7 of 20 ontology terms; none of those identifiers was used in the entry. Validated with just validate, just validate-terms, just check-entity-refs and just check-duplicate-keys.

  summary: 'Create: Rhizomelic Chondrodysplasia Punctata Type 5 (PEX5)'
  details: |
    Curated as part of a sweep to complete ISDS Nosology group 23 coverage. Corresponds to nosology row NOS 23-0100, which is new relative to the 2019 revision. Lump-versus-split decision recorded in the entry notes: kept separate from the PEX7 entry (RCDP1) despite sharing the Selective PTS2 Import Failure mechanism node, because the ISDS nosology lists the five rhizomelic-CDP entities as five rows by gene, MONDO carries a distinct class, and the interesting content is gene-specific - an isoform-selective allele is what makes PEX5 cause both a Zellweger spectrum disorder and an RCDP. This is deliberately a different call from the one dismech makes for RCDP2/3/4, which are lumped into one entry because their three genes are consecutive steps of one pathway. Pathophysiology node names mirror the RCDP1 entry so the two read as siblings. A knowledge-gap discussion records that the entity's phenotype and its single founding allele are entirely confounded. Validated with the batched validate-disorders pass (33 snippets verified). Deleted the corresponding stub.

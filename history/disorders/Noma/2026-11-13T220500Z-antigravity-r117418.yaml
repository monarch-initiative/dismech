  details: |
    Replaced the inverted Polymicrobial infection with tissue necrosis -> Oral ulcer edge with Oral ulcer.sequelae -> Polymicrobial infection with tissue necrosis (preserving both protected pathograph node names), added Halitosis (HP:0100812) and Orofacial pain (HP:0046506) phenotypes wired downstream of Polymicrobial infection with tissue necrosis, added Concomitant systemic infections (measles, malaria, and HIV) in environmental wired to Immunodeficiency from malnutrition and infection, documented live ECTO/XCO queries on malnutrition and infectious precursors, added Stage 3 irreversibility and 90% untreated case-fatality evidence from DOI:10.1371/journal.pntd.0012818, rebound Dysphagia to Feeding difficulties (HP:0011968), added amoxicillin (CHEBI:2676) and Local Oral Hygiene and Antiseptic Wound Care with chlorhexidine (CHEBI:3614), noted ICD-10 A69.0 vs clinical necrotizing stomatitis usage, and pruned boilerplate deep-research findings.

  summary: 'Review round: add hemorrhage-management escalation ladder and two previa-specific
    trials'
  details: |
    Addresses the blocking review finding that treatments: jumped from blood transfusion straight to peripartum hysterectomy.

    Added five treatments between those two rungs: Uterotonic Therapy (oxytocin CHEBI:7872 + misoprostol CHEBI:63610), Tranexamic Acid (CHEBI:48669), Intrauterine Balloon Tamponade, Uterine Compression Sutures, and Pelvic Arterial Embolization (NCIT:C15917). Each carries target_mechanisms into 'Poorly Contractile Placental Bed in the Lower Uterine Segment', 'Maternal Sinus Haemorrhage from the Placental Bed', and/or the 'Post-partum Hemorrhage' phenotype, so those nodes no longer reach only a hysterectomy. treatment_effect distinguishes the two mechanistic classes: uterotonics and tranexamic acid INHIBIT, while tamponade and compression sutures BYPASS the poor lower-segment contractility rather than correcting it - which is the entry's own lower-segment thesis.

    Added clinical_trials: with NCT05133167 (balloon tamponade vs B-Lynch, n=60) and NCT05340205 (IV tranexamic acid vs intrauterine misoprostol, phase 4, n=81), both fetched with just fetch-reference. Both are cited for design only and graded evidence_source: OTHER, because neither registry record carries outcome values.

    Every CURIE was resolved against OLS at the time of writing rather than recalled. This caught three wrong identifiers suggested by the falcon deep-research report: oxytocin is CHEBI:7872 not CHEBI:30623, and misoprostol is CHEBI:63610 not CHEBI:7023. A fabricated HP:0500083 for postpartum hemorrhage was also caught by the pre-edit validation hook and replaced with HP:0011891, the term the entry's own phenotype already binds.

    therapeutic_modality is deliberately unset on two treatments, with the reason recorded in notes: on each - uterotonic therapy mixes a peptide with a small molecule in a single-valued slot, and catheter-delivered embolization fits neither SURGERY nor DEVICE as the enum uses them.

    Validation: just validate passes (schema, terms, references) with 75/75 snippets verified, up from 65. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values all clean.

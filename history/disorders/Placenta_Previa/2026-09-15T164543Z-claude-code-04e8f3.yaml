  summary: 'Create: Placenta Previa (MONDO:0005918)'
  details: |
    Created kb/disorders/Placenta_Previa.yaml, anchored to MONDO:0005918 (placenta
    praevia). Selected off the obstetric coverage-gap list in issue #7837, where
    placenta previa has been on the "still absent" line since 2026-08-24. Verified
    absent before starting: no file, no use of the MONDO ID anywhere in kb/ or stubs/,
    no `claim` issue, and no open or closed PR mentioning previa.

    Deep research. `claude_code` was unreachable in this environment (not logged in)
    and `openai` 404'd on `o3-deep-research-2025-06-26`, so the committed report is
    `falcon` (Edison), 668 s, 51 citations. Its own validation reports 12/12 references
    verified, confabulation_rate 0.0, and one unresolved term (HP:0030916) which was
    not used. Its `needs_review: true` is driven by that term plus a MONDO label
    mismatch that is a template artifact - the report records the disease label as "if
    available". `just preflight-dr` returns SKIP because MONDO records no RO:0004003
    causal gene for MONDO:0005918, the same non-Mendelian outcome the Bacterial
    Vaginosis and Pelvic Organ Prolapse runs on this list hit; gene-identity preflight
    does not apply and concordance was assessed manually instead.

    The report independently reproduced the pathograph built from the manual PubMed
    sweep - the previa/low-lying subtype split, low implantation on damaged endometrium,
    trophotropic resolution by differential growth rather than movement, the PAS branch
    via defective decidualisation over a scar, the same 11.10% PAS-in-previa figure and
    the same 5.4 mm/week migration rate - and independently stated that previa is a
    localisation disorder rather than an invasion disorder, which is the reason the
    entry keeps the invasion arm as a conditional branch.

    It contributed one substantive correction. It flagged that resolution estimates
    depend heavily on gestational age at detection and degree of overlap, citing a
    Research Square preprint (10.21203/rs.3.rs-1188255/v1, reported by falcon as
    "ArXiv", which is wrong). Rather than cite the preprint, I traced the same LoPPS
    cohort to its peer-reviewed sibling, PMID:35841836 (Placenta, 2022), and cited that:
    62.5% of women whose previa persisted to 28 weeks still had previa at 36 weeks.
    That is recorded as a REFUTE item against the general reading of the ">98% resolve"
    figure, with a node-level note saying the two describe different starting points
    rather than reconciling them into one number.

    Evidence. 18 references, all newly fetched and committed. 65/65 snippets verified by
    `just validate`. Two deliberate disagreements are curated rather than smoothed: the
    cervical-length literature (PMID:19173235 SUPPORT for severe haemorrhage and REFUTE
    for bleeding as such, from the same 59-woman cohort, against PMID:31434519's larger
    cohort finding the association) carries a CONTROVERSY discussion; and the resolution
    figures above. Two NO_EVIDENCE items record sources that explicitly decline to
    judge: Cresswell on whether regional variation is ethnic, and Oyelese on
    uterus-preserving management of accreta.

    HP:0003811 Neonatal death was deliberately left unbound. It exists in HPO but sits
    under Mortality/Aging rather than under HP:0000118, so it is outside the
    PhenotypeTerm dynamic-enum root and binding it fails term validation. This is a
    fourth instance of the enum-root gap issue #7837 already records for HP:0003826
    Stillbirth, HP:0009800 Maternal diabetes and HP:0100602 Preeclampsia; the phenotype
    keeps its `preferred_term` and a note, as Intrahepatic Cholestasis of Pregnancy does
    for stillbirth.

    No clinical_trials block, though one was attempted. PMID:35841836 registers
    ChiCTR2100054068, and `just ictrp-fetch ChiCTR2100054068` reports that ICTRP has no
    record for that identifier. Per the ICTRP guidance an unresolvable registry ID is
    not recorded, so the trial is omitted rather than curated from the paper's own
    transcription.

    No datasets block, and that is a triage result rather than an omission. `just
    discover-datasets Placenta_Previa` returns six candidates, all GENE_ONLY, and every
    one is about something else - four are placenta accreta spectrum transcriptomics,
    one is Hofbauer-cell chromatin, one is diabetic macrosomia. They all resolve; none
    is about previa. Recorded in the entry's notes as the sibling-disease collapse the
    dataset guidance warns about.

    Validation. `just validate` passes (schema, terms, references; 65/65 snippets).
    `just compliance` reports 81.7% global. All deterministic gates clean:
    check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms,
    check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets,
    check-snippet-grading, check-environmental-evidence. check-environmental-evidence
    initially failed on the Assisted Reproductive Technology exposure, which carried
    evidence only on its influences_mechanisms link and not at entry level; entry-level
    evidence was added rather than a waiver. `just validate-disorders` run over the
    changed files as the final batched check.

    One truncated snippet was caught and fixed during authoring: a quote from
    PMID:17012465 initially ended on "is a clinical one, and". Completed to the full
    sentence - the same defect class flagged in the PR #9414 review.

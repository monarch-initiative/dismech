  summary: 'Create: 3-Methylglutaconic Aciduria Type VIIB'
  details: |
    Curated the autosomal recessive form of CLPB deficiency (MGCA7B, MONDO:0014561, OMIM 616271) from a skeleton entry, and deleted its stub. Sources, all cached with fetch-reference and quoted from abstracts: GeneReviews CLPB Deficiency (PMID:27891836, tagged GeneReviews); the three 2015 gene-discovery reports (Wortmann PMID:25597510, Saunders PMID:25597511, Kanabus PMID:25595726) and Capo-Chichi 2015 (PMID:25650066); the Pronicka 2017 severity-score series (PMID:28687938); the Heath 2026 zygosity cohort (PMID:41719910); Tucker 2022 on premature ovarian insufficiency (PMID:36074910); and mechanism papers on Skd3 disaggregase activity and severity (Cupo and Shorter 2020, PMID:32573439), intermembrane space localisation (PMID:32866687), the CLPB/HAX1 axis in neutrophil differentiation (Fan 2022, PMID:35499078), CLPB-null myeloblasts (Wenta 2025, PMID:39644357), the SPY complex (Baker 2024, PMID:38270563), calcium uptake and fusion (PMID:40118824), secondary complex I instability (PMID:42420651) and a review on the origin of secondary 3-MGA (PMID:31626852). Two dominant-negative studies (Wortmann 2021 PMID:34140661, Warren 2022 PMID:34115842) belong to the separate autosomal dominant form MGCA7A (MONDO:0859237); Warren 2022 is cited only for the effect of genetic CLPB loss on granulocytic differentiation and for the absence of 3-MGA in the dominant series. The pathograph runs CLPB disaggregase loss to intermembrane space aggregation, then HAX1 insolubility to granulocytic precursor apoptosis and neutropenia, with SPY complex, calcium uptake and complex I branches that are shown only in cultured cells, and a proposed link to 3-MGA, cataract and nephrocalcinosis. Four mechanistic hypotheses and two knowledge gaps (tissue selectivity of neutropenia versus neurological disease; origin of the 3-MGA) are recorded. Death in infancy carries no phenotype_term because HP:0001522 is outside the PhenotypeTerm enum. No ClinGen record exists for CLPB and this disease (only Leigh syndrome), so gene_disease_validity is omitted. Deep research: research/3-methylglutaconic_Aciduria_Type_VIIB-deep-research-openscientist.md (openscientist) was used as a lead list. Its reference validation was 12/12 resolved with 8 on topic. just preflight-dr against MONDO:0014561 returned WARN with two triggers, both checked by hand: the second gene MGA (23 mentions) is the abbreviation 3-MGA, not the MGA gene, and OMIM 616254 is the CLPB gene record, while the report also cites the disease record 616271 that MONDO xrefs. The report is about this disease. Its passages on monoallelic dominant-negative variants describe MGCA7A and were not attributed to this entry. Added from the report: PMID:36170828 (Cupo 2022; MGCA7-linked subunits do not inhibit wild-type disaggregase, the structural basis of recessive inheritance, on the inheritance block); PMID:42244541 (bioRxiv preprint; HAX1 is a direct stimulatory cofactor of CLPB, on the HAX1 node); PMID:39787888 (secondary 3-MGA is fluctuant and can be undetectable in urine, on the biochemical marker, and the class-wide acetyl-CoA build-up model added as a fourth, ALTERNATIVE mechanistic hypothesis and to the 3-MGA knowledge gap). Rejected report citations: PMID:31729175 (delayed 3-MGA in TMEM70 and TAZ cardiomyopathy, no CLPB patients); PMID:36485107, PMID:37193639 and PMID:31030818 (general severe congenital neutropenia and HAX1 neutropenia reviews and registry data, not CLPB-specific; G-CSF is already supported by GeneReviews and the CLPB cohort). Their caches were deleted. Also rejected: the report's claim that HSCT is reserved for leukemic transformation (no CLPB source); its unresolved term HP:0000844; NCIT:C1512, which the report labels G-CSF but is Immunoconjugate (the entry keeps NCIT:C1287 Recombinant Granulocyte Colony-Stimulating Factor); and its use of HP:0001332 Dystonia for movement disorder in general (the entry binds Dystonia only to the cohort sentence naming dystonia). gnomAD constraint figures in the report have no citable source and were not used. Validation: just validate, validate-terms, count-verified-snippets (106/106), check-entity-refs, check-causal-targets, check-duplicate-keys, check-snippet-length, check-title-snippets, check-coarse-phenotypes, check-block-scalar-comments and validate-disorders all pass.

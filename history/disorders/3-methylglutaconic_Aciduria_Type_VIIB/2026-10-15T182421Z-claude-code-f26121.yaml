  summary: 'Review round 1: add diagnosis section and edge evidence'
  details: |
    Changes made in response to the automated review of PR 14401. Added a diagnosis section with four rows: molecular genetic testing of CLPB (NCIT:C15709 Genetic Testing; GeneReviews sentence quoted only up to the biallelic criterion, since its second half describes the dominant form), urine organic acid analysis (NCIT:C17241 Urinalysis, with preferred_term naming organic acids; Pronicka 2017 PMID:28687938 plus the PMID:39787888 caveat that urinary 3-MGA fluctuates in secondary 3-MGA syndromes, marked INDIRECT), blood cell count (NCIT:C28133) and ophthalmological examination (NCIT:C38060), the last two from the same Pronicka recommendation. PMID:31729175 (delayed 3-MGA-uria in TMEM70 and TAZ neonates) was not added: it contains no CLPB patients and the fluctuance caveat is already carried by PMID:39787888. No LOINC codes were added. Inheritance now also quotes the GeneReviews 25%, 50%, 25% sib recurrence sentence. GeneReviews surveillance sentences were added as evidence on G-CSF (white cell count with differential at each visit) and hormone replacement (annual gonadal function assessment from age 10). The Recurrent infections to Death in infancy sequela now quotes both halves of the GeneReviews sentence, so the death claim is quoted rather than inferred. All eight previously bare downstream edges from Progressive Encephalopathy with Brain Atrophy now carry exact-quote evidence (GeneReviews, PMID:25597510, PMID:28687938, PMID:25650066). Edges were tagged with hypothesis_groups: the HAX1 chain to neutropenia with clpb_hax1_proteostasis_neutropenia, aggregation to 3-MGA with aggregate_membrane_perturbation_3mga, and a new hypothetical edge from Secondary Complex I Instability to Secondary 3-Methylglutaconic Acid Accumulation with ampk_peroxisomal_3mga and acetyl_coa_tca_3mga, whose description states that no study has connected the two. The G-CSF therapeutic_modality changed from PROTEIN_REPLACEMENT to OTHER, because G-CSF stimulates granulopoiesis rather than replacing a deficient protein and the enum has no cytokine value. No new references were fetched.

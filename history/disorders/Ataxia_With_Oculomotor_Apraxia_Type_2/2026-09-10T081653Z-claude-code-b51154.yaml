  summary: 'Review round 1: evidence_source regrades and term fixes'
  details: |
    Addressed the ai4c-reviewer changes-requested review on PR #11567. Two blocking evidence_source misgrades fixed: the PMID:30778901 item quoting 'Disruption of the SETX gene in mice failed to recapitulate the neurological phenotype seen in human patients' was HUMAN_CLINICAL and is now MODEL_ORGANISM; the PMID:24760770 item quoting the patient-fibroblast-and-Setx-knockout-cerebellum sentence was HUMAN_CLINICAL at both of its occurrences and is now MODEL_ORGANISM at both, since check-snippet-grading keys on the quoted sentence and would flag a divergence if only one changed. Two reviewer suggestions also taken: the transcriptional-control node's GO binding moved from GO:0016236 (macroautophagy, the process itself) to GO:0010506 (regulation of autophagy), so it no longer collapses onto the same identifier as the downstream Blocked Autophagic Clearance node; and diagnosis#Video-oculography, which the reviewer suggested annotating as a deliberate term omission, was instead bound to NCIT:C162707 (Eye Movement Measurement) after an NCIT search showed a reachable term does exist. Re-ran and read: just validate (127/127 snippets), just validate-terms (passed), just validate-disorders (passed, 127/127), just check-entity-refs, just check-enum-values, just check-duplicate-keys, just check-snippet-grading (no new divergences). Reviewer suggestions 4 and 5 (a convergence node resting on a framing sentence, and a thin postmortem snippet) were left as they are and answered on the PR.

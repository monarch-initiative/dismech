  details: |
    De novo curation of AOA2 (MONDO:0018996, SETX/senataxin) as a leaf DISEASE entry: 16 pathophysiology nodes forming one connected causal chain from the biallelic SETX loss-of-function variant through lost helicase activity, failed R-loop resolution and RNA polymerase II transcription termination, a disrupted senataxin-exosome coupling, mis-transcribed autophagy genes, oxidative DNA-damage hypersensitivity and unrepaired double-strand breaks, to Purkinje cell degeneration with cerebellar atrophy, peripheral axonal degeneration, and a separate meiotic arm ending in germ-cell arrest and male infertility; 22 phenotypes with HP bindings and frequency bands; serum alpha-fetoprotein modelled in biochemical with the 7 microg/l sequencing threshold and a CORRELATES_WITH readout link; prevalence, progression, diagnosis, GeneReviews-derived treatments, the Setx knockout mouse and patient iPSC-derived neural progenitors, five differential diagnoses, and three discussions. 127 evidence items over 34 PMIDs. Conformance declared to cerebellar_purkinje_degeneration (Cerebellar Neuron Insult, Purkinje Neuron Degeneration) and peripheral_axonal_degeneration (Distal Axonal Degeneration and Demyelination). The deep-research provider was Perplexity sonar-deep-research; its report cites only four PMIDs and leans on non-citable web pages, so essentially all evidence was read directly from primary papers in references_cache. Report content refused or corrected: PMID:795872 was flagged unresolved by the report's own reference validation and is not cited (it is the article number in a JAMA Neurology URL, not a PMID); the Term Validation flag on MONDO:0018996 named 'if available' is the report echoing the query template and the term binding is correct; preflight-dr returned WARN on rival gene AFP, which is the diagnostic biomarker rather than a second disease entity, and both report OMIM numbers (606002 disease, 608465 gene) match MONDO; the report's step 4 claim that impaired autophagy is an established parallel arm of the neuronal mechanism was downgraded because it rests on a single 2021 study whose own R-loop result contradicts the report's step 2; and its step 8 attribution of raised AFP, cholesterol and CK to altered hepatic gene expression was dropped as unsupported and contradicted by AOA2 liver data (PMID:40255955). Elevated serum IgG, listed as a candidate phenotype, was dropped because no cached source supports it and the one reviewed patient with measured immunoglobulins had normal levels. Validation run and read: just validate passed with 127/127 snippets verified; just validate-terms passed; just validate-disorders passed; check-entity-refs, check-causal-targets, check-duplicate-keys and check-enum-values all OK; check-qualifier-terms-online OK with 388 labels matching and 103 resolved online; list-gene-term-mismatches examined the single hgnc:445 SETX binding with no findings; check-reference-titles, check-title-snippets, check-snippet-length, check-snippet-grading and check-folded-hyphens all passed; just normalize-cache and just check-term-cache-integrity passed, with the only cache addition being GO:0006369 and its enum row.

  summary: Cite the fever and heat/overexertion exposures
  details: |
    Added evidence to both environmental entries. Fever cites PMID:26021464, a seizure-precipitant cohort in which fever was reported by 97% of Dravet patients, plus PMID:34922162 for the antipyretic-prophylaxis recommendation that backs the entry's note. Excessive Heat and Overexertion cites the same cohort's separate finding on ambient warmth and cold-warmth shifts, plus PMID:27264138 for hyperthermia avoidance in counselling. The heat entry is kept distinct from fever: the exposure is external temperature, not raised body temperature from illness. Part of #8296.

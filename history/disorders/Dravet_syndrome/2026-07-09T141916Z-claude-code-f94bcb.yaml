  summary: Migrate Dravet EEG findings to new ElectrophysiologyFinding class
  details: |
    Added a schema ElectrophysiologyFinding class (sibling of ImagingFinding, design-decision section 10) with ElectrophysiologyModalityEnum (NCIT diagnostic-procedure meanings), ElectrophysiologyFindingTerm bound to the HP EEG/EMG/EKG subtrees (HP:0002353/HP:0003457/HP:0003115), ElectrophysiologyFindingDescriptor, and ictal_state/recording_state enums. Migrated the four interictal human EEG findings (multifocal/focal/generalized epileptiform discharges, interictal epileptiform activity) out of phenotypes into electrophysiology_findings, tagged ictal_state INTERICTAL and modality EEG; evidence snippets unchanged. Added one preclinical finding: ictal electrographic seizures in the Scn1a+/- mouse model (PMID:32848094, MODEL_ORGANISM, preferred_term-only RECOMMENDED-no-code case). Validated: linkml-validate, linkml-term-validator (schema + data), linkml-reference-validator on the new snippet, and pytest schema-validity + Dravet tests all pass. Committed pydantic datamodel intentionally not regenerated (local gen-pydantic version mismatch would introduce unrelated churn; tests validate against the YAML schema directly).

  summary: Curate SUDEP serotonergic chemoreflex mechanism, competing hypotheses,
    gaps, and CO2-response biomarkers
  details: |
    Follow-up to the NCT07112365 (FAST-DS) trial curation, investigating the trial's mechanistic claim and modelling its biomarkers.

    PATHOPHYSIOLOGY: added two nodes completing the SUDEP arm, which previously terminated at a Mortality phenotype with no mechanism. 'Postictal Serotonergic Neuron Dysfunction' (CELLULAR; CL:0000850 serotonergic neuron, GO:0001820 serotonin secretion DECREASED/TRANSIENT, UBERON:0004684 raphe nuclei, UBERON:0001896 medulla oblongata) and 'Impaired CO2 Chemoreception and Postictal Hypoventilation' (ORGANISM; GO:0002087, GO:0010037 both DECREASED). Chain: Neuronal Hyperexcitability -> serotonergic dysfunction -> impaired chemoreception -> SUDEP phenotype. The seizure-to-serotonergic edge and the chemoreception-to-SUDEP edge are typed INDIRECT_UNKNOWN_INTERMEDIATES because neither step is mechanistically resolved; only the serotonergic-to-chemoreception edge is DIRECT.

    MECHANISTIC_HYPOTHESES: two competing accounts of how fenfluramine could lower SUDEP risk. sudep_seizure_burden_model (CANONICAL) holds that reduced convulsive seizure frequency fully explains the observed mortality signal, and is curated explicitly as the null hypothesis. sudep_serotonergic_chemoreflex_model (EMERGING) posits a seizure-count-independent arm via restored postictal 5-HT tone. Causal edges opt into the serotonergic group via hypothesis_groups.

    BIOCHEMICAL: two CO2-response biomarkers. 'Hypercapnic ventilatory response (HCVR) slope' carries a reference_ranges block (-0.94 to 5.39 L/min/mm[Hg], median 1.71, n=68) explicitly annotated as an observed epilepsy-cohort distribution and NOT a healthy-population normal interval, plus two readouts: READOUT_OF/PROGNOSTIC on the chemoreception node and PREDICTS/CANDIDATE_SURROGATE on the SUDEP phenotype. 'BOLD cerebrovascular reactivity (CVR) to CO2' is PHARMACODYNAMIC_MARKER_OF/CANDIDATE_SURROGATE with direction deliberately unset because no directional association has been observed. Neither carries a biomarker_term: NCIT has no term for either measure (verified by OAK search), so they follow the Adult_Neuronal_Ceroid_Lipofuscinosis precedent of an unforced term. The Disease-level surrogate_endpoints slot was deliberately NOT used: SurrogateEndpoint requires FDA-table provenance fields (row_id, source_table, source_sheet, source_row_number) and is scoped to regulatory assertions, which these are not.

    DISCUSSIONS: two KNOWLEDGE_GAP entries with proposed_experiments. gap_dravet_cvr_surrogate_validity records that CVR and HCVR are distinct constructs sharing only a CO2 stimulus, that no publication links CVR to SUDEP risk or CO2 chemoreception, and that fenfluramine's 5-HT2B vascular pharmacology could produce a CVR change with no bearing on chemoreception; its experiment includes a non-serotonergic vasoactive control to separate the two. gap_dravet_serotonin_sudep_human_attribution records that the protective arm rests entirely on mouse pharmacology, that no human study has measured fenfluramine's effect on CO2 chemoreception, and that the human SUDEP evidence is a manufacturer-sponsored historical-control comparison resting on three deaths across 1185 person-years; its experiment uses a seizure-frequency-matched non-serotonergic comparator arm as the discriminating design.

    Seven new references cached via the reference validator (PMID:37160367, 30719703, 34601387, 30756391, 34768178, 37251322, 37584406). Two new ontology terms entered cache/ as a side effect of term validation (GO:0010037, UBERON:0004684). Validated: linkml-validate no issues; reference validator 121/121 snippets verified (up from 100); term validator passed; cache order and term-cache integrity checks pass; a scripted check confirms no dangling downstream/readout/attaches_to/hypothesis_group references.

  summary: Model EEG findings as phenotype post-comp sidecar (revert finding class)
  details: |
    Reversed the ElectrophysiologyFinding sibling class introduced in the prior commit and re-modeled EEG findings as ordinary phenotypes post-composed with an optional electrophysiology sidecar (ElectrophysiologyContext: modality + ictal_state + recording_state). Rationale: EEG/EMG/EKG finding terms are already HP phenotypes (descendants of HP:0000118), unlike imaging (NCIT Imaging Finding) or histopathology (NCIT morphology), so they belong in phenotypes and do not need a dedicated finding class; the modality axis that justified ImagingFinding is near-degenerate for EEG. The four interictal human EEG findings were moved back into phenotypes (category Electrophysiologic, HP-bound, sidecar ictal_state INTERICTAL); the preclinical Scn1a+/- mouse electrographic-seizure finding is a preferred_term-only phenotype with sidecar ictal_state ICTAL, MODEL_ORGANISM. Schema: removed ElectrophysiologyFinding/ElectrophysiologyFindingTerm/ElectrophysiologyFindingDescriptor classes, the electrophysiology_findings and electrophysiology_finding_term slots, and the Disease slot ref; added ElectrophysiologyContext class, an electrophysiology slot on Phenotype; kept the three enums. Design-decision section 10 rewritten to record the reversal and the HP-term-vs-NCIT-term rule; gap table updated with a deferred PhenotypeCategoryEnum + first LinkML rules block follow-up. Validated: linkml-validate, linkml-term-validator, linkml-reference-validator (mouse snippet), pytest schema-validity + Dravet (9 passed).

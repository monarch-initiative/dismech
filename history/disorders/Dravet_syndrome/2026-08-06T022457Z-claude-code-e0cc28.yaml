  summary: Add FAST-DS fenfluramine anti-SUDEP clinical trial (NCT07112365)
  details: |
    Added a clinical_trials block to kb/disorders/Dravet_syndrome.yaml curating NCT07112365 (FAST-DS, 'FINTEPLA as an Anti-SUDEP Therapy in Dravet Syndrome'), a single-arm phase 4 mechanistic study at UTHealth Houston (PI Samden Lhatoo, est. n=25, ages 16+, recruiting). Participants undergo fMRI with a RespirAct-controlled hypercapnia challenge at baseline and after ~60 days of fenfluramine; primary outcomes are the magnitude and speed of the BOLD cerebrovascular response to CO2, with the ventilatory response secondary. Two evidence items cite clinicaltrials:NCT07112365 with exact-substring snippets from the cached ClinicalTrials.gov summary; the reference cache file was created with the reference validator (references_cache/clinicaltrials_NCT07112365.md), not by hand. target_phenotypes bind HP:0033258 (sudden unexpected death in epilepsy) and HP:0002069 (bilateral tonic-clonic seizure), matching the trial's SUDEP focus and its generalized-convulsive-seizure inclusion criterion. A trial-level note records that the endpoints are imaging/physiology biomarkers of postictal cardiorespiratory vulnerability rather than seizure counts or SUDEP incidence, that no results are posted, and that stiripentol and other serotonergic drugs are exclusions. No pathophysiology node was added for a fenfluramine-CVR anti-SUDEP mechanism: a recruiting trial with no posted results is not evidence for a mechanistic claim. Validated with linkml-validate (no issues), the reference validator (100/100 snippets verified), and the term validator (passed).

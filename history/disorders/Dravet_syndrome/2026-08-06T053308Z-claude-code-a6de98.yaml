  summary: Promote verified findings from the OpenScientist SUDEP chemoreflex hypothesis
    review
  details: |
    Promotes four findings from the OpenScientist hypothesis-exploration review of sudep_serotonergic_chemoreflex_model, after the assessment sidecar at kb/hypotheses/Dravet_syndrome/sudep_serotonergic_chemoreflex_model/assessments/openscientist-assessment-by-claude-opus-5.yaml. Each promoted snippet was independently cached with the reference validator and verified as an exact substring; nothing was taken from the provider report on trust.

    1. PMID:30719703 dose dissociation (sudep_serotonergic_chemoreflex_model). Replaced the previous title-quote snippet, which merely restated the paper title, with the substantive result: 15 mg/kg fenfluramine selectively blocks seizure-induced respiratory arrest (P < 0.001) without blocking any convulsive behaviour. Added a second evidence item giving the 21 mg/kg ED50 for seizure reduction. Together these are the load-bearing evidence for the model's separability from the canonical seizure-burden hypothesis, and were present in a paper the entry already cited but under-used.

    2. PMID:31301453 bounding evidence (sudep_serotonergic_chemoreflex_model). New evidence item, supports: PARTIAL: serotonin-reuptake-inhibitor use halved ictal central apnea but showed no association with postconvulsive central apnea, the phase where this model locates fatal chemoreflex failure. Deliberately PARTIAL rather than REFUTE, since SRIs are reuptake inhibitors while fenfluramine is a releaser plus sigma-1 modulator, and an observational null is not a demonstrated absence of effect. The hypothesis notes were extended with two scope caveats surfaced by the review: the single-target 5-HT4 framing is narrower than the wider multi-receptor/noradrenergic literature, and serotonergic protection may act via autoresuscitation rather than chemoreflex gain (PMID:26272185 measured basal ventilation, not the CO2 response slope, so it narrows rather than refutes).

    3. PMID:42501660 (biochemical HCVR readout). Two evidence items on the READOUT_OF/PROGNOSTIC readout: independent replication of the negative interictal-HCVR-to-postictal-hypercapnia association in a larger series (149 GCS from 86 of 351 participants, multivariable models), and the extension that postictal hypercapnia duration is associated with prolonged latency to early signs of recovery of consciousness. This is a 2026 paper that postdated the curator's own literature sweep. It strengthens the prognostic readout but does NOT justify promoting the HCVR biomarker above CANDIDATE_SURROGATE for the SUDEP endpoint, since there is still no death ascertainment.

    4. PMID:29329111 (chemoreception-to-SUDEP causal edge). Dravet-specific human anchor for the respiratory rather than primary-cardiac route to death. The explanation also records the competing central cholinergic terminal-apnea mechanism from the same work, which this entry does not model.

    Deliberately NOT promoted: PMID:29608654. The provider report presented it as human evidence for the serotonergic-deficit node including Dravet cases, but the abstract states the Dravet cases showed less significant alteration, differing from non-epilepsy controls only for somatostatin; the serotonergic deficits were in the mixed SUDEP group. As applied to Dravet the paper cuts against the claim, and promoting it would have asserted something its own source contradicts. Recorded as REJECTED in the assessment sidecar.

    Validated: linkml-validate no issues; reference validator 126/126 snippets verified (up from 121); term validator passed.

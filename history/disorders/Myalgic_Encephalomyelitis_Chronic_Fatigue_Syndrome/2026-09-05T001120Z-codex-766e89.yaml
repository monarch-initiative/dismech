- type: REVIEW
  outcome: changed
  summary: Review ME/CFS pathograph, clinical care and OpenScientist evidence
  details: |
    Phenotype coverage: reviewed the complete original YAML and literature reports; expanded 13 manifestations, distinguished clinical PEM from exercise-test results, corrected orthostatic intolerance and sound sensitivity bindings, and qualified recurrent flu-like symptoms rather than pathogen-proven recurrent infections. Subtype completeness: added four NICE severity grades with explicit separation from unvalidated mechanistic subtypes and accounted for post-infectious, post-COVID, low-flow and high-flow study populations. Pathophysiology depth: rebuilt 24 mechanisms with atomic neurovascular, muscle, immune and CNS observations, hypothetical bridges, counterevidence and model scope; corrected sodium MRI absence, small-fiber-neuropathy denominator, EM controls and CSF cohort interpretation. Treatments/trials: expanded supportive energy management, sleep/pain, orthostatic, severe-disease nutrition/access and optional supportive CBT; distinguished negative rituximab from uncontrolled cyclophosphamide, ex vivo naltrexone and acute pyridostigmine; verified six registry records including LIFT and dose-finding LDN. Genetics: replaced nonspecific HLA-DRB1 with primary HLA-C and HLA-DQB1 susceptibility associations and documented the available DecodeME preprint without assigning causal nearest genes. Biomarkers/diagnostics: added NICE three-month versus CDC/NAM-style six-month clinical evaluation, targeted differential workup, orthostatic assessment and explicit lack of confirmatory biomarkers; included negative ATP-profile replication and CPET heterogeneity. PMIDs/references: retrieved the 29 report citations and additional primary studies, checked cohort/tissue/assay scope and exact source-body evidence; verified six dataset accessions. Overall consumption: read the full original entry, OpenScientist report/citation sidecar and available research reports, checked relevant primary full-text methods and clinical guidance, created a 41-claim assessment with seven unexecuted proposal inventories, and preserved raw provider artifacts. No disease-specific GeneReviews chapter was identified; NICE NG206 and CDC were used for clinical completeness.
     Independent cross-review refined TRPM3 stimulus dependence, negative-evidence direction, hypothetical-edge source attribution and clinical criteria. An omitted 2022 patient serum-vesicle/microglial assay was added with explicit cargo, pooling, control and in-vivo transport limitations.

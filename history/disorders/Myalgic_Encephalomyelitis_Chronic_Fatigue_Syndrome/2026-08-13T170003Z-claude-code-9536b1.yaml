  summary: 'Fix ME/CFS Viral Infections evidence: replace mismatched IOM-report snippet
    with Dubbo cohort study'
  details: |
    The Viral Infections environmental exposure cited PMID:25695122, the IOM/NAP report, with a snippet about clinician hostility toward patients, mislabeled by its explanation as evidence that ME/CFS follows viral infection. Replaced with PMID:16950834, Hickie et al. 2006 BMJ, the Dubbo prospective cohort study, whose conclusion sentence is an exact-quote match: post-infective fatigue syndrome including CFS develops in a significant minority of patients after acute infection with EBV, Coxiella burnetii, or Ross River virus.

    Also confirmed PMID:25695122's missing title/journal in references_cache is not a caching bug -- re-running just fetch-reference PMID:25695122 reproduces the same absent title, matching how this NAP committee-report record is structured upstream in PubMed; that reference remains correctly cited elsewhere in the file for other IOM-report claims.

    Did not add an influences_mechanisms pathograph link for this exposure: the Dubbo study is an epidemiological onset-timing cohort, not a node-level mechanistic claim connecting viral infection to a specific pathophysiology node such as Innate Immune Hyperreactivity, so per the #8085 tranche discipline a link was left out rather than asserted on insufficient evidence.

    Left the SARS-CoV-2 Infection exposure, PMID:33925784, a symptom-overlap count, untouched -- the issue characterizes it as weaker but not wrong, out of scope for this fix.

    Validated with just validate, just validate-terms, just count-verified-snippets 41/48 verified, 7 skipped by prefix, 0 failed, and just check-title-snippets, no new title-quoting snippets.

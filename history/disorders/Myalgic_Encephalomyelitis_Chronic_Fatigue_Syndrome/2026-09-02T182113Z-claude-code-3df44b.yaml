  summary: Integrate assessed OpenScientist PEM-model findings
  details: |
    Assessed the OpenScientist report on exertion_perfusion_muscle_immunometabolic_pem_model (sidecar: kb/hypotheses/Myalgic_Encephalomyelitis_Chronic_Fatigue_Syndrome/exertion_perfusion_muscle_immunometabolic_pem_model/assessments/openscientist-assessment-by-claude-opus-5.yaml, verdict PARTIALLY_SUPPORTED) and promoted its RETAINED and QUALIFIED claims after re-deriving every snippet from references_cache. Added: red blood cell stiffness (PMID:30594919) to Impaired Peripheral Oxygen Extraction and Microcirculation; sodium-23 MRI muscle sodium (DOI:10.1186/s12967-022-03616-z) and the culture-retained glucose-oxidation defect (PMID:33106563) plus a GO:0055078 sodium ion homeostasis process descriptor to Exertion-Triggered Skeletal Muscle Disturbance; a REFUTE-direction cytokine systematic review (PMID:26148446) and post-exercise cerebrospinal fluid metabolomics (PMID:39941050, graded INDIRECT because the cohorts are unpaired) to Delayed PEM Immunometabolic Amplification; orthostatic cerebral blood flow velocity and small fiber neuropathy prevalence (PMID:41576003) to Neuroinflammation and Cerebral Hypoperfusion; and the largest 2-day CPET study (PMID:38965566) at hypothesis level to balance the non-replication already curated there. Corrected propagated error: the hypothesis notes and the gap_mecfs_pem_causal_ordering rationale had repeated the report's claim that the ionic-homeostasis step has no human measurement, which sodium-23 MRI in ME/CFS refutes; both now scope the remaining gap to muscle calcium and to cohort size. Deliberately not integrated: the ATG13 mouse autophagy study (PMID:41591477), because hemizygous atg13 deletion is not a validated ME/CFS model and no human ATG13 evidence exists; and Naviaux baseline hypometabolism (PMID:27573827), because the report never reconciles it against the curated hypermetabolic PEM-window finding. Also rejected in assessment: the report attributes about 50 percent small fiber neuropathy prevalence to PMID:33577778, which reports 31 percent. Verified with count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values.

  details: |
    Batch-2 re-application of the earlier OpenScientist sweep onto current main, after the parallel curation effort had already landed most of it. Applied one citation: PMID:26148446 (Blundell et al. 2015, PRISMA systematic review of 38 case-control cytokine studies) as a REFUTE item on pathophysiology#Proposed Delayed Immunometabolic Amplification, quoting the post-exercise no-difference sentence re-verified against a freshly fetched references_cache record. It generalizes the two single negative studies already on that node (PMID:10226888, PMID:24027260) without duplicating either sentence; graded evidence_source OTHER to match how this entry already grades aggregate review publications such as the NK meta-analysis PMID:39483457, rather than the original sweep's HUMAN_CLINICAL. Also carried over the sweep's one process annotation, GO:0055078 sodium ion homeostasis with modifier DYSREGULATED, onto pathophysiology#Elevated Skeletal Muscle Tissue Sodium, which is the current equivalent of the restructured node it originally targeted and had no biological_processes; the CURIE and its dynamic-enum membership were confirmed present in cache/go/terms.csv and cache/enums/biologicalprocessterm before binding. Both prose corrections the sweep made were checked against main's current text and are already fixed there, more thoroughly than the sweep had them: the false flagship knowledge gap claiming sodium imaging had never been applied to this disease is gone, the hypothesis notes record the correction explicitly, gap_mecfs_pem_causal_ordering now scopes the remaining gap to sodium compartment specificity and causal ordering, and the entry carries the 23Na-MRI pilot PMID:36494667 as its own node plus a biochemical entry; the misattributed small-fiber-neuropathy prevalence now reads 31 percent in the cited cohort with the non-correlation with exertional measures stated. No other sweep citation was outstanding. Copied the missing assessment sidecar openscientist-assessment-by-claude-opus-5.yaml across byte-identically from the os-review-fable branch. Checks: linkml-validate clean, 164/164 snippets verified, duplicate-keys, entity-refs, causal-targets, enum-values, folded-hyphens and snippet-length all OK; validate-hypothesis-assessment clean on the sidecar.

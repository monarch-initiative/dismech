  summary: Remove stale ME/CFS immune-evasion class-tree example
  details: |
    The class-tree design document still referenced the former CD8+ T Cell Exhaustion node, causing the committed-example integration test to fail after recuration. Removed that one example from the immune evasion and immunosuppressive microenvironment class. The current disease node, CD8 T-Cell Exhaustion-Associated State, is explicitly provisional and supported by transcriptional, chromatin and surface-marker profiling; these observations do not establish pathogen immune evasion or a tissue immunosuppressive microenvironment. Merely substituting the current name would preserve that unsupported classification. Disease YAML, assessment and raw report content are unchanged. Validation covers the full node_classes test module, this history record and applicable pre-commit hooks.

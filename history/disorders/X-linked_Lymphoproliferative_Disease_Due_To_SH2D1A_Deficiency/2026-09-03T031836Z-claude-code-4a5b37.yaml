  summary: 'Create: X-linked Lymphoproliferative Disease Due To SH2D1A Deficiency
    (XLP1)'
  details: |
    De novo curation of XLP1 (MONDO:0024551; SH2D1A/SAP; OMIM 308240; X-linked
    recessive).

    Sourcing: no deep-research provider was run. References were found by direct
    PubMed E-utilities search and cached with `just fetch-reference`. GeneReviews
    baseline applied: PMID:20301580 "X-Linked Lymphoproliferative Disease" was
    located, cached, tagged GeneReviews in the top-level `references:` block, and
    its Clinical Characteristics section cross-referenced against `phenotypes:`.
    Every XLP1 finding it lists is captured (HLH / fulminant infectious
    mononucleosis, dys- and hypogammaglobulinemia, malignant lymphoma, liver
    failure, bronchiectasis with recurrent respiratory infection, aplastic
    anemia, vasculitis). XLP2-specific findings (recurrent HLH without EBV,
    enterocolitis, perirectal fistulae) were deliberately excluded as out of
    scope for this entry. The GeneReviews "Agents/circumstances to avoid"
    guidance on EBV contact is reflected in the environmental entry.

    Mechanism: pathophysiology is a nine-node chain. SAP Adaptor Deficiency
    (MOLECULAR; genetic_context GERMLINE / HEMIZYGOUS / LOSS_OF_FUNCTION on
    SH2D1A) leads to SLAM-Family Receptor Signaling Failure, which branches four
    ways - the 2B4/NTB-A inhibitory switch on NK cells, defective EBV-specific
    CD8+ T cell cytotoxicity, absent invariant NKT cell development, and
    defective T-B help / germinal-center formation. The first two converge on
    Uncontrolled EBV-Driven B Cell Proliferation, which feeds both the fulminant
    IM/HLH arm and the impaired-surveillance / B-cell lymphomagenesis arm; the
    T-B help arm feeds Dysgammaglobulinemia. The entry models the SAP defect as a
    qualitative signaling inversion rather than a quantitative loss
    (LOSS_OF_FUNCTION on the adaptor-activity and SH2-binding nodes, DECREASED on
    the downstream cytotoxicity and antibody-production nodes), because the
    primary literature (Parolini 2000 PMID:10934222, NTB-A PMID:11489943, Hislop
    2010 PMID:20644117) shows the SLAM-family receptors deliver inhibitory rather
    than merely absent signals.

    Environmental: primary EBV infection is modeled with `influences_mechanisms`
    TRIGGERS onto the fulminant IM/HLH node, carrying its own link evidence plus
    entry-level evidence. Bound to ECTO:3000001 (exposure to virus) - ECTO has no
    EBV- or herpesvirus-specific exposure term. The description records that EBV
    is a trigger of the acute arm, not a precondition for every manifestation,
    since dysgammaglobulinemia can present without documented EBV infection.

    Classifications: harrisons_chapter IMMUNE_RHEUMATOLOGIC and
    GENETICS_ENVIRONMENT_DISEASE, both evidenced. iuis_category "immune
    dysregulation", evidenced by two byte-verified quotes from the IUIS 2022
    update (PMID:35748970) - the Table 4 row "SAP deficiency (XLP1) SH2D1A XL
    300490" and its subsection heading "7. Susceptibility to EBV and
    Lymphoproliferative Conditions". Both were confirmed as exact
    single-occurrence substrings with `grep -F` before use; the surrounding Table
    4 header is PDF-corrupted ("dysr egulation") and was not quoted.

    Scope: kept complementary to the existing Hemophagocytic_Lymphohistiocytosis
    entry, which already carries XLP1 and XLP2 as HLH-predisposing subtypes and
    models general HLH pathophysiology and the HLH-94/HLH-2004 protocols. A
    top-level `notes:` scope statement and two node descriptions cross-reference
    it explicitly. XLP2 (XIAP/BIRC4, MONDO:0010385) is out of scope and is
    separately claimed in issue #10110.

    Prevalence: approximately one affected male per million (PMID:31754776),
    recorded with prevalence_class BAND_1_9_PER_1000000 and rate_per_100000 0.1.
    measure_type is UNKNOWN rather than POINT_PREVALENCE because the source says
    only "estimated to affect", without specifying point prevalence or birth
    incidence. The notes record two caveats: the figure covers X-linked
    lymphoproliferative syndrome as a whole (XLP1 plus XLP2), and Orphanet
    epidemiology for ORPHA:538931 could not be consulted because the Orphadata
    bulk XML is absent from this worktree (only data/orphadata/MANIFEST.yaml is
    present).

    Validation: `just validate` passed all three stages (schema, terms,
    references). 73/73 snippets verified against the cached references. `just
    validate-disorders` - the authoritative batched gate - passed.
    `just check-duplicate-keys` and `just check-entity-refs` passed on the file.
    Whole-KB gates check-title-snippets, check-snippet-grading,
    check-folded-hyphens and check-environmental-evidence passed.
    check-snippet-length and check-reference-titles report pre-existing whole-KB
    findings only, with zero occurrences attributable to this file; those two
    fail in this worktree because the branch point is behind origin/main, not
    because of this change.

    Housekeeping: stubs/X-linked_Lymphoproliferative_Disease_Due_To_SH2D1A_Deficiency.yaml
    deleted as part of this curation. The generic
    stubs/X-linked_Lymphoproliferative_Syndrome.yaml was deliberately left in
    place. Claim issue #10109 was not modified.

  summary: 'Create: Gyrate Atrophy of the Choroid and Retina'
  details: |
    New entry for OAT deficiency / gyrate atrophy, an inborn error of metabolism presenting as a chorioretinal dystrophy. Four pathophysiology nodes from ornithine aminotransferase deficiency through systemic hyperornithinemia to chorioretinal atrophy and field loss. The edge from hyperornithinemia to retinal atrophy is deliberately typed INDIRECT_UNKNOWN_INTERMEDIATES rather than DIRECT, because no single established mechanism explains why a systemic metabolite excess damages only the eye; the corresponding KNOWLEDGE_GAP records that. Treatments capture the genotype-dependence that matters clinically: arginine restriction works for any genotype because it acts upstream of the enzyme, whereas pyridoxine acts on the enzyme itself and fails outright in folding-defect alleles such as the Dutch founder p.Gly353Asp. A GO label mismatch (ornithine aminotransferase activity vs L-ornithine transaminase activity) was caught by term validation and corrected, and one snippet had to be rewritten because a bracketed radiolabel span is stripped before matching. Validated: linkml-validate clean, term validation passed, 19 of 19 snippets verified.

  summary: 'Create: Scott Syndrome (MONDO:0009885, BDPLT7)'
  details: |
    Curated Scott syndrome as the worked conformer for the PROCOAGULANT arm of primary_hemostatic_plug_failure - the module's narrowest arm, which it gates on phosphatidylserine-exposure or procoagulant-activity evidence rather than on a clotting abnormality. That gate is met directly here. Stub deleted.

    The entry deliberately does NOT conform to the adhesion, secretion or aggregation arms: collagen-induced aggregation is explicitly preserved, and curating any of those would be false. This is the one member of the family that an aggregometry-based definition would miss entirely, which is part of why the grouping's membership criterion was written on module conformance rather than on laboratory phenotype.

    Rarity constrained what could honestly be curated, and those constraints are recorded in-file: (1) no prevalence record, because no denominator exists anywhere in the literature - only a handful of patients have ever been described; (2) the consequence node is named 'Bleeding Diathesis' rather than 'Mucocutaneous Bleeding Diathesis', because the site distribution characteristic of the wider family is not separately established for this disorder and importing it from the module would be extrapolation; (3) several quantified statements about platelet behaviour come from the Ano6-deficient mouse and are tagged MODEL_ORGANISM even where the source presents them as phenocopying the patient, so the model dependency is visible rather than buried.

    Historical synonyms (prothrombin consumption deficiency, platelet factor X receptor deficiency) are retained because they are how the disorder appears in older literature and because they record something true: the phenotype really is one of defective thrombin generation, reached through a platelet membrane defect.

    One KNOWLEDGE_GAP: whether the bleeding is fully explained by loss of scrambling, given that ANO6-deficient platelets also show reduced calcium-dependent swelling, membrane blebbing and calpain-dependent cleavage - and blebbing is how procoagulant microparticles are shed.


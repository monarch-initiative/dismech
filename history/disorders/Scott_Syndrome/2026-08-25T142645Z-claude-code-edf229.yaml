  summary: Relabel mouse-phenocopy item MODEL_ORGANISM; add human support so the node
    is not model-only
  details: |
    Round-5 review: two blocking evidence_source mislabels in the previous commit's restored content, plus two non-blocking ones swept while in the file.

    BLOCKING, both in b13148fb's restorations, both correct findings:
      1. "These protein-protein interactions are entirely based on computational predictions..." was tagged HUMAN_CLINICAL. Now COMPUTATIONAL. This is the one that bites: the item exists specifically to record that the predicted WDFY3/LYST interactome is UNMEASURED, and HUMAN_CLINICAL asserts the opposite about how it was obtained - so the label contradicted the only claim the item is there to make. Structurally identical to the round-1 HP:0011869 finding, where a term asserted the opposite of the curated finding.
      2. "Our previous microarray data in GPS fibroblasts showed overexpression of fibronectin..." was tagged HUMAN_CLINICAL. Now IN_VITRO - the measurement is a microarray on cultured patient fibroblasts, which CLAUDE.md classifies as IN_VITRO ("cultured cells or tissue explants (human or animal)"). Both explanations now state the reason for the classification so the next reader does not have to re-derive it.

    NON-BLOCKING, fixed in the same pass:
      3. Scott_Syndrome Bleeding Diathesis node cited "mouse deficiency of Ano6 ... phenocopies the complex changes in platelets from hemostatically impaired patients" as HUMAN_CLINICAL. The reviewer noted the explanation narrowed it defensibly to the human clause but that the sentence's substance is a mouse phenocopy. Relabelled MODEL_ORGANISM. That created a second problem the reviewer did not raise: it would have left a human phenotype node supported by model-organism evidence alone, which the evidence policy warns against. Added a genuine human item from PMID:21958383 ("is deficient in patients with Scott syndrome, a rare inherited bleeding disorder with defective platelet procoagulant activity") so the node keeps human support. Fixing the label without noticing that consequence would have traded one defect for another.
      4. Gray_Platelet_Syndrome's "neutrophils derived from in vitro differentiation of patient hematopoietic progenitors" was tagged HUMAN_CLINICAL. Now IN_VITRO. This item came from PR #9459 and is on main; the reviewer explicitly said it was not this PR's to fix but was "worth a sweep whenever GPS is next touched". GPS is being touched here and the file is already substantially edited by this branch, so leaving a known-wrong enum in it was the worse option. Flagged in the PR comment as an edit to inherited content, with an offer to revert.

    SWEEP. Rather than fixing only what was reported, ran a mechanical check across the whole tranche (five new disorder entries plus the module): flag any evidence item tagged HUMAN_CLINICAL whose snippet contains in-vitro, model-organism or computational cue words. One hit, and it is a false positive: the module's PMID:21781244 item whose snippet ends "...remain better understood in mouse models". The sentence's primary claim is about human agonist-receptor mutations (P2Y12, TXA2R, GPVI in patients) and the mouse clause is a caveat about the intracellular half - which that item's explanation already states explicitly. HUMAN_CLINICAL is correct there and was left alone.

    This is the fourth instance in this PR of a mechanical audit surfacing something a reading pass missed, after the 397-title reference_title sweep, the check-groupings module-vs-node granularity gap, and the (reference, snippet) set-difference on the reconciliation. The recurring shape: a check passes for a reason narrower than the claim it appears to confirm.

    Validation: Gray_Platelet_Syndrome 78/78 snippets, Scott_Syndrome 20/20 (up from 19 with the added human item), schema and terms pass on both, grouping audit nine members all SATISFIED on both criteria, duplicate-key and folded-hyphen gates clean.

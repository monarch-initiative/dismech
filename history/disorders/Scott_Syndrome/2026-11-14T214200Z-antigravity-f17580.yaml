  details: |
    Removed the unsupported human-clinical PMID:21958383 evidence item from Prolonged Bleeding Time and scoped its description explicitly to the Ano6-deficient mouse model. Updated Bleeding Diathesis.description to align with notes and PMID:33147934 (predominantly post-surgical, post-traumatic, menstrual, and postpartum bleeding with rare spontaneous mucocutaneous hemorrhage). Added Postpartum Hemorrhage (HP:0011891) as a distinct phenotype wired from Bleeding Diathesis, added a biochemical entry for Elevated Residual Serum Prothrombin (PMID:33147934), and updated Platelet Transfusion therapeutic_modality from CELL_THERAPY to OTHER while noting class-level rFVIIa and antifibrinolytic options.

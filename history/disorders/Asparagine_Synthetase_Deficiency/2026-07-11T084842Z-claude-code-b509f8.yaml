  summary: 'Create: Asparagine synthetase deficiency ASNS'
  details: |
    Created new disorder entry Asparagine synthetase deficiency [ASNSD, MONDO:0014258, OMIM:615574, ORPHA:391376; causal gene ASNS/hgnc:753] as the next WP-004 increment for issue 5559. NEC preflight passed: MONDO:0014258 definition/OMIM/Orphanet/gene all match the intended entity. Debundled pathophysiology: ASNS loss of function to cerebral asparagine deficiency with rise in substrate glutamate/aspartate, then two non-exclusive downstream arms recorded as mechanistic_hypotheses: impaired cortical development to congenital-progressive microcephaly, and aspartate/glutamate excitotoxicity to epileptic encephalopathy plus progressive cerebral atrophy. Three verified PMIDs with exact-quote snippets: 24139043 Ruzzo Neuron 2013 seminal, 25227173 Ben-Salem, 27522229 Gataullina; a memory-recalled PMID 23273982 was discarded after it resolved to an unrelated PRC2 paper. Deliberately NOT conformed to metabolic_intoxication_decompensation because ASNSD is a deficiency/CNS-restricted IEM, not an intoxication/hyperammonemia disorder. Added MONDO:0014258 to the diseaseterm enum cache as a genuine descendant of MONDO:0000001. Passes schema, terms, references, and graph validation.

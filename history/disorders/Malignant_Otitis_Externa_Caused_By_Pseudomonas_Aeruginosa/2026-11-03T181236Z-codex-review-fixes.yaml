  summary: Address malignant otitis externa review findings
  details: |
    Added reviewer-requested external-canal edema and otorrhea signs from the
    88-patient outcomes cohort, plus canal granulation tissue from a human
    otoscopic case; connected those presenting findings, skull-base
    osteomyelitis, and cranial-nerve paralysis to their causal mechanisms.

    Added Spain annual-incidence and England Hospital Episode Statistics
    prevalence records, a poor-prognosis phase with disease-specific mortality
    predictors, FDG PET-CT response monitoring, named ciprofloxacin and
    ceftazidime agents, ciprofloxacin/ceftazidime resistance evidence,
    refractory-case hyperbaric oxygen as an adjunctive treatment, and an aural
    water exposure and cerumen-irrigation environmental trigger. Updated
    review-level evidence quote roles to use REVIEW_SYNTHESIS.

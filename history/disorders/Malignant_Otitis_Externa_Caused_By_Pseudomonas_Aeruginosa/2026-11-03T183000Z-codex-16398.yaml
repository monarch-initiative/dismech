  summary: Create the Pseudomonas malignant otitis externa disorder entry
  details: |
    Added the MONDO:0041095 child scoped to malignant otitis externa caused by
    Pseudomonas aeruginosa. The entry binds the disease to MONDO and the
    pathogen to NCBITaxon:287; records the human external-canal acquisition
    route; separates the external auditory canal, skull-base, and cranial-nerve
    extension steps; and backs ear pain, osteomyelitis, facial palsy, cranial
    nerve palsy, extensive-disease progression, diagnosis, and antipseudomonal
    treatment with cached PubMed evidence.

    The starting OpenScientist report was validated for references and terms.
    Reference validation found no unresolved citations. The report's suggested
    HPO/CHEBI rows contained incorrect labels, so every ontology term used in the
    curated YAML was re-checked with OAK/OLS or reused from existing validated
    NCIT and NCBITaxon bindings.

  summary: Add semaglutide weight-independence hypothesis; bound the fibrosis treatment
    edge
  details: |
    Added the mechanistic_hypotheses entry semaglutide_weight_independent_hepatic_effect, asking whether semaglutide's MASH benefit survives at matched weight loss, with six evidence items spanning both directions: two negatives on the cell-autonomous form (Pyke's validated-antibody plus ligand-binding negative in primate liver; no lipid, fibrotic or CREB response in primary human hepatocytes and stellate cells), the contradicting 24.6% lipogenesis fall in the same cell type retained rather than omitted, the randomised matched-weight-loss trial that found liver outcomes equal to lifestyle, the survodutide mediation split as the only numerically reported one in the class, and the MASH-cirrhosis trial. Status EMERGING; the description states that present evidence favours the weight-mediated account.

    Revised the Semaglutide treatment's target_mechanisms edge onto Hepatic Stellate Cell Activation and Fibrosis. It previously asserted that the drug 'acts on the fibrogenic arm and not only on the upstream metabolic trigger'. That overstates what ESSENCE shows: on its marginal proportions, fibrosis improvement outside the resolution stratum is about 4 percentage points on semaglutide against about 6 on placebo, and in MASH-related cirrhosis, where fibrosis is no longer coupled to steatohepatitis activity, fibrosis improvement was numerically lower on semaglutide (11% vs 29%, OR 0.28). The edge is kept, since the fibrosis benefit is real, but its description now leaves open whether the action is direct or downstream and points at the hypothesis. Added the cirrhosis trial as a bounding REFUTE item on that edge.

    Research provenance: an OpenScientist run (max_iterations=2) is committed under kb/hypotheses/ with an assessment sidecar by claude-opus-5. Verdict PARTIALLY_SUPPORTED: the report's headline conclusion holds and its two load-bearing quotes verify verbatim, but it asserted that no weight-matched trial exists when two randomised ones do, presented the contested hepatocyte GLP1R question as settled while omitting both the contradicting functional result and the antibody-validation literature, and inferred a larger direct fibrosis component from a dual-agonist figure it had itself ruled non-transferable. The data source is recorded UNVERIFIABLE rather than ACCESSED because no search log was committed.

    Validation: linkml-validate clean; 141/141 snippets verified against the reference cache; duplicate-key, enum-value, entity-ref and causal-target checks pass.

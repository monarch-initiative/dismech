  summary: Add adipose-liver NAM models and the hepatic fatty acid uptake step to
    MASLD
  details: |
    Extends the MASLD entry along two connected lines drawn from the Stahl
    laboratory (UC Berkeley / UCSF): the mechanism of hepatocyte fatty acid
    entry, and the human non-animal systems that model the adipose tissue-liver
    axis.

    New pathophysiology node "Transporter-Mediated Hepatic Fatty Acid Uptake"
    (MOLECULAR), between the cardiometabolic trigger and Hepatocyte Lipid
    Overload, bound to SLC27A5 (hgnc:10999) and SLC27A2 (hgnc:10996),
    GO:0044539 (marked INCREASED for flux, not transporter expression) and
    GO:0005324. The KB previously modeled hepatic lipid inflow only as de novo
    lipogenesis, storage and beta-oxidation; protein-mediated uptake was absent
    from the whole knowledge base. Two new causal edges: cardiometabolic
    trigger -> uptake (substrate delivery), uptake -> lipid overload
    (rate-limiting on the emerging hypothesis).

    New mechanistic hypothesis hepatic_fatty_acid_uptake_masld (EMERGING) --
    that hepatocellular fatty acid entry is protein-mediated, rate-limiting and
    druggable. Deliberately not CANONICAL: all causal evidence is murine, no
    human SLC27A5/SLC27A2 genetic signal is curated here, and the FATP5
    knockdown paper's own summary sentence reports a fall in whole-animal
    caloric uptake alongside the hepatic effect. That confounding sentence is
    curated as its own evidence item, graded SUPPORT + directness INDIRECT,
    rather than being omitted.

    New animal_models section (3 models, all with modeled_mechanisms and
    readouts): AAV8-shRNA hepatic FATP5 knockdown (PERTURBS the uptake node,
    RESCUES lipid overload -- reversal of established disease), FATP5 knockout
    (PERTURBS; limitations record the bile acid/CoA ligase second function and
    lipid redistribution to other tissues), and AAV8-shRNA hepatic FATP2
    knockdown (independent replication through a second gene, steatosis reduced
    under continued high-fat feeding).

    New experimental_models section (4 NAMs, one platform lineage). The
    interconnected isogenic iPSC adipocyte-hepatocyte-macrophage MPS
    (PMID:39266553) RECAPITULATES the cardiometabolic trigger and hepatocyte
    lipid overload and MEASURES the new uptake node; it is the model that
    separates adipose inflammation from adipose expansion, which whole-animal
    models confound. The iMAC-iADIPO MPS (PMID:37104853) recapitulates the
    adipose limb including crown-like structures. The metabolically competent
    iADIPO-MPS (PMID:34761526) is included as platform qualification -- it
    establishes baseline insulin sensitivity, without which a later loss of
    insulin sensitivity is uninterpretable. The heterochronic-serum aging chip
    (PMID:41882175) is linked as MEASURES with fidelity UNKNOWN and explicit
    limitations, because it reports no MASLD endpoint.

    Semaglutide: added an INDIRECT IN_VITRO evidence item to the existing
    cardiometabolic target_mechanisms edge. Compartment-selective dosing in the
    chip showed the drug reproduces the whole-system benefit when applied to
    adipocytes alone and not when applied to hepatocytes alone. Curated as
    mechanism evidence on the existing edge, not as a new node -- the efficacy
    claim still rests on the phase 3 trial.

    New discussion hmm_masld_hepatic_fatp_uptake_human_translation
    (HUMAN_MODEL_MISMATCH, OPEN). The mismatch is specific and actionable: the
    human MPS already measures hepatocyte fatty acid uptake as a primary
    endpoint but has never been reported with the transporters knocked down, so
    the system that could adjudicate the rodent hypothesis has been used to
    observe the flux and not to test what gates it. The proposed experiment is
    that knockdown, with structured perturbations, readouts, three controls and
    paired supporting/refuting outcomes.

    Validation: linkml-validate clean; term validation passed; 134/134 snippets
    verified against the reference cache (31 newly added, all exact substrings
    of freshly fetched caches); duplicate-key, entity-ref, folded-hyphen,
    snippet-length, title-snippet, snippet-grading and environmental-evidence
    gates all clean. 11 new reference caches fetched via the sanctioned
    fetch-reference path.

    Deliberately not done: no comorbidity entry, no datasets block, no CoQ or
    brown-adipose-tissue mechanism (the Stahl CoQ/CD36 and actomyosin-tension
    work is real and cited in the literature scan, but it is BAT and
    thermogenesis biology with no curated MASLD link, so importing it here
    would assert a connection the evidence does not carry). Entry notes record
    each of these choices so a later curator does not silently reverse them.

  summary: Add zalfermin treatment and NCT05016882 trial
  details: |
    Added Zalfermin (investigational FGF21 analogue, NCIT:C203220) from the Loomba et al. 2026 phase 2 trial (PMID:42456707, NCT05016882). Mechanism edges on the cardiometabolic and hepatocyte lipid nodes cite the J Med Chem development paper (PMID:39013015), the first-in-human study (PMID:41351276) and the mouse MASH study (PMID:41150667), all graded INDIRECT. Treatment-level evidence records that the primary fibrosis endpoint was not met for zalfermin 30 mg plus semaglutide or zalfermin alone (REFUTE). Added the trial's nominal semaglutide 2.4 mg fibrosis result to the Semaglutide treatment, and a clinical_trials record for NCT05016882. Snippets are from the abstract; MASH-resolution figures from the full text are described in prose only. Validated with just validate, validate-terms and count-verified-snippets.

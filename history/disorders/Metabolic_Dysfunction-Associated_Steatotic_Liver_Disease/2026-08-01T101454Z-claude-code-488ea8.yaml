  summary: 'Create: Metabolic Dysfunction-Associated Steatotic Liver Disease (MASLD)'
  details: |
    Created a new MASLD disease entry (MONDO:0013209) in response to issue #6009. Modeled the canonical lipid-overload/lipotoxicity chain with five nodes conforming to the hepatic_steatosis_lipotoxicity module, added a MASLD-specific cardiometabolic trigger node, and added the issue's mitophagy mechanism as an explicitly EMERGING amplifier hypothesis (impaired_mitophagy_amplifier) rather than as established causal fact. Added PNPLA3 rs738409 and TM6SF2 p.Glu167Lys susceptibility nodes and genetic records, MASL and MASH subtypes, structured worldwide prevalence and incidence, and six treatments (lifestyle weight loss, resmetirom, semaglutide, vitamin E, pioglitazone, bariatric surgery) with target_mechanisms. All 48 evidence snippets verified against the fetched reference cache; schema and term validation pass.

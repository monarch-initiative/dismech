  summary: Add the OSA chronic-intermittent-hypoxia arm to MASLD
  details: |
    Curated an obstructive sleep apnea / chronic intermittent hypoxia (CIH) arm onto the MASLD pathograph in response to issue #8477 ([preprint-scan] MASLD-OSA mechanistic link, PPR:PPR1293874). The entry previously had zero coverage of OSA, hypoxia or sleep -- grep for apnea/apnoea/hypoxia/CPAP/OSA over the file returned nothing.

    Added: one EMERGING mechanistic_hypotheses group (osa_intermittent_hypoxia_masld); two pathophysiology nodes -- "Obstructive Sleep Apnea-Associated Chronic Intermittent Hypoxia" (ORGANISM, trigger) and "Hypoxia-Driven Hepatic Lipogenesis and Oxidative Stress" (CELLULAR, amplifier) -- feeding the existing Hepatocyte Lipid Overload, Hepatocyte Injury and Inflammatory Activation, and Hepatic Stellate Cell Activation and Fibrosis nodes; and one KNOWLEDGE_GAP discussion (kgap_masld_osa_cpap_hepatic_benefit) with two proposed experiments, recording that CPAP monotherapy RCTs are null for hepatic endpoints while the observational and murine arms are positive.

    Evidence discipline. The preprint named by the issue is cited exactly once, in the discussion, and is not the sole support for any claim: the same null CPAP result is carried by the peer-reviewed randomized-trial meta-analysis PMID:29151428. The contested fibrosis edge carries both a SUPPORT (PMID:40884485 -- biopsy-proven cohort with in-lab polysomnography, association survives adjustment for obesity) and a REFUTE (PMID:32843301 -- 2218-patient individual-participant meta-analysis, AHI severity not associated with fibrosis, relation mediated by BMI), so the disagreement is represented in the graph rather than resolved by fiat. The murine exposure studies (PMID:16123334, PMID:16507783) are tagged MODEL_ORGANISM and supply the causal direction the observational human data cannot; the human oxidative-stress measurements (PMID:27501738) are paediatric and the description says so.

    Deliberately NOT curated, and recorded in the entry notes so a later curator does not silently reverse them: CPAP as a treatment with a target_mechanisms edge (the pooled randomized evidence is null); a separate sleep-fragmentation node (the studies separating the two components attribute the hepatic signal to the hypoxic one, and the fragmentation arm belongs to Obstructive_Sleep_Apnea, whose kgap_osa_multiorgan_fibrosis discussion already names the liver); and a com_ comorbidity entry for the pair (the interventional evidence is null and the fibrosis limb is contested).

    Validation. just validate (pass), just validate-terms (pass), just count-verified-snippets 94/94 verified against cached references, just check-snippet-boundaries (clean). All seven offline gates run and pass: check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence, check-duplicate-keys, check-source-defect-claims, check-not4curation. 6900 selected tests/test_data.py tests pass. Final batched sweep just validate-disorders exits 0 with 94/94 snippets verified.

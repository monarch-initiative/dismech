  summary: 'Review response: attach human counter-evidence to the OSA hypoxia lipid-overload
    and injury edges'
  details: |
    Addressed the single blocking IMPORTANT finding on PR #9398 (ai4c-reviewer, 2026-08-24T17:03Z): the PR's own "represent the disagreement in the graph" principle had been applied to only one of three edges.

    Changes, all using references already cached on this branch (no new fetches):

    - "Hypoxia-Driven Hepatic Lipogenesis and Oxidative Stress" -> "Hepatocyte Lipid Overload" edge: added PMID:32843301 (SUPPORT, HUMAN_CLINICAL), quoting the multivariable result in which an apnea-hypopnea index > 5/h is an independent risk factor for steatosis alongside BMI in 2120 patients; and PMID:40884485 (REFUTE, HUMAN_CLINICAL), quoting "No association was observed between moderate to severe OSA and steatosis or nonalcoholic steatohepatitis." Extended the edge description to state that the two results disagree and that they score steatosis differently (noninvasive Hepatic Steatosis Index in 2120 patients versus liver histology in 97).
    - "... -> Hepatocyte Injury and Inflammatory Activation" edge: added the same PMID:40884485 REFUTE item, which is NASH-CRN-scored on percutaneous biopsy and so is a direct negative measurement of this edge's endpoint. Extended the description to record that the edge rests on the measured peroxidation readout rather than on the OSA diagnostic label.
    - mechanistic_hypotheses "osa_intermittent_hypoxia_masld": rewrote reason (1) of the EMERGING rationale, which had said only the steatosis association was robust to adjustment. That is no longer the whole picture once the biopsy cohort's negative steatosis/NASH result is curated: the two human datasets invert each other endpoint by endpoint, so the description now says so and notes that each edge carries both results.

    No new PMIDs were introduced; the fibrosis edge, the KNOWLEDGE_GAP discussion, and the position that CPAP is not curated as a MASLD treatment are unchanged.


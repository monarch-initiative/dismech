  summary: 'Address review on #7649: add diagnosis + histopathology, fix cirrhosis
    evidence, semaglutide phase 3'
  details: |
    Curation-scanner run responding to the two CHANGES_REQUESTED reviews on PR #7649. Added a seven-entry diagnosis section (cardiometabolic positive criteria plus the cryptogenic-SLD residual, MetALD alcohol thresholds, CAP ultrasound, VCTE, MRI-PDFF, FIB-4, liver biopsy) sourced from the multisociety Delphi consensus (PMID:37363821) and the resmetirom phase 3 full text (PMID:38324483), both already cached in this PR. Added a four-finding histopathology section covering the three NAFLD activity score components (macrovesicular steatosis NCIT:C82990; lobular inflammation NCIT:C35978; hepatocellular ballooning left deliberately unbound because NCIT codes only the grading assessment NCIT:C181484, not the morphologic finding, and HP:0033193 is not reachable from HP:0025461) plus perisinusoidal-to-bridging fibrosis (NCIT:C3044). Replaced the Cirrhosis phenotype's sole evidence -- an in-vitro paper's introductory background sentence -- with liver-related-event hazard ratios from the 619-patient longitudinal cohort (PMID:25935633); this also resolved the IN_VITRO-versus-OTHER evidence_source inconsistency for PMID:34674097. Superseded the phase 2 semaglutide fibrosis null result with the ESSENCE phase 3 interim analysis (PMID:40305708, newly fetched with just fetch-reference) and added a target_mechanisms edge onto the fibrogenic node; the phase 2 null is retained with an explanation marking it superseded. Validation: just validate passes schema and term validation, and reference validation reports 69 of 69 snippets verified, up from 50 of 50. All 19 new snippets were independently pre-verified as whitespace-normalized exact substrings of their cached files before any edit was made. tests/test_snippet_length.py passes (18 tests); the only test_data.py failure is the pre-existing test_non_therapeutic_actions_do_not_use_treatment_targets on files this PR does not touch.

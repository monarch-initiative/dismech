- type: EDIT
  outcome: changed
  sections:
  - diagnosis
  summary: Add FibroScan LSM and CAP interpretation bands
  details: |
    Added reference_ranges with interpretation_bands to the transient elastography and CAP diagnosis rows. Liver stiffness: AASLD 2023 practice guidance risk bands (<8, 8-12, >12 kPa; PMID:36727674) and Eddowes 2019 biopsy-validated fibrosis-stage cut-offs (8.2/9.7/13.6 kPa; PMID:30689971). CAP: Eddowes 2019 steatosis-grade cut-offs (302/331/337 dB/m). Bound the elastography measurement to LOINC:77615-3, seeded via just loinc-seed-cache; no CAP LOINC code was found in the Monarch KG. The MSKCC patient-education page on FibroScan results was the lead; its own disease-specific ranges were not used because they overlap or leave gaps and are described there as estimates.

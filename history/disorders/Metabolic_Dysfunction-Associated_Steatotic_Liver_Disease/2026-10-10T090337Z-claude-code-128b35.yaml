  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED review on PR 13833.

    Regraded PMID:24467746 from HUMAN_CLINICAL to IN_VITRO. The reviewer is right: the study is immunohistochemistry plus in-situ 125I-GLP-1 ligand binding on tissue specimens, which CLAUDE.md files under IN_VITRO, not an observation in patients or a cohort. The explanation now also records that the quoted sentence says 'primate' because the survey spans monkey and human tissue, so the hepatic negative rests on specimens of both — the 'human' part that the incorrect HUMAN_CLINICAL grade had been carrying implicitly.

    Widened the PMID:26394161 snippet to 'a finding endorsed by the effect of GLP-1 receptor agonist on primary human hepatocytes (24.6% decrease in lipogenesis vs. untreated controls; p<0.01)'. The previous quote began mid-parenthesis and left the agent and the cell type outside it, which is the load-bearing content: the item earns its place only because the effect is in primary human hepatocytes, the same cell type where PMID:39607493 found nothing.

    Widened the PMID:42545725 snippet to open at 'the percentage of the total treatment effect mediated by weight reduction' rather than mid-parenthesis at 'indirect effect)', so the quote is self-describing.

    Declined the suggestion to opt the Semaglutide fibrosis target_mechanisms edge into hypothesis_groups. The slot does not exist on TreatmentMechanismTarget, whose slots are target, treatment_effect, description and evidence; hypothesis_groups is a CausalEdge slot, reached through pathophysiology downstream edges. Making a treatment edge carry it is a schema change rather than a curation edit, so it is out of scope for this PR.

    Validation after the fixes: linkml-validate clean; 141/141 snippets still verified; duplicate-key, enum-value, entity-ref, causal-target and snippet-grading checks pass.

  summary: Add LSEC endothelial dysfunction arm to MASLD
  details: |
    Scoping work for kgap-scan issue 6352 (endothelial dysfunction as the shared Atherosclerosis-MASLD axis). Repo survey found the vascular limb already modeled (kb/modules/atherogenesis.yaml node 'Endothelial Dysfunction and Subendothelial LDL Retention') while the MASLD entry carried no endothelial content at all. Added the hepatic limb: a new pathophysiology node 'Liver Sinusoidal Endothelial Cell Dysfunction and Capillarization' (CL:1000398; GO:0016236 DECREASED, GO:0050900 INCREASED) with downstream DIRECT edges to 'Hepatocyte Injury and Inflammatory Activation' and 'Hepatic Stellate Cell Activation and Fibrosis', plus a new EMERGING mechanistic_hypotheses group 'sinusoidal_endothelial_dysfunction_masld' that both edges opt into. Human histology anchors the node (PMID:31726115, HUMAN_CLINICAL); the endothelium-specific mouse model is recorded as PARTIAL/MODEL_ORGANISM on the hypothesis so the causal direction is not overstated. No cross-disease module or comorbidity entry was created - that remains the open scope decision on issue 6352. Validated with 'just validate' (schema + terms + references): passed, 79/79 snippets verified against cached references.

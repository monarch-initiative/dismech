  summary: Expand Pinta from stub to full entry; bind T. carateum to NCBITaxon
  details: |
    Pinta was the thinnest entry in the treponematoses group at 119 lines: one pathophysiology node, one phenotype bound to the most generic pigmentation term available (HP:0001000), and a references block whose four findings all quoted the paper title as their own supporting text.

    Agent binding. Treponema carateum previously had no infectious_agent_term, alone among the four treponematoses. Bound to NCBITaxon:3712027, verified live against OLS rather than taken from the deep-research report. The entry deliberately asserts neither that T. carateum is a distinct species nor that it is a T. pallidum subspecies: the literature retains separate species rank only because the organism has never been cultivated or sequenced, so the genomic comparison that assigned pertenue and endemicum has never been run. That reasoning is recorded in notes so a future reclassification reads as new evidence rather than as a correction here.

    Content added. Transmission (direct skin-to-skin contact), two structured prevalence records (a 1980s Panamanian survey at 20%, and an explicit NOT_YET_DOCUMENTED record for current burden), epidemiology, the three clinical stages, three histopathology findings including the negative finding that pinta lesions do not ulcerate, two diagnosis entries centred on the fact that serology cannot separate the treponematoses, and four differential diagnoses drawn from the dyspigmentation mimics.

    Pathophysiology went from one node to five, chained: cutaneous inoculation to intradermal dissemination to melanocyte injury and basal melanin loss to dermal melanophage accumulation with epidermal atrophy, plus the pre-existing beta-lactam target node that conforms to bacterial_cell_wall_synthesis_inhibition. The pigmentary chain is what makes pinta mechanistically distinct from its siblings, and it was entirely absent before.

    Phenotypes went from one to twelve. Five of the CURIEs suggested by the Falcon deep-research report named different concepts entirely and were not used: HP:0000952 is Jaundice not hyperpigmentation, HP:0000953 is hyperpigmentation not abnormal skin pigmentation, HP:0000962 is Hyperkeratosis not skin atrophy, HP:0000958 is Dry skin not scaly skin, and HP:0032316 is Family history not plaque of skin. Correct terms were found by OLS search and every binding passes validate-terms. Note HP:0000962 does appear in the entry, but as Hyperkeratosis, the concept it actually names, not as the skin atrophy the report labelled it.

    Evidence. Two references were newly fetched (DOI:10.1371/journal.pntd.0002283 and DOI:10.15585/mmwr.rr7301a1), both returning full text. Running the reference validator also upgraded PMID:26304920 (Stamm) from abstract_only to green-OA full text, which turned out to matter: the full text supplies the stage intervals (about 3 weeks to the primary lesion, several months to the secondary stage, 2-5 years to late disease), regional lymphadenopathy, hyperkeratosis, the sub-24-hour loss of infectiousness after penicillin, and the explicit statement that treatment cannot reverse late skin changes. Several claims that had been written as prose without a citation are now cited from it, and two phenotypes were added.

    All 59 snippets were verified as exact substrings of their cached references under whitespace and dash normalisation. This had to be done manually: linkml-reference-validator skips the DOI: prefix, so 38 of them are reported as 'skipped by prefix' and are not covered by the automated gate at all. Snippets were also checked to contain no bracketed citation markers, since the validator strips bracketed content from the query side but not from the cached text, and to avoid PDF hyphenated line breaks.

    Two entries dropped from references. DOI:10.1111/ijd.15264 (Rosa 2021) caches as content_type: unavailable so no snippet can be verified against it, and DOI:10.3389/fimmu.2023.1126170 is about syphilis, not pinta; its recorded finding quoted a sentence naming T. pallidum subsp. pallidum.

    Deliberate omissions recorded in notes: no azithromycin treatment (documented for yaws, not for pinta in the sources reviewed; adding it would be inference), and no clinical_trials, datasets, animal_models or computational_models, because a non-cultivable organism with no sequenced isolate has none.

    Validation run: linkml-validate, just validate-terms, just count-verified-snippets, just validate-references, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets.

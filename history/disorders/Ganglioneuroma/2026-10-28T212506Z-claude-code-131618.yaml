  summary: 'Create: Ganglioneuroma'
  details: |
    New entry for ganglioneuroma (MONDO:0005033), the fully differentiated, benign member of the peripheral neuroblastic tumours. Part of the neuroblastoma expansion series (issue 15822); claim issue 15823.

    Content: two INPC subtypes (maturing, NCIT:C42064; mature, NCIT:C42065); four pathophysiology nodes (neuroblast-to-ganglion cell maturation, Schwannian stromal development, tumoral vasoactive intestinal peptide secretion, and AKT-mTOR-S6 pathway activation from human immunohistochemistry, left without causal edges as its notes explain); three histopathology rows; eight phenotypes (retroperitoneal, posterior mediastinal and pelvic masses, pain, watery diarrhoea and hypokalaemia from VIP secretion, raised urinary HVA and VMA); a MYCN amplification biomarker row (2 of 34 GN-maturing tumours amplified in the CCG/COG series, 0 of 9 in a second series, with no frequency band because the two small series disagree); four differentials (ganglioneuroblastoma, neuroblastoma, adrenal gland pheochromocytoma, schwannoma); surgical resection and watchful observation; and a CONTROVERSY discussion on whether ganglioneuroma arises by maturation of a neuroblastic tumour. 134 evidence items from 25 references, 17 of them newly cached.

    The pheochromocytoma differential is bound to MONDO:0004974 (adrenal gland pheochromocytoma) because all of its evidence concerns adrenal tumours; MONDO does not file that term under MONDO:0035540, the term of the Pheochromocytoma_Paraganglioma entry, so the row gets no internal page link.

    Source report: research/Ganglioneuroma-deep-research-claude_code.md (claude_code provider), re-validated before commit, 82 of 82 references resolved. just preflight-dr returns WARN; both flagged passages are parsing artefacts (line 742 reads "PTEN/BMPR1A hgnc:1076", where hgnc:1076 is BMPR1A, and line 1332 writes each identifier before its symbol), and MONDO records no causal gene for this term. The entry binds no gene identifier from the report; hgnc:7559 (MYCN) was read from cache/hgnc/terms.csv.

    Validation on the branch rebased onto main: the run_c4 gate set (validate-disorders, count-verified-snippets --strict, check-snippet-grading and the whole-repo gates), check-reference-titles-present, check-cache-order, check-shared-disease-terms, check-logical-rules, check-qualifier-terms and check-delivery-system all passed. check-cancer-origin (advisory) reports no origin node, consistent with the entry's open question about where ganglioneuroma starts.

  summary: 'Edit: Ganglioneuroma, two GEO datasets and the zebrafish myr-Akt2 animal
    model'
  details: |
    Datasets and an animal model for the ganglioneuroma entry, which had neither.

    Datasets: geo:GSE147635 (PMID:33712610), bulk RNA-seq of six ganglioneuromas, 15 primary neuroblastomas at diagnosis and three neuroblastoma cell lines (24 samples, counted from the GEO sample titles; the series reuses part of GSE94035 and GSE90711, and the injured-nerve samples the paper also profiled are not among the 24). geo:GSE135682 (PMID:32728700), bulk RNA-seq of FACS-sorted tumour cells from the zebrafish dbh:myr-Akt2 ganglioneuroma model and the dbh:EGFP-MYCN neuroblastoma model, four samples each. Titles are GEO's own, copied from the caches just verify-datasets wrote. GSE147635 had been set aside from the ganglioneuroblastoma entry during #16636 because its stroma-rich samples are ganglioneuromas.

    Animal model: the zebrafish Tg(dbh:mCherry;dbh:myr-Akt2) lines of PMID:32728700, described from the paper's full text (penetrance 40-50% by 29 weeks post-fertilization; interrenal ganglioneuromas of mature ganglion cells with poor Schwannian stroma; no progression to neuroblastoma). Three modeled_mechanisms links, each with model_scale ORGANISM:
    - AKT-mTOR-S6 Pathway Activation: PERTURBS, fidelity MODERATE, divergences CAUSE_UNREPRESENTED and SPECIES_MISMATCH (both QUALIFYING), and a readout (phosphorylated mTOR, S6 and EIF4EBP1, INCREASED) quoting the immunohistochemistry result; the link evidence reuses the entry's existing abstract snippet with its grading unchanged.
    - Neuroblast-to-Ganglion Cell Maturation: RECAPITULATES, fidelity MODERATE, divergence SPECIES_MISMATCH (QUALIFYING; Pearson r = 0.39 across 407 orthologous genes), evidence for mature ganglion-cell histology, neuroblast rather than chromaffin origin, the cross-species expression concordance and the authors' resemblance conclusion.
    - Schwannian Stromal Development: FAILS_TO_RECAPITULATE, fidelity LOW, divergence BOUNDARY_OMISSION (INVALIDATING), because the fish tumours have poor Schwannian stroma while human ganglioneuroma is defined as Schwannian stroma-dominant; limitations and evidence as the substantiation check requires.

    Snippets were cut from the committed full-text cache rather than retyped. The re-fetch of PMID:32728700 and PMID:33712610 during this session rewrote their cache files, and both were restored to the committed versions, against which every snippet verifies.

    Validation: just validate passes; 148 of 148 snippets verify; verify-datasets OK for both accessions; model-scale-audit reports three MODEL_ABOVE_TARGET links; the model, divergence, readout and dataset tests in tests/test_data.py pass; the C4 gate set passes (see the PR).

    Review round 1 (approved, with two optional suggestions, both taken). The AKT link's description said "none of which (mTOR, S6) was detected" after listing three proteins; it now says that phosphorylated mTOR and S6 were undetectable in the MYCN-driven fish neuroblastomas, which is what the source reports. The maturation link moved from RECAPITULATES to PARTIALLY_RECAPITULATES, because the fish tumours show the mature end state (ganglion cells of neuroblast origin) and not the stepwise maturation of a neuroblastic tumour that the node describes; a QUALIFYING BOUNDARY_OMISSION divergence records the missing intermediate stages, and the link description says the model shows the end state only.

  summary: Address CODAS review on counterevidence, source titles and treatment targets
  details: |
    Addressed independent reviewer feedback: the mouse-fibroblast size result is REFUTE for mitochondrial enlargement in that cell type, while enterocyte findings remain supportive. Re-fetched DOI:10.65717/TurkArchPediatr.2026.25385; its stale PDF link returned 404 and the cache contained only a punctuation placeholder. Tried the real publication title for the working PDF URL. The advisory title checker exempts URL references, but authoritative validate-disorders rejected all 15 URL-title occurrences against the generated cache title. Restored the validated URL display title; the adjacent PMID:42541474 publication reference already carries the readable title. No cache or validator was changed to bypass this limitation, as the reviewer explicitly permits retaining the URL form when the tools cannot accept a replacement. Moved preserved blood mtDNA evidence to diagnostic limitations, added the broader cataract surgery target, removed developmental delay from orthotic targets, separated hearing amplification from myringotomy, and added typed boundary omissions for the cell-free model links. Retained the vocal-cord-paresis phenotype directly beneath LONP1 dysfunction with unknown intermediates: laryngeal dysfunction and paresis are overlapping observations, so a causal edge between them would imply a distinction the evidence does not establish. Retained the other qualified clinical links for the same unresolved-mechanism reason. All intended suggestions were considered in this revision; validation results are recorded in the review reply.

  summary: 'Review round 1: CODAS Syndrome'
  details: |
    Addressed the automated review of PR 12632. The lens, skeletal, dental and conductive hearing edges previously cited the discovery paper's statement that these features are atypical of mitochondrial disease as support for a mitochondrial route; they now start at LONP1 Biallelic Loss of Function and cite the following sentence of PMID:25574826, 'Such complications might reflect Lon-dependent processes that are currently unknown.', with directness INDIRECT. The atypical-features sentence remains only in the knowledge-gap discussion. Ear, midface, nares, nasal groove, atrial septal defect, atrioventricular canal, omphalocele, intellectual disability, seizure and laryngeal dysfunction edges also moved to the LONP1 node, citing the paper's summary sentence. The combined mitochondrial node was split into Abnormal Mitochondrial Ultrastructure (GO:0007005) and Reduced Mitochondrial Respiratory Capacity (GO:0045333), both downstream of impaired protein quality control; hypotonia, developmental delay, ptosis and sensorineural hearing loss stay on the respiratory node, citing the paper's clinical-similarity sentence. Evidence was added to the previously uncited skeletal and gastrostomy edges. The founder-allele record now states the carrier frequency of 11.8% given in the source (MAF 5.9%). Added a molecular diagnosis entry (PMID:36685982), a Lonp1 heterozygous knockout mouse model partially recapitulating both mitochondrial nodes (PMID:32521756), a rehabilitation target on global developmental delay, and quote_role REVIEW_SYNTHESIS on the seizure evidence. Validation: just validate-disorders passed with 124/124 snippets verified; causal-target, entity-ref, duplicate-key, enum, coarse-phenotype, qualifier, snippet-length, title-snippet, snippet-grading, reference-title and folded-hyphen checks passed; 31 of 32 phenotypes are causally connected, with carious teeth still unsourced.

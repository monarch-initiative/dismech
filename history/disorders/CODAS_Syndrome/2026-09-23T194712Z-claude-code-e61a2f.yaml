  summary: 'Create: CODAS Syndrome'
  details: |
    New entry for CODAS syndrome (MONDO:0010879), caused by biallelic LONP1 variants. Curated 5 pathophysiology nodes (LONP1 biallelic loss of function, impaired mitochondrial protein quality control, mitochondrial structural and respiratory dysfunction, spondyloepimetaphyseal dysplasia, laryngeal and vocal cord dysfunction), 32 HPO-bound phenotypes, LONP1 genetics, autosomal recessive inheritance (HP:0000007), an Amish founder allele frequency record and a worldwide order-of-magnitude record, five supportive treatments, three differential diagnoses and one knowledge-gap discussion on why a mitochondrial protease defect produces lens, dental, middle-ear and skeletal malformations. Edges from the mitochondrial node to developmental phenotypes are marked INDIRECT_UNKNOWN_INTERMEDIATES because no source describes the intermediate steps. Carious teeth is left without an incoming causal edge because no source links it to a mechanism. No GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER); the phenotype baseline is the discovery series PMID:25574826 and PMID:25808063 and the index case PMID:1887855. One OpenScientist report was run: research/CODAS_Syndrome-deep-research-openscientist.md. The run itself completed, but its built-in term validation step failed on OLS timeouts, so reference validation was added afterwards with just validate-research-reference (20 references, 0 unresolved, 6 of 23 quotes not matched, mostly because of ellipses or bracket stripping; 1 possibly off-topic reference) and term validation with deep-research-client validate-terms using local HP, MONDO and CL builds and skipping GO, whose GO:0051603 lookup times out on OLS (42 terms, 0 unresolved). The report's gene CURIE HGNC:9647 for LONP1 is wrong (LONP1 is hgnc:9479), and its HP:0000359 and HP:0011831 suggestions name different concepts; none of these were used. just preflight-dr returned PASS. Every CURIE in the entry was looked up in the term caches or OLS. Validation: just validate-disorders passed (schema, terms, 106/106 snippets verified); check-causal-targets, check-entity-refs, check-duplicate-keys, check-coarse-phenotypes, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading and check-reference-titles all passed; list-gene-term-mismatches found no mismatch; 31 of 32 phenotypes are causally connected.

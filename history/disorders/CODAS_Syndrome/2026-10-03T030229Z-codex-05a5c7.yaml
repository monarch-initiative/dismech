  summary: Review CODAS clinical variability and substrate-specific LONP1
    mechanisms
  details: |
    Reviewed the existing CODAS entry, its CREATE/EDIT histories, and the substantive OpenScientist report and citation-validation results. This inherited LONP1 disorder has no previous REVIEW event and falls outside the excluded infectious and environmental/poisoning categories.

    Read the available clinical, biochemical and model full texts, particularly Strauss 2015 (PMID:25574826), the Korean rehabilitation follow-up (PMID:31169704), the Lonp1 mouse study (PMID:32521756), R721G biochemical experiments (PMID:34228963), the 2023 clinical reports (PMID:36684615 and PMID:36685982), and the cross-phenotype analysis (PMID:40931319). Read the non-CODAS mitochondrial reports (PMID:29518248 and PMID:31636596) for differential scope. Re-fetched abstract-only early/atypical/cataract and EVEN-PLUS sources; full text was not obtained for PMID:25808063 despite publisher and institutional retrieval attempts. Existing cache files were generated by the reference tools, never hand-edited.

    Recovered and read the complete publisher PDF of the 2026 three-child series (PMID:42541474) through its current article-download URL. PubMed provided metadata but no abstract on these fetches; evidence therefore cites the separately fetched full-text URL. This series documents normal development/intelligence, variable cataract detection age, absent dental/hearing findings, preserved ambulation and improvement of some epiphyseal changes. Removed unsupported blanket frequency assignments and added source-specific clinical and imaging findings, including coxa vara and carpal hypoplasia.

    Corrected the mechanism layer to substrate-dependent residual Lon activity rather than uniform complete loss of function. Separated MT-CO2 aggregation from impaired PDK4 turnover; distinguished detergent insolubility from total protein loss, and biochemical substrate turnover from unmeasured PDH inhibition or tissue metabolic flux. Normalized basal and ATP-linked respiration were preserved in the founder lymphoblastoid cells despite reduced spare capacity. Tissue mechanisms linking Lon dysfunction to clinical anomalies remain unresolved; clinical co-occurrence is not proof of a respiratory mediator, and radiographic components are not modeled as causes of one another. Qualified mouse dosage compensation, tissue mtDNA preservation and the difference between enterocyte swelling and cultured-fibroblast morphology. Cultured fibroblast evidence is IN_VITRO; animal tissue evidence is MODEL_ORGANISM.

    Research completeness assessment: phenotypes adequate after expansion and variable-expression correction; subtypes adequate without inventing categorical severity subtypes; pathophysiology expanded and speculative generic LONP1 pathways excluded; treatments adequate with supportive rehabilitation, orthotic support, corrective knee surgery, individual methylphenidate use and genetic counseling; no CODAS-specific trial emerged from the research; genetics cover biallelic inheritance, reported variant classes, founder context and allele-dependent function; diagnostics cover molecular confirmation, skeletal-ocular recognition and limits of routine mitochondrial biochemistry; reference consumption expanded using obtainable full text; overall central omissions repaired. The GeneReviews baseline check returned NO_CHAPTER. PMID:41970958 and PMID:39462050 were additionally checked for scope: dominant mitochondrial encephalopathy and candidate pure epilepsy do not justify importing their treatment outcomes into CODAS.

    All evidence/publication titles were checked for identity and relevance. Final batched schema, term and reference validation passed: 187 snippets and 204 titles, none skipped or unavailable. Both targeted CODAS data tests passed. Additional repository QA, rendering and pre-commit results are recorded in the PR.

  summary: 'Create: Waisman Syndrome'
  details: |
    New entry for Waisman syndrome (RAB39B, MONDO:0010709) from claim #16791. Deep research: one OpenScientist run (research/Waisman_Syndrome-deep-research-openscientist.md); Edison (falcon) was tried first and rejected the API key with HTTP 403. The report was used as a lead list: preflight-dr passed (RAB39B 59 mentions, OMIM 311510 matches), and every evidence snippet was taken from the fetched references_cache abstracts, not from the report's prose. The one report quote it flagged as unsupported (PMID:32115408) was not used. Named with the eponym because the MONDO label is a phenotype other genes also cause; the MONDO label is kept as a synonym. Pathograph: RAB39B loss branches to PI3K-AKT-mTOR hyperactivation and progenitor overproliferation (macrocephaly, autistic behavior), Golgi-endosomal trafficking loss with AMPA receptor and presynaptic defects (intellectual disability), and impaired macroautophagy with alpha-synuclein dysregulation and nigral dopaminergic degeneration (parkinsonism). The cell-culture result of reduced alpha-synuclein after knockdown is recorded as REFUTE evidence. ClinGen Definitive (XL) copied from the cached CGGV record. Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), the offline KB gates, and validate-disorders.

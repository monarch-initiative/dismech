  summary: 'Gene-family review: BRAF, NRAS, RAF1, PTEN'
  details: |
    Typed BRAF, NRAS (post-zygotic codon 61, the dominant CMN driver, PMID:31111470) and RAF1 SOMATIC_DRIVER and PTEN COOPERATING (a progression lesion), all variant_origin SOMATIC. The RAF1 record gained evidence: a SOX5-RAF1 fusion in a NRAS/BRAF wild-type giant CMN, which transforms cells (PMID:35587097). Bound protein serine/threonine kinase activity INCREASED (BRAF V600E) and GTPase activity DECREASED (NRAS Q61) on the 'Genetic Mutations' node, and phosphatidylinositol-3,4,5-trisphosphate 3-phosphatase activity DECREASED on 'PI3K-AKT-mTOR Pathway Activation'.

    Integration cleanup of errors already present on main: linkml-reference-validator 0.8.0 failed this entry's evidence or deep-research reference annotations, so CI rejects any PR that touches it. Removed nine NO_EVIDENCE items with empty snippets from the Pruritus phenotype; each recorded a paper that does not mention pruritus, and the validator rejects an empty excerpt.

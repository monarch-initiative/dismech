  summary: Add acoziborole treatment and NCT03087955 trial; tag therapeutic modality
  details: |
    Addresses the review of PR #8828, which requested changes on one blocking item and offered four suggestions.

    Added an Acoziborole therapy treatment, the omitted drug the review identified. Evidence comes from PMID:36460027, the pivotal multicentre open-label single-arm phase 2/3 trial, fetched into references_cache during this round. The review pointed at DOI:10.1016/S1473-3099(22)00660-0; that DOI was fetched first but The Lancet returned 403 for the PDF, so the cached record carries bibliographic metadata with no body text and no quotable snippet. The PubMed record for the same paper was fetched instead and matches on exact title, author list, journal, and year, and carries the full text. The empty DOI cache file was not committed, since nothing cites it. Three verbatim snippets are attached: the primary efficacy endpoint, the drug-related adverse event count, and the sentence establishing the single-arm design.

    The treatment description records what the trial cannot show as well as what it can. The trial had no comparator arm, so the comparison against NECT rests on a post-hoc analysis against historical data rather than randomised comparison, and acoziborole is not yet in WHO guidelines. The third snippet exists specifically to support that caveat rather than the efficacy claim.

    No therapeutic_agent term is bound. NCIT and CHEBI were both searched for acoziborole and for the development codes SCYX-7158 and AN5568, and neither ontology has a term. Per the ontology term contract, no term beats a bad one, so treatment_term carries NCIT:C15986 Pharmacotherapy with the agent identity in preferred_term.

    Also added a clinical_trials section for NCT03087955, which the entry previously lacked entirely. This is the second remediation the review offered; both were taken rather than choosing between them, since the registry record and the publication support different claims.

    Added therapeutic_modality: SMALL_MOLECULE to the four treatments added by this PR plus acoziborole, as the review suggested. Fexinidazole was left alone as pre-existing content outside this PR's scope.

    Took review suggestion 2 on NECT. The description asserted non-inferiority and fewer major adverse events while quoting only the cure count. Both claims are now backed by verbatim quotes from the same abstract: the non-inferiority statement, and the grade 3 or 4 reaction counts for the eflornithine and NECT arms.

    Not taken in this round: suggestions 3, 4, and 5. Stage-specificity for suramin and pentamidine would need quotes from Franco 2024 and the Barrett review, which are listed in references but whose relevant sentences were not verified here. Treatment target_mechanisms joins would require new pathophysiology nodes for ODC inhibition, trypanothione reductase, and AQP2-mediated uptake, which is a larger mechanism-curation task than this treatment-focused PR. The AQP2/3 chimera and CPSF3 N232H resistance content is likewise a separate addition.

    Validation: just validate passed; just validate-terms passed; just count-verified-snippets reported 25 verified of 38 with 13 skipped by prefix and zero unverified, up from 18 verified before this round, with all seven new snippets exact substrings of their cached sources.

    Note that this branch remains in conflict with main in cache/chebi/terms.csv and cache/enums/chemicalentityterm_b3afbb412a9e.csv. That conflict was not resolved in this round.

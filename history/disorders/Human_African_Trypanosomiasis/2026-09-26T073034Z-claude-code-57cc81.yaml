  summary: Add VSG antigenic-variation immune-evasion pathophysiology node
  details: |
    Added a new pathophysiology node, 'VSG Antigenic Variation and Immune Evasion', modeling the defining T. brucei immune-evasion mechanism named as a content gap in issue #6309 ('VSG antigenic-variation (the defining T. brucei immune-evasion hallmark) not modeled'). Prior to this change the entry's pathophysiology section had only two nodes (CNS infection after BBB traversal, sleep-wake cycle disturbance mechanism) and did not model how the parasite evades clearance to sustain chronic bloodstream infection. The new node is bound to GO:0020033 (antigenic variation), cites PMID:24859277 (Horn D, 'Antigenic variation in African trypanosomes', Mol Biochem Parasitol 2014 -- a full-text-available review), and carries a downstream causal edge into the existing 'Central nervous system infection after BBB traversal' node (sustained immune evasion maintains parasitemia long enough to permit CNS invasion). All three evidence snippets are exact substrings of the cached full text and are tagged evidence_source: IN_VITRO with quote_role: REVIEW_SYNTHESIS, since the cited paper synthesizes molecular/cell-biology studies of cultured T. brucei rather than reporting a single primary result. Validated with just validate, just validate-terms, just count-verified-snippets (41/41 verified), just check-causal-targets (new downstream target resolves cleanly), check-duplicate-keys, check-entity-refs, check-enum-values, check-qualifier-terms, the whole-KB check-folded-hyphens/check-snippet-length/check-title-snippets/check-snippet-grading/check-environmental-evidence, and pytest tests/test_data.py -k Human_African_Trypanosomiasis (2 passed).

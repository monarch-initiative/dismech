  summary: Add pentamidine, suramin, melarsoprol, and NECT treatments
  details: |
    Added four structured treatment entries (Pentamidine, Suramin, Melarsoprol, Nifurtimox-eflornithine combination therapy - NECT) to close the issue #6309 gap: 'stage-2/rhodesiense treatments melarsoprol, eflornithine/NECT, suramin, pentamidine - only fexinidazole present'. Sourced from two current WHO treatment-guideline reviews (PMID:31879061 gambiense 2020, PMID:39389073 rhodesiense 2024/2025) plus the pivotal NECT non-inferiority RCT PMID:19559476 (Priotto et al. 2009 Lancet). Each entry carries CHEBI-bound therapeutic_agent slots: pentamidine CHEBI:45081, suramin CHEBI:45906, melarsoprol CHEBI:6729, nifurtimox CHEBI:7566, eflornithine CHEBI:41948. Fetched the three new PMIDs via just fetch-reference, never hand-created. Validation: just validate schema/terms/references all pass, 18/18 non-skipped snippets verified; just count-verified-snippets; just check-duplicate-keys; just check-title-snippets no new occurrences; pytest tests/test_data.py -k Trypanosomiasis 16 passed. Acoziborole (investigational, STROGHAT trial protocol only) was deliberately left uncurated as a treatment since it is not yet an established therapy; VSG antigenic-variation mechanism and gambiense/rhodesiense subtype modeling remain open follow-up items in issue 6309.

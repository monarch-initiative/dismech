  details: |
    Manual expert claim-evidence review (no deterministic validators used for finding; snippets re-verified against references_cache afterwards).
    Fixed: (1) prevalence block asserted 100-200/100k with FOUR evidence items that were all REFUTE or NO_EVIDENCE, and the PMID:32608308 REFUTE explanation misread the Danish cohort's ETHNIC COMPOSITION (Turkish 41.8%) as a prevalence figure - replaced with two evidence-backed records (PMID:33758818 Sivas field study 0.6%; PMID:30527430 regional distribution). (2) has_subtypes 'Type 1' was asserted with three NO_EVIDENCE items while the supporting sentence was already quoted elsewhere in the file - reattached PMID:21358337. (3) No inheritance block existed for an AR Mendelian disease - added HP:0000007 with GeneReviews PMID:20301405. (4) Pericarditis had no evidence and an OCCASIONAL band; sources say 'rarely'/'less common' - downgraded to VERY_RARE with two citations. (5) environmental 'Physical Stress' claimed 'may trigger episodes' but its evidence states physical exertion did NOT increase attack likelihood - relabelled REFUTE and restated. (6) NSAIDs treatment carried REFUTE+NO_EVIDENCE only; the REFUTE was really absence-of-mention - relabelled NO_EVIDENCE with an explicit note that no source supports it. (7) MEFV lacked a gene_term - bound hgnc:6998 in genetic and pathophysiology. (8) PKN1/PKN2/RHOA were listed as 'Modifier gene'/'Upstream regulator' under genetic with no evidence and no human FMF variants - moved to the pathophysiology node notes. (9) Three snippet transcription defects: ASCII '</=' and '+/-' substituted for Unicode, and PMID:21360109 was a paraphrase containing a curator-invented bracketed gloss - replaced with the verbatim source sentence. (10) Dropped deprecated updated_date; category Genetic -> Mendelian.

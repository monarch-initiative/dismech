  summary: Add MEFV M694V and M694I with Japanese population effects
  details: |
    Adds the first MEFV variant records to the entry (M694V, M694I) as the worked example for Variant.population_effects (design decisions section 16). Two Japanese nationwide surveys supply the population findings: PMID:19531756 (80 patients; no patient carried M694V, the commonest Mediterranean variant; E148Q/M694I, M694I alone and L110P/E148Q/M694I were the commonest genotype patterns) and PMID:23111802 (126 genotyped patients; E148Q/M694I 19.8% and M694I/normal 12.7%). Populations are bound to HANCESTRO:0019 Japanese, with ancestry_basis NOT_STATED because neither abstract says how Japanese ethnicity was determined. The 2009 abstract also says Japanese FMF is milder and AA amyloidosis rare, 'probably' because of the different genotype pattern; that attribution is the authors' hypothesis and was not recorded as a variant severity effect. A PubMed search for Singapore MEFV cohorts (the motivating example in #13677) found no population study, so none is recorded. Validated: linkml-validate, 84/84 snippets verified, term validation passed.

    Review round on PR 13682: both M694I records asserted a frequency difference from Mediterranean patients while quoting only Japanese genotype percentages. Each now quotes the sentence in which its source states the difference ('difference in patterns of the MEFV genotype between Japanese and Mediterranean patients', PMID:19531756; 'Although Japanese patients with FMF are clinically or genetically different from Mediterranean patients', PMID:23111802), and the 2012 record gained its missing comparator_stratum. M694V now records allele_frequency 0, with a note that it was measured among the 80 patients, not the general population.

    These records were then split out of PR 13682 into their own curation PR, stacked on it, because CI's scope check does not allow KB content and schema changes in one PR. The schema they depend on (Variant.population_effects, AncestryTerm) is in PR 13682.

    Conflict resolution, 2026-10-10. PR 13747 had been approved but sat
    CONFLICTING for a day. The conflict was not in this curation: main's copy of
    the entry was untouched since the branch's merge base, and these 117 lines
    apply to it cleanly. It was that the branch still carried the schema work
    that had meanwhile merged on its own as PR 13682, and carried it in older
    form - the branch's CLAUDE.md, docs/explanation/design-decisions.md,
    src/dismech/schema/dismech.yaml and src/dismech/templates/disorder.html.j2
    were all behind main, so merging the branch as it stood would have reverted
    later work on those four files.

    Resolved by rebuilding the branch on current main with only what is still
    needed: this entry, its two reference cache files, this record, and
    cache/hancestro/terms.csv with cache/enums/ancestryterm_a874ddd6c4f4.csv.
    Those two cache files are the reason the set is not just the entry - neither
    is on main, and HANCESTRO:0019 cannot be validated offline without them. The
    schema test and the VariantPopulationEffect schema history record were
    dropped as already present on main and byte-identical there.

    Re-verified against the merged schema rather than the branch's own:
    HANCESTRO:0019 resolves to Japanese in OLS and is not obsolete, and the
    binding is correctly the plain ancestry term rather than HANCESTRO:0754
    Japanese in Tokyo, Japan (1KGP), which is the reference-panel term CLAUDE.md
    warns against. just validate reports 86 snippets and 86 titles checked with
    0 issues, superseding the 84/84 figure recorded above, which predates the
    two comparator sentences the review round added. validate-disorders,
    validate-terms, check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-qualifier-terms and validate-history all pass;
    7540 tests pass; the eight baseline and ratchet gates report no new
    findings. The resulting diff is 6 files, 256 insertions, no deletions.

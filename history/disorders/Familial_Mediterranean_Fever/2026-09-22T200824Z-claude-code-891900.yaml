  summary: 'Review: connect three orphan phenotypes (IUIS Table 7)'
  details: |
    Three of eight phenotypes had no incoming edge. Myalgia, erysipelas-like erythema and amyloidosis attach to the autoinflammatory activation node.

    The amyloidosis edge records what colchicine prophylaxis is for: AA amyloidosis from chronic serum amyloid A elevation was historically the main cause of death in this disease, and preventing it is the reason treatment continues between attacks rather than only during them.

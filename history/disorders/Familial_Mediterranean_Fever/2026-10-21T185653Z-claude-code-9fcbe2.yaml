  summary: Address review on E148Q variant (PR 15089)
  details: |
    Answered the first review of PR 15089. Added reference_title to the preprint evidence item, copied from the cache frontmatter. Rewrote the E148Q description to match the preprint's reported results: older age at presentation, more chest pain, less fever, more moderate-to-severe ISSF disease and lower white cell counts in M694V/E148Q patients, with comparable acute-phase reactants. Removed the unsupported abdominal-pain claim and used the authors' 'may contribute to phenotypic variability' wording. Extended the PRIMARY_RESULT snippet to the full conclusion sentence, and added a BACKGROUND item quoting the preprint's statement that E148Q's clinical significance remains controversial. No variant-level clinical_significance was added because no ClinVar record was cached to copy it from.

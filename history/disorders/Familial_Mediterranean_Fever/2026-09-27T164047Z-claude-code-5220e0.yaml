  summary: 'Genetics pass: record the AD and AR MONDO children as narrowMatch, add
    a semidominant inheritance block, repair the broken pathograph chain'
  details: |
    d2g genetics pass for the two rows of dismech#12274 under this parent
    (MONDO:0009572 autosomal recessive FMF and MONDO:0007601 autosomal dominant FMF,
    both MEFV). Neither CURIE appeared anywhere in kb/ before this change.

    Anchor test. MONDO:0018088 is correct and unchanged. It has exactly two children,
    both are the issue's rows, both are attributed to MEFV, and they divide the same
    gene's disease by inheritance mode.

    Rows. Both are recorded as `skos:narrowMatch` mappings on the entry rather than as
    `has_subtypes` rows. The reason is axis collision: this entry's subtype axis is
    the clinical type 1 / type 2 phenotype split, and putting inheritance-mode rows
    beside phenotype rows in the same list would mix two axes in one slot. The
    inheritance axis now has its own home - a new `inheritance` block bound to
    HP:0032113 Semidominant inheritance, evidenced by the ClinGen gene-disease
    validity row already cited in this entry, whose mode-of-inheritance field reads
    SD. The pre-existing autosomal recessive block already described the dominant
    pyrin disease in prose; the new block gives that observation a term.

    Pathograph repair found along the way. Three of the entry's four pathophysiology
    nodes had no outgoing edge, so the MEFV node was a dead end and only
    Autoinflammatory Pathway Activation reached any phenotype. The chain is now
    MEFV Gene Mutation -> RhoA-PKN Regulatory Pathway Dysregulation ->
    Autoinflammatory Pathway Activation -> Gasdermin D-Mediated Pyroptosis, with the
    first two edges carrying evidence already present in the entry. Gasdermin D is
    left as a terminal amplification node and its `notes:` explains that a further
    edge to a phenotype would double-count the cytokine release the upstream node
    already carries. Wiring metrics do not move: gene coverage was and is 1/1 and
    phenotype inlink was and is 8/8, because the MEFV record reached its node and the
    phenotypes had an upstream node all along. The repair is to the chain between
    them, which neither metric sees.

    A duplicate `notes` key was created and then fixed while adding that note - the
    Gasdermin D node already had one, and the two were merged rather than one
    replacing the other.

    `just tag-references` was run on this file alone and added a top-level
    `references:` block tagging PMID:20301405 as GeneReviews; the chapter was cited in
    evidence but untagged, which `just check-genereviews` reported as CITED_UNTAGGED.

    Validation on the committed tree: `just validate` clean, `just validate-terms`
    clean, 83 snippets verified in this file, within a 643/643 verification across the
    ten files this PR touches. No new references were fetched for this entry.

  summary: 'Create: Spermatogenic Failure 38 (ARMC2)'
  details: |
    New entry for SPGF38 (MONDO:0032748, ARMC2). Deep research run with the claude_code provider (research/Spermatogenic_Failure_38-deep-research-claude_code.md); just preflight-dr returned PASS. The report could not open PubMed or PMC and offered several wrong HP CURIEs (its own term validation flags them), so it was used for leads only; phenotype bindings were taken from the validated sibling entry Spermatogenic_Failure_19. Primary sources fetched with just fetch-reference: Coutton 2019 (founding cohort and mouse), the Pakistani family (2021), the Chinese ICSI case (2022), the two missense families (2024), Wu 2025 (compound heterozygote and the one PCD-like patient), the Chlamydomonas PF27 IFT paper, the 2026 Armc2 mouse cilia paper, the mouse MMAF embryo-development comparison, the mouse mRNA-rescue study, and the ClinGen CGGV record (Definitive). Judgement calls: cargo adaptor activity (GO:0140312) bound as the molecular function by inference from the algal ortholog; airway phenotypes recorded at VERY_RARE from a single patient with an EMERGING motile-cilia hypothesis and a REFUTE item noting most patients lack PCD features; the mouse mRNA rescue recorded as a preclinical MRNA_THERAPY treatment with no treatment_term. Oligozoospermia is left without an upstream edge because its mechanism is not described. No GeneReviews chapter (just check-genereviews NO_CHAPTER). Validated with just validate, validate-terms, check-entity-refs, check-causal-targets, check-name-collisions, check-snippet-grading, check-gene-validity, check-logical-rules and validate-disorders.

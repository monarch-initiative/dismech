  summary: 'Add ECTO exposure_term binding audit (issue #8430)'
  details: |
    Checked ECTO for exposure_term bindings on two pathograph-linked environmental exposures flagged in issue #8430. Bound 'Elevated Ambient Carbon Dioxide' to ECTO:9000049 (exposure to carbon dioxide). An earlier pass in this same PR had chosen ECTO:7000071 (exposure to atmospheric carbon dioxide), but PR review (#8447) correctly flagged that term as grounded in ENVO:01000451/ENVO:01000267 atmosphere, defined as gases held by a body's gravity -- which a sealed, microgravity ISS cabin is definitionally not, and which contradicts the entry's own contrast with "terrestrial ambient." ECTO:9000049 is exact and asserts nothing about location. Left 'Microgravity Exposure' unbound: ECTO has no microgravity/gravity/weightlessness exposure term at all (confirmed via OAK substring search across those terms plus 'spaceflight'), so forcing it onto an unrelated broad parent would assert a grounding that is not real, per the term-precision guardrail in .claude/skills/dismech-terms. Recorded a notes: entry documenting the search.

  summary: Correct dataset record errors surfaced by the GEO reference check
  details: |
    Corrected a wrong dataset accession surfaced by the GEO title check. The record was keyed on geo:GSE152382, whose GEO title is 'Expression profiles in multiple tissues of WT and Nrf2-knockout mouse under space filght' -- but its description (integrated DNA methylome and transcriptome of mouse retina after 37-day spaceflight), data_type METHYLATION, and publication PMID:34179686 all describe Chen et al., a different study. NCBI elink from PMID:34179686 resolves to GSE159771, 'Illumina NGS RNA-seq and RRBS Sequencing on Spaceflight Mouse Retina' (Mus musculus, 32 samples), which matches every other field. The accession is now geo:GSE159771 with GEO's verbatim title; the description, organism, data_type and publication are unchanged because they were already correct. references_cache/GEO_GSE159771.md added; the GSE152382 cache file removed as nothing in kb/ cites it. Raised by automated review on PR #10162.

  summary: Link microgravity as cause and cabin CO2 only as far as its source allows
  details: |
    Backfill for issue #8085. Microgravity Exposure is TRIGGERS with DIRECT into Cephalad Fluid Shift in Microgravity. Microgravity is not a risk factor for this entry, it is the condition without which none of it occurs, and the node is named for it; the link is DIRECT because the step is mechanical rather than biological, removing the hydrostatic gradient redistributes fluid headward. The fetched item is the authors' own conclusion and names prolonged microgravity exposure and the cephalad fluid shift in one sentence. It is graded SUPPORT to match this paper's existing grading on this node, with the hypothesis wording noted in the explanation rather than silently dropped. The two pre-existing items are PARTIAL: one sizes how often the exposure is followed by disease (about one in three astronauts on long-duration missions) and one asserts an association at the level of the whole syndrome; neither reaches the fluid shift. Elevated Ambient Carbon Dioxide is MODULATES with INDIRECT_KNOWN_INTERMEDIATES, and the two slots deliberately tell different stories. The link type is KNOWN because the schema asks what the field knows, and hypercapnic cerebral vasodilation raising intracranial pressure is well-characterised physiology that this exposure's own description names; it was filed as UNKNOWN and corrected after the reviewer of PR #8427 pointed out the tension with that description. The predicate is the weaker one because it answers a different question, whether the edge operates in this population at cabin concentrations, and the predicate is MODULATES rather than PREDISPOSES on the source's own instruction. The exposure entry describes cabin carbon dioxide raising intracranial pressure through cerebral vasodilation, but the cited review states outright that the physiologic role of carbon dioxide remains ill defined, notes that astronauts meet carbon dioxide and microgravity together so the two are confounded, and lists the role of carbon dioxide among its open questions. Two fetched sentences are carried so the candidate mechanism and the authors' refusal to commit to it travel together, and the predicate matches the weaker of the two.

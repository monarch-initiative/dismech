  details: |
    De-novo curation of MONDO:0044714 (MSTO1-related mitochondrial myopathy and ataxia syndrome, MMYAT) from primary literature, followed by an adversarial-verifier fix pass. Curation: NEC preflight against MONDO:0044714 (RO:0004003 HGNC:29678 MSTO1, OMIM:617675 xref) before any content was written; 19 PMIDs fetched into references_cache/ and every snippet checked verbatim; two mechanistic hypotheses curated (fusion-first CANONICAL, TRiC/proteostasis EMERGING) plus a 2026 RAD51 genome-maintenance route, with the mtDNA-depletion-vs-dynamics ordering left explicitly contested. Fix pass: rebound GO:0051646 (parent) to GO:0048312 intracellular distribution of mitochondria, whose OAK definition matches the preferred_term verbatim; deleted patient-ancestry claims (Japanese, Italian, Australia, Middle East) that were inferred from author affiliations rather than from any cached patient description, replacing them with the ancestries the sources actually state; removed four uncited attributions to the OMIM summary and reattributed the mtDNA-depletion-syndrome nosology to the cohort authors who proposed it; corrected MSTO2P from processed pseudogene to the tandem segmental-duplication pseudogene the cited cohort paper describes; rephrased the GeneReviews process claim as the result of a dated search. Validation: just validate, just validate-terms, check_snippets_verbatim, check_folded_hyphens, check_snippet_length --against-ref origin/main, and tests/test_data.py all clean.

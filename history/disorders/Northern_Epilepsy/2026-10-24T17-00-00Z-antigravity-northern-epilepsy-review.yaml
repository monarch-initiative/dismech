  summary: Comprehensive compliance review and enrichment of Northern Epilepsy entry
  details: |
    - Added `classifications` (Harrison's NEUROLOGIC, ENDOCRINOLOGY_METABOLISM, and GENETICS_ENVIRONMENT_DISEASE; lysosomal_storage_category neuronal ceroid lipofuscinosis; ICIMD neuronal_ceroid_lipofuscinosis).
    - Added `relationship_type: CAUSATIVE` and `variant_origin: GERMLINE` to `CLN8` genetic entry.
    - Grounded `CLN8 endoplasmic reticulum cargo-receptor dysfunction` node with GO `molecular_functions` (phospholipid binding, protein binding) and UBERON `brain` location, and added downstream causal links and evidence from `Lysosomal autofluorescent storage material accumulation` to phenotypes.
    - Standardized phenotype categories to `Neurological`, removed banned word from `Motor deterioration` explanation, and removed empty `datasets:` block.
    - Added `diagnosis` section (CLN8 Molecular Genetic Testing, Electroencephalography) with NCIT bindings and exact-quote evidence.
    - Enriched `Anticonvulsant therapy` with `therapeutic_modality` and CHEBI `therapeutic_agent` bindings (clonazepam, sodium valproate).

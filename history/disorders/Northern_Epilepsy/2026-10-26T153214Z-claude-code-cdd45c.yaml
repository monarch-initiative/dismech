  details: |
    Addressed the 2026-10-24 review of PR 15507. On the CLN8 ER cargo-receptor node, replaced GO:0005515 protein binding and GO:0005543 phospholipid binding, which no snippet on the node supported, with GO:0038024 cargo receptor activity (supported by PMID:35252181) and GO:0160121 bis(monoacylglycero)phosphate synthase activity (supported by PMID:39970228; GO has no term labelled lysophosphatidylglycerol acyltransferase activity, and an OLS GO search for that phrase and for acylglycerophosphoglycerol returned nothing, while bis(monoacylglycero)phosphate returned GO:0160121, whose definition is the LPG-to-BMP transacylation the paper reports). Reworded the CLN8-to-storage edge explanation so it no longer claims the NCL-definition sentence names CLN8. Added PR 15507 to the earlier record's links.

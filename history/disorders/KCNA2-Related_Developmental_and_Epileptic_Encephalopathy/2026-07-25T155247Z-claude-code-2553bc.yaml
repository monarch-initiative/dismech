  summary: 'Create: KCNA2-Related DEE'
  details: |
    De-novo curation of KCNA2-related DEE (DEE 32, MONDO:0014607, Kv1.2 channelopathy). Built from independently PubMed-verified primary literature (Syrbe 2015 Nat Genet PMID:25751627; Masnada 2017 Brain PMID:29050392; Hedrich 2021 Sci Transl Med PMID:34516822; Hundallah 2016 PMID:27117551; Niday & Tzingounis 2018 PMID:29542386). The claude_code deep-research run was launched but terminated before producing a report, so no DR content was used. Bidirectional LoF/GoF channelopathy modeled as separate minimally-bundled pathophysiology nodes (trigger; dominant-negative LoF current; LoF membrane hyperexcitability; GoF conductance/neuronal silencing; network E/I imbalance conforming to epilepsy_excitation_inhibition_imbalance; cerebellar/cortical dysfunction). Every PMID and snippet verified as an exact substring of the fetched abstract (39/39). Captures 4-aminopyridine gain-of-function precision therapy and the GoF-epilepsy paradox as discussions.

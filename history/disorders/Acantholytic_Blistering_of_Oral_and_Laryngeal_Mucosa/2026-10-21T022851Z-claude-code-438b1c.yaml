  summary: 'Review round 1 fixes: Acantholytic Blistering of Oral and Laryngeal Mucosa'
  details: |
    Addressed review 5594134422 on PR 15081. Oral mucosal blisters now cites the PMID:9166409 sentence reporting suprabasilar tongue blisters in bal/bal and Dsg3-null mice, and Erosion of oral mucosa cites the sentence naming oral mucous membrane erosions; the unspecific 'full spectrum of the types of lesions typical of PV' snippet was removed. Both oral phenotypes gained the PMID:37850634 pemphigus-like mucosal phenotype sentence as HUMAN_CLINICAL with directness INDIRECT. Acantholysis, Suprabasal cleavage and Feeding difficulties remain supported only by the Dsg3-null mouse, and each now carries a phenotype-level note saying so; every phenotype with mouse-led evidence has a note. Kim et al. 2018 was re-fetched: PMID:30528827 with --force and DOI:10.1016/j.jid.2018.09.038 with --force both cached with no quotable text. The DOI suggested in the review (10.1016/j.jid.2018.11.022) resolves to an unrelated FLG2 paper, so it was not used. PMID:9424092 was regraded from HUMAN_CLINICAL to IN_VITRO because it reports immunoblots and immunofluorescence on human tissue extracts and sections. No oesophageal phenotype was added because PMID:42684697 still caches only a one-sentence summary.

  summary: 'Create: Acantholytic Blistering of Oral and Laryngeal Mucosa'
  details: |
    New Disease entry for MONDO:0030986 (ABOLM, OMIM 619226), autosomal recessive DSG3 loss of function. Scope: a single Disease entry; MONDO has no descendants and one causal gene, and all reported families share one pathograph. Curated a four-node chain (biallelic DSG3 loss, loss of Dsg3-mediated keratinocyte adhesion, insufficient desmoglein 1 compensation in squamous mucosa as a modifier, suprabasal acantholysis of oral and laryngeal mucosa) conforming to three desmosomal_adhesion_failure nodes, six HPO phenotypes all wired from the acantholysis node, inheritance, a genetic diagnosis block, the DSG3 genetic record with the 18q12.1 deletion allele, and the Dsg3-null mouse with two modeled mechanisms. Deep research: one openscientist report (research/Acantholytic_Blistering_of_Oral_and_Laryngeal_Mucosa-deep-research-openscientist.md); 13/13 references resolved; term validation needs_review (NCIT:C15311 and NCIT:C15329 named as unrelated terms, UBERON:0002481 is bone tissue), none of which were used; just preflight-dr returned PASS (DSG3 mentioned 79 times). The report missed the 2026 JAMA Dermatology missense report (PMID:42684697), found by PubMed search. Its claims of negative immunofluorescence and ELISA and of consanguinity in the first family could not be checked against any cached abstract and were not curated. PMID:30528827 (first family) and PMID:10023908 cached with no quotable text on fetches by PMID and DOI; PMID:42684697 cached only a one-sentence summary. Human evidence is therefore thin and most mechanism and phenotype snippets come from the Dsg3-null mouse (PMID:9166409, 12485423, 9701552) and desmoglein compensation studies (PMID:9424092, 12164920, 10021453), graded MODEL_ORGANISM or HUMAN_CLINICAL by the cited study. Validated with just validate, validate-terms, count-verified-snippets and validate-disorders. The trigger node also binds GO:0098632 cell-cell adhesion mediator activity (modifier ABSENT) so that DSG3 lands on a node naming its molecular function, as check_gene_activity_grounding.py requires.

  summary: 'Create: Primary Hyperoxaluria Type 3 HOGA1'
  details: |
    New standalone Disease entry for primary hyperoxaluria type 3 [PH3; MONDO:0013327, OMIM:613616, ORPHA:93600, gene HOGA1 hgnc:25155], the missing third member of the primary hyperoxaluria family. NEC preflight passed. Debundled pathophysiology from HOGA1 aldolase deficiency through HOG metabolite accumulation, cytosolic glyoxylate-to-oxalate overproduction, urinary calcium oxalate supersaturation, to calcium oxalate nephrolithiasis, conforming to the nephrolithiasis_crystal_nucleation module. Uncertain oxalate-overproduction mechanism captured as a KNOWLEDGE_GAP discussion. 5 references verified; all 16 evidence snippets are exact substrings of fetched abstracts. Added PH3 to the Disorders of Glyoxylate and Oxalate Metabolism grouping. Passes validate, validate-terms, validate-references.

  summary: Fold two OpenScientist hypothesis runs into the PH3 oxalate-paradox record
  details: |
    Reviewed both OpenScientist hypothesis-exploration reports and folded their verified findings into the entry. Corrected a provenance error: the glyoxylate-reductase inhibition result was cited only to PMID:26428388, where the sentence sits in that paper's introduction restating its authors' earlier work with a citation. Added PMID:22771891 as the PRIMARY_RESULT and marked the 26428388 quote BACKGROUND, in both the pathophysiology node and the hypothesis group. Added PMID:22771891 (N-acetylneuraminate aldolase does not cleave HOG, refuting the one named candidate for the cytosolic enzyme) and PMID:39040543 (residual aldolase activity is mitochondrial, cytosol reduces HOG to a dead end) as REFUTE evidence on the cytosolic model. Recorded a third hypothesis group, hoga1_loss_pyruvate_krebs_flux (EMERGING, PMID:31696211), which both runs surfaced independently; no causal edge opts into it because the entry has no node for pyruvate supply. Statuses unchanged: the reports recommended retention with uncertainty flagged, and the notes now say what is unsettled rather than the status implying it is settled. Where a report's computed figure is quoted, the notes say it is an order-of-magnitude argument whose inputs partly could not be verified. Gates: validate-disorders clean, 33/33 snippets verified, 34 titles checked, entity refs, causal targets, duplicate keys, enum values, snippet grading, title snippets, folded hyphens, retired-support prose, hypothesis links and block-scalar comments all clean; list-background-citations reports no Tier C conflict against the 8 recorded quote_role values.

  summary: Add mechanistic_hypotheses for the PH3 oxalate paradox
  details: |
    Declared the two competing explanations for increased oxalate production despite the HOGA1 block as hypothesis groups so they are queryable and can be targeted by the hypothesis deep-research runner: cytosolic_hog_cleavage (CANONICAL; accumulated 4-hydroxy-2-oxoglutarate exported and cleaved by a non-HOGA1 cytosolic aldolase) and hog_glyoxylate_reductase_inhibition (ALTERNATIVE; substrate inhibition of GRHPR, evidenced only in vitro with purified enzyme). Both reuse evidence snippets already verified in this entry; no new reference cache files. The causal edge from Hydroxyproline-Pathway Metabolite Accumulation to Cytosolic Glyoxylate-to-Oxalate Overproduction now opts into both groups. Validated with just validate, count-verified-snippets (27/27), check-entity-refs, check-causal-targets and check-hypothesis-links. OpenScientist hypothesis-exploration runs launched for both groups.

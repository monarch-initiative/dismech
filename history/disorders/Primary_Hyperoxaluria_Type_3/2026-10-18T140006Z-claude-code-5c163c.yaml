  summary: Confirm the GR-inhibition computation inputs against the source manuscript
  details: |
    The Riedel 2012 author manuscript was supplied directly, settling the one input the previous assessment could not verify. Table 2 gives serum HOG 0.89 +/- 0.39 uM (range 0.5-1.43) and liver 34.3 +/- 6.2 pmol/mg protein (range 27.3-38.8); the Fig. 4 caption gives Ki for HOG 1.75 +/- 0.85 mM, KM for glyoxylate 267 +/- 19 uM and kcat 72.7 +/- 0.01 s-1 at R2 0.988. All five values match the OpenScientist report exactly, ranges included, so patient-hog-concentrations moves from NEEDS_VERIFICATION to RETAINED. One correction: those kinetic values are in a figure caption, not a table, as an earlier version of the sidecar said. One limitation neither the report nor the first assessment recorded: the PH3 cohorts are n=5 sera and n=3 livers, so the liver figure is a mean of three samples; recorded in the analysis limitations and in the entry note, and it does not close the 200-fold gap. Also recorded, because it explains the earlier retrieval failures and is a reusable trap: a direct request for the PMC PDF returns HTTP 200 carrying a reCAPTCHA challenge page rather than the file, so a status code alone does not establish retrieval from this environment.

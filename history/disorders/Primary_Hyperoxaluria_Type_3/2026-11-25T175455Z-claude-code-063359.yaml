  summary: 'Gene-family review: HOGA1 (and AGXT modifier record)'
  details: |
    HOGA1 modelling re-reviewed and found correct: the trigger node binds (R,S)-4-hydroxy-2-oxoglutarate aldolase activity (GO:0008700) as decreased in the mitochondrial matrix, with trans-4-hydroxy-L-proline catabolism decreased. Several snippets on the HOGA1 trigger node, its downstream edge, the metabolite-accumulation and cytosolic-overproduction nodes, the canonical hypothesis and the HOGA1 genetic record were fragments that stopped before the words carrying the claim; each was replaced with the full sentence from the same cached abstract (PMID:22391140 nonsense-variant proof of aldolase deficiency; PMID:22729392 mitochondrial aldolase, patient urine metabolite increases and the cytosolic-export proposal; PMID:20797690 DHDPSL gene assignment and the Ashkenazi Jewish 3 bp deletion founder allele). The HOGA1 record gains a record-level autosomal recessive inheritance block (GeneReviews PMID:26401545); its ClinGen Definitive tier was already recorded. The AGXT modifier record (one triallelic family, PMID:22781098) was reviewed and left unchanged.

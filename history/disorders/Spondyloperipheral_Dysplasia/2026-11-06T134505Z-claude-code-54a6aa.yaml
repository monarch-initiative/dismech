  summary: 'Create: Spondyloperipheral_Dysplasia'
  details: |
    New entry for spondyloperipheral dysplasia (MONDO:0010078), COL2A1 C-propeptide variants, autosomal dominant. Deep research: one Perplexity report (research/Spondyloperipheral_Dysplasia-deep-research-perplexity.md), used as leads only. Its one unresolved reference (a Wiley DOI for Zabel 1996) was not cited; the same paper was cited by PMID:8723097 instead. Its three unresolved HP CURIEs were not used, and two of its HP CURIEs carried wrong labels (HP:0003026 written as short ulna is Short long bone; HP:0001762 written as hip dysplasia is Talipes equinovarus); every HP term in the entry was looked up with runoak ols:hp. preflight-dr returned SKIP because MONDO records no causal gene; manual check: the report names COL2A1 46 times and cites OMIM 271700, matching MONDO. Evidence comes from six case reports, the Torrance-type cohort paper (PMID:15643621), the Orphanet ORPHA:1856 record, and the ClinGen CGGV record for this MONDO term (Definitive, AD), copied into gene_disease_validity. GeneReviews has only the Type II Collagen Disorders Overview (Overview format, tagged, not used as baseline). Orphanet frequency rows that conflict with the case literature (platyspondyly graded occasional; cleft palate, cataract, retinal detachment listed) were not used. ClinGen's loss-of-function mechanism and the primary reports' mutant-chain/ER-retention model are recorded as a CONTROVERSY discussion. Also added the entry as a member of the Type 2 Collagenopathies grouping. Validated with just validate, validate-terms, count-verified-snippets (67/67), the whole-repo offline gates, check-snippet-grading and validate-disorders.

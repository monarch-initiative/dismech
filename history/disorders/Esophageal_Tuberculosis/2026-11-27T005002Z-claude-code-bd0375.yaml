  summary: 'Create: Esophageal_Tuberculosis'
  details: |
    Created the esophageal tuberculosis entry (MONDO:0004189) from PubMed searches and the claude_code deep-research report research/Esophageal_Tuberculosis-deep-research-claude_code.md (first attempt succeeded; preflight-dr SKIP because MONDO records no causal gene). Primary and secondary forms are clinical-form subtypes; organism strata are deliberately lumped. The pathograph runs from three roots (mediastinal tuberculous lymphadenitis, adjacent pulmonary or spinal tuberculosis, swallowed bacilli) through nodal compression, nodal rupture and a granulomatous esophagitis node conforming to granuloma_formation#Organized Granuloma Assembly, to ulceration, pseudotumour, fistula, aortic erosion, traction fibrosis and constitutional symptoms. Frequencies come from the pooled 311-patient systematic review (PMID:34482490) where it gives them, otherwise from single series. Tuberculosis.yaml only mentions esophageal TB in one weight-loss evidence item and has no has_subtypes, so no pointer subtype was added. The stub was deleted. All snippets verified against cached references.

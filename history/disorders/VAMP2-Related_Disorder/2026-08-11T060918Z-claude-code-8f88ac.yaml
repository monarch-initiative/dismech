  summary: 'Exact-head audit: fix fourth copy of the epilepsy-genotype claim'
  details: |
    Definitive pre-merge audit, pinned to commit
    900c8d1b92d32a1233906c6d4abaaef6c4b9e018, with local, upstream and the live PR
    head all verified equal and the working tree clean before auditing. Appended;
    the eight preceding records stand unaltered. One blocker, three non-blocking
    findings, all fixed here.

    BLOCKER — a fourth copy of the epilepsy-genotype claim, never corrected while
    its three siblings were:

      mechanistic_hypotheses[0] (dominant_negative_snare_interference) asserted
      that the dominant-negative arm "accounts for dominant inheritance and for
      the more severe, epilepsy-bearing phenotype of the C-terminal missense
      carriers."

      The cached source refutes it directly: "Individual 1 did not present with
      epileptic seizures." Individual 1 carries p.Ser75Pro — the archetypal
      C-terminal missense variant, and the very variant whose mixed-liposome
      result is this hypothesis's decisive experiment.

      The entry already said the opposite in three other places (top-level
      description, effector node, Seizures phenotype evidence), all corrected in
      rounds three through five. This copy was introduced by the PR's first commit
      and missed by every round since.

      It also mis-attributed the association. The epilepsy link in PMID:32906212
      attaches to p.Gly73Trp and p.Arg56Leu, which this entry's own genetic notes
      place adjacent to and N-terminal of the cluster respectively, with an
      explicit warning not to extend the C-terminal claim to them.

      Rewritten to attribute the epilepsy association to the two variants the
      source actually ties it to, and to state that epilepsy does not track
      cluster membership. Two evidence items added: the p.Ser75Pro carrier's
      absence of seizures, curated PARTIAL as a bound on the hypothesis, and a
      sharpened explanation naming the two epilepsy-associated variants.

    NON-BLOCKING, also fixed:

    - The "slight brain atrophy" observation sat as SUPPORT under a node bound to
      HP:0012448 Delayed myelination. This was disclosed as out of scope in the
      previous record, but it is the same term-mismatch defect that rounds six and
      seven fixed by splitting out the corpus callosum and white matter findings,
      so it is fixed rather than carried forward. Now its own finding under
      HP:0012444 Brain atrophy.

    - The corpus callosum finding was bound to HP:0002079 Hypoplasia of the corpus
      callosum. That term asserts underdevelopment, which the index source never
      claims: its Table 1 says "thin corpus callosum" and its figure legend says
      "posteriorly slender". Only the second cohort calls it hypoplastic.
      Rebound to HP:0033725 Thin corpus callosum, whose definition explicitly
      covers thinning of undetermined cause, and the reasoning recorded in the
      description. The audit called this a curator's judgement; the conservative
      binding is the one consistent with this entry's practice of not
      over-reading a source.

    - progression notes dated central visual impairment to the first year. The
      source supports first-year onset for the movement disorder only; for CVI it
      says poor visual fixation was evident from the first months and the
      diagnosis came later. Corrected — the same CVI-versus-precursor distinction
      that was the previous round's headline fix, in the one block not revisited
      then.

    AUDIT-VERIFIED CLEAN at this head, independently re-derived rather than
    carried over: all 30 variant-localization statements; endocytosis node scoping
    and its REFUTE item; fusion-node variant-specific hedging; the two mechanism
    arms; every onset band against its cited age; graph semantics including edge
    direction against the module and causal_link_type calibration; every id/label
    pair and term choice; evidence_source consistency across all repeated snippets;
    frequency bands under a consistent stated denominator policy; exact file scope
    with validator-shaped cache additions and zero deletions; and byte-identity of
    all seven prior history records against their first-committed content.

    STILL NOT DONE, unchanged: six phenotypes have no incoming causal edge
    (Microcephaly, Nystagmus, Strabismus, Scoliosis, Self-Injurious Behavior,
    Sleep Disturbance); retinitis pigmentosa, progressive ataxia/tremor and

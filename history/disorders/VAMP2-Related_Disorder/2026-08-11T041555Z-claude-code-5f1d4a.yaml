  summary: 'Audit fixes: two blockers and eight should-fixes on PR #8323'
  details: |
    Follow-up session on PR #8323, appended rather than folded into the preceding
    REVIEW record (2026-08-11T033754Z-claude-code-a8c50f). That record describes
    the review session as it actually ran, including two judgements this session
    overturned; history is append-only, so it stands unaltered and this record
    supersedes it on those points.

    An independent adversarial audit of the branch found three factual errors in
    the preceding review. None were catchable by CI: all 117 snippets were
    verbatim substrings of their cached references and every ontology id/label
    pair matched OAK exactly. Each finding was verified against the cached source
    before acting on it.

    BLOCKERS OVERTURNING THE PRECEDING RECORD:

    1. The preceding record's "DELIBERATELY NOT DONE" section states that
       "Absent purposeful hand movements" was bound to HP:0007010 (Poor fine motor
       coordination) because "HPO has no term for the Rett-style loss-of-hand-use
       criterion; searches ... returned nothing suitable". That statement is
       false. HP:0032588 "Hand apraxia" carries the EXACT synonym "Lack of
       purposeful hand use" and is_a HP:0002186 Apraxia, which is the correct
       parent; HP:0007010 sits under HP:0002311 Incoordination, a different
       concept (dysmetria). The earlier OAK search HAD returned HP:0032588 and it
       was dismissed without reading its synonyms. Rebound to HP:0032588 and the
       notes block asserting the ontology gap was deleted.

    2. The endocytosis/recycling pathophysiology node claimed "the human variants
       reduce the number of vesicles released from the recycling pool in cellular
       models - so the recycling arm of the vesicle cycle is affected alongside
       the fusion arm", citing PMID:32906212. That paper tested endocytosis in
       exactly these variants and found none: "The post-stimulus fluorescence
       decay of syp-pH, representing endocytosis, is not significantly altered by
       any of the VAMP2 variants compared to WT". Its Methods define the quoted
       "recycling pool released" measure as an exocytosis-extent readout, not
       endocytic retrieval. The node is now scoped explicitly to the Vamp2-null
       mouse and the human negative result is curated as REFUTE. The preceding
       record's line "Endocytosis/recycling node ... evidenced by the knockout
       papers and the human recycling-pool deficit" is wrong on its second clause.

    3. The HUMAN_MODEL_MISMATCH rationale asserted "No published heterozygous
       Vamp2 mouse or knock-in of a human SNARE-motif variant is cited". A
       heterozygous null mouse has been published and is cited inside a paper
       already in the cache: "VAMP2 heterozygosity loss of function in mice causes
       only a mild phenotype (Monteggia, Lin, Adachi, & Kavalali, 2018)". Because
       that mouse is only mildly affected while the humans proposed to have a
       haploinsufficiency mechanism have a neurodevelopmental disorder, the fact
       strengthens the mismatch rather than weakening it. Rationale corrected and
       the proposed experiment narrowed to the genuinely untested knock-in arm.

    FURTHER CORRECTIONS:

    - Frequency justifications read "(100%), supporting the VERY_FREQUENT band",
      which contradicts docs/frequency-evidence-guidelines.md (100% maps to
      OBLIGATE). Rewritten to give the real reason - a five-proband denominator -
      and the autism band now cites the later-cohort patient who "did not meet
      criteria for autism".
    - The genotype-epilepsy correlation was asserted in three places and is
      refuted by Table 1 in both directions: Individual 1 (p.Ser75Pro, C-terminal
      missense, severe) "did not present with epileptic seizures"; Individual 4
      (p.Val43del, mild) had eyelid myoclonia and non-convulsive status
      epilepticus. Hedged, with the counter-example curated as evidence.
    - The ExAC snippet was truncated to "there are no listed loss-of-function
      variants in VAMP2", which reads as an absolute claim that this entry itself
      contradicts by curating p.Arg56* and p.Tyr113Glnfs*12. Extended to include
      the ExAC/60,706-exome framing.
    - The p.Arg56* negative dominant-negative result was reported without the
      authors' caveats ("Although not directly tested, this variant could also
      result in a dominant negative effect"; the construct "lacks the
      transmembrane domain"). Since that null result is the sole basis for the
      haploinsufficiency arm, the caveat now appears on the node, the variant, and
      the hypothesis.
    - The 4-aminopyridine treatment lacked the authors' safety limitation ("4-AP
      should be used cautiously in patients with epilepsy given risk of lowering
      seizure threshold"), material in a disorder where epilepsy is curated.
    - Evidence retagged where the tag outran the quoted passage: Discussion
      speculation ("would translate to a dramatic effect") and definitional
      background moved from SUPPORT/HUMAN_CLINICAL to PARTIAL/OTHER; the generic
      synaptopathy framing sentence used on three phenotype edges downgraded to
      PARTIAL; the NMD prediction retagged PARTIAL/OTHER. One snippet mixing an in
      vitro result with a clinical phenotype was split into two items per the
      CLAUDE.md single-source rule.
    - "C-terminal cluster" confined to Ser75/Phe77/Glu78; residues 56, 66 and 67
      are not in the C-terminal half, and 56 is the same residue the entry
      classifies separately as the truncation site.

    ADDITIONS: three missing variants (p.Arg56Leu c.167G>T, p.Gly73Trp c.217G>T,
    p.Tyr113Glnfs*12 c.337_341delTACTT) plus the c.166C>T designation for
    p.Arg56*; nystagmus, strabismus and scoliosis phenotypes; and eight causal
    edges connecting previously orphaned phenotypes into the pathograph, each
    with its own evidence for the clinical association and an explicit
    INDIRECT_UNKNOWN_INTERMEDIATES link type where no mechanism is established.

    DECLINED, WITH REASONS: no target_mechanisms on the antiseizure treatment -
    valproate, vigabatrin and lamotrigine act on sodium channels, GABA
    transaminase and glutamate release, none on the VAMP2 lesion, so the edge
    would assert a link that does not exist. BYPASSES retained for aminopyridine:
    the drug recruits an alternative pathway (K+ channel blockade raising Ca2+
    entry) to work around the SNARE deficit rather than repairing it, matching the
    enum definition; flagged as a judgement call. GeneReviews checked directly -
    VAMP2[Title/Abstract] AND GeneReviews[Book] returns 0 hits.


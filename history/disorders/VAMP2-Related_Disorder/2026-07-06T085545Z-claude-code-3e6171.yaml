  summary: 'Create: VAMP2-Related Neurodevelopmental Disorder'
  details: |
    Created VAMP2-Related Neurodevelopmental Disorder (MONDO:0032900, OMIM:618760), the v-SNARE conformer completing the three core neuronal SNAREs in synaptic_vesicle_cycle (VAMP2/synaptobrevin-2 C-terminal SNARE-motif defect -> impaired SNARE-mediated fusion -> disrupted neurotransmission). Reference PMID:30929742 (Salpietro AJHG 2019, 5 de novo cases, lipid-mixing fusion assay). Validated: schema, terms, exact-substring snippet check (16/16). Added to grouping (SATISFIED).

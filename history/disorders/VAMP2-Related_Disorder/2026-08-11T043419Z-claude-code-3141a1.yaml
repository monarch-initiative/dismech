  summary: 'Second audit round: fix half-applied corrections and two frequency bands'
  details: |
    Second independent adversarial audit, run against the exact commit
    5940b23a44104290b470a192d624a658236837e2 and instructed to re-derive rather
    than trust the first audit round. Appended as a new record; the two preceding
    records stand unaltered.

    The dominant theme was corrections applied in one place but not another. The
    first fix round left the KB in a state where two sections asserted opposite
    things, and one "fix" was a net regression.

    BLOCKERS:

    1. Self-contradiction about which variants are C-terminal. The fix round
       rewrote genetic[0].notes to confine the C-terminal cluster to
       Ser75/Phe77/Glu78 but left the pathophysiology "VAMP2 v-SNARE Defect"
       description still listing p.Arg66Pro, p.Ala67Pro and p.Gly73Trp as
       clustering C-terminally. Two sections of the same file then said opposite
       things about the same three variants. Both now agree.

       The correction had also over-shot on p.Gly73Trp: PMID:32906212 describes a
       variant "in close proximity to the Gly73Trp (Pt. 2) variant described here,
       Ser75Pro", and residue 73 is in the C-terminal half of the 31-91 motif. It
       is now described as adjacent to the cluster rather than "elsewhere".

    2. A regression introduced by the previous round. The Motor Stereotypies
       frequency justification had been "improved" by swapping in the snippet
       "A virtual absence of purposeful hand movements was present in all cases" -
       which is about a different phenotype, and is the same snippet already used
       on Absent Purposeful Hand Movements - and by adding the assertion that
       "Table 1 records stereotyped hand movements in each". That assertion is
       false: Table 1 for Individual 2 reads "body rocking, head banging,
       screaming, absent purposeful hand movements", with no stereotyped hand
       movements. The original snippet ("All children showed autistic features,
       typically including flapping or flailing of the arms, as well as hand
       wringing or clapping") was the better one and has been restored; the false
       Table 1 claim is deleted and the varying repertoire is stated in the
       description instead.

    FURTHER FIXES:

    - The fusion node had a downstream edge to the endocytosis/recycling node,
      inverting kb/modules/synaptic_vesicle_cycle.yaml, where the endocytosis node
      is upstream of fusion - and both disorder nodes declare conforms_to those
      module nodes. The cited snippet ("synaptobrevin is essential for two fast
      synapse-specific membrane trafficking reactions") states the two as parallel
      requirements of one protein, which supports sibling arms, not causation. The
      edge now originates from the trigger node.
    - The Vamp2-null mouse link to the endocytosis node was RECAPITULATES /
      MODERATE, on the one arm the preceding round had scoped as negative in
      humans. Downgraded to PARTIALLY_RECAPITULATES / LOW with the disagreement
      stated in limitations.
    - VERY_FREQUENT on Absent Purposeful Hand Movements and Motor Stereotypies was
      derived from a 5/5 index cohort while the cached second cohort contradicts
      it - "He uses basic appliances and repairs simple things", "he can color",
      "He can run, walk slowly upstairs, and scribble with a coarse grasp". This
      is anti-pattern 4 in docs/frequency-evidence-guidelines.md: the narrow
      denominator's extension was available and refutes the band. Both are now
      FREQUENT, with the retained-hand-use quote curated as REFUTE.
    - Two phenotype descriptions asserted "in every reported individual" while
      evidence added in the same round refuted it. Both now say "of the index
      cohort" and state the exception.
    - The putamen/frontal-lobe expression snippet was tagged HUMAN_CLINICAL; the
      source describes microarray data from post-mortem brain tissue. Retagged
      OTHER. This item was missed by the previous round's retagging pass.
    - prevalence notes misread the source: PMID:37901860 says 11 patients were
      reported *previously* and introduces a twelfth. The note had folded that
      twelfth into the 11 and silently dropped PMID:32336483 from the accounting.
    - Four causal edges were DIRECT while their own explanations said no
      intermediates are established, against eight sibling edges added in the same
      session using INDIRECT_UNKNOWN_INTERMEDIATES. Made consistent.
    - Added the fifth variant from PMID:32906212, a de novo start-loss c.1A>G
      (p.Met1?), which fits none of the three allelic classes; genetic notes now
      state the scheme is the literature's and not exhaustive.

    CORRECTION TO THE PRECEDING AUDIT RECORD
    (2026-08-11T041555Z-claude-code-5f1d4a), which is append-only and left
    unaltered: it reports "Targeted structural tests (conforms_to node refs,
    subtype foreign keys, model readout targets, environmental mechanism targets):
    10012 passed". The four selectors named there collect 7964, not 10012. The
    10012 figure came from a run that also included a fifth selector,
    failure_to_recapitulate, which the record omitted from its description. The
    number was real but the description was incomplete, making it unreproducible
    as written. Verified here: `pytest tests/test_data.py -k "<those four>"
    --collect-only` reports "7964/32104 tests collected".

    KNOWN REMAINING GAPS, not addressed here: ten phenotypes still have no
    incoming causal edge (including Nystagmus, Strabismus and Scoliosis, added in
    the previous round), and several features from the second cohort remain
    uncurated (retinitis pigmentosa, progressive ataxia/tremor, hearing loss,
    ADHD). Adding speculative edges to close the connectivity gap would assert
    mechanisms that are not established, so they are recorded here rather than
    invented.


  details: |
    Sixth independent adversarial audit, pinned to commit
    f0741d95f7124e9f80742e74b358d4ab7c106e92, plus a blocking CHANGES_REQUESTED
    review from the repository's automated reviewer at the same commit. The two
    converged on the same finding. Appended; the six preceding records stand
    unaltered.

    CORRECTION TO THE PRECEDING RECORD
    (2026-08-11T052627Z-claude-code-5372d5), committed and append-only, so
    corrected here rather than edited:

      Its PATTERN NOTE states that the half-applied corrections were "caught by
      adversarial audit, none by CI, which passed and approved at four of the five
      commits."

      "None by CI" is false. The repository's automated reviewer returned
      CHANGES_REQUESTED at commit 5940b23a44, titled "Request changes — one stale
      explanation contradicts the corrected node", and it correctly identified a
      stale explanation on the fusion node that contradicted the corrected
      endocytosis node. That is exactly the defect class the note claims CI never
      caught. It also returned CHANGES_REQUESTED at f0741d95f7 for the stale
      childhood cross-references below, independently of the audit.

      The accurate statement is narrower: the automated reviewer approved four of
      six commits, and at two it caught real defects — one of which no audit round
      had reported. It missed findings the audits caught, and the audits missed a
      finding it caught. Neither is redundant with the other, and the original
      note gave CI too little credit.

    FIXES THIS ROUND:

    1. Three stale cross-references to a CHILDHOOD onset context that the previous
       commit had renamed to JUVENILE — a dangling "see the CHILDHOOD context
       below" pointing at nothing, and two explanations still describing the
       8-year onset as childhood. Because CHILDHOOD is bound to HP:0011463
       (1-5 years), those explanations restated in prose precisely the
       contradiction the previous commit removed from the structured field. Both
       the audit and the automated reviewer flagged this independently. Fixed to
       JUVENILE / juvenile-onset / juvenile.

    2. The corpus callosum evidence added last round sat on an imaging node bound
       to HP:0012448 Delayed myelination, so the machine-readable output attached
       corpus callosum hypoplasia to a myelination term. Split into its own
       finding bound to HP:0002079 Hypoplasia of the corpus callosum, carrying
       both the index-cohort observation and the second-cohort corroboration; the
       myelination node renamed accordingly and its description updated.

    3. Added the sympathetic skin response result from PMID:32906212 — the only
       in-human functional measurement bearing on the haploinsufficiency arm, in
       the truncating-variant carrier. Curated PARTIAL, not SUPPORT: the source
       says the result provides "confirmation that VAMP2 haploinsufficiency caused
       symptoms", which is an n-of-1 overclaim — one patient, no controls, and an
       assay that cannot distinguish reduced gene dose from any other cause of
       impaired transmission. The entry elsewhere calls this arm evidence-poor, so
       omitting its one supporting measurement was a real gap.

    4. Softened "neither association holds across all reported patients" in the
       top-level description: hyperkinetic movement is directly documented outside
       the C-terminal cluster, whereas for central visual impairment it is the
       preceding poor visual fixation that is — a weaker claim, now stated as such.

    DECLINED: lifting this record series' pattern note into shared documentation
    for other curators. It is a reasonable idea and would be a sensible follow-up
    issue, but adding a docs file to a disorder-curation PR expands its scope, and
    the observation is already durable here in the entry's own provenance.

    STILL NOT DONE: six phenotypes have no incoming causal edge (Microcephaly,
    Nystagmus, Strabismus, Scoliosis, Self-Injurious Behavior, Sleep Disturbance);
    retinitis pigmentosa, progressive ataxia/tremor and hearing loss from the
    second cohort remain uncurated; prevalence notes decompose the 2023 review's
    "11 patients" into named cohorts, which is a sound inference but not stated by
    that source; and the effector node bundles a cellular and an organism-level
    claim under one biological_scale, which is pre-existing on origin/main.


  details: |
    Third independent adversarial audit, pinned to commit
    68546eda144e35c959803180391c21a6ac3d093e and told to treat the previous
    round's fixes with extra suspicion. Appended; the three preceding records
    stand unaltered. No blockers this round — nothing fabricated, no wrong PMID,
    no invented term, no broken reference, no rewritten history — but four
    should-fix findings, three of which were introduced by the previous commit.

    The recurring pattern remains half-applied corrections, now in the frequency
    and allelic-class layers.

    1. Genotype restriction on the hyperkinetic movement disorder was contradicted
       by a source this entry cites six times. The phenotype, the effector node,
       and progression all said the movement disorder belongs to the three
       C-terminal missense carriers, with onset in the first year. But
       PMID:32336483 reports "At 8 years of age hyperkinetic movement occurred."
       in the p.Ala67Pro carrier — and the previous commit had explicitly
       classified p.Ala67Pro as lying N-terminal to that cluster. The entry
       therefore asserted both that Ala67Pro is not C-terminal and that the
       movement disorder is C-terminal, while holding cached evidence of the
       movement disorder in that carrier. All three descriptions are now scoped to
       the index cohort with the exception stated, and the counter-example is
       curated as evidence. The same scoping fix had been applied to Autistic
       Behavior and Motor Stereotypies in the previous commit but not here.

    2. The Motor Stereotypies demotion to FREQUENT was wrong and has been
       reverted to VERY_FREQUENT. It rested on inferring absence from silence:
       PMID:32906212 contains zero occurrences of "stereotyp" (verified by
       case-insensitive grep over the whole cached body), so it neither reports
       nor excludes stereotypies. The demotion also overlooked a positive case in
       a sentence this entry already quotes three times elsewhere — PMID:37901860,
       "...microcephaly, nystagmus, strabismus, and stereotypies" — making
       stereotypies 6/6 of assessed patients, not 5/12. And it inverted the
       sibling ordering: Autistic Behavior remained VERY_FREQUENT despite a
       documented negative in the same cohort, while the phenotype with no
       counterexample was banded lower. The band is restored with the narrow
       denominator documented (the guidelines' remedy for anti-pattern 4) and the
       PMID:37901860 case added as evidence.

       The FREQUENT band on Absent Purposeful Hand Movements is retained: unlike
       stereotypies, that one has documented counterexamples in the second cohort
       (patients who colour, scribble with a coarse grasp, use simple appliances).

    3. REFUTE was used where PARTIAL belongs. The retained-hand-use item and the
       "did not meet criteria for autism" item are the same patient, same paper,
       same logical role — one bounds frequency, it does not contradict the
       disease-phenotype association. Only the syp-pHluorin endocytosis item,
       where a direct measurement contradicts the mechanism its node asserts,
       remains REFUTE.

    4. The "not exhaustive" caveat on the three-class allelic scheme, added to
       genetic notes in the previous commit, is now carried into the top-level
       description and the trigger node description as well.

    Smaller: central visual impairment scoped to the index cohort (its own
    evidence cites the Ala67Pro case for poor visual fixation); the speech
    phenotype renamed to "Absent Speech" so name, HP:0001344 binding, and the 3/5
    numerator agree, with the two limited-speech carriers explicitly excluded from
    the numerator; the "milder phenotype without epilepsy" clause downgraded to
    PARTIAL since a milder phenotype is consistent with but does not establish
    haploinsufficiency; the putamen expression item retagged OTHER -> IN_VITRO,
    since a microarray on post-mortem brain tissue is a tissue assay under the
    CLAUDE.md classification table; and the start-loss snippet extended to include
    the protein designation. The other three variant snippets could not be
    extended the same way — the protein designation is split from the c. notation
    in the cached body, so no contiguous substring covers both.

    NOT ADDRESSED, recorded rather than papered over: ten phenotypes still have no
    incoming causal edge; PMID:34653234 contributes a further patient not counted
    in the frequency denominators; and several second-cohort features (retinitis
    pigmentosa, progressive ataxia/tremor, hearing loss, ADHD) remain uncurated.

    NOTE ON A COMMIT MESSAGE, not on a history record: the previous commit's
    message says the branch history diff is "296 insertions, 0 deletions". That
    counted only the two records existing at the time; with the third it was
    423/0. The deletion count — the claim that actually matters for append-only —
    was and remains 0. Commit messages are immutable and this is corrected here
    rather than by rewriting history.


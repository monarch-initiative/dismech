  summary: 'Review response: drop the invented ''bounded'' grading token'
  details: |
    Response to the two blocking prose findings in the ai4c-reviewer review of PR 10258. The reviewer is right on both and the second is the more important. When rewriting explanations away from the retired supports: PARTIAL, I substituted the word 'bounded' into the same sentence position for nineteen items in this entry. That is a new undefined grading token occupying the slot PARTIAL had just vacated: it is not established usage anywhere in kb/ in that sense, it has no retired enum value behind it to trace, and because no gate catches prose an ungreppable synonym is worse than the token it replaces. It would also have set the pattern for roughly 3,580 remaining items. In every case the surrounding clause already stated the real limitation, so the token is simply removed: 'no mechanistic route is established, hence bounded' becomes 'no mechanistic route is established'. The 'and an indirect edge' clauses are kept, since those correctly describe causal_link_type rather than the evidence grade, and the three items whose reason is a prediction rather than a measurement now say that this is why evidence_source is OTHER. Separately, one explanation said 'hence bounded rather than SUPPORT for a general recommendation' on an item carrying supports: SUPPORT - a construction that only parsed while a third enum value existed, and which after the migration flatly denied the item's own value. Rewritten to state what the item does support, the observation having been made, and what it does not, a general recommendation. No directness was added to any of these; leaving them unassessed is the right call and the reviewer endorsed it. No supports value, snippet, reference, evidence_source or ontology term changed. Validated with just validate-disorders across the tranche: 439/439 snippets verified, consistency check zero in both directions.

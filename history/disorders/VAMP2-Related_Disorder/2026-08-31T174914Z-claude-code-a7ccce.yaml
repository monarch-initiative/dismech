  summary: Rewrite 27 explanations naming the retired PARTIAL grade; add directness
  details: |
    Residue cleanup after #10003, which retired supports: PARTIAL and migrated 11,804 enum values to SUPPORT while deliberately leaving every explanation that justified the old grade in place. This entry therefore explained a value the schema no longer has. Each explanation is rewritten to preserve the original curator's reasoning verbatim - the specific limitation each item carries - restated in terms of the current enum, following the pattern set by PR 10120. Where that reason IS an inference step, meaning the finding reaches this entry through a parent entity, a model organism, a pooled cohort or a disease class rather than from this disorder directly, directness: INDIRECT is added, because that is the slot the reason was always describing. Where the reason is something else - a variable phenotype, an untested construct, an n-of-1 overclaim - the retired token is dropped without asserting a directness nobody assessed. A consistency check enforces both directions: no explanation claims INDIRECT without the item carrying it, and no item carries it without the explanation saying why. No supports value, snippet, reference, evidence_source or ontology term changed. Twenty-one rewritten mechanically and six by hand. Four gain directness: INDIRECT - a mouse-knockout fusion result standing in for the human heterozygous reduced-dose state, and two general framing sentences that establish VAMP2 disruption impairs brain development without demonstrating the specific edge they sit on. The rest keep their caveat without a directness claim, notably the autonomic-response item, whose curator had written PARTIAL rather than SUPPORT to resist the source's own 'providing confirmation' phrasing; the criticism is preserved as prose stating that the item carries the measurement and not the confirmation, since the retired middle value no longer exists to express it. Validated with just validate-disorders across the tranche: 439/439 snippets verified.

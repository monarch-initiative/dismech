  summary: 'Review: VAMP2 NDD completeness and claim-evidence match'
  details: |
    Completeness and claim-evidence review of the VAMP2 entry, which had been
    curated from the abstract of a single reference (PMID:30929742). The cached
    reference turned out to hold the full text, and a literature sweep found three
    further clinical reports plus the two knockout-mouse papers the index report
    only cites. Both facts drove the review.

    CLAIM-EVIDENCE CORRECTIONS (claims that outran their cited evidence):

    1. The central effector node asserted that "disease variants in the C-terminal
       SNARE motif impair vesicle fusion, as shown directly in a reconstituted
       lipid-mixing assay". The assay tested two variants. p.Ser75Pro reduced
       fusion to ~25% of wild-type and was not Munc18-1-activatable (>90% LOF);
       p.Glu78Ala was indistinguishable from wild-type; p.Phe77Ser could not be
       purified and was never tested. The abstract sentence that was cited is
       itself hedged ("one of the possible associated disease mechanisms") and the
       discussion states the mechanism is mutation-specific. Node rewritten as
       variant-specific, with the negative p.Glu78Ala result curated as its own
       PARTIAL evidence item so the bound on the claim is visible.

    2. The top-level description said the single-amino-acid deletions affect
       "conserved residues of the C-terminal VAMP2 SNARE motif". The deletions are
       at residues 43 and 45; only the missense variants cluster C-terminally
       ("The de novo non-synonymous variants identified in this study cluster in
       close proximity within the C-terminal portion of the SNARE motif").
       Corrected, and the genetic evidence now carries that sentence with an
       explanation naming the distinction.

    3. The antiseizure treatment listed levetiracetam as its therapeutic_agent.
       Levetiracetam appears nowhere in the literature for this disorder. The
       agents actually trialed were valproic acid, vigabatrin, and lamotrigine,
       with benefit reported only for valproic acid in one individual. Replaced,
       with evidence, and the single-case ACTH response for infantile spasms
       (PMID:32336483) added. The valproate benefit is curated PARTIAL - it is one
       uncontrolled observation.

    4. The phenotype named "Epilepsy" was bound to HP:0002353 (EEG abnormality).
       Split into Seizures (HP:0001250), Infantile Spasms (HP:0012469), and EEG
       Abnormality (HP:0002353); the source explicitly documents an individual
       with an abnormal EEG and no clinical seizures, so the two are dissociable.

    COMPLETENESS ADDITIONS:

    - Second mechanism arm. PMID:32906212 reports an independent five-patient
      cohort including a stop-gain variant, absent from the entry entirely. It
      separates dominant-negative missense action from truncating-variant
      haploinsufficiency, with a phenotypic correlate (the truncating carrier was
      milder, without epilepsy). Added as two pathophysiology nodes, two
      mechanistic_hypotheses (dominant_negative_snare_interference CANONICAL,
      truncating_haploinsufficiency ALTERNATIVE), and hypothesis_groups on the
      branching causal edges.
    - Endocytosis/recycling node, conforming to the module node of the same name,
      evidenced by the knockout papers and the human recycling-pool deficit.
    - 4-aminopyridine / 3,4-diaminopyridine as an investigational treatment with
      target_mechanisms (BYPASSES the fusion node - it raises calcium drive rather
      than repairing the SNARE). Deliberately framed as n-of-1: one patient, no
      control, and the responder carried the haploinsufficiency allele.
    - animal_models: Vamp2 knockout mouse with modeled_mechanisms against both the
      fusion and recycling nodes, PARTIALLY_RECAPITULATES for fusion (the paper
      concludes VAMP2 is catalytic, "not absolutely required").
    - experimental_models: the liposome assay and the variant-expressing neuron
      system, each with its limitations recorded - the liposome assay lacks
      synaptotagmin/complexin/Munc13, which is precisely why p.Glu78Ala scores
      normal.
    - discussions: KNOWLEDGE_GAP on p.Glu78Ala pathogenicity without a fusion
      defect; HUMAN_MODEL_MISMATCH on the homozygous perinatally-lethal null mouse
      versus heterozygous surviving humans (the null cannot exhibit
      dominant-negative interference at all).
    - 12 further phenotypes, 8 variants, imaging_findings, an Angelman-syndrome
      differential (PMID:34653234 recovered VAMP2 from an AS-like cohort), and
      evidence for the Rett differential which previously had none.
    - Frequency bands added only where the source states a count or an explicit
      "all children"/"in all cases", each with its own justifying evidence item.
      Deliberately omitted for seizures and EEG abnormality: the narrative says
      "four affected individuals" while Table 1 shows five abnormal EEGs, and
      guessing between them is not curation.

    DELIBERATELY NOT DONE:

    - datasets left empty. `just discover-datasets` returned exactly one
      candidate, a dengue-vaccination series matched on the VAMP2 gene symbol
      (geo:GSE98053, GENE_ONLY). That is the Named Entity Confusion pattern the
      curation docs warn about; a gene-only hit is not a dataset about this
      disorder.
    CORRECTIONS MADE AFTER INDEPENDENT AUDIT (see the PR thread):

    The first draft of this review contained three errors of its own, all found by
    an independent adversarial audit rather than by CI, and all fixed before merge:

    a. "Absent purposeful hand movements" was bound to HP:0007010 (Poor fine motor
       coordination) with a notes block asserting HPO has no term for the
       Rett-style loss-of-hand-use criterion. That was false. HP:0032588 "Hand
       apraxia" carries the EXACT synonym "Lack of purposeful hand use" and sits
       under HP:0002186 Apraxia, which is the right parent; HP:0007010 sits under
       Incoordination, a different concept. My own OAK search had returned
       HP:0032588 and I wrongly dismissed it. Rebound to HP:0032588; notes deleted.

    b. The endocytosis/recycling node claimed "the human variants reduce the number
       of vesicles released from the recycling pool ... so the recycling arm is
       affected alongside the fusion arm", citing PMID:32906212. That paper tested
       endocytosis in exactly these variants and found none: "The post-stimulus
       fluorescence decay of syp-pH, representing endocytosis, is not significantly
       altered by any of the VAMP2 variants compared to WT". The "recycling pool
       released" measure is an exocytosis-extent readout, not a measure of
       endocytic retrieval. The node is now scoped explicitly to the mouse
       knockout, and the human negative result is curated as REFUTE.

    c. The HUMAN_MODEL_MISMATCH rationale asserted "No published heterozygous Vamp2
       mouse ... is cited". A heterozygous null mouse has been published and is
       cited inside a paper already in the cache: "VAMP2 heterozygosity loss of
       function in mice causes only a mild phenotype (Monteggia et al., 2018)".
       That fact argues against the haploinsufficiency arm, so it strengthened the
       mismatch rather than weakening it. Rationale corrected and the proposed
       experiment narrowed to the untested knock-in arm.

    Also from the audit: frequency justifications no longer say "(100%), supporting
    the VERY_FREQUENT band" (100% maps to OBLIGATE); they now state the narrow
    five-proband denominator, and the autism band cites the later-cohort patient
    who did not meet autism criteria. The genotype-epilepsy correlation was hedged
    - Individual 1 (C-terminal missense, severe) had no seizures while Individual 4
    (deletion, mild) did. The ExAC snippet was extended so it no longer reads as an
    absolute claim that VAMP2 has no LoF variants, which this entry contradicts by
    curating two. The p.Arg56* negative dominant-negative result now carries the
    authors' caveat that the construct lacked the transmembrane domain and the
    effect was not directly tested. The 4-aminopyridine entry now carries the
    seizure-threshold safety warning. Background/definitional and speculative
    evidence items were retagged (SUPPORT/HUMAN_CLINICAL -> PARTIAL/OTHER as
    appropriate), and one snippet mixing an in vitro result with a clinical
    phenotype was split into two items per the CLAUDE.md rule.

    Declined, with reasons: no target_mechanisms on the antiseizure treatment
    (valproate/vigabatrin/lamotrigine act on sodium channels, GABA transaminase and
    glutamate release, none of them on the VAMP2 lesion - an edge would assert a
    mechanistic link that does not exist). BYPASSES retained for aminopyridine: the
    drug recruits an alternative pathway (K+ channel blockade raising Ca2+ entry) to
    work around the SNARE deficit rather than repairing it, which matches the enum
    definition. GeneReviews checked directly - VAMP2[Title/Abstract] AND
    GeneReviews[Book] returns 0 hits, so no chapter exists.


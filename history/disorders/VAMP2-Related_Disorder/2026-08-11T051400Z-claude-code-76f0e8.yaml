  details: |
    Fourth independent adversarial audit, pinned to commit
    a8b66210b19039bd23571cf03c44adbad1d3b46b. Appended; the four preceding records
    stand unaltered. No blockers. Four should-fixes, one of which is a false
    statement I wrote into the immediately preceding record.

    CORRECTION TO THE PRECEDING RECORD
    (2026-08-11T045658Z-claude-code-4549fa), which is committed and append-only,
    so it is corrected here rather than edited:

      That record states, of three variant evidence snippets that stop just short
      of their protein designations, "The other three variant snippets could not
      be extended the same way — the protein designation is split from the c.
      notation in the cached body, so no contiguous substring covers both."

      That is false for all three. The cached body of PMID:32906212 contains
      "c.167 G>T, p.Arg56Leu)", "c.217G>T, p.Gly73Trp)." and
      "deletion TACTT p.Tyr113Gln frameshift," each contiguous on one line. My
      check had searched for "p. Arg56Leu" with a space after the period, which
      the source does not use; I then recorded the failed search as a property of
      the source rather than of my query. All three snippets are now extended.

      This is the third consecutive round in which a fix commit asserted something
      untrue about a cached reference, and it is the most serious of the three
      because a record is provenance: merging would freeze the false claim.

    OTHER FIXES:

    - Half-applied evidence_source convention. The "definitional background ->
      OTHER" rule introduced two rounds ago was applied to one copy of the
      syntaxin-1A/SNAP25 sentence on the fusion node but not to the identical
      snippet under differential_diagnoses, which stayed HUMAN_CLINICAL. The entry
      stated a rule and violated it three sections later. Both are now OTHER.

    - Half-applied scoping introduced by the commit under audit. That commit
      rewrote three prose locations to say the hyperkinetic movement disorder's
      infantile onset does not generalize, but left the structured
      phenotype_contexts onset record asserting INFANTILE with the note "Starts in
      the first year of life" and an explanation reading "Establishes infantile
      onset". The structured layer contradicted the prose that retracted it. The
      INFANTILE context is now scoped to the index cohort and a second CHILDHOOD
      context added for the p.Ala67Pro carrier ("At 8 years of age hyperkinetic
      movement occurred.").

    - ADHD was missing while five singleton features from a single case report
      were curated. It appears in two of five second-cohort patients, one with a
      formal diagnosis, and one of the two quotes was already cited in this entry
      for a different phenotype. Added as HP:0007018.

    SMALLER: the top-level description's C-terminal severity claim scoped to the
    index cohort, the last of four locations; two stale "denominator is five
    probands" clauses updated where a sixth-patient item now exists; the
    pathophysiology gloss of the abstract's loose "all five variants are
    C-terminal" sentence now notes that the discussion and the genetic section are
    more precise; rat species added to the syp-pHluorin model's limitations, which
    matters because that system supplies the negative endocytosis result the entry
    leans on; prevalence measure_type UNKNOWN -> CASES_IN_LITERATURE to match its
    own note; and four derivable orphan phenotypes (Chorea, Dystonia, Myoclonus,
    Infantile Spasms) connected to the effector node with evidence, reducing
    unconnected phenotypes from ten to six.

    REVERTED FROM THE PREVIOUS ROUND: the putamen microarray item was retagged
    OTHER -> IN_VITRO last round with the justification that it is "a tissue assay
    under the CLAUDE.md classification table". That table has no such category —
    its IN_VITRO covers cultured cells, tissue explants, organoids, ex vivo
    slices, and biochemical assays outside an organism, none of which is bulk
    post-mortem brain tissue. Reverted to OTHER.

    STILL NOT DONE: six phenotypes remain without an incoming causal edge
    (Microcephaly, Nystagmus, Strabismus, Scoliosis, Self-Injurious Behavior,
    Sleep Disturbance); PMID:34653234 contributes a patient not counted in the
    frequency denominators; retinitis pigmentosa, progressive ataxia/tremor and
    hearing loss from the second cohort remain uncurated; and the effector node
    "Disrupted Neurotransmission and Impaired Neurodevelopment" bundles a cellular
    and an organism-level claim under a single biological_scale, which is the
    signal CLAUDE.md gives for splitting a node — that one is pre-existing on
    origin/main and out of scope for this PR.


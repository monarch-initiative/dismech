  details: |
    Seventh independent adversarial audit, pinned to commit
    5d10db13ba75f3c881af00bc4592ef753c33cd69. Appended; the seven preceding
    records stand unaltered. No blockers. Two should-fixes, both introduced by the
    commit under audit — and both, once again, a correction applied to one copy of
    a claim and not its sibling. The audit predicted this before looking and was
    right in both of that commit's two prose edits.

    1. The softened central-visual-impairment claim was applied to the top-level
       description and not to the pathophysiology node making the same claim. The
       node still read "that restriction does not hold across all reported
       patients: a p.Ala67Pro carrier developed a hyperkinetic movement disorder,
       and seizures occur across allelic classes." That asserts the restriction
       fails for both CVI and hyperkinetic movement — the overstatement the
       top-level edit had just removed — and supports the CVI half with a
       non-sequitur, substituting seizures for the missing evidence. What the
       source actually supports is the precursor: PMID:32336483 documents poor
       visual fixation outside the cluster, not central visual impairment itself.
       The node now mirrors the corrected wording and states the seizure point
       separately.

    2. Renaming the imaging node to "Delayed Myelination and White Matter Volume
       Loss" headlined a conjunct that nothing on the node bound or evidenced. The
       rename replaced the corpus-callosum conjunct (correctly split out last
       round) with white-matter volume, but the node's term stayed HP:0012448
       Delayed myelination and neither remaining snippet mentions volume. Applied
       the same reasoning the previous split used: the cached figure legend says
       "There is some generalized delay in the maturation of myelin and a reduced
       volume of the cerebral white matter posteriorly", and HP:0034295 Reduced
       cerebral white matter volume exists, so volume loss is now its own finding
       and the node is simply "Delayed Myelination".

    Also fixed, cosmetic: a cross-reference pointing to the juvenile-onset context
    as "below" when it is above; and nystagmus, described as reported in a single
    later case when the second cohort reports it too ("Parents noticed nystagmus
    during infancy.").

    ON THE PRECEDING RECORD'S REVIEW COUNT: it says the automated reviewer
    "approved four of six commits and caught real defects at two". The literal
    review list shows five APPROVE and two CHANGES_REQUESTED across six reviewed
    commits, because 5940b23a44 received both within 42 seconds from two
    concurrent review jobs. The intended partition — four commits clean, two with
    defects — is the accurate reading and the record's substantive correction
    stands. Recorded here for precision rather than as an error requiring another
    round.

    STILL NOT DONE, unchanged and deliberately scoped out: six phenotypes have no
    incoming causal edge (Microcephaly, Nystagmus, Strabismus, Scoliosis,
    Self-Injurious Behavior, Sleep Disturbance); retinitis pigmentosa, progressive
    ataxia/tremor and hearing loss from the second cohort remain uncurated; the
    "slight brain atrophy" observation sits on the myelination finding without a
    matching term; prevalence notes decompose the 2023 review's "11 patients" into
    named cohorts, a sound inference not stated by that source; and the effector
    node bundles a cellular and an organism-level claim under one
    biological_scale, which is pre-existing on origin/main. These belong in
    follow-up issues, not in this PR.


  summary: 'Create: HOD syndrome (CLCN7 gain-of-function)'
  details: |
    Created kb/disorders/Hypopigmentation_Organomegaly_And_Delayed_Myelination_And_Development.yaml for HOD syndrome, MONDO:0032805, de novo gain-of-function CLCN7. Deep research: OpenScientist (committed report plus HTML/PDF artifacts). Twelve pathophysiology nodes forming a single connected DAG from the variant to four clinical branches; 57 evidence snippets, all verified against cached references, and all 57 reference_title values machine-audited against references_cache frontmatter. Built primarily from five primary sources covering all five published patients. The report was used as a check rather than a source and independently reproduced the causal chain, including flagging the melanosome step as inferred. Three of the report's ontology identifiers were wrong and are recorded in the entry notes: MONDO:0032781 offered as the disease ID is a different syndrome, HGNC:2023 offered for CLCN7 is CLCN5, and HP:0007730 was mislabelled and contradicts the primary source on iris involvement. All identifiers used were resolved against local OAK builds. Corrected one claim of my own during curation: heterozygous CLCN7 loss of function is silent, and Albers-Schonberg ADO II is dominant-negative rather than simple loss (PMID:11741829). Report term validation could not be run: repeated OLS read timeouts at the validator's five-second limit; the report's CURIEs were instead resolved manually against local OAK, and reference validation ran cleanly at 19/19 resolved with one off-topic flag on PMID:31214276, which is cited here only as directness INDIRECT for general melanocyte pH biology. Validated with just validate, validate-terms, count-verified-snippets, check-enum-values, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-snippet-grading and check-environmental-evidence.

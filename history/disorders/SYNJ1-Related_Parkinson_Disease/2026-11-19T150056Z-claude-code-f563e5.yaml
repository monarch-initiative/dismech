  summary: 'Create: SYNJ1-Related Parkinson Disease (PARK20)'
  details: |
    Created standalone per-gene entry SYNJ1-Related Parkinson Disease (PARK20, MONDO:0014233), split from the Parkinsons_Disease basket. Presynaptic endocytic arm: Synaptojanin-1 loss of function (GO:0004439 DECREASED) -> impaired synaptic-vesicle endocytosis/recycling (GO:0048488, GO:0046856) -> nigrostriatal dopaminergic neurodegeneration (conforms parkinsonism_dopaminergic_degeneration) -> striatal dopamine deficiency -> parkinsonian motor syndrome -> parkinsonism/dystonia. Phenotypes: parkinsonism, dystonia, cognitive decline, seizures. Added R258Q knock-in mouse (PMID:28231468) with RECAPITULATES/PARTIALLY_RECAPITULATES modeled_mechanisms, readouts, and a PROXY_QUANTITY divergence. Evidence from PMID:23804577 (discovery), PMID:23804563 (in vitro Sac1 LOF), PMID:28231468 (mouse), PMID:24816432 (Olgiati family + imaging), PMID:33841314 (Lesage cohort), PMID:34396589 (MDSGene). claude_code deep-research run used as a lead only; every snippet verified exact against references_cache. No GeneReviews chapter exists (check-genereviews NO_CHAPTER). Validated with validate-disorders (33/33 snippets, terms pass) plus the full offline gate list (snippet-grading, folded-hyphens, title-snippets, reference-titles, model-scale-audit, conformance-content, causal-targets, entity-refs, logical-rules, coarse-phenotypes, qualifier-terms, shared-disease-terms, unsuccessful-research). Basket trimmed: PARK20 subtype row and SYNJ1 genetic row each gained a pointer sentence to the standalone entry; nothing removed.

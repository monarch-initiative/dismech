  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED on PR #18461. Finding 1 (mechanism, correct): the recurrent R258Q allele is a Sac1-domain mutation that selectively abolishes Sac1 (PI4P/PI3P) phosphatase activity while sparing the 5-phosphatase (confirmed by PMID:23804563 and PMID:28231468). Rebound the root molecular function from GO:0004439 (5-phosphatase) to GO:0043812 (phosphatidylinositol-4-phosphate phosphatase activity); changed functional_impact_category to PARTIAL_LOSS_OF_FUNCTION; rewrote the root/endocytic node and edge descriptions and the top-level description to the Sac1 framing with the auxilin/DNAJC6 link; added explicit in vitro Sac1-specificity evidence. Finding 2: added Tremor, Rigidity, Eyelid apraxia and Severe intellectual disability phenotypes (PMID:33841314), wiring Tremor and Rigidity from the motor syndrome. Finding 3: added biallelic variant rows p.Tyr232His, p.Asp791fs and p.Tyr832Cys (PMID:33841314). Finding 4: added curated_in: SYNJ1-Related_Parkinson_Disease to the basket PARK20 subtype row. Suggestions: added a mechanistically-grounded endocytic-node to Seizures edge (inhibitory-synapse E/I imbalance, PMID:28231468), added direct imaging evidence to the striatal node and direct Olgiati evidence to dystonia/cognitive phenotypes, and noted levodopa-response variability. Every snippet verified exact against references_cache (48/48). Re-ran validate-disorders, terms, snippet-grading, folded-hyphens, causal-targets, entity-refs, logical-rules, coarse-phenotypes, conformance-content, model-scale-audit, name-collisions.

  summary: 'Genetics pass: gene wiring (#12198)'
  details: |
    Genetics pass for issue #12198 (d2g wiring-009). Three of MONDO's genes for the three listed
    subtype terms were present (EPB41, SPTA1, plus GYPC which MONDO does not list); SLC4A1 was
    genuinely missing, and it is the gene of the Southeast Asian ovalocytosis subtype the entry already
    declared.

    Added a SLC4A1 genetic record scoped to the SAO subtype with relationship_type: CAUSATIVE and
    autosomal dominant inheritance, and added genes: descriptors to the EL1 (EPB41), EL2 (SPTA1) and
    SAO (SLC4A1) has_subtypes rows. EL3 and Thermal-sensitive HE were deliberately left without genes:
    - neither row names a gene and no source was found in this pass that assigns one, so binding
    either would be guessing.

    SLC4A1 is deliberately not bound onto "Red Cell Cytoskeleton Protein Defects". That node and its
    downstream "Weakened Horizontal Cytoskeletal Associations" model a loss of horizontal
    membrane-skeleton linkage; the SAO lesion runs the other way, a single defined in-frame deletion
    of nine residues at the cytoplasmic/transmembrane boundary of band 3 whose product over-oligomerises
    and binds the skeleton more tightly, stiffening the membrane. Listing it with the four skeleton
    genes would have asserted the wrong mechanism. Added instead a new pathophysiology node, "SAO Band
    3 Over-Association and Increased Membrane Rigidity", carrying SLC4A1 and flowing into the existing
    "Elliptocytic and Poikilocytic Red Cell Morphology" node.

    One new reference, PMID:32411010, supplies all four new snippets: the causal deletion, the
    boundary location and loss of anion exchange, the oligomerisation and rigidity mechanism, and the
    lesion-to-ovalocytosis link. All four are graded quote_role: BACKGROUND, because each restates
    earlier work with inline citations rather than reporting this paper's own erythroid-culture
    experiments. Orphanet's SAO record (ORPHA:98868, cross-referenced from MONDO:0008165) could not be
    used: the local orphadata XML is absent and just structured-rebuild-orphanet cannot run without it.
    ClinGen was not consulted - just clingen-refresh fails on an upstream checksum mismatch (#10426)
    and repinning is out of scope for this pass. Validated with just validate, validate-terms,
    count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, list-gene-term-mismatches and validate-disorders.

  summary: 'Gene-family review: DPM2; relationship typed UNKNOWN (ClinGen Moderate)'
  details: |
    The DPM2 record was CAUSATIVE while the ClinGen tier it already recorded for this disease (MONDO:0014023) is Moderate. CAUSATIVE is reserved for Definitive or Strong validity, so the record is now UNKNOWN with a note giving the reason, matching the KB convention for ClinGen Moderate pairs. The node modelling (DPM2 as the regulatory subunit, binding enzyme activator activity and the complex's dolichyl-phosphate beta-D-mannosyltransferase activity as decreased) was reviewed against PMID:10835346, which shows DPM synthase activity is about tenfold higher with DPM2 present, and left unchanged.

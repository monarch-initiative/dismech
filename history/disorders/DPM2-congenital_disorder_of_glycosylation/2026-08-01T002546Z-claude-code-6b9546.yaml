  summary: 'Create: DPM2-congenital disorder of glycosylation (DPM2-CDG)'
  details: |
    De-novo curation of DPM2-CDG (MONDO:0014023, OMIM:615042, Orphanet:329178, gene DPM2/hgnc:3006), requested under its Orphanet clinical label 'congenital muscular dystrophy with intellectual disability and severe epilepsy'. Deep research: falcon was attempted first per the default but the Edison API returned 402 Payment Required (account out of credit), and openscientist failed with a TLS/PEM error in this environment; the claude_code provider completed successfully (research/DPM2-congenital_disorder_of_glycosylation-deep-research-claude_code.md; 20 web searches, 27 turns). Because the requested disease name is generic-sounding and high-NEC-risk, an explicit Named Entity Confusion preflight was run against the MONDO record: the report gene (DPM2), OMIM (615042) and Orphanet (329178) all matched MONDO:0014023, so the report was accepted. Curated an eight-node pathograph from DPM2 loss through DPM synthase complex destabilization and Dol-P-Man depletion, branching into the ER lipid-linked-oligosaccharide arm, the alpha-dystroglycan O-mannosylation arm and a PROVISIONAL GPI-anchor arm, converging on protein hypoglycosylation and multisystem glycoprotein dysfunction; three nodes declare conforms_to against the congenital_disorder_of_glycosylation module. Added 21 HPO-bound phenotypes spanning the severe infantile-lethal and mild adult-viable ends, three biochemical markers, the DPM2 gene record with three curated variants, prevalence (CASES_IN_LITERATURE / ULTRA_RARE, six published patients), two progression phases, three diagnostic modalities, five treatments, four differential diagnoses, and three discussions (KNOWLEDGE_GAP on the unproven GPI arm, HUMAN_MODEL_MISMATCH on the absence of a faithful animal model, OPEN_QUESTION on the domain-position severity correlation). No GeneReviews chapter exists for DPM2-CDG; only the retired N-linked glycosylation overview (PMID:20301507) was found, so no GeneReviews baseline was applied and this is documented in notes. Validation: just validate passes (schema clean, term validation passes, 75/75 evidence snippets verified against cached references); compliance 89.0 percent global / 89.4 percent weighted.

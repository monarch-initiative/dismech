  details: |
    Added a classifications block before opening the PR, to match the standard used by recently merged dismech disorder PRs. harrisons_chapter: ENDOCRINOLOGY_METABOLISM and GENETICS_ENVIRONMENT_DISEASE (both evidenced from PMID:40902550, which frames the CDG as autosomal recessive inherited metabolic disorders) plus NEUROLOGIC (evidenced from PMID:26453362 on the dominant neurological involvement across CDG). icimd_category: multiple_glycosylation_pathways, whose ICIMD definition explicitly covers dolichol metabolism - the correct placement for DPM2-CDG rather than the N-linked-only group, because the depleted Dol-P-Man donor feeds N-glycosylation, O-mannosylation, C-mannosylation and GPI-anchor biosynthesis. ICIMD provenance recorded in notes rather than a fabricated evidence snippet, per the disease-classification skill. Revalidated: just validate passes with 78/78 evidence snippets verified; compliance 88.9 percent global / 89.3 percent weighted.

  summary: Address review findings A and B on DPM2-CDG
  details: |
    PR Shepherd fix pass responding to the 2026-08-02T15:17Z review. Finding A: the Orthopedic Surgical Correction treatment target_phenotypes bound HP:0001371 Flexion contracture while the phenotype it treats had already moved to HP:0001771 Achilles tendon contracture. OAK confirms HP:0001771 descends from HP:0034392 Joint contracture, not from HP:0001371, so the treatment was targeting a term that is not even an ancestor of its own phenotype. Retargeted to HP:0001771. Finding B: added three Table 1 phenotypes the previous round had declined on snippet-floor and PDF-ligature grounds, using the row-level quotes the reviewer had already substring-tested - Feeding Difficulties HP:0011968 at 3/6 for P3/P4/P5, Optic Atrophy HP:0000648 for P3, and Absent Visual Tracking for P4/P5. HPO has no term for absent visual tracking; the closest available ancestor HP:0025404 Abnormal visual fixation is bound with the specific finding carried in preferred_term and the description, and this deviation from the label the reviewer named is flagged on the PR for adjudication. The feeding-difficulties snippet reproduces the source PDF ligature verbatim rather than retyping corrupted text. No frequency bands are asserted because the ophthalmological row leaves P6 blank, so the denominator is uninterpretable. Validation: linkml-validate passed, validate-terms passed, 93 of 93 snippets verified against cached references (was 90 of 90), and check_snippet_length --check reports no new snippets under the five-word floor.

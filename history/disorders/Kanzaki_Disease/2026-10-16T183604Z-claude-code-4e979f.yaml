  summary: Bind alpha-NAGA, not alpha-galactosidase (tranche D batch 4)
  details: |
    LOINC tranche D batch 4 (enzyme activity and metabolite assays). Verified the analyte from the entry's own text before binding, since the assigned token-match pool entry for this disease was flagged as wrong: the entry mentions 'acetylgalactosaminidase' 16 times against 'alpha-galactosidase' only twice, and both alpha-galactosidase mentions are in the differential_diagnoses block, stating that alpha-galactosidase activity is normal in Kanzaki disease and used only to exclude Fabry disease. Kanzaki disease (Schindler type 2) is alpha-N-acetylgalactosaminidase (NAGA) deficiency. Bound LOINC:LP14015-9 (Alpha-N-acetylgalactosaminidase, the specimen-generic Part code, confirmed via the Monarch KG API together with its activity-measurement siblings LOINC:11037-9, 24054-9, 24055-6, 79455-2) via measurements on the existing 'Enzyme assay and molecular testing' diagnosis row, whose own description names 'blood' generically rather than one specimen. Alpha-galactosidase A is not bound anywhere in this entry. No reference_ranges band is recorded: the source states 'diminished' activity qualitatively. No third-party copyright notice required. No collision with LOINC:LP14015-9 on any other open loinc-* branch's cache. just validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-enum-values, and tests/test_loinc_measurement_schema.py all pass.

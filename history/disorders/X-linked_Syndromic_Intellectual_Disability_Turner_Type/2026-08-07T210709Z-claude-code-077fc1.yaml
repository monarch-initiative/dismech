  summary: Expand HUWE1 cohort and mechanism evidence
  details: |
    Fetched DOI:10.1002/ajmg.a.70127 and PMID:33948573 using the sanctioned
    reference-cache workflow. Added the 2026 35-person cohort's exact 22-male /
    13-female denominators, sex-stratified inheritance observations, and
    sex-stratified phenotype counts; represented the authors' multisystem
    clinical evaluations as proposed rather than validated guidance. Added the
    p.G4310R HUWE1-destabilization to p53 accumulation, cell-cycle/proliferation,
    hiPSC neural-differentiation, cerebral-organoid, and p53-knockdown rescue
    chain, bounded to the Juberg-Marsidi patient-derived in-vitro model. Added
    HUWE1/HNDD, Juberg-Marsidi, Brooks, and Brooks-Wisniewski-Brown synonyms; an
    ATR-X differential; and an audit-visible separation of sequence-variant
    HNDD from the multigene Xp11.22 copy-gain route. Added open gaps for XCI,
    genotype-phenotype correlation, adult natural history/tumor risk, and
    zebrafish-only translation. Corrected the mitochondrial node to describe
    disrupted rather than normal recruitment as abnormal and classified the
    zebrafish-centered evidence as MODEL_ORGANISM. Cache normalization churn was
    excluded; only the two explicitly fetched references are retained.

  summary: 'Review: Turner-type HUWE1 evidence and completeness'
  details: |
    Publication-readiness review against the original Turner family report (PMID:7943042), the HUWE1 duplication and sequence-variant study (PMID:18252223), functional allelic-series evidence (PMID:27130160), the 21-person clinical cohort (PMID:29180823), and current literature through 2026, including the PNAS mitochondrial-recruitment study (PMID:42490384). Corrected the original Turner family away from the Xp11.22 duplication cohort without retaining an unsupported residue-level attribution; separated regional duplication evidence from sequence-variant evidence; replaced a uniform catalytic-loss claim with allele-specific HUWE1, p53, and Mcl-1 abundance changes; and marked phenotype shortcuts as indirect with unknown intermediates. Added the AMBRA1-RMC1-HUWE1 mitochondrial-recruitment and substrate-ubiquitination branch for patient-associated noncatalytic M375I, G660R, and H669Q variants, keeping in-vitro mechanism, human variant provenance, and zebrafish brain-growth/motor-neuron evidence distinct. Recorded Urolithin A rescue only as a preclinical zebrafish translation gap, not as a clinical treatment. Added cohort-quantified central phenotypes and only frequency bands directly licensed by reported counts, restored original-family macrocephaly without generalizing it across the allelic spectrum, corrected the nonspecific facial-gestalt wording, removed the unsupported ultra-rare inference from a case-series size, added molecular diagnosis coverage, and bounded supportive-care evidence to monitoring rather than efficacy. Evaluated the 2026 seven-child cohort but did not promote variant-specific chewing/ADHD/social findings as core phenotypes. Final changed-entry checks passed for schema, ontology terms, causal-graph integrity, history schema, references, and 33/33 cached evidence snippets.

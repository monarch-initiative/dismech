  summary: Expand HUWE1 cohort and mechanism evidence
  details: |
    Fetched DOI:10.1002/ajmg.a.70127, PMID:41975654, and PMID:33948573 using the
    sanctioned reference-cache workflow. Used only abstract-visible Li cohort
    claims in the curated entry and omitted uncached phenotype, inheritance,
    test-schedule, and natural-history details. Added the
    p.G4310R HUWE1-destabilization to p53 accumulation, cell-cycle/proliferation,
    hiPSC neural-differentiation, cerebral-organoid, and p53-knockdown rescue
    evidence, bounded to the Juberg-Marsidi patient-derived in-vitro model and
    split into distinct differentiation and organoid-architecture nodes. Added
    HUWE1/HNDD, Juberg-Marsidi, Brooks, and Brooks-Wisniewski-Brown synonyms; an
    ATR-X differential; and an interpretation-layer separation of sequence-
    variant HNDD from the HUWE1 copy-gain route. PMID:22840365 supersedes the
    earlier three-gene minimum interval by narrowing the region to HUWE1 and
    demonstrating increased HUWE1 but not HSD17B10 mRNA. Added open gaps for XCI,
    genotype-phenotype correlation, adult natural history/tumor risk, and
    zebrafish-only translation. Corrected the mitochondrial node to describe
    disrupted rather than normal recruitment as abnormal and classified the
    zebrafish-centered evidence as MODEL_ORGANISM, split brain-growth and motor-
    neuron readouts into separate nodes, and connected them to human phenotypes
    through explicitly cross-species, indirect edges. Omitted the unsupported
    residue-level attribution to the original Turner pedigree. Added
    directly supported scoliosis and variant-bounded oligodontia phenotypes.
    Cache normalization churn was excluded.

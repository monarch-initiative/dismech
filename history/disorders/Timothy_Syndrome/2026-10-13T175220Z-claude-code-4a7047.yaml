  details: |
    The entry had no diagnosis: section. Added a Resting 12-Lead Electrocardiography row with LOINC:8636-3 (QTc) as a measurement, diagnosis_term NCIT:C38053 (Electrocardiography). Fetched the 2025 international consensus statement's full text (DOI:10.21203/rs.3.rs-8058536/v1, via its Research Square preprint) to check for a numeric QTc diagnostic threshold; none is stated there or in the landmark report (PMID:15454078, abstract only) -- both describe the phenotype only as 'prolonged QT interval'. No reference range is recorded; notes state the negative search result and that diagnosis rests on the combined cardiac/extracardiac/molecular criteria already in the entry's definitions. Part of LOINC tranche G batch 11 (projects/LOINC_DIAGNOSTICS.md).

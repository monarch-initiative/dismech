  details: |
    Added a second proposed_experiment (exp_ts_fever_ipsc_nam_challenge) to the fever HUMAN_MODEL_MISMATCH discussion: a New Approach Methodology mechanistic test complementing the population EHR scan. Uses NAMO-aligned model_systems (human iPSC-derived cardiomyocytes and cortical/GABAergic neurons, an ORGAN_ON_CHIP heart-on-chip with namo_type namo:OrganOnChip, and an in-silico human ventricular AP model with temperature-dependent CaV1.2) under a controlled hyperthermia challenge on CACNA1C-G406R vs isogenic-corrected controls; perturbations/readouts target existing pathophysiology nodes. This is the direct human-relevant test that bridges the zebrafish-to-human gap and would move derivation_basis from MODEL_SYSTEM_EXTRAPOLATION toward a human-validated mechanism. Schema/term validation pass; discussion tests pass. Also documents the NAM validation arm across the four-example set in the survey report.

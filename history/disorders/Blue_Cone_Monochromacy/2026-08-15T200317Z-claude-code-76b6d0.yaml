  summary: 'Create: Blue Cone Monochromacy (OPN1LW/OPN1MW, MONDO:0010563)'
  details: |
    De novo curation of blue cone monochromacy (BCM / blue cone monochromatism / S cone monochromacy).

    Deep research: claude_code provider via `just research-disorder claude_code Blue_Cone_Monochromacy`. The report shipped its own reference-validation frontmatter: 20/20 references resolved, 0 unresolved, confabulation_rate 0.0.

    NEC check: MONDO:0010563 has no single causal gene in the sense the automated preflight uses (the lesion is loss of function of a two-gene array plus its shared enhancer), so `just preflight-dr` would return SKIP. The manual identity check was done instead -- the report's genes (OPN1LW, OPN1MW, plus the locus control region) match the MONDO definition and OMIM #303700, and the disorder is X-linked in both. The nearest confusable entity is achromatopsia, which the report distinguishes correctly throughout and which this entry curates as its principal differential.

    GeneReviews baseline: PubMed has no dedicated GeneReviews chapter for this disorder (searched by preferred label, by "blue cone monochromatism", and by "cone monochromacy"; all returned zero). Blue-cone monochromatism is covered inside the Achromatopsia chapter as a differential only. Recorded here as a genuine absence rather than an omission.

    Two wrong ontology suggestions in the report were caught against the term caches and not used: UBERON:0001782 was offered for fovea centralis but is the pigmented layer of the retina (correct term UBERON:0001786), and HP:0000640 was offered for nystagmus (correct term HP:0000639). Neither would have been caught by the report's reference validation, which checks citations only.

    One evidence snippet drawn from the report's framing did not match its cited source on checking (a paraphrase attributed to PMID:36932675) and was replaced with the paper's own result sentence about intravitreal ADVM-062 producing a de novo long-wavelength response in gerbils.

    Curated content: a six-node pathophysiology chain covering both mutational routes (locus control region deletion and array collapse with an inactivating substitution) converging on absent L/M photopigment, then cone outer segment disruption with progressive foveal cone loss, the preserved S-cone and rod system that explains the residual phenotype, and a carrier-female cone-mosaic node; 8 phenotypes with HPO bindings; three genetic entries including the Cys203Arg reservoir/recurrence mechanism; three diagnosis entries including the Xq28 short-read mapping problem; two differential diagnoses; two treatments (supportive care plus investigational AAV L-opsin augmentation with a RESTORES target_mechanisms link); and two discussions recording the stationary-versus-progressive controversy and the genotype-phenotype question.

    Validation: `just validate-disorders` passed (schema, terms, references). `just count-verified-snippets` reported 51/51 verified against cached references. check_snippet_length, check_title_snippets and check_folded_hyphens all clean against origin/main. Compliance 91.9% (weighted 92.6%). No datasets block: relevance triage was not performed, and absent beats unverified.

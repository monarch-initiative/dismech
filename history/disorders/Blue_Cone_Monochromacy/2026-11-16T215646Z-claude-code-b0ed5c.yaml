  summary: Type opsin-array gene records and place OPN1LW/OPN1MW on mechanism nodes
  details: |
    Added variant_origin to all seven genetic records: GERMLINE for six, DE_NOVO for the sporadic 73-kb deletion shown absent from the mother and grandfather (PMID:29940872); relationship_type CAUSATIVE was already set and ClinGen holds no record for this pair. Loss of Function of the OPN1LW/OPN1MW Opsin Gene Array: variant_origin GERMLINE added to its genetic_context. Failure of Locus Control Region-Driven Opsin Expression: OPN1LW and OPN1MW added as the regulatory targets, regulatory_category LOE, and a germline deletion genetic_context, as the node's evidence states the deleted region is essential for expression of both pigment genes. Absent or Non-Functional L and M Cone Photopigment: OPN1LW and OPN1MW added beside its existing GO:0008020 G protein-coupled photoreceptor activity (DECREASED), the reviewed core function of both genes. No new claims or evidence. Validated with just validate, validate-terms, count-verified-snippets (108/108), check-causal-targets, check-entity-refs, check-duplicate-keys, check-block-scalar-comments, check-enum-values and list-gene-term-mismatches.

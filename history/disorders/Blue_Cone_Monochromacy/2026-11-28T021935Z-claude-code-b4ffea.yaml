  details: |
    Added nine phenotypes from cached full texts (foveal ellipsoid zone disruption, reduced central foveal thickness, visual fixation instability, eccentric fixation, astigmatism, peripapillary atrophy, temporal optic disc pallor, fundus hypopigmentation, disrupted foveal autofluorescence), with counts and frequencies where the source reports them. Enriched reduced visual acuity, nystagmus, photophobia and myopia with cohort evidence, and corrected the acuity range and the nystagmus course to what the sources state. Wired the new phenotypes from the cone outer segment, S-cone/rod vision and myopia nodes. Recorded reading impairment (PMID:33344057) in notes because HPO has no reading-performance term. PubMed, Europe PMC, OLS and Orphadata were unreachable; HP terms were looked up in the HPO 2026-09-01 hp.obo release and validated with linkml-term-validator against that file. Validation: validate-disorders passed, 139/139 snippets verified.

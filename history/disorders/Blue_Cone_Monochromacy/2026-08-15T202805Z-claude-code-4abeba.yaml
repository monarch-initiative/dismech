  summary: 'Address PR #8561 review: cite cached references, add animal models, deepen
    genetics'
  details: |
    Review-response session for PR #8561. The automated reviewer returned CHANGES_REQUESTED with three IMPORTANT content-completeness findings, all of the form "evidence already in the repo, not yet used". All three are addressed.

    1. Thirteen BCM-specific references were cached but uncited. Ten are now cited: DOI:10.1126/science.2788922 (the founding Nathans 1989 paper, now grounding both the two-class mutational-route claim and the 579 bp essential regulatory region), PMID:35759666 (structural-variant landscape), PMID:34445325 (GPR143 second-locus modifier), PMID:41941983 (C198R knock-in mouse), PMID:28751656 (M-opsin knockout and AAV rescue), PMID:40297680 (therapeutic window), PMID:36301530 (adaptive-optics cone density), PMID:36186895 (foveal hypoplasia contrast with achromatopsia), PMID:25909963 (rods signalling under daylight conditions), PMID:36692456 and PMID:33344057 (colour-vision and reading outcome measures). One was dropped rather than cited: DOI:10.1186/s12881-018-0623-8 has content_type unavailable in the cache -- metadata only, no abstract -- so the de novo deletion claim it would have supported is omitted and the cache file removed. Recorded in the entry notes.

    2. Added an animal_models block. Opn1mw C198R knock-in mouse with two modeled_mechanisms links (RECAPITULATES the photopigment node, PARTIALLY_RECAPITULATES the cone-loss node) and Opn1mw knockout mouse with a RECAPITULATES link plus a RESCUES link for the AAV gene-augmentation arm. Each carries fidelity, limitations and evidence. The limitations are substantive rather than boilerplate: mouse has no L-opsin and no fovea, and six months of mouse life cannot address decades of human disease.

    3. Deepened the genetic section from three entries to six: locus control region deletion as its own variant class (90% of structural variants remove it; minimal functional extent 358 bp), the structural-variant landscape (about one third of families, 42 distinct variants, no region of overlap), and GPR143 as a single-report MODIFIER.

    Suggestions also taken: diagnosis_term NCIT:C15709 on the molecular testing entry; an INFANTILE onset descriptor on nystagmus; and the top-level references block expanded from 2 to 15 entries.

    A fabricated reference title was caught during this pass and corrected. The title given for PMID:35759666 was invented rather than taken from the cache; linkml-reference-validator flagged the mismatch on the top-level references block. Four further reference_title values were checked against the cached records and corrected the same way (PMID:28751656, PMID:25909963, PMID:36186895, DOI:10.1126/science.2788922).

    Validation after fixes: `just validate-disorders` passed. `just count-verified-snippets` reported 72/74 verified, with 2 skipped by prefix -- both are the DOI: reference, which conf/reference_validator_config.yaml lists under skip_prefixes, so its snippets are not machine-checked. Those two quotes were read against references_cache/DOI_10.1126_science.2788922.md by hand. check_snippet_length, check_title_snippets and check_folded_hyphens all clean. Compliance 91.9% (weighted 92.4%).

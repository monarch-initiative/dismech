  summary: Review opsin-array mechanisms, variable colour vision and preclinical treatment evidence
  details: |-
    Reviewed the entire entry, prior history and scientific deep-research report against cached primary evidence, including available full-text results, tables and limitations. Added exon 3 missplicing and foveal hypoplasia; separated regulatory from coding loss, outer-segment damage from variable cone loss, and clinical S-cone preservation from normal tritan discrimination. Qualified carrier X-inactivation, GPR143 blended-phenotype inference and array-context causality; added de novo rearrangement and long-read/MLPA diagnosis. Replaced the therapeutic-window preprint with its peer-reviewed publication, distinguished single/double/all-cone mouse models, expanded supportive care and added the observational eyeGENE registry. Removed unsupported phenotype frequencies and curation-process notes. All 108 exact quotations and 143 titles, schema and ontology bindings validate. Primary texts were used where available; the 2018 comparative cohort remains abstract-only after full-text access attempts, and no inaccessible result was invented.

  summary: 'Create: Nephrotic Syndrome Type 3 (PLCE1)'
  details: |
    De novo curation of PLCE1-related autosomal recessive nephrotic syndrome (NPHS3, MONDO:0012546), claimed in #16891. Used the claude_code deep-research report (25/25 citations resolved) as leads; all evidence re-fetched and snippet-verified against references_cache abstracts. Pathophysiology is an unbundled chain of 17 nodes from biallelic PLCE1 loss of function through four podocyte signalling branches (phosphoinositide hydrolysis, Rac1/Cdc42 via NCK2, EGF-ERK proliferation, TGF-beta1/SMAD2) to podocyte migration/proliferation/differentiation defects, arrested glomerular development, DMS/FSGS and kidney failure, plus a parallel hemodynamic second-hit arm from the mouse model; two nodes conform to the nephrotic_podocyte_injury module. ClinGen Definitive validity recorded. Four discussions: incomplete penetrance (nonpenetrant homozygotes), mouse baseline HUMAN_MODEL_MISMATCH, immunosuppression-response CONTROVERSY, DMS/FSGS spectrum OPEN_QUESTION. GeneReviews chapter is Overview-format (TAGGED_OVERVIEW); phenotype baseline taken from cohorts and noted. Validated: just validate-disorders 98/98 snippets 0 issues; validate-terms, normalize-cache, check-cache-order, entity-refs, causal-targets, name-collisions, coarse-phenotypes, snippet-length, title-snippets, reference-titles, duplicate-keys, enum-values, block-scalar-comments, snippet-grading, logical-rules all pass.

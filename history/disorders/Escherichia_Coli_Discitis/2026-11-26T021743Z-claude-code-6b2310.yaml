  summary: 'Create: Escherichia_Coli_Discitis'
  details: |
    New entry for E. coli discitis (MONDO:8000002) from the stub queue, modelled on Staphylococcus_Discitis. Lump/split: kept as one named clinical entity (pathogen plus syndrome) under the infectious discitis grouping concept; susceptible, fluoroquinolone-resistant, ESBL-producing and ExPEC strains are lumped, recorded in review_notes. Literature was gathered from PubMed searches for escherichia coli with spondylodiscitis, discitis or vertebral osteomyelitis, plus Gram-negative spondylodiscitis cohorts; the deep-research report research/Escherichia_Coli_Discitis-deep-research-claude_code.md (claude_code provider) was used as a lead list and contributed the Kang 2015 Gram-negative pyogenic spondylitis cohort (PMID:25978839). The pathograph runs genitourinary source infection, E. coli bacteremia, hematogenous discovertebral seeding, disc-endplate expansion, LPS-driven disc and bone inflammation (in vitro evidence only, marked INDIRECT), endplate and disc destruction, and paravertebral, psoas and epidural extension with cord or root compression. Three therapeutic-vulnerability nodes conform to the antibacterial cell-wall and topoisomerase modules, including ESBL resistance. Every snippet was verified against the reference cache (just count-verified-snippets), and validate, validate-terms and validate-disorders passed.

  summary: 'Create: Infantile Cataract, Skin Abnormalities, Glutamate Excess, and
    Impaired Intellectual Development (CASGID, GLS gain-of-function)'
  details: |
    Created the GLS gain-of-function entity (MONDO:0032685 / OMIM 618339), the third and mechanistically opposite member of the GLS allelic series, completing it alongside the two loss-of-function entries. Sources: PMID:30239721 (Hum Mol Genet 2019, the single reported patient with the de novo hypermorphic p.Ser482Cys allele), PMID:31603991 (review of inborn errors of glutamate metabolism, whose clinical table supplied phenotypes absent from the primary abstract: axial hypotonia, kyphosis, agitated and self-injuring behaviour, white matter involvement, mild hyperammonemia, neonatal bilateral cataracts, and the normal CSF glutamate/glutamine that dissociates from grossly abnormal brain spectroscopy), PMID:31734463 (HEK293 metabolic fingerprinting of GLS hyperactivity). Two curation decisions worth recording. First, the skin abnormalities named in the OMIM/MONDO entity title are NOT curated as a phenotype: they appear in neither the primary abstract nor the review's clinical table, so asserting them would have manufactured an evidence chain from a disease name; an open KNOWLEDGE_GAP discussion records this with two proposed experiments. Second, an earlier draft of this entry cited a fabricated snippet (a 'GLS; GLS; EC 3.5.1.2 n = 1 mono-allelic, AD' table row extrapolated from the pattern of the sibling entry rather than read from the source); linkml-reference-validator caught it, and it was replaced with verified quotes from the actual review text. Validation: schema, term and reference validation all passed; 38/38 snippets verified against cached references; weighted compliance 80.2 percent.

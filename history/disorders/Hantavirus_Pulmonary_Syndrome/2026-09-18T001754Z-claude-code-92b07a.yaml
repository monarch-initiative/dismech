  summary: Bind infectious agents and backfill transmission (#10115)
  details: |
    The existing umbrella agent 'New World orthohantaviruses' had no term. Bound it to NCBITaxon:1980442 (Orthohantavirus, the genus) with preferred_term carrying the narrower New World sense, and recorded in the description that the grouping is geographical rather than taxonomic and that the genus also holds Old World HFRS species. Added two bound species records the entry's prose already describes: Sin Nombre virus (NCBITaxon:3052499, Orthohantavirus sinnombreense) and Andes virus (NCBITaxon:1980456, Orthohantavirus andesense). All CURIEs and labels from ols:ncbitaxon lookups. Added two transmission routes: inhalation of aerosolized rodent excreta (PMID:33253144, PMID:34549977) and person-to-person transmission of Andes virus (PMID:17471425, PMID:33253144), with the description stating that the interpersonal route is ANDV-specific. Validated with just count-verified-snippets (38/38) and just validate-terms.

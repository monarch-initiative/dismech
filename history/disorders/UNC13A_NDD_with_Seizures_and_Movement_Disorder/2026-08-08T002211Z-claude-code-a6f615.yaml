  summary: Declare synaptic_vesicle_cycle conformance on Synaptic Circuit Dysregulation
  details: |
    Added conforms_to: synaptic_vesicle_cycle#Neurotransmitter Release Failure and Synaptic Transmission Deficit on the 'Synaptic Circuit Dysregulation' node.

    Direction caveat, deliberately recorded: UNC13A syndrome types B and C are gain-of-function / dysregulatory, whereas the module's node names are loss-of-function-flavoured ('Impaired...', '...Failure', 'Deficiency'). Conformance is declared only on the convergent endpoint node, whose description explicitly admits 'reduced OR dysregulated Ca2+-evoked neurotransmitter release'; the module's trigger and docking/priming nodes were deliberately NOT claimed, because 'impaired priming' is the wrong direction for a GOF Munc13-1. The module text names UNC13A/Munc13 as a docking-priming component and its trigger description covers 'loss of function or dysregulation', so the membership stands; the node NAMES are what read as LOF-only. That naming-vs-semantics mismatch in the module is a follow-up, not something this entry should paper over.

    Resolves a contradiction reported on a grouping page: this entry is asserted as a member of a grouping whose NECESSARY criterion it did not satisfy.


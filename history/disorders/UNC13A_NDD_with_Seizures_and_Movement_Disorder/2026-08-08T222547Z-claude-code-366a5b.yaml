  summary: Retarget module conformances to correct biological altitude
  details: |
    The entry declared no conformance to the synaptic_vesicle_cycle module, leaving it NOT_SATISFIED against the NECESSARY criterion of the Synaptic_Vesicle_Cycle_Disorders grouping. conforms_to is single-valued (range: string), so the fix was to place each conformance at its correct altitude rather than add one. 'Impaired Second Messenger Regulation of Neurotransmission' (type C) moved from epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction to synaptic_vesicle_cycle#Impaired Vesicle Docking and Priming: UNC13A encodes Munc13-1, the priming factor itself, and the grouping's own differentiating_mechanisms for this member states these variants 'alter Munc13-1-dependent priming'. This matches the pattern of the sibling entry UNC13A_Congenital_NDD_with_Epilepsy, which conforms its gene-proximal node to the same module node. The displaced epilepsy conformance was recovered on 'Synaptic Circuit Dysregulation', the circuit-level convergence node, at epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance. 'Gain-of-Function Neurotransmission' (type B) was deliberately left on the epilepsy module: it asserts INCREASED release, which contradicts the DECREASED synaptic vesicle priming modifier on the module's priming node, so conforming it there would state a false direction of effect. Both groupings now pass --strict with all members SATISFIED.

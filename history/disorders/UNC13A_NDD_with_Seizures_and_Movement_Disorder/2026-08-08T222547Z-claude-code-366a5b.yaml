  summary: Retarget module conformances to correct biological altitude
  details: |
    Refines the biological altitude of this entry's module conformances; it is not a repair of a failing criterion. At the time this work began the entry did declare no synaptic_vesicle_cycle conformance, but PR #8192 landed on main in the interim and added synaptic_vesicle_cycle#Neurotransmitter Release Failure and Synaptic Transmission Deficit to the 'Synaptic Circuit Dysregulation' node. Because the Synaptic_Vesicle_Cycle_Disorders criterion is an unanchored CONFORMS_TO_MODULE leaf, the entry was already SATISFIED against current main before this change. The net change here is one line. 'Impaired Second Messenger Regulation of Neurotransmission' (type C) moves from epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction to synaptic_vesicle_cycle#Impaired Vesicle Docking and Priming, because UNC13A encodes Munc13-1, the priming factor itself, and the grouping's own differentiating_mechanisms for this member already describes these variants as altering 'Munc13-1-dependent priming'. This matches the sibling entry UNC13A_Congenital_NDD_with_Epilepsy, which conforms its gene-proximal node to the same module node. To substantiate that conformance at the process level rather than by node name alone, GO:0016082 synaptic vesicle priming was added to the node with modifier ABNORMAL; ABNORMAL and not DECREASED because the type C mechanism is dysregulatory and its own description states these variants act without directly altering baseline synaptic strength. 'Synaptic Circuit Dysregulation' retains main's conformance from #8192 unchanged. 'Gain-of-Function Neurotransmission' (type B) is deliberately left on the epilepsy module: it asserts INCREASED release, so placing it on a priming node whose module modifier is DECREASED would state a false direction of effect. The net effect on epilepsy conformance is that this entry now declares it only on the type B node; the Epilepsy_Excitation_Inhibition_Imbalance_Disorders grouping remains SATISFIED on that basis. Both groupings pass --strict with all members SATISFIED.

  summary: 'Create: Autosomal_Recessive_Osteopetrosis_3'
  details: |
    Created kb/disorders/Autosomal_Recessive_Osteopetrosis_3.yaml (MONDO:0009818, carbonic anhydrase II deficiency / CA2, OMIM 259730) as a new DISEASE entry. Lump/split: single DISEASE — one enzymatic lesion, conserved three-arm pathograph, near-absolute bidirectional gene-disease specificity (PMID:15300855, PMID:12566520); no grouping built and no parent subtype attachment. Verified before curating that neither kb/disorders/Osteopetrosis.yaml nor Autosomal_Recessive_Osteopetrosis.yaml nor either autosomal dominant entry mentioned CA2, carbonic anhydrase or renal tubular acidosis, and that no kb/ file bound hgnc:1373, on the working tree and on origin/main. Deep research: 'just research-disorder falcon' returned HTTP 402 (Edison account out of credits); re-run once with dr_fallback='--fallback', which fell back to openscientist and recorded fell_back/requested_provider/provider_attempts in the report frontmatter. Report used: research/Autosomal_Recessive_Osteopetrosis_3-deep-research-openscientist.md (18/18 references resolved, 17/18 on topic; term_validation needs_review=true). Acted on the report's Term Validation: did NOT bind HP:0031815 for cranial nerve compression (it resolves to 'Abnormal oral physiology'); bound independently looked-up HP:0001293 instead. Also did not reuse the report's GO:0001618 'ruffled border' suggestion (that CURIE is virus receptor activity) or its GO:0051452-labelled 'regulation of intracellular pH'. just preflight-dr emitted WARN on two counts, both false positives: the 'rival gene HP' signal is HPO CURIE prefixes being read as the haptoglobin symbol, and the OMIM mismatch is the report citing the CA2 gene OMIM 611492 alongside the disease OMIM 259730 that MONDO xrefs. Gene binding verified bidirectionally against the HGNC REST API in the same step it was written (CA2 -> HGNC:1373 and HGNC:1373 -> CA2); hgnc:13733 is CDH23, which is the near-miss the task flagged. Pathograph: 10 nodes, each with biological_scale, running from Biallelic CA2 Loss of Function through Loss of Cytosolic Proton and Bicarbonate Supply, which branches into the osteoclast, renal and cerebral arms; the cerebral edge is typed INDIRECT_UNKNOWN_INTERMEDIATES and its node marked mechanism_confidence HYPOTHETICAL. No conforms_to: osteoporosis_bone_resorption is the mechanistic inverse, defective_skeletal_mineralization covers hypomineralization, and no osteoclast-acidification module exists yet — recorded in notes as a follow-up. 18 phenotypes with HP bindings, including two deliberate SUPPORT+REFUTE pairs where cohorts genuinely disagree (renal tubular acidosis as obligate, and hearing impairment). Car-2 null mouse recorded as RECAPITULATES for the renal arm and FAILS_TO_RECAPITULATE for the bone arm, with a HUMAN_MODEL_MISMATCH discussion. Five discussions: cerebral-calcification mechanism (KNOWLEDGE_GAP), mouse model mismatch (HUMAN_MODEL_MISMATCH), growth-failure attribution (KNOWLEDGE_GAP), residual renal carbonic anhydrase (OPEN_QUESTION), osteopetrosis+RTA phenocopy (INTERPRETATION). Deliberately omitted: interferon-gamma and vitamin D/calcium (general-osteopetrosis therapy, not CA2), datasets (GEO has no CA2-deficiency dataset; the three human osteopetrosis GEO series are CLCN7/ADO2, a different disease), and ISDS group membership beyond the group's own stated scope (the cached 2023 nosology record does not name CA2). No GeneReviews chapter exists for CA2-related osteopetrosis (PubMed carries TCIRG1 and CLCN7 chapters only), so that baseline could not be applied. Validators run and their results: just validate PASS (schema, terms, references); just validate-terms PASS; just count-verified-snippets 112/112 verified; just check-duplicate-keys PASS; just check-entity-refs PASS; just check-causal-targets PASS (no new dangling targets); just check-qualifier-terms PASS; just check-enum-values PASS; just normalize-cache clean; just check-term-cache-integrity PASS; just validate-disorders PASS (batched authoritative gate, 112/112); whole-KB just check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading all PASS with no new findings. just compliance 95.2%. One label divergence handled explicitly: HP:0000787 is 'Kidney stone' via OLS and 'Nephrolithiasis' in cache/hp/terms.csv; the cached form is bound because that is what term validation compares against, and the divergence is recorded in the phenotype notes.

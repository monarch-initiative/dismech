  details: |
    Round-1 review response on PR #11624 (CHANGES REQUESTED on one blocking finding). Blocking fix: phenotypes 'Renal tubular acidosis' frequency changed OBLIGATE -> VERY_FREQUENT. OBLIGATE asserts 100% and is the one value that licenses a downstream consumer to treat absent RTA as excluding the diagnosis, which the entry's own REFUTE item contradicts - PMID:8128957 reports a genetically confirmed CA II deficient proband with osteopetrosis, developmental delay and cerebral calcification but no detectable renal tubular acidosis. The phenotype's notes were rewritten to explain the VERY_FREQUENT choice and why the OBLIGATE inference is unsafe, replacing prose that had defended OBLIGATE; leaving that prose in place would have been its own defect. Osteopetrosis on the same entry stays OBLIGATE because no counterexample to that feature is recorded, and the notes now say so explicitly. Both reviewer suggestions taken, in the same push. Suggestion 1, surveillance treatments: added 'Ophthalmologic surveillance for compressive optic neuropathy' bound to NCIT:C38060 (Eye Examination) with four evidence items (PMID:22120147 for the 23/46-eyes, random-occurrence, canal-narrowing-correlated indication; PMID:39667299 for the 22.2% optic atrophy frequency; PMID:11264157 for progressive visual loss as the transplantation trigger; and PMID:39667299's negative finding on follow-up brain imaging, marked directness INDIRECT, to scope surveillance to the eye rather than to serial neuroimaging), and 'Dental and orthodontic care' bound to NCIT:C38052 (Dental Procedure) with two PMID:37662627 items. Both use target_phenotypes as the join point and deliberately omit target_mechanisms, because TreatmentEffectEnum offers only INHIBITS/ACTIVATES/MODULATES/BYPASSES/RESTORES and surveillance does none of those to a mechanism node; therapeutic_modality is also omitted because the enum lists therapeutic platforms and an examination is not one. Reasons recorded in each treatment's notes. NCIT:C203584 (Dental Care) was rejected as a binding: ancestor check via OLS showed it has no NCIT:C25218 (Clinical Intervention or Procedure) ancestor, so it is not in the TreatmentActionTerm enum, whereas NCIT:C38052 and NCIT:C38060 both are - checked before binding rather than after a validator failure. Suggestion 2, PMID:31542996: fetched, read, and added as two COMPUTATIONAL evidence items on the genetic CA2 record supporting a variant-class claim, with a matching paragraph in that record's notes. The claim made is bounded to what the paper supports: consensus free-energy methods predicted only half of known disease-causing CA2 missense variants as destabilizing, and the perturbation is residue-local rather than whole-protein, so a benign in silico stability prediction carries little weight against a CA2 missense variant. No pathogenicity assertion about any individual variant was added from this paper. Top-level notes updated so the treatment-omission paragraph no longer contradicts the new entries, and so that the two arms still not modelled (orthopaedic fracture management, audiologic follow-up) are named with reasons. Two reviewer-confirmed decisions left unchanged as instructed: the ISDS classification keeps directness INDIRECT plus evidence_source OTHER and keeps its re-verification caveat, because the printed group table was not consulted in this round; and the osteopetrosis Grouping stays a noted follow-up rather than being built in a disease PR. Validators re-run after the edits: just validate PASS (schema, terms, references); just validate-terms PASS, which is what confirms NCIT:C38060 and NCIT:C38052 are TreatmentActionTerm enum members; just count-verified-snippets 120/120 verified, up from 112; just check-duplicate-keys PASS; just check-entity-refs PASS; just check-causal-targets PASS with no new dangling targets; just check-qualifier-terms PASS (no qualifier terms were added this round, so check-qualifier-terms-online was not required); just check-enum-values PASS; just normalize-cache clean with no files updated; just check-term-cache-integrity PASS; just validate-disorders PASS as the batched authoritative gate; whole-KB just check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading all PASS with no new findings. just compliance 95.5%, up from 95.2%. No baseline file was modified. One incidental observation recorded for future reference: the reference validator normalizes whitespace before comparing, so the PMID:39667299 abstract's non-breaking space before '%' matches a snippet written with an ordinary space. Also noted that running the reference validator rewrites references_cache/PMID_23877423.md with two cosmetic frontmatter changes (quoting of reference_id, and an added full_text_attempted flag); that churn was reverted rather than committed, since it is unrelated to this entry's content.

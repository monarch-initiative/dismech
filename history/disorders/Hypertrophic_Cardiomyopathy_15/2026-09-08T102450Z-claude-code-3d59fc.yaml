  summary: 'Create: Hypertrophic Cardiomyopathy 15 (VCL, ClinGen-disputed)'
  details: |
    Created kb/disorders/Hypertrophic_Cardiomyopathy_15.yaml for MONDO:0013200
    (OMIM:613255), the VCL/metavinculin locus of familial hypertrophic
    cardiomyopathy, claimed via issue #11449.

    Curated deliberately as a DISPUTED gene-disease relationship rather than as an
    established disease. ClinGen's Hereditary Cardiovascular Disease Gene Curation
    Expert Panel reclassified VCL-hypertrophic cardiomyopathy from Limited to
    Disputed on 2023-05-10 (CGGV:assertion_27365fd2-...), while the Dilated
    Cardiomyopathy GCEP rates VCL-dilated cardiomyopathy Strong. The entry carries
    REFUTE evidence in the genetic block and on the histopathology finding,
    HYPOTHETICAL/PROVISIONAL mechanism_confidence throughout the chain, and an OPEN
    KNOWLEDGE_GAP discussion with two proposed experiments (a metavinculin-insert
    knock-in mouse, and a rare-variant burden test that directly answers ClinGen's
    frequency objection). The diagnosis block states explicitly that a VCL variant
    is not a molecular diagnosis of hypertrophic cardiomyopathy and must not drive
    cascade testing.

    Three specific things the curation establishes that a summary would lose. The
    corroborating histology in both 2006 probands - vinculin depleted at the
    intercalated disc - was shown by the same group (PMID:16949038) to occur in
    obstructive HCM without a VCL variant and in aortic stenosis, so it tracks
    outflow obstruction, not genotype; that paper is therefore cited twice on the
    same node, once SUPPORT and once REFUTE, and the entry's notes ask that those
    not be consolidated. The metavinculin biochemistry (PMID:30844403,
    PMID:22613835) is solid and is NOT part of the dispute; the gap is between that
    biochemistry and the human phenotype. And every in vivo model deletes vinculin
    (PMID:17785437, PMID:15331426) while the proposed human mechanism is gain of
    function, so the models' failure to produce hypertrophy is recorded as a
    HUMAN_MODEL_MISMATCH discussion and a FAILS_TO_RECAPITULATE link with explicit
    limitations, not as decisive evidence against.

    DEEP RESEARCH: falcon (Edison Scientific Literature), 981s, 30 citations,
    research/Hypertrophic_Cardiomyopathy_15-deep-research-falcon.md plus its
    citations sidecar and one non-image artifact. The report independently reached
    the same framing (sparse subtype evidence; do not encode general-HCM
    prevalence, prognosis or mavacamten response as VCL-specific; the Vcl-null
    mouse models loss of function and evolves to DCM). It did NOT surface the
    ClinGen Disputed classification, nor PMID:16236538, PMID:16949038,
    PMID:30844403, PMID:17097056, PMID:15331426 or PMID:23561539, all of which were
    found by direct PubMed/ClinGen work and carry most of this entry's content.

    DEEP RESEARCH CITATION DEFECT, reported rather than silently dropped. The
    report's executive summary and section 4 attribute five PMIDs to Open Targets
    as human genetic literature supporting the VCL-HCM association: 16712796,
    20052757, 21779496, 22826437, 24937142. Only the first is about VCL. The other
    four are RAF1/BRAF Noonan-syndrome papers (RAF1 dephosphorylation of Ser259;
    Raf family kinases review; BRAF heterodimerization in Noonan RAF1 mutants; a
    Raf/Mek/Erk interactome review) - wrong gene, wrong disease. All four resolve
    in PubMed, so an identifier-resolution check scores them clean; the retro-fitted
    `just validate-research-reference` section reports 6/6 resolved and 0 off topic
    because its extractor does not parse the comma-separated list they appear in.
    None of the four was used. Flagged here because the failure mode - resolvable
    identifiers naming an unrelated disease - is invisible to the report's own
    validation.

    VALIDATION RUN: `just validate` passes (54/54 snippets verified against cached
    references); `just validate-terms` passes; `just compliance` 90.5% global /
    91.1% weighted. Offline gates run and clean: check-duplicate-keys,
    check-enum-values, check-qualifier-terms, check-entity-refs,
    check-causal-targets (no new dangling targets). `just validate-disorders` run as
    the final batched gate.

    The falcon report had no validation frontmatter, so both sections were
    retro-fitted with one `just validate-research-reference` run, which wrote a
    `## Reference Validation` section (6 references checked, 6 resolved, 0
    unresolved, 0 off topic) and a `## Term Validation` section (48 terms checked,
    48 resolved, 0 unresolved). A subsequent `just validate-research-terms` re-run
    failed on an OLS read timeout resolving HP:0031640 and changed nothing; the
    section from the first run is what is committed. The single term flagged as
    "named as a different term" is MONDO:0013200, which the report renders as
    "MONDO:0013200 (if available)" straight from the template - a parsing artifact,
    not a mis-binding. Note that the reference section's clean result is the reason
    the RAF1 defect above is recorded by hand.

    DELIBERATE OMISSIONS. No `datasets` block: `just discover-datasets` returns only
    generic hypertrophic cardiomyopathy series (myosin-inhibitor mouse studies,
    sarcomeric iPSC lines, HCM lncRNA networks) and none mentions VCL, vinculin or
    metavinculin, so attaching them would be Named Entity Confusion reached through
    dataset search. No prevalence figure, penetrance, onset or progression data: the
    published case base is two isolated probands from screening cohorts, with no
    pedigree. Treatments are deliberately thin and defer to the parent entry, since
    nothing here is genotype-directed. GeneReviews PMID:20301725 (Nonsyndromic
    Hypertrophic Cardiomyopathy Overview) is the applicable chapter and is tagged in
    `references`, but its cached PubMed record contains only the chapter's purpose
    statement with no clinical-characteristics text, so no phenotype is sourced from
    it and no snippet is claimed against it; there is no VCL-specific chapter.

    PRE-PR RED-TEAM REVIEW (dismech-pr-review skill, fresh-context subagent) found
    21 findings, all of which were taken. The two that mattered:

    (1) relationship_type was CAUSATIVE with a ten-line note retracting it. The
    enum has a DISPUTED value defined as ClinGen "Disputed" or "Refuted", and
    CAUSATIVE is defined as ClinGen Definitive or Strong. The structured field is
    what an export or query reads; the prose caveat does not survive either. Changed
    to DISPUTED. This was the one field in the entry that contradicted its own
    framing.

    (2) The description said both probands had apical hypertrophy. Only the R975W
    proband did; the L277M proband's report says mid-ventricular only. With a
    two-patient case base that is not cosmetic. Corrected.

    Also taken: the pathophysiology chain terminated at obstruction and never
    reached the phenotype layer, and a pathophysiology node differed from a
    phenotype only in capitalization, which the verbatim-matching pathograph would
    have rendered as two nodes for one concept - the node is now "Dynamic Outflow
    Obstruction" and edges run into three phenotypes (orphan_targets is now empty,
    17 edges). A `Dilated cardiomyopathy` phenotype whose own description opened
    "Not a feature of this entity" was deleted, since a phenotypes[] entry asserts
    the opposite of what it said; the boundary is carried by the differential
    diagnosis and the allelism evidence. The ClinGen DCM-Strong record was regraded
    SUPPORT -> NO_EVIDENCE, being true, worth citing, and about a different disease.
    Two evidence items had quotes that did not carry their explanations: the
    histopathology REFUTE quoted the DCM/HTN/PHTN comparator arm, which if anything
    makes the marker look more specific, and the differential quoted a sentence
    saying the marker discriminates between pathophysiologies; both now quote the
    obstructive-HCM/aortic-stenosis sentence that actually destroys VCL-specificity,
    and the comparator sentence is retained as a SUPPORT item for compartment and
    aetiology specificity. An unevidenced `modifier: LOSS_OF_FUNCTION` on
    GO:0003789 was dropped - the cited work shows mutants fail to inhibit bundling,
    not that they lose severing. "No new evidence since 2006" / "the intervening
    seventeen years" over-read ClinGen, whose phrase is "since the initial
    curation", a curation event with an intervening 2021 recuration; both were
    corrected. The mouse-versus-human metavinculin share, asserted three times
    without a citation, is now evidenced from PMID:17785437's full text. The
    sigmoidal-contour phenotype now records that the class-level finding is in
    tension with both VCL probands' described morphology and that the series' two
    apical cases may be the VCL pair. `attaches_to: animal_models#Mouse` bound only
    the first of two same-species models and now names both by model name. A
    prevalence record that was really a diagnostic yield was removed and its content
    folded into the remaining record's notes, where the 389-proband denominator was
    also corrected (three variants across four patients, one carried forward, not
    "one variant"). The treatment term moved from NCIT:C15329 Surgical Procedure to
    NCIT:C51591 Myectomy, already an enum-validated member. A `would_refute`
    pointing at the hypertrophy node now points at the variant node, since the
    probands demonstrably had hypertrophy. Prose describing one `discover-datasets`
    run was trimmed to the durable claim.

    Compliance moved 90.5% -> 87.4% across this revision. That is the placeholder
    prevalence record and the Dilated cardiomyopathy phenotype being removed; both
    scored full marks on evidence coverage and neither should have existed.

    UNRELATED PRE-EXISTING CHURN, surfaced not fixed. Eight references_cache/DOI_*.md
    files show as modified in a freshly created worktree off origin/main - a tool in

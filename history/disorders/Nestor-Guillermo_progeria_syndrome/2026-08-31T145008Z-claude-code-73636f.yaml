  summary: Add prematurely aged appearance phenotype and inheritance block
  details: |
    Added HP:0007495 Prematurely aged appearance as a phenotype and an autosomal recessive inheritance block, both previously absent.

    Motivation: the new Progeroid_Syndromes grouping states a NECESSARY criterion of a prematurely aged appearance in a Mendelian disorder, and NGPS failed both leaves only because neither fact was curated here. Fixed in the member rather than exempted in the grouping.

    Phenotype: HP:0007495, marked diagnostic. Cited from PMID:21932319, the first clinical report of the two index patients, whose sentence lists aged appearance first among the progeroid features they share with the classic progerias. That sentence was already in use in this file with evidence_source HUMAN_CLINICAL for three other phenotypes, so the grading is consistent.

    Inheritance: HP:0000007 Autosomal recessive inheritance, evidenced by the ClinGen gene-disease validity row already cited in the genetic section, which records AR for BANF1-NGPS. The description notes that ClinGen's classification is still Limited given how few families have been reported.

    No other content changed. Validation: just validate and just validate-terms passed; all snippets verify against the committed reference cache.

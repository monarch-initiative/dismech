  summary: 'Create: ACCES_Syndrome'
  details: |
    New entry for ACCES syndrome (MONDO:0859262), the autosomal dominant UBA2-related aplasia cutis congenita and ectrodactyly skeletal syndrome. Curated from the UBA2 case literature (the 2021 Genet Med cohort, later case reports and the 2024 ClinGen Definitive AD assertion) with one openscientist deep-research report used as leads. The pathograph runs from UBA2 loss of function (the mechanism stated by the cohort study and ClinGen; no dominant-negative effect is reported) through reduced protein SUMOylation, which has not been measured in patient cells, to disrupted distal limb morphogenesis, aplasia cutis congenita and growth delay; a neural crest step from a pharmacological mouse model is recorded as an EMERGING hypothesis. The 19q13.11 contiguous gene deletion syndrome (MONDO:0013090) is described in notes and not curated. The report's term validation was rerun skipping the MedGen prefix after an OLS timeout aborted it; preflight-dr was skipped because it needs the local MONDO build. Validated with just validate-disorders (schema, terms, abstract-only references: all snippets verified) and the offline structural checks.

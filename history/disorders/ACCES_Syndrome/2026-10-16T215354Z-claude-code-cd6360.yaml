  summary: 'Review round 1: ACCES_Syndrome'
  details: |
    Addressed the first review. Added an ectodermal anomalies phenotype bound to HP:0001574 Abnormality of the integument with coarse_binding_basis SOURCE_UNSPECIFIED, citing the cohort abstract sentence that lists ectodermal anomalies; HP:0000968 Ectodermal dysplasia was not used because HPO marks it as not for new annotations. Added animal_models for the uba2-null zebrafish with human mRNA rescue (PMID:34040189) and the TAK-981 prenatally exposed mouse (PMID:39985830), linked to UBA2 Loss of Function, Reduced Protein SUMOylation, Impaired Neural Crest Differentiation and Disrupted Distal Limb Morphogenesis, with limitations, typed divergences (homozygous null versus heterozygous patients; drug-induced transient whole-pathway inhibition rather than a genetic Uba2 model) and readouts repeating each link target. Added a diagnosis section (exome or genome sequencing, chromosomal microarray for 19q13.11 deletions, prenatal diagnosis). Softened the genetic notes on missense residues to state they come from structural modelling in the cohort full text. Added full-text cohort frequencies to phenotype descriptions as prose, without snippets. Validated with just validate-disorders, snippet count, term validation, model-scale-audit --strict, the per-file test_data checks, and the whole-KB CI gates.

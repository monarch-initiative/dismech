  summary: 'Create: Brain Small Vessel Disease 2 (COL4A2), with recessive 2B as a
    subtype'
  details: |
    New COL4A2 entry anchored on MONDO:0013773 (BSVD2A) with BSVD2A and BSVD2B (MONDO:0980747) as subtypes; MONDO:0980747 is also mapped as skos:narrowMatch. Lump decision: the recessive form is known from three published families (PMID:33912663, PMID:36603335, PMID:41499643) and shares the collagen IV pathograph, so a stand-alone 2B entry would duplicate it; both stubs (2A and 2B) are deleted. Deep research: the only report is Perplexity (research/Brain_Small_Vessel_Disease_2B-deep-research-perplexity.md), 20/20 references resolved, needs_review because two HTRA1 references were off topic; those were not used. Most evidence came from primary COL4A2 papers found by PubMed E-utilities search. preflight-dr returned WARN only because COL4A1, the assembly partner of COL4A2, is mentioned 11 times; the report is about the right disease. PMID:33912663 first cached with no text and was refetched as PMC full text. check-genereviews: the only chapter in the area is COL4A1-Related Disorders (PMID:20301768), tagged, used only for the general consequences of porencephaly. Mechanism chain: COL4A2 variation, then ER retention of collagen IV, then variable ER stress and a defective basement membrane, then small-vessel fragility, then hemorrhage and porencephaly; plus a mouse-only smooth-muscle calcium-signaling branch (Col4a2 G646D). Validation: just validate passed (schema, terms, 76/76 snippets); entity refs, causal targets, duplicate keys and block-scalar checks clean; 5/20 phenotypes causally connected.

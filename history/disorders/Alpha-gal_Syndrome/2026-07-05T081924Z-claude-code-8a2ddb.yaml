  summary: 'Create: Alpha-gal Syndrome'
  details: |
    Created Alpha-gal Syndrome MONDO:0100001, an IgE-mediated tick-acquired allergy to galactose-alpha-1,3-galactose. Deep research launched via falcon Edison and asta; asta retrieval returned off-topic papers and was discarded. Evidence anchored on independently PubMed-verified primary literature: Chung NEJM 2008 PMID:18337601 cetuximab-alpha-gal, Commins JACI 2009 PMID:19070355 delayed red-meat anaphylaxis, Commins JACI 2011 PMID:21453959 tick-bite sensitization, van Nunen MJA 2009 PMID:19413526, Steinke/Platts-Mills JACI 2015 review PMID:25747720. The falcon (Edison) deep-research run completed and contributed two additional verified sources: Wilson et al. Allergy 2024 review PMID:38193233 (corroborating the 2-6 h delay and mammalian-derived-product exposures) and Sharma et al. Front Immunol 2024 PMID:38390396 (AGKO mouse model, MODEL_ORGANISM evidence for tick-driven Th2 sensitization). Post-review fixes from a red-team subagent: added downstream causal edges connecting the four pathophysiology nodes, removed a misleading temporality qualifier, and softened the glycolipid-delay wording to match its (hypothesis-framed) evidence. Added a mechanistic_hypotheses block capturing the three competing theories of tick-driven alpha-gal sensitization (tick-intrinsic salivary constituents; residual mammalian blood-meal glycoconjugates; a tick-associated microorganism), all ALTERNATIVE and cited to PMID:25747720. Added discussions: a KNOWLEDGE_GAP on the IgE class-switch site (germinal-center vs local skin), a HUMAN_MODEL_MISMATCH on AGKO-mouse translational fidelity (alpha-gal IgG1/hypothermia readout vs human IgE delayed anaphylaxis; PMID:38390396) with a proposed glycolipid-carrier delayed-effector experiment, and an EMERGING_HYPOTHESIS on the alpha-gal/cardiovascular-disease association (PMID:38193233). Ran an openscientist hypothesis-search on the tick_salivary_constituent_sensitization hypothesis (report in kb/hypotheses/Alpha-gal_Syndrome/); it reviewed 80+ primaries and adjudicated the three competing sensitization models. Acting on independently re-verified primary evidence, promoted the tick-intrinsic salivary model ALTERNATIVE->CANONICAL (endogenous tick galactosyltransferases PMID:30242261; feeding-independent salivary-gland alpha-gal PMID:38741222; pathogen-free tick salivary-gland extract sufficient to sensitize AGKO mice PMID:34034363; alpha-gal glycolipids in saliva PMID:39053323) and demoted the residual-blood-meal and tick-microorganism models ALTERNATIVE->DEPRECATED with REFUTE evidence (feeding-independent alpha-gal PMID:38741222; no correlation with tick-borne-pathogen serology PMID:35382677). Ran two further dedicated openscientist hypothesis-searches on the deprecated models: tick_associated_microorganism (51 papers, REFUTED verdict) and residual_blood_meal_glycoconjugate (46 papers, REFUTED verdict; the blood-meal run timed out once at the 3600s server cap and was re-run successfully). Both confirmed the DEPRECATED status; note text refined with each run's caveats (endosymbionts in "pathogen-free" tick colonies; ELISA-vs-glycomics limitation). Added the dog-paradox refutation evidence (PMID:31540167, MODEL_ORGANISM) to the blood-meal model. Every new PMID was fetched and each snippet re-verified as an exact abstract substring before use. Addressed PR #5398 review: fixed a CI folded-scalar hyphen lint failure (Th2-skewing, glycolipid-dependent), added verified treatment evidence for epinephrine and antihistamines and a treatment_term (MAXO:0000053) plus tick-bite-prevention evidence from two management reviews (PMID:40312115, PMID:33009122), added PMID:39053323 as a formal evidence item on the CANONICAL tick-salivary hypothesis, and corrected an ASCII->Unicode alpha in a reference_title. Validated with schema+terms+references; compliance ~94 percent.

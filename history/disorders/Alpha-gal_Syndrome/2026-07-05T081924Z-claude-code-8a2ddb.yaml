  summary: 'Create: Alpha-gal Syndrome'
  details: |
    Created Alpha-gal Syndrome MONDO:0100001, an IgE-mediated tick-acquired allergy to galactose-alpha-1,3-galactose. Deep research launched via falcon Edison and asta; asta retrieval returned off-topic papers and was discarded. Evidence anchored on independently PubMed-verified primary literature: Chung NEJM 2008 PMID:18337601 cetuximab-alpha-gal, Commins JACI 2009 PMID:19070355 delayed red-meat anaphylaxis, Commins JACI 2011 PMID:21453959 tick-bite sensitization, van Nunen MJA 2009 PMID:19413526, Steinke/Platts-Mills JACI 2015 review PMID:25747720. The falcon (Edison) deep-research run completed and contributed two additional verified sources: Wilson et al. Allergy 2024 review PMID:38193233 (corroborating the 2-6 h delay and mammalian-derived-product exposures) and Sharma et al. Front Immunol 2024 PMID:38390396 (AGKO mouse model, MODEL_ORGANISM evidence for tick-driven Th2 sensitization). Post-review fixes from a red-team subagent: added downstream causal edges connecting the four pathophysiology nodes, removed a misleading temporality qualifier, and softened the glycolipid-delay wording to match its (hypothesis-framed) evidence. Added a mechanistic_hypotheses block capturing the three competing theories of tick-driven alpha-gal sensitization (tick-intrinsic salivary constituents; residual mammalian blood-meal glycoconjugates; a tick-associated microorganism), all ALTERNATIVE and cited to PMID:25747720. Added discussions: a KNOWLEDGE_GAP on the IgE class-switch site (germinal-center vs local skin), a HUMAN_MODEL_MISMATCH on AGKO-mouse translational fidelity (alpha-gal IgG1/hypothermia readout vs human IgE delayed anaphylaxis; PMID:38390396) with a proposed glycolipid-carrier delayed-effector experiment, and an EMERGING_HYPOTHESIS on the alpha-gal/cardiovascular-disease association (PMID:38193233). All evidence snippets verified as exact abstract substrings. Validated with schema+terms+references; compliance ~90 percent.

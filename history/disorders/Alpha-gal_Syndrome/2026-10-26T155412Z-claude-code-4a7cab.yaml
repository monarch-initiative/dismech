  summary: Conform to the H1 receptor antagonism module
  details: |
    Added one pathophysiology node with role therapeutic_vulnerability, conforming at the H1 receptor antagonism module trigger, and routed the entry's existing antihistamine treatment to it through target_mechanisms with treatment_effect ACTIVATES. The node carries no downstream edge: the relation between an antagonist and the histamine signalling it blocks is inhibitory, and a downstream edge would assert that the drug drives that signalling. Node evidence is disease-specific, paired with the class-level item that names the receptor; the disease-specific item is graded INDIRECT because it establishes the indication rather than the receptor action. This entry was chosen as the module's second conformer in preference to a second urticaria entry so the module is indication-independent: a tick-bite-related food allergy rather than another weal-and-itch disease. The node restates the treatment's own scope limit, that antihistamines address the histamine-dependent part of the cutaneous and mild reaction and assert nothing about preventing anaphylaxis, so the limit is not lost when the drug gains a mechanism node. Edits were made as text insertions, not by a YAML round-trip, so comments and formatting are untouched.

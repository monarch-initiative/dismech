  summary: 'Review: Alpha-gal Syndrome publication readiness'
  details: |
    Performed a claim-level publication-readiness review against the disorder
    YAML, the Falcon and Asta research artifacts, all three disorder hypothesis
    bundles, existing review history, and disease-specific PubMed and
    ClinicalTrials.gov records current through 2026-08-04. The Asta artifact was
    retrieval noise dominated by unrelated Fabry and skeletal-disease material
    and supplied no promotable AGS evidence.

    Split the initiating mechanism into tick-saliva/type-2 polarization and a
    distinct alpha-gal-specific B-cell class-switch/IgE-production step; added
    current human single-cell and effector-cell evidence; marked the
    glycolipid-carrier delay mechanism HYPOTHETICAL while retaining the
    clinically established delay; and connected the reaction node to eight
    clinical phenotypes. Added an evidence-backed diagnostic readout edge for
    serum alpha-gal IgE, history-plus-serology diagnostic criteria, oral food
    challenge, and basophil activation testing with its deployment limitation.
    Added meta-analytic frequency bands for urticaria and gastrointestinal
    manifestations, therapeutic modalities and contemporary avoidance outcomes,
    the Ggta1-null tick-bite mouse model with translational limitations, and
    three current AGS observational/interventional trials. Corrected review- and
    hypothesis-derived evidence to OTHER, strengthened an exact diagnostic
    snippet, and classified the mixed tick knockdown experiment as
    MODEL_ORGANISM. No disease-causal gene was added because AGS is acquired and
    human GGTA1 loss is an evolutionary prerequisite, not a causal patient gene.

    Important reviewed-but-not-promoted findings include cardiovascular
    association evidence (retained only as an open, potentially confounded
    discussion); omalizumab, cromolyn, metformin, oral immunotherapy, and
    nanoparticle approaches (off-label, case-level, preclinical, or insufficient
    for a supported treatment claim); isolated transfusion and medical-product
    reactions (case-level and exposure-specific); ABO/atopy and other proposed
    susceptibility modifiers (association without a justified causal/risk
    structure); additional single-cell NKT/NKB and mast-cell-progenitor findings
    (descriptive and not yet causal); and numerical prevalence estimates that
    conflate asymptomatic sensitization with symptomatic syndrome. Broader
    differential-diagnosis and perioperative product lists were not promoted
    without claim-specific evidence. Generator-created caches were retained only
    for references used by this disorder; unrelated validator cache churn was
    restored.

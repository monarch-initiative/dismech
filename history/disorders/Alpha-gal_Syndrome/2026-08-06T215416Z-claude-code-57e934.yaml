  summary: Link tick, dietary and drug exposures to three distinct nodes
  details: |
    Backfill for issue #8085. The three environmental entries target three different pathophysiology nodes, which is what makes this entry a good worked example of the slot. Tick bite is the sensitizing exposure and targets the tick-saliva alpha-gal node. Mammalian meat and mammalian-derived products are the elicitor rather than the sensitizer and target the slow glycolipid-borne alpha-gal appearance node, the step that explains the characteristic delay. Cetuximab targets the dedicated cetuximab immediate-hypersensitivity node, because intravenous delivery of alpha-gal on the Fab glycan bypasses digestion entirely and produces an immediate rather than delayed reaction. All three TRIGGERS/DIRECT. Validated with linkml-validate, just validate-terms and just validate-references (76/76 snippets); zero integrity issues.

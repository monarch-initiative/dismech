  summary: 'Integrate assessed OpenScientist findings: hypothesis qualifications,
    endosymbiont gap, class-switch evidence'
  details: |
    Integration pass over the three committed codex assessments of the OpenScientist hypothesis reports for this disease (residual_blood_meal_glycoconjugate, tick_associated_microorganism, tick_salivary_constituent_sensitization). No new assessment sidecars were written; all three already existed. Changes: (1) residual_blood_meal_glycoconjugate notes rewritten to follow its assessment's WEAKLY_SUPPORTED_UNRESOLVED verdict rather than the report's REFUTED verdict, correcting two arguments the assessment rejected -- the AGKO-mouse inoculum is described by its authors as partially blood fed salivary gland extract (PMID:34034363), so it does not exclude blood-meal material, and the Hyalomma comparison used vegetation-collected adults rather than blood-meal-naive ticks (PMID:38741222). Status left DEPRECATED. (2) The PMID:31540167 dog evidence item on that hypothesis was regraded REFUTE to NO_EVIDENCE with a rewritten explanation: alpha-gal is the identical epitope whichever organism synthesized it, so a canine anti-alpha-gal response after tick bites shows tolerance-breaking rather than antigen source, and the paper's experimental infestation raised anti-alpha-gal IgM alone with IgG unchanged and no IgE rise. (3) tick_associated_microorganism notes rewritten: the Polish serology covered a named limited pathogen panel, the extract study reports no pathogen or endosymbiont screening and never describes its material as pathogen free, and laboratory-reared Amblyomma americanum are dominated by Francisella-like endosymbionts (PMID:35493735). Status left DEPRECATED as absence of positive support, not exclusion. (4) New discussion disc_ags_tick_endosymbiont_contribution (KNOWLEDGE_GAP) attaching to the tick-saliva exposure node and the microorganism hypothesis, with two PMID:35493735 evidence items and a proposed endosymbiont-depleted salivary gland extract sensitization experiment from the report's Discriminating Test 1. (5) Two evidence items added to disc_ags_ige_class_switch_site grounding the retained class-switching gap: PMID:29273488 (human bite-lesion type-2 infiltrate, class switching not observed) and PMID:30506749 (alpha-gal sIgE-associated circulating B-cell subsets lack the classical CD27-high isotype-switched memory phenotype). (6) tick_salivary_constituent_sensitization notes extended with the assessment's PARTIALLY_SUPPORTED grade, the declined status upgrade, the source-tracing experiment that is still outstanding, and the tsetse-fly lead (PMID:40485140) recorded as a lead rather than a claim. Deliberately not integrated: PMID:41317280 is a review whose primary sources are PMID:30506749 and the already-cited PMID:41098729, so the review adds nothing the primaries do not; the tsetse case series was not given an evidence item because its assessment disposition is a lead, not a demonstrated extension. Verified with just check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-folded-hyphens, check-snippet-grading, check-snippet-length, check-title-snippets, check-qualifier-terms, and count-verified-snippets (80/80 verified).

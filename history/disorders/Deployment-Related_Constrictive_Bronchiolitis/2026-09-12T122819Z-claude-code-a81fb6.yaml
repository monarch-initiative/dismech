  summary: 'Create: Deployment-Related Constrictive Bronchiolitis'
  details: |
    New entry curated from issue #10976 (ATS Workshop Report PMID:42360728). Scope question answered: curated as the biopsy-defined mechanistic entity (deployment-related constrictive bronchiolitis / post-deployment respiratory syndrome) rather than as the broad DRRD umbrella, which subsumes asthma and chronic rhinosinusitis and would need member entries a Grouping does not yet have. 13 pathophysiology nodes tracing respirable particulate deposition through club cell progenitor injury, macrophage accumulation, TGF-beta activation and peribronchiolar collagen to extrinsic bronchiolar narrowing, plus the arterial, alveolar-septal and pleural compartments. Five nodes conform to fibrotic_response. Two animal models (CC-DTA club cell injury; repetitive sulfur dioxide) with typed modeled_mechanisms, readouts and limitations. No disease_term: MONDO has no class for this entity, so MONDO:0100127 is recorded as a skos:narrowMatch mapping and an NTR is raised as an OPEN_QUESTION discussion. Pulmonary hypertension deliberately not recorded as a human phenotype (mouse-only result) and flagged as a HUMAN_MODEL_MISMATCH. Validation: just validate-disorders passes schema, terms and references with 68/68 snippets verified; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence and check-term-cache-integrity all clean; entry renders without template errors.

  summary: Correct MONDO:0100127 mapping direction to broadMatch
  details: |
    Changed the mapping_predicate for MONDO:0100127 toxic bronchiolitis obliterans from skos:narrowMatch to skos:broadMatch. SKOS predicates read subject to object with the entry as the subject, and this entry is narrower than the MONDO class, so the class is its broadMatch. The entry-level notes and the open_mondo_anchor discussion notes named the old predicate and were updated. No disease_term was added: MONDO still has no class for this entity.

  details: |
    Single bundled push answering the five findings in the ai4c-reviewer CHANGES_REQUESTED review of PR #11737.

    1. Pathograph connectivity. Added the downstream edge Retained Peribronchiolar Particulate Burden -> Visceral Pleural Inflammation and Fibrosis, which the entry's own evidence explanation already asserted but the file did not contain. The PMID:21774710 'Lacy black pigment ... visceral pleural surface' item was moved from the node's evidence list onto that causal edge, typed INDIRECT_UNKNOWN_INTERMEDIATES, rather than duplicated. The pleural node is no longer an isolate. The three remaining rootless nodes (Lymphocytic Bronchiolitis and Lymphoid Follicle Formation, Distal Pulmonary Arterial Remodeling, Interalveolar Septal Fibrosis and Capillary Rarefaction) each gained a notes: block stating that no upstream mechanism node is sourceable and why, rather than gaining an unsourced edge. PMID:34954211 argues against the obvious candidate for the lymphocytic node: in the mouse, sustained club cell injury reproduces the lesion with no lymphocyte activation required.

    2. evidence_source correction. The PMID:34954211 peribronchiolar-infiltrate sentence is that paper's human comparison arm and was graded MODEL_ORGANISM; regraded HUMAN_CLINICAL, with the reason recorded in the explanation and in review_notes.

    3. Four ontology bindings replaced with exact-match terms, each resolved against OLS in the same step it was written: CL:0000192 -> CL:4033017 bronchiolar smooth muscle cell; CL:0000359 -> CL:0002591 smooth muscle cell of the pulmonary artery; CL:0000077 -> CL:1000491 mesothelial cell of pleura; UBERON:0000977 -> UBERON:0002401 visceral pleura. UBERON:0002401 matters for the 92% figure, which is specifically about the visceral and not the parietal pleura.

    4. Wheezing frequency. The 15.6% claim was attached to an odds-ratio snippet. Added the prevalence sentence from references_cache/PMID_37968126.md as the frequency's own evidence item and kept the odds ratio with an explanation saying what it does and does not support.

    5. Deep-research artifact. None exists for this entry. review_notes now states that the ATS Workshop Report PMID:42360728 served as the structured source in its place, so a future reader can tell which happened.


  summary: 'Gene-family review: LIPA'
  details: |
    The LIPA record had no type and no evidence, and claimed LIPA dysregulation contributes to foam-cell formation. Typed it UNKNOWN with germline origin and cited what the literature search found: one small, unreplicated candidate-gene case-control study associating LIPA rs1051338 and rs7922269 with pulmonary TB in a northern Chinese population (PMID:33845949), and a lipid-gene expression signature that includes LIPA and changes during treatment (PMID:38022579). The unsupported foam-cell claim was removed from the notes.

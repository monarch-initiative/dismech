  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Added three diagnosis rows. Tuberculin skin test: LOINC:1648-5, with three risk-stratified reference ranges (positive at 5, 10 and 15 mm for high, moderate and low risk), quoted from the review PMID:23226700 that restates the US criteria, since neither PMID:10881762's abstract nor the PMID:28052967 recommendations text gives a cut-off. Interferon-gamma release assay: LOINC:71773-6, no bands because the QFT and T-SPOT.TB thresholds are product cut-offs on different scales (PMID:37159954). NAAT: LOINC:38379-4 for MTB complex DNA and LOINC:89372-7 for rpoB rifampin resistance, with ATS/IDSA/CDC 2017 evidence (PMID:28052967). The TST and IGRA biochemical markers gained loinc_term. Existing rows and their evidence were not changed.

  summary: 'Fix: prevalence framing (LTBI vs active TB), HGNC gene_term bindings,
    soften emerging-drug descriptions'
  details: |
    Fixed three issues from #6225. (1) Prevalence: restructured the single record mixing LTBI and active-TB data into two separate records - LTBI POINT_PREVALENCE at 23670/100k (PMID:35577247 and PMID:30454918 as SUPPORT) and active TB ANNUAL_INCIDENCE at 130/100k (PMID:30454918); removed deprecated percentage field and irrelevant NO_EVIDENCE items. (2) Genetic: added HGNC gene_term bindings to all seven genetic entries: TREM2 hgnc:17761, APOE hgnc:613, NPC2 hgnc:14537, PLIN2 hgnc:248, LIPA hgnc:6617, TBK1 hgnc:11584, IRF3 hgnc:6118. (3) Treatments: softened descriptions of SQ109, Q203, and Auranofin to match what PMID:42154079 actually supports (drugs were explored), moving specific molecular mechanism claims to notes fields. NETosis node evidence and genetic section evidence items left as known gaps for future work per issue #6225.

  summary: Add autologous iPSC alveolus-on-chip model (PMID:41477823)
  details: |
    Added an experimental_models entry for the single-donor iPSC-derived alveolus-on-chip from Science Advances (PMID:41477823), with five modeled_mechanisms links. The model's value here is genetic tractability: a macrophage-restricted ATG14 knockout combined with wild-type epithelium and endothelium isolates a cell-type-specific autophagy requirement that neither a patient nor a whole-animal knockout can isolate. Links: Phagocytosis (RECAPITULATES), GBP4-Mediated Autophagy-Dependent TB Restriction (PERTURBS, with the caveat that ATG14 is not GBP4 and the result speaks to the autophagy machinery rather than to GBP4 specifically), Granuloma Formation (PARTIALLY_RECAPITULATES, LOW fidelity, since stochastic necrotic-core macrophage aggregates lack lymphocytic cuffing, epithelioid differentiation and encapsulation), Tissue Damage (RECAPITULATES), and Immune Evasion (FAILS_TO_RECAPITULATE). The last is the substantive negative: neither macrophages nor epithelial cells were permissive to Mtb replication, unlike 2D culture and human disease, which bounds the model's use for evasion phenotypes and for screens whose readout is restriction of intracellular replication. Substantiated with limitations plus evidence as the schema requires for a failure link. Validated: linkml-validate clean, linkml-term-validator clean, snippets verified.

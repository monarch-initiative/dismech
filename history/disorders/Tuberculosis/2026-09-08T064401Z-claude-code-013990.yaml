  details: |
    PR review round (ai4c-reviewer, CHANGES_REQUESTED on #9126). Promoted the dangling downstream target 'Efflux Transporter-Mediated Drug Resistance' to a first-class pathophysiology node named 'Rv0191 MFS-Mediated Pyrazinamide Efflux' (biological_scale MOLECULAR; GO:0042910 xenobiotic transmembrane transporter activity, GO:0006855 xenobiotic transmembrane transport), and reversed the causal direction so efflux feeds into 'Drug Resistance Mechanisms' rather than descending from it - efflux is a parallel, non-mutational route to resistance. Reworded the description and explanations to match the hedged wording of the purely computational source (docking plus triplicate 500 ns MD, no efflux assay, MIC shift, or knockout): 'putative', 'proposed', 'suggest a plausible'. Fetched and committed the missing references_cache/PMID_42581305.md via just fetch-reference. Added a Pyrazinamide treatment (NCIT:C15986 Pharmacotherapy, CHEBI:45285 pyrazinecarboxamide) so the entry curates the drug whose resistance it models; deliberately asserted no target_mechanisms link, since the efflux node describes the drug being defeated rather than a mechanism the drug acts on. Validated: just validate clean (schema no issues, term validation passed, 118/118 snippets verified); pre-existing EGA dataset-title warnings unchanged.

  summary: 'Review round: drop the duplicate Rv0191 node, keep the MDR-scoping correction'
  details: |
    Addresses the 2026-09-20 review on PR #9506, which found that after merging main this entry carried two pathophysiology nodes for the same mechanism.

    Verified the duplication independently before acting. PR #9126 merged on 2026-09-08 and curated this same paper, so main already carried 'Rv0191 MFS-Mediated Pyrazinamide Efflux'; this PR's node was named 'Rv0191-Mediated Pyrazinamide Efflux'. The names differ by four characters, so git merged the file without a conflict and nothing downstream caught it - just validate passed, check-causal-targets was clean, and check-duplicate-keys looks for duplicate keys rather than duplicate nodes. Both nodes described Rv0191 translocating PZA cytoplasm-to-periplasm through a central tunnel by a protonation-driven cycle, both bound GO:0042910, both cited PMID:42581305, and both declared a downstream edge into Drug Resistance Mechanisms.

    Took the second of the two dispositions the reviewer set out: deleted this PR's duplicate node and landed its one genuine contribution as an edit to the node already on main. Closing the PR as superseded was the other option, but it would have dropped that correction, and it is a maintainer call rather than a shepherd one.

    Kept main's node, which is the fuller of the two - it adds GO:0006855, edge-level evidence, an explicit note that the mechanism has not been confirmed by efflux assay, MIC shift or knockout, and the framing of efflux as a precursor to mutational resistance. The duplicate's modifier: INCREASED was not carried over; the reviewer flagged it twice as unevidenced by an MD study that characterises how Rv0191 translocates PZA rather than measuring activity above a baseline, and main's node omits it.

    Rescued contribution: main's downstream edge description said Rv0191 efflux contributes to 'the multidrug-resistant phenotype', which is a step further than this source supports. Re-read references_cache/PMID_42581305.md to confirm rather than taking the review's word: the abstract's opening sentence is 'Multidrug-resistant TB (MDR TB) disease is caused by TB bacteria that are resistant to at least isoniazid and rifampicin', and pyrazinamide is neither, so a PZA efflux route is not by itself an MDR mechanism. The abstract's closing sentence claims only 'a plausible mechanism of MFS-mediated drug resistance'. Rescoped the edge description to pyrazinamide resistance and recorded the reasoning inline.

    Also filled in links.issues on the 2026-08-26 history record in this PR, which the reviewer flagged in two consecutive rounds. That record is part of this unmerged branch, so this is not a rewrite of merged history, and the append-only rule's frozen fields (target.slug, target.path) are untouched.

    Net effect: the KB diff against main is now exactly the edge-description correction. The duplicate node is gone and nothing references its name.

    Still open for a maintainer, not fixed here: the review notes PR #9522 is a third open branch curating this same paper, because the mechanism was never claimed under a claim-labelled issue.

    Validation: just validate (schema + terms + references) passes, 128/128 snippets verified; check-duplicate-keys, check-entity-refs, check-causal-targets and check-enum-values all clean, with no new dangling targets after the node deletion.

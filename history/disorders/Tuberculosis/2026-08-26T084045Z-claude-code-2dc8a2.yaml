  summary: Fix Rv0191 review feedback
  details: |
    Refactored Rv0191 into atomic MOLECULAR pathophysiology node with GO:0042910. Removed unsourced claims from Drug Resistance Mechanisms. Aligned explanation with hedged computational results.

    Second review round. Deleted the reverse edge from Drug Resistance Mechanisms to Rv0191-Mediated Pyrazinamide Efflux. It ran backwards -- efflux is a molecular constituent of the resistance phenotype, so efflux causes resistance and not the reverse -- and it duplicated the forward edge's content while creating a 2-cycle with no mechanism in the reverse direction. The forward edge at the Rv0191 node is unchanged. Also narrowed the evidence explanation from "a potential drug resistance pathway in MDR-TB" to pyrazinamide resistance specifically: the cited abstract defines MDR-TB as resistance to at least isoniazid and rifampicin, and pyrazinamide is neither, so this efflux route is not by itself an MDR mechanism. The explanation now also records that the study is a docked pose plus 500 ns of simulation with no transport assay, which is what COMPUTATIONAL and the "plausible" wording rest on.

    Merged origin/main to clear conflicts in cache/go/terms.csv and cache/enums/molecularfunctionterm_305077eac108.csv. Both were additive-only: main had independently acquired GO:0042910 with the identical canonical label, so main's rows were kept and no row from either side was dropped. Verified main is a superset of the branch for both files before resolving. kb/disorders/Tuberculosis.yaml merged without conflict.

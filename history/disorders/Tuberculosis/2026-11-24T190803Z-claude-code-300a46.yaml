  summary: Wire 7 Tuberculosis phenotypes to mechanism nodes
  details: |
    Issue #16721 (phenotype wiring). Before this pass 1 of 10 phenotypes had a causal inlink; after it 8 of 10.

    Added three pathophysiology nodes: Systemic Inflammatory Cytokine Response (TNF and IL-1 production by mononuclear phagocytes; PMID:2387094, PMID:2110362), Tuberculous Pleuritis (rupture of a subpleural caseous focus and delayed hypersensitivity in the pleural space; PMID:12719023, PMID:19672657), and Tuberculous Spondylitis (haematogenous spread to the vertebrae; PMID:15459785, PMID:24020048).

    New edges: Phagocytosis -> Systemic Inflammatory Cytokine Response; Systemic Inflammatory Cytokine Response -> Fever and -> Weight Loss (PMID:2387094, PMID:10965207); Tissue Damage -> Hemoptysis (Rasmussen aneurysm or bronchial artery bleeding, PMID:34803557) and -> Chronic Cough (cavity volume and airway proximity predict cough frequency, PMID:29559307); Granuloma Formation -> Lymphadenopathy (PMID:32790739), -> Tuberculous Pleuritis, -> Tuberculous Spondylitis; Tuberculous Pleuritis -> Chest Pain (PMID:27499981); Tuberculous Spondylitis -> Back Pain (PMID:24020048).

    Edges whose source states an association or a presentation rather than a demonstrated mechanism are marked directness INDIRECT. Night Sweats and Fatigue are left unconnected: PubMed searches for a TB-specific mechanism returned nothing quotable.

    Validated with just validate, validate-terms, count-verified-snippets (164/164), check-causal-targets, list-disconnected-phenotypes, check-entity-refs, check-snippet-grading and the other whole-repo KB gates.

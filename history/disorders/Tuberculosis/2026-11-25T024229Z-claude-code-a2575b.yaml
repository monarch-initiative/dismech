  summary: Split TB cytokine node; add extrapulmonary dissemination node
  details: |
    Follow-up to PR #18881, taking two non-blocking review suggestions.

    1. Split the cytokine node by scale. A new CELLULAR node, Mononuclear Phagocyte TNF and IL-1 Production, carries the monocyte and macrophage cell types and the GO TNF and IL-1 production terms. It is fed by Phagocytosis (PMID:2110362) and feeds the existing Systemic Inflammatory Cytokine Response (PMID:2110362: phagocyte IL-1 and TNF 'may be responsible for the fever and cachexia prominent in tuberculosis', graded INDIRECT). The systemic node is now ORGANISM-scale only and is evidenced by raised plasma TNF in patients against controls (PMID:10965207). Its Fever and Weight Loss edges are unchanged.

    2. Added an ORGANISM-scale Extrapulmonary Dissemination node between Granuloma Formation and the extrapulmonary lesions, as the OpenScientist phenotype-wiring report proposed. Granuloma Formation -> Extrapulmonary Dissemination cites autopsy genomics showing lung-to-extrapulmonary spread (PMID:27798613). Extrapulmonary Dissemination -> Lymphadenopathy (PMID:32790739) and -> Tuberculous Spondylitis (PMID:15459785) replace the former direct edges from Granuloma Formation. Tuberculous Pleuritis stays fed directly by Granuloma Formation, because its cited route is contiguous rupture of a subpleural focus, not dissemination.

    Phenotype connectivity is unchanged at 8/10. Validated with just validate, validate-terms, count-verified-snippets (169/169), check-causal-targets, check-entity-refs, check-snippet-grading, check-name-collisions and the other whole-repo KB gates.

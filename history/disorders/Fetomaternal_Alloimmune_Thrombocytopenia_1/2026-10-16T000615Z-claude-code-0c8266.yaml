  summary: 'Create: Fetomaternal Alloimmune Thrombocytopenia 1'
  details: |
    New entry for the HPA-1a arm of fetal and neonatal alloimmune thrombocytopenia (MONDO:0980723), curated as an alloimmune two-organism disease rather than a Mendelian one: the nodes upstream of transplacental IgG transfer are maternal, those downstream fetal and neonatal. 9 pathophysiology nodes and 13 causal edges run from the paternally inherited HPA-1a antigen (ITGB3 Leu33Pro) through HLA-DRB3*01:01-restricted presentation, anti-HPA-1a IgG production and its reduced Fc core fucosylation, FcRn-mediated transfer, and then three fetal arms: FcgammaRIII-dependent clearance of opsonized platelets, suppression of megakaryopoiesis, antiendothelial anti-alphaV-beta3 injury with impaired angiogenesis, plus a placental chronic-inflammation arm. All 4 phenotypes are causally connected. ITGB3 is typed SUSCEPTIBILITY, not CAUSATIVE, with the two-genome discordance and the maternal HLA restriction recorded in notes and in the pathophysiology nodes because the single-genome gene-disease model cannot express them; no inheritance block is given because there is no Mendelian mode. Two mechanistic hypothesis groups separate the platelet-directed model (CANONICAL) from the antiendothelial determinant of intracranial hemorrhage (ALTERNATIVE), and one KNOWLEDGE_GAP discussion records that no predictor of hemorrhage exists. Treatments: maternal IVIG (randomized dose-comparison trial), adjunct corticosteroids, neonatal platelet transfusion, plus two investigational agents linked to the mechanism they target, nipocalimab on the transfer node (phase 3 FREESIA-1, NCT06449651) and RLYB212 on maternal alloimmunization. Two animal models are linked with modeled_mechanisms, including a SPECIES_MISMATCH divergence on the murine anti-beta3 model because its isoantibody is not the HPA-1a alloantibody. One openscientist deep-research report was used; it was retrieved by re-attaching to the original job (e2b43617-1e73-4db0-ba4a-ad1b4feb1ad5) after a container restart, with no second job submitted. Its reference validation reported 37/37 references resolved, 0 unresolved, 32/37 on topic; its term validation set needs_review true, but every mismatch listed was the report writing a category word (Clinical sign, Lab abnormality, Primary:** blood/platelets) where the ontology label belongs, and the CURIEs themselves resolved: the three HP terms reused here (HP:0002170, HP:0001873, HP:0000967) match their canonical labels. 13 of the report's 37 citations were used and 12 further references were found independently through PubMed. Citations deliberately not used: 41290206 (nipocalimab in hemolytic disease of the fetus and newborn, a different disease); 27250900, 34033425, 26171707 and 37473739 (single case reports of individual differential diagnoses); 28794456, 34201864, 39486121 and 16157119 (uterine NK, complement C4d and sFlt-1 detail of the placental arm, which is represented here only by its histological association with intervillositis); 37868955 (assay development); 40175002 (screening-policy Delphi consensus); and 33839095, 17094038, 15363839, 35671780, 30467085, 16317099, 32657948, 27017954 and 41672591, whose claims were already carried by a cited source. just preflight-dr could not run: it exits 2 without a local MONDO build and the 1.3 GB download was declined, so disease identity was checked by hand instead, against the report's own MONDO:0980723 frontmatter, its ITGB3 and HPA-1a content throughout, and the MONDO parent MONDO:0019415. Validated with just validate (96/96 snippets, 101 titles, 0 issues), just validate-terms, just validate-disorders, just count-verified-snippets 96/96, and the entity-ref, causal-target, duplicate-key, qualifier-term, enum-value, block-scalar, snippet-length, title-snippet, folded-hyphen, snippet-grading, retired-support-prose, reference-title, coarse-phenotype and case-collision gates. just check-genereviews --online reports NO_CHAPTER for both GeneReviews and StatPearls, so the phenotype baseline is the clinical and pathophysiology reviews. just check-gene-activity-grounding initially flagged the ITGB3 node; a GO fibrinogen-binding molecular function was bound to it, with the node description stating that the HPA-1 allele does not alter that function, and the entry now contributes no finding to that gate (which fails on this checkout for 389 pre-existing findings with or without this file). A first attempt to bind GO:0006486 to the Fc-glycoform node failed term validation because that term is obsolete; the node is left unbound and notes record the two ols:go searches run and why GO:0006487 would overstate the claim.

  summary: 'Review round 1: add non-ICH bleeding phenotypes, bind nipocalimab'
  details: |
    Round 1 of automated review on PR #14448. Both blocking findings and one of
    the non-blocking suggestions were applied in a single push.

    Finding 1, non-intracranial bleeding absent from phenotypes. The entry
    carried thrombocytopenia, intracranial hemorrhage, fetal growth
    restriction and neurodevelopmental sequelae, with no node for the
    mucocutaneous and mucosal bleeding that is the commonest presentation. Two
    phenotype nodes were added, both from references already cached in this
    branch:

    - "Non-Intracranial Bleeding", category Hematologic, bound to HP:0001892
      Abnormal bleeding (label read from cache/hp/terms.csv), frequency
      FREQUENT. Two evidence items from PMID:36108655, the FNAIT registry
      cohort: "Mild bleeding was diagnosed in 186 (48%) neonates." for the 48
      percent figure behind FREQUENT, and "Severe bleeding was diagnosed in 23
      (6%) of 389 liveborn neonates, with one having a severe pulmonary
      haemorrhage and 22 having severe intracranial haemorrhages." for the
      statement that severe bleeding outside the central nervous system was a
      single case, so the common non-intracranial bleeding is the mild
      category.
    - "Petechiae", category Dermatologic, bound to HP:0000967 Petechiae. Two
      evidence items from PMID:26564154, which is a review, so both carry
      quote_role REVIEW_SYNTHESIS: "In most FNAIT cases, the disease presents
      as petechiae, hematomas, melena, sometimes hemoptysis, retinal bleeding
      and hematuria" for the presentation, and "there are some severely
      thrombocytopenic newborns who do not have any petechiae, and this may be
      the reason why some FNAIT cases with ICH are not examined for maternal
      antibodies against platelets" for the caveat that the sign is not a
      reliable screen. No frequency is set on this node, because the source
      says "most" without giving a figure.

    Both nodes were wired into the pathograph with sequelae edges from the
    existing Thrombocytopenia phenotype, using bare-name targets, each edge
    carrying its own evidence. just list-disconnected-phenotypes now reports 6
    of 6 phenotype nodes causally connected for this entry.

    Finding 2, nipocalimab binding. The nipocalimab treatment's
    therapeutic_agent was bound to NCIT:C20401 Monoclonal Antibody while its
    own preferred_term already said nipocalimab. Rebound to NCIT:C170891
    Nipocalimab, whose label was read from cache/ncit/terms.csv and whose
    membership in the chemicalentityterm enum cache was confirmed before the
    edit, so no new cache row was needed. The RLYB212 treatment keeps
    NCIT:C20401, since that agent has no NCIT term.

    Suggestion 1, prevalence band versus rate. A clause was added to the first
    prevalence record's notes recording that 1 in 1000 to 1 in 2000 is 5 to 10
    per 10,000, so the quoted range sits at and above the top edge of
    BAND_1_5_PER_10000, that no Orphanet band covers 5 to 10 per 10,000, and
    that the band therefore understates the upper end while ABOVE_1_IN_1000
    would overstate it. No number and no class was changed.

    Suggestion 2, platelet transfusion modality, was deliberately not taken.
    therapeutic_modality OTHER is kept: the reviewer recorded it as defensible
    and the curator's call, and a transfused allogeneic platelet product is
    not the engraftment-intent cellular product that CELL_THERAPY describes in
    the CLAUDE.md mapping table.


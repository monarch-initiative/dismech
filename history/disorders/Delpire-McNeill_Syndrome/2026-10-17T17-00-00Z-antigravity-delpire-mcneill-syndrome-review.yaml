  summary: Deepen Delpire-McNeill syndrome curation with synonyms, classifications, prevalence, progression,
    NKCC1 pathophysiology, variable congenital anomalies, and differential diagnoses while separating allelic
    DFNA78.
  details: Added synonyms (DELMNES and Orphanet name), Harrison's chapter classifications (NEUROLOGIC,
    GENETICS_ENVIRONMENT_DISEASE, DISORDER_OF_EAR), ultra-rare prevalence, infantile progression, explicit
    pathophysiology roles, SLC12A2 gene and molecular function (GO:0008511) bindings, cell types and anatomical
    locations across neural, cochlear strial, and glandular tissues, phenotype coverage for Agenesis of
    Corpus Callosum (HP:0001274), Ventricular Septal Defect (HP:0001629), Tracheoesophageal Fistula
    (HP:0002575), and Hip Dislocation (HP:0002827), device qualifiers on Cochlear Implantation, restored
    Neurodevelopmental Assessment and Vestibular Function Testing (with an unbound preferred_term after
    removing the off-target NCIT:C38060 Eye Examination binding) in diagnosis, marked allelic DFNA78
    evidence on Genetic Counseling and Vestibular Function Testing with directness INDIRECT, and added
    Autosomal dominant nonsyndromic deafness 78 (MONDO:0033665) and Usher syndrome (MONDO:0019501) in
    differential_diagnoses. Removed unverified Seizures phenotype and Antiseizure Pharmacotherapy treatment
    that lacked backing in cached abstracts/Orphanet, separated non-syndromic DFNA78 vestibular areflexia
    from syndromic Delpire-McNeill phenotypes, and removed unsupported incomplete penetrance claims.

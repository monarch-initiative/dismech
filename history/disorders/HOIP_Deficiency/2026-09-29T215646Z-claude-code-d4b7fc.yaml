  summary: Ground RNF31 on a molecular function
  details: |
    Fixes the 'Check for newly ungrounded genes' CI gate
    (scripts/check_gene_activity_grounding.py), which reported RNF31 as newly wired into the
    pathograph without a molecular function on the node it lands on.

    RNF31 lands on 'Biallelic RNF31 Loss-of-Function Variants', the only node carrying a genes:
    descriptor for it. That node now binds GO:0061630 ubiquitin protein ligase activity with
    modifier LOSS_OF_FUNCTION, and the binding was moved there from 'Loss of Linear (M1)
    Ubiquitination' rather than duplicated, so the entry states the GO ladder once and in order:
    gene to molecular function to biological process (GO:0097039 protein linear
    polyubiquitination, two nodes downstream).

    Term choice, recorded in the node's own notes as well. GO has no molecular function for
    Met1/linear-linkage ubiquitin ligase activity. The linkage-specific terms that exist are
    GO:0061815 Met1-linked polyubiquitin deubiquitinase activity, which is the reverse reaction
    and OTULIN's activity rather than HOIP's, and GO:1990450 linear polyubiquitin binding, which
    is a binding rather than a catalytic function; OLS searches on 'Met1', 'linear polyubiquitin'
    and 'ubiquitin ligase activity' return those and nothing nearer. The positive reason for
    GO:0061630 is that its own GO definition covers this reaction, ending 'or, in the linear
    extension of ubiquitin chains, a peptide bond the between the C-terminal glycine and
    N-terminal methionine of ubiquitin residues'. Every label was read from OLS in the same step
    it was written.

    Re-ran after the change: the grounding gate reports OK, just validate passes with 119/119
    snippets verified and 135 titles checked, just validate-terms passes, and entity refs, causal
    targets and duplicate keys are clean. No references_cache file was modified.

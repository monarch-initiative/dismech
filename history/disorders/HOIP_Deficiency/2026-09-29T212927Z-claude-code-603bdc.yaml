  summary: 'Create: HOIP_Deficiency'
  details: |
    New entry for HOIP deficiency (immunodeficiency 115 with autoinflammation, MONDO:0957981), the RNF31/HOIP arm of LUBAC deficiency.

    Curated from the four fully reported patients (PMID:26008899 Boisson 2015, PMID:30936877 Oda 2019, PMID:39009172, PMID:41026334) plus the HOIP-deficient patient whose cell and tissue data appear in the SHARPIN report (PMID:38609546), and from the mouse literature on Hoip and Rnf31 conditional knockouts.

    Pathograph. Fifteen pathophysiology nodes running from the biallelic RNF31 variant through LUBAC destabilisation and loss of M1-linked ubiquitination, which branches into the NF-kappa-B/antibody arm, the TNFR1 cell-death arm, the paradoxical monocyte IL-1 beta hyperresponsiveness, the TLR3 antiviral arm, the type I interferon signature, and the lymphatic and muscle-storage arms. Nineteen of twenty-five phenotypes are causally connected. Six are deliberately left unwired and the entry's notes say which and why; the muscle weakness is the clearest case, since the same paragraph that documents the muscle polyglucosan records normal electromyography and creatine kinase.

    Deep research. An OpenScientist run is committed with the entry. Its reference validation is 15/15 resolved with 11/11 quotes matching; term validation flags three mislabelled CURIEs and needs_review is true. just preflight-dr returns WARN on two counts, both checked and resolved: TNF outweighs RNF31 in mention count because TNF signalling is this disease's own mechanism rather than a second disease, and the OMIM number the report cites (612487) is the RNF31 gene MIM where MONDO xrefs the phenotype MIM 620632 (confirmed against NCBI Gene 55072). The report contributed PMID:22863777 (HOIP RBR carries the catalytic activity and linkage specificity), PMID:27810922 (the TLR3 arm), PMID:28469620 (the OTULIN/A20 mirror-image differential) and PMID:23995275 (the RBCK1 polyglucosan sibling). Its suggested GO:1990592 for protein linear polyubiquitination was not used: GO calls that term protein K69-linked ufmylation, and the entry binds GO:0097039, looked up independently. Its claim that all patients are homozygous was not used either, since two of the four are compound heterozygous.

    Not taken from the report: the IL-1 blockade and JAK inhibition rows of its treatment table, which are cited to a general inflammasomopathy review rather than to any HOIP patient, and its HSCT row, which it labels theoretical. No HOIP-deficient patient has received any of the three. The IL-1 and JAK questions are recorded in discussions and mechanistic_hypotheses instead of as treatments.

    Verification. All snippets were re-verified against the fetched reference cache rather than taken from the report. just validate reports 119/119 snippets verified and 135 titles checked with no issues; term validation passes; entity refs, causal targets, duplicate keys, qualifier terms and the coarse-phenotype gate are clean. just check-genereviews reports NO_CHAPTER with synonyms present, and the entry's notes record the PubMed genereviews[book] query behind that. The absence of an HSCT report is recorded in notes with the three PubMed queries run and their result counts.

- type: EDIT
  outcome: changed
  summary: 'Review round 1: regrade ex vivo patient-cell assays IN_VITRO'
  details: |
    Review round 1 on PR #13204. The blocking finding was an inconsistency the entry created for itself: seven evidence items describing ex vivo stimulation of the patients' own fibroblasts, monocytes, B cells and PBMCs were graded HUMAN_CLINICAL, while the same kind of experiment was graded IN_VITRO on five other items. All seven are regraded IN_VITRO, which is what CLAUDE.md's classification rules say for cultured cells whether human or animal, and the rule the entry follows is now written into notes: so the next curator does not have to infer it. Clinical descriptions, biopsy histology and flow counts of unstimulated blood stay HUMAN_CLINICAL.

    Suggestions taken in the same round. Hepatomegaly is added as a phenotype from the sentence that already evidenced the fever and splenomegaly in the founding patient. The INDIRECT_KNOWN_INTERMEDIATES edge from the T cell compartment to recurrent viral infections now names its intermediates, which were previously left implicit. The four reference caches nothing cited are removed, and notes: records why pyroptosis is not modelled: the report's source for it (PMID:32122970) is cell-line and mouse-macrophage work with no patient phenotype attributed to it.

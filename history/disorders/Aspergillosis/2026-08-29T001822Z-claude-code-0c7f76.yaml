  summary: 'Review response: fever and dyspnea grounded in counted frequencies; diagnosis
    terms bound'
  details: |
    Response to the second CHANGES_REQUESTED review on PR #9955, covering the residual defects after the diagnosis section and the Dyspnea and Fever phenotypes were added.

    Fever. The phenotype as first written cited two snippets that between them never mention fever: PMID:16088462's statement that the clinical signs of invasive pulmonary aspergillosis have low specificity, and PMID:10844935's sentence about the commonest causes of death in the CGD registry. That is the same defect the reviewer blocked on for Eosinophilia, so both were replaced rather than regraded. No reference cached on the branch mentioned fever at all, so two were fetched: PMID:34947041, a 45-patient COVID-19-associated pulmonary aspergillosis cohort reporting fever in 98% and, against a COVID-19 control group without aspergillosis, a temperature above 38.5 degrees Celsius refractory to antibacterial therapy; and PMID:29049239, a 69-patient chronic pulmonary aspergillosis series reporting fever in 17.4% and locating it in the subacute-invasive and chronic-cavitary subgroups rather than in simple aspergilloma. The phenotype now carries both subtypes and a description that states the two frequencies instead of asserting that fever is common.

    Dyspnea. The second evidence item quoted PMID:30076119's ICU enrolment criteria, the same inclusion-criteria-as-evidence pattern the reviewer flagged on Pneumonia. Replaced with PMID:29049239's counted symptom frequencies, which put breathlessness at 7.2%. The description was rewritten to say that number out loud, because the classic symptom triad implies a frequency the series does not support.

    Pneumonia. Added the sentence the reviewer asked for, from PMID:10844935, reporting pneumonia as the most prevalent infection in 79% of patients with Aspergillus the most prevalent cause. Graded SUPPORT and HUMAN_CLINICAL to match its existing grading elsewhere in the file.

    Diagnosis terms. The five diagnosis entries had no diagnosis_term. Bound them to NCIT clinical-procedure terms verified reachable from NCIT:C25218: C154817 Galactomannan Antigen Measurement, C166028 Aspergillus Antibody Measurement, C124351 Clinical Evaluation for the composite CPA criteria, whose NCIT definition explicitly covers assessment drawing on history, laboratory and imaging, C81970 Immunoglobulin E Measurement, and C191501 Chest Computed Tomography.

    Validation: just validate passed for schema, terms and references with 122/122 snippets verified; validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs, check-snippet-length, check-folded-hyphens, check-title-snippets, check-snippet-grading, check-reference-titles and check-environmental-evidence all clean.

    Note: this round was carried out concurrently with another agent session working in the same worktree, which had just landed the diagnosis section and the first drafts of the Dyspnea and Fever phenotypes.

  summary: 'Review round: Aspergillosis evidence, pathograph connectivity and treatment
    fixes'
  details: |
    Self-review round on PR #9955 before requesting external review, run against the dismech-pr-review skill. Fixes applied:

    Evidence integrity. Five evidence items rested on a methods sentence, a background-framing sentence, or a quote about something else, and were replaced with sourced findings: the Pneumonia phenotype (was the influenza cohort's enrolment criteria, now PMID:16088462); Chronic Cough and Weight Loss (were the CCPA trial's inclusion criteria and a treatment recommendation, now PMID:24299422's presenting-symptom sentence); Eosinophilia (was "New diagnosis and staging criteria for ABPA are proposed", which supports nothing, now PMID:22118718 with the actual observed counts and the honest finding that 60% of ABPA patients fall below the traditional 1000 cells/microlitre criterion); and CYBB evidence item 2 (was "using neutrophils from patients with well-defined genetic immunodeficiencies", now the paper's NADPH-oxidase sentence). The two PMID:17050430 quotes that frame the authors' in-vitro model rather than reporting a measurement were regraded PARTIAL with explanations saying so, and the Angioinvasion node description no longer asserts thrombosis and infarction as sourced -- the cited work measured endothelial damage and tissue-factor induction.

    Pathograph connectivity. The ergosterol branch and the intrinsic-resistance node were disconnected components: first-line azole therapy was modelled but had no path to the disease. Added Ergosterol-Enriched Aspergillus Plasma Membrane as the bridge (Cyp51 -> membrane -> hyphal tissue invasion, and the amphotericin B target) and Resistance-Gated Narrowing of Antifungal Options as the shared consequence of both resistance arms. Conformed three further nodes to modules that already existed and had been skipped: fungal_ergosterol_synthesis_inhibition (two nodes) and fungal_membrane_ergosterol_binding (one), plus the resistance-gating module's consequence node. The entry now conforms to four modules.

    Node atomicity. Innate Phagocyte Recognition and Killing of Aspergillus bundled three separable mechanisms and was split into Alveolar Macrophage Dectin-1 Recognition, Oxidase-Independent Neutrophil Killing of Conidia, and NADPH Oxidase-Dependent Neutrophil Killing of Hyphae -- the last of which is what CYBB and CARD9 now attach to. Dropped the protective-node-to-failure-node edge whose own description disclaimed its causal semantics.

    Treatments. NCIT:C15704 Antifungal Therapy replaces the generic Pharmacotherapy action term on the six antifungals. Bronchial artery embolisation was split out of the tranexamic acid entry under NCIT:C15230 Embolization Therapy with modality DEVICE; the claim in notes that NCIT had no term for it was simply wrong and has been removed. Amphotericin B gained target_mechanisms, a source for its ROS mechanism, and a source for the A. terreus intrinsic-resistance caveat that its previous description contradicted. NCT01259336 was corrected from NOT_APPLICABLE to PHASE_IV against the ClinicalTrials.gov API, and all three trials now cite their registry record.

    Numbers. The influenza prose said 19% vs 5%, comparing the whole influenza cohort against non-immunocompromised controls; corrected to the paper's like-for-like 14% vs 5%, and the 51%/28% mortality figures relabelled as with-IPA vs without-IPA within the influenza cohort. The invasive prevalence record's population was changed to Worldwide to match its whole-population denominator, with the at-risk description moved to notes.

    New content: imaging_findings (halo and air-crescent signs; cavity with fungal ball), histopathology (septate acute-angle-branching hyphae), differential_diagnoses (mucormycosis, which matters because voriconazole and the echinocandins are inactive against it), clinical_burden, a HUMAN_MODEL_MISMATCH discussion recording that the gliotoxin virulence evidence is from Galleria mellonella, CARD9 as a second susceptibility gene, and anti-type-2 biologics for corticosteroid-dependent ABPA.

    Also corrected two reference_title values that did not match their cached records (PMID:22675126, PMID:30076119), which is what the first CI run caught.

    Validation after the round: just validate passed (schema + terms), 106/106 snippets verified, just validate-disorders clean, and check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence and check_reference_titles all clean.

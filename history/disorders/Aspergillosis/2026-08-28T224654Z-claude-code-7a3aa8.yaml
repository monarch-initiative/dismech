  summary: 'Create: Aspergillosis (MONDO:0005657)'
  details: |
    Curated aspergillosis as a root Disease with has_subtypes (Invasive, Chronic Pulmonary, Aspergilloma, ABPA, Aspergillus Bronchitis, Disseminated), following the CURATE_ROOT_WITH_SUBTYPES guidance in issue #9041.

    Concept decision, recorded in the entry notes: a single conserved pathograph -- inhalation of ubiquitous conidia, then a phagocyte gate whose state sets the clinical branch -- rather than a union of mechanistically distinct diseases, so a kb/groupings/ Grouping was rejected. MONDO has no term for chronic cavitary/fibrosing pulmonary aspergillosis or for Aspergillus bronchitis, and no general disseminated-aspergillosis term, so those three subtypes carry no subtype_term and each says why in its description.

    Deep research: falcon (Edison), research/Aspergillosis-deep-research-falcon.md. 7/7 references resolved, confabulation rate 0.0; needs_review is true only for three label-variant terms (HP:0001880, HP:0003212, CL:0000623), all of which were bound to their canonical HP/CL labels here. just preflight-dr returned SKIP because MONDO records no causal gene for MONDO:0005657, so the gene-identity Named Entity Confusion check could not discriminate; the manual synonym preflight was done instead (git grep over origin/main for MONDO:0005657 and for aspergillosis found no existing entry). The report cites its sources by internal Edison keys rather than PMIDs and says so explicitly, so it was used as a lead source only: every evidence item in this entry cites a separately searched, fetched and cached PMID.

    Pathograph: 17 nodes -- conidial inhalation; dectin-1 alveolar-macrophage recognition together with the two distinct neutrophil killing mechanisms (oxidase-independent against conidia, NADPH oxidase-dependent against hyphae); phagocyte-clearance failure as the explicit branch point; gliotoxin; hyphal tissue invasion; angioinvasion and thrombotic infarction; haematogenous dissemination; saprophytic cavity colonisation; chronic cavitary destruction and fibrosis; and the Th2/IgE, eosinophilic-inflammation, bronchiectasis arm. Four therapy-facing nodes: Cyp51 ergosterol biosynthesis, environmental cyp51A TR34/L98H resistance, Fks glucan synthase, and intrinsic fluconazole resistance. Conforms to fungal_cell_wall_glucan_synthesis_inhibition (two nodes) and antifungal_intrinsic_resistance_gating (one node); this is the third consumer of the first module and the second of the second.

    Deliberate omissions. NCIT has no clinical-action term for bronchial artery embolisation, so that intervention lives inside the tranexamic acid treatment entry rather than as a separately bound procedure. ECTO has no term for exposure to Aspergillus, fungi or airborne spores, so the conidial exposure is bound to the general ECTO:3000000 (exposure to organism); the severe-influenza/COVID-19 predisposition carries no exposure_term at all because it is an infectious comorbidity, not an environmental exposure. NCIT:C2322 (Corticosteroid) was tried as a therapeutic_agent on the ABPA corticosteroid entry and removed: it is not in the ChemicalEntityTerm dynamic enum, so CHEBI:8378 prednisolone carries that binding alone. No datasets block: no Aspergillus-specific accession was verified, and an unverified accession is worse than none.

    Validation run and passed: just validate (schema + terms), just count-verified-snippets (83/83), just check-duplicate-keys, just check-entity-refs, just check-folded-hyphens, just check-snippet-length, just check-title-snippets, just check-snippet-grading, just check-environmental-evidence, and just validate-disorders as the final batched gate (schema, terms and references all clean, 83/83 snippets).

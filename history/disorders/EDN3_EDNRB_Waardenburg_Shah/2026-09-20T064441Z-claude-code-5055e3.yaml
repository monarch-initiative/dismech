  summary: 'Genetics pass: bind EDNRB/EDN3 on subtype rows; grade the genetic records'
  details: |
    Genetics pass for issue #12195 (d2g wiring-006).

    Research first: the entry's four ClinGen gene-disease validity assertions (EDNRB and EDN3,
    AR and AD, for WS4A and WS4B) were re-read as the baseline, along with the cited primary
    reports, before the reconciliation checklist was opened.

    Both checklist genes were already curated and already wired. EDNRB (hgnc:3180) and EDN3
    (hgnc:3178) each carry a `genetic:` record with a `gene_term` and a `subtype:` foreign key,
    and both are bound as `genes:` descriptors on the "EDN3 ligand and EDNRB receptor signaling
    deficiency" node; EDNRB is additionally bound on the "Heterozygous EDNRB susceptibility"
    node. The knowledge-graph gap is an export artefact: the checklist keys on MONDO:0010192
    and MONDO:0013201, which are `has_subtypes` terms here, while the exporter emits gene edges
    only against `disease_term` (MONDO:0019518). See dismech#12316.

    What changed: the WS4A and WS4B `has_subtypes` rows now carry `genes:` lists (EDNRB and
    EDN3 respectively), and both `genetic:` records gained `relationship_type: CAUSATIVE` and
    `variant_origin: GERMLINE`. The existing ClinGen AD/AR distinction and the incompletely
    penetrant heterozygous arm are unchanged - CAUSATIVE records the best-supported biallelic
    mechanism and does not overwrite the Limited AD assertions, which remain in
    `external_assertions` and in the dedicated susceptibility node.

    Overlap check: EDNRB is also curated in Craniofacial_Microsomia. That is a different
    disease and a separate record; nothing was moved or deduplicated.

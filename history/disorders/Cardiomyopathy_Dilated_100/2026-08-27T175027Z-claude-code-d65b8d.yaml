  summary: 'Create: Cardiomyopathy Dilated 100 (CMD1OO, VEZF1, MONDO:0859381)'
  details: |
    De-novo creation of the VEZF1-attributed leaf entity CMD1OO (MONDO:0859381,
    OMIM 620247), with module conformance rather than a re-derived remodeling chain.

    Entry-type decision: DISEASE. MONDO:0859381 is a leaf with no descendants.

    IDENTITY RESOLUTION WITHOUT A GENE IN THE STUB. This stub is unusual: it
    carries no genes: block, because MONDO records no causal-gene relationship
    (RO:0004003) for the term. Identity was therefore resolved through the stub's
    MONDO xrefs rather than by asking MONDO for a gene. MONDO:0859381 carries
    OMIM:620247 and MEDGEN:1840927; the MedGen record supplied the gene (VEZF1,
    17q22), the OMIM designation, the disease definition and the source citation
    (Shi et al. 2023 = PMID:36657711), from which the primary literature was
    located directly on PubMed.

    THE NAME IS A TRAP, and it is recorded in the entry description, synonyms and
    notes. The OMIM designation is CMD1OO with two capital letter Os, continuing
    the alphabetical suffix series; MONDO and MedGen render it "cardiomyopathy,
    dilated, 100", reading the letters as digits. This is not the hundredth
    numbered DCM locus. Both spellings are in synonyms so a search on either finds
    the entry; disease_term keeps the MONDO label unchanged.

    NEC preflight returned SKIP as expected, since MONDO records no causal gene.
    The manual check specified for SKIP was performed: the MONDO term's OMIM xref
    (620247) matches the OMIM identifier in the MedGen record, and the gene named
    there (VEZF1) is the report's dominant gene (VEZF1=49 mentions, then MYH7=10
    and TEAD1=8, which are the mechanism partners curated here rather than rival
    disease genes).

    Deep research: falcon. Its reference_validation reported 4/4 resolved, 0
    unresolved, 0 unverifiable, 0 off topic. Notably the report reached the same
    causal chain independently but could NOT recover the variant details, listing
    HGVS nomenclature, variant class and functional effect as fields to leave null
    pending inspection of the original article. Those are curated here because they
    are in the abstract of PMID:36657711, fetched directly. Recorded in the entry
    notes because it is the opposite of the usual DR failure mode.

    Pathophysiology: 4 atomic nodes, 3 edges, single root, all reachable. VEZF1
    nonsense variant abolishes transcriptional transactivation (MOLECULAR) ->
    reduced transcription of cardiomyocyte contractile and growth targets
    (MOLECULAR) -> impaired cardiomyocyte contractile function and compensatory
    growth (CELLULAR) -> left ventricular dilation and systolic dysfunction
    (ORGANISM).

    Module conformance: three nodes declare conforms_to against
    cardiomyopathy_maladaptive_remodeling (Primary Cardiomyocyte Insult,
    Progressive Contractile Dysfunction, Structural Cardiac Impairment and Heart
    Failure). Conformance is not inheritance, so the disease-specific content is
    duplicated in full. The module's Neurohormonal Activation and Ventricular
    Remodeling nodes are deliberately NOT conformed to: nothing in the VEZF1
    literature measures either in this disease, and asserting conformance on the
    strength of the general DCM pathway would be inheriting the module rather than
    declaring agreement with it.

    Confidence: the trigger and its two downstream nodes carry
    mechanism_confidence: PROVISIONAL, because the whole entity rests on one family
    with one nonsense allele plus one reporter assay, and there is no ClinGen
    gene-disease validity assertion for VEZF1 in any cardiomyopathy (checked
    against the 494 CGGV records in references_cache: zero mention VEZF1). The
    final structural node is generic dilated cardiomyopathy and is ESTABLISHED. The
    variant is recorded LIKELY_PATHOGENIC rather than PATHOGENIC for the same
    reason, with the reasoning in its evidence explanation.

    The zebrafish model carries two readouts including a genuine negative one:
    calcium transient kinetics are UNCHANGED, which is what localizes the lesion
    downstream of excitation-contraction coupling.

    Two discussions: gene-disease validity (one family, no ClinGen assertion, with
    a replication experiment proposed and the observation that VEZF1 is absent from
    most cardiomyopathy panels so absence of further reports may mean nobody
    looked); and whether the cardiac phenotype is cardiomyocyte-autonomous or
    partly vascular, since VEZF1 is better characterized as a vascular-development
    factor and the zebrafish experiment is a global knockdown.

    Scope note: OMIM's clinical synopsis, via MedGen, additionally lists atrial
    septal defect, second-degree atrioventricular block, premature ventricular
    contraction and reduced left ventricular ejection fraction. None is curated as
    a phenotype, because the only primary source is abstract-only and does not
    mention them, and MedGen/OMIM are not citable reference prefixes here. Recorded
    in notes so a curator with full-text access knows what to look for. No
    frequency values are asserted anywhere; the entity is one family.


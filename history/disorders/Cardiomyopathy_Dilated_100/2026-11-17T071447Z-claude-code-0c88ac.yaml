  summary: Correct experiment_design on the VEZF1 cohort replication
  details: |
    vezf1_dcm_cohort_replication carried TARGETED_PERTURBATION, matched on 'loss-of-function'. The experiment is a human genetic replication: independently ascertain sequenced DCM families and assess rare VEZF1 variants and segregation against controls, with isogenic human cardiomyocyte testing as a secondary confirmatory arm. The question it settles is gene-disease validity, which is decided on human genetic evidence; the surrounding evidence is a ClinGen No Known Disease Relationship assertion for this pair. Set to HUMAN_OBSERVATIONAL. A reader could argue MIXED on the strength of the isogenic arm; the name, 'Look for further VEZF1 loss-of-function alleles in DCM cohorts', is what settles it the other way.

  details: |
    Response to the automated review on PR #9732. Both blocking findings and both
    suggestions are addressed.

    Blocking 1 (accepted): the GeneReviews baseline. The entry's notes asserted
    that no GeneReviews chapter exists for this entity. That was true only of a
    GENE-specific chapter; the disease-level "Dilated Cardiomyopathy Overview"
    (PMID:20301486) applies, was already cached in this repo, and is tagged
    GeneReviews in 17 existing entries including the numbered-series peers
    Dilated_Cardiomyopathy_1AA and Dilated_Cardiomyopathy_1EE, which are in exactly
    the same position. Added to references: with tags: [GeneReviews], and its two
    verbatim-quotable purpose clauses mined: the at-risk-relative clause on the new
    cascade-testing treatment and the proband-evaluation-strategy clause on the
    echocardiography diagnosis entry, both evidence_source OTHER because the source
    is an expert overview rather than a primary study. The incorrect notes claim is
    corrected in place rather than deleted, so the record shows what it used to say.

    Blocking 2 (accepted): cascade genetic testing and surveillance of at-risk
    relatives. The reviewer is right that the entry already knew this content
    belonged here, since the sudden-cardiac-death phenotype description referred to
    surveillance mattering in a dominant family at complete penetrance, while
    nothing modelled it. Added as a treatment bound to NCIT:C15240 Genetic
    Counseling, with two evidence items: the GeneReviews at-risk-relative clause,
    and the founding paper's segregation-at-complete-penetrance sentence, which is
    what makes cascade testing informative in this entity specifically. It carries
    no target_mechanisms, because testing and surveillance are diagnostic and
    monitoring actions rather than therapeutic ones acting on a pathograph node.
    Its notes also record that the complete-penetrance figure comes from one
    pedigree and must not be quoted to a family as a general penetrance estimate.

    Suggestion 3 (accepted): GO:0060047 heart contraction was used on both the
    CELLULAR cardiomyocyte node and the ORGANISM node, which collapsed the scale
    distinction the biological_scale tags draw. The CELLULAR node now uses
    GO:0060048 cardiac muscle contraction, the cell-level term, which was already
    in the committed caches and is the phrase the source abstract itself uses. The
    ORGANISM node keeps GO:0060047.

    Suggestion 4 (accepted): added an experimental_models entry for the neonatal
    rat primary cardiomyocyte system with Vezf1 silencing, linked by
    modeled_mechanisms to the transcriptional node with RECAPITULATES and MODERATE
    fidelity. Limitations state that it is rat rather than human, and knockdown of
    the wild-type protein rather than expression of the human p.(Lys164*) allele,
    so it models loss of VEZF1 rather than this disease's specific lesion. This is
    the system that speaks to the cardiomyocyte-autonomy question raised in the
    entry's second discussion, since it removes the endothelium from the question.

    Also rebased onto origin/main, which was 41 commits ahead. That clears the
    test (3.13) failure, which was the phantom environmental-evidence gate firing
    on exposures in files this PR does not touch. The rebase auto-merged with no
    cache conflicts; the cache diff against main is 7 additive rows and zero
    deletions. The MONDO:0859381 row was explicitly checked for the comma trap
    (dismech#7682): its label contains two commas, and it parses to exactly three
    CSV fields with the label intact, because it was machine-derived and never
    hand-written.


  summary: Record KNOWLEDGE_GAP for PVNH7 neurological phenotypes
  details: |
    Added a KNOWLEDGE_GAP discussion (gap_nedd4l_seizures_and_neurodevelopmental_impairment) attaching to Seizures, Infantile spasms, Global developmental delay and Intellectual disability, which previously had no incoming causal edge. Chose issue #16999 option 2 (record the gap) over option 1 (a heterotopia to seizure INDIRECT edge): within one p.Arg208Gln family, carriers with heterotopia on MRI range from no seizures to refractory epilepsy (PMID:32117442), so the malformation does not predict the seizure phenotype and a single edge would overstate it. The GluA1/AMPA-receptor route (PMID:28212375) is recorded as the hypothesis the proposed experiment would test, with the caveats that it is a NEDD4L loss-of-function mouse and isolated-epilepsy variants, not the PVNH7 HECT-domain variants. Validated with validate, count-verified-snippets 50/50, check-entity-refs, check-causal-targets, check-snippet-grading and validate-disorders.

  summary: 'Create: Periventricular_Nodular_Heterotopia_7'
  details: |
    Curated PVNH7 (MONDO:0014966, NEDD4L) from the primary literature: the original nine-patient report (PMID:27694961), later case reports (PMID:28515470, 30393983, 32117442, 34087865, 35577021, 36934385) and the ClinGen Definitive assertion. Built a causal chain from NEDD4L missense variant through dysregulated ubiquitin ligase activity and AKT-mTOR/TGF-beta deregulation to neuronal mispositioning and periventricular heterotopia, conforming two nodes to apical_neuroependyma_integrity_failure. Recorded the gain- versus loss-of-function controversy and the unexplained extra-neural malformations as discussions. No GeneReviews chapter exists. Deep research was requested from falcon and fell back to openscientist (no Edison key); report at research/Periventricular_Nodular_Heterotopia_7-deep-research-openscientist.md. Its validation block resolved 20/20 references with 2 unsupported quotes (PMID:31922594, PMID:28212375) and 2 off-topic ENaC papers; none of those four is cited here. preflight-dr returned WARN only because it counted the PVNH7 abbreviation as a gene; the report is about NEDD4L and OMIM 617201. The report's remaining extra citations (generic PVNH epilepsy cohort, FLNA, DEPDC5/NPRL3 mTORopathy models) are not PVNH7-specific and were not used. Validated with just validate (48/48 snippets verified), validate-terms, check-entity-refs, check-causal-targets, check-gene-activity-grounding and the other whole-repo gates. Only 1 of 13 phenotypes is causally connected; the others lack a sourced mechanism. Claim issue #16776.

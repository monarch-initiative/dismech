  summary: Link fasting and sertraline, fetching evidence that mentions fasting
  details: |
    Backfill for issue #8085. Fasting and catabolic stress is TRIGGERS with DIRECT into systemic metabolic decompensation, the classic precipitant pattern of a fatty-acid oxidation disorder in which the enzymatic block is constant and what decides when it declares itself is a demand for fatty-acid oxidation the block cannot meet. PMID:34245397 was fetched for this link because the sentence already attached to the exposure never mentions fasting, catabolic stress, or triggering at all; it describes treatment, stating that the disorder is treatable with riboflavin and nutrition focused on preventing decompensation. That pre-existing item was initially retained on the link at PARTIAL and is now NOT carried there at all: its own explanation stated it names neither fasting nor catabolic stress, and an item naming neither the exposure nor any triggering relation supports the node rather than the edge into it. It remains untouched on the exposure entry. This is the same claim-evidence mismatch class blocked on in PRs #8168, #8301 and #8389, and the note originally written here claimed it had been caught before submission; it had not. The reviewer of PR #8404 blocked on it, correctly, pointing out that the PR body treated the sentence as disqualifying and then attached it anyway. Sertraline exposure is TRIGGERS with DIRECT into the node named for it, an exact exposure-to-node fit, graded PARTIAL because the authors hedge twice, suggesting the drug may induce the acquired form in some patients. That item is PARTIAL here while the same sentence is SUPPORT on the node, which is deliberate and recorded in the explanation: the node asserts that such an acquired state exists, which the sentence does state, whereas the link asserts the drug produces the state in a patient who takes it, which a sentence hedged to may and to some patients supports only partly. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 105 of 105 verified.

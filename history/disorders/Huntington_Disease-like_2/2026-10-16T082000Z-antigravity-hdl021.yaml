  summary: Enriched Huntington disease-like 2 entry with classifications, structured prevalence, differential
    diagnoses, gene bindings and molecular functions, additional phenotypes, NfL biomarker with term and
    readouts, and reference entries
  details: Added Harrison's chapter (NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE) and mechanistic category
    (proteotoxic disease, with notes on repeat-RNA pathogenesis) classifications; added structured global
    (CASES_IN_LITERATURE, ULTRA_RARE) and South African (POINT_PREVALENCE, BAND_1_9_PER_100000, 0.25-2.1
    per 100,000 combined HD+HDL2 minimum point prevalence with referral-yield context) prevalence entries;
    added JPH3 and MBNL1 gene bindings, GO molecular_functions (GO:0003723 RNA binding, GO:0005246 calcium
    channel regulator activity), and CUG repeat RNA foci colocalization and calcium-flux evidence to pathophysiology;
    added Dysarthria and Weight loss phenotypes linked downstream of Frontostriatal neurodegeneration;
    added plasma Neurofilament Light Chain (NfL) biochemical biomarker bound to NCIT:C88043 with candidate
    surrogate readouts targeting Frontostriatal neurodegeneration; added six differential diagnoses (Huntington
    disease, SCA17/HDL4, HDL1, chorea-acanthocytosis, McLeod syndrome, PKAN); populated quote_role across
    evidence items; and added missing PMID entries to the references section.

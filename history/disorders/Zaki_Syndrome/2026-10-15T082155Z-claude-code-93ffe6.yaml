  details: |
    New entry for Zaki syndrome (MONDO:0859209, WLS). Source report: research/Zaki_Syndrome-deep-research-perplexity.md, generated with Perplexity sonar-deep-research at reasoning_effort=low, because two runs at the default effort were disconnected at about 300 seconds. Reference validation (added afterwards with just validate-research-reference) resolved 8/8 references. The report has no term-validation section: just validate-research-terms failed three times on a 5-second OLS read timeout for NCIt:C15308, so every CURIE in the entry was looked up independently and passed just validate-terms. preflight-dr returned WARN because the report cites OMIM 614407 only to say Zaki-Gleeson syndrome (DDX59) is a different disease, and because its heuristic lexicon counted CDC as a gene. Primary sources were fetched from a PubMed search: PMID:34587386, 37005218, 37106064, 40618129, 42641982, 36374649. The report's 13-patient frequency table comes from PMID:40618129, which is cached as abstract only, so no frequency bands were curated. Validated with just validate, count-verified-snippets (43/43), validate-terms, check-genereviews (NO_CHAPTER), check-causal-targets and check-snippet-grading.

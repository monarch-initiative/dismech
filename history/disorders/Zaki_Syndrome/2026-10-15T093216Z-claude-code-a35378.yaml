  summary: 'Review round 1: split treatment, more phenotypes, allele identity, WLS
    grounding'
  details: |
    Answers the review on PR 14308 and the CI gene-grounding failure. The bundled preclinical treatment was split into a prenatal Wnt agonist (agent unnamed in the cited abstract, so unbound) and 4-phenylbutyric acid (CHEBI:41500), which targets the WLS variant node because it restores mutant WLS levels. Added quotable phenotypes: wide mouth and broad distal phalanges of the fingers (PMID:40618129 genotype-phenotype sentences, directness INDIRECT), astigmatism (PMID:37005218), clinodactyly, congenital blindness and hyperphagia (single patient, PMID:42641982), and a coarse skeletal-anomaly term with coarse_binding_basis SOURCE_UNSPECIFIED. The review offered HP:0009882 for broad distal phalanges, but its label is Short distal phalanx of finger; HP:0009836 Broad distal phalanx of finger was used. Cupped ears and sparse scalp hair could not be quoted: the PMID:40618129 review is open access (PMC12229024) but just fetch-reference cached only its abstract, and the DOI fetch returned no text, so they are listed in notes as not curated and removed from the description. p.Tyr476Cys on NM_001002292 was confirmed to be p.Tyr478Cys on NM_024911.7: both RefSeq proteins, fetched from NCBI, carry the motif FFTGIY once, at 471-476 and 473-478 respectively. GO:0017147 Wnt-protein binding (DECREASED) was added to the WLS node to pass the new-gene grounding gate.

  summary: 'Create: Central Nervous System Germ Cell Tumor'
  details: |
    Created a scoped CNS germ cell tumor entry without promoting an established pathophysiology chain. Added three explicitly emerging hypotheses covering developmental-state divergence, NGGCT lineage-state persistence after therapy, and the in-vitro miR-214/BCL2L11 cisplatin-tolerance model. Recorded separate knowledge gaps for developmental origin and driver timing, refractory or relapsed NGGCT mechanisms, and response-qualified localized NGGCT radiation field and dose. Evidence is bounded by study design: cross-sectional molecular resemblance is not lineage tracing, paired tumor-blood profiles are not longitudinal resistance cohorts, a serial single-case recurrence study is not a resistance-locus study, the miR-214 result is not a clinical biomarker, and radiation observations remain conflicting and non-mechanistic. Work addresses GitHub issue 5966.

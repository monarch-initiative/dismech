  summary: 'Integrate assessed OpenScientist findings: MTOR pathway, GTS branch, radiation
    geography, tumor immune microenvironment'
  details: |
    Integration pass over the three assessed OpenScientist hypothesis reports for this disease. All three assessments already existed as openscientist-assessment-by-codex.yaml and none were rewritten. Worked only from their RETAINED and QUALIFIED claims.

    From common_ancestry_developmental_state_divergence (PARTIALLY_SUPPORTED), claim pathway-role: added PMID:26956871 (Ichimura et al., 124 CNS GCTs plus 65 testicular GCTs). Added MTOR (hgnc:3942) to the Recurrent AKT-mTOR Signaling Alterations node genes and a new genetic MTOR entry; two evidence items on that node (cohort-level MAPK/PI3K driver conclusion, HUMAN_CLINICAL; mutant-MTOR AKT and 4EBP1 phosphorylation plus soft-agar colony formation reversed by pp242, IN_VITRO); one evidence item on the hypothesis for the germinoma/NGGCT and CNS/testicular mutational-profile similarity. Explanations state that recurrence plus in-vitro activation does not order the lesion relative to developmental-state divergence or establish initiation.

    From nggct_failure_state_specific_persistence_and_evolution (PARTIALLY_SUPPORTED): claim gts-not-malignant-resistance added PMID:37140211 (98 pediatric GTS cases, 52 intracranial) to the hypothesis (intracranial GTS arises at the original site soon after treatment) and to the Resection of Persistent or Growing Teratomatous Disease treatment (incomplete resection one of only two independent risk factors), so that treatment no longer rests on a single case report. Claim radiation-geography added PMID:22420971 and PMID:28695992 to the hypothesis as the previously uncited treatment-exposure-and-geography branch, both SUPPORT with directness INDIRECT, with explanations recording the confounding: all four spinal relapses after local RT also had elevated baseline AFP, and the same series reported a null for failure pattern by irradiated volume. These were deliberately not added to controversy_localized_nggct_radiation_field, whose scope is explicitly response-qualified localized NGGCT at a fixed protocol dose. Claim immune-sanctuary added a new pathophysiology node, Immune Checkpoint-Expressing Tumor Immune Microenvironment, with PMID:39958339 (93 specimens from 90 patients) and PMID:31773448 (8 germinomas), cell types CL:0000815 and CL:0000625, and a description that refuses both the sanctuary causal claim and the immune-cold characterization. The node was linked into gap_nggct_refractory_and_relapse_mechanism attaches_to, and that rationale now lists the microenvironment among competing explanations.

    From mir214_bcl2l11_cisplatin_response_candidate (WEAKLY_SUPPORTED_UNRESOLVED): claim direct-target-edge added PMID:24465927 (miR-214 luciferase-confirmed direct targeting of BIM in nasopharyngeal carcinoma) as SUPPORT with directness INDIRECT and an explanation that binding is unconfirmed in NGGCT. Claim noxa-competition added PMID:23302226 and PMID:22718761 with supports NO_EVIDENCE, recording the better-supported OCT4-NOXA competitor as a confounder to control for rather than a refutation, consistent with the assessment rejecting the report's refutation claim.

    Deliberately not integrated: claim clinical-cns-evidence, the RETAINED absence of endogenous miR-214-3p elevation in resistant CNS NGGCT, is already curated in the hypothesis notes and in gap_nggct_refractory_and_relapse_mechanism, and its uncited PMIDs 41998312 and 33823933 are extracranial testicular methylation and liquid-biopsy studies that cannot evidence an intracranial absence. PMID:37891379 was left out as redundant with the two stronger NOXA functional papers. No status value was changed: all three hypotheses stay EMERGING, which is what the reports themselves recommend.

    Validation: count-verified-snippets 84/84 (up from 70/70), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-snippet-grading, check-title-snippets, check-snippet-length and check-qualifier-terms all clean for this file.

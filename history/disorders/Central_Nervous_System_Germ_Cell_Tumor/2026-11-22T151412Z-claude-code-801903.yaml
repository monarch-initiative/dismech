  summary: Add pineal-site subtype (MONDO:0002073) and Parinaud syndrome
  details: |
    Curation of malignant pineal area germ cell neoplasm (MONDO:0002073) from claim issue #8892. Lump/split decision: SUBTYPE. MONDO places the term directly under central nervous system germ cell tumor (MONDO:0003000), and its children are pineal-region germinoma, dysgerminoma, yolk sac tumor, choriocarcinoma and immature teratoma, so it is a topographic stratum that cuts across the histologic subtypes already on this entry. Under the cancer granularity ladder (design decisions 3a) the histologic entity is the default entry level; the pineal site has no pathophysiology node that is untrue of other CNS GCT sites beyond the location-dependent mass effect already modelled here, and first-line therapy is chosen by histology and marker status rather than by site, so it fails the promotion test. Added a has_subtypes row 'Pineal GCT' bound to MONDO:0002073, with registry evidence for the >90% male predominance and germinoma majority (PMID:18287340) and a review statement placing the male excess in pineal primaries (PMID:36521378). Added a Parinaud Syndrome phenotype (HP:0025331 Upgaze palsy) stratified to the pineal subtype, and a downstream edge to it from the existing mass-effect node. Started from the Perplexity deep-research report research/Malignant_Pineal_Area_Germ_Cell_Neoplasm-deep-research-perplexity.md; its mislabelled NCIT treatment CURIEs were not used. Validated with just validate, count-verified-snippets (90/90), validate-terms and the whole-repo gates.

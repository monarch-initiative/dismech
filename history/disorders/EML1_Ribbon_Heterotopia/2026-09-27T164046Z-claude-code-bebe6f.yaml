  summary: 'Genetics pass: re-anchor disease_term to the EML1 MONDO class, bind EML1,
    wire nine phenotypes'
  details: |
    d2g genetics pass for the two rows of dismech#12274 under this parent
    (MONDO:0010873 band heterotopia of brain / EML1 and MONDO:0010239 lissencephaly
    type 1 due to doublecortin gene mutation / DCX).

    Anchor finding, and the substantive change here. The entry was bound to
    MONDO:0020491 subcortical band heterotopia, a class whose other child is the DCX
    disease - which is why a DCX row reached a gene-scoped EML1 entry's checklist.
    The entry's own description already distinguished the EML1 progenitor mechanism
    from the DCX and PAFAH1B1 neuronal-migration mechanism, so the binding asserted
    identity with a class the entry says it is not. MONDO has an EML1-specific class:
    MONDO:0010873 carries hgnc:3330 in its logical axioms, xrefs OMIM:600348 and
    MedGen C4284594, and MedGen's definition of that concept is sourced to Kielar et
    al. 2014 - this entry's own founding EML1 reference, PMID:24859200 - and to
    Shaheen et al. 2017. `disease_term` was rebound to it, and MONDO:0020491 recorded
    as `skos:broadMatch`, which is a cross-reference and does not retire the broader
    concept from the queue.

    Rows. The rebinding curates MONDO:0010873. MONDO:0010239 is declined
    structurally: it is already curated as the X-linked/DCX `has_subtypes` row of
    kb/disorders/Lissencephaly_Spectrum_Disorders.yaml, which is the correct home,
    and it appeared on this checklist only through the over-broad anchor.

    Wiring. Gene-to-mechanism coverage went 0/1 to 1/1 by binding EML1 as a `genes:`
    descriptor on the EML1 Loss of Function and Microtubule Dysregulation node.
    Phenotype causal inlink went 5/14 to 14/14: eight imaging and neurological
    phenotypes wired from the malformation node, each with the cohort snippet from
    PMID:31710781 that already supported the phenotype, plus Macrocephaly as a
    `sequelae` of Megalencephaly.

    Validation on the committed tree: `just validate` clean, `just validate-terms`
    clean, and the file's share of a 643/643 snippet verification across the ten
    files this PR touches. No new references were fetched for this entry.

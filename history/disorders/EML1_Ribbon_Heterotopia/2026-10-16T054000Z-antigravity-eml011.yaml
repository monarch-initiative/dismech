  summary: Review and expand EML1_Ribbon_Heterotopia entry with synonyms, classifications, prevalence,
    progression, diagnosis, differential diagnosis, and 100% causal phenotype connectivity
  details: Added disorder synonyms (BHSC, autosomal recessive band heterotopia, EML1-associated brain
    overgrowth syndrome with ribbon-like heterotopia), Harrison's chapter classifications (NEUROLOGIC,
    GENETICS_ENVIRONMENT_DISEASE), ultra-rare cohort prevalence (CASES_IN_LITERATURE / ULTRA_RARE; 8 individuals
    from 5 families), prenatal-to-neonatal onset and postnatal ribbon-thickening progression, prenatal/postnatal
    brain MRI and EML1 molecular genetic diagnostic criteria, Chudley-McCullough syndrome differential
    diagnosis, and connected all 14 phenotypes into the causal pathophysiology graph with supporting evidence
    (including routing Hydrocephalus from the centrosome/cilium radial glia node).

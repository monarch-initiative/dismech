  summary: 'Review round 1: add surgical/rehabilitative treatments, biochemical markers,
    ICD mappings'
  details: |
    Round 1 of review on PR #11341. The reviewer returned REQUEST_CHANGES with two
    IMPORTANT content gaps and seven suggestions, and no correctness defects. Both
    blocking findings are closed and six of the seven suggestions are taken, bundled
    into one push because main runs dismiss_stale_reviews.

    Finding 1 - no surgical or rehabilitative treatment. The entry had eight
    treatments, all pharmacological or public-health, for a disease whose defining
    adult burden is fixed joint deformity. Two records added from PMID:31335683, which
    was already cached and cited elsewhere in the entry:
    - `Arthrodesis and Reconstructive Surgery of the Damaged Joint`
      (`therapeutic_modality: SURGERY`, `NCIT:C16186`), targeting
      `Secondary Degenerative Arthropathy` with `treatment_effect: BYPASSES` - fusing
      the joint removes the painful articulation rather than acting on the cartilage
      degeneration. Carries the procedure and outcome as SUPPORT and the network
      meta-analysis' "efficacy of surgical ... treatments has yet to be established"
      sentence as REFUTE, so the record does not read as stronger than a case report.
    - `Conservative Orthotic Management and Activity Restriction`
      (`therapeutic_modality: DEVICE`, bound to the NCIT clinical action
      `NCIT:C15315` Rehabilitation rather than a device term, per the CLAUDE.md rule
      that TreatmentTerm is rooted at Clinical Intervention or Procedure). Its primary
      evidence is a REFUTE: in the curated case, orthosis and activity restriction did
      not relieve the pain, which is why surgery followed.

    Finding 2 - no `biochemical:` section. Five markers added, all with
    `BiomarkerReadout` links into the pathograph: serum selenium, hair selenium,
    urinary iodine, serum thyrotropin, serum thyroxine-binding globulin
    (`NCIT:C825`, `NCIT:C594`, `NCIT:C2280`, `NCIT:C106005`). The load-bearing one is
    serum selenium, which carries a REFUTE against its own diagnostic readout: in
    PMID:9770558's multivariate analysis a low serum selenium was NOT associated with
    the disease while the iodine and thyroid markers were. That negative is the reason
    this entry curates an iodine arm at all, and it was previously only prose inside an
    evidence explanation. Hair selenium is recorded separately from serum selenium
    because it is a different specimen with a different time constant and is what
    current Chinese surveillance uses (PMID:41272335). Thyroxine-binding globulin is
    `CORRELATES_WITH` rather than `READOUT_OF`, because the entry curates no account of
    what it measures here.

    Suggestions taken:
    - #3 The two GO bindings broader than their claim (`GO:0002062` chondrocyte
      differentiation for the terminal step; `GO:0022900` electron transport chain for
      the mitochondrial respiratory chain) now each carry a node-level `notes` line
      saying so, matching how the entry annotates its other granularity compromises.
      Note the `notes` had to go on the pathophysiology node, not the descriptor -
      `Descriptor` has no `notes` slot and schema validation rejects it there.
    - #4 All four `datasets:` records now carry evidence quoting their committed GEO
      summaries. `geo:GSE311894`'s connecting sentence ("may contribute to elucidating
      the molecular pathogenesis of osteoarthropathy such as Kashin-Beck disease") is
      graded NO_EVIDENCE, which is the structural form of the caveat its `notes`
      already carried in prose.
    - #5 All three histopathology `finding_term`s now record the NCIT search that was
      run and why nothing was bound: the closest term under the Morphologic Finding
      branch is `NCIT:C36184` (Necrosis), which names one component of a three-part
      post-composition and discards the zone and the compensatory clustering.
    - #6 `mappings:` added. `icd11f:211396970` (Kashin-Beck disease) as
      `skos:exactMatch`, sourced to MONDO's own assertion. `ICD10CM:M12.1` as a
      curator-asserted `skos:exactMatch`, with the justification recording that MONDO
      has no ICD-10-CM xref for this concept and that the ICD-10-CM label is the older
      "Kaschin-Beck" transliteration, copied exactly.
    - #8 The DIO2 record's first evidence explanation now says outright that the
      meta-analysis' wording says "susceptibility" for all three loci together while
      all three of its pooled DIO2 estimates run below 1, and that this record follows
      the estimates.
    - #9 `Grain Replacement` now records why it is BEHAVIORAL where
      `Drinking Water Improvement` is OTHER: the enum's BEHAVIORAL description covers
      dietary intervention and what the household eats changes, whereas replacing a
      village water supply changes nothing about what anyone does.

    Suggestion #7 (Chinese national grading I/II/III as `stages:`) is declined, with
    the reasoning recorded in `notes` rather than left implicit: `progression:` holds a
    different axis (phase, not severity tier), `diagnosis:` holds the radiographic
    grading schemes, and the grading's definitional content sits in WS/T 207-2010,
    whose text was not obtained - so a `stages:` block would be three names with no
    criteria behind them.

    Entry grew from 153 to 178 evidence items (164 SUPPORT, 12 REFUTE, 2 NO_EVIDENCE),
    10 treatments, 5 biochemical markers. No new references were fetched; every
    addition uses a cache already committed in this changeset.

  details: |
    Round 3 of review on PR #11341. The reviewer APPROVED again and re-verified the
    round-2 ontology lookups independently rather than taking them on trust - it
    confirmed NCIT:C52007, NCIT:C86054 and the absence of any specimen-qualified
    selenium term, and confirmed that the offline qualifier gate had explicitly
    reported NCIT:C86054 as uncached and therefore unchecked. Two non-blocking
    suggestions were left, and both are taken here.

    Suggestion 1 - reference-range `population` wording. The reviewer was right that
    "Reference interval as stated by the cited study, which measured children aged 5 to
    15 years in rural Tibet" invites reading a generic assay normal as a
    population-specific interval, even though the sentence hedges. The interval quoted
    by PMID:9770558 is the assay's normal range that the study measured its subjects
    against; it was not derived from or stratified to the Tibetan cohort. Both
    `population` values are now the terse stratifier the KB convention uses - "general
    assay reference interval quoted by the source; not derived from or stratified to
    the study cohort" - and both range `notes` say explicitly that the interval must
    not be read as Tibetan-children-specific. This was not a false claim before, but it
    was a sentence a reader could take more from than it says, which is the defect
    class this entry has been reviewed for throughout.

    Suggestion 2 - `treatments[].target_mechanisms[].evidence` was 0/10. Now 3/10,
    and the seven left empty are a decision recorded in `notes` rather than an
    omission. Evidence was added where a result exists about the *node* rather than
    about the disease: the arthrodesis link (the procedure credited with a stable
    plantigrade foot and preserved structural integrity, which is the arthropathy being
    bypassed rather than reversed), the orthotic link (the pain and restricted range of
    motion the orthosis was applied to), and iodine replacement (height-for-age
    recovered in every iodine arm and not in unsupplemented controls). The four
    public-health interventions and the adult symptomatic drugs are supported by pooled
    incidence odds ratios and pain effect sizes respectively - both measure outcomes
    rather than the node the link points at, so reusing those snippets on the links
    would make one sentence do double duty for a claim it does not make. That reasoning
    is now in `notes` so the gap reads as deliberate.

    180 to 183 evidence items. No new references fetched; all three added items reuse
    caches already committed. Gates re-run in full.

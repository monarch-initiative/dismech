  summary: 'Create: Kashin-Beck Disease'
  details: |
    New disorder entry for Kashin-Beck disease (MONDO:0005610), an endemic
    environmental osteochondropathy of children in the Siberia-China-Tibet belt.
    Curated as an environmental-exposure entry: the clinical picture is settled
    and the causal agent is not, so the entry curates the compound-etiology
    reading as CANONICAL and four single-factor hypotheses (selenium deficiency,
    iodine deficiency, T-2 mycotoxin, fulvic acid in drinking water) as
    ALTERNATIVE, with every group tagging at least one causal edge.

    Content. 16 pathophysiology nodes running from four initiating exposure
    nodes through selenoenzyme loss, Wnt derepression, chondrocyte oxidative
    stress, mitochondrial dysfunction, Smad2/Smad3 depletion and ferroptosis to
    mixed-mode chondrocyte death, then splitting into growth-plate ossification
    failure and articular matrix degradation. 7 phenotypes, 3 histopathology
    records, 4 environmental exposures (T-2 toxin, low selenium, low iodine, and
    fluoride as an EXACERBATES modifier acting through CES1-mediated T-2
    detoxification), 5 genetic records, 3 diagnosis records, 2 differential
    diagnoses, 8 treatments, 2 prevalence records, a clinical_burden assessment,
    3 animal models with typed divergences, 3 discussions, 4 GEO datasets.

    Deep research. Provider was claude_code (research/Kashin-Beck_Disease-deep-
    research-claude_code.md). The report needed heavy discounting - its own
    validation recorded 4 of 6 checked quotes as absent from the papers they
    were attributed to, 3 unresolved references and 9 mislabelled ontology
    terms. None of the 9 mislabelled CURIEs is bound in the entry. The report
    was used for structure and leads; every snippet was taken from a reference
    cache fetched with `just fetch-reference` and read directly. Where a snippet
    also appears in the report as quoted text, the entry says so in `notes`
    rather than claiming independent discovery.

    Pre-PR red team. An adversarial review of the first draft returned
    REQUEST_CHANGES with 26 findings, all of the same shape: prose asserting
    more than the file own evidence. All were addressed before this record.
    The substantive ones: both prevalence records were misclassified (an
    incidence recorded as POINT_PREVALENCE, and a band three orders of magnitude
    out - BELOW_1_IN_1000000 for 180 per 100,000); the claim that susceptibility
    maps to selenoprotein genes rather than cartilage structural genes was
    retracted in three places and replaced with an ADAM12 record, since the
    meta-analysis it rested on searched only on the term "selenoprotein" and a
    cached GWAS reports ADAM12 at p = 9.25e-9; the Brachydactyly record was
    re-sourced (its only evidence had been a methods sentence that does not
    mention brachydactyly); HP:0005920 was rebound to HP:0003037; the bundled
    initiating node was split into separate selenium and T-2 nodes, and the
    bundled growth-plate node into ossification failure and matrix degradation;
    three CANONICAL hypotheses were reduced to one; the etiology discussion was
    re-kinded KNOWLEDGE_GAP -> CONTROVERSY; and a false `notes` sentence saying
    the omitted topics "trace to sources this session did not fetch and verify"
    was removed - those sources had been fetched.

    Reference consumption. 49 fetched-but-unused caches were resolved by
    consuming 25 of them and pruning the rest. Newly consumed: the treatment
    network meta-analysis (PMID:31376086, which closed a gap where the entry
    curated no adult treatment at all), the Tibetan iodine study
    (PMID:9770558) and supplementation trial (PMID:12816783), the fulvic-acid
    mechanism (PMID:10090708), hand X-ray screening signs (PMID:29459762), the
    ADAM12 GWAS (PMID:27545300), the primary rat-model papers (PMID:22258458,
    PMID:22294316, PMID:23701828), TSG-6 (PMID:36468025), GPx6 (PMID:42384133),
    mitochondrial function (PMID:20650322), the 2001 histology (PMID:11482529),
    the causality review (PMID:11482536), and the burden, quality-of-life,
    depression and sarcopenia literature. Only caches this entry cites are
    committed.

    Negative results are first-class here. 9 REFUTE items and 1 NO_EVIDENCE
    item are curated alongside the positive evidence, including the rat model
    explicitly failing to reproduce the human growth-plate lesion (recorded as
    a FAILS_TO_RECAPITULATE model link with an INVALIDATING SPECIES_MISMATCH
    divergence), the randomised trial finding selenium useless for established
    disease once iodine was corrected, and the network meta-analysis reporting
    vitamin C and aspirin as both effective and not established.

    Validation. `just validate-disorders` passes with all snippets verified
    against committed caches; `validate-terms`, `check-duplicate-keys`,
    `check-enum-values`, `check-entity-refs`, `check-causal-targets`,
    `check-qualifier-terms`, `check-folded-hyphens`, `check-snippet-length`,
    `check-title-snippets`, `check-snippet-grading`, `check-empty-snippets`,
    `check-reference-titles` and `check-environmental-evidence` all pass.
    Pathograph audited: 4 roots, no orphans, no unresolved bare-name targets.

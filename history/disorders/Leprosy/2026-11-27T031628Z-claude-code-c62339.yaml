  details: |
    Addressed CHANGES_REQUESTED review on PR #19101. (1) Added the core LL mechanism upstream of the foamy-macrophage node: a type I IFN/IL-10 suppression node (PMID:23449998), an IL-10-driven phagocytic-vs-antimicrobial macrophage programme node (PMID:19837374), and an oxidized-phospholipid foam-cell node (PMID:18636118), with GO bindings (type I interferon signaling, IL-10 production, phagocytosis, antimicrobial peptide response, foam-cell differentiation) and edges carrying evidence. (2) Added a diagnosis section: slit-skin smear/bacterial index (positive in LL, negative in paucibacillary), skin biopsy, lepromin (Mitsuda) test (anergic in LL per PMID:11875763), and anti-PGL-I serology, quoted from PMID:37809252. (3) Scoped the two Lucio phenomenon nodes and the Purpura phenotype to LL, mentioning diffuse LL. Also: added M. lepromatosis as a second infectious_agent (NCBITaxon:480418, PMID:19019760/39662019); re-sourced the nasal-infiltration edge to a nasal-involvement quote; marked the testicular-infiltration edge directness INDIRECT; added HLA-B*13:01 dapsone-hypersensitivity pharmacogenomic note to MDT (PMID:24152261); added a WHO rifampicin-resistant regimen treatment (PMID:29496597, PMID:30207440); added Lagophthalmos ocular phenotype (PMID:21857721, PMID:28164949).

  summary: List the recognised phases in progression (#10115, R21)
  details: |
    Added a six-phase progression block: Incubation (incubation_years 2-7; range a few weeks to 20 years; PMID:37809252), Indeterminate leprosy (about 75 percent self-heal, the rest become determinate; reactions do not occur; PMID:37809252), Established disease across the Ridley-Jopling spectrum (recorded as one phase because the spectrum is a classification of established disease rather than a sequence, and the entry declares no has_subtypes to duplicate; PMID:37809252, PMID:28763601), Type 1 (reversal) reaction (PMID:42157916 for timing relative to MDT, PMID:37809252 for the definition), Type 2 reaction / erythema nodosum leprosum (type III hypersensitivity definition from PMID:37809252; acute versus chronic ENL outcome from the retrospective series PMID:33035210), and Post-treatment / released from treatment (treatment failure typically within 9 months of completing MDT versus later relapse, and the absence of objective cure criteria; DOI:10.1186/s12879-024-09937-2, PMID:42157916, PMID:28763601). The PMID:42157916 type 1 and type 2 definitions were deliberately not quoted in this block because the entry already quotes those sentences elsewhere with evidence_source HUMAN_CLINICAL and check-snippet-grading forbids grading one sentence two ways; the same claims are carried by PMID:37809252 instead. No new references. Validation: just validate passed; count-verified-snippets all verified; check-snippet-grading, check-title-snippets, check-snippet-length, check-duplicate-keys, check-enum-values, check-entity-refs and check-causal-targets clean; check-granularity no longer reports NO_PROGRESSION.

  summary: 'Edit: Leprosy Ridley-Jopling subtypes (lepromatous leprosy lumped)'
  details: |
    Claim #19094 asked for lepromatous leprosy (MONDO:0005127). The lump/split decision under design decisions 3e was to lump: LL did not differ from its nearest sibling, borderline lepromatous leprosy, on two promotion axes. Systemic involvement is graded toward the lepromatous pole, ENL is confined to BL and LL together (PMID:24098819), and 12-month MB-MDT applies to all multibacillary disease, so it separates MB from PB rather than LL from BL. Borderline patients also move along the spectrum (PMID:37809252). Added seven has_subtypes rows: Indeterminate (MONDO:0001391), TT (MONDO:0005126), Borderline (MONDO:0005125) with unbound children BT, BB and BL, and LL (MONDO:0005127), each with cited descriptions. Added four LL-scoped pathophysiology nodes (unrestricted bacillary multiplication in foamy macrophages, diffuse facial dermal infiltration, nasal mucosal infiltration, testicular infiltration) with edge-level evidence, an incoming edge from the host T cell spectrum node, and an outgoing edge to the type 2 reaction node. Added 12 LL-scoped phenotypes (leonine facies, madarosis, nasal congestion, epistaxis, saddle nose, glove-and-stocking sensory loss, and six testicular-dysfunction phenotypes with frequencies from PMID:33344347), two subtype-scoped histopathology findings (LL foamy macrophages and globi, TT non-caseating granulomas), and scoped ENL and the type 2 reaction node to BL and LL. A Deliberately lumped review_notes paragraph records the decision. Also removed a pre-existing references[] finding for DOI:10.47276/lr.95.2.2024018 that quoted only the paper title and failed reference validation on main. Deleted the lepromatous, tuberculoid, borderline and indeterminate stubs, now covered by has_subtypes terms. Deep research: research/Lepromatous_Leprosy-deep-research-claude_code.md (claude_code), used as leads only; every quote was re-read in the cached reference.

  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 25 (NDUFB3)'
  details: |
    New entry for MONDO:0032629, the recessive complex I deficiency caused by biallelic NDUFB3 variants, created from its stub (stub deleted). NDUFB3 is modelled as a structural accessory subunit of membrane-arm subcomplex I-beta (GO:0005198, DECREASED; PARTIAL_LOSS_OF_FUNCTION because patient muscle keeps some assembled complex I). The chain runs to impaired complex I assembly (GO:0032981), isolated complex I deficiency (GO:0008137, GO:0006120), illness-triggered metabolic decompensation, compensatory mitochondrial proliferation in muscle, and growth restriction (marked HYPOTHETICAL: the short-stature mechanism is not established, PMID:40009295). Phenotypes come mainly from the 2016 cohort of 10 patients from 8 families homozygous for the recurrent p.Trp22Arg variant (PMID:27091925, full text and table cached), plus the first two patients (PMID:22277967 with complementation, PMID:22499348) and an adult found through liver disease (PMID:31000363). Frequencies are set only where the cohort states them (all short, majority IUGR, shared facial features, 2 of 10 with transient hypertrophic cardiomyopathy). Facial features and Wolff-Parkinson-White syndrome are deliberately left without a mechanism edge. relationship_type CAUSATIVE: ClinGen rates NDUFB3 Definitive for mitochondrial disease (lumped MONDO:0044970), recorded in notes only. Treatments: supportive care in crises and growth hormone with variable response. Validated: linkml-validate, term validation, reference validation (44/44 snippets, 0 issues), entity-ref, causal-target, name-collision, gene-validity, enum, duplicate-key, coarse-phenotype, folded-hyphen and gene-term checks.

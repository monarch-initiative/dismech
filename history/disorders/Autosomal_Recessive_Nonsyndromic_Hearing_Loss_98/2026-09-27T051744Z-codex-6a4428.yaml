  summary: Review disputed TSPEAR hearing-loss association, clinical cases and model evidence
  details: |
    Reviewed the full disorder YAML, existing CREATE history, ClinGen assertion, Falcon research narrative and citation list. DFNB98 is a historical Mendelian candidate association, within the sweep excluding infectious and environmental disorders. No earlier REVIEW or overlapping open PR was found at selection. The branch was rebased before work; a fresh fetch still showed no commits behind main.

    Source consumption: read the founding PMID:22678063 abstract, full ClinGen October 2024 assertion, and full PMID:39720278 Chinese case. Read clinical results, relevant methods, discussion and variant descriptions in PMID:34042254; its cache lacked the table bodies, so source-specific clinical details came from the narrative. Read the TSPEAR clinical/variant tables, segregation results, methods and discussion in PMID:34795337. Read the full clinical narrative, methods, table and discussion of PMID:41486137. Read PMID:37561809 sequencing methods, results and Table 4, including the homozygous c.1728del male with profound hearing loss. The deletion-only table representation is not silently expanded to the founding combined allele.

    Recovered full PDFs for PMID:37009414 through the UCL repository and PMID:41195743 through the Florence repository using just fetch-reference. Read their scientific methods, results and discussions. Visually checked the latter's clinical and variant tables on PDF pages 4 and 6. Its abstract's no-hearing-loss statement conceals an important limitation: only 4/11 underwent audiometry; the others had no clinical hearing concerns. P9, homozygous p.Glu624Ter, had no audiogram reported. The cohort is dental-ascertained and includes uncertain variant interpretations, so it cannot establish universal absence of auditory risk. The 2023 study combines 11 new cases with earlier dental cases and does not supply a population penetrance denominator. Its carrier calculation includes predicted deleterious missense alleles, not only truncations. Generated PDF caches use URL titles; the evidence explanations identify the papers, while citation-title fields match the generated cache.

    Read PMID:27736875's clinical observations, segregation, Notch reporter, skin-explant methods and results. The K14-Cre background creates the H2B-GFP reporter; Tspear knockdown occurs by siRNA ex vivo, not through conditional Tspear gene deletion. Normal audiometry is explicitly reported for families A and C, and the deletion-bearing family A provides contrary evidence to obligatory deafness. Read the relevant clinical/molecular methods, p.Ser223Leu results, genotype table, classification table and discussion of PMID:35741818. Its 2022 heterozygous p.Ser223Leu dental case predates the later paper's claim of a novel allele; a second allele was not found. Neither report establishes hearing-loss pathogenicity from this missense change.

    Full text for the founding 2012 study was not recovered: PMID remained abstract-only, DOI lacked text, identified HAL and publisher PDF routes returned 403, and the indexed CiteSeer copy returned 404. The 2025 mouse article PMID:40716589 also remained abstract-only; DOI retrieval had no text and the publisher fetch returned 403. Model claims are limited to the abstract and explicitly retain uncertainty about test ages, residual protein and subtle deficits. PMID:26969326 was fetched, but its main-text cache did not provide the detailed TSPEAR family phenotype; that family is cited through the later Bowles account with INDIRECT directness. PMID:30733538 was fetched but the TSPEAR result was not found in the scientific body; no new allele-level claim from that report was added beyond the existing ClinGen synthesis. Failed or unused retrievals are excluded from the PR.

    Clinical corrections: removed FREQUENT/OCCASIONAL labels derived from mixed referral cohorts or single cases. Broadened the hearing descriptor beyond uniformly congenital profound loss; added the Chinese child's serial ABR worsening and absent otoacoustic emissions. Added reported speech difficulties and enlarged vestibular aqueduct with case-level attribution. Preserved ankyloglossia without importing the general dental/ectodermal phenotype into DFNB98. Clarified competing genetic findings as candidates with differing classification strength, not uniformly proven alternative diagnoses.

    Genetics and mechanism: retained the Disputed relationship and four-node hypothesis. Restricted the trigger to the founding frameshift and its measured secretion effect; did not classify unassayed missense alleles as loss of function. Added ten representative variant records, including two Chinese VUS, non-segregating p.Glu624Ter, p.Ser223Leu with the novelty/classification caveat, competing-gene cases, and the synonymous-plus-frameshift family. Added the founding transfection model and the comparative keratinocyte/explant work. Corrected mouse readouts to auditory function rather than protein localization and distinguished skin Notch from inner-ear Wnt4 findings. Rewrote discussions so proposed experiments inform the evidence rather than automatically change ClinGen or retire the ontology entity.

    Care and diagnostics: used the cached Genetic Hearing Loss Overview GeneReviews chapter for amplification, implant evaluation, communication support, molecular testing and conditional recessive counseling. Added the directly reported hearing-aid response in the Chinese child as parental observation without an efficacy rate. No TSPEAR-specific therapy is asserted. ClinicalTrials.gov API queries for TSPEAR and DFNB98 each returned zero studies. The offline GeneReviews check found no disease-specific chapter before adding the tagged general overview. No disease-specific dataset accession was identified for addition; dental-model datasets are not treated as auditory omics evidence.

    Completeness assessment: phenotypes and clinical case distinctions adequate; no established disease subtype; four explicitly provisional mechanism nodes with measured and inferred steps separated; genetics and representative variants expanded; general care and diagnostics supported; primary/cached full text consumed where accessible. Remaining scientific gaps include resolution of human gene validity, variant-specific function, systematic audiometry, competing genomic causes and genotype-specific treatment outcomes. Inaccessible primary text is recorded as a source limitation, not a negative biological result.

    Independent review approved the content and suggested optional citation, graph, history and category refinements. Changed ankyloglossia to Oral and added the PR link and known model family. Retained generated URL citations because PMID fetches did not recover those full texts; no generated cache was manually rewritten. Did not add proposed causal edges from a broad cochlear dysfunction node to every diagnostic result or progression: the measured case features do not resolve their TSPEAR-specific cellular intermediates or natural history. Speech difficulty also has a documented tongue-restriction confound in one case, so no unqualified hearing-loss sequela link was added.

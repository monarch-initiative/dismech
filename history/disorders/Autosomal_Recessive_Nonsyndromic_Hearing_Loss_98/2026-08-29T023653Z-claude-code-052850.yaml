  summary: 'Create: Autosomal Recessive Nonsyndromic Hearing Loss 98 (DFNB98, TSPEAR)
    as a contested entity'
  details: |
    De novo curation of DFNB98 from MONDO:0013929. entry_type DISEASE, but curated explicitly as a disease whose causal claim is contested rather than as one with a settled mechanism. The ClinGen Hearing Loss GCEP classifies TSPEAR-nonsyndromic hearing loss as Disputed and reaffirmed that on SOP v11 re-review in 2024 after seeing the newer case reports; that is recorded as an external_assertion citing a newly generated CGGV cache file, and the gene carries relationship_type DISPUTED rather than CAUSATIVE. The proposed hair-bundle mechanism is grouped under a named mechanistic_hypotheses entry with status ALTERNATIVE and every causal edge opts into it, so no step of the chain is asserted as canonical. Refuting evidence sits in the same sections as supporting evidence: the 2021 cohort finding that all three deaf biallelic-TSPEAR individuals carried competing TMPRSS3, GJB2 or GJB6 variants; the non-segregating nonsense allele from the ClinGen review; and a TSPEAR variant classified VUS in a mid-frequency SNHL series. The 2025 CRISPR mouse is curated as FAILS_TO_RECAPITULATE with three readouts, two UNCHANGED and one ALTERED, and a limitation recording that the mouse frameshift is not the human founding allele. Named entity separation from ectodermal dysplasia 14: nothing dental or ectodermal is curated as a DFNB98 phenotype; ECTD14 appears only in differential_diagnoses, where the 1-in-140 carrier rate is quoted with attribution so it cannot be mistaken for a DFNB98 figure. The one genuinely ambiguous case, a 2024 Chinese proband with hearing loss plus oral findings, is recorded with its oral findings rather than assigned to one entity. A claim reported at second hand from a 2023 delineation study was deliberately not cited because only its abstract is retrievable and the abstract does not contain it. Validated: just validate exit 0, just validate-terms exit 0, validate-disorders exit 0 with 35/35 snippets verified.

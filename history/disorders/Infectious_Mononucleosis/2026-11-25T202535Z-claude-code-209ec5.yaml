  summary: 'Create: Infectious Mononucleosis'
  details: |
    De novo curation of MONDO:0005810 (infectious mononucleosis), the symptomatic form of primary Epstein-Barr virus (EBV, NCBITaxon:10376) infection. claude_code deep research (22/22 refs verified, 0% confabulation). Mechanism: salivary EBV -> entry into oropharyngeal B lymphocytes via CR2/CD21 (PMID:6087328) -> B-cell proliferation and latency -> massive oligoclonal EBV-specific CD8+ (and NK) expansion, not CD4 (PMID:23100562), the atypical Downey lymphocytes (PMID:26424648) -> lymphoreticular infiltration and systemic immune activation -> pharyngitis, posterior cervical lymphadenopathy, fever, fatigue, splenomegaly (with splenic-rupture sequela), subclinical hepatitis. SH2D1A (hgnc:10820) recorded as a SUSCEPTIBILITY gene for severe/fatal IM in XLP1 (PMID:9771704). MS and Hodgkin lymphoma noted as sequelae in notes (PMID:35025605, 32-fold MS risk). Standalone entry (no module conformance). 27/27 snippets verified; validate-disorders, terms, causal-targets, name-collisions, coarse, granularity(strict), folded-hyphens, enum-values all pass.

  details: |
    Created a pneumonia caused by Pseudomonas aeruginosa infection entry from the OpenScientist fallback report, binding MONDO:0037398 to NCBITaxon:287, curating hospital lower-airway acquisition and ventilator instrumentation, airway flagellin-TLR5 signaling, T3SS cytotoxicity, NLRC4/IL-1 beta release, mucoid alginate biofilm immune evasion, neutrophilic alveolar-capillary injury, pneumonia-associated fever, cough, dyspnea, leukocytosis, CRP elevation, ARDS, sepsis, lower-respiratory culture with antimicrobial susceptibility testing, antipseudomonal antibiotic therapy including MDR inhaled adjuncts, and a rat acute-lung-injury model while omitting incorrect report HPO bindings and keeping CFTR as a host-context susceptibility factor rather than as a causal gene.

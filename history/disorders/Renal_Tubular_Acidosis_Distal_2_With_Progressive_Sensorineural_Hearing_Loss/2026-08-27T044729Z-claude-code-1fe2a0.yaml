  summary: 'Review response: GeneReviews, diagnosis, phenotypes, ADV7103, evidence
    grading'
  details: |
    Response to the first review round. The CREATE session's notes claimed no GeneReviews chapter covers ATP6V1B1-related dRTA. That was wrong: PMID:31600044, Hereditary Distal Renal Tubular Acidosis, exists, and although it is gene-panel scoped across ATP6V0A4, ATP6V1B1, SLC4A1, FOXI1 and WDR72 it names ATP6V1B1 explicitly, assigns sensorineural hearing loss to it, and singles out p.Arg394 as the dominant form. It is now tagged GeneReviews and mined across all four sections its abstract carries, and the notes record that the earlier claim was mistaken. Regraded three PMID:28934385 items from HUMAN_CLINICAL to OTHER: the paper is mouse genetics and the quoted sentences are introduction background, so neither the original grading nor MODEL_ORGANISM fits. Two treatments were marked deliberately unevidenced while PMID:23923981, already cited six times in the entry, states that early treatment corrects the biochemical abnormalities and helps foster normal growth but deafness appears not to be prevented, which is the strongest available support for the entry's own central two-arm claim; both now carry it. Added ADV7103 as a treatment, a diagnosis section built on the quotable criteria sentence, and the phenotypes above threshold that were missing: hypercalciuria (HP:0002150), nephrolithiasis (HP:0000787) and rickets (HP:0002748). 42/42 snippets verified and independently re-checked as raw substrings.

  summary: 'Create: ATP6V1B1 distal RTA with sensorineural hearing loss'
  details: 'New entry for ATP6V1B1-related distal renal tubular acidosis with progressive sensorineural
    hearing loss (MONDO:0009968). Seven nodes branching from a single failed proton-secretion step
    into a renal arm (impaired net acid excretion to acidosis to nephrocalcinosis) and an otologic
    arm (disrupted endolymph pH to endolymphatic enlargement and hearing loss), neither downstream
    of the other. Both mouse models are curated including their failures: the C57BL/6 knockout FAILS_TO_RECAPITULATE
    hearing, the MRL spontaneous mutant RECAPITULATES the ear but FAILS_TO_RECAPITULATE the acidosis,
    and the documented B2-subunit relocalisation explains why - paired with a HUMAN_MODEL_MISMATCH
    discussion. The 2025 dominant Arg394 mechanism is curated as a subtype with a second inheritance
    block, since it changes both diagnosis and expected phenotype. Ontology note: four of ten terms
    suggested by the research report were wrong or obsolete, including CL:0002210 given as vestibular
    hair cell when it is red muscle cell; all corrected against OLS. 30/30 snippets verified with
    no normalization-only passes.

    '

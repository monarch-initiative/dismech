  summary: Add Xenopus BOS/BOR Six1 substitution model
  details: |
    Added a Xenopus laevis model (PMID:31980437) expressing the four BOS/BOR SIX1 substitutions V17E, R110W, W122R and Y129C, with two mechanism links: RECAPITULATES Failure of EYA1-SIX1 Transcriptional Coactivation (nuclear but transcriptionally deficient mutant protein) and PARTIALLY_RECAPITULATES Otic Placode and Inner Ear Developmental Arrest, with limitations recording that auditory and vestibular structures still form so this is hypoplasia rather than arrest. Scope caveat noted in the model description: this is the SIX1 side of an EYA1-anchored entry, roughly 4 percent of BOS/BOR. Validated: 72/72 snippets verified.

  summary: 'Create: EYA1-Related Branchiootorenal Spectrum Disorder, lumping BOS1
    and BOR1'
  details: |
    Curated MONDO:0011258 branchiootic syndrome 1 as one EYA1 gene-axis spectrum entry that also covers MONDO:0007236 branchiootorenal syndrome 1, with BOS1 and BOR1 as has_subtypes and both MONDO terms recorded as skos:narrowMatch. Lump rationale, also recorded in entry notes and the PR body: PMID:15141091 states EYA1 haploinsufficiency causes both BOR and BO syndromes; PMID:21280147 found no genotype-phenotype correlation and high phenotypic variability between and within families; GeneReviews PMID:20301554 is titled Branchiootorenal Spectrum Disorder and applies a single criteria set that does not require renal involvement; and MONDO's own branchiootic syndrome definition is subtractive, defined by absence of renal abnormalities. The split line is drawn by causal gene instead: SIX1 BOS3 is left as its own queue item, and SIX5 is recorded as DISPUTED per PMID:21280147 rather than treated as a causal gene. Deep research provider: falcon, report at research/EYA1-Related_Branchiootorenal_Spectrum-deep-research-falcon.md with 9 of 9 references resolved and confabulation_rate 0.0. NEC preflight returned WARN, reviewed and cleared: the flagged rival gene SIX1 is EYA1's obligate binding partner and the report OMIM 602588 matches the MONDO xref. The entry was built from independently fetched and snippet-verified primary literature rather than from the DR report; the report served as a cross-check and prompted three corrections, namely the SIX5 dispute, the mixed-cohort frequency caveat, and a softened middle-ear surgery claim. No module conformance is asserted; pharyngeal_arch_patterning_serial_homology, sensorineural_hair_cell_loss and renal_cystogenesis were each considered and rejected with reasons recorded in notes. Validation: just validate passed with 59 of 59 snippets verified against cached references; just validate-terms passed; check-folded-hyphens, check-duplicate-keys, check-snippet-length, check-title-snippets and check-environmental-evidence were all clean; just validate-disorders was run before opening the PR. Stubs for BOS1 and BOR1 were both deleted as now curated.

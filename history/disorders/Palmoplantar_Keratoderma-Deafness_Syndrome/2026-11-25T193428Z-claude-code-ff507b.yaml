  summary: 'Gene-family review: MT-TS1'
  details: |
    The MT-TS1 (m.7445A>G) form of the syndrome had a genetic record but no mechanism node. A node now records the measured lesion: in lymphoblastoid cells from a homoplasmic pedigree the variant slows 3'-end processing of the tRNA-Ser(UCN) precursor, lowering tRNA-Ser(UCN) by about 70% and the mitochondrial protein synthesis rate by about 45% (PMID:9742104). It binds the tRNA's molecular function, triplet codon-amino acid adaptor activity (GO:0030533), and mitochondrial tRNA 3'-end processing (GO:1990180) and mitochondrial translation (GO:0032543), all DECREASED. Its edge to sensorineural hearing loss cites GeneReviews (PMID:20301595); its edge to palmoplantar keratoderma is typed UNKNOWN, citing GeneReviews and a 2023 infant case (PMID:36524552), because no study has examined how the variant produces the keratoderma. The genetic record gains variant_origin GERMLINE, a Mitochondrial inheritance block (HP:0001427) and the GeneReviews statement that the keratoderma occurs in some m.7445A>G families; its UNKNOWN relationship type is kept because the keratoderma association rests on few families.

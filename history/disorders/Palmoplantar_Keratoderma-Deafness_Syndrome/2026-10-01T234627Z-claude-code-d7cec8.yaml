  summary: 'Create: Palmoplantar Keratoderma-Deafness Syndrome'
  details: |
    Created the entry for MONDO:0007852 (OMIM:148350, Orphanet:2202). Deep research was requested from falcon (the curate default) via the documented --fallback path; no falcon key was available, so claude_code produced the report and its frontmatter records fell_back/requested_provider. The report was thin (2 web searches); its term and reference validation sections were re-run after a transient OLS timeout (3/3 references resolved, none off topic). All evidence was sourced independently from PubMed: the G59A defining pedigree (PMID:10633135), R75W oocyte dominant-negative study (PMID:9856479), Cx43 trans-dominant study with patient-skin colocalization (PMID:11493646), H73R trafficking study (PMID:17993581), HeLa dominant-negative study (PMID:21040787), R75W transgenic mouse (PMID:12700168), AAV base-editing rescue (PMID:40059830), 2026 GJB2 review (PMID:41516362), Korean R75W family with cochlear implantation (PMID:20890442), and the mitochondrial m.7445A>G pedigree (PMID:11069477). Lump/split: the pathograph is scoped to the GJB2 subtype; the MT-TS1 m.7445A>G form is a has_subtypes row and genetic entry (relationship_type UNKNOWN, single-pedigree basis) because its proband had normal connexin 26 and its mechanism is unrelated. Keratoderma therapy was deliberately left unsourced: the acitretin reports found concern KID and Vohwinkel syndromes. GeneReviews: NO_CHAPTER (checked online with synonyms). A pre-PR red-team subagent pass found no blocking issues and its important findings were fixed before commit: edge evidence moved onto the edges it supports (the potassium and organ-of-Corti edges now carry the mouse quote; the oocyte-based skin edge is graded INDIRECT; the Cx43 hypothesis quote marked as the authors' model and paired with the patient-skin colocalization result), MT-TS1 downgraded from CAUSATIVE, the base-editing rescue moved to its own animal-model record limited to plaque morphology, and the cochlear-implant rationale re-sourced and qualified with the device term. Validation: validate-disorders, 31/31 snippets, terms, qualifier terms (online), entity refs, causal targets, enum, duplicate keys, coarse phenotypes and snippet grading all pass; 2/2 phenotypes connected; GJB2 and GJA1 grounded.

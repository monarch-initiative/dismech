  details: |
    Review round 1 on PR #9892. All five items addressed.

    Item 1, no deep-research artifact: ran openscientist for this disease and committed the report plus citations sidecar. It passed just preflight-dr against MONDO:0012534 [TUFM mentioned 47 times, canonical gene matched, OMIM 610678 agreeing] - unlike the CMS15 run in the sibling PR, which was about the wrong gene. Two of its leads, both verified against PubMed before use, became the entrys strongest evidence: PMID:41866827 [an adult proband with reduced complex I, III and IV activity on endomyocardial biopsy, hypertrophic cardiomyopathy, chronic kidney failure and sensorineural hearing loss] and PMID:38825039 [a zebrafish tufm-null model]. Also added the biochemical section for blood and CSF lactate and the differential_diagnoses section for TSFM and GFM1, both of which the reviewer correctly identified as prose sitting in the wrong slot.

    The ORPHA citation could not be added. MONDO:0012534 cross-references Orphanet:254925 and no cache file exists, so it would have to be generated; just refresh-orphadata fails with a checksum mismatch because Orphadata has republished en_product1.xml and the pinned MANIFEST sha256 no longer matches. Re-pinning would shift every ORPHA cache to a new release and belongs in its own PR. Filed as issue #9897.

    Item 2, liver binding: rebound from HP:0001399 Hepatic failure to HP:0001410 Decreased liver function, regraded the evidence item from PARTIAL to SUPPORT, and deleted the two caveat sentences. The reviewer was right that the fix is the precise term rather than the caveat.

    Item 3, diagnosis claim exceeding its snippet: partially resolved by real evidence rather than only by a caveat. The reduced-I/III/IV half is now directly cited from the adult probands endomyocardial biopsy. The complex II sparing remains inference from the nuclear origin of its subunits, and the entry now says explicitly that the two halves of the claim do not rest on the same footing. The discussion attaches_to now includes the diagnosis entry as well as the pathophysiology node.

    Item 4, two evidence_source gradings: both PMID:38630895 items quoting the OBJECTIVES preamble regraded HUMAN_CLINICAL to OTHER. The reviewer is right that these are review-derived background rather than patient observations, and that it was the two most upstream pathograph nodes that looked human-evidenced when they were mechanism-by-assertion.

    Item 5, bundled node: split Cellular Energy Failure and Lactate Accumulation into Cellular Energy Failure [CELLULAR, carrying GO:0009060 aerobic respiration DECREASED] and Lactate Accumulation [ORGANISM], with the encephalopathy and cardiomyopathy edges moved onto the energy-failure node where their own descriptions already located them.

    Suggestions taken: recorded the GeneReviews negative result in notes; dropped the uncited limb-spasticity clause from the hypotonia description; changed the cardiomyopathy edge from INDIRECT_UNKNOWN_INTERMEDIATES to DIRECT, since the reviewer is right that the uncertainty is about organ selectivity rather than missing intermediate steps, and the OPEN_QUESTION discussion carries that.

    Validation: just validate-disorders passed; 38/38 snippets verified; terms validated; all ungated gates pass.

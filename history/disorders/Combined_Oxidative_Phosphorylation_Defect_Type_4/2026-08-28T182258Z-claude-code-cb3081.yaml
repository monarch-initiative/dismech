  details: |
    Review round 2 on PR #9892. The one blocking item was a self-contradiction I introduced in round 1.

    Blocking item: the notes: block still said no disease-directed therapy has been reported with nothing citable behind it. That was true of the original four abstracts but false of the six the entry now cites, because PMID:38825039 - which I had added and cited twice in animal_models - ends by identifying probucol as a promising therapeutic approach for managing COXPD4. I added a paper and did not re-read the prose it falsified. Fixed by adding a third modeled_mechanisms link on the zebrafish model with relationship RESCUES and fidelity LOW, carrying the probucol sentence as MODEL_ORGANISM evidence graded PARTIAL, and by rewriting the notes paragraph to say there is one preclinical lead rather than none. The rewritten paragraph also distinguishes itself explicitly from the GeneReviews negative two paragraphs down, which was the reviewers point about register.

    The RESCUES link deliberately carries no readouts. The abstract asserts promise without reporting which readout probucol corrected or by how much, so attaching a readout would manufacture precision the source does not have. The limitations field records that, and that a rescue in a full knockout would not straightforwardly predict benefit in patients carrying missense alleles with residual EF-Tu.

    Non-blocking items addressed: the Cardiomyopathy node now covers both morphologies, dilated in the infant and hypertrophic in the adult, and says nothing explains the difference; added distal pathophysiology-to-phenotypes edges for encephalopathy, microcephaly and both cardiomyopathies; added a notes field on the TSFM differential arm recording that the indistinguishability claim rests on shared biochemistry rather than on any published comparison, since no source cited here reports a TSFM patient; added an OPEN_QUESTION discussion on TUFM moonlighting role in autophagy and innate immunity, recording that no COXPD4 patient has been described with an immunological phenotype and that the entry models the disease strictly as a translation defect.

    CSF lactate is kept without an evidence item. Its notes field states that no cited source reports a CSF lactate value in a TUFM patient and that the marker is listed because a negative result would be informative. That is a deliberate epistemic marker rather than an omission.

    Validation: just validate-disorders passed; 39/39 snippets verified; terms validated with no new cache rows; all ungated gates pass.

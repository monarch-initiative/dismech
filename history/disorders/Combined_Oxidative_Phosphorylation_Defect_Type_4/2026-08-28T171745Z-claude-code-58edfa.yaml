  summary: 'Create: Combined Oxidative Phosphorylation Defect Type 4'
  details: |
    De novo curation of MONDO:0012534 [combined oxidative phosphorylation defect type 4, TUFM] from four case reports and series: PMID:17160893 [Valente 2007, founding EF-Tu patient], PMID:30903008 [Hershkovitz 2019, cardiomyopathy-predominant], PMID:38630895 [Gokalp 2024, hepatic and optic presentation] and PMID:41409307 [Tekmenuray-Unal 2025, recurrent Arg339Gln founder allele].

    Entry-type decision was DISEASE, following existing practice: the KB already curates Combined_Oxidative_Phosphorylation_Defect_Type_21.yaml [TARS2] and Combined_Oxidative_Phosphorylation_Deficiency_42.yaml as standalone numbered leaves.

    Modelling decisions. The pathograph is built around why the defect is combined: EF-Tu is a shared component of the mitochondrial translation apparatus, not a subunit-specific factor, so limiting it starves synthesis of all thirteen mtDNA-encoded proteins at once and complexes I, III, IV and V fail together while complex II, built entirely from nuclear-encoded subunits, is spared. The chain runs TUFM loss of function to impaired translation elongation to combined complex deficiency to energy failure and lactate accumulation, then branches to encephalopathy [DIRECT] and cardiomyopathy [INDIRECT_UNKNOWN_INTERMEDIATES].

    Two epistemic caveats are recorded rather than smoothed over. A KNOWLEDGE_GAP discussion plus a node-level note records that complex II sparing is stated from the nuclear origin of its subunits rather than from a complex-by-complex assay reported in a TUFM patient in these sources. An OPEN_QUESTION discussion records that nothing explains why the same class of missense allele produces a fatal encephalopathy in some patients and a cardiomyopathy or hepatopathy in others, which is why the cardiomyopathy edge is drawn as indirect with unknown intermediates rather than direct.

    The liver phenotype is bound to HP:0001399 Hepatic failure as the closest available term while the source reports only liver dysfunction; that evidence item is graded PARTIAL and the mismatch is stated in the phenotype description rather than left implicit.

    No treatments section: no disease-directed therapy has been reported and management in the published cases was supportive. No model sections: no animal model of a patient allele and no patient-derived cell model is reported in these sources.


  summary: 'Create: NEDMIAL (DHX30)'
  details: |
    Created the DHX30 entry (NEDMIAL, MONDO:0060622, OMIM 617804) from scratch, replacing a seed-stub placeholder. Lump/split: DISEASE. DHX30 had no prior dismech entry; the two clinical subtypes established by Mannucci et al. 2021 (helicase-core-motif missense = severe; haploinsufficiency/truncating = mild) are modelled as has_subtypes within one entry because the mild form has no separate MONDO or OMIM identity. Pathograph: HCM missense variant and haploinsufficiency as parallel initiating nodes, then loss of ATPase/helicase activity, excess stress-granule assembly (the gain-of-function that distinguishes the severe subtype), global translation inhibition, a HYPOTHETICAL mitochondrial-translation arm, disrupted brain development, and organism-level impairment. Phenotype frequency bands are scoped to the HCM missense subtype since that is the group the published numerators describe. Two zebrafish models curated with modeled_mechanisms, including a PARTIALLY_RECAPITULATES link that records what the null model does not reproduce. Three discussions: a HUMAN_MODEL_MISMATCH on the mitochondrial arm (measured only by depleting DHX30 in cancer lines, which is the opposite configuration from the human severe allele), and two knowledge gaps. All references were searched on PubMed independently; the falcon report carried no PMIDs and was used only as a lead after passing preflight-dr against MONDO:0060622. Validated: just validate (58/58 snippets verified, terms pass), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, check-snippet-length, check-title-snippets, check-folded-hyphens, check-environmental-evidence, and validate-disorders.

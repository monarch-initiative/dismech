  summary: 'Create: TCF20-Associated Neurodevelopmental Disorder (TAND / DDVIBA)'
  details: |
    New kb/disorders entry for TAND (MONDO:0032745), claimed via issue #11109. Curated as a dosage disorder of a chromatin complex rather than as a syndrome description: TCF20 haploinsufficiency reduces occupancy of the MeCP2-PHF14-TCF20 complex, dysregulating the neuronal transcriptional program and impairing dendritic arborization and spine formation. The differential is built on that mechanism, since Smith-Magenis (RAI1 paralogy, shared nucleosome-binding domains), Rett and MECP2 duplication syndrome (same complex, with a Tcf20-reduction rescue of MECP2-overexpression behavioural deficits) and the reciprocal TCF20 duplication disorder all connect through it rather than through shared phenotype lists. Ten HPO-bound phenotypes with cohort frequencies from Torti 2019, four treatments, two KNOWLEDGE_GAP/HUMAN_MODEL_MISMATCH discussions. Deep research: OpenScientist report committed; 13/13 references resolved and 16/16 checked quotes valid. Its relevance heuristic flagged PMID:10995766 and PMID:22081970 as off topic; both are SPBP papers, SPBP being the former symbol for TCF20, and both are directly on point. They are cited here with directness INDIRECT recording that they predate the disease association. This is a vocabulary-overlap failure of relevance scoring rather than a citation problem, and is worth knowing about for any gene with a former symbol. One snippet from PMID:22081970 had to be requoted around a bracketed abbreviation expansion that the reference validator strips (issue #10192). Deliberately not curated: postnatal overgrowth and craniofacial dysmorphism, the first because no cached source carries a quotable statement of it and the second because the same source states there is no recognizable facial gestalt, so a phenotype term would assert more structure than the finding has. Validation: schema pass, term validation pass, 43/43 snippets verified, check-entity-refs / check-causal-targets / check-duplicate-keys / check-enum-values clean.

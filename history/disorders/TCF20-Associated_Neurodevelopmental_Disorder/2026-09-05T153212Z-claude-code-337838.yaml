  summary: 'Fix: sub-floor evidence snippet on the seizure phenotype'
  details: |
    CI round 1. check_snippet_length (run with --against-ref origin/main, where grandfathering is off) caught a 3-word snippet, 'seizures in 12%', on phenotypes[7].evidence[0]. Replaced with a longer exact substring of the same sentence, 'structural brain anomalies in 24%, and seizures in 12%', which carries the same frequency claim in propositional form. Worth recording why the local run missed it: just check-snippet-length grandfathers against tests/ baselines by default and reported OK, while CI passes --against-ref origin/main and disables grandfathering. Running the bare recipe locally is therefore not equivalent to the CI gate, and gave a false all-clear on this entry. 43/43 snippets still verified; schema, terms and all offline gates re-run clean.

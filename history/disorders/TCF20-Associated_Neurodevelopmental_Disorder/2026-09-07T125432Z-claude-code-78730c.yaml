  summary: 'Review round 3: melatonin and methylphenidate, corrected two false prose
    claims'
  details: |
    Round-3 review found that two sentences in this entry asserted something about repository state that the cache contradicts, which is the same defect class as round-1 finding 1.

    The Pharmacotherapy for Autism and ADHD Symptoms description said no cached source for this disease names an agent or a class, and the notes said no cached reference mentions melatonin. references_cache/PMID_40011607.md, already cited six times in this entry, says: 'She has a circadian rhythm sleep disorder which is successfully controlled with melatonin and suffers from attention hyperactivity attention disorder (ADHD) which is successfully treated with methylphenidate.' Both sentences were false, and they were used to justify two omissions.

    Fixed:
    - methylphenidate (CHEBI:6887) bound as therapeutic_agent on the ADHD pharmacotherapy entry, with a second evidence item quoting the sentence that names it. The explanation states that this is one molecularly confirmed patient in an uncontrolled case report, so it supports the agent being used in this disease and carries no frequency or efficacy claim.
    - New treatment Melatonin for Circadian Rhythm Sleep Disorder (NCIT:C15986, SMALL_MOLECULE, CHEBI:16796) with target_mechanisms on Sleep Disturbance, which previously had no intervention reaching it at all.
    - Both description and notes sentences rewritten to say what the cache actually supports.

    Overgrowth omission re-argued. The previous note said the phenotypes were omitted because no quotable statement exists. The cohort in PMID:30739909 carries a stronger and opposite statement: 'In a majority of patients, we did not observe previously reported findings of postnatal overgrowth or craniosynostosis, in comparison with earlier reports.' The note now records that the strongest cached source argues against these features in most patients, rather than that no positive quote was found. A weak reason for a correct decision was replaced with the real one.

    Connectivity of the two phenotypes added in round 2:
    - Delayed Speech and Language Development now has a downstream edge from Impaired Dendritic Arborization and Spine Formation, typed INDIRECT_UNKNOWN_INTERMEDIATES like the two edges beside it, quoting the cohort milestone sentence (talking at 23 months).
    - Craniofacial Dysmorphism is deliberately left unconnected, with a new KNOWLEDGE_GAP discussion (tand_craniofacial_dysmorphism_unconnected) saying why: every mechanism node in this entry is neuronal, and attaching a craniofacial finding to a dendritic-arborization node would assert a route no cited work traces. Recording the gap is the same treatment used for the ear and speech findings in the sibling HCFP3 entry.

    Validation on this tree: just validate clean, 59/59 snippets verified (up from 55); check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms all OK; check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence all report no new findings against origin/main.

  details: |
    Genetics pass for the d2g wiring-008 tranche (issue #12197).

    All three checklist genes were already curated and, unusually for this
    tranche, already wired to the enzyme step each occupies: GALT to 'GALT
    Deficiency in the Leloir Pathway', GALK1 to 'GALK1 galactokinase deficiency',
    GALE to 'GALE UDP-galactose epimerase deficiency'. The campaign's
    "wire each gene to the step it acts at rather than listing them together"
    requirement was therefore already met.

    Changes:
    - The three genetic[] records carried no association, no relationship_type, no
      variant_origin and no subtype: foreign key. Added
      association: Causative, relationship_type: CAUSATIVE,
      variant_origin: GERMLINE, and subtype: Classic Galactosemia /
      Galactokinase Deficiency / Epimerase Deficiency respectively.
    - The three has_subtypes rows (MONDO:0009258, MONDO:0009255, MONDO:0009257)
      carried no genes: list. GALT, GALK1 and GALE were bound respectively, with
      new evidence on the GALK1 and GALE rows.

    Prose correction found during self-review. The three features: strings carried
    sub-band cytogenetic locations -- GALT 9p13.3, GALK1 17q25.1, GALE 1p36.11 --
    that appear nowhere in any snippet in the entry and that no reference cached
    for this entry supports at that precision. They were replaced with the
    band-level locations that citable sources do state, each now carrying its own
    evidence item: 9p13 from PMID:38778342 (already cited in the entry),
    17q25 from PMID:24211322, 1p36 from PMID:9538513. The last two references were
    fetched for this pass. The locus is the same in each case; only the unsourced
    extra digit was dropped.

    Validation: just validate, validate-terms, count-verified-snippets (97/97),
    check-genereviews (already TAGGED), check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values,
    list-gene-term-mismatches (0 findings), validate-disorders.

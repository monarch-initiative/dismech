  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Extended the existing Newborn Screening diagnosis row with diagnosis_term NCIT:C81178 and two LOINC measurements resolved from the Monarch KG: LOINC:42906-8 Galactose 1 phosphate uridyl transferase [Enzymatic activity/volume] in DBS and LOINC:54085-6 Galactose [Moles/volume] in DBS, the latter carrying total galactose in preferred_term because the KG serves no DBS code whose component is the galactose plus galactose-1-phosphate sum (searches listed in the row notes). Reference ranges: Victoria (Australia) programme GALT <20 U/L and TGAL >600 umol/L (PMID:42126257); Dutch programme GALT 2.0 U/dL and TGAL 1100 umol/L from July 2015 (PMID:27207469, which gives the values without the inequality; direction stated in notes from the biology). The erythrocyte GALT activity and erythrocyte galactose-1-phosphate biochemical markers were left without loinc_term: they are confirmatory red-cell assays, not DBS screening analytes, and LOINC offers several red-cell property variants with no single obvious code. Validation: just validate, count-verified-snippets 103/103, validate-terms, loinc-seed-cache, validate-disorders over the batch.

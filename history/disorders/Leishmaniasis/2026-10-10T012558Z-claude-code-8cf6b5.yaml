  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Added a diagnosis section with four rows. Parasitological demonstration bound to LOINC:51709-4 (Giemsa stain) and LOINC:51710-2 (organism specific culture), unspecified specimen, one measurement per assay; visceral specimens are spleen, bone marrow or lymph node aspirate, cutaneous specimens lesion tissue. Leishmania NAAT bound to LOINC:23159-7, the only unspecified-specimen Leishmania NAA code in the Monarch KG; no method-less presence code exists. rK39 rapid test bound to LOINC:43266-6 (K39 antibody presence), visceral disease only. Other serology (DAT, IFA, ELISA, western blot) bound to the method-less LOINC:7958-2. Evidence from the IDSA/ASTMH guideline PMID:27927991 (newly cached), PMID:17938629 and PMID:30712769. No reference_ranges: all results are qualitative and the only titre cut-off found (FAST single dilution) is a product operating cut-off, not a guideline threshold.

  details: |
    Closed the 'only one phenotype curated: cutaneous ulcers' gap flagged in issue #6309's parasitic-disorders content-gap review. Added 4 phenotypes to the Visceral leishmaniasis subtype: Fever HP:0001945, Hepatosplenomegaly HP:0001433, Pancytopenia HP:0001876, Weight loss HP:0001824; evidenced by PMID:17938629 Chappuis et al, Nat Rev Microbiol 2007, full text fetched via OA PDF. Added 1 phenotype to the Mucocutaneous leishmaniasis subtype: Nasal ulcer HP:0033361; evidenced by the already-cited DOI:10.1111/ddg.15424. Deliberately scoped to phenotypes only, not the other Leishmaniasis checklist items in #6309 such as HIV coinfection, additional treatments, Th1/Th2 mechanism node, or prevalence, to keep the PR bounded per the issue's own guidance against bulk multi-item changes. All snippets verified as exact substrings of cached references via validate-references, all HP terms verified against sqlite:obo:hp via validate-terms, full validate and pytest tests/test_data.py pass.

  summary: 'Address PR #7892 review: unbundle Th1/Th2 node, fix over-specific HP term,
    targeted treatment snippets'
  details: |
    Follow-up session addressing the three blocking items in the ai4c-reviewer CHANGES_REQUESTED review of PR #7892, plus a merge of origin/main.

    Merge: origin/main was merged (never rebased). The only conflict was kb/disorders/Leishmaniasis.yaml, where main had independently added Fever, Hepatosplenomegaly, Pancytopenia, Weight loss, and Nasal mucosal ulceration phenotypes sourced from PMID:17938629 and DOI:10.1111/ddg.15424. Resolved by keeping main's node set and categories and folding this branch's PMID:31297548 evidence in as additional evidence items. Cache CSVs auto-merged; the diff versus main is exactly the two CHEBI rows for miltefosine and sodium stibogluconate, in canonical order.

    Review item 1, over-specific HP term: the branch's "Nasal septum perforation" phenotype bound HP:0033434, defined as a full-thickness defect of the nasal septum, but its cited snippet from PMID:24897964 only attests chronic local destruction of tissue of the nose, pharynx and palate. The cached abstract contains no mention of septum or perforation, verified by grep, so the binding was unsupported. The node was removed and its PMID:24897964 evidence folded into main's "Nasal mucosal ulceration" node, HP:0033361 Nasal ulcer, marked supports PARTIAL because the review documents destructive nasal mucosal disease but does not state ulceration in those words.

    Review item 2, bundled pathophysiology node: "Th1/Th2 Immune Response Dichotomy" asserted two mechanistically opposite claims in one node. Split into "Th1-Polarized Cell-Mediated Response and Macrophage Activation" with role Protective, cell types CL:0000545 T-helper 1 cell and CL:0000235 macrophage, and biological process GO:0042088 T-helper 1 type immune response; and "Th2-Polarized Response and Permissive Disease Progression" with role Permissive, cell type CL:0000546 T-helper 2 cell, and biological process GO:0042092 type 2 immune response. All four terms were verified with OAK. Note that GO:0042092's canonical label is "type 2 immune response" and the Th2 phrasing is only a NARROW synonym, so preferred_term carries the Th2 wording while term.label carries the canonical label. Both nodes are connected into the pathograph by downstream causal edges from "Intracellular amastigote replication in macrophages", each carrying its own edge-level evidence. Edge direction runs infection to immune arm to avoid introducing a cycle; the restraining polarity of the Th1 arm is stated in the node and edge descriptions because CausalEdge has no polarity slot.

    Review item 3, treatment evidence: the three new treatments all cited the review's generic scope statement, which attests only that the paper discusses these drugs. Replaced with targeted exact quotes from the cached full text of PMID:39752369, and softened the descriptions to what those quotes actually attest. Miltefosine now cites the global-utilization and oral-administration spans, dropping the unsupported "region-dependent efficacy". Pentavalent antimonials cite the WHO 2010 first-line statement and the abstract's toxicity-and-resistance clause, dropping the unsupported "particularly in eastern Africa". Paromomycin cites the VL/CL efficacy-and-availability span and the intramuscular-or-topical route span, which now genuinely supports the topical-formulation claim. All spans were chosen to avoid PDF hyphenation across line breaks and were checked as literal whitespace-normalized substrings of the cache body before use.

    Review suggestion 4, optional and taken: the murine-translation caveat was converted to a discussions entry, leishmaniasis_th1_th2_murine_mismatch, kind HUMAN_MODEL_MISMATCH, status OPEN, attaching to both new pathophysiology nodes, with two structured proposed_experiments and the review's explicit human-versus-mouse sentence as evidence.

    Deliberately not addressed: review suggestions 5, splitting the single prevalence record into separate visceral and tegumentary records, and 6, adding a PKDL subtype, MCL dysphagia and dysarthria, and the LPG/V-ATPase phagosome-acidification block, were flagged non-blocking by the reviewer and are left for a subsequent pass.

    Validation: just validate, just validate-terms, just validate-references, and just validate-history-all all pass. Reference validation reports 32 of 45 snippets verified against cached references, with 13 skipped by prefix, all of which are DOI references without a local cache file.

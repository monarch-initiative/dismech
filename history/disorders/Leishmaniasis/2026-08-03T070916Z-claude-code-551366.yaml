  summary: Add VL/MCL phenotypes, Th1/Th2 mechanism, treatments, and prevalence
  details: |
    Closed several content-gap checklist items for Leishmaniasis from issue #6309 (parasitic disorders review): (1) added visceral leishmaniasis phenotypes Fever, Hepatosplenomegaly, Pancytopenia (PMID:31297548); (2) added Mucocutaneous leishmaniasis phenotype Nasal septum perforation, describing chronic destructive nasal/pharyngeal/palatal tissue loss (PMID:24897964); (3) added a Th1/Th2 Immune Response Dichotomy pathophysiology node, evidence_source MODEL_ORGANISM and supports PARTIAL since the cited review explicitly notes the murine Th1/Th2 dichotomy does not cleanly translate to humans (PMID:19634705); (4) added three treatments (Miltefosine, Pentavalent Antimonial Therapy/sodium stibogluconate, Paromomycin) with CHEBI-bound therapeutic_agent, evidence from PMID:39752369; (5) added structured prevalence (ANNUAL_INCIDENCE, qualitative COMMON tier, raw case-count estimates in notes rather than a derived rate_per_100000 since the source gives no population denominator) from PMID:36753272; (6) extended the Visceral leishmaniasis has_subtypes description with HIV co-infection/transplant immunosuppression risk, evidence PMID:31297548. All new PMIDs fetched via just fetch-reference and snippets verified as exact substrings of the cached abstracts. Left untouched: the other 14 entries tracked in #6309, and item-level nuances flagged as future follow-up (e.g. species-specific VL/CL subtyping, Wolbachia-style shared-mechanism modules). Validated with just validate, just validate-terms, just validate-references, and uv run pytest tests/test_data.py -k leishmania (all pass).

  summary: List the recognised phases in progression (#10115, R21)
  details: |
    Added a seven-phase progression block scoped with subtype to the three existing has_subtypes names. Visceral leishmaniasis: Incubation (typically 6 weeks to 6 months, with documented 7- and 15-month intervals; PMID:30285634, a case report whose background sentence is tagged quote_role BACKGROUND and whose own observation is PRIMARY_RESULT), Progressive febrile visceral disease (fatal if untreated; PMID:17938629, PMID:31297548, PMID:19634705), Post-kala-azar dermal leishmaniasis (0-6 months after treated VL in Sudan, 6 months to 3 years in India; PMID:17938629). Cutaneous leishmaniasis: Incubation (1-4 months, rarely years; DOI:10.36877/pmmb.a0000395), Papule to nodule to ulcer (same DOI), Spontaneous healing and scarring (2-10 months; same DOI plus PMID:17938629, PMID:19634705). Mucocutaneous leishmaniasis: Mucosal spread months to years after a first cutaneous episode, mostly L. braziliensis (PMID:17938629). One reference newly fetched: PMID:30285634. has_subtypes, pathophysiology, phenotypes and the deep-research references list were not edited. Validation: just validate passed; count-verified-snippets all verified; check-snippet-grading, check-title-snippets, check-snippet-length, check-duplicate-keys, check-enum-values, check-entity-refs and check-causal-targets clean; check-granularity no longer reports NO_PROGRESSION.

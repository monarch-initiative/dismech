  summary: 'Create: ATP6AP2-Related Disorder'
  details: 'Created from the stub (MONDO:0100146) against an OpenScientist deep-research report, with
    every ontology binding read from OLS and every snippet verified against a committed reference cache
    file at the time of writing (32 snippets, 32 reference titles, 0 issues).


    Lump/split decision: one Disease entry carrying three has_subtypes rows (MRXSH on MONDO:0010319,
    XPDS on MONDO:0010482, and ATP6AP2-CDG unbound), rather than two or three entries. MONDO records
    two descendants of the entry term and OMIM three phenotype entries, so a split was the expected
    reading; the evidence went the other way. Complete loss of ATP6AP2 is effectively absent from population
    variation data, so every clinical allele is a hypomorph; the two neurological entities share their
    extrapyramidal and pyramidal features; and PMID:41131679 reports the glycosylation abnormality in
    patients with purely neurological disease, which removes the single finding that had separated the
    hepatic arm. The ClinGen Intellectual Disability and Autism Gene Curation Expert Panel curates one
    gene-disease relationship keyed on MONDO:0100146 and names all three OMIM phenotypes as its manifestations;
    that assertion was found after the structure had been chosen and is quoted in the genetic record,
    and is the stronger basis for the lump.


    Recorded a DEFINITIVE ClinGen tier in gene_disease_validity, copied from CGGV:assertion_ac33652a-dd98-46f4-ba4e-d3d5a482a22e-2020-09-14T160000.000Z,
    whose MONDO term is this entry''s own disease_term so no panel-lumping exception applies. The cache
    file was rebuilt from the committed cache/clingen/gene_validity.csv rather than from the gitignored
    newer download, so its source_sha256 is reproducible from repository content alone.


    Pathograph: eight nodes from the hypomorphic allele through two molecular routes (exon 4 skipping
    with ~50 percent reduction in full-length transcript; extracellular-domain destabilisation with
    loss of ATP6AP1 binding) converging on impaired V-ATPase V0 assembly in the ER, then defective organelle
    acidification, then reduced mTOR signalling with autophagic dysregulation and a secondary glycosylation
    defect, ending in neuronal death and autophagic liver disease.


    Deliberate departures from the sources, each recorded in notes. Inheritance is bound to HP:0001417
    X-linked rather than HP:0001419 X-linked recessive: all three OMIM entries annotate recessive inheritance,
    but PMID:41131679 reports an affected heterozygous female. PMID:41131679''s abstract transposes
    the MRXSH and XPDS acronyms against their OMIM numbers; MONDO:0010319 carries the xref OMIM:300423,
    so this entry follows MONDO, and that sentence is quoted for clinical content only and not for its
    acronym-to-identifier pairing. No MONDO term is bound for the ATP6AP2-CDG subtype because none resolved.


    A KNOWLEDGE_GAP discussion records the unexplained part: nothing in the curated chain distinguishes
    the two allele routes downstream of the assembly step, so the organ specificity is not accounted
    for by the mechanism as recorded.


    Not done: no MGI binding for the mouse models, because the Alliance API was unreachable throughout
    the session and the term validator does not check MGI labels, so a remembered identifier would have
    passed every gate unverified. The report''s own term-validation section verified 0 of 152 CURIEs
    (151 service_unreachable), so no CURIE was taken from it; each was resolved independently.



    Scope correction made during curation, before the PR was opened. The entry was first

    written with all three ATP6AP2 phenotypes as real subtypes, on the strength of the ClinGen

    panel''s single gene-disease relationship. Running the whole-repo gates surfaced a

    cross-file snippet-grading divergence against

    kb/disorders/Congenital_Disorder_of_Glycosylation_Type_IIr.yaml, which is a 1,370-line

    entry curating the glycosylation phenotype as its own disease on MONDO:0026765. The

    initial preflight had not found it: preflight-dr and preflight-claim-conflict were run on

    MONDO:0100146, and MONDO does not place MONDO:0026765 under that term. Checked at OLS,

    MONDO:0100146 has exactly two descendants, both neurological, while MONDO:0026765 sits

    under congenital disorder of glycosylation type II in the metabolic branch with no path

    back.


    The entry was restructured rather than merged or abandoned. ATP6AP2-CDG became a pointer

    subtype carrying curated_in: Congenital_Disorder_of_Glycosylation_Type_IIr and the

    MONDO:0026765 binding; the Autophagic Liver Disease pathophysiology node, its inbound

    edge, and the hepatopathy and immunodeficiency phenotype rows were removed, since each

    duplicated content held by that entry. The glycosylation node was kept, because

    PMID:41131679 reports the glycosylation abnormality in patients with purely neurological

    disease, so on this side it is a finding about these patients rather than a borrowed

    hepatic feature. The scope note now records the ClinGen-versus-MONDO disagreement and

    states that dismech follows MONDO because of the existing entry rather than because the

    biology settles it.


    Also corrected in the same pass: PMID:29127204''s functional-characterisation sentence was

    graded HUMAN_CLINICAL in three places and IN_VITRO in one. IN_VITRO is right and is what

    the CDG entry already records, so all four now agree.'

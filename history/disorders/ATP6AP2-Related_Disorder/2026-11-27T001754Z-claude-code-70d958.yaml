  summary: 'Review round 1: ATP6AP2-Related Disorder'
  details: |
    Answered the ai4c-reviewer CHANGES_REQUESTED review on PR 19086 in one push. All four IMPORTANT items and all four suggestions are addressed. Every claim the review made was re-checked against the reference cache before acting, and all of them held.

    Item 1, the entry overgeneralised to exon 4, and it was a real error. The 50 per cent dosage figure quoted from PMID:35779466 belongs to c.168+6T>A, which that paper reports as increasing skipping of exon 2, not exon 4; the exon 4 sentence in the same abstract is its background paragraph describing previously reported alleles. The node is renamed from "Exon 4 Skipping and Reduced Full-Length Transcript" to "Aberrant Splicing and Reduced Full-Length Transcript", with its bare downstream target and its discussions attaches_to reference updated. The node description now states that the exon varies and the dosage reduction is the general mechanism, naming the exon 4 alleles of the classic presentations, the exon 2 allele, and the exon 5, exon 8 and pseudoexon alleles of the 2025 series. The entry-level description no longer says exon 4. The paper's own conclusion is added as evidence, which is the sentence the renamed node is now named for: a common pathogenic consequence of splicing mutations affecting inclusion of different exons is reduction of the functional full-length transcript. The PMID:24223829 exon-4-isoform item is kept, with its explanation now saying that it is specifically about that isoform.

    Item 2, the rescue snippet did not support either node it was on. On the neuronal-death node it is replaced by the sentence that states the finding in patient iPSC-derived neurons, and the mouse conditional-deletion sentence is added as a separate MODEL_ORGANISM item, which is also the source for the impaired-CNS-development half of that node's name. On the mTOR node the rescue item is replaced by two: the PMID:29388887 cascade sentence, which is the only source in this entry naming reduced mTOR signalling and is graded INDIRECT because it was shown in the glycosylation presentation that is curated as its own entry, and the PMID:30985297 lysosomal-acidification-and-protein-degradation sentence for the half of the node that the neurological paper does support. The explanation that the rescue ruled out a dominant-negative effect is removed from the evidence item and recorded in the lesion node's notes as the inference it is, with the reason stated: the abstract does not say the short isoform was present during the rescue.

    Item 3, three gradings corrected. The PMID:35779466 50 per cent item is IN_VITRO, since that paper's methods state the measurement was RNA-Seq and qRT-PCR on patient iPSC-derived neural progenitors. The PMID:35779466 exon 4 item carries quote_role BACKGROUND. The PMID:29995586 item is MODEL_ORGANISM, because the quoted sentence reports whole-organism genetics in yeast and Drosophila.

    Item 4, an animal_models block is added: the conditional Atp6ap2 deletion in developing mouse brain from PMID:30985297, linked to the neuronal-death node as PARTIALLY_RECAPITULATES at MODERATE fidelity and TISSUE model_scale, with a cortical-integrity readout and evidence on both the link and the readout. Its divergence is typed CAUSE_UNREPRESENTED with materiality QUALIFYING: the human lesion is a hypomorphic splicing allele and the model imposes a deletion, so the mechanism does not arise from the allele that causes the disease and the claim holds in the narrower form that losing ATP6AP2 function in developing brain kills neurons. No MGI gene binding is recorded, for the reason already in the entry, and that reason is restated in the model's own notes.

    Suggestions, all four taken. The lesion node's unsourced population-constraint claim is narrowed to what the sources support, the reported allele spectrum, with a sentence saying no cited source measures ATP6AP2 constraint. Microcephaly and axial hypotonia are wired from the neuronal-death node; the axonal neuropathy reported beside them is deliberately left unwired, with the reason stated, because no cited source establishes it as central rather than peripheral in origin. A treatments block records symptomatic antiseizure pharmacotherapy, quoting the 2025 series, with notes stating that no disease-modifying therapy or trial is recorded in any source cited here and that the row is not the whole of management.

    One correction the review prompted but did not ask for, and it changes an argument this entry made. The reviewer noted that the Spasticity row is described as shared by both neurological presentations while its only evidence is XPDS-sourced. Checking that, the MRXSH founding report PMID:15746149 does not mention spasticity at all, and the only sentence pairing spasticity with MRXSH is the PMID:41131679 abstract sentence whose acronym-to-identifier pairing this entry had already recorded as unreliable. So the row is now scoped subtype XPDS, and the shared-extrapyramidal-and-pyramidal-features ground is withdrawn from the lump argument in the entry notes, which now rests on the shared splicing-dosage mechanism, the absence of any reported null allele, and ClinGen's single gene-disease relationship. The withdrawal is recorded in the notes rather than silently removed.

    Validation after the round: validate-disorders clean, 35 snippets and 35 titles verified with 0 issues; every reference_title re-audited against its cache frontmatter, 35 checked and 0 mismatches; check-causal-targets and check-name-collisions clean; no tracked references_cache file modified.

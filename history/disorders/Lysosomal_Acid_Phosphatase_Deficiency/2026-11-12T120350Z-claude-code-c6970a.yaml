  details: |
    Initial enrichment migrated gene slots, preserved Lysosomal Substrate Accumulation module conformance, and added classifications, Orphanet prevalence, infantile human phenotypes, and Acp2 knockout/nax mouse pathology. Round 1 PR review follow-up moved human infantile neurological edges (Lethargy, Hypotonia, Opisthotonus) off the mouse-only CNS gliosis node onto the root enzyme-deficiency node with INDIRECT_UNKNOWN_INTERMEDIATES, restored the explicit PMID:9228031 caveat that the causal link from enzyme deficiency to clinical manifestations remains undetermined, removed unsupported human ACP2 Molecular Genetic Testing from diagnosis and clarified in genetic notes that no human pathogenic ACP2 variant has ever been reported, removed the mouse-only cerebellar phenotype from human phenotypes, added Kyphoscoliosis with PMID:9228031 evidence to Acp2 knockout animal_models, dropped unbacked GO:0007040 from the root node, and documented leukocyte-restricted LAP deficiency in notes.

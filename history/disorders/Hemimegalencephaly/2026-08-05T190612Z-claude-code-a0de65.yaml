  summary: 'Create: Hemimegalencephaly'
  details: |
    De novo curation of hemimegalencephaly (MONDO:0020492) as a somatic mosaic disorder of mTOR-pathway signalling. Eight-node pathograph from a postzygotic PIK3CA, AKT3, or MTOR gain-of-function variant through an explicit mosaic-variant-gradient node and constitutive mTOR activation into dysregulated progenitor growth, unihemispheric overgrowth with cortical dyslamination, intrinsically epileptogenic dysplastic cortex, drug-resistant infantile epilepsy, and hemiparesis with developmental impairment. The mosaic gradient is modeled as its own node rather than folded into the variant node because the affected-cell fraction, reported between eight and forty percent and absent from blood, is a mechanistic variable that sets both how much cortex is malformed and whether the variant is detectable at all. Two nodes conform to epilepsy_excitation_inhibition_imbalance; the module's ion-channel trigger is not claimed because the proximal lesion is a growth-signalling one. No mechanistic_category is asserted: the schema enum is closed and has no value for the mTORopathies, and the scope note records that rather than forcing an approximation. Three discussions: a KNOWLEDGE_GAP on the two thirds of cases with no identified variant, laying out detection versus biology accounts with a decisive experiment; a CONTROVERSY on why hemispherectomy fails in a minority, where bilateral ictal EEG abnormality predicts recurrence with a hazard ratio above eleven while surgical approach predicts little, and where nobody has looked for the variant in the contralateral hemisphere; and a KNOWLEDGE_GAP on whether mTOR inhibition can replace surgery, framed around the specific risk that partial benefit defers hemispherectomy past the developmental window. Deep-research cross-check with the claude_code provider confirmed the graph, sharpened the contralateral experiment by flagging poor cerebrospinal fluid cell-free DNA sensitivity, and surfaced four further gaps recorded in the scope note as the next curation pass rather than asserted without verified sources. Validation: schema passed, term validation passed, evidence snippets verified against cached references, snippet-length check clean.

  summary: 'Review: address red-team findings on Patent Ductus Arteriosus 3'
  details: |
    Pre-PR adversarial self-review of the entry created earlier in this session, run in a fresh-context subagent against .claude/skills/dismech-pr-review. It verified every snippet, PMID, ontology binding and causal target independently and found those clean; the substantive findings were about claims the entry made that its own newly cached full texts contradict. Every quote cited below was re-checked against references_cache before acting on it.

    Two blocking findings, both fixed:

    1. The Premature Ductal Smooth Muscle Differentiation node asserted modifier DECREASED on smooth muscle cell proliferation with no node-level evidence, while PMID:35108221 (full text, cached by the create commit) measured proliferation with Ki67 and found no difference. Changed to ABNORMAL, added a REFUTE evidence item quoting the Ki67 result, and rewrote the node description and notes so the surviving claim is about differentiation timing rather than medial cell number.

    2. The two cited mouse papers ran the same Wnt1-Cre2 Prdm6fl/fl cross and report opposite results for neural-crest investment of the ductal media, and the entry quoted only one side, as plain SUPPORT. Added REFUTE evidence on both affected nodes, a second CONTROVERSY discussion (prdm6_crest_versus_contractility) with a reporter-matched replication experiment, and a third animal model, Prdm6fl/fl SM22-Cre, which is the load-bearing one: Prdm6 goes only after crest migration completes and the duct is still patent.

    Also fixed: the second animal model's genotype was vague enough to hide that it is the same cross as the first (now named Prdm6fl/fl Wnt1-Cre2 ZsGreen1, with a note on the collision); frequency OCCASIONAL removed from coarctation, since the only series was ascertained for the PDA-plus-coarctation combination and cannot estimate carrier frequency; Char syndrome corrected from PDA1 to PDA2 (TFAP2B, OMIM 617035); modifier on histone methyltransferase activity changed DECREASED to ABNORMAL, matching a snippet that says altered rather than reduced; an explanation that read direct occupancy as excluding a secondary effect rewritten, because the authors' own discussion reports no binding at the smooth-muscle promoters and raises exactly that possibility; CL:0000333 replaced by CL:2000073, whose label is word for word the preferred_term already written; HP:0030148 replaced by HP:0031670 Continuous heart murmur; GO:0000122 replaced by GO:0006357 at the node described as the neutral divergence point, since a negative-regulation term prejudges the disputed sign.

    Penetrance INCOMPLETE and expressivity VARIABLE added: these are enum slots taking no snippet, so the earlier waiver did not apply to them. The three missense variants added to genetic[].variants with ClinVar accessions VCV000243049/243050/243051, each classified Pathogenic for patent ductus arteriosus 3; domain assignments described rather than cited. Genetic counseling wording now separates the 50 percent transmission risk from disease risk under incomplete penetrance.

    Pathograph: the defining phenotype was an orphan. Added edges from Failure of Postnatal Ductal Closure to Patent ductus arteriosus and to Coarctation of aorta, and cited the previously bare distal edges. Graph is now 26 nodes, 28 edges, zero orphan targets. The congestive heart failure phenotype was citing a general morbidity sentence when the same cached abstract names heart failure outright; swapped.

    Added supportive care (fluid restriction and diuretics) as a treatment, ibuprofen as a second therapeutic agent on the COX-inhibitor entry, and a target_mechanisms link on it. Prevalence population narrowed to Worldwide per the cohort-or-geography rule. An NCIT device qualifier for the duct occluder was attempted and abandoned: NCIT has no occluder term, and a first guess resolved to Cytomegaloviral Retinitis, so the treatment now carries a note recording the ontology gap instead.

    Not acted on: the review noted the primary checkout is on the feature branch rather than main with work in a worktree. This session's environment provisions the branch in the primary checkout and has no second checkout to move main into, so it is out of scope here.

    Validation after the fixes: just validate and just validate-disorders pass, 77/77 snippets verified, all ten content gates clean, compliance 86.1 percent over a larger denominator. Model id omitted from this record for the same reason as the create record.

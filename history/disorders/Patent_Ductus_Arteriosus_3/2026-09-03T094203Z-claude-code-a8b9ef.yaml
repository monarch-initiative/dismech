  summary: 'Create: Patent Ductus Arteriosus 3 (PRDM6, MONDO:0024266)'
  details: |
    New Mendelian entry for the PRDM6-caused, isolated nonsyndromic form of patent ductus arteriosus (PDA3). Deleted the matching stub.

    Deep research: 'just research-disorder falcon Patent_Ductus_Arteriosus_3' failed because EDISON_API_KEY is present but empty (403 ProviderAuthError). Re-run with the fallback mechanism rather than hand-substituting a provider. A first '--fallback' run selected openscientist, which hung with no output for ~40 minutes (OPENSCIENTIST_API_KEY is also empty) and was killed; the run was then repeated as 'just dr_fallback=--fallback-provider claude_code research-disorder falcon Patent_Ductus_Arteriosus_3', which produced research/Patent_Ductus_Arteriosus_3-deep-research-claude_code.md with fell_back/requested_provider/provider_attempts recorded in its frontmatter.

    Report validation read before use: reference_validation needs_review true, 14/15 verified, one unresolved identifier (PMC:PMC38071433, a malformed PMC id built from PMID 38071433 digits) and one off-topic DOI. Neither was cited; the underlying paper is cited as PMID:38071433, which resolves and is cached. term_validation needs_review true with three mislabelled terms, all placeholder text the report itself wrote ('verify', 'verify via OAK', 'Ontology identifier for PDA3'), plus obsolete GO:0034770 (histone H4-K20 methylation) which was not bound. The report also suggested UBERON:0002106 for ductus arteriosus, which is spleen; the entry binds UBERON:0005440 instead.

    GeneReviews: PubMed searches for 'PRDM6 GeneReviews[All Fields]' and 'patent ductus arteriosus GeneReviews[All Fields]' return no chapter for PDA3 or PRDM6. The only Mendelian-PDA chapter is Char Syndrome (TFAP2B, PDA1/PDA2), a different syndromic entity, curated here only as a differential diagnosis. Recorded in the entry notes.

    Lump/split: curated as a separate DISEASE rather than a subtype of Patent_Ductus_Arteriosus. That entry curates PRDM6 as a developmental susceptibility locus and states explicitly that it is not curated there as a deterministic Mendelian cause, so the Mendelian form had no home.

    Content: a nine-node causal chain from heterozygous PRDM6 loss of function to the left-to-right shunt, deliberately branching at the transcriptional-program node into three hypothesis groups because the literature disagrees about the direction of PRDM6's effect. Li 2016 (human genetics plus in vitro) has PRDM6 restraining differentiation, so loss causes premature differentiation; Zou 2023 (conditional knockout) has Prdm6 building contractile identity, so loss reduces contractile gene expression and ductal tone. Both are curated as ALTERNATIVE hypotheses with a CONTROVERSY discussion and a dose-matched experiment proposal rather than silently preferring one. A third EMERGING group carries the cardiac-neural-crest route from Hong 2022. A HUMAN_MODEL_MISMATCH discussion records that mouse heterozygous Prdm6 deletion leaves ductal closure intact while human heterozygous variants cause disease.

    Two animal models with modeled_mechanisms and five readouts, including ABOLISHED depolarization- and oxygen-induced ductal constriction. A pharmacotherapy entry carries two REFUTE evidence items: indomethacin and 100 percent oxygen both close control ducts and fail in the Prdm6-deficient duct, which is why mechanical closure and not COX inhibition is the treatment paradigm here.

    Datasets: geo:GSE221004 and geo:GSE221094 added after manual relevance triage (both are PRDM6 ductus arteriosus series from PMID:36749647). The PRDM6 medulloblastoma and generic zinc-finger series that discover-datasets surfaced were GENE_ONLY name matches and were excluded.

    Deliberately not curated, recorded in review_notes: incomplete penetrance, the three specific missense variants, and the in vitro histone-mark and MYH11 assays. All are in the Li 2016 article body, and only its abstract is in the reference cache, so citing them would mean a snippet that cannot be verified.

    Validation: just validate passes (schema, terms, 59/59 snippets verified); just validate-disorders passes; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all clean; just verify-datasets resolves both accessions; compliance 86.0 percent. No DOI-keyed evidence items, so the snippet audit needed no --unskip-prefix run. The model id field is omitted from this record because this session's configuration forbids writing a model identifier into repository artifacts; the session URL in links carries the provenance.

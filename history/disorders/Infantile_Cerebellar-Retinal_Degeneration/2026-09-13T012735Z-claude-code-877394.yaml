  details: |
    Answers both CRITICAL findings and four of the five IMPORTANT findings of the round-1 review, in one push. One IMPORTANT finding is declined with evidence.

    CRITICAL 1, developmental and cognitive phenotypes. Added Global developmental delay (HP:0001263), Intellectual disability (HP:0001249), Absent speech (HP:0001344) and Cerebral atrophy (HP:0002059), all four terms read from cache/hp/terms.csv, all four wired into the pathograph as downstream targets of the degeneration node. The quotes were already in committed caches, as the review said. No frequency band is asserted on the language phenotype because the source sentence carries its own exception: a subgroup follows a more favourable course.

    CRITICAL 2, treatments. Added triheptanoin anaplerotic therapy (PMID:38668366) with a target_mechanisms link onto Krebs Cycle Flux Block, which is the point: the C7 triglyceride enters the cycle as succinyl-CoA below the aconitase step, so it refills intermediates without needing the blocked enzyme. Recorded as mechanistically rational with a promising result rather than established therapy, since the evidence is two brothers with a subjective motor endpoint. Also added a supportive-care tier, deliberately without evidence, because no cached publication reports a supportive-care outcome in this disorder.

    IMPORTANT 3, loss-of-function under-evidenced. Added the yeast-complementation sentence, graded IN_VITRO with directness INDIRECT because it is heterologous complementation rather than a measurement in human tissue. The pre-existing mapping sentence identifies the variant; this one demonstrates the functional consequence.

    IMPORTANT 4, OXPHOS exclusion outrunning the evidence. The review is right. The description now scopes the exclusion to the tissue and assay in which it was measured, notes that the same abstract reports slightly reduced glutamate oxidation, and curates the fibroblast finding (PMID:26992325) showing deficient respiration and mtDNA depletion on the flux-block node. The claim is now that the primary lesion is a Krebs-cycle block and respiratory-chain failure is not the proximate mechanism, not that oxidative phosphorylation is untouched anywhere.

    IMPORTANT 6, prevalence. Added a CASES_IN_LITERATURE, ULTRA_RARE record citing the 16-patient multicentre cohort. ORPHA:314629 could not be used: ORPHA records are built by structured-rebuild-orphanet rather than fetch-reference, and that requires the Orphadata bulk XML, which is gitignored and absent from this worktree. The notes record the roughly 100 cumulative patients reported for ACO2 deficiency and that this figure spans the whole allelic series including OPA9 rather than this entry alone.

    IMPORTANT 7, model-organism content. DECLINED for the two mouse models, and this is the finding worth reading. Both were fetched and read. PMID:41331265 is titled 'Critical role of mitochondrial aconitase in skeletal muscle maturation' and studies unloading-induced muscle atrophy. PMID:38007539 is titled 'ACO2 deficiency increases vulnerability to Parkinson's disease' and studies dopaminergic neurodegeneration. Neither mentions infantile cerebellar-retinal degeneration anywhere. They share the gene, not the disease. Curating either as an animal model of this disorder would be exactly the gene-mediated Named Entity Confusion the dataset-curation rules describe, where searching a causal gene surfaces whatever disease that gene is famous for. The decline and its reasoning are recorded in the experimental_models notes so the next reviewer does not relitigate it. What was added instead is the patient fibroblast line (PMID:26992325) as a PRIMARY_CELL_CULTURE experimental model with a MEASURES link, which genuinely is about ACO2 deficiency.

    Also worth recording: the review proposed NCIT:C133397 for supportive care and NCIT:C15304 for physical therapy. Read from the NCIT cache, C133397 is Planned End Date and C15304 is Plasmapheresis. Neither was used; NCIT:C15747 Supportive Care was read from the cache instead. This is the third confabulated-identifier instance in this batch, after the report's own NCIT:C1084 and HP errors.

    A mistake of mine in this round: I attributed the cortical-atrophy quote to PMID:30689204 when it is in PMID:22405087. Reference validation caught it before commit and the attribution was corrected by locating the actual cache file holding the sentence.

    Validation: 39/39 snippets verified, schema and terms pass, all ten whole-KB gates green.

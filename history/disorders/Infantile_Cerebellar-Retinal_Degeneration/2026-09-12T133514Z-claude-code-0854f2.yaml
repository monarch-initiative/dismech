  summary: 'Create: Infantile Cerebellar-Retinal Degeneration (ACO2, MONDO:0013802)'
  details: |
    De novo curation of infantile cerebellar-retinal degeneration from claim issue #11742.

    The mechanistically decisive finding is a negative result and it changed the shape of the entry. My own claim issue assumed the chain ran through impaired oxidative phosphorylation. The defining paper measured that and excluded it: the five respiratory-chain complexes and the pyruvate dehydrogenase complex were all normal in muscle mitochondria, while aconitase activity was severely reduced in lymphoblasts. The pathograph therefore routes through a Krebs Cycle Flux Block node rather than an OXPHOS node, and the negative enzymology is recorded as a REFUTE evidence item against the respiratory-chain alternative rather than omitted. This also has a diagnostic consequence, recorded in the diagnosis section: a conventional respiratory-chain assay will be normal in this disease, which is why plasma metabolomics and sequencing carry the diagnostic weight.

    Lump/split. ACO2 spans three presentations and this entry covers one. Biallelic variants cause this infantile neurological syndrome. Biallelic variants may also cause isolated ophthalmological phenotypes, though the literature records explicit doubt. Monoallelic variants cause dominant isolated optic atrophy, which is numerically the commonest ACO2 disease at 50 dominant index cases against 11 biallelic in one European screen. The dominant disorder is deliberately not modelled as has_subtypes here, because a subtype of a recessive disease cannot carry dominant inheritance and dismech treats mode of inheritance as a split signal. It is recorded in the genetic notes and as a CURATION_TODO discussion recommending its own entry.

    Deep research: one openscientist report was run and is committed alongside the entry. just preflight-dr returned WARN for a rival gene HP at 30 percent of ACO2 mentions. That is a false positive of a systematic kind: the 40 occurrences are HPO CURIEs of the form HP:0000001, not the haptoglobin gene. The second flagged rival, ACO1, is the yeast aconitase ortholog used for functional complementation in the primary literature and is likewise not a rival disease entity. The report's Term Validation section reported 13 of 14 checked terms as named as a different term, which is itself mostly a false-positive class: the validator reads the adjacent markdown table cell, so a phenotype row whose Type column says Clinical sign is reported as the report calling the CURIE Clinical sign.

    One curation correction worth recording. The cerebellar atrophy phenotype was first written citing the 16-patient series by its title. That failed snippet validation, correctly, since a title is not a finding. It was replaced with two serial-MRI sentences from the full text of the founding paper.

    Validation: just validate passed with 30/30 snippets verified; just validate-terms passed; check-duplicate-keys, check-entity-refs, check-causal-targets and check-qualifier-terms all clean.

  summary: 'Create: Brody Myopathy (MONDO:0010977)'
  details: |
    New entry curated from a claude_code deep-research report. Eight pathophysiology nodes running biallelic ATP2A1 loss of function through two allelic routes (truncating/splice, and missense degraded by the ubiquitin-proteasome system before reaching the SR membrane) to reduced SERCA1 density, impaired calcium reuptake, prolonged cytosolic calcium, and the electrically silent contracture that is the diagnostic discriminator. Type II fibre selectivity modelled as its own node because it explains the distribution (SERCA1 is the fast-twitch isoform; heart runs SERCA2a and is uninvolved). The compensation branch is modelled rather than left as prose because it is load-bearing for prognosis, and carries two competing mechanistic_hypotheses: pmca_extrusion_compensation (EMERGING, bovine evidence) and serca2_isoform_compensation (ALTERNATIVE, one supporting human family, refuted by both the 40-patient cohort and the bovine model). A HUMAN_MODEL_MISMATCH discussion records that the Atp2a1-null mouse dies at birth of diaphragm failure while humans have no respiratory involvement, with a hypomorphic allele series proposed to separate species biology from allele severity. Three animal models including the Atp2a1-null mouse as FAILS_TO_RECAPITULATE with required limitations and evidence. Scope: Brody DISEASE (ATP2A1-confirmed); Brody SYNDROME (gene-negative) recorded as the primary differential with its own citation. Two PMIDs cited by the DR report (PMID:41938373, PMID:18786632) were flagged unresolved by the report's own reference validation and are NOT curated; the omission and reason are recorded in entry notes. HP:0100301 was initially used for delayed muscle relaxation and is wrong (it is Muscle fiber tubular inclusions); no HPO term fits that sign, and binding it to Myotonia would encode the exact misdiagnosis the entry exists to prevent, so it is carried as free text. Validated: just validate passed (schema + terms + references); count-verified-snippets 39/39; check_folded_hyphens OK; check-title-snippets OK.

  details: |
    Addressed all five IMPORTANT review findings, all content-completeness rather than evidence integrity. Added three phenotypes (elevated creatine kinase, myalgia FREQUENT 20/34, exercise-induced muscle cramps FREQUENT 18/34). Childhood onset was requested as a phenotype but HP:0011463 sits outside the phenotypic-abnormality branch the PhenotypeTerm dynamic enum draws from and was rejected by validation; recorded instead as an OnsetDescriptor onset_category CHILDHOOD on the main stiffness descriptor, which is the schema-correct home, with the onset-and-progression sentence added as evidence on that phenotype. Added a biochemical record for SERCA activity and SERCA1 western blot, qualitative only: the reviewer independently warned against curating the numeric reference interval because it traces to PMID:41938373, one of the two non-resolving identifiers, and no reference_ranges block was added. Added histopathology with type II atrophy, fibre size variability and internal nuclei from the systematic biopsy re-review, plus absence of myonecrosis as a curated negative (one biopsy in the whole cohort), which is consistent with the mild CK elevation and separates this from the necrotising myopathies. Added a diagnosis section carrying the EMG silent-contracture provocation manoeuvre (moved from being implied only in pathophysiology), the ATP2A1 sequencing recommendation with its clinical preconditions, and SERCA1 immunohistochemistry recorded specifically as an inadequate test in isolation (PMID:10914677), since a negative immunostain is exactly where a workup tends to stop. Corrected an overclaim: the exclusion phenotype said myotonia and percussion myotonia are annotated as excluded, which asserts HPO annotation state the entry does not evidence; reworded to what the cited sentence supports. Biochemical takes notes not description, corrected after a schema failure. Validated: just validate passed; count-verified-snippets 50/50 (was 39/39); title audit 50 citations 0 m
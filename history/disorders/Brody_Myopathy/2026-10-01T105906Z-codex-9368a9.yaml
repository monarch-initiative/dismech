  summary: Review Brody myopathy mechanisms, clinical spectrum, diagnostics and experimental
    rescue evidence
  details: |
    Reviewed the existing entry and matching deep-research report against cached abstracts and available full text, including the international clinical cohort, human intrinsic pump-defect study, 2024 pediatric series, 2026 quantitative SERCA assay, bovine protein-rescue studies and negative zebrafish corrector results. Distinguished loss of pump abundance from intrinsic transport dysfunction, qualified proposed compensation, corrected phenotype denominators and malignant-hyperthermia interpretation, added childhood gait problems and rhabdomyolysis, and separated clinical care from experimental pharmacology. Recovered genuine 2008 and 2026 references previously dismissed in research notes, excluded unrelated gene-negative and animal-only clinical claims, and documented model limitations. GeneReviews/StatPearls searches found no dedicated chapter; trial search found no disease-specific interventional study.

  summary: 'Create: Autosomal Dominant Nonsyndromic Hearing Loss 41 (DFNA41, P2RX2)'
  details: |
    De novo curation of DFNA41 (MONDO:0011994, P2RX2 hgnc:15459) from the stub queue. entry_type decided as DISEASE: one causal gene, no MONDO descendants, MONDO's own definition is gene-scoped, and the reported alleles converge functionally rather than diverging. Nothing in kb/ previously mentioned P2RX2.

    Organising point: P2X2 is not a structural hair bundle protein but part of a protective feedback system. Rising sound levels release ATP into the endolymphatic compartment, ATP opens P2X2 channels on the epithelium lining it, and the resulting conductance turns down cochlear amplifier gain - which is what a temporary threshold shift is. DFNA41 is therefore a disorder of a protective mechanism, and the noise interaction is the disease rather than a lifestyle note.

    The noise interaction is modelled structurally as required by issue #9904: an environmental entry bound to ECTO:8000044 (exposure to sound radiation, already cached from Noise_Induced_Hearing_Loss) with two influences_mechanisms links - EXACERBATES onto the noise-exacerbated high-frequency phenotype, and MODULATES onto the purinergic adaptation node, because sound level is the physiological input to that mechanism rather than an aggravating agent applied to it. Entry-level evidence is present, so check-environmental-evidence passes.

    Three animal models are curated in animal_models with modeled_mechanisms: the P2rx2 null (where the adaptation mechanism was established), the allele-matched V60L knock-in, and the AAV-SaCas9 editing rescue, which carries a RESCUES link. The editing model's limitations record that juvenile intervention broadened the rescued frequency range, so the timing that works best has no counterpart in a disease diagnosed in adults.

    Acted on the automated second opinion posted to #9904, which flagged ClinGen's Moderate classification. Fetched the assertion (CGGV:assertion_c1dae6b6-4ed7-4c5a-ba4e-bcfaba026be8-2022-09-21T160000.000Z) via just clingen-rebuild and used it three ways. First, a KNOWLEDGE_GAP discussion on gene-disease validity: the entry is mechanistically rich and genetically thin, and the two are easy to confuse. Second, the ClinGen narrative reads the coexpression result as a dominant-negative mechanism, so functional_impact_category was changed from LOSS_OF_FUNCTION to DOMINANT_NEGATIVE. Third, and most importantly, ClinGen reviewed the MELAS family (PMID:25788561) and did not accept it - the evidence for pathogenicity was not strong and the variant is in gnomAD. An earlier draft of this entry cited that family as a clean natural experiment supporting the gene-disease relationship. That was corrected to PARTIAL with ClinGen's reason quoted alongside, rather than either dropping it or continuing to believe it.

    One real defect caught by just check-snippet-grading before push: the concluding sentence of PMID:23345450 is a synthesis of human and mouse results, and was graded HUMAN_CLINICAL in the environmental and treatment blocks but MODEL_ORGANISM on an animal model link. Fixed by re-quoting the animal model link with a mouse-specific sentence from PMID:23592720 rather than by re-grading a shared quote.

    Also removed a Vestibular Dysfunction phenotype from an earlier draft. It was supported only by MODEL_ORGANISM evidence, which the evidence policy says should not be the sole support for a human phenotype; no vestibular testing is reported for any molecularly confirmed DFNA41 carrier. The finding is retained in the knock-in mouse limitations, where its human status is stated as untested.

    Evidence: 8 references cited plus one ClinGen assertion; 62/62 snippets verified against the local cache. High-frequency phenotype bound to HP:0001757 rather than HP:0005101, matching the DFNB103 entry in the same batch. Hearing amplification and cochlear implantation are not curated because no DFNA41-specific report documents either; genome editing is not curated as a treatment because it is preclinical.

    Deep research: falcon report run and preflighted against MONDO:0011994, verdict PASS (P2RX2=25 mentions, next gene at 2; OMIM 608224 matched on both sides). Entry curated from primary sources regardless.

    Validation: just validate exit 0, just validate-terms exit 0, just check-entity-refs exit 0, just check-duplicate-keys exit 0, just check-snippet-grading exit 0 after the fix.

  summary: 'Review response: rebind adult-onset term, add tinnitus and zebrafish model'
  details: |
    Addressed the CHANGES_REQUESTED review on PR #9925. Rebound the Adult-Onset Hearing Impairment phenotype from the parent HP:0000407 to HP:0008615 Adult onset sensorineural hearing impairment, which exists and was wrongly claimed not to; replaced the false justifying note with one recording that PMID:31593348 and PMID:23345450 report different onset windows for the same kindred. Added a Tinnitus phenotype bound to HP:0000360 citing the ClinGen P2RX2 assertion already shipped by this PR, with frequency deliberately omitted because the source counts families rather than individuals. Disambiguated the second discussion's attaches_to from animal_models#Mouse to animal_models#P2rx2 null mouse, which all three mouse models matched by species. Rewrote the cochlear-implant NCIT note to say NCIT has no primary-implantation term rather than implying nothing in the area is reachable, after confirming NCIT:C219863 (revision surgery) is reachable from NCIT:C25218 and NCIT:C157820 (device) is not. Added a fourth animal model, the p2rx2 knockout zebrafish (PMID:41015553), with AEP threshold and otolith hair cell density readouts and a PARTIAL item bounding the loss to the auditory organ. Validated with just validate (70/70 snippets), validate-terms, validate-disorders, check-entity-refs, check-duplicate-keys and the five baseline gates, all exit 0.

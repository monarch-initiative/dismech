  summary: 'Create: Spinocerebellar_Ataxia_46'
  details: |
    New entry for SCA46 (MONDO:0033481, PLD3). Deep research: falcon requested, fell back to claude_code (report validated, 24/24 references resolved). The entry is curated as provisional: the disease rests on one Dutch family (PMID:8595484, PMID:29053796), and the PLD3 association was challenged by a Pld3 knockout mouse with no cerebellar phenotype (PMID:30312375). That challenge is recorded as REFUTE evidence, a CONTROVERSY discussion and a FAILS_TO_RECAPITULATE model link. The lysosomal nucleic-acid node is HYPOTHETICAL. Phenotypes seen only in the single atypical Indian case (PMID:38059248) are labelled as such. No GeneReviews chapter, no ClinGen curation, and MONDO records no causal gene. Validated with just validate (35/35 snippets) and the offline gates.

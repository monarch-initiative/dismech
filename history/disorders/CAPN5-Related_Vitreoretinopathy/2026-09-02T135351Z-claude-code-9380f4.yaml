  details: |
    Review response on PR #10537. This record supersedes the grade described in this entry's earlier EDIT record for the same evidence item, which is now two regrades behind; history is append-only, so that record stands as an accurate account of its own session.

    The PMID:31110225 item on the 'Aberrant Photoreceptor Synaptic Proteolysis' node quotes the paper's own limitation sentence: 'However, our proteomic analysis could not differentiate which retinal cells are affected by loss of these proteins in CAPN5-NIV'.

    Grade history for that item across this PR:
    1. The audit added it as supports: PARTIAL, to record that the paper disclaims the photoreceptor attribution the node was making.
    2. The #7439 migration (scripts/migrate_supports_enum.py) converted every PARTIAL to SUPPORT; the directness pass then set directness: INDIRECT.
    3. Now supports: NO_EVIDENCE, directness dropped.

    NO_EVIDENCE is the correct value: a sentence stating that the measurement could not localize to a cell type carries no evidence bearing on whether the proteolysis is photoreceptor-specific. Grading it SUPPORT — at any directness — asserts that a paper's own limitation supports the claim it limits. The item is kept rather than deleted because it still bounds the node's CL:0000210 binding, which is why the audit cited it.

    The explanation's trailing clause 'so it reaches the claim only by inference' was also dropped: it restated the definition of INDIRECT and so argued for the grade that had just been removed.

    This is the third case in this PR where the migration's blanket PARTIAL -> SUPPORT conversion needed a curator's judgment; the other two were caught during the directness pass.

    Validation: linkml-validate clean; snippet audit verified (snippet text unchanged); duplicate-key, entity-ref and snippet-grading checks pass.

  summary: 'Create: CAPN5-Related Vitreoretinopathy (ADNIV, MONDO:0100450)'
  details: |
    De-novo curation of CAPN5-related vitreoretinopathy (ADNIV/NIV/VRNI, OMIM:193235) from issue #4008's Acquired/Common retinopathy list. Sourced via a claude_code deep-research run (research/CAPN5-Related_Vitreoretinopathy-deep-research-claude_code.md, 16 web searches, 20 citations) after falcon returned a transient network error; NEC preflight passed (gene CAPN5/HGNC:1482 and OMIM:193235 both match the MONDO:0100450 record). 6-node pathophysiology chain: CAPN5 gain-of-function protease hyperactivation -> aberrant photoreceptor synaptic proteolysis -> innate/adaptive autoimmune uveitis (branches to) -> oxidative-stress photoreceptor degeneration (conforms_to photoreceptor_degeneration#Photoreceptor Metabolic and Oxidative Stress) and opticin-loss/neovascularization -> fibrotic proliferative vitreoretinopathy and blindness (conforms_to fibrotic_response#Architectural Distortion and Organ Dysfunction). Modeled canonical gain-of-function vs. refuted-in-text haploinsufficiency as mechanistic_hypotheses (DEPRECATED status, since REFUTED is not a valid enum value). Three has_subtypes capturing the genotype-severity spectrum (Classic catalytic-domain, Mild regulatory-domain G376S, Syndromic Severe de novo R289W with hearing loss/developmental delay). 7 PMIDs fetched and verified (23055945, 23861576, 25994508, 29040051, 29472286, 31110225, 32274441); all evidence_source classifications checked (MODEL_ORGANISM kept distinct from HUMAN_CLINICAL for the mouse-model claims). Two snippet fixes needed during validation: trimmed a bracketed citation-number artifact ('[32]') that the reference validator could not match despite being an exact quote, and rewrote a TNF-alpha snippet to avoid the Greek alpha character (same category of Windows-local encoding mismatch seen on other entries this session -- both were exact matches under manual whitespace-normalized substring checks). New MONDO:0100450 term manually appended to cache/mondo/terms.csv and cache/enums/diseaseterm_*.csv (does not auto-populate). Note: 'just validate' on this Windows machine has a reproducible side effect of touching all ~2472 references_cache/*.md files (reference_id frontmatter re-quoting) plus intermittently mojibake-corrupting two unrelated MONDO rows -- both were reverted before staging so the commit is scoped to just this entry's files.

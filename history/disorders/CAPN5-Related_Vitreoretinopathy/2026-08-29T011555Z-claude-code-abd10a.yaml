    # Fix summary: CAPN5-Related Vitreoretinopathy

    File: `/home/user/dismech/kb/disorders/CAPN5-Related_Vitreoretinopathy.yaml`
    Review: `reviews/CAPN5-Related_Vitreoretinopathy.md` (5 MAJOR + 8 MINOR)

    ## Findings fixed

    1. **MAJOR — prevalence note contradicted by cited source.** Rewrote `prevalence[0].notes`: the
       absence-from-databases claim is now scoped to the founding-kindred variants (dbSNP/1000 Genomes,
       per PMID:23055945), and the note records the sourced ExAC frequencies — G267S 0.023% (European) /
       0.047% (Finnish), G376S 0.017% (South Asian) with the ~1-in-6,000 carrier-rate estimate and its
       subclinical-disease caveat. Added three exact-quote evidence items (1× PMID:23055945 dbSNP
       sentence, 2× PMID:29040051 frequency + carrier-rate sentences), all HUMAN_CLINICAL.

    2. **MAJOR — photoreceptor attribution of the vitreous proteomic signal.** Node description now says
       proteolysis at the retinal ribbon synapse is *hypothesized*, notes substrates are unidentified,
       flags GluR4 as expressed in rod bipolar cells, and states the proteomic analysis could not
       differentiate which retinal cells are affected ("may contribute" hedge restored). Explanation
       "directly demonstrates loss of photoreceptor synaptic proteins" → "documents decreased synaptic
       proteins … could not attribute the losses to a specific retinal cell type". Added a
       `supports: PARTIAL` evidence item quoting the paper's own disclaimer sentence (PMID:31110225).
       Node **name and `cell_types` binding left unchanged** per the no-rename/no-binding-change protocol
       (renaming would break `downstream` edges); noted here as residual.

    3. **MAJOR — HEK293T mislocalization asserted as photoreceptor + graded HUMAN_CLINICAL.** Top-level
       description now says "in transfected-cell studies, mislocalizes from the plasma membrane…";
       pathophysiology-node description names HEK293T explicitly and carries the source's double hedge
       ("suggesting the mutations may alter a membrane-binding property"). Both occurrences of the
       mislocalization quote (genetic + pathophysiology, PMID:23055945) regraded `IN_VITRO` (kept
       consistent with each other, per the same-sentence grading rule); explanations rewritten to state
       the cell-line context. The adjacent knockout-mouse item stays MODEL_ORGANISM.

    4. **MAJOR — treatments generalized from one patient's procedure list.** Cryotherapy, Ruthenium
       Plaque Brachytherapy, and Pars Plana Vitrectomy descriptions restated as the single reported
       patient's course (context — progressive vitreoretinopathy, recurrent vitreous hemorrhages,
       bilateral tractional detachments — comes from the same cached case description in PMID:29040051),
       each with "limited to single-case experience". Removed the unsourced non-perfusion indication,
       Stage III/IV assignments, and the steroid-implant fibrotic-capsule rationale entirely (no cached
       source states them).

    5. **MAJOR — Abnormal electroretinogram supported by mouse alone.** Added two HUMAN_CLINICAL items
       from already-cached sources: PMID:23055945 ("In Stage I disease, there are mild cells (white dots)
       in the vitreous (orange) and a reduced b-wave on electroretinography (ERG).") and PMID:32274441
       (quantitative b-wave attenuation to 60–80% of normal with preserved a-waves). Mouse item retained
       as corroborating, explanation relabeled "Corroborating". Also removed the photoreceptor-synapse
       attribution from the phenotype description (→ "inner-retina synaptic signaling defect", matching
       the sources).

    6. **MINOR — definitional snippets.** Opticin item: snippet replaced with the actual downregulation
       result sentence ("Among the significantly-downregulated proteins … retinoschisin (RS1), and opticin
       (OPTC)"); node description hedged to "may contribute" per the source. Versican item: snippet
       extended to include "Among the downregulated pro-teins was versican (VCAN/CSPG2)." (the quote
       preserves the source PDF's line-break hyphenation, noted in the explanation); node description
       hedged to "may disrupt".

    7. **MINOR — corticosteroid evidence.** Added the exact-fit PMID:29040051 sentence ("intraocular
       steroids suppress inflammatory cells and neovascularisation but not retinal fibrosis or
       degeneration in ADNIV patients"), HUMAN_CLINICAL. Description trimmed of the unsourced "mainstay"
       claim and aligned to the quoted incomplete-response finding. Original disease-target item retained.

    8. **MINOR — truncated anti-VEGF snippet.** Extended through the outcome clause ("…and successfully
       mitigated neovascularization, inflamma-tory cell infiltration, and persistent fibrosis in these
       patients"), preserving the PDF's mid-word line-break hyphenations ("inhibi-tor", "inflamma-tory";
       flagged in the explanation). Verified by the snippet audit.

    9. **MINOR — G376S mechanism/domain.** Removed the "(or, for G376S, the C2/regulatory domain)"
       mechanism claim from the hyperactivation node; added "The regulatory domain-III variant G376S has
       not been functionally assayed and is only hypothesized to have a milder effect". All three
       "C2/regulatory domain" labels corrected to "regulatory domain-III" (per PMID:32274441): genetic
       notes, variant row, subtype description. Genetic notes now say "the functionally tested variants
       are gain-of-function" instead of asserting it for all.

    10. **MINOR — "non-progressive" subtype claim.** Mild Regulatory-Domain subtype description restated
        as the single 19-year-old case examined at one visit, including the periphlebitis finding, with
        "Long-term natural history is not established" replacing the non-progressive claim, and "without
        overt uveitis" softening.

    11. **MINOR — haploinsufficiency "refuted" + grading.** Hypothesis description now says the founding
        paper left the question open but judged gain of function more likely; model "disfavored" rather
        than flatly "refuted" by that paper. Discussion-reasoning item regraded `OTHER` with an
        explanation saying so. Added an `IN_VITRO`, `supports: REFUTE` item quoting the PMID:25994508
        activity-assay result (R243L hyperactive, not hypoactive). `status: DEPRECATED` retained.

    12. **MINOR — uncited K250N row and FEVR gene list.** Fetched **PMID:25856303** (Bassuk 2015) into the
        cache via the fetcher and added a gene-level HUMAN_CLINICAL evidence item quoting the abstract
        sentence that documents c.750G>T / p.Lys250Asn in exon 6 and the stage III uveitic/neovascular
        phenotype — this sources both the variant row's cDNA change and its phenotype description. FEVR
        distinguishing feature: dropped the uncited gene list (FZD4/LRP5/TSPAN12/NDP); replaced with the
        cached PMID:29040051 recommendation (FEVR phenotype, negative typical-FEVR-gene testing → CAPN5
        testing) and added that sentence as an `OTHER`-graded evidence item.

    13. **MINOR — hedged causal chains stated as established.** Uveitis node: "trigger" → "may trigger",
        with "how the innate and adaptive arms interact … remains under investigation"; added a
        HUMAN_CLINICAL PMID:31110225 item quoting the normal-TNF-α/infliximab-failure sentence so the
        TNF clause is now cited on the node. Oxidative node: "drives" → "indicating reduced defense
        against oxidative stress that may leave photoreceptors vulnerable … degeneration follows".

    ## Intentionally skipped / residual

    - Node name "Aberrant Photoreceptor Synaptic Proteolysis" and its `cell_types: photoreceptor cell`

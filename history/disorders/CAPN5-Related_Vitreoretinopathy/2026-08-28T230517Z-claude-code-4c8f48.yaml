    `description`, `disease_term`, `synonyms`, `parents`, `has_subtypes` (3), `inheritance`, `genetic` (incl. 6 `variants`), `pathophysiology` (6 nodes + `downstream` edges), `mechanistic_hypotheses` (2), `phenotypes` (8), `prevalence`, `diagnosis`, `differential_diagnoses` (3), `treatments` (6).

    ## Cross-cutting checks (Step 4)

    - **Descriptions/notes asserting facts not in any cited source:** findings 1 (contradicted by cache), 4 (cryotherapy/vitrectomy indications), 9 (G376S mechanism, C2 vs domain-III), 10 ("non-progressive"), 12 (K250N phenotype, FEVR gene list). Finding 1 is the serious one because a cited source states the opposite.
    - **Model-organism evidence as sole support for a human phenotype:** finding 5 (*Abnormal electroretinogram*). Checked all eight phenotypes — this is the only instance; the other seven rest on human clinical or histopathological sources. The two `MODEL_ORGANISM` items on `pathophysiology` nodes (`PMID:25994508` mouse transcriptomics; `PMID:23055945` knockout mice) are each paired with human evidence on the same node, which is correct.
    - **Same quoted sentence graded with different `evidence_source` values:** none. `PMID:23055945` appears five times and `PMID:31110225` six times, but each grade sits on a distinct sentence. Note the *"Capn5 knockout mice have no observable phenotype"* sentence is used twice and graded `MODEL_ORGANISM` both times — consistent, as required.
    - **Named Entity Confusion:** none in the gene/disease sense — CAPN5/ADNIV pairing is correct everywhere, and the entry correctly keeps CAPN3/limb-girdle muscular dystrophy as an explicit contrast rather than importing its findings. The confusion present is *anatomical* rather than nosological: finding 2 (bipolar-cell/unattributed proteins presented as photoreceptor proteins) and finding 3 (HEK293T cells presented as photoreceptors).

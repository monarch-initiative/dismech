    # Review: CAPN5-Related Vitreoretinopathy

    - **File:** `/home/user/dismech/kb/disorders/CAPN5-Related_Vitreoretinopathy.yaml`
    - **Review date:** 2026-08-28
    - **Mechanical audit:** `dismech.reference_snippet_audit` — **37/37 snippets verified** against cached references. No unverified snippets.

    ## Verdict: NEEDS_FOLLOWUP

    Every snippet is an exact quote and the gene/disease pairing is correct throughout — this is a well-sourced entry built on the right six papers. But several node and treatment descriptions state as established fact what the cited papers explicitly present as speculation or explicitly disclaim, one prose claim is contradicted by a source cited in the same file, and a human phenotype rests on mouse evidence alone. Findings 1–4 are MAJOR.

    ## Findings

    ### 1. MAJOR — The `prevalence` note says pathogenic variants are "essentially absent from population reference databases"; a source cited in this same file reports population allele frequencies for two of them
    **Location:** `prevalence[0].notes`.
    **Entry claims:** "pathogenic variants are essentially absent from population reference databases (gnomAD/1000 Genomes/dbSNP)."
    **What the papers actually say:**
    - `PMID:29040051` (Randazzo), on G267S: *"This variant has been identified at an allele frequency of 0.023% and 0.047% in European and Finnish populations respectively within the Exome Aggregate Consortium (ExAC) database"*; and on G376S: *"present at an allele frequency of 0.017% in the South Asian population … The prevalence of 0.017% on the ExAc database would equate to a carrier rate of about 1 in 6,000 in the South Asian population."*
    - `PMID:29472286` (Velez): *"variants in the CAPN5 G2 loop have been previously reported in the GnoMAD browser, suggesting that some mutations in this region of the protein may be tolerated."*
    **Why it matters:** the absence-from-databases claim is true only of the two founding variants (`PMID:23055945`: "None of the three variants were listed in the dbSNP or 1000 Genome databases"), and the entry generalizes it to all pathogenic variants. A cited source not only contradicts it but derives a carrier-rate estimate from the very frequencies the note denies exist. This is exactly the class of prose-versus-cache contradiction `just check-source-defect-claims` exists to surface. Fix: scope the sentence to the founding R243L/L244P alleles and record the ExAC/gnomAD frequencies for G267S and G376S.

    ### 2. MAJOR — The *Aberrant Photoreceptor Synaptic Proteolysis* node attributes the proteomic signal to photoreceptors, which the cited paper explicitly declines to do
    **Location:** `pathophysiology` → *Aberrant Photoreceptor Synaptic Proteolysis* (description + `PMID:31110225` evidence explanation).
    **Entry claims:** description — "Hyperactive, mislocalized calpain-5 **promiscuously proteolyzes normal substrates at the photoreceptor ribbon synapse** … Vitreous proteomics of CAPN5-NIV patients shows early loss of synaptic proteins including neurexin-2, glutamate receptor 4, and neurofascin, **correlating with** the earliest clinical finding — reduced ERG b-wave amplitude." Explanation — "Vitreous proteomics **directly demonstrates** loss of **photoreceptor** synaptic proteins in CAPN5-NIV patients."
    **What the paper actually says (`PMID:31110225`):** *"However, our proteomic analysis could not differentiate which retinal cells are affected by loss of these proteins in CAPN5-NIV."* Of the named proteins, *"GluR4 is a metabotropic glutamate receptor expressed in the **rod bipolar cells** of the mammalian retina"*. The linkage is hedged throughout: *"The loss of these synaptic proteins **may contribute** to the synaptic signaling defect seen in early CAPN5-NIV disease."* The paper also states the substrates are unknown: *"it is not known how a hyperactive protease leads to uveitis"*, and `PMID:29040051` agrees — *"The pathogenic mechanism causing ADNIV is unknown as the specific protein substrates for Calpain-5 have not been identified."* The mouse ERG finding the node leans on describes *"a selective loss of the b-wave indicating an **inner-retina** signaling defect"*.
    **Why it matters:** three distinct overreaches compound here — (a) proteins decreased in vitreous are asserted to be *photoreceptor* proteins when the paper disclaims cell attribution and assigns one of them to bipolar cells; (b) a *decrease in abundance* is asserted to be *proteolysis by calpain-5*, a mechanism no cited source demonstrates; (c) "directly demonstrates" replaces the source's "may contribute". The node name itself ("Photoreceptor Synaptic Proteolysis") encodes the unsupported attribution, and it is the hinge between the genetic node and the whole downstream cascade.

    ### 3. MAJOR — Mislocalization is attributed to the photoreceptor plasma membrane and graded `HUMAN_CLINICAL`; it was shown in transfected HEK293T cells
    **Location:** top-level `description`; `pathophysiology` → *CAPN5 Gain-of-Function Protease Hyperactivation* (description + `PMID:23055945` first evidence item, `evidence_source: HUMAN_CLINICAL`); `genetic` → CAPN5 (`PMID:23055945`, `HUMAN_CLINICAL`).
    **Entry claims:** "Mutant calpain-5 is hypersensitized to calcium and **mislocalizes from the photoreceptor plasma membrane to the cytosol**"; node description repeats "cause its mislocalization from the **photoreceptor** plasma membrane to the cytosol"; evidence graded `HUMAN_CLINICAL`.
    **What the paper actually says:** the localization experiment is a cell-line transfection — *"To determine the effect of the ADNIV-causing mutations on the intracellular compartmentalization of calpain-5, **HEK293T cells** were transfected with normal and mutant CAPN5 constructs … Immunocytochemistry of HEK293T cells showed normal calpain-5 to be localized near the cell surface. In contrast, both ADNIV mutants were found largely within the cytoplasm. This **suggests** that the ADNIV-causing mutations **may** alter a membrane binding property of the protein."* Separately, calpain-5 protein was detected in human photoreceptors by immunohistochemistry — but no mutant-protein localization was assessed in photoreceptors.
    **Why it matters:** two defects. (i) `evidence_source` is wrong: a transfected-cell-line immunocytochemistry experiment is `IN_VITRO`, not `HUMAN_CLINICAL` — and this grade appears twice (pathophysiology and `genetic`). (ii) The photoreceptor attribution is a system substitution: the mislocalization was never observed in photoreceptors, and the source double-hedges ("suggests … may"). The entry also drops the hedge entirely. Note the same paper's knockout-mouse sentence *is* correctly graded `MODEL_ORGANISM` on the adjacent item, so the file already distinguishes evidence types where it chose to.

    ### 4. MAJOR — Three treatments are generalized from one patient's procedure list, with indications and rationales no cited source states
    **Location:** `treatments` → *Cryotherapy*, *Ruthenium Plaque Brachytherapy*, *Pars Plana Vitrectomy* — all three cite the identical sentence from `PMID:29040051`.
    **Entry claims:**
    - Cryotherapy: "Ablative cryotherapy **is used for peripheral retinal non-perfusion and to reduce the drive for neovascularization in the proliferative (Stage III) phase**."
    - Vitrectomy: "Vitrectomy is performed for vitreous hemorrhage, epiretinal membrane, and tractional retinal detachment in advanced (Stage IV) disease, **and to excise fibrotic capsules that form around intravitreal steroid implants**."
    **What the paper actually says:** the entire cited basis is one clause in a single case description of Patient 1 — *"He had multiple cryotherapy treatments, left eye ruthenium plaque brachytherapy and underwent bilateral pars plana vitrectomies."* No indication, no stage assignment, no mechanism, no outcome, and n=1. Nothing in any cached source in this file mentions retinal non-perfusion as the cryotherapy target, or fibrotic capsules around steroid implants.
    **Why it matters:** this is the case-report-to-general-claim pattern, three times over, plus two clinical rationales that appear in no cited source. The underlying fact (these procedures were used in a CAPN5-NIV patient) is correct and citable; the indications, staging, and mechanisms attached to it are not. Either source them or restate them as one patient's course.

    ### 5. MAJOR — *Abnormal electroretinogram*, a human phenotype, is supported by mouse evidence alone
    **Location:** `phenotypes` → *Abnormal electroretinogram* (`HP:0000512`), sole evidence `PMID:25994508`, `evidence_source: MODEL_ORGANISM`.
    **Entry claims:** "Reduced or absent ERG b-wave is often the earliest objective abnormality" in the disease; the only cited support is *"Electroretinography showed **mutant mouse eyes** had a selective loss of the b-wave."*
    **What the human sources say — and they are already cached in this file:** `PMID:23055945` reports for the human kindreds *"early loss of the b-wave on electroretinography (Figure 1C)"* and *"In Stage I disease, there are mild cells (white dots) in the vitreous and a **reduced b-wave on electroretinography (ERG)**"*; `PMID:32274441` reports human ERG quantitatively — *"attenuation of the b-wave to 60–80% of normal in OU in the patient"*, *"loss of the ERG b-wave at age 45 and 69"*.
    **Why it matters:** direct violation of the repo rule "Model organism evidence should not be the only support for human phenotypes". The fix is cheap — two already-cited, already-cached human sources state the finding explicitly. (The mouse item is legitimate as *corroborating* evidence and is correctly graded.)

    ### 6. MINOR — Definitional snippets used to support downregulation claims they do not contain
    **Location:** `pathophysiology` → *Opticin Loss and Pathologic Retinal Neovascularization* (`PMID:31110225`, first item) and *Fibrotic Proliferative Vitreoretinopathy and Progressive Blindness* (`PMID:31110225`, first item).
    **Entry claims:** explanations assert opticin is "downregulated in CAPN5-NIV" and that versican loss is "the proteomic correlate of vitreous structural breakdown".
    **What the snippets say:** "Opticin is an extracellular matrix glycoprotein associated with the collagen-integrin matrix in the vitreous." / "Versican is a chondroitin sulfate proteoglycan involved in maintaining the physiologic structure of the vitreous." Neither says anything about downregulation or about CAPN5-NIV.
    **What the paper does say, in adjacent sentences:** *"Among the significantly-downregulated proteins were several proteins involved in retinal function: retinoschisin (RS1), and **opticin (OPTC)** … downregulation of opticin may contribute to the increased retinal neovascularization seen in these patients"*; *"Among the downregulated proteins was **versican (VCAN/CSPG2)**."*
    **Why it matters:** the claims are true and the correct quote is one sentence away in the same cache file; only the quote boundaries are wrong. Low severity, easy fix.

    ### 7. MINOR — Corticosteroid treatment evidence establishes the disease target, not the treatment
    **Location:** `treatments` → *Corticosteroid Therapy*, sole evidence `PMID:23861576`, snippet "Mutations in CAPN5 trigger autoimmune uveitis characterized by inflammatory T-cells and severe neovascularization."
    **Entry claims:** corticosteroids are "the mainstay for controlling active intraocular inflammation, though the response is often incomplete and does not halt the degenerative component of disease."
    **What is available and uncited:** `PMID:29040051` states precisely this — *"intraocular steroids suppress inflammatory cells and neovascularisation but not retinal fibrosis or degeneration in ADNIV patients"* — and `PMID:31110225` supplies the failure-of-conventional-therapy angle. The quoted snippet supports neither the "mainstay" claim nor the incomplete-response claim.
    **Why it matters:** the treatment card's substantive claim is unevidenced while an exact-fit sentence sits in an already-cited cache file.

    ### 8. MINOR — Anti-VEGF snippet is truncated mid-word and stops short of the clause that supports the description
    **Location:** `treatments` → *Anti-VEGF Therapy (Bevacizumab)*, `PMID:31110225`.
    **Entry claims:** description — bevacizumab "**successfully mitigated neovascularization** in CAPN5-NIV patients". Snippet: "Based on this, we repositioned bevacizumab (anti-VEGF monoclonal antibody), intravitreal methotrexate (T-cell inhibi-".
    **What the paper says:** the sentence continues "…tor), and tocilizumab (anti-IL-6 monoclonal antibody) **and successfully mitigated neovascularization, inflammatory cell infiltration, and persistent fibrosis in these patients**."
    **Why it matters:** the quote is cut mid-word at a PDF line break and terminates just before the outcome clause that actually supports the description. It verifies mechanically but reads as a defect and under-supports the claim.

    ### 9. MINOR — Mechanism described for G376S that no source characterizes
    **Location:** `pathophysiology` → *CAPN5 Gain-of-Function Protease Hyperactivation*, description.
    **Entry claims:** "Heterozygous missense mutations near the calcium-sensitive gating loop of the calpain-5 catalytic core (**or, for G376S, the C2/regulatory domain**) increase calcium sensitivity and catalytic activity of the enzyme and cause its mislocalization."
    **What the papers say:** activity was measured for R243L (`PMID:25994508`) and R289W vs R243L (`PMID:29472286`); mislocalization for R243L and L244P (`PMID:23055945`). G376S was never assayed — `PMID:29040051` only *hypothesises*: *"it is reasonable to hypothesise that a mutation in the regulatory domain may have a less severe effect on protein function than that in the catalytic domain"*, and states the pathogenic mechanism is unknown. `PMID:32274441` places G376S "within **regulatory domain-III**", not the C2 domain as the entry says (also in the `Mild Regulatory-Domain` subtype description).
    **Why it matters:** a mechanistic property and a domain assignment are asserted for a variant that has never been functionally tested; the domain label also disagrees with the cited source. The disease-level "severity correlates with degree of protease hyperactivation" claim *is* sourced (`PMID:32274441`, `PMID:29472286`) and should stay.

    ### 10. MINOR — "Mild Regulatory-Domain" subtype described as "non-progressive"; the single case is one cross-sectional exam
    **Location:** `has_subtypes` → *Mild Regulatory-Domain*, description.
    **Entry claims:** "Presents as an incidental, **non-progressive** or slowly progressive peripheral pigmentary degeneration with preserved visual acuity, without uveitis or neovascularization."
    **What the paper says (`PMID:29040051`):** the G376S patient is a 19-year-old seen once — asymptomatic incidental finding, VA 6/6 and 6/5, no follow-up reported. The paper also notes *"a small area of periphlebitis with leakage temporally in the left eye"*, i.e. a vascular-inflammatory sign. `PMID:32274441` says of G376S that it *"had a similar disease onset occurring at age nineteen"*, which sits awkwardly with "non-progressive".
    **Why it matters:** "non-progressive" is a natural-history claim that no observation in any cited source can support; the periphlebitis finding also softens "without uveitis".

    ### 11. MINOR — Discussion-inference and reasoning sentences graded `HUMAN_CLINICAL`; "refuted" is stronger than the source
    **Location:** `mechanistic_hypotheses` → *Refuted Haploinsufficiency Model*, `PMID:23055945` (`supports: REFUTE`, `evidence_source: HUMAN_CLINICAL`).
    **Entry claims:** the model "**is refuted** by the normal phenotype of Capn5-null mice and by biochemical data showing the disease variants are catalytically hyperactive."
    **What the paper says:** *"Although these mutations could cause disease through haploinsufficiency, **it seems more likely** that they result in a gain of function"*, and closes the section with *"**Whether caused by a gain or loss of function** of CAPN5, it is likely that the further elucidation of the pathogenic mechanism …"*.
    **Why it matters:** the quoted sentence is authors' reasoning in a Discussion, not human clinical data (`OTHER` fits better; the same paper's knockout sentence is correctly `MODEL_ORGANISM` two blocks up), and the founding paper explicitly leaves the question open rather than refuting it. The hyperactivity data that make the case (`PMID:25994508`, `PMID:29472286`) are real and are cited elsewhere in the file — cite them here instead.

    ### 12. MINOR — Uncited factual claims in `genetic.variants` and `differential_diagnoses`
    **Locations and claims:**
    - `genetic.variants` → `p.Lys250Asn (c.750G>T)`, "Severe uveitis, retinal neovascularization/detachment". K250N appears in this file's caches only as a name in a figure legend (`PMID:29472286`: "along with the three prior ADNIV mutations, p.Arg243Leu, p.Leu244Pro, and p.Lys250Asn"). Its phenotype description tracks the title of Bassuk 2015 ("Structural modeling of a novel CAPN5 mutation that causes uveitis and neovascular retinal detachment"), which is **not cited or cached in this entry**; the cDNA change `c.750G>T` is likewise unverifiable here.
    - `differential_diagnoses` → *Familial exudative vitreoretinopathy*: "FEVR is caused by distinct Norrin/Wnt-pathway genes (FZD4, LRP5, TSPAN12, NDP), not CAPN5." No cited source names these genes; `PMID:29040051` mentions FEVR only as a differential in which "genetic testing for the typical FEVR genes is negative".
    **Why it matters:** both are almost certainly correct textbook content, but neither is traceable to a cached source in this file. Adding Bassuk 2015 to the cache would resolve the K250N row and is worth doing anyway, since the entry's `Classic` subtype is defined partly by that variant.

    ### 13. MINOR — Node descriptions state hedged causal chains as established
    **Locations:**
    - *Innate and Adaptive Autoimmune Uveitis*: "Aberrant synaptic proteolysis and the resulting cellular stress **trigger** local innate immune activation … followed by dense CD3+ T-lymphocyte infiltration." `PMID:31110225` offers this as an alternative speculation: *"Alternatively, hyperactive CAPN5 activity **may** cause tissue injury that triggers non-specific activation of these innate immune elements … Aberrant proteolysis of retinal CAPN5 substrates by a hyperactive protease **may similarly** lead to exposure of peptide epitopes … **Further research, however, is required** to elucidate the interplay between the innate and adaptive immune system in CAPN5-NIV pathogenesis."*
    - *Oxidative Stress-Driven Photoreceptor Degeneration*: "loss of vitreous antioxidant defenses … **drives** a retinitis-pigmentosa-like pigmentary photoreceptor degeneration". The node's sole evidence documents only the *absence* of antioxidant proteins in vitreous; the paper concludes at *"early CAPN5-NIV stages are characterized by reduced defense against oxidative stress"* and speculates about SOD-mimetic prevention. (The RP-versus-clumped-pigment distinction in the same description **is** properly supported by `PMID:32274441`.)
    - The node description's TNF-alpha clause ("Vitreous TNF-alpha levels are normal, explaining why patients fail conventional anti-TNF immunosuppression") is accurate and directly quotable from `PMID:31110225` — but no evidence item on that node cites the paper for it.
    **Why it matters:** the causal ordering of the pathograph is presented with more confidence than the literature carries. The mechanism arrows themselves are reasonable; the prose should carry the sources' hedges.

    ## Coverage

    - **Total evidence items in file:** 37 (each carries exactly one snippet; the audit's 37/37 equals the evidence-item count).
    - **Examined:** 37 / 37 — every evidence item in `inheritance`, `genetic`, `pathophysiology`, `mechanistic_hypotheses`, `phenotypes`, `prevalence`, `diagnosis`, `differential_diagnoses`, and `treatments` was read against its cached reference.
    - **References resolved from cache:** `PMID:23055945` (full text PDF), `PMID:23861576`, `PMID:25994508`, `PMID:29040051` (full text), `PMID:29472286` (full text PDF), `PMID:31110225` (full text PDF), `PMID:32274441` (full text). All seven present and read in full; none missing.
    - **Not cached and relevant:** Bassuk et al. 2015 (`PLoS One` 10:e0122352, structural modeling of K250N) is referenced implicitly by the `Classic` subtype and the K250N variant row but is neither cited nor cached — see finding 12.
    - **No PubMed lookups were needed** — five of seven references have full text in cache, which resolved every doubtful claim (particularly the HEK293T localization experiment and the proteomics cell-attribution disclaimer).


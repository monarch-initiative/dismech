  summary: 'Create: TRMU-Related Acute Infantile Liver Failure'
  details: |
    Created kb/disorders/TRMU-Related_Acute_Infantile_Liver_Failure.yaml for MONDO:0013111. Deep research used the claude_code provider; preflight-dr returned PASS with TRMU mentioned 46 times and OMIM 613070 matching on both sides. The report's own reference validation resolved 12 of 12 identifiers with none unresolved, and its term validation resolved all CURIEs, with the three name mismatches all being markdown formatting artifacts rather than wrong terms. A GeneReviews chapter exists, PMID 37184193 TRMU Deficiency; it was fetched, tagged GeneReviews in the top-level references block, and its Clinical Characteristics, Management and Agents to Avoid sections were cross-referenced into phenotypes, progression and treatments. Ten references cited, all cached; 77 of 77 snippets verified. Two large cohort papers, PMID:36305855 with 62 patients and PMID:33485800 with six treated infants, were cached by the citation pass and initially left uncited; a review round caught that two claims in the entry were wrong as a result, and both papers are now cited. The mechanism is modelled with the developmental cysteine shortage as a second trigger node alongside the genetic lesion, because that co-requirement is what makes the disease time-limited and is also what the treatment acts on. Three discussions record that the cysteine window has never been measured, that the proteostress arm comes from the sister enzyme Mto1 rather than from TRMU and conflicts with what the correct-enzyme mouse reports, and that mortality and the Leigh-like presentation sit uneasily with the label reversible. Two snippets initially failed exact matching and were corrected against the cache rather than reworded: one had reconstructed a sentence around Mtu1LKO that the source phrases differently, and one included a bracketed citation marker that the validator strips.

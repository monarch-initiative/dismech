  summary: 'Gene-family review: TRMU'
  details: |
    TRMU was on its variant node only, which binds no molecular function. It now also sits on the 2-thiouridylation node, which binds tRNA-5-taurinomethyluridine 2-sulfurtransferase activity (GO:0061708) DECREASED, the MTU1 activity whose loss the founding cohort measured as markedly reduced 2-thiouridylation (PMID:19732863). The genetic record gains the entry's autosomal recessive inheritance block (HP:0000007).

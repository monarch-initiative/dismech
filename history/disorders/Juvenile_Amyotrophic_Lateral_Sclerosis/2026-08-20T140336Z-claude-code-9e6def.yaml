  summary: 'Address remaining review findings on PR #9090'
  details: |
    Second review-response session for PR #9090, addressing the findings left open after the PR Shepherd bot resolved findings 1 and 5.

    Finding 2 - deep-research artifact. Ran just research-disorder claude_code, producing research/Juvenile_Amyotrophic_Lateral_Sclerosis-deep-research-claude_code.md plus its citations sidecar. The report's own reference-validation pass resolved 37 of 37 references with zero unresolved and zero off-topic. The mandatory NEC preflight against MONDO:0017593 returned SKIP, as predicted, because MONDO records no causal gene for the term and the gene-dominance check therefore cannot discriminate. Falling back to the manual check: the report's gene profile is FUS 47, ALS2 44, SETX 39, SOD1 24, SIGMAR1 21, which is dominated by genuine juvenile ALS loci and shows no wrong-entity signal. SOD1 at 24 mentions is noted as the one adult-ALS-associated gene present, but it is not dominant and juvenile SOD1 disease is real.

    The report surfaced one substantive finding that changed the entry. The L-serine treatment for SPTLC1-related disease carries a published caution that its utility is uncertain and may potentially worsen the overproduction of sphingolipids. This was verified verbatim against the cached PMID:34946884, including the source's own misspelling of sphingolipids, and added as a PARTIAL evidence item with a note. It matters mechanistically rather than merely bibliographically: the SPTLC1 lesion curated in this entry is a gain-of-function escape from ORMDL inhibition causing excess canonical sphingolipid synthesis, so supplying additional substrate to an already unrestrained enzyme could aggravate the primary defect. The treatment is now presented as a proposed option under active question rather than an established therapy.

    Finding 3 - the diagnosis and treatment split was completed. The previous round had copied the testing content into a new diagnosis section while leaving treatments[1] byte-for-byte unchanged, so the same PMID:38540369 snippet was asserted from two places and a diagnostic procedure remained mis-filed under treatments. The treatment is now rewritten as genetic counseling proper - recurrence-risk discussion, cascade carrier testing, reproductive options - keeping NCIT:C15240, and its evidence is now the GeneReviews GENETIC COUNSELING quote on carrier and prenatal testing rather than the duplicated testing sentence. The description records that recurrence risk differs sharply across subtypes, 25 percent per pregnancy for the recessive loci against dominant or de novo mechanisms elsewhere, which is why counseling is downstream of the molecular diagnosis. The diagnosis section now solely owns the testing strategy.

    Finding 4 - added a histopathology section with two findings. The first records the FUS-immunoreactive, TDP-43-negative basophilic inclusions in spinal motor neurons, carrying three already-verified snippets: the immunohistochemical result itself, the autopsy description pairing inclusions with severe motor neuron loss, and the reciprocal control observation that late-onset sporadic ALS shows no FUS accumulation. The second records the extramotor distribution in cortical layers IV-V and brainstem nuclei. Both are scoped with subtype ALS6-JALS and a context field naming the tissue, since the HistopathologyFinding class has no tissue slot. A notes field states plainly that this is scoped to FUS-related disease and that the other five subtypes have no comparably characterized aggregate pathology, so the section is not read as the neuropathology of juvenile ALS as a whole, and that the evidence base is two autopsy cases.

    Suggestion 10 and suggestion 6 were resolved together. The GeneReviews clinical-characteristics quote was additionally attached to the Pseudobulbar Affect and Sensory Axonal Polyneuropathy phenotype entries, where clinical-characteristics mining is expected to land, and the single-valued subtype qualifier was removed from both. Removing it is now evidence-backed rather than merely cautious: pseudobulbar involvement is independently attested at the SPG11 locus by the GeneReviews chapter while the entry's other source names ALS2 and SPG11, and the sensory neuropathy source names three loci. Each description now records why no subtype is asserted.

    Suggestion 7 - the L-serine action term was rebound from NCIT:C15433 Nutritional Support to NCIT:C15986 Pharmacotherapy. CLAUDE.md warns specifically that the nutritional-support term looks dietary but usually names a chemical compound, which is exactly this case; the treatment already carried a CHEBI L-serine therapeutic agent and a target_mechanisms link to the SPT node.

    Suggestion 8 - removed six redundant per-subtype mondo_mappings blocks, each of which duplicated its own subtype_term with skos:exactMatch.

    Suggestion 9, datasets, was deliberately not done. Dataset relevance triage is a required manual step and gene-only searches for these loci surface adult ALS and hereditary spastic paraplegia, which are the wrong diseases. An unverified accession would be worse than an absent block.

    Suggestion 11, an ALS2-Related Disorders GeneReviews chapter, was not resolved in this session.

    Validation after the edits: just validate passed with 102 of 102 snippets verified, up from 95; just check-duplicate-keys, just check-title-snippets, just check-term-cache-integrity and just check-cache-order all clean; the batched just validate-disorders CI gate passed with exit 0; just qc-deep-research ran; and the targeted tests/test_data.py selection covering conforms_to node references, unique names, subtype foreign keys, environmental mechanism targets and history records reported 8641 passed.

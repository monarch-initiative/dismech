  summary: 'Create: Juvenile Amyotrophic Lateral Sclerosis (MONDO:0017593)'
  details: |
    Created kb/disorders/Juvenile_Amyotrophic_Lateral_Sclerosis.yaml as a thin root
    entry for MONDO:0017593, resolving issue #8891. No MONDO:0017593 binding existed
    anywhere in kb/ beforehand.

    Curation thesis. The entry's point is that JALS is NOT early-onset adult ALS.
    Three claims carry that: the recurrent genes (ALS2, SETX, SPG11, SIGMAR1,
    SPTLC1, FUS) are largely disjoint from the adult C9orf72/SOD1/TARDBP spectrum;
    TDP-43 proteinopathy is NOT the unifying JALS pathology, and this is recorded as
    an explicit INTERPRETATION discussion rather than left as an omission, anchored
    on PMID:20668261 - basophilic inclusions FUS-positive but TDP-43 NEGATIVE - and
    the reciprocal PMID:20579074 observation that adult sporadic ALS motor neurons
    show no abnormal FUS; and there is deliberately NO single disease-level
    prognosis. progression: is split into four subtype-scoped branches - indolent
    ALS4/SETX with normal life span, SPG11 long-term survival with an explicit
    ascertainment caveat, the 30-year SPTLC1 case, and the rapidly fatal FUS p.P525L
    branch reaching tracheostomy 14 months from onset at age 11.

    Pathophysiology shape. Six parallel upstream genetic arms - alsin/Rab5 endosomal
    trafficking, senataxin helicase/R-loop, spatacsin lysosomal-autophagic,
    sigma-1 receptor ER-stress, FUS cytoplasmic mislocalisation, SPT escape from
    ORMDL inhibition - each with its own genetic_context and evidence, all
    converging on a single CELLULAR node, Combined Upper and Lower Motor Neuron
    Degeneration, and thence to an ORGANISM outcome node. No single trunk was
    forced. Five of the six convergence edges are typed
    INDIRECT_UNKNOWN_INTERMEDIATES and several carry supports: PARTIAL, because the
    sources hedge; only the FUS edge is DIRECT, on autopsy evidence.

    Subtypes and MONDO bindings, all verified with runoak against the local MONDO
    build. MONDO:0017593 has exactly four asserted children, all bound: ALS2
    MONDO:0008780, ALS5/SPG11 MONDO:0011196, ALS16/SIGMAR1 MONDO:0013715, and JALS
    with dementia MONDO:0008781 - the last curated at name level only, with a
    PARTIAL evidence item recording the contemporary review position that FTD has
    not been correlated with JALS. Two further subtypes are bound despite not being
    MONDO children of JALS: ALS4 MONDO:0011223 and ALS27/SPTLC1 MONDO:0859529. Both
    are recorded as MONDO hierarchy gaps in a CURATION_TODO discussion. Note the
    issue triage claim that no MONDO term exists for SPTLC1-juvenile ALS is stale -
    MONDO:0859529 exists and is bound; what is unresolved is its placement under
    familial rather than juvenile ALS.

    FUS handled at variant level. The ALS6-JALS subtype is deliberately left UNBOUND
    to MONDO:0011951: ALS6 is a gene-level concept covering mostly adult-onset
    FUS-ALS, and only the C-terminal NLS variants produce the juvenile phenotype.
    Binding it would be a gene-level-for-variant-level substitution. That rationale
    is stated on the subtype, on the FUS genetic record, and in the MONDO-gap
    discussion, which explicitly declines to propose ALS6 as a third gap.

    Module conformance. NO conformance to peripheral_axonal_degeneration is declared
    at root or subtype level, and the reasoning is recorded as an OPEN_QUESTION
    discussion. That module models a length-dependent distal axonopathy; JALS is
    defined by combined UMN and LMN degeneration, and the UMN limb is a
    corticospinal central-tract lesion the module does not model. Two subtype
    exceptions were considered and rejected: ALS4, because the same defining
    sentence that supplies the distal-axonopathy resemblance also records pyramidal
    signs, cited with supports: REFUTE; and ALS2, because the elevated plasma NfL
    evidence, PMID:40439044, concerns IAHSP rather than JALS and NfL is
    non-specific for central versus peripheral axonal injury, cited PARTIAL so the
    decision can be re-examined against it.

    Cross-references, not duplication. Adult mechanism is left to
    Amyotrophic_Lateral_Sclerosis.yaml. SPTLC1 mechanism is summarised and points at
    Amyotrophic_Lateral_Sclerosis_27_Juvenile.yaml, the in-flight PR #9067 entry.
    SIGMAR1 points at Distal_Hereditary_Motor_Neuronopathy_Autosomal_Recessive.yaml,
    where the allelic LMN-only HMNR2 phenotype is already curated.

    Two allelic one-gene-two-diseases contrasts are curated: SPTLC1 transmembrane
    gain-of-function giving JALS versus active-site substrate-selectivity change
    giving HSAN1A MONDO:0008086; and SETX dominant missense giving ALS4 versus
    biallelic variants giving AOA2. The AOA2 citation, PMID:20301333, is a
    GeneReviews chapter about AOA2 and its explanation says so explicitly - it is
    cited only for the AOA2 half of the contrast, never for an ALS4 claim.

    Sourcing and anti-hallucination. Built entirely from primary literature; no
    deep-research provider pass was run and no DR report was read, so no
    preflight-dr run applies - MONDO:0017593 records no single causal gene and the
    automated check would return SKIP. NEC was guarded manually: JALS sits in a
    numbered series ALS1-ALS27+ and shares eponyms with adult ALS, so every cited
    abstract was read to confirm it concerns juvenile disease and the specific locus
    claimed. Four references were fetched and then deliberately not used, and their
    cache files removed: PMID:20301629 is a retired AOA1 chapter about APTX not
    SETX; PMID:41877246 is a generic axonopathy review with no JALS content;
    PMID:41280805 concerns IAHSP-specific alsin R1611W; PMID:38891021 has no
    quotable TDP-43 frequency sentence in its cached abstract, so the adult TDP-43
    contrast was built from the FUS-negative neuropathology instead of from a
    frequency claim I could not verify.

    Known gap. ORPHA:300605, the source of the MONDO:0017593 definition, could not
    be cited as structured evidence: data/orphadata/*.xml is gitignored and
    just refresh-orphadata fails a pinned sha256 check, so
    just structured-rebuild-orphanet --id 300605 fails with FileNotFoundError on
    en_product1.xml. This is recorded in the entry notes.


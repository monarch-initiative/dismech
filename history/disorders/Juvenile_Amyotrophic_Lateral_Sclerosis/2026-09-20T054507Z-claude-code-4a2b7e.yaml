  summary: Wire checklist genes onto gene-defined subtype rows
  details: |
    Genetics pass for the d2g wiring-012 tranche (issue #12201).

    Research first: GeneReviews baseline checked with `just check-genereviews`, which
    found two chapters cited by PMID but untagged; ClinGen's gene-validity download
    was read for all six genes on this entry. All three genes the reconciliation
    checklist names (SIGMAR1/ALS16, SETX/ALS4, SPG11/ALS5) were already present as
    `genetic:` records with `subtype:` foreign keys set and already bound as `genes:`
    on their own pathophysiology nodes, so no new genetics was needed here.

    What changed: each of the six gene-defined `has_subtypes` rows now carries a
    `genes:` list, so the gene a subtype designation refers to is machine-readable
    rather than only stated in the row's prose. `JALS with dementia` is deliberately
    left without one - the row's own description records that no causal gene is
    recognised for MONDO:0008781. The two GeneReviews chapters were tagged with
    `just tag-references`.

    ClinGen note for the record: ClinGen curates ALS2 against ALS2-related motor
    neuron disease, SETX against distal hereditary motor neuropathy, SPG11 against
    hereditary spastic paraplegia 11 and FUS against ALS type 6 - it carries no
    assertion against the juvenile ALS classes this entry is scoped to, and none for
    SIGMAR1 at all. No ClinGen citation was added for that reason.

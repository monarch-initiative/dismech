  details: |
    Integrated Falcon (Edison Scientific) deep-research leads after NEC preflight: report is unambiguously SCLC (TP53/RB1 near-universal loss, ASCL1/NEUROD1/POU2F3/YAP1 subtypes, smoking, platinum-etoposide, DLL3/tarlatamab). Falcon citations were DOIs/author-year without verbatim quotes, so abstracts were fetched fresh, every snippet extracted as an exact substring, and all references converted DOI to PMID so CI validates them. Pathophysiology: added conforms_to on Loss of Cell Cycle Checkpoints [evading_growth_suppressors#Loss of Cell-Cycle Checkpoint Control, PMID:38473726] and Genomic Instability [genome_instability_mutation#Mutator Phenotype and Chromosomal Instability, PMID:37329269]; new node Lineage Transcription Factor Subtypes and State Plasticity [PMID:40333678 subtypes; PMID:39080761 SMARCA4 chromatin, GO:0006338]; new node Immune Evasion [PMID:38630789, GO:0002474, conforms_to immune_checkpoint_blockade#Adaptive Immune Resistance]. Treatments: Tarlatamab DLL3xCD3 BiTE [NCIT:C175858, PMID:38630789 + PMID:37627044]; Benmelstobart+Anlotinib ETER701 [NCIT:C156692, NCIT:C138997, PMID:38992123]. Prevalence: US SEER annual incidence 4.6/100000 [PMID:39908169]. Dropped SIADH/LEMS specific phenotype terms (LEMS lacks an HP term; no verbatim SIADH snippet available; both remain in the generic Paraneoplastic Syndromes phenotype). Validations: schema PASS, references PASS, terms PASS.

  summary: Review and enrich Small Cell Lung Cancer
  details: |
    Populated synonyms, moved Limited-Stage/Extensive-Stage SCLC to stages, standardized SCLC-A/N/P/Y molecular subtypes, wired Tobacco Smoking (with mutational-signature evidence from PMID:33446664 and PMID:26168399) to somatic TP53/RB1 inactivation in pulmonary neuroendocrine cells (CL:1000223), added Histological Transformation from Oncogene-Driven Lung Adenocarcinoma and atomic DLL3 Surface Expression (hgnc:2909) nodes, split Lineage Transcription Factor Subtype Programs from SMARCA4-Mediated Neuroendocrine State Plasticity, restored Ectopic ACTH Cushing Syndrome (HP:0011744) and Lambert-Eaton Myasthenic Syndrome (HP:0003398) alongside Superior Vena Cava Obstruction (HP:0031041) and calibrated Cough/Brain Metastases frequencies to FREQUENT with mixed-cohort annotations, added Synaptophysin (NCIT:C101146) and Serum Lactate Dehydrogenase (NCIT:C25184) biomarkers with results-sentence evidence, backed NOTCH family 25% / NOTCH1 mutation data with PMID:26168399, and retargeted Tarlatamab (DLL3 Surface Expression INHIBITS + Immune Evasion BYPASSES) and Lurbinectedin (MODULATES).

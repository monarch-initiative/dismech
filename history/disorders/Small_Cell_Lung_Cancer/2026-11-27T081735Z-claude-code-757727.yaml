  summary: 'Gene-family review: MYCL (new), MYC'
  details: |
    The entry described MYC-family amplification (MYC, MYCL, MYCN) in about 20% of SCLC but bound only MYC. Added a MYCL record (hgnc:7555; SOMATIC_DRIVER, variant_origin SOMATIC) with evidence for both of its alteration types: a recurrent RLF-MYCL1 fusion found by transcriptome sequencing, with fusion-bearing cell lines dependent on MYCL1 (PMID:22941189); MYCL1 amplification in 3 of 46 resected tumours by FISH (PMID:34257619); and a CRISPR-engineered Rlf-Mycl mouse model in which the fusion drives SCLC and metastasis (PMID:34344693). The new CURIE added a row to cache/hgnc/terms.csv, which must be committed with the entry. MYCN, also amplified in a minority of SCLC, was not added.

  summary: Add two organ-chip models (PMID:42473541, PMID:42475431)
  details: |
    Added two experimental_models entries with four modeled_mechanisms links. First, the open-top membrane-free vascularized alveolus-on-chip (PMID:42473541, Materials Today Bio): repeated whole cigarette smoke exposure disintegrated the alveolar microvascular network while the directly exposed epithelium stayed intact, and vascular networks exposed without an overlying epithelium were undamaged. That control locates the vascular injury downstream of an epithelial signal rather than in direct smoke contact, which is why it is curated against Alveolar Destruction rather than as a generic toxicity result. Graded PARTIALLY_RECAPITULATES and the link evidence carries the authors' own statement that the AEC2-dependence rests on two donors and is preliminary. A second link to Oxidative Stress and Mitochondrial Dysfunction is MEASURES with LOW fidelity, since the study reported structural and gene-expression endpoints rather than ROS or mitochondrial readouts. Second, the patient-derived epithelial-endothelial COPD chip (PMID:42475431, J Vis Exp): matched COPD-patient and healthy-donor devices under identical conditions, with the COPD chips showing mucus hypersecretion without barrier or viability loss (RECAPITULATES against Mucus Hypersecretion). Its Airway Remodeling link is MEASURES only, because preserved barrier integrity and junctional localization in the COPD chips mean the model does not reproduce structural remodelling. Validated: linkml-validate clean, linkml-term-validator clean, snippets verified.

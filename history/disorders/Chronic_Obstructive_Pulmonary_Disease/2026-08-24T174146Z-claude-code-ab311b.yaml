  details: |
    Declared conformance on two existing pathophysiology nodes to the new particulate_air_pollution_injury module: 'Oxidative Stress and Mitochondrial Dysfunction' to the module amplifier node, and 'NLRP3 Inflammasome Activation' to the module central_effector 'NF-kB Activation and NLRP3 Inflammasome Assembly'. Both node texts already named particulate/pollutant exposures as drivers, so conformance records an existing claim rather than adding one. Separately added a new environmental entry 'Ambient Fine Particulate Matter (PM2.5)' bound to ECTO:7000117 and linked with influences_mechanisms to the NLRP3 node with environmental_effect EXACERBATES and causal_link_type DIRECT. Kept deliberately separate from the entry's existing general 'Air Pollution' factor, whose curation notes grade it from epidemiological respiratory-outcome studies onto the oxidative-stress node with unknown intermediates; the new entry is graded from mechanistic exposure work that measures the inflammasome step itself, and merging the two would force one grade onto two different classes of evidence. That reasoning is recorded in the new entry's notes. Evidence: PMID:39336475 (in vitro, human bronchial epithelial cells) and PMID:32116706 (mouse). 314/314 snippets verified across this file and Asthma; schema and term validation pass.

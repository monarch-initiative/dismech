  summary: Link inhaled exposures to the inflammation and oxidative nodes
  details: |
    Backfill for issue #8085. Three exposures, split by how close the cited sentence gets to the node. Smoking is TRIGGERS with DIRECT into the chronic inflammation node, because that node names persistent irritation from inhaled substances like cigarette smoke as its own content, and the cited sentence has inhaled smoke meeting the airway epithelium with nothing in between. Both its items are graded PARTIAL anyway, since each reports risk of the disease rather than a measurement of airway inflammation; the second is carried deliberately because it limits the claim, recording that only 10 to 20 percent of smokers develop the disease. Air pollution is EXACERBATES with INDIRECT_UNKNOWN_INTERMEDIATES into the oxidative stress and mitochondrial dysfunction node, which names pollutants alongside cigarette smoke as drivers of mitochondrial reactive oxygen species. Both items are PARTIAL: one is an epidemiological synthesis reaching respiratory symptoms and mortality rather than any oxidative marker, and the other measures personal exposure in patients who already have the disease, which is the design that fits an exacerbating grade. The two links are decided on different axes and the description now says so, because the difference is not obvious: the smoking link took its triggering grade from the inflammation node's own wording, and this node's wording uses the word trigger for pollutants too, so on its face it would have supported the same grade. It is not taken, because that verb describes what pollutants do to reactive oxygen species production once inhaled rather than whether the exposure starts the disease, and on that question the entry's own note and both cited studies agree that pollution worsens established disease. The entry also holds a paper on oxidant and antioxidant balance, but its quotable sentence names oxidative stress without naming pollution, so it cannot carry an exposure-to-node claim and was not cited. Occupational dust and chemicals is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into the same inflammation node as smoking, graded below it because dusts are not named at that node and no cited sentence follows them as far as airway inflammation. Its meta-analysis item reporting reduced FEV1 and FEV1/FVC was not used, because that result belongs to the airflow limitation node far downstream and attaching an exposure there would skip the graph. All five newly cited items previously carried no evidence_source and so defaulted to HUMAN_CLINICAL; the four review sources are now tagged OTHER and the primary personal-exposure study HUMAN_CLINICAL. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 116 of 116 verified with no prefix skips.

  summary: Wire the LAMA treatment to the new muscarinic antagonism module
  details: |
    The Long-Acting Muscarinic Antagonist Therapy treatment, created when the bundled Bronchodilators treatment was split, was deliberately left unwired because no muscarinic antagonism module existed. It now does, and the treatment reaches it through target_mechanisms with treatment_effect ACTIVATES.

    A Muscarinic Antagonist Occupancy of Airway M3 Receptors node was added as a therapeutic_vulnerability conforming to the module's trigger. This entry now carries two receptor-occupancy nodes, one per bronchodilator class, because its two first-line classes act at two different receptors on the same airway smooth muscle cell. That is the point of having split the treatment: a single node could not have carried both without asserting that one receptor's drug acts at the other.

    Neither node carries a downstream edge. The relation to airflow limitation is relief, and a downstream edge would assert that receptor occupancy causes the obstruction. Both node descriptions record that the relief is partial, because COPD airflow limitation is by definition not fully reversible.

    The node cites two sentences from the same receptor-level review: one establishing that the receptor sits on airway smooth muscle and regulates its contraction, and one stating that cholinergic contractile tone is raised in COPD specifically, which is what makes the node disease-relevant here rather than generic.


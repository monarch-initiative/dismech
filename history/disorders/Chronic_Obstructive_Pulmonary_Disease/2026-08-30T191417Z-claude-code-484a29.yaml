  details: |
    Applied the blocking findings from the ai4c-reviewer CHANGES_REQUESTED review on PR #10119.

    Terms. Rebound three descriptors on the Cuproptosis-Driven Cell Death node to terms that carry the claim rather than restating it in free text: GO:0012501 programmed cell death became GO:0160119 cuproptosis; GO:0007005 mitochondrion organization became GO:0141164 mitochondrial protein quality control, with a description recording that GO has no term for proteotoxic stress itself so this names the machinery rather than the stress; CL:0000235 macrophage became CL:0000890 M2 macrophage, which is the population the cited sentence actually names. Added GO:1990169 stress response to copper ion, and modifiers DYSREGULATED on GO:0055070 and INCREASED on GO:0006954. All four newly bound CURIEs were already present in the committed label and enum-membership caches, so no cache rows changed.

    Epistemic status. The cited review states its central claim as a hypothesis and its cell-vulnerability claim as a prediction, but the node description read as established fact. Added a disease-level mechanistic_hypotheses entry, emerging_cuproptosis_metabolic_immune_axis with status EMERGING, evidenced by the authors' own hypothesis sentence and by their statement that they distinguish established evidence from speculative hypotheses; both causal edges opt in via hypothesis_groups. Rewrote the node description to attribute the model and to mark the vulnerability claim as predicted rather than shown. Added a KNOWLEDGE_GAP discussion, gap_copd_cuproptosis_direct_human_evidence, attached to the node, recording the review's own roadmap placing direct human evidence first and its statement that every proposed copper-directed therapeutic is preclinical, which is why none is curated under treatments.

    Pathograph wiring. The node was a source with no upstream and the vicious cycle existed only in prose. Added an influences_mechanisms link on the existing environmental Smoking entry targeting the node, with environmental_effect TRIGGERS and causal_link_type DIRECT, plus a Chronic Inflammation to Cuproptosis-Driven Cell Death edge for the return arm, each carrying its own evidence item.

    Titles. Added reference_title to all five original evidence items, matching the 123-of-130 convention already in the file.

    Not done: the four-way debundling of the node was not attempted, per the reviewer's explicit note that the neighbouring Oxidative Stress node is written at similar grain.

    Validation: just validate covering schema plus 136 of 136 snippets verified, just validate-terms, just check-entity-refs, just check-duplicate-keys, and the ungated whole-KB gates check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all pass. Reference-cache frontmatter churn produced incidentally by the validator was reverted; the only content file changed is the COPD entry.

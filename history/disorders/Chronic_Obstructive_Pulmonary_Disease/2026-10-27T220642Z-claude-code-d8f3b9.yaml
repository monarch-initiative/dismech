  summary: Split the bundled bronchodilator treatment into LABA and LAMA; wire the
    LABA to the beta2 module
  details: |
    The single Bronchodilators treatment covered two mechanistically different drug classes. Its own description read 'beta-agonists, anticholinergics' and its evidence names 'Long-acting beta2-agonists and long-acting muscarinic antagonists' as the two first-line options, but it bound one generic agent, NCIT:C319 Bronchodilator, which spans both. That made the treatment unwireable to either receptor module: a link to a beta2 module would have asserted beta2 action for a muscarinic antagonist, and vice versa.

    Split into Long-Acting Beta-2 Agonist Therapy and Long-Acting Muscarinic Antagonist Therapy, bound to NCIT:C48149 Beta-Adrenergic Agonist and NCIT:C29704 Antimuscarinic Agent respectively. No NCIT or CHEBI class term for a beta-2 selective agonist exists (the children of NCIT:C48149 are individual drugs), so the general beta-adrenergic agonist class is the most specific accurate term and the beta-2 selectivity is carried in preferred_term, as the ontology contract allows. NCIT:C29704 was confirmed admissible in the ChemicalEntityTerm enum by just validate-terms after binding, since it had no prior row in the enum cache.

    All four original citations are kept on both halves. Only PMID:27576232 separates the classes; the other three speak about the long-acting bronchodilators jointly, and each explanation now says for which class the source is specific and which are class-level. PMID:28757318 is about the combination inhaler, so on each half its explanation says it supports combined use rather than that class alone.

    A Beta2 Agonist Occupancy of Airway Smooth Muscle Receptors node was added as a therapeutic_vulnerability conforming to beta2_adrenergic_receptor_agonism, following the pattern of the existing Asthma and Thunderstorm_Asthma conformers, and the LABA treatment reaches it through target_mechanisms with treatment_effect ACTIVATES. The node carries no downstream edge: the relation to airflow limitation is relief, and a downstream edge would assert that agonist occupancy causes the obstruction. The node description records that the relief is partial, because COPD airflow limitation is by definition not fully reversible.

    The LAMA half is deliberately left unwired. No muscarinic antagonism module exists yet; it is the next module in the GPCR project's Workstream A, and this split is its prerequisite.

    Validation: check-causal-targets, check-entity-refs, check-duplicate-keys, check-enum-values and check-logical-rules all pass; validate-terms passes; check-snippet-grading reports no new divergence, including cross-file, since the shared receptor-level snippet copies the existing conformers' grades exactly.

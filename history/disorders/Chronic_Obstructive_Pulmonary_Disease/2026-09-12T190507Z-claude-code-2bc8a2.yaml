  details: |
    Addressed all nine blocking items on PR #10084. (1) Added reference_title to every new evidence item. (2) Bound GO:0160119 cuproptosis on the cell death node. (3) Bound GO:0055070 copper ion homeostasis with modifier DECREASED on the new initiating node. (4) Replaced GO:0030099 myeloid cell differentiation with GO:0042116 macrophage activation. (5) Replaced the generic CL:0000235 macrophage with CL:0000890 M2 macrophage on the vulnerability node and CL:0000863 M1 macrophage on the polarization node, preserving the M1/M2 distinction the evidence turns on. (6) Split the bundled five-step chain into four atomic nodes with correct per-node biological_scale: Pulmonary Copper Dyshomeostasis (MOLECULAR), Cuproptosis of Alveolar Structural Cells (CELLULAR), Cuproptotic DAMP Release (MOLECULAR), Pro-Inflammatory Macrophage Polarization (CELLULAR). (7) Added a disease-level mechanistic_hypotheses entry cuproptosis_metabolic_immune_axis with status EMERGING, quoting the source's own we-advance-the-hypothesis sentence; every causal edge in the arm opts into that group, and the predicted-vulnerability claim is described as a prediction rather than an observation. (8) This history record. (9) Added the missing upstream edge as an influences_mechanisms link on the existing Smoking environmental entry, environmental_effect TRIGGERS, targeting the copper dyshomeostasis node. Also addressed two suggestions: removed the redundant lung/alveolus location pairing by giving each node the single location that fits it, and added PMID:35298263 (Tsvetkov) as primary IN_VITRO evidence so the cuproptosis mechanism is no longer single-sourced to a hypothesis review. Dropped the NLRP3 Inflammasome Activation edge: the cited review never mentions the inflammasome, so that edge had no supporting snippet.

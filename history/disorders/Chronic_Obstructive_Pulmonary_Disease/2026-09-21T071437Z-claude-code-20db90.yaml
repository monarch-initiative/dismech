  summary: 'Review round: restore three GO bindings lost in the merge'
  details: |
    Third review round on PR #10084, addressing the two blocking findings from the 2026-09-20 review of the conflict resolution.

    Finding 1 (restore dropped GO bindings). The merge that reconciled this branch's four-node split chain with main's bundled Cuproptosis-Driven Cell Death node (#10119) dropped three GO bindings that main carried, while leaving the prose claims they grounded in place. All three are restored, each to the split node whose claim it grounds: GO:1990169 stress response to copper ion onto Pulmonary Copper Dyshomeostasis (the response to the copper excess that node names, rather than the death programme it can end in); GO:0141164 mitochondrial protein quality control and GO:0006119 oxidative phosphorylation onto Cuproptosis of Alveolar Structural Cells, whose description asserts mitochondrial proteotoxic stress and OXPHOS-reliant vulnerable cell populations and quotes snippets for both. Main's curator notes explaining the GO:0141164 proxy binding and the non-modifier GO:0006119 dependency binding are restored with them.

    Two of main's bindings are deliberately NOT restored, and this is the record of that decision. UBERON:0002185 bronchus was a location on the bundled node; the split chain's cuproptosis, DAMP-release and macrophage nodes are all sited at UBERON:0002299 alveolus of lung, which is where the quoted snippet places the mechanism (alveolar type II epithelial cells, alveolar structural cells), and the review does not site cuproptosis in bronchus. GO:0006954 inflammatory response was a process on the bundled node; in the split chain the inflammatory step is its own node, Pro-Inflammatory Macrophage Polarization, bound to the more specific GO:0042116 macrophage activation, and the entry's pre-existing Chronic Inflammation node carries the general inflammatory claim. Restoring GO:0006954 would re-bundle what the split separated.

    Finding 2 (modifier downgrade). modifier: DECREASED on GO:0055070 copper ion homeostasis is corrected to DYSREGULATED, matching main. The node's own description says homeostatic control is lost and copper rises above threshold, which is the qualitative case the schema reserves DYSREGULATED for, not a process running below its normal level. A note on the descriptor records the reasoning.

    Suggestion 3 (negative-existence claim). The Cuproptotic DAMP Release process note justified leaving DAMP release unbound by appeal to 'the caches consulted', which CLAUDE.md treats as silence rather than a negative answer. The note now records the verbatim queries and their output: runoak -i ols:go search returns nothing for l~damage-associated molecular pattern, l~damage-associated or l~alarmin, and l~DAMP returns only the seven deoxyadenosine-monophosphate terms, none of which is this concept.

    Validated: just validate, count-verified-snippets (143/143), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values.

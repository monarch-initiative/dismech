  summary: 'Create: Spongiform Encephalopathy With Neuropsychiatric Features (PRNP
    T183A)'
  details: |
    New de-novo curation of MONDO:0011703 (OMIM 606688), the PRNP T183A autosomal dominant genetic prion disease first described in a Brazilian kindred (Nitrini 1997, PMID:9266722). Deep research was requested as falcon; falcon and the openscientist fallback were both unavailable in this environment (no EDISON_API_KEY; openscientist host blocked by the agent proxy), so the run fell back to the claude_code provider (research/Spongiform_Encephalopathy_With_Neuropsychiatric_Features-deep-research-claude_code.md; needs_review absent, 2/2 references on topic, 3/3 terms resolved). That report was decisive: it caught a Named Entity Confusion in the first draft, which had been built around the 8-OPRI octapeptide-insertion disease (HDL1 = MONDO:0011299 / OMIM 603218). MONDO:0011703 is instead the T183A missense disease, verified via OMIM 606688 / MedGen 339812 and PMID:9266722. The entry was rebuilt around T183A. Mechanism modelled as a causal chain: T183A -> (loss of an N-glycosylation sequon -> intracellular retention; and native-fold destabilization via abolished Y162-T183 gatekeeper H-bond) -> enhanced PrP misfolding/aggregation -> striatal and neocortical spongiform degeneration -> frontotemporal dementia and parkinsonism. Evidence from PMID:9266722 (index kindred), PMID:11400017 (12-patient FTDP-17-resembling series), PMID:15558291 (second report; glycosylation loss, monoglycosylated PrPSc, intracellular retention), PMID:33731477 (biophysics: strongest native-state destabilization of any TSE-associated variant), GeneReviews PMID:20301407 (supportive care). Validated with just validate (22 snippets, 23 titles, 0 issues), validate-disorders, check-entity-refs, check-causal-targets, check-genereviews (GeneReviews TAGGED), check-duplicate-keys, check-block-scalar-comments, check-qualifier-terms, check-coarse-phenotypes.

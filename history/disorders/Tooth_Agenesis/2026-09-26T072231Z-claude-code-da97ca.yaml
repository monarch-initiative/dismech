  summary: 'Genetics pass: bind STHAG MONDO subtype terms, add GREM2 and TSPEAR subtypes'
  details: |
    Genetics-gap pass for issue #12253 (d2g series-046), Tooth Agenesis half.

    Anchor check first. disease_term is MONDO:0005486 tooth agenesis, whose
    definition reads "A tooth disease characterized by failure to develop one or
    more missing teeth". The entry models that class, so the anchor was left alone
    and the six checklist diseases are genuine subtypes of it rather than an
    artefact of an over-broad binding.

    The gap was not missing genes but missing subtype_term bindings. Seven
    gene-defined has_subtypes rows existed with genes already wired to
    mechanism-specific pathophysiology nodes, and none carried a MONDO term, so
    every one of them was invisible to the d2g comparison. Bound six:
    WNT10B-related to MONDO:0014901 (STHAG8), LRP6-related to MONDO:0014749
    (STHAG7), PAX9-related to MONDO:0011477 (STHAG3), MSX1-related to
    MONDO:0007129 (STHAG1), EDA-related to MONDO:0010741 (STHAG X-linked 1), and
    AXIN2-related to MONDO:0012075 oligodontia-cancer predisposition syndrome. Each
    gene assignment was read off the MONDO class's own definition, which names the
    gene ("Any tooth agenesis in which the cause of the disease is a mutation in
    the ... gene"); EDA and AXIN2 are beyond the issue checklist and were bound
    because the terms exist and nothing else in kb/ claims them.

    WNT10A-related was deliberately left unbound. MONDO:0007881 (STHAG4) is
    already bound as a subtype_term in Odonto-Onycho-Dermal_Dysplasia, where the
    mild end of the WNT10A spectrum is curated, so binding it here would claim the
    same concept in two entries. The reason is recorded in the row's description.

    Two new subtypes, both from the checklist:

    GREM2-related, bound to MONDO:0014999 (STHAG9). Curated deliberately as a
    thin entity: the ClinGen Craniofacial Malformations Gene Curation Expert Panel
    grades GREM2-selective tooth agenesis 9 Limited (CGGV assertion
    ef7b431e-de56-4e8b-a505-122f2e04a80a, 2025-01-16, SOP11), so the genetic record
    carries association "Limited ClinGen gene-disease validity" with
    relationship_type UNKNOWN, following the CDH2/CTNNA3 precedent in
    Arrhythmogenic_Right_Ventricular_Cardiomyopathy. Evidence is the original human
    report (PMID:26416033), its Grem2-null mouse observation, the SHED functional
    study (PMID:33369218), and the ClinGen row itself.

    TSPEAR-related, bound to MONDO:0859339 (STHAG10). MONDO carries no definition
    for that class, so the gene assignment was established from the literature
    rather than from the ontology: two cohorts (PMID:41195743, PMID:34042254) and a
    delineation study (PMID:37009414) place tooth agenesis with conical teeth at the
    centre of the TSPEAR phenotype, fully penetrant in the 2026 cohort. The
    description records that MONDO:0859339 (OMIM 620173) and MONDO:0032584
    ectodermal dysplasia 14 (OMIM 618180) are two named points on one allelic
    spectrum - two distinct OMIM concepts, so the split is OMIM's and not a MONDO
    defect - and points at Autosomal_Recessive_Nonsyndromic_Hearing_Loss_98 for the
    contested hearing-loss arm of the same gene.

    Both new genes reach the pathograph through new mechanism-specific nodes rather
    than being appended to an existing one, because neither acts in the three arms
    already modelled: BMP Antagonist Dysregulation (GREM2, GO:0030510 regulation of
    BMP signaling pathway) and Enamel Knot Signaling Disruption (TSPEAR,
    UBERON:0008866 enamel knot, GO:0042476 odontogenesis). Both edge to Impaired
    Odontogenesis. The GREM2 node carries no modifier on its GO term because none of
    the cited sources reports the direction of net BMP signalling change, and the
    TSPEAR node records the tspear-wnt10a interaction as the hypothesis the source
    states rather than drawing it as an edge.

    Also added: ClinGen Definitive assertions and relationship_type CAUSATIVE for
    the two checklist genes ClinGen has graded (MSX1 and PAX9), and the GeneReviews
    chapter PMID:34292692 "Nonsyndromic Tooth Agenesis Overview" to references with
    a GeneReviews tag, which check-genereviews had reported as an untagged candidate
    chapter. The chapter's cached body is only its purpose statement, so it carries
    no evidence snippet.

    Self-review found and corrected eight unsourced or inaccurate prose claims in
    the first draft of this work, including a fabricated snippet attributed to
    PMID:34042254 that did not exist in the paper, "secreted" applied to GREM2 and
    TSPEAR without a source, "epithelial" applied to the enamel knot, a claim that
    one functional study was the only one published for GREM2, and a stale
    seven-gene count in the entry description.

    Validation: just validate, validate-terms, check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-qualifier-terms,
    check-enum-values all pass. count-verified-snippets 48/48.
    list-gene-term-mismatches-online compared 61 of 61 gene bindings across the
    three changed files against live HGNC with no mismatches and no uncached rows.
    subtype-usage-audit reports 9 of 9 subtypes referenced by a subtype FK and all 9
    WIRED_DIRECT to the pathograph.

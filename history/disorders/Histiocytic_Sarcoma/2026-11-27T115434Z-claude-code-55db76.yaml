  summary: 'Histiocytic sarcoma: what the tumour looks like and what stains it'
  details: >-
    The histology of histiocytic sarcoma and the marker panel its diagnosis rests on, curated by
    hand from the literature. A new histopathology section records eight findings: a gross
    appearance of a fleshy mass with a greyish-white cut surface, in which haemorrhage and necrosis
    may be seen; sheets of large round to oval cells with abundant eosinophilic cytoplasm, oval to
    irregular nuclei with vesicular chromatin and variably prominent nucleoli, variable nuclear
    atypia, commonly binucleated or multinucleated cells, mitoses that may be frequent and common
    necrosis; a usually prominent inflammatory background, most often of neutrophils and
    lymphocytes, which is its own row so that it can bind; diffuse infiltration of soft tissue with
    a sinusoidal distribution in lymph node, liver and spleen; significant pleomorphism with focal
    spindling in some tumours, where a spindled tumour is sometimes difficult to distinguish from
    undifferentiated pleomorphic sarcoma, with the review's PU.1 contrast quoted beside it rather
    than presented as a decisive test; occasional haemophagocytosis within the neoplastic cells;
    expression of histiocytic markers including CD163, CD68 and lysozyme, and of PU.1, and usually
    CD4, CD31, CD45 and CD45RO, with factor XIIIa listed in the review's own panel table - plus the
    review's two different statements about S100, both attributed and neither adopted, and its
    abstract's negative staining with follicular dendritic cell and myeloid markers; and PD-L1
    expression reported at approximately 25 to 50% on few studies, recorded with the review's own
    statement that the prognostic value of PD-1/PD-L1 expression is unknown. Three rows bind an
    ontology term: NCIT:C35985 Hemophagocytosis on the haemophagocytosis row, NCIT:C41453
    Infiltrative Growth Pattern on the infiltration row, and NCIT:C35978 Inflammatory Infiltrate on
    the inflammatory background. The last two were found by searching after a review round asked
    whether those rows could bind, and both resolve inside the HistopathologyFindingTerm enum
    (runoak ancestors -p i puts each under NCIT:C35867 Morphologic Finding and NCIT:C83490
    Histopathology Result). The background is bound to NCIT:C35978 rather than to NCIT:C35983
    Lymphocytic Infiltrate. An earlier draft of this record called C35978 the genus of C35983; that
    was wrong, and runoak ancestors -p i puts both directly under NCIT:C35867 Morphologic Finding,
    so they are siblings. C35978 names an inflammatory infiltrate without saying what it is made of,
    which is what the row claims; C35983 names a lymphocytic one and would drop the neutrophils the
    review reports. The inflammatory background was split out of the cytology row to let it bind at
    all: a single finding_term cannot describe a row that bundles cytology, atypia, multinucleation,
    mitoses, necrosis and the background together. NCIT:C12563 Histiocyte was searched for and tried
    on the cytology row and rejected: it is a cell type rather than a histopathology finding, and
    binding it fails the HistopathologyFindingTerm enum. That row carries a free-text name and
    description with no finding_term. A term was also sought for the pleomorphism row and found
    unusable: runoak search 'l~pleomorph' and 'l^Pleomorph' over sqlite:obo:ncit return NCIT:C17000
    Pleomorphism, which names exactly what the row names, but runoak ancestors -p i NCIT:C17000
    returns no NCIT:C83490 Histopathology Result ancestor, so it falls outside the same enum, and
    NCIT:C12489 Spindle Cell is a cell type again. The gross, marker-expression and PD-L1 rows carry
    no finding_term. For the gross row that is structural rather than unsearched: the enum is rooted
    at NCIT:C83490 Histopathology Result, so a macroscopic finding cannot sit in it by construction.
    No term was sought for the other two. The source is the same review the entry already cites;
    this change carries the upgrade of its cached record from abstract to PMC full text, which all
    but one of the new quotes need. At least one marker the review names is deliberately left out of
    the marker panel row, under a content boundary this curation project works under. The number is
    not asserted: the review's differential-diagnosis paragraph names markers for several tumours at
    once, and which of them belong to this disease's own panel is not something the entry settles.
    Three findings of the review's own pathology and immunophenotype paragraphs that the first
    version of this section missed are now recorded: the gross appearance above, the review's caveat
    that these markers are not specific for this disease, and its immunophenotype paragraph's
    "variable expression for S100", which is in tension with the conclusion's "S100 is negative ...
    although focal weak reactivity" that the row already quoted. Both S100 sentences are quoted and
    attributed to where in the review each sits; the row adopts neither reading and says that the
    review gives both. A clause of the PD-L1 row saying the review relays single cases with much
    higher tumour-cell expression was deleted rather than quoted: it is true, but every statement of
    it in the review sits inside a sentence naming the drug the patient was given, which is
    treatment content and does not belong on a histopathology row. The review's variable Ki-67 index
    is left out for the same kind of reason - it asserts nothing this section can use. Three
    sentences that carry no result of their own are graded OTHER rather than HUMAN_CLINICAL, which
    is the rule the KRAS row already states for the Table 2 column headings: the reviewers'
    judgement that a spindled tumour is hard to tell from undifferentiated pleomorphic sarcoma,
    their caveat that the markers are not specific, and their statement that the prognostic value of
    PD-1/PD-L1 expression is unknown. The MAP2K1 Table 2 quote keeps its ' ... ' bridge: two review
    rounds proposed quoting the row verbatim instead, and the validator rejects that, because it
    strips a bracketed span such as the rowspan marker from the source before matching and the
    bridge is how a quote crosses one. Four prose sites are rewritten, each for its own reason. Two
    sentences of the top-level notes and one in the KRAS row's notes called the entry's cited
    sources abstracts; the upgrade made all three false. The CDKN2A row's claim that neither source
    gives the origin was not made false - it is kept, reworded to "Neither reports the origin of the
    CDKN2A change itself" and so scoped to that change, because the full text's "In addition to
    somatic mutations" clause names no gene. The CDKN2A node's description was not made false
    either; it is extended, because the review's position on the link could only be read once it had
    a full text. The four sites are: two sentences of the entry's top-level notes that called the
    cited sources abstracts, narrowed and extended with what the full text does give for CDKN2A; the
    KRAS row's notes, which said the cited abstracts give no KRAS figure and now report the review's
    own table figure of 12 to 50%, with four new quotes on that row so it can be traced: the table's
    KRAS row, its column headings, the sibling row carrying the Pathway/Function cell the KRAS row
    loses to a rowspan, and the sentence naming what the table is of; the CDKN2A row's notes, whose
    somatic claim is scoped to the CDKN2A change itself and which now quote the review's "In
    addition to somatic mutations" clause as the only statement bearing on origin and give its 39 to
    46% frequency, on a row that also gains four quotes from the review: its Table 2 row filing the
    gene under cell-cycle regulation, its prose statement of the 39 to 46% figure, the p16 result it
    relays, and the sentence naming CDKN2A itself as cooperating with PTEN, which is the first
    gene-level support in the entry for the cooperating relationship the row records; and the CDKN2A
    Alteration node's description. That last edit does three things: it names the series, which the
    upgrade leaves as the node's only abstract-only source; it names the review as a second source
    in that sentence, whose position on the link had to be assessed once it had a full text; and it
    records that the review's expanded name for the gene supplies the activity but not the link, and
    that this entry does not quote it. Validated with just validate-disorders over the changed file,
    and in the loop with just validate, count-verified-snippets and validate-terms.

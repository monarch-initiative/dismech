  summary: 'Histiocytic sarcoma: the tumours it has to be told apart from'
  details: >-
    The differential diagnosis of histiocytic sarcoma, curated by hand from the literature. A new
    differential_diagnoses section records eight tumours the diagnosis has to be told apart from,
    each with the marker that excludes it: Langerhans cell sarcoma (CD1a and CD207, and S100),
    interdigitating dendritic cell sarcoma (diffuse strong S100 with weak CD68 and lysozyme),
    follicular dendritic cell sarcoma (CD21, CD23 and CD35), myeloid sarcoma with monocytic
    differentiation (CD13, CD33 and myeloperoxidase), melanoma (SOX10 and HMB45), undifferentiated
    large cell carcinoma (no CD163, with cytokeratins and epithelial membrane antigen),
    undifferentiated pleomorphic sarcoma (negative for PU.1) and epithelioid sarcoma (cytokeratins
    and EMA with loss of SMARCB1). Seven rows bind a MONDO term; the carcinoma row is left unbound
    because the review names a descriptive category rather than a coded entity. Every row quotes the
    review's own sentence for that tumour, graded REVIEW_SYNTHESIS, beside its list of what the
    differential includes. The source is a review the entry already cited, re-fetched as full text
    because its abstract carries only a general statement that myeloid and follicular dendritic cell
    markers are negative; the per-tumour markers are in the body. One entity in the review's own
    list is left out, for a reason of project scope given in the pull request; the other eight are
    recorded. Validated with just validate, count-verified-snippets and validate-terms.

  summary: 'Registered trials: two histiocytosis trials that enrol this disease'
  details: |
    Adds a clinical_trials section with the two registered histiocytosis trials that enrol this
    disease. One names it in its public summary; the other names it only in its registration's
    conditions list, which the cached summary does not reproduce.

    NCT04079179 tests cobimetinib, a MEK inhibitor, in refractory Langerhans cell histiocytosis and
    other histiocytic disorders; phase 2, recruiting since 2021. It is NOT the completed cobimetinib
    study reported in PMID:30867592, which this entry already cites under treatments and grades
    NO_EVIDENCE because none of its 18 patients had this disease. That study registered as
    NCT02649972. The two are easy to conflate - same drug, near-identical population wording - so
    the new row's description distinguishes them explicitly. NCT02523040 tests lenalidomide in
    adults with one of three histiocyte disorders; phase 2, active and no longer recruiting. Both
    were read from the ClinicalTrials.gov record rather than from memory, and both cached records
    are committed.

    The two rows are graded differently on purpose. NCT02523040's public summary names this disease
    outright, so its evidence is DIRECT. NCT04079179's summary says only "other histiocytic
    disorders"; this disease appears in the record's conditions field, which the cached summary does
    not reproduce, so that row is graded INDIRECT and its description says where the eligibility
    comes from. Both items are evidence_source OTHER: a registration record states that a trial
    exists and whom it enrols, and reports no result.

    One further trial lists this disease and is deliberately left out. NCT03155620, the paediatric
    genomically-matched basket, carries an ensartinib arm. This project is curated under a standing
    content restriction on ALK-inhibitor treatment and trial material, which covers a basket trial
    carrying such an arm, so it is omitted and the omission is stated in the pull request rather
    than left silent.

    Not curated: the long tail of trials that list this disease among eligible diagnoses without
    studying it - antifungal prophylaxis, graft-versus-host prophylaxis, transplant conditioning,
    generic paediatric phase 1 studies. Trial status is a snapshot and goes stale; re-check it with
    just clinicaltrials-status-audit rather than trusting the curated value.

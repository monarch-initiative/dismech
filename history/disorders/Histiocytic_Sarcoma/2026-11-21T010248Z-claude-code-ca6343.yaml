  summary: 'Review round 1 on PR 18671: PI3K and CDKN2A nodes, MAP2K1 and CDKN2A rows'
  details: |
    Answers the automated review of PR 18671. PI3K pathway activation and CDKN2A alteration,
    which the first version gave as co-alteration figures on the MAPK/ERK node and named in
    that node's edge description, now have their own nodes: PI3K Pathway Activation
    (GO:0043491, INCREASED) and CDKN2A Alteration (GO:0045736, ABNORMAL; molecular scale,
    like the origin node). Each quotes the series of 28 for its frequency (21% and 46%) and
    a 2025 review for the alteration in histiocytic sarcoma, and each has an edge of unknown
    intermediates to neoplastic histiocyte proliferation carrying the series' sentence on a
    cooperative role for MAPK, PI3K and cyclin-CDK4/6-INK4 signalling in the pathogenesis,
    graded INDIRECT as the authors' reading of mutation data. The GO:0045736 binding reads
    the series' INK4 signalling as the activity of the INK4 protein CDKN2A encodes, which
    the abstract does not state; the node description says so. The MAPK/ERK node and the
    three edges to neoplastic histiocyte proliferation now give the cooperation as the
    series' reading, in its word pathogenesis, and the node's two cascades carry modifier
    INCREASED, as in the Langerhans cell histiocytosis and Rosai-Dorfman entries. MAP2K1
    gains a gene row (a somatic driver, from a somatic mutation in one secondary tumour; it
    is also mutated in 1 of 16 secondary tumours pooled with dendritic-cell tumours), and
    CDKN2A one (cooperating, with an unknown variant origin, because neither source says
    whether the change was somatic); neither is placed on a node, for the reason the entry
    notes give. The synonym sarcoma, histiocytic, malignant is MONDO's exact synonym for
    this term, from NCIT:C27349. Validated with just validate and count-verified-snippets
    (98 of 98).

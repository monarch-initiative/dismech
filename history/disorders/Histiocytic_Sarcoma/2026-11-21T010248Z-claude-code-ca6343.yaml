  summary: 'Create: Histiocytic Sarcoma'
  details: |
    New entry for histiocytic sarcoma (MONDO:0019479), a rare, aggressive malignant neoplasm of
    cells with the features of mature tissue histiocytes. Curated by hand from cached sources:
    the 2018 SEER population analysis of 159 adults (full text), a 2019 targeted-sequencing
    series of 28, a 2021 exome study of 16 secondary tumours pooled with dendritic-cell tumours,
    a 2025 review, a 2026 consensus statement on malignant histiocytic neoplasms, a 2025 study
    of progenitor origin in histiocytoses, a 2014 single-centre series of histiocytic and
    dendritic cell neoplasms, a 2022 four-patient series, the 2019 cobimetinib phase 2 study
    (cited only to record that none of its 18 reported patients had histiocytic sarcoma), and
    case reports (2021, 2021, 2022, 2025 and three from 2026). Primary and secondary disease are
    thin subtype rows. The chain runs from a somatic RAS-MAPK pathway mutation (origin node,
    histiocyte bound) through MAPK/ERK pathway activation (GO:0000165 and GO:0070371, as the
    Langerhans cell histiocytosis, Erdheim-Chester and Rosai-Dorfman entries bind it) to
    neoplastic histiocyte proliferation and the presenting findings, with one step for the
    secondary form's descent from a B-cell clone. KRAS, BRAF and NF1 have gene rows; they are
    not placed on the origin node, because the cited abstracts list the genes without their
    molecular activity. KRAS and BRAF are somatic drivers, each with a quote saying the change
    arose in a tumour; NF1 has an unknown variant origin and an unclassified relationship,
    because the cited studies sequenced tumour tissue without saying whether its change was
    somatic. The registry's skin and connective tissue site is recorded as two phenotype rows
    without a frequency band, since the registry pools them. Diagnosis rows cover biopsy with
    the positive and negative markers, and FDG PET/CT staging; treatment rows cover surgery,
    radiotherapy, CHOP chemotherapy and MEK inhibitors, the last resting on single-patient
    reports. One outcome phase and one incidence row, for adults, complete it. Related entities
    near this series' content limits are left out; the PR body names them. The deep-research
    report generated for this entry was used as a lead and is not committed. Validated with just
    validate and count-verified-snippets (88 of 88).

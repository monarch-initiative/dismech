  summary: 'Histiocytic sarcoma: survival by extent of disease and site'
  details: >-
    Survival and prognosis in histiocytic sarcoma, curated by hand from the literature. The Outcome
    phase now keeps each cohort's figures apart rather than merging them, and names the
    denominator behind each: the US SEER registry of 159 adults (median overall survival 6 months;
    5-year disease-specific survival 42.3% in men and 33.6% in women; 5-year overall survival
    similar across the two periods of diagnosis; no significant difference by primary site or
    between a first and a second primary cancer; 7 and 10 months with concomitant non-Hodgkin
    lymphoma or acute myeloid leukaemia against 16 for histiocytic sarcoma alone, the paper's own
    comparator), the French national series of 141 malignant histiocytoses (8.5 months for the
    subset classified as histiocytic sarcoma, 43% of the 100 cases that could be subtyped; 5-year
    overall survival 31.3% for the series; no association with age or sex; no significant difference
    between primary and secondary disease, with the authors' caveat about that group's breadth), and
    a two-centre US cohort of 43 (17 months for its 26 histiocytic sarcomas). Two new phases record
    the main prognostic axis: Unifocal disease (34.8 against 4 months in a pooled analysis of 27
    primary intracranial cases, where gross total resection was the only independent predictor; 50
    against 10 months in the US cohort, a trend at p = 0.07, on 10 unifocal patients of whom 4 had
    histiocytic sarcoma; better survival with surgery in SEER after censoring marrow, spleen and
    reticuloendothelial cases, with the registry's own limitation recorded) and Multifocal or
    disseminated disease (the same two comparisons from the other side; risk-organ involvement 5
    against 41 months; spleen and central nervous system involvement associated with shorter
    survival; a subset with durable responses). Every figure computed over a pooled population is
    graded INDIRECT and says so, while a figure reported for the histiocytic sarcomas alone within
    such a series is DIRECT. Radiotherapy is deliberately not recorded as a favourable factor in
    intracranial disease, because that paper divides against itself: its abstract reports a benefit
    on Kaplan-Meier testing (p = 0.0492) and its discussion and its abstract's conclusion restate it
    without a test or a p value, while its Cox analysis (p = 0.066 for radiotherapy) and another of
    its own sentences make the improvement statistically insignificant. Each of its statements is
    quoted - the abstract's Kaplan-Meier sentence, the Kaplan-Meier sentence in its own Results
    section which omits radiotherapy, the Cox sentence, the authors' reading of it as statistically
    insignificant, and the discussion's and the abstract's conclusion's restatements of the
    benefit - so a reader can see the conflict rather than being told about it. The Unifocal phase
    also records one of that four-case series' own patients, a localised hand lesion excised and
    irradiated and disease free twelve years later. Further findings are recorded from the same
    series' account of a 330-case study that PubMed carries without an abstract, and are graded
    INDIRECT and BACKGROUND because they are that four-case series' account of another study. Three
    references were fetched and cached, and a fourth was re-fetched as full text. That 330-case
    study is itself a National Cancer Database series; it was fetched directly and dropped, because
    PubMed carries no abstract of it to quote. Validated with just validate, count-verified-snippets
    (137/137) and validate-terms, and the structural gates. Review round 1: on the reviewer's
    suggestion three evidence items that backed the entry's own wording rather than the disease were
    removed, with the sentences they supported shortened, so the radiotherapy and p = 0.07
    disagreements are now shown by the quoted items rather than argued in prose.

  summary: Fix DVL1/DVL3 prose contradiction; add Omodysplasia differential diagnosis
  details: |
    Fixed a prose-versus-curation disagreement flagged in issue #9803: the top-level description and the DVL1 differential_diagnoses[0].description said DVL1/DVL3 act with an 'apparent gain of function' and 'opposite direction of effect' relative to WNT5A, contradicting the DVL1 entry (Autosomal_Dominant_Robinow_Syndrome_2, PR #9647, still open/unmerged) which curates modifier: DECREASED on the same non-canonical/PCP branch. Per the issue's automated-review analysis (comment by github-actions), this was a compression bug, not a genuine disagreement: DVL1 disease reduces non-canonical/PCP Wnt signalling (same direction as the WNT5A hypomorphic ligand) via a dominant-negative -1 frameshift adaptor, and separately adds an elevated canonical-branch effect only seen when mutant and wild-type DVL1 are co-expressed (PMID:25817014) -- a different branch, not an opposite direction. Rewrote both passages to say 'different branch' / 'dominant negative' instead of 'opposite direction of effect' / 'apparent gain of function', without touching the already-correct explanation (~line 741) or notes (~line 768) that the issue's analysis used as the model for the rewrite. Also added Omodysplasia (the FZD2 form, MONDO:0017136, already curated in kb/disorders/Omodysplasia.yaml) as a third differential_diagnoses entry, since FZD2 is a further gene in the same WNT5A-ROR2-FZD2-DVL interactome and the WNT5A entry's differential list previously named only DVL1 and ROR2; cited PMID:29276006 (White et al. 2018, fetched fresh via just fetch-reference), which establishes FZD2/NXN as further Robinow-pathway genes and gives the ~70%-molecularly-unsolved figure. Did not modify Autosomal_Dominant_Robinow_Syndrome_2.yaml or its stub, per the issue's explicit scope constraint (owned by open PR #9647). Validated with just validate, count-verified-snippets (40/40), validate-terms, and check-entity-refs -- all passed.

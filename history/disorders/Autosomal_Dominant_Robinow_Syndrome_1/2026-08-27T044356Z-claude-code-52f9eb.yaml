  summary: 'Review response: phenotypes, terms, evidence grading, DR artifact'
  details: |
    Response to the first review round. Added brachydactyly (HP:0001156, VERY_FREQUENT), which GeneReviews names as one of the three core skeletal findings and the entry had omitted, plus hypodontia (HP:0000668) and macrocephaly (HP:0000256, OCCASIONAL). Rebound Orthodontic Treatment from the generic NCIT:C15747 Supportive Care to NCIT:C64248 Orthodontic Treatment. Downgraded the 1999 growth-hormone case series from SUPPORT to PARTIAL: it predates the 2010 WNT5A discovery by eleven years, so those patients' genotype is unknown and may be DVL1, DVL3 or recessive ROR2. Regraded a background sentence about non-canonical Wnt signalling in a zebrafish paper from HUMAN_CLINICAL to OTHER. Committed the deep-research report and its citations sidecar; regenerating it showed the CREATE record's account of the run was wrong in one respect, in that the report does carry a reference_validation block resolving all 13 references with no confabulation, and what it actually flagged was relevance at 8 of 13 on topic. The preflight DVL1-at-52-percent warning did reproduce. Also added somatropin (NCIT:C837) as the growth-hormone therapeutic agent, the micropenis hormone therapy from the GeneReviews Management section, and changed surveillance modality from BEHAVIORAL to OTHER. A second pass then curated the female genital findings the entry had omitted - hypoplastic labia majora (HP:0000059) and clitoral hypoplasia (HP:0000060) - plus cryptorchidism (HP:0000028), all named in the same GeneReviews sentence that already supported the micropenis record. Curating only the male findings would have made the genital phenotype look sex-limited when the source describes it in both. A further round then corrected therapeutic_modality on the micropenis hormone therapy from PROTEIN_REPLACEMENT to OTHER - GeneReviews says only that hormone therapy may help, without naming the hormone, and conventional practice is testosterone, a steroid rather than a protein - and curated the three less-common skeletal findings the growth-plate node already named in prose: dislocated radial head (HP:0003083), hemivertebrae (HP:0002937) and scoliosis (HP:0002650), all OCCASIONAL off the same GeneReviews sentence. 38/38 snippets verified and separately confirmed verbatim by a raw substring audit bypassing validator normalization.

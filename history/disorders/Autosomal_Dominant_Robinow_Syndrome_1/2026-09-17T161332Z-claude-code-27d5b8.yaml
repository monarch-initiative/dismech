  details: |
    Round-3 review response (PR #9810).

    BLOCKING: the entry description and one evidence explanation attributed the competing "loss of canonical, gain of JNK/PCP" reading to "a separate mouse model". Resolved PMC10120075 via the NCBI ID converter to PMID:36916233 (DOI 10.1242/dmm.049844, Dis Model Mech 2023), titled "Mechanistic studies in Drosophila and chicken give new insights into functions of DVL1 in dominant Robinow syndrome" - chick limb misexpression plus Drosophila wing, not mouse. Fetched it with just fetch-reference and cited it on the DVL1 differential with an exact abstract quote, so the contested direction of effect is sourced on both sides rather than asserted. Confirmed from cache frontmatter that PMID:36916233 and PMID:42424595 share five authors (Akarsu, Gignac, Fu, Verheyen, Richman), so the prose now says the disagreement is between two readouts of one experimental programme, not between species or independent groups.

    SUGGESTION 1: moved the repo-provenance sentence about the deep-research artifact framing DVL1/DVL3 as gain-of-function out of the disease-facing description into the existing "Deep-research handling" paragraph in notes, recording there that the report's own model table lists PMC10120075 as chick/Drosophila.

    SUGGESTION 2: regraded the PMID:42424595 conclusion-sentence evidence item from IN_VITRO to MODEL_ORGANISM, since that claim rests on chick and Drosophila readouts as well as culture work. The luciferase item stays IN_VITRO. The snippet appears once in kb/, so this creates no split grading.

    Validation: just validate passed; just validate-terms passed; check-duplicate-keys and check-entity-refs clean; check-folded-hyphens clean; count-verified-snippets 48/48 (was 47/47, +1 for the new item).

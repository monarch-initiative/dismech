  summary: Wire the DRS1 pathograph to its phenotypes and gene
  details: |
    This entry was merged on main by PR 9600 and is edited here only to fix the same wiring defect corrected across the rest of this PR: phenotype causal-inlink was 0/15 and gene-to-mechanism wiring 0/1, because the terminal pathophysiology nodes named no phenotypes and the causal gene was recorded only under genetic_context, which graph.py does not read for gene edges. Added a WNT5A gene descriptor and downstream edges from the two terminal nodes to the phenotypes they explain; both metrics are now 100 percent, matching the five sibling entries. Edges over unestablished ground, macrocephaly and the cardiac defect, are INDIRECT_UNKNOWN_INTERMEDIATES with descriptions saying so. No evidence, phenotype or claim content was changed, and the edit is called out in the PR discussion so the original author can object.

  summary: 'Review round 3: merge main, fix DVL1 allele name'
  details: |
    Third review round on PR #11735, plus a conflict repair. Main had independently rewritten the DVL1 mechanism prose in this entry's description, the DVL1 differential-diagnosis description, and the PMID:25817014 co-expression explanation, so three hunks conflicted. Resolved by keeping main's rewritten prose (which already drops the 'settled opposite direction' overstatement this PR was filed to remove) and grafting on this PR's unique contribution: that the two-fold co-expression gain the primary report ties to the osteosclerosis is itself contradicted by a different group's equimolar assay recounted in PMID:42424595, with a cross-reference to the coexpression_canonical_wnt_gain_model hypothesis in Autosomal_Dominant_Robinow_Syndrome_2. None of main's added evidence items or its new Omodysplasia differential were dropped. Also corrected the allele name from DVL1-1519dupT to DVL1-1519ΔT: the source spells it c.1519delT and the sibling entry already calls it 1519ΔT, so dupT asserted a duplication the assay did not use. Validation: just validate clean, 48/48 snippets verified, plus check-entity-refs, check-causal-targets, check-duplicate-keys and check-enum-values.

  summary: 'Review round 2: source the DVL1 mechanism prose, evidence the Omodysplasia
    differential'
  details: |
    Second round on PR #9810, responding to the review's two blocking items plus one of the non-blocking notes.

    Item 1 - the replacement prose asserted an unsourced mechanism. Three claims were unsupported by anything in the file: reduced non-canonical/PCP signalling, escape from nonsense-mediated decay, and dominant-negative action.

    - Fetched PMID:42424595 [Tophkhane et al., the DVL1 C-terminus study the review pointed at] and cited it twice on the DVL1 differential. Its facial-mesenchyme luciferase result is the direct measurement behind the reduced-signalling claim: wtDVL1 activated both canonical and JNK-PCP signalling while both variant constructs signalled significantly lower. Its concluding sentence is the experimental statement behind "dominant negative": the novel C-terminus is sufficient to interfere with the protein expressed from the normal allele.
    - Dropped the bare label "dominant-negative" from both prose passages, keeping the sourced description of what was measured instead.
    - Cited PMID:25817014 for the novel basic C-terminus and for the transcript-present/protein-stable observation. Deliberately stopped short of asserting NMD escape: the abstract reports mutant transcript in patient fibroblasts and unimpaired protein stability but does not itself name nonsense-mediated decay, so the prose now states what was measured.
    - Acknowledged the competing model rather than flattening it, as the review asked. The description now says the direction of effect on each branch is contested, naming the mouse model reporting loss of canonical with gain of JNK/PCP and noting that this entry's deep-research artifact frames DVL1/DVL3 as gain-of-function throughout. The tension is also recorded in the explanation on the PMID:42424595 signalling item.

    Item 2 - the Omodysplasia differential's clinical features had no supporting evidence. Added three evidence items from PMID:29383834, already cached on main and already what kb/disorders/Omodysplasia.yaml cites for these features: the OMOD2 characterization sentence, the proband presentation, and the radiological findings.

    The review's specific catch here was right and changed the content, not just the citations. That paper's molecularly confirmed FZD2 proband had "rhizomelic short stature with elbow restriction", so "relatively preserved stature" was not merely unsourced but contradicted. The differential now separates on the pattern of shortening [predominantly humeral rather than generalized mesomelic] instead of on height, and the distinguishing_features list was changed to match: "Genitourinary anomalies more prominent than in the WNT5A form" was dropped as an unsourced comparative claim, replaced with the sourced elbow-restriction feature.

    Non-blocking note taken: "A third gene" changed to "A further gene", since the same sentence names the four genes that precede FZD2.

    Non-blocking note not taken: the differential stays bound to MONDO:0017136 [omodysplasia] rather than MONDO:0008123. The intent is to cross-reference the whole Omodysplasia entry, which covers both the dominant and recessive forms, and that entry is itself bound to the parent term.

    Validation run: just validate [47/47 snippets verified], just validate-terms [passed], just check-entity-refs, just check-duplicate-keys, just check-folded-hyphens, just check-reference-titles [no findings for this entry].

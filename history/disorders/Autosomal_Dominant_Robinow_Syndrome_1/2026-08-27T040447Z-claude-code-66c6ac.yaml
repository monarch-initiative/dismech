  summary: 'Create: Autosomal Dominant Robinow Syndrome 1 (WNT5A)'
  details: |
    New entry for WNT5A-related autosomal dominant Robinow syndrome (MONDO:0024455). Scoped deliberately to the WNT5A form: DVL1 and DVL3 dominant disease act through truncated adaptors with an apparent gain of function on the canonical branch, opposite in direction to the hypomorphic ligand curated here, so they are differential diagnoses rather than subtypes. The GeneReviews chapter PMID:25577943 is tagged and mined across all four sections its abstract carries. The deep-research report arrived with no reference_validation block, so every reference was fetched and verified individually; its preflight also warned DVL1 was mentioned at 52% the rate of WNT5A, and those sections were used only for differentials. Two evidence items initially quoted paper titles; both were replaced with real abstract quotes after checking the caches, which also strengthened the growth-hormone efficacy evidence and added the DVL1 allele-interaction mechanism. 28/28 snippets verified.

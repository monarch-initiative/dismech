  summary: 'Reconcile DVL1/WNT5A mechanism prose (issue #9803)'
  details: |
    Reworded the disease description, DVL1 differential-diagnosis block, and its scope note to stop asserting DVL1 runs the Wnt pathway in a settled 'opposite direction of effect' / 'apparent gain of function' from WNT5A. Both DVL1 studies agree the truncated protein signals LESS than wild type when tested alone, the same direction as the WNT5A ligand hypomorph. What differs is two more specific, separately-sourced claims: (1) a co-expression (heterozygous-mimicking) effect on canonical Wnt signalling, reported as an increase by PMID:25817014 but found to be a dominant-negative decrease for a DVL1 frameshift in the same research group's own later assay (quoted in PMID:42424595, cited in the sibling Autosomal_Dominant_Robinow_Syndrome_2 entry) -- an unreconciled literature conflict, not a settled fact; and (2) a nuclear-mislocalization property specific to the frameshift allele with no counterpart in the WNT5A ligand loss. Updated the differential's PMID:25817014 evidence explanation to note the conflicting later result rather than presenting the co-expression finding as confirmed mechanism.

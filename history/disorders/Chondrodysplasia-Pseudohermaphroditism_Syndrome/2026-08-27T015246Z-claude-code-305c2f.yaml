  summary: 'Create: chondrodysplasia-pseudohermaphroditism syndrome (HHAT) - ISDS
    group 12, NOS 12-0060'
  details: |
    Curated de novo as part of filling ISDS Nosology group 12 (Spondylometaphyseal dysplasias), which had no dismech entries at all before this work: a tally of classifications.isds_skeletal_category across kb/ showed 39 of the 41 groups populated and group 12 at zero.

    Group membership was verified against Table 1 of the 2023 revision (Unger et al., PMID:36779427) full text, not inferred from disorder names. That check found six members (NOS 12-0010 to 12-0060), two more than the dismech schema description listed, and it also confirmed that four disorders carrying an SMD name belong to other groups.

    Evidence discipline: every snippet is an exact substring of a cached reference generated by just fetch-reference; no cache file was hand-written. Nodes and edges whose mechanism the cited authors describe as unresolved are graded PARTIAL and/or INDIRECT_UNKNOWN_INTERMEDIATES rather than asserted, and the open questions are carried as discussions.

    Validated with just validate (schema conformance, ontology term validation, and reference-snippet verification), plus the whole-KB offline gates.

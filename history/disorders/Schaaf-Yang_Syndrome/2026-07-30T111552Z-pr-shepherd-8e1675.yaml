  summary: Add 6 phenotypes, 3 frequency bands, oxytocin treatment and target_mechanisms
  details: |
    PR shepherd run addressing the second ai4c-reviewer re-review on PR #7120.

    Item 6 (frequency bands from quotable counts): added frequency to three existing phenotypes, each
    with a new derived-count evidence item from the PMID:27195816 full-text cache - Hypogonadism
    FREQUENT (8/11 male cases, 73%), Short Stature FREQUENT (10/16, 63%), Sleep Apnea FREQUENT (9/13,
    69%). Also added the two previously unmodeled skeletal phenotypes with counts from the same
    sentence: Small Hands VERY_FREQUENT (12/14, 86%) and Small Feet FREQUENT (8/15, 53%). HP:0001773
    Short foot is the closest available term for small feet, so preferred_term keeps the source wording.

    Items 11 and 12 plus item 10 (unmodeled GeneReviews-managed manifestations): added Gastroesophageal
    Reflux (FREQUENT, from the explicit "frequently reported in SHFYNG" statement), Constipation,
    Cryptorchidism (FREQUENT) and Hypothyroidism. The GeneReviews MANAGEMENT sentence naming
    gastroesophageal reflux disease, constipation, undescended testes and hypothyroidism spans four
    wrapped lines in the cache; the reference validator normalizes wrapping, confirmed by a passing
    validate-references run. Constipation additionally cites the surveillance sentence.

    Deliberately no frequency band on Constipation or Hypothyroidism: GeneReviews establishes that they
    occur and are managed but reports no rate, and no count exists in the cited cohort. A notes field on
    each records why, so a future curator does not infer a band from a management sentence. Cryptorchidism
    carries FREQUENT with a notes caveat that the 8/11 count is for cryptorchidism and/or micropenis
    combined and is therefore an upper bound for cryptorchidism alone.

    Item 5 (declared-but-uncited PMID:38396741): now cited on the Hypothalamic Oxytocin Deficiency node,
    where it belongs, rather than deleted from references. Graded PARTIAL with evidence_source OTHER
    because the paper is a narrative review that explicitly formulates a new hypothesis about oxytocin
    thermoregulation; it corroborates hypothalamic oxytocin as the affected system but does not establish
    the thermoregulatory arm, matching the node's PROVISIONAL mechanism_confidence.

    Item 9 (target_mechanisms and oxytocin): added an "Oxytocin (Experimental)" treatment with
    target_mechanisms RESTORES on Hypothalamic Oxytocin Deficiency, therapeutic_modality PEPTIDE and
    therapeutic_agent CHEBI:7872 oxytocin (verified via OLS; the term was auto-added to
    cache/chebi/terms.csv by the validator). It is explicitly labelled experimental: evidence is
    model-organism only and the authors' therapeutic proposal is framed for Prader-Willi neonates, not
    SYS, so the read-across rests on shared MAGEL2 involvement. The proposal item is graded PARTIAL for
    that reason. Also added target_mechanisms BYPASSES from Feeding Therapy to Neonatal Suckling and
    Feeding Failure, which is the semantically correct link for tube feeding.

    An earlier draft of the oxytocin evidence used a paraphrased snippet; the repository pre-edit
    validation hook blocked the edit and it was replaced with the exact abstract wording before the
    change landed.

    Still open and left for the author: item 3 (no diagnosis: section), item 4 (no biochemical: section),
    the remaining unmodeled phenotypes from item 6 (facial dysmorphism 16/18, behavioral abnormalities
    9/11, skin picking 7/12, diagnostic yield, causes of death, the c.1996delC correlation), and
    target_mechanisms on the remaining supportive treatments, which were left off deliberately because
    CPAP, growth hormone and physical therapy do not act on a modeled mechanism node and a forced edge
    would be worse than none.

    Validation: just validate, just validate-references and just validate-terms all pass.

  summary: Add Hypogonadotropic hypogonadism (HP:0000044) with its single-patient
    evidence
  details: |
    Added a Hypogonadotropic hypogonadism phenotype (HP:0000044). The entry previously carried only the PARENT term Hypogonadism (HP:0000135); since closure runs downward, a parent annotation cannot satisfy a criterion citing the child, so the grouping reported a contradiction.

    The specific term IS supportable but only weakly, and the entry now says so: evidence rests on one reported female (PMID:27195816), and the same passage states she is the only female reported with hypogonadism to date and that no systematic endocrinological assessment of the syndrome has been published. The second evidence item is recorded as PARTIAL for that reason and no frequency band is asserted. The broader Hypogonadism annotation is retained separately, because cryptorchidism and micropenis in males are not themselves evidence that the defect is gonadotropin-dependent.

    Resolves a contradiction reported on a grouping page: this entry is asserted as a member of a grouping whose NECESSARY criterion it did not satisfy.


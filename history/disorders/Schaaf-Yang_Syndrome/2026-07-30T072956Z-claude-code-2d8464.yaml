    Addressed ai4c-reviewer CHANGES_REQUESTED items on PR #7120. (1) Replaced GO:0016579 'protein deubiquitination' with GO:0070534 'protein K63-linked ubiquitination' (modifier DECREASED) on the Impaired MAGE-L2-TRIM27 Endosomal Protein Recycling node - the node description and its own cited evidence (PMID:23452853) describe K63-linked ubiquitination of WASH, the opposite direction; added a supporting evidence item quoting the K63-linkage result. (2) Set frequency FREQUENT (was OCCASIONAL) on the obesity phenotype, backed by a derived count from the PMID:27195816 full-text cache (8/17 = 47%); renamed the phenotype to 'Excessive Weight Gain and Obesity' and documented that frank PWS-like hyperphagia is uncommon, so the band scopes to the annotated HP:0001513 term. (4) Removed the unsupported '>100 affected individuals by 2023' claim from prevalence notes. (5) Added a FREQUENT Ophthalmologic 'Eye Abnormalities' phenotype (HP:0000478) from the quotable 11/14 (79%) full-text count. All new snippets verified as exact substrings of their validator-generated caches; just validate passed.

  summary: Add diagnosis and biochemical sections plus three phenotypes above threshold
  details: |
    PR Shepherd fix addressing the three remaining blocking items on PR #7120 (ai4c-reviewer re-review of b30dc1e6): no diagnosis section, no biochemical section, and three unmodeled phenotypes above the >10% threshold.

    Item #3 - new diagnosis: section (two entries, both bound to MAXO:0000533 molecular genetic testing):
    - "Molecular Genetic Testing of MAGEL2": the GeneReviews molecular-diagnosis criterion (PMID:33570896) plus the parental-testing/allelic-origin requirement that follows from imprinting (PMID:27195816).
    - "MAGEL2 Testing After Negative Prader-Willi Methylation Analysis": the previously unused PWS-exclusion trigger and the contractures-versus-hyperphagia discriminators, both exact quotes from PMID_27195816.md.

    Item #4 - new biochemical: section (three entries, the first biochemical coverage for this entry):
    - Secreted Abeta1-40 (NCIT:C103353), decreased in patient fibroblasts, with the authors' candidate-biomarker proposal as a second evidence item.
    - Intracellular glutamine (NCIT:C522), decreased; curated as a measured abnormality only because the authors do not propose it as a biomarker.
    - HOTAIR long non-coding RNA (NCIT:C116287); no presence value asserted because the cached abstract does not state the direction of change.
    All three are cell-typed to CL:0000057 fibroblast and graded IN_VITRO. Notes record the n=7 vs n=11 patient-fibroblast design and that these are candidate rather than validated clinical assays, so no reference_ranges are curated.

    Item #6 remainder - three phenotypes added:
    - Facial Dysmorphism, VERY_FREQUENT (16/18, 89%), HP:0001999. First craniofacial phenotype on the entry.
    - Impulsive and Compulsive Behavioral Profile, VERY_FREQUENT (9/11, 82%), HP:0000708 Atypical behavior. Deliberately modeled as one node rather than split across HP:0000722 and HP:0100710: the source reports 9/11 for the spectrum as a whole, so splitting would wrongly assign the combined count to each component.
    - Habitual Skin Picking, FREQUENT (7/12, 58%), HP:0100716 Self-injurious behavior.

    Evidence discipline: every new snippet was copied verbatim from the cached files and independently re-verified. All 93 evidence snippets now in the entry, including the ~10 new ones, are exact whitespace-normalized substrings of their reference caches. No reference cache file was created or hand-edited; no new fetch was needed since all content came from PMID_27195816.md and PMID_36243518.md, already cached and cited on this branch. The three new NCIT terms were resolved through the configured OLS adapter and validate with exact label matches (cache/ncit/terms.csv updated accordingly).

    Deliberately not changed: the GeneReviews DIAGNOSIS/TESTING evidence item remains on the "MAGEL2 Truncating Variant on the Expressed Paternal Allele" pathophysiology node in addition to being cited in the new diagnosis section. That snippet does genuinely support the paternal-allele claim the node makes, so it is cited in both places rather than moved out of the pathograph.

    Validation: "just validate kb/disorders/Schaaf-Yang_Syndrome.yaml" passed (schema, term, and reference validation); the repo pre-edit hook also caught and blocked an initial attempt that used a description slot on Biochemical, which the class does not define - that prose was folded into notes.

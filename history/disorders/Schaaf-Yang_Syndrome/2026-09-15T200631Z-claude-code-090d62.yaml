  summary: Curate strabismus, esotropia and myopia as phenotypes in their own right
  details: |
    Reverses the shape of the previous session's edit on this entry. Strabismus (HP:0000486), esotropia (HP:0000565) and myopia (HP:0000545) were recorded inside the Eye Abnormalities binding, in a spectrum_terms slot that has now been removed from the schema. Each is instead an ordinary phenotypes entry with its own term and its own evidence, citing the same sentence that already backed the summary phenotype (PMID:27195816) and carrying no frequency, because the source reports a combined 11/14 count for eye abnormalities and no per-finding counts. No new claim is made: the three findings are named in the quoted sentence and were already named in the entry's description. The Eye Abnormalities node is retained, since the aggregate rate is a fact none of the three specific entries carries; its basis is now VARIABLE_SPECTRUM (renamed from SPECTRUM_SUMMARY) and its explanation says which part of the claim is the aggregate. Validated with linkml-validate against the Disease class, linkml-term-validator, the reference snippet audit (108/108 verified), check_coarse_phenotypes, check_enum_values, check_duplicate_yaml_keys, check_entity_refs and check_causal_targets.

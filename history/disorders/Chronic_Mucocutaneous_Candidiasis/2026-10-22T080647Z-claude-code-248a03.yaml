  summary: Add IL23R as a CMC susceptibility gene (#14265)
  details: |
    Added an IL23R genetic record typed SUSCEPTIBILITY with the R381Q variant, following the CLEC7A precedent in the same entry: the homozygous R381Q association with CMC rests on one family (PMID:40685773, full text cached), and the authors describe incomplete penetrance. Not added as a has_subtypes row, as issue #14265 proposed. Complete AR IL-23R deficiency (PMID:36763636) was read and cited for context: all six patients had MSMD and two had CMC, so that disorder belongs with the MSMD entries. Validated with just validate, validate-terms, count-verified-snippets (all snippets verified), check-duplicate-keys and check-entity-refs.

  summary: Demote AD-HIES, DOCK8 deficiency, Secondary CMC from has_subtypes to differential_diagnoses;
    add IL17_Immunity_Defects grouping
  details: |
    Per #7644 (a follow-up from the automated #7643 review), demoted AD-HIES and DOCK8 deficiency out of has_subtypes entirely (both are separate MONDO entities not is_a children of MONDO:0015279) and added DOCK8 deficiency plus a general Secondary/acquired CMC entry to differential_diagnoses (Secondary CMC's has_subtypes entry is removed; its three specific instances - HIV/AIDS, drug-associated, diabetes - were already curated as differential_diagnoses). RORC and CARD9 deficiency are kept as deliberate dual subtype/differential entries, matching the existing APS-1/APECED pattern, since the issue's step 3 only asked to demote AD-HIES/DOCK8/Secondary CMC. Updated the closing notes block (item 6) to describe the new state. Companion change: created kb/groupings/IL17_Immunity_Defects.yaml, the sanctioned union grouping over the already-distinct Disease entries with their own dismech entries (CMC, Autoimmune Polyendocrine Syndrome Type 1, Autosomal Dominant Hyper-IgE Syndrome). Deliberately deferred: nesting under Inborn_Errors_of_Immunity, factoring an il17_mucosal_barrier_immunity module, and a GroupingMember subtype-reference schema slot (IL17RA/IL17RC/IL17F/ACT1/STAT1 GOF/RORC/CARD9 have no standalone Disease entry yet, so cannot be grouping members). Validated with just validate (119/119 snippets verified), just check-groupings (structure OK), and just validate-grouping.

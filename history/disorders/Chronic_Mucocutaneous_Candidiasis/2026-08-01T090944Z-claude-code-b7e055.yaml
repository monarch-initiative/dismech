  summary: 'Create: Chronic Mucocutaneous Candidiasis (MONDO:0015279)'
  details: |
    De novo curation of chronic mucocutaneous candidiasis (CMC). Deep research via Edison/Falcon (research/Chronic_Mucocutaneous_Candidiasis-deep-research-falcon.md, 27 citations resolving to ~7 unique sources, STAT1-GOF-heavy); Falcon output used only as leads and its HPO ID suggestions were largely wrong (HP:0002923 offered as Autoimmune thyroiditis is actually Rheumatoid factor positive; HP:0001597 offered for two different phenotypes; HP:0004944 mislabelled Cerebral aneurysm). The evidence base was therefore rebuilt from PubMed E-utilities against the landmark IL-17-axis literature (Puel 2011 Science PMID:21350122; Liu 2011 JEM PMID:21727188; van de Veerdonk 2011 NEJM PMID:21714643; Toubiana 2016 Blood PMID:27114460; Glocker 2009 NEJM PMID:19864672; Puel 2010 and Kisand 2010 JEM PMID:20123958/20123959; Boisson 2013 Immunity PMID:24120361; Ling 2015 JEM PMID:25918342; Okada 2015 Science PMID:26160376; Milner 2008 Nature PMID:18337720; Depner 2016 PMID:26604104; Koo 2017 PMID:28815025; Leiding 2018 HSCT PMID:28601685; Deya-Martinez 2024 JAKi PMID:37935260). Modelled the IL-17-axis convergence as an explicit CANONICAL mechanistic hypothesis (il17_axis_convergence) carried on causal edges, and the STAT1 gain-of-function to Th17-loss inversion as a second hypothesis (stat1_gof_inversion) with JAK inhibition as its therapeutic corollary. CARD9 invasive/CNS fungal disease kept as a separate pathophysiology node and outcome so it is not flattened into the mucocutaneous phenotype; APECED anti-IL-17 autoantibody route modelled as an acquired phenocopy entering the shared pathway at the receptor, cross-referencing kb/disorders/Autoimmune_Polyendocrine_Syndrome_Type_1.yaml rather than duplicating it. Validated: just validate (schema + terms + references) passed, 109/109 snippets verified; just validate-terms passed; just validate-references passed; just compliance 85.7 percent global / 85.8 percent weighted; just compliance-connectivity reports no gaps (100 percent phenotype causal connectivity, 100 percent gene-to-mechanism wiring). Note: the entry was rewritten from context after an API crash destroyed the first full write; the Falcon deep-research artefacts survived and were not regenerated.

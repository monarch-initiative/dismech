  summary: Bind LOINC Candida culture and sequencing identification codes
  details: |
    LOINC tranche B batch 27. The culture-confirmed candidiasis row takes two codes, one per route it names: LOINC:555-3 (Candida sp identified in Specimen by Organism specific culture) for culture and LOINC:98393-2 (Candida sp identified in Isolate by Sequencing) for molecular identification.

    Both report an identity rather than mere presence, which is the species identification the row requires, and both sit at genus level because the assay is what names the species: a code reading Candida sp identified returns the species as its result. The specimen is left unqualified to match the affected site, which varies across this disease's mucosal and cutaneous presentations. MALDI-TOF was not bound: the row says molecular identification, and mass spectrometry is proteomic. Antifungal susceptibility testing is a separate measurement class and is not bound here.

    The other two diagnosis rows are host immunology rather than pathogen assays - phospho-STAT1 flow cytometry with STAT1 sequencing, and the anti-IL-17/IL-22 autoantibody assay - so they fall outside this tranche; the autoantibody assay belongs to the autoantibody tranche.

    Absence and enumeration basis: the pinned Tuva LOINC 2.83 export (data/loinc/MANIFEST.yaml, sha256 verified, snapshot_date 2026-10-07), read in full at 112,405 rows, so the result set is complete rather than a ranked page. Part-level questions were taken to the Monarch KG instead, because that export carries no LP or LG rows at all. Codes absent from cache/loinc/terms.csv on origin/main and seeded by the term validator against the Monarch KG; no label typed by hand. Checked against the 261 LOINC rows added by all 44 open loinc PRs, enumerated with pagination: no collision.

  summary: Create Acanthocephaliasis infectious disease entry
  details: |
    Added a new Acanthocephaliasis entry for MONDO:0000295 and deleted its stub. The curation binds the disease to the acanthocephalan phylum, summarizes the dominant human agents Macracanthorhynchus hirudinaceus, Macracanthorhynchus ingens, and Moniliformis moniliformis, and models the fecal egg, arthropod acanthor-to-cystacanth, prepatent juvenile attachment, and patent adult small-intestinal worm phases that explain human infection after ingestion of infected arthropods.

    The entry uses PMID:34076470 as the main human acanthocephaliasis review for agent identity, epidemiology, multihost life cycle, cystacanth ingestion, progression, clinical spectrum, Bolbosoma/Corynosoma severity, proboscis-associated mucosal injury, adult-worm and stool-egg diagnosis, and pyrantel or removal-based treatment patterns. PMID:17570979 adds M. moniliformis background evidence for proboscis-driven mucosal damage, and PMID:39979033 adds a recent pediatric pyrantel-treated M. moniliformis case.

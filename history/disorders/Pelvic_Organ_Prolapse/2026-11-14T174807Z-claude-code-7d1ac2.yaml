  details: |
    Added conforms_to menopausal_estrogen_withdrawal#Systemic Estradiol Withdrawal on Oestrogen Withdrawal and Ageing of the Pelvic Support Tissues, and a node-level notes block recording why the link stops there.

    Verified the module's reason for restricting this entry to the systemic node: the node already carries PMID:28538602 with supports REFUTE and the snippet that past hormone therapy, its duration and current vaginal oestrogen were all unassociated with pelvic organ support, in 1443 postmenopausal women. The existing explanation reads that as refuting the therapeutic corollary rather than the risk factor, which is exactly the receptor-level reading the module's notes say not to conform here. So no link was added to the module's receptor node.

    just check-conformance-content reports process_absent on the link: the module binds GO:0010817 regulation of hormone levels and this node binds GO:0030198 extracellular matrix organization. That is the pelvic consequence rather than the hormone-level term, which is also a symptom of this node bundling ageing with the hormonal fall; only the hormonal half conforms, and the notes say so. No term was copied in. cell_type_absent and edges_absent do not fire.

  details: |
    Issue #10061 / PR #10003 retired the PARTIAL value of the evidence supports slot while this branch was open. Merging origin/main on 2026-08-30 made 21 evidence items in this entry schema-invalid and turned the required build red on an otherwise approved PR. Each of the 21 was regraded individually against the claim it attaches to, not backfilled to a single value - 16 became SUPPORT, 3 REFUTE, 1 NO_EVIDENCE, and 1 two-sentence quote was split into a SUPPORT and a REFUTE item because its two sentences carry opposite directions for the same edge. directness was assessed per item (DIRECT where the quote asserts the claim, INDIRECT where the claim follows by an inference step such as a therapeutic response cited for the mechanism it targets, or a mouse result cited for human disease) rather than left blank or filled uniformly. Every explanation that argued for the retired grade was rewritten to argue for the new one. The pessary treatment description was extended to carry the adverse-event finding so the prose and its evidence item agree. scripts/migrate_supports_enum.py was deliberately not used because it scans all of kb/ and would have pulled unrelated entries into this PR diff. Validation - just validate-disorders passes with 113/113 snippets verified (was 112/112); check-folded-hyphens, check-title-snippets, check-snippet-grading, check-duplicate-keys and check-entity-refs clean; no cache churn.

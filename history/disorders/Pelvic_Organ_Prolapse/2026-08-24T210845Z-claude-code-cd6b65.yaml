  details: |
    Created kb/disorders/Pelvic_Organ_Prolapse.yaml against the obstetrics coverage gap tracked in issue #7837. Thirteen pathophysiology nodes across a muscular arm (childbirth overstretch, levator avulsion, urogenital hiatus enlargement) and a connective tissue arm (constitutional susceptibility, elastogenesis failure, oxidative stress, collagen and MMP/TIMP imbalance, vaginal smooth muscle depletion), converging on failure of apical and lateral attachment and descent beyond the hymen, plus a post-surgical recurrence node. Two competing mechanistic_hypotheses: CANONICAL levator-primary and ALTERNATIVE matrix-primary. Four discussions: two KNOWLEDGE_GAPs (matrix cause versus consequence, and anatomy/symptom discordance), one HUMAN_MODEL_MISMATCH on the Loxl1 and Fbln5 knockout mice, and one INTERPRETATION recording why conformance to emphysema_protease_antiprotease_imbalance was declined. Nine phenotypes with no frequency bands, deliberately; six genetic entries; two animal models with modeled_mechanisms and readouts; five treatments, two of which carry only negative or partial evidence and no target_mechanisms edge. Twenty-four references, all fetched with just fetch-reference from PubMed searches; no deep-research provider report was used, so evidence SOP sections 2a and 2b do not apply. Validation: just validate-disorders passed schema, terms and references, reporting Snippets checked 100/100 verified against cached references. check-folded-hyphens, check-duplicate-keys, check-snippet-length, check-title-snippets, check-environmental-evidence, check-snippet-boundaries and check-source-defect-claims are all clean for this file; 9272 targeted tests/test_data.py tests passed.

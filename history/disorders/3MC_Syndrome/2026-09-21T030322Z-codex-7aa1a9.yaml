  summary: Refine evidence roles and document unexplained 3MC cases
  details: |
    After independent approval, removed the stale coarse-phenotype baseline row using its generator and added the historical molecular-diagnosis gap from the 2017 COLEC10 discovery study. The 2016 source suggested in review predates COLEC10 discovery and cannot establish testing of all three genes. The new discussion separates an old selected-cohort fraction from current diagnostic yield and leaves additional loci, missed variants and phenocopies unresolved. Kept the existing qualified craniofacial links; additional feature-specific links were considered but remain unmodeled without better mechanistic evidence. Corrected seven introductory/background quote roles and the copied ptosis explanation. Narrowed the factor D biological-process annotation to measured protein maturation (GO:0051604, checked with OLS) rather than broad alternative-complement activation. Authoritative validation passed schema, ontology and all 139/139 exact snippets. The initial independent automated review completed successfully with approval and no critical or important findings; follow-up validation and CI are recorded on the PR.

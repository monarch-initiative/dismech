  summary: 'Create: 3MC Syndrome'
  details: |
    De-novo curation of 3MC syndrome as a single Disease entry covering all three
    genetic forms - MASP1, COLEC11 and COLEC10. The lump is mechanistic, not merely
    clinical: CL-K1 and CL-L1 form heteromeric complexes and MASP-3 is the
    collectin-associated protease, so one pathograph serves all three forms.
    Per-gene detail is carried in has_subtypes and genetic.

    Deep research: one openscientist report,
    research/3MC_Syndrome-deep-research-openscientist.md. Its term-validation
    section was read before any binding was made, and two of its suggestions were
    rejected. The report offered MONDO:0018721 as "3MC syndrome" - MONDO calls that
    identifier "obsolete rare combined vascular malformation" - and HP:0100541 for
    the caudal appendage, which HPO calls "Femoral hernia". The entry instead binds
    MONDO:0017398 and HP:0002825, both checked against OLS directly. The report's
    renal ischemia-reperfusion citations were also deliberately not used: they
    describe an acquired adult CL-11 injury mechanism that the report itself flags
    as distinct from the developmental syndrome. The report did contribute real
    mechanism: the calcium-binding/secretion basis of collectin loss of function and
    the demonstration that MASP-3 is the exclusive pro-factor D activator in resting
    blood.

    Mechanism curated as collectin or MASP-3 loss, then loss of the CL-K1 neural
    crest guidance cue, then impaired cranial neural crest migration, then defective
    craniofacial morphogenesis. The alternative-complement consequence, impaired
    pro-factor D maturation, is curated as a deliberately terminal node with no
    clinical sequela, because patients retain detectable mature factor D and are not
    clinically immunodeficient. A note on that node warns future curators against
    attaching an immunodeficiency phenotype to it.

    Validation: just validate passes for schema, terms and references, with 45/45
    snippets verified against the local reference cache.

  summary: Review 3MC syndrome against clinical and mechanistic full texts
  details: |
    Scope: complete claim-level review of the existing entry and matching OpenScientist deep-research report. Confirmed no prior REVIEW history and no exact-disorder overlap in a fully paginated live scan of 133 open PRs, including extra file pages. Work was isolated in a sparse worktree.

    Source coverage: read all cited 3MC abstracts and the complete scientific text, methods and tables of PMID:21258343, PMID:25912189, PMID:27535802, PMID:28301481, PMID:34589314, PMID:34636477 and PMID:41774788. The last three were regenerated as genuine PMC XML via just fetch-reference. PMID:21035106 resolves to PMC2978960 but the public HTML endpoint returned a browser challenge; the sanctioned fetcher retained its abstract. PMID:28794230 also remained abstract-only. No claims require unavailable body text. No reference cache was hand-edited. An unused fetcher-code cherry-pick was removed before submission because these sources use the existing XML route.

    Mechanisms: split variant-specific calcium binding, carbohydrate binding, CL-K1 secretion, CL-L1 secretion and CL-L1 chemoattraction into separate events. Keep proposed biosynthetic quality-control and neural-crest intermediates inferential. The CL-L1 Cys270Serfs*33 family has normal measured plasma abundance but impaired HeLa-cell chemoattraction. Correct the assertion that all MASP1 alleles lie in exon 12 or affect only MASP-3; early shared-sequence nonsense alleles occur. Remove uniform homozygosity from biallelic contexts. Distinguish factor D maturation in patients, resting-plasma inhibitor experiments and coagulated serum. Residual mature factor D does not establish normal clinical immunity. Connect the proposed craniofacial route to human findings without assigning other organ malformations to neural crest.

    Models: read beyond the absolute wording of the 2026 osteoclast abstract. Colec11 single-knockout mice have low overt spinal-phenotype incidence (1/88), with modest cellular differentiation impairment. Combined deletions have overt findings in 22/78, 21/77 and 22/95 animals; detailed imaging/histology selected overtly affected animals. Human experiments use engineered healthy-donor KOLF2 iPSCs, not patient cells, and COLEC11 deletion alone impairs differentiation. Distinguish ex-vivo rescue, human convertase inhibition and in-vivo pathology. Partial rescue and terminal-complement deposition do not prove a necessary linear C3 pathway, direct CL-11 cleavage of C5, or an osteoclast-mediated cause of human malformations. An independent full-text peer audit checked this branch and exact quotes.

    Clinical completeness: correct unsupported frequency bands, selected-cohort generalization, periumbilical anomalies versus depression, urinary malformations versus vesicoureteral reflux, and motor versus global developmental delay. Historical ranges remain within cited context; overlapping ranges and single reports are not population penetrance. Split omphalocele from umbilical hernia and add directly observed craniofacial, ocular, cardiac, urinary, genital and orthopedic findings with case-specific limits. Exclude the Cureus report's implausible weight units. Preserve adult survival and variable cognition without asserting a uniformly static course. Carrier screening remains a variant-specific carrier frequency; parental origin in Apulia does not prove a second founder allele. Historical panel omissions and deletion-calling failures are dated examples, not universal current assay limitations. The original COLEC10 report confirms compound heterozygosity in MC19 siblings but could not establish phase in MC25.1; no universal phase claim is made.

    Care and baseline: replace the uncontrolled orthopedic report's comparative-safety claim with the actual three-month knee-extension result and persisting foot deformity. Add documented craniosynostosis surgery without inventing a general protocol. Retain genetic counseling and prenatal molecular testing. Initial GeneReviews/StatPearls screening found no matching 3MC chapter in the 2026-09-10 snapshot. Two existing GeneReviews abstracts are subsequently cited solely for BORSD and BPES differential diagnosis, explicitly marked as context, not a 3MC baseline. Their management is not imported into 3MC.

    Research cross-check: assess core CL-K1/CL-L1/MASP biology, neural crest, factor D, osteoclasts, all three molecular forms, founder screening, prenatal presentation, developmental variability and reported orthopedic care. Adult renal ischemia/fucose and anti-collectin proposals are outside congenital 3MC therapy scope. A single psychiatric-comorbidity report does not establish a core phenotype or support the drug choices suggested in the research narrative. No disease-specific environmental exposure, validated biochemical diagnostic threshold, general clinical guideline or disease-modifying trial was established by these sources. Verify new ontology bindings with OLS rather than copying flagged research-report suggestions. The frozen dataset-accession cache was neither read nor modified.

    Validation and peer review: authoritative schema, ontology and all 138/138 exact snippets passed. Whole-KB reference-title, snippet-title, snippet-length, snippet-grading, empty-snippet, environmental-evidence, cache-frontmatter, term-cache-integrity, cache-order, enum-cache and case-collision gates passed. Two PDF line-wrap artifacts in quotes were replaced with other exact source excerpts, and the folded-hyphen gate passed on rerun. Repository formatting hooks normalized the authored YAML and whitespace/end-of-file in generated caches. The regenerated references have no other disorder consumers in the current KB. Targeted causal-target, entity-reference, coarse-phenotype, duplicate-key, enum, qualifier, snippet-boundary and source-claim checks passed. Independent clinical review confirmed cohort denominators, carrier versus disease prevalence, variable development and case-level care, and identified copied feature-specific explanations that were corrected; genital findings in the primary patient table were added with explicit patient context.

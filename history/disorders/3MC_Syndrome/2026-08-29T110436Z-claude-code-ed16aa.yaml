  summary: 'Address review: osteoclastogenesis branch, missing phenotypes, treatments'
  details: |
    Review round on PR #10033. The automated reviewer requested changes; the
    substance was under-consumption of references that the deep-research run had
    cached into the branch, not defects in what was already curated.

    Added a second pathophysiology branch, Impaired Complement-Dependent
    Osteoclastogenesis, from PMID:41774788. This materially changes the entry's
    framing. The first draft treated the alternative-complement arm as a terminal
    node with no consequence, which is right for immunodeficiency and wrong as a
    general claim: in mice, CL-11 loss combined with MASP-2, factor B or C3
    deficiency produces vertebral bone loss that neither lesion causes alone. The
    node on pro-factor D maturation now says explicitly that complement components
    act as modifiers of the skeletal phenotype while still not supporting an
    infectious-susceptibility phenotype. Also added the Colec11-/- mouse as a
    FAILS_TO_RECAPITULATE model, since CL-11 deletion alone produces no skeletal
    abnormality, and the human iPSC-derived osteoclast system as an
    experimental_model.

    Phenotypes added from the seven-patient cohort in PMID:41703727 and from
    PMID:34740859: epicanthus inversus, global developmental delay, congenital heart
    disease, genital anomalies, downslanted palpebral fissures, fifth finger
    clinodactyly and horseshoe kidney.

    Corrected a frequency that a reference in the branch contradicted. Umbilical
    anomalies had been graded VERY_RARE from the 2011 "rarely occurring features"
    list, but PMID:41703727 reports periumbilical anomalies in six of seven
    patients. The two concepts are now curated separately: Periumbilical Depression
    as VERY_FREQUENT (HP:6000808) and Umbilical Hernia or Omphalocele as VERY_RARE.
    Both are attested and they are not the same finding.

    Added treatments (orthopedic contracture correction, genetic counselling) with a
    note that no disease-modifying therapy exists, a progression block establishing
    congenital static course with prenatal detectability, and genetic depth: allele
    classes, the second COLEC10 founder allele in Apulia, marked variable
    expressivity in an adult patient without clefting or intellectual disability,
    and genetic_context blocks carrying functional_impact_category on the two
    molecular nodes.

    Fixed a diagnosis section whose evidence supported when to suspect the diagnosis
    rather than how to confirm it, adding the two documented false-negative routes:
    exome panels that omit COLEC10, and intragenic deletions missed by routine
    variant calling.

    Two term-modifier corrections following the reviewer and CLAUDE.md's gain/loss
    decision tree: GO:0001867 and the MASP-3 protease activity moved from
    LOSS_OF_FUNCTION to DECREASED, since absence of a required component is the
    quantitative reading; the qualitative LOSS_OF_FUNCTION now lives on
    genetic_context where it describes the variant consequence.

    Validation after the round: just validate-disorders passes, 68/68 snippets
    verified, and the folded-hyphen, duplicate-key, entity-ref, snippet-grading,
    title-snippet and snippet-length checks all pass in this worktree.

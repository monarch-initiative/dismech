  summary: 'Create: Spinocerebellar Ataxia Type 19/22 (KCND3), promoted from ADCA-I'
  details: |
    Promoted the SCA19-22 (KCND3) has_subtypes row of Autosomal_Dominant_Cerebellar_Ataxia_Type_I into its own Disease entry (MONDO:0011819), continuing issue #13103. Full pathograph: KCND3 loss-of-function lesion -> reduced Kv4.3 A-type potassium current (dominant-negative on wild-type subunit) -> Purkinje cell firing dysfunction + ER stress -> Purkinje neuron degeneration -> loss of cerebellar cortical output -> ataxia phenotypes. Three nodes conform to cerebellar_purkinje_degeneration. Phenotypes split early-onset (neurodevelopmental, epilepsy, intellectual disability) vs late-onset (pure slowly progressive ataxia, parkinsonism, neuropathy) via has_subtypes. Added Kcnd3 F227del knock-in mouse (knockout gives no ataxia, so dominant-negative), a Drosophila Shal model, and patient iPSC neurons. gene_disease_validity left empty: ClinGen classifies KCND3 only for Brugada syndrome 1 (Disputed). ADCA-I SCA19-22 row now points here with curated_in; added to Cerebellar_Ataxias grouping. All gates pass.

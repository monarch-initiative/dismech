  details: |
    Answers the first ai4c-reviewer REQUEST_CHANGES review on PR 17154. Physical Therapy evidence now quotes the review's case-report sentence that rehabilitation improved clumsiness and falls (PMID:32823520, one patient, PRIMARY_RESULT). The PMID:39562497 Purkinje-degeneration snippet now quotes the whole sentence including its subject. Purkinje Cell Firing Dysfunction is HYPOTHETICAL rather than ESTABLISHED, since nothing cited measures Purkinje firing in SCA19/22; its incoming edge gains the F227del authors' hedged sentence that reduced surface Kv4.3 may lower Purkinje firing frequency, marked INDIRECT. Limb ataxia now cites the 64/68 sentence naming limb dysmetria. Added phenotypes Abnormal pyramidal sign (HP:0007256, 16/68, OCCASIONAL), Tremor (HP:0001337, 7/68 per the review table) and Dystonia (HP:0001332, three early-onset patients). The GeneReviews Hereditary Ataxia Overview (PMID:20301317) is now tagged in references, so check-genereviews reports TAGGED_OVERVIEW; it holds no phenotype baseline. Inheritance and Genetic Counseling gained primary family evidence from PMID:23280837. The ER-stress edge and both oculomotor phenotypes now quote whole sentences, the latter bridging the stripped citation brackets with ' ... ' so the 27 and 16 counts sit in the snippet. Validated with just validate, count-verified-snippets (56/56), validate-terms, check-causal-targets, check-entity-refs, check-name-collisions, check-coarse-phenotypes, check-enum-values.

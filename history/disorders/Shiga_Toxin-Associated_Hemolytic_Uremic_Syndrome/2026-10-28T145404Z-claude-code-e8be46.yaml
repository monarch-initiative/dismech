  summary: 'Create: Shiga Toxin-Associated Hemolytic Uremic Syndrome'
  details: |
    Created kb/disorders/Shiga_Toxin-Associated_Hemolytic_Uremic_Syndrome.yaml (MONDO:0019536) de novo. Deep research: falcon was requested but has no EDISON_API_KEY in this environment, so the run was re-issued with --fallback-provider claude_code and the report is recorded as research/Shiga_Toxin-Associated_Hemolytic_Uremic_Syndrome-deep-research-claude_code.md, carrying fell_back/requested_provider/provider_attempts in its frontmatter. Its reference_validation block reported 9/9 resolved, confabulation_rate 0.0; term_validation set needs_review because three CURIEs carried prose captions rather than labels (HP:0030213, UBERON:0001155, UBERON:0000955). All three were checked by hand: HP:0030213 is Emotional dearth and was NOT used; the two UBERON terms are correct for colon and brain and are bound with their canonical labels. The report's suggested NCIT treatment codes were independently verified and four were wrong - eculizumab is NCIT:C48386 not C64762, fluid therapy NCIT:C116537 not C15317, plasmapheresis NCIT:C15304 not C50111, packed RBC transfusion NCIT:C15409 not C15280 - so the verified codes were used. One PMID written from memory (26936670) resolved to an unrelated paper on waterborne healthcare outbreaks; it was deleted from the cache and the correct antibiotic meta-analysis (PMID:26917812) was found by search instead. Pathophysiology is curated as a causal chain from colonic colonisation through toxin translocation, Gb3 binding, retrograde trafficking and 28S rRNA depurination, to the two downstream arms (ribotoxic apoptosis; sublethal endothelial activation), local alternative-pathway complement activation, ULVWF-platelet capture, glomerular TMA, and the haematological and extrarenal consequences, with per-edge evidence. Three nodes conform to complement_dysregulation and thrombogenesis module nodes. Two mechanistic weak points are marked rather than smoothed: the unidentified systemic toxin carrier, and the classical shearing/consumption account, which is quoted together with the cited authors' own caveat against it. The eculizumab record carries the ECULISHU trial as both a REFUTE item (negative acute primary endpoint) and a SUPPORT item (fewer renal sequelae at 1 year), because the report had described the trial as simply showing no benefit. The antibiotic-risk environmental record likewise carries the meta-analysis twice, SUPPORT for the low-risk-of-bias subset and REFUTE for the null pooled estimate. The foodborne exposure was left unbound in the first draft with a review_notes block recording the ECTO queries run; that note turned out to be wrong and both the binding and the note were corrected in the review round described below. Validation: just validate-disorders passed (schema, terms, 95/95 snippets, 99 titles, 0 issues); just validate-terms passed; check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-delivery-system, check-coarse-phenotypes, check-qualifier-terms, check-logical-rules, check-folded-hyphens, check-folded-yaml, check-snippet-length, check-title-snippets, check-reference-titles, check-retired-support-prose, check-shared-disease-terms, check-snippet-grading and check-granularity all clean; just check-genereviews reports NO_CHAPTER, which is what the notes field claims. A self-review round followed the first validated draft and found real defects, the worst of them mine. (1) The review_notes claiming no ECTO class fitted the foodborne exposure was FALSE: re-run against the ECTO build rather than the cache, `l~coli` returns ECTO:3000009 exposure to Escherichia coli, reachable from ExO:0000002 and bindable. That is the cache-read-backwards error CLAUDE.md names by example, and the note had been written from a cache query while drawing a conclusion about the ontology. ECTO:3000009 is now bound with the route in preferred_term, and the note records what was actually searched and that ECTO has no via-ingestion child for it. ECTO:0900070 was likewise bound to the antibiotic exposure, which had no term at all. (2) A snippet on the TMA->Proteinuria edge quoted 'why the glomerular microvasculature is so susceptible to injury following systemic Stx infection' - the subordinate clause of a sentence whose predicate is 'are unclear'. It presented the paper's statement of what is unknown as a positive finding and was deleted; the edge is now explicitly uncited. (3) prevalence_class on the Finnish record was BAND_1_9_PER_100000 for 0.5/100,000, which belongs in BAND_1_9_PER_1000000 (0.1-0.9 per 100,000); its sibling record had the same rate banded correctly, so the block contradicted itself. (4) The Gb3 node asserted that Gb3 differs between species and that animals do not reproduce the human renal phenotype - uncited, and contradicted by two of this entry's own references (PMID:25530917 reports relative toxicity 'replicated in mice and baboons'; PMID:37863058 is a mouse that does reproduce it). Cut, and the defensible part relocated to the new animal_models record. (5) An animal_models entry for the Pod-Gb3 mouse was added with modeled_mechanisms, a factor-H readout and a BOUNDARY_OMISSION divergence; that mouse was the sole evidence for three claims and had no model record. (6) A diagnosis record for stool stx1/stx2 PCR was added on a newly fetched source (PMID:23843484), since microbiologic confirmation is what separates this disease from aHUS and nothing cached supported the report's other diagnostic claims, which are flagged as a gap rather than asserted. (7) Mortality 'mostly neurological' was uncited while PMID:39518638 carried the exact sentence; now cited. (8) quote_role: BACKGROUND added to 8 items and 5 review quotes describing cell-culture mechanism regraded HUMAN_CLINICAL -> IN_VITRO. (9) Two bundled nodes were split: retrograde trafficking from the depurination lesion, and erythrocyte shearing from platelet consumption, whose two downstream edges came from opposite halves of one node. (10) The genetic: record was deleted - it typed a MODIFIER relationship with no gene_term and its only evidence quoted an aHUS fact, so it asserted a relationship nothing cited supported; the contrast now lives only in differential_diagnoses and notes. (11) Smaller fixes: CL:0011108 colon epithelial cell on the colonic node, UBERON:0000948 heart bound and the available pancreas snippet used, Encephalopathy/Seizure edges marked indirect and explicitly uncited, a Seizure phenotype added, Encephalopathy frequency OCCASIONAL -> FREQUENT with the figure named, the CKD frequency band dropped because the 31% covers all kidney sequelae rather than CKD, the RRT description's 'roughly half' reconciled with the 63% it cited, Coombs-negativity and haptoglobin consumption marked as uncited standard practice, the non-O157 trend claim softened, the LDH note rewritten to say its figure is pooled across three TMA subtypes with only 5 STEC-HUS patients, the Shigella binding annotated as species-level for a serotype-specific agent, and the FoodNet progression risk moved out of prevalence into the prodrome progression phase where its denominator makes sense. Review round 1 (PR #15830, ai4c-reviewer, CHANGES_REQUESTED) raised three blocking items, all confirmed and all fixed in one push. The antibiotic exposure was bound to ECTO:0900070 'exposure to antibacterial drug via ingestion', asserting a route neither cited source states; swapped to the route-neutral ECTO:9001757. Two snippets were truncated at the character before a Greek letter and so stopped short of the words their explanations claimed - the depurination quote named neither the alpha-sarcin/ricin loop nor 28S rRNA, and the O104:H4 quote carried neither 'horizontal' nor 'beta-lactamase'; both were extended and both verify through greek_map normalization, so the truncation had bought nothing. This is the never-truncate-a-snippet rule in CLAUDE.md, broken twice. One PMID:23955166 quote describing ribosome biochemistry was still graded HUMAN_CLINICAL after the earlier regrade pass missed it; it and two neighbours (the A/E lesion definition and the outbreak-strain sequencing sentence) were regraded IN_VITRO and OTHER. Four of the six suggestions were also taken: quote_role BACKGROUND on the ADAMTS13 characterisation, a note on the Gb3 node that the podocyte binding rests on the human biopsy arm rather than the engineered mouse, the eculizumab description no longer calling the one-year sequelae figure a secondary endpoint (the abstract lists only haematologic and extrarenal involvement as secondary), and the empty has_subtypes slot removed. The granularity suggestion was answered on the PR rather than in the file: the entry is excluded from the infectious ladder as a SEQUELA, so the zeroes mean not-assessed, and the PR summary wording was the defect. A connectivity pass also ran: just list-disconnected-phenotypes showed only 4 of 11 phenotypes causally connected, so the colitis, schistocyte, oligoanuria and proteinuria edges were added, chronic kidney disease and hypertension were linked as sequelae of the acute kidney injury, and the creatinine rise was recorded as a reports_on READOUT_OF link rather than a causal edge because it is the measurement that defines the injury. That took connectivity to 11 of 12, with creatinine correctly remaining a readout; every gate above was re-run clean afterwards.

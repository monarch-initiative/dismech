  summary: Decline the isolated factor VII deficiency row; record the MONDO placement
    objection
  details: |
    Ruling for the series-069 row MONDO:0009211 congenital factor VII deficiency (F7).

    Row ruling: declined on scope, with a MONDO disagreement recorded. This entry is the
    combined deficiency - a lesion in the vitamin K cycle itself, in GGCX or VKORC1, that
    lowers factors II, VII, IX and X together - which is what the VKCFD1 and VKCFD2 rows
    carry. An inherited deficiency of a single vitamin K-dependent factor is a different
    disease, and factor VII deficiency is already dispositioned here as one of the
    differential diagnoses, named in prose rather than by CURIE, which is why a CURIE
    grep found nothing.

    The disagreement, now recorded in notes rather than acted on: MONDO files
    MONDO:0009211 as a child of MONDO:0015722, the term bound here, as well as of
    MONDO:0002244 factor VII deficiency. MONDO:0015722's own definition reads
    "Congenital vitamin K-dependent coagulation factors deficiency involving multiple
    coagulation factors", and an isolated F7 deficiency does not involve multiple
    factors, so the child placement does not satisfy the parent's definition. I read the
    definition before forming the view, as the campaign requires, and it supports the
    objection rather than answering it. No upstream issue filed; this is reported for a
    maintainer to decide.

    Anchor audit: disease_term MONDO:0015722 matches the entry's scope, both subtype rows
    are inside it, and it asserts no causal gene that would contradict the two the entry
    carries. No change.

    Wiring is unchanged and was already close to complete: 2/2 causal genes wired, 25/26
    phenotypes with a causal inlink, 0 of 5 pathophysiology nodes without an outgoing
    edge.


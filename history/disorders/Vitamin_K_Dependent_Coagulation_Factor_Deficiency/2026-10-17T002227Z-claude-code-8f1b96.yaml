  summary: Bind VKORC1 targeted mutation analysis LOINC code to the joint GGCX/VKORC1
    genetic testing row
  details: |
    LOINC tranche H batch 3. The existing 'GGCX and VKORC1 molecular genetic testing' diagnosis row names a joint genetic test for inherited VKCFD2 (the VKORC1-related subtype), not warfarin pharmacogenomics. Searched the gene-symbol abbreviation 'VKORC1' (surfaces a full identity family including a targeted-mutation-analysis code, LOINC:72512-7) and the spelled-out gene name 'vitamin K epoxide reductase complex subunit 1' (returns no LOINC results, confirming the symbol search was the productive direction here). Bound LOINC:72512-7 'VKORC1 gene targeted mutation analysis', not the CYP2C9-and-VKORC1 warfarin-dosing panel (LOINC:54450-2) that the same search surfaced, since that panel answers a different clinical question (warfarin starting-dose pharmacogenomics) involving a gene (CYP2C9) this disease's own testing does not test. Also searched GGCX, the other gene this diagnosis row names jointly, by gene symbol and by the spelled-out enzyme name 'gamma-glutamyl carboxylase': both return zero LOINC results, so GGCX has no LOINC identity to bind, recorded in a note on the row. Confirmed LOINC:72512-7 absent from origin/main before seeding, and its label verified fresh from the Monarch KG entity endpoint.

  summary: 'Review: Vitamin K-Dependent Coagulation Factor Deficiency'
  details: |
    Independent publication-readiness review against the Falcon deep-research
    report, its citation sidecar, Orphanet, and primary and review literature.
    Added quantitative prevalence, natural history, source-backed bleeding and
    extra-hemostatic phenotypes, a structured laboratory and molecular diagnostic
    workflow, differentials, genotype-dependent treatment response, tranexamic
    acid, a Ggcx-null mouse model, and explicit knowledge gaps. Replaced
    suggestive or overextended claims with direct evidence, including stronger
    intracranial-hemorrhage support and calibrated non-hemostatic substrate and
    rFVIIa assertions. Avoided reproducing internally reversed codon labels in
    the PMID:9845520 abstract.

    The deep-research completeness cross-check found both molecular subtypes,
    the core coagulation mechanism, major phenotype systems, treatments,
    genetics, and diagnostics adequately represented after these edits. No
    clinical trial theme was surfaced. A PubMed title search found no applicable
    GeneReviews article. Narrow site-specific bleeding annotations remain
    represented by directly supported broader bleeding phenotypes; arterial and
    venous thrombosis annotations were not promoted because the contemporary
    review explicitly reports no such events in affected patients.

    New literature caches were generated only with just fetch-reference.
    Ontology-cache additions are restricted to newly bound terms, and
    validator-induced changes to existing reference caches were restored.
    A follow-up independent audit found that the two causal genetic assertions
    were not connected to their proximal mechanisms and that the GGCX/PXE-like
    arterial phenotype was missing. Added matching GGCX and VKORC1 gene and
    germline genetic-context descriptors to the subtype-specific proximal nodes,
    producing supported inferred genetic-to-mechanism links. Added a distinct
    VKCFD1 Atherosclerosis phenotype (HP:0002621) and an indirect, explicitly
    unresolved edge from non-hemostatic undercarboxylation, using exact
    PMID:39496305 and Orphanet evidence. The 38% table value is a selected
    PXE-like-subgroup statistic rather than GGCX-specific or overall VKCFD
    prevalence; the structured frequency therefore follows Orphanet's
    OCCASIONAL band. Arterial and venous thrombosis remain unpromoted.

    The audit also requested an evidence-backed modeled_mechanisms link from the
    Ggcx-null mouse to the proximal GGCX-deficiency node. The current AnimalModel
    schema does not admit modeled_mechanisms, while ExperimentalModel is
    explicitly non-animal; encoding the link within this entry-only review would
    either fail schema validation or misclassify the model. The faithful
    evidence-backed AnimalModel record is retained, and the schema limitation is
    documented in the existing HUMAN_MODEL_MISMATCH discussion for independent
    classification rather than expanding shared infrastructure in this PR.

    Per-file schema, term, snippet, and causal-graph checks pass. All 102 evidence
    snippets validate against cached sources.

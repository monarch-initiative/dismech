  summary: 'Create: Kohlschutter-Tonz_Syndrome-like'
  details: |
    Created the entry for MONDO:0030990 (Kohlschutter-Tonz syndrome-like; OMIM 619229, den Hoed-de Boer-Voisin syndrome), scoped to heterozygous SATB1 CUT1/CUT2 missense variants. The truncating/haploinsufficient SATB1 disorder (DEFDA, MONDO:0030988) has its own stub and is recorded as a differential, not a subtype. Inputs: a Perplexity sonar-deep-research report generated via a locally streaming-patched deep-research-client (dismech#9357, deep-research-client#94); its references were treated as leads and checked against cached sources; the report correctly concerns SATB1, not ROGDI/SLC13A5 Kohlschutter-Tonz syndrome. Evidence: den Hoed 2021 (PMID:33513338, abstract only, no open full text), Privitera 2024 full text (PMID:38790177; review of missense vs truncating features), the ClinGen SATB1 evidence summary (CGGV, describes the missense phenotype including teeth abnormalities), PMID:42195022 full text (background on DHDBV), Zhang 2019 Satb1-null mouse enamel study (PMID:31830989), PhenoScore (PMID:37550531), ORPHA:684232, and ROGDI/SLC13A5 KTZS papers (PMID:34939736, PMID:27600704) for differentials. Not used: PMID:40571781 (rat truncation model; models a truncating allele), PMID:36120649 and the valproate/oxcarbazepine data in PMID:42195022 (truncating-variant patients), PMID:38818757 (sulthiame series, SATB1 variant class not stated), PMID:40065383 (3p24 triplication), PMID:40103013 (KMT2D enamel), PMID:34031799 (no abstract), GEO GSE75954 (dental epithelial expression, not disease-specific). No treatments recorded because no variant-class-specific treatment data were found. ClinGen Definitive tier not recorded under gene_disease_validity because it is for MONDO:0100038, not this disease. Validation: just validate, validate-terms, count-verified-snippets 43/43, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-enum-values, check-duplicate-keys, gene activity grounding (against origin/main), snippet-length, title-snippets, reference-titles, snippet-grading and validate-disorders all passed; check-genereviews --online reported NO_CHAPTER.
    Review round 1 (PR #15733, changes requested): added reference_title "SATB1 / complex neurodevelopmental disorder (Definitive)", copied from the cache frontmatter, to the eight CGGV evidence items that lacked it. Added a CAUSE_UNREPRESENTED divergence to the Satb1-null mouse link, because the null allele does not encode the disease lesion (hyperbinding missense). Kept HP:0012448 Delayed myelination for the source wording "incomplete myelination". Kept the filename, which follows the MONDO label and the stub and history slugs.

  summary: 'Review: connect nine orphan phenotypes (IUIS Table 7)'
  details: |
    Nine of ten phenotypes had no incoming edge. Eight attack features attach to the systemic autoinflammation node and proteinuria to the AA amyloidosis node - the latter placement matters, because proteinuria here is the first sign of the complication that determines long-term prognosis rather than part of an attack.

    The myalgia and migratory rash edges say why those two travel together: the muscle involvement is monocytic fasciitis rather than myositis, and the rash migrates over the affected area. The fever edge records the discriminating feature - attacks last one to three weeks rather than days, which is what separates TRAPS from the other periodic fevers.

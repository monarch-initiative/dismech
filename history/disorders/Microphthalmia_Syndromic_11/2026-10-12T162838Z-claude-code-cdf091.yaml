  summary: 'Create: Microphthalmia_Syndromic_11'
  details: |
    De-novo curation of VAX1-related syndromic microphthalmia (MCOPS11, MONDO:0013734). Deep-research report used as leads only (thin: one human discovery paper + mouse models). Human evidence rests on the single Slavotinek 2012 proband (PMID:22095910); pathophysiology chain grounded in Vax1 null mouse papers (PMID:10601036 Hallonet, PMID:10601035 Bertuzzi) and VAX1 DNA-binding transcription factor activity (PMID:27013679 Hoffmann, IN_VITRO); MAC-gene context from review PMID:24859618. VAX1 verified hgnc:12660. 5 phenotypes (microphthalmia, optic nerve hypoplasia, cleft lip, cleft palate, corpus callosum agenesis), all wired into the pathograph. Mouse GnRH/infertility and holoprosencephaly recorded as discussions (KNOWLEDGE_GAP, HUMAN_MODEL_MISMATCH) rather than human phenotypes. Hippocampal/pineal aggregator-summary findings dropped (no quotable primary source). No ClinGen CGGV record for VAX1, so gene_disease_validity omitted. All gates pass: validate-disorders, count-verified-snippets 26/26, validate-terms, check-gene-activity-grounding, check-snippet-length/grading, entity-refs, causal-targets, enum-values, coarse-phenotypes.

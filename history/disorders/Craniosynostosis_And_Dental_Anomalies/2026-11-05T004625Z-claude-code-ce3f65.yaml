  summary: 'Create: Craniosynostosis_And_Dental_Anomalies'
  details: |
    New entry for IL11RA-related craniosynostosis and dental anomalies (MONDO:0013615, OMIM 614188), curated from the primary literature and an OpenScientist deep-research report (research/Craniosynostosis_And_Dental_Anomalies-deep-research-openscientist.md). The report resolved 17 of 17 references; preflight-dr returned WARN only because the ligand gene IL11 is mentioned often, which is expected for this receptor disease. Term validation in the report flagged GO:0038165 (named in the report as interleukin-11-mediated signaling, but GO labels it oncostatin-M-mediated signaling) and obsolete CL:0000055; neither is used. The entry binds GO:0038154 instead. Report claims used only where a cited abstract or full text supported them; general syndromic craniosynostosis surgical literature in the report (PMID:42402848, PMID:41931363 and others) was not cited because it is not IL11RA-specific, and PMID:9500603 (mouse female infertility) was left out as outside the human disease. The report also states that Il11 knockout mice show craniosynostosis; PMID:34239012 says the opposite, and the entry follows the paper. No GeneReviews chapter exists (check-genereviews --online). ClinGen Definitive AR recorded from the CGGV record. The pathograph conforms two nodes to cranial_suture_premature_fusion (restraint loss and the premature fusion endpoint); the osteogenic acceleration node was not claimed because no source shows increased osteoblast differentiation in IL11RA sutures. The osteoclast/remodelling route is recorded as the hypothesis of PMID:24498618. Five musculoskeletal phenotypes (joint hypermobility, disc degeneration, scoliosis, platybasia, basilar invagination) are left unconnected because no source states their mechanism. Validated with just validate, the offline gates and just validate-disorders.

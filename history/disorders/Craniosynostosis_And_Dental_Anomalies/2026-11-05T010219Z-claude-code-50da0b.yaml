  summary: 'Review round 1: diagnosis, prevalence, tooth extraction term'
  details: |
    Answers the first review of PR 16558. Added a diagnosis section with three rows: molecular testing (NCIT:C101295 Whole Exome Sequencing, evidence PMID:40353334 and PMID:35331937), the Crouzon syndrome differential (PMID:30811827 and PMID:24498618, no diagnosis_term because NCIT has no procedure term for a differential), and three-dimensional cranial CT (NCIT:C17204 Computed Tomography, PMID:40353334). Added a CASES_IN_LITERATURE prevalence record from the 41-patient count in PMID:30811827. Rebound dental extraction from NCIT:C15329 to NCIT:C51770 Extraction of Tooth, confirmed in OLS and in the treatment enum cache. Kept NCIT:C15329 for cranial vault surgery: OLS searches of NCIT for Cranioplasty, Cranial Vault Remodeling, Cranial Vault Reconstruction and Fronto-Orbital Advancement returned no terms, and Craniectomy (NCIT:C51791) is a different operation; a notes line records this. Added a notes line on the Middle Ear Anomalies node explaining that no source links it to IL-11 signalling. Added an age-at-diagnosis onset (0 to 3.3 years, PMID:40353334) on multiple suture craniosynostosis without an onset category, because no cited source documents congenital onset. Did not add further phenotype frequencies: the only quotes are from one family or a six-patient cohort, which do not give a frequency across the disease.

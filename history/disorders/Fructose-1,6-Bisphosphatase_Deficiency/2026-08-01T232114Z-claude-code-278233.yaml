  summary: 'Create: Fructose-1,6-Bisphosphatase Deficiency (FBP1, MONDO:0009251)'
  details: |
    First slice of the IEMbase WP-007 curation package (issue #5562): new Disease entry for FBP1-related fructose-1,6-bisphosphatase deficiency (row 3.2.02.01). Seven-node pathograph running from the FBP1 enzymatic block through impaired hepatic gluconeogenesis, gluconeogenic substrate accumulation, fasting hypoglycemia, acute metabolic decompensation, hepatic steatosis, and multiorgan crisis; four nodes declare conforms_to against the metabolic_intoxication_decompensation module. Curated from GeneReviews (PMID:31804789) plus primary patient series: French (PMID:25601412), Malaysian (PMID:29203193), Chinese (PMID:28420223), Chinese prevalence and genotype-phenotype (PMID:39036704), and the multicenter hepatic follow-up series (PMID:34687058). The mouse-derived ER-stress / de-novo-lipogenesis explanation for the steatosis is recorded as an EMERGING mechanistic_hypotheses entry plus a HUMAN_MODEL_MISMATCH discussion with three proposed experiments, and the corresponding causal edge is typed INDIRECT_UNKNOWN_INTERMEDIATES rather than DIRECT because the source states that no clear pathophysiological basis is known. Repo-state audit of the other 32 WP-007 seed rows is recorded in the issue comment. Validated with just validate, just validate-terms, and just validate-references.

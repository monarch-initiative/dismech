  summary: Add six missing LQTS genes with ClinGen disputed gradings and wire the
    calmodulin/L-type calcium node
  details: |
    Genetics pass for the d2g wiring-012 tranche (issue #12201). This was the largest
    entry in the tranche and carried most of its genuine gap.

    Six of the eleven genes the reconciliation checklist names were absent entirely -
    KCNE1, KCNE2, SCN4B, AKAP9, SNTA1, KCNJ5 - even though `has_subtypes` already
    declared Type 5, 6, 10, 11, 12 and 13 as clinical rows. All six now have a
    `genetic:` record keyed to its row, plus ANK2 for the Type 4 row, which was in the
    same state. Every one of the sixteen subtype rows now carries its gene.

    The research finding is that MONDO and ClinGen disagree about these genes, and the
    disagreement is the reason to curate them carefully rather than to omit them. In
    2020 ClinGen's long QT expert panel reappraised the 17 genes then reported as LQTS
    causes and found only KCNQ1, KCNH2 and SCN5A definitive; six disputed (AKAP9,
    ANK2, KCNE2, KCNJ5, SCN4B, SNTA1) and three limited (CAV3, KCNE1, KCNJ2). MONDO
    asserts a plain causal relationship for five of those six disputed genes and for
    KCNE1. The six disputed records are typed `relationship_type: DISPUTED` and each
    carries two evidence items - the ClinGen validity row, and a REFUTE item quoting
    the panel's actual reasoning, because the enum value alone does not say why and
    the reasons differ: candidate-gene design with no segregation data for SCN4B and
    AKAP9, a variant too common in the relevant ancestry group for SNTA1 and KCNJ5,
    and a requirement for secondary provocation for KCNE2.

    KCNE1 is left with no `relationship_type` rather than rounded. ClinGen grades it
    Limited, and the enum documents CAUSATIVE as Definitive-or-Strong and DISPUTED as
    Disputed-or-Refuted, so neither fits. That follows the treatment this entry
    already gave CAV3, KCNJ2 and ALG10B.

    The most interesting placement is KCNE1 and KCNE2 at the
    `QT-Prolonging Drug Unmasking of Reduced Repolarization Reserve` node rather than
    at the inherited repolarization node. The same panel that found limited or
    disputed evidence for them in unprovoked congenital LQTS found strong evidence for
    specific risk alleles predisposing to the acquired, drug-provoked form; and the
    cohort evidence already on that node locates the congenital variants found in
    drug-associated torsades patients "predominantly in genes encoding ancillary
    subunits", which is what these two are. The Adler sentence stating the split
    verdict was added there as evidence.

    Pathograph wiring went from 3/11 to 8/12 causal genes reaching a mechanism. The
    step that did it is a new node, `Impaired Calcium-Dependent Inactivation of the
    L-Type Calcium Current`, binding CALM1, CALM2, CALM3 and CACNA1C - the second
    route to a prolonged plateau alongside the potassium and late-sodium nodes the
    entry already had. Its notes name the four genes deliberately left off it and why:
    CAV3 and ALG10B are ClinGen-Limited with no mechanism curated here, KCNJ2 carries
    IK1 and belongs to Andersen-Tawil syndrome which is curated separately, and TRDN
    acts on the calcium release unit rather than on L-type inactivation.

    A top-level `notes:` block records two things a reader needs. First, that a
    subtype row's `genes:` list says which gene a numbered designation refers to and
    is not an endorsement - the grading lives on the `genetic:` record. Second, that
    MONDO records the gene inconsistently across these terms: eleven carry an asserted
    RO:0004003 relationship, LQT3 carries SCN5A only inside its equivalence axiom so a
    query reading asserted relationships alone will miss it, and LQT4, LQT8 and LQT16
    carry no causal gene in either form, so the ANK2, CACNA1C and TRDN bindings on
    those rows rest on this entry's own sources. Read from the MONDO build on
    2026-09-19.

    The GeneReviews Long QT Syndrome Overview chapter was not cited; it is now tagged
    in `references:`.

    A first draft of the top-level note read as though the 2020 verdict were ClinGen's
    current roster. It is not - the download read on 2026-09-19 also carries CALM1,
    CALM2 and CALM3 as definitive, TRDN as strong, CACNA1C as moderate and ALG10B as
    limited - and the note now says so.

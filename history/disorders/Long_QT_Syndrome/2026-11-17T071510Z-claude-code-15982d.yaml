  summary: Move the CiPA in-silico arm to computational_models
  details: |
    exp_lqt_cipa_nam_confirmation declared its O'Hara-Rudy/ToR-ORd ventricular action-potential model as a model_systems entry with experimental_model_type OTHER. An in-silico model is not an experimental model system, so it moved to the experiment's computational_models slot with model_type KINETIC (an ODE-based ionic model of membrane currents, not the PBPK or organ model PHYSIOLOGICAL describes) and base_model recording the published parent. The row carried only name, description and the OTHER type, so nothing was lost in the move; name and description are unchanged. The two iPSC and cell-line rows in the same experiment are genuine NAMs and stay in model_systems.

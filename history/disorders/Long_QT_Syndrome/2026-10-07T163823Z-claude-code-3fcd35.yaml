  summary: Bind the defining measurement and its guideline thresholds as LOINC measurements
  details: |
    Extended the existing resting ECG diagnosis row with LOINC:8636-3 (Q-T interval corrected, no correction formula named) and one reference range: QTc 480 ms and above, the current guideline cut-off as applied by Vink et al. 2018 (PMID:30571576). The Bazett (LOINC:76635-2) and Fridericia (LOINC:76634-5) codes exist and are named in the notes but not bound. The Schwartz score QTc point bands and the HRS/EHRA/APHRS 2013 criterion are not recorded because no cached text carries them; the records read are listed in the range notes. Left alone and reported: the row note says NCIT has no ECG-specific term, while NCIT:C38053 Electrocardiography is in the treatment-action enum cache.

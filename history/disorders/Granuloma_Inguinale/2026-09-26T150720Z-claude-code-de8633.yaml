  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED. Dropped the unsupported phagocytosis GO:0006909 INCREASED modifier from the intramacrophage-persistence node (PMID:9856642 shows vacuolar residence, not increased phagocytosis). Added evidence to the previously uncited Plasma-Cell-Rich Granulomatous Inflammation node (PMID:18317211 dense plasma-cell/neutrophil/histiocyte infiltrate; PMID:2777345 cytology). Added a diagnosis section (Donovan-body microscopy NCIT:C16853 PMID:26882914; PCR NCIT:C17003 PMID:21097731). Added complications: a Lymphatic Obstruction node -> Lymphedema phenotype (genital elephantiasis, PMID:16510000); a Squamous cell carcinoma phenotype/sequela (PMID:19061590); an Enhanced HIV Transmission and Acquisition node (PMID:7750949); and an Extragenital donovanosis has_subtypes entry (PMID:9924476). Added a RARE prevalence record (PMID:26882914) and the azithromycin drug-of-choice evidence (PMID:12473810). Fixed two reference_titles written from memory (PMID:18317211, 2777345). All gates green; 3/3 phenotypes connected.

  details: |
    New Disease entry for Young syndrome (MONDO:0010220), claimed in #14160. Entry type decided as DISEASE rather than a has_subtypes row on Primary_Ciliary_Dyskinesia: the clinical triad is defined by a shared tissue-level mechanism (inspissated secretions obstructing the caput epididymidis; reduced mucociliary clearance with normal ciliary ultrastructure and beat frequency), while its upstream causes differ. Two competing upstream causes are modelled as hypothesis groups: childhood mercury exposure (birth-cohort epidemiology, PMID:8292944) and unrecognized C1d central-apparatus PCD (one CFAP221 patient with the triad, PMID:38960684). CFAP221 is recorded as relationship_type UNKNOWN and CFTR as DISPUTED (no excess of CFTR mutations, PMID:7551394, PMID:7539448). Deep research: falcon was requested by default but failed authentication (503) on two attempts, including with --fallback, which did not hand off; the claude_code provider was run instead (research/Young_Syndrome-deep-research-claude_code.md; 24/24 references resolved, 10/10 quotes valid, 3 off-topic references not cited). preflight-dr WARN on CFTR mentions was read: they are refutation and differential content for this disease, not a second entity. No GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER); the StatPearls chapter is cited and tagged. An independent subagent review was run before the PR; its findings (reference titles, hypothesis-group scoping, a reproductive branch for the C1d hypothesis, a qualifying REFUTE item on the inferred mucus defect, FEV1 binding, quote_role on background quotes, prevalence and diagnosis rows) were applied. Validation: just validate passes (schema, terms, 53/53 snippets), plus check-entity-refs, check-causal-targets, check-duplicate-keys, check-snippet-grading, check-title-snippets, check-reference-titles and check-coarse-phenotypes.

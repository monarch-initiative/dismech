  summary: 'Address PR #10492 third review: evidence_source regrading, variant consequence'
  details: |
    Third round of review response on PR #10492. Both blocking items accepted; four of six suggestions taken.

    1. Two evidence items quoting the fibroblast enzyme assay were graded HUMAN_CLINICAL and should be IN_VITRO. The measurement is an enzyme assay on cultured skin fibroblasts, and patient-derived material does not make it clinical - CLAUDE.md puts cultured cells under IN_VITRO explicitly. Regraded both. The reviewer's diagnosis of why check-snippet-grading could not catch it is correct and worth recording: that gate keys on divergence, and both copies of the identical sentence carried the same wrong value, so there was nothing to diverge. The same file already graded three other patient-fibroblast experiments IN_VITRO, so this was an internal inconsistency rather than a systematic misreading.

    2. The variant consequence was argued in prose - 'a severe hypomorph rather than a null', backed by 10% patient / 25% recombinant / 50% carrier residual activity - but not machine-queryable. The reviewer suggested adding functional_impact_category to genetic[0]. That slot does not exist on Genetic; it belongs to GeneticContext, which attaches to Pathophysiology. Added there instead, on the PAICS Bifunctional Enzyme Deficiency node, carrying functional_impact_category PARTIAL_LOSS_OF_FUNCTION together with zygosity HOMOZYGOUS, variant_origin GERMLINE and allele_type missense, which also closes the separate suggestion about allele_type and zygosity being unset. PARTIAL_LOSS_OF_FUNCTION rather than LOSS_OF_FUNCTION is the point of the item: a null would not be survivable to seven years.

    Suggestions taken: the GO granularity inversion was real and is corrected - GO:0006189 'de novo IMP biosynthetic process' now sits on the specific flux node and its parent GO:0006164 on the purinosome-assembly node, which reads the right way round. Pulmonary hypoplasia and Short stature are now wired under Disrupted Embryonic Organogenesis. The prevalence notes undercounted: they said four confirmed patients when the entry itself curates the neurodegenerative sibpair, so the record now says at least six and enumerates the three groups.

    Suggestions not taken, deliberately. The three neurodevelopmental phenotypes remain orphan in the pathograph, as the reviewer allowed - their relationship to the malformation phenotype is the open question the entry flags, and drawing edges would presuppose an answer. PMID:22180458 and PMID:32557644 are left uncited here: both speak to purinosome biology across the DNPS disorders rather than to PAICS deficiency specifically, and the reviewer's own framing is right that the natural home for them is a shared 'disrupted purinosome assembly' module across PAICS, ADSL and ATIC rather than this entry. The IMPC Paics knockout is left out for the stated reason - no PMID, so nothing snippet-verifiable.

    Validation: just validate passes; 37/37 snippets verified. pytest passes on the entity-ref, causal-target, foreign-key and subtype selections (18,585 tests). All offline gates green.

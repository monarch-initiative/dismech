  summary: 'Create: PAICS_Deficiency (de novo purine synthesis defect)'
  details: |
    De novo curation of PAICS deficiency (MONDO:0859003), an autosomal recessive inborn error of de novo purine synthesis.

    MONDO term correction. The curation stub and the original claim issue were keyed on MONDO:0859244 'phosphoribosylaminoimidazole carboxylase deficiency', which is obsolete: MONDO merged it into MONDO:0859003 'PAICS deficiency' (monarch-initiative/mondo#9884). The entry binds the live term, and claim issue #10471 was retitled to match, since the MONDO ID in a claim title is the key the double-claim check matches on. This PR retires the stub outright, so no repointing of stubs/Phosphoribosylaminoimidazole_Carboxylase_Deficiency.yaml was needed.

    Deep research: openscientist (research/PAICS_Deficiency-deep-research-openscientist.md). Falcon, the repo default, was unavailable (no EDISON_API_KEY/FUTUREHOUSE_API_KEY); openscientist was selected explicitly rather than substituted silently. The report shipped without reference_validation or term_validation frontmatter and without a citations sidecar, so both were retro-fitted in place with just validate-research-reference and just validate-research-terms. Results: 14/14 references resolved, 0 unresolved, 0 off topic; 60 terms checked, 0 unresolved, 2 named as a different term.

    One of those two mislabelled terms mattered. The report offered GO:0034023 for 'purinosome'; GO calls that term '5-(carboxyamino)imidazole ribonucleotide mutase activity'. It was not bound. No suitable GO term for the purinosome was found, so that concept is carried in prose on the Failure of Purinosome Assembly node and the node is bound to GO:0006189 instead.

    Pathograph: four nodes from PAICS bifunctional enzyme deficiency through failure of purinosome assembly and impaired de novo purine synthesis to disrupted embryonic organogenesis. The last edge is deliberately INDIRECT_UNKNOWN_INTERMEDIATES: the mechanism connecting purine insufficiency to the specific malformation pattern is not established.

    A substantive negative result is recorded rather than glossed. AIR and AIr, the substrates predicted to accumulate, were sought in patient fibroblasts and not detected, even though AIr is cytotoxic to cell lines. This is why the disorder has no diagnostic metabolite and no substrate-reduction target, and it is captured as a KNOWLEDGE_GAP discussion as well as in the node description.

    Phenotype coverage is knowingly incomplete and this is recorded in the entry notes. OMIM #619859 and HPO-JAX carry a fuller craniofacial and skeletal annotation set (flat face, brachycephaly, short nose, depressed nasal bridge, anteverted nares, low-set ears, short neck, hypertelorism, tracheoesophageal fistula, choanal atresia, missing ribs, lumbar hemivertebrae, talipes equinovarus, fifth-finger clinodactyly, coronal hypospadias). All three primary reports are abstract-only in the reference cache and none of these individual features appears in an abstract, so none could be given a verified snippet. They were left out rather than cited to a source that does not state them. ORPHA:633099 would supply quotable rows but is not in the committed Orphanet bulk cache and data/orphadata/en_product1.xml is gitignored and absent, so structured-rebuild-orphanet could not be run without a full refresh.

    Not asserted: the report describes p.(Lys53Arg) as rs192831239 with gnomAD NFE allele frequency 0.135%, making its recurrence in an unrelated French family a population-frequency effect rather than a founder effect. That is plausible and interesting but could not be verified from any cached reference, so the entry says only 'recurrent', which PMID:39726239 states directly.

    Validation: just validate passes (schema, terms, references); 26/26 snippets verified. check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values and check-qualifier-terms all pass.

    No datasets: block. PAICS is heavily studied as a cancer proliferation gene, so a dataset search on the symbol returns oncology series unrelated to this inborn error.

  summary: 'Address PR #10492 review: diagnosis, prevalence, purinosome evidence,
    phenotype spectrum'
  details: |
    Response to the automated review on PR #10492. All seven blocking items accepted and fixed; five of six non-blocking suggestions taken. The reviewer's framing was that the entry under-consumed its own PR: eleven reference-cache files committed, three cited. That was correct.

    1. diagnosis: section added. Three entries - molecular genetic testing as the primary route, the fibroblast PAICS enzyme assay as confirmatory, and an explicit negative entry recording that no metabolite marker exists. Both quotes were already verified in the file. The negative entry is graded REFUTE because it refutes the availability of a biochemical screen, which is the entry's own headline finding and previously lived only in notes.

    2. CL:0000057 fibroblast replaced with CL:0002620 skin fibroblast. The preferred_term already said 'skin fibroblast', which is the signature of a binding that stopped one level too high; every experiment in the entry used skin fibroblasts.

    3. The purinosome-to-flux edge, the load-bearing step of the pathograph, had no evidence. PMID:35331738 was sitting uncited in this PR's cache and states the claim almost verbatim. Now cited on the edge, and a second quote from the same paper supports the purinosome node itself by establishing PAICS as the interaction hub of the complex.

    4. Neurodevelopmental regression (HP:0002376) and ocular involvement (HP:0000478) added as phenotypes. Both were headline themes of the PR body and the discussions while being entirely absent from phenotypes:, so a consumer querying the entry saw only the malformation arm of a spectrum the prose insists is split. Marked OCCASIONAL with descriptions noting they segregate away from the malformations.

    5. prevalence: added - CASES_IN_LITERATURE, ULTRA_RARE, with the four-patient count in notes.

    6. The single 'Supportive and Surgical Care' treatment bundled two modalities under BEHAVIORAL. Split into Surgical Repair of Congenital Malformations (SURGERY, NCIT:C15329) with target_mechanisms onto the esophageal atresia and cardiac phenotypes, and Supportive Care (OTHER, NCIT:C15747). The surgical entry carries no evidence item because neither cited abstract describes surgical management; that is stated in its description rather than papered over.

    7. The Childhood survival progression snippet was a 'here is what our paper does' sentence that never stated anyone survived. Swapped for the sentence that does.

    Non-blocking suggestions taken: biological_scale on Impaired De Novo Purine Synthesis corrected from ORGANISM to CELLULAR; esophageal atresia and polyhydramnios raised to VERY_FREQUENT; treatment target_mechanisms added; and the CRISPR-Cas9 PAICS-knockout HeLa line added as an experimental_models entry with PARTIALLY_RECAPITULATES and an INCREASED readout. That last one is the most valuable of the suggestions - it is a genuine counterpoint to the missing_toxic_metabolite gap, since intermediates do accumulate behind the block in that system while they were undetectable in patient fibroblasts. The discussion now carries that evidence and states the cell-type-versus-genotype question explicitly.

    Non-blocking suggestion not actionable: HP:0003811 Neonatal death. It was added and rejected by term validation - 'Value HP:0003811 not in dynamic enum PhenotypeTerm'. Mortality terms sit outside the phenotypic-abnormality branch the PhenotypeTerm enum is reachable_from, so they cannot be bound as phenotypes at all. The same thing happened with HP:0001522 Death in infancy on the sibling PR #10494. Early death remains recorded through progression and clinical_burden. Reported to the reviewer as a schema observation rather than worked around.

    Suggestion considered and left as-is: the REFUTE grading on the normal-neurodevelopment evidence item. The reviewer notes it is defensible and that a separate SUPPORT-graded phenotype would model the same fact more directly. Left alone because the claim being refuted is the obligate-feature reading of developmental delay, and the explanation says so.

    Validation after changes: just validate passes; 37/37 snippets verified, up from 26/26. All offline gates green. Compliance 85.2% global / 85.6% weighted. The residual compliance gaps are evidence on container objects - the organogenesis downstream edges, treatments and discussions - where the mechanism is genuinely unestablished; no evidence was manufactured to close them.

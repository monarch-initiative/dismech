  summary: 'Create: MARK2-Related Intellectual Developmental Disorder (MRD76)'
  details: |
    De novo curation of MRD76 (MONDO:0979575, OMIM 621285), autosomal-dominant autism spectrum disorder with intellectual disability caused by heterozygous MARK2 (hgnc:3332) loss-of-function variants. Deep research via Perplexity (report cited no PMIDs; the pivotal primary paper was found and verified independently). Curated against the full text of Gong et al. 2024 Am J Hum Genet (PMID:39419027, PMC11568763), the 31-individual cohort. Mechanism chain: MARK2 haploinsufficiency (GO:0004674 ser/thr kinase, DECREASED) -> WNT/beta-catenin downregulation (GO:0060070, DECREASED) -> impaired neuronal development (GO:0030182, iPSC-NPC IN_VITRO) -> abnormal cortical development (Mark2+/- mouse MODEL_ORGANISM) -> ASD/ID/GDD/speech delay/seizure/motor delay. Added AD inheritance (HP:0000006; mostly de novo, some inherited), variants c.337+1G>T (splice, 49-bp deletion) and p.Gly135Arg (destabilizing missense), facial-feature phenotypes (downslanted palpebral fissures, broad forehead, narrow face; left unwired as the facial gestalt mechanism is unknown), a Mark2+/- mouse animal model linked to the cortical node (ALIGNED model scale), and lithium as an investigational WNT-reactivating treatment (preclinical only, target_mechanisms RESTORES). All offline gates and validate-disorders pass; 20/20 snippets and titles verified; no GeneReviews chapter exists.

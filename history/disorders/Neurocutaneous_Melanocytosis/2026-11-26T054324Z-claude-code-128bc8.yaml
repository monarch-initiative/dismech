  summary: 'Gene-family review: BRAF'
  details: |
    The BRAF record was typed CAUSATIVE on two reports: a prospective cohort with BRAF V600E in 2 of 16 patients with neurocutaneous melanocytosis (PMID:25490715) and a single case responding to BRAF inhibition (PMID:42384401). The schema reserves CAUSATIVE for Definitive or Strong evidence and no body has graded the pair, so the record is now UNKNOWN and its note says why. The NRAS record (codon 61 in 12 of 15 patients, matched tissues, mouse model) was left CAUSATIVE as the predominant cause of this obligate-mosaic disorder.

  summary: Orphanet transcription, mappings and classifications
  details: |
    Transcribes the phenotype table of the Orphanet record ORPHA:2481 (Orphadata snapshot
    2026-06-23), already cited for the European prevalence row, and adds classifications and
    mappings. Of the record's 46 phenotype rows, seven match existing phenotype rows and are
    added to them as evidence: melanocytic naevi, seizures, hydrocephalus, raised intracranial
    pressure, cranial nerve paralysis, melanoma and the Dandy-Walker malformation. A band is set
    from Orphanet only where a row had none and nothing in the entry conflicts with Orphanet's
    class, so cranial nerve palsy takes Orphanet's occasional. Six of the rows carrying
    Orphanet's class get no band. For raised intracranial pressure, the row's 67%, from a
    different patient group (primary diffuse leptomeningeal melanomatosis), and Orphanet's class
    would put the finding in different bands; for melanoma, so would the 62% of 39 published
    cases in the 1991 literature review; the new neoplasm row conflicts with that figure and
    with the 1991 definition, which makes the leptomeningeal lesion itself a pigment cell
    tumour; the new intellectual disability row's very frequent cannot describe the whole
    patient population, since the description records that much of the central nervous system
    involvement is silent; and the new renal hypoplasia and venous thrombosis rows' occasional
    conflicts with a cited review's statement that there is no systemic involvement, or only
    rarely. Where Orphanet's class differs from the 74-case systematic review's figure
    (seizures, hydrocephalus) or from the disease's definition (the naevi, kept obligate), the
    row keeps its band, and the evidence item says why. Death in infancy is a clinical-course
    term outside the phenotypic-abnormality branch, so it is recorded on the symptomatic
    progression phase. The other 38 rows are new phenotype rows, 34 of them banded from
    Orphanet, each explaining Orphanet's class as one with no stated population or denominator.
    The neoplasm row binds the coarse HP:0002664 with coarse_binding_basis SOURCE_UNSPECIFIED,
    and notes on nine rows qualify Orphanet's coding, from how it relates to the rest of the
    entry to its being recorded as given. Classifications: the Harrison's values NEUROLOGIC and
    DERMATOLOGY, from Orphanet's definition. Mappings: NCIT:C175215 and the ICD-11 Foundation
    entity icd11f:403221860, both from MONDO's equivalence cross-references. Not recorded:
    Orphanet's age of onset (childhood), since the progression phases give onset from the cited
    sources; its ICD-10 cross-references D22.3 to D22.7, which are site codes for melanocytic
    naevi, each of which Orphanet marks the disease as broader than; and OMIM:249400, because
    the schema's OMIM slot takes phenotypic series only. The entry notes now describe Orphanet's
    record and its classes beside the cited studies and say that a source is cached as its
    abstract unless its cache file records a full text, the treatment paragraph no longer counts
    three patients where the MEK row describes four, and a new paragraph says why no ICD-O
    morphology is assigned; the review notes name the ontologies and schema vocabularies the
    classifications, the mappings and the placement of death in infancy rest on. The cranial
    nerve palsy description no longer says that no cited source gives its frequency, and the
    explanation on its PMID:33048248 item no longer says that this is why the row has none. New
    cache rows: HP:0005603, HP:0007360, HP:0012470, NCIT:C175215 and icd11f:403221860, in the
    term caches and their enum caches. Validation: just validate passes, all 134 snippets
    verify, and the full gate set passes.

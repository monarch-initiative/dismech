  summary: Imaging findings and the two screening policies
  details: |
    Adds an imaging_findings section with two rows. The first, T1 hyperintensity of parenchymal
    melanosis, binds NCIT:C182328 Hyperintensity, NCIT's general term (label searches of HPO on
    OLS for T1 hyperintensity return only HP:6000286, which is specific to focal brainstem
    lesions), and records the bright T1 signal where melanin is likely deposited; the order of
    sites in the Japanese screening series, whose abstract gives no counts by site; the sites
    and the usual bilaterality a 2020 case report's background gives; that report's learning
    point that precontrast T1 hyperintensity is a characteristic finding (the paper uses
    meningeal melanosis for the central nervous system lesion in general); and, in notes, the
    timing relative to myelination (two neonates in a 2024 imaging article, and harder to see
    later in the first year, when contrast may be needed), that a normal scan does not exclude
    the disease, and that T2 signal is reported both ways. The second, leptomeningeal thickening
    with T1 hyperintensity, records the leptomeningeal form from a 2026 fetal case review and
    the 2024 article's distinction between focal parenchymal and diffuse leptomeningeal
    melanosis and their different risks. It binds HP:0010651 Abnormal meningeal morphology, the
    narrowest HPO term that covers it: its nearest child terms, as listed on OLS, name
    enhancement, one layer of the meninges or the spinal meninges only, and the searches
    recorded in its notes found no HPO or NCIT term for leptomeningeal thickening. The screening
    MRI diagnosis row now records two of the screening policies the cited sources give, one
    centre's single MRI for every child born with more than one congenital naevus and the
    Nevosurgery Network's for a giant naevus, more than 20 concomitant naevi or neurological
    symptoms, quoted from the article's main text, where the criteria read and/or, and that two
    children in an earlier report from the same group, on children seen from 1991 to 2007, died
    of melanoma after normal scans. Sentences on how often the neural lesion is present are
    corrected. The entry notes and the screening discussion counted the proportions the cited
    sources give, which the new sources make untrue, since they contain other such figures; both
    now refer to the entry's four prevalence records among people with congenital melanocytic
    naevi, and the notes say what each measures; the Europe row's notes, which called every
    other record a proportion among children, now say people. The Japanese prevalence row said
    that two other sources measure the same quantity, which was not true of either: the 21%
    counts an abnormal scan of any kind and the 12% is a lifetime risk. New sources:
    PMID:39518313, PMID:41474606, PMID:18671780 and PMID:33257354. New cache rows: NCIT:C182328
    in the NCIT term cache and the imaging-finding enum cache, and HP:0010651 in the
    imaging-finding enum cache. Not added: prevalence figures from these sources, fetal imaging
    as rows of its own, and the 2024 article's acquisition protocol. Three statements these
    sources make stale are rewritten by other open changes and left alone here, so that the
    changes do not conflict: the entry notes' statement that every cited source is cached as an
    abstract (PR 18538), and the count of four MEK-treated patients in the MEK inhibition row
    and in the targeted-therapy discussion, to which the 2020 case report adds one (PR 18545).
    The screening discussion's sentence on survival now carries its source's "typically"; the
    Japanese prevalence row says its quantity is the lesion on brain MRI, symptomatic or not;
    the screening MRI row now names the two screening series and the groups they scanned, and
    the screening discussion's range refers to those series; the 21% is no longer given as a
    share of the 289 children who met the screening criterion, since the abstract does not say
    how many were scanned; and the registry row no longer says that its narrower quantity
    explains most of the gap with the Japanese figure. Validation: just validate passes, all 101
    snippets verify, and the full gate set passes.

  summary: 'Create: Neurocutaneous Melanocytosis'
  details: >-
    New entry for neurocutaneous melanocytosis (MONDO:0009578), curated by hand from the fifteen cached references it cites, and replacing the stub, which this PR
    deletes.


    The entry is built around what makes this one disease rather than two. A single post-zygotic
    NRAS codon 61 mutation is found in the affected skin and the affected central nervous system
    tissue of the same patient and in neither their blood nor their unaffected tissue, in twelve of
    fifteen patients in the series that established it. That sentence is the whole argument, and it
    is the evidence on the first causal edge as well as on the inheritance block, which is bound to
    HP:0001442.


    The pathograph runs: post-zygotic NRAS codon 61 mutation, mosaic melanocytic clone spanning skin
    and neuraxis, then three arms out of that clone - congenital melanocytic naevi, leptomeningeal
    and parenchymal melanocytosis, and non-melanocytic central nervous system malformation. The
    third arm is in the chain rather than beside it because all eleven central nervous system
    samples tested in that series were mutation positive, melanocytic and non-melanocytic alike.
    Below the melanocytosis node sit obstruction of cerebrospinal fluid flow and malignant
    transformation to leptomeningeal melanoma. All ten phenotypes are causally connected.


    Denominators are named on every figure, because the sources count three different things and the
    numbers differ with them. A prospective screening series images every infant referred for
    treatment of congenital melanocytic naevi and finds the neural lesion in 31.6% of 38; a
    self-reported internet registry finds abnormal imaging without symptoms in 4.8% of 186; a pooled
    review of 74 published cases gives the symptom frequencies, and over-represents the severe. Both
    prevalence records are kept and neither is averaged, with a note saying the cached abstracts do
    not reconcile them.


    Treatment evidence stops at single patients and the entry says so on every row. One infant's
    leptomeningeal thickening fell rapidly on trametinib and he had met all developmental milestones
    at 53 months - but he received azacitidine at the same time. One 13-year-old was given a MEK
    inhibitor and died five days later, too soon for a clinical effect, though his tissue showed
    lower pERK and Ki67 afterwards. The only comparison between drugs is in nevospheres grown from
    four patients' own lesions, where the dual PI3K/mTOR inhibitor outperformed the MEK inhibitor.
    The PI3K row binds omipalisib, the compound both cell studies actually tested, beside the two
    approved drugs of the same targets, and its notes say which is which.


    Two model systems carry typed divergences. The embryonic-melanocyte NRAS mouse is
    PARTIALLY_RECAPITULATES against the clone node with a PROXY_QUANTITY and a SPECIES_MISMATCH
    divergence - its allele is G12D rather than codon 61, it is a transgenic rather than a mosaic,
    and its cutaneous lesions are reported as resembling blue naevi - and RECAPITULATES against the
    melanoma node, which is the result it was built for. The patient-derived nevospheres are
    MEASURES with a BOUNDARY_OMISSION divergence. The allele and architecture mismatch is also
    recorded as a HUMAN_MODEL_MISMATCH discussion, because the mouse is the main non-human evidence
    for the lethal arm.


    Two further discussions record what is open. Whether screening every infant with more than one
    congenital melanocytic naevus changes anything: the lesion is found in a quarter to a third of
    them, nearly all neurologically well, and no cited source shows that finding it early changes
    the course or offers a treatment that does. And whether inhibiting the pathway changes the
    neural disease, where the evidence is the single patients above.


    Three things are deliberately absent and the review notes say why. No laboratory threshold: none
    is given by any cited source. No cell of origin beyond melanoblast, which is inferred from where
    the clone's descendants end up rather than observed. And the mutation-testing diagnosis row
    carries no diagnosis_term, because the nearest cached NCIT clinical-action term names
    immunohistochemistry while this row is a sequencing test; an approximately-right binding there
    would assert the wrong method.


    Content fences. No chromosomal lesion at 1p36, 11q or 17q and no chromothripsis is cited, and
    the literature digest that read the cached corpus was given that exclusion. One cached
    reference, PMID:27933403, has `content_type: unavailable` and holds no body, so nothing could be
    quoted from it; it is not cited.


    Validation: just validate passes with 79 snippets and 79 titles verified and no issues; just
    list-disconnected-phenotypes reports 10 of 10 connected. Every snippet was checked against its
    cache at the moment it was written, and every reference_title was read from the cache's own
    title line rather than typed.


    Two adversarial verification passes ran before the push and found real defects on an entry that
    passed every gate. The worst was a claim stated four times and backwards: that most children
    with the neural lesion never develop symptoms. The registry series cited for it says 17 of 26
    reported neurological symptoms, and no cited source gives the proportion either way; the entry
    now says so. Four further negative or universal claims were refuted by references the entry
    itself cites - that no patient result exists for the PI3K class, that the nevospheres are the
    only system in which drugs are compared, that nothing establishes what separates children with
    and without profound delay, and that every patient carries a codon 61 substitution when twelve
    of fifteen do and one cited patient carries BRAF V600E. A cited patient who took trametinib for
    seven months and died of malignant transformation had been left out of every summary of
    MEK-inhibitor evidence and is now in the row and graded REFUTE. The two prevalence records were
    presented as the same quantity disagreeing six-fold; they are not - one counts asymptomatic
    involvement only - and two further cited figures, 21% and about 12%, now sit beside them. A
    screening study was cited only at its objective and graded NO_EVIDENCE while its own conclusion
    answers the question; it is now cited at its conclusion and at its predictor result. Three
    bindings changed: omipalisib is bound where the notes had claimed the tested compound had no
    CHEBI term, which was the cache-first contract read backwards; the BRAF treatment row's
    vemurafenib binding is removed because its only source names no drug; and the spinal arachnoid
    cyst row is rebound to the term for it. A folded line ending in the word no would have been
    rewritten to false by the yamlfix hook. Five tracked references_cache files were rewritten by a
    verification run and were reverted rather than committed.


    Review round on the PR. Four blocking items, two of which were remnants of corrections the PR
    body said were complete - which is the useful part of the finding. The claim that
    screen-detected involvement is nearly all asymptomatic survived in two places after being
    corrected in four others, and the entry's own progression note said the opposite on the same
    page; both are gone, and the sentence now says what is true, that the series giving the 31.6%
    figure reports no symptom data at all. The fatal trametinib patient had been added to the MEK
    treatment row and not to the discussion that summarises the same evidence. Both now carry him,
    and a fourth patient as well: the melanomatosis case counted on the PI3K row for everolimus
    received trametinib in the same four-drug combination, so he belongs in both rows or neither,
    and the entry now counts him in both with the caveat that his entity is primary diffuse
    leptomeningeal melanomatosis. The prevalence block carried four different proportions under two
    records; it now has five records, each with its own population and denominator, and the fifth is
    the one the block was missing - Orphanet's European point prevalence of 1-9 per 100,000, which
    is the only population figure here and the only one a reader filtering on prevalence_class will
    read correctly. The 1991 review that proposed the diagnostic criteria was cached and uncited; it
    now backs the disease definition, the presentation and prognosis of symptomatic disease, and the
    cerebrospinal fluid row, which previously rested on a single case. Three suggestions are taken:
    a garbled limitations sentence is rewritten, the cerebrospinal fluid liquid-biopsy route is
    recorded on the mutation-testing row, and the BRAF row now says on what the CAUSATIVE grade
    rests and why gene_disease_validity is empty.

  summary: Add MONDO related-match mappings
  details: |
    Adds a mondo_mappings list to the mappings section, which held only NCIt and ICD-11
    rows: diffuse meningeal melanocytosis (MONDO:0003867), diffuse leptomeningeal
    melanocytosis (MONDO:0016745) and meningeal melanomatosis (MONDO:0004512), each
    skos:relatedMatch, with a justification read from MONDO's definitions and classification
    of the three terms and from this entry's own content. None is a MONDO descendant or
    ancestor of this entry's term, and none of the three requires the large or multiple
    congenital melanocytic naevi this disease needs, the same distinction the leptomeningeal
    melanoma differential row makes. The three rows give manual curation as their mapping
    source, because MONDO supplies the terms but asserts none of these relations; the NCIt
    and ICD-11 rows keep MONDO, which cross-references both. MONDO:0003761 (leptomeningeal
    melanoma) is not mapped, because that differential row binds it; its paediatric child
    term MONDO:0003764 is left out because it is a subclass of that term. The Orphanet
    record ORPHA:252031 was built from local Orphadata and has a definition, but mapping
    rows carry no evidence and MONDO:0016745 takes its definition from that record, so the
    justification quotes MONDO's definition and no Orphanet cache is committed. One clause
    of the Leptomeningeal and Parenchymal Melanocytosis node's notes now says that the
    referral series found imaging suggestive of diffuse leptomeningeal disease in six of
    fourteen, as the source puts it, rather than the disease itself. Validated with just
    validate and validate-terms; 33 gates passed.

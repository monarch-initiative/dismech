  summary: Differential diagnoses
  details: |
    Adds a differential_diagnoses section with four rows. Melanoma metastatic to the
    leptomeninges (MONDO:0005191 metastatic melanoma) rests on the two 1991 exclusion criteria,
    as a 2026 case report's review restates them, which exclude a patient whose skin and
    meningeal lesions are both malignant, and on a 2015 series whose authors offer its genetic
    findings as an aid in telling a primary leptomeningeal melanocytic neoplasm from a
    metastasis of cutaneous melanoma; both items are graded indirect, since neither names
    metastasis together with this disease. Meningeal melanocytoma (MONDO:0016746) rests on that
    2015 series of 20 primary leptomeningeal melanocytic neoplasms (a GNAQ or GNA11 mutation in
    most and no NRAS, BRAF or HRAS hotspot mutation; indirect, since it reports melanocytomas
    and melanomas together) and on a 2016 series' discussion, citing earlier work, that patients
    with this disease have large or multiple congenital naevi with the leptomeningeal tumour and
    frequently the same NRAS mutation in both. Primary leptomeningeal melanoma without
    congenital naevi (MONDO:0003761 leptomeningeal melanoma) rests on the same two sources and
    on the 2016 series' statement that its patients were all adults, so the genetic contrast is
    recorded for adult series; the exception is the child without skin lesions in the 2017
    trametinib series, all of whose four children had NRAS-mutated melanoma, whose
    leptomeningeal melanoma resembled those of the children with naevi and which the authors
    suggest could be the same post-zygotic mutation confined to the nervous system. Other mosaic
    RASopathies (MONDO:0021060 RASopathy) rests on a 2025 review that lists these conditions
    with this disease and says many RASopathies can be diagnosed clinically from their cutaneous
    findings; both items are graded indirect, since the review's abstract does not compare the
    conditions with this disease, and the row's notes record that MONDO files none of them under
    RASopathy. Left out: the 2015 series' copy-number findings; the 2016 series' SF3B1 and
    EIF1AX mutations, found in 2 of 13 melanocytomas, 4 of 7 intermediate-grade tumours and 2 of
    4 melanomas, one of them in a patient with this disease, so they do not tell these tumours
    from this disease; a case of plexiform melanocytic schwannoma among lesions excised from a
    woman with a giant naevus (PMID:41624622), which states no distinguishing feature; a case of
    this disease with neurofibromatosis (PMID:42240487), for which no abstract is available; and
    differentials the research report gives without a cached source: proliferative nodules and
    melanoma within the naevus (PMID:27849631), the copy-number profile of primary melanoma
    within this disease (PMID:27933403), the WHO 2021 division of meningeal melanocytic
    neoplasms into diffuse and circumscribed (the cached abstract of the WHO summary,
    PMID:34185076, does not describe it), melanotic schwannoma as a differential of its own,
    naevus of Ota and dermal melanocytosis, Sturge-Weber syndrome and other causes of bright T1
    signal; and phakomatosis pigmentovascularis, which the report adds to the review's list but
    the review's abstract does not name. New cache files: PMID:25315378, PMID:26769193,
    PMID:28253523 and PMID:41474606; the last two cache files are byte-identical to the ones the
    open MEK inhibition and imaging changes add (PRs 18545 and 18546). New cache rows:
    MONDO:0003761 and MONDO:0005191. Validation: just validate passes, all 97 snippets verify,
    and the full gate set passes.

  summary: 'Edit: Neurocutaneous_Melanocytosis - change to melanoma in the brain'
  details: |
    Records where the line between benign melanocytosis and melanoma of the central nervous
    system falls, the further events that come with malignant change, how often melanoma
    arises, and the ages at death. The transformation node now cites a review that reads
    new or rapidly progressive disease, previously termed symptomatic neurocutaneous
    melanosis, as primary melanoma, defines transformation histologically while noting a
    poor prognosis even without the classical cytological hallmarks, and says the melanoma
    is more often leptomeningeal than a solid tumour in the brain; the review shares
    authors with a letter on six biopsies, in which the five children with newly acquired
    or progressive disease, one of them without naevi on the skin, had copy-number change
    of the kind seen in cutaneous melanoma, described here in general terms only, and all
    died, while the one stable patient had a normal pattern. The transformation edge adds
    one autopsied girl, quoted by her course (benign first biopsies, then meningeal
    melanomatosis on an open biopsy three weeks later), whose founding mutations, GNAQ
    R183Q and S1PR3 G89S, were found in tumour and normal tissue and not in the naevus,
    which the authors put down in part to its low cellularity, with copy-neutral loss of
    heterozygosity in the tumour, and whose only reported NRAS mutation, G12V, was found in
    tumour spread to the abdomen through a shunt and not in the brain tumour. Those items
    are graded INDIRECT, apart from the naevus result, which backs the edge description and
    is NO_EVIDENCE for the edge itself; the NRAS row's notes say where G12V is recorded and
    that the founding mutations were not found in the naevus. The developmental delay edge
    now quotes the two groups of children with an abnormal scan in the screened cohort,
    graded INDIRECT. The melanoma phenotype adds one tertiary centre's cohort of 448
    children with congenital naevi, in which childhood melanoma arose more often in the
    central nervous system than in the skin and was commoner after an abnormal screening
    scan (6 of 51) than after a normal one (3 of 179), with the authors' note that their
    patients have more severe disease than the general spectrum, and a literature review's
    estimate, which the paper cites, that about a third of the melanoma in these patients
    is primary in the central nervous system; the cohort figures, the abnormal-scan and
    normal-scan groups included, are graded INDIRECT, and the phenotype no longer says the
    sources do not compare the two sites. The melanocytosis node's description and notes
    give the abnormal-scan group's 5 of 51 melanomas of the central nervous system, with
    the table row quoted on the node. The malignant transformation phase adds the sites of
    melanoma, the ages at death in that cohort and the five deaths in the biopsy series.
    Because the new evidence reads fatal symptomatic disease as melanoma, the symptomatic
    phase now records two readings with their years, a 2022 systematic review's three-year
    figure and the 1991 review's poor outlook against a 2017 review's objection to the
    label; the screening discussion records both, the 1991 item's explanation says its
    poor-outlook reading is contested, and the entry description says that new or
    progressive disease carries a poor prognosis though symptoms alone need not, and that
    the NRAS mutation is the cause in most patients. No quote this change adds names a
    chromosomal region; copy-number change is described only in general terms. Two fetched
    sources were not used: a two-case report whose survival figures are uncited and
    internally inconsistent, and a study of skin nodules rather than the brain. Validated
    with just validate and count-verified-snippets (205 of 205).
    Rebased onto main after #18674, which reworded the same notes paragraph on the
    leptomeningeal disease node; the paragraph keeps that wording (imaging suggestive of diffuse
    leptomeningeal disease) and adds the tertiary-centre cohort.

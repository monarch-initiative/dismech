  summary: MEK inhibition evidence, BRAF and mTOR additions, and three trial records
  details: |
    Rebuilds the MEK inhibition treatment row around three new sources: a series of four
    children with NRAS-mutated melanoma of the central nervous system treated with trametinib
    (PMID:28253523, three of them with congenital naevi), a German registry study of melanoma of
    the central nervous system in this disease with published cases added (PMID:38225622), and a
    teenager with parenchymal melanosis on trametinib and levetiracetam (PMID:33257354). The
    series gives a temporary improvement in every child, one child's stable MRI, no clinically
    significant side effects, and progression and death in every child; the registry study gives
    no survivor at a year among 27 children, nine of them given trametinib among other
    treatments. The teenager's stable course at one-year follow-up came four to five months
    after trametinib was added to levetiracetam, after a breakthrough seizure-like episode about
    two months in. Two explanations on the row's 2018 case no longer say he was the only patient
    treated long enough for an effect, which the infant still on trametinib at 53 months
    contradicts, and the description no longer says he died at 30 months, an age the source
    gives for his deterioration; the child with primary diffuse leptomeningeal melanomatosis, an
    aggressive cancer biologically closely related to this disease, is now described as given
    trametinib and everolimus followed by two immunotherapies, as the source has it, on this
    row, on the PI3K and mTOR row and in the discussion. The row's notes, which said "No trial,
    no comparison, no series", now say that none of the clinical reports cited on the row makes
    a controlled comparison, and name the registered phase II trial. The PI3K and mTOR row gains
    the series centre's report, from its unpublished data and its cohort review, that sirolimus
    had no measurable effect in three children, and the BRAF row gains the series' statement
    that selective BRAF inhibitors are contraindicated with an NRAS driver; its case report's
    explanation no longer calls that report the whole of the row's evidence. The discussion on
    targeted therapy is rewritten to the new evidence. Where the 14-patient referral series was
    called only the referral series (in the sentences on deaths and melanoma, the spinal
    arachnoid cyst row and the asymptomatic phase), it is now named as the 14-patient series,
    since the trametinib series also comes from a referral centre. The word tertiary, which its
    abstract does not use, goes from the malignant transformation node and from the notes of the
    leptomeningeal and parenchymal melanocytosis node. The entry notes keep it: PR 18538
    rewrites that paragraph and keeps the sentence, so it is left for a later change. Older
    wording that overstated its sources is corrected. The malignant transformation node and the
    melanoma phenotype no longer say that the melanoma is what kills, since the series' abstract
    reports it in four of the six who died without giving it as the cause, and the other two of
    its six deaths are not reported to have it; the explanation that called the series' figures
    an association with death now gives them as counts. Three explanations no longer call
    primary diffuse leptomeningeal melanomatosis the malignant end or form of this disease,
    since the abstract of the review that pools its cases gives only a close biological
    relation. The survival figure from pooled cases of primary diffuse leptomeningeal
    melanomatosis is no longer read as the prognosis of melanoma in this disease, on the
    malignant transformation node and on the progression row; both now also cite the registry
    study's median survival of 0.4 years for melanoma of the central nervous system in children
    with this disease. Raised intracranial pressure is no longer called the presentation most
    often missed and the stated reason for delayed diagnosis, on its edge and its phenotype row:
    the review names the non-specific presentation, with unrecognised raised pressure as its
    example, as a frequent reason, in its melanomatosis cases. The asymptomatic phase no longer
    takes the screening series' proportion as its own, since that series of 38 Japanese infants
    counts the lesion on brain MRI with or without symptoms; the leptomeningeal and parenchymal
    melanocytosis node, in its description and in the explanation citing that series, no longer
    gives the series' third as true of all infants with congenital naevi, and calls the series'
    infants starting treatment rather than referred for it, its abstract saying that they
    underwent initial treatment; the prevalence row's notes use the same older wording and are
    left to the change on imaging that follows this one, which rewrites that paragraph; the
    cerebrospinal-fluid test is attributed to the melanomatosis report it comes from, which
    offers it as a potential biomarker, and that report's sentence is now quoted; and the
    arachnoid cyst row no longer gives a reason for imaging the spine that its source's abstract
    does not state. Several statements about what a source does not report now refer to its
    abstract, which is all that is cached. A new clinical_trials section records three
    registered studies: the phase II mirdametinib trial for large and giant congenital naevi
    (NCT07891286, not yet recruiting, recorded as NOT_RECRUITING), the registry of this disease
    (NCT04548817) and the CIRCLE cohort of children with congenital naevi (NCT06828822), with
    registry fields as retrieved on 20 November 2026. The trial record leaves out the trial's
    list of qualifying gene fusions. The entry notes are left as they are: the open change
    transcribing the Orphanet record (PR 18538) rewrites the two paragraphs this change would
    otherwise make false, that every cited source is cached as an abstract and that treatment
    evidence stops at single patients. After the first review, as the reviewer suggested, the
    MEK row adds the teenager's skin findings: at the follow-up after 10 weeks of trametinib the
    naevus on her forehead had shrunk and the borders of the largest looked lighter, while some
    other naevi were reportedly darker, recorded as a SUPPORT and a REFUTE item, both indirect.
    Validation: just validate passes, all 106 snippets verify, and the full gate set passes.

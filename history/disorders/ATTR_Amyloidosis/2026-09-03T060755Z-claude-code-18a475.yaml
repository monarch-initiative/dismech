  details: |
    Migrated this entry's one supports: PARTIAL evidence item to the narrowed EvidenceItemSupportEnum. Issue #7439 removed PARTIAL and WRONG_STATEMENT from the enum while this PR was open; the entry was authored when PARTIAL was still permissible, and the YAML merged cleanly against main because the conflict was semantic rather than textual - test_no_out_of_enum_values_in_kb is what caught it. The item is the HELIOS-B vutrisiran outcome citation on the Reduced Circulating TTR Precursor Pool node. Its original explanation already recorded exactly why it was PARTIAL: the trial reports clinical outcomes, not the serum TTR reduction the node asserts. That is the sense the narrowing maps to supports: SUPPORT plus the new directness: INDIRECT slot, whose enum description names this case directly (a therapeutic response cited as validation of the mechanism it targets). Recorded that way rather than as NO_EVIDENCE or a split pair, and the explanation prose was rewritten to stop referring to a value that no longer exists. No snippet, reference, or claim changed.

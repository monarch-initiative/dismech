  summary: 'Migrate ASO/siRNA treatment detail to oligonucleotide_details: ATTR_Amyloidosis'
  details: |
    Populated the new oligonucleotide_details block on this entry's siRNA treatment(s), which previously carried mechanism and delivery platform only as free text in the treatment description. Recorded oligonucleotide_mechanism RNAI_KNOCKDOWN, target_gene (HGNC id reused from an already-validated binding elsewhere in the KB rather than looked up fresh), target_transcript, and — where the drug is approved and the platform documented — conjugation plus delivery_platform. Added dosing_interval / dosing_interval_days for approved agents whose maintenance interval is a label fact. Intervals not sourceable from the reference cache were left empty rather than guessed (plozasiran). Delivery and chemistry left unset for preclinical or allele-selective proof-of-concept siRNAs, where no platform has been chosen. oligonucleotide_chemistry was left unset throughout: stabilized siRNA duplexes mix 2'-OMe and 2'-F, and the slot is single-valued, so populating it would force an unsourced choice. Validated with just validate. Additionally wired this entry in as the first conformer of the new rnai_gene_silencing module. Added four pathophysiology nodes covering the therapeutic chain — Hepatic TTR Transcript Abundance, Hepatocyte-Directed siRNA Delivery, siRNA-Directed TTR Transcript Cleavage, Reduced Circulating TTR Precursor Pool — each carrying conforms_to against the corresponding module node, GO bindings, and its own evidence. The delivery node is where the entry earns its place: patisiran and vutrisiran target the same transcript by different platforms, so the LNP-versus-GalNAc contrast is visible at the disease level rather than only in prose. The two existing siRNA treatments gained a second target_mechanisms link to the cleavage node. The HELIOS-B outcome evidence on the precursor-reduction node is marked PARTIAL because the trial reports clinical outcomes, not the serum TTR reduction that node asserts. All DOI-prefixed snippets were checked by hand against references_cache because linkml-reference-validator skips that prefix.

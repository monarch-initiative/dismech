  summary: Map ATTR_Amyloidosis to MONDO:0971004 (TTR-specific class)
  details: |
    Added a skos:exactMatch mondo_mappings row to MONDO:0971004 (amyloidosis, hereditary systemic 1; OMIM:105210), the TTR-defined is-a child of the entry's disease_term MONDO:0007100. The entry is restricted to TTR-variant disease, so it denotes the same concept; Orphanet ORPHA:271861 lists OMIM:105210 as Exact. This was the item deferred by PR #12906 (issue #12259) and listed as stranded on issue #12931. Removed stubs/Amyloidosis_Hereditary_Systemic_1.yaml, which the mapping now covers. Validated with just validate, validate-terms, validate-disorders, check-shared-disease-terms and check-stubs.

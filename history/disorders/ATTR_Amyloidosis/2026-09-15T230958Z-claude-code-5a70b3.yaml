  details: |
    Addresses the blocking item and both suggestions in the ai4c-reviewer review on PR #9151, and resolves the merge conflict that had accumulated against main.

    Blocking -- evidence_source on PMID:42265992. Changed HUMAN_CLINICAL to OTHER. The paper is a narrative review and the quoted sentence is a management recommendation, not a reported human result. This also matches how the rest of the file grades reviews and guidelines, and matches the grading main independently gave the same sentence, so check-snippet-grading now agrees on both uses.

    Suggestion -- explanation overreached its snippet. The old explanation claimed 'heart failure and arrhythmia complications'; the quote says 'cardiac complications and comorbidities' and does not mention arrhythmia. Rewritten to track the quote and to keep the 'depending on left ventricular function and drug tolerability' conditionality, which matters because beta-blockers are often poorly tolerated in cardiac amyloidosis.

    Suggestion -- host entry did not claim what the evidence supports. Extended the Multidisciplinary supportive care description to name cardiac pharmacotherapy and its tolerability conditionality, and to point at the dedicated SGLT2 entry.

    Merge resolution. main has since gained a dedicated 'SGLT2 Inhibitors' treatment entry citing the same PMID:42265992 sentence, with a CHEBI dapagliflozin therapeutic_agent binding and a target_mechanisms edge into Cardiac Amyloid Infiltration and Dysfunction -- which is the second of the two options the reviewer's third suggestion offered, implemented independently. Merged origin/main into the branch and kept main's entry in full; this PR's contribution is now the references[] completion for PMID:42265992, the supportive-care evidence item covering the broader pharmacotherapy claim, and the description extension. Nothing of main's was reverted: post-merge diff against main is 13 insertions and 1 deletion in one file.

    The merge also carried in main's migration of a 'supports: PARTIAL' item on this entry to SUPPORT (retired under #7439); no PARTIAL values remain in the file.

    Validation on the merged tree: just validate-disorders passes (schema + terms + references), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values clean, and whole-KB check-snippet-grading reports nothing in this file.

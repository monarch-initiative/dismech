  summary: Add patisiran breakthrough-neuropathy evidence and tafamidis progression
    limitation
  details: |
    Added PMID:42745530 (Falcao de Campos et al., Muscle Nerve 2026) in two places. On the Patisiran treatment it supports slowed neuropathy progression after switching from tafamidis; graded supports: SUPPORT with directness: INDIRECT, since a therapeutic response is cited for the mechanism it targets. On the Tafamidis treatment the same quoted RESULTS sentence is recorded as a limitation: neuropathy continued to progress at 3.9 +/- 4.7 NIS points per year on tafamidis 20 mg, which is what prompted the switch. Both items carry quote_role: PRIMARY_RESULT (the paper's own RESULTS section) and evidence_source: HUMAN_CLINICAL (32-patient retrospective multicenter cohort). The Patisiran explanation was rewritten to name the comparator as tafamidis 20 mg specifically and to record the ATTRV30M (p.V50M) genotype restriction, replacing an earlier phrasing that said TTR stabilizers as a class. Validated with just validate (pass), 102/102 snippets verified, plus the duplicate-key, enum-value, snippet-grading, entity-ref and causal-target gates. The Tafamidis evidence item was regrade from supports: SUPPORT to supports: REFUTE to correctly align the enum value with the explanation, which describes a treatment limitation rather than a benefit.

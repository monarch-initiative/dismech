  details: |
    Augmented the treatments section from PMID:42265992, a 2026 cardiac amyloidosis clinical review. Added mortality evidence to the existing tafamidis and vutrisiran entries, quoting the review's hazard ratios of 0.70 and 0.72 respectively, alongside the pre-existing ATTR-ACT and HELIOS-B primary-trial evidence. Added a new SGLT2 Inhibitors treatment entry, therapeutic_modality SMALL_MOLECULE, treatment_term NCIT:C15986 Pharmacotherapy with therapeutic_agent CHEBI:85078 dapagliflozin, linked into the pathograph via target_mechanisms on the Cardiac Amyloid Infiltration and Dysfunction node with treatment_effect MODULATES. All three new evidence items are tagged evidence_source OTHER, matching this entry's existing convention for narrative reviews. Review-cycle history: the first ai4c-reviewer pass blocked on a dangling target_mechanisms target, which named a nonexistent node, and on a whole-file YAML reformat of 593 added lines; both were fixed in the second push, which retargeted the real node and reduced the diff to a pure 40-line addition with block scalars intact. The second pass left one blocking item, a missing history record, which this record supplies. PR shepherd also trimmed two non-blocking overclaims flagged in that review: the treatment description no longer asserts improved cardiac function independent of diabetes status, and the target_mechanisms description no longer asserts reduced cardiac remodeling and improved ventricular function, since the cited review supports neither. Both now state only what the quoted snippet supports, namely symptomatic management of cardiac complications selected by left ventricular function and drug tolerability. Left open for the author: the target_mechanisms link still carries no evidence of its own, and the quoted hazard ratios derive from mixed ATTRv and ATTRwt cohorts, which sits awkwardly with this entry's ATTRwt-excluding scope note.

  summary: 'Review round 3: connect cardiac phenotypes, rebind polyvalvular term,
    cite Xu 2023 allelic series'
  details: |
    Third review round on PR #10595. Three blocking findings and several
    non-blocking ones.

    Pathograph connectivity. The previous round added tricuspid, aortic,
    polyvalvular and hearing-loss phenotypes without giving them incoming causal
    edges, so five of twelve phenotypes sat outside the graph. Disturbed Cardiac
    Morphogenesis now carries downstream edges to the three valve phenotypes plus
    the polyvalvular one, all INDIRECT_UNKNOWN_INTERMEDIATES since no source traces
    the route from TAB2 dosage to a specific leaflet. The node was also unbound, and
    is now grounded on GO:0003179 heart valve morphogenesis with modifier ABNORMAL.

    Hearing impairment was decided explicitly rather than connected. PMID:34741306
    groups hearing loss with myopia as an additional feature and does not place it
    under the connective tissue cluster; nothing examines TAB2 in the cochlea. It
    keeps no incoming edge, the reason is stated in its description, and a
    KNOWLEDGE_GAP discussion (tab2_hearing_loss_mechanism) records the gap.

    Term rebinding. Polyvalvular involvement was bound to HP:0031653 Abnormal heart
    valve physiology, a functional term, while its snippet describes structural
    valve defects. Rebound to HP:0001654 Abnormal heart valve morphology, with
    preferred_term polyvalvular disease so the specificity the ontology term lacks
    is not lost.

    Xu 2023 (DOI:10.1093/hmg/ddac252) was cached in the PR, uncited, and
    contradicted the entry on two points. It is now cited four times. First, the
    entry modelled TAB2 disease as loss-of-function only; Xu's screen of 47 variants
    reports gain-of-function alleles with distinct phenotypes, so the TAB2
    Haploinsufficiency node's description now scopes its LOSS_OF_FUNCTION category
    to the deletion and truncating class and cites Xu for the bound. Second, the
    Impaired TAK1 Complex Signaling node's sole grounding was GO:0007249 canonical
    NF-kappaB signal transduction, which is precisely the readout Xu found does not
    discriminate pathogenic from benign variants; the node now also carries
    GO:0051403 stress-activated MAPK cascade for the AP-1 arm that does, and its
    description says which is which. A KNOWLEDGE_GAP discussion
    (tab2_allelic_series_lof_and_gof) records that the pathograph has one molecular
    entry point and cannot represent a gain-of-function allele, and that partial-LOF
    patients mostly lack congenital heart disease.

    Non-blocking fixes. Two PMID:34990405 evidence items quoting background
    statements rather than experimental results were regraded IN_VITRO to OTHER.
    Facial dysmorphism was banded VERY_FREQUENT from the delineating cohort's 80%;
    the pooled rate is 59% (23/39), so the band is now FREQUENT with both figures
    cited and the cohort-specific one labelled as such - the same correction already
    applied to the mitral valve phenotype. Heart failure management gained
    therapeutic_modality SMALL_MOLECULE, with a note explaining that
    therapeutic_agent is left empty because no source cited by this entry names a
    drug. Longitudinal cardiac surveillance gained therapeutic_modality OTHER, and
    its note now says why DEVICE would be wrong (that value is defined as a
    therapeutic device; the echocardiogram treats nothing).

    Not changed. The duplicate case-variant caches DOI_10.1172_JCI152297.md and
    DOI_10.1172_jci152297.md are both kept: the deep-research report cites the DOI in
    both casings, so removing either would leave one of its own citations unbacked.
    The duplication is upstream in the report, not hand-introduced.

    Validation: just validate passes with 36/40 snippets verified against the cache;
    the four skipped by prefix are the new DOI:10.1093/hmg/ddac252 items, each
    confirmed by hand to be an exact substring of
    references_cache/DOI_10.1093_hmg_ddac252.md. check-entity-refs,
    check-causal-targets, check-duplicate-keys, check-enum-values,
    check-qualifier-terms, check-folded-hyphens, check-environmental-evidence and
    the four ratcheted checks against origin/main all pass.

    Note on this record: it was first committed with the scaffold's unfilled placeholder token as its details
    body. The scaffolding script nests details under events:, and the script used to
    fill it matched only a top-level key, so it silently wrote nothing. Filled in
    place before merge.

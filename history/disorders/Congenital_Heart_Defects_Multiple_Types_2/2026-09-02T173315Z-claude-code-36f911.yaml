  summary: 'Create: Congenital Heart Defects, Multiple Types, 2 (TAB2)'
  details: |
    Created the entry for TAB2 haploinsufficiency. Deep research was run with falcon; the report resolved 7/7 references but cited only DOIs, so each was converted to a PMID and cited as a PMID. My initial draft asserted that lesions cluster on the left side of the heart (bicuspid aortic valve, aortic stenosis, coarctation); the cohort literature does not support that emphasis and it was removed. The delineating cohorts instead report mitral valve disease and cardiomyopathy as the leading cardiac features, with short stature, hypermobility and Noonan-like facies in about three quarters of patients. Sources: Thienpont et al. 2010 (PMID:20493459) for the critical region, the translocation and the zebrafish dosage experiment; Cheng et al. 2017 (PMID:28464518) for cardiomyopathy without CHD and the longitudinal screening recommendation; Engwerda et al. 2021 (PMID:34456334) and Roberts et al. 2022 (PMID:34741306) for the syndromic phenotype; and Guo et al. 2022 (PMID:34990405) for the RIPK1 mechanism and its genetic rescue. The pathograph branches deliberately at the TAK1 node into a developmental morphogenesis arm and a myocardial survival arm, because the source states TAB2 can act as a TAK1 activator or suppressor by context; that branch is what explains cardiomyopathy arising in a structurally normal heart. Two animal models are linked with modeled_mechanisms: the cardiomyocyte-specific Tab2 knockout mouse (RECAPITULATES the cell-death node and RESCUES the cardiomyopathy via Ripk1-K45A) and the zebrafish tab2 morphant (RECAPITULATES the morphogenesis node), each with limitations recording that the mouse is a homozygous adult conditional knockout rather than constitutional haploinsufficiency and that the two-chambered zebrafish heart cannot model mitral valve disease. A CONTROVERSY discussion records that the MONDO/OMIM name calls this non-syndromic CHD while both large cohorts conclude it is syndromic and one proposes the name TAB2-related syndrome. The longitudinal cardiac surveillance treatment is deliberately left unbound: NCIT:C61256 Monitoring is not reachable from NCIT:C25218 and NCIT:C15406 Cancer Screening names the wrong concept, so per the ontology term contract the meaning is carried in preferred_term with the reason recorded in notes. Validated with just validate (23/23 snippets verified, term validation passed), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values and check-qualifier-terms.

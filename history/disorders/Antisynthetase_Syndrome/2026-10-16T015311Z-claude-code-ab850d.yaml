  summary: 'Address #14439 review: swap Jo-1 code to method-less'
  details: |
    Reviewer on #14439 noted LOINC:5234-0 carries a method suffix ('by Immunoassay'), which is a step narrower than the identity-level binding the LOINC Diagnostics project convention asks for. Swapped both occurrences (the Anti-Jo-1 biochemical record's loinc_term and the Anti-Aminoacyl-tRNA Synthetase Antibody Testing diagnosis row's measurements entry) to LOINC:8076-2, confirmed via the Monarch KG entity API to be 'Jo-1 extractable nuclear Ab [Presence] in Serum' with no method qualifier. Updated the diagnosis-row notes line's CURIE reference to match. The reviewer also asked to confirm the PL-7/PL-12 code ordering in the unbound-bundle note (33772-5 PL-7, 33771-7 PL-12) was correct; no change was needed there, since the coordinator had already independently verified it.

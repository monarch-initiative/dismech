  summary: 'LOINC: bind anti-Jo-1 and anti-Ro52 antibody codes'
  details: |
    Bound LOINC:5234-0 (Jo-1 extractable nuclear Ab [Presence] in Serum by Immunoassay) to both the Anti-Jo-1 biochemical record and the Anti-Aminoacyl-tRNA Synthetase Antibody Testing diagnosis row's new measurements slot, and LOINC:53016-2 (Sjogrens syndrome-A extractable nuclear 52kD Ab [Presence] in Serum) to the Anti-Ro52 biochemical record, as part of dismech LOINC Diagnostics tranche C (autoantibodies). Left the Anti-PL-7/Anti-PL-12 (and other non-Jo-1 anti-ARS) biochemical record's loinc_term unbound: searched the Monarch KG for 'aminoacyl-tRNA synthetase panel' and 'myositis panel' (both zero results) and confirmed individual PL-7/PL-12 codes exist (LOINC:33772-5, LOINC:33771-7) plus a joint PL-7+PL-12 immunofluorescence cytoplasmic-pattern code (LOINC:54161-5), but nothing spanning the five antibodies (PL-7, PL-12, EJ, OJ, KS) the row names jointly, so no panel code was available to bind. A diagnosis-row notes line records that LOINC:5234-0 covers only the Jo-1 arm, not the non-Jo-1 antibodies the cornerstone testing also screens for. One non-resolving CURIE offered by an earlier web search ('LOINC:107564-7', claimed to be a myositis-specific antibody panel order code) was checked by direct entity lookup during research and found to be a 404; it was never bound. All bound labels were verified against the Monarch KG entity API in the same step they were written. Confirmed both bound CURIEs absent from origin/main's cache/loinc/terms.csv and from every other open loinc-*-batch* branch's committed cache before seeding.

  summary: Publication-readiness review through 2026-08-05
  details: |
    Full publication-readiness review through 2026-08-05. Audited definition, mechanism, clinical spectrum and natural history, epidemiology, diagnosis and differentials, management, trials, experimental models, limitations, ontology mappings, evidence polarity and atomicity, verbatim snippets, and causal graph coherence. Added recent primary and authoritative evidence, a Jo-1 immunization mouse model, current trial records with registry-status caveats, and open knowledge gaps; corrected overly causal language and the pulmonary arterial hypertension conflation. D2P audit disposition: accepted the specific Mechanic hands term HP:6001013, retained Dysphagia after adding direct cohort evidence, and connected all 13 local phenotypes. Did not add source antibody-positivity phenotypes because serology and exact autoantigen mappings are represented in biochemical/genetic sections; rejected anti-cN1A as likely inclusion-body-myositis source conflation. Did not add broad Myositis or Arthralgia because local Inflammatory Myositis and Inflammatory Arthritis already cover the supported concepts, or Autoimmunity because it is definitional. Did not add Abnormality of voice, Aortic regurgitation, Chest pain, Cough, Edema, EMG abnormality, Hikers feet, Hypotonia, Joint dislocation, Keratoconjunctivitis sicca, Lack of skin elasticity, Myocarditis, Neoplasm, Pruritus, Pulmonary arterial hypertension, Recurrent respiratory infections, Respiratory insufficiency, Skin rash, Telangiectasia, or Xerostomia: the D2P feed supplied no evidence references and the reviewed disease-specific literature did not justify separate publication claims. Pulmonary hypertension secondary to ILD is retained without HP:0002092 because the CLASS cohort distinguished it from pulmonary arterial hypertension. No dataset claim was added because no publication-ready disease dataset was established. Remaining uncertainties are explicit rather than filled speculatively.

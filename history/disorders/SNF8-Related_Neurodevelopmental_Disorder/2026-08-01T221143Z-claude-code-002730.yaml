  summary: 'Review response: fix allele-specific causal edge, add EGFR negative result,
    cell types, classifications, IMPC mouse'
  details: |
    Response to the PR #7785 review (REQUEST_CHANGES; no CRITICAL, 7 IMPORTANT). All seven IMPORTANT items were worked; four of five SUGGESTIONS were worked and two were declined with reasons.

    (1) Pathograph correction. The edge from "Loss of the ESCRT-II Complex" to "Stability-Independent Impairment by the p.Val102Ile Hypomorph" was self-contradictory: it made the stability-independent node a consequence of complex loss, when that node exists precisely because complex abundance is PRESERVED in mild-pole fibroblasts (D1, E1). The edge was moved to "Bi-allelic Hypomorphic SNF8 Variants" as a parallel allele-specific arm, and the sibling edge to "Loss of the ESCRT-II Complex" was rewritten to say explicitly that it is the severe-pole, abundance-dependent arm.

    (2) EGFR negative result added, plus an explicit retraction. The earlier PR comment claimed the preserved-EGFR-degradation finding "lives in a notes: block". It did not - `grep -in egfr kb/disorders/SNF8-Related_Neurodevelopmental_Disorder.yaml` returned no match on 2026-08-01. That claim was wrong and is retracted in the PR comment rather than quietly fixed. The finding is now a notes: block on the "Failure of ESCRT-III Nucleation and Multivesicular Body Biogenesis" node, framed as the key constraint against a "global ESCRT collapse" model. It is a note, not an evidence item: `grep -in "egfr\|autolysosom\|LAMP1\|LC3\|autopsy\|morpholino" references_cache/PMID_38423010.md` returns nothing, so no verbatim snippet exists for it. The note also records that the study does not report which pole the EGFR-assayed fibroblasts came from.

    (3) Zebrafish model type disclosed. genotype changed from "snf8 loss of function" to "snf8 antisense morpholino knockdown (morphant; no stable mutant line reported)"; category changed from "Genetic" to "Transient loss-of-function knockdown model". The description now states the transient-knockdown status, the off-target/p53 caveat, the WT-mRNA co-injection rescue that partially mitigates it, the reduced penetrance among morphants, and what the model does not address (seizures, corpus callosum, leukoencephalopathy, intellectual disability).

    (4) classifications: harrisons_chapter NEUROLOGIC added, with a rationale note (the optic neuropathy is an anterior-visual-pathway CNS lesion, not an ophthalmological disease of the globe; no systemic involvement at either pole) and a verbatim-verified evidence item from PMID:38423010.

    (5) evidence_source on the generic ESCRT-background snippet ("The endosomal sorting complex required for transport (ESCRT) machinery is essential for membrane remodeling and autophagy") changed from HUMAN_CLINICAL to OTHER; the explanation now says why - it is the paper's introductory statement of general cell biology and reports no human observation.

    (6) mechanism_confidence on "Impaired Autophagic Flux" raised from HYPOTHETICAL to PROVISIONAL, with a notes: block recording why: the full text carries fibroblast transmission electron microscopy (autolysosome accumulation, aberrant enlarged electron-lucent lysosomes), LC3/LAMP1 confocal, and strong LC3 immunostaining on autopsy neuropathology. Not raised further because none of those assays is quotable from the cached abstract and no autophagic-flux measurement is reported resolved by pole. GO:0044754 autolysosome added as a cellular_component.

    (7) cell_types added for the first time, with provenance and its limits stated. fibroblast (CL:0000057) on the ESCRT-II-loss, MVB and autophagy nodes - the actual experimental cell type, and mild-pole fibroblasts were among those studied. pyramidal neuron (CL:0000598), astrocyte (CL:0000127) and microglial cell (CL:0000129) on the autophagy node, with an explicit note that the autopsy was of individual A2 (p.Tyr167Ter/p.Gly191Asp), a SEVERE-pole case belonging to DEE115/MONDO:0968946 and not to this MONDO term, so they are recorded as the spectrum's neuropathological substrate rather than as a NEDOA finding. retinal ganglion cell (CL:0000740) on the optic-nerve node, explicitly flagged as an anatomical inference since no retina was examined. Oligodendrocyte was considered and rejected: it rests only on severe-pole "marked loss of myelin", one inferential step further. All five CL ids verified with `runoak -i sqlite:obo:cl info` on 2026-08-01.

    Suggestions worked. GO:0006623 (protein targeting to vacuole, yeast-flavored) replaced with GO:0043328 (protein transport to vacuole involved in ubiquitin-dependent protein catabolic process via the multivesicular body sorting pathway), verified with OAK. IMPC mouse knockout added as a second animal_models entry - verified independently, not taken from the research report: a live query to https://www.ebi.ac.uk/mi/impc/solr/genotype-phenotype/select?q=marker_symbol:Snf8 on 2026-08-01 returned exactly three records (homozygote preweaning lethality complete penetrance, Outcome, p=0.0; heterozygote abnormal tail movements, p=4.17e-5; heterozygote increased lactate dehydrogenase, p=2.57e-5), matching the report. No evidence item attached, since IMPC is not a snippet-validated source here; the API URL and retrieval date are the provenance. The MGI accession was deliberately not asserted (the research pass warned its own first lookup landed on Cyb5b). A HUMAN_MODEL_MISMATCH discussion was added covering the morpholino-vs-mouse-vs-human divergence, with three proposed experiments (p.Val102Ile knock-in mouse, stable germline zebrafish mutant, patient iPSC neurons and retinal organoids).

    Suggestions declined, with reasons. No histopathology: section: the only neuropathology in the literature is the autopsy of A2, a severe-pole DEE115 case, so populating it here would attribute severe-pole findings to the mild-pole entity - exactly the error this entry was rewritten to correct. No progression: section: the mild pole's course is characterised only as progressive visual acuity loss with optic atrophy declared at 4-7 years, which is already recorded in the phenotype notes; a phase-structured progression record would need a natural-history source that does not exist for a 4-patient, one-publication disorder. The node-name-splitting nit on "Failure of ESCRT-III Nucleation and Multivesicular Body Biogenesis" was also declined - the two clauses name one physical step (ESCRT-II hands off to ESCRT-III and that is how ILVs form), so splitting would create an edge with no independent evidence.

    Validation: just validate, just validate-terms, just validate-references (31/31 snippets verified), scripts/check_snippets_verbatim.py (31/31 verbatim), scripts/check_folded_hyphens.py --check, just validate-history-all - all pass. pytest tests/test_data.py has the one known pre-existing SETD5_Haploinsufficiency_Syndrome failure (#7729), unrelated to this branch and not touched.

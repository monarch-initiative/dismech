  summary: 'Create: neurodevelopmental disorder plus optic atrophy'
  details: |
    Created kb/disorders/SNF8-Related_Neurodevelopmental_Disorder.yaml for MONDO:0968947 (neurodevelopmental disorder plus optic atrophy, OMIM:620784), the mild end of the bi-allelic SNF8 (HGNC:17028, ESCRT-II subunit) disease spectrum. NEC preflight: MONDO:0968947 verified with OAK (RO:0004003 -> HGNC:17028 SNF8; subClassOf MONDO:0100500), and the contrast entity MONDO:0968946 (developmental and epileptic encephalopathy 115, OMIM:620783) was verified with the same OAK query rather than typed from memory - runoak relationships --direction down HGNC:17028 returns exactly those two disease terms. HGNC:17028 confirmed via the HGNC REST API (symbol SNF8; aliases EAP30, VPS22, Dot3), which is what licenses citing the VPS22-named structural literature. Evidence: PMID:38423010 is the sole clinical publication; PMID:18539118 and PMID:15469844 supply ESCRT-II structure and the ESCRT-II to ESCRT-III hand-off. All three fetched with just fetch-reference. Frequency bands deliberately omitted everywhere: per-feature counts exist only in the HPO annotation file for OMIM:620784 (largest denominator 4), and HPOA's cohort split contradicts the abstract, so the fractions are recorded in per-phenotype notes with retrieval date instead of being banded. Onset left unbound because HPOA splits childhood (2/4) and juvenile (2/4) across the HPO age boundary. HPOA's HP:0000006 autosomal-dominant annotation is judged an error and not propagated; HP:0000007 asserted per the paper's bi-allelic language and both MedGen definitions. Validated with just validate, validate-terms, validate-references, scripts/check_snippets_verbatim.py (29/29 verbatim on both checkers), and check_folded_hyphens.py.

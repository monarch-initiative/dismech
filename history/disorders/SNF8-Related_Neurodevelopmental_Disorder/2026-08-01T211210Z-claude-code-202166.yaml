  summary: 'Create: neurodevelopmental disorder plus optic atrophy'
  details: |
    Created kb/disorders/SNF8-Related_Neurodevelopmental_Disorder.yaml for MONDO:0968947 (neurodevelopmental disorder plus optic atrophy, OMIM:620784), the mild end of the bi-allelic SNF8 (HGNC:17028, ESCRT-II subunit) disease spectrum. NEC preflight: MONDO:0968947 verified with OAK (RO:0004003 -> HGNC:17028 SNF8; subClassOf MONDO:0100500), and the contrast entity MONDO:0968946 (developmental and epileptic encephalopathy 115, OMIM:620783) was verified with the same OAK query rather than typed from memory - runoak relationships --direction down HGNC:17028 returns exactly those two disease terms. HGNC:17028 confirmed via the HGNC REST API (symbol SNF8; aliases EAP30, VPS22, Dot3), which is what licenses citing the VPS22-named structural literature. Evidence: PMID:38423010 is the sole clinical publication; PMID:18539118 and PMID:15469844 supply ESCRT-II structure and the ESCRT-II to ESCRT-III hand-off. All three fetched with just fetch-reference. Frequency bands deliberately omitted everywhere: per-feature counts exist only in the HPO annotation file for OMIM:620784 (largest denominator 4), and HPOA's cohort split contradicts the abstract, so the fractions are recorded in per-phenotype notes with retrieval date instead of being banded. Onset left unbound because HPOA splits childhood (2/4) and juvenile (2/4) across the HPO age boundary. HPOA's HP:0000006 autosomal-dominant annotation is judged an error and not propagated; HP:0000007 asserted per the paper's bi-allelic language and both MedGen definitions. Deep research (just research-disorder claude_code, 5 web searches / 83 turns / 24 citations) was run and the NEC gate applied before use: SNF8 named 103 times, next-most-frequent symbols are its own ESCRT-II partners VPS25/VPS36 (12 each) and its own aliases VPS22/EAP30, and the only disease IDs asserted are the two SNF8 MONDO/OMIM pairs. Hits read in context, not counted blind. The report changed the entry materially in four ways rather than merely confirming it. (1) It retracted a wrong claim in the first draft: the apparent HPOA-vs-abstract cohort conflict is reconcilable - the cohort is 5 severe (including a 25-week termination, which is why the abstract says four had DEE) plus 4 mild, so HPOA's NEDOA denominator of 4 is correct. The note now records the reconciliation, and frequency remains omitted purely on cohort-size grounds. (2) It corrected the central mechanism: the abstract's 'loss of ESCRT-II subunits' holds for the severe pole, but in the mild-pole fibroblasts SNF8 was not significantly reduced and VPS36/VPS25 were preserved, so that evidence item is downgraded to PARTIAL and a separate PROVISIONAL 'Stability-Independent Impairment by the p.Val102Ile Hypomorph' node now carries the NEDOA mechanism. (3) It corrected ataxia: 1/4, congenital, and in the one individual who had NO optic atrophy - the two named features were mutually exclusive in this cohort. (4) It added incomplete penetrance (an apparently healthy gnomAD p.Val102Ile homozygote) and the ClinVar conflict on that allele (Munich/OMIM Pathogenic vs Ambry VUS), plus HP:0007663 reduced visual acuity, PMID:15329733, and two KNOWLEDGE_GAP discussions. gnomAD constraint metrics and DepMap essentiality are deliberately NOT asserted because the research pass could not reach those sources and warned against filling them from memory. Validated with just validate, validate-terms, validate-references, scripts/check_snippets_verbatim.py (30/30 verbatim on both checkers), check_folded_hyphens.py, validate-history-all, and pytest tests/test_data.py (14770 passed; the single SETD5_Haploinsufficiency_Syndrome failure is the known pre-existing issue #7729 and is unrelated).

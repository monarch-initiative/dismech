  summary: 'Review: BBSome-related retinitis pigmentosa'
  details: |
    Rebuilt the mechanism-anchored entry around the five supported loci ARL6, TTC8, BBS1, BBS2, and BBS9 while keeping broader Bardet-Biedl and non-BBSome ciliopathy evidence out of the isolated-RP association layer. Added broader-scope ClinGen context with explicit caveats, allele-specific evidence, four linked mechanistic stages, nine connected phenotypes, natural history, molecular and ophthalmic diagnosis, differentials, supportive management, the current AXV-101 BBS1 study, five animal models, two human iPSC resources, two GEO datasets, and three interpretation discussions. Reconciled all 83 evidence items to 19 exact cached sources generated through the repository fetch workflow. Validation: schema and ontology terms pass; all 83 whitespace-normalized snippets and titles exactly match their caches; top-level references equal the evidence-reference set; causal graph integrity passes; 9/9 phenotypes and 5/5 causal genes are wired; global and weighted compliance are 100%; CX2 and KGX in-memory exports succeed; folded-hyphen and scoped hooks pass.

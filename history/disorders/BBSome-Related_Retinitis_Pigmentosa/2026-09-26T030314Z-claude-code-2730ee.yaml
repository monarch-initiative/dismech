  summary: 'Genetics pass: fix over-broad MONDO anchor, add per-locus subtypes'
  details: |
    Genetics pass for the genetics-gap campaign (issue #12217, series-010). The
    entry was already fully gene-wired - all five genes bound to HGNC and reaching
    the pathograph through a genes: descriptor on the BBSome-dysfunction node - so
    the work was the anchor and the per-locus structure.

    disease_term was bound to MONDO:0019200 retinitis pigmentosa, which asserted
    that a five-gene BBSome mechanistic class is identical to the whole retinitis
    pigmentosa class. The OLS4 hierarchicalChildren endpoint returns 102 direct
    children for that class (read 2026-09-25); all 25 diseases the d2g gap list
    attributed to this parent are among them, and none of their MONDO-recorded
    causal genes is a BBSome or ARL6 gene. The binding is now free text with no
    term:, and MONDO:0019200 is recorded as skos:broadMatch, following the
    ANK2_Related_Complex_Neurodevelopmental_Disorder precedent and dismech#12184's
    remedy. The exactMatch identity claim on that class is held by the
    Retinitis Pigmentosa grouping, so broadMatch also removes a duplicate claim.

    Searches run before dropping the binding, recorded in the mapping
    justification: synonym-inclusive MONDO search for BBSome, nonsyndromic
    retinitis pigmentosa, non-syndromic retinitis pigmentosa and isolated
    retinitis pigmentosa, through runoak and cross-checked against the OLS4
    entity-search API. No MONDO class denotes the mechanistic lump.

    Added has_subtypes with one row per locus. RP55, RP51 and RP74 bind
    MONDO:0013312, MONDO:0013274 and MONDO:0014692, each verified against OLS4 as a
    direct child of MONDO:0019200 with a gene-series definition naming ARL6, TTC8
    and BBS2 respectively; these three were moved off the relatedMatch mappings they
    previously occupied. BBS1 and BBS9 have no isolated-RP MONDO class - the
    searches are recorded in their subtype descriptions - so they carry free-text
    subtype terms. Each row carries the gene, autosomal recessive inheritance, and
    the human evidence for the locus. The five genetic: records now carry reciprocal
    subtype foreign keys; subtype-usage-audit reports 5/5 referenced and 5
    WIRED_DIRECT.

    ARL6 previously had only zebrafish functional evidence, while the entry's own
    notes claimed each locus association was supported by its own human report.
    Added PMID:19956407, the Saudi Arabia RP cohort whose abstract conclusion states
    that BBS3 mutations can rarely present as nonsyndromic RP, as the human
    gene-disease evidence item. Added a second BBS1 item from PMID:42022048, already
    cited elsewhere in the entry, quantifying the isolated-retinopathy share of a
    molecularly confirmed biallelic BBS1 cohort.

    All 25 gap-list diseases are declined structurally as distinct gene-defined RP
    entities belonging to their own entries; the reconciliation is in the PR body.
    All 25 checklist symbol/CURIE pairs were verified against live HGNC and none is
    wrong or out of date.

    Also corrected one clause in kb/groupings/Retinitis_Pigmentosa.yaml, whose
    MONDO consistency note named this entry's primary term as a carrier of descent
    from MONDO:0019200; it now names the three new RP-numbered subtype bindings
    instead.

    Validation under linkml-reference-validator 0.3.0rc1: validate, validate-terms,
    validate-disorders, and the offline gates all pass; 110/110 snippets verified
    against the committed reference cache.

  summary: 'Genetics pass part 2: decline 21 non-BBSome RP classes, verify series
    completeness'
  details: |
    Part 2 genetics-gap pass (d2g series-011, issue 12218) over the 21 diseases the
    gap list attributes to this parent. All 21 are declined structurally: each is a
    gene-defined retinitis pigmentosa entity whose MONDO causal gene is not a BBSome
    core subunit and not the BBSome-recruiting GTPase, so none is a subtype of this
    five-locus mechanistic class.

    The 21 rows are disjoint from the 25 dispositioned in the part 1 pass (issue
    12217), so this is a separate set rather than a repeat. What they share is the
    cause: every one of the 21 is a direct child of MONDO:0019200, the class this
    entry bound as disease_term until that anchor was replaced by a broadMatch.

    Verification performed. All 21 MONDO terms were confirmed as direct children of
    MONDO:0019200 through the OLS4 hierarchicalParents endpoint, and each one's
    RO:0004003 axiom gene was read from the OLS4 v2 class endpoint and agrees with
    the gene the gap list records. All 21 HGNC symbol and identifier pairs were read
    live from rest.genenames.org: every pair is correct and current, and none of the
    21 current approved symbols is a rename of another gene on the list.

    Series completeness. Rather than treating the 21 listed rows as the unit of work,
    all 102 direct children of MONDO:0019200 were enumerated and each one's
    definition and RO:0004003 axiom read. Retinitis pigmentosa 51, 55 and 74 are the
    only children naming a BBSome core subunit or the recruiting GTPase, and all
    three are already carried as subtype_term bindings. Twenty-three children carry
    no causal-gene axiom, so an axiom-only scan is not sufficient; their definitions
    were read individually, which is how retinitis pigmentosa 51 and 55 are
    identifiable as TTC8 and ARL6 entities at all. Eight children carry neither an
    axiom gene nor a definition, so MONDO records no causal gene for them; none of
    the eight is on this issue's list. Independently, an OLS4 MONDO entity search for
    each remaining BBSome core subunit and dedicated operator returns only a
    gene-related ciliopathy class and a numbered Bardet-Biedl syndrome class, with no
    retinitis pigmentosa class among them. That completeness result is the one fact
    this pass added to the entry, in the mapping justification on the MONDO:0019200
    broad match.

    Measurements, all clean, so no wiring or connectivity work applied. The subtype
    usage audit reports 5 subtypes, 5 of 5 referenced by a subtype foreign key, and 5
    WIRED_DIRECT. The disconnected-phenotype report gives 9 of 9 phenotype nodes
    causally connected. The gene identity check compared 15 of 15 HGNC bindings
    against HGNC with no binding naming a different gene and none uncached.

    MONDO assessment. No defect found. One candidate was tested and dismissed:
    retinitis pigmentosa 47 (this issue) and retinitis pigmentosa 96 (the part 1
    issue) are both direct children of MONDO:0019200 and both assert SAG, which looks
    like a duplicate pair, but they carry different OMIM entries, so MONDO is
    mirroring two distinct source concepts. Retinitis pigmentosa 32 defines itself by
    the chromosome region 1p21.3-p13.3 while its axiom asserts CLCC1, which HGNC
    places at 1p13.3, inside that region; the two statements agree.

    No stub was created for any of the 21. Their home is a separate entry each, but
    several are already covered by an existing dismech entry for the same gene, and
    stubbing only the rows this checklist happened to name would queue a minority of
    a 99-member series.

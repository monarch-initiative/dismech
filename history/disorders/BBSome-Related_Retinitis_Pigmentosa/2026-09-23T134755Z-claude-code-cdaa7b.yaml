  details: |
    Structured NAM linkage for dismech#802. Added modeled_mechanisms (target, relationship, fidelity, model_scale, limitations, PMID-quoted evidence and readouts) so the model reaches the pathograph instead of sitting as a disconnected list entry. Validated with just validate, just count-verified-snippets and just validate-terms; evidence snippets are exact quotes from the cached abstracts. Linked the bbs3-knockdown rescue zebrafish (retina-selective node), bbs1-null zebrafish (outer-segment cargo/lipid node and, partially, the rod-first degeneration node), Bbs1 M390R mouse (degeneration node, with the TUDCA arm as a RESTORED readout), Bbs8 knockout mouse (PERTURBS the BBSome-loss node, with a BOUNDARY_OMISSION divergence because the pathograph has no RPE node) and bbs2 zebrafish (partial recapitulation of cone loss). The two patient iPSC lines carry a notes line explaining that an undifferentiated line with no retinal readout has no mechanism claim to link.

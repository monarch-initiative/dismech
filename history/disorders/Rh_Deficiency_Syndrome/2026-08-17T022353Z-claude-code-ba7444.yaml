  summary: Connect the orphaned stomatocytosis phenotype to the deformability node
  details: |
    Self-caught before review, from a parse of every entry in this batch after the same defect was flagged as a blocker on the pigment dispersion PR. Stomatocytosis was a phenotype with no incoming edge, so the morphological finding that is the diagnostic clue in this disease sat outside the pathograph while the node describing exactly that morphology, Reduced Erythrocyte Deformability and Stomatocytic Morphology, pointed only onward to destruction. Edge added, DIRECT. The edge description records why the two are separate at all: shape and deformability are two faces of one membrane defect but are observed by different means, microscopy and rheology, so keeping them distinct preserves what a blood film actually tells you. Only the two initiating nodes now lack an incoming edge, which is correct. Validated: just validate passed; count-verified-snippets 26/26; pytest -k Rh_Deficiency 16 passed; folded-hyphen gate OK.

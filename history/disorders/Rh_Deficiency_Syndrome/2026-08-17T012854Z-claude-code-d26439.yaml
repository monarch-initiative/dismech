  summary: 'Address review: split bundled node, add diagnosis and GO grounding'
  details: |
    Three IMPORTANT findings addressed. First and best: the Biallelic Loss of the Rh Complex Genes node bundled two distinct events, and the reviewer's phrasing is exactly right that converging rather than parallel still means two nodes sharing a downstream target. Split into RHAG Loss of Function (Regulator Type), a failure of complex assembly, and Silent RH Haplotype (Amorph Type), a failure of polypeptide production, each with its own evidence and each pointing at the shared complex node. The graph now has two initiating nodes without incoming edges, which is the correct shape for two independent routes, and the RhAG-knockdown experimental model's limitations now name the amorph node explicitly as the route it does not reproduce, so the regulator-only scope attaches precisely instead of being implied. Added a diagnosis section: Rh serology as the hallmark, using the disease-specific line already sitting unused in a cache file this PR adds, plus molecular testing distinguishing the two routes. Added GO grounding, which the entry entirely lacked despite being a membrane-transport disease: ammonium channel activity as LOSS_OF_FUNCTION on the RHAG node and ammonium transmembrane transport as DECREASED on the complex node, supported by the model paper's naming of gas transport function among the lost properties. Note that GO:0015696, suggested by the Falcon report and repeated in the review, does not resolve; the correct terms are GO:0072488 and GO:0008519, verified against the ontology. That is now the fifth wrong ontology identifier caught in this Falcon batch. Took two suggestions: experimental_model_type OTHER to PRIMARY_CELL_CULTURE, an exact schema fit for an ex vivo primary erythroid culture; and a notes sentence acknowledging that MONDO classifies this disease under hereditary stomatocytosis, so a future curator does not read the overhydrated-stomatocytosis exclusion as contradicting the ontology. Validated: just validate passed; count-verified-snippets 24/24 (was 20/20); pytest -k Rh_Deficiency 16 passed; hyphen gate OK; all targets resolve and graph reachability verified.

  summary: Fix two invented reference titles and anchor the RHAG node on a quote that
    names RHAG
  details: |
    Two IMPORTANT findings from the second review, both mine, and the first is the more embarrassing because this entry's own notes are about catching exactly this class of silent metadata error.

    Two reference_title values did not match the cached PubMed titles: PMID:1503086 read hematologic/serologic where the record says hematological/serological, and PMID:23417980 ended 'and beyond' where the record ends 'and erythroid membrane disorders'. Both were title strings that do not exist anywhere. Neither misleads about which paper is cited, which is precisely why nothing caught them: no validator reads reference_title. The fix was not to retype them but to regenerate every title in the file from the cache and diff, which found these two and confirmed the rest. That is the only safe way to touch this field, and typing one from memory is how both of these happened.

    Second finding: the RHAG Loss of Function node carried one evidence item whose snippet establishes the regulator type but never names RHAG or Rh50, so a node asserting biallelic RHAG loss of function rested on a quote that does not mention the gene. Added the sentence from the same paper reporting Rh50 frameshifts, nucleotide mutations and amplification failure correlating with the Rhnull phenotype, and the PMID:9716608 sentence assigning the amorph and regulator types to the RH30 and RH50 loci. The second also un-orphans references_cache/PMID_9716608.md, which this PR was adding for a citation that no longer existed after the node split.

    Suggestions taken: diagnosis_term NCIT:C210738 Blood Typing Test on the serology entry, confirmed reachable from NCIT:C25218; the mid-sentence gas-transport fragment extended to the full sentence and regraded PARTIAL, with the explanation now stating plainly that the source measures gas transport while the annotation is ammonium transport and that RhAG carrying both makes the two consistent rather than equivalent; and the over-long limitations line rewrapped.

    Validated: just validate passed; count-verified-snippets 26/26 (was 24/24); pytest -k Rh_Deficiency 16 passed; folded-hyphen and title-snippet gates OK.

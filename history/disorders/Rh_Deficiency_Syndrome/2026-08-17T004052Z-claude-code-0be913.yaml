  summary: 'Create: Rh Deficiency Syndrome (MONDO:0019107)'
  details: |
    New entry from an Edison Falcon deep-research report. Four pathophysiology nodes: biallelic loss of the Rh complex genes by two distinct routes, absent or severely reduced Rh membrane complex, reduced deformability with stomatocytic morphology, and premature erythrocyte destruction. Conforms to hemolytic_anemia_erythrocyte_destruction at two nodes. The two genetic routes are modelled as converging rather than parallel: the regulator type loses RHAG, which is required to assemble and traffic the complex, so Rh antigens vanish while the RH genes are intact; the amorph type loses the polypeptides directly through a silent RHCE in cis with a deleted RHD. Failure of assembly and failure of production, indistinguishable at the erythrocyte. Added an experimental_models entry for the lentiviral RhAG-knockdown ex vivo erythroid model, which converts an inference from patient genetics into a demonstration: RhAG extinction alone is sufficient to explain the loss of associated surface proteins seen on native Rh-null cells. Its limitations field records that the model addresses the regulator type only and cannot measure red cell lifespan. Two scope distinctions curated deliberately because the literature blurs them: this is NOT RhD-negative blood type, where one antigen is absent and the cell is normal, and it is NOT RHAG gain-of-function overhydrated hereditary stomatocytosis, which is dominant and the same gene in the opposite direction. Frequencies deliberately omitted throughout: the source report states that population rates should be marked unavailable rather than inferred, and phenotype bands from a handful of reported families would manufacture precision. Several phenotypes are curated PARTIAL for the same reason, where the cited source establishes the chronic haemolysis that produces a sign without documenting the sign itself. THREE identifier errors caught during curation, none of which snippet validation would detect: Falcon gave RHAG as HGNC:9881, which does not resolve (correct is hgnc:10006, verified against the ontology; its RHD and RHCE ids were right); I wrote NCIT:C15356 for Blood Transfusion, which is actually Whipple Procedure (correct is NCIT:C15192); and a placeholder one-word snippet survived into the first validation run and was replaced with the sentence stating the amorph-type haplotype architecture. Validated: just validate passed; count-verified-snippets 20/20; title audit 20 citations 0 mismatches; check_folded_hyphens and check-title-snippets OK; pytest -k Rh_Deficiency 16 passed.

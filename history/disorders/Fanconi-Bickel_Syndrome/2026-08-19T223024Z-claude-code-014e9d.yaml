  summary: 'Edit: wire Fanconi-Bickel Syndrome to defective_skeletal_mineralization'
  details: |
    Added one conforms_to declaration; no content changed. The 'Impaired Renal Proximal Tubular Glucose Transport' node now conforms to defective_skeletal_mineralization#Phosphopenic Substrate Deficiency. Note the node bundles the generalized Fanconi-type tubulopathy rather than isolating phosphate: it names glucosuria, aminoaciduria, phosphaturia and bicarbonaturia together, and has Rickets and Growth Failure downstream. The phosphaturia arm is what the conformance asserts. The entry has no separate mineralization-failure node, so only the trigger is wired; adding one would be a curation decision beyond this pass. Part of item 2 of #8995.

  summary: 'Create: Fanconi-Bickel Syndrome'
  details: |
    Created new disorder entry for Fanconi-Bickel Syndrome (SLC2A2/GLUT2 deficiency; MONDO:0009216; OMIM:227810; ORPHA:2088), part of metabolic WP-009. Verified MONDO mapping and OMIM/ORPHA xrefs via OAK. Confirmed hgnc:11006 for SLC2A2 via OAK. No GeneReviews article exists for this disease (PubMed esearch for title-restricted Fanconi-Bickel Syndrome plus GeneReviews returned zero hits), so proceeded directly to primary literature. Curated pathophysiology chain: SLC2A2 loss-of-function variants leading to loss of GLUT2 transporter function, then three parallel downstream branches: impaired hepatocyte glucose transport leading to hepatic glycogen accumulation/hepatomegaly and fasting hypoglycemia/postprandial hyperglycemia; impaired renal proximal tubular glucose transport leading to renal Fanconi syndrome then rickets/growth failure; and dysregulated beta-cell/intestinal glucose handling. Phenotypes curated with HPO terms verified via OAK, including Hepatomegaly, Increased hepatic glycogen content, Fasting hypoglycemia, Postprandial hyperglycemia, Renal Fanconi syndrome, Glycosuria, Generalized aminoaciduria, Hypophosphatemia, Rickets, Short stature, Doll-like facies, Hypertriglyceridemia, and Galactose intolerance; frequency values mapped from quantitative percentages reported in a large Palestinian FBS cohort, PMID 39548873. Cell types (hepatocyte, epithelial cell of proximal tubule) and GO biological processes/molecular functions all verified via OAK before use. Treatments curated: dietary management with frequent feeding and uncooked cornstarch; phosphate, alkali, and alfacalcidol supplementation; and empagliflozin SGLT2 inhibitor repurposing, with target_mechanisms linking back to the renal tubulopathy node, sourced from PMID 38802119, the first empagliflozin case series in FBS. Prevalence modeled with structured Prevalence slots rather than free-text percentage. Fetched and cached four PMIDs via fetch-reference: 9354798 Santer et al 1997 Nat Genet gene-discovery paper; 9809815 Santer et al 1998 Eur J Pediatr natural-history and literature-review paper covering the original 1949 patient and 82 published cases; 39548873 Hodrob et al 2025 Clin Genet large Palestinian cohort with quantitative phenotype frequencies; 38802119 Overduin et al 2024 J Inherit Metab Dis empagliflozin repurposing case series. Also rebuilt the Orphanet structured-source cache for ORPHA 2088 to confirm the MONDO OMIM ORPHA cross-reference mapping. All evidence snippets are exact quoted substrings of the cached abstracts and records. Validation results: schema validation, term validation, and reference validation all passed with no errors or warnings.

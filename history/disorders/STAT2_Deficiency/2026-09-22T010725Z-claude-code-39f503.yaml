  summary: 'Review: connect STAT2''s four detached phenotypes (IUIS Table 6)'
  details: |
    All four phenotypes were detached from a two-node chain ending at Permissiveness to Viral Replication. All four now attach there.

    The entry carries two viral-infection phenotypes that look redundant - Severe and recurrent viral infections (HP:0031691) and Recurrent viral infections (HP:0004429). They are kept separate and the edges say why: severity and recurrence are different claims, carried by different HPO terms and different sources. The recurrence edge notes that the defect is cell-intrinsic and permanent, so each exposure meets the same absent response rather than immunity built by the last one.

    HLH is drawn as INDIRECT_UNKNOWN_INTERMEDIATES from the viral replication node: uncontrolled viral antigen load is the usual trigger, but the intermediates are not established in STAT2 deficiency and the reports are single cases.

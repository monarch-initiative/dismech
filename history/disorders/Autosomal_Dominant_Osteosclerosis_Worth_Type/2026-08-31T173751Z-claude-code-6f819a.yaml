  summary: Fold the dental sequela into the torus phenotype instead of binding a term
    that re-describes the torus
  details: |
    Cleared the one non-blocking suggestion left on the approving review of PR #10228
    (review 5068588567 / comment 5481619322).

    The Dental phenotype added in the previous round bound HP:0000174 "Abnormal
    palate morphology", which re-describes the torus already modelled as its own
    phenotype rather than the dental sequela the source describes. The reviewer noted
    HP:0000689 and HP:0006480 exist but that the source says a torus *can* cause
    these problems rather than reporting them in a patient, and suggested folding the
    sentence into the existing Torus palatinus entry.

    Done: the separate Dental phenotype was removed, and the sentence "Torus
    palatinus can lead to loss of teeth or malocclusion." now sits on the Torus
    palatinus phenotype with directness: INDIRECT, because it states a general
    consequence of tori rather than an observation in a patient with this disorder.
    The reason for not binding a dental term is recorded in the explanation.

    Net effect: one fewer phenotype, one fewer ontology binding that pointed at the
    wrong concept, and the information retained with its epistemic status visible.

    Validation unchanged at 54/54 snippets verified; all offline gates pass.

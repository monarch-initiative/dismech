  summary: 'Address PR review: unbind the contradictory forehead term, re-evidence
    surveillance, cite non-fragility, add M282V and phenotype edges'
  details: |
    Addressed the automated review on PR #10228 (review 5068588567, 2 IMPORTANT and
    5 non-blocking suggestions). Both blocking items fixed; all five suggestions
    taken.

    IMPORTANT 1 - the "Facial changes" phenotype bound HP:0011220 "Prominent
    forehead" while the entry's own description and its progression quote both say
    the forehead FLATTENS. A direct internal contradiction, and the binding asserted
    the opposite of the cited evidence. Resolved by the reviewer's second option:
    the phenotype was renamed "Progressive coarse facial change" and left with NO
    term binding, per the dismech-terms rule that no term beats a bad one. The
    description now records the disagreement explicitly (the case report cited here
    describes flattening; other summaries describe prominence) and two further
    evidence items were added that describe what the sources agree on -- the coarse,
    progressive quality and the mandibular/palatal components.

    The reviewer's first option -- cite Orphanet and keep HP:0011220 -- was
    attempted and is not currently available: `just refresh-orphadata` fails its
    pinned sha256 gate for en_product1.xml (got df8d562a..., expected fb2fbe8c...),
    so no new ORPHA record can be cached. That is issue #9687 and six open
    duplicates; not re-filed. The checksum gate was NOT bypassed.

    IMPORTANT 2 - the "Surveillance without intervention" treatment was evidenced by
    a diagnostic conclusion rather than a management statement. Replaced with the
    on-point sentence from PMID:40585686, "In our case, we opted to continue
    observation with routine dental, audiology, and ophthalmology follow-up", which
    also names the three modalities; the description now names them too. The
    radiographic-stability quote from PMID:22065804 was kept as a second item, and
    the non-fragility quote added as a third, since "dense but not fragile" is the
    other half of the case for not intervening.

    SUGGESTION 3 - the non-fragility claim, asserted three times and load-bearing
    for the osteopetrosis differential, was uncited. Now cited to PMID:40585686:
    "however, these skeletal changes do not seem to lead to an increased risk of
    fracture", added both to the osteopetrosis differential and to the surveillance
    treatment.

    SUGGESTION 4 - added a Dental phenotype for tooth loss/malocclusion secondary to
    torus palatinus, bound to the HP:0000174 palate-morphology parent with the
    reason stated, and with no frequency because the source gives none.

    SUGGESTION 5 - added p.Met282Val to the allelic series with its own variant
    entry, recording that it arose de novo (so an absent family history does not
    argue against the diagnosis) and that the panel returned it as of uncertain
    significance.

    SUGGESTION 6 - the pathograph now closes into the phenotypes. Endosteal
    Hyperostosis and Cortical Thickening gains downstream edges to Mandibular
    hyperostosis, Increased bone mineral density, Thickened calvaria and Diaphyseal
    sclerosis; Cranial Foramina and Posterior Fossa Encroachment gains edges to
    Neurological involvement, Hearing impairment, Anosmia, Facial palsy, Chiari type
    I malformation and (indirectly, via raised intracranial pressure) Headache.

    SUGGESTION 7 - added a top-level references: block covering all eleven PMIDs.

    One error caught by the gates during this round: the p.Met282Val VUS snippet was
    initially a two-word fragment ("Met282Val-uncertain significance)."), which
    check-snippet-length rejected as non-propositional. Replaced with the full
    sentence, which carries the allele, the de novo status and the classification
    together.

    Validation after fixes: `just validate` passes schema, term and reference checks
    with 54/54 snippets verified (up from 46/46). check-entity-refs,
    check-duplicate-keys, check-folded-hyphens, check-snippet-length,
    check-title-snippets and check-snippet-grading all pass.

  summary: Review Worth-type osteosclerosis using recovered full texts and molecular
    evidence
  details: |
    Substantive review of the complete Worth-type osteosclerosis entry and five existing CREATE/EDIT records, preserving MONDO:0007764 and distinguishing historical clinical labels from molecularly confirmed LRP5 high bone mass. This Mendelian disorder is included in the review queue excluding infectious and environmental diseases/poisonings. Read the genuine Perplexity report and its citation artifact; its numerous ontology mistakes and scientific overstatements were not transferred. The HBM rival-gene preflight warning is the high-bone-mass acronym, not evidence of a different causal gene.

    Cached full-text use: recovered and read all main text of PMID:22065804 and PMID:30028190, which reveal that the stable mandibular case and two incidental dental cases were presumptive diagnoses without genetic/family confirmation. The six-year stable case retained alternative diagnoses; it cannot establish benign or nonprogressive LRP5 disease. One dental patient actually had an anterior open bite and underwent orthognathic surgery with normal healing, so an observed dental phenotype and bounded outcome are now represented. Read the full 2025 M282V report (PMID:40585686), including the panel VUS status, reported de novo occurrence without parental methods, normal teeth/gums and eye examination, chosen surveillance and untested drug suggestions. Do not adopt its incorrect distinction between dominant and heterozygous disease.

    Also used the complete clinical/mechanistic source review performed in the immediately preceding LRP5 ADO1 review: PMID:37659026 historical review and A242T case, PMID:36971833 variant families and phenotype table, PMID:16251418 T253I stimulation/culture, PMID:25808845 homozygous inhibitor-challenge mice, PMID:24927689 measured serum antagonists/RANKL/OPG, and PMID:42113468 conditional Wls experiments. Older genetics, receptor and surgical sources remain bounded to available abstracts after attempted full-text refreshes. All caches were generated through repository fetchers; no reference-cache text was hand-authored.

    Corrections: replace universal missense-only, unrestrained-feedback, normal-resorption and benign-course claims with variant- and assay-specific statements. Add the insertion class and explicitly untested cytoplasmic association. Separate cranial nerve passage narrowing from reduced intracranial space. The 155 historical cases include 64 genetically tested people, and reported feature percentages have distinct denominators. Remove single-case frequency inventions and the inappropriate transfer of the entire neurologic aggregate to cranial nerve compression; use phenotype-specific literature fractions where available. Normal serum resorption markers do not exclude osteoclast involvement. Preserve M282V as a reported VUS, not a functionally established activating allele.

    Research-completeness assessment: phenotypes adequate after adding bone pain, visual impairment, trigeminal neuralgia, papilledema, raised pressure and the documented unconfirmed-case open bite. Existing craniofacial terms are retained without inventing a forehead direction. Subtypes/differentials adequate, adding the clinically similar LRP6 disorder and replacing a Van-Buchem-only quote that did not support sclerosteosis. Mechanisms adequate after incorporating conditional Wnt-secretion perturbation, human mineralization/histology and allele-dependent resorption. Treatments adequate with bounded surveillance, mandibular/orthognathic outcomes, decompression durability and hearing rehabilitation. Hypothetical DMPA, porcupine/DKK1 and steroid suggestions remain a knowledge gap, not therapies with demonstrated LRP5 benefit; no disease-specific interventional trial was surfaced. Genetics adequate after variant-class and VUS corrections. Biomarkers/diagnostics adequate: DXA can be normal in a reported cortical-overgrowth family, and serum Wnt antagonists/RANKL/OPG have actually been measured, contrary to the research report. References adequate: newly recovered full text materially changes interpretation, with primary observations separated from background/synthesis. No disease-specific GeneReviews chapter was found. Overall central themes are consumed; general gene-editing and untested modifier proposals remain non-blocking research concepts.

    Model fidelity: inhibitor-challenge mice carried two mutant Lrp5 alleles, not the usual heterozygous human genotype. Residual architectural/inhibitor responses and unmeasured cranial morbidity are explicit. The Wls compound model tests a perturbed ligand environment with resorption/localization confounders; it does not establish a universal ligand-independent mechanism. Initial validation: schema, ontology and all 104 exact cached quotations pass, 18/18 phenotype nodes and 1/1 causal genes are connected, and entity/causal targets, boundaries, source-defect claims, coarse bindings, delivery and knowledge-gap checks pass. Text gates and independent review are recorded in the PR.

  details: |
    Created kb/disorders/Autosomal_Dominant_Osteosclerosis_Worth_Type.yaml
    (MONDO:0007764, LRP5).

    Deep research: Perplexity (sonar-deep-research) ->
    research/Autosomal_Dominant_Osteosclerosis_Worth_Type-deep-research-perplexity.md.
    Inline validation set `term_validation.needs_review: true`: 5 unresolved CURIEs
    (HP:0000937, HP:0000596, HP:0001628, UBERON:0008938, UBERON:0009821) and 5
    mislabelled ones, including UBERON:0002240 offered as "cranial vault" when UBERON
    calls it "spinal cord", UBERON:0004473 as "mandible" when it is "musculature of
    face", and NCIT:C15194 as "Maxillofacial surgery" when it is "Bone Marrow
    Transplantation". None was bound; every term here was resolved independently
    against the committed caches or the OLS API.

    `reference_validation` reported 7/7 resolved, confabulation_rate 0.0, on_topic 6.
    As with the other Perplexity reports in this run, the block carries no
    `needs_review` key and no per-reference list, so the one reference that was not
    judged on topic cannot be identified from the report. The citation list is mostly
    URLs (OMIM, Orphanet, Wikipedia, VarSome, glycosmos, MedGen) with 5 PubMed/PMC
    links; all evidence in this entry was sourced independently from PubMed.

    References used: PMID:198847 (Gorlin & Glass 1977, the radiographic delineation
    that separated this entity from Van Buchem disease), PMID:12015390 (Boyden 2002
    NEJM, G171V with defective DKK1 inhibition and the formation/resorption marker
    dissociation), PMID:12579474 (Van Wesenbeeck 2003, the first-propeller allelic
    series across four historically separate diagnoses), PMID:25808845 (Lrp5 HBM
    knock-in mice resistant to SOST and DKK1 in vivo), PMID:37659026 (2023 historical
    review, 155 patients, the percentages used for frequency bands), PMID:36971833,
    PMID:29709743 (Chiari I with surgical treatment and 5-year recurrence),
    PMID:40585686, PMID:36907844, PMID:30028190, PMID:22065804.

    No GeneReviews chapter exists for Worth-type osteosclerosis / LRP5 high bone mass;
    a PubMed search for "LRP5 high bone mass GeneReviews[All Fields]" returned nothing.

    Curation decisions worth recording. The Wnt node uses `modifier: GAIN_OF_FUNCTION`
    rather than INCREASED, per the CLAUDE.md rule: the pathway is running outside its
    normal regulatory constraints (the receptor is deaf to its inhibitors), which is a
    qualitative change, not a quantitative one. `functional_impact_category:
    GAIN_OF_FUNCTION` is recorded separately on the pathophysiology node's
    genetic_context, since that describes the variant rather than the pathway state.
    An open KNOWLEDGE_GAP records that the 2023 review's 155-patient count pools
    pre-2002 clinically diagnosed cases with post-2002 genetically confirmed ones, so
    the percentages derived from it are less precise than their decimal places
    suggest; the entry's notes repeat that warning.

    PMID:41813941 (romosozumab in LRP5/LRP6/WNT1 variant carriers) was deliberately
    NOT cited: it studies loss-of-function/risk alleles causing bone loss, the
    opposite direction to this disease, and citing it as a treatment here would have
    inverted the mechanism.

    Validation: `just validate` passes schema, term and reference checks with 46/46
    snippets verified. check-entity-refs, check-duplicate-keys, check-folded-hyphens,
    check-snippet-length, check-title-snippets and check-snippet-grading all pass.

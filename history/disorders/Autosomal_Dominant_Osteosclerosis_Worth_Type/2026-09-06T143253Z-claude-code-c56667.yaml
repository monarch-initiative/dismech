  summary: 'Fix: drop phenotypes# prefix from 10 causal targets'
  details: |
    The merge queue dequeued this PR with CI_FAILURE. check-causal-targets
    reported ten findings, all in this entry, and the failure was real.

    pathophysiology[].downstream[].target takes a BARE NAME, matched verbatim
    against another item's name with no resolution step. All ten edges added in
    review round 2 were written as 'phenotypes#<Name>', copying the form used by
    attaches_to -- which is the entity-reference grammar, correct there and wrong
    here. The two conventions sit four lines apart in this same file, and
    attaches_to legitimately keeps disease# and genetic#.

    What the prefixed form actually did is worse than a missing edge. Per
    check_causal_targets.py's own docstring, build_causal_graph appends the edge
    unconditionally, so the edge count never moves; the unresolved target lands in
    orphan_targets and the renderer draws a PHANTOM DUPLICATE NODE -- red, dashed,
    labelled with the literal string 'phenotypes#Diaphyseal sclerosis' -- while the
    real phenotype node drops out of the graph. So the ten edges the reviewer asked
    for, to close the pathograph, were fragmenting it instead.

    Provenance of the error, recorded because it generalises: the reviewer wrote
    the suggestion with that syntax verbatim, and I implemented what was written
    without checking the two slots were the same kind of reference. A reviewer's
    suggested code is not pre-validated. This is the second instance in this run of
    implementing a suggestion without re-reading what it pointed at; the first was
    the IL2RB evidence_source regrade on PMID:31068380.

    Why no gate caught it on this branch: LinkML validation, term validation,
    snippet verification and check-entity-refs all pass on a prefixed causal
    target -- check-entity-refs parses that exact grammar and accepts it.
    check-causal-targets is the only check that catches it, and it landed on main
    (#10112) after this branch was cut, so it first fired inside the merge queue.

    Fix is mechanical, as the check says: drop the prefix. All ten names were
    verified to resolve to a real phenotypes[].name before stripping, rather than
    assumed. The 'prefixed' finding class is explicitly never grandfathered, so
    editing the baseline was not an option and would have been wrong anyway. The
    other four entries in this curation run were checked for the same defect: zero
    prefixed causal targets in any of them.

    This record is late. It was declined at the time on the ground that pushing it
    would reset an approval and eject the PR from the merge queue, buying a full
    review cycle for an advisory check -- the reasoning is in the b2be6fce5 commit
    message and in a PR comment. That cost has since disappeared: the PR was
    dequeued by a genuine merge conflict, the approval is already gone, and the
    entry needs a fresh review regardless. So the record is being written now that
    it costs nothing, which is what the reviewer asked for and what the convention
    requires for a commit that edits kb/.

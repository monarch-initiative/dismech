  summary: Add UK Biobank NMR metabolome biomarkers (XL-VLDL-PL%, S-HDL-FC%) from
    PMID:40973818
  details: |
    Added two research biomarker entries. XL-VLDL-PL% (phospholipids to total lipids in very large VLDL) is recorded as the metabolite with the largest risk-increasing Mendelian randomization estimate for familial hypercholesterolaemia (OR 5.03, 95% CI 3.97-6.38); S-HDL-FC% is recorded as the strongest inverse estimate (OR 0.35, 95% CI 0.30-0.40), so the lipoprotein axis is not curated one-sidedly. Neither entry carries a `presence` value: the reported quantity is a genetically instrumented effect estimate in a population cohort, not an observed patient-versus-control level. The context fields state explicitly that the estimate must not be read as this metabolite causing monogenic FH -- LDLR, APOB and PCSK9 defects impair receptor-mediated clearance of all apoB-containing lipoproteins, so genetic instruments for VLDL composition and for the FH diagnosis share the same lipoprotein-handling genes. One readout links XL-VLDL-PL% to the existing `Reduced Hepatic LDL Clearance` node with relationship CORRELATES_WITH, and its interpretation is labelled as a curatorial mapping rather than a claim made by the source. No ontology terms were added: NCIT has no biomarker term for an NMR lipoprotein-composition ratio, and `biomarker_term` is optional.

    Source: PMID:40973818, You J et al., 'Mapping the plasma metabolome to human health and disease in 274,241 adults', Nat Metab 2025. UK Biobank cohort, Nightingale Health NMR panel of 313 plasma measures, median 14.9 years of follow-up, with bidirectional Mendelian randomization and a machine-learning metabolic risk score (MetRS) built from the top 30 measures. All snippets were taken from the cached full text and verified as exact ASCII substrings before commit; spans containing the article's thin spaces, en dashes and unicode minus signs were deliberately avoided because no existing kb/disorders snippet uses non-ASCII characters.

    Validation run over all six edited files: `just validate` (schema, pass); `just count-verified-snippets` (446/517 verified against cached references, 71 skipped by prefix, 0 failures); the five ungated CI gates -- check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence and check-duplicate-keys -- all pass; and `just validate-disorders` over all six files (schema + terms + references batched, exit 0; the 12 reported issues are pre-existing WARN-level unfetchable EGA and Metabolomics Workbench dataset accessions, not errors, and are untouched by this change).

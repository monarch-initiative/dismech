  summary: Bind the defining measurement and its guideline thresholds as LOINC measurements
  details: |
    Added loinc_term LP15491-1 (Cholesterol.in LDL) to the LDL-C biochemical marker and a new diagnosis row bound to NCIT:C105588 with the same Part as its measurement. Four reference ranges on LOINC:22748-8 in mmol/L: the DLCN LDL-C categories 4-5, 5-6.5, 6.5-8.5 and 8.5 and above, from a 2015 cohort that applied them (PMID:26073227; the points per category are not in the abstract); the EAS Consensus Panel 2015 paediatric thresholds 4 and 5 mmol/L and the 3.5 mmol/L cut-off for a child of a genetically diagnosed parent (PMID:26009596, full text); and the Simon Broome paediatric threshold of 4 mmol/L for children under 10 as restated by the same consensus. The adult Simon Broome criterion and the National Lipid Association screening thresholds were not recorded because no cached text carries them; the records read are named in the range notes.

  summary: Link modifiable risk factors to the vascular outcome, not the lipid nodes
  details: |
    Backfill for issue #8085. The substantive call here is where these exposures act. This entry models the lipid pathway from LDLR defect through elevated circulating LDL, and separately an atherosclerosis cascade ending in premature atherosclerotic cardiovascular disease. Only high saturated fat diet acts on the lipid arm: it is EXACERBATES/DIRECT into elevated circulating LDL cholesterol, additive to the inherited clearance defect. Smoking, diabetes mellitus and hypertension do not raise LDL, so all three are EXACERBATES into the premature cardiovascular disease node instead, carrying relative risks of 1.67, 2.19 and 1.36 respectively in this population. Physical inactivity and obesity target the same outcome node but as PREDISPOSES rather than EXACERBATES, because they appear in management guidance as circumstances to avoid rather than as quantified risks. Not linked: alcohol consumption, whose cited evidence describes light to moderate intake without establishing a direction of effect; social determinants of health, whose evidence concerns screening programme recommendations rather than a mechanism; and occupational factors, which carries no evidence. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 113 of 160 with 47 pre-existing DOI-prefix skips; integrity issue count unchanged.

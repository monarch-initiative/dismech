  details: |
    Phenotype-completeness pass against HPO/Orphanet HoFH annotations. Added three cardiovascular phenotypes, each wired into an existing pathophysiology node with a new causal edge so the all-phenotypes-explained property is preserved: Supravalvular Aortic Stenosis (HP:0004381; HoFH subtype; from the Aortic Valve Lipid Deposition and Calcification node; PMID 35776569), Aortic Atherosclerosis (HP:0012397; from the Atherosclerotic Plaque Development node; PMID 24404629), and Sudden Cardiac Death (HP:0001645; from the Premature Atherosclerotic Cardiovascular Disease node; PMID 23956253). All snippets verified as whitespace-normalized exact substrings of cached abstracts. A fourth candidate from the review, arthralgia/Achilles tendinitis (HP:0002829), was intentionally omitted: available literature documents Achilles tendon xanthoma inflammation, not joint pain, so no verifiable arthralgia snippet was available and fabricating one would violate evidence discipline. Schema, term, and reference validation pass; 17 phenotypes, none orphaned in the pathograph.

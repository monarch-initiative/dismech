  summary: Add Arthralgia (HP:0002829) phenotype with primary-source evidence + pathograph
    edge
  details: |
    Followup to the phenotype-completeness pass. The earlier arthralgia/Achilles-tendinitis candidate was traced to an Orphanet HoFH annotation (HP:0002829 Arthralgia, Occasional); the Achilles-tendinitis framing had been an unsourced gloss. Now added Arthralgia (HP:0002829) on defensible primary evidence: Mathon et al., Articular manifestations of familial hypercholesterolaemia, Ann Rheum Dis 1985 (PMID:4037885), a cohort of 73 heterozygous FH patients reporting Achilles pain, Achilles tendinitis, and oligo/polyarticular arthritis, snippet 'The affected joints may also be the sites of inflammation and pain.' verified as an exact substring of the cached abstract. Wired from the Tendon and Cutaneous Cholesterol Deposition node via an INDIRECT_KNOWN_INTERMEDIATES edge (periarticular/tendon cholesterol deposition and inflammation). Frequency omitted (no defensible per-arthralgia band). The redundant HP:0100261 Abnormal tendon morphology annotation was intentionally not added (already covered by Tendon Xanthomas). 18 phenotypes, none orphaned; schema/term/reference validation pass.

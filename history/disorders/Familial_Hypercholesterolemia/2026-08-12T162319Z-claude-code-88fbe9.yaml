  summary: Link alcohol to the lipid node and social determinants to the outcome
  details: |
    Backfill for issue #8085. Alcohol consumption joins the six lifestyle exposures this entry already links, pointed at the circulating LDL node they share, and graded PARTIAL because its evidence places alcohol within a composite healthy-lifestyle score rather than isolating its effect; the exposure's own description is careful that the effect is dose-dependent and that moderate intake has not been shown to worsen outcomes. Social determinants of health is an unusual link for this backfill and the description states why it is drawn as it is. That exposure does not act on lipid biology at all: it acts on whether a diagnosis is made and whether treatment is accessible, and reaches the disease through undertreatment. It therefore targets the premature cardiovascular disease endpoint rather than any mechanism node, and its intermediates are recorded as known, the intervening step being the lipid lowering that does not happen. It is graded PARTIAL because the cited consensus statement documents access barriers and makes recommendations rather than measuring an outcome disparity. The occupational factors exposure was deliberately not linked; it carries no evidence items, and its own notes state that no direct evidence links specific occupational factors to outcomes in this disease. The alcohol link was REMOVED on review. Its snippet verified as an exact quote but was a methods-section definition of one component of a healthy-lifestyle score, treating light-to-moderate alcohol as a healthy habit, which is the opposite valence to the EXACERBATES edge it supported; and the same paper reports no evidence of an association between that score and LDL cholesterol, which is the node the link targeted. A downstream consumer following the edge would have found a paper that looked for the association and did not find it, and PARTIAL does not rescue that, since partial support is not contradiction. The link was dropped rather than re-sourced, consistent with how the occupational-factors exposure in this same entry was handled. The social determinants link is unchanged, except that its consensus statement is now tagged OTHER, being recommendations rather than a study. Validated with linkml-validate and just validate-terms.

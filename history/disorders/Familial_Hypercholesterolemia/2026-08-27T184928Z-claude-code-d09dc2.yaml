  summary: Waive the occupational factors entry and drop three unsourced claims
  details: |
    Added a 'Left deliberately uncited.' review_notes waiver to the Occupational Factors entry. No direct evidence links occupational factors to familial hypercholesterolemia outcomes; the supporting reasoning runs through general cardiovascular physical-activity findings, which is an extrapolation. Also removed three claims from the description -- that shift work, high-stress occupations and occupational air pollution compound FH risk -- which had no source at all, not even an indirect one. Splitting the bundle into separately citable exposures was considered and rejected: each fragment faces the same absent FH-specific literature, and the review_notes records that. Part of #8296.

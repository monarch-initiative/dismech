  summary: 'Gene-family review: LDLR, APOB, PCSK9, LDLRAP1, APOE'
  details: |
    Typed the five FH gene records, which carried no relationship_type or variant_origin: LDLR, APOB, PCSK9 and LDLRAP1 as CAUSATIVE germline (each ClinGen Definitive for its FH subtype: FH1, ADH type B, ADH3, FH4), APOE as UNKNOWN germline. The APOE evidence is one recurrent in-frame variant, p.(Leu167del), cosegregating in families and found in 3.1% of variant-negative ADH patients (PMID:27014949) and about 2.5% of FH (PMID:41198423); a 2024 review still calls it a candidate locus (PMID:38640077) and ClinGen has not classified it. Added molecular functions to the gene nodes, which had only processes: LDLR receptor activity decreased; apoB-100 LDL-receptor binding decreased; PCSK9 LDL-receptor binding increased (the disease activity is non-enzymatic, PMID:17608623, PMID:34606887); LDLRAP1 clathrin-cargo adaptor activity decreased (PMID:16179341); APOE receptor binding abnormal. Corrected the APOE node, which said p.(Leu167del) disrupts clearance of apoE-containing lipoproteins: mutant-apoE VLDL is taken up more avidly by hepatocytes and LDLR is transcriptionally down-regulated (PMID:27014949). Removed the unsupported claim that PCSK9 S127R is a French Canadian founder mutation; it was identified in the French families in which the third ADH locus was mapped (PMID:34606887). Added the ARH discovery study (PMID:11326085) to the LDLRAP1 record.

  summary: 'Create: Occupational Asthma'
  details: |
    Created to give the chemical_respiratory_allergy module its first conformer (dismech#16878). Bound to MONDO:0022742. Duplicate preflight run across all three surfaces: no KB entry on origin/main holds MONDO:0022742 (Asthma, Byssinosis and Formaldehyde_Poisoning mention occupational asthma only in snippets or notes, and Byssinosis explicitly distinguishes itself from it), and no open PR or issue curates it. Scope decision: the entry covers both the sensitizer-induced and the irritant-induced stratum, because a patient can have irritant-induced occupational asthma with no sensitization, so an entry named for the whole concept cannot model only the immune route. The two strata have different mechanisms, so pathophysiology nodes are scoped with the subtypes foreign key and conform to two different modules - the four-node sensitizer chain to chemical_respiratory_allergy and the barrier-injury node to inhaled_irritant_airway_injury - converging at a shared consequence node. Isocyanate-induced is a child subtype carrying MONDO:0025556. The irritant-induced row carries no subtype_term: OLS returns only MONDO:0004979 asthma for 'irritant induced asthma'. Work-aggravated asthma is excluded as not caused by work. High molecular weight protein allergens are in scope as a cause but not modelled, since they sensitize without haptenation and so cannot conform to a module whose trigger node requires a reactive chemical. The prevalence record carries no rate_per_100000: the 5 percent figure is a share of adult asthma, not a population rate. check_conformance_content reports 5 links, 4 sharing a GO term with their module node and 1 anchor_no_process at the haptenation node, whose module counterpart binds no GO term by design because GO has no haptenation class. check_genereviews_baseline reports NO_CHAPTER for both collections, verifying the notes claim that no GeneReviews baseline applies. Schema, term and reference validation pass with 12 snippets and 12 titles and zero issues, as do the offline KB gates including cross-file snippet grading. An OpenScientist deep-research run on the disorder and an independent red-team review were in flight when this record was written; whatever they change will be recorded in a second record.

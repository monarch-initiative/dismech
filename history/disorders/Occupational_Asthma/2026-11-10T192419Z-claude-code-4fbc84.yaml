  details: |
    Answers the ai4c-reviewer CHANGES_REQUESTED review on PR 16912.

    Item 1. The notes paragraph on the irritant stratum described repository state that was not true: it claimed no source about irritant-induced asthma itself and a review_notes waiver on the chlorine exposure. Neither held. There is no review_notes in the file, the chlorine row carries PMID:33063819 (the RADS case review naming chlorine its most frequent cause), and the Irritant-induced subtype carries PMID:31690384 for the RADS definition. Rewritten to the asymmetry that is real: one mechanism node against the sensitizer arm's four, one exposure, no stratum-scoped phenotype, treatment or biomarker row, and no human irritant-injury source on the node itself.

    Item 2. Added Cough and Chest tightness phenotype rows, and a persistence evidence item on Airway hyperresponsiveness (PMID:17040933, pooled 73% persistent NSBHR across 39 studies). The research report gave HP:0004760 for chest tightness; that CURIE resolves to obsolete Congenital septal defect. The real term, found by searching HPO in the same step, is HP:0031352 Chest tightness.

    Item 3. Added a diagnosis row for airway inflammation measurement during specific inhalation challenge, and a biochemical section with fractional exhaled nitric oxide and induced sputum eosinophil count, each carrying a READOUT_OF link to the hapten-specific T cell node, which is the node whose description names airway eosinophilia. Both thresholds quoted from PMID:39726396 (n=321 undergoing challenge). Thresholds are quoted rather than recorded as reference_ranges because they are challenge-response cut-offs for a change from baseline, not clinical normal intervals. No LOINC codes bound: this entry has not been through the loinc-seed-cache step. The review also asked for the report's specific-IgE performance figures split by agent class; those figures carry no citation in the report and are absent from both diagnostic sources the report names for that section (PMID:33652998 and PMID:22191204 were fetched and checked), so adopting them would have originated a number. The IgE-absence claim keeps its existing direct quote from PMID:21573916.

    Item 4. Rebuilt the genetic section from two notes-only records to seven HGNC-bound SUSCEPTIBILITY records plus a record stating that susceptibility is partial: HLA-DQB1 (hgnc:4944, with MRO:0000289 HLA-DQ5 serotype in mhc_term), HLA-DRB1 haplotype in isocyanate-induced asthma (hgnc:4948), HLA-DPB1 (hgnc:4940), GSTM1 (hgnc:4632), IL4R (hgnc:6015), CD14 (hgnc:1628), and the existing HMW HLA class II record, which now binds HLA-DRB1 with MRO:0000316 HLA-DR7 serotype because DR7 and DR3 are DRB1 serotypes. Every HGNC CURIE was read from cache/hgnc/terms.csv in the step it was written; both MRO serotypes were resolved through ols:mro. gene_disease_validity remains absent because no external body has classified any of these pairs.

    Item 5. Added Workplace exposure elimination as primary prevention, distinct from the existing Removal from exposure row, which is secondary prevention in an affected worker. Evidence from PMID:22654083 (systematic review of 29 studies) and PMID:21775898 (16-fold decline in new latex sensitization), the latter graded INDIRECT because it measures sensitization rather than asthma.

    Suggestions taken. Wired the two phenotype edges the consequence node's own description asserts, taking causal inlink coverage from 1/6 to 3/8; the four symptom rows were left unwired because they are constituents of the symptom-complex phenotype rather than its causal consequences. Extended the Cochrane snippet to its socioeconomic half and added the pooled 32% symptomatic recovery figure. Added a progression section with a sensitizer-scoped latency phase and a persistence-after-exposure phase (PMID:18394133, median 79 ml/year FEV1 loss after cessation). Added a clause explaining the empty prevalence_class. Recorded the two worked conformers in the inhaled_irritant_airway_injury module description, including why Formaldehyde_Poisoning's process_absent finding is correct rather than mis-anchored.

    Also regraded two PMID:17040933 items from REVIEW_SYNTHESIS to PRIMARY_RESULT: a pooled estimate computed over 39 studies is the review's own work, not a figure it restates.

    Validation: linkml-validate clean on the entry and the module; linkml-term-validator --labels passed on both; 187/187 snippets verified against cached references (was 166/166); check_entity_refs, check_causal_targets, check_duplicate_yaml_keys, check_enum_values, check_logical_rules, check_name_collisions, check_coarse_phenotypes, check_block_scalar_comments, check_delivery_system and whole-KB check_snippet_grading all pass. Nine references were re-fetched because an earlier prune removed them as uncited.

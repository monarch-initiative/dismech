  details: |
    Second pass on the entry created in the preceding record, folding in an independent red-team review and the OpenScientist deep-research run (research/Occupational_Asthma-deep-research-openscientist.md) that were in flight when that record was written. The report had no reference_validation frontmatter, so validation was retro-fitted with validate-references: 41 of 41 citations resolved, 0 unresolved, 0 off topic. Every snippet adopted from it was then cached and exact-substring checked individually. Corrections to false or unevidenced claims. The notes paragraph justifying the work-aggravated asthma exclusion misread PMID:21573916, which in fact groups work-aggravated asthma with occupational asthma as two forms causally related to the workplace and applies 'separate entity' to reactive airways dysfunction syndrome, which this entry includes. Rewritten to cite PMID:26024347, which does define work-exacerbated asthma as made worse but not initially caused by work, and to record that MONDO:0022742's MeSH definition ('caused, triggered, or exacerbated') is broader than this entry, so the entry is deliberately narrower than its bound term. The Hapten-Specific T Cell Memory node asserted Th2 expansion and polarization with only an IgE-absence quote under it; PMID:16271432 and PMID:12419703 added, since conformance is not inheritance and the entry must carry its own evidence. Subtype rescoping. The haptenation chain was scoped to the whole Sensitizer-induced stratum while the entry's own text says high molecular weight protein allergens sensitize without haptenation, so the pathograph asserted haptenation for flour and enzyme workers. Added LMW-chemical and HMW-protein subtype rows under Sensitizer-induced and rescoped the four sensitizer nodes to LMW-chemical, with PMID:31690384 for the hapten versus complete allergen division. Prevalence corrected: the 5 percent figure from a general allergy review is superseded by a 16 percent population attributable fraction pooled across nine longitudinal studies (PMID:33141780). Irritant stratum strengthened: the chlorine exposure's review_notes waiver is replaced by real evidence (PMID:33063819, chlorine most frequently reported in RADS cases), and the RADS definition added (PMID:31690384). Other additions: a genetic section with diisocyanate susceptibility loci including the GSTM1 null genotype that ties host detoxification to the haptenation trigger (PMID:21325943) and HLA-DR7 in the protein-allergen arm (PMID:12704360); a pharmacotherapy treatment row (PMID:15579371); Cochrane and prognosis evidence on removal from exposure (PMID:23407122, PMID:17040933, 73 percent persistent airway hyperresponsiveness); the specific inhalation challenge reference-standard citation (PMID:33652998); the diagnosis row split into spirometry and specific inhalation challenge, the latter with the NCIT searches recorded since no term fits; three cell types bound on the epithelial node where one was bound but three were described; conforms_to declared on the convergence node; synonyms replaced with MONDO's own, since the previous list named this entry's own subtypes and included work-related asthma, which the entry excludes. The truncated acrolein snippet, which dropped its own subject, was fixed in this entry and in the inhaled_irritant_airway_injury module where it originated, and graded INDIRECT here. Recorded as not modelled: the occupational asthma-COPD overlap phenotype, and the mechanism of the protein-allergen arm. Conformance is now 6 links, 5 sharing a GO term with the module node. All gates pass: schema, terms, 37 snippets and 37 titles with zero issues across both files, and the offline KB gates including cross-file snippet grading.

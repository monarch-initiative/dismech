  summary: 'Create: PUM1-Associated Developmental Disability, Ataxia, and Seizure
    Syndrome (PADDAS)'
  details: |
    Created kb/disorders/PUM1-Associated_Developmental_Disability_Ataxia_Seizure_Syndrome.yaml from the stub for MONDO:0958231, and deleted the stub.

    Lump/split: curated as ONE entry scoped to PADDAS, not as a two-subtype PUM1 dosage-spectrum entry. The stub framed the question around whether to lump PADDAS with the milder adult-onset PUM1 phenotype (PRCA), which OMIM and MONDO curated as spinocerebellar ataxia 47 (MONDO:0033482). Checking MONDO:0033482 showed it now carries an OMIM deprecation note: PMID:40191983 (Cuillerier et al., Care4Rare Canada) re-examined Family X from PMID:29474920, found a pathogenic FGF14 GAA expansion segregating with the ataxia and absent from the reportedly non-penetrant relative, and concluded that variants in PUM1 are likely not associated with adult-onset ataxia. There is therefore no second established PUM1 entity to lump with. Reasoning and citations recorded in the entry notes. MONDO:0033482 was confirmed not bound anywhere in kb/ before curation.

    Deep research: requested falcon, which returned HTTP 402 (out of credits); the run fell back to claude_code and the report is named for claude_code. just preflight-dr PASS (PUM1 mentioned 81 times, OMIM 620719 matches). Report frontmatter records needs_review: true - 13/13 references resolved but one quote attributed to PMID:29474920 did not match, and only 7/13 references scored on topic. Term validation clean (34/34 resolved, 9/9 labels matching). The report was used as a lead only; every snippet in the entry was taken from a reference cache file fetched with just fetch-reference and verified by just count-verified-snippets (74/74). The report does not know about the SCA47 deprecation and still describes PRCA as a valid PUM1 phenotype; that section of it was not used.

    Sources: PMID:29474920 (founding cohort, 11 PADDAS probands), PMID:25768905 (Pum1/Atxn1 mouse epistasis), PMID:35386260 (Dravet-like case plus a tabulation of nine PUM1 epilepsy patients), PMID:37070548 (mouse brain interactome, non-linear dosage sensitivity), PMID:40472467 (myoclonic-atonic seizure presentation), PMID:30903679 (microcephaly and hair dysplasia), PMID:40191983 (FGF14 reassignment), ORPHA:589515 (rebuilt into references_cache with --cache-dir references_cache).

    Recorded gaps rather than filling them: no GeneReviews chapter exists (offline Bookshelf index plus a live PubMed genereviews[book] search, both empty); ClinGen has no Gene-Disease Validity assertion for PUM1; no population prevalence or incidence figure exists, so prevalence is CASES_IN_LITERATURE with no rate; PMID:31859446 has no retrievable abstract or full text so it is not cited directly; no surveillance protocol is published, recorded as an open KNOWLEDGE_GAP discussion rather than inferred.

    Validated with: just validate, just validate-terms, just count-verified-snippets (74/74), just check-duplicate-keys, just check-entity-refs, just check-causal-targets, just check-qualifier-terms, just check-enum-values, just check-snippet-length, just check-title-snippets, just check-snippet-grading, just check-folded-hyphens, just check-environmental-evidence, just check-coarse-phenotypes, just check-reference-titles, just check-genereviews --online, just list-gene-term-mismatches, pytest tests/test_data.py for this entry, and just validate-disorders.

  summary: 'Create: TRIM71-associated developmental disorder'
  details: |
    New entry for MONDO:0032862 (OMIM 618667), named for the TADD term proposed in PMID:38833623. Pathograph runs from the TRIM71 NHL-domain missense variant through two alternative hypotheses (loss of binding to normal target mRNAs; gain of binding to new, variant-specific targets) to premature neuroepithelial stem cell differentiation, cortical hypoplasia, and secondary ventricular enlargement of a hypercompliant brain, following the Trim71 R595H knock-in and Nestin-Cre conditional knockout mice. A separate cochlear branch covers the hearing loss reported in PMID:40892928. Validated with count-verified-snippets (47/47), validate-terms, and the offline KB gates.

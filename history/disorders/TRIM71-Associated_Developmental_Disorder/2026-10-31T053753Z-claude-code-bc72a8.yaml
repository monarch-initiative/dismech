  summary: 'Review round 1: TRIM71 entry'
  details: |
    Addressed the first review on PR 16144. Renamed the node 'Hypercompliant Cortex with Secondary Ventricular Enlargement' to 'Hypercompliant Cortex' so ventricular enlargement is only its downstream phenotype, and updated every target. Moved the P0 cortical-volume readout of the R595H knock-in to a new link on 'Cortical Hypoplasia with Reduced Neurogenesis'; the hypercompliance link now carries an AFM compliance readout (INCREASED) and a cilia-driven CSF flow readout (UNCHANGED), both from PMID:35379995. Narrowed white matter hypoplasia to HP:0012429 and cortical neurogenesis to GO:0021895. Added inner ear aplasia (HP:0011372, PMID:40892928), left without an upstream mechanism because inner ear morphogenesis is normal in Trim71 knockout mice. Added the P-body localization defect from PMID:38833623 to the variant node. Ran a claude_code deep-research report; preflight-dr passed (TRIM71 mentioned 29 times, OMIM 618667 matches). Its full-text fetches failed and it added no per-feature frequencies, variant list or shunt-outcome data. Listed all cited references.

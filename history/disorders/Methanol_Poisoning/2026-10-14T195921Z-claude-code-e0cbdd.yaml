  summary: Fix wrong bicarbonate code and over-broad negative claims
  details: |
    Second correction on this entry in PR #14192. The prior fix bound LOINC:2028-9 (Carbon dioxide, total) to the Serum bicarbonate marker on the claim that LOINC has no code literally named Bicarbonate in Serum or Plasma. That claim was false: LOINC:1963-8 (Bicarbonate [Moles/volume] in Serum or Plasma) exists and matches the marker's own name exactly. The cause was distinct from the earlier methanol/formate error: a Monarch KG search for l~Bicarbonate genuinely did not return 1963-8 among its results, because the search endpoint returns ranked, truncated results and absence from a result page is not absence from the set. Confirmed 1963-8 by direct entity lookup (runoak info, the authoritative check) rather than by search. Rebound loinc_term to LOINC:1963-8; recorded LOINC:2028-9 in notes as a true, separate fact (many chemistry panels report this analyte as Carbon dioxide, total rather than under a bicarbonate name) without asserting it is a second binding, since biochemical.loinc_term is single-valued. Also rescoped two over-broad negative claims in this entry's notes to state what a Monarch KG search actually returned rather than a universal claim about LOINC's full code set: the anion-gap marker's notes now say no method-less code appeared among that search's results, not that none exists anywhere in LOINC. LOINC:1963-8 was confirmed absent from origin/main and present on the unmerged origin/loinc-m-batch1 and origin/loinc-m-batch3 branches (tranche M); seeded here too per the same-codes-may-recur-across-tranches rule.

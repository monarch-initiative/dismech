  summary: Conform to toxic_alcohol_adh_bioactivation module
  details: |
    Declared conforms_to against the new toxic_alcohol_adh_bioactivation module on six pathophysiology nodes: Methanol ingestion and absorption (trigger), Alcohol dehydrogenase oxidation to formaldehyde (central effector, the key conformance target), Aldehyde dehydrogenase oxidation to formate and Formate accumulation (both to the shared sequential-oxidation amplifier node), High anion gap metabolic acidosis (effector), and Retinal and optic nerve toxicity (consequence).

    Two nodes conform to one module node on purpose. This entry is the one that separates the second oxidation from the accumulation of its acid product, where ethylene glycol bundles bioactivation into a single node and diethylene glycol splits its two acids differently. The module node deliberately covers oxidation and accumulation together so it conforms to all three; the module notes record why.

    This entry now conforms to two modules at disjoint node sets. The three nodes wired to xenobiotic_oxidative_phosphorylation_blockade (cytochrome c oxidase inhibition by formate, cellular energy failure, basal ganglia injury) are untouched here. The pair is complementary: this module explains how formate comes to exist, the other explains what formate then does to the respiratory chain.

    No content was changed and no evidence was added or regraded; the only edit is the conformance declaration.

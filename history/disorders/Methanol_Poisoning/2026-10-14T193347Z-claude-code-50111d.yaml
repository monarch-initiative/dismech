  summary: Bind LOINC codes to the four existing biochemical markers
  details: |
    Corrects a wrong rejection from this entry's first pass in this batch (PR #14192), which had claimed no LOINC code matches the serum formate marker and that methanol itself has no quantitative code. Both claims were refuted by a single search: LOINC:2292-1 (Formate [Mass/volume] in Serum or Plasma) exists, and the binding target was the entry's own existing Serum formate biochemical marker (no new diagnosis section needed, following the same pattern already used on Ethylene_Glycol_Poisoning's plasma-oxalate marker in the same PR). Added loinc_term to all four of this entry's biochemical markers: Serum formate (LOINC:2292-1), Anion gap (LOINC:33037-3, Anion gap in Serum or Plasma by calculation -- no method-less anion gap code exists in LOINC, confirmed by search, since the gap is inherently a calculated value), Osmolar gap (LOINC:33264-3, Osmol gap of Serum or Plasma), and Serum bicarbonate (LOINC:2028-9, Carbon dioxide, total [Moles/volume] in Serum or Plasma -- LOINC has no code literally named 'Bicarbonate...in Serum or Plasma' for that specimen; the serum/plasma chemistry-panel analyte colloquially called bicarbonate is coded as Carbon dioxide, total). All four codes were verified against the Monarch KG in the step they were written, confirmed absent from origin/main's cache/loinc/terms.csv and from every other open campaign branch (checked via git log --all -p over cache/loinc/terms.csv) before being seeded, and are committed as four new, additive cache rows.

  summary: 'Create: Juvenile Absence Epilepsy (MONDO:0800453)'
  details: |
    De-novo curation of juvenile absence epilepsy, one of the four ILAE idiopathic generalized epilepsy syndromes and previously absent from dismech (the sibling Childhood_Absence_Epilepsy entry existed; JAE did not).

    Deep research: claude_code provider (just research-disorder claude_code Juvenile_Absence_Epilepsy), producing a 112 KB report with 38 unique PMIDs; report and citations sidecar committed under research/. DR output was treated as leads only. Every PMID was independently fetched with just fetch-reference and every snippet verified as an exact substring of the cached abstract; several DR figures explicitly flagged as paraphrase (the ~20 percent absence-status rate, StatPearls-derived academic percentages) were deliberately NOT curated as frequencies.

    Model: a seven-node thalamocortical pathograph running polygenic susceptibility to altered thalamic low-threshold T-type calcium bursting and aberrant reticular-thalamic GABAergic inhibition, converging with a corticothalamic layer-VI drive node on hypersynchronous thalamocortical oscillation, then to generalized spike-wave discharges and the two terminal seizure phenotypes. Both the thalamic and cortical arms are modelled as contributing nodes rather than asserting a single site of ictogenesis.

    Four discussions: (1) CONTROVERSY on thalamic pacemaker versus cortical focus ictogenesis, with evidence on both sides; (2) HUMAN_MODEL_MISMATCH on whether the rodent peri-oral somatosensory cortical focus has any human counterpart in JAE; (3) CONTROVERSY on CACNA1H, retained with relationship_type SUSCEPTIBILITY but carrying the ClinGen-disputed refutation as REFUTE evidence rather than an uncontested legacy association; (4) KNOWLEDGE_GAP on whether the CAE/JAE age-of-onset boundary marks a real mechanistic discontinuity.

    Validation: just validate passes (schema, terms, references) with 42/42 snippets verified against cached references. Compliance 76.2 percent global, 76.4 percent weighted.

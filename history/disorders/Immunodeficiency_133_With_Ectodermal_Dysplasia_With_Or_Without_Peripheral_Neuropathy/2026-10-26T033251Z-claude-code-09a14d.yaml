  summary: 'Create: Immunodeficiency 133 with ectodermal dysplasia with or without
    peripheral neuropathy'
  details: |
    De novo curation of MONDO:0979570 (ITPR3, hgnc:6182) from five primary papers fetched into references_cache: PMID:39560673 (the five-patient defining cohort), PMID:39270020 (the recurrent p.Arg2524Cys dominant-negative variant), PMID:41019080 (EBV-HLH susceptibility), PMID:39804930 (spontaneous canine ITPR3-null model), and PMID:36302985 (cited for the separate recessive entity only). Scope decision: this entry is the autosomal dominant, de novo ITPR3 disease; the compound heterozygous hypomorphic ITPR3 immunodeficiency of PMID:36302985 is a distinct recessive disease and was deliberately not merged. Peripheral neuropathy is bound to HP:0009830 rather than a demyelinating term because one cohort patient had a motor neuronopathy without demyelination; anhidrosis was not asserted because the cited anhidrotic-ectodermal-dysplasia text describes ORAI1/STIM1 rather than ITPR3. Deep research: falcon is the repository default but its host api.platform.edisonscientific.com is denied by this environment's network policy (403 CONNECT at the agent proxy), and the recorded --fallback / --fallback-provider path could not carry the substitution because the Edison client raises its auth failure in the constructor, which is not classed as fallback-worthy. The user selected openscientist, which was then run directly. Validation: just validate, validate-terms and check-genereviews pass; 36/36 evidence snippets verified against the cached references; per-file duplicate-key, block-scalar-comment, enum-value, entity-ref, causal-target, coarse-phenotype, qualifier-term and delivery-system gates pass, as does whole-KB check-snippet-grading. Every CURIE was resolved in OLS in the step it was written. Phenotype causal connectivity is 8/14; the tooth-number, nail, growth and marrow features are left unwired because no mechanism linking IP3R3 to them is established.

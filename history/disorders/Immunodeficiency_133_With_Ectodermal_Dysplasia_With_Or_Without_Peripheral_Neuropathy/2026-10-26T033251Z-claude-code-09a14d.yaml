  summary: 'Create: Immunodeficiency 133 with ectodermal dysplasia with or without
    peripheral neuropathy'
  details: |
    De novo curation of MONDO:0979570 (ITPR3, hgnc:6182) from five primary papers fetched into references_cache: PMID:39560673 (the five-patient defining cohort), PMID:39270020 (the recurrent p.Arg2524Cys dominant-negative variant), PMID:41019080 (EBV-HLH susceptibility), PMID:39804930 (spontaneous canine ITPR3-null model), and PMID:36302985 (cited for the separate recessive entity only). Scope decision: this entry is the autosomal dominant, de novo ITPR3 disease; the compound heterozygous hypomorphic ITPR3 immunodeficiency of PMID:36302985 is a distinct recessive disease and was deliberately not merged. Peripheral neuropathy is bound to HP:0009830 rather than a demyelinating term because one cohort patient had a motor neuronopathy without demyelination; anhidrosis was not asserted because the cited anhidrotic-ectodermal-dysplasia text describes ORAI1/STIM1 rather than ITPR3. Deep research: falcon is the repository default but its host api.platform.edisonscientific.com is denied by this environment's network policy (403 CONNECT at the agent proxy), and the recorded --fallback / --fallback-provider path could not carry the substitution because the Edison client raises its auth failure in the constructor, which is not classed as fallback-worthy. The user selected openscientist, which was then run directly and completed (1043 s, 12 citations, confabulation_rate 0.0, but needs_review: true with 2 of 12 references assessed off-topic and 5 HPO label variants, several of which are frequency words rather than labels). Its aggregated HPO frequency table was deliberately not ingested: the denominators (15/15, 8/9) do not match the five-patient cohort and appear to pool ITPR3 CMT1J patients with IMD133 patients. The report did earn one real correction, which is recorded as a content change rather than only here: an earlier draft of this entry carried a note asserting that anhidrosis is not reported in ITPR3 patients and attributing anhidrotic ectodermal dysplasia to ORAI1/STIM1 alone. That was a false negative-existence claim. PMID:39560673 reports hypohidrosis in ITPR3 patients directly ("thin hair and nails, and hypohidrosis"; "thin hair, sparse eyebrows, frail nails, and hypohidrosis"), so HP:0000966 Hypohidrosis, HP:0002213 Fine hair and HP:0045075 Sparse eyebrow were added and the note rewritten to distinguish reduced from absent sweating. just preflight-dr was not run: it requires the 1.3 GB local MONDO build, which this environment does not hold. The identity facts it checks were instead established directly from MONDO via OLS (the MONDO:0979570 label, the OMIM:621254 xref) and from the stub's RO:0004003 causal gene, and the entry was built from primary papers rather than from the report. Two openscientist runs were launched because the first was wrongly believed to have been killed; both completed and agreed, and the duplicate dated report was deleted, leaving the canonical one that informed this entry. Validation: just validate, validate-terms and check-genereviews pass; 36/36 evidence snippets verified against the cached references; per-file duplicate-key, block-scalar-comment, enum-value, entity-ref, causal-target, coarse-phenotype, qualifier-term and delivery-system gates pass, as does whole-KB check-snippet-grading. Every CURIE was resolved in OLS in the step it was written. Phenotype causal connectivity is 8/14; the tooth-number, nail, growth and marrow features are left unwired because no mechanism linking IP3R3 to them is established.

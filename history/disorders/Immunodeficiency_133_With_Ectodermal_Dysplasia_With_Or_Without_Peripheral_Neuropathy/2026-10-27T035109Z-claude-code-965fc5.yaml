  summary: 'Review round 1: reference titles, missing phenotypes, diagnosis section'
  details: |
    Answers the changes-requested review on PR #15707 and the one failing CI gate, which were the same defect. The gate 'Check every evidence item has a reference title' (scripts/find_missing_reference_titles.py) is new on main and has no baseline; none of this entry's evidence items carried reference_title. Filled with just backfill-reference-titles, which copies each title verbatim from the references_cache frontmatter, so no title was typed from memory: 43 added, and the entry now has 53 evidence items with none missing. Added the phenotypes the review named, each with an OLS-checked term and an exact quote from a cache already in the PR: B-cell lymphoma (HP:0012191, 2 of 5 patients, EBV-driven), autoimmune thrombocytopenia (HP:0001973), lymphoproliferative disorder (HP:0005523), recurrent bacterial infections (HP:0002718), recurrent pneumonia (HP:0006532), verrucae (HP:0200043), unusual molluscum contagiosum (HP:0032163) and global developmental delay (HP:0001263). Wired the EBV-control node to lymphoma and lymphoproliferation as the review asked. Also wired it to the two cutaneous viral phenotypes, on the strength of their complete resolution after transplantation, which attributes them to the T-cell defect rather than to a separate cause. Left unwired, deliberately: thrombocytopenia, bacterial infection, pneumonia and developmental delay, where no mechanism linking IP3R3 to them is established; phenotype causal inlink is 12 of 25. Took the review's suggestions in the same push rather than a later one: frequency on the ectodermal dysplasia and neuropathy rows, a diagnosis section covering the immune workup and the sequencing route, the stronger immunoglobulin-replacement quote in place of a table footnote, and renaming the nerve node from 'Peripheral Nerve Myelin Maintenance Failure' to 'Peripheral Nerve Maintenance Failure' so the node name stops asserting the demyelination its own description declines to assert. Verification: the failing gate reproduced on the pre-fix commit and passes now; just validate, validate-terms and validate-disorders pass; 53/53 snippets verified.

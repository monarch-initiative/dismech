  summary: 'Create: Autosomal Recessive Progressive External Ophthalmoplegia 1 (PEOB1,
    POLG)'
  details: |
    De novo curation of MONDO:0009783 (PEOB1/arPEO, POLG). NEC preflight run against the MONDO record before curation: gene HGNC:9179 POLG, OMIM:258450, and the PEOB1/arPEO synonyms all matched; checked kb/disorders for POLG/ophthalmoplegia/Alpers/mitochondrial near-duplicates and confirmed no existing entry for this MONDO ID. The existing POLG entry, Sensory_Ataxic_Neuropathy_Dysarthria_Ophthalmoparesis, is MONDO:0011835 and is recorded here as a differential diagnosis, as is the autosomal DOMINANT sibling PEOA1. Curated a 10-node mechanism-first pathograph with biological_scale tags and DIRECT causal edges: POLG catalytic/proofreading/processivity deficiency to impaired mtDNA replication to multiple large-scale mtDNA deletions and depletion to clonal expansion above the heteroplasmy threshold to mosaic OXPHOS deficiency, branching into ragged-red/COX-negative fibre pathology, selective extraocular and levator muscle vulnerability leading to ptosis and PEO, mitochondrial myopathy, and the neurological PEO-plus extension, plus a valproate-precipitated hepatic decompensation node. Also curated: 16 HP-bound phenotypes, 4 histopathology findings, one biochemical marker (serum lactate), a POLG genetic block with HGNC binding, autosomal recessive inheritance bound to HP:0000007, four variant records (p.A467T, p.W748S, the A467T/W748S compound-heterozygote genotype, and the F197S/T914P exonuclease-plus-polymerase trans genotype), three structured prevalence records, five treatments including the valproate contraindication and ptosis surgery, a diagnosis record, five differential diagnoses, and three KNOWLEDGE_GAP discussions with structured proposed_experiments. Evidence: 17 PMIDs, all fetched with just fetch-reference; GeneReviews PMID:20301791 tagged in the top-level references block. Validated with just validate: schema clean, term validation passed, and 92/92 snippets verified against cached references. No frequency bands are asserted anywhere because the recessive-POLG-PEO literature has no PEOB1-specific denominators; per docs/frequency-evidence-guidelines.md the band was omitted rather than fabricated. Histopathology finding_term is left unbound because the HistopathologyFindingTerm range is rooted in the NCIT Histopathology Result branch, which lacks classes for ragged-red fibres, COX-negative fibres, and multiple mtDNA deletions; the equivalent HP terms are bound on the matching phenotype entries and the rationale is recorded in notes.

      - IEG arm: 5 -> 2 edges, same two neural targets, distinct rationales.
      - GLI3 arm: kept all 5 edges (hedgehog patterning genuinely spans forebrain midline,
        cortical progenitors, hindgut/cloacal septation, cardiac septation and
        craniofacial/limb patterning) but rewrote each of the 5 rationales to be
        target-specific rather than boilerplate.
    Pathograph is now 9 nodes / 12 edges, single root, zero orphaned nodes; every terminal
    node retains at least one incoming edge; no two edges within an arm share a description.
    The attaches_to reference to "Impaired Neuronal Differentiation and Cortical
    Development" still resolves.

    SUGGESTION #3 - added biological_processes to the two bare terminal nodes, using the GO
    terms the reviewer verified and which OAK confirms: GO:0003281 ventricular septum
    development (Cardiac Septation Defect) and GO:0014033 neural crest cell differentiation

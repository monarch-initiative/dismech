  details: |
    Automated PR Shepherd response to the ai4c-reviewer re-review of PR #7254.

    IMPORTANT #1 - complete-bipartite fan-out with copy-pasted rationales. The three
    mechanistic arms each edged to all five terminal nodes (15 edges) with byte-identical

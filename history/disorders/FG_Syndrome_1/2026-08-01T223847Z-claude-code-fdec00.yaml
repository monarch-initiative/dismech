  summary: Evidence-precision fixes from inter-annotator study
  details: |
    Applied defect fixes surfaced by an independent re-curation of this entry (inter-annotator consistency study, experiments/interannotator/FG_Syndrome_1/).

    (1) Added PMID:23091001 (Zhou 2012 PNAS) to the GLI3/SHH pathophysiology node - the only source demonstrating the mechanism for the p.Arg961Trp allele itself in patient-derived cells; downgraded PMID:17000779 and both PMID:30729724 items to supports: PARTIAL because neither studied the FGS1 variant.
    (2) Removed the FREQUENT band on Anxiety, which rested on a "propensity towards" quote carrying no denominator, and added the cohort-paper sentence recording that anxiety is non-discriminating.
    (3) Kept Intellectual disability at OBLIGATE but replaced the counted-denominator rationale with the definitional/ascertainment argument, resolving an internal inconsistency with three other 100%-denominator phenotypes banded VERY_FREQUENT.
    (4) Added a FREQUENT band to Relative macrocephaly from the Clark 7-of-18 sentence, with a warning that the 15-of-18 figure in the same paper belongs to the mutation-negative comparison group.
    (5) Added OCCASIONAL bands to Cryptorchidism and Inguinal hernia from PMID:17574621, marked PARTIAL because that 228-patient series predates routine MED12 testing.
    (6) Added PMID:20630950 (Rocha 2010) to the root node as MODEL_ORGANISM/PARTIAL, supplying the embryonic-lethality contrast behind the altered-function-not-null claim.

    Validated: linkml-validate clean, linkml-term-validator clean, 130/130 evidence snippets verified exact against the committed cache.

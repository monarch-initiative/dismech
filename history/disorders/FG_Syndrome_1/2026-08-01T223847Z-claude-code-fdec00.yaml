  summary: Evidence-precision fixes from inter-annotator study
  details: |
    Applied defect fixes surfaced by an independent re-curation of this entry (inter-annotator consistency study, experiments/interannotator/FG_Syndrome_1/).

    (1) Added PMID:23091001 (Zhou 2012 PNAS) to the GLI3/SHH pathophysiology node - the only source demonstrating the mechanism for the p.Arg961Trp allele itself in patient-derived cells; downgraded PMID:17000779 and both PMID:30729724 items to supports: PARTIAL because neither studied the FGS1 variant.
    (2) Removed the FREQUENT band on Anxiety, which rested on a "propensity towards" quote carrying no denominator, and added the cohort-paper sentence recording that anxiety is non-discriminating.
    (3) Kept Intellectual disability at OBLIGATE but replaced the counted-denominator rationale with the definitional/ascertainment argument, resolving an internal inconsistency with every other 100%-denominator phenotype banded VERY_FREQUENT.
    (4) Added a FREQUENT band to Relative macrocephaly, anchored on the "Ten had macrocephaly (five absolute, five relative)" count (5/13, 38%) rather than on the 7-of-18 sentence, which read strictly gives only an upper bound because the parenthetical attaches to absolute macrocephaly and only the predicate carries over. Retained a warning that the 15-of-18 figure in the same paper belongs to the mutation-negative comparison group.
    (5) Added PMID:17574621 genitourinary frequencies to Cryptorchidism and Inguinal hernia and added a Hypospadias phenotype, all marked PARTIAL and all WITHOUT a frequency band: the mutation-positive source gives only a collective qualitative term over a ten-item list, while the per-feature numbers come from a 228-patient clinically-defined series of which <3% is molecularly confirmed FGS1, so neither licenses a band.
    (6) Added PMID:20630950 (Rocha 2010) to the root node as MODEL_ORGANISM/PARTIAL, supplying the embryonic-lethality contrast behind the altered-function-not-null claim.

    Validated: linkml-validate clean, linkml-term-validator clean, 133/133 evidence snippets verified exact against the committed cache.

  summary: 'Create: FG Syndrome 1'
  details: |
    De novo curation of FG syndrome 1 (FGS1 / Opitz-Kaveggia syndrome; MONDO:0010590, OMIM:305450, MED12 p.Arg961Trp). Deep research provider: falcon (Edison Scientific), run via `just research-disorder falcon FG_Syndrome_1`; report and citations committed under research/. NEC preflight passed: the report's dominant gene (MED12) and asserted OMIM (305450) both match the MONDO:0010590 record, so no named-entity confusion. GeneReviews baseline PMID:20301719 (MED12-Related Disorders) was fetched, tagged in the top-level references block, and cross-referenced feature-by-feature against the curated phenotypes. Curated a 5-node pathograph with causal edges: MED12 p.Arg961Trp alters CDK8 kinase module function, feeding three parallel arms (impaired REST-dependent neuronal gene silencing; derepression of GLI3-dependent SHH target transcription; dysregulated immediate-early gene response) converging on abnormal neurodevelopment and morphogenesis. Added 35 phenotypes with HPO bindings and frequency bands anchored to explicit denominators from the Clark 2009 cohort of 23 molecularly confirmed males from 10 families; genetic block plus two variants (p.Arg961Trp, p.Gly958Glu); three diagnosis entries including the clinical triage algorithm (100% sensitivity, 90% specificity); four differential diagnoses covering the MED12 allelic series (Lujan-Fryns, X-linked Ohdo, Hardikar) plus MED12-negative FG phenotypes; ten supportive treatments derived from GeneReviews management guidance; inheritance, prevalence, progression, and clinical burden blocks; and one HUMAN_MODEL_MISMATCH discussion recording that all mechanistic evidence is lymphoblastoid or engineered-rescue rather than from affected human tissue, with two proposed resolving experiments. Key PMIDs: 20301719, 19938245, 17334363, 18973276, 20981778, 18805826, 18691967, 17000779, 30729724, 28369444, 33925166, 24123922, 34670449, 20507344. Validation: `just validate kb/disorders/FG_Syndrome_1.yaml` passed schema, term, and reference validation with no issues.

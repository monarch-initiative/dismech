  summary: 'Create: FG Syndrome 1'
  details: |
    De novo curation of FG syndrome 1 (FGS1 / Opitz-Kaveggia syndrome; MONDO:0010590, OMIM:305450, MED12 p.Arg961Trp). Deep research provider: falcon (Edison Scientific), run via `just research-disorder falcon FG_Syndrome_1`; report and citations committed under research/. NEC preflight passed: the report's dominant gene (MED12) and asserted OMIM (305450) both match the MONDO:0010590 record, so no named-entity confusion. GeneReviews baseline PMID:20301719 (MED12-Related Disorders) was fetched, tagged in the top-level references block, and cross-referenced feature-by-feature against the curated phenotypes. Curated a 5-node pathograph with causal edges: MED12 p.Arg961Trp alters CDK8 kinase module function, feeding three parallel arms (impaired REST-dependent neuronal gene silencing; derepression of GLI3-dependent SHH target transcription; dysregulated immediate-early gene response) converging on abnormal neurodevelopment and morphogenesis. Added 35 phenotypes with HPO bindings and frequency bands anchored to explicit denominators from the Clark 2009 cohort of 23 molecularly confirmed males from 10 families; genetic block plus two variants (p.Arg961Trp, p.Gly958Glu); three diagnosis entries including the clinical triage algorithm (100% sensitivity, 90% specificity); four differential diagnoses covering the MED12 allelic series (Lujan-Fryns, X-linked Ohdo, Hardikar) plus MED12-negative FG phenotypes; ten supportive treatments derived from GeneReviews management guidance; inheritance, prevalence, progression, and clinical burden blocks; and one HUMAN_MODEL_MISMATCH discussion recording that all mechanistic evidence is lymphoblastoid or engineered-rescue rather than from affected human tissue, with two proposed resolving experiments. Key PMIDs: 20301719, 19938245, 17334363, 18973276, 20981778, 18805826, 18691967, 17000779, 30729724, 28369444, 33925166, 24123922, 34670449, 20507344. Validation: `just validate kb/disorders/FG_Syndrome_1.yaml` passed schema, term, and reference validation with no issues. Post-curation red-team review (dismech-pr-review skill, subagent) verified all evidence snippets as exact substrings of their caches and re-checked every ontology term with OAK; its findings were then applied: replaced a composite-triad snippet with the Clark 2009 sentence that names congenital hypotonia and feeding difficulties as present in all affected individuals (raising feeding difficulties to VERY_FREQUENT); stated the deliberate 13/13-to-VERY_FREQUENT departure explicitly on the three 100%-denominator phenotypes rather than silently down-banding; dropped unsupported frequency bands from joint contractures, cryptorchidism, renal cysts/stones, pyloric stenosis, short stature, hearing loss, and seizures; split composite rows from their bound components (ocular anomalies vs strabismus, facial gestalt vs high forehead, small ears vs simple ears); rebound terms to more precise matches (HP:0007370, HP:0001999, HP:0008551, HP:0100025, HP:0000478, GO:1990508, MAXO:0000010); removed a diagnostic-yield record that did not belong in structured prevalence; added sleep disturbance and a baseline-echocardiography diagnosis entry; and corrected evidence_source and support levels where a source characterized the historical pre-molecular label rather than the MED12-confirmed cohort. Automated PR review (ai4c-reviewer, PR #7254) returned REQUEST_CHANGES on two findings, both applied: the single ORGANISM-scale terminal node was unbundled into five organ-specific terminal nodes (Failure of Corpus Callosum Formation, Impaired Neuronal Differentiation and Cortical Development, Anorectal Malformation, Cardiac Septation Defect, Craniofacial and Skeletal Dysmorphogenesis), each carrying its own per-organ denominator from the Clark 2009 cohort and each reached by all three mechanistic arms via INDIRECT_UNKNOWN_INTERMEDIATES edges, taking the pathograph from 5 nodes/6 edges to 9 nodes/18 edges; and the contradictory OBLIGATE band on the identical 13/13 callosal datum in Mediator_Complex_Neurodevelopmental_Disorder.yaml was brought into line at VERY_FREQUENT with matching rationale. Two minor findings also applied: Small ears rebound from HP:0008551 Microtia (an auricular malformation claim) to HP:0400005 Short ear (defined by ear-length measurement, matching the below-10th-percentile source), and Renal cysts and stones split into separate Renal cyst (HP:0000107) and Nephrolithiasis (HP:0000787) rows so both are independently queryable.

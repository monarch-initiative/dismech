  summary: 'Create: Rienhoff Syndrome (TGFB3 / Loeys-Dietz syndrome type 5)'
  details: |
    De novo curation of Rienhoff syndrome (MONDO:0014262, Loeys-Dietz syndrome type 5, TGFB3, OMIM:615582). Deep research: falcon was attempted first per the skill default but the Edison API returned 402 Payment Required (no credits), so claude_code and openscientist were run instead; both completed and both reports are committed under research/. NEC preflight passed: the MONDO:0014262 obo record (causal gene TGFB3, OMIM:615582 xref, 'Loeys-Dietz syndrome type 5' exact synonym) matched the disease identity in both DR reports. GeneReviews baseline: only the gene-agnostic Loeys-Dietz chapter (PMID:20301312) exists; it is tagged in top-level references, and its LDS-wide features lacking TGFB3-specific evidence are deliberately NOT imported, a scope decision recorded as the lds_wide_features_not_confirmed_for_tgfb3 KNOWLEDGE_GAP discussion. Curated the bimodal phenotype (muscular/skeletal pole without vascular disease versus the aortopathy pole), a seven-node pathograph with four conforms_to edges into aortopathy_tgfbeta_dysregulation, two competing mechanistic_hypotheses (reduced ligand signalling versus paradoxical aortic TGF-beta up-regulation) plus a CONTROVERSY discussion, a HUMAN_MODEL_MISMATCH discussion contrasting the homozygous Tgfb3-null mouse with the heterozygous human disease, cohort frequencies from the 32-patient Dutch-French series (PMID:31898322), and an ARVD1 differential guarding against conflating TGFB3 regulatory-variant disease with this coding-variant disease. Validation: just validate passes (schema, terms and references), 98 of 98 snippets verified against cached references, validate-terms passes, compliance 92.5 percent global and 92.9 percent weighted, and all 9 Rienhoff-specific pytest cases pass.

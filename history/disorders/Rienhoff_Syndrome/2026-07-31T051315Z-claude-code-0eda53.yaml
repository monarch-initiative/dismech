  summary: 'EDIT: address PR 7322 review - diagnosis section, scoliosis phenotype, cascade testing treatment'
  details: |
    Follow-up edits addressing the ai4c-reviewer CHANGES_REQUESTED review on PR 7322, all three items additive with snippets already in the reference cache. Added a diagnosis section mined from the GeneReviews DIAGNOSIS/TESTING criterion sentence (PMID:20301312) with exon-level deletion/duplication CNV analysis motivated by the homozygous exon 2-7 deletion case (PMID:32022420); added a Scoliosis phenotype (HP:0002650) with TGFB3-specific evidence from the Belgian founder cohort (PMID:37719708) plus the GeneReviews orthopedic surveillance sentence; and added a Cascade Genetic Testing of At-Risk Relatives treatment (MAXO:0000079 genetic counseling) citing the GeneReviews evaluation-of-relatives-at-risk recommendation, noting the high yield under this low-penetrance subtype. The GeneReviews relatives-at-risk sentence contains editorial bracket annotations (variant[s]) that the reference validator strips when normalizing snippets, so the quoted snippet uses the bracket-free concluding clause of the same sentence. Re-validated with just validate and just validate-references; all checks pass.

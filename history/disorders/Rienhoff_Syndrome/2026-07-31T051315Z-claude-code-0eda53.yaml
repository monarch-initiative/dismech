  summary: 'Create: Rienhoff Syndrome - TGFB3-related HTAD / LDS5'
  details: |
    Created a full Rienhoff syndrome entry - Loeys-Dietz syndrome type 5, TGFB3-related heritable thoracic aortic disease. Deep research: falcon failed to return; the asta report was low quality and used only as leads; the claude_code report was the primary source, with every PMID independently fetched via just fetch-reference and every snippet verified as an exact substring of the cached abstract. Curated 7 pathophysiology nodes from TGFB3 ligand deficiency through paradoxical TGF-beta signaling dysregulation, medial degeneration, dilation and aneurysm, and dissection and rupture, plus palatogenesis and myogenesis arms, with conforms_to edges to the aortopathy_tgfbeta_dysregulation module; genetics including the Belgian p.Asp263His founder variant from PMID:37719708, the RKKR codon-Arg300 direction-of-effect controversy, and a severe biallelic case from PMID:32022420; inheritance noting variable expressivity and the lowest penetrance of the LDS genes; phenotypes including extra-aortic arterial aneurysms from PMID:39450604 and 39653386; treatments including beta-blockade, ARBs, prophylactic and peripheral aneurysm repair, surveillance from PMID:40533122, and pregnancy management from GeneReviews PMID:20301312; two Tgfb3-null mouse lines as animal_models from PMID:7493021 and 7493022; and two discussions, a KNOWLEDGE_GAP on the LoF-versus-GoF direction of effect and a HUMAN_MODEL_MISMATCH on the absent mouse aortopathy model. Validated with just validate for schema and terms and just validate-references confirming all snippets are exact substrings of cached abstracts. An adversarial red-team review then spot-checked about 25 snippets against the cache and all ontology labels against OAK, and confirmed two factual errors: the entry claimed only a single biallelic case had been reported, but Marsili 2020 PMID:31898322 describes a distinct first homozygous patient, and the prevalence note said fewer than one hundred published cases while the entry's own cited review counted 94 in 2023. Both were corrected, including adding the Marsili evidence item, along with polish fixes: module-consistent INCREASED modifier, GeneReviews evidence_source reclassified as OTHER, appendicular versus proximal weakness wording, an expanded LDS differential covering SMAD2 and IPO8, a verbatim-note on the c.1044C>A versus p.Cys384* nomenclature inconsistency in PMID:34549088, the Rienhoff eponym gloss, and cervical spine management wording.

  summary: 'Edit: Juvenile Myelomonocytic Leukemia - the juvenile xanthogranuloma
    association'
  details: |
    Adds a Juvenile Xanthogranuloma phenotype row, one of two rows recording the association of neurofibromatosis type 1, juvenile xanthogranuloma and this leukemia in neighboring entries (the other is on Neurofibromatosis_Type_1).

    The row binds MONDO:0015534 juvenile xanthogranuloma, the disease term of the Juvenile_Xanthogranuloma entry, for the reasons recorded in its notes and in the history record of the Neurofibromatosis_Type_1 row: the phenotype slot's enum admits a disease term, HPO has no term for the lesion, and MONDO's definition says its lesions consist of cutaneous papules and nodules, where the case report cited on the row describes a papulonodular rash. Earlier drafts bound HP:0200036 Skin nodule and then HP:0011355 Localized skin lesion. The Juvenile_Xanthogranuloma entry binds Skin nodule for its own cutaneous lesion, and that binding is not changed here.

    Evidence. A 2025 case report supplies a background statement that the lesion has rarely been associated with this leukemia, and its own finding: a 21-month-old boy's skin lesions and blood carried the same somatic PTPN11 variant, its identification prompted urgent evaluation, and overt leukemia followed two weeks later. The authors read the shared variant as supporting a clonal relationship and count the case as the second documented one. From the 1995 analysis of the world literature the row quotes a background sentence on the leukemia's cutaneous manifestations, the 30-fold to 40-fold figure and the conclusion that the three-way association is real; all three are graded indirect, because the paper names the leukemia juvenile chronic myelogenous leukemia, an exact synonym of this entry's MONDO term, although its abstract does not link the two. The two results concern the association with neurofibromatosis type 1 and come from a systematic review of the literature. From the 2023 systematic review the row quotes that the association is debatable and very rare, that the review reads its own data as supporting the association, with younger age as a possible confounder, and that it estimates no incidence because its sources are mostly case reports and series.

    All eleven evidence items quote references already cached and cited by the Juvenile_Xanthogranuloma entry, and a sentence quoted in more than one entry carries the same evidence_source in each. Validated with just validate-disorders (schema, terms and references) and the repository's other gates over the two changed entries; term validation added MONDO:0015534 to the phenotype enum cache.

  summary: 'Fix: MONITORING surveillance treatments carried therapeutic target slots'
  details: |
    The merge-queue Build and test run dequeued PR #11583 with CI_FAILURE. The failing gate was check_non_therapeutic_actions_do_not_use_treatment_targets: two of the three surveillance treatments added in review round 1 carried action_category MONITORING alongside treatment-style target slots (Nephrology Surveillance had target_mechanisms pointing at Glomerular Hyperfiltration and Progressive Nephron Loss; Periodic Audiometric Evaluation had target_phenotypes binding HP:0000407).

    The category was right and the target links were the false claim. Surveillance observes those nodes; it does not act on them. The Nephrology Surveillance link's own description said as much - it described the antiproteinuric therapy acting on the node, not the surveillance. Both target blocks were removed and the information they carried was folded into each treatment description rather than discarded, so the entry still records that surveillance detects the hyperfiltration injury early enough for the antiproteinuric arm to act, and that audiometry measures the hearing-loss phenotype rather than treating it. Ophthalmologic Surveillance already carried no target slot and is unchanged.

    The other two entries curated in this run were scanned for the same defect and are clean.

    This defect reached an approved PR because the pytest KB lane is selected by changed path, and a curation PR touching only kb/ matches neither the python nor the schema filter - so the gate that catches it never ran on the PR. It ran for the first time in the merge group, against the full suite. Validation after the fix: pytest test_disorder_file for this entry fails on the pre-fix tree and passes after, validate-disorders passes with 107/107 snippets verified, unchanged.

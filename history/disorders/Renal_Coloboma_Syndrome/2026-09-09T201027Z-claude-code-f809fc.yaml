  summary: 'Create: Renal_Coloboma_Syndrome'
  details: |
    Created the dismech entry for Renal Coloboma Syndrome (papillorenal syndrome, MONDO:0007352, OMIM 120330) from scratch. Deep-research provider was Perplexity sonar-deep-research (research/Renal_Coloboma_Syndrome-deep-research-perplexity.md); just preflight-dr returned PASS against MONDO:0007352 (PAX2 mentioned 170 times, OMIM 120330 agreeing). The report was flagged needs_review and many of its ontology suggestions were wrong, so every identifier was looked up independently rather than copied across (fifteen of the CURIEs the report mentions survived that lookup and are used here): GO:0072203, GO:0072193, GO:0003095 and GO:0035989 all name different processes than the report claimed (correct terms used here are GO:0072006, GO:0001657 and GO:0003094); NCIT:C15273 is Longitudinal Study rather than Hemodialysis and NCIT:C15274 is Lung Transplantation rather than Peritoneal Dialysis (this entry binds NCIT:C15221 Dialysis); HP:0000120 does not exist; HP:0005692 is obsolete and was replaced by HP:0001382. Every identifier written here was looked up through ols: adapters or the committed term caches in the same step it was written. Report claims rejected for lack of a citable cached source: the Orphanet prevalence band of less than 1 per 1,000,000, compound PAX2/PAX8 mutation causing human renal agenesis, and corpus callosum agenesis among the CNS findings; Orphanet qualitative frequency bands were superseded throughout by the counted frequencies in PMID:22213154, and myopia, strabismus and nystagmus were dropped for want of a quotable quantitative source. GeneReviews PMID:20301624 (PAX2-Related Disorder) is tagged in references: and mined across clinical characteristics, diagnosis/testing, management and genetic counselling. Entry scoped to the syndromic renal-plus-ocular form; the isolated PAX2 renal/FSGS7 form is represented as a differential diagnosis plus a skos:relatedMatch mappings entry to MONDO:0014451, whose MONDO parent is focal segmental glomerulosclerosis rather than this syndrome. In a finishing pass the broader concept 'PAX2-related disorder' was removed from synonyms and left only under parents: OLS confirms MONDO does not carry it as a synonym of MONDO:0007352, and listing it as both a parent and a synonym contradicted the scoping decision. Lump/split decision: single leaf DISEASE entry, no subtypes, since the largest series found no genotype-phenotype correlation. Content: 13 pathophysiology nodes in a connected chain from PAX2 haploinsufficiency through ureteric bud apoptosis and reduced branching to nephron deficit, hyperfiltration, podocyte injury and CKD, with parallel ocular and auditory arms; 25 phenotypes; 6 animal models and 1 iPSC experimental model with modeled_mechanisms; 5 differential diagnoses; 3 discussions (2 KNOWLEDGE_GAP, 1 HUMAN_MODEL_MISMATCH). 28 distinct references cited. Validation run and read: just validate (schema, terms, references) passed with 136/137 snippets verified and the one skip verified separately via just count-verified-snippets --unskip-prefix DOI (137/137); just validate-disorders passed; just check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-reference-titles all OK; just list-gene-term-mismatches reported 2 of 2 gene bindings naming the gene the entry names; just normalize-cache, check-term-cache-integrity and check-cache-order all clean. Stub stubs/Renal_Coloboma_Syndrome.yaml deleted.

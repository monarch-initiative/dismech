  summary: 'Review round 1: evidence-claim alignment, full-clause snippets, clinical
    evaluations and surveillance'
  details: |
    Addressed the three blocking findings and both optional items from the ai4c-reviewer round on PR #11583, in one push.

    Finding 1 (blocking) - evidence/claim mismatch in the inheritance block. The PMID:22660956 item quoted the abstract's BACKGROUND boilerplate ('Renal coloboma syndrome (RCS) is a highly variable syndrome characterized by renal and ocular abnormalities') under an explanation asserting that a monozygotic twin pair discordant for severity shows expressivity is not genotype-determined. The quoted sentence carries 'variable syndrome' and nothing else: no twins, no discordance, no genotype-independence. Replaced with two evidence items, both verified verbatim against the committed cache: the CASE-DIAGNOSIS sentence reporting the discordant monozygotic twin pair, and the sentence establishing that both twins carry the same de novo p.C52Y allele. The second is what makes the discordance evidence about expressivity rather than about which variant was inherited, so the explanation now rests on quoted text at every step.

    Finding 2 (blocking) - the podocyte-to-FSGS edge snippet stopped at 'exhibit reduced', dropping the half of the clause that names FSGS, which is what the edge asserts. The explanation attributed the truncation to a typographic quotation mark in the source. That constraint does not exist: scripts/check_snippets_verbatim.py normalize() maps U+201C/U+201D to ASCII double quotes (and en/em dashes to hyphens) before comparing, and Vici_Syndrome, Onchocerciasis and Peroxisomal_Acyl-CoA_Oxidase_Deficiency all carry curly quotes in verified snippets. Verified this against the validator source and by running the checker, then quoted the full clause including the 'podocyte fitness,' phrase and rewrote the explanation, which had recorded a constraint that is not real.

    Optional item, same defect - the PMID:37628926 snippet was cut before an en-dash for the same non-reason. Extended to the full clause naming the PTIP-MLL complex; explanation corrected.

    Finding 3 (blocking) - the diagnosis section modelled only molecular testing. Added the GeneReviews clinical evaluation battery as three diagnosis entries (dilated ophthalmologic examination NCIT:C38060; renal ultrasonography NCIT:C159885; renal function, uric acid and urinalysis NCIT:C74972 with markers listed), and the GeneReviews surveillance schedule as three MONITORING treatments (nephrology NCIT:C74972, ophthalmology NCIT:C38060, periodic audiometry NCIT:C38036). The audiometry entry carries target_phenotypes HP:0000407, and the nephrology entry targets the hyperfiltration node, which is the modifiable arm. Both GeneReviews sentences are quoted exactly. The evaluation battery is described in the entries as what it is in the source - the assessment of an at-risk relative in whom no PAX2 variant has been found - rather than as a proband workup, which the source does not say.

    Term discipline: all six NCIT CURIEs were read from cache/ncit/terms.csv and re-verified against ols:ncit in the same step. NCIT:C61256 (Monitoring) was rejected for the surveillance entries after an OLS4 hierarchicalAncestors query showed it is not reachable from NCIT:C25218, so it cannot be a TreatmentActionTerm; the three organ-specific action terms were used instead, which are all in the committed enum cache. Note that 'runoak -i ols:ncit ancestors' cannot answer this - the OLS adapter raises NotImplementedError - so the check was done against the OLS4 REST API with NCIT:C38060 as a positive control.

    Optional item - three absent phenotypes (CNS/corpus callosum anomalies, genital anomalies, cataract). Declined to add them and recorded the scoping decision in notes, as the reviewer suggested. The report qualifies them as occurring 'in some families' and as 'less common findings' with no frequency or denominator, so there is nothing quotable to attach. Separately, two of the three CURIEs offered for them are mislabelled in the report and were repeated in the review: HP:0002190, offered for corpus callosum anomalies, is Choroid plexus cyst; HP:0000083, offered for genital anomalies, is Renal insufficiency. Only HP:0000518 (Cataract) is right. Both were checked against ols:hp. This is recorded in notes so the next curator does not re-derive them from the same bad source.

    Validation: just validate passes; 107/107 snippets verified (up from 100/100); just validate-terms passes; just validate-disorders passes over the changed file. Offline gates run and passing: check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, list-gene-term-mismatches.

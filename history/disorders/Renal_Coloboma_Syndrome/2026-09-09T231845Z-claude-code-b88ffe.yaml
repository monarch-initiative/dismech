  summary: 'Create: Renal Coloboma Syndrome'
  details: |
    First curation of renal coloboma syndrome (PAX2-related disorder, MONDO:0007352) as a leaf Disease entry; stub deleted.

    Deep research: one Perplexity run, research/Renal_Coloboma_Syndrome-deep-research-perplexity.md. The provider's default sonar-deep-research model could not complete through this environment's egress proxy — three runs each died at 5m05s with 'Server disconnected without sending a response', which is a hard ~300s tunnel cap rather than an API failure (a direct curl to the same model returned 200 at 256s). Passing --param model=sonar-reasoning-pro kept Perplexity as the provider and completed in 197s. dr_fallback='--fallback' was tried first and did not help: it triggers only on missing credentials, not a runtime transport failure. Report reference validation: 22/22 references resolved, 0 unresolved, confabulation_rate 0.0, 18/22 judged on topic, 0 quotes checked. just preflight-dr returned PASS (PAX2 mentioned 79 times, OMIM 120330 matching MONDO).

    Term validation on that report was poor and none of its CURIEs was used: 29 of 56 offered labels named a different term than the report claimed, including HP:0000588/HP:0000589 inverted, UBERON:0001626 offered as optic nerve (it is left coronary artery), CL:0002511 offered as parietal epithelial cell, and HGNC:8619 offered as PAX2 (that identifier is PAX5). Every binding in the entry was re-derived with runoak against ols:hp, ols:go, ols:cl, ols:uberon and ols:ncit; the caveat is recorded in the entry notes.

    Report reference accounting. All PMIDs the report cites, plus its PMC ids resolved through the NCBI ID converter, were reviewed. Used: 20301624 (GeneReviews), 10466411, 7795640, 8575306, 8951055, 22213154, 39994403, 41278347, 41278353, 16049068, 11730657, 23756089, 10587573, 24676634, 30998089, 21654726, 21326282, 9106533, 35087773, 37123577, 37628926, 31538321. Deliberately not used: PMID:8589702 (Sanyanusin, Hum Mol Genet 1995 — fetched, but the record carries no abstract body so nothing is quotable; the companion Nat Genet paper PMID:7795640 makes the same claim, and the empty cache file was not committed); PMID:27226968 and PMID:31692565 (single-family and single-case reports whose only claims — variable expressivity, a novel allele — are already carried by stronger sources); and 'PMID:8787321', which the report cites for a 2022 Frontiers in Pediatrics review but is a PMC id written as a PMID — PMID:8787321 is a 1995 French paper on inguinal hernia repair, and the intended article PMID:35087773 is cited instead.

    Content: an eight-node pathograph running PAX2 haploinsufficiency to four organ arms — ureteric-bud apoptosis and reduced branching to renal hypodysplasia to hyperfiltration and CKD; reduced podocyte fitness to FSGS and albuminuria; failed optic fissure closure to optic nerve head dysplasia and retinal coloboma; and otic vesicle patterning failure to high-frequency sensorineural hearing loss. Four phenotypes (microcornea, soft skin, joint hypermobility, hyperuricemia) are left unconnected on purpose, with the reason in the entry notes, because no source here traces a mechanism to them. The ocular node declares conforms_to ocular_morphogenesis_failure#Failure of Optic Fissure Closure. 20 phenotypes with HP bindings, PAX2 genetic record (hgnc:8616), autosomal dominant inheritance with germline mosaicism, a mechanistic_hypotheses entry for the emerging podocyte-fitness arm, three differential diagnoses, six treatments, two animal models (Pax2 null, Pax2(1Neu) heterozygous) and one patient-iPSC podocyte model, all with modeled_mechanisms links and readouts.

    Two histopathology findings (oligomeganephronia, FSGS on biopsy) were left with no finding_term and a recorded reason: HistopathologyFindingTerm is reachable only from the NCIT Histopathology Result branch, and neither NCIT:C123202 nor NCIT:C37308 nor NCIT:C96239 nor NCIT:C120888 is reachable from any of its thirteen source nodes (checked with runoak ancestors -p i).

    Validation: just validate, just validate-terms, just count-verified-snippets (100/100 verified), just check-duplicate-keys, just check-entity-refs, just check-causal-targets, just check-qualifier-terms, just check-enum-values, just check-stubs, just check-folded-hyphens, just check-snippet-length, just check-title-snippets, just check-snippet-grading, just check-reference-titles, just list-gene-term-mismatches, and the authoritative just validate-disorders — all pass.

  summary: 'Review round 1 fixes: COG6-CDG'
  details: |
    Addressed the round-1 review of PR #18809. Rectovaginal fistula: replaced the symptom-only PMID:35068072 snippet with the barium-enema result sentence that establishes the fistula. Added five prenatal-onset phenotypes from PMID:40213872 (Abnormal heart morphology HP:0001627, Splenomegaly HP:0001744, Hydrocephalus HP:0000238, Hypoplasia of the brainstem HP:0002365, Cerebellar hypoplasia HP:0001321), each noted as single-family findings, and a Diarrhea phenotype (HP:0002014) from PMID:39528286. Added a downstream edge from Combined N- and O-glycosylation Defect to the Abnormal glycosylation phenotype, citing PMID:23430903. Added experimental_models for COG6-knockout HEK293T cells (PMID:27066481) and COG6-CDG patient skin fibroblasts (PMID:20605848), each linked to COG Complex Fragmentation and Loss of Golgi Integrity and Impaired Retrograde Golgi Trafficking with fidelity, model_scale, limitations and typed divergences. Added a notes line on the Hyperthermia phenotype explaining the HP:0001945 Fever binding after an OLS HPO search (l~hyperthermia) returned only malignant hyperthermia terms. Declined a vitamin K treatment: the cached abstracts (PMID:20605848, PMID:23430903) report vitamin K deficiency but contain no management sentence. HPO terms were taken from cache/hp/terms.csv and confirmed in OLS. Validated with just validate, count-verified-snippets, validate-terms, check-causal-targets, check-entity-refs, check-snippet-grading, check-name-collisions, model-scale-audit, check_gene_activity_grounding and validate-disorders.

  summary: 'Create: COG6-Congenital Disorder of Glycosylation'
  details: |
    New Disease entry for MONDO:0013810 (COG6-CDG, CDG-IIL), causal gene COG6 (hgnc:18621, confirmed via the HGNC REST API; the claim prompt's hgnc:24133 was wrong, the stub's hgnc:18621 is right). Deep research was requested from falcon; falcon had no API key, so the run fell back to claude_code and the report is committed under that name (research/COG6-Congenital_Disorder_of_Glycosylation-deep-research-claude_code.md; 20/20 references resolved, 19/19 quotes valid; just preflight-dr PASS, COG6 mentioned 54 times). Lump/split: Shaheen syndrome (MONDO:0014131, OMIM 615328), the allelic disorder of the hypomorphic c.1167-24A>G variant, is not included as a subtype; following MONDO and OMIM it gets its own entry (claim issue #18805), and its stub is untouched. ClinGen's Prenatal GCEP lumps the two, which the entry notes record. Hypomorphic-allele findings (normal transferrin glycosylation, STX6 deficiency) are kept only as mechanistic context. Pathograph: COG6 loss of function -> COG complex fragmentation and loss of Golgi integrity -> impaired retrograde Golgi trafficking -> mislocalized Golgi glycosylation machinery -> combined N- and O-glycosylation defect -> phenotypes and a hyperinflammatory febrile-episode node; a branch records STX6 deficiency. Conforms to two congenital_disorder_of_glycosylation module nodes. Phenotype frequencies from Rymen 2015 (PMID:26260076). Only GeneReviews chapter is the retired CDG multiple-pathway overview (PMID:20301507), tagged and noted. ClinGen Definitive (AR) recorded in gene_disease_validity from the cached CGGV record (rebuilt via just fetch-reference from a local gene_validity.csv whose sha256 differs from the manifest pin). HP:0001522 Death in infancy left unbound because it is outside the PhenotypeTerm enum. The COG6 Loss of Function node carries no molecular_functions term: QuickGO's only molecular-function annotation for human COG6 (UniProtKB:Q9Y2V7) is GO:0005515 protein binding (IPI), which would add nothing, so the node is grandfathered with one hand-added line in tests/gene_activity_grounding_baseline.txt (as the COG1, COG4, COG7 and COG8 entries already are) and a notes: clause on the node says why; scripts/check_gene_activity_grounding.py --against-ref origin/main then passes. Validated with just validate, count-verified-snippets (85/85), validate-terms, check-causal-targets, check-entity-refs, check-snippet-grading, check-gene-validity (0 conflicts) and validate-disorders.

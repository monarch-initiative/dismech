  summary: 'Create: Aflatoxicosis (MONDO:0700296), acute aflatoxin poisoning'
  details: |
    Curated de novo from a Perplexity sonar-deep-research report (research/Aflatoxicosis-deep-research-perplexity.md). 23 evidence snippets, all verified by dismech.reference_snippet_audit against references_cache/.

    Scope decision: this is the acute and subacute poisoning syndrome, deliberately distinct from the existing Aflatoxin_Related_HCC entry. They share an exposure and the first two steps of its metabolism (CYP450 bioactivation to the exo-8,9-epoxide, adduct formation) and diverge completely after that: chronic low-dose exposure gives TP53 R249S and carcinoma over decades, acute high-dose exposure gives hepatocyte necrosis and death in weeks. The carcinogenesis chain is not restated here and the boundary is recorded in notes.

    The report's causal framing was explicitly rejected. It presented the acute and chronic arms as one continuous nine-step chain in which carcinogenesis (step 7) follows acute hepatic necrosis (step 6). That is backwards -- they are alternative dose-dependent outcomes, not sequential steps -- and adopting it would have produced a pathograph asserting that acute liver failure causes cancer. The entry models the shared bioactivation node once and branches.

    The report cited no PMIDs in its body at all, only URLs. The primary literature was assembled by hand: PMID:16330363 (Azziz-Baumgartner, the 2004 Kenya case-control study, which is the source for most of the entry), PMID:17308181 (Probst, S-strain A. flavus as causal agent), PMID:48730 (the 1974 western India outbreak), PMID:16175785 (a detailed case report). PMID:6123648 (Ngindu, Lancet 1982) was fetched but has no abstract in the cache, so it could not support a verified snippet and was not cited. PMID:11401911 (TP53 249ser meta-analysis) was fetched but belongs to the chronic/HCC arm and was deliberately not used.

    Evidence-grading notes. Two snippets from PMID:16330363 are sentences that are themselves citations to earlier work within that paper ('Disruption of proteins and DNA bases in hepatocytes causes liver toxicity (Tandon et al. 1978)'); the explanation says so explicitly, because the cited paper reports rather than demonstrates that step. The supportive-care treatment evidence is a single uncontrolled case report and is graded directness: INDIRECT with the reason stated. The pancytopenia phenotype rests on that same single case and says so in its own description.

    Three discussions record what is not known: whether the observed hepatitis B association in acute disease is causal or confounded (the chronic HBV-aflatoxin interaction model was deliberately not imported), the unknown acute human dose threshold -- every regulatory limit is anchored to carcinogenic risk instead -- and whether the reported marrow suppression is direct toxicity or secondary to liver failure.

    Validation run in the worktree: linkml-validate (Disease) clean; linkml-term-validator validate-data --labels clean; reference_snippet_audit 23/23; check_duplicate_yaml_keys, check_entity_refs, check_causal_targets, check_enum_values clean; check_environmental_evidence clean (the exposure carries its own evidence, no waiver used).

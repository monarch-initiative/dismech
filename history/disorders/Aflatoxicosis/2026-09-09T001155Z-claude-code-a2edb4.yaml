  summary: 'Review round 1: split bundled node, connect phenotypes, add frequencies'
  details: |
    Addressed the round-1 REQUEST_CHANGES review on PR #11447.

    Structural changes. Split the bundled pathophysiology node "Hepatocyte Necrosis and Acute Hepatic Failure" into three atomic nodes: "Protein Synthesis Disruption and Oxidative Injury" (CELLULAR), "Hepatocyte Necrosis" (CELLULAR) and "Acute Hepatic Failure" (ORGANISM), repointing every incoming edge, the reports_on link and the treatment target_mechanisms. The middle node also answers the reviewer's separate request for a protein-synthesis-inhibition mechanism node, which is the acute-specific arm that distinguishes this entry from Aflatoxin_Related_HCC.

    Pathograph connectivity. Vomiting, Abdominal pain, Diarrhoea and Ascites and portal hypertension are now downstream of Acute Hepatic Failure. The three gastrointestinal edges are typed INDIRECT_UNKNOWN_INTERMEDIATES because the only source placing them downstream does so narratively, and direct gastrointestinal toxicity is unexcluded. Pancytopenia is left deliberately unlinked with a notes block saying why: its causal route is the open question in the extrahepatic_acute_toxicity discussion, so drawing either edge would settle it by assertion.

    New content from PMID:40252547, fetched this round. Frequencies on jaundice, vomiting, ascites and diarrhoea, each with its own evidence item quoting the frequency sentence; abdominal pain carries the reported 8-87 percent range as free text because it spans three FrequencyEnum bands. A second prevalence record for the outbreak attack rate of 8 per 100,000, typed PERIOD_PREVALENCE because an outbreak attack rate is a cumulative incidence proportion over the outbreak period rather than an annual rate. The 16.2-76.5 percent mortality range was added to the existing prevalence record.

    Coagulopathy added as a phenotype, bound to HP:0003256. The reviewer suggested HP:0006826 for hepatic encephalopathy; that CURIE does not resolve in HPO, and more importantly no cited source names hepatic encephalopathy at all. The only neurological figures come from a 1991 series that the systematic review itself partly attributes to boric-acid co-intoxication. Rather than assert the phenotype on general clinical expectation, a neurological_features_attribution discussion records the gap, carrying a REFUTE evidence item quoting the review's caution.

    Also added: biomarker readouts wiring the serum AFB1-lysine adduct to Macromolecular Adduct Formation (READOUT_OF) and to Acute Hepatic Failure (PREDICTS); a diagnosis section carrying the adduct assay and the viral-exclusion step; and an animal_models entry for the naturally occurring canine cases in the 1974 western India outbreak, with fidelity UNKNOWN and limitations recording that the source gives no dog-specific data at all.

    Regraded the PMID:17308181 prevalence evidence item from OTHER to HUMAN_CLINICAL: the quoted passage reports human case counts and a case-fatality rate, while the same paper's fungal-strain claims remain OTHER.

    Validation: linkml-validate clean; linkml-term-validator --labels passed; 42/42 snippets verified against the cache, up from 23/23; offline gates clean.

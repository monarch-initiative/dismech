  summary: Repair the evidence defects the validator upgrade exposed
  details: |
    Three evidence items on Cholera quoted a reference's own title as the snippet. All three were exposed by upgrading linkml-reference-validator to 0.3.0rc1: they had matched only because the old cached body prepended a MEDLINE citation header containing the title, and the upgraded fetcher stores the article's real abstract instead. PMID:4869291 (hypovolemic shock) and PMID:5697815 (metabolic acidosis) were removed -- PubMed holds no abstract at all for the former, and the latter's abstract is about oral glucose-electrolyte absorption and never mentions acid-base balance, so neither reference supports the claim its explanation inferred from the title. PMID:6680124 (stool culture) was kept and requoted from its abstract, since it does describe culture-based identification of V. cholerae. Both affected nodes retain other cited evidence. The four empty snippets in progression[3] are also resolved: each was supports: NO_EVIDENCE with an empty snippet and an explanation saying the abstract does not cover the first 24-48 hours, so they recorded a search rather than evidence. They are replaced by a 'Left deliberately uncited.' note on the phase naming all four PMIDs and what each does cover, recorded in review_notes, which is the slot CLAUDE.md names for a waiver and which no template renders -- notes: is disease content and would have shown the search record on the Cholera page as though it described the Early Acute phase. The two removed claims keep direct support: PMID:28957470 is already cited in this entry and its verified snippet names both hypovolemic shock and metabolic acidosis, so it now carries both nodes. The three repaired snippets were also deleted from tests/title_snippet_baseline.txt by hand, since that file may only ever shrink.

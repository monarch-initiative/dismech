  summary: 'Create: Cardiomyopathy_Dilated_2I'
  details: |
    Created CMD2I (MONDO:0957545; CAP2, hgnc:20039; OMIM 620462) for claim issue #13720. Deep research: claude_code provider (falcon fallback), report research/Cardiomyopathy_Dilated_2I-deep-research-claude_code.md. Human evidence is five genotyped homozygous patients in four families: PMID:30518548 (Bedouin splice variant, two children), PMID:33083013 (Pakistani nonsense allele), PMID:34862840 (neonate, c.1288delT, nemaline rods, transplant at 1 year), PMID:42344352 (5-year-old, c.551G>A p.Trp184Ter, rhinovirus-associated decompensation). Mechanism chain: biallelic LoF -> CAP2 protein deficiency (patient fibroblasts/iPSC-CMs) -> disordered actin filament dynamics -> impaired alpha-actin isoform switch/myofibril maturation, MRTF-SRF activation and conduction-system dysfunction (mouse) -> sarcomere disarray/fibrosis -> impaired contractility -> DCM, reduced LVEF, heart failure. Model evidence from PMIDs 22945801, 26616005, 26925136, 30762586, 33742108, 30962377, 33637797, 23022774, all graded MODEL_ORGANISM or IN_VITRO. Discussions record the few-family evidence base, mouse extracardiac mismatch, the conflicting reports on DCM in cardiomyocyte-specific knockout mice, the cell-type-dependent SRF direction, and the single-case infection second-hit hypothesis. No ClinGen CGGV record for CAP2, so gene_disease_validity left empty. check-genereviews --online: NO_CHAPTER for GeneReviews and StatPearls. Full texts of PMIDs 30518548 and 34862840 were unavailable (no PMC copy), so SVT details and the splice HGVS are not quoted. Validation: just validate passed (101 snippets, 0 issues); count-verified-snippets 101/101; check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-snippet-length, check-snippet-grading, check-title-snippets, check-coarse-phenotypes all OK; model-scale-audit 8/8 ALIGNED.
    Review fixes: added edges to Myocardial Fibrosis, increased BNP and Hepatomegaly (phenotype connectivity 10/16); replaced the over-claimed SVT phenotype with Cardiac conduction abnormality (HP:0031546), sourced from PMID:30518548; corrected the consanguinity count to two of four families; removed a REFUTE item on the MRTF-SRF node; replaced the actin->MRTF-SRF and isoform->disarray edge evidence with result sentences (PMID:30762586, PMID:33742108); moved the viral-trigger limitation to its discussion and added the patient's unvaccinated status; added fibrosis and EUCOMM-colony caveats, a GenCC AD/Supportive conflict note, and GO:0003785 actin monomer binding; removed relationship_type CAUSATIVE because CAP2 has no external tier. Re-validation: validate 106 snippets/0 issues; count-verified-snippets 106/106; entity-refs, causal-targets, duplicate-keys, snippet-length, snippet-grading, retired-support-prose and gene-activity grounding all OK; model-scale-audit 8/8 ALIGNED; validate-disorders passed.

  details: |
    Addressed ai4c-reviewer's CHANGES_REQUESTED review on PR #8646 (issue #6307 tracker). (1) Reverted Decreased Visual Acuity from OCCASIONAL back to FREQUENT: the OCCASIONAL re-band rested on a presenting-complaint denominator (Abramson 1998, 7.7% poor-vision presenting sign) mismatched to the phenotype's disease-course claim; cited the already-cached Dimaras review sentence instead (22% near-normal acuity in macular-tumor eyes) and retained the Abramson figure with an honest presenting-complaint caveat. (2) Added honest population-selection caveats to the Leukocoria and Strabismus frequency-band explanations, naming both the high-risk enucleated subcohort (PMID:41567907) and the larger unselected series (PMID:9544909) rather than silently picking whichever cohort supported the existing band. (3) Added a Disease-to-Phenotype evidence item to Ocular Pain from PMID:27189421 (orbital retinoblastoma pain quote), and made explicit that the OCCASIONAL frequency is a Pattern D clinical estimate per docs/frequency-evidence-guidelines.md, not a cohort-derived figure. (4) Extended the Melphalan/intra-arterial-chemotherapy snippet to include the micro-catheter/femoral-artery clause per reviewer suggestion. (5) Added a top-level references: block tagging PMID:20301625 as GeneReviews via scripts/tag_references.py (not hand-written), and mined its Management section per the reviewer's minimum ask: two new treatments -- Surveillance Eye Examinations in Germline RB1 Carriers (NCIT:C38060, MONITORING) and Avoidance of Radiation and DNA-Damaging Agents in Germline Carriers (COUNSELING_INFORMATIONAL, free-text treatment_term since no fitting NCIT action term exists) -- each with a verbatim GeneReviews snippet. Left for follow-up, as the reviewer explicitly allowed: full four-section GeneReviews mining (the Genetic Counseling section's 50%-transmission and 1.2%-germline-mosaicism figures), the Chemotherapy-treatment IVC/IAC route-splitting suggestion, and target_mechanisms pathograph links on treatments -- none of these were part of the reviewer's blocking ask. Validation: just validate (schema+terms+references pass, 24/24 snippets verified against cache, pre-existing EGA dataset WARNs unrelated), just validate-disorders (full pre-PR sweep), just count-verified-snippets, just check-duplicate-keys, just check-term-cache-integrity, just check-reference-cache-frontmatter all clean. just check-title-snippets flagged two pre-existing occurrences in unrelated files (SNAP25_Encephalopathy.yaml, Yolk_Sac_Tumor.yaml) already on origin/main, not touched by this change.

  summary: 'Review: scope ''most common intraocular malignancy'' claim to children'
  details: |
    Claim-evidence correctness review of 10 eye-disorder entries.

    The histopathology description claimed 'Retinoblastoma is the most common
    intraocular malignancy.' The cited source (PMID:41567907) says 'the most common
    intraocular malignancy IN CHILDREN', and the snippet had been truncated at
    exactly 'most common intraocular malignancy in' -- which passes substring
    validation while dropping the qualifier that makes the claim true. In adults,
    uveal melanoma is the most common primary intraocular malignancy.

    Changes: scoped the description to children and stated the adult contrast;
    extended the snippet to 'most common intraocular malignancy in children.' so the
    quoted text carries the full claim; added evidence_source: HUMAN_CLINICAL, which
    was absent.

    Generalizable signal: truncating a snippet mid-clause to make it match is a red
    flag, because the dropped words often carry the scope limit. Recommended in the
    review report as a candidate advisory lint for just qc.

    Validation: linkml-validate, linkml-term-validator, and
    linkml-reference-validator all pass. The reference validator was control-tested
    on a scratch copy of this file (deliberately corrupted snippet) to confirm it
    actively checks rather than silently no-opping.

    Full review: docs/reports/eye-disorder-claim-evidence-review-2026-07-25.md

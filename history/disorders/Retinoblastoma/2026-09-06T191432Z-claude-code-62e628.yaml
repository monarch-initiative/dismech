  details: |
    Review round 3 on PR #8646, plus resolution of a merge conflict with main.

    Merge conflict resolution. main had independently gained curation on the same Retinoblastoma phenotype and treatment blocks, producing 11 conflicting regions. Resolved by keeping both curators' evidence rather than taking one side wholesale:

    - Leukocoria and Strabismus: kept this branch's added PMID:41567907 cohort items, and took main's reworded explanations for the PMID:27189421 snippets, which name Dimaras et al. as the source.
    - Decreased Visual Acuity: kept all three items - this branch's PMID:27189421 acuity figure and PMID:9544909 presenting-complaint rate, plus main's PMID:31956625 vision-loss figure.
    - Focal Therapy and Chemotherapy: both sides quoted PMID:27189421 with different snippets. Split each into two evidence items so neither quote is lost; the generic primary-treatments list from main and the modality-specific quote from this branch support the blocks differently. A reviewer may prefer to trim the generic one.
    - Enucleation: kept both this branch's PMID:41567907 item and main's PMID:27189421 item.
    - Secondary Malignancies and External Beam Radiation: took main's reworded explanations, and preserved this branch's two new treatments, Surveillance Eye Examinations and Avoidance of Radiation and DNA-Damaging Agents.

    Review feedback addressed:

    - Blocking 1, misattribution: the Ocular Pain explanation credited the presenting-signs cohorts to "Abramson/Fabian". PMID:41567907 is Suarez A, Rojas F, Camargo J et al., Cureus 2025, not Fabian. Corrected to "Abramson/Suarez", verified against references_cache/PMID_41567907.md.
    - Blocking 2, unsupported 50% figure: the Hereditary Retinoblastoma subtype description asserted a 50% transmission risk while carrying only Knudson PMID:5279523, which establishes germline-first-hit inheritance without quantifying it. Added a GeneReviews PMID:20301625 evidence item quoting the transmission risk directly, and cross-referenced the secondary-malignancy clause to the Secondary Malignancies phenotype where the osteosarcoma figure already lives.

    Also fixed, surfaced by validation: three PMID:20301625 items carried reference_title "Retinoblastoma (GeneReviews)", a disambiguating label rather than the cached title. The reference validator requires an exact title match and rejected all three. Set to the cached title "Retinoblastoma." Two of these were pre-existing on this branch; one was added in this round.

    Validation run on the merged tree: just validate passed with 33/33 snippets verified; check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values and check-snippet-grading all passed.

    Not done: the reviewer's remaining suggestions - mining the GeneReviews Clinical Characteristics and Diagnosis sections, splitting Chemotherapy into systemic and intra-arterial blocks, adding target_mechanisms to the six treatments, and populating references[0].findings - are left as follow-ups. They were marked non-blocking and each is a scope expansion beyond this PR's evidence-integrity brief.

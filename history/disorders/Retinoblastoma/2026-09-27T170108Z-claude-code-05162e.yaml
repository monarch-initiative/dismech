  details: |
    Genetics-gap issue 12275. Bound Hereditary Retinoblastoma to MONDO:0018160 and Sporadic Retinoblastoma to its sibling MONDO:0018161 non-hereditary retinoblastoma, both with RB1 (hgnc:9884); added MYCN (hgnc:7559) to the MYCN-amplified RB1-wildtype row, which names the gene in its description and cites the TCGA-style series for it. Every phenotype was previously unconnected. Six causal edges were added: the four ocular features from Uncontrolled Retinal Cell Proliferation, and Trilateral Retinoblastoma plus Secondary Malignancies from Germline RB1 First-Hit Inactivation, because both are germline-dependent second primaries rather than sequelae of the eye tumour. Phenotype inlink measured with causal_inlink_coverage went 0/6 to 6/6; gene wiring stays 1/1. No new references. validate-disorders over the 13 changed files reported 898/898 snippets verified and 0 issues.

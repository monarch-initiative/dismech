  summary: Add evidence for Retinoblastoma phenotypes/treatments (issue 6307)
  details: |
    Closed most of the remaining evidence-discipline gap from issue #6307's cancer-predisposition follow-up tracker: Retinoblastoma phenotypes (Leukocoria, Strabismus, Decreased Visual Acuity, Secondary Malignancies) and treatments (Focal Therapy, Chemotherapy, Enucleation, External Beam Radiation) previously carried no evidence items. Added exact-quote evidence from PMID:27189421 (Dimaras et al., Nature Reviews Disease Primers 2015) and PMID:31956625 (Padma et al., epidemiology/clinical features cohort) for six of the eight items. Ocular Pain was intentionally left without new evidence: no exact-quote source explicitly attributing pain to retinoblastoma (vs secondary glaucoma generically) was found in this pass. Validated with just validate, count-verified-snippets (17/17 verified), validate-terms, validate-disorders, check-duplicate-keys, and the five ungated CI gates (folded-hyphens, snippet-length, title-snippets, environmental-evidence, duplicate-keys).

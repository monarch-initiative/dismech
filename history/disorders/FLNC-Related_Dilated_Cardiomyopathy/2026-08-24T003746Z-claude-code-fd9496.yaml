  summary: 'Create: FLNC-Related Dilated Cardiomyopathy'
  details: |
    Curated the truncating-FLNC dilated and left-dominant arrhythmogenic cardiomyopathy, named after the ClinGen gene-disease pair (FLNC / dilated cardiomyopathy, Definitive, AD, Dilated Cardiomyopathy GCEP) per ClinGen convention rather than after a numbered phenotypic-series locus. disease_term deliberately left unmapped: no numbered CMD class exists for FLNC dilated cardiomyopathy, MONDO:0016189 is a filaminopathy class spanning the myopathies, and MONDO:0005021 is the general umbrella - recording no term is more honest than asserting a mapping the concept lacks. Five-node pathograph: truncating variant causing haploinsufficiency, failure of sarcomere attachment to the sarcolemma, myocardial fibrosis and ventricular dilation, arrhythmogenic substrate with malignant ventricular arrhythmia, sudden cardiac death and end-stage heart failure; conforms to cardiomyopathy_maladaptive_remodeling at trigger, remodeling and structural-impairment nodes. The allele-class dichotomy is curated as evidenced rather than assumed - truncating variants were absent from 1078 HCM patients and truncating carriers' myocardium shows no filamin C aggregates - which partitions this entry cleanly against Hypertrophic_Cardiomyopathy_26 (non-truncating) and Myofibrillar_Myopathy. Clinical caveat preserved on both the amplifier node and the ICD treatment: malignant ventricular arrhythmia occurs at mild-to-moderate systolic dysfunction so EF-based thresholds under-call prophylactic defibrillator need. Deliberately NOT added to the Familial Dilated Cardiomyopathy grouping (arrhythmogenic rather than isolated-dilated phenotype; unmapped entry cannot satisfy the grouping's verified all-members-are-MONDO-children claim). 21 snippets verified; schema, terms and all offline CI gates pass.

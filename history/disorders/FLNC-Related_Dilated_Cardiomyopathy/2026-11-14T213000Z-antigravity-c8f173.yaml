  details: |
    Removed the unsourced 12- to 18-month surveillance interval from Transthoracic Echocardiography. Narrowed Heart Failure Pharmacotherapy to symptomatic volume and systolic-dysfunction management targeting Myocardial Fibrosis and Ventricular Dilation (MODULATES) with NCIT:C448 (Diuretic) therapeutic_agent, removing the unsupported antiarrhythmic wording, methods-disclaimer quote, and INHIBITS link to Sudden Cardiac Death and End-Stage Heart Failure. Retargeted Implantable Cardioverter-Defibrillator to INHIBITS on Sudden Cardiac Death and End-Stage Heart Failure, replaced the citation-fused fibrosis snippet with clean abstract and background quotes from PMID:33978673, and tagged the PMID:27908349 filamin C function quotes with quote_role: BACKGROUND.

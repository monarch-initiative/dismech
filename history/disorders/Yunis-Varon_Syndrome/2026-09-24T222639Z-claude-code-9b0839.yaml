  details: |
    Addressed the round-1 review of PR 12730. Added frequency bands, each with an evidence item quoting its row in the literature column of Table 1 of PMID:39669591, to thumbs, halluces, distal phalanges, clavicles, micrognathia, pelvic dysplasia, hip dislocation, wide fontanelles, calvarial ossification, short philtrum, proptosis, anteverted nares, low-set or dysplastic ears, sparse scalp hair and the pooled corneal opacity or cataract finding; added the table row to osteopenia. Where a row pools two findings (absent or hypoplastic digits, fontanelles or sutures, low-set or dysplastic ears, corneal opacity or cataract) the phenotype says so in notes; the ears row is 30/30 but recorded as VERY_FREQUENT, not OBLIGATE, because it is a union. Added an entry-level note that the table pools clinically diagnosed literature cases, many molecularly unconfirmed (PMID:42661261), and that its CNS rows pool YVS with FIG4/VAC14 brain-anomaly cases. New phenotypes from the table: absent eyelashes, short upper lip, high palate, redundant neck skin, nail aplasia/hypoplasia, single transverse palmar crease, decreased number of sternal ossification centers (HP:0006611 rather than HP:0006628, which means an unossified sternum), aplasia/hypoplasia of the nipples, and genital anomalies (HP:0000078 with coarse_binding_basis SOURCE_UNSPECIFIED). Labiogingival retraction was not added: OLS searches for labiogingival, gingival retraction, lip retraction, upper lip retraction, retracted and everted lip returned no matching HPO term (Gingival recession HP:0030816 is periodontal). Added seizures and peripheral neuropathy without frequency, because the table's CNS figures pool YVS with brain-anomaly cases and the paper states older YVS cases did not describe them. Added bone fracture from the introduction of PMID:40860339 (quote_role BACKGROUND). Death in infancy: removed the edge from CNS dysfunction, which implied neurological death is the usual route; the description now gives the respiratory cause and the longer survival of four of the five patients in PMID:39669591, with that paper's sentence as evidence, and the phenotype is left unwired because no source ties the respiratory deaths to an upstream mechanism. The top-level description now says often lethal in infancy instead of usually lethal. Added PMID:7496176 evidence to the vacuolation to vacuolar myopathy edge, a note that PROTEIN_REPLACEMENT on growth hormone is a platform class and the abstract reports no GH deficiency, and a diagnosis item for the post-diagnostic evaluation recommended by PMID:39669591. Validation: just validate, validate-terms, count-verified-snippets (125/125), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, check-folded-hyphens, validate-history and validate-disorders all passed.

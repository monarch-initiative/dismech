  summary: 'Create: Yunis-Varon_Syndrome'
  details: |
    De-novo curation of Yunis-Varon syndrome (MONDO:0008995) as a Disease entry. FIG4 is the established causal gene; VAC14 is recorded as a second gene from a single-patient report (PMID:28635952), without subtypes. Pathophysiology is a causal chain from biallelic FIG4 (or VAC14) loss of function to PI(3,5)P2 deficiency, defective lysosome fission (TRPML1 calcium efflux) and impaired autolysosome recycling, endolysosomal vacuolation, then neuronal vacuolar degeneration, vacuolar myopathy and osteoblast dysfunction with reduced bone formation, reaching the neurological and skeletal phenotypes. The patterned digital and clavicular aplasia is linked only at the genotype level and recorded as a knowledge gap. The Perplexity deep-research report was used as a lead only. Its reference validation resolved all 3 extracted references; most of its narrative citations were web pages (OMIM, Orphanet, NORD, Wikipedia, MalaCards) and were not cited. Its term validation flagged 37 mislabelled and 3 nonexistent CURIEs (HP:0002556, HP:0000898, GO:0101001); no CURIE was taken from the report, every binding was looked up in the term caches or via OLS. preflight-dr returned WARN for VAC14 mentions; VAC14 is a genuine second YVS gene, not a different disease entity. The report's DOI citation for the deep intronic variant was replaced by its PMID (40860339). Frequencies come from the 2024 literature review (PMID:39669591) and 2026 systematic review (PMID:42661261). No GeneReviews or StatPearls chapter exists (check-genereviews: NO_CHAPTER). Three snippets from PMID:17572665 initially failed because the committed cache for that PMID is an HTML page the validator refuses as stale full text; they were replaced with abstract sentences or other sources. Death in infancy is left unbound because HP:0001522 is outside the PhenotypeTerm enum. Validated with just validate, validate-terms, count-verified-snippets (all snippets verified), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, the whole-KB snippet/title/grading/hyphen/coarse/reference-title gates, and validate-disorders.

  summary: 'Address review items: Microcephaly-Capillary_Malformation_Syndrome'
  details: |
    Addressed the two outstanding IMPORTANT reviewer items on PR #7535; both additive, no existing content rewritten.

    (1) Added four HPO-bound phenotype entries that were absent and not covered by the entry's deliberate-omission note: Cerebral atrophy (HP:0002059), Central hypotonia (HP:0001290 Generalized hypotonia, with the central qualifier carried in preferred_term), Peripheral hypertonia (HP:0001276) and Recurrent pneumonia (HP:0006532). Cerebral atrophy names pathophysiology node 'Progressive Microcephaly and Cortical Atrophy' and appears in the top-level description but previously had no phenotype entry; the central-hypotonia/peripheral-hypertonia dissociation was prose-only inside Spastic tetraparesis and not queryable. All snippets are byte-exact substrings of already-committed cache files (PMID:21815250, PMID:23542699, PMID:24354023, PMID:31638258) - no fetch-reference was needed and no new cache file was added. Indirect evidence (GeneReviews management statements) is marked supports: PARTIAL. No frequency band was asserted on any of the four because no published series reports a denominator.

    Ontology-term discipline: HP:0032361 was explicitly NOT used - runoak confirms it is 'Decreased post-bronchodilator forced expiratory flow 25-75%', an unrelated spirometry term - and HPO's specific 'Central hypotonia' term HP:0011398 is obsolete, hence HP:0001290. Every added term was verified with 'uv run runoak -i sqlite:obo:hp info <ID> -O obo' and labels match exactly. The rationale is recorded in the notes: block so a future curator does not re-litigate it.

    (2) Added a classifications: block. harrisons_chapter NEUROLOGIC (primary clinical home - a developmental and epileptic encephalopathy with progressive microcephaly, cortical atrophy, spastic tetraparesis and profound developmental delay; the capillary malformations are diagnostically decisive but clinically inert) plus GENETICS_ENVIRONMENT_DISEASE (secondary - monogenic autosomal recessive STAMBP disorder diagnosed by molecular testing). Also mechanistic_category: proteotoxic disease, defensible from the entry's own ubiquitin-conjugate/p62/TDP-43 aggregation evidence and marked PARTIAL because the aggregate phenotype is shown in patient lymphoblastoid cells and mouse brain rather than human MIC-CAP brain. icimd_category and iuis_category were deliberately NOT populated - MIC-CAP is neither an inherited metabolic disorder nor a primary immunodeficiency.

    Also wired target_phenotypes onto two existing treatments (Gastrostomy Feeding -> Feeding difficulties, Failure to thrive, Recurrent pneumonia; Seating/Bracing/Physical Therapy -> Central hypotonia, Peripheral hypertonia, Spastic tetraparesis), and cross-referenced the two new tone entries from the Spastic tetraparesis description.

    Validation: 'just validate' clean (schema no issues, term validation passed, references 143/143 snippets verified); 'just validate-references' clean; 'just compliance' shows 100% on all new classifications and phenotype paths. references_cache/ churn from issue #7507 was reverted with 'git checkout -- references_cache/' before staging; no reference cache files were fetched or committed.

  summary: 'Create: Microcephaly-Capillary_Malformation_Syndrome'
  details: |
    Created the microcephaly-capillary malformation (MIC-CAP) syndrome entry end
    to end: STAMBP (hgnc:16950), MONDO:0013659, OMIM:614261.

    NEC preflight was run before any content was written. `uv run runoak -i
    sqlite:obo:mondo info MONDO:0013659 -O obo` confirmed the gene relation
    `relationship: RO:0004003 HGNC:16950 ! STAMBP` and `xref: OMIM:614261`. The
    entry explicitly disambiguates MIC-CAP from megalencephaly-capillary
    malformation (MCAP, PIK3CA), both in the top-level description and as a
    curated differential_diagnoses entry. Note: the correct MONDO ID for MCAP is
    MONDO:0011240 (OMIM:602501). MONDO:0013192, which is sometimes cited for
    MCAP, is actually "spondyloarthropathy, susceptibility to, 3" - this was
    caught by `just validate-terms` and corrected.

    Deep research provider that actually ran: claude_code. Neither EDISON_API_KEY
    nor FUTUREHOUSE_API_KEY was set, so falcon was not available. Report:
    research/Microcephaly-Capillary_Malformation_Syndrome-deep-research-claude_code.md
    (6 web searches, 91 turns, 32 citations, ~19 min).

    GeneReviews baseline: PMID:24354023 "Microcephaly-Capillary Malformation
    Syndrome" (Carter, Mirzaa, McDonell, Boycott; 2021 update) was located via
    PubMed, fetched with `just fetch-reference`, tagged `GeneReviews` in the
    top-level references block, and every phenotype in its Clinical
    Characteristics section was cross-checked into the phenotypes block
    (microcephaly, generalized cutaneous capillary malformations, hypoplastic
    distal phalanges, early-onset intractable epilepsy, profound developmental
    delay, focal/tonic/complex-partial seizures and infantile spasms, myoclonus
    of limbs and eyelids, dyskinetic and choreiform movements, central hypotonia
    with peripheral hypertonia). Its Agents/Circumstances to Avoid item
    (valproic acid) is curated as a dedicated treatment-safety entry.

    Content curated: 9 pathophysiology nodes with wired downstream edges running
    AMSH K63-linked deubiquitinase loss -> ESCRT-dependent endosomal sorting
    failure -> four parallel arms (ubiquitin-conjugate aggregation and
    proteostatic stress; constitutive serum-insensitive RAS-MAPK and
    PI3K-AKT-mTOR signaling feeding the dermal capillary malformations; impaired
    neural stem/progenitor proliferation; NLRP3 inflammasome derepression and
    neuroinflammation) -> region-selective neuronal apoptosis -> progressive
    microcephaly and cortical atrophy. Also curated: 25 HPO-bound phenotypes with
    frequencies, structured prevalence (CASES_IN_LITERATURE / ULTRA_RARE), a
    four-phase progression block, genetic and autosomal-recessive inheritance
    blocks (including the uniparental-isodisomy recurrence-risk distinction), 9
    treatments (multidisciplinary supportive care, anticonvulsant polytherapy,
    vigabatrin with an explicit n=1 caveat, the valproic-acid caution,
    gastrostomy, seating/bracing, a documented ketogenic-diet failure, genetic
    counseling, and the preclinical AAV9 gene-replacement prospect wired via
    target_mechanisms), 4 differential diagnoses (MCAP, primary autosomal
    recessive microcephaly, CM-AVM, Sturge-Weber), 2 animal models, 3
    experimental models, 2 mechanistic_hypotheses, and 4 discussions including a
    HUMAN_MODEL_MISMATCH for the mouse-apoptosis versus human-organoid-
    proliferation discrepancy.


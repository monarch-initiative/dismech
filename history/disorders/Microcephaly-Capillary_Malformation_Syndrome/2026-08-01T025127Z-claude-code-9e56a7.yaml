  summary: Red-team review fixes for MIC-CAP (STAMBP)
  details: |
    Adversarial red-team review of PR #7535.

    NEC re-check: uv run runoak -i sqlite:obo:mondo info MONDO:0013659 -O obo confirms
    relationship RO:0004003 HGNC:16950 STAMBP and xref OMIM:614261, and the entry
    disease_term, synonyms and gene all match. No absorption of the confusable
    neighbour MCAP/MONDO:0011240/PIK3CA.

    Fabrication sweep: a script walked every evidence item in the YAML, confirmed the
    matching references_cache file exists, and whitespace/unicode-normalized
    substring-matched every snippet. All 20 distinct PMIDs were also re-checked live
    against the PubMed esummary API - every one exists and its title matches the
    curated reference_title. No fabricated PMID and no fabricated snippet was found.

    Fixes applied in this review commit:
    - Replaced four topically-unrelated filler snippets (Simplified gyral pattern,
      CNS hypomyelination, Hypoplastic hippocampus, Small nail) with exact quotes
      from the PMC full text of PMID:21815250.
    - Removed the Hypoplasia of the corpus callosum phenotype. Its only citation said
      nothing about the callosum, and the string "corpus callosum" appears in none of
      the MIC-CAP references cited here - the only occurrence is in the PIK3CA/MCAP
      GeneReviews (the confusable neighbour, where the callosum is thick).
    - Added a diagnosis: section (previously absent) mining the GeneReviews
      DIAGNOSIS/TESTING sentence, the exome-sequencing route, and the normal
      metabolic/infectious workup.
    - Added a histopathology: section for the published dermal biopsy finding, and
      corrected two statements that wrongly asserted no skin biopsy had ever been
      published in MIC-CAP.
    - Added the Minor congenital heart malformation phenotype (3/5 in the original
      series), previously absent.
    - Downgraded three overstated SUPPORT evidence items to PARTIAL (spastic
      tetraparesis, failure to thrive, feeding difficulties) where the snippet
      supports management need rather than the phenotype claim.
    - Removed the Purkinje cell cell_type annotation from the neuronal-apoptosis
      node, whose own evidence states cerebellar neurons are spared.
    - Corrected the congenital hypothyroidism frequency band (VERY_RARE to
      OCCASIONAL, 2/15 families) and removed an unverifiable 0/15 copy-number claim.
    - Added evidence blocks to two experimental_models findings that had only
      supporting_text.

    Validation after: just validate passed (schema, terms, references);
    131/131 snippets verified; compliance 90.3 percent (up from 89.5).

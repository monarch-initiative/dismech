  summary: Review Blau Syndrome
  details: |
    Reframed familial Blau syndrome and sporadic early-onset sarcoidosis as one NOD2-associated spectrum; documented de novo occurrence, incomplete penetrance, and variant-interpretation limits; replaced a universal constitutive NF-kappaB model with parallel IFN-gamma-primed and defective NOD2-RIPK2-IRF4 cross-regulation branches; rebuilt the granulomatous causal pathograph with evidence on every edge and complete phenotype/gene connectivity; strengthened diagnosis, histopathology, treatment uncertainty, live trial status, the GSE98454 dataset, and open knowledge gaps; removed an unsupported L469F assertion and unrelated inflammatory-bowel-disease evidence; and added an evidence-equal 24-source bibliography with generator-produced caches.

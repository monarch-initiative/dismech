  summary: Address Blau Syndrome review follow-up
  details: |
    Addressed both non-blocking reviewer suggestions and strict audit findings. Verified that the repository-local GeneReviews corpus contains no Blau syndrome, early-onset sarcoidosis, or NOD2 chapter and that the official NCBI GTR Blau condition row has no GeneReviews link, so no reference was tagged or mined. Confirmed HP:0006530 uses the canonical label Abnormal pulmonary interstitial morphology while Interstitial lung disease is an exact HPO synonym and documented that intentional display choice. Restored the inherited deprecated updated_date instead of advancing it, corrected the narrative-review and HEK293 evidence_source classifications, and aligned their explanations with the represented study arms. Removed treatment-style phenotype targets from the non-therapeutic ophthalmic monitoring action while retaining its clinical purpose in the description and evidence.

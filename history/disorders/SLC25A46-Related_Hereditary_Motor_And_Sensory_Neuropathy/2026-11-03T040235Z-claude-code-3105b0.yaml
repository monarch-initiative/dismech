  summary: 'Create: SLC25A46-Related Hereditary Motor And Sensory Neuropathy'
  details: |
    Created the entry for MONDO:0014671 (HMSN6B, SLC25A46) from a claim on issue #16350.

    Deep research. falcon was the requested provider and is unavailable in this session: the egress proxy refuses platform.edisonscientific.com and api.futurehouse.org (connect_rejected), so the Edison client fails at authentication. The documented --fallback mechanism cannot record this failure mode, because the Edison client raises at construction, before the client's fallback logic runs; this was tried twice, once with --fallback alone and once with an explicit --fallback-provider order, and neither engaged. openscientist is blocked the same way (api.openscientist.io). The report used is therefore research/SLC25A46-Related_Hereditary_Motor_And_Sensory_Neuropathy-deep-research-claude_code.md, run with the claude_code provider, which needs no external host. Its reference validation is 14/14 resolved, 0 unresolved, 0 off topic; needs_review is set only by two benign label artifacts (the report wrote 'MONDO' as the label of MONDO:0014671, and 'Autosomal recessive' for HP:0000007, which HPO lists among that term's other names). just preflight-dr returns WARN on a second-gene signal for 'CDC' at 16 mentions; all 16 are in the template's own echoed search-source instructions, not in disease content, so the WARN is a false positive. OMIM matches on both sides (616505) and SLC25A46 is mentioned 30 times.

    Scope and naming. The entry is scoped to the neuropathy-with-optic-atrophy rung of the SLC25A46 allelic spectrum. PCH1E (MONDO:0030260) was already curated as a has_subtypes row on Pontocerebellar_Hypoplasia and is cross-referenced in differential_diagnoses rather than duplicated; SLC25A46-related Leigh syndrome is a separate ClinGen pair (Limited) and is likewise a differential. The gene-related name follows the entry-naming skill: it is established as a MONDO EXACT synonym of the bound term, and the 'type 6' suffix is dropped because HMSN type 6 is the parent class containing MFN2-related 6A and PDXK-related VIc.

    GeneReviews. No SLC25A46-specific chapter exists. PubMed genereviews[book] searches for SLC25A46 in title or abstract and for the gene symbol both return zero. The Charcot-Marie-Tooth Hereditary Neuropathy Overview (PMID:20301532) is tagged as the disease-family baseline, but its abstract is only a statement of chapter purpose, so no phenotype rests on it; this is recorded in notes as the entry's main limitation.

    Content. 13 pathophysiology nodes forming a connected chain from the biallelic lesion through protein destabilisation, loss at fission/fusion sites, the three partner-complex branches (fusion GTPase oligomerisation, MICOS/cristae, ER-contact lipid transfer), bioenergetic failure and impaired organelle trafficking, to degeneration of peripheral axons, retinal ganglion cells and Purkinje cells, each wired to its phenotypes. Five conforms_to links to peripheral_axonal_degeneration, membrane_contact_site_dysfunction and cerebellar_purkinje_degeneration. 17 phenotypes, three mouse/zebrafish models with typed divergences, ClinGen Definitive gene_disease_validity copied from the CGGV record, and two KNOWLEDGE_GAP discussions: the unresolved fission-versus-fusion direction (recorded with REFUTE evidence on both sides rather than smoothed over) and the unexplained tissue selectivity.

    Judgement calls recorded rather than hidden. One phenotype carries a deliberate NO_EVIDENCE item explaining that the GeneReviews abstract cannot support it; two carry no evidence at all because no SLC25A46 report states them; the electrophysiology phenotype is bound to the parent HP:0040129 rather than HP:0003431 because the human pattern is axonal; cerebellar atrophy carries a REFUTE item against its universality.

    Validation. just validate passes (schema, terms, references). just count-verified-snippets reports 80/80 verified. Per-file gates clean: duplicate-keys, block-scalar-comments, enum-values, entity-refs, causal-targets, coarse-phenotypes, qualifier-terms, delivery-system, logical-rules. Whole-tree ratchets clean: folded-hyphens, snippet-length, title-snippets, reference-titles.

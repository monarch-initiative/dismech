  summary: 'Review round 1: source two phenotypes a false note called unevidenced;
    rebind the electrophysiology term'
  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED review on PR #16384 (review 5754384915). All six findings and both suggestions were verified against the cached references before being acted on; every one was correct.

    Finding 1, the serious one. The entry's notes asserted that no SLC25A46 report states pes cavus or reduced visual acuity. Both claims were false, and both were refuted by papers the entry already cited: PMID:30178502's genotype table lists Pes cavus in the p.Arg340Cys patient, PMID:28558379 reports 'Skeletal abnormalities such as scoliosis and hollow feet were found', and the same paper reports 'The eye exam revealed bilateral divergent strabismus, a decrease in visual acuity and an optic atrophy in both eyes' plus a second patient who 'presented at age 6 with a decrease in visual acuity'. Both phenotypes now carry that evidence, the note is corrected, and the correction itself is recorded in the entry's notes, because a false statement that no source exists is worse than a missing citation: it tells the next curator not to look. This is the second instance of that failure class in this entry, after the reflex note corrected in the previous round, and both were written in the same session.

    The scoliosis in that same sentence was not curated at all, so a Scoliosis phenotype was added and wired through trunk muscle imbalance.

    Finding 2. Reduced visual acuity was supported only by a sentence naming optic neuropathy without mentioning acuity, and carried a FREQUENT band with no basis. It now cites the two examination findings above, the band is dropped, and the original sentence is kept as an INDIRECT item for the slowly progressive course.

    Finding 4. The phenotype named 'Decreased motor nerve conduction velocity' contradicted its own binding and its own notes, which said velocities are relatively preserved and that asserting a decrease would misstate the finding. Renamed to Decreased compound muscle action potential amplitude and rebound to HP:0033383, which is what the axonal pattern actually changes; the downstream target was retargeted and the notes rewritten to explain why neither velocity term fits.

    Finding 5. Physical Therapy was supported by 'Currently, there is no cure for mitochondrial disorders', a general sentence from a mouse AAV paper's introduction. Replaced with the disease-specific 'there is currently no treatment for the disease' from PMID:36578309, graded INDIRECT because it establishes the absence of a disease-modifying option rather than evaluating physical therapy.

    Finding 6. The tissue-selectivity discussion's expression item was graded IN_VITRO for a sentence restating prior in-situ data. Regraded OTHER with quote_role: BACKGROUND, because the quoted sentence does not say what kind of study produced the data and grading it as a cell-culture result would be a guess.

    Finding 3 and the second suggestion. The Myoclonus and Spasticity frequency bands were removed, and a sentence was added explaining why the spasticity-predominant presentation stays inside this entry's rung: it is the same biallelic lesion on the same long-axon targets with the pyramidal tract dominating, it is not separately named, and MONDO gives it no term.

    A process failure worth recording. Findings 3 and 6 here, plus four fixes from the previous round (the visual-acuity wording, two quote_role values, and the fibroblast REFUTE item), had been reported as applied in commit b5a00c985 and were not in it. The edit script for that batch raised an assertion on its last replacement and exited before writing the file, so the whole batch was silently lost while the preceding batches had already been written. The commit message and the PR body therefore both overstated what had landed. All of them are applied here, and each edit in this round was verified by reading the written file back rather than by trusting the script's exit.

    CI failures fixed in the same round. The test (3.13) job on b5a00c985 failed two
    gates I had not run locally, both of which I reproduced before fixing.
    find_missing_reference_titles found 8 evidence items in this entry with no
    reference_title; filled with scripts/backfill_reference_titles.py, which copies
    each title from the references_cache/ frontmatter rather than typing it.
    check-gene-activity-grounding found SLC25A46 reaching a pathophysiology node that
    bound no molecular function. Rather than grandfather it, the node now binds
    GO:0044877 protein-containing complex binding with modifier DECREASED: SLC25A46
    lacks the SLC25 signature motifs and has no identified substrate, so a transporter
    term would assert an activity its own literature denies, while complex binding is
    exactly what it demonstrably does (the fusion GTPases, MICOS through MIC60, and
    the ER membrane protein complex), and the entry already quotes primary sources for
    each of those interactions. The term was taken as a lead from the ai-gene-review
    ingest, which names it as SLC25A46's core molecular function, but is evidenced from
    the primary literature because ai-gene-review content is not citable as KB evidence.
    The reasoning is recorded in the entry's notes.

    Round 2 of review. Five of the six findings were accepted as fixed. Two remained,
    both correct and both applied.

    (A) The renamed Decreased compound muscle action potential amplitude phenotype had
    no snippet that mentioned amplitude: the human quote reached it only by inference
    and was not marked INDIRECT. PMID:36578309, already cited by the entry, states it
    directly ("A nerve conduction study showed reduced amplitude in median nerves,
    loss of response in sural nerves, and severely reduced and no certain motor
    response in right and left tibial nerves"), so that is now the DIRECT item and the
    PMID:30178502 one is regraded INDIRECT. The same paper also reports "slowed
    conduction velocity in both ulnar nerves", which contradicted the description's
    claim that velocities are relatively preserved; the description now says mostly
    preserved and cites that sentence, so the exception is stated rather than
    smoothed over.

    (B) A notes paragraph narrating the previous draft's false unevidenced claim was a
    revision log, which CLAUDE.md excludes from notes (#8908, #12535): it described a
    draft that never reached main, so a reader of the merged entry loses no fact about
    the disease by its removal. Deleted from the entry. The substance is preserved in
    this record's finding-1 paragraph above, which is where the rule puts it, so
    nothing about the error is lost.

    Validation. just validate passes. just count-verified-snippets reports 98/98 verified, up from 92/92. Phenotype causal connectivity 88.2%. Per-file gates clean: duplicate-keys, block-scalar-comments, enum-values, entity-refs, causal-targets, coarse-phenotypes, qualifier-terms, delivery-system, logical-rules, genereviews.

    Not done. The first suggestion asked for a citable source for OCT retinal-nerve-fibre-layer thinning or abnormal visual evoked potentials in the diagnosis block. The deep-research report mentions both, but no cached reference states either for SLC25A46 patients, so adding them would mean citing a source that does not say it. Left out, and said so on the PR.

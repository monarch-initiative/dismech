  summary: 'Create: Congenital Cataract-Severe Neonatal Hepatopathy-Global Developmental
    Delay Syndrome (CYP51A1)'
  details: |
    New entry for congenital cataract-severe neonatal hepatopathy-global developmental delay syndrome (MONDO:0033853; ORPHA:521432), attributed to biallelic CYP51A1 variants, created from stubs/Congenital_Cataract-severe_Neonatal_Hepatopathy-global_Developmental_Delay_Syndrome.yaml, which is removed. No gene-related name is established, so the MONDO label is kept in title case; lanosterolosis, used for CYP51A1 deficiency in PMID:43038916, is a synonym. CYP51A1 is bound to GO:0008398 sterol 14-demethylase activity, DECREASED, from loss of enzyme function and lanosterol accumulation in patient lymphoblastoid cells (PMID:40912167). The syndrome rests on two families: homozygous p.Leu232Pro with congenital cataract, neonatal fulminant hepatic failure with giant-cell cholestatic hepatitis, developmental delay and infant deaths in relatives (PMID:27878435), and a compound heterozygous p.Ile312Thr/p.Tyr421Ter child with cataract, developmental delay, spastic hemiparesis and neonatal cirrhosis, known here only through the 2025 review (PMID:40659633) because the original Gillespie reports (PMID:25148791, PMID:26233629) carry no quotable CYP51A1 text in their PubMed records. Isolated-cataract families (PMID:22935719, PMID:40912167) are cited for the gene's function and the cataract. The CYP51A1 record is typed UNKNOWN on this two-family evidence; ClinGen has not curated the gene. Mechanism nodes (lanosterol accumulation, impaired cholesterol synthesis, ferroptosis sensitivity, lens opacification, cholestatic liver injury) are supported by patient cells, the CYP51A1-knockout HepG2 line (PMID:39262789), the Cyp51 knockout mouse (PMID:21705796) and the authors' stated hypotheses. Itraconazole-induced lanosterol accumulation (PMID:43038916) is recorded as a biochemical mimic. Validation: linkml-validate, term validation (OLS), reference validator with --no-full-text (62 snippets, 0 issues), count-verified-snippets 62/62, check-entity-refs, check-causal-targets, check-name-collisions, check-gene-validity, check-enum-values, check-duplicate-keys, check-coarse-phenotypes, check-folded-hyphens, check-snippet-grading, list-gene-term-mismatches and check-genereviews (NO_CHAPTER) all pass.

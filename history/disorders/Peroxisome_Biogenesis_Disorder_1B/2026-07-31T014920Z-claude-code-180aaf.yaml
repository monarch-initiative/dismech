  summary: 'Create: Peroxisome Biogenesis Disorder 1B (PEX1 non-classic ZSD)'
  details: |
    Created the PBD1B entry (MONDO:0011101, OMIM 601539, PEX1).

    Curation-level decision: PBD1B and PBD4B are curated as distinct disease entries rather than folded into Zellweger Spectrum Disorders, because the A/B split within a PEX complementation group is a mechanistic statement (null vs residual peroxin function), not a bare severity label. The gene-agnostic downstream cascade stays on the ZSD entry; this entry carries the PEX1-specific hypomorph/residual-protein mechanism, the class I/class II genotype-phenotype rule, the attenuated degenerative phenotype, and the conformational-rescue therapeutic rationale.

    Deep research: Edison/falcon (primary; an initial attempt failed with HTTP 402 until the user supplied a working token) and claude_code. OpenScientist was attempted for both entries and timed out after 3600s in queue. NEC preflight passed: the falcon report is PEX1-dominant (53 PEX1 vs 11 PEX6 mentions) citing OMIM:601539 only, the claude_code report likewise (70 vs 9), and MONDO:0011101 was verified via OAK as is_a MONDO:0100259 (peroxisome biogenesis disorder due to PEX1 defect).

    Content: 5-node causal chain (hypomorphic PEX1 with residual peroxin-1 -> receptor export module insufficiency -> partial matrix protein import failure -> attenuated metabolic block -> progressive degenerative multisystem disease), 14 phenotypes, 5 biochemical markers with readouts, PEX1 genetics, 3 diagnostic modalities, 5 treatments. GeneReviews baseline (PMID:20301621) cross-referenced; every mild-end Clinical Characteristics item is represented. Key sources: Walter 2001 (PMID:11389485, residual PEX1 protein in NALD/IRD, 30C rescue of G843D), Rosewich 2005 (PMID:16141001, class I/II), Poll-The 2004 (PMID:15098231), Berendse 2016 (PMID:26287655), van Woerden 2006 (PMID:16621644), Karuntu 2024 (PMID:38664000, dedicated mild-PEX1 ophthalmic cohort, surfaced by falcon), Wangler 2023 (PMID:37567036, dicarboxylic acylcarnitines, surfaced by falcon), Hiebler 2014 (PMID:24503136), Berendse 2013 (PMID:24016303, arginine chaperone), Klouwer 2017 (PMID:28677031), Heubi 2017 (PMID:28644367, cholic acid), Ratbi 2015 (PMID:26387595, Heimler).

    Frequency discipline: only two frequency bands asserted, both with direct quantitative or explicit qualitative support - hyperoxaluria VERY_FREQUENT from 19/23 = 83 percent, and amelogenesis imperfecta VERY_FREQUENT plus osteopenia OCCASIONAL from the GeneReviews almost all / some wording. All other phenotypes omit frequency.

    Validation: just validate passes (schema, term and reference validation). Every snippet was verified as an exact substring of its cached abstract, and the reference validator was sanity-checked against a deliberately corrupted snippet to confirm it was actually testing. validate-graphs reports no findings for this file; its corpus-wide failures are pre-existing in other entries.

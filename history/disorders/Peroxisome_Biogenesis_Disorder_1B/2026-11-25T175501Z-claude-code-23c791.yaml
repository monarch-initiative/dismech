  summary: 'Gene-family review: PEX1'
  details: |
    The PEX1 genetic record is typed CAUSATIVE with germline origin. The hypomorphic PEX1 node keeps ATP hydrolysis activity (GO:0016887, DECREASED) and now cites PMID:40158855: in engineered human cells the common p.Gly843Asp protein binds PEX6 less well and is degraded by the proteasome, yet restores import when overexpressed, so the reduced PEX1-PEX6 activity reflects protein amount rather than a catalytic defect. ClinGen's PEX1 assertion in the citation cache is for the parent MONDO:0019234, not this entry's MONDO:0011101, so no tier was copied.

  summary: 'Create: Retinitis Pigmentosa 59'
  details: |
    New entry for retinitis pigmentosa 59 (MONDO:0013468), autosomal recessive DHDDS-related rod-cone dystrophy, curated from the claimed stub (stub deleted).

    Sources. Primary literature was gathered by PubMed search for DHDDS with retinitis pigmentosa, K42E and retina (all 33 hits screened), then cross-checked against an OpenScientist deep-research report (research/Retinitis_Pigmentosa_59-deep-research-openscientist.md). The report resolved 17/17 references (confabulation_rate 0.0, off_topic 0, 13 on topic, 4 undecided) and has no needs_review flag; quotes were not checked by the run. Its term section lists mislabelled CURIEs (for example NCIT:C233 given as acetazolamide, NCIT:C61796 as N-acetylcysteine) and the obsolete GO:0019408; none of these were used, and every CURIE in the entry was looked up in OLS or the term caches. just preflight-dr returned SKIP because it reads no RO:0004003 causal gene for MONDO:0013468; the MONDO record carries the gene only as an intersection_of axiom (RO:0004003 HGNC:20603). A manual check passed: the report cites OMIM 613861, matching MONDO, and DHDDS is its dominant gene (44 mentions). From the report's citations the entry uses PMID:42493417 (carbonic anhydrase inhibitors for RP macular edema); PMID:40003936 (DHDDS patient fibroblasts, neurodevelopmental context) was not used as out of scope, and the report's gnomAD allele-frequency figures were not used because they have no citable record. The report's claim that T206A occurs homozygously in patients was not adopted: the cited review states T206A has only been seen in trans with K42E.

    Content. Pathophysiology is a chain from DHDDS cis-prenyltransferase partial loss of function to dolichol chain shortening, then to four hypothesis-tagged branches: photoreceptor hypoglycosylation (ALTERNATIVE, with REFUTE evidence from normal transferrin and two mouse models), glycosylation-independent photoreceptor dolichol deficit, the knock-in mouse inner-retinal synaptic defect, and RPE contribution. Rod degeneration and secondary cone loss conform to photoreceptor_degeneration nodes; the rare systemic hypoglycosylation node (one adult K42E homozygote) conforms to congenital_disorder_of_glycosylation#Protein Hypoglycosylation. All 16 phenotypes are causally connected. Animal models cover rod- and RPE-specific knockouts, K42E and T206A knock-ins, zebrafish morphants and Drosophila RNAi, with FAILS_TO_RECAPITULATE links for the K42E mouse and rod knockout where they diverge from the human disease. The ClinGen Definitive classification for DHDDS is made against DHDDS-CDG (MONDO:1040054), not this term, so it is noted but not copied into gene_disease_validity. The dominant de novo DHDDS neurodevelopmental disorder and the fatal infantile compound-heterozygous DHDDS-CDG case are recorded as out of scope in notes. GeneReviews: only the Nonsyndromic RP Overview (PMID:20301590) exists; it is tagged, and its PubMed record carries no DHDDS-specific phenotypes.

    Groupings. Added a Retinitis Pigmentosa 59 member row (member_type DISEASE, DHDDS gene, dolichol-backbone biosynthesis as the proximal lesion, module photoreceptor_degeneration#Photoreceptor Gene Defect) to kb/groupings/Retinitis_Pigmentosa.yaml, and added RP59/MONDO:0013468 to that grouping's MONDO consistency note as a direct is-a child of MONDO:0019200. just check-groupings evaluates RP59 as SATISFIED on the grouping's NECESSARY criterion through both the photoreceptor_degeneration#Rod Photoreceptor Apoptosis conformance arm and the rod-cone dystrophy arm. The entry was deliberately not added to kb/groupings/Congenital_Disorders_of_Glycosylation.yaml. That grouping's NECESSARY criterion requires a defect that perturbs protein N-glycosylation. The entry's GO:0006487 annotations sit on a HYPOTHETICAL node carrying REFUTE evidence and on a single-case systemic node, so the evaluator's leaf match would be spurious. The reasoning is recorded in the entry's notes.

    Reference titles. Every one of the 88 evidence items carries a reference_title copied by script from the title frontmatter of its references_cache file, so no title was typed by hand.

    Validation. just validate, validate-terms, count-verified-snippets (88/88), check-entity-refs, check-causal-targets, check-duplicate-keys, check-coarse-phenotypes, check-folded-hyphens, check-environmental-evidence, check-enum-values, check-qualifier-terms, list-gene-term-mismatches (no findings) and just validate-disorders all pass. check-snippet-length, check-title-snippets and check-snippet-grading pass in their default --against-ref origin/main mode.

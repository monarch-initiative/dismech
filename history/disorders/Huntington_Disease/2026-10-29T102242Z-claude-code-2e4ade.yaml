  summary: 'Evidence-claim mismatch review: Huntington_Disease'
  details: |
    Reviewed Jev evidence-claim-mismatch findings (issue #15757). Three corrections: (1) Mutant Huntingtin Protein Aggregation node cited a review framing sentence about GWAS DNA-repair modifiers (PMID:41233526) that does not support protein aggregation; replaced with DiFiglia primary human postmortem evidence of N-terminal mutant huntingtin in neuronal intranuclear inclusions and dystrophic neurites (PMID:9302293). (2) zQ175 -> Genome-Wide Double Strand Break Accumulation RECAPITULATES link carried only general model-validity evidence (PMID:27378694); added link-level DSB-specific evidence (PMID:42091595) showing elevated, age-rising DSB levels in zQ175 striatal neurons. (3) Corrected two Sp1 evidence explanations that claimed the soluble-binding result supports the sequestration mechanism; the snippet (Sp1 binds soluble, not aggregated, mutant huntingtin) and the node corrected description both indicate functional inhibition by soluble species rather than physical sequestration into inclusions. Deliberately retained the contested CBP-depletion evidence (PMID:11264541), documented as an OPEN controversy. Validated with validate-disorders, count-verified-snippets, validate-terms, check-snippet-grading, check-reference-titles.

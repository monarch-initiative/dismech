  details: |
    The four OpenScientist hypothesis explorations for this disease sat under kb/hypotheses/Huntingtons_Disease/, because the runner built that directory from the free-text disease name "Huntington's Disease" while the entry file is Huntington_Disease.yaml. render.collect_hypothesis_research_links resolves hypotheses_root / disorder_slug with no fallback, so the mismatch meant it returned an empty list and all four reports plus their assessment sidecars were invisible on the rendered disease page. Verified before and after by calling the function directly: 0 sections and 0 reports before, 4 sections and 4 reports after, each now carrying its real hypothesis_label and status rather than a derived fallback. The directory was renamed to Huntington_Disease and the four mechanistic_hypotheses notes fields citing the old path were updated to match. No mechanistic content, evidence item or hypothesis status was changed.

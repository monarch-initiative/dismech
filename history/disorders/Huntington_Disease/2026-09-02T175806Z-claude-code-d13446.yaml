  summary: Integrate assessed OpenScientist findings across four HD hypotheses
  details: |
    Reviewed all four OpenScientist hypothesis reports under kb/hypotheses/Huntingtons_Disease/ (alternative_excitotoxicity, canonical_mitochondrial_bioenergetic_failure, canonical_toxic_gain_of_function, canonical_transcriptional_dysregulation), wrote an assessment sidecar for each, and integrated only the claims verified against cached primary sources.

    CORRECTION. The canonical_transcriptional_dysregulation description asserted that mutant huntingtin acts by sequestering Sp1, CBP and REST/NRSF into aggregates. PMID:11971872 tested that model four ways in HD mouse brain and found all three transcription factors diffusely nuclear despite abundant inclusions and not trapped in them; PMID:15225551 shows soluble monomers and oligomers deactivate TBP by structurally destabilizing it, independent of coaggregates, with a chaperone rescue. Both the hypothesis description and the Transcriptional Dysregulation node description were rewritten to functional inhibition by soluble species, and both papers curated (REFUTE and SUPPORT respectively). The residual CBP dispute is recorded as controversy_hd_cbp_depletion_versus_functional_inhibition rather than resolved in favour of either side.

    NEW PATHOPHYSIOLOGY NODES. Extrasynaptic GluN2B-NMDA Receptor Redistribution (PMID:22668780, PMID:22523092, PMID:33250715), placed between mutant huntingtin aggregation and Excitotoxicity. Neuronal Innate Immune Activation by Released Mitochondrial RNA (PMID:32681824), linking mitochondrial damage to Neuroinflammation. Expanded CAG Repeat RNA Toxicity (PMID:27529325), curated with the source review's own caveat that the contribution of these pathways still requires study. Plus a Mitochondrial Dysfunction to Excitotoxicity edge carrying the ATP-loss and Mg2+-block mechanism (PMID:8971131, PMID:7582122).

    NEW EVIDENCE ON EXISTING NODES. Mitochondrial Dysfunction gained its first primary human data (PMID:20660112 postmortem striatum, PMID:38195181 muscle mtDNA), a presymptomatic large-animal result (PMID:31278192) and the mitophagy arm (PMID:32093570); the mitochondrial hypothesis gained the direct-interaction negative result (PMID:31418857) it had been asserting in prose without a citation. Excitotoxicity gained PKD1 human and in-vitro evidence (PMID:40461488). D2 medium spiny neuron vulnerability gained human single-nucleus iSPN counts (PMID:32681824). The CAA-interruption node gained an isogenic human interventional result (PMID:41389205). Transcriptional Dysregulation gained basal-apparatus inhibition with rescue (PMID:16377565) and the epigenetic arm (PMID:28729730, PMID:31696228). The transcriptional hypothesis gained PMID:11988536 and PMID:17596446. The excitotoxicity hypothesis gained PMID:22668780, PMID:22523092, PMID:1710657, PMID:9100675 and a REFUTE item for trial failure (PMID:15717010), plus notes.

    NEW DISCUSSIONS. mismatch_hd_extrasynaptic_nmdar_is_mouse_only (HUMAN_MODEL_MISMATCH), gap_hd_somatic_expansion_to_nmdar_redistribution, gap_hd_mitochondrial_biogenesis_versus_mitophagy, controversy_hd_cbp_depletion_versus_functional_inhibition.

    NOT INTEGRATED, AND WHY. The excitotoxicity report cites PMID:11554551 for HD trial failure, but that 2001 review states the remacemide HD trial was still ongoing; only PMID:15717010 was used. Its claim of a modest memantine benefit in HD is unsourced by either cited paper and was rejected. The transcriptional report's argument that mitochondrial deficits precede transcriptional change rests on a spatial transcriptomics study whose mitochondrial readout is itself a transcript measurement. PMID:39026894 is the bioRxiv preprint of the already-curated PMID:39938516 and would double count one experiment. The toxic-gain-of-function report's proposed snippet for PMID:39938516 drops "or Pms1" and is a paraphrase presented as a quotation. No hypothesis status was changed; all four reports recommended retaining the existing status and that recommendation was followed. Three report-supplied CURIEs for medium spiny neuron were wrong in three different ways (GO:0070997 obsolete, CL:0000598 pyramidal neuron, CL:0000617 GABAergic neuron), so no report CURIE was used without re-derivation from cache/.

    VALIDATION. 309/309 snippets verified against the reference cache; check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values and check-folded-hyphens all pass; all four assessment sidecars pass just validate-hypothesis-assessment.

  summary: 'Bind LOINC: serum/plasma neurofilament light chain'
  details: |
    Added loinc_term LOINC:101281-4 (Neurofilament light chain [Mass/volume] in Serum or Plasma by Immunoassay) to the existing Neurofilament Light Chain (NfL) biochemical marker, grounded in its already-cited specimen-specific serum NfL finding (sNfL levels differed significantly between preHD, early HD and healthy controls). The marker's other cited evidence (a biofluid-marker systematic review) does not break out a CSF-specific result for this disease, so CSF NfL was left unbound rather than assumed from the marker's general 'plasma and CSF' framing; a notes: sentence records this. Separately checked the Mutant Huntingtin Protein (mHTT) marker for a CSF assay binding: its only evidence describes CSF mHTT quantification as a prospective trial-design innovation rather than a reported measured value, and a fresh Monarch API search for 'Huntingtin' returned no LOINC code for the analyte, so no binding was made there. LOINC:101281-4 was newly seeded via just loinc-seed-cache. just validate-disorders passed with 0 issues.

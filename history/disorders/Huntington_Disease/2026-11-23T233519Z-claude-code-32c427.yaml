  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED on the sphingolipid dysregulation PR. Blocking fix: the Fingolimod target_mechanisms edge to Sphingolipid Dysregulation cited an R6/2 motor-outcome sentence (PMID:24301680) that did not support acting on the S1P node; swapped to PMID:27479327 (IN_VITRO, STHdh Q111 cells) FTY720-P rescues apoptosis, and moved the R6/2 outcome to treatment-level evidence. Suggestions folded in: (1) sphingomyelin metabolic process INCREASED to DYSREGULATED (abundance does not fix process direction), and ganglioside metabolic process GO:0001573 to ganglioside biosynthetic process GO:0001574 DECREASED (source reports reduced synthesis); (2) PMID:28706199 re-quoted to a patient-only SGPL1/SPHK1 striatal result so HUMAN_CLINICAL is exactly true; (3) re-parented the Sphingolipid Dysregulation inbound edge from Mutant Huntingtin Protein Aggregation to HTT CAG Repeat Expansion with causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES, since the GM1 deficit is seen in patient fibroblasts and is attributed to the genotype, not aggregation; (4) trimmed the node description to the lipid shift only. All gates re-run: validate-disorders, validate-terms, 330 snippets verified, causal-targets, entity-refs, name-collisions, logical-rules, enum-values, folded-hyphens, snippet-grading.

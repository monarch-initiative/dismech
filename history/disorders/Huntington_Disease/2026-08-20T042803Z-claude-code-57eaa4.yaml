  summary: Bind MONDO:0016621 to the Juvenile HD subtype and curate juvenile-onset
    mechanism
  details: |
    Curated juvenile Huntington disease (MONDO:0016621, GitHub issue #8949) as an enrichment of the existing Huntington_Disease entry rather than as a separate kb/disorders file. Rationale: MONDO asserts MONDO:0016621 as a direct is_a child of MONDO:0007739, the entry already carried an unbound "Juvenile HD" subtype, and juvenile-onset HD shares the same causal gene, protein, and core degenerative cascade as adult-onset HD. Per CLAUDE.md a has_subtypes term counts as curated MONDO coverage, so binding and enriching the subtype closes the gap without duplicating a 4000-line pathograph.

    Changes: bound MONDO:0016621 as subtype_term with an exactMatch mondo_mapping; added subtype_frequency, an HTT gene descriptor, an expanded description, and six evidence items. Corrected the subtype display_name from "Juvenile Huntington Disease (Westphal variant)" to "Juvenile-Onset Huntington Disease" and recorded a WRONG_STATEMENT evidence item citing the EHDN JHD working group (PMID:38669553), which states the Westphal label is not specific to juvenile onset and should be avoided for it; the term is retained as a synonym in the description.

    Added parent_of_origin_effect (about 80% paternal transmission) to the autosomal dominant inheritance block with its own evidence. Added three subtype-scoped progression records: age of onset (median 9 years), disease duration and survival (median 9 years from motor onset in childhood JHD vs 18 in adolescent/adult HD), and motor progression rate, including the finding that chorea subscales do not track juvenile-onset progression.

    Added four pathophysiology nodes scoped to Juvenile HD: Paternal Germline CAG Repeat Instability and Anticipation; Juvenile-Range CAG Expansion (with genetic_context and the primary Kids-JOHD figure that repeat length explains 84% of onset-age variance vs 57-59% in adult cohorts); Juvenile-Onset Brain Morphometric Divergence (reduced intracranial volume, subcortical and white-matter loss, proportional cerebellar enlargement, with concordant mouse-model morphometry); and a PROVISIONAL Highly Expanded Pediatric HD Cerebral Hypometabolic State node. The last carries an explicit scope caveat, quoted from the source, that the GLUT-1/GLUT-3 signature segregates with the >80-CAG pediatric subgroup and NOT with juvenile onset generally, plus the very small sample size.

    Added six subtype-scoped phenotypes (developmental regression, juvenile-onset parkinsonism, declining school performance, behavioural disturbance mimicking ASD/ADHD, ataxia, spasticity). Replaced the previously unevidenced "25-40% of juvenile-onset HD patients" seizure claim with the repeat-length-graded 80%-vs-11% figures from PMID:30243861 and two further juvenile-specific citations.

    Added a HUMAN_MODEL_MISMATCH discussion recording that Msh3 ablation in the approximately 185-CAG zQ175 model abolished somatic expansion without improving striatal nuclear huntingtin aggregation or the dysregulated striatal transcriptional profile (PMID:38387080). This qualifies the MSH3/FAN1 somatic-expansion therapeutic rationale specifically in the juvenile repeat range and is deliberately scoped as the juvenile special case of the existing gap_hd_somatic_expansion_threshold_rescue discussion, with a proposed repeat-length-titrated isogenic experiment.

    Deep research: falcon, research/Juvenile_Huntington_Disease-deep-research-falcon.md. Its reference_validation block reported 17/17 references resolved, 0 unresolved, 0 off topic. The report was used as leads only; every PMID cited in the KB was independently fetched and every snippet verified against the cache.

    NEC preflight: just preflight-dr returned SKIP because MONDO records no RO:0004003 causal gene for this subtype term. The manual fallback preflight passed - HTT dominated report gene mentions (HTT=37 vs MSH3=12, FAN1=11, PMS1=8, MLH1=6, all established HD modifiers), the report's OMIM:143100 matches the parent MONDO:0007739 xref, and "Westphal variant" is a genuine historical synonym of this entity rather than a colliding eponym.

    Orphanet ORPHA:248111 was deliberately not used as a source: just refresh-orphadata failed with an upstream sha256 mismatch against the pinned data/orphadata/MANIFEST.yaml, and repinning the manifest would have churned thousands of unrelated cache files, so it was left out of scope. All juvenile-specific evidence is PMID-based instead.

    Validation: just validate passed (4 dataset-accession warnings, confirmed by git stash to be present on origin/main before these edits); just validate-terms passed; just check-duplicate-keys passed; just count-verified-snippets reported 258/258 snippets verified against cached references; just validate-disorders was run once over the changed file before opening the PR.

  summary: 'HD: add Sphingolipid Dysregulation node, GM1/fingolimod treatments, and
    a hypoxic-stress knowledge gap'
  details: |
    Addresses kgap issue #18497. Added a Sphingolipid Dysregulation pathophysiology node (GO sphingolipid/ganglioside/sphingomyelin metabolic process; MOLECULAR scale), wired downstream of Mutant Huntingtin Protein Aggregation and upstream of Medium Spiny Neuron Degeneration. Evidence is taken from the primary studies the nominating review (PMID:36898481) summarizes, not the review: human caudate MALDI-IMS (PMID:33606279), impaired ganglioside GM1 metabolism (PMID:20237277), defective S1P metabolism (PMID:28706199), subventricular-zone lipidomics (PMID:29804301), and HD cell-model lipidomics by network metabolomics (PMID:27479327). Added two model-tested treatments: GM1 ganglioside (PMID:28993428, PMID:36180805, PMID:2612575) and fingolimod/FTY720 (PMID:24301680), each with target_mechanisms on the sphingolipid node and the aggregation node. The review's own hypoxic-stress hypothesis is encoded as a KNOWLEDGE_GAP discussion attached to Mitochondrial Dysfunction and Sphingolipid Dysregulation, citing the review as REVIEW_SYNTHESIS; no module fits the sphingolipid node so no conforms_to was added. Validated with just validate-disorders (schema/terms/references, 329 snippets, 0 issues) plus the offline kb gates.

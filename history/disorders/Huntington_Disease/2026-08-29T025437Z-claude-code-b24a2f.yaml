  summary: Retire WRONG_STATEMENT evidence grading (#7439)
  details: |
    Reworked the single knowledge-base use of supports: WRONG_STATEMENT as part of the issue #7439 evidence-enum narrowing, which retires that value along with PARTIAL.

    The item cites PMID:38669553 (EHDN juvenile HD working group) stating that the hypokinetic-rigid Westphal phenotype is not exclusive to juvenile onset and should not be used to label childhood-onset HD. It was graded WRONG_STATEMENT to record that this entry's own subtype display_name, then 'Juvenile Huntington Disease (Westphal variant)', was inaccurate. That display_name was corrected to 'Juvenile-Onset Huntington Disease' in the same earlier session (see 2026-08-20T042803Z-claude-code-57eaa4.yaml).

    Because the entry text has since been corrected, the quote no longer contradicts anything in the entry: it now supports naming the subtype by age at onset rather than by phenotype. Regraded to supports: SUPPORT with directness: DIRECT, and the explanation rewritten to state what the quote supports about the current text rather than narrating the historical correction. The reference, snippet and evidence_source are unchanged.

    This is the general reason WRONG_STATEMENT was retired: it recorded curation provenance (an earlier version of an entry was wrong) in a slot whose job is the direction of evidence relative to the claim. That provenance belongs in a history record, which is what this file is.

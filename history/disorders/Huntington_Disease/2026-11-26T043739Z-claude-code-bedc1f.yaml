  summary: 'Gene-family review: BDNF, NTRK2'
  details: |
    Typed the two untyped, uncited pathway-gene records. BDNF: DISPUTED, because the genetic claim on record is the BDNF Val66Met age-at-onset modifier effect, which a locus-wide study of 250 German patients failed to replicate (PMID:17096834); the notes keep the pathway role, citing loss of huntingtin-mediated cortical BDNF transcription (PMID:11408619). NTRK2: UNKNOWN, since no human genetic association with HD is reported; the notes now record that in BACHD and Q175 mice BDNF delivery and TrkB activation are normal but TrkB fails to engage postsynaptic signaling in indirect-pathway spiny projection neurons (PMID:24991961).

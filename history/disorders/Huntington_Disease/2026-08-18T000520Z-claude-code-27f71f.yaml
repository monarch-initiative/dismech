  summary: 'Enhance HD record from the DSB paper''s citation trail: uninterrupted
    CAG vs polyglutamine, human somatic-expansion threshold, cell-type-specific expansion'
  details: |
    Follow-up curation pass mining the reference list of PMID:42091595 for human evidence, balancing the mouse-heavy first pass.

    New pathophysiology node 'Uninterrupted CAG Tract Length and Loss of CAA Interruption' (MOLECULAR), placed upstream of Somatic CAG Repeat Expansion. The KB previously had no coverage of repeat STRUCTURE as distinct from repeat LENGTH: the glutamine-encoding tract is normally (CAG)n-CAA-CAG, and because CAA and CAG are synonymous, two alleles can encode identical polyglutamine while differing in uninterrupted CAG length at the DNA level. A loss-of-interruption variant gives onset about 25 years earlier at matched polyglutamine length and increases somatic instability. Evidence: PMID:31398342 (GeM-HD Consortium 2019) and PMID:31104771 (Wright 2019), both HUMAN_CLINICAL. Node notes record the clinical consequence that the LOI allele is enriched among manifesting reduced-penetrance (36-39 CAG) carriers, so repeat-structure sequencing can matter where repeat-length sizing alone does not.

    Somatic CAG Repeat Expansion: added direct human evidence where the node previously leaned on reviews and mouse work. PMID:39824182 (Handsaker 2025 single-cell) for the measured magnitude of expansion in human striatal projection neurons, and PMID:31607598 (Ciosi 2019, TRACK-HD/Enroll-HD) linking measured somatic expansion score to clinical outcome. The downstream edge to Medium Spiny Neuron Degeneration was upgraded from a bare description to INDIRECT_KNOWN_INTERMEDIATES with the threshold intermediates named (crossing ~150 CAG; loss of neuronal identity and de-repression of senescence/apoptosis genes) and its own evidence. Handsaker was previously cited only inside a proposed-experiment block, not on the node it supports.

    D2 Receptor Medium Spiny Neuron Selective Vulnerability: this node carried NO evidence block at all. Added PMID:38291334 (Maetlik 2024) twice - once for the selectivity paradox (expansion also arises in cholinergic interneurons and cerebellar Purkinje neurons, yet striatal projection neurons are the population lost) and once for the cell-type-specific MutS beta versus FAN1 balance, which links the node to the MSH3 and FAN1 entries already in the genetic section.

    dsb_expansion_independent_driver hypothesis: added PMID:38291334 as PARTIAL. This is the only HUMAN evidence bearing on the hypothesis - human striatal/cerebellar profiling reaches the same premise the mouse work starts from, that CAG expansion is necessary but may not be sufficient for cell death. Marked PARTIAL and explained in the evidence explanation because it supports only the insufficiency premise and says nothing about double-strand breaks or end joining, which remain mouse-only.

    All six new snippets are quoted from cached PubMed abstracts and are HUMAN_CLINICAL, which addresses the imbalance noted in the previous history record where the DSB arm rested entirely on MODEL_ORGANISM evidence.

    New references cached: PMID:31398342, PMID:31104771, PMID:31607598, PMID:38291334. PMID:22323755 (Lee 2012, fully dominant inheritance) was fetched but not cited in this pass and is not committed.

    Validation: just validate (passed), just check-duplicate-keys (passed), just count-verified-snippets (207/207 verified, up from 196), just validate-terms (passed), pytest tests/test_data.py scoped to Huntington_Disease (32 passed). just validate-disorders was run and its result is reported in the PR.

  summary: Add DSB / NHEJ-suppression driver arm, XJB-5-131 treatment, and pathograph-linked
    animal models from PMID:42091595
  details: |
    Curated Polyzos et al. 2026 (Nat Commun 17:6381, PMID:42091595), which argues that genome-wide DNA double-strand breaks (DSBs) drive HD neuropathology separably from somatic CAG expansion.

    Pathophysiology: added three nodes - "mHTT Suppression of Non-Homologous End Joining" (GO:0006303, DECREASED), "Oxidative Single-Strand to Double-Strand Break Conversion" (GO:0006284 plus GO:0006979), and "Genome-Wide Double Strand Break Accumulation" (GO:0006302, DECREASED). Wired into the existing graph: HTT CAG Repeat Expansion to NHEJ suppression; Mitochondrial Dysfunction to SSB-to-DSB conversion; DSB accumulation to Medium Spiny Neuron Degeneration and to Transcriptional Dysregulation. The DSB-to-Transcriptional-Dysregulation edge is deliberately INDIRECT_UNKNOWN_INTERMEDIATES with PARTIAL evidence because the source study states the causal direction was not tested.

    Ontology grounding gap recorded in node notes: neither GO nor MPATH provides a continuant for accumulated unrepaired double-strand break burden. GO:0006302 with modifier DECREASED expresses the repair deficit that produces the accumulation, which is the closest available grounding; the accumulated lesion itself remains ungrounded. A double-strand break is a molecular lesion rather than a body structure, so it is not a candidate for the OGMS/MPATH Xogenesis anchor convention used for amyloid deposit, thrombus and atheroma.

    Hypothesis: new mechanistic_hypotheses group dsb_expansion_independent_driver, status EMERGING; all new causal edges opt in via hypothesis_groups. Recorded as EMERGING rather than CANONICAL or ALTERNATIVE because it adds a parallel arm rather than displacing the toxic gain-of-function or somatic-expansion models. Four caveats are preserved in the hypothesis notes: mouse-only and male-only evidence; the DSBR deficit measured as clearance of radiation-induced rather than endogenous breaks; XJB-5-131 acting upstream on break formation rather than restoring end joining; and the absence of any DSBR gene from human HD GWAS.

    Treatment: added XJB-5-131 (therapeutic_modality SMALL_MOLECULE; treatment_term NCIT:C15986 Pharmacotherapy; therapeutic_agent CHEBI:173099 XJB-5-131, verified via OLS during term validation and added to cache/chebi/terms.csv and the chemicalentityterm enum cache). target_mechanisms INHIBITS on both the SSB-to-DSB conversion node and the DSB accumulation node. Marked PRECLINICAL ONLY - there is no NCT identifier and nothing was added to clinical_trials.

    Animal models: backfilled name on the existing R6/2 entry, which was previously a disconnected list entry with no name and no modeled_mechanisms. Added three pathograph-linked models - congenic HdhQ(150/150) knock-in (RECAPITULATES the NHEJ-suppression and DSB-accumulation nodes, plus a RESCUES link carrying the XJB-5-131 treatment arm), zQ175 (expansion-competent comparator), and zQ175/MSH3(-/-) (FAILS_TO_RECAPITULATE Somatic CAG Repeat Expansion - the separation-of-function negative result, carrying the required limitations and evidence). Readouts carry explicit direction values including ABOLISHED for expansion in the Msh3-null cross and RESTORED for NeuN staining after treatment.

    Discussions: three new entries. HUMAN_MODEL_MISMATCH (mismatch_hd_dsbr_absent_from_human_gwas) records that no DSBR or NHEJ gene appears in human HD GWAS while the mouse evidence is direct - evidence exists in the model and translational validity is the open question, which is the HUMAN_MODEL_MISMATCH case rather than a KNOWLEDGE_GAP. KNOWLEDGE_GAP (gap_hd_dsb_transcriptional_causality) records the untested causal direction between break accumulation and transcriptional dysfunction. CONTROVERSY (controversy_hd_xjb_effect_on_somatic_expansion) records a genuine conflict between two reports from the same laboratory: Budworth 2015 (PMID:26247199) reports that XJB-5-131 inhibits repeat lengthening, while PMID:42091595 reports no substantial effect on somatic expansion. Treatment window (early dosing versus dosing begun at 60 weeks) is the likely reconciliation, but neither effect is asserted as settled.

    Evidence discipline: all 19 new snippets were quoted exclusively from cached PubMed abstracts and never from full text, so they hold under the --no-full-text check that CI runs. All new evidence from the mouse studies is tagged evidence_source MODEL_ORGANISM, and no human-facing phenotype claim rests on model-organism evidence alone. Ku70, Ku80 and DNA-PKcs are huntingtin interaction partners rather than human genetic modifiers of HD, so they are recorded in node prose rather than added to the genetic section, and no cellular-component term was bound for the NHEJ complex because none is available in the committed caches.

    New references cached: PMID:42091595, PMID:26908614, PMID:23122961, PMID:39231940, PMID:26247199, PMID:11152661, PMID:27378694, PMID:38387080.

    Deferred: a dsbr_failure_neurodegeneration mechanism module. The source paper generalises the end-joining-suppression mechanism to SCA3 (ataxin-3 suppressing PNKP), SCAN1 and AOA1, and dismech already holds Ataxia_Telangiectasia and several spinocerebellar ataxia entries. A module should be factored from at least two curated conformers, and today there is only one; it would also need clear differentiation from the existing genomic_instability_aging module, whose chain is close. Revisit once an SCA3 entry carries the PNKP arm.

    Validation run: just validate (passed), just check-duplicate-keys (passed), just count-verified-snippets (196/196 verified against cached references), just validate-terms (passed), just validate-disorders (passed; the 4 warnings are pre-existing unfetchable ega: and metabolomics_workbench: dataset accessions, unrelated to this change).

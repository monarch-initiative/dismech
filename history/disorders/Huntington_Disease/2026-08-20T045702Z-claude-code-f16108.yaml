  summary: 'Address PR #9050 review: wire orphan hypometabolic node into the pathograph'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #9050. No inline review comments existed; all feedback was in the review body and a single PR comment.

    BLOCKING (addressed): the Highly Expanded Pediatric HD Cerebral Hypometabolic State node was an orphan - no incoming downstream[].target and no outgoing downstream:, so it was unreachable from the pathograph despite its own description asserting the edges in prose. Wired it in three directions. Incoming: a scope-restricted INDIRECT_KNOWN_INTERMEDIATES edge from Juvenile-Range CAG Expansion, whose description states in capitals that the edge is asserted only at the >80-CAG pediatric extreme and must not be read as "juvenile-range expansion causes cerebral hypometabolism", with two named intermediate_mechanisms and a PARTIAL evidence item carrying the JOHD-resembles-AOHD constraint quote. Outgoing: two INDIRECT_UNKNOWN_INTERMEDIATES edges to Developmental Regression and Delay and to Seizures, both labelled PROPOSED, NOT ESTABLISHED in the edge description, because the source demonstrates co-occurrence of the transporter deficit and the clinical picture within the same subgroup plus an analogy to GLUT-1 deficiency syndrome, not a causal sequence - no rescue or intervention experiment exists. Both outgoing edges carry PARTIAL evidence for that reason, and the Seizures edge notes that its target phenotype is scoped to juvenile HD as a whole while the edge covers only the >80-CAG subgroup. mechanism_confidence: PROVISIONAL and the HE-PHD-vs-JOHD caveat were retained unchanged, as the reviewer asked. Verified programmatically afterwards: zero orphan nodes and zero dangling downstream targets across the whole entry.

    SUGGESTION 1 (addressed): GO:0007140 (male meiotic nuclear division) was broader than the claim it annotated on the Paternal Germline CAG Repeat Instability and Anticipation node. Searched GO for a closer term and found GO:0035753, maintenance of DNA trinucleotide repeats, whose definition is "sustaining the fidelity and copy number of DNA trinucleotide repeats" - exactly the node's subject. Added it with modifier: DECREASED (repeat instability is that maintenance process running at reduced fidelity) and kept GO:0007140 alongside it, re-labelled as the cell-division context that makes the instability paternal rather than maternal. Added a notes block recording that GO has no term naming repeat instability or expansion directly - it models the maintenance process, not its failure - so the DECREASED modifier carries the direction, and stating that GO:0007140 should not be read as annotating the repeat-expansion claim on its own.

    SUGGESTION 2 (addressed, though the reviewer called it not this PR's debt): added a top-level references: block tagging PMID:20301482 (Huntington Disease, GeneReviews) with two structured Finding objects. Also added a GeneReviews evidence item to the inheritance parent_of_origin_effect block, quoting its statement that expansion occurs far more commonly in paternal transmission while contraction is maternally biased - the authoritative general-HD statement underlying the ~80% paternal transmission curated for juvenile onset. Note the initial attempt wrote findings as a string, then as a list of strings; both failed schema validation, and the committed form uses proper Finding objects with statement and supporting_text.

    RESEARCH GAP (addressed): the reviewer noted the Swedish national registry finding was unmodelled. Fetched PMID:36253622 and added two juvenile-scoped phenotypes, Constipation (HP:0002019) and Acute Respiratory Symptoms (HP:0002795), both citing the single quotable sentence reporting higher incidence rates in juvenile- than adult-onset HD. Acute respiratory symptoms was deliberately bound to the broad HP:0002795 abnormal respiratory system physiology rather than to HP:0011947 respiratory tract infection or HP:0002090 pneumonia, because the registry term is a symptom category that does not specify infection and binding to an infection term would have inferred beyond the source.

    DECLINED: nothing was declined. The reviewer's remaining observation - that dysarthria and dysphagia are curated at disease level and not re-scoped to the juvenile subtype - was itself described as reasonable given they are shared with adult-onset HD, and no change was made.

    Validation on the final state: just validate passed; just validate-terms passed; just check-duplicate-keys passed; just count-verified-snippets reported 264/264 verified; scripts/check_snippet_length.py --against-ref origin/main reported no new snippets under 5 words; just validate-disorders re-run before pushing. Pathograph connectivity and subtype foreign keys re-verified programmatically.

  summary: 'Create: Immunodeficiency_62'
  details: |
    De novo curation of Immunodeficiency 62 (MONDO:0032763, OMIM 618459, ARHGEF1 at 19q13.2) as a standalone Disease entry; the stub's entry_type was set to DISEASE in a separate commit and the stub deleted here.

    Gene identification. MONDO:0032763 records no causal-gene relationship (confirmed by 'just preflight-dr', which reported SKIP for that reason), so the gene was taken from the concept's xrefs rather than from memory: MedGen C5193109 -> NCBI Gene 9138 -> ARHGEF1, cross-checked against the HGNC REST API (HGNC:681, 19q13.2) and against the IUIS 2022 classification row.

    Deep research. Requested provider falcon returned HTTP 402 (out of credits) and the run fell back to claude_code, as the standing brief anticipated; the report is committed with its citations sidecar. Its frontmatter records needs_review: true, from an obsolete GO CURIE (GO:0005089, replaced by GO:0005085) and a MONDO label-reporting artefact. 'just preflight-dr' returned SKIP rather than PASS or FAIL, because the gene-identity check cannot run without a MONDO causal gene; the report's own top-gene histogram is ARHGEF1=50, so the report is about the right disease. The report was treated as a lead only: every claim in the entry is quoted from a primary source fetched with 'just fetch-reference'. The report missed two things found by direct literature search and curated here - the 2026 Haematologica platelet study (PMID:42687834) and the bronchial mucoepidermoid carcinoma in P2 - and it asserted that malignancy is 'not described in the source literature', which the founding paper contradicts.

    Sources. Founding report PMID:30521495 (Bouafia et al., J Clin Invest 2019, full_text_pdf cache) supplies the clinical narrative, Table 1 laboratory values, variant detail and every mechanistic step. PMID:30714991 is the accompanying JCI commentary. PMID:42687834 (Suffit et al., Haematologica 2026) is the only subsequent primary study and covers platelet function in P2. PMID:11526402 and PMID:16286020 are the murine Lsc/Arhgef1 knockout papers used for the animal model. PMID:35748970 (IUIS 2022) supplies the classification row; PMID:42208906 supplies class-level treatment evidence. ORPHA:696942 was built from the Orphadata bulk XML with --cache-dir pointed at this worktree.

    Structure. Ten pathophysiology nodes trace one chain: biallelic ARHGEF1 loss -> absent protein -> reduced RhoA activation, which branches into defective cortical actin polymerisation (and hence impaired lymphocyte migration and deadhesion) and failure to restrain PI3K/AKT. The migration arm produces loss of marginal zone and memory B cells, the disturbed germinal centre reaction and circulating myelocytes; both arms converge on defective specific antibody production, which is wired to the clinical and laboratory phenotypes. Fifteen phenotypes, all quoted from the founding report.

    Two discussions. A HUMAN_MODEL_MISMATCH records that Arhgef1-null mice have a severe platelet and haemostasis phenotype while the ARHGEF1-deficient patient has entirely normal platelet function including preserved platelet RhoA activation - a species divergence located at the signalling step itself rather than at a downstream readout. A KNOWLEDGE_GAP records that malignancy risk is unknown rather than absent: one bronchial mucoepidermoid carcinoma in one of two patients, against a background in which somatic loss-of-function ARHGEF1 mutation is recurrent in GCB-DLBCL.

    Deliberate omissions, recorded in notes: decreased IgM and IgA (present in one sister only, although MedGen annotates IgM for the concept), the low isohaemagglutinin titre, the severe primary HSV-1 infection as a phenotype of its own, and the CD21-low CD38-low subset and raised naive CD8 CCR7 (reported without reference intervals). No datasets block - searching ARHGEF1 alone returns the hypertension, platelet and cancer literature, the Named Entity Confusion hazard the dataset SOP warns about. No ClinGen gene-disease validity assertion exists: 'grep -l ARHGEF1 references_cache/CGGV_*.md' over the 612 cached ClinGen records returned nothing. No GeneReviews or StatPearls chapter: 'just check-genereviews' against the committed Bookshelf index (snapshot 2026-09-10) returns NO_CHAPTER for both.

    Hazard encountered. 'just validate' re-fetched and truncated references_cache/PMID_35748970.md from 5644 lines to 175, destroying the IUIS table the entry quotes (issue #12672). The file was restored with git checkout and all subsequent gates were run under 'just validate-disorders', which reports 'keeping the cached full_text_pdf entry rather than overwriting it' and passes.

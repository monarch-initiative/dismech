  summary: 'Create: Alveolar capillary dysplasia with misalignment of pulmonary veins'
  details: |
    De novo creation of the ACDMPV entry, a lethal congenital lung developmental disorder of the FOXF1 locus. No GeneReviews chapter exists (PubMed searched, zero hits). Curated an eight-node pathograph running from the FOXF1 coding-or-enhancer lesion through genomic imprinting of the locus, loss of mesenchymal FOXF1 output, failed pulmonary microvascular angiogenesis via STAT3, and the separate venous-misalignment patterning failure, to impaired gas exchange and suprasystemic pulmonary hypertension. Two nodes declare conforms_to against pulmonary_vascular_remodeling (Increased Pulmonary Vascular Resistance and Pulmonary Arterial Hypertension); the substitution recorded is developmental absence of the distal bed in place of the module's acquired obstructive remodeling. Distinctive features captured: the causal lesion is frequently a deletion of a non-coding upstream enhancer containing LINC01081/LINC01082 rather than of the gene, so sequencing without copy-number analysis misses a substantial fraction; and 30 of 31 parentally resolved deletions arose de novo on the maternally inherited chromosome 16, implicating imprinting, with four paternal-chromosome exceptions recorded as a PARTIAL qualifier. ESRP1 recorded as DISPUTED candidate on single-family evidence. Five HPO-bound phenotypes, two genes, two diagnosis modes, two treatments including the preclinical nanoparticle STAT3 direction, two KNOWLEDGE_GAP discussions. Note: cache seeding used a rewritten script that writes through csv.writer with quoting and round-trip verifies every label, after the unquoted-comma truncation defect found in PR 7551. Validation: just validate passes, 23/23 snippets verified; compliance 79.5 percent global, 80.0 percent weighted.

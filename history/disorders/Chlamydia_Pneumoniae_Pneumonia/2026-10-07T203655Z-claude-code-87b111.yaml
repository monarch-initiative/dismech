  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    The entry had no diagnosis section. Added a nucleic acid amplification row bound to LOINC:105884-1 (method-less) with evidence from the review PMID:40279169, whose cache was refetched as full text. Added a microimmunofluorescence serology row bound to the method-less serum titre codes LOINC:22174-7 (IgM) and LOINC:22172-1 (IgG), with evidence from the CDC/LCDC recommendations PMID:11462186 and a reference range on the IgM titre (acute infection at 16 or more, unit titer) quoted from the reviews PMID:40279169 and PMID:11781264, since the recommendations abstract does not state the titres. The fourfold IgG rise is in the description, not a band.

  summary: 'Create: Lassa_Fever'
  details: |
    Curated Lassa fever from the existing stub. Final content, after the reviewer-driven expansion in the amended push:
    - Infectious agent: Lassa virus, with the Mastomys natalensis life-cycle binding (reservoir, horizontal and vertical maintenance) and rodent-excreta / foodborne spillover plus household and clinical human-to-human transmission.
    - Diagnosis: LASV RT-PCR, LASV antigen lateral-flow rapid testing, and lineage-spanning anti-LASV nucleoprotein IgG ELISA.
    - Pathophysiology (7 nodes): LASV GP1 receptor switch and endosomal fusion; NP-mediated innate immune antagonism and T-cell suppression; systemic dissemination to vascular and myeloid targets; endothelial infection with muted innate activation; protein C pathway endotheliopathy and platelet dysfunction; increased vascular permeability (VHF vascular-leak conformance); immune-mediated vasculitic hearing injury.
    - Phenotypes (15), including sensorineural hearing impairment, and progression phases.
    - Treatments: ribavirin and favipiravir antiviral pharmacotherapy (favipiravir from the macaque study), plus supportive care for vascular leak, shock and renal injury.
    - Genetic: LARGE1 and IL21 modifiers. Environmental: climate-sensitive Mastomys reservoir expansion.
    - Animal models: a LASV-exposed cynomolgus macaque survivor hearing-loss model and a non-Mauritius cynomolgus macaque lethal model.
    - Prevalence refresh, GSE12254 dataset, and the Viral_Hemorrhagic_Fevers grouping membership.
    - Deliberately lumped at MONDO:0005820 (see review_notes).
    An OpenScientist deep-research artifact was used and validated with reference and term checks.

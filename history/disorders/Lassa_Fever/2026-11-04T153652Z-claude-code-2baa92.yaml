  summary: Add ICD-10-CM and ICD-11 mappings for Lassa fever
  details: |
    Added mappings to ICD10CM:A96.2 Lassa fever (exactMatch) and the ICD-11 Foundation entity icd11f:515020316 Lassa fever (exactMatch). The ICD-11 binding was first made to icd11f:949618743 Infections due to Lassa virus as a closeMatch; review showed that entity is the grouping parent of separate Lassa fever, Lassa virus meningitis and Lassa virus encephalitis entities, so the binding was moved to the Lassa fever child, confirmed in the sqlite:obo:icd11f build. Validated with just validate and just validate-terms; term caches written by the validator and normalized.

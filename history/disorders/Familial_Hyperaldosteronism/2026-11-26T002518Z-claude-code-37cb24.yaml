  summary: 'Gene-family review: CACNA1D'
  details: |
    The PASNA subtype named CACNA1D but the entry had no genetic record or mechanism node for it. Added a CAUSATIVE, de novo germline record (subtype PASNA, AD) citing the founding report of germline variants (PMID:23913001) and the de novo summary in PMID:37698934; ClinGen's Definitive AD classification is filed under complex neurodevelopmental disorder (MONDO:0100038), not under this entry's terms, so it is noted rather than copied. Added the node CACNA1D gain-of-function calcium influx binding high voltage-gated calcium channel activity as INCREASED (channel activation at less depolarized potentials and impaired inactivation, PMID:23913001), wired to the shared glomerulosa depolarization node.

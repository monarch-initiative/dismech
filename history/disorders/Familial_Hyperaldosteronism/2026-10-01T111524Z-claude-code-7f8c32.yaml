  summary: Add the PASNA (CACNA1D) subtype row that Primary_Aldosteronism routes here
  details: |
    Curation reached from the d2g series-071 gap list (issue #12278), whose named parent for this concept was Primary_Aldosteronism. That entry's notes already dispositioned MONDO:0014200 as out of scope, saying the two familial entries carry it - but neither Familial_Hyperaldosteronism.yaml nor Familial_Hyperaldosteronism_Type_I.yaml mentioned CACNA1D or PASNA anywhere, so the disposition pointed at a home that did not hold the concept. This entry is bound to MONDO:0016525, the exact MONDO parent of MONDO:0014200, and already carries FH types I to IV as subtype rows, so the fifth child belongs here. PASNA is added as that fifth row with CACNA1D bound and an autosomal dominant de novo inheritance block. The row's description draws the distinction that makes it a row rather than a restatement: the same CACNA1D gain-of-function change is a somatic tumour driver in aldosterone-producing adenomas, curated as SOMATIC_DRIVER on Primary_Aldosteronism, whereas here it is constitutional, which is why the phenotype extends beyond the adrenal. Evidence is a knock-in mouse study whose introduction states the human germline and somatic genetics - graded HUMAN_CLINICAL with quote_role BACKGROUND for those two sentences - plus its own MODEL_ORGANISM result that both the endocrine and the neurologic arms respond to isradipine. CACNA1D is not added to this entry's genetic section, and the row's review_notes says why and names the open question: MONDO files PASNA under familial hyperaldosteronism while its own definition calls it a neurodevelopmental condition, and this entry does not model neurodevelopment, so whether PASNA warrants its own Disease entry is unresolved. Validation on the committed tree: just validate 0 issues, validate-terms passed, 43/43 snippets verified.

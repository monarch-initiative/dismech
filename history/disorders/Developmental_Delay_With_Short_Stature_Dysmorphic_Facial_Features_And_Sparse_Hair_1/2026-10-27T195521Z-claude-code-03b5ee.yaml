  summary: 'Review round 1: DPH1 CI gate, missing phenotypes, Urreizti cohort, gradings'
  details: |
    Answers the ai4c-reviewer CHANGES_REQUESTED review on PR 15763, and fixes the red CI check that landed with it. CI first: the failing gate was check-gene-activity-grounding, and the finding was mine - the DPH1 gene descriptor sat on a pathophysiology node carrying no molecular_functions. Fixed properly rather than baselined, by binding GO:0090560 2-(3-amino-3-carboxypropyl)histidine synthase activity with modifier DECREASED, which is exactly the DPH1-DPH2 heterodimer's first-step activity, plus GO:0051539 4 iron, 4 sulfur cluster binding for the cofactor. The gate no longer lists this entry. The blocking review finding was correct and was under-consumption, not a scoping choice: features the entry's own cached sources tabulate at between a quarter and all of patients had no phenotype entry. Added seven from the pooled frequency table in PMID:39166428, each quoting its pipe-delimited row: morphological CNS abnormality (11/13), abnormality of limbs for the hand/foot anomalies (14/14), abnormality of the dentition (9/12), abnormal heart morphology for the congenital defects (9/17 tabulated together with cardiomyopathy), abnormal external genitalia (5/11), abnormal renal morphology (4/15) and abnormal facial shape for the craniofacial dysmorphism (19/19). Six carry coarse_binding_basis SOURCE_UNSPECIFIED, which is the honest basis: the source tabulates these as grouped categories and does not give the individual anomalies per patient, so a narrower binding would assert a specificity the source withholds. Early lethality (4/19) could NOT be added as a phenotype: HP:0001522 Death in infancy is outside the PhenotypeTerm dynamic enum, so term validation rejects it. Rather than bind something wrong or drop the figure, it is carried as an evidence item on the Impaired Somatic Growth and Neurodevelopment node with an explanation recording why it is not a phenotype. Two frequency bands corrected against the same table: seizures from OCCASIONAL to FREQUENT (7/10, not the minority the founder cohort alone suggested) and short stature from FREQUENT to VERY_FREQUENT (16/17). The reviewer was also right that the largest cohort was missing. Fetched PMID:30877278 (Urreizti 2020) and used it for three things: the first functional test of patient DPH1 alleles, a diphtheria-toxin ADP-ribosylation assay showing five of seven tested alleles compromised - an assay that is itself the coupling this entry's pathograph records between the inborn error and the toxin; a new grouped variant record for p.Leu125Pro and p.Tyr112Cys with four new patients; and a genotype-phenotype correlation from modelled catalytic-site geometry through residual activity to clinical severity, graded COMPUTATIONAL because the structure is a homology model with molecular dynamics rather than an experimental one. Cardiomyopathy was rewritten: the reviewer correctly noted the entry rested it on a surveillance sentence while the same paper reports an actual case (ejection fraction 20%, defibrillator at 26 years). It is now described as adult-onset with that case cited, and carries no frequency band because the source tabulates cardiomyopathy together with congenital heart defects and that combined figure sits on the congenital-defect phenotype - separating them would double-count. Four evidence_source gradings corrected per the quote_role rule: three quotes from PMID:37675463's introduction describe human clinical practice or published patient series and are now HUMAN_CLINICAL with quote_role BACKGROUND rather than IN_VITRO. One was deliberately left IN_VITRO - the sentence about reduced diphthamide synthesis in carriers reports what the enzyme assays showed, not a clinical observation - and its explanation now says why it differs from its neighbours. A cryo-EM structural finding graded COMPUTATIONAL is now IN_VITRO: experimental structure determination is not an in-silico prediction. Craniosynostosis rebound from the general HP:0001363 to HP:0004442 Sagittal craniosynostosis, which is what the preferred_term, description and snippet all say. Suggestions taken: the toenail preferred_term changed from 'Hypoplastic toenails' to 'Abnormal toenails' so it no longer implies the narrower HP:0001800; supportive care's therapeutic_modality from BEHAVIORAL to OTHER; and the unsourced sentence claiming growth restriction is the readout of reduced translational fidelity removed, with the edge from the fidelity node to the growth node changed from DIRECT to INDIRECT_UNKNOWN_INTERMEDIATES and a description saying no source traces that path. Re-validated: schema, terms, 67/67 snippets (up from 51), 75 titles, and check-gene-activity-grounding, check-coarse-phenotypes, check-entity-refs, check-causal-targets, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading and check-reference-titles all clean.

  details: |
    De novo curation of DEDSSH1 / diphthamide deficiency syndrome 1 / Loucks-Innes syndrome (MONDO:0800438, DPH1). Deep research provenance, recorded in full because the documented path did not work. falcon was requested first and returned HTTP 403: the environment's EDISON_API_KEY is rejected. The run was re-issued with --fallback, which selected openscientist; that job timed out after 3600s and was cancelled server-side, and because the failure surfaced as a ValueError the fallback chain could not carry the trail, so claude_code - which was reachable and would have been next - was never tried automatically. I then requested claude_code explicitly. The committed report therefore records provider: claude_code with NO fell_back field, because from its own point of view nothing fell back. That is why this paragraph exists: the two earlier failures are recorded here and nowhere else in the repository. Report validation read before use: 34/34 references resolved, confabulation_rate 0.0, 20/34 assessed on topic; term validation 64/74 resolved with 0 not found and 7 label mismatches, all of which are the report putting table text or commentary in the label slot (for instance MONDO:0800438 labelled with a string of Orphanet tags, CHEBI:15414 labelled 'Cofactor') rather than wrong CURIEs. None of the mismatched terms is bound in this entry. The report substantially improved an entry that had already been written from primary literature, in the way that matters most: it supplied the primary sources for two claims the entry had been citing secondhand through other papers' discussions. PMID:24895408 is the Yu et al. neural-crest paper itself, and citing it directly replaced a BACKGROUND quote with three primary results - the lineage-specific conditional ablation (neural crest yes, paraxial mesoderm no), the transgenic rescue, and the observation that Ovca1-null tissue is resistant to diphtheria toxin subunit A, which closes the loop with the Diphtheria entry already in kb/. PMID:22869748 is the primary demonstration that diphthamide prevents -1 frameshifting, and it also supplies a genetic epistasis result - the eEF2 G717R/OVCA1 double mutant showing the lethality is due to diphthamide deficiency specifically - which is the strongest available justification for routing the whole pathograph through that node. The report also added two cases the entry did not have: PMID:33704902, the first reported adult, with documented growth hormone deficiency and the finding that the nail and dental features are age-dependent rather than congenital; and PMID:39166428, a sibling pair who had carried a clinical diagnosis of Fine-Lubinsky syndrome, whose cause was a homozygous deep intronic c.749+39G>A allele that chromosomal microarray and quad exome both missed and that RNA sequencing validated. That case produced three pieces of clinically actionable content now in the entry: a recommendation to screen Fine-Lubinsky patients for DPH1, a recommendation to monitor for cardiomyopathy, and the observation that the hearing loss may remit over time. just preflight-dr could NOT be run: it requires the local 1.3 GB MONDO build and this container had about 500 MB of writable disk free, so the Named Entity Confusion check was done by hand - the report's anchors name DPH1 and MONDO:0800438, and its citation set is diphthamide-pathway literature throughout. Validation: just validate passes (schema, terms, 51/51 snippets, 58 titles); check-entity-refs, check-causal-targets, check-enum-values, check-coarse-phenotypes, check-duplicate-keys, check-qualifier-terms, check-folded-hyphens, check-title-snippets, check-snippet-length, check-reference-titles and check-snippet-grading all clean. GeneReviews baseline: NO_CHAPTER with six synonyms in place.

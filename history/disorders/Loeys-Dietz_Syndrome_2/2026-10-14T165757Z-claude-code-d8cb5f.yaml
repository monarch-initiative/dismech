  summary: 'Create: Loeys-Dietz_Syndrome_2'
  details: |
    Created a standalone entry for Loeys-Dietz syndrome 2 (MONDO:0012427), the TGFBR2 subtype previously curated only as the 'Loeys-Dietz Syndrome Type 2' has_subtypes row of the Loeys-Dietz_Syndrome umbrella. Gene bound to TGFBR2 (hgnc:11773) following MONDO's logical definition, the OMIM:610168 xref and the ClinGen record filed against MONDO:0012427; the entry notes record why MONDO's imported free-text definition ('TGFBR1 or TGFBR2') reflects the older gene-agnostic clinical 'type II' of Loeys 2006 (PMID:16928994). Pathograph: TGFBR2 kinase-domain variant -> dominant-negative impairment of receptor-initiated SMAD2/3 signalling -> paradoxical aortic TGF-beta signalling increase -> medial degeneration -> progressive aortic and arterial dilation -> dissection, plus craniofacial/skeletal, connective-tissue fragility and allergic branches; nodes conform to aortopathy_tgfbeta_dysregulation. TGFBR2-specific evidence includes genotype-stratified comparisons with TGFBR1 (PMID:33408307 histopathology and type B dissection, PMID:38774681 paediatric aortic dimensions and stiffness, PMID:40533122 extra-aortic aneurysms), the 2022 ACC/AHA guideline TGFBR2 statements (PMID:36322642), TGFBR2 functional studies (PMID:21098638, PMID:28679693), and the allele-specific Arg528 vitreoretinopathy report (PMID:41024485). Pooled TGFBR1/TGFBR2 ('LDS 1/2') figures are labelled as pooled. ClinGen Definitive (CGGV assertion 73be8b4f, MONDO:0012427) copied from cache/clingen/gene_validity.csv; its references_cache CGGV record was generated offline from that committed export with `just clingen-rebuild --csv-only` and the table row is quoted as evidence. Literature was limited to the existing reference cache because PubMed and other literature services were unreachable from the curation environment; all ontology terms were taken from the committed term and enum caches. Validated with just validate, validate-terms, count-verified-snippets and validate-disorders.

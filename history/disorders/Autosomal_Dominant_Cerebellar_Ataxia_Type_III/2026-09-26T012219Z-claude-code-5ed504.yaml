    One blocking finding and one suggestion on PR 12780. The TRPC3 genetic record carried a PMID:21321808 sentence describing what the TRPC3 product is, graded MODEL_ORGANISM with an explanation claiming the sentence restated the ataxic mouse models. It does not mention mice or any experiment, so evidence_source is now OTHER with quote_role BACKGROUND retained, and the explanation says there is no study type to grade; the mouse evidence is cited separately on the downstream edge and is unchanged. Separately, three passages in notes described this entry's own edit history rather than the concept. The definition-provenance sentence no longer asserts that MONDO took its text from Orphanet: MONDO:0019793 carries Orphanet:94148 as a database cross-reference, read from OLS4 on 2026-09-26, and the note now says the Orphanet record itself was not fetched, so the cross-reference is the provenance claim and not an assertion about which text came first. The clause naming the roster this entry carried before 2026-09-25 is gone; the six-member roster is now described as the roster of the 2013 class review the definition is built on, which is the fact about the concept. The sentence saying SCA14 and SCA15/16 were removed in the 2026-07-21 review now states why they are out of scope: MONDO places both under MONDO:0019792, ADCA type I, confirmed by OLS4.

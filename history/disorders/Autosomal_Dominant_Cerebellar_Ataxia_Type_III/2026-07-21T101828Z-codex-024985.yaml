  summary: 'Comprehensive review: correct ADCA-III subtype scope and rebuild evidence-backed
    mechanisms'
  details: |
    Resolved review issue 3589 by reconciling this umbrella concept to the canonical SCA5, SCA6, SCA11, SCA26, SCA30, and SCA31 roster. Removed misclassified subtypes and unsupported SCA6 calcium-transport and acetazolamide assertions; added subtype-specific genetics, provisionality for the single-family EEF2/SCA26 association, the unresolved SCA30 gene gap, current SCA6 proteotoxicity/ER-stress evidence, TTBK2 dominant-negative ciliopathy evidence, SCA31 repeat-RNA toxicity, diagnostic distinctions, supportive care, current subtype-relevant trials, model systems, and GEO datasets. Verified exact normalized evidence snippets against generated caches, schema and term validity, causal graph connectivity, reference-cache frontmatter, CX2/KGX export, and current ClinicalTrials.gov and DailyMed status.

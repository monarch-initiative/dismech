  summary: 'Genetics pass: add SCA38/41/42/45 subtypes, bind MONDO terms and genes,
    wire all nine genes'
  details: |
    Genetics pass against the MONDO descendant set of MONDO:0019793 (issue #12250, series-043). Enumerated all eleven hierarchical descendants via OLS4 on 2026-09-25 and found that MONDO's own definition text (from Orphanet ORPHA:94148) names only the six-member roster this entry already carried, while MONDO's class hierarchy asserts five more: SCA38, SCA41, SCA42, SCA45 and SCA42ND. Followed the hierarchy. Added has_subtypes rows for SCA38 (ELOVL5), SCA41 (TRPC3), SCA42 (CACNA1G) and SCA45 (FAT2), each with a subtype_term, a bound gene and abstract-quoted evidence; bound subtype_term and genes retroactively on the six existing rows, whose MONDO identifiers were previously unbound anywhere in the entry. Added four genetic records with relationship_type CAUSATIVE, and relationship_type on the five pre-existing ones. Added four pathophysiology nodes so every one of the nine curated genes now reaches the pathograph: ELOVL5 fatty-acid elongation deficiency, a deliberately mechanism-free TRPC3 node, the Cav3.1 voltage-dependence shift, and FAT2 parallel-fibre synapse failure. SCA42ND (MONDO:0060758) was lumped into the SCA42 row following ClinGen's own CACNA1G lumping ruling; SCA14 and SCA15/16 were re-checked against OLS4 and remain out of scope because MONDO places both under ADCA-I. Repaired two pre-existing drifted reference_title values for a EuropePMC url reference whose extracted title had changed to 'Abstract', and tagged the two cited GeneReviews chapters. Verified: schema, terms, snippets (validate-disorders under linkml-reference-validator 0.3.0rc1), duplicate keys, entity refs, causal targets, enum values, qualifier terms, gene-term identity (103/103 bindings name the gene the entry names).

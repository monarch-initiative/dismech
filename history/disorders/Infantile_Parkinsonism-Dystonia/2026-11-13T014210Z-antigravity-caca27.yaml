  summary: Review and enrich Infantile Parkinsonism-Dystonia
  details: |
    Expanded synonyms; added Classic early-onset and Atypical later-onset subtypes; added Harrison's (NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE) and ICIMD (monoamine_metabolism) classifications; modeled autosomal recessive (with 25%/50%/25% sibling recurrence risk) and rare dominant-negative autosomal dominant inheritance; enriched pathophysiology with biological_scale, substantia nigra/striatum locations, parkinsonism_dopaminergic_degeneration module conformance, and causal downstream edges to all 14 phenotypes (including Status Dystonicus and ADHD), and rebound Axial Hypotonia to HP:0008936; strengthened snippets on Tremor, Oculogyric Crisis, Feeding Difficulties (bulbar dysfunction), Raised CSF HVA:5-HIAA Ratio, and Levodopa with primary clinical data from PMID:24613933; added CSF neurotransmitter lumbar puncture, SLC6A3 genetic testing, and DAT SPECT imaging diagnosis entries; enriched treatments with ropinirole, dystonia adjuncts (trihexyphenidyl, baclofen, gabapentin, clonidine, chloral hydrate), focal botulinum toxin, anti-dopaminergic agent avoidance, therapeutic_modality, and target_mechanisms; added HUMAN_MODEL_MISMATCH discussion on preclinical vs human neurodegeneration.

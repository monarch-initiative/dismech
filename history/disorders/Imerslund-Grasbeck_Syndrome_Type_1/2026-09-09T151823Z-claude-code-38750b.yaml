  summary: 'Create: Imerslund-Grasbeck Syndrome Type 1'
  details: |
    Created kb/disorders/Imerslund-Grasbeck_Syndrome_Type_1.yaml as a CUBN-specific (cubilin) entry, kept separate from the AMN-encoded IGS type 2 (MONDO:0100157). Curated from an OpenScientist deep-research report plus independent PubMed retrieval; every ontology CURIE was resolved by lookup at the point of writing rather than recalled, after the report's own term validation was found to carry four mislabelled CURIEs while still reporting a zero confabulation rate.

    Pathograph: biallelic CUBN loss of function -> failure of cubam receptor assembly at the brush border -> two parallel arms (loss of ileal intrinsic factor-cobalamin endocytosis; loss of proximal tubular reabsorption of filtered protein) -> systemic cobalamin deficiency -> megaloblastic erythropoiesis, and persistent non-progressive proteinuria. The two-arm shape is the point of the entry: one receptor lesion, two organs, and the renal arm does not progress to renal failure.

    Genetic section records the CUBN positional genotype-phenotype split (N-terminal alleles cause IGS; alleles after the vitamin B12-binding domain cause isolated childhood albuminuria with normal GFR, four of which appear as population-cohort albuminuria associations), and a variants record for the Finnish founder allele c.3890C>T p.Pro1297Leu (FM1) with the surface-plasmon-resonance measurement showing raised K_d for intrinsic factor-cobalamin.

    Validation: linkml-validate clean, linkml-term-validator clean, 49/49 evidence snippets verified against references_cache. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values all clean for this file.

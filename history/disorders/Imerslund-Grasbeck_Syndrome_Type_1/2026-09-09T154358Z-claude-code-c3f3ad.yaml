  summary: 'Review round 1: model the neurological arm, reconcile the proteinuria
    frequency, wire every phenotype'
  details: |
    First review round on PR #11531, answering two IMPORTANT findings and three suggestions in one push.

    Finding 1: neurological manifestations were acknowledged three times in prose and never modelled. Two new pathophysiology nodes now carry them. 'Cobalamin-Dependent Enzyme Block' (MOLECULAR) is the point where the deficiency disables its only two client enzymes, methionine synthase and methylmalonyl-CoA mutase, which is what makes hyperhomocysteinemia and methylmalonic aciduria one event rather than two coincidences; both biochemical phenotypes now hang off it instead of floating. 'Neurotoxic Metabolite Exposure and Impaired Myelination' (TISSUE, mechanism_confidence PROVISIONAL) carries the route to the neurology, and is deliberately hedged: its source says these symptoms 'have been attributed to' those mechanisms, which is an attribution rather than a measurement, so the node is PROVISIONAL, its incoming edge is INDIRECT_UNKNOWN_INTERMEDIATES and the evidence item is graded INDIRECT. Three neurological phenotypes added, all bound by lookup: Ataxia (HP:0001251), Lethargy (HP:0001254), and funicular myelosis bound to the general Spinal cord lesion term (HP:0100561) because HPO has no term for subacute combined degeneration. Frequency bands are for the whole cohort, not the neurological subgroup, and each description says so, since the quoted percentages are shares of the 52 patients with any neurological finding.

    Finding 2: the proteinuria frequency was FREQUENT with 'about half of patients' from a 2006 review, against 89% (212/239) in the 2023 systematic review already cited eight times in this entry. Raised to VERY_FREQUENT, but the record now carries the disagreement rather than replacing one number with the other: the review's own argument that 89% may be an overestimate and 62% closer, the ascertainment reason it gives, and the Finnish exception at 20%. The 2006 estimate is retained as a REFUTE-graded item, which is what it is against the new band. The Finnish figure is directly relevant here because this entry records the Finnish founder allele as a missense change reducing ligand affinity rather than abolishing the receptor. The igs1_proteinuria_penetrance discussion had 'only about half of patients' as its entire premise, so its prompt and rationale were rewritten: the gap is now geographic and plausibly allelic, not a generic half-penetrance.

    Suggestions taken. Pancytopenia (HP:0001876) added, with Recurrent infections as its sequela, which routes an existing orphan phenotype through the mechanism that produces it. Oral mucosal lesions added at 17% (HP:0011830). The oral-cobalamin treatment no longer reads as an untested hypothesis: the systematic review states patients may be treated orally at higher doses and reports its own IGS sibling corrected on 1 mg daily, so the missing thing is a controlled comparison, not evidence that it works. A separate 'Spaced parenteral maintenance dosing' treatment records the 1 mg twice-yearly result from PMID:22854512, with dosing_interval_days, and states its own limits: seven patients, retrospective, no control arm.

    Beyond the review: all 14 phenotypes are now downstream targets, up from 2 of 9. Macrocytic anemia, Albuminuria, Decreased circulating vitamin B12 concentration and Failure to thrive were orphans that no finding named.

    One binding error caught in progress and worth recording: CHEBI:27786 was written with the label 'cobalamin' from recall and is hydroxocobalamin. The term validator caught it before commit. The identifier happened to be right for this treatment, which is the failure mode CLAUDE.md describes, arriving as confidence rather than as a guess.

    Two suggested references not taken. PMID:26958680 and PMID:17668238 were fetched during initial curation and pruned as uncited before the first commit; funicular myelosis is now covered by the systematic review's own count, and long-term neurodevelopmental sequelae would need a fresh fetch and a section this round does not open.

    Validation: schema, terms and references clean, 68/68 snippets verified, up from 56/56. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values clean for this file.

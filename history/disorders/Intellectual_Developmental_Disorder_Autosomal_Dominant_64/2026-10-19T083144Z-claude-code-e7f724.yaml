  summary: 'Create: MRD64 (ZNF292)'
  details: |
    Created from MONDO:0030934 (OMIM 619188, causal gene ZNF292 hgnc:18410). Deep research: OpenScientist. The first run returned a report about WDFY3 that never named ZNF292; just preflight-dr returned FAIL and the report was discarded without use (reported as #14907). For the second run the entry name was temporarily set to include the MONDO exact synonym 'ZNF292-related neurodevelopmental disorder' and then restored; that report passed preflight-dr (ZNF292 mentioned 52 times, OMIM 619188) with 4/4 references resolved. Primary sources read from cached full text: the defining 28-family cohort (PMID:31723249), an 8-individual case series (PMID:42650143), two single-case reports (PMID:40777882, PMID:42563850) and the hESC cortical interneuron knockdown study (PMID:40257863). The variant mechanism (haploinsufficiency vs NMD-escaping truncated protein) is left open as the defining cohort leaves it; functional_impact_category is UNKNOWN. ClinGen's Definitive ZNF292 assertion is for complex neurodevelopmental disorder (MONDO:0100038), a different MONDO disease, so no validity tier is recorded. The hESC model is typed OTHER because ExperimentalModelTypeEnum has no ESC-derived value (#12806). No GeneReviews chapter. Validation: just validate-disorders passed (34/34 snippets, terms, schema); check-entity-refs, check-causal-targets and check-coarse-phenotypes OK. After the PR opened, CI's 'Check for newly ungrounded genes' gate failed because the ZNF292 landing node had no molecular function; GO:0000981 (DNA-binding transcription factor activity, RNA polymerase II-specific, the term GO itself annotates for ZNF292) was bound with modifier ABNORMAL, with a BACKGROUND evidence item, and all 27 main.yaml gates were then run locally. Review round 1 (REQUEST_CHANGES, three phenotypes missing from Table 1 of PMID:31723249): added Strabismus (HP:0000486, FREQUENT), Nystagmus (HP:0000639), Feeding difficulties (HP:0011968, FREQUENT) and Constipation (HP:0002019, OCCASIONAL), each quoting the Table 1 row or the ocular-findings sentence. Also took the four suggestions: the epilepsy phenotype now cites the primary Table 1 row (3/28, OCCASIONAL); short stature carries FREQUENT; the inheritance block records penetrance INCOMPLETE with the cohort's own sentence; and a notes line explains why the unspecified skeletal and cardiac abnormalities (5/28 each) are not bound. validate-disorders passed (42/42 snippets) and all 27 gates passed locally.

  summary: Expand Psittacosis clinical/organ/laboratory phenotypes, evidence all pneumonia
    causal edges, upgrade ribosomal antibiotic target quotes, and add supportive critical
    care
  details: |
    Added 18 clinical, organ-dysfunction, and laboratory phenotypes supported by PMID:34817316 and PMID:42255501 (Productive cough, Chills, Fatigue, Myalgia, Sepsis, Septic shock, Delirium, Elevated hepatic transaminase, Hypoalbuminemia, Renal insufficiency, Acute myocardial injury, Lymphopenia, Neutrophilia, Elevated circulating C-reactive protein concentration, Elevated erythrocyte sedimentation rate, Elevated circulating creatine kinase activity, Increased circulating lactate dehydrogenase concentration, and Elevated circulating D-dimer concentration) and evidenced all 24 downstream edges from Atypical Pneumonia and Systemic Illness. Replaced the generic ribosome snippet (PMID:24336183) on Chlamydial Ribosomal Translation and Doxycycline target_mechanisms with 30S tetracycline A-site blockade quotes from PMID:29570352 (and added 50S exit-tunnel quotes to Macrolide Antibiotic Therapy). Softened top-level fluoroquinolone efficacy prose, standardized clinical-epidemiological PMID:42255501 snippets to HUMAN_CLINICAL + REVIEW_SYNTHESIS, and added Supportive Respiratory and Critical Care (NCIT:C15747).

  summary: Add isolated LCKAT deficiency subtype (WP-010 row 4.2.06.02)
  details: |
    Curated IEMbase WP-010 row 4.2.06.02 (HADHB-related isolated long-chain 3-ketoacyl-CoA thiolase deficiency) as a has_subtypes entry on the existing MTP deficiency entry rather than a new disease file, following the prior coverage audits on issue 5565 and the isolated-LCHAD/MTP split precedent already in this entry. Added: the subtype block with a skos:broadMatch to MONDO:0958185 (no MONDO term exists for the isolated-LCKAT biochemical phenotype); a subtype-scoped prevalence record (CASES_IN_LITERATURE, four reported patients); a subtype-scoped progression record; a biochemical record for the defining paired enzyme assay (reduced LCKAT with preserved LCHAD activity, the only test that separates this from complete MTP deficiency since the acylcarnitine profile does not); a subtype-scoped genetic record for the recurrent HADHB c.185G>A / c.1292T>C allele pair, with an explicit caveat that two patients sharing a genotype is a hypothesis not a rule; and sodium-D,L-3-hydroxybutyrate ketone body therapy with a BYPASSES target_mechanisms edge, evidence classified PARTIAL because the source reports only that treatment may have contributed to the survival difference in a single uncontrolled patient. Sources PMID:16423905 (index case, 2006) and PMID:35782614 (fourth case, 2022), both fetched with just fetch-reference. Validation: just validate-disorders passed schema, terms and references reporting 114/122 snippets verified against cached references with 8 skipped by prefix; just check-title-snippets clean.

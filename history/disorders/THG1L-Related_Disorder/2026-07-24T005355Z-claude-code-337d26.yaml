  details: |
    Incorporated ai4curation/ai-gene-review THG1L core_functions into the pathograph. Added the second, separable molecular function: THG1L/IHG-1 mitofusin guanyl-nucleotide exchange factor activity (GO:0005085) enhancing MFN2 GTP loading, plus stress-induced mitochondrial fusion (GO:1990046) and tRNA 5'-end processing (GO:0099116). Refined the THG1L LoF -> Mitochondrial Network Disruption edge from DIRECT to INDIRECT_KNOWN_INTERMEDIATES with the explicit intermediate 'reduced MFN2 GTP loading'. Added PMID:21059936 (3'-5' nucleotidyl transferase) and PMID:25008184 (IHG-1 MFN2 GEF) as snippet-validated evidence. Reframed the function-gap discussion around the two-function dichotomy and added a proposed allele-resolved assay (enzymatic vs GEF activity for V55A/C51W/L294P) that would decide dosage-threshold (lump) vs functional-branch (split). All GO IDs OAK-verified; schema/references/terms/enum-cache pass.

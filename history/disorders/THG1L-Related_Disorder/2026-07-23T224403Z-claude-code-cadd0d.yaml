  summary: Rebase severe subtype on Rabin 2021; model severity-gated distal branch
  details: |
    Lump-vs-split review of the THG1L spectrum. Verified the severe end against Rabin 2021 (PMID:33682303): p.Val55Ala/p.Cys51Trp compound heterozygotes have profound DD, microcephaly, intractable epilepsy AND cerebellar hypoplasia (shared cerebellar trunk retained; 'no ataxia' is ascertainment). No functional evidence that p.Cys51Trp ablates a different THG1L activity than the hypomorphic, guanylyltransferase-sparing p.Val55Ala, so severity tracks residual function (dosage/threshold), not a mechanistic branch -> lump with a severity-gated subtype, not split. Changes: rebased the Severe subtype from a thin p.Leu294Pro aside onto the Rabin C51W cohort; added a severity-gated distal pathophysiology node (Severe Neurodevelopmental and Epileptic Encephalopathy, biological_scale ORGANISM) off Mitochondrial Network Disruption with downstream Microcephaly / Epileptic Encephalopathy / Profound Global Developmental Delay; added those three phenotypes tagged subtype: Severe; corrected the nosology discussion (previously conflated Han 2023's moderate compound-het with the severe cohort); updated clinical_burden, prevalence (Rabin cohort + C51W carrier rate) and genetic notes. Validated schema/references/terms/offline enum-cache.

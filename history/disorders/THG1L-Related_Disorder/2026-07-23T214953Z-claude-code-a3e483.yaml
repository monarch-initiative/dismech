  summary: 'Create: THG1L-Related Disorder (SCAR28)'
  details: |
    De novo creation of the THG1L-related disorder entry (autosomal recessive mitochondrial cerebellar ataxia / SCAR28, MONDO:0032923, OMIM:618800, THG1L=hgnc:26053). Modeled THG1L loss-of-function -> mitochondrial network disruption (MFN2 fusion + mitochondrial tRNA-His maturation) -> Purkinje/granule cell degeneration -> cerebellar atrophy/ataxia, conforming to cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration. Evidence: Edvardson 2016 (PMID:27307223), Walker 2019 (PMID:31168944), Han 2023 (PMID:37670026), ClinGen Limited gene-validity (CGGV). Captured severity spectrum via has_subtypes (p.Val55Ala vs severe p.Leu294Pro) and two KNOWLEDGE_GAP discussions (which THG1L function drives disease; MONDO #10172 nosology proposal). Flagged that the issue's 'compound-heterozygous = severe epileptic encephalopathy' framing is not supported by the primary source (Han 2023 compound-het = moderate ataxia). Validated schema/references/terms/offline enum-cache.

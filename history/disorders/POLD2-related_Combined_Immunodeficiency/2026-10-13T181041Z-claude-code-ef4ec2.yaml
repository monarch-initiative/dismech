  summary: 'Create: POLD2-related_Combined_Immunodeficiency'
  details: |
    New entry for MONDO:1010175, the single published POLD2 patient (P1 of PMID:31449058, homozygous p.Asp293Asn). Kept separate from Immunodeficiency_120 (POLD1) and Immunodeficiency_122 (POLD3) because MONDO has a distinct term and the mechanism differs (complex instability rather than reduced catalysis). Six pathophysiology nodes from variant through complex destabilisation, reduced origin firing, replication stress and impaired T-cell proliferation to combined immune deficiency, plus a HYPOTHETICAL node for the growth and neurodevelopmental features. 13 HP-bound phenotypes restricted to P1; no frequency bands from a single case. Treatments: IVIG and co-trimoxazole/itraconazole prophylaxis. Validated with just validate, count-verified-snippets (all verified), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments and validate-disorders.

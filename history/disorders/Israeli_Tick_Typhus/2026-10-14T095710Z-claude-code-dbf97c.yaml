  summary: Bind LOINC group-level SFG serology code to the IFA diagnosis row, with
    a specificity caveat
  details: |
    Added diagnosis_term (NCIT:C25294 Laboratory Procedure) and diagnosis[].measurements binding LOINC:22474-1 (Rickettsia spotted fever group Ab [Presence] in Serum) to the Indirect immunofluorescence assay serology row. Unlike the other five entries bound this round, this row's description says the test 'can confirm recent R. conorii infection' -- a species-level claim -- while the only available LOINC code is group-level by its own label. To avoid asserting more specificity than the code supports, a notes field was added to the row stating that LOINC:22474-1 is group-level and does not itself distinguish R. conorii from other cross-reactive spotted-fever-group species, so the R. conorii-specific wording in the description describes the clinical context (an R. conorii-focused cohort), not what the code alone establishes. This fact is read directly from the code's own LOINC label ('spotted fever group') and needed no additional citation. A separate row (Skin biopsy rickettsial PCR and sequencing) already carries its own NCIT:C17003 PCR term and is unaffected. No new cache/loinc/terms.csv row was required -- 22474-1 was already cached from earlier LOINC tranche-B batches.

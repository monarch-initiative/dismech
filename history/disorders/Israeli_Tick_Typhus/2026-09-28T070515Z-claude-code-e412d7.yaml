  details: |
    Created a de novo Israeli tick typhus entry from the OpenScientist deep-research report, with Rickettsia conorii subsp. israelensis identity, Rhipicephalus sanguineus transmission, Sca2-to-endothelium invasion biology, TXA2-dependent platelet activation and microthrombus formation, cohort-backed Israeli phenotypes, IFA and PCR diagnostics, doxycycline and clarithromycin treatments, and a C3H/HeN R. conorii Malish infection mouse model.
    Addressed initial review by marking PMID:19421877 vector-background quotes as BACKGROUND, replacing load-bearing endothelial and vasculitis snippets with sentences that directly support the node claims, adding a human endothelial-dysfunction anchor, adding shock and abnormal bleeding phenotypes from the fatal pediatric series, and adding a clinical_burden block for the ISF ICU/fatality and strain-severity data.
    Left the non-blocking vascular-permeability split, environmental tick-exposure block, reservoir/incubation additions, and Hyponatremia category cleanup for later rather than expanding this review fix beyond the blocking findings.

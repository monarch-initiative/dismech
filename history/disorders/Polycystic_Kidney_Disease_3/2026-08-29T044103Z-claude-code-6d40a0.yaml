  summary: 'Create: Polycystic_Kidney_Disease_3'
  details: |
    Created kb/disorders/Polycystic_Kidney_Disease_3.yaml (MONDO:0010916, GANAB).

    Deep research was requested from falcon, which is not configured here, so the run used --fallback and claude_code produced the report; the substitution is recorded in the report frontmatter. The report was unusually clean: 27 of 27 references verified, 0.0 confabulation rate, both checked quotes valid, 56 of 58 terms verified with none not-found and none obsolete. Its needs_review flag reflects only the unresolvable ORPHA prefix and two label variants, not defects.

    Lump and split. Curated as a standalone entry rather than a has_subtypes entry on Autosomal_Dominant_Polycystic_Kidney_Disease, following the Polycystic_Kidney_Disease_2 precedent, which is likewise a gene-specific ADPKD form with its own MONDO term and its own entry. Two things justify it beyond precedent: the lesion is mechanistically upstream of the polycystin complex rather than within it, and the clinical trajectory is inverted relative to PKD1 and PKD2, with mild kidney disease and potentially severe liver disease. The parent entry already carries GANAB in its genetic block and nothing here contradicts that record.

    GeneReviews baseline. PMID:20301424 exists for ADPKD and is tagged GeneReviews in the top-level references. It is written for ADPKD as a whole and names GANAB only among the less common associated genes, so its Clinical Characteristics section describes the PKD1-dominated picture. That material is deliberately not imported as GANAB phenotypes. It is used for management, surveillance and the agents-to-avoid list, where it does apply to a GANAB carrier who has cysts, and every such item is graded PARTIAL and OTHER with an explanation saying it is ADPKD-general expert guidance rather than GANAB-specific evidence. Intracranial aneurysm, a cardinal ADPKD extrarenal feature, is deliberately not curated as a phenotype for the same reason and is recorded as a knowledge gap instead.

    Two findings from the deep-research cross-check changed the entry materially and both are negative or contrarian. First, PMID:32550232 reports that Ganab heterozygous mice develop no kidney or liver cysts, that homozygous deletion is embryonic lethal, and, critically, that polycystin-1 and polycystin-2 expression is unaffected in the heterozygous kidney. That directly contradicts the human GANAB heterozygous cell result on which the entry's central mechanism rests. It is curated as an animal model with relationship FAILS_TO_RECAPITULATE, fidelity LOW, two readouts graded REFUTE, and required limitations, plus a HUMAN_MODEL_MISMATCH discussion setting out the candidate reconciliations, none of which has been tested. Second, PMID:40134995 reports a GANAB carrier in Mayo imaging class 1E, the class predicting rapid progression, and was written to question the mildness assumption. The mildness claim in the renal node now carries that case as PARTIAL counter-evidence, and a knowledge gap records that mildness is modal rather than guaranteed, with the concrete consequence that surveillance intervals and therapy eligibility depend on it.

    A snippet-grading divergence was introduced and caught before commit. The sentence stating that GANAB mutations cause ADPKD and ADPLD and that cystogenesis is driven by PC1 maturation defects was quoted whole in a causal-edge item graded IN_VITRO while its opening clause was quoted in the inheritance block graded HUMAN_CLINICAL. just check-snippet-grading flagged it. The fix was to re-quote the causal edge with the cystogenesis clause alone, so the in-vitro and human-genetic claims in that sentence are cited separately rather than sharing one quote with two gradings. Three other early failures were also caught and fixed: GO:0051604 protein maturation was placed in molecular_functions where it is not a member of the dynamic enum and belongs in biological_processes; and Greek letters in the source title and in three snippets had been transliterated, which the title check and the reference validator both rejected.

    Validated with just validate-disorders, just validate-terms, just count-verified-snippets (26/26), just check-entity-refs, just check-duplicate-keys, just check-snippet-grading and just check-title-snippets. Compliance 95.9 percent.

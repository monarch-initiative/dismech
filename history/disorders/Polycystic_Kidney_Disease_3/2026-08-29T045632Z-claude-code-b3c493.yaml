  summary: 'Review response: add liver-directed treatment, counselling, testing modality'
  details: |
    Review response on PR #10007, addressing three IMPORTANT items and one non-blocking suggestion.

    Item 1, no liver-directed treatment. This was an internal inconsistency rather than an omission: the entry argues throughout that hepatic burden dominates and that importing the ADPKD trajectory gives unwarranted reassurance about the liver, then curated nothing that treats the liver. A treatment was added covering the full escalation the GeneReviews abstract already in the cache describes, from oestrogen avoidance and acid suppression through aspiration and sclerosis, laparoscopic fenestration, combined resection with fenestration, hepatic artery embolisation and liver transplantation. Graded PARTIAL and OTHER like the other GeneReviews-derived items, with the note that this recommendation applies with more force here than the renal ones do, because the liver is the compartment GANAB carriers are most likely to need it in. Somatostatin analogues were not curated: the research artifact names them but the cached GeneReviews text does not, and no GANAB-specific source supports them.

    Item 2, the GeneReviews genetic counselling section was not mined. The reviewer correctly observed that the entry's deliberate exclusion of the Clinical Characteristics section does not cover counselling, because that section names GANAB explicitly and its content is not PKD1-specific. The 50 percent transmission risk and the 10 to 20 percent de novo rate were added as evidence on the inheritance block, both graded OTHER as expert-review guidance, with the explanations stating why this material is inside scope where Clinical Characteristics is not. Prenatal and preimplantation testing availability is recorded in the inheritance description; the Inheritance class has no notes slot, so an initial attempt to put it there failed validation and was folded into the description instead.

    Item 3, diagnosis omitted how the diagnosis is actually made. The molecular testing entry now names the modality: a multigene cystic kidney and liver panel is the primary test, single-gene GANAB testing is cascade-only because reaching GANAB as a hypothesis already presupposes PKD1 and PKD2 exclusion, and the panel must include deletion and duplication analysis. PMID:32405593 was fetched and verified before quoting, as instructed, and supports the del/dup point directly: it reports large GANAB deletions and explains that exome sequencing is structurally poor at detecting them because of short read length and uneven PCR-based coverage. A results field was added stating what a positive test looks like.

    One non-blocking suggestion was taken: the HUMAN_MODEL_MISMATCH discussion now anchors on the animal model's name rather than on animal_models#Mouse, which is the stable pathograph label. The remaining suggestions were not taken in this round: hypertension as a phenotype has no GANAB-specific source in the cache, connecting the two INDIRECT_KNOWN_INTERMEDIATES edges to the parent entry's intermediates would duplicate content across entries rather than reference it, and an endoplasmic-reticulum protein-biogenesis module covering GANAB, PRKCSH, SEC63, ALG8 and SEC61B is a genuinely good idea but is module work rather than a change to this entry.

    Revalidated with just validate-disorders, just validate-terms, just count-verified-snippets (30/30), just check-entity-refs, just check-duplicate-keys and just check-snippet-grading. Compliance rose from 95.9 to 96.3 percent.

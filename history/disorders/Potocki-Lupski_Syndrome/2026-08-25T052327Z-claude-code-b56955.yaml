  details: |
    PR-shepherd run addressing review finding IMPORTANT 4, which called out Potocki-Lupski specifically as resting on five single-case reports with no review-level anchor. A PubMed genereviews[book] search confirms an active chapter, 'Potocki-Lupski Syndrome' (PMID:28837307). Fetched it with just fetch-reference and mined three exact-quote snippets onto the intellectual-disability phenotype, the infantile-hypotonia phenotype, and the 17p11.2 contiguous-gene duplication node (recurrent 3.7-Mb duplication in ~2/3 of cases; ~1/3 non-recurrent RAI1-containing duplications from 0.41 to 19.7 Mb). Validated with just validate, just validate-terms, and just count-verified-snippets.

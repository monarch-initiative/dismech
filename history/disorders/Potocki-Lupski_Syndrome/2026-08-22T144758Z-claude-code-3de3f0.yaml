  summary: 'Create: Potocki-Lupski Syndrome (17p11.2 duplication, RAI1)'
  details: |
    Created new entry for Potocki-Lupski syndrome (MONDO:0012574), the reciprocal 17p11.2 microduplication of Smith-Magenis syndrome. Curated from primary literature sourced via PubMed (no DR-provider run): PMID:23255863 (reciprocal SMS/PTLS, shared 2.1 Mb RAI1 interval), PMID:23078968 (smallest 0.25 Mb RAI1-only duplication -> milder phenotype), PMID:28413209 (~1/20,000 births; candidate genes), PMID:33043631 (neurological cohort; variable expressivity), PMID:38558960 and PMID:34820340 (craniofacial/FTT case reports). Modeled RAI1 dosage as the driver (HYPERMORPHIC), used has_subtypes (typical ~3.7 Mb vs small RAI1-only) and a phenotype_contexts severity link to encode the size->severity variability. All 24 snippets verified against cache; schema and term validation pass.

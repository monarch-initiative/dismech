  summary: Enriched classifications, pathophysiology ontology bindings and causal links, phenotypes, diagnostic modalities, and treatment evidence for Potocki-Lupski syndrome.
  details: >-
    Added Harrison's chapter classifications (GENETICS_ENVIRONMENT_DISEASE and NEUROLOGIC)
    with verbatim literature support. Grounded the Increased RAI1 Dosage pathophysiology
    node with HGNC:9834 and GO:0003700 (DNA-binding transcription factor activity), added
    anatomical locations (brain) and biological processes (nervous system development),
    and linked Neurodevelopmental Dysregulation to speech delay, sleep disturbance, ADHD,
    and infantile hypotonia. Added Oropharyngeal Dysphagia and Dental Malocclusion
    phenotypes, added MLPA diagnostic testing and microarray NCIT term bindings, and
    populated target_mechanisms and verbatim evidence for all supportive and rehabilitative
    treatments.

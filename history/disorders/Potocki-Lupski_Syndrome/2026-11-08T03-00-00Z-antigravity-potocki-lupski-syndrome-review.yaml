  summary: Enriched classifications, pathophysiology ontology bindings and causal links, phenotypes, diagnostic modalities, and treatment evidence for Potocki-Lupski syndrome.
  details: >-
    Added Harrison's chapter classifications (GENETICS_ENVIRONMENT_DISEASE and NEUROLOGIC)
    with verbatim literature support, and tagged the cited GeneReviews chapter
    (PMID:28837307). Grounded Increased RAI1 Dosage and Neurodevelopmental Dysregulation
    with brain/neuron locations and cell types plus nervous system development
    (GO:0007399), and linked Neurodevelopmental Dysregulation to speech delay, sleep
    disturbance, ADHD, and infantile hypotonia. Added Oropharyngeal Dysphagia (with
    sequela link to Failure to Thrive) and Dental Malocclusion phenotypes, added MLPA
    diagnostic testing and microarray NCIT term bindings, and linked Speech and Language
    Therapy and Physical and Occupational Therapy to their target phenotypes with
    verbatim evidence from PMID:38558960.

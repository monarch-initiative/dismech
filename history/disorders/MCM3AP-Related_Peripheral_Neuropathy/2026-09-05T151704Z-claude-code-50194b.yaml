  summary: 'Create: MCM3AP-Related Peripheral Neuropathy (PNRIID, GANP/TREX-2)'
  details: |
    New kb/disorders entry for PNRIID (MONDO:0029131), claimed via issue #11108. Curated as a nuclear mRNA export defect presenting as recessive Charcot-Marie-Tooth neuropathy, which is what distinguishes it from the rest of the recessive CMT differential: nothing in the mechanism concerns myelin proteins, axonal transport motors or mitochondrial dynamics. Chain runs biallelic MCM3AP variants to GANP depletion or Sac3-domain dysfunction to impaired TREX-2-mediated export to intron-content-dependent transcriptome alteration to length-dependent axonal degeneration. The last edge is typed INDIRECT_UNKNOWN_INTERMEDIATES with an attached KNOWLEDGE_GAP, because the disease-defining paper presents the export-to-degeneration link as a suggested potential mechanism and the report's own chain labels the same step inferred. Ten HPO-bound phenotypes, two allele classes with the fibroblast protein-level evidence that separates them, three treatments, three diagnostic entries, three differentials, two KNOWLEDGE_GAP discussions. The genotype-phenotype gap quotes the cohort's own statement that the intellectual disability and loss-of-ambulation comparison failed to reach statistical significance, rather than rounding a trend up to a finding. Deep research: OpenScientist report committed; 18/18 references resolved. Its quote validation flagged PMID:23652018 and PMID:27235683 as carrying unsupported quotes; neither is cited here and no quoted material from either was reused. PMID:28969388 has no PubMed abstract so it is reference-block only. The report's R-loop and transcription-coupled genome instability branch is deliberately not curated as a node, because the report marks its contribution to the neuropathy as inferred and no cached source carries a quotable statement connecting R-loops to this disease. Validation: schema pass, term validation pass, 43/43 snippets verified, check-entity-refs / check-causal-targets / check-duplicate-keys / check-enum-values clean.

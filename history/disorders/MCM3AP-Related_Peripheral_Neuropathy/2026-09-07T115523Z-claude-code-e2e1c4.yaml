  summary: 'Review round 1: re-anchor a mis-cited paper, split a mixed-source snippet,
    correct the acetyltransferase binding'
  details: |
    Review round 1 on PR #11119. Three blocking findings, all fixed, plus four
    of the six suggestions. One push.

    Finding 1 was the serious one and the reviewer read it correctly. The
    knowledge-gap discussion cited PMID:39228414 for "The MCM3AP
    genotype-phenotype correlation and prognosis remain unclear", explained as
    "a later review reaching the same conclusion". Two things were wrong. That
    sentence is the paper's BACKGROUND framing of prior literature rather than
    its result, and the paper is a primary study whose stated aim was to
    establish the correlation, not a review. The entry therefore cited a paper
    for close to the opposite of what it found, which is the worst failure mode
    an evidence item has, because it passes every gate: the PMID resolves, the
    snippet is an exact substring, and the grading is defensible. Only reading
    the paper's structure catches it.

    The item is removed from the gap, and the paper's actual RESULTS quote is
    curated in the genetic section where it belongs: the Sac3 inside-versus-
    outside comparison, 100% of individuals with mutations outside the domain
    showing early-onset symptoms, motor developmental delays and cognitive
    abnormalities, against 26.7% and 46.7% within it. The gap's rationale now
    says what that analysis does and does not do: it narrows the gap without
    closing it, being a different comparison, retrospective over the same small
    published population, with no significance test.

    Finding 2. The snippet "GANP has been described to function as an mRNA
    export factor, and to suppress TDP-43-mediated motor neuron degeneration in
    flies." was graded HUMAN_CLINICAL while its second clause is a Drosophila
    result. Split into two items, which is what the repository's rule about a
    paper mixing sources asks for: the export clause graded OTHER, since it is
    the paper's background summary of established molecular function rather
    than a result of the clinical study it reports, and the fly clause graded
    MODEL_ORGANISM with directness INDIRECT.

    Finding 3. GO:0004402 histone acetyltransferase activity named the wrong
    molecular function. The supporting quote says GANP acetylates MCM3, a
    replication protein, not a histone. Rebound to the substrate-neutral
    GO:0016407 acetyltransferase activity, and the modifier DECREASED dropped,
    since nothing cited measures the activity level in patients.

    Suggestions taken. The rehabilitation treatment now carries PMID:39228414's
    conclusion sentence, which is the only cached statement that recommends
    rehabilitation rather than describing the impairment it addresses; the
    previous quote was off-claim by its own explanation. The sensory edge is
    marked directness INDIRECT, since it reasons from CMT being sensorimotor by
    definition rather than from a measurement. PMID:41819534 is quoted by its
    conclusion rather than its aim sentence, and by its examination finding on
    the fasciculation phenotype. Areflexia HP:0001284 is curated from that same
    examination sentence at OCCASIONAL.

    Declined, with reasons. No animal_models entry for the fly result: it is a
    Drosophila TDP-43 model in which GANP was identified as a suppressor, not a
    model of this disease, and recording it as one would misrepresent what the
    experiment was. No prevalence block: no cached reference gives a rate, and a
    count of published families measures ascertainment rather than occurrence.

    Validation on this tree: just validate clean, 47/47 snippets verified, up
    from 43. Schema, terms, entity-refs, causal-targets, duplicate-keys,
    enum-values, qualifier-terms, snippet-length, title-snippets,
    snippet-grading and reference-titles all pass. One new cache row pair,
    GO:0016407, from the rebinding.

    One process failure in this round is recorded here rather than hidden. A
    backgrounded staging command finished late and overwrote the edited entry
    with the pristine copy after the gates had already passed on the edited
    version. It was caught by counting snippets and finding 43 where 47 were
    expected, and all ten edits were re-applied and every gate re-run. The
    lesson is not to leave background jobs that write files into the working
    tree while editing it.

  summary: 'Create: PEHO_Syndrome'
  details: |
    New entry for the ZNHIT3 disease bound by MONDO:0009841 (OMIM:260565), named ZNHIT3-Related PEHO Syndrome after the 'ZNHIT3-associated PEHO syndrome' form used in PMID:31048081 and PMID:35843310; the MONDO label, the long form and the eponymous neuropathology name are kept as synonyms. Lump/split decision: the entry is restricted to ZNHIT3. Other genes reported with a PEHO or PEHO-like phenotype (KIF1A, CCDC88A, PRUNE1, RARS2) are recorded as differential diagnoses; PEHO-like syndrome (MONDO:0020495) has its own stub and is not curated here. Deep research: one OpenScientist report (research/PEHO_Syndrome-deep-research-openscientist.md); 17/17 references resolved, term validation flagged needs_review only for loose report labels, none of which were copied. just preflight-dr returned PASS (ZNHIT3 mentioned 45 times, OMIM 260565 matches). Its leads were checked against primary sources; PMID:40178020 (Znhit3 null mouse embryos) was taken from it, and PMID:12949965 was cached but not cited because that Australian series predates genotyping and mixes PEHO with PEHO-like cases. Primary literature: gene discovery (PMID:28335020), Somer diagnostic criteria, EEG, neuroradiology and neuropathology series (PMID:8301648, PMID:8330584, PMID:8352158, PMID:8460530), the original description (PMID:2070547), the first non-Finnish compound heterozygote (PMID:31048081), yeast Hit1 modelling (PMID:35843310), conditional Znhit3 knockout mouse with p53/p21 rescue (PMID:41857137) and the fetal hydrops family (PMID:39252897, a medRxiv preprint with no published version found, flagged in each explanation). No GeneReviews or StatPearls chapter exists (just check-genereviews: NO_CHAPTER) and ClinGen has no ZNHIT3 validity record, so gene_disease_validity is absent. CSF IGF-1 and nitrate findings come from pre-genetic clinically defined cohorts and are labelled as such. Precocious puberty was not added because one of the two girls in PMID:21596701 was later found to carry a de novo KIF1A variant and the other was never genotyped (PMID:26486474). Validated with just validate, validate-terms, count-verified-snippets (85/85) and the per-file and whole-repo gates listed in the PR.

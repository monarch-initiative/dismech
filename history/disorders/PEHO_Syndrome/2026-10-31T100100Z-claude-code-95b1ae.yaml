  summary: Ground ZNHIT3 node with a molecular function
  details: |
    CI gate check_gene_activity_grounding reported ZNHIT3 as newly wired into the pathograph without a molecular function on its landing node (ZNHIT3 Loss of Function). Bound GO:0005515 protein binding (modifier DECREASED, preferred_term naming the NUFIP1 interaction) on that node. QuickGO lists only two molecular-function annotations for ZNHIT3 (UniProtKB Q15649): GO:0005515 protein binding by IPI with NUFIP1 (Q9UHK0) in five papers including PMID:28335020, and GO:0046966 nuclear thyroid hormone receptor binding by TAS from the original TRIP3 cloning, which is unrelated to the snoRNP mechanism. No ai-gene-review summary exists for ZNHIT3. Two evidence items were added: co-immunoprecipitation in PMID:39252897 (medRxiv preprint) showing a patient allele loses NUFIP1 and PIH1D1 binding, and the yeast Hit1 study (PMID:35843310) stating that Hit1 cooperates with Rsa1/NUFIP1 to recruit Snu13. Re-ran check-gene-activity-grounding (also with --against-ref origin/main), check-shared-disease-terms, compliance-connectivity, validate, validate-terms, count-verified-snippets (87/87) and validate-disorders. The branch did not conflict with origin/main, so no rebase was needed.

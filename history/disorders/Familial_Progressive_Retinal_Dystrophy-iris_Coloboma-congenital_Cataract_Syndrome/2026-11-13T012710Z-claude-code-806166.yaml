  summary: Review and enrich Familial Progressive Retinal Dystrophy-Iris Coloboma-Congenital
    Cataract Syndrome
  details: |
    Audited all snippets, evidence_source, and ontology bindings; set Harrison's chapter to GENETICS_ENVIRONMENT_DISEASE consistent with other inherited retinal dystrophies; added ocular anatomical locations and split anterior-segment/fissure development into Failure of Optic Fissure Closure (conforming to ocular_morphogenesis_failure#Failure of Optic Fissure Closure with GO:0061386 DECREASED, CL:0002672, CL:0002586 -> Iris coloboma) and Abnormal Lens Development (GO:0002088 ABNORMAL -> Cataract and hedged Developmental glaucoma, with edge-level medaka and human evidence); and added ophthalmic/molecular diagnosis entries (leaving Full-Field Electroretinography without diagnosis_term after verifying ols:ncit lacks an electroretinography term).

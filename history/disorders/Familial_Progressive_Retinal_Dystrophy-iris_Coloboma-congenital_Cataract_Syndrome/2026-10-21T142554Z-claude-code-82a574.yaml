  summary: 'Create: Familial_Progressive_Retinal_Dystrophy-iris_Coloboma-congenital_Cataract_Syndrome'
  details: |
    New entry for familial progressive retinal dystrophy-iris coloboma-congenital cataract syndrome (MONDO:0014747, MIR204), curated from the stub queue under claim issue #15125.

    Sources: a PubMed search for miR-204 with eye terms returned about 80 records, almost all about miR-204 as a biomarker or therapeutic in acquired eye disease. Five are cited: the defining five-generation family with medaka functional work (PMID:26056285), two independent families carrying the same n.37C>T variant (PMID:37321975 Czech, PMID:38867642 Chinese), the medaka knockdown study linking miR-204 to optic fissure coloboma and lens formation (PMID:20713703), and the miR-204 knockout mouse (PMID:31332443). Deep research was run with the claude_code provider (research/Familial_Progressive_Retinal_Dystrophy-iris_Coloboma-congenital_Cataract_Syndrome-deep-research-claude_code.md). Its quotes came from search summaries and were not used. It missed the Chinese family. Its one usable lead was a name-alike disease, which was checked against MONDO: MONDO:0014060 (RBP4) has the synonym 'retinal dystrophy, iris coloboma, and comedogenic acne syndrome' and is already curated, so a disambiguation sentence is in notes. Its prevalence figures (1 in 8,000; about 1,000 US cases) came from aggregator band placeholders and were not recorded.

    Content: the mechanism node records a seed-region variant with dysregulated target specificity (GO:0035195, modifier DYSREGULATED; functional_impact_category GAIN_OF_FUNCTION as the defining authors interpret it). The coloboma and cataract edges are INDIRECT_UNKNOWN_INTERMEDIATES and cite loss-of-function fish data with directness INDIRECT, because no study has tested the patient allele for those features. A knowledge-gap discussion asks whether the variant acts by new targets, lost targets or both, and proposes an endogenous knock-in versus a heterozygous null. Congenital glaucoma is recorded as a suggested feature from one family. No ClinGen record and no GeneReviews chapter.

    CI round 1 (PR #15132). The 'Check for newly ungrounded genes' gate failed because the MIR204 node named a gene but no molecular function. GO:1903231 'mRNA base-pairing post-transcriptional repressor activity', which GO defines for ncRNAs that act by base-pairing with a target mRNA, is now bound on that node; the gate passes against origin/main. The same push takes two reviewer suggestions: the Retinal dystrophy edge now cites the Chinese family's fundus finding rather than a carrier-status sentence, and notes record the OCA2 albinism in four Czech family members.

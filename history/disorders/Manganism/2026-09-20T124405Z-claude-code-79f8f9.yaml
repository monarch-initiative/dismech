  summary: 'Review round 1: phenotypes, iron supplementation, blood Mn interval'
  details: |
    Review round 1 on PR #12319. The blocking finding is a scoping collision, not a
    content defect, and is NOT resolved by this push - see below. The important and
    optional findings are all answered here, because they improve the content whichever
    way the collision is settled.

    BLOCKING, NOT RESOLVED HERE: kb/disorders/Manganism.yaml already exists on main and
    binds the same MONDO:0017638. Verified against origin/main rather than taken on the
    review's word: the file is there, it binds that term, and
    kb/groupings/Parkinsonism_Dopaminergic_Degeneration_Disorders.yaml references it at
    line 33 as `- member: Manganism` and in narrative at line 18. My candidate screen ran
    `ls kb/disorders/ | grep -i Manganese`, and "Manganism" does not contain "Manganese" -
    one word stem. The stub and claim checks I ran were correct and both blind to
    kb/disorders/. Worse, I listed the groupings early and reasoned about whether
    manganism *should* belong to the parkinsonism grouping without checking whether it
    already *was* a member. `grep -rl "<MONDO ID>" kb/` before starting is the fix.
    Resolution direction - fold into Manganism.yaml, or supersede it - is a human call and
    has been put to the user with a recommendation of folding; nothing here presumes it.

    PHENOTYPES ADDED, and the reviewer's leads were checked rather than taken. HP:0001260
    Dysarthria, HP:0000338 and HP:0001337 all resolve with the labels given, except that
    HP:0000338's canonical label is "Hypomimic face", not the "hypomimia" the review
    called it; the entry uses the canonical label with the clinical term in
    preferred_term.

    - Hypomimic face is DIRECT, and on better evidence than the review proposed. Rather
      than infer it from the Racette cohort's "impairment of speech and facial
      expression", PMID:42563869 names masked facies in occupationally exposed workers,
      which is this entry's population.
    - Dysarthria is INDIRECT twice over and says so. The occupational cohorts measure
      "impairment of speech" as one UPDRS item without separating articulation from
      volume, and the only cached sentence naming dysarthria outright describes the
      inherited childhood transporter defect. Both items are cited, graded INDIRECT, with
      the population difference stated rather than elided.
    - Tremor turned out to be a controversy rather than a gap, which the review's framing
      missed. Three cached reviews disagree: one lists "rapid postural tremor" among the
      motor impairments, one says resting tremor specifically is not a distinguishing
      feature, and PMID:42563869 states flatly that patients with manganism have no
      tremor. The phenotype is curated with the postural characterisation in
      preferred_term, the denial is carried as a REFUTE, and a new `tremor_in_manganism`
      CONTROVERSY discussion records that the entry does not have the evidence to decide
      it. This matters because tremor quality is a discriminator the Parkinson disease
      differential rests on.

    All three are wired into Basal Ganglia Output Failure, so connectivity stays 13/13.

    OPTIONAL FINDINGS TAKEN. Iron supplementation added as an adjunct treatment - it is
    the mirror image of the iron-dependence already recorded on the transport node, since
    manganese rides the iron carriers, and it targets that node with treatment_effect
    INHIBITS. Bound to NCIT:C15433 Nutritional Support with CHEBI:29033 iron(2+) as the
    agent, and tagged SMALL_MOLECULE rather than BEHAVIORAL, per CLAUDE.md's explicit
    warning against reading C15433 as a diet-pattern change when it names a chemical.
    NCIT:C210688 Iron Supplement exists but reaches neither NCIT:C25218 nor NCIT:C1909, so
    it fits neither slot. A `biochemical:` block now carries the whole-blood manganese
    reference interval from PMID:18322282 as a one-sided range (<209 nmol/L, no lower
    bound asserted because the source gives none), with two interpretation_bands and the
    caveat that a normal value does not exclude manganism after exposure ends.

    THE REFERENCE COUNT WAS WRONG AND IS CORRECTED. The CREATE record said "eighteen are
    cited"; the entry cited seventeen, which is what the PR body said. Corrected in that
    record, which is unmerged, rather than left to contradict the file.

    I WROTE TWO CURIES FROM MEMORY IN THIS ROUND AND BOTH WERE WRONG. HP:0500213, written
    as "Abnormal circulating manganese concentration", is Decreased CSF threonine
    concentration - caught by the term validator. Worse, the biochemical block's
    biomarker_term was NCIT:C765 labelled Potassium, copy-pasted wholesale from the
    Digitalis_Poisoning entry: self-consistent, validator-clean, and naming the wrong
    element entirely on a manganese marker. That is precisely the failure class CLAUDE.md
    documents under "A Gene Binding Only Has To Be Self-Consistent", landing on a
    biomarker. Corrected to HP:0032097 Hypermanganesemia and NCIT:C624 Manganese, both
    from live OLS lookups. This is the third time in this session; recorded rather than
    quietly fixed.

    VALIDATION. just validate passes with 67/67 snippets verified, up from 55. Every new
    snippet was pre-verified as an exact substring before the YAML was written. 13/13
    phenotypes causally connected. check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-enum-values all pass.

  summary: Expand Manganism mechanism chain; wire exposure into pathograph; source
    levodopa failure
  details: |
    Expanded the pathophysiology chain from two nodes to five and connected the environmental exposure to it, so the entry now models how manganese actually reaches the basal ganglia rather than asserting that it does.

    New nodes: (1) Manganese Overexposure and Failure of Hepatobiliary Clearance - body burden is the balance of intestinal absorption against biliary excretion, so overload arises from excess intake, impaired excretion (liver failure, cholestasis), or a route bypassing first-pass hepatic clearance (inhalation, TPN). (2) Transporter-Mediated Manganese Uptake into the CNS - influx via DMT1/SLC11A2, ZIP8, ZIP14 balanced against efflux via ferroportin and SLC30A10, with the SLC30A10 human genetics cited as evidence that the transport step is causally sufficient. (3) Mitochondrial Complex II-Dependent Reactive Oxygen Species Production.

    The environmental entry gained influences_mechanisms (TRIGGERS, DIRECT) onto the overexposure node with its own evidence. Previously the exposure was a disconnected list entry and did not appear in the pathograph at all. The graph is now fully connected from exposure through to parkinsonism with no node lacking an incoming edge.

    DELIBERATE NON-CONFORMANCE, recorded in the node notes: the new Complex II node is NOT wired to parkinsonism_dopaminergic_degeneration#Mitochondrial Complex I Inhibition and Oxidative Stress. PMID:23315522 tests complex I directly and excludes it - complex I substrates malate and glutamate fail to support Mn-induced H2O2 production, and complex I inhibition does not abolish it, while complex II inhibition does. The module node names complex I, which is right for the MPTP and rotenone conformers. Declaring conformance would have validated cleanly while asserting the wrong respiratory complex.

    Added treatments: levodopa, sourced to the placebo-controlled double-blind study showing failure to respond (PMID:7936281) - the entry previously asserted poor levodopa response in prose with no evidence; and removal from exposure, with the same study's observation that deficits progressed for five years after patients left the exposure site, so removal is necessary but not sufficient.

    Deep research (claude_code, 845s, 44 citations) was run and is committed, but its own reference-validation pass flagged ~10 quotes as absent from their cited papers, and the run errored before writing its validation section. Two of the flagged claims were checked independently and both are unsupported: 'absence of nigrostriatal dopamine neuron degeneration' attributed to PMID:26154659 does not appear in that review's abstract, and a claimed levodopa response attributed to PMID:37627255 does not appear in that abstract either. No DR-sourced quote was curated. Every snippet added here was pre-verified against the local cache before being written.

    Validated with just validate, just validate-terms, just count-verified-snippets (17/17), and a graph build confirming no orphan nodes.

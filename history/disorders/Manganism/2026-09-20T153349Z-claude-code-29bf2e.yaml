  summary: Merge Manganese_Poisoning into Manganism; review round 2 items
  details: |
    Folded the duplicate entry kb/disorders/Manganese_Poisoning.yaml into the pre-existing kb/disorders/Manganism.yaml (same MONDO:0017638) and deleted the duplicate. Direction chosen by the repository owner after the reviewer and curator both declined to pick unilaterally.

    The two files cited disjoint literature - 8 references against 17, zero overlap - so the merge folded the older entry's whole evidence base into the newer structure rather than replacing it. Carried over: PMID:33911374 (hepatobiliary homeostasis, influx and efflux carriers, symptom ordering), PMID:22341971 (SLC30A10 human genetic proof the transport step is causally sufficient, graded INDIRECT because the patients have the inherited transportopathy), PMID:20012385 and PMID:37627255 (deposition pattern), PMID:23315522 (three in-vitro results behind a new Microglial Complex II-Dependent Reactive Oxygen Species Production node, plus its paired HUMAN_MODEL_MISMATCH discussion), PMID:26608821 (basal ganglia circuit mechanism and clinical definition), PMID:7936281 (placebo-controlled levodopa failure and five-year post-cessation progression, both PRIMARY_RESULT where the entry previously had only review syntheses), and both GEO datasets.

    Kept the older file's name and 2026-06-11 creation_date, so the Parkinsonism_Dopaminergic_Degeneration_Disorders grouping's '- member: Manganism' foreign key and its narrative mention resolve without an edit. Merged the two files' categories, parents and synonyms.

    The conforms_to anchor was re-read rather than carried across. The module node is named 'Striatal Dopamine Deficiency and Basal Ganglia Circuit Dysfunction' while this entry argues the lesion is pallidal and postsynaptic, but the module's own description of that node states the exception verbatim - manganism as a partial exception with predominantly pallidal pathology and poor levodopa response - so the module has already scoped itself to include this disease. Recorded on the node, with the observation that the dopamine half is carried by the upstream Impaired Striatal Dopamine Release node.

    Review round 2 blue items, all three: (a) psychiatric prodrome curated as four new phenotypes from PMID:26154659 - HP:0000712 Emotional lability (new evidence on the existing node), HP:0002354 Memory impairment, HP:0000722 Compulsive behaviors, HP:0000746 Delusion, plus HP:0100543 Cognitive impairment from the fold; the reviewer's suggested HP:0000723 'Personality changes' was NOT used because HP:0000723 is Restrictive behavior, the same wrong label this entry's own research report produced; (b) the PMID:40278159 resting-tremor negative regraded SUPPORT/DIRECT to SUPPORT/INDIRECT; (c) the NCIT:C210688 negative-existence claim now records the adapter, the command and the returned ancestor path.

    Every snippet carried over in the merge was independently re-verified as an exact substring of its committed cache before being written, 23/23. Validation: 90/90 snippets, schema and term validation clean, 17/17 phenotypes causally connected.

  summary: 'Create: Manganese Poisoning (MONDO:0017638)'
  details: |
    New entry for acquired manganese poisoning (manganism), the gap in this KB's
    metal-toxicology family beside lead, mercury, arsenic, cadmium, thallium and iron.
    No stub and no open claim issue existed for it.

    SCOPE. Bound to MONDO:0017638, whose own definition scopes it to chronic inhalation by
    people working with manganese ore. The inherited manganese transporter defects
    (MONDO:0013208 SLC30A10, MONDO:0014864 SLC39A14) are deliberately NOT folded in; they
    are differential diagnoses, and they are cited inside the pathophysiology because they
    are the closest thing to a controlled human experiment showing manganese overload alone
    produces this syndrome.

    A DEEP-RESEARCH REPORT ALREADY EXISTED AND WAS NEVER CURATED.
    research/Manganism-deep-research-claude_code.md was committed 2026-08-31 with 44
    citations and an empty mondo_id. It was read for leads and for its curation cautions,
    and for nothing else: its own reference-validation block records 17 of 22 quoted claims
    not found in the cited source. A second run was launched for Manganese_Poisoning and had
    not written a report by the time the entry was finished; the entry does not depend on
    it.

    THREE OF THE REPORT'S LEADS WERE CHECKED AND TWO DID NOT SURVIVE.
    - Its caution that NCIT has no clinical-action term for chelation therapy: confirmed.
      Searching NCIT for 'Chelation Therapy' returns D-methionine formulations and
      gadolinium chelate nanoparticles. The chelation treatments bind NCIT:C15986
      Pharmacotherapy with the agent in therapeutic_agent, as it advised.
    - Its recommendation of NCIT:C334 Edetate Calcium Disodium as the therapeutic_agent:
      WRONG for this slot. `ancestors -p i` shows C334 reaches neither NCIT:C25218 nor
      NCIT:C1909, so it is outside the ChemicalEntityTerm root. Bound CHEBI:4757 EDTA
      monocalcium diisodium salt instead, which is the same substance and validates.
    - Its ICD-10-CM T57.2 mapping: the code is real and resolves in the local build, but I
      first wrote `mapping_source: MONDO` for it, which is false. MONDO:0017638 carries no
      ICD-10-CM xref at all - its xrefs are EFO, GARD, MESH:D020149, MedDRA,
      Orphanet:306682, SCTID and ICD9:503, the last `relatedTo` and pointing at the
      pneumoconiosis rather than the encephalopathy. Corrected to `dismech curation` with
      the xref list stated in the justification. This was my error, caught in the red-team
      pass by querying MONDO instead of trusting the report.

    TERMS. Every CURIE was read from a live lookup in the same step it was written. HP, GO,
    CL, UBERON, CHEBI, NCIT and MONDO against OLS; ECTO and HGNC against the pinned local
    builds. ECTO turned out to have an exact occupational term, ECTO:7000129 exposure to
    welding fume, which the occupational route binds in preference to the generic
    ECTO:9000946; the three searches run are recorded verbatim in that entry's notes.
    NCIT:C16809 and NCIT:C15843 were confirmed reachable from NCIT:C25218 before being used
    in diagnosis_term and treatment_term slots.

    EVIDENCE. All 55 snippets were pre-verified as exact substrings of committed caches
    before any YAML was written; `just validate` confirms 55/55. Thirty-four references were
    fetched, seventeen are cited. Gradings worth noting: PMID:17127642 is titled as a
    welding-fume exposure study and is six cynomolgus monkeys in an inhalation chamber, so
    it is graded MODEL_ORGANISM, not the HUMAN_CLINICAL its title invites. PMID:23262390's
    introduction is quoted twice with quote_role BACKGROUND, once graded HUMAN_CLINICAL for
    the human occupational syndrome it describes and once MODEL_ORGANISM for the authors'
    own prior primate work.

    THE PD DISTINCTION IS THE ENTRY'S SPINE, AND IT IS NOT FLATTENED. Perl and Olanow give
    pallidal damage with SNpc sparing and no Lewy bodies, and state the two are distinct
    entities. But asymptomatic welders show reduced FDOPA uptake, and Mn-exposed primates
    show inhibited dopamine release with terminals intact. Rather than assert that the
    dopaminergic system is untouched, the entry carries a second EMERGING hypothesis group
    for functional presynaptic dysfunction without degeneration, a dedicated
    `Impaired Striatal Dopamine Release` node, and a CONTROVERSY discussion. The
    discriminating detail is spatial: the welder FDOPA pattern is caudate-first, anatomically
    reversed from idiopathic PD, and that sentence is cited beside the one it constrains.

    ONE HUMAN_MODEL_MISMATCH IS REAL AND RECORDED. Manganese induces alpha-synuclein
    aggregation in exposed primate frontal cortex; human cases with directly measured
    pallidal manganese show negative alpha-synuclein immunostaining. Both are cited on the
    same discussion, the primate one SUPPORT and the human one REFUTE.

    NO PREVALENCE FIGURE IS GIVEN. The most-cited occupational estimates come from 1,423
    Alabama welders referred for medical-legal evaluation for Parkinson disease - a
    population selected for the outcome being measured. That study is cited with
    `supports: NO_EVIDENCE` in an INTERPRETATION discussion explaining why its rate cannot
    be read as an occupational prevalence. The dose-response relationship from the
    trade-union longitudinal cohort (PMID:28031394) is carried instead.

    RED-TEAM PASS, six fixes, all before commit. The false ICD-10 provenance above; a missing
    quote_role: BACKGROUND that the deterministic checker flagged on the parenteral-nutrition
    item; an unsourced superlative calling the MRI finding the single most useful diagnostic
    test; "several series report progression after cessation" when two are cited; an
    unsourced 50-fold astrocyte gradient asserted in prose, now carrying the quote that
    states it; and "manganese has no dedicated importer", softened to match what the source
    says. A separate reachability check confirmed all 15 pathophysiology nodes have an
    upstream edge and every downstream target resolves - the failure `check-causal-targets`
    structurally cannot see.

    GAPS, all disclosed in the entry's notes: ferroportin and the citrate-transporter route
    are named in the anchor review but not modelled; Orphanet:306682 is an equivalentTo xref
    and would be citable, but the Orphadata bulk XML is not present in the worktree so no
    ORPHA record was built; no ClinicalTrials.gov identifier exists for manganism and none is
    asserted.

    VALIDATION. Schema, terms and references pass with 55/55 snippets verified. 10/10
    phenotypes causally connected. check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-enum-values, check-qualifier-terms clean;
    list-background-citations at zero findings after the one fix.

  summary: 'Review: cite uncited prevalence claims, add C4OH marker, module conformance,
    missing phenotypes'
  details: |
    Review of the second-oldest unreviewed disorder entry (creation_date
    2025-06-12).

    Uncited quantitative prevalence claims (the principal finding). The single
    prevalence record carried no evidence at all, used the deprecated free-text
    percentage field, and asserted two specific numbers in its notes: an
    incidence of "approximately 1:32,237" in a Chinese newborn-screening cohort
    of 206,977, and "over 149 patients have been reported worldwide". Both came
    from a deep-research report rather than a verified source. Tracing them:

    - The 1:32,237 figure is real but was unverifiable from the cache, which held
      only the abstract of DOI:10.3389/fgene.2024.1387423; the abstract never
      mentions beta-ketothiolase deficiency. Fetched the open-access full text,
      which does contain it. Retained as its own record but reframed honestly:
      it is a single-centre, ancestry-specific rate confined to the Miao
      minority, roughly 35-fold above the Chinese national estimate, and must not
      be read as a general population rate. It was previously the entry's only
      prevalence statement.
    - The "149 patients worldwide" figure was a misreading. PMID:31268215's 149 is
      the count of genetically characterised patients in an ACAT1 mutation
      update, not a worldwide case total. PMID:34001203 states approximately 250
      patients have been reported worldwide since 1971. Both are now recorded, in
      a CASES_IN_LITERATURE record, with the distinction made explicit.
    - Added the record that was actually missing: the Chinese national
      newborn-screening incidence of about 1 per 1,000,000 from 16,088,190
      screened newborns (PMID:34001203) - by far the largest denominator
      available and the appropriate headline figure.

    All three records now use the structured measure_type / prevalence_class /
    rate_per_100000 slots instead of free text.

    Missing biomarker: C4OH. The biochemical section listed 2M3HB, TIG, 2MAA,
    C5:1 and C5-OH but omitted 3-hydroxybutyrylcarnitine (CHEBI:72995), which is
    the entire subject of PMID:34001203 and is clinically consequential rather
    than incidental: it was raised in 94% of the cohort, and two patients had
    elevated C4OH with normal C5-OH and C5:1 even during acute decompensation -
    exactly the false-negative pattern that causes BKD to be missed on the
    conventional two-marker screening panel. Added as a biochemical marker with a
    readout edge off the impaired-ketolysis node, a causal edge from the
    organic-acid accumulation node, and a corresponding update to the newborn
    screening treatment and its description.

    Missing differential diagnosis. The entry did not record that elevated
    urinary 2M3HB and TIG are not specific to BKD: the same pattern occurs in
    HSD10 mitochondrial disease (HSD17B10, OMIM #300438) and patients have been
    misdiagnosed as BKD on metabolite data alone, so enzyme assay or ACAT1
    mutation analysis is required to confirm rather than merely characterise the
    diagnosis. Added to notes, along with the genotype-phenotype dissociation
    (clinical phenotype does not track genotype; outcome tracks timeliness of
    diagnosis).

    Missing trigger and safety point. The recognised trigger set was "infection,
    fasting, or ketogenic diet". PMID:34001203 adds diarrhoea and, importantly,
    the inflammatory response to vaccination - two cohort patients decompensated
    after vaccination, one fatally, and the authors note the vaccine reaction can
    look clinically identical to a metabolic decompensation, delaying
    recognition. Added to the decompensation node description and evidence, and
    to the trigger-avoidance treatment with a note clarifying that this is a
    caution about recognition and timing, not a reason to withhold vaccination.

    Module conformance. The entry had no conforms_to anywhere despite being a
    textbook intoxication-type inborn error. Added three conformance edges to
    metabolic_intoxication_decompensation - Enzymatic Block in Intermediary
    Metabolism on the ACAT1 node, Toxic Metabolite Accumulation and Energy
    Deficit on the organic-acid accumulation node, and Acute Metabolic
    Decompensation on the episodic decompensation node - plus biological_scale
    tags on those nodes.

    Missing phenotypes. Dyspnea (HP:0002094), named in the Orphanet definition
    but absent, and Fever (HP:0001945), among the presenting features of the
    62% of the Chinese cohort who were symptomatic. Both wired into the acute
    crisis syndrome node rather than left floating. Built and committed the
    previously absent ORPHA:134 structured cache record.

    Unevidenced treatments. Dietary management and the trigger-avoidance
    treatment carried no evidence; both now cite sources, with the dietary
    citation deliberately marked PARTIAL and its note rewritten to say plainly
    that it establishes mechanistic rationale, not efficacy - there is no
    controlled trial evidence for diet in BKD and the previous note implied the
    gap was merely one of abstract availability.

    Progression. The long-term outcome phase said only that prognosis is
    "generally favorable"; quantified it (19/23, 82% favourable; one
    developmental delay; three deaths) and added the finding that outcome tracks
    timeliness of diagnosis rather than genotype.

    Validation. Schema, term and reference validation all pass. The Miao-cohort
    snippet is quoted in a deliberately short form because the source PDF text
    contains broken ligatures ("de ﬁciency") that would not match reliably.

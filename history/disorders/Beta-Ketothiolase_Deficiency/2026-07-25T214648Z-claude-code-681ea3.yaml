  summary: Fix prevalence_class band error introduced by the prevalence split
  details: |
    Addresses the re-review on PR #6966, which confirmed the three prior items
    fixed and found one new error introduced by the fix itself.

    prevalence_class contradicted its own rate. The new Huaihua whole-cohort
    record carried prevalence_class: BELOW_1_IN_1000000 with rate_per_100000:
    0.483. The arithmetic was right - 100000/206977 = 0.483 - but the schema
    defines BELOW_1_IN_1000000 as under 0.1 per 100,000, and 0.483 per 100,000
    is 4.8 per million. Correct band is BAND_1_9_PER_1000000. The reviewer's
    diagnosis of how it happened is right: the tier was carried over from the
    national record immediately above, where BELOW_1_IN_1000000 IS correct
    (0.087). The other two records were already correct.

    Worth noting the shape of this: the previous round split one over-precise
    record into two honest ones, and the split itself introduced a
    band-versus-rate contradiction. Adding structure adds places to be wrong.

    Non-blocking items also fixed:
    - HSD10MD was stated twice after the last round - once as the new evidenced
      diagnosis entry and once as the older uncited notes paragraph. The uncited
      prose is removed; the evidenced entry is the single source.
    - The diagnosis entry now carries diagnosis_term MAXO:0000127 genetic
      testing, which is what the entry actually recommends (enzyme assay or
      ACAT1 mutation analysis rather than metabolite data alone).
    - CHEBI:72995 3-hydroxybutyrylcarnitine added to the ketone-body node's
      chemical_entities, so the node the C4OH edge now hangs off actually names
      the metabolite.
    - Restored the list conjunction dropped when C4OH was removed from the
      isoleucine node description.

    Noted, no action: the reviewer flagged that the ReferenceRange snippet is not
    byte-exact - the cache uses U+2009 and U+00A0 where the YAML has ASCII spaces
    - and validates only because the matcher normalizes whitespace. Left as-is
    deliberately; pasting raw Unicode into the YAML would be worse for
    readability and diffing, and the normalization is the documented matcher
    behaviour rather than an accident.

    Validation. Schema, term and reference validation all pass.

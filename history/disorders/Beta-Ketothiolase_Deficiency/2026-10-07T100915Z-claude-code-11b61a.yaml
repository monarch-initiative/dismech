  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    LOINC tranche A batch 5 (issue 13642). Added a newborn-screening diagnosis row (NCIT:C81178) ahead of the existing confirmation row, with measurements bound to LOINC:50106-4 (C5-OH in DBS), LOINC:53170-7 (tiglylcarnitine C5:1 in DBS) and LOINC:50102-3 (3-hydroxybutyrylcarnitine C4-OH in DBS). C5-OH is bound to the 3-hydroxyisovalerylcarnitine DBS code because that is the quantity a screen reports as C5-OH; the row notes record the species-specific code LOINC:50086-8, the combined Part LOINC:LP66332-5 and the isobaric-sum codes LOINC:67709-6 and LOINC:67708-8 and why none of them is bound. Two reference ranges from the Gifu, Japan pilot MS/MS newborn screen as reported retrospectively for an HSD10 disease proband (PMID:27306202): C5:1 upper cutoff limit 0.05 nmol/mL and C5-OH upper cutoff limit 1.0 nmol/mL; the Chinese multicentre cohort reference values (PMID:34001203, C5:1 0-0.05 and C5-OH 0.06-0.5 umol/L) are cited in the notes and not drawn as bands because that paper calls them reference values. C4-OH carries no band: the cohort paper says only that its cutoff is at the 99.5 centile. Row evidence also from PMID:40981306 (three Italian screen-detected cases). On the biochemical markers, loinc_term bound to the Parts LOINC:LP66336-6 (tiglylcarnitine), LOINC:LP65143-7 (2-methyl-3-hydroxybutyrylcarnitine) and LOINC:LP19307-5 (3-hydroxybutyrylcarnitine); the existing C4OH reference interval now carries loinc_term LOINC:50102-3, and its note claiming LOINC had no code for 3-hydroxybutyrylcarnitine was removed because the Monarch KG search returns both the Part and the DBS code. Labels seeded by just loinc-seed-cache; validate, validate-terms, count-verified-snippets, validate-disorders, check-duplicate-keys, check-entity-refs and check-snippet-grading all pass.

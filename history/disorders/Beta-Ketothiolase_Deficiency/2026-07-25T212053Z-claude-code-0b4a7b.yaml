  summary: 'Address code review: C4OH edge on wrong node, one-case prevalence honesty,
    Fever causal direction'
  details: |
    Addresses the automated code review on PR #6966. All three items were
    correct, and item 2 in particular is the same class of error the PR itself
    was correcting.

    C4OH causal edge was on the wrong node (item 1). The edge was hung off
    Isoleucine-derived organic acid accumulation, and C4OH was appended to that
    node's description as an isoleucine intermediate. C4OH is not
    isoleucine-derived - it comes from D-3-hydroxybutyrate via the KETOLYSIS arm,
    as the cited source states and as the edge's own description said, so the
    edge contradicted the node it hung from. Worse, this erased the paper's
    actual mechanistic point: C4OH rescues C5-OH/C5:1 false negatives precisely
    BECAUSE it reports the other arm of T2 function. Edge moved to Impaired
    ketone body metabolism, C4OH removed from the isoleucine node description,
    and the edge description now states the two-arm distinction explicitly. The
    biochemical readouts block had already pointed at the correct node, so the
    file was internally inconsistent.

    One-case prevalence stated as a precise rate (item 2). The Miao record gave
    rate_per_100000: 3.1 from "1:32,237" and its notes implied that figure was
    over the 206,977 screened neonates, with "all cases" plural. Checking the
    cached full text: Table 5 records BKD as 1 case, 1:206,977, and the
    Discussion says "one case of BKD was detected in a Miao patient with an
    incidence rate of 1:206,977". The 1:32,237 in the Results text is that SAME
    single case over the Miao-only denominator of about 32,237 - corroborated by
    the neighbouring VLCADD entry (2 Miao cases, 1:16,119, implying the same
    subpopulation size). So the ancestry-specific reading was right, but the
    record silently took the larger of two published numbers for one patient and
    presented it as a population rate. Given that this PR's whole thesis is about
    over-precise uncited numbers, that is the error it was written to prevent.

    Split into two records that both state n=1 explicitly: a whole-cohort record
    (1:206,977, BELOW_1_IN_1000000) and an ancestry-specific record (1:32,237,
    retained because the Miao restriction is a real reported observation), each
    quoting the source text that supports it, with notes stating that a
    single-case denominator cannot support a precise incidence and that the gap
    between the two published figures for the same patient is itself a caution.
    The whole-cohort snippet also replaces the semantically empty
    "(BKD, 1:32,237) were only" fragment with the ligature-free Table 5 row.

    Fever edge asserted a causation its own description denied (item 3). Fever
    was downstream of Acute ketoacidotic crisis syndrome with the description
    "Fever accompanies the intercurrent infection that both triggers and
    coincides with the crisis" - i.e. trigger-side, not consequence. Edge
    removed. The phenotype is retained (it is a real and frequent presenting
    feature) with a notes field stating that it deliberately carries no incoming
    causal edge because wiring it downstream would invert the causal direction.

    Suggestions implemented:
    - Module conformance extended from 3 of 5 nodes to 5 of 5: added
      #Acute Metabolic Encephalopathy on the acute crisis syndrome node and
      #Neurological Injury and Multiorgan Crisis on the neurological
      complications node, with biological_scale tags.
    - Added a ReferenceRange block on the C4OH biomarker (0.02-0.3 umol/L, with
      the observed patient median of 1.38 and range 0.26-3.58 in the notes). No
      loinc_term is bound because LOINC has no code for
      3-hydroxybutyrylcarnitine; that is stated rather than left blank.
    - Converted the HSD10 mitochondrial disease differential from uncited notes
      prose into an evidenced diagnosis entry with three quoted sentences,
      including the one documenting that the misdiagnosis has actually occurred
      in published reports rather than being merely theoretically possible.

    Validation. Schema, term and reference validation all pass.

  summary: 'Create: SAPHO syndrome (MONDO:0019266)'
  details: |
    New Disease entry for SAPHO syndrome (MONDO:0019266), curated from the stub queue after a four-surface duplicate preflight (claim issues, git grep of origin/main kb/, open PRs, stub queue) came back clean.

    Pathograph: a ten-node chain from innate immune dysregulation through a self-amplifying TNF-alpha/IL-1beta/IL-6/IL-8/IL-23-IL-17 cytokine hub, branching to neutrophil recruitment and to bone remodeling imbalance, then to sterile osteitis, hyperostosis/osteosclerosis, synovitis and neutrophilic skin inflammation, converging on chronic relapsing osteoarticular and cutaneous disease. Every node carries biological_scale.

    Two mechanistic_hypotheses groups. The canonical autoinflammatory cytokine model, and an EMERGING Cutibacterium acnes trigger model whose causal edge is scoped with hypothesis_groups rather than asserted. The C. acnes node is deliberately framed as intracellular persistence, not infection, because the same source that proposes the NLRP3/IL-1beta route also records that overt infection is absent in many patients and that antibiotics give only transient benefit.

    No genetic section, on purpose. PSTPIP2, NOD2 and LPIN2 were tested together in a 38-patient human cohort with no association found (PMID:20032092), so listing any of them as a disease gene would assert what the cited study refutes. PSTPIP2 appears instead as the genotype of the knockout mouse in animal_models, where the human negative result is recorded as that model's limitation, alongside a second limitation: the mouse bone phenotype is osteolytic while the human signature is proliferative hyperostosis. The link is PARTIALLY_RECAPITULATES with two grounded readouts.

    Three KNOWLEDGE_GAP discussions with proposed_experiments: whether C. acnes is trigger or contaminant; whether SAPHO and paediatric CNO/CRMO are one disease or two; and why the bone and skin compartments show a reproducible, opposite cytokine dependency across IL-1, TNF and IL-17 blockade.

    Relationship to the existing Chronic_Recurrent_Multifocal_Osteomyelitis entry is curated as a contested differential, not a settled split, and the debate is recorded as a knowledge gap rather than resolved by file layout.

    Prevalence curated as two non-comparable records, with measure_type UNKNOWN on the first because two reviews carry the same 1-in-10,000 figure under different labels (frequency vs incidence).


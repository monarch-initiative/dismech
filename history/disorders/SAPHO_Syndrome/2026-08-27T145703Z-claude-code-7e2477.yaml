  summary: 'Review response: add diagnosis, definitions, epidemiology, JAK inhibition'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #9661. The review's finding was that the mechanism half of the entry was above the bar while the clinical half was missing, and that the evidence to fix it was already in the PR's own reference cache. That was correct: PMID:40004896 (200 lines of cached full text) was cited once, and PMID:38151265 (279 lines) four times, three reusing the same sentence.

    Added a definitions[] entry for the Kahn (1994, modified 2003) and Benhamou (1988) diagnostic criteria - PHENOTYPE_ALGORITHM / ESTABLISHED_CRITERIA / validation_status UNVALIDATED, with structured inclusion_criteria and exclusion_criteria. This was load-bearing for the entry's own argument: the CNO/SAPHO nosology gap turns on Kahn's criteria treating CRMO in a child as sufficient for a SAPHO diagnosis, and that claim previously lived only as an unevidenced distinguishing_features bullet.

    Added a diagnosis[] section with five entries: Diagnosis of Exclusion, MRI (proposed gold standard; radiography shows only 16% of MRI-visible lesions at early stages), Bone Scintigraphy (bull's head sign, characteristic but insensitive, graded PARTIAL), Bone Biopsy (indicated for the monostotic lesion), and Multimodal Imaging Assessment.

    Added JAK inhibition to treatments. The two tofacitinib pilot studies disagree on bone - one reports a response in 9/12 patients, the other reports no information on bone involvement - so the class is curated as unresolved on the osteoarticular compartment, with a NO_EVIDENCE item recording the silence rather than reading it as a negative.

    Added an epidemiology[] section: age at onset (third to fifth decade, previously an unevidenced bullet), sex distribution including its inversion by cutaneous phenotype, and the reported comorbidity burden. There is no comorbidities slot on Disease, so the cardiometabolic, osteoporosis and fibromyalgia data are curated here.

    Added inflammatory bowel disease as a Gastrointestinal phenotype, matching the placement used by Chronic_Recurrent_Multifocal_Osteomyelitis. It is written into the modified 2003 Kahn criteria, which makes it structural to the diagnosis rather than incidental.

    Added two differential_diagnoses: monogenic autoinflammatory bone diseases (PAPA, DIRA, DITRA, Majeed), which are the informative contrast because each has a defined gene and a clean cytokine dependency where SAPHO has neither; and spondyloarthritis, with the HLA-B27 and MRI discriminators.

    Hedged the compartment-dissociation knowledge gap with two counter-data the reviewer identified: the open-label pamidronate result on pustulosis (9/10, with the NSAID confound and the failure to reproduce both curated as REFUTE items on a new contested target_mechanisms link to the skin node), and the tofacitinib disagreement on bone.

    Also: biological_scale on Innate Immune Dysregulation changed MOLECULAR -> CELLULAR (the node's content is neutrophil hyperactivity and NK cell numbers, with a cell_types binding; only the GO term was molecular), and sulfasalazine added to conventional DMARDs.

    No research/ artifact added. The curation was done by targeted PubMed search plus full-text reference caches rather than through a deep-research provider, so a retrospective artifact would misrepresent the process. Stated in the PR reply.

    Validation: just validate-disorders passed, 94/94 snippets verified (up from 62/62); just validate-terms passed; entity refs, duplicate keys and the five offline snippet gates all clean. Two new CURIEs cached: NCIT:C17646 Bone Scan, NCIT:C51927 Biopsy of Bone.

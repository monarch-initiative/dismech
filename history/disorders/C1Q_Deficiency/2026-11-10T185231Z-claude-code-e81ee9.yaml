  summary: Map the C1QA/B/C lupus classes as narrowMatch; retire their stubs
  details: |
    Changed the three MONDO mappings for systemic lupus erythematosus related to C1QA (MONDO:1060174), C1QB (MONDO:1060228) and C1QC (MONDO:1060227) from skos:relatedMatch to skos:narrowMatch, and updated their justifications and the entry notes to match. MONDO (read via OLS) defines each class as any systemic lupus erythematosus caused by variation in that gene; every such patient has the absent or dysfunctional C1q this entry curates, so each class is the lupus presentation of a C1QD subtype and is narrower than the entry, which also covers patients with infection alone or no symptoms. The earlier justification gave that same fact as the reason neither class subsumed the other, but it describes the entry being broader, not the two being incomparable. The three stubs were deleted as SUBTYPE outcomes; with narrowMatch the classes count as covered and will not be re-nominated. The ClinGen Definitive assertion for C1QA and MONDO:1060174 was not copied onto this entry, because gene-disease validity is recorded only for an entry's own disease term, a subtype term or an exactMatch mapping. Validation: just validate, validate-terms, check-shared-disease-terms, check-stubs, check-duplicate-keys and check-block-scalar-comments passed.

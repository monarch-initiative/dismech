  summary: 'Create: C1Q_Deficiency'
  details: |
    Created the C1Q deficiency entry (MONDO:0013343) with the three gene-defined MONDO subtypes (C1Q deficiency 1/2/3; C1QA, C1QB, C1QC) as has_subtypes rows, replacing the three queue stubs. Pathograph: absent or dysfunctional C1q leads to classical pathway initiation failure (impaired defence against encapsulated bacteria; defective apoptotic cell clearance leading to loss of tolerance) and, independently, to loss of C1q restraint on immune complex-induced interferon-alpha and a type I interferon signature; phenotypes are wired to these nodes. Treatments: allogeneic HSCT, fresh frozen plasma, anifrolumab, JAK inhibitors, conventional immunosuppression, vaccination. MONDO's gene-specific SLE classes (MONDO:1060174, MONDO:1060228, MONDO:1060227) are recorded as relatedMatch mappings only. One OpenScientist deep-research report was generated and used as leads; every snippet was checked against PubMed abstracts fetched into references_cache. Validated with just validate, validate-terms, count-verified-snippets and validate-disorders.

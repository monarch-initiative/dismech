  summary: 'Review round 1: FOXP2-Related_Speech_and_Language_Disorder'
  details: |
    Addressed review on PR 15955. Added a Gross Motor Impairment phenotype (HP:0002194, FREQUENT, 13/26 in PMID:36328423) with the cohort's own note that it was thought uncommon and a REFUTE item quoting GeneReviews that gross motor skills are normal. Filled frequencies from the PMID:36328423 full text: orofacial dyspraxia VERY_FREQUENT (13/14), dysarthria OCCASIONAL (2/24, far less common than CAS; description now contrasts this with FOXP1 syndrome's dysarthria-dominant profile), autistic features FREQUENT (7/27, contrasted with 2/46 in prior literature). Renamed the HP:0001256 node to Mildly Impaired Nonverbal Cognition to match the sources; no causal targets referenced the old name. Optional items: bound Mental Health Support to NCIT:C15308 Psychotherapy (validates in the TreatmentActionTerm enum); added PMID:27933109 as a caveat that rare FOXP2 missense variants need functional support; added the early drooling figure (5/21) to the feeding phenotype. Not taken: splitting the PMID:12876151 item, because its abstract reports human and mouse expression in the same sentences, so no quote isolates one source; the phonological-disorder figure. Validation: validate, validate-terms, count-verified-snippets (102/102), the offline gates including check-causal-targets and check-gene-activity-grounding, and validate-disorders all passed.

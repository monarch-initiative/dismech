  summary: 'Create: FOXP2-Related_Speech_and_Language_Disorder'
  details: |
    New entry for MONDO:0011184 (childhood apraxia of speech), scoped to FOXP2-caused disease because MONDO defines the term through its FOXP2 causal-gene assertion while clinical CAS is genetically heterogeneous; other genetic CAS (SETBP1, FOXP1, 16p11.2 deletion, other monogenic causes) and primary progressive apraxia of speech are differential diagnoses. File named FOXP2-Related_Speech_and_Language_Disorder after the GeneReviews chapter (PMID:27336128, tagged GeneReviews; its abstract is the phenotype baseline) and the <GENE>-Related naming convention; FOXP1_Syndrome already cites the disorder by that name. Deep research: one claude_code report (research/FOXP2-Related_Speech_and_Language_Disorder-deep-research-claude_code.md; 39/39 references resolved, one ellipsis quote flagged, no unresolved CURIEs), used as leads alongside direct PubMed E-utilities searches; every PMID was fetched with just fetch-reference and every CURIE looked up in OLS or the term caches. From the report: added Reuter 2017 (PMID:27572252), the 7q31 deletion series (PMID:40714749), Hurst 1990 (PMID:2332125), and recorded that PMID:23033221 (no abstract, so not quotable) reports FOXP2 is not imprinted, which qualifies the maternal-UPD7 underexpression claim. Pathograph: paternal-allele loss -> FOXP2 haploinsufficiency -> target-gene dysregulation, corticostriatal/olivocerebellar circuit development, striatal/cerebellar plasticity (mouse) -> motor sequence learning -> speech motor programming deficit -> apraxia of speech, orofacial dyspraxia, language and literacy impairment. Animal models: two Foxp2 R552H knock-in lines (one with a refuting USV study) and zebra finch Area X FoxP2 knockdown. ClinGen's Definitive FOXP2 assertion is for the parent term MONDO:0016226 and is noted, not recorded as a validity tier. Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), the offline gate set, and validate-disorders all passed.

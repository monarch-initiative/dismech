  summary: 'Create: A20 Haploinsufficiency MONDO:0100222'
  details: |
    Created from PubMed literature with a five-iteration OpenScientist deep-research job as a cross-check, launched before writing so it ran in parallel.

    The entry is organised around a differential diagnosis rather than a mechanism, because that is where the clinical harm is. Roughly half of all reported cases had been diagnosed and treated as Behcet disease before the genetic cause was found. A direct comparison of 54 patients against 520 Japanese Behcet patients gives the discriminators: early onset, familial occurrence, recurrent fever attacks, gastrointestinal involvement, and infrequent ocular involvement. The last is a negative discriminator, since ocular involvement is characteristic of Behcet disease, and its absence is part of what separates them. None of these is a laboratory finding, so the diagnosis section is written around that comparison rather than around a test.

    The mechanism is loss of a brake rather than gain of a signal. A20 terminates canonical NF-kappa-B signalling through its deubiquitinase activity, so halving it de-restrains a pathway that many stimuli use. That is the most plausible account of the phenotype's unusual breadth for a monogenic disease, spanning mucosa, skin, gut, joints and liver with autoinflammatory and autoimmune features in the same patient.

    Haploinsufficiency is supported from two directions and both are now recorded. The observational argument is that a nonsense variant and a 236 kb whole-gene deletion produce the same disease, and a deletion cannot act as a dominant negative. The experimental argument is stronger: the 2016 description tested truncated A20 proteins for a dominant-negative effect in overexpression and did not find one.

    A gap in the draft, corrected before submission and recorded in notes. The first version did not cite the paper that described the disease. The 2016 report in six unrelated families is the source for the dominant-negative exclusion experiment, for the identification of deubiquitinase activity as the operative function, and for the measurements in patient cells showing increased IkappaB-alpha degradation, p65 nuclear translocation and raised cytokine expression. It was reachable from the searches I ran, so its absence was a gap in my reading rather than in the literature. The deep-research job surfaced it.

    The inflammasome arm is graded HYPOTHETICAL and should stay that way. It rests on a myeloid-specific complete knockout in mice producing an erosive arthritis independent of TNF receptor 1, which is a different genetic situation from heterozygous loss in humans, and the human arthritis in this disease is usually nonerosive. That mismatch is stated in the evidence explanation rather than left to be noticed.

    Treatment is recorded with its limits. Anti-TNF is the most effective single class at 59.5 percent efficacy among the 44.4 percent of patients given molecular targeted drugs, which means roughly forty percent of treated patients did not respond and eleven failed their initial agent. The same national survey states there are no established treatment guidelines, and that statement is carried as REFUTE evidence against reading the efficacy figure as a standard of care.

    Two checks were improved during this entry. The value-versus-prose check produced a false positive on the phrase "checked against it directly", the second such false positive from the word "against" used non-argumentatively; the prose was reworded, and a check that cries wolf is one people stop reading. More substantially, the truncation check was rewritten. The old version flagged any snippet not ending in terminal punctuation, which over-triggers on legitimate quotes of numbered sub-clauses from enumerated lists - eight false positives in this entry alone. The new version locates the snippet in the cached source and flags it only when the following character is a letter, which is an actual mid-word cut. It was verified against a synthetic case, firing on the truncated form and passing the complete one, and it found three genuine truncations here that the old heuristic had buried among the false positives.

    Validation: 38/38 snippets verified, term validation passes, qualifier terms pass, weighted compliance 100.0 percent, no mid-word truncations, no value/prose contradictions, one root, no orphan phenotypes, no dangling targets. Content_type was checked on all caches before writing.

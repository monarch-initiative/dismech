  summary: 'Review round 1: mine the three unread GeneReviews sections, correct a
    false notes claim, tag, narrow GO terms, fix evidence grading, add onset'
  details: |
    Response to review round 1 on PR #11525. All six items, none of which required fetching anything new.

    The sharpest finding is that a claim in notes was false, and the file contradicting it was added by the same commit. The section stated that IL-1, IL-6 and JAK-directed therapy and haematopoietic cell transplantation had no quotable outcome data in the cached references. The GeneReviews chapter says verbatim that IL-1 targeted therapy and JAK inhibitors are effective in many individuals and that transplantation may be considered in severe or refractory disease. Both are now modelled as treatments.

    The root cause is more useful than the individual error. The GeneReviews chapter has four sections and I mined one of them. Clinical Characteristics was read thoroughly, and every frequency band in the entry came from it. Diagnosis, Management and Genetic Counseling were not read at all, and between them they supplied the diagnostic yield split of roughly 95 percent sequence variants against under 5 percent 6q23 deletions, the treatment options above, and the 50 percent transmission risk with de novo occurrence. The de novo point matters specifically because familial occurrence is one of this entry's discriminators against Behcet disease and a de novo case will not show it.

    This is the fourth instance in this series of asserting that something was unavailable when it was present in a committed cache file. The previous three concerned full-text papers mined only at abstract level. This one is different in kind and worth distinguishing: the file was an abstract-only cache, but the abstract itself is sectioned, and I stopped at the first section. Checking content_type does not catch this. The check that would is reading a structured abstract to its end.

    Other items. The GeneReviews reference now carries tags GeneReviews, matching the convention used by other entries. Two GO bindings were narrowed from regulation to negative regulation, since the claim is specifically that a negative regulator is lost. An evidence item quoting a case-report sentence was regraded from IN_VITRO to HUMAN_CLINICAL, and the genuinely in-vitro sentence from the same paper was split into its own item so the grading matches the sentence rather than the publication. Structured onset was added to the two phenotypes that carry the Behcet discrimination argument, since early onset is the entry's central discriminator and had appeared only in prose.

    The reviewer also confirmed independently that the deep-research report's NCIT identifiers are wrong, with NCIT:C2707 resolving to DHEA Mustard rather than an IL-1 antagonist and NCIT:C142883 not resolving at all. None were used here, because identifiers in this entry are resolved against the local ontology databases rather than copied from the report.

    Validation: 45/45 snippets verified, term validation passes, qualifier terms pass, weighted compliance 100.0 percent, no mid-word truncations, no value/prose contradictions, one root, no orphan phenotypes, no dangling targets.

  summary: 'Create: Isoniazid Toxicity'
  details: |
    New entry for isoniazid toxicity (MONDO:0027677), curated as one drug producing
    two mechanistically opposite kinds of harm. The hepatic arm is what the liver
    does to isoniazid: bioactivation to a reactive metabolite, gated by NAT2
    acetylator genotype. The two neurological arms are what isoniazid does to
    vitamin B6: a functional pyridoxine deficiency that starves any enzyme needing
    pyridoxal 5-phosphate. Slow, over months, that is a peripheral neuropathy - the
    nerve is deprived rather than poisoned. Fast, in overdose, GABA synthesis fails
    and the seizures resist ordinary anticonvulsants. One vitamin treats both, which
    is why the entry routes both arms through a single deficiency node.

    Pathograph: 10 nodes, fully connected apart from the NAT2 modifier, which is an
    intentional entry point. 8 conforms_to across three modules:
    drug_induced_liver_injury (4), peripheral_axonal_degeneration (2),
    epilepsy_excitation_inhibition_imbalance (2).

    Two competing hepatic models curated as mechanistic_hypotheses rather than
    picking one. PMID:26773235 reports that the textbook account - acetylhydrazine
    bioactivation as a metabolic idiosyncrasy with no immune involvement - has been
    superseded by direct bioactivation of isoniazid itself with an immune response
    and two phenotypes. Recorded as acetylhydrazine_metabolic_idiosyncrasy
    (DEPRECATED) and direct_bioactivation_immune (CANONICAL). The deprecated model is
    kept rather than deleted so a curator meeting it in a secondary source can learn
    from this entry that it has moved. The shared hepatocyte-injury edge opts into
    both groups; the immune edge opts into the current one only.

    One conformance deliberately withheld. The epilepsy module ends at "Recurrent
    Unprovoked Seizures". Isoniazid seizures are provoked by definition and stop when
    the drug clears and the cofactor is replaced, so this entry conforms at
    Excitation-Inhibition Imbalance and Seizure Generation and stops there.
    Conforming to the outcome node would turn a poisoning into an epilepsy. The entry
    also does not conform to peripheral_axonal_degeneration#Distal Axonal
    Degeneration and Demyelination: isoniazid neuropathy is conventionally described
    as a distal axonopathy, but the cited sources report no fibre pathology, and the
    one case they describe had normal nerve conduction velocity.

    Three mechanisms that appear in every standard account were initially NOT
    asserted, because no cached source stated them: covalent reaction between
    isoniazid and pyridoxal, pyridoxal kinase inhibition, and glutamate
    decarboxylase as the specific failing enzyme. Two of the three were then
    closed with primary evidence (see the deep-research note below). Glutamate
    decarboxylase remains unasserted, and so does the attribution of the overdose
    acidosis to seizure-generated lactate; both are flagged in notes with what a
    fixing source would look like.

    Evidence: 61 items over 12 references, all pre-verified before writing. Anchors
    are the mechanism review (PMID:26773235), a 2025 NAT2 meta-analysis of 48 studies
    and 11,035 patients giving pooled OR 3.02 (95% CI 2.50-3.64) for slow acetylators
    (PMID:41657030), the ATS statement on antituberculosis hepatotoxicity
    (PMID:17021358), two overdose case series (PMID:17535059, PMID:8522667), a
    pyridoxine toxicology review (PMID:15756083), a paediatric neuropathy case report
    (PMID:29897291), and a 2026 INH/RIF hepatotoxicity review (PMID:41793109).

    No frequency band is asserted on any phenotype. PMID:10842541 was fetched and
    then not cited: the cached record is 854 bytes of metadata with no abstract, so
    there is nothing in it to quote.

    Tooling finding, recorded because it changes how the rest of this work should be
    done. A quote containing "[vitamin B6]" passed the scratchpad pre-verifier and
    failed `just validate`. The scratchpad tool wrapped
    scripts/check_snippets_verbatim.py, which does no bracket stripping;
    src/dismech/reference_snippet_audit.py reads literal_bracket_patterns from
    conf/reference_validator_config.yaml, the same config the gate uses, and
    "vitamin B6" matches neither the all-caps nor the percent pattern. The quote was
    replaced rather than adding a bracket pattern, since a pattern change affects
    every cached reference in the repository. The pre-verifier was then rebuilt
    against the audit module and confirmed to reproduce the failure.

    Validation: just validate-disorders (the batched sweep CI runs) passed; 61/61
    snippets verified; check-folded-hyphens, check-duplicate-keys,
    check-title-snippets, check-entity-refs and check-environmental-evidence all
    clean; 18 structural tests pass; all 8 conformance anchors resolve. NAT2
    (hgnc:7646) was resolved from the ontology. All reference_title values were
    generated programmatically from the cache files, never typed.

    Deep research: just research-disorder claude_code produced an 85 KB report, 28
    PMIDs. NEC preflight returned SKIP (MONDO records no causal gene for a drug
    toxicity) and was cleared manually - NAT2 dominates the report's gene mentions
    at 51, ahead of CYP2E1, HLA-B and CYP3A4, which is the correct profile for
    isoniazid hepatotoxicity.

    The report asserted all three of the mechanisms this entry had withheld, and
    cited none of them: its chain gives ontology identifiers for pyridoxal kinase,
    the hydrazone step and glutamate decarboxylase, plus a StatPearls quotation
    that is not a verifiable citation. So the report could not close the gap, and
    the withholding was correct. It did make the gap worth chasing, and a targeted
    PubMed search then found PMID:9354586, an in vitro kinetic study of drug
    effects on erythrocyte pyridoxal kinase.

    That source is better than the account the report gave. It places isoniazid
    among the drugs that inhibit pyridoxal kinase AND reports that the inhibition
    follows from covalent complexes the drug forms with pyridoxal and pyridoxal
    5-phosphate. The report described covalent trapping and kinase inhibition as
    two parallel mechanisms ("Two mechanisms, one deficit"); the kinetic work
    reports them as sequential. The entry curates the sequential order, with the
    authors' own hedge ("kinetic studies suggested") preserved, and records that
    the work is in vitro on non-purified enzyme with isoniazid as one of several
    drugs examined.

    Glutamate decarboxylase was deliberately left unasserted even though the
    report names it, because no cached source states it and the targeted search
    did not produce one.

    Review round 1 (ai4c-reviewer, CHANGES_REQUESTED) raised six items. All six
    addressed.

    1. The overdose node bundled seizures and metabolic acidosis, and its own
       description said they were sequential. Split into Isoniazid Overdose
       Seizures and Lactic Acidosis, with the epilepsy conformance kept on the
       seizure node. Renaming the node orphaned an inbound edge from Impaired GABA
       Synthesis; `just validate` does not catch a dangling bare-name target, and
       a graph check did.
    2. The most important item. The disease description asserted that isoniazid
       "stops glutamate decarboxylase from making GABA", and the overdose node
       attributed the acidosis to seizure-generated lactate - while the notes on
       both nodes correctly said neither claim was supported. The entry made and
       disowned the same two claims, with the assertions rendering at the top of
       the page and the disclaimers buried. Both assertions removed; the notes
       recording the absences remain.
    3. Genetics extended. CYP2E1, GSTM1 and GSTT1 at no fetch cost from the
       already-cached PMID:41793109. HLA-B added for HLA-B*52:01 (PMID:33135175),
       which is the host-genotype evidence the CANONICAL immune hypothesis
       otherwise lacked. The same GWAS corrected the entry's NAT2 story: NAT2*5 is
       LESS frequent in cases while NAT2*6/*7 homozygotes are enriched, so the
       pooled slow-acetylator odds ratio should not be read as uniform across slow
       alleles. Both statements are curated, including that the *6/*7 interval
       crosses 1.
    4. NAT2 genotype-guided dosing added as a treatment (PMID:23150149, 172
       patients, randomised): 78 percent of slow acetylators developed liver
       injury on standard dosing and none did under genotype-guided dosing. Wired
       to the NAT2 modifier node with treatment_effect MODULATES, since dosing
       changes exposure rather than genotype. The small strata and single-country
       population are recorded.
    5. Nausea, ataxia and jaundice added from sentences the entry already quoted.
    6. All ten phenotypes wired into the pathograph, the same structural gap the
       reviewer raised on the sibling cisplatin entry.

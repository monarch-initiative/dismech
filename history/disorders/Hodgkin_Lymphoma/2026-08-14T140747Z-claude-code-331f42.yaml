  summary: Address ai4c-reviewer CHANGES_REQUESTED on the NLPHL arm
  details: |
    Addressed the three blocking ai4c-reviewer findings on the NLPHL arm of PR #8462.
    (1) Orphan NLPHL node: added a downstream edge from "Neoplastic Lymphocyte-Predominant
    (LP) Cell Origin (NLPHL)" to "Cytokine and Chemokine-Mediated Microenvironment
    Remodeling", giving the pathograph a single connected component; evidenced by the
    already-cached DOI:10.1200/jco.2010.32.8401 (Steidl 2011) "The malignant HRS and LP
    cells manipulate the microenvironment...". (2) Claim-evidence mismatch on LP-cell
    biology: the germinal-center-derivation and CD20+/functional-B-cell-program claims
    (subtype description + LP-cell pathophysiology node) were previously leaning on the
    PMID:34208705 "Both diagnoses..." snippet, which supports neither and whose "both
    diagnoses" means NLPHL vs DLBCL. Fetched and cited two real NLPHL-biology references
    with exact-quote snippets: PMID:9256483 (Braeuninger 1997, single-cell micromanipulation)
    for germinal-center B-cell origin, and PMID:40517549 (Borchmann/Eichenauer/Campo 2025
    review) for the retained complete mature B-cell program (CD20+, CD30-). Corrected the
    34208705 evidence-item explanation to accurately describe the shared NLPHL/THRLBCL
    features it actually supports. (3) Progression claim: added the exact cached PMID:34208705
    sentence on progression to T-cell/histiocyte-rich large B-cell lymphoma or DLBCL.
    Non-blocking additions: added a prevalence block (US annual incidence AAIR 2.3 per
    100,000, PMID:30978153, consistent with SEER ~2.5/100,000); added a clinical_trials
    entry for NCT02181738 (CheckMate 205, Phase II nivolumab in cHL, already inline-cited);
    and fixed the older history record (2026-08-14T063013Z) to link issue #8456 under
    links.issues rather than links.prs (confirmed #8456 is the curation issue).

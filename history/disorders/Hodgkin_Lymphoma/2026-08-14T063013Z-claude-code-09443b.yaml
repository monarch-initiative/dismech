  details: |
    De-novo root Hodgkin lymphoma entry MONDO:0004952 per issue 8456, CURATE_ROOT_WITH_SUBTYPES. Models two disease classes via has_subtypes: Classic HL MONDO:0009348 approx 95 percent, cross-referenced to existing kb/disorders/Classic_Hodgkin_Lymphoma.yaml, and NLPHL MONDO:0044778 approx 5 percent, previously uncurated. Pathophysiology: germinal-center-B-cell-derived HRS cells vs LP cells in a reactive inflammatory microenvironment; NF-kB and JAK-STAT signaling; EBV LMP1 in the EBV-positive CHL subset; near-universal 9p24.1/PD-L1 immune evasion. conforms_to viral_oncogenesis, tumor_promoting_inflammation, immune_checkpoint_blockade on CHL-specific nodes. Evidence reused from already-cached on-topic references PMIDs 34075767 34208705 27221964 29799516 31816062 32433447 31894937 29340061 26839195 39039881, plus NCIT:C411 and NCT02181738. ENVIRONMENTAL LIMITATION: no outbound access to NCBI eutils or EBI OLS in this session policy 403, so falcon deep research and new PubMed fetches were impossible; the existing asta CHL research report was used as a lead source. Offline validation: just validate-schema PASS no issues; just count-verified-snippets 29/29 verified against cached references; just compliance 87.0 percent. just validate-terms could not resolve MONDO:0004952 0009348 0044778 enum membership because OLS was unreachable; labels are cached and correct and these are real MONDO terms that validate in CI which has OLS access. No cache files were hand-edited per policy.

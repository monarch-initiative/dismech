  summary: 'Create: Autosomal_Dominant_Mendelian_Susceptibility_To_Mycobacterial_Diseases_Due_To_Partial_IFNgammaR1_Deficiency'
  details: |
    De novo curation of AD partial IFN-gammaR1 deficiency (IMD27B, MONDO:0014429). 5-node dominant-negative causal chain: heterozygous exon-6 IFNGR1 truncating mutation (818del4 hotspot) -> cell-surface accumulation of truncated receptor -> dominant-negative impairment of IFN-gamma/STAT1 signalling -> insufficient macrophage activation -> impaired control of intramacrophagic mycobacteria, wired to 8 infectious/lab phenotypes plus 2 laboratory readouts. Evidence from primary literature fetched via just fetch-reference (PMID:10192386,15589309,17513528,11865431,38025345,26054576,23053508,35074548,42702282,16028145,18972195,19084105,23036270,32676075); 36/36 snippets verified exact against references_cache. Perplexity sonar-deep-research report used as a lead only, run via a session-local streaming transport patch (dismech#9357) because the non-streaming request dies at the 300 s idle deadline; DR-only web/aggregator citations (Orphanet, OMIM, Abcam, MedGen, BJBMS) were not used as evidence. AR complete (MONDO:0020530) and AR partial (MONDO:0017901) IFNGR1 forms kept separate, cited only as differential diagnoses. Validated: just validate, validate-terms, count-verified-snippets, check-causal-targets, check-entity-refs, check-duplicate-keys all clean. On review before commit: removed an unsourced rationale for HSCT being ineffective (the cited sources say only that HSCT is for abolished IFN-gamma responses) and an unsourced tuberculosis severity comparison; stated onset as the sourced mean (13.4 vs 3.1 years); gave one PMID:17513528 background sentence a single evidence_source (HUMAN_CLINICAL, quote_role BACKGROUND) where it had been graded two ways; lengthened a 4-word snippet to its full clause.

  summary: Review dominant partial IFNGR1 deficiency using cached full text
  details: |
    Reviewed all fourteen previously cited PMIDs, the matching 2026-09-30 Perplexity deep-research report and citation list, and full texts for PMID:17513528, PMID:32676075, PMID:25453225 and newly fetched PMID:36193331. The 2016 Ile183Val report (DOI:10.17305/bjbms.2016.1232) was fetched as full PDF and read: its splicing and receptor effects remain predicted, with no biochemical confirmation, so it is not included as an established allele. Full text for the Dorman comparative cohort was attempted through its DOI but unavailable; cached PMID:15589309 supports the corrected first-environmental-mycobacterial-episode onset and denominators. Corrected incomplete penetrance, historic case totals, assay evidence grading, variant-class distinctions, treatment claims and differential onset. Added receptor-stability and patient-cell models, transient infection-associated DC depletion with normal in-vitro maturation, rare Salmonella and Coccidioides manifestations, and severe refractory MAC treatment with QT toxicity and planned but unperformed transplantation. Deep-research audit: phenotype coverage adequate after additions; subtypes N/A because distinct recessive allelic disorders remain differentials; mechanisms adequate after stability and assay additions; treatment coverage adequate with no verified interventional trial identified in the report; genetics adequate after variant classes and penetrance; diagnostics adequate; central references consumed; overall report was under-consumed and is now reconciled. Excluded speculative chromatin, metabolic and osteoclast claims, IFNGR2 glycosylation rescue, unconfirmed Ile183Val causality, unsupported HSCT prohibition and population-frequency inference. Preflight WARN resolved by manually matching MONDO:0014429, IFNGR1/hgnc:5439, OMIM:615978 and synonyms; STAT1 mentions represent downstream signaling, not a rival causal assignment. Bookshelf snapshot reports no GeneReviews chapter. Scope remains inherited immune deficiency, not infectious disease itself. OLS term searches verified HP:0020178, HP:0032249, HP:5210093, NCIT:C15469 and NCIT:C15431. Disease-specific literature has priority over generic MSMD claims.

  summary: 'Gene-family review: PEX16'
  details: |
    PEX16 landed on 'Hypomorphic PEX16 Variants with Residual Peroxin Function', which named no molecular function. The node now binds protein-membrane adaptor activity (GO:0043495, DECREASED): PEX16 is the peroxisomal membrane receptor that docks PEX3-PEX19 complexes (PMID:19114594), the step in membrane-protein insertion that its residual-function alleles reduce. The genetic record was already typed CAUSATIVE with germline origin; ClinGen's PEX16 assertion is for the parent MONDO:0019234, so no tier was copied here.

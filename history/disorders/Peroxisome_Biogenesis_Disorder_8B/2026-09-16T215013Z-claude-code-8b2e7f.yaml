  summary: 'Create: Peroxisome Biogenesis Disorder 8B (MONDO:0013943, PEX16)'
  details: >-
    Claim issue #11974. Resolved as DISEASE and curated standalone, following the
    PBD1B/2B/4B precedent: the A/B split inside a PEX complementation group is a
    mechanistic claim about residual peroxin function rather than a severity
    label. Three repository facts supported that rather than a preference -
    Peroxisome_Biogenesis_Disorder.yaml carries no has_subtypes block, MONDO's
    parent for MONDO:0013943 is the uncurated gene-level term MONDO:0100269, and
    PBD8B has its own primary literature across four reports.


    GENE RESOLUTION. The stub records no causal gene. PEX16 was read off the MONDO
    parent chain (MONDO:0100269, "peroxisome biogenesis disorder due to PEX16
    defect") and independently confirmed two ways: NCBI mim2gene_medgen maps
    OMIM:614877 to GeneID 9409 with a GeneMap source, and the HGNC REST API
    returns HGNC:8857 PEX16 "peroxisomal biogenesis factor 16", 11p11.2, gene OMIM
    603360. kb/ was then re-searched for PEX16 rather than for the disease label;
    the only hit is a genetic: row on Peroxisome_Biogenesis_Disorder.yaml citing
    the same ClinGen assertion, which curates no PEX16 mechanism, so nothing was
    covering this entity under another name.


    CONTENT. Six pathophysiology nodes from hypomorphic PEX16 alleles with
    residual protein, through partially preserved ER-derived membrane assembly and
    a peroxisome population that is fewer-but-enlarged and import-competent, to an
    attenuated metabolic block and progressive central white-matter and long-tract
    degeneration. Nine phenotypes, all wired: no orphan phenotype and no
    unresolved bare-name target (checked by diffing every downstream[].target,
    sequelae[].target and target_mechanisms[].target against node and phenotype
    names). One PEX16 genetic row, three biochemical markers, two diagnosis
    entries, three treatments including the levodopa/carbidopa dystonia trial, one
    clinical_trials row for the natural-history study the case series ran under, a
    CASES_IN_LITERATURE prevalence, three differentials, and two knowledge-gap
    discussions with four proposed experiments.


    EVIDENCE DISCIPLINE. 62/62 snippets verified against cached references, 0
    skipped by prefix (no DOI citations). Two snippets were requoted to avoid
    bracketed spans the reference validator strips, rather than widening
    literal_bracket_patterns. Two evidence items carry supports: REFUTE - a
    genetically confirmed PEX16 patient with normal plasma VLCFA, and the same
    patient's normal nerve conduction studies - because both are real negative
    results that keep the VLCFA marker and the peripheral neuropathy phenotype
    correctly variable rather than expected. Two items carry quote_role:
    BACKGROUND where the quoted sentence restates prior work. Every item citing
    PBD8A material (PMID:9837814, PMID:9922452, PMID:12223482, PMID:28146471) is
    marked directness: INDIRECT, because those establish the severe pole or the
    cell biology of the peroxin rather than this entity. No phenotype carries a
    frequency band; the reason is recorded in the entry notes, and per-feature
    numerators from the seven-patient case series are recorded in phenotype notes
    instead.


    ONTOLOGY TERMS. Every CURIE was resolved through OLS at the time of writing
    and its canonical label copied from the lookup: HP:0007020, HP:0001251,
    HP:0002415, HP:0002059, HP:0001332, HP:0001337, HP:0001260, HP:0000518,
    HP:0009830, HP:0000007, GO:0016557, GO:0045046, GO:0007031, GO:0005777,
    GO:0004096, GO:0042744, GO:0042760, GO:0008611, CL:0000128, UBERON:0002316,
    CHEBI:27283, CHEBI:15765 (L-dopa), CHEBI:3395, NCIT:C61062, NCIT:C15986,
    NCIT:C15747, NCIT:C15240, NCIT:C19770, NCIT:C25294, hgnc:8857. A catalase
    binding was first written as a GO molecular function on the Biochemical class,
    which has no such slot; it was moved to biomarker_term with NCIT:C61062. A
    free-text zygosity string was removed from genetic_context rather than forced
    into the enum, because reported genotypes are both homozygous and compound
    heterozygous.


    DEEP RESEARCH. One falcon run, committed. preflight-dr returned SKIP (MONDO
    records no causal gene for this term, so the gene check cannot discriminate);
    the manual fallback is decisive - PEX16 101 mentions, zero for any other PEX
    gene, OMIM 614877 matching MONDO's xref. Nothing was bound from the report;
    its own term validator flagged one invented identifier, one obsolete term and
    two mislabelled ones, all recorded in the entry notes. Its leads that this
    entry does not curate are listed there too. The nine DOI_*.md cache files the
    report's reference validator wrote are not committed, because this entry cites
    none of them. A cosmetic frontmatter rewrite of the tracked
    references_cache/clinicaltrials_NCT01668186.md was reverted.


    VALIDATION. just validate, validate-terms, validate-disorders (batched),
    count-verified-snippets, check-entity-refs, check-duplicate-keys,
    check-causal-targets, check-qualifier-terms, check-enum-values,
    check-folded-hyphens, check-title-snippets, check-snippet-length,
    check-snippet-grading, check-environmental-evidence, check-stubs,

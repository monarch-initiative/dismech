  summary: Add the Mendelian familial temporal lobe epilepsy genes and subtypes
  details: |
    Filled the empty genetic: section and added MONDO-bound has_subtypes rows for the four gene-defined familial temporal lobe epilepsy classes: ETL1 (LGI1, MONDO:0700090), ETL5 (CPA6, MONDO:0013741), ETL7 (RELN, MONDO:0014639) and ETL8 (GAL, MONDO:0014650). ETL1 and ETL7 are pointer rows carrying curated_in Autosomal_Dominant_Epilepsy_with_Auditory_Features, which already curates the LGI1, RELN and MICAL1 mechanism chains; their genetic records say so and are reported as GENETIC_UNWIRED by just subtype-usage-audit for that reason. CPA6 and GAL are new to this entry and are wired into the pathograph through two new pathophysiology nodes, Reduced Extracellular Carboxypeptidase A6 Activity (downstream to Seizures) and Impaired Galanin Neuropeptide Signaling (downstream to Excitation-Inhibition Imbalance). Both downstream edges are INDIRECT_UNKNOWN_INTERMEDIATES and their evidence is graded INDIRECT, because the human route from enzyme or neuropeptide loss to seizures is not traced in the cited work. The four linkage-only classes ETL2, ETL3, ETL4 and ETL6 and the ILAE familial mesial temporal lobe epilepsy class are left unbound, with the reason recorded in review_notes. Evidence: PMID:21922598, PMID:23105115 and PMID:25691535 newly cached, plus the already-cached GeneReviews chapter PMID:20301709, now tagged in a new references block. Validated with just validate-disorders (52 snippets, 55 titles, 0 issues), just validate-terms, and the offline kb gates.

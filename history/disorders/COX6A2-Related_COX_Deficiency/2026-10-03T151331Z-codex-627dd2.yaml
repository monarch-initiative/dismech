  summary: Review COX6A2 clinical and experimental evidence beyond muscle-restricted
    disease
  details: |
    Read the existing entry and matching research report, founding abstract and ClinGen case/functional evidence, complete available neuronal, cardiomyocyte and metabolic mouse texts, and relevant full-text mitochondrial care guidance. Correct muscle-only expression and universal ATP-failure claims; separate atomic mechanisms and model contexts, add reported clinical findings, ClinGen moderate validity, preclinical interventions, cell/mouse models and verified datasets. The 2020 cognitive follow-up concerns the surviving original proband, not a third case; IQ remains preserved. The original report misstates OMIM and overlooks later experiments; primary sources and MONDO resolve these without importing the mistakes. Founder full text was not accessible, so extra founder details are attributed to the public ClinGen report. GeneReviews and StatPearls checks find no matching chapter. No reliable frequencies, penetrance or clinical drug efficacy can be derived from this small literature.

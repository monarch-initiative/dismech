  summary: 'Integrate assessed OpenScientist findings: causal-proof evidence, two
    non-synaptic effector arms, three knowledge gaps'
  details: |
    Reviewed kb/hypotheses/Fragile_X_Syndrome/canonical_fmr1_silencing_fmrp_loss_synaptic_dysregulation_model/openscientist.md (no prior assessment) and wrote assessments/openscientist-assessment-by-claude-opus-5.yaml: verdict PARTIALLY_SUPPORTED, 16 claims (10 RETAINED, 5 QUALIFIED, 1 REJECTED), plus data_sources for PubMed, TCGA, UK Biobank, ClinGen and GenCC, and three REPORTED_ONLY analyses (the 110-paper screen and the four embedded figures have no committed artifact bundle).

    Integrated from RETAINED and QUALIFIED claims only, with every snippet re-derived from references_cache rather than copied out of the report:
    - pathophysiology "FMR1 full-mutation transcriptional silencing": added PMID:29456084 (dCas9-Tet1 demethylation reactivates FMR1 and rescues patient-neuron electrophysiology), the causal proof the entry lacked.
    - pathophysiology "FMRP loss of translational repression": added PMID:21784246 (reversible ribosome stalling on FMRP targets) and PMID:35379866 (FMRP level correlates with IQ in both sexes with the full mutation); added two downstream edges into the new non-synaptic nodes.
    - pathophysiology "Dendritic spine and synapse maturation abnormality": added an age-dependence qualification to the description plus two PMID:41982083 evidence items (spine density normalizes by adulthood; dendritic complexity declines progressively).
    - pathophysiology "Neuronal hyperexcitability": added PMID:31880363 (restoring above 5% of FMRP, or above 20% of neurons expressing it, normalizes the hyperactive phenotype).
    - New node "Astrocytic GABA transport dysregulation" (CL:0000127, GO:0015812 DYSREGULATED) with three PMID:41443375 evidence items and edges to Neuronal hyperexcitability and Neurodevelopmental circuit dysfunction.
    - New node "Excess translation of chromatin regulators" (GO:0006412 INCREASED, GO:0006338 DYSREGULATED) with two PMID:28823556 evidence items and an edge to Neurodevelopmental circuit dysfunction.
    - New discussions: fxs_mglur5_translation_window (KNOWLEDGE_GAP, PMID:30451888 and PMID:30653533), fxs_nonsynaptic_effector_arms (KNOWLEDGE_GAP, PMID:32966779 and PMID:41557506), and fxs_mglur_ltd_age_and_condition_dependence (HUMAN_MODEL_MISMATCH, PMID:27656021). Each carries one proposed experiment.

    Deliberately not changed. Hypothesis status stays CANONICAL, which the report itself recommends, and its hub-and-spoke notes were already current. The nuclear genome-instability and glutaminase metabolic arms were not made pathophysiology nodes: both are measured only in patient-derived cells with no established link to a neural or clinical phenotype, so they are recorded as an open question instead. The TrkB-agonist claim (PMID:31494285) was left out because the report's head-to-head superiority framing overreads a single unelaborated abstract sentence. The report's claim that FMRP-positive brain regions specifically lack spine pathology (PMID:10331599) was not curated: the source reports no spine pathology in any region examined, including the FMRP-negative parietal lobe, in an N=1 case. The report's Knowledge Gap 8 assertion that no ClinGen or GenCC gene-disease validity assessment exists is false and was rejected, because ClinGen classifies FMR1 against fragile X syndrome as Definitive and that assertion is already cached in this repository as a CGGV reference.

    Verified with count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, and validate-hypothesis-assessment.

  summary: Re-apply outstanding OpenScientist findings
  details: |
    Landed the part of the earlier OpenScientist assessment sweep (branch os-review-fable) that never merged, rebuilt on current main rather than merged in. Re-applied against main's current node names, with every snippet re-derived from freshly fetched references_cache records (all 12 PMIDs were absent from the cache in this worktree and were fetched with just fetch-reference; 11 of the 12 returned full text). Evidence added: PMID:29456084 (dCas9-Tet1 targeted demethylation reactivates FMR1 in FXS iPSCs) on 'FMR1 full-mutation transcriptional silencing', which is what makes that step causal rather than correlative; PMID:21784246 (FMRP reversibly stalls ribosomes on its target mRNAs) and PMID:35379866 (dried-blood-spot FXP levels correlate with IQ in full-mutation males and females) on 'FMRP loss of translational repression'; two items from PMID:41982083 on 'Dendritic spine and synapse maturation abnormality' recording the dissociation between spine density, which normalizes by adulthood, and dendritic complexity, which declines with age; PMID:31880363 (restoring >5% FMRP normalizes hyperactivity in FXS iPSC neurons) on 'Neuronal hyperexcitability'. Two new non-synaptic effector-arm nodes were created and wired in both directions: 'Astrocytic GABA transport dysregulation' (three items from PMID:41443375 - astrocyte-specific Fmr1 cKO, the GABA-transport-blockade rescue, and the human iPSC astrocyte arm) feeding 'Neuronal hyperexcitability' and 'Neurodevelopmental circuit dysfunction', and 'Excess translation of chromatin regulators' (two items from PMID:28823556, the chromatin consequence and the Brd4-inhibition reversal) feeding 'Neurodevelopmental circuit dysfunction'; both take an incoming edge from 'FMRP loss of translational repression'. Prose correction applied: the spine node's description now states that raised spine density is developmental and resolves in adulthood while dendritic branching complexity falls progressively, so the node is not read as asserting a persistent adult spine excess. Three discussions added: fxs_mglur5_translation_window (KNOWLEDGE_GAP; PMID:30451888 phase 2b behavioral failure against PMID:30653533 positive eye-tracking signal in the same trials, attached to the mGluR node, the canonical hypothesis, and clinical_trials#NCT02920892, whose FXLEARN negative result main already curates), fxs_nonsynaptic_effector_arms (KNOWLEDGE_GAP; PMID:32966779 genome instability and PMID:41557506 glutaminase-dependent metabolic reprogramming - both patient-cell measurements with no established link to a neural or clinical phenotype, so deliberately curated as a gap rather than as nodes), and fxs_mglur_ltd_age_and_condition_dependence (HUMAN_MODEL_MISMATCH; PMID:27656021 confines exaggerated mGluR-LTD to P30-60 and to NMDA-receptor blockade). Deliberately not re-applied: the old branch's edge from FMRP loss to 'Connective tissue and testicular phenotype expression', because main removed that node and replaced it with the connective-tissue and macroorchidism discussions - re-adding the edge would have resurrected a node main retired on purpose. The old sweep's two other findings need no edit here: its hub-and-spoke annotation on the canonical hypothesis notes was already on main via the earlier report-annotation commit, and its correction of the report's claim that no FMR1 gene-disease validity assertion exists (ClinGen has a Definitive one, cached as CGGV:assertion_e491d278-7123-434c-8de3-46e16afb4037-2019-06-03T160000.000Z) is recorded in the assessment sidecar and remains an out-of-scope external_assertions gap. The provider's misreading of the N=1 postmortem spine report is not curated, as before. The OpenScientist assessment sidecar, absent from main, was copied across byte-identical (sha256 verified) and passes just validate-hypothesis-assessment. Verified: linkml-validate 'No issues found'; count-verified-snippets 102/102; check-duplicate-keys, check-entity-refs, check-causal-targets (no new dangling), check-enum-values all OK.

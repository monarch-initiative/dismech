  summary: 'Create: DLL1-related NDD'
  details: |
    New Disease entry for MONDO:0032877 (NEDBAS, OMIM:618709), the autosomal
    dominant DLL1-related neurodevelopmental disorder. entry_type DISEASE: a
    single gene-defined Mendelian entity.

    Built a causal pathograph of 7 pathophysiology nodes: DLL1 haploinsufficiency
    (genetic_context GERMLINE / LOSS_OF_FUNCTION, Notch binding GO:0005112
    DECREASED) -> reduced DLL1 Notch ligand dosage -> impaired Notch signaling in
    neural progenitors (GO:0007219 DECREASED) branching to (a) dysregulated
    neuronal differentiation (GO:0030182 INCREASED, loss of lateral inhibition),
    (b) aberrant neuronal migration (GO:0001764 ABNORMAL) -> periventricular
    nodular heterotopia, and (c) somite segmentation defect (GO:0001756
    DYSREGULATED) -> scoliosis / vertebral segmentation defect. A disordered
    brain morphogenesis node (GO:0007420 ABNORMAL) fans out to the nonspecific
    brain MRI findings and the cognitive/seizure phenotypes. All downstream
    targets are bare names; functional_impact_category carries the variant
    consequence (LOSS_OF_FUNCTION) while modifier carries pathway state
    (DECREASED / INCREASED / ABNORMAL / DYSREGULATED) per CLAUDE.md.

    19 phenotypes (HPO-bound) with frequencies from the Fischer-Zirnsak cohort;
    the defining "nonspecific brain abnormalities" is bound to coarse
    HP:0012443 with coarse_binding_basis VARIABLE_SPECTRUM. Genetic section:
    DLL1 (hgnc:2908 verified against the local HGNC build, not from memory),
    relationship_type CAUSATIVE. Autosomal dominant inheritance block
    (HP:0000006). Supportive/symptomatic treatment only.

    Evidence: 38 exact-quote snippets, all verified against cached references.
    Primary source is the full-text of Fischer-Zirnsak et al. 2019 AJHG
    (PMID:31353024), the delineating 15-individual/12-family cohort; one
    corroborating item from the 6q27-deletion fetal series (PMID:34894355).
    Model-organism mechanism quotes taken from that human paper's introduction
    are graded evidence_source MODEL_ORGANISM with quote_role BACKGROUND; the
    gnomAD pLI / NMD statements are graded COMPUTATIONAL.

    GeneReviews: offline check-genereviews (with synonyms) returned NO_CHAPTER;
    no GeneReviews chapter exists for this disorder, so no baseline tag.

    Deep research: the skill default (falcon) was attempted twice and failed
    Edison authentication (HTTP 403, key invalid in this environment); a
    dr_fallback='--fallback' run then stalled with no output under severe disk
    pressure in the container and was stopped. No usable deep-research report
    was produced, so the entry rests entirely on primary-literature curation of
    the definitive cohort paper plus one independent corroborating cohort. This
    is a single-defining-paper ultra-rare disorder, so deep research would
    largely have re-surfaced the same source.

    Validation (DISMECH_ROOT set to the worktree): just validate-disorders
    PASS (schema + terms + 38 snippets + 1 title, 0 issues); validate-terms
    PASS; count-verified-snippets 38/38; check-entity-refs, check-causal-targets
    (no new dangling), check-duplicate-keys, check-enum-values,
    check-coarse-phenotypes (no new unexplained), check-qualifier-terms,
    check-block-scalar-comments all PASS; check-snippet-grading and
    check-reference-titles PASS; check-title-snippets PASS against the committed
    baseline; normalize-cache + check-term-cache-integrity clean.

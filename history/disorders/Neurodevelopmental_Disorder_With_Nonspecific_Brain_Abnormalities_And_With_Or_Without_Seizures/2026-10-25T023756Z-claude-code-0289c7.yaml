  summary: 'Review round 1 (ai4c-reviewer CHANGES_REQUESTED): biology, frequency, titles, deep research'
  details: |
    Addressed the automated reviewer's blocking items on PR #15572, bundled in
    one push.

    1. reference_title backfilled onto all 37 evidence items from the cached
       reference frontmatter (just backfill-reference-titles); PMID:34894355
       added to the top-level references block with its verbatim cached title.
       lrv now checks 39 titles, 0 issues.

    2. Somite-biology fix. The "Somite Segmentation Defect" edge previously hung
       off "Impaired Notch Signaling in Neural Progenitors" (a neural-progenitor
       node), but somitogenesis is in presomitic mesoderm. Rebranched it to hang
       off "Reduced DLL1 Notch Ligand Dosage" (which feeds both the neural and
       the paraxial-mesoderm branches), and dropped the neural-progenitor-only
       cell_types from the dosage node, broadening its description to name both
       tissues. check-causal-targets / check-entity-refs re-run clean.

    3. Frequency consistency. For a 15-person cohort a single individual is
       about 6.7%, so VERY_RARE (1-4%) is impossible; every single-individual
       finding (ventriculomegaly, hydrocephalus, corpus callosum, cortical
       dysplasia, cerebellar hypoplasia, pons, PVNH, macrocephaly, vertebral
       segmentation defect, kyphosis) is now OCCASIONAL, consistent with the
       "identified in single individuals" quote. Scoliosis moved FREQUENT ->
       OCCASIONAL (4/15 = 27%). Hypotonia frequency dropped (no numeric count in
       the cached body; only the abstract's "most common features" list). The
       intellectual disability description now states that its VERY_FREQUENT
       rests on the combined DD/ID 12/14 figure.

    4. Softened the PMID:34894355 explanation: 6q27 terminal deletions are
       contiguous-gene deletions, so the fetal brain-malformation series is now
       framed as "consistent with a contribution of DLL1 loss", not as
       corroboration that DLL1 loss alone drives the malformations.

    5. Treatments split from one supportive-care row into phenotype-linked rows
       (antiseizure pharmacotherapy -> Seizures; developmental/behavioral
       rehabilitation -> DD/ASD; physical therapy -> Hypotonia; orthopedic
       management -> Scoliosis/vertebral defect; genetic counseling), each with
       therapeutic_modality and target_mechanisms. No treatment evidence is
       asserted because the source paper does not report treatment.

    6. ADHD not re-added: the cached full text gives no ADHD count (only the
       table-legend abbreviation), so there is no quotable finding. A diagnosis
       row was considered but deferred rather than bind speculative NCIT/LOINC
       procedure terms in a disk-constrained container.

    Deep research re-run. falcon/Edison 403s and openscientist exhausted the
    container disk (its artifact bundle does not fit the ~1 GB headroom; the run
    was stopped and the disk reclaimed). The claude_code provider succeeded and

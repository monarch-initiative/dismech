    (no new dangling), check-duplicate-keys, check-enum-values,
    check-coarse-phenotypes (no new unexplained), check-qualifier-terms,
    check-block-scalar-comments all PASS; check-snippet-grading and
    check-reference-titles PASS; check-title-snippets PASS against the committed
    baseline; normalize-cache + check-term-cache-integrity clean.

  details: |
    New entry for MONDO:0859350 (ZNF668-related ZMAND, OMIM:620194), claimed in issue #14861; deletes the stub. Deep research: Falcon was requested but returned 403 (authentication failed); the --fallback run to OpenScientist exited without a report, so OpenScientist was run directly (research/Neurodevelopmental_Disorder_With_Poor_Growth_Large_Ears_And_Dysmorphic_Facies-deep-research-openscientist.md). just preflight-dr PASS (ZNF668, OMIM 620194 match); 5/5 report references resolved, 0 unresolved terms. Evidence is limited to two abstract-only clinical reports (PMID:26633546, PMID:34313816) and two ZNF668 knockdown studies in cancer cell lines (PMID:23777805, PMID:21852383). Phenotypes recorded only where the abstract names them; macrotia and the HPO frequency table in the report come from OMIM/HPO annotation and were not added. Links from the DNA repair defect to clinical features are marked INDIRECT_UNKNOWN_INTERMEDIATES. Validated with just validate, count-verified-snippets (18/18), check-entity-refs, check-causal-targets and the offline snippet/coarse/qualifier gates, then just validate-disorders. A red-team subagent review led to removing a topical-only evidence item from the DNA repair to Microcephaly edge, correcting the notes on abstract availability and family overlap, and adding a CASES_IN_LITERATURE prevalence row.

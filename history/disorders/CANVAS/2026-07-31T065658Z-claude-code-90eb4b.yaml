  summary: Add RFC1 intron 2 retention as a third mechanistic hypothesis
  details: |
    Added a third mechanistic_hypotheses group (intron2_retention_rna_processing, status EMERGING) alongside the existing rfc1_loss_of_function and repeat_structural_toxicity hypotheses, per issue #7172 (deferred from the #7167 review). Cortese et al. 2019 (PMID:30926972) report a consistent increase in RFC1 intron 2 (repeat-hosting intron) retention across patient lymphoblasts, muscle, cerebellum, and frontal cortex, with no sense/antisense RNA foci detected, framed in the paper as analogous to intron retention at other GC-rich repeat expansions (myotonic dystrophy type 2, C9orf72-ALS/FTD). Wired a new MOLECULAR-scale pathophysiology node 'RFC1 Intron 2 Retention' downstream of the 'Biallelic RFC1 Intronic Repeat Expansion' lesion node (sibling to the existing G-quadruplex structural-toxicity node), with a downstream edge to 'Dorsal Root Ganglion Sensory Neuronopathy' explicitly noting the RNA-foci-mediated route is NOT supported by this study (foci were tested and absent) and that intermediate steps remain undefined. causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES throughout, consistent with the EMERGING hypothesis status. No new PMID fetches were needed; the quoted snippet was already an exact substring of the cached references_cache/PMID_30926972.md abstract/full text. Validated with 'just validate kb/disorders/CANVAS.yaml' (schema + term + reference validation all pass, 82/82 snippets verified) and 'uv run pytest tests/test_data.py -k CANVAS' (9 passed).

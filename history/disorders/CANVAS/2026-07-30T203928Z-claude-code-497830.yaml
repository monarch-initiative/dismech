  details: |
    De novo curation of CANVAS (MONDO:0044720), an uncurated late-onset ataxia from the priority-disease EPIC (#1079). Deep research run with the claude_code provider (research/CANVAS-deep-research-claude_code.md); NEC preflight passed (RFC1 dominant at 98 mentions, matching the MONDO causal gene, no competing gene). GeneReviews baseline (PMID:33237689, RFC1 CANVAS / Spectrum Disorder) cross-referenced and tagged, including its Agents/Circumstances to Avoid section. Modeled 7 atomic pathophysiology nodes: the biallelic intronic RFC1 repeat, repeat-intrinsic G-quadruplex structural toxicity, and the three selectively vulnerable neuronal populations (dorsal root ganglion, cranial sensory ganglia, cerebellar Purkinje cells) converging on multisensory balance failure, plus the vagal-afferent cough arm. Declared conformance to cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration; deliberately did NOT conform to peripheral_axonal_degeneration because CANVAS is a non-length-dependent ganglionopathy rather than a length-dependent dying-back axonopathy, and recorded that decision as an INTERPRETATION discussion proposing a future ganglionopathy module. Captured the unresolved pathogenic mechanism as competing mechanistic_hypotheses (loss-of-function ALTERNATIVE, refuted by unchanged RFC1 expression; repeat structural toxicity EMERGING) plus a KNOWLEDGE_GAP discussion with three proposed experiments. Validated: linkml schema, term validation with --labels, reference validator, folded-hyphen check, 70/70 snippets exact, pathograph connected (7 nodes, 11 phenotypes, 19 edges, no dangling/duplicate/unevidenced edges, no orphan phenotypes), compliance 94.9%.

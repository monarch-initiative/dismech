  summary: 'Evidence-claim mismatch review: CANVAS'
  details: |
    Reviewed the 16 claims whose whole-claim Jev label was MISMATCH in the saved
    evidence_claim_match assessment (all still present in the current entry),
    against the cached sources.

    Corrected:
    - mechanistic_hypotheses intron2_retention_rna_processing: the REFUTE item
      from PMID:39231235 quoted the circular-RNA (back-splice) result, which does
      not test intron retention. Replaced with the same paper's endpoint RT-PCR
      sentence reporting no difference in intron retention or aberrant intron 2
      splicing in fibroblasts, iPSC neurons and postmortem brain.
    - pathophysiology Context-Dependent Reduction of RFC1 Transcript Abundance:
      the preprint (DOI:10.1101/2025.11.18.688292) item was graded REFUTE on a
      sentence about protein only. Extended the quote to the full sentence, which
      restates the modest mRNA reduction and explains why protein reduction could
      not be shown, and regraded it SUPPORT for this transcript-scoped node. The
      same quote's REFUTE grading under the rfc1_loss_of_function hypothesis and
      the knowledge-gap discussion was left as is.
    - Motor Circuit Dysfunction node and the spinal histopathology finding: the
      UCL autopsy quote stopped at the subordinate clause about preserved motor
      neurons. Extended it to include the authors' finding of synaptic
      dysfunction between first and second motor neurons.
    - Brain MRI diagnosis: extended the PMID:40908706 limitation quote to the
      clause saying the small, late-stage cohort may obscure longitudinal change.
    - RFC1 genetic notes: replaced the covariate-adjustment fragment from
      PMID:41964406 with the authors' sentence that a single-allele contribution
      to neuropathy risk remains undetermined.
    - Differential diagnoses (SCA27B, Friedreich ataxia): GeneReviews table cells
      cannot carry the row's disease name in the quote, so the explanations now
      name the table row; added a second SCA27B item quoting the neuropathy
      contrast cell.

    Retained after review: the DNA triplex quote (PMID:38381906) on the
    secondary-structure node and model link; the UV gamma-H2AX recovery quote
    supporting a FAILS_TO_RECAPITULATE link; the 2019 bulk-tissue expression
    REFUTE item; the poly-KGREG translation quote; the Australian cohort
    diagnostic-yield row (already labelled as yield, not prevalence); and the
    GeneReviews motor-sign quote on hyperreflexia, muscle atrophy and weakness,
    which the phenotype descriptions already present as uncommon or inconsistent.

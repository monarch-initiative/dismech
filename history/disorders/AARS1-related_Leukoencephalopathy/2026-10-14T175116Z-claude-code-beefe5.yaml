  details: |
    New gene-level entry for MONDO:1010132 with four subtypes curated here (DEE29; a later-onset recessive group and an adult-onset recessive ALSP family, neither with its own MONDO term; and HDLS2) and a TTD8 pointer row (curated_in: Trichothiodystrophy), since that entry already curates the AARS1 TTD form with the other non-photosensitive TTD genes. Falcon was the requested provider but failed authentication (503 'Failed to authenticate'; deep-research-client providers --check reported it UNREACHABLE), and this checkout's justfile has no dr_fallback option, so the claude_code provider was run directly: research/AARS1-related_Leukoencephalopathy-deep-research-claude_code.md. Its validation block shows 15/15 references resolved and 0 off topic; the one unmatched quote (PMID:34446925) differs from the abstract by one word and was not reused, and the correct abstract sentence is cited instead. preflight-dr PASS (AARS1 mentioned 34 times). PMID:38689878 (heterozygous AARS1 p.Arg695* with a CACNA1A variant) was read and deliberately not cited, because it shows neither biallelic AARS1 disease nor leukoencephalopathy. The lactylation papers the report mentions (PMID:38653238, PMID:39322678) were not used: they have no shown link to this disease. No GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER). A pre-PR review by a separate agent found the homozygous p.Thr606Ile ALSP family (PMID:37106376) filed under the dominant HDLS2 subtype; it now has its own recessive subtype, and its single-proband phenotypes moved with it. The same review regraded the fibroblast AlaRS activity item to IN_VITRO, marked the charging-to-myelination and variant-causality items INDIRECT, and added global developmental delay, personality change, hyperreflexia and cachexia. Uncited references the report cached (PMID:35168888, 38689878, 42650065, 38653238, 39322678, 40847183, and an EPRS1 DOI) were not committed. The PR review (#14175) found only 2 of 23 phenotypes causally connected and no diagnosis section. Added a root node for the dominant p.Cys152Phe variant (no functional impact category, since its effect on AlaRS is unreported), an edge from biallelic loss of function to the spheroid node for the recessive ALSP family, and edges from the spheroid and myelination nodes to the adult-onset and imaging phenotypes. Connectivity is now 13 of 24; the remaining links (epilepsy, microcephaly, clubfoot, areflexia) have no sourced mechanism and were left unconnected. Also added diagnosis (brain MRI, NCIT:C16809; exome sequencing, NCIT:C101295), a CASES_IN_LITERATURE / ULTRA_RARE prevalence record, the six reported variants with zygosity, and an ALSP-scoped axonal spheroid phenotype from the proband's biopsy. Validation: just validate-disorders passed; count-verified-snippets 68/68; entity refs, causal targets, enum values, duplicate keys and block-scalar checks all clean; check-granularity reports only the expected advisory POINTER_TERM_MISMATCH on the TTD8 pointer.

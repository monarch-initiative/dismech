  summary: 'Review round 1: narrow a falsified knowledge gap, consume the gene-therapy
    paper, bind the central node'
  details: |
    Addresses the ai4c-reviewer REQUEST_CHANGES review on PR #11686. One CRITICAL and three IMPORTANT items, single bundled push.

    CRITICAL - the knowledge gap asserted the absence of work cited in this same PR.
    - gap_dhps_neuronal_selectivity said 'no equivalent analysis exists in human neurons carrying patient alleles' and named patient iPSC-derived neurons against isogenic controls as the experiment to do. PMID:42239796, cached by this PR, reports exactly that system: cortical organoids from patient iPSCs with double CRISPR-corrected isogenic controls, showing significantly reduced organoid growth. The gap claimed the non-existence of a model sitting in this PR's own reference cache.
    - Narrowed rather than retired, because the reviewer's reading of what remains open is right. The human system exists; the measurement does not. No ribosome profiling or equivalent translational-output assay has been reported in it, so the transcripts whose elongation fails in a human neuron carrying patient alleles are still unidentified and no protein has been connected to any clinical feature. The rationale now says the system exists and shows a phenotype, and asks for the profiling experiment in that specific pair.

    IMPORTANT.
    - Added a Hypotonia phenotype bound to HP:0001252. It was named in the entry's own description and in an already-cited snippet but had no phenotype entry. Evidence quotes PMID:40883692. The explanation states that the quoted sentence summarises a literature review spanning three entities together - eIF5A-related, DHPS-related and DOHH-related disorders - so it establishes hypotonia for the group rather than a DHPS-specific frequency.
    - Consumed PMID:42239796, which was cached and cited nowhere. Added a preclinical AAV9-DHPS gene replacement treatment with therapeutic_modality GENE_THERAPY and a target_mechanisms link to Reduced Hypusination of eIF5A, and an experimental_models entry for the patient-iPSC cortical organoid with its isogenic control. The treatment description states plainly that there is no trial and no treated patient. The organoid link is PARTIALLY_RECAPITULATES at MODERATE fidelity with model_scale TISSUE, and its limitations record that organoid diameter is a gross morphological readout rather than a measurement of the node's mechanism, plus the authors' own statement that the system lacks vascularization, immune components and long-range connectivity.
    - Bound GO:0008612 peptidyl-hypusine biosynthetic process, DECREASED, on Reduced Hypusination of eIF5A, which previously carried no ontology annotation at all despite being the step the entry turns on. Verified against the ontology rather than written from memory.
    - Replaced GO:0006596 polyamine biosynthetic process on Reduced Deoxyhypusine Synthase Activity with the same GO:0008612. The reviewer is right that it was both too broad and directionally wrong: DHPS consumes spermidine as the aminobutyl donor rather than synthesizing polyamines.

    ERROR MADE AND CORRECTED DURING THIS ROUND.
    - Four reference_title values for PMID:42239796 and one for PMID:40883692 were written as descriptions of what the papers are about rather than copied from the cache frontmatter. linkml-reference-validator caught all five. Corrected by reading the titles out of references_cache. This is the exact failure CLAUDE.md documents under 'Every CURIE is read from a source in the same step it is written', applied to citation strings, and it happened despite my having quoted that rule in this run.

    Validation: 41/41 snippets verified, up from 36/36; schema, terms, entity-refs, causal-targets, duplicate-keys, enum-values, qualifier-terms and reference-titles all pass, and the model-link pytest selection (readout targets, model scale, divergences, recapitulation) passes.

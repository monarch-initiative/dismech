  summary: 'Create: Deoxyhypusine Synthase Deficiency'
  details: |
    De novo curation of DHPS deficiency (MONDO:0032775, DHPS) from one openscientist deep-research report (preflight-dr PASS) plus direct reading of every cited reference.

    Entry name is Deoxyhypusine_Synthase_Deficiency rather than the MONDO label, matching the preferred_term already used for this term in the Bachmann-Bupp_Syndrome differential block on main.

    Pathograph: biallelic hypomorphic DHPS variants -> reduced DHPS activity -> reduced eIF5A hypusination -> impaired eIF5A-dependent translation elongation -> altered neuronal protein expression, branching to impaired neurite outgrowth/survival and to reduced GABAergic interneuron arborization -> seizures. functional_impact_category PARTIAL_LOSS_OF_FUNCTION, because Dhps-null mice are embryonic lethal so no patient can carry complete loss.

    Evidence tiering: enzyme activity, hypusination and the eIF5A modified-form shift are measured in recombinant protein and patient lymphoblasts (IN_VITRO, no directness qualifier). The neurite-outgrowth, interneuron and circuit steps carry directness: INDIRECT because they come from RNAi/inhibitor work in cell lines and from a zebrafish morpholino knockdown.

    Frequency claims are quoted verbatim rather than paraphrased - four of five with seizures, one of five with microcephaly, two of four affected females with short stature - because with five patients those counts are the whole evidence.

    A HUMAN_MODEL_MISMATCH discussion records that every model is a null or knockdown while every patient is a hypomorph with ~20% residual activity, and that the mismatch is structural rather than an oversight. It also records an unexplained result: Dhps deletion was consistently more severe than Eif5a deletion in both mouse models, which is hard to explain if unhypusinated eIF5A is the only consequence of DHPS loss. Two proposed experiments address each.

    Errors caught during curation: two MONDO CURIEs written from memory for the differential diagnoses. MONDO:0859263 resolved to 'developmental delay, impaired speech, and behavioral abnormalities' rather than Faundes-Banka syndrome (the correct term, verified by runoak, is MONDO:0859163 / OMIM:619376). MONDO:0859280 resolved to 'developmental delay, hypotonia, and impaired language' rather than the DOHH disorder. A MONDO search of the 2026 release returned no disease term for the DOHH-related neurodevelopmental disorder, so that differential deliberately carries no disease_term and records why in its notes, per the ontology contract's instruction to omit rather than manufacture a binding.

    Two snippets initially failed exact-substring matching because the sources write allele and protein-change detail in square brackets, which the snippet matcher strips before comparing. Both were re-quoted from bracket-free spans of the same papers rather than adjusting literal_bracket_patterns, and the explanation fields record why the variant detail is in prose rather than in the quote.

    Validation: just validate-disorders clean with 36/36 snippets verified; schema, terms, duplicate-keys, entity-refs, causal-targets, qualifier-terms, enum-values, reference-titles and snippet-length all OK.

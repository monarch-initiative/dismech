  summary: 'Curate phenotypes: Hemoglobin M Disease, Beta Type'
  details: |
    Added six phenotypes (Reticulocytosis HP:0001923, Hyperbilirubinemia HP:0002904, Increased circulating lactate dehydrogenase concentration HP:0025435, Anemia HP:0001903, Fatigue HP:0012378, Increased HbA2 hemoglobin HP:0045048) from already-cached full texts (PMID:28096792, PMID:41116143, PMID:41918241, PMID:39854759). Corrected the Hemolytic anemia phenotype, which had restricted hemolysis to the proximal Hb M-Hyde Park class: the cached Hb M-Saskatoon and Hb Tubingen reports document hemolysis too, so the subtype restriction and the uncounted FREQUENT frequency were removed, severity MILD added, and reticulocytosis, hyperbilirubinemia and raised LDH wired as sequelae. Enriched Methemoglobinemia and Chocolate brown blood with per-family evidence. Updated the distal subtype description and added phenotype leads (Moyamoya in one Hb Tubingen carrier, uncached Gottgens 2021 and Upadhye 2015 reports) to notes. New references could not be fetched because NCBI and EBI were unreachable from the curation environment. Validated with just validate, count-verified-snippets (55/55), validate-terms, validate-disorders, check-causal-targets, check-coarse-phenotypes and check-name-collisions.

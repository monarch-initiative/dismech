  summary: 'Create: Hemoglobin M Disease, Beta Type'
  details: |
    De novo curation of MONDO:0018023 as the beta-globin (HBB) form of hemoglobin M disease. Lump/split: curated beta-only, bound to MONDO:0018023 (equivalentTo OMIM:617971 methemoglobinemia beta type; ClinGen Definitive AD for HBB against this MONDO id). Alpha form (MONDO:0020835) and gamma-globin M-hemoglobins (Cyanosis_Transient_Neonatal, MONDO:0013511) are separate entries, recorded as relatedMatch mappings and differential diagnoses. Distal (Hb M-Saskatoon) and proximal (Hb M-Hyde Park) mechanistic classes modeled as has_subtypes and a pathophysiology branch point. gene_disease_validity records the ClinGen Definitive assertion (CGGV:assertion_1165f12f). 6 pathophysiology nodes, 5 phenotypes (all wired to the pathograph), 33 evidence snippets all verified against cached references; no GeneReviews chapter exists (StatPearls NBK537317 only, noted). Evidence from primary case reports and reviews (quote_role REVIEW_SYNTHESIS where cited from reviews), plus Orphanet and ClinGen structured sources. Deletes the curation stub.

  summary: 'Create: Combined Oxidative Phosphorylation Deficiency 52 (NFS1)'
  details: |
    Curated COXPD52 (MONDO:0030311), an autosomal-recessive mitochondrial disease from biallelic NFS1 (cysteine desulfurase) variants, from the two disease-defining papers: PMID:24498631 (Farhan 2014, founding IMC23D report) and PMID:35026043 (Yang 2022, phenotype/molecular spectrum expansion). Built a Fe-S biogenesis causal chain: biallelic NFS1 LOF reducing cysteine desulfurase activity -> impaired mitochondrial Fe-S cluster biogenesis -> combined deficiency of Fe-S-dependent complexes I/II/III with spared complex IV and reduced aconitase -> mitochondrial energy failure -> lactic acidosis. 14 phenotypes, AR inheritance, and the empirical mitochondrial cofactor (vitamin) therapy, all with exact-quote evidence. No GeneReviews chapter exists (offline Bookshelf index + live PubMed title search). OpenScientist deep research was launched per user choice (falcon unavailable - no key). Validated: just validate / validate-disorders (27/27 snippets, 29 titles, 0 issues), validate-terms, and offline gates (entity-refs, causal-targets, snippet-grading, gene-activity-grounding, duplicate-keys, enum-values, coarse-phenotypes, qualifier-terms, delivery-system) all pass.

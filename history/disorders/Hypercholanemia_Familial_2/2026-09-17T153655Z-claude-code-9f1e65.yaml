  summary: 'Review round 1: bone-branch rewiring, GO binding, diagnosis section'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #12043 in one push.

    Blocking finding 1 (case-variant pseudo-self-loop, disconnected bone branch): deleted the
    pathophysiology node 'Reduced Bone Mineral Density', which differed from the phenotype
    'Reduced bone mineral density' only in case and therefore escaped the self-referential gate.
    Its causal edge, INDIRECT_KNOWN_INTERMEDIATES link type, description and PMID:35937832
    evidence were moved onto sequelae of the 'Decreased circulating vitamin D concentration'
    phenotype, which is the route the deleted node's own description asserted but did not draw.
    The animal-model modeled_mechanisms target and the ntcp_bone_causality discussion
    attaches_to were repointed at the surviving phenotype.

    Blocking finding 2 (GO binding one level too general): GO:0015125 'bile acid transmembrane
    transporter activity' -> GO:0008508 'bile acid:sodium symporter activity'. The preferred_term
    asserted sodium dependence and the binding did not, which matters in this entry because the
    compensation node rests on sodium-independent OATP uptake persisting after the
    sodium-coupled importer is lost.

    All three non-blocking suggestions taken in the same push:
    - OATP gene bindings (hgnc:10959 SLCO1B1, hgnc:10961 SLCO1B3) on the 'Residual Enterohepatic
      Cycling via Auxiliary Transporters' node, with the PMID:34369070 sentence naming them as
      the replacement mechanism and stating the sodium-independence that makes substitution
      possible (quote_role BACKGROUND).
    - diagnosis: section, three entries - SLC10A1 genotyping (screen-then-sequence, recorded as
      a claim about founder-allele frequency in one population rather than a general protocol),
      serum total bile acid measurement (the trigger, not the confirmation; age-dependent
      thresholds), and diagnostic restraint once the genotype is known.
    - Bulevirtide as the pharmacologic NTCP phenocopy, on the ntcp_hbv_resistance knowledge gap.
      Two items from PMID:36924318: a SUPPORT/BACKGROUND item establishing that the drug blocks
      the same transporter, and a REFUTE/INDIRECT item recording that BLV-induced bile salt rises
      did not track HDV RNA declines in 20 patients, so the transport-blocking and entry-blocking
      effects of NTCP inhibition are separable. That is the reason the resistance question stays
      open rather than being answered from the receptor's identity.

    Validation on the changed file: linkml-validate clean, linkml-term-validator clean,
    40/40 snippets verified against cached references (was 32/32), check-entity-refs,
    check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values,
    check-case-collisions, check-snippet-grading, check-title-snippets, check-snippet-length,
    check-folded-hyphens, check-environmental-evidence all OK. check-genereviews still reports

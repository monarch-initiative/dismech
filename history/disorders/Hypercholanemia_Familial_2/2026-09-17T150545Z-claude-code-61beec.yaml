  summary: 'Create: Hypercholanemia Familial 2 (NTCP deficiency, SLC10A1)'
  details: |
    De-novo curation of familial hypercholanemia 2 / NTCP deficiency (MONDO:0031003), biallelic SLC10A1 variants, from a Perplexity sonar-deep-research run (research/Hypercholanemia_Familial_2-deep-research-perplexity.md, 358s, 18 citations).

    The report was a lead only; all four references were sourced independently through PubMed esearch. Its term suggestions were not used - the run's Term Validation section records mislabelled bindings including HP:0006560 offered as 'Hepatic cholestasis' (HP: Biliary hyperplasia), HP:0002599 offered as 'Giant cell hepatitis' (HP: Head titubation) and GO:0048029 offered as 'bile acid transmembrane transport' (GO: monosaccharide binding). Every term here was looked up against OLS in the step it was written; hgnc:10905 was read from the repository's own cache/hgnc/terms.csv.

    References: PMID:24867799 (Vaz, first patient: 1500 uM bile salts with no cholestatic jaundice, normal C4/FGF19, secondary bile salts indicating residual cycling, p.R252H absent from plasma membrane), PMID:29290974 (two neonates, novel p.I88T with control allele frequency), PMID:34369070 (113 paediatric patients, case-control, 99.12% hypercholanemia, early-infancy associations, favourable outcomes), PMID:35937832 (ten adults over 5 years plus the NTCP-global knockout mouse).

    The central curation decision was keeping the biochemical phenotype and the clinical associations in separate registers, because the literature does. The index patient's absence of cholestatic jaundice, pruritus and liver dysfunction at bile salts near a hundred times the upper reference limit is curated as a REFUTE evidence item on the Cholestatic jaundice phenotype rather than omitted: an entry that listed cholestatic jaundice from the case-control frequencies and left out that observation would be a fair reading of the frequency data and a misleading portrait of the disease. A KNOWLEDGE_GAP records that the clinical associations come from one genotype-screened cohort, are common conditions of early infancy, and are reported as 'more common than controls' without effect sizes, so the frequency bands should be read as provisional.

    Other judgements. The bone-loss branch is a HUMAN_MODEL_MISMATCH: the human evidence is ten adults, and the mouse shows osteoporosis induced by oestrogen withdrawal and aggravated by the knockout, which supports a modifying role rather than an originating one - the model link is typed PARTIALLY_RECAPITULATES with that wording in limitations. NTCP's second identity as the HBV/HDV entry receptor (already carried by the Hepatitis_D entry) raises an obvious resistance question with no located evidence, filed as a knowledge gap rather than asserted. The Residual Enterohepatic Cycling node is load-bearing rather than a hedge - without it the entry has no account of why the liver is undamaged.

    Validation: just validate passed; 32/32 snippets verified against cached references; just validate-terms passed; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-snippet-grading all OK; 6 of 8 phenotypes causally connected (75.0%). just check-genereviews reports NO_CHAPTER, recorded in the entry's notes.

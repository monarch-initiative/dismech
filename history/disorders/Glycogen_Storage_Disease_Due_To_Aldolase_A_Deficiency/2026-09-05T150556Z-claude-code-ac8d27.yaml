  summary: 'Create: Glycogen Storage Disease Due To Aldolase A Deficiency (GSD XII,
    ALDOA)'
  details: |
    New kb/disorders entry for GSD XII (MONDO:0012747), claimed via issue #11106. Curated around thermolability rather than simple enzyme loss: biallelic ALDOA variants destabilize the homotetramer (the D128V crystal structure is a catalytically active dimer that has lost one subunit interface), which makes residual activity temperature-dependent, which is why the disease is episodic and fever-triggered. The block at glycolysis step four then splits by tissue into an erythrocyte arm (no mitochondria, so no alternative ATP route, giving chronic non-spherocytic haemolytic anaemia) and a muscle arm (glycolysis-dependent only under stress, giving episodic rhabdomyolysis), with muscle glycogen accumulation recorded as the reason for the GSD nosology. Nine HPO-bound phenotypes, four variants, two environmental triggers with influences_mechanisms links, five treatments, and two KNOWLEDGE_GAP discussions (the unexplained non-chaperone arginine rescue; the unexplained tissue selectivity of thermolability). Deliberate negative evidence: the haemolytic anaemia phenotype carries a REFUTE item citing three siblings with molecularly confirmed disease and no anaemia, so the entry does not treat it as obligatory. Deep research: OpenScientist report committed; its structural-biology thread was the substantive contribution. Not carried across: PMID:890096 (Lowry 1977) has no PubMed abstract so no evidence item is drawn from it, and the report's ALDOA-in-cancer finding is a gain-of-expression context in the opposite direction and is excluded. The report's suggested HPO label for HP:0003236 was the retired 'activity' form; the current 'concentration' label is used. The febrile trigger is left unbound because ECTO's temperature terms describe ambient exposure, not endogenous fever, with the reasoning recorded on the environmental entry. Validation: schema pass, term validation pass, 58/58 snippets verified, check-entity-refs / check-causal-targets / check-duplicate-keys / check-enum-values / check-environmental-evidence clean.

  summary: 'Review round 1: conform the erythrocyte arm, fix three ontology bindings,
    add the skeletal phenotype'
  details: |
    Review round 1 on PR #11117. Four blocking findings, all fixed, plus five of
    the seven suggestions. One push.

    Finding 1. The erythrocyte arm now declares conforms_to against
    hemolytic_anemia_erythrocyte_destruction#Reduced Erythrocyte Integrity. The
    case for it was decisive: the module's own description names glycolytic
    enzymopathies as a conforming lesion class, and the two nearest KB entries,
    triosephosphate isomerase deficiency and pyruvate kinase deficiency, already
    conform at five and three nodes respectively. Nothing was restructured,
    since conformance is consistency checking rather than inheritance. The
    muscle arm stays unconformed: there is no rhabdomyolysis module, and
    metabolic_intoxication_decompensation is scoped to toxic-metabolite
    intoxication converging on encephalopathy, which is not this.

    Finding 2. Hepatosplenomegaly was bound to HP:0001744 Splenomegaly while the
    phenotype name, the description and the snippet all say hepatosplenomegaly.
    The hepatic half was simply dropped by the binding. Rebound to HP:0001433.

    Finding 3. Global Developmental Delay was evidenced by a sentence about mild
    intellectual disability, which is a distinct HPO concept from global
    developmental delay. The binding is kept and two sentences that do name
    developmental delay are quoted instead: the historical case described with
    developmental delay, and the index patient's own delayed motor milestones.
    The second is what the description's "delayed milestones" claim rests on,
    and before this it rested on nothing.

    Finding 4. HP:0004804 Congenital hemolytic anemia asserted congenital onset,
    a different axis from what this entry argues. The phenotype name,
    preferred_term, description, the disease-level description and the
    differential-diagnosis section all turn on non-spherocytic. Rebound to
    HP:0001930, which together with the existing temporality CHRONIC carries the
    whole claim.

    Suggestions taken. The antipyresis treatment is split in two, because the
    cited quote describes administering a drug while the modality pill said
    behavioural: a pharmacotherapy entry for the antipyretic, and a behavioural
    entry for trigger avoidance marked directness INDIRECT, since the sentence
    prescribes a drug rather than avoidance and says nothing about exertion. No
    therapeutic_agent is bound on the drug entry, because the source says
    "antipyretics" without naming one. Both directness gaps are closed, on the
    rabbit D128V structure cited as a mimic of the human allele and on the
    class-level review whose exemplars are PYGM and PFK rather than ALDOA. The
    novel skeletal findings are curated VERY_RARE with the radiographic
    description and the authors' own statement that they were previously
    unreported in this condition. Muscle Weakness loses clinical_course
    PROGRESSIVE from the term, which read as a property of the phenotype in
    general while the description scoped progression to one severely affected
    case. The original history record now names this PR.

    Declined: no classifications block. A glycolytic enzymopathy would take one,
    but the Harrison's Part and mechanistic-nosology keys deserve the
    disease-classification skill and a round of their own rather than a
    half-considered assignment bundled into a review response.

    Acknowledged without change: Elevated Creatine Kinase cites a CK-MB value
    against HP:0003236, which is total circulating CK. The description says so
    plainly, so the record is honest about what the number is.

    Worth recording as a trap. The developmental-delay snippet first failed
    verification because it quoted across a bracketed citation marker. Bracketed
    spans are stripped from the query side before matching, so a quote such as
    "Beutler et al. [4] described" can never match cached text that retains the
    bracket. Requoted to start after the marker.

    Validation on this tree: just validate clean, 62/62 snippets verified, up
    from 58. Terms, entity-refs, causal-targets, duplicate-keys, enum-values,
    qualifier-terms, environmental-evidence, snippet-length, title-snippets,
    snippet-grading, folded-hyphens and validate-history all pass. One new cache
    row pair, HP:0001930.

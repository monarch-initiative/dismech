  details: |
    Entry had no inheritance section at all despite curating the RNF216/OTUD4 digenic genotype in its pathophysiology evidence and its genetic section. Added an inheritance section with a single block bound to HP:0010984, reusing the already-cached NEJM discovery snippet (PMID:23656588). Deliberately did NOT add an autosomal-recessive block: no cached reference for this entry carries a quotable statement of recessive inheritance, and per the evidence SOP an unquotable claim is left out rather than fabricated. Note the digenic pattern here is two HOMOZYGOUS loci co-segregating in a consanguineous family, not the double-heterozygote pattern of RP7. Validated with just validate, just validate-terms, just count-verified-snippets. Entry added as a member of kb/groupings/Digenic_and_Oligogenic_Disorders.yaml.

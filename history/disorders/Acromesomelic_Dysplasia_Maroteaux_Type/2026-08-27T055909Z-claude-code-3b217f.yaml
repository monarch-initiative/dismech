  summary: 'Review: literature pass and pathograph GO completion'
  details: |
    Second-pass literature review and pathograph audit. Three mechanistic_hypotheses groups added: chondrocyte cGMP-deficit convergence (CANONICAL), NPR-B phosphoregulation as a variant-independent modifier (EMERGING), and a dominant-negative allele model of carrier short stature (EMERGING). The last corrects a real understatement in the entry: some AMDM missense alleles are normally expressed and poison the wild-type subunit, and carrier height z-scores fall progressively with age, which the inheritance block now records. Pathograph GO coverage completed - receptor phosphorylation and dephosphorylation on the cyclase node, CNP-dependent ERK restraint and FGFR signalling on the growth-plate node, splicing and plasma-membrane localisation on the biogenesis node, and ossification and bone-morphogenesis processes on the four anatomical outcome nodes that previously carried no GO terms at all. New discussions cover vosoritide in biallelic versus heterozygous NPR2 disease and the loss-to-gain-of-function stature mirror. Snippets 117/117 verified.

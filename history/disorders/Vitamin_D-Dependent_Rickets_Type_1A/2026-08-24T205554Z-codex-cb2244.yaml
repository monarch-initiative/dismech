  summary: 'Review: Vitamin D-Dependent Rickets Type 1A'
  details: |
    Completed an evidence-driven, claim-by-claim review of the CYP27B1-related
    type 1A entry against primary patient, functional, model-organism, clinical
    review, and official GEO evidence.

    Changed sections and decisions:
    - Recalibrated the description, inheritance, and genetic sections so reduced
      or residual CYP27B1 activity, variable 25-hydroxyvitamin D, and the partial
      loss-of-function p.(Ala129Thr) allele are represented without turning one
      null-allele patient or one referral cohort into a universal rule. The
      c.195+2T>G observation is restricted to its Turkish cohort/local-founder
      context.
    - Rebuilt pathophysiology as an atomic, evidence-bearing chain: CYP27B1
      enzyme deficiency -> inadequate calcitriol -> reduced intestinal calcium
      absorption -> systemic calcium deficit -> compensatory PTH -> renal
      phosphate wasting -> combined mineral-substrate deficit -> defective
      skeletal mineralization. Added the CYP27B1 gene-to-mechanism join, explicit
      calcium and phosphate convergence, phenotype edges, and the shared-module
      conformance. Patient keratinocyte activity is correctly classified as an
      in-vitro nonrenal assay rather than human-clinical renal evidence.
    - Preserved eight evidence-backed phenotypes while connecting seven to the
      causal graph. Elevated total alkaline phosphatase intentionally remains an
      observational reports_on readout because the cited assay is neither
      bone-isoenzyme-specific nor a direct mineral-deposition measurement.
      Radiographic frequency from the French cohort is kept cohort-scoped.
    - Recast calcitriol and 25-hydroxyvitamin D as context-dependent biochemical
      readouts; added clinical/radiographic/biochemical evaluation and biallelic
      CYP27B1 molecular confirmation. Added nutritional rickets, X-linked
      hypophosphatemic rickets, VDDR1B, VDDR2A, VDDR2B, and VDDR3 differentials.
      VDDR2B is retained as an unresolved receptor-positive entity and is not
      assigned an established germline HNRNPC cause.
    - Split calcitriol, alfacalcidol, and adjunctive calcium into distinct
      treatments with BYPASSES/RESTORES targets, indication and adherence
      caveats, and monitoring/remodeling evidence. Response is supportive for
      management and is not encoded as diagnostic proof.
    - Added a patient-derived primary keratinocyte model and a Cyp27b1-deficient
      mouse with explicit fidelity limits and modeled-mechanism joins. Added
      GEO:GSE69170 as a 24-sample, four-condition, Cyp27b1-null mouse duodenal
      bulk-RNA-seq dataset; it is explicitly not described as a human VDDR1A
      dataset.
    - Expanded naming notes so historical VDDR-I/pseudovitamin-D-deficiency
      labels do not silently merge type 1A with type 1B or the wider VDDR
      umbrella, and kept small-cohort observations scoped to their sources.

    Considered but deliberately not added or overinterpreted:
    - Full-article phenotype percentages from PMID:36321535 were not promoted
      beyond cache-supported statements because feature denominators vary and
      the sanctioned cache is abstract-only. Low 25OHD and the reported 83%
      abnormal-radiograph frequency were retained with explicit cohort scope.
    - PMID:34492747 and PMID:30382318 were considered for response synthesis and
      longer follow-up, but the bounded review did not require new cache records;
      existing direct cohorts support the curated treatment statements without
      creating rigid age, genotype, dose, or adherence rules.
    - Additional Cyp27b1-model publications were considered, but existing
      PMID:12674324 directly supports targeted knockout and calcitriol rescue.
      PMID:26041780 is recorded only as the publication linked by GEO; a separate
      PMID cache was not fetched because the official GEO record itself supports
      the curated dataset design.
    - Exact ClinicalTrials.gov searches found no disease-specific VDDR1A/CYP27B1
      study on 2026-08-24, so no broad-query false-positive trial object was
      created. Treatment response was not used as molecular confirmation.

    Cache and collision provenance:
    - No reference cache was created or edited by hand. After a literal stable
      candidate gate found both planned paths absent on live main and absent from
      every filename and previous_filename in 218 OPEN PRs, the sole new cache
      was generated with `just fetch-reference geo:GSE69170`. Explicit REST
      pagination reconciled declared counts; PR #7922 required an immutable
      base...head fallback (7,728 exact files versus the 3,000-file API cap).
      A mid-pass close/open transition (#9148/#9408) was reconciled and rescanned.
      The stable OPEN-PR snapshots were
      4b87ef27fbfc2ed14298ee8c53f45061d5007d74ddfd165ce14624af92b26d52
      (full) and
      b0752e2047e3e3efe8bee6f3363698ed5c648c7283e81f66e22c5f440b0b6d42
      (content) at live main
      ffa3f27226a4ab879a4da2f95e04a3e305613239. Live NCBI GEO metadata then
      confirmed the title, male Cyp27b1-null four-group design, 24 samples,
      GPL13112, GSE69180 relation, and PRJNA284754.

    Approved immutable content boundary and validation:
    - Work began from pinned main
      8b234f3ee2a00080aa131830e51a78426537b06d. The target SHA-256 was
      cb2244311ff8780a92631bdd543eeeed6bfa0bba7e5a93bb951a7e6cdad24944
      and the generated GEO cache SHA-256 was
      eae3d5d27a64db245e07e65f07edf9e66c26f687d17ae7556770a4ad52b0f396.
      Their ordered-manifest aggregate was
      92ecec0ff2b375cc7e1a6fb1236ed126dc143447e79a441f640452b54f2b25d2.
      An independent exact-content audit returned PINNED APPROVE for that
      aggregate before this REVIEW history was created.
    - Duplicate-key, schema, ontology-term, pre-edit, strict-snippet,
      snippet-boundary, source-defect, reference-cache-frontmatter,
      short-snippet, title-snippet, folded-hyphen, and diff-hygiene gates passed.
      The audit verified 71 of 72 snippets against cached text; the remaining
      GEO-prefixed snippet was the validator's configured prefix skip, not a
      mismatch. The graph had 24 nodes, 25 edges, and zero integrity issues;
      field compliance was 100% (171/171), phenotype connectivity 7/8 with the
      intentional ALP readout exception, and gene wiring 1/1.

    Publication remains pending. The live-main pin above had advanced from the
    isolated worktree base only through an unrelated HGNC backfill, but this
    history record does not authorize a rebase, publication, or any GitHub state

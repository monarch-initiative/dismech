  summary: 'Create: Vitamin D-Dependent Rickets Type 1A'
  details: |
    De-novo curation of the CYP27B1 (renal 1-alpha-hydroxylase) member of the vitamin D-dependent rickets series. Three-node chain: enzyme deficiency -> calcitriol deficiency with preserved 25-hydroxyvitamin D -> defective skeletal mineralization, the last two conforming to defective_skeletal_mineralization#Calciopenic Substrate Deficiency and #Impaired Hydroxyapatite Deposition at the Mineralization Front. Evidence: PMID:9415400 (CYP27B1 cloning and null alleles in a VDDR-1 patient) and PMID:30282619 (11-patient genotyped Turkish cohort). Both PMIDs were fetched and their cached titles checked before use. No GeneReviews chapter was found for this disorder on PubMed search, so no GeneReviews baseline was applied. Validation: linkml-validate clean; just validate-terms passed; just count-verified-snippets 10/10 verified.

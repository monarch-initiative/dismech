  summary: 'Create: Severe_Combined_Immunodeficiency_Due_To_CORO1A_Deficiency'
  details: |
    De novo curation of SCID due to CORO1A deficiency (MONDO:0014168, gene CORO1A hgnc:2252) from the required Perplexity deep-research report plus primary PubMed sources. preflight-dr PASS (CORO1A x102 mentions, OMIM 615401 match). The report's suggested HP/GO CURIEs were unusable (22 mislabelled, 2 nonexistent per term_validation), so every ontology term was looked up independently with runoak ols:hp/ols:go/ols:cl and sqlite:obo:hgnc. Rejected report citations: PMID:19027879 (cached by the run but an unrelated epilepsy paper), PMID:34913575 and PMID:25666293 (cached without quotable abstract text). Chain: biallelic CORO1A LoF -> loss of coronin-1A inhibition of Arp2/3 -> F-actin accumulation in lymphocytes -> impaired T-cell migration/thymic egress + reduced peripheral T-cell survival + impaired NK lytic synapse -> profound naive/innate-like T-cell deficiency -> impaired antiviral cell-mediated immunity and failure to control EBV -> EBV-driven B-cell lymphoproliferation; parallel branches for humoral defect, mucocutaneous viral disease, and a 16p11.2 contiguous-gene deletion node for ADHD. A HUMAN_MODEL_MISMATCH discussion records the mouse-vs-human calcium-flux disagreement (PMID:18345003 vs PMID:26476480). No GeneReviews chapter exists (checked offline Bookshelf index + --online PubMed). Validation: validate-disorders PASS; snippets 102/102 verified; disconnected phenotypes 7/30 (5 READOUT-only, neutropenia and short telomeres legitimately isolated). 12 pathophysiology nodes, 30 phenotypes, 19 distinct references (17 PMID + 2 DOI lymphosign).

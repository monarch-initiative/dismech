  summary: 'Review round 1: SREBF1 differential, diagnosis section, two treatments'
  details: |
    Addressed the automated reviewer's CHANGES_REQUESTED on PR 10043. All three IMPORTANT findings and all four suggestions accepted. Added the SREBF1 differential, which the reviewer correctly identified as the differential genetic testing actually resolves and the one with counselling consequences since it is autosomal dominant. The reviewer's second reason was the more valuable one: SREBF1 encodes SREBP, the substrate of the protease curated here, so a dominant SREBF1 disease sharing the clinical spectrum is evidence bearing on this entry's own ATF6 discussion. That argument is now in the discussion rationale with its own PARTIAL-graded evidence item and a phenotype-subtraction experiment that needs no new laboratory work. Also added the GJB2-associated ichthyosis follicularis syndrome as a second differential. Added a diagnosis section covering triad recognition, MBTPS2 sequencing with a note that intronic variants will be missed by exon-only analysis, and anterior segment OCT - the last of which was conspicuous by its absence since the entry's own pathophysiology leans on the reframing that modality produced. Added emollients and urea keratolytics as the cutaneous mainstay and amniotic membrane transplantation as the limbal-directed intervention, both PARTIAL-graded, with the amniotic membrane item stating explicitly that it was given with acitretin and that the reported improvement included neuropsychomotor development, which no ocular procedure explains. Regraded one PMID:19361614 evidence item from HUMAN_CLINICAL to IN_VITRO because the quantitative relationship it asserts is measured by the CHO M19 complementation assay. Retargeted a would_support slot from the gene record to two pathophysiology nodes. Recorded why the recurrent-infections phenotype is omitted, separately from why its proposed mechanism is. Confirmed by PubMed search that no GeneReviews chapter exists for MBTPS2 or IFAP, settling the reviewer's disclosed uncertainty. Snippets 52/52 verified; full gate battery re-run clean.

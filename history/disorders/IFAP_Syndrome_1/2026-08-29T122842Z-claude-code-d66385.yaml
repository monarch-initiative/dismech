  summary: 'Create: IFAP Syndrome 1'
  details: |
    De novo curation of IFAP syndrome (hypomorphic MBTPS2 variants) from primary literature, with an OpenScientist deep-research report run alongside and committed under research/. Six-node pathograph: hypomorphic MBTPS2 reduces regulated intramembrane proteolysis, which forks into an SREBP lipid-synthesis arm and an ATF6 ER-stress arm; the SREBP arm reaches defective epidermal and follicular keratinization and a progressive vascularising keratopathy. BRESHECK curated as a has_subtypes entry on the same activity continuum. Eight references, all fetched via 'just fetch-reference'; 40/40 snippets verified. Three of the deep-research report's ontology suggestions were rejected on its own validation evidence: NCIT:C29496 which does not exist, HP:0033052 offered as 'Angular cheilitis' when it is 'Non-epileptic seizure', and HGNC:7375 for MBTPS2 when the correct identifier is hgnc:15455. The commonly repeated '40 cases reported' figure is curated but graded PARTIAL because its source is a background sentence in a Hodgkin lymphoma case report. Two discussions: the ATF6 arm is measured but attached to no clinical feature, and the MBTPS2 allelic series produces skin and bone diseases for reasons the review literature states are unresolved. Validated with validate, validate-terms, count-verified-snippets, check-entity-refs, check-duplicate-keys and validate-disorders.

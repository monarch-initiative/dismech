  summary: Review and enrich PKP2-Related Arrhythmogenic Cardiomyopathy
  details: 'Renamed entry to PKP2-Related Arrhythmogenic Cardiomyopathy (retaining PKP2 cardiomyopathy
    and MONDO ARVD9 synonyms). Preserved PKP2 Loss-of-Function Variants and Desmosomal Disruption node
    names (updating Desmosomal Disruption scale to CELLULAR), aligned Wnt/Beta-Catenin Signaling Suppression
    and Fibrofatty Replacement prose with cardiac muscle cell (CL:0000746), added intercalated-disc Nav1.5
    sodium-channel remodeling (GO:0005248, GO:0005243, PMID:24817548) to Gap Junction Remodeling, and
    connected all 11 phenotypes. Added Endurance and Competitive Exercise (ECTO:6000031) in environmental
    with EXACERBATES links to Ventricular Arrhythmias and Right Ventricular Dysfunction (PMID:23871885,
    PMID:24817548), and retargeted Exercise Restriction to those evidenced nodes. Aligned 43-50% cohort
    case fractions, added four NCIT-grounded diagnostic procedures, enriched treatments, added clinical_trials
    (NCT06228924 TN-401 AAV9-PKP2 gene therapy and NCT06976606 observational PKP2-ACM study), tagged GeneReviews
    Overview PMID:20301310 in references, and documented purpose-only GeneReviews coverage and stratified
    LV sparing in notes.

    '

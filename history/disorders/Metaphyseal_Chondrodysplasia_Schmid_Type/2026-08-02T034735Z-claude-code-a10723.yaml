  summary: Model haploinsufficiency vs ER-stress as competing hypotheses; drop unsupported
    figures
  details: |
    Acts on findings 5 and 8 of docs/reports/skeletal-dysplasia-claim-evidence-review-2026-07-25.md.

    Finding 5: the entry carried a 'Functional Haploinsufficiency' node asserting haploinsufficiency as a proximate cause of the phenotype, cited to a 2005 review, while the same entry's own evidence undercut it (PMID:17403716: 'Unlike Col10a1 null mutants, transgenic mice (FCdel) ... displayed typical characteristics of MCDS'). Restructured using the mechanistic_hypotheses mechanism the schema already provides, following the pattern Achondroplasia uses for FGFR3: er_stress_gain_of_function is recorded as CANONICAL and functional_haploinsufficiency as DEPRECATED, with the 2005 review retained as the source of the superseded model and PMID:17403716 attached to it as REFUTE. The node itself was renamed 'Reduced Extracellular Collagen X' and now describes the dosage reduction as a real but insufficient consequence rather than the driver.

    Finding 8: removed the incidence figure of approximately 3-6 per million, which appears in no cited reference and contradicted the record's own prevalence_class of UNKNOWN. Removed the claim that adult height is typically more than 3.5 SD below the mean; replaced with the actual datum from PMID:41454937 (height Z-score -3.62 for the missense subgroup versus -1.99 for truncating, at first presentation), now attached as evidence with its stratification stated so it is not read as an adult-height figure for the whole cohort.

    Validated: schema, reference and term validation all pass.

  summary: 'Review: Oculocutaneous Albinism evidence re-read against cached sources'
  details: |
    Re-read all 4 cached references and re-verified all 45 evidence items. Every snippet is
    an exact substring of its cache, including full-text quotes from PMID:30674731 and abstract
    quotes preserving the source's own typos ("photocromic lenses", "reduced visual activity"),
    correctly not silently corrected. No OCA-subtype Named Entity Confusion and no
    Hermansky-Pudlak/Chediak-Higashi conflation; the mouse allele-to-subtype mappings
    (Tyr c-h -> OCA-1B, Tyr c-2J -> OCA-1A) match the source exactly.

    Fixed in this pass:
    - genetic[SLC24A5 (OCA6)], genetic[LRMDA (OCA7)] and genetic[DCT (OCA8)] were each graded
      SUPPORT/HUMAN_CLINICAL on one identical sentence: PMID:33960688's scope statement ("In
      this review, we will focus only in the genetics of skin pigmentation in OCA..."). That
      sentence names none of the three genes, asserts no gene-disease relationship, and the
      cached record is abstract-only and contains neither the gene symbols nor the subtype
      labels. All three regraded PARTIAL/OTHER with explanations stating exactly what the quote
      does and does not establish and flagging that a primary gene-delineation citation is
      still needed. The claims were not silently deleted, and no substitute quote was invented.
    - genetic[TYR Variants (OCA1)] and genetic[TYR Hypomorphic Variants (OCA1B)] cited
      PMID:21968110 - a mouse-model study - as HUMAN_CLINICAL on two of its background
      introduction sentences. Regraded OTHER, with the basis stated in each explanation. The
      same PMID is correctly graded MODEL_ORGANISM and IN_VITRO elsewhere in the entry.
    - prevalence: dropped the deprecated percentage field; the 1/17,000 figure survives in both
      the structured rate and the verified snippet.

    Recorded, not fixed: the OCA5 4q24 Pakistani-family locus, the common 2.7-kb African OCA2
    deletion, OCA7 case geography, and "especially squamous cell carcinoma" (the cited source
    lists BCC, SCC and melanoma without singling one out) are all unsupported by any cached
    reference.

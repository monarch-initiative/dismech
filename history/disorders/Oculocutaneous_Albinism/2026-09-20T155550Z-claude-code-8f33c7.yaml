  summary: 'Review round: regrade BACKGROUND quotes, GO term, snippet punctuation'
  details: |
    Review round on PR #12336 (issue #12203). Two blocking-issue fixes, two accepted
    suggestions, and one consequential fix the gate surfaced.

    Blocking - evidence_source on a BACKGROUND quote:
    - The PMID:21968110 item on the enzyme node was graded OTHER. The quoted
      sentence describes the human OCA1A and OCA1B phenotypes; it sits in the
      introduction of a mouse nitisinone study. Regraded HUMAN_CLINICAL, keeping
      quote_role: BACKGROUND, and rewrote the explanation, whose trailing clause
      named the wrong value.

    Consequential, surfaced by check-snippet-grading rather than by the review:
    - The same sentence is quoted by a pre-existing item on the TYR OCA1B genetic
      record, graded OTHER. evidence_source classifies the cited publication, so one
      sentence cannot carry two values in one file. Regraded that item to
      HUMAN_CLINICAL + BACKGROUND as well.
    - A second pre-existing item on the TYR OCA1 record quotes a different sentence
      from the same paper ("Mutation of the tyrosinase gene (TYR) causes
      oculocutaneous albinism, type 1 (OCA1)...") with the same shape: a human
      gene-disease statement in that mouse study's introduction, graded OTHER with
      an explanation saying so. The gate cannot see it, because it is a different
      sentence, but leaving it inconsistent inside the same entry immediately after
      the pattern was flagged would have been wrong. Regraded to HUMAN_CLINICAL +
      BACKGROUND.

    Accepted suggestions:
    - The TYRP1 molecular function was bound to GO:0016491 oxidoreductase activity,
      the branch root. Rebound to GO:0016679 "oxidoreductase activity, acting on
      diphenols and related substances as donors". Checked before switching:
      QuickGO annotates TYRP1 (UniProtKB:P17643) with GO:0004097 catechol oxidase
      activity (TAS), and GO:0004097 is_a GO:0016679, so the intermediate term is
      entailed by TYRP1's own GO annotation rather than being an inference. It is
      also in the molecularfunctionterm dynamic enum, which validate-terms confirms.
      GO:0004097 itself was not used: whether DHICA is a catechol is a chemistry
      judgement, and the specificity stays in preferred_term.
    - Two snippets from PMID:32333855 normalized the source's punctuation. Restored
      the source's em-dash in the OCA2 quote and the trailing [37] citation marker
      in the SLC45A2 quote, so both are verbatim.

    Declined, with reasoning given in the PR reply: adding has_subtypes rows for the
    NCL genes that have none. The reviewer flagged it as the next increment rather
    than a defect, and for CLN5 specifically a row would assert MONDO:0009745 twice
    on that entry, which already carries it as a narrowMatch mapping.

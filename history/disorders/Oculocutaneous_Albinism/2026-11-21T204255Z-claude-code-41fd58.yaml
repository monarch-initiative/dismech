  summary: Correct the TYRP1 enzymatic claim in Oculocutaneous Albinism
  details: |
    Cross-check against the ai-gene-review TYRP1 review, which removes the phylogenetically inferred tyrosinase activity annotation on human TYRP1. The Melanogenic Enzyme Deficiency node stated that TYRP1 oxidises DHICA and bound a DHICA oxidase molecular function (GO:0016679, DECREASED) on the strength of an abbreviation list in a 2007 review. PMID:28661582 (crystal structure and assays of the human TYRP1 intramelanosomal domain) reports a binuclear zinc site and no DHICA oxidase, tyrosine hydroxylase or L-DOPA oxidase activity. The description now says the DHICA oxidase assignment comes from mouse Tyrp1 and is not shown by the human protein, the TYRP1 molecular function descriptor is removed, and two quote-verified evidence items from PMID:28661582 are added. The reference was cached with just fetch-reference. Validated with just validate, count-verified-snippets (66/66) and validate-terms.

  summary: 'Genetics pass: split the melanin node by mechanism, close evidence gaps'
  details: |
    Genetics pass for the d2g gene-wiring campaign (issue #12203, epic #12189).

    Research first: eight genes curated and bound, nine subtype rows all carrying
    the right MONDO term, and not one gene reaching a pathophysiology node. All nine
    subtype terms were independently re-derived by OLS search and cross-checked for
    gene agreement against the Monarch CausalGeneToDiseaseAssociation endpoint; all
    agree, and MONDO:0014127 (OCA5) correctly returns no gene.

    The single `Melanin Biosynthesis Deficiency` node named every gene in prose but
    bound none, and the genes do not share a mechanism, so the node was split.

    Changes:
    - Added the gene as a `genes:` descriptor on eight of the nine subtype rows, and
      recorded on the OCA5 row why it stays gene-free.
    - Split the upstream mechanism into three nodes, each converging on the retained
      `Melanin Biosynthesis Deficiency` node:
      * `Melanogenic Enzyme Deficiency` (TYR, TYRP1, DCT) with the three enzyme
        activities bound to GO and the pathway intermediates bound to CHEBI;
      * `Melanosomal Ion Transport and pH Dysregulation` (OCA2, SLC45A2, SLC24A5),
        evidenced from PMID:32333855, including the point that tyrosinase needs
        neutral pH - which is what couples this node to the enzyme node - and the
        review's own caveat that SLC24A5's subcellular site is uncertain;
      * `Melanosome Biogenesis Defect` (LRMDA), evidenced from PMID:36334630 and
        PMID:39975051, where OCA7 mutations uncouple RAB32-Commander binding and
        disturb PMEL processing and melanosomal pH.
    - Closed three recorded evidence gaps. The SLC24A5, LRMDA and DCT records each
      carried a NO_EVIDENCE item whose explanation said a primary gene-delineation
      citation was still needed. Added PMID:23364476 (SLC24A5/OCA6), PMID:23395477
      (LRMDA/OCA7) and PMID:33100333 (DCT/OCA8), kept the NO_EVIDENCE items for
      context with rewritten explanations, and added `relationship_type: CAUSATIVE`.
    - Removed an unsourced claim. The OCA5 row and the entry description said the
      locus was mapped "in a consanguineous Pakistani family"; no reference this
      entry cites states that. The 4q24 location itself is now sourced to
      PMID:23364476, which states it directly.
    - Recorded the GeneReviews baseline. `check-genereviews` reported PMID:37053367
      (Oculocutaneous Albinism and Ocular Albinism Overview) as an uncited candidate
      chapter. Added it to `references:` with the GeneReviews tag and no evidence
      item, and explained in `review_notes` why: its cached record is abstract-only
      and its entire body is the chapter's purpose statement, which asserts nothing
      about any gene.

    New references cached: PMID:32333855, PMID:36334630, PMID:39975051,
    PMID:23364476, PMID:23395477, PMID:33100333, PMID:37053367.

  summary: Bind subtype_term on all nine OCA subtypes; OCA1A resolved as SUBTYPE
  details: |
    Bound subtype_term on all nine has_subtypes entries of the umbrella
    Oculocutaneous_Albinism entry (MONDO:0018910): OCA1A MONDO:0008745,
    OCA1B MONDO:0011749, OCA2 MONDO:0008746, OCA3 MONDO:0008747,
    OCA4 MONDO:0011683, OCA5 MONDO:0014127, OCA6 MONDO:0018264,
    OCA7 MONDO:0014070, OCA8 MONDO:0030899.

    Why: issue #10608 claimed MONDO:0008745 (OCA1A) as uncurated. It is not.
    The umbrella already carries an OCA1A subtype with a description of the
    tyrosinase-negative phenotype, a TYR genetic entry keyed to subtype OCA1A,
    and a cited quote from PMID:21968110 that distinguishes OCA1A (no functional
    tyrosinase, no melanin) from OCA1B (residual tyrosinase, some melanin). The
    subtypes simply carried no ontology term, so the coverage was invisible to
    `just tidy-stubs`. This is the same defect fixed in #9911 for the arterial
    calcification and FCAS subtypes, and the same remedy: bind the whole section,
    not only the subtypes that happen to have a stub.

    Term verification: each of the nine CURIEs was resolved through the EBI OLS4
    MONDO API, checked for obsolescence, checked for the canonical label written
    into the YAML, checked for its hierarchical parents, and cross-checked against
    its OMIM xref (OCA1A 203100, OCA1B 606952, OCA2 203200, OCA3 203290,
    OCA4 606574, OCA5 615312, OCA6 113750, OCA7 615179, OCA8 619165). The OCA5/OCA7
    pair needed that check specifically: MONDO's definition of OCA7 records that it
    was "formerly called OCA5", and the umbrella describes OCA5 as the 4q24 locus
    and OCA7 as LRMDA, which is the assignment the OMIM xrefs confirm.

    One ontology note worth recording. MONDO places OCA1B (MONDO:0011749) as a
    child of OCA1A (MONDO:0008745), not beside it, so MONDO:0008745 is not a leaf
    term - the single descendant the stub reported is OCA1B. Clinically the two are
    sibling points on the OCA1 allelic spectrum, separated by whether the TYR
    variants abolish tyrosinase activity or leave residual activity, and dismech
    models them that way: two sibling has_subtypes entries, each bound to its own
    term. Binding both explicitly means the dismech representation does not inherit
    the nesting.

    Nothing else in the umbrella was touched: no mechanism, phenotype, evidence,
    treatment, or prose change. The diff is nine subtype_term blocks plus the
    derived cache rows that `just validate-terms` wrote.

    Retires stubs/Oculocutaneous_Albinism_Type_1A.yaml (the claim) and, as a side
    effect of binding the whole section, stubs/Oculocutaneous_Albinism_Type_2.yaml
    (MONDO:0008746, unclaimed). Both were recorded as entry_type: SUBTYPE with the
    reasoning before deletion.

    Validation: just validate, just validate-terms, just check-stubs,
    just validate-stubs all exit 0. A reference-cache upgrade that the validation
    run produced as a side effect (PMID_21968110 and PMID_33960688 flipping to
    full-text) was reverted as unrelated to this change.

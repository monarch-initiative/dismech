  summary: 'Address PR #9393 review: fix evidence_source, GO bindings, wire complement
    edge, add caveats'
  details: |
    Review-response pass on PR #9393 (curation-scanner run), addressing the six blocking items in the ai4c-reviewer CHANGES_REQUESTED review of the three PMID:42603814 pediatric-dengue PBMC transcriptomics nodes.

    A1: evidence_source IN_VITRO -> HUMAN_CLINICAL on all three evidence items. The study is an observational WHO-classified pediatric patient cohort whose PBMCs were density-gradient isolated and sequenced with no culture step or perturbation, which is HUMAN_CLINICAL under the CLAUDE.md classification rules.

    B1: "Macrophage-Mediated Innate Immune Activation" rebound from GO:0006909 phagocytosis (a false match - the snippet never mentions phagocytosis, and ITGB2/SPP1/KLF6 is not a phagocytosis signature) to GO:0042116 macrophage activation, verified with OAK.

    B2: "Immune Checkpoint-Mediated T Cell Exhaustion in Secondary Dengue" rebound from GO:0050863 regulation of T cell activation (which with modifier INCREASED reads as the opposite of the checkpoint-restraint claim) to GO:0050868 negative regulation of T cell activation, verified with OAK.

    C1: wired "Complement Cascade Dysregulation" -> "Plasma leakage leading to shock in severe dengue" with causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES and its own edge-level evidence, classified supports PARTIAL because the quoted sentence is the authors' discussion-section synthesis of prior human dengue literature rather than a result of their own study, which did not measure vascular permeability. The macrophage and checkpoint nodes were deliberately left unwired - the source reports co-occurrence in secondary infection, not a directed causal relation - and the reason is recorded in the new discussion instead of being asserted as an edge.

    C2: added a second evidence item to the complement node quoting the primary-vs-secondary comparison (C1QA/C1QC/C2/C4b down, CFI/C4BP/MBL2/CFP up, "a transition from activation to regulation"), so the secondary-infection half of the node description is no longer uncited.

    D1: carried the authors' own caveats into the file. Each of the three nodes gained a notes block recording that its ModifierEnum value reflects transcript-level differential expression rather than measured pathway activity, and the descriptions were reworded to "Transcriptional signature of ...". Added a disease-level discussions entry (kind KNOWLEDGE_GAP, gap_dengue_pbmc_transcriptomic_signatures_functional_validation) attached to all three nodes, recording n=3 per arm, no serotyping, no functional assay, and the bulk-PBMC composition-versus-state confound, with two proposed experiments (paired functional complement readout; single-cell plus ex vivo lymphocyte function with checkpoint blockade). Its notes flag antibody-dependent enhancement as the natural upstream anchor for these secondary-infection nodes and as a separate increment.

    E1: this record.

    Also applied the reviewer's non-blocking suggestions: biological_scale CELLULAR on all three nodes; cell_types (T cell CL:0000084, natural killer cell CL:0000623, mucosal-associated invariant T cell CL:0000940) on the checkpoint node, which the snippet names; and preferred_term aligned with the GO label on the complement node.

    The branch was refreshed against main via the GitHub update-branch API (not a local rebase) because the schema slots supporting_outcome/refuting_outcome used by the new discussion landed on main after the branch point.

    Validation run on the refreshed branch: just validate (passed, 11/11 snippets verified against cached references), just validate-terms (passed), just count-verified-snippets (11/11), just check-duplicate-keys, just check-folded-hyphens, just check-snippet-length, just check-title-snippets, just check-environmental-evidence (all clean against origin/main), and pytest tests/test_entity_refs.py (49 passed, confirming the new attaches_to / would_support / would_refute references resolve). No reference cache file was created or hand-edited; PMID:42603814 was already fetched on this branch and all new snippets are exact quotes from it.

  summary: Declare conforms_to on the viral hemorrhagic fever syndrome module
  details: |
    Added conforms_to: viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability to the 'Plasma Leakage' pathophysiology node, wiring this entry to the new shared mechanism module created when the Viral_Hemorrhagic_Fever umbrella Disease entry was retired (design decisions section 3e, rules R4 and R24; issue dismech#10115). The module's central effector is the increased vascular permeability that every viral hemorrhagic fever funnels through, and this node is this disease's instance of it. Note the retarget: this work was first drafted against an earlier Dengue entry whose single node was named 'Plasma leakage leading to shock in severe dengue'. That node has since been split on main into 'Plasma Leakage' and 'Hypovolemic Shock', with antibody-dependent-enhancement and NS1-glycocalyx nodes added upstream. The conformance was re-pointed to 'Plasma Leakage' on rebase, which is the better target: it is the pure permeability lesion, where the original bundled the shock outcome into the same node.

    The conformance is also what satisfies the CONFORMS_TO_MODULE membership criterion of the new kb/groupings/Viral_Hemorrhagic_Fevers.yaml grouping, which lists this entry as a member. No other content was changed: nothing from the retired umbrella entry was merged in, because every phenotype and treatment it carried that belongs to this disease was already present here.

  details: |
    Follow-on to commit 15196e3528, which a concurrent run pushed to this branch while this session was working on the same review finding. That commit's fix for the blocking item is kept as-is; this session added only what it did not cover, rather than force-pushing over it.

    NON-BLOCKING SUGGESTION TAKEN: the source is internally inconsistent on directionality for three of the five checkpoint genes named in the quoted snippet. Its Results section reports that in secondary dengue "immune checkpoints associated genes VSIG4, PDCD1, ICOS, and CD274 were upregulated whereas LAG3, BTLA, TIGIT, and CD96 exhibited downregulation", while the Discussion sentence quoted as this node's evidence places LAG3, TIGIT and CD96 among the upregulated set. The PDCD1/VSIG4 arm is consistent across both. Recorded in the `notes` of 'Immune Checkpoint-Mediated T Cell Exhaustion in Secondary Dengue' so a curator reading only the node sees it. The evidence snippet is deliberately unchanged: it is a verbatim quote, and a source's own internal inconsistency is not repaired inside a quotation.

    KNOWLEDGE_GAP rationale extended: both this directionality conflict and the FDR non-significance addressed by 15196e3528 are specific to the primary-versus-secondary contrast that the secondary-infection arms of all three new nodes rest on, and neither is resolvable by reanalysing these nine samples. The discussion is the place that gathers the study's limits, so both are summarised there with a pointer to the node `notes`.

    Also records provenance for 15196e3528 itself, which landed without a history record.


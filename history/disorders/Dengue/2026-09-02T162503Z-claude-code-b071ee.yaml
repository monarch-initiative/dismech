  summary: 'Address review: NS1 glycocalyx node, atomic leakage/shock split, wired
    phenotypes'
  details: |
    PR Shepherd fix pass on the CHANGES_REQUESTED review, covering all four blocking items. Item 1: added an NS1-Induced Endothelial Glycocalyx Degradation node upstream of plasma leakage. The reviewer asked for DOI:10.1016/j.molmed.2024.03.006 (Malavige and Ogg 2024), but the cached record for that DOI has no content and the PubMed record PMID:38582622 carries only a generic abstract with no NS1 or glycocalyx sentence, so there is nothing quotable there. Cited the primary source instead, PMID:27416066 (Puerta-Guardo, Glasner and Harris, PLoS Pathogens 2016), which demonstrates the sialidase and heparanase mediated glycocalyx degradation and shows that blocking it blocks the hyperpermeability. Item 2: Dengue Shock Syndrome and Thrombocytopenia are no longer orphans. DSS is now reached from a new Hypovolemic Shock node, and Thrombocytopenia from a new Platelet Activation and Accelerated Platelet Clearance node evidenced by PMID:28139770. Item 3: split the bundled node into Plasma Leakage and Hypovolemic Shock, and retargeted the fluid resuscitation treatment edge onto Hypovolemic Shock, since volume replacement acts on the shock consequence and not on the permeability. Item 4: added the Hemorrhagic Manifestations phenotype bound to HP:0001892, evidenced from the already cached PMID:39773842 and PMID:16135832. Pathograph connectivity for this entry is now 3 of 5 phenotypes; Fever and Skin rash remain unwired and were unwired before this PR. Validated with just validate, just validate-terms, just count-verified-snippets (24/24) and just check-duplicate-keys.

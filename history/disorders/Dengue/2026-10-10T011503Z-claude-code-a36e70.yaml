  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Part of LOINC tranche B (issue 13667). The entry had no diagnosis block; added two rows. Early virological diagnosis: dengue NS1 antigen LOINC:91064-6 (serum or plasma, by immunoassay; no method-less NS1 code or LOINC Part found in the Monarch KG) and pan-serotype dengue RNA LOINC:7855-0 (serum, NAA with probe detection; every dengue RNA presence code names a method). Serology: IgM LOINC:25338-5 and IgG LOINC:29676-4, both method-less serum presence codes. The timing rule (RNA and NS1 early, IgM from day 5) is quoted from PMID:26118588 and the meta-analysis PMID:40209729; the IgG reading of primary versus post-primary infection from PMID:35507552. No reference_ranges: all results are qualitative and no source states a disease-owned threshold.

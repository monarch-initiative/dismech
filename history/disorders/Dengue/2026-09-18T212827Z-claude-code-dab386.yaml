  details: |
    Addressed the two IMPORTANT items of PR #8790 review round 3 and resolved a substantive merge conflict with main. (1) reference_title for PMID:39773842 at the Hemorrhagic Manifestations phenotype was 'Dengue, Zika and Chikungunya: an update on the dermatological manifestations.', which is not that record's title; the same PMID was already cited correctly elsewhere in the file, so the entry contradicted itself. Replaced with the references_cache/PMID_39773842.md title frontmatter verbatim: 'Dermatological manifestations during Dengue, Chikungunya, and Zika infections.' (2) The Platelet Activation and Accelerated Platelet Clearance -> Hemorrhagic Manifestations edge asserted that platelet depletion contributes to bleeding but was evidenced by a PMID:16135832 sentence that never mentions platelets, and which was being reused four times across the entry. Replaced with the already-cached PMID:28139770 sentence 'Studies suggest that the low platelet count is one of the major causes of bleeding in these patients.', which carries the specific claim; causal_link_type stays INDIRECT_UNKNOWN_INTERMEDIATES because the source hedges with 'studies suggest' and does not resolve intermediates. Also took non-blocking suggestion 4, therapeutic_modality: OTHER on Intravenous Fluid Resuscitation (crystalloid/colloid volume replacement is not SMALL_MOLECULE, DEVICE or BEHAVIORAL; OTHER is the honest value). Merge conflict: main had added three pathophysiology nodes (Complement Cascade Dysregulation, Macrophage-Mediated Innate Immune Activation, Immune Checkpoint-Mediated T Cell Exhaustion in Secondary Dengue) in the same region where this branch split the bundled 'Plasma leakage leading to shock in severe dengue' node into atomic Plasma Leakage -> Hypovolemic Shock. Both sides were kept in full; main's Complement Cascade Dysregulation downstream edge targeted the pre-split node name and would have dangled silently, so it was retargeted to Plasma Leakage, which its own edge description names ('increase vascular permeability and drive the plasma leakage'). For the one evidence item both sides edited, this branch's post-split version was kept: the shorter snippet covers only the leakage hallmark, with the 'can result in hypovolemic shock' clause now carried by the downstream edge instead. Validated with just validate (30/30 snippets), check-duplicate-keys, check-entity-refs, check-causal-targets, check-snippet-grading and check-reference-titles.

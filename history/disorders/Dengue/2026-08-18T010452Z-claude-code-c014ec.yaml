  details: |
    Addressed the Dengue 'near-stub' sub-item of issue #6433 (Viral disorder review follow-up). Added: (1) four-serotype (DENV-1-4) description on infectious_agent with lifelong-homotypic/short-term-heterotypic immunity evidence; (2) a new Antibody-Dependent Enhancement in Secondary Heterotypic Infection pathophysiology node wired via downstream into the existing Plasma leakage/shock node; (3) two new phenotypes, Thrombocytopenia (HP:0001873) and Dengue Shock Syndrome (HP:0031274 Hypovolemic shock); (4) a new Intravenous Fluid Resuscitation treatment (NCIT:C116537 Fluid Therapy) with target_mechanisms RESTORES on the plasma-leakage/shock node. All new/reused PMIDs (34171205, 23817881, 16135832) fetched via just fetch-reference and snippets verified with just count-verified-snippets (13/13). just validate, validate-terms, and check-duplicate-keys all pass. Remaining Dengue gaps from #6433 (vaccines, NS1/diagnostics, receptor-level ADE mechanism detail) intentionally left for a follow-up tranche to keep this PR bounded; the other #6433 section-A entries (Hepatitis_C, HPV, Congenital_Zika, Viral_Encephalitis, Postpoliomyelitis/Paralytic_Poliomyelitis) are untouched. Section B (frequency-band) and Section C (cache/substring) items in #6433 were independently checked and found already resolved by prior curation -- commit 5557152835 (2026-07-20, 'Review acute flaccid myelitis mechanisms and evidence') predates and resolves the AFM/Ebola cache claims, and current Mumps/Poliomyelitis/Measles content no longer matches the issue's original frequency-band claims.

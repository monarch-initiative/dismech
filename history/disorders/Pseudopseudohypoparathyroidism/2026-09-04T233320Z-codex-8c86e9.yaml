  summary: Review PPHP pathograph, clinical care and both OpenScientist reports
  details: |
    Phenotype coverage: reviewed all 13 existing Orphanet phenotypes; corrected universal leanness, distinguished true ossification from mineral deposition, added primary evidence for prenatal growth and age-related SCO burden without importing mixed-cohort frequencies. Subtype completeness: distinguished classical PPHP from maternal PHP1A, POH/osteoma cutis and mixed-function GNAS disease; added five differential diagnoses. Pathophysiology depth: replaced three bundled nodes with ten mechanisms separating Gs-alpha dosage, growth-plate maturation, ectopic bone and provisional Hedgehog/YAP-SHH/XL-alpha-s branches; preserved model dosage and cell-context limits. Treatments/trials: corrected the consensus paternal-GNAS exemption from routine serial mineral biochemistry, added lesion care and counselling, and checked four registered studies with explicit PPHP versus related-PHP eligibility boundaries. Genetics: added de novo paternal phase, exon/isoform context, testing sequence, copy-number analysis and parent-of-origin transmission counselling. Biomarkers/diagnostics: retained classical normal mineral physiology with rare exceptions and symptom-directed reassessment; reviewed GeneReviews diagnosis, clinical, management, differential and counselling sections. References: verified exact snippets against fetched primary studies and full GeneReviews; reviews/guidelines marked OTHER. Overall consumption: read the full disorder, both OpenScientist reports and their citation sidecars, both existing assessment YAML/Markdown pairs, and source-scanned the Asta artifact, whose other results were predominantly off-target. Extended both assessments to 36 claim judgments and 12 unexecuted proposals; caught omitted human thyroid/fetal renal expression, patient fibroblast microarray, protective SFRP2 modifier, registry records and T55A receptor context. No new provider analyses were claimed. Raw OpenScientist reports remain unchanged. Validation: disease schema/terms/references 136/136; both assessment schemas, links and report quotes pass. Graph and final repository gates are recorded in the PR validation summary.

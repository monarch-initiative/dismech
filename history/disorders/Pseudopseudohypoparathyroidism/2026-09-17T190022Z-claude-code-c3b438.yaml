  summary: Re-apply outstanding OpenScientist findings
  details: |
    Re-applied the eight OpenScientist-sweep citations still absent from main, each snippet re-derived from the on-disk reference cache after fetching six missing records. PMID:37014531 added to the aho_developmental_model hypothesis (human bone density in PHP runs in both directions, so the skeletal arm is not a single predicted bone-mass phenotype); PMID:34254228 to biochemical Parathyroid hormone resistance (resistance absent at 3 years and detectable at 13, with a note that the de novo variant was unphased); PMID:25802881 and PMID:36686455 to genetic GNAS (truncating-versus-missense ossification correlation in a pooled PHP1A/PPHP cohort; ~45 percent de novo and 8.11 percent parental mosaicism in iPPSD2, substantiating the previously uncited inherited-or-de-novo association); PMID:24363928 and PMID:27589370 to the acrodysostosis differential, which previously cited GeneReviews only; PMID:34897794 to the isolated brachydactyly type E differential, recording that no clinical feature separated PTHLH/TRPS1 patients from AHO. A new OPEN_QUESTION discussion, gnas_mixed_function_variant_scope, homes PMID:30312418, PMID:40172207 and PMID:41530545 and substantiates the mixed gain/loss-of-function scope sentence that main's genetic notes already asserted without citation. Skipped PMID:25952723: main covers the same exon-class birth-weight finding from the primary source PMID:23884777. All four prose corrections the sweep made were already independently fixed on main (universal PPHP leanness softened, STX16 imprinting claim scoped to PHP1B, mouse alpha-SMA cell-of-origin scoped to species) or no longer applicable (the osteoblast-knockout explanation, since PMID:15797856 is not cited on main). The sweep's two discussion-only additions carrying no outstanding citation were skipped: main already records the digit-selectivity gap and the Hedgehog dosage caveat in node and hypothesis prose. Verified with linkml-validate (no issues), count-verified-snippets (146/146), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values.

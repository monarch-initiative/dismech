  summary: 'Integrate assessed OpenScientist findings: Hedgehog ossification arm,
    bone-model and obesity qualifications, phenocopy differentials'
  details: |
    Worked from the two existing codex assessment sidecars for the OpenScientist reports on aho_developmental_model and pphp_parent_of_origin_model (both PARTIALLY_SUPPORTED); no new sidecar was written because one already existed for each hypothesis.

    Integrated, all from RETAINED/QUALIFIED claims whose citations were absent from the entry:
    - New pathophysiology node 'Hedgehog derepression in mesenchymal progenitors' with four evidence items (PMID:24076664 split into a HUMAN_CLINICAL POH-lesion item and a MODEL_ORGANISM sufficiency/rescue item, PMID:34162750 YAP-SHH expansion loop, PMID:33574833 permissive Gnas-null tissue environment), plus edges from 'AHO skeletal and soft-tissue developmental effects' into it and from it to 'Ectopic ossification'. These are the primary mechanism papers the assessment flagged as omitted from the report under claim mesenchymal-lineage-switch.
    - aho_developmental_model: added PMID:35079678 (parent- and sex-dependent bone remodeling in heterozygous AHO mice) and PMID:37014531 (bidirectionally variable human PHP bone density), and rewrote the PMID:15797856 explanation, which had read a complete osteoblast deletion as grounding the heterozygous PPHP bone phenotype (claim osteoblast-model-translation).
    - pphp_parent_of_origin_model: added PMID:25952723, the human birth-weight comparison between exon 2-13 and exon 1 paternal mutations that the XLalpha-s refinement rests on (claim xlas-double-hit).
    - Ectopic ossification phenotype: PMID:29059381 (70.1% SCO prevalence, equal in PPHP and PHP1A, scaling with variant severity).
    - Obesity phenotype: PMID:29059381 as REFUTE, and description softened from 'uniformly lean' to 'lacking marked obesity' (claims universal-lean-pphp, obesity-sparing).
    - biochemical Parathyroid hormone resistance: PMID:34254228, a GNAS-inactivation case whose PTH/TSH resistance appeared at 13 years after normal testing at 3 (claim absolute-absence-of-hormone-resistance); the explanation records that the variant was de novo with parental allele undetermined.
    - genetic GNAS: PMID:25802881 (truncating vs missense correlates with subcutaneous calcification) and PMID:36686455 (~45% de novo, 8.11% parental mosaicism) (claim cohort-characterization).
    - New differential_diagnoses block: Acrodysostosis (PMID:24363928, PMID:27589370) and PTHLH/TRPS1 syndromic brachydactyly (PMID:34897794), giving the phenocopy sentence already in the hypothesis notes an evidenced home (claim pathway-phenocopies).
    - New discussions block: pphp_digit_selectivity_gap (KNOWLEDGE_GAP), pphp_ossification_model_dosage_mismatch (HUMAN_MODEL_MISMATCH, since every Hedgehog causal step comes from homozygous or conditional-null models while PPHP is heterozygous), and gnas_mixed_function_variant_scope (OPEN_QUESTION, PMID:30312418, PMID:40172207, PMID:41530545) (claim mixed-function-variants-scope).
    - Prose corrections driven by REJECTED claims: the parent-of-origin notes no longer cite STX16-ICR chromatin data as support for PPHP (it causes PHP1B on maternal inheritance), and the AHO notes now scope the alpha-SMA dermal sheath cell-of-origin finding to the mouse model.

    Deliberately not integrated: the somatic second-hit requirement for POH (REJECTED as an unsupported upgrade of a hypothesis), the STX16-ICR causal node, the iPPSD subtype renumbering (the report shifted PRKAR1A and PDE4D by one), GO:0019933 and CL:1000838/CL:0000743 ontology leads (obsolete or mislabeled), and the reports' claimed 62- and 54-paper corpora (NEEDS_VERIFICATION, unreproducible). No hypothesis status changed; both remain CANONICAL, as both reports recommended.

    Verification: count-verified-snippets 67/67; check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values all OK on the file.

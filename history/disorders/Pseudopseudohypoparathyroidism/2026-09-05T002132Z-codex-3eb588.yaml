  summary: Align PPHP mechanism and treatment evidence after independent review
  details: |
    Independent read-only audit of the full revised disease YAML followed by a bundled correction round. Checked the growth and ossification causal paths against primary studies, the 2025 alpha-SMA/SFRP2 study against its full text, the clinical management statements against the 2018 consensus, and current CT.gov eligibility for theophylline and the PHP1A-only growth-hormone substudy. Replaced the exon-2 chimera citation on the exon-1 model with the actual exon-1 expression study. Positive growth claims now quote the complete-null experiment; the negative heterozygous result remains on the FAILS_TO_RECAPITULATE relation. Osteogenic-bias edges now quote measured osteogenic markers and state that these adipogenic cultures did not mineralize. Replaced a generic mouse limitation on the human fibroblast model with culture, subtype, age, sex, relatedness and repeated-participant confounding. Shortened the physical-therapy excerpt, bound three treatments to existing NCIT terms and corrected seven inherited reference-title punctuation mismatches. Source records were already fetched; no reference cache or raw report was hand-edited. Targeted schema, ontology, reference, causal-target, entity-reference, duplicate-key, title and pre-commit checks are performed for this correction round.

  details: |
    Expanded the Listeria meningitis seed into an evidence-backed CNS listeriosis entry from the MONDO gap sweep and OpenScientist deep-research fallback, with foodborne and neonatal transmission, contaminated ready-to-eat food exposure, internalin-mediated barrier invasion, facultative intracellular bacteremia, CNS and placental seeding, listeriolysin O phagosomal escape, ActA/efferocytosis-linked cell-to-cell spread, suppurative brainstem-predominant meningoencephalitis, culture and MRI diagnosis, Listeria-active antibacterial treatment, dexamethasone discontinuation guidance, and mouse and zebrafish animal models.

  summary: 'Review round 1: consume research, de-bundle nodes, wire phenotypes'
  details: |
    Addressed the 2026-10-19 review. Rebound the rhombencephalitis phenotype from HP:0000639 Nystagmus (a sign its sources never report) to HP:0012747 Abnormal brainstem MRI signal intensity, which is what the cited cohort measures. Added five clinical phenotypes the research report listed and the entry lacked (fever, headache, nuchal rigidity, reduced consciousness, vomiting), all cited to PMID:38223708, a 15-patient adult Listeria meningitis series. Split Internalin-Mediated Barrier Invasion into an intestinal entry node (UBERON:0001277) upstream of bacteraemia and a brain-endothelial entry node (UBERON:0000120) at the CNS step, so blood-brain-barrier crossing is claimed once; the human E-cadherin transgenic mouse now links to the intestinal half it models and cites its own primary report, PMID:11387478, rather than a review. Added a host disposition node for impaired cell-mediated immunity. Wired eight downstream edges from the suppurative meningoencephalitis node to the phenotypes, taking causal inlink coverage from 0/3 to 8/8. Added prevalence (three CDC incidence strata, flagged as parent-concept figures), a two-phase progression block including the influenza-like prodrome, and clinical_burden carrying the hydrocephalus survival split and the ST6 outcome signal. Added the cephalosporin-backbone rationale to the aminopenicillin treatment as INDIRECT evidence. Left the Listeriosis granularity question for a maintainer. just validate-disorders passes with 54 snippets and 0 issues.

  details: |
    Created kb/disorders/Chondrodysplasia_With_Joint_Dislocations_gPAPP_Type.yaml as a DISEASE entry (MONDO:0013561, BPNT2/IMPAD1, autosomal recessive), and deleted the corresponding stub. Deep research was run with the claude_code provider; the report is committed under research/ but nothing from it is cited, because the session ran under an egress policy that blocked every literature and ontology service (NCBI E-utilities, Europe PMC, Crossref, OLS, OBO PURLs, genenames.org), so no new reference could be fetched into references_cache/ and the report's own reference- and term-validation passes could not execute. Every evidence item therefore cites a reference already committed to the cache: DOI:10.3389/fgene.2021.717535 (Mizumoto and Yamada 2021, full-text review with a section on this disorder) for the gene-disease relationship, recessive inheritance, the PAP/sulfotransferase mechanism, the Impad1-null mouse sulfation data and the clinical features; and PMID:19369399 (Cortes 2009) for the undersulfated-chondroitin-to-Indian-hedgehog step, marked directness INDIRECT because it is the brachymorphic Papss2 mouse. The primary reports (Vissers 2011 PMID:21549340, Nizon 2012 PMID:22887726, Sohaskey 2008 PMID:18539921, Venkatapuram 2022) are cited only at second hand and are listed as leads in the entry's review_notes. Treatments, clinical burden, progression, diagnostics and datasets were omitted for lack of a citable cached source, not because they were judged out of scope. Validation run: just validate (schema: No issues found); just count-verified-snippets --unskip-prefix DOI (16/16 verified); check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets all OK; dismech.graph --validate OK; compliance 77.0 percent. just validate-terms could NOT complete: MONDO:0013561 and hgnc:26019 are absent from cache/ and OLS was unreachable, so those two CURIEs are unverified by the repository tooling. Both were read from the official MONDO release OBO (github.com/monarch-initiative/mondo, reachable in this session): the label matches, and the has_material_basis_in_germline_mutation_in axiom on MONDO:0013561 names identifiers.org/hgnc/26019 BPNT2, which agrees with the stub and not with the hgnc:26428 quoted in issue 10762. Every other term in the entry validates offline against the committed cache.

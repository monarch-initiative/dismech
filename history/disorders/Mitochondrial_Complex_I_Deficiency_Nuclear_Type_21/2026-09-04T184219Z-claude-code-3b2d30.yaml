  summary: 'Create: Mitochondrial Complex I Deficiency Nuclear Type 21 (NUBPL)'
  details: |
    New entry for MC1DN21 (MONDO:0032625), NUBPL-related mitochondrial disease, curated from
    the primary NUBPL literature. Five references, 35/35 snippets verified against cached
    abstracts.

    The entry is built around two features that distinguish MC1DN21 from the other numbered
    nuclear complex I deficiencies. First, the MRI pattern is diagnostic rather than merely
    suggestive: the original patient group was assembled from imaging (cerebellar cortex, deep
    cerebral white matter and corpus callosum), and exome sequencing then found NUBPL variants
    in all of them, with the authors concluding the pattern can obviate respiratory chain
    assays. Second, the common allele c.815-27T>C is a branch-site variant present in ~1.2% of
    European haplotypes, far too common to be pathogenic alone; its pathogenicity was
    established functionally in yeast Ind1 rather than by frequency argument, and it is
    separable from the c.166G>A (p.Gly56Arg) change it was originally found in cis with.

    The second reported presentation (generalized dystonia with bilateral striatal necrosis
    and cerebellar atrophy, a UK kindred) is recorded alongside the leukoencephalopathy
    picture and its relationship to it is curated as an OPEN_QUESTION discussion, because the
    literature leaves it unresolved.

    The experimental_models section carries the Yarrowia lipolytica Ind1 system as an
    ExperimentalModel with experimental_model_type OTHER, since it is a non-animal system, plus
    patient fibroblasts.

    One evidence snippet quotes a Cyrillic capital І that appears verbatim in the source
    abstract ("a respiratory chain complex І deficiency"). It is quoted as it appears; a
    snippet never corrects the source it quotes.

    Two evidence items from PMID:32518176 were split so each could be quoted around a
    bracketed variant span - the reference validator strips bracketed content from the query
    side, so a snippet containing [p.L104P] cannot match. The reason is recorded in the
    evidence explanations so a later curator does not retry the single-item form.

    DEEP RESEARCH: the openscientist run for this disease returned a report about the WRONG
    DISEASE and was therefore not used and not committed. It anchored on MONDO:0032624, which
    is mitochondrial complex I deficiency nuclear type 19, and on NDUFAF5/C20orf7 (OMIM
    #618241) rather than NUBPL (OMIM #618242), while asserting the MC1DN21 name throughout.
    All twelve of its PMIDs are NDUFAF5 papers or generic Leigh syndrome cohorts. Root cause is
    dismech#9888: just research-disorder hardcodes an empty mondo_id, so the provider
    disambiguates from the disease name alone, and this numbered series has 32 near-identically
    named members currently in the stub queue. Recorded with full detail as a comment on
    dismech#9888. The entry here was built independently from NUBPL primary literature.

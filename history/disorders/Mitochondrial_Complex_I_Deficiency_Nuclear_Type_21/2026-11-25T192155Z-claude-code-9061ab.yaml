  summary: 'Gene-family review: NUBPL'
  details: |
    NUBPL's two nodes carried the gene with only a process term (iron-sulfur cluster assembly), so the entry never stated what the protein itself does. Human NUBPL (huInd1) is a P-loop NTPase that binds an Fe/S cluster through a conserved CXXC motif in a labile fashion and is needed for assembly of the complex I peripheral arm (PMID:19752196). The node Impaired Iron-Sulfur Cluster Delivery to the Complex I Peripheral Arm now binds iron-sulfur cluster binding (GO:0051536), decreased, at the generic level because the cluster type is not established for the human protein, with that sentence as evidence. ATP-dependent Fe-S chaperone activity was not bound: NTPase activity of human NUBPL has not been shown. The genetic record (causative, germline) was checked and left unchanged.

  summary: 'Review round 1 on PR #10995: treatments, cognition, gait ataxia binding,
    GeneReviews note'
  details: |
    Applied all four blocking findings from the automated review of PR #10995, plus the
    OMIM suggestion, in a single push.

    The reviewer's diagnosis was correct and worth recording: every blocking finding was
    under-consumption of a source already committed in this PR.
    references_cache/PMID_32518176.md is 1,095 lines of full text, not an abstract, and the
    first pass mined only the abstract. The lesson generalises - a cached reference is not
    necessarily an abstract, and the abstract of a review is a poor summary of the case
    series inside it.

    Blocking 1 - treatments section absent. Added three treatments, all quoted from the
    cached full text: occupational therapy (NCIT:C121351), linked via target_mechanisms to
    the Tremor phenotype, since the source attributes that patient's tremor improvement to
    it; a mitochondrial cofactor cocktail (coenzyme Q10, carnitine, alpha-lipoic acid) under
    NCIT:C15986 with three CHEBI therapeutic_agent bindings; and EPI-743 as an experimental
    agent. Deliberately, the cocktail carries NO target_mechanisms link: the source says
    treatments are "currently limited to" these agents, which is a statement about the state
    of the field, not evidence that they act on the complex I assembly defect. The authors'
    own ceiling statement is curated as its own evidence item, because an empty treatments
    section and a section listing a cocktail read identically to a consumer unless the limit
    is stated.

    Blocking 2 - cognitive status. Added Cognitive impairment (HP:0100543, FREQUENT). This
    was the reviewer's highest-value finding and they were right about why: the Bilateral
    Striatal Necrosis node uses preserved cognition as the feature distinguishing the UK
    kindred, and the OPEN_QUESTION discussion rests on that contrast, so without the
    leukoencephalopathy series' impaired cognition the entry asserted only one half of its
    own argument. Also added hyperreflexia (HP:0001347) and clonus (HP:0002169) as separate
    phenotypes since HPO codes them distinctly, dysmetria (HP:0001310), and unilateral
    sensorineural hearing loss (HP:0000407, OCCASIONAL).

    The Leigh-like phenotype in Patient 3 was NOT curated as a phenotype, and this is a term
    gap rather than an oversight: HPO has no Leigh-like or Leigh syndrome phenotype term
    (Leigh syndrome is a MONDO disease concept), and binding a basal-ganglia or
    leukoencephalopathy term would name a different finding than the source does. It is
    recorded in notes instead, where it bears on the open question.

    Blocking 3 - Gait ataxia binding. preferred_term said "Cerebellar ataxia" against
    HP:0002066 Gait ataxia. Those are sibling concepts, not a specific/general pair, so the
    "preferred_term may be more specific" carve-out did not apply. Kept HP:0002066 and
    earned it: added the full-text gait sentence that documents gait involvement, and set
    preferred_term to Gait ataxia. The original cerebellar-syndrome quote is retained as a
    second item with its explanation saying explicitly that on its own it supports only
    "ataxia". The gait snippet is quoted with the source's own double space after "as" - a
    snippet does not correct its source.

    Blocking 4 - GeneReviews determination. Added a notes block. There is no NUBPL-specific
    chapter; the nearest candidate is the Nuclear Gene-Encoded Leigh Syndrome Spectrum
    Overview (PMID:26425749). This entry follows MC1DN24 in not tagging it, for a
    NUBPL-specific reason: the disease was defined by a white matter MRI pattern rather than
    by the bilateral symmetric basal ganglia and brainstem lesions that define Leigh
    syndrome, and a Leigh-like picture appears in one of five patients. Tagging a Leigh
    spectrum overview would assert a nosological placement the literature does not make.

    Suggestion 5 taken with a correction to where it goes. The reviewer suggested a
    mappings: block for OMIM 618242. The schema's DiseaseMappings container has only
    mondo_mappings and no OMIM slot, and Autosomal_Dominant_Sensory_Ataxia_1 already records
    an OMIM identifier under external_assertions with a description saying exactly that. So
    the OMIM record is added as an external_assertions entry, following that precedent.

    Also corrected the create record's sections list in this PR, which listed treatments when
    the entry had none.

    Suggestion 6 (retry the deep research with an explicit --var mondo_id) is deferred rather
    than declined: an openscientist job for another disease is running, and concurrent
    launches previously aged four jobs out against the provider's 3600s timeout. It will be
    attempted once the queue drains.

    Validation after the round: 46/46 snippets verified. Schema, terms, entity refs, causal
    targets, duplicate keys, qualifier terms and enum values all clean.

  summary: 'Review round 2 on PR #10995: correct a false ontology-coverage claim,
    connect orphan phenotypes'
  details: |
    Both round-2 blocking findings were defects introduced by the round-1 fixes, not pre-existing
    issues. Recording them plainly because both are worth not repeating.

    Blocking 6 - a FALSE claim written into an evidence explanation. The round-1 sensorineural
    hearing loss phenotype was bound to HP:0000407 (Sensorineural hearing impairment) with an
    explanation asserting "HPO has no unilateral sensorineural hearing impairment term at this
    level". That is untrue. HP:0025797 "Unilateral sensorineural hearing impairment" exists,
    resolves against ols:hp, and passes validate-terms in this slot. The claim was written from
    assumption rather than from a lookup.

    This is the more serious of the two findings and not because of the binding. A wrong binding is
    caught by term validation; a false statement about ontology coverage sitting in an explanation
    is caught by nothing, and is exactly the kind of prose a later curator trusts instead of
    re-checking. The rule in the dismech-terms contract is to bind the most specific term that
    accurately represents the claim, and "no term exists" is a claim like any other: it needs a
    search behind it.

    Fixed by rebinding to HP:0025797, keeping "Right sensorineural hearing loss" in preferred_term
    because HPO codes the unilaterality but not the side, and rewriting the explanation to say that
    accurately.

    Blocking 7 - all five phenotypes added in round 1 were disconnected from the pathograph. None
    was the target of any downstream edge, so they rendered as orphan nodes while the eight round-1
    phenotypes were all wired. check-causal-targets passes on this, because it verifies that a
    target resolves and never that a phenotype is reachable, so nothing flagged it.

    The clearest case was Dysmetria: the node Cerebellar and Deep White Matter Degeneration already
    carried DIRECT edges to Gait ataxia, Dysarthria, Nystagmus and Tremor, which are the other four
    items in the same source sentence. Leaving the fifth member of that list unwired was an
    inconsistency inside the entry rather than a scoping decision.

    Wired from that node: Dysmetria DIRECT, matching its four sentence-mates; Cognitive impairment,
    Hyperreflexia and Clonus as INDIRECT_UNKNOWN_INTERMEDIATES. The hedged link type is doing real
    work on the last three - the source lists them among presenting features and does not attribute
    them to the white matter lesion, so the anatomical route (corticospinal tracts running in the
    deep white matter this node names) is inference, and INDIRECT_UNKNOWN_INTERMEDIATES states
    exactly that there are intermediates and they are not known.

    Sensorineural hearing loss is deliberately left unconnected, with the reason recorded in its
    description: nothing in this literature connects the hearing loss in that single patient to the
    cerebellar/white-matter lesion or to any other node, and an unsupported edge is worse than an
    unconnected phenotype.

    Suggestion 8 taken: EPI-743 now carries NCIT:C152840 (Vatiquinone) as therapeutic_agent, and
    gained the patient-level quote naming the drug, which is a stronger source than the field-level
    "experimental drugs have shown promise" and sidesteps the bracket-stripping problem instead of
    working around it. Both quotes are kept, since they support different claims.

    Suggestion 9 taken. The phenotype "Hyperreflexia with clonus" is renamed to "Hyperreflexia" so
    its name matches its HP:0001347 binding, with clonus curated separately - done before wiring, so
    no foreign key was broken. Cognitive impairment stays FREQUENT rather than VERY_FREQUENT, and
    the reasoning is now recorded rather than left as a default: 4/5 is nominally 80%, the
    VERY_FREQUENT floor, but at n=5 one reclassified patient moves the estimate to 60%, so the band
    is set from the width of the interval.

    Also worth recording: the reviewer withdrew their own round-1 suggestion 5 after checking, and
    they were right to. DiseaseMappings has no OMIM slot, so external_assertions was the correct
    home for OMIM 618242.

    Validation after the round: 47/47 snippets verified. Schema, terms, entity refs, causal targets,
    duplicate keys, qualifier terms and enum values all clean.

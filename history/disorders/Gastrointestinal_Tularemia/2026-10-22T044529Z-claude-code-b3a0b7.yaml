  summary: 'Review round: evidence scope disclosure, phenotype binding, grading, connectivity'
  details: |
    PR Shepherd round answering the 2026-10-19 review.

    Rewrote notes. It had asserted that a Falcon/OpenScientist run resolved 47 PMIDs, but no report for this entry is committed under research/. The note now states that, and - the substantive point - states plainly that PMID:24911857, which carries both phenotypes and the enteric inflammation node, reports two paediatric cases of oropharyngeal tularemia in which abdominal lymphadenopathy was found. It is evidence for gastrointestinal nodal involvement by the ingestion route, not a lower-GI primary case series. It also records that intestinal ulceration, abdominal pain, diarrhea, nausea/vomiting and GI bleeding are absent because no cited reference states them.

    Softened the entry description, which asserted 'ulcerative gastrointestinal inflammation' that nothing in the entry evidences.

    Fixed the Fever item: the explanation claimed the quoted list of six classic forms 'places alimentary presentations among the recognized clinical forms', which that list does not do, and frequency: FREQUENT rested on a quote carrying no frequency. The explanation now claims only the acute febrile disease the quote states, and no frequency band is claimed.

    Bound the Abdominal Lymphadenopathy phenotype. HPO has no abdominal lymphadenopathy term: an OLS search for it returns nothing, and 'lymphadenopathy' returns nine anatomically qualified siblings, none abdominal. 'mesenteric lymph node enlargement' does return HP:0025043, but PMID:24911857 says abdominal and never mesenteric, so binding it would assert a nodal distribution the source does not. Bound HP:0002716 Lymphadenopathy with located_in UBERON:0003684 abdominal cavity, and recorded the whole search in notes. Frequency moved from OCCASIONAL to RARE, which is what a source titled 'A rare cause' supports.

    Regraded two evidence items. PMID:20054881 was IN_VITRO on a sentence ending 'virulence in mice'; that item is now MODEL_ORGANISM and a second IN_VITRO item quotes the purely cell-based result from the same paper. PMID:19835784, a food-microbiology survival study whose quoted sentence is a background statement of the human clinical route, moved from OTHER to HUMAN_CLINICAL with quote_role: BACKGROUND.

    Changed the phagosome GO term from GO:0141158 (suppression of phagosome maturation) to GO:0141160 (disruption of host phagosome); the node is named for escape and its snippet says escape.

    Connected both phenotypes to the pathograph from the enteric inflammation node; list-disconnected-phenotypes now reports 2 of 2 connected, from 0 of 2.

    Left for the author or a maintainer: the deep-research artifact cannot be produced here, and whether to source genuine lower-GI primary cases or narrow the entry's scope is a curation decision rather than a repair.

  details: 'Reviewed Hashimoto_Encephalopathy.yaml for issue #10665. Added classifications (NEUROLOGIC, IMMUNE_RHEUMATOLOGIC, ENDOCRINOLOGY_METABOLISM), structured prevalence fields (measure_type POINT_PREVALENCE, rate_per_100000 2.1, removing deprecated percentage), causal downstream edges linking Thyroid Autoimmunity to Steroid-Responsive CNS Neuroinflammation and linking pathophysiology nodes to clinical phenotypes with supporting evidence, biochemical entries for serum anti-TPO, serum anti-Tg, CSF antithyroid antibodies, and serum anti-NAE antibodies, and differential diagnoses for autoimmune encephalitis (MONDO:0020640) and multiple sclerosis (MONDO:0005301). Expanded short evidence snippets (<50 chars) in phenotypes.'

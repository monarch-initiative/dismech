  details: 'Reviewed Hashimoto_Encephalopathy.yaml for issue #10665. Added classifications (NEUROLOGIC, IMMUNE_RHEUMATOLOGIC, ENDOCRINOLOGY_METABOLISM), structured prevalence fields (measure_type POINT_PREVALENCE, rate_per_100000 2.1), causal downstream edges linking pathophysiology nodes to clinical phenotypes with supporting evidence, biochemical entries for serum anti-TPO, serum anti-Tg, CSF antithyroid antibodies, and serum anti-NAE antibodies, target_mechanisms links on immunomodulatory treatments, and differential diagnoses for autoimmune encephalitis (MONDO:0020640), multiple sclerosis (MONDO:0005301), and Creutzfeldt-Jakob disease (PMID:41883393). Expanded short evidence snippets (<50 chars) across phenotypes and references.'

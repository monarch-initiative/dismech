  summary: Annotate HP:6000253 necrotizing vasculitis (grouping member)
  details: |
    Added a Histopathologic phenotype node bound to HP:6000253 "Necrotizing vasculitis" as part of creating the Necrotizing Vasculitides grouping (kb/groupings/Necrotizing_Vasculitides.yaml, issue #8754). Before this change no entry anywhere in the KB used HP:6000253, so the grouping's NECESSARY membership criterion had nothing to evaluate against and just check-groupings reported every listed member as a contradiction; annotating the defining lesion on each member is what makes the grouping auditable rather than aspirational. Every snippet is an exact quote from an abstract already cached by just fetch-reference. Validation actually run over this file: just count-verified-snippets (no unverified snippets) and the batched pre-PR sweep just validate-disorders across all eight edited entries, which passed schema, ontology-term and reference validation ("Files validated: 8 ... All validations passed", "Snippets checked: 386/401 verified against cached references (15 skipped by prefix)"). Evidence: PMID:33713282 (Fraticelli et al.) for both the fibrinoid-necrosis definition of the leukocytoclastic lesion and IgA vasculitis being among the systemic diseases most frequently underlying it. This entry previously carried no HP-bound vasculitis phenotype at all. MONDO independently classifies immunoglobulin A vasculitis as an is_a descendant of MONDO:0800113 necrotizing vasculitis.

  summary: 'Review round: fix evidence_source mis-grading, document edge citation
    policy, add canine F13A1 model'
  details: |
    Review round on PR #11632 (approved, with one IMPORTANT and two MINOR findings).
    All three addressed in a single push, which drops the approval; the correction was
    judged worth a re-review cycle because the IMPORTANT finding was a mis-graded
    evidence_source, i.e. a false statement about what a publication reports.

    IMPORTANT - evidence_source mis-grading on the Poor wound healing phenotype.
    PMID:12529747 ("Targeted inactivation of the mouse locus encoding coagulation
    factor XIII-A") was graded HUMAN_CLINICAL, with an explanation arguing that the
    quoted sentence reports the human disorder rather than the mouse experiment. The
    reviewer is right that this grades the wrong thing: CLAUDE.md says
    evidence_source classifies the evidence presented in the cited publication, and
    that publication presents mouse data. An introductory sentence restating other
    people's human consensus presents no evidence of its own. The file was also
    internally inconsistent, grading the same PMID MODEL_ORGANISM in nine other
    places - which is why check-snippet-grading stayed green, since it keys on the
    quoted sentence rather than on the PMID.

    Of the two fixes the reviewer offered, the item was dropped rather than regraded,
    and then replaced with better evidence of the same kind. Regrading it to
    MODEL_ORGANISM would have left a model-organism item making a human claim that
    PMID:41583548 already makes directly in the item above it, and the sentence is an
    intro line rather than a result either way. In its place the phenotype now carries
    PMID:16113836, the mouse study that actually measured wound healing, graded
    MODEL_ORGANISM, quoting the wound-maturation score (94.9 control / 61.5 deficient
    / 94.5 FXIII-treated, p < 0.001) - a result sentence with a rescue arm, and a
    different measurement from the closure percentages already quoted on that model's
    readouts. Net effect: the phenotype keeps two evidence items, both correctly
    graded, and the animal evidence now comes from the paper that did the experiment.

    MINOR 1 - five downstream edges asserting causal_link_type: DIRECT with no
    evidence. A causal-edge citation policy was applied and recorded in the entry
    notes rather than the edges being papered over. Of the reviewer's three options,
    option two was taken for all five: each edge now carries a description saying what
    the step is, and remains uncited. Option one (cite the edge) was rejected
    deliberately - the available sources state that patients with this disease bleed
    at those anatomical sites, which is the node-level claim already carried on each
    phenotype record, not a statement that the bleed follows from the delayed-bleeding
    state, and reusing those citations on the edges would be exactly the "reach for a
    node's citation to paper over an edge" that CLAUDE.md warns against. Option three
    (soften DIRECT) was also rejected: the anatomical-site edges are the same failure
    reaching a different tissue, which is about as direct as a causal claim gets here.
    The edge from accelerated fibrinolysis to delayed bleeding already carried a
    description and no evidence, so it already satisfied option two; that is now stated
    rather than left implicit. Four edges gained descriptions.

    MINOR 2 - canine natural disease, PMID:42184124. Fetched and read in full before
    curating (the report had flagged it retrieved-but-unverified); it came back as
    green-OA full text and verified. Curated as a fourth animal_models record: a
    4-month-old Black and Tan Coonhound homozygous for F13A1 c.1234_1239delinsTCAA in
    exon 11, a private variant among 3,023 sequenced dogs, predicting a frameshift at
    residue 412, loss of 43% of the protein and probable nonsense-mediated decay, with
    5% plasma FXIII activity. Graded MODEL_ORGANISM throughout per CLAUDE.md, since a
    veterinary observation in a non-human mammal is animal evidence however carefully
    the individual was worked up. Three modeled_mechanisms links with seven evidence
    items: to the preserved-upstream-cascade node (PT, aPTT, thrombin time, fibrinogen
    and every individual factor assay within reference limits - the only non-human
    support in the entry for the diagnostic-trap node), to Mechanically Unstable Fibrin
    Clot (complete clot dissolution within 15 min in 5 M urea, reproducible three weeks
    later; low maximum clot firmness correcting on replacement), and to Accelerated
    Fibrinolytic Dissolution (abnormal 45-minute lysis index correcting on replacement).
    This is the only record in the entry where both arms of the mechanism were measured
    in one individual, which is noted. Limitations recorded rather than smoothed: n=1;
    earlier transient thrombocytopenia and normal fibrinogen bear on interpreting the
    viscoelastic tracings; the two arms are distinguishable in those tracings but were
    not independently manipulated, unlike the ferret experiments on the node itself;
    and the dog received tranexamic acid alongside blood products, so the correction is
    not attributable to FXIII repletion alone. The record is curated as the second
    reported canine case and the first genetic characterisation in a companion animal,
    which is what the report claims - not as the first canine description.

    Entry now has 4 animal records (3 mouse lines, 1 canine), 144 evidence items (up
    from 137), and 21 of 21 causal edges either cited or described.


  summary: 'Create: Factor XIII A Subunit Deficiency'
  details: |
    Created kb/disorders/Factor_XIII_A_Subunit_Deficiency.yaml for MONDO:0013187
    (factor XIII, A subunit, deficiency of), closing the claim issue #11604 and
    deleting stubs/Factor_XIII_A_Subunit_Deficiency_Of.yaml.

    Lump/split call: DISEASE. Three boundaries settled explicitly and recorded in
    the entry notes. (1) F13B (B-subunit) deficiency is a separate disease, not a
    subtype: different gene (HGNC:3534 vs HGNC:3531, both resolved from the HGNC
    REST API during curation), loss of carriage rather than catalysis, milder
    phenotype with on-demand rather than mandatory prophylaxis, and recombinant
    FXIII-A2 is not indicated in it. Curated as a differential diagnosis, with
    MONDO:0013190 and the shared parent MONDO:0018029 named as the future grouping
    anchor. (2) Severity tiers were curated as a quantitative activity axis
    (interpretation_bands on the plasma FXIII activity biochemical record), not as
    has_subtypes, because genotype does not predict phenotype in this disease and
    the same numbers serve as both severity descriptions and treatment targets.
    (3) Acquired (autoantibody-mediated or consumptive) FXIII deficiency is a
    different disease, curated as a differential diagnosis (MONDO:0021133), not
    folded in.

    Pathograph: 9 nodes, each with biological_scale, fully connected except the two
    intended roots. The chain runs from biallelic F13A1 loss of function to delayed
    bleeding through three substrate-specific branches (fibrin chains,
    alpha-2-antiplasmin, extracellular matrix), with the mechanical and fibrinolytic
    arms modelled as separate nodes because a ferret embolism model (PMID:9892598)
    can block one without the other. An "Intact Thrombin Generation and Fibrin
    Polymerisation Upstream of Cross-Linking" node with no upstream cause carries
    the diagnostic trap structurally; it is mirrored by a biochemical record
    (Routine coagulation screen, presence NORMAL) and by two definitions records
    (the laboratory diagnostic sequence, and the insensitivity of the clot
    solubility screen). 10 phenotypes with HP bindings, all connected to the
    pathograph.

    Deep research took three runs and the first two produced nothing. `just
    research-disorder falcon Factor_XIII_A_Subunit_Deficiency` failed with HTTP
    402 (the Edison account is out of credits, although `deep-research-client
    providers --check` reports falcon's credentials as OK, so the health probe
    does not catch this). The run was repeated once with `just dr_fallback='--
    fallback' research-disorder falcon ...` as the skill directs, so that a
    substitution would be recorded in the report's own frontmatter rather than
    in prose; that run fell back to openscientist, whose job
    d1ead1d1-e15e-4f88-a448-3d2147fd8480 timed out after 3600s and was
    cancelled, and the chain then stopped because the openscientist failure was
    a ValueError that cannot carry the trail. A third run, `just dr_fallback='--
    fallback' research-disorder claude_code Factor_XIII_A_Subunit_Deficiency`,
    completed in 401s and produced the single committed report,
    research/Factor_XIII_A_Subunit_Deficiency-deep-research-claude_code.md plus
    its citations sidecar. The report's frontmatter records provider
    claude_code, 20 web searches, 30 turns and a template_sha, so the provenance
    is in the file rather than only here. Its reference_validation block reports
    23/23 references resolved with one unsupported quote (PMID:11816711, where a
    Reactome pathway title was quoted as if it were a finding), and
    term_validation reports one apparent mislabelling of MONDO:0013187; that is
    a parsing artifact of the report's own evidence-gap list, which flags a
    discrepancy between MONDO:0013187 and MONDO:0018029. The discrepancy is not
    an error - those are the A-subunit disease and its parent grouping - and
    both labels were read directly from ols:mondo during curation. just
    preflight-dr returned WARN for F13B being mentioned at 39% of F13A1's rate,
    which is expected here because the entry deliberately argues the F13B
    boundary.

    The report's causal chain independently reproduced this entry's three-branch
    structure. Two of its leads were chased to primary sources and curated as
    new animal_models entries: PMID:16113836 (excisional wound closure reduced
    15/27/27% at days 4/8/11, 73.23% against 100% closure at day 11, restored to
    90.06% by FXIII concentrate, with delayed re-epithelialisation on histology)
    and PMID:12933578 (an independently derived FXIIIA-KO line whose homozygous
    dams conceive and then die of gestational haemorrhage with placental
    necrosis by day 10, independent of fetal genotype). The second materially
    changes what the entry can claim: the exon-7 deletion line of PMID:12529747
    is fertile, so without this second line there would be no animal support for
    the human pregnancy-loss phenotype, and the limitation text on the first
    line was corrected so that it no longer reads as though no mouse can model
    it. Two leads were not taken: the placental cytotrophoblastic shell and
    Nitabuch's layer detail at gestational weeks 6-8, which the report cites to
    a publisher page with no PMID when a weaker sourced version of the claim is
    already carried from PMID:41583548; and a Swiss Arg77Cys founder-variant
    claim the report itself flags as a search-engine-summarised lead. Both
    decisions are recorded in the entry notes. PMID:32491399, PMID:25263390 and
    PMID:23929307 were fetched during curation but are not cited by the entry,
    so their cache files are deliberately not staged.


    Deliberate omissions, each with the reason recorded in notes: no datasets block
    (`just discover-datasets` returned only two GENE_ONLY mouse ES-cell GAM datasets,
    geo:GSE166381 and geo:GSE166378, rejected at relevance triage as Named Entity
    Confusion); the recurrent-pregnancy-loss phenotype left ontology-unbound because
    HP:0200067 and HP:0005268 both sit outside the PhenotypeTerm enum's HP:0000118
    root (six HPO searches recorded, following the Asherman_Syndrome and
    Thrombophilia precedent); tranexamic acid not curated because no source read
    recommended it for this disease specifically; no environmental block; no
    GeneReviews baseline (PubMed returned no hits on two searches). LOINC codes were
    read from the NLM Clinical Table Search Service because LOINC is not configured
    in conf/oak_config.yaml and so is not covered by just validate-terms.

    Validators run and their results: just validate (schema, terms, references) pass;
    just validate-terms pass; just count-verified-snippets 137/137 verified; just
    check-duplicate-keys pass; just check-entity-refs pass; just check-causal-targets
    pass with no new dangling targets; just check-qualifier-terms pass (no qualifier
    terms); just check-enum-values pass; just check-folded-hyphens pass after fixing
    one finding in this file; just check-snippet-length pass; just check-title-snippets
    pass; just check-snippet-grading pass; just normalize-cache and just
    check-term-cache-integrity pass with no churn; just list-gene-term-mismatches 1
    binding examined, 1 compared against HGNC, 1 named by the entry, 0 findings; just
    validate-disorders (the batched authoritative gate) pass with 137/137 snippets;
    just compliance 91.0% global / 91.3% weighted. Five snippets initially failed
    reference validation because the validator strips bracketed spans that are not
    all-caps abbreviations; they were trimmed to quote text outside those spans and
    the explanations say where a trim starts mid-sentence.

  summary: Connected FOXL2 pathophysiology graph to phenotypes, added Harrison's classifications, prevalence,
    congenital and adolescent POI progression, differential diagnoses, and clinical cohort dataset for
    BPES.
  details: Added FOXL2 (hgnc:1092) and DNA-binding transcription factor activity (GO:0003700) to all four
    pathophysiology nodes, and connected Impaired Periocular Mesenchymal and Eyelid Development and Accelerated
    Ovarian Follicle Depletion in Type I BPES to their downstream clinical phenotypes. Added Harrison's
    classifications (GENETICS_ENVIRONMENT_DISEASE, ENDOCRINOLOGY_METABOLISM), point prevalence (1 in 50,000;
    2.0 per 100,000), congenital onset and adolescent/adult POI progression phases, three differential
    diagnoses ( congenital ptosis, Waardenburg syndrome type 1, Ohdo blepharophimosis syndrome), a 148-patient
    FOXL2 cohort dataset (PMID:31048069), and expanded references.

  details: 'Reviewed Blepharophimosis_Ptosis_and_Epicanthus_Inversus_Syndrome.yaml for issue #14394. Added classifications (OPHTHALMOLOGIC_OTOLARYNGOLOGIC, ENDOCRINOLOGY_METABOLISM), structured prevalence fields (BAND_1_9_PER_100000, measure_type BIRTH_PREVALENCE, rate_per_100000 2.0, PMID:20301499), progression entries covering Congenital onset (HP:0003577), Childhood Eyelid Surgical Window, and Adolescent to Young Adult Ovarian Reserve Decline in BPES Type I (backed by PMID:20301499 and PMID:35574016), directional modifiers on FOXL2 molecular_functions (GO:0003700) and evidence-backed causal edges in pathophysiology, MONDO disease_term bindings on differential diagnoses (Noonan syndrome MONDO:0018997, Ohdo syndrome MONDO:0009753, Waardenburg syndrome type 1 MONDO:0008669), and an entry for hereditary congenital ptosis (PMID:33806295).'

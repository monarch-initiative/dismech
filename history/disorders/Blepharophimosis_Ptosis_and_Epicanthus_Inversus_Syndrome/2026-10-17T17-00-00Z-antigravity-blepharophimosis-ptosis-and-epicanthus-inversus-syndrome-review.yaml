  summary: >-
    Add Harrison's chapter classifications, structured birth prevalence rate,
    congenital/childhood/Type I progression entries, FOXL2 molecular function
    modifiers and causal edge evidence, MONDO differential diagnosis bindings
    plus hereditary congenital ptosis, and reference titles.
  details: >-
    Reviewed Blepharophimosis_Ptosis_and_Epicanthus_Inversus_Syndrome.yaml for
    issue #14394. Added classifications (GENETICS_ENVIRONMENT_DISEASE,
    ENDOCRINOLOGY_METABOLISM), structured prevalence fields (measure_type
    BIRTH_PREVALENCE, prevalence_class BAND_1_9_PER_100000, rate_per_100000 2.0,
    rate_denominator LIVE_BIRTHS, citing PMID:33806295 and PMID:35574016),
    progression entries covering Congenital onset at birth, Early childhood
    (3-5 years surgical window), and Type I adolescence-to-adulthood ovarian
    reserve decline and premature ovarian failure before age 40 years (citing
    PMID:20301614, PMID:33806295, and PMID:35574016), directional modifiers on
    FOXL2 molecular_functions (GO:0003700 DECREASED/ABNORMAL), hgnc:1092 gene
    binding on Variant-class-dependent subtype severity, evidence-backed
    downstream edges in pathophysiology (citing PMID:41555764 with
    INDIRECT_UNKNOWN_INTERMEDIATES and PMID:33796131 with BACKGROUND
    quote_role), MONDO disease_term bindings on differential diagnoses
    (Ohdo syndrome SBBYS type MONDO:0011365, MKB type MONDO:0010477, and Noonan
    syndrome MONDO:0018997) plus an unbound Hereditary congenital ptosis entry
    (PMID:33806295), and top-level reference titles.

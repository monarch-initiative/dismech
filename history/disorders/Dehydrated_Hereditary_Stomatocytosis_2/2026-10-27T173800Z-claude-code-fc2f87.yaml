  details: |
    Addressed ai4c-reviewer changes_requested on PR #15743. Reframed the central cellular node from obligate dehydration to a variant-dependent cation leak / volume dysregulation, with REFUTE items (Fermo 2017 compensatory effects; Allegrini 2022 no obvious dehydration) and a Variable Dehydration KNOWLEDGE_GAP, plus the observed Ca2+ overload. Added the 2015 discovery papers (Glogowska, Andolfo) as the accepted-model and cation-leak/splenomegaly anchors. Re-evidenced the iron-overload phenotype with a KCNN4-inclusive cohort quote (Picard 2019 Haematologica) and renamed it Hyperferritinemia to match HP:0003281; fixed the unsourced near-universal claim in the gap. Added a diagnosis section (reticulocyte-index thresholds, Picard 2021), a Splenomegaly phenotype, incomplete-penetrance note on the genetic row, synonyms (GeneReviews check now proven NO_CHAPTER), treatment evidence with the splenectomy caution attributed to DHS/PIEZO1 experience, split deformability from hemolysis, and a real creation_date. 21 snippets / 0 issues.

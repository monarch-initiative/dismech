  summary: 'Create: Dehydrated Hereditary Stomatocytosis 2 (KCNN4 Gardos channelopathy)'
  details: |
    New Mendelian entry for KCNN4 (type 2) dehydrated hereditary stomatocytosis. Channel gain-of-function -> erythrocyte K+ loss/dehydration -> reduced deformability/hemolysis chain, all snippets exact-verified (11/0). Iron overload recorded as a complication with an INDIRECT_UNKNOWN_INTERMEDIATES edge and a KNOWLEDGE_GAP, because the KCNN4 iron/hepcidin route is not established (the characterised hepatic-iron mechanism is PIEZO1-specific). Deliberately NOT conformed to hepcidin_deficiency_iron_overload for that reason. Deep research via claude_code. Deletes the curated stub.

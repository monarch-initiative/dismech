  details: |
    Phenotype pass. Added Fetal anemia (HP:0025716, fetal onset, severe; KCNN4 infant needing intrauterine transfusion, PMID:30655378), Anisocytosis (HP:0011273) and Anisopoikilocytosis (HP:0004823) from the KCNN4 pedigree rows of the PMID:29713289 review table. Enriched Hemolytic anemia with the 8/12 post-neonatal count, mean hemoglobin, an independent R352H family (PMID:28496185), persistence after splenectomy (PMID:26178367) and the severity range (DOI:10.3389/fphys.2022.918620). Added the iron overload statement to Hyperferritinemia. Removed the frequency from Reticulocytosis and Hyperferritinemia because the source gives group means, not patient counts. Wired Chronic Hemolysis to Fetal anemia. Updated the description (anemia is more marked than in PIEZO1 xerocytosis rather than usually compensated) and added notes on cohort features not split by gene. PubMed, Europe PMC and Crossref were unreachable from the session, so only already-cached references were used. validate, validate-terms, count-verified-snippets (48/48), validate-disorders, check-causal-targets, check-coarse-phenotypes and check-name-collisions all pass.

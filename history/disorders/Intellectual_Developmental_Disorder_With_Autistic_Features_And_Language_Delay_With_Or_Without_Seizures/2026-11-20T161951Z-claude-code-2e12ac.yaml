  details: |
    Addressed all four blocking items, all three suggestions, and a CI failure on PR #18551, in one push. Every quote the reviewer supplied was re-checked against the cache first; all five verified.

    CI failure (test (3.13), check_upward_extrapolating_links_are_caveated). The Tanc2 mouse link declared model_scale MOLECULAR against a target node I had marked biological_scale CELLULAR, a +1 upward extrapolation requiring a caveat. Fixed at the root rather than by adding a caveat alone: mTORC1/2 hyperactivity is a kinase complex's activity state, which CLAUDE.md places at MOLECULAR ('a kinase's activity'), so CELLULAR was my error and the gap was an artefact. A real translational caveat was added to the link as well - no study has measured mTOR activity in patient tissue - so the link is caveated under either scale reading. just model-scale-audit now reports both links ALIGNED; the test passes locally.

    Item 1, the Drosophila claim. The entry asserted 'demonstrated by TANC2 knockdown in Drosophila' on an edge whose only evidence was the ClinGen clinical summary, which says nothing about flies. An uncited claim, and the reviewer was right that the paper behind it (PMID:40110879) was cached and unused. Now cited with the quotable sentence, MODEL_ORGANISM, directness INDIRECT because the fly work tests susceptibility rather than the excitatory-inhibitory mechanism the edge runs through. More importantly the reviewer found a contradicting result in a paper the entry already cited: PMID:31616000 reports no climbing or stress-induced seizure-like behaviour on glial or neuronal knockdown of the homologue. That is now a REFUTE item on the same edge, and the entry description and edge description both say the fly evidence is contested rather than settled. PMID:40110879's human genotype-phenotype split (four null variants giving the severe presentations including DEE, two missense carriers presenting with epilepsy alone) is recorded on the Seizure phenotype, and the genetic notes no longer leave 'missense not modelled' standing without that context.

    Item 2, the spine node. Its only evidence was the KIF1A dense-core-vesicle sentence, which is a different function that already has its own node - the reviewer was right. Replaced with PMID:21068316's actual result, that overexpression of TANC1 or TANC2 increases spine and excitatory synapse density in a manner requiring the PDZ-binding C termini, graded IN_VITRO. That paper was listed under references and never cited. The unsourced modifier: DECREASED was removed from both processes rather than re-sourced: PMID:33976205 reports only unspecified 'synaptic deficits' and never describes a spine phenotype, and the only measured direction in the literature read is an increase on overexpression, the opposite manipulation. The node now asserts that development is disturbed without asserting which way, and says so.

    Item 3, cohort phenotypes above 10%. Nine rows added from the one sentence that reports them with counts - ataxia, strabismus, scoliosis/hyperkyphosis, hypotonia, foot deformities, craniosynostosis, joint hypermobility, chest deformities - plus constipation from a separate sentence that gives its own denominator (8 of 15 with a record). Three bindings needed judgement and each carries its reasoning: the source counts scoliosis with hyperkyphosis, and pectus excavatum with pectus carinatum, so neither pair can be split and the nearest accurate parent is bound (HP:0002650, HP:0000765); the four different foot deformities under one total take HP:0001760 Abnormal foot morphology; and hypotonia takes HP:0001252 rather than HP:0001290 because the source states no distribution. Every term was read from the committed HP cache and checked for enum membership and for coarse-set membership before use.

    Declined with reasons: sleep disturbance appears only as plus/minus marks in a per-patient table with no prose count, so there is nothing to quote and the report's 38% is its own reading of that table; stereotypies, altered gait and autonomic dysfunction are named in the discussion without counts.

    Suggestions taken: the antiseizure snippet now quotes the sentence naming all three agents and nitrazepam is bound (CHEBI:7581); the glutamatergic node's own evidence is now the selective-expansion sentence rather than only the proliferation one; and the zebrafish divergence is PROXY_QUANTITY rather than POPULATION_MISMATCH - the reviewer was right that gene dose is a different quantity, not a different population.

    One consequence recorded in notes rather than hidden: adding nine honestly-unexplained rows dropped phenotype connectivity from 1 of 7 to 1 of 16. That is the correct outcome. None of the cohort features has a mechanism proposed by any source, and wiring them to the imbalance node to raise the metric would be exactly the edge CLAUDE.md warns is worse than none. The note says so, so the next reader does not read the low ratio as neglect.

    Validation: just validate, just validate-terms, just count-verified-snippets (52/52), just validate-disorders (52 snippets, 54 titles, 0 issues), the previously failing pytest case now passing locally, just model-scale-audit (2/2 ALIGNED), plus check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-duplicate-keys, check-enum-values, check-logical-rules, check-block-scalar-comments, check-cache-order and check-name-collisions.

  summary: 'Fix CI: ground TANC2 on the node it lands on'
  details: |
    The 'Check for newly ungrounded genes' gate (just check-gene-activity-grounding) fails on this entry: the TANC2 gene descriptor sat on the variant node, which named no molecular function. Found by running the gate after the same mistake turned the approved sibling PR #18548 red. All three entries in this batch had it.

    TANC2 is the awkward case of the three because it has no catalytic activity. CLAUDE.md offers a baseline exemption for a node with genuinely no single molecular function, and that was not taken, because the sources name the function in words GO has a term for: PMID:33976205 calls Tanc2 'an adaptor/scaffolding protein' and 'a large (~200 kDa) multi-domain adaptor/scaffolding protein'. GO:0060090 molecular adaptor activity is bound with modifier LOSS_OF_FUNCTION and the postsynaptic specificity in preferred_term. GO:0140378 protein complex scaffold activity was the alternative and was rejected because 'adaptor' is the word the cited papers use. The reasoning is recorded in the entry notes so the next curator does not read the generic term as laziness.

    This push also dismisses the approval that PR #18551 received at 16507824, which is the cost of a required check that this diff would have turned red.

    Validation: just validate, just validate-terms, just check-logical-rules, just check-gene-activity-grounding (now OK) and just validate-disorders (0 issues).

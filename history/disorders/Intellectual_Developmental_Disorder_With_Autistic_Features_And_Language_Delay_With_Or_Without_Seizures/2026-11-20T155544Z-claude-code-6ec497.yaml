  summary: 'Create: IDDALDS (MONDO:0030051, TANC2)'
  details: |
    De novo curation of IDDALDS from an OpenScientist deep-research report plus the primary literature ClinGen's gene-validity record names. just preflight-dr returned PASS (TANC2 mentioned 113 times, OMIM 618906 matching MONDO's xref).

    Name. The entry keeps the MONDO/OMIM descriptive title rather than a dyad, decided by checking all five establishment routes in the entry-naming skill rather than by preference. MONDO:0030051's only exact synonyms are 'IDDALDS' and casing variants of the descriptive label (OLS, 2026-11-20); there is no GeneReviews chapter; ClinGen's own disease name is the descriptive label; OMIM 618906 carries it; and the primary literature describes rather than names the entity. So rule 2 does not license a gene-related name and rule 7 applies: keep a clear existing name, do not coin a dyad. The scope-test tension is real and is recorded in notes rather than resolved by inventing a name. 'TANC2-related neurodevelopmental disorder' is kept as a synonym, explicitly as dismech's phrasing.

    Mechanism. Haploinsufficiency acting through mTOR: TANC2 binds and inhibits mTOR; the haploinsufficient mouse (the human genotype) shows mTORC1/2 hyperactivity with synaptic and behavioural deficits that rapamycin reverses, and the inhibition is demonstrated in human neural progenitor cells and neurons, not mouse alone. Downstream the zebrafish knockout expands the glutamatergic population selectively, which is the excitatory/inhibitory imbalance, and that is wired to seizures. The KIF1A dense-core-vesicle capture function is curated as a parallel branch with no outgoing edge, because nothing in the sources connects it to a specific clinical feature.

    Steps deliberately not wired: the route from excitatory/inhibitory imbalance to the cognitive, language and social phenotype is inferred from parallel animal behaviour rather than human neurophysiology, so no edge is drawn to the intellectual disability, language or autism rows.

    Three errors of mine that gates or source checks caught, recorded because each is a class worth watching:
    1. I wrote two model-organism gene IDs from memory. Both were wrong: ZFIN:ZDB-GENE-060526-168 resolves to si:ch211-286d8.1, a different gene, and MGI:2140304 did not resolve at all. Re-resolved properly via NCBI Gene (mouse Tanc2 = NCBIGene:77097 -> MGI:2444121; zebrafish = NCBIGene:568810 -> ZFIN:ZDB-GENE-060130-180) and confirmed each symbol at the Alliance. Note ZFIN's official symbol is tanc2a, the paralogue-suffixed form, where the paper says tanc2; the paper's name is in preferred_term and ZFIN's in label, with the reason in the model's notes.
    2. I quoted the KIF1A paper's TITLE as an evidence snippet in two places. The reference validator rejected both. Replaced with real body sentences, one of which is stronger than what I had: patient-derived TANC2 mutations abolish the KIF1A interaction.
    3. I composed the reference_title for PMID:21068316 instead of copying it from the cache. just validate-disorders caught the mismatch; corrected to the cached title.

    The clinical trial row was verified against ClinicalTrials.gov directly rather than taken from the report: NCT01238250 is overallStatus RECRUITING, studyType OBSERVATIONAL, no phases, so NOT_APPLICABLE is correct. It is recorded because the absence of any interventional trial is worth knowing next to the mTOR lead.

    Frequencies are not written into prevalence. The cohort gives 19/20, 18/20, 15/20 and 11/20, and all 19 HPO annotations for OMIM:618906 trace to that one series, so those are proportions in an ascertained cohort rather than population frequencies; they are described in the phenotype rows and the single-cohort denominator is carried as a KNOWLEDGE_GAP.

    Terms: the report's term validation recorded 8 of 84 labels mismatched, and as with the FARIMPD report in this same batch every NCIT term it proposed was wrong, including NCIT:C15346 offered as 'Occupational therapy' and 'Physical therapy' - the same identifier (actually Vaccination) that the FARIMPD report offered for 'Physical therapy'. None used. GO TOR terms were resolved against OLS.

    Validation: just validate, just validate-terms, just count-verified-snippets (39/39), just validate-disorders (39 snippets, 41 titles, 0 issues), check-gene-namespaces-online (both MOD rows cached and correctly labelled), plus check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-duplicate-keys, check-enum-values, check-logical-rules, check-block-scalar-comments, check-cache-order, check-name-collisions and check-genereviews (verified NO_CHAPTER with synonyms present).

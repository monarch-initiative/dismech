  details: |
    De novo curation of MONDO:0014547, biallelic NARS2 mitochondrial asparaginyl-tRNA synthetase deficiency. Deep research: one OpenScientist run, reference validation 13/13 resolved, term validation needs_review with one unresolved term HP:0007303 which is not bound. The run's four reported label mismatches are a parsing artifact rather than real mis-bindings: the report presents phenotypes in a table whose notes column the validator read as the term name, so HP:0000407 appears named 'Cardinal feature; isolated (DFNB94) or with CNS disease'. Recorded in the entry notes because the same artifact could hide a genuine mismatch in a table-heavy report. preflight-dr returned SKIP; MONDO records no causal gene for this term. The lump/split decision was to use no has_subtypes despite a range spanning isolated nonsyndromic hearing loss to lethal infantile encephalopathy, because the founding family has two siblings with the same homozygous allele and different phenotypes and the systematic review found no strong genotype-outcome association; a partition would need evidence nothing published supplies, and that disagreement between the two best sources is curated as a KNOWLEDGE_GAP with both sides cited. Cohort ascertainment is labelled throughout: the neonatal diabetes study screened 397 children already selected for diabetes under 24 months with no known genetic cause, so its 8/8 insulin dependence and 7/8 epilepsy describe that subgroup rather than the disease, and the prevalence record carrying rate_per_100000 states in its notes that the number is a diagnostic yield within a selected cohort and not a population rate. One snippet failed reference validation because the validator strips bracketed spans and the sentence carried bracketed variant nomenclature; it was replaced with a bracket-free sentence and the reason recorded in the evidence explanation rather than by relaxing the matcher. Lactic acidosis is curated with an evidence item that is explicitly background framing about mitochondrial disease as a class, because no source located reports a lactate value in a genotyped NARS2 patient, and the explanation says so. No animal model exists and none is claimed. Validation: just validate 33/33 snippets verified, validate-terms, check-entity-refs, check-causal-targets, check-qualifier-terms, check-duplicate-keys, check-genereviews NO_CHAPTER - all clean.

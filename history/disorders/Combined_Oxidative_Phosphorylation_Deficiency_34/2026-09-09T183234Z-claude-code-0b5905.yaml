  summary: Correct uS7m nomenclature and record DR count caveat (COXPD34)
  details: |
    Follow-up to the creation record in the same session, after the falcon deep-research run
    for this disorder returned.

    Preflight outcome. preflight-dr returns SKIP, because MONDO records no causal gene for
    MONDO:0054741 and the gene-identity check therefore cannot discriminate - which is exactly
    the case this entry exists to resolve. The manual fallback was done instead: MRPS7 is
    mentioned 45 times and dominates the report's gene counts, so the report is on the right
    disease and not a substituted entity. The OMIM warning is benign: the extractor picked up
    611974, which is the MRPS7 *gene* MIM (NCBI Gene 51081), while the report's own text
    correctly states OMIM phenotype 617872 alongside it. The report independently resolved the
    same gene and the same OMIM numbers this entry had resolved from mim2gene_medgen.

    Two things taken from the report.

    First, a correction that is applied. The entry described MRPS7 as 'also written mS7 in the
    standardised mitoribosome nomenclature'. That is wrong: MRPS7 is homologous to bacterial S7
    and is designated uS7m, the 'u' prefix marking a subunit conserved from the bacterial
    ribosome rather than a mitochondria-specific addition. The pathophysiology node name was
    renamed from 'Destabilization of the mS7 Protein of the Mitoribosomal Small Subunit' to
    '... uS7m ...', and the one downstream target pointing at it was updated in the same edit;
    check-entity-refs and check-causal-targets were re-run and are clean.

    Second, a claim that is recorded but not acted on. The report states, from the full text of
    the 2022 paper, that the second family also included a similarly affected sister whose
    genotype was not reported. The abstract is all that was retrievable into the reference
    cache and does not mention her, so this could not be verified against a quotable source.
    It is recorded as a caveat in the prevalence notes rather than folded into the
    denominators, with the observation that if she is real every 'of 3' figure becomes an 'of
    4' with an ungenotyped member and no frequency band changes.

    Nothing else in the entry was changed on the strength of the report; the report's clinical
    and mechanistic account agrees with what was already curated from the primary references.

    Validation after the edit: just validate passed with 42/42 snippets verified,
    check-folded-hyphens, check-duplicate-keys, check-entity-refs and check-causal-targets all
    clean.

  summary: 'Review round 1: narrow three GO bindings, add module conformance, rename
    a node (COXPD34)'
  details: |
    Response to the ai4c-reviewer round on PR #11547.

    Item 1, no deep-research artifact: already addressed. The falcon run returned after the PR was
    opened and landed in commit b82d3e2cb3, before this round. It passed the manual preflight
    fallback (preflight-dr returns SKIP because MONDO records no causal gene for MONDO:0054741 -
    which is the gap this entry fills - and MRPS7 is mentioned 45 times, dominating the report's
    gene counts). That commit also took a correction from it: MRPS7 is uS7m in the standardised
    mitoribosome nomenclature, not mS7.

    Item 2, GO:0000028 over-general: accepted. The node's preferred_term already said
    'mitochondrial small ribosomal subunit assembly' and GO has exactly that term. Rebound to
    GO:0180026. The old binding was the cytosolic-inclusive parent and did claim something broader
    than the mechanism.

    Suggestion 4, GO:0019843: accepted. MRPS7 binds 12S rRNA, which is a small-subunit rRNA, so
    GO:0070181 'small ribosomal subunit rRNA binding' is exactly right and the generic rRNA-binding
    parent was loose. This added one row to cache/go/terms.csv and one to the molecular-function
    enum cache.

    Suggestion 5, GO:0140053 on the combined-deficiency node: accepted, and the reviewer's reading
    is correct - 'mitochondrial gene expression, DECREASED' annotated the upstream cause, which the
    pathograph already models as its own node two steps earlier. Replaced with GO:0022900 'electron
    transport chain', DECREASED, which is what a deficiency of complexes I, III and IV actually is.

    Suggestion 3, module conformance: accepted. The Impaired Oxidative Phosphorylation node now
    declares conforms_to mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress,
    following COXPD48, which conforms its equivalent node to the same target with the same
    GO:0006119 annotation. GO:0006119 was added alongside the existing GO:0042775. Only the
    oxidative-phosphorylation half of the module node's effector state is claimed: the module pairs
    it with rising reactive oxygen species, and no ROS measurement exists in an MRPS7 patient, so
    asserting it would import a claim from the module rather than from this disease. That is stated
    in the node description and in the entry notes.

    Suggestion 6, node names that bundle: partly accepted. 'Impaired Oxidative Phosphorylation and
    Cytosolic Redox Shift' was renamed to 'Impaired Oxidative Phosphorylation' - the redox shift is
    already its own downstream node, so the old name was redundant with the node it points at. Its
    one incoming downstream target was updated in the same edit and check-entity-refs and
    check-causal-targets re-run clean. 'Reduced 12S rRNA and Impaired Small Subunit Assembly' is
    kept, and the entry notes now say why: the two are one claim, since 12S rRNA transcript level is
    the measurement that was made and small-subunit assembly is what it stands for. Naming it for
    the assembly alone would assert a measurement nobody made; naming it for the rRNA alone would
    lose the mechanism.

    Validation after the edits: just validate passed with 42/42 snippets verified;
    check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values,
    check-qualifier-terms and check-folded-hyphens all clean. One new term-cache row and one new
    enum-cache row, both for GO:0070181.

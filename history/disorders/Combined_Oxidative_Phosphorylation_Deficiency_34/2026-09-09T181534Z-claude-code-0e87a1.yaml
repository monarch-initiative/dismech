  summary: 'Create: Combined Oxidative Phosphorylation Deficiency 34 (MONDO:0054741,
    MRPS7)'
  details: |
    De novo curation of COXPD34 (MONDO:0054741), the MRPS7-related combined oxidative
    phosphorylation deficiency, as a standalone kb/disorders entry.

    Gene resolution. Neither MONDO nor the curation stub records a causal gene for
    MONDO:0054741. Resolved through the OMIM exact match: MONDO:0054741 -> OMIM:617872 ->
    NCBI Gene 51081 in mim2gene_medgen -> MRPS7, hgnc:14499. Corroborated by the founding
    paper's own title (PMID:25556185) and by the ClinGen gene-validity record. Note the HGNC
    id is 14499 and not 14508, which is MRPS22 - a different mitoribosomal small-subunit gene
    already curated in this repository.

    Lump/split decision. entry_type DISEASE, standalone, consistent with the rest of the
    numbered COXPD series (defects 4, 7, 13, 21, 23, 26, 30; deficiencies 42, 48, 51). The
    stub is deleted because MONDO:0054741 is now bound by this entry's disease_term.

    The real nosological question, and how it is handled. MRPS7 is already curated as a
    causative gene in Perrault_Syndrome, on the strength of the same two publications. All
    three published MRPS7 patients are female with sensorineural hearing loss, and the two who
    reached reproductive age both have premature ovarian insufficiency - that is Perrault
    syndrome in two of three. What distinguishes the OMIM 617872 phenotype is the hepatorenal
    failure of the severely affected sister, who died in early adolescence before a
    reproductive phenotype could be ascertained. This entry models the hepatorenal,
    lactic-acidemic presentation, records the ovarian phenotype because two of three patients
    have it, and points at Perrault_Syndrome rather than re-curating the Perrault phenotype -
    which is the same convention Perrault_Syndrome itself uses for its other pleiotropic genes
    (TWNK, HSD17B4, PEX6). An OPEN_QUESTION discussion records that the two entities may be one
    disease seen at two ages, and says why three patients cannot settle it.

    Evidence strength, stated rather than smoothed over. ClinGen's Mitochondrial Diseases
    expert panel classifies MRPS7 against mitochondrial disease as Limited (17 June 2024), and
    NCBI's mim2gene_medgen record for MIM 617872 carries the comment 'question', OMIM's marker
    for a provisional gene-phenotype relationship. Two independent resources agree this is a
    weakly established entity. Neither is cited as an evidence item: the ClinGen assertion is
    absent from the ClinGen snapshot pinned in data/clingen/MANIFEST.yaml, and 'just
    clingen-refresh' fails on checksum drift, so building a cache file would require a manifest
    repin - a separate change from curating a disease. Both facts are recorded in the genetic
    notes with their sources named, and both were read directly from the respective downloads.

    Evidence base. Three references. PMID:25556185 is the 2015 founding report (abstract only)
    and carries all of the functional evidence in the entity - impaired mitochondrial protein
    synthesis by pulse labelling, reduced 12S rRNA, and complementation rescue of complex I and
    complex IV activities and of the 12S rRNA level. PMID:36421788 is the 2022 second family.
    PMID:38855161 is a mechanism review supplying mitoribosome composition and the general rule
    for mitoribosomal-protein disease. All three were already cached or newly fetched with just
    fetch-reference; none was hand-edited.

    Frequency discipline. Denominators are two and three and every band carries its numerator.
    Hepatic failure and renal insufficiency are FREQUENT on 1 of 2 siblings, not OCCASIONAL on
    1 of 3, and the notes say which denominator is used and why. Premature ovarian
    insufficiency is FREQUENT on 2 of 3 with an explicit note that it is 2 of 2 among those who
    reached reproductive age. Hashimoto thyroiditis is OCCASIONAL and is the one phenotype
    deliberately left unwired: nothing connects autoimmune thyroid disease to the OXPHOS defect,
    and its notes say so.

    Pathograph. Ten nodes, from biallelic variant through mS7 destabilisation, 12S rRNA loss and
    small-subunit assembly failure, impaired mitochondrial translation and combined complex
    I/III/IV deficiency, to four tissue-level failure nodes. A scripted diff of every downstream
    target against node and phenotype names returned zero dangling targets and one deliberately
    unwired phenotype (Hashimoto thyroiditis).

    Honest limits recorded in the entry. Complex III is deficient but is not among the
    activities the complementation rescued, and the source does not say whether it was assayed -
    recorded in both the node and the phenotype rather than glossed. The 2022 alleles have no
    functional data at all and were called pathogenic on in-silico prediction; that is the
    KNOWLEDGE_GAP discussion and the reason for the Limited classification. No animal model, no
    dataset, no prevalence rate, no treatment evidence, no residual-activity percentages.

    Validation. just validate (schema, terms, references) passed with 42/42 snippets verified
    against cached references and no prefix skips. check-entity-refs, check-duplicate-keys,
    check-causal-targets, check-enum-values, check-qualifier-terms clean.

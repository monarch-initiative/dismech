  summary: Apply review round 1 (#13491)
  details: |
    Review round 1 on PR #13491, blocking finding 1. The transmission notes: field and the original history record both described PMID:5666684 and PMID:7003996 as the two older papers specifically on rhinoscleroma transmission mechanisms. Only PMID:5666684 is: Krasilnikov 1968, 'Mechanisms of the transmission of rhinoscleroma infection'. PMID:7003996 is Somov 1980, a psychrophilic-properties paper about Yersinia pseudotuberculosis and Far East scarlatina-like fever, fetched during the Far_East_Scarlet_Like_Fever work and listed under this entry in error. As written the note asserted a two-paper search of the rhinoscleroma transmission literature that half happened, which is the unverified-negative-claim pattern CLAUDE.md warns about. Fixed by rewriting the note to name one paper, naming the PubMed query so it is re-runnable, and recording two false friends that query returns: PMID:390072 is a transmission electron microscopy study, and PMID:3950479 measures serum immunoglobulin in rhinoscleroma contacts rather than their infection. The query was re-run before committing and returns exactly one paper on the mechanism. PMID:3950479 was fetched during this round and also cached with no quotable text. references_cache/PMID_7003996.md and references_cache/PMID_3950479.md were deleted, since nothing in kb/ cites either. The original history record's details was corrected in place and records the correction. Validation: just validate passed; snippets verified; MISSING_TRANSMISSION stays cleared.

  details: |
    Added a transmission: block with a single route, per rule R25 of design decisions 3e: prolonged exposure in crowded, low-hygiene endemic settings (PMID:31529285 newly fetched, PMID:29381692, PMID:29578083, PMID:18947330). The block carries a notes: field recording that the precise portal of entry into the nasal mucosa is not established by the cited sources, and that the one paper addressing the transmission mechanism directly, Krasilnikov 1968 (PMID:5666684), was fetched and returned no quotable text, so no inhalational or direct-inoculation route is asserted. (Corrected in review round 1: this record and the entry note originally also named PMID:7003996 as a second rhinoscleroma transmission paper. It is not one - it is a Yersinia/FESLF paper fetched during the Far_East_Scarlet_Like_Fever work and listed here in error. See the review-round record alongside this one.) Household clustering was deliberately not asserted as transmission: the French national series reporting familial cases attributes them to genetic control of the host response, not to household spread. Validation: just validate passed; snippets verified; included in the ten-file just validate-disorders batch (0 issues). MISSING_TRANSMISSION cleared.

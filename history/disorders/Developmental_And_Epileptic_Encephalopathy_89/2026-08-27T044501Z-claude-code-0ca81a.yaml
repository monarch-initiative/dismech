  summary: 'Review round 3: curate the published mechanistic objection to vigabatrin'
  details: |
    Review round 3 on PR #9587. The single blocking finding addressed.

    IMPORTANT - the Vigabatrin section stated its rationale with no counterweight,
    while references_cache/PMID_37029735.md is a full_text_xml cache carrying a
    direct mechanistic argument against the drug. Curated both sides:

    - A `supports: REFUTE` evidence item on the vigabatrin `target_mechanisms` link,
      quoting "it seems that prescribing vigabatrin for patients with GAD1 deficiency
      is not a suitable solution, at least for mutations that result in severe
      reduction or complete loss of the enzyme function." The `treatment_effect` stays
      RESTORES, because that is the mechanism the drug is chosen for; the REFUTE item
      records that the intent is disputed on mechanistic grounds, and the explanation
      says so explicitly rather than leaving the reader to reconcile them.
    - A second `supports: REFUTE` item on the treatment itself, quoting the clinical
      counterweight: two treated patients continued to have seizures on the
      vigabatrin-plus-ketogenic-diet combination.
    - The treatment description rewritten to state the objection and to say why
      neither side settles the matter - the objection is an inference from the
      mechanism, the response rate is an observation.
    - The combination-therapy KNOWLEDGE_GAP rationale extended with the
      genotype-stratified form of the objection ("at least for mutations that result
      in severe reduction or complete loss"), which is the same residual-activity
      axis the allelic gap in this entry already asks about, plus the authors'
      alternative proposal of brain-penetrant GABA derivatives. Both carry their own
      evidence items, and a new proposed experiment
      (exp_dee89_vigabatrin_response_by_residual_activity) tests the prediction.

    Suggestions 1-3 in the review were explicitly non-blocking and are unchanged;
    reasons restated in the PR comment.

    Correction to my own round-2 PR comment: I wrote "10 nodes, 11 edges" there. The
    measured count is 10 nodes and 10 edges. The graph shape was as described - the
    seizure-independent edge from GABA Depletion to Developmental Encephalopathy is
    present, giving that node two incoming edges - but the edge total was asserted
    rather than measured, and was wrong.


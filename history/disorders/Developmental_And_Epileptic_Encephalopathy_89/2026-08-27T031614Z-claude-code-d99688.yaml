  summary: 'Review round 1: widen seizure onset window, add semiologies, back the
    encephalopathy claim'
  details: |
    Review round 1 on PR #9587. Addressed all three blocking IMPORTANT findings from
    the ai4c-reviewer review, plus four of the five 🔵 suggestions.

    IMPORTANT 1 - `frequency: OBLIGATE` on HP:0032807 Neonatal seizure was a
    disease-wide claim carried by one cohort's denominator, and two other cached
    sources say onset runs to six months. Split into two phenotypes: a new generic
    HP:0001250 Seizure at OBLIGATE, carried by the literature-review sentence "All of
    the reported patients manifested seizures."; and the neonatal-onset phenotype
    downgraded to FREQUENT with an explanation stating the derived lower bound (ten
    first-month-onset patients against a published literature of roughly nineteen)
    and a second PARTIAL evidence item recording the bound that prevents a higher
    band. The pathophysiology node was renamed Neonatal-Onset Epileptic Seizures ->
    Early-Onset Epileptic Seizures (with its downstream, modeled_mechanisms and
    discussions.attaches_to references updated), and the top-level description and
    node description were rewritten to state the birth-to-six-months window.

    IMPORTANT 2 - Added HP:0011153 Focal motor seizure and HP:0002069 Bilateral
    tonic-clonic seizure, both quoting the semiology sentence from PMID:37029735.

    IMPORTANT 3 - The Developmental Encephalopathy node's "non-ambulant and without
    speech" claim had no attached snippet. Reworded the description to match the
    source exactly (all but one patient severe-to-profound and bed-confined; the
    exception had moderate ID and was ambulant) and attached the supporting
    literature-review sentence from PMID:37029735.

    Suggestions taken: HP:0001344 Absent speech, HP:0001257 Spasticity, HP:0002059
    Cerebral atrophy and HP:0002119 Ventriculomegaly added, all as single-patient
    observations from the 2023 index case with no frequency band asserted;
    GO:0060021 roof of mouth development added to both nodes of the palatal arm;
    CHEBI:63638 vigabatrin bound as therapeutic_agent on the combination treatment;
    and a COMPUTATIONAL evidence item added to the genetic section locating a
    reported missense allele in the PLP-binding domain.

    Suggestions not taken, with reasons given in the PR comment: the primary von
    Hardenberg letter (PMID:33146701) caches as content_type "unavailable" with an
    empty body, so nothing in it can be quoted - the Reply remains the only citable
    source for that patient; and the Orofacial and Ventral Wall Malformation node was
    left lumped, which the reviewer had already judged defensible.


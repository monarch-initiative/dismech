- type: EDIT
  outcome: changed
  summary: Regrade three PMID:33169137 items to OTHER; join combined therapy to pathograph
  details: |
    Review finding: three evidence items citing PMID:33169137 were graded
    HUMAN_CLINICAL but quote no patient data. Two carry the authors' mechanistic
    rationale for combining vigabatrin with a ketogenic diet; one is methodological
    caution about drawing conclusions from a single observation. All three regraded
    to OTHER (expert reasoning without data).

    The other four items citing the same reply are correctly HUMAN_CLINICAL - they
    quote patient observations - so the paper was mixing evidence types without the
    split. The entry already performs exactly that split for PMID:37029735, where
    literature-summary sentences are OTHER, index-patient observations are
    HUMAN_CLINICAL and an MD-simulation inference is COMPUTATIONAL; this was an
    internal inconsistency rather than a misunderstanding of the field.

    Verified each of the three by snippet content before editing rather than by the
    line numbers in the review, which point at the reference: line rather than the
    evidence_source: line three below it.

    Also took the disconnected-leaf suggestion: Early Combined Vigabatrin and
    Ketogenic Diet had no target_mechanisms while both single agents link into the
    pathograph. Added a MITIGATES link to GABA Depletion, evidenced by the same
    rationale sentence, graded OTHER and PARTIAL since no measurement of GABA in
    treated patients is reported.

    Individualized Antiseizure Medication is deliberately left unlinked: it is
    generic supportive care with no specific mechanism target, and linking it would
    pad the connectivity metric rather than model anything.

    Snippets 75/75 -> 76/76. No cache row added.

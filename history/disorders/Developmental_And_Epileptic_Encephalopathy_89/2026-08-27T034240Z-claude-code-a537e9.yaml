  summary: 'Review round 2: evidence the onset window, give the developmental arm
    a seizure-independent route'
  details: |
    Review round 2 on PR #9587. Both blocking findings addressed.

    IMPORTANT A - the "birth to six months" onset window was asserted in the
    description, the seizure node and two evidence explanations while no snippet
    stated it, and it was the justification for banding HP:0032807 at FREQUENT. The
    PARTIAL evidence item that was meant to carry it quoted the semiology clause
    while its explanation described the onset clause. Fixed by quoting the onset
    sentence itself, extracted byte-for-byte from references_cache/PMID_37029735.md
    rather than retyped: it contains a U+2010 HYPHEN in "age-onset" and a U+2009 THIN
    SPACE before "months", both preserved. The same snippet was also added to the
    Early-Onset Epileptic Seizures node so the node's own description of the window
    is backed rather than inherited from a phenotype block. The band stays FREQUENT;
    it now rests on a quoted sentence.

    IMPORTANT B - Developmental Encephalopathy had exactly one incoming edge, from
    the seizure node, so the graph derived every developmental consequence from the
    seizures and contradicted the entry's own "developmental and epileptic" framing.
    Added a second incoming edge from GABA Depletion with
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES and its own two evidence items -
    the Neuray sentence naming seizure induction and neuronal development as separate
    GAD1 roles, and the Khorram sentence on GAD67's embryonic role in neuronal
    development and synaptogenesis. The unknown-intermediates marking is the real
    epistemic state: no published work separates the developmental from the
    seizure-driven contribution. The top-level description was extended to say so.

    Suggestions taken: the mortality figure in the description now carries its
    denominator ("four of the eleven patients of the founding cohort") instead of
    "roughly a third of reported patients"; refractoriness is recorded on the seizure
    node with the "in others, epilepsy remained uncontrolled" sentence; and the
    previously ungrounded Reduced Fetal Movement and Joint Contractures node now
    carries UBERON:0000982 skeletal joint.

    Suggestions not taken, with reasons given in the PR comment: HP:0001558 Decreased
    fetal movement was not added, because no cached source records decreased fetal
    movement as an observation in these patients - the fetal-akinesia route is an
    inference already marked INDIRECT_UNKNOWN_INTERMEDIATES, and binding a patient
    phenotype term would assert an observation nobody made. Refractory epilepsy was
    not added as a phenotype because HPO has no drug-resistant-epilepsy term
    reachable through the configured adapter. evidence_source OTHER on the Khorram
    literature-summary sentences was kept, following the convention in
    kb/modules/epilepsy_excitation_inhibition_imbalance.yaml.


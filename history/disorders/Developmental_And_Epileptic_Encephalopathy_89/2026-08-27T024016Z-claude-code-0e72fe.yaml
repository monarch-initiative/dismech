  summary: 'Create: Developmental and Epileptic Encephalopathy 89 (GAD1/GAD67)'
  details: |
    De novo creation of the DEE 89 (GAD1 / GAD67) entry from the stub
    stubs/Developmental_And_Epileptic_Encephalopathy_89.yaml, closing issue #9578.

    Entry-type decision: Disease. The stub carries no mondo_descendant_count, and
    `runoak -i sqlite:obo:mondo info MONDO:0030856 -O obo` shows a leaf term with a
    single RO:0004003 causal-gene relationship to HGNC:4092 (GAD1) and an
    OMIM:619124 xref. Not a grouping, not a subtype of an existing entry.

    Curated from primary literature: PMID:32282878 (Chatron 2020, founding cohort of
    11 patients), PMID:32705143 (Neuray 2020, six further families), PMID:37029735
    (Khorram 2023, novel variant plus assembled literature review), PMID:33169137
    (Chatron/Weckhuysen reply carrying the vigabatrin response rate and the
    combination-therapy case), PMID:9177246 (Asada 1997 Gad1-null mouse) and
    PMID:37830095 (Gad1-null rat).

    Mechanism model: a single trigger node (biallelic GAD1 loss of function) running
    through GAD67 enzyme deficiency to a GABA-depletion branch point, from which two
    arms separate - the neural arm conforming to three nodes of
    kb/modules/epilepsy_excitation_inhibition_imbalance.yaml
    (#Excitation-Inhibition Imbalance, #Neuronal Hyperexcitability and Hypersynchrony,
    #Recurrent Unprovoked Seizures), and a non-neuronal developmental arm covering
    cleft palate/omphalocele and the fetal-akinesia contractures. Content is
    duplicated into the conforming nodes rather than inherited, per the conformance
    convention. 10 pathophysiology nodes, 9 edges, one root, no unreachable node.

    Deliberately not curated: no `subtypes` split on the missense-versus-truncating
    allelic pattern (missense-variant patients had no cleft palate or omphalocele),
    because that rests on a small number of published case reports with no
    residual-activity measurements; it is recorded as a KNOWLEDGE_GAP discussion
    instead. No phenotype frequency bands beyond OBLIGATE for neonatal seizures (all
    10 evaluable founding-cohort patients), because the denominators in the other
    reports are not stated per phenotype. No `prevalence.rate_per_100000` - only
    CASES_IN_LITERATURE with ULTRA_RARE.


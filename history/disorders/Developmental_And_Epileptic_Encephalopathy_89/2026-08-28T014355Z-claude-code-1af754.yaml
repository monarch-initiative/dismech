- type: EDIT
  outcome: changed
  summary: Fix two schema errors introduced by the previous fix
  details: |
    Two CRITICAL schema errors, both introduced by my own previous commit.

    1. treatment_effect: MITIGATES is not a permissible value. The enum is
    INHIBITS/ACTIVATES/MODULATES/BYPASSES/RESTORES. I wrote the value without
    reading the enum. Corrected to RESTORES, chosen after reading the schema
    definitions and checking the two single-agent treatments, which both use
    RESTORES against this same GABA Depletion node - so the combination is now
    internally consistent with its own components rather than typed on a guess.

    2. The target_mechanisms: block was inserted between the treatment's two
    evidence items, so YAML parsed the second item as a target_mechanisms element.
    That detached the caution evidence ("one should be cautious drawing conclusions
    from one single observation") which is the counterweight the treatment's own
    description leans on. Reordered so both evidence items sit under evidence: and
    target_mechanisms follows the list.

    Why the previous round missed it: I ran the gates and grepped their output with
    tail -3, which discarded the [ERROR] lines and showed only the trailing summary.
    Both validate and validate-disorders had in fact printed all three errors and
    exited 1. Verified this round by exit code rather than by grepping output.

    Also note count-verified-snippets walks every snippet: regardless of container,
    so the displaced evidence item still verified 76/76 - it cannot detect this
    class of defect. Only schema validation can.

    All gates re-run and confirmed by exit code: validate, validate-disorders,
    check-duplicate-keys, check-cache-order, check-term-cache-integrity,
    check-title-snippets, check-environmental-evidence, check_snippet_length,
    check_folded_hyphens - all exit 0. Snippets 76/76. Rebased to 0 behind main.

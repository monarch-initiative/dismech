  summary: Phenotype review of GAD1-related DEE89
  details: |
    Reviewed all 20 existing phenotypes against both full 2020 cohorts, the 2023 case and model sources. Added 35 case-scoped findings, corrected onset denominators and developmental severity, represented seizure and central motor manifestations, a provisional CNS/fetal-movement structural route, and swallowing-related aspiration sequelae. EEG findings are readouts; renal, sensory, imaging and additional structural attribution remain explicit gaps. Regenerated primary source caches and added CNS-specific Gad1 mouse evidence; preserved historical authorship.

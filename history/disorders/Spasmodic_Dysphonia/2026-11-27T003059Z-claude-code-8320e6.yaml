  summary: 'Address review: split GNAL and cortical inhibition into own nodes, drop
    unsupported bindings'
  details: |
    GNAL was removed from the Cortico-Basal Ganglia Motor Network Dysfunction node (genes, GO:0003925 molecular function, GO:0007186 process and the GNAL sentence in the description and evidence) and placed in a new upstream node, GNAL Loss-of-Function Variant (rare monogenic), with germline heterozygous loss-of-function genetic_context and a downstream edge to the network node. The laryngeal dystonia GNAL variant (p.V234I) was only predicted damaging, so the loss-of-function claim rests on receptor-coupling assays of other GNAL dystonia variants (PMID:23222958, added to references) and is marked directness INDIRECT. Reduced cortical inhibition (TMS cortical silent period, PMID:24333913, GO:0007214) moved from the network node to its own node, Reduced Cortical Inhibition, with an edge to Laryngeal Motor Unit Hyperactivity. The unevidenced Voice Therapy target_mechanisms link to Laryngeal Motor Unit Hyperactivity was removed. Iron was rebound from CHEBI:29033 iron(2+) to CHEBI:18248 iron atom because QSM does not resolve oxidation state. GO:0095500 acetylcholine receptor signaling pathway INCREASED was removed from Laryngeal Motor Unit Hyperactivity, since endplate transmission is the botulinum toxin site of action and not shown to be increased. CL:0000617 was removed from Impaired Sensorimotor Integration and a note records why GO:0007600 is generic. The Strained-strangled voice phenotype keeps HP:0001609 Hoarse voice with a note recording the OLS HPO searches (strained, strangled; descendants of HP:0001608) that found no closer term. Duplicate node-level evidence (PMID:40370031 iron sentence, PMID:20194686 network sentence) already present on downstream edges was removed. Laryngeal dystonia gained a MIDDLE_AGE onset descriptor and female-predominance evidence (PMID:28850801, PMID:32861505).

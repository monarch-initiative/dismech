  summary: 'LOINC tranche G: factor VIII activity severity bands'
  details: |
    Bound LOINC:3209-4 (one-stage coagulation assay) as the Factor VIII Activity biochemical marker's loinc_term, since LOINC carries no method-less identity code for this analyte (every factor VIII activity code names a method); the chromogenic alternative LOINC:3210-2 is named in notes but deliberately not bound, to avoid implying the two are interchangeable identities given the entry's own existing discussion of one-stage/chromogenic assay discrepancy. Added a reference_ranges block with the Severe (<1%) / Moderate (1-5%) / Mild (5-40%) severity bands (PMID:32329553: 'Severity was classified as severe if the baseline factor activity level was <1%, moderate if between 1% and 5% and mild if >5% to 40% of normal'), disclosing in notes that the half-open convention disagrees with the source by one point at exactly 5% (placed in Mild here; the source's own '>5%' mild wording implies Moderate). Part of LOINC tranche G batch 12 (projects/LOINC_DIAGNOSTICS.md).

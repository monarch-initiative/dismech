  summary: 'Create: Hawkinsinuria (dominant HPD uncoupled turnover)'
  details: |
    New kb/disorders entry for WP-002 row 1.4.04.01, HPD-related hawkinsinuria, anchored to MONDO:0007700 and HPD (hgnc:5147). Curated as a separate entry from Tyrosinemia Type III rather than a subtype, because the two allelic disorders do not share a pathograph: this one is a dominant change in reaction outcome (NEOMORPHIC functional_impact_category) in which an active enzyme releases a reactive ring-oxidized intermediate, thiol trapping forms hawkinsin and depletes glutathione, and a self-limiting infantile acidosis follows weaning. The decisive genetic evidence for the split is the compound heterozygote carrying an N241S allele in trans with a tyrosinemia type III null who manifested hawkinsinuria (PMID:17560158). Three honest limits are recorded rather than smoothed over: a CONTROVERSY discussion on whether A33T is a hawkinsinuria allele at all, carrying a REFUTE evidence item from the 2026 biochemical study; an OPEN_QUESTION on the identity of the reactive intermediate (quinolacetic acid versus oxepinone); and nitisinone curated only as an EMERGING_HYPOTHESIS, never as a treatment, since the proposal rests on in vitro kinetics with no reported human use. PMID:7278885, the 1981 NEJM report, caches with no retrievable content and is therefore cited nowhere. Validation: schema clean, terms clean, and count-verified-snippets reported 84/84 verified against cached references. No deep-research provider report was used.

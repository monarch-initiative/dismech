  summary: 'Genetics pass: fourteen nephronophthisis genes wired to compartment-specific
    mechanism nodes'
  details: |
    Genetics pass for the d2g series-027 gap list (issue #12234). Added thirteen
    gene-defined has_subtypes rows (NPHP3, NPHP4, GLIS2, NEK8, TMEM67, TTC21B,
    WDR19, ZNF423, ANKS6, CEP83, DCDC2, MAPKBP1, XPNPEP3), each bound to its
    numbered MONDO class, and ten new genetic records with reciprocal subtype
    foreign keys. The fourteenth class on the list, MONDO:0011190 nephronophthisis
    2, was already bound by the Infantile Nephronophthisis row; that row keeps the
    binding and the INVS genetic record now points at it rather than duplicating
    the class.

    All fourteen listed genes now reach the pathograph. Rather than extend the
    single Ciliary Dysfunction node, the pass added five upstream nodes that
    separate genuinely different mechanisms: an inversin-compartment module node
    (INVS, NPHP3, NEK8, ANKS6, on the strength of the ANKS6 network paper stating
    those four are one module), a retrograde intraflagellar transport node (TTC21B
    = IFT139 and WDR19 = IFT144, both complex A), a distal-appendage docking node
    (CEP83, CEP164), a mitochondrial aminopeptidase node (XPNPEP3), and a
    fibrogenic transcriptional derepression node (GLIS2) that reaches interstitial
    fibrosis without an intervening ciliary lesion. TMEM67 and DCDC2 joined the
    Ciliary Dysfunction node; ZNF423 and MAPKBP1 joined the DNA Damage and
    Senescence node, MAPKBP1 because the same report that delineates it shows
    patient fibroblasts have no ciliogenesis defect, so no ciliary node would be
    honest for it.

    The GeneReviews baseline chapter for this disease, PMID:27336129
    "Nephronophthisis-Related Ciliopathies" (NBK368475), was absent from the entry
    and is now cited and tagged. check-genereviews had reported NO_CHAPTER because
    the chapter title is not a normalized match for the entry name.

    Three ClinGen findings are recorded rather than smoothed over. ClinGen lumps
    WDR19, TMEM67, DCDC2 and ZNF423 into a single ciliopathy class (MONDO:0005308)
    and makes no call on the numbered nephronophthisis classes those rows bind; its
    only NEK8 gene-validity assertion is against renal-hepatic-pancreatic dysplasia
    2 (MONDO:0014174), a different entity, so that record is cited on the NEK8 row
    as NO_EVIDENCE rather than as support; and GLIS2 and ZNF423 are graded Moderate
    rather than Definitive, which each row states.

    One ClinGen data defect was found and not acted on: the WDR19 evidence summary
    cites "Bedrup et al., PMID: 22019272" for the first report, but PMID:22019272 is
    an unrelated CYP26B1 craniosynostosis paper. The correct identifier is
    PMID:22019273 (Bredrup et al.), which the same summary cites correctly further
    down, and which this entry uses.

    The stub stubs/Nephronophthisis-like_Nephropathy_1.yaml is deleted: MONDO files
    MONDO:0013163 as a child of MONDO:0019005, so it is curated here as a subtype
    row.

    Every snippet was checked to sit inside the cited paper's abstract before
    commit, because linkml-reference-validator 0.3.0rc1 withholds stale
    full_text_html bodies (see #12672). Gates: validate, validate-terms,
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, list-gene-term-mismatches (57 gene
    descriptors, 0 findings), check-snippet-grading, check-genereviews, and
    validate-disorders under 0.3.0rc1.

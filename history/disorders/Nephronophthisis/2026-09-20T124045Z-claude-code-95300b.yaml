  summary: 'Genetics pass: subtype terms, gene wiring, NEK8 evidence fix'
  details: |
    Genetics pass for the d2g gene-wiring campaign (issue #12203, epic #12189).

    Research first: the entry curates six NPHP genes. The checklist keys only NPHP1
    (MONDO:0009728), already bound and already wired. The interesting finding was in
    the subtype list, which mixes two axes - four clinical age-of-onset strata and
    two gene-defined rows - and only the gene rows were bound.

    MONDO does not offer a clean clinical axis here. Searched OLS synonym-inclusive
    and listed all 60 MONDO terms matching "nephronophthisis":
    - "infantile nephronophthisis" resolves only as a synonym of MONDO:0011190
      (nephronophthisis 2, the INVS class);
    - "juvenile nephronophthisis" resolves only as a synonym of MONDO:0009728, which
      the NPHP1-related row already binds;
    - "adolescent nephronophthisis" resolves to nothing;
    - MONDO:0019742 "late-onset nephronophthisis" is a genuine Orphanet-derived
      clinical class with no causal gene.

    Changes:
    - Bound `Infantile Nephronophthisis` to MONDO:0011190 with INVS, and
      `Late-Onset Nephronophthisis` to MONDO:0019742 with no genes, each with a
      `review_notes` explaining the binding.
    - Left `Juvenile` and `Adolescent` deliberately unbound with `review_notes`
      recording the exact searches run and why - the juvenile concept would
      duplicate a term already bound on this entry, and no adolescent class exists.
    - Added genes to the NPHP1-related and CEP164-related rows.
    - Wired all six genes onto `Ciliary Dysfunction`, whose own evidence already
      states that NPHP gene products localise to the transition zone and basal body,
      and added PMID:18199800 there for the NEK8 mislocalisation result.
    - Wired INVS and NEK8 onto `Impaired Cell Signaling` and gave that node the
      inversin/Wnt mechanism from PMID:15852005, including the zebrafish rescue that
      ties the signaling defect to cysts.
    - Wired CEP164 onto `DNA Damage and Senescence` with the PMID:22863007 evidence
      the entry already cites elsewhere; CEP164's discovery paper is the one that
      places nephronophthisis on the DNA-damage-response axis.
    - Fixed a mis-graded evidence item. The NEK8 record's only evidence was a
      PMID:36990420 snippet that does not mention NEK8, graded SUPPORT with an
      explanation that admitted as much. Regraded to NO_EVIDENCE per CLAUDE.md and
      added two real NEK8 items from PMID:18199800.
    - Cited the INVS/Wnt claim that the INVS record's note had asserted without a
      reference.
    - Added `relationship_type: CAUSATIVE` to the INVS and NEK8 records.

    New references cached: PMID:18199800, PMID:15852005.

  summary: Replace 'Otic Capsule Bone Biology' node with the OPG-suppression-failure
    mechanism it actually claims
  details: |
    The pathophysiology node 'Otic Capsule Bone Biology' was named after its subject matter rather than a mechanistic claim, and bundled three separate claims: the OPG-rich baseline that suppresses otic capsule remodeling (PMID:15630389), an OPG-knockout mouse showing that losing that suppression permits resorption (PMID:16467704), and a human temporal bone at a dehiscence showing no osteoclastic activity at all (PMID:22312921). Its single downstream edge to 'Bony Dehiscence of Semicircular Canal' was justified with PMID:22312921's developmental thin-bone sentence, duplicating the edge 'Developmental Otic Capsule Bone Deficiency' already makes to the same target with the same PMID, and citing nothing about OPG.

    Renamed to 'Loss of OPG-Mediated Suppression of Otic Capsule Bone Remodeling' and refocused on that one claim: mechanism_confidence HYPOTHETICAL, biological_scale CELLULAR, locations bound to UBERON:0005411, biological_processes changed from bone remodeling/DECREASED (which described the healthy state, not the pathology) to osteoclast differentiation (GO:0030316) and bone resorption (GO:0045453), both INCREASED. PMID:22312921 re-tagged supports: REFUTE, which is what a human negative does to this node. The downstream edge is re-justified on the OPG-knockout evidence with causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES.

    The 'Post-Menopausal Estrogen Decline' environmental entry's influences_mechanisms target and prose cross-reference were retargeted to the new name; its own description already named reduced OPG-mediated suppression of osteoclastogenesis as the mechanism, so the link now lands at the grain the exposure is curated at.

    Added a HUMAN_MODEL_MISMATCH discussion (scds_opg_resorption_model_mismatch) for the mouse-resorption-vs-human-histopathology conflict, which previously survived only as a clause in the node description, with two proposed experiments (temporal bone osteoclast/OPG series; adult-onset conditional OPG loss in a matured capsule).

    No evidence was added or removed; all five evidence items and the edge evidence are the ones already in the entry, re-tagged and redistributed. Validation: linkml-validate --target-class Disease clean; linkml-term-validator validate-data passed; reference_snippet_audit reports 109/109 snippets verified against cached references; check_duplicate_yaml_keys OK.

  summary: Separate dehiscence-causing exposures from symptom provokers
  details: |
    Backfill for issue #8085. This entry models a two-hit structure and the five exposures divide along it. Elevated intracranial pressure is TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES into the bony dehiscence node, supported by a direct measurement of roof thinning at 0.76 against 1.25 millimetres in controls. Minor head trauma is TRIGGERS with unknown intermediates into the same node, trauma too trivial to fracture normal bone completing a defect in an already-thin capsule. Chronic occupational noise and pressure exposure is PREDISPOSES, over-represented among patients without an established mechanism, and post-menopausal estrogen decline is PREDISPOSES into the otic capsule bone biology node on a prevalence pattern rather than a bone measurement. Loud sound and pressure changes is deliberately different: it targets abnormal sound and pressure transmission because these do not create the dehiscence but provoke symptoms through it, the Tullio and Hennebert phenomena. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 109 of 109 verified; integrity issue count unchanged.

  summary: Separate dehiscence-causing exposures from symptom provokers
  details: |
    Backfill for issue #8085. This entry models a two-hit structure and the five exposures divide along it. Elevated intracranial pressure is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into the bony dehiscence node and supports PARTIAL, resting on a cross-sectional roof thickness of 0.76 against 1.25 millimetres in controls that shows association rather than direction. Minor head trauma is TRIGGERS with unknown intermediates into the same node, trauma too trivial to fracture normal bone completing a defect in an already-thin capsule. Chronic occupational noise and pressure exposure is PREDISPOSES, over-represented among patients without an established mechanism, and post-menopausal estrogen decline is PREDISPOSES into the otic capsule bone biology node on a cross-sectional roof thickness difference in women past 45 with menopause only proposed as its cause. Loud sound and pressure changes is deliberately different: it targets abnormal sound and pressure transmission because these do not create the dehiscence but provoke symptoms through it, the Tullio and Hennebert phenomena. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 109 of 109 verified; integrity issue count unchanged. PR review found the intracranial pressure link contradicting its own environmental entry. The entry records presence Predisposing, an effect stating the primary causal role is unestablished, the identical snippet already curated as PARTIAL, a second item reporting no correlation between roof thickness and cerebrospinal fluid pressure, and two REFUTE items from a cohort in which no patient with idiopathic intracranial hypertension had radiographic dehiscence. The link asserted TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES and supports SUPPORT against all of that. It is now PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL, with the description naming the contested status and the refuting cohort. Two snippets were also sharpened to quotes already present in the entry: the minor head trauma link now cites the sentence stating that minor trauma may disrupt thin bone or stable dura over the superior canal, which supports the bony claim rather than only the timing of symptom onset, and the oestrogen link now cites the sentence naming menopause as possibly responsible rather than the age-and-sex prevalence figure. Re-review noted the oestrogen link description was one revision behind the sharpened snippet: it still explained the grade as resting on a prevalence difference by age and sex, when the cited sentence reports a measured roof thickness in women past 45 and names menopause as its proposed cause. The description now says that. The opening narration in this record was also corrected in place, before merge, to state the intracranial pressure grade the file actually carries. Re-verified: 109 of 109 snippets.

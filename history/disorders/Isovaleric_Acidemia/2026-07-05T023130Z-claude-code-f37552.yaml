  details: |
    Backfilled reference_title on 35 previously untitled PMID evidence items across pathophysiology causal-edge evidence and the prevalence node. Re-ran validate-references to pull full text for 4 papers (Jordan cohort PMID:38344522, hyperammonaemia review PMID:30522498, L-carnitine JCI study PMID:6549017, DKA case report PMID:24637313) and verified all existing snippets as exact whitespace-normalized substrings that genuinely support their claims. Added metabolic_intoxication_decompensation module conformance on three nodes: Deficient leucine catabolic flux to Enzymatic Block in Intermediary Metabolism, Toxic isovaleryl-CoA and organic acid accumulation to Toxic Metabolite Accumulation and Energy Deficit, and Catabolic acute metabolic decompensation to Acute Metabolic Decompensation. Mined new full-text findings: NAGS-inhibition mechanism naming isovaleryl-CoA on the secondary urea-cycle node, isovaleric acid directly mediating oxidative stress via ROS on the mitochondrial node, quantified failure-to-thrive at 19 percent and developmental delay at 23.8 percent from the Jordan cohort with OCCASIONAL frequency bands, parental consanguinity at 75.2 percent supporting autosomal recessive inheritance, and L-carnitine preventing further hospitalizations for the carnitine treatment. All schema, term, and reference validation passed.

  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Added a newborn-screening diagnosis row (NCIT:C81178) binding the C5 isomer-sum DBS code (LOINC:45216-9) rather than the single-isomer code, because flow-injection MS/MS reports isovalerylcarnitine with its isomers, plus the C5/C2 (LOINC:53239-0), C5/C3 (LOINC:53240-8) and C5/C8 (LOINC:53401-6) ratio codes used in Bavarian and Wisconsin recall criteria. Three C5 reference ranges: Hamburg NeoGram 0.50 umol/L and Neobase 2 0.45 umol/L (PMID:36636590, already cited by the entry; one range per kit stratum) and Wisconsin 0.44 umol/L inclusive (PMID:23712021). No ratio bands: the Bavarian abstract states percentile thresholds only (PMID:21335445) and the only absolute ratio values found are the Serbian proposal (PMID:35254746), cited on the row and not banded. The C5/C4 ratio was not bound because the Monarch KG search returned no DBS code for it. loinc_term LOINC:LP19306-7 added on the Isovalerylcarnitine (C5) marker.

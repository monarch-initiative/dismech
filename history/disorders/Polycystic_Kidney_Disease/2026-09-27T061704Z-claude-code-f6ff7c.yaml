  details: |
    Genetics pass for issue #12270 (d2g series-063). Anchor check first: MONDO:0020642 polycystic kidney disease has exactly two asserted children, MONDO:0004691 ADPKD and MONDO:0009889 ARPKD, which are the entry's two pre-existing has_subtypes rows, so the disease_term binding is exact in both directions and no re-anchoring was needed. The checklist rows MONDO:0033004 (PKD4, PKHD1) and MONDO:0033281 (PKD5, DZIP1L) are asserted children of the ARPKD row, and are added as two new subtype rows declared through that row's children list. Eight of the nine genetic rows carried a gene name in free text with no gene_term at all, so the gene-wiring metric read 0/9; all eight are now bound with relationship_type and a reciprocal subtype foreign key, a DZIP1L row is added, and the metric is 10/10. A new pathophysiology node, Defective Polycystin-1 Maturation in the Endoplasmic Reticulum, carries GANAB, DNAJB11, ALG5 and ALG9 with their own evidence and an edge into Ciliary Dysfunction, which now also carries PKD1, PKD2, PKHD1, DZIP1L, IFT140 and CYS1 with per-gene ciliary-localization evidence. PKD1 and PKD2 gained case_fractions replacing an unsourced 85 percent prose figure that contradicted the row's own cited snippet (78 percent). One pre-existing evidence snippet used an ellipsis to elide text and could not verify after normalisation; it was requoted contiguously from the same GeneReviews sentence. The ARPKD GeneReviews chapter PMID:20301501 was surfaced by check-genereviews, cited and tagged. All 139 snippets verify; validate, validate-terms, and the offline gates pass.

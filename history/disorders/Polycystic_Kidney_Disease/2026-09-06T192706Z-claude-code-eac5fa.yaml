  summary: 'Cite the weak diet associations at node level: Polycystic_Kidney_Disease'
  details: |
    Linked Caffeine Consumption to Vasopressin/cAMP-Driven Cyst Expansion. The entry cited only a GeneReviews avoid-list, which names a circumstance to avoid rather than a mechanism, so the disposition report left it alone. Added PMID:12397042, in which mural epithelial cells cultured from ADPKD cysts show caffeine at clinically relevant concentrations (10-50 micromolar) potentiating desmopressin, PGE2 and isoproterenol to raise cAMP. Desmopressin is the vasopressin analogue, so the experiment measures caffeine acting on the node's own signal. Recorded as EXACERBATES / DIRECT with evidence_source IN_VITRO, since the work is in cultured patient-derived cells rather than in patients.

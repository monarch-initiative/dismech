  details: |
    Three non-blocking suggestions on PR 12990, two taken in full and one in part. The PMID:28530676 item on the PKD4 row was graded OTHER with quote_role BACKGROUND; the quoted sentence states a human clinical fact about what ARPKD was taken to be, so evidence_source is now HUMAN_CLINICAL with BACKGROUND retained, which is the pairing CLAUDE.md prefers and keeps the information OTHER discarded. check-snippet-grading reports no new divergences, so that sentence is not graded differently elsewhere in the file. The two PKD1/PKD2 case_fractions rows recorded their population as ADPKD cases with a molecular diagnosis, a denominator the cited JAMA snippet does not state; narrowed to ADPKD cases, which is what the source says. On CYS1 the suggestion was to add relationship_type and a subtype key: relationship_type UNKNOWN is taken, since the only assertion cited is ClinGen's Limited grade and that does not establish the relationship, matching how TRIM44 is treated in the aniridia entry. The subtype key is declined and the reason recorded in the row: that ClinGen row is scored against MONDO:0020642 polycystic kidney disease, the generic class whose own definition spans both dominant and recessive forms, so it does not place CYS1 under the autosomal recessive row specifically. Assigning it there would assert more than the cited evidence supports.

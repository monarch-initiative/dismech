  summary: Bind MONDO:0980705 (CDG type IIcc) - the term already existed
  details: |
    The entry carried a disease_term with only a preferred_term and no bound term, and a review had recorded this as an ontology gap requiring a MONDO new-term request. That was wrong. MONDO:0980705 congenital disorder of glycosylation, type IIcc exists, xrefs OMIM:621381, and records UGGT1 (HGNC:15663) as its causal gene via RO:0004003. It is an is_a descendant of MONDO:0005501 congenital disorder of glycosylation type II and therefore of MONDO:0015286.

    Bound the term and added congenital disorder of glycosylation, type IIcc and CDG2CC as synonyms. No new-term request was filed because none is needed.

    Validation: just validate PASS; just validate-terms PASS.

  summary: 'Gene-family review: COQ7'
  details: |
    The COQ7 (HMNR9) genetic record had no relationship type, no variant origin and an inheritance block without a term. Typed it CAUSATIVE and germline with HP:0000007, supported by biallelic COQ7 variants in nine families with distal hereditary motor neuropathy and upper motor neuron signs, including a recurrent p.Met1? allele with a Brazilian founder effect (PMID:37170631), and an independent Portuguese family homozygous for c.3G>T (PMID:36454683). The node bound GO:0008682, the donor-unspecified demethoxyubiquinol hydroxylase; replaced it with GO:0160224, the NADH-dependent demethoxyubiquinone hydroxylase, because COQ7 is an NADH-dependent diiron hydroxylase (PMID:38425362), consistent with the Primary_Coenzyme_Q10_Deficiency entry. ClinGen classifies COQ7 as Strong for the broad distal hereditary motor neuropathy class MONDO:0018894, which is not this entry's disease term, so no tier was copied.

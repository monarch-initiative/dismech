  summary: Bind AR dHMN subtypes to MONDO, add HMNR5/7/8/9/10 and DSMA6, wire genes
    into the pathograph
  details: |
    Gene-wiring pass deferred by PR #12893 (issue #12253) and listed on issue #12931. Bound subtype_term on the four existing subtypes after reading each MONDO child of MONDO:0015363 in OLS: dSMA1 MONDO:0011436, dSMA2 MONDO:0011585 (the Jerash-type class, tied to SIGMAR1 by PMID:31511340), dSMA4 MONDO:0012608, and the RTN2 subtype MONDO:0971150. Added pointer subtypes (curated_in) for HMNR1, HMNR5, HMNR7 and HMNR8, which have their own entries. Added HMNR9 (COQ7, PMID:37170631), HMNR10 (VRK1, PMID:39693713) and DSMA6 (REEP1, PMID:27066569) with genetic rows, and deleted the HMNR9 and HMNR10 stubs. Added a genes list to the Motor Neuron and Distal Axon Gene Defect node so every causal gene reaches the pathograph. Left out HMNR3 (MONDO:0011771), which is a mapped locus with no gene, and MONDO:0044651, a syndromic encephalopathy. Validated with just validate-disorders (34/34 snippets), validate-terms, check-granularity, check-entity-refs, check-causal-targets and check-groupings.

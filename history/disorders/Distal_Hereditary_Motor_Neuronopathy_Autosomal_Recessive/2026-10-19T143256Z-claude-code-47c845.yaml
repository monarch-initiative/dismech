  summary: Ground wired genes on molecular-function nodes
  details: |
    CI's newly-ungrounded-genes check flagged nine genes (IGHMBP2, SIGMAR1, PLEKHG5, RTN2, REEP1, SORD, MME, COQ7, VRK1) that the PR had added to the single bundle node 'Motor Neuron and Distal Axon Gene Defect', which names no molecular function and whose genes share none. Each gene was moved onto its own upstream node carrying a GO molecular-function term with a verified snippet stating that activity: RNA helicase activity (IGHMBP2, PMID:36445400), protein folding chaperone (SIGMAR1, PMID:31511340), guanyl-nucleotide exchange factor activity (PLEKHG5, PMID:17564964, inferred from the RhoGEF domain so marked INDIRECT), membrane bending activity (RTN2 PMID:38527963 and REEP1 PMID:27066569, sharing one node), L-iditol 2-dehydrogenase (NAD+) activity (SORD, PMID:34819907), metalloendopeptidase activity (MME, PMID:26991897), 3-demethoxyubiquinol 3-hydroxylase activity (COQ7, PMID:37170631) and protein serine/threonine kinase activity (VRK1, PMID:39693713). Each new node feeds the bundle node, which keeps DNAJB2 and VWA1. GO terms looked up via runoak ols:go; PMID:17564964 and PMID:26991897 newly fetched.

  summary: 'Address PR #8876 review: GeneReviews tag, dated literature sweep, evidence-strength
    and pathograph fixes'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #8876 (two IMPORTANT items, three suggestions).

    IMPORTANT 1 - GeneReviews mined but not tagged. Added `tags: [GeneReviews]` to the PMID:20301525 entry in the top-level references block, matching the 524 entries that already carry it, the umbrella Hereditary_Hemorrhagic_Telangiectasia entry edited by this same PR, and the Hypertrophic_Cardiomyopathy_21 precedent this entry follows.

    IMPORTANT 2 - no deep-research artifact. Ran a search-grounded literature sweep with the claude_code provider (2026-08-18, 4 web searches, 49 turns) and committed it as research/Hereditary_Hemorrhagic_Telangiectasia_4-deep-research-claude_code.md plus its .citations.md sidecar. This takes the reviewer's narrowed ask. A synthesised provider report was still deliberately NOT commissioned, for the reason originally recorded - on a numbered series with two gene-unsolved members, synthesis is more likely to import HHT1/HHT2/HHT3 mechanism than to add anything the anchoring linkage paper already states.

    The sweep was used for one purpose: dating the entry's two load-bearing NEGATIVE claims, which the reviewer correctly identified as unevidenced. A PubMed query for "HHT4" OR ("hereditary hemorrhagic telangiectasia" AND 7p14), run 2026-08-18, returned five records, only two of which concern this disease - the 2006 anchoring study (PMID:16969873) and a 2019 Korean multicenter series (PMID:31455059). The other three are homonyms of the HHT4 string in rice, a hepatocyte cell line, and Tetrahymena histone genes. Both negatives (no second family mapped to 7p14, no causal gene) are now stated with that as-of date in the prevalence notes, in the hht4_causal_gene_unidentified discussion rationale, and in the notes block - whose stale "no deep-research provider report was generated for this entry" paragraph was rewritten to describe what was actually run, including that the sweep's own reference-validation block resolved 31/31 references with one unsupported quote (PMID:38357927) that is not cited anywhere in this entry.

    New evidence: PMID:31455059 added to the "Molecular genetic testing (not available for this entity)" diagnosis record, snippet "Further genetic analyses to detect HHT3, HHT4, and other forms of HHT should be implemented." This is independent, later corroboration that HHT4 sits outside routine clinical genetic testing - a national multicenter series whose 49 genetically tested patients resolved only as HHT1 (ENG) or HHT2 (ACVRL1), with HHT4 named as an unmet testing need rather than an available assay. Its cache file was fetched with `just fetch-reference` and never hand-written. The PMID was also added to the top-level references block.

    Suggestions 1 and 2 both taken. Suggestion 1: the PMID:16969873 parent-disease-generic framing sentence on the Multisystem Vascular Dysplasia node changed from SUPPORT to PARTIAL, aligning with the inheritance block, with the explanation stating why. Suggestion 2: added downstream edges so the pathograph forms one connected component - Multisystem Vascular Dysplasia to Arteriovenous Malformation (routed from the dysplasia node rather than from the mucocutaneous node, because an AVM is not a mucocutaneous bleeding manifestation), and Attenuated Mucocutaneous Bleeding Phenotype to Recurrent Epistaxis and to Telangiectases. Suggestion 3 required no change.

    Not changed, deliberately. The entry still carries NO causal gene. This was re-verified independently in this session with `uv run runoak -i sqlite:obo:mondo info MONDO:0012532 -O obo`: the MONDO record has no definition text and no RO:0004003 causal-gene relationship, only the OMIM:610655 xref and an is_a to MONDO:0019180. The dispatch brief for this resume session asserted the locus was 5q31.3-q32; that is the HHT3 locus (PMID:15994879), and linkage to HHT3 was explicitly excluded in this family, so 7p14 was kept and the existing hht4_not_hht3_chromosome_confusion NEC guardrail stands unchanged. No ENG/ACVRL1/SMAD4/GDF2 mechanism, no treatments block, no organ-specific AVM terms, and no parent-disease prevalence rate were imported. The hht4_omim_synopsis_features_unquotable CURATION_TODO remains OPEN - the AJMG full text is still paywalled and its synopsis features still cannot be snippet-verified.

    The 23 other references_cache files fetched incidentally by the deep-research reference-validation pass are NOT committed: they are cited only by the research report, not by the KB entry. This matches the Hypertrophic_Cardiomyopathy_21 precedent commit (d1901474), which committed the research artifact and its sidecar plus cache files for its three KB-cited PMIDs only.

    Validation run and read in full for this session: `just validate` PASS (26/26 snippets verified, up from 25 before this change); `just validate-terms` PASS; `just count-verified-snippets` over both changed KB files 88/88 verified; `just check-duplicate-keys` OK across 2334 YAML files; `just check-title-snippets` OK, no new title-quoting snippets; `just validate-disorders` over both changed KB files run once as the pre-PR sweep.

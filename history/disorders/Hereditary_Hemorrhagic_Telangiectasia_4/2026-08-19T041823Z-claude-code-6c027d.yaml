  summary: 'Create: Hereditary Hemorrhagic Telangiectasia Type 4 (MONDO:0012532, locus-defined,
    no causal gene)'
  details: |
    Created kb/disorders/Hereditary_Hemorrhagic_Telangiectasia_4.yaml for MONDO:0012532 (OMIM:610655) and added a matching HHT4 subtype block to the HHT umbrella entry.

    NEC preflight (numbered series, high risk). OAK on MONDO:0012532 returned xref OMIM:610655, synonyms HHT4 and "telangiectasia, hereditary hemorrhagic, type 4", is_a MONDO:0019180, NO definition text and NO RO:0004003 causal-gene relationship. The HPO annotation service for OMIM:610655 likewise returns an empty gene list. `just preflight-dr` was not run because no deep-research report was generated; the manual MONDO/OMIM/synonym checks in CLAUDE.md section 2b were used instead. Those checks caught a real named-entity confusion in the dispatch brief, which stated that HHT4 maps to 5q31.3-q32: that is the HHT3 locus (PMID:15994879, OMIM:601101). HHT4 maps to a 7 Mb interval at 7p14 between D7S2252 and D7S510, maximum two-point LOD 3.60 at D7S817 (PMID:16969873). Linkage to HHT1, HHT2 and HHT3 was explicitly excluded in the HHT4 family, so chromosome 5 content is contradicted rather than merely off topic. The correction is recorded in the entry as the hht4_not_hht3_chromosome_confusion discussion (kind INTERPRETATION, status RESOLVED) and in the top-level notes guardrail.

    Scope decision. Curated as a standalone entry plus a subtype block on the umbrella, matching the 90 existing disorder/subtype pairs already in kb/disorders (for example Diabetes_Mellitus and Type_I_Diabetes). The subtype block alone could not carry the locus, the mechanism nodes, or the knowledge gaps; a standalone entry alone would leave the numbered series incomplete on the umbrella. The umbrella diff is 30 added lines and touches nothing else.

    Shape follows the Hypertrophic_Cardiomyopathy_21 precedent for a locus-defined entity with no causal gene: a genetic block with no gene_term and an explicit do-not-populate guardrail, a HYPOTHETICAL "Unidentified 7p14 Disease Allele" pathophysiology node whose downstream edge is INDIRECT_UNKNOWN_INTERMEDIATES, and four discussions (a KNOWLEDGE_GAP on the unidentified gene with two proposed experiments, the RESOLVED HHT3/HHT4 interpretation guard, an OPEN_QUESTION on the single-family evidence base, and a CURATION_TODO recording the 21 OMIM/HPO synopsis features that cannot be quoted from the paywalled AJMG full text).

    Deliberately omitted: no causal gene, no treatments block (HHT4 management is parent-disease HHT management and none of it was studied in this entity), no organ-specific AVM or site-specific telangiectasia terms (the abstract does not localise them), no prevalence rate, and no ENG/ACVRL1/SMAD4/GDF2 mechanism.

    Validation: `just validate`, `just validate-terms` and `just count-verified-snippets` pass on both files; `just validate-disorders` over both files passes with 87/87 snippets verified; `just check-duplicate-keys` reports OK over 2334 files; `just check-title-snippets` reports no new title-quoting snippets. Targeted pytest over tests/test_data.py (unique names, subtype foreign keys, required fields, evidence references, discussions) passes 8122 tests with one pre-existing unrelated failure in Travelers_Diarrhea.yaml (bare-URL references introduced by #8789 on main).

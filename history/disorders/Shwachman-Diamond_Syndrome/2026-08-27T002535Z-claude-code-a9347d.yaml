  details: |
    Curated to complete ISDS Nosology group 11 (Metaphyseal dysplasias), covering rows NOS 11-0050 SBDS, 11-0070 DNAJC21 and 11-0080 SRP54; the EFL1 row already had its own entry. The pathograph runs from the SBDS/DNAJC21/SRP54 lesions through failure of eIF6 eviction and the resulting global translation deficit to the pancreatic, granulopoietic and growth-plate arms, and separately through ribosomal-fitness-constrained somatic clonal hematopoiesis - EIF6 compensatory versus TP53 maladaptive - to myeloid transformation. All 81 evidence snippets verified against the local reference cache; schema, term, duplicate-key and entity-reference checks pass.

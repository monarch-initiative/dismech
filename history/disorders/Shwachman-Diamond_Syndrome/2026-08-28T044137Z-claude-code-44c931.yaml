  details: |
    Split Impaired 80S Ribosome Assembly and Global Translation Deficit into two nodes joined by a DIRECT edge. They are close together in time but are separate claims, and this disease supplies the proof: the somatic EIF6 arm is precisely a compensation that restores translation without correcting the germline assembly defect. Corrected G-CSF therapeutic_modality from PROTEIN_REPLACEMENT to OTHER - it is a recombinant cytokine given as a pharmacological growth-factor signal, and the deficiency in SDS is not of G-CSF; the pancreatic enzyme treatment in the same file remains correctly PROTEIN_REPLACEMENT. Deep-research provenance for this tranche, recorded here at reviewer request so it is durable rather than living only in a PR comment: the ten ISDS group 11 and 12 entries in PR 9744 were curated directly from primary literature, not from a deep-research provider sweep, which is why research/ contains no artifact for any of them. The disease list was not discovered but enumerated - it is the membership of Table 1 groups 11 and 12 of the ISDS Nosology 2023 revision (PMID:36779427), and the curation task was to cover every row. Sources were reached from each row's gene and OMIM number via PubMed. Retrospective DR artifacts would be provenance fiction, so none were generated.

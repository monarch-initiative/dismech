  details: |
    Added two animal_models entries with modeled_mechanisms links, per item 3 of issue 9859 (ISDS group 11/12 follow-ups): the Sbds-deleted mouse ribosome-reconstitution study (PMID:21536732), linked to the Failure of eIF6 Eviction from the Pre-60S Subunit node with a readout on eIF6 occupancy; and the srp54-knockdown zebrafish model (PMID:28972538, PMID:37226705), linked via PERTURBS to Impaired Co-translational Protein Targeting and via RECAPITULATES to Bone Marrow Failure with Granulopoietic Predominance and Exocrine Pancreatic Acinar Failure, with readouts for neutrophil count, neutrophil chemotaxis, and pancreas size. All evidence snippets reuse text already cited elsewhere in the entry, so no new fetches were needed. Deliberately left the third model named in issue 9859, the zebrafish plcb3-null model in Spondylometaphyseal_Dysplasia_with_Corneal_Dystrophy.yaml, untouched: that file has an open unrelated PR 10205 in flight and editing it risked a conflict. Item 2 of issue 9859, the Spondyloenchondrodysplasia conjunctive-node split, was found already resolved on main by unrelated commit b7d54d31 (PR 9618). Item 4, target_mechanisms backfill across the ten group-11/12 treatments, remains open. Validated with just validate-disorders, check-duplicate-keys, check-entity-refs, check-enum-values, and pytest -k model_readout_targets_match_link, 8018 passed.

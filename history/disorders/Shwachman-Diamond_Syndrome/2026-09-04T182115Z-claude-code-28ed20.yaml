  summary: Add Severe neonatal SMD subtype (MONDO:0850096)
  details: |
    Resolved curation claim #10983 (SBDS-related severe neonatal spondylometaphyseal dysplasia, MONDO:0850096) as a SUBTYPE of the existing Shwachman-Diamond syndrome entry rather than a standalone disorder file. Evidence for the decision: Nishimura et al. (PMID:17400792) report the two patients as 'skeletal manifestations at the severest end of the phenotypic spectrum of SBDS mutations'; both carried the ordinary recurrent SBDS gene-conversion alleles found in classic SDS, and the surviving patient developed neutropenia and decreased serum amylase, so the entity sits inside the SDS spectrum. Orphanet (ORPHA:622934) names the same concept 'SBDS-related severe neonatal SMD' with synonym 'Spondylometaphyseal dysplasia, Sedaghatian-like type'. Added: a has_subtypes entry 'Severe neonatal SMD' binding MONDO:0850096 with three cited evidence items; a Platyspondyly downstream edge on the Growth Plate Chondrocyte Dysfunction node (graded SUPPORT/INDIRECT because the vertebral-endplate physis is inferred rather than asserted by the source); four subtype-scoped phenotypes (Platyspondyly wired; Respiratory failure requiring assisted ventilation, Pulmonary hypoplasia and Hepatic fibrosis deliberately left unwired with the reason in notes, and never chained to one another because they were observed in different patients); and a Sedaghatian-type spondylometaphyseal dysplasia differential diagnosis citing the negative SBDS screen in that entity plus the GPX4 aetiology (PMID:24706940). No frequency bands were asserted anywhere: the denominator is two patients. Validation: just validate, validate-terms, count-verified-snippets (113/113, no prefix skips), check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, validate-disorders all pass. The stub was deleted because the MONDO ID is now bound in kb/.

- type: EDIT
  outcome: changed
  summary: 'Second review round: node splits and missing content'
  details: |
    Split the bundled organism-level nodes: Metaphyseal Dysplasia and Short Stature became two nodes with an edge between them, and Malnutrition and Growth Failure became a two-step chain, so short stature now correctly has two incoming routes - the intrinsic skeletal defect and malnutrition. Renamed rather than split Granulopoietic Failure and Bone Marrow Dysfunction: granulopoietic failure is a subset of marrow dysfunction, so splitting would have produced an edge asserting that a part causes its whole; it is now Bone Marrow Failure with Granulopoietic Predominance. Added the missing content the review identified: interstitial del(20q) as the second and commoner genetic route to EIF6 inactivation in the compensatory clonal arm, the neutrophil chemotaxis defect distinct from the neutrophil count, and a p53-dependent progenitor apoptosis node linking ribosomal stress to the cytopenias.

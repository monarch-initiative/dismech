  summary: 'Review: connect 17 orphan phenotypes (IUIS Table 5)'
  details: |
    Seventeen of eighteen phenotypes had no incoming edge, across an entry with eighteen pathophysiology nodes - the mechanism modelling was thorough and reached almost none of the clinical findings.

    Each attaches to the node that explains it: the pancreatic findings to acinar failure, the cytopenias to marrow failure, the malignant pair to the transformation node, the skeletal findings to metaphyseal dysplasia. The thoracic chain is modelled as a sequela cascade - narrow chest to pulmonary hypoplasia to respiratory failure - because that is the route by which a bone dysplasia becomes lethal.

    Worth flagging for a future reader: this entry carries pathophysiology nodes and phenotypes whose names differ only in casing (Metaphyseal Dysplasia / Metaphyseal dysplasia, Short Stature / Short stature). They are separate objects and the pathograph matches names exactly, so the edges connect them rather than collapsing them - but a rename that changed only casing would silently break these edges. The edge descriptions say so.

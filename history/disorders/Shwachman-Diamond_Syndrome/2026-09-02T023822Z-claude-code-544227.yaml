  summary: 'Classify: IUIS 2022 Table 5 (phagocyte defects)'
  details: |
    Added classifications.iuis_category: phagocyte defect to the existing classifications block (which previously carried only isds_skeletal_category).

    Four IUIS 2022 Table 5 rows are printed under the Shwachman-Diamond Syndrome disease label, one per causal gene: SBDS (AR, MIM 607444, cache line 2997), DNAJC21 (AR, MIM 617052, line 3001), EFL1 (AR, MIM 617941, line 3003) and SRP54 (AD, MIM 604857, line 3012). This entry is recorded as the home for the SBDS, DNAJC21 and SRP54 rows; the EFL1 row stays on the separate EFL1-related Shwachman-Diamond syndrome entry, mirroring the split already documented in both files' isds_skeletal_category notes. The notes state that coverage explicitly because iuis_category is single-valued and cannot be scoped to a has_subtypes member.

    The notes also record that IUIS 2022 places SDS in Table 5, NOT Table 9 (bone marrow failure). SBDS/DNAJC21/EFL1/SRP54 appear only in the Table 5 congenital-neutropenia section; Table 9 holds Fanconi anemia, MIRAGE, ataxia-pancytopenia, dyskeratosis congenita, BMFS1/2/5, Coats plus and MECOM. The 'bone marrow failure' permissible value in src/dismech/schema/classifications/iuis_immunodeficiency.yaml names SDS in its description and is wrong on that point; that is a schema-doc defect to fix separately, not a reason to retag.

    Two evidence items cite PMID:35748970 directly, quoting the Table 5 title as printed ('Congenit al defects...', the extractor splits the word) and the SRP54 row verbatim. The SBDS and DNAJC21 rows are cited by line in notes rather than quoted, because each is only three words and would trip check-snippet-length.


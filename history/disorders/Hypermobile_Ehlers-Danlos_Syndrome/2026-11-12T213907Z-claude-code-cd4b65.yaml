  summary: Wire the hEDS pathograph from an OpenScientist mechanism-to-phenotype run
  details: |
    Rebuilt the pathograph around the clinical manifestations. Before this pass the entry had three pathophysiology nodes and two edges, and 3 of 29 phenotypes were causally connected; after it there are 13 nodes, and 24 of 29 phenotypes are connected (just list-disconnected-phenotypes). Added a tissue-level hub, Generalized connective tissue laxity and fragility (ESTABLISHED; defined by the 2017 nosology and documented in hEDS skin ultrastructure, PMID:23091361), with edges to joint hypermobility, the five skin phenotypes, hernia, pelvic organ prolapse, mitral valve prolapse, aortic root dilatation (with the longitudinal non-progression data, PMID:21193204), and hypothetical edges to sleep apnea and to a venous-pooling node. Added two candidate upstream nodes held at HYPOTHETICAL: KLK15 variant-associated LOX mislocalization (PMID:40949095, knock-in mouse, two families, unreplicated) and systemic complement and innate immune dysregulation (serum proteomics PMID:40972649, with the ACKR3 GWAS preprint PMID:41001447 as indirect support). The pain hub is two provisional nodes and competing hypothesis groups: central sensitization (quantitative sensory testing in adults, adolescents and children, PMID:26919608, 24487572, 27483212, 39529262, 31075184) fed by an edge from joint instability, and small fiber neuropathy with autonomic fiber loss (skin biopsy, PMID:27306637 and 42399338; the no-somatosensory-damage cohort PMID:26919608 recorded as REFUTE). Impaired proprioception and muscle weakness is a provisional node from isokinetic and joint-position-sense studies (PMID:19937459, 22556148, 27339264) with edges to joint instability, fatigue and chronic pain. The autonomic hub is a provisional dysautonomia node (PMID:28160388, 32434316, 41118678) feeding orthostatic tachycardia, gastrointestinal dysmotility and, under the neuroconnective hypothesis, anxiety; a hypothetical venous-pooling node (PMID:10518084) carries the plethysmography study PMID:12010910 as REFUTE, and a hypothetical mast cell activation node has one hedged edge. A gut-brain interaction node records that reflux symptoms in hEDS are mostly functional heartburn and that esophageal dysmotility was not associated (PMID:42119906). Phenotype sequelae now carry fatigue from chronic pain, sleep disturbance, orthostatic tachycardia and sleep apnea, and constipation and nausea from gastrointestinal dysmotility. Added two genetic rows (KLK15 as UNKNOWN, ACKR3 locus as RISK_FACTOR) and six mechanistic_hypotheses groups wired to the edges. Rewrote the two knowledge-gap discussions so they attach to the new nodes and to the five phenotypes still unwired (migraine, dental crowding, high narrow palate, depression, acrocyanosis), with the headache review PMID:42640494 and the craniofacial-null result PMID:28073822 as evidence. The existing myofibroblast node and its HUMAN_MODEL_MISMATCH discussion were left unchanged.

    Deep research: one new OpenScientist run with templates/disease_phenotype_wiring_research.md (research/Hypermobile_Ehlers-Danlos_Syndrome-phenotype-wiring-deep-research-openscientist.md; 29/29 references resolved, 0 unresolved, 38/38 terms resolved with 3 mislabelled HP CURIEs that were not used: HP:0045010, HP:0031547, HP:0000083). Its chains were adopted where a human source states the step and downgraded where it did not: its SUPPORTED grade for sleep apnea via airway laxity was recorded as hypothetical, and its proposed ECM-to-small-fiber edge was not adopted, and its proprioception citation PMID:7283686 was dropped because it is a single classic-EDS case. The earlier general-template OpenScientist report (2026-08-01) was retro-fitted with reference and term validation (35/35 resolved; two obsolete GO terms and four mislabelled MAXO/HP terms, none used) and mined for the KLK15, ACKR3, complement, central sensitization and small fiber leads; its HGNC identifier for KLK15 (HGNC:6369) is wrong, the gene is hgnc:20453, which was read from the HGNC REST API. Additional primary sources were found by PubMed E-utilities searches on each hub. Evidence_source and quote_role were graded from the quoted sentence; preprint status of PMID:41001447 and mixed-subtype cohorts are stated in explanations and notes.

    Validation: just validate (schema, terms, 189 snippets, 195 titles, 0 issues), just count-verified-snippets 189/189, check-causal-targets, check-entity-refs, check-logical-rules, check-coarse-phenotypes, check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-qualifier-terms, check-delivery-system, check-folded-yaml, check-folded-hyphens, check-snippet-length, check-title-snippets, check-reference-titles, check-snippet-grading all clean; validate-disorders run once at the end. Fifteen pre-existing references_cache files rewritten by the deep-research validation pass were reverted so only newly fetched caches are committed.

  summary: 'Phenotype review: Hypermobile Ehlers-Danlos Syndrome'
  details: |
    Reviewed all 21 existing phenotypes for source identity, snippet-to-claim support and frequency, optimal HPO specificity, and warranted clinical causation, together with the complete Falcon report and citation sidecar. Added seven supported phenotypes: abdominal wall hernia, high narrow palate, striae distensae, nausea, constipation, depression, and sleep apnea. Rebound generalized joint hypermobility to HP:0002761; retained broad peripheral neuropathy because the small-fiber-specific HPO candidate describes a biopsy readout rather than the clinical neuropathy. Retained the other accurate HPO bindings, including separate joint dislocation, arthralgia, chronic pain, myalgia, hyperextensible versus soft skin, easy bruising, atrophic scars, fatigue, migraine, orthostatic tachycardia, dental crowding, mitral valve prolapse, gastrointestinal dysmotility, acrocyanosis, aortic root dilatation, anxiety, pelvic organ prolapse, and sleep disturbance. Marfanoid habitus was considered but the general descriptor does not warrant disproportionate tall stature.

    Expanded thirteen original phenotype snippets from clinical-list fragments to full GeneReviews clinical sentences. Replaced the orthostatic-tachycardia snippet with the hEDS autonomic-test result and the generic functional-bowel snippet with actual delayed gastric emptying. Replaced the arthralgia edge frequency row with painful-injury evidence and the chronic-pain edge with the full chapter tissue-damage statement (17 existing snippet replacements overall). Removed the mitral-valve-prolapse FREQUENT band: Orphanet occurrence remains supported, but a newer echo-selected hEDS cohort found 6/170 (3.5%), so no universal band is assigned. Removed the gastrointestinal-dysmotility band while preserving the Orphanet row and distinguishing functional symptoms from measured dysmotility. The selected 270-person hEDS autonomic cohort has POTS in 33%, structural small-fiber neuropathy in 64%, and combined structural/functional criteria in 82%; these are not all-hEDS prevalence estimates. New nausea, constipation, and depression evidence uses separately reported hEDS values from a tertiary intake study and retains self-report/selection limitations without global frequency bands.

    Recast unresolved ECM findings as a hypothetical cellular candidate, corrected two culture-evidence grades to IN_VITRO, and removed unsupported ECM-to-clinical-instability and ECM-to-myofibroblast-transition arrows. Retained the experimentally supported integrin/ILK/Snail1 culture axis with provisional confidence while weakening the unproven initiating MMP9/matrix-fragment claim. Removed the reverse/unsupported instability-to-generalized-hypermobility edge. Retained documented instability-to-dislocation and injury-to-arthralgia/chronic-pain contributions. Added only pain-to-sleep-disturbance, supported by an explicit GeneReviews causal sentence; this does not explain sleep apnea. Corrected overgeneralized POTS and small-fiber-neuropathy discussion claims and classified the culture-to-human gap as HUMAN_MODEL_MISMATCH. Added a clinical knowledge gap for the remaining findings instead of inventing tissue mechanisms. Connectivity is 4/21 before and 4/28 after; all 24 remaining unconnected phenotypes are clinical causal gaps, not intentionally excluded assay readouts.

    Read full source context for all phenotype evidence, including GeneReviews clinical/diagnostic sections, Orphanet, the fibroblast reviews, the selected autonomic cohort, the 2024 echocardiography cohort, and the 2024 hEDS/HSD self-report study. Falcon citation validation resolved 12/12 references with no unresolved or off-topic citations; report HPO suggestions for dysautonomia (HP:0012330, actually pyelonephritis) and soft skin (HP:0011359, actually dry hair) were rejected. The gene preflight correctly skipped an unidentified causal gene, and clinical disease identity was verified manually; hEDS remains in the authorized campaign. New directly cited references were fetched with the prescribed fetcher and term rows were generated by the validator, with no manual cache edits.

  summary: Add public datasets and knowledge-gap discussions to hEDS
  details: |
    Added a datasets block with three verified public GEO series: GSE218012 hEDS/HSD dermal fibroblast RNA-seq, 200 samples, PMID:36552803; GSE77753 and GSE77756 JHS/EDS-HT fibroblast mRNA and miRNA arrays, PMID:27518164. Accessions, sample counts, platforms, and linked PMIDs were verified against live NCBI GEO and PubMed records rather than recalled. Added six discussions capturing the field's open questions: causal genetic architecture [monogenic versus complex], the hEDS/HSD boundary controversy, the undefined criterion-3 exclusion set, the unexplained dysautonomia and small-fiber-neuropathy mechanism, the fascia-versus-dermis tissue-substrate question, and the unexplained female predominance. Each carries a proposed_experiments block with decision_criterion, would_support, and would_refute so the gaps are consumable by the OpenScientist experiment-suggestion layer described in projects/AUTONOMOUS_LABS.md. All 15 evidence snippets were verified as whitespace-normalized substrings of freshly fetched reference cache abstracts, and the reference validator was negative-controlled by deliberately corrupting one snippet to confirm it fails. Validated with just validate, just validate-references, and just validate-terms.

  summary: Add public datasets and knowledge-gap discussions to hEDS
  details: |
    Added a datasets block with three verified public GEO series: GSE218012 hEDS/HSD dermal fibroblast RNA-seq, 200 samples, PMID:36552803; GSE77753 and GSE77756 JHS/EDS-HT fibroblast mRNA and miRNA arrays, PMID:27518164. Accessions, sample counts, platforms, and linked PMIDs were verified against live NCBI GEO and PubMed records rather than recalled. Added seven discussions capturing the field's open questions: causal genetic architecture [monogenic versus complex], the hEDS/HSD boundary controversy, the undefined criterion-3 exclusion set, the unexplained dysautonomia and small-fiber-neuropathy mechanism, the fascia-versus-dermis tissue-substrate question, the unexplained female predominance, and a myofibroblast causal-dependency question asking whether the alpha-v-beta-3/ILK/Snail1 transition drives extracellular matrix failure, rides along with it, or is a mechanotransduction artifact of culture on rigid plastic. That last gap is the only one in this entry with a protocol an autonomous laboratory could compile: a stiffness-controlled perturbation screen on patient-derived fibroblasts, cited against PMID:40343813 showing that substrate softness alone abolishes the myofibroblast phenotype and blocks TGF-beta1 fibrogenic signaling in disease-derived fibroblasts. Each carries a proposed_experiments block with decision_criterion, would_support, and would_refute so the gaps are consumable by the OpenScientist experiment-suggestion layer described in projects/AUTONOMOUS_LABS.md. All 19 evidence snippets were verified as whitespace-normalized substrings of freshly fetched reference cache abstracts, and the reference validator was negative-controlled by deliberately corrupting one snippet to confirm it fails. Validated with just validate, just validate-references, and just validate-terms.

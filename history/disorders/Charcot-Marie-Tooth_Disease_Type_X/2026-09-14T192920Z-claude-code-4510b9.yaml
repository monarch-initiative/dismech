  details: |
    Applied the blocking finding from the ai4c-reviewer review on PR #10947. The explanation on the PMID:42477620 evidence item attached to the pollen/stroke-like-episode trigger edge claimed the snippet documented a temporal association between pollen exposure and stroke-like episodes. The quoted sentence does not say that: it names fever, infection and exercise as reported precipitants and states that allergy-related exposure has rarely been discussed and that causal mechanisms remain uncertain. The pollen association is a separate sentence in the same paper, already quoted by the sibling evidence item on the node. The explanation was rewritten to describe what its own snippet says and to keep the directness: INDIRECT reading explicit. No snippet, reference, supports, directness or evidence_source value was changed. Validation: just validate passed with 60/60 snippets verified, and just check-enum-values, just check-duplicate-keys and just check-entity-refs were all OK.

  summary: Resolve CMTX1 (MONDO:0010549) as a subtype of CMT type X
  details: |
    MONDO:0010549 (Charcot-Marie-Tooth disease X-linked dominant 1) was claimed for curation as a standalone kb/disorders/ entry under issue #10843. On inspection of origin/main it was already curated here: CMTX1 is the first has_subtypes entry of Charcot-Marie-Tooth_Disease_Type_X.yaml, and this file's whole pathophysiology chain (connexin-32 reflexive gap junction loss -> impaired radial metabolic support of the axon -> demyelination with secondary axonal loss -> length-dependent distal neuropathy, plus the oligodendrocyte node for the transient CNS episodes) is the CMTX1 mechanism. The initial duplicate preflight missed this because it searched the MONDO ID and the label 'Charcot-Marie-Tooth disease X-linked dominant', neither of which appears in a file named Type_X whose subtype is named CMTX1; the stub's own mondo_parents field named MONDO:0018994 (CMT type X) and would have shown it.

    Change made: bound subtype_term to MONDO:0010549 on the CMTX1 has_subtypes entry, which retires the concept from the curation queue under the coverage rule in CLAUDE.md (a has_subtypes term counts as curated), and added review_notes recording why CMTX1 is a subtype rather than a promoted entry, so it is not nominated a third time. Deleted stubs/Charcot-Marie-Tooth_Disease_X-linked_Dominant_1.yaml.

    Deliberately not changed: the argument against promotion is that the other CMTX loci (AIFM1, PRPS1, PDK3, the unresolved Xq27.1 insertion) are rare and mechanistically unrelated, so splitting CMTX1 out would leave this entry a shell. No new evidence, phenotypes or pathophysiology were added; no snippet was altered. Two adjacent defects found and left for separate issues rather than widened into this PR: kb/groupings/Charcot-Marie-Tooth_Diseases.yaml omits Type X and Type 4 as members and attributes the GJB1 connexin-32 mechanism to its CMT Type 1 member row, and three explanation strings in this file still argue for the retired PARTIAL evidence grade.

    Validation: just validate, just validate-terms, just check-duplicate-keys, just check-entity-refs, just check-stubs all pass.

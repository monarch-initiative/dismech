  summary: Bind CMTX6 subtype_term to MONDO:0010479, retire its stub
  details: |
    Bound subtype_term (MONDO:0010479, ClinGen-confirmed label 'Charcot-Marie-Tooth disease X-linked dominant 6') on the existing CMTX6 has_subtypes entry, which already carried the PDK3 p.R158H mechanism and its founding evidence (PMID:23297365). This retires the MONDO concept from the curation queue per the coverage rule in CLAUDE.md, the same way CMTX1 was resolved (#10843/#10864). Deleted the now-redundant stub stubs/Charcot-Marie-Tooth_Disease_X-linked_Dominant_6.yaml. Left CMTX2 (MONDO:0010550) and CMTX3 (MONDO:0010551) unbound as the issue directs — both need a dedicated lump/split decision before binding, since CMTX2 has no confirmed causal gene and CMTX3 is a molecularly distinct non-coding lesion. Validated with just validate, just validate-terms, just check-duplicate-keys, just check-entity-refs, and just check-stubs.

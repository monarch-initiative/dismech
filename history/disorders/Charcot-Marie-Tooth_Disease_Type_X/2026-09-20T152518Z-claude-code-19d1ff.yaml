  summary: 'Review round 2: restore the CMTX2 Xp22.2 locus, now cited to its mapping
    study'
  details: |
    Review round on PR #12332. Round 1 removed 'Xp22.2' from the CMTX2 row as unsourced. Located the mapping work instead: Ionasescu et al. placed one X-linked recessive CMT family with infantile onset and intellectual disability at Xp22.2 (PMID:1674639, and the companion clinical/genetic report PMID:1557086). The band is restored with both papers cited, and the row's review_notes now records what the linkage does and does not establish - a multipoint lod of 3.48 at a single marker in one family, with the same authors placing two further families at Xq26 instead. The PMID:1674639 linkage sentence could not be used as a snippet because the reference validator strips bracketed spans and it contains '[theta]'; the bracket-free equivalent sentence from PMID:1557086 is quoted instead. The row still carries no gene, by design: the locus has no confirmed one.

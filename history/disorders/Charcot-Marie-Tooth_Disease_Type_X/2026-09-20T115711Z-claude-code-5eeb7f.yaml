  summary: 'Genetics pass: bind the four gene-defined CMTX subtypes'
  details: |
    Genetics pass for #12192. This entry was already the best-wired of the tranche - all four genes reach a mechanism node - so the only gap was subtype-level binding. Bound GJB1 on CMTX1, AIFM1 on CMTX4, PRPS1 on CMTX5 and PDK3 on CMTX6, each against the evidence already on the row. CMTX2 and CMTX3 are deliberately left unbound: CMTX2 has no confirmed gene and CMTX3 is caused by a non-coding 78 kb interchromosomal insertion with no assigned gene, both of which the rows already say in prose. MONDO reconciliation: MONDO:0010549 / GJB1 present and now bound at the CMTX1 row.

    Self-review found an unsourced cytogenetic band on the CMTX2 row ('Xp22.2'). The only Xp22 location in this entry's cached references is Xp22.11, which is the separate CMTX6/PDK3 linkage result, so the band was removed rather than re-sourced against a paper this entry does not cite. The reasoning is recorded in `review_notes` on that row.

  summary: Review CMTX mechanisms, clinical evidence and care using cached full texts
  details: |
    Reviewed the complete entry, matching OpenScientist narrative and citation list, all cited abstracts, twelve primary-study full texts and the full disease-specific GeneReviews chapter. Recovered the AIFM1 and PRPS1 full papers with the supported reference fetcher and added generated full-text GeneReviews and PDK3 caches. Corrected complete radial-diffusion blockade, female nonprogression, X-inactivation overinterpretation, shared demyelination-first assumptions, respiratory-chain failure in Cowchock syndrome, cultured-cell evidence grading, genotype classification denominators and general-CMT prevalence. Added separate mechanistic events, subtype mappings, measured cohort phenotype contexts, GJB1 molecular/noncoding diagnostics, surveillance, supportive CNS care, observational research registrations, and qualified mouse readouts. Research completeness assessment: phenotypes, subtypes, mechanisms, genetics, diagnostics, care/trials and central references covered; report claims about global XCI refutation, absent radial diffusion, a milder c.-17G>A allele and GJB1-specific results inferred from NEFL disease were rejected against sources. Included the September 2026 CMTX3 neural differentiation study: SOX3 is now prioritized by RNA/protein results, whereas FGF13 differences were not consistently reproduced. Preserved small related-donor cohorts, assay-specific significance, absent isogenic controls and lack of functional rescue. SOX3 and FGF13 causality, glial-to-axon intermediates, human injury ordering and MS association remain explicitly unresolved. Existing broad compartment identity and dedicated AIFM1/PRPS1 entries retained. No infectious or exposure-caused disorder was reviewed.

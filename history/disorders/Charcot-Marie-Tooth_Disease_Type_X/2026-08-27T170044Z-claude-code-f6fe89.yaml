  summary: 'Review round 1: address ai4c-reviewer REQUEST_CHANGES on PR 9700'
  details: |
    Addressed the automated reviewer's REQUEST_CHANGES. Removed an incorrect conforms_to on the radial-metabolic-support node: the module node it named is about ER/Golgi accumulation of misfolded myelin protein and UPR activation, which this node makes no claim about. Split the bundled mitochondrial node into PDK3 Hyperactivation and Reduced Pyruvate Flux and AIFM1 Mitochondrial Oxidoreductase Dysfunction, each with its own gene, process bindings and downstream edge; the previous single GO binding described only the PDK3 arm, leaving AIFM1 asserted in prose but absent from the graph. Corrected two reference_title values that had drifted from the cache, then added a machine check over all 20 distinct PMID/title pairs, which caught a third title I had invented while drafting this very round. Moved the 9.2 percent GJB1 case share from a prevalence record that had to declare UNKNOWN twice into Genetic.case_fractions. Consumed the two unused headline references: added a progression section from PMID:37284795 and PMID:28768847, variant-class and ACMG breakdown and the c.-17G>A genotype-phenotype signal on the GJB1 genetic entry, and a grounded VERY_FREQUENT frequency on distal weakness from the 85 percent male walking-difficulty figure. Declined to add the report's greater-than-90-percent figure, which is the report's own table and not traceable to a quotable source sentence. Added an environmental entry linking described CNS-episode triggers to the oligodendrocyte node with environmental_effect TRIGGERS, graded PARTIAL because the cited case states the mechanism is unproven. Connected the previously disconnected oligodendrocyte node and the terminal neuropathy node to their phenotypes. Split the episode phenotype so HP:0002401 Stroke-like episode names the event and HP:0001260 Dysarthria names the symptom. Replaced CL:0000540 neuron with CL:0000101 and CL:0000100 at four sites, changed the gap-junction modifier from LOSS_OF_FUNCTION to DECREASED to keep PATO grounding, replaced a background-biochemistry snippet with the study's actual finding, added a GeneReviews references block and a cochlear implantation treatment grounded on the CMTX5 case in the series. Did not change kb/disorders/Charcot-Marie-Tooth_Disease_Type_1.yaml: its inclusion of CMTX1 is argued in prose in three places rather than being a filing slip, so it is a curation disagreement for a human to settle, and @cmungall was assigned. Validated with just validate-disorders (60/60 snippets verified), validate-terms, check-entity-refs, check-duplicate-keys, the snippet gates, and 14604 structural and conformance tests.

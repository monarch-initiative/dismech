  summary: 'Create: Charcot-Marie-Tooth Disease Type X'
  details: |
    De-novo curation of the X-linked CMT compartment (MONDO:0018994) as a Disease with per-locus has_subtypes, following the existing CMT1/CMT2/CMT4 precedent in kb/disorders/. Deep research: OpenScientist (research/Charcot-Marie-Tooth_Disease_Type_X-deep-research-openscientist.md, 26 citations, 1013s). The report corrected two things the first-pass entry had wrong from background knowledge. First, skewed X-inactivation as the explanation for female phenotypic variability, which the only direct measurement in affected nerve refutes (PMID:40759929); the entry now declines to assert it and carries the refuting evidence. Second, the axon-versus-myelin ordering, where Gjb1-null mouse data (PMID:20720503) place axonal pathology upstream of demyelination against the human electrophysiological reading (PMID:15468313); recorded as a HUMAN_MODEL_MISMATCH discussion rather than silently picking a side. Two PMIDs recalled from memory during drafting were wrong and were caught by fetching before use: 17470752 is a multiple sclerosis prevalence survey and 17701896 is the Arts syndrome paper, not CMTX5. All PMIDs were subsequently resolved via PubMed E-utilities and verified by title. One report citation (PMID:42017539) was dropped as off-topic: it concerns NEFL-associated CMT, not CMTX. Conformance declared to schwann_cell_myelin_maintenance (two nodes) and peripheral_axonal_degeneration (two nodes). Validated with just validate-disorders (45/45 snippets verified), just validate-terms, check-entity-refs, check-duplicate-keys, the snippet-grading/title/length gates, and pytest (2503 conformance plus 9790 structural tests).

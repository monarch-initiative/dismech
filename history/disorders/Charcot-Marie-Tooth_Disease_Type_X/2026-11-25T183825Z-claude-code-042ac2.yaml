  details: |
    Bound the CMTX4 subtype to MONDO:0010689 (Charcot-Marie-Tooth disease X-linked recessive 4), matching the other bound CMTX subtypes. Recorded the AIFM1 record's germline origin and X-linked recessive inheritance. The redox node bound NADH dehydrogenase activity (GO:0003954) with no modifier; set ABNORMAL, since p.Glu493Val AIF is reduced by NADH faster and forms a less stable charge-transfer complex rather than losing the activity (PMID:23217327).

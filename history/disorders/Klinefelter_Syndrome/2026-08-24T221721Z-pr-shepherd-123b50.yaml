  details: |
    Addressed review SUGGESTION 5 on PR #9370 (ai4c-reviewer re-review, 2026-08-24T14:55Z).

    The `Reduced Muscle Tone` phenotype kept `frequency: OCCASIONAL` after its evidence item was removed earlier in this PR, leaving the band with no source while the record's own notes declared the evidence gap. Per the frequency-evidence SOP, a band is a separate quantitative claim from the disease-phenotype association and needs its own evidence; when none is available the band is omitted rather than justified after the fact.

    Removed the band and recorded in `notes` why it is absent, that its removal was a consequence of the earlier evidence deletion rather than a judgement that hypotonia is rare, and that OCCASIONAL likely understated infantile hypotonia in 47,XXY. A band should be restored only alongside a quantitative source.

    No other change to this entry; the earlier micropenis, prevalence, title-snippet and leaked-email fixes in this PR are untouched.


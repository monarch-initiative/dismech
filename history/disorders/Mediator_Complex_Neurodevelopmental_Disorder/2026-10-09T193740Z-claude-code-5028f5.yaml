  summary: Add MED12-COMPASS H3K4 methylation mechanism from PMID:39663454
  details: |
    Added one molecular pathophysiology node, MED12-COMPASS H3K4 Methylation Failure, recording that MED12 associates with the COMPASS histone methyltransferase complex (SETD1A, CXXC1) and is required for H3K4 methylation and expression of its target regulator genes. Source: Arce et al., Nature 2025 (PMID:39663454), CRISPR screens and immunoprecipitation-mass spectrometry in primary human CD4+ T cells.

    Why it was added here rather than to a MED12 disease entry: no entry in kb/ previously mentioned COMPASS, H3K4, SETD1A or CXXC1 (grep over Mediator_Complex_Neurodevelopmental_Disorder, FG_Syndrome_1, CDK8-Related_Disorder and Blepharophimosis_Intellectual_Disability_Syndrome_MKB_Type returned nothing), so the chromatin route MED12 uses was absent from the Mediator pathograph. The node sits downstream of CDK8 Kinase Module Dysfunction and upstream of Neurodevelopmental Transcriptional Dysregulation; its genes: MED12 descriptor also auto-links it from the MED12 Hemizygous Variants genetic record, giving it two inbound edges. Confirmed with dismech.graph.build_causal_graph that the node carries inbound and outbound edges and that orphan_targets is empty.

    Lineage caveat, recorded in the node notes and as discussion med12_compass_neural_lineage (KNOWLEDGE_GAP): every experiment behind the MED12-COMPASS interaction was done in primary human CD4+ T cells studying IL-2Ra regulation, and the MED12-dependent genes it names (KLF2, MYC, GATA3) are not the neurodevelopmental regulators this entry's phenotypes run through. Evidence is therefore graded IN_VITRO, and the downstream edge to Neurodevelopmental Transcriptional Dysregulation is supported by a separate source for its neurodevelopmental half (PMID:34803610, which identifies CXXC1 as the targeting module guiding H3K4me3 deposition, and whose subject SETD1A haploinsufficiency independently causes developmental delay, intellectual disability and early-onset epilepsy) rather than by extrapolating from the T cell experiments. The edge from CDK8 Kinase Module Dysfunction is scoped in its description to the MED12 scaffold subunit and is not asserted for the other CKM components; the node description records that the mechanism was shown for MED12 loss of function and not for the recurrent missense alleles that act by impairing MED12-CDK8 association.

    Deliberately not changed: FG_Syndrome_1 was considered and left alone. Its lesion is the recurrent p.R961W missense, which acts by impairing MED12-CDK8 association, whereas the COMPASS result comes from MED12 knockout; applying a loss-of-function chromatin mechanism to a missense allele is not supported by the source. Whether those alleles retain the COMPASS interaction is recorded as part of the knowledge gap instead.


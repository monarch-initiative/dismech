  summary: Reconcile corpus callosum frequency band with FG_Syndrome_1
  details: |
    Cross-entry consistency fix accompanying the creation of FG_Syndrome_1 (PR #7254, commit 96a5d831). The corpus-callosum phenotype on the MED12 subtype was banded OBLIGATE with the explanation "13/13 mutation-confirmed individuals places corpus callosum anomalies in the OBLIGATE band for the characterized FG syndrome cohort", citing the Clark 2009 datum (PMID:19938245). The new FG_Syndrome_1 entry curates the identical datum and bands it VERY_FREQUENT, on the grounds that the 13 individuals are the imaged subset of a 23-male cohort and n=13 does not license an assertion of invariance. Two entries asserting different bands from one sentence is a contradiction the new entry introduced, so it was reconciled here rather than deferred: frequency changed OBLIGATE -> VERY_FREQUENT and the explanation rewritten to state the departure from the default 100%-to-OBLIGATE mapping explicitly, with a cross-reference to FG_Syndrome_1.yaml so the shared reasoning is discoverable from either side. The evidence item, snippet, and reference are unchanged. Raised as finding 2 of the ai4c-reviewer round-1 review, which judged the FG_Syndrome_1 reasoning to be the correct one and asked for the older entry to be brought into line within this PR. No other content in this file was touched. Validated with `just validate kb/disorders/Mediator_Complex_Neurodevelopmental_Disorder.yaml` (schema, term, and reference validation all pass); 109/109 evidence snippets in the file verified exact against the committed cache.

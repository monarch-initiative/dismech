  summary: Expand mediatorpathy grouping with nine new module subtypes
  details: |
    Comprehensive literature-driven expansion of the Mediator Complex
    Neurodevelopmental Disorder grouping to cover the full germline "MEDopathy"
    spectrum. Nine new molecular subtypes added, each with a verified defining
    evidence snippet:
      - CDK8, kinase subunit of the CDK8 kinase module -> IDDHBA (PMID:30905399)
      - CDK19, paralogous kinase -> DEE87, epilepsy-predominant (PMID:32330417)
      - MED12L, scaffold paralog -> Nizon-Isidor syndrome (PMID:31155615)
      - MED11, head module -> lethal NDDRSB (PMID:36001086)
      - MED17, head module -> MCPHA / infantile cerebral+cerebellar atrophy (PMID:20950787)
      - MED20, head module -> provisional infantile basal ganglia degeneration (PMID:25446406)
      - MED27, structural core -> NEDSCAC (PMID:33443317)
      - MED25, tail module -> Basel-Vanagaite-Smirin-Yosef syndrome (PMID:25792360)
      - MED16, tail module -> Guillouet-Gordon syndrome, new 2025 gene (PMID:40081376)
    The existing MED12 subtype was enriched to model its full X-linked allelic
    series: FGS1 discovery (PMID:17334363), the GLI3/Sonic-Hedgehog mechanism
    shared by FG and Lujan (PMID:23091001), X-linked Ohdo/Maat-Kievit-Brunner
    (PMID:23395478), female-specific Hardikar syndrome (PMID:33244166), and the
    female syndromic NDD (PMID:33244165). A new "Core Module Disruption
    (Head, Structural, and Tail)" mechanism node was added for the recessive
    core-complex forms, and the CDK8-kinase-module node was expanded to include
    CDK8/CDK19/MED12L.

    Validation and anti-hallucination discipline:
      - All 18 new PMIDs were fetched via `just fetch-reference`.
      - All 23 new evidence snippets were programmatically confirmed to be exact
        whitespace-normalized substrings of the fetched abstracts (0 failures).
      - All MONDO subtype terms were verified via OAK by OMIM cross-reference;
        the MONDO IDs proposed by the research agents were ALL incorrect (mapped
        to unrelated diseases) and were discarded.
      - `just validate` (schema + term + reference) passes; subtype foreign-key
        and unique-name tests pass.

    Deliberate exclusions:
      - CCNC (cyclin C): no verified germline neurodevelopmental disorder; its
        only germline human disease link is a CCNC+PRDM13 duplication causing
        North Carolina macular dystrophy. Not the same as CCNK (cyclin K).
      - MED25-CMT2B2 (Charcot-Marie-Tooth 2B2): formally reassigned to PNKP
        (PMID:30039206); excluded from MED25 modeling and flagged for a
        follow-up correction to Charcot-Marie-Tooth_Disease_Type_2.yaml.
      - MED14: emerging/provisional single-family X-linked association; left as
        a candidate note in the companion survey, not modeled as a subtype.
      - Somatic MED12 exon-2 tumor mutations remain in their existing tumor
        entries (Uterine_Leiomyoma, Breast_Fibroadenoma).

    A companion landscape survey with the full gene/module/OMIM/MONDO gap table
    and verified PubMed anchors was added at
    docs/reports/mediator-complex-disorders-landscape-2026-07-30.md.

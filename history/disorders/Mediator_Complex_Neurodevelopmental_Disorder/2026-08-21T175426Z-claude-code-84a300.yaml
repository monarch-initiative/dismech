  details: |
    Rebuilt PR #8832 on top of current origin/main (the branch was 1,473 commits
    stale) and addressed the ai4c-reviewer/ai4c-agent review, per the maintainer's
    chosen approach:

    Architecture decisions (maintainer-approved):
    - Dropped this branch's MED13L_Syndrome.yaml: main independently added a larger
      (3,006-line) MED13L_Syndrome.yaml binding the same MONDO:0014773; main's entry
      is authoritative. (Resolves review CRITICAL 1.)
    - Dropped MED12_Related_Disorders.yaml (umbrella): main covers MED12/FG via
      per-subtype standalone entries (FG_Syndrome_1, FG_Syndrome_4); the umbrella's FG
      subtype collided on MONDO:0010590. (Resolves review item 7 / MED12 GeneReviews.)
    - Kept the 8 net-new standalone entries (CDK8, CDK19, MED25/BVSYS, MED27, MED17,
      MED11, MED16/GGNS, MED12L/Nizon-Isidor), the grouping expansion, the landscape
      survey, and the CMT2B2->PNKP correction; all are pure additions or clean 3-way
      merges onto main.

    CRITICAL 2 (MAXO removed in #7228) and CRITICAL 3 (17-path conflicts) are resolved
    by rebasing onto main; the MAXO->NCIT speech-therapy remap (bot commit 3f49eb2) is
    preserved in Nizon-Isidor.

    Content fixes (IMPORTANT items):
    - Item 4 (frequency stratification): CDK19 and MED17 bands re-derived from
      quantitative cohorts (PMID:33495529: DD/facial universal, hypotonia 79%,
      seizures 64%, ophthalmologic 64%, autism 56%; PMID:33756211: all-patients MED17
      cohort of 15/11 families). Unsupported narrative-only bands omitted in BVSYS,
      MED27, MED11, CDK8 (kept count-backed CHD), and Nizon-Isidor (kept all-patients
      ID/speech). Guillouet-Gordon already fixed upstream.
    - Item 8: added MED11 neonatal respiratory failure phenotype (HP:0002878),
      notes-based provenance since the abstract has no verbatim quote.
    - Item 9: added BVSYS polymicrogyria (HP:0002126, PMID:32816121) and the p.Ile173Thr
      founder citation (PMID:30800049).
    - Item 10: cited PMID:33495529 (LoF/GoF) + PMID:33568421 (infantile spasms) for
      CDK19, and PMID:33756211 for the MED17 additional-families note.
    - Items 6/7 (GeneReviews / MED12 subtypes) are moot after dropping MED13L/MED12.
    - Item 5 (treatments without evidence) left as standard-of-care: the gene-discovery
      sources carry no treatment-specific recommendations to cite; noted in PR reply.

    All snippets re-verified as exact substrings; every changed file passes
    schema/term/reference validation against main's current schema.

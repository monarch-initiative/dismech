  summary: 'Create: GRIN2A-Related Epileptic Encephalopathy and Intellectual Disability
    (MONDO:0017325)'
  details: |
    De novo curation of the severe end of the GRIN2A spectrum (MONDO:0017325), kept distinct from the pre-existing milder GRIN2A epilepsy-aphasia entries (Landau-Kleffner_Syndrome, Self-Limited_Epilepsy_with_Centrotemporal_Spikes). NEC preflight: the OAK MONDO record confirmed GRIN2A as the causal gene (OMIM:245570 / OMIM:613971, ORPHA:289266), and the falcon deep-research report mentioned GRIN2A 58 times with no competing gene, so no named-entity confusion. The pathograph models the canonical domain-localization to functional-class to severity mechanism (mechanistic_hypotheses group grin2a_domain_localization_functional_class_severity, status CANONICAL) with parallel misTMD+Linker gain-of-function and null-or-misATD+LBD loss-of-function arms converging on dysregulated NMDA-receptor signaling, then splitting into cortical excitation-inhibition imbalance (conforms_to epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance), impaired activity-dependent synaptic maturation, and progressive cerebral parenchymal volume loss. Adds three variants with biophysical detail (p.Leu812Met, p.Asn615Lys, p.Ser644Gly), two knock-in mouse models, and the bidirectional precision-therapy pattern: memantine target_mechanisms INHIBITS the gain-of-function node while L-serine RESTORES the loss-of-function node, with REFUTE-tagged evidence recording the deterioration observed when L-serine was given in error to a gain-of-function patient. Three discussions: a KNOWLEDGE_GAP on whether functional class can be assigned early and reliably enough to be actionable, a HUMAN_MODEL_MISMATCH on the heterozygous knock-in mouse paradoxical induced-seizure resistance, and a KNOWLEDGE_GAP on the mechanism of the progressive atrophy (its causal edge is curated as INDIRECT_UNKNOWN_INTERMEDIATES). Review round 1 (ai4c-reviewer, CHANGES_REQUESTED) addressed: retagged the PMID:33420383 evidence item from HUMAN_CLINICAL to MODEL_ORGANISM (mouse study, background-framing snippet); bound disease_term on all three differential_diagnoses (MONDO:0009509, MONDO:1060142, MONDO:0700350, each OAK-verified) with granularity notes; mined the previously uncited on-topic full text PMID:33240831 in five places; cited PMID:23933819 on the SeLECTS differential and deleted the uncited review chapter PMID_38727899; added a GluN2A C-terminal-domain-truncation/mistargeting pathophysiology node (PMID:38050135), a Grin2a-knockout animal model whose transient anomalies counterpoint the progressive-atrophy discussion (PMID:30146685), a radiprodil treatment with target_mechanisms on the gain-of-function node, and the GeneReviews genetic-counselling transmission-risk/prenatal-testing sentences. Validation: just validate PASS, just validate-terms PASS, just validate-references PASS with 130/130 snippets verified against cached references; compliance 94.8% global / 95.4% weighted.

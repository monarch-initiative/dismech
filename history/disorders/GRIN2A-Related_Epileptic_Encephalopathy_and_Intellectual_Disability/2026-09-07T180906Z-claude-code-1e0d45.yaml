  summary: 'Phenotype review: GRIN2A-Related_Epileptic_Encephalopathy_and_Intellectual_Disability'
  details: |
    Reviewed all 18 phenotypes for snippet-claim consistency, HPO term optimality, and pathograph explanation against the cached full text of PMID:24839611 and the abstracts of the other cited sources. Rebound the EEG-discharge phenotype from HP:0010841 Multifocal epileptiform discharges to HP:0011182 Interictal epileptiform activity and renamed it, because the source describes generalized or lateralized frontally-predominant discharges, not multiple independent foci. Marked the Absent Speech and Cerebral Visual Impairment evidence directness INDIRECT and added corroborating index-case quotes; added a direct flinging-movements quote to Hyperkinetic Movement Disorder. Wired the pathograph: GRIN2A genes descriptors on the three variant-entry nodes (gene-to-mechanism 0/1 to 1/1), and 14 new downstream edges from the excitation-inhibition-imbalance, synaptic-maturation, dysregulated-signaling, and volume-loss nodes to 13 phenotypes (connectivity 0/18 to 13/18). Strengthened the existing hyperexcitability-to-atrophy edge with the authors' excitotoxicity attribution marked INDIRECT. Left Axial Hypotonia, Appendicular Hypertonia, Hyporeflexia, Hyperkinetic Movement Disorder, and Cerebral Visual Impairment deliberately unexplained and recorded a KNOWLEDGE_GAP discussion attached to all five, since no source localizes them to a circuit. All validation gates passed; 137/137 snippets verified.

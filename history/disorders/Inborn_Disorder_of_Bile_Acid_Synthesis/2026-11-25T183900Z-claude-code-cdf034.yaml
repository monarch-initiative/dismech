  summary: 'Gene-family review: AMACR, ACOX2'
  details: |
    The entry had no genetic records, and AMACR sat with five hepatic bile acid enzymes on a shared node that binds no molecular function. AMACR now has a genetic record for its BASD Type 4 subtype (CAUSATIVE, germline; PMID:37575761, PMID:10655068) and its own node binding alpha-methylacyl-CoA racemase activity (GO:0008111, DECREASED), which feeds the existing bile acid consequence node. ACOX2 deficiency, congenital bile acid synthesis defect 6 (MONDO:0015015), was absent from the KB; it is added as subtype BASD Type 6 with a genetic record and a node binding the C27 bile acid intermediate oxidase activity (GO:0033791, annotated to ACOX2 by GO from PMID:27884763) and pristanoyl-CoA oxidase activity (GO:0016402), citing the purified human enzyme (PMID:8387517), its substrate specificity (PMID:29287774) and the patient reports (PMID:27647924, PMID:27884763, PMID:29287774, PMID:35395098). ACOX2 is typed UNKNOWN because no external body has classified the pair. The five other subtype genes (HSD3B7, AKR1D1, CYP7B1, CYP27A1, BAAT) still have no genetic records and share the node without a molecular function.

  summary: Review and enrich Inborn_Disorder_of_Bile_Acid_Synthesis
  details: >-
    Audited Inborn Disorder of Bile Acid Synthesis (MONDO:0019218) and repaired its snippet_length baseline defect and truncated treatment snippet. Expanded short PMID:39702264 subtype snippets and PMID:25163551 glycocholic acid snippet to full verbatim sentences, and normalized PMID:38062451 reference_title strings verbatim. Enriched classifications with verified evidence and ICIMD bile_acid_metabolism category, and added RARE structured prevalence. Added five subtype-specific germline genetic entries (HSD3B7, AKR1D1, CYP7B1, AMACR, BAAT) paired with five atomic upstream MOLECULAR germline pathophysiology nodes carrying wild-type GO molecular_functions (GO:0003854, GO:0016491, GO:0008396, GO:0008111, GO:0003824) and GERMLINE genetic_context, factoring out the lumped multi-gene list from Hepatic Bile Acid Synthetic Enzyme Deficiency. Added biological_scale, UBERON locations, cholestatic_liver_injury module conformance, sourced downstream causal edges to phenotypes, treatment therapeutic_modality and target_mechanisms, and NCIT-grounded diagnosis entries including confirmatory genetic testing.

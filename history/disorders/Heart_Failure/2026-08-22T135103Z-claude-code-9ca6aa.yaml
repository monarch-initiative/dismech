  summary: 'Edit: endocrine drivers of HFpEF myocardial fibrosis from PMID:42602176
    (convergence, 11beta-HSD1, oestrogen withdrawal, MR escape)'
  details: |
    Used PMID:42602176 (Chaturvedi & Atreja, Front Endocrinol 2026, 'Endocrine regulation of cardiac fibrosis: implications for HFpEF') as the curation nucleus. The paper is a NARRATIVE REVIEW, not primary research, so every evidence item from it carries evidence_source: OTHER, matching this entry's existing convention for its review citations (PMID:33432192 and PMID:40892534 are already cited that way here).

    TARGET SELECTION. Heart_Failure.yaml already carries an HFpEF subtype and covers myocardial fibrosis inside its Ventricular Remodeling node, so this is an update to that entry rather than a new page. No new disorder entry was created and no existing content was rewritten or contradicted.

    WHAT WAS ADDED

    1. Pathophysiology node 'Endocrine Convergence on Shared Profibrotic Effectors' (MOLECULAR). The review's central structural claim: several endocrine axes converge on a small set of shared intracellular effectors - TGF-beta-Smad (GO:0007179, INCREASED), NADPH oxidase-derived oxidative stress (GO:0042554, INCREASED), and the NO-cGMP-PKG brake (GO:0038060, DECREASED) - so that blocking any single effector is rapidly bypassed. Downstream to Ventricular Remodeling. Four evidence items.

    2. Pathophysiology node 'Tissue Glucocorticoid Amplification by 11beta-HSD1' (TISSUE). An axis entirely absent from the entry: intracellular regeneration of cortisol from cortisone raises tissue glucocorticoid exposure without any change in adrenal secretion, and cortisol binds the mineralocorticoid receptor in non-epithelial tissue with affinity comparable to aldosterone. Terms: GO:0008211 glucocorticoid metabolic process (biological_processes), plus GO:0070524 and GO:0004883 in molecular_functions. Downstream to the convergence node.

    3. Pathophysiology node 'Postmenopausal Oestrogen Withdrawal' (ORGANISM). Explains the female predominance of HFpEF structurally rather than additively: oestrogen restrains RAAS, insulin resistance and the adipokine profile simultaneously, so its withdrawal disinhibits three axes in concert, alongside a direct myocardial antifibrotic and eNOS-supporting arm (GO:0030520, DECREASED). Downstream to the convergence node.

    4. Treatment 'Mineralocorticoid Receptor Antagonists' substantially extended. It was a one-line stub evidenced only by an HFrEF guideline citation, with no target_mechanisms. Now carries the mechanistic rationale for why an MRA is not redundant on top of an ACE inhibitor or ARB - chymase-dependent ACE-independent angiotensin II generation, aldosterone escape during chronic AT1 blockade, and ligand-independent Rac1-mediated MR activation driven by cortisol and reactive oxygen species - plus the FINEARTS-HF finerenone outcome result in mildly reduced and preserved ejection fraction with its hyperkalaemia caveat, therapeutic_modality SMALL_MOLECULE, and an INHIBITS target_mechanisms link to the convergence node carrying its own evidence.

    5. Discussion 'gap_hfpef_single_pathway_therapy_resistance' (KNOWLEDGE_GAP, OPEN), attaching to the three new nodes plus Ventricular Remodeling, with a structured proposed_experiment carrying decision_criterion / would_support / would_refute.

    EPISTEMIC HANDLING. The review grades its own axes and that grading was preserved rather than flattened. The 11beta-HSD1 node carries the review's verbatim statement that the evidence 'should be read as biologically plausible, not clinically established, and must not be conflated with demonstrated antifibrotic efficacy in HFpEF', and its notes record that no 11beta-HSD1 inhibitor has been tested against myocardial fibrosis, cardiac MRI extracellular volume, or HFpEF outcomes. The discussion rationale also states a weakness in the review's own argument that the review does not acknowledge: it offers the clinical success of SGLT2 inhibitors as validation that multi-axis intervention beats single-pathway targeting, but those agents were not designed or trialled as multi-axis therapy, so their pleiotropy is an after-the-fact characterisation rather than a test of the model.

    DELIBERATELY NOT DONE

    - No hormone-therapy treatment was added. The review attributes the WHI and HERS failures to systemic ER-alpha-mediated thrombotic risk and late initiation rather than to the antifibrotic biology, but that is an interpretation of negative trials, not demonstrated benefit; ER-beta-selective agonism remains preclinical. Recorded in the oestrogen node's notes, and the negative trials are NOT curated as refuting the mechanism either.
    - None of the emerging targets (11beta-HSD1 inhibitors, D3 deiodinase inhibitors, ER-beta agonists, anti-FGF23) is curated as a treatment.
    - SOURCE NOT FULLY CONSUMED, stated plainly rather than implied. The review covers seven endocrine axes. This session curated the convergence structure plus the two axes that were both entirely absent from the entry and mechanistically distinctive. Four axes remain uncurated: adipokine dysregulation and epicardial adipose tissue inflammation, insulin resistance, altered thyroid hormone signalling, and disordered mineral metabolism. Two of those are partly reachable through existing content (the entry has Neurohormonal Activation for RAAS and an SGLT2 inhibitor treatment bearing on the metabolic axis), but none is curated as its own node. This is a scope decision, not a judgement that the remaining axes lack merit, and it is flagged on the PR as available follow-up work.

    Validation run and read: just validate (passed, after one fix - GO:0004883 and GO:0070524 are molecular functions and were initially placed in biological_processes, where the BiologicalProcessTerm dynamic enum correctly rejected GO:0004883; both were moved to molecular_functions and GO:0008211 substituted as the process term); just validate-terms (passed); just count-verified-snippets (43/43 verified, up from 29 before this session); just validate-disorders on the changed file, the batched pre-PR sweep CI runs (schema, terms and references all passed, 43/43); just check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence, check-not4curation (all passed, no new findings); pytest tests/test_data.py -k Heart_Failure.yaml (18 passed). One YAML scanner error was introduced and fixed during editing (an unquoted explanation containing a colon); it never left the working tree.

    Cache changes committed with this work: cache/go/terms.csv and the biologicalprocessterm and molecularfunctionterm enum caches gained exactly the three new GO CURIEs (GO:0004883, GO:0038060, GO:0070524), written by linkml-term-validator and sorted by normalize-cache. Seven unrelated references_cache files rewritten as a side effect of just validate were reverted.

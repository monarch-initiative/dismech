  summary: Bind ESR1 and ESR2 on the myocardial oestrogen receptor signalling node
  details: |
    Fifth tranche of the estrogen-signalling pathograph work in issue #12925,
    the non-proliferative and ligand-supply cases. The Loss of Myocardial
    Oestrogen Receptor Signalling node bound GO:0030520 with modifier DECREASED
    and named no gene. It now carries genes: ESR1 (hgnc:3467) and ESR2
    (hgnc:3468) and a molecular_functions descriptor bound to GO:0030284
    nuclear estrogen receptor activity, modifier DECREASED.

    Why both paralogues. The node's own description and its cited source
    (PMID:42602176, already quoted on the node) name oestrogen receptor alpha
    and beta and assign them distinct arms: both suppress fibroblast
    proliferation and support endothelial nitric oxide synthase, and the brake
    on TGF-beta/CTGF collagen transcription runs through the beta receptor.
    Binding ESR1 alone would misattribute that arm to the wrong paralogue,
    which is the trap the issue names. The two genes have the same role on the
    node, receptors for the withdrawn ligand, so this is not the two-genes-
    different-roles shape that the gonadal record in the fourth tranche
    declined.

    Why a binding on a loss-of-signalling node, given the Triple_Negative
    decline in the third tranche. There the receptor is not expressed in the
    cell, so the gene does not participate in the mechanism and the ABSENT
    modifier carries the fact. Here the receptors are expressed and intact in
    the cardiac fibroblast and coronary endothelium, and it is their unliganded
    state after menopause that the node models; the genes name the effectors
    whose activity falls, which the DECREASED modifiers on the process term and
    the new molecular function state. A gene descriptor in this corpus names
    the gene the node is about and does not assert a variant, as the fourth
    tranche's endometrial records set out.

    Evidence. ESR1 is grounded by the review sentence already on the node,
    re-read from the cached full text of PMID:42602176 for this decision. ESR2
    gains a primary source, PMID:20810711, fetched and cached for this change:
    in ovariectomized mice, oestradiol prevents angiotensin II-induced cardiac
    fibrosis in wild-type but not ERbeta-knockout animals. Graded
    MODEL_ORGANISM, quote_role PRIMARY_RESULT, directness INDIRECT, since the
    model is peptide-induced fibrosis in mice rather than human HFpEF
    myocardium. Ovariectomy is the experimental counterpart of the upstream
    Postmenopausal Oestrogen Withdrawal node, so the direction of the evidence
    matches the direction of the claim.

    Deep-research reports for this disease (cyberian-codex, falcon,
    openscientist) were read before any external source was consulted. None
    names ESR1, ESR2 or either receptor protein, so the receptor-gene fact this
    decision turns on is not in them. PubMed was searched by title for the
    primary source; the search for estrogen receptor alpha with cardiac
    fibroblasts in the title or abstract returned nothing usable, which is
    another reason ESR1 rests on the review sentence.

    Checks: validate, validate-terms and count-verified-snippets passed on the
    file; validate-disorders over the whole tranche passed; list-gene-term-
    mismatches compared every gene binding in the four files against HGNC with
    none naming another gene; check_gene_activity_grounding against origin/main
    reports no newly ungrounded gene; check-enum-values, check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-qualifier-terms,
    check-folded-hyphens, check-snippet-length, check-title-snippets,
    check-snippet-grading, check-environmental-evidence and
    check-reference-titles passed with no new findings. GO:0030284 was already
    in both term caches, so no cache row changed.

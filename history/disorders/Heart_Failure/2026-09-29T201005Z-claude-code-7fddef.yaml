  summary: Take the two review suggestions from PR 13151 on the myocardial oestrogen
    receptor node
  details: |
    Two non-blocking suggestions from the review of #13151, carried here with the
    seventh tranche of issue #12925 because #13151 was already in the merge queue
    when they arrived.

    The molecular_functions descriptor for GO:0030284 on Loss of Myocardial
    Oestrogen Receptor Signalling gains a sentence saying the term names the
    receptor's own function and is not a claim that the lost signal is genomic
    only: the cited ovariectomy model (PMID:20810711) has the ERbeta antifibrotic
    effect running through cAMP and protein kinase A, a membrane-initiated route
    of the same receptor.

    The node's process and molecular-function wording already named the coronary
    endothelium while cell_types listed only the cardiac fibroblast. A second
    cell type, CL:0000115 endothelial cell with preferred_term Coronary
    Endothelial Cell, is added rather than narrowing the wording, because the
    node's cited review assigns oestrogen the upregulation of endothelial nitric
    oxide synthase in that compartment and the entry already bound the term
    elsewhere. No evidence item changed.

    Checks: validate, validate-terms and count-verified-snippets passed on the
    file after the edit; the offline gates run for the tranche passed.

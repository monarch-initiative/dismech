  summary: Conform the two oestrogen nodes to the menopausal estrogen withdrawal module
  details: |
    Added conforms_to on both oestrogen nodes, which map one for one onto the module's systemic and receptor nodes and are named as the worked conformers in the module's own description. Postmenopausal Oestrogen Withdrawal (ORGANISM) conforms to menopausal_estrogen_withdrawal#Systemic Estradiol Withdrawal; Loss of Myocardial Oestrogen Receptor Signalling (CELLULAR) conforms to menopausal_estrogen_withdrawal#Loss of Estrogen Receptor Signalling in the Target Tissue. Extended the first node's notes to say what the conformance claims: the hormonal state only, since the three profibrotic axes it names as disinhibited are cardiac content with no module counterpart.

    just check-conformance-content reports the receptor link clean on all four classes - it already binds GO:0030284 and GO:0030520, both of which the module node binds, the module node binds no cell type, and it carries a downstream edge. The systemic link reports process_absent because that node binds no ontology term at all, so there is nothing to compare rather than a divergent substitution. No module term was copied in to clear it: whether to ground that node is a separate curation question and the node's cited review does not name a hormone-level process.

    No other node was linked. The treatment-target nodes conform to their own drug-target modules and the profibrotic convergence node is cardiac fibrosis content, which the module explicitly leaves to this entry.

  summary: 'Create: Medullary_Sponge_Kidney'
  details: |
    New entry for MONDO:0015268 (Orphanet 1309), taken from the stub queue (stub deleted). The pick came after filtering the queue against every MONDO ID in open claim issues and open PRs. Also considered and rejected: LCA2, already covered by RPE65-Related_Retinopathy, which lumps LCA2, EOSRD and juvenile RP; and HMUOP2 (ATP5F1B), which rests on a single family. Deep research used the claude_code provider as requested (research/Medullary_Sponge_Kidney-deep-research-claude_code.md). All 29 of its references resolved. Its term suggestions were not reused: HP:0012622 is offered as Hypocitraturia but is Chronic kidney disease, and HP:0004735 is unresolved; HP:0012405 was used for hypocitraturia. Mechanism: a GDNF-RET developmental hypothesis, with SUPPORT from PMID:20448065 and 27573101 and REFUTE from the 2026 exome study PMID:41790480, leads to inner medullary collecting duct ectasia. That branches to urinary stasis and crystallization (biopsy series PMID:25615853), and to a distal acidification defect (PMID:3395796, 8203049). The acidification defect is refuted in the biopsy series and leads on to hypocitraturia, hypercalciuria and bone loss. An in-vitro osteogenic papillary-cell node carries SUPPORT and REFUTE. The chronic pain subgroup, CKD, potassium citrate, IVU/MDCT and ultrasound diagnosis, and prevalence (1/5,000 overall; 12% of recurrent stone formers) come from the report's leads and PubMed. The StatPearls chapter is tagged. A pre-PR review then made these changes. The exome study is described accurately as 42 patients plus a datastore screen, not a larger cohort. The papillary-cell binding moved from pericyte (CL:0000669) to stromal cell (CL:0000499), because the source calls the cells stroma-like and gives pericyte only as a possibility. The acidification-to-hypocitraturia and acidification-to-hypercalciuria edges were downgraded to indirect, since the only evidence is a correlation in 10 women. So was the stone-to-pain edge, since pain is often independent of obstruction. The two unevidenced edges, ectasia to acidification and osteogenic cells to nephrocalcinosis, now carry indirect evidence items. Frequency bands were removed for nephrolithiasis, nephrocalcinosis and dRTA, which have no unbiased denominator or conflict between series, and a DEXA-based band was added for reduced bone mineral density. Two background quotes are marked quote_role BACKGROUND. The misleading mGFR snippet was replaced, and a CKD stage 3a quote was added. The diagnosis terms are now NCIT:C17204 Computed Tomography and NCIT:C159885 Renal Ultrasound. Potassium citrate now targets hypocitraturia and hypercalciuria, and a stone-removal treatment was added. An unsourced H+-ATPase note was dropped. Validation: just validate-disorders passes, 46/46 snippets verified, and all gates are OK.

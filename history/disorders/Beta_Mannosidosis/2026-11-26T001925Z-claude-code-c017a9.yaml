  summary: 'Gene-family review: MANBA; add inheritance block and ClinGen tier'
  details: |
    Reviewed MANBA modelling: the deficiency node binds beta-mannosidase activity (GO:0004567) as decreased, matching the lysosomal exoglycosidase that removes the core beta-1,4-linked mannose in the last steps of N-glycan degradation, and the genetic record is CAUSATIVE and germline. The entry had no top-level inheritance block; it now records autosomal recessive inheritance (HP:0000007) quoting the GeneReviews chapter (PMID:42160655). The record already cited the ClinGen Definitive assertion for beta-mannosidosis (MONDO:0009562, the entry's own disease); that tier is now recorded in gene_disease_validity. Recent case series (PMID:42600418, PMID:41235131) confirm the variable phenotype the entry describes and do not change the modelling.

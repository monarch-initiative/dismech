  summary: Review beta-mannosidosis using full-text human and model evidence
  details: |
    Reviewed the complete baseline entry and legacy GENERAL history against the complete Falcon deep-research narrative and citation list, the local Cyberian supplement, and the disease-specific reference cache. The Falcon report is substantive but contains incorrect ontology identifiers and a misattributed diagnostic citation; the zero-second Cyberian artifact is a local inventory, not independent research. MANBA, MONDO:0009562 and OMIM 248510 pass entity preflight. No prior REVIEW or overlapping open disorder/history PR was present at selection. This genetic disorder remains in scope despite secondary infections.

    1. Phenotypes — adequate after changes. Expanded the auditory, behavioral, motor, skin, developmental and visceral spectrum to 26 findings. Literature frequencies use informative case reports, not an unbiased population denominator. The 74.4% aggregate hearing-loss estimate is not assigned as a sensorineural-specific frequency. Facial dysmorphism is 43.3% in the 2025 review; an older 80–99% catalogue label is not generalized. Abdominal-wall muscle hypoplasia remains a catalogue association without adopting an unsupported contemporary frequency. Added speech/language delay, hypomyelination, ataxia, hypotonia, peripheral neuropathy, erythromelalgia, specific behavioral findings, spasticity, visceromegaly, hydrocephalus and scoliosis. Confounded malformations in a highly homozygous premature child are not all assigned to MANBA. Broad facial and behavioral aggregates use SOURCE_UNSPECIFIED alongside specific findings. Dysphagia was already reported in 1997 despite the 2025 abstract calling it new.

    2. Subtypes — N/A. Human clinical severity varies, including within families; no well-supported discrete molecular subtypes emerged. Alpha-mannosidosis is a distinct enzyme/gene disorder, not a subtype. No subdivision by residual activity or phenotype severity is invented.

    3. Mechanisms, tissue and models — adequate after changes. Six atomic nodes separate MANBA enzyme deficiency, terminal N-glycan catabolic failure, substrate storage, lysosomal vacuolation, impaired myelination and esophageal dysmotility. Clinical consequences with unresolved mediators are explicitly indirect. Human skin ultrastructure and patient fibroblast/keratinocyte cultures are represented. COS-7 testing of three alleles showed no activity increase over mock, not absolute zero activity in every patient. Mouse storage and regional pathology are linked with background dependence; no specific modifier was mapped. The mouse fails to reproduce the human myelination finding seen in a subset. Human MRI does not demonstrate oligodendrocyte death, and mouse vacuolation does not automatically imply death of the same neurons. Goat findings, unpublished glial-reactivity data and general lysosomal-inflammatory hypotheses are not promoted to proven human mechanisms.

    4. Care and trials — adequate after changes. Eleven care records mine GeneReviews management and surveillance, including rehabilitation, hearing aids, nutritional support, symptom-specific drugs, hydrocephalus care, annual audiology and family evaluation. Transplant evidence comes from one cord-blood recipient: leukocyte enzyme correction and lower urine glycans did not establish sustained neurological efficacy. The 2025 report follows the same 2019 recipient, not a second independent treatment case; later motor regression and early memory decline qualify the original stabilization narrative. Methylphenidate is a case-level ADHD treatment, not a disease-modifying trial. The completed NCT01891422 study explicitly includes beta-mannosidosis but is observational and reports pooled glycoproteinosis enrollment. The live registry search also found generic CoRDS; no beta-specific interventional record was identified by these searches. Alpha-mannosidosis interventions are not transferred to MANBA deficiency.

    5. Genetics and inheritance — adequate after changes. Preserved definitive ClinGen validity and added GeneReviews recurrence-risk evidence. Distinguished regional c.2158-2A>G carrier sampling from global prevalence or penetrance; 13/345 selected normal-hearing Roma controls were heterozygous. One dual GJB2/MANBA diagnosis limits hearing attribution. The splice acceptor produces two abnormal RNAs, which alone do not prove residual enzyme function. Primary PMID:18565776 identifies c.375A>G as a synonymous DNA SNV causing a four-base RNA deletion; the later review's deletion notation is not treated as the genomic alteration. Three functional missense alleles are separate variant records. Observed VUS are not all labeled pathogenic. CTBS remains a knowledge gap, not an established human modifier. No disease-specific epigenetic or omics mechanism was supported.

    6. Biomarkers and diagnosis — adequate after changes. Enzyme testing remains the diagnostic gold standard with molecular confirmation/family evaluation. ManGlcNAc and NeuManGlcNAc support urinary profiling; NeuMan2GlcNAc2 in two severely affected patients is exploratory, not a validated prognostic marker. Pooled lysosomal-assay performance is not beta-mannosidosis-specific accuracy. Audiological assessment can require objective and behavioral methods. Imaging may be normal; three of six new patients had myelination abnormalities, while the historical 40% rate concerns six of 15 imaged cases, not all published patients. Added alpha-mannosidosis and fucosidosis differentials with biochemical confirmation rather than MRI-only diagnosis. Regional birth-prevalence estimates and published-case counts are separate measures.

    7. Reference consumption — adequate with stated access limits. Read complete scientific full texts and relevant tables for PMID:41235131, 32847582, 31115173 and 24142277. Read complete cached abstracts for PMID:12890191, 16377659, 9384606, 18565776, 9097826 and GeneReviews PMID:42160655. Attempted primary full texts where absent. The current GeneReviews chapter was previously untagged; its cached abstract is actively mined for clinical characteristics, diagnosis, management and counseling. Bookshelf HTML, reader/XML and PDF routes returned CAPTCHA, so those unusable cache artifacts are excluded. No full-chapter reading is claimed. The 2003 DOI remained unavailable; its PubMed abstract supports the skin findings. The 2024 mixed-lysosomal-disorder assay abstract does not identify a beta-mannosidosis validation sample and is not used for disease-specific sensitivity. All reference caches were generated/refreshed through repository fetch commands, never hand-edited. Titles were checked for disease, gene and claim relevance.

    8. Overall consumption — adequate. Central disease-specific omissions were incorporated; speculative CTBS effects and cross-species myelin differences are explicit discussions. No unverified data accession, regulatory target, immunodeficiency, retinal mechanism or treatment efficacy is invented. The source's inconsistent sex totals and splice-variant percentages are not silently recalculated into new claims. Existing review-process prose is removed from disease-facing notes. Validation passes schema/live ontology checks and verifies 121 snippets and 122 titles with none skipped or unavailable; additional content/history checks and commit hooks accompany the PR.

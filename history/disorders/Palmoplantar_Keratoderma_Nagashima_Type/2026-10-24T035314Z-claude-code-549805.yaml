  summary: 'Review round 2: record the ultrastructure conflict'
  details: |
    Addressed the round 2 suggestion on PR 15447. The keratinosome lamellar loss and corneocyte cleavage finding from one case (PMID:30581033) had been described as an ultrastructural correlate of the barrier defect, but the original series reports that transmission electron microscopy of NPPK skin showed no major defect in the granular layer or stratum corneum (PMID:24207119). The description now says the finding is from one case and is not established, and the conflicting sentence is added as a REFUTE item. Re-validated with just validate-disorders and check-snippet-grading.

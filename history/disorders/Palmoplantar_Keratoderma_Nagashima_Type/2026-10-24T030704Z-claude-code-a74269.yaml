  summary: 'Create: Palmoplantar Keratoderma Nagashima Type'
  details: |
    New entry for SERPINB7-related Nagashima-type palmoplantar keratosis (MONDO:0014272). Deep research ran with the claude_code provider (research/Palmoplantar_Keratoderma_Nagashima_Type-deep-research-claude_code.md); it rested on one full-text read and listed several sources without PMIDs. A PubMed search on SERPINB7 found the mechanistic papers the report lacked: legumain as the SERPINB7 target in Serpinb7-null mice (PMID:38909841) and the legumain to O-GalNAc glycosylation to tight junction route in keratinocytes and keratinocyte-specific knockout mice (PMID:41469525), plus the plantar dysbiosis and benzoyl peroxide study (PMID:41338335), the two gentamicin ointment studies and their ChiCTR registrations (fetched as ICTRP records), a 380-patient Chinese genetic cohort (PMID:42384829), and a 2025 review (PMID:39749860). The pathophysiology is an atomic chain from SERPINB7 truncation to loss of inhibitory activity, legumain overactivation, two branches (glycosylation then tight junctions; cytoskeletal weakening) converging on the epidermal barrier defect and the water sign, with reduced differentiation and plantar dysbiosis as separate nodes. Hyperkeratosis and erythema are deliberately left without an incoming edge because no source links the barrier defect to them; this is recorded as a knowledge-gap discussion. The DOI-only Acta Derm Venereol 2016 case report the report cited was not used because its content is unavailable in the cache. Validated with just validate-disorders (0 issues) and the offline whole-repo gates.

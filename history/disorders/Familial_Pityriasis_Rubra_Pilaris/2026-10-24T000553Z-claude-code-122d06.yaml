  summary: 'Review round 1: Familial Pityriasis Rubra Pilaris'
  details: |
    Answered the first automated review of PR 15418. The topical-therapy REFUTE item that sat under the etanercept treatment was moved to its own Topical therapy treatment record bound to CHEBI:50858 corticosteroid. A Methotrexate treatment record was added, citing the 15-kindred series (PMID:29477734) full text for its variable and generally inadequate response. Bimekizumab (NCIT:C171829) was added as a third therapeutic agent on the IL-17 blockade row with the pooled-literature sentence from PMID:40433052 graded REVIEW_SYNTHESIS, and the row renamed IL-17 blockade. The 9-of-10-biopsies figure, which came from the deep-research report rather than the cached abstract of PMID:31849081, was softened to the abstract's consistently. The knowledge-gap rationale was reworded to state only what the cited functional studies do and do not compare. Declined: splitting the PMID:30018619 item by evidence_source, because its single sentence cannot be divided into two substantive quotes and repeating it under two grades would trip check-snippet-grading; and replacing the p.Leu156Pro snippet, because PMID:22703878 full text is not in PMC (publisher-free access only). Validated with just validate-disorders (107 of 107 snippets), validate-terms, check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys and check-block-scalar-comments.

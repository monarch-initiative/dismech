  summary: 'Create: Familial Pityriasis Rubra Pilaris'
  details: |
    De novo curation of the CARD14-defined familial (type V) form of pityriasis rubra pilaris (MONDO:0008251, OMIM 173200), scoped to the gain-of-function CARD14 disease and mapped to the broader PRP concept (MONDO:0100017) only as skos:broadMatch; the sporadic Griffiths types are stated as out of scope. Sources: a Falcon deep-research report (research/Familial_Pityriasis_Rubra_Pilaris-deep-research-falcon.md, preflight-dr PASS on CARD14/OMIM 173200) used as a lead, with every claim re-grounded in cached PubMed abstracts: the 2012 gene-discovery paper (Fuchs-Telem, PMID:22703878), the PSORS2 allelism paper (PMID:22521418), the CAPE 15-kindred series (Craiglow, PMID:29477734) and its histopathology companion (PMID:31849081), the paediatric CAPE review (PMID:34448248), the Japanese type V series (PMID:27760266), the CBM biochemistry papers (PMID:27071417, PMID:27113748), Card14 knock-in mouse studies (PMID:29689250, PMID:29980436, PMID:32597759, PMID:33419765, PMID:32343482) and the Card14 C127S PRP-allele mouse (quoted from the 2023 Research Square preprint DOI:10.21203/rs.3.rs-2513325/v1 because the J Invest Dermatol abstract, PMID:39159782, has no cached content), the revertant-mosaicism study (PMID:34004138), and ustekinumab, secukinumab, ixekizumab and acitretin case reports or series in genotyped patients. Pathograph: CARD14 GOF variant (GO:0035591 signaling adaptor activity, GAIN_OF_FUNCTION) -> constitutive CBM complex (GO:0032449) -> keratinocyte NF-kappaB hyperactivation -> keratinocyte chemokine/cytokine production -> IL-23/IL-17 axis amplification -> epidermal hyperproliferation and abnormal cornification -> six dermatologic/histopathologic phenotypes, plus a replication-stress revertant-mosaicism side branch. Pruritus and patchy hyperpigmentation are deliberately left unconnected. Two animal models carry modeled_mechanisms with the homozygous-mouse versus heterozygous-human caveat recorded as a HUMAN_MODEL_MISMATCH discussion. Treatments: ustekinumab, IL-17A blockade, systemic retinoids, etanercept (documented poor response) and preclinical MALT1 inhibition, each with target_mechanisms. No ORPHA record exists for the familial form and ClinGen has not classified CARD14-PRP, so no structured-source rows or gene_disease_validity are recorded; check-genereviews reports no GeneReviews chapter. Validation: just validate-disorders (104/104 snippets verified, 0 issues), validate-terms passed, check-gene-activity-grounding does not list the entry, plus the offline entity-ref, causal-target, duplicate-key, qualifier-term, coarse-phenotype, enum-value and block-scalar gates. Stub stubs/Familial_Pityriasis_Rubra_Pilaris.yaml set to entry_type DISEASE and deleted.

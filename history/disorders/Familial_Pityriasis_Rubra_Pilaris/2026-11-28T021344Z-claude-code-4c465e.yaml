  summary: 'Phenotype curation pass: Familial Pityriasis Rubra Pilaris'
  details: |
    Phenotype pass from cached full texts (PubMed, Europe PMC and OLS were blocked by the network proxy; fetch-reference PMID:27760266 --force also failed). Added seven phenotypes: Arthritis (HP:0001369, 3 of 15 index cases, PMID:29477734), Scleroderma-like changes of the hands (HP:0100324, 2 of 15 and 6% of 31 paediatric cases), Ridged nail (HP:0001807, PMID:28301045), Painful skin fissures (HP:0031057) and Lichenification (HP:0100725) from the p.Met119Lys family (PMID:41798160), and two histopathology phenotypes, Psoriasiform epidermal hyperplasia (HP:0025092) and Superficial dermal perivascular lymphocytic infiltrate (HP:0031190). Enriched follicular hyperkeratosis, palmoplantar keratoderma, orange-red plaques, facial erythema, erythroderma, ectropion and parakeratosis with counts from the Chinese 8-patient series (PMID:40433052) and further case evidence. Fixed the Pruritus evidence: the old snippet counted 8 of 10 pooled IL-17-treated patients, not 8 of 8 in the series; replaced with the series' own 6 of 8. Wired three new phenotypes into the pathograph (acanthosis and fissures from the epidermal node, the dermal infiltrate from the chemokine node). HP terms taken from cache/hp/terms.csv and confirmed in the phenotypeterm enum cache. Validated with just validate-disorders (135 of 135 snippets), validate-terms, check-causal-targets, check-coarse-phenotypes, check-name-collisions, check-entity-refs, check-enum-values, check-duplicate-keys, check-block-scalar-comments, check-snippet-grading and check_snippet_length.

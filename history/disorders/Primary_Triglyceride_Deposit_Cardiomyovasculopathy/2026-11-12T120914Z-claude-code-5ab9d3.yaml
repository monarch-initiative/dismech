  summary: Review and enrich Primary_Triglyceride_Deposit_Cardiomyovasculopathy
  details: |
    Grounded PNPLA2 (hgnc:30802) with triacylglycerol lipase activity (GO:0004806), added CARDIOVASCULAR, ENDOCRINOLOGY_METABOLISM, and ICIMD glycerolipid_metabolism classifications, expanded pathophysiology to 4 multi-scale nodes including impaired LCFA utilization and diffuse concentric triglyceride-deposit coronary atherosclerosis, added Orphanet and JCAD evidence for skeletal myopathy, ventricular arrhythmia, and Jordans anomaly, and added diagnostic criteria and tricaprin mechanism links.

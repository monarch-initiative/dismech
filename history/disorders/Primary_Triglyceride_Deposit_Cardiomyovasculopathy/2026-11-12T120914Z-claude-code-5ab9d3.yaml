  summary: Address Round 1 review findings on Primary_Triglyceride_Deposit_Cardiomyovasculopathy
  details: |
    Replaced idiopathic-TGCV snippets on Cardiomyopathy and Coronary artery disease with primary-TGCV Orphanet annotations, replaced heart-failure snippet on Myocardial and Coronary Triglyceride Accumulation with ORPHA:565612 increased muscle lipid content, rebound Skeletal myopathy to HP:0003756 and Congestive heart failure to HP:0009805 (Low-output congestive heart failure), added Frequent and Very frequent Orphanet phenotypes (Increased muscle lipid content, Angina pectoris, Dyspnea, Palpitations, Elevated circulating creatine kinase activity, Diabetes mellitus, Hepatomegaly, Hyperlipidemia) plus Orphanet arrhythmia frequency support, split 123I-BMIPP myocardial scintigraphy (NCIT:C62667) from ATGL enzymatic activity assessment (NCIT:C25294), upgraded vascular smooth muscle cell bindings to CL:0000359, and added quote_role and beta-oxidation / investigational tricaprin notes.

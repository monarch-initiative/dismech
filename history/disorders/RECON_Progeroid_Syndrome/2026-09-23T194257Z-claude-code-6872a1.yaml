  summary: 'Create: RECON_Progeroid_Syndrome'
  details: |
    Created RECON_Progeroid_Syndrome (MONDO:0957266; RECQL, autosomal recessive) from the stub, as a single DISEASE entry. Lump/split: the entry covers only the biallelic progeroid disorder; the heterozygous RECQL breast-cancer susceptibility claim is recorded as a CONTROVERSY discussion attached to genetic#RECQL, never as a phenotype.

    Sources. The whole clinical and mechanistic record comes from one primary report of three girls in two families (Abu-Libdeh et al. 2022, PMID:35025765, full text cached from PMC) and one perspective by the same group (Datta et al. 2023, PMID:36805074). Mouse data: Sharma et al. 2007 (PMID:17158923). Breast-cancer lead: Cybulski et al. 2015 (PMID:25915596). 96/96 snippets verified against the cache.

    Deep research: one run, requested falcon, which returned HTTP 402 (out of credits); the claude_code fallback wrote research/RECON_Progeroid_Syndrome-deep-research-claude_code.md (fell_back: true, requested_provider: falcon). Reference validation 7/7 resolved, needs_review true. Term validation needs_review true (two obsolete terms, and the report calls MONDO:0957266 "MONDO"). just preflight-dr returned WARN because RECQL4 appears in the report's differential; gene RECQL and OMIM 620370 match MONDO, so the report describes the right disease.
    Problems found in the report and not used: (1) it cites PMID:36907310 as the RECON review (PMC10018417); that PMID resolves to an unrelated lung-injury paper; the review is PMID:36805074. (2) It attributes the discovery paper to "Arboleda-Velasquez lab / Sturzenegger et al."; the authors are Abu-Libdeh ... Stewart GS. (3) It says GenCC lists RECQL-RECON as "Disputed Evidence" (Labcorp). The GenCC submissions export downloaded 2026-09-23 shows Labcorp Limited (2023-07-13) and PanelApp Australia Moderate (2025-01-17); Disputed applies only to the breast-cancer assertions (ClinGen 2023-03-13, Ambry 2022-08-15). (4) Its suggested HP IDs were not used; every term was looked up separately (HP:0009062, which it proposed for decreased subcutaneous fat, is obsolete infantile axial hypotonia). (5) Anemia and dental crowding (listed by MedGen/Monarch and in the claim-issue bot comment) are not in the cached article text; Table 1 of the article is an image in the PMC XML, so they were not added. The claim-issue bot comment also named the wrong authors for PMID:36805074 (it gave Niedernhofer & Robbins).

    Structured sources: no ClinGen curation of RECQL-RECON; no Orphanet disorder record in the pinned Orphadata en_product1.xml (grep for RECON/RECQL returned no match); no GeneReviews chapter (just check-genereviews --online: NO_CHAPTER). The ClinGen breast-carcinoma assertion is named in notes but not cached, because the downloaded ClinGen CSV does not match the checksum pinned in data/clingen/MANIFEST.yaml.

    Pathograph: variant -> reduced ATPase/helicase -> fork restart defect (plus fork degradation) and impaired topoisomerase-break repair -> chromosomal instability -> the cellular phenotypes (chromosome breakage, mild SCE increase). No edges were drawn from the cellular nodes to clinical phenotypes because no source demonstrates that link; a KNOWLEDGE_GAP discussion records it. Topoisomerase-break repair node conforms to genomic_instability_aging#Declining Genome Maintenance and Erroneous Repair. A HUMAN_MODEL_MISMATCH discussion covers the phenotypically normal Recql-null mouse. No treatments section: nothing is published.

    Validation: just validate, validate-terms, count-verified-snippets (96/96), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches (0 findings), check-reference-titles, check-genereviews --online, and the whole-KB offline checks; just validate-disorders run before push.

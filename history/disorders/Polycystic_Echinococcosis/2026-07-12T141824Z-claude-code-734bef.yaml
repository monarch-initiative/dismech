  summary: 'Review: fix wrong-disease citation (E. granulosus vs E. vogeli) and re-anchor'
  details: |
    Manual claim-vs-evidence review of the whole entry. CRITICAL fix: PMID:33553405 described the WRONG disease (Echinococcus granulosus CYSTIC echinococcosis, a Xinjiang HCC-co-occurrence case report), not neotropical E. vogeli POLYCYSTIC echinococcosis; 'polycystic' there was only a radiologic descriptor of a WHO-IWGE type II hydatid cyst. Its snippets substring-validated, so only the semantic identity check caught it (an NEC failure mode). Removed PMID:33553405 from all six places it anchored (3 pathophysiology nodes, the hepatic-lesion phenotype, the resection treatment, the HCC differential) and re-anchored on authentic E. vogeli sources already cached in the entry: D'Alessandro & Rausch CMR review (DOI:10.1128/cmr.00050-07), the Amazonian light/SEM pathology paper (DOI:10.1590/s1678-9946202567069), and the Acre neotropical-echinococcosis case (PMID:41431593). Added a VERY_FREQUENT hepatic-involvement band backed by the review's 81% figure. Fixed prevalence overreach (prevalence_class COMMON to RARE, added measure_type CASES_IN_LITERATURE, dropped deprecated free-text percentage, corrected 'We compiled' to 'we compiled' to match the cache). Re-mapped the thoracic collection from HP:0025044 Lung abscess to HP:0011919 Pleural empyema (the abscess fistulized into the pleural space, not lung parenchyma) and dropped an unsupported GO:0030198 ECM-organization process. Removed the HCC differential (built solely on the wrong-disease case). All re-anchored snippets verified as exact whitespace-normalized substrings of their caches; schema and term validation pass (only the pre-existing MONDO:0000288 dynamic-enum reachability error remains, filed as #6310).

  summary: Add agent_life_cycle (bush dog/paca sylvatic cycle) and praziquantel treatment
  details: |
    Closed two items from tracker issue #6309's Polycystic_Echinococcosis row: (1) added a structured agent_life_cycle block (bush dog Speothos venaticus and domestic dog Canis lupus familiaris as definitive hosts, paca Cuniculus paca as intermediate host, human as accidental host, plus a life_cycle_stages entry for the paca stage), sourced from the already-cited PMID:41431593 case report; (2) added a standalone Praziquantel (adjunct combination therapy) treatment entry bound to CHEBI:45267, reusing the already-cited PMID:34034501 hydatid-disease review sentence that names praziquantel as an albendazole adjunct (previously only mentioned inside the Albendazole treatment's evidence, not curated as its own treatment). No new references fetched; both PMIDs were already cached and cited elsewhere in the file. Resolved a cross-file evidence_source inconsistency flagged by just check-snippet-grading across the three items that quote overlapping spans of the same background paragraph of PMID:41431593 (agent_life_cycle.evidence[0], environmental[0].evidence[0], transmission[0].evidence[0]). The first pass aligned the new agent_life_cycle citation upward to the HUMAN_CLINICAL grade the pre-existing items carried, which kept the gate green but asserted something false: those sentences are parasite host-range and transmission biology and carry no human clinical observation. On PR review all three were instead set explicitly to evidence_source: OTHER with quote_role: BACKGROUND, which is both correct and internally consistent, and matches how the sister sentence from the same paper (life_cycle_stages[0].evidence[0], the paca-viscera sentence) was already graded. Note that environmental[0].evidence[0] and transmission[0].evidence[0] previously carried no explicit evidence_source and were inheriting HUMAN_CLINICAL from check_snippet_grading.GRADING_DEFAULTS; they now state the grade explicitly. Validated with just validate, just validate-disorders, just check-duplicate-keys, just check-entity-refs, just check-causal-targets, just check-qualifier-terms, just check-snippet-grading, and pytest tests/test_data.py -k Polycystic_Echinococcosis (2 passed).

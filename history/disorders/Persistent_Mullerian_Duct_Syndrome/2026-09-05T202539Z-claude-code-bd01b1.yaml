  summary: 'Create: Persistent_Mullerian_Duct_Syndrome'
  details: |
    De novo curation of persistent Mullerian duct syndrome (MONDO:0009857) as a
    DISEASE entry with two has_subtypes, replacing the stub of the same name.

    What was curated. 10 pathophysiology nodes forming a single causal chain from
    biallelic AMH/AMHR2 loss of function, through failed AMH receptor signalling
    in Mullerian duct mesenchyme (AMHR2 plus a shared type I BMP receptor plus
    SMADs), to failure of Mullerian duct regression, and from there to mechanical
    tethering of the testis, germ cell neoplasia risk in the malpositioned testis,
    neoplastic transformation of retained Mullerian epithelium, impaired
    spermatogenesis, and delayed incidental diagnosis. A separate two-node branch
    curates the preserved Leydig-cell androgen arm and normal Wolffian/external
    virilization, because the dissociation between the broken AMH arm and the
    intact androgen arm is the defining feature of the disease and is what
    separates it from gonadal dysgenesis. Cryptorchidism, inguinal hernia and
    transverse testicular ectopia are drawn as causal consequences of the tether,
    not as co-occurring findings. 9 phenotypes, 5 treatments, 2 biochemical
    records, 3 genetic records, 2 has_subtypes, 2 animal models, 1
    HUMAN_MODEL_MISMATCH discussion, 90 evidence items over 17 references.

    Subtypes and the serum-AMH signature. PMDS type I (AMH ligand, hgnc:464) and
    PMDS type II (AMHR2 receptor, hgnc:465), each bound to its NCIT subtype term
    and each carrying its gene. The serum AMH discrepancy that distinguishes them
    is curated as two subtype-attributed biochemical records with BiomarkerReadout
    links into the pathograph rather than as prose: low or undetectable AMH reads
    out the ligand defect, normal or elevated AMH reads out the receptor defect
    with ligand demonstrably present. A third genetic record covers the roughly
    12 percent of cases with a variant in neither gene.

    Surgical trade-off. The orchidopexy / remnant-preservation / remnant-excision
    treatments are curated as three distinct entries with opposing
    target_mechanisms, so that the reason preservation is the default (the vasa
    deferentia run in the wall of the retained structures, and excision risks
    sterilizing the patient) is machine-readable rather than buried in prose.

    Deep research. One falcon (Edison Scientific) run,
    research/Persistent_Mullerian_Duct_Syndrome-deep-research-falcon.md. Its
    reference validation reported 5/5 references resolved and its term validation
    20/22 resolved with needs_review true; the single mislabelled term was the
    template placeholder string "if available" against MONDO:0009857, not a
    curation-relevant error, and the two unresolvable prefixes were Orphanet/ORPHA
    with no configured resolver. just preflight-dr returned SKIP because MONDO
    records no RO:0004003 causal gene for MONDO:0009857, so disease identity was
    checked manually instead: the report's OMIM 261550 matches MONDO's OMIM xref
    and its top genes are AMH and AMHR2, which is the correct disease. The report
    supplied the causal-chain ordering and three of the seventeen references; the
    remainder were found by direct PubMed E-utilities searches for the mechanism,
    surgical-management, malignancy and mouse-genetics literature.

    A GeneReviews search (term=persistent Mullerian duct syndrome GeneReviews[All
    Fields]) returned zero results, so no GeneReviews baseline exists for this
    disease.

    Evidence discipline. Every snippet was copied from a locally cached record and
    verified; nothing was reconstructed from memory. Four initial snippets failed
    on bracketed-citation stripping and were shortened to bracket-free spans
    rather than repaired by fuzzy matching. Two snippets reproduce source
    typographical errors verbatim ("transvers ectopia" in PMID:33532339, "the
    tests" for "the testes" in PMID:9187705) and say so in their explanations.
    directness was left unset throughout because it was not assessed. No entry
    uses REFUTE or NO_EVIDENCE; 5 items are MODEL_ORGANISM (mouse Amhr2-null and
    conditional Bmpr1a knockout) and the rest HUMAN_CLINICAL.

    Deliberate omissions. No conforms_to: kb/modules/ was listed and searched and
    no module covers loss of a TGF-beta family ligand-receptor pair
    (aortopathy_tgfbeta_dysregulation concerns excess TGF-beta signalling, the
    serial-homology modules concern repeated developmental elements); the reason
    is recorded in the entry notes. No datasets: block, because no
    disease-relevant expression dataset was identified and a gene-only GEO hit
    would be Named Entity Confusion. No separate Fallopian-tube phenotype, because
    HPO has no term for their presence in a 46,XY individual and the available
    fallopian-tube terms all code morphological abnormality; the tubes are curated
    inside the uterus phenotype. The "Normal Male External Genitalia" phenotype is
    deliberately left unbound for the same class of reason: HPO codes abnormal
    findings and this phenotype is defined by the absence of one. No ORPHA
    evidence, because ORPHA:2856 is not among the 349 ORPHA records committed to
    references_cache/ and rebuilding it needs the gitignored Orphadata bulk XML.

    Validation. just validate-disorders passed: schema clean, term validation
    passed, 90/90 snippets verified against cached references. Also run and passed
    on this file: validate-terms, check-entity-refs, check-causal-targets (0
    prefixed, 0 dangling, 0 self), check-duplicate-keys, check-enum-values,
    check-qualifier-terms-online (0 qualifier terms in this entry),
    check-snippet-grading, check-title-snippets, check-snippet-length,
    check-folded-hyphens, check-reference-titles, check-environmental-evidence.
    just compliance reports 97.4 percent weighted compliance. normalize-cache was
    run; the cache diff is 14 added rows, all introduced by this entry.

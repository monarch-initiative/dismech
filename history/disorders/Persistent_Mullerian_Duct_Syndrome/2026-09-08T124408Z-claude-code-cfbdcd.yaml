  summary: 'Review round 1: diagnosis, fertility care, PPP1R12A, canine model'
  details: |
    Response to the CHANGES_REQUESTED review on PR #11181, addressing all four IMPORTANT findings in one push.

    Finding 1 (no diagnosis section): added a seven-record 'diagnosis:' block covering the research report's six-step pathway plus histopathology - diagnostic laparoscopy (NCIT:C16969), inguinoscrotal and pelvic ultrasound (NCIT:C17230), pelvic MRI (NCIT:C16809), karyotype (NCIT:C16768), serum AMH with gonadotropin and androgen panel (NCIT:C120625), AMH/AMHR2 sequencing with copy-number analysis (NCIT:C15709), and histopathological examination (NCIT:C18190). Evidence is drawn from references already cached in this PR: PMID:35052499 for the combined preoperative pathway, the MRI under-reporting failure mode and the copy-number calling step; PMID:35386545 for laparoscopy, the negative ultrasound, karyotype timing and gonadal histology; PMID:32187366 for the AMHR2 microdeletion, which is why copy-number analysis is written into the record rather than assumed.

    Finding 2 (fertility care and orchidectomy): added four treatments - semen analysis with sperm cryopreservation (NCIT:C16475), testicular sperm extraction (NCIT:C94427 Sperm Retrieval), intracytoplasmic sperm injection (NCIT:C185482), and orchidectomy for a nonviable or malignancy-suspicious testis (NCIT:C15288). The first three join the pathograph via target_mechanisms onto 'Impaired Spermatogenesis and Excurrent Duct Compromise'; orchidectomy joins onto 'Germ Cell Neoplasia Risk in the Malpositioned Testis'. NCIT has no clinical-action term labelled 'testicular sperm extraction', 'sperm cryopreservation' or 'semen analysis' reachable from NCIT:C25218; the closest reachable action terms are bound and the specificity is carried in preferred_term, with the reason recorded in each treatment's notes.

    Finding 3 (PPP1R12A): fetched PMID:36331510 (Picard et al., Hum Reprod 2022) and added a PPP1R12A genetic record bound to hgnc:7618, typed relationship_type UNKNOWN rather than CAUSATIVE. Four evidence items from the primary paper carry the finding (5/24 patients, associated atresias, the AMH/AMHR2-negative ascertainment) and the authors' own statement that experimental validation is lacking; a fifth from the cached PMID:39682529 review preserves the same 'suggests' hedge. The 'Unexplained PMDS' record's notes were rewritten to distinguish PPP1R12A (reported in humans, unvalidated) from the type I receptors and SMADs (mouse only, never reported in humans), which is what the previous text conflated.

    Finding 4 (canine model): fetched PMID:29194807 (Smit et al. 2018) and added the Miniature Schnauzer AMHR2 c.241C>T (p.Arg81Ter) model, linked by modeled_mechanisms onto 'Mechanical Tethering of the Testis by Retained Mullerian Structures' with relationship RECAPITULATES, fidelity MODERATE, model_scale ORGANISM and two readouts whose targets repeat the link target exactly. All canine evidence is graded MODEL_ORGANISM. The limitations record that cryptorchidism is reported in about half of affected dogs rather than all, that the allele is breed-restricted (the same study found no causal variant in a PMDS-affected Belgian Malinois), and that the cohort is a genotyping survey with no gubernacular measurement.

    Suggestions: took the testicular atrophy phenotype (HP:0008734 Decreased testicular size), with no frequency band because no cached source reports a proportion. Declined the Mullerian-remnant-cyst phenotype - the finding is not quotable from any reference cached for this entry and the report attributes it to a page range of a review whose cached full text does not contain the word 'cyst'; the gap is recorded in the entry notes so a later curator can fetch a primary source. Declined a more specific NCIT term for remnant preservation and recorded the reason in notes: the intervention is defined by what it leaves behind, and no reachable clinical-action term expresses that. The conforms_to decision was already recorded in the entry notes before this round.

    Validation on the changed file: just validate passed; just validate-disorders passed with 128/128 snippets verified against cached references (up from 90); just validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms-online, check-term-cache-integrity and check-environmental-evidence all passed. pytest -k 'model_readout or subtype_foreign or entity_ref or unique_name' passed 11357 tests. check-snippet-length, check-title-snippets and check-snippet-grading report findings in other entries only, from this branch being behind origin/main; grepping their output for this entry returns nothing. Term caches gained exactly three rows: hgnc:7618, NCIT:C120625 and its treatmentactionterm enum membership.

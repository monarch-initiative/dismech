  summary: >-
    Enhanced Infantile_Myofibromatosis.yaml with classifications, quantitative
    birth prevalence, natural history progression phases, histopathology and
    immunohistochemical biomarkers, PDGFRB case fractions and NOTCH3 perivascular
    genetic/pathophysiology nodes, connected causal edges to all 8 phenotypes,
    diagnostic workup, allelic/histologic differential diagnoses, additional TKI
    and chemotherapy/surgical/observation treatments, and top-level references.
  details: |
    Reviewed and expanded kb/disorders/Infantile_Myofibromatosis.yaml against
    cached literature (PMID:28334876, PMID:31017643, PMID:23731537, PMID:19738495,
    PMID:33063933, PMID:26455322, PMID:32500973, PMID:33683022, PMID:23999936):
    - Added classifications (Harrison's ONCOLOGY_HEMATOLOGY and
      GENETICS_ENVIRONMENT_DISEASE; ICD-O Pericytic Neoplasm).
    - Refined prevalence with quantitative birth prevalence (1 in 400,000;
      rate_per_100000: 0.25, BAND_1_9_PER_1000000) and added congenital/infantile
      presentation and spontaneous regression/recurrence progression phases.
    - Added PDGFRB cohort case fractions (68.4% in n=19 and 75.0% in n=8
      multicentric cohorts) and NOTCH3 candidate genetic and pathophysiology nodes.
    - Structured a 3-node pathophysiology graph (Constitutive PDGFRB Signaling and
      NOTCH3 Perivascular Signaling Dysregulation converging on Myofibroblastic and
      Perivascular Mesenchymal Proliferation) with downstream edges reaching all 8
      phenotypes (including Soft Tissue Calcifications, Gastrointestinal Myofibroma,
      and Central Nervous System Myofibroma).
    - Added histopathology (Spindle Cell Pattern, Immunophenotypic Finding),
      biochemical (smooth muscle actin/vimentin immunoreactivity), diagnosis
      (biopsy/IHC, total-body MRI, PDGFRB genetic testing), differential_diagnoses
      (Langerhans cell histiocytosis, Kosaki overgrowth syndrome, Penttinen
      syndrome, glomus tumor), and treatments (Dasatinib and Ponatinib, Low-Dose
      Methotrexate and Vinblastine Chemotherapy, Watchful Waiting, Surgical
      Excision, and enhanced Imatinib target mechanisms/phenotypes).

  summary: Enhanced Infantile_Myofibromatosis.yaml with synonyms, IMF1/IMF2 subtypes, classifications,
    quantitative prevalence, progression phases, autosomal dominant incomplete penetrance/variable expressivity
    and somatic mosaicism inheritance, PDGFRB and NOTCH3 (L1519P) genetic/pathophysiology nodes (NOTCH3-PDGFRB
    axis), atomic vimentin and HHF-35 biomarkers, paired tumor/germline PDGFRB sequencing, differential
    diagnoses, treatments, and top-level references.
  details: "Reviewed and expanded kb/disorders/Infantile_Myofibromatosis.yaml against\ncached literature\
    \ (PMID:28334876, PMID:31017643, PMID:23731537, PMID:19738495,\nPMID:33063933, PMID:26455322, PMID:32500973,\
    \ PMID:33683022, PMID:23999936,\nDOI:10.1242/dmm.046300):\n- Added synonyms and has_subtypes for Infantile\
    \ Myofibromatosis 1 (MONDO:0009227,\n  PDGFRB) and Infantile Myofibromatosis 2 (NOTCH3).\n- Added\
    \ classifications (Harrison's ONCOLOGY_HEMATOLOGY and\n  GENETICS_ENVIRONMENT_DISEASE; ICD-O Pericytic\
    \ Neoplasm).\n- Refined prevalence (1 in 400,000; rate_per_100000: 0.25,\n  BAND_1_9_PER_1000000,\
    \ measure_type: UNKNOWN) and added congenital/infantile\n  presentation and spontaneous regression/recurrence\
    \ progression phases.\n- Updated inheritance to encode incomplete penetrance and variable expressivity\n\
    \  on Autosomal dominant (HP:0000006) and added Somatic mosaicism (HP:0001442).\n- Added PDGFRB cohort\
    \ case fractions, exon 12 and 14 hotspot details,\n  variant_origin: GERMLINE_AND_SOMATIC, and two-hit\
    \ mechanism; updated NOTCH3\n  p.Leu1519Pro (L1519P) to Causative with functional evidence from\n\
    \  DOI:10.1242/dmm.046300.\n- Structured a 3-node pathophysiology graph in which Activating NOTCH3\
    \ Signaling\n  in Perivascular Myofibroblastic Precursors feeds directly into Constitutive\n  PDGFRB\
    \ Signaling (with somatic/mosaic genetic_context), which drives\n  Myofibroblastic and Perivascular\
    \ Mesenchymal Proliferation and downstream\n  edges reaching all 8 phenotypes.\n- Split biochemical\
    \ into atomic Vimentin Immunoreactivity and Muscle-Specific\n  Actin (HHF-35) Immunoreactivity entries\
    \ (removing the inaccurate ACTA2\n  NCIT:C103972 binding).\n- Added histopathology, diagnosis (biopsy/IHC,\
    \ total-body MRI, paired\n  tumor/germline PDGFRB sequencing across multiple nodules),\n  differential_diagnoses,\
    \ and treatments (Imatinib, Dasatinib and Ponatinib,\n  Low-Dose Methotrexate and Vinblastine Chemotherapy,\
    \ Watchful Waiting, Surgical\n  Excision).\n"

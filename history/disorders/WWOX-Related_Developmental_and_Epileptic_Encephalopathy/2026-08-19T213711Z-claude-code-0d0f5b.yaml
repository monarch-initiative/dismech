  summary: 'Review round 1: consume the cached full text'
  details: |
    Addressed the first review on PR #8986. The finding was correct: PMID:30356099 is cached as full text and contains per-phenotype counts that the first pass did not consume. Added eleven phenotypes, each with the arithmetic stated in its explanation against the cohort denominator: hypotonia at 15 of 20, hypertonia at 15 of 18, feeding difficulties at 13 of 19 tube-dependent, scoliosis or kyphosis at 13 of 20, facial dysmorphism at 12 of 20, optic nerve anomalies at 10 of 19, retinal dystrophy at 2 of 19, altered fundus at 9 of 19, reduced eye contact at 16 of 20, respiratory problems at 8 of 20, and status epilepticus at 4 of 17. Two curation decisions worth recording. Hypotonia and hypertonia come from a single sentence but are curated as two phenotypes, because they are opposite tone abnormalities affecting different body regions, axial versus distal, and are counted against different denominators. Optic nerve anomalies and retinal dystrophy likewise come from one sentence and are kept separate because they differ by an order of magnitude in frequency. Added a diagnosis section whose sequencing entry makes the load-bearing point the review identified: 9 of 18 families carry at least one copy-number variant, so a sequencing-only strategy would leave half of them without a complete genotype. The methods-enumeration snippet had to be quoted short, because the bracketed abbreviations inside it are stripped before snippet matching; the companion CNV item carries the substance and the explanation says so. Added a prevalence record typed CASES_IN_LITERATURE and ULTRA_RARE, the recurrent missense alleles to the genetic section with a note that recurrence reflects repeated alleles rather than a mutational hotspot, and nutritional support with gastrostomy feeding as a treatment, justified by the 70 percent tube dependence rather than by any disease-modifying claim. Validation: just validate passed with 86 of 86 snippets verified, up from 67 of 67; term validation passed; folded-hyphen, duplicate-key, title-snippet and snippet-length checks pass; 6445 tests passed.

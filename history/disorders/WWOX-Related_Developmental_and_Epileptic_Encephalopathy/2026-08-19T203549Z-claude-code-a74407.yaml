  summary: 'Create: WWOX-Related Developmental and Epileptic Encephalopathy (WOREE/DEE28)'
  details: |
    New entry for WOREE syndrome / DEE28 (MONDO:0014533), curated from a claude_code deep-research report. NEC preflight returned WARN: WWOX dominated gene mentions 92 to 6 and the report is unambiguously about WOREE, but it cites OMIM 605131 (the WWOX gene record) and OMIM 614322 (SCAR12, the allelic disorder) against the MONDO xref of 616211. Inspection showed SCAR12 is discussed as a deliberate allelic contrast rather than as wrong-entity contamination, so the report was used with SCAR12 content scoped to contrast only. The report's own reference validation flagged needs_review: 32 of 32 references resolved with a confabulation rate of 0.0, but three of four checked quotes were unsupported and one reference was off topic. All four were respected. The quote that premature death has never been described with a missense-only genotype was flagged unsupported against both PMID:30356099 and PMID:33916893 and is deliberately not curated; the entry instead makes the weaker verifiable claim from PMID:36779245 that biallelic null genotypes have significantly lower survival probability, and the genetic notes record explicitly that the stronger claim was seen and excluded. PMID:8305172 was flagged off topic, resolving to a paper on ambulatory blood pressure in youth, and is not cited. Six ontology term labels suggested by the report were wrong and were corrected against OAK before use: HP:0011097 is Epileptic spasm not Epileptic encephalopathy, HP:0002465 is Poor speech not Absent speech, HP:0002120 is Cerebral cortical atrophy, HP:0002373 is Febrile seizure not Lennox-Gastaut syndrome, HP:0000539 is Abnormality of refraction not Abnormality of the optic nerve, and HP:0002105 is Hemoptysis not Abnormal breathing. No GeneReviews chapter exists for WWOX, confirmed by PubMed search using a query form validated against a gene known to have one. Pathophysiology is 17 atomic nodes across four parallel arms, with excitatory and inhibitory synaptic changes kept as separate nodes because they were measured separately and move in opposite directions, and with oligodendrocyte maturation, hypomyelination and axonal conductivity kept separate as three distinct measurements. Four discussions: a CONTROVERSY on whether the myelin arm or the synaptic arm generates the seizures, anchored on the source statement that hypomyelination alone does not necessarily cause epilepsy; a HUMAN_MODEL_MISMATCH on rodent models dying within two to four weeks against a human course running to 40 years; a KNOWLEDGE_GAP on GSK-3beta as a druggable node, noting the lithium rescue was measured against induced rather than spontaneous seizures; and a KNOWLEDGE_GAP on whether missense alleles are truly hypomorphic. A 2026 press report of a first compassionate-use gene therapy administration is recorded in treatment notes as consciously excluded rather than curated, since it has no peer-reviewed publication. Validation: just validate passed with 67 of 67 snippets verified against cached references, term validation passed, no duplicate keys, no new title-quoting or under-length snippets, and 8628 tests passed.

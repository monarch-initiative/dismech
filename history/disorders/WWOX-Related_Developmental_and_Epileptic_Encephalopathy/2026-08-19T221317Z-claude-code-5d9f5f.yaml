  summary: 'Review round 2: correct the stale microcephaly explanation'
  details: |
    Swept in the two actionable non-blocking suggestions from the second review, on an already-approved PR, because the first is a correctness problem rather than a style point. The Microcephaly explanation said that the cohort papers quoted here do not give a microcephaly count. That was true when written, because only the abstract of PMID:30356099 had been consumed, and it became false in the same commit that consumed the full text everywhere else. The full text states that 4 of 20 patients had microcephaly, which is 20 percent and a clean OCCASIONAL band. Added the frequency, added an evidence item quoting that sentence, and rewrote the stale sentence. The quote deliberately stops before the threshold definition, because the following span contains a minus sign that does not survive snippet matching, and the definition is given in the description instead. Second, renamed the treatment from Nutritional Support and Gastrostomy Feeding to Nutritional Support and recorded why: the old name bundled enteral feeding with gastrostomy placement, a dietary intervention and a procedure respectively, and the BEHAVIORAL modality describes only the former. The tube dependence remains in the description and its evidence is unchanged. The reviewer's third suggestion needed no action: poor spontaneous movements and various movement disorders from the same source paragraph overlap phenotypes already curated, and the reviewer explicitly did not call either a gap. Validation: just validate passed with 87 of 87 snippets verified, up from 86 of 86; term validation passed; folded-hyphen, environmental-evidence, duplicate-key, title-snippet and snippet-length checks all pass.

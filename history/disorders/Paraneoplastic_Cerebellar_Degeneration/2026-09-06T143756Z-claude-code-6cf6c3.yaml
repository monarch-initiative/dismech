    Also applying a placement lesson from the sibling CTPS1 review, which pointed out that
    correction narratives were accumulating in record prose when the history records already
    carry them at greater length. The notes here said "An earlier version of this record named
    Girona, Spain, and said the PCD fraction was unstated. Both were wrong." A curator reading
    the entry in a year meets a description of a file version they cannot see. Trimmed to a
    pointer at the history record, which is where that account belongs. The substantive caveat -
    that these are class-level figures and why the 28% is not multiplied into a derived record -
    stays inline, because that is about the evidence rather than about the editing.

    That distinction is worth keeping: what the evidence says and does not say belongs in the
    entry; what an earlier version of the entry got wrong belongs in history.


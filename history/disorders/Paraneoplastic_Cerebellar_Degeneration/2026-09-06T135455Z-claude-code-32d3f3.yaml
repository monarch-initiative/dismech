  details: |-
    Round 2 approved the PR with four suggestions. Three are taken here. The middle one is a
    correction to something I said, not just to the entry.

    1. evidence_source misgrade on PMID:11771954, regraded HUMAN_CLINICAL -> MODEL_ORGANISM
       with directness INDIRECT. The paper is a BALB/c mouse DNA-immunisation study.
       evidence_source classifies the publication, not the quoted sentence, even where the
       sentence is itself reporting a human observation - which is the case here and is
       presumably how it was graded wrong in the first place. The explanation now says so.

    2. Prevalence. The round-1 reply claimed all three suggestions were in that push. The
       prevalence block was byte-identical to the original commit. That claim was false, and
       the reviewer was right to say so; it is the third time in this session I have
       overstated what a push contained.

       Now fixed properly rather than minimally. Two structured records added from
       PMID:31552550, the only population-based study near this disease: ANNUAL_INCIDENCE
       1.0/100,000 with rate_denominator PERSON_YEARS, and POINT_PREVALENCE 4.0/100,000 with
       rate_denominator POPULATION. Kept as separate records because prevalence and incidence
       are different measures and merging them would invite exactly the comparison the schema
       exists to prevent.

       The important part is the scoping. Both figures are for paraneoplastic neurological
       syndromes as a class, not for cerebellar degeneration. Both carry directness INDIRECT
       and a notes block saying the true PCD figure is some unstated fraction of the quoted
       one. The original qualitative record is kept rather than replaced, because it supports
       a different claim - that the rarity is what prevented randomised trials.

       Also worth recording: the reviewer said PMID:31552550 "was never fetched". It is in
       references_cache, committed to main since #10918. The suggestion was right about the
       entry; the reason given for it was not.

    3. Gait ataxia frequency OBLIGATE -> VERY_FREQUENT. The supporting snippet calls it the
       main clinical feature, which does not carry OBLIGATE.

    4. therapeutic_modality: OTHER on IVIG and plasma exchange, left as is. The reviewer
       agreed it is defensible - the enum has no value for pooled immunoglobulin or apheresis
       - and flagged it only against a future enum extension.

    Validated: just validate-disorders 65/65 (up from 63), just validate-terms,
    pytest tests/test_data.py (2 passed), model-scale-audit --strict, and the full ungated
    set: snippet length, title snippets, snippet grading, folded hyphens, environmental
    evidence, enum values, duplicate keys, entity refs, causal targets, qualifier terms.

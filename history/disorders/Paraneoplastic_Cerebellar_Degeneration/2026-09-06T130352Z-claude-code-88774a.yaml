  summary: 'Add classifications block (round 1 follow-up, #11225)'
  details: |-
    Adds the classifications block. NEUROLOGIC plus ONCOLOGY_HEMATOLOGY.

    The second Part is the one worth explaining. The classification guidance says a cancer
    entry rarely needs an organ-system Part "unless the entry is about an organ-specific
    paraneoplastic syndrome"; this is that case read in the other direction, a neurological
    entry that needs the oncology Part. It is not decorative: the neurological syndrome
    frequently precedes and prompts the cancer diagnosis rather than following it, so the
    oncological reader is not a secondary audience, and the antibody profile points at the
    tumour type. The ONCOLOGY_HEMATOLOGY assignment carries evidence (PMID:29306402) framing
    the disease as a complication of gynecological cancers; the explanation notes the quote
    is specific to the anti-Yo form, which is this entry's principal subject.


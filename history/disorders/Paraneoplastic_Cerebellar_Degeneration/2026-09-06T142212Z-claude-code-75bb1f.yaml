  summary: 'Round 3: correct two factual errors in the prevalence records'
  details: |-
    Two factual errors in the prevalence records I added last round, both about the paper those
    records cite. Both are mine and neither was caught by any gate.

    1. The population string named the wrong country. Both records read "Girona province, Spain
       (population-based cancer registry)". PMID:31552550 studied Udine, Pordenone and Gorizia
       in the Friuli-Venezia Giulia region of Northeastern Italy, 2009-2017, population 983,190.
       The reviewer's read of how it happened is almost certainly right: Gorizia became Girona,
       and Spain followed from Girona. I did not invent it from nothing - I mis-transcribed a
       province name from the abstract and then wrote a country and a study design around the
       mistake. "population-based cancer registry" was wrong too; it is a population-based
       epidemiological study.

       This is the slip that survives every gate in the repo. The snippet is exact, the PMID
       resolves, the numbers are right, and nothing validates a free-text population string
       against the source sitting beside it.

    2. The notes claimed the PCD share of the class-level figure was "some unstated fraction".
       The same abstract states it: cerebellar degeneration is 28% of PNS cases, second to
       limbic encephalitis at 31%. Corrected, with the 28% quoted as its own evidence item.

       This is the same defect as writing that HPO had no term, or that no randomised trial
       existed. Asserting that a source does not say something, without grepping the source.

    Also taken: the rounded CONCLUSIONS figures (1.0 and 4.0) replaced with the RESULTS values
    the study actually measured, 0.89/100,000 person-years and 4.37/100,000, with the snippets
    changed to the sentences carrying them.

    Not taken, deliberately. The reviewer offered a derived PCD-specific record (0.89 x 0.28,
    4.37 x 0.28) as one of two acceptable fixes. The arithmetic is recorded in notes but not as
    a record, because the 28% is a share of cases and not a share of incidence, and treating
    them as interchangeable assumes a uniform detection rate across syndromes that the study
    does not establish. A curated rate_per_100000 reads as sourced; this one would not be.

    Validated: just validate-disorders 65/65, just validate-terms,
    pytest tests/test_data.py (2 passed), and the offline gates: snippet length, snippet
    grading, enum values, duplicate keys, entity refs, causal targets.

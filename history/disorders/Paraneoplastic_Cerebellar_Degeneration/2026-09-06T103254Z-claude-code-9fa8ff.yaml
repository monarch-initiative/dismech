  summary: 'Review round 1: address all eight findings on PR #11225'
  details: |-
    Review round 1 on PR #11225. All eight findings addressed in one push, plus the
    three suggestions. Evidence base goes from 21 to 62 verified snippets and from 4
    to 19 distinct references.

    1. Phenotype under-coverage. Six cerebellar phenotypes added and bound: gait
       ataxia (HP:0002066), truncal ataxia (HP:0002078), limb ataxia (HP:0002070),
       dysarthria (HP:0001260), nystagmus (HP:0000639) and prodromal vertigo
       (HP:0002321). Each is wired into the pathograph from Irreversible Purkinje
       Cell Loss, except the prodrome, which is deliberately drawn from the ongoing
       destruction node instead: the prodrome is what partial cell loss looks like,
       and by the time loss is complete the patient is no longer prodromal. It is
       the only feature in the entry that reports on a still-treatable state.

    2. CSF binding rationale. The reviewer was right that the justification was
       wrong. The single broad HP:0002922 binding is split into three bound
       phenotypes (HP:0002922, HP:0012229 CSF pleocytosis, HP:6000397 CSF
       oligoclonal immunoglobulin G bands). The entry-level notes now record what
       the original reasoning got wrong: the absence of a term for a bundle is an
       argument for unbundling the claim, not for binding the bundle to whichever
       component happens to have a term.

    3. Genetic section added. CDR2, CDR2L and two HLA class II records.
       IMPORTANT: the CURIE the reviewer supplied for CDR2, hgnc:1802, is CDSN, an
       unrelated skin gene; the deep-research report proposed the same wrong ID. The
       correct identifiers are hgnc:1799 (CDR2) and hgnc:29999 (CDR2L), both already
       in the term cache. Recorded in the entry notes because two independent sources
       agreeing on a wrong identifier is exactly when it gets accepted unchecked.
       CDR2 is typed BIOMARKER, not CAUSATIVE or SUSCEPTIBILITY - nobody inherits
       this disease and no germline variant causes it; what CDR2 is, is the molecular
       identity of the attacked antigen, and no GeneDiseaseRelationshipEnum value
       expresses that. HLA is split into two records because HLA-DRB1 carries a risk
       haplotype and HLA-DPB1 a protective one, and relationship_type is per-record.

    4. Failed antibody-transfer models added, as three animal_models entries covering
       all four studies (PMID:7707074, 7788981, 7788964, 11771954), each with typed
       divergences and readouts. These carry the negative results as
       FAILS_TO_RECAPITULATE links, which is what those slots are for. The DNA
       immunization study is the important one and it does not favour either
       hypothesis: it raised both anti-Yo antibodies and CDR2-specific cytotoxic T
       cells in vivo and still produced no degeneration. The knowledge gap now says
       so - no experimental reconstruction of either arm has produced the disease in
       an animal, and the canonical hypothesis is argued from human neuropathology
       and antigen compartment rather than from any positive model.

    5. Surface-antigen arm broadened and the knowledge gap re-scoped. Anti-Tr/DNER
       (extracellular domain demonstrated, PMID:25745634) and anti-mGluR1 (42 pooled
       cases responding to immunotherapy, PMID:41197574) added to the ALTERNATIVE
       hypothesis. The gap is rewritten to separate what does not rest on one case
       (the compartment rule, now independently supported) from what does (the
       neuropathological contrast: topography, MHC class I, complement, ER stress).
       The reviewer's diagnosis of the overstatement was correct.

    6. Treatments split from 2 bundled NCIT:C49236 records into 7 with precise
       bindings: Pharmacotherapy + glucocorticoid, Intravenous Immunoglobulin
       Therapy (NCIT:C121331), Plasmapheresis (NCIT:C15304), B-Cell Depletion
       (ofatumumab NCIT:C66952 / rituximab NCIT:C1702), Surgical Procedure,
       Chemotherapy, Supportive Care. All four new bindings confirmed reachable from
       NCIT:C25218. Cyclophosphamide and 4-aminopyridine are NOT added: no cached
       reference supports either in this disease, and inventing a treatment record
       without evidence is worse than omitting it.

    7. Diagnosis expanded with antibody-guided imaging (EFNS task force,
       PMID:20880069, graded OTHER because the report states no evidence-based
       grade A-C recommendations were possible) and FDG-PET/CT for the
       antibody-negative case (PMID:22157026), quoted with its actual 27-patient,
       five-cancer yield rather than only its recommendation.

    8. Checkpoint-inhibitor-triggered disease added as an environmental exposure with
       a TRIGGERS mechanism link, plus a new INTERPRETATION discussion
       (pcd_ici_triggered_same_disease) on whether it is the same disease. It is
       curated as an exposure and deliberately not as a subtype: the one direct
       comparison finds the two differ on sex, tumour type, isolated ataxia and
       outcome simultaneously, which is too much to assert sameness over, and too
       little (35 versus 15, retrospective) to assert difference.

    Self-caught errors during this round, recorded because they are the interesting
    part: (a) the two new diagnosis records were first inserted before `discussions:`
    and silently absorbed into `animal_models` - YAML parsed, schema passed, and only
    a structural readback caught it; (b) a snippet was truncated at "follow-" with a
    fabricated justification about the cache hard-wrapping the line, which it does
    not - the full sentence was substituted; (c) a snippet anglicised the source's
    "tumor" to "tumour", caught by the reference validator.

    Validated: just validate-disorders (62/62 snippets), just validate-terms, plus
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-folded-hyphens, check-environmental-evidence, check-enum-values,
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, model-scale-audit --strict, check-not4curation. All green.

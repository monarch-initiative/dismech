  summary: 'Create: Paraneoplastic Cerebellar Degeneration'
  details: |
    De novo curation of paraneoplastic cerebellar degeneration as a syndrome-level entry alongside the existing compartment-level Paraneoplastic_Neurological_Syndromes entry. One openscientist deep-research run was performed and is committed. The entry is organised around a two-mechanism structure taken from PMID:36070310, a neuropathological comparison of anti-Yo against anti-P/Q-VGCC cases: where the onconeural antigen is intracellular the pathology is cytotoxic T cell-mediated with MHC class I upregulation and CD8 granzyme B cells, and where it is on the cell surface there is no MHC class I upregulation or complement deposition and the picture is one of antibody-driven dysfunction preceding death. These are curated as two mechanistic_hypotheses (CANONICAL and ALTERNATIVE) with each causal edge opting into one via hypothesis_groups, rather than as rival accounts of one mechanism. The prognostic consequence is stated: the uniformly poor outlook attributed to this disease derives from anti-Yo series and should not be assumed to cover the surface-antigen arm. Three limitations are recorded as discussions rather than hedged into node text: the antibody-versus-T-cell effector debate, the compartment-determines-window interpretation, and the fact that the entire surface-antigen contrast rests on a single autopsy case. A plasma exchange case report with an unusually good outcome is curated as a genuine counterexample to the poor prognosis, with its atypia (male, no tumour found) stated so it is not read as representative. One snippet was initially written as a paraphrase and corrected against the cache after the snippet audit flagged it; the true wording was stronger than the paraphrase. Validated: schema, terms, 21/21 snippets, entity refs, causal targets.

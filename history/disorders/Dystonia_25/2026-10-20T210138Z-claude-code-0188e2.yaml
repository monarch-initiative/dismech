  details: |
    Review round on PR #15054.

    Blocking: check_upward_extrapolating_links_are_caveated failed on the Gnal+/- mouse link to Impaired D1 and A2A Receptor Coupling to Adenylyl Cyclase in Striatal Projection Neurons, a MOLECULAR model against a CELLULAR node with no caveat. The link now carries a prose limitations string and two typed divergences. BOUNDARY_OMISSION records that the cited measurement (PMID:11238742) is G-alpha-olf protein and agonist-stimulated cAMP in whole caudate putamen, which does not separate D1 receptor-expressing from A2A receptor-expressing projection neurons; the cell-type-specific conditional deletions that did separate them are PMID:40902679, already cited on the node. SCALE_EXTRAPOLATION records the distinct point that a tissue biochemical measurement stands in for the signalling state of individual neurons. Both are QUALIFYING: the claim holds in a narrower, striatum-averaged form. model_scale was deliberately left at MOLECULAR, since changing it would have removed the reported gap without changing what the mouse was measured for. just model-scale-audit on the file now reports 5 scale-determined links, 1 upward extrapolation, 0 uncaveated.

    Hypertonia: onset moved out of prose into the structured phenotype_term.onset slot as onset_category CHILDHOOD, with the age-1-year observation from PMID:27222887 and the GeneReviews wording recorded in its notes. preferred_term is now plain Hypertonia, since the onset qualifier is carried by the dedicated slot rather than by the display string.

    Intellectual disability: rebound from HP:0001256 Mild intellectual disability to the parent HP:0001249 Intellectual disability. The phenotype covers mild intellectual disability in the two homozygous sisters and moderate intellectual disability in the compound heterozygous patient (PMID:38850091), so the severity-qualified child term asserted a severity one of its own evidence items contradicts. The reason for the broader binding is recorded in the phenotype notes.

    Laryngeal dystonia: no frequency band added. The 44 percent speech involvement figure in PMID:23222958 is not attributed to the larynx rather than to oromandibular, lingual or cervical involvement, so reading it as a laryngeal frequency would overstate the source. The description now says this, matching the way the oromandibular entry handles the 57 percent cranial figure.

    Validation: just validate, validate-terms, normalize-cache (no change), count-verified-snippets 105/105, check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-retired-support-prose, check-reference-titles, check_gene_activity_grounding against origin/main, pytest tests/test_data.py -k Dystonia_25, and validate-disorders all pass.

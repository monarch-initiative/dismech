  summary: 'Create: Dystonia_25'
  details: |
    New entry for the GNAL dystonia (DYT25, MONDO:0014033), built on the GeneReviews DYT-GNAL chapter (PMID:30605297) as the phenotype, diagnosis, management and counselling baseline, the two gene-identification papers, later case series and cohorts, and the rodent and cell studies of G-alpha-olf.

    Scope: one Disease entry with two has_subtypes, Monoallelic DYT-GNAL (adult-onset craniocervical isolated dystonia, dominant with incomplete penetrance or de novo) and Biallelic DYT-GNAL (childhood-onset hypertonia progressing to generalized dystonia with intellectual disability, two families). GeneReviews describes the biallelic presentation separately, which is why it is a subtype rather than a note. Neither subtype has its own MONDO term.

    Pathograph: heterozygous loss-of-function GNAL variants, reduced G-alpha-olf signalling, impaired D1 and A2A receptor coupling to adenylyl cyclase in striatal projection neurons, loss of corticostriatal long-term depression, paradoxical D2 receptor excitation of striatal cholinergic interneurons, and a striatal motor circuit node wired to the dystonia phenotypes; an olfactory branch to hyposmia; a hypothesis edge to bradykinesia. All mechanistic nodes past the variant rest on rodent or in vitro evidence and are graded as such. 9 of 11 phenotypes are causally connected; the biallelic-only hypertonia and intellectual disability are left unwired because no source explains them. No kb/modules/ module covers dystonia or striatal Golf/cAMP signalling, so no conforms_to.

    Deep research: the OpenScientist report (research/Dystonia_25-deep-research-openscientist.md; 23/23 references resolved, one flagged off topic) was used as a lead. Taken from it: the Miao 2013 Chinese case fraction, the Carecchio 2016 family (dystonic tremor), and the Ahn 2019 pooled DBS outcome, each re-read from the cached abstract. Dropped: its HPO and CL suggestions where wrong (HP:0002317 offered for torticollis, CL:0000029 for medium spiny neuron), the claim that striatal G-alpha-olf couples to adenylyl cyclase III (it is adenylyl cyclase 5), the Ric-8B and Gs biochemistry papers (off topic or not about the disease), neuroimaging of ungenotyped cervical dystonia cohorts, a general botulinum toxin guideline not specific to GNAL, and the report's omission of the biallelic form. just preflight-dr could not run because the local MONDO build is absent; identity was checked by hand (GNAL, OMIM 615073).

    No gene_disease_validity: the current ClinGen gene-validity download has no GNAL curation.

    Validation: just validate, validate-terms, count-verified-snippets (105/105), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-block-scalar-comments, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-retired-support-prose, check-reference-titles, check-genereviews (TAGGED) and validate-disorders all pass.

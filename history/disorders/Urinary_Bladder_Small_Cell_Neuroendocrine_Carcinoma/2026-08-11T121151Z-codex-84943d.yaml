  summary: 'Review: Urinary Bladder Small Cell Neuroendocrine Carcinoma'
  details: |
    Reviewed the complete entry against the existing Falcon deep-research report,
    the 81-case clinicopathologic series, a population-based SEER analysis, a
    current full-text clinical review, and official ClinicalTrials.gov records.
    Removed the association-only neuroendocrine-differentiation, proliferation,
    muscle-invasion, and metastatic causal arrows. The resulting conservative
    pathograph has two mechanism nodes and two edges: recurrent TP53/RB1
    alterations to loss of cell-cycle control, then a qualified PARTIAL link to
    the neoplasm phenotype, with edge-level RB1 evidence on both links.
    Clinical behavior is retained in progression and pathology sections rather
    than serialized as an unsupported causal chain. Consequently, phenotype
    connectivity is intentionally 1/4; TP53 and RB1 are wired to the mechanism
    node (2/3 causal genes), while TERT remains unwired because its proposed
    telomerase consequence is review-level and explicitly PARTIAL.

    Added two natural-history phases, VERY_FREQUENT hematuria based on 73/81
    cases, mixed urothelial/small-cell histology, three diagnostic blocks covering
    morphology plus neuroendocrine immunohistochemistry, cross-sectional staging,
    and differential diagnosis, and five current phase II registry studies.
    Narrowed the TERT text to the directly observed promoter-alteration finding,
    without serializing the review-level telomerase hypothesis, and documented the
    intentionally limited graph and absence of a verified reusable
    disease-specific omics dataset.

    Validation: focused disorder schema, ontology-term, and reference validation
    passed; a strict audit verified 32/32 cached snippets;
    the target graph validator reports no integrity findings; all new snippets
    satisfy the length ratchet; and the diff is whitespace-clean.

  summary: 'Review: evidence-calibrate Turner syndrome mechanisms, surveillance, and
    models'
  details: |
    Deep publication-readiness review of the classic 45,X, mosaic, and structural-X scope. The union remains under MONDO:0019499 with narrower MONDO mappings rather than being split by karyotype. The current schema has no disease-level karyotype or phenotypic-sex slot, so those defining facts remain explicit in the description, mappings, karyotype workflow, and Y-material screening instead of misusing a context-level SexEnum field.

    Corrected two claim-semantics problems. SHOX is no longer relationship_type CAUSATIVE for Turner syndrome as a whole: that controlled value means gene variants are sufficient for the disease, whereas SHOX dosage causes only the growth and mesomelic skeletal arm. The narrower relationship now lives in association text and the pathograph. The growth-plate node also no longer asserts decreased chondrocyte proliferation and differentiation from a source that only supports dysregulated apoptosis; its GO annotation is now apoptotic process / DYSREGULATED. Progressive aortic dilation and dissection were moved from ORGANISM to TISSUE, the valve/arch-to-dilation edge was weakened from DIRECT to an evidence-calibrated indirect hemodynamic contribution, and prose that incorrectly made congenital malformation the sole route to Turner aortopathy now acknowledges parallel generalized arteriopathy.

    Strengthened graph coverage without inventing mechanisms. Added exact-evidence endpoint links for short stature, cubitus valgus, Madelung deformity, ovarian and endocrine phenotypes, infertility, webbed neck, lymphedema, bicuspid valve, coarctation, aortic dissection, visuospatial impairment, renal malformation, and sensorineural hearing loss. PARTIAL and INDIRECT_UNKNOWN_INTERMEDIATES are retained wherever the responsible dosage-sensitive gene or tissue relay is unassigned. A fresh d2p-audit reduced local unlinked phenotypes to five: autoimmune thyroiditis, hypothyroidism, hypertension, recurrent otitis media, and scoliosis remain deliberately unlinked because the cached evidence does not license a causal intermediate. The 454-phenotype Orphanet feed was treated as a noisy review queue, not a mandate for mechanical padding.

    Added two explicitly PROVISIONAL human-cell routes from primary studies. PMID:39543104 supports an emerging granulosa apelin/APJ to Akt/cell-cycle model with pathway-rescue evidence, while preserving non-isogenic, two-donor, unpurified-bulk, and no-intact-ovary limitations. PMID:38124119 supports a three-case/three-control cardiomyocyte transcriptome and contractility state, but no edge was drawn from that immature two-dimensional system to bicuspid valve, coarctation, vessel-wall disease, or dissection. The XO mouse is represented as a genetic-background series rather than the overbroad claim that XO mice are simply fertile: PMID:32634219 shows early oocyte loss and reduced fertility on C57BL/6J but normal fertility on a mixed background. A HUMAN_MODEL_MISMATCH discussion makes that strain dependence queryable.

    Filled high-priority surveillance gaps from the 2024 international guideline: thyroid function, diabetes and diabetes typing, liver biochemistry, celiac serology, vitamin D, and DXA cadence. Added exact adult osteoporosis and horseshoe-kidney frequencies. Added and independently verified the two direct GEO datasets, GSE271780 (granulosa bulk RNA-seq, 10 samples) and GSE239758 (iPSC/cardiomyocyte coding and non-coding RNA microarrays, 12 samples); the verifier-generated accession-cache rows are included.

    No dedicated Turner syndrome GeneReviews chapter or repository deep-research artifact was found. The entry therefore remains transparent about being guideline-anchored rather than claiming exhaustive primary-literature coverage. Three new literature caches (PMID:39543104, PMID:18499648, PMID:32634219) were generated only with just fetch-reference; no references_cache file was hand-created or hand-edited.

    Focused validation completed before this record: schema and term validation passed; reference validation and the independent snippet audit verified 176/176 exact snippets; duplicate-key, empty-snippet, short-snippet ratchet, title-snippet ratchet, folded-hyphen ratchet, reference-cache-frontmatter, term-cache-integrity, and cache-order checks passed; both GEO accessions resolved; and target-only causal-graph validation passed. The repository-wide graph check still reports its pre-existing 74-disorder backlog and does not list Turner Syndrome. Full history, pre-commit, and post-rebase validation are performed before publication of the carrying draft PR.

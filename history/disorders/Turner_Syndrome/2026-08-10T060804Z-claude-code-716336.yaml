  summary: 'Create: Turner Syndrome (MONDO:0019499)'
  details: |
    New disorder entry created from issue #7837 (obstetrics / women's-health coverage gap), which flagged Turner syndrome as absent from the KB entirely and as "a notable absence well beyond women's health".

    Modelled around a single gene-dosage hub node — haploinsufficiency of pseudoautosomal and X-inactivation escape genes — with four tissue-specific arms: SHOX/growth plate, ovarian germ-cell attrition, fetal jugular lymphatic obstruction, and left-heart outflow malformation leading to Turner aortopathy. Only the SHOX arm carries a DIRECT edge from the hub; the ovarian and lymphatic arms are typed INDIRECT_UNKNOWN_INTERMEDIATES because no escape gene has been assigned to them, and that is curated as an explicit KNOWLEDGE_GAP rather than smoothed over.

    Clark's 1984 lymphatic-obstruction hemodynamic account of coarctation is confined to a named ALTERNATIVE mechanistic_hypotheses group, so no pathophysiology node asserts it as settled mechanism.

    Two candidate module conformances (aortopathy_tgfbeta_dysregulation, osteoporosis_bone_resorption) were considered and deliberately withheld on evidence grounds, documented as a discussion rather than silently omitted.

    Fourteen references, all fetched with `just fetch-reference`; no deep-research provider report was generated for this entry and that omission is stated explicitly in the entry notes rather than left to be inferred.

    Validation: `just validate kb/disorders/Turner_Syndrome.yaml` passed schema, terms and references, reporting "Snippets checked: 83/83 verified against cached references".

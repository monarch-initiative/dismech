  details: |
    Review-response pass on PR #8284, addressing the single blocking finding of the ai4c-reviewer CHANGES_REQUESTED review of 2026-08-13.

    The sole evidence item on the Progressive Aortic Dilation to Aortic Dissection and Rupture causal edge quoted the title of PMID:23032325 ("Moderate aortic enlargement and bicuspid aortic valve are associated with aortic dissection in Turner syndrome"). That fails the always-run check_title_snippets.py --against-ref gate merged to main in #8374, which was the only red CI check on this PR. Per CLAUDE.md section 6, --update-baseline is not an option: CI grandfathers against the base branch and so cannot admit a new title snippet, and the guidance is explicitly not to fight the gate.

    Replaced it with the registry's own CONCLUSIONS sentence, which states the finding rather than the topic: "Aortic dissection in Turner syndrome occurs in young individuals at smaller aortic diameters than in the general population or other forms of genetically triggered aortopathy." This is a strictly better quote for this edge - it names the dilated substrate and the Turner-specific downward shift in the calibre at which dissection occurs, which is the reason the edge is curated separately from generic aortopathy. The explanation was rewritten so it no longer describes the snippet as a title statement.

    Nothing else changed: one evidence item, its snippet and its explanation.


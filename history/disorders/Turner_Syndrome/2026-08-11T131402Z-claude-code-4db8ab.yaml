  details: |
    Review-response pass on PR #8284, addressing findings 2-11 and 13 of the ai4c-reviewer CHANGES_REQUESTED review.

    Finding 2 (under-consumption of PMID:38748847): the 2024 international clinical practice guideline was already cached in full text by this PR but only two abstract sentences were consumed. Mined for a further 27 exact-quote snippets across phenotypes, biochemical, diagnosis and treatments.

    Finding 3 (missing >10%-prevalence phenotypes): added Lymphedema (HP:0001004, OCCASIONAL from the quoted 12-27%), Recurrent Otitis Media and Middle Ear Disease (HP:0000388), Hypertension (HP:0000822), Scoliosis (HP:0002650), Hypothyroidism (HP:0000821). Frequency bands are deliberately omitted on four of the five, where the source figure straddles an HPO band boundary, differs between children and adults, or is absent.

    Finding 4 (missing guideline treatments): added Antihypertensive Therapy (NCIT:C172184, beta-blocker + ARB agents), Fertility Preservation by Oocyte Cryopreservation (NCIT:C71326), and Otologic and Audiologic Management (NCIT:C70906). The antihypertensive link to Progressive Aortic Dilation carries a NO_EVIDENCE item quoting the guideline's own statement that no study has shown antihypertensives slow aortic dilation in TS.

    Finding 5: added a biochemical section (FSH, LH, AMH) with readouts linking FSH/LH to the endocrine node and AMH to the upstream follicular-attrition node it actually measures.

    Finding 6: added Cardiac Magnetic Resonance Imaging (NCIT:C137915) to diagnosis, giving the aortopathy arm its diagnostic join point.

    Finding 7 (debundling): split three bundled nodes into atomic ones - SHOX Haploinsufficiency (MOLECULAR) to Growth-Plate Chondrocyte Dysregulation (CELLULAR); Progressive Aortic Dilation to Aortic Dissection and Rupture; Ovarian Dysgenesis with Streak Gonad (TISSUE) to Hypergonadotropic Hypogonadism and Estrogen Deficiency (ORGANISM). All inbound references updated.

    Findings 8-10: somatropin retagged PROTEIN_REPLACEMENT; the misleading GO:0009048 dosage-compensation annotation dropped, with the reasoning recorded in node notes rather than left as a silent omission; variant_origin DE_NOVO removed from the SHOX genetic entry.

    Findings 11 and 13: diagnosis_term added to Renal Ultrasonography (NCIT:C159885) and Audiological Surveillance (NCIT:C38036); 30-metaphase minimum and second-tissue strategy added to Karyotype Analysis; new Y Chromosomal Material Screening diagnosis entry with its gonadoblastoma-surveillance consequence.

    Also corrected two claims the reviewer showed were falsified by the PR's own cache file: the knowledge-gap rationale no longer says growth hormone and estrogen are the only mechanism-linked therapies, and the notes no longer exclude oocyte cryopreservation on opinion-paper grounds.

    Finding 1 (no deep-research artifact) is NOT addressed: no DR provider is reachable from this environment. Flagged in the PR comment for a curator with DR access.

    Validation run and read: just validate kb/disorders/Turner_Syndrome.yaml passed - schema clean, term validation passed, 129/129 snippets verified against cached references. Cache diffs are additive only (7 rows, all written by linkml-term-validator). No references_cache file was hand-written or hand-edited.

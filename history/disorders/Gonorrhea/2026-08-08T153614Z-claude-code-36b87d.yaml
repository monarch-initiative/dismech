  summary: 'Update: Gonorrhea - fix misplaced gene-level evidence, add C8A/C8B'
  details: |
    Fixed a claim-evidence mismatch I introduced in the previous commit, plus the accompanying suggestion.

    The error: the PMID:1554498 sentence naming 'C6, C7 and C8' as inherited terminal-component deficiencies was attached to the C9 gene entry - the one terminal component that sentence excludes - while C6 and C7, which it names, did not carry it at all. The item's own explanation said it anchored 'those two gene entries', which were different entries. It was also marked SUPPORT. This is the same failure mode as the first round's blocking item: an evidence item whose snippet does not support the claim it is attached to. Introduced while fixing a different instance of that same problem, which is worth recording.

    Fix: moved the naming sentence onto C6 and C7, removed it from C9, and gave C9 an explicit note stating that C9 appears nowhere in that abstract so no gene-level anchor is claimed for it.

    Second fix: the class-level PMID:1554498 quote carried by several genes was explained as establishing 'the gene-level association'. The sentence names no gene and its worked example is Neisseria meningitidis. Reworded on every entry that carries it to say class-level and meningococcal, which is what the sentence actually supports.

    C8 added, with a disambiguation the reviewer's suggestion did not anticipate. The suggestion was to curate C8 as hgnc:1352. That CURIE is C8A specifically, but the source says only 'C8'. Inherited C8 deficiency is genetically heterogeneous - the protein is a heterotrimer and deficiency arises from either the alpha-gamma subunit (C8A, hgnc:1352) or the beta subunit (C8B, hgnc:1353). Curating C8A alone would have asserted a subunit the source does not identify. Both are therefore curated, each carrying the naming sentence marked PARTIAL with an explanation stating that the source does not disambiguate. The entry notes record the reasoning so a later curator does not collapse them.

    Validation: just validate passes; snippets 64 of 64 to 69 of 69 verified; check_snippet_length clean; compliance 77.7 to 78.6 percent global, 78.8 percent weighted. A duplicate notes key on the C9 entry, created when the earlier description-to-notes conversion met the new note, was caught by the YAML parser and merged.

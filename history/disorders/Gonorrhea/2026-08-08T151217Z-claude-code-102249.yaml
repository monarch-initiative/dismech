  summary: 'Update: Gonorrhea - address review (evidence quality, uncited refs, genetic
    section)'
  details: |
    Addressed a REQUEST_CHANGES review of the Gonorrhea entry. Five blocking items, all fixed.

    The central criticism, and it was correct: the entry's notes justified several omissions on the grounds that no cached source quoted the claim, and that premise was factually wrong. Quotes supporting tenosynovitis, skin lesions, chronic pelvic pain, ectopic pregnancy, tubal infertility, Fitz-Hugh-Curtis perihepatitis, and the asymptomatic-infection pattern were all sitting in abstracts already fetched and committed in this PR. That is worse than a plain omission, because a rationale that misstates the evidence base discourages the next curator from looking. The notes now open with an explicit correction recording the error rather than quietly dropping it.

    Claim-evidence mismatch fixed. The PMID:40334533 vaccine item quoted 'We identified 12 eligible studies for qualitative analysis', which says nothing about cross-protection. Replaced with the meta-analysis conclusion, 'OMV vaccines offer moderate protection against gonorrhoea'.

    Five previously unevidenced phenotypes now carry real evidence. Tenosynovitis and skin lesions from the 49-patient disseminated-infection series; chronic pelvic pain, ectopic pregnancy, and tubal infertility from the PID sequelae sentence. No frequency bands were added: the disseminated-infection percentages are proportions of DGI subgroups rather than of patients with gonorrhea, and the notes now say so explicitly.

    All four cached-but-uncited references are now consumed. PMID:6769152 backs a new Fitz-Hugh-Curtis perihepatitis phenotype, which was absent from the entry entirely. PMID:42259835 is cited on the OMV vaccination treatment, giving the detergent-extracted-OMV cross-protection mechanism and its 31-59 percent effectiveness range. CORRECTION: an earlier version of this record stated that it could not also go on the KNOWLEDGE_GAP discussion because the Discussion class has no evidence slot. That was wrong. Discussion does carry an evidence slot; my check truncated the slot list one line before it. The claim is corrected here rather than left standing, because a future curator would read it as a true statement about the schema. Both discussions on this entry now carry evidence. PMID:15653780 backs a new asymptomatic-infection phenotype. PMID:28886683 corroborates the murine surrogate-host caveat on the animal model.

    Title-as-snippet replaced with claim-bearing sentences for PMID:12346974, PMID:11580753, PMID:23007248, PMID:6415361, and PMID:21747807. PMID:6112797 and PMID:2506350 keep their titles because those records have no abstract in PubMed, and the explanation now says so rather than leaving it to be re-flagged.

    New genetic section with five complement susceptibility entries - CFI, C6, C7, C9, CFH - all relationship_type SUSCEPTIBILITY rather than CAUSAL, since these govern dissemination of an exogenous infection rather than causing the disease. The prose sits in notes and association because the Genetic class has no description slot. The same five genes are also wired onto the Haematogenous Dissemination pathophysiology node via its genes slot, which took gene-to-mechanism wiring from 0 of 5 to fully connected.

    Two of the three new phenotypes carry a free-text preferred_term with no term binding, because HPO has no suitable term: Fitz-Hugh-Curtis perihepatitis, and asymptomatic infection, which is an absence of phenotype rather than a phenotypic abnormality. Both are recorded in notes as new-term-request candidates alongside the pre-existing ectopic pregnancy enum-reachability gap.

    Asymptomatic infection was also wired into the pathograph from the colonization node, taking phenotype connectivity back to 100 percent.

    Validation: just validate passes for schema, terms, and references; snippets went from 41 of 41 to 57 of 57 verified; validate-graphs reports no dangling causal targets; phenotype connectivity 100 percent; gene-to-mechanism wiring 5 of 5; check_snippet_length clean against origin/main; compliance rose from 69.9 to 75.8 percent global, 70.0 to 75.9 percent weighted.

  summary: 'Create: Gonorrhea'
  details: |
    De-novo curation of gonorrhea, MONDO:0004277, Neisseria gonorrhoeae, NCBITaxon:485. Chosen as the counterpart to the syphilis and treponematoses work curated immediately before it: the two classical bacterial STIs share an immune-evasion strategy but are opposites on antimicrobial resistance.

    Deep research: claude_code provider, 911 lines, 54 citations, 18 web searches, about 5 minutes. Treated as leads only.

    Reference verification and one misattribution. All 22 PMIDs the report cited were fetched. 21 were real and on-topic. One, PMID:32218555, was cited for the 4CMenB gonorrhea cross-protection finding but is in fact 'Metal Levels, Genetic Instability, and Renal Markers in Electronic Waste Workers in Thailand' - a real paper on an unrelated subject. Its cache file was deliberately not committed since nothing cites it, and the vaccine claims instead rest on PMID:35642527, PMID:40334533, and PMID:38986746, each fetched and verified. This is recorded in the entry notes.

    Two ontology errors of my own were caught before they reached the file. MONDO:0005113, reached for from memory, is bacterial infectious disease rather than gonorrhea; the correct term MONDO:0004277 was resolved with OAK. HP:0100601, likewise from memory, is Eclampsia rather than urethritis; the pre-edit validation hook caught it and the correct term is HP:0500006. Both are the same failure mode as the report's misattribution - a real identifier pointing at the wrong concept, which looks clean until something checks it.

    Content: 15 pathophysiology nodes running mucosal attachment, Opa-CEACAM engagement and epithelial invasion, the two immune-evasion arms (pilin/Opa antigenic and phase variation, LOS sialylation and complement evasion), anti-phagocytic survival inside neutrophils, neutrophil-driven immunopathology, absence of protective immunity, and the three dissemination routes - ascending tubal, haematogenous, and perinatal. 14 phenotypes, all connected to the graph. Four module conformances, all verified to resolve: the ceftriaxone PBP target and its penA-mediated acquired resistance, and the ribosomal target and its azithromycin resistance. A dedicated Sequential Loss of Antimicrobial Classes node carries the population-level trajectory the individual resistance nodes are instances of, and is the explicit contrast with the treponematoses.

    Two discussions: a HUMAN_MODEL_MISMATCH recording that the estradiol-treated mouse lacks the human CEACAM receptors and human transferrin/lactoferrin the curated mechanism depends on, and a KNOWLEDGE_GAP on which antigens mediate OMV vaccine cross-protection.

    Evidence discipline: no frequency bands are asserted anywhere, because no source cached here supplies a usable denominator. Seven phenotypes carry an explicit notes field stating that no evidence item is attached and why, rather than being propped up by a disease-level quote. Ectopic pregnancy additionally carries no term binding: HP:0031456 exists in HPO but is not reachable from the PhenotypeTerm enum root, so a free-text preferred_term is used rather than forcing a wrong-but-valid term - the same treatment condylomata lata received in the Syphilis entry. Several well-known claims are named in notes as deliberately not asserted, including the specific resistance determinants and the fluoroquinolone nodes, which were omitted entirely rather than asserted without a citable abstract.

    Validation: just validate passes for schema, terms, and references; 41 of 41 snippets verified against cached references; validate-graphs reports no dangling causal targets; phenotype connectivity 100 percent; check_snippet_length clean against origin/main; all four conforms_to references resolve.

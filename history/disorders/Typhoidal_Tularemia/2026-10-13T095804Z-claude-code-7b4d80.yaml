  summary: Bind the Francisella antibody test as a LOINC measurement
  details: |
    Added diagnosis_term (NCIT:C217458 Diagnostic Serology Testing) and measurements: LOINC:7888-1 (Francisella tularensis Ab [Presence] in Serum) to the Blood culture and serologic confirmation row. Unlike the Ulceroglandular/Oculoglandular subtypes, this row's evidence says only that serologic testing confirmed infection with no titer or Ig-class detail, so the most generic presence-level code was used rather than the titer-based code bound on the other two subtypes. Label verified against the Monarch KG via scripts/seed_loinc_cache.sh and cached in cache/loinc/terms.csv. Part of dismech tranche-B batch10 (LOINC_DIAGNOSTICS.md tranche B). Separate kb/disorders entry from Tularemia.yaml (covered in batch 7, #13974, with a different code on a different row); no conflict.

  summary: 'Create: Autosomal Dominant Nonsyndromic Hearing Loss 68 (DFNA68, HOMER2)'
  details: |
    De-novo curation of DFNA68 (MONDO:0014740, HOMER2) from a direct PubMed sweep; no deep-research provider run was commissioned, because the whole literature is nine records.

    Scope decision. Curated as a DISEASE. One gene, one clinical picture, no MONDO descendants, and no dismech umbrella entry or grouping exists for autosomal dominant nonsyndromic hearing loss to carry it as a has_subtypes row. The repository already keeps one entry per DFNA locus.

    Content. Eleven references fetched into references_cache (ten new, PMID:37371710 already cached from DFNA11), 94 exact-quote snippets, all verified. Sections: description, disease_term, parents, references, inheritance, pathophysiology (8 nodes), phenotypes (8, including two REFUTED absence phenotypes), prevalence, progression (4 phases), clinical_burden, genetic, diagnosis (2), treatments (3), animal_models (2 with modeled_mechanisms and readouts), discussions (3), external_assertions, notes.

    Mechanism. Three allele classes modelled as three separate pathophysiology nodes because the literature assigns them different functional_impact_category values: coiled-coil missense DOMINANT_NEGATIVE, CDC42-binding-domain frameshift DOMINANT_NEGATIVE, C-terminal extension GAIN_OF_FUNCTION. They converge on impaired scaffold multimerisation, loss of HOMER2-CDC42 coupling, failure of stereocilia actin maintenance, and hair-cell functional failure. The calcium-handling alternative is carried as a parallel branch with mechanism_confidence HYPOTHETICAL rather than dropped, because the founding paper left both hypotheses open and nothing has closed them.

    Module conformance. Two nodes conform to sensorineural_hair_cell_loss (Cochlear Sensory Epithelium Insult, Progressive Sensorineural Hearing Loss). The module's middle chain is deliberately not conformed: its central effector is apoptotic hair-cell death, and the HOMER2 models show hair-cell dysfunction with intact hair-cell populations in both mouse and zebrafish. excitatory_synapse_scaffold_disruption was considered and rejected on its own declared scope.

    GeneReviews baseline. No chapter exists for DFNA68 or HOMER2 (just check-genereviews reports NO_CHAPTER), and the general Genetic Hearing Loss Overview chapter NBK1434 contains no occurrence of HOMER2 or DFNA68. Both checks are recorded in the entry notes so a reviewer can re-run them.

    Validation. just validate, validate-terms, validate-disorders (94/94 snippets), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches (8/8 bindings name HOMER2), check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-case-collisions, check-reference-titles, check-stubs, check-term-cache-integrity, check-cache-order, model-scale-audit and prose-figure-audit all clean. list-disconnected-phenotypes reports 5 of 8 connected; the three unconnected are the two REFUTED absence phenotypes and Tinnitus, which is left unwired because no source on this disease proposes a mechanism for it.

    Self-audit. Every prose field was re-read against the cited sources after the entry was complete. Six claims that no cited source states were corrected, including a decade error (a patient whose onset was in her fifties described as onset in the fifth decade) and an inferred nationality for an unstated patient origin. Several absence claims were narrowed to the scope actually checked, and four evidence items were added so that claims previously carried only in prose now have verified quotes.

    Stub stubs/Autosomal_Dominant_Nonsyndromic_Hearing_Loss_68.yaml deleted in the same change.

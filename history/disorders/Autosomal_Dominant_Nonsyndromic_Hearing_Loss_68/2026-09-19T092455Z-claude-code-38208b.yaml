  details: |
    Review round 1 on PR #12287. One blocking finding, addressed; two suggestions, both taken.

    BLOCKING - GeneReviews claim did not reproduce. The entry notes asserted, and offered as re-runnable, that just check-genereviews reports NO_CHAPTER. It reports CITED_UNTAGGED, and had done since the first commit: naming NBK1434 inside the notes paragraph is itself a citation of a GeneReviews chapter, and the chapter was not declared in the references: block. The reviewer is right, and the failure is the one CLAUDE.md names - prose describing repository state rots, and a verification sentence that does not re-run is worse than no sentence.

    Fixed with both remedies the reviewer offered, because they close different halves. PMID:20301607 'Genetic Hearing Loss Overview.' is now tagged GeneReviews in references: - it is a real GeneReviews chapter, it is the general chapter for this disease class, and this entry genuinely consulted it, so declaring it is accurate rather than bookkeeping. The verdict moves to TAGGED and --strict exits 0; just tag-references then reports no further modification needed. The notes paragraph was rewritten to state the verdict that the checker actually emits, to say explicitly that TAGGED means the cited chapter is declared and NOT that DFNA68 has its own chapter, and to record what the earlier sentence got wrong so the correction is visible rather than silent. No evidence was manufactured from the chapter: its cached record is abstract-only and contains only the chapter's purpose statement and author affiliations, with no quotable finding.

    SUGGESTION - node count. The prior record said pathophysiology (8 nodes); there are 9. Corrected in place.

    SUGGESTION - no deep-research artifact. The reviewer accepted the declination without blocking. A run was nonetheless added, after the fact, as a cross-check: research/Autosomal_Dominant_Nonsyndromic_Hearing_Loss_68-deep-research-claude_code.md with its .citations.md sidecar. Two providers were available locally (falcon, claude_code); claude_code was used. Following the ARNSHL123 precedent the entry name was temporarily set to name the gene for the duration of the query, because the numbered label does not, and restored immediately by the run script.

    The run is clean on its own terms - preflight-dr PASS against MONDO:0014740, HOMER2 mentioned 43 times, OMIM 616707 matching on both sides, 15/15 references resolved at confabulation rate 0.0, 27/28 terms resolved with none obsolete and none naming a different term. It is NOT independent corroboration and the entry says so: the report states in its own first line that it used the curated dismech entry on this branch as a local resource, so its agreement is substantially a restatement. Nothing was imported from it. Identifiers it surfaced that the entry does not carry - a group-level ORPHA concept, an LOVD disease number, a group-level ICD-10 code, a DFNA2/KCNQ4 differential - were deliberately left out as unverified leads. The four terms its term-validation section flags are its own prose headings for HP terms the entry already binds with canonical labels; none is a binding disagreement. The claude_code provider emits no artifacts directory, so none is committed; the two DOI cache files written by its citation resolution are committed with it and are alternative identifiers for papers already cited by PMID.

    DECLINED - nothing. The reviewer raised no finding against the two structural calls (no conforms_to on the three middle nodes; three separate allele-class nodes) and explicitly endorsed both in the content-completeness assessment.

    Validation re-run before pushing: validate, validate-terms, validate-disorders (94/94 snippets), check-genereviews (TAGGED, --strict exit 0), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-case-collisions, check-reference-titles, check-stubs, check-term-cache-integrity, check-cache-order, list-gene-term-mismatches, validate-history-all.

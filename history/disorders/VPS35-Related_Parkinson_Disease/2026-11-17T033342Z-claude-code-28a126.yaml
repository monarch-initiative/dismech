  summary: 'Create: VPS35-Related Parkinson Disease'
  details: |
    Promoted PARK17 (MONDO:0013625) from a has_subtypes row on Parkinsons_Disease to its own Disease entry, the third per-gene Mendelian Parkinson entry beside PRKN and PINK1 (and the pre-existing LRRK2 and PARK7 entries). Name: the GeneReviews chapter title VPS35-Related Parkinson Disease (PMID:28796472, tagged), an established dyad under design decision 18. Deep research: falcon failed on authentication (403) and openscientist on its 24-hour spend limit, so the claude_code provider was run (research/VPS35-Related_Parkinson_Disease-deep-research-claude_code.md, 31 citations, 31 resolved, 1 of 1 quotes found; needs_review set only for two mislabelled terms, CL:0002450 and a stray markdown fragment, neither used); just preflight-dr PASS (VPS35 named 124 times, OMIM 614203 matches). The report surfaced the mitochondrial-fission arm (PMID:26618722) and the third knock-in line (PMID:33745227), both then read from cached abstracts. Reference discipline: of thirteen PMIDs first written from memory, seven resolved to unrelated papers (metabolic, mining-soil, choline-testing and other titles) and were discarded; every identifier in the entry was then located by PubMed title search and its cached title confirmed. Content: 12-node pathograph (D620N variant; impaired retromer-WASH association; defective endosome-to-Golgi retrieval; impaired autophagy and lysosomal degradation; mitochondrial fragmentation via VPS35-DLP1, conforming to the module mitochondrial node; enhanced LRRK2-mediated Rab phosphorylation; impaired synaptic receptor recycling and dopamine release; alpha-synuclein accumulation at PROVISIONAL confidence conforming to the module synuclein node with SUPPORT and REFUTE evidence; tau pathology; nigrostriatal degeneration and striatal dopamine deficiency conforming to the module; parkinsonism). 12 phenotypes from the GeneReviews baseline, five wired; AD inheritance with incomplete penetrance; case fractions 0.08% (8,870 cases) and 0.06% (1,774 cases); five variants with their status; nine-item treatment set from GeneReviews management; single Lewy-body-negative autopsy as histopathology with the kindred inference stated; FD-PET imaging; three discussions (CONTROVERSY loss vs gain of function, KNOWLEDGE_GAP human neuropathology, EMERGING_HYPOTHESIS LRRK2 inhibitors); three knock-in mouse models (MGI:1890467, resolved online) with readouts and typed divergences including two FAILS_TO_RECAPITULATE links. ClinGen Definitive quoted but not recorded in gene_disease_validity because it is asserted against MONDO:0005180. Validation: just validate, count-verified-snippets 129/129 against abstracts, validate-terms, check-gene-namespaces-online, check-genereviews TAGGED, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-logical-rules, check-enum-values, check-name-collisions, check-qualifier-terms, check-duplicate-keys, check-block-scalar-comments, check-delivery-system, check-folded-yaml, check-folded-hyphens, check-shared-disease-terms, check-snippet-grading, check-snippet-length, check-title-snippets, check-reference-titles, check-retired-support-prose, check-cache-order, check-term-cache-integrity, check-conformance-content (4 links sharing GO terms), model-scale-audit (7 links, all typed) all pass; list-gene-validity reports other_disease by design; list-disconnected-phenotypes leaves seven non-motor phenotypes unwired on purpose with the reason in each description.
    Review round 1 (changes requested, three items plus suggestions, all taken in one push): the antipsychotic treatment now targets a new Psychosis phenotype (HP:0000709, from the GeneReviews delusions-and-hallucinations sentence) and Depression Management is its own treatment; the Tau Pathology node gained the Niu et al. REFUTE item (no AT8 or MC-1 tau pathology in nigra or cortex), a FAILS_TO_RECAPITULATE link with readout from the Niu model, HYPOTHETICAL confidence and no GO binding; the endosome-to-Golgi retrieval node gained the Zavodszky et al. REFUTE item (apparently normal CIMPR and LAMP1 localisation) and dropped to PROVISIONAL with the weighing stated; the histopathology description names the Chen and Niu lines; Dopamine Agonist (NCIT:C66884, in the enum cache) binds the agonist row; a pRab10 biochemical readout (CANDIDATE_SURROGATE) was added for the LRRK2 node; the KNOWLEDGE_GAP rationale now records the tau disagreement; and the notes record that the rat viral-overexpression and Drosophila models from the report were left out as review-sourced. The two negative-result quotes come from the cached full texts, not the abstracts; just validate-disorders (the --no-full-text CI gate) verified all 139 snippets against the committed caches, as did count-verified-snippets.
    Same round: check-gene-activity-grounding flagged VPS35 as a gene on a node with no molecular function once the entry was compared against the merge base, so the root node now binds GO:0030674 protein-macromolecule adaptor activity (DECREASED) for the weakened FAM21/WASH adaptor interaction; the gate passes.

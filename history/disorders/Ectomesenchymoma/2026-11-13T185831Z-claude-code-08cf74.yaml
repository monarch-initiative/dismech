  summary: 'Review round: phenotypes, outcomes, the mosaic arm and the FOXO1 dispute'
  details: >-
    A review round on PR #17122. The verdict was that the entry was built from two of the roughly
    twenty papers its own research report found, and in places said the opposite of what that
    literature says. Six further already-cached references are brought in, taking the entry from two
    cited sources to eight; none was fetched for this round.


    The entry had no phenotypes, so the pathograph stopped at a tissue node. Three are added: the
    rhabdomyosarcomatous component, the neuroectodermal component and the presenting mass. The two
    components are wired off the divergent-differentiation node and the mass off the tumour-mass
    node, which takes the entry from no causally connected phenotype to all three. The component
    edges are constitutive rather than sequential and say so: the differentiation programme and the
    component it produces are one event at two scales.


    The mass row is bound to soft tissue neoplasm, not to a site term. Every HPO mass term names a
    body site, and those terms are siblings of one another rather than a general and a specific form
    of one thing, so binding abdominal mass would have asserted a site this tumour does not keep to
    - and would have excluded the head and neck, which is the commonest site in one of the three
    series that report site. Two cited sources call the entity a soft tissue tumour in terms, which
    is what the binding rests on. The neuroectodermal row keeps its neuroblastic term and its
    VARIABLE_SPECTRUM basis, and now states what that term does not cover: four of seventeen cases
    in the source series are ganglionic or Schwann-cell, which HPO files elsewhere.


    The Costello note contradicted the paper it cited, and the first repair of it read the same
    paragraph selectively. The paper says two things that pull in opposite directions: the HRAS
    mutations in this tumour are different from the ones described in Costello syndrome, and
    Costello syndrome predisposes to both rhabdomyosarcoma and neuroblastoma, which are this
    tumour's two components. It compares mutation spectra and nowhere excludes a germline variant;
    in the same sentence it says no normal DNA was available. The note now carries both halves. What
    the nearly homozygous pattern does point to is reported elsewhere: in two children with a
    neurocutaneous phenotype the variant was present in healthy tissue as well as tumour, at
    differing allele fractions, which is post-zygotic mosaicism. That is still somatic, so the
    record's typing stands.


    The FOXO1 row presented a disputed point as settled, and the row's own sentence said so after
    the dispute had been recorded beside it. Both are fixed. The row now says three cited series
    tested and found no fusion while two report fusion-positive cases diagnosed as this tumour, and
    points at the CONTROVERSY discussion. In that discussion the seventeen-case negative series is
    regraded from REFUTE to NO_EVIDENCE: it is a series of embryonal rhabdomyosarcoma with
    neuroectodermal differentiation, sixteen of seventeen embryonal, so FOXO1 negativity is
    substantially built into its inclusion criterion and it cannot say whether a tumour with an
    alveolar component carries the fusion. It is kept rather than dropped because it is the sentence
    a reader would otherwise take as the answer.


    The monoclonality evidence on the HRAS-to-divergence edge imported a method the quoted sentence
    does not attribute to that result - the abstract says microdissection of the methylation
    analysis, not of the copy-number one - and was graded DIRECT for a claim it is an inference step
    away from. The explanation is rewritten to the authors' own hedge and the grade is INDIRECT.


    Four prose claims about what the literature does not contain turned out to be false against
    references the same round had cited. The chemotherapy row said no cached source reports a
    response rate; one reports three of four evaluable tumours responding to induction chemotherapy.
    The prevalence note said one series alone calls the entity rare; four others do. The resection
    notes said nothing cached makes the completeness-of-resection claim for this tumour; a cited
    series concludes that combining chemotherapy with surgery and radiotherapy can improve the
    prognosis. And a relapse-versus-survival gap said to be unexplained by anything cited has the
    pattern that produces it - relapse then salvage - reported in both European series. Each is now
    stated as what the sources do say.


    Two numbers were wrong. The radiotherapy row said six of the nine operated children were
    irradiated; the source says four in one sentence and six in its relapse comparison, and six plus
    five does not equal nine. The entry now quotes both counts and says they do not reconcile. The
    row also called its comparison the only comparative signal in any cited source, which is false
    unqualified - the same abstract compares survival by FOXO1 status - and is now qualified to
    local treatment.


    Three smaller corrections. One resection reference was to a case report that is not in the
    entry's reference set and could not be found by a reader; it is removed. The resection row said
    both European series describe surgery as the local treatment, where one of the two never
    mentions surgery in its cached abstract. And two cooperative groups were called independent,
    which neither states.


    Treatment was one chemotherapy row with no link to any mechanism. Surgical resection and
    radiotherapy are added, each with a target_mechanisms link to the tumour mass node and each
    saying what it does not act on. Neither link carries a treatment_effect: the enum describes
    acting on a process, and neither removing a mass nor irradiating its bed is any of its values.


    A PHOX2B diagnosis row is added, with the same immunohistochemistry term its sibling rows carry.
    The marker a pathologist would expect to confirm the neuroblastic component is mostly absent -
    two of seventeen cases, focally - and the authors read low expression as a
    differential-diagnostic marker rather than as evidence against the component.


    Session-log prose is removed from permanent fields: three explanations and a note that described
    this round's own history rather than the disease, and a review_notes sentence scoped to this PR.


    Content fences. One further case report of mosaic HRAS in this tumour is deliberately not cited:
    its finding is reported together with chromosomal changes this project does not record, so the
    whole source is left out rather than quoted selectively. The methylation paper is cited for its
    shared copy-number profile without naming a chromosome arm, and one series' ALK result is not
    used. The PR body repeats all three.


    Not done in this round, and raised rather than settled: differential diagnoses, which the review
    lists separately and which is a follow-up row; and the demographics the review suggests, male
    predominance in both series, which is a small row better placed with the Orphanet transcription.


    Validation: just validate passes; just count-verified-snippets reports 56/56 for the whole
    entry, up from 30, and just list-disconnected-phenotypes reports 3 of 3 connected. Every
    reference_title in the file was rewritten programmatically from its cache rather than typed,
    which caught one wrong title in this round's own additions. A separate commit on this branch
    moves the curie header back to the top of the disease-term enum cache, where an earlier conflict
    resolution on this branch had left it appended as the last line; no row is lost or gained.

  summary: Record the 2026 WHO removal of the entity, and what it means for this entry
  details: |
    The entry's review_notes set out three positions on where this entity belongs and said the
    question was unsettled. A committed cache the entry did not cite, the sixth edition of the WHO
    soft tissue and bone classification, says the field's own classification settled it: ectomesenchymoma
    was removed as a separate entity and is recognised as a subtype of embryonal rhabdomyosarcoma,
    under the name embryonal rhabdomyosarcoma with divergent neuroectodermal differentiation. That is
    also where the three synonyms this entry already carried, uncited, come from.

    Unsettled and settled-against are different states, and the entry was reporting the first while
    the second was true. review_notes now records the 2026 position as current and restates the
    dismech decision accordingly: keeping a separate entry is a decision taken against a current
    authority rather than in the absence of one. The decision itself does not change, and the reason
    is about this repository rather than the biology - MONDO:0002855 is live, is not filed under any
    rhabdomyosarcoma class, carries its own ICD-O morphology code, and is what this entry binds.

    A second discussions entry records the disagreement as a CONTROVERSY rather than leaving it in
    prose, so it is queryable alongside the FOXO1 controversy the entry already carried. It attaches
    to disease# because the dispute is about the entity itself rather than about any node. It says
    the resolution is a MONDO question before it is a dismech one.

    What this row does not do. It does not add a pointer subtype to Embryonal_Rhabdomyosarcoma, and
    it does not rebind disease_term. Either would act on the WHO position, and acting on it is a
    larger decision than recording it - the granularity ladder reads the MONDO class, and that class
    has not moved. It also does not touch the lineage axis in the entry's pathophysiology, which the
    research report framed as two cell-of-origin hypotheses; no cached source proposes a muscle or
    myogenic progenitor as the cell of origin, so that framing had no support and is not used.

    57 snippets verified. The reference was already committed and is now cited for the first time.
    Offline gates green, including check-snippet-grading.

    An adversarial pass found the reconciliation half-delivered and two claims false.

    Half-delivered: the new paragraph said that settled-against is a different state from unsettled
    and that a reader should know which this is - while three statements still said unsettled. The
    entry-level description summary, the first sentence of review_notes, and the paragraph giving the
    reason for not adding a pointer subtype to Embryonal_Rhabdomyosarcoma. The last was the worst,
    because its stated reason was that the literature has not settled the placement, which this change
    withdraws. All three are rewritten, and the pointer paragraph now gives the reason that survives:
    the placement is settled by WHO and not followed by MONDO, so adding the pointer would act on the
    WHO position while the entry's binding still reflects MONDO's.

    False: the new paragraph said the classification is where this entry's three synonyms come from.
    The entry carries five synonyms, they predate this citation, and only one of the three
    rhabdomyosarcoma-shaped ones appears in the classification at all - the other two come from the
    larger clinical series, whose abstract uses them throughout. The sentence now says what is true,
    that the classification uses a name the entry already carried.

    Also false by the time the change landed: a notes sentence counting eight cited sources with one
    cached as full text. Citing the classification makes it nine and two. Prose describing repository
    state, rotted by the change that wrote it.

    One repair rather than a correction: the snippet stopped immediately before the naming clause its
    own explanation relied on. The fuller quote verifies through the normalizer despite the curly
    quotation marks in the source, so it is quoted through that clause now.

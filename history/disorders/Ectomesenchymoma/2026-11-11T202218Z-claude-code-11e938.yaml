  details: |
    New entry for ectomesenchymoma, MONDO:0002855. This row began as an ectomesenchymoma subtype row on Embryonal_Rhabdomyosarcoma and was restructured after two read-only verifiers independently argued the structure was wrong. They were right. MONDO:0002855 carries the xref ICDO:8921/3, which is the ICD-O morphology level, and design decisions section 3a makes that level its own Disease entry rather than a has_subtypes row. MONDO's own parents for the term are sarcoma and nervous system cancer, not any rhabdomyosarcoma class. A subtype row would have asserted a placement that the entry's own review_notes then spent a paragraph contesting, which is the shape CLAUDE.md warns about for a disputed locus: the row asserts the thing exists as a subtype, and a caveat hanging off it does not undo that. The ERMS change is reverted in this PR; the curated_in pointer row is a separate PR after this merges. Built entirely from two cached full-text sources, PMID:26872011 and PMID:42851199, both read end to end rather than from the research report. The entry carries no phenotypes because neither source reports presenting symptoms; both report site, histology, immunophenotype and genotype, and that is what is recorded. The two series are kept apart rather than pooled: they disagree on the RAS mutation rate, 6 of 7 against 3 of 17, and on the commonest neuroectodermal component, and nothing cached explains either difference. The HRAS node is the cell-of-origin node by its somatic genetic_context, and its neural crest cell binding is recorded as the hypothesis the entity's name derives from rather than as a demonstrated lineage, with a BACKGROUND evidence item saying so. The somatic call carries its own caveat in notes: the genomic series could not establish germline status for three of the four p.G13R cases because no normal DNA was available, and a germline HRAS G13R would be Costello syndrome, which itself predisposes to rhabdomyosarcoma. Every CURIE was read from the local MONDO, NCIT or HGNC build, or from the committed CL, GO and UBERON caches, in the step the line was written. The deep-research run for this entry was launched but its provider warns that agentapi is not on PATH; the entry does not depend on it. Two read-only verifiers were then run in parallel against the entry, split by axis. The claim-truth axis found eight things, five of them blocking, and all are corrected before the push. The prevalence notes said the rarity band recorded the word both series use; the larger series uses no frequency word at all, so that record is now a CASES_IN_LITERATURE count of the published literature with the rarity claim attributed to the one paper that makes it. The headline description said most tumours carry an activating HRAS hotspot mutation, which silently pooled the two series the rest of the entry refuses to pool; it now states the disagreement. Two places read 8 of 17 as a majority, where the source says most frequently involved site and 8 of 17 is a plurality. The HRAS node argued that the FusionSeq negative made HRAS the driver, which does not follow: the same paragraph reports PTPRD hotspot mutations in both index cases too, and what separates them is the five-case screen in which no further PTPRD or FBXW7 mutation appeared - that sentence is now cited. An explanation called the muscle programme dominant on the strength of a clustering result that says nothing about the relative weight of the two programmes, and which the same paper's neuronal signature cuts against. A case-selection sentence was graded PRIMARY_RESULT and is now BACKGROUND. An edge was cited with a quote about anatomic site whose own explanation conceded it did not reach the claim; it now cites the biphasic-tumour sentence and the site quote has moved to the node it describes. The review notes said a genomic study of intracranial cases where the source refers throughout to a single case. The bindings and hygiene axis separately found that the HRAS node bound a gene with no molecular function, failing check-gene-activity-grounding; GO:0003925 G protein activity is now bound with modifier GAIN_OF_FUNCTION, and the node's notes say why that differs from the INCREASED on the process beside it. One correction to the brief the verifiers were given: PMID:42851199 is cached as an abstract, not as full text, and the entry now attributes claims to one series or the other rather than to both where that matters. A second round on the bindings axis found two further things. A tracked reference cache, references_cache/PMID_34755412.md, had been silently rewritten by a validation run - issue #9963 - although this entry does not cite it; it is reverted, and all eight snippets the entry that does cite it carries verify against both the committed and the rewritten body, so nothing was at risk. And CL:0000540 neuron was bound for a preferred_term reading neuroblast and ganglion cell, where CL does not make a neuroblast a kind of neuron: CL:0000031 sits on the precursor branch and CL:0000540 is not among its ancestors, so the binding covered only the smaller half - ganglion cells in 2 cases against neuroblastoma in 12. The row is split, with CL:0002676 neural crest derived neuroblast for the neuroblastic half, which Neuroblastoma already binds eight times for the same cell. Two recommendations were also taken: the two cohort RAS shares moved out of the free-text frequency field into structured case_fractions, and the mass node's location, whose preferred_term was a union, now binds both UBERON:0002355 and UBERON:0004122 rather than one limb of it.

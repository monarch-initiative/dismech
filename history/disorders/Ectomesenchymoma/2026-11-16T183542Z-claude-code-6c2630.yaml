  summary: Add differential_diagnoses; repair two refuted prose claims
  details: |
    Added a three-row differential_diagnoses block - embryonal rhabdomyosarcoma (MONDO:0009993), alveolar rhabdomyosarcoma (MONDO:0009994) and malignant peripheral nerve sheath tumour (MONDO:0017827) - with eight evidence items, all quotes taken from already-cached references. Malignant triton tumour is folded into the MPNST row as a distinguishing feature rather than given a row of its own, because the KB models it as a subtype_term under MPNST and because one marker (H3K27me3) separates ectomesenchymoma from both. No neuroblastoma row was added: the only quotable sentence, on low PHOX2B expression as a differential-diagnostic marker, does not say which two entities it discriminates, and the entry already carries it as a diagnosis row. Two prose claims were refuted by re-reading the caches and repaired. The prevalence notes said one cited source used no frequency word and that the genomic series alone counted the literature; in fact five sources call the entity rare, exceedingly rare or extremely rare, three use no frequency word, and two give counts (64 cases as of 2016 in PMID:26872011, 50 as of 2012 in PMID:22535600). A pathophysiology note said neither cached source described the GDP/GTP hydrolysis defect; PMID:26872011 states it in its discussion, so the note now records that the source gives the biochemistry but measures no hydrolysis rate, and that the GAIN_OF_FUNCTION grade rests on the codon rather than on an assay.

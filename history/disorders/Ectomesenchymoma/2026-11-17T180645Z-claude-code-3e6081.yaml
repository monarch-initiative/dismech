  summary: 'Edit: Ectomesenchymoma — the cell of origin as two hypothesis groups,
    and three recorded gaps'
  details: |
    Adds the entry's first mechanistic_hypotheses section, with the two accounts of where this tumour starts, and tags the edge they disagree about.

    The myogenic group is recorded as the canonical one, on two quotes: methylation profiling that included microdissected components aligns the tumour with the embryonal rhabdomyosarcoma superfamily and finds a myogenic programme on both sides of the histological divide, and the genomic series' conclusion that a skeletal-muscle gene signature with retained H3K27me3, alongside the HRAS mutations, reads as a closer relationship to rhabdomyosarcoma than to malignant peripheral nerve sheath tumour. That series' unsupervised clustering groups ectomesenchymoma tightly with rhabdomyosarcoma as well, and was already quoted on the divergent-differentiation node, so the description points there rather than quoting it twice. The same series reports upregulation of skeletal muscle and neuronal genes together, which the description records, because the expression profile is not myogenic alone. The 2026 WHO classification's removal of ectomesenchymoma as a separate entity is deliberately not among the group's support: it is a classification decision reporting no lineage data, so it is the nosological counterpart of this reading rather than evidence for it, and it is cited on the ems_entity_status controversy instead. The neural-crest group is recorded as the alternative, and its strongest support is not the tumour's name but a mosaic finding: in two patients with a neurocutaneous syndrome the HRAS variant was present at different variant allele fractions across tissues including healthy ones, which times the driver event no later than the migrating ectomesenchyme. The two are not written as rivals, because a neural-crest-derived progenitor may run a myogenic programme and the timing evidence comes from two mosaic patients rather than from sporadic tumours. The edge from the HRAS hotspot mutation to divergent differentiation opts into both groups, since both models contain that edge and explain it differently.

    Three knowledge gaps are added, and all three had to be written more narrowly than planned. A digest of the entry's nine cached references found that none of them states that no experimental model of this tumour exists, none compares the RAS-mutation rate between series, and none names any RAS-pathway-directed drug. So each gap states what was searched and in which sources, rather than claiming the literature is silent: the model gap records the search terms and the single false-positive hit; the rate gap records the four reported shares, 6 of 7, 4 of 5, 2 of 2 and 3 of 17, with four reasons they cannot be pooled as they stand, namely an unstated testing denominator in the largest series, two post-zygotic mosaic positives in another, numerators that count HRAS alone in two of the four and any RAS-pathway mutation in the others, and a two-case methylation report that is a count rather than a rate; and the therapy gap records that the ten drug terms searched return nothing at all, and that the only proposal in the cited set to act on the RAS pathway is diagnostic rather than therapeutic, graded NO_EVIDENCE because it is the sentence a reader would otherwise take as the answer.

    The first draft of the hypothesis evidence carried three reference_title values written from memory, and all three were wrong. They were replaced with the titles parsed from the cached records before any gate was run.

    Three rounds of adversarial re-verification preceded the push, each by two read-only agents split by axis, and each found prose defects on top of content that was already sound. Round one: a claim that two mosaic HRAS positives were germline-mosaic, when a post-zygotic variant is not germline; a gap rationale that misreported its own search; a hypothesis label that turned an upper time bound into a location; an item graded SUPPORT whose explanation argued it did not bear on the claim; a description saying methylation places the tumour in a superfamily where the source says aligned with; and a sentence attributing whole-transcriptome clustering to a skeletal-muscle gene set. Round two: a hypothesis label asserting more than its quotes, and the WHO sentence described above. Round three: a description claiming two findings were quoted below when one of them was quoted on another node; a sentence whose "the same study" had come to point at the WHO classification after that sentence was inserted between them; the entry's notes singling out ganglioneuroma as the genomic series' commonest neuroectodermal component, where that series lists three without ranking them; and a cross-reference to the fourth paragraph of review_notes where the WHO position is in the third.

    Round three also reverted a paragraph move. The cell-of-origin caveat had been moved from the myogenic group's notes onto the HRAS node's notes, where it sits beside the lesion it is about. The disorder template renders a hypothesis group's notes but not a pathophysiology node's, so the move took the caveat off the rendered page and left a pointer to notes the page does not show. It is back in the hypothesis group's notes, with its justification narrowed to say that no cited source names a myogenic progenitor as this tumour's cell of origin, since the entry does bind skeletal muscle myoblast as the tumour's own rhabdomyoblastic cell on another node.

    Validated after those changes with the repository's nineteen-gate set over the changed entry, plus the cancer-origin derivation, name collisions, qualifier terms, reference-title agreement with the caches and the logical rules.

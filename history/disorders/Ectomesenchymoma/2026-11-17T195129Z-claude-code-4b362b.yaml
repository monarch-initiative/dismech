  summary: 'Edit: Ectomesenchymoma - the NCIT identity, the ICD-O morphology family and two older names'
  details: |
    Adds the entry's first mappings and classifications blocks, appended at the end of the file after review_notes. The schema declares both slots before notes, and, of the 215 entries that carried review_notes alongside either block before this one, 39 put every such block after it, so this is an established minority rather than the convention. Amyloidosis was the only one of those 39 whose file then ended with a block, but it is not the only entry in the corpus that ends that way - ATTR_Amyloidosis does too, with mappings earlier in the file and classifications last, and 62 other entries ended on one of the two blocks on some reading. The uniqueness claim an earlier version of this record made was scoped to the 39 and written as though it were corpus-wide. Nothing gates top-level key order. The placement was chosen for a second reason: it keeps the edit 38 untouched lines clear of the last hunk of the open hypothesis-groups PR on the same entry, and a three-way merge against that branch is clean.

    The NCIT identity is NCIT:C4716 Ectomesenchymoma, as skos:exactMatch with MONDO as the mapping source, because MONDO:0002855 cross-references that term directly. NCIT carries two further ectomesenchymoma classes, Childhood Ectomesenchymoma and Recurrent Ectomesenchymoma, and neither is this concept; C4716 sits under Malignant Soft Tissue Neoplasm. The CURIE, its label and its ancestors were read from the local NCIT build in the step the line was written.

    The ICD-O morphology family is Sarcoma, with evidence. Its justification was also rewritten: the first version argued from the ICD-O block structure, that 8921/3 sits with rhabdomyosarcoma rather than with the neural tumours, which nothing in this repository or in any local build establishes and which takes the side the entry's review_notes declines to take. The value is instead justified by an identity the repository can check - the Sarcoma enum value means NCIT:C9118 Sarcoma, which is an ancestor of the NCIT:C4716 term the mapping above binds - so the classification and the mapping agree by construction. The quote is the opening sentence of the genomic series' abstract, which calls the tumour a sarcoma outright, graded BACKGROUND rather than that paper's own finding. That NCIT records 8921/3 on C4716, whose legacy concept name is Rhabdomyosarcoma_with_Ganglionic_Differentiation, is noted in the explanation and not used as the reason.

    What was looked for and not added is recorded on the mapping's own notes so it is not re-derived. MONDO cross-references five identifiers this schema has no slot for - DOID, GARD, MEDGEN, UMLS and the ICD-O code itself; the ICD-O code is the one that carries information the entry uses, DiseaseMappings has no slot for ICD-O, and the classification holds only the code's morphology family, Sarcoma, not the code itself. Neither ICD-10-CM nor ICD-11 has a term for this disease. The nearest ICD-11 hit, Mesenchymoma of unspecified site, is placed by that build under neoplasms of uncertain behaviour and under benign neoplasms, where NCIT flags C4716 Malignant, so both slots stay absent. An earlier version of the note gave the difference as a missing neuroectodermal component, which the build cannot support - it carries no definition for that term at all.

    The synonym handling took two rounds to get right, and the outcome is the opposite of what the first version said. That version claimed MONDO records exactly two exact synonyms, both already carried, and that NCIT adds none beyond its preferred name. MONDO records four and NCIT three, and the false count came from reading a truncated runoak term-metadata listing as the whole answer where runoak aliases is the command that gives it. The second version kept both uncarried synonyms out and defended that with a reason a verifier then refuted: the entry's synonyms block already carries three rhabdomyosarcoma-shaped names that review_notes keeps and defends, so "listing one would assert the contested placement" condemns content the entry argues for - and it was simply untrue of sarcoma with ganglionic or neuroectodermal differentiation, which names sarcoma, as the entry's description, parents and new ICD-O value all do.

    So both are now carried, which is what a row about the older names should have done in the first place. The fourth is carried without MONDO's (morphologic abnormality) tag, which names a kind of concept rather than qualifying the disease, and is carried as the bare name: it is the NCIT legacy concept name of C4716 (NCIT:P366), where the current preferred name is Ectomesenchymoma, and the mapping's notes say so.

    No mondo_mappings block was added. The entry's disease_term is already MONDO:0002855 and nothing else in kb/ holds that term, so an exactMatch there would restate the binding without adding anything; the shared-disease-term rule only asks for one when a term is shared.

    The mapping record also carries a consistency block rather than leaving MONDO's own assertion in prose only: MONDO:0002855 names NCIT:C4716 in both its xref list and its skos:exactMatch, so the predicate recorded here is MONDO's.

    Two things are left as they are, with reasons. The file is not yamlfix-stable and was not before this change - with whitelines set to 1 the formatter collapses a paragraph break inside a folded scalar, which changes the parsed string, so the wrapper refuses and leaves the file untouched. Three values triggered it on main and this change adds a fourth, the mapping's own notes, written in the file's established style. And the new NCIT term is absent from cache/ncit/hierarchy.csv, so just check-hierarchy-cache now reports 47 missing rather than 46. That check is in neither just qc nor the PR lane, only the nightly sweep under continue-on-error, and rebuilding would pull in 46 unrelated rows and collide with other PRs' cache hunks.

    Review round (19 Nov 2026). The reviewer asked for the second paragraph of the NCIT mapping's notes to state only durable facts; it had described this change and this repository's synonym conventions rather than the disease. It now says which four exact synonyms MONDO records, that NCIT:C4716 carries the first three, and that the fourth is C4716's legacy concept name (NCIT:P366), carried without MONDO's tag; each of these was re-read from the local MONDO and NCIT builds for this round. The reviewer's optional suggestion was taken: the synonym is now the bare name, with its provenance only in the notes, so an exact-name search finds it. The gangliorhabdomyosarcoma paragraph the reviewer asked to keep now names its source and says no more than it does: the genomic series this entry cites records the name as the designation under which the first tumour with rhabdomyosarcoma and ganglioneuroma components was described, and a full-text search of both local builds, including the hyphenated and spaced forms, still finds it in neither ontology. The removed wording had called the name a historical name of the tumour, which is more than the source says; it records only that the first such tumour was described under that designation. A second pair of checks then led to two more corrections in the same push: the notes no longer say the ICD-O code is recorded in the classification, which holds only its morphology family, and no longer count the places where NCIT holds the fourth synonym. A draft of this round had removed that paragraph after a search of the reference cache returned nothing; the search had failed on the length of its file list rather than found nothing. The notes now also record that NCIT holds the fourth synonym's spaced form as the ICD-O-3.1 preferred term for code 8921/3, and no longer give DiseaseMappings a slot count, since the schema gained a slot for OMIM phenotypic series after the first version of this change. The mapping justification now names C4716's direct parent, Soft Tissue Sarcoma, which sits under Sarcoma. The reviewer could not check offline that NCIT:C9118 Sarcoma is an ancestor of NCIT:C4716, which the classification's explanation relies on; the local NCIT build confirms it, through C9306 Soft Tissue Sarcoma. The ICD-10-CM and ICD-11 searches in the first paragraph of the same notes were re-run and still hold.

    Validated with the repository's nineteen-gate set over the changed entry, reference validation included, plus the cache normaliser, the cache-order check and the term-cache integrity check. All passed, and re-run after the rewrites above.

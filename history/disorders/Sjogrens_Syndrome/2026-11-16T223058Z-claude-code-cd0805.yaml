  summary: Add telitacicept treatment and BAFF transgenic-mouse evidence
  details: |
    Added a Telitacicept treatment (NCIT:C166498; therapeutic_modality OTHER, as for other Fc fusion proteins in the KB) with evidence from its phase 2 RCT (PMID:37399108: 160 mg lowered ESSDAI vs placebo at week 24; 240 mg not significant) and a target_mechanisms INHIBITS link to Autoantibody Production, marked INDIRECT because the trial measured total serum immunoglobulins, not autoantibody titres. Added PMID:11781351 to Exocrine Gland Lymphocytic Infiltration: BAFF transgenic mice develop severe sialadenitis and reduced saliva (MODEL_ORGANISM), and BAFF is raised in patients' blood and inflamed glands (HUMAN_CLINICAL, quote_role BACKGROUND). Placed there rather than on Epithelial Cell Dysfunction because the abstract does not say epithelium produces the BAFF. Leads from the OpenScientist assessments in experiments/biomni_lead_exploration/sjogren/. Validated with just validate (73/73 snippets verified) and the whole-repo KB gates.

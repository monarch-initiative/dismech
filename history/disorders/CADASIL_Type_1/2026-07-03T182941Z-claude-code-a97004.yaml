  details: |
    Backfilled reference_title on all 27 untitled inline evidence items covering 6 PMIDs and 6 DOIs. Re-verified every evidence snippet as an exact whitespace-normalized substring of its cached source and confirmed each genuinely supports its claim. Pulled full text for PMID 37158955, PMID 38386425, PMID 36606642, and PMID 30855338 via validate-references. Added three full-text-sourced evidence items. First a quantitative NOTCH3 carrier-frequency figure of 3.4 per 1000 in the general population from PMID 36606642 which resolves a prior review note. Second evidence from PMID 38386425 that canonical NOTCH3 target-gene expression was essentially unchanged in transgenic CADASIL arteries supporting aggregation-driven gain of function over loss of Notch signaling. Third a genotype-dependent MIC-A/B immune finding from the jcm13113138 proteomics paper. Repaired the Immune Activation node description and one explanation which overstated the cited abstract by naming MMP-10 and leukocyte adhesion pathways that are not present in the cached source. No named entity confusion detected. All schema term and reference validators pass.

  summary: Re-anchor CADASIL Type 1 to MONDO:0000914 (NOTCH3-specific)
  details: |
    Item 3 of issue #7581. The entry was anchored on MONDO:0007432 (cerebral arteriopathy with subcortical infarcts and leukoencephalopathy), which OAK (sqlite:obo:mondo) confirms is the OMIMPS:125310 grouping term subsuming four distinct entities: MONDO:0000914 (CADASIL type 1, NOTCH3), MONDO:0014768 (CADASIL type 2, HTRA1), MONDO:0010829 (CARASIL) and MONDO:0979867 (ARCASIL type 1). The entry is named CADASIL Type 1 and curates hgnc:7883 (NOTCH3) as its sole causative gene; dismech curates none of the other three members. Re-anchored disease_term to MONDO:0000914, whose MONDO definition is 'has material basis in heterozygous mutation in the NOTCH3 gene on chromosome 19p13' (intersection_of RO:0004003 HGNC:7883) and which carries 'CADASIL' as an EXACT synonym. The previous skos:narrowMatch mapping to MONDO:0000914 was replaced with a skos:broadMatch mapping to MONDO:0007432, which under the documented coverage rule in CLAUDE.md correctly stops this entry retiring the parent grouping term from the curation queue. Same shape as the MECP2 re-anchor in PR #7505. Also makes the KB self-consistent: kb/disorders/Migraine_with_Aura.yaml already cites MONDO:0000914 as the CADASIL differential-diagnosis term. Independent corroboration in research/mondo_to_dismech_gaps.tsv (row 703, flags MONDO:0000914 as the better match) and research/kg_gene_gap.tsv (the KG expects HTRA1/HGNC:9476 under MONDO:0007432, a gene this entry does not curate). No mechanism, phenotype, or evidence content changed. Validated with 'just validate' (passed; 44/79 snippets verified against cached references, 35 skipped by prefix) and 'just validate-terms' (passed); both MONDO CURIEs were already present in cache/mondo/terms.csv and cache/enums/diseaseterm_f618932bb23f.csv, so no cache churn.

  summary: Wire P2Y12 antagonist treatment to the P2Y12 antagonism module
  details: |
    Added one therapeutic_vulnerability pathophysiology node, 'P2Y12 Antagonist Occupancy of Platelet ADP Receptors', conforming to p2y12_receptor_antagonism#P2Y12 Antagonist Occupancy of the Platelet ADP Receptor, and linked this entry's existing P2Y12 antagonist treatment to it with an ACTIVATES target_mechanisms link.

    The node carries no downstream edge, consistent with the other drug-mechanism conformers in the GPCR series: the drug's relation to the mechanism nodes already in this entry is prevention of thrombosis, not causation, so an edge would assert the wrong direction. It binds GO:0001621 G protein-coupled ADP receptor activity with modifier DECREASED, CL:0000233 platelet and hgnc:18124 P2RY12, mirroring the module trigger. GO:0001621 is specific to the ADP receptor, so unlike the calcium-sensing conformers the gene binding corroborates the receptor identity rather than carrying it alone.

    Where this entry's treatment also binds aspirin, and in one case atorvastatin, the node description and the link description both say those agents act elsewhere and are not asserted by this link. That is what makes a bundled treatment routable: the components are bound as separate agents, so each receptor can take its own link without asserting one drug's action for another.

    Evidence on both the node and the link is PMID:36306820, which states the blockade of ADP binding at P2Y12 and names ticagrelor among the antagonists that hold the receptor inactive.

    No existing content was changed: the node was appended to pathophysiology and the link appended to the treatment's existing target_mechanisms list where it had one. Validated with validate-disorders alongside the other two conformers (265 snippets, 323 titles, 0 issues) and with the offline structural gates.

  summary: 'Create: Hereditary Sensory Neuropathy Type 1D'
  details: |
    Created de novo ATL1 HSN1D (HSAN1D, MONDO:0013381) entry as a dedicated per-type file, following the HSAN2 precedent; read the HSAN umbrella entry first, which does not curate the ATL1 form. Deep research via claude_code provider. Pathophysiology chain: heterozygous ATL1 variant with reduced atlastin-1 GTPase activity (Guelly 2011, PMID:21194679) -> impaired homotypic ER membrane fusion (Orso 2009 PMID:19633650; Hu 2009 PMID:19665976) -> disrupted tubular ER network (PMID:21194679; Rismanchi 2008 PMID:18270207) -> length-dependent distal degeneration of long DRG sensory axons -> distal sensory loss. Phenotypes: distal sensory loss, painless skin ulcers, osteomyelitis/amputations, pyramidal-tract features (Leonardis 2012 N355K family, PMID:22340599). KNOWLEDGE_GAP discussion records the HSN1D-vs-SPG3A selective-vulnerability question (allelic disorders). No HSN1D-specific GeneReviews chapter exists (SPTLC1 chapter does not cover ATL1). All 17 snippets exact-verified; validate, validate-terms, validate-disorders, check-entity-refs, check-duplicate-keys all pass.

  summary: 'Create: Hereditary Sensory Neuropathy Type 1D'
  details: |
    Created de novo ATL1 HSN1D (HSAN1D, MONDO:0013381) entry as a dedicated per-type file, following the HSAN2 precedent; read the HSAN umbrella entry first, which does not curate the ATL1 form. Deep research via claude_code provider. Pathophysiology chain: heterozygous ATL1 variant with reduced atlastin-1 GTPase activity (Guelly 2011, PMID:21194679; dimerization PMID:21220294) -> impaired homotypic ER membrane fusion (Orso 2009 PMID:19633650; Hu 2009 PMID:19665976) -> disrupted tubular ER network (PMID:21194679; Rismanchi 2008 PMID:18270207; REEP1/spastin complex PMID:20200447) -> length-dependent distal degeneration of long DRG sensory axons -> distal sensory loss, with sequelae edges to painless skin ulcers -> osteomyelitis/amputations. Phenotypes: distal sensory loss, painless skin ulcers, osteomyelitis/amputations, pyramidal-tract features (Leonardis 2012 N355K family, PMID:22340599), distal muscle weakness and sensorimotor neuropathy on NCS (Orphanet review PMID:18348718).

    Round 2 (PR #10549 review response): backfilled reference_title on all evidence; connected the pathograph via phenotype sequelae; added evidence + target_mechanisms to Wound and Skin Care and evidence to Genetic Counseling (PMID:18348718); consumed uncited references — PMID:28396731 (no genotype-phenotype correlation; exons 4/7/8/12 hotspots) in the genetic notes and both knowledge-gap discussions, PMID:11685207 (SPG3A allelic), PMID:20200447 and PMID:21220294 for mechanistic depth; added diagnosis (NCS, imaging, molecular panel), differential_diagnoses (ATL3/HSN1F named-entity hazard, other HSAN), prevalence (ULTRA_RARE), progression (2nd-5th decade), a COS-7 experimental_models entry with a HUMAN_MODEL_MISMATCH discussion (fidelity LOW), and external_assertions for OMIM:613708 and MedGen:C3150972. No HSN1D-specific GeneReviews chapter exists (SPTLC1 chapter does not cover ATL1). Hyporeflexia (research §3, HP:0001265) was NOT added: no exact snippet supports it in the cached sources — the N355K family showed hyperreflexia, and neither abstract states hyporeflexia — so it was omitted rather than fabricated. All 36 snippets exact-verified; validate, validate-terms, validate-disorders, check-entity-refs, check-duplicate-keys all pass.

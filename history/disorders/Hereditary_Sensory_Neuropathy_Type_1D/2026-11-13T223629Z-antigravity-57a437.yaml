  summary: Review and enrich Hereditary Sensory Neuropathy Type 1D
  details: 'Added MONDO synonyms (HSN1D, HSAN1D, hereditary sensory and autonomic neuropathy type 1D)
    resolving the unproven Bookshelf baseline warning, and added NEUROLOGIC and GENETICS_ENVIRONMENT_DISEASE
    classifications. Added Corticospinal Tract Axonopathy (conforming to corticospinal_tract_axonopathy)
    and Distal Motor Axon Degeneration (CL:0008039 lower motor neuron, conforming to peripheral_axonal_degeneration)
    downstream of Disrupted Tubular ER Network alongside Distal Degeneration of Long Sensory Axons, routing
    Distal Muscle Weakness and Wasting through Distal Motor Axon Degeneration and linking Sensorimotor Neuropathy
    on Nerve Conduction Studies via reports_on to both sensory and motor axonal degeneration nodes. Replaced
    the spacing-artifact PMID:20200447 snippet on Disrupted Tubular ER Network with a clean primary-neuron
    colocalization sentence, fetched ClinGen CGGV assertion for ATL1-HSN1D (Definitive) onto ATL1 (hgnc:11231),
    bound NCIT diagnosis_terms, set Wound and Skin Care therapeutic_modality to BEHAVIORAL, and documented
    GeneReviews Bookshelf coverage (NO_CHAPTER for HSN1D; allelic SPG3A chapter PMID:20862796) in notes.


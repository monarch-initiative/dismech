  summary: Review BEST1 spectrum using full-text clinical and functional evidence
  details: 'Reviewed the genetic BEST1 retinal-disease spectrum after verifying that the worktree was
    based on current origin/main (f4f39eac19e6032fc45d5b68b991f21115e39fec). This entry had EDIT history
    but no REVIEW. Infectious and environmental diseases were excluded from this campaign.


    Content assessment across all eight review dimensions:

    1. Phenotypes: Adequate. Expanded retinal fluid, retinoschisis, anterior-segment, neovascular and
    childhood visual-development findings; corrected the EOG and angle-closure bindings. Removed unsupported
    spectrum-wide frequency labels. Clinical cohort denominators are not treated as population penetrance.
    Some phenotypes (including developmental eye abnormalities) lack a resolved molecular causal chain
    and are not forcibly connected to an unrelated node.

    2. Subtypes: Adequate. Retained BVMD, ARB, ADVIRC and MRCS, corrected RP50 to MONDO:0013175, and added
    BEST1-associated adult-onset vitelliform disease. MONDO:0000390 includes other genes and excludes
    non-vitelliform BEST1 phenotypes, so the umbrella descriptor is unbound. No exact distinct BEST1-AVMD
    term was established; it remains an unbound descriptor rather than receiving an other-gene AVMD binding.
    MRCS/ADVIRC and ARB/RP phenotypic overlap are explicit. A classic RP deletion case does not establish
    sole BEST1 causation.

    3. Mechanisms: Adequate. Separated channel dysfunction, transepithelial fluid transport, outer-segment
    uptake, subsequent protein clearance, microvillar structure, light-dependent microdetachment, fluid,
    deposits and degeneration. Added experimentally supported splice alterations, Hsp70/CHIP-dependent
    ubiquitination at BEST1 Lys149, mutant degradation/localization and CaV1.3 effects. Mechanistic uncertainty
    and allele/system specificity are preserved. P77S iodide-sensitive fluorescence is not patch-clamp
    chloride current; retained mutant RNA/protein disproves a universal ARB absence/NMD assertion. Deep-intronic
    NMD is predicted rather than measured.

    4. Treatments/trials: Adequate. Distinguishes active CNV treatment from intrinsic retinal fluid, variable
    CAI response, glaucoma procedures, refractive/low-vision care, preclinical augmentation/editing and
    PABA activation. The 2024 anti-VEGF comparison is observational with treatment-selection bias. NCT07185256
    was verified against the live ClinicalTrials.gov API (updated 2026-09-24): recruiting, adult, restricted
    BVMD/ARB eligibility; the combined phase 1b/2a is expressed in prose because the enum lacks that value.
    NCT05809635 is observational and its 2025 status update is stale relative to estimated May 2026 completion.
    NCT02162953 is research tissue ascertainment associated with the cellular study, not a BEST1 therapeutic
    trial.

    5. Genetics: Adequate. Added functionally investigated dominant alleles, P77S, three deep-intronic
    variants and the P233L/P346H study, with allele-specific expression/localization and augmentation
    responses. Did not infer universal dominant-negative action, universal biallelic null status, complete
    penetrance or a proven multigenic RP mechanism. The c.867+97G>A/T splice products also occur at lower
    proportions in wild-type constructs/tissues.

    6. Biomarkers/diagnosis: Adequate. Added molecular confirmation with segregation/phenotype context
    and imaging/electrophysiology. Normal-range EOG does not exclude the spectrum. GeneReviews PMID:20301346
    is tagged and mined across clinical characteristics, diagnosis, management and counseling. Two official
    Bookshelf fetches returned CAPTCHA rather than chapter text; the retrieved PubMed chapter abstract
    remains the quotable source.

    7. References/data/models: Adequate. Regenerated multiple abstract caches to recover full text and
    consumed the primary sources below. Added cellular and animal models with their limitations and public
    BioProject PRJNA633668, independently verified through ENA (secondary accession SRP262227). The literature
    reports targeted DNA/cDNA and scRNA sequencing; raw patch-clamp data are available on request rather
    than asserted to be deposited. Removed unrelated IFT122 and Best1-promoter-driven other-gene models
    and generic fly-channel papers from the curated bibliography; the discovery reports retain their bibliographies.

    8. Overall consumption: Adequate. Both research narratives, synthesis YAML and substantive citation
    sidecars were assessed. Their principal clinical, functional, genetic and therapeutic themes are represented,
    with human observations separated from model results and speculative intermediates. Animal microdetachments
    are not sole evidence for a human phenotype. Generic BEST2 neurotransmitter/IOP findings, other-gene
    models, unverified population estimates and speculative modifiers were not promoted to BEST1 disease
    claims.


    Full scientific main text, methods and available tables/figure captions were read for PMID:34015078,
    32882766, 32707085, 37747403, 39048936, 29540715, 33738427, 35806438, 29507198, 33039401, 38278445,
    29503890, 41827889 and DOI:10.1038/s41467-024-54938-z. The latter PDF''s BEST1 and BEST2 results were
    distinguished. Supplements were not recovered, and the older 34015078 cache lacks table rows. Abstract-level
    limitations remain for 21072067, 29370033, 31930599, 41421761 and 41456629 after regeneration; 30578502
    and the GeneReviews abstract were also read. The 40086732 abstract corroborates slow heterogeneous
    imaging progression but its results were not imported as an independent cohort from the overlapping
    38278445 study.


    Material source limitations resolved during review: 32882766 has conflicting dominant-disease variant
    names between methods and Table 1, so that allele was not imported. The Chinese 39048936 paper has
    inconsistent patient/variant and intervention counts; no pooled prevalence was derived. The 33039401
    paper has inconsistent eye/patient denominators for some atrophy figures, recurrent-allele counts
    and summary ERG categories; those values were not propagated. The 38278445 onset-stratified CNV counts
    exceed its total CNV count, so only the internally consistent primary cohort account informs the entry.
    The 29503890 deletion length conflicts with its coordinates and extends into an adjacent gene; no
    precise breakpoint/size assertion was imported. The 33738427 review misdescribes pseudohypopyon as
    anterior-chamber inflammation and has questionable mouse light-peak phrasing; neither was used.


    Deep full-text findings affecting translation: 32707085 used lentiviral augmentation, not AAV; R218C
    and N296H responded while A146K did not, and allele disruption differs from precise correction. A
    noncoding off-target site was observed. Canine 29507198 early microdetachments had retained photoreceptor
    nuclear counts, and light-dependent changes and local AAV rescue do not prove human efficacy. PABA
    rescue used engineered HEK293 mutant:wild-type coexpression rather than patient-derived RPE. The 2026
    lipoplex study reports correction percentages among surviving screened clones, also generated homozygous
    pathogenic clones, and performed limited predicted-site off-target screening; channel-function rescue
    was not measured. The more recent 41421761 ARB cohort did not demonstrate a significant linear annual
    acuity decline over its shorter follow-up.


    Validation: authoritative validate-disorders passed schema, term and reference checks with 119/119
    snippets verified, 144 titles, zero skipped/unavailable references and zero issues before final formatting.
    Entity/causal targets, coarse phenotypes, source-defect claims, snippet boundaries and GeneReviews
    baseline passed. Remaining whole-repository ratchets and commit hooks are recorded with the PR validation
    result.


    Final local checks: all four whole-repository snippet length/title/grading/reference-title ratchets
    passed against origin/main. Pre-commit hooks passed after formatting and exact-quote acronym annotations.
    Parsed KB content was verified identical before and after formatting. Unused cache-normalization changes
    were confirmed word-identical and restored.


  summary: Enrich harlequin ichthyosis subtype with outcome and presentation evidence
  details: |
    Added survival, cause-of-death, genotype-outcome and neonatal-presentation evidence to the Harlequin Ichthyosis has_subtypes entry, citing PMID:21339420 (45-case series) and PMID:21413658. The reported association between early oral retinoid treatment and survival in that series was deliberately NOT curated as a treatment effect: it is a retrospective questionnaire-based comparison with no randomisation and obvious confounding by indication and era of neonatal care, and the source claims only that retinoids may improve survival. That reasoning is recorded in the subtype description so a later curator does not read the omission as an oversight. All snippets verified as exact substrings of cached abstracts (43/43); schema, terms and duplicate-key checks pass.

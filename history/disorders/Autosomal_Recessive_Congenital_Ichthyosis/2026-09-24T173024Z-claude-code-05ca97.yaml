  summary: 'Genetics pass: gene-defined ARCI subtype series, LIPN and CASP14 wired,
    ST14 and KRT2 declined'
  details: |
    Genetics pass for the d2g series-028 gap list. The parent anchor was checked
    first and is correct: MONDO:0017265 is the ARCI umbrella and the entry models
    exactly that concept, so no anchor change was needed here.

    Added twelve gene-defined has_subtypes rows for the numbered ARCI series
    (ARCI1, 2, 3, 4A, 5, 6, 8, 9, 10, 12, 13, 14), each bound to its MONDO term and
    carrying the causal gene and its own evidence. These sit alongside the three
    pre-existing clinical-presentation rows; the two axes cross-cut and the entry
    notes now say so.

    Two genes reached the pathograph for the first time. LIPN was added to the root
    gene-defect node and to the epidermal lipid node. CASP14 was added to the root
    node and to a new pathophysiology node, Defective Filaggrin Catabolism and
    Natural Moisturizing Factor Generation, which conforms to the same module node
    as the other two branches and closes the gap between the transglutaminase and
    lipid branches.

    The genetic section was rebuilt from seven records to twelve: the unbound "Rare
    ARCI genes" catch-all was replaced by per-gene records for CERS3, PNPLA1,
    SDR9C7 and SULT2B1, and LIPN and CASP14 were added. Every record now carries a
    bound gene_term, relationship_type CAUSATIVE, variant_origin GERMLINE and a
    subtype foreign key. Cohort shares from two independent cohorts (74 Italian
    patients, 28 Indian patients) were added as structured case_fractions.

    Two genes on the MONDO checklist were investigated and declined. ST14 (ARCI11)
    causes a syndromic ichthyosis with follicular atrophoderma, hypotrichosis and
    hypohidrosis, and is absent from the thirteen-gene non-syndromic ARCI panel;
    this entry is scoped to non-syndromic ARCI. KRT2 (superficial epidermolytic
    ichthyosis) is an autosomal dominant keratinopathic ichthyosis that reaches
    this entry's MONDO subtree only through exfoliative ichthyosis. Both
    dispositions are recorded in the entry notes with their sources.

    The GeneReviews ARCI chapter was fetched and tagged in the references block.
    ClinGen has no Gene-Disease Validity assertion for any ARCI gene; all fourteen
    symbols were searched in the current download and none returned a row. Orphanet
    could not be consulted: the on-demand fetcher has no ORPHA source available in
    this worktree because the pinned Orphadata bulk XML is not present.

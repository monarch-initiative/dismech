  details: |
    Both Mercury_Poisoning absence notes (no toenail-specific LOINC specimen distinct from fingernail; no umbilical-cord specimen code) previously cited narrow ad hoc queries. Re-ran both against the Monarch API directly: q=Mercury, category=biolink:ClinicalMeasurement, returns total 96 hits / 49 LOINC entities across every specimen LOINC codes mercury for (Blood, Urine, Hair, Nail, Serum or Plasma, Red Blood Cells, Dentin, Tissue, Body fluid, cerebrospinal fluid, saliva, water, milk, food, feed, dialysis fluid). Nail is the only nail-family specimen among them (no toenail-specific variant), and none names a cord or umbilical-cord-tissue specimen. Both original claims were true; the notes now rest on the enumerated API result rather than a narrower, unenumerated search.

  details: |
    Claim-evidence correctness review (docs/reports/exposure-disorder-claim-evidence-review-2026-07-25.md).
    Thinnest entry of the ten reviewed (9 evidence items from 3 unique references). Fixes:
    (1) The negative claim that mercury from dietary fish or dental amalgam is not associated with ALS appeared twice with zero citations; sourced to PMID:30558238 with an explanation noting the design limit (online self-report case-control, 401 ALS vs 452 non-ALS) - absence of an observed association, not proof of no effect.

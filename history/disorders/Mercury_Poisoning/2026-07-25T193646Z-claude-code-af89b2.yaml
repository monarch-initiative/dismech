    (3) Added a diagnosis section (blood/hair/toenail mercury, PARTIAL, carrying the source's own caveat that these matrices may not reflect remote neuronal injury; umbilical cord methylmercury for prenatal exposure) and a treatments section (exposure cessation; supportive care cited to 'There is no effective treatment.').

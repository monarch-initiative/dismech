  summary: 'Create: Combined Oxidative Phosphorylation Deficiency 19'
  details: |
    Created the LYRM4 (ISD11) entry (MONDO:0014269). Deep research was requested from antigravity, whose quota was exhausted (HTTP 429), so the run fell back to claude_code; the report records requested_provider=antigravity with fell_back=true. just preflight-dr returned WARN because NFS1 is mentioned 17 times against LYRM4's 35; NFS1 is ISD11's own binding partner in the cysteine desulfurase complex rather than a second disease, so the report was kept and the sections naming NFS1 were read and used for mechanism. The report's own frontmatter reports 6 of 14 quotes unsupported, so no quote was taken from it; every snippet was copied from the cached abstracts directly. No GeneReviews chapter exists for LYRM4, and both clinical papers are cached as abstracts only, so clinical detail that appears only in their full text (stridor, hepatic steatosis, per-tissue enzyme percentages) was deliberately left out rather than cited from the report. The pathophysiology is an unbundled chain of twelve nodes from the homozygous variant through weakened ISD11-NFS1 binding, NFS1 aggregation and lost desulfurase activity to the central effector, then four separately evidenced client branches plus the infection-triggered crisis path. Three discussion sections cover the cysteine-availability therapeutic hypothesis, the unexplained complex IV deficiency, and the fibroblast sparing, each with a proposed experiment. Five nodes conform to the new mitochondrial_iron_sulfur_cluster_assembly_failure module. One phenotype was dropped because HP:0003811 Neonatal death sits under Clinical modifier rather than Phenotypic abnormality and is not in the PhenotypeTerm enum; the death is recorded in progression instead. Validated with just validate-disorders (174 snippets and 174 titles across the batch, 0 issues), just check-entity-refs and just check-causal-targets.

  summary: Create African Iron Overload as the missing hemochromatosis PS member
  details: |
    Duplicate preflight against origin/main c19e631ac06 found no MONDO:0011012, African Iron Overload, Bantu siderosis, or Dietary Iron Overload Disease entry or stub. All-state PR/issue searches found only the related PS pilot PR. Curated the dietary iron-overload entity separately from HFE-related hemochromatosis and established SLC40A1 disorders. Family segregation evidence supports an unidentified genetic contribution; the Q248H causal claim remains disputed. Added Orphanet phenotype frequency bands, mixed hepatic cell iron deposition, NTBI and diagnostic readouts, qualified tuberculosis susceptibility discussion, and a broad match to OMIMPS:235200 linked to the frozen pilot. References were fetched with just fetch-reference. GeneReviews baseline check returned NO_CHAPTER with synonyms. Fresh-context scientific review found no remaining blockers after adding NTBI and correcting the HCC evidence. Default validation passed with 32 snippets and 43 titles; snippet audit verified 32/32. EBI OLS repeatedly timed out for new MONDO/HP terms; the documented temporary local SQLite adapter procedure seeded derived caches, then validation passed with the unchanged repository configuration. Orphadata upstream differed from the pinned download; the fetch helper stamped the generated record with its actual 2026-06-23 release. The initial Asta research was largely generic/off-entity and is not a disease-specific evidence baseline. An additional OpenScientist report is pending cross-check. Perplexity could not run because of provider quota, and OpenAI deep research returned model_not_found; neither produced a report.

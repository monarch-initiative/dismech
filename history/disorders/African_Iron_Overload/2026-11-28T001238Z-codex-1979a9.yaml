  summary: Balance Q248H evidence and cross-check focused research
  details: |
    A focused Asta rerun with query_char_limit=70 preserved the full disease name and produced research/African_Iron_Overload-deep-research-asta-2026-11-28-2.md. All 39 extracted references resolved, but resolution does not establish topical relevance or accurate citation metadata. The report incorrectly paired PMID:12382201 with year 2020 and DOI 10.32388/kjhgwh; the fetched PMID record instead gives 2002 and DOI 10.1053/shem.2002.35636. That incorrect metadata was not adopted. Added the tentative Q248H iron-loading association from PMID:14636642 alongside the negative causal finding from PMID:16336444. The spelling SCL40A1 in the publication title is retained from the source, while the gene binding remains SLC40A1. Manual identity preflight confirms MONDO:0011012, OMIM:601195 and the dietary disease scope; the automated preflight skips gene discrimination because MONDO records no causal gene. Fresh-context follow-up review found no blocking omissions across all eight completeness dimensions. The HCC rat-model lead is preclinical and does not upgrade the human observational association to a causal claim. General thalassemia and transfusional-overload papers remain outside scope. A 64-character trial truncated Overload and was excluded; only the successful complete-name retrieval is retained in this PR. Removed workflow narration from the KB notes.

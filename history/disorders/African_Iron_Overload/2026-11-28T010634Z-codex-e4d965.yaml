  summary: Prefer the established name Dietary Iron Overload Disease
  details: |
    At user request, adopted Dietary Iron Overload Disease, the preferred label of ORPHA:139507, as the dismech display name. African iron overload remains a synonym and Bantu siderosis remains a historical synonym. The description retains the specific dietary disorder and unresolved host susceptibility; the rename does not expand the entry to every form of iron excess from oral intake. MONDO:0011012 and its canonical label remain unchanged. The filename and history slug remain stable under the entry-naming guidance, and earlier provenance/research artifacts retain their original names. This is a display-name preference, not a claim that the established MONDO label denotes the wrong entity.

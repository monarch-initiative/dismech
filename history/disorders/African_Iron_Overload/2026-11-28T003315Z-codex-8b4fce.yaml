  summary: Cross-check OpenScientist research and add prevention and observed outcomes
  details: |
    Reviewed research/African_Iron_Overload-deep-research-openscientist.md and its artifacts with a separate fresh-context scientific reviewer. The research recipe completed successfully and resolved 50 references; ontology validation retained mismatched labels and service timeouts. Added independently source-checked prevention using iron-free containers (PMID:20526004), selected-cohort follow-up mortality (PMID:10554633), adjusted HCC association (PMID:9620327), and historical necropsy TB association (PMID:8605366). The report incorrectly claims no survival data and misstates a rat carcinoma count. Its Q248H classification, assumed healthy gnomAD homozygotes, endocrine absence claims, numerical stages and unvalidated genetic inference were not adopted. Detailed accepted/rejected findings and partially inspectable computational provenance are recorded in research/African_Iron_Overload-openscientist-curation-review.md. Raw report and linked artifacts are retained unchanged; no independent computational reproduction is claimed.

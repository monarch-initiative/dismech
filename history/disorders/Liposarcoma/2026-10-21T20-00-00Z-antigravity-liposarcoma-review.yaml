  summary: Reviewed and enhanced Liposarcoma with evidence-backed classifications and histologic subtypes (WDLPS, DDLPS, MLPS, PLPS), causal edges from subtype pathophysiology nodes to clinical phenotypes, a sequelae edge from Soft Tissue Sarcoma Mass to Abdominal Distension, and target_mechanisms links on Surgical Resection, CDK4/6 Inhibition, and Trabectedin.
  details: Added Soft tissue liposarcoma to synonyms. Added evidence blocks to classifications (PMID:37298520) and all 4 has_subtypes entries (WDLPS, DDLPS, MLPS, PLPS using PMID:37298520, PMID:39456230, PMID:40747377). Added downstream causal edges from Adipocytic Differentiation Block, Dedifferentiation, FUS::DDIT3 Fusion Oncoprotein in Myxoid Liposarcoma, and p53 Inactivation and Cell-Cycle Dysregulation to Soft Tissue Sarcoma Mass, Retroperitoneal Mass, and Pain, plus a sequelae edge from Soft Tissue Sarcoma Mass to Abdominal Distension. Updated PMID:39456230 snippet grading across has_subtypes, pathophysiology, and genetic to HUMAN_CLINICAL with REVIEW_SYNTHESIS. Added target_mechanisms on Surgical Resection (Soft Tissue Sarcoma Mass), CDK4/6 Inhibition (12q13-15 Amplification of MDM2 and CDK4), and Trabectedin (FUS::DDIT3 Fusion Oncoprotein in Myxoid Liposarcoma).

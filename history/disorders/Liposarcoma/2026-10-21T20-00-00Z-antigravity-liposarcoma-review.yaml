  summary: Reviewed and enhanced Liposarcoma with evidence-backed classifications and histologic subtypes (WDLPS, DDLPS, MLPS, PLPS), molecular_functions and cell_types on pathophysiology nodes, downstream causal and sequelae edges to clinical phenotypes, therapeutic_modality on small-molecule treatments, and a target_mechanisms link on Surgical Resection.
  details: Added LPS to synonyms. Added evidence blocks to classifications (PMID:37298520) and all 4 has_subtypes entries (WDLPS, DDLPS, MLPS, PLPS using PMID:37298520, PMID:39456230, PMID:40747377). Added molecular_functions annotations on three pathophysiology nodes and cell_types (CL:0002570) on two pathophysiology nodes. Added downstream causal edges from Adipocytic Differentiation Block to Soft Tissue Sarcoma Mass and Lipomatous Tumor and from FUS::DDIT3 Fusion Oncoprotein in Myxoid Liposarcoma to Adipocytic Differentiation Block, plus a sequelae edge from Soft Tissue Sarcoma Mass to Abdominal Distension. Updated PMID:39456230 snippet grading across has_subtypes, pathophysiology, and genetic to HUMAN_CLINICAL with REVIEW_SYNTHESIS. Added therapeutic_modality SMALL_MOLECULE on five systemic treatments and a target_mechanisms link on Surgical Resection targeting Soft Tissue Sarcoma Mass.

  summary: 'Create: Platelet-type Bleeding Disorder 19 (PRKACG), curated with its
    ClinGen DISPUTED validity in front'
  details: |
    Claim #10791 (platelet-type bleeding disorder 19, MONDO:0014518, PRKACG). Recorded entry_type DISEASE and created kb/disorders/Platelet-type_Bleeding_Disorder_19.yaml.

    Why DISEASE. dismech already curates the neighbouring BDPLT series as standalone entries (BDPLT8, 18, 20, 21) alongside TUBB1-related macrothrombocytopenia and CYCS-related thrombocytopenia, and BDPLT19 has the same shape: its own OMIM/MONDO identity and a mechanism chain that is not a specialisation of any curated umbrella. There is no candidate parent disease to attach it to as a subtype.

    The finding that shaped the entry. ClinGen's Hemostasis/Thrombosis GCEP classified PRKACG - BDPLT19 as DISPUTED (SOP10, 2024-05-03), which was not visible from the stub or the issue. The record is not committed in references_cache; I built it with just clingen-rebuild --id CGGV:assertion_5d74cf9f-.... Reading ClinGen's narrative, the dispute is about the genetic evidence, not the experimental evidence: two siblings in one consanguineous pedigree, and an unevaluated GNE missense variant in the proband, discounted because GNE was not a thrombocytopenia gene in 2014. It is one now. The entry says all of this in the description, types the gene record relationship_type: DISPUTED, and carries a KNOWLEDGE_GAP discussion recording what would resolve it (a second family, or a re-analysis of the first).

    Deliberately not asserted. The GNE allele's identity and zygosity - ClinGen says only 'a missense variant', the Manchev abstract does not mention GNE, and the primary full text is not retrievable into the cache. No phenotype frequencies, no penetrance, no prevalence number, no treatments, no animal model.

    Grouping. Not added as a member of Inherited_Platelet_Function_Disorders and no conforms_to declared. The grouping's criterion is module conformance and it admits a thrombocytopenia only with a curated qualitative defect; the abstract states the defect but not at arm level (granule secretion / integrin inside-out / agonist-specific aggregation), so conformance cannot be snippet-verified. Same treatment as the already-curated BDPLT20. The included deep-research report indicates the primary full text does contain arm-level data (absent P-selectin externalization, no alphaIIbbeta3 rise, reduced GPIb internalization); that is recorded in notes as a revisit trigger rather than curated.

    Deep research: research/Platelet-type_Bleeding_Disorder_19-deep-research-falcon.md, falcon. just preflight-dr returns WARN, not FAIL - PRKACG 50 mentions against FLNA 17. FLNA is the PKA substrate at the centre of the mechanism, not a rival disease entity, and the report's OMIM matches MONDO's. No DR text was used as a snippet; every evidence item quotes a cached abstract or the ClinGen record.

    Tooling defect found: just refresh-orphadata aborts on a drifted checksum pin (upstream en_product1.xml is now sha256 df8d562... against the pinned fb2fbe8...), leaving a usable but newer file. A cache file built from it would carry a Source line naming the pinned 2025-12-09 release it was not built from, so ORPHA:438207 was not cited and the generated file was discarded rather than committed.

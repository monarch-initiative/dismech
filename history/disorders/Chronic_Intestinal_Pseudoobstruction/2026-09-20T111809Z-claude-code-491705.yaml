    Review round 1 on PR #12328 (issue #12193). No reviewer finding touched this entry; this is a self-review correction found while waiting for the verdict.

    The ACTG2 record's notes and the Myopathic subtype description both said ACTG2 is 'the gene most commonly identified' / 'the gene most often found' in visceral myopathy presenting as CIPO. The cited snippet says ACTG2 'is one of the most common disease-causing genes'. Promoting 'one of the most common' to 'the most common' is a superlative the source does not support, so both were corrected to 'one of the most commonly identified genes', and the record now states what the source says so the wording is checkable without opening the cache.


  summary: Route the ERBB3 familial visceral neuropathy row to a sibling entry
  details: |
    Ruling for the series-069 row MONDO:8000011 visceral neuropathy, familial, 1,
    autosomal recessive (ERBB3).

    Row ruling: declined structurally, routed to a sibling entry. This entry is a
    root-level record whose subtype rows are the mechanistic categories (neuropathic,
    myopathic, mitochondrial, idiopathic), and its notes already record that
    gene-specific detail goes to dedicated entries - FLNA_Intestinal_Pseudoobstruction
    and Mitochondrial_Neurogastrointestinal_Encephalomyopathy. The numbered familial
    visceral neuropathies follow the same routing, and one of them already exists as its
    own entry: Familial_Visceral_Neuropathy_2, bound to MONDO:0030399. So the autosomal
    recessive type 1 form belongs in a sibling of that entry rather than as a row here.
    MONDO:8000011 reaches this entry only because MONDO lists chronic intestinal
    pseudoobstruction among its parents, alongside familial visceral neuropathy and
    neuronal intestinal dysplasia. The ruling is recorded in notes.

    The declined row is therefore uncurated work rather than a gap in this entry: no
    ERBB3 record belongs here, and creating the type 1 entry is a separate curation job.

    Anchor audit: disease_term MONDO:0017574 is an exact match for the entry. Of its four
    subtype rows, two bind a CURIE and two do not, and no bound row sits outside the
    class. No change.

    Wiring is unchanged and was already complete: 3/3 causal genes wired, 6/6 phenotypes

    # Evidence review — kb/disorders/Chronic_Intestinal_Pseudoobstruction.yaml

    ## Stats
    - Evidence items checked: 12 (every `reference:` block: 1 in has_subtypes,
      3 in pathophysiology, 2 in phenotypes, 4 in genetic, 2 in treatments).
    - References read: 9 distinct cached records — PMID_28261062, PMID_17357080,
      PMID_24777424, PMID_27683196, PMID_33880338, PMID_20871226, PMID_15571233,
      PMID_15880314, DOI_10.3389_fped.2022.837462. All present; every snippet is
      an exact substring of its cache body (the DOI item is skipped by the
      automated snippet checker's `skip_prefixes`, so it was verified by hand
      against the cached Frontiers abstract, where it matches verbatim).
    - Verified clean: 11 of 12.

    ## Findings

    1. **has_subtypes#Mitochondrial (line 60), PMID:28261062** — the quote is
       "a progressive metabolic disorder caused by thymidine phosphorylase (TP)
       enzyme deficiency"; the `explanation` adds "…with fatal gastrointestinal
       complications". That phrase is in the cached abstract ("clinical features
       include mental regression, ophthalmoplegia, and fatal gastrointestinal
       complications") but is not in the quoted span, so the explanation asserts
       slightly more than its own snippet. Severity: MINOR (accurate to the
       paper, wider than the quote).
       ACTION: reported only — trimming would be cosmetic and the underlying
       claim is correct in the cited source.

    2. **pathophysiology#Intestinal Dysmotility (line 155),
       DOI:10.3389/fped.2022.837462** — the quote ("Chronic intestinal
       pseudo-obstruction is a rare disorder and represents the most severe form
       of gastrointestinal dysmotility with significant morbidity and
       mortality") supports the *severity and identity* of CIPO, which is what
       the explanation claims, but not the node's specific mechanistic content
       (upstream neuropathic and myopathic lesions converging on failed
       propulsive motility). The node's mechanistic claim is instead carried by
       its two upstream nodes' evidence. Severity: NOTE.
       ACTION: reported only. Also note this is the file's only `DOI:` reference
       and therefore the only one not covered by automated snippet validation.

    3. **Uncited phenotypes and treatments** — `phenotypes#Vomiting`,
       `#Constipation`, `#Failure to Thrive`, and the treatments `Enteral
       Nutritional Support` and `Genetic Counseling` carry no `evidence:` block
       at all. Severity: NOTE (coverage gap, not an evidence defect; the entry's
       `notes` field already documents a deliberate decision to omit phenotype
       `frequency:` values for want of subtype-pooled data, but says nothing
       about these absent evidence blocks).
       ACTION: reported only.

    4. **genetic#FLNA (line 309), PMID:20871226** — the quoted sentence is the
       paper's opening identification sentence ("X-linked intestinal
       pseudo-obstruction, a rare disorder caused by mutations in FLNA, the gene
       encoding the cytoskeletal protein filamin A"), which supports FLNA
       causation cleanly. The explanation goes on to say the histopathology
       "refin[es] the neuropathic-versus-myopathic basis" — the paper's actual
       conclusion is stronger and in a specific direction ("suggest an
       underlying myopathic basis for dysmotility in affected patients"), which
       is not quoted. The explanation is therefore under- rather than
       over-claiming, and does not conflict with the entry's placement of FLNA
       under the neuropathic subtype. Severity: NOTE.
       ACTION: reported only — worth knowing that the strongest statement in
       this cached paper cuts toward a myopathic mechanism for X-linked CIPO.

    ## Sections reviewed
    has_subtypes, pathophysiology, phenotypes, genetic, treatments, notes,
    disease_term

    ## Verdict
    This is a clean, well-disciplined entry: every snippet is verbatim, every
    citation is the right paper for the claim it hangs on, `evidence_source` is
    HUMAN_CLINICAL throughout and correct in each case (patient cohorts, case
    reports, exome-sequencing case series, and clinical reviews — no animal or
    cell-culture sentence is quoted anywhere), and the subtype→gene→mechanism
    mapping (FLNA→neuropathic, ACTG2→myopathic, TYMP→mitochondrial) is
    supported by the correct primary source in each instance. No edits were
    required. The only substantive weaknesses are coverage rather than
    correctness: five phenotype/treatment items carry no evidence, and the
    shared endpoint node is supported by a disease-severity statement rather
    than a mechanistic one.

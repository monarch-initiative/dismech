  summary: 'Genetics pass: bind ACTG2, wire FLNA/ACTG2/TYMP into the pathograph, add
    the MNGIE mechanism node'
  details: |
    Genetics pass for issue #12193 (d2g wiring-004). MONDO records TYMP for MONDO:0011283, the term this entry's Mitochondrial subtype carries; TYMP was already curated, so the checklist item was an export-layer gap rather than a curation gap.

    What changed. FLNA and TYMP gained relationship_type CAUSATIVE, variant_origin GERMLINE and a subtype foreign key (Neuropathic, Mitochondrial). A new ACTG2 record was added for the Myopathic subtype: the gene was already named in a snippet on the Smooth Muscle Contractile Failure node and in a cached case report cited for two phenotypes, but was never bound, so it was invisible to the knowledge-graph comparison. It is the first ACTG2 binding in kb/disorders. All three genes now reach the pathograph: FLNA on Enteric Neuron Developmental Failure, ACTG2 on Smooth Muscle Contractile Failure, and TYMP on a new node, Thymidine Phosphorylase Deficiency and Mitochondrial DNA Instability, which carries the nucleoside-accumulation and mtDNA-instability mechanism and reaches Smooth Muscle Contractile Failure by an INDIRECT_UNKNOWN_INTERMEDIATES edge because the founding review states the mechanism linking dNTP-pool imbalance to the mtDNA lesion is unknown. Each has_subtypes row gained its genes list.

    Stale prose corrected. Two sentences claimed a dedicated MNGIE entry was still scoped as follow-up curation. kb/disorders/Mitochondrial_Neurogastrointestinal_Encephalomyopathy.yaml has existed since 2026-06-05 and binds TYMP; both sentences now point at it. The visceral-myopathy sentence now names the nearest existing neighbour, Megacystis-Microcolon-Intestinal_Hypoperistalsis_Syndrome_2, which covers the MYH11 rather than the ACTG2 end of that continuum.

    ClinGen. TYMP gained the ClinGen definitive gene-validity assertion, which is scoped to the broad mitochondrial-disease term rather than to MNGIE. ACTG2 has no row in the committed ClinGen CSV, and the record says so with the grep that shows it.

    Validation. just validate-pre-edit, count-verified-snippets 21/21, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, list-gene-term-mismatches all clean. Gene-to-mechanism wiring for this file moved from 0/2 to 3/3.

  summary: 'Create: Hypertensive Retinopathy'
  details: |
    Created new disorder entry for Hypertensive Retinopathy (MONDO:0006797), the next uncurated item in issue #4008's retinopathy tracking list after cross-referencing showed most other listed items (GUCY2D, RPE65, BEST1, ABCA4, diabetic retinopathy subtypes, cancer/melanoma-associated retinopathy) were already covered as subtypes/cross-refs of existing entries. Deep research performed via falcon (Edison Scientific), ~31 min runtime, 39 citations. GeneReviews baseline: not applicable (not a Mendelian disorder, confirmed via PubMed search). Modeled two pathophysiology nodes (chronic arteriolar vasoconstriction/sclerosis; acute blood-retinal barrier breakdown in accelerated hypertension) with a downstream edge to increased long-term stroke risk. All 6 phenotypes map to Keith-Wagener-Barker (KWB) grades 1-4, each with an evidence item quoting the exact grade definitions from the British and Irish Hypertension Society (BIHS) position document (PMID:36418425). Prognosis evidence from the ARIC cohort study (PMID:23940194, Ong et al 2013) showing moderate hypertensive retinopathy independently predicts stroke (HR 2.37, 95% CI 1.39-4.02). Prevalence modeled via malignant-hypertension (bilateral grade 3-4) proxy figures, explicitly noted as a lower-bound proxy rather than overall HR prevalence since the latter was not verifiably quantified in cached sources. Diagnostics section covers both classic KWB fundoscopy (PMID:36196693) and OCTA quantitative vascular density assessment (PMID:39572632, PMID:35683999). Treatment section covers malignant-hypertension BP-lowering targets and first-line oral CCB/beta-blocker therapy, both quoted from PMID:36418425, with therapeutic_agent bindings to CHEBI:2668 (amlodipine) and CHEBI:2904 (atenolol). All evidence snippets required manual fixing for PDF-extraction ligature artifacts (e.g. 'ﬁ'/'ﬂ' ligatures, 'ß' character) that broke exact-substring matching on the first pass -- resolved by selecting ligature-free substrings from the same cached full-text PDFs rather than fabricating clean text. Two ontology-hallucination fixes were needed and caught by just validate-terms-file on the first draft: HP:0032182 (wrong ID for cotton-wool spots, corrected to HP:0031606) and HP:0012649 (wrong ID for macular exudate, corrected to HP:0030496), plus a wrong GO term (GO:0003081 mislabeled, replaced with GO:0042310 vasoconstriction). MONDO:0006797 was also missing from the cached DiseaseTerm dynamic enum and was added via scripts/refresh_disease_enum_cache.py. Schema, term, and reference validation all pass via just validate.

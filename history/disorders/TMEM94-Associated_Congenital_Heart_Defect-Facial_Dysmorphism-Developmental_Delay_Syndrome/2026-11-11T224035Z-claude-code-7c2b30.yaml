  summary: 'Create: TMEM94-Associated Congenital Heart Defect-Facial Dysmorphism-Developmental
    Delay Syndrome'
  details: |
    New entry for the autosomal recessive syndrome caused by biallelic TMEM94 (ERMA) loss-of-function variants (MONDO:0032672, OMIM 618316, Orphanet 562569). It is named with the Orphanet label, a MONDO exact synonym, because the OMIM title (kept as a synonym) describes a combination of features that other genetic causes also produce.

    Phenotypes come from the founding cohort abstract (PMID:30526868, which has no open full text), the prenatal report (PMID:32825426), the ClinGen Definitive curation summary, an overgrowth-intellectual disability cohort (PMID:36919607) and a developmental delay exome cohort (PMID:39853208). Only the congenital heart defect frequency (9 of 10) is recorded.

    The pathograph runs from biallelic loss of function to loss of ER Mg2+ uptake, which patient alleles fail to restore in cells (PMID:42384784), and on to perturbed cardiomyocyte Ca2+ cycling and reduced contractility in heterozygous Erma mice and ERMA-silenced iPSC cardiomyocytes (PMID:38513662). Tmem94 knockout embryos have cardiac, craniofacial and neuronal migration defects (PMID:30526868), which lead to the cardiac, facial and neurodevelopmental phenotypes. The step from low ER Mg2+ to those developmental defects is recorded as an EMERGING hypothesis (er_magnesium_deficiency), supported only by the ERMA authors' proposal and, by analogy, by TUSC3 knockout mice (PMID:41203647). Seven phenotypes have no proposed mechanism and are left unconnected: hypertrichosis, omphalocele, intestinal malrotation, large for gestational age, overgrowth, hydrops fetalis and thickened nuchal fold. A HUMAN_MODEL_MISMATCH discussion records that heterozygous mice have a cardiac phenotype while the human disease is recessive.

    The ClinGen Definitive autosomal recessive classification is copied into gene_disease_validity. A letter disputing the P-type ATPase classification (PMID:38879951) has no PubMed abstract and is mentioned in notes only.

    Deep research: falcon was rejected (HTTP 403) and the run fell back to OpenScientist (research/TMEM94-Associated_Congenital_Heart_Defect-Facial_Dysmorphism-Developmental_Delay_Syndrome-deep-research-openscientist.md). All four references it cites resolved. preflight-dr returned WARN because the report gives HGNC:25151 (ADAT3) beside TMEM94; the entry binds hgnc:28983. The report also says there is no Orphanet code, which MONDO contradicts. Its ClinVar variant table and gnomAD constraint figures were not used, because no fetched source carries them.

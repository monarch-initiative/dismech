  summary: 'Gene-family review: ALDH18A1 typed; ClinGen recorded; branch nodes grounded'
  details: |
    ALDH18A1 modelling re-reviewed: P5CS loss is the shared mechanism, dominant (SPG9A, proposed dominant-negative) and recessive (SPG9B, ARCL3A). The genetic record was untyped with no variant origin and two unbound inheritance blocks; it is now typed CAUSATIVE with germline origin, the blocks are bound to autosomal dominant (HP:0000006) and autosomal recessive (HP:0000007), and the ClinGen Aminoacidopathy GCEP Definitive (semidominant) tier it already cited for MONDO:0100126, this entry's disease_term, is recorded (CGGV:assertion_7bfbe962-beb3-4553-9909-a83a3aac2d55-2021-05-18T211134.377Z). Three genotype-specific branch nodes (p.Thr331Pro, p.Arg749Gln/p.Arg765Gln, p.Arg84Gln) carried the gene with no molecular function; each describes reduced P5CS oligomer incorporation, stability or abundance, and now binds delta1-pyrroline-5-carboxylate synthetase (NADP+) activity (GO:0017084) as decreased, like the two parent nodes.

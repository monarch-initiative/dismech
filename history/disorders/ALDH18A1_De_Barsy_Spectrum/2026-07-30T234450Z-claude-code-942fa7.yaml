  summary: Augment ARCL3A/de Barsy branch with dystonia, callosal, and skeletal features
  details: |
    Curation request was for ALDH18A1-related de Barsy syndrome (MONDO:0009053, ARCL3A, OMIM:219150). Duplicate preflight found this entity is already curated as the ARCL3A branch of this spectrum file under the umbrella term MONDO:0100126, per the anti-duplication modeling decision recorded in the file notes; the adjacent ALDH18A1_Cutis_Laxa.yaml covers the distinct autosomal-dominant ADCL3 form. Per user direction, augmented the existing ARCL3A branch rather than creating a duplicate standalone entry. A fresh falcon run was not possible because the research-disorder recipe requires a matching filename; the existing comprehensive falcon report research/ALDH18A1_De_Barsy_Spectrum-deep-research-falcon.md was used as the deep-research basis, supplemented by targeted PubMed E-utilities searches. Added four previously missing ARCL3A phenotypes: Dystonic posturing HP:0001332, Corpus callosum dysgenesis HP:0001273, Congenital hip dislocation HP:0001374, and Adducted thumb HP:0001181, each with a matching downstream causal edge on the ARCL3A neurocutaneous disease node. Dystonia and callosal findings are grounded in newly cached PMID:23963297, the Gardeitchik 2014 neurometabolic cutis laxa cohort in which dystonic posturing was discriminatory for ALDH18A1 and PYCR1 defects; skeletal features reuse the already-validated GeneReviews PMID:41570168 snippet at supports PARTIAL because it describes the grouped proline-synthesis disorders rather than ARCL3A alone. Also added newly cached PMID:21739576 Skidmore as IN_VITRO evidence of diminished collagen I and III and altered elastin in patient dermal fibroblasts on the existing Cutis laxa edge. Validated with just validate, just validate-terms, and just validate-references, all passing. Note that just validate-graphs fails repo-wide on many unrelated disorders as a pre-existing condition; this file is not among those flagged. Follow-up in the same session, addressing PR #7220 review: bound subtype_term on all three subtypes so the subtype-level disease identities are machine-resolvable rather than prose-only, ARCL3A to MONDO:0009053 ALDH18A1-related de Barsy syndrome, SPG9A to MONDO:0011006, and SPG9B to MONDO:0014702, with the corresponding term-validation cache rows; refreshed the Cutis laxa edge description and the entry notes block, both of which had gone stale relative to the new evidence and bindings. The review suggested the label de Barsy syndrome for MONDO:0009053, but the canonical label verified with OAK is ALDH18A1-related de Barsy syndrome, so the canonical form was used.

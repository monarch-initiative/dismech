  summary: 'Create: Neonatal Lupus Erythematosus'
  details: |
    New Disease entry for MONDO:0018360, curated from a claude_code deep-research report at research/Neonatal_Lupus_Erythematosus-deep-research-claude_code.md, which reported 36 references with 35 verified and confabulation_rate 0.0, but needs_review true because the one quote it checked failed to match. Modelled as its own Disease rather than a subtype of Systemic Lupus Erythematosus because the pathogenic agent is maternal IgG acting on fetal tissue, the affected infant has no autoimmunity of its own, and about half the mothers have no lupus at all; the existing SLE has_subtypes pointer is left in place and the reasoning recorded in top-level notes. Pathophysiology is a six-node chain splitting the disease into a permanent cardiac arm - antigen surface exposure on apoptotic cardiocytes, diverted efferocytosis to macrophages, TGF-beta fibrosis of the AV node, irreversible complete block - and a separate transient arm for skin, liver and blood. Two evidence items are deliberately graded PARTIAL where the abstract does not fully carry the claim: cutaneous photosensitivity inferred from the SCLE resemblance, and IVIG grouped with hydroxychloroquine in a guideline sentence despite weaker trial evidence. The deep-research report proposed UBERON:0002018 for the atrioventricular node; that CURIE is synovial membrane of synovial joint, and the correct term UBERON:0002352 was substituted after an OAK lookup. Validated with just validate, just validate-terms, just count-verified-snippets at 29 of 29, just check-entity-refs and just check-duplicate-keys.

  summary: Add PATCH trial (NCT01379573) clinical_trials entry
  details: |
    Follow-up on issue #9788. Added a clinical_trials entry for PATCH (NCT01379573), the open-label single-arm two-stage trial of hydroxychloroquine for secondary prevention of congenital heart block, with the ClinicalTrials.gov registry record and the JACC results paper (PMID:32674792) as evidence. Graded PHASE_II, not Phase III: the registry record and the paper's own publication type both say phase II, and the review comment that prompted this said Phase 3. target_phenotypes reuses HP:0001709, already bound on the Complete Congenital Heart Block phenotype in this entry. Both references were fetched with just fetch-reference; snippets verified with just validate (43/43).

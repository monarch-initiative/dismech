  summary: 'Edit: MTDPS14B - correct two GTPase-domain overstatements'
  details: |
    Second review round on PR #11095. The ai4c-reviewer approved again with no critical or important findings and three non-blocking suggestions. One was a genuine factual accuracy problem and was fixed; two were explicitly marked by the reviewer as needing no change and were left alone.

    Fixed: GTPase-domain overstatement. The defining publication PMID:26561570 says the p.Leu534Arg substitution lies 'in the close vicinity of the protein's critical GTPase domain'. Two prose passages in the entry instead said the variant was 'affecting the catalytic GTPase domain', which asserts the variant is IN the catalytic domain rather than beside it. That is a mechanistically meaningful difference and it overstated the source. The entry description now reads 'lying immediately adjacent to the catalytic GTPase domain', and the genetic section's association now reads 'lies immediately adjacent to the catalytic GTPase domain rather than within it'. Both defects were pre-existing rather than introduced by this PR, but the notes block added in the first commit of this PR made the file contradict itself, which is how the reviewer surfaced them.

    The reviewer named three lines (14, 111, 1079); only two of them were defective. Line 111, in the Destabilization of the OPA1 Dynamin-like GTPase node, already read 'immediately adjacent to the catalytic GTPase domain' and is faithful to the source, so it was left unchanged. This was verified by reading the cached source and all six GTPase-domain mentions in the file before editing, rather than taking the finding at face value. The remaining mentions are now mutually consistent: 'immediately adjacent to' in the description and the node, 'rather than within it' in the genetic section, 'near' in the in-silico evidence explanation, 'adjacent to' in the dataset-triage notes, and the verbatim source quote in the evidence snippet.

    Not changed (reviewer explicitly did not request a change). First, POPULATION_MISMATCH for the heterozygous-versus-homozygous gene-dose gap slightly stretches an enum gloss written around cohort, subtype, and indication mismatches. The reviewer said it is defensible here, that the description leaves no ambiguity, and that they would not change it; they raised it as a signal that the taxonomy may want a zygosity or dose kind now that animal models are using it, alongside the SUPRAPHYSIOLOGICAL_EXPRESSION and INCOMPLETE_PHENOTYPE extensions the schema already anticipates. That is a schema question for whoever owns the taxonomy spec, not a fix for a curation PR, so no change was made and no issue was filed unasked. Second, the two SPECIES_MISMATCH divergences and the new CAUSE_UNREPRESENTED remain uncited, on the rule stated in the previous round: a divergence carries evidence when a quoted sentence grounds a claim a reader could doubt, and species and genotype follow from the model's own declared fields. The reviewer agreed and said the same argument covers the new one.

    Validation after the changes. just validate passes (schema, terms, references; 92/92 snippets verified). check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values and check-folded-hyphens pass. No snippet text was touched, so the reference and grading surfaces are unchanged; the edits are confined to two curator-written prose passages.

    Push discipline. This is the third push and it drops a second approval, since main has dismiss_stale_reviews. The cost was accepted because the defect is a factual overstatement about where the causal variant sits in the protein, which is content rather than presentation, and leaving a known misstatement in a knowledge base to preserve a review cycle is the wrong trade. The reviewer also noted independently that this entry correctly uses p.Leu534Arg from the cached primary source rather than the p.Leu589Arg given by the falcon deep-research report, which is the same source-over-report discipline applied here.

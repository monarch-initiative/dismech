  summary: 'Create: Mitochondrial DNA Depletion Syndrome 14B (cardioencephalomyopathic
    type)'
  details: |
    New Disease entry for MONDO:0014820 (OMIM:616896), resolving issue #8753.

    GENE-IDENTITY RESOLUTION (the headline finding). The MTDPS numbered series is a
    high-NEC-risk class and the 14A/14B split compounds it, so the causal gene was
    established before any curation. OAK on the MONDO release
    (runoak -i sqlite:obo:mondo info MONDO:0014820 -O obo) shows xref OMIM:616896,
    is_a MONDO:0018158 (mitochondrial DNA depletion syndrome), and the
    design-pattern synonym "OPA1 mitochondrial DNA depletion syndrome".
    MONDO:0014820 itself records NO RO:0004003 causal-gene relationship; its sibling
    MONDO:0980967 (MTDPS 14A, encephalomyopathic, OMIM:621481) does, pointing at
    HGNC:8140 OPA1. The disease is therefore an OPA1 disorder, NOT an SLC25A4 (ANT1)
    disorder - SLC25A4 causes MTDPS12 (cardiomyopathic type), whose label is the
    most likely source of confusion. No deep-research report drove any SLC25A4
    assumption; the error existed only in an initial working branch name chosen
    before the OAK lookup, and the branch was renamed to claude/mtdps14b-opa1-8753.

    NEC PREFLIGHT. just preflight-dr on the falcon report against MONDO:0014820
    returned SKIP, because MONDO records no causal gene for this concept and the
    automated gene check cannot discriminate. The manual OMIM/synonym/gene preflight
    from CLAUDE.md section 2b was performed instead: report top genes OPA1=76 with
    no rival gene and SLC25A4 absent entirely; report OMIM set {165500, 616896}
    contains the MONDO xref 616896; MONDO synonyms checked for collision against
    MONDO:0980967. Manual preflight passed.

    DEEP RESEARCH. falcon (Edison), 790 s, report reference_validation 3/3 resolved,
    0 unresolved, 0 off topic. The report was used as corroboration and as a lead
    source only; every evidence item in the entry is drawn from primary literature
    verified against the local reference cache. One report error is recorded in the
    entry notes rather than propagated: falcon gives the causal variant as
    p.Leu589Arg, whereas the primary publication (PMID:26561570, cached full text)
    states c.1601T>G (p.Leu534Arg, NM_015560.2). The primary source was used.

    GENEREVIEWS. PubMed has no GeneReviews chapter for MTDPS14B. The nearest is
    PMID:20301426 (Optic Atrophy Type 1, RETIRED), which covers the allelic but
    distinct AUTOSOMAL DOMINANT OPA1 disorder. It is recorded in the top-level
    references block tagged GeneReviews and cited once, for the OPA1
    agents-to-avoid guidance, with supports PARTIAL and an explanation stating that
    it covers the dominant disorder. Its Clinical Characteristics were deliberately
    NOT used as a phenotype baseline for this recessive infantile entity.

    CONTENT. 6 pathophysiology nodes with biological_scale tags and evidenced causal
    edges (OPA1 GTPase destabilization -> impaired inner-membrane fusion and cristae
    disorganization / mtDNA nucleoid destabilization and muscle mtDNA depletion ->
    combined respiratory chain deficiency -> bioenergetic failure of high-demand
    tissues -> fatal infantile multisystem decompensation); 17 phenotypes with HPO
    terms; 5 biochemical markers; 2 histopathology findings; genetic (OPA1,
    hgnc:8140, CAUSATIVE, germline) with autosomal recessive inheritance; prevalence
    (CASES_IN_LITERATURE / ULTRA_RARE, numeric rate deliberately omitted); 3
    progression phases; 3 diagnosis entries; 3 differential diagnoses; 4 treatments;
    2 animal models with modeled_mechanisms (one PARTIALLY_RECAPITULATES, one
    FAILS_TO_RECAPITULATE with limitations and evidence); a HUMAN_MODEL_MISMATCH
    discussion on the Opa1 mouse bracketing problem and a KNOWLEDGE_GAP discussion
    on the 14A/14B boundary; a skos:relatedMatch mapping to MONDO:0980967 recording
    the 14A/14B split. One phenotype (Death in infancy, HP:0001522) was dropped
    because it is not reachable from HP:0000118 and fails the PhenotypeTerm dynamic
    enum; the fatal course is captured in pathophysiology and progression instead.
    No datasets block: no verified accession specific to this two-patient disorder
    was found, and a speculative one would be exactly the Named Entity Confusion
    risk the dataset SOP warns about.


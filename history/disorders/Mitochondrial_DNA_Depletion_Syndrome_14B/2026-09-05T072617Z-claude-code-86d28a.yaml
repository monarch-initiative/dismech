  summary: 'Edit: Mitochondrial DNA Depletion Syndrome 14B (evidence directness, model
    divergences, experiment design)'
  details: |
    Augmented an existing entry rather than creating a new one. The requested disorder, 'mitochondrial DNA depletion syndrome 14 (cardioencephalomyopathic type)', is MONDO:0014820, which MONDO renamed to 14B after OMIM split MTDPS14 into 14A (OMIM:621481) and 14B (OMIM:616896); the existing entry already carries the requested name as a synonym. Duplicate preflight covered origin/main kb/disorders, plus PR and issue searches across all states, and found no other coverage and no open claim.

    Deep research: falcon was requested and its EDISON_API_KEY returned HTTP 403 'Failed to authenticate'. Rather than substituting a provider by hand, the run was repeated with dr_fallback='--fallback' so the substitution is recorded in the report frontmatter; it resolved to openscientist. No content in this change is drawn from a deep-research narrative. Every claim added here is anchored to the primary literature already cached for this entry (PMID:26561570, PMID:28494813) with exact snippets verified against references_cache.

    Changes. (1) Retired-enum prose cleanup: eight evidence explanations still argued 'PARTIAL because ...' for the supports value retired in #10003. Each described support reaching the claim through an inference step, which is what the schema's directness slot exists to record, so the prose was rewritten and directness: INDIRECT added. Nine items now carry directness where the entry previously had none. (2) Animal-model links: added model_scale (TISSUE for the heterozygous cardiac model, ORGANISM for the embryonic-lethal null; both ALIGNED with their target nodes, so no upward extrapolation) and typed divergences with per-divergence materiality and cited evidence. POPULATION_MISMATCH and TEMPORAL_SCOPE on the heterozygote, CAUSE_UNREPRESENTED and TEMPORAL_SCOPE on the null, SPECIES_MISMATCH on both. These are the first animal-model divergences in the KB; the taxonomy was previously computational-model-only, and CLAUDE.md anticipates this extension. (3) Proposed experiments: both discussions carried name and description only. They now carry perturbations, controls, readouts with pathograph targets and interpretations, decision_criterion, would_support/would_refute, supporting_outcome/refuting_outcome, and design-rationale evidence. (4) Dataset triage recorded in notes: just discover-datasets returned 12 candidates, all classed GENE_ONLY. The two closest were checked against their GEO records and rejected. geo:GSE289826 studies OPA1 BSE-domain missense alleles in autosomal dominant optic atrophy, so it is the wrong disorder and the wrong domain (the MTDPS14B allele is adjacent to the catalytic GTPase domain); geo:GSE297416 (MitoPerturb-Seq) screens nuclear mtDNA maintenance genes generally and matched only on words. No datasets: block was curated, and the search is recorded so it is not repeated.

    Validation. just validate passes (schema, terms, references; 92/92 snippets verified against the cache). just check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms pass for this file. Whole-KB gates run and passing: check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-enum-values. just model-scale-audit --strict exits 0. Compliance moved from 97.6% (202/207) to 93.0% (214/230): the numerator rose by 12, and the apparent drop is the denominator growing by 23 as the new readouts, controls and divergences each expose a recommended evidence slot. Those slots are deliberately left empty on a proposed experiment, where nothing has been measured yet; filling them would mean inventing evidence for an experiment nobody has run.

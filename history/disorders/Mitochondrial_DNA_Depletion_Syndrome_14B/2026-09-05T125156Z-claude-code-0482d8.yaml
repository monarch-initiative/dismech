  summary: 'Edit: MTDPS14B - carry the source''s GTPase-domain ambiguity instead of
    resolving it'
  details: |
    Third review round on PR #11095, and a correction of this session's own previous change. The reviewer requested changes with one IMPORTANT finding, correctly identifying that the GTPase-domain edit in the preceding commit overshot and introduced a claim the source contradicts. The reviewer also explicitly corrected its own round-2 steer, which had been based on only one of the source's four domain statements.

    What went wrong. PMID:26561570 states the position of p.Leu534Arg relative to the GTPase domain FOUR times, in two directions. Two assert domain membership: the Results section, citing the mitodyn OPA1 domain database, says the variant 'affects the GTPase catalytic domain', and the Conclusion says it 'targets the key functional GTPase domain'. Two place it nearby: the structural-modelling sentences say 'in the close vicinity of the protein's critical GTPase domain' and 'affects the integrity of the protein structure in the vicinity of the catalytic GTPase domain'. The previous commit in this PR had rewritten the genetic association to say the variant 'lies immediately adjacent to the catalytic GTPase domain rather than within it'. That is an exclusive negation, and the entry's only primary source asserts the opposite twice. The earlier wording it replaced ('affecting the catalytic GTPase domain') was in fact near-verbatim from the source's Results and Conclusion.

    Root cause of the error, recorded so it is not repeated. The verification behind the previous commit used a grep with trailing context only ('GTPase domain[^.]{0,80}'), which showed what followed each mention but not what preceded it. Three of the four statements were seen; the Results domain-lookup sentence was never displayed, and the Conclusion sentence's leading verb 'targets' was cut off. The check felt thorough because six mentions in the KB file were read, but the source itself was only partially read. When checking a prose claim against a source, match on the claim's subject with context on both sides, not on the object with trailing context.

    Fix. The exclusion is removed and the entry now carries the source's ambiguity rather than resolving it in either direction. The disease description says the variant is 'at or immediately adjacent to the catalytic GTPase domain'. The genetic association says it is 'reported on domain-annotation lookup as affecting the catalytic GTPase domain and modelled as lying in its immediate vicinity', and states that the publication gives the position both ways and that the boundary call is not settled. A second evidence item was added beside the existing modelling one, quoting the Results sentence 'This previously unreported OPA1 variant affects the GTPase catalytic domain', graded COMPUTATIONAL because it is a domain-annotation database lookup; the two items now sit adjacent and their explanations say that they frame position differently and that the entry keeps both. A notes paragraph records all four source statements, explains why they are not flatly contradictory (the membership statements rest on a domain annotation while the vicinity phrasing sits inside the in-silico argument, where it plausibly means near the catalytic site rather than outside the domain boundary), names the wrong exclusion this PR briefly introduced, and instructs curators not to narrow the wording in either direction without a source that settles the boundary.

    Line 114, the Destabilization of the OPA1 Dynamin-like GTPase node, remains untouched across all three rounds. Its 'immediately adjacent to' sits in a description of the in-silico modelling result specifically, which is exactly where the source uses the vicinity phrasing, so it is faithful in its own context. The reviewer agreed it was correctly left alone.

    Not changed, and the reviewer confirmed both in this round: SPECIES_MISMATCH and CAUSE_UNREPRESENTED divergences remain uncited because species and genotype follow from the model's own declared fields, and the POPULATION_MISMATCH enum-gloss stretch remains a taxonomy-spec question rather than a curation fix.

    Validation. just validate passes; snippet count rises from 92/92 to 93/93 with the added domain-lookup quote verified against the cache. check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading all pass, the last confirming the new COMPUTATIONAL grading introduces no divergence. just model-scale-audit --strict exits 0.

    Push discipline. This is the fourth push. It was held until the in-flight review submitted rather than sent as soon as the problem was confirmed, because a push mid-review lands the running review on a tree that no longer exists and forces an extra round regardless.

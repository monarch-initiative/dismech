  summary: 'Edit: MTDPS14B review round - readout targets and allele-identity divergence'
  details: |
    Review round on PR #11095. The ai4c-reviewer approved the PR and left three non-blocking suggestions; two were taken and one was declined, all in a single push.

    Taken (suggestion 1). Two readouts on the proposed Opa1 p.Leu534Arg knock-in experiment were retargeted from pathophysiology#Bioenergetic Failure of High-Demand Tissues to the phenotype each one actually measures: cardiac mass and myocardial ultrastructure now targets phenotypes#Hypertrophic Cardiomyopathy, and retinal ganglion cell counts now targets phenotypes#Optic Atrophy. The reviewer was right on both counts. Heart weight measures the hypertrophy itself rather than the energy deficit inferred to drive it, and retinal ganglion cell loss is the cellular substrate of the optic atrophy, so both readouts adjudicate the phenotype directly. It also removes the oddity the reviewer noticed of direction: INCREASED sitting against a node named for a failure. Both interpretation strings were rewritten to say why the target is the phenotype rather than the upstream node.

    Taken (suggestion 2). A CAUSE_UNREPRESENTED divergence was added to the heterozygous Opa1 mouse link, which previously typed only the dose mismatch as POPULATION_MISMATCH. The reviewer correctly observed that this mouse is a null rather than the destabilising missense allele, which is a second and distinct gap from gene dose: a heterozygous knock-in of the missense allele would still leave the dose question open, and a homozygous null would still leave the allele question open. The limitations prose already said this ('no mouse carrying the human p.Leu534Arg allele has been reported'); typing it makes the claim queryable and makes the two animal-model links symmetric, since the homozygous-null link already carried CAUSE_UNREPRESENTED. Marked QUALIFYING rather than INVALIDATING because the link's own claim, that Opa1 deficiency is sufficient to reach the heart, survives the allele mismatch; the dose mismatch remains INVALIDATING because the cardiac phenotype cannot be transferred across it.

    Declined (suggestion 3). The two SPECIES_MISMATCH divergences were left without evidence. The reviewer noted the asymmetry and said explicitly that nothing is wrong with it. The rule applied here is that a divergence carries evidence when a specific quoted sentence grounds a specific factual claim, which is true of the four that cite the in-utero lethality and the 5-month cardiomyopathy. That a mouse is not a human follows from the model's own species: Mouse field and needs no citation, and attaching a quote to it would be padding of exactly the kind the evidence SOP warns against. The newly added CAUSE_UNREPRESENTED is uncited for the same reason: it follows from the declared genotype.

    Validation after the changes. just validate passes (schema, terms, references; 92/92 snippets verified). check-entity-refs, check-causal-targets, check-duplicate-keys and check-enum-values pass for this file, with the two retargeted readouts resolving against the phenotypes section. just model-scale-audit --strict exits 0. No new references were added and no snippet text changed, so the reference and grading surfaces are untouched by this round.

    Note on push discipline. main has dismiss_stale_reviews enabled, so this push drops the approval the reviewer just gave and costs a re-review cycle. That cost was accepted deliberately rather than deferring the two content improvements to a later PR, and everything from the round including this record was bundled into the one push.

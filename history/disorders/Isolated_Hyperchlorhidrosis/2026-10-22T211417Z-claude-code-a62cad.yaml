  summary: 'Create: Isolated Hyperchlorhidrosis'
  details: |
    Created the Isolated Hyperchlorhidrosis entry (MONDO:0007747; CA12, hgnc:1371; OMIM 143860) from the Falcon deep-research report research/Isolated_Hyperchlorhidrosis-deep-research-falcon.md, used as a lead list and checked against the cached abstracts and full texts of the cited references. The entry models the chain from biallelic CA12 loss-of-function variants through reduced carbonic anhydrase XII catalysis in the eccrine sweat duct, loss of AE2-dependent ductal chloride reabsorption, elevated sweat chloride and sodium, and systemic salt and water depletion to the infantile hyponatremic dehydration, failure to thrive, hyperkalemia and exertional rhabdomyolysis phenotypes, with a parallel salivary-duct arm explaining xerostomia. Five reported CA12 alleles are recorded as variants. The adenoviral CA12(E143K) salivary-gland mouse preparation (PMID:26486891) is recorded as an animal model with typed divergences. Airway involvement is left as an open KNOWLEDGE_GAP rather than a node because only one compound heterozygous adult had lung disease and the Bedouin natural-history series found no respiratory abnormality. Dietary salt supplementation is bound to NCIT:C15433 with sodium chloride as the therapeutic agent because NCIT has no electrolyte-supplementation clinical-action term. No GeneReviews chapter, Orphanet leaf record in the committed cache, or ClinGen gene-disease validity assertion exists for CA12 and this disorder. Validated with just validate-disorders (53/53 snippets verified, 54 titles checked, 0 issues), just validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-coarse-phenotypes, check-enum-values, check-block-scalar-comments, check-genereviews and validate-stubs. The curation was completed across three agent sessions; the final session regraded one enzyme-kinetics evidence item from HUMAN_CLINICAL to IN_VITRO and changed the hyperkalemia edge to INDIRECT_UNKNOWN_INTERMEDIATES.

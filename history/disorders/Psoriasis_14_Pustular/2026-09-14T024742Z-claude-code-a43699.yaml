  summary: 'Classify: IUIS 2022 Table 7 (autoinflammatory disorders)'
  details: |
    Backfilled classifications.iuis_category: 'autoinflammatory syndrome' from the IUIS 2022 phenotypic classification of inborn errors of immunity (Tangye et al., PMID:35748970), Table 7 'Autoinflammatory disorders'. Entry identity was verified against the table row before classifying, by matching the entry's disease_term and curated causal gene to the row's gene and OMIM columns; only then was the category assigned. The notes name the table section (1 type I interferonopathies, 2 defects affecting the inflammasome, or 3 non-inflammasome related conditions) and the row, and each assignment carries an evidence item quoting the row itself rather than the paper's abstract. Every quoted snippet was checked against references_cache/PMID_35748970.md under the reference validator's own normalizer before being written, because the cached PDF extraction is corrupted in places (the AGS1 row fuses the inheritance value into the gene symbol as 'ARTREX1'; the PSMB8 row runs its last cell into the next disease name as 'feversCANDLE'; the table footer contains a non-breaking space). Quotes were chosen to avoid those damaged spans. Validation: linkml-validate, just validate-terms, just count-verified-snippets and the batched just validate-disorders all pass; 808/808 snippets verified across the touched files.

    Section 3 (non-inflammasome related conditions), the DITRA row (IL36RN, OMIM 614204). Two evidence items were added: the disease/gene/OMIM cell and the functional-defect plus associated-features cells, the second confirming the row is about pustular psoriasis rather than another IL36RN-linked condition. The entry had no classifications block, so one was created with harrisons_chapter.

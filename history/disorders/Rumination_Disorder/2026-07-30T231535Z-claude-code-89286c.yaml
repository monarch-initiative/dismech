  summary: Replace MAXO behavioral-intervention term with NCIT:C15184
  details: |
    Follow-on to PR #7117. The Diaphragmatic Breathing treatment_term moved from MAXO:0000010 cognitive and behavioral intervention to NCIT:C15184 Behavioral Intervention.

    MAXO:0000010 conflates three distinct NCIT concepts as xrefs - C116519 Cognitive Intervention, C15184 Behavioral Intervention, and C64345 Cognitive Behavior Therapy. Diaphragmatic breathing in rumination syndrome is taught as habit reversal, substituting a competing voluntary motor pattern; it is a behavioral, not a cognitive, therapy, so the un-conflated NCIT:C15184 is the more accurate binding.

    Two alternatives were considered and rejected: NCIT:C184740 Self-guided Deep Breathing, because the technique is therapist-taught rather than self-guided, and NCIT:C219837 Breathing Treatment, which NCIT defines as nebulizer or inhaler respiratory therapy. preferred_term left unchanged. The entry's other treatments already used NCIT (C15186 Biofeedback, C15986 Pharmacotherapy with baclofen), so the entry is now fully NCIT-bound.

    Validation: just validate passes for the entry - schema validation, term validation with --labels, and reference validation.

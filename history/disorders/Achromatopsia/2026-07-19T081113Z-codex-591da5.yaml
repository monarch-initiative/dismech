  summary: 'Review: Achromatopsia'
  details: |
    Re-reviewed the disease against GeneReviews, primary human and model studies, and current ClinicalTrials.gov records. Corrected prevalence scope, stationary-versus-structural natural history, cpfl5 gene assignment, ATF6 and cone-phototransduction modeling, phenotype severity, genetic case fractions, and early-phase gene-therapy interpretation. Added structured subtype evidence, OCT and ERG findings, evidence-bearing causal and treatment-mechanism edges, two missing gene-therapy trials, current CNGB3 human safety and efficacy limitations, and complete reference-catalog closure. Separated PDE6C catalytic deficiency from the opposite-direction PDE6H inhibitory-subunit defect using primary human evidence. Schema, ontology terms, folded-hyphen guard, causal graph, pathograph, CX2, KGX, and 123 targeted tests passed. A normalized audit found 105 evidence items across 23 sources with no missing caches, snippet misses, title mismatches, or uncataloged citations.

  summary: 'Create: Hypogonadotropic Hypogonadism 18 With or Without Anosmia (IL17RD)'
  details: |
    De-novo curation of HH18 (MONDO:0014103), IL17RD. The entry is organised around the fact that IL17RD is not a straightforward Mendelian locus: variants are heterozygous, inherited from unaffected parents in every informative proband of the largest series, and accompanied by variants in other CHH genes in most patients. The gene is therefore typed relationship_type: SUSCEPTIBILITY rather than CAUSATIVE, the oligogenic requirement is modelled as its own pathophysiology node rather than as a caveat, and the primary Inheritance block is bound to HP:0010983 Oligogenic inheritance. Five-node pathograph: IL17RD variant altering Sef function, plus an oligogenic-requirement node, converging on dysregulated FGF8-FGFR1 signalling, then failure of GnRH neuron migration and olfactory bulb development, then GnRH-driven gonadotropin deficiency; seven wired phenotypes. Six PMIDs cited, 40/40 snippets verified against the local cache, no DOI-only citations. Frequency bands come from a 22-patient literature review and carry their numerators in notes; four phenotypes are deliberately left unbanded because the sources give no per-feature denominator. The entry declines to assert a direction of change in FGF signalling, a prevalence figure, a genotype-phenotype correlation, or any IL17RD-specific treatment outcome, and records each of those refusals with the source that declines to assert it. Three discussions: the unresolved direction of the signalling change given that Sef is an antagonist while FGFR1 CHH is loss of function, the unexplained hearing-loss association, and whether any IL17RD variant is sufficient alone. Lump/split reasoning against folding this into Kallmann_Syndrome is recorded in notes, following the FGFR1_Hypogonadotropic_Hypogonadism precedent.

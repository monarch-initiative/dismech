  summary: 'Review round 2: GeneReviews tag, bone health, hearing-gap correction'
  details: |
    Addressed both IMPORTANT findings from the ai4c-reviewer round. (1) Tagged PMID:20301509 with tags: [GeneReviews] in the top-level references block. Checked first that the chapter is genuinely mineable rather than tagging an unmined reference: the cache is content_type abstract_only but the GeneReviews structured chapter summary is present in full (CLINICAL CHARACTERISTICS, DIAGNOSIS/TESTING, MANAGEMENT, GENETIC COUNSELING), and the entry already carries 18 evidence items quoting it. (2) Bone health added in three places, all citable from references already in the PR: an Osteoporosis phenotype bound to HP:0000939, cited to the PMID:38628584 13-of-18 manifestation list, with no frequency band because that source gives no per-feature numerator; a Calcium and Vitamin D Repletion for Decreased Bone Mass treatment using the house convention NCIT:C15433 Nutritional Support plus CHEBI:29108 and CHEBI:27300 therapeutic agents, therapeutic_modality SMALL_MOLECULE per the CLAUDE.md caution against mechanically tagging NCIT:C15433 as BEHAVIORAL, targeting the Osteoporosis phenotype with treatment_effect INHIBITS; and a Bone mineral density surveillance diagnosis entry bound to NCIT:C61545 Bone Mineral Density Test, quoting the GeneReviews surveillance sentence. The phenotype is wired as a sequela of Hypogonadotropic Hypogonadism, typed INDIRECT_UNKNOWN_INTERMEDIATES with the GeneReviews prevention-of-secondary-complications sentence as edge evidence, because no cited source demonstrates the bone-loss mechanism in IL17RD carriers. Also fixed suggestion 3, which was a genuine wrong-absence assertion: the hh18_hearing_loss_mechanism gap claimed no IL17RD animal model with an auditory phenotype was found, while the PR's own Falcon report reports abnormal auditory-brainstem responses in Sef/Il17rd-null mice. Fetched DOI:10.1186/s12964-020-00695-7 (Pande, Yang, Friesel 2021), confirmed the paper states adult Sef-null mice have defective brainstem responsiveness to auditory stimuli with Sef expressed in cochlear-nucleus astrocytes, and rewrote the rationale so it narrows the gap to the central-versus-cochlear question rather than asserting an absence, with two MODEL_ORGANISM evidence items. Added the DOI to the top-level references block. NCIT:C61545 was verified reachable from NCIT:C25218 by OAK before binding; validate-terms added the two cache rows. Validation: just validate, validate-terms, validate-disorders all pass; count-verified-snippets 58/60 with 2 skipped by prefix and 60/60 with --unskip-prefix DOI; check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms clean; whole-KB check-title-snippets, check-snippet-length, check-snippet-grading report no new findings. Empty orphan list, all 8 phenotypes wired.

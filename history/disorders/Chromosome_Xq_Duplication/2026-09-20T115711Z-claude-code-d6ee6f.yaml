  summary: 'Genetics pass: add a PLP1 dosage node, bind SOX3 and PLP1 to their intervals'
  details: |
    Genetics pass for #12192. Three of five mechanism-relevant genes were already wired. Added a 'Increased PLP1 Dosage and Central Dysmyelination' node fed from the functional-disomy node, which gives the proximal Xq21-q24 subtype the mechanism its own reported phenotype (aberrant brain myelination) implies, and fetched the PLP1-Related Disorders GeneReviews chapter (PMID:20301361) for the clinical course; tagged it in `references:`. Bound SOX3 on the Xq25-q26 row, which carries MONDO:0010252, using the array-CGH study that found SOX3 inside every X-linked hypopituitarism duplication (PMID:15342697). Left three things deliberately unbound with recorded reasons: L1CAM, because the cited evidence establishes co-duplication and not a dosage mechanism (unlike IRAK1, where a mechanism has been proposed in print and directly tested); and the Xq26-qter row, which is a cytogenetic interval containing loci the neighbouring rows already bind. Also recorded that the Xq25-q26 row bundles two presentations and that its MONDO term overlaps the neighbouring SOX3 row's - see the PR for the upstream question that raises. MONDO reconciliation: MONDO:0010252 / SOX3 is now bound at the corresponding subtype row.

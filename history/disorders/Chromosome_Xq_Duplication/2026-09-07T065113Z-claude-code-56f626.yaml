  details: |
    Full phenotype review (32 phenotypes) against cached sources: snippet-claim consistency, HPO term optimality, and pathograph explanation. All 96 snippets verified in whole-abstract/full-text context; no wrong-disease or negated-context quotes found. Fixed three stale 'Marked PARTIAL' explanations left from the supports-enum change (PARTIAL removed in #7439) and the Progressive Spasticity frequency arithmetic (17/21 is 81%, not FREQUENT on its face; explanation now states the pooled 20/25 rationale). Rebound three terms: Growth Retardation from HP:0004322 Short stature to HP:0001510 Growth delay (claim is pre+postnatal growth retardation); Musculoskeletal Complications from HP:0002757 Recurrent fractures to HP:0033127 (52.6% frequency covers fractures/osteopenia/scoliosis/contractures, not fractures alone); Refractive Error and Strabismus from HP:0000539 to HP:0012373 Abnormal eye physiology (60.6% covers refraction errors plus strabismus; both are HP:0012373 descendants). Kept HP:0012332 for Dysautonomia and HP:0002540 for walking (HP:0002459 and HP:0002355 are obsolete). Added frequency bands with new PMID:39696717 evidence for Constipation (VERY_FREQUENT, 90.6% pooled) and Gastroesophageal Reflux (FREQUENT, 79.7% pooled). Wired 23 previously unexplained phenotypes: 12 edges from Impaired Neuronal Maturation (developmental/motor/neurobehavioural/autonomic cluster plus secondary musculoskeletal and GI, with edge evidence where the link is a claim), 9 from Functional Xq Disomy with INDIRECT_UNKNOWN_INTERMEDIATES for unmapped-locus features (growth, microcephaly, craniofacial, genital, digital, gonadal dysgenesis, hemihyperplasia), SOX3 to Anterior Pituitary Hypoplasia, STAG2 to Abnormal Behaviour and Intellectual Disability. Added PMID:36319802 REFUTE evidence to the Increased IRAK1 Dosage node (patient cells show no increased canonical NF-kB signalling) and updated the IRAK1-vs-aspiration knowledge gap accordingly. Left Insomnia, Obstructive Sleep Apnea (new KNOWLEDGE_GAP discussion), Refractive Error and Strabismus, and Mottled Skin unexplained: no mechanistic account exists in verifiable sources. Validation: just validate, count-verified-snippets (96/96), validate-terms, check-duplicate-keys, check-entity-refs, validate-disorders, snippet-length/folded-hyphen/title-snippet ratchets all passed.

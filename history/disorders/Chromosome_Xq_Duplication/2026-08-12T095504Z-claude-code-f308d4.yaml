  summary: 'Create: Chromosome Xq Duplication (MONDO:0017010)'
  details: |
    Created the MONDO:0017010 root entry for partial duplication of the long arm of chromosome X as a CURATE_ROOT_WITH_SUBTYPES target (issue #8361). Modelled gene dosage (not loss of function) as the pathophysiological core: segmental Xq copy-number gain -> failure of X-chromosome dosage compensation -> functional Xq disomy / increased gene dosage -> interval-specific dosage-sensitive gene nodes (MECP2, SOX3, STAG2, IRAK1). Six dosage-defined has_subtypes: Xq28 (MECP2), Xq26-qter, Xq26.3-q27.1 (SOX3), Xq25 (STAG2), Xq25-q26, Xq21-q24. Per CLAUDE.md guidance, MECP2 overexpression uses the quantitative modifier INCREASED rather than GAIN_OF_FUNCTION because the duplicated allele is structurally wild type. Three KNOWLEDGE_GAP discussions recorded (IRAK1 dosage vs aspiration as the cause of recurrent infection; determinants of manifesting female carriers; unmeasured STAG2 cohesin transcriptional mechanism). Deep research: Edison (falcon), 505s, 25 citations. NEC preflight returned SKIP (MONDO:0017010 is a disease_grouping with no RO:0004003 causal gene), so the manual gene/OMIM/synonym checks from CLAUDE.md section 2b were run instead and passed: the report gene profile (MECP2, STAG2, IRAK1, XIAP, THOC2) is entirely Xq, report synonyms match the MONDO EXACT synonyms, and no OMIM contradiction is possible since MONDO:0017010 carries no OMIM xref. IMPORTANT: one Edison citation key (kumar2015increasedstag2dosagedefinesa) could not be resolved to any real paper in PubMed or Europe PMC; all statistics attributed to it (a 28-male STAG2 cohort with facial, seizure and stature percentages) were discarded, and the Xq25/STAG2 subtype was rebuilt on the verified Leroy 2016 paper (PMID:25677961) instead. GeneReviews baseline PMID:20301461 was fetched and tagged; its Clinical Characteristics were cross-referenced and the two features initially missing (autistic behaviour, mottled skin) were added. Validation: just validate passed (schema plus terms); just count-verified-snippets reported 68/68 verified against cached references; weighted compliance 91.0 percent.

  details: |
    Responded to the ai4c-reviewer CHANGES_REQUESTED review on PR #8366. CRITICAL: the Build and test job failed at 'Check for new short evidence snippets' because the Microcephaly evidence used a bare 4-word table-row fragment ('Microcephaly 4/5 19/19 5/39') carrying no propositional content; replaced with the Sanlaville prose sentence plus a second Pehlivan sentence showing microcephaly tracks rearrangement class, and confirmed scripts/check_snippet_length.py --against-ref origin/main now passes locally. IMPORTANT items: (a) added subtype_term MONDO bindings to four of six subtypes - Xq28 (MECP2) to MONDO:0010283, Xq26.3-q27.1 (SOX3) to MONDO:0010712, Xq25 (STAG2) to MONDO:0010507, Xq25-q26 to MONDO:0010252 - each checked with OAK, and the two SOX3-related terms confirmed to carry RO:0004003 to HGNC:11199 SOX3; the remaining two intervals have no adequately specific MONDO term and were left unbound. (b) Mined the two previously unused GeneReviews sections: Diagnosis/Testing evidence on the diagnostic definition, Genetic Counseling evidence on the counselling treatment, and the 100 percent male penetrance statement on the MECP2 genetic entry. (c) Added seven phenotypes the reviewer flagged as above the coverage threshold - dysautonomia 86.7 percent, high pain tolerance 77.9 percent, bruxism 72.3 percent, refractive error/strabismus 60.6 percent, obstructive sleep apnea 55.2 percent, musculoskeletal complications 52.6 percent, insomnia 52.5 percent - each quoted from a verified prose sentence in the cached PMID:39696717 full text rather than from its mangled tables, with frequency bands derived from the stated percentages. Suggestions taken: switched the antibiotic treatment from generic NCIT:C15986 Pharmacotherapy to NCIT:C15620 Antibiotic Therapy; added a structured prevalence record recording that prevalence is genuinely undocumented (NOT_YET_DOCUMENTED/UNKNOWN) rather than inventing a figure; added a clinical_trials section for NCT06430385 (ION440 ASO), NCT06615206 (HG204 CRISPR RNA-editing) and NCT06014541 (terminated natural-history study), all three independently verified against the ClinicalTrials.gov API before use. Also expanded notes: to signal two deliberate scoping decisions the reviewer asked to have made explicit - that quantitative frequencies derive from the MECP2/Xq28 literature and should not be read as uniform across intervals, and that the CGDS ClinGen dosage record remains uncurated because clingen-dosage-refresh fails a stale checksum. Validation after changes: just validate-disorders passed (schema, terms, references); 86/86 snippets verified against cached references; check_snippet_length passed; weighted compliance 91.5 percent.

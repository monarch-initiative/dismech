  summary: 'Create: TUBB8-related Oocyte Maturation Defect'
  details: |
    Created 2026-08-20 while closing out tubulin-family disease coverage. docs/reports/tubulinopathies-grouping-review-2026-08-20.md enumerated the tubulin gene-disease landscape and found eight tubulin-family diseases with no DisMech entry; this is one of them. All evidence snippets are quoted from cached abstracts and verified with just count-verified-snippets; just validate and just validate-terms pass.

    The tubulinopathy of a single cell type. TUBB8 is primate-specific and expressed almost exclusively in the oocyte and early embryo, where it accounts for nearly all beta-tubulin - so there is no isotype redundancy and no somatic phenotype.

    functional_impact_category is DOMINANT_NEGATIVE, stated directly by the founding NEJM study rather than inferred.

    Curated with two mechanistic routes at the spindle node, following the 2025 mechanism paper: dimer-pool reduction (the main etiology) and impaired nucleation via EB1 and CKAP5/TACC3 (which explains variants the pool model did not). Includes the preclinical HDAC6-inhibition rescue with a target_mechanisms link, scoped as the authors scope it - a certain group of TUBB8-mutated patients - plus a discussion asking which variants that group contains, since stabilising existing microtubules should not rescue a variant whose problem is too little folded tubulin.

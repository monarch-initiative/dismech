  summary: 'Create: Autosomal Dominant Hypocalcemia 2'
  details: |
    New entry for GNA11 gain-of-function autosomal dominant hypocalcemia type 2 (MONDO:0014146), curated beside the existing ADH1 entry. Deep research ran with the claude_code provider (research/Autosomal_Dominant_Hypocalcemia_2-deep-research-claude_code.md); it returned no PMIDs beyond Nesbit 2013 and marked most claims as recall, so the sources were found by PubMed search on GNA11 and hypocalcemia: the two 2013 NEJM discovery papers (PMID:23802516, PMID:23802536), the R60L and Val340Met families (PMID:24823460, PMID:26818911, PMID:27334330), both mouse models (PMID:28194447, PMID:28194446), the in vitro calcilytic study (PMID:26994139), a 2016 review (PMID:27803672), a 1200-proband variant survey (PMID:36970776) and recent case reports. The pathophysiology is an atomic chain from the GNA11 variant through increased CaSR-Galpha11 calcium sensitivity and suppressed PTH secretion to low circulating calcium and its symptoms, plus a hypothesis edge to short stature. No renal node was curated: the R60L family lacked hypercalciuria and had normal magnesium, so the ADH1 renal mechanism cannot be assumed; this is a knowledge-gap discussion. Calcilytics are recorded only as model rescues because no ADH2 patient data exist. Validated with just validate-disorders (0 issues) and the offline whole-repo gates.

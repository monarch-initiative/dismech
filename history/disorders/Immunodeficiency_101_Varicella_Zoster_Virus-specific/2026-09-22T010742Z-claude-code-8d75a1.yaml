  summary: 'Review: connect five orphan VZV phenotypes (IUIS Table 6)'
  details: |
    Five of eleven phenotypes had no incoming edge. Four neurological findings - hemiparesis, diplopia, paraesthesia and myelitis - attach to the VZV vasculopathy node, and pneumonitis to the severe primary disease node.

    The myelitis edge carries the point the finding actually makes: spinal cord lesions at C6 and Th2 demonstrate that the vascular process is not confined to the cerebral circulation, which is why it is drawn from the same vasculopathy node rather than treated as separate CNS involvement.

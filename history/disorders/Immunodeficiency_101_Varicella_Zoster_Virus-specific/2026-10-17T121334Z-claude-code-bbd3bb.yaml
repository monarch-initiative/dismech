  summary: Bind LOINC intrathecal anti-VZV IgG index and CSF VZV DNA codes
  details: |
    LOINC tranche B batch 26. The cerebrospinal fluid intrathecal anti-VZV IgG index diagnosis row takes two measurements, because the row turns on the disagreement between them. LOINC:96961-8 (Varicella zoster virus IgG Ab index [Units/volume] in Serum and CSF) is the antibody index the row says establishes the diagnosis; its serum-and-CSF specimen pair is what an intrathecal index is computed from, which makes it a closer match than any of the CSF-only VZV IgG codes. LOINC:21598-8 (Varicella zoster virus DNA [Presence] in Cerebral spinal fluid by NAA with probe detection) is the CSF PCR the row records as frequently negative. Listing it states which observable the lumbar puncture reads; it does not assert a positive result.

    The other three diagnosis rows were left unbound as outside this tranche: brain and spinal MRI and the exome sequencing row are not pathogen assays, and the immunological evaluation row is a normal-result exclusion workup with no pathogen-specific measurement.

    Enumeration basis: Monarch KG LOINC set, query Varicella zoster virus, 132 results, total equalled shown so fully enumerated, retrieved 2026-10-17; no LOINC:LP Part code present.

    Both codes were absent from cache/loinc/terms.csv on origin/main and were seeded by the term validator against the Monarch KG; no label was typed by hand.

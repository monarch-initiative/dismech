  summary: 'Create: Immunodeficiency 101, varicella zoster virus-specific (POL III
    / POLR3F, MONDO:0030813)'
  details: |
    Created kb/disorders/Immunodeficiency_101_Varicella_Zoster_Virus-specific.yaml for
    MONDO:0030813 (OMIM #619872).

    Entry-type decision: DISEASE. MONDO:0030813 is a leaf under MONDO:0021094 immunodeficiency
    disease, with no descendants.

    GENE ANCHOR CAME FROM OMIM/MEDGEN, NOT MONDO - and that is a reportable MONDO gap.
    MONDO:0030813 carries NO causal-gene relationship (RO:0004003) at all. The stub therefore
    had no `genes:` block, exactly as the task anticipated. Following the stub's xrefs to
    OMIM:619872 and MEDGEN:1810668, the MedGen record supplies both an OMIM-sourced definition
    and an explicit AssociatedGenes entry: POLR3F, gene_id 10621, cytogenetic location
    20p11.23. That is the anchor used here. The missing MONDO relationship is worth reporting
    upstream and is recorded in the entry's notes.

    NEC preflight: `just preflight-dr <report> MONDO:0030813` returns SKIP, because MONDO
    records no causal gene for the concept and the automated gene-identity check cannot
    discriminate. Fell back to the manual OMIM/synonym check required in that case:
    - Gene: MedGen/OMIM anchor POLR3F; the report's gene-mention profile is POLR3F=48,
      POLR3A=7, POLR3C=4, POLR3E=4, MAVS=4. The anchor gene dominates and the other POLR3
      subunits are the acknowledged allelic series, not a rival entity. MAVS is a downstream
      RIG-I pathway partner, not a disease.
    - OMIM: the report asserts no OMIM ID, so there is no contradiction with the MONDO xref
      619872.
    - Synonyms: the MONDO synonyms are "IMD101" and the full label, both OMIM-sourced; no
      eponym or acronym collision. The report is about this entity.
    Verdict: manual preflight PASSES. The report has 8 references, 0 confabulations, but only
    3/8 scored on topic and it cites its sources by internal citation key rather than PMID, so
    NOTHING WAS CURATED FROM IT. It served as a cross-check; every claim here comes from
    primary literature I fetched and read myself.

    FULL-TEXT MINING. Both principal sources cache as full text (PMID:28783042 full_text_pdf,
    PMID:30211253 full_text_xml) and were mined accordingly rather than treated as
    abstract-only. The twins paper in particular supplied the entire clinical, diagnostic and
    therapeutic layer of this entry: ages at onset (25 and 35), the episode-by-episode course,
    CSF and MRI findings, the normal immunological workup, the absence of other infectious
    susceptibility, paternal transmission of the allele, the CADD/PolyPhen/SIFT support, the
    normal expression and solubility of the mutant protein, the poly(I:C) internal control, the
    ORF63 replication measurement, the acyclovir/corticosteroid regimen, and the relapse on
    acyclovir discontinuation.

    Pathograph (8 nodes, single connected component, all reachable from the trigger, MOLECULAR
    at the root): POL III subunit missense variant (MOLECULAR, trigger) -> impaired cytosolic
    sensing of AT-rich VZV DNA (MOLECULAR, central_effector) -> deficient type I interferon
    induction (CELLULAR, amplifier) -> failure to restrict VZV replication (CELLULAR, effector)
    -> branches to VZV reactivation from latency (TISSUE) -> VZV vasculopathy of cerebral
    arteries (TISSUE, consequence), and to severe primary VZV disease of the CNS and lungs
    (ORGANISM, consequence).

    The specificity claim is curated with its own evidence rather than asserted: poly(I:C),
    which bypasses POL III and engages RIG-I directly, produces NORMAL responses in patient
    cells, which localises the lesion to the sensor rather than anywhere below it. Paired with
    the normal immunological workup and the reported absence of other infectious
    susceptibility, that is what justifies calling this a pathogen-restricted immunodeficiency.

    Curated: 8 pathophysiology nodes, 11 phenotypes, 1 infectious_agent, 1 inheritance block,
    1 genetic block with a POLR3F R50W variants entry, 1 prevalence record, 4 diagnosis
    entries, 2 experimental models with modeled_mechanisms and readouts, 3 treatments,
    3 discussions, 83 evidence snippets over 6 references.

    Honesty caveats recorded in the entry:
    - A KNOWLEDGE_GAP records the nosological question this entity actually poses: OMIM defines
      IMD101 around ADULT REACTIVATION and anchors it on POLR3F, while the founding literature
      is PAEDIATRIC PRIMARY INFECTION in POLR3A/POLR3C. The neuronal model complicates rather
      than settles it, concluding that POL III matters "mainly upon reactivation". Both arms are
      curated off a shared upstream chain and the question is flagged rather than decided.
    - A second KNOWLEDGE_GAP records that POL III subunit variants cause either VZV
      susceptibility or hypomyelinating leukodystrophy with essentially no clinical overlap,
      that the mechanism partitioning them is stated in the literature to remain enigmatic, and
      that this makes variant interpretation in these genes gene-insufficient.
    - A HUMAN_MODEL_MISMATCH records that every model is of the wrong compartment: PBMCs are
      not neurons or cerebral endothelium; the SH-SY5Y model is a neuroblastoma line with an
      engineered knockout rather than the patients' missense allele; there is no animal model;
      and histopathological confirmation of the vasculitis was never obtained in either patient.
    - The corticosteroid treatment states that its contribution cannot be separated from the
      antiviral's in a two-patient series, and that immunosuppressing a host who already fails
      to control VZV is not a neutral act.
    - `frequency:` omitted from every phenotype; prevalence is CASES_IN_LITERATURE /
      ULTRA_RARE with the published case count enumerated.
    - Several PMID:28783042 quotes are bounded short: that cache is full text of a typeset PDF
      in which words are hyphenated across line breaks ("alphaherpes-virus", "pneu-monitis",
      "infec-tion"). Snippet matching normalizes ordinary line breaks but not intra-word
      hyphens, so every quote from that source stops short of a hyphenated word. Where that
      clipped a clause, the clipped content is carried in the surrounding description and the
      reason is stated in the evidence explanation. This is documented in the entry's notes.
    - No `datasets:` block; no ORPHA evidence (refresh-orphadata fails on a manifest checksum
      mismatch).


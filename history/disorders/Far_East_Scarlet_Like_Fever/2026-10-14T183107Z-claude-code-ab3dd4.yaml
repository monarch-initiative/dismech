  summary: Bind LOINC Yersinia pseudotuberculosis antibody titer code to both serology
    rows
  details: |
    Added diagnosis_term (NCIT:C217458 Diagnostic Serology Testing) and diagnosis[].measurements binding LOINC:6967-4 (Yersinia pseudotuberculosis Ab [Titer] in Serum) to both diagnosis rows: Stool culture and paired agglutinating antibody titers, and Yersinia agglutination serology in refractory Kawasaki-like illness. The titer code was chosen over the method-less-but-qualitative presence code (LOINC:40936-7) because both rows describe quantitative fourfold-rise / paired-titer serology, not a simple reactive/nonreactive result. The first row bundles stool culture with serology; a notes field on that row records that only the serology arm is coded. This entry (Far East Scarlet-Like Fever, a pediatric Kawasaki-like presentation of Y. pseudotuberculosis infection) is a distinct kb entry from Yersinia_Pseudotuberculosis_Infectious_Disease.yaml, which an open PR (#13988) already covers; no file overlap. New cache/loinc/terms.csv row, confirmed absent from origin/main before seeding.

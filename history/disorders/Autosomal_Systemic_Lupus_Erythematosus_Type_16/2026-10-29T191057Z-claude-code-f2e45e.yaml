  details: |
    Addressed PR #15956 review in one push. BLOCKING: added 11 frequent (>10%) phenotype nodes from PMID:42716676 Table 2/3 with exact table-row snippets and frequencies - malar rash (44%), inflammatory eye disease (40%, bound to Episcleritis HP:0100534 with PMID:42396794 supporting the specific form), abdominal pain (31%, with IBD note from PMID:35670985), generalized lymphadenopathy (29%), leukopenia/lymphopenia, photosensitivity, discoid lupus rash, antiphospholipid antibody positivity, serositis, anti-C1q antibody positivity (87%, sharpens C1q-deficiency differential), osteoporosis (23 to 41 percent, description notes it is largely glucocorticoid-related and leaves it mechanistically unwired), and kidney failure (Stage 5 CKD HP:0003774). Wired cutaneous/systemic lupus features as SLE-node sequelae and kidney failure as a Lupus Nephritis sequela. SUGGESTIONS: (1) added a human PMID:33022220 evidence item to the self-DNA-accumulation node; (2) graded the PMID:33022220 framing sentence quote_role BACKGROUND; (3) added a sentence to the immune-complex node explaining GO:0002434 clearance DECREASED is a proxy for complex formation/deposition; (4) retagged Type I Interferon Pathway Activation biological_scale MOLECULAR to CELLULAR. All 68 snippets verified; terms, entity-refs, causal-targets, coarse-phenotypes, gene-activity-grounding and snippet gates pass.

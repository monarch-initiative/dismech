  summary: Correct phenotype frequency bands
  details: |
    Review round 2 on PR 15956: five phenotypes added in the previous round carried frequency bands that contradicted their own quoted Table 2 counts (PMID:42716676). Generalized Lymphadenopathy (29%/11%), Leukopenia (17%/26%), Serositis (11%/17%) and Antiphospholipid Antibody Positivity (21%/24%) changed from FREQUENT to OCCASIONAL; Anti-C1q Antibody Positivity (87% of those tested) changed to VERY_FREQUENT. Inflammatory Eye Disease is bound to HP:0100534 Episcleritis, but its 40% figure covers inflammatory eye disease of any type, so its frequency was removed and the description says why. Every other phenotype frequency was re-checked against its quoted count.

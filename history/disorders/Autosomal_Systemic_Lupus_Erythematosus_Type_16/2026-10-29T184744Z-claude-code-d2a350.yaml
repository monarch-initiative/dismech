  summary: 'Create: Autosomal Systemic Lupus Erythematosus Type 16'
  details: |
    De-novo curation of SLEB16 (MONDO:0013743), biallelic DNASE1L3 loss-of-function monogenic lupus. 9 pathophysiology nodes wiring DNASE1L3 LoF -> impaired extracellular chromatin clearance -> self-DNA accumulation -> extrafollicular B-cell tolerance loss / transient type I IFN -> immune-complex deposition -> complement consumption, feeding 14 HP-bound phenotypes. DNASE1L3 node grounded on GO:0033891 (CC-preferring endodeoxyribonuclease activity); Dnase1l3-KO mouse (PMID:27293190) with two modeled_mechanisms. HUVS recorded as an allelic presentation (differential_diagnoses + notes), not a separate entry/subtype, since the same biallelic LoF variants span the HUVS-SLE continuum (PMID:23666765, PMID:27821515). No module conformance: mechanism is STING-independent, MyD88/TLR-dependent, extrafollicular (PMID:27293190, PMID:32454024), fitting no existing module. 51/51 evidence snippets verified against references_cache; all terms validated via OLS. A claude_code deep-research report was generated and reviewed (research/Autosomal_Systemic_Lupus_Erythematosus_Type_16-deep-research-claude_code.md); it corroborated every binding and added no central quotable item. Recombinant DNASE1L3 enzyme replacement (NTR-441, NEJM 2026 PMID:42456144) deliberately omitted: report flagged it as press-release-sourced and the PMID cache is content-unavailable with no quotable abstract.

  summary: 'Create: Megalencephalic Leukoencephalopathy With Subcortical Cysts 1'
  details: 'New entry for MONDO:0024555 (MLC1-related classic MLC). Input was one Perplexity deep-research report run at reasoning_effort low; only PMIDs named in its body were used as leads (11254442, 18757878, 12189496, 12973663, 38141856, 40051162, 38487253; 12684714 was read but not cited), plus primary literature found via PubMed: GeneReviews NBK1535 (PMID:20301707, tagged), the 2018 242-patient cohort (PMID:29661901), Ridder 2011 VRAC/RVD (22006981), Dubey 2015 Mlc1-null mouse (25382142), Hoegg-Beiler 2014 (24647135), Lopez-Hernandez 2011 GlialCAM (21419380, 21624973), seizure/potassium study (29466841), DGC/Kir4.1 (17628813), gliovascular unit (34723793), AAV gene therapy (32372403), Agarwal founder (15037685), 24-year sibling follow-up (15704020), original clinical and biopsy papers (7695231, 8841668). Pathograph: MLC1 loss of function -> misfolding/surface loss -> (complex disruption, VRAC/RVD defect) -> endfoot swelling -> intramyelinic edema/vacuolation -> white matter swelling, megalencephaly, cysts, ataxia, spasticity, cognitive decline; and RVD defect -> potassium/network hyperexcitability -> seizures, status epilepticus. Judgement calls: human post-mortem evidence that GlialCAM localization is preserved (21624973) recorded as REFUTE on the complex edge against the mouse finding; MLC2A/2B/3/4 not folded in as subtypes; several cohort frequencies are MLC1+MLC2A combined, noted in notes; head trauma recorded as an environmental trigger of coma with no ECTO term (searched trauma/injury); molecular_functions bound as ion channel regulator activity (decreased) and calmodulin binding. Validation: just validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-genereviews, check_gene_activity_grounding --against-ref origin/main and validate-disorders all pass; 75/75 snippets verified. A second round added a diagnosis section (brain MRI, molecular genetic testing) and GeneReviews NBK1535 full-text citations for the recurrence risk and heterozygote status on the inheritance block, and split three evidence items whose quotes mixed human and in vitro findings; 87/87 snippets verified and all gates pass. Review round 1 suggestions: added an extrapyramidal-signs phenotype (HP:0002071) from the GeneReviews abstract, recorded the GeneReviews statement that early development is normal in most as a REFUTE item on Motor Delay, and expanded the head-trauma note to list every ECTO search run.

    '

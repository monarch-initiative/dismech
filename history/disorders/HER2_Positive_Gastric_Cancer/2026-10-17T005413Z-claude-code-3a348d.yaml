  summary: Bind tissue-generic HER2 IHC/FISH codes, avoiding the breast-specimen trap
    (tranche F batch 3)
  details: |
    LOINC tranche F batch 3. No diagnosis: section exists; used biochemical[].loinc_term (route 1). This entry's own text states IHC scoring differs from breast cancer due to heterogeneous staining and basolateral membrane patterns (the ToGA scheme). Deliberately avoided reusing LOINC:85319-2 (HER2 IHC presence bound on HER2_Positive_Breast_Cancer in tranche F batch 2), since that code's own label names 'Breast cancer specimen' specifically and reusing it here would misstate the specimen. Bound LOINC:18474-7 (HER2 Ag [Presence] in Tissue by Immune stain), the tissue-generic equivalent, instead. The FISH row's ratio code, LOINC:49683-6, is already tissue-generic in its own label (not breast-specific) and was reused as-is from batch 2 -- not a trap, since its own label never named breast tissue. Both codes newly seeded on this branch (both also exist on the still-open sibling loinc-f-batch2 branch, an expected non-blocking collision). No interpretation_bands recorded: neither the IHC 0/1+/2+/3+ grading nor the FISH ratio >2.0 cutoff is cited in this entry. just validate-disorders, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-causal-targets, and tests/test_loinc_measurement_schema.py all pass.

  summary: 'Create: Olmsted Syndrome 2'
  details: |
    New entry for the dominant PERP form of Olmsted syndrome (MONDO:0030961). The mechanism chain, phenotypes, inheritance and variants come from the founding report (PMID:30321533), whose full text is cached: last-exon PERP nonsense variant escaping nonsense-mediated decay, unstable desmosomal incorporation of the truncated protein, immature desmosomes lacking the electron-dense midline, reduced keratinocyte adhesion under mechanical stress, with basal hyperproliferation and altered terminal differentiation linked to the variant by edges of unknown intermediates. Two nodes conform to desmosomal_adhesion_failure; the trigger node was deliberately not conformed because that node asserts loss of a component, whereas here a truncated protein is expressed. functional_impact_category is UNKNOWN because the authors propose but do not demonstrate a dominant-negative and neomorphic mechanism. Two Perp knockout mouse models are linked as PARTIALLY_RECAPITULATES with LOW fidelity and CAUSE_UNREPRESENTED divergences, since they model the recessive null rather than the dominant truncation. Skeleton synonyms 'PERP-related Olmsted syndrome' and 'autosomal dominant PERP-related keratoderma' could not be sourced and were dropped; the MONDO synonym 'palmoplantar keratoderma, mutilating, with periorificial keratotic plaques 2' was added. Deep research: one openscientist report (research/Olmsted_Syndrome_2-deep-research-openscientist.md). Its reference validation resolved 12/12 identifiers with 2 of 22 quotes not found (both PMID:25886873, a 2015 Olmsted syndrome review predating the PERP discovery); term validation flagged four mislabelled CURIEs (HP:0011220, HP:0011817, HP:0001055, UBERON:0001456), none of which were used. The report is about PERP (67 mentions) and names the correct HGNC id, so it is not a named-entity confusion, but it attributes general Olmsted syndrome features (pseudoainhum, pain, pruritus, corneal and oral involvement, recurrent infections, about 73 cases, male predominance), EGFR/mTOR activation and erlotinib/sirolimus response to the PERP form, all sourced to papers that are either TRPV3-era reviews or do not state a PERP genotype; none of that was curated. It also states the dominant-negative mechanism as established, which the primary source does not. just preflight-dr could not run because the local MONDO build is absent and was not downloaded for disk reasons; identity was checked by hand against the MONDO record (PERP causal gene, OMIM:619208 xref, synonyms). GeneReviews: just check-genereviews --online reports NO_CHAPTER. Two follow-up case letters (PMID:31361044, PMID:34265120) cache with no quotable text after a forced refetch and are named in notes as leads. No ClinGen record for PERP is cached, so gene_disease_validity is absent. Validation: just validate, validate-terms, count-verified-snippets (49/49), check-entity-refs, check-causal-targets, check-qualifier-terms, check-duplicate-keys, check-block-scalar-comments, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-folded-yaml, check-coarse-phenotypes, check-reference-titles and validate-disorders all pass.

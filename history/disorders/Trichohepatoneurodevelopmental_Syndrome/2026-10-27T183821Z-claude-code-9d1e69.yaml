  summary: 'Review round 1: THNS bile acids, missing phenotypes, case count'
  details: |
    Answers the ai4c-reviewer CHANGES_REQUESTED review on PR 15752. All four IMPORTANT findings were verified against the cached full text of PMID:38524542 before acting and all four were correct. (1) The hepatic pathophysiology node asserted that bile acids have never been measured in a CCDC47 patient, while this same entry's liver phenotype quoted the measurement - a total bile acid of 214.9 micromol/L against a 0-20 interval - so the entry contradicted itself. The node description now separates the observation from the mechanism: there is one direct measurement of retention, and what remains hypothetical is that the lesion is canalicular export failing because the multipass ABC transporters that perform it are PAT substrates. Added that measurement as HUMAN_CLINICAL evidence on the node, kept the WDR83OS items as directness INDIRECT, added an Increased serum bile acid concentration phenotype (HP:0012202), and narrowed the knowledge gap from 'never measured' to 'no panel across the series'. (2) Added eight phenotypes present in the pooled table but missing from the entry: profound intellectual disability (HP:0002187, named in the source's own list of most common phenotypes), absent speech (HP:0001344), feeding difficulties (HP:0011968), EEG abnormality (HP:0002353), joint hypermobility for the jointly reported distal arthrogryposis/joint laxity row (HP:0001382), overlapping toe (HP:0001845), brachycephaly (HP:0000248) and recurrent otitis media (HP:0000403). (3) The published case count was wrong. The note said six; the arithmetic is four from the founding report plus one from China plus two from Saudi Arabia, which is seven. The Saudi report calls its patients the fifth and sixth because it counts only the founding four plus its own and not the Chinese case, so the literature's own numbering undercounts by one. Corrected in the prevalence note and in the hearing-impairment description. (4) Hearing impairment was banded VERY_RARE at 1/5, which is 20% and therefore OCCASIONAL; corrected. Suggestions taken: zygosity removed from the root node's genetic_context, because the lesion is biallelic but homozygous in most individuals and compound heterozygous in one and ZygosityEnum is single-valued with no biallelic member, so any value would misdescribe part of the series - the reason is now stated in the node description; therapeutic_modality changed from BEHAVIORAL to OTHER, which does not misdescribe gastrostomy and orthopaedic care; the four founding-report alleles added as one grouped variant record, grouped because the sources present them as a set and no allele-specific effect has been reported; PMID:38524542 and PMID:39171352 added to references:; and the source's internal ptosis discrepancy (narrative 5/5 against table 4/5) recorded in that phenotype's description rather than silently resolved. Also acted on the reviewer's last suggestion: the bile-acid node's edge to Elevated circulating hepatic transaminase concentration was removed, because it contradicted this entry's own WDR83OS argument that retention occurs with normal-to-mildly-elevated enzymes; the node now feeds the bile-acid phenotype and pruritus only. Re-validated: schema, terms, 52/52 snippets, 58 titles, and the per-file and whole-tree gates clean.

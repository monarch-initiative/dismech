  summary: 'Create: Trichohepatoneurodevelopmental Syndrome'
  details: |
    De novo curation of THNS (MONDO:0032645, CCDC47). Deep research: falcon was requested and returned HTTP 403 (invalid EDISON_API_KEY); the run fell back to openscientist with --fallback, so the committed report records fell_back/requested_provider/provider_attempts. Report validation read before use: 6/6 references resolved, confabulation_rate 0.0; needs_review was set, but the 18 label mismatches are almost all an artifact of the report putting frequency words ('Common', 'Variable', '5/6 in paralog cohort') in the label column rather than wrong CURIEs. One is a genuine wrong binding - the report calls CL:0000763 'hair follicle cell' when CL calls it 'myeloid cell' - and it is not bound in this entry. The report also cited an obsolete GO:0061077. The report added no reference I had not already found; its one new PMID (30140426, CCDC47 in diabetic cardiomyopathy) is off topic for this disease and was not used. Its independent conclusion matched the entry built before it was read, including the WDR83OS paralog argument and the bile-acid-transport hypothesis, which is convergent support rather than new content. Two curation decisions worth recording. First, CCDC47 was initially written as hgnc:25228 from memory; an HGNC REST lookup gave hgnc:24856, and the entry was corrected before any validation run - the exact failure mode CLAUDE.md documents, caught only by the lookup. Second, gene_disease_validity is deliberately absent although PMID:39171352 reports a Strong classification: that is the authors applying ClinGen's framework themselves, not a ClinGen Gene Curation Expert Panel record, and there is no CGGV assertion identifier, so recording classified_by CLINGEN would misattribute it. The claim is kept in genetic[].notes instead. The hepatic arm of the pathograph is marked as hypothesis-linked throughout, because bile acids have never been measured in a CCDC47 patient and the supporting evidence is from WDR83OS deficiency; the two evidence items carrying it are graded directness INDIRECT for that cross-gene reason, and a KNOWLEDGE_GAP records the unmeasured assay. just preflight-dr could NOT be run: it requires the local 1.3 GB MONDO build and this container had about 500 MB of writable disk free, so the Named Entity Confusion check was done by hand (the entry is explicitly distinguished from trichohepatoENTERIC syndrome, the SKIV2L/TTC37 disorder already in kb/, which is the name-collision hazard here). Validation: just validate passes (schema, terms, 40/40 snippets, 44 titles); the per-file and whole-tree KB and evidence gates are clean. GeneReviews baseline: NO_CHAPTER.

  summary: 'Fix red CI: ground the causal gene with a molecular function'
  details: |
    Fixes the check-gene-activity-grounding gate, which failed in CI on this branch. The gene descriptor on the entry's root pathophysiology node carried no molecular_functions, so the gate counted it as a newly ungrounded gene. All four entries in this curation batch had the same defect; I found it on the DPH1 branch first, from that PR's red CI, and then checked the other three rather than waiting for each to go red in turn. Fixed by binding a real molecular function in every case rather than grandfathering the node in tests/gene_activity_grounding_baseline.txt: that exemption is for a many-gene bundle or a class whose members share no function, and none of these nodes is either - each carries exactly one gene with one well-defined activity that the entry's own cited evidence already describes. KDF1 is bound to GO:0030674 protein-macromolecule adaptor activity, which is what the cited USP7 evidence describes it doing - bringing the deubiquitinase to IKK-alpha rather than acting as an enzyme itself. CCDC47 is bound to GO:0044183 protein folding chaperone for its PAT-complex intramembrane chaperone role and GO:0005509 calcium ion binding for the low-affinity high-capacity ER calcium binding, both of which the entry already cites evidence for. LMNA is bound to GO:0160123 structural constituent of nuclear lamina, following the precedent already in kb/disorders/Charcot-Marie-Tooth_Disease_Type_2.yaml, which grounds the same gene with the same term on an equivalent nuclear-lamina node. Each carries modifier DECREASED, which is the direction all three lesions act in. Note on cost: this push dismisses the approval on this PR where one had been given, because main has dismiss_stale_reviews enabled. That is unavoidable and correct - a red head is not mergeable whatever its review state, so holding the fix to protect an approval would have left the PR unmergeable with an approval on it.

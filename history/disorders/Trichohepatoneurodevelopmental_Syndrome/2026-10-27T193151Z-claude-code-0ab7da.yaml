  summary: 'Review round 3: THNS lengthen five table-derived snippets'
  details: |
    Answers the round 3 ai4c-reviewer review on PR 15752. The finding was correct and it was my gate miss, not a disagreement: five evidence snippets were under the five-word floor of check-snippet-length, and I had run that gate in the other three worktrees of this batch but not in this one. Four of the five had been present since round 1 of this entry. All five were table-derived, and the run-together rendering of the cached table collapses a row such as 'Thoracic hypertrichosis + + + + + 5/5' into two word-like tokens. Fixed without truncating anything. Two now quote the narrative frequency runs instead of the table: feeding difficulties quotes 'steatorrhea (2/5), chronic diarrhea (2/5), gallstones (2/5) and gastrostomy tube (3/5)', and hip dysplasia quotes 'bilateral hip dislocation (2/4), hip dysplasia (3/4), bilateral coxa valga (2/4)'. Three quote the cache's pipe-delimited rendering of the same rows they already cited - bilateral otitis media, thoracic hypertrichosis and patent ductus arteriosus - which is both the faithful form of the row and the form the gate recognises as a structured row; check_snippet_length.is_structured_row is purely syntactic, matching any pipe between non-space characters regardless of the reference prefix, so a pipe-delimited row quoted from a PMID cache is exempt exactly as an ORPHA or ClinGen row is. Thoracic hypertrichosis and bilateral otitis media appear nowhere in the paper's narrative, only in its table, so the row is the only quote available for either and dropping to a narrative sentence was not an option. The reviewer also noted a discrepancy internal to the source that the change surfaced: its results narrative gives hip dysplasia 3/4 while its table gives 4/4. Recorded in that phenotype's description the same way the ptosis 5/5-versus-4/5 discrepancy already is, rather than resolved; the VERY_FREQUENT band holds on either figure. Re-validated: schema, terms, 52/52 snippets, 58 titles, and check-snippet-length, check-title-snippets and check-snippet-grading all clean.

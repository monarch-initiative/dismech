  summary: Correct false negative therapy claim; add surgical repigmentation and diagnosis
  details: |
    Re-review of PR #9304 found that the entry asserted 'There is no therapy that restores melanocytes to the affected regions'. That was factually wrong and unsupported by the cited abstract. Autologous melanocyte transfer does repigment piebald skin: PMID:15099368 reports repigmentation of all lesions in six piebaldism patients using laser-resurfaced beds plus autologous cultured epidermis, and PMID:33428279 confirms cellular grafting as an established option in piebaldism. The claim is narrowed to medical/pharmacological therapy and a surgical repigmentation treatment added with its own evidence. Also added a diagnosis section (clinical plus KIT sequencing, with the syndromic differential). All snippets verified against cached abstracts.

  details: |
    Curated CMH13 (TNNC1, cardiac troponin C; MONDO:0013195), a ClinGen-definitive HCM gene, conforming to cardiomyopathy_maladaptive_remodeling. Mechanism: the most direct myofilament calcium-sensitization lesion (increased Ca sensitivity, e.g. A31S), with a parallel arrhythmogenic-substrate node for the reported fatal arrhythmogenic subtype (childhood VF/aborted SCD). Founding L29Q allele cited. Deleted stub; added to FHCM grouping. All snippets verified; full validation passes.

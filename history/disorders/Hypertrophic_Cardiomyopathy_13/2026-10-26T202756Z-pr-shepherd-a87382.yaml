  summary: 'Address review on #15526: GO binding, causal edges, diagnosis evidence'
  details: |
    Review fixes for PR 15526. (1) Replaced GO:0030172 troponin C binding on the TNNC1 trigger node with GO:0031013 troponin I binding (OLS label checked); GO:0030172 means binding to troponin C, an activity of TnI/TnT, not of cTnC. (2) Removed the PMID:22815480 item from TNNC1 Molecular Genetic Testing: its sentence says TNNC1 variants are rare and says nothing about testing, and the abstract has no sentence about how the variant was found. (3) Removed the edge from Diastolic Dysfunction, Heart Failure and Arrhythmic Risk to Hypertrophic Cardiomyopathy, which ran from consequence to cause. (4) Removed the duplicate paths to ventricular fibrillation and sudden cardiac death: Arrhythmogenic Substrate now leads to Ventricular Fibrillation only, the endpoint node no longer points at VF or SCD, and SCD is a sequela of VF. (5) Added quote_role REVIEW_SYNTHESIS to the PMID:26232335 L29Q item and rewrote the explanation of the echocardiography item citing the PMID:28912181 definition sentence, since the cached abstract has no sentence about echocardiographic diagnosis. (7) Dropped Sarcomere Organization ABNORMAL from the trigger node, which its evidence does not support. (8) Corrected the notes sentence that called PMID:28912181 primary TNNC1 cohort literature. Splitting the two bundled pre-existing nodes (suggestion 6) was not done in this pass. Validated with just validate, count-verified-snippets (20/20), check-causal-targets and check-entity-refs.

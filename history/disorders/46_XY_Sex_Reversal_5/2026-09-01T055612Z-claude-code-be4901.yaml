  summary: 'Create: 46,XY Sex Reversal 5'
  details: |
    De novo curation of 46,XY sex reversal 5 (SRXY5, MONDO:0013120, CBX2).

    Deep research: 'just research-disorder falcon' was requested. Falcon/Edison was unreachable (HTTP 403, authentication failed) on two attempts and on 'deep-research-client providers --check'. The run was re-issued with dr_fallback='--fallback' rather than substituting a provider by hand; openscientist produced the report, which is recorded in the report frontmatter (fell_back: true, requested_provider: falcon, provider_attempts) and in its filename, research/46_XY_Sex_Reversal_5-deep-research-openscientist.md.

    Report validation was read before use. reference_validation: 17/17 references resolved, 0 unresolved, 10/10 quoted claims found in source. term_validation: 40 terms, 0 unresolved, but needs_review: true with 8 mislabelled terms (the report names HP:0010461 '46,XY sex reversal', HP:0000062/HP:0000047 'Physical manifestation', NCIT:C15417 'hormone therapy', NCIT:C15277 'surgery', NCIT:C15681 'genetic counseling'). None of those bindings was used; every ontology term in this entry was selected independently with OAK and carries the ontology's own canonical label. 'just preflight-dr <report> MONDO:0013120' PASSed (CBX2 mentioned 100 times, OMIM 613080 agreeing between MONDO and the report).

    Scope. The entire published human caseload is three individuals, so the entry is written to that limit: no prevalence rate, no frequency bands on the CBX2.2 features, and no gonadal tumour-risk figure attached to the gonadectomy record. Two subtypes carry the isoform split - CBX2.1 (the 2009 index girl, complete female phenotype with histologically normal ovaries) and CBX2.2 (two undervirilized 46,XY individuals with dysgenetic Sertoli-cell-only testes).

    Pathophysiology is built as a causal chain of 12 nodes from biallelic CBX2 loss of function through the transactivation and repression arms, reduced SRY, failed Sertoli differentiation, dysgenetic gonad, and the endocrine and genital consequences. Two competing mechanistic_hypotheses are recorded: the canonical 'CBX2 transactivates upstream of SRY' model and the ALTERNATIVE 'CBX2 represses the ovary-promoting pathway' model from the Cbx2-/-;Wnt4-/- rescue (PMID:31116734), with the relevant downstream edges tagged into hypothesis_groups. The two are not reconciled and the entry says so rather than picking one.

    Three discussions: a HUMAN_MODEL_MISMATCH on the murine adrenal/splenic SF1 phenotype that human CBX2 patients do not show, and KNOWLEDGE_GAPs on CBX2.2 zygosity/gene-disease validity (a 47-patient screen found no pathogenic CBX2, PMID:23219007) and on the absent tumour-risk denominator.

    Key references: PMID:19361780 (index case), PMID:29998616 (CBX2.2 patients), PMID:31719618 and PMID:25569159 (target landscape), PMID:31116734 (Wnt4 rescue), PMID:9641679, PMID:22186409, PMID:15899914, PMID:22200029 (mouse), PMID:23219007 (negative screen), PMID:31058389 (PBX1-CBX2-EMX2), PMID:17885459 (DSD management). PMID:20301714 (Nonsyndromic Disorders of Testicular Development) is tagged GeneReviews in the references block; there is no GeneReviews chapter for SRXY5 or CBX2, and that record's PubMed abstract carries only the chapter purpose statement, so no phenotype was derived from it.

    One correction made against the sources: the CBX2 pLI of 0.95 quoted by PMID:29998616 is an ExAC-era figure that sits awkwardly with a recessive mechanism, and the deep-research report's gnomAD lookup gives a much lower value. The entry reports the published figure with that attribution and flags it rather than asserting either number as current constraint.

    Datasets: geo:GSE130749 added and verified with 'just verify-datasets'. Every other candidate from 'just discover-datasets' was a GENE_ONLY match on CBX2 chromatin/cancer biology or a word match on 'sex reversal' in an unrelated cohort, and was triaged out; the reason is recorded in the dataset notes.

    Validation: 'just validate' passes with 85/85 snippets verified against the reference cache; 'just validate-terms' passes; check-causal-targets, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-snippet-length, check-title-snippets, check-folded-hyphens, check-snippet-grading all pass. 'just compliance' reports 83.8%. The stub stubs/46_XY_Sex_Reversal_5.yaml was deleted.

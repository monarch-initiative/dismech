  summary: 'Review fixes: 46,XY Sex Reversal 5'
  details: |
    Pre-PR adversarial self-review of the CREATE session, and the fixes it produced.

    Two errors of fact were found and corrected.

    (1) Animal-model conflation. The entry carried a single 'Cbx2 (M33) null mouse' on C57BL/6 citing PMID:9641679, and attached to it the 28.6% sex-reversal rate and the bilateral-testicular-hypoplasia finding from PMID:22200029. Those come from a different knockout line - deletion of the 5' UTR and first four coding exons, maintained on BALB/c - and the strain contrast is that paper's central point ('major differences in the sex reversal phenotype of Cbx2 knockout mice generated on the BALB/C genetic background compared to the phenotype described in Cbx2 deficient mice on the C57BL/6Njcl (B6) background'). Split into two animal_models entries with the allele and background named on each, and the C57BL/6 gonadal readout re-quoted from the sentence that actually describes B6.

    (2) Misread statistic. The Sex reversal phenotype said 'more than half of surviving XY nulls are phenotypically female'. PMID:9641679 reads 'More than half of the resultant M33cterm/M33cterm mutant mice died before weaning, and survivors showed male-to-female sex reversal' - the quantifier is pre-weaning mortality. The entry's own animal_models description had it right, so the file contradicted itself. Replaced with two strain-attributed rates from PMID:22200029 (majority on B6 with ~50% of surviving adults having bilateral ovaries; <30% on BALB/c).

    Semantic fixes the validators cannot see:
    - A 'supports: REFUTE' item sat inside the ALTERNATIVE ovarian-derepression hypothesis while its explanation said it refuted the CANONICAL one. Since 'supports' is claim-relative to the object it hangs on, it read as the opposite of what was meant. Moved to cbx2_sry_transactivation_model, and the snippet swapped from the paper's framing sentence to its actual result (the Cbx2-/-;Wnt4-/- rescue).
    - Root node renamed 'Biallelic CBX2 Loss of Function' -> 'CBX2 Loss of Function': it asserted a zygosity that this entry's own knowledge gap records as unresolved for the CBX2.2 patients.
    - 'in trans' dropped from the inheritance description; no cached source reports phase.
    - HP:0000133 replaced with HP:0008668 (Gonadal dysgenesis, male) in both places. HPO's own definition of HP:0000133 says the term 'is to be avoided if possible for new annotations'.
    - Gonadectomy rebound from generic NCIT:C15329 to NCIT:C218841 Bilateral Orchiectomy (verified reachable from NCIT:C25218).
    - The EMX2 node's GO binding changed from GO:0008406 (a tissue-scale developmental process, on a MOLECULAR-scale node) to GO:0006357.

    Constraint data resolved rather than deferred. The previous version noted that the ExAC pLI of 0.95 quoted by PMID:29998616 sat awkwardly with a recessive mechanism and 'should be re-derived'. Queried the gnomAD API directly (GRCh38, 2026-09-01): pLI 0.024, oe_lof 0.52 (90% CI 0.33-0.87), LoF Z 1.85 - independently matching the deep-research report's figures. CBX2 is not LoF-intolerant, which is what a recessive mechanism predicts. Both figures now stated with their provenance.

    New sections. Added a diagnosis: block (karyotype-phenotype discordance as the ascertainment route, hCG stimulation testing, gonadotropin/testosterone measurement, CBX2 sequencing plus the purpose-built MLPA probe set from PMID:23219007), and an external_assertions: block carrying OMIM:613080 and the two ClinVar index-allele classifications - recorded as external assertions rather than evidence items because no cached publication names those alleles. Added target_mechanisms to Gonadectomy and Genitoplasty, which previously attached to no pathograph node.

    Smaller corrections: the top-level description said both CBX2.2 patients had Sertoli-cell-only testes (only one did; the other had no gonadal tissue); 'demonstrating' softened to 'consistent with' on a single n-of-1 hCG test; the Sertoli-cell-only binding now acknowledges the residual atypical spermatogonia that the HPO definition excludes; the Sertoli-differentiation-to-Sertoli-only edge made INDIRECT with the germ-cell-loss intermediate named; two PMID:31719618 introduction statements regraded HUMAN_CLINICAL -> OTHER as second-hand citations, with the previously unsourced 'week 7' claim now carrying its own snippet; the Sry DECREASED direction marked directness INDIRECT with the rescue sentence added as its direct support; 'total published caseload is three individuals' reworded throughout to describe the literature this entry draws on rather than assert a census.

    Not changed, with reasons: PMID:16882788 (the primary DSD consensus statement) has no abstract text in its PubMed record, so nothing is quotable from it and the secondary review PMID:17885459 is retained instead; the Empower-DSD quality-of-life papers were left out because they concern DSD care generally and would put a clinical_burden claim on this entry that no CBX2 patient supports.

    Validation after fixes: just validate and validate-disorders pass with 98/98 snippets verified; check-causal-targets, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms (offline and online), check-snippet-length, check-title-snippets, check-folded-hyphens, check-snippet-grading, verify-datasets all pass. Pathograph re-checked programmatically: 12 nodes, 28 edges, single root, no orphans, all 14 phenotypes reached. Compliance is 83.8% (217/259), the same percentage as before these fixes while the denominator grew from 203 to 259 slots.

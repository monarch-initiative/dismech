  summary: 'Pituitary blastoma: ACTH excess and Cushing syndrome'
  details: >-
    Adds depth on the tumour's ACTH secretion and the Cushing syndrome it drives, with 22 new evidence
    items from the existing cited sources and two newly cached case reports (a 2014 case of
    infantile-onset Cushing disease and a 2025 case in a 27-year-old man). The Tumoral ACTH Secretion
    node gains four items, and its description now also notes that all three tumours of a 2012 report
    contained ACTH-producing cells, though one was clinically nonfunctioning, which is recorded as a
    REFUTE item; of the 17 tumours of the outcome series, 16 stained for ACTH; in the first described
    tumour the large ACTH-immunoreactive cells also stained for beta-endorphin and alpha-MSH; and in one
    tumour of the 2012 report electron microscopy showed large corticotroph cells holding secretory
    granules. The Cushing syndrome row gains five items, two of them graded REFUTE for patients reported
    as young adults whose abstracts do not report Cushing syndrome in the patient (a 19-year-old woman
    with a possible pituitary blastoma, a raised growth hormone and a normal ACTH and cortisol, and a
    27-year-old man whose listed presenting features do not include it), named in the row's description.
    A new biochemical section records a raised ACTH and a raised cortisol, bound to ChEBI corticotropin
    and cortisol, with no LOINC code bound, with readouts to the ACTH secretion node and to the Cushing
    syndrome phenotype; each row records the 19-year-old with normal levels as a REFUTE exception named
    in its notes. No treatment row was added: no cached source describes medical control of the
    cortisol, and the one child whose hypercortisolism returned after surgery and settled under
    chemotherapy is already recorded. Among the new quotes, those about patients who lack a row's
    finding, and about nothing else, are graded REFUTE, and those that also cover patients with the
    finding are graded SUPPORT with the exceptions named in the row's notes or description; quotes from
    which a claim follows only by an inference step are graded INDIRECT. Validated with just validate,
    just validate-terms, just count-verified-snippets, just check-snippet-grading and the other
    whole-repo gates CI runs.

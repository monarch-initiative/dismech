  summary: 'Pituitary blastoma: histology, cell components, hormone immunostaining and methylation profiling'
  details: >-
    Adds a histopathology section and a DNA methylation profiling diagnosis row, with 22 new
    evidence items, all from sources the entry already cites. Four histopathology rows: primitive
    Rathke-type epithelium in rosettes and glands, marked diagnostic; small primitive cells
    (blastema); ACTH-immunoreactive secretory cells (16 of 17 tumours of the outcome series,
    PMID:33236116, with growth hormone in 10 of 14 tested); and a variable proliferation index
    (mitotic activity and MIB-1 labelling in a 2012 report of three tumours (PMID:21805093), the
    Ki-67 index in the genetics series (PMID:24839956), high in four tumours and minimal in one, all
    three of the 2012 report's tumours among them, and the Ki-67 index in the outcome series, which
    was not significantly associated with survival; the series' own caveat that six
    complication-related deaths limit its prognostic analysis is quoted in the explanation). No
    histopathology row is bound to an ontology term; the only binding the change adds is the
    diagnosis row's NCIT:C63328. Each histopathology row's notes give the NCIT and HPO searches run
    and the reason the closest admissible terms they returned were not used: for the Rathke-type
    epithelium row, the rosette and gland terms (such as HP:0031925 Rosette, NCIT:C35940 Rosette
    Formation, NCIT:C62128 Rosette-Like Configurations Present and NCIT:C35929 Glandular Pattern)
    name the arrangement, or glandular epithelium in general or of another organ, rather than the
    primitive Rathke-type epithelium on which the diagnostic flag rests; for the other rows, none
    names the finding as the sources describe it. The diagnostic flag on the Rathke-type epithelium
    row rests on one of the five stated bases for the diagnosis in the report of the first described
    tumour (PMID:18551299), (a) the prominence of primitive Rathke-type epithelium, which is cited;
    the secretory cell row carries no diagnostic flag, because ACTH immunoreactivity is not among
    those bases, which name the lobular disposition, limited range and transcription factors of the
    secretory cells rather than a hormone. The diagnosis row is bound to NCIT DNA Methylation
    Analysis and cites the finding of a 2021 molecular study (PMID:33644822) that the tumour's
    methylation profile is distinct from about 3000 other central nervous system tumours, graded
    INDIRECT because that study compares profiles and does not report diagnostic use; the broader
    NCIT term is bound because the study names its method only as methylation profiling. A tumour of
    the 2012 report (case 3) that lacked a blastema and glandular component is recorded as REFUTE
    items, and the descriptions note that the genetics series, whose case 2 is the same tumour,
    reports the classic components in all its cases; the one ACTH-negative tumour of the outcome
    series is described in the row's description, while its n-of-N count sentence stays SUPPORT. A
    PRAME row was left out, because the cached PRAME result for this tumour comes from gene
    expression analysis, not microscopy, and is already recorded on the pathophysiology node. HMGA2
    is left out, because the only sentence found on it for this tumour is background in a study of
    other DICER1-related lesions. Folliculostellate cells get no row of their own: the cited sources
    list them among the components without describing them further, and the Rathke-type epithelium
    row's description mentions them. Validated with just validate, just validate-terms, just
    count-verified-snippets, just check-snippet-grading and the other whole-repo gates CI runs.

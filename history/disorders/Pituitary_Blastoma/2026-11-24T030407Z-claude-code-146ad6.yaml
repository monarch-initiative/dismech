  summary: 'Pituitary blastoma: the second DICER1 hit and the microRNA imbalance'
  details: >-
    Deepens the DICER1 part of the mechanism, with 15 new evidence items from sources the entry
    already cites. Somatic DICER1 Second Hit gains seven items and a rewritten description: in the
    genetics series (PMID:24839956) seven of nine tumour changes were predicted to hit the RNase
    IIIb catalytic site and two were losses of the wild-type allele, and in case 12 the authors
    infer that the loss, with the germline variant, would leave no normal DICER1; the genetics
    series concludes that a somatic RNase IIIb mutation appears to be a critical second hit; the
    outcome series (PMID:33236116) states in its introduction that in a minority of these tumours
    the second hit is loss of the wild-type allele (BACKGROUND); a 2014 case report (PMID:24823459)
    found the germline frameshift and a somatic E1813V change in one tumour; and the 2021 molecular
    study (PMID:33644822) found very few somatic alterations on whole-genome sequencing (INDIRECT
    for the transforming-event claim). The description also gives the outcome series' 13 of 14
    tumours with a DICER1 change (11 hotspot, 2 loss of heterozygosity), from an item the node
    already had. Germline DICER1 Loss-of-Function Variant gains four items and two sentences in its
    description: the case report's leukocyte sequencing of the frameshift variant; inheritance in 6
    of 8 children whose families were tested in the outcome series; DICER1-related conditions in
    relatives in 5 of those 6 families (INDIRECT); and the frameshift allele's share of DICER1
    transcripts, 12% in leukocytes and none in the tumour (INDIRECT). Its edge to the second hit
    gains the case report's conclusion that loss of function of both alleles appears crucial
    (INDIRECT) and a sentence saying so. The microRNA node's description now says the microRNAs come
    from both arms and the messenger RNA targets are numerous, and calls PRAME the most
    significantly upregulated gene, as the source does (its existing explanation is aligned); its
    edge to the tumour names the RAR, WNT and NOTCH pathways in its description and gains the PI3K
    activation inferred by the study's Cancer Hallmarks analysis (INDIRECT). The DICER1 gene record
    gains the genetics series' conclusion that its results suggest a germline variant is the major
    and possibly sole predisposing genetic factor, and a notes sentence on how the outcome series
    chose its cases; the inheritance block gains the genetics series' statement that penetrance
    appears to be well below 1%, and a clause in its description. Two further changes: the Cushing
    syndrome row's item quoting the outcome series on the seven children without Cushing signs is
    regraded from SUPPORT to REFUTE, since it is about children who lack the clinical finding, and
    its explanation is rewritten to say so; and the ACTH-immunoreactive secretory cells histology
    row and the Tumoral ACTH Secretion node now name each other. Validated with just
    validate-disorders, just validate, just validate-terms, just count-verified-snippets, just
    check-snippet-grading and the other whole-repo gates CI runs.

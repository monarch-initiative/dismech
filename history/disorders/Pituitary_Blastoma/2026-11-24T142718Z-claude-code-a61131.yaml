  summary: 'Pituitary blastoma: recorded gaps'
  details: |
    Adds a discussions section with three entries and fourteen evidence items from cached sources. A knowledge gap, pbl_no_model, asking whether a laboratory or animal model exists in which the DICER1 second hit and the microRNA defect can be tested: the entry's DICER1 second hit and microRNA steps rest on studies of affected children and their tumours, and the entry cites no model in which the second hit has been tested, and the first tumour reported in a dog (PMID:42177605, MODEL_ORGANISM, three items: the case, its histological resemblance to the human tumour, and that DICER1 was not tested) is a clinical veterinary case. A knowledge gap, pbl_no_standard_treatment, attached to the adjuvant chemotherapy and focal radiotherapy rows, on anti-tumour treatment after resection, with endocrine support left outside the question: the outcome series (PMID:33236116, three items) notes that the tumour's rarity and the small sample hamper robust analysis of therapy-related prognostic factors, although complete or near-complete resection may be adequate in some patients and extensive endocrinologic support is needed, and found adjuvant therapy, given to six children, not significantly associated with better survival; the genetics series (PMID:24839956) calls for communication between clinicians, neuropathologists and paediatric oncologists to help determine management (OTHER and INDIRECT, since the call concerns management as a whole; no quote_role as a recommendation). An open question, pbl_few_carriers, attached to the germline and second-hit nodes and the inheritance row, on why so few DICER1 carriers develop the tumour: the genetics series' statement that penetrance appears well below 1% (no quote_role, since it gives no data or citation) and its prediction of two DICER1 mutations with the hypothesis of a second hit in the embryonic pituitary (INDIRECT), the outcome series' introduction putting the penetrance below 1% (PMID:33236116, BACKGROUND), a study pooling two registries and a US National Cancer Institute cohort (207 carriers in all) that saw no pituitary blastoma, and whose introduction suggests the apparent requirement for a somatic mutation at one of five codons may explain in part the incomplete penetrance of DICER1 variants in general (PMID:30715996, the second INDIRECT and BACKGROUND), the outcome series' introduction that in a minority of these tumours the second hit is loss of the wild-type allele (BACKGROUND), and a review's statement that the site of the second hit determines where a DICER1 tumour arises (PMID:34599283, INDIRECT). It also makes the two changes #18852's review suggested, which that PR's place in the merge queue kept out of it: the inheritance block's item quoting the genetics series' penetrance sentence no longer carries quote_role PRIMARY_RESULT, since the sentence gives no data or citation, and the inheritance description states the penetrance once, as under 1%, which both cited sources support. Validated with just validate-disorders, just validate, just validate-terms, just count-verified-snippets, just check-snippet-grading, just check-entity-refs and the other whole-repo gates CI runs.

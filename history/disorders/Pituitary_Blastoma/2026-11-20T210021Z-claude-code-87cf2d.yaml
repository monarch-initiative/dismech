  summary: 'Create: Pituitary_Blastoma'
  details: |
    New entry for pituitary blastoma (MONDO:0858916), a rare embryonal tumour of the anterior
    pituitary in infants and a strong pointer to DICER1 syndrome. Curated by hand from cached
    sources: the 2021 multi-institutional outcome series of 17 children and the 2014 genetics
    series of 13 children (both full text), the first case report (2008), a three-case pathology
    series (2012), a molecular study of three tumours, case reports of a 19-year-old woman
    (2020) and an infant (2022), the DICER1 GeneReviews summary, a 2022 review of DICER1 tumour
    predisposition, the 2024 DICER1 surveillance update and reviews of the WHO classification.
    The pathophysiology is one chain: a germline DICER1 first hit, conforming to the germline
    two-hit tumour predisposition module; a somatic second hit in the tumour, marked as the
    origin node with no cell bound because no source establishes the cell of origin; defective
    processing of microRNA precursors; the tumour itself, with arrested pituitary development
    and uncontrolled proliferation; and from the tumour, ACTH secretion leading to Cushing
    syndrome, and the sellar mass leading to cranial nerve palsy, reduced visual acuity and
    raised intracranial pressure (those three edges indirect). Seven phenotype rows carry the
    presenting features with frequency bands from the 17-child series; diabetes insipidus,
    secondary hypothyroidism and developmental delay are not linked to a mechanism because no
    cited source says how the tumour produces them. Where the two series report the same
    children differently the entry follows the later one, so ACTH immunostaining is given as 16
    of 17 tumours. Diagnosis rows cover plasma ACTH, DICER1 testing of the child and the tumour,
    surveillance of carriers for CNS tumours, MRI and histopathology; the treatment rows,
    resection, adjuvant chemotherapy and focal radiotherapy, are linked to the tumour node, and
    a fourth covers genetic counselling of the family. One outcome phase and one
    cases-in-literature row graded ultra-rare (17 well-investigated cases in 2021; 21 counted in
    a 2022 report) complete it. The DICER1 GeneReviews summary is tagged in references; the full
    chapter page could not be fetched. The deep-research report generated for this entry is
    committed as a lead. Validated with just validate, count-verified-snippets (83 of 83) and
    the pre-PR gates.

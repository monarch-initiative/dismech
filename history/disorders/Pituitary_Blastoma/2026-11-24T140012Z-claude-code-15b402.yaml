  summary: 'Pituitary blastoma: imaging, classification and NCIT mapping'
  details: >-
    Adds the tumour's imaging, classification and NCIT mapping, with ten new evidence items from
    sources the entry already cites. A new imaging_findings section has two rows, each located in
    UBERON:0003689 sella turcica. Enhancing sellar mass is bound to HP:0011750 Neoplasm of the
    anterior pituitary, the lobe coming from the outcome series' description of the tumour in
    infants, and has six items in this order: the outcome series' summary of the MRI appearance
    (PMID:33236116), the first described tumour (PMID:18551299), one tumour of the 2012 report
    (PMID:21805093, INDIRECT: a suprasellar mass with no enhancement stated), the outcome series'
    background description of the mass and its extent, its introduction calling the tumour an
    anterior hypophyseal tumour of infants (both background sentences INDIRECT, since they give
    the site rather than imaging), and a case report's recommendation to consider the tumour in
    children with an enhanced sellar and suprasellar mass with peripheral cysts (PMID:32339726,
    INDIRECT, no quote_role as a recommendation). Sellar and suprasellar mass in young adults is
    bound to HP:0040277 Neoplasm of the pituitary gland, since neither young-adult abstract names
    the lobe, and has two items, from the case reports of a 27-year-old man (PMID:40451220, his MRI
    and its radiological differential diagnoses) and a
    19-year-old woman (PMID:32339726, INDIRECT for the MRI modality, which her abstract does not
    name). The notes give the HPO searches, why HPO's own term for the disease is not used, and
    that MRI is named in only one of the two young-adult abstracts. A new classifications block
    records Harrison's oncology and endocrinology parts and the ICD-O morphology value Embryonal
    Neoplasm, the latter supported by the 2012 report's conclusion that the tumour aligns with blastomas of
    other organs (INDIRECT) and a case report's background statement that it is an embryonal
    tumour. A new mappings block maps NCIT:C155304 Pituitary Gland Blastoma as an exact match,
    since MONDO:0858916 cross-references it and maps it with skos:exactMatch. The term caches gain
    the three new terms. Validated with just validate-disorders, just validate, just
    validate-terms, just count-verified-snippets, just check-snippet-grading and the other
    whole-repo gates CI runs.

  summary: 'Pituitary blastoma: resection, adjuvant treatment, survival and late effects'
  details: >-
    Adds depth on treatment and outcome, with 32 new evidence items from sources the entry already
    cites. Surgical resection gains five items: of the seven children of the outcome series
    (PMID:33236116) treated by surgery alone who lived beyond six weeks, five became long-term
    survivors; the authors judge that complete or near-complete resection may be enough for some
    patients, with their caveat that small numbers hamper robust analysis; the abstract of the 2012
    report (PMID:21805093) calls its three additional cases (one previously published as a pituitary
    adenoma) subtotally resected; and two adult case reports describe subtotal resection in a
    19-year-old woman whose pathology suggested a pituitary blastoma (PMID:32339726) and
    decompression, graded INDIRECT for resection, in a 27-year-old man (PMID:40451220). Adjuvant
    chemotherapy gains eight items: six children had adjuvant therapy of some kind; five rows of the
    outcome series' Table 1 give the regimens of the five children given chemotherapy after surgery
    (temozolomide in two, two named infant protocols, and a five-drug combination); the 2012
    report's suggestion, from MGMT staining, of an incomplete temozolomide response, recorded as an
    inference from staining; and chemotherapy with radiotherapy in the 19-year-old woman. No
    therapeutic agent is bound, because the agents differ from child to child; the row's notes say
    so and record one child's local progression after temozolomide without a causal reading. Focal
    radiotherapy gains four items: the doses (Gamma Knife, 45 Gy; conformal radiation, 54 Gy, with
    the age at treatment), the moyamoya disease that needed revascularisation 9.3 years after Gamma
    Knife, and the 19-year-old woman's radiotherapy, graded INDIRECT for this row because the
    abstract does not say what kind it was; the row's notes gain one sentence saying so, and their
    existing sentence is re-wrapped. The Outcome phase gains two items and one sentence in its
    description (the existing text re-wrapped): a child's fatal tumour, which imaging took for a
    recurrence, was found at autopsy to be a primitive neuroectodermal tumour, which the authors
    interpret as probably a pineoblastoma, and the genetics series (PMID:24839956) recorded five of
    its 13 infants as dead of disease, counting among them three deaths the outcome series
    attributes to early complications; the explanation matches each of the five to the outcome
    series' cause and records that the two series date one of them (case 6) very differently. The
    three treatment rows' descriptions are extended and partly rewritten to match, and Adjuvant
    chemotherapy gains a notes field. Two phases are new, placed before the Outcome phase: Early
    postoperative period (three items, a duration of up to six weeks after surgery, and notes naming
    the four early deaths by case and giving the genetics series' later date for case 6: four of the
    eight deaths within six weeks of surgery, three of the early deaths in infants with Cushing
    disease, and an adult who died within a month of surgery after an aggressive tumour course), and
    Long-term survivorship (ten items: survival and disease status, the pituitary deficiencies by
    axis, visual and neurodevelopmental outcomes, growth hormone replacement, which in several
    children the authors found not associated with recurrence or other neoplasms, untreated short
    stature in one survivor, a second DICER1-related condition, and the series' conclusion on
    neuroendocrine management; its notes record that the survivor with the second DICER1 condition
    had growth hormone deficiency and that the genetics series reports recurrences in three of four
    highly proliferative tumours, where the outcome series' table records progression in one). Table
    rows are quoted as rows, and each explanation reads out the columns it relies on. None of the 14
    sources the entry cites names, in its cached text, metyrapone, ketoconazole, osilodrostat,
    mitotane, etomidate, pasireotide or mifepristone, so no row for drug control of the cortisol is
    added (three of the five sources this change cites are cached as abstracts only). Every item is
    SUPPORT; two are INDIRECT, as above. Validated with just validate, just validate-terms, just
    count-verified-snippets, just check-snippet-grading and the other whole-repo gates CI runs.

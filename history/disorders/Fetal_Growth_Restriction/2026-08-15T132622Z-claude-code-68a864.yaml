  summary: 'Address review: split bundled malperfusion node; add early/late FGR subtypes'
  details: |
    PR Shepherd fix commit responding to ai4c-reviewer's two blocking findings on PR #8520.

    IMPORTANT 1 - bundled pathophysiology node. Split "Uteroplacental Malperfusion and Placental Cell Stress", which conjoined a TISSUE-scale perfusion failure with a CELLULAR stress response under a single `biological_scale: CELLULAR` tag, into "Uteroplacental Malperfusion" [TISSUE] -> "Placental Cell Stress Response" [CELLULAR]. The syncytiotrophoblast CL descriptor, all three GO process descriptors, the three outgoing edges and the node-level infarction/fibrin evidence stay on the stress node; the upstream edge from "Deficient Uterine Spiral Artery Remodeling" now targets the malperfusion node. Both new edges carry their own evidence from PMID:29422210, quoting the source's own cause-then-effect ordering.

    IMPORTANT 2 - early- vs late-onset FGR not modeled. Added `has_subtypes` entries "Early FGR" and "Late FGR", each with its own evidence. Early FGR cites PMID:32965939 for the severity/preeclampsia/detectability contrast and PMID:26909664 for the under-32-week boundary and absent umbilical artery end-diastolic flow as a solitary criterion; Late FGR cites PMID:26909664 for the 32-weeks-and-over boundary with its cerebroplacental-ratio and UA-PI contributory parameters, and PMID:32965939 for the parameters differing by the split. No new references were fetched - all four snippets come from cache files already committed in this PR.

    Existing phenotypes were deliberately NOT retagged with `subtype:` values. That would assert a phenotype-subtype exclusivity beyond what the cited sources state, so it was left to the curator.

    Validation: `just validate` PASS covering schema, terms and references; "Snippets checked: 70/70 verified against cached references", up from 64/64; `just check-title-snippets` OK; the FGR/subtype/conformance selection of tests/test_data.py 8112 passed. The one failing test in the full suite - Urticaria.yaml bare PMC URLs - is pre-existing branch staleness already fixed on main in 1bdd021eb4 and is unrelated to this change.

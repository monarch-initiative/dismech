  summary: 'Create: Fetal Growth Restriction (MONDO:0005030)'
  details: |
    New Disease entry for fetal growth restriction (MONDO:0005030), curated against issue #7837 (obstetrics coverage gap). Ten-node pathograph, single-rooted at deficient uterine spiral artery remodeling and running from there through uteroplacental malperfusion and placental cell stress, loss of villous exchange surface, impaired system A amino acid transport, chronic fetal hypoxemia, brain-sparing redistribution, stem villous arterial smooth muscle dedifferentiation and umbilical artery Doppler deterioration, to failure of growth potential and fetal metabolic acidosis.

    Deliberate modelling decisions: (1) the initiating node is shared with Preeclampsia and Placental_Abruption, and the entry is explicit that FGR is the fetal-compartment expression of the same ischaemic placental lesion, whereas preeclampsia is its maternal-compartment expression; (2) the Shibata system A amino acid transport result is curated with its negative half intact - transport was NOT reduced when growth restriction coexisted with preeclampsia - and that dissociation is recorded as its own KNOWLEDGE_GAP rather than smoothed over; (3) the stem villous smooth muscle edge is typed DIRECT but its evidence is marked PARTIAL, and a KNOWLEDGE_GAP records that the source claims correlation only and calls the change secondary; (4) maternal sildenafil is curated as a treatment carrying REFUTE evidence from STRIDER and NO target_mechanisms block, because TreatmentEffectEnum offers only INHIBITS/ACTIVATES/MODULATES/BYPASSES/RESTORES and any of them would assert an effect the drug does not have, leaving a false pathograph edge for consumers reading edges without evidence; (5) the Stillbirth phenotype is left unbound because HP:0003826 sits under Clinical modifier/Clinical course rather than the PhenotypeTerm enum root HP:0000118, verified with runoak ancestors - the fourth KB entry to hit this documented gap.

    No module conformance is claimed. Conformance to fibrotic_response was considered and rejected: the placental lesion is hypoplasia and infarction with fibrin deposition, not myofibroblast-driven excessive ECM deposition, and fibrin deposition is not fibrosis.

    Ten references (PMID:29422210, 26909664, 33972065, 32965939, 33085318, 30169244, 25747582, 27223167, 18718657, 16612114), every one fetched with just fetch-reference before any snippet was written. No deep-research provider report was generated or used for this entry, so the DR/NEC preflight does not apply; references came from direct PubMed E-utilities searches.

    Validation actually run and read: just validate (schema + term + reference validation) passed, reporting 'Snippets checked: 64/64 verified against cached references'; just check-title-snippets reported no new title-quoting snippets; just check-term-cache-integrity reported all 18 term cache and 24 enum cache files matching the structural contract.

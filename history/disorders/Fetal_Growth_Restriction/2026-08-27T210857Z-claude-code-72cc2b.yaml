  summary: Add micro- and nanoplastic exposure to Fetal Growth Restriction
  details: |
    Added the entry's first environmental block, binding placental micro- and nanoplastic exposure to ECTO:7000061. Two pathograph edges: a human cross-sectional case-control association drawn to the growth-failure node (PMID:36113646, graded PARTIAL, with the reverse-causation caveat stated in the edge description), and a rodent mechanistic edge into Placental Cell Stress Response naming NAM/NAD+ depletion, ATP loss and ferroptosis with a nicotinamide rescue arm (PMID:40796882, MODEL_ORGANISM). Entry-level evidence establishes only that the exposure reaches the maternal-fetal interface (PMID:38366932, PMID:33395930). Added a HUMAN_MODEL_MISMATCH discussion recording the dose, route and polymer gap between the rodent gavage protocol and measured human placental burden, with a proposed experiment. Validated with validate, validate-terms, count-verified-snippets and the batched validate-disorders; all snippets verified against the reference cache.

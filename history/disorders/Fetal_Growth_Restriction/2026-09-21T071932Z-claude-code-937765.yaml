  summary: 'Review round: record the two partial conformances to deep_placentation_defect'
  details: |
    Review round on PR #12383, taking two of the reviewer's non-blocking suggestions.

    Uteroplacental Malperfusion. The node conforms to deep_placentation_defect#High-Momentum, Intermittent Uteroplacental Perfusion, whose description contrasts repeated ischaemia-reperfusion with steady hypoxia and says the distinction matters because the two give different downstream cell-death phenotypes. This node's description said the intervillous space is perfused 'at a fixed, inadequate rate', which reads as the opposite dynamics. The cited sources (PMID:29422210, PMID:33085318) describe the deficit only as inadequate or deficient perfusion and do not resolve its time course in FGR, so 'fixed' asserted more than they say. The description now states the inadequacy without a time-course claim, and a note records that the momentum and intermittency claims belong to the module rather than to this entry. The conformance is kept: the perfusion failure downstream of unconverted spiral arteries is the right target.

    Placental Cell Stress Response. The node conforms to deep_placentation_defect#Syncytiotrophoblast Oxidative Stress and Apoptosis but carries no apoptosis process, which the reviewer asked to either bind or explain. GO:0006915 is deliberately not added: PMID:29422210 describes a selective shutdown - suppressed protein synthesis and reduced proliferation, producing a small hypoplastic placenta rather than a necrotic one - and does not report increased apoptosis, so the binding would assert a measurement this entry cannot cite. A note records the partial conformance and which half of the module node is shared.

  summary: 'Create: Microcephaly_Facial_Dysmorphism_Renal_Agenesis_And_Ambiguous_Genitalia_Syndrome'
  details: |
    New entry for CTU2-related DREAM-PL syndrome (MONDO:0020647). Four-node pathograph: biallelic CTU2 loss of function (GO:0103016 at CTU1-CTU2 complex level) -> loss of cytosolic tRNA wobble uridine 2-thiolation (measured in patient cells) -> impaired decoding (PROVISIONAL, yeast/nematode evidence) -> disrupted organogenesis (HYPOTHETICAL), wired to nine malformation phenotypes. Phenotype frequency bands are a tally of Table 2 (15 individuals) in PMID:42515929. 39 evidence items, all snippets verified against cached abstracts/full text; schema, term, entity-ref, causal-target, duplicate-key and block-scalar checks pass. No GeneReviews chapter or Orphanet record exists. PMID:38348206 genotype statement is internally inconsistent and used only for clinical description.

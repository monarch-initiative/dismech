  summary: 'Review round 1: add missing phenotypes, split bundled nodes'
  details: |
    Addressed the automated review on PR 15879. Added phenotypes from the 15-patient series (PMID:26067811) that were missing: dysmorphic facial features (7/15, HP:0001999) and congenital heart defects (3/15, HP:0001627), both declared coarse_binding_basis SOURCE_UNSPECIFIED because the source names no specific feature or defect; sensorineural and conductive hearing loss (1/15 each); and skeletal muscle atrophy (HP:0003202, PMID:21665002 and PMID:27123443), wired from Myofiber Degeneration and Necrosis with edge evidence from the Chkb knockout gene therapy paper (PMID:42292914). Congenital heart defects are left unwired, since they are structural and not a consequence of the cardiac mitochondrial lesion. Split two bundled nodes: Mitochondrial Membrane Phosphatidylcholine Deficiency now leads to Mitochondrial Respiratory Chain Dysfunction (edge cited to the hypotheses in PMID:26855408 and PMID:30986505, marked INDIRECT), and the PMID:35322809 REFUTE (no change in muscle PC) moved from the PC synthesis node to the edge from PC synthesis into the membrane PC node, which is the claim it questions. The cardiac node became Cardiac Mitochondrial Dysfunction (leading to dilated cardiomyopathy) and Cardiac Conduction System Abnormality (leading to arrhythmia), both reached from CHKB loss with PMID:35151687 evidence. Added evidence to the three previously unevidenced edges (respiratory chain defects phenotype, dilated cardiomyopathy, integrin to degeneration). Moved the PMID:26548592 MRI quote into a new Muscle MRI diagnosis row. Replaced the PMID:25187204 item on Rhabdomyolysis with PMID:26782016 and moved the illness-triggered weakness quote to Proximal muscle weakness. Added GeneReviews sentences for recurrence risk, seizures and ichthyosis, the lymphocyte giant-mitochondria option (PMID:36896673) on the biopsy row, and removed quote_role from PMID:22024749. Validation: validate-disorders passed with 118 of 118 snippets verified; per-file and repository-wide checks pass.

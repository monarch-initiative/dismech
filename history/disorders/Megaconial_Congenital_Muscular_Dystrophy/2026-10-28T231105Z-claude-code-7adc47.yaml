  summary: 'Create: Megaconial_Congenital_Muscular_Dystrophy'
  details: |
    New entry for megaconial congenital muscular dystrophy (MONDO:0011246), caused by biallelic CHKB (hgnc:1938) loss of function. Phenotype baseline is the GeneReviews chapter CHKB-Related Muscular Dystrophy (PMID:37011121, tagged), which splits the disease into a congenital presentation (44 of 47 reported) and an adolescent-onset limb-girdle presentation (3 of 47); these are recorded as has_subtypes CMD and LGMD rather than separate entries, because MONDO has a single term and both share the gene and the megaconial biopsy (PMID:26782016). Clinical frequencies come from the 15-patient series (PMID:26067811) and GeneReviews. The pathograph runs CHKB loss, impaired de novo phosphatidylcholine synthesis, mitochondrial membrane and respiratory dysfunction, increased mitophagy, and megaconial redistribution (founding and rmd mouse papers PMID:21665002, PMID:21750112, PMID:19236939), with reduced mitochondrial fission from patient muscle cells (PMID:34518586, PMID:36175989). It also carries the later Chkb knockout findings of impaired fatty acid beta-oxidation (PMID:35322809) and alpha7beta1 integrin failure (PMID:38749543). PMID:35322809 reports no significant change in phosphatidylcholine mass at any disease stage; this is recorded as a REFUTE item on the PC synthesis node and as a KNOWLEDGE_GAP discussion. Cardiac and brain branches are wired from patient heart pathology, the Chkb mouse cardiac study and brain MRS. Behavioural phenotypes, seizures, microcephaly and ichthyosis have no studied mechanism and are left unwired, with a second KNOWLEDGE_GAP discussion. The rmd mouse is linked with RECAPITULATES, PARTIALLY_RECAPITULATES and RESCUES (AAV gene therapy, PMID:31216357 and PMID:42292914). Treatments are limited to what patients received: supportive care, physical therapy, heart transplantation, cardiac resynchronization (one case, no outcome reported) and ustekinumab for skin (one case). Differentials: CHKA-related NEDMIMS, atypical Rett syndrome, and the dystrophinopathy, dystroglycanopathy and myotonic dystrophy differential. The OpenScientist report (research/Megaconial_Congenital_Muscular_Dystrophy-deep-research-openscientist.md) was used as a lead list. Its reference validation shows 25 of 25 resolved, 9 of 9 quotes valid and no off-topic references. Its term validation needs_review flag comes from 9 mislabelled terms, all table-column values such as Static or Progressive parsed as labels; none is a wrong binding. The report is about CHKB throughout. just preflight-dr exited 2 because the local mondo.db is absent, so the entity check was done by reading. All PMIDs were fetched with just fetch-reference. Validation: just validate-disorders passed, 94 of 94 snippets verified, and validate-terms, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-genereviews and the repository-wide snippet gates passed.

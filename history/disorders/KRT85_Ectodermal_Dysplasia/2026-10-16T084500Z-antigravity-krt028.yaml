  summary: Enhance KRT85_Ectodermal_Dysplasia with full clinical/mechanistic coverage and 100% gene/phenotype
    connectivity
  details: 'Added top-level synonyms (ECTD4, pure hair and nail ectodermal dysplasia, PHNED, ectodermal
    dysplasia of hair and nail type), classifications (DERMATOLOGY, GENETICS_ENVIRONMENT_DISEASE, intermediate
    filament disease), top-level inheritance, prevalence (ULTRA_RARE cited to PMID:33605551), progression,
    diagnosis, differential_diagnoses (ECTD9/HOXC13, ECTD7/KRT74, Monilethrix), references, and notes;
    removed empty trailing datasets key. Introduced a tissue-neutral MOLECULAR root node (KRT85 Loss of
    Function) feeding parallel CELLULAR nodes for hair follicle (Hair Keratin Intermediate Filament Disruption)
    and nail matrix (Nail Matrix Keratin Deficiency) without a cross-appendage edge. Bound Hypotrichosis
    to HP:0008070 (Sparse hair, active replacement for obsolete HP:0001006), replaced non-KRT85 ECTD9/ECTD7
    snippets with KRT85-specific full-text evidence from PMID:33605551 (with quote_role: BACKGROUND where
    appropriate), and moved the uncached Amico 2019 compound heterozygous variant into genetic notes.

    '

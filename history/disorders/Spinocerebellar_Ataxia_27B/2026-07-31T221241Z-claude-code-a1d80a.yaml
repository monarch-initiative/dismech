  summary: Rebase on main; add MRI imaging findings, vestibular hypofunction phenotype,
    and the RFC1-CANVAS differential
  details: |
    Follow-up session on PR 7380. The first claude-review run completed with conclusion success but never posted a verdict — its progress checklist stalled on the content-completeness pass with 8 of 9 items ticked and get_reviews returned empty — so the PR sat green but unreviewed. Re-triggering required a new commit, and this session used that requirement to close two gaps the original PR body had explicitly flagged as omissions rather than pushing an empty commit. First, an imaging_findings block was added: the AJHG discovery paper PMID:36493768 is cached as full text and states that MRI revealed cerebellar atrophy in five of thirteen expansion carriers, which supports HP:0001272 Cerebellar atrophy at a FREQUENT band, records the MRI modality and UBERON:0002037 cerebellum site, and — clinically the more useful point — documents that a normal MRI does not exclude the diagnosis, since most carriers in that cohort had no visible atrophy despite a mean 8.5 years of symptoms. The earlier top-level note claiming no abstract supported the atrophy pattern was removed as now false. Second, a Vestibular hypofunction phenotype was added, bound to HP:0001751 Abnormal vestibular function, at a FREQUENT band supported by the same paper reporting vestibular hypofunction on video head impulse testing in six of ten assessed patients, corroborated by the GeneReviews statement that unilateral or bilateral vestibular hypofunction may occur. This was previously mentioned only in prose on the vertigo phenotype. The branch was also rebased from 0729e8e5b onto current origin/main 205c9009f with no conflicts; the diff against origin/main remains exactly twelve added files with no unrelated churn. Revalidated with just validate covering schema, terms and references: all pass, with 83 of 83 snippets verified against cached references, up from 79. Third, an RFC1-CANVAS differential diagnosis was added, bound to MONDO:0044720 and matching the identity of the existing kb/disorders/CANVAS.yaml entry. This was a self-identified gap rather than a reviewer finding: CANVAS is the closest clinical mimic of SCA27B and the most important practical differential, since both are late-onset ataxias combining cerebellar signs with vestibular hypofunction and afferent sensory deficits, and adding the vestibular phenotype in this same session made its absence conspicuous. The two are separated by genotype rather than phenotype — recessive biallelic RFC1 AAGGG expansion versus dominant heterozygous FGF14 GAA expansion — and the discovery paper explicitly frames FGF14 as the alternative genetic cause in RFC1-negative CANVAS-like patients, which is the actionable clinical point now recorded. Note that the supporting snippet is quoted as an exact substring of a PDF-extracted full text in which italic runs lost their spacing, so it deliberately stops short of the mangled trailing tokens. Revalidated after all three additions: schema, terms and references all pass, with 84 of 84 snippets verified against cached references, up from 79 at the original commit. No new PMIDs were fetched — all three additions quote a paper already cited and cached in the original commit.

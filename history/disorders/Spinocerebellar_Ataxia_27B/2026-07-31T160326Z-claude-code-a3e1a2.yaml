  summary: 'Create: Spinocerebellar ataxia 27B, GAA-FGF14 ataxia'
  details: |
    De novo curation of SCA27B, MONDO:0859340 — the intronic FGF14 GAA repeat-expansion late-onset ataxia. NEC preflight was run against the OLS MONDO record — label 'spinocerebellar ataxia 27B, late-onset', OMIM:620174, MalaCards xref gaa_fgf14_related_ataxia — to confirm the entity is the GAA-repeat disease and NOT SCA27A, MONDO:0008654 / OMIM:609307, which is caused by FGF14 coding variants with childhood onset. SCA27A is curated only as a differential diagnosis so its literature cannot contaminate this entry. A six-node causal chain was curated: intronic GAA expansion, reduced FGF14 expression giving haploinsufficiency, impaired Purkinje intrinsic excitability via Nav1.6-dependent firing failure, Purkinje neuron degeneration, loss of cerebellar cortical output, and progressive late-onset ataxia. Four nodes declare conforms_to cerebellar_purkinje_degeneration; the module's calcium-and-proteostasis amplifier node is deliberately NOT claimed, because the SCA27B amplifier is sodium-channel gating failure rather than calcium dysregulation or proteotoxicity — this is recorded in a node-level note. Genetics cover the competing pathogenic thresholds of 250, 300, 335 and 180-200 repeats, the inverse repeat-length/age-at-onset correlation, parent-of-origin repeat instability, and the pure-GAA versus GAAGGA/AAGGAG motif-purity distinction, curated as two separate Variant records. 4-aminopyridine is curated with therapeutic_modality SMALL_MOLECULE, CHEBI:34385 therapeutic_agent, and a target_mechanisms RESTORES edge onto the excitability node. Three discussions record genuinely unsettled questions — pathogenic threshold and penetrance, the intron-to-silencing molecular route, and functional versus degenerative deficit — each with structured proposed_experiments. Validated with just validate covering schema, terms and references: all pass, with 79 of 79 snippets verified against cached references. Treatment and diagnosis terms use NCIT C15747, C15302 and C15240 following the MAXO removal on main in PR 7228. All 11 cited PMIDs were fetched via just fetch-reference; no cache file was hand-written.

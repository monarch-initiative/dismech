  summary: 'Gene-family review: TUSC3; give it its own OST-subunit node'
  details: |
    TUSC3 sat on the shared tissue-level node Impaired Cortical Circuit Formation and Connectivity, whose molecular functions belong to other genes (ligase-substrate adaptor, small GTPase binding, signaling receptor activity), so the KB stated no TUSC3 activity. It now sits on a new node, TUSC3 Oligosaccharyltransferase Subunit Loss, binding disulfide oxidoreductase activity (GO:0015036; TUSC3/N33 has an ER-lumenal thioredoxin domain forming mixed disulfides with OST substrates, PMID:24685145) and the OST glycotransferase activity it contributes to (GO:0004579), both decreased, with protein N-linked glycosylation decreased for a subset of substrates. The node records two caveats with evidence: bulk N-glycosylation was normal in the first patients' fibroblasts (PMID:18455129), and a 2025 study reports that TUSC3 forms an ER Mg2+ transport complex with ERMA whose loss causes ER Mg2+ depletion and ER stress (PMID:41203647). It links to the cortical node, with Tusc3-deletion mice showing reduced cortical area (PMID:42627037). The lesion-class record 'Homozygous copy-number variants' bound TUSC3 although its note says it is not a gene; the binding was removed so TUSC3 is no longer counted as causative twice. The MRT7 TUSC3 record stays CAUSATIVE; ClinGen's Definitive TUSC3 assertion is for intellectual disability broadly (MONDO:0001071), not this entry's or the MRT7 subtype's term, so it is not copied.

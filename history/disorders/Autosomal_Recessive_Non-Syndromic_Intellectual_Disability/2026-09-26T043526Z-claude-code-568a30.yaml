  details: |
    Review round 1 on PR #12881. One blocking finding and three suggestions, all
    addressed in a single push.

    Blocking: the rule for declining a checklist row did not match the rows kept.
    The reviewer showed that three subtypes retained in the first commit meet the
    same test used to decline four others - RSRC1 (whose founding report calls it a
    recessive SYNDROME with mild facial dysmorphism), METTL5 (microcephaly and
    various facial dysmorphisms) and RUSC2 (absence of the splenium, a callosal
    malformation, in two of three patients). Resolved by option (a): the criterion
    is now stated rather than implied, as notes item 13, and each of the four
    declined rows carries a distinguishing_features line naming which limb of it
    that row fails.

    The stated criterion. The entry's own Syndromic Intellectual Disability
    differential already names the two disqualifiers - a recognisable neuroimaging
    MALFORMATION as opposed to subtle volume or connectivity change, and a
    consistent extra-neural GESTALT. Item 13 applies them: a gene is a subtype when
    the features reported outside cognition are mild, variable or incompletely
    penetrant; a gene goes to differential_diagnoses when either (i) a disqualifying
    feature is obligate across the reported cohort and is what the entity is
    recognised by, or (ii) the gene's mechanism is already modelled by another
    dismech entry. Three consequences are stated because they are what the criterion
    turns on: microcephaly is not a disqualifier, because this entry's own
    Secondary (Postnatal) Microcephaly node carries the TRAPPC9 finding that it is
    present in some but not all affected individuals and does not by itself
    reclassify a case as syndromic; hypotonia, epilepsy and behavioural features are
    non-localising neurological findings rather than a malformation or a gestalt,
    which is why NDST1, MBOAT7 and KICS2 stay; and being NAMED as a syndrome is not
    the criterion, because MRT15's own MONDO label is Rafiq syndrome
    (MONDO:0013624, verified as a direct child of MONDO:0019502) and it has been
    curated here as a subtype throughout.

    RUSC2 is the closest call and its row now says so explicitly rather than
    implying the criterion settles it: absence of the splenium is a callosal
    malformation and would disqualify the row if it were obligate, but the founding
    report puts it in two of the three patients, so the row is retained on that
    non-obligate reading and a larger series showing it in every case should move
    it.

    A pre-existing factual error surfaced while writing item 13, because item 13
    cites MRT15 as the precedent for the criterion and so depends on its family
    count. The MRT15 description said one family showed additional clinical features
    "while three others were strictly non-syndromic". Its own evidence snippet, and
    the cached abstract of PMID:21763484, say "four consanguineous families affected
    by nonsyndromic autosomal-recessive intellectual disability (NS-ARID) and one in
    which the patients show additional clinical features" - four plus one, not three
    plus one. Corrected to match the cache. This was not introduced by this pass; it
    is fixed here rather than deferred because leaving a miscount next to the row
    being cited as precedent would undercut the criterion that cites it.

    Suggestion 1 taken. Three evidence items graded evidence_source OTHER with
    quote_role BACKGROUND were regraded from their quoted text, per CLAUDE.md: the
    FBXO31 neuronal-morphogenesis and cerebellar-migration sentence
    (PMID:24623383) to MODEL_ORGANISM, and the IMPA1 (PMID:26416544) and ALKBH8
    (PMID:34757492) enzyme-function sentences to IN_VITRO. quote_role BACKGROUND is
    retained on all three. Each of the affected sentences was first confirmed to
    occur exactly once in this file and nowhere else in kb/, because
    check-snippet-grading keys on sentences rather than on whole snippets.

    Suggestion 2 taken, by the conservative route. TECR was moved off the synaptic
    node to the molecular-function node. The placement had rested on a single
    descriptive phrase in the founding report, "a synaptic glycoprotein", which is
    TECR's historical SC2 description. The phrase is still quoted, but the MRT14
    description and the TECR genetic notes now record that it is not used for
    pathograph placement, that HGNC names hgnc:4551 trans-2,3-enoyl-CoA reductase,
    and that a reader should not take synaptic localisation as the mechanism of this
    subtype. No fatty-acid-elongation function is asserted in prose, because no
    cache read for this entry establishes it.

    Suggestion 3 taken. Two session-narration passages were removed from notes:
    item 1's account of a later genetics pass adding subtypes, and item 6's account
    of TECR having been omitted and since retrieved. The durable facts are kept -
    that the curated set spans MRT1 to MRT83, and that ST3GAL3 (MRT12) is omitted
    for want of a citable primary report. Both narratives are carried by the
    history record instead.

    The MONDO claim, narrowed. The first commit reported three syndromic entities
    filed under a class whose own definition is "Autosomal recessive form of
    non-syndromic intellectual disability". Applied consistently, that argument also
    condemns rows this pass keeps, so it is not a claim about three misplaced terms.
    What survives independently of any curation judgement is one term:
    MONDO:0030785, whose own label reads "intellectual developmental disorder,
    autosomal recessive 75, with neuropsychiatric features and variant
    lissencephaly" while its only asserted parent is MONDO:0019502. A label naming a
    lissencephaly variant under a parent defined by non-syndromicity contradicts
    itself in MONDO's own terms, wherever anyone else draws the boundary. The
    broader and probably more useful finding is that this class does not enforce its
    definition anywhere: MONDO:0013624 Rafiq syndrome is a direct child, and none of
    the four declined terms carries a MONDO definition recording a split rationale,
    so there is no upstream reasoning to read against. Nothing has been filed
    upstream.

    Validation after this round, under linkml-reference-validator 0.3.0rc2 installed
    by plain `uv sync` as CI does (not --frozen; main's uv.lock pins rc1, which CI
    does not use): just validate-disorders 0 issues over 265 snippets and 273
    titles; just validate-terms passed; just count-verified-snippets 265/265; just
    check-snippet-grading OK with no new divergences after the three regrades; plus
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-enum-values, check-qualifier-terms, check-coarse-phenotypes,
    check-title-snippets, check-snippet-length, check-folded-hyphens,
    check-case-collisions, check-reference-titles, check-genereviews,
    check-term-cache-integrity and compliance-connectivity. No baseline was touched.
    references_cache churn from the validators was reverted before staging, since
    dismech#12672 is not fixed in rc2, and snippets were re-counted afterwards.

    Two scripted edits in this round failed and were caught by parsing the result
    rather than by an exit status, which is the failure mode CLAUDE.md warns about.
    A malformed regex aborted the regrade script before its write, and the
    verification step showed all three items still graded OTHER. Four
    distinguishing_features lines written as plain list scalars containing ": "
    parsed as mappings instead of strings; they were requoted and re-verified as
    strings.

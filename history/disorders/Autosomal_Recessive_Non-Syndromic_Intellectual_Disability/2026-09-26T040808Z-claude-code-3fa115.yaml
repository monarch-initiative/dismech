  summary: 'Genetics pass: 21 gene-defined MRT subtypes curated and wired'
  details: |
    Genetics pass for the d2g series-012 gap list (issue #12219, 25 diseases).

    Anchor check first. The parent disease_term is MONDO:0019502 "autosomal
    recessive non-syndromic intellectual disability", read from ols:mondo, and the
    entry is named and written as that whole class. Every one of the 25 checklist
    terms is a direct rdfs:subClassOf child of MONDO:0019502 in the local MONDO
    build. So this is not the dismech#12184 over-broad-anchor pattern that three
    recent issues in this series turned out to be, and the anchor was left alone.

    Curated 21 gene-defined MRT subtypes. Each new has_subtypes row carries a
    bound subtype_term, an HGNC-bound genes list, and one or more evidence items
    quoting the gene's founding report; each has a reciprocal genetic[] record
    with relationship_type CAUSATIVE, variant_origin GERMLINE, a subtype foreign
    key, and its own evidence. MRT14 TECR, MRT42 PGAP1, MRT45 FBXO31, MRT46
    NDST1, MRT47 FMN2, MRT50 EDC3, MRT51 HNMT, MRT54 TNIK, MRT56 ZC3H14, MRT58
    ELP2, MRT59 IMPA1, MRT60 TAF13, MRT61 RUSC2, MRT64 LINGO1, MRT66 FERRY3,
    MRT69 ZBTB11, MRT70 RSRC1, MRT71 ALKBH8, MRT72 METTL5, MRT82 NSUN6, MRT83
    KICS2.

    Pathograph wiring. All 21 genes were added as genes descriptors on an existing
    pathophysiology node, placed by what the gene's own founding report states:
    the synaptic-transmission node took TECR (its report calls the product a
    synaptic glycoprotein), FMN2 (dendritic spine density), HNMT (termination of
    histaminergic neurotransmission) and TNIK (dendrite development and synaptic
    transmission); the cortical-circuit node took FBXO31 (neuronal morphogenesis,
    axonal identity, dendrite growth, neuronal migration), RUSC2 (intracellular
    protein trafficking) and LINGO1 (neuronal development and CNS myelination);
    the remaining 14 went on the molecular-function node, whose own claim is the
    loss of a gene-specific function with no pathway convergence asserted. No new
    causal edges were added and no phenotype was rewired, because no source in
    this tranche states a gene-to-phenotype edge that the graph does not already
    carry at class level. Entry connectivity is unchanged at 10/12 phenotypes, the
    two unconnected ones being the deliberate omissions notes item 11 explains.

    Four checklist rows declined as distinct syndromic entities, each recorded as
    a cited differential_diagnoses entry rather than only in the PR: Al-Raqad
    syndrome / DCPS (its founding report describes a syndrome with craniofacial
    anomalies and neuromuscular defects), MRT75 / PIDD1 (anterior-predominant
    pachygyria, a cortical malformation, and MONDO's own label names variant
    lissencephaly), MRT81 / ASCC3 (a neuromuscular syndrome, complex-level
    allelism with the SMA-with-congenital-bone-fractures genes), and MRT77 /
    CEP104 (a ciliopathy whose dismech home is the existing Joubert_syndrome
    entry, where CEP104 is already curated as causative). MONDO files all four as
    direct children of a class defined by the ABSENCE of those features; the
    disagreement is recorded in the entry rather than filed upstream.

    Stale prose repaired. Notes item 6 claimed TECR was omitted because no primary
    report could be retrieved and cached; PMID:21212097 has now been retrieved and
    cached and MRT14 is curated, so the item was narrowed to ST3GAL3 alone. Item
    11's node-to-gene assignment list and item 1's subtype-set description were
    brought up to date. New item 12 records that hgnc:1184's HGNC-approved symbol
    is FERRY3 (read live from rest.genenames.org, date_symbol_changed
    2023-12-04) while the OBO build still carries C12orf4, so term.label keeps
    C12orf4 and preferred_term gives FERRY3, following the GBA1/GBA convention.

    Self-review pass on prose found and fixed eight unsourced claims in the first
    draft: two superlatives with no source ("the clearest dendritic-spine
    mechanism in the class", "the clearest second-messenger entry"), an unsourced
    comparative on MRT14, "substrate-recognition component" for FBXO31 where the
    abstract says only that it functions as a centrosomal E3 ubiquitin ligase with
    SKP1 and Cullin-1, "glycosaminoglycan" where the abstract says heparan
    sulfate, "bulk mRNA turnover" as an inference the EDC3 abstract does not make,
    "well-characterised" where the HNMT abstract says well-known, and a garbled
    sentence about the ZC3H14 Drosophila model.

    Deleted stubs/Intellectual_Disability_Autosomal_Recessive_50.yaml, whose
    disease is now curated as the MRT50 subtype row.

    Every snippet was verified as a substring of the PubMed abstract (efetch
    rettype=abstract) before being written, using the validator's own
    normalize_text, so no snippet depends on full text. Validation under
    linkml-reference-validator 0.3.0rc2: just validate-disorders reports 0 issues
    over 265 snippets and 273 titles; just validate-terms passes; just
    count-verified-snippets 265/265 after reverting validator cache churn; just
    list-gene-term-mismatches examines 97 gene bindings, compares all 97 against
    HGNC, 0 uncached and 0 naming a different gene, with 3 advisory rows that are
    the documented FERRY3 build lag; just subtype-usage-audit reports 31/31
    subtypes referenced by a subtype foreign key and 31/31 WIRED_DIRECT; and
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-enum-values, check-qualifier-terms, check-case-collisions,
    check-folded-hyphens, check-snippet-length, check-title-snippets,
    check-snippet-grading, check-environmental-evidence, check-coarse-phenotypes,
    check-reference-titles, check-term-cache-integrity and
    compliance-connectivity all pass.

    Not done: ST3GAL3 (MRT12) remains uncurated for the reason notes item 6 gives.
    Orphanet could not be consulted for any of these subtypes - no
    references_cache/ORPHA_*.md exists for them and data/orphadata/*.xml is
    gitignored, so a fresh worktree cannot fetch one.

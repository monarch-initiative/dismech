    Self-review before pushing changed eight things, of which five were factual
    errors in the first draft:
      1. The second LINS1 family was written as Pakistani. PMID:32499722 reports an
         Indian family from Karnataka. Corrected.
      2. MRT27 claimed WNT signalling as one of the class review's recurring themes.
         It is not among the themes the entry records, so the theme claim was removed
         and the gene is curated as a loss of a gene-specific molecular function.
      3. The PIGC row named the PIGA and PIGQ encephalopathy entries. The PIG gene in
         Developmental_and_Epileptic_Encephalopathy_55 is PIGP. Corrected.
      4. The APC2 row asserted an internal MONDO inconsistency between a
         non-syndromic definition and Sotos synonyms. The OLS4 obo_synonym field types
         all three Sotos synonyms as historic and discouraged, which refutes that: the
         rename is deliberate. The row and notes item 13 were rewritten to rest the
         decline on criterion (ii), and no upstream MONDO claim is made.
      5. TRMT1 was described as named in the class review's RNA and tRNA modification
         theme. The theme list the entry transcribes does not name TRMT1, and both
         cached class reviews are abstract-only so the full texts cannot be searched.
         Reworded to attribute the placement to this entry.
      Also: "quantified loss" softened to "measured" for NAA20, since the source
      reports reduced activity without a figure; the WDR11 list of further findings
      was made explicitly partial and gained the pigmentary findings; and METTL23 lost
      the claim of being one of the clearest members of the class after PMID:42472761
      was found reporting severe disease with mitral valve prolapse and eczema - that
      report is now cited, with its own framing of itself as the severe extreme, which
      is what keeps the row inside the class on the obligate-feature criterion.

    One snippet was considered and rejected: PMID:23773660's "No associated cortical
    abnormalities were observed" reads as evidence of a normal cortex but in context
    describes the surroundings of a frontal vascular malformation in one patient.

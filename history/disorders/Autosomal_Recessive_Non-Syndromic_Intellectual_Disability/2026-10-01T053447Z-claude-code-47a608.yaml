  summary: 'Genetics pass (d2g series-013 part 2): six MRT subtypes curated, three
    rows declined to differential_diagnoses'
  details: |
    Genetics pass for the nine gene-defined MONDO children listed on dismech#12220
    (d2g series-013 part 2). Six were curated as has_subtypes rows with matching
    genetic rows; three were declined to differential_diagnoses under the boundary
    criterion the entry records as notes item 13.

    Curated as subtypes, each with a subtype_term, a genes descriptor, a genetic row
    carrying relationship_type CAUSATIVE / variant_origin GERMLINE and a subtype
    foreign key, and the gene bound as a genes descriptor on the
    "Loss of a Gene-Specific Molecular Function Required by Developing Neurons"
    pathophysiology node so it reaches the pathograph:
      MRT27 LINS1    MONDO:0013702  hgnc:30922  PMID:23773660, PMID:32499722
      MRT44 METTL23  MONDO:0014409  hgnc:26988  PMID:24626631, PMID:42472761
      MRT52 LMAN2L   MONDO:0014815  hgnc:19263  PMID:26566883
      MRT68 TRMT1    MONDO:0032665  hgnc:25980  PMID:40245862, PMID:26308914
      MRT73 NAA20    MONDO:0030533  hgnc:15908  PMID:34230638
      MRT78 WDR11    MONDO:0859373  hgnc:13831  PMID:34413497

    Declined to differential_diagnoses:
      CASP2 MONDO:0957999 - criteria (i) and (ii). Typical fronto-temporal
        lissencephaly with pachygyria in every patient with an available brain MRI,
        and the PIDDosome mechanism is already modelled by
        CRADD-Related_Thin_Lissencephaly, whose nodes are named for PIDDosome
        signalling and caspase-2-mediated apoptosis. PIDD1 is already declined on the
        malformation.
      APC2 MONDO:0014951 - criterion (ii). The single founding report, PMID:25753423,
        is already cited on two pathophysiology nodes of Sotos_Syndrome, where APC2 is
        the NSD1 downstream effector. Criterion (i) is recorded rather than relied on:
        MONDO types its three Sotos synonyms for the class as historic and
        discouraged, so its non-syndromic definition is a considered position.
      PIGC MONDO:0040500 - criterion (ii), the CEP104 route. GPI anchor biosynthesis
        is modelled across the seven disease members of the
        Disorders_of_GPI_Anchor_Biosynthesis grouping, two of which curate the same
        GPI-N-acetylglucosaminyltransferase complex and name PIGC in it.

    notes items 11 and 13 were updated so existing prose did not go stale: the
    molecular-function node gene list now names the six added genes, and the
    declined-row and closest-subtype lists were extended from four and three to seven
    and four.

    Anchor audit on the parent's own disease_term MONDO:0019502. Not over-broad: the
    entry models the class and binds the class term. Reciprocal test passes - all 31
    pre-existing has_subtypes rows resolve inside MONDO:0019502 via OLS4
    hierarchicalAncestors, and so do all nine issue rows, each a direct child. The
    term has 68 direct children and 71 descendants, so the gap list is working as
    intended on a class-modelling entry rather than reporting an anchor defect;
    neither the ANK2 free-text remedy nor design decision 3a L4 applies. No change
    made to the anchor.


  summary: 'Address PR review: drop HP:0001328 false match, add TRAPPC9 obesity phenotype'
  details: |
    Addressed the automated review on PR #7607. Two blocking items. First, removed the HP:0001328 Specific learning disability binding from the "Impaired Literacy and Academic Attainment" phenotype: the HPO definition ends "The impairment is not related to a global deficiency of intelligence", which explicitly excludes the curated case of attainment limited by global intellectual disability, making it a false match rather than an imprecise one. The free-text preferred_term is retained and a needs-term/NTR note records why no binding is present. Second, added an Obesity HP:0001513 phenotype scoped to subtype MRT13 with frequency FREQUENT, supported by the human-anchored sentence in the already-cached PMID:32877400 reporting obesity in 52 percent of published human TRAPPC9 cases; the mouse body-weight result is carried in a separate evidence item marked MODEL_ORGANISM so the human phenotype does not rest on animal data. Also addressed three non-blocking suggestions. Dropped the partially-anchoring HP:0000271 binding from the negative-finding phenotype, since the constellation asserted also covers organomegaly, spasticity, weakness, neuropathy, visual deficits, feeding problems, and metabolic derangement, and recorded it as a second NTR candidate. Wired all three declared mechanistic_hypotheses onto four causal edges via downstream hypothesis_groups so they are machine-traversable rather than narrative-only, with edge descriptions explaining why each edge belongs to its model. Reframed the metabolic-treatment entry so the therapeutic action is the primary claim, retaining it in treatments and cross-referencing the diagnostic counterpart. Replaced the generic Pharmacotherapy term on the antiseizure treatment with NCIT:C64172 Anticonvulsant Therapy plus an NCIT:C264 Anticonvulsant Agent therapeutic_agent, and added rolipram CHEBI:104872 as the therapeutic_agent on the PDE4 entry. Validation: just validate passed with 176 of 176 snippets verified, just validate-terms passed, just validate-references passed, folded-hyphen lint 3 passed, 9 file-scoped pytest cases passed.

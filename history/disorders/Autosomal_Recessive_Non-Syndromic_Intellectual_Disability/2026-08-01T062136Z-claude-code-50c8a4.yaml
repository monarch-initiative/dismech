  summary: 'Create: Autosomal Recessive Non-Syndromic Intellectual Disability'
  details: |
    New CURATE_ROOT_WITH_SUBTYPES entry for the AR-NSID / NS-ARID class, the OMIM MRT phenotypic series PS249500. Deep research used the claude_code provider; falcon was unavailable because no EDISON_API_KEY or FUTUREHOUSE_API_KEY was present and deep-research-client reported claude_code as the only available provider. Ten MRT-series subtypes are modelled under has_subtypes, each anchored on its primary discovery paper: MRT1 PRSS12, MRT2 CRBN, MRT3 CC2D1A, MRT5 NSUN2, MRT6 GRIK2, MRT7 TUSC3, MRT13 TRAPPC9, MRT15 MAN1B1 aka Rafiq syndrome, MRT18 MED23, MRT57 MBOAT7. Gene-to-MRT mappings were verified against MONDO via OAK. The pathophysiology graph is kept at the architecture level with worked exemplars and deliberately does NOT assert pathway convergence, citing the class review finding that there are no prevalent ARID genes, pathways, or protein complexes. Three mechanistic hypotheses are recorded: the thousands-of-loci long tail, the non-syndromic boundary as ascertainment, and TRAPPC9 parent-of-origin imprinted bias. Four discussions are recorded including one HUMAN_MODEL_MISMATCH on rodent-model translational validity. No GeneReviews chapter exists for the class, so the GeneReviews baseline step was not applicable and this is documented in notes. Monarch-propagated HPO annotations inherited from syndromic descendants were deliberately not transcribed. Validation: just validate passed with 172 of 172 snippets verified against cached references, just validate-terms passed, just validate-references passed. All 9 file-scoped pytest cases pass.

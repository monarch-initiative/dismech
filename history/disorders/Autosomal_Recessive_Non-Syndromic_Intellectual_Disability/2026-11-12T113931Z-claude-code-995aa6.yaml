  summary: Evidence-claim mismatch review (#16982)
  details: |
    Reviewed the 38 whole-claim MISMATCH findings in the saved Jev assessments against the current entry. Corrected: the CRBN-kindred negative observations (no afebrile seizures; no autistic features) were filed as REFUTE evidence on Seizures and Autistic Features rows scoped to MRT57 (MBOAT7), where they bear on nothing; they now sit on two new MRT2-scoped rows with frequency EXCLUDED and modifier ABSENT. The Seizures causal edge no longer asserts an unsupported seizure-threshold mechanism; it records MBOAT7 co-occurrence. The NSUN2 Drosophila item on Impaired Synaptic Transmission and Plasticity now quotes the short-term-memory deficit and rescue result, marked directness INDIRECT. The ADAT3 differential item now quotes the widened phenotype (microcephaly, growth failure, dysmorphism) instead of a 'recognizable cause' sentence. The early-intervention treatment's genetics-review snippet (therapy targets) was replaced by PMID:38810986, a review recommending multidisciplinary early intervention for GDD/ID. Retired-grade PARTIAL wording removed from the two explanations touched. Retained after review: the all-cause ID prevalence record (its population and notes already state it is the denominator class, not AR-NSID); the WDR11 BACKGROUND item (supports the description's contrast with the dominant phenotype); the PIDD1, ASCC3 and CASP2 differential evidence (supports why each is excluded from the class); gene-function background snippets on MRT subtypes, which support the subtype descriptions rather than the class.

  summary: 'Review round 1: phenotypes 10 to 19, endocrine axis, treatments, Trim37
    knockout mouse'
  details: |
    Addressed the round-1 REQUEST_CHANGES review on PR #11442.

    Phenotypes went from 10 to 19, and every existing phenotype that had a quoted percentage now carries the matching frequency band.

    Finding 1, the two omitted features from the sentence the entry already quoted: high-pitched voice (HP:0001620, 96 percent, VERY_FREQUENT) and cutaneous naevi flammei (HP:0001052, 65 percent, FREQUENT). Also added slender build (HP:0001533) from the same abstract's gracile-habitus sentence.

    Finding 2, the frequency band error: yellowish dots in ocular fundi carried "Very frequent (99-80%)" against its own snippet's 79 percent. Corrected to FREQUENT. All three free-text band strings were converted to enum keys at the same time, per the reviewer's separate suggestion, and the reviewer was right that the schema's any_of makes the free-text form validate without anyone checking the band.

    Finding 5, frequencies lifted from snippets into the slot: scaphocephaly VERY_FREQUENT, mild muscular hypotonia FREQUENT, hepatomegaly FREQUENT, fibrous dysplasia OCCASIONAL, congestive heart failure OCCASIONAL, constrictive pericarditis OCCASIONAL.

    Finding 3, the endocrine and metabolic axis. Rather than curate it from the deep-research report's summary, fetched five new references: PMID:17548484 (growth and growth hormone therapy), PMID:21865362 (testicular failure and male infertility), PMID:19329943 (gynaecological tumours), PMID:27044324 (the Trim37 knockout mouse) and PMID:28432469 (renal findings), plus PMID:35257621 for the pericardiectomy evidence.

    The reviewer suggested delayed puberty (HP:0000823) and hypogonadism (HP:0000135) for the sexual-maturation failure. Neither is what the primary source describes. In the 28-male national cohort puberty starts spontaneously at a normal median age of 12.6 years and the axis behaves normally to midpuberty; what follows is progressive hypergonadotropic testicular failure. Curated as HP:0000815 with the timing quoted as a second evidence item so the distinction is visible. Azoospermia or severe oligoasthenozoospermia (HP:0000027) added alongside, and ovarian sex cord-stromal tumour (HP:0031918) as the female counterpart, both with context set because they are sex-limited. Insulin resistance (HP:0000855) and type 2 diabetes (HP:0005978) complete the axis.

    A new pathophysiology node, Gonadal Failure and Insulin Resistance, carries the axis in the pathograph, downstream of TRIM37 Loss of Function with unknown intermediates. Its notes record that the mouse and human metabolic phenotypes differ in the direction of the insulin abnormality: the mouse has raised fasting glucose with LOW fasting insulin, patients are described as insulin resistant.

    Finding 4, treatments. The report was truncated before its treatment section, so the gap was filled from newly fetched literature rather than declared out of scope. Growth hormone therapy added with the honest result: prepubertal growth improved, adult height by about 5 cm, and the counterintuitive finding that treated subjects had less metabolic syndrome, with a note that the comparison is not randomised. Tumour surveillance added with an explicit note that no published protocol for this disease exists in any cited source, so the evidence establishes the risk and not the intervention. Pericardiectomy gained the evidence its own notes said a curator should attach: PMID:35257621, pericardiectomy at 12 with 44 further years, graded INDIRECT as a single uncontrolled case.

    Orphan pathograph components, the reviewer's first suggestion: Prenatal-Onset Growth Failure and Mesodermal Ocular Involvement are now downstream of TRIM37 Loss of Function, both typed INDIRECT_UNKNOWN_INTERMEDIATES. The growth edge carries two REFUTE items from the mouse, which has normal weight development for its first year and no long-bone length difference, so the model does not reproduce the defining feature of the disease. A reports_on link was added on the prenatal growth failure phenotype.

    An animal_models section was added for the Trim37 knockout mouse with three links: RECAPITULATES the gonadal and metabolic node, FAILS_TO_RECAPITULATE the growth failure, and FAILS_TO_RECAPITULATE the peroxisomal node, the last of which independently corroborates the entry's existing REFUTE on the peroxisomal-disorder classification from human fibroblasts.

    Also added: a histopathology section for the peliosis, vascularised cysts and CD34/CD31/alpha-SMA immunohistochemistry, and a diagnosis section covering the clinical criteria and TRIM37 testing. The ocular phenotype was rebound from HP:0007703 (Abnormal retinal pigmentation) to HP:0000610 (Abnormal choroid morphology) per the reviewer's suggestion, since the entry models a choroidal lesion, and the ocular node gained a choroid location binding.

    Two errors of mine caught by the validators in this round, both wrong NCIT identifiers I guessed rather than looked up: NCIT:C1618 for recombinant growth hormone is actually BAGE Tumor Antigen (correct: NCIT:C837 Somatropin), and NCIT:C25218 is the enum root and not a permissible value (replaced with NCIT:C15406 Cancer Screening). This is the same failure class the entry's own notes criticise the research report for.

    Validation: linkml-validate clean; linkml-term-validator --labels passed; 70/70 snippets verified against the cache, up from 37/37; model-scale-audit --strict clean; offline gates clean.

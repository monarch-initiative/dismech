  summary: 'Review round 2: consume PMID:35257621 fully; re-band cardiac phenotypes'
  details: |
    Review round 2 on PR #11442. The round-2 finding was that references_cache/PMID_35257621.md — committed by this PR and already cited twice — carries four sentences the entry did not use, one of which the entry contradicted.

    (a) Hepatic steatosis said in notes "Not established as a human phenotype at any frequency" while the cached source says "Fatty liver is seen in all adults and adolescents." The entry contradicted its own committed evidence. Added the human evidence item, banded VERY_FREQUENT with context "Adolescents and adults", and rewrote the note. Banded VERY_FREQUENT rather than OBLIGATE because the sentence is a narrative review's summary rather than a counted proportion — the same distinction that keeps Hypergonadotropic hypogonadism at OBLIGATE, where the figure comes from a 28-male national cohort. The mouse item is kept alongside the human one.

    (b) Constrictive pericarditis and Congestive heart failure were both banded OCCASIONAL from the 6%/12% figures in PMID:14757854, which count patients diagnosed during infancy, not lifetime occurrence. The cached source gives lifetime figures of 39% and 51%. Both re-banded FREQUENT, both evidence items retained with the infancy explanation corrected to name its denominator, and a note recording that two denominators are in play and which one bands the phenotype. This mattered because the entry's own prose calls constrictive pericarditis "the principal determinant of outcome" while the queryable slot said OCCASIONAL.

    (c) Took the point, declined the specific bands. The available adult proportions are both for something wider than the phenotype they would band: 70% is metabolic syndrome, a composite diagnosis of which insulin resistance is one component, and 92% counts impaired glucose tolerance and type 2 diabetes together with no split reported. Banding either phenotype from those figures would put a number on a narrower finding than the one counted. HP has no metabolic syndrome term (confirmed against OLS), so the composite cannot be curated as a phenotype in its own right either. Both sentences are added as INDIRECT evidence with notes stating why no band follows. The one unambiguous proportion in that sentence — hypoglycaemia in half of patients under 10 — is curated as a new phenotype (HP:0001943) banded FREQUENT with context.

    (d) Added a Pericardial fibrosis histopathology finding (NCIT:C3044) quoting "Microscopic analysis of diseased pericardium almost invariably shows extensive fibrosis." This is the tissue-level finding under the disease's dominant manifestation and the observation the pericardial_fibrosis_mechanism_unknown discussion is about.

    Took the reviewer's suggestion: added Left ventricular hypertrophy (HP:0001712) quoting the echocardiographic sentence. Deliberately not made a readout of Pericardial Constriction — the source's point is that it persists irrespective of previous pericardiectomy, so an edge from that node would assert the opposite of what is cited. Recorded that reasoning in the phenotype's notes.

    Connectivity: four phenotypes whose link is asserted in the entry's own prose were connected — Congestive heart failure and Azoospermia and Ovarian sex cord-stromal tumor and Insulin resistance. The graph goes from 21 edges to 25 with orphan_targets empty. Hypoglycaemia and Left ventricular hypertrophy are left unconnected on purpose, each with a note giving the reason.

    Resolved the reviewer's GeneReviews disclosure, which it could not check itself: a PubMed query for mulibrey AND GeneReviews[Book] returns zero results, and all 18 hits in the books database are differential-diagnosis tables inside other chapters. There is no GeneReviews chapter for this disorder, so the baseline is genuinely not applicable rather than unchecked.

    Validation: linkml-validate clean, linkml-term-validator --labels passed, reference_snippet_audit 78/78 verified (was 70/70), and check_entity_refs, check_causal_targets, check_duplicate_yaml_keys, check_enum_values, check_qualifier_terms, check_folded_hyphens, check_reference_titles, check_snippet_length, check_title_snippets and check_snippet_grading all clean. Every frequency band in the entry was re-derived from the number its own snippet states, including the bands this round did not touch.

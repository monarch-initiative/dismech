  summary: 'Create: Mulibrey Nanism (MONDO:0009664, TRIM37)'
  details: |
    Curated de novo from a Perplexity sonar-deep-research report (research/Mulibrey_Nanism-deep-research-perplexity.md). Every claim was re-derived from the cached PubMed abstract rather than from the report: 37 snippets, all verified by dismech.reference_snippet_audit against references_cache/.

    The report required substantial correction before use. Four identifier/attribution defects were found in it: (1) it cited PMID:12045473 as Kallijarvi's TRIM37 peroxisome localisation study -- that PMID is an acamprosate/NMDA rat hippocampal slice paper; the correct reference is PMID:11938494. (2) It cited 'PMID:10788545 (implied from context)' as Avela's positional cloning paper -- that PMID is a dermatomyositis calcinosis letter; the correct reference is PMID:10888877. (3) It attributed the 85-patient Finnish clinical cohort (PMID:14757854) to Hamalainen et al.; the paper is by Karlberg et al. Right paper, wrong authors, and nothing in the dismech evidence model can catch that because EvidenceItem has no author field. (4) It gave TRIM37 as HGNC:16287, which is NFU1; TRIM37 is hgnc:7523, verified directly against the HGNC REST API. None of the four wrong identifiers were used in the entry.

    The report also omitted TRIM37's centrosomal biology entirely, leaning on the older peroxisomal model. PMID:32908304 (Meitinger et al., Nature) was added by hand for the TRIM37/PLK4/CEP192 mechanism, and PMID:19334051 for the 89-patient tumour cohort.

    Mechanistic stance: the entry deliberately does not assert a single mechanism. The peroxisomal node is named 'Peroxisomal TRIM37 Depletion' rather than peroxisomal dysfunction, and carries a REFUTE evidence item quoting the same paper that established the localisation ('patient fibroblasts ... stain normally for both peroxisomal matrix and membrane markers'). The centrosomal node's edges are all graded directness: INDIRECT because the work was done in RPE1/cancer cell lines to study a therapeutic vulnerability. Three discussions record the open questions: the unsupported peroxisomal-disorder classification, the completely unexplained pericardial fibrosis (the feature that determines survival), and a HUMAN_MODEL_MISMATCH on the centrosomal mechanism.

    Validation run in the worktree: linkml-validate (Disease) clean; linkml-term-validator validate-data --labels clean; reference_snippet_audit 37/37; check_duplicate_yaml_keys, check_entity_refs, check_enum_values clean. check_causal_targets caught one real defect during curation -- a downstream target named 'Nephroblastoma' against a phenotype node named 'Wilms tumor' -- which was fixed; it now reports no new breakage. Three reference caches fetched during research but not cited by the entry (PMID_10788545, PMID_12045473, PMID_16310976) were pruned rather than committed.

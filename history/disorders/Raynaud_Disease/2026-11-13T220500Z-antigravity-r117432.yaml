  summary: 'Review round 1 remediation: reverse RhoA/ROCK->ADRA2C edge, split mitochondrial
    ROS vs ischemia-reperfusion injury, bind GO:0004938, and refine phenotypes/targets'
  details: |
    Addressed PR #17432 review findings: reversed RhoA/ROCK Potentiation of Vasospasm -> Alpha-2C Adrenoceptor Cold-Induced Vasoconstriction edge; split Oxidative Stress and Ischemia-Reperfusion Injury into upstream Cold-Induced Mitochondrial ROS Release (GO:0005739, GO:1903409, GO:0070417 -> RhoA/ROCK, targeted by Cold Exposure) and downstream Ischemia-Reperfusion Oxidative Injury (GO:0002931, GO:0006979, Digital Ischemia -> it -> Endothelial Dysfunction / Digital Ulceration) with :split_from recorded in pathograph_node_classes.txt; replaced GO:0004930 with GO:0004938 alpha2-adrenergic receptor activity on ADRA2C and ADRA2A nodes; tagged PMID:29763008 as StatPearls; removed secondary RP synonyms from entry-level synonyms with rationale in notes; added Vascular Smooth Muscle Calcium Influx for CCB targeting, grounded Estrogen node with GPER1 (GO:0038054, GO:0007189), and added IRX1-Associated Impaired Vasodilation; replaced persistent Acrocyanosis (HP:0001063) with transient Peripheral cyanosis (HP:0034033), split Digital Pain (HP:0030837) from Digital Paresthesia and Numbness (HP:0003401), dropped unsourced frequencies, and added REVIEW_SYNTHESIS grading on review quotes.

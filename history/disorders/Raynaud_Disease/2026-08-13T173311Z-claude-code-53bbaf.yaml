  summary: Link cold and emotional stress to their separate mechanisms
  details: |
    Backfill for issue #8085. Cold Exposure is TRIGGERS with DIRECT into Alpha-2C Adrenoceptor Cold-Induced Vasoconstriction, the closest exposure-to-node fit in this tranche: the node is named for cold-induced vasoconstriction and the carried sentence names the receptor as the sole mediator of local cooling-induced vasoconstriction, so exposure and mechanism sit in one clause. DIRECT is recorded knowing that cold reaches the receptor through mitochondrial reactive oxygen species and RhoA/ROCK, which this entry models as a separate node: those steps sit inside the cold-induced vasoconstriction the node is named for rather than on the edge into it, so they are internal to the target and not intermediates the edge steps over. That reasoning is written into the link description as well, at the reviewer's suggestion on PR #8427, so it is not rediscovered as a finding later. Its second item, from the same paper, characterises the disorder as an exaggerated vasoconstrictive response most typically to cold; it is graded PARTIAL because it is a definition of the disorder rather than a finding about this receptor, and the two grades from one paper are therefore about two different sentences. Emotional Stress is deliberately pointed at a different node, Sympathetic Nervous System Dysregulation, because that is the route this entry provides for a stressor that is not cold and the node's description places increased sympathetic adrenergic control on the digital resistance vessels. Its intermediates are recorded as known on the strength of that mapped route rather than of the quoted sentence, which reaches the digital vasospasm at the end of the chain and does not name the nerves; that item is PARTIAL for the same reason.

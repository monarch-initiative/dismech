  summary: 'Add ECTO exposure_term binding audit (issue #8430)'
  details: |
    Checked ECTO for an exposure_term binding on the 'Emotional Stress' environmental exposure (now pathograph-linked via influences_mechanisms). No specific psychological/emotional-stress ECTO term exists; the only substring hit, ExO:0000000 'exposure stressor', is an unbound upper-level material-entity class for any stress-causing agent rather than a term for stress-as-exposure itself. An earlier pass in this same PR additionally claimed no NBO/XCO alternative existed and left the slot unbound; PR review (#8447) correctly identified that as a false negative -- XCO:0001265 'stress' is a direct child of XCO:0000000, one of the ExposureTerm enum's source_nodes, and its definition names "a physical, chemical, or emotional factor that causes bodily or mental tension and may be a factor in disease causation." Bound exposure_term to XCO:0001265 with preferred_term 'exposure to emotional stress' and corrected the notes: entry accordingly.

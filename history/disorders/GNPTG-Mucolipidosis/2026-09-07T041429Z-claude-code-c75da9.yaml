  summary: 'Review round 3: grade the beta-glucuronidase item against the prompt,
    drop an overclaimed experiment link'
  details: |
    Third review round on PR #11287, again taken up after an approval. Both items are defects in blocks added by this PR rather than pre-existing gaps.

    The residual-beta-glucuronidase evidence item on the gnptg_mouse_cartilage_conflict discussion carried supports SUPPORT while its own explanation said it was 'offered as a candidate account of the discrepancy rather than as evidence for either phenotype'. Those are two different claims about one item, and the reviewer was right that the axis changed meaning mid-block: the two sibling items grade against the discussion prompt ('Do Gnptg-null mice have a cartilage phenotype?'), so this one was being graded against the rationale instead.

    Regraded REFUTE rather than NO_EVIDENCE. The reviewer offered both. NO_EVIDENCE is defined as true and worth citing but not about this claim, and that does not fit: the sentence presupposes the absent chondrocyte lesions in order to explain them, so it asserts the absence a second time and bears on the prompt exactly as its sibling does. NO_EVIDENCE would hide the sentence from a reader searching for what evidence speaks to the cartilage question. The original SUPPORT came from wanting to avoid double-counting the 2009 absence, which is already REFUTE via the sibling item, but supports is a direction, not a vote, and two items from one paper quoting different sentences is the pattern the evidence rules endorse rather than a defect. The explanation now says what the sentence does and what is distinctive about it.

    The second proposed experiment named pathophysiology#Lysosomal Substrate Accumulation in Connective Tissue in both would_support and would_refute. Same-node-in-both is an established pattern and is right for the first experiment, whose outcomes bear on whether the cartilage phenotype is a property of gamma-subunit loss. It is wrong for the second: measuring residual beta-glucuronidase decides which candidate explanation survives, and neither outcome moves the storage node in either direction. Both slots dropped; supporting_outcome and refuting_outcome carry the content, and all four slots are independent and optional in the schema so the block stays well-formed.

    Not actionable: the reviewer noted that the Chronic pain link stays UNDETERMINED in model-scale-audit because biological_scale is a Pathophysiology slot and that link targets a phenotype. Recorded here so a later round does not read it as an omission.

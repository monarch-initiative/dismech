  details: |
    Fourth review round on PR #11287, taken up after a fourth approval and against the reviewer's explicit advice to fold it into a future touch rather than spend a re-review cycle. The reasoning for going ahead: explanation and interpretation are rendered on the public disorder page, so prose aimed at a reviewer ships permanently if nobody touches the entry again, and a future touch is not guaranteed. The edit also removes text rather than adding it, so unlike the previous rounds it does not create new prose that a later round could find fault with.

    Two fields narrated the review round instead of the evidence, and both were written by earlier rounds of this same PR.

    The residual-beta-glucuronidase evidence item opened with 'Graded against the prompt, as its two siblings are' and later said the sentence 'cuts the same way as the sibling item quoting it directly'. Both clauses argue for a curation decision to a reader who was present for the argument. Nothing in the file says what the siblings were graded against or why that was ever in question, so in a year the sentence reads as a reference to a discussion that left no trace. Trimmed to what survives out of context: the sentence presupposes the absent chondrocyte lesions in order to explain them, so it asserts the absence as well as accounting for it, and its distinctive content is that account.

    The rotarod readout's interpretation said the measurement was 'recorded against the phenotype it actually reports on rather than against the upstream storage node' - a note about where the readout used to live before round 1 moved it, which is meaningless to a reader who never saw it in the other place. Replaced with what the measurement is: reduced endurance on the rotarod under fatigue conditions, taken as a whole-animal functional measure of how well the joint bears sustained load. Deliberately does not restate the composite-readout and fatigue-versus-pain caveats, which belong to the link's limitations and are already there.

    Both rewrites avoid adding method detail the abstract does not support; the rotarod protocol is not described beyond 'fatigue-associated conditions', so nothing about acceleration or duration was introduced.

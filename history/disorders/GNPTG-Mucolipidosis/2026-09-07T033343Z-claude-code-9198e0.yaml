  summary: Split the Gnptg model into two lines after allele verification
  details: |
    Review round on PR 11287. The reviewer challenged the controversy's premise that two reports studied the same knockout, noting neither abstract names an allele. They were right, and the problem was larger than the prose: the readouts were attached to the wrong mouse. MGI lists five Gnptg alleles. Gnptg<tm1Lex> (MGI:3757947, Lexicon Genetics) carries PMID:17652091 as its originating reference and is MGI-annotated to that paper. The open-access full text of PMID:33023972 states in its Animals section that its Gnptg ko (C57Bl/6) mice have been described previously in Kollmann 2012, Kollmann 2013 and Di Lorenzo 2018, which is a different provenance; MGI separately lists Gnptg<tm1d(KOMP)Wtsi> with synonym Gnptg<ko> and Di Lorenzo 2018 as its reference. So the 2020 chondroitin sulfate and rotarod results come from a different line than the 2007/2009 phosphorylation and pathology results. The single model was therefore split into two: a Lexicon line carrying the M6P and I-cell readouts, and a Hamburg line carrying the cartilage and joint readouts. The PMID:19261645 assignment to the Lexicon line is recorded as resting on author and allele-series continuity rather than an MGI record, since MGI carries no annotation for that paper. The Hamburg line is recorded as the authors write it rather than by MGI allele symbol, with the plausible MGI identity noted but not asserted. Second finding: the controversy rationale advanced a depth-of-assay explanation while omitting the 2009 authors' own account, that the absent chondrocyte and retinal lesions might be attributed to residual beta-glucuronidase activity. That is now a third evidence item on the discussion and one of four candidate explanations rather than a favoured one, with the different-line and animal-age axes added. Third finding: the rotarod readout sat on the connective-tissue storage node while its own interpretation conceded it was not a storage measurement. It now hangs on a link to the Chronic pain phenotype, with limitations recording that rotarod under fatigue is a composite motor readout and that the authors do not separate fatigue from pain. Also merged main to clear 22 snippet-length findings in Ewing_Sarcoma, Tangier_Disease, Glutaryl-CoA_Dehydrogenase_Deficiency and CRX_Related_Retinopathy that were branch-base drift rather than this change. All 33 snippets verified exact; validate, entity-ref, duplicate-key, causal-target, folded-hyphen, snippet-length, snippet-grading and title-snippet gates green.

  summary: Add the Gnptg-null mouse and record the cartilage disagreement
  details: |
    Adds the Gnptg<tm1Lex> gamma-subunit knockout, completing the mucolipidosis pair begun in PR 10161, where the Gnptab gene-trap was curated in Mucolipidosis_Type_II. The pairing is the point: PMID:17652091 assayed both knockouts side by side and found complete loss of mannose-6-phosphate tagging for the alpha/beta null against only partial loss for the gamma null, and PMID:19261645 found that lesion onset, extent and severity across the two lines tracked measured lysosomal enzyme activity. That graded activity-to-severity relationship is the mouse counterpart of milder human ML III gamma against ML II, and it is a second worked example for the deferred amount-versus-activity decision in the design register. The M6P link is RECAPITULATES with two readouts, phosphorylation DECREASED (partial, explicitly against the alpha/beta null) and serum lysosomal enzyme levels INCREASED. The connective-tissue link is PARTIALLY_RECAPITULATES at LOW fidelity: chondroitin sulfate does accumulate in chondrocytes and the cartilage matrix is altered, but an UNCHANGED readout records that neither mouse line forms the cytoplasmic vacuolar inclusions in fibrocytes and mesenchymal cells, the I-cells, that define the human skeletal and connective-tissue disease. A CONTROVERSY discussion records that PMID:19261645 and PMID:33023972 reach opposite conclusions about whether this line has a cartilage phenotype, attaching symmetrically to the model and the node rather than asserting one report over the other in prose; the likely depth-of-assay explanation is recorded as a hypothesis, not a finding. All 31 snippets verified exact against the reference cache; validate, entity-ref, duplicate-key, folded-hyphen, snippet-grading and snippet-length gates green.

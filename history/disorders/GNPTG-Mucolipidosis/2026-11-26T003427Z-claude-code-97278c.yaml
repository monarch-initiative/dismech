  summary: 'Gene-family review: GNPTG; record ClinGen tier and bind the complex activity'
  details: |
    ClinGen classifies GNPTG-mucolipidosis (MONDO:0009652, this entry's disease term) as Definitive; the tier is now recorded on the GNPTG record. The gamma-subunit node had no molecular function. GNPTG is the non-catalytic gamma subunit of the alpha2beta2gamma2 GlcNAc-1-phosphotransferase: its mannose-6-phosphate-receptor-homology domain presents high-mannose glycans to the alpha/beta catalytic site, and gamma-null mice phosphorylate about a third of acid hydrolases normally but need the gamma subunit for the rest (PMID:19955174). The node now binds the complex activity, UDP-N-acetylglucosamine-lysosomal-enzyme N-acetylglucosaminephosphotransferase activity (GO:0003976), as decreased, with a preferred term naming the subunit's contribution, the KB pattern already used for DPM2 and OST48.

  summary: 'Review round 2: approval-round follow-ups on the split Gnptg models'
  details: |
    Second review round on PR #11287, taken up after the reviewer approved. Three of the five non-blocking suggestions were defects introduced by this PR's own first round rather than pre-existing gaps, so they were fixed here rather than deferred.

    The controversy rationale announced 'Three candidate explanations' and then enumerated four, because animal age was appended as an afterthought when it was taken up from the previous round's suggestion; the count is corrected and animal age is now the fourth enumerated item rather than a trailing clause.

    The Mucolipidosis_Type_II M6P readout interpretation referred to 'the Gnptg-null mouse in GNPTG-Mucolipidosis'. That reference was unambiguous when written and stopped being so within the same PR, when the allele investigation split that model into a Lexicon line and a Hamburg line. It now names Gnptg<tm1Lex> explicitly, says that is the line PMID:17652091 assayed, and warns that the sibling entry carries a second line the comparison does not cover.

    The Chronic pain link's evidence quotes a sentence about patients ('Patients with MLIII gamma typically present with osteoarthritis and joint stiffness') and was graded MODEL_ORGANISM on the reasoning that the publication as a whole is a mouse study. Regraded HUMAN_CLINICAL: evidence_source classifies the study type behind the quoted sentence, and CLAUDE.md's rule for mixed-source papers is to split items so each carries a single value. check-snippet-grading confirms the sentence is not quoted elsewhere under the old grade.

    Also taken up, having been raised in both rounds: model_scale ORGANISM on all four modeled_mechanisms links, and biological_scale on the two target pathophysiology nodes (MOLECULAR for the M6P targeting node, TISSUE for the connective-tissue storage node). Both mice are whole organisms, so no link is upward-extrapolating; recording that makes model-scale-audit say so rather than returning UNDETERMINED. Two proposed_experiments were added to the open controversy: a head-to-head assay of both lines at matched ages with the 2020 endpoints, which is the design that separates the line-difference explanation from the depth-of-assay explanation because they make opposite predictions once line and assay vary independently; and a measurement of residual beta-glucuronidase activity in cartilage, which tests the 2009 authors' own account.

    Not taken: splitting the bundled node name 'GlcNAc-1-Phosphotransferase Gamma-Subunit Deficiency and M6P Targeting Failure', which the reviewer also recommended leaving, since it predates this PR and mirrors its ML II sibling. Not resolvable: the DMM 2020 Animals-section quotation the model split rests on is not verifiable from the repo, because the cache is abstract-only with full_text_attempted true. The model notes already concede this. The cached author list and MeSH tags corroborate it (Di Lorenzo G is a co-author; Mice, Inbred C57BL matches the recorded C57BL/6 background), but corroboration is not verification and the claim stays flagged.

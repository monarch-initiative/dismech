  summary: Add MONDO mapping for retired stub term
  details: |
    Added a mappings.mondo_mappings row for MONDO:0100358 ectodermal
    dysplasia WNT10A related, with skos:exactMatch. The entry's has_subtypes
    already cover all three MONDO children of that term (OODD, which is also
    the disease_term, Schopf-Schulz-Passarge syndrome and tooth agenesis,
    selective, 4), so the entry's scope is the WNT10A spectrum. Without the
    row, the coverage index did not count MONDO:0100358 as curated and the
    genetics-gap scan nominated it as a stub, which PR 14854 deletes.
    Validated with just validate and just validate-terms.

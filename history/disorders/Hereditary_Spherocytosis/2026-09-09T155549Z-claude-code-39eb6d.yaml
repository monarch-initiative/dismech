  summary: Bind subtype_term MONDO IDs for all five HS subtypes (#9868)
  details: |
    Added subtype_term (SubtypeDescriptor) bindings on all five has_subtypes entries. This
    entry's local "Type N" numbering is frequency-ordered and does not track the OMIM/MONDO
    SPH1-5 numbering: locally Type 2 is the SLC4A1/band-3 subtype and Type 4 is the SPTB
    subtype, while in MONDO the SPTB concept is "hereditary spherocytosis type 2"
    (MONDO:0000913) and the SLC4A1 concept is "hereditary spherocytosis type 4"
    (MONDO:0012981). An earlier version of this record bound HS Type 2 (SLC4A1) to
    MONDO:0000913 by matching the local subtype number rather than the causal gene; that
    binding was self-consistent (the CURIE really is labelled "hereditary spherocytosis type
    2") but wrong, since MONDO defines MONDO:0000913 as the SPTB subtype, not SLC4A1. It also
    claimed no numbered MONDO concept existed for Types 4 (SPTB) and 5 (EPB42), which was
    false — both exist and are live in MONDO. This was caught in PR review (dismech#11532)
    before merge and corrected here, since history records are append-only once on main.
    Final bindings, all confirmed by gene rather than by local number: HS Type 1 (ANK1) ->
    MONDO:0008447, HS Type 2 (SLC4A1) -> MONDO:0012981 (MONDO's "type 4"), HS Type 3 (SPTA1)
    -> MONDO:0010053, HS Type 4 (SPTB) -> MONDO:0000913 (MONDO's "type 2"), HS Type 5 (EPB42)
    -> MONDO:0012985. preferred_term on each subtype_term echoes the bound term's own MONDO
    label (matching the pattern already used for Types 1 and 3), rather than the local
    numbering, to avoid re-encoding the same gene/number mismatch in free text next to a
    correct CURIE. Labels were confirmed via the OLS mondo adapter and cross-checked against
    this repo's own MONDO export (projects/RARE_DISEASE_NO_ICD_CODE/rare_terms_icd_status.csv).
    The coverage index (src/dismech/compare/mondo_priority.py) reads has_subtypes[].subtype_term.term.id,
    so all five MONDO IDs are now coverage-index-visible and will not be re-nominated by
    just seed-stubs. Ran just validate, just validate-terms, just check-duplicate-keys, just
    check-entity-refs, just check-enum-values, and just validate-disorders — all pass. No
    other content or evidence was changed.

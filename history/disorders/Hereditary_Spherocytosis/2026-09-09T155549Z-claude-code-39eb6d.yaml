  details: |
    Added subtype_term (SubtypeDescriptor) bindings on the three has_subtypes entries that correspond to the numbered MONDO concepts folded in PR #9855's stub-queue lump/split review: HS Type 1 (ANK1) -> MONDO:0008447, HS Type 2 (SLC4A1) -> MONDO:0000913, HS Type 3 (SPTA1) -> MONDO:0010053. These entries previously carried no subtype_term at all, so the coverage index (src/dismech/compare/mondo_priority.py) had no way to see that these three MONDO IDs are already curated here, leaving them re-nominatable by just seed-stubs. HS Type 4 (SPTB) and HS Type 5 (EPB42) were left unbound: PR #9855 did not fold a numbered stub for either, and no numbered MONDO concept for them was found. Labels for the new CURIEs were confirmed by just validate-terms against the OAK ols:mondo adapter (all three resolved with exact label matches) rather than assumed from the stub diff; the resulting cache/mondo/terms.csv and enum cache rows are included in this change. Verified with a direct call to iter_covered_mondo_ids that all three IDs are now reported. Ran just validate, just check-duplicate-keys, just check-entity-refs, just check-enum-values, and just validate-disorders — all pass. No content or evidence was changed.

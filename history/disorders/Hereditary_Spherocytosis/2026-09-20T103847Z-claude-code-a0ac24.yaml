  summary: 'Genetics pass: gene wiring (#12198)'
  details: |
    Genetics pass for issue #12198 (d2g wiring-009). All five MONDO-recorded genes were present and
    all five were already bound onto the "Red Cell Membrane Protein Deficiency" node, so the presence
    gap was nil. Three things were added and one recorded decision was reversed.

    Added. genes: descriptors on all five has_subtypes rows; relationship_type: CAUSATIVE and a
    subtype: value on all five genetic records; and case_fractions on ANK1, SPTB, SLC4A1 and SPTA1
    from a newly fetched 55-patient cohort (PMID:42126446) reporting ANK1 50.9%, SPTB 30.9%, SLC4A1
    18.2%, SPTA1 3.6%. The cohort is single-centre and paediatric-weighted and each record says so.
    EPB42 gets no case_fractions record because no patient in that cohort carried an EPB42 variant;
    its notes say that instead. Also cited the EPB42-related GeneReviews chapter (PMID:24624460,
    previously uncited) on the EPB42 record for the biallelic genotype and recessive inheritance, and
    tagged it; and added to the membrane-protein node a quote giving the gene-to-protein
    correspondence, so the membrane component each bound gene acts through is stated rather than
    inferred from the symbol.

    Prose corrections. Four unsourced per-gene percentages in the has_subtypes descriptions
    (~40-65%, ~15-35%, ~5%, ~15-30%) were removed; the sourced cohort shares in case_fractions replace
    them, and each row points there. The HS Type 5 description said protein 4.2 deficiency was "most
    common in Japanese populations"; the entry's own cited source says SPTA1 and EPB42 variants are
    globally rare with reports in Japanese and Korean populations, which is a claim about where the
    few reported cases are, not about what predominates within those populations. Corrected, with the
    supporting quote attached to the EPB42 record and the change recorded in review_notes.

    Reversed decision, flagged for review. Two has_subtypes rows carried a local type number opposite
    to the MONDO term the same row binds: the SLC4A1 row was named "HS Type 2" while binding
    MONDO:0012981 "hereditary spherocytosis type 4", and the SPTB row was named "HS Type 4" while
    binding MONDO:0000913 "hereditary spherocytosis type 2". Renamed both to agree with their
    bindings. The bindings were already correct and were not touched. This reverses the decision
    recorded in history/disorders/Hereditary_Spherocytosis/2026-09-09T155549Z-claude-code-39eb6d.yaml,
    which describes the mismatch as deliberate on the ground that the local numbering is
    "frequency-ordered". That ground does not hold: under the frequencies the same rows carried at the
    time, position 3 (SPTA1, ~5%) sat ahead of position 4 (SPTB, ~15-30%), so the sequence was not in
    frequency order, and the cohort now cited orders the four genes a third way again. A numbering
    that tracks neither the published SPH1-5 nomenclature nor any frequency ranking has nothing left
    to recommend it, while reusing "type 2" and "type 4" with meanings opposite to their standard ones
    inside a file that also binds the standard terms is a live misreading hazard. The reasoning and an
    invitation to push back are recorded in the entry's top-level notes; reverting is a two-line edit.
    No subtype: reference anywhere in the knowledge base pointed at either old name; the 2026-09-09
    history record mentions them in prose only and, being append-only, was not edited.

    Relation to Hereditary_Elliptocytosis, edited in the same pass: SPTA1, SPTB and SLC4A1 appear in
    both entries. A top-level note records why that is not duplication - spherocytosis is modelled as
    failure of the vertical bilayer-to-skeleton anchorage and elliptocytosis as failure of the
    horizontal spectrin and protein 4.1R links - and that SLC4A1 reaches the two by different routes,
    band 3 deficiency here and the Southeast Asian ovalocytosis in-frame deletion there.

    ClinGen gene-disease validity assertions already cited on the ANK1 record were left as they are;
    just clingen-refresh was not run, as it fails on an upstream checksum mismatch (#10426). Validated
    with just validate, validate-terms, count-verified-snippets, check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values,
    list-gene-term-mismatches, check-genereviews and validate-disorders.

  summary: 'Gene-family review: HAO1'
  details: |
    HAO1 modelling re-reviewed and found correct: the trigger node binds (S)-2-hydroxy-acid oxidase activity (GO:0003973, glycolate oxidase) as decreased in the peroxisomal matrix. Added the third reported homozygous HAO1 allele, the frameshift c.997delC p.(Leu333SerfsTer4) in a healthy adult identified by exome sequencing of autozygous population cohorts, with cell expression showing reduced, mislocalized protein (PMID:32207686). The same study gives the quantitative glycolate phenotype (plasma 12x and urine 6x the upper limit of normal) and the strongest human evidence that lifelong HAO1 loss is clinically benign; both are now evidence on the glycolate and benign-course nodes. Record-level autosomal recessive inheritance added (PMID:28752386). HAO1 is also named by Primary Hyperoxaluria Type 1 as the target of the siRNA lumasiran; it is not a PH1 disease gene. No ClinGen assertion exists for HAO1 and no MONDO disease term was found for glycolate oxidase deficiency (OLS search for glycolic aciduria and glycolate oxidase deficiency).

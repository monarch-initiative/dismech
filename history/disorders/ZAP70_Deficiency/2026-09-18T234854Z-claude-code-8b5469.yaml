  summary: 'Review round: convert the total-lymphocyte-count edge from causal to observational
    readout'
  details: |
    Addresses the single blocking review finding.

    The previous round wired 'Peripheral CD8 T Cell Lymphopenia --DIRECT--> Increased total lymphocyte count' as a downstream causal edge. That asserted the CD8 deficit causes a raised total lymphocyte count, which it cannot: removing a lymphocyte subset does not raise the total. What keeps the count normal or high is the preserved CD4 and B compartments, which sit beside the CD8 deficit rather than downstream of it. The edge's own description already conceded this by saying the deficit 'coexists with' those compartments, and the cited sentence is contrastive ('normal to elevated numbers of circulating lymphocytes ... but an absence of CD8+ T cells') - an observation of co-occurrence.

    Removed the downstream edge and its duplicated evidence item. Added reports_on on the 'Increased total lymphocyte count' phenotype pointing at 'Peripheral CD8 T Cell Lymphopenia' with relationship READOUT_OF and endpoint_context DIAGNOSTIC, following the Sarcoglycanopathy pattern. Verified with dismech.graph.build_causal_graph that the phenotype remains connected - the edge is now drawn with predicate 'readout' - and that orphan_targets is empty.

    Accepted the known tradeoff: 'readout' is not in qc_plugins.CAUSAL_PREDICATES, so this phenotype no longer counts toward phenotypes[].causal_inlink. That metric is a KB-wide aggregate ratchet that a single phenotype cannot move, and a correct non-causal link is preferable to an incorrect causal one.

    Also took the two applicable non-blocking suggestions. Added quote_role: BACKGROUND to the evidence item, since the quoted sentence sits in the systematic review's introduction restating established knowledge and carries its own citation; evidence_source stays HUMAN_CLINICAL. Repaired the literal backslash-n escape sequences in the 2026-09-16 history record's details block so the paragraphs render as paragraphs; only the escaping was changed, not the substance of what that session recorded.

    Validation: just validate passes with 111/111 snippets verified. The count moves from 112 because the removed edge carried a duplicate of the phenotype's own snippet. check-duplicate-keys, check-entity-refs, check-causal-targets and check-enum-values all clean.

  summary: Add Increased total lymphocyte count phenotype and causal edge (#11872)
  details: |
    Investigated #11872, which asked to port content deleted from a duplicate ZAP70_Deficiency.yaml branch entry (deleted in PR #10106) onto main's independently-curated ZAP70_Deficiency.yaml (created 2026-09-09, after the branch was abandoned). On inspection, main's entry already carries equivalent or superior content for nearly everything the issue names: a GeneReviews agents-to-avoid treatment (Infection-Risk Avoidance and Blood Product Precautions, with the same live-vaccine/irradiated-blood-product/CMV-safe-feeding/soil-exposure quotes), cutaneous involvement (Eczematoid dermatitis, 57.9% via PMID:32431715), lymphoproliferation (Lymphadenopathy + Hepatomegaly + Splenomegaly, 32.4%), and the eight-edge causal wiring the deleted branch added in its own review-fix commit. Orphanet ORPHA:911 frequency-band citations were not re-added since references_cache/ORPHA_911.md no longer exists and main's entry already sources equivalent frequencies from PMID:32431715/PMID:41080547, which is at least as strong.

    One genuine, verified gap remained: the deleted branch's review-fix commit (7e1dc5b3c) called out 'Failed Positive Selection of CD8 Thymocytes -> Increased total lymphocyte count' as 'the finding that most needed attaching' -- the normal-or-raised total lymphocyte count that masks the CD8 defect and is the reason TREC newborn screening can miss the disease. Main's entry states this fact in prose in three places (disease description, the Peripheral CD8 T Cell Lymphopenia pathophysiology node, and the diagnosis section) but had no discrete phenotypes[] entry or downstream edge for it, so the diagnostic pitfall was not represented as a pathograph node.

    Added a new Laboratory phenotype 'Increased total lymphocyte count' (HP:0100827, diagnostic: true) and a downstream edge from 'Peripheral CD8 T Cell Lymphopenia' to it, both using the entry's existing PMID:32431715 evidence ('Patients with ZAP-70 deficiency often present with normal to elevated numbers of circulating lymphocytes... but an absence of CD8+ T cells'). No frequency band was set since the source states this qualitatively rather than giving a percentage, matching the convention used elsewhere in the same file (e.g. the Pneumocystis jirovecii pneumonia and Increased circulating IgE concentration phenotypes).

    Validated with just validate, just check-duplicate-keys, just check-entity-refs, just check-causal-targets, just check-qualifier-terms, just check-enum-values, just count-verified-snippets (112/112), and pytest tests/test_data.py -k zap70 (2 passed) -- all clean.

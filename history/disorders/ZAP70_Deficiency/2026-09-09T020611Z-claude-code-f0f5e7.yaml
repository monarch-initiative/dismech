  summary: 'Create: ZAP70 Deficiency'
  details: |
    Created kb/disorders/ZAP70_Deficiency.yaml for MONDO:0010023 (combined immunodeficiency due to ZAP70 deficiency) and deleted the corresponding curation stub.

    Deep research: requested falcon; EDISON_API_KEY was not configured in this environment, so the run was made with --fallback and claude_code produced the report. The report is committed as research/ZAP70_Deficiency-deep-research-claude_code.md with fell_back/requested_provider/provider_attempts recorded in its frontmatter, plus its own reference- and term-validation sections.

    Report validation results acted on: reference validation resolved 18/18 identifiers (confabulation_rate 0.0) with one quote flagged as not found in PMID:8124727 - that quote was a paraphrase and was not reused; the verbatim sentence from the same abstract was used instead. Term validation flagged three HP bindings as naming different concepts (HP:0005416 offered as 'T lymphocytopenia' but actually Decreased circulating complement factor B concentration; HP:0004791 offered as 'Increased CD4:CD8 ratio' but actually Esophageal ulceration; HP:0002846 offered as 'Abnormal T cell physiology' but actually Abnormal B cell morphology). None of the three was bound. The report also offered HGNC:7535 as the ZAP70 gene id, which is the NCBI Gene id rather than an HGNC id; gene CURIEs are skipped by the report-side term validator, so this was caught by resolving the symbol against the HGNC REST API, which returns hgnc:12858. That correction is recorded in the entry's genetic notes.

    GeneReviews baseline: PMID:20301777 exists for this disease, was fetched, tagged GeneReviews in the top-level references block, and used as the phenotype floor and as the source for the agents/circumstances-to-avoid content in the treatment entries.

    Named Entity Confusion preflight (just preflight-dr against MONDO:0010023) raised one WARN naming CD4 as a rival gene at 41% of ZAP70 mentions. Judged a false positive: CD4 appears throughout as a T-cell lineage marker, not as a second disease gene, and the OMIM id in the report matches MONDO's (269840).

    Content: 11-node pathophysiology chain from ZAP70 loss of kinase function through the TCR-proximal signalling failure to the lineage-selective CD8 thymic selection block, the peripheral CD8 lymphopenia, the anergic CD4 compartment, and the parallel tolerance-failure branch. 12 phenotypes with frequencies from the 49-patient systematic review (PMID:32431715). Two animal models with modeled_mechanisms links, including a FAILS_TO_RECAPITULATE link for the Zap70-null mouse against peripheral CD8 lymphopenia, and a HUMAN_MODEL_MISMATCH discussion for the SYK-expression species difference that causes it.

    Lump/split: curated as DISEASE. The ZAP70 combined hypomorphic-and-activating syndrome (OMIM 617006, PMID:26783323) is placed in differential_diagnoses rather than has_subtypes because it is a separate IUIS row with the opposite mechanism (hyperactive rather than absent kinase); PMID:26783323 is cited only there.

    No datasets block, deliberately: ZAP70 is a well-known prognostic marker in chronic lymphocytic leukaemia, so gene-keyed repository search returns CLL cohorts that resolve perfectly and are about a different disease, and there is no disease-specific omics series for a disorder with 49 pooled patients. Reason recorded in the entry notes.

    Validation: just validate passed (schema, terms, references) with 82/82 snippets verified against the cached references. check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms pass on the file; check-folded-hyphens, check-snippet-length and check-title-snippets pass whole-KB with no new baseline entries. Compliance 88.2% weighted; the residual gap is uncited pathophysiology edges where no source states the causal step, plus the deliberately absent datasets block.

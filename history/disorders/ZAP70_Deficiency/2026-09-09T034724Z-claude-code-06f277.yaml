  summary: 'Fix re-review findings: ZAP70 Deficiency'
  details: |
    Fixed both findings from the re-review of commit 6b75820 on PR #11501, and took the accompanying optional suggestion in the same push.

    Finding 1: wrong thymic compartment. The 'Block of CD8 Single-Positive Thymocyte Selection' node bound UBERON:0002124 (medulla of thymus) in its locations block. Positive selection of double-positive thymocytes happens in the cortex; the medulla is where the surviving single-positive cells go afterwards. The node's own two other bindings already said so - GO:0045059 positive thymic T cell selection, and CL:0000809 double-positive alpha-beta thymocyte, a cortical cell - and its description states that double-positive cells accumulate in the cortex while only CD4 single-positive cells reach the medulla. The medulla is where the absence is observed, not where the failing step occurs. Replaced with UBERON:0002123, whose label 'cortex of thymus' was confirmed against OLS rather than written from memory.

    This is worth recording as a class of error rather than a one-off. A wrong locations value is invisible to validate-terms: the CURIE exists, the label matches it, and nothing compares the anatomy against the biological process or cell type bound beside it on the same node. It is the same shape as the hgnc self-consistency blind spot this entry's own notes already document, and it was introduced while acting on a review suggestion, which is exactly when attention is lowest.

    Finding 2: the GeneReviews snippet was about a different class of vaccine. The BCG vaccination environmental entry cited PMID:20301777 with the snippet 'live viral vaccines for the infant and household contacts'. BCG is a live attenuated bacterial vaccine - the entry's own description says so - so the viral-specific avoid-list item does not substantiate withholding it, and the explanation reached the right conclusion only by dropping the word 'viral' from the source. Replaced with the general statement from the same cached record, 'delaying immunizations until immune reconstitution is confirmed', which covers all immunizations including BCG, and reworded the explanation to say why the more specific sentence was not used.

    Optional suggestion taken in the same push: GeneReviews evidence grading. All thirteen PMID:20301777 evidence items were graded HUMAN_CLINICAL, including management recommendations. Regraded nine to OTHER on the CLAUDE.md rule that expert consensus without data belongs there, and that HUMAN_CLINICAL means patients, cohorts, case reports, trials or epidemiology - none of which a management recommendation is. The split is prescriptive versus descriptive: now OTHER are the diagnostic criterion, the immunization deferral, the curative-therapy statement under the Targeted therapy heading, the supportive-care regimen, the agents-to-avoid list, the breastfeeding and CMV precaution, at-risk sib testing, the 25% recurrence arithmetic, and the surveillance schedule. Left as HUMAN_CLINICAL are the four descriptive observations of patients: the recessive inheritance mode, the later-onset dysregulated presentations, the untreated natural history, and the residual risk on conservative management. This is the same reasoning already applied to six review-style sentences from PMID:41080547 earlier in this PR. The reviewer flagged it as non-blocking and said not to churn the file for it alone; it is bundled here because a push was needed for the two findings anyway and every push costs a full re-review cycle.

    Validation: just validate and just validate-disorders pass with 110/110 snippets verified. entity-refs, causal-targets, duplicate-keys, environmental-evidence, folded-hyphens, snippet-length, title-snippets, snippet-grading, enum-values and term-cache-integrity all pass with no new baseline entries. UBERON:0002123 is newly added to cache/uberon/terms.csv by the validation run.

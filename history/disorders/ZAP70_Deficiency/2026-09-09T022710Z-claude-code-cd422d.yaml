  summary: 'Pre-PR self-review: ZAP70 Deficiency'
  details: |
    Adversarial self-review of the entry created earlier in this session, run in a fresh-context subagent against .claude/skills/dismech-pr-review before opening any PR. One critical finding, twelve important, eleven minor; all acted on except one deferred, listed below.

    Critical. The differential-diagnosis entry named IL2RG, JAK3 and IL7R under a 'T-B+NK+ SCID' label. IL2RG and JAK3 deficiency are T-B+NK-, because the common gamma chain is required for IL-15 signalling and therefore for NK development; only IL7R gives T-B+NK+. The error mattered here specifically because preserved NK cells are one of the discriminators the entry relies on elsewhere. Renamed to 'Classical SCID (IL2RG, JAK3, IL7R)' and the description now states the NK phenotypes per gene.

    Frequency errors. Chronic diarrhea carried the enteropathy figure (18.4%, OCCASIONAL) rather than the diarrhoea figure the same paper reports separately (50%, FREQUENT). Failure to thrive carried no frequency and was evidenced by a generic sentence about SCID rather than about this disease; it now cites the 43.6% figure. Decreased circulating immunoglobulin now cites the 27.3% figure that supports its OCCASIONAL band.

    Ontology fitness, not correctness. Every binding was already the canonical label for its CURIE, but two were one step too broad. GO:0045061 (thymic T cell selection) is the parent of both positive and negative selection and formally subsumed GO:0045060 used on a sibling node; replaced with GO:0045059 (positive thymic T cell selection), which is what the node and its snippet actually claim. HP:0004313 (Decreased circulating immunoglobulin concentration) replaced with HP:0004315 (Decreased circulating IgG concentration), which matches the preferred_term already written and the entry's own statement that IgM and IgA are normal. NCIT:C201466 replaced with NCIT:C46089 (Allogeneic Hematopoietic Stem Cell Transplantation), an exact match. NCIT:C121331 (Intravenous Immunoglobulin Therapy) had already been replaced with the route-agnostic NCIT:C62710 during curation. GO:0004715 modifier changed from LOSS_OF_FUNCTION to DECREASED: the claim for a null allele is quantitative, GAIN/LOSS_OF_FUNCTION on modifier is unbound, and no KB entry currently co-occurs it with functional_impact_category.

    Pathograph. One node bundled two claims and was wired to a state that contradicted its own text: 'Loss of Central and Peripheral T Cell Tolerance' asserted central and peripheral tolerance failure plus a Treg deficit, was scoped CELLULAR, bound only a thymic process, and hung DIRECT off complete signal-propagation failure while its description said the mechanism needs attenuated rather than absent signalling. Split: a new MOLECULAR node 'Attenuated Residual TCR Signaling' with PARTIAL_LOSS_OF_FUNCTION genetic_context now sits between the lesion and a renamed, thymus-scoped 'Impaired Negative Selection and Thymic Regulatory T Cell Output'. Eczematoid dermatitis was an orphan with no incoming edge despite being the second most frequent manifestation; it is now reached from the dysregulation node with its own cited edge.

    Phenotype coverage. Added five above or near the 10% threshold, all quotable from the already-cached systematic review: Pneumonia (71.4%), BCGosis (18.4%), Hepatomegaly (19.4%), Splenomegaly (13.9%), and Increased circulating IgE concentration (GeneReviews names atopy; no frequency recorded because the source gives a distribution rather than a proportion).

    Sourcing. The TREC blind spot rested on a two-patient incidental observation while the programme-level statement sat unused in a cited cache; both the '>10 year screening experience in the United States' sentence and the mechanism sentence from PMID:37313400 are now cited, in the diagnosis section and in the discussion. The EBV attribution in the cytotoxic-surveillance node was uncited and now quotes the malignancy sentence naming EBV-associated DLBCL. The differential-threshold half of the SYK explanation was asserted three times without a source; PMID:20332428 (TetZap70 inducible mouse) was fetched and cited for it. Homozygosity split, founder allele, GeneReviews 25% recurrence risk and surveillance schedule, and the breastfeeding/CMV precaution are now quoted rather than paraphrased. The IUIS row for OMIM 617006 is quoted, which turns the lump/split decision into a sourced one.

    Grading. Six evidence items quoting review-style background sentences from PMID:41080547 (each carrying a trailing citation marker to that paper's own reference list, and one of them about murine data) were regraded HUMAN_CLINICAL to OTHER. check-snippet-grading would not have caught these, since the file was internally consistent.

    Overclaiming. The SYK explanation on the CD8 lymphopenia node said the paper explains why those cells survived; it measures residual signalling, not survival, and the explanation now says so. The R170C/R192W expression claim was generalized from R170C and is now scoped to it. The T-cell-help explanation now names where the normal-B-cell-count observation is cited rather than implying its own snippet carries it.

    New content. Post-Transplant Surveillance and Corticosteroid Therapy treatments, and an 'Outcome by transplant status' progression phase carrying the mortality comparison and the age-at-transplant finding. The corticosteroid entry is scoped narrowly on purpose: the deep-research report described the pooled review's 32% figure as treatment of autoimmune manifestations, but the source sentence says those steroids were peri-transplant. The entry records the peri-transplant indication and makes no target_mechanisms link to the dysregulation node. The autoimmune arm therefore has no disease-directed treatment, which is the state of the cited literature.

    Register. Eight passages were rewritten from essayistic to knowledge-base register. One in particular asserted a diagnostic dictum ('has ZAP70 deficiency until proven otherwise') that no cited source makes; it now states what the largest review actually recommends.

    Deferred, with reason. No mappings block. mappings.mondo_mappings would be redundant against a disease_term that is already the MONDO term, and the ICD-10-CM code the report supplies would add an ICD10CM binding that leaves cache/icd10cm/hierarchy.csv stale without a 1.2 GB local build to rebuild it. The other identifiers the report gives (OMIM, UMLS, GARD) have no slot in this schema. Left for a follow-up that can rebuild the hierarchy cache.

    Also noted: the reviewer flagged that describing HP:0002846 as 'flagged as naming a different concept' overstated the report's own wording, since the validator put it in the softer bucket. The notes block now says so.

    Validation after the rework: just validate and just validate-disorders pass with 107/107 snippets verified (up from 82); entity-refs, causal-targets, duplicate-keys, qualifier-terms pass on the file; folded-hyphens, snippet-length, title-snippets, snippet-grading and enum-values pass whole-KB with no new baseline entries. Compliance 89.5% weighted, up from 88.2%.

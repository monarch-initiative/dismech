  summary: 'Address reviewer suggestions: ZAP70 Deficiency'
  details: |
    Acted on two of the three optional suggestions in the approving review on PR #11501 (ai4c-reviewer). No blocking findings were raised.

    Suggestion 1, environmental block. Added a BCG vaccination exposure with an influences_mechanisms link. The reviewer proposed targeting the 'Impaired Cellular Immunity Against Opportunistic Pathogens' node with environmental_effect: TRIGGERS; that target was not used, because it inverts the mechanism. BCG vaccination does not cause the impaired cellular immunity, it exploits it. The link instead targets the BCGosis phenotype, which BCG vaccination genuinely does trigger, and the node description says so explicitly. Only BCG was added of the four exposures the reviewer listed; CMV, non-irradiated blood products and environmental fungal exposure have no target node or phenotype in this entry to attach to, and inventing one to hold an exposure would be worse than leaving the exposure in the treatment section where it already appears.

    The exposure_term is deliberately left unbound. ECTO has no BCG or Mycobacterium bovis vaccine term. ECTO:2000129 (exposure to vaccination) resolves in OLS but is absent from the ECTO build this repository validates against, so it failed both the ontology lookup and the ExposureTerm dynamic enum when tried; the only other vaccination-adjacent hit is an Orthopoxvirus vaccinia term naming a different vaccine. The searches performed and the reason are recorded in the entry's environmental notes, per the dismech-terms rule that no term beats a bad one. environmental-term-audit reports the entry as PARTIAL, which is the accurate state.

    Suggestion 2, anatomy bindings. The reviewer named located_in, which is a Descriptor slot; the corresponding slot on Pathophysiology is locations, ranged on AnatomicalEntityDescriptor. Bound UBERON:0002370 (thymus) on both thymus-scoped nodes, plus UBERON:0002124 (medulla of thymus) on the CD8 selection node, whose description distinguishes cortex from medulla. The entry previously carried no anatomy at all.

    Suggestion 3, mappings, declined and answered on the PR. The reviewer is right that cache/icd10cm/hierarchy.csv is a speed cache and check-hierarchy-cache is advisory, so staleness costs render time rather than correctness; that part of the original deferral note overstated the cost. The remaining reason stands: adding a mapping this session cannot rebuild the cache for leaves the next page build doing a live OAK walk per breadcrumb node, and the reviewer agreed mondo_mappings would be redundant and that OMIM/UMLS/GARD have no slot in this schema. Left as a follow-up.

    Validation after the change: just validate and just validate-disorders pass with 110/110 snippets verified, up from 107. check-environmental-evidence passes as a hard gate on the new block. entity-refs, causal-targets, duplicate-keys, folded-hyphens, snippet-length, title-snippets, snippet-grading and enum-values all pass with no new baseline entries.

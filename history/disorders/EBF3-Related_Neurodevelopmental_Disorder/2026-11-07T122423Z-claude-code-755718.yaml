  summary: 'Create: EBF3-Related Neurodevelopmental Disorder'
  details: |
    New entry for MONDO:0015021 (hypotonia, ataxia, and delayed development syndrome; claim #16790). Named EBF3-Related Neurodevelopmental Disorder per the entry-naming rules: the MONDO label is phenotype-descriptive and not EBF3-specific, while the GeneReviews chapter (PMID:33956416) and recent cohort studies use the EBF3 gene-related name. Deep research: OpenScientist (Edison/falcon returned HTTP 403 for the configured key); the report passed preflight-dr with EBF3 as the canonical gene, and its claims were used as leads only. Every snippet was taken from references fetched with just fetch-reference (GeneReviews, three 2017 gene-discovery papers, later cohort, neuroradiology and urology series, and mouse Ebf3 migration studies). The pathograph runs EBF3 loss-of-function variant -> impaired DNA binding and transactivation -> defective neuronal migration (provisional, mouse evidence) -> cerebellar malformation -> vermis hypoplasia, ataxia, hypotonia, with a separate provisional branch to detrusor-sphincter dyssynergia and neurogenic bladder. ClinGen Definitive (AD) tier copied from the cached CGGV record. Validated with just validate, validate-terms, count-verified-snippets (64/64), the offline whole-repo gates and validate-disorders. Stub deleted.

  details: |
    Corrective record. An earlier history record in this branch described the conformance wiring on this entry as purely additive - 'No pathophysiology content, evidence, or ontology bindings were changed' - which was inaccurate and is corrected here. History is append-only, so the earlier record is left in place and this record supersedes its characterisation of the change.

    What actually happened: the node in question already carried a conforms_to edge to epigenetic_alterations#Altered Epigenetic Regulation of Gene Expression, the aging-hallmark module. The conforms_to slot is single-valued (range: string), so pointing that node at the new epigenetic_machinery_neurodevelopmental_dysregulation module REPLACED the existing edge rather than adding alongside it. The collision was surfaced by the duplicate-key gate during the original work, and the aging-module edge was deliberately dropped at that point; the accompanying history record simply failed to say so.

    Why the replacement is correct: this disorder is a germline lesion in a chromatin-machinery component disrupting neurodevelopment from the outset, not the age-associated, partly stochastic epigenome drift that the epigenetic_alterations module models. CLAUDE.md draws that boundary explicitly. The two modules have different explananda and a single-valued slot forces a choice between them.

    Related change in the same push: kb/modules/epigenetic_alterations.yaml notes still named this disorder as a worked conformer after the edge was removed, which made that file factually wrong. Its notes have been corrected to drop this entry and to record the scope boundary against the germline chromatinopathies. Raised by review on PR #9378, finding 2 and finding 3.

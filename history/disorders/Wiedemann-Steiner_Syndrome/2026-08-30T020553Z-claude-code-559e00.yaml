  summary: 'Deep review: publication-completeness pass (IUIS campaign)'
  details: |
    Publication-completeness deep review under the IUIS Table 2 campaign. Inventoried all 10 cited references against their caches and re-verified all snippets (128/128). The primary gap was the immune phenotype that motivates the IUIS KMT2A-deficiency listing: the entry carried only a management-level Recurrent Infections phenotype. Fetched PMID:28623346 (Bogaert 2017, full text; first multigenerational WSS antibody-deficiency kindred) and PMID:27320412 (Stellacci 2016 case report). Added a provisional 'Impaired Terminal B-Cell Differentiation and Antibody Deficiency' pathophysiology node (CL/GO-bound, IUIS row evidence) with downstream edges; added Hypogammaglobulinemia (HP:0004313), Decreased Class-Switched Memory B Cells (HP:0030388), and Impaired Specific Antibody Response (HP:0012475) phenotypes; strengthened Immune Dysfunction and Recurrent Infections with kindred and IUIS-row evidence; expanded the IVIG treatment with target_mechanisms and a Hypogammaglobulinemia target; added an Immunologic evaluation diagnosis entry (NCIT:C16723); added multigenerational-transmission inheritance evidence; updated the description to state the antibody-deficiency character of the immune arm. Fidelity-checked the five load-bearing claims (KMT2A causality, 97% DD/ID and cohort percentages, hypotonia/seizure genotype associations, prevalence band, episignature sensitivity caveat) against cached text. Validation: just validate-disorders pass, validate-terms pass, entity-refs and duplicate-keys clean.

  summary: Add imaging_findings and INRGSS staging to Ganglioneuroblastoma
  details: >-
    Adds an imaging_findings section to an entry that had none, three rows, and a stages section,
    two rows. No other section is touched.


    Imaging. Two rows are scoped to the Nodular subtype and record one case report from two
    directions. In that patient contrast-enhanced CT showed no nodular formation although urinary
    catecholamine metabolites were already high, and the authors say conventional CT and magnetic
    resonance imaging were both unhelpful for finding it; FDG PET/CT then showed the lesion with a
    recorded SUVmax, and the biopsy directed to that focus gave the nodular diagnosis the first
    biopsy had missed. Only the PET row is marked diagnostic, and its description says the imaging
    directed the biopsy rather than making the diagnosis.


    The MIBG study in that case was not negative, and the first draft of this section said it was.
    The source reports partial uptake of 123I-MIBG with the neuroblastic nodule still difficult to
    locate, so what failed was localisation, not detection. That sentence is now quoted on the row
    and the row is renamed accordingly. It is an easy error to make because the same paper
    separately reports that whole-body MIBG scintigraphy revealed no metastatic spread, which is
    about metastases and not about the nodule.


    The MIBG frequency row is the part that had to be rebuilt. The first draft took the abstract's
    34% and scoped it to the Intermixed subtype, with a note saying the series gives no separate
    figure for that subtype. The series does: Table 1 reports positive mIBG uptake in 22 of 36
    tested intermixed ganglioneuroblastoma patients, 61.1%, against 27 of 110 for ganglioneuroma,
    24.5%, and 49 of 146 pooled, 33.6%, which is what the abstract rounds to 34%. So the row carried
    a pooled figure, three quarters of whose denominator is a different disease, under a subtype
    scope, and justified it with a negative-existence claim that the cited cache's own Table 1
    disproves. The sibling Ganglioneuroma entry already quotes that table row, and this entry's own
    Elevated Urinary Homovanillic Acid phenotype already does the same thing correctly with the
    adjacent row of the same table. The row now quotes Table 1 in the idiom those two use, carries
    61.1%, and carries frequency: FREQUENT, which the omitted-frequency note had also got wrong,
    since every reading of the figure falls in that band.


    The comparator is recorded with what it contains. The 89.6% figure is 398 of 444 tested, and the
    study's controls are neuroblastoma together with nodular ganglioneuroblastoma, which is this
    entry's other subtype. The contrast is therefore between one subtype of this disease and a pool
    containing the other, and the published figure cannot be separated. That methods sentence is
    quoted on the row.


    Bindings. The first draft bound no imaging_finding_term on any row and said NCIT had no suitable
    term. That was wrong for two of the three rows. NCIT:C79553 Increased Uptake by 123-Iodine-Meta-Iodobenzylguanidine Scintigraphy sits under the
    Imaging Finding root by way of Radiologic Finding,
    was already in the committed enum cache, and is already bound for this exact concept in both
    Ganglioneuroma and Neuroblastoma; the search missed it because NCIT spells the drug
    Meta-Iodobenzylguanidine with a hyphen. NCIT:C168968 FDG-Avid Tumor is in the same branch and
    now binds the PET row. The one genuine gap is the occult-nodule row: NCIT's imaging branch does carry organ-neutral nodule terms - the Nodule Consistency, Shape, Margin
    Conspicuity and Margin Type families hang off Radiologic Finding with no organ scoping - but
    every one of them describes a nodule's appearance rather than its presence, and none names a
    failure to localise one, so none binds this row. The row is
    left unbound on substantive grounds rather than for want of any candidate. NCIT:C54243 No
    Evidence of Radiologic Finding does exist in the branch, and a first draft of this record
    wrongly said nothing did, but binding it here would misstate the case: the scan showed a large
    mass, and what was absent was a nodule within it.
    Modality stays OTHER on the MIBG row because ImagingModalityEnum has no scintigraphy value, with
    the 123I-specificity of the bound term recorded in notes, which is what the Ganglioneuroma entry
    does.


    Staging. The image-defined risk factors were first written as a fourth imaging row. They are a
    staging rubric, not an imaging appearance: the row carried no modality, no finding term and no
    spatial extent, because there was no appearance to record, and the sibling Neuroblastoma entry
    models the identical INRG content in stages rather than in imaging_findings. They are now a
    stages section, INRGSS L1 and L2, citing the INRG Task Force report for the rule and this
    entry's own ganglioneuroma and intermixed cohort for the association between risk factors and
    post-operative complications, kept at association rather than causation. The L1 description says
    pre-surgical rather than before any tissue is taken, because the same pathology review records
    that image-guided percutaneous core needle biopsies are increasingly used.


    One grading correction. The case report's introductory sentence about the nodule being hard to
    detect was graded REVIEW_SYNTHESIS. The publication is a case report, not a review, so it is
    BACKGROUND, and INDIRECT rather than DIRECT because a general statement of difficulty is cited
    in support of a specific case finding. The review that genuinely is one, the pathology review,
    keeps REVIEW_SYNTHESIS.


    A tension is named rather than hidden. This entry's differential diagnoses already cite that
    pathology review saying the nodule is often haemorrhagic or necrotic and detected by radiology
    images, which points the other way from the case report's experience. The row's notes say so; no
    cited source reconciles them and neither claim is a frequency.


    Nineteen evidence items across five references, all already committed in references_cache. No
    reference was fetched. The only cache change is one additive row each in cache/ncit/terms.csv
    and the imagingfindingterm enum cache for NCIT:C168968.


    Validation: just validate passes; just count-verified-snippets reports 130/130 for the whole entry; just validate-terms and just check-snippet-grading pass.


    A second verification round found four further substantive problems and corrected this record on
    four counts. The occult-nodule row said the subtype is defined by a nodule inside a stroma-rich
    tumour and called that nodule a clone: the background may be stroma-rich or stroma-dominant, the
    cited case had the stroma-dominant one, and whether the nodule is a genetically distinct clone
    is an open controversy this entry records separately. The PET row was marked diagnostic although
    the slot means pathognomonic or criterion-defining and the row's own explanation says the
    imaging directed the biopsy rather than making the diagnosis; it is now false. The Stage L1
    description made two claims no snippet carried, both of which were already in committed caches
    and are now quoted. And the staging section stopped at L2 while the entry uses stage M
    elsewhere, so Stage M is added from the same already-cited Task Force report.


    Review round. One explanation had the disagreement between two cited sources the wrong way
    round: it said the pathology review reads the haemorrhage-and-necrosis half of the sentence
    differently, where in fact the two sources agree on that and differ on whether conventional
    imaging detects the nodule. The row's own notes already said it correctly. Two non-blocking
    suggestions are taken as well: the case report gives the nodule's maximum standardized uptake
    value as 4.20 in its results and 4.10 in its discussion, which the row now says so a reader does
    not read it as a transcription error; and the bound NCIT term describes a whole tumour where this finding is a focal hot spot, which the
    row now states rather than leaving to the preferred term. Second review round, and it reverses
    part of the one above. Two figures taken from the reviewer's suggestion were misread, and both
    are now removed. The case report's discussion gives SUVmax 4.10 for the neuroblastic nodule and
    2.02 for ganglioneuroma tissue, each carrying its own citation marker and each naming a tissue
    type rather than this patient: they are published values the authors cite to explain why the FDG
    contrast worked. The only value measured in this patient is 4.20. So the entry had turned a
    cited class-level figure into a patient measurement and had accused the source of contradicting
    itself; it now quotes the discussion sentence instead and says what the two figures are. Four
    further prose claims went the same way: a comparison of how hard the two backgrounds are to
    search that no cited source makes, a claim about the whole literature citing the German series
    that cannot be checked, a dropped 'often' that turned a difference of emphasis into a
    contradiction, and 'uptake tracks maturity' for a relation that runs inverse and whose ordering
    this entry does not quote. Two bindings-side corrections: this record's own claim that NCIT has
    no organ-neutral nodule term was false as worded and is rewritten to the real reason, and the MIBG preferred term had dropped 'increased' as well as the isotope, so it is restored - the
    isotope stays out, because this entry's source does not name one where the Neuroblastoma entry's
    does. Stage MS also gains a row of its own. The stage M row had been defining it in passing,
    because the Task Force defines the two in one sentence, which left the entry naming a stage it
    did not carry.

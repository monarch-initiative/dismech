  summary: Telomere maintenance mechanism activation in ganglioneuroblastoma
  details: |
    First item of the ganglioneuroblastoma follow-up list the Q PR (#15139) left open, and the only one on that list for which a source was already named.

    Adds one pathophysiology node for telomere maintenance, sourced entirely from PMID:41858373, a Japanese series of 321 neuroblastic tumours including 48 ganglioneuroblastomas and 18 ganglioneuromas. Three evidence items: both maintenance routes measured with their denominators, the combined positive figure and its concentration in the nodular subtype, and the ATRX-alteration contrast that justifies binding ATRX beside TERT.

    Three judgements, all recorded in the node's notes rather than left implicit.

    One node rather than two. Neuroblastoma models telomerase activation and alternative lengthening as separate nodes, which its larger evidence base supports. Here the single series that measured them in ganglioneuroblastoma reports both and defines its positive group as either one, so splitting them would assert a distinction this evidence does not make. The notes say to split when a second series makes the two separately characterisable.

    No causal edge to or from the nodular subtype node. What the paper reports is enrichment within a histological subtype, 10 of 21 nodular cases positive, not one mechanism producing the other, and the subtype is already carried structurally in has_subtypes. An edge would misstate the relation.

    The paper's chromosomal-aberration findings are deliberately not cited. It reports frequent 7q gain, 17q gain and 11q loss in ALT-positive tumours, and the standing record-level fence excludes 11q and 17q evidence from anywhere outside the original segmental-aberration PR. Omitting that sentence costs nothing here, and the notes say why it is absent so the next curator does not read the gap as an oversight.

    Two scope facts a reader needs. The TERT denominators are smaller than the ALT ones, 31 of 48 ganglioneuroblastomas and 7 of 18 ganglioneuromas, so the two routes were not tested in the same number of tumours; the first evidence item's explanation says so. And the absence of alternative lengthening in ganglioneuroma rests on 18 cases from one country in children under 10, which is why the node is PROVISIONAL and why neither the proportions nor that absence should be read as population estimates.

    Terms: GO:0007004 and GO:0000722 were read from cache/go/terms.csv and confirmed in the biological-process enum cache; both are the terms Neuroblastoma already binds for the same two routes, so the two entries stay comparable. TERT (hgnc:11730) and ATRX (hgnc:886) were copied from their existing bindings in Neuroblastoma.yaml rather than written from memory. conforms_to points at enabling_replicative_immortality#Telomere Maintenance Reactivation, the module node Neuroblastoma's telomerase node already uses, confirmed present in that module file.

    Still open on the follow-up list, and each needing its own fetched source: MIBG uptake, intraspinal extension, site-specific signs, VIP secretion, and opsoclonus-myoclonus. All five are genuinely absent from the entry. The ALK row remains blocked on #14976 Question 2.

    Review round 1 corrected a sentence that read the source backwards. The description's last clause said the low TERT-rearrangement frequency was "the pattern expected if the recombination route rather than an enhancer-hijacking route predominates here". That was an inference, the paper does not make it, and its own counts contradict it: alternative lengthening in 6 of 48 against raised TERT in 7 of 31 tested are comparable rates, so neither route predominates. The authors' actual claim is narrower and about the TERT-high subset only, that those tumours raise TERT by some mechanism other than the rearrangement and promoter mutation seen in MYCN-not-amplified neuroblastoma, and they do not say which. The description now states that, a fourth evidence item quotes the sentence it comes from, and the explanation records that the replacement mechanism is unnamed because the paper does not identify it.

    Two further changes from the same round. A KNOWLEDGE_GAP discussion now attaches to the node, recording that the series calls the clinical significance of telomere maintenance in ganglioneuroblastoma not yet assessable for want of follow-up. That is the reason the node has no edge to an outcome node, and it is worth stating because the pull is to carry the neuroblastoma prognostic meaning across on the strength of the shared mechanism and the comparable nodular rate. It is an absence of evidence, not a negative result: the authors do not report that telomere maintenance fails to predict outcome there.

    No cell type is bound, and the notes now say why rather than leaving it unexplained. The assays were run on bulk tumour nucleic acid, and a ganglioneuroblastoma is by definition a mixture of neuroblastic, ganglionic and Schwannian components, so a bulk measurement cannot localise the activity to one of them. Binding the neoplastic neuroblast would assert a localisation the assay does not resolve, and in this entry that is close to the question the Schwannian-stroma-origin discussion already records as unsettled.

    Validation: all 18 C4 gates pass, plus check-reference-titles-present, check-logical-rules and check-qualifier-terms. validate-disorders reports 92 of 92 snippets verified before the review round. No validator churn in tracked references_cache files on either run.

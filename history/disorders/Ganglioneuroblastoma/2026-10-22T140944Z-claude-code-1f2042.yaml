  summary: 'Edit: Ganglioneuroblastoma - drop a weak evidence item from the resection
    link (review of #15207)'
  details: |
    Answers the optional suggestion in the AI review of #15207. The Surgical Resection -> Neoplastic Neuroblast Population link (INHIBITS) carried a PMID:19530234 item quoting the Table II definition of complete resection, which reports no outcome. Removed it, together with the link description's sentence restating that definition; the definition remains cited in the treatment-level evidence. The reviewer's other option, replacing it with the same paper's nodular-subset result, was not taken: that series found complete resection numerically better but not significantly so in nodular unfavourable tumours (5-year EFS 83.4% vs 60.6%, p = 0.2227; 24.3% vs 5.4%, p = 0.1068), so a REFUTE item on the link would overstate it; the result stays in the treatment description and its evidence. The link keeps its two PMID:27465021 outcome items. Validated with just validate, validate-terms, count-verified-snippets --strict, the offline gates and validate-disorders.

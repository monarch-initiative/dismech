  summary: 'Create: Ganglioneuroblastoma (intermixed and nodular subtypes)'
  details: |
    New entry for ganglioneuroblastoma (MONDO:0005035; NCIT:C3790 exact match), the peripheral neuroblastic tumour between neuroblastoma and ganglioneuroma, covering both INPC categories as has_subtypes: Intermixed (MONDO:0003326; NCIT:C42057) and Nodular (MONDO:0003325; NCIT:C42058). Scope: MONDO and NCIT define the class by a Schwannian stroma making up more than half of the tumour volume, which the INPC applies only to the intermixed category; the description and the MONDO mapping justification say so. Central nervous system ganglioneuroblastoma (NCIT:C92629) and Hirschsprung disease-ganglioneuroblastoma syndrome (MONDO:0013082) are out of scope.

    Content: INPC definitions of both categories, with the rule that the favourable/unfavourable grouping is made on tissue taken before chemotherapy or irradiation (both histopathology findings, NCIT:C42062 and NCIT:C42066); a diagnosis row (NCIT:C18190 Histopathologic Examination) for the whole-tumour ideal and the limited-material reporting practice; biopsy-resection concordance in localized intermixed tumours; the nodular favourable/unfavourable criteria, their origin (Umehara 2000, confirmed by the INPC committee in 2003), the metastatic-site variant, and INRG and CCG/COG outcomes; subtype outcomes. Four pathophysiology nodes (neoplastic neuroblasts; maturation into ganglion cells; Schwannian stromal development; the stroma-poor nodule) with evidenced edges, including in vitro Schwann cell and neuroblast crosstalk (conditioned medium, EGFL8, PEDF). Phenotypes: abdominal and posterior mediastinal mass, distant metastasis at diagnosis (nodular; HP:0002664 with NO_HPO_TERM and a term gap), congenital Horner syndrome (Orphanet), elevated urinary HVA and VMA in intermixed tumours (German NB97/NB2004, Table 1). Biochemical: NSE and serum ferritin (He 2017). Genetic: MYCN amplification as a rare somatic biomarker, with the single-centre 14% nodular figure explained as one amplified tumour. Treatments: watchful observation, tumour resection, risk-adapted chemotherapy within neuroblastoma risk-group protocols. Discussions: two CONTROVERSY items, the origin of the Schwannian stroma and the clonality of the nodule, each with a stated SUPPORT/REFUTE convention.

    Not included, on purpose: the ALK germline row Orphanet lists, because how a tumour entry links to a separate predisposition disease (MONDO:0013083) is the open question in #14976; the entry notes say so. No stages: block and no invasion_and_metastasis conformance: ganglioneuroblastoma is staged with the neuroblastoma INSS/INRGSS systems, whose stage definitions are in Neuroblastoma.yaml, and no node here describes dissemination. MIBG uptake, intraspinal extension, stridor, superior vena cava syndrome, VIP-related diarrhoea, hypertension and opsoclonus-myoclonus are left for a later clinical-features pass.

    Sources: a claude_code deep-research report (research/Ganglioneuroblastoma-deep-research-claude_code.md) used as leads; every evidence item quotes the cached abstract or full text. Cooperative-group overlaps (Umehara, Peuchmaur and Okamatsu; INRG with COG) are stated in the explanations. Before the PR, a four-lens pre-review with two adversarial verifiers per finding upheld 28 of 36 findings (23 by both verifiers); their fixes were applied, except the ALK row described above. Validation: just validate, validate-terms, count-verified-snippets (83/83), validate-disorders (83 snippets, 83 titles, 0 issues), prose-figure audit with no unsupported figure, and the whole-KB offline gates. 83 evidence items from 23 references.

  summary: 'Edit: Ganglioneuroblastoma, anchor the telomere node to both module routes'
  details: |
    The Telomere Maintenance Mechanism Activation node binds telomere maintenance via telomerase (GO:0007004) and via recombination (GO:0000722), because the one series that measured them in ganglioneuroblastoma defines its positive group as either route; the node's notes record that choice. It conformed only to the module's telomerase node, since the recombination node did not exist when the node was curated. It now lists both enabling_replicative_immortality#Telomere Maintenance Reactivation and enabling_replicative_immortality#Telomere Maintenance via Recombination in the list form of conforms_to. check-conformance-content reports edges_absent for both anchors because the node has no downstream edges; main already reported that finding for the telomerase anchor, and it is not addressed here because drawing the edge needs a downstream node the entry does not have. Validation: validate-disorders, the C4 gate set including the kb pytest lane, validate-terms, check-logical-rules, check-cache-order and check-name-collisions pass, and validate-module-batch passes for the module.

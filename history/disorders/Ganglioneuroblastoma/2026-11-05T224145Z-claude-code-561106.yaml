  summary: 'Edit: Ganglioneuroblastoma, wire the urinary catecholamine phenotypes
    and the telomere module edge, add GSE7529'
  details: |
    Wires the two urinary catecholamine phenotypes (raised homovanillic and vanillylmandelic acid, previously ISOLATED) and the telomere maintenance node's missing module edge. Causal in-link coverage goes from 4 of 6 to 6 of 6 phenotypes, and check-conformance-content no longer reports edges_absent.

    New node Tumoral Catecholamine Secretion (GO:0050432, INCREASED), mirroring the node of that name in the ganglioneuroma entry but sourced from ganglioneuroblastoma reports only: an infantile case whose epinephrine and norepinephrine excess fell after subtotal resection (PMID:41891982) and a dopamine-secreting case whose urinary dopamine tracked recurrence (PMID:16390613). Its two edges to the urinary phenotypes (INDIRECT_KNOWN_INTERMEDIATES, as in ganglioneuroma) cite an adult catecholamine-producing ganglioneuroblastoma with raised vanillylmandelic acid (PMID:30225726, VMA edge only), a nodular ganglioneuroblastoma with both metabolites raised (PMID:29720264), and a stage M cohort in which both fell with MIBG avidity (PMID:33885033, graded INDIRECT). The ganglioneuroma entry's own evidence was not reused, because it concerns ganglioneuroma. No cell type is bound.

    New node Unlimited Replicative Potential (GO:0008283, conforms to enabling_replicative_immortality#Replicative Immortality, PROVISIONAL), reached from Telomere Maintenance Mechanism Activation by the edge the module node carries. The edge cites the neuroblastoma cell-line finding already used for the same edge in the neuroblastoma entry (PMID:32291317, IN_VITRO, INDIRECT), with the explanation naming the step from neuroblastoma lines to ganglioneuroblastoma. The module node's second edge, to Telomerase as a Near-Universal Target, is not copied: that node is a therapeutic-target node and the entry records no telomerase-directed treatment. The downstream block was added at the end of the telomere node, leaving its conforms_to line untouched.

    New dataset geo:GSE7529 (PMID:18671248): 19 whole neuroblastic tumours including three ganglioneuroblastomas, with laser-microdissected neuroblastic and Schwannian stromal areas; counts taken from the GEO sample titles. geo:GSE147635 was checked and not added: its stroma-rich samples are six ganglioneuromas and no ganglioneuroblastoma, so it belongs in the ganglioneuroma entry. The CIViC EID11854 row waits for the CIViC cache work, and the ALK row stays out.

    Searches (PubMed, 2026-11-05): ganglioneuroblastoma[tiab] AND catecholamine*[tiab] (65 hits); ganglioneuroblastoma[tiab] AND (vanillylmandelic[tiab] OR homovanillic[tiab]) (18); the first with resection or normalization terms (17). Validation: just validate, validate-terms, count-verified-snippets (114 of 114) and verify-datasets pass.

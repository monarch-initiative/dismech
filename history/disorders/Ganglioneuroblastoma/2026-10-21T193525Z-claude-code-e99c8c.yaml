  details: |
    Answers the first AI review of #15139 (approved, four optional suggestions). (1) The edges Neoplastic Neuroblast Population -> Abdominal Mass and -> Posterior Mediastinal Mass had no evidence; each now cites the Orphanet site clause (ORPHA:251877) and the Memorial Sloan Kettering site sentence (PMID:37243318), graded INDIRECT because both name a primary site rather than a mass. (2) Surgical Resection now has target_mechanisms to Neoplastic Neuroblast Population (INHIBITS), citing the CCG/COG definition of complete resection (PMID:19530234, Table II) and two German NB97/NB2004 results (PMID:27465021): resection, even with residuals under 2 cm, was sufficient for localized ganglioneuroma and intermixed ganglioneuroblastoma, and residuals over 2 cm went with worse event-free survival, for intermixed tumors on their own too. All three are graded INDIRECT: a definition of tumor volume removed and a treatment outcome bear on the neoplastic neuroblasts only by inference. The risk-adapted chemotherapy row is not linked: the two cited sources that report tumor response to chemotherapy both concern intermixed tumors and found little or no response (German NB97/NB2004 series: any response in only 3 of 9 treated patients, none complete or very good partial; Phoenix series: no significant tumor reduction in 4 treated patients), and no cited source reports response data for nodular tumors. Not changed: the urinary HVA and VMA phenotypes stay without an incoming edge, because the sources report them as readouts without a mechanism; the ganglioneuroblastoma telomere-maintenance study suggested by the reviewer (PMID:41858373) is left for a later pass. A three-lens check of this change, with two adversarial verifiers per finding, regraded the resection evidence from DIRECT to INDIRECT and corrected the wording of the chemotherapy reason before it was pushed. Validation: just validate, count-verified-snippets (90/90), validate-disorders, and the offline gates.

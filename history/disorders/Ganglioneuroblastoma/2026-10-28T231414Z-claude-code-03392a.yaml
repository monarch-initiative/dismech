  summary: 'Differential diagnoses: ganglioneuroma and neuroblastoma'
  details: |
    Adds the entry's first differential_diagnoses section, directly after diagnosis:, with two rows; no other line of the file changes (the change is a pure addition of 334 lines). Part of the neuroblastoma expansion series (issue 15822).

    Ganglioneuroma (MONDO:0005033): the INPC line between the two. Intermixed ganglioneuroblastoma is more than 50% ganglioneuromatous tissue with well-defined microscopic neuroblastic nests whose neurites are segmentally naked, while ganglioneuroma has individually scattered maturing or mature ganglion cells and no naked neurites; the INPC maturing subtype of ganglioneuroma is the group the Shimada system called 'ganglioneuroblastoma, well differentiated', and core needle biopsy is at a disadvantage with a nodular tumour. Sources: the 2026 Conces/Shibui/Shimada review (PMID:41612478), the Shimada 1999 INPC terminology paper (PMID:10421272), and the Okamatsu 2009 CCG/COG series and its Table I definitions (PMID:19530234). The row binds MONDO:0005033 only and does not name the separately curated Ganglioneuroma entry; the renderer links differential rows by MONDO id.

    Neuroblastoma (MONDO:0005072): neuroblastoma is stroma-poor, nodular ganglioneuroblastoma is a composite, neuroblastoma at one site with intermixed ganglioneuroblastoma or ganglioneuroma at another is read as the metastatic-site variant of nodular ganglioneuroblastoma, and in the MSK series a biopsy diagnosis of intermixed ganglioneuroblastoma in stage M disease was not confirmed at resection in 67% of samples. Sources: PMID:10421272, PMID:41612478, PMID:19530234 Table I, and PMID:37243318 (sentences already in the file, reused with their existing gradings).

    No schwannoma row: no quotable source names schwannoma or a peripheral nerve sheath tumour as a differential of Schwannian-stroma-rich neuroblastic tumours. Two radiology reviews (PMID:12533638, PMID:9367479) support only a site and imaging grouping of neurogenic tumours, so the row was left out as the brief required and those caches are not committed.

    The MONDO:0005033 label-cache row is byte-identical to the one in PR 15862 (Ganglioneuroma entry), so the two PRs merge cleanly in either order. Validation on the branch rebased onto main: the run_c4 gate set (validate-disorders, count-verified-snippets --strict, check-snippet-grading and the whole-repo gates), check-reference-titles-present, check-cache-order, check-logical-rules and check-qualifier-terms all passed.

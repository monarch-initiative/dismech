  summary: 'Create: Bannayan-Riley-Ruvalcaba Syndrome'
  details: |
    De novo curation of BRRS as a standalone entry, paralleling the existing Cowden_Syndrome entry (both are PHTS subtypes; BRRS previously existed only as a ~20-line subtype stub inside PTEN_Hamartoma_Tumor_Syndrome). Deep research: claude_code provider (research/Bannayan-Riley-Ruvalcaba_Syndrome-deep-research-claude_code.md; 27 web searches, 24 citations, 998s). DR output was treated as leads only: every PMID was independently fetched and every snippet verified as an exact substring of the cached abstract or full text. DR-suggested figures were re-derived from the cached source rather than copied; where the report gave a percentage, the underlying count was quoted instead (e.g. genital macules curated as 21/28 male reports). GeneReviews baseline: PMID:20301661 (PTEN Hamartoma Tumor Syndrome) fetched, tagged, and cross-referenced; the BRRS core tetrad and full surveillance schedule are curated from it. Five-node pathograph from germline PTEN loss through PIP3/PI3K-AKT-mTOR hyperactivation to hamartomatous overgrowth, neurodevelopmental dysregulation, and lifelong multiorgan cancer predisposition, with no orphan nodes. Central curated insight: PTEN-positive BRRS and Cowden syndrome are allelic, so a childhood BRRS diagnosis obligates lifelong Cowden-equivalent cancer surveillance; the entry records via PARTIAL evidence that this risk is inferred from allelism and has not been confirmed in BRRS-ascertained cohorts. Honest negative-result curation: the everolimus phase II RCT (PMID:35594551) missed its primary neurocognitive endpoint, curated with supports REFUTE so mTOR inhibition reads as investigational rather than established. TTN curated as SUSCEPTIBILITY (not CAUSATIVE) per the authors own candidate-gene framing. Two KNOWLEDGE_GAP discussions with proposed experiments cover pediatric-ascertained cancer risk and the PTEN-mutation-negative 40 percent. Validation: schema clean, term validation passed, 95/95 snippets verified against cached references, compliance 89.3 percent global / 89.7 percent weighted. A pre-PR red-team self-review was run in a fresh-context subagent; it raised 3 blocking findings (macrocephaly frequency band anchored on the wrong statistic, AVM phenotype asserted on evidence that only said vascular malformations, hypotonia evidence that never mentioned hypotonia) and these were fixed by re-quoting already-cached full text. Also from that review: ascertainment caveat added to the PTEN detection rate (60 percent classic vs 75/83 modern), cancer risks reframed as cross-cohort ranges, autism band choice documented explicitly, the historical-absence cancer snippet retyped from PARTIAL to NO_EVIDENCE, and sirolimus added as the lesion-directed mTOR use distinct from the negative neurocognitive everolimus trial.

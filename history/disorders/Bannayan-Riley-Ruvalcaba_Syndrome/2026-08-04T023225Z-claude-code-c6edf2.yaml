  summary: 'Address PR review: split bundled node, add PHOST, hypotheses, 10q23 subtype'
  details: |
    Addressed all five IMPORTANT items from the ai4c-reviewer review of PR #7916. (1) Split the bundled Neurodevelopmental Overgrowth and Dysregulation node into two atomic nodes along the seam its own description declared: Neural Progenitor Overgrowth and Brain Enlargement (structural, downstream Macrocephaly) and Synaptic and Circuit Development Dysregulation (functional, downstream developmental delay, autism, intellectual disability, hypotonia). (2) Added mechanistic_hypotheses with three groups wired to causal edges via hypothesis_groups, verified programmatically so no group is unused and no reference dangles: canonical_pi3k_akt_mtor CANONICAL, pten_nuclear_localization_split EMERGING (the where-not-how-much model for the autism-versus-cancer divergence, evidenced only from the cytoplasmic-predominant Pten mouse and therefore typed MODEL_ORGANISM plus PARTIAL), and pi3k_independent_overgrowth EMERGING for the TTN/FAK arm. (3) Added a PTEN Hamartoma of Soft Tissue Formation node from Kurek PMID:22446940 and Tan PMID:17526801, which closes the pathograph join-point defect the reviewer found: the sirolimus treatment previously targeted the abstract signaling node because no lesion node existed, and now targets the lesion it actually acts on. (4) Added a has_subtypes entry for the 10q23 contiguous-gene deletion spanning PTEN and BMPR1A from PMID:18510548, including a REFUTE evidence item against the deletion-size-predicts-severity model. (5) Expanded the diagnosis section with the tiered testing strategy (MLPA and chromosomal microarray for deletions invisible to sequencing, PTENP1 pseudogene cross-amplification) and enriched the mutation-negative knowledge gap rationale with the established explanations it lacked, including KLLN promoter hypermethylation from PMID:21177507. Also took the peripubertal-onset suggestion for penile freckling so the diagnostic flag reads as specificity-when-present rather than screening sensitivity. Declined one suggestion with reason: OMIM and ORPHA identifiers cannot be added under mappings because DiseaseMappings only defines icd10cm, icd11f, mondo, and ncit slots. Validation: schema clean, term validation passed, 112/112 snippets verified (up from 95/95), compliance 89.5 percent global and 89.7 percent weighted, 7 pathophysiology nodes with no orphans and no unresolved downstream targets, folded-hyphen and snippet-length baselines pass.

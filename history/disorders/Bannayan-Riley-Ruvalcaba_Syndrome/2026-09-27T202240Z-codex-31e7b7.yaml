  summary: Review BRRS clinical scope, mechanisms, models, trials, and
    surveillance using cached full texts
  details: |
    Reviewed the complete original entry, both existing CREATE/EDIT histories, the matching deep-research report and citation sidecar, and the underlying cached evidence. This is a noninfectious Mendelian phenotype and was eligible for the review sweep. The branch was created from current main and rebased before edits.

    The eight-dimensional content review found and corrected substantial overstatement and under-consumption:
    1. Phenotypes: corrected macrocephaly to the patient-level 77% estimate rather than 32/33 publications; qualified other publication-count denominators; removed a BRRS-specific autism frequency derived from heterogeneous PTEN cohorts. Added musculoskeletal, thyroid, skin, developmental, seizure, and polyp-complication findings. Penile macules are no longer described as exclusively peripubertal or as proof that all genital lentigines are male-limited. Human findings remain distinct from model observations.
    2. Subtypes: retained the PTEN/BMPR1A contiguous-deletion overlap with variable severity. Bound the chromosome 10q23 deletion concept while explicitly noting its broader interval scope; did not relabel all deletion carriers as severe infantile juvenile polyposis. Added verified differential-diagnosis bindings.
    3. Mechanisms: separated PIP3 accumulation, AKT activation, and mTOR overactivity. Used primary PTEN biochemical evidence. Removed the claim that every BRRS feature is explained by one signaling chain. Distinguished PHOST from other vascular lesions and added its histology and MRI findings. Removed universal second-hit dependence and thyroid autoimmunity as a downstream consequence of cancer predisposition. Reframed Ptenm3m4 findings as combined localization/dosage effects, not a human autism-versus-cancer discriminator; isolated microglial activation/pruning observations from unproven human behavioral causality. TTN cell findings are an explicitly provisional, separate branch.
    4. Treatments/trials: separated 2025 international and 2026 ERN GENTURIS surveillance schedules instead of blending their conflicting renal, thyroid, and endometrial recommendations. Added the completed everolimus trial and the sirolimus colon-polyposis trial with its 2025 results, two completers among five participants, unchanged polyposis stage, and treatment-limiting toxicity. Preserved the negative everolimus primary endpoint and exploratory nature of secondary findings. Added individualized risk-reducing surgery discussion, polyp management, rehabilitation, and contemporary GeneReviews developmental support. Drug targets are mTOR rather than an unproven direct PHOST-lesion inhibition claim.
    5. Genetics: distinguished clinically diagnosed BRRS from PTEN-confirmed PHTS; corrected the de novo denominators (20/187 versus 20/42 with informative family testing). Added recurrent PTEN nonsense variants with transcript context and source-classification caveats. Added structural-variant yield and technical testing considerations. Removed KLLN methylation as an established BRRS cause or routine diagnostic test; TTN remains a candidate association rather than an established diagnostic locus.
    6. Diagnostics: expanded the sequence/copy-number/promoter testing approach, PTENP1 assay caveat, and PHOST imaging/pathology recognition. Clinical absence of age-dependent manifestations does not exclude BRRS. Cancer-risk estimates are not automatically extended to PTEN-negative clinical cases.
    7. References: used the available full scientific texts of the BRRS systematic review, GeneReviews chapter, PHOST pathology study, PTEN cancer cohorts/reviews, de novo study, TTN study, localization and microglial models, everolimus trial, and current cancer guidelines. Reviewed the 2024 review's image-only phenotype table independently of its publication counts. The initial older HTML GeneReviews cache was superseded for new management/genetics evidence by a newly fetched July 2026 PDF; the PDF's autogenerated URL title is retained rather than hand-edited. The 2025 sirolimus paper was discovered through the live registry and read in full including its table. Review synthesis and primary model/clinical results are distinguished with quote_role and evidence_source.
    8. Overall consumption: added one whole-animal model, three non-animal experimental systems, a verified GEO transcriptomic dataset, three structured variants, two clinical trials, and PHOST pathology/imaging. Model-to-mechanism links state what the experiments measure. GSE59318 is mouse transcriptomic data, not a human cohort. Remaining uncertain claims (including TTN causality, human pruning-behavior causation, and BRRS-ascertained cancer incidence) are explicitly limited rather than promoted to established facts.

    Source-specific cautions: the ASD meta-analysis mixes recruitment designs and, in two cohorts, clinical diagnoses without identified PTEN variants; its publication-bias-adjusted estimate differs from its headline estimate. The July 2026 GeneReviews chapter uses age four versus seven for earliest thyroid cancer in different sections and calls the everolimus study a crossover trial; neither inconsistency was propagated (primary publication and registry specify parallel allocation). The sirolimus paper's trial-stopping language concerns recruitment before its target was met; the registry's current status is COMPLETED. The sirolimus Table 1 prints 10% for several one-of-five categories; these inconsistent percentages were not imported. No new cache file was hand-authored; all new/refreshed caches were generated with the reference fetcher, and GEO was verified with the dataset recipe.

    The original entry's nosological/process note was reviewed. Its useful disease-level point, overlap between BRRS and PHTS/Cowden with molecularly informed surveillance, is retained in concise disease prose. The previous argument that a childhood BRRS label itself always obligates Cowden-equivalent cancer surveillance was narrowed to molecularly confirmed PHTS. No repository-wide lumping/splitting or schema change is made by this review.

  summary: Bind the defining measurement and its guideline thresholds as LOINC measurements
  details: |
    Extended the existing pure-tone audiometry row with the panel LOINC:89015-2 and the per-ear 4000 Hz threshold codes LOINC:89022-8 and LOINC:89023-6, and added the Coles, Lutman and Buffin 2000 guideline abstract (PMID:10971532) naming the notch as diagnostic requirement R3. No reference range: the notch is a depth relative to neighbouring frequencies, not a cut-off on the 4000 Hz value, and neither that abstract nor the cited review PMID:33129267 gives a numeric notch criterion. WHO grades not added because the entry describes NIHL by audiometric pattern, not severity.

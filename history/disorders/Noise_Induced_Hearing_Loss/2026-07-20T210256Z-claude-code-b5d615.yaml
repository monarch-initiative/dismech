  summary: 'Create: Noise Induced Hearing Loss'
  details: |
    De-novo curation of Noise Induced Hearing Loss (MONDO:0013098) as an environmental-exposure disease. Deep research via the claude_code provider (research/Noise_Induced_Hearing_Loss-deep-research-claude_code.md). Built an intentionally unbundled pathophysiology of 10 single-step nodes: acoustic overexposure branches into three separable arms - (1) direct mechanical organ-of-Corti disruption, (2) cochlear oxidative stress, (3) cochlear vascular compromise and ionic-homeostasis disruption - with the oxidative arm feeding glutamate excitotoxicity -> cochlear synaptopathy, and the hair-cell arms converging on outer-hair-cell death -> permanent threshold shift, while the neural arm (synaptopathy -> spiral ganglion neuron degeneration) converges on a distinct suprathreshold coding deficit (hidden hearing loss) endpoint rather than on the audiogram. Five nodes conform to the sensorineural_hair_cell_loss module. Evidence anchored to 8 verified PMIDs (27916698 Kurabi mechanisms review; 9674603 Puel guinea-pig excitotoxicity; 19906956 Kujawa-Liberman mouse synaptopathy; 33883202 Wu-Liberman human temporal-bone neural degeneration; 25620313 Kopke NAC RCT; 33129267 Chen epidemiology; 35903368 genetics review; 25880434 Nox3 GWAS). Added polygenic (HP:0010982) SUSCEPTIBILITY genetics (NOX3/KCNQ4/CAT with gene-specific variant snippets), worldwide prevalence, treatments (protection, hearing aids, cochlear implant, investigational NAC with PARTIAL/REFUTE evidence), and a HUMAN_MODEL_MISMATCH discussion on the otoprotectant animal-to-human translation gap. Ran a fresh-context red-team review before finalizing; its findings drove fixes: corrected the speech-in-noise phenotype term (HP:0002465 -> HP:0001963 Abnormal speech discrimination), added a human tinnitus source, replaced a self-undermining high-frequency-loss snippet, split the over-bundled oxidative/vascular/ionic node, and rerouted the neural arm off the threshold-shift endpoint. All 29 evidence snippets verified as exact substrings; schema/term/reference validation, graph, and CI-style checks pass. Seeded DiseaseTerm enum cache with MONDO:0013098.

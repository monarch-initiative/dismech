  summary: 'Add occupational/exposure classifications: Noise_Induced_Hearing_Loss'
  details: |
    Added disease-level occupational nosology assignments and, where applicable, agent-level exposure classifications, as worked examples for the new ILOOccupationalDiseaseEnum / EUOccupationalScheduleEnum classification slots and the ExposureClassifications container on Environmental.

    ILO List of Occupational Diseases (revised 2010): item 1.2.1 (hearing impairment caused by noise), a physical-agent item with no organ-system counterpart
    European schedule of occupational diseases (Rec. 2003/670/EC as amended): Annex I item 503 (Hypoacousis or deafness caused by noise)

    Also added harrisons_chapter DISORDER_OF_EAR and ENVIRONMENTAL_EXPOSURES, the entry previously having no classifications block. Exposure classifications on the noise entry: hazard type PHYSICAL, route UNKNOWN (route of exposure is a toxicological concept for agents taken up into the body and does not apply to acoustic energy), durations CHRONIC and ACUTE (acoustic trauma), exposome domain SPECIFIC_EXTERNAL. No IARC or GHS value: those instruments classify chemical agents.

    No evidence blocks were added: a nosology placement is a definitional taxonomy mapping rather than an empirical disease claim, so provenance is recorded in per-assignment notes (revision, item number, annex), following the convention already used for ICIMD and ISDS assignments. No new PMIDs cited and no reference-cache changes.

    Validated with linkml-validate against the Disease class (No issues found), plus tests/test_occupational_classifications.py and the full tests/test_data.py suite.

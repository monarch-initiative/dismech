  summary: 'Review round 1: local invasion, nodal metastasis, Kadish staging and chemotherapy'
  details: |
    Round one of review. Five content gaps and four suggestions, all addressed in this push. Every one was fillable from PMID:37909011, which the pull request already committed as full text, so no new research was needed.

    Added a Local Invasion of the Skull Base and Orbit pathophysiology node, conforming to invasion_and_metastasis at its Local Invasion and Intravasation node, between the mass node and three new phenotypes. Added Cervical Lymph Node Metastasis bound to HP:0025289, with both the 10 to 33 per cent overall figure and the separate 5 to 8 per cent at diagnosis rising to 20 to 25 per cent later, because the distinction between the two matters for surveillance. Added Visual Impairment and Headache, both graded INDIRECT: the source names the invaded structures, the orbit and the skull base, rather than the symptoms, so each follows by one inferential step.

    Added a stages section for the Kadish classification with Morita's stage D, four stages with the per-stage ten-year survival figures in their descriptions. The stage D notes record that other systems exist and are not modelled, and why Kadish was chosen.

    Added a Platinum-Based Chemotherapy treatment bound to NCIT:C15632 with cisplatin and etoposide as therapeutic agents, in the induction, concurrent postoperative and palliative settings. Its description and three evidence items all carry the limit the review states: the optimal use of chemotherapy is still unknown, and the commonest regimen gave no survival benefit over the alternatives.

    Corrected two phenotype categories that were simply wrong. Nasal obstruction was filed as Neurological and epistaxis as Neoplastic; both are Respiratory, which is the value used elsewhere in the corpus.

    Suggestions taken. A NEUROD1 gene descriptor now connects the gene to the pathograph on the retained-programme node, with the CURIE looked up rather than taken from the review comment. Radiotherapy gains a target_mechanisms link to the mass node. The sinonasal undifferentiated carcinoma differential gains the restricted SSTR2 comparison against that tumour and sinonasal neuroendocrine carcinoma, rather than against mimics in general. The neuroblastoma differential gains the age distribution, which is one of the plainest separations between the two.

    The deep-research item is closed by the reviewer's own decision on the sibling pull request #16017, where hand curation was accepted for this series.

    Seven phenotypes, all causally connected. All 18 C4 gates pass.

  summary: 'Create: Olfactory Neuroblastoma (MONDO:0006329)'
  details: |
    New entry for the sinonasal tumour that shares a name with neuroblastoma and almost nothing else. It is in this series precisely because of that collision: the Neuroblastoma entry's scope note points here, and a reader who meets the name needs somewhere that states the difference. Curated by hand from the primary literature, so no report was placed in research/, which takes deep-research provider outputs only.

    The mechanism recorded is a cell-identity one rather than a mutational one, because that is what the evidence supports. Panel sequencing of 560 genes in a 66-tumour cohort found no highly recurrent mutations, only TP53 and DNMT3A recurrently; the positive genomic finding is highly recurrent combined whole-chromosome loss. Single-cell transcriptomic work links the tumour to olfactory epithelial globose basal cells, which the authors state was the first time it had been linked to a specific cell type, and the tumour retains that parent cell's programme: NEUROD1 expression separating it from sinonasal undifferentiated carcinoma, an EZH2-high proliferative subpopulation, and a preserved circuit governing divergent neuronal versus sustentacular differentiation.

    Six pathophysiology nodes, with four phenotypes all connected to the mass node, after the review of the CIC entry found that layer disconnected there. The edge from the chromosomal-loss node to the transformation node is deliberately typed UNKNOWN: the losses are the tumour's most consistent genomic abnormality, but no cited source shows they cause the transformation, and leaving the node out would have hidden the tumour's main genomic finding from the pathograph.

    The cell of origin is bound on the transformation node (CL:0002171 globose cell of olfactory epithelium, in UBERON:0001997 olfactory epithelium), but no origin node is marked in the cancer-origin sense, because there is no recurrent somatic lesion to record.

    MONDO currently places this term under extracranial neuroblastoma. That placement is recorded in the entry notes as disputed, with the hierarchical parents as retrieved through the OLS4 API on 30 October 2026, and a change request has been raised with MONDO. The mapping predicate stays skos:exactMatch, because the term denotes the right disease; it is its position in the hierarchy that is at issue.

    Two further honest limits are recorded rather than smoothed over. A third of institutionally diagnosed cases in the methylation cohort fell outside the core group, clustering with IDH2-mutant and other sinonasal carcinomas; those are recorded as a differential diagnosis rather than as subtypes, because the literature reads them as misdiagnosis. And the EZH2 inhibition suggestion is recorded in the node description as a proposal from expression data, not as a treatment.

    Six references. Twenty-four snippets, all verified.


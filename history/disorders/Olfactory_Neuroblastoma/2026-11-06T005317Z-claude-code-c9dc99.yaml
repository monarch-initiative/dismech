  summary: 'Edit: Olfactory Neuroblastoma, evidence on all 14 causal edges, invasion
    GO term, two guidelines and StatPearls'
  details: |
    Evidence pass on the olfactory neuroblastoma entry, whose 14 pathophysiology downstream edges carried no evidence.

    Edges. Every edge now cites at least one exact quote (22 items). The cell-identity chain uses PMID:36841178 (the tumour recapitulates the globose basal cell identity and trajectory; the EZH2-high proliferative compartment; the neuronal-versus-sustentacular circuit) and, for the UNKNOWN chromosomal-loss edge, the PMID:29730775 copy-number result graded INDIRECT because causation is not shown. The tumour-formation edges use the Hyams grading description in PMID:37909011 and the REFCOR guideline's statement that Hyams grade is the main prognostic factor. The symptom edges use PMID:37909011 (obstruction then epistaxis, anosmia years before diagnosis, orbital extension, intracranial invasion and headache, cervical nodes as the commonest metastatic site) and the StatPearls chapter PMID:30969516 (presenting symptoms, local aggressiveness, haematogenous and lymphatic spread). Quotes already used on the phenotypes keep their grading.

    Local Invasion of the Skull Base and Orbit now binds GO:0016477 cell migration (INCREASED), which the invasion_and_metastasis module node also binds, clearing that node's process_absent conformance finding. GO:0030198 extracellular matrix organization was not bound: no cached source describes matrix remodelling in this tumour.

    New sources: PMID:42442982 (REFCOR formalised expert consensus) is cited on the three treatment rows (resection followed by adjuvant radiotherapy as standard of care; chemotherapy for high-grade or unresectable disease), and each row's description says so. PMID:42610392 (European paediatric consensus) supports the tumour-origin node (olfactory neuroepithelium; typically adult, exceptionally rare in children) and the nodal-spread edge, and the entry's description and notes now say the tumour is mostly of adults rather than of adults only. PMID:30969516 is listed under references with the StatPearls tag, as an orientation source rather than a phenotype baseline. All three caches are abstract-only.

    Snippets were cut programmatically from the committed caches, never retyped. Validation: just validate passes; 69 of 69 snippets verify; the C4 gate set passes (see the PR).

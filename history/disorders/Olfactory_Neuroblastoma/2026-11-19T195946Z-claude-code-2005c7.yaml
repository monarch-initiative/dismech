  summary: Add NUT carcinoma as a differential diagnosis
  details: |
    Adds a differential row for NUT carcinoma (MONDO:0005563). Sources: the SSTR2 study already
    cited by the entry (PMID:33929681), which counts one NUT carcinoma among 51 histologic
    mimics and states the tumour's diagnostic immunophenotype; a sinonasal series
    (PMID:22534723), in which one NUT carcinoma was focally positive for synaptophysin,
    chromogranin and S100, every NUT carcinoma was cytokeratin positive, and NUT staining was
    diffuse and nuclear except in areas of squamous differentiation; and a case report
    (PMID:29700887) for the caveat that NUT carcinoma may occasionally lack keratins. The
    caveats are in the row's notes. Quotes that describe one tumour only, cited for a
    comparison, are graded INDIRECT. Validation: just validate and check-entity-refs pass; all
    snippets verify.

  summary: 'Create: Holoprosencephaly 12 With or Without Pancreatic Agenesis (CNOT1)'
  details: |
    De novo curation of HPE12 (MONDO:0032787, OMIM 618500, CNOT1 p.Arg535Cys). Deep research run with two providers, falcon (Edison) and claude_code; both reports plus citation sidecars are committed under research/. NEC preflight: MONDO:0032787 was verified via OAK to carry RO:0004003 to HGNC:7877 (CNOT1) and xref OMIM:618500, matching the gene named in every primary source; the falcon report explicitly flagged CDON-related HPE11 as a confusion risk, which this MONDO check excludes. GeneReviews baseline: the applicable chapter is CNOT1-Related Vissers-Bodmer Syndrome (PMID:41911374), which covers the p.Arg535Cys holoprosencephaly and pancreatic-agenesis phenotype; it plus the Holoprosencephaly Overview (PMID:20301702) are tagged GeneReviews in top-level references, and its Clinical Characteristics, Management, Surveillance and Genetic Counseling sections were cross-referenced into phenotypes, treatments and inheritance. Modelled a seven-node connected pathograph: CNOT1 p.Arg535Cys variant to perturbed CCR4-NOT scaffold function, branching into (a) failure of SHH repression in the dorsal foregut endoderm, impaired pancreatic progenitor specification, pancreatic agenesis or hypoplasia, and thence neonatal and later-onset diabetes, exocrine insufficiency, gallbladder agenesis and fetal insulin deficiency causing IUGR; and (b) disrupted prosencephalic midline patterning causing holoprosencephaly. Added a mechanistic_hypotheses group (shh_derepression, EMERGING) that the relevant causal edges opt into, plus two discussions: a HUMAN_MODEL_MISMATCH on the mouse homozygous versus human heterozygous dosage discrepancy, with two proposed experiments, and an OPEN_QUESTION on the unresolved organ-dependent direction of the SHH effect. Content: 12 phenotypes, 6 treatments, 3 differential diagnoses, 1 animal model, 1 imaging finding. Nine PMIDs were fetched with just fetch-reference: 31006513, 31006510, 35481434, 39149840, 41911374, 20301702, 32553196, 41161383, 38180040. Three DR-suggested HPO IDs were rejected as hallucinations after OAK verification: HP:0006443 is actually Patellar aplasia, HP:0011773 is Uninodular goiter, and HP:0008270 is obsolete; the correct terms HP:0100800, HP:0011467 and HP:0000857 were used instead. Validated with just validate: schema, linkml-term-validator and linkml-reference-validator all pass. just compliance reports 85.4 percent global and 85.7 percent weighted.

  details: |
    Response to the ai4c-reviewer REQUEST_CHANGES review on PR #7248. IMPORTANT 1, evidence_source: corrected seven misclassified items. Two in-silico claims (the deleteriousness prediction in PMID:31006510 and the gnomAD-absence-plus-conservation statement in PMID:31006513) retagged COMPUTATIONAL. Two molecular-background statements (the CCR4-NOT scaffold role, PMID:31006513; the early-embryonic expression statement, PMID:35481434) retagged OTHER. Three mixed human-plus-mouse quotes were resolved per the CLAUDE.md split rule: the PMID:31006513 inheritance snippet was trimmed before its and-a-similar-phenotype-in-mice clause so it is purely human; the PMID:31006513 dorsal-foregut SHH-repression background statement was retagged OTHER because it summarises prior work in both mouse and human embryos; and the PMID:31006510 combining-human-and-mouse-data conclusion was split into a new HUMAN_CLINICAL item quoting the two-individual human observation plus the original combined conclusion retagged OTHER. IMPORTANT 2, GeneReviews phenotype scoping: the entry imported global developmental delay and hearing impairment from the CNOT1-VIBOS spectrum while omitting other spectrum features with no stated rationale, and the feeding and rehabilitation treatment cited the GeneReviews feeding-therapy recommendation with no feeding phenotype to target. Added three spectrum phenotypes marked PARTIAL and labelled allele-nonspecific: Feeding difficulties HP:0011968, Hypotonia HP:0001252 with temporality TRANSIENT, and Seizure HP:0001250, all attached as causal edges from the Perturbed CCR4-NOT Scaffold Function node and all cited to the same GeneReviews clinical-characteristics sentence. The feeding treatment now targets Feeding difficulties and Hypotonia. The scoping rule itself is now stated explicitly in notes, naming which spectrum features are imported and why, which are deliberately excluded and belong to the Vissers-Bodmer entry, and why the Cospain full-text craniofacial and CNS findings are omitted as not snippet-verifiable. Suggestions addressed: PMID:20301702, the Holoprosencephaly Overview GeneReviews chapter, was tagged but never mined, so it is now cited on the molecular-testing diagnosis entry as PARTIAL and OTHER; the orphan cache PMID_22977175 was removed from the PR and the other orphan, PMID:24904637, is now cited on the CCR4-NOT scaffold node for the deadenylation catalytic activity; pancreatic enzyme replacement gained a pancrelipase therapeutic_agent, NCIT:C29345; and the inheritance block gained penetrance INCOMPLETE and expressivity VARIABLE with supporting evidence from PMID:39149840. Also committed the ten additive cache and enum CSV updates covering the new MONDO, HP, GO, CL and HGNC terms, which the original commit omitted and which deterministic term-validation CI requires. Phenotype count rose from 12 to 15. Validated with just validate: schema, term and reference validation all pass. Pathograph re-verified as a single connected component with one root and no orphan phenotypes. just compliance reports 83.9 percent global and 84.2 percent weighted, down from 85.4 because the three added phenotypes and the split evidence items introduce new recommended-field denominators.

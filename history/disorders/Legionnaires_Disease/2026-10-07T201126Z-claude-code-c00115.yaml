  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    The entry had no diagnosis section. Added three rows: urinary antigen test bound to Legionella pneumophila serogroup 1 urine antigen LOINC:31868-3, Legionella PCR of respiratory specimens bound to the genus-level NAA code LOINC:101219-4, and culture bound to LOINC:593-4. Evidence is the review PMID:38565811, already cited in the entry and graded OTHER there, covering the first-line role and serogroup 1 restriction of the urinary antigen test, the species and serogroup coverage of PCR, and culture. No reference_ranges: all three are qualitative. Infectious agent, transmission and other sections unchanged.

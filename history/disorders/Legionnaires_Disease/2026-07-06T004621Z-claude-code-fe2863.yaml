    Integrated verified findings from Falcon (Edison Scientific) deep research. NEC preflight PASS: report unambiguously Legionella pneumophila, Dot/Icm T4SS, alveolar macrophage LCV, macrolide/fluoroquinolone therapy; MONDO:0005824 matches. Added 9 new evidence items, every snippet verified as an exact substring of a fetched cache. 1) Dot/Icm T4BSS >300-effector and phagolysosomal-evasion evidence added to the intracellular-replication node from Lockwood 2022 DOI:10.1099/mic.0.001187 OTHER; DOI kept because the PMID:35639581 cache lacks abstract text. 2) New pathophysiology node Flagellin-Triggered NAIP5/NLRC4 Inflammasome Restriction with MODEL_ORGANISM evidence PMID:38565811 Rello 2024 and GO:0042742 plus GO:0070269, with an explicit human-translational caveat. 3) beta-lactam/aminoglycoside cell-impermeability evidence added to the cell-penetrant node PMID:40463979 Zhang 2025. 4) New phenotypes Acute kidney injury HP:0001919 and Rhabdomyolysis HP:0003201 from PMID:38565811. 5) New alternative treatment Doxycycline CHEBI:50845 SMALL_MOLECULE targeting the cell-penetrant node, PMID:40463979. 6) Epidemiology block: case fatality 4-40 percent PMID:38565811 and GBD-2021 global age-standardized death rate 0.86/100000 plus DALY 24.74/100000 PMID:39833500. 7) Clinical trial NCT00452153 Legionella PCR diagnosis. All HP/GO/CHEBI terms verified with runoak. validate-schema PASS, validate-terms PASS, validate-references PASS, each PMID snippet independently confirmed with linkml-reference-validator validate text. Dropped Dyspnea (no clean abstract-level quote); Zhong burden placed in epidemiology not Prevalence because ASDR/DALY are burden not occurrence measures. Preserved creation_date; no updated_date.

  summary: 'Create: Cataract 13 with adult i phenotype (GCNT2)'
  details: |
    New entry for claim #11554 (cataract 13 with adult i phenotype, MONDO:0007289, GCNT2). Preflight found nothing in kb/ binding hgnc:4204. Curated from one OpenScientist deep-research report (research/Cataract_13_With_Adult_I_Phenotype-deep-research-openscientist.md; 18/18 references resolved, term validation needs_review true) plus the primary literature. Three-node pathophysiology chain: loss of I-branching glycosyltransferase activity, then two parallel branches, persistence of linear i antigen on red cells and disrupted lens glycan branching. The claim issue asked whether the cataract-with-i and i-without-cataract presentations are one entity or two; the answer, and the most interesting part of this entry, is a mechanistic_hypotheses record (isoform_partition_model, status CANONICAL) capturing the three-isoform architecture of the I locus. GCNT2A/B/C share exons 2 and 3 and differ in exon 1; GCNT2C sets the blood group and exon 1B-containing transcripts are lens-relevant, so which exon a variant hits predicts which traits appear. It is marked CANONICAL rather than EMERGING because it rests on a matched pair of dissociating human observations in opposite directions, an exon 1C missense with blood group but no cataract and an exon 1B truncation with cataract, and the notes record the caveats both primary papers raise about their own single cases. The lens node is marked mechanism_confidence PROVISIONAL: how the loss of a beta-1,6 branch causes opacification is unknown, the source paper itself says only that the defect may lead directly to cataract, and a KNOWLEDGE_GAP discussion records the candidate routes. The adult i phenotype is bound to HP:0001877 Abnormal erythrocyte morphology with a notes line saying the binding is deliberately broader than the trait because HPO has no I/i blood group term. One evidence snippet quotes a sentence containing a typographical error in the source, which reads I antigen where i antigen is meant; it is quoted verbatim with the explanation saying so, since a snippet never corrects its source. The report's HP:0032324 suggestion is Non-periodic recurrent fever and was not used, and its GO:0006486 is obsolete. Every CURIE was resolved through OLS at the point of writing. The treatments block deliberately carries no evidence because cataract surgery is standard of care rather than a GCNT2 finding. Validated with just validate, just validate-terms, just check-entity-refs, just check-causal-targets, just check-enum-values, just check-duplicate-keys and just validate-disorders.

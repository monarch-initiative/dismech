  summary: 'Review round 1: rebind blood group phenotype, fix label case, add module
    conformance and population citations'
  details: |
    Addressed all four IMPORTANT findings from the ai4c-reviewer review of PR #11568 in a single push. (1) The adult i blood group phenotype was rebound from HP:0001877 Abnormal erythrocyte morphology to HP:0010970 Blood group antigen abnormality; my original notes claimed HPO has no blood-group term, which was false and is the substantive error of this round. I had searched HPO for cataract, visual impairment and nystagmus but never for blood group, then asserted a negative about the ontology from that. The note now records that HP:0010971 shows the granularity HPO reaches for a named antigen, so a term for I/i would be a reasonable HPO request. (2) disease_term label corrected from 'cataract 13 with adult i phenotype' to MONDO's canonical 'cataract 13 with adult I phenotype'. The capital I is the antigen name, so lowercasing it destroys the i-versus-I distinction the disease is about. Worth noting that just validate-terms passed on the wrong case: I confirmed by substituting an all-caps label, which also validates, so label comparison is case-insensitive and CLAUDE.md's 'must exactly match' is not enforced for case. (3) Added conforms_to cataract_lens_opacification#Lens Homeostasis Insult on the lens node, with a note recording which module expectations are deliberately not met and why: the module node's response-to-oxidative-stress process is not the GCNT2 mechanism, and only lens epithelial cell is bound because that is where the sources locate GCNT2. I had not run just list-modules, which is the process failure behind this one. (4) The population-difference claim in isoform_partition_model is now cited to PMID:432928 (17 of 18 Japanese phenotype i individuals had cataract, none of 45 phenotype I family members) and PMID:3799539 (3 of 10 in a White cohort, and none among 31 patients ascertained through cataract). Also took two non-blocking suggestions: clarified in the node description which quantity GO:0030311 DECREASED refers to, and added PMID:27936067, where PCR amplification of the GCNT2 coding exons failed outright in affected individuals, which is the sharpest form of the copy-number diagnostic point. Declined the target_mechanisms suggestion on cataract surgery, with the reason given in the PR reply. Re-validated with just validate, just validate-terms, just check-entity-refs, just check-causal-targets, just check-enum-values, just check-snippet-length and just validate-disorders.

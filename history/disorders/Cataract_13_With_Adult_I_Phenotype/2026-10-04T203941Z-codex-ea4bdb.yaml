  summary: Review GCNT2 cataract using full-text clinical, isoform and model evidence
  details: |
    Reviewed all ten original citations and the matching OpenScientist deep-research report after entity preflight (MONDO:0007289 / GCNT2 / OMIM:116700). Read cached full texts for PMID:27609212, PMID:27936067 and PMID:28224043, including clinical tables, diagnostic methods, surgery and long-term visual outcomes. Obtained and read institutional full texts for PMID:12424189 and PMID:17076854; distinguished adult surgical-lens RT-PCR from embryonic expression and heterologous enzyme assays from patient lens mechanisms. Read primary knockout PMID:16107727 in full through the alternative NCBI PMC URL, including methods, results, figure 8C and negative galactose challenge. The canonical PMC fetch returned a challenge page, which is not cited or committed. Read the 2026 same-case ACMG poster and documented its 1A/1B deletion label versus 1B/1C in PMID:41813616; the poster is not replication and unexplained systemic findings are not attributed to GCNT2. PMID:41813616 full publisher text remained inaccessible; the abstract and poster delimit its use. Also read the 2017 PLOS publisher correction to the deletion paper, PMID:11739194 and PMID:3946005 abstracts, and the full 2026 Thai alloanti-I case report; the latter lacks a verified cataract diagnosis and is not treated as a cataract case. The 1986 primary anti-I report supports a scoped blood-group compatibility caveat without claiming genotype-specific incidence.

    Corrected unsupported structural-allele frequency, deterministic isoform claims, benign-blood-group assertions, generic decreased poly-LacNAc biosynthesis, and the false absence of clinical treatment/outcome evidence. Split lens glycan dysfunction from lens opacity with unknown intermediates; attached the causal gene to its molecular function. Added nystagmus, amblyopia, esotropia, surgery/optical rehabilitation/occlusion/strabismus interventions and age-aware molecular/serological diagnosis. Removed invented diagnostic criteria and ultra-rare prevalence band. Added linked enzyme and knockout models with explicit readouts and the human-mouse discrepancy. Preserved coding versus possible regulatory consequences of A/B deletions without asserting TFAP2A expression loss or normal I/i serology.

    Completeness assessment: phenotypes, mechanisms, genetics, clinical treatment and diagnosis are covered by the primary sources; no established clinical subtype or disease-specific trial was substantiated by the matching report. Historical Japanese/White blood-group series are not used as genotype-specific penetrance estimates. No GeneReviews or StatPearls chapter matched the entry names in the 2026-09-10 snapshot. Full-text methods and negative findings informed the revisions even where an abstract supplies the final quote. Schema, terms and 59 cached quotations plus 62 titles passed the batched validation. Entity/causal targets, coarse phenotype bindings and knowledge-gap target checks passed. Treatment action terms are left unbound where the retrieved NCIT terms denote devices or findings. Existing history records remain unchanged.

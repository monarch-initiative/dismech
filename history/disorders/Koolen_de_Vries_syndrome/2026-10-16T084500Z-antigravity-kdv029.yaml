  summary: Enhance Koolen-de Vries syndrome entry with classifications, progression, connected causal pathograph, additional phenotypes, diagnosis, differential diagnoses, treatments, and cleaned references.
  details: >-
    Added Harrison's chapter classifications (GENETICS_ENVIRONMENT_DISEASE and
    NEUROLOGIC) and age-stratified progression (Onset, Childhood, Adulthood).
    Added molecular_functions (GO:0035034 and GO:0003682) to KANSL1
    haploinsufficiency and introduced two intermediate pathophysiology nodes
    (Impaired neuroblast migration and axonal guidance; Disrupted developmental
    and morphogenetic signaling) with evidenced downstream edges connecting all
    11 phenotypes into the causal pathograph. Added four phenotypes
    (Ventriculomegaly, Scoliosis, Generalized joint hypermobility, Obesity),
    five diagnostic assays (chromosomal microarray, KANSL1 sequencing, blood DNA
    methylation episignature profiling, brain MRI, prolonged sleep EEG), two
    differential diagnoses (Cardiofaciocutaneous syndrome, Classical
    Ehlers-Danlos syndrome), and four treatments (ketogenic diet for CSWS,
    orthopedic surgical correction of progressive scoliosis, prolonged sleep EEG
    monitoring, prenatal genetic counseling). Cleaned top-level references to
    remove un-evidenced title-echo findings.

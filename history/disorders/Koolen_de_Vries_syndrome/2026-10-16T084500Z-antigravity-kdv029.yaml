  summary: Enhance Koolen-de Vries syndrome entry with classifications, progression, connected causal
    pathograph, 24 phenotypes, diagnosis, differential diagnoses, GeneReviews-backed treatments, and cleaned
    references.
  details: 'Added Harrison''s chapter classifications (GENETICS_ENVIRONMENT_DISEASE and NEUROLOGIC), GeneReviews
    citation (PMID:20301783) with tags: [GeneReviews], and age-stratified progression (Onset, Childhood,
    Adulthood). Added molecular_functions (GO:0035034 and GO:0003682) to KANSL1 haploinsufficiency, corrected
    autophagy modifier on Autophagosome accumulation in KANSL1-deficient neurons to DECREASED alongside
    autophagosome-lysosome fusion (GO:0061909, DECREASED), and refined two intermediate pathophysiology
    nodes (Impaired neuroblast migration and axonal guidance; Disrupted cardiac morphogenesis) while connecting
    all 24 phenotypes into the causal pathograph with direct or indirect edges. Expanded phenotypes to
    24 entries covering craniofacial dysmorphism (Bulbous nose, Long face, Upslanted palpebral fissure,
    Protruding ear), friendly disposition (Happy demeanor), musculoskeletal anomalies (Scoliosis, Generalized
    joint hypermobility, Hip dislocation), renal/urogenital anomalies (Hydronephrosis, Vesicoureteral
    reflux, Cryptorchidism), ophthalmologic and otologic features (Strabismus, Hypermetropia, Hearing
    impairment), Sleep disturbance, and Obesity. Added five diagnostic assays, two differential diagnoses,
    and eight therapeutic/counseling entries including Speech and language therapy, Physical therapy,
    Individualized educational intervention, Growth hormone replacement therapy, and Multidisciplinary
    supportive care. Cleaned top-level references to remove duplicates and un-evidenced findings.'

  summary: 'Create: Methylcobalamin Deficiency Type cblG, MTR, MONDO:0009609'
  details: |
    De novo curation of cblG from claim issue #9820. Deep research: Perplexity sonar-deep-research, report at research/Methylcobalamin_Deficiency_Type_cblG-deep-research-perplexity.md; its reference-validation block reported 6/6 identifiers resolved, 0 confabulation, 4/6 assessed on topic. Used as a lead source only - every evidence snippet is anchored to a PMID fetched and verified with just fetch-reference. Two entity-attribution hazards were handled explicitly and recorded in the entry notes. First, GeneReviews PMID:20301503 CLINICAL CHARACTERISTICS was deliberately not mined because that paragraph is cblC-specific, following the same decision recorded in the cblE entry; only Diagnosis/Testing and Management were used. Second, the main clinical cohort PMID:25526710 pools 11 cblE and 13 cblG patients and reports frequencies for the pooled group, so every evidence item drawing on it says in its explanation that the figure is pooled and not a cblG-specific rate; cblG-specific sources were preferred wherever available. One snippet initially used the title of PMID:22422209 as evidence and was caught by the snippet checker; it was replaced with an actual finding from the abstract. Three ontology bindings were wrong on first pass and corrected against OLS: CL:0038024 does not exist, corrected to CL:0000038; CHEBI:15636 is methylenetetrahydrofolate not folinic acid, corrected to CHEBI:15640; HP:0000708 label is Atypical behavior. Records an open KNOWLEDGE_GAP discussion on whether treatment alters the neurological natural history, where the larger pooled cohort and the cblG-specific case series reach opposite conclusions. Validated with just validate, 36/36 snippets verified, plus check-entity-refs and check-duplicate-keys.

  summary: 'Review round 1: GeneReviews mining, MMA binding fix, pathograph edges'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #9829, all four IMPORTANT items plus most suggestions. Fixed a real defect the reviewer caught: the Methylmalonic Acid biomarker was bound to HP:0002156 Homocystinuria with presence NORMAL, which machine-readably asserted homocystinuria NORMAL and contradicted the entry's own Total Homocysteine record; rebound to CHEBI:30860 methylmalonic acid per the Adenosine_Kinase_Deficiency convention. Mined the GeneReviews sections that were claimed but not used, adding three treatments: nitrous oxide avoidance, catabolic state avoidance, and long-term biochemical monitoring, plus a recurrence-risk evidence item on inheritance and a survival statement on hydroxocobalamin. Corrected the notes line to name the sections actually mined. Added target_mechanisms to all seven treatments and eight downstream phenotypes# edges so the pathograph reaches both therapy and clinical presentation. Also added a DIAGNOSTIC_CRITERIA definition for the tHcy-high, methionine-low, MMA-normal triad, onset ADULT on the late-onset psychiatric phenotype, and the newborn-screening and diagnostic-delay quotes. One reviewer suggestion was declined on evidence: GO:0009086 is obsolete, so the methionine biosynthesis node uses GO:0071265 L-methionine biosynthetic process instead. Revalidated: 46/46 snippets verified, check-entity-refs and check-duplicate-keys pass.

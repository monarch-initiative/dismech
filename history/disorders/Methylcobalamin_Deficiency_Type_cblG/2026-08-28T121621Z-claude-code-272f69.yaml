  summary: 'Fix CI: lengthen two sub-5-word evidence snippets'
  details: |
    Fixes the test (3.13) failure on PR #9829. check_snippet_length.py rejected two evidence snippets under five words: phenotypes[6] Encephalopathy quoted 'seizures, encephalopathy, macrocytic anemia' (4 words) and biochemical[1] Plasma Methionine quoted 'hyperhomocysteinemia and hypomethioninemia' (3 words). Both were extended to the full sentence from the same cached abstract, which also makes them propositional rather than bare term lists. Root cause on my side was process, not judgement: I ran just validate, validate-disorders, check-entity-refs, check-duplicate-keys and check-snippet-grading on this file but never check-snippet-length, which is one of the ungated whole-repo CI steps. The failing check was reproduced locally before and after the fix. Revalidated: 46/46 snippets still verified.

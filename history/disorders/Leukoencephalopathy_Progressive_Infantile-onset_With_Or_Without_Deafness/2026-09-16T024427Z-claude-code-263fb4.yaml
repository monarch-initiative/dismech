  summary: 'Fix merge-queue CI failure: contradicted SCALE_EXTRAPOLATION divergence
    on the Xenopus model'
  details: |
    The PR was dequeued from the merge queue with a CI failure after three green review rounds. Reproduced locally by merging current origin/main and running just test-kb, which runs only on merge_group and is skipped for a kb-only PR because CI selects pytest by changed path. The failing check is check_scale_extrapolation_divergence_agrees_with_scales: the Xenopus model link declared model_scale MOLECULAR against a MOLECULAR target node and also claimed a SCALE_EXTRAPOLATION divergence, which asserts an upward scale gap that does not exist. The divergence's own description said the link is made at the molecular node where the readout is enzyme activity - that is, it recorded that the model's organ-scale CNS observation is not what the link rests on, which is the inverse of what the divergence type means. Removed the divergence and folded its substantive point into limitations, which already carried half of it: the link is cited for the enzyme readout alone, and the abnormal-CNS observation is reported without the phenotypic detail that would let it stand for the human white matter phenotype. The SPECIES_MISMATCH divergence is unchanged and already carries the CNS and myelination argument. Verified with the previously failing pytest node, just validate (28/28 snippets), and just model-scale-audit --strict, which now exits 0.

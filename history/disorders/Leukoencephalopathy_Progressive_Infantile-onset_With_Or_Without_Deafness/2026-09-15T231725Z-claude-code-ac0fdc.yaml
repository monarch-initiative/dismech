  details: |
    Addresses the approving review on PR #11893, which raised six non-blocking suggestions. Four taken, two declined. Taken: (1) Removed an unsourced causal claim. The Oxidative Phosphorylation Deficiency node asserted that intercurrent fever and infection precipitate regression. I verified the reviewer's finding independently - none of the three cached abstracts (PMID:30715177, PMID:30252186, PMID:31192300) contains fever, infection, precipitate or intercurrent anywhere. The claim came from the deep-research report's prose, which traced it to aggregator records rather than to a cited paper. Removed rather than downgraded, with the reasoning and the correct future shape (an environmental entry with influences_mechanisms and environmental_effect EXACERBATES) recorded in review_notes. (2) Connected the pathograph: six of nine phenotypes had no incoming edge, including Sensorineural Hearing Impairment, which is in the disease name. Sensorineural Hearing Impairment now hangs off Oxidative Phosphorylation Deficiency with INDIRECT_UNKNOWN_INTERMEDIATES and a description saying the intermediate steps are not established for KARS1; Leukoencephalopathy and Intracranial Calcification hang off White Matter Injury as DIRECT, being the radiologic readout of that node; Hypotonia, Absent Speech and Nystagmus hang off it as INDIRECT_UNKNOWN_INTERMEDIATES. No new evidence was invented for any edge. All nine phenotypes are now reachable. (3) Added a three-entry diagnosis section (serum lactate and pyruvate, brain imaging, KARS1 sequencing), reusing sentences already cited elsewhere in the entry plus one new quote from PMID:31192300 establishing exome sequencing as the diagnostic route. (4) Recorded in review_notes the systemic features the report surfaced but that are not quotable from the cached references - spastic tetraplegia, poor growth, microcytic anemia, hepatic involvement, visual impairment, brainstem and spinal calcification, and the 5-of-7 mortality - so a future pass knows what to fetch rather than rediscovering the gap. Declined: splitting the White Matter Injury and Intracranial Calcification node, because the two findings share one mechanism and the reviewer called it a naming choice; and adding quote_role BACKGROUND, because no quote_role slot exists in this schema. Validated after the changes: just validate-disorders passed, 24/24 snippets verified, check-entity-refs, check-causal-targets, check-duplicate-keys and check-enum-values all OK.

  summary: 'Create: LEPID (KARS1-related infantile leukoencephalopathy)'
  details: |
    De novo curation of MONDO:0030893 from a Perplexity sonar-deep-research report (research/Leukoencephalopathy_Progressive_Infantile-onset_With_Or_Without_Deafness-deep-research-perplexity.md). Report preflight (just preflight-dr) returned PASS with KARS1 mentioned 114 times. The report supplied only 2 resolvable PubMed identifiers for a 112 KB document, so the reference set was rebuilt from PubMed: PMIDs 25330800, 30252186, 30715177, 31192300, 41059449, with two PMC identifiers from the citation sidecar resolved through the NCBI ID converter. One of the report's validated references, PMID:36660574, is a case report of leukoencephalopathy with calcifications and cysts caused by biallelic SNORD118 variants - a different gene and a different disease. It was not used as evidence; it is recorded instead as a differential diagnosis, which is the honest place for it. The report's reference validation did not flag it, which is consistent with relevance being scored against the report's own vocabulary: the paper shares nearly all of this disease's clinical vocabulary while being about something else. Pathophysiology is curated as a five-node chain from biallelic KARS1 variants through reduced aminoacylation activity, impaired mitochondrial translation, oxidative phosphorylation deficiency and white matter injury with calcification. The mitochondrial arm rests on the isoform-specific rescue experiment in PMID:30252186 rather than on the gene's dual localisation. The Xenopus model is linked with model_scale MOLECULAR and two typed divergences, because it supports the enzymatic node and not the tissue-level ones. Validated: just validate-disorders (schema, terms and references, batched) passed on the first run, 21/21 snippets verified, check-entity-refs, check-causal-targets and check-duplicate-keys all OK. No treatment section: none of the sources reviewed makes a treatment claim specific to this disease.

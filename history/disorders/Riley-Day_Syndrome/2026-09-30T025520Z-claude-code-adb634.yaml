  summary: 'Review round: carbidopa, CKD, GI procedures, corneal disease, GeneReviews
    exposures'
  details: |
    Second pass on PR #13193, answering a CHANGES_REQUESTED review. Evidence
    grew from 117 to 163 snippets, all exact substrings of fetched caches
    (163/163 verified by validate-disorders).

    Four blocking findings.

    (1) Carbidopa added. The review named PMID:32623925 as the possible Palma
    et al. 2020 Hypertension trial; that PMID is Georgakis et al.,
    "Genetically Predicted Blood Pressure Across the Lifespan", which is not
    about this disease. The correct paper is PMID:32654554,
    Norcliffe-Kaufmann/Palma, "Carbidopa for Afferent Baroreflex Failure in
    Familial Dysautonomia: A Double-Blind Randomized Crossover Clinical
    Trial", and PMID:23553478 is the 2013 Neurology antiemetic trial. Both
    were fetched and read, and both are now cited for their own endpoint
    rather than through the review's secondhand account: PMID:23553478 for
    the Dysautonomic Crises link (nausea/retching, plus the urinary dopamine
    fall as target engagement) and PMID:32654554 for Blood Pressure
    Instability (both co-primary endpoints, plus suppressed urinary
    norepinephrine). therapeutic_agent CHEBI:3395 carbidopa. The uncited
    PMID_32623925.md cache was removed rather than committed.

    (2) Chronic Kidney Disease phenotype added, HP:0012622 (CURIE and label
    both checked against the cache and OLS), frequency FREQUENT sourced from
    "Chronic renal failure is a frequent problem in patients with FD" under
    the Pattern C qualitative mapping. Wired as a sequela of Blood Pressure
    Instability on "Paroxysmal hypertension occurs from birth and is
    associated with a faster progression of renal damage", typed
    INDIRECT_UNKNOWN_INTERMEDIATES because the cited relationship is an
    association and the intervening steps are not stated. The description
    also records the developmental contribution (renal patterning defects),
    the reverse arm (supine hypertension in advanced CKD), and the creatinine
    caveat, each with its own quote.

    (3) GI procedures and orthostatic-hypotension drug added. Percutaneous
    Endoscopic Gastrostomy (NCIT:C106040, SURGERY) BYPASSES Neurogenic
    Dysphagia and Recurrent Aspiration; Fundoplication (NCIT:C91834, SURGERY)
    INHIBITS Gastrointestinal Dysmotility, carrying three REFUTE items for the
    limits the review itself states (natural history unclear, reflux recurs,
    12% reoperation, post-operative dilatation and achalasia) rather than
    presenting it as settled benefit; Midodrine (CHEBI:6933) MODULATES Blood
    Pressure Instability, modulates rather than inhibits because it addresses
    only the hypotensive direction and can push the other way. Both NCIT
    procedure terms were confirmed reachable from NCIT:C25218 before use, the
    cochlear-implant precedent being the reason to check.

    (4) GeneReviews "Agents/circumstances to avoid" mined into two
    environmental entries, each EXACERBATES Dysautonomic Crises with its own
    entry-level evidence (check-environmental-evidence passes). Hot or humid
    weather is bound to ECTO:1000007 exposure to high temperature environment.
    Full bladder is left unbound. Both notes record the queries verbatim and
    what came back: ECTO has no humidity-exposure class (l~humid returns only
    ENVO and PATO qualities; l~humidity and l~moist return nothing) and
    neither ECTO nor XCO has a bladder-distension class (six ECTO label
    searches empty; XCO's nearest are partial bladder outlet obstruction and
    urinary catheterization, which are a different concept and an
    intervention).

    Suggestions taken. Corneal Opacity and Neurotrophic Keratopathy added
    (HP:0007957) with two upstream sequelae edges, from Alacrima for the tear
    deficit and from Impaired Pain and Temperature Sensation for the corneal
    hypoesthesia, because the source names both causes; frequency FREQUENT
    from the reported 30% for severe opacities, with the explanation stating
    that this is a floor for opacity of any grade. Ocular Surface Lubrication
    added (therapeutic_agent CHEBI:85146 carboxymethylcellulose), since NCIT
    has no artificial-tears clinical-action term. "spine for scoliosis"
    removed from Kyphoscoliosis as a surveillance fragment. quote_role:
    BACKGROUND added to the second PMID:30905397 item on Postnatal
    Proprioceptive Neuron Loss, confirmed to sit in that paper's abstract
    background before "We demonstrate herein". Phosphatidylserine added and
    linked to Neuronal Elongator Complex Deficiency rather than to the
    splicing node, because the source states it raises transcription without
    altering the exon 20 ratio. NCT06148311 added with phase PHASE_II and
    status ENROLLING_BY_INVITATION read from the ClinicalTrials.gov v2 API,
    since the cached record carries neither field.

    Declined, with reasons in the entry's notes. The review asked for
    GO:0051402 neuron apoptotic process to be replaced by GO:0070997 neuron
    death; GO:0070997's canonical label is "obsolete neuron death" and every
    one of the eleven GO terms matching l~neuron death is obsolete, so the
    branch no longer exists. The node is bound to GO:0008219 cell death
    instead, which asserts no death mode, is in the biologicalprocessterm
    enum cache, and carries the neuron specificity in preferred_term. The two
    carbidopa registrations (NCT01212484, NCT02553265) were found but not
    recorded, because neither declares either cited paper as its results
    publication.

    Two phenotypes remain causally unconnected (Hypotonia with Delayed Motor
    Milestones, Developmental Delay and Intellectual Disability), both
    pre-existing. No cited source states an upstream mechanism for either, and
    the one candidate quote links hypotonia to delayed *motor* milestones,
    which is not the intellectual-disability node. Left alone rather than
    wired to clear a report.

    Gates: validate, validate-terms, validate-disorders, count-verified-
    snippets (163/163), check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values,
    check-environmental-evidence, check-genereviews, check-folded-hyphens,
    check-not4curation and check-coarse-phenotypes all pass.
    check-snippet-length, check-title-snippets and check-snippet-grading fail
    on the whole KB, with zero findings in this entry: they grandfather
    against origin/main, this branch is 572 commits behind it, and every
    finding is in an unrelated entry (ARFID, Cholera, Leishmaniasis and
    others). Cache churn is four additive rows for the two newly bound terms
    that were not already cached, CHEBI:85146 and NCIT:C91834.

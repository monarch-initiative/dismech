  summary: Ground the ELP1 gene on a molecular function; merge main
  details: |
    Fixes the one red CI gate on PR #13193 ("Check for newly ungrounded genes", scripts/check_gene_activity_grounding.py), which reported "kb/disorders/Riley-Day_Syndrome.yaml: ELP1". The gate requires a gene wired into the pathograph to land on a node that also names a molecular function, so that the graph states what the protein can no longer do and not only what the cell can no longer do.

    MERGE. The branch was 573 commits behind origin/main and the gate script did not exist in the worktree, so the failure could not be reproduced before refreshing. `git merge --no-edit origin/main` (with merge.renameLimit raised to clear a rename-detection warning) completed with ZERO conflicts; the only files touched by both sides were the additive term/enum cache CSVs, which git merged line-wise. Post-merge scope review (git diff --name-status origin/main...HEAD) shows only this entry, its history records, its reference caches, additive cache rows, the deep-research report and the stub deletion - no reversions, and every cache diff is additions-only (checked +/- counts per file). The earlier case-colliding references_cache/DOI_* blocker (#11204) did not recur.

    BINDING. Added molecular_functions: GO:0140101 'catalytic activity, acting on a tRNA' (modifier: DECREASED) to the 'Neuronal Elongator Complex Deficiency' pathophysiology node - the node that already carried the ELP1 gene descriptor and the GO:0002098 'tRNA wobble uridine modification' biological process, so the new term is the molecular-function partner of the process already tagged there. GO:0140101 was verified against the local sqlite:obo:go build: canonical label confirmed, oio:hasOBONamespace molecular_function, definition 'Catalytic activity that acts to modify a tRNA.', and its is-a ancestors include GO:0003674, the MolecularFunctionTerm enum root. A positive control on the same adapter (GO:0004725) resolved, and just validate-terms - the authoritative enum-membership check - passed.

    WHY NOT A NARROWER TERM. Searched the local GO build for 'l~wobble' (16 hits, all biological_process or cellular_component, no molecular function), 'l~tRNA uridine' (GO:0106261 tRNA uridine(34) acetyltransferase activity), 'l~tRNA methyltransferase' (GO:0008175), 'l~carboxymethyl' (CHEBI only), 'l~tRNA acetyltransferase' (nothing), 'l~acting on a tRNA' and 'l^tRNA binding'. GO has no molecular-function term for Elongator's carboxymethyl wobble-uridine chemistry: GO:0106261 is acetyl (ac4C34, TmcA chemistry) and GO:0008175 is methyltransferase, neither of which Elongator performs, and neither is quotable from any reference cached in this branch. GO:0000049 tRNA binding was rejected because although ELP1 has been described as Elongator's tRNA-binding subunit, no cached reference states it, and the rule is not to bind an activity the entry cannot quote. Per the ontology term contract the broader tRNA-acting catalytic activity is bound and the specificity is carried in preferred_term ('Elongator complex tRNA-modifying activity') and in the descriptor description, which also records that the catalysis belongs to the assembled complex rather than to the ELP1 scaffold itself.

    EVIDENCE. Added one evidence item on the same node citing PMID:30905397, quoting 'which is a highly conserved protein complex that participates in distinct cellular processes including transcriptional elongation, acetylation of cytoskeletal alpha-tubulin, and tRNA modification' (the alpha is the source's own U+03B1, copied exactly). Verified as an exact substring of references_cache/PMID_30905397.md before writing, and checked against all 163 pre-existing snippets in the entry for the containment relationship check_snippet_grading treats as the same quote - there is none, so the item is graded on its own merits. evidence_source: IN_VITRO because the quoted sentence reports the biochemical characterization of the complex rather than a clinical or whole-animal result; quote_role: BACKGROUND because it sits in this mouse study's introduction restating established work. No new reference was fetched and references_cache/ was not touched.

    VALIDATION. Each run separately after the merge, all green: check_gene_activity_grounding.py --against-ref origin/main (exit 0, 'no newly ungrounded genes', against 'kb/disorders/Riley-Day_Syndrome.yaml: ELP1' before); just validate; just validate-terms; just validate-disorders; just count-verified-snippets (164/164 verified, up from 163); just check-duplicate-keys; just check-entity-refs; just check-causal-targets; just check-enum-values; just check-environmental-evidence; just validate-history-all. The two cache rows for GO:0140101 were written by the validator, never by hand. No baseline file was modified.

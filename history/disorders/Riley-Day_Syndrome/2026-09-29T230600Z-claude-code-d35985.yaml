  summary: 'Create: Riley-Day Syndrome (familial dysautonomia, HSAN III)'
  details: |
    Curated Riley-Day syndrome / familial dysautonomia (MONDO:0009131), HSAN III, driven by the ELP1 (formerly IKBKAP) splice-altering founder variant causing tissue-specific exon skipping and Elongator deficiency. 117 evidence snippets, all exact substrings of fetched reference caches (117/117 verified by validate-disorders). Gene binding hgnc:5959 confirmed as ELP1 by bidirectional OAK lookup rather than taken from the issue body. Deep research used the claude_code provider after the Edison account returned HTTP 402; that provider's citation layer proved unreliable across this batch (182 of 268 cited PMIDs across 10 reports had titles unrelated to their disease, 4 did not resolve), so citations here were re-derived and each reference fetched and read before quoting.

  summary: Review and enrich Glycogen_Storage_Disease_Due_to_Muscle_Beta-Enolase_Deficiency
  details: >-
    Audited and enriched Glycogen_Storage_Disease_Due_to_Muscle_Beta-Enolase_Deficiency (MONDO:0013046). Repaired retired PARTIAL support prose in prevalence evidence and added ORPHA:99849 Worldwide BELOW_1_IN_1000000 point prevalence and Orphanet synonyms. Populated evidenced Harrison chapters (ENDOCRINOLOGY_METABOLISM, NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE) and ICIMD categories (glycolysis, glycogen_metabolism). Added germline LOSS_OF_FUNCTION genetic_context on Beta-Enolase Deficiency, skeletal muscle tissue (UBERON:0001134) locations across myofiber nodes, programmed necrotic cell death (GO:0097300) on Myofiber Injury and Rhabdomyolysis, CAUSATIVE and GERMLINE attributes plus ORPHA:99849 evidence on genetic[ENO3], and five atomic diagnostic entries with specific NCIT bindings (NCIT:C51895 Muscle Biopsy, NCIT:C23020 Immunohistochemistry Staining Method, NCIT:C16357 Western Blotting, NCIT:C64430 Protein or Enzyme Type Measurement, NCIT:C101293 Next Generation Sequencing).

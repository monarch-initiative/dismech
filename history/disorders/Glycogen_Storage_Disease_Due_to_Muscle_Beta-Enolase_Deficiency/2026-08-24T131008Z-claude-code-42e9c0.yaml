  summary: 'Create: Glycogen Storage Disease Due to Muscle Beta-Enolase Deficiency
    (GSDXIII)'
  details: |
    De novo curation of GSDXIII (ENO3, MONDO:0013046) from a Perplexity sonar-deep-research report used as leads only. The DR report cited by URL rather than PMID (1 PMID in body, 3 recoverable from citation URLs), so the evidence base was rebuilt from PubMed searches and every snippet quoted from a freshly fetched abstract in references_cache. NEC preflight against MONDO:0013046 returned PASS (ENO3 mentioned 128 times vs next gene at 8; report OMIM 612932 matches the MONDO xref). Two prior beliefs were corrected against the literature during curation and are recorded as such: (1) the flat forearm-exercise lactate curve is NOT characteristic - it held for the 2001 index patient on an ischaemic protocol, but a 2014 series found only mild blunting and a 2021 study found normal lactate production on non-ischaemic testing, so the entry records a KNOWLEDGE_GAP rather than asserting either; (2) GSDXIII does NOT spare patients from myoglobinuria - every patient reported after the index case has had recurrent rhabdomyolysis, one requiring dialysis. No module conformance declared, with the reasoning recorded in notes. Validation: schema clean; 38/38 snippets verified against cached references; term validation passed; all five ungated CI gates (duplicate keys, folded hyphens, snippet length, title snippets, environmental evidence) clean.

  summary: 'Create: Staphyloenterotoxemia'
  details: |
    Added a MONDO:0005971 staphyloenterotoxemia entry that models staphylococcal food poisoning as a preformed-toxin intoxication rather than invasive enteritis. The entry binds Staphylococcus aureus, records handled food with preformed enterotoxin as the trigger, links heat- and protease-resistant enterotoxin ingestion through epithelial transcytosis, submucosal mast-cell mediator release, vagal emetic reflex activation, and intestinal secretory response, and records vomiting, nausea, abdominal cramps, diarrhea, short incubation, self-limited course, U.S. foodborne burden, clinical/outbreak diagnosis, supportive fluid care, and the house musk shrew and common marmoset emesis models used to dissect the toxin-to-vomiting path.

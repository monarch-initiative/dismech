  summary: 'Create: Uveitis'
  details: |
    Created the root Uveitis (MONDO:0020283) Disease entry per issue #8960. Modeled the SUN Working Group anatomic classification (anterior, intermediate, posterior, panuveitis) as has_subtypes, nesting HLA-B27-associated and JIA-associated anterior uveitis and Behcet/Vogt-Koyanagi-Harada/sarcoid panuveitis as children rather than duplicating those disorders' full pathophysiology; linked existing sibling entries (Panuveitis, Pars_Planitis, Choroiditis, Cytomegalovirus_Retinitis, Toxoplasmosis, Tuberculosis, Ankylosing_Spondylitis, Juvenile_Idiopathic_Arthritis, Behcets_Disease, Vogt-Koyanagi-Harada_Disease, Sarcoidosis) via description prose (no dedicated cross-file FK slot exists on Subtype). Curated Herpetic Anterior Uveitis directly on this root since no HSV/VZV entry exists in the KB yet. Modeled pathophysiology as two separate causal chains per issue #8970's heterogeneity concern: autoimmune arm (breakdown of ocular immune privilege -> autoreactive Th1/Th17 T cell priming -> cytokine-driven leukocyte recruitment/barrier disruption) and infectious arm (ocular pathogen invasion/reactivation -> pathogen antigen-driven uveal inflammatory damage), each ending in shared downstream phenotypes. Implemented the anti-TNF (adalimumab) target_mechanisms treatment pattern the issue requested. Deep research via falcon (Edison Scientific); report's own validation showed 16/16 citations resolved, 0% confabulation, 0 off-topic. just preflight-dr returned SKIP because MONDO records no single causal gene for this anatomic/etiologic umbrella term; manually reviewed the report's top genes (TNF, ERAP1, CXCR4, PIM1, TIGIT) against known uveitis immunology and found no wrong-disease (NEC) signal. Every PMID/DOI cited in the curated YAML was independently fetched with just fetch-reference and its snippet checked against the cached abstract with just count-verified-snippets (44/44 verified); the deep-research report was treated as a lead only, not as a source of pre-written snippets. Ran just validate, just validate-terms, and the batched just validate-disorders pre-PR sweep, all passing; just compliance reported 86.0% global compliance. Did not add conforms_to links to the glaucoma_optic_neuropathy/cataract_lens_opacification modules, create standalone HSV/CMV infection entries, or add a Uveitides grouping -- left as deliberate follow-ups outside this issue's scope.

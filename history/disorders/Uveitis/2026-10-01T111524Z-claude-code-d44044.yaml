  summary: 'Genetics pass: decline MONDO:0014516 and record the anchor artefact'
  details: |
    Genetics pass for the d2g series-071 gap list (issue #12278). The series row for this parent, MONDO:0014516 microcephaly and chorioretinopathy 2 (PLK4), is declined, and the reasoning is recorded in the entry's notes. The row reached this parent only through MONDO's chain chorioretinitis to uveal disorder to uveitis, which is an artefact of the word chorioretinopathy: the condition is an autosomal recessive microcephaly syndrome with a developmental retinal dystrophy, not an inflammatory uveal disease. Its direct MONDO parents are microcephaly and chorioretinopathy and autosomal recessive disease, neither inflammatory, and its definition reads "Any microcephaly and chorioretinopathy in which the cause of the disease is a mutation in the PLK4 gene". The note points at the sibling condition already curated here, TUBGCP6-related Microcephaly and Chorioretinopathy, as the family the PLK4 form belongs with. No content change beyond that note. The entry's own gaps are reported rather than closed in this pass: HLA-B27 and ERAP1 are bound in the genetic section but reach no mechanism node, and five of eleven phenotypes have no incoming causal edge. Validation on the committed tree: just validate 0 issues, validate-terms passed, 57/57 snippets verified.

  summary: Link BMI, age, and joint injury to cartilage and senescence
  details: |
    Backfill for issue #8085. Three exposures across two nodes with three different justifications. High BMI is PREDISPOSES with INDIRECT_KNOWN_INTERMEDIATES into cartilage matrix catabolism and carries two evidence items: a Global Burden of Disease attribution of roughly a fifth of osteoarthritis burden to high BMI, and a review stating that obesity works through both mechanical and metabolic pathways. That second item is what makes the intermediates known rather than unknown. Age targets the chondrocyte senescence node this entry already frames as aging-associated, but is graded INDIRECT_UNKNOWN_INTERMEDIATES because what accumulates over those years to push a chondrocyte into senescence is not specified by the cited source, which reports a prevalence gradient rather than a count of senescent cells. PR review noted that the age item was tagged supports SUPPORT while its own explanation said the evidence establishes the age gradient and not the senescence step, which is the definition of PARTIAL and the rule this tranche stated for itself; it is now PARTIAL, matching the three structurally identical links elsewhere in the same tranche. Major joint injury is graded lowest at supports PARTIAL, one step below the entry's own SUPPORT item, because its sentence lists the exposure among risk factors for the disease and does not follow it to cartilage catabolism. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 30 of 30 verified.

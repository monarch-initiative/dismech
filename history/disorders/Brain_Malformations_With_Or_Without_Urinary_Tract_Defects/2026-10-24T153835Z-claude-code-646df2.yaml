  summary: 'Create: brain malformations with or without urinary tract defects'
  details: |
    Curated NFIA-related disorder (MONDO:0100478; OMIM 613735) de novo as a single-gene autosomal dominant Mendelian DISEASE. GeneReviews baseline (PMID:31194316, 'NFIA-Related Disorder') identified, fetched, tagged, and cross-referenced; all Clinical Characteristics phenotypes captured. NFIA haploinsufficiency modeled as a six-node causal pathograph (haploinsufficiency -> reduced NFIA transcription-factor activity -> impaired neurogenesis-to-gliogenesis transition and disrupted ureteric/metanephric development -> defective corpus callosum development, impaired CSF homeostasis, urinary tract defects). 16 phenotypes with HPO terms; genetic section (NFIA hgnc:7784, CAUSATIVE, GERMLINE, loss of function); supportive-care treatment. Evidence from Lu 2007 (PMID:17530927, founding five-patient study, full text), Revah-Politi 2017 (PMID:28941020), Bertini 2022 (PMID:36553517), Dini 2023 (PMID:37915986), Ogura 2022 (PMID:35018717, zebrafish functional), Deneen 2006 (PMID:17178400, primary gliogenesis mechanism), and GeneReviews. Deep research: requested provider falcon was UNREACHABLE (403 Edison authentication failure, confirmed via deep-research-client providers --check); used the claude_code provider instead (report research/Brain_Malformations_With_Or_Without_Urinary_Tract_Defects-deep-research-claude_code.md, 6 refs all verified, confabulation_rate 0.0) which confirmed the same primary sources and added no new citations. preflight-dr could not run: it requires the ~1.3GB local MONDO sqlite build, which was malformed and removed, and the shared container volume could not accommodate a rebuild; NEC risk mitigated because no report identifier was imported that was not independently verified against its primary source. Validated: just validate-disorders (schema+terms+references, 34/34 snippets, 0 issues); check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-coarse-phenotypes, check-qualifier-terms, check-snippet-grading, check-shared-disease-terms, check-genereviews all green. CI follow-up (same PR): check-gene-activity-grounding (ref mode) flagged the NFIA gene descriptor as newly ungrounded because its 'NFIA Haploinsufficiency' node carried no molecular function; grounded that node with NFIA's established DNA-binding transcription factor activity (GO:0003700, modifier DECREASED, consistent with the entry's loss-of-function/haploinsufficiency framing) rather than grandfathering it in the baseline. Re-ran the full suite: all green, no new term-cache row (GO:0003700 already cached by the sibling node).

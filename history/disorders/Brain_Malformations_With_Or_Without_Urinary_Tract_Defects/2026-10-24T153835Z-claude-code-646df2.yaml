  summary: 'Create: brain malformations with or without urinary tract defects'
  details: |
    Curated NFIA-related disorder (MONDO:0100478; OMIM 613735) de novo as a single-gene autosomal dominant Mendelian DISEASE. GeneReviews baseline (PMID:31194316, 'NFIA-Related Disorder') identified, fetched, tagged, and cross-referenced; all Clinical Characteristics phenotypes captured. NFIA haploinsufficiency modeled as a six-node causal pathograph (haploinsufficiency -> reduced NFIA transcription-factor activity -> impaired neurogenesis-to-gliogenesis transition and disrupted ureteric/metanephric development -> defective corpus callosum development, impaired CSF homeostasis, urinary tract defects). 16 phenotypes with HPO terms; genetic section (NFIA hgnc:7784, CAUSATIVE, GERMLINE, loss of function); supportive-care treatment. Evidence from Lu 2007 (PMID:17530927, founding five-patient study, full text), Revah-Politi 2017 (PMID:28941020), Bertini 2022 (PMID:36553517), Dini 2023 (PMID:37915986), Ogura 2022 (PMID:35018717, zebrafish functional), Deneen 2006 (PMID:17178400, primary gliogenesis mechanism), and GeneReviews. Deep research: requested provider falcon was UNREACHABLE (403 Edison authentication failure, confirmed via deep-research-client providers --check); used the claude_code provider instead (report research/Brain_Malformations_With_Or_Without_Urinary_Tract_Defects-deep-research-claude_code.md, 6 refs all verified, confabulation_rate 0.0) which confirmed the same primary sources and added no new citations. preflight-dr could not run: it requires the ~1.3GB local MONDO sqlite build, which was malformed and removed, and the shared container volume could not accommodate a rebuild; NEC risk mitigated because no report identifier was imported that was not independently verified against its primary source. Validated: just validate-disorders (schema+terms+references, 34/34 snippets, 0 issues); check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-coarse-phenotypes, check-qualifier-terms, check-snippet-grading, check-shared-disease-terms, check-genereviews all green. CI follow-up (same PR): check-gene-activity-grounding (ref mode) flagged the NFIA gene descriptor as newly ungrounded because its 'NFIA Haploinsufficiency' node carried no molecular function; grounded that node with NFIA's established DNA-binding transcription factor activity (GO:0003700, modifier DECREASED, consistent with the entry's loss-of-function/haploinsufficiency framing) rather than grandfathering it in the baseline. Re-ran the full suite: all green, no new term-cache row (GO:0003700 already cached by the sibling node). Review round 1 (ai4c-reviewer, review_id 5638835297/5639086383): bundled response addressing 4 blocking items plus cheap suggestions. (1) Added reference_title (copied verbatim from each cache's title frontmatter) to every evidence item; check-reference-titles green. (2) Expanded GeneReviews use: added a diagnosis section with three rows (molecular genetic testing NCIT:C15709 for the intragenic variant, chromosomal microarray NCIT:C18477 for the 1p31.3 deletion, karyotyping NCIT:C16768 for the 1p31.3 translocation), each quoting the exact establishment clause; added the 50% transmission-risk quote to inheritance and the specialist-surveillance quote to the treatment; added phenotypes nonspecific dysmorphic features (HP:0001999; also cited to PMID:28941020), recurrent urinary tract infection (HP:0000010), and cutis marmorata (HP:0000965). (3) Trimmed the Impaired CSF Homeostasis node to the sourced hydrocephalus/ventriculomegaly claim and dropped the unsourced ->Syringomyelia edge (Syringomyelia remains a clinically evidenced phenotype, now disconnected). (4) Grading: PMID:36553517 MH1/CTF biochemistry sentence HUMAN_CLINICAL->IN_VITRO (kept REVIEW_SYNTHESIS); PMID:35018717 CNS-TF background sentence HUMAN_CLINICAL+BACKGROUND->OTHER+BACKGROUND; both Bertini mouse-knockout sentences kept MODEL_ORGANISM and marked quote_role REVIEW_SYNTHESIS. Suggestions taken: rebound callosal hypoplasia evidence to Lu 2007's precise 'thin, hypoplastic, or absent corpus callosum' quote; added missense loss-of-function evidence to the NFIA genetic row (PMID:33973697 K125E two-patient clinical quote; PMID:35018717 p.Thr395Met zebrafish-rescue functional quote); added Bertini Table 5 pooled-literature frequency qualifiers (macrocephaly 22/26, DD 18/26, ID 15/26, seizure 4/26) with exact table-row quotes; added an inference note to the gliogenesis node stating the corpus-callosum and CSF edges are inferred from model-organism data. The K125E paper (PMID:33973697) was surfaced by the claude_code deep-research run, so the earlier 'added no new citations' PR-body statement was corrected. Full suite re-run green; snippet count 34->49, all exact-verified; no new term-cache row (all CURIEs already cached).

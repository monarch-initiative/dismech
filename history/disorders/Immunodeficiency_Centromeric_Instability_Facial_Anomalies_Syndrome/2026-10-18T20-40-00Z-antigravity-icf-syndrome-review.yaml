  summary: Expanded Immunodeficiency-Centromeric Instability-Facial Anomalies Syndrome with DNMT3B/ZBTB24/CDCA7/HELLS
    molecular grounding, subtypes, diagnostic cytogenetics, differential diagnoses, and HSCT/IVIG treatments.
  details: Added IUIS primary immunodeficiency and Harrison classifications, autosomal recessive inheritance
    evidence, global prevalence (<1 per 1,000,000, ~120 cases), two-phase clinical progression, evidence
    on ICF1-ICF4 subtypes, molecular_functions (GO:0003886, GO:0003677, GO:0005524) on the Pericentromeric
    DNA Hypomethylation trigger node, causal_link_type and evidence on downstream edges, reports_on readouts
    on hypogammaglobulinemia and centromeric instability phenotypes, evidence on all 4 causative genes,
    karyotyping/ immunoglobulin/NGS diagnostic entries, CVID and Bloom syndrome differential diagnoses,
    and therapeutic_modality on IVIG, HSCT, and antibiotic prophylaxis.

  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Extended the existing 17-hydroxyprogesterone biochemical testing diagnosis row with a MeasurementDescriptor bound to LOINC:53340-6 17-Hydroxyprogesterone [Moles/volume] in DBS (label read from the Monarch KG) and three reference ranges on that code: North-Eastern Italy programme term cut-off 30 nmol/L and gestational-age-related preterm cut-off 50 nmol/L (both PMID:15818055), and Cuba national programme recall cut-off above 55 nmol/L (PMID:23481450). The Cuban source says above 55, so the half-open band convention differs from the source at exactly 55 nmol/L; this is recorded in the range notes rather than hidden. The molar code was chosen because every cited cut-off is in nmol/L; the mass-concentration DBS code LOINC:38473-5 is named in notes but not bound. Added loinc_term LOINC:53340-6 on the existing Elevated 17-hydroxyprogesterone marker, whose notes already name 17-OHP as the newborn screening analyte. Cache rows seeded and normalized. Validated with just validate, validate-terms, count-verified-snippets (75/75), check-duplicate-keys, check-entity-refs, the LOINC schema pytest, a scratchpad render, and the batched validate-disorders sweep.

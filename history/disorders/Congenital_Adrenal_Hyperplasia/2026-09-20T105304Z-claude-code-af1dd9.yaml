  summary: 'Genetics pass: add HSD3B2/STAR/POR nodes, add the POR subtype, record
    the CYP21A1P gene-conversion mechanism'
  details: |
    Genetics pass for issue #12193 (d2g wiring-004). All five checklist genes (CYP21A2, CYP11B1, CYP17A1, HSD3B2, STAR) were already bound, so the checklist items were export-layer gaps: every one of them hangs off a has_subtypes term, and gene_to_edge reads only the entry's own disease_term. Two of the five were nonetheless real curation gaps in a different sense - HSD3B2 and STAR had no evidence at all and no pathophysiology node.

    Wiring each gene to the step it occupies. CYP21A2, CYP11B1 and CYP17A1 already had their own nodes. Three were added. HSD3B2 3-Beta-Hydroxysteroid Dehydrogenase Deficiency sits earlier in the pathway than the hydroxylase blocks because the delta-5 to delta-4 conversion is shared by all three steroid classes, which is why the defect is adrenal and gonadal. STAR-Dependent Mitochondrial Cholesterol Import Failure sits above every enzymatic block: the substrate never reaches the first committed step. POR Electron-Transfer Failure to Microsomal P450 Enzymes is the only lesion here that reaches more than one enzymatic node, and it is wired that way - two downstream edges, to the CYP21A2 and CYP17A1 nodes - because POR is the shared NADPH electron donor rather than a steroidogenic enzyme, which is what makes POR deficiency a combined rather than a single-step block.

    POR added beyond the checklist. MONDO:0013310, congenital adrenal hyperplasia due to cytochrome P450 oxidoreductase deficiency, is a direct child of this entry's own disease term and had no has_subtypes row. It now has one, with the gene bound, and a genetic record carrying the ClinGen definitive assertion (scoped to the Antley-Bixler-with-disordered-steroidogenesis label, which is noted). CYP11A1 was considered and rejected: MONDO's only CYP11A1 congenital adrenal hyperplasia classes are non-human-animal ones, so there is no term to anchor a row on, and the STAR record records that instead.

    CYP21A1P and the gene-conversion mechanism. The entry said nothing about the lesion type, which is unlike every other gene here. CYP21A2 sits in the RCCX module beside a highly homologous pseudogene, and most disease alleles are transfers of the pseudogene's variants rather than independent mutations. A notes block now records this with five evidence items covering the shares (over 95 percent from intergenic recombination, 70 to 75 percent microconversion, 20 to 25 percent crossing-over, 5 to 10 percent outside both), the 30-kb deletion and chimeric gene, and the two practical consequences: a recurrent variant set seen in all populations, and the fact that next-generation sequencing is not yet recommended for this locus because it miscalls pseudogene variants.

    Other. All eight existing has_subtypes rows gained their genes list, and the five existing genetic records gained relationship_type CAUSATIVE and variant_origin GERMLINE. HSD3B2 and STAR gained evidence and notes. The GeneReviews 21-hydroxylase chapter was added to references and cited on the salt-wasting and simple-virilizing rows, with the explanation stating the denominator explicitly - those fractions are of classic 21-OHD, not of all CAH.

    Self-review corrections. A first draft of the CYP21A1P notes stated the crossing-over and residual fractions without quotes; three further snippets were added rather than the numbers trimmed. A POR snippet was four words and failed check-snippet-length; it was replaced by the full enumeration sentence, which preserves the source's own typo in the 3-beta symbol.

    Validation. just validate-pre-edit, count-verified-snippets 67/67, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-snippet-length, list-gene-term-mismatches all clean. Gene-to-mechanism wiring moved from 3/5 to 6/6.

    Not addressed. Phenotype causal inlink is 2/11 and unchanged. The new nodes feed the existing Cortisol and Aldosterone Deficiency node rather than reaching phenotypes; connecting the clinical features is separate curation.

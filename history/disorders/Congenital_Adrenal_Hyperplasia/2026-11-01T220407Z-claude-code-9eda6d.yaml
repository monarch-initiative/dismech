  summary: Curate 17A-OHD partial-deficiency spectrum, carrier burden and catalytic
    mechanism from a CYP17A1 variant enzymology preprint
  details: |
    Source: Li K, Yakubu J, Jorgensen FS, Pandey AV, DOI:10.20944/preprints202610.2735.v1
    (preprints.org, posted 2026-10-28). Not peer reviewed. The cached record is
    abstract-only; a --force re-fetch was attempted and returned the same 4004-byte
    abstract (full_text_declined: landing_page_only), so every snippet here is an
    abstract sentence. Figures and tables of the PDF are not quotable and no number
    from them was written into prose.

    The paper assays seven CYP17A1 missense variants (T131P, L209P, I296T, G303D,
    R340H, L361P, R449H) in HEK293T cells for both CYP17A1 reactions separately,
    each normalized to immunoreactive enzyme, across ten probands spanning partial
    and complete deficiency.

    What was added, all scoped to the existing 17A-OHD subtype rather than to CAH
    as a whole:

    - has_subtypes 17A-OHD: the description now records that this subtype is a
      spectrum, with partial alleles compatible with spontaneous puberty and
      fertility and frequently mistaken for PCOS or primary ovarian insufficiency.
      Evidence is graded quote_role BACKGROUND because the sentence is from the
      abstract's Context section, so it is the authors' framing of prior literature
      rather than their own result.
    - pathophysiology 'CYP17A1 17-Hydroxylase/17,20-Lyase Deficiency': description
      and two IN_VITRO evidence items recording that the block is catalytic in an
      enzyme still expressed, not loss of enzyme, and that the hydroxylase and lyase
      reactions are lost to different degrees. A second molecular_functions
      descriptor was added for the 17,20-lyase reaction with preferred_term only and
      no term: GO:0004508 is defined as 17-alpha-hydroxylation (RHEA:65760) and GO
      has no term for the lyase reaction, so no identifier is asserted rather than
      reusing the hydroxylase term. The explanation carries the authors' own caveat
      that for severe alleles the upstream hydroxylation step limits flux in vivo,
      so retained lyase activity measured on supplied substrate does not imply
      retained sex-steroid output.
    - biochemical 'Elevated serum progesterone' (subtype 17A-OHD): progesterone is a
      screening marker here, raised across the whole severity range, while morning
      cortisol is what separates partial from complete deficiency. Kept distinct
      from the existing 17-hydroxyprogesterone entry, which is the 21-OHD newborn
      screening analyte.
    - prevalence: two CARRIER_FREQUENCY records, global 97.8 and East Asian 191.2
      per 100,000 (1 in 1,023 and 1 in 523). Graded COMPUTATIONAL because they are
      derived from cumulative gnomAD v4.1 allele counts under Hardy-Weinberg rather
      than measured in a cohort, and the notes carry the authors' own statement that
      complete penetrance and no ascertainment bias are assumed, making these upper
      bounds. prevalence_class is set only on the East Asian record; the global
      value of 9.8 per 10,000 falls between BAND_1_5_PER_10000 and ABOVE_1_IN_1000,
      which the Orphanet bands do not cover, and the notes say so. The predicted
      birth prevalences are in a PDF table, not the abstract, so they were not
      recorded.

    Deliberately not done: 17-OHD was not promoted out of this entry into its own
    Disease entry. The granularity ladder would support that case, but it is a
    lump/split decision for a maintainer, needs a covering grouping and a
    curated_in pointer subtype, and should not be made on the strength of one
    preprint. No AlphaMissense/CADD predictor-performance content was curated; that
    is variant-interpretation methodology rather than disease pathophysiology.


  summary: Replace the diagnosis snippet with the paper's own conclusion
  details: |
    The CYP21A2 genetic-testing entry claims the test supports diagnosis, genotype-phenotype interpretation, family counselling and recurrence-risk assessment. The sentence quoted here said only that molecular diagnosis of 21OHD is complex and involves ongoing challenges, which supports none of the four. The curator had recorded exactly that and graded it PARTIAL; when #7439 retired PARTIAL the item became SUPPORT, so the entry asserted that a sentence about difficulty supported four specific clinical uses.
    First regraded to NO_EVIDENCE on the reasoning that the quote does not bear on the claim. That was the wrong remedy and the review on PR #10136 caught it: it left a diagnosis claim with no supporting evidence at all, when a better sentence was already sitting in the committed cache. My own explanation had said one 'may exist in the same paper' without my checking whether it did.
    Replaced the snippet instead, with the paper's own concluding assessment from references_cache/PMID_39911519.md: 'However, a genetic test to determine the CYP21A2 variants is central in confirming the 21OHD diagnosis, genetic counseling, to predict the phenotype and possibly other aspects of CAH such as long-term outcomes.' That covers the uses the entry claims, so supports returns to SUPPORT. Verified as an exact substring of the cache; 39/39 snippets in the file verify.

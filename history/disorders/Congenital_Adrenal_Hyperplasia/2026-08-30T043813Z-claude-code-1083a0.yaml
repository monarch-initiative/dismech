  summary: Regrade a diagnosis citation to NO_EVIDENCE
  details: |
    The CYP21A2 genetic-testing entry claims the test supports diagnosis, genotype-phenotype interpretation, family counselling and recurrence-risk assessment. The cited sentence from PMID:39911519 says only that molecular diagnosis of 21OHD is complex and involves ongoing challenges, which does not bear on any of those uses. The curator had recorded exactly that and graded it PARTIAL; when #7439 retired PARTIAL the item became SUPPORT, so the entry asserted that a sentence about difficulty supported four specific clinical uses. Regraded to NO_EVIDENCE, which is what the explanation already described. The reference is kept: it is the right paper for this entry and a better sentence may exist in it, so it is the quote that needs replacing rather than the citation.

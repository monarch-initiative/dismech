  details: |
    Review round 1 on PR #12328 (issue #12193).

    Suggestion 4, taken as a prose fix rather than a rename. The reviewer noted that the POR node's DIRECT edge lands on a node named 'CYP21A2 21-Hydroxylase Deficiency', so the target name may be doing double duty: POR deficiency does not produce a CYP21A2 lesion, it removes the electron supply that CYP21A2 catalysis depends on. The node's content was already the enzymatic block rather than the gene lesion, so the edge is correct; what was missing was saying so. Both the CYP21A2 and CYP17A1 node descriptions now state that the node is the enzymatic block with two inbound routes - a biallelic variant in that gene, or loss of POR electron supply without any variant in it.

    Renaming the nodes to name the block rather than the gene was considered and rejected: kb/node_classes/pathograph_node_classes.txt cites 'CYP21A2 21-Hydroxylase Deficiency' as a worked example, so a rename would break that file's leaf-resolution check for a cosmetic gain.

    Self-review corrections found while waiting for the verdict. Three mechanism claims in the new nodes and records were true and supported by a cited reference but not attached to a quote. Each now carries one: the StAR cholesterol-transport step the STAR node places above every enzymatic block; the sentence establishing that the HSD3B2 block affects cortisol, aldosterone, progesterone, androgens and estrogens, which is what 'shared by all three steroid classes' rests on; and the statement that HSD3B1 mutations have never been reported in humans, which is what the isozyme claim in the HSD3B2 record rests on. All three are graded REVIEW_SYNTHESIS, since the source is a review.

    Validation. count-verified-snippets 70/70; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, list-gene-term-mismatches clean.

  summary: 'Review: methods-sentence evidence, model-organism-only human claims, over-claims'
  details: |
    Correctness review, focused on claim-evidence matching. (1) The Hypertension phenotype cited a METHODS sentence from PMID:36857009 ('Information collected included ... hypertension ...') as SUPPORT - that sentence only lists which variables the survey collected and establishes no occurrence of hypertension. Replaced with the results sentence from the same paper reporting 10/73 (14%) treated for hypertension. (2) Two biochemical markers rested solely on animal models, contrary to the rule that model-organism evidence should not be the only support for a human finding. Elevated 17-hydroxyprogesterone cited only a zebrafish study despite 17-OHP being the human newborn-screening analyte; added human evidence (PMID:31984156). Reduced Cortisol cited only a humanized mouse whose quoted readout is CORTICOSTERONE, the rodent glucocorticoid, not cortisol - a genuine claim-evidence mismatch; added human evidence (PMID:37176569) and regraded the mouse item to PARTIAL with the species caveat stated. (3) Three SUPPORT grades downgraded to PARTIAL where the snippet is broader than the claim: Salt-Wasting Electrolyte Crisis (snippet names only aldosterone deficiency, not salt-wasting/hyponatremia/crisis), Ambiguous Genitalia and 46,XX Virilization (snippet says only 'sexual development disorders'), and CYP21A2 genetic testing (snippet is a rhetorical sentence about molecular diagnosis being complex). (4) Rewrote the disease description, which leaked curation-process metadata into user-facing text ('because Falcon research identified it as...'), into a substantive mechanistic description; moved the scoping note to 'notes'.

  summary: Add the somatic MAPK lesion node, carrying both precursor models
  details: >-
    Adds a Somatic MAPK Lesion in a Myeloid Precursor node upstream of the existing MAPK/ERK Pathway
    Activation node, so the entry's causal chain starts at the lesion rather than at the pathway
    state. The node carries the claim the cited 2014 study is about: which precursor the mutation
    occurs in, rather than whether it is present, is what ties to clinical risk. In patients with
    active high-risk disease the mutation is in circulating myeloid fractions and in bone-marrow
    CD34-positive progenitors; in low-risk disease it is confined to the lesional CD207-positive
    dendritic cells. Two read-only verifiers were run in parallel against the diff, split by axis,
    and between them found nine things, all corrected before the push. The node first said the
    initiating event is a somatic mutation in a myeloid precursor as settled fact, where its own
    evidence quotes the authors proposing it as a hypothesis; the description now reads to that
    strength. It said expressing the mutation at each stage in mice reproduces the matching arm of
    the human disease, which the same cached paper contradicts twice over: the aggressive mouse
    model's mutation was restricted to the dendritic lineage and absent from early myeloid
    precursors or multipotent progenitors, so the mouse brackets DC-committed progenitor against
    differentiated DC rather than the human pair, and the paper's own words are recapitulated many
    features of and more closely resembled rather than reproduced. The causal claim rested on a
    comparison sentence rather than on the sufficiency sentence one earlier in the same abstract,
    which is now quoted and graded MODEL_ORGANISM and INDIRECT. The downstream edge's only evidence
    quotes staining that the source reports as occurring regardless of mutation status, and reads
    that as showing the pathway is activated generally with the mutation not its only cause; the
    explanation now discloses that rather than passing over it, and the edge no longer claims the
    mutation is the sole route. A calibrating sentence was added, that the mutation's presence in
    tissue dendritic cells does not by itself define risk groups. The word active was restored to
    the high-risk claim. A sentence in notes claiming the source says nothing about CD38 was false -
    CD38 is in its flow-cytometry panel - and now says what was actually sorted, which was CD34 and
    CD14 in three colours. And CL:0000782 myeloid dendritic cell was bound for a CD207-positive
    cell: CL describes that term as CD1a-negative and CD207-negative and makes it a sibling of
    Langerhans cell rather than an ancestor, so it generalised over nothing. The binding is now
    CL:0000990 conventional dendritic cell, a true ancestor of both readings; Langerhans cell itself
    is not used because the cited study's argument is that this is a myeloid neoplasia arising in a
    tissue-restricted precursor. The node binds two cell types and so makes the entry derive two
    cells of origin, which is the honest state of the source's claim rather than a lump to split,
    and notes says so.


    A review round added the competing model. The node's cited study confines the mutation to
    lesional dendritic cells in low-risk disease; a 2020 study this entry already cited on another node found mutant BRAF across multiple low-risk
    patients in some combination of lesional monocytes, macrophages, dendritic cells and
    osteoclast-like cells and of blood monocytes and dendritic cells, and hypothesises one
    bone-marrow-resident progenitor carrying the lesion in both risk groups. That sentence's two
    and/or constructions mean it does not establish the blood compartment specifically in more than
    one patient, and the refutation does not need it to. Three
    evidence items from it are added here: a REFUTE against the low-risk restriction, and two
    SUPPORT items for the progenitor half and for the hypothesis as the authors state it. The description carries both readings, says what they share - a somatic MAPK lesion in the myeloid
    dendritic lineage arising before the lesion forms - and says plainly that they do not share a
    cell, since the earlier model's own discussion puts the low-risk lesion in a differentiated
    tissue-resident dendritic cell while the later one puts it in a marrow progenitor in both risk
    groups. The notes claim that no finer progenitor term is supported is narrowed rather than
    removed: it now applies to the marrow fractions the 2014 study genotyped directly, sorted on
    CD34 and CD14 alone, and not to that study as a whole, which sorted a finer panel for its colony
    assay. A notes clause that described a tooling report rather than the disease is replaced by
    what it was there to say. The cell-type binding's preferred_term no longer calls the
    conventional dendritic cell a precursor, because CL files that term as differentiated and the
    2014 study is itself inconsistent about the stage: its abstract says precursor, its discussion
    and its mouse model say differentiated. The round's other requested change was not made, because
    the request was wrong. The reviewer asked for an edge explanation to stop crediting the authors
    of PMID:20519626 with reading their regardless-of-mutation-status staining as showing the
    mutation is not the pathway's only cause, on the ground that they draw no conclusion from it.
    That cache is full text, and its results say: suggesting that BRAF pathway activation may occur
    generally in LCH but that BRAF mutation is not its only cause. The original wording was right.
    It was changed to the reviewer's version and then changed back when a verifier found the
    sentence, so the entry briefly carried a false statement about what the authors concluded. The
    explanation now quotes the paper's own inference and points at this entry's MAP2K1 and ARAF
    records for what the other causes are.

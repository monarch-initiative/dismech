  summary: Add neuroblastoma as a differential diagnosis
  details: |
    Creates the differential_diagnoses section, directly after treatments:, with a Neuroblastoma row. Both can produce orbital bone lesions in children: the AFIP orbit review (Chung 2008, PMID:18635637) and the Euro Histio Net guideline's Table I, which lists neuroblastoma among the differentials for orbital involvement (PMID:23109216; one part of that snippet joins two cells of the table, as its explanation says). Two distinguishing features, including the CD1a/langerin phenotype as stated in PMID:29754886, already cited in this entry. No PHOX2B item: no source compares PHOX2B for this pair (the PubMed query is recorded in the PR body). Part of the neuroblastoma expansion series (issue 15822); the same PR gives five other paediatric tumour entries a matching Neuroblastoma row. The row binds MONDO:0005072, copied from kb/disorders/Neuroblastoma.yaml, so the rendered page links to that entry. Every distinguishing feature is a finding from a quoted sentence. No other part of the entry changes. Validation on the branch rebased onto main: the run_c4 gate set over all six entries (validate-disorders, count-verified-snippets --strict, check-snippet-grading and the whole-repo gates), check-reference-titles-present, check-cache-order, check-logical-rules and check-qualifier-terms all passed.

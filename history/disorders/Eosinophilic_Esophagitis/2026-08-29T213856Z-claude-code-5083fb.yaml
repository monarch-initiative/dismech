  details: |
    # Evidence review — Eosinophilic_Esophagitis.yaml

    ## Stats
    - Evidence items checked: 35 (across prevalence, mechanistic_hypotheses, pathophysiology, histopathology, phenotypes, diagnosis, treatments, discussions, clinical_trials).
    - Distinct references read: 12 (PMID_30364207, PMID_19596009, PMID_29980278, PMID_35899466, PMID_26857345, PMID_38256003, PMID_39941170, PMID_39745304, PMID_36546624, PMID_38135920, PMID_29372536, clinicaltrials_NCT03633617). All caches present.
    - Snippets verified against cache: 35/35 (whole-file audit 71/74 with 3 geo: dataset accessions skipped by prefix; none belong to an evidence item here).
    - Verified clean (snippet + grade + source + claim all sound): 34 of 35 after the one fix below.

    ## Findings

    1. pathophysiology "Environmental Detergent Exposure" > evidence[0] (line ~152), PMID:35899466, `evidence_source: IN_VITRO`. Severity: MINOR. The snippet is the paper's CONCLUSION sentence ("Exposure to SDS decreases esophageal barrier integrity, stimulates IL-33 production, and promotes epithelial hyperplasia and tissue eosinophilia"). That conclusion aggregates both the in vitro EPC2/organoid arm AND the in vivo mouse arm — the "tissue eosinophilia" and "epithelial hyperplasia" specifically come from the 0.5% SDS drinking-water mouse experiment, not the cell culture. Grading the item IN_VITRO is defensible (barrier-integrity/IL-33 results are the cell-culture readouts and the next item already carries the MODEL_ORGANISM claim), but the old `explanation` over-claimed that cell-culture/organoid experiments themselves showed "eosinophilia." ACTION: fixed (explanation only) — reworded to "impairs esophageal barrier integrity and induces IL-33 expression; the tissue eosinophilia in this summary conclusion comes from the study's mouse arm, cited separately below." Snippet, source, and grade left unchanged.

    2. pathophysiology "Environmental Detergent Exposure" > evidence[1] (line ~158), PMID:35899466, `evidence_source: MODEL_ORGANISM`, snippet "Detergents may be a key environmental trigger in EoE pathogenesis." Severity: NOTE. The quoted sentence is the paper's final speculative statement and is not itself model-organism data; however the paired evidence item legitimately anchors the mouse arm of this same in vivo study and the node is explicitly framed as model-supported and hypothesis-grade (with a dedicated KNOWLEDGE_GAP discussion `gap_eoe_detergent_human_causality`). ACTION: reported only — acceptable as-is; MODEL_ORGANISM is the honest classification of the in-vivo study this item represents.

    3. mechanistic_hypotheses / pathophysiology / phenotypes uses of PMID:19596009 (Rothenberg 2009 review) graded `evidence_source: OTHER`. Severity: NOTE. This is a narrative review; OTHER is a reasonable (conservative) classification for a review that mixes human, animal, and expression-signature evidence, and the same sentence keeps one value across all its occurrences (no check-snippet-grading conflict). ACTION: reported only — no change.

    4. diagnosis "Esophagogastroduodenoscopy…" evidence, PMID:39745304 (ACG guideline) `evidence_source: OTHER`. Severity: NOTE. Correct — a clinical practice guideline / consensus recommendation, not primary study data. Snippet is an exact guideline recommendation supporting the monitoring claim. ACTION: reported only — clean.

    5. clinical_trials NCT03633617 evidence, `evidence_source: HUMAN_CLINICAL`, snippet quotes the registered Part B objective. Severity: NOTE. INSTRUCTIONS suggest registration records could read OTHER, but the dominant KB convention for `clinicaltrials:` references is HUMAN_CLINICAL (1007 vs 63 across kb/disorders), the trial is a genuine phase-3 human trial, and the paired NEJM result (PMID:36546624) independently supports the efficacy claim. ACTION: reported only — left as HUMAN_CLINICAL per KB convention.

    6. Spot-checks of the remaining pathophysiology/phenotype/treatment items (barrier dysfunction/SPINK7 from PMID:29980278; TSLP susceptibility locus; Th2/IL-5/IL-13; eotaxin-3/CCL26 recruitment; >=15 eos/hpf diagnostic threshold; histology-score remodeling from PMID:26857345; fibrosis/EMT/TGF-beta from PMID:38256003; dupilumab from PMID:36546624 + review confirmations; PPI/steroid/diet/dilation from PMID:30364207; anti-IL-5 symptom-gap from PMID:29372536) all quote exact, substantively supporting result sentences with honest grades. Severity: NOTE. ACTION: none — clean.

    ## Sections reviewed
    prevalence, mechanistic_hypotheses, pathophysiology, histopathology, phenotypes, diagnosis, treatments, discussions, clinical_trials, datasets (dataset snippets are geo: accessions, prefix-skipped), references.

    ## Verdict
    Evidence quality is high and disciplined. Snippets are exact substrings that substantively support their claims, grades are honest, and the entry is careful to fence hypothesis-grade nodes (detergent trigger, antigen specificity) behind explicit KNOWLEDGE_GAP discussions. The only substantive issue was a single over-reaching `explanation` on the detergent IN_VITRO item that credited cell-culture experiments with the eosinophilia readout actually produced in the study's mouse arm; fixed by narrowing the explanation, leaving snippet/source/grade intact. No Named Entity Confusion, no direction mismatches, no title-as-finding snippets found.

  details: |
    Integrated the RETAINED and QUALIFIED claims of the existing codex assessment of kb/hypotheses/Eosinophilic_Esophagitis/barrier_antigen_type2_specificity_model/openscientist.md, working only from primary sources re-fetched into references_cache rather than from the report's proposed snippets. Added: DSP gene binding (hgnc:3052) plus two evidence items (PMID:34815391) to Esophageal Epithelial Barrier Dysfunction, and a prose qualification that the barrier's temporal direction is unsettled; a new pathophysiology node Epithelial Type II IL-4 Receptor Signaling with three evidence items (PMID:36070083) and edges to eosinophil recruitment and to fibrosis, plus an incoming edge from Type 2 Immune Activation, curated as a strongly supported experimental route rather than a proven exclusive human effector pathway; a new pathophysiology node Esophageal Mast Cell Accumulation (PMID:29772120 human biopsy morphometry, PMID:37302713 coculture and oncostatin M) with a feedback edge onto the barrier node, hedged as a parallel effector arm; MESSINA phase 3 benralizumab evidence (PMID:38924732) and an expanded rationale on gap_eoe_eosinophil_symptom_causality; food-specific T-cell receptor evidence (PMID:37203302) and a rationale qualification on gap_eoe_food_antigen_specificity, because the report's 'entirely unknown' framing was too categorical; two new KNOWLEDGE_GAP discussions, gap_eoe_barrier_cause_or_consequence (PMID:34815391, PMID:39343172) and gap_eoe_type2_molecular_heterogeneity (PMID:32197970). Left out: the report's REJECTED claim that no human single-cell ILC2 profiling exists; its TSLP to mast cell and IFN-gamma and microbiome candidate edges, which the assessment did not retain; its proposed Reactome ontology terms and an IL13RA1 or OSM gene binding, since none of those CURIEs are in this repo's term caches; and its suggestion to upgrade the hypothesis status, which its own Candidate Status Changes section says to leave at EMERGING. PMID:39891629 was fetched but has no abstract text in the cache, so no snippet could be verified from it. Verified with linkml-validate (Disease), count-verified-snippets 52/52, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values.

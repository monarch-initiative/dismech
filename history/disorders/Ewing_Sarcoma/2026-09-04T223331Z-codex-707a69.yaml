  summary: Review Ewing sarcoma mechanisms, clinical scope and four
    OpenScientist reports
  details: |
    Review scope and inputs
    - Read the entire Ewing_Sarcoma disease YAML and all four OpenScientist reports with citation sidecars (canonical fusion enhanceropathy, cell of origin, replication stress, cohesin high-risk modifier).
    - Read both broad deep-research artifacts and the Falcon citation sidecar. Falcon supports major fusion/chromatin/metabolic/clinical themes; its phenotype frequencies and ontology candidates were not accepted without primary verification. The cyberian-codex file is a short local placeholder synthesis, not independent substantive deep research.
    - Independently fetched and examined high-value mechanistic, human-cohort, clinical-trial and guideline sources. No provider computational bundle, dataset export or executed analysis was available. No new experimental or raw-data reanalysis is claimed.

    Content-completeness checklist
    1. Phenotypes: corrected adult-cohort scope for pain and swelling; removed unsupported symptom frequency bands; separated presentation metastasis, three-year EFS and five-year OS; distinguished disease-related and post-treatment fracture. Supported fever/weight loss from the general clinical discussion of a didactic article, not its fictional case. Added a local bone-destruction mechanism connecting osseous growth to pain/fracture.
    2. Subtypes: retained ontology-bound osseous/extraskeletal presentations; distinguished FET-ETS Ewing sarcoma from CIC/BCOR/EWSR1-non-ETS sarcomas. Removed automatic generalization of all detailed EWSR1-FLI1 results to every rare fusion partner. Rare FUS fusions are included in the definition.
    3. Pathophysiology: separated hub dynamics from protein dosage; NuRD/LSD1 repression from CHD4 architecture maintenance; transcription-associated R-loops, BRCA1 availability, DHX9 under TOP1 stress, SLFN11 fork arrest and USP1-survivin buffering. Added provisional POLQ/MMEJ splicing, SLFN11-loss lipid remodeling, PARP1-supported transcription, IL-6/STAT3 stroma signaling, hybrid matrix-producing tumor states, EZH2 differentiation repression and HOXD13 plasticity. Removed enhancer-to-STAG2-loss, enhancer-to-ETV6 and permissive-cell-to-fusion arrows. Did not invent edges to force strong connectivity. Broader-cancer STAG2/HR evidence is a research gap rather than a confirmed Ewing edge.
    4. Treatment/trials: retained multimodal chemotherapy/local control, added randomized interval-compression and EE2012 evidence, five trial records, advanced-disease cabozantinib activity, negative ganitumab and 2026 zoledronic-acid results, and limited later olaparib-irinotecan activity. Separated dual PARP-HDAC pharmacology from talazoparib-temozolomide, removed unsupported direct CHD4 targeting, and redirected USP1 inhibition to its survival buffer. Preclinical targets are not called proven treatments. No unverified current trial recruitment status was asserted.
    5. Genetics: retained acquired fusion and recurrent STAG2/TP53/CDKN2A alterations; distinguished IHC protein loss from sequence mutation and CDKN2A deletion from point mutation. Human germline susceptibility is locus-specific, not Mendelian penetrance. BARD1 model evidence does not imply a 10% BARD1 frequency.
    6. Diagnostics/biomarkers: added integrated biopsy, immunophenotype and genetic confirmation; CD99/NKX2.2 specificity limits; imaging and marrow-staging scope; localized/metastatic/relapsed stages. Corrected high-grade evidence and described necrosis as post-chemotherapy response rather than a universal presenting morphology.
    7. References: replaced numerous non-propositional truncated snippets with individually inspected complete source statements; all new/modified titles come from generated reference-cache frontmatter. Prior source snippets falsely conflating neuroectodermal origin or observational surgery benefit were replaced. Source quotes and structured evidence types retain clinical, experimental and review distinctions.
    8. Overall consumption: the central supported themes across all four reports and broad research are represented. Peripheral untested therapeutic combinations, exhaustive database absences, unsupported causal independence, speculative SIX1/STAG2 links and ontology candidates are assessed or kept as research questions rather than asserted as established edges.
    9. Models/datasets: separated neural-crest-targeted zebrafish and human-MSC xenograft validation from non-animal cultures; removed the unsupported flow-bioreactor-to-developmental-YAP edge and OrganOnChip classification. Existing catalog datasets remain metadata records, not claimed independently accessed patient data. The frozen accession blob was never read, written or staged.

    Report assessment findings
    - Four authoritative codex assessment YAMLs contain 55 claim dispositions and 24 reported/proposed analysis inventories. Future tests are SKIPPED. Claimed cBioPortal and knowledge-graph analyses are REPORTED_ONLY/UNVERIFIABLE without artifacts. Negative database/registry searches are UNVERIFIABLE.
    - Reject the reversed NR0B1 ancestry claim and added unstudied Asian population; African subjects had longer NR0B1 repeats in PMID:22749036. Different COG IHC/EFS and Japanese profiling mutation/OS cohorts do not establish ancestry-specific prognostic biology.
    - Reject cBioPortal point-mutation mutual exclusivity as confirmation of CDKN2A deletion exclusivity, and do not treat publication-derived portal cohorts as independent biological validation.
    - Reject the report BARD1 ~10% attribution; the source refers to variants across many DNA-repair genes. Reject IHC protein loss as proof of epigenetic silencing.
    - Qualify two unflagged preprints (endogenous hubs, POLQ/MMEJ), developmental IGF-1/YAP1 in mouse cells, zebrafish versus human lineage, partial fusion depletion versus patient drug outcomes, and complete independence of DHX9 sequestration from transcription.
    - Correct YAP1 transcriptional opposition versus tumor suppression, and the assumption that all permissive GGAA sites must already be open before fusion expression. The fusion is a pioneer factor.

    Validation
    - just validate-disorders kb/disorders/Ewing_Sarcoma.yaml passed schema, ontology-term and no-full-text reference validation: 188/188 evidence snippets verified.
    - All four assessment files passed both LinkML schema validation and report quote/path/provenance-link validation.
    - Targeted duplicate-key, enum, entity-reference, causal-target, qualifier-term, source-defect and snippet-boundary checks passed.
    - Single-disease HTML render succeeded; generated page is not part of the curation commit.
    - Falcon named-entity preflight warned because FLI1 is mentioned as often as EWSR1; these are the two partners of the disease-defining fusion, so this is not evidence of entity confusion. The review separately checked Ewing versus non-Ewing round-cell sarcoma scope.
    - Reference-title, snippet-grading (after correcting one review article classification), folded-hyphen, cache-order, term-cache-integrity and reference-cache-frontmatter gates passed. Causal graph construction produced 57 nodes and 63 edges without orphan targets or integrity issues; a static graph was visually inspected. No human clinical efficacy or reproducible provider computation is inferred from schema validation.

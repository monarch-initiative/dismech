  summary: Integrate assessed OpenScientist findings across four hypotheses
  details: |
    Reviewed all four OpenScientist hypothesis reports under
    kb/hypotheses/Ewing_Sarcoma/ and wrote an assessment sidecar for each
    (openscientist-assessment-by-claude-opus-5.yaml; none existed before). Only
    RETAINED and QUALIFIED claims whose citations were absent from this entry
    were integrated. Every snippet was copied from the local reference cache
    after fetching, never from the reports.

    canonical_fusion_enhanceropathy_model (SUPPORTED). Added two evidence items
    to the EWS-FLI1 Hub and Dosage Control node from Aynaud 2020
    (PMID:32049009), tying an intermediate window of fusion activity to
    proliferation and oxidative phosphorylation with hypoxia at both extremes -
    the node previously had no metabolic consequence and the metabolic node
    covers only the ATF4 serine-glycine arm. Added discussion
    gap_ewing_intratumoral_regulatory_module_heterogeneity for the co-existing,
    TGF-beta-modifiable regulatory modules reported by Waltner 2025
    (PMID:40667384), which the entry's single-graded-output model does not
    accommodate; the preprint status and cell-line-derived module structure are
    recorded in the rationale.

    cell_of_origin_context_model (PARTIALLY_SUPPORTED). Added two MODEL_ORGANISM
    evidence items to Permissive Progenitor Cell State from the zebrafish neural
    crest model, cited as the peer-reviewed PMID:41072418 rather than the
    bioRxiv preprint PMID:39554045 - the report listed both as separate
    high-confidence evidence rows for what is one study. Added discussion
    gap_ewing_adult_onset_extraskeletal_origin (PMID:22959474) because the
    entry's developmental and pubertal-window mechanisms do not cover the ~14%
    of cases presenting at 40 or older, two thirds extraskeletal.

    cohesin_modified_high_risk_model (PARTIALLY_SUPPORTED). Added three evidence
    items to STAG2-Modified Enhancer State: STAG1 cannot substitute for STAG2 at
    CTCF-free enhancers (PMID:29867216) and is a selective synthetic-lethal
    dependency of STAG2-deficient cells (PMID:32467316). STAG1 was previously
    absent from the entry; both are cross-cancer studies and the explanations
    say so. Added Crompton (PMID:25186949) to the STAG2 genetic entry with a
    notes qualification, since nongenetic inactivation is what reconciles the
    recorded 17% mutation frequency with the higher protein-loss rate cited
    beside it. Added discussion
    gap_ewing_stag2_loss_to_fusion_protein_abundance linking the STAG2 node to
    the dosage node via the uncharacterised protein-abundance increase, with
    USP19 (PMID:30700749) as the concrete testable route.

    replication_stress_vulnerability_model (PARTIALLY_SUPPORTED). Qualified the
    Replication Stress and Impaired Homologous Recombination description and the
    PARP Inhibitor Combination Therapy description, both of which asserted an
    HR-deficiency rationale that PMID:26505995 contradicts. Added that study
    (one REFUTE, one SUPPORT item) plus the PARP1/fusion transcriptional
    feedback loop (PMID:22287547) and the MMEJ defect via POLQ mis-splicing
    (PMID:40568108) to that node, and added the AcSe-ESMART olaparib plus
    irinotecan Ewing cohort result (PMID:41591981, 6.3% ORR with two durable
    responders) plus olaparib and irinotecan therapeutic agents to the
    treatment.

    Deliberately not changed. No hypothesis status was altered: three reports
    recommended keeping the current status, and the fourth recommended promoting
    replication_stress_vulnerability_model to "ESTABLISHED", which is not a value
    in MechanisticHypothesisStatusEnum and would in any case misdescribe a
    superimposed vulnerability framework that ALTERNATIVE already denotes. No
    ontology term proposed by any report was adopted: MONDO:0007898 resolves to
    "leukocyte nuclear appendages, hereditary prevalence of", HP:0030416 to
    "Vulvar neoplasm", and GO:0016569 is obsolete; the valid remainder were
    already bound. Nothing from the cohesin report's population-genetics argument
    was used, because it inverts its cited source - Beck (PMID:22749036) found
    African NR0B1 microsatellites to be larger, not smaller. The cBioPortal
    222-sample analysis was not used: no query, export, or output is committed,
    and its mutual-exclusivity test uses CDKN2A point mutations where the
    published claim concerns deletions. Cross-cancer STAG2-PRC2 validation
    (bladder, Down-syndrome leukemia) was left out of this disease entry. The
    GGAA synthetic-enhancer therapeutic payload platform (PMID:36229873) and PKC
    beta II diagnostic immunohistochemistry (PMID:40230184) were verified but not
    integrated - the first is preclinical vector engineering rather than a
    treatment, the second is diagnostic staining whose reported specificity omits
    the off-target positives in the same abstract. The ACCELERATE ATR-inhibitor
    paper (PMID:41538758) was not promoted to a treatment: it names three
    diseases, not Ewing sarcoma alone, and a development-pathway position paper
    is not regulatory endorsement.

    Verification: count-verified-snippets 157/157; check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-enum-values,
    check-qualifier-terms, check-snippet-grading all pass;
    validate-hypothesis-assessment passes on all four new sidecars.

  summary: Re-apply outstanding OpenScientist findings
  details: |
    Re-applied the part of the earlier OpenScientist assessment sweep (PR #12010 lane) that never merged, rebased onto main's restructured entry. Applied: PMID:32049009 twice on 'EWS-FLI1 Dosage and State Plasticity' (primary-tumor single-cell support for an intermediate fusion-activity window with proliferation/OXPHOS inside it and hypoxia above and below), with a matching description sentence marking it an association rather than a dose demonstration; PMID:29867216 twice and PMID:32467316 once on 'STAG2-Modified Enhancer State' (cohesin-SA1/SA2 paralog non-compensation at CTCF-free enhancers, and STAG1 as the selective dependency of STAG2-deficient cells), with description text flagging both as non-Ewing systems; PMID:25186949 on the STAG2 genetic entry, giving the rearrangement and nongenetic inactivation routes that reconcile the 17 percent sequencing frequency with the 29/108 protein-loss rate main already records side by side; two new KNOWLEDGE_GAP discussions carrying PMID:30700749 (USP19-dependent fusion turnover as the testable route for the unexplained STAG2-associated protein-abundance rise, with PMID:41950086 for the observation itself) and PMID:22959474 (SEER adult-onset extraskeletal cohort against the developmental-window model, including the authors' own PNET-nomenclature caveat). All snippets re-derived from the on-disk cache; three cache records were fetched because they were absent. Skipped: the sweep's third discussion on intratumoral regulatory-module heterogeneity, because main now curates that point on 'Hybrid Mesenchymal Tumor States and Matrix Deposition' via PMID:40667384 and its description already rejects a binary fusion-high/fusion-low reading, so the gap's premise no longer holds. Prose corrections: the homologous-recombination-deficiency qualification on the replication-stress node and on PARP Inhibitor Combination Therapy were already made on main, more thoroughly than the sweep did, including the PMID:26505995 REFUTE item and a module-conformance withdrawal note; the STAG2 mutation-versus-protein-loss separation was also already there and only needed the mechanistic clause. Copied the four openscientist-assessment-by-claude-opus-5 sidecars verbatim; main carried only the by-codex assessments, so these are additions under a distinct assessor filename.

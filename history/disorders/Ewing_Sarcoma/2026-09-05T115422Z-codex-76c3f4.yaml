  summary: Resolve review findings on module scope, trial identity and treatment annotation
  details: |
    Address the required findings and bounded ontology/registry suggestions from PR11041 review PRR_kwDOQio5188AAAABMT1UVA.

    The former Replication Stress and Impaired Homologous Recombination node had conformed to dna_repair_synthetic_lethality#PARP and Platinum Synthetic Lethality. Its withdrawal during the earlier split is now explicitly documented on Context-Dependent BRCA1 Repair Impairment and here: the module presupposes HRR-deficient tumor cells with the combined PARP/platinum vulnerability. PMID29513652 supports context-dependent BRCA1 impairment, whereas PMID26505995 demonstrates PARP trapping sensitivity without an apparent HR defect. These studies and the limited clinical PARP-combination results do not establish that broader therapeutic phenotype throughout Ewing sarcoma. The conformance is not restored; the positive and contrary evidence are both retained.

    Correct COG AEWS1221 to registry key NCT02306161 while retaining the protocol name. Direct WHO ICTRP verification also uncovered a publication/registry discrepancy: PMID36522207 and PMID41832299 print ISRCTN54540667, which belongs to the PIL-FAST lisinopril/stroke trial. The verified EE2012 record is ISRCTN92192408 and carries secondary ID EudraCT2012-002107-17. Change the curated EE2012 key accordingly and record both the correct registry and the negative identity check with scoped evidence. Preserve the published wrong number verbatim in an evidence quote documenting the discrepancy; no published quote or provider report is silently rewritten. All four curator-authored OpenScientist assessment sidecars were searched for both ISRCTN numbers and AEWS1221/NCT02306161; none occur, so those files and raw report_quote fields remain unchanged.

    Fetch compact ClinicalTrials.gov API records through the sanctioned reference fetcher and add registry statuses checked2026-09-05: NCT00006734 and NCT02116777 COMPLETED; NCT02306161 and NCT02243605 ACTIVE_NOT_RECRUITING; EE2012 COMPLETED from WHO ICTRP. Published results do not imply completed follow-up. Full administrative JSON field excerpts retain the trial identifier, title, status, completion date and last update; they are OTHER evidence for registration status, separate from efficacy findings. The unrelated stroke record is used only to refute the printed identifier and is explicitly not a treatment or mechanistic source for Ewing sarcoma.

    Bind cabozantinib and ifosfamide to specific CHEBI terms and bind talazoparib/temozolomide separately from olaparib/irinotecan within the PARP-combination overview. Agent descriptions preserve the two distinct clinical regimens. The dual PARP-HDAC entry actually describes the single preclinical compound kt-3283; NCIT and CHEBI searches found no compound-specific term, so use the broader PARP-inhibitor class with an explicit scope note, retaining HDAC activity in the description. Assign SMALL_MOLECULE individually to the eight chemical treatment entries; surgery and radiotherapy retain their modalities.

    Add POLQ and alternative-splicing annotations, glycerophospholipid biosynthesis, IL-6 signaling/mesenchymal stem cells, and extracellular-matrix organization to four existing mechanism nodes. Add a direct source sentence linking the hybrid malignant-cell state to ECM deposition. The bone-destruction node already has a bone-tissue annotation; do not infer an osteoclast-mediated resorption process from radiographic destruction. HPO searches for metastasis/metastatic found only other specific tumor or imaging terms; retain the broad Neoplasm anchor with an explicit non-equivalence note. Use the actual diagnosis_term schema slot: the integrated biopsy/immunohistochemistry/molecular workflow takes Diagnostic Procedure, while staging takes its Diagnostic Imaging Testing component. Clinical Staging NCIT:C200641 was considered but is outside the permitted TreatmentActionTerm branch.

    The 30 mechanism nodes and all existing causal and treatment-target edges are unchanged. This is one correction round on the existing review PR; no new disease, hypothesis claim, therapeutic efficacy assertion or causal edge is added.

    Validation: disease schema and strict ontology terms passed. All 202 evidence excerpts
    match their cached source bodies with zero title mismatches; the standard checker
    verifies 200 and skips two ICTRP-prefix items, both independently checked. The
    graph remains 30 mechanisms, 60 total nodes and 64 edges, with unchanged causal
    and treatment-target edges. History, entity/causal references, source-defect claims,
    evidence boundaries and snippet length/title/grading checks passed.

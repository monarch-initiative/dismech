  summary: Add neuroblastoma as a differential diagnosis
  details: |
    Creates the differential_diagnoses section, directly after diagnosis:, with a Neuroblastoma row. The GEIS guideline already cited in this entry (PMID:39158802) lists metastatic neuroblastoma among Ewing sarcoma's differentials. Three distinguishing features: PHOX2B immunohistochemistry (PMID:25822764, PMID:28640941); CD99 immunonegativity and NKX2.2 as described in the framing of a neuroblastoma case report (PMID:36999306), stated as a pitfall rather than a frequency; and the GEIS guideline's statement that membranous CD99 and nuclear NKX2.2 are neither entirely specific for Ewing sarcoma, so genetic confirmation is required (PMID:39158802). Part of the neuroblastoma expansion series (issue 15822); the same PR gives five other paediatric tumour entries a matching Neuroblastoma row. The row binds MONDO:0005072, copied from kb/disorders/Neuroblastoma.yaml, so the rendered page links to that entry. Every distinguishing feature is a finding from a quoted sentence. No other part of the entry changes. Validation on the branch rebased onto main: the run_c4 gate set over all six entries (validate-disorders, count-verified-snippets --strict, check-snippet-grading and the whole-repo gates), check-reference-titles-present, check-cache-order, check-logical-rules and check-qualifier-terms all passed.

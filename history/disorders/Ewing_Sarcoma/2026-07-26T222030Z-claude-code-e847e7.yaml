  summary: Content-correctness fixes from pediatric cancer review
  details: |
    Replaced the claim that EWS-FLI1 is pathognomonic with the FET-ETS framing: EWSR1 rearrangement also occurs in desmoplastic small round cell tumor, clear cell sarcoma, and myxoid liposarcoma, so diagnosis requires identifying the ETS partner. Added the previously unmodeled non-FLI1 fusions (EWSR1-ERG at ~10%, with rare FEV/ETV1/ETV4) and recorded that WHO 2020 moved CIC-rearranged and BCOR-rearranged sarcomas out of the Ewing family as separate entities. Dropped Metastatic Disease from FREQUENT to OCCASIONAL and added a frequency-specific evidence item (PMID:34235109, 28.8% metastatic at presentation); the band had rested on three snippets reporting survival in metastatic disease rather than metastasis frequency, and those items' explanations were rewritten to scope them to the prognostic claim. Re-quoted one clipped snippet at a sentence boundary. Source: docs/reports/pediatric-cancer-claim-evidence-review-2026-07-25.md. Validated with linkml-validate, linkml-term-validator (--labels), and linkml-reference-validator; all pass. New PMIDs were cached via the reference validator, never hand-written.

  summary: 'Edit: Ewing Sarcoma, four return differential rows (CIC-rearranged, BCOR,
    EWSR1-non-ETS sarcomas and melanotic neuroectodermal tumour of infancy)'
  details: |
    Four entries name Ewing sarcoma as a differential diagnosis and were not named back; the entry's only differential row was neuroblastoma. Four rows are added and nothing existing is changed.

    CIC-rearranged sarcoma (MONDO:0956989), sarcoma with BCOR genetic alterations (MONDO:0958159) and round cell sarcoma with EWSR1-non-ETS fusion (MONDO:0958160): each opens with the GEIS clinical practice guideline (PMID:39158802, already cited by the entry), whose pathology section names these three tumours in the differential of small round-cell morphology; that sentence was previously only paraphrased in an explanation and is now quoted, with the grading the entry already gives the guideline (REVIEW_SYNTHESIS, OTHER). The distinguishing evidence comes from papers the sibling entries cite: PMID:26685084 and PMID:27562494 (CIC), PMID:29300189 (BCOR-CCNB3), PMID:31972596, PMID:30895378 and PMID:31049020 (EWSR1-NFATC2 and FUS-NFATC2). In the BCOR row survival (72% against 79%, P=0.738) and round-to-spindle morphology are in the description and not among the distinguishing features, because the source reports no difference for the first and no comparison for the second. A note on the EWSR1-non-ETS row says its evidence concerns the NFATC2 fusions only.

    Melanotic neuroectodermal tumour of infancy (MONDO:0002072): four items mirrored from that entry's own row on Ewing sarcoma (PMID:34094962, PMID:40278957 twice, PMID:34359769). The row says that the two-cell immunoprofile is the authors' suggestion from a series that stained no Ewing sarcoma, and that CD99 has been reported in several of these tumours.

    No new reference is cached. Quotes shared with the sibling entries keep the same grading. Chromosome-level copy number detail from the methylation study is not carried into the rows.

    Validation: just validate, validate-terms and validate-disorders pass; 243 of 243 snippets verify against the cached references; the whole-repo gates and the kb test lane were run locally and pass.

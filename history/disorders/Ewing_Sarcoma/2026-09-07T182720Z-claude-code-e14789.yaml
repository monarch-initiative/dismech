  summary: Bind both candidate cells of origin to the EWS-FLI1 lesion node
  details: |
    Merging main into this branch surfaced a regression the cell-of-origin derivation is designed to catch. Main had rewritten this entry and added a dedicated 'Permissive Progenitor Cell State' node carrying both candidate lineages (early mesenchymal stem cell CL:0000134 and migratory neural crest cell CL:0000333, mechanism_confidence PROVISIONAL). The branch's own marking sits on 'EWS-FLI1 Fusion Oncogene' -- genetic_context.variant_origin: SOMATIC -- and that node bound no cell, so check-cancer-origin reported ORIGIN_WITHOUT_CELL and the repo-wide count for that class went from 0 to 1.

    Bound both candidate cells onto the lesion node and added a notes: line explaining why the pair is deliberate. This makes no new biological claim: both CL terms, both preferred_term wordings, and the unresolved-origin position are already asserted by this entry, on the node whose description says the human cell of origin remains unresolved. The fusion is genuinely the transforming lesion, so removing the SOMATIC marker would have been the wrong repair; binding a single cell would have asserted a resolution the entry explicitly declines to make.

    The entry now derives two cells of origin and is reported as MULTI_ORIGIN_CELL, which is the class intended for a genuinely unsettled origin -- the same shape as Melanoma_in_Congenital_Melanocytic_Nevus. That class is advisory and never gates. ORIGIN_WITHOUT_CELL returns to 0, so it remains a candidate for a hard gate.

    Validated with linkml-validate (Disease), linkml-term-validator --labels, check_duplicate_yaml_keys, check_enum_values, check_entity_refs, check_causal_targets, and 35/35 tests in test_cancer_origin, test_backfill_cancer_origin and test_ontology_edge_relations.

  summary: 'Create: Cataract_33'
  details: |
    Created the BFSP1 (filensin) cataract 33 entry from MONDO:0012665 and the stub. Evidence comes from PubMed searches plus a falcon (Edison) deep-research report (research/Cataract_33-deep-research-falcon.md; 7/7 references resolved, its needs_review flag came only from the template text 'if available' attached to the MONDO ID). just preflight-dr could not run because the local MONDO build is absent; the report was checked by reading it and is about BFSP1 throughout. Both recessive families (exon 6 and exons 3-5 deletions, plus one compound heterozygote with microcornea) and dominant families (D348N, G602R, c.625+3A>G, c.1124del) are covered as two inheritance blocks rather than subtypes, since no source shows the modes differ in mechanism. The pathophysiology chain (loss of BFSP1, beaded filament assembly failure, loss of fiber cell order, light scattering) rests on filensin knockout mouse papers. The falcon report says the original recessive family had cortical opacities and normal corneal diameter; the cached PMID:17225135 record is abstract-only, so those points were not curated. Two 20p-linked families without BFSP1 mutations are cited as REFUTE / notes so they are not mistaken for this disease. Validation: just validate, validate-terms, count-verified-snippets (36/36), check-entity-refs, check-causal-targets, check-genereviews (no chapter), validate-disorders.

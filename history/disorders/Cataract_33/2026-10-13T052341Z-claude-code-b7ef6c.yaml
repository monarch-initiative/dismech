  details: |
    Addressed the ai4c-reviewer review on PR 13984. Added reference_title to all 37 evidence items, copied by script from the title frontmatter of each references_cache file. Removed the PMID:17167408 REFUTE item from the BFSP1 gene record, because the paper concerns a 20p-linked family whose cataract is not BFSP1-caused and does not argue against BFSP1 causing cataract 33; the caveat remains in notes, and the cache file was dropped from the PR. Trimmed 'from birth' from the PMID:31842807 explanation, since the quoted sentence states only a total cataract. Did not add PMID:17225135 to the Juvenile cataract phenotype: its abstract calls the cataract developmental, and juvenile onset appears only in the title, which is not usable as a finding; the phenotype description now says this. Added a diagnosis row for targeted cataract gene panel sequencing (NCIT:C15709 Genetic Testing) with quotes from PMID:28450710 and PMID:31842807.

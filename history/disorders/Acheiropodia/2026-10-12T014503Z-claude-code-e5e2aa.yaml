  summary: 'Review round 1: Acheiropodia'
  details: |
    Changes made in response to review on PR 13903. Ran just backfill-reference-titles, which added reference_title to all 34 existing evidence items. On the edge from loss of ZRS-SHH promoter contact to loss of limb-bud SHH expression, added three items from Ushiki et al. 2021 (PMID:33863876): the proband lymphoblastoid SHH mRNA measurement (IN_VITRO, INDIRECT, with the caveat that these are EBV-transformed non-limb cells); the earlier mouse CTCF-site deletions that reduced limb Shh by 52% with no limb phenotype (REFUTE, INDIRECT, quote_role BACKGROUND); and the mouse inversion that abolished ZPA Shh and truncated the limb (SUPPORT, INDIRECT, quote_role BACKGROUND). Reworded the edge and variant descriptions so that the unmeasured quantity is specifically limb-bud SHH expression. Rebound the distal tibial truncation from HP:0005736 Short tibia to HP:0005772 Aplasia/Hypoplasia of the tibia, with a note listing the HPO search (l~tibia) and why the alternatives were rejected. Set frequency VERY_FREQUENT on the six defining phenotypes and OCCASIONAL on the Bohomoletz bone, which PMID:2363435 calls uncommon. Added a diagnosis section with radiography (NCIT:C38101) and genetic testing (NCIT:C15709), each with a quoted source. Validation: validate, validate-terms, count-verified-snippets (40/40) and the offline gates pass; validate-disorders run before push.

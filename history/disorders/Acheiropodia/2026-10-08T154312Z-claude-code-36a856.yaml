  summary: 'Create: Acheiropodia'
  details: |
    New entry for acheiropodia (MONDO:0008700), curated from the stub queue. Lump/split: kept as a standalone Disease rather than a subtype of ZRS-Related Limb Malformation, which explicitly leaves acheiropodia out of scope because it is a homozygous loss-of-contact limb-reduction disorder rather than a heterozygous ZRS gain-of-ectopic-expression polydactyly. The entry was first curated directly from PubMed (all 32 records for acheiropody/acheiropodia were screened by title), then reconciled against a falcon deep-research report (research/Acheiropodia-deep-research-falcon.md; 7/7 references resolved, the one term-validation flag is a parsing artifact that labels MONDO:0008700 'if available'). The report agreed with the curated phenotype pattern and causal chain; it added one source used here, Bower et al. 2025 (PMID:40604280, mouse ZRS homeodomain-motif knock-in loses long-range activity and causes limb reduction), cited as indirect support for the contact-loss to SHH-loss edge. Its other leads were not used: the cohesin study (Kane et al. 2022) had no cached abstract, the ETV2 study concerns Shh initiation in general, and its supportive-care section had no acheiropodia-specific source. just preflight-dr could not be run because it requires the local MONDO build (about 1.3 GB), which is absent and was not downloaded because disk space is limited; the report was checked by hand to be about acheiropodia/LMBR1/SHH throughout. LMBR1 lands on the deletion node, whose lesion is deleted DNA (CTCF scaffold sites) rather than loss of an LMBR1 protein activity, so no molecular function is true of that node; it was grandfathered in tests/gene_activity_grounding_baseline.txt, and the SHH node carries GO:0005113 patched binding. Key sources: Ianakiev et al. 2001 (PMID:11090342, common LMBR1 exon 4 deletion in five Brazilian families, phenotype pattern, inheritance, birth incidence), Ushiki et al. 2021 (PMID:33863876, 12 kb fine-mapping, loss of CTCF-mediated ZRS-SHH promoter contact in patient cells, negative orthologous mouse knockout), Sagai et al. 2005 (PMID:15677727, mouse ZRS deletion abolishes limb Shh and truncates distal limbs), Escamilla et al. 2000 (PMID:10780921, 7q36 linkage), Shamseldin et al. 2016 (PMID:26749485, 102 kb homozygous deletion), Fett-Conte and Richieri-Costa 1990 (PMID:2363435, Bohomoletz bone) and Ormazabal et al. 2015 (PMID:26294167, Argentinian twins). Three older case reports (PMID:9788736, PMID:6660253, PMID:7929505) have no abstract and were not cited. The limb-bud SHH loss node is PROVISIONAL because it has not been measured for the human allele and is supported directly only by the mouse ZRS deletion. Bohomoletz bone is left without an HPO binding after searching ols:hp. No treatment was curated because no management source with a quotable abstract was found. No GeneReviews chapter exists (just check-genereviews). Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), the offline gates, and validate-disorders.

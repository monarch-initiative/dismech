  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #8202. Item 1: reworded the iron-supplementation caveat to contraindicated as monotherapy, noting the Aslan combined plasma-plus-iron exception (PMID:28895280). Item 2: removed the Elevated Transferrin Saturation phenotype whose snippet came from a heterozygous-carrier study (PMID:25486930) and whose direction is case-variable; instead modeled the reliable congenital triad by adding Decreased Serum Iron and Decreased Total Iron-Binding Capacity (PMID:19579082). Item 3: removed the conflated carrier-study PMID:25486930 evidence from the genetic block and deleted its now-uncited cache file. Item 4: added iron-overload organ complications hepatic fibrosis, cirrhosis, diabetes mellitus, hypothyroidism, and splenomegaly with PMID:28824244 evidence and downstream edges from the parenchymal iron overload node. Item 6: added PMID:28824244 evidence to iron chelation and added a therapeutic phlebotomy treatment. Item 7: added a diagnosis section with the biochemical suspicion pattern and TF molecular genetic testing as confirmatory (PMID:28824244). Suggestions addressed: collapsed the redundant transferrin phenotype, dropped the unsupported cardiomyopathy frequency band, added an atomic Hepcidin Suppression node (PMID:19047682, MODEL_ORGANISM) closing the feed-forward loop, and added an infantile onset descriptor. Validation: just validate passes, 32/32 snippets verified, just validate-disorders CI-equivalent sweep passes.

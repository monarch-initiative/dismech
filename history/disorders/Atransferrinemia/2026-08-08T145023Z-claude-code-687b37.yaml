  summary: 'Create: Atransferrinemia'
  details: |
    Created a greenfield entry for congenital atransferrinemia MONDO:0008846, causal gene TF hgnc:11740, OMIM 209300, autosomal recessive. Modeled the dual pathomechanism: transferrin deficiency to impaired iron delivery to erythroid precursors to microcytic hypochromic anemia, and in parallel non-transferrin-bound iron accumulation to parenchymal iron overload and hemosiderosis, connected with downstream causal edges into a single pathograph joined to phenotypes and to both treatments via target_mechanisms. Added inheritance with penetrance COMPLETE and expressivity VARIABLE, a variant summary p.Ala477Pro p.Asp77Asn p.Cys137Tyr, prevalence ULTRA_RARE CASES_IN_LITERATURE, 12 phenotypes, treatments apotransferrin/plasma replacement with iron-supplementation contraindication caveat and iron chelation, plus hpx mouse and zebrafish gavi animal models. Deep research provider claude_code, the only available provider since no external API keys are set. GeneReviews search returned no article so the GR baseline is N/A. Validation: just validate passes schema and terms, 22/22 evidence snippets verified against cached references, and just validate-disorders CI-equivalent batched sweep passes.

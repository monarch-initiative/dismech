  summary: 'Create: Congenital Merosin-deficient Muscular Dystrophy 1A'
  details: |
    De-novo curation of MDC1A (LAMA2-CMD), MONDO:0011925, from deep research plus a GeneReviews baseline and a targeted PubMed sweep.

    DEEP RESEARCH. Two providers ran and both succeeded, so no fallback was used. falcon (Edison Scientific Literature, 450 s) produced research/Congenital_Merosin-deficient_Muscular_Dystrophy_1A-deep-research-falcon.md with 15/15 references verified, confabulation_rate 0.0, and 36/38 ontology terms resolved (the 2 unverifiable are Taxon-prefixed, which has no resolver). Its needs_review flag is true for a single cosmetic reason: the report echoes the template placeholder "(if available)" as MONDO:0011925's label, which term validation reads as a label mismatch. No unresolved references and no unresolved terms, so nothing was excluded on that basis. Its ordered causal chain is the backbone of the pathophysiology section here. asta (Asta Scientific Corpus Retrieval, 8 s) produced a retrieval-only companion with 37/37 references verified but only 25/37 on topic; its retrieval drifted heavily to Duchenne and general muscular-dystrophy reviews (preflight-dr top-gene counts read DMD=21 against LAMA2=20), so it was used selectively and contributed two references (PMID:35203715, PMID:8830776).

    NEC PREFLIGHT. just preflight-dr returned SKIP for both reports because MONDO records no RO:0004003 causal gene for MONDO:0011925, so the automated gene check cannot discriminate. Manual identity check done as the skill requires: falcon's dominant gene is LAMA2 (24 mentions), and the OMIM number it carries, 156225, is the LAMA2 *gene* MIM rather than a different disease -- MONDO's 607855 is the phenotype MIM for the same entity. Identity confirmed; no cherry-picking from a wrong-disease report.

    GENEREVIEWS. PMID:22675738 "LAMA2 Muscular Dystrophy" found, fetched, cited on ten claims, and tagged GeneReviews in top-level references. Every Clinical Characteristics item in the abstract is represented in the entry: neonatal profound hypotonia, poor spontaneous movement, respiratory failure, failure to thrive, gastroesophageal reflux, aspiration and recurrent chest infection, facial weakness, TMJ contracture, macroglossia, rigid spine with elbow-predominant contractures, progressive respiratory insufficiency, scoliosis, and cardiac involvement. Facial weakness and TMJ contracture are carried inside the Feeding difficulties phenotype rather than as separate phenotypes, because the GeneReviews sentence frames them as feeding-impairment mechanisms. The Agents/Circumstances to Avoid list is curated as its own treatment entry (succinylcholine, statins), quoted verbatim.

    MECHANISM MODEL. Built as a branching causal chain rather than a list, with three arms out of one molecular lesion. The muscle arm runs LAMA2 loss to laminin-211 loss from the myofibre basal lamina to failure of the basal-lamina-to-sarcolemma receptor coupling, and there deliberately forks into a mechanical branch (contraction-induced detachment) and a signalling branch (loss of laminin-dependent survival signalling), which converge on myofibre death. That fork is the central modelling judgement in the entry: laminin-211 binds alpha-dystroglycan through LG4-LG5 and integrin alpha-7-beta-1 through LG1-LG3 and both a mechanical and a survival-signalling function are lost together, so collapsing them into one node would lose the reason the fibres die rather than merely tear. Death then feeds three consequences (abortive regeneration, inflammation, dysregulated autophagy) converging on fibrosis and atrophy and thence on an organism-level convergence node. Autophagy is a separate node rather than folded into degeneration because the evidence says the flux is pathogenic here (inhibition improves the model), which is the opposite of its reading in several other myopathies. The Schwann-cell arm and the CNS arm hang off the same molecular node.

    TWO CNS BRANCHES, DELIBERATELY SEPARATE. White-matter signal change and cortical malformation are curated as distinct branches with distinct mechanisms (perivascular versus pial basement membrane), because they have very different frequencies and clinical weight: the first is near-universal and clinically silent, the second affects about a fifth and carries the epilepsy and intellectual disability. Merging them would predict cognitive impairment in nearly every patient, which the cohorts contradict.

    LUMP/SPLIT. Complete and partial merosin deficiency are curated as has_subtypes of one entry, not as two diseases: one gene, one protein, one mechanism, graded by residual protein. Recorded in notes, along with a pointer that stubs/Muscular_Dystrophy_Limb-girdle_Autosomal_Recessive_23.yaml is still open and covers the partial-deficiency subtype curated here.

    MODULE CONFORMANCE. Three declared. fibrotic_response#Excessive ECM Deposition on the endomysial fibrosis node. pial_basement_membrane_radial_glial_endfoot_failure#Pial Basement Membrane Assembly Failure on the cortical branch, which is a genuine generic-to-specific substitution: the module's other conformers reach the pial breach through defective alpha-dystroglycan glycosylation, and this entry reaches the same failure from the ligand side of the same bond. schwann_cell_myelin_maintenance#Dysmyelination and Segmental Demyelination of Peripheral Nerve is declared on the module's outcome node and NOT on its trigger node, because that module scopes its trigger to Schwann-cell myelin gene lesions (PMP22, MPZ, GJB1, EGR2, CMT4) and a secreted ECM ligand is not one of them; the reasoning is recorded in that node's own notes so a reviewer does not have to reconstruct it.

    REFERENCES REJECTED OR NOT USED. Several asta hits were dropped as off-disease (Becker muscular dystrophy inversion PMID:22006696, DMD hub-gene WGCNA PMID:36596079, an unrelated Lancet Infect Dis corrections notice PMID:29695353, FKRP-related dystrophy PMID:37154180). Two asta entries had no PMID or DOI usable for fetching (a Russian-language review, an IJP case report) and were not chased. PMID:12467726 and PMID:11053680 (merosin-deficient CMD with cerebellar cysts) were deliberately excluded: both are explicitly UNLINKED to LAMA2 and describe a different genetic entity, so citing them here would be a named-entity error. ORPHA:258 exists for this disease but is not in references_cache and building it would require refreshing the shared Orphadata manifest, which is not safe in a checkout shared with other agents; PMID sources cover the same ground.

    DATASETS. Four GEO accessions curated after manual relevance triage of the seven DIRECT candidates from just discover-datasets: GSE253680 (dyW/dyW fetal muscle at E17.5, which is the dataset behind the prenatal-onset claim), GSE126416 (dy2J/dy2J versus mdx versus wild-type, whose Pax7 contrast supports the abortive-regeneration node), GSE307443 (human LAMA2-deficient iPSC myogenic precursors), and GSE3252 (dy/dy diaphragm microarray). GSE3252 was tagged GENE_ONLY by the discovery tool and kept anyway after triage, because its GEO title and summary both name laminin/merosin-deficient dystrophy in the dy/dy mouse -- the disease-name matcher missed it only because the record predates the LAMA2-CMD nomenclature. That reasoning is recorded in the record's notes. GSE307443 and GSE3252 carry no evidence block on purpose: their cached summaries state motivation or restate the title, and quoting either would be a topic snippet rather than a finding. Titles are copied verbatim from the fetched GEO records; the four GEO_*.md cache files are new and must be committed with the entry.

    VALIDATION, all run to completion and read:
    - just validate: schema "No issues found"; term validation passed; reference validation "All validations passed", snippets 158/158 verified.
    - just validate-disorders (the authoritative batched gate): all three phases passed, 158/158 snippets verified.
    - just count-verified-snippets: 158/158 verified against cached references, 0 skipped.
    - just verify-datasets: 4/4 OK.
    - just check-entity-refs: OK.
    - just check-causal-targets: OK, no new broken pathograph targets.
    - just check-duplicate-keys: OK.
    - just check-qualifier-terms: OK (no qualifier terms in this entry).
    - just check-enum-values: OK.
    - just check-reference-titles / check-title-snippets / check-folded-hyphens / check-snippet-grading: OK, no new findings attributable to this file.
    - just check-snippet-length: reports one new finding, in kb/disorders/Sotos_Syndrome.yaml, which is another curator's file and untouched here; zero findings in this entry.
    - just compliance: Weighted Compliance 89.3%, with term 100%, reference_title 100%, datasets 100%. The residual gap is evidence at 71.1%, almost entirely uncited causal edges. Those were left uncited deliberately rather than papered over with the adjacent node's citation, per the curation skill's instruction that an uncited edge is preferable to a fabricated one.

    TERM NOTES. hgnc:6482 verified against the HGNC REST API as LAMA2 (not taken from the prompt). One label correction during validation: HP:0003236 is "Elevated circulating creatine kinase concentration" in the repository's pinned HPO, although OLS currently serves "...activity"; the pinned label is used.

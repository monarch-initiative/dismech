  summary: Clarify MDC1A contracture evidence and larval mechanical injury experiment
  details: |
    Reviewed all live feedback on PR11651 and full Swiss, life-span and Li-Arner zebrafish sources. Tailored four Swiss joint-contracture explanations with cohort and flexion-direction scope, corrected an adjacent facial-weakness explanation, and annotated myocardial and airway tissue scales. Added BTS mechanical-silencing evidence and a washout readout, retaining structural protection versus force-development tradeoff and larval-only scope. Expanded existing supportive care with specific cardiac and bone recommendations; added variant-specific aberrant-splicing confirmation to existing molecular diagnosis without asserting the broader report-proposed RNA workflow. Preserved prior history, phenotype frequencies and causal topology.

  details: |
    Round answering the ai4c-reviewer review of 2026-09-08 (changes requested, 2 blocking + 4 suggestions). Both blocking items taken, three of four suggestions taken, one declined.

    BLOCKING 1 - evidence_source on a mouse paper. PMID:15578095 was graded HUMAN_CLINICAL on the myofibre-apoptosis node. Verified before changing: the paper is titled 'Inhibition of apoptosis improves outcome in a MODEL of congenital muscular dystrophy', its MeSH terms are Animals / Mice / Mice, Knockout / Mice, Inbred C57BL, and it is a Bax-inactivation and Bcl-2-overexpression experiment. The quoted sentence ('...in both humans and mice...') is the paper's background framing of prior work, not human data it presents, and evidence_source classifies the cited study rather than the claim. The internal inconsistency the reviewer spotted settles it: the same PMID is graded MODEL_ORGANISM three times elsewhere in this file. Regraded to MODEL_ORGANISM. The explanation was rewritten too, because as written it justified the wrong grading - it said the item establishes the finding 'in human muscle and not only in the mouse', which reads as a rationale for HUMAN_CLINICAL. It now states why the grading follows the source rather than the sentence. Note the reviewer's own observation that check-snippet-grading could not have caught this: that gate keys on the quoted sentence, and this sentence appears once.

    BLOCKING 2 - subtype_term on both has_subtypes entries. Complete deficiency now binds MONDO:0011925, Partial deficiency binds MONDO:0029136 'muscular dystrophy, limb-girdle, autosomal recessive 23'. The MONDO ID for LGMDR23 was confirmed against stubs/Muscular_Dystrophy_Limb-girdle_Autosomal_Recessive_23.yaml in this repository rather than taken from the review. This matters more than a routine binding because the entry's notes ask a future curator to check here before creating a separate LGMDR23 entry, and an unbound subtype makes that check impossible to perform mechanically.

    SUGGESTION 3 taken - mappings.mondo_mappings with MONDO:0100228 'LAMA2-related muscular dystrophy' at skos:broadMatch. The entry covers the whole allelic series while its disease_term names only the congenital severe end; this makes that scope machine-readable. broadMatch is deliberate over exactMatch: per CLAUDE.md a broadMatch does not retire the mapped concept from the curation queue, so a future curator can still build an entry organised around the series. First attempt used preferred_term and notes, which MondoMapping does not have - schema validation caught it, and the correct slots are term / mapping_predicate / mapping_source / mapping_justification.

    SUGGESTION 4 taken - five observational studies added with phase: NOT_APPLICABLE. Study type, status and enrollment were verified against the ClinicalTrials.gov v2 API rather than taken from the review or the falcon report. That check mattered: NCT06582537 is titled 'Ex Vivo Genetic Correction of LAMA2 Mutation(s) in Myogenic Stem Cells', which reads interventional, but the registry classes it OBSERVATIONAL with n=7 - the correction is applied to patient cells, not to participants, and the description now says so. NCT06132750's registry status is UNKNOWN, recorded as such rather than assumed complete.

    SUGGESTION 5 taken - two genetic facts. The Han Chinese recurrent alleles (c.7147C>T p.R2383*, exon 4 deletion, c.5156_5159del) and the Brazilian possible founder variant (c.1255del, 11/52), both quoted with the sources' own hedging, plus the copy-number-variant survival association (26.4% of survivors vs 50.0% of non-survivors, p = 0.029) - the one prognostic rather than merely descriptive genetic association in this disease, quoted with the authors' 'suggesting' intact since it is a single-cohort result.

    SUGGESTION 6 declined - review-article grading. The reviewer observed that PMID:32848593 is graded HUMAN_CLINICAL 17 times while other reviews are graded OTHER, and said either convention is defensible. Not changed. There is a principled line - a review reporting human cohort findings presents human clinical evidence, while consensus guidance without data is OTHER - and the file's usage is consistent with it, but 17 regradings on a judgement call with no repo-wide rule is churn with real risk. Better settled as a repo-wide decision than silently per-entry.

    One self-inflicted error, the second of its kind today: I wrote a plausible reference_title for PMID:37182895 from memory ('Clinical and molecular characterization of LAMA2-related muscular dystrophy in a Brazilian cohort.') instead of copying it from the cache. The real title is 'Brain MRI Abnormalities, Epilepsy and Intellectual Disability in LAMA2 Related Dystrophy - a Genotype/Phenotype Correlation.' The reference validator caught it. Same failure mode as issue #11456 is about, and now recorded twice in one session.

    Validation: schema, terms and references pass, 166/166 snippets verified (up from 158). All structural, content and cache gates clean; check-snippet-length, check-title-snippets and check-snippet-grading report findings but none is in this file - the branch trails origin/main and those gates run --against-ref origin/main.

  summary: Bind karyotype LOINC codes; record that no XYY-specific cfDNA screening
    code exists
  details: |
    LOINC tranche K batch 1. Bound LOINC:29770-5 (Karyotype [Identifier] in Blood or Tissue Nominal) to the Postnatal Karyotyping row, and LOINC:33773-3 (Karyotype [Identifier] in Amniotic fluid Nominal) to the confirmatory half of the Prenatal Screening and Cytogenetic Confirmation row, matching the cited study's amniocentesis-based confirmation. Searched LOINC for a cfDNA screening code for the 47,XYY aneuploidy itself by several routes -- 'XYY cell-free DNA', 'XXY cell-free DNA', 'XXX cell-free DNA', and the generic phrase 'fetal sex chromosome aneuploidy' -- and all return no LOINC results; LOINC's cfDNA aneuploidy family covers the autosomal trisomies (21, 18, 13) and Monosomy X, not the extra-sex-chromosome aneuploidies, so the screening half of that row stays unbound, recorded in a note on the row. Both bound codes verified by a fresh Monarch KG entity lookup and confirmed absent from origin/main before seeding. Caught and fixed a duplicate notes: key introduced while drafting the edit, merging both notes into one block before committing.

  summary: 'Create: Pendred Syndrome'
  details: |
    De novo curation of Pendred syndrome, MONDO:0010134, as biallelic SLC26A4 loss of pendrin-mediated apical anion exchange acting in two epithelia. DFNB4 is curated as a subtype rather than a separate entry, since the gene, inner-ear mechanism and allelic spectrum are shared and only the thyroid organification defect separates the labels. The inner-ear arm is modelled as developmental and window-bounded, which is what the HUMAN_MODEL_MISMATCH discussion on the human therapeutic window turns on. Twelve references. An openscientist deep-research run was commissioned and was accurate on citations - all thirteen PMIDs taken from it resolved to the titles it gave - but proposed one nonexistent CL identifier and one real UBERON identifier for the wrong concept, the latter passing every automated existence check. Validated: schema, terms, 39 of 39 reference snippets, plus the duplicate-key, entity-ref, folded-hyphen, snippet-length, title-snippet, snippet-grading and environmental-evidence gates. Two enum-membership failures and one title-derived snippet were caught by those gates and fixed.

  details: |
    Added a Pure-Tone Audiometry diagnosis row (NCIT:C38036 Audiometric Test) binding LOINC:89015-2 Pure tone threshold audiometry panel, with evidence from PMID:41066100 and PMID:20301640. No reference range: no cited source states an audiometric cut-off owned by the disease, generic WHO grades are not disease content, and the Monarch KG has no LOINC pure-tone average code (searched pure tone average, PTA, hearing level average, average hearing). Perchlorate discharge test: no LOINC code found (searched perchlorate discharge, perchlorate, iodide organification, thyroid uptake, NM Thyroid gland), so nothing bound and no discharge cut-off recorded; the searches and the two nearest codes are named in the row notes.

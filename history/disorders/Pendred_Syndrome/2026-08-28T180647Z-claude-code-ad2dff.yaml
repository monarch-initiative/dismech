  details: |
    Round-three review response. The single blocker was that the genetic notes claimed the schema's variant machinery hangs off has_subtypes, which is false - Genetic has a variants slot, Subtype does not, and 251 disorder entries already use Genetic.variants. Verified against the schema before acting. Content had been omitted on the strength of that false claim, which is the worse half of the error. The two Okinawan founder alleles are now structured Variant records: p.His723Arg with its trafficking mechanism and the corrector evidence, and IVS15+5G>A with its loss-of-expression mechanism. Curating them separately is the point, since they fall in different therapeutic classes. Also took the three non-blocking suggestions - the organification defect regraded OBLIGATE within its subtype with the definitional reason stated and the test-sensitivity point left where it belongs, target_mechanisms dropped from the surveillance treatment since monitoring does not alter a mechanism, and the three gene-transfer treatments rebound from NCIT:C15986 to NCIT:C15238 per the backfill table in CLAUDE.md. Snippets 59 to 62, all verified.

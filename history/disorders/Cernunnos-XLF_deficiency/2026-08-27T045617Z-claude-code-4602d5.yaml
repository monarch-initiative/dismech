  summary: 'Deep review: publication-completeness pass (IUIS campaign)'
  details: |
    Publication-completeness deep review against every cited reference in references_cache. Added from PMID:16439204 the patient-level repair-defect measurement (increased cellular radiosensitivity, defective V(D)J recombination, impaired DNA-end ligation), which now carries the primary weight for the Radiosensitivity phenotype; the previous sole support was PMID:24511403's statement about the NHEJ gene class rather than a measurement in patients. Added seven phenotypes present in cited sources but uncurated: Decreased naive T cell proportion and Decreased total B cell count (immune profile, PMID:37703920 / PMID:24511403 / PMID:21535335), Myelodysplasia (refractory cytopenia with monosomy 7, PMID:35812385), Pancytopenia and Polydactyly (PMID:24511403), Clinodactyly and Hyperpigmentation of the skin (PMID:35812385). Added a new progression section with two phases: long-term survival without transplantation (alive at 30 years, PMID:28741180; counts stable over 20 years, PMID:35812385) and clonal haematological evolution (monosomy 7 to del(20q) with improving counts). Added HSCT outcome evidence (both patients well at 7 and 1 years post-transplant) and the severe early post-transplant diarrhoea complication as PARTIAL, plus a note that both transplants used an unconditioned HLA-identical related donor. Added genetic evidence for allelic heterogeneity (three NHEJ1 variant classes, PMID:37703920) and for the protein-null phenotype despite in-frame transcripts (PMID:28741180). Added a lymphocyte-subset immunophenotyping diagnosis entry. Validation: schema pass, terms pass, 44/44 snippets verified individually and 188/188 in the batched three-file sweep, entity refs and duplicate keys clean.

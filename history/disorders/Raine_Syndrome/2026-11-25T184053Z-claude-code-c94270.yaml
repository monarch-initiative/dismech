  summary: 'Gene-family review: FAM20C, FGF23, DMP1'
  details: |
    FAM20C modelling re-reviewed and found correct: the trigger node binds protein serine/threonine kinase activity (GO:0004674) as decreased, the Golgi casein kinase, matching ai-gene-review. The FAM20C record now carries the ClinGen Prenatal GCEP Definitive (AR) tier, filed under MONDO:0009821 lethal osteosclerotic bone dysplasia, which is this entry's disease_term (CGGV:assertion_89ee4afa-299c-4f56-b4ad-c530031abdd3-2025-06-25T170000.000Z). The node for dysregulated FGF23 carried FGF23 with no molecular function; it now binds hormone activity (GO:0005179) as increased, since FAM20C loss raises full-length, biologically active FGF23 (PMID:24706917). The node for hypophosphorylated biomineralization proteins carries four FAM20C substrates (DMP1, MEPE, SPP1, DSPP) with no molecular function; its evidence documents the substrates' hypophosphorylation and lower bone DMP1 in Fam20C-deficient mice (PMID:28620244) but not a specific lost activity of each substrate, so no term was added there.

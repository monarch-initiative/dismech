  summary: 'Create: Raine_Syndrome'
  details: |
    Created the Raine syndrome (lethal osteosclerotic bone dysplasia, MONDO:0009821, FAM20C / hgnc:22140) disorder entry.

    Deep research: "just research-disorder falcon Raine_Syndrome" (Edison/Falcon, 434 s, 25 citations, 1 markdown artifact committed under research/Raine_Syndrome-deep-research-falcon_artifacts/). NEC preflight against MONDO:0009821 passed - FAM20C was the dominant gene mention (38 occurrences, no competing gene), and the report's OMIM 259775 and 259660 both match the MONDO xrefs. No GeneReviews chapter exists for Raine syndrome or FAM20C (PubMed esearch for both returned zero hits), so the phenotype baseline was drawn from PMID:25019372, PMID:34360805 and the non-lethal natural-history cohort PMID:32299476.

    Curated 9 pathophysiology nodes forming an explicit causal chain: loss of FAM20C Golgi casein kinase activity -> hypophosphorylation of the secreted SIBLING/FGF23 phosphoproteome -> (a) dysregulated FGF23 with renal phosphate wasting, (b) abnormal bone mineralization and osteosclerosis, (c) dental hard tissue mineralization failure; plus craniofacial skeletal overgrowth with airway compromise, ectopic intracranial and soft tissue calcification, and a two-node gingival fibrosis arm declaring conforms_to fibrotic_response#Mesenchymal Cell Activation and fibrotic_response#Excessive ECM Deposition.

    Also curated: 22 phenotypes (HPO-bound, subtype-tagged where subtype-specific), lethal vs non-lethal subtypes with the hypomorphic-allele rationale, structured prevalence slots (BELOW_1_IN_1000000 point prevalence plus a CASES_IN_LITERATURE record; the deprecated percentage field was not used), 4 treatments, 2 imaging findings, 2 biochemical markers, differential diagnoses, 4 animal models, and a HUMAN_MODEL_MISMATCH discussion capturing the mouse-osteomalacia versus human-osteosclerosis discrepancy with two proposed experiments.

    Evidence: 99 evidence items across 29 PMIDs. Every snippet was independently verified as an exact whitespace-normalized substring of its references_cache abstract (0 failures). Two new references were resolved from Falcon DOI leads via the PMC ID converter and fetched with just fetch-reference: PMID:32101876 (high-phosphate diet rescue in Fam20c-deficient mice) and PMID:37240249 (in silico FAM20C brain substrates).

    Validation: just validate (schema + terms + references) passed; just validate-terms passed; compliance 97.9 percent global / 98.3 percent weighted.

  summary: 'Bejel second pass: 8 to 14 phenotypes, rebind osteoperiostitis, split
    the genital primary lesion'
  details: |
    Second pass on Bejel, targeting phenotypes - 8 was the softest number of the four treponematoses after the structural pass.

    Fixed a binding-evidence mismatch. Primary Mucosal Lesions was bound to HP:0011830 (Abnormal oral mucosa morphology) but its only evidence was 'Genital lesions were common as the primary lesion' from an adult TEN case series. The binding said oral and the evidence said genital. The phenotype now carries the Mitja quote locating the primary lesion in the oral and oropharyngeal mucosa, which is what the binding claims, and the genital finding is curated as its own phenotype - it is a departure from endemic childhood bejel, not the same finding at a second site.

    Rebound Osteoperiosteal Bone Disease from HP:0000924 (Abnormality of the skeletal system) to HP:0040165 (Periostitis). The old term is a top-level branch node naming no lesion. The entry now also carries the Mitja sentence naming osteoperiostitis in bejel specifically, where previously the only evidence was a generic quote about endemic treponematoses destroying tissue and bone. The unsourced parts of the old description (painful swelling, tibial involvement) were removed rather than left standing.

    Six phenotypes added, all from sources already cached: Oral ulcer (HP:0000155), Cheilitis (HP:0100825), Angular cheilitis (HP:0030318) for papules at the oral commissures, Hoarse voice (HP:0001609) for laryngeal extension, Periosteal thickening of long tubular bones (HP:0006465) for the diffuse cortical thickening, and Genital Lesions in Adult Infection.

    Two binding judgements worth recording. The genital phenotype is bound to HP:0000078 (Abnormality of the genital system) rather than HP:0003249 (Genital ulcers), because the source says lesions and not ulcers; the coarse term is the honest one and preferred_term carries the specificity. The angular cheilitis evidence is a differential-diagnosis sentence attributing the finding to both bejel and syphilis, and the explanation says so rather than presenting it as a bejel-specific observation.

    Two more pathograph edges from the disseminated node to Oral ulcer and Hoarse voice. The hoarseness edge is the one bejel finding that follows from contiguous local extension rather than dissemination, and the node description now says that.

    All 71 snippets verified as exact substrings of their cached references. Verified separately with the audit tool's --unskip-prefix DOI flag, which reports 106/106 for Pinta and Bejel together where the default run reports most of them skipped.

  summary: Add the missing structural sections to Bejel; granuloma node and ocular-causality
    gap
  details: |
    Bejel had 66 evidence items and five pathophysiology nodes but carried none of the structural sections its siblings have: no transmission, stages, epidemiology, diagnosis, differential_diagnoses or histopathology. The sourcing base was already there; the shape was not. After the Pinta pass it was the thinnest of the four treponematoses on section coverage.

    Added transmission, epidemiology, three stages, two diagnosis entries, two differential diagnoses, two histopathology findings, one discussion and a notes block, all cited from the Mitja endemic-treponematoses review (DOI:10.1371/journal.pntd.0002283) already fetched in full text during the Pinta pass, plus the sources the entry already cited.

    The transmission section is the point of the entry. Bejel spreads mouth-to-mouth and by shared utensils rather than skin-to-skin, and the source states why that matters: the treponeme shelters in the moist oral cavity, which is what lets bejel occupy arid regions where yaws and pinta transmission would fail. That reasoning now sits in the transmission description and the entry description rather than being absent.

    One new pathophysiology node, Early Granuloma Formation, conforming to granuloma_formation#Epithelioid Transformation and Multinucleated Giant Cell Formation. The source reports epithelioid and multinucleated giant cell granulomas in early bejel as the one histological feature separating it from yaws, and that is the module's own target node. Syphilis already conforms to the same node, so this is a second treponemal conformer rather than a new pattern. The node's explanation records that the source hedges with 'may be present', so the node claims a feature that occurs rather than one that defines every case.

    Pathograph wiring. The existing nodes connected to each other but to no phenotypes, so the graph had four mechanism nodes and eight orphan phenotypes. Added downstream edges from the disseminated node to Secondary Mucocutaneous Eruption and Osteoperiosteal Bone Disease, and from the tertiary node to Tertiary Nasopalatal Destruction, each with its own evidence.

    One discussion recorded rather than resolved. The entry curates uveitis, optic atrophy and chorioretinal scarring from a clinical examination series, while the Mitja review states that the ophthalmologic abnormalities attributed to yaws and bejel have been reported without firm evidence of a causal relationship. These are not contradictory - one reports an association in examined patients, the other declines to call it causal - but the entry should not read as asserting more than the first source supports, so no pathophysiology node links the ocular phenotypes to a mechanism and the tension is filed as a KNOWLEDGE_GAP attached to all three.

    Two references entries had the paper title as their own supporting_text, the same defect fixed in Pinta. The Elsevier book chapter has no retrievable cache and was dropped; the JIAC case series was rekeyed to PMID:34836779, which the entry already cites properly, and given a real finding quoting the A2058G macrolide-resistance sentence. Four further references entries cited DOIs with no cache at all - all pre-existing - and were fetched, so every snippet in the file now resolves.

    All 61 snippets verified as exact substrings of their cached references under whitespace and dash normalisation. Done manually because linkml-reference-validator skips the DOI: prefix. Snippets were checked for bracketed citation markers and PDF hyphenated line breaks; two candidate quotes were rejected for hyphen splits ('progress-ing', 'ophthal-mologic') and one for being interrupted mid-sentence by a figure caption, and shorter spans used instead.

    No prevalence block. The literature reviewed gives bejel's geography and a 3,507-case Iraqi series but no population rate, so epidemiology is curated without prevalence rather than converting a case count into a rate it does not support. Recorded in notes.

    Validation: linkml-validate, just validate-terms, just validate-disorders, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading.

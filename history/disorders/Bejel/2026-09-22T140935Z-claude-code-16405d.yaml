  details: |
    PR #10353 review round, run by the PR Shepherd, addressing the two IMPORTANT items carried unchanged through two review passes. (1) Claim-evidence mismatch on the diagnosis entry Molecular subspecies discrimination. The claim is that whole-genome sequencing distinguishes Treponema pallidum subsp. endemicum from the syphilis and yaws treponemes where serology cannot, and it was supported only by the opening etiology sentence of PMID:35687593, which states what bejel is and not that sequencing discriminates anything; the explanation conceded as much. Replaced with three items that carry the two halves of the claim: PMID:25375929 for the serological limitation (serology cannot discriminate between infection with TPA, TPE, and TEN strains) and for the discrimination itself (the Bosnia A strain clustered with other yaws-causing strains, while syphilis-causing strains clustered separately), and PMID:35687593 for the non-endemic-setting half (sequencing of TEN isolates from syphilis patients in Cuba, not an endemic area for bejel). The reviewer's caution against quoting the PMID:25375929 title was followed: both quotes are body sentences. All three were confirmed present in the existing cache files before use; no reference was fetched. (2) Module conformance on Early Granuloma Formation. The node declares conforms_to granuloma_formation#Epithelioid Transformation and Multinucleated Giant Cell Formation but carried only GO:0042116 macrophage activation, which belongs to the module's preceding node. Added GO:0000768 syncytium formation by cell-cell fusion with modifier INCREASED alongside it, matching the module target and the Syphilis.yaml conformer; the node's own snippet names multinuclear giant cells. GO:0042116 is retained rather than replaced, since macrophage activation is separately true of this node. (3) Merged origin/main. Conflicts were six add/add collisions in references_cache where both branches had independently fetched the same DOI records; the differences were whitespace only (trailing spaces and final newline) and main's normalized copies were taken. No cache file was hand-edited. Validation: just validate-disorders passed clean on Bejel.yaml and Pinta.yaml with 118/118 snippets verified; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values all OK; the 7 tests in tests/test_infectious_agent_schema.py pass.

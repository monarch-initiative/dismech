  summary: Bind LOINC treponemal-antibody code to the serology diagnosis row
  details: |
    Added diagnosis_term (NCIT:C25294 Laboratory Procedure) and diagnosis[].measurements binding LOINC:22587-0 (Treponema pallidum Ab [Presence] in Serum) to the Treponemal and nontreponemal serology row. This code is already cached on main from the Syphilis entry; confirmed via git show origin/main:cache/loinc/terms.csv before reuse, so no new cache row was needed. The row names two distinct test arms -- a nontreponemal screen and a treponemal confirmatory assay -- and the code covers only the treponemal arm, matching the row's own statement that these tests are reactive in every treponematosis. A notes field records which arm is coded, since the nontreponemal screening arm has no corresponding LOINC code bound on this row.

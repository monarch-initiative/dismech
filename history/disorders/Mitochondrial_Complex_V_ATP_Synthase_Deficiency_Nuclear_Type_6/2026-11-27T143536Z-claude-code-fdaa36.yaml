  summary: 'Create: Mitochondrial Complex V (ATP Synthase) Deficiency, Nuclear Type
    6 (ATP5MK)'
  details: |
    New entry for MC5DN6 (MONDO:0032869, OMIM 618683), the recessive disorder of ATP5MK (hgnc:30889; formerly USMG5, protein DAPIT), a supernumerary ATP synthase subunit needed for dimerisation; gene-family gap fill, replacing stubs/Mitochondrial_Complex_5_ATP_Synthase_Deficiency_Nuclear_Type_6.yaml. File named with Complex_V to match its sibling entries; MONDO's label writes complex 5. Evidence: Ashkenazi founder c.87+1G>C in four Leigh syndrome patients from three families, with normal monomers, absent dimers, reduced ATP synthesis and rescue by wild-type cDNA (PMID:29917077, abstract only, PMC returned 403); cryo-ET and cryo-FIB/SEM of patient fibroblasts showing disturbed cristae (PMID:30240627, PMID:33096015); founder-cohort clinical features from the 2024 systematic review (PMID:39016153); a fourth family, four brothers with c.87+1G>A and a progressive spastic neurodegenerative course (PMID:40014158). GO records no molecular function for ATP5MK, so the lesion node binds GO:0005198 structural molecule activity for DAPIT's contribution to the dimer, with the reasoning in the node description; dimer loss is bound to GO:0051259 protein complex oligomerization. relationship_type UNKNOWN because ClinGen rates ATP5MK Moderate (AR) for Leigh syndrome and for mitochondrial disease, neither being this entry's term. An accessory spleen listed by the review is not recorded as a phenotype. No gene-specific GeneReviews chapter. Validation: linkml-validate, OLS term validation, reference validator (43 snippets, 0 issues), count-verified-snippets 43/43, check-entity-refs, check-causal-targets, check-name-collisions, check-gene-validity, check-enum-values, check-duplicate-keys, check-coarse-phenotypes, check-folded-hyphens, list-gene-term-mismatches, check-genereviews and check-snippet-grading all passed.

  details: |
    Genetics-gap issue 12275. Added two gene-defined subtype rows from MONDO's fourteen children of MONDO:0018307: CoPAN bound to MONDO:0014290 with COASY (hgnc:29932), and NBIA9 bound to MONDO:0958012 with FTH1 (hgnc:3976). Both got matching genetic records and both genes were added to the Genetic pathway heterogeneity node, taking gene wiring from 4/4 to 6/6 as measured by gene_mechanism_wiring_coverage. Two references were fetched: PMID:24360804, the founding COASY-NBIA exome report, and PMID:37660254, the five-patient de novo FTH1 series. The allele-severity split between CoPAN and the perinatally lethal PCH12 phenotype is cited to the already-cached PMID:39301217 with quote_role BACKGROUND, matching the grading that sentence already carries at Pontocerebellar_Hypoplasia. No phenotype was previously connected. Eleven causal edges were added, eight clinical features from Progressive motor and cognitive decline and three developmental or structural features from Oxidative stress and neuronal injury, taking phenotype inlink from 0/12 to 11/12. Diabetes mellitus is deliberately left unconnected with a notes field explaining that its cited sentence places it before neurological onset and its lesion is pancreatic rather than cerebral, so no node here describes it. validate-disorders over the 13 changed files reported 898/898 snippets verified and 0 issues.

  summary: Enhance Intracranial_Berry_Aneurysm with classifications, inheritance, progression, prevalence,
    gene-linked and post-rupture vasospasm pathophysiology nodes, 100% downstream phenotype connectivity,
    tobacco smoking risk factor, oral nimodipine pharmacotherapy, diagnosis, differential diagnoses, and
    top-level references.
  details: Added Harrison's chapter classifications (NEUROLOGIC, CARDIOVASCULAR), autosomal dominant and
    non-Mendelian inheritance entries, adult onset progression across two cohorts, 3.2% general-population
    point prevalence, NPNT-linked upstream pathophysiology node alongside THSD1 (with CBY2 curated in
    genetic as a candidate susceptibility locus), post-rupture delayed vasospasm and ischemia mechanism
    node, downstream causal edges reaching all 9 phenotypes (rebound Nuchal rigidity to HP:0031179 Nuchal
    rigidity and Oculomotor nerve palsy to HP:0012246 Oculomotor nerve palsy), tobacco smoking environmental
    risk factor, oral nimodipine pharmacotherapy and refined flow diversion treatment term (NCIT:C157840
    Endovascular Stenting), four diagnostic modalities (non-contrast head CT, CTA/perfusion CT, MRA, transcranial
    Doppler ultrasonography), four syndromic/structural differential diagnoses (ADPKD, vascular Ehlers-Danlos
    syndrome, fibromuscular dysplasia, intracranial arteriovenous malformation), and top-level references.

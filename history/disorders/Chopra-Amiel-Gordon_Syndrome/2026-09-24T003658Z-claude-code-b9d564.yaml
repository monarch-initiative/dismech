  summary: 'Create: Chopra-Amiel-Gordon_Syndrome'
  details: |
    New Disease entry for Chopra-Amiel-Gordon syndrome (ANKRD17-related neurodevelopmental syndrome, MONDO:0859186, OMIM 619504), curated from the founding cohort of 34 individuals (PMID:33909992, PMC full text), the GeneReviews chapter (PMID:36548456), ClinGen gene-disease validity (Definitive) and dosage sensitivity (haploinsufficiency score 3), Orphanet ORPHA:717823, and five later case reports.

    Lump/split: one Disease entry, no subtypes. Truncating, essential-splice, missense and whole-gene-deletion alleles are presented in the literature as one disorder converging on haploinsufficiency, and no reproducible genotype-phenotype split has been published. Small 4q13.3 deletions removing ANKRD17 are included; larger contiguous deletions removing neighbouring genes are discussed in notes rather than split out. ClinGen curated the gene against the umbrella term MONDO:0800439, recorded as skos:broadMatch rather than an equivalence.

    Pathograph: haploinsufficiency and missense destabilization as trigger nodes, converging on reduced ANKRD17 in neural progenitors and neurons, then three explicitly hypothetical intermediates (Hippo/YAP nuclear import, synaptic and mitochondrial deficit, innate immune pattern-recognition signaling) each carried by its own mechanistic_hypotheses group, and outcome nodes for neurodevelopmental dysfunction and abnormal brain development. Every mechanistic step beyond the genetics is marked HYPOTHETICAL or PROVISIONAL because no functional assay in human neural tissue exists.

    Two HUMAN_MODEL_MISMATCH discussions: the homozygous Ankrd17-null mouse vascular phenotype against the absence of vascular features in the cohort, and the Hippo/YAP pathway, whose functional evidence is entirely Drosophila and immortalized cell lines while the only human data are expression.

    Audit against the source found two Table 2 rows the first draft omitted, both added: abnormality of bone mineralization (n=2, HP:0004348, bound direction-neutral because the source does not state a direction) and cutaneous prominence of blood vessels (n=2, HP:0007394). The latter is recorded as a skin finding explicitly distinguished from the arterial disease the same paper reports as absent, so it does not contradict the REFUTE evidence on the intracranial aneurysm phenotype.

    Clubfoot was re-examined after the claim issue's automated second opinion raised PMID:36326072. The paper does name ANKRD17 as one of four genes with a de novo pathogenic or likely pathogenic variant among 38 fetuses, contrary to an earlier note in this branch's history. It is still not curated as a phenotype: the series is ascertained on clubfoot and so establishes neither frequency nor direction, reports no variant or follow-up, and clubfoot is absent from the founding cohort and GeneReviews. The reasoning is recorded in the entry notes.

    Validation: just validate (128/128 snippets verified), validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-environmental-evidence, check-reference-titles, check-genereviews (chapter tagged), list-gene-term-mismatches (0 findings), pytest tests/test_data.py -k Chopra, and validate-disorders.

    Deep research: falcon was requested and returned HTTP 402 (out of credits); the claude_code fallback produced the committed report, which passed just preflight-dr against MONDO:0859186 with ANKRD17 mentioned 50 times and matching OMIM 619504. The report was used as a lead only; every claim in the entry is sourced to a primary reference with an exact verified snippet.

  summary: 'Review round 1: add myopia-control treatments'
  details: |
    Answered review 5625506726 on PR 15268. Added a treatments section with three general myopia-control treatments, each linked through target_mechanisms (INHIBITS) to Increased Axial Length of the Globe and each stating that nothing is SLC39A5-specific: low-dose atropine eye drops (Pharmacotherapy NCIT:C15986, therapeutic_agent atropine CHEBI:16684, looked up in OLS; LAMP trial PMID:30514630, high-myopia review PMID:39082137, combination trial PMID:42770659, framing from PMID:42309346), defocus spectacle lenses (DIMS trial PMID:31142465) and orthokeratology (ROMIO trial PMID:22969068). NCIT has no clinical-action term for lens wear, so those two leave treatment_term unbound and record the lens as a Medical Device qualifier (NCIT:C87148 Glasses, NCIT:C209301 Rigid Gas Permeable Contact Lens), checked with check-qualifier-terms-online. Retinal surveillance was not added because no fetched source states a surveillance recommendation for myopic maculopathy or retinal detachment; PMID:39082137 says only close monitoring of progressing myopes. Also: p.M304T domain wording now records that PMID:24891338 gives both the third and fourth transmembrane domain; gene notes and a p.Y47* evidence item record the unphenotyped 1000 Genomes carrier HG00701, so penetrance is unmeasured; the PMID:34302427 background quote is regraded OTHER. Validation re-run after the edit.

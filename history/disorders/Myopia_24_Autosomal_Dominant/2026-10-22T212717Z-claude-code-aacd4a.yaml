  summary: 'Create: Myopia_24_Autosomal_Dominant'
  details: |
    New entry for MYP24 (MONDO:0014411), autosomal dominant nonsyndromic high myopia caused by heterozygous SLC39A5 (ZIP5) loss of function. Decision: DISEASE (one gene, one conserved pathograph; MONDO records no descendants). Curated from PubMed primary reports (founding linkage and exome study PMID:24891338, the HEK293 knockout mechanism study PMID:34302427, Chinese cohort replications) plus one OpenScientist deep-research report, used as leads. Report: 18/18 references resolved; one quote attributed to PMID:24891338 did not match and was not reused; preflight-dr WARN because the report cites OMIM 615420 while MONDO xrefs OMIM 615946 (615946 is recorded); the report also offered HP:0012801 and HP:0007917 with wrong labels, neither used. The report ran without a causal-gene anchor because the stub names SLC39A5 only in source_tags (dismech#15216). Pathograph: SLC39A5 loss of function, reduced intracellular zinc, impaired TGF-beta Smad signalling, reduced matrix synthesis (all IN_VITRO), then an EMERGING scleral matrix weakening step to axial elongation, high myopia and fundus changes. The opposite Smad direction in the founding study is recorded as a CONTROVERSY discussion; the lack of an ocular animal model as a KNOWLEDGE_GAP. Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), check-entity-refs, check-causal-targets, check-duplicate-keys and the offline snippet and gene-grounding gates pass; validate-disorders run before commit.

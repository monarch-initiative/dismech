  summary: 'Create: TPM4-related Platelet Disorder'
  details: |
    New entry for MONDO:0100487 (TPM4-related platelet disorder, OMIM BDPLT25 620486). Sources: the discovery paper (PMID:28134622, two BRIDGE-BPD pedigrees plus Tpm4 Plt53 and knockout mice), the Spanish p.Gln108* pedigree (PMID:35170221), the missense p.Arg182Cys/p.Ala183Val report (PMID:34758189), the Tmod3 megakaryocyte paper (PMID:25964668), Tpm4.2 reconstitution (PMID:28216317), Tpm4-/- lung perfusion (PMID:37419900), a targeted IPD panel study (PMID:31249973) and the ClinGen gene-validity record (CGGV assertion 0b8bb90f, Moderate, AD). One openscientist deep-research report was used as a lead source (research/TPM4-related_Platelet_Disorder-deep-research-openscientist.md): 14/14 references resolved, 0 off topic, term validation flagged HP:0001873 used for 'Laboratory abnormality'; just preflight-dr PASS (TPM4 named 71 times). The report's statement that Tpm4.2 binds F-actin with high affinity and competes with alpha-actinin overgeneralises PMID:28216317, which reports that Tpm4.2 bound only bundled filaments; the entry quotes the paper directly. Its supportive-care treatment table (tranexamic acid, desmopressin, platelet transfusion, rFVIIa) cites general inherited platelet disorder papers (PMID:41201390, PMID:40932452) and was not curated because no TPM4 patient report describes those treatments. relationship_type is UNKNOWN because ClinGen rates the pair Moderate. A Mild Failure of Primary Hemostatic Plug Formation node conforms to primary_hemostatic_plug_failure on the strength of reduced thrombus formation under flow in a patient and in mice, and the entry was added as a member of the Inherited_Platelet_Function_Disorders grouping, with TPM4 removed from that grouping's gap list. Both stubs for this disease were deleted: stubs/TPM4-related_Platelet_Disorder.yaml and stubs/Bleeding_Disorder_Platelet-type_25.yaml (MONDO:0957580, which MONDO has scheduled for merge into MONDO:0100487 and which the entry maps as exactMatch). Validated with just validate, count-verified-snippets, validate-terms, the offline CI gates and validate-disorders.

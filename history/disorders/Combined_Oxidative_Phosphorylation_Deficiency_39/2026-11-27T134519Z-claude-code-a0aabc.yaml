  summary: 'Create: Combined Oxidative Phosphorylation Deficiency 39 (GFM2)'
  details: |
    New entry for COXPD39 (MONDO:0032726), caused by biallelic GFM2 variants; the stub stubs/Combined_Oxidative_Phosphorylation_Deficiency_39.yaml is deleted. GFM2 encodes mtEFG2 (EF-G2mt, RRF2mt), the mitochondrial ribosome recycling factor 2 that splits the post-termination 55S mitoribosome with RRFmt and has no translocation activity (PMID:19716793, PMID:33878294, PMID:34127662); the lesion node binds GTPase activity (GO:0003924, DECREASED), and the next node binds ribosome disassembly (GO:0032790). Six families are described: the first by exome sequencing (PMID:22700954; microcephaly, simplified gyral pattern, insulin-dependent diabetes), two sisters with Leigh syndrome and arthrogryposis multiplex congenita (PMID:26016410), two unrelated patients with biochemical work-up (PMID:29075935), a homozygous p.Arg190Gln Tunisian patient (PMID:38283147), and an infant with a deep intronic pseudoexon allele rescued in fibroblasts by a splice-switching oligonucleotide (PPR:PPR1243461, a 2026 medRxiv preprint). The mitochondrial translation node carries a REFUTE item: pulse labelling in two patients' fibroblasts showed no reduced synthesis (PMID:29075935). relationship_type is UNKNOWN: ClinGen rates GFM2 Moderate for Leigh syndrome (MONDO:0009723), a different disease, so no gene_disease_validity tier is recorded. No GeneReviews chapter is specific to GFM2; the Leigh spectrum overview (PMID:26425749) is Overview-format. Validation: linkml-validate, term validation (OLS), reference validator with --no-full-text (61 snippets, 0 issues), count-verified-snippets 61/61, and the entity-ref, causal-target, name-collision, gene-validity, enum, duplicate-key, coarse-phenotype and folded-hyphen checks all pass.

  summary: Ground OSBPL2 loss-of-function activity
  details: |
    Followed the failed gene-activity grounding CI check on PR #10325. Added OSBPL2 as the gene on Loss of OSBPL2 Sterol and Phosphoinositide Transfer and bound cholesterol transfer activity plus phosphatidylinositol-4,5-bisphosphate binding to that molecular loss-of-function node, leaving the N-terminal frameshift trigger as the allele-pattern node. The existing ORP2 evidence already supports cholesterol exchange with PI(4,5)P2, so no new reference cache was needed. Revalidated terms, disorder snippets, cache ordering, entity refs, causal targets, and the gene-activity ratchet.

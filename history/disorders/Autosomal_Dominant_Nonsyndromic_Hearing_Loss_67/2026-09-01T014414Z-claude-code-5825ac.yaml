  summary: Address review of the DFNA67 entry
  details: |
    Review round on PR 10325 (approved with three optional suggestions), plus two defects found in self-review. Suggestion 1: recorded the GeneReviews negative in top-level notes. Verified rather than assumed - OSBPL2 AND GeneReviews[Book] and DFNA67 AND GeneReviews[Book] both return zero with no unresolved-field warning, and the cached Genetic Hearing Loss Overview (PMID:20301607) contains no occurrence of OSBPL2 or DFNA67, so tagging it would create a cited-but-not-mined reference. Suggestion 2: added two structured phenotypes that were previously prose only - Bilateral sensorineural hearing impairment (HP:0008619, OBLIGATE) and Severe sensorineural hearing impairment in adulthood (HP:0008625, FREQUENT, onset ADULT), the second with a notes line saying the band is a floor set by counted implantations rather than a measured proportion. Suggestion 3: hedged the spiral ganglion premise in the Cochlear Implantation description - spiral ganglion neurons are lost in the frameshift transgenic and preserved by rapamycin there, so ganglion involvement is not excluded; the description now says why that step is deliberately not modelled as a pathophysiology node (overexpression transgenic on two intact endogenous alleles, nothing in the human literature) and that the clinical case rests on the measured outcomes rather than on the premise. Self-review defect 1: the toxic-proteinopathy hypothesis description promised two observations from human genetics and listed one; both are now stated, and an uncitable whole-gene-deletion claim was removed from the top description since the ClinGen dosage record could not be built. Self-review defect 2: the variant paragraph attributed c.158_159delAA only to the Mongolian family when the Korean YUHL3 family carries it too, and used HGVS-ordered forms without saying so; both corrected, with a nomenclature warning that p.Gln53Argfs*100 carries two different cDNA descriptions across publications. Also regraded the founding paper's 'The function of OSBPL2 in the hearing process remains to be determined' from HUMAN_CLINICAL to OTHER, matching how the file's other state-of-knowledge quotes are graded. All gates re-run and exit 0; validate-disorders reports 72 of 72 snippets verified. No new cache rows.

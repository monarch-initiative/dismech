  summary: 'Create: Striate Palmoplantar Keratoderma Type 1 (DSG1)'
  details: |
    New entry for SPPK1 (MONDO:0007859), autosomal dominant DSG1 haploinsufficiency. Curated from PubMed abstracts and full texts fetched into references_cache (17 papers). No deep-research provider was available in this environment, so no research/ report was generated. The pathograph runs from DSG1 loss-of-function variants to fewer and smaller suprabasal desmosomes, then suprabasal keratinocyte disadhesion, then striate and focal palmoplantar hyperkeratosis. A parallel arm covers reduced DSG1-Erbin suppression of EGFR-ERK signalling and abnormal terminal differentiation. Three nodes conform to desmosomal_adhesion_failure. Biallelic DSG1 (SAM syndrome) and DSP (type 2) are recorded as differential diagnoses. No population prevalence was found. Treatments are supportive (keratolytics, footwear), cited to a general inherited-PPK review. The entry was added to the Hereditary_Desmosomopathies grouping, where it satisfies both NECESSARY criteria. Validated with just validate (39/39 snippets), validate-terms, check-entity-refs, check-causal-targets, check-coarse-phenotypes, list-gene-term-mismatches and check-groupings.

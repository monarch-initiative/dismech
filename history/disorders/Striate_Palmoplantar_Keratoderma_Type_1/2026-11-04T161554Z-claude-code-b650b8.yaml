  summary: 'Review round 1: deep research, term and frequency fixes, diagnosis block'
  details: |
    Addressed the first automated review of PR 16485. Added a claude_code deep-research report (research/Striate_Palmoplantar_Keratoderma_Type_1-deep-research-claude_code.md); all 21 of its references resolved, and preflight-dr found DSG1 and OMIM 148700 consistent with MONDO. From the report, added PMID:40878888, a family homozygous for a leaky DSG1 splice allele (c.685-3T>A) with mild non-syndromic striate PPK. This was added to the genetic record, the SAM syndrome differential and the scope notes, since it shows that the SPPK/SAM boundary follows residual DSG1 dose. The report found no evidence of atopy in heterozygous carriers. The Dsg1-deficient mouse (PMID:30660666) has no retrievable abstract and was not cited. Other changes: focal plantar lesions rebound from HP:0005588 to HP:0007497 Focal friction-related palmoplantar hyperkeratosis. The frequency on Plantar Pain was dropped because it rests on single case reports. The NMD process binding with INCREASED was removed from the variant node. The differentiation node was retagged CELLULAR. Review evidence was added for the woolly-hair differential feature and for plantar-before-palmar onset. A diagnosis block was added (biopsy histology, DSG1 testing). Revalidated: just validate, count-verified-snippets (44/44) and validate-terms.

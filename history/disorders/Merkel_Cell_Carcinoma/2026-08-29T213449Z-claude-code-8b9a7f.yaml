  summary: 'Review: Merkel Cell Carcinoma evidence re-read against cached sources'
  details: |
    Re-read all cited publications and re-verified all 23 evidence items (13 body, 10 in the
    DOI reference pool). Every snippet is an exact character-for-character substring of its
    cache, including the non-ASCII hyphen in "fair-skinned" and the en-dash in "anti-PD-L1" -
    notable because all 10 DOI items bypass the machine verifier entirely. No defects and no
    concerns; no changes made to the entry.

    The aetiology split that is the main confusion risk for this disease is handled correctly
    throughout: PMID:26238782 grounds the UV-signature/high-TMB and somatic RB1/TP53 claims for
    MCPyV-negative tumours, while PMID:18202256 and PMID:18812503 ground the clonal viral
    integration and truncated-LT/Rb claims for MCPyV-positive tumours, with no cross-
    contamination. The pembrolizumab response figures (62% MCPyV-positive, 44% virus-negative)
    match the NEJM abstract exactly.

    Minor observations recorded only: three prose figures are uncited although uncontroversial
    - small T antigen acting via 4E-BP1 hyperphosphorylation, a 10-15 fold transplant-recipient
    risk, and a ~30-35% avelumab response rate in previously treated patients. Node
    descriptions carry no evidence requirement, so none of these is a defect.

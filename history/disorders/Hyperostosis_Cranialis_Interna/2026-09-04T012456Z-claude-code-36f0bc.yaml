  summary: Correct knock-in vs null attribution in FAILS_TO_RECAPITULATE limitations
  details: |
    Round-13 review finding. The limitations field on the FAILS_TO_RECAPITULATE model link described the affected appendicular skeleton and vertebral column as 'osteoporotic rather than hyperostotic'. That is the plain Zip14 null's phenotype (PMID:29621230: 'loss of endogenous Zip14 did not affect the calvariae, even though the appendicular skeleton and vertebral column were osteoporotic', and its cited reference 14 phenotype of dwarfism with general osteoporosis and normal cortical bone), not the Ob-KI knock-in's. The knock-in shows significantly increased cortical thickness, decreased cortical porosity and a smaller midshaft diameter, with decreased trabecular bone volume, so its long bones are cortically hyperostotic and osteoporotic only in the trabecular compartment. An earlier commit corrected this misattribution in two places; this block, added in 79c424d92, was missed, and it contradicted the entry's own PARTIALLY_RECAPITULATES limitations sixty lines above. Rewrote the prose to describe the knock-in's long bones as cortically thickened with trabecular osteoporosis, and to keep the osteoporotic appendicular and vertebral description attached to the null. Prose only: the two evidence items on the link were already correctly scoped and are unchanged.

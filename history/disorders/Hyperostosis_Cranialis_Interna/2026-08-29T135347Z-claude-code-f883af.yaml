  summary: Correct two false no-term-exists claims found by cross-entry audit
  details: |
    Follow-up correction to Hyperostosis_Cranialis_Interna, prompted by a review finding on PR #10011.

    The reviewer of the DMS-MFH entry found that a notes block asserted HPO has no presenile-cataract term when HP:0007819 exists, and suggested re-checking the other no-term-exists judgements in that file by the same route. The audit was extended to all five entries authored in this session and found two further false claims, both here.

    First, the anosmia phenotype carried a note stating that HPO has no graded olfactory term matching the source's wording. HPO carries HP:0004409 Hyposmia with Total and Partial children. The phenotype was rebound from HP:0000458 Anosmia to HP:0004409 Hyposmia, which is also the more honest match: the source reports a disturbance of the sense of smell, not its abolition, so the original binding overstated severity as well as resting on a false premise about the ontology.

    Second, the facial hypoesthesia note stated that HPO has no discrete annotation for cranial nerve V sensory loss. HP:0031912 Trigeminal anesthesia exists. The binding to the general HP:0033748 Hypoesthesia was retained, but on the narrower ground that survives checking: anesthesia denotes complete sensory loss and the source reports impairment of facial sensibility, so binding the trigeminal-specific term would assert a severity the source does not support. The note now says that rather than claiming no term exists.

    The remaining no-term claims in this session's entries were checked and hold: no HPO term for cheek pads at the oral commissures in Sweeney-Cox_Syndrome, none for a syndrome-specific facial gestalt in Ring_Chromosome_14, and no correct GO term for the mitotic-error micronucleus in the same entry.

    Revalidated with just validate-disorders and just count-verified-snippets (42/42).

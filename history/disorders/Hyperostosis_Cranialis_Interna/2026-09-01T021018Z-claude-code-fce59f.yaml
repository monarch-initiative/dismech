  summary: Correct the entry description and the misattributed appendicular osteoporosis
  details: |
    Round 11 review. The top-level description still told the pre-correction mouse story: it said the mice reproduce the cortical phenotype and framed the open question as a possible unrecognised trabecular phenotype in patients. That is the summary prose rendered at the top of the disorder page, so it was the version most readers would see. Rewritten to say the thickening appears in the long bones while the calvaria shows no phenotype, that the same sparing appears in the plain null, and that the open question is why murine calvariae are protected. Checking the source for that rewrite surfaced a second error the review had not caught: the limitations block and the discussion rationale both said the knock-in mouse's appendicular skeleton and vertebral column are osteoporotic rather than hyperostotic. That is the Zip14 null's phenotype, cited from reference 14 in the same paper. The knock-in's long bones carry a drastically thickened cortex; only the trabecular compartment is osteoporotic. Corrected in both places. Also took the two non-blocking suggestions: an incoming edge from Calvarial and Skull Base Hyperostosis to Skull Base Osteosclerosis, and the discussion id renamed to hci_murine_calvarial_sparing to match its corrected prompt. Headache is deliberately left without an incoming edge because the phenotype explicitly asserts no mechanism. Validated: schema clean, 57/57 snippets, check_causal_targets exit 0, tests/test_data.py and tests/test_causal_targets.py 47199 passed.

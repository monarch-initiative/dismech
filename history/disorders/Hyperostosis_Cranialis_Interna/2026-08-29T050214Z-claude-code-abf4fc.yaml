  details: |
    Created kb/disorders/Hyperostosis_Cranialis_Interna.yaml (MONDO:0007765, SLC39A14).

    Deep research was requested from falcon, which is not configured here, so the run used --fallback and claude_code produced the report; the substitution is recorded in the report frontmatter. Its reference validation resolved 39 of 39 citations with a 0.0 confabulation rate and flagged one unsupported quote, PMID:794825, and three off-topic references. Its term validation matched all 39 checked labels and flagged one obsolete term, GO:0019933 obsolete cAMP-mediated signaling. None of the five flagged identifiers is used in this entry; the cAMP node was already bound to GO:0141156, the current term, before the report was read.

    The gene was not in the stub and had to come from the literature. MONDO:0007765 carries a feature relation and a parent class and no causal-gene relation, so stub enrichment had nothing to copy, while SLC39A14 was identified by whole-exome sequencing in 2018. The observation is recorded in the entry notes for whoever maintains that mapping; the entry does not propose what should be done about it.

    The pathograph is a six-node chain with an unusually complete molecular route for a disease this rare: a dominant L441R substitution, mistrafficking of ZIP14 away from the plasma membrane with intracellular zinc accumulation, hyperactivation of cAMP-CREB and NFAT signalling, enhanced endosteal bone formation in osteoblasts, calvarial and skull base hyperostosis, and cranial nerve entrapment. functional_impact_category is left UNKNOWN deliberately, because the allele causes mistrafficking with downstream signalling hyperactivation, which is neither simple loss of transporter function nor a clean gain, and no source classifies it.

    The conditional mouse is curated as PARTIALLY_RECAPITULATES with three stated limitations: the construct overexpresses rather than carrying the allele at endogenous dose, the phenotype is generalised skeletal rather than confined to the skull, and the mice additionally develop trabecular osteoporosis that patients are not described as having. Cranial confinement is the single most distinctive feature of the human disease and is the thing the model does not reproduce, which is recorded as a HUMAN_MODEL_MISMATCH discussion with untested candidate explanations.

    A Named Entity Confusion hazard was identified independently by the curator and by the deep-research report, and the report's stricter reading was adopted. The phrase hyperostosis cranialis interna is used both for this Mendelian disease and as a loose radiological label for sporadic internal skull-table thickening overlapping hyperostosis frontalis interna. A 2025 case report of cerebrospinal fluid leak, PMID:40091967, was fetched, read and initially curated as a phenotype with a heavy caveat. It was then removed entirely: that paper describes the aetiology as unknown despite the 2018 gene identification, discusses the condition alongside hyperostosis frontalis interna, and reports no genetic testing, so using it to establish a phenotype of the Mendelian disease is the confusion itself. The reasoning is recorded in notes and the mimics are curated as differential_diagnoses rather than dropped.

    No frequency band is asserted anywhere in this entry. Essentially the entire clinical description derives from three related Dutch families with common progenitors, so every natural-history statement is conditioned on one pedigree and one allele, and that limitation is recorded as its own knowledge gap.

    Validated with just validate-disorders, just validate-terms, just count-verified-snippets (36/36), just check-entity-refs and just check-duplicate-keys. Compliance 95.0 percent.

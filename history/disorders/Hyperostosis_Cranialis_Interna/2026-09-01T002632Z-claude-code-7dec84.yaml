  details: |
    Review response on PR #10010, addressing five IMPORTANT findings and two suggestions.

    Finding 1 was a factual inversion, and the most serious defect in this entry so far. Four passages stated that the conditional mouse develops a generalised skeletal phenotype rather than a skull-confined one. The cached full text says the opposite: the mice develop no calvarial phenotype at all, while the appendicular skeleton and vertebral column are affected and are osteoporotic rather than hyperostotic. The authors describe this as truly opposite to what is seen in patients, and they observed the same calvarial sparing in the plain Zip14 null, which rules out the knock-in construct as the explanation. All four passages were corrected. The discussion prompt was rewritten from asking what confines hyperostosis to the skull in patients to asking why murine calvariae are spared, which is the question the authors themselves pose and leave open. Two accurate quotes replaced the trabecular-osteoporosis quote that had been standing in for the mismatch.

    Finding 2, the HUMAN_MODEL_MISMATCH had no FAILS_TO_RECAPITULATE link behind it, so the negative claim survived only as prose in limitations, which is the state that slot exists to fix. A second link was added on the same model targeting Calvarial and Skull Base Hyperostosis, with fidelity LOW, mandatory limitations and mandatory evidence. Its evidence is graded SUPPORT rather than REFUTE, because the quotes support the claim that the model fails; the negative direction is carried by the relationship value. Link-level evidence was also added to the existing PARTIALLY_RECAPITULATES link, which had none, for consistency.

    Finding 3, the pathograph terminated at Cranial Nerve Entrapment and seven phenotypes hung free. Seven downstream edges were added connecting that node to the deficits it explains. One sentence already quoted in the entry supports five of them directly and is cited on the facial-palsy edge; the optic-atrophy edge is typed INDIRECT_UNKNOWN_INTERMEDIATES because no source traces compression to atrophy in this disease.

    Finding 4, the treatment had target_phenotypes but no target_mechanisms, so it was not joined to the pathograph. That was added, targeting the entrapment node. Two unused quotes from a reference already in the cache were curated: the one-year House-Brackmann outcome, which is the part that matters for a treatment recommending early intervention, and a second-source statement supporting prophylactic decompression in younger patients, which is the timing claim this entry's management argument rests on.

    Finding 5, a node bundled a molecular trafficking event with its cellular consequence. It was split into ZIP14 L441R Mistrafficking, tagged MOLECULAR and carrying the plasma-membrane compartment, and Intracellular Zinc Accumulation, tagged CELLULAR and carrying the zinc-transport process, joined by a direct edge. The same source sentence supports both halves and is cited on each with an explanation scoped to that node's claim. Renaming the node broke a discussion foreign key, which check-entity-refs caught and which was repointed.

    Two suggestions were taken. CL:0000062 osteoblast was added alongside CL:2000058 calvarial osteoblast, because the mouse driver is lineage-wide rather than calvaria-restricted and calvarial osteoblasts from those animals showed no marker differences, so binding only the calvarial type overstated where the mechanism operates. The reviewer's observation that Optic Atrophy and Headache carry provenance notes rather than evidence is acknowledged as a conscious state rather than an oversight.

    The full KB data test lane was run locally rather than relying on this PR's CI, which selects pytest by changed path and therefore skips those tests for a kb-only change. test_failure_to_recapitulate_links_are_substantiated passes.

    Revalidated with just validate-disorders, just validate-terms, just count-verified-snippets (56/56, up from 49), just check-entity-refs, just check-duplicate-keys, just check-snippet-grading and just check-folded-hyphens.

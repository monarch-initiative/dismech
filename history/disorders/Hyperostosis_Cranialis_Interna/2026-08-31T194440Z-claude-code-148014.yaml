  summary: 'Review response: rebind to Neuroelectrophysiology Test, add the SLC39A14
    allelic-collision differential'
  details: |
    Review response on PR #10010, addressing two IMPORTANT findings and four of five suggestions.

    Finding 1, the NCIT binding on the vestibular and visual-evoked-potential entry. The reviewer ran the search the previous round could not and confirmed both halves: NCIT genuinely has no term for electronystagmography, vestibular function testing, or visual evoked potentials in general, but NCIT:C215111 Neuroelectrophysiology Test does exist, is defined as a diagnostic tool measuring electrical signals produced by nerves and muscles, and is reachable from NCIT:C25218 so it validates in a diagnosis_term slot. The entry was rebound to it, with preferred_term carrying the specificity. The previous binding to NCIT:C85857 Evoked Response Audiometry was an auditory term used on an entry describing two non-auditory tests, and it made one identifier stand for two different tests in the same file, since the brainstem-response entry above legitimately uses it. The notes paragraph was rewritten, since it argued for a binding no longer being made.

    Finding 2, stale retired-enum prose. An explanation on the linkage evidence item still read Graded PARTIAL after the item had been migrated to supports SUPPORT and directness INDIRECT. The cause is worth recording: the cleanup grep searched for the phrase Graded PARTIAL on a single line, and in a folded scalar that phrase wraps, so Graded ended one line and PARTIAL began the next and the grep returned nothing. Re-running the search for the bare token found this one and one more in Ring_Chromosome_14, fixed in that PR. No gate catches prose naming a removed enum value, which is why this needed a human reader.

    Four suggestions were taken. The two statistics asserted in results fields without snippets, the 60 to 70 percent hearing threshold and BERA latency figure and the 50 percent vestibular abnormality figure, are now cited with exact quotes. Three explanations ending in meta-commentary about what the schema does or does not offer were trimmed to their substantive halves, following the reviewer's observation that this class of review dialogue belongs in history rather than kb, and that PR #10234 has just finished moving such prose out. The discussion anchor was changed from animal_models#Mouse to the model's name, which survives a second mouse model being added.

    The allelic-collision suggestion was taken and is the most consequential addition. SLC39A14 causes both this dominant disease and, through biallelic loss of function, hypermanganesemia with dystonia 2, a recessive manganese transporter defect presenting as childhood-onset parkinsonism-dystonia. The recessive disease responds to chelation with disodium calcium edetate, and that treatment does not transfer across the allelic boundary: it addresses manganese overload from a transport failure, whereas the lesion here is a dominant mistrafficking allele causing intracellular zinc accumulation. PMID:27231142 was fetched and both claims are quoted. This is curated as a differential_diagnoses entry with a notes paragraph stating that it is a gene collision rather than a name collision, and therefore cuts the opposite way from the naming hazard already recorded in the entry notes.

    The reviewer's correction that PMID:21665359 and PMID:21079950 are not in the reference cache was noted, and neither was chased.

    Revalidated with just validate-disorders, just validate-terms, just count-verified-snippets (47/47, up from 43), just check-entity-refs and just check-folded-hyphens.

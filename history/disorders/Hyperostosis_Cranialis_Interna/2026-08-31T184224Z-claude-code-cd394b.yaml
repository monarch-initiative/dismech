  summary: 'Review response: rebind trigeminal and NCIT terms, fix false provenance,
    migrate schema'
  details: |
    Review response on PR #10010 addressing four carried-over IMPORTANT findings and three suggestions, plus a rebase and the supports/directness schema migration.

    Finding 2 is the one worth stating plainly. The previous commit corrected a false claim that HPO has no trigeminal term, and replaced it with a different false claim: that anesthesia denotes complete sensory loss and so would overstate severity. The HPO definition of HP:0031912 is decreased or absent sensation in the distribution of the trigeminal nerve, naming the face and mouth. It explicitly covers decreased sensation. The rejection ground was reached from the label rather than the definition, which is the exact habit the earlier GO:0021545 finding was about and which the previous PR comment claimed had changed. The phenotype is now bound to HP:0031912, which is the most specific term that accurately represents the claim, and the note records the definition rather than an argument about severity.

    Finding 1, carried over from two earlier rounds and never addressed, is a third false no-term-exists claim in this file. The note on the monitoring panel asserted that no term covering the composite panel exists. Two suitable terms are in the repository's own NCIT cache and pass the TreatmentActionTerm enum: NCIT:C38036 Audiometric Test and NCIT:C85857 Evoked Response Audiometry, both precedented in other entries. The binding to NCIT:C38054 Electroencephalography was not inert: that term appears in 22 other disorder entries and in every one it means an actual EEG, so this entry would have been the sole outlier in any query for diseases diagnosed by EEG. The single panel entry was split into three, the false claim deleted, and the results string distributed so each statistic sits on the test it came from. One weak binding remains and is flagged in place: the vestibular and visual-evoked-potential entry uses an auditory NCIT term because a search for electronystagmography and visual evoked potential clinical-action terms came up empty, and that is recorded as a search that found nothing rather than as an established absence.

    Finding 3, also carried over, was an uncited causal claim: the headache description attributed the symptom to raised intracranial and ocular pressure. ORPHA:443098 would supply a quotable row, but the Orphanet bulk XML is not present in this checkout and fetching it would add manifest churn unrelated to this entry, so the reviewer's stated alternative was taken and the mechanism was dropped from the description. The Orphanet route is recorded in notes for whoever next refreshes that source.

    Finding 4 was a false provenance record. The 052904Z history record states that the variant-detail suggestion was taken and that the genetic block records NM_001128431.4:c.1322T>G, p.Leu441Arg, exon 8 and ClinVar VCV000523143. None of those strings were in the entry: an edit script's replacement had silently not matched and the result was never verified. Because history records are append-only provenance that outlive the PR thread, the discrepancy would have become permanent. The detail has now been added to the genetic features, including the ClinVar review status of no assertion criteria provided, which makes the record accurate and is content worth having.

    Three suggestions were taken. The olfactory phenotype was rebound again, from HP:0004409 Hyposmia to HP:0004408 Abnormality of the sense of smell, because the cited source reports a disturbance of smell that is neither graded nor described as complete, and Hyposmia asserts reduced sensitivity while Anosmia asserts inability. The tension with the HPO disease annotation, which carries Anosmia, is recorded in notes rather than hidden. The sensitivity attribution was corrected to state that visual evoked potentials fall inside the 25 to 37.5 percent range and are recommended nonetheless. The modifier ABNORMAL was removed from GO:0005385, since the node argues the defect is mislocalisation rather than altered transport capacity.

    Curation-process narration was removed from notes and left to the history records, per the reviewer's observation that notes is read by someone asking about the disease rather than about the pull request.

    Separately, the branch was rebased onto current main, 120 commits ahead, and the five PARTIAL evidence items were migrated to the new supports and directness schema from PR #10003. Each was mapped individually: the linkage-interval and trabecular-mismatch items became INDIRECT, and the olfactory, decompression and trabecular-readout items became DIRECT with their strength caveats kept in explanation.

    Revalidated with just validate-disorders, just validate-terms, just count-verified-snippets (43/43), just check-entity-refs and just check-folded-hyphens.

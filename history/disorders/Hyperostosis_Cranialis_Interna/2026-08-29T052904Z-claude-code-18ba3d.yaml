  details: |
    Review response on PR #10010, addressing five IMPORTANT items and one non-blocking suggestion.

    Item 1, GO:0021545 cranial nerve development was the wrong term for the cranial nerve entrapment node. It denotes the progression of cranial nerves from formation to mature structure, which is a developmental process; in this disease the nerves develop normally and are mechanically compressed in the second decade, so the annotation asserted a neurodevelopmental disorder that this is not. The binding was dropped and a note records the reasoning and that no suitable term exists. This is the second false-friend term in this batch, after the ciliate micronucleus term on ring chromosome 14, and both passed term validation, which confirms a CURIE resolves and is named consistently but cannot tell whether the term means the right thing.

    Item 2, cranial nerve V was named in the mechanism and in the entrapment list but had no phenotype. Facial hypoesthesia was added, bound to the general HP:0033748 Hypoesthesia, using the impairment-of-facial-sensibility clause already present in a cached reference. The anatomical restriction is carried in the name and description rather than by binding a narrower term, because HPO has no discrete annotation for trigeminal sensory loss in this context.

    Item 3, headache was missing. Added, bound to HP:0002315, with HPOA provenance recorded in notes rather than quoted. No frequency band was assigned, and the reviewer explicitly agreed the no-frequency decision was correct while noting that omitting the band and omitting the phenotype are different things. That distinction was the substance of the finding and it was right.

    Item 4, PMID:23622937 had not been fetched and carries the one finding that constrains the mechanism chain. Preserved otoacoustic emissions in every patient localise the hearing loss to the nerve rather than the cochlea, which is direct positive evidence for the entrapment-to-hearing-loss edge already drawn; that quote was added to the hearing phenotype. The same paper supplies the monitoring panel, which was added as a diagnosis entry: tone and speech audiometry, brainstem evoked response audiometry and vestibular testing, visual evoked potentials for the optic nerve, and the BERA I-V interpeak latency as the measure that determines nerve encroachment reliably. It also states that blink and masseter reflexes are not advised routinely, because the symmetrical bilateral nature of the disease reduces their sensitivity, and that negative recommendation is curated too. The NCIT binding for this panel is imperfect and is flagged in notes rather than hidden.

    Item 5, a progression section was added with three phases: presymptomatic radiological, early symptomatic in the second decade, and established deficit. The reported plateau after the fourth decade was deliberately not curated as a fourth phase, because no cached source states it and a phase boundary asserted without a citation would be the kind of claim this entry otherwise avoids. That decision is recorded in review_notes so it can be revisited if a source is located.

    The non-blocking variant-detail suggestion was taken. The genetic features now record NM_001128431.4:c.1322T>G, p.Leu441Arg, exon 8, and ClinVar VCV000523143 classified Pathogenic with review status no assertion criteria provided, which is the honest weak point in the gene-disease case.

    Revalidated with just validate-disorders, just validate-terms, just count-verified-snippets (42/42, up from 36), just check-entity-refs, just check-duplicate-keys and just check-folded-hyphens. Compliance rose from 95.0 to 93.9 percent by the global measure, which fell because the new progression and diagnosis entries add slots without evidence on every one; the weighted measure and the entry's evidence coverage both improved.

  summary: 'Review response: add 18F-fluoride PET/CT, optic atrophy, and two knowledge
    gaps'
  details: |
    Review response on PR #10010, addressing the one blocking item and five of six suggestions.

    The blocking item was a missing diagnostic modality. 18F-fluoride PET/CT is the only test in this entry that quantifies disease activity rather than describing structure, so it is not redundant with computed tomography, and the study behind it was done in this same Dutch kindred: nine affected family members, seven unaffected relatives and nine unrelated controls, with standardised uptake values measured at frontal bone, sphenoid bone, petrous bone and clivus. PMID:21079950 was fetched and verified before use. Two quotes are curated: the significantly higher uptake in sphenoid bone and clivus of affected individuals, and the statement that visual assessment detects disease severity and the pattern of disturbed bone metabolism through life. That second one matters for this entry specifically, because the management argument turns on decompressing before a nerve is lost, and this is the instrument that shows whether the process is still advancing. The NCIT binding names the modality pairing rather than the tracer, since NCIT has no 18F-fluoride term, and preferred_term carries the tracer.

    Five suggestions were taken. The decompression treatment's preferred_term was changed from Surgical Procedure, which merely echoed the broader NCIT label, to cranial nerve decompression; the reviewer correctly noted this entry already applies that pattern at NCIT:C215111 and was internally inconsistent. Optic atrophy, HP:0000648, was added from the HPO annotation for OMIM:144755 as the structural correlate of second-nerve entrapment, with no frequency asserted since the annotation records none. A descriptor description was added to the plasma membrane cellular component making clear it names the compartment the transporter fails to reach rather than where it sits. Two knowledge gaps were added: one recording that the two mouse models point at increased formation and decreased resorption respectively, which are different mechanistic claims with different effector cells and which nothing in the cache adjudicates, and one recording that serum and tissue zinc, manganese and iron have never been measured in a patient with this disease.

    The metal-levels gap is the more consequential of the two and is deliberately attached to both the zinc-accumulation node and the allelic differential. The biallelic form of the same transporter causes measurable manganese accumulation treatable by chelation; whether the dominant mistrafficking allele produces any systemic metal disturbance is unknown, and that bears on whether the chelation boundary this entry draws is a boundary of mechanism or of untested assumption.

    The auditory brainstem implantation suggestion was recorded in review_notes rather than curated. Deafness is the dominant morbidity and implantation is the option when the cochlear nerve fails, and there is a disease-specific hazard, cerebral vasospasm after implantation reported in a patient with this syndrome, PMID:21665359. That report has no abstract retrievable through the usual route, so no compliant snippet could be quoted and nothing is asserted. It is recorded so the safety signal is visible to the next curator rather than lost, and so that whoever can obtain the full text knows what to look for.

    Revalidated with just validate-disorders, just validate-terms, just count-verified-snippets (49/49, up from 47), just check-entity-refs, just check-duplicate-keys, just check-snippet-grading and just check-folded-hyphens.

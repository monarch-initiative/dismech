  summary: 'Create: Inflammatory Skin And Bowel Disease Neonatal 2 (EGFR deficiency)'
  details: |
    New entry for MONDO:0014481, the autosomal recessive EGFR loss-of-function disorder (Roma founder variant p.Gly428Asp). Curated from the two discovery reports (Campbell 2014 full text; Ganetzky 2015 full text), the 18-patient Roma series and long-term survivor reports, the Slovak Roma carrier-frequency study, and mouse models of germline and epidermis-specific Egfr deletion. Pathograph: receptor misfolding and loss of function -> abolished ERK/AKT signalling -> keratinocyte differentiation and barrier failure, cutaneous inflammation with impaired host defence, hair follicle degeneration, intestinal epithelial dysfunction, renal tubular salt and water wasting, and fibroblast senescence, each wired to its phenotypes. The renal and senescence nodes are marked HYPOTHETICAL and the follicle and intestine nodes PROVISIONAL because their mechanisms rest on mouse data or single-patient cell lines. JAK1/2 inhibition (mouse data only) is recorded as a knowledge gap rather than a treatment. Validated with just validate (89 snippets verified), validate-terms, and the entity-ref, causal-target, enum, duplicate-key and coarse-phenotype gates.

  summary: 'Create: TUBA4A-related Disorder (ALS/FTD, spastic ataxia, myo-tubulinopathies)'
  details: |
    Created 2026-08-20 while closing out tubulin-family disease coverage. docs/reports/tubulinopathies-grouping-review-2026-08-20.md enumerated the tubulin gene-disease landscape and found eight tubulin-family diseases with no DisMech entry; this is one of them. All evidence snippets are quoted from cached abstracts and verified with just count-verified-snippets; just validate and just validate-terms pass.

    The tubulinopathy that is mostly not a CNS disease. Spans the original ALS/FTD association, hereditary spastic ataxia, and the myo-tubulinopathies newly delineated in 2026 - where 17 of 19 families had myopathy with no CNS involvement at all.

    MAPPING CAVEAT recorded in the entry notes: disease_term is MONDO:0014531 (ALS type 22) because it is the only MONDO concept for this gene, and it substantially under-describes the entry. MONDO has no concept for TUBA4A myo-tubulinopathy or for the multisystem proteinopathy presentation. This is the same class of upstream gap as monarch-initiative/dismech#9113.

    functional_impact_category is UNKNOWN: the same gene carries dominant, de novo and recessive alleles in one cohort, with asymptomatic heterozygous carriers of the recessive alleles, so one mechanism class is unlikely to fit.

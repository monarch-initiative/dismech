  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED on PR 15518. Removed two GO annotations no cited source supports: GO:0051402 neuron apoptotic process (no abstract mentions apoptosis) and GO:0000993 RNA polymerase II complex binding (the only functional data is yeast SRB4 inactivation, which does not show reduced Pol II binding by p.L371P); also dropped the over-general GO:0010468. Changed GO:0003712 modifier from LOSS_OF_FUNCTION to DECREASED per the modifier-vs-functional_impact_category rule. Added four frequent, quotable phenotypes from PMID:33756211/PMID:20950787, each wired from the Postnatal neurodegeneration node: Spastic tetraplegia (HP:0002510), CNS hypomyelination (HP:0003429), Abnormal pons morphology (HP:0007361, pontine ventral flattening), Dysphagia (HP:0002015). Recorded early death in progression rather than as a phenotype, because HP:0003819 Death in childhood is outside the PhenotypeTerm enum's Phenotypic-abnormality subtree. Retargeted the Supportive Care mechanism link from the neurodegeneration node to the Dysphagia phenotype it actually manages. Marked the Progressive microcephaly background quote quote_role BACKGROUND. Note: classifications and prevalence were not added by this PR; they pre-existed from PR 8832, correcting the earlier session record's framing. validate clean, 42/42 snippets verify, entity-refs and causal-targets pass.

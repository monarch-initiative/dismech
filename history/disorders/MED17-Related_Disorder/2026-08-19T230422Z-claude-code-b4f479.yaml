  summary: Create standalone MED17-Related Disorder entry
  details: |
    Created a standalone MED17-Related Disorder entry (infantile cerebral and cerebellar atrophy with postnatal progressive microcephaly) as part of the MEDopathy spectrum expansion, alongside the Mediator_Complex_Neurodevelopmental_Disorder grouping entry.

    Content: description, classifications, prevalence, pathophysiology, phenotypes (progressive microcephaly, global developmental delay, spasticity, seizures, cerebral and cerebellar atrophy), genetic section covering the p.L371P Caucasus Jewish founder allele with autosomal recessive inheritance, and treatments. 13 PMID-backed evidence items.

    The yeast SRB4 complementation assay evidence is classified evidence_source: IN_VITRO rather than HUMAN_CLINICAL, per the CLAUDE.md classification rules and reviewer item 2 on PR #8832.

    This record replaces a zero-byte history file committed earlier in the same PR (reviewer item 7); it documents the same curation session, rewritten with real content.

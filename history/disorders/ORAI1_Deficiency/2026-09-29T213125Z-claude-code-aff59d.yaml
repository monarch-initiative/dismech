  summary: Fix STIM1 sibling MONDO pointer
  details: |
    The notes: block pointed at MONDO:0013006 as the identifier for the sibling disease STIM1 deficiency. MONDO:0013006 is isolated growth hormone deficiency type IB. The correct identifier for combined immunodeficiency due to STIM1 deficiency is MONDO:0013008, confirmed against the EBI OLS4 MONDO record, which gives that label and the xrefs OMIM:612783 and Orphanet:317430, and places the term under MONDO:0015695 combined immunodeficiency due to CRAC channel dysfunction as the surrounding sentence already states. One line changed; no other claim in the entry was touched. This edit was made while curating the STIM1 sibling entry under issue #13163. That entry is not part of this change and kb/disorders/STIM1_Deficiency.yaml does not yet exist, so the pointer deliberately names the MONDO identifier only and makes no claim about a curated file.

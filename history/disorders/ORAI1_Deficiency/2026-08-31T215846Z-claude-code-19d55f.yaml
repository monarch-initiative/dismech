  summary: 'Create: ORAI1 Deficiency (combined immunodeficiency due to CRAC channelopathy)'
  details: |
    De-novo curation of combined immunodeficiency due to ORAI1 deficiency (MONDO:0013007) resolving curation claim #10296, which replaced claim #10291 after autosomal dominant brachyolmia turned out to be already curated. The pathograph runs biallelic ORAI1 loss of function -> loss of CRAC channel pore function -> abolished store-operated calcium entry, then branches into four organ arms: calcineurin/NFAT transcriptional failure (the immune arm), skeletal muscle calcium handling, ameloblast enamel mineralization, and sweat gland secretion. The immune arm is deliberately modelled as a defect of lymphocyte function rather than development - patients have normal T, B and NK counts and the defect appears on stimulation - which is what separates this from the classical T-negative severe combined immunodeficiencies it is usually grouped with. Autoimmunity is routed through reduced invariant NKT and regulatory T cell numbers rather than asserted directly. The sweat gland edge is marked INDIRECT_KNOWN_INTERMEDIATES because the cellular step has not been measured in patient sweat gland tissue. Three knowledge gaps recorded: why the phenotype is restricted when ORAI1 protein is broadly expressed; whether HSCT leaves the myopathic and ectodermal arms untouched on long follow-up; and whether the autoimmunity is Treg-loss-driven or an independent consequence. The Orai1 null mouse is linked as PARTIALLY_RECAPITULATES with the caveat that its reported male-infertility phenotype has no observable human counterpart because ORAI1-null patients rarely reach reproductive age. Deep research: one OpenScientist run, committed; preflight-dr PASS (ORAI1=59 mentions, OMIM 612782 matching), 13/13 references resolved and 11/13 on topic. It contributed the HLH presentation (PMID:28633876) and the ORAI1 gain-of-function contrast with tubular aggregate myopathy and Stormorken syndrome (PMID:26469693), the latter now recorded in notes so a future curator does not merge the two faces of this gene. Two term errors caught in curation: NCIT device-versus-action confusion was avoided by binding clinical actions only, and HP:0012311 was rejected by linkml-term-validator as Increased total monocyte count - the correct hemophagocytosis term is HP:0012156. Validated with just validate (29/29 snippets verified), just validate-terms, check-entity-refs, check-enum-values, check-snippet-length and check-folded-hyphens.

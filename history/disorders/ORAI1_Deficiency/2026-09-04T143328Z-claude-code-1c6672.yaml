  summary: 'Review response: pathograph, autoimmunity frequency dispute, IUIS sourcing'
  details: |
    Four review-response sessions on PR #10306, following the CREATE record. Round 1 connected all phenotypes to the pathograph with bare-name downstream targets. Round 2 added GO:0002369 T cell cytokine production and committed the derived cache rows, and gave the Autoimmunity node two REFUTE items alongside its SUPPORT pair, since PMID:26469693 and PMID:20004786 both report a much lower frequency than the Lian 2018 series. Round 3 rewrote the Autoimmunity description, which had called immunodeficiency-with-autoimmunity characteristic of the CRAC channelopathies, the exact sentence its own REFUTE items argue against. Round 4 corrected an error that rewrite introduced: it described the 1-of-7 and 1-of-6 counts as two independent cohorts, when they are the same patient. PMID:20004786 states its six patients represent all ORAI1 patients known at the time, so it is a census rather than a sample; PMID:26469693's denominator of seven is those six plus one later patient; and both numerators are McCarl's P4. The description now says the series published up to 2015 record the same single autoimmune patient while Lian 2018 reported three, which is an early near-complete census disagreeing with a later series rather than a two-against-one vote. The same round added the review's own hedge that small patient numbers and early mortality may censor the observation rather than establish a low rate, carried that caveat into the STIM1 paragraph in notes, and sourced the IUIS syndromic-CID assignment to the ORAI-1 row of Table 2 in the cached PMID:35748970 rather than leaving it as an inference from the phenotype. Validated with just validate (34 of 34 snippets verified), validate-terms, check-entity-refs, check-duplicate-keys, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading.

  details: |
    New entry for SIFD (MONDO:0014487, TRNT1) from claim issue #16698. Deep research: one OpenScientist report (research/Sideroblastic_Anemia_B-Cell_Immunodeficiency_Periodic_Fevers_and_Developmental_Delay-deep-research-openscientist.md; 21/21 references resolved), used as leads only; every claim was re-anchored to a fetched abstract in references_cache (17 cited PMIDs plus the ClinGen CGGV record; PMID:41019077 is mentioned in notes only). No GeneReviews chapter exists (check-genereviews --online, NO_CHAPTER). Lump/split: ClinGen's TRNT1 validity record lumps SIFD with retinitis pigmentosa and erythrocytic microcytosis (OMIM 616959); MONDO keeps MONDO:0014850 separate, so the entry is scoped to SIFD and RPEM is an allelic differential; RPEM's own stub was left in place. HP:0003111 is bound with the label from cache/hp/terms.csv (Abnormal blood ion concentration), which term validation requires; the current HPO label is Abnormal circulating electrolyte concentration. Validated with just validate, count-verified-snippets (111/111), validate-terms, the whole-repo offline gates and validate-disorders.

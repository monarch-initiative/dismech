  summary: 'Create: Mitochondrial Complex II Deficiency, Nuclear Type 3 (SDHD)'
  details: |
    Curated recessive SDHD-related isolated complex II deficiency (MONDO:0030937) from the three primary case reports (Jackson 2014 PMID:24367056; Alston 2015 PMID:26008905; Lin 2021 PMID:34012134) and the Fullerton 2020 review (PMID:33162331). Pathograph: SDHD loss and impaired complex II assembly -> impaired succinate oxidation and electron transfer -> bioenergetic failure -> encephalomyopathic and cardiomyopathic phenotypes, with Krebs-cycle intermediate excretion and decreased complex II activity linked directly to the enzymatic node. No treatment has been reported for SDHD patients, so treatments are left empty with a KNOWLEDGE_GAP discussion; a second discussion records the unknown tumour risk of heterozygous carriers. No GeneReviews chapter exists (just check-genereviews: NO_CHAPTER). Validated with just validate-disorders (31/31 snippets), validate-terms, and the offline gates. Claim: monarch-initiative/dismech#14954.

  summary: 'Create: Mitochondrial Complex II Deficiency, Nuclear Type 3 (SDHD)'
  details: |
    Curated recessive SDHD-related isolated complex II deficiency (MONDO:0030937) from the three primary case reports (Jackson 2014 PMID:24367056; Alston 2015 PMID:26008905; Lin 2021 PMID:34012134) and the Fullerton 2020 review (PMID:33162331). Pathograph: SDHD loss and impaired complex II assembly -> impaired succinate oxidation and electron transfer -> bioenergetic failure -> encephalomyopathic and cardiomyopathic phenotypes, with Krebs-cycle intermediate excretion and decreased complex II activity linked directly to the enzymatic node. No treatment has been reported for SDHD patients, so treatments are left empty with a KNOWLEDGE_GAP discussion; a second discussion records the unknown tumour risk of heterozygous carriers. No GeneReviews chapter exists (just check-genereviews: NO_CHAPTER). Review round 1 (PR monarch-initiative/dismech#14956): added Hirschsprung disease (one biopsy-confirmed patient, left unlinked), a note on the HCM/LVNC binding, a citation for the riboflavin rationale (Bugiani 2006, PMID:16737791, genotypes unstated), and GO:0008177 on the SDHD node for the gene-grounding gate. An OpenScientist deep-research report was run and committed under research/. It found no SDHD patients beyond the three case reports already cited and missed two of them (Alston 2015, Lin 2021); most of its phenotype list is extrapolated from SDHA/SDHB patients and was not added. Its one SDHD-specific addition, the Sdhd knockout mouse (PMID:15572694, homozygous embryonic-lethal), was added as an animal model that fails to recapitulate the human disease. Validated with just validate-disorders, validate-terms, and the offline gates. Claim: monarch-initiative/dismech#14954.

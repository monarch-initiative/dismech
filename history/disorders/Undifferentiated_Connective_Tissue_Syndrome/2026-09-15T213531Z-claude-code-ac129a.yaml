  summary: 'Create: Undifferentiated Connective Tissue Syndrome (UCTD)'
  details: |
    De novo curation of MONDO:0019527 from a Perplexity sonar-deep-research report (research/Undifferentiated_Connective_Tissue_Syndrome-deep-research-perplexity.md). Report preflight (just preflight-dr) returned SKIP because MONDO records no causal gene for this concept, so the entity check was done manually against the reference list and the report's disease vocabulary; no wrong-entity citation was found in this report, unlike the other four in this run. The report's term validation failed at generation time on a transient EBI read timeout and was retro-fitted afterwards with just validate-research-terms; that pass flagged two wrong bindings the report had offered, HP:0030058 (Sickled erythrocytes) presented as 'positive antinuclear antibody test' and HP:0005421 (Decreased circulating complement C3 concentration) presented as 'anticardiolipin antibody positivity', neither of which was used. The report supplied 5 resolvable PubMed identifiers for a 93 KB document; the reference set was rebuilt from PubMed: PMIDs 10544849, 12846049, 24917564, 27979657, 28245862, 36884206, 38670557, 41670330, 37451812. Curated as a Disease rather than a pre-disease state on the natural-history evidence, with the argument recorded in review_notes because the literature itself treats the question as open. Pathophysiology is deliberately five nodes and stops at endothelial injury: only the type I interferon signature and endothelial activation are supported by measurements made in UCTD patients specifically, and there is no consistent target organ downstream. The interferon node is not placed upstream of differentiation because the same study shows differentiation occurs at normal and high interferon scores alike. Differentiation fractions from four cohorts (11.3%, 20.2%, 28%, 34.5%) are quoted with their sources rather than averaged. One phenotype, nailfold capillary abnormality, is left without an HP binding because HPO has no term for the non-specific capillaroscopy pattern the source reports. Validated: just validate-disorders (schema, terms and references, batched) passed, 33/33 snippets verified, check-entity-refs, check-causal-targets and check-duplicate-keys all OK. One snippet initially failed on bracketed statistics inside the quoted sentence and was replaced with the multivariate sentence from the same abstract.

  details: |
    Addressed the ai4c-reviewer changes-requested review on PR #11895 in one push. The Nailfold Capillary Abnormality phenotype was supported by a sentence naming SSc, MCTD and aPS and not UCTD, which supported neither its presence nor its OCCASIONAL frequency; replaced with the two sentences in the same cached paper that give UCTD rates directly - 18% scleroderma-like pattern and 4% scleroderma pattern - and updated the description to carry those numbers. The Sicca Symptoms phenotype asserted dry eyes and dry mouth while binding an ocular-only HP term with ocular-only Schirmer evidence; added the PMID:41670330 sentence naming sicca symptoms directly as the presence evidence, moved the Schirmer sentence to a second item with directness INDIRECT for the prognostic claim it actually supports, and recorded in the description that HPO has no combined sicca term so the binding is narrower than the name. Softened Arthralgia from VERY_FREQUENT to FREQUENT and rewrote both list-derived explanations, which had reasoned from an item being named first in an unordered list. Added a Serositis phenotype bound to HP:0045073 from a sentence already quoted in the file. Merged origin/main for the quote_role slot and graded the two review articles per sentence rather than per paper: pooled-cohort-data sentences become HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS, while the authors' own framing and recommendation sentences stay OTHER with the same quote_role, since they report no data to classify. Recorded the haematologic gap in review_notes as needing a fetch. Snippets 33/33 to 36/36; all structural gates clean.

  summary: Added upstream monogenic vascular remodeling pathophysiology nodes with NF1/JAG1/ELN/GATA6/RNF213
    and GO bindings, plus inheritance, incidence, onset progression, differential diagnoses, and datasets
    for congenital RAS.
  details: Added two upstream molecular pathophysiology nodes (NF1-Deficient Ras-MAPK Vascular Remodeling
    Defect and Monogenic Arterial Morphogenesis and Matrix Remodeling Defects) with HGNC gene terms (NF1,
    JAG1, ELN, GATA6, RNF213) and GO molecular functions (GO:0005096, GO:0005112, GO:0005201, GO:0003700)
    feeding into Developmental Renal Arterial Narrowing, and updated genetic associations to Causative.
    Added Harrison's classifications, autosomal dominant and sporadic inheritance, pediatric renovascular
    hypertension incidence (1.9 per million children/year), infancy/childhood onset progression, differential
    diagnoses (fibromuscular dysplasia, Takayasu arteritis, aortic coarctation), three pediatric cohort
    datasets, and top-level references.

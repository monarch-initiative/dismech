  summary: >-
    Review and compliance enhancement of Congenital_Renal_Artery_Stenosis with
    verified literature evidence across inheritance, prevalence, progression,
    atomic gene-specific pathophysiology nodes, phenotypes, genetics, and
    differential diagnoses.
  details: >-
    Added autosomal dominant and sporadic inheritance (PMID:29483232), pediatric
    incidence (PMID:26437121), childhood onset progression (PMID:29635838,
    PMID:29483232), atomic gene-specific upstream pathophysiology nodes for NF1
    (with intermediate arterial intimal thickening and elastic lamina disruption
    from PMID:34476477), JAG1, ELN, GATA6, and RNF213 (PMID:29483232), rebound
    Renovascular hypertension to HP:0100817 and Kidney atrophy to HP:0008717, set
    single-family genes GATA6 and RNF213 to Candidate association, and added
    differential diagnoses (Fibromuscular Dysplasia, Takayasu Arteritis,
    Coarctation of the Aorta / Midaortic Syndrome).

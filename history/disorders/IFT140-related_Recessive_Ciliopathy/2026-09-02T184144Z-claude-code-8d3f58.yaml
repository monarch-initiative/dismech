  summary: Anchor Syndromic Conorenal subtype to MONDO:0009964 and add SRTD9 material
  details: |
    This session originally created a separate kb/disorders/Short-Rib_Thoracic_Dysplasia_9_With_Or_Without_Polydactyly.yaml entry for MONDO:0009964. That was a duplicate: IFT140-related_Recessive_Ciliopathy already covers biallelic IFT140 disease and its Syndromic Conorenal subtype is the same concept, as the PR reviewer established. The duplicate preflight missed it because I searched the MONDO ID and the disease label but never the causal gene against kb/disorders, so an entry curated under a gene-first name was invisible to the check. The new entry has been deleted and its content folded here instead. Four changes: the Syndromic Conorenal subtype now carries subtype_term MONDO:0009964, which fills a gap the entry documented about itself (its description previously stated that no non-obsolete MONDO leaf term anchored this pole); a Polydactyly phenotype (HP:0010442) was added with the variability caveat that the 'with or without polydactyly' qualifier records; the Cauli Ift140 ENU mouse was added as an animal_models entry with modeled_mechanisms linked to the IFT-A transport node, RECAPITULATES at MODERATE fidelity, with limitations recording that homozygous mid-gestation lethality means it cannot report on the postnatal renal and retinal course; and an INTERPRETATION discussion records the scope boundary against the monoallelic IFT140 ADPKD phenotype, which shares the gene but is a different disease, together with the IFT140/PKD1 locus proximity that causes diagnostic confusion. The mild-chest-narrowing PMID:23418020 evidence the reviewer also listed was already present on the Thoracic Hypoplasia phenotype and was not duplicated. Validated with just validate (37/37 snippets verified, term validation passed), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms and check-folded-hyphens.

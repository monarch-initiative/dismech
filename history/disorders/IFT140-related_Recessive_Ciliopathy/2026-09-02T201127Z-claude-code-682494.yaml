  summary: Add the exons 27-30 tandem duplication caveat to molecular diagnosis
  details: |
    Follow-up on PR #10594, addressing the one reviewer finding that survived the
    fold as a real gap in the target entry.

    The reviewer flagged Sharova 2023 (DOI:10.3390/genes14081553) as the most
    consequential of the uncited reference caches this PR commits: it reports a
    recurrent IFT140 exons 27-30 tandem duplication that panel and exome sequencing
    miss, and the entry's molecular diagnosis block said only "molecular genetic
    testing" with no CNV caveat. In both of Sharova's patients only one pathogenic
    variant was found by first-line NGS; the second allele was recovered by genome
    sequencing in one and by targeted screening for the same duplication in the
    other. The diagnosis description now says that a single pathogenic variant on
    panel or exome sequencing does not exclude the diagnosis, and two evidence items
    from that paper carry the claim.

    In my PR body I had offered to do this as a separate PR since it is a
    pre-existing gap rather than something the fold introduced. Doing it here
    instead, because it is a two-item additive edit to a block this PR already
    amends and it converts a committed but uncited cache into a cited one, which was
    the reviewer's other complaint about the same file.

    Not done: HP:0000894 short ribs. The subtype this PR anchors is named short-rib
    thoracic dysplasia 9, so the phenotype is an obvious candidate, but no cached
    source states short ribs as an IFT140 finding. PMID:23418020 mentions the short
    rib-polydactyly spectrum only in discussing allelism between ciliopathy genes,
    and describes these patients' own thoracic finding as mild chest narrowing,
    which the entry already carries as Thoracic Hypoplasia (HP:0005257). Adding a
    short-rib phenotype would need a source that states it.

    The remaining ten DOI caches stay. Each is cited between two and nine times by
    the deep-research report committed in this PR, so dropping them would leave the
    report's own citations unbacked.

    Two reference caches, PMID_22503633.md and PMID_26359340.md, picked up
    incidental metadata rewrites from running the validator (a full_text_attempted
    flag and a quoting change). They were reverted rather than committed, so
    references_cache/ still carries only additions.

    Validation: just validate passes with 37/39 snippets verified; the two skipped
    are the new DOI items, both confirmed by hand as exact substrings of
    references_cache/DOI_10.3390_genes14081553.md. check-entity-refs,
    check-causal-targets, check-duplicate-keys, check-enum-values,
    check-qualifier-terms, check-folded-hyphens and the four ratcheted checks against
    origin/main all pass.

    Note on this record: it was first committed with the scaffold's unfilled placeholder token as its details
    body. The scaffolding script nests details under events:, and the script used to
    fill it matched only a top-level key, so it silently wrote nothing. Filled in
    place before merge.

  details: |
    LOINC tranche F batch 2. This entry has no diagnosis: section at all (a structural gap shared by all 21 biomarker-stratum entries in this tranche per the coordinator's observation), so used the biochemical[].loinc_term route rather than inventing a new diagnosis row. The single existing 'HER2 Testing (IHC and FISH)' biochemical marker bundled two genuinely different tests with different thresholds and regulatory status into one row, which Biochemical.loinc_term (a singular slot) cannot represent. Split it into two rows: 'HER2 Protein Overexpression (IHC)' bound to LOINC:85319-2 (HER2 [Presence] in Breast cancer specimen by Immune stain) and 'ERBB2/HER2 Gene Amplification (FISH)' bound to LOINC:49683-6 (ERBB2 gene copy number/Chromosome 17 copy number in Tissue by FISH). Deliberately did not add reference_ranges/interpretation_bands for the IHC 0/1+/2+/3+ score or the FISH ratio >= 2.0 cutoff: LOINC has no distinct ordinal score code for the IHC grading (only a binary presence code and an excluded [Interpretation] narrative code), and no cached reference in this entry's evidence quotes either threshold with an exact citation to attribute a band to -- inventing one would have been exactly the 'derive a band the source doesn't state' error the campaign prohibits. Both codes newly seeded. just validate-disorders, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-causal-targets, and tests/test_loinc_measurement_schema.py all pass.

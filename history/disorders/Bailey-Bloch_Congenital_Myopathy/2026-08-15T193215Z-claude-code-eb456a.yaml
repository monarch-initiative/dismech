  summary: 'Create: Bailey-Bloch Congenital Myopathy (STAC3, MONDO:0009722)'
  details: |
    De novo curation of Bailey-Bloch congenital myopathy (STAC3 disorder / Native American myopathy / CMYP13).

    Deep research: claude_code provider via `just research-disorder claude_code Bailey-Bloch_Congenital_Myopathy`. The report was then reference-validated in place with `just validate-research-reference`: 15/15 references resolved, 0 unresolved; 3 quoted claims could not be matched to their cited sources, and none of those quotes were reused in this entry.

    NEC check: the report itself flagged X-linked myotubular myopathy as the likely wrong-entity resolution for this disorder name, and the entry records that hazard in notes and differential_diagnoses. One report citation was wrong on verification -- PMID:30178658 was cited for the Zaharieva 2018 Hum Mutat cohort but resolves to an unrelated solid-state solar-cell paper. The correct identifier PMID:30168660 was located via PubMed and is what the entry cites; the substitution is recorded in the entry notes.

    GeneReviews baseline: a chapter exists (PMID:31219695, STAC3 Disorder). It was fetched, used as the phenotype baseline, tagged GeneReviews in the top-level references block, and its Agents/Circumstances to Avoid content is reflected in the anaesthetic-avoidance treatment.

    Curated content: a six-node pathophysiology chain from biallelic STAC3 loss of function through failed CaV1.1 triad assembly to defective excitation-contraction coupling, with a parallel malignant-hyperthermia branch and a hedged skeletal-muscle lipid branch; 15 phenotypes with HPO bindings and cohort-derived frequency bands; genetic (including the reframing of c.851G>C from a Lumbee founder allele to one of probable African origin); an environmental anaesthetic-trigger entry linked into the pathograph via influences_mechanisms; six treatments; diagnosis; three differential diagnoses; three zebrafish models with modeled_mechanisms, fidelity and limitations; and two discussions recording the unresolved STAC3-CaV1.1 interaction paradox and the unknown MH trigger mechanism.

    Validation: `just validate` passed (schema, terms, references). `just count-verified-snippets` reported 60/60 verified against cached references. `just check-title-snippets` reported no new title-quoting snippets. Compliance 89.5% (weighted 89.9%). No datasets block was added: dataset relevance triage for an ultra-rare myopathy is a manual step that was not performed, and a bulk record was preferred absent over unverified.

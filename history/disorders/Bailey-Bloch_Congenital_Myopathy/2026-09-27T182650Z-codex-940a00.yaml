  summary: Review STAC3 clinical spectrum, mechanisms, models and care using cached full texts
  details: |
    Eligibility and scope: biallelic STAC3 congenital myopathy (MONDO:0009722; OMIM:255995), also called Native American myopathy/CMYP13. Both previous histories were CREATE/EDIT, with no REVIEW. This is a Mendelian disorder; anesthesia-triggered malignant hyperthermia is a complication, not an environmental disease. The branch was rebased onto origin/main before editing (116b24e6501970a6051d279bacdbf4d518380d5b). Named-entity and GeneReviews preflight passed. Research and its citation sidecar were read and compared against the entry; the research's erroneous PMID:30178658 was not propagated (the international STAC3 cohort is PMID:30168660).

    Content-completeness review:
    1. Phenotypes — adequate after expansion from 15 to 58. Added weakness, muscle bulk, reflex, developmental, growth, respiratory, hearing, craniofacial and musculoskeletal findings using cohort tables and GeneReviews. Separated cleft from any palatal abnormality, kyphoscoliosis from any spinal abnormality, and restrictive physiology from nonspecific respiratory distress. Corrected ptosis, cryptorchidism and neonatal-hypotonia denominators. Added genu recurvatum, retrognathia and later respiratory distress in the final cross-check. Available-case counts are cohort-specific; cohorts may overlap. Rare isolated ASD/PDA and nonspecific skin/chest composites are nonblocking secondary findings, not assumed to define causal STAC3 manifestations. No common, specifically characterized research phenotype was intentionally left out.
    2. Subtypes — N/A: no established mechanistically distinct STAC3 subtypes surfaced. King-Denborough is an overlapping clinical presentation, not a separate STAC3 molecular subtype. No artificial ancestry-based subtypes or severity subdivisions were created.
    3. Mechanisms — adequate. Distinguished reduced junctional CaV1.1 abundance from loss of SH3-dependent coupling enhancement; patient-biopsy complex association does not establish every interface is intact. Qualified hypomorphic versus null effects and preserved early versus later abnormal muscle structure. Added clinically supported distal phenotype links without turning co-occurrence into established causality. The abundance-to-coupling edge is explicitly an inference with unknown directness. Lipid accumulation remains hypothetical and the anesthetic-trigger mechanism provisional. Trigger avoidance was removed as a claimed molecular inhibition of susceptibility. Models now include six animal and five cell/isolated-fiber systems, with genotype, assay and translational limits.
    4. Treatments/trials — adequate. Added acute dantrolene, ventilation, cough assistance, occupational therapy, speech/swallowing management and specific surveillance schedules. Full GeneReviews supports contracture, orthopedic, feeding and ptosis care. No disease-specific Phase II-or-later treatment was identified in the bounded search. NCT02055248 is a broad completed observational facial-weakness study; a STAC3 paper is listed as background and does not prove cohort enrollment, so it was not added as a STAC3 trial. Other broad neuromuscular observational candidates do not establish STAC3-specific interventions. MTM1/ASPIRO NCT03199469 is out of scope. Engineered SH3-domain rescue remains an experimental model, not clinical therapy.
    5. Genetics — adequate. Seven structured variants cover recurrent missense, splice-altering, nonsense, frameshift and in-frame deletion alleles. Reported cDNA effects are distinguished from predictions. Asp279del remains UNCERTAIN_SIGNIFICANCE as explicitly classified in Table 1, despite stronger causal language in the discussion. Pathogenic labels reflect cited author/review classifications, not a new independent ACMG assessment. Founder origin is a hypothesis; reported non-Lumbee families do not prove a universal shared haplotype. No validated modifier or genotype-severity correlation was identified.
    6. Diagnostics/prognosis — adequate. Molecular confirmation, CK limitations, potentially normal EMG, nonspecific biopsy, pulmonary/sleep assessment and multidisciplinary follow-up are represented. Selected laboratory diagnostic yield is not population screening yield. Added heterogeneous clinical trajectories and historical mortality, explicitly not a contemporary all-population survival estimate or MH fatality rate. The Lumbee 1/5000 estimate is described as birth prevalence in the Southern African paper but as an individual-population estimate in GeneReviews; this source-definition difference is disclosed. Southern African birth prevalence is a carrier-frequency prediction with the published uncertainty range.
    7. References — adequate. All added evidence items carry titles checked against generated cache metadata. URL/PDF cache titles are the extraction URLs; explanations identify the chapter/manuscript. PMID:3631569 remains bibliographic provenance only because no quotable abstract/full text was retrieved. Exact excerpts were checked with the repository validator. GeneReviews evidence spans clinical characteristics, diagnosis, management, inheritance/recurrence and avoidance; review-synthesis quotations are explicitly marked.
    8. Overall consumption — adequate. Major research themes, full-text clinical detail, experimental models and important source limitations are incorporated. Speculative gene-therapy programs, bulk lipid measurements as proof of human muscle lipotoxicity, and unverified clinical-trial enrollment were not promoted to established disease claims.

    Sources consumed: full scientific text for PMIDs 38824262, 37626540, 39966651 (including regenerated tables and final discussion), 40262809, 40779452, 23736855, 27073615, 28777491 and 38088138; the full accepted manuscript for PMID:30168660 recovered from UCL; and the entire GeneReviews PDF recovered via NCBI /sites/books/NBK542808/pdf/Bookshelf_NBK542808.pdf. Abstracts for PMIDs 31219695, 28003463, 39592070, 23818578 and 36030003 were also consumed. Core sources were checked for public dataset accessions; no suitable disease-specific GEO/BioProject accession was identified in those sources. Targeted cDNA/qPCR and supplementary numerical measurements were not misrepresented as deposited transcriptomic datasets.

    Full-text recovery limits: the 2017 PNAS source (PMID:28003463) remained abstract-only after PMID/DOI retries and PMC/EuropePMC/publisher recovery attempts. The retrieved abstract does not verify a genomic knock-in. The lipid-study publisher route was inaccessible, so PMID:39592070 claims remain limited to its abstract; muscle localization and causal mediation are not inferred from bulk neutral lipid. PMID:23818578 remained abstract-only. Failed CAPTCHA cache attempts and an unused DOI/clinical-trial cache are excluded from the PR. All committed reference caches were generated using fetch-reference; none were hand-edited.

    Material source issues: the mixed RYR1/STAC3 cohort (PMID:39966651) has inconsistent genotype and phenotype counts across prose/tables; its pooled denominators were not assigned to STAC3 and its carrier-frequency/prevalence arithmetic was not adopted. The Southern African CK account names 16 normal and four raised values among 21 measurements, leaving one unexplained. Patient-cell calcium physiology in the 2018 paper comes from one compound-heterozygous culture, not all biopsied patients. The 2016 inducible mouse uses CAG-Cre/Esr1, not a muscle-specific driver, retains residual protein and does not show statistically significant CaV1.1 reduction. The 2013 zebrafish transgene rescue is mosaic expression in a null background, not genomic knock-in. The 2025 engineered SH3 rescue is in cultured myotubes, not treatment of patients or animals.

    Prior process notes removed from disease YAML are archived verbatim below. They describe the pre-review state; in particular, full GeneReviews recovery and dataset triage were subsequently completed as documented above.

    Naming and identity. This entry is filed under the MONDO label "Bailey-Bloch congenital myopathy" but the same disorder appears in the literature as Native American myopathy (NAM), STAC3 disorder, and congenital myopathy 13 (CMYP13). Curators and search tools should treat all four as the same entity.
    Two disambiguation hazards are worth recording. First, X-linked myotubular myopathy (MTM1) is a superficially similar severe congenital myopathy and is a common wrong resolution for name-based searches; it is X-linked, has no malignant hyperthermia association, and is the subject of a gene-replacement programme that has nothing to do with this disorder. Second, the deep-research report used to seed this entry cited "PMID:30178658" for the Zaharieva et al. 2018 Human Mutation cohort. That identifier resolves to an unrelated solid-state solar-cell paper; the correct identifier is PMID:30168660, which is what this entry cites. The report's own reference-validation pass did not catch it, because the wrong PMID does resolve to a real article — a reminder that "reference resolved" is not "reference correct".
    The 1987 Bailey and Bloch case report (PMID:3631569) that gives the disorder its eponym has no abstract in the cached record, so it is listed under references for provenance only and carries no evidence snippet.
    Two things a reader may expect and will not find. There is no `progression:` section: the frequently quoted figure of 36% mortality by age 18 appears in the GeneReviews full text and in the discussion of the original zebrafish paper, but not in either cached abstract, so it is not snippet-quotable and is deliberately omitted rather than cited to a source that does not contain it. And no `datasets:` block is present, because dataset relevance triage is a manual step that was not performed for this entry.
    Scope. Malignant hyperthermia susceptibility is curated here as a feature of this disorder. Non-syndromic malignant hyperthermia susceptibility, where STAC3 appears as a qualified susceptibility gene alongside RYR1 and CACNA1S, is curated separately in Malignant_Hyperthermia_of_Anesthesia.

  summary: 'Review: connect nine orphan phenotypes (IUIS Table 6)'
  details: |
    Nine of 32 phenotypes had no incoming edge; all nine now attach.

    The dental findings are the mechanistically interesting ones: teeth cannot erupt through sclerotic unresorbed bone, because eruption depends on the osteoclast-mediated resorption this disease abolishes. Caries is drawn from the same node as INDIRECT_UNKNOWN_INTERMEDIATES, since the source groups the dental findings without separately establishing the route.

    Proptosis is drawn from the sclerosis node as the orbital counterpart of the foraminal narrowing that compresses cranial nerves. Nystagmus is drawn from the cranial nerve compression node as a consequence of the optic neuropathy rather than as an independent ocular finding.

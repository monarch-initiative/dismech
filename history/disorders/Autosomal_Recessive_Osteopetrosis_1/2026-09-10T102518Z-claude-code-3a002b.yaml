  details: |
    Round 2 on PR #11561. All four items were correct. A: recombinant human interferon gamma-1b carried therapeutic_modality SMALL_MOLECULE, which the schema defines as orally or parenterally administered chemical drugs. IFN-gamma-1b is a recombinant cytokine. Changed to PROTEIN_REPLACEMENT, which is the established KB convention for recombinant protein biologics; verified against 3-M_Syndrome, where somatropin carries PROTEIN_REPLACEMENT, and it is the same value I used for growth hormone in the SPONASTRIME entry in this batch, so the inconsistency was internal to my own work in one sitting. B: the clinicaltrials NCT04525352 evidence item had no reference_title while every other new item in the diff did; added, copied from the cache frontmatter. C: the PMID:39314524 evidence item on the clinical trial was graded HUMAN_CLINICAL. The reviewer is right that evidence_source classifies the cited publication, and that publication is an oc/oc mouse gene-therapy study whose quoted sentence is background about a trial run by others, so it is neither that paper's model-organism result nor human data it generated. Regraded OTHER, with the explanation stating the reasoning. This is the second evidence_source error on the same PMID in two rounds, both in the same direction, which is worth noting: I was grading by what the sentence describes rather than by what the publication is. D: added Carious teeth HP:0000670, which the same already-quoted GeneReviews sentence names alongside delayed tooth eruption. Re-validated with just validate, just validate-terms, just check-entity-refs, just check-causal-targets, just check-enum-values, just check-snippet-length and just validate-disorders; 84/96 snippets verified.

  details: |
    Review round 3 on #12006, prose only; no evidence, bindings, or membership changed.

    Intrinsic_and_Innate_Immunity_Defect_IEIs description and grouping_rationale previously defined the grouping by narrow susceptibility to a single pathogen class, which excluded its own new member: ARO1's lesion is in the osteoclast, with no pathogen restriction. Amended both to state that the grouping covers IUIS Table 6 as a whole, that sections 1-7 are the pathogen-restricted reading, and that section 8 collects cell-intrinsic defects confined to a non-hematopoietic tissue. The NECESSARY criterion's description was widened the same way for consistency; its logic (HAS_CLASSIFICATION on iuis_category) is unchanged and all 3 members remain SATISFIED.

    Inborn_Errors_of_Immunity carried a stale sentence naming an 'Autosomal Recessive Osteopetrosis Type 2' entry as the one classified. Verified against the tree: no entry of that name exists, ARO2 is stubs/Autosomal_Recessive_Osteopetrosis_2.yaml, and the entry classified is ARO1 (TCIRG1, MONDO:0009815). Corrected, since the same bullet lists TNFSF11 three lines above and a reader would otherwise conclude the TNFSF11 entity was classified.

    iuis_category.notes reworded so the quotation marks attach the section 8 heading to section 8 rather than to Table 6. Verified both headings in references_cache/PMID_35748970.md: line 3124 'Table 6  Defects in intrinsic and innate immunity', line 3404 '8. Other Inborn Errors of Immunity Related to Non-Hematopoietic Tissues'.

    Validated: just validate (97/97 snippets verified), validate-grouping on both groupings, check-groupings (3/3 SATISFIED), check-enum-values, check-duplicate-keys.

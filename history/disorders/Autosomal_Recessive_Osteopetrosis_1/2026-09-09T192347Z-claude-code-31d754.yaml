  summary: Repoint to MONDO:0009815 and expand TCIRG1 osteopetrosis curation
  details: |
    Curation for claim #11552 (autosomal recessive osteopetrosis 1, MONDO:0009815). Preflight found the KB already held this disease's content under the wrong identifier: kb/disorders/Autosomal_Recessive_Osteopetrosis.yaml was named 'Autosomal Recessive Osteopetrosis Type 2' and bound to MONDO:0009816, whose MONDO definition is the TNFSF11 disease, while its description, all four pathophysiology nodes, its prevalence record and every phenotype explanation were about TCIRG1. Rather than add a second TCIRG1 entry, the existing file was renamed to Autosomal_Recessive_Osteopetrosis_1.yaml and repointed to MONDO:0009815; issue #11558 records the defect and the validation gap that let it through. The TNFSF11 genetic record, which a ClinGen sweep had matched to the entry by its (wrong) MONDO ID, was removed, and stubs/Autosomal_Recessive_Osteopetrosis_2.yaml was added so the TNFSF11 disease returns to the curation queue rather than disappearing with the rename. Enhancement used one OpenScientist deep-research report (research/Autosomal_Recessive_Osteopetrosis_1-deep-research-openscientist.md; 17/17 references resolved, 19/19 quotes verified) plus the TCIRG1-Related Osteopetrosis GeneReviews chapter (PMID:40875877) as the phenotype baseline. Added: an HGNC-bound TCIRG1 genetic record with the variant-spectrum evidence; a fifth pathophysiology node for the failure of skeletal calcium mobilization that produces hypocalcaemia, secondary hyperparathyroidism and osteopetrorickets; biological_scale tags on all five nodes; three phenotypes (Rickets, Secondary hyperparathyroidism, Extramedullary hematopoiesis); two animal models (Atp6i knockout and oc/oc) with modeled_mechanisms, readouts and limitations; and a rewritten treatments block. The report's suggested HP:0002690 for pathological fractures is Large sella turcica and was not used; every HP, GO, CL and NCIT CURIE in the entry was resolved through OLS at the point of writing. The report's NCIT suggestions for interferon gamma-1b (C1032) and calcitriol (C328) were also wrong and were replaced by lookups. The HSCT treatment term was corrected from NCIT:C15289 (Organ Transplantation, modality SURGERY) to NCIT:C15431 (Hematopoietic Cell Transplantation, modality CELL_THERAPY). Validated with just validate, just validate-terms, just check-entity-refs, just check-causal-targets and just validate-disorders.

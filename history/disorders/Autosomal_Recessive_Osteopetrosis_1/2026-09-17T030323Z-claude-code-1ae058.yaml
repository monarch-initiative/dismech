  summary: Classify as IUIS innate-immunity defect and add to Table 6 grouping (#11879)
  details: |
    Added classifications.iuis_category: innate immunity defect, citing IUIS 2022 update (PMID:35748970) Table 6 section 8, with a byte-verified quote of the TCIRG1 row. All seven IUIS Table 6 osteopetrosis genes (CLCN7, SNX10, OSTM1, PLEKHM1, TCIRG1, TNFRSF11A, TNFSF11) are autosomal recessive, matching this entry's TCIRG1 (ARO2) etiology. Also added this entry as a member of kb/groupings/Intrinsic_and_Innate_Immunity_Defect_IEIs.yaml. Follow-up from #11810's review (parked in #11879 rather than pushed onto the approved PR).

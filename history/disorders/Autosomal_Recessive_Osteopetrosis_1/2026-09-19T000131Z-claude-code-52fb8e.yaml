  details: |
    Resolved this branch's conflict with main, which had renamed the entry while the branch was open.

    Main renamed kb/disorders/Autosomal_Recessive_Osteopetrosis.yaml to Autosomal_Recessive_Osteopetrosis_1.yaml and repointed it from MONDO:0009816 to MONDO:0009815, because the file's content was TCIRG1 throughout while its identifier and name said TNFSF11 / Type 2 (see issue #11558 and the 2026-09-09 record in this directory). The branch was editing the pre-rename file.

    Three conflicts, resolved to preserve both sides:

    1. kb/disorders: kept main's corrected ISDS note, which explains that the earlier wording naming the TNFSF11 locus was carried over from the incorrect MONDO binding, and kept the branch's new iuis_category block on top of it. The branch's block described the entry as 'the TCIRG1 (ARO2) etiology', which the rename makes wrong twice over - TCIRG1 is autosomal recessive osteopetrosis 1, and TNFSF11 is the ARO2 gene. Corrected to name TCIRG1 as the ARO1 etiology in both the notes and the evidence explanation. The quoted IUIS Table 6 snippet is unchanged and still verifies.

    2. references_cache/PMID_40462430.md: add/add conflict between the branch's abstract_only fetch and main's full_text_html fetch from OpenAlex. Took main's, which is the superset; all 97 snippets still verify against it.

    3. history record: git placed the branch's record in the renamed slug directory. Updated its target.slug and target.path to the renamed entry. This is not a rewrite of merged history - the record is unmerged and part of this PR, and it now names the file the PR actually edits.

    Separately, main's rename left the branch's grouping membership dangling: kb/groupings/Intrinsic_and_Innate_Immunity_Defect_IEIs.yaml added 'Autosomal Recessive Osteopetrosis Type 2' as a member, and no entry by that name exists any more. Repointed the member and its notes to 'Autosomal Recessive Osteopetrosis 1', and updated the unmerged grouping history record to match. The member now evaluates as SATISFIED against the grouping's necessary criterion.

    Validation: just validate passes on the entry with 97/97 snippets verified. just validate-grouping and just check-groupings pass on both touched groupings. check-duplicate-keys, check-entity-refs and check-enum-values clean; validate-history clean on all three touched records.

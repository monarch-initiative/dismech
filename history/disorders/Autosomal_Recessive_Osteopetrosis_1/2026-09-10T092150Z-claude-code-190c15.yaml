  summary: 'Review round 1: mine GeneReviews, add diagnosis, fix a misgraded non-supporting
    snippet'
  details: |
    Round 1 on PR #11561, all six blocking and important findings addressed in one push. CRITICAL finding was correct: PMID:40875877, the TCIRG1-Related Osteopetrosis GeneReviews chapter, was fetched, cached, committed and tagged in the top-level references block, and then cited by no evidence item anywhere in the entry. I treated tagging it as discharging the GeneReviews baseline step when the step is to mine it. It now supports fourteen evidence items across diagnosis, phenotypes, treatments and inheritance. Finding 3 was also correct and is the sharper error: PMID:39314524 was graded HUMAN_CLINICAL on the Extramedullary hematopoiesis phenotype, and its snippet lists dense bones, marrow fibrosis, anemia, hepatosplenomegaly, macrocephaly, deafness and blindness without mentioning extramedullary haematopoiesis at all, so it did not support the claim it was attached to. Replaced with the GeneReviews sentence that names it directly. Worth recording why no gate caught this: check-snippet-grading is keyed on the quoted sentence rather than the PMID, so the same paper carrying HUMAN_CLINICAL on one sentence and MODEL_ORGANISM on two others in the same file is invisible to it, which is the documented behaviour rather than a bug. Added a diagnosis section with three records: molecular confirmation of biallelic TCIRG1 variants including the GeneReviews caveat that a single heterozygous variant does not exclude the diagnosis; skeletal survey with the osteopetrorickets-masking trap; and osteoclast-rich marrow histology, which is the bedside correlate of this entry's central mechanistic claim and what separates the TCIRG1 form from the osteoclast-poor RANK/RANKL forms. Added seven phenotypes above the reviewer's threshold, each bound from a fresh OLS lookup rather than from the research report: short stature, optic atrophy, nystagmus, delayed eruption of teeth, proptosis, hypertelorism and micrognathia. Short stature and nystagmus carry notes declining the mixed-genotype cohort percentages for the same reason the Rickets record does. Added calcium and vitamin D supplementation and optic nerve decompression as treatments, both linked into the pathograph via target_mechanisms to the nodes they address, and added the GeneReviews HSCT indication with its ideally-prior-to-age-ten-months timing threshold and the interferon gamma-1b bridge indication. Inheritance now cites GeneReviews for the 25% sib recurrence risk and for the heterozygous-variant exceptions, the latter recorded because this PR repoints the entry on gene identity. Suggestions taken: removed GO:0006874, a cellular-scale process, from the ORGANISM-scale systemic calcium node; moved the module-conformance reasoning out of the node description into notes, since review_notes is not a slot on Pathophysiology; replaced four snippets that were hard-wrap artefacts stopping mid-sentence with the full sentences; and added clinical_trials NCT04525352, the halted phase I gene-therapy trial, since the entry describes gene therapy as an emerging alternative and its actual state is a discontinued trial. Re-validated with just validate, just validate-terms, just check-entity-refs, just check-causal-targets, just check-enum-values, just check-snippet-length, just check-snippet-grading, just check-title-snippets and just validate-disorders; 83/95 snippets verified, up from 63/75.

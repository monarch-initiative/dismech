  summary: Cite the glucocorticoid withdrawal precipitant
  details: |
    Added evidence to the Glucocorticoid Therapy Withdrawal environmental entry, citing PMID:34283908, which lists withdrawal of glucocorticoid therapy among the main precipitants of adrenal crisis, and PMID:7375407 (PARTIAL) for the background claim that steroid therapy is the commonest cause of secondary (central) adrenal insufficiency and that sudden withdrawal from it precipitates crisis. An earlier draft of this record inverted which half of the entry's claim that source evidences; corrected before merge on review of PR #9733. The crisis risk in patients with established primary disease is carried by PMID:34283908. Part of #8296.

  summary: Bind LOINC paired pre/post-corticotropin cortisol codes and the serum cortisol
    marker code
  details: |
    LOINC Diagnostics tranche G, batch 25 (functional and provocative tests with diagnostic thresholds). Code selection was made against the pinned Tuva LOINC 2.83 export named in data/loinc/MANIFEST.yaml, whose sha256 was verified against the pin, and every candidate set was fully enumerated rather than read off a ranked search page. New cache/loinc/terms.csv rows were seeded by the term validator against the Monarch KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the six changed files reported 526 snippets and 587 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms and check-block-scalar-comments all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound LOINC:41407-8 and LOINC:47850-3 (serum cortisol pre and post dose corticotropin) as the two measurements of the ACTH cosyntropin stimulation test, and LOINC:2143-6 (Cortisol mass per volume in serum or plasma) as the loinc_term of the cortisol marker. Cosyntropin as a string returns nothing in LOINC 2.83; the release names the stimulus corticotropin throughout, which is recorded on the row so the absence is not mistaken for a missing test. The two post-corticotropin stimulation panels in the release were both declined on stated grounds: LOINC:94873-7 is a free-cortisol panel and LOINC:101316-8 pairs cortisol with 17-hydroxyprogesterone for the congenital adrenal hyperplasia question, while this test reads total serum cortisol. The bound pair is left unqualified by dose, route and sampling time because the row fixes no protocol beyond the 250 microgram dose its source names. No reference range was added; no source cited on the entry states a numeric peak-cortisol cutoff. The 21-hydroxylase autoantibody row was left alone as autoantibody work belongs to another tranche.

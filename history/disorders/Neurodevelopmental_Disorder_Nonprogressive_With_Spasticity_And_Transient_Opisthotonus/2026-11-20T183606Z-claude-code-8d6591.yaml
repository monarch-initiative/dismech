  summary: 'Create: neurodevelopmental disorder, nonprogressive, with spasticity and
    transient opisthotonus (TNR)'
  details: |
    Curated from a claude_code deep-research report (the OpenScientist provider timed out twice, at 3600s and 7200s, with no report; the Claude fallback the user authorized returned in 579s with 41/41 references verified and confabulation_rate 0.0). just preflight-dr returned WARN: TNR is named 104 times and OMIM 619653 matches MONDO:0859212, but the report prints HGNC:11953 beside AR on one line, so no gene identifier was copied from it. Every CURIE in the entry was looked up at its source in the step it was written: HP and GO from the committed caches, GO:0072534 perineuronal net and the CHEBI drug terms from OLS, MGI:99516 Tnr from the Alliance and then resolved by just check-gene-namespaces-online, and TNR's GO annotation set read from QuickGO for UniProtKB:Q92752, which returns zero molecular functions.

    Mechanism: biallelic TNR loss of function, tenascin-R absent from the CNS extracellular matrix, defective perineuronal net assembly around inhibitory interneurons, then two branches. The hippocampal synaptic-plasticity branch reaches developmental delay and intellectual disability. The motor branch, which reaches the spasticity and opisthotonus the disorder is named for, is the conjecture advanced in the first case report and is curated as an EMERGING mechanistic_hypotheses group with every edge typed INDIRECT_UNKNOWN_INTERMEDIATES.

    Scope decisions recorded in the entry rather than left implicit: the descriptive MONDO/OMIM/ClinGen name is kept because no gene-related name is established by any of the five routes (MONDO carries no synonyms for this term at all); no myelination mechanism node is curated, because nothing connects the oligodendrocyte source of tenascin-R to the myelination anomaly ClinGen records and the one fully described null patient had normal infant myelination; eleven of seventeen phenotypes are left causally unwired rather than wired to an invented edge. PMID:41233622 (2026, post-dating the ClinGen Definitive curation) reports an asymptomatic biallelic individual, which is curated as penetrance INCOMPLETE, expressivity VARIABLE, and a CONTROVERSY discussion about whether the phenotype label still fits the genotype.

    PMID:32099069, the gene-establishing paper, is cached abstract-only and a --force re-fetch did not upgrade it (full_text_declined: access_type:publisher_free), so every quotation from it comes from the structured abstract. PMID:28334938, ClinGen's third supporting publication, has an abstract that never names TNR, so nothing is sourced from it.

    Validation: 87/87 snippets verified; validate-terms, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-duplicate-keys, check-enum-values, check-logical-rules, check-block-scalar-comments, check-qualifier-terms, check-gene-activity-grounding and check-gene-namespaces-online all pass.

  summary: 'Review: connect the one orphan phenotype in SRP72 deficiency (IUIS Table
    9)'
  details: |
    Congenital sensorineural hearing impairment was the entry's single orphan phenotype, and it is the one manifestation of SRP72 disease outside the blood.

    Attached to Impaired SRP-Dependent Cotranslational Protein Targeting rather than to the haematopoietic node, because the hearing loss is congenital and is not a consequence of marrow failure. This is the same observation the entry's srp72-tissue-restriction discussion is built around: a ubiquitously required targeting pathway produces a phenotype that is almost, but not entirely, haematopoietic. No source traces a route from impaired cotranslational targeting to cochlear development, so the intermediates are recorded as unknown. 34/34 snippets verify.

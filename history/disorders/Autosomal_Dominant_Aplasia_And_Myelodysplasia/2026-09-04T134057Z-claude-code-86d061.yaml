  summary: Curate primary SRP72 literature after egress opened
  details: |
    Egress from the curation session opened roughly 14 hours after the entry was
    created, so the constraint that shaped it no longer held. Re-tested on a
    routine check-in: eutils.ncbi.nlm.nih.gov and www.ebi.ac.uk both reachable
    where they had returned 403 on three prior attempts. Everything the earlier
    rounds had to defer was then done.

    Term caches (the CI fix, pushed separately as 4b730d1). `just validate-terms`
    now runs, producing exactly the six rows the reviewer had predicted, with
    every label matching what the entry asserts: MONDO:0013851, hgnc:11303,
    GO:0006614 and the three enum membership files. This was the durable fix for
    the red build rather than a policy nicety - term validation is cache-first,
    so with these CURIEs absent every CI run had to reach OLS, and the failing
    run died on a 5-second read timeout resolving GO:0006614. Generated through
    `just validate-terms` and `just normalize-cache`, never hand-written.

    Primary literature fetched and curated:

    - PMID:22541560 (Kirwan et al. 2012, the gene-discovery report) now supports
      genetic#SRP72 with two items - the heterozygous SRP72 mutation and the
      independent second family - and supplies the first direct, disease-specific
      evidence on two pathophysiology nodes. Its transfection and
      coimmunoprecipitation results are graded IN_VITRO; its conclusion that an
      SRP-component defect is a third pathway to AA/MDS alongside transcription
      factor and telomerase lesions is graded HUMAN_CLINICAL and is also the
      citation behind curating SRP72 as a sixth mechanistic axis on the parent
      entry.
    - PMID:31254415 (D'Altri et al. 2019, the Srp72 null mouse) is curated in a
      new animal_models block with two ModelMechanismLinks: FAILS_TO_RECAPITULATE
      against Bone marrow hypocellularity, carrying the required limitations and
      evidence, and PARTIALLY_RECAPITULATES against Impaired Haematopoietic
      Output. The link evidence is graded REFUTE against the proposition that
      reduced Srp72 dosage suffices for marrow failure. Readouts capture the mild
      cellularity reduction and the transcriptional fall in secreted factors.
    - PMID:40922878 now backs srp72-penetrance with a documented unaffected
      carrier of the same variant.

    Consequent changes to claims already in the entry:

    - The SRP72 Deficiency node description no longer says the primary data
      "are not cited here"; it cites them. The argument against naming the node
      haploinsufficiency is now two-sided - the assembly defect in vitro, and the
      dosage-only mouse that does not get the disease. functional_impact_category
      stays unset: neither line establishes a dominant-negative mechanism, which
      would require showing the mutant subunit impairs wild-type-containing
      particles.
    - A fifth discussion, srp72-mouse-model-mismatch, kind HUMAN_MODEL_MISMATCH,
      records the mouse/human divergence and names the decisive experiment (a
      knock-in of a human allele rather than a null). This is the case the very
      first history record predicted would be the natural HUMAN_MODEL_MISMATCH.
    - srp72-molecular-lesion is now evidence-backed rather than assertion-only.
    - The entry notes and the srp72-evidence-completeness CURATION_TODO are
      rewritten: the blocked-egress paragraph is marked as historical, and the
      TODO is narrowed to what genuinely remains.

    What deliberately remains uncurated, and why. PMID:27899666 (SRP72 structural
    work) is cached but unused - splitting the molecular node into SRP68
    heterodimerization versus 7SL RNA binding is a real improvement but a
    separate piece of work. PMID:39501104 (genome-first penetrance cohort) is
    cached and deliberately NOT cited as an SRP72 penetrance figure: it reports a
    pooled odds ratio across eight predisposition genes with no SRP72-specific
    breakout, so quoting it for this disease would be exactly the kind of
    misattribution the evidence SOP guards against. Both are named in the
    CURATION_TODO.

    Validation: `just validate-disorders` on both changed files passes end to end
    including term validation; snippets 26/26 on this entry (up from 14) and
    53/53 across both files; duplicate keys, entity refs, causal targets,
    qualifier terms, enum values, snippet length/title/grading, folded hyphens,
    empty snippets, reference titles, environmental evidence and term-cache
    integrity all pass; the page renders. The pathograph is unbroken with the
    mouse model wired to both of its target nodes and no orphan targets.

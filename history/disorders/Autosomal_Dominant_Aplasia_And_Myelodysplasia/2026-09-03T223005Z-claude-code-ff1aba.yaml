  summary: 'Create: Autosomal Dominant Aplasia and Myelodysplasia (BMFS1, SRP72)'
  details: |
    De-novo curation of MONDO:0013851 / bone marrow failure syndrome 1 (BMFS1),
    the autosomal dominant SRP72-deficiency marrow failure and myelodysplasia
    syndrome.

    Lump/split decision: DISEASE. The stub was UNDECIDED. MONDO:0013851 is a
    leaf with one causal gene (hgnc:11303 SRP72) under the bone marrow failure
    syndrome / inherited aplastic anemia grouping terms. Its parent
    MONDO:0001713 is already curated as kb/disorders/Inherited_Aplastic_Anemia.yaml,
    whose has_subtypes list enumerates five mechanistic axes: DNA interstrand
    crosslink repair, telomere maintenance, ribosome biogenesis and assembly,
    thrombopoietin receptor signalling, and inflammatory suppression of the stem
    compartment. A defect in co-translational protein targeting is a sixth axis,
    not a re-derivation of any of those, so the entry carries its own pathograph
    rather than being a has_subtypes row alone. A BMFS1 has_subtypes row was
    nevertheless added to Inherited_Aplastic_Anemia.yaml so the sixth axis is
    visible from the parent page; that row cites the same IUIS classification
    row and points at this entry.

    Grouping: none added. No general inherited-bone-marrow-failure grouping
    exists in kb/groupings/. The one BMF grouping, Bone_Marrow_Failure_IEIs,
    is a narrower axis (IUIS Table 9, NECESSARY criterion HAS_CLASSIFICATION
    iuis_category:bone marrow failure) that BMFS1 does not qualify for. A
    general IBMFS grouping is a real gap with roughly eight members already
    curated, but it is separate work.

    Evidence limits - the material constraint on this record. The session had
    no network route to any literature source: PubMed/E-utilities, Europe PMC,
    PMC, Crossref, ClinicalTrials.gov, Orphadata and OLS all returned 403 at the
    agent proxy (organization egress policy), so `just fetch-reference` and
    `just structured-rebuild-orphanet` could add nothing to references_cache/.
    Two earlier sessions on issue #10764 deferred for this reason. This session
    proceeded instead by re-searching the existing cache, which yielded two
    references that do support the core claims and had been passed over:

      - PMID:35748970 (IUIS 2022 classification, cached as full_text_pdf) carries
        the classification row "BMFS1 (SRP72-deficiency) SRP72 AD 602122 NA NA
        Bone marrow failure and congenital nerve deafness", which establishes the
        gene-disease association, autosomal dominant inheritance, and both the
        haematologic and the deafness phenotype.
      - PMID:37226705 (Shwachman-Diamond review, full text) carries the SRP
        complex's composition and co-translational targeting function, the
        SRP72-dysgranulopoiesis association, and an explicit statement of the
        tissue-restriction gap.
      - url:https://www.ncbi.nlm.nih.gov/books/NBK571103/ (GeneReviews, Monosomy 7
        Predisposition Syndromes Overview) carries the SRP72 table row recording
        pancytopenia and myelodysplasia.

    Nothing was fabricated to fill the gap. The entry has four pathophysiology
    nodes rather than the fuller chain the primary literature would support; no
    prevalence, no treatments, no animal_models, and no frequency bands. Each
    omission is stated in the entry-level notes with its reason. The uncited
    primary literature - the founding exome study, the Srp72 heterozygous-null
    mouse that fails to reproduce the phenotype (the natural
    HUMAN_MODEL_MISMATCH case), the structural work, and the recent case series
    and penetrance cohorts - is enumerated in the srp72-evidence-completeness
    CURATION_TODO discussion so the next curator does not repeat the search.

    Module conformance: none declared, deliberately. stem_cell_exhaustion scopes
    itself in its own description to age-associated stem cell decline, and
    myelosuppression scopes itself to treatment toxicity; conforming a germline
    targeting defect to either would import a mechanism no source here supports.
    Recorded in a node-level note. No co-translational-targeting module was
    created - one conformer and one paper's worth of mechanism does not justify
    it.

    Three KNOWLEDGE_GAP discussions record the substantive open questions:
    tissue restriction of a housekeeping defect, the unexplained deafness
    (left unattached to the causal chain rather than conformed to a hair-cell
    module), and penetrance.

    Validation run offline: linkml-validate (schema) passed on both changed KB
    files; count-verified-snippets 14/14 verified against the cache;
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, check-snippet-length,
    check-title-snippets, check-snippet-grading, check-folded-hyphens,
    check-empty-snippets, check-reference-titles and check-stubs all pass.
    Term validation (`just validate-terms`) could NOT be run: MONDO:0013851,
    hgnc:11303 and GO:0006614 are absent from cache/ and OLS is unreachable, so
    no cache/ rows are added by this change and CI is the first place those
    three CURIEs are resolved. GO:0006614's canonical label was confirmed
    out-of-band before binding.

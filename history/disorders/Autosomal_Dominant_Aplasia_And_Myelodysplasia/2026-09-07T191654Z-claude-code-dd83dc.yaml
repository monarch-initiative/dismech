  summary: 'Round 4 review: curate PMID:41472573, rewrite the molecular-lesion gap'
  details: |
    Addressed the round-4 review on PR #10814. Both IMPORTANT items and all four
    SUGGESTION items taken, in one push per the repo convention. Every finding
    was verified against the cache before acting.

    IMPORTANT 1 - three prose claims falsified by a file this PR committed. The
    reviewer was right, and this is the second time the same defect appeared in
    this PR: prose asserting what the reference cache does not contain, written
    about a cache the same change set had already changed. PMID:41472573 was
    fetched in the round-3 batch, committed, and then cited nowhere, while the
    entry went on saying no BMFS1-specific transplant outcome, no supportive-care
    statement and no prevalence figure was quotable. All three are in that file.
    Curated rather than merely deleting the sentences:

      - treatments[0] gains two DIRECT HUMAN_CLINICAL items - the prior
        transplant experience (two patients, one good outcome, one death from
        acute immune rejection) and the index case transplanted from a sibling
        with normal parameters at day 132. The GeneReviews item stays INDIRECT
        alongside them. The description now names the transplant denominator
        explicitly and warns against reading day 132 as a success rate: three
        transplanted patients in the whole literature, one of whom died.
      - A second treatment, supportive transfusion and infection prophylaxis,
        with the source's own thresholds. Deliberately no target_mechanisms
        link: transfusion replaces the marrow's product rather than acting on
        any node, so a mechanism edge would overstate it.
      - A prevalence record, measure_type CASES_IN_LITERATURE, prevalence_class
        ULTRA_RARE, no rate_per_100000 - six families is a case count, not a
        population rate, and the source says in the same paragraph that the
        undiagnosed fraction cannot be determined.

    IMPORTANT 2 - the srp72-molecular-lesion gap was one-sided. It argued only
    against haploinsufficiency while two sources cached on this branch report
    truncating alleles with an explicit loss-of-function mechanism. Rewritten
    around the question the evidence actually poses: whether the mechanism is
    allele-dependent, with the founding missense variants acting through a
    misassembling subunit and the frameshift/splice variants through simple loss
    of function. Both directions now cited - the mouse and the 7SL
    co-immunoprecipitation on one side, PMID:40922878's in-vitro loss-of-function
    finding and PMID:41472573's premature termination codon on the other. The
    rationale also now says why functional_impact_category stays unset in more
    precise terms: the slot takes one value per variant context, this entry
    curates the gene rather than individual alleles, so any single value would
    erase the split the evidence suggests.

    SUGGESTIONS, all taken:
      - phenotypes[3]'s claim that the deafness is absent in a reported family
        is now cited, graded REFUTE against the proposition that hearing
        impairment is constant - not against the phenotype's association with
        the disease. The quoted sentence is from the body, not the title, so it
        does not trip check-title-snippets.
      - PMID:41472573 is now cited four times and named in the CURATION_TODO for
        the one thing still not curated from it (the per-variant allele
        spectrum). The stale "recent case series is not curated" line is gone.
      - The Kirwan conclusion snippet on pathophysiology[1] dropped from
        directness DIRECT to INDIRECT. The reviewer is right: the sentence
        asserts a role in AA/MDS pathophysiology, not that co-translational
        targeting is measurably impaired.
      - srp72-mouse-model-mismatch now attaches to
        animal_models#Srp72 heterozygous null mouse rather than
        animal_models#Mouse, matching on the unique name key rather than
        species.

    The top-level references block gained the four PMIDs cited since it was
    written.

    Validation. `just validate-disorders` on both changed files passes end to
    end including term validation; snippets 33/33 on this entry, up from 26;
    entity refs, causal targets, duplicate keys, enum values, qualifier terms,
    folded hyphens, empty snippets, reference titles and environmental evidence
    all pass; the pathograph has 11 nodes and no orphan targets; `git status
    cache/` is empty, so the committed term-cache rows still cover this entry
    offline.

    check-snippet-length, check-title-snippets and check-snippet-grading exit
    non-zero repo-wide. Checked rather than assumed: grepping each report for
    this entry returns nothing, and the flagged files are CRX_Related_Retinopathy,
    Ewing_Sarcoma, Glutaryl-CoA_Dehydrogenase_Deficiency, Tangier_Disease,
    IgG4-Related_Disease, Primary_Ciliary_Dyskinesia, AIPL1-Related_Retinopathy,
    Congenital_Glaucoma, EYS_Related_Retinitis_Pigmentosa and Tay-Sachs_Disease -
    none touched by this branch, which changes exactly two KB files. These three
    gates passed earlier in this PR's history, so the drift arrived on main
    between 2026-09-04 and 2026-09-07; origin/main was re-fetched before checking,
    so it is not a stale local baseline.

  summary: 'Classify: IUIS 2022 Table 9'
  details: |
    Added classifications.iuis_category: bone marrow failure, backfilled from IUIS 2022 Table 9 (Tangye et al., PMID:35748970), the row entered as 'BMFS1 (SRP72-deficiency)'. One row, one gene. The entry's two existing harrisons_chapter assignments were already drawn from this same Table 9 row and already quoted it, but the nosology placement itself had never been recorded in iuis_category, which is the slot the Bone_Marrow_Failure_IEIs grouping reads - so the entry was invisible to that grouping. The evidence item reuses the same full-row snippet already present under harrisons_chapter, with the same evidence_source OTHER grading, so check-snippet-grading sees no divergence. Notes record that the table's OMIM number 602122 is the SRP72 gene entry rather than the phenotype entry 614675 this disease is usually cited under, so the gene and row label are what identify it. Also added as a member of kb/groupings/Bone_Marrow_Failure_IEIs.yaml, where the differentiating mechanism is that SRP72 makes this the mechanistic outlier among the members: the failing process is co-translational protein targeting, not genome maintenance or telomere biology.

  summary: 'Create: Lessel-Kreienkamp_Syndrome'
  details: |
    New entry for Lessel-Kreienkamp syndrome (MONDO:0030897; AGO2). Decided DISEASE (single-gene Mendelian entity with its own MONDO term and a Definitive ClinGen AD assertion), not a subtype or grouping. Deep research: falcon (Edison) was requested but failed with '503 Failed to authenticate' on two plain runs, one run with dr_fallback='--fallback' and one with '--fallback-provider claude_code' (the client classifies the error as temporary and does not hand over), so the one report was produced by the claude_code provider. That report was used only as leads and is not committed in this PR: its generated frontmatter records model identifiers, so it is held back pending a maintainer decision. Its reference validation resolved 6/6; preflight-dr returned WARN only because the report names OMIM 618681 as a known mis-pairing alongside the correct OMIM 619149; AGO2 is the only gene discussed, so identity was confirmed manually. The report was thin and used as leads only; every claim was taken from primary sources fetched with just fetch-reference: Lessel et al. 2020 (PMID:33199684), the 45-individual cohort (PMID:42638108), the AGO2-miRNA kinetics and knock-in mouse study (PMID:41099708), a Chinese family (PMID:40574801), a Japanese case pair (PMID:42580685), the AGO1 NDD paper for the differential (PMID:34930816), and the ClinGen Definitive AD record (CGGV assertion ec86c06a). Allele classes are modelled as two trigger nodes: gain of function (prolonged target dwell, altered miRNA loading; per PMID:41099708, with the 2020 loss-of-function framing kept as REFUTE evidence) and loss of function (p.Gly733Arg, multi-exon deletion). Reduced shRNA silencing is recorded with a REFUTE item because the 2026 cohort found it for only two of the new variants. No treatment or management source was found. The rnai_gene_silencing module was not conformed to (therapeutic siRNA, not endogenous miRNA pathway). Validated with just validate, count-verified-snippets (73/73), validate-terms, the offline gates, and just validate-disorders (pass).

  summary: 'Create: SLC13A5 Citrate Transporter Disorder (MONDO:0014392)'
  details: |
    Created new autosomal-recessive Mendelian entry for SLC13A5 citrate transporter disorder (DEE-25), a metabolic/solute-carrier epilepsy (distinct from channelopathy/chromatin mechanisms curated previously). Unbundled cascade: NaCT citrate-transporter deficiency forks to (a) impaired neuronal citrate uptake -> disrupted citrate-dependent metabolism -> fork to excitability dysregulation + impaired neurodevelopment, and (b) an ameloblast enamel-mineralization defect (dental arm). E/I node conforms_to epilepsy_excitation_inhibition_imbalance. KNOWLEDGE_GAP discussion on the seizure mechanism (energy deficit vs neurotransmitter-precursor deficit vs extracellular-citrate cation chelation). Deep research via just research-disorder claude_code. Evidence from Thevenon 2014 founding (PMID:24995870), a 2020 Epilepsia cohort (PMID:33063863), an SLC13 mechanism review (PMID:36495372, OTHER), the Slc13a5-knockout mouse enamel study (PMID:28406943, MODEL_ORGANISM), a patient TCA/metabolomics paper (PMID:28673551, for the elevated-citrate biochemical marker), an ultra-rare-prevalence phenotype paper (PMID:41442826), and a preclinical AAV gene-therapy rescue study (PMID:41712282, MODEL_ORGANISM). Includes biochemical (elevated plasma/CSF citrate), prevalence (CASES_IN_LITERATURE, ULTRA_RARE, 45 reported patients), and gene-therapy treatment. Addressed pre-PR red-team findings (biochemical block, prevalence, hypodontia phenotype, ID re-anchoring, disease-specific metabolism evidence). 31 snippets verified as exact substrings; validation passes; compliance 90.2% weighted.

  details: |
    De-novo curation of herpes zoster ophthalmicus (MONDO:0005883): VZV reactivation in the ophthalmic trigeminal ganglion -> anterograde V1 spread to skin and eye -> corneal keratitis, anterior uveitis/trabeculitis, neurotrophic keratopathy, necrotizing retinitis, and VZV vasculopathy. Ten phenotypes wired causally; two-phase progression; antivirals, suppressive valaciclovir (ZEDS), and RZV prevention. Shared reactivation spine will conform_to alphaherpesvirus_reactivation_neural_spread once PR #18947 is on main (deferred; review_notes). Scoped standalone vs Herpes_Zoster parent (ocular-specific sight-threatening mechanisms). 29 snippets exact-matched; deterministic granularity classes clean. Deep research claude_code.

  details: |
    Backfill for issue #8085. Four exposures graded across three effects and three target nodes. Estrogen deficiency is TRIGGERS/DIRECT into RANKL/OPG dysregulation, the specific brake its withdrawal releases, which is why loss accelerates sharply at menopause. Glucocorticoid use is TRIGGERS into bone remodeling imbalance as the commonest secondary cause. Smoking is EXACERBATES into the same node, shifting turnover toward loss on top of whatever else is driving remodelling, with the responsible constituents unestablished. Microgravity exposure is TRIGGERS/DIRECT into the entry's dedicated microgravity-accelerated resorption node, citing incomplete tibial bone density recovery twelve months after flight. Validated with linkml-validate and just validate-terms, and every new evidence item was verified part-by-part against the committed reference cache by a local audit. The project's just validate-references sweep was not run to completion on this tranche locally because it rescans the whole cache per file; CI runs it authoritatively on the pull request; integrity issue count unchanged. PR review found the estrogen deficiency link's citation did not reach the node it targets: PMID:18567553 is a commentary on estrogen-resistant men whose quoted sentence states only that such cases stimulated research, naming neither RANKL nor OPG nor menopause, which cannot carry a DIRECT edge into a node named for that ratio. It now cites PMID:12697741, which measured RANKL on bone marrow cells in early postmenopausal women and found it two- to threefold higher than in premenopausal or estrogen-treated women, inversely correlated with serum estradiol. Note the reviewer suggested PMID:12569162 for this; that identifier is a rheumatoid arthritis B7-H1 paper, so the correct identifier for the study described was located and fetched instead. Re-verified: 37 of 37 snippets.

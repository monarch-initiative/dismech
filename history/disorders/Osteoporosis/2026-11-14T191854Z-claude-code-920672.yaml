  summary: Split the oestrogen receptor step out of the RANKL/OPG node
  details: |
    Review round on PR 17805, blocking finding 2: RANKL/OPG Dysregulation declared conformance to menopausal_estrogen_withdrawal#Loss of Estrogen Receptor Signalling in the Target Tissue while also being the target of the osteocyte-senescence edge and of denosumab, and carrying microgravity RANKL/OPG evidence, so the link asserted that senescence-driven and unloading-driven RANKL elevation was oestrogen-receptor withdrawal and that denosumab acts on receptor withdrawal. Added a CELLULAR node, Loss of Bone-Cell Estrogen Receptor Signalling, carrying the ESR1 descriptor and the GO:0030284 nuclear estrogen receptor activity descriptor moved off the RANKL node plus a new GO:0030520 estrogen receptor signaling pathway descriptor, both DECREASED, with CL:0001035 bone cell as the cell type and bone lining cell as the preferred term. Moved the conformance there, retargeted the Estrogen Deficiency exposure link to it, and gave it a downstream edge to RANKL/OPG Dysregulation citing the three-group marrow RANKL comparison in PMID:12697741 and the ERalpha-deletion result in PMID:28744019. RANKL/OPG Dysregulation now conforms to osteoporosis_bone_resorption#RANKL-Driven Osteoclastogenesis, whose own description names oestrogen deficiency and glucocorticoid excess as alternative drivers of the same shift, and its GO:0030316 descriptor gained modifier INCREASED to match that module node. Rewrote the node notes, the entry-level notes paragraphs on where the module link sits, and the subtype sentence that named the RANKL node as the model of receptor loss. Could not verify: CL has no bone lining cell term (OLS searches of cl for 'bone lining cell' and 'bone lining' re-run 2026-11-14 return endosteal cell, osteoclast and osteochondral skeletal stem cell only), so the binding sits at the shared parent and the searches are recorded in the node notes. check-conformance-content reports cell_type_absent on the new RANKL anchor because that module node binds osteoclast; left unbound deliberately, with the reason in the node notes, since the ratio is set in osteoblast-lineage cells and read out on osteoclast precursors.

  summary: Bind the defining measurement and its guideline thresholds as LOINC measurements
  details: |
    Added a Bone Densitometry (DXA) diagnosis row bound to NCIT:C48789 with two LOINC measurements, DXA Femur T-score (LOINC:38263-0) and DXA Lumbar spine T-score (LOINC:38267-1). A reference range on the femur code carries the WHO criteria as restated by Kanis 2002 (PMID:12057569), Kanis et al. 2008 (PMID:18180210) and Lombardi and Ross 2001 (PMID:11730255): osteoporosis below -2.5 and low bone mass from -2.5 to -1.0, with the inclusive versus exclusive wording of the -2.5 boundary disclosed in the range notes. No normal band, because no cached abstract states it. No femoral-neck-specific DXA T-score code was found in the Monarch KG, so the femur code is bound. The ISCD 2005 skeletal-site position (PMID:16731427) grounds the spine measurement. Validated with just validate, count-verified-snippets, validate-terms and loinc-seed-cache.

  summary: Record why no cell type is bound for the bone lining cell on the RANKL/OPG
    node
  details: |
    The molecular_functions descriptor on RANKL/OPG Dysregulation names bone
    lining cells in its preferred_term, and the node binds no cell type. PR
    #13159 added that descriptor without recording why the cell is unbound,
    which left an over-broad-looking gap with no stated reason.

    CL has no term for the bone lining cell. An exact OLS search of cl for
    "bone lining cell" returns nothing; a non-exact search for "bone lining"
    returns CL:0000092 osteoclast, CL:0020016 osteochondral skeletal stem cell
    and CL:0002157 endosteal cell alongside unrelated haematopoietic terms.
    Endosteal cell is the closest and is still wrong: CL defines it as the cell
    making up the vascular membrane lining the marrow cavity, and its extended
    description has it differentiating into osteoblasts, so it is an active
    osteogenic cell of the endosteum rather than the quiescent flattened cell
    covering a quiet bone surface that the descriptor means.

    Provenance. The observation and the first draft of this note came from a
    duplicate pull request, #13176, which curated estrogen resistance syndrome
    in parallel with #13174 and was closed in favour of it. Everything else in
    that branch duplicated merged or queued work; this note did not, so it is
    carried here rather than lost with the branch. Both searches and the
    CL:0002157 definition were independently re-run against OLS before the note
    was written, per the rule that a recorded search is a claim like any other.

    No term is bound and no binding is proposed. Writing a CL term request for
    the bone lining cell is a reasonable follow-up and is deliberately not done
    here.


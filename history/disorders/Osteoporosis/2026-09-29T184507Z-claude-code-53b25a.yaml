  summary: Wire ESR1 into the pathograph on the RANKL/OPG dysregulation node
  details: |
    Sixth tranche of the estrogen-signalling work in issue #12925: the entries
    that bound ESR1 in genetic: only, where the gene reached no mechanism node.
    Here the literature does not stop at genotype association, so the gene is
    wired. The RANKL/OPG Dysregulation node now carries genes: ESR1
    (hgnc:3467) and a molecular_functions descriptor bound to GO:0030284
    nuclear estrogen receptor activity, modifier DECREASED, with a node note
    recording why this node and not another.

    Why this node. It is the target of the entry's Estrogen Deficiency
    exposure (environmental_effect TRIGGERS), and its own description places
    estrogen's restraint of RANKL here, so it is where the entry already says
    estrogen loss acts. The receptor is intact; what falls is its ligand, the
    same shape as the Heart_Failure binding in the fifth tranche, and the
    DECREASED modifier on the new molecular function carries that.

    Evidence. PMID:28744019 (fetched and cached) uses murine reconstitution
    models with selective deletion of estrogen receptor alpha and concludes
    that the rise in resorption under estrogen deficiency is mainly a loss of
    ERalpha-mediated suppression of RANKL expression in bone lining cells. That
    names the gene, the cell and the RANKL readout together. Graded
    MODEL_ORGANISM, quote_role PRIMARY_RESULT, directness INDIRECT, since the
    finding is in ovariectomized mice rather than postmenopausal bone.

    The other route. Osteoclast ERalpha regulates osteoclast lifespan through
    Fas ligand (PMID:17803905, fetched and cached, cited in the node note
    only). That is not a RANKL/OPG mechanism and belongs on the Bone
    Remodeling Imbalance node, which carries the osteoclast cell type; it was
    not wired there because one landing per gene was the scope here and the
    note records the lead. ESR2 is not bound: the cited work attributes the
    RANKL effect to the alpha receptor.

    The ESR1 genetic record was left as it is. Its notes already call the
    6q25.1 BMD signals the common-variant counterpart of the estrogen-deficiency
    mechanism, which is now the node the gene reaches, so the two halves of the
    entry agree.

    Deep-research reports for this disease (cyberian-codex, falcon) were read
    first. The falcon report lists ESR1 in a table row on estrogen deficiency
    and cytokines with no source for a receptor measurement; the cyberian-codex
    report names no receptor gene. PubMed title searches resolved the primary
    sources quoted here.

    Checks: validate, validate-terms and count-verified-snippets passed on the
    file; validate-disorders over the tranche passed; list-gene-term-mismatches
    found no binding naming another gene; check_gene_activity_grounding against
    origin/main reports no newly ungrounded gene; the offline gates
    (check-enum-values, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-environmental-evidence, check-reference-titles) passed with no new
    findings. GO:0030284 was already in both term caches.

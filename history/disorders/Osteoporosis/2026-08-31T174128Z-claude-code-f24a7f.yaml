  summary: Add aging mechanism arm, model systems, and aging knowledge gaps to Osteoporosis
  details: |
    Answered a gap assessment on aging and model systems by curating the four sections it exposed as absent. Aging arm: added three pathophysiology nodes with conformance into the hallmarks-of-aging module family, which the entry previously ignored despite osteoporosis being the archetypal aging disease. Osteocyte Senescence and SASP Acquisition and Senescent Cell Accumulation in the Bone Microenvironment conform to cellular_senescence (PMID:27341653, PMID:28825716); Marrow Stromal Lineage Shift Toward Adipogenesis conforms to stem_cell_exhaustion (PMID:11708718). Model systems: the entry had no animal_models, experimental_models or computational_models at all, against 553, 272 and 33 files KB-wide. Added the ovariectomized rat as the FDA-designated preclinical model with its 12-month turnover-normalization limitation (PMID:8579908), the INK-ATTAC senescent-cell clearance mouse as a RESCUES link with target-engagement and age-specificity readouts (PMID:28825716), and the aged wild-type mouse carrying a REFUTE item for the cortical mismatch (PMID:23689830). NAMs: MLO-Y4 and IDG-SW3 osteocyte lines (PMID:9421234, PMID:21735478) and a human 3D bone organoid with coupled osteoblast-osteoclast remodeling (PMID:34173283), the last noted as developed for myeloma bone disease with no aging axis. Computational: QCT-based finite element hip model validated prospectively in MrOS (PMID:19049327) and the Komarova bone cell population dynamics model (PMID:14499354). Knowledge gaps: four new discussions, all aging-facing. A HUMAN_MODEL_MISMATCH on rodent absence of osteonal cortical remodeling; a KNOWLEDGE_GAP on senolytic stratification where the mouse result is causal but the phase 2 human trial missed its primary endpoint (PMID:38956196); a gap on the direction of causation for marrow adiposity; and a gap recording that no available NAM sustains an aging-capable coupled remodeling unit. Entry grew from 171 to 250 checked compliance fields while holding 88.0 percent, and all 97 snippets verify against the reference cache.

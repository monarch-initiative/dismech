  summary: Fix module-conformance GO placement and record denosumab rebound
  details: |
    Addressed the blocking finding in the PR review of pull request 10276. The two new senescence nodes carried GO terms belonging to each other s module nodes. Osteocyte SASP Acquisition conforms to cellular_senescence Senescence-Associated Secretory Phenotype but carried only GO:0090398 cellular senescence, which is the process defining the module s Senescent Cell Accumulation node, and none of the three the SASP node defines; it now carries GO:0001816 cytokine production INCREASED and GO:0006954 inflammatory response INCREASED, supported by a new evidence item quoting the SASP-marker measurement in osteocytes from PMID:27341653. Senescent Cell Accumulation in the Bone Microenvironment had no biological_processes at all and now carries GO:0090398 INCREASED, matching the Chondrocyte Senescence conformer in Osteoarthritis. Also took the reviewer s optional rename so the node makes one claim rather than bundling arrest with SASP: Osteocyte Senescence and SASP Acquisition becomes Osteocyte SASP Acquisition, with both attaches_to references updated. Took two of the three non-blocking suggestions. Added a notes line to the marrow adipogenesis node recording that its conformance is to the differentiation-potential aspect of stem cell exhaustion rather than the pool-maintenance aspect, so the absent GO:0019827 reads as deliberate. Added denosumab discontinuation rebound, which the reviewer identified as the one unmodelled research theme citable from independent literature: a REFUTE item on the treatment quoting the FREEDOM post hoc analysis where vertebral fracture rate rose from 1.2 to 7.1 per 100 participant-years off treatment (PMID:29105841), a notes line explaining that the effect is not retained after withdrawal because the drug inhibits the RANKL pathway without altering the state driving it, and an ECTS position statement item on the target_mechanisms link (PMID:33103722). Did not model the oxidative-stress Nrf2/FOXO/SIRT axis or the gut-bone axis: the reviewer noted the deep-research report s only sources for both are journals it itself flags as predatory. Snippets verified 103 of 103.

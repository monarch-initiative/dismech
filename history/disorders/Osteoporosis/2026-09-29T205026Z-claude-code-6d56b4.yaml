  summary: Record why no cell type is bound for bone lining cells
  details: |
    Non-blocking suggestion from the #13159 review, which asked for a cell type on the bone lining cell descriptor if CL has one. It does not. A CL search for bone lining cell returns no term exactly, and a non-exact search returns CL:0002157 endosteal cell and CL:0000092 osteoclast as nearest concepts, neither of which is the quiescent flattened osteoblast-lineage cell the descriptor means. The searches and what they returned are now recorded in the descriptor description rather than the absence being left unexplained, and no term was manufactured.

  summary: Add postmenopausal osteoporosis subtype and reconcile the estrogen-withdrawal
    encoding
  details: |
    Added a has_subtypes row Postmenopausal bound to MONDO:0008159 (looked up in OLS mondo, 2026-11-14), resolving the question design decisions section 19 left open in favour of a stratum rather than a separate entry: the stratum shares the parent's whole downstream chain and first-line therapy, and what is specific to it is the driver and the timing. Evidence is the SWAN FMP-anchored densitometry cohort (PMID:21976317, newly fetched) for the bounded loss window and its cumulative share, plus the marrow RANKL comparison across premenopausal, early postmenopausal and oestrogen-treated postmenopausal women (PMID:12697741, already cited elsewhere in the entry) for the cellular route.

    Stratified with the subtype foreign key: two new progression phases, Transmenopausal accelerated bone loss and Postmenopausal continued loss, both carrying subtype Postmenopausal. Nothing that predated the row carries the key, and the entry-level notes record why: the prevalence rows are sex-mixed or drawn from a cohort aged 15 to 105; every phenotype occurs in male and glucocorticoid-induced osteoporosis as well; the genetic records rest on mixed-sex GEFOS loci.

    Encoding decision: kept the Estrogen Deficiency environmental record (ECTO:9000010, modifier DECREASED, TRIGGERS onto RANKL/OPG Dysregulation) rather than converting it to pathophysiology nodes. Pathophysiology carries no subtype slot, so a root withdrawal node would assert the withdrawal of every case the entry covers, and the entry is deliberately not scoped to postmenopausal disease. Added conforms_to menopausal_estrogen_withdrawal#Loss of Estrogen Receptor Signalling in the Target Tissue on RANKL/OPG Dysregulation, which already bound ESR1 and GO:0030284 with modifier DECREASED in bone lining cells. Also wrote the missing RANKL/OPG Dysregulation to Bone Remodeling Imbalance edge, which the entry's own summary already asserted and three exposures already targeted, so the receptor arm no longer ends at that node.

    Not verified: no postmenopausal-specific prevalence figure was found in the cached sources, so no prevalence row was added or tagged. The cited SWAN cohort is characterised only to five years after the final menstrual period, which the second phase's notes record.

  summary: Cite the cortical fracture-burden premise in the rodent remodeling mismatch
  details: |
    Cited the premise the HUMAN_MODEL_MISMATCH discussion on rodent cortical remodeling was asserting without a reference. Its rationale claimed that the cortical compartment carries most of the fracture burden after age 65; that is now backed by Zebaze et al. (PMID:20472174), which reports that predominantly cortical non-vertebral sites account for 80 percent of all fractures in old age, that 68 percent of radial bone loss between 50 and 80 is cortical with 84 percent of it occurring after 65, and that remodeling within cortex adjacent to the marrow accounts for 47 percent of bone loss. That last figure names intracortical remodeling as the quantitative source of nearly half of human bone loss, which is the specific process the murine skeleton has no counterpart for, so it sharpens the mismatch from a structural observation into a quantified one. Also added the comparative-species point (PMID:7626315) that sheep cortical bone shows Haversian remodeling in older animals, supporting the reading that the second non-rodent species the FDA guidance requires alongside the OVX rat is there to supply the cortical remodeling biology rodents lack. Rationale prose expanded accordingly. No change to the entry structure, nodes, or model links; snippets verified 100 of 100.

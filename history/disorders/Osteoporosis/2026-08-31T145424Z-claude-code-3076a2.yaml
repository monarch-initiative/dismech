  summary: Close evidence gaps and add prevalence to Osteoporosis
  details: |
    Raised evidence coverage from 39.6% to 74.1% (global compliance 72.9% to 87.7%). Added a structured prevalence section (worldwide, sex-stratified, and US NHANES) from PMID:34657598 and PMID:24771492. Cited every previously uncited treatment: denosumab (FREEDOM, PMID:19671655, plus a target_mechanisms link to the RANKL/OPG node), teriparatide (PMID:11346808), romosozumab (FRAME PMID:27641143 and ARCH PMID:28892457), calcium and vitamin D (PMID:17720017), and exercise (Cochrane PMID:21735380). Cited all four genetic loci: LRP5, SOST and ESR1 from the GEFOS BMD meta-analysis (PMID:22504420), and VDR as a REFUTE from the 26,242-participant participant-level meta-analysis (PMID:16908916), with relationship_type changed to DISPUTED because the classic VDR polymorphisms show no BMD or fracture association. Cited the three uncited phenotypes and all four biochemical markers. Corrected the Height Loss phenotype binding from HP:0004322 (Short stature) to HP:0000002 (Abnormality of body height): HPO has no term for acquired adult height loss, and short stature asserts a different claim. Recorded two adverse findings the entry previously omitted: the romosozumab cardiovascular imbalance in ARCH, and the Cochrane finding that the largest femoral-neck benefit came from non-weight-bearing resistance training with no reduction in fracture numbers. All 66 snippets verify against the reference cache.

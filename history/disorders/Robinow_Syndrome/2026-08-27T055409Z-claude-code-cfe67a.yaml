  summary: Wire the pathograph, add 2026 DVL1 functional data and four phenotypes
  details: |
    Final-pass review. Structural: the entry scored 5/22 on phenotype causal-inlink and 0/6 on gene-to-mechanism wiring, because the terminal pathophysiology nodes did not name the phenotype entries and because the causal genes were recorded only in genetic_context, which graph.py does not read. Added gene descriptors to the five molecular nodes and downstream edges from each terminal node to the phenotypes it explains; both metrics are now 100 percent. Edges that cross unestablished ground (renal anomalies, nail dysplasia, hypertrichosis-style features) are marked INDIRECT_UNKNOWN_INTERMEDIATES with descriptions saying so rather than asserting a route. Content: PMID:42424595 (2026) separates the DVL1 frameshift's loss-of-signalling component, shared with a plain stop codon at the same position, from its neomorphic component, nuclear mislocalization and morphogenetic disruption seen only with the frameshift; the DVL node and the dvl_frameshift_mode_of_action discussion were rewritten accordingly. Added cryptorchidism, cleft lip and palate, scoliosis and ankyloglossia as phenotypes; growth hormone and hCG treatments, both PARTIAL single cases; a prenatal-recognition diagnosis section; and congenital adrenal hyperplasia as a documented diagnostic pitfall. All 89 snippets verify.

  summary: 'Create: Robinow Syndrome'
  details: |
    De-novo curation of Robinow syndrome as a single entry with six gene-defined subtypes (WNT5A/DRS1, DVL1/DRS2, DVL3/DRS3, FZD2, ROR2/RRS, NXN/RRS2), covering rows NOS 15-0050 through 15-0100 of ISDS Nosology 2023 group 15. Lump/split rationale is recorded in the entry notes: all six genes act in one WNT/PCP signalling module and PMID:35047859 frames them as convergent, so the MONDO and ISDS per-gene splits are represented as has_subtypes rather than as six separate entries. The pathograph runs from six molecular nodes into a shared WNT/PCP transduction node, then to somitogenesis, growth-plate chondrocyte, craniofacial midline and genital-tubercle developmental nodes derived from the Ror2-null mouse (PMID:14745966). Two animal-model links carry readouts and explicit limitations. A KNOWLEDGE_GAP discussion covers the mode of action of the DVL1/DVL3 penultimate-exon frameshifts; a HUMAN_MODEL_MISMATCH discussion covers transferring null-mouse mechanism to the hypomorphic human dominant alleles. All 76 evidence snippets verified against the reference cache; schema, term and reference validation pass.

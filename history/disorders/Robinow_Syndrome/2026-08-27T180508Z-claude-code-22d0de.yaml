  summary: Retire the lumped Robinow disease entry in favour of a grouping
  details: |
    The lumped Robinow_Syndrome Disease entry created earlier in this PR is removed and replaced by kb/groupings/Robinow_Syndrome.yaml, a Grouping over five gene-defined Disease entries. Reason: PR 9600 merged a standalone Autosomal_Dominant_Robinow_Syndrome_1 entry on main while this branch was in flight, which would have left MONDO:0024455 covered twice, once as that entry's disease_term and once as a has_subtypes term here. The maintainer chose to stay consistent with the split precedent for now and to express the union as a grouping, explicitly leaving a future lump open. All content from the lumped entry was redistributed into the per-gene entries rather than discarded.

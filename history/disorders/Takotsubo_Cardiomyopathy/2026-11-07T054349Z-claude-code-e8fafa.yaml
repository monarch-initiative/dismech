  summary: Add National Inpatient Sample 2008-2009 evidence (PMID:22877807, PMID:22819424)
  details: |
    Added two 2012 analyses of the US National Inpatient Sample 2008-2009 (24,701 takotsubo admissions). PMID:22877807 (in-hospital mortality): 4.2% mortality, male excess (8.4% vs 3.6%), and 81.4% of deaths occurring with underlying critical illness; cited on the stressor trigger node (indirect, physical triggers) and in clinical_burden. The clinical_burden rationale previously called the male mortality excess unexplained; it now records this study's proposed explanation (more underlying critical illness in men) and states that it rests on unadjusted comparisons. PMID:22819424 (case-control vs age-matched MI and orthopaedic controls): sex, race and ZIP-code income distribution added to the US inpatient prevalence record; history of anxiety and mood disorders added to the Anxiety phenotype; the authors' catecholamine interpretation of the comorbidity pattern added to the sympathoadrenal node as indirect support. References fetched with just fetch-reference; validate, count-verified-snippets (133/133) and validate-disorders pass.

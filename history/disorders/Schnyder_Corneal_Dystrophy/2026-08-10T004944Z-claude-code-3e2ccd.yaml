  summary: 'Create: Schnyder Corneal Dystrophy'
  details: |
    De novo curation of Schnyder corneal dystrophy [SCD, MONDO:0007374, UBIAD1/hgnc:30791] as a Mendelian entry.

    Deep research: the default falcon/Edison provider failed with HTTP 402 Payment Required, so two fallback providers were run instead - asta, retrieval-only, 17 papers, largely off-target corneal-dystrophy noise apart from PMID:40141754; and claude_code, a narrative report with 21 web searches and 28 citations. Both reports are committed under research/. The claude_code report's HGNC ID for UBIAD1, HGNC:19828, was wrong and was corrected to hgnc:30791 against OAK before use.

    NEC preflight: just preflight-dr on the claude_code report against MONDO:0007374 returned WARN, driven by a false positive - the disease acronym SCD collides with the stearoyl-CoA desaturase gene symbol. UBIAD1 dominated with 51 mentions and the report OMIM 121800 matched the MONDO xref, so the report was treated as on-entity.

    GeneReviews: PubMed searches for a GeneReviews chapter on Schnyder corneal dystrophy returned zero hits, so no GeneReviews baseline applies.

    Content: a 7-node pathophysiology chain from UBIAD1 missense variant through ER sequestration, blocked sterol-accelerated HMGCR ERAD, increased corneal cholesterol biosynthesis, and corneal cholesterol/phospholipid deposition to age-staged corneal opacification, plus a parallel impaired-MK-4-synthesis arm. Two mechanistic_hypotheses - hmgcr_stabilization_model CANONICAL and mk4_deficiency_model ALTERNATIVE - with hypothesis_groups on the relevant causal edges. Six phenotypes, four treatments including PTK, penetrating keratoplasty, genetic counseling, and a deliberately negative statin entry recording absence of corneal benefit; plus genetic, biochemical, histopathology, imaging_findings, differential_diagnoses, two animal_models, one experimental_model, and two discussions - a CONTROVERSY on the MK-4-versus-HMGCR arms and a HUMAN_MODEL_MISMATCH on the N100S mouse showing no corneal cholesterol difference.

    Deliberate omissions: no genu valgum phenotype, since the classic triad's skeletal arm could not be supported by a quotable primary abstract, with the reason recorded in notes. No datasets block - GEO discovery returned only two GENE_ONLY candidates, GSE229792 breast cancer and GSE266552 hepatic lipid metabolism in Ubiad1 heterozygous null mice, both rejected on relevance triage as the gene-only failure mode, with the rejection recorded in notes. No frequency band on corneal arcus, since no source quantifies it.

    Validation: just validate-disorders, the batched schema plus terms plus references sweep that CI runs, passed with Snippets checked: 74/74 verified against cached references. just validate-terms passed. just compliance reports 100.0 percent weighted compliance. All internal foreign keys - downstream targets, treatment target_mechanisms, modeled_mechanisms, discussion attaches_to, hypothesis_groups - were cross-checked and resolve.

  details: |
    Added Decreased corneal sensation (HP:0012155) from the IC3D Edition 3 full text (PMID:38359414), with confocal-microscopy support (PMID:32280528). Added structured onset to Corneal opacity (CHILDHOOD, earliest diagnosis 17 months, PMID:20505825; IC3D; onset range 9-51 years in N102S families, PMID:30084067) and Corneal arcus (YOUNG_ADULT, ages 23-38, IC3D). Added IC3D evidence to corneal crystals (about 50%, may be unilateral, regress or appear late), reduced visual acuity, photophobia (progressive course) and hypercholesterolemia (hyperlipoproteinemia types IIa, III, IV, also in unaffected relatives). Replaced a sentence-fragment arcus snippet with the full sentence and corrected a stale explanation that referred to a frequency band the phenotype does not assert. Wired five phenotypes from existing pathophysiology nodes. PubMed, Europe PMC, NCBI Bookshelf and OLS were blocked by the network proxy, so the pass used cached full texts only. Validated with validate, count-verified-snippets (104/104), validate-terms, validate-disorders, check-causal-targets, check-coarse-phenotypes, check-name-collisions and check_snippet_length against origin/main.

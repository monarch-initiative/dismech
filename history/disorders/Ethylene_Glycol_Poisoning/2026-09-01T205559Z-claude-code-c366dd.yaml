  summary: Create Ethylene Glycol Poisoning conforming to drug_induced_nephrotoxicity
  details: |
    New entry. Absent from the KB, with an exact MONDO term.

    The entry is built around bioactivation. Ethylene glycol itself is only mildly intoxicating; alcohol dehydrogenase oxidises it to glycolaldehyde, then glycolic acid, then oxalic acid, and the metabolites do the damage. That is why the antidote is an enzyme inhibitor and why fomepizole attaches to the trigger node rather than to any downstream injury.

    Five nodes, three conforming to drug_induced_nephrotoxicity at the uptake, cell-death and acute-kidney-injury nodes. This is the first conformer in this batch where the module's ACUTE time course fits without qualification. Balkan endemic nephropathy, curated earlier in this session against the same module, deliberately declined the Acute Kidney Injury node because its course is chronic; here that node is the right endpoint. The agent caveat still applies and is recorded in the trigger node's notes: the module's trigger names a nephrotoxic drug, and this is an ingested industrial alcohol, so conformance is asserted on the shared mechanism.

    Two clinically load-bearing details are modelled rather than left in prose. The osmolal gap and the anion gap move in opposite directions with time - the osmolal gap tracks unmetabolised parent alcohol and the anion gap tracks metabolites - so a sample drawn at the wrong hour can show either alone and mislead. And oxalate outlasts the poison: in the cited case the parent compound was cleared within 36 hours by dialysis while plasma oxalate peaked on day 3 and normalised only on day 7, so crystal deposition continues after the alcohol has gone.

    Fomepizole's entry states the timing dependence explicitly, because its value is conditional on it: given before significant acidosis or organ injury it prevents renal failure and can remove the need for dialysis, and given late it cannot undo crystals already deposited. Hemodialysis attaches to the acid-accumulation node rather than the enzyme step, since what it removes is the alcohol and the organic acid anions.

    Deep research with claude_code was run and will be committed as provenance. No quote from it was curated; all eleven snippets were independently sourced from PubMed and pre-verified against the local cache before writing, and every reference_title was generated from cache rather than typed.

    Validated with just validate-disorders, just count-verified-snippets (11/11), just check-duplicate-keys, just check-folded-hyphens, and a graph build showing 10 edges, no integrity issues, and no phenotype without an incoming edge.

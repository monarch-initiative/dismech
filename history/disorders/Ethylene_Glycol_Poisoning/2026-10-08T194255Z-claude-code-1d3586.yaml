  summary: Conform to toxic_alcohol_adh_bioactivation module
  details: |
    Declared conforms_to against the new toxic_alcohol_adh_bioactivation module on two pathophysiology nodes: Oxalic Acid Production and Calcium Oxalate Crystal Deposition (sequential-oxidation amplifier) and Glycolic Acid Accumulation and High Anion Gap Metabolic Acidosis (acidosis effector).

    Two further nodes were intended and deliberately left alone, which is the finding worth recording here. Ethylene Glycol Ingestion and Alcohol Dehydrogenase Bioactivation and Proximal Tubular Epithelial Cell Death both already carry a conforms_to to drug_induced_nephrotoxicity, and conforms_to is single-valued (range: string, not multivalued), so a node cannot declare both modules. A first wiring pass that checked only the line immediately after each node name inserted a second key on both and was caught by check-duplicate-keys; the pass was reverted and the check widened to scan the whole node block.

    Assessment of the two existing bindings, which were NOT changed:

    - Proximal Tubular Epithelial Cell Death -> drug_induced_nephrotoxicity#Proximal Tubular Epithelial Cell Death is an exact node-name match against that module's own central effector. It is the right home and the new module's Metabolite-Specific Target Organ Injury node would be a worse fit for a node that is specifically about tubular death. No change warranted.

    - Ethylene Glycol Ingestion and Alcohol Dehydrogenase Bioactivation -> drug_induced_nephrotoxicity#Nephrotoxic Drug Exposure and Tubular Uptake looks like a poor fit. That module node describes renal handling of a filtered and secreted drug taken up by apical endocytosis or organic anion/cation transporters. This entry's node describes oral ingestion and enzymatic oxidation, binds GO:0004022 alcohol dehydrogenase (NAD+) activity, and involves no tubular uptake; ethylene glycol is also not a drug. The new module's central effector is the better home. It was left in place rather than rebound because it is another curator's modelling decision, and the question is raised in the pull request for a maintainer rather than resolved silently.

    Consequence to be aware of: this entry is a conformer of the new module that does not conform at its key conformance target, because the node that genuinely carries the alcohol dehydrogenase claim is bound elsewhere.

    There is a precedent for this exact collision, and it points at debundling rather than at a schema change. Issue #3973 recorded a Spinocerebellar_Ataxia_Type_17 node contested between two modules under the same single-valued conforms_to constraint, and set out a policy: debundle the node where it genuinely mixes two causal steps, and consider making conforms_to multivalued only where one real step sits on two orthogonal axes. It was resolved by debundling into parallel nodes in PR #4184, and conforms_to is still single-valued today, so the multivalued option was not adopted.

    This case falls on the debundle side of that line. The node's own name, Ethylene Glycol Ingestion and Alcohol Dehydrogenase Bioactivation, states two distinct causal steps: the exposure and the enzymatic conversion. The new module separates them into its trigger and its central effector precisely because methanol and diethylene glycol separate them too. Splitting the node would let the exposure half conform to the module trigger and the bioactivation half to the central effector, and would leave the drug_induced_nephrotoxicity binding on the half it actually describes. That work is deliberately out of scope for this PR and is tracked in its own issue.

    No content was changed and no evidence was added or regraded.

  summary: 'Create: NEDCAS (BRAT1)'
  details: |
    De-novo curation of BRAT1-related NEDCAS (MONDO:0020841, OMIM 618056), the mild end of the BRAT1 spectrum, from a claude_code deep-research report (preflight WARN was only INTS11, which is BRAT1's own Integrator partner, not a second disease). Mechanism: biallelic hypomorphic BRAT1 -> loss of Integrator INTS9/INTS11 cleavage-module stabilization -> defective snRNA (U1) 3'-end processing -> inferred impaired cerebellar neurodevelopment -> cerebellar atrophy/ataxia/ID/seizures. AR; ClinGen Definitive copied with its CGGV row; genotype-severity gradient recorded. The historical ATM/mitochondrial mechanism is noted as refuted by patient-cell data (notes). No GeneReviews chapter exists. 19/19 snippets verified; validate-disorders, validate-terms, causal-targets, name-collisions, logical-rules, coarse-phenotypes, gene-activity-grounding, enum-values, duplicate-keys, entity-refs, shared-disease-terms all clean.

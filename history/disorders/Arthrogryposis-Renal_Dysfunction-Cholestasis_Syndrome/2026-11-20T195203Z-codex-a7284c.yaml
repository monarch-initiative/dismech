  summary: Map Arthrogryposis, renal dysfunction, and cholestasis to OMIMPS:208085
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS208085 contains VPS33B-related ARC syndrome 1 (OMIM:208085) and VIPAS39-related ARC syndrome 2 (OMIM:613404). Both are curated as subtypes here and are the two children of MONDO:0017123. Loss of either CHEVI complex component converges on impaired epithelial trafficking and the ARC spectrum, supporting one Disease while retaining molecular and severity differences. The mapping includes attenuated and arthrogryposis-poor ARC presentations already curated here, rather than requiring every patient to show the complete triad. It does not equate renal Fanconi syndrome with Fanconi anemia or include all cholestatic and arthrogryposis disorders.

  summary: Publication-readiness review through 2026-08-05
  details: |
    Scope and evidence audit

    Independently reviewed exactly the ARC syndrome entry and its cached sources,
    with literature searches current through 2026-08-05. The target has no
    disease-specific deep-research provider artifact; unrelated arthrogryposis
    multiplex congenita and PHARC artifacts were inspected for scope and excluded
    as ARC evidence. ClinicalTrials.gov searches for ARC syndrome, VPS33B and
    VIPAS39 found no interventional ARC trial. All new publication caches were
    generated with `just fetch-reference`; none was hand-written.

    The review corrected an invalid referral-cohort ratio encoded as annual
    incidence; qualified phenotype, locus and survival generalizations; added
    structured progression, adult liver histopathology, biochemical liver injury,
    current CHEVI architecture, cell models, a liver-specific mouse model and a
    preclinical gene-addition treatment with its promoter-dependent tumor caveat.
    It also made sepsis atomic rather than conflating sepsis with nonspecific
    recurrent fever, removed an unsupported failure-to-thrive-to-infection causal
    edge, and qualified the c.1225+5G>C residual-function interpretation with 2026
    patient-platelet evidence.

    D2P audit disposition

    The baseline audit produced 65 recommendations: 42 source phenotypes absent
    locally, 19 local phenotypes unlinked from the pathograph, and 4 source terms
    represented only by broader/postcomposed local terms. Every recommendation was
    reviewed as follows. The final audit retains 47 deliberate recommendations
    (36 missing, 7 unlinked, 4 broader/postcomposed); recommendations are not treated
    as an optimization target.

    Added and linked with exact evidence:
    - HP:0030402 Abnormal platelet aggregation — added as VARIABLE, with SUPPORT
      for reduced arachidonate/ADP aggregation and PARTIAL counter-evidence for
      normal multi-agonist aggregometry in two bleeding siblings.
    - HP:0003076 Glycosuria — added and linked to proximal tubular transport
      failure using direct evidence of urinary sugar wasting.
    - HP:0000989 Pruritus — added and linked indirectly to low-GGT cholestasis;
      evidence is limited to attenuated/case-report disease and no frequency was
      inferred.

    Added but intentionally unlinked because an intervening mechanism is absent:
    - HP:0001263 Global developmental delay — supported in three prolonged-survival
      VPS33B cases; CHEVI-dependent neurodevelopmental intermediates are unknown.
    - HP:0001249 Intellectual disability — supported in 6/10 published ARCS2 cases;
      no causal neural cargo or cell-type mechanism is established.
    - HP:0000821 Hypothyroidism — supported in three ARCS2 literature cases; its
      relationship to CHEVI loss is not established.

    Existing phenotypes linked from evidence-backed pathophysiology nodes:
    - HP:0001892 Abnormal bleeding — linked from the platelet bleeding diathesis.
    - HP:0003355 Aminoaciduria — linked from proximal tubular transport failure.
    - HP:0002804 Arthrogryposis multiplex congenita — linked from the neurogenic
      arthrogryposis node while retaining counter-evidence that it is not obligate.
    - HP:0001396 Cholestasis — linked from the low-GGT intrahepatic lesion.
    - HP:0002908 Conjugated hyperbilirubinemia — linked from cholestasis.
    - HP:0001944 Dehydration — linked from volume depletion.
    - HP:0002014 Diarrhea — linked from the intestinal lesion.
    - HP:0001508 Failure to thrive — linked from the severe growth-failure endpoint.
    - HP:0008064 Ichthyosis — linked from stratum-corneum barrier failure.
    - HP:0011877 Increased mean platelet volume — linked from alpha-granule failure.
    - HP:0000952 Jaundice — linked from cholestasis.
    - HP:0033536 Reduced platelet alpha granules — linked from failed alpha-granule
      biogenesis.
    - HP:0001994 Renal Fanconi syndrome — linked from proximal tubular failure.
    - HP:0001947 Renal tubular acidosis — linked from bicarbonate wasting.
    - HP:0100806 Sepsis — retained as an atomic phenotype and linked from the
      source-verified organism-level sepsis node.

    Existing phenotypes retained but intentionally unlinked:
    - HP:0001999 Abnormal facial shape — clinically supported, but a causal
      craniofacial mechanism is unknown.
    - HP:0002079 Hypoplasia of the corpus callosum — clinically supported, but the
      responsible developmental mechanism is unknown.
    - HP:0009806 Nephrogenic diabetes insipidus — a supported alternative renal
      presentation, but it must not be linked to the proximal-tubule mechanism
      because nephrogenic DI implicates a different nephron compartment.
    - HP:0000407 Sensorineural hearing impairment — supported in an incomplete ARC
      case, but a CHEVI-dependent auditory cargo/cell mechanism is unknown.

    Broader/postcomposed local representation retained rather than duplicated:
    - HP:0002611 Cholestatic liver disease — retained as HP:0001396 Cholestasis
      with low-GGT and hepatic context rather than a duplicate top-level term.
    - HP:0002028 Chronic diarrhea — retained as HP:0002014 Diarrhea with
      `temporality: CHRONIC`, the repository's postcomposition pattern.
    - HP:0001531 Failure to thrive in infancy — retained as HP:0001508 with the
      infantile course represented in progression and evidence.
    - HP:0006566 Neonatal cholestatic liver disease — retained as HP:0001396 with
      neonatal onset and low-GGT context in the description and progression.

    Source recommendations reviewed but not added as top-level phenotypes:
    - HP:0011873 Abnormal platelet count — not characteristic: 9/11 patients with
      severe hemorrhage had normal platelet count and morphology.
    - HP:0001631 Atrial septal defect — the cached 62-patient source supports only
      10% aggregate structural cardiac defects, not this atomic subtype.
    - HP:0008780 Congenital bilateral hip dislocation — reported musculoskeletal
      variability lacks an exact primary excerpt adequate for atomic inclusion.
    - HP:0000973 Cutis laxa — source aggregation supplied no exact supporting
      publication excerpt.
    - HP:0001558 Decreased fetal movement — source aggregation supplied no exact
      supporting publication excerpt or defensible frequency.
    - HP:0002910 Elevated circulating hepatic transaminase concentration — captured
      as the structured biochemical finding Serum aminotransferases, not duplicated
      as a top-level phenotype.
    - HP:0030948 Elevated gamma-glutamyltransferase level — a rare counterexample,
      already represented as PARTIAL evidence on the normally low/normal GGT
      biomarker; adding it as an ordinary phenotype would invert the diagnostic
      signature.
    - HP:0001290 Generalized hypotonia — not added separately because the ARCS2
      review's sentence does not supply an unambiguous individual denominator and
      D2P also recommends the synonymous broader HP:0001252.
    - HP:0200084 Giant cell hepatitis — a histologic component of the hepatic
      lesion, not duplicated as a general clinical phenotype.
    - HP:0034714 Hepatic melanin-like lysosomal pigmentation — retained in the
      hepatic mechanism description; exact pigment identity and frequency remain
      insufficient for a separate phenotype assertion.
    - HP:0002240 Hepatomegaly — PMID:31479177's abstract describes isolated
      low-GGT cholestasis but does not support this asserted feature.
    - HP:0001385 Hip dysplasia — no exact source excerpt supports an atomic claim
      distinct from the curated musculoskeletal spectrum.
    - HP:0000962 Hyperkeratosis — already represented as a skin-biopsy finding and
      within the ichthyosis spectrum; the ARCS2 count combines ichthyosis or
      hyperkeratosis and cannot support a separate frequency.
    - HP:0001252 Hypotonia — not duplicated alongside the synonymous generalized
      hypotonia recommendation without clearer atomic evidence.
    - HP:0005248 Intrahepatic biliary atresia — rejected as misleading: human data
      show a patent biliary tract with severely reduced intrahepatic flow and bile
      duct hypoplasia, not true atresia.
    - HP:0001339 Lissencephaly — source aggregation supplied no exact primary
      excerpt; broader CNS variability does not license this specific malformation.
    - HP:0000369 Low-set ears — nonspecific and unsupported by an exact cited
      excerpt.
    - HP:0000252 Microcephaly — unsupported by an exact cited excerpt for this
      molecular ARC spectrum.
    - HP:0000347 Micrognathia — nonspecific and unsupported by an exact cited
      excerpt.
    - HP:0000121 Nephrocalcinosis — PMID:16896922's cached abstract does not support
      this atomic finding despite the source-aggregation attribution.
    - HP:0000112 Nephropathy — too broad and less informative than the supported
      renal Fanconi syndrome, renal tubular acidosis and nephrogenic DI assertions.
    - HP:0001562 Oligohydramnios — PMID:16896922's cached abstract does not support
      this prenatal finding.
    - HP:0000938 Osteopenia — exact evidence and a defensible spectrum frequency
      were not available.
    - HP:0001655 Patent foramen ovale — the cached cohort supports only aggregate
      structural cardiac defects, not this atomic lesion.
    - HP:0002756 Pathologic fracture — exact ARC-specific evidence and frequency
      were not available.
    - HP:0000093 Proteinuria — PMID:31479177 describes three liver-predominant cases
      lacking the other cardinal features and does not support this D2P attribution.
    - HP:0002719 Recurrent infections — recurrent febrile illness is not proof of
      infection, and the systematic review conclusion gives neither an atomic case
      excerpt nor frequency; sepsis remains separately source-verified.
    - HP:0005565 Reduced renal corticomedullary differentiation — not present in
      the cited abstract and not assigned a mechanism beyond nonspecific imaging.
    - HP:0000092 Renal tubular atrophy — not present in the cited abstract and not
      duplicated from renal histology without exact evidence.
    - HP:0001667 Right ventricular hypertrophy — no exact source excerpt; aggregate
      structural cardiac frequency does not license this subtype.
    - HP:0003202 Skeletal muscle atrophy — the arthrogryposis is source-described
      as neurogenic, but an atomic muscle-atrophy phenotype is not established.
    - HP:0000340 Sloping forehead — nonspecific and unsupported by an exact cited
      excerpt.
    - HP:0001518 Small for gestational age — PMID:16896922's cached abstract does
      not support this birth-size assertion.
    - HP:0001884 Talipes calcaneovalgus — the pathophysiology description records
      skeletal variability, but exact atomic evidence was unavailable.
    - HP:0001873 Thrombocytopenia — not treated as characteristic because severe
      hemorrhage commonly occurs with a normal platelet count; the supported lesion
      is alpha-granule dysfunction.
    - HP:0001629 Ventricular septal defect — the cached cohort supports only 10%
      aggregate structural cardiac defects, not this atomic subtype.

    Validation and limitations

    Schema, term, reference/title/snippet, focused graph, pathograph-connectivity,
    compliance and focused model/render/reference tests were run. The focused graph
    validator passed. Repository-wide graph validation has 74 unrelated baseline
    disorder failures; this target is absent from that failure list. The five
    initially retained unlinked findings became seven after adding intellectual
    disability and hypothyroidism; they remain visible limitations rather than
    being connected through speculative causal edges.

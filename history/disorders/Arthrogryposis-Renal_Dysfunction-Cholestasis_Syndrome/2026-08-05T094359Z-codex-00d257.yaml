  summary: Address final automated Claude cache finding and suggestions
  details: |
    Resolved the sole remaining IMPORTANT finding by regenerating and committing
    the deterministic term caches for HP:0030402 Abnormal platelet aggregation;
    the cache rows were generated by repository tooling and were not hand-written.

    Disposition of every nonblocking suggestion from the exact-head re-review:
    accepted NCIT:C111785 Ductopenia as the exact admissible finding term for focal
    interlobular bile-duct loss; added PMID:41923461 directly to the Progressive
    Hepatic Fibrosis node as the human explant anchor; and declined to add a
    `fibrotic_response` conformer because no ARC-specific stellate-cell/TGF-beta
    mechanism has been established and the reviewer explicitly advised against
    forcing it on the current evidence.

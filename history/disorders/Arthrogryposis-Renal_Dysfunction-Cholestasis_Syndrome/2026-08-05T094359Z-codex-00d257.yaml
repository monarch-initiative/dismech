  summary: Address automated Claude publication-readiness review
  details: |
    Disposition of all six IMPORTANT findings from the automated Claude review:
    (1) added NCIT:C15238 Gene Therapy to the preclinical gene-addition entry;
    (2) scoped the VIPAS39 discovery-cohort claim, updated the allele spectrum
    with the two 2024 variants and added exact evidence; (3) removed all three
    invalid `frequency: VARIABLE` values rather than converting uncertain small
    cohorts into numeric bands; (4) confirmed this generated REVIEW history record
    and PR #8009 link are present; (5) added the directly evidenced single-case
    liver-transplant treatment with NCIT:C15289 and explicit multisystem/bleeding
    limitations; and (6) split the adult explant into five atomic histopathology
    findings. A specific cirrhosis histopathology term is not currently admissible
    under HistopathologyFindingTerm, so no broad or incorrect ontology binding was
    invented; HP:0001394 is instead bound in the phenotype section.

    Disposition of every nonblocking suggestion: added and mechanistically linked
    HP:0001394 Cirrhosis; added reduced platelet von Willebrand factor as a bounded
    biochemical readout; retained evidence-backed mechanism-to-phenotype bridge
    edges because they make endpoint identity explicit without adding unsupported
    intermediates; confirmed that the pruritus edge already names accumulation of
    circulating pruritogens as its intermediate; rejected an AQP2/nephrogenic-DI
    edge because the reviewer described it only as plausible and supplied no
    disease-specific evidence; rejected re-encoding the referral-cohort ARC to
    biliary-atresia ratio as CASES_IN_LITERATURE because that measure type also
    would not describe the ratio; and removed the hepatocyte CL binding from the
    HepG2 hepatoma model while retaining the accurate liver tissue context.

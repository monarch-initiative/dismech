  summary: 'Address PR 7833 re-review: retarget bookkeeping'
  details: |
    Resolved both REQUEST_CHANGES items from the second review round. (1) Deleted the self-referential differential_diagnoses block for ARC syndrome itself: after the retarget to MONDO:0017123 the entry listed itself as its own differential. Its content is carried by description and the mondo_deal_barratt_dillon_unreconciled_stub discussion, and its PMID:11668108 subsumption snippet remains in two discussions, so nothing was lost. (2) Corrected the fid_icd11_fanconi_anaemia_misparent rationale, which still described the ICD-11 mapping as an exact label match. Also changed the icd11f:235762608 predicate from closeMatch to narrowMatch, because the ICD-11 definition delimits the arthrogryposis-poor FID end of the ARC spectrum (PMID:11668108 concluded the FID association is part of the ARC spectrum), while deliberately KEEPING MONDO:0022948 at closeMatch because that stub has no definition, gene association or OMIM xref, so its extension is not recoverable from MONDO and a hierarchical subset claim would over-reach. Applied all four suggestions: subtype ARCS1/ARCS2 tags on the genetic VPS33B and VIPAS39 blocks to make the subtype partition queryable rather than decorative; reworded FID-voiced prose in the Fanconi anaemia differential into ARC-spectrum voice; added Fanconi Renotubular Syndrome and Arthrogryposis Multiplex Congenita differentials cross-referencing existing KB entries, each evidenced with a snippet already verified in this file; collapsed the duplicated GeneReviews statement into the provenance paragraph. Validation: schema pass, terms pass, 134/134 snippets verified.

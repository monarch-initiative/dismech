  summary: 'Retarget FID entry to ARC syndrome (MONDO:0017123) and apply PR #7833
    review fixes'
  details: |
    Retargets the entry from the historical FID label to the ARC entity, and applies the ai4c-reviewer findings from PR #7833 (REQUEST_CHANGES).

    RETARGET (reviewer item 4, adjudicated by @cmungall). The reviewer escalated the lump/split question to a human. The maintainer's criterion: dismech is a pathograph resource, not a clinical vocabulary - the name should correspond most faithfully to the mechanism curated, and search/synonymy is MONDO's concern. Applying that criterion, the entry was mis-anchored: it bound disease_term to MONDO:0022948 (Deal Barratt Dillon syndrome) while containing the ARC/CHEVI pathomechanism. MONDO:0022948 is an unreconciled clinical-gestalt stub - no textual definition, no gene association, no OMIM xref, classified under MONDO:0001083 Fanconi renotubular syndrome - whereas MONDO:0017123 has an Orphanet definition, an OMIMPS xref, and two gene-defined children.

    Changes: name -> Arthrogryposis-Renal Dysfunction-Cholestasis Syndrome; disease_term -> MONDO:0017123; file renamed. Added has_subtypes ARCS1 (VPS33B, MONDO:0008822) and ARCS2 (VIPAS39, MONDO:0013255) following MONDO's disease-series-by-gene pattern, with subtype_term bindings. FID / Deal-Barratt-Dillon retained as synonyms; MONDO:0022948 and icd11f:235762608 downgraded from exactMatch to closeMatch as historical labels; MONDO:0008822/0013255 added as narrowMatch. Description and notes rewritten to lead with ARC and to record the retarget rationale. New discussion mondo_deal_barratt_dillon_unreconciled_stub proposes the upstream MONDO fix (obsolete/merge MONDO:0022948 into MONDO:0017123). The ICD-11 Fanconi-anaemia misparenting finding is unchanged and still recorded.

    REVIEWER FIXES.
    - IMPORTANT 1 (evidence_source contradiction): PMID:25947942 is a Vps33b-conditional mouse study and the quoted sentence is background framing. The phenotype-level copy was mistagged HUMAN_CLINICAL; now MODEL_ORGANISM in both places. The human Abnormal bleeding phenotype (HP:0001892) was supported only by that mouse sentence; re-evidenced with human data - PMID:16123220 ARC-patient platelet aggregation and PMID:25239142 on intra-abdominal haemorrhage in patients - with the mouse sentence retained as secondary.
    - IMPORTANT 3 (bundling): "Failure to Thrive, Recurrent Sepsis and Early Death" split into Severe Failure to Thrive -> Recurrent Infection and Sepsis -> Death in Infancy; "Metabolic Acidosis, Dehydration and Electrolyte Failure" split into Bicarbonate Wasting and Metabolic Acidosis and Volume Depletion and Dehydration, both feeding Death in Infancy. All downstream edges, treatment target_mechanisms and notes references updated.
    - SUGGESTION 1 (GGT): dropped the self-contradictory HP:0034444 "Abnormal gamma-glutamyltransferase level" binding on a presence: NORMAL biomarker; free-text preferred_term retained per the prefer-no-term-over-a-misleading-one rule.
    - SUGGESTION 2 (ABCB11): moved the gene descriptor onto the node that carries the BSEP mis-sorting snippet.
    - SUGGESTION 3: removed the GO:0030216 keratinocyte-differentiation annotation, which the node's snippets did not support.
    - SUGGESTION 4: trimmed six hyphen-broken snippet starts to clean word boundaries; all still substring-verify.
    - SUGGESTION 6: purged the two stray cache rows (GO:0099022 obsolete vesicle tethering, NCIT:C15282 Oriental Medicine); neither term is referenced by any entry.
    - IMPORTANT 2 (no deep-research artifact): recorded in notes that this entry was curated directly from primary literature with no DR provider run, so no research/*-deep-research-*.md exists by design rather than omission.

    ADDITIONAL. Graph connectivity check found "Neurogenic Arthrogryposis and Musculoskeletal Anomalies" orphaned - it had no incoming edge in the original entry and the reviewer did not catch it. Since arthrogryposis is cardinal to the ARC entity this now has an explicit edge from the CHEVI node, typed INDIRECT_UNKNOWN_INTERMEDIATES because no published work identifies the neuronal cargo, cell type or developmental window linking VPS33B/VIPAS39 loss to anterior horn involvement. All 17 nodes are now reachable from the proximal lesion.

    Validation: just validate green (schema + terms clean); 130/130 snippets verified against cached references; cache CSV rows in canonical order; no dangling downstream, target_mechanisms or attaches_to references.

    Note on the preceding history record in this directory: it documents creation under the former slug Fanconi-Ichthyosis-Dysmorphism_Syndrome and is left unedited per the append-only rule; its target path refers to the pre-rename file.

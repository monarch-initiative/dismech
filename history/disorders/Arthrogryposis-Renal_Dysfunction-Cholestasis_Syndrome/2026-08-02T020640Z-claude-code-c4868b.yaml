  summary: 'Create: Fanconi-Ichthyosis-Dysmorphism Syndrome (Deal-Barratt-Dillon)'
  details: |
    De-novo curation of Fanconi-ichthyosis-dysmorphism (FID) syndrome / Deal-Barratt-Dillon syndrome, seeded from the ICD-11 Foundation entity icd11f:235762608.

    Key curation finding - FID is not an independent entity. The 1990 primary description (PMID:2206896; six consanguineous infants with renal Fanconi syndrome, ichthyosis, musculoskeletal anomalies, jaundice, diarrhoea and grey-platelet morphology, all dead by 6 months) was explicitly subsumed into the arthrogryposis-renal dysfunction-cholestasis (ARC) spectrum by the 2001 multicentre ARC series (PMID:11668108: "The association of Fanconi syndrome, ichthyosis, dysmorphism, jaundice, and diarrhoea has previously been reported as a separate syndrome: our observations indicate that it is part of the ARC spectrum"). ARC was subsequently shown to be caused by biallelic VPS33B (PMID:15052268) or VIPAS39/VIPAR (PMID:20190753) loss of function. The arthrogryposis-poor FID presentation is reconciled by PMID:16492441, which reports a VPS33B-null patient with ichthyosis, cholestasis and renal dysfunction but no arthrogryposis.

    Pathophysiology was therefore built as a single CHEVI-complex trafficking lesion with four organ arms: biallelic VPS33B/VIPAS39 loss -> loss of the VPS33B-VIPAR (CHEVI) tethering complex -> disrupted RAB11A-dependent apical recycling -> loss of apical-basolateral epithelial polarity, branching to low-GGT intrahepatic cholestasis, proximal tubular apical transport failure (renal Fanconi -> acidosis/dehydration), and intestinal malabsorption/diarrhoea; plus two lysosome-related-organelle arms, defective epidermal lamellar body biogenesis (-> stratum corneum barrier failure and ichthyosis; PMID:18347289, PMID:29409756) and failed platelet alpha-granule biogenesis (-> bleeding diathesis; PMID:16123220, PMID:25947942). 14 pathophysiology nodes, all carrying biological_scale tags.

    Nosology flag recorded as a discussion (fid_icd11_fanconi_anaemia_misparent): the ICD-11 Foundation entry defines FID as an association with "Fanconi anaemia" and places it under Fanconi anaemia. This is a homonym error - the primary literature, MeSH and MONDO all use "Fanconi syndrome" in the renal proximal-tubulopathy sense, and MONDO:0022948 is correctly classified under MONDO:0001083 Fanconi renotubular syndrome. The icd11f mapping is recorded as an exact label match with the parentage error documented in mapping_justification, in notes, and as a Fanconi anemia differential_diagnoses entry. Two further discussions record the molecular-confirmation knowledge gap (no FID proband has a confirmed genotype, the series predating VPS33B by 14 years) and a CHEVI-trafficking module candidate.

    No conforms_to asserted: no existing dismech module covers constitutive apical-trafficking failure (epithelial_barrier_dysfunction and intestinal_barrier_dysfunction model allergic and inflammatory barrier loss instead). Rationale recorded in fid_chevi_trafficking_module_candidate.

    Mortality is not curated as a phenotype: HP:0001522 (Death in infancy) sits outside the PhenotypeTerm enum (rooted at HP:0000118), matching the convention already used in Cardiomyopathy-Hypotonia-Lactic_Acidosis_Syndrome. It is carried on the terminal pathophysiology node and in clinical_burden instead.

    Snippet provenance caveat: several snippets are quoted from the cached full text of PMID:25239142 and PMID:20190753 rather than their abstracts. That full text is hard-wrapped with hyphenated word breaks, so some snippets begin or end mid-sentence at the nearest substring-verifiable boundary; each such snippet's explanation states what the complete sentence says.

    Validation: just validate passes (schema and term validation clean); reference validation reports 113/113 snippets verified against cached references. 14 new PMID cache files were fetched via just fetch-reference and all are cited. cache/ CSV changes are pure insertions and just check-cache-order reports canonical order. Spurious reference_id re-quoting churn that the local reference validator introduced across roughly 7600 unrelated references_cache files was reverted and is not part of this change.

  summary: Bound the low-GGT rule with high-GGT counter-evidence; verify GeneReviews
    baseline
  details: |
    Two corrections found by following up on the PR #7833 reviewer's note that the GeneReviews baseline check was author-attested rather than reviewer-confirmed.

    1. GeneReviews claim verified (it had been asserted without being run). The prior notes stated "No GeneReviews chapter exists for ARC syndrome, VPS33B or VIPAS39 (checked 2026-08-02)". That check had not actually been performed when the claim was written - the reviewer was right to flag it. It has now been run against the GeneReviews bookshelf and the claim holds: no dedicated chapter exists for ARC syndrome, VPS33B or VIPAS39. The notes now record that the verification was performed and that the earlier assertion preceded it.

    2. The low-GGT rule was over-claimed; added counter-evidence. Verifying the GeneReviews question surfaced PMID:24782640 (Wang, Zhao & Li, World J Gastroenterol 2014), "ARC syndrome with high GGT cholestasis caused by VPS33B mutations" - a genotype-confirmed ARC patient (compound heterozygous VPS33B c.403+2T>A / c.1509-1510insG) with HIGH GGT on three consecutive tests alongside otherwise typical arthrogryposis, renal involvement and ichthyosis. The paper concludes ARC "cannot be excluded from the differential diagnosis of neonatal cholestasis even if high GGT activity is found."

    The entry previously called low/normal GGT "the single most useful discriminating laboratory finding" and "the pivotal biochemical clue", and the biliary-atresia differential asserted flatly that "GGT is elevated in biliary atresia and normal or low in ARC-spectrum cholestasis". As written that risked being read as exclusionary, which could contribute to a missed diagnosis. Softened to a rule-in rather than rule-out framing in all three places, with PMID:24782640 cited as supports: PARTIAL counter-evidence on the biochemical, diagnosis and differential_diagnoses blocks, and a dedicated notes paragraph recording that the mechanism of the raised GGT in that case is unexplained.

    Validation: just validate green; 133/133 snippets verified against cached references (was 130); one new reference cache file (PMID:24782640), cited three times.

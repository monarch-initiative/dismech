  details: |
    Addresses the automated CHANGES_REQUESTED review on PR 8773 (2 IMPORTANT, 3 SUGGESTION). The reviewer scored the entry 97.0 percent weighted compliance with 130/130 snippets verified and called both blocking items mechanical.

    BLOCKING 1 (fixed). treatments[0] "Multidisciplinary supportive and surveillance care" carried therapeutic_modality BEHAVIORAL, contradicting the CREATE history record in the same PR, which stated the modality had been changed to OTHER. The intended edit was written during the earlier review pass but silently failed to apply: it was one substitution inside a multi-substitution python patch whose only assertion was that the file changed overall, so the individual miss was not caught. The YAML now reads OTHER, which is also substantively right, since echocardiographic surveillance plus ophthalmological and nutritional management is not a behavioral, dietary, or lifestyle intervention, and CLAUDE.md warns specifically against tagging supportive-care terms BEHAVIORAL. The append-only CREATE history record was left untouched.

    BLOCKING 2 (fixed). The GeneReviews Management section had been mined for multidisciplinary care, annual echocardiography, and fluoroquinolone avoidance, but not for the beta-blocker / angiotensin-receptor-blocker aortic protection those surveillance recommendations exist to trigger. Added a new treatment, "Beta-blocker or angiotensin receptor blocker aortic protection": treatment_term NCIT:C15986 Pharmacotherapy, therapeutic_agent NCIT:C29576 Beta-Adrenergic Antagonist and NCIT:C66930 Angiotensin II Receptor Antagonist, therapeutic_modality SMALL_MOLECULE, and target_mechanisms INHIBITS against the "Progressive Aortic Root Dilation" node. The target is deliberately the dilation node rather than the microfibril or TGF-beta node, because both drug classes act on hemodynamic load borne by the weakened wall rather than on the upstream lesion; the contested ARB-attenuates-TGF-beta hypothesis is named in the description as not asserted, since it is disputed in the Marfan literature and has never been examined in MFLS. Both evidence items are PARTIAL with the same Marfan-extrapolation caveat applied to the other GeneReviews-derived items. GeneReviews' caution that calcium channel blockers and ACE inhibitors lack direct efficacy or safety evidence in Marfan syndrome is recorded in notes, and those classes are deliberately not listed as agents.

    SUGGESTION 3 (taken). Added a "Genetic counseling" treatment (NCIT:C15240) evidenced by the GeneReviews 50 percent transmission-risk sentence. This one transfers more cleanly than the clinical-characteristics content previously declined, because the figure follows from autosomal dominant inheritance, which this entry independently curates and evidences, rather than from any Marfan-specific observation. Still PARTIAL, because the quoted sentence names Marfan syndrome.

    SUGGESTION 4 (taken, and it corrected an error of mine). The reviewer flagged HP:0002616 for reported dilation and noted that PR 8771 hit a related segment trap between HP:0002616 and HP:0004970. Both axes were checked against the ontology. SEGMENT: the sources report the aortic bulb / aortic root, the sinus-of-Valsalva segment, so HP:0002616 is correct and HP:0004970 Ascending tubular aorta aneurysm would be wrong. SEVERITY WORDING: HP:0002616's own definition is "An abnormal localized widening (dilatation) of the aortic root", so the term already means dilatation. That makes the previous ontology note wrong where it claimed HPO has no dilation term at this site and implied a term request might be needed. The note was rewritten to state both checks explicitly, and no HPO NTR is warranted.

    SUGGESTION 5 (declined, with reasoning). Astigmatism HP:0001133 and flexion contracture HP:0001371 remain uncurated. The reviewer called these defensible under the entry's own denominator argument and requested no action. Astigmatism appears in a single proband as myopic astigmatism and is already represented by the curated Myopia phenotype quoting the same clinical sentence; adding it separately would double-count one observation. Flexion contracture is surfaced by the deep-research report from a review's prose contrasting hypermobility with contractures in some patients, not from a molecularly confirmed MFLS case report, so there is no verifiable primary source to quote.

    Validation actually run, with output read: "just validate" passed; "just validate-terms" passed, including both newly added NCIT drug-class terms; "just count-verified-snippets" reported 133/133 snippets verified against cached references, up from 130 before these edits; "just validate-disorders", the check CI runs, passed with the same 133/133; "just check-snippet-length" passed; "just check-title-snippets" reported no new title-quoting snippets; "just check-duplicate-keys" clean; the conforms_to, unique-name, model-readout, evidence, and treatment subset of tests/test_data.py passed (8235 passed, 24947 deselected); "just compliance" reports 100 percent on every aggregated path except discussions proposed_experiments evidence and datasets, which are proposals and correctly carry none. Both candidate GeneReviews snippets were confirmed as exact substrings of references_cache/PMID_20301510.md before being written into the YAML.

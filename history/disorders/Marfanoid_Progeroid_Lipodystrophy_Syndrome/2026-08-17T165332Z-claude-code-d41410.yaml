  summary: 'Create: Marfanoid-Progeroid-Lipodystrophy Syndrome (MFLS, FBN1)'
  details: |
    New root entry for MONDO:0014831 (progeroid and marfanoid aspect-lipodystrophy syndrome / MFLS / MPLS), fulfilling issue 8544.

    Deep research: falcon (Edison), research/Marfanoid_Progeroid_Lipodystrophy_Syndrome-deep-research-falcon.md. NEC preflight "just preflight-dr <report> MONDO:0014831" returned PASS (FBN1 the dominant gene at 31 mentions; the report's OMIM 616914 matches the MONDO xref). The report's own reference_validation frontmatter reported 6/6 references verified, confabulation_rate 0.0, and no unresolved_references. The report was nevertheless used as leads only: every PMID, snippet, and ontology term cited in the entry was independently fetched with "just fetch-reference" and verified against the cached record.

    Mechanism modeled as two distinct chains sharing one origin, per the issue's guidance. Arm 1, the microfibril/TGF-beta arm shared with classic Marfan syndrome, is expressed as conforms_to against three nodes of aortopathy_tgfbeta_dysregulation (ECM/contractile-apparatus defect, TGF-beta signaling dysregulation, progressive aortic dilation). Arm 2, unique to this entity, runs loss of furin cleavage at the profibrillin C-terminus to asprosin deficiency, then in parallel to reduced hepatic glucose release with preserved insulin sensitivity and to reduced central orexigenic drive, converging on congenital generalized lipodystrophy. Conformance to the module's aortic dissection/rupture node was deliberately NOT asserted: no dissection has been reported in MFLS, at least one molecularly confirmed patient had a normal aortic root through nine years of follow-up, and the published denominator is roughly eight to nine patients. A KNOWLEDGE_GAP discussion records that reasoning. Marfan_Syndrome is cross-referenced in the description and in differential_diagnoses rather than duplicated.

    Three discussions curated: a HUMAN_MODEL_MISMATCH (existing FBN1 knockout and dominant-negative Marfan mouse models cannot recapitulate the MFLS genotype-phenotype relationship, and their metabolic phenotype runs opposite to the human one, so metabolic findings from them must not be transferred here), plus two KNOWLEDGE_GAPs (the unresolved split between hypophagia, a cell-autonomous adipogenic block, and a matrix-mechanical block as causes of the lipodystrophy; and the unknown aortic dissection risk).

    Frequency discipline: `frequency:` is asserted on exactly two of the 26 phenotypes (congenital generalized lipodystrophy and progeroid facial appearance, both VERY_FREQUENT), because the 2016 defining review states both were present in all seven of its patients. A first draft assigned VERY_RARE and OCCASIONAL bands to six further phenotypes; those were removed on self-review because the arithmetic contradicted them (one case out of roughly eight to nine is ~11-12 percent, not the 1-4 percent VERY_RARE band) and because most reports do not state which investigations were performed, so a feature seen once has an unknown denominator rather than a small one. Per docs/frequency-evidence-guidelines.md the band was omitted rather than guessed.

    Two named-entity hazards are documented in notes. First, the "neonatal progeroid syndrome (NPS)" label used throughout the asprosin literature is also the name of Wiedemann-Rautenstrauch syndrome, a distinct disorder; every NPS-labelled evidence item was checked to be about patients carrying 3'-terminal FBN1 truncating variants. Second, the older case reports number the causal exon 64 while the asprosin papers and the 2023 Japanese case report use NM_000138.5 and number the same region exons 65-66 with the splice variants in intron 65; the entry describes the region positionally and quotes each source in its own convention.

    A pre-PR red-team review pass was run against the draft (dismech-pr-review conventions) and its findings were acted on before the first commit. Fixes made in response: one CI-blocking under-five-word snippet was replaced with the full source clause; a missing causal edge was added from the microfibril/ECM defect node to the congenital lipodystrophy node, because the draft made postnatal hypophagia the SOLE modelled cause of a phenotype the entry calls congenital; two TGF-beta edges were downgraded from SUPPORT/DIRECT to PARTIAL/INDIRECT because the cited review sentence is hedged ("potential causes") and speaks of adipose rather than aortic tissue; the FBN1-Related Marfan Syndrome GeneReviews chapter, previously tagged but unmined, was mined for the multidisciplinary-care and annual-echocardiography recommendations that the supportive-care treatment extrapolates from, plus its fluoroquinolone agents-to-avoid caution, all marked PARTIAL since they are classic-Marfan recommendations untested in MFLS; the generalized-versus-partial lipodystrophy disagreement between the clinical case reports and the asprosin papers was recorded in notes with the reason for choosing generalized; the low-fibrillin premise of the adipogenic hypothesis was flagged as being in tension with this entry's own non-haploinsufficiency thesis; the hepatic node was rebound from GO:0006094 gluconeogenesis to the broader GO:0006006 glucose metabolic process, since the evidence says glucose "release" (glycogenolysis plus gluconeogenesis); the de novo inheritance claim was softened from "every molecularly characterized case" to the reported subset; a normal-adipogenesis in vitro observation was downgraded to PARTIAL; the supportive-care modality was changed from BEHAVIORAL to OTHER; and the two surviving VERY_FREQUENT explanations were rewritten to say why 7/7 does not justify OBLIGATE (the defining review selected its series on those two features, so full penetrance would be an ascertainment artifact). The reviewer confirmed no NEC contamination, no title-as-finding snippets, and clean foreign-key integrity.

    Validation actually run, with output read: "just validate" passed; "just validate-terms" passed; "just count-verified-snippets" reported 130/130 snippets verified against cached references; "just check-title-snippets" reported no new title-quoting snippets; "just check-duplicate-keys" clean; "just check-snippet-length" passed after the fix above; the conforms_to, foreign-key, model-readout, and evidence subset of tests/test_data.py passed (10347 passed, 22835 deselected), as did all 23 tests in tests/test_history_schema.py. One unrelated failure, tests/test_render_prune_orphan_pages.py::test_prune_keeps_a_differently_named_page_that_is_the_same_file, reproduces on a clean main checkout and is not caused by this change. "just validate-disorders" was run once as the final pre-PR sweep, which is the check CI runs.

scussions with proposed experiments. Validated: just validate, validate-terms, check-duplicate-keys, check-entity-refs, check-snippet-length, check-snippet-grading, check-title-snippets, check-folded-hyphens, validate-disorders all pass; 140/140 snippets verified; check-snippet-grading added to the loop after the review caught its omission.

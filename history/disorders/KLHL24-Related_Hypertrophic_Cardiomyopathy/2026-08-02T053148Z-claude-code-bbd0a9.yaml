  summary: Address reviewer suggestions on KLHL24 CMH29 entry
  details: |
    Response to the automated review on PR #7851. The 🟡 IMPORTANT finding
    (missing research/ deep-research artifact) is being handled separately at
    the batch level and is not addressed here. The three 🔵 SUGGESTION items
    and two additional defects found during the response pass were addressed.

    1. evidence_source on PMID:41348940 (Ramovs et al., Cardiovasc Res 2025).
       Two of the three snippets from this paper were retagged IN_VITRO ->
       OTHER, as the reviewer suggested.
       - The AIMS sentence "KLHL24 is a component of the ubiquitin-proteasome
         system and acts as a substrate-specific adaptor protein for E3
         ubiquitin ligase" (cited under Loss of CUL3-KLHL24 Substrate Adaptor
         Function) is background framing of established biology, not a result
         of the study's own hiPSC work.
       - The fibrotic-signature sentence "KLHL24mut resulted in a reduction of
         several intermediate filaments (IF), mitochondrial and muscle fibre
         proteins as well as the emergence of an early fibrotic signature"
         (cited under the fibrosis/inflammation node) is a mixed-source
         proteomic result: the abstract states the authors integrated proteomic
         analyses of patient heart tissue with hiPSC models and that the
         hiPSC-CM mass spectrometry mirrored the corresponding left-ventricle
         tissue profile. Rather than splitting the item, which would require
         inventing two snippets neither of which is single-source in the
         abstract, the item was retagged OTHER and the explanation now states
         the mixed sourcing verbatim.
       - The third snippet (desmin/synemin/vimentin, prefaced in the abstract
         by "By utilising various hiPSC-derived cardiac models") is
         unambiguously hiPSC-derived and remains IN_VITRO.

    2. GeneReviews baseline. Confirmed by running the reviewer's suggested
       E-utilities query on 2026-08-01: `KLHL24 AND GeneReviews[book]` returns
       exactly one record, PMID:20301543, which is the Epidermolysis Bullosa
       Simplex chapter covering the dominant start-codon KLHL24 disease (EBS6,
       MONDO:0015006), not this recessive cardiomyopathy. No KLHL24
       cardiomyopathy chapter exists, so skill item 15 requires no citation.
       A NO GENEREVIEWS BASELINE EXISTS paragraph was added to the entry
       description recording the query, the date, the returned PMID and why
       that chapter is not a baseline here, so the check is not re-litigated.

    3. HP:0034835 in both phenotypes: and histopathology:. No change, per the
       reviewer's explicit adjudication that the duplication should be kept.

    4. NEW - ancestry versus author affiliation. Four ancestry descriptors were
       being applied to the four post-founding reports. Two are supported by
       the cached text: PMID:36672924 says "consanguineous Middle Eastern
       families" and PMID:40176835 says "Brazilian family". Two were not:
       PMID:42158087 describes only "two siblings in a non-consanguineous
       family" (the only "Chinese" in the cached full text is an in-house
       Chinese variant-frequency database used for filtering) and PMID:41823911
       describes only "a 16-year-old asymptomatic young man". The "Chinese" and
       "Indian" labels were therefore derived from the Chengdu and
       Thiruvananthapuram author affiliations, which is not an ancestry
       annotation. All five occurrences were rewritten to reporting-centre
       framing ("reported from China", "reported from India", or reference by
       PMID), the prevalence note now says "geographic distribution of reports"
       rather than "reported ancestry distribution", and an ANCESTRY VERSUS
       REPORTING CENTRE paragraph was added to the description stating which
       two reports do and do not state descent.

    5. NEW - full-text provenance for the founding families' descent. The
       description asserted the founding families were "one Iraqi and one
       Iranian" without inline provenance, and only the abstract of
       PMID:30715372 is cached. The claim is correct - the open-access full
       text (PMC6812045, re-read 2026-08-01) says "two families with autosomal
       recessive cardiomyopathy originating from Iraq (family A) and Iran
       (family B)" and tabulates per-individual "Descent" in Table 1 - so the
       existing full-text disclosure in the description was widened from
       "histological and ultrastructural detail" to also cover clinical-table
       and demographic detail, and quotes the two supporting full-text spans
       directly. No claim was relocated into notes: to escape checking.

    Also spot-verified with OAK that every "verified with OAK" note in the

  summary: 'Create: KLHL24-Related Hypertrophic Cardiomyopathy (CMH29, MONDO:0859372)'
  details: |
    New entry for cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies (MONDO:0859372, OMIM:620236, KLHL24 / hgnc:25947). NEC preflight run with OAK before writing: runoak info MONDO:0859372 confirms the OMIM:620236 xref, is_a MONDO:0024573, and RO:0004003 HGNC:25947 - KLHL24, not PRKAG2. This fills the gap recorded in the NEC scoping note of kb/disorders/PRKAG2_Cardiac_Syndrome.yaml, which documented that MONDO:0859372 had been wrongly proposed as the PRKAG2 target and remained uncurated. Mechanism curated: biallelic loss-of-function KLHL24 variants in the BACK and Kelch domains destroy CUL3-RBX1-KLHL24 substrate-adaptor function, desmin intermediate filament turnover fails, and cardiomyocytes accumulate desmin, glycogen, sarcoplasmic-reticulum-derived tubules and diastase-resistant polyglucosan bodies. The pathogenesis of the polyglucosan is explicitly unknown and is recorded as a HYPOTHETICAL node plus an open knowledge gap. The allelic contrast with dominant start-codon KLHL24 gain-of-function disease (EBS6, MONDO:0015006, OMIM:617294) and the differential against PRKAG2 cardiac syndrome (MONDO:0800484) are curated in full. Corrections made during curation: MedGen C5774308 lists Muscle weakness HP:0001324 as a clinical feature, but the HPO annotation file records it at 0/8 and the primary paper states weakness was absent, so it is not curated as a phenotype. Frequency bands are omitted from every phenotype because the cohort is a single two-family series with denominators between 2 and 11. No ICIMD metabolic classification is asserted. Validation: just validate PASS, validate-terms PASS, validate-references 67/67, check_snippets_verbatim 67/67, check_folded_hyphens OK, pytest tests/test_data.py PASS.

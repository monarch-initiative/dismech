  summary: 'Fix: KLHL24 CMH29 verifier findings - term bindings and unsourced prose'
  details: |
    Adversarial-verifier fix pass on the CMH29 entry.

    TERM BINDINGS. The implantable cardioverter-defibrillator treatment was rebound from the branch-root NCIT:C49236 Therapeutic Procedure to NCIT:C80435 Implantable Cardioverter-Defibrillator Placement, and heart transplantation from NCIT:C15289 Organ Transplantation to NCIT:C15246 Heart Transplantation. Both were verified with OAK and both are already the repository convention. The notes: block that had rationalised the generic ICD binding by asserting that the NCIT clinical-action branch carries no defibrillator implantation term was false; it has been replaced with the actual commands run and their output.

    PHENOTYPE COVERAGE. Added HP:0031319 Cardiomyocyte hypertrophy (2/2) and HP:0034532 Increased myocardial glycogen content (2/2), both present in the HPO annotation file for OMIM:620236 and previously omitted without disclosure, plus HP:0034835 Cardiac polyglucosan accumulation as a curator addition for the feature that names the OMIM entity. HP:0034766 Muscle fiber polyglucosan inclusion bodies was considered and deliberately not used, because the founding paper reports polyglucosan in cardiomyocytes only and describes the skeletal muscle accumulation as glycogen, desmin and tubular structures. A new entry-level note accounts for all 13 HPO annotations.

    PROSE CORRECTIONS, CHECKED AGAINST THE PMC6812045 FULL TEXT. "The nine known polyglucosan-storage genes" corrected to the founding study's nine-gene screening panel; the canonical set in PMID:26278982 is eight, and the entry's own snippet says so. Coextensiveness of the nine-gene panel with the eight-gene review set is no longer asserted. "Roughly half of clinically diagnosed HCM" weakened to "up to 50 percent" to match the attached snippet. The MONDO:0005045 relationship restated as two is_a hops rather than "distant". The surviving Iraqi sibling's ejection fraction of 50 percent is now explicitly tied to the echocardiogram recorded at age 28 rather than stated as a bare age. The desmin immunoblot control caveat rewritten to match the Figure 5 legend: control 3 is a normal heart, control 4 is a cardiomyopathy explant with an expected moderate upregulation of desmin. Deleted an unsourceable characterisation of what the 71 PubMed records contain.

    VERIFIER CLAIMS REJECTED AS WRONG. Four flagged claims verify against the PMC6812045 full text and were kept: the immunoblot control caveat (Figure 5 legend states it), the LVEDV 30 to 47 mL range attributed to the Iranian family (Table 1 Family B values are 37, 40, 37, 30, 47), the "her brother" sex attribution (Table 1 gives III:2 female with transplant at 26, III:1 male), and the "majority of both type 1 and type 2 fibres in all three individuals biopsied" quantifier (Results text plus Figure 3 legend).

    VALIDATION. just validate PASS; just validate-terms PASS; check_snippets_verbatim 67/67; check_folded_hyphens OK; check_snippet_length --against-ref origin/main OK; pytest tests/test_data.py all passed.

  summary: 'Close the three self-identified weaknesses: limb mechanism, natural history,
    and a third domain-level review'
  details: |
    Closing the three weaknesses this curation had named against itself, rather
    than shipping with them as caveats.

    WEAKNESS 1 - THE LIMB MECHANISM WAS THIN, AND IT IS THE LESION THE DISEASE
    IS NAMED FOR. The entry previously said no cited source traced a path from
    either transcription factor to the human radioulnar interzone, and offered
    only Hoxa11/Hoxd11 zeugopod mispatterning as context. A targeted search
    found PMID:20978074 (Koyama/Pacifici, Development 2010), which is
    substantially closer to the human lesion than anything previously cited:
    mouse embryos lacking all Hox11 paralogues have specifically remodelled
    elbow joints, and "the proximal ends of developing mutant ulna and radius
    elements became morphologically similar and formed an anatomically distinct
    elbow joint" - the same joint, at the same end of the same two bones, that
    RUSAT fuses. The paper concludes Hox11 genes "dictate joint identity,
    morphogenesis and anatomical and functional organization" in the zeugopod.

    The same source also supplies a citation for the interzone biology the node
    description had been asserting from general knowledge: joint formation
    initiates with an interzone of flat, tightly packed mesenchymal cells
    demarcating the boundary between adjacent cartilage anlagen. A node that
    describes a mechanism should not rest on unsourced background.

    Two caveats are recorded rather than smoothed over: the demonstration is a
    triple-paralogue mutant, not a single heterozygous allele, and a remodelled
    joint identity is not the same event as a failure to separate. Both are in
    the node description and in the evidence explanations, and the items are
    graded INDIRECT.

    The asymmetry between the two genes is now stated explicitly instead of
    being averaged away. HOXA11 has directly relevant joint data; MECOM has
    expression data plus human genetics, and the one experiment that could have
    supplied a MECOM limb mechanism - the patient-allele knock-in mouse -
    returned normal forelimbs.

    WEAKNESS 2 - NO `progression:` BLOCK, in an entry whose central clinical
    message is that tempo varies enormously. Added, in four phases with their
    own evidence: prenatal/perinatal (hydrops, neonatal death, and the fact
    that neither reported hydrops case had the synostosis or was suspected
    before sequencing); neonatal presentation (thrombocytopenia from birth,
    amegakaryocytic marrow, diagnosis usually by sequencing rather than
    clinical recognition); infancy and early childhood, curated as the branch
    point where the course either progresses to transplant between 4 and 18
    months or resolves spontaneously through somatic reversion; and adulthood,
    where untransplanted carriers either stay mildly affected into the seventh
    decade or accumulate clonal haematopoiesis and progress to MDS. The last
    phase carries the source's own surveillance recommendation, and is the
    reason it is curated separately rather than folded into the childhood
    course.

    WEAKNESS 3 - NEITHER CURATOR NOR AGENT IS A CLINICIAN OR GENETICIST. A
    third independent review was commissioned, framed as a domain expert
    (clinical geneticist / paediatric haematologist working on inherited marrow
    failure) rather than as a curation-rubric check, and explicitly told not to
    repeat the first two passes. Its brief: is anything medically or genetically
    wrong; is anything a specialist would expect missing; is the mechanism
    biologically credible end to end; is the confidence calibration right; and
    are the four differential diagnoses the right four with the discriminators
    a clinician actually uses. Its findings and their disposition are recorded
    in the next history record.

    NOT ADDED. `mappings:` with OMIM identifiers was considered and left out:
    the schema's mapping slots are MONDO-oriented, both subtype MONDO terms are
    already bound as `subtype_term` (which counts as curated coverage per
    CLAUDE.md), and there is no clean slot for a bare OMIM id. The identifiers
    605432 and 616738 appear in a quoted snippet in the entry, so they are
    findable; a dedicated mapping would need a schema question answered first.

    VERIFICATION. `just validate` passes; 186/186 snippets verified. Compliance
    97.1% (368/379) - the denominator grew with the progression block, which is
    the expected direction.

  summary: 'Review: connect two orphan phenotypes to the MECOM developmental node
    (IUIS Table 9)'
  details: |
    Global developmental delay and failure to thrive had no incoming edge. Both now attach to Multi-Organ Developmental MECOM Requirement, the node the entry already built to collect the extra-haematopoietic malformations.

    That node's own description warns it is deliberately coarse and that no source traces a pathway from EVI1 targets to any individual lesion; the developmental-delay edge notes the caveat applies with extra force there, since it is the least anatomically localised finding in the group. The failure-to-thrive edge records that placing it here does not exclude a haematologic contribution - the cited cohorts do not separate the two. 202/202 snippets verify.

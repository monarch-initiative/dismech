  summary: 'Act on a domain-expert review: ClinGen gradings, transplant donor screening,
    THPO-CAMT, and a nomenclature error'
  details: |
    A third independent review, framed as a clinical geneticist / paediatric
    haematologist rather than a curation-rubric check and told not to repeat
    the first two passes. Its verdict was that the mechanism is credible end to
    end and the calibration systematically good, but that the entry was not
    publishable as-is. It named four must-fix items. All four are fixed here.

    1. HOXA11-RUSAT1 IS GRADED `Limited` BY CLINGEN, AND THE ASSERTION WAS
    ALREADY IN THIS REPOSITORY. The HOXA11 `review_notes` had said: "There is
    no ClinGen gene-disease validity assertion cited here for HOXA11 in RUSAT.
    If one exists and grades this below Definitive, this field should be
    revisited rather than defended." It exists, it grades it Limited - the
    lowest non-disputed tier - and it was sitting in `cache/clingen/
    gene_validity.csv` the whole time. The same file grades MECOM **Definitive**
    for MECOM-associated syndrome. Both assertions were built into citable
    cache records with `just clingen-rebuild` and are now cited as structured
    evidence.

    The correction runs through the entry: the disease description said "Two
    genes are established" and now leads with the asymmetry; the HOXA11
    `review_notes` records the grading and explains why `CAUSATIVE` is retained
    (the schema has no tier between CAUSATIVE and UNKNOWN, and UNKNOWN would
    understate real segregation and functional data) while stating that it
    should be read as "asserted in the literature", not "established"; the
    RUSAT1 subtype carries the grading. Notably the evidence profile the entry
    had already assembled - two families, one equivocal in-vitro follow-up, a
    negative screen in a seven-family cohort, nothing in 25 years - is exactly
    what earns Limited. The reasoning was right and the label was wrong.

    2. NOTHING SAID RELATED TRANSPLANT DONORS MUST BE GENOTYPED. For a
    dominantly inherited marrow failure syndrome with documented transmission
    through minimally affected parents, transplanting from an unscreened
    HLA-matched sibling risks graft failure and transferring the disease - and
    this entry's own somatic-reversion finding sharpens it, because a carrier
    donor's counts can normalise and be under-called on blood exactly as a
    proband's can. The entry stated that caution for the proband and never
    applied it to the donor. The recommendation was quotable verbatim from
    PMID:37067177, already cited eleven times here. Added to the transplant
    treatment, with the germline-mosaicism point (targeted sibling testing even
    after a de novo result) and cord-blood banking added to counselling.

    3. THE CAMT DIFFERENTIAL WAS GENETICALLY INCOMPLETE IN A WAY THAT CHANGES
    TREATMENT. The entry said CAMT "is caused by biallelic MPL variants" and is
    curable "only by transplant". Biallelic THPO variants cause the same
    picture and respond to romiplostim, with trilineage responses and
    transfusion independence sustained for years (PMID:29191945), whose own
    conclusion is that recognising these patients prevents unnecessary
    transplant. So the false statement pointed at the one subset where going
    straight to transplant is wrong. Corrected, with the pre-panel
    discriminators a clinician actually uses added: family history, and serum
    thrombopoietin - high in MPL-CAMT because MPL is its own ligand's clearance
    receptor, low in THPO-CAMT.

    4. A NOMENCLATURE ERROR IN THE SENTENCE WRITTEN TO PREVENT NOMENCLATURE
    ERRORS. The variant record said EVI1 p.Arg750Trp "appears in some cohorts
    as p.Arg938Gln-style MDS1-EVI1 coordinates". The offset of 188 is right but
    the residue is not: it is p.Arg938**Trp**. Worse, p.(Arg938Gln) is a real
    and different allele in a cited cohort (c.2813G>A, EVI1 p.Arg750Gln), so
    the note conflated the two variants it existed to distinguish.

    ALSO FIXED FROM THE SAME REVIEW: the claim that HOXA11 and MECOM share a
    "dual requirement" in limb and blood, which the evidence supports for MECOM
    and not for HOXA11 - whose haematopoietic role is inferred largely from
    this disease plus one equivocal assay, with Hoxa11-null mice showing limb,
    kidney and reproductive phenotypes and no reported marrow failure. The
    reviewer named this as the clearest instance of lay reasoning producing a
    tidy story the evidence does not carry, and it is now stated as the
    asymmetry it is. Also added: the NCI IBMFS natural history study
    (NCT00027274) as a clinical trial, curated with an explicit note that RUSAT
    is not among its named conditions and is included under its generic IBMFS
    category - an eligibility inference, not a claim of enrolment.

    A `conforms_to` declaration against `stem_cell_exhaustion` was considered
    and rejected: that module is explicitly the Lopez-Otin aging hallmark,
    categorised AGING, with a chain running accumulated damage to regenerative
    failure. RUSAT's deficit is constitutive from conception with nothing
    accruing, so conformance would assert a shared aetiology on the strength of
    a shared endpoint. Recorded in `notes` with the one place the two do meet.

    PROCESS NOTE. Two YAML breakages and one silently discarded edit batch
    occurred during this round, all caught by parsing and grepping the file
    after every write rather than trusting the edit script. The discarded batch
    was the same failure mode recorded in the 191201Z record - a guarded
    replacement raising before the single write at the end. Editing now writes
    after each individual replacement, so a later failure cannot discard an
    earlier success.

    194/194 snippets verified. `just validate` passes.

  details: |
    De novo curation of RUSAT (MONDO:0011555), an inherited bone marrow failure
    syndrome pairing congenital proximal radioulnar fusion with an
    amegakaryocytic marrow. Curated as one entry with per-gene detail, per the
    lump decision recorded in the stub it replaces; the stub was deleted in the
    same change. Claim issue #10599.

    METHOD. Curated from primary literature first, with one falcon (Edison)
    deep-research run used afterwards as a gap-finder rather than as a source.
    Every claim taken from the report was re-derived from a re-fetched cached
    reference and quoted from that cache, not from the report.

    DEEP RESEARCH. research/Radioulnar_Synostosis_with_Amegakaryocytic_Thrombocytopenia-deep-research-falcon.md
    (falcon/Edison, 1104 s, 32 citations). Its own validation was clean: 6/6
    references resolved, 0 unresolved terms, 3 of 6 terms unverifiable only
    because they carry Orphanet and OMIM prefixes with no configured resolver.
    Only 1 of 6 references scored on topic with 0 off topic, so the remaining 5
    were undecided rather than rejected. The report cites by author-year key;
    its six recoverable DOIs all resolved to papers already curated
    independently from PubMed, which is a convergence signal rather than new
    material.

    What the report actually contributed was one substantive gap:
    PMID:38662475 (Venugopal 2024), somatic genetic rescue by copy-neutral 3q
    loss of heterozygosity. That yielded two pathophysiology nodes (revertant
    clone selection, age-related clonal haematopoiesis), two discussions, the
    non-haematopoietic-tissue testing recommendation, the aortic root
    dilatation phenotype, and the pregnancy-loss knowledge gap. None of it was
    in the primary-literature pass. The report's own remaining content
    (orthopaedic derotational osteotomy, general supportive care) was not
    curated because it is extrapolated from congenital radioulnar synostosis
    generally rather than RUSAT-specific, which the report states.

    PREFLIGHT. `just preflight-dr <report> MONDO:0011555` returned SKIP, not
    PASS: MONDO records no causal gene (RO:0004003) for MONDO:0011555, so the
    automated gene-identity check cannot discriminate - the same failure mode
    recorded in PR #10174 for BMFS6. The manual fallback was done and is
    reported here rather than assumed: the report's gene mentions were
    MECOM=48, HOXA11=25, MPL=9, and its OMIM identifiers were 605432 and
    616738, which are RUSAT1 and RUSAT2. Both genes and both OMIM entries are
    correct for this MONDO term.

    EVIDENCE. 161 of 161 snippets verified against the reference cache; no
    prefix skipped, all references are PMIDs, no DOI- or PPR-keyed items, so
    nothing relies on the validator's skip list. 18 references in the
    top-level block. Three fetched references are deliberately uncited because
    their cache is content_type: unavailable and nothing in them can be
    quoted: PMID:30536840, PMID:35484980, PMID:29200407. PMID:11101832, the
    2000 Nature Genetics paper that founded RUSAT1, is in the same position, so
    the HOXA11 discovery claim is cited instead to PMID:16765069 and
    PMID:29519864, which both restate it quotably.

    Two evidence items are graded REFUTE against claims this entry itself
    makes, deliberately. PMID:16765069 reports that wild-type and mutant
    HOXA11 behaved almost identically in the megakaryocytic differentiation
    readout and attributes the effect to non-homeodomain sequences, which
    argues against the sufficiency of the DNA-binding defect for that
    phenotype. PMID:37099686 reports normal forelimbs in the patient-allele
    knock-in mouse, which refutes that model for the skeletal node.

    MECHANISM. Fourteen pathophysiology nodes in a connected chain from either
    germline lesion to the phenotypes, with edge-level evidence on every edge.
    Two ALTERNATIVE mechanistic hypotheses are recorded rather than resolved:
    pure haploinsufficiency (supported by the knock-in mouse behaving like a
    null in haematopoiesis) versus a domain-specific effect of the zinc-finger
    8/9 missense alleles (supported by the human genetics, where truncating and
    whole-gene-deletion alleles - which remove more protein - give marrow
    failure without the synostosis those missense alleles produce). Six
    discussions, including a HUMAN_MODEL_MISMATCH for the mouse's absent
    synostosis and an INTERPRETATION recording that the disease name is
    disputed in two directions (MECOM-associated syndrome; RUSHD).

    SCOPE LIMITS TAKEN. No leukaemia node: MECOM's AML association is somatic
    overexpression, the opposite direction of effect from germline loss.
    Myelodysplasia and clonal haematopoiesis are curated with their published
    denominators (4 myeloid malignancies of 80 individuals) and no germline
    predisposition figure is asserted. No `frequency:` on any phenotype -
    the cohorts are small, differently ascertained and overlapping, and the
    largest states no manifestation is present in all patients. No
    `datasets:` - `just discover-datasets` returned 12 candidates, all
    GENE_ONLY and zero DIRECT, leading to prostate cancer and keloid
    fibroblasts via MECOM and HOXA11 respectively; that is Named Entity
    Confusion reached through gene search, and the reasoning is recorded in
    the entry `notes`.

    VALIDATION. `just validate-disorders` passes (exit 0). `just validate`,
    `just validate-terms`, `just count-verified-snippets` 161/161,
    `just check-entity-refs`, `just check-causal-targets` (0 dangling, 0
    prefixed, 0 self), `just check-duplicate-keys`, `just check-qualifier-terms`,
    `just check-qualifier-terms-online`, `just check-enum-values`,
    `just check-folded-hyphens`, `just check-snippet-length`,
    `just check-title-snippets`, `just check-snippet-grading`,
    `just check-environmental-evidence`, `just check-source-defect-claims` and
    `just check-stubs` all report no findings for this file. Compliance 98.5%
    (334/339), weighted 98.8%.

    ONE CORRECTION DURING CURATION worth recording because no gate caught it:
    a pathophysiology `downstream` target was written as `Radioulnar
    synostosis` while the phenotype is named `Radioulnar Synostosis`. Bare-name
    pathograph targets match verbatim, so this would have drawn a phantom node
    and dropped the real phenotype from the graph without failing schema,
    term or reference validation. `just check-causal-targets` caught it.

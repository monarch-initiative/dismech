  summary: Fix evidence_source grading regression caught by check-snippet-grading;
    grade review articles consistently
  details: |
    A regression introduced by the previous session's own review fixes, caught
    by re-running the whole-KB gates against the corrected file rather than
    trusting the pre-fix run. Recorded because the failure mode is instructive.

    WHAT BROKE. The review round added a new pathophysiology node,
    Multi-Organ Developmental MECOM Requirement, and graded its evidence from
    PMID:37407873 as OTHER on the correct reasoning that the source is a review
    with no primary data. But the same quoted sentence -
    "Extra-hematopoietic manifestations of MECOM deficiency, including renal and
    cardiac anomalies, radioulnar synostosis, clinodactyly, and hearing loss,
    have been reported." - was already cited twice elsewhere in the file as
    HUMAN_CLINICAL. `check-snippet-grading` fired on exactly that: one sentence,
    two evidence_source values, in one file. Correct call by the gate.
    evidence_source classifies the cited publication, so it cannot change
    because the quote moved to a different claim.

    WHY IT HAPPENED. The review's finding on this point named one instance and
    I fixed one instance. The underlying fact - that PMID:37407873 is a Review
    with no primary data - applies to all 12 of its quotes in this entry, and a
    single-instance fix left 11 inconsistent with it.

    WHAT WAS DONE. All 12 PMID:37407873 evidence items are now OTHER. Two
    further review articles were audited the same way rather than waiting for a
    gate to find them: PMID:41635268 ("Syndrome of the Month") is a pure review
    and its 5 quotes are now OTHER; PMID:40170114 genuinely mixes a primary
    case report with a literature survey, so it is deliberately split - its own
    neonate case stays HUMAN_CLINICAL and its two literature-tally sentences
    ("A comprehensive review of literature indicated...", "Patients with
    missense mutations frequently exhibited...") became OTHER. That split is
    the pattern CLAUDE.md asks for when a paper mixes sources, and the gate
    permits it because it keys on the quoted sentence, not the PMID.

    The publication_types field in each cached reference was used as the
    ground truth for whether a paper is a review, not memory.

    NOTE ON PROCESS. The pytest run and whole-KB gate run reported in the
    previous session had both started before the review fixes were applied, so
    they described the pre-fix file. They were re-run rather than counted, which
    is how this regression surfaced. A green check against the wrong version of
    a file is worse than no check, because it is claimed as evidence.

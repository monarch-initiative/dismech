  summary: 'Classify: IUIS 2022 Table 9'
  details: |
    No classification change - the entry already carried iuis_category: bone marrow failure with cited evidence, correctly, as the MECOM deficiency row of IUIS 2022 Table 9. What changed is the notes on that assignment, which listed the class members as 'Fanconi anaemia, dyskeratosis congenita, Shwachman-Diamond, Diamond-Blackfan'. Two of those four are wrong. Shwachman-Diamond syndrome is in Table 5 (congenital defects of phagocyte number or function), and Diamond-Blackfan anaemia does not appear anywhere in the IUIS 2022 classification - both verified by reading Table 9 in full (lines 4104 to 4287 of references_cache/PMID_35748970.md). The error traces to an earlier version of the iuis_category enum description, fixed upstream in dismech#10107, and had propagated into curated content. Replaced with the actual Table 9 membership: Fanconi anaemia (22 rows), dyskeratosis congenita (14 gene rows), MIRAGE, ataxia pancytopenia syndrome, Coats plus, BMFS1/2/5, and MECOM deficiency itself, plus the table footnote recording MECOM as the single new inborn error of immunity added to Table 9 in 2022. The correction is dated and attributed in the note so it is not silently reverted. The reasoning about why Table 9 rather than Table 3, and the note that the B-cell defect segregates by variant region rather than by marrow-failure severity, are untouched. Separately, this entry was added to kb/groupings/Bone_Marrow_Failure_IEIs.yaml, which it should have been in since that grouping was created - it carried the classification but was never listed.

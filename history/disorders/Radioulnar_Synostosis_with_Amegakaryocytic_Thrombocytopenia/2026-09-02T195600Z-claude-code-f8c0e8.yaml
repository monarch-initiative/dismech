  summary: Re-parent the B-cell arm to the domain-specific lesion; add three missing
    differential diagnoses
  details: |
    The remaining two substantive findings from the domain-expert review, which
    that review classed as taking the entry "from good to genuinely
    authoritative" rather than as must-fix. Both were acted on because one is a
    mechanism error and the other is clinically consequential.

    THE B-CELL ARM WAS PARENTED WHERE THE EVIDENCE DOES NOT PUT IT. The edge to
    `B-Cell Developmental Arrest` ran from `Hematopoietic Stem Cell Maintenance
    Failure` - generic marrow failure. But the strongest genotype-phenotype
    signal in this disease, quoted three times in this entry, is that
    radioulnar synostosis and B-cell deficiency appear *only* with variants in
    one short C-terminal zinc-finger region, while truncating alleles and
    whole-gene deletions cause severe marrow failure without either. If the
    B-cell defect were downstream of generic HSC failure it would track
    marrow-failure severity; it tracks variant position instead. The reviewer
    called this the one place where the mechanism as drawn was arguably
    backwards, and that is right.

    The primary edge now runs from `Loss of EVI1 Sequence-Specific DNA Binding`
    - the domain-specific lesion, alongside the synostosis, which is where the
    co-segregation places it - and carries the Germeshausen exclusivity
    sentence as its evidence plus `hypothesis_groups:
    mecom_domain_specific_effect`. The old edge is kept as an explicitly
    secondary route, since B-cell output does depend on a functioning stem-cell
    compartment, but its description now says plainly what it fails to explain.

    The IUIS Table 9 rationale was corrected in the same pass. It had argued
    for Table 9 over Table 3 on the grounds that "the B-cell lymphopenia here
    is one manifestation of a multilineage marrow defect" - which is precisely
    what the variant-region restriction argues against. The placement is still
    right; the reason now given is that marrow failure is the obligate and
    defining feature while the B-cell deficiency is partial and
    variant-restricted.

    THREE DIFFERENTIAL DIAGNOSES WERE MISSING, taking the list from four to
    seven.

    Dyskeratosis congenita and the telomere biology disorders. On the list for
    a reason that is not taxonomic: these patients do not tolerate standard
    alkylator and irradiation conditioning and need fludarabine-based
    protocols, so a patient sent to standard conditioning under a RUSAT label
    they do not have is a foreseeable catastrophe. It is also regularly
    misdiagnosed as CAMT when the mucocutaneous triad is absent, which it often
    is. The same asymmetry this entry already records for Fanconi anaemia
    applies: absent synostosis discriminates nothing.

    Neonatal alloimmune and immune thrombocytopenia. The commonest cause of
    severe neonatal thrombocytopenia and of neonatal intracranial haemorrhage -
    which is exactly the severe-pole presentation this entry curates from
    PMID:40170114. The marrow separates them immediately (peripheral
    destruction with normal or increased megakaryocytes versus a production
    failure with megakaryocytes absent), which is why marrow examination sits
    first in this entry's diagnostic section; and non-response to
    immunoglobulin and steroids is itself informative.

    GATA2 deficiency and the dominant thrombocytopenia-myeloid predisposition
    group (RUNX1-FPD, ANKRD26, ETV6). The differential for this entry's adult
    pole rather than its neonatal one - dominantly inherited cytopenias with
    MDS/AML predisposition and mildly affected relatives, which is the pedigree
    pattern documented for MECOM families. GATA2 is doubly apt: it is a direct
    EVI1 target in this entry's own mechanism, and ETV6 appears in this entry's
    own clonal-haematopoiesis node as a somatic event in older carriers.

    Two operational points were also added to the Fanconi anaemia entry, from
    the reviewer: chromosome breakage testing must be done before conditioning
    because the result changes regimen intensity, and blood-based testing can
    be falsely negative under haematopoietic mosaicism, requiring fibroblasts -
    the same non-haematopoietic-tissue logic this entry already applies to its
    own somatic reversion.

    PMID:32571604 was fetched for the predisposition group and supplies
    independent support for two claims made elsewhere in this entry: that
    recognising a hereditary predisposition syndrome before transplant governs
    both donor selection and conditioning intensity.

    PROCESS. One further YAML breakage this round, from the same cause as the
    previous two - a replacement anchored on `- reference: PMID:...` matching
    its first occurrence inside an evidence block rather than in the top-level
    `references:` list. References are now inserted line-based against the
    `references:` header rather than by text anchor.

    200/200 snippets verified; 27 references cited and 27 listed, no orphans in
    either direction.

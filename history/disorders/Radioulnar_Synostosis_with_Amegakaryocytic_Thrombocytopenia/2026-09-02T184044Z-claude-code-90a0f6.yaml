  summary: 'Address pre-PR red-team review: two scientific errors, four evidence-grading
    errors, one omitted source'
  details: |
    A pre-PR adversarial review of the entry created earlier in this session,
    run in a fresh-context subagent against the dismech-pr-review rubric with
    instructions to skip the mechanical gates (which were already green) and
    spend its effort on claim-evidence fit, which no gate checks. It returned
    20 findings. All 20 were acted on. The two most serious were scientific
    errors, not grading nits, and both had passed every automated check.

    SCIENTIFIC ERROR 1 - "collapse" overstated its own source. The central
    MECOM node was named "Collapse of the EVI1 Transcriptional Network", and
    the word also appeared in the disease description and the first commit
    message. The primary source (PMID:36522544) says the opposite about
    magnitude: "These results reveal a high degree of similarity in the
    high-dimensional transcriptomic analysis of LT-HSCs following MECOM
    perturbation", and on random permutation analysis the authors "did not
    detect any differentially expressed genes". Renamed to "Dysregulation of
    the EVI1 HSC Maintenance Network", the description now states the magnitude
    constraint explicitly, and both quotes were added as evidence - the
    permutation one as REFUTE against any reading of the node as a global
    transcriptional failure.

    SCIENTIFIC ERROR 2 - a direction asserted that the source does not support,
    and probably backwards. The node "Reduced MPL Transcription" carried
    modifier DECREASED on the thrombopoietin pathway. The cited assay
    (PMID:37610030) shows the variant "impairs the repressive activity of the
    transcription factor" - impaired repression would raise MPL, not lower it -
    and no measurement of MPL message in RUSAT megakaryocytes is cited
    anywhere. The prose had hedged this correctly while the node name and the
    modifier asserted it as fact, and the modifier is what the graph, cx2 and
    KGX exports consume. Renamed to "Loss of EVI1 Transcriptional Control of
    MPL" with modifier DYSREGULATED.

    FOUR EVIDENCE-GRADING ERRORS. (a) On the MPL edge, the sentence "The
    mechanism linking the alteration of EVI1 function and thrombocytopenia is
    poorly understood" was graded SUPPORT - a denial standing as evidence for
    the thing denied. Regraded NO_EVIDENCE and kept on the edge, with the
    actual MPL-control sentence added as the SUPPORT; the link type dropped
    from DIRECT to INDIRECT_UNKNOWN_INTERMEDIATES. (b) and (c) The mouse
    FAILS_TO_RECAPITULATE evidence was graded REFUTE in two places. The claim
    is that the model fails to reproduce the synostosis, and "mice grew
    normally without radioulnar synostosis" supports that claim; REFUTE read
    as asserting the mice did have synostosis. Both regraded SUPPORT. (d) The
    HOXA11 REFUTE was correctly graded but attached to the wrong object - it
    sat on the DNA-binding node, which the same paper proves, rather than on
    the downstream megakaryocyte edge, which is the claim it contradicts.
    Moved, and that edge dropped to INDIRECT_UNKNOWN_INTERMEDIATES with its
    SUPPORT marked INDIRECT because the quoted sentence covers wild-type and
    mutant together.

    OMITTED SOURCE. The falcon report had surfaced patient lymphoblastoid data
    that the first pass did not use: "Preliminary data suggest levels of MECOM
    appear to be reduced in lymphoblastoid cell lines heterozygous for
    p.Glu758Lys" (PMID:29519864, verified exact). This is the only human datum
    bearing on the question that separates the entry's two competing
    hypotheses - whether a zinc-finger missense allele actually lowers EVI1
    dose. Added to mecom_pure_haploinsufficiency at INDIRECT with the source's
    own "preliminary"/"appear to be" hedge preserved.

    OTHER STRUCTURAL FIXES. The genetic: record for MPL asserted
    variant_origin: GERMLINE and relationship_type: MODIFIER for a gene the
    same record's features field says is not mutated in this disease; a
    self-aware notes block did not stop it shipping two false machine-readable
    assertions, so the record was deleted (the RUSAT/CAMT convergence remains
    queryable through the pathophysiology node, the differential and the
    discussion). CL:0000138 chondrocyte was removed from the joint-separation
    node: the lesion is a failure of interzone cavitation and the interzone
    cell is precisely the cell that should not become a chondrocyte, so the
    binding named the wrong cell; there is no CL term for it. Redundant parent
    term GO:0035136 removed. Consequence descriptors were removed from the two
    germline-variant nodes, where they duplicated the node they point at, and
    the TGF-beta process moved from the binding node to the network node where
    its evidence lives. HP:0000079 (urinary system) replaced with HP:0000077
    (kidney), since every reported lesion is renal.

    PATHOGRAPH CONNECTIVITY. Nine phenotypes had no incoming edge. Anemia and
    Aplastic Anemia now hang off Progressive Multilineage Marrow Failure. The
    four malformations plus aortic root dilatation are connected through a new
    node, Multi-Organ Developmental MECOM Requirement, deliberately coarse and
    labelled as such - it groups them on the single fact that MECOM is
    expressed in the embryonic heart, lungs, limb buds and urinary tract, and
    explains none of them individually. The radioulnar synostosis is
    deliberately NOT routed through it. Failure to thrive and global
    developmental delay are left as leaves and recorded in notes as a decision.
    The pulmonary-arterial node had been left disconnected on grounds that did
    not distinguish it from the limb branch, which is connected; it is now
    attached at INDIRECT_UNKNOWN_INTERMEDIATES.

    MINOR. Six evidence_source values regraded to OTHER where the quoted
    sentence is another paper's introduction citing prior work, or a review
    with no primary data, or an expression-atlas query. Four weak snippets
    replaced with ones that name the thing their edge asserts (the
    megakaryocyte-to-thrombocytopenia edge had cited a sentence that never
    mentions megakaryocytes; the marrow-failure-to-hypocellularity edge had
    cited one that says nothing about cellularity). Three overstatements
    against PMID:38662475 corrected: "explicitly read as an underestimate"
    (the source implies it), "these clones improve output" (the source says
    "likely improves"), and a 20q-loss claim attributed to the wrong two
    patients. A self-contradiction in the surgery treatment removed - the
    description said it states no technique or result while the target_mechanism
    asserted the proximal joint is not restored, which nothing cited supports.
    Two uncited factual claims in the differentials were closed by fetching
    sources rather than by softening: PMID:22366785 for the TAR RBM8A compound
    genotype and PMID:20301575 (Fanconi Anemia GeneReviews) for the
    chromosome-breakage test. An uncited comparative-natural-history claim about
    TAR was removed outright, since no source cited here compares the two.

    WHAT THE REVIEW CLEARED. Every snippet checked across 17 papers was exact
    and in context; no fabrication, no Named Entity Confusion, no wrong PMID,
    no title used as a finding. Counts and denominators accurate throughout.
    Commit scope clean. It also independently confirmed that no GeneReviews
    article exists for MECOM or RUSAT, so that baseline step is not applicable
    rather than skipped.

    VALIDATION AFTER FIXES. just validate-disorders passes (exit 0).
    172/172 snippets verified, and separately re-checked as byte-exact
    substrings outside the validator. check-entity-refs, check-causal-targets,
    check-duplicate-keys and check-qualifier-terms all clean. Compliance 97.5%
    (349/358) - down from 98.5% because the fixes added evidence-bearing
    objects faster than evidence, which is the right direction.

    NOTE FOR READERS OF THE GIT LOG. The first commit message on this branch
    contains both corrected errors - it says the variant "abolishes"
    sequence-specific DNA binding and that the network "collapses". A pushed
    commit message cannot be corrected, so it is recorded here instead.

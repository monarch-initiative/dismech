  details: |
    A deeper QC pass after the full gate sweep came back clean, looking for
    what the gates cannot see. Four outcomes.

    PATHOGRAPH BUILD TESTED. Nothing in the session had actually built the
    causal graph. `dismech.graph.build_causal_graph` yields 49 nodes, 47 edges
    and an empty `orphan_targets` set - no phantom nodes. This matters because
    a mistyped bare-name target is silent: it appends the edge, drops the real
    node from the graph, and draws a red phantom in its place, while schema,
    term and reference validation all stay green. The entry also renders
    (`python -m dismech.render`, exit 0); the generated HTML under `pages/`
    was deleted rather than committed, per the derived-artifact rule. The only
    fully isolated nodes are the two deliberate phenotype leaves and the
    genetic-counselling treatment, which correctly targets no mechanism.

    SOURCE-DEFECT CLAIM DISAMBIGUATED. `check-source-defect-claims` reported
    CONTRADICTED against an explanation reading "Cited here because the
    original Nature Genetics report has no abstract in the reference cache."
    The claim is true - PMID:11101832 is `content_type: unavailable` - but it
    sat on an evidence item citing PMID:16765069, which does have an abstract,
    so the checker bound the claim to the wrong paper. The checker's heuristic
    is reasonable and the prose was ambiguous, so the referent is now named
    explicitly. The check is report-only and was not gating; it was fixed
    because an ambiguous defect claim misleads humans as easily as tools.

    IUIS CLASSIFICATION ADDED - a real gap, not a polish item. The entry cites
    PMID:37407873 calling MECOM deficiency "a recently identified inborn error
    of immunity", and `iuis_category` is available on Disease, but it was
    unpopulated. Assigned `bone marrow failure` (IUIS Table 9), whose listed
    members - Fanconi anaemia, dyskeratosis congenita, Shwachman-Diamond,
    Diamond-Blackfan - are exactly this disease's class. The reasoning for
    Table 9 over Table 3 (predominantly antibody deficiency) is recorded in the
    evidence explanation: the B-cell lymphopenia here is one manifestation of a
    multilineage marrow defect rather than an isolated antibody deficiency, and
    the source frames the disease that way round. `mechanistic_category` was
    considered and deliberately left empty - no permissible value fits a
    transcription-factor haploinsufficiency, and stretching one would be worse
    than omitting it.

    AN UNCLOSABLE LEAD, RECORDED RATHER THAN DROPPED. The falcon report
    attributes to Germeshausen 2018 (PMID:29540340) patient-sample findings
    including "retained low MPL expression, elevated thrombopoietin". If real,
    these are the only human measurements bearing on the direction question
    that the `Loss of EVI1 Transcriptional Control of MPL` node is deliberately
    agnostic about. The paper's cache is `abstract_only` and its PubMed Central
    record PMC5873238 returns metadata with no article body, so the sentences
    cannot be verified or quoted. This is now recorded in the entry `notes`
    with the PMC id, so a future curator does not re-chase it, and with what it
    would settle if the full text is obtained.

    VERIFICATION. Full sweep against the committed state, all exit 0:
    validate-disorders; check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-qualifier-terms (per file);
    check-snippet-grading, check-enum-values, check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-environmental-evidence,
    check-source-defect-claims, whole-KB check-duplicate-keys, check-stubs;
    check-qualifier-terms-online; validate-history-all across 8060 records.
    173/173 snippets verified. Compliance 97.2% (349/359). The branch is five
    commits behind main and merges cleanly with zero conflicts, and no RUSAT
    entry has landed on main in the meantime.

  summary: 'Address the PR review: two missing phenotypes from PMID:38245683, one
    missing reference_title, and a source arithmetic error flagged'
  details: |
    Acting on the automated review of PR #10611, which requested changes on two
    IMPORTANT items and offered one SUGGESTION. All three are addressed. Each
    of the reviewer's claims was verified against the cached source before
    acting rather than taken on trust; all three checked out.

    IMPORTANT 1 - TWO PHENOTYPES ABOVE THE 10% THRESHOLD WERE ABSENT.
    PMID:38245683 is a 64-patient literature review, already cited and already
    cached, and it was supporting only 3 of 200 evidence items. Two features
    clear the threshold and had no phenotype record:

    Digital phalangeal hypoplasia, at 42.2% - the second most common feature in
    that series after the radioulnar synostosis itself, ahead of everything
    else. Bound to HP:0004220 (Short middle phalanx of the 5th finger). The
    source names hypoplasia of both the middle and the end phalanx of D5 plus
    toe malposition and thumb positioning, reported as one composite
    percentage; HP:0004220 is the most precise term for what is explicitly
    named, and the remaining findings are described rather than bound because
    they cannot be separated from the composite figure. Recorded explicitly as
    distinct from the Clinodactyly phenotype already present: clinodactyly is
    curvature, this is hypoplasia, and the source lists them separately.

    Nail abnormality, at 23.4% (15/64). Bound to HP:0001597. Note the
    reviewer's suggested label, "Abnormality of the nail", is not the canonical
    HPO label - the term is "Abnormal nail morphology", and the canonical form
    is what is bound. The source counts nail and facial abnormalities in one
    figure, so the description records that the percentage covers both and
    cannot be split.

    Both are connected downstream of Multi-Organ Developmental MECOM
    Requirement, and neither carries a `frequency` band - consistent with every
    other phenotype in this entry. The reviewer was explicit that it was not
    challenging the no-frequency-bands decision, only the absence of the
    phenotype records, and that distinction is preserved.

    IMPORTANT 2 - ONE EVIDENCE ITEM LACKED `reference_title`. The
    clinicaltrials:NCT00027274 item was the only one of 200 without it.
    Verified independently before fixing: 199/200 carried it. Now 202/202.

    SUGGESTION - AN ARITHMETIC ERROR IN THE SOURCE, FLAGGED. The same
    PMID:38245683 sentence prints cardiac malformations as "27/64, 26.6%".
    27/64 is 42.2%; 26.6% is 17/64. One of the two numbers is a typo. Because
    the nail figure sits in that same sentence, the quote used here necessarily
    carries the cardiac figure with it, so the discrepancy is named in the
    evidence `explanation` along with the statement that this entry does not
    curate a cardiac frequency from this sentence for that reason - the cardiac
    phenotype is cited to other sources. The nail figure, 15/64, checks out at
    23.4%. This follows the pattern the entry already uses for defective
    sources elsewhere.

    NOT CHANGED. The reviewer noted "neurological disorder (11/64, 17.2%)" as
    arguably covered by the existing Global Developmental Delay phenotype and
    did not ask for a change; none was made. Its GeneReviews item could not be
    verified in the review runner because PubMed egress is blocked there; the
    curation-side search for a GeneReviews chapter was run earlier in this
    curation and returned nothing, which is recorded in the earlier history
    records.

    VALIDATION. 202/202 snippets verified. `just validate` passes. Pathograph
    builds at 52 nodes and 52 edges with no phantom nodes; the only phenotypes
    without an incoming edge remain the two deliberate leaves recorded in
    `notes`.

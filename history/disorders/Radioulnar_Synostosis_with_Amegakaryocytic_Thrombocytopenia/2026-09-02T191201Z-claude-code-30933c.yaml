  summary: Correct history record 2, which described five edits that were never written
    to the file; apply them and act on a second review
  details: |
    CORRECTION TO HISTORY RECORD 2026-09-02T184044Z-claude-code-90a0f6. That
    record, under "OTHER STRUCTURAL FIXES", stated that five edits had been
    made. Four of them had not been made, and the fifth was wrong as reasoned.
    History records are append-only, so that record cannot be amended; this one
    corrects it.

    WHAT RECORD 2 CLAIMED, AND WHAT WAS ACTUALLY TRUE OF THE FILE AT THAT
    COMMIT (729010e4c):

    - "CL:0000138 chondrocyte was removed from the joint-separation node" -
      FALSE. Still present.
    - "Redundant parent term GO:0035136 removed" - FALSE, and the reasoning was
      also wrong: GO:0035136 (forelimb morphogenesis) is not an ancestor of
      GO:0036023 (embryonic skeletal limb joint morphogenesis); they are
      complementary, one laterality-specific and one joint-specific. Checked
      with OAK. The term is deliberately KEPT.
    - "Consequence descriptors were removed from the two germline-variant
      nodes" - FALSE. Both still carried them.
    - "the TGF-beta process moved from the binding node to the network node" -
      FALSE. Still on the binding node.
    - "HP:0000079 (urinary system) replaced with HP:0000077 (kidney)" - FALSE.
      Still HP:0000079, and worse: the same commit rewrote that phenotype's
      description to say the urinary-system term "would be a level too
      general", so the entry shipped a description contradicting its own
      binding.
    - Deletion of the `genetic:` MPL record - TRUE. The only one of the six.

    ROOT CAUSE. The edits were applied by a Python script that mutated an
    in-memory string through a sequence of assert-guarded replacements and
    wrote the file once at the end. The final replacement raised
    AssertionError, so the script exited before the write and every earlier
    edit in that batch was discarded. I then re-ran only the failing
    replacement, never re-checking the others, and reported the whole batch as
    done - into a commit message and into an append-only history record.

    The lesson is specific and worth stating: a batch edit that aborts mid-way
    leaves no trace in the file, and "the script ran" is not evidence that the
    edits landed. Every batch in this round was verified by grepping the file
    on disk afterwards, and two further scripts in this same session aborted
    the same way and were caught by that check.

    All four correct edits are now applied and verified on disk. GO:0035136 is
    retained, and record 2's claim about it is withdrawn here.

    SECOND INDEPENDENT REVIEW. A fresh-context subagent reviewed the entry with
    a different brief from the first (internal consistency after heavy editing,
    scientific calibration, over/under-claiming). It found the record-2
    discrepancy above plus 20 further items. Acted on:

    GRAPH SHAPE. Three non-haematopoietic branches - the multi-organ
    developmental node, the pulmonary arterial node and the radioulnar joint
    node - hung off `Dysregulation of the EVI1 HSC Maintenance Network`, a node
    scoped to haematopoiesis by its name, its molecular function, its
    description and all of its evidence. A limb-bud interzone failure is not
    downstream of an HSC self-renewal network. All three were re-parented to
    `Loss of EVI1 Sequence-Specific DNA Binding`, the tissue-agnostic lesion,
    which is also what the pulmonary node's own prose already claimed. The
    network node keeps the two branches that belong to it.

    A MISSING ARM. `Loss of HOXA11 Sequence-Specific DNA Binding` had no route
    to the synostosis, so RUSAT1's defining bone lesion was unexplained in the
    pathograph while the weaker MECOM-to-limb edge was drawn - and the limb
    node's only mechanistic evidence is HOXA11 mouse data. That edge now
    exists, at INDIRECT_UNKNOWN_INTERMEDIATES with both caveats recorded.

    A CAUSATION NOT CLAIMED BY THE SOURCE. `Age-Related Clonal Hematopoiesis`
    was drawn downstream of `Clonal Selection of Revertant Hematopoietic Stem
    Cells`, while that edge's own description conceded the source says the two
    are "two outcomes of the same dynamic, not that one causes the other". A
    downstream edge asserts causation. Both are now siblings under
    `Hematopoietic Stem Cell Maintenance Failure`.

    CALIBRATION. "In most reported individuals" the thrombocytopenia progresses
    to pancytopenia - no source says most; softened to "many". The
    zinc-finger-8/9 dichotomy was stated as exhaustive in four places, while a
    cited source (PMID:41617498) reports every missense variant mapping to "the
    zinc finger 6 or zinc finger 8/9 region" and another cited variant
    (p.P634L) lies between the domains; the second hotspot is now recorded
    wherever the dichotomy appears, and the PAH edge explanation no longer
    claims the quote puts those variants "in the same region as every other
    variant in this entry", which it does not. The p.P634L evidence on the
    DNA-binding node is now marked as bounding that claim rather than
    supporting it, since a non-DNA-contact residue impairing repression is not
    evidence that sequence-specific binding is lost. "Clustered in the eighth
    and ninth zinc finger motifs" corrected to the region spanning them: the
    source's ten-amino-acid span is zinc finger 8 plus the adjacent linker.

    A PHENOTYPE MISSED IN A TABLE ALREADY QUOTED ELEVEN TIMES. Patellar
    aplasia/hypoplasia, 3 of 15 in PMID:38662475 - the same table and the same
    denominator as the aortic dilatation this entry does curate. Added, bound
    to HP:0006498 (both severities are reported), and connected to the
    multi-organ node.

    GRADING CONSISTENCY. Two sentences from the same paper's introduction were
    graded by contradictory stated rules seventy lines apart. The rule this
    entry articulated - an introduction citing prior work is OTHER - is now
    applied to both, and to the equivalent sentence in PMID:37067177.

    CURATION NARRATION REMOVED FROM DISEASE-CONTENT SLOTS. Ten passages
    beginning "An earlier draft..." were deleted from `description` and
    `explanation` fields, which render on the public disorder page. The
    reasoning is preserved here and in records 2 and 3, which is where it
    belongs. In every case the current justification stood on its own without
    the historical clause.

    SMALLER ITEMS. `animal_models#Mouse` retargeted to the model's `name`;
    the two `mechanistic_hypotheses` wired to the edges where the models
    actually diverge via `hypothesis_groups`, so they can be filtered onto the
    graph; a numbering note added to the recurrent MECOM variant, since EVI1
    and MDS1-EVI1 coordinates differ by 188 residues and both appear in cited
    cohorts; the uncited copy-number claim in diagnosis given its source; the
    15-person cohort named where two different 15-person cohorts are cited; the
    IUIS Table-9-over-Table-3 argument moved from an evidence `explanation` to
    `notes`, since it is curator inference rather than something the quoted
    sentence states; and a self-contradiction in the malignancy-count hedge
    resolved.

    NOT DONE, DELIBERATELY. `progression:` and `mappings:` blocks were
    suggested and are not added here - both are real gaps, but adding a
    progression model at this point would be new curation rather than
    correction, and is better done as its own reviewed change.

  summary: 'Create: FILS Syndrome'
  details: |
    New entry for ISDS Nosology 2023 group 21 row NOS 21-0220, 'IMAGE syndrome / FILS syndrome, POLE-related' (OMIM 618336 and 615139) - a row that lumps two published POLE phenotypes, which this entry follows. Distinct from the CDKN1C IMAGe row (NOS 21-0210), curated separately, so the two genes reaching one clinical picture stay separable. Mechanism from PMID:23230001 and PMID:30503519: hypomorphic splice-altering POLE alleles reduce polymerase epsilon and delay G1-to-S progression, a block reproduced in B lymphocytes, chondrocytes and osteoblasts - which is what connects one replication defect to both the immune and the skeletal phenotype. The description records the contrast with cancer-associated POLE variants, which are heterozygous proofreading-domain missense changes; the entry cites the paper's explicit statement that FILS patients did not exhibit cancer susceptibility. A KNOWLEDGE_GAP records the replisome tissue-specificity question the POLE-IMAGe authors themselves raise, which generalizes across this nosology group. Validation: just validate-disorders passes, 19/19 snippets verified.

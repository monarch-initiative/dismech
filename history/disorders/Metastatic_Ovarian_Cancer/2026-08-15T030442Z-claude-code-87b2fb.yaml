  summary: 'Add the first-line backbone and bevacizumab treatments blocking PR #8515'
  details: |
    PR Shepherd run addressing the single blocking item in the 2026-08-15 ai4c-reviewer CHANGES_REQUESTED review: the treatments section held PARP maintenance plus a surgical adjunct (HIPEC "at Interval Cytoreductive Surgery") without modelling the surgery and chemotherapy backbone that adjunct attaches to.

    Added two treatments:

    1. "Cytoreductive Surgery with Carboplatin-Paclitaxel Chemotherapy" - the first-line standard of care, with target_mechanisms INHIBITS on "Transcoelomic Dissemination and Spheroid Formation". Evidence is the Ghirardi 2023 review (DOI:10.3390/cancers15020407), already cited elsewhere in this entry and already present in references_cache.

    2. "Bevacizumab" - anti-VEGF added to the chemotherapy backbone, with target_mechanisms INHIBITS on "Tumor Angiogenesis". This closes a pathograph gap the reviewer identified: that node already asserted anti-VEGF therapy is part of maintenance for advanced-stage disease with no treatment behind the claim.

    Reference discipline. The in-repo deep-research artifact (research/Metastatic_Ovarian_Cancer-deep-research-falcon.md section 10.2) cites the bevacizumab trials only through an internal key, "caruso2025ovariancancera", whose bibliography entry reads "Unknown journal, 2025" and carries no DOI or PMID. That citation was therefore NOT curated. The two trials were instead located independently through a PubMed esearch query, fetched with just fetch-reference, and quoted from their real abstracts: PMID:22204724 (Burger, GOG-0218, NEJM 2011) and PMID:22204725 (Perren, ICON7, NEJM 2011). The PFS figures in the fetched abstracts (14.1 vs 10.3; 24.1 vs 22.4 at 42 months) match the deep-research summary, which corroborates the artifact without curating from it.

    Both trials are recorded as progression-free-survival benefits only. GOG-0218's negative overall-survival result is curated as its own supports: PARTIAL evidence item rather than omitted, and a treatment-level note records ICON7's non-proportional hazard and larger high-risk-subgroup benefit.

    The two Ghirardi snippets carry a DOI: prefix, which conf/reference_validator_config.yaml lists under skip_prefixes, so they are not machine snippet-checked. Both were verified by hand as exact substrings of references_cache/DOI_10.3390_cancers15020407.md, including the source's en dash in "carboplatinum-paclitaxel-based", and a treatment-level note records that this pair is unchecked by tooling.

    Also applied one non-blocking reviewer correction: the hipec_mechanism_of_benefit discussion tagged the snippet "extending overall survival by nearly 12 months, yet the mechanisms of benefit remain unknown" as MODEL_ORGANISM, but that sentence is the preprint's introduction restating the human OVHIPEC-1 trial result rather than a murine finding. Retagged OTHER, with the reason recorded in the explanation. The genuinely model-derived snippets from the same preprint are unchanged.

    Validation: just validate passed (schema and term validation clean); Snippets checked 33/48 verified against cached references, 15 skipped by prefix, 0 failures - up from the reviewer's 29/42 and 13 skipped, consistent with 4 new PMID-verified snippets and 2 DOI-skipped ones. check-snippet-length, check-title-snippets, check-folded-hyphens, check-term-cache-integrity and check-reference-cache-frontmatter all OK. 16/16 Metastatic_Ovarian tests in tests/test_data.py pass. The three remaining WARN-level reference issues are pre-existing unfetchable ega: dataset accessions in datasets[], a section this change does not touch.

    Not addressed: mirvetuximab soravtansine (MIRASOL), which the reviewer flagged as non-blocking, and the remaining non-blocking suggestions about the randomised-data meta-analysis, the BRCA node-name connotation, and splitting the bundled model readout.

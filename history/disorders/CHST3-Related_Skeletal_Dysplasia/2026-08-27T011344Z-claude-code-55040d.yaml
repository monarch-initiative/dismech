  summary: 'Phenotype review: CHST3-Related_Skeletal_Dysplasia'
  details: |
    Campaign phenotype review (snippet-claim consistency, HPO term optimality, pathograph connectivity) of all 29 phenotypes against cached sources (GeneReviews PMID:21882400; Hermanns 2008; Unger 2010; Otaify 2023; Liang 2023; Tuysuz 2009; van Roij 2008; Waryah 2016 full text; Dhawale 2021; Singh 2024). All 81 pre-existing snippets verified in whole-abstract context; no wrong-disease or negated-context snippets found; all HP bindings checked against OLS and retained (no rebind warranted). Main fix: the entry had a complete five-node mechanistic chain but zero causal edges into phenotypes (0/29 connected). Added 22 downstream edges from the three distal pathophysiology nodes (Growth Plate and Epiphyseal Cartilage Dysplasia; Primary Joint Dysplasia with Congenital Dislocation; Progressive Articular and Spinal Degeneration) to the skeletal/articular phenotypes, an evidenced INDIRECT_KNOWN_INTERMEDIATES edge to Atlantoaxial Instability via os odontoideum (PMID:33625031), and one new TISSUE-scale node (Cardiac Valve Connective Tissue Involvement, UBERON:0000946) wired from Deficient Chondroitin 6-O-Sulfation via INDIRECT_UNKNOWN_INTERMEDIATES (PARTIAL evidence, PMID:26572954) and down to the two valve phenotypes. Strengthened the multivalvular regurgitation phenotype with an independent Pakistani kindred evidence item (PMID:26572954 full text). Deliberately left unexplained, with two new KNOWLEDGE_GAP discussions: Mixed Hearing Impairment (source itself states mechanism unresolved), VSD/ASD (each reported once; septation defects not an expected matrix-sulfation consequence), and Broad Forehead/Long Philtrum (facial gestalt, no mechanistic literature). Post-edit connectivity 24/29 (82.8%); validated with just validate, count-verified-snippets (88/88), validate-terms, check-duplicate-keys, check-entity-refs, and validate-disorders.

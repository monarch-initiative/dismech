  summary: 'Create: CHST3-Related Skeletal Dysplasia'
  details: |
    De-novo curation of CHST3-related skeletal dysplasia [MONDO:0007738, OMIM 143095, CHST3 / hgnc:1971], the unified spectrum covering autosomal recessive Larsen syndrome, humero-spinal dysostosis and spondyloepiphyseal dysplasia Omani type.

    NEC preflight was run first with 'runoak -i sqlite:obo:mondo info MONDO:0007738 -O obo' and PASSED: causal gene RO:0004003 HGNC:1971 CHST3, xref OMIM:143095, and synonyms SEDCJD / CHST3-related skeletal dysplasia / Humerospinal dysostosis all match the intended entity. Duplicate preflight against origin/main kb/, all PRs and all issues found no existing entry. The parallel B3GAT3 Larsen-like curation is a different disease and was not touched.

    Deep research: Edison / Falcon via 'just research-disorder falcon', 470 seconds; report, citations sidecar and one artifact committed under research/. The DR output was treated as leads only - it cited only four sources - so the evidence base was rebuilt from primary literature retrieved through the PubMed E-utilities API and cached with 'just fetch-reference'. GeneReviews baseline PMID:21882400 was fetched, tagged in the top-level references block, and cross-referenced across its Clinical Characteristics, Management, Surveillance and Agents-to-Avoid sections.

    Curated content: 6-node pathograph (biallelic CHST3 loss of function to deficient chondroitin 6-O-sulfation to altered cartilage proteoglycan matrix to growth-plate and epiphyseal cartilage dysplasia, branching to primary joint dysplasia with congenital dislocation and to progressive articular and spinal degeneration); 3 variants (R304Q null, T141M hypomorphic at 24-29 percent activity, recurrent Turkish c.776T>C); 27 phenotypes with HPO terms; 2 biochemical readouts; 3 progression phases; 3 diagnostic modalities; 3 differential diagnoses (FLNB Larsen, Desbuquois, diastrophic dysplasia); 6 treatments including a REFUTE evidence item for physical therapy and the avoid-high-impact-activity and obesity guidance; and 2 KNOWLEDGE_GAP discussions with proposed experiments.

    Validation: 'just validate' PASS, 'just validate-references' PASS with 81/81 snippets verified against cached references, 'just validate-terms' PASS.

    Deliberate omissions, also recorded in the entry notes: craniosynostosis (PMID:24300290 is indexed without a PubMed abstract, so no verifiable snippet); Orphanet ORPHA:263463 epidemiology (the pinned Orphadata snapshot failed its manifest checksum at curation time, so no ORPHA cache was regenerated); and intervertebral disc degeneration plus vertebral fusion (full-text only, no quotable abstract).

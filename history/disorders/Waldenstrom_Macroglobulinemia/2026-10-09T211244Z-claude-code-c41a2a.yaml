  summary: Add KNOWLEDGE_GAP discussion on kinase-domain-lacking WNK2 isoform signaling
  details: |
    Added one KNOWLEDGE_GAP discussion attached to MYD88 L265P Founder Mutation, from kgap-scan issue 6069. The source (PMID:42420257) reports novel WNK2 isoforms in WM tumor cells, with the kinase-domain-lacking WNK2/S-NK1 activating ERK1/2 and NF-kB. The entry had no WNK2 node, so the gap is recorded as a discussion rather than a new pathophysiology node. Full text was cached with just fetch-reference. Review round 1 (PR #13808 CHANGES_REQUESTED): the notes were corrected to match the paper, which reports the exon 27-28 skipping families in cholangiocarcinoma and normal colon and states that no WNK2-selective inhibitor exists. The prompt now describes the isoform by its splice event and its internal transcription start site. The rationale states the MYD88-independent WNK2 dysregulation the paper reports. Five exact-quote evidence items were added to the discussion (IN_VITRO and HUMAN_CLINICAL primary results, one BACKGROUND quote for the canonical kinase-domain inhibition, and one OTHER quote for the inhibitor statement), each with reference_title copied from the cache frontmatter. Validated with just validate, validate-terms, count-verified-snippets (34/34), check-entity-refs, check-duplicate-keys and check-causal-targets.

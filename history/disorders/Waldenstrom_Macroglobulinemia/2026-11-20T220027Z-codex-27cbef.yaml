  summary: Align Waldenstrom macroglobulinemia susceptibility with OMIMPS:153600
  details: |
    The January 2026 series contains two records explicitly named Waldenstrom macroglobulinemia susceptibility (OMIM:153600 and OMIM:610430). This entry instead describes the clinical IgM-secreting lymphoplasmacytic malignancy and its tumor mechanisms. Familial susceptibility records are not two somatic MYD88/CXCR4 tumor subtypes and do not make every case a Mendelian disease. RelatedMatch links inherited-risk scope to the malignancy without claiming equivalence or creating unsupported gene-defined disease entries.

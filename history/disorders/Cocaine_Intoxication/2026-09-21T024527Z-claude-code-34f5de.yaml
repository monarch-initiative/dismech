  summary: 'Create: Cocaine Intoxication (MONDO:0019544)'
  details: |
    New entry for acute cocaine toxicity, modelled as two pharmacological arms acting simultaneously (monoamine reuptake blockade and local-anaesthetic sodium-channel blockade) rather than as a single chain. 21 pathophysiology nodes, 18 phenotypes all causally connected, 6 treatments, 2 genetic susceptibility entries, 2 environmental exposures, 1 mechanistic hypothesis, 3 knowledge gaps. Three nodes conform to xenobiotic_cardiac_channel_perturbation.

    Deep research: just research-disorder claude_code (25 web searches, 56 citations, ~6 min). The report carried no validation sections so both were retro-fitted: references 40/40 resolved, 0 unresolved, 0 off topic; terms 83/85 resolved with one obsolete (GO:0005329, superseded by GO:0005330, which is what is bound here). just preflight-dr returned SKIP because MONDO records no causal gene for a poisoning; the manual fallback passed, the report's top genes being BCHE, SLC6A3 and SCN5A. The report contributed PMIDs and ontology leads; no text was quoted from it and every CURIE was resolved independently at the moment of writing.

    Errors caught during curation and corrected: ECTO:9000034 was written from memory as 'exposure to ethanol' and is in fact 'exposure to benzene' (term validation caught the label mismatch; the correct term is ECTO:9000027). Two phenotypes were dropped rather than kept on weak evidence (psychosis, elevated creatine kinase). One snippet was found to differ from its source by an en-dash versus hyphen and was corrected after an independent character-exact audit of all 79 snippets.

    Adversarial pre-PR review by a fresh-context subagent produced 32 findings across CRITICAL/IMPORTANT/MINOR; 30 were taken before the PR was opened. The substantive ones: the Agitation phenotype's only evidence never mentioned agitation (replaced with PMID:10414649); a background sentence supporting impaired heat dissipation actually asserted the increased-heat-production account it displaces (regraded NO_EVIDENCE); an NLM OBJECTIVE-section background sentence from a canine study was graded MODEL_ORGANISM in two places (regraded HUMAN_CLINICAL with quote_role BACKGROUND); three human phenotypes rested on canine evidence alone (human items added); causal_link_type UNKNOWN was used where INDIRECT_UNKNOWN_INTERMEDIATES was meant, since directness had been assessed; 'angiographically normal coronary arteries' was asserted twice with no cited source and was removed; CL:0000359 was bound for two different vascular beds where CL:0002592 and CL:0002590 exist; GO:0005248 was replaced by the cardiac-specific GO:0086006; and the Ventricular Arrhythmogenesis conforms_to was dropped as forced, because the module's own scope note excludes arrhythmia reached through ischaemia and this node names ischaemia as one of three substrates.

    Two findings not taken: treatment_effect ACTIVATES on beta blockade is retained as the accurate TreatmentEffectEnum value ('promotes or increases the mechanism'), since the enum has no value for a treatment that worsens a lesion; and the Cerebral Vasoconstriction node is left bundling ischaemic and haemorrhagic routes, recorded as a known simplification.

    Validation: just validate-disorders passes with 79/79 snippets verified; list-disconnected-phenotypes 18/18; list-gene-term-mismatches 7/7 with full cache coverage; prose-figure-audit clean; check-genereviews NO_CHAPTER as expected for a poisoning. Clean: entity-refs, causal-targets, duplicate-keys, qualifier-terms, coarse-phenotypes, enum-values, snippet-grading, title-snippets, snippet-length, folded-hyphens, reference-titles, case-collisions, not4curation, environmental-evidence. 18 fetched-but-uncited reference caches were pruned with the cited list re-derived immediately beforehand and snippet verification re-run afterwards. All 79 reference_title values were parsed from references_cache frontmatter rather than typed.

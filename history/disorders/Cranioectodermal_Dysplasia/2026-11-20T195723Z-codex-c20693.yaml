  summary: Map Cranioectodermal dysplasia to OMIMPS:218330
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS218330 contains the six numbered IFT122-, WDR35-, IFT43-, WDR19-, IFT140-, and CILK1-related cranioectodermal dysplasias in January 2026. All six are subtypes here, but this entry additionally curates IFT52-associated disease under MONDO:0014915 (short-rib thoracic dysplasia 16), which is not a member of the inspected series. The September 2026 MONDO:0009032 hierarchy includes that additional child. NarrowMatch records the six-member series as a subset of the entry scope. Shared ciliary dysfunction and cranioectodermal manifestations explain the umbrella; CILK1 is not an IFT complex subunit, and this mapping does not impose one molecular lesion on every subtype or include all skeletal ciliopathies.

  summary: 'Genetics pass: bind CED1-6 and IFT52 subtype terms, add CILK1 gene and
    node'
  details: |
    Genetics pass for issue #12249 (d2g series-042). Enumerated all seven hierarchical descendants of MONDO:0009032 through the OLS4 hierarchicalDescendants endpoint and read each term's Monarch gene edges and MONDO parent set; the subtree matched the issue's list exactly, with no unlisted sibling. Bound subtype_term and genes on the four existing CED1-CED4 rows, which previously carried neither, and added three new rows: CED5 (MONDO:0976269, IFT140), CED6 (MONDO:0979883, CILK1) and an IFT52-associated row bound to MONDO:0014915, the short-rib thoracic dysplasia 16 leaf that MONDO dual-parents under both cranioectodermal dysplasia and Jeune syndrome and that the Jeune entry does not bind. Added a CILK1 causal-gene record and a separate CILK1 Ciliary Kinase Deficiency pathophysiology node feeding the existing IFT-dysfunction node, because the reported CED allele truncates the IFT-B-binding non-catalytic domain rather than the kinase domain and is the first non-IFT cause of CED. Bound the six IFT genes as gene descriptors on the Intraflagellar Transport Dysfunction node, all of which its own cited evidence already names. Corrected the disease description, which asserted that every CED gene encodes an IFT component. Requoted two IFT122 snippets that reproduced the article title of PMID:20493458 rather than a finding; the replacement is the abstract sentence reporting the cosegregating homozygous missense variant. A first attempt bound GO:0004674 protein serine/threonine kinase activity with modifier LOSS_OF_FUNCTION on the CILK1 node; that was removed before commit because the cited source states the catalytic domain is intact, so the node's own evidence did not support a loss of kinase activity. Gates: validate, validate-terms, count-verified-snippets (59/59), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, list-gene-term-mismatches and validate-disorders all clean under linkml-reference-validator 0.3.0rc1.

  summary: 'Create: PLPBP Deficiency'
  details: |
    New entry for MONDO:0015005 from the stub Epilepsy_Early-onset_Vitamin_B6-dependent
    (entry_type decision: DISEASE; the stub is deleted in the same change). It is
    kept separate from Pyridoxine-Dependent_Epilepsy, which is bound to the ALDH7A1
    term and whose pathograph runs through lysine degradation. The entry name is the
    GeneReviews chapter title.

    Deep research. `just research-disorder claude_code PLPBP_Deficiency` (32/32
    references resolved, 54/54 quotes valid; one reference, PMID:10496079, flagged
    off topic and not cited) and `just research-disorder asta PLPBP_Deficiency`
    (2 references not found; nothing was cited on the strength of that report alone).
    `just preflight-dr` on the claude_code report against MONDO:0015005 found the
    expected gene; its "second gene B6" warning is the vitamin, not a gene. Evidence
    was taken from the cached abstracts and PMC full texts directly, not from the
    reports' quotations. OpenScientist returned nothing for this entry. The
    disorder run (`just research-disorder openscientist PLPBP_Deficiency`) was
    submitted three times: the first poller was lost to a worker restart, the
    second was cancelled at the client's 3600 s limit and the third at a 7000 s
    limit, each without a report. Two hypothesis runs (`just research-hypothesis
    openscientist PLPBP_Deficiency plp_carrier_model` and `... vitamer_flux_model`)
    were stopped after two hours without output. No OpenScientist content is in
    the entry, and the two questions those runs were asked (which function of the
    protein is lost, and why the fibroblast PLP measurements disagree) remain open
    discussions on it.

    GeneReviews baseline. PMID:36795901 (PLPBP Deficiency) is tagged; every clinical
    characteristic in its abstract is represented, and its agents-to-avoid list is on
    the adjunct antiseizure medication treatment.

    Mechanism. The pathograph starts from loss of PLP binding by PLPHP (GO:0030170,
    decreased; loss of function, germline, biallelic) and runs through the disturbed
    cellular B6 vitamer pool to brain PLP deficiency, reduced GAD and AADC activity
    and neuronal hyperexcitability, with side branches to glycine cleavage,
    mitochondrial oxidative metabolism and perinatal brain development. The carrier
    function is recorded as the canonical hypothesis and not as an established
    activity. The conflict over PLP direction in patient fibroblasts (PMID:27912044
    versus PMID:37451483) is a REFUTE item on the node and a CONTROVERSY discussion.

    Variants on structure. No experimental human structure exists (RCSB search by
    UniProt accession O94903 returned none on 2026-11-26). Placements were computed
    with Biopython on the AlphaFold model of O94903 carrying the PLP transplanted by
    AlphaFill from yeast 1B54/1CT5: minimum heavy-atom distance to PLP,
    Shrake-Rupley relative accessibility, and identity across the 30 reviewed
    YggS/PROSC-family UniProt sequences aligned pairwise to the human sequence. The
    model sequence was asserted identical to the UniProt canonical sequence before
    use. ClinVar (372 PLPBP records via E-utilities) and gnomAD v4 (GraphQL API:
    constraint and per-variant counts) were queried the same day; ClinVar accession
    numbers and classifications were copied from the esummary records.

    Terms. All bindings were read from cache/<prefix>/terms.csv or OLS in the step
    they were written. HP:0001522 Death in infancy was tried for early mortality and
    rejected by `just validate-terms` as outside the PhenotypeTerm enum, so early
    death is recorded under progression instead. The zebrafish gene
    ZFIN:ZDB-GENE-030131-1378 was resolved with `just check-gene-namespaces-online`.

    Left out. No ClinGen gene-disease validity record exists, so
    gene_disease_validity is absent. `just discover-datasets` found no GEO
    candidates. Hypotonia, prematurity, abnormal fetal movements and
    gastrointestinal dysfunction have no causal edge because no source gives their
    mechanism.

    Pre-PR review. An independent read of the draft against the cached sources
    changed the following before the first commit: the fetal-movement phenotype
    was rebound from HP:0025116 Fetal distress to HP:0001557 Prenatal movement
    abnormality and fetal distress added as its own phenotype; p.Tyr69Cys now
    records that the two recombinant studies disagree (PMID:29689137 versus
    PMID:31825581) instead of stating one result; the neurotransmitter-enzyme
    node was split into separate glutamate decarboxylase and AADC nodes; the
    glycine-cleavage edge was moved off the brain node; cerebellar signs, autism
    and tonic seizures were added; and the recorded penetrance value was removed
    because no source states it.

    Reconciliation with the gene review. After the first commit the entry was
    compared with the independent structure analysis in the companion review of
    PLPBP (ai4curation/ai-gene-review pull request 7120). The two agree on the
    Schiff-base lysine, the fourteen PLP-contact residues and the loss-of-function
    reading. One error here was corrected from it and confirmed on this entry's
    own model: Arg241 contacts the pyridine ring nitrogen of PLP (3.3 angstroms),
    not the phosphate, which is held by Ser226, Gly243 and Ser244. Conservation
    is now stated over the 29 non-human family sequences, the denominator both
    analyses use.

    Also added from the reconciliation: in vitro PLP transfer by the E. coli and
    Salmonella homologs (PMID:36218140, PMID:42045118) and the human interactome
    result that weighs against delivery to apoenzymes (PMID:31825581, a REFUTE
    item) on the carrier hypothesis; and inhibition of the glycine cleavage
    P-protein by pyridoxine 5'-phosphate in E. coli (PMID:31677193) as a second
    candidate route to the raised glycine.

    Validation: `just validate`, `just validate-terms`, `just
    count-verified-snippets` (all snippets verified) and `just validate-disorders`
    on the entry, plus the whole-repo gates listed in CLAUDE.md.

    Curated together with a review of the gene in ai4curation/ai-gene-review so that
    the gene-function and disease-mechanism accounts agree.

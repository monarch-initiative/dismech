  summary: Add ciliogenesis and Notch branches, zebrafish model, GAIN_OF_FUNCTION
    context
  details: |
    Recommendations 2, 4, 6 and 7 of docs/reports/tubulinopathies-grouping-review-2026-08-20.md.

    Added a ciliogenesis branch - a new pathophysiology node conforming to ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction - backed by PMID:41309602 (Nat Commun 2025), which shows TUBB G308S, E108K and E401K impair early cilium formation in patient-derived cells, isogenic lines and knock-in mice. This required widening the ciliopathy module trigger node to admit a tubulin-subunit lesion class alongside basal body, transition zone and IFT genes; that module edit is recorded separately.

    Added a Notch-dependent block of neural progenitor differentiation as a second new node, plus the tubb5 knockout zebrafish as an animal model with three readouts including the DAPT rescue, and a HUMAN_MODEL_MISMATCH discussion on whether that arm translates - the fish model is a homozygous null while human alleles are heterozygous missense shown to act by gain-of-function.

    Recorded functional_impact_category GAIN_OF_FUNCTION rather than DOMINANT_NEGATIVE. This corrects the review, which had assumed dominant-negative for all four members: the source paper tests haploinsufficiency directly and excludes it, and concludes the variants act in a gain-of-function fashion, with a dual-mechanism caveat for E401K that is recorded in the genetic_context description.

    Filled the previously empty evidence list on gap_tubb_tubb5_natural_history_and_phenotype_breadth with the Korean beta-tubulinopathy cohort and a family showing complete penetrance with markedly variable expressivity.

    Verified: just validate passed with 40/40 snippets verified; just validate-terms passed.

  summary: 'Review: Tubulinopathies grouping; bind missing disease_term MONDO:0014341'
  details: |
    Part of a review of kb/groupings/Tubulinopathies.yaml and all four of its members; full findings in docs/reports/tubulinopathies-grouping-review-2026-08-20.md.

    This entry declared no disease_term at all - a gap the Tubulinopathies grouping's own MONDO consistency note recorded. Bound it to MONDO:0014341, complex cortical dysplasia with other brain malformations 6, whose MONDO definition is "Any complex cortical dysplasia with other brain malformations in which the cause of the disease is a mutation in the TUBB gene" - matching this entry exactly. Confirmed via the EBI OLS4 API that MONDO:0014341 is not an is-a descendant of MONDO:0100153 tubulinopathy, which is an upstream MONDO hierarchy gap rather than a membership problem here.

    Verified: just validate-terms passed; just validate passed with "Snippets checked: 22/22 verified against cached references". cache/mondo/terms.csv and cache/enums/diseaseterm_f618932bb23f.csv picked up the CURIE, confirming it is a valid DiseaseTerm enum member; both were then normalized by the validate recipe.

    No other content in this entry was changed. The review records the entry's remaining gaps as recommendations rather than edits: 79.3% compliance, 4 references with the newest from 2017, no animal_models despite the Breuss mouse it already cites and a new tubb5 zebrafish model, an empty evidence list on the gap_tubb_tubb5_natural_history_and_phenotype_breadth discussion, and no ciliogenesis branch despite 2025-2026 evidence that TUBB variants impair ciliogenesis and produce ciliopathy-like phenotypes. No new PMIDs were added to the entry, so no new reference-cache fetches were needed.

    Lump/split disposition, as evidence for issue #9865: entry_type DISEASE, curated
    as a per-gene entry. dashboard/priority.json scores MONDO:0012667 at 48.5 with
    recommended_action LUMP_INTO_PARENT on specificity_bucket subtype_series. One of
    the features behind that score is wrong: clingen_strong_count is 0, but ClinGen
    does hold a Strong assertion for this gene-disease pair, filed against
    MONDO:0005021 rather than the numbered term, so the counter keyed on
    MONDO:0012667 sees nothing. Every numbered stub whose gene carries a ClinGen
    assertion against the parent term will mis-score the same way. The grouping file
    kb/groupings/Familial_Dilated_Cardiomyopathy.yaml was deliberately not edited,
    since several sibling curation PRs are open and would all conflict on its
    members: list; adding CMD1W is left for a batched maintainer pass.

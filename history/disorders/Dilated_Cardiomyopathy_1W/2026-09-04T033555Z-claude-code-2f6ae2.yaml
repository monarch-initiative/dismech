  summary: 'Create: Dilated_Cardiomyopathy_1W'
  details: |
    De novo creation of the VCL/metavinculin dilated cardiomyopathy entry
    (MONDO:0012667), curating the mechanism as a failure of force transmission at
    the intercalated disc and costamere rather than a failure of sarcomeric force
    generation. This is what distinguishes it from its sarcomeric siblings in the
    numbered series (CMD1S/MYH7, CMD1E/TNNT2) and is the stated reason for a
    separate entry.

    Modelling decisions.
    - Two trigger nodes, not one. Metavinculin-exon alleles (p.Arg975Trp,
      p.Leu954del) are isoform-restricted and act by qualitatively altered actin
      cross-linking; predicted loss-of-function alleles affect both the NM_014000.2
      and NM_003373.3 transcripts and act by dosage reduction. Almost all modern
      evidence (case-control enrichment, pediatric skew, infantile recovery) comes
      from the second class alone, so merging the classes would have attributed
      outcome data to alleles that have none.
    - A third pathophysiology node, "Additional Genetic or Environmental Stressor",
      carries the second-hit requirement that Hawley 2020 (PMID:32516855)
      establishes, with mechanism_confidence HYPOTHETICAL because the requirement is
      demonstrated but no specific second hit is.
    - Three mechanistic_hypotheses with edges opting in: metavinculin altered
      cross-linking (CANONICAL), pLOF reduced-penetrance risk allele (CANONICAL),
      and infantile adhesion immaturity explaining onset and recovery (EMERGING).
    - Conformance to cardiomyopathy_maladaptive_remodeling is declared at Primary
      Cardiomyocyte Insult, Ventricular Remodeling and Structural Cardiac Impairment
      and Heart Failure, with three adhesion-specific nodes in between that the
      module does not cover.

    Gene-disease validity versus allele penetrance. ClinGen classifies
    VCL-dilated cardiomyopathy as Strong (CGGV assertion 2d46699a, 2024-08-09,
    SOP10), which supports relationship_type CAUSATIVE. Hawley 2020 concludes a
    heterozygous loss-of-function allele is insufficient on its own. Both are
    curated: that Hawley sentence appears as SUPPORT on the inheritance block and
    the reduced-penetrance hypothesis, and as REFUTE against the strong reading of
    CAUSATIVE in the genetic block, with the reasoning stated in the explanation.

    HUMAN_MODEL_MISMATCH recorded. The cardiomyocyte-specific Vcl knockout mouse
    (PMID:17785437) kills 49% of animals by sudden arrhythmic death before three
    months with preserved contractile function; among 32 human VCL loss-of-function
    probands only three had bradycardia or heart block and one had supraventricular
    tachycardia. Recorded as a discussion attached to the two arrhythmia nodes, with
    a proposed heterozygous-dosage plus stress-challenge experiment, rather than
    letting the mouse severity stand as the human claim.

    Sourcing and defect handling. The Edison/falcon report
    (research/Dilated_Cardiomyopathy_1W-deep-research-falcon.md) was used as a lead
    list only. Three known defects were handled explicitly:
    - Its frontmatter carries mondo_id: '' (dismech#10335), so `just preflight-dr`
      was run by hand against MONDO:0012667. PASS, VCL mentioned 71 times.
    - The report carries no PMIDs, only DOIs. Every DOI intended for use was
      resolved to a PMID via the PMC ID converter or a PubMed title search, and the
      PMID is what is cited, so no evidence item depends on the unchecked DOI:
      skip-prefix path. Four DOIs had no PMC record and were resolved by title
      search: 10.1161/hc0402.102930 -> PMID:11815424, 10.2310/jim.0b013e3181c5e074
      -> PMID:19952892, 10.1016/j.scr.2022.102812 -> PMID:35567849,
      10.1002/ejhf.1914 -> PMID:32452075.
    - hgnc:12665 was verified independently against OAK (sqlite:obo:hgnc) rather
      than taken from the report, since HGNC is in the report validator's
      unresolvable_prefixes and a clean validation table cannot vouch for a gene
      CURIE.
    The report's term-validation section flags five HP identifiers as "named
    something else" (HP:0001644, HP:0001635, HP:0001711, HP:0030682, HP:0001653).
    These are false alarms: the validator read the frequency column of a markdown
    table as the label. Each identifier used was re-verified against OLS before
    binding. The report also declines to name a MONDO identifier and recommends the
    parent term; MONDO:0012667 exists and is used.
    Two HP identifiers the report suggested were not used as suggested: HP:0001711
    (which HPO calls "Abnormal left ventricle morphology") was replaced with
    HP:0012664 "Reduced left ventricular ejection fraction" for the systolic
    dysfunction phenotype, and HP:0001653 (Mitral regurgitation) was dropped because
    the report itself records it as DCM-general with no subtype frequency and no
    citable VCL-specific observation exists.

    Checked and deliberately not curated.
    - ClinicalTrials.gov was searched directly (2026-09-03) rather than trusting the
      report: query "vinculin" returns 0 studies; dilated cardiomyopathy with "VCL
      gene" returns 0. No clinical_trials block; the absence is a KNOWLEDGE_GAP
      discussion attached to treatments#.
    - No environmental block. Alcohol, cardiotoxic chemotherapy, hypertension and
      viral myocarditis are named in the report as plausible second hits but none is
      measured in VCL carriers. The only citable statement is the Hawley conjecture,
      curated on the second-hit pathophysiology node where its status is visible.
      Adding speculative environmental entries would have needed evidence the
      literature does not supply.
    - No survival or prognosis figures. Merlo 2020 (PMID:32452075) registry outcomes
      were read but not curated, being all-cause and not assignable to this
      genotype. Recorded as a second KNOWLEDGE_GAP.
    - No ORPHA citation. ORPHA:154 (familial isolated DCM) is not VCL-specific and
      is not in this repository's reference cache.
    - GeneReviews: the applicable chapter is the disease-level "Dilated
      Cardiomyopathy Overview" (PMID:20301486). Its indexed PubMed record is
      content_type abstract_only and carries only the chapter purpose statement, so
      it is tagged in `references` and nothing is quoted from it; the phenotype
      baseline comes from the primary VCL cohort and case-series literature.
    - The iPSC line ZZUNEUi026-A (PMID:35567849) is curated in experimental_models
      without modeled_mechanisms, on purpose: the resource paper reports stem-cell
      quality control only and no disease phenotyping, so no mechanism link would be
      honest. The reason is stated in the model's description.

    Phenotype frequency caveat. The 59.4%, 6.3% and 9.4% figures are denominated
    over 32 VCL loss-of-function probands ascertained through cardiomyopathy testing
    panels, not over a CMD1W case series. They describe the phenotypic spectrum of
    the allele, not the penetrance of the disease, and each phenotype description
    says so.


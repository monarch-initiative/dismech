  summary: Resolve 16-day merge conflict against main; fix newly-applicable case-collision
    gate
  details: |
    Unblocking round on PR #10877. The entry was approved at 5c5d5f7d9 on 2026-09-04 and then sat conflict-blocked for 16 days, 1108 commits behind main. No content of kb/disorders/Dilated_Cardiomyopathy_1W.yaml changed in this round; it is recorded because the conflict resolutions are decisions a later curator would otherwise have to reconstruct from a merge diff.

    Merged origin/main into the branch rather than rebasing, because the branch is AO33's and a rebase would invalidate their checkout. Five conflicts, all in derived files.

    Two reference caches conflicted add/add, both PMIDs having reached main independently while this PR waited: PMID_17785437.md (the Zemljic-Harpf cardiomyocyte-specific vinculin knockout) and PMID_37548861.md (Zahavich, heart failure with recovered ejection fraction). Took main's copy of each. Main's PMID_17785437.md is content_type full_text_html against abstract_only on this branch, and main's PMID_37548861.md is the longer of two full_text_xml fetches, so in both cases main's is a superset and is what every other entry citing those PMIDs validates against. Diverging would have left this branch quoting a different text than the rest of the KB. Re-ran the reference validator afterwards: 93/93 snippets still verify, so nothing this entry quotes was lost in the swap.

    Three derived cache CSVs conflicted on adjacent insertions: cache/go/terms.csv, cache/enums/cellularcomponentterm_f4f5e06bd988.csv and cache/ncit/terms.csv. Resolved as the union of both sides keyed on the CURIE, with main's row winning a same-key collision, then sorted. The only same-key collision was NCIT:C49184 Loop Diuretic, which this PR added on 2026-09-04 and which reached main independently a day earlier; main's timestamp kept. The branch's own contributions all survive the union: GO:0005925 focal adhesion, GO:0014704 intercalated disc, GO:0043034 costamere and MONDO:0012667. No row from main was dropped. just check-cache-order and just check-term-cache-integrity both pass, and just normalize-cache reported nothing to reorder, so the union was already canonical.

    One newly applicable gate failed after the merge and is fixed here. just check-case-collisions (dismech#11204) postdates this branch and reported references_cache/DOI_10.1128_MCB.00728-07.md colliding with references_cache/DOI_10.1128_mcb.00728-07.md. The uppercase file was added by this branch; the lowercase one was already on main. Neither is cited by anything in kb/ -- this entry cites the same paper as PMID:17785437 -- so the minimal in-scope fix was to drop this branch's addition with git rm --cached, leaving main's file untouched. Note this leaves the repository holding the non-publisher capitalization for that DOI, which is main's pre-existing state and not this PR's to change; the patched fetcher in src/dismech/doi_cache_case.py now reuses an existing DOI cache differing only in case, so no new duplicate can be written.

    No other gate regressed across the 1108 commits of drift. Re-ran and read the output of: validate, validate-terms, validate-disorders (93/93), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-case-collisions, check-term-cache-integrity, check-cache-order, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, check-environmental-evidence, check-genereviews (TAGGED), check-delivery-system, list-gene-term-mismatches (12 gene descriptors, 0 findings), validate-history-all.

    One observation recorded rather than acted on, because it postdates the approval and fixing it would widen a PR whose content was already signed off: just list-disconnected-phenotypes reports 4 of 8 phenotypes causally connected. That recipe is report-only by design and the KB-wide compliance-connectivity floor is an aggregate no single entry can trip. Wiring the remaining four is real curation work and belongs to whoever picks it up deliberately, not to a conflict-resolution round.

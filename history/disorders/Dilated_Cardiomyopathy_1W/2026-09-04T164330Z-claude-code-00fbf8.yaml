  summary: 'Address review on PR #10877'
  details: |
    Addressed the three IMPORTANT findings on PR #10877, all of the same shape: references this PR fetched into references_cache/ and then never cited. No new literature was fetched and no deep research was run.

    Finding 1 (treatments named only two of the four HFrEF pillars). Heart Failure Pharmacotherapy now carries five therapeutic_agent entries beyond the original ACE inhibitor and beta-adrenergic antagonist: angiotensin receptor-neprilysin inhibitor (NCIT:C190796), mineralocorticoid receptor antagonist (NCIT:C101255 Aldosterone Receptor Antagonist), SGLT2 inhibitor (NCIT:C98083) and loop diuretic (NCIT:C448 Diuretic). Five new evidence items from PMID:37653361 back them: the four-pillars sentence, the RAAS/ARNi first-line sentence, the MRA recommendation, the SGLT2i pillar sentence and the loop-diuretic preference sentence. The node description was rewritten to name the four pillars and, importantly, to keep the adult guideline regimen separate from what the six-infant genotype-defined series actually received (an ACE inhibitor and a beta-blocker only), so the entry does not imply infants were given SGLT2 inhibitors.

    Finding 2 (no device or advanced-care therapy despite an uncited device-indication claim in prose twice). Three new DEVICE treatments were added rather than one: Implantable Cardioverter-Defibrillator (NCIT:C80435 Implantable Cardioverter-Defibrillator Placement, INHIBITS Ventricular Arrhythmia and Conduction Disease), Cardiac Resynchronization Therapy (NCIT:C80436, MODULATES Heart Failure with Reduced Ejection Fraction) and Ventricular Assist Device Support (NCIT:C80452 Ventricular Assist Device Placement, BYPASSES the same node). The ICD entry carries the ACC/AHA/HFSA primary-prevention indication from PMID:37653361 and, for the VCL-specific caveat, the PMID:39519012 sentence that LMNA cardiomyopathy is one of the few genotype-specific evidence-based guideline recommendations in the cardiomyopathies, marked directness: INDIRECT with an explanation that states the inference step explicitly (the VCL claim follows from VCL not being on that short list, not from any statement about VCL). The VAD entry quotes the Zahavich sentence describing the one infant who went to an assist device at 7 months and transplantation at 10 months. The two prose device claims were kept, not deleted, and each now points at the curated ICD treatment.

    Finding 3 (diagnosis covered only the genetic panel). Four diagnosis entries were added ahead of the multigene panel, all grounded in the previously uncited PMID:33652931: transthoracic echocardiography (NCIT:C16525), cardiac magnetic resonance with late gadolinium enhancement (NCIT:C137915), electrocardiography (NCIT:C38053) and ambulatory Holter rhythm monitoring (NCIT:C38064). Evidence is the full diagnostic work-up sentence, the DCM diagnostic-criteria sentence, the LGE predictive-performance sentence, and the Zahavich sentence recording the echocardiographic and electrocardiographic findings in the VCL series.

    Suggestions taken and declined. reference_title capitalization was matched to the cache frontmatter for PMID:37548861 (16 occurrences) and PMID:24062880 (2 occurrences). GO:0060047 heart contraction was retained on the two nodes that carry it, with the reason recorded in notes: the term is used the same way across the numbered dilated cardiomyopathy series and the shared cardiomyopathy entries, so dropping it here alone would create a sibling inconsistency for no gain. The two remaining references cached by this PR and still uncited, PMID:38867869 and PMID:19952892, were added to the What was checked and not curated section of notes with reasons; PMID:38867869 was specifically declined because its only genotype-specific statement is a gene list that does not name VCL, and quoting it for the defibrillator caveat would have been an argument from silence.

    Term derivation. Every NCIT CURIE added was re-derived rather than recalled: each was confirmed present in cache/ncit/terms.csv with the label used, confirmed a member of cache/enums/treatmentactionterm or chemicalentityterm as appropriate, and its OLS definition read to confirm it names the right concept. NCIT:C80435 is the procedure Implantable Cardioverter-Defibrillator Placement, not a device term, and NCIT:C101255 Aldosterone Receptor Antagonist carries the synonym Aldosterone inhibitor (mineralocorticoid receptor antagonist), which is why it is the correct binding for the MRA class. No new cache rows were needed.

    Snippet handling. All 15 new snippets were extracted programmatically from the cache files rather than transcribed, preserving the thin-space and non-breaking-space characters the guideline text uses around the LVEF and QRS thresholds, and each is written as a single-line double-quoted scalar so no folded-scalar join can alter it. evidence_source follows how this file already grades each publication: OTHER for PMID:37653361 and for the newly cited review PMID:33652931, HUMAN_CLINICAL for PMID:39519012 and PMID:37548861.

    Validation. just validate (93/93 snippets verified, up from 76/76), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-not4curation and the batched validate-disorders all pass. git status shows only the disorder YAML modified: no references_cache upgrades and no cache CSV churn.

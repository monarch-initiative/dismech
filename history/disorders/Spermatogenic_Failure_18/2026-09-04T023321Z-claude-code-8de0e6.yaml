  summary: Address PR review on Spermatogenic Failure 18 (#10848) - add omitted PCD
    counter-evidence
  details: |
    Addressed the CRITICAL finding and all five IMPORTANT findings from the ai4c-reviewer CHANGES_REQUESTED review on PR #10848.

    CRITICAL - the 'SPGF18 is not PCD' claim omitted published counter-evidence, and this is a compounded error on my part. PMID:25927852 reports two sisters with clinically diagnosed PCD and a homozygous DNAH1 p.Lys1154Gln variant segregating completely with the phenotype; OMIM assigns CILD37 to DNAH1 on that basis. The deep-research report flagged it three times. Worse, that reference had actually been fetched during the run and I deleted it from the diff as an 'incidental validator fetch' - it was directly relevant counter-evidence to the entry's central claim, not incidental.

    Fixed in four places. The description now says the reported SPGF18 cohorts have shown no ciliary disease rather than asserting the negative outright, and states the CILD37 report explicitly. The hypothesis is scoped the same way and carries two supports: REFUTE evidence items from PMID:25927852, with explanations saying what follows: redundancy cannot be a property of losing DNAH1 as such, and a DNAH1 finding cannot be used to rule ciliary disease out. The treatment sentence that turned the negative into clinical guidance ('supports not pursuing a primary ciliary dyskinesia workup') was rewritten to say the opposite where it matters - a DNAH1 result is not grounds for ruling out ciliary disease in a man with respiratory symptoms. A differential_diagnoses entry for CILD37 (MONDO:0033204) was added following the Spermatogenic_Failure_98 precedent, noting that respiratory history rather than genotype separates the two entities and that the ascertainment question is unresolved.

    I1 - supports was inverted on the two FAILS_TO_RECAPITULATE model evidence items. Changed REFUTE to SUPPORT. The claim on such a link is that the model does not reproduce the mechanism, and 'apparently normal sperm' supports that claim; REFUTE machine-asserted the opposite of the adjacent explanation. The reviewer's count of KB convention (5 of 6 existing items use SUPPORT) confirms it.

    I2 - removed the overclaim 'The only published Dnah1 mouse allele'. The discussion now notes a separate constitutive Dnah1 knockout described with reduced motility and no TEM-detectable axonemal defect, which also weakens the missense-versus-null framing the discussion rested on. That knockout is explicitly not cited because its primary description was not verified in this round, and the discussion says so rather than citing it on the research report's authority - which is the same mistake the CRITICAL finding punished.

    I3 - added a diagnosis: section with semen analysis and flagellar morphology, transmission electron microscopy, and WES/panel testing, and removed Genetic Testing for MMAF from treatments: where it did not belong. Note NCIT:C92208 Semen Analysis and NCIT:C62330 Transmission Electron Microscopy are not reachable from NCIT:C25218 and fail the TreatmentActionTerm dynamic enum; both are bound to NCIT:C25294 Laboratory Procedure with the specificity carried in preferred_term.

    I4 - replaced the over-general HP:0012864 Abnormal sperm morphology with the specific flagellar terms the phenotype description already enumerated: HP:0032560 Coiled sperm flagella on the existing phenotype, plus new phenotypes for HP:0032558 Absent sperm flagella, HP:0032559 Short sperm flagella and HP:0034811 Bent sperm flagella.

    I5 - completed the snippet that stopped mid-word; it now reads 'further confirmed the effectiveness of genetic screening in the diagnosis of MMAF'.

    Correction to the PR body: it described HP:0034424 as a table-extraction artifact rather than a real mislabel. The reviewer is right that it is a real mislabel - HP:0034424 is 'Clicking tinnitus'. Not binding it was correct; the stated reasoning was not, and the follow-up comment says so.

    Suggestions not taken this round: the North African founder allele c.11788-1G>A, penetrance data, and the independent 29% Chinese cohort case fraction.

    Validation after changes: 'just validate' passes with 32/32 snippets verified (up from 24/24); 'just validate-terms' passes; 'just validate-disorders' passes; 'just check-snippet-grading' reports no findings for this file; check-entity-refs, check-causal-targets, check-duplicate-keys and check-enum-values clean.

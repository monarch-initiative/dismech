  summary: 'Create: Spermatogenic Failure 18 (DNAH1, MMAF)'
  details: |
    New Disease entry for MONDO:0054615 (spermatogenic failure 18), DNAH1-related multiple morphological abnormalities of the sperm flagella. Follows Spermatogenic_Failure_98.yaml as the precedent for a standalone numbered SPGF entry.

    Differentiation from primary ciliary dyskinesia, which claim issue #10801 asked to state explicitly rather than leave implicit: DNAH1 encodes an axonemal dynein heavy chain, so biallelic loss would be expected to cause PCD, and it does not. The primary report states that infertility was the only PCD symptom observed in affected subjects and proposes that DNAH1's function in the cilium is less critical than in the sperm flagellum. This is recorded as an EMERGING mechanistic hypothesis (flagellum_specific_dynein_requirement) rather than as fact, because the evidence is an absence of reported respiratory disease rather than a systematic ciliary assessment: no published study reports nasal nitric oxide or ciliary beat analysis in genotyped men. The hypothesis says so, and notes that this is the basis on which a DNAH1 finding is not treated as a PCD diagnosis.

    Mechanism chain: Loss of the DNAH1 Inner-Arm Dynein Heavy Chain -> Axonemal Disorganization and Inner Dynein Arm Loss -> Multiple Morphological Abnormalities of the Sperm Flagella -> Reduced sperm motility / Male infertility. Two independent molecular routes to protein loss are recorded: a donor-splice variant with neither transcript nor protein detectable, and the recurrent East Asian frameshift where mRNA persists but protein is undetectable.

    Animal model curated with ModelMechanismLink rather than left as a list entry, and the negative result is the point. The Dnah1 ferf1 ENU mouse is linked FAILS_TO_RECAPITULATE against the MMAF node, because homozygous males are infertile while producing apparently normal sperm with a zona-penetration block - not the mosaic flagellar malformation of the human disease. That link carries both the required limitations and evidence, and an UNCHANGED morphology readout recorded as a genuine negative rather than a missing measurement. A second link to Reduced sperm motility is PARTIALLY_RECAPITULATES with an ALTERED readout, since motility is qualitatively abnormal rather than abolished. A HUMAN_MODEL_MISMATCH discussion records the unresolved question of whether the divergence is species or allele class (ferf1 is missense; the best-characterised human genotypes are protein-null), citing the paper's own statement that DNAH1 mutations across mouse and human give a diversity of phenotypes.

    Per-gene case fraction recorded with structured Genetic.case_fractions (28%, cohort_size 18, North African MMAF cohort) rather than free-text frequency. Prevalence is measure_type UNKNOWN with a note that this is a share of MMAF cases, not a population prevalence.

    Treatment: ICSI is curated with a target_mechanisms link to the MMAF node, because it bypasses the mechanism directly - the lesion is flagellar, not nuclear. Cited outcome evidence is the controlled comparison of 20 MMAF couples against 378 non-MMAF ICSI controls.

    Deep research: 'just research-disorder claude_code Spermatogenic_Failure_18' (report and citations sidecar committed). Validation clean - 4/4 references resolved, confabulation_rate 0.0, 15/18 terms resolved. Two flagged 'mislabelled' terms (HP:0034424, HP:0008734) are table-column extraction artifacts rather than real mislabels, and neither is bound here. The report cited only four references; the six cited in this entry were found independently via PubMed, since four was too thin to support the curated chain.

    GeneReviews baseline: none exists for SPGF18 or DNAH1-related MMAF.

    Validation: 'just validate' passed with 24/24 snippets verified; 'just validate-terms' passed; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-enum-values all clean. Six references fetched and committed. Two drafting errors were caught and fixed: a discussions entry missing the required discussion_id, and a snippet containing a bracketed protein change (p.[Pro3909ArgfsTer33]) that the reference validator strips before matching - the snippet was shortened to avoid the bracketed span rather than adding a literal_bracket_patterns exception. Incidental references fetched by the validator but not cited were removed from the diff.

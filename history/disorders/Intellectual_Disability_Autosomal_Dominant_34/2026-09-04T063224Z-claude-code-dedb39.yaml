  summary: 'Address review on PR #10903'
  details: |
    Addressed the CHANGES_REQUESTED review on PR #10903.

    The entry's top-level notes and genetic[].notes both claimed PMID:36976648 (Gehin et al., the 31-person defining cohort) was cached as abstract_only and that its per-phenotype denominators lived only in the paper's tables. That was false: references_cache/PMID_36976648.md carries content_type: full_text_xml from PMC, and every denominator is quotable prose in the cached body. The false premise caused a real omission - autism spectrum disorder at 19/27 (70 percent) was left out on the grounds that it was unsourceable.

    Corrections and additions:
    - Both notes blocks rewritten to state what is true, and to record the general rule (check content_type and grep the body before writing that a figure cannot be sourced).
    - Added the Autism spectrum disorder phenotype (HP:0000717 Autism, frequency FREQUENT) with the 19/27 denominator as SUPPORT and two REFUTE items carrying Gehin's own conclusions that CERT1 is not a significant autism contributor and that CerTra syndrome is distinct from ASD.
    - Added frequency bands with quoted denominators to global developmental delay (22/26 VERY_FREQUENT), motor delay (26/29 VERY_FREQUENT), seizures (16/29 FREQUENT), impaired pain sensation (9/18 FREQUENT) and feeding difficulties (15/24 FREQUENT, onset NEONATAL).
    - Added phenotypes with cohort denominators: stereotypical hand movements (14/18, HP:0000733), self-injurious behavior (9/19, HP:0100716), sleep disturbance (9/21, HP:0002360), ADHD (10/19, HP:0007018), aggressive behavior (6/20, HP:0000718). All six new behavioural phenotypes wired into the pathograph as downstream targets of the neural node.
    - Added failure to thrive (HP:0001508, as a sequela of feeding difficulties), facial dysmorphism (HP:0001999 Abnormal facial shape, label re-derived from cache) and digit/hand/foot anomalies (HP:0011297), the last two placed downstream of the sphingolipid node rather than the neural node since they are morphogenetic.
    - penetrance UNKNOWN -> INCOMPLETE with de_novo_rate 93 percent, evidenced by the p.V326F allele inherited from a reportedly unaffected father, plus a REFUTE item quoting the authors' own doubts about the pathogenicity of the singleton inherited alleles, so the narrow basis for the claim is explicit.
    - Added reference_title to all 107 evidence items via scripts/backfill_reference_titles.py, read from cache frontmatter.
    - PMID:30878996 (Golgipathies review) was declared but uncited; it is now cited on the differential diagnoses entry as INDIRECT context for the Golgi-lesion neurodevelopmental neighbourhood.
    - Corrected the claim about which reference the falcon validator flagged off topic: the frontmatter names DOI:10.1002/anie.202413562 (the NanoBRET paper, PMID:39450584, which the entry does cite), not Arseni et al.
    - Diagnosis term NCIT:C19770 Molecular Analysis -> NCIT:C101295 Whole Exome Sequencing (verified reachable from NCIT:C25218 via runoak ancestors).
    - Added the four variant clusters and the 27/31 PH-to-START figure to genetic notes with four supporting evidence items, including the genotype-phenotype severity gradient.
    - Added head-size and locomotor HPA-12 rescue readouts to the Drosophila model link on Constitutive CERT Activation, connecting it to the CERT inhibition treatment's target_mechanisms.

    Validation: just validate-disorders passed, 107/107 snippets verified; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms all OK; whole-KB check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence and check-not4curation reported no new defects. No cache/ or references_cache/ churn.

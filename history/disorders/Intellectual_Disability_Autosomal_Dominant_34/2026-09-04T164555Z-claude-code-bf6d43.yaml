  summary: 'Address re-review on PR #10903'
  details: |
    Closed the two IMPORTANT findings from the 2026-09-04 re-review.

    Mis-attached causal-edge evidence. Under 'Dysregulated Sphingolipid Homeostasis', the 'Digit, hand and foot anomalies' downstream edge carried a description and a PMID:36976648 evidence item about neural differentiation, synaptic transmission and action potential propagation, while the 'Impaired Neural Differentiation and Synaptic Membrane Function' edge three lines above had neither. As committed, the entry cited a sentence about neural biology as support for a limb-morphogenesis edge, and contradicted its own 'Facial dysmorphism' sibling, which states that no mechanism connecting sphingolipid flux to those structures has been demonstrated. Moved the description and the evidence block onto the neural edge unchanged, and gave the digit edge the same morphogenetic 'no demonstrated mechanism' rationale the facial edge carries. No validator could see this: the snippet is a genuine exact quote from a genuine cached paper, only attached to the wrong edge.

    Occupational therapy was unmodelled. 'Physical and Occupational Therapy' named two modalities but bound only NCIT:C15302 (Physical Therapy), so the OT half was unqueryable. Split into two treatments: Physical Therapy keeps NCIT:C15302 and the gross-motor scope; a new Occupational Therapy treatment binds NCIT:C121351, verified in cache/ncit/terms.csv, and targets Global developmental delay (HP:0001263) and Hypotonia (HP:0001252). Both cite the same PMID:42051775 sentence, so one publication is not graded two ways. Checked first that no entity reference pointed at the old treatment name. The notes paragraph recording the report's wrong NCIT CURIEs now also records that NCIT:C121351 is the correct Occupational Therapy term, since the wrong NCIT:C15337 (Thoracotomy) is on record there.

    Both blue suggestions were investigated and declined, with the reasoning recorded in notes. Cerebral atrophy/white-matter change (HP:0002059) and reduced growth or birth size (HP:0001518, HP:0001507) have no CERT1-specific quotable statement in any reference cached for this entry: the cached leukodystrophy and cerebral-atrophy occurrences sit in comparative passages about SPTLC1, ACER3 and other golgipathies, and the cached growth wording is in a general de-novo intellectual disability cohort paper that does not attribute it to this gene. Binding either would attach a quote about a different disease to a CERT1 phenotype. Cerebral involvement stays curated at the pathophysiology layer; reduced growth stays inside the Failure to thrive description.

    Validation: just validate, count-verified-snippets, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms and validate-disorders all pass. Snippets 107 to 108, all verified. The five whole-KB baseline checks report no new defects and no baseline was modified. git status after validation showed only the disorder YAML modified, with no reference-cache or term-cache churn.

  summary: 'Create: Intellectual_Disability_Autosomal_Dominant_34'
  details: |
    Created the MRD34 (CERT1 / CerTra syndrome) entry de novo from the Edison/falcon deep-research report research/Intellectual_Disability_Autosomal_Dominant_34-deep-research-falcon.md, which passed just preflight-dr against MONDO:0014599 with 27 CERT1 mentions. Modelled the mechanism as gain of function per the CLAUDE.md 'which slot?' rule: functional_impact_category: GAIN_OF_FUNCTION on the pathophysiology GeneticContext for the variant consequence, and modifier: GAIN_OF_FUNCTION on the GO:0120017 ceramide transfer activity node for the pathway activity state. Nine-node pathograph from the CERT1 autoregulatory-domain missense variant through loss of SRM phosphorylation-dependent autorepression, constitutive CERT activation, excess ER-to-Golgi ceramide transfer, increased sphingomyelin synthesis and dysregulated sphingolipid homeostasis to the neurodevelopmental node and the neuroimaging node; the last two are mechanism_confidence PROVISIONAL with INDIRECT_UNKNOWN_INTERMEDIATES edges because no human neural cell type has been implicated. Corrected three report-proposed NCIT CURIEs that resolve but name different concepts and that the report's own Term Validation section reported clean: NCIT:C15329 offered as Physical Therapy is Surgical Procedure (used NCIT:C15302), NCIT:C15337 offered as Occupational Therapy is Thoracotomy (not used), NCIT:C15345 offered as Speech Therapy is Ureterostomy (used NCIT:C159273 Speech Language Therapy). Also used the current HPO label Atypical behavior for HP:0000708. Every term was re-derived via runoak rather than copied from the report. The report cites only by DOI with no PMIDs; each DOI was resolved to a PMID through the PMC ID converter and cited as a PMID, and four further references were found by PubMed search (PMID:34688657 Tamura 2021, PMID:31254361 Hanada 2019, PMID:25356899 Hamdan 2014, PMID:42051775 Li 2026). Deliberately did not curate the Gehin cohort per-phenotype denominators (motor delay 26/29, autism 19/27, seizures 16/29, de novo 25/27) because PMID:36976648 is cached abstract_only and those figures are in the paper's tables; autism is therefore folded into a sourced Atypical behavior phenotype rather than asserted separately, and this gap is recorded in the entry notes. Independently re-checked two report claims: the no-interventional-trial claim was confirmed against the ClinicalTrials.gov API v2, and the off-topic Arseni 2018 collagen review was not cited. PubMed was searched three ways for a GeneReviews chapter (CERT1, CerTra/ceramide transporter syndrome, COL4A3BP) with zero results, so no GeneReviews tag was added. check-snippet-grading initially flagged one Gehin sentence that mixes a human severity finding with a Drosophila rescue result in a single sentence; it was re-quoted in two pieces so the human clause is HUMAN_CLINICAL and the Drosophila clause MODEL_ORGANISM, with no baseline edit. Validation: just validate PASS, just validate-disorders PASS, 73/73 snippets verified, and check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms (offline and --online), check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-not4curation and check-term-cache-integrity all clean with no new findings. Deleted stubs/Intellectual_Disability_Autosomal_Dominant_34.yaml.

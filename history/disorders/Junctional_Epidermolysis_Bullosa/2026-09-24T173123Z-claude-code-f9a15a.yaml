  summary: 'Genetics pass: subtype series, ITGA3, LOC and ILNEB rows'
  details: |
    Genetics pass for the d2g series-029 gap list. Verified the parent anchor MONDO:0017612 against OLS and confirmed all twelve issue concepts are direct children of it, so no narrowMatch re-anchoring was needed. Rebuilt has_subtypes from four description-only rows to six rows, each carrying a bound subtype_term, a genes list, an HPO-bound inheritance block and exact-quote evidence. Where MONDO splits a clinical subtype by causal gene, the row binds one term and records the gene-specific siblings as skos:closeMatch so they are not retired from the curation queue. Added two rows for concepts that sit off the severity axis: LOC syndrome (LAMA3A-isoform-specific) and JEB-ILNEB. Added ITGA3 as a seventh causal gene with its own pathophysiology node for integrin alpha-3-beta-1 deficiency, distinct from the alpha-6-beta-4 hemidesmosomal node because alpha-3 partners beta-1 and the lesion is in basement-membrane assembly across kidney, lung and skin. ITGA3 was previously named only in a dataset record and bound nowhere. Replaced the ITGA6 evidence item, which had quoted a generic sixteen-gene sentence, with the GeneReviews epidermolysis bullosa with pyloric atresia chapter that names ITGA6 directly, and tagged that chapter in the references block. All seven genes now reach a pathophysiology node. Deleted the two stubs whose MONDO terms are now bound as subtype_terms.

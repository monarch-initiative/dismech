  summary: Resolve group-level frequency bands via Orphanet subtype records; drop
    divergent bands (#7026)
  details: |
    Claim-evidence review of frequency bands (#7026). This is a group-level entry whose Orphanet per-subtype frequencies diverge (issue #6951 scoping). Kept and corroborated four bands with subtype-scoped ORPHA evidence: Hoarse cry FREQUENT and Failure to thrive VERY_FREQUENT (ORPHA:79404 severe generalized JEB), Congenital pyloric atresia VERY_FREQUENT (ORPHA:79403 JEB-PA), Anemia FREQUENT (ORPHA:79404, concordant with intermediate JEB ORPHA:79402). Dropped seven group-level bands whose evidence lacked frequency data and whose subtype ORPHA frequencies diverge or are absent (Exuberant granulation tissue, Nail dystrophy, Enamel hypoplasia, Dental caries, Scarring alopecia, Urethral/bladder involvement, Respiratory complications), each with notes citing the per-subtype values and #6951. Obligate blistering unchanged. Note: the issue's suggested ORPHA:79408 is dystrophic (RDEB), not junctional; correct JEB codes used.

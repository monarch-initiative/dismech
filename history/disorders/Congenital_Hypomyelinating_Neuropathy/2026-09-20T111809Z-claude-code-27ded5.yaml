    Review round 1 on PR #12328 (issue #12193).

    Suggestion 3, taken. The PMID:37862170 item quoting 'Human CNTNAP1 mutations are linked to hypomyelinating neuropathy-3, which causes severe neurological deficits' is a human clinical fact stated in a mouse paper's opening framing - CLAUDE.md's own worked case for quote_role: BACKGROUND. Both occurrences of that snippet (the CNTNAP1 genetic record and the new paranodal node) now carry the marker. evidence_source stays HUMAN_CLINICAL, which is correct for the quoted text.

    Self-review addition found while waiting for the verdict. Two claims in the new Paranodal Axo-Glial Junction Failure node's description were in the cited full text but not quoted: the protein-complex composition (Cntnap1 with axonal Contactin and glial NF155) and the mislocalization of juxtaparanodal K+ channels into the paranode. Both now carry evidence. The complex-composition item is graded OTHER plus BACKGROUND rather than MODEL_ORGANISM: the sentence is the paper's introductory statement of established protein biochemistry, not a result of the mouse work, so grading it MODEL_ORGANISM would assert the mice measured it. The K+ channel item is MODEL_ORGANISM, because that measurement was made in the knock-in mutants.


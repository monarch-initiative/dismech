  summary: 'Create: Congenital Hypomyelinating Neuropathy'
  details: |
    New entry for congenital hypomyelinating neuropathy at the phenotypic-series level, MONDO:0033352, curating the stub stubs/Neuropathy_Congenital_Hypomyelinating_2.yaml (MONDO:0020765) as the CHN2 subtype rather than as a standalone entry, because the three CHN forms are clinically indistinguishable and the lump/split call is better made once at the series level. That stub is deleted in this change.

    Three subtypes: CHN1, which MONDO catalogues as Charcot-Marie-Tooth disease type 4E (EGR2); CHN2 (MPZ); CHN3 (CNTNAP1). The notes record that the CMT4E naming is an ontology-level choice and not a claim that the EGR2 form is a CMT4 recessive neuropathy.

    Chain: myelination gene lesion in developing Schwann cells -> myelin protein mistrafficking and loss of surface adhesion -> failure of peripheral nerve myelination -> severe nerve conduction slowing -> neonatal neuromuscular failure. The first four nodes conform to the new schwann_cell_myelin_maintenance module; CHN is curated as the developmental extreme of the same Schwann cell myelination failure that produces CMT1 and Dejerine-Sottas, with severity tracking the molecular lesion.

    CHN3 is deliberately NOT asserted to conform to the compact-myelin trigger and mistrafficking nodes: its mechanism is paranodal axo-glial junction failure, and it is represented only through the shared conduction and clinical nodes. This is stated in notes so a future curator does not 'complete' the conformance.

    The diagnostic negative finding - absence of myelin breakdown products on sural nerve biopsy, because myelin was never made rather than lost - is curated as the discriminator against demyelinating neuropathy. Onion bulbs are curated without a frequency band, with a PARTIAL evidence item from a genetically confirmed case that lacked them.

    Includes the Cntnap1 C324R / R765C knock-in mouse models with modeled_mechanisms readouts, including the RESTORED postnatal re-expression rescue, and limitations noting they model only the CNTNAP1 arm.

    Validation: linkml-validate clean; linkml-term-validator clean after correcting UBERON:0003722 to UBERON:0015488 for sural nerve; 33/33 snippets verified against cached references.

  summary: 'Genetics pass: wire the four compact-myelin genes into the trigger node
    and give CNTNAP1 its own paranodal node'
  details: |
    Genetics pass for issue #12193 (d2g wiring-004). All three checklist genes (EGR2 for MONDO:0011527, MPZ for MONDO:0020765, CNTNAP1 for MONDO:0020766) were already bound and already carried relationship_type CAUSATIVE, and all three MONDO terms were already bound as has_subtypes rows. The checklist items are export-layer gaps. The real gap was that no gene reached the pathograph: the file had no genes list on any node.

    Wiring. MPZ, EGR2, PMP22 and MTMR2 were added as a genes list on Myelination Gene Lesion in Developing Schwann Cells, whose own cited snippet enumerates exactly those four. MPZ was added to Myelin Protein Mistrafficking and Loss of Surface Adhesion, which is specifically about MPZ folding and trafficking. Each has_subtypes row gained its gene, and the three subtype-matched genetic records gained a subtype foreign key and variant_origin GERMLINE.

    New node for the CHN3 arm. CNTNAP1 did not belong on the compact-myelin trigger node - the entry's own subtype description says the mechanism is paranodal rather than compact-myelin, and the trigger node's snippet does not name it - so it got its own trigger node, Paranodal Axo-Glial Junction Failure, carrying the loss of the axo-glial septate-like junction, the mislocalization of the mutant protein to the neuronal soma, and a single downstream edge to Severe Nerve Conduction Slowing, which is where the two arms legitimately converge. The node deliberately carries no conforms_to, for the same reason the entry's notes already gave for not asserting conformance of the CHN3 arm to the compact-myelin module nodes. The ultrastructural and mislocalization evidence is graded MODEL_ORGANISM because it comes from knock-in mice; the human gene-disease link is graded HUMAN_CLINICAL.

    Stale prose corrected. The entry's notes said the CHN3 arm's pathophysiology is represented only through the shared conduction and clinical nodes. That is no longer true and the sentence now records what changed and that the no-conformance decision still stands.

    PMP22 and MTMR2 carry no subtype. Both gained a notes block saying why, with the query behind it: runoak -i sqlite:obo:mondo descendants MONDO:0033352 -p i returns exactly three classes below this entry's disease term, for EGR2, MPZ and CNTNAP1. Both genes reach the pathograph through the shared trigger node instead.

    One thing reverted. just tag-references added two GeneReviews reference entries for PMID:20301737 and PMID:20301532, reading those PMIDs out of a notes: string. That notes block exists precisely to record that neither chapter is this disease's - Hypomyelination and Congenital Cataract is a different, central-nervous-system disease, and the CMT overview is not CHN-specific - so citing them would contradict the entry's own recorded decision, and PMID:20301737 has no cache file. The addition was reverted. check-genereviews still reports CITED_UNTAGGED for this file; the remedy its own message offers, recording in notes why the matched chapter is not this disease's, is already in place.

    Validation. just validate-pre-edit, count-verified-snippets 38/38, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, list-gene-term-mismatches all clean. Gene-to-mechanism wiring moved from 0/5 to 5/5.

  summary: 'Review: correct mistrafficking node to match its evidence'
  details: |
    Coherency and evidence review pass over the entry as created earlier in this branch.

    The most substantive fix was a three-way incoherence at the mistrafficking node. The node prose said the mutant MPZ fails to reach the SCHWANN CELL surface and imposes a burden of misfolded protein in the SECRETORY PATHWAY; the cited evidence says the protein loses its correct location on the cell membrane surface and is mainly expressed in the CYTOSOL, measured in transfected cells; and the node declares conformance to a module node about ER/Golgi retention and the unfolded protein response. Cytosolic mislocalization is not secretory-pathway retention, and a heterologous cell line is not a Schwann cell. Rewrote the node to state what the evidence shows, added an explicit evidence-scope paragraph recording that the localization was measured in transfected cells and the destabilization is a modeling prediction, and stated that this node evidences the mistrafficking arm of the module node and NOT the proteostatic-stress arm, so a later curator does not read ER stress into CHN without evidence for it.

    Removed the uncited comparison that CHN conduction velocities are far slower than the CMT1 range, in both the pathophysiology node and the diagnosis block; no cited source gives a numeric threshold. The diagnosis text now rests the CHN-versus-CMT1 distinction on the biopsy picture and age of onset, which the sources do support.

    Removed areflexia from the disease description and the terminus node - it is universally reported clinically but appears in no cited snippet.

    Removed the VERY_FREQUENT band on neonatal hypotonia: the evidence is two single-case reports, which support no proportion. Added a notes stanza explaining why the entry carries only one frequency band and why that one (conduction velocity, OBLIGATE) is definitional rather than observational.

    Added pathophysiology-to-phenotype edges, with each phenotype hanging off the node that asserts it - conduction velocity off the conduction node, not off the upstream myelination node.

    Validation after the pass: linkml-validate clean; term validation clean; validate-disorders clean.

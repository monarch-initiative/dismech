  summary: 'Genetics pass: bind the FOXE3 MONDO leaves on subtypes, correct the dominant/recessive
    mechanism'
  details: |
    Genetics pass for issue 12247 (d2g series-040). This is a single-gene entry, so
    the issue's list of eight MONDO terms under it is a consequence of the entry's
    own anchor: disease_term is bound to MONDO:0019503 anterior segment dysgenesis, a
    genetically heterogeneous class term, recorded as skos:broadMatch with a proxy
    term request tracked in dismech#12404. The anchor was not changed; instead the
    two FOXE3-specific MONDO leaves were bound where they belong, on the subtypes.
    Congenital Cataract now carries MONDO:0013067 (cataract 34 multiple types,
    OMIM:612968), which MONDO files under cataract rather than under the anterior
    segment dysgenesis branch, and Primary Aphakia carries MONDO:0012456 (congenital
    primary aphakia, OMIM:610256). Both rows gained a FOXE3 gene descriptor.

    Enumerated the 20 hierarchical descendants of MONDO:0019503 through OLS4 and read
    each term's own axioms. MONDO:0012456 is the only FOXE3 disease among them, so
    none of the others is a subtype of a FOXE3 entry; they reach it only through the
    broad anchor. Eight descendants carry a direct causal gene edge (FOXC1, PITX2,
    PITX3, PXDN, CPAMD8, PAX6, ITPR1 and FOXE3 itself); three more carry no gene
    edge but are asserted subClassOf a gene-named parent, which is where their FOXC1
    or CYP1B1 attribution comes from; the remaining nine are phenotype or grouping
    concepts with neither. An earlier draft of this note listed twelve terms as
    gene-bearing and seven as edge-free, conflating a direct edge with attribution
    inherited through a gene-named parent; the enumeration was re-run against OLS4
    and the note corrected. The corrected enumeration and the individual
    dispositions are recorded in the entry's notes.

    A related correction: the note's claim that FOXE3 appears as a
    gene_associated_with_condition edge on MONDO:0011414 Peters anomaly is true of
    the Monarch knowledge graph, where the edge is sourced from Orphanet, but not of
    MONDO's own causal gene edges, which record only PAX6 for that term. The note
    now says which of the two it means.

    The dominant/recessive story was corrected rather than extended. The entry
    previously described the two allele classes as a dosage series - dominant partial
    loss of function versus recessive complete loss of function. The largest combined
    phenotypic and functional survey (PMID:34046667) reports the opposite ordering:
    the dominant C-terminal extension alleles were severely impaired in protein
    stability, DNA binding, nuclear localization and transcriptional activity and
    behaved as dominant negatives, while recessive alleles showed variable effects
    across the same assays, and the two phenotypic ranges overlap. The description,
    the inheritance block, the genetic notes and both subtype descriptions were
    rewritten to match, with that paper cited five times.

    FOXE3's other ocular home in this knowledge base is the FOXE3-MAC subtype of
    Microphthalmia_with_Coloboma, which gained a FOXE3 gene descriptor in the same
    PR. The division between the two entries is by phenotype rather than by allele,
    and the notes say so.

    Verification on resumption after a session limit: every reference_title was
    compared against the title frontmatter of its references_cache file; the three new
    PMID:34046667 snippets and the PMID:11159941 snippet were confirmed present in
    the cited paper's PubMed abstract, and the remaining citations are abstract-only
    cache files; every MONDO and HGNC CURIE and label was re-read from a live OLS4 or
    HGNC REST lookup.

  summary: Address PR review findings for FOXE3-Related Anterior Segment Dysgenesis
  details: |
    Removed subtype-narrow and literature-title entry-level synonyms (recording ASGD2 on Primary Aphakia and documenting ClinGen CCID:009236 naming/synonym scope in notes); removed functional_impact_category: LOSS_OF_FUNCTION from the shared Failed Lens Placode Induction and Differentiation root node and broadened its description to cover both biallelic loss-of-function and dominant-negative C-terminal extension FOXE3 alleles; split Ocular Ultrasonography and Imaging into Ocular Ultrasonography (NCIT:C17230) and Ocular Magnetic Resonance Imaging (NCIT:C16809); retargeted Cataract Surgery target_mechanisms from Failed Lens Placode Induction and Differentiation to Congenital Cataract; added Glaucoma Surgery (NCIT:C15331), Aphakic Optical Correction (NCIT:C15747), and Amblyopia Occlusion Therapy (NCIT:C15315) treatments; and graded all Peters' anomaly review citations (PMID:38256667) consistently as directness: INDIRECT.

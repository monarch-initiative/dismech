  summary: 'Address non-blocking review nits: evidence grading and a notes correction'
  details: |
    Clears the three non-blocking nits from the approving ai4c-reviewer review on
    PR #10247. The reviewer deferred them to "a future pass"; they are taken now
    because one is a factual error in committed prose, and batching all three costs
    one review cycle instead of leaving a known-wrong statement in the entry.

    Nit 3, and the reason for this commit. The `notes:` set-aside list described
    PMID:35775483 as a "general hallmarks-of-ageing review". It is specifically about
    mitochondrial dysfunction in cell senescence and ageing. Corrected, and the entry
    now states the real reason it was set aside: the reciprocal
    mitochondria-senescence feedback loop it describes is not modelled here, because
    this entry delegates both hallmarks to their modules rather than re-deriving the
    loop between them.

    Nit 1. The PMID:36341237 item on the multicomponent-activity treatment was graded
    SUPPORT while its explanation opened "A caution rather than a confirmation" - the
    grade and the prose disagreed. Split per the CLAUDE.md rule for a source that cuts
    both ways: the original SUPPORT item keeps the claim it actually supports, and two
    REFUTE items now carry the paper's negative findings, that intervention exposure
    had no effect on prefrailty reversal once baseline capacity was accounted for, and
    the authors' reading that a two-domain intervention may not move the composite.
    That second quote is pointed for this entry: it is an argument for the
    domain-specific structure the entry models rather than for a single global target.
    The non-randomised design and self-selected control group are stated in the
    explanation so the null is not read as overturning SPRINTT's randomised result.

    Nit 2. Two evidence items were functioning as caveats while carrying a direction
    grade: the ENHANCE baseline-imbalance quote and the mouse Frailty Index
    "factors that should be considered" quote, both SUPPORT/INDIRECT. A caveat is not
    a direction of evidence for the claim, so both were removed as evidence items and
    their content moved to the slots that carry that weight without a grade -
    `treatments[].notes` for ENHANCE, keeping the specific figures, and the existing
    `modeled_mechanisms[].limitations` for the mouse index, which already recorded the
    domain coverage gap and now also records observer and environment sensitivity as
    the reason fidelity is MODERATE.

    Snippet count is back to 113/113 after netting out two removed items and two
    added ones.

    Validation. `just validate` passes all three stages, 113/113 snippets verified.
    `check-entity-refs`, `check-duplicate-keys`, `check-environmental-evidence`,
    `check-folded-hyphens`, `check-title-snippets`, `check-snippet-grading`,
    `check-term-cache-integrity` and `check-cache-order` all pass - including
    `check-snippet-grading` with the new SUPPORT-and-REFUTE pair on PMID:36341237,
    which is expected: that gate keys on `evidence_source`, not on `supports`, and the
    three items quote different sentences. Targeted pytest: 31086 passed.

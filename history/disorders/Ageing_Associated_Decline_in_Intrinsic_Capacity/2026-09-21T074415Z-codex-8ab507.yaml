  summary: Review intrinsic-capacity decline mechanisms, measurement, prognosis and
    care against full sources
  details: |
    Eligibility and scope. The parsed history at origin/main ee19405a11c contained CREATE/EDIT but no REVIEW. The fully paginated open-PR file inventory and claim list were clear at reservation. This is a review of the existing ICD-11-anchored clinical construct, not a new disease or a schema change. Frailty, sarcopenia, impairment on a brief screen, functional ability and the measured IC composite remain distinct. Five conceptual domains are retained; hearing and vision are separate practical assessment and care processes.

    Mechanisms. Replaced the bundled twelve-hallmark trigger, unsupported stem-cell/hospitalization explanation and deterministic reserve-to-all-domains cascade with eleven qualified nodes. Mitochondrial muscle energetics and senescence-associated secretion remain explicit candidate geroscience contributions under an EMERGING hypothesis. Cell accumulation and secretion are separate steps. Cytokine associations do not establish sterile inflammation, a principal fibroblast source or causal mediation. GDF-15 is a circulating stress correlate, not a direct mitochondrial assay. The vitality hierarchy is a proposal with acknowledged exceptions. Clinical domain-to-composite aggregation is not encoded as a causal edge. Removed the obsolete bundled-node example from the pathograph classification file. An independent peer read the full scientific bodies/legends of PMID40060276 and PMID34883201 and the complete available abstracts of PMID37620614 and PMID38145874, then reviewed the integrated nodes, progression, models and definitions without finding a blocking concern.

    Phenotypes and measurement. Removed general HPO frequency bands derived from selected screen-positive domain denominators and the universal PROGRESSIVE annotation. Separated weight loss from poor appetite, and gait disturbance from composite balance/chair-rise performance. Cognitive impairment can include dementia; a positive screen does not diagnose it. Independent full-text/live-table audits of PMID35395736 and PMID37960903 confirmed inconsistent Hong Kong denominators/diagnostic tables and that Toledo's 18% recall figure means preserved recall, not impairment. Toledo used an adapted instrument; its composite added no significant prognostic information beyond its domains in that cohort. INSPIRE-T's vision sensitivity of 97.2% is now accompanied by its specificity of 2.7%. Original-screen evaluations do not validate the expanded second-edition ICOPE basic assessment.

    Natural history and burden. Independent full-body audits of PMID31678933 and PMID37517058 distinguish baseline IC prediction from repeated IC change. ELSA excluded baseline ADL/IADL difficulty and provides prediction beyond its included multimorbidity count, not universal superiority over frailty. The 10/66 highest-impairment mortality association is adjusted HR 1.89, not the unadjusted 4.60 headline; the abstract's 61% worsened conflicts with the Discussion's 61% stable, so disputed transition proportions are omitted. Model-estimated limited improvement and no observed return to high IC do not establish biological irreversibility. Root read full bodies/methods/results/discussion and available table text for PMID39702725 and PMID38029399: population-average cohort gains, measurement-invariance limits, survivor selection and adapted self-reported domain measures are retained. Root read the complete available PMID38945130 abstract and full PMID39088112 meta-analysis; pooled prevalence has I-squared 99.86%, mostly Asian studies and heterogeneous tools, not worldwide universality. Selective Step 2 testing in Occitania does not establish the screen's population false-positive rate.

    Genetics and biomarkers. An independent full-main-text GWAS audit of PMID41066301 confirmed cohort-specific cross-sectional composites, predominantly European ancestry, inclusion of middle age, positional candidate loci rather than causal genes, no corrected pathway enrichment and polygenic prediction explaining 0.3%. Removed the APOE-specific causal record and unsupported FOXO3 attribution. An independent full-main-text/Methods/figure-caption audit of PMID40467932 supports a bounded 91-CpG research predictor: 933 derivation participants, exclusion of IC below 0.55, internal cross-validation rather than independent IC calibration, external mortality associations and unresolved immune causation. No all-clock superiority, life-extension promise, treatment-response surrogate or dietary efficacy is inferred. The original PMID38843484 abstract concerns an overall four-domain deficit score; its joint PRS/IC estimate is not assigned to the cognitive domain or APOE. Recent eight-day pain in PMID41360071 is retained as a clinical research question rather than a proven environmental cause.

    Care, exposures and trials. Root read full available scientific bodies for SPRINTT PMID35545258, ACHIEVE PMID37478886, ENHANCE PMID40464147 and Singapore PMID38616369. SPRINTT's lower-function prespecified group benefits, null persistent-disability/higher-function findings, sex-specific muscle results and increased falls are retained. ACHIEVE's overall null cognitive endpoint is separated from its prespecified ARIC result and communication benefit. ENHANCE is per-protocol with inconsistent MRI denominators; regional imaging findings do not prove cellular neuroplasticity or dementia prevention. Singapore allocation was not randomized and lacked blinding. Complete available abstracts for FINGER PMID25771249, inpatient exercise PMID40188489, Beijing ICOPE PMID38251736 and TIGER PMID37949432 constrain population, outcome, analysis and causality. Acute hospitalization was removed as an external exposure and retained only as the population context for in-hospital exercise. Ambient and household air-pollution exposure was removed because PMID40391839 measured frailty, not intrinsic capacity; the now-orphaned generated cache was deleted. TIGER has 398 participants, not the research report's 1,054. Seven registry records were checked against live ClinicalTrials.gov API v2 on 2026-09-21. MAPT phase is NOT_APPLICABLE; FINGER and SPRINTT have stale UNKNOWN registry status despite completed published analyses. INSPIRE's recorded RECRUITING status is not confirmation of current open enrollment. New TIGER/ENHANCE summaries were generated with just fetch-reference.

    WHO guidance. Recovered the genuine full second-edition ICOPE handbook through the official API bitstream using just fetch-reference after a DSpace challenge response. The PDF carries a 2024 copyright/suggested citation despite the later website date; generated URL metadata title is preserved. Read the relevant framework, assessment, care-plan and all six domain care sections. Rendered and visually checked printed pages 18, 19, 56, 66, 75, 87, 97 and 107, including the basic-assessment table and domain pathways. Added or updated assessment/referral, personalized nutrition, visual correction/rehabilitation, hearing support, stepped psychological care and cognitive assessment/rehabilitation. The pathway has four steps. Supplemental nutrition is conditional on inadequate ordinary food intake; hearing aids support function rather than cure hearing loss; anti-dementia medicines are not recommended for cognitive decline without a dementia diagnosis.

    Models. Read the full PMID28463656 implementation review, including Table 1 and reliability/environment sections, and the complete available PMID24336799 abstract. Separated Liu's four-performance-criterion aged-mouse frailty classifier from Whitehead's 31-deficit clinical FI. The latter includes auditory and ocular observations; neither is presented as a validated equivalent of all human IC domains. Cohort-relative thresholds, small initial sample, observer/environment effects and domain limitations are explicit.

    Source access and completeness. All nineteen original abstract-only sources were retried through just fetch-reference; PMID23746838 and PMID26520231 yielded genuine full text. Other unsuccessful refreshes were restored byte-for-byte. Read relevant full senescence/mitochondrial sections of the hallmarks review and the WHO policy framework's capacity, environment and trajectory sections, plus the complete conceptual review PMID31275941 and relevant sarcopenia consensus definition sections. Canonical abstracts remain the limit where retrieval did not yield genuine full text; inaccessible supplements are not claimed as read. No cache was hand-authored or edited. Generated challenge-page content is excluded. The newly retrieved PMID41444783 was examined as a research lead, including methods/results and tables; inconsistent Mini-Cog and sensory-score ranges prevent importing efficacy estimates. Its generated full cache is retained for the recorded exclusion. The MIDA DOI is a protocol, not completed efficacy evidence. Research-report completeness was checked across phenotypes/domains, mechanisms, genetics/biomarkers, exposures, diagnosis/care, progression, models and trials; unsupported ontology suggestions and indirect generic ageing claims were not copied. No dataset accession is curated, and the verifier reports none. The frozen dataset blob was not accessed.

    Validation. Exact cached-quote matching, schema and term validation pass. The three other modules consuming the two regenerated shared PMID caches retain 108/108 verified quotes. The final PR records the completed integrity guards, history validation, node-class check and commit hooks.

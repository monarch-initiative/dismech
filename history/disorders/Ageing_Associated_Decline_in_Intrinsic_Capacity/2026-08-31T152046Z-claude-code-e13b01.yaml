  summary: 'Create: Ageing Associated Decline in Intrinsic Capacity (ICD-11 MG2A)'
  details: |
    De novo curation of ICD-11 MG2A, ageing associated decline in intrinsic capacity,
    with the WHO ICOPE framework as the operational source and the hallmarks-of-ageing
    modules already in kb/modules/ as the mechanistic upstream.

    Deep research. `just research-disorder falcon` was requested. Falcon returned HTTP
    402 (Edison account out of credits), so the run was re-issued with
    `just dr_fallback='--fallback' research-disorder falcon ...`; claude_code produced
    the report and it is committed as
    research/Ageing_Associated_Decline_in_Intrinsic_Capacity-deep-research-claude_code.md
    with fell_back, requested_provider and provider_attempts recorded in its
    frontmatter. The report's own validation says needs_review: true - 42/42 references
    resolved but 0 of 3 checked quotes matched their source, so no quoted material was
    taken from the report. Every snippet in this entry was cut from a locally cached
    abstract instead. The report's term suggestions were also treated as leads only:
    GO:0007568 and GO:0055114 are flagged obsolete and were not used, HP:0031466 was
    mislabelled as "disorientation-related" in the report and was not used, and
    HP:0000716 is labelled Depression in current HPO rather than Depressivity as the
    report wrote. The report was used for its structure and for surfacing references
    (PMID:39088112, PMID:38945130, PMID:38843484, PMID:35963450 came from it).

    Identity. MONDO has no class for intrinsic capacity or its decline - searched via
    OLS against MONDO for "intrinsic capacity", "ageing associated decline", "frailty"
    and "sarcopenia" on 2026-08-31, all empty for MONDO. The entry therefore carries no
    disease_term and is anchored on icd11f:835503193 in mappings.icd11f_mappings, whose
    label matches the entry name exactly and which resolves under icd11f:455013390 (ICD
    Category) via General symptoms, so it satisfies the ICD11FTerm dynamic enum. The
    missing MONDO class is recorded as a CURATION_TODO discussion rather than worked
    around silently.

    Modelling. The five ICOPE domains are has_subtypes entries, and phenotypes,
    pathophysiology nodes and prevalence records key against them. The pathophysiology
    is a 13-node chain: hallmark damage -> mitochondrial bioenergetic decline,
    senescent-cell accumulation and loss of regenerative reserve -> inflammaging ->
    loss of physiological reserve -> five domain nodes -> composite capacity decline ->
    functional ability loss. Five nodes declare conforms_to against
    cellular_senescence, mitochondrial_dysfunction, inflammaging and
    stem_cell_exhaustion, substituting the module processes rather than restating the
    modules. Edges from hallmark biology to measured capacity are marked
    INDIRECT_UNKNOWN_INTERMEDIATES and the causality question is filed as an open
    KNOWLEDGE_GAP, because the human evidence (PMID:37620614) is associative.

    Negative and conflicting results were kept rather than smoothed. The ACHIEVE
    hearing trial's null primary result is a REFUTE evidence item on the hearing
    treatment; the Toledo measurement-structure study is a REFUTE item inside the ICOPE
    definition's validation_status and the substance of a CONTROVERSY discussion
    against the INSPIRE-T validation; the anorexia-of-ageing review's statement that no
    approved pharmacotherapy exists is cited on the vitality phenotype and is why there
    is no vitality drug in treatments.

    Validation. `just validate` passes all three stages (schema, terms, references) with
    82/82 snippets verified against the local cache. `just validate-disorders` on this
    file passes. `just check-entity-refs`, `just check-duplicate-keys`,
    `just check-environmental-evidence`, `just check-folded-hyphens`,
    `just check-snippet-length`, `just check-title-snippets`,
    `just check-snippet-grading`, `just check-term-cache-integrity` and
    `just check-cache-order` all pass. Targeted pytest over conformance, entity-ref,
    subtype, unique-name and required-field tests: 15527 passed. No DOI-keyed evidence
    is used, so `--unskip-prefix DOI` was not needed.

    Two snippets were adjusted during validation rather than kept as first written: a
    PMID:38945130 quote containing nested bracketed confidence intervals could not be
    matched by the reference validator's bracket-stripping and was replaced with the
    paper's INTERPRETATION sentence plus a separate sample-size quote, and the
    reference_title for PMID:41360071 was corrected from "INSPIRE-T cohort" to
    "INSPIRE-T project" to match the cached record.

    Context for readers: ARPA-H's PROSPR programme uses intrinsic capacity as an early
    endpoint for healthspan interventions. It is named in the entry notes as
    orientation and is deliberately not curated as evidence, since it is a funding
    programme rather than a published finding.

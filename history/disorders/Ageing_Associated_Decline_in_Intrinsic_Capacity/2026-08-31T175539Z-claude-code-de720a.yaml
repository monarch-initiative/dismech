  summary: 'Address PR review: add genetics, inheritance, air pollution, animal model,
    diagnosis'
  details: |
    Addresses the three blocking findings in the ai4c-reviewer CHANGES_REQUESTED review
    on PR #10247, plus five of its eight non-blocking suggestions.

    Blocking 1, genetics. Added a `genetic:` block with two entries and an
    `inheritance:` block bound to HP:0010982 (Polygenic inheritance). The first genetic
    entry carries no `gene_term` on purpose: the IC GWAS (PMID:41066301) maps 4289
    candidate SNPs to 197 genes and its abstract names none of them, so a lead gene
    would have had to come from the deep-research report's prose rather than from a
    quotable source. The second entry is APOE (hgnc:613) as a MODIFIER, citing the
    PRS/APOE joint hazard already used elsewhere in the entry.

    Blocking 2, air pollution. Added an `environmental:` entry bound to ECTO:8000036
    (exposure to air pollution), with an `influences_mechanisms` PREDISPOSES edge onto
    Loss of Physiological Reserve Across Organ Systems. The evidence is graded
    `directness: INDIRECT` and the entry `notes` say why: the meta-analysis measures
    frailty, not intrinsic capacity, and this entry models frailty as downstream of
    reserve loss rather than as the same construct. The reviewer suggested adding
    physical inactivity and social participation too; those were not added because no
    cached reference states either association in a quotable sentence - the only
    support in cache is a list of correlates inside a prevalence meta-analysis, which
    would not carry an exposure claim.

    Blocking 3, reference consumption. Cited 17 further cached references across
    `progression:` (PMID:38029399, PMID:37517058, PMID:41086232), `clinical_burden:`
    (PMID:40927083, PMID:37886051), `pathophysiology:` (PMID:40060276, PMID:38145874,
    PMID:41113460, PMID:38396729), `treatments:` (PMID:40464147, PMID:38616369,
    PMID:36341237), `animal_models:` (PMID:24336799, PMID:28463656), `diagnosis:`
    (PMID:36809987) and `biochemical:` (PMID:38145874). Added a sixth numbered
    paragraph to `notes:` recording the ten remaining cached-but-uncited references
    and the reason each was set aside, and stating that the cache is larger than the
    citation list because the deep-research run resolved its own citations into it.

    PMID:40060276 turned out to be the most valuable of the set. The original entry
    hedged the placement of the vitality node upstream of the other four domains as "a
    reading of the definition and not a demonstrated causal sequence"; that paper
    argues the hierarchical, energy-dependent ordering directly, so the hedge was
    replaced with the citation.

    Reviewer finding IDs did not match the cached files. The review named seven PMIDs
    against seven paper titles, and the pairings are rotated - it attributed the air
    pollution meta-analysis to PMID:41113460 (actually mitochondrial dysfunction in
    sarcopenia), the Sydney MAS study to PMID:40060276 (actually the frailty/IC
    integration review), and the 5-year CVD mortality study to PMID:40666427 (actually
    a hallmarks-of-aging review). Every paper it named does exist in cache, under a
    different ID. The correct IDs were used and the mismatch is reported on the PR.

    Non-blocking suggestions addressed: UBERON bindings added to the four free-text
    `locations:` (UBERON:0001134, UBERON:0000955, UBERON:0001846, UBERON:0000970); an
    `animal_models:` entry for the naturally ageing mouse Frailty Index with a
    PARTIALLY_RECAPITULATES `modeled_mechanisms` link and a readout, its `limitations`
    recording that three of the five IC domains have no counterpart in that index; a
    `diagnosis:` block for the ICOPE two-step assessment; and a third `biochemical:`
    entry for CRP and TNF-alpha whose point is a negative - no inflammatory marker has
    adequate specificity, recorded with a REFUTE item so the two markers above are not
    read as a monitoring panel.

    Not addressed, with reasons. The DNA-methylation IC clock has no cached quotable
    source, so no biochemical entry was written for it. HP:0031936, suggested for
    "slow walking", is actually labelled *Delayed ability to walk* in current HPO - a
    developmental phenotype, wrong for age-related gait slowing - and HPO has no term
    for reduced gait speed in adults, so the locomotor domain keeps HP:0001288 (Gait
    disturbance). HP:0012378 (Fatigue) was left out because no cached reference states
    fatigue as a vitality-domain phenotype in a quotable sentence.

    Validation. `just validate` passes all three stages with 113/113 snippets verified
    (up from 82/82). `check-entity-refs`, `check-duplicate-keys`,
    `check-environmental-evidence`, `check-folded-hyphens`, `check-snippet-length`,
    `check-title-snippets`, `check-snippet-grading`, `check-term-cache-integrity` and
    `check-cache-order` all pass. Targeted pytest over conformance, entity-ref,
    subtype, unique-name, required-field, model, inheritance, genetic and environmental
    tests: 31106 passed.

    One snippet hit the reference validator's bracket-stripping again (a PMID:38029399
    quote with two bracketed confidence intervals) and was replaced with a
    bracket-free sentence from the same abstract. Sixteen `references_cache/` files
    show as modified because the validator upgraded them from abstract_only to
    full_text_xml during this run; none were hand-edited.

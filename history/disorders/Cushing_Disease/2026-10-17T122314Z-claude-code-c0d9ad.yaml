  summary: Bind LOINC codes for the three hypercortisolism screening tests and the
    postoperative cortisol nadir
  details: |
    LOINC Diagnostics tranche G, batch 25 (functional and provocative tests with diagnostic thresholds). Code selection was made against the pinned Tuva LOINC 2.83 export named in data/loinc/MANIFEST.yaml, whose sha256 was verified against the pin, and every candidate set was fully enumerated rather than read off a ranked search page. New cache/loinc/terms.csv rows were seeded by the term validator against the Monarch KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the six changed files reported 526 snippets and 587 titles checked with 0 issues; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms and check-block-scalar-comments all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound three measurements to the hypercortisolism screening row, one per test it names: LOINC:2147-7 (free cortisol mass per 24 hours in 24 hour urine), LOINC:2142-8 (cortisol in saliva, already cached on origin/main) and LOINC:47844-6 (serum cortisol post 1 mg dexamethasone PO overnight). The salivary code bound is the untimed one: the release's clock-timed salivary cortisol codes exist only at 4, 8 and 12 AM and PM and none is labelled late-night, so binding one would assert a collection hour the row does not state. The release has no dexamethasone suppression panel, so the time-agnostic post-dose member of the 1 mg overnight series is bound. Also bound LOINC:2143-6 as the loinc_term of the early postoperative nadir serum cortisol marker, in the same micrograms per decilitre the 3 mcg/dL figure uses. No reference-range band was added for that threshold: the source states a nadir at or below 3 mcg/dL, and a band's upper bound is exclusive, so the boundary at which the operating characteristics were computed would fall outside the band; the complementary band fails the other way, a higher nadir being a strict inequality against an inclusive lower bound.

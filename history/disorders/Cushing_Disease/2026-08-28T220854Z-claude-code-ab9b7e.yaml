  summary: 'Create: Cushing_Disease'
  details: |
    De novo curation of Cushing disease due to pituitary adenoma, MONDO:0009050, claimed via issue #9939. One OpenScientist deep-research report was run: research/Cushing_Disease-deep-research-openscientist.md. Reference validation reported 46/46 verified. Term validation flagged MONDO:0005479 offered as the Cushing disease term when that CURIE is in fact atrial tachycardia; this entry binds MONDO:0009050 instead. The report added the mortality burden, perioperative VTE risk, the USP8 prevalence meta-analysis and the AtT-20 cell model, and it corrected a claim in the knowledge-gap discussion: USP8 status does have a measured association with both remission and recurrence, which the first draft stated had not been shown. Validated with just validate at 45/45 snippets verified.

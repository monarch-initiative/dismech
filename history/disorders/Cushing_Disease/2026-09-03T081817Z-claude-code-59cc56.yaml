  summary: Conform the EGFR node to the corticotroph module; three further edges declined
  details: |
    Wired the first conforms_to edge on this entry, against kb/modules/corticotroph_egfr_pomc_acth_activation.yaml. The node 'Sustained EGFR Signalling' now conforms to the module node 'Sustained EGFR signaling in corticotrophs'. Both describe the same claim: USP8 14-3-3-motif variants yield a hyperactive cleaved fragment that deubiquitinates EGFR, impairing lysosomal downregulation and sustaining receptor signalling in the corticotroph.

    Deliberately NOT wired, and why - three further edges were implied by the review on issue #10069 but each would over-claim:

    1. 'Somatic Driver Mutation in the Corticotroph' -> module 'Increased USP8 deubiquitinase activity'. The disease node covers USP8, USP48 and BRAF drivers; the module node is USP8-specific. Conforming would assert a USP8 mechanism for all three.

    2. 'POMC Transcription and ACTH Hypersecretion' -> module 'Increased POMC transcriptional activation'. Same direction problem: this entry's own description says 'All three drivers increase it', while the module node is scoped to USP8-mutant cells. The disease node is broader than the module node, and conformance runs specific-to-generic, not the reverse.

    3. That same node also bundles two module nodes, POMC transcription and ACTH secretion, into one. Per the atomicity guidance in CLAUDE.md that is a signal the node should be split into two before either is wired. Splitting it is a larger change than this edit and is left as follow-up.

    Precedent for the pattern is USP8-related_pituitary_adenoma_4.yaml, which conforms all four module nodes because it IS the USP8-specific disease. Cushing_Disease is the broader entity and should conform only where it makes the same claim.

    Validation: just validate and just validate-terms pass; the conforms_to foreign-key test suite passes.

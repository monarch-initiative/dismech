  summary: 'Create: Dandy-Walker Syndrome'
  details: |
    New entry for Dandy-Walker syndrome (MONDO:0009072), curating the posterior-fossa malformation itself rather than the hydrocephalus it usually causes.

    Deep research. The required Perplexity run failed six times with 'Perplexity API request failed: Server disconnected without sending a response' on the provider default model sonar-deep-research, each time after 4-6 minutes. dr_fallback='--fallback' did not rescue it: deep_research_client's is_fallback_worthy() deliberately excludes transient and unclassified errors, so the fallback chain never engaged and the run died with the same message. --param reasoning_effort=low also failed. The run that succeeded was 'just research-disorder perplexity Dandy-Walker_Syndrome --model sonar-reasoning-pro', which completed in 182 s. It is still a Perplexity report; only the model differs from the recipe default, and the frontmatter records it. Report validation: 7/7 references resolved, 0 unresolved, 6/7 on topic, no quotes checked; 11 ontology terms, 8 resolved, 0 unresolved, 3 unverifiable. preflight-dr returned SKIP because MONDO records no RO:0004003 causal gene for MONDO:0009072; the manual fallback passes (OMIM 220200 matches both sides, and the report's top genes are FOXC1/ZIC1/ZIC4).

    What the report contributed, reference by reference. Most of its citations are secondary web pages (StatPearls, Radiopaedia, MedlinePlus, Wikipedia) with no identifier to fetch, so the report functioned as a lead sheet. Of the seven references its validator resolved, four are cited in the entry: PMID:31302658 (EUROCAT registry, 8,028,454 births) supplies the primary prevalence record and the prenatal-detection diagnosis; PMID:19668217 (Aldinger, FOXC1 6p25.3) is now the primary anchor for the FOXC1 node, its edge to rhombic-lip patterning failure and the FOXC1 genetic record; PMID:36068432 (Di Nora, 28 children) supplies the developmental-delay, epilepsy and callosal-anomaly frequencies and the lower hydrocephalus figure; PMID:40445443 (Ocampo-Navia 2025 review) supplies a third prevalence interval and the statement that current usage of "Dandy-Walker syndrome" covers a wider complex than this entry curates. The two DOI-keyed references are the same papers as PMID:36068432 and PMID:40445443 and are cited by PMID instead, because a DOI-keyed snippet sits in skip_prefixes and is not checked by the gating validator. The seventh, PMID:39649865, is deliberately not cited: it is a bibliometric analysis of the 100 most-cited DWS articles, so it reports citation counts rather than disease content and can support no claim here. Mechanism and treatment content beyond those four is built on primary papers retrieved directly from PubMed. No CURIE was taken from the report: every ontology binding was chosen with OAK against conf/oak_config.yaml adapters, which is worth stating because sibling runs in the same batch found a majority of report CURIE labels naming a different term than the report claimed.

    Lump/split decisions, recorded in the entry's notes: block. MONDO:0017110 and MONDO:0017111 (isolated DWM with and without hydrocephalus) are has_subtypes here. MONDO:0022930 (DWM with nasopharyngeal teratoma and diaphragmatic hernia) is left out of scope with the reason recorded, since it rests on a case-report cluster with no mechanistic literature. Syndromic DWM inside Joubert, acrocallosal, Marden-Walker, Ritscher-Schinzel and BANDDOS stays a phenotype of those entries.

    The MONDO:0017110 overlap with Congenital_Hydrocephalus. That entry already carries MONDO:0017110 as a 'Dandy-Walker-associated' has_subtypes entry. The split is kept by design and made explicit in both directions rather than left implicit: this entry owns the malformation and its ZIC1/ZIC4 and FOXC1 pathograph, Congenital_Hydrocephalus owns the CSF-diversion behaviour among other hydrocephalus aetiologies, and one sentence was added to that entry's subtype description pointing here. That is the only change to a pre-existing KB file in this PR.

    Pathograph. Two independent causal loci (ZIC1/ZIC4 haploinsufficiency; FOXC1-dependent posterior-fossa mesenchymal signalling failure) converge on rhombic lip and roof plate patterning failure, then reduced granule cell progenitor proliferation, cerebellar vermis hypoplasia with upward rotation, cystic fourth-ventricular dilatation with posterior fossa enlargement, and fourth-ventricular CSF outflow obstruction reaching the Hydrocephalus phenotype. No mechanism module fits: kb/modules/ has no hindbrain-patterning or posterior-fossa-mesenchyme module, and apical_neuroependyma_integrity_failure scopes itself to periventricular heterotopia, so no conforms_to was declared.

    Three animal models with modeled_mechanisms links. Zic1/Zic4 heterozygous deletion mouse (RECAPITULATES the proliferation node, PARTIALLY_RECAPITULATES the vermian node). Foxc1 hypomorph (RECAPITULATES the mesenchymal node, PARTIALLY_RECAPITULATES the vermian node with a tail-sign readout). G9a/Isl1-Cre conditional recorded at LOW fidelity as a phenocopy lead, not as a DWM locus, with the divergence stated in limitations.

    A HUMAN_MODEL_MISMATCH discussion records that the human posterior rhombic lip forms a progenitor pool with no mouse or macaque counterpart (PMID:31624095), which is the compartment both mouse models are being read as models of. A KNOWLEDGE_GAP discussion records the 65% of DWM+ exomes with no diagnosis.

    Report-surfaced references consumed on a second pass. The first draft cited only PMID:31302658 from the report. Re-walking the report's resolved reference list afterwards found three more that were usable and one that was not, which is what the disposition paragraph above records. PMID:19668217 was the significant miss: it states the FOXC1 causal edge in a single sentence (mesenchyme-secreted signal loss to rhombic lip abnormality to loss of Atoh1 in vermis) and reports that duplications as well as deletions of 6p25.3 are implicated, which changed the FOXC1 node from a loss-of-dosage description to a dosage-change description.

    Corrections made mid-course. Two claims were written stronger than the sources support and were softened before commit: 'FOXC1 is not expressed in the cerebellar neuroepithelium' became a statement of what was measured (mesenchyme-expressed genes fall, neural-tube genes do not), and the cytoband was given as 'proximal 3q' after the sources were found to disagree (Grinberg 2004 says 3q2, Watts 2026 says 3q25.1, HGNC assigns ZIC1 to 3q24).

    Validation: just validate, validate-terms, count-verified-snippets (74/74 verified), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms (0 qualifier terms), check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, check-stubs, and the batched validate-disorders gate. The stub was deleted.

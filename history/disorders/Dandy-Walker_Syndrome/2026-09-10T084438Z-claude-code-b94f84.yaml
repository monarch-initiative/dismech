  summary: 'Create: Dandy-Walker_Syndrome'
  details: |
    Created kb/disorders/Dandy-Walker_Syndrome.yaml de novo for MONDO:0009072, closing claim issue #11515 and deleting stubs/Dandy-Walker_Syndrome.yaml.

    Scope and content. Curated as entry_type DISEASE. The pathograph is a nine-node causal chain from the two mapped lesions to the radiological picture: ZIC1;ZIC4 heterozygous deletion at 3q24 and FOXC1 haploinsufficiency at 6p25.3, plus NID1/LAMC1 meningeal extracellular matrix disruption, converging on posterior fossa mesenchymal signalling failure, then rhombic lip progenitor pool failure and reduced Shh-dependent granule cell progenitor proliferation, then cerebellar vermis hypoplasia with upward rotation, cystic dilatation of the fourth ventricle, impaired CSF egress, and finally hydrocephalus and macrocephaly. Both mechanistic literatures are represented as distinct claims: the midline/mesenchyme patterning account from human deletion mapping and mouse genetics, in which FOXC1 acts non-cell-autonomously through the posterior fossa mesenchyme, and the more recent human fetal rhombic lip progenitor work. Sections present: synonyms, description, disease_term, parents, has_subtypes (2), inheritance (2), pathophysiology (9), phenotypes (15), genetic (5), prevalence (2), progression (3), diagnosis (4), environmental (1), treatments (7), animal_models (2, both with modeled_mechanisms), differential_diagnoses (5), discussions (2), notes. 111 evidence items over 38 distinct PMIDs.

    Lump/split. has_subtypes carries the two isolated forms bound to their own MONDO ids, with hydrocephalus (MONDO:0017110) and without (MONDO:0017111); they differ in management rather than mechanism. Syndromic Dandy-Walker is deliberately not a subtype here: where DWM occurs inside another curated syndrome it is a phenotype of that entry, as Acrocallosal_Syndrome and Brain_Abnormalities_Neurodegeneration_and_Dysosteosclerosis already do with HP:0001305. ADDWOC (NID1/LAMC1, MONDO:0012218) is excluded from has_subtypes because MONDO does not make it a descendant of MONDO:0009072 and occipital cephalocele is not a DWM feature; it appears in genetic, in a pathophysiology node, and in differential_diagnoses. MONDO:0022930 (DWM with nasopharyngeal teratoma and diaphragmatic hernia) is not modelled because no quotable source was found for it in this round. No mechanism module conformance was declared: the KB has no posterior fossa, CSF-dynamics or rhombic lip module, and creating one from a single disease would be premature. No datasets, clinical_trials, biochemical, histopathology or computational_models sections, for the same want of quotable sources. PubMed was searched for a GeneReviews chapter on isolated Dandy-Walker malformation and none exists, so there is no GeneReviews baseline for this entry.

    Provider and corrections. Provider was Perplexity sonar-deep-research; the report and its citations sidecar are committed alongside the entry. It carried needs_review true and its citation base is thin for its length, 7 resolvable references against 19 citations, the remainder being OMIM, MedlinePlus, Wikipedia, Radiopaedia, KEGG, Harmonizome and MalaCards pages that cannot be cited, so most of the entry's evidence was sourced independently through PubMed. Six of the report's CURIEs resolve but name something else, and none reached the entry: NCIT:C80438 offered as Ventriculoperitoneal Shunt is Exempt Device, NCIT:C116195 offered as Endoscopic Third Ventriculostomy is Leukemic Cells Measurement, NCIT:C28239 offered as Occupational Therapy is Cobalt Co-60, NCIT:C15323 offered as Speech Therapy is Salpingo-Oophorectomy, NCIT:C16810 offered as Magnetic Resonance Imaging is Magnetic Resonance Spectroscopy, and GO:0021542 offered as rhombomere development is dentate gyrus development. The entry uses NCIT:C168483, NCIT:C182204, NCIT:C121351, NCIT:C159273 and NCIT:C16809 instead. Note that a label-only check passes on all four fabricated NCIT codes because the label agrees with the CURIE; only reading each term's meaning catches that the concept is wrong for the claim. The report's assertion that developmental outcome is worse with associated supratentorial anomalies is contradicted for neurodevelopmental outcome specifically by PMID:30320441, so the entry states the disagreement between that paper and PMID:34507295 rather than the assertion.

    Corrections made while finishing the draft. The EUROCAT prevalence record carried prevalence_class BAND_1_9_PER_1000000 against a rate of 6.79 per 100,000; the correct Orphanet-aligned band for that rate is BAND_1_9_PER_100000, and it was changed. Nothing in the validation stack compares prevalence_class with rate_per_100000, so this passed every gate. An evidence item was also added to the Hydrocephalus phenotype for the 20.4% operative CSF drainage figure from PMID:25552847, which the phenotype description quoted without citing at the point of claim.

    Validation. All commands run from the worktree with UV_PROJECT_ENVIRONMENT pointed at the shared virtualenv. just validate: schema no issues, terms passed, 111/111 snippets verified. just validate-disorders (authoritative batched pass): passed. just count-verified-snippets: 111/111. just validate-terms: passed. just check-entity-refs: OK. just check-causal-targets: OK, no new broken targets. just check-duplicate-keys: OK. just check-enum-values: OK. just list-gene-term-mismatches: 10 of 10 gene bindings named by the entry, zero findings, zero uncached. just check-snippet-grading, check-title-snippets, check-snippet-length, check-reference-titles, check-folded-hyphens, check-environmental-evidence: all OK with no new baseline entries, and no baseline file was modified. just normalize-cache and just check-term-cache-integrity: OK. qualifiers is not used anywhere in the entry, so check-qualifier-terms-online does not apply.

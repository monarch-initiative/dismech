  summary: 'Review round 1: add Macrocephaly and Ataxia, CMA diagnosis, supportive
    care'
  details: |
    Round 1 of review on PR #11578 (CHANGES_REQUESTED, one important finding and four suggestions). All of it worked in a single push, because this repository dismisses stale approvals on every push.

    The important finding: two core clinical phenotypes were missing, both quotable from cache files the PR already committed.

    Macrocephaly (HP:0000256) added, and attached as a sequelae edge from the Hydrocephalus phenotype rather than as a free-standing entry, since it is the clinical readout of that node and not an independent lesion. No frequency is asserted on it: both sources describe it as the commonest sign of raised intracranial pressure, which is a statement about presentation among symptomatic children rather than a proportion of all affected individuals, and inventing a band from that would be the same error the reviewer praised the entry for avoiding elsewhere.

    Ataxia (HP:0001251) added at OCCASIONAL. This was the substantive gap: the entry built a detailed cerebellar vermis hypoplasia mechanism and carried no cerebellar motor sign. The two sources sit in tension on prominence - PMID:40445443 calls ataxia and nystagmus key symptoms, PMID:36068432 calls the same focal cerebellar deficits relatively uncommon - and the band follows the lower reading. Both quotes are curated so the tension is visible rather than resolved silently, and the description says explicitly that a severe structural cerebellar lesion does not oblige a prominent cerebellar motor syndrome.

    Verification before use, not on trust. Both CURIEs were resolved with OAK (ols:hp) and all six new snippets were checked as exact substrings of the cached records with a script before being written, rather than copied from the review body.

    Suggestions taken. Chromosomal microarray added to diagnosis: PMID:41736477 carries a DWM-specific yield (25%) and an explicit statement that exome can miss copy-number variants so the two tests are complementary, which matters here because both established loci are CNVs. No diagnosis_term was bound - the existing diagnosis entries carry none, and CLAUDE.md records NCIT:C171192 'Chromosomal Microarray Analysis' as actually meaning Electronic File Size, so no term beats a guessed one. GO:0021509 roof plate formation changed from modifier DECREASED to ABNORMAL after confirming ABNORMAL is in ModifierEnum; the node describes disrupted specification and maintenance rather than a quantitative decrease, and the sibling GO:0030902 binding in the same node already used ABNORMAL.

    Suggestion taken in a narrowed form. The reviewer asked for treatments covering Seizure and Global developmental delay, naming antiepileptics and early PT/OT/speech. Searching every cached reference for antiepileptic, anticonvulsant, physiotherapy, rehabilitation, early intervention, speech therapy and occupational therapy returned nothing quotable. What the caches do support is a general management claim, so a single Multidisciplinary Neurological Follow-Up and Management of Associated Anomalies treatment was added (NCIT:C15747 Supportive Care), targeting both phenotypes and carrying the two sentences that actually exist. A note records why no drug-specific or therapy-specific entry is asserted: symptomatic management here is ordinary paediatric practice with no disease-specific trial evidence, and writing an evidence block around a generic statement would be worse than the gap.

    Corrected in the PR body: it said three prevalence records where the file has four.

    Not a schema defect after all. The previous history record and the PR reported AnimalModel.name as documented-but-undeclared. That was wrong: AnimalModel declares name under attributes rather than in the slots list, and entity_refs.SECTION_KEYS resolves animal_models# on name first. The three models were renamed and species restored to Mouse in commit ec68e5083 before this round.

    Validation after the round: just validate-disorders over both changed files, just validate (83/83 snippets on this entry), validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, list-gene-term-mismatches, check-stubs, validate-history.

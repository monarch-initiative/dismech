  summary: 'Review round 1: connect the cerebellar arm of the pathograph'
  details: |
    Answering the CHANGES_REQUESTED review from ai4c-reviewer on PR #11592
    (review 5165061889, write-up in comment 5615860109), in one push.

    Blocking finding (the pathograph terminated only in the CSF arm). Four
    downstream edges were added to the existing "Cerebellar Vermis Hypoplasia
    with Upward Rotation" node, using bare-name targets, so the four cerebellar
    phenotypes that were curated with evidence but explained by nothing are now
    reachable from the malformation:

      Ataxia                       DIRECT                          PMID:26105056
      Hypotonia                    DIRECT                          PMID:26105056
      Global developmental delay   INDIRECT_UNKNOWN_INTERMEDIATES  PMID:21418200
      Intellectual disability      INDIRECT_UNKNOWN_INTERMEDIATES  PMID:9577385

    The review pointed at the deep-research report's Section 6 Step 5 as the
    causal statement. A research report is not a citable source, so primary
    literature was fetched instead and every snippet is an exact quote from a
    committed references_cache file. The two cognitive endpoints are indirect
    because hydrocephalus, associated supratentorial anomalies and the
    underlying chromosomal lesion all bear on them and no mechanism between the
    malformed vermis and the deficit is established; the two motor endpoints are
    direct because the vermis is the coordination structure itself. Each edge
    carries a description saying why it takes the link type it does.

    Non-blocking suggestions taken.

    1. FGF17 added to genetic at relationship_type UNKNOWN, not CAUSATIVE. The
       human evidence is a single girl with a de novo 8p21.2-p21.3 deletion and
       classical DWM in whom FGF17 was downregulated (PMID:21484435); FGF17
       itself lies 1 Mb outside the deleted interval, so it is a position effect
       argued from one case. A 2024 gene review (PMID:39327214) says outright
       that how FGF17 is implicated in DWM remains unclear, and is cited for
       that.
    2. The three evidence-free downstream edges now carry evidence. The
       cyst-to-CSF-egress edge cites the membrane that blocks communication with
       the subarachnoid space (PMID:40445443), which also explains why
       hydrocephalus is variable here. The CSF-egress-to-macrocephaly edge cites
       raised intracranial pressure as the mechanism and was retyped from
       INDIRECT_UNKNOWN_INTERMEDIATES to INDIRECT_KNOWN_INTERMEDIATES with the
       two intermediates named, since one of them is a node in this graph.
       The vermis-to-cyst edge is the interesting one: the primary literature
       does not support it as written. The classical embryological model runs
       the other way, with the anterior membranous area expanding first and
       displacing the vermis. Rather than attach a co-occurrence quote and call
       it support, the edge keeps its direction (which follows the modern
       rhombic-lip developmental model the rest of this entry is built on) and
       carries the contrary account as a REFUTE item with a description saying
       so.
    3. Cystoperitoneal Shunt keeps NCIT:C15329. NCIT has no clinical-action term
       for cystoperitoneal shunting: the only peritoneal shunt procedure term is
       NCIT:C168483, which is ventriculoperitoneal and names a different
       operation, and NCIT:C20569 "Shunt" is a retired concept. The device
       concept is now carried as a qualifier (NCIT:C16830 Medical Device ->
       NCIT:C50174 Shunt Device) so it stays queryable, per the device carve-out
       in CLAUDE.md. The search and its outcome are recorded in the treatment's
       notes.
    4. HP:0001274 (Agenesis of corpus callosum) now has an agenesis-specific
       citation: PMID:1863935 names agenesis of the corpus callosum among the
       associated malformations in a 38-case series. The 20.8% dysgenesis item
       is kept, because that figure is what places the phenotype in the
       OCCASIONAL band, but it is now marked directness: INDIRECT with the
       explanation stating that dysgenesis is the broader category and the
       figure is therefore an upper bound on agenesis.
    5. Dilated fourth ventricle keeps OBLIGATE but no longer rests on a single
       case report: PMID:25552847, a national population-based analysis, is
       added for the definitional claim. The description now says the band
       records a diagnostic criterion rather than a measured frequency, and
       notes that the 2022 quantitative reanalysis defines the phenotype on
       vermian measures without listing fourth-ventricle dilatation.
    6. biological_scale on "Impaired Cerebrospinal Fluid Egress from the Fourth
       Ventricle" changed ORGANISM -> TISSUE. The reviewer's stated reason (that
       GO is molecular/cellular) is not right - GO:0090660 is a multicellular
       organismal process and the binding is sound - but the underlying question
       was fair. The node's substrate is the fourth ventricle and its outlets, an
       anatomical structure, which is what TISSUE describes; ORGANISM is for
       systemic or multi-organ substrates. The three adjacent malformation nodes
       are already TISSUE.
    7. Two of the research-surfaced phenotypes were added because primary
       sources were found for them: Cataract (PMID:28635420, 9 of 187 patients)
       and Congenital heart defect (PMID:36068432, 3 of 28 children with PDA,
       VSD and tetralogy of Fallot; corroborated by PMID:1863935). Congenital
       heart defect is bound to HP:0001627 Abnormal heart morphology rather than
       to a specific lesion, because the reported lesions are several and none
       dominates.

    Declined, with reasons recorded in the entry notes as well as here.

    - The 1:3 male-to-female ratio was not added. Both sources in this entry
      that report sex contradict it: PMID:28635420 gives 46.5% male across 187
      patients and PMID:36068432 gives 17 boys to 11 girls in 28 children. Both
      are male-predominant. The figure is aggregator-sourced in the research
      report and no primary source was found for it.
    - Prominent occiput, frontal bossing and platybasia were not added. No
      primary source for any of them was found across the references consulted.
      They are Malacards-sourced in the report, and an unsourced phenotype is
      worse than an absent one.
    - "Cerebellar hypoplasia" was not added as a separate phenotype: the entry
      already carries Cerebellar vermis hypoplasia, which is the specific lesion
      and the one the diagnostic criteria are written on.

    Validation. just validate: passed, 125/125 snippets verified against cached
    references (111/111 before this round). just validate-terms: passed. just
    validate-disorders: passed. check-entity-refs, check-causal-targets,
    check-duplicate-keys, check-enum-values, check-qualifier-terms (and
    check-qualifier-terms-online, which resolved the new NCIT:C50174 qualifier
    against OAK): all OK. check-folded-hyphens, check-snippet-length,
    check-title-snippets, check-snippet-grading, check-reference-titles: no new
    findings, no baseline touched. check-term-cache-integrity and
    normalize-cache: clean.

    Five new references cached: PMID:26105056, PMID:21418200, PMID:9577385,
    PMID:21484435, PMID:39327214.

    Not resolved. The reviewer could not verify the entry's claim that no
    GeneReviews chapter exists for isolated Dandy-Walker malformation, because
    network tools were blocked in the review environment. That claim is
    unchanged and still stands on the original PubMed search; it was not
    re-verified in this round either.

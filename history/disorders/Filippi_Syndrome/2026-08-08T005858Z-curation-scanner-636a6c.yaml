  summary: 'Review response: address CHANGES_REQUESTED on PR #7927'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #7927 (2026-08-04),
    which had sat unaddressed for four days. All five 🟡 IMPORTANT items and three of
    the five 🔵 SUGGESTIONS are addressed here. No new references were fetched — every
    change is sourced from sentences already present in the nine cached abstracts,
    which is what the review said was available.

    IMPORTANT 1 (no deep-research artifact). Not fixable by editing the entry; answered
    in the PR instead. No DR provider run was made for this entry — the literature is
    22 studies / 43 patients total and all nine papers were read directly, so a
    synthesis layer would have added a hallucination surface without adding coverage.
    Signaled explicitly in the PR body per the reviewer's request rather than left to
    be inferred.

    IMPORTANT 2 (diagnosis section absent). Added a `diagnosis:` block with one entry,
    "CKAP2L molecular genetic testing" (NCIT:C15709 Genetic Testing), carrying both
    diagnostic routes the literature actually used: homozygosity mapping + WES in the
    consanguineous discovery family (PMID:25439729) and family-based WES establishing
    compound heterozygosity in the outbred family (PMID:34921061). A `notes:` field
    carries the negative-result caveat (4/8 clinically diagnosed individuals had
    biallelic CKAP2L variants), matching the caveat already in the genetic-counseling
    treatment and the entry-level notes.

    IMPORTANT 3 (half-consumed sentences). Added two phenotypes from clauses already
    quoted in the file for their siblings: Cardiovascular Defects (HP:0001627 Abnormal
    heart morphology, from the PMID:42404495 "additional manifestations" sentence that
    already backs Dental Anomalies) and Hair Abnormalities (HP:0001595 Abnormal hair
    morphology, frequency OCCASIONAL, from the PMID:25439729 sentence that already
    backs intellectual disability, seizures, cryptorchidism and dental anomalies). The
    cardiovascular phenotype carries no frequency band: the systematic review pooled
    molecularly confirmed CKAP2L disease with Filippi-like phenotypes and does not
    resolve which lesions or how many patients.

    IMPORTANT 4 (hyperpigmented macules dropped). Split the single "Hypopigmented and
    Hyperpigmented Macules" phenotype into two, replacing HP:0001053 Hypopigmented
    skin patches with the two exact-label terms the reviewer identified: HP:0009719
    Hypomelanotic macule and HP:0001034 Hypermelanotic macule. Both are supported by
    the same PMID:38738944 snippet. The prior note acknowledging the lost
    hyperpigmented component is gone because the gap is gone.

    IMPORTANT 5 (unevidenced Anti-Seizure Medication treatment). Kept the treatment but
    fixed what made it weak. Added `therapeutic_agent` NCIT:C264 Anticonvulsant Agent
    (per the CLAUDE.md rule for NCIT:C15986 pharmacotherapy) and attached a PARTIAL
    evidence item quoting the systematic review's symptom-directed-management sentence,
    with an explanation that states plainly what the citation does NOT establish: no
    published source names an anti-seizure agent or regimen in Filippi syndrome. The
    description was rewritten to say the same thing, so the claim is not stronger in
    prose than in evidence. Chose this over the reviewer's alternative (fold into
    supportive care) because the seizure phenotype is independently evidenced and
    losing the management point would understate the clinical picture — but the
    epistemic status is now explicit rather than implied.

    SUGGESTION (LCL cell type). Rebound the patient-derived lymphoblastoid cell from
    CL:0000542 lymphocyte to CL:0017006 B-lymphoblast, verified with OAK.

    SUGGESTION (renal cortical thinning). Added as a phenotype. HPO has no "renal
    cortical thinning" term; the nearest specific term, HP:0002048 Renal cortical
    atrophy, would assert an acquired degenerative process, whereas the finding here
    accompanies congenital hypoplasia. Bound to the parent HP:0011035 Abnormal renal
    cortex morphology with the specific finding carried in preferred_term, and the
    reasoning recorded in the description so the coarseness is a decision rather than
    an oversight.

    SUGGESTION (classifications block). Added `harrisons_chapter:
    GENETICS_ENVIRONMENT_DISEASE` — the enum whose definition explicitly covers
    mechanism-defined Mendelian syndromes spanning multiple organ systems. The other
    classification axes were left empty: this is not a lysosomal, IUIS, channelopathy,
    or ICIMD disorder, and placing it in the ISDS skeletal nosology would require a
    nosology-group determination I could not source.

    SUGGESTION (high frontal hairline). NOT added as a phenotype — and the phrase was
    REMOVED from both places it appeared in the entry: the prose of the "Impaired
    Craniofacial and Digital Morphogenesis" pathophysiology node, and the description
    of the "Distinctive Craniofacial Dysmorphism" phenotype. The first removal was made
    in this session; the second was missed here and corrected in follow-up after PR
    review caught the surviving phrase, so the two facial-gestalt lists now agree.
    Grepping all nine cached references for "hairline" returns nothing, so it was an
    unevidenced prose claim of exactly the kind issue #7791 describes. The remaining
    facial features in both descriptions (broad/high nasal bridge, underdeveloped alae
    nasi, micrognathia) are each supported by a quoted snippet.

    SUGGESTION (PMID:35224850 title-as-snippet). Reviewer said keep it. Unchanged.

    GeneReviews. The reviewer asked for confirmation that the search was run. There is
    no GeneReviews chapter for Filippi syndrome; the systematic review (PMID:42404495)
    is the closest thing to a synoptic source and is cited throughout.

    Validation. `just validate kb/disorders/Filippi_Syndrome.yaml` passes schema, terms,
    and references; snippet count rose 54/54 -> 61/61 verified, i.e. all seven new
    evidence items verify against the existing cache. `just count-verified-snippets`
    independently reports 61/61. Term-cache diff is additive-only: two rows
    (HP:0001034, HP:0011035) in cache/hp/terms.csv plus their two enum-membership rows,
    all in canonical order with real derivation timestamps.

    Reference-cache churn, fourth sighting. Running the reference validator again
    rewrote 7,725 references_cache/*.md files with the `reference_id` YAML quoting
    change. Reverted and kept out of this branch, as in the two prior sessions on this
    entry. This is now the fourth independent observation across three PRs and it still
    has no issue of its own.

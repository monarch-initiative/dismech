  summary: Create Filippi Syndrome CKAP2L craniodigital disorder
  details: |
    New autosomal-recessive CKAP2L disorder MONDO:0010092 created from a 2026 PRISMA systematic review PMID:42404495, the seminal gene-discovery paper PMID:25439729, and a spectrum-expansion series PMID:38738944. NEC preflight passed: MONDO definition, OMIM:272440, and CKAP2L are coherent. Modeled CKAP2L mitotic-spindle loss of function driving impaired neural-progenitor proliferation and microcephaly; 11 phenotypes, causative genetic block with gene_term, ultra-rare cases-in-literature prevalence, supportive and surgical treatments. All 26 snippets verified as exact substrings of cached abstracts; schema/term/reference validation pass.

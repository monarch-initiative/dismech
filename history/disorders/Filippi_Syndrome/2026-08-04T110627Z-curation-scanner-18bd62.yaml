  summary: 'Create: Filippi Syndrome (CKAP2L, MONDO:0010092)'
  details: |
    Second-pass expansion of the Filippi syndrome entry, built ON TOP of the existing
    `curate/filippi-syndrome-6111` branch (commit 2bec6035, 2026-07-12) rather than
    replacing it. That earlier session created a valid 2-node / 11-phenotype entry but
    no PR was ever opened for it, so the work sat stranded and issue #6111 still read as
    untouched. Its commit and its history record are preserved as ancestors here; the
    branch was refreshed by merging origin/main (it predated the `biological_scale`
    slot, so it no longer validated), and the two conflicted derived cache CSVs were
    resolved to main and re-derived by the validators rather than hand-merged. Its
    `synonyms` block and its `creation_date` (2026-07-12T07:27:01Z) are carried forward,
    and its generic craniofacial-dysmorphism phenotype (HP:0001999) was kept alongside
    the finer-grained facial terms.

    Original context: the entry answers the stale unassigned lit-scan issue #6111 (Filippi syndrome systematic review, PMID:42404495), which had sat unactioned since 2026-07-12 with no assignee and no comments.

    Identity check before curation (NEC preflight, done manually because the disease is single-gene and MONDO records a causal gene): MONDO:0010092 "Filippi syndrome" carries relationship RO:0004003 HGNC:26877 (CKAP2L) and xrefs OMIM:272440 / Orphanet:3255. Every reference cited in the entry is CKAP2L-centric, so the curated disease identity matches the intended MONDO entity.

    Mechanism curated as two arms. CANONICAL "mitotic_proliferation_deficit_model": biallelic CKAP2L loss of function -> loss of CKAP2L from spindle poles -> multipolar/shortened spindles, chromosome missegregation, cytokinesis failure -> neural progenitor division failure -> cortical progenitor pool depletion -> reduced cortical neuron output and postnatal microcephaly. Four of those nodes declare conforms_to against neural_progenitor_centrosome_spindle_dysfunction. EMERGING "centrosomopathy_ciliary_model": CKAP2L also localizes to the ciliary basal body and negatively regulates primary cilium length (PMID:41370039), the basis of the 2026 proposal to reclassify the syndrome as a centrosomopathy; curated as emerging, not established.

    Deliberate non-conformances, both recorded as discussions rather than silently omitted: (1) limb_digit_patterning_serial_homology is NOT declared despite the syndactyly being serially homologous across hands and feet, because no evidence links CKAP2L to the SHH/GLI3/HOXD patterning gradients that module requires; (2) ciliopathy_dysfunction is NOT declared pending a patient-level correlate of the cell-line ciliary phenotype.

    Four discussions: a HUMAN_MODEL_MISMATCH on the Ckap2l knockout mouse showing no developmental phenotype (only reduced male fertility) while human biallelic loss causes a multiple-congenital-anomaly syndrome; a KNOWLEDGE_GAP on how a spindle defect yields cutaneous syndactyly (interdigital apoptosis versus autopod proliferation); an EMERGING_HYPOTHESIS on the centrosomopathy reclassification and its missing clinical correlate; and a KNOWLEDGE_GAP on genotype-phenotype correlation. Each carries structured proposed_experiments with decision criteria.

    Evidence discipline. 9 references, all fetched with just fetch-reference; 53/53 snippets verified by just validate-references. Two candidate PMIDs surfaced by PubMed search were discarded as wrong papers (24236085, 4050862) and one fetched-but-uncited record (30921095, early-onset puberty, no abstract) was deleted rather than left as an orphan cache file. PMID:35224850 has no abstract in PubMed (a correspondence piece), so its article title is quoted as the snippet and the item is marked PARTIAL with the limitation stated in the explanation, rather than leaving the "normal intellect" claim unevidenced in prose.

    Known repo-level issue observed again: running just validate-references locally rewrites ~7,700 references_cache/*.md files with a reference_id YAML quoting change. That churn was reverted and kept out of this branch; it is the same churn flagged in the PR #7886 discussion.

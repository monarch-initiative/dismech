  summary: Sacrococcygeal teratoma as a differential diagnosis
  details: |
    Adds a differential_diagnoses section, placed after diagnosis, with one row: sacrococcygeal
    teratoma (MONDO:0042727), the teratoma of the sacrococcygeal region outside this syndrome.
    Its distinguishing features come from three comparative studies: a multicentre series of 203
    resected sacrococcygeal teratomas, 25 of them in children with Currarino syndrome, in which
    the Currarino tumours were all mature, smaller, mostly of Altman type IV and mostly
    diagnosed after birth, with recurrence rates that did not differ significantly
    (PMID:40541662, already cited in this entry); a Dutch national series of 205 and 16
    patients, in which malignancy-free survival was lower in sacrococcygeal teratoma
    (PMID:25746708); and a global cohort of 3183 and 205 patients, in which malignant
    transformation at initial resection and malignant histology at recurrence were more frequent
    in sacrococcygeal teratoma and survival did not differ (PMID:42250912). The two malignancy
    studies are newly cited here; each sentence also quoted in the sacrococcygeal teratoma
    entry, or in its open change, PR 18532, is graded the same here. Validation: just validate
    passes, all 130 snippets verify, and the full gate set passes.

  summary: 'Create: Currarino_Triad'
  details: |
    New entry for Currarino triad (MONDO:0008305), autosomal dominant heterozygous MNX1 loss of function with incomplete penetrance and variable expressivity. Curated from primary literature fetched by PMID (gene discovery, mutation surveys, cohort and surgical series, malignancy reports), the Dworschak 2021 genetic review and the Orphanet ORPHA:1552 record. The pathograph runs from MNX1 haploinsufficiency through a caudal notochord and dorsal-ventral patterning defect (marked as inferred, with INDIRECT evidence) to four branches: sacral dysgenesis, hindgut malformation, aberrant secondary neurulation, and persistent endodermal-neural communication plus a primitive streak remnant hypothesis for the teratoma; these end in the triad phenotypes, spinal dysraphism, bladder and bowel sequelae, meningitis and neuroendocrine malignancy. The Hlxb9 knockout mouse is recorded as FAILS_TO_RECAPITULATE with a HUMAN_MODEL_MISMATCH discussion, and MNX1-negative cases as a KNOWLEDGE_GAP rather than a subtype. 7q36 deletions are a variant class of the MNX1 record. One OpenScientist deep-research report was used as a lead after the entry had been drafted. Its 26 references all resolved; term validation set needs_review for six mislabelled HP CURIEs, none of which were bound. The report also gives HGNC:4628 for MNX1, which is GSTA3; the binding used is hgnc:4979, checked against the HGNC REST record. just preflight-dr exited 2 because the local MONDO build is absent. From the report, PMIDs 40541662, 35282111, 42489929, 16498628, 19853743, 21763840, 23466002, 12847376 and 29401559 were read and cited. Not used: 25136833, 29309627 and 30012177 (motor neuron, neonatal diabetes and cancer biology of MNX1, outside this disease), 42508731 and 41989599 (anterior sacral meningocele in general), 42864507, 22901924, 41916044, 23590527, 38585544 and 23948812 (single cases or points already covered). No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER); no ClinGen MNX1 assertion was found in the current ClinGen export. Validated with just validate, validate-terms, count-verified-snippets, the entity, causal-target, coarse-phenotype, logical-rule, duplicate-key and block-scalar checks, the snippet grading, length, title and reference-title gates, and validate-disorders.

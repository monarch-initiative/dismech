  summary: 'Create: Spinocerebellar Ataxia, Autosomal Recessive 32'
  details: |
    De novo curation of SCAR32 / PRDX3-associated neurodegeneration (MONDO:0859245, PRDX3). entry_type decided as DISEASE: MONDO places the term under autosomal recessive cerebellar ataxia, the concept is gene-defined with one conserved pathograph (PRDX3 loss -> unbuffered mitochondrial matrix hydrogen peroxide -> cerebellar neuronal oxidative injury -> cerebellar cortical degeneration -> progressive ataxia), and the ataxia space already curates sibling SCAR entries (SCAR15, SCAR20) as standalone diseases.

    Grouping check: kb/groupings/Cerebellar_Ataxias.yaml binds 32 explicit DISEASE members, including several SCAR entries and Autosomal Recessive Cerebellar Ataxia With Late-Onset Spasticity. SCAR32 satisfies both NECESSARY criteria (ataxia via HP:0001251 closure; cerebellar localization via the HP:0001317 closure through curated Cerebellar atrophy), so it should join that grouping. Left for a separate PR because adding a member edits a shared file.

    Deliberate non-conformance decision: the entry does NOT declare conforms_to cerebellar_purkinje_degeneration. No autopsy or biopsy neuropathology of a SCAR32 patient has been published and the word Purkinje appears nowhere in the PRDX3 ataxia literature, so the degeneration is curated at the cerebellar-cortex level that imaging supports, with a KNOWLEDGE_GAP discussion recording the gap and two proposed experiments that would settle it.

    Frequency discipline: only Progressive cerebellar ataxia and Cerebellar atrophy carry bands (OBLIGATE), the latter on an explicit published statement that atrophy is ubiquitous. Everything else is left unbanded because the patients are scattered across single-case reports with no pooled denominator, and hearing impairment and cognitive impairment are each recorded as explicitly ABSENT in other patients (curated as NO_EVIDENCE items). The Japanese 0.97 percent figure is a diagnostic yield in a selected repeat-negative cohort and is deliberately kept out of the prevalence block.

    Models: zebrafish prdx3 F0 crispant and Drosophila pan-neuronal/pan-glial knockdown in animal_models with modeled_mechanisms; patient dermal fibroblasts in experimental_models carrying a FAILS_TO_RECAPITULATE link for the 2024 line whose respirometry was indistinguishable from controls.

    Validated: just validate (schema + terms + 58/58 snippets), check-duplicate-keys, check-entity-refs, check-causal-targets, plus the whole-KB ratchets.

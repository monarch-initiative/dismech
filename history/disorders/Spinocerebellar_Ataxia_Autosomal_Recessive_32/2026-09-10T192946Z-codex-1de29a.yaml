  summary: Follow up approved SCAR32 review with source-scoped phenotypes and hearing
    specificity
  details: |
    Assessed all seven suggestions on approved PR #11636 against primary full contexts and current HPO. Added ptosis, COX-negative muscle fibers, decreased selenium, social withdrawal, mood disturbance, bradykinesia and hypomimia. Refined profound hearing to HP:0012715; reviewer-suggested HP:0012712 means mild hearing. Added two provisional basal-ganglia causal edges and one muscle-histochemistry readout; qualified the Babinski edge as INDIRECT_UNKNOWN_INTERMEDIATES and cited an explicit primary examination. Corrected myoclonus cohort explanation; anti-thyroglobulin remains a single-patient measurement. Changed exercise category and stale frequency/MRI/source notes. Retained honest fetched Silverchair URL title because DOI/PMID caches are abstract-only and Europe PMC lists no full text; article identity is recorded in notes. No disease-specific GeneReviews chapter identified. Follow-up adds 16 net snippets (17 added, 1 replaced/removed), 7 phenotypes, 1 term rebind, 2 causal edges, 0 mechanisms and 1 readout. All 20 new or changed evidence items carry exact fetched titles. Final 42 phenotypes: 22 causal-connected, 5 readouts and 15 genuine clinical attribution gaps; new ptosis, selenium and behavioral gaps reflect unresolved cause, not omitted established mechanisms. COX muscle staining does not establish the cause of ptosis or exercise intolerance in another patient. Preserve prior Codex history and distinguish reported-case occurrence from population frequency.

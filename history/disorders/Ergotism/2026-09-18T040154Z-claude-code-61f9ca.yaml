  summary: 'Create: Ergotism'
  details: |
    New Disease entry for ergotism (MONDO:0042496), intoxication by the ergot alkaloids of Claviceps purpurea. Curated on a branch cut fresh from origin/main. Duplicate preflight clean on all three surfaces: no entry or stub on origin/main, no PR, no issue.

    Deep research: one claude_code run (research/Ergotism-deep-research-claude_code.md). The report predates the in-line validation blocks, so validate-research-reference and validate-research-terms were run over it afterwards - 23/23 references resolved with none unresolved, 18/20 CURIEs resolved with one obsolete and one unverifiable.

    That report's term suggestions were unusually poor and none was used. It offered HP:0034976 for 'Peripheral gangrene', which is actually Absent pituitary stalk, and HP:0031650 for 'Vasospasm', which is Abnormal atrioventricular valve physiology. Both were caught twice over: by a fresh OLS lookup performed while writing the binding, and independently by the retro-fitted term-validation section, which flags the same two. It also proposed the obsolete CHEBI:4880 for ergotamine. This is the second consecutive entry where re-deriving every CURIE rather than copying it was load-bearing rather than ceremonial.

    The report also cited heavily to Wikipedia, Britannica, National Geographic and StatPearls. None is cited in the entry; where such a passage named a real finding a peer-reviewed source was located and cited instead, and where none was found the claim was dropped.

    Ontology bindings, with the queries recorded rather than the conclusions, per the dismech-terms step 3a rule added since the previous entry. All against the pinned local build the validator reads:

      runoak -i sqlite:obo:ecto search 'l~ergot'         -> nothing
      runoak -i sqlite:obo:ecto search 'l~mycotoxin'     -> CHEBI:25442, ECTO:0000524
      runoak -i sqlite:obo:ecto search 'l~rye'           -> ECTO:0070112
      runoak -i sqlite:obo:ecto search 'l~alkaloid'      -> ECTO:9000271
      runoak -i sqlite:obo:ecto search 'l~vasoconstrict' -> ECTO:9001855
      runoak -i sqlite:obo:ecto search 'l~ergotamine'    -> nothing
      runoak -i sqlite:obo:ecto search 'l~cytochrome'    -> nothing

    The dietary route binds ECTO:0000524 exposure to mycotoxin, exact for the agent class and matching MONDO's own placement of ergotism under mycotoxicosis. ECTO:0070112 exposure to rye bread via ingestion looks ideal and was rejected after reading its record: it involves FOODON:03305210 rye bread (enriched), a fortified commercial product rather than contaminated grain. ECTO:9000271 exposure to alkaloid was rejected as losing the fungal origin the disease turns on. The therapeutic route binds ECTO:9001855 exposure to vasoconstrictor agent, which info -O obo confirms is is_a ECTO:0000509 exposure to drug and involves CHEBI:50514, so it is preferred to the broader parent. The CYP3A4-inhibitor co-exposure binds the broad ECTO:0000509 because the exposure is defined by an enzyme-inhibition property shared across three unrelated drug classes and no ECTO class exists for it. Neither bound term is flagged Not4Curation.

    Content: a nine-node causal chain running from exposure through ergoline agonism at 5-HT and alpha-adrenergic receptors, then branching into a vascular arm (sustained smooth muscle contraction, arterial vasospasm, distal ischaemia and dry gangrene) and a central serotonergic arm producing the convulsive form. The CYP3A4-inhibition node sits as a parallel amplifier converging on the receptor node, which is what makes the modern iatrogenic form the same disease as the medieval one. 13 phenotypes, all causally connected. Three environmental exposures - contaminated grain, therapeutic ergot alkaloid, and the CYP3A4-inhibitor co-exposure, the last using EXACERBATES rather than TRIGGERS because it causes no disease alone. Four treatments including two REFUTE items: first-line vasodilators failing in a documented case, and sympathectomy recorded as not improving the clinical course, which is a negative result a plausible mechanism would have predicted to work. Three diagnosis entries, including factitious hypotension - vasospasm severe enough to make non-invasive blood pressure read as unmeasurable, with a paradoxical rise after intravenous vasodilator. Two discussions: whether convulsive ergotism was epidemic serotonin syndrome, and whether regulatory limits that measure only (R)-epimers understate dietary exposure now that the (S)-epimers have been shown vasoactive.

    Two title-quoting evidence items were written and then removed rather than baselined, after check-title-snippets flagged them. One quoted PMID:40046976's title when that paper has a full abstract, and was replaced with three real sentences including 'Coronary angiography was unremarkable', which is a better piece of evidence than the title was. The other quoted the title of PMID:28661928 'Ergotism Masquerading Systemic Vasculitis', whose cached record has no abstract at all; that reference is now cited nowhere, and the differential it names records in notes why. Three snippets under the five-word floor were lengthened to propositional spans rather than baselined.

    Validation: validate-disorders passed (schema, terms, references batched), 91/91 snippets verified offline; compliance 89.1% weighted; check-genereviews --online returns NO_CHAPTER for both Bookshelf collections, as expected for an acquired toxicosis, which is why there is no genetic: section. The report proposed a CYP3A4 pharmacogenomic MODIFIER gene entry; that is not curated, because the interaction that matters is pharmacological inhibition by a co-administered drug and the report itself records that no ergotism-specific pharmacogenomic study was found. All offline gates pass: folded-hyphens, snippet-length, title-snippets, snippet-grading, environmental-evidence, enum-values, case-collisions, duplicate-keys, entity-refs, causal-targets, qualifier-terms.

  summary: 'PR #12113 review round: model systems, nitroprusside agent, term bindings'
  details: |
    Review round on PR #12113. The automated reviewer requested changes on two
    IMPORTANT items and listed eight suggestions; both blocking items are fixed
    and most of the suggestions are taken, in one push. A maintainer also
    supplied a reference mid-round (DOI:10.1007/s11418-022-01673-8 =
    PMID:36635416), which is used in three places.

    Blocking item 1 - therapeutic_agent on Intravenous vasodilator therapy.
    The treatment bound generic NCIT:C15986 Pharmacotherapy with no agent while
    its own description and its verified snippet both name sodium nitroprusside.
    Now carries therapeutic_agent CHEBI:29321 sodium nitroprusside, confirmed by
    `uv run runoak -i sqlite:obo:chebi search "l~nitroprusside"` -> CHEBI:29321
    sodium nitroprusside, CHEBI:7596 nitroprusside, CHEBI:9179 sodium
    nitroprusside dihydrate. The nitrate and calcium-channel-blocker agents
    named in the same description are deliberately NOT added: they appear only
    in the REFUTE item where isosorbide dinitrate and amlodipine failed, and
    were not necessarily given intravenously, so binding them as agents of this
    treatment would misattribute them.

    Blocking item 2 - model systems. The entry had no animal_models or
    experimental_models despite two full sections of the research report on them.
    Added four models, all citing references already in the cache:

    animal_models[0] Sheep single-dose oral ergot sclerotia exposure
    (PMID:33924041). The strongest model available: twelve ewes, six dosed
    orally with ground sclerotia at 600 ug/kg, six water controls, pedal artery
    mounted in a tissue bath twelve hours later. Two links -
    PARTIALLY_RECAPITULATES against Ergoline Agonism at Vascular 5-HT and
    Alpha-Adrenergic Receptors (MOLECULAR/MOLECULAR, aligned) with a readout for
    the 38% rise in phenylephrine sensitivity, and RECAPITULATES against
    Sustained Vascular Smooth Muscle Contraction (CELLULAR/CELLULAR). Limitation
    recorded that only the alpha-1 arm is interrogated; the 5-HT half of that
    node is not measured here.

    animal_models[1] Cattle fescue toxicosis (PMID:33327425 + PMID:22903169),
    PARTIALLY_RECAPITULATES at LOW fidelity against Distal Tissue Ischemia and
    Dry Gangrene. Downgraded from the report's claim on purpose: the report
    described fescue toxicosis as "closely recapitulating the human gangrenous
    phenotype" and cited the Merck Veterinary Manual and a farming magazine for
    it. The peer-reviewed source supports chronic ergot-alkaloid exposure and a
    tolerance split; the gangrene claim rests on a review's statement about the
    species, not on a measurement in these animals. Two typed divergences,
    both cited: PROXY_QUANTITY (the study measured performance parameters and
    cytokines, not the lesion) and SPECIES_MISMATCH (thirteen weeks of
    continuous grazing versus a discrete oral dose). An earlier draft of that
    second divergence asserted rumen-microbiome modification of the alkaloids;
    that was removed as unsourced and replaced with the exposure-schedule
    contrast, which the abstract does state.

    experimental_models[0] Bovine lateral saphenous vein myography
    (PMID:38946059), MEASURES at LOW fidelity against the receptor-agonism node.
    This one needs its caveat read: the report listed the preparation among
    ergot-alkaloid model systems, but the paper it cited applied serotonin and
    subtype-selective 5-HT agonists, no ergot alkaloid at all, and measured
    vasorelaxation rather than contraction. Recorded as PROXY_QUANTITY plus
    BOUNDARY_OMISSION divergences and stated in notes rather than repeated as
    if the preparation had been ergot-tested.

    experimental_models[1] Clavine-type ergot alkaloid cytotoxicity in HepG2 and
    PANC-1 cells (PMID:36635416, the maintainer-supplied reference), MEASURES at
    LOW fidelity against Distal Tissue Ischemia and Dry Gangrene. Three typed
    divergences including SCALE_EXTRAPOLATION, added after `just
    model-scale-audit` reported this as the only upward-extrapolating link in
    the entry (CELLULAR model, TISSUE node) carrying typed divergences without
    one. No pathophysiology node asserts direct cytotoxicity in the human
    disease.

    The same reference also grounds two new things. The dietary-exposure entry
    now cites its LC-MS survey of 41 Claviceps sclerotia for what that exposure
    actually delivers - peptide-type alkaloids in 24 of 41, clavine-type
    alongside them in most of those - and for agroclavine being an EFSA-monitored
    causative agent, which makes the dietary route a current food-safety matter
    rather than a historical one. And a third discussion,
    direct_clavine_cytotoxicity (KNOWLEDGE_GAP), records the open question the
    paper raises: every node in this entry reaches tissue injury through
    ischaemia, and clavines kill cells outright with no vessel involved. It is
    filed as a gap, not a mechanism, because the cell lines are hepatoma and
    pancreatic carcinoma, the concentrations are unrelated to any measured
    plasma level, and the authors state the cytotoxic mechanism is
    unelucidated. The discussion also notes that the iatrogenic form involves no
    clavines at all - ergotamine and ergometrine are peptide-type - so if direct
    cytotoxicity does contribute it would differentiate the dietary form from
    the drug form rather than apply to both.

    Suggestions taken:

    Node count. The reviewer was right and the earlier record was wrong: the
    file has eight pathophysiology nodes, not nine. The CREATE record's
    "nine-node causal chain" is corrected to "eight-node", and the PR body with
    it. This is a factual error about the artifact the record describes, not a
    rewriting of what the session did.

    NCIT:C93007 Balloon Angioplasty replaces generic NCIT:C15329 Surgical
    Procedure on Endovascular revascularisation.

    Two of three diagnosis entries now carry diagnosis_term: NCIT:C16308
    Arteriography on the vascular-imaging entry, NCIT:C167233 Blood Pressure
    Measurement on the factitious-hypotension entry. The third is left unbound
    with the reason recorded: diagnosis_term is a TreatmentDescriptor whose term
    must be reachable from NCIT:C25218, and NCIT:C146918 Medical History Taking
    is not - binding it failed with "Value 'NCIT:C146918' not in dynamic enum
    'TreatmentActionTerm'". The OLS search behind that attempt is written into
    the entry notes.

    Two treatments added. Corticosteroid rescue therapy (PMID:18763151), with
    CHEBI:6890 Methylprednisolone sodium succinate as the agent - the exact salt
    the case used. No target_mechanisms, because the authors state "The
    mechanism by which corticosteroids dilate arteries is not clear" and
    guessing the node would be inventing it. Heparin is named in its notes
    rather than curated as a separate treatment: the only support is that it was
    co-administered, with no outcome attributed to it, and the recovery followed
    the steroid. Amputation of non-viable tissue (NCIT:C15179, PMID:24978905,
    two of twelve patients) also carries no target_mechanisms - none of the
    TreatmentEffectEnum values describes removing tissue a node has already
    killed.

    Two phenotypes added. Cerebral ischaemia (HP:0002637), wired to Arterial
    Vasospasm with Distal Hypoperfusion. Note the source discipline here: the
    ergometrine case suffered two cerebral events, and only the first is
    vasospastic - extensive cortical infarction with subcortical sparing, read
    as a reversible vasoconstriction syndrome. The later middle cerebral artery
    occlusion followed left ventricular thrombus formation and is embolic. The
    reviewer's suggested quote was the MCA stroke; the vasospastic-event quote
    is used instead and the distinction is recorded in the phenotype's notes,
    because a patient with both a vasospastic and an embolic stroke is exactly
    the confusion this node would otherwise import. Nausea and vomiting
    (HP:0002017, one term rather than two, since the source names the pair) is
    deliberately left with no causal inbound edge: central dopaminergic and
    serotonergic action would plausibly explain emesis and the entry has a
    Central Serotonergic Overstimulation node, but the source is a symptom list
    and asserts no mechanism. Phenotype connectivity is therefore 14/15 (93.3%)
    rather than 15/15, which is the honest figure.

    exposure_duration on the therapeutic route changed from ACUTE to
    INTERMITTENT + CHRONIC. The reviewer was right that ACUTE sat oddly with the
    entry's own account: migraine dosing is by definition recurrent discrete
    exposures separated by exposure-free intervals, and the darunavir case
    records "self-medicating for years". The CYP3A4-inhibitor co-exposure now
    carries ACUTE + CHRONIC, since a macrolide course and lifelong
    antiretroviral therapy sit at opposite ends of the same enum.

    Suggestions not taken, with reasons recorded in the entry:

    Sympathectomy stays on generic NCIT:C15329. The reviewer said NCIT has more
    specific terms for both surgical treatments; that holds for angioplasty and
    not for this one. OLS q=sympathectomy returns SNOMED:57071006, mesh:D013562,
    OMIT:0014426 and four SNOMED children, and no NCIT identifier at all;
    q=sympathectomy/sympathetic denervation/lumbar sympathectomy with
    ontology=ncit each return nothing. NCIT:C21110 Sympathetic Block exists but
    names an anaesthetic or chemical block, not the surgical division performed
    in the cited series.

    dorsal horn neuron stays on CL:0000540 neuron. CL:0011000 dorsal horn
    interneuron exists, but the cited source says only "serotonin receptors in
    the dorsal horn of the spinal cord", and the dorsal horn contains projection
    neurons as well as interneurons - binding the narrower term would assert an
    interneuron the source does not name.

    has_subtypes for the gangrenous and convulsive forms: unchanged. The two
    forms remain pathograph branches below the shared receptor node, which the
    reviewer agreed is defensible and arguably better.

    One side effect of the round worth recording: fetching during validation
    upgraded three caches from `abstract_only` to PMC full text
    (PMID:33327425, PMID:33924041, PMID:38946059), which is why those files
    show large diffs. The cattle full text then sharpened the model link it
    supports - it states that gangrenous ergotism in cattle is rare and needs
    acute high-dose exposure plus cold temperatures, while chronic grazing
    produces reduced productivity and reduced blood flow to the extremities.
    That qualification is now curated as a REFUTE item on the link itself
    rather than left in prose, since it is the strongest argument against the
    link it sits on. The bodyless `DOI_10.1007_s11418-022-01673-8.md` cache
    was not committed: the maintainer's reference is cited by its PMID, and a
    cache with `content_type: unavailable` that nothing cites is an orphan.

    Validation on the pushed tree: `just validate-disorders
    kb/disorders/Ergotism.yaml` passes (schema, terms and references batched);
    123/123 snippets verified offline against the committed cache, up from
    91/91; weighted compliance 90.7%, up from 89.1%. Offline gates green:
    duplicate-keys, entity-refs, causal-targets, qualifier-terms,
    title-snippets, snippet-length, snippet-grading, enum-values,
    folded-hyphens, environmental-evidence, case-collisions, reference-titles.
    Full `pytest tests/test_data.py` passes, 6754 tests. One near-miss worth
    recording: a snippet drafted for the bovine myography divergence passed
    `count-verified-snippets` but was not a byte-exact substring - the source
    uses U+2009 thin spaces around "1 x 10-4 M" - and was replaced with a
    clean span rather than relying on the audit's normalization. A fabricated
    reference_title for PMID:40046976 was also caught and replaced with the
    cache title before commit.

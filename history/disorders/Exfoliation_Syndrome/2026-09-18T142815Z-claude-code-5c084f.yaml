  summary: 'Create: Exfoliation Syndrome (MONDO:0100046)'
  details: |
    New entry curated from the Edison Falcon deep-research report research/Exfoliation_Syndrome-deep-research-falcon.md, with Falcon DOIs resolved to PMIDs through PubMed before use and every snippet quoted from the cached abstract. Thirteen-node pathograph: LOXL1 susceptibility genotype, TGF-beta1 excess and oxidative stress in the anterior segment, dysregulated LOXL1 expression and elastic microfibril cross-linking, extracellular chaperone deficiency, exfoliation material fibrillogenesis and deposition, then the three tissue consequences (zonular degradation, iris pigment epithelial degeneration with pigment dispersion, trabecular obstruction by material and pigment) converging on elevated intraocular pressure, lamina cribrosa elastosis, retinal ganglion cell apoptosis and exfoliation glaucoma optic neuropathy, with systemic elastosis as a parallel branch. The glaucoma arm conforms to glaucoma_optic_neuropathy at four nodes; the disorder-specific substitution is physical obstruction of the meshwork by exfoliation material and liberated pigment. Syndrome and glaucoma are curated as one entry with the diagnostic boundary explicit at the node level, following Pigment_Dispersion_Syndrome. Disease term kept on MONDO:0100046 because that is the stub and claim key; MONDO:0008327 (exfoliation syndrome, the term a reader expects) is mapped as an exact match and repointing disease_term to it is flagged as a follow-up. LOXL1 recorded as SUSCEPTIBILITY with polygenic inheritance and the population risk-allele reversal noted; no Mendelian gene asserted. No GeneReviews chapter exists. The Loxl1-null mouse is recorded honestly as failing to form exfoliation material. Systemic cardiovascular and other associations are recorded with their evidence rather than as established mechanism. Validated: just validate passed; count-verified-snippets 128/128; validate-terms, check-entity-refs, check-causal-targets, check-enum-values and check-duplicate-keys passed; pytest -k Exfoliation_Syndrome passed. A first attempt at this curation was cut off by a session limit before writing; this record describes the completed second pass.

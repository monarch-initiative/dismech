  summary: 'Genetics pass: record the MONDO gene-relation disagreement for LOXL1'
  details: |
    Genetics pass for issue #12195 (d2g wiring-006).

    Research first: the entry's own LOXL1, CACNA1A and CYP39A1 records and their cited
    association, meta-analysis, allele-reversal and functional papers were re-read, and the
    MONDO records for both MONDO:0100046 and MONDO:0008327 were inspected with OAK, before the
    reconciliation checklist was opened.

    The one checklist gene, LOXL1 (hgnc:6665), was already curated and already wired: a
    `genetic:` record with `relationship_type: SUSCEPTIBILITY` and six evidence items, plus
    `genes:` bindings on two pathophysiology nodes. No change to the gene curation was needed
    and none was made. The knowledge-graph gap is an export artefact of a kind not previously
    recorded in this campaign: the checklist keys on MONDO:0008327, which is present here as a
    `mappings.mondo_mappings` `skos:exactMatch`, while the KGX exporter reads only
    `disease_term` (MONDO:0100046) and never consults `mondo_mappings`. See dismech#12316.

    What changed: two paragraphs added to `notes:`.

    First, that MONDO:0100046 and MONDO:0008327 are not duplicates. MONDO models the former as
    an `inherited disease susceptibility` class that `predisposes_towards` the latter, so the
    recorded `skos:exactMatch` is a claim about what this file curates rather than a claim that
    the two MONDO classes are the same thing. The pre-existing note already flagged repointing
    `disease_term` as a follow-up; that is unchanged and still not done here.

    Second, a recorded disagreement with MONDO on the gene relation. MONDO relates both terms to
    LOXL1 with RO:0004003, "has material basis in germline mutation in", and the NCIT-derived
    definition of MONDO:0008327 calls the condition "An autosomal dominant disorder caused by
    mutations in the LOXL1 gene". The entry's own evidence - the risk-allele reversal between
    ancestries, the carriage rate among unaffected people, and the Loxl1-null mouse that does not
    form exfoliation material - does not support that reading, and the entry keeps
    SUSCEPTIBILITY. The disagreement is now visible in the file rather than only implicit in the
    grading.

  summary: 'Create: Autosomal Recessive Spinocerebellar Ataxia 17 (CWF19L1)'
  details: |
    Created SCAR17 / CWF19L1-related recessive cerebellar ataxia (MONDO:0014503), entry_type DISEASE. Causal chain CWF19L1 loss of function -> cerebellar developmental failure and degeneration -> cerebellar ataxia; phenotypes include ataxia, cerebellar atrophy, cerebellar vermis hypoplasia, intellectual disability, global developmental delay, hypotonia, and (expanded-spectrum) seizures; autosomal recessive inheritance. CWF19L1 molecular function is unknown per the literature, so no GO molecular function was bound. Evidence from PMID:25361784 (founding family + zebrafish model), PMID:26197978 (compound-het confirmation), PMID:27016154 (progressive atrophy, ID), PMID:36453471 (phenotypic-spectrum expansion). Deep research: falcon unavailable, required run used claude_code provider; preflight-dr PASSed (CWF19L1=21 mentions, OMIM 616127 match). Validated with just validate and just validate-disorders (17/17 snippets verified) plus offline gates. SCAR17 is also named as a differential diagnosis in the existing SCAR15 entry; a cross-link update there is left to a separate change.

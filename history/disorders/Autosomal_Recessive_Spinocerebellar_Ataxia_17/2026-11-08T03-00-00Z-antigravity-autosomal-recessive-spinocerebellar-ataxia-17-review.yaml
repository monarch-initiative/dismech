  summary: Enriched SCAR17 with disease description, Harrison's classifications, zebrafish-grounded cerebellar hypoplasia Purkinje binding, evidenced causal edges, brain MRI diagnosis, and supportive/anticonvulsant treatments.
  details: Reviewed against existing deep research (research/Autosomal_Recessive_Spinocerebellar_Ataxia_17-deep-research-claude_code.md) and cached literature. Added top-level disease description and NEUROLOGIC and GENETICS_ENVIRONMENT_DISEASE Harrison's chapter classifications backed by CWF19L1-specific quotes from PMID:27016154 and PMID:36453471. Kept CWF19L1 Loss of Function free of unverified GO molecular/process/subcellular bindings, grounded Cerebellar Hypoplasia with Purkinje cell (CL:0000121) and cerebellum (UBERON:0002037) via zebrafish zebrin II staining (PMID:25361784), retained cerebellum anatomy on Progressive Cerebellar Degeneration without developmental GO terms, added INDIRECT-evidenced downstream edges to cerebellar and neurodevelopmental phenotypes while leaving extra-cerebellar phenotypes (seizures, extrapyramidal movement disorder, developmental regression) explicitly unwired with explanatory notes, and curated brain MRI diagnosis plus supportive care and anticonvulsant therapy (targeting Seizure via target_phenotypes without unsupported target_mechanisms edges).

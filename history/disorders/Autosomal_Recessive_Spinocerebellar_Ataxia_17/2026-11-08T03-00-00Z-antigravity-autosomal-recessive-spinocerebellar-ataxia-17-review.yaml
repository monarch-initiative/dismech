  summary: Enriched SCAR17 with disease description, Harrison's classifications, cerebellar Purkinje cell and anatomy bindings, brain MRI diagnosis, and supportive and anticonvulsant treatments.
  details: Added top-level disease description and NEUROLOGIC and GENETICS_ENVIRONMENT_DISEASE Harrison's chapter classifications backed by PMID:26197978 and PMID:36453471. Enriched pathophysiology nodes with mRNA processing, cerebellar development, Purkinje cell, nucleus, and cerebellum bindings, plus causal downstream edges to hypotonia, global developmental delay, intellectual disability, extrapyramidal movement disorder, and developmental regression. Added brain MRI to diagnosis and supportive care and anticonvulsant therapy to treatments.

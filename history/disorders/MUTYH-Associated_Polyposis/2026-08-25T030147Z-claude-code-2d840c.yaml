  summary: Curate the monoallelic MUTYH risk conflict and carrier frequency
  details: |
    A large case-control study (PMID:34981295) found no significant association between monoallelic MUTYH pathogenic variants and colorectal, endometrial or breast cancer in individuals of European ancestry, which contradicts the small-increased-CRC-risk clause in the GeneReviews sentence this entry already cites. Rather than silently keeping the GeneReviews claim or silently dropping it, both are curated with the conflict stated: the new items are marked PARTIAL, because they strengthen the recessive architecture the block asserts while contradicting that one clause. Scope limits are recorded on the item (European ancestry only; panel-tested cases against gnomAD controls) and the explanation warns curators not to read the finding as bearing on biallelic carriers. The same study supplies a 1-2% monoallelic carrier frequency, added as a prevalence record with measure_type CARRIER_FREQUENCY and a note warning that carrier frequency must not be conflated with the prevalence of this recessive disorder.

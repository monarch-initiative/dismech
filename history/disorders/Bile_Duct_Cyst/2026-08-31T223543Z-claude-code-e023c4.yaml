  summary: 'Review round 1: reverse the pressure-dilatation direction, replace aims/methods
    snippets, add hypotheses and animal models'
  details: |
    Response to the automated review on PR #10289.

    The CRITICAL finding was correct and is the substantive change. The entry had asserted that raised intracystic pressure drives the cystic dilatation. PMID:24604978, the paper cited for it, reports the inverse: pressure correlates inversely with cyst volume and inversely with common channel length, and states "High pressure cysts had normal pancreaticobiliary junction". The maljunction cysts modelled in this entry are therefore the low-pressure, high-volume, high-amylase ones, and the cyst wall damage tracks enzyme exposure rather than pressure. The node description and its incoming edge were rewritten; the correction is recorded in notes so a later reader sees what was wrong rather than only the corrected text.

    GO:0015721 bile acid and bile salt transport was removed from the pancreatobiliary reflux node. The node describes pancreatic enzymes moving retrograde into the biliary tree; the GO term names a different substance moving the other way. It was a lexical match on "bile", not a real one. This is the same failure class as the earlier CURIE errors in this session: a term that resolves is not thereby a term that fits.

    Six snippets that quoted aims or methods sentences were replaced with result sentences that actually carry the claim. The pattern was quoting "Cyst wall was examined for ulceration, inflammation, fibrosis, and metaplasia" (a methods sentence, which asserts nothing) where the finding sentence "ICCP inversely correlated with cyst wall changes" was available. The treatment link had been evidenced by a sentence about subtype malignancy rather than about the operation, and now quotes PMID:28364277 on complete cyst excision with biliary enteric reconstruction. The hyperplasia-dysplasia-carcinoma node now leads with PMID:17187167 naming that sequence directly, with the stepwise TP53 series as the molecular corroboration rather than as the primary evidence.

    Added: cholangitis HP:0030151, pancreatitis HP:0001733 and choledocholithiasis HP:6001269 as phenotypes; the 20-to-30-fold cholangiocarcinoma risk figure; KRAS as a qualifying somatic finding, recorded with the negative result (16% in maljunction-associated versus 8% in non-associated gallbladder cancer, P = 0.272) rather than as a driver; two mechanistic_hypotheses covering the unresolved reflux-versus-congenital-obstruction debate; two animal_models, the surgical APBDU mongrel puppy that produces dilatation from a maljunction alone and the DBTC rat that orders HDAC1 ahead of COX-2; and a top-level references block generated programmatically from the cache frontmatter.

    For choledocholithiasis the exact HPO term HP:6001269 was used rather than the suggested parent HP:0001081 Cholelithiasis, since the quoted evidence says choledocholithiasis and the reviewer had separately flagged a habit of binding generic ancestors.

    Validation: 47/47 snippets verified, term validation passed, weighted compliance 100.0%, and the reference-title, snippet-length, snippet-grading, title-snippet, folded-hyphen, duplicate-key and entity-ref gates all pass.

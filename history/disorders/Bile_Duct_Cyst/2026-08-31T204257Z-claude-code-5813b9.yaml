  summary: 'Create: Bile Duct Cyst MONDO:0018805'
  details: |
    Curated from an OpenScientist deep-research report (10 iterations, 87 papers). The pathograph is a single chain with one branch point: congenital pancreaticobiliary maljunction produces a long common channel outside sphincter control, pancreatic enzymes reflux into the biliary tree, and chronic epithelial injury then drives both the cystic dilatation and a hyperplasia-dysplasia-carcinoma sequence ending in biliary tract carcinoma. Two verification failures are worth recording. First, three reference_title values did not match the cache and two more were wrong but passed the 0.85 similarity gate. The cause was that titles had been read from a cut -c8-92 truncated view of the cache frontmatter and the remainder reconstructed from memory, which invented a German centre for a Finnish series and a hospital pairing for a Kashmir series. All titles were subsequently rewritten programmatically from the parsed frontmatter rather than typed. This is the same failure class as concluding absence from a LIMITed query: treating truncated output as complete. Second, seven snippets had been written as paper titles rather than sentences and were replaced with real abstract text. HPO has no term for choledochal cyst or extrahepatic bile duct cyst; this was checked exhaustively across five patterns without a LIMIT, returning only HP:0005209 Intrahepatic bile duct cysts, which is the Caroli lesion and wrong here, so the structural phenotype binds the parent HP:0035013. Todani type V is Caroli disease and is listed as a subtype but not restated, since Caroli has its own entry and a mechanistically distinct ductal plate malformation origin.

  summary: 'Review round 1: titles, diagnosis, FSH, counselling evidence'
  details: |
    Addressed the first review of PR 14373. Added reference_title to every evidence item, copied by script from the title frontmatter of each references_cache file (check-reference-titles passes). Added a diagnosis section: semen analysis (azoospermia defined on centrifuged samples, PMID:41401169; cohort semen findings, PMID:40374915), karyotype and AZF exclusion (NCIT:C16768; PMID:40896145, PMID:42324855), testicular biopsy (NCIT:C15189), and M1AP molecular testing (NCIT:C15709) recording that exome sequencing finds c.676dup (PMID:32673564) but the exon-2 deletion needed genome sequencing (PMID:38073178). Semen analysis carries no NCIT term because an OLS search for 'semen analysis' in NCIT returned nothing. Corrected the treatment description: 40% is the cohort's TESE success rate, and four of ten men attempted ICSI (now its own evidence item). Added a biochemical entry for serum FSH in the high range (NCIT:C181076; LOINC:15067-2, looked up in the Monarch KG and seeded with just loinc-seed-cache), supported by the existing Rotte 2025 snippet, with a note that the source reports it for the pooled M1AP plus ZZS cohort. Added evidence to the genetic counselling treatment (heterozygous parents and fertile brother, PMID:32017041; c.676dup segregation, PMID:40374915). Validation: validate-disorders (55/55 snippets), validate-terms, check-reference-titles, check-causal-targets, check-entity-refs, check-snippet-length, check-title-snippets, check-snippet-grading, gene-activity grounding against origin/main.

  summary: 'Create: Spermatogenic_Failure_48 (M1AP)'
  details: |
    New entry for spermatogenic failure 48 (MONDO:0030846), autosomal recessive M1AP-related meiotic arrest. Lump/split: curated as a DISEASE entry (single gene, own MONDO term; no subtypes). Deep research: claude_code provider report committed under research/ (14/14 references resolved, 1/1 quote valid; term validation flagged HP:0008210 as unresolved, which is not used). just preflight-dr was not run because no local MONDO build is available. Pathograph: M1AP Loss of Function (GO:0005515 protein binding, DECREASED, the only molecular activity demonstrated; QuickGO on 2026-10-15 listed only GO:0005515 and GO:0042802 for UniProtKB:Q8TC57) -> reduced TEX11 recruitment -> reduced recombination intermediates and class I crossovers -> metaphase I arrest and apoptosis -> severe spermatogenic failure (conforms to meiotic_prophase_failure#Spermatogenic Arrest and Non-Obstructive Azoospermia) -> NOA, cryptozoospermia, severe oligozoospermia, male infertility; arrest also reaches spermatocyte maturation arrest. Validation: just validate, validate-terms, count-verified-snippets (44/44 at time of writing), check-causal-targets, check-entity-refs, check-duplicate-keys, check-genereviews (NO_CHAPTER), check_gene_activity_grounding --against-ref origin/main.

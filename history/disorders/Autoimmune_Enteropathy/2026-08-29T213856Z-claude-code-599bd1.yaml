    # Evidence review — Autoimmune_Enteropathy

    File: `kb/disorders/Autoimmune_Enteropathy.yaml` (895 lines)

    ## Stats
    - Evidence items checked: 47
    - References read (full cache bodies): 8 (PMID:30443250, PMID:38817655, PMID:24045285, PMID:37731560, PMID:40317016, clinicaltrials:NCT04280510, clinicaltrials:NCT03866538, clinicaltrials:NCT00258180)
    - Verified clean: 47 (every snippet is an exact substring of its cache body and substantively supports the claim it is attached to; `just count-verified-snippets` reports 47/47 for this file as part of the 76/82 two-file run)
    - Edits made: none

    ## Findings

    1. **pathophysiology#LRBA-Associated CTLA4 Trafficking Defect → downstream `CTLA4 Checkpoint Dysfunction`** (L164-173, PMID:30443250). The snippet places LRBA "secondarily" in the Treg-generation/function network alongside CTLA4; it does not state the intracellular CTLA4 trafficking mechanism named in `intermediate_mechanisms`. Severity: NOTE. The curator already recognised this — `supports: PARTIAL` and the `explanation` says in so many words that the trafficking detail comes from outside this cache. ACTION: reported only — the grading and explanation are honest, so nothing to fix.

    2. **phenotypes#Hypokalemia** (L469-476, PMID:37731560). Case report of a CVID/CTLA4-LRBA-variant patient with immune-mediated enteropathy, not an AIE-diagnosed patient. The snippet ("Severe hypokalemia was detected during an examination.") is a single-patient observation from an adjacent entity. Severity: MINOR (borderline Named Entity Confusion). ACTION: reported only — `supports: PARTIAL` and the explanation ("in immune-mediated enteropathy overlapping AIE") already scope the claim correctly, so the item is not overstated.

    3. **genetic#CTLA4** second evidence item (L544-551, PMID:37731560). Snippet "and LRBA variants were identified and abatacept treatment was initiated. With" is a mid-sentence fragment that ends on a dangling "With". It is an exact substring and does carry the propositional content (variants identified, abatacept started), but the fragment boundary is untidy. Severity: MINOR. ACTION: reported only — a cleaner cut of the same sentence exists in the cache ("After conducting genetic analyses, the CTLA4 and LRBA variants were identified and abatacept treatment was initiated.") if a curator wants to tidy it; not a correctness defect.

    4. **clinical_trials evidence_source** (L813, L833, L853). Three ClinicalTrials.gov records are graded `HUMAN_CLINICAL`. Registry summaries are arguably `OTHER` (a registration document, not study evidence — the ICTRP guidance in CLAUDE.md uses `OTHER` for exactly this), but `HUMAN_CLINICAL` is the majority convention for `clinicaltrials:` references across `kb/disorders/`. Severity: NOTE. ACTION: reported only — a KB-wide convention question, not a defect in this entry.

    5. **pathophysiology#Autoantibody-Associated Enteropathy** second item (L319-326, PMID:38817655). The snippet "criteria due to undetectable anti-enterocyte antibodies." is short and syntactically truncated, but in context (the cohort "did not match the 2022 diagnostic criteria due to undetectable anti-enterocyte antibodies") it does substantiate the stated limitation, and the item is graded `PARTIAL`. Severity: NOTE. ACTION: reported only.

    Everything else checked out. Specifically confirmed: the four PMID:30443250 IPEX/IPEX-like snippets used for FOXP3, CTLA4, LRBA and STAT3 all appear verbatim in the full-text cache and match the gene each is attached to; the PMID:38817655 histology percentages (villous blunting 100%, deep crypt lymphocytosis 67%, goblet/Paneth loss, neutrophil infiltration duodenum 100%) exactly match the `histopathology` frequency bands (`OBLIGATE`/`FREQUENT`/`VERY_FREQUENT`); the PMID:24045285 diagnostic-criteria and treatment-list quotes match the claims they support; and the HSCT evidence ("Most surviving patients had resolution of their enteropathy...", "HSCT improves the survival rate, supporting early HSCT as curative treatment") is correctly attached and correctly graded. `evidence_source` is `HUMAN_CLINICAL` throughout and is correct — all five PMIDs report human cohorts or case reports (the murine scurfy material in PMID:30443250 is not quoted anywhere).

    ## Sections reviewed
    pathophysiology (incl. downstream edges), histopathology, phenotypes, genetic (incl. nested inheritance), treatments (incl. target_mechanisms), clinical_trials, references, datasets

    ## Verdict
    The strongest of the three entries: every snippet is verbatim, correctly attached, and honestly graded, with `PARTIAL` used deliberately where a case report or a review comment is doing the work. The only structural weakness is concentration — 40 of 47 evidence items come from three papers — and one case report (PMID:37731560) that describes an AIE-adjacent CTLA4/LRBA immunodeficiency rather than AIE proper, which the curator scoped correctly rather than overstating. No edits were warranted.

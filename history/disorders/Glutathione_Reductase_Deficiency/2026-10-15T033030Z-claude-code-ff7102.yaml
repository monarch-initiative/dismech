  summary: 'Review round 1: Glutathione_Reductase_Deficiency'
  details: |
    Changes in response to the automated review of PR 14273. Gr1a1Neu mouse (PMID:10218442): the FAILS_TO_RECAPITULATE link to Oxidant-Triggered Hemolysis was removed, because the study only shows that unchallenged mutants have normal erythrocyte indices, which is also true of patients (normal baseline red-cell GSH, PMID:947404); the model is now linked as RECAPITULATES (fidelity MODERATE) to the GSR loss-of-function node, citing the generalized loss of GR activity, with limitations recording the chemically induced non-human allele, the 2% residual activity and the absence of oxidant challenge. Prevalence: rate_per_100000 0.1 replaced by rate_high 0.1, so the record states only the Orphanet upper bound. Wording not supported by sources was removed: chronic hemolysis, early-onset cataract (Loos 1976 reports cataract only as possibly related, with no age) and unconjugated hyperbilirubinemia (Kamerbeek 2007 reports only severe neonatal jaundice). The hemolysis to neonatal hyperbilirubinemia edge is now INDIRECT_UNKNOWN_INTERMEDIATES with an INDIRECT evidence item citing absent red-cell GR activity in the jaundiced patient. The avoidance and phototherapy treatment evidence items are marked directness INDIRECT, since they cite the indication rather than a treatment outcome. Added two diagnosis rows from PMID:17185460: GR protein immunoblot (NCIT:C16357 Western Blotting) and GSR molecular genetic testing (NCIT:C15709 Genetic Testing). The thioredoxin compensation node now states that any dampening of hemolysis is hypothesized. No new references were fetched. Checks: validate, validate-terms, 40/40 verified snippets, entity-refs, causal-targets, snippet-grading, reference-titles, gene-activity-grounding against origin/main, model-scale-audit and the test_data model-link checks all pass; validate-disorders passes.

  summary: 'Create: Glutathione_Reductase_Deficiency'
  details: |
    De novo curation of hereditary glutathione reductase deficiency (GSR, MONDO:0019531), an autosomal recessive erythrocyte antioxidant-defense disorder.

    Causal chain: biallelic GSR loss of function, then absent glutathione reductase activity, then failure to regenerate GSH from GSSG, then erythrocyte oxidative and membrane injury, then oxidant-triggered (favism) hemolysis, ending on hemolytic anemia, fava bean-induced hemolytic anemia and neonatal hyperbilirubinemia. Side branches go to lens oxidative injury (cataract; the lens step is inferred, cited INDIRECT to a general cataract study), to the leukocyte GR defect (abnormal neutrophil physiology), and to a thioredoxin-system compensation node supported only by Gsr-knockout mouse data. Two nodes conform to hemolytic_anemia_erythrocyte_destruction (Oxidative and Membrane Injury; Premature Erythrocyte Destruction).

    Scope: acquired low red-cell GR activity from riboflavin/FAD undersaturation is recorded as a differential diagnosis, not a subtype (Beutler 1969 PMID:5794396; Saudi cohort PMID:11924113). Two animal models: the Gsr-null mouse (phagocyte branch, RECAPITULATES) and the Gr1a1Neu mouse, which has about 2% residual activity and no hemolytic anemia (FAILS_TO_RECAPITULATE, recorded with limitations).

    Deep research: one OpenScientist report (research/Glutathione_Reductase_Deficiency-deep-research-openscientist.md). Reference validation: 16/16 references resolved, none unresolved; needs_review was set only by one quote in PMID:11924113 whose mismatch is typographic (the report wrote a >= sign where the abstract has "> or ="). Term validation: 26/27 resolved, none unresolved. just preflight-dr against MONDO:0019531 returned PASS (GSR mentioned 43 times, OMIM 618660 matches). Report leads used after fetching and reading each abstract: PMID:22279102, 28686716, 8813716, 1737065, 11924113. Report suggestions not adopted: its NCIT treatment CURIEs (C15360, C15277, C15349) were not used; the entry's NCIT terms were looked up directly. HP:0006579 (Prolonged neonatal jaundice), which the report offered for neonatal jaundice, was not used; HP:0003265 Neonatal hyperbilirubinemia was bound instead. Claims based on gnomAD constraint, yeast and ferroptosis were left out as outside this entry's scope. PMID:41984322 (2026 case report) was fetched but has no abstract, so it is not cited.

    ORPHA:90030 was generated by just fetch-reference. The local Orphadata files were newer than the manifest pin, so the cache file is stamped with the 2026-06-23 release; data/orphadata/MANIFEST.yaml was not changed.

    No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER). Validation: validate, validate-terms, 36/36 verified snippets, entity-refs, causal-targets, qualifier-terms, duplicate-keys, block-scalar-comments, coarse/snippet-length/title/snippet-grading gates, model-scale-audit; list-disconnected-phenotypes reports 5/5 phenotypes connected.

  summary: 'Create: Benign Paroxysmal Positional Vertigo (MONDO:8000018)'
  details: |
    De-novo curation of BPPV from a Perplexity deep-research report (research/Benign_Paroxysmal_Positional_Vertigo-deep-research-perplexity.md, sonar-deep-research, 294s, 20 citations). The report was treated as a lead only: its citation list resolved to web pages (Mayo Clinic, Cleveland Clinic, StatPearls, NORD, OMIM mirror) rather than to identifiers, and it carried no reference_validation frontmatter or Reference Validation section, so no confabulation rate was available to read. Every claim retained was re-anchored to a PMID resolved from the report's PMC/PubMed URLs via the NCBI ID converter, fetched with just fetch-reference, and quoted from the fetched cache text. Ontology CURIEs suggested by the report were discarded and re-resolved through OAK after three were found wrong (calcium carbonate as CHEBI:3310 rather than CHEBI:3311; MONDO written as MONDO:0008000018; Dizziness given HP:0002321, which is Vertigo). Pathograph models the biomechanical chain: otoconial degeneration and detachment from the utricular macula -> debris entry into a semicircular canal -> canalithiasis or cupulolithiasis -> aberrant cupular deflection and false angular velocity signal -> vestibulo-ocular positional nystagmus and vestibular-visual-somatosensory mismatch. Head trauma and vitamin D deficiency are wired into the initiating node via influences_mechanisms; osteoporosis is deliberately left with no mechanism link and a review_notes explaining that no source in hand names the step it acts on. Two ontology abstentions recorded in review_notes: no UBERON term exists for the ampullary cupula, and no ECTO term exists for mechanical head injury. Validated with just validate (schema, terms, references: 46/46 snippets verified), plus check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-enum-values, all clean.

  summary: Review BPPV mechanisms, full-text evidence and treatment trials
  details: |
    Reviewed the complete baseline disorder and CREATE record against the full scientific narrative and all 20 citations of the matching Perplexity report. This is a primary mechanical vestibular disorder; secondary trauma/infection-associated cases and risk modifiers do not define the entry. MONDO:8000018 and OMIM 193007 match the clinical entity. No prior REVIEW or overlapping open PR was present at selection. GeneReviews lookup returned no dedicated chapter.

    1. Omics: the report's claim of no genetic or omics findings is outdated. Added a bounded discussion of the 2024 blood-expression study (PMID:39170394): only 12 validation participants, three per recurrence/diabetes subgroup, and no evidence that blood signatures demonstrate inner-ear inflammation or validated predictors. No dataset record is inferred from the incomplete accession presentation, and no epigenetic mechanism is invented.
    2. Subtypes: preserved posterior, horizontal and anterior canal presentations. Apogeotropic or persistent nystagmus no longer uniquely implies cupular adhesion; subjective BPPV can lack visible nystagmus. Downbeat responses require a central differential. These are anatomical/clinical variants, not molecular subtypes requiring invented identifiers.
    3. Mechanisms and tissue: ten nodes separate degeneration, detachment, canal entry, free particles, proposed cupular loading, canalith jam, cupular deflection, afferent signaling, ocular response and perception. Degeneration is a susceptibility hypothesis, not an obligatory lesion. Added SEM findings from two selected refractory surgical cases (PMID:27726156), with inferred utricular origin and explicit sampling limits. Added PCDHGA10-immunoreactive aggregates from the candidate-family study without asserting a proven aggregate-to-detachment pathway. Generic aging hair-cell loss, autophagy hypotheses and animal expression are not promoted to established human BPPV mechanisms. Cupulolithiasis remains a model alongside the critical reappraisal (PMID:36998555); that review's stronger universal cure claims are not adopted.
    4. Treatments and trials: fourteen care records cover canal-specific repositioning, Gufoni, anterior-canal procedures, Semont-plus, short-term head shaking in clinically defined posterior cupulolithiasis, selective surgery, vitamin D strategies, rehabilitation, observation, counseling and selective antiemetics. Corrected the 2020 calcium/vitamin D trial's conditional supplementation design and event-rate NNT. The 2024 vitamin D-only trial had a nonsignificant patient-level relapse proportion despite fewer events; its repeated-event analysis treated recurrences as independent. The older-adult trial and falls report are the same cohort, with no demonstrated fall reduction. The 2026 deficient-patient trial remains abstract-supported. Semont-plus's repeated home-course advantage is not a significant single-maneuver advantage; posterior head-shaking benefit is next-day, not long-term. Added NCT04578470, NCT05853328 and KCT0004756, distinguishing registry status/enrollment from published samples and dated records. These represent the central newly curated trials, not an exhaustive registry census. No routine vestibular suppressants, imaging or post-repositioning restrictions are recommended for otherwise typical BPPV.
    5. Genetics: familial aggregation alone does not establish Mendelian inheritance. PCDHGA10 rs113784532 is a candidate short-isoform truncating insertion (13/42 selected families versus 1/50 controls), with incomplete segregation and an earlier-onset comparison at P=0.054. No population penetrance or clinical genetic-test validity is inferred. Conflicting HGVS strings in the paper are not silently resolved. The broad-vertigo GWAS contributes BPPV-driven ZNF91 and OTOGL signals and an unresolved OTOP1/TMEM128 region; neither a causal target nor regulatory direction is assigned at that locus. No gene-directed treatment or proven modifier is supported.
    6. Phenotypes, biomarkers and diagnosis: removed unsupported frequency categories, retained variable positional vertigo/nystagmus/nausea/imbalance and added vomiting. Dix-Hallpike requires the relevant torsional upbeating response; roll testing, reassessment within one month and assessment for persistent peripheral/central causes are explicit. Five differentials address migraine, Meniere disease, central positional responses, superior canal dehiscence and orthostatic hypotension. Superior canal dehiscence requires symptoms, physiological signs and imaging rather than CT alone (PMID:33522990). Serum vitamin D is a modifiable association, not a diagnostic BPPV biomarker. Corrected the annual-incidence band and recorded its population-per-year denominator.
    7. Evidence consumption: read the full scientific bodies of PMID:30828628, 28066316, 21808648, 33956893, 34620984, 39170394, 36998555, 38384364, 39194424, 27726156, 37358870 and 40105844, including relevant tables and limitations. Read PMID:32655479 through its conclusions, with some study-table rows sampled. Read targeted mechanics, clinical and differential sections of PMID:31193795, relevant falls results/limitations of PMID:39985692, and the criteria/notes of PMID:33522990. PMID:32759193, 9870618, 28248609 and 42098930 were consumed as complete cached abstracts; the guideline abstract contains all action statements. DOI/PubMed identity of the report's 2026 JAMA citation was confirmed, but its one-sentence abstract was insufficient for new claims; full text was unavailable. The 2015 criteria PDF returned 403, so precise diagnostic recommendations are anchored to the 2017 guideline. All cache files were generated or refreshed with repository fetch commands, never hand-edited.
    8. Overall completeness: central omissions and overstatements are addressed with disease-specific, quotable sources. Computational fluid models, generic vestibular-aging animals, speculative RNA therapies and unvalidated biomarkers remain research context. No mutant PCDHGA10 disease model was demonstrated in the cited paper; normal mouse expression is not such a model. The report misattributes the old Brandt-Daroff 61/67 result to Epley, and mixes odds ratios with continuous risk-factor differences; neither error is carried forward. Observational risk factors remain associations. Review provenance was moved out of disease prose.

    Validation: schema and live ontology validation pass; 122 quotations and 122 reference titles verified with none skipped or unavailable. Additional history, entity, causal-link and content checks accompany the commit.

  summary: 'Create: Cystic Leukoencephalopathy Without Megalencephaly (RNASET2, MONDO:0013058)'
  details: |
    De novo curation of RNASET2-deficient cystic leukoencephalopathy, claimed on issue #11523.

    Deep research: one OpenScientist run (research/Cystic_Leukoencephalopathy_Without_Megalencephaly-deep-research-openscientist.md, 38 min, 14 citations). The report had no reference_validation or term_validation frontmatter block, so both sections were retro-fitted with 'just validate-research-reference' and are committed with the report. Results: 14/14 references resolved, 0 unresolved, 0 off topic; 23/25 terms resolved, 0 unresolved, 0 mislabelled, 3 name variations that are all recorded ontology synonyms (microglia/microglial cell, type I IFN signaling, pyroptosis). Nothing in the report was excluded on validation grounds.

    The report contributed the mechanistic step this entry would otherwise have lacked: endolysosomal RNA-sensing TLR activation as the link between lysosomal rRNA accumulation and the type I interferon response, from two 2025 companion papers (PMID:39853306, PMID:39853307), plus early microglial pyroptosis (PMID:41453865). Those three references were fetched and cited on the strength of the report. Before reading it, the entry modelled storage and interferonopathy as two competing framings in a CONTROVERSY discussion; the TLR13 epistasis result connects them into one chain, so that discussion was rewritten as INTERPRETATION and the chain now runs storage -> TLR sensing -> interferon -> microglial pyroptosis -> tissue damage.

    GeneReviews baseline: none exists. PubMed searched for 'RNASET2 GeneReviews[All Fields]', which returned only the retired Leukodystrophy Overview chapter (PMID:24501781), not a chapter for this disease. Phenotype baseline is therefore the primary case series and the 2016 AGS-overlap cohort.

    Evidence discipline. Almost all mechanism evidence here is model-organism (zebrafish, mouse, rat) and is graded as such; the two nodes with human corroboration carry a HUMAN_CLINICAL item alongside, and the notes say explicitly where human evidence stops. The rat model is recorded as FAILS_TO_RECAPITULATE against the white-matter node with a REFUTE-graded evidence item, because it does not develop the cystic lesion. A HUMAN_MODEL_MISMATCH discussion records that TLR13 has no human counterpart and TLR8 is inferred rather than shown. mechanism_confidence: PROVISIONAL is set on the storage and TLR-sensing nodes, because their supporting quotes are hedged by their own authors.

    Validation run in this worktree: just validate (schema + terms + references) passes, 43/43 snippets verified against cached references; just check-entity-refs and just check-causal-targets pass.

    Known binding limitation, recorded in the entry notes: GO has no term for lysosomal acidic ribonuclease or RNase T2-family activity, so the molecular_functions binding uses GO:0004523 (RNA-DNA hybrid ribonuclease activity) with a preferred_term stating the intended activity. This is flagged rather than left for a reader to find.

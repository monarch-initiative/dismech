  summary: 'Review round 1 on PR #11527: GO rebinding and evidence_source re-sourcing'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #11527. Both blocking findings accepted; all five optional suggestions taken, in one push.

    Blocking finding 1 accepted, and the reviewer's diagnosis of the cause was right. The molecular_functions binding was GO:0004523, RNA-DNA hybrid ribonuclease activity, which is RNase H: a different enzyme class with a different substrate. GO:0033897 ribonuclease T2 activity exists, is current, is a molecular_function, and is exact. Rebound. The entry notes had asserted that GO has no RNase T2-family term, hedged as 'in the cached GO set'; that hedge was the tell. The search had been run against the committed cache/go/terms.csv rather than the ontology, and a term absent from a stale snapshot is not a term absent from GO. The notes paragraph now records the correction and the reasoning error rather than the false claim.

    Blocking finding 2 accepted. Nine evidence items graded HUMAN_CLINICAL quoted the introductions of animal-model papers, and the entry contradicted its own stated rule: a background sentence from the rat paper was graded MODEL_ORGANISM at one node with an explanation of why, while another background sentence from the same paper was graded HUMAN_CLINICAL on a phenotype. Six were re-sourced onto genuinely human publications rather than relabelled: PMID:31349848 (human case report with literature review) now supports Global developmental delay, Spasticity, Microcephaly, Seizure and Leukoencephalopathy, and PMID:27091087 (five-patient AGS-like cohort, all biallelic RNASET2) now supports the human corroboration on the type I interferon node. Three had no human substitute and were regraded: PMID:32295832 and PMID:34764281 to MODEL_ORGANISM, PMID:32212285 to OTHER, since its 'no treatments available' sentence is a treatment-landscape assertion in a zebrafish paper's introduction rather than any study's result. A script confirms zero HUMAN_CLINICAL items now cite an animal-model publication.

    The Cerebral atrophy phenotype is the one case where no clean human quote was available in the committed caches; its item stays on PMID:34764281 and is regraded MODEL_ORGANISM, with the explanation stating that no human substitute existed.

    Optional suggestions, all taken. GO:0005764 lysosome on the TLR-sensing node rebound to GO:0036019 endolysosome, which is exact for the compartment described (the two other GO:0005764 bindings are correct and unchanged). JAK inhibition added as a treatment with target_mechanisms into the type I interferon node, citing PMID:33856640, graded directness: INDIRECT because none of the reviewed disorders is this disease, and its description states that no trial, series or case report exists here. Sensorineural hearing impairment (HP:0000407) and Dystonia (HP:0001332) added, each carrying a REFUTE-graded item from PMID:29336640, which reports their absence in a genetically confirmed patient; no frequency is claimed. The RNASET2 alarmin and tumour-suppressor identity, and its common-variant autoimmune associations, are scoped out explicitly in notes so a reader meeting that literature does not infer a connection.

    One suggestion could not be implemented as asked. OMIM #612951 and ORPHA:210141 have no home in the schema: DiseaseMappings carries slots only for icd10cm_mappings, icd11f_mappings, mondo_mappings and ncit_mappings. Both identifiers are recorded in notes instead. Citing ORPHA:210141 as structured evidence for the prevalence class was also attempted and abandoned: the Orphanet route requires the bulk Orphadata XML, which is gitignored and absent from this checkout.

    Validation after the round: just validate passes, 47/47 snippets verified against cached references; check-entity-refs, check-causal-targets, check-enum-values, check-snippet-grading, check-title-snippets and check-snippet-length all pass.

  summary: 'Review and enhance: Retrograde Cricopharyngeus Dysfunction'
  details: |
    Grounded review and enhancement of Retrograde Cricopharyngeus Dysfunction
    (MONDO:1040035) against the cyberian-codex and falcon deep research reports
    and 12 cached PubMed primary and review articles:
    - Added Harrison's chapter classification (GASTROINTESTINAL), literature
      case prevalence (826 cases across 17 studies, PMID:40411338; true
      population prevalence unknown due to historical under-recognition),
      two-phase progression (infancy/early childhood onset and adolescent
      amplification with adult diagnosis at mean age 26 years), moderate
      clinical burden, and sporadic vs non-Mendelian familial aggregation
      inheritance patterns (29.2% familial clustering in a 106-patient cohort,
      PMID:39883449).
    - Added coarse_binding_basis (NO_HPO_TERM) and term_gap explanations to
      Inability to Belch and Gurgling Sounds (bound to HP:0025031), added
      Excessive Flatulence (HP:0033589) and Hiccups (HP:0100247), and populated
      evidence_source across all phenotype evidence items.
    - Expanded pathophysiology into a connected 4-node causal graph with
      mechanism_scale, mechanism_confidence, and downstream edges linking
      Elevated Upper Esophageal Sphincter Basal Pressure, Failure of Upper
      Esophageal Sphincter Relaxation, Intraesophageal Gas Trapping and
      Secondary Peristalsis, and Ineffective Esophageal Motility to downstream
      clinical phenotypes.
    - Enhanced Botulinum Toxin Injection with target_mechanisms,
      target_phenotypes, and a familial-history effect modifier (PMID:39883449),
      and added Endoscopic Cricopharyngeal Myotomy (NCIT:C16080) for
      botulinum-refractory R-CPD (PMID:41506952).
    - Added Syndromic Clinical Diagnosis and Therapeutic Botulinum Toxin Trial
      alongside High-Resolution Impedance Manometry in diagnosis, and added
      Antegrade Cricopharyngeus Dysfunction to differential_diagnoses.

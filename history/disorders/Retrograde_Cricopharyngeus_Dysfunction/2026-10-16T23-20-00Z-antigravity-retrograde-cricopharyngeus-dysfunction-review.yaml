  summary: 'Review and enhance: Retrograde Cricopharyngeus Dysfunction'
  details: "Grounded review and enhancement of Retrograde Cricopharyngeus Dysfunction\n(MONDO:0100099)\
    \ against the cyberian-codex and falcon deep research reports\nand cached PubMed/DOI primary and review\
    \ articles:\n- Added clinical synonyms (abelchia, no-burp syndrome, retrograde\n  cricopharyngeal\
    \ dysfunction, retrograde upper esophageal sphincter\n  dysfunction, inability to belch syndrome,\
    \ R-CPD), Harrison's chapter\n  classification (GASTROINTESTINAL), literature case prevalence (826\
    \ cases\n  across 17 studies, PMID:40411338; true population prevalence unknown due\n  to historical\
    \ under-recognition; deprecated percentage field omitted),\n  two-phase progression (infancy/early\
    \ childhood onset and adolescent\n  amplification with adult diagnosis at mean age 30.4 years), moderate\n\
    \  clinical burden, and sporadic vs non-Mendelian familial aggregation\n  inheritance patterns (29.0%\
    \ familial clustering in 18 of 62 evaluated\n  cases, PMID:39883449).\n- Added coarse_binding_basis\
    \ (NO_HPO_TERM) and term_gap explanations to\n  Inability to Belch and Gurgling Sounds (bound to HP:0025031),\
    \ added\n  Excessive Flatulence (HP:0033589) and Hiccups (HP:0100247), and populated\n  evidence_source\
    \ across all phenotype evidence items.\n- Expanded pathophysiology into a connected 5-node causal\
    \ graph with\n  biological_scale, mechanism_confidence, and downstream edges linking\n  Elevated Upper\
    \ Esophageal Sphincter Basal Pressure (PROVISIONAL),\n  Failure of Upper Esophageal Sphincter Relaxation\
    \ (ESTABLISHED),\n  Intraesophageal Gas Trapping (ESTABLISHED), Secondary Peristalsis\n  (ESTABLISHED),\
    \ and Ineffective Esophageal Motility (PROVISIONAL) to\n  downstream clinical phenotypes, with INDIRECT_UNKNOWN_INTERMEDIATES\
    \ edges\n  where causal directionality or intermediate reflex arcs are unresolved.\n- Enhanced Botulinum\
    \ Toxin Injection with therapeutic_agent (CHEBI:3160),\n  therapeutic_modality (OTHER), target_mechanisms,\
    \ target_phenotypes,\n  long-term 200-patient cohort outcomes (DOI:10.1177/2473974x20938342), and\n\
    \  a familial-history effect modifier (PMID:39883449), and added Endoscopic\n  Cricopharyngeal Myotomy\
    \ (NCIT:C15329) for botulinum-refractory R-CPD\n  (PMID:41506952, DOI:10.1177/2473974x20938342, DOI:10.1002/oto2.70014).\n\
    - Added Syndromic Clinical Diagnosis and Therapeutic Botulinum Toxin Trial\n  alongside High-Resolution\
    \ Impedance Manometry in diagnosis, refined\n  Supragastric Belching distinguishing features, and\
    \ added Antegrade\n  Cricopharyngeus Dysfunction to differential_diagnoses.\n"

  details: |
    LOINC Diagnostics tranche G, batch 28, the closing batch. Two sources, each answering a different question and named as such in every finding: the pinned Tuva LOINC 2.83 export recorded in data/loinc/MANIFEST.yaml, sha256 verified against the pin, for observation and panel codes; and the Monarch KG for Part codes, because that export carries no LP or LG rows. Every KG query was paginated to its stated total. New cache/loinc/terms.csv rows were seeded by the term validator against the KG and their labels copied from the resulting rows, never typed. Validation for the whole batch: just validate-disorders over the five changed files reported 0 issues across 793 titles; check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-block-scalar-comments and check-case-collisions all clean; tests/test_loinc_measurement_schema.py 23 passed. Bound LOINC:51393-7 (esophageal manometry study) to the high-resolution impedance manometry row, that being the single esophageal manometry record in both sources and carrying no Part. Two shortfalls are recorded on the row so the binding is not read as more than it is: the release has no high-resolution or impedance variant, so the modality this row specifies is not in the code, and it has no code for the provocative carbonated-water challenge that makes the test diagnostic here. The release's one quantitative esophageal pressure code, LOINC:60738-2, is a single intraluminal pressure rather than a manometry study and was declined. No reference range was added: the finding is failure of relaxation during distension, not a pressure threshold.

  summary: Add M. xenopi diagnostic criteria and prognosis
  details: |
    Added MONDO exact synonyms so duplicate and GeneReviews checks search each disease label, clarified the nodular-bronchiectatic phenotype evidence by replacing an unlabeled radiology table row with an interpretable M. xenopi-specific sentence, added a chronic-pulmonary-disease progression note for the high-mortality phenotype of M. xenopi pulmonary disease, and added a guideline-backed diagnosis block covering the composite ATS/ERS/ESCMID/IDSA clinical, radiographic and microbiologic criteria, including the need for repeated same-species sputum cultures to distinguish NTM lung disease from environmental contamination or colonization.

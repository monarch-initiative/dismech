  summary: 'Create: Dystonia 22, Juvenile-Onset'
  details: |
    New entry for the juvenile-onset, loss-of-function form of TSPOAP1 dystonia (MONDO:0957539). Deep-research input was a single Perplexity report (research/Dystonia_22_Juvenile_Onset-deep-research-perplexity.md). preflight-dr returned WARN because the report cites OMIM 610764 and 620456 while MONDO xrefs OMIM 620453; resolved by lookup in the local MONDO build: 610764 is the TSPOAP1 gene entry and 620456 is dystonia 22, adult-onset (MONDO:0957542), the homozygous p.Gly1808Ser focal adult-onset form, which is excluded here and recorded in notes. Evidence is quoted from abstracts only: the discovery paper (PMID:33539324), the 2025 Indian report (PMID:41371074) and the RIM-BP coupling study (PMID:26402606). Two TSPOAP1 case reports (PMID:37850637, DBS; PMID:42027086) have no abstract, returned no quotable text on two fetches, and are mentioned in notes only; no treatment is recorded. Pathophysiology is a three-node chain conforming to synaptic_vesicle_cycle at its first and release nodes; only generalized dystonia is causally wired, intellectual disability, cerebellar atrophy and eye movement abnormalities are left unconnected because no source links them to a mechanism node. Disagreement with Dopa_Responsive_Dystonia (which lists TSPOAP1 under AR-DRD) is recorded in notes, not edited. check-genereviews --online: NO_CHAPTER. Validation: just validate passed (21 snippets, 21 titles, 0 issues), validate-terms passed, count-verified-snippets 21/21, entity refs, causal targets, duplicate keys and block-scalar checks clean.

  summary: Record why the coarse HPO binding is coarse (PATHOGRAPH_HUB)
  details: |
    Declared coarse_binding_basis: PATHOGRAPH_HUB on the Ocular abnormalities phenotype (HP:0000478). The entry already satisfied what a hub is: a pathophysiology node targets this phenotype by bare name with causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES, and the phenotype carries no frequency, so it is a convergence point in the causal graph rather than a clinical claim about how often patients have eye findings. Nothing was added or removed - the annotation records the role the node was already playing. Note deliberately no outgoing sequelae were added to specific eye findings: sequelae is a CausalEdge, and a specific ocular finding is not caused by an eye abnormality but is one, so drawing that would be subsumption dressed as causation. Validated with linkml-validate, check_coarse_phenotypes, check_duplicate_yaml_keys, check_enum_values, check_entity_refs and check_causal_targets.

  summary: Map Rubinstein-Taybi syndrome to OMIMPS:180849
  details: |
    Checked actual series membership in January 2026 OMIM and class scope in September 2026 MONDO against the current Disease and its subtypes. The January 2026 OMIM PS180849 snapshot contains CREBBP-related RSTS1 (OMIM:180849), EP300-related RSTS2 (OMIM:613684), and proximal chromosome 16p13.3 deletion syndrome (OMIM:610543). MONDO:0019188 has the corresponding three children and maps exactly to the series in September 2026. This entry covers CREBBP/EP300 haploinsufficiency and explicitly includes CREBBP microdeletions within RSTS1, so the alignment includes their Rubinstein-Taybi presentation rather than silently treating the series as a two-record union. Shared CBP/p300-dependent developmental transcriptional dysfunction supports the syndrome-level Disease. Additional features of larger contiguous-gene deletions are not all attributed to CREBBP, and this mapping does not claim complete curation of those neighboring-gene effects. It excludes other 16p13.3 rearrangements and allelic Menke-Hennekam syndrome.

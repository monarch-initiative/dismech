  summary: 'Review round 2: schema slot names out of reader-facing prose'
  details: |
    Round 2 of review on PR #12339 (dismech#12205).

    Suggestion taken: the string `case_fractions` was naming an internal schema slot
    in three reader-facing places - the top-level `description`, which renders on
    the disorder page, and two genetic `notes`. All three now say where the figure
    came from without naming the slot, and the over-long unwrapped line in the
    description was reflowed to the file's convention.

    Also applied here: a self-review fix from before the first push that was
    silently lost when its script aborted before writing. The `genetic_context`
    description claimed the reported allele classes - point mutations, small
    lesions, microdeletions, intragenic duplications - hold "in either paralog".
    The entry's evidence establishes that breakdown for CREBBP only; the EP300
    evidence establishes heterozygous mutation without a comparable breakdown. The
    description now says exactly that.

  summary: Add missing X-linked recessive inheritance block
  details: |
    Re-review fix identified during a systematic audit of the KB's Mendelian gut disorder coverage.

    Gap: IPEX_Syndrome had no top-level `inheritance:` block at all, despite X-linked recessive inheritance being stated in the entry's own description, synonyms, and genetic block prose. The machine-queryable slot was empty while the human-readable prose carried the fact, so the entry did not appear in any structured query over mode of inheritance.

    Added an Inheritance block bound to HP:0001419 (X-linked recessive inheritance), with a description covering hemizygous male expression and unaffected heterozygous female carriers, and evidence from PMID:33668198 - a reference the entry already cited, so no new cache file was needed.

    This was one of several gaps found in the audit; the entry is otherwise in good shape (17 phenotypes, 6 treatments, 48 evidence items).

    Validation: linkml-validate clean; linkml-term-validator clean; snippet verified against the cached abstract.

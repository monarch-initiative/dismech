  summary: 'Gene-family review: GLB1; add MPS IVB beta-galactosidase deficiency node'
  details: |
    GLB1 sat only on the shared node Lysosomal GAG Accumulation, which carries eleven MPS genes and no molecular function, so no node stated what the GLB1 product does. Added an upstream node, MPS IVB Beta-Galactosidase Deficiency, carrying GLB1 with beta-galactosidase activity (GO:0004565) and keratan sulfate proteoglycan catabolic process (GO:0042340) both decreased, linked downstream to the accumulation node. Evidence: PMID:21497194 (Morquio B arises from GLB1 deficiency) and PMID:12559848 (Morquio B mutant beta-galactosidases have lower affinity and activity toward the keratan sulfate analog, explaining keratan-sulfate-predominant storage). GLB1 stays on the shared node beside the other MPS genes. The other ten genes on that node still lack a molecular function; they are outside this review and remain grandfathered.

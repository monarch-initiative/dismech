  summary: Retype heterozygous UBE3C autism-susceptibility record to UNKNOWN
  details: |
    The record 'UBE3C (heterozygous autism susceptibility)' describes a heterozygous autism-risk relationship and its notes say it is recorded 'not as part of the NEDSMB mechanism'. It was typed SUSCEPTIBILITY, but relationship_type describes the gene's relationship to this entry's disease, and no heterozygous UBE3C variant has been reported to confer risk of the recessive disorder. Retyped to UNKNOWN; the autism-susceptibility fact stays in the record name and notes. Prompted by the #11999 fix, which would otherwise have inferred a contributes_to edge from this record to the Biallelic UBE3C Loss-of-Function Variants node.

  summary: 'Create: NEDSMB (UBE3C-related neurodevelopmental disorder)'
  details: |
    Created kb/disorders/Neurodevelopmental_Disorder_With_Absent_Speech_And_Movement_And_Behavioral_Abnormalities.yaml
    for NEDSMB (MONDO:0859519 / OMIM:620270 / MEDGEN:1840955), the autosomal
    recessive UBE3C-related neurodevelopmental disorder. The matching curation
    stub stubs/Neurodevelopmental_Disorder_With_Absent_Speech_And_Movement_And_Behavioral_Abnormalities.yaml
    was deleted in the same change.

    DEEP RESEARCH. Falcon was attempted first as the default provider and FAILED:
    the Edison Scientific API returned HTTP 402 Payment Required, so no falcon
    report exists for this disorder. claude_code was used as the fallback provider
    and produced
    research/Neurodevelopmental_Disorder_With_Absent_Speech_And_Movement_And_Behavioral_Abnormalities-deep-research-claude_code.md
    (20 web searches, 33 turns, 14 citations). A second provider, openscientist,
    was run in parallel and produced
    research/Neurodevelopmental_Disorder_With_Absent_Speech_And_Movement_And_Behavioral_Abnormalities-deep-research-openscientist.md
    (18 citations, 18/18 resolved, confabulation_rate 0.0). Both reports were used.

    `just preflight-dr` was run on BOTH and returned PASS on both:
    claude_code UBE3C=56 vs UBE3A=10 / METTL3=9 / HECTD4=4; openscientist UBE3C=70
    vs UBE3A=12 / UBE3B=3 / HECTD4=3; both report OMIM sets contain 620270,
    matching the MONDO xref.

    Both reports set needs_review: true, and each flag was acted on.
    (1) claude_code had one unresolved identifier, which turned out to be a
    markdown-link parsing artifact of the bioRxiv DOI; the clean DOI
    (10.1101/2025.04.09.646620) was re-fetched and resolved, and that re-check is
    recorded here per the SOP. (2) openscientist reported quotes_valid 9 of 10
    with the unsupported quote attributed to PMID:33182779 - a reference this
    entry cites twice. Both of this entry's PMID:33182779 snippets are
    independently verified as exact substrings by the reference validator; the
    report's own quote from that paper was not reused.

    A third provider, falcon, is the documented default and was tried FIRST; it
    returned HTTP 402 Payment Required from the Edison Scientific API, so no
    falcon report exists and none is claimed.

    WHAT WAS CURATED. Seven-node pathophysiology chain from biallelic UBE3C
    loss-of-function through loss of proteasome-docked HECT E3 ligase activity,
    impaired proteasomal processivity and cytosolic protein quality control, and
    neuronal proteostatic vulnerability, to global neurodevelopmental impairment,
    with a parallel emerging arm (CBLL1 stabilization -> m6A writer
    hyperactivation -> impaired neural progenitor cell-cycle exit and skewed
    neurogenesis). Two mechanistic_hypotheses (CANONICAL proteostatic,
    EMERGING epitranscriptomic) with the causal edges opted into their groups.
    25 phenotypes with HPO terms; genetic entries for the CAUSATIVE recessive
    relationship and, separately flagged, the heterozygous autism SUSCEPTIBILITY
    relationship; variants; diagnosis; differential diagnoses (Angelman syndrome,
    HECTD4-related NDD); a mouse animal_model and a human brain organoid
    experimental_model, both with modeled_mechanisms links; supportive-care and
    genetic-counseling treatments; a KNOWLEDGE_GAP and a HUMAN_MODEL_MISMATCH
    discussion with proposed experiments; CASES_IN_LITERATURE prevalence with no
    fabricated rate.

    EVIDENCE CEILING (the load-bearing curation decision, also recorded in the
    entry's review_notes). The whole clinical description of NEDSMB rests on
    PMID:36401616 (Faqeih 2023), which has no PMC deposit and no retrievable full
    text; DOI:10.1016/j.gim.2022.10.006 was fetched and returned content_type
    unavailable. Only the structured abstract is quotable. Its cohort-level
    sentence describes the COMBINED HECTD4 + UBE3C cohort, so every phenotype
    evidence item leaning on it is marked supports: PARTIAL with an explanation
    saying so. The individual-level features that define the disorder's name
    (mutism, tremor, ataxia, limb dystonia, aggression, hypodontia, cerebellar
    hypoplasia, thin corpus callosum, and the rest) reach public curation only
    through the OMIM:620270 clinical synopsis; they are curated with HPO terms and
    a notes line naming that provenance and WITHOUT an evidence block, rather than
    with a snippet manufactured against an abstract that does not contain it.

    PREPRINT USE. The CBLL1/m6A/METTL3 corticogenesis mechanism comes from
    Borisova et al., bioRxiv DOI:10.1101/2025.04.09.646620, which was not in
    PubMed at curation time (searched; no published version found). It is cited
    only for model-system claims, labelled a preprint in every reference_title,
    curated as an EMERGING hypothesis, and carries its own HUMAN_MODEL_MISMATCH
    discussion. Note that DOI: is in skip_prefixes in
    conf/reference_validator_config.yaml, so those 9 snippets are not
    snippet-checked by the validator; they were checked by hand against the
    cached file references_cache/DOI_10.1101_2025.04.09.646620.md.

    NAMED ENTITY CONFUSION. Four confusions were checked and are documented in
    review_notes: UBE3A/Angelman vs UBE3C (the disorder was found because it
    mimics Angelman syndrome), HECTD4 vs UBE3C (two genes and two disorders in
    the one founding paper), biallelic recessive NEDSMB vs heterozygous UBE3C
    autism susceptibility, and the unrelated UBE3C-LRP5 fusion in distal
    hereditary motor neuropathy already curated elsewhere in the KB. No UBE3A,
    HECTD4 or heterozygous-autism finding is used to support a UBE3C recessive
    disease claim.

    GENEREVIEWS. No GeneReviews chapter exists. PubMed searches for
    "UBE3C GeneReviews[All Fields]" and the disorder title returned 0 records, so
    the GeneReviews baseline step does not apply. Recorded in the entry's notes.

    RED-TEAM REVIEW ROUND (run before opening the PR, using the dismech-pr-review
    skill in a fresh context). It returned one CRITICAL, four IMPORTANT and eight
    MINOR findings; all were addressed rather than argued.
    CRITICAL - claim/evidence mismatch (dismech #7791) on the CBLL1/m6A node and
    on the organoid model link: both carried preprint quotes about lamination and
    fate balance, neither of which states that CBLL1 is a UBE3C substrate. Fixed
    by quoting the on-point sentence ("identifies Cbll1 as a UBE3C substrate...")
    on both, and moving the lamination quote to the mouse model link where
    lamination is the claim being made.
    IMPORTANT - (a) variant-level specifics (a frameshift allele, a ~185-kb
    multi-exon deletion) were attributed to a full text the entry itself says is
    unreadable; they came from an uncited "[search result]" line in a DR report
    and were removed, along with the diagnosis clause that rested on them.
    (b) "homozygous or compound heterozygous" and "consanguineous" were asserted
    in four places with no cited source; both were removed and the entry now
    states only what the abstract's arithmetic supports.
    (c) The pathograph stopped one node short of the phenotypes; nine edges were
    added from the terminal node to the name-defining phenotypes, with
    INDIRECT_UNKNOWN_INTERMEDIATES on the movement/behavioral/seizure arms because
    the intermediates genuinely are unknown.
    (d) STM2457 (the METTL3 inhibitor that rescues the mouse progenitor defect)
    existed only as prose, so no treatment joined the pathograph; it is now an
    explicitly-preclinical treatment entry with a target_mechanisms INHIBITS edge
    and a name, description and notes that all say it is not a patient therapy.
    MINOR - HP:0002300 Mutism was dropped as a duplicate annotation of HP:0001344
    Absent speech (double-counting one feature in phenotype-matching profiles),
    with the reasoning kept in notes; the yeast Hul5 evidence was retagged
    IN_VITRO (yeast is not an animal, so MODEL_ORGANISM did not fit the repo's
    scoping); a truncated quote beginning mid-word was trimmed to a clean
    sentence; the 25% recurrence figure was rephrased as the standard
    autosomal-recessive expectation rather than a disorder-specific finding; the
    NEUROLOGIC classification note was tightened so it no longer implies seizures
    are established in the UBE3C patients; structured onset (INFANTILE) was added
    to the developmental-delay phenotype; and three fetched-but-unused UBE3C
    papers (VPS34/autophagy PMID:33637724, ATG4B PMID:38146933, ERAD of CFTR
    PMID:38067172) were curated into the KNOWLEDGE_GAP rationale, since they widen
    the gap rather than close it - UBE3C's cell biology is not confined to the
    proteasomal arm the canonical chain models.

    From the openscientist report, two further mechanism citations were added to
    the ligase-activity node: PMID:32039437 (HECT domain crystal structure; Lys903
    autoubiquitination site; C-terminal three residues required for activity -
    relevant because the preprint reports disease mutations altering
    autoubiquitination) and PMID:24811749 (stress-induced Ube3c/Hul5
    ubiquitination of Rpn13, an autoinhibitory second proteasomal activity),
    the latter marked PARTIAL.

    VALIDATION RUN AND READ. `just validate` passes (schema, terms, references).
    `just validate-disorders <file>` - the batched, --no-full-text sweep CI runs -
    passes, reporting "Snippets checked: 37/49 verified against cached references
    (12 skipped by prefix)"; the 12 skipped are the DOI preprint citations
    described above, all of which were hand-checked as exact substrings of
    references_cache/DOI_10.1101_2025.04.09.646620.md. Every reference_title in
    the entry was also machine-compared against its cached title. `just check-duplicate-keys` OK. `just check-title-snippets` OK, no new
    title-quoting snippets. `just compliance` reports 78.8% global / 79.1%
    weighted after the review round (76.0% / 76.2%; the denominator grew as
    curation was added). The residual gap is overwhelmingly phenotypes[].evidence,
    which is the evidence ceiling above and not a curation shortcut.

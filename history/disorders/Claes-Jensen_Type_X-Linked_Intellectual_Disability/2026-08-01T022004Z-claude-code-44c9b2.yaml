  details: |
    Created a new disorder entry for Claes-Jensen type syndromic X-linked intellectual disability (MONDO:0010355, OMIM:300534, KDM5C / hgnc:11114).

    NEC preflight: re-run before any writing. "uv run runoak -i sqlite:obo:mondo info MONDO:0010355 -O obo" confirmed relationship RO:0004003 HGNC:11114 KDM5C and xref OMIM:300534, matching the intended target. The KDM5A/KDM5B/KDM5D paralogues, KMT2A/Wiedemann-Steiner syndrome, PHF8/Siderius type and MECP2-duplication/Lubs type were explicitly held out of scope; that boundary is recorded in the entry description and in a differential_diagnoses entry. kb/disorders/Wiedemann-Steiner_Syndrome.yaml was not touched.

    Deep research provider: claude_code, run via "just research-disorder claude_code". falcon was not used because EDISON_API_KEY and FUTUREHOUSE_API_KEY were both present but empty in the environment. The report (18.5 min, 69 turns) is committed at research/Claes-Jensen_Type_X-Linked_Intellectual_Disability-deep-research-claude_code.md and was read in full before curation; its own independent NEC preflight also resolved to KDM5C.

    GeneReviews baseline: no chapter exists for this disease or gene. PubMed ("GeneReviews[All Fields] AND (KDM5C OR JARID1C OR SMCX OR Claes-Jensen)", "Claes-Jensen[TI] GeneReviews[TI]") and the NCBI Bookshelf gene book were searched on 2026-07-31 and returned only gene-table fragments inside unrelated chapters. The negative result is documented in the entry notes slot. The phenotype baseline was instead anchored on PMID:39835750 (175 literature cases, sex-stratified), PMID:41537560 (RARE-X registry meta-analysis to 269 individuals), PMID:32279304 (19 heterozygous females) and PMID:34089235 (37 caregiver-reported individuals).

    Content curated: 7 pathophysiology nodes with a causal downstream graph, spanning the enzymatic arm (H3K4me3/me2 demethylase loss), the non-enzymatic arm (REST/HDAC1-2/G9a scaffolding, evidenced by the R1115H allele), locus-specific H3K4me3 fine-tuning failure at CpG-island promoters, derepression of non-neuronal/germline/cryptic transcriptional programs, the 2024 Nature WNT developmental-window mechanism, dendritic and spine hypoplasia, and the neuron-autonomous seizure substrate; CL, GO, UBERON and biological_scale bindings throughout. 20 HPO-bound phenotypes. A KDM5C genetic block with two case_fraction records (0.7-2.8% of XLID; 3.3% in ascertained XLMR families). Three curated variants. Two inheritance blocks modelling both the authoritative HP:0001419 X-linked recessive annotation and the manifesting-heterozygous-female reality (KDM5C escapes X-inactivation, so females carry a higher baseline dose and heterozygotes are frequently affected) - this directly addresses the briefing instruction to model carrier females honestly rather than calling the disorder fully recessive. Prevalence. Two diagnosis entries including the DNA methylation episignature with an explicit performance caveat about its 7-patient training cohort. Two differential diagnoses. Seven treatments. Two animal models (mouse, Drosophila). Three EMERGING mechanistic_hypotheses (WNT-window rescue; KMT2A/KDM5C writer-eraser rebalancing; SAHA/HDAC-inhibition restoration of KDM5C expression, flagged as demonstrated only in ARX-deficient rather than KDM5C-mutant models). Three discussions: two KNOWLEDGE_GAP and one HUMAN_MODEL_MISMATCH, each with structured proposed_experiments.

    Deliberate omissions: seizure frequency is left unset because registry self-enrolment and historical XLMR-family literature give conflicting estimates in opposite directions (35-48% overall; 47-64% male vs 18-19% female in meta-analyses but 56% in the registry-recruited female subcohort), per docs/frequency-evidence-guidelines.md.

    Validation: "just validate" passes cleanly - schema "No issues found"; terms "Validation passed"; references "All validations passed" with 113/113 snippets verified against cached references. "just compliance" reports 89.8% global (239/266) / 90.1% weighted. "just validate-graphs" reports no errors for this entry. All 26 cited PMIDs were fetched with "just fetch-reference" into references_cache/; no cache file was hand-written or hand-edited. One reference fetched early from a mis-recalled PMID (PMID:16249883, a JNK3 paper unrelated to KDM5C) was identified as wrong and deleted rather than cited.

  summary: Red-team review fixes for Claes-Jensen (KDM5C)
  details: |
    Adversarial red-team review of PR #7534.

    NEC re-check: MONDO:0010355 confirmed with OAK - label "syndromic X-linked
    intellectual disability Claes-Jensen type", RO:0004003 HGNC:11114 KDM5C,
    OMIM:300534, Orphanet:85279, synonyms MRXSCJ / MRXSJ. Matches the entry's
    disease_term and gene exactly. No absorption of confusable neighbours: no
    KDM5A/KDM5B/KDM5D content, and Wiedemann-Steiner (KMT2A) appears only as a
    correctly separated differential diagnosis.

    Fabrication sweep: scripted whitespace-normalised substring check of every
    evidence snippet against references_cache. 113/113 original snippets were
    exact; none paraphrased, reworded or stitched from non-contiguous text. All
    26 cited PMIDs had cache files. Live PubMed esummary spot-check of
    PMID:41537560, 40864554, 40125771, 34536985, 36495919 and 39835750 - all
    titles and journals match the cached frontmatter and all are genuinely about
    KDM5C / Claes-Jensen. Verified that snippets drawn from the long full-text
    caches (17320160, 38383780) come from those papers' own abstracts, not from
    reference lists or quoted third-party text.

    Ontology terms: all 14 GO, 22 HP, 4 CL, 4 UBERON, 7 NCIT, 2 MONDO and 1 HGNC
    identifier independently verified with runoak; every label matched exactly.

    Fixes applied:

    1. Strabismus phenotype had no cited evidence mentioning strabismus.
       PMID:41537560 says only "vision and digestive issues" and PMID:40125771's
       abstract never uses the word (it appears solely in the journal title).
       Re-annotated at the evidenced level as Ophthalmological Abnormality
       (HP:0000478), swapped in the 40125771 "ophthalmological abnormalities"
       sentence, and recorded the strabismus claim in a curation note pending a
       quotable source. The strabismus-specific surgical target is retained on
       the ophthalmological treatment entry, where the description covers it.
    2. Constipation phenotype likewise had no cited evidence mentioning
       constipation. Re-annotated as Gastrointestinal Dysfunction (HP:0011024),
       which is PMID:34089235's literal wording.
    3. Autism evidence item PMID:29670509 quoted a generic statement about
       intellectual disability in the world population, not about KDM5C.
       Replaced with the KDM5C-specific sentence "KDM5C-deficiency is
       characterized by frequent autistic and aggressive behaviors" and retagged
       evidence_source OTHER.
    4. Microcephaly carried frequency OCCASIONAL (5-29%) while the entry's own
       quoted figure was 7/20 = 35% (FREQUENT band), and no snippet supported
       any band. Frequency removed per docs/frequency-evidence-guidelines.md
       with an explicit note; added PMID:41743791 so the association no longer
       rests on a single female case report.
    5. Delayed Speech and Language Development keeps VERY_FREQUENT but the basis
       was undocumented and the second citation (4/19 females) could be misread
       as contradicting it. Added an explicit Pattern C / D-1 basis note and
       PMID:41743791 evidence.
    6. Duplicate and misassigned experiment_id values across discussions:
       "xci_single_cell_mosaic" was reused for the WNT cortical-organoid
       experiment, and "wnt_window_organoid_mapping" was attached to the
       snRNA-seq experiment. Reassigned to wnt_window_organoid_mapping and
       kdm5c_snrnaseq_spatial_atlas respectively.
    7. evidence_source mis-tags corrected: the two PMID:38383780 patient-derived
       iPSC rescue snippets were tagged MODEL_ORGANISM and are now IN_VITRO, and
       the genuine mouse behavioural-rescue sentence was added as separate
       MODEL_ORGANISM evidence on the WNT hypothesis. Two PMID:36831303
       background statements inside a mouse study were tagged HUMAN_CLINICAL and
       MODEL_ORGANISM and are now OTHER.

    Deliberately not changed: the small-n HPO annotations absent from the entry
    (decreased testicular size 3/29, cholelithiasis 2/20, recurrent respiratory
    infections 3/3) have no quotable snippet in any cached reference, so adding
    them would reintroduce exactly the defect fixed above; the Abnormal Facial
    Shape FREQUENT band is defensible under qualitative-term mapping; and the
    mixed zebrafish-plus-primary-neuron PMID:17320160 snippet was left as
    MODEL_ORGANISM rather than split, since the sentence is indivisible.

    Validation after fixes: just validate (schema + terms) passes;
    just validate-references reports 116/116 snippets verified; weighted
    compliance 90.2%; tests/test_data.py foreign-key and unique-name tests pass
    (1711 passed). Reverted 7614 cosmetic references_cache frontmatter-quoting
    changes emitted by the validator's cache normalizer so the PR diff stays in
    scope, and committed the 6 term-cache CSV additions the original PR omitted
    for its own new terms.

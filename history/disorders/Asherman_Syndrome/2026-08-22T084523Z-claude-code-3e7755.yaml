  summary: 'Create: Asherman Syndrome (MONDO:0015299)'
  details: |
    New disorder entry for Asherman syndrome (intrauterine adhesions), curated against the obstetric/gynaecologic coverage gap in issue #7837. Ten pathophysiology nodes modelling the disease as a switch from scarless endometrial regeneration to fibrotic repair, with five nodes conforming to the fibrotic_response module. Four mechanistic_hypotheses: one CANONICAL (basalis destruction to nonregenerative repair) and three EMERGING amplifier arms (defective epithelial autophagy via DIO2-MAPK/ERK-MTOR, ferroptosis, EndMT), each deliberately kept off the canonical chain because each rests on a small patient observation plus rodent or in vitro perturbation. Seven phenotypes, five treatments with target_mechanisms edges, one prevalence record, two epidemiology records, one diagnosis record, one progression record, three differential diagnoses, and three discussions (one HUMAN_MODEL_MISMATCH on the rat-only EndMT arm, two KNOWLEDGE_GAPs). Thirteen references, all fetched with just fetch-reference. Validation: the pre-edit hook ran schema and term validation clean; just count-verified-snippets reports 53/53 verified against cached references; check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets, check-environmental-evidence and check-stubs all clean; just validate-disorders run as the pre-PR sweep. The stub stubs/Asherman_Syndrome.yaml is deleted with the lump/split call resolved as DISEASE. Two ontology bindings deliberately widened or omitted: hypomenorrhea uses the parent HP:0000140 because HPO has no hypomenorrhea term, and the recurrent pregnancy loss phenotype is left unbound because HP:0200067 sits outside the PhenotypeTerm enum root, a further instance of gap 3 recorded in issue #7837. One substantive correction made during curation: an initial draft misread reflowed PubMed output and recorded the pooled post-adhesiolysis ectopic pregnancy rate as 11.5 percent; the snippet check against the cached abstract caught this, and the correct figures are ectopic pregnancy 4.2 percent and mid-trimester loss 11.5 percent.

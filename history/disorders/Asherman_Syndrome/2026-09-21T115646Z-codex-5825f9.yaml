  details: |
    Read the complete original disease and genuine matching research report, all original references at their available depth, the full AAGL/ESGE guideline, StatPearls chapter, clinical review, regeneration review, rat study, tuberculosis case and postoperative estrogen trial including regenerated tables. Independent full-body source and integration audits covered the human single-cell/organoid atlas and DIO2/autophagy paper; separate supplements were not presumed read. Replaced bundled and overstated mechanisms with 18 atomic nodes, 9 connected clinical findings, 5 diagnostic records, 9 care records, one currently verified trial, a research biomarker, 3 animal and 4 culture/organoid models, and explicit hypotheses/gaps. Distinguished inferred signaling and marker coexpression from lineage or causal rescue, corrected human/model denominators and drug timing, removed unsupported phenotype frequencies, and separated short-term adhesion outcomes from fertility benefit. The ferroptosis and new hydrogel reports remain explicitly abstract-limited. Added the exact StatPearls tag after GeneReviews NO_CHAPTER. All 158 quotations, schema and live terms pass; deterministic guards and whole-KB node-class examples pass. Reference caches were generated only with just fetch-reference. Captcha and unused generated records were excluded, and the frozen dataset-accession cache was not accessed.

  summary: 'Review response: evidence the beta-cell INHIBITS direction and sharpen
    the CISD2 gap on PR #9227'
  details: |
    Response to the ai4c-reviewer review on PR #9227, which APPROVED the curation with three non-blocking suggestions. Two applied, one declined.

    SUGGESTION 1 - the Beta Cell Apoptosis INHIBITS link was evidenced by something that does not measure the node. Applied, and it is the sharpest point in the review. The reviewer observed that reduced apoptosis predicts ARRESTED DECLINE, whereas stimulated C-peptide IMPROVING from baseline is at least as consistent with recovered secretory function in beta cells that were still alive. That is a real claim-evidence alignment defect, not a style preference: the INHIBITS direction was resting on a functional readout that is compatible with, but not specific to, reduced cell death. Fixed by adding the source's mechanism sentence ('targets dysfunctional ER and mitochondrial pathways to reduce pancreatic beta cell and neuronal death') as a first evidence item on the link - the only statement in the paper that names cell death - and demoting the C-peptide item to explicit functional corroboration. The link description now states the improvement-versus-arrested-decline distinction outright rather than leaving it implicit.

    SUGGESTION 2 - sharpen the CISD2 generalization rationale beyond 'independent route'. Applied, with a correction. The reviewer's substance was right: the CISD2 missense arm perturbs the shared compartment in the OPPOSITE direction from WFS1 loss, which is a much stronger argument against read-across than mere independence of route. But the reviewer attributed that finding to PMID:30352948, and that paper is the WFS1 arm - it reports reduced ER-mitochondria interactions and Ca2+ exchange in WFS1-null fibroblasts and says nothing about CISD2. The actual source is PMID:28335035, already cited elsewhere in this entry and already cached. The rationale now carries both directions with both PMIDs cited and snippet-verified, and states the point more precisely than the review did: the direction is not uniform even WITHIN CISD2, since the missense variant shows increased contact and a hyperfused network while complete CISD2 loss in human cortical neurons shows loss of contact sites. That variant-dependence is itself why this entry models the convergence node as direction-neutral dysregulation. Also noted: the CISD2 missense paper explicitly reports the ABSENCE of overt ER stress, which is the thing PB&TURSO is meant to relieve - the most concrete reason a WFS1-tuned modulator may not transfer.

    SUGGESTION 3 - evidence_source on the mechanism-framing snippet. Declined, no action. The reviewer described it as genuinely optional and noted the explanation already records the choice as deliberate ('the trial report's mechanistic framing citing prior work, not a measurement made in this trial'). CLAUDE.md's rule is that evidence_source classifies the publication's evidence type, and the publication is a human clinical trial report, so HUMAN_CLINICAL stands.

    Validation re-run after the edits: just validate (passed); just validate-terms (passed); just count-verified-snippets (147/147 verified, up from 144); just check-duplicate-keys, check-folded-hyphens, check-snippet-length, check-title-snippets (all passed, no new findings); pytest tests/test_data.py -k Wolfram_Syndrome.yaml (16 passed). No new references fetched - PMID:28335035 and PMID:30352948 were both already cached and already cited in this entry. No term-cache changes. Seven unrelated references_cache files rewritten by just validate were reverted, as in the previous commit.

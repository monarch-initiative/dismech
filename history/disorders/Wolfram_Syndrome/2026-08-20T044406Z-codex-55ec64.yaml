  summary: 'Deep evidence review: Wolfram Syndrome'
  details: |
    Deep publication-readiness review of the MONDO:0018105 umbrella entry, with
    WS1 (biallelic WFS1) and WS2 (biallelic CISD2) kept as explicit subtypes and
    dominant/nonclassic monoallelic WFS1 disease kept out of scope. The review
    covered identity and lump/split boundaries; phenotypes reported above 10%;
    atomic causal mechanisms and graph edges; genes and inheritance; diagnosis,
    management, models, datasets, discussions, ontology terms, evidence-source
    typing, and recent primary literature.

    The first immutable content audit rejected the draft and its findings were
    repaired before this record was created. Repairs corrected both prevalence
    bands; reconciled GSE139535 with its GEO-linked publication PMID:32846125;
    split mouse, human-cell, and human-clinical evidence for PMID:20160352,
    PMID:36995380, and PMID:32321868; separated CRISPR-corrected beta-cell insulin
    secretion, mouse transplantation, and ER-stress readouts; added explicit
    mechanism links for both animal models; scoped diabetes insipidus and the
    historical DIDMOAD natural history to WS1; added cautiously qualified WS1
    anxiety (77%) and adult obstructive sleep apnea (29.4%); and connected diabetes
    insipidus, hearing impairment, neurogenic bladder, and hydronephrosis through
    evidence-backed intermediate pathophysiology nodes.

    The repaired entry has 29 phenotypes, of which 12 are connected to the
    pathograph, and both curated disease genes (2/2: WFS1 and CISD2) are represented
    in subtype-specific causal branches. Reference validation verified 135/135
    snippets against cached source text. Eighteen newly needed reference caches
    (14 PubMed and 4 ClinicalTrials.gov) were generated only with `just
    fetch-reference`; every one is cited by the reviewed entry, and validator-
    generated refreshes of pre-existing caches were restored byte-identically.

    GSE139535 was verified directly with the dataset verifier (human, two samples,
    single-cell RNA sequencing, GEO publication PMID:32846125). Seven structured
    trial records were checked against their ClinicalTrials.gov cache records:
    NCT02829268, NCT05676034, NCT03717909, NCT02882477, NCT04940572, NCT05659368,
    and NCT02841553.

    Final gates passed for schema, ontology terms, references, cache frontmatter,
    dataset accession, exact snippets, and target causal-graph integrity. The
    repository-wide graph validator continued to report only the pre-existing
    backlog in 74 other disorders; Wolfram Syndrome was absent from that list.
    `git diff --check` was clean. The independent second audit APPROVED the exact
    target SHA-256
    42980aad404aecad4588042f0950b37cf750de7e6ada0508f93ad2710148acae and the
    exact pre-history 20-file content-manifest SHA-256
    b1b4e89a999e4598de2e3a272d649beae0e3ac144491ea9caf8e1a616c7e754c with no
    blockers.

    The first commit attempt was stopped, as intended, after configured pre-commit
    hooks applied mechanical normalization. `yamlfix` reflowed one line in the
    disorder YAML; the end-of-file hook added final newlines to the 18 newly
    fetched caches; and the trailing-whitespace hook removed two terminal spaces
    from PMID:23981289. No cache was hand-edited. A parsed-JSON comparison found
    the normalized disorder semantically identical to the independently approved
    disorder. The normalized target SHA-256 is
    608a5598bed8682b05401b9ade6f19b3ea3eb96a6d302cca9909c9210b9ef322 and the
    normalized pre-history 20-file content-manifest SHA-256 is
    8d2f4d8398791bef184493723665fbb23a27424565bb55ff00b1e8a8626c9f77. Schema,
    ontology-term, 135/135 snippet, dataset, and target-graph gates were rerun and
    passed on the normalized state before the commit was retried.

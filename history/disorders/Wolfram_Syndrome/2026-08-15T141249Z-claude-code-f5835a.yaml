  summary: 'Create: Wolfram Syndrome'
  details: |
    New KB entry for Wolfram syndrome (MONDO:0018105), curated from a claude_code deep-research report (research/Wolfram_Syndrome-deep-research-claude_code.md), whose own reference validation reported 51/51 references verified and a confabulation rate of 0.0. GeneReviews baseline PMID:20301750 (WFS1 Spectrum Disorder) fetched, tagged, and cross-referenced against the phenotype list. Modeled the eight-node ER-stress cascade: loss of wolframin at the ER membrane, unrestrained ATF6-alpha signaling via failure of HRD1-mediated degradation, ER calcium depletion with failure of the NCS1-IP3R ER-mitochondria contact, mitochondrial dysfunction with impaired neuronal development, cytosolic calcium dysregulation with calpain activation, beta cell apoptosis, retinal ganglion cell and CNS neuron degeneration, and brainstem/cerebellar volume loss. Twelve phenotypes with frequency bands anchored to the UK national cohort (PMID:7490992). Two subtypes (WS1/WFS1, WS2/CISD2) with MONDO subtype terms. Seven treatments including dantrolene carried with REFUTE evidence for its negative trial and PB-and-TURSO graded PARTIAL against its single-arm open-label design. One experimental model (CRISPR-corrected patient iPSC beta cells) with a RESCUES link and a readout. Four discussions. SCOPE: the dominantly inherited nonclassic WFS1 spectrum is deliberately excluded and recorded as a differential. HONESTY NOTE: the TREATWOLFRAM valproate trial is reported negative but only its protocol (PMID:40010822) is indexed in PubMed, so valproate is deliberately absent from treatments rather than cited with an unsupportable snippet; the reported result is recorded in notes only. Validated: just validate (schema) and just validate-terms passed via the pre-write hook; just count-verified-snippets reported 76/76 verified against cached references. Six snippets were trimmed during verification because a square-bracketed cohort figure in the PMID:7490992 abstract is stripped by the snippet validator; the affected explanation now states the figure rather than quoting it. Seeded cache/mondo and the DiseaseTerm and DiseaseOrSubtypeTerm enum caches for MONDO:0018105, MONDO:0009101, and MONDO:0011502 by running the term validator against a local sqlite:obo:mondo adapter, then restored conf/oak_config.yaml unchanged.

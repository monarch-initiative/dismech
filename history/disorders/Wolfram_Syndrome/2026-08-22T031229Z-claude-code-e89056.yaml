  summary: 'Edit: complete the PB&TURSO/HELIOS curation from PMID:42138079 (mechanism
    arms, endpoints, safety, CISD2 gap)'
  details: |
    PMID:42138079 (Urano et al., J Clin Invest 2026, HELIOS phase II trial of sodium phenylbutyrate and taurursodiol in Wolfram syndrome) was given as a curation nucleus, but was ALREADY curated in this entry: a 'Sodium Phenylbutyrate and Taurursodiol' treatment with two evidence items and a MODULATES link to the ER stress node, plus the NCT05676034 clinical_trials record. The existing curation is sound, including its PARTIAL grading of the efficacy claim against the single-arm open-label design. This session completes the consumption of the source rather than re-curating it; nothing existing was rewritten or contradicted.

    WHAT WAS ALREADY THERE (verified, left alone): the headline result sentence, the trial-design sentence, the treatment's ER/ATF6-alpha target_mechanisms link, the NCT05676034 trial record with its phase/status/target_phenotypes, and the design-ceiling reasoning in both descriptions.

    WHAT THIS SESSION ADDED

    1. Three additional target_mechanisms links on the PB&TURSO treatment. The source's mechanism sentence names four things - dysfunctional ER pathways, dysfunctional mitochondrial pathways, reduced pancreatic beta cell death, and reduced neuronal death - and only the first was attached to the pathograph. Added links to Mitochondrial Dysfunction (MODULATES), Beta Cell Apoptosis (INHIBITS), and Retinal Ganglion Cell and CNS Neuron Degeneration (MODULATES), each with its own evidence item. The effect verbs are deliberately not uniform: INHIBITS on the beta cell node because the trial's primary endpoint (stimulated C-peptide at 120 min during MMTT) is a direct functional readout of surviving beta cell mass and improved at both 24 and 48 weeks; MODULATES on the other two because no trial readout measures mitochondrial function, and the visual-acuity result was stabilization with the authors' own natural-history caveat attached.

    2. Six additional evidence items on the treatment, covering what the entry previously cited only through the headline sentence: the C-peptide primary endpoint, the HbA1c and time-in-target-range secondary endpoints, the global-impression responder result, two safety items (11/12 participants with TEAEs, all mild or moderate and mostly gastrointestinal; interruption or reduction in 3 each, no discontinuations, no serious TEAEs or deaths), and the authors' own limitations sentence. The objective endpoints and the unblinded global-impression scales are curated as separate evidence items with different explanations, because open-label expectancy bears on them very differently - that distinction is stated in the treatment description too.

    3. A new KNOWLEDGE_GAP discussion, wfs_cisd2_treatment_generalization, recording that HELIOS deliberately restricted enrollment to WFS1 disease and that the authors' suggestion that CISD2 Wolfram syndrome may also benefit is an untested hypothesis. It attaches to the three pathophysiology nodes where the two subtypes converge, and carries a structured proposed_experiment with decision_criterion / would_support / would_refute. The rationale notes why this matters more in this entry than it would elsewhere: the entry already models CISD2 as an independent route into the shared ER-mitochondria contact compartment rather than as a WFS1 phenocopy, so convergence at that node is precisely the premise the generalization rests on. It also notes the clinical divergence (CISD2 disease lacks diabetes insipidus, adds bleeding tendency) that stops shared upstream mechanism from implying a shared response profile.

    DELIBERATELY NOT DONE

    - PB&TURSO was NOT curated onto the CISD2 subtype anywhere. No CISD2 participant was treated; the generalization is recorded as a gap and the discussion notes say explicitly that it should not become a treatment claim until one has been.
    - No surrogate_endpoints entry for C-peptide. The SurrogateEndpoint class in this schema is specifically for rows of FDA's regulatory surrogate-endpoint table (row_id, source_table, approval_type, endpoint_validation_level), not for a trial's own primary endpoint. Using it here would have misrepresented a phase II endpoint as a regulatory surrogate.
    - No new biochemical entry for residual C-peptide. Defensible in principle, but it would be a disease-level marker claim resting on one trial's eligibility criteria, and the C-peptide result is already carried where it does its work - as evidence on the treatment and its beta-cell mechanism link.
    - The efficacy grading was left at PARTIAL throughout. Nothing in the additional detail changes the single-arm open-label ceiling.


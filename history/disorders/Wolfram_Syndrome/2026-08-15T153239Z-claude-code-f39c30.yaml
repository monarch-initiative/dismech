  details: |
    Addressed all four blocking items from the PR 8527 review. (1) CRITICAL: committed references_cache for all 20 cited PMIDs, plus the three ClinicalTrials.gov records added below, so reference validation is reproducible from a fresh checkout and CI is not network-dependent; the failing CI run had flagged three snippets that live in full-text records the deep-research run had cached locally but that CI re-fetched as abstract-only. (2) Added Myoclonus HP:0001336 as a FREQUENT phenotype with a downstream edge from the brainstem and cerebellar node; the snippet stops mid-parenthesis because the cohort figure of 28 of 45 patients (62%) sits inside square brackets that the snippet validator strips, and that constraint is stated in the explanation. (3) Rebound the brain atrophy phenotype from HP:0002059 Cerebral atrophy, which is forebrain-specific, to HP:0012444 Brain atrophy, which is compartment-neutral and matches a description and snippet that both concern brainstem and cerebellum; the reviewer correctly noted the brainstem is the compartment that determines survival here. (4) Added a clinical_trials block with all three NCT-identified trials: NCT02829268 (dantrolene, PHASE_II, COMPLETED, carrying its published negative result as REFUTE), NCT05676034 (HELIOS AMX0035, PHASE_II, ACTIVE_NOT_RECRUITING, with the registry record establishing the open-label single-arm design that qualifies the reported benefit), and NCT03717909 (TREATWOLFRAM valproate, PHASE_II, COMPLETED, with the registry record establishing the randomized placebo-controlled design and the actual enrollment of 63 of a planned 70). Validated: just validate passed (schema + terms) and just count-verified-snippets now reports 81/81 verified against cached references, up from 76/76. All 23 reference_title values re-audited programmatically against references_cache with zero mismatches; three ClinicalTrials.gov titles had been written from memory and were corrected to the cached registry titles.

  summary: 'Review round 1: cite the evidence the entry already had'
  details: |
    All six review items plus prevalence and the treatments question. The reviewer's framing was accurate and worth recording: three of the six were claims the entry argued while leaving the supporting quote uncited in a cache the PR already committed. Item 1: Central Hypomyelination was located to spinal cord alone while its evidence was brain imaging and its children were cerebral and cerebellar; brain and cerebellum added alongside. Item 2: the plasmenyl-PE depletion node rested on a mouse chemistry statement while PMID:29500230 carries the direct patient-cell measurement, now cited, including the compensatory plasmanyl-PC rise that makes the change a redistribution rather than a simple loss. Item 3: the fibroblast enzyme assay named as the informative readout is now evidenced by the paper that performed it rather than only by the blood-compensation sentence explaining why blood is not usable. Item 4: an animal_models block with two ModelMechanismLinks - RECAPITULATES for the peroxidation and maturation node with a readout, PARTIALLY_RECAPITULATES for the motor arm whose limitations state that the murine assessment covers motor, myelin, gliosis and microcephaly and is not reported to cover auditory or visual function, which is precisely what the extramotor knowledge gap asks about. Item 5: cleft palate and cerebral atrophy added as phenotypes and reached from the pathograph; both were already inside snippets quoted elsewhere in the file. Item 6: the enzymatic-activity evidence regraded from HUMAN_CLINICAL to IN_VITRO after checking that PMID:28052917 is MeSH-indexed to Saccharomyces cerevisiae - the variant is human, the activity measurement is a heterologous assay. Prevalence added as CASES_IN_LITERATURE with ULTRA_RARE, deliberately not converted to a rate because there is no denominator. No treatments section: management is symptomatic and that is a curatable fact, but none of the four cached references states it and no quotable management source was locatable, so the reason is recorded in notes rather than a treatment list being asserted without a source. Validation: just validate passes, 32 of 32 snippets verified, entity refs and duplicate keys clean, snippet-length and title-snippet baselines unchanged, reachability audit shows one root, no dangling targets, no unreached phenotype, and readout targets matching their links.

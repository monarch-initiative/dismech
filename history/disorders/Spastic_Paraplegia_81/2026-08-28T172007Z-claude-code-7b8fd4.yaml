  summary: 'Create: Spastic Paraplegia 81 (SELENOI)'
  details: |
    De novo curation from an OpenScientist deep-research report (22 min, 14/14 references verified, confabulation_rate 0.0, 8/14 on topic). Preflight-dr passed: correct gene, matching OMIM. All 12 quotes taken from the report were re-verified against the primary abstracts in references_cache before use, and all 12 matched exactly - noticeably better quote fidelity than the claude_code provider used in the previous run. One correction was needed and it is the important one: the report gives the causal gene as HGNC:30396, which is SELENOS, a different selenoprotein. SELENOI is hgnc:29361. The report's own term-validation block reported 39 of 40 terms verified and did not catch this, because HGNC:30396 resolves to a real gene - existence checking cannot detect a symbol-to-identifier mismatch. This is the second deep-research provider in two runs to supply a wrong causal-gene identifier that points at a real related gene; the previous run's report gave HGNC:6398 (KPNA5) for IRF9. The correction is recorded in the entry's top-level notes rather than silently applied, so the next curator reading that report meets the warning. Pathograph runs from the enzymatic lesion through ether-lipid depletion, oligodendrocyte lipid peroxidation and failed maturation, central hypomyelination, to two clinical arms. The extramotor arm is deliberately weaker than the motor arm and says so in its own description: those features co-occur with the myelin lesion but no source establishes that each follows from it, and sensorineural deafness in particular is a cochlear phenotype whose relation to central hypomyelination is undemonstrated. A KNOWLEDGE_GAP attached to that node records why it matters therapeutically. No phenotype carries a frequency: three reported families give no denominator. Validation: just validate passes including term validation of the corrected gene ID, 24 of 24 snippets verified, entity refs clean, duplicate keys clean, and a reachability audit shows one root, no dangling targets and every phenotype reached.

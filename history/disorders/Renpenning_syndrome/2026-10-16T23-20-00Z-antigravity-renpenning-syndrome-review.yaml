  summary: Comprehensive curation review and enhancement of Renpenning syndrome (MONDO:0010653)
  details: Reviewed existing entry for Renpenning syndrome (PQBP1-related X-linked intellectual disability)
    and resolved compliance and structural gaps using cached literature references. Added allelic syndrome
    synonyms (Golabi-Ito-Hall syndrome, Sutherland-Haan syndrome, Hamel cerebropalatocardiac syndrome,
    Porteous syndrome, and Renpenning type X-linked intellectual disability); Harrison's chapter classifications
    (neurologic disorders and genetics/environment/disease); ultra-rare CASES_IN_LITERATURE prevalence
    citing the 2025 clinical literature review; congenital/infantile and childhood/adolescent progression
    phases; separated PQBP1 spliceopathy (loss-of-function splicing dysregulation, GO:0003729 mRNA binding
    with ABNORMAL modifier) from Altered mRNA 3'-end processing and alternative polyadenylation (Y65C
    gain-of-function 3'-end processing, GO:0031124, PMID:41507200), both feeding Impaired neural progenitor
    proliferation and differentiation; typed DIRECT and INDIRECT_UNKNOWN_INTERMEDIATES downstream causal
    links connecting pathophysiology to all 11 curated phenotypes; rebound Small testes to Decreased testicular
    size (HP:0008734) and added frequency qualifiers on Intellectual disability (VERY_FREQUENT), Abnormal
    facial shape (VERY_FREQUENT), and Anal atresia (VERY_RARE); added biochemical findings (elevated UPF3B_S
    patient mRNA expression and Renpenning syndrome peripheral blood DNA methylation episignature); Whole
    Transcriptome Sequencing (NCIT:C124261) in diagnosis; Fragile X syndrome (MONDO:0010383) and Non-syndromic
    X-linked intellectual disability (MONDO:0019181) in differential_diagnoses backed by PMID:31906484;
    Supportive Care (NCIT:C15747, with notes documenting the absence of cached treatment-specific literature)
    and Genetic Counseling (NCIT:C15240) in treatments; and top-level references.

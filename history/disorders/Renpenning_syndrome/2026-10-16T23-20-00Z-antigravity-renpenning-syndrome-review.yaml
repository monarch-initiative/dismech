    summary: Comprehensive curation review and enhancement of Renpenning syndrome (MONDO:0010653)
    details: >-
      Reviewed existing entry for Renpenning syndrome (PQBP1-related X-linked intellectual disability)
      and resolved compliance and structural gaps using cached literature references. Added allelic
      syndrome synonyms (Golabi-Ito-Hall syndrome, Sutherland-Haan syndrome, Hamel cerebropalatocardiac
      syndrome, Porteous syndrome, and Renpenning type X-linked intellectual disability); Harrison's
      chapter classifications (neurologic disorders and genetics/environment/disease); ultra-rare
      CASES_IN_LITERATURE prevalence citing the 2025 clinical literature review; congenital/infantile
      and childhood/adolescent progression phases; molecular_functions (mRNA binding GO:0003729 and
      transcription coregulator activity GO:0003712) and PMID:41507200 3'-end mRNA processing evidence
      on PQBP1 spliceopathy; typed DIRECT and INDIRECT_UNKNOWN_INTERMEDIATES downstream causal links
      connecting pathophysiology to all 11 curated phenotypes; biochemical findings (elevated UPF3B_S
      blood mRNA expression and Renpenning syndrome peripheral blood DNA methylation episignature);
      Whole Transcriptome Sequencing (NCIT:C124261) in diagnosis; Fragile X syndrome (MONDO:0010383)
      and Non-syndromic X-linked intellectual disability (MONDO:0019181) in differential_diagnoses;
      Supportive Care (NCIT:C15747) and Genetic Counseling (NCIT:C15240) in treatments; and top-level
      references.

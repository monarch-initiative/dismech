  summary: Add a Pure-Tone Audiometry diagnosis row with LOINC measurements
  details: |
    Added a new Pure-Tone Audiometry diagnosis row, separate from the existing molecular-testing row, carrying a LOINC-coded measurement set (panel plus 500/1000/2000/4000 Hz per ear). No reference range is bound, as the phenotype section's own notes already state: severity across all reported individuals spans mild to profound, the loss is bilateral in most families but unilateral or asymmetric in one, and no series reports what proportion of carriers progress or how far.

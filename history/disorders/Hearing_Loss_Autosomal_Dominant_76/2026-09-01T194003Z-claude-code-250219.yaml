  summary: 'Review response: DFNA76 treatments, and correcting an overstated heterozygous-null
    claim'
  details: |
    Second session on this entry, responding to review on PR #10420 and to two rounds of my own full-text checking. The first record (2026-09-01T180700Z) is now stale in two respects and is left unedited as history is append-only: it reports 52/52 snippets, and it says amplification and cochlear implantation were deliberately not curated. Both statements were true when written and are now false.

    Review round 1, all three findings correct and all three fixed. The counselling record's only evidence was a hearing-aid sentence, which now sits on the amplification treatment with an explanation noting it records use rather than outcome. Hearing Amplification and Cochlear Implantation are curated following the Autosomal_Dominant_Nonsyndromic_Hearing_Loss_11 pattern, citing the class-level DFNA review PMID:37371710 with directness: INDIRECT. Counselling and audiometry are split. Counselling carries no target_mechanisms and its notes say why - no TreatmentEffectEnum value describes counselling, and choosing the least-wrong one would put a false mechanistic claim in a machine-readable slot.

    Non-blocking items taken: GO:0060088 regraded DECREASED to ABNORMAL for the liquid-to-hexagonal packing shift; High-Frequency Weighted Hearing Loss connected with INDIRECT_UNKNOWN_INTERMEDIATES and a description saying the base-to-apex gradient is not established for PLS1; Congenital Onset left unconnected with the reason written into the record. conforms_to sensorineural_hair_cell_loss declined, and the reviewer subsequently withdrew the suggestion having checked the module - its nodes expect potassium homeostasis dysregulation, oxidative stress and apoptosis, and PMID:25124451 states the hearing loss is not consecutive to hair cell death. gnomAD constraint declined as unattributed.

    My own full-text pass then found that Pls1 heterozygous nulls shift with age, which I wrote up as settling the dose question. Review round 2 correctly caught that this overstates the source, and the correction is the substantive content of this session. Heterozygotes shift significantly against themselves and wild-type animals do not, but on click ABR beyond six months there is no significant difference between heterozygotes and wild type; the tone-pip elevation at seven to nine months carries no statistic, the figure legend marking significance for knockout against wild type only; and the paper uses heterozygotes as its control genotype on morphology, electrophysiology and transduction. The click-ABR null is now carried as supports: REFUTE and the figure legend as NO_EVIDENCE, so one paper supporting part of a claim and contradicting another is split into separate items rather than cited only where it helps.

    The consequence for the entry is that the dose question is described as open in both directions. That matters because if a powered comparison shows heterozygous nulls are genuinely unaffected, then heterozygous nulls unaffected with knock-in heterozygotes deaf becomes the cleanest dominant-negative signature available - which my previous wording had foreclosed. The proposed knock-in experiment now has to settle that question rather than assume it, and its supporting outcome admits both possible results.

    Validation: just validate exit 0 with 62/62 snippets verified; validate-disorders, check-entity-refs, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens all exit 0.

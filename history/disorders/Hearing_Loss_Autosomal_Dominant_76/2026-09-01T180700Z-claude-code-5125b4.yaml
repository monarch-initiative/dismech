  summary: 'Create: Hearing Loss Autosomal Dominant 76 (DFNA76, PLS1)'
  details: |
    De novo curation of DFNA76 (MONDO:0032917), heterozygous PLS1/plastin 1. Nothing in kb/ previously mentioned PLS1, so this is a clean start.

    entry_type decision: DISEASE. One gene, one conserved pathograph (altered plastin 1 -> impaired actin cross-linking -> altered stereocilia actin core packing and width, and a separate branch to impaired mechanoelectrical transduction -> progressive SNHL). Not a SUBTYPE of any curated entry; not a GROUPING.

    Sources: own PubMed sweep (PLS1/DFNA76/plastin 1 stereocilia) plus an Edison/falcon deep-research report. NEC preflight PASS: PLS1 mentioned 35 times, MONDO OMIM 618787.

    The central curation decision is that the Pls1-null mouse and the human disease are not the same lesion, and the entry is structured to keep them apart rather than to blend them. Two named mechanistic_hypotheses carry the disagreement: dominant_negative_actin_crosslinking_model (EMERGING) and haploinsufficiency_model (ALTERNATIVE). The 2026 zebrafish study is the only experiment putting the human allele and simple gene loss side by side, and they diverge in direction on FM1-43 uptake through the MET channel; its authors state plainly that they did not co-express wild-type and mutant PLS1, which is curated as supports: NO_EVIDENCE (a limitation reporting an experiment not done, not a refutation). The Pls1-null mouse link to the transduction node is fidelity: LOW for the same reason, with the reasoning written into limitations so a reader cannot infer that mouse transduction data apply to patients.

    Onset is curated as genuinely heterogeneous rather than uncertain: a separate 'Congenital Onset in Some Families' phenotype records the Chinese family that failed newborn screening in two generations, because merging it with the childhood-onset progressive record would misdescribe one family or the other. A KNOWLEDGE_GAP records that heterogeneity and its counselling cost.

    Exon numbering: PMID:36537221 calls the skipped exon 8 and PMID:41822198 calls it 9 for variants at the same donor site. The entry names the donor site (c.981) rather than adopting either number.

    Snippet mechanics: three snippets from PMID:31397523 and PMID:30872814 initially failed because the validator strips bracketed spans that do not match conf/reference_validator_config.yaml literal_bracket_patterns; the fix was to quote bracket-free sentences rather than to widen the config.

    Deliberately not curated: hearing aids and cochlear implantation as treatments (no PLS1-specific outcome data); the PI3K-AKT transcriptional signal from PLS1 knockdown (cell-line RNA-seq, no patient tissue, and the report itself flags it as hypothesis-generating).

    Validation: just validate exit 0 with 52/52 snippets verified; check-duplicate-keys, check-entity-refs, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-folded-hyphens all exit 0.

  summary: 'Review round 1: paramyotonia HPO rebinding, exercise-intervention term,
    evidence repairs'
  details: |
    First review round on PR #13197, answering a CHANGES_REQUESTED review in one
    push. Six blocking findings and five suggestions.

    Blocking 1 - the paramyotonia binding rested on a false negative-existence
    note. HPO does have a term for paramyotonia, HP:0011809 Paradoxical myotonia,
    under a label that does not contain the word, and the previous note told the
    next reviewer not to look. Rebound from HP:0003552 Muscle stiffness to
    HP:0011809 and rewrote the note with the queries actually run: `runoak -i
    ols:hp search "l~paramyotonia"` -> empty, `"t~paramyotonia"` -> empty,
    `"l~paradoxical myotonia"` -> HP:0011809, positive control `"l~myotonia"` ->
    ten terms including HP:0011809. The OLS4 record for HP:0011809 carries the
    definition naming paramyotonia in parentheses; the local sqlite:obo:hp build
    carries only the shorter of its two definitions, which is why the string is
    not reachable by label or text search. HP:0012904 Cold-sensitive myotonia was
    inspected and rejected on positive grounds: it is a sibling under HP:0002486,
    not a parent, and covers only the thermal half of the concept. Added a
    PMID:25880512 quote equating paramyotonia with paradoxical worsening on
    repeated effort so the rebinding is cited rather than only argued.

    Blocking 2 - Mild Exercise at Attack Onset rebound from NCIT:C15302 Physical
    Therapy to NCIT:C62739 Exercise Intervention, whose is_a ancestors are
    NCIT:C63474 -> NCIT:C16203/NCIT:C25218, so it is admissible in a
    TreatmentTerm slot; it is already bound in Sarcopenia and
    MYH2-Related_Myopathy. `runoak -i ols:ncit search "l~exercise"` was run and
    its two plausible competitors checked and rejected: NCIT:C16567 Exercise and
    NCIT:C39777 Very Light Exercise reach only NCIT:C17708 Physical Activity and
    NCIT:C43431 Activity, with no NCIT:C25218 ancestor. The old note cited
    `"l~exercise test"`, which returns cardiopulmonary stress tests; the new note
    records the correct queries.

    Blocking 3 - two claims whose evidence did not support them.
    (a) Rest after strenuous exercise -> Potassium Efflux. The single PMID:21708955
    quote was about exercise being protective and said nothing about potassium
    accumulating after exercise stops; the same paper's discussion in fact argues
    the protective effect "is not caused by changes in plasma K+". Replaced it
    with two PMID:25880512 quotes, both marked directness: INDIRECT - the HyperPP
    trigger sentence ("Attacks usually begin in childhood and are triggered by
    ingestion of K+-rich foods or rest after vigorous exercise.") and the
    physiology it depends on ("With high-frequency firing during intensive muscle
    activity, the K+ efflux ... produces a K+ increase in the T-tubules that may
    reach 10 mM or higher"). Care was taken not to quote the same review's
    superficially similar HypoPP trigger sentence, which sits in the CACNA1S
    section and names carbohydrate load. causal_link_type weakened from
    INDIRECT_KNOWN_INTERMEDIATES to INDIRECT_UNKNOWN_INTERMEDIATES, because the
    same review lists "the trigger mechanism during rest after exercise" among
    its open questions. The displaced PMID:21708955 sentence was moved to the
    Mild Exercise treatment, where it does support the claim, as an INDIRECT item.
    The target was left on the potassium node rather than retargeted to Sustained
    Sarcolemmal Depolarization, with the reason recorded in the exposure's notes.
    (b) The paramyotonia congenita differential quoted the OBJECTIVE sentence of
    PMID:30931713. Replaced with its RESULTS sentence naming the T704M kindred in
    which PMC and HyperPP coexist, which is the claim. The item was kept rather
    than dropped because it is the only primary family-level citation supporting
    a differential otherwise carried by two reviews.

    Blocking 4 - PMID:25880512 "Similarly, T704M causes HyperPP with late-onset
    permanent myopathy" regraded IN_VITRO -> HUMAN_CLINICAL. The sentence sits in
    the review's genotype-phenotype passage citing clinical family series, not a
    channel measurement. quote_role: REVIEW_SYNTHESIS retained.

    Blocking 5 - GeneReviews (PMID:20301669) mined further, and one rationale
    removed as unsourced. Added the 50% transmission-risk sentence to the
    inheritance block, whose description already asserted it, and the
    agents-to-avoid clause ("use of depolarizing anesthetic agents during general
    anesthesia or ACE-inhibitor medications") to the trigger-avoidance treatment,
    whose description already asserted it. Deleted the sentence "Respiratory
    involvement is the reason depolarizing anaesthetic agents are
    contraindicated." from the Weakness of Ocular, Bulbar, Respiratory and Trunk
    Muscles phenotype: no cited source says it and it is the wrong rationale.
    The correct one is now cited on the treatment instead, from PMID:25880512's
    list of exposures that worsen myotonia, which names depolarizing general
    anaesthetics.

    Blocking 6 - deep-research report committed, and its standing recorded
    honestly. research/Hyperkalemic_Periodic_Paralysis-deep-research-claude_code.md
    was generated AFTER this entry was curated, and it is NOT independent
    corroboration of it. The provider read the existing entry and its reference
    cache while writing: its own provenance note (line 520) says the quoted
    material is "exact-quote-verified snippets held in the dismech reference
    cache for this disease", line 636 quotes a dismech curation note and labels
    it as one, line 671 reads this entry's empty `datasets:` block, and line 1121
    knows the repository's lowercase `hgnc:` convention. It cites exactly the
    twelve references the entry already cited and surfaced nothing new, so no
    content was taken from it into the entry in this round. The run logged two
    "Quote not found" warnings against PMID:30931713 and PMID:39174253 for a
    sentence beginning "Genotype-phenotype correlation is real but not absolute";
    that string is this entry's own curation note being quoted back, not a source
    sentence, and it was not imported as evidence.

    Suggestions taken. The equine readout was renamed from "Resting membrane
    potential of intercostal muscle fibres" (direction: DECREASED, ambiguous
    because depolarization makes the potential less negative) to "Resting membrane
    depolarization of intercostal muscle fibres" with direction: INCREASED, and
    the interpretation now states which quantity falls. The Potassium Efflux node
    was retagged biological_scale: ORGANISM -> TISSUE, since the operative
    compartment is the interstitial and transverse-tubular space of muscle tissue,
    which is what its CL cell type and its cited evidence are about; it was not
    split, because the systemic arm is already the Hyperkalemia During Attacks
    laboratory phenotype that the node's own downstream edge points at, and the
    reasoning is recorded in the node's notes. The Fasting link's evidence item
    gained directness: INDIRECT, since the quote is about the abortive
    carbohydrate rather than the fasting trigger.

    Suggestion on HP:0004889 resolved by searching rather than by assertion:
    `runoak -i ols:hp search "l~respiratory muscle weakness"`, `"l~respiratory
    muscle"` and `"l~weakness of the respiratory muscles"` each return the same
    three terms. There is no plain respiratory-muscle-weakness term in HPO;
    HP:0002747 asserts insufficiency too and loses the episodic qualifier, and
    HP:0030196 Fatigable weakness of respiratory muscles is a myasthenic concept.
    HP:0004889 is retained, and its note now records the searches and the residual
    gap, that the cited quote reports weakness of the breathing muscles without
    documenting insufficiency.

    Suggestion on potassium provocation handled structurally. HPO codes it as the
    clinical modifier HP:0031167, which sits under HP:0012823 Clinical modifier
    and so outside the PhenotypeTerm enum root HP:0000118; it cannot be a
    phenotype term in this schema and no KB entry binds it. Rather than
    manufacture a phenotype, a `definitions:` entry was added carrying the
    GeneReviews clinical diagnostic definition verbatim, with the oral-potassium
    provocation limb as one of four inclusion criteria, and a note recording why
    it is not a phenotype. This is the entry's first `definitions:` block.

    Housekeeping. Four uncited reference-cache files left behind by the
    deep-research run were deleted rather than committed: three DOI records
    (10.1007/s00415-013-7025-9, 10.1016/j.nmd.2023.01.007,
    10.1080/19336950.2019.1600967), all `content_type: unavailable` and so holding
    nothing quotable, and PMID_30341599.md, which is cited neither by the entry
    nor by the report. The DOI files are also the case-collision class of #11204.
    `just check-case-collisions` is clean.

    Validation, each run separately and read: `just validate` (0 issues, 107
    snippets, 118 titles), `just count-verified-snippets` (107/107),
    `just validate-terms` (passed; derived the HP:0011809 label and enum rows),
    `just validate-disorders` (schema + terms + references all passed),
    `just check-duplicate-keys`, `just check-entity-refs`,
    `just check-causal-targets` (no new dangling), `just check-qualifier-terms`,
    `just check-enum-values`, `just check-environmental-evidence`,
    `just check-genereviews` (GeneReviews TAGGED; the StatPearls
    UNTAGGED_CHAPTER line is report-only and never a gap),
    `just check-folded-hyphens`, `just check-snippet-length`,
    `just check-title-snippets`, `just check-snippet-grading` (no new
    divergences), `just check-case-collisions`, `just validate-history-all`.
    `just list-disconnected-phenotypes` reports 6/6 phenotypes causally
    connected. No baseline file was modified.

  summary: 'Fix ungrounded-gene CI gate: bind Nav1.4 molecular function on the SCN4A
    variant node'
  details: |
    Repairs the one failing whole-repo CI gate on PR #13197 (check_gene_activity_grounding.py, "Check for newly ungrounded genes"). Before the fix the gate reported SCN4A as newly wired into the pathograph with no molecular function on the node it lands on; the three Severe_Combined_Immunodeficiency findings in the same run are not from this branch and were left alone.

    The gene descriptor sits on 'SCN4A Gain-of-Function Missense Variant', which carried cell_types, locations and genetic_context but no molecular_functions, while the adjacent downstream node 'Impaired Nav1.4 Inactivation and Persistent Sodium Current' already bound GO:0005248. So the gene-to-molecular-function step the gate exists to require was one edge away from the gene. Bound GO:0005248 voltage-gated sodium channel activity on the variant node itself rather than moving the gene downstream: SCN4A encodes the pore-forming alpha subunit of Nav1.4, so the node about a variant in that gene legitimately carries the channel's molecular function, and moving the gene would have broken the pathograph's genetic entry point.

    Searched GO for a molecular function more specific to the actual lesion (impaired fast inactivation) and found none. Against the local sqlite:obo:go build: descendants of GO:0005248 are only the five cardiac-conduction terms plus GO:0101013 mechanosensitive, none applicable to skeletal muscle; 'l~inactivation' returns 26 terms, all X-chromosome, MAPK (obsolete), complement or ribosome inactivation; 'l~gating' matches only substrings inside 'conjugating', with no channel-gating label at all; 'l~sodium channel' returns the complete 30-row set, whose only other candidate molecular functions are GO:0005272 sodium channel activity (less specific), GO:0017080 sodium channel regulator activity and GO:0019871 sodium channel inhibitor activity (both wrong - SCN4A is the pore-forming subunit, not a regulator or inhibitor of one). Positive controls: 'info GO:0005248' resolved to 'voltage-gated sodium channel activity' on the same adapter, and the two label searches returned real substring matches, so the misses are the adapter answering rather than failing. GO:0005248 is therefore the most specific accurate term, and preferred_term carries the isoform specificity the GO label lacks ('Nav1.4 voltage-gated sodium channel activity'), matching the adjacent node.

    Used modifier: GAIN_OF_FUNCTION alongside the pre-existing genetic_context.functional_impact_category: GAIN_OF_FUNCTION. These are two different claims, which CLAUDE.md permits co-occurring while noting no KB entry did it yet; this entry is the first. The category describes the variant's consequence and sits beside its own allele_type, variant_origin and zygosity detail, so it was not added merely to carry the value; the modifier describes the resulting activity state of the channel. GAIN_OF_FUNCTION rather than INCREASED because the claim is qualitative: fast inactivation is the regulatory constraint that terminates channel activity, and the lesion removes it, so the channel is driven outside normal regulatory control rather than merely running above its normal level. It also matches the modifier already on GO:0005248 at the adjacent node, so the two nodes make one consistent claim.

    Added one evidence item on the node for the new binding, since MolecularFunctionDescriptor inherits from Descriptor and has no evidence slot of its own. Quoted PMID:25880512 (already cited 19 times in this entry): 'Mutations associated with HyperPP, PMC or SCM all produce gain-of-function changes for NaV1.4' - exact substring, ASCII only, and it carries both halves of the binding's claim at once (the gene product is the NaV1.4 channel, and HyperPP alleles leave its activity gain-of-function). Graded IN_VITRO with quote_role REVIEW_SYNTHESIS, matching how the same review is graded on the adjacent node's channel-biophysics items; the sentence is not quoted anywhere else in the file, so no snippet-grading divergence.

    Validation, each run separately: check_gene_activity_grounding.py --against-ref origin/main now reports only the three pre-existing SCID findings (was 4 findings including SCN4A); just validate 108 snippets / 119 titles / 0 issues; just validate-terms passed; just count-verified-snippets 108/108; just check-entity-refs, check-causal-targets, check-enum-values, check-snippet-grading and validate-disorders all clean; just validate-history-all clean. No cache churn - GO:0005248 was already in cache/go/terms.csv and the molecularfunctionterm enum cache, so only the entry YAML and this record change.

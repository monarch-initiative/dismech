  summary: 'Create: Hyperkalemic Periodic Paralysis'
  details: |
    New entry for hyperkalemic periodic paralysis (MONDO:0008224), closing issue
    #11700 and retiring stubs/Hyperkalemic_Periodic_Paralysis.yaml.

    References were derived entirely by independent PubMed search (NCBI
    E-utilities esearch/esummary, then `just fetch-reference` for each
    candidate). No deep-research report exists for this disease and none was
    fabricated. Twelve references are cited: eleven newly fetched
    (PMID:20301669 GeneReviews, PMID:39174253 and PMID:25880512 Cannon's two
    mechanism reviews, PMID:26865514 the HYP HOP randomized trial,
    PMID:34129236 its long-term extension, PMID:36628799 HEK293T patch clamp of
    a novel allele, PMID:21708955 the M1592V knock-in mouse, PMID:26256659
    whole-body muscle MRI, PMID:23473731 acetazolamide on permanent weakness,
    PMID:30931713 the PMC/HyperPP overlap families, PMID:36796140 UK
    prevalence) plus PMID:29125635, already in references_cache from the
    hypokalemic periodic paralysis entry, and clinicaltrials:NCT00494507.
    Nothing was cited that had not been fetched and read.

    Mechanism. The pathograph is built around the counterintuitive step, that
    weakness comes from depolarization-induced inexcitability rather than from
    reduced excitatory drive: SCN4A gain-of-function missense variant ->
    impaired Nav1.4 inactivation with a persistent inward current -> sustained
    sarcolemmal depolarization -> depolarization-induced channel inactivation
    and fibre inexcitability -> episodic flaccid weakness. The potassium loop is
    modelled honestly as a genuine cycle rather than flattened into a chain:
    sustained depolarization -> membrane hyperexcitability and myotonic
    discharges -> potassium efflux and extracellular potassium accumulation ->
    back to sustained depolarization. Each of those three edges carries its own
    quote. A parallel branch runs from the same persistent current through
    resting intracellular sodium overload to the chronic progressive myopathy;
    that last edge is marked INDIRECT_UNKNOWN_INTERMEDIATES with a note saying
    why, since no cited source traces the intervening steps.

    Slot discipline for gain of function. The variant's consequence is recorded
    once, in GeneticContext.functional_impact_category on the variant node. The
    pathway activity state is recorded separately as
    molecular_functions[].modifier: GAIN_OF_FUNCTION on the Nav1.4
    voltage-gated sodium channel activity descriptor, because the claim there is
    that the channel is operating outside its normal inactivation constraints
    rather than merely conducting more current than usual. The two co-occur on
    different nodes and make different claims.

    Evidence grading. Channel biophysics is graded IN_VITRO (HEK293T patch
    clamp, patient intercostal fibres, and expression-study syntheses), fibre
    simulations COMPUTATIONAL, mouse and horse work MODEL_ORGANISM, and clinical
    review statements HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS. quote_role
    BACKGROUND marks introduction sentences in the mouse paper that state human
    findings. No human phenotype rests on model-organism or in-vitro evidence
    alone. Dichlorphenamide carries a SUPPORT/REFUTE pair because the pivotal
    trial's hyperkalemic substudy was not significant and its authors say it
    lacked the precision to decide either way; recording only the FDA approval
    would have overstated the evidence.

    Modules. No conformance was declared. `just list-modules` was reviewed and
    four candidates were rejected on stated grounds:
    cardiac_ion_channel_repolarization (scoped to inherited arrhythmia in
    structurally normal hearts, per CLAUDE.md);
    nociceptor_sodium_channel_excitability (mechanistically the closest analogue
    -- persistent Nav current, depolarization, conduction block -- but its
    description scopes it to nociceptor-enriched SCN9A/SCN10A/SCN11A and
    hereditary pain, and every node is named "Nociceptor");
    neuromuscular_transmission_failure (the endplate safety factor, not the
    sarcolemma); xenobiotic_cardiac_channel_perturbation and
    epilepsy_excitation_inhibition_imbalance (wrong tissue). The sibling
    Hypokalemic_Periodic_Paralysis entry declares no conforms_to either. A
    skeletal-muscle-excitability module covering the HyperPP/PMC/myotonia
    congenita cluster would be a reasonable future addition.

    Ontology bindings. Every CURIE was looked up in the same step it was
    written. hgnc:10591 SCN4A was verified in both directions (`runoak -i
    sqlite:obo:hgnc search "l^SCN4A"` -> hgnc:10591, and `runoak -i
    sqlite:obo:hgnc info hgnc:10591` -> SCN4A) and agrees with the existing
    binding on the hypokalemic entry. MONDO:0008224 and the four differential
    MONDO terms were confirmed live against ols:mondo. HP:0003752 Episodic
    flaccid weakness, HP:6000833 Hyperkalemia while symptomatic (whose HPO
    definition names this disease), HP:0009073 Progressive proximal muscle
    weakness and HP:0004889 were selected after OLS searches rather than
    reusing the coarser HP:0001324 the sibling entries use. Two negative-
    existence claims are recorded with the queries run: HPO has no paramyotonia
    term, and NCIT has no compound-muscle-action-potential or long-exercise-test
    term, so those bindings are a broader HP term with the specificity in
    preferred_term, and no term at all respectively. NCIT:C88502 Nerve
    Conduction Velocity Test was rejected on positive grounds (it names
    conduction velocity, not amplitude decrement). CHEBI:2549 albuterol was
    chosen over CHEBI:8746 (R)-salbutamol because the drug is racemic and
    "Salbutamol" is a synonym of CHEBI:2549; this matches four existing KB
    entries.

    Sibling entries read before writing: Thomsen_and_Becker_disease (which
    already listed MONDO:0008224 as a differential),
    Hypokalemic_Periodic_Paralysis, and Andersen-Tawil_Syndrome. All three are
    curated as reciprocal differentials here, with the clinically consequential
    distinctions spelled out: ictal potassium direction and opposite diuretic
    choice against HypoPP, chloride rather than sodium conductance and absence
    of dyskalemic attacks against myotonia congenita, and multisystem
    involvement against Andersen-Tawil. Paramyotonia congenita has no dismech
    entry; it is curated as a differential against MONDO:0008195 with an
    explicit statement that it is allelic with HyperPP at SCN4A and on one
    continuum, plus a note flagging that a future entry would duplicate most of
    this pathophysiology and the lump-or-split call should be deliberate.

    Validation, each run separately and all passing: just validate; just
    count-verified-snippets (100/100); just validate-terms; just
    validate-disorders (schema + terms + references, batched); just
    check-duplicate-keys; just check-entity-refs; just check-causal-targets;
    just check-qualifier-terms; just check-enum-values; just
    check-environmental-evidence; just check-folded-hyphens (one finding, a
    line-final "potassium-" in a differential feature, fixed by reflowing the
    line rather than by editing text); just check-snippet-length; just
    check-title-snippets; just check-snippet-grading; just
    check-reference-titles; just check-coarse-phenotypes; just check-genereviews
    (GeneReviews chapter present and tagged); just list-gene-term-mismatches (3
    bindings, 0 findings); just list-disconnected-phenotypes (6/6 phenotypes
    causally connected after adding the Paramyotonia edge); just
    validate-history-all. No baseline file was updated.

    Not done: no datasets block (no disease-relevant accession was verified);
    no has_subtypes, because the field treats HyperPP as one entity and the
    PMC/normokalemic variants are neighbouring diagnoses rather than subtypes;
    no biochemical block, since serum potassium is modelled as a phenotype and a
    diagnostic test rather than as a biomarker with reference ranges.

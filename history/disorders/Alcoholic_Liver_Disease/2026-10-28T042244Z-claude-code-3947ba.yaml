  summary: Add transient elastography fibrosis-stage bands
  details: |
    Added a LOINC:77615-3 measurement and a reference range with fibrosis-stage interpretation bands to the transient elastography diagnosis row, using the pooled cut-offs (7.0/9.0/12.1/18.6 kPa for F>=1/F>=2/F>=3/F4) from the Nguyen-Khac 2018 individual patient data meta-analysis (PMID:29983372). The notes record that AST and bilirubin raise the cut-offs; the study's adjusted cut-offs are not recorded. The MSKCC FibroScan patient-education page was the lead, not the source.

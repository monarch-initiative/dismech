  details: |
    Extended discussion#gap_baijiu_nonethanol_active_constituent_and_mediation and experiment#exp_baijiu_fraction_gnotobiotic_pathway_mediation in kb/disorders/Alcoholic_Liver_Disease.yaml per issue #7394, promoting findings from a follow-on assessment of the OpenScientist Baijiu/ALD hypothesis report (#7324). Added 4 new PMIDs (32810440, 40738110, 39661730, 41606891) as PARTIAL/MODEL_ORGANISM discussion evidence, each framed as external plausibility or a competing mechanism rather than direct support for the microbiota-lactate hypothesis. Extended the rationale to distinguish the D-lactate portal-vein route (non-ALD sepsis/MAFLD models) from the ALD-specific ethyl lactate/SIRT1-FGF21 constituent route and the deoxycholic-acid/bile-acid barrier route, explicitly avoiding conflation of D-lactate, L-lactate, ethyl lactate, and deoxycholic acid/deoxycholate (vs. the unrelated drug dichloroacetate). Extended the proposed experiment: added chiral D-/L-lactate measurement to the existing lactate-tracing perturbation and readout, added two new perturbation arms (ethyl lactate/SIRT1-FGF21 pathway testing; deoxycholate-dependent barrier testing) with matching controls and readouts, and extended decision_criterion with ethyl-lactate/SIRT1-FGF21 and deoxycholate-barrier model branches. Verified new CHEBI (16004, 16651, 78321, 28834) and GO (0008543) terms via OAK; kept mechanistic_hypothesis status EMERGING; did not create a duplicate discussion. All 4 new PMIDs fetched via just fetch-reference (no hand-edited cache). just validate, just validate-terms, and just count-verified-snippets all pass (75/76 snippets verified, 1 pre-existing skip-by-prefix unrelated to this change).

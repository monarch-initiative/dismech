  summary: 'Review response: correct AhR and lactate experiment targets'
  details: |
    Correction to the earlier session in this PR, following review feedback on monarch-initiative/dismech#10583.

    Two problems with the first repair of exp_baijiu_fraction_gnotobiotic_pathway_mediation. First, both AhR items were retargeted to pathophysiology#Intestinal Barrier Dysfunction and Endotoxin Translocation, which contradicts the readout's own description: it tests 'a causal microbial-metabolite route independently of lactate and endotoxin'. Both now target pathophysiology#Kupffer-Cell and Hepatocyte Inflammatory Injury, the node that route bears on and one of the discussion's own anchors. Second, the 'Species-resolved microbial lactate flux' readout was left pointing at a different node from the perturbation it is paired with; it now targets pathophysiology#Lipotoxic and Oxidative Hepatocyte Stress, matching 'Stable-isotope lactate tracing and lactate add-back'.

    The earlier record's claim that the GO identity was retained in each item's biological_processes descriptor was true only for lactate (GO:0019249, present on both lactate items). It was false for AhR: GO has no aryl-hydrocarbon-receptor signalling-pathway term (a search returns GO:0017162, a molecular function, plus three receptor-complex terms, and neither ExperimentalPerturbation nor ExperimentalReadout has a molecular_functions slot), and CHEBI has no FICZ entry. The concept is now carried where the schema allows: the perturbation gained a genes descriptor for AHR (hgnc:348), which is what that arm perturbs since it crosses arms with Ahr-deficient recipients, and the readout keeps its AhR reporter assay descriptor. The earlier record is left as written, per append-only.

    Verified with linkml-validate, linkml-term-validator, check_entity_refs.py, check_causal_targets.py, check_duplicate_yaml_keys.py and check_enum_values.py.

  summary: 'Review: Alcohol-Associated Liver Disease'
  details: |
    Rebuilt the sparse ALD record as an evidence-bounded, connected pathophysiology model. Updated nonstigmatizing display terminology while preserving the MONDO label and historical synonyms; separated alcohol-associated hepatitis as an acute-on-chronic branch rather than an obligatory stage; added canonical and emerging mechanistic hypotheses, six connected phenotypes, PNPLA3 susceptibility, modeled global prevalence, progression, diagnosis, three stage-specific treatments, and corrected GEO GSE236382 metadata. Generated new reference caches only with just fetch-reference. Independent scientific and schema/ontology reviews found no remaining release blockers. Validation included LinkML schema and term labels, 63/63 exact evidence-snippet matches against a complete 23-reference catalog, 100% recommended-field compliance, complete phenotype and gene connectivity, and a 21-node/24-edge acyclic graph with no orphans or isolates. Focused code regressions passed 36 tests, and the whole-KB suite passed all 12,987 tests.

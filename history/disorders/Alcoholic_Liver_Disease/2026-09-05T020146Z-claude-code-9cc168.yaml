  summary: 'Integrate assessed OpenScientist findings: Baijiu-extract microbiota-lactate
    model'
  details: |
    Reviewed the OpenScientist report for hypothesis baijiu_extract_microbiota_lactate_mediation_model against the two existing assessment sidecars (openscientist-assessment-by-codex.yaml, openscientist-assessment-by-openai-5-pro.yaml; both WEAKLY_SUPPORTED_UNRESOLVED). No new sidecar was written. Integrated the two QUALIFIED claims whose citations were not yet in the entry, both into the existing gap_baijiu_nonethanol_active_constituent_and_mediation discussion. (a) cross-disease-lactylation-bookend: added PMID:41329453 (lactate-H4K16la-PDK4 feedback loop, diet-induced MAFLD), PMID:42499162 (MCT1-dependent Arid1a K391 non-histone lactylation, hepatocyte-specific knockout) and PMID:41479511 (review stating histone lactylation has not been directly demonstrated in alcoholic steatohepatitis), plus rationale prose recording that the terminal lactate-to-injury edge is causally shown only in MAFLD/MASH models with intrahepatic glycolytic lactate and is an open ALD-specific gap. (b) lactate-identity-and-source: added PMID:29025729 (live-cell NADH/NAD+ imaging showing ethanol raises the hepatocyte cytosolic ratio and LDH substrates move it), grounding the previously uncited prose that a hepatic redox or lactate signal may be hepatocyte-intrinsic rather than gut-derived. Added one readout, Hepatic histone and non-histone lactylation, to exp_baijiu_fraction_gnotobiotic_pathway_mediation so the ASH lactylation gap is testable within the existing experiment. Deliberately not changed: hypothesis status stays EMERGING (both assessments and the report agree no change is warranted); no new pathophysiology node or causal edge was added, since every REJECTED claim (checked absence of gut-to-liver lactate evidence, Ligilactobacillus refutation, reversed FMT direction, severe-ALD lactate mechanism, no-safe-dose universality, the GO:0140838 and GO:0140986 mappings) was either wrong or already correctly curated; the report's competing routes (LPS/TLR4, tryptophan/AhR, CYP2E1, NOX4, ethyl lactate, bile acids) and PMIDs 32810440, 40738110, 27890791, 41543328, 41137971, 33004548, 39661730, 41606891 were already present in the entry.

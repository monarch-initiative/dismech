  details: |
    Knowledge-gap discussion review: four perturbation/readout targets in exp_baijiu_fraction_gnotobiotic_pathway_mediation held GO process labels ('lactate biosynthetic process', 'aryl hydrocarbon receptor signaling') rather than a <kind>#<name> entity reference, so they resolved to no node and no check reported them. Both arms are microbiota-mediated routes tested against the intestinal barrier, and the discussion already anchors there, so each was retargeted to pathophysiology#Intestinal Barrier Dysfunction and Endotoxin Translocation. This is a curator judgment rather than a mechanical re-prefixing: the GO identity is retained in the items' own biological_processes descriptors. Verified with linkml-validate, check_entity_refs.py, check_causal_targets.py, check_duplicate_yaml_keys.py and check_enum_values.py.

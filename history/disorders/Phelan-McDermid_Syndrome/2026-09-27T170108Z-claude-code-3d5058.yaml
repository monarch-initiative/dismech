  summary: 'Genetics pass (d2g series-068): bind the PMS MONDO children and wire SHANK3'
  details: |
    Genetics-gap issue 12275. MONDO gives Phelan-McDermid syndrome exactly two children; both are now bound as has_subtypes rows: 22q13.3 deletion to MONDO:0971068 and SHANK3 point mutation to MONDO:0971069, each with SHANK3 (hgnc:14294) in genes. Added the same descriptor to the SHANK3 haploinsufficiency pathophysiology node, taking gene wiring from 0/1 to 1/1 as measured by gene_mechanism_wiring_coverage. The Ring chromosome 22 row is deliberately left without a subtype_term; a review_notes entry records that MONDO:0015438 ring chromosome 22 exists but is filed under chromosome 22 disorder and ring chromosome disorder rather than under PMS, so binding it is a lump-and-split question rather than an omission. check-genereviews reported the GeneReviews chapter PMID:20301377 as an uncited candidate; it was fetched, tagged, and cited twice on the Ring chromosome 22 row for the NF2-related schwannomatosis risk specific to that mechanism and for the three-mechanism diagnostic criteria. validate-disorders over the 13 changed files reported 898/898 snippets verified and 0 issues.

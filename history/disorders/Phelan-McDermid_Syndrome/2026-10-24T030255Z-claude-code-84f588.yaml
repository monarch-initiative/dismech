  summary: 'Review round: restore the genetics pass a bad merge resolution dropped'
  details: |
    Review round on PR 13029. A merge of main into this branch resolved the content conflict on this entry by taking main's side, which deleted the whole genetics pass recorded in the 2026-09-27 session above. Restored here: the subtype_term bindings MONDO:0971068 on the 22q13.3 deletion row and MONDO:0971069 on the SHANK3 point mutation row, SHANK3 (hgnc:14294) in genes on all three has_subtypes rows and on the SHANK3 haploinsufficiency pathophysiology node, the GO:0098919 structural constituent of postsynaptic density binding on that node, the second GeneReviews evidence item on the Ring chromosome 22 row, and that row's review_notes. Everything main added is kept.

    Main's Ring chromosome 22 description attributed the NF2-related schwannomatosis risk to somatic loss or instability of the ring chromosome. That clause is removed. Its only citation is PMID:20301377, whose cached record states the risk and the NF2 surveillance schedule but not a mechanism: somatic and instability do not occur in that record at all, and mosaic occurs only for a parent mosaic for a 22q13.3 deletion. The row's review_notes records that search so the absence is not re-asserted without one. The description instead carries the karyotype-screening requirement, which the same chapter does state and which is what separates this mechanism from a terminal deletion in practice.

    The MONDO claims in review_notes were re-checked against OLS before being restored: MONDO:0011652 has exactly two children, MONDO:0971068 and MONDO:0971069; MONDO:0015438 ring chromosome 22 has parents MONDO:0700026 and MONDO:0700091, and its equivalence axiom defines it through RO:0004030 on chromosome 22 rather than through a causal gene, which the note now states in those terms.

    Measured after the restore with dismech.qc_plugins: gene-to-mechanism wiring 1/1 against 0/1 on origin/main; phenotype inlink 9/9, unchanged. just count-verified-snippets over both entries in this round reports 117/117.

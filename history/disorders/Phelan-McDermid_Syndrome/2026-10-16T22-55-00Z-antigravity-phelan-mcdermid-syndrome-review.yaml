    summary: Reviewed Phelan-McDermid Syndrome and added missing clinical, epidemiological, diagnostic, and therapeutic annotations
    details: >-
      Conducted a comprehensive review of Phelan-McDermid_Syndrome.yaml against
      cached literature and the dismech schema. Confirmed that existing subtypes,
      inheritance, pathophysiology graph (5 nodes), and phenotypes (9 entries)
      were accurately grounded in verbatim snippets. Enhanced the entry by
      adding Harrison's chapter classifications (GENETICS_ENVIRONMENT_DISEASE,
      NEUROLOGIC), prevalence estimates (documented case count from PMID:22670140
      and >=0.5% point prevalence in ASD cohorts from PMID:25685306), three
      age-stratified progression phases (neonatal/infantile presentation,
      childhood/adult clinical evolution, and adolescent/adult neuropsychiatric
      decompensation), frequency (HP_0040281, 97% in PMID:12920066) on Neonatal
      hypotonia, structured ClinGen Definitive gene_disease_validity on SHANK3,
      ontology bindings (NCIT), modalities, and target_mechanisms/target_phenotypes
      on all four treatments, a 3-entry diagnosis block (chromosomal microarray,
      SHANK3 sequence analysis, and karyotyping/FISH), a 4-entry
      differential_diagnoses block (Angelman syndrome, velocardiofacial
      syndrome, fragile X syndrome, and FG syndrome), and the top-level
      references index covering all 14 cited references. Removed the trailing
      empty datasets key.

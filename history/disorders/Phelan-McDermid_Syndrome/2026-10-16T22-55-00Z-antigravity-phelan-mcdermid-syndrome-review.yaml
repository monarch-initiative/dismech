  summary: Reviewed Phelan-McDermid Syndrome and added missing clinical, epidemiological, diagnostic,
    therapeutic, and GeneReviews annotations
  details: Conducted a comprehensive review of Phelan-McDermid_Syndrome.yaml against cached literature
    (including the GeneReviews chapter PMID:20301377) and the dismech schema. Added top-level synonyms
    (22q13.3 deletion syndrome, Phelan-McDermid syndrome, SHANK3-related Phelan-McDermid syndrome), Harrison's
    chapter classifications (GENETICS_ENVIRONMENT_DISEASE, NEUROLOGIC), prevalence records without non-existent
    subtype foreign keys (documented case count from PMID:22670140 and >=0.5% conditional case fraction
    in ASD cohorts from PMID:25685306 with measure_type UNKNOWN), three age-stratified progression phases,
    GeneReviews evidence on Ring chromosome 22 NF2 risk, inheritance, core phenotypes, and diagnosis,
    structured ClinGen Definitive gene_disease_validity on SHANK3, specific NCIT treatment bindings (Speech
    Language Therapy NCIT:C159273, Behavioral Intervention NCIT:C15184, Anticonvulsant Therapy NCIT:C64172,
    Pharmacotherapy NCIT:C15986 with Mecasermin NCIT:C2262 therapeutic_agent, and a MONITORING surveillance
    entry), direct Synapsin1+/Homer1+ and PSD95+ puncta rescue snippets from PMID:24132240 on the IGF-1
    structural-deficit target_mechanisms link, a 4-entry diagnosis block with specific NCIT procedure
    bindings (Array-based Comparative Genomic Hybridization NCIT:C198497, DNA Sequencing NCIT:C153598,
    Karyotyping NCIT:C16768, and Fluorescence In Situ Hybridization NCIT:C17563), a 4-entry differential_diagnoses
    block (Angelman syndrome, velocardiofacial syndrome, fragile X syndrome, and FG syndrome 1), and the
    top-level references index covering all 15 cited references. Removed the trailing empty datasets key.

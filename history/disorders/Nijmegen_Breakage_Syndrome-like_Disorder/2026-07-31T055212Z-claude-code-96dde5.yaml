  summary: 'Create: Nijmegen Breakage Syndrome-like Disorder [RAD50 deficiency]'
  details: |
    De-novo curation of Nijmegen breakage syndrome-like disorder [NBSLD, RAD50 deficiency; MONDO:0013118, OMIM:613078, ORPHA:240760], distinct from the existing NBN-related Nijmegen_breakage_syndrome entry [MONDO:0009623].

    Deep research: the requested falcon provider failed with HTTP 402 - the Edison API key has no credits - so two alternative providers were used: claude_code [research/Nijmegen_Breakage_Syndrome-like_Disorder-deep-research-claude_code.md; 18 web searches over 32 turns] and openscientist [research/Nijmegen_Breakage_Syndrome-like_Disorder-deep-research-openscientist.md]. Both reports were treated as leads only. NEC preflight passed: both centre on RAD50 and OMIM:613078, matching the MONDO:0013118 RO:0004003 HGNC:9816 gene relation confirmed with OAK. The openscientist report asserted MONDO:0013415, which is wrong; the OAK-verified MONDO:0013118 was used instead.

    Content curated: two subtypes - classic NBSLD without immunodeficiency, and NBSLD with bone marrow failure and B-cell immunodeficiency; an eight-node pathophysiology chain running from RAD50 loss-of-function through failure of MRN damage-focus formation and DSB sensing, impaired ATM activation, impaired end resection and homologous recombination, checkpoint failure with radioresistant DNA synthesis, chromosomal instability and radiosensitivity, genotoxic stress in proliferating progenitor pools, to bone marrow failure; 17 HPO-bound phenotypes; the RAD50 gene record plus six variant records covering the reported allelic spectrum; three diagnostic modalities; four treatments including a heavily hedged growth-hormone entry; three differential diagnoses - NBS, ATLD and ataxia-telangiectasia; one EMERGING mechanistic hypothesis on allele-dependent retention of MRN sub-functions; and three discussions - a KNOWLEDGE_GAP on unresolved cancer risk, a HUMAN_MODEL_MISMATCH on Rad50 S/S mouse fidelity, and an INTERPRETATION on heterozygous-carrier breast-cancer risk.

    No GeneReviews chapter exists for RAD50/NBSLD. PubMed searches for RAD50 GeneReviews and for Nijmegen breakage syndrome-like GeneReviews returned no results, so the GeneReviews phenotype baseline was unavailable and the entry was built directly from primary case reports. The NBS GeneReviews chapter [PMID:20301355] is cited only as the authoritative source for the differential diagnosis and is deliberately left untagged.

    Self-review before PR: an independent red-team pass using the dismech-pr-review skill was run and its findings acted on. The most significant fix was the Immunodeficiency phenotype, which had been curated unscoped with a REFUTE evidence item - inverting the disorder's defining feature for any consumer that reads the phenotype list without inspecting the supports field. It is now scoped to the marrow-failure subtype with SUPPORT-only evidence, and the absence of immunodeficiency in classic NBSLD is recorded on the subtype, the differential and the phenotype notes instead. Also fixed: a pathophysiology node whose name asserted complex-assembly failure that its own evidence refuted [renamed to damage-focus formation]; 19 evidence items reclassified from HUMAN_CLINICAL to IN_VITRO because they quote patient-derived fibroblast assays rather than clinical observations; an unjustifiable FREQUENT band removed from Mild intellectual disability and a derived-count justification added for the Short stature band; the murine basis of the RAD50-lethality inference hedged and its evidence attached; a breast-cancer carrier-risk item moved out of the causal genetic record into a scoped discussion; and a non-supporting evidence item removed from the genetic-counseling treatment per the curation SOP.

    Known follow-up, deliberately not done here: six Orphanet-listed features [mild spasticity, non-progressive ataxia, hyperopia, multiple pigmented nevi, widely spaced nipples, clinodactyly] remain uncurated. They are quotable via the repo ORPHA structured source, but just refresh-orphadata fails with a checksum mismatch against the pinned data/orphadata/MANIFEST.yaml [upstream en_product1.xml has drifted], and re-pinning it would regenerate all 8,823 ORPHA cache files - out of scope for a single-disorder curation. Recorded in the entry notes.

    Validation: just validate passes for schema, term and reference validation, and 1682 targeted tests in tests/test_data.py pass. All 98 evidence snippets were additionally verified programmatically as exact whitespace- and unicode-normalised substrings of their cached abstracts, and all downstream/subtype/attaches_to/target_mechanisms foreign keys were confirmed to resolve. Compliance 89.1 percent global, 89.3 percent weighted.

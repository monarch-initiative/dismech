  summary: 'Review: connect 20 orphan phenotypes in RAD50 deficiency (IUIS Table 9)'
  details: |
    Twenty of twenty-eight phenotypes had no incoming causal edge.

    Six haematologic findings - aplastic anaemia, anaemia, thrombocytopenia, neutrophil and total lymphocyte counts, and immunodeficiency - attach to Bone marrow failure and B-lymphocyte deficiency. Immunodeficiency is curated as its own phenotype rather than left implicit in the cell counts, because it is what places the disease in the IUIS classification at all.

    Fourteen growth, craniofacial, skeletal, ocular and ectodermal findings attach to Genotoxic stress in proliferating progenitor pools, and the description is explicit about how weak that basis is: proliferating progenitor pools include neural crest and cranial mesenchyme, so a replication-stress account is available, but no cited source traces a route from RAD50 loss to any individual malformation. Every one is INDIRECT_UNKNOWN_INTERMEDIATES.

    One thing checked rather than assumed: nail dysplasia, oral leukoplakia and premature dental loss are dyskeratosis-congenita features and looked out of place in a RAD50 disorder. They trace to a genuine patient report of a coiled-coil RAD50 variant, so the overlap is real and reported rather than a curation error. The edges say so, and say that it is a single report rather than a general feature. 115/115 snippets verify.

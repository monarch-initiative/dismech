  summary: 'Review round 1: add diagnosis block (PR #11369)'
  details: |
    Addresses the ai4c-reviewer REQUEST_CHANGES verdict on PR #11369. Added a top-level diagnosis: block with two records - Molecular Diagnosis by Exome Sequencing (NCIT:C101295) and Diagnostic Ophthalmologic Evaluation (NCIT:C38060) - and moved the PMID:35656379 gene-panel snippet ('we strongly suggest to include LRRC32 in gene panels targeted for diagnosis of patients with cleft palate') out of the Genetic Counseling treatment, where it was a diagnostic-testing claim filed as a counseling claim, into the molecular diagnosis record. The Genetic Counseling treatment now carries a counseling-specific snippet about sibling carrier testing instead of being left unevidenced. Four new evidence items, all exact quotes from references already cached by this PR; no new references_cache files and no new ontology term rows were needed (NCIT:C101295 and NCIT:C38060 were already in cache/ncit/terms.csv). Also took reviewer suggestion 1 (tags: [GeneReviews] on PMID:20301479, the Stickler chapter cited as a differential). Declined suggestion 2 (speech and feeding therapy as treatments) and suggestion 4 (a progression: block) with reasons recorded in notes: neither can be sourced from the four-patient literature without borrowing generic cleft-care evidence or phasing a single follow-up interval. Suggestion 3 (CL:0000066 for palatal medial edge epithelium) needed no change per the reviewer. Validation after the change: just validate passed with 74/74 snippets verified (was 70/70); check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading all clean.

  details: |
    New Disease entry for cleft palate, proliferative retinopathy, and developmental delay (CPPRDD, MONDO:0033641, OMIM:619074), an ultra-rare autosomal recessive LRRC32/GARP syndrome. LUMP/SPLIT: DISEASE. The stub recorded one causal gene and no MONDO descendants; OLS confirmed MONDO:0033641 is a leaf with an equivalentTo OMIM:619074 xref and the CPPRDD synonym, so it is a single Mendelian entity, not a grouping. DEEP RESEARCH: falcon was requested but the Edison account returned HTTP 402 (out of credits) on two attempts; the run was re-launched with --fallback and openscientist produced the report (research/Cleft_Palate_Proliferative_Retinopathy_And_Developmental_Delay-deep-research-openscientist.md, fell_back: true, requested_provider: falcon). Report reference_validation 8/8 verified, confabulation_rate 0.0, needs_review true solely because PMID:35898500 (a GARP/Treg immuno-oncology review) was flagged off topic; nothing under unresolved_references. term_validation 20/22 resolved with 2 mislabelled (HP:0000175 and HP:0001999 named generically), 2 unverifiable Taxon prefixes; no CURIE was copied from the report - every ontology binding here was looked up independently through OLS. just preflight-dr returned WARN because SMAD2 is mentioned at 41 percent of LRRC32's rate; SMAD2 is the downstream effector in the curated mechanism, not a second disease, and the report's OMIM and gene identity match MONDO, so the WARN was resolved rather than acted on. NAMED ENTITY CONFUSION: LRRC32/GARP carries a large regulatory T cell and tumour-immunology literature that is about the same protein and not about this disease. The three Treg/cancer papers the report cited (PMID:35898500, PMID:36928178, PMID:39288764) and the two acquired-PVR RPE EMT papers (PMID:40466854, PMID:42285191) are deliberately not cited in the entry. The Treg cell-biology work that IS cited (PMID:19651619 Tran 2009, PMID:30361387 Lienart 2018) is graded IN_VITRO and used only for the GARP-latent-TGF-beta tethering and integrin-activation steps, never as human disease evidence. CONTENT: a seven-node causal chain - GARP loss of function, failure of latent TGF-beta tethering at the cell surface, deficient local TGF-beta activation, then three arms (reduced SMAD2 phosphorylation in palatal medial edge epithelium to failure of palatal shelf fusion to cleft palate; disordered vitreoretinal development to vitreoretinopathy; impaired CNS development to global developmental delay). The palatal arm is DIRECT and mouse-demonstrated; the retinal and CNS arms are INDIRECT_UNKNOWN_INTERMEDIATES because the sources themselves hedge. 16 phenotypes with HP bindings, genetic block with both published alleles and genetic_context LOSS_OF_FUNCTION/HOMOZYGOUS/GERMLINE, structured prevalence (CASES_IN_LITERATURE, ULTRA_RARE, four published patients), five treatments (palatoplasty, argon laser photocoagulation, serial ophthalmologic surveillance, developmental support, genetic counselling), three differential diagnoses (Stickler syndrome, familial exudative vitreoretinopathy, retinopathy of prematurity), and four discussions. ANIMAL MODEL: the Garp knockout mouse (PMID:28912269) with three modeled_mechanisms - RECAPITULATES the palatal signalling node (two readouts) and the fusion failure, and FAILS_TO_RECAPITULATE disordered vitreoretinal development, with limitations recording that 24-hour neonatal lethality censors the observation. That negative is paired with a HUMAN_MODEL_MISMATCH discussion that also records the reverse half of the mismatch - the mouse null dies and the patients do not. SCOPE DECISIONS. Cardiomyopathy is NOT curated: the fourth patient's dilated cardiomyopathy is attributed by the authors to a second recessive disease, primary carnitine deficiency from homozygous SLC22A5 p.Glu452Lys, and it responded to carnitine. His reduced cerebral white matter volume is likewise excluded as confounded by a documented grade I intraventricular haemorrhage of prematurity. No conforms_to: norrin_fzd4_retinal_vascular_development scopes itself to Norrin-FZD4 lesions, aortopathy_tgfbeta_dysregulation models INCREASED aortic TGF-beta, and pharyngeal_arch_patterning_serial_homology models a neural-crest arch-patterning cleft rather than a medial-edge-epithelium fusion failure; all three rejections are recorded in notes. gnomAD constraint metrics supplied by the report are deliberately not curated - they were not independently checked and this repository has no reference-cache path for a gnomAD record. No GeneReviews chapter exists for this disease (PubMed search returned nothing); the Stickler syndrome GeneReviews chapter PMID:20301479 is cited for the differential only and is not tagged as this entry's GeneReviews baseline. No Orphanet record and no ClinGen validity assertion for LRRC32 were found in the local structured cache. VALIDATION: just validate passed (schema, terms, references); just validate-disorders (the batched --no-full-text sweep CI runs) passed with 70/70 snippets verified; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values all OK on the file; whole-KB check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence and check-reference-titles all OK; normalize-cache, check-term-cache-integrity and check-cache-order clean. Weighted compliance 90.6 percent. Every references_cache file was produced by just fetch-reference; none was hand-written.

  summary: Remove target_phenotypes from the MONITORING surveillance action
  details: |
    Fixes a merge-queue build failure. The PR was approved and enqueued; the merge group tests the branch against current main, and main has since gained check_non_therapeutic_actions_do_not_use_treatment_targets, which this entry violates.

    Serial Ophthalmologic Surveillance carried action_category MONITORING together with target_phenotypes. The check forbids that pairing, and it is right to: target_phenotypes is a treatment-style link asserting that the action acts on the phenotype, while surveillance observes the vitreoretinopathy rather than treating it. The link overstated what the entry meant.

    Removed the target_phenotypes block. The phenotype under surveillance is still named in the treatment description and in treatment_term.preferred_term, and the evidence item quoting the interval-detected vitreoretinal traction is untouched, so no information about what is being watched is lost. Added a notes paragraph recording the reasoning and naming the check, so the absent slot is not later read as an oversight and re-added.

    Blast radius: because merge groups are cumulative, this one file failed the merge-group build for PR 11399, PR 11403 and PR 11413 as well - they were queued behind PR 11369 and inherited its failure. None of those three has a defect of its own.

    I scanned every branch in this batch for the same MONITORING/SCREENING/DIAGNOSTIC/COUNSELING_INFORMATIONAL plus target-slot pattern; this was the only instance.

    Validation: the previously failing test now passes (pytest -k Cleft_Palate_Proliferative: 2 passed). just validate-disorders passes, 74/74 snippets verified, unchanged. check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values clean. No cache change.

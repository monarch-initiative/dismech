  details: |
    Backfill for issue #8085. Only one of this entry's three exposures was linked. Dietary Protein is EXACERBATES with DIRECT into the systemic BCAA and BCKA accumulation node: dietary protein supplies the branched-chain amino acids a deficient dehydrogenase complex cannot clear, so intake adds directly to the accumulating pool, but the accumulation follows from the enzyme defect and would occur on any intake, so diet sets its height rather than its existence. The evidence is therapeutic inversion, that dietary restriction of branched-chain amino acids is the primary treatment, and the explanation says so rather than implying a measurement of intake against plasma levels. Catabolic Stress and Fever were deliberately left unlinked. Their currently cited snippets do not name either exposure: one states only that the disease presents with episodic decompensation, the other describes a treatment mixture. The full text of the decompensation study does define metabolic stress in terms of infection, injury, and fasting, but that passage is broken by PDF hyphenation across the words, so no honest exact quote can be taken from it. Rather than hang a causal claim on a sentence that names neither fever nor catabolism, both exposures were left for a later pass with a properly cited source. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 116 of 123 with 7 pre-existing DOI-prefix skips.

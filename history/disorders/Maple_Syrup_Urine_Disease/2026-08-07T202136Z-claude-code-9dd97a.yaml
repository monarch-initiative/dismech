  summary: Link dietary protein to branched-chain amino acid accumulation
  details: |
    Backfill for issue #8085. Only one of this entry's three exposures was linked. Dietary Protein is EXACERBATES with DIRECT into the systemic BCAA and BCKA accumulation node: dietary protein supplies the branched-chain amino acids a deficient dehydrogenase complex cannot clear, so intake adds directly to the accumulating pool, but the accumulation follows from the enzyme defect and would occur on any intake, so diet sets its height rather than its existence. The evidence is therapeutic inversion, that dietary restriction of branched-chain amino acids is the primary treatment, and the explanation says so rather than implying a measurement of intake against plasma levels. Catabolic Stress and Fever were deliberately left unlinked. Their currently cited snippets do not name either exposure: one states only that the disease presents with episodic decompensation, the other describes a treatment mixture. The full text of the decompensation study does define metabolic stress in terms of infection, injury, and fasting, but that passage is broken by PDF hyphenation across the words, so no honest exact quote can be taken from it. Rather than hang a causal claim on a sentence that names neither fever nor catabolism, both exposures were left for a later pass with a properly cited source. PR review corrected that on two counts. First, a clean fragment of the hyphen-broken passage does survive whitespace normalisation, namely the study's own definition of metabolic stress naming injury, failure to eat, and psychological stress as factors that lead to BCAA accumulation; the search that concluded otherwise looked for whole bracket-free sentences rather than for a usable fragment. Catabolic Stress is therefore now linked, TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES into the accumulation node, with proteolysis as the named intervening step. Fever remains unlinked because the word infection is the one term in that sentence broken across the PDF line and fever itself never appears in it. Second, the dietary protein link carried no evidence_source and so defaulted to HUMAN_CLINICAL, which is wrong for a mouse and patient-fibroblast study whose quoted sentence is introductory background; it is now tagged OTHER and paired with a GeneReviews item making the same claim from clinical-consensus guidance. Re-review then found the newly added Catabolic Stress link internally contradictory: it was graded TRIGGERS into the same accumulation node that the dietary protein link forty lines earlier grades EXACERBATES, with the stated reasoning that the pool is present from the enzyme defect alone and intake sets its height rather than its existence. Stress-driven proteolysis loads that same pool by the same logic, so the entry was making opposite claims about one node's independence. The link is now EXACERBATES, and its description states the shared reasoning and distinguishes it from the acute decompensation episode downstream, which catabolic stress does start. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 116 of 123 with 7 pre-existing DOI-prefix skips.

  summary: Align Maple syrup urine disease with OMIMPS:248600
  details: |
    The January 2026 series contains BCKDHA-, BCKDHB-, DBT- and PPM1K-related records plus the broader DLD deficiency record OMIM:246900. This entry models the MSUD phenotype, including the PPM1K regulatory form, and discusses a BCKDK-associated biochemical phenotype not separately enumerated in this snapshot. DLD affects other dehydrogenase complexes as well as BCKDH; its full clinical scope is not a subtype of isolated MSUD. RelatedMatch records this overlap without equating all DLD deficiency with MSUD or treating the series as an exhaustive list of regulatory causes. Added the missing PPM1K molecular subtype and a phosphatase-to-BCKDH causal mechanism using the primary patient/fibroblast report PMID:23086801.

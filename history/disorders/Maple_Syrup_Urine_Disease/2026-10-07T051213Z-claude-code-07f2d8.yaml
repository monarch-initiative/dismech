  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Added a Newborn screening (dried blood spot) diagnosis row (the entry had no diagnosis section) with diagnosis_term NCIT:C81178 and three LOINC measurements resolved from the Monarch KG: LOINC:53152-5 Alloisoleucine+Isoleucine+Leucine+Hydroxyproline [Moles/volume] in DBS (total leucine, Xle), LOINC:47799-2 Valine [Moles/volume] in DBS and LOINC:94572-5 Alloisoleucine [Moles/volume] in DBS (second tier). Reference ranges: Xle and valine cut-offs of 400 umol/L from the Dutch programme 2007-2017 (PMID:32685353, verbatim: referral if both total leucine (Xle) and valine >=400 umol/L blood), recorded as a joint rule. No alloisoleucine cut-off recorded: the cited second-tier method paper PMID:18178665 states none in its abstract. The single-analyte leucine DBS code and the Xle/Phe ratio were deliberately not bound (flow-injection MS/MS does not resolve leucine; the ratio was proposed, not used). Added loinc_term on the Plasma Leucine, Plasma Valine and Alloisoleucine markers using the Serum or Plasma codes (LOINC:20649-0, 20661-5, 22670-4) because those markers are explicitly plasma, not DBS. Validation: just validate, count-verified-snippets 139/139, validate-terms, loinc-seed-cache, validate-disorders over the batch.

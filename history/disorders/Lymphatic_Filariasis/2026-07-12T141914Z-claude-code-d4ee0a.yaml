  details: |
    Manual claim-vs-evidence review. All snippets verified as exact substrings. Dropped the lymphedema/hydrocele/elephantiasis frequency bands (the snippets list these as primary chronic manifestations but give no frequency among the mostly-subclinical infected population; hydrocele is actually the most common chronic manifestation in bancroftian LF males, so any low band would also mislead). Fixed the Elephantiasis phenotype preferred_term (was 'Lymphedema', now 'Elephantiasis', keeping HP:0001004). Added diethylcarbamazine (CHEBI:4527) to the MDA treatment's therapeutic_agent list (named in the treatment name and WHO snippet but previously omitted). disease_term left as MONDO:0016075 filariasis (the specific lymphatic-filariasis MONDO term is obsolete); noted the granularity limitation. Wolbachia/doxycycline and other gaps filed in #6309.

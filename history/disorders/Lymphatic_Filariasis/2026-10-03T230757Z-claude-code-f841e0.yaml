  summary: 'Rung-3 review: split lymphatic filariasis by etiologic species'
  details: |
    Applied the rung-3 lump/split test of the infectious-disease granularity ladder (design decisions section 3e, rules R6 to R16) to the three filarial agents the entry already carried as NCBITaxon-bound infectious_agent records.

    Decision: SPLIT. Three has_subtypes rows were added with classification etiologic_species, one per agent. The deciding axes are presentation and transmission. Partono's symposium review of the clinical spectrum (PMID:3297555) separates bancroftian disease, in which the lymphatics of the male genitalia are frequently affected with epididymo-orchitis and hydrocele, from brugian disease, in which adenolymphangitis is inguinal and elephantiasis predominantly involves the leg below the knee. Mak's epidemiology review (PMID:2885159) separates the strata on vector and reservoir: urban Culex quinquefasciatus for W. bancrofti with Anopheles and Aedes carrying rural strains, Mansonia plus Anopheles and Aedes for brugian filariasis, and a subperiodic B. malayi form that is zoonotically transmitted whereas the periodic form is principally a human parasite. The same review gives the case split, more than 90 percent bancroftian against less than 10 percent brugian. Fischer's Alor Island study (PMID:12625936) supplies the B. timori geography and its vector, Anopheles barbirostris, reported as the main and perhaps only local vector.

    subtype_term is omitted on all three rows under rule R12. MONDO carries no species-level filariasis class: runoak against ols:mondo returns only MONDO:0016075 filariasis, which is already this entry's disease_term, and MONDO:1013686 filariasis non-human animal; an OLS descendants query on MONDO:0016075 returns nine classes, none of them a Wuchereria or Brugia disease. The reasoning and the re-runnable query are recorded in the Bancroftian row's review_notes and cross-referenced from the other two. The resulting UNBOUND_SUBTYPE findings are the prescribed R12 outcome, not a gap.

    Nothing else was touched: disease_term, pathophysiology, phenotypes, treatments, the existing agent_life_cycle and the existing transmission block are unchanged, and no progression block was added. Validation: just validate-disorders over the four entries in this tranche reported 248 snippets checked and 0 issues; just check-granularity on this file no longer reports TAXON_LUMP.

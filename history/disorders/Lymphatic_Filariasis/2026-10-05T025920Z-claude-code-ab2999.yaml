  details: |
    Reviewer suggestion from the first round on PR 13501, taken. The two brugian has_subtypes rows were named Brugian malayi and Brugian timori, which read awkwardly as foreign-key names and did not match the M. abscessus and M. kansasii style used in the mycobacterial entry of the same PR. They are now B. malayi and B. timori.

    Subtype name is a foreign-key target, so the rename was checked before being made: a grep over kb, history, docs and projects found the two name: lines and nothing else, and this entry has no subtype: discriminators at all, so nothing pointed at the old strings. The display_name values, which carry the full Brugian filariasis due to Brugia malayi and Brugia timori wording, are unchanged, and that is what renderers show.

    Nothing else on this entry changed: the three rows' descriptions, review_notes, evidence and geography are as the parent PR left them, and the Bancroftian row keeps its name because it is not a binomial abbreviation. Validation: just validate on this file reported 0 issues; pytest tests/test_data.py for this entry passes, with the expected advisory warning that the three subtypes carry no subtype_term, which is the prescribed rule R12 outcome; check-granularity still reports no TAXON_LUMP.

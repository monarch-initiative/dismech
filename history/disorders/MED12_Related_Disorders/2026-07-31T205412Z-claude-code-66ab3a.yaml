  summary: Create standalone MED12-Related Disorders entry with allelic series
  details: |
    Created a standalone MED12-Related Disorders entry modeling the MED12 X-linked
    allelic series as subtypes: FG syndrome type 1 / Opitz-Kaveggia (MONDO:0010590,
    p.R961W), Lujan syndrome (MONDO:0010655, p.N1007S), X-linked Ohdo/Maat-Kievit-Brunner
    (MONDO:0010477), female-specific Hardikar syndrome (MONDO:0012997), and a female
    syndromic NDD. Shared pathophysiology captures the GLI3/Sonic-Hedgehog mechanism
    uniting the FG and Lujan alleles (PMID:23091001) plus core FG phenotypes. Genetic
    section splits male hemizygous missense from female de novo loss-of-function.
    Grounded to MONDO:0100000. All 22 evidence snippets verified as exact substrings of
    fetched abstracts; schema/term/reference validation passes; disease name unique.
    Complements the MED12 subtype in the grouping entry.

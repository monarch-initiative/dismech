  summary: 'Create: PRKACA-Related Cardioacrofacial Dysplasia (CAFD1)'
  details: |
    Curated CAFD1 (MONDO:0030876) de novo from a Perplexity deep-research report (preflight PASS, canonical gene PRKACA). Mechanism chain: PRKACA gain-of-function (p.Gly137Arg missense; p.Asn290_Ile292del in-frame deletion) weakening PKA catalytic-regulatory subunit binding and raising cAMP sensitivity (GO:0004691 GAIN_OF_FUNCTION) -> inhibition of Hedgehog/smoothened signaling via GLI repressor processing (GO:0007224 DECREASED, demonstrated in NIH 3T3) -> reduced primary ciliation in patient iPSCs (GO:0060271 DECREASED) -> disrupted Hedgehog-dependent developmental patterning (chondrocyte CL:0000138, GO:0002062) producing common atrium (HP:0011565), atrioventricular septal defect (HP:0006695), postaxial polydactyly (HP:0100259), short limbs (HP:0009826), brachydactyly (HP:0001156), dental anomalies (HP:0000164) and nail hypoplasia (HP:0008386). Autosomal dominant (HP:0000006) with de novo and parental/germline mosaicism; parental mosaicism deliberately NOT bound to HP:0001442 per the somatic-mosaicism convention. Two primary sources: Palencia-Campos et al. 2020 (PMID:33058759, founding cohort + functional assays) and Weaver et al. (PMID:42157491, in-frame deletion, iPSC ciliation, full text). All 15 snippets/titles verified; validate-disorders and offline gate sweep pass. No GeneReviews chapter exists (confirmed via bookshelf index).

  details: |
    Addressed PR #16705 review round 1 (CHANGES_REQUESTED). (1) Brachydactyly re-sourced to the ClinGen CGGV assertion quote naming brachydactyly, replacing the generic skeletal-abnormalities snippet. (2) Consumed the under-used Weaver paper (PMID:42157491): added expanded-spectrum single-case phenotypes aortic root dilation (HP:0002616), coronary artery dilatation (HP:0030882), arterial tortuosity (HP:0005116), osteopenia (HP:0000938), neonatal hypotonia (HP:0001319) with no frequency and expanded-spectrum caveats; added a diagnosis section (trio exome/genome sequencing NCIT:C15709; cardiovascular/skeletal surveillance); added treatments (cardiac surgical repair NCIT:C15329, orthopedic correction NCIT:C16186 from Liang PMID:41810204; case-level losartan+aspirin pharmacotherapy from Weaver). Added craniofacial/skeletal phenotypes short stature (HP:0004322, Liang), genu valgum (HP:0002857, ClinGen), narrow chest (HP:0000774, ClinGen), midface retrusion (HP:0011800, ClinGen) to represent the 'facial' component. (3) Corrected the backwards ciliation edge: Reduced Primary Ciliation now hangs off PRKACA Gain-of-Function as a parallel consequence (not downstream of Hedgehog inhibition) with an iPSC-vs-NCC cell-type caveat. Suggestions taken: explanations note the PRKACA/PRKACB cohort pooling (3 of 7 carried PRKACA); node-1 description clarifies the gain is from loss of R-subunit restraint not higher catalysis; variant_origin GERMLINE added; p.Asn290_Ile292del description notes its differing (PDA/PFO, expanded-spectrum) phenotype; ClinGen Moderate recorded under gene_disease_validity (tier copied, not assigned; MONDO-anchor note included). All 32 snippets/titles verified; validate-disorders and offline gate sweep pass.

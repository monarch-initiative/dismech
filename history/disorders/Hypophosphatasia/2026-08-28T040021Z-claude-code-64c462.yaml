  summary: Add TNAP-null and Alpl A116T knock-in mouse models
  details: |
    Curated mouse models from MGI genotype-phenotype annotations on the two MP branches that separate abnormal enzyme/coenzyme LEVEL (MP:0005319, under abnormal homeostasis) from abnormal enzyme/coenzyme ACTIVITY (MP:0005584, under abnormal metabolism). Candidates were selected from MGI_PhenoGenoMP.rpt joined to the MP descendant closures from OLS and to genes already present in dismech, prioritising genes annotated on BOTH branches. Each model was added as an animal_models entry with modeled_mechanisms links to existing pathophysiology nodes, per-link and per-readout evidence, and exact snippets verified against the local reference cache. Two ALPL models were added because MGI annotates them on opposite MP branches: Alpl<tm1Jlm> homozygotes (PMID:9056646) carry decreased circulating alkaline phosphatase LEVEL (MP:0002966), and the Alpl<tm2.1Jlm> A116T heterozygote (PMID:25716980) carries decreased alkaline phosphatase ACTIVITY (MP:0011585). The pair also spans the allelic spectrum: a complete null with skeletal, dental and seizure phenotypes against a human dominant missense allele with 50 percent residual plasma activity, a radiographically normal postcranial skeleton, and a dentoalveolar-only phenotype. The postcranial UNCHANGED readout is recorded explicitly as the reason the skeletal link is PARTIALLY_RECAPITULATES. The seizure link is PARTIALLY_RECAPITULATES because the cited paper does not test the pyridoxal 5'-phosphate mechanism the node names. Validated with just validate and exact-substring checks of all 10 snippets against references_cache.

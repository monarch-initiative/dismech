  summary: Correct tm1Sor lab-code name to Soriano; regrade skeletal readout to SUPPORT
  details: |
    Second review round on PR 10161, superseding one detail of the earlier record in this directory. That record states the tm1Sor skeletal readout is graded REFUTE; this session changed it to SUPPORT. The earlier record is left as written because history is append-only and it describes that session accurately. Two changes were made. First, the model name was corrected from 'Sorrentino line' to 'Soriano line': the name had been written from memory, and MGI_PhenotypicAllele.rpt records Alpl<tm1Sor> (MGI:1857124) as 'targeted mutation 1, Philippe Soriano'. Sor is Soriano's MGI lab code, the same code behind Gt(ROSA)26Sor. The expansion and the accession are now recorded in the model's notes, since the allele string is free text and unvalidated by the stack. Second, the skeletal readout was regraded REFUTE to SUPPORT so the negative results across this PR are graded consistently: a readout's claim is its measurement, the quoted sentence asserts that measurement, and grading it REFUTE was scoring the evidence against the pathophysiology node rather than against the readout. The negative signal is unchanged and is carried by direction UNCHANGED, PARTIALLY_RECAPITULATES, LOW fidelity and the limitations text; the readout explanation now records the reasoning. Validated with just validate-disorders, and the folded-hyphen, snippet-grading and entity-ref gates; all six PMID:7550313 snippets re-confirmed exact after the edit.

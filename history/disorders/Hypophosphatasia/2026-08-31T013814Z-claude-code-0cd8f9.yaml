  summary: Add the Alpl tm1Sor TNAP-null line; cross-reference the B6 mechanism
  details: |
    Review response on PR 10161. The reviewer suggested adding PMID:7550313 (Waymire 1995) to the existing Alpl<tm1Jlm> model to substantiate the pyridoxal 5'-phosphate mechanism behind the seizures. Checking the MGI genotype-phenotype report showed PMID:7550313 is annotated to Alpl<tm1Sor>, an independently derived knockout, not to Alpl<tm1Jlm>, so attaching its evidence to the existing model would have been a cross-allele attribution. Added it instead as a third, separate animal model. The two lines also disagree substantively: tm1Sor is reported to have normal skeletal development while tm1Jlm shows abnormal bone mineralization, so the tm1Sor skeletal link is PARTIALLY_RECAPITULATES at LOW fidelity with an UNCHANGED skeletal readout graded REFUTE, and the discrepancy is recorded in notes rather than resolved. The tm1Sor B6 link is RECAPITULATES with three readouts: serum PLP INCREASED, brain GABA DECREASED, and seizure phenotype RESTORED under pyridoxal. The existing tm1Jlm B6 link stays PARTIALLY_RECAPITULATES and now records in its limitations that the mechanism is established in the sister allele and is not asserted for tm1Jlm on that basis. Also verified all six curated genotype strings against MGI_PhenoGenoMP.rpt, which CI could not reach.

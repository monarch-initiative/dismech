  summary: Fix over-claiming evidence explanations and prevalence class
  details: |
    Acts on findings 2, 3 and 9 of docs/reports/skeletal-dysplasia-claim-evidence-review-2026-07-25.md.

    Four evidence items quoted a truncated fragment and then asserted more than the fragment said (failure to thrive, hypotonia, narrow chest, bowing of the long bones). Each was either re-quoted against the cached abstract to capture the full supporting sentence, or the explanation was narrowed to state exactly what the quote establishes and which record carries the rest of the claim. Added DOI:10.1007/s00223-025-01356-y as a source that names failure to thrive and muscular hypotonia directly. Extended the truncated Hypercalcemia snippet to include the 'high morbidity' clause the explanation relied on.

    Corrected the adult-forms prevalence_class from ABOVE_1_IN_1000 to BAND_1_5_PER_10000: the source range 1:3,100-1:508 (32.3-196.9 per 100,000) straddles the 1-in-1,000 boundary, so no single Orphanet band covers it; the notes now record that explicitly.

    Added edge-level evidence (PMID:26590809) to the previously unevidenced Craniosynostosis downstream edge. Retagged Orphanet frequency-table rows from HUMAN_CLINICAL to OTHER, since a curated ontology frequency row is not itself primary clinical data.

    Validated: schema, reference (snippet-in-abstract) and term validation all pass.

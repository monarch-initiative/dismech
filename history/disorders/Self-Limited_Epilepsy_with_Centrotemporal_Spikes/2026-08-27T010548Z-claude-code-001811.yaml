  summary: Add phenotype evidence and tighten two ictal HPO bindings for SeLECTS
  details: |
    Weekly compliance sweep. All 8 phenotypes had HPO bindings but no evidence (phenotypes[].evidence 0/8). Added 10 evidence items citing PMID:1418488 (Holmes, rolandic epilepsy clinical and EEG features), PMID:32661641 (video-EEG documentation of two rolandic seizures), PMID:32179505 (neuropsychological study of 61 children with BECTS vs 60 controls), plus already-cached PMID:19172991 and PMID:20825490. Also retightened two bindings from generic interictal signs to the ictal HPO terms the descriptions actually name: Speech Arrest and Dysarthria HP:0001260 Dysarthria to HP:0032720 Focal motor seizure with dysarthria/anarthria, and Perioral Paresthesia HP:0003401 Paresthesia to HP:0011163 Focal sensory seizure with somatosensory features. Febrile Seizures deliberately left unevidenced: no source was found reporting antecedent febrile seizures in probands rather than relatives. Verified with just validate, just validate-terms, just validate-disorders, and just count-verified-snippets (18/18 verified).

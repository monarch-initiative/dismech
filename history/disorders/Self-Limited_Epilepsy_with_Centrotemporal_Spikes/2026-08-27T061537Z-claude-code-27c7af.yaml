  summary: 'Compliance: add evidence to all four pathophysiology causal edges'
  details: |
    Weekly compliance sweep, edge-evidence focus. All four pathophysiology downstream causal edges had descriptions but no evidence. Added one or two EvidenceItems to each. Genetic predisposition -> age-dependent perirolandic hyperexcitability cites PMID:20825490, already in the entry, for the neurodevelopmental origin of the trait. Hyperexcitability -> sleep-activated centrotemporal discharges cites PMID:34220477, a thalamocortical neural-mass model, two items graded COMPUTATIONAL. Discharges -> focal rolandic seizures cites PMID:32661641 ictal video-EEG, HUMAN_CLINICAL. Discharges -> transient language and cognitive dysfunction cites PMID:28801973, a 42-sample meta-analysis, graded PARTIAL rather than SUPPORT because that paper argues the deficits are pervasive rather than circumscribed and so cuts against the node's transient framing, and because it does not test causation by the discharges. Fetched PMID:34220477, PMID:32661641 and PMID:28801973 into references_cache. PMID:28734769 was fetched during the search and discarded uncommitted: it is a negative study finding no cognitive effect of abundant sleep spike-wave activity, worth revisiting as a knowledge gap but not support for a causal edge. PMID:35503717, the ILAE 2022 childhood-syndrome classification, was already in references_cache; it was considered and not used because the cached content is abstract-only and carries no sentence specific enough to support an individual edge. All 12 snippets verified; just validate-disorders passes. Weighted compliance 48.6 percent -> 57.1 percent.

  summary: Add ICD-10-CM, ICD-11 Foundation, and NCIT mappings
  details: |
    Weekly compliance sweep, mappings focus. Added icd11f_mappings icd11f:1046279423 and ncit_mappings NCIT:C116538, both taken from MONDO:0007295 cross-references and each carrying a consistency assertion; both use the older 'benign'/'rolandic' designation for the syndrome the ILAE now calls self-limited, so exactMatch is on the concept rather than the string. Added icd10cm_mappings ICD10CM:G40.0 as a broadMatch: ICD-10-CM has no dedicated code, and the G40.0 category carries 'Benign childhood epilepsy with centrotemporal EEG spikes' as an inclusion term while also covering other idiopathic focal epilepsies. All CURIEs and labels verified with OAK. Validated with 'just validate'; 7/7 snippets verified against cached references.

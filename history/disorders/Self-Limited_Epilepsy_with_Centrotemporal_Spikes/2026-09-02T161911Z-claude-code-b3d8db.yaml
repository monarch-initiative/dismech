  summary: Evidence the eight new causal edges; reverse the compliance regression
  details: |
    PR Shepherd fix pass on the CHANGES_REQUESTED review. The blocking item was that all eight new downstream edges carried a description but no evidence, so a weekly-compliance PR lowered weighted compliance from 46.4 to 43.0 percent. Added evidence to all eight, drawn from four newly fetched references: PMID:9637591 (Wirrell 1998 syndrome review) for focal onset, perioral paresthesia, dysarthria, drooling and secondary generalization, and for the centrotemporal EEG signature; PMID:32661641 (ictal video-EEG of two rolandic seizures) as direct ictal corroboration of paresthesia, speech arrest and drooling; PMID:34039076 (Colombian rolandic cohort) for febrile seizures as a personal antecedent in 20 percent; PMID:15721962 and PMID:21937281 for the language and learning edge. Weighted compliance is now 59.3 percent, and pathophysiology downstream evidence is 8 of 12 - the remaining four are pre-existing edges outside this PR's scope. The language edge description was corrected: PMID:15721962 found deficits persisting in children already in remission, so the edge no longer claims improvement with remission. Also carried the GRIN2A caveat onto the gene descriptor per the reviewer's suggestion, since a pathograph edge or KGX export strips the surrounding node prose. Validated with just validate, just validate-terms, just count-verified-snippets (19/19) and just check-duplicate-keys.

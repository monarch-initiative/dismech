  summary: 'Review round: cite the defining EEG sign, close the NREM gap, migrate
    five PARTIAL items, resolve the conflict with main'
  details: |
    Review round on PR #9156. One blocking item from the review, plus two things
    that arrived on main after the branch was cut.

    1. The blocking item: the syndrome's defining sign was uncited, and the quote
    that closes it was already in this PR's own cache. Partly overtaken by events -
    merging main brought in two evidence items on the `Centrotemporal Spikes on
    EEG` phenotype (PMID:19172991, PMID:1418488) that main had added
    independently. Added the cohort quote the review named anyway, because it says
    something the other two do not: "All subjects had centrotemporal spikes
    observed on EEG" is 60 of 60 in a prospectively enrolled cohort, which is what
    makes the finding definitional rather than merely frequent.

    Also closed the gap the entry declared on itself. The
    `Sleep-Activated Centrotemporal Epileptiform Discharges` node said its non-REM
    claim "still needs its own quantitative source"; PMID:31645314 describes
    abundant spikes during NREM sleep in the same cohort, and that cache file was
    already in the branch.

    2. `supports: PARTIAL` no longer exists. #7439 retired it after this branch was
    written, so all five PARTIAL items here would have failed
    `just check-enum-values` on merge. They did not all migrate the same way, which
    is the point of the narrowing - PARTIAL had been carrying three different
    meanings in this one file:

    - Two are inference-step support, now `SUPPORT` + `directness: INDIRECT`: the
      functional-basis item (absence of a structural lesion, from which the
      functional mechanism follows) and the cortical-reorganization item (fMRI
      measures atypical lateralization; that it compensates is the authors'
      reading).
    - Three are actually contradicting the claim they sit under, now `REFUTE`: the
      post-diagnosis neuropsychiatric item cuts against the *transient* qualifier
      on that node; the ASM item contradicts the treatment description's claim that
      standard medications "are effective" (29 of 42 treated children still had
      seizures); and the Welsh primary-care item reports an incidence an order of
      magnitude below the rate its own prevalence record encodes.

    All five explanations were reworded to argue for the new grade rather than
    naming the retired one. Marking the three as REFUTE is a stronger statement
    than PARTIAL was, and it is the honest one - each was already described in its
    own explanation as a challenge to, or in tension with, the claim it annotates.
    None was dropped; a curated entry should carry the evidence against it.

    3. Merge conflict with main. main had independently backfilled evidence on the
    same three phenotypes from different papers (PMID:1418488, PMID:20825490,
    PMID:32179505) than this branch used (PMID:31645314, PMID:39361977). All three
    hunks are additive on both sides with no disagreement about the underlying
    claim, so each was resolved as a union - every evidence item from both sides is
    retained. Merge commit, not a rebase.

    Validation after resolution: `just validate` passed with 42/42 snippets
    verified against cached references (24 before the merge); `just validate-terms`,
    `just check-enum-values`, `just check-duplicate-keys`, `just check-entity-refs`
    and `just check-causal-targets` all passed; `just check-snippet-grading` reports
    nothing for this file. The merge result differs from origin/main by exactly the
    files this PR owns.

    Not addressed, and left for the author: the review's optional suggestions 2-5
    (the uncited PMID:17105467 cache, two Introduction-sourced quotes where the
    Results are stronger, the ANNUAL_INCIDENCE record whose evidence states a
    proportion rather than a rate, and the `OTHER`-vs-`HUMAN_CLINICAL` grading of
    the PMID:22946717 narrative review). Suggestion 4 is now partly self-documenting,
    since the dissenting incidence item on that record is graded REFUTE.

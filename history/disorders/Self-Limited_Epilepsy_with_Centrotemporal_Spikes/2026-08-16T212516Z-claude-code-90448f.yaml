  details: |
    Weekly compliance pass focused on pathograph connectivity.

    Problem: the SeLECTS mechanism chain ran from polygenic predisposition through
    age-dependent perirolandic hyperexcitability to sleep-activated centrotemporal
    discharges and two consequence nodes, but no causal edge reached a phenotype
    (0/8 on phenotypes[].causal_inlink). Separately, both susceptibility genes (ELP4,
    GRIN2A) floated as isolated genetic nodes (0/2 gene-to-mechanism wiring), because
    the predisposition node named them only in prose.

    Change (phenotype wiring):
      - Focal Sensorimotor (Rolandic) Seizures -> Focal-Onset Seizures, Perioral
        Paresthesia, Speech Arrest and Dysarthria, Hypersalivation (Drooling),
        Bilateral Tonic-Clonic Seizures (all DIRECT; the ictal semiology follows from
        perirolandic somatosensory and oropharyngeal motor involvement, and the
        bilateral tonic-clonic seizure from propagation)
      - Sleep-Activated Centrotemporal Epileptiform Discharges -> Centrotemporal Spikes
        on EEG (DIRECT; the phenotype is the scalp expression of the discharge)
      - Transient Language and Cognitive Dysfunction -> Language and Learning
        Difficulties (DIRECT)
      - Genetic Predisposition to Cortical Hyperexcitability -> Febrile Seizures
        (INDIRECT_UNKNOWN_INTERMEDIATES). Febrile seizures precede the epilepsy in a
        minority, so they are wired from the shared inherited susceptibility rather
        than from the centrotemporal discharges; the edge description says so
        explicitly.

    Change (gene wiring): added a genes: descriptor list (ELP4 hgnc:1171, GRIN2A
    hgnc:4585) to the Genetic Predisposition to Cortical Hyperexcitability node. Both
    CURIEs are copied verbatim from the file's own genetic[] entries, so no new term
    lookup was introduced. Both genes keep relationship_type: SUSCEPTIBILITY; the
    GRIN2A prose caveat (variants cluster at the severe epilepsy-aphasia end and are
    essentially absent from classic SeLECTS) is unchanged and still qualifies the link.

    No new ontology terms, evidence items, or PMIDs.

    Validation: just validate passed (schema + terms + references; "Snippets checked:
    7/7 verified against cached references"). Phenotype connectivity 0/8 -> 8/8;
    gene-to-mechanism wiring 0/2 -> 2/2.

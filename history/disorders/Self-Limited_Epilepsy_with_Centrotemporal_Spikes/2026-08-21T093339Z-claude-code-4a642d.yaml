  summary: 'Compliance: cite pathophysiology, phenotypes, prevalence and treatments'
  details: |
    Weekly compliance sweep. Weighted compliance 48.6%. Every ontology term was
    already bound (cell types and phenotype terms both 100%), so the whole gap was
    evidence: pathophysiology[].evidence 1/6, phenotypes[].evidence 0/8,
    prevalence[].evidence 0/1, treatments[].evidence 0/2.

    Added 16 evidence items across 5 pathophysiology nodes, 3 phenotypes, the
    prevalence record and both treatments. Five new references were fetched
    (PMID:31645314 Connecticut prospective cohort, PMID:39361977 Welsh primary-care
    population study, PMID:22946717 benign childhood focal epilepsies review,
    PMID:23297860 language-fMRI study, PMID:17105467 neuropsychology review).

    PMID:31645314 carries most of the load: it is a prospective community cohort of
    60 children followed a mean of 16 years from diagnosis to resolution, with
    sibling controls, and its full text is in the reference cache. It supplies the
    remission claim, the seizure-count distribution, the pre-diagnosis
    neuropsychiatric rates, and the nine-year neuropsychological follow-up.

    Four items are PARTIAL, and three of them record genuine tensions with what the
    entry currently asserts rather than merely hedging:

    - The treatment block says standard antiseizure medications "are effective". The
      prospective cohort found more than two-thirds of treated children still had a
      seizure on treatment, and its authors write that CECTS "is not as
      pharmacoresponsive as assumed". That is cited against the claim, not around it.
    - The prevalence record cites 7-21 per 100,000 annual incidence. The Welsh
      primary-care study found 1.1/100,000/year and SeLECTS in only 3% of childhood
      epilepsy - an order of magnitude lower. The authors attribute this to
      under-recording, but the discrepancy is large enough that the recorded rate
      should be read as ascertainment-dependent, and the evidence item says so.
    - The Language and Learning Difficulties phenotype describes the difficulties as
      arising during the active epilepsy period. The cohort measured ADD/ADHD (18.3%)
      and learning difficulties (21.7%) BEFORE diagnosis, which complicates that
      framing. Noted in the explanation rather than silently rewriting the phenotype.
    - The Sleep-Activated Centrotemporal Epileptiform Discharges node is supported
      only for its functional (non-lesional) basis; the non-REM potentiation the node
      asserts still has no quantitative source here, and the explanation says so.

    The Transient Language and Cognitive Dysfunction node is the best-served
    addition: the nine-year normal neuropsychological testing against sibling controls
    supports the "transient" qualifier, which is the harder half of that claim, while
    a second PARTIAL item records that neuropsychiatric diagnoses remain common and a
    third offers the compensatory-reorganization fMRI reading of how both can be true.

    One snippet transcribes a typographical slip in its source ("progress to from
    focal to bilateral tonic-clonic seizures"). It is quoted verbatim as required, and
    the explanation flags it so a later reader does not treat it as a transcription
    error introduced here.

    Validation: `just validate` passed; `just count-verified-snippets` reported 24/24
    snippets verified against cached references; `just validate-terms` passed; all
    five ungated CI gates passed; `just validate-disorders` run as the pre-PR sweep.

    Weighted compliance 48.6% -> 70.8%.

    Remaining gaps: `datasets` empty; `inheritance[].evidence` 0/1;
    `pathophysiology[].downstream[].evidence` 0/4; five phenotypes still uncited
    (centrotemporal spikes on EEG, speech arrest, hypersalivation, perioral
    paresthesia, febrile seizures); and the `discussions[].proposed_experiments[]`
    sub-fields.

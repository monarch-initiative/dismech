  summary: 'Create: Self-Limited Epilepsy with Centrotemporal Spikes'
  details: |
    De-novo curation of self-limited epilepsy with centrotemporal spikes / SeLECTS / benign Rolandic epilepsy (MONDO:0007295), the most common focal epilepsy of childhood, a complex/polygenic self-limiting syndrome. No GeneReviews chapter for classic SeLECTS (the GRIN2A-Related Disorders chapter covers the Mendelian severe end); handled the NEC risk by anchoring on MONDO:0007295 vs the GRIN2A/ELP4 monogenic entities. claude_code deep research. Granular unbundled pathophysiology of the maturational mechanism: genetic predisposition (CTS/ELP4 trait) -> age-dependent perirolandic cortical hyperexcitability -> sleep-activated centrotemporal epileptiform discharges -> focal sensorimotor Rolandic seizures; plus transient language/cognitive dysfunction and age-dependent remission nodes. Two conforms_to links to the epilepsy module. Evidence snippet-verified: 19172991 (Strug, CTS->11p13/ELP4 linkage), 29056244 (GRIN2A at severe EAS end, absent from BECTS), 20825490 (11p13 dyspraxia pleiotropy). Prevalence (ANNUAL_INCIDENCE band) included. Discussions: epilepsy-aphasia-spectrum progression, maturational-remission mechanism, and CTS-trait penetrance/language-pleiotropy hypothesis. All snippets confirmed as exact substrings; validation and folded-hyphen pass.

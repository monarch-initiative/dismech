    Residue cleanup after #10083. Two evidence items in this entry carried explanations written around the retired supports: PARTIAL grade. The PMID:34821995 item quoting 'Gene expression analysis demonstrated downregulation of KCNJ2 in both patient's blood cells and cultured skin fibroblasts' sits on a node whose molecular_functions carry inward rectifier potassium channel activity with modifier INCREASED, so the measurement cuts against the node's stated direction; it is regraded REFUTE with directness: INDIRECT, because blood and cultured fibroblasts are not the digit anlagen and the contradiction runs through the inference that accessible tissues report on limb-bud expression. The explanation preserves the original curator's caveat that limb-specific overexpression is not excluded. The second item (de novo 1;17 translocation) stays SUPPORT; only its explanation was rewritten to drop the PARTIAL reference. No snippet text changed.

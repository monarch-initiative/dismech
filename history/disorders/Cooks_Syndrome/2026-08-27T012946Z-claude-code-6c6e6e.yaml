  summary: 'Create: Cooks Syndrome'
  details: |
    ISDS group 18 completeness pass; the entry the group description names as brachydactyly with anonychia [Cooks syndrome, KCNJ2]. The classification note explains why an eponymous syndrome belongs in the isolated rather than the syndromic brachydactyly group: the phenotype is confined to apical digital structures, and anonychia is part of the same apical lesion because nail and terminal phalanx form as one unit. Pathophysiology models the neo-TAD mechanism as a two-node chain - boundary-crossing 17q24.3 duplication, then gene capture with ectopic SOX9-enhancer contact and KCNJ2 misexpression in the digit anlagen - including the negative control that a neo-TAD capturing no gene has no phenotype. NCIT:C17563 was initially used for the diagnosis term and rejected by term validation as a label mismatch; corrected to NCIT:C198497 Array-based Comparative Genomic Hybridization. All 27 snippets verified.

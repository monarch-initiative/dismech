  summary: 'Review: wire pathograph, add 2022 translocation case'
  details: |
    Final-pass review. Phenotype causal connectivity was 0/4, now 5/5. Added middle-phalangeal aplasia/hypoplasia, since the radiographic lesion in the Chinese family extended one joint further proximally than the classic apical-structures description implies. Incorporated a 2022 Hum Genet report [PMID:34821995] of a de novo 1;17 translocation producing the same phenotype without a duplication, which widens the lesion class, and updates the resolved-family count to six. Recorded honestly that this case showed KCNJ2 *down*-regulation in blood and fibroblasts, tagged PARTIAL with an explanation that those tissues are not the digit anlagen - so it does not contradict limb-specific misexpression, but the direction of the KCNJ2 dysregulation that matters for the limb is not settled. Deliberately did NOT add the craniofacial terms carried by the HPO annotations for OMIM:106995: the molecular-era sources state the phenotype is confined to the digits.

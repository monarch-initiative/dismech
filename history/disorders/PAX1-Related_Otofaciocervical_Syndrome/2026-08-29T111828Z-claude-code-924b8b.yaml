  summary: 'Address review: evidence grading, pathograph-to-phenotype edges, diagnosis'
  details: |
    Review round on PR #10035. The reviewer independently verified the scope
    decision - checking that EYA1-Related_Branchiootorenal_Spectrum.yaml really does
    carry MONDO:0008163 as a differential's disease_term - and agreed with it, so
    the split stands unchanged. The blocking items were all content.

    The finding that mattered most was an evidence-grading error of mine. Two
    evidence items quoted PMID:28657137's sentence "The mouse model strongly
    supports the hypothesis that PAX1 depletion in our patients caused thymus
    aplasia responsible for SCID" and graded it HUMAN_CLINICAL. The sentence says
    what it is. Both are now MODEL_ORGANISM. That regrade exposed the real problem:
    it was the only evidence on the Thymic Aplasia or Hypoplasia phenotype, so a
    human phenotype would have rested entirely on model-organism evidence, which the
    evidence SOP forbids. Added two human evidence items from PMID:37689091, one of
    which also names the epithelial differentiation defect.

    Structural fix: no downstream edge anywhere in the entry targeted a phenotypes#
    node, so the twelve phenotypes sat beside the pathograph rather than at the end
    of it, and the central causal story - thymic stromal failure to SCID - was never
    drawn. Added edges from the pharyngeal pouch node to thymic aplasia, primary
    hypoparathyroidism and congenital heart defect; from the T cell development node
    to SCID and recurrent infections; and from the sclerotome node to vertebral
    anomalies and scapular winging. The cardiac and scapular edges are
    INDIRECT_UNKNOWN_INTERMEDIATES with PARTIAL evidence, because co-occurrence in a
    developmental field is not the same as a demonstrated route.

    Added a diagnosis section built on the newborn TREC screening path
    (PMID:32431714, PMID:33815417). This is the clinically decisive half of the
    entry's own argument: because the corrective therapy is thymus transplantation
    rather than HSCT, and because post-transplant mortality is driven by infections
    acquired before transplant, early detection changes outcome rather than merely
    label.

    Added the branchial defects phenotype - "cervical" is in the disease name and
    the supporting sentence was already quoted in the file - plus short stature, and
    made the hearing phenotype conductive-specific (HP:0000405) on a source that
    says so, keeping the generic quote as PARTIAL.

    Differentials now carry disease_term bindings, including MONDO:0008163 on the
    EYA1 differential, which makes the scoping decision machine-visible rather than
    prose-only. Added CHARGE syndrome and FOXN1/Nude SCID as the closest athymia
    mimics, and oculo-auriculo-vertebral syndrome as the monoallelic PAX1 boundary
    of this entry - which also supplies the citation for an OAVS claim that notes
    had previously asserted uncited.

    Smaller corrections following the reviewer: genetic_context carrying
    functional_impact_category on the molecular node; the iPSC model's fidelity
    lowered HIGH to MODERATE to match its own limitations; Failure of Thymic T Cell
    Development rescaled ORGANISM to CELLULAR since SCID is separately curated as a
    phenotype; a Pax1-deficient mouse added with PARTIALLY_RECAPITULATES against the
    thymic node, because the mouse shows variable hypoplasia rather than aplasia;
    and supportive management of the hypoparathyroidism.

    Validation after the round: just validate-disorders passes, 65/65 snippets
    verified (up from 38), and all ungated checks pass in this worktree.

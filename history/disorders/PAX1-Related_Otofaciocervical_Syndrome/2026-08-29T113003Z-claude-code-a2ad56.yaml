  summary: Use cached reference titles for PMID:32431714 and PMID:33815417
  details: |
    Fixes a CI failure on PR #10035: check_reference_titles flagged nine evidence
    items whose reference_title did not match the cached title for the PMID.

    Two titles were wrong, used across nine items:

      PMID:32431714
        written: Thymic Hypoplasia in Human Syndromes and Animal Models.
        cached:  Molecular Insights Into the Causes of Human Thymic Hypoplasia With
                 Animal Models.

      PMID:33815417
        written: Therapy for Thymic Stromal Cell Defects.
        cached:  Current and Future Therapeutic Approaches for Thymic Stromal Cell
                 Defects.

    Cause: both papers were introduced by the PR review, which referred to them by
    shortened titles. Those shortened forms were carried into the YAML without
    opening the cache files to check. The titles are plausible paraphrases of the
    real ones, which is why they did not look wrong on re-reading - the check caught
    what proofreading would not.

    This is the same failure mode as the false provenance claim recorded against
    Van_Maldergem_Syndrome earlier in this session: accepting a plausible secondary
    statement instead of verifying against the primary artifact. There the secondary
    source was a passing validation run, here it was a reviewer's prose. The
    corrective in both cases is the same - check the artifact that actually carries
    the fact.

    Both titles replaced with the exact cached values. A whole-file audit was then
    run comparing every reference_title against its cache frontmatter across all
    three entries curated in this session, to find any others of the same kind:
    3MC_Syndrome 70/70 correct, Van_Maldergem_Syndrome 70/70 correct,
    PAX1-Related_Otofaciocervical_Syndrome 65/65 correct after this fix. No further
    mismatches exist.

    check_reference_titles has also been added to the per-worktree check loop; it
    was not among the checks listed in CLAUDE.md's ungated-CI section that had been
    run up to this point, which is why the error reached CI rather than being caught
    locally. It now passes in all three worktrees.

    Validation: just validate-disorders passes, 65/65 snippets verified,
    check_reference_titles passes.

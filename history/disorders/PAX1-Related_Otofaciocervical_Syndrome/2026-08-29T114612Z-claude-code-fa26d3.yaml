  summary: Correct a false enum-cache claim and an overstated negative
  details: |
    Corrections following the approving review on PR #10035. The PR was approved;
    these are fixed anyway because two of the three notes are factual errors rather
    than polish.

    1. A false claim about the enum cache, made three times.

    The commit message for 2037b010, the history record at 2026-08-29T113425Z, and a
    PR comment all state that NCIT:C81178 and NCIT:C15709 were not present in
    cache/enums/treatmentactionterm_b7dcb86faf99.csv. They were, at lines 484 and
    180 respectively, and this PR does not modify that file.

    Cause: the check used `grep "^<CURIE>," file`, which requires a trailing comma.
    That CSV has a single `curie` column and no trailing comma, so the pattern could
    never match and the negative result was an artefact of the query rather than a
    fact about the file. The reviewer's original statement was correct and the
    correction issued against it was wrong.

    This is the fourth instance in this session of the same underlying error, and
    the sharpest, because it happened while explicitly correcting someone else on
    the grounds that they had not checked the primary artefact. A grep that returns
    nothing is not evidence of absence until the pattern is known to be capable of
    matching. The earlier three were: a passing validation read as confirming an
    edit landed; a reviewer's shortened paper titles copied without opening the
    cache; and a title copied from this session's own truncated search output.

    The earlier record is left untouched, as history is append-only. This record is
    the correction.

    2. An overstated negative in KB content.

    The p.G166V variant description said the first reported OTFCS2 family "had no
    immunodeficiency". PMID:37924468 records that family's immune status as no data;
    the absence of immunodeficiency from its reported feature list is not a
    documented negative. Reworded to say no immunodeficiency was reported, with the
    distinction stated explicitly, and pointing at the c.1212dup family as the
    documented negative. This matters because the entry's variable-severity claim
    rests on exactly this distinction, so overstating it weakens the claim it was
    meant to support.

    3. An evidence grading that did not fit its own slot.

    The PMID:34362576 item quoting "Currently, there are no approved therapies to
    treat congenital athymia" was graded SUPPORT on the cultured thymus tissue
    treatment. The sentence states clinical stakes and, read literally, says the
    therapy it is attached to is unapproved. Regraded PARTIAL with an explanation
    saying it establishes the need for the therapy rather than its efficacy.

    Validation: just validate-disorders passes, 67/67 snippets verified,
    check-reference-titles passes, exact-match title audit 67/67.

  summary: Bind diagnosis terms, structure PAX1 variants, cite CTT outcome cohort
  details: |
    Non-blocking suggestions from the second review round on PR #10035.

    diagnosis_term bindings added to two of the three diagnosis entries:
    NCIT:C81178 Newborn Screening on the TREC entry and NCIT:C15709 Genetic Testing
    on the exome entry, following the KB convention of binding diagnostic procedures
    to NCIT. The reviewer stated both were already present in
    cache/enums/treatmentactionterm_b7dcb86faf99.csv; they were not, so they were
    resolved against OLS and validated normally. The temporal bone imaging entry is
    left unbound for now.

    The two named PAX1 alleles are moved out of prose into structured Genetic
    variants records: c.497G>T (p.G166V), the hypofunctional paired-box missense
    from the first reported family, and c.1212dup (p.Gly405Argfs*51), a frameshift
    null. Both descriptions record that neither family had immunodeficiency, which
    is the concrete basis for the entry's claim that immune severity is not
    predictable from allele class.

    PMID:34362576 (cultured thymus tissue in 105 children) is now cited on the
    thymus transplantation treatment, in two items. The outcome-cohort item is
    graded PARTIAL because the cohort is congenital athymia of all causes rather
    than PAX1 deficiency specifically, so it establishes the therapy's track record
    rather than its effect in this disease. The second item carries the
    untreated-mortality statement, which is the clinical stakes behind early
    recognition.

    The OAVS differential is deliberately left without a disease_term. The reviewer
    noted the omission was defensible because the entry names an allelic state
    rather than a clean disease concept, and MONDO's nearest candidates
    (craniofacial microsomia, oculoauriculovertebral spectrum with radial defects)
    are each narrower or broader than the monoallelic-PAX1 phenotype being pointed
    at. Binding one would assert an equivalence the source does not make.

    Validation: just validate-disorders passes, 67/67 snippets verified,
    check-reference-titles passes, and a full reference_title-versus-cache audit of
    the file reports 67/67 correct.

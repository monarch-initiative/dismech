  summary: 'Create: PAX1-Related Otofaciocervical Syndrome'
  details: |
    De-novo curation of the PAX1-related form of otofaciocervical syndrome, scoped
    to MONDO:0014254 rather than to the parent term MONDO:0008163 that the claim
    issue named. This departs from the stub, and the departure is the main curation
    decision in this record.

    The stub proposed lumping both numbered otofaciocervical forms into one entry on
    the grounds that both sit on the EYA1-SIX1-PAX1 branchial developmental axis.
    Curating against the literature does not support that packaging. The EYA1 form
    is autosomal dominant, and a 2025 integrated analysis of every published
    EYA1-related case concluded that it and branchiootorenal spectrum disorder
    constitute one diagnostic continuum, notably because all reported EYA1
    otofaciocervical patients had renal anomalies, the criterion previously used to
    separate them. dismech already curates that continuum as
    EYA1-Related_Branchiootorenal_Spectrum.yaml, where MONDO:0008163 is recorded as
    a differential. The PAX1 form is autosomal recessive and adds thymic aplasia and
    a syndromic SCID the EYA1 form does not have. Lumping them would have produced
    one entry carrying two mechanisms with opposite inheritance, which is the
    pattern the curation guidance warns against.

    Mechanism curated as PAX1 loss of transcription factor function, proximately a
    loss of PAX1-mediated canonical Wnt repression, branching into two tissue
    programmes: pharyngeal pouch and thymic epithelial development, leading to
    failed thymic T cell development; and sclerotome-derived skeletal patterning,
    producing the vertebral and shoulder girdle anomalies. The stromal locus of the
    immune defect is recorded because it is therapeutically decisive - reported
    patients failed T cell reconstitution after allogeneic HSCT despite successful
    donor engraftment, while patient CD34+ cells differentiate normally ex vivo.
    HSCT is curated as a treatment evidence item graded REFUTE, and cultured thymus
    tissue transplantation as the corrective therapy that does work.

    Immunological severity is explicitly curated as variable, with a note that SCID
    should not be inferred from a PAX1 genotype alone, since a biallelic truncating
    variant has been reported without immunodeficiency.

    Deep research: one openscientist report,
    research/Otofaciocervical_Syndrome-deep-research-openscientist.md. It reached
    the same two-arm conclusion independently, which corroborates the scope decision
    rather than being its source; the decision was made from primary literature
    before the report returned. Its term validation was read first and two
    suggestions rejected: MONDO:0008159 offered as otofaciocervical type 1, which
    MONDO calls "postmenopausal osteoporosis", and MONDO:0014434 as type 2, which
    MONDO calls "Bardet-Biedl syndrome 5". Its leads did add real content: the
    PAX1-PIASy-TCF7L2 Wnt repression mechanism, primary hypoparathyroidism and
    congenital heart defects as DiGeorge-overlapping features, the ex vivo CD34+
    result, and cultured thymus tissue transplantation. Its relevance checker
    flagged PMID:8558563 as off topic; that paper is the 1995 argument for splitting
    otofaciocervical syndrome from branchiootorenal syndrome and is squarely on
    topic, a reminder that the off-topic list is evidence rather than a verdict. It
    was not cited because it predates the molecular era and its conclusion is
    superseded by PMID:41300719.

    Validation: just validate passes for schema, terms and references, with 38/38
    snippets verified against the local reference cache.

  summary: Correct a one-sided claim about an internally inconsistent source
  details: |
    Review round 4 raised a non-blocking note that the p.G166V variant description made a claim about PMID:37924468 that the paper itself contradicts. Verified against the cached source rather than the review comment: the comparison table (line 74) records Family (1) (Pohl et al. 2013), the p.G166V family, as 'Immunodeficiency ND'; the discussion (line 102) states that 'patients of the other 2 families (n = 6) were reported to be free of SCID with no history of immunodeficiency (Pohl et al. 2013; Patil et al. 2018)'. Both cite the same family. The entry previously asserted only the table reading ('immune status for that family is recorded as no data'), which a reader reaching the discussion would find contradicted. The description now states that the source is internally inconsistent and gives both readings, noting that neither is a documented negative from immune testing and that the c.1212dup family remains the documented negative the variable-severity argument rests on. This is the fifth instance in this session of the same underlying error: asserting something about a source from a partial reading of it. Checks at head: just validate passes, 67/67 snippets verified, check-entity-refs, check-duplicate-keys, check-folded-hyphens, check-snippet-length and check-title-snippets all pass. Only the disorder YAML and this record are staged; references_cache full-text churn produced by the validator's own fetch was reverted.

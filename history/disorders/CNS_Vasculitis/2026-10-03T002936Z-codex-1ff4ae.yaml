  summary: Review primary CNS vasculitis against cohort full texts and guideline evidence
  details: |
    Review of primary CNS angiitis; infectious/environmental secondary disease excluded. Rebased before edits.

    Recovered and used full texts of PMID37903069 (ESO), 26020379 (Mayo163), 40546217 (German163), 40334177 (UCSF26), 39732702 (pediatric histology), 40643487 (NfL), 38732340 (vessel-wall MRI), 27144213 (cultured CSF IL17), 34066885 (complement activation), and 40026305 (metabolomics). Read central methods/results/discussion and limitations, including tables where rendered. Recovered 40494617 (German57) and read abstract/methods and cohort definitions; it corroborates histological heterogeneity but does not justify universal prognosis by pattern. Existing full text 32296382 (CEC) and DOI10.1007/s00415-026-13727-y (Rice/Scolding update) were read. Existing full-text PDF DOI10.1038/s41598-024-55222-2 was audited for ascertainment, methods, SWI counts, discussion and limitations. PMID41947889 was read selectively for clinical/mechanistic synthesis; its incorrect incidence wording and soluble-IL17 interpretation were not imported.

    Read abstracts of the overlapping Mayo series, MMF and rituximab studies, pediatric cognition, long-term quality of life, and PMID41283854 infliximab rescue case. Orphanet140989 structured record fully reviewed; added its omitted manifestations. No GeneReviews chapter. StatPearls identified but not used as a phenotype baseline; full-text access returned a challenge page.

    Access limitations: RNAseq PMID36264136/DOI10.1002/ana.26537 remained abstract-only after fetch attempts. Proteomics PMID31270218 has a free-publication record but the cache fetcher declined full text; PMC returned a challenge, EuropePMC403, REST XML500. Its abstract is used only for measured protein abundance, alongside full-text negative activation study34066885. No invented full-text quotes or manual cache edits. Infliximab41283854 remained abstract-only after fetch. Successfully regenerated source caches are retained; unused challenge/lookup caches removed. Whitespace-only cache churn restored by comparing parsed frontmatter and whitespace-normalized body, preserving substantive full-text upgrades.

    Key adjudications:
    - Local incidence denominator, not a US population survey. Ascertainment and vessel size overlap; prognosis varies across cohorts.
    - Histological wall inflammation, luminal occlusion, ischemic injury and necrotizing wall injury modeled separately, with supported edges. Subtype location and prognostic associations no longer masquerade as causal processes.
    - Transcriptomic pathway/deconvolution associations remain provisional, with no unsupported temporal or causal edge.
    - ABRA may be lymphocytic; distinguish transmural ABRA from perivascular nondestructive CAA-ri. Pediatric histological scoring is internally studied, low-sensitivity and externally unvalidated.
    - SWI microbleeds differ from symptomatic hemorrhagic stroke. Paper's abstract54/56 differs from full-text53/55; use full-text result and expose ascertainment bias.
    - Normal CSF/angiography does not exclude small-vessel disease. MRI vessel-wall data restricted to six primary cases; mixed secondary/infectious cases not pooled as PACNS evidence.
    - IL17 result is from expanded/stimulated CSF-derived cells; soluble CSF IL17 generally undetectable. CEC/NfL candidate biomarkers remain nonspecific/unvalidated for routine monitoring.
    - Complement-protein abundance does not establish activation; negative activation study and unresolved endothelial-localized possibility retained as a knowledge gap. Exploratory metabolomics has no external validation or direct flux measurement; inconsistent ribose directions not imported.
    - Observational treatment confounding explicit; primary UCSF maintenance use replaces mixed-cohort inference, methotrexate added, infliximab documented only as anecdotal rescue use. No extrapolated GCA secukinumab efficacy.
    - Official ClinicalTrials.gov APIv2 records checked: NCT03166319 COMPLETED; BIOVAS NCT05168475 TERMINATED phase2 (funding withdrawn); NCT00659776 TERMINATED phase2 (staff/funding constraints). Broad diagnostic/vasculitis enrollment does not establish PACNS therapeutic efficacy. Registry JSON retained in tmp.
    - Removed25 unrelated bibliography entries (systemic vasculitis genetics, infections, lupus models/therapies, GCA trials). Primary-scope differential discussion retained. No Mendelian PACNS gene or animal model inferred from unrelated diseases or a single HLA-positive case.

    ## Eight-dimension completeness assessment
    1. Phenotypes: adequate after adding visual symptoms, pediatric intellectual disability and all remaining Orphanet rows; frequencies/context separated from selected imaging cohorts.
    2. Subtypes: adequate, overlapping ascertainment/location/histology groups qualified; ABRA distinction clarified. No validated additional disease-specific mapping supplied by research.
    3. Mechanisms: adequate for established vascular injury; exploratory transcriptomic findings provisional, complement and metabolic questions explicit rather than causal overstatement.
    4. Treatments/trials: adequate; induction/maintenance/rescue evidence and study limitations represented, current registry metadata corrected. Unrelated disease trials excluded.
    5. Genetics: N/A to established inherited etiology; no reproducible PACNS locus in the verified sources. Systemic vasculitis GWAS and isolated HLA case nonblocking/outside established genetic claims.
    6. Diagnostics/biomarkers: adequate; historical criteria, biopsy, angiography, MRI, CSF and exploratory NfL/CEC/IL17 covered, with limitations.
    7. References: adequate; high-value primary/full-text sources incorporated and source/title/grading audited. Access limits recorded above.
    8. Overall consumption: substantial disease-specific consumption of both real research reports; unsupported cross-disease extrapolations rejected. No unresolved central quotable omission identified.

    Falcon supplemental tables 00-03 cross-checked. Added gait disturbance, encephalopathic presentation, vasogenic edema and pseudotumoral MRI findings from primary cohorts/guideline evidence. Rejected incorrect HPO suggestions (for example, HP:0002185 is neurofibrillary tangles, not cerebral edema). Two reported PLEX rescue cases are a nonblocking anecdotal lead; no PACNS-specific efficacy estimate supports routine treatment. Updated the node-class example to follow the renamed ischemic injury node.

    Validation: schema/terms/reference validation passed with 137 snippets and 197 titles; all three trial status/phase snapshots match the live registry. Repository QA passed 26 of 28 checks initially; the two findings (coarse constitutional binding and renamed node example) were repaired and their checks passed. Targeted disorder tests and page rendering passed; generated HTML is excluded from the commit. GeneReviews NO_CHAPTER; GSE213907 verified through the reference cache.

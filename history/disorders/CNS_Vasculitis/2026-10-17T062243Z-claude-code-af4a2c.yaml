  details: |
    Added a measurements: list to the 'Cerebrospinal fluid analysis' diagnosis row, binding LOINC:14117-6 (IgG clearance/Albumin clearance [Ratio] in Serum and CSF, the IgG index) and LOINC:26465-5 (Leukocytes [#/volume] in Cerebral spinal fluid); the row's own evidence already quoted a cohort reporting a normal IgG index and normal CSF profile in a minority of patients. Added a measurements: list to the 'Serum and CSF neurofilament light chain' diagnosis row, binding LOINC:101281-4 (Neurofilament light chain [Mass/volume] in Serum or Plasma by Immunoassay) and LOINC:100996-8 (Neurofilament light chain [Mass/volume] in Cerebral spinal fluid), and added a second evidence item from the same cited study (PMID:40643487) quoting its CSF-specific NfL result (median 4914.58 pg/mL in active disease versus 301.19 and 262.83 pg/mL) so the CSF-specimen code has its own specimen-specific grounding rather than relying on the pre-existing serum-specific quote. LOINC:14117-6 and LOINC:101281-4 were newly seeded via just loinc-seed-cache; LOINC:26465-5 and LOINC:100996-8 were already cached. just validate-disorders passed with 0 issues.

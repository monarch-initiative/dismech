  summary: 'Create: Nephrotic Syndrome Type 2'
  details: 'New entry for NPHS2 (podocin) steroid-resistant nephrotic syndrome, MONDO:0010974, claim issue #14496. Deep research: one Perplexity report (sonar-deep-research, reasoning effort medium), research/Nephrotic_Syndrome_Type_2-deep-research-perplexity.md; its 8 PubMed identifiers all resolved. Its numbered inline citations ([1] to [613]) do not correspond to the 51-entry citations sidecar, so only the PMIDs named in the report body were used, plus papers found by PubMed search (Ruf 2004, Weber 2004, Roselli 2004 x2, Huber 2003, Tory 2014, Kerti 2013). Pathophysiology is a five-step chain from biallelic loss of function through ER retention, failed nephrin raft recruitment, slit-diaphragm loss and filtration-barrier failure to glomerulosclerosis; edges inferred only from cell assays are marked INDIRECT_UNKNOWN_INTERMEDIATES. Hypoalbuminemia, edema and hypercholesterolemia are supported only by the definitional framing sentence of Ruf 2004 (quote_role BACKGROUND, directness INDIRECT), since no NPHS2 cohort reports their per-patient frequency. Validation: just validate (50/50 snippets), validate-terms, check-entity-refs, check-causal-targets, check-genereviews all pass. After the first CI run flagged NPHS2 as an ungrounded gene, the entry node gained a molecular function, cholesterol binding (GO:0015485), cited to Huber 2006 (PMID:17079490). Review round 1 (changes requested): added a diagnosis section for molecular genetic testing (GeneReviews; Ruf 2004 testing recommendation), GeneReviews recurrence risk on the inheritance block and the p.Arg229Gln carrier frequency, split the AAV gene-therapy evidence into IN_VITRO and MODEL_ORGANISM items, added cyclosporine A and cyclophosphamide as agents on the refuted immunosuppression treatment and NCIT ACE inhibitor / angiotensin II receptor antagonist on RAAS inhibition (the CHEBI classes are outside the ChemicalEntityTerm enum), evidence on the glomerulosclerosis to FSGS edge, and a note that the cholesterol-binding DECREASED modifier is inferred. GeneReviews snippets elide HTML-linked words with ''...''. Not taken: a mouse-only hypertension phenotype and frequencies for FSGS and kidney failure.

    '

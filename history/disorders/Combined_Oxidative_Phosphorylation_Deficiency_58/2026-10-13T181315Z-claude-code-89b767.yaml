  summary: 'Create: Combined_Oxidative_Phosphorylation_Deficiency_58'
  details: |
    New entry for COXPD58 (MONDO:0957537, TEFM). Curated from the founding series (Van Haute et al. 2023, PMID:36823193; seven patients, five families), a 2025 case report (PMID:40272035), the Indian CMS cohort (PMID:37721175), and TEFM biochemistry and mouse knockout papers (PMID:21278163, 25690892, 31036713). Five-node pathograph: hypomorphic TEFM variants (GO:0003711) -> impaired mitochondrial transcription elongation (GO:0006390) -> combined respiratory chain deficiency -> neuromuscular transmission defect and neuronal mitochondrial dysfunction, wired to 24 HP phenotypes. Salbutamol treatment from a single responder. Zebrafish and conditional mouse models linked. Knowledge gap on whether the NMJ defect is energetic or a direct TEFM role. No GeneReviews, Orphanet or ClinGen record exists. Lump/split: no existing entry or grouping covers TEFM; COXPD entries are separate per-gene entries, so a new DISEASE entry. Validated with just validate, validate-terms, count-verified-snippets (61/61), entity-ref, causal-target, duplicate-key and block-scalar checks.

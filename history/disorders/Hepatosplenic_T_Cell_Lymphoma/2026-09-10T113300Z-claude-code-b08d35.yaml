  summary: 'Pre-PR red-team review round: Hepatosplenic T-cell Lymphoma'
  details: |
    Self-review round before opening the PR, run in a subagent for fresh context per the initiate-new-disorder-creation skill step 7. Corrects the count in the prior record: the tree now verifies 37/37 snippets, not 28/28. Claim-level fixes no gate could catch. (1) The sinusoidal-infiltration node bound CL:0000874 splenic red pulp macrophage in cell_types, asserting participation by a cell none of its three sources mentions; the term was standing in for an anatomical compartment. Replaced with locations bindings UBERON:0001250, UBERON:0001281 and UBERON:0002371. (2) The clonal-expansion node carried GO:0050852 T cell receptor signaling pathway, but both its evidence items report TCR gene rearrangement and receptor protein expression, which are clonality and immunophenotype readouts rather than pathway engagement; annotation removed and the immunophenotype claim moved to a new histopathology section. (3) PMID:27099586 was graded REFUTE against the immunosuppression exposure; it is in fact the source for this entry's own non-necessity clause, so it is now SUPPORT with directness INDIRECT. (4) The isochromosome 7q node asserted primacy as the transforming event, but its cited source reports frequency only and the research report's basis for primacy was the confabulated PMID:9691023; the node is now mechanism_confidence PROVISIONAL with a notes line saying the ordering relative to STAT5B and SETD2 is unevidenced. This matters because that node's SOMATIC variant_origin is what makes it the derived cell of origin. (5) The SETD2 node was evidenced with the 62% chromatin-modifier class frequency under a single-gene title; renamed to Chromatin Modifier Loss of Function with SETD2 bound as exemplar and the class-versus-gene distinction stated. (6) Hepatomegaly carried frequency FREQUENT from a snippet reporting hepatic involvement rather than enlargement; frequency dropped and directness INDIRECT added. (7) Fever was an orphan node with no incoming edge; added a Systemic Inflammatory Response node downstream of the clone, plus a Hemophagocytosis phenotype HP:0012156, both evidenced from PMID:39696449, a 40-case series fetched during this round. That paper also supplied direct fever and thrombocytopenia evidence replacing two inferential B-symptom quotes, and the splenectomy treatment. (8) Added Combination Chemotherapy and Splenectomy treatments; the allo-HCT snippet supported splenectomy more strongly than transplant, so quoting it for transplant alone was a selective read. (9) Added histopathology and classifications sections, and a notes paragraph recording that MONDO:0015760 subsumes this term only because Peripheral_T_Cell_Lymphoma.yaml binds it as an anchoring compromise. (10) preferred_term on both gamma-delta bindings softened from V-delta-1 to cytotoxic gamma-delta T cell, since CL:0000798 is the bound term and the entry declines to treat receptor type as a subtype boundary. Uncited reference caches are deliberately not committed, including the five confabulated papers named in the prior record and two genuine HSTCL papers whose cached Content block is empty. Validation after the round: just validate 37/37 snippets verified, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-environmental-evidence, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens and the batched validate-disorders all pass; check-cancer-origin reports SOMATIC_LESION OK with a single origin CL:0000798.

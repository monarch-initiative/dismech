  summary: 'Address PR review round 1: Hepatosplenic T-cell Lymphoma'
  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED round on PR 11597. All three blocking items were answerable from references_cache/PMID_39696449.md, already committed in this PR, and all three of the reviewer's quoted passages were verified as exact substrings of that cache before acting on them. Blocking 1: leukopenia had been dropped from the cytopenia triad although the already-quoted sentence names all three and the full text gives 7 of 10, making it the most common; added as a phenotype bound to HP:0001882. Blocking 2: added a biochemical section for serum ferritin (HP:0003281) and serum calcium (HP:0002901), both reported at 100% frequency in the index cohort; hyperferritinemia is the laboratory correlate of the Systemic Inflammatory Response node and Hemophagocytosis phenotype added in the previous round, so its absence was a real gap rather than a completeness nit. Blocking 3: the characteristic absence of lymphadenopathy is load-bearing in the description, the infiltration node and the lump/split argument, but PMID:39696449 reports lymph node enlargement in 7 of its 10 index patients. That is now curated as a REFUTE with directness INDIRECT on the histopathology claim, and a Nodal disease paragraph in notes states the tension explicitly. INDIRECT because the same paper writes that lymph node involvement is less common, so the series qualifies rather than overturns the WHO characterisation, and because radiological node enlargement in a systemically inflamed patient is not the same claim as nodal lymphomatous involvement. Non-blocking suggestions taken: anemia was evidenced from a 1994 single case report and is now led by the cohort figure with its explicit haemoglobin threshold, with the case report retained as corroborating detail; added weight loss (HP:0001824); added conforms_to on two nodes after verifying the anchors exist, sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation for the STAT5B node and evading_growth_suppressors#Tumor Suppressor Inactivation for the chromatin-modifier node. EBV was requested and is recorded in notes rather than curated as a claim, because the source is internally inconsistent: its abstract states EBV infection was confirmed in the 10 patients while its body reports 2 of 10 and says the association is confounded by both cases having hemophagocytic syndrome. The body is the accurate statement and the abstract sentence should not be quoted; that discrepancy is documented in notes. Not taken: a diagnosis section, and naming CHOP or platinum induction with a therapeutic_agent on the chemotherapy treatment, both deferred rather than guessed. Validation after this round: just validate 43/43 snippets verified, up from 37; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-environmental-evidence, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens and the batched validate-disorders all pass; check-cancer-origin still reports SOMATIC_LESION OK with single origin CL:0000798.

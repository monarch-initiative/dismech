  summary: 'Create: Hepatosplenic T-cell Lymphoma'
  details: |
    De novo curation of hepatosplenic T-cell lymphoma (MONDO:0019474) as a Disease entry at the histologic-entity level per design decisions 3a. Deep research: falcon was requested but has no API key in this environment, so the run fell back to claude_code with --fallback and the report records fell_back/requested_provider/provider_attempts; the report used is research/Hepatosplenic_T_Cell_Lymphoma-deep-research-claude_code.md. The report's own reference_validation and term_validation both reported needs_review: true. I audited all 17 cached references by title myself and found FIVE confabulated citations, of which the validator flagged only one: PMID:33064823 (actually Contrast-FEL, a phylogenetics methods paper; cited 5 times, and the report's citation table mis-attributes it to Yabe M, whose real paper is PMID:29337025), PMID:9691023 (actually 'Neurex Young Investigator Award winner', cited for isochromosome 7q), PMID:21415416 (actually an NHE3/IL-10 mouse colitis paper, cited for infliximab-induced gamma-delta expansion), PMID:14504095 (actually an IL-18/plasmacytoid dendritic cell paper, cited for post-transplant HSTCL and sinusoidal tropism), and PMID:29257843 (actually a MUTYH/OGG1 colorectal paper, cited for SETD2 and chemoresistance). None of the five is cited in this entry. The validator missed four of them because a record with no abstract cannot be scored off-topic and the rest resolve, so confabulation_rate stayed 0.0. Also corrected two term bindings the report offered: CL:0000875 is non-classical monocyte, not splenic red pulp macrophage (correct term CL:0000874, off by one), and GO:0098533 is an ATPase transmembrane transport complex, not H3K36 trimethylation (used GO:0140955 histone H3K36 trimethyltransferase activity); GO:0016571 is obsolete and was not used; HP:0004325 is Decreased body weight, not Weight loss. Every CURIE in the entry was resolved against OLS or cache/hgnc/terms.csv at the time of writing. Pathophysiology is curated as a causal chain (isochromosome 7q -> clonal gamma-delta expansion; STAT5B gain-of-function and SETD2 loss both feeding the same node; expansion -> sinusoidal infiltration -> organomegaly and cytopenias). Cell of origin is derived, not asserted: the iso7q node carries genetic_context.variant_origin SOMATIC with CL:0000798 bound, and just check-cancer-origin reports SOMATIC_LESION OK with a single origin. Two REFUTE evidence items are deliberate: PMID:27099586 records a complete-capture national series in which no case had anti-TNF exposure, against overstating the drug association, and PMID:33160933 records the null allo-HCT benefit in that cohort. Validation: just validate passes with 28/28 snippets verified; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms all pass.

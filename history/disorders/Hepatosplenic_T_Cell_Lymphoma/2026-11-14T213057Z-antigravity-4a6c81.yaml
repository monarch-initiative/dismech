  summary: Review and enrich Hepatosplenic_T_Cell_Lymphoma
  details: >-
    Audited Hepatosplenic T-Cell Lymphoma (MONDO:0019474) and resolved its gene_activity_grounding baseline defect. Added GO:0001228 (DNA-binding transcription activator activity, RNA polymerase II-specific, modifier GAIN_OF_FUNCTION), SOMATIC genetic_context, and CL:0000798 (gamma-delta T cell) grounding to STAT5B Gain-of-Function Activation. Added SOMATIC genetic_context and CL:0000798 cell-type grounding to Chromatin Modifier Loss of Function, GO:0046630 (gamma-delta T cell proliferation) to Clonal Expansion of Cytotoxic Gamma-Delta T Cells, CL:0000798 to Sinusoidal Infiltration of Spleen, Liver and Bone Marrow, and GO:0006954 (inflammatory response) to Systemic Inflammatory Response. Added variant_origin: SOMATIC to STAT5B and SETD2 genetic entries, ECTO:9001747 (exposure to immunosuppressive agent) to environmental exposure, NCIT:C35983 (Lymphocytic Infiltrate) to histopathology, PMID:29337025 evidence to classifications, a 5-item NCIT-grounded diagnosis section (flow cytometry, immunohistochemistry NCIT:C23020, liver biopsy, cytogenetics, TCR clonality), and normalized PMID:39696449 reference_title strings verbatim.

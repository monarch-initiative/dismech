  summary: 'Create: Rhabdomyolysis Susceptibility To 1 (OBSCN, MONDO:0859371)'
  details: |
    New entry for autosomal recessive OBSCN loss-of-function rhabdomyolysis susceptibility (RHABDO1, OMIM:620235). Literature was gathered from PubMed (the founding Brain 2022 series, four later case reports, and the obscurin-knockout mouse studies), and an OpenScientist deep-research report was run and screened with just preflight-dr. Preflight confirmed the entity but flagged that the report labels OBSCN as HGNC:16542, which is PPIAP2; the entry binds hgnc:15719 from the term cache instead. From the report, the Obscn/Obsl1 double-knockout study (PMID:31098411) and the obscurin missense caution (PMID:33438037) were added; the report's HPO annotations without a citable source (distal weakness, acylcarnitine abnormality) and its unsourced fasting trigger were not taken. The pathograph runs from obscurin loss through sarcoplasmic reticulum disorganization, sarcolemmal fragility and exercise-induced M-band disorganization to myofiber breakdown, conforming to the sarcolemmal_fragility_myofiber_necrosis module at its fragility and necrosis nodes. A HUMAN_MODEL_MISMATCH discussion records that knockout mice do not develop rhabdomyolysis. Validated with just validate, validate-terms, count-verified-snippets (46/46), and the offline KB gates.

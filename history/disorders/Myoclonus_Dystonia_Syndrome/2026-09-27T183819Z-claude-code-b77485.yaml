  summary: 'Genetics pass: add the KCTD17 myoclonic dystonia 26 subtype row'
  details: |
    Genetics pass for the series-069 row MONDO:0014620 myoclonic dystonia 26 (KCTD17).

    Row ruling: has_subtypes row. KCTD17 was already curated at this entry - a genetic:
    record with CAUSATIVE typing, two evidence items, and its own pathophysiology node on
    putaminal expression and endoplasmic-reticulum calcium signalling - but the entry's
    only subtype row was the SGCE one, so the numbered KCTD17 entity was invisible to a
    CURIE search. A KCTD17-related row now binds MONDO:0014620, a direct child of the
    entry's disease_term, with KCTD17 (hgnc:25705).

    The row records the clinical separation as well as the molecular one, because the
    founding report states it explicitly: myoclonus is mild and confined to the upper
    limbs at onset and dystonia spreads from the cranio-cervical region, which the paper
    calls distinct from the usual SGCE phenotype. That is why it is a second row rather
    than a second gene on the existing row.

    Anchor audit: disease_term MONDO:0000903 myoclonus-dystonia syndrome is an exact
    match, and both subtype rows are now inside it. No change.

    Wiring is unchanged and was already complete: 2/2 causal genes wired, 12/12
    phenotypes with a causal inlink, 0 of 8 pathophysiology nodes without an outgoing
    edge.


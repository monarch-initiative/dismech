  summary: 'Genetics pass: SGCE subtype binding, imprinting slot, KCTD17 node'
  details: |
    Genetics pass for the d2g gene-wiring campaign (issue #12203, epic #12189).

    Research first: SGCE is the major locus and KCTD17 the rarer second one. The
    checklist keys only SGCE (MONDO:0008044, myoclonic dystonia 11); that term and
    its SGCE attribution were verified against OLS and the Monarch
    CausalGeneToDiseaseAssociation endpoint. SGCE was already bound and already
    wired to two nodes, and the maternal-imprinting modelling was already correct in
    the `inheritance:` block with GeneReviews PMID:20301587 evidence.

    Changes:
    - Added SGCE as a `genes:` descriptor on the `SGCE-related myoclonus-dystonia`
      subtype row.
    - Populated the structured `parent_of_origin_effect` slot on the autosomal
      dominant inheritance block. The imprinting was described in prose but not in
      the slot built for it.
    - KCTD17 was bound in `genetic:` but reached no node and its only evidence was
      an Orphanet gene-disease row. Added the founding report PMID:25983243 for the
      gene-disease claim and for the clinical distinction from SGCE-related disease,
      and added a `KCTD17 putaminal network and ER calcium-signaling disturbance`
      node marked `mechanism_confidence: HYPOTHETICAL` with an
      INDIRECT_UNKNOWN_INTERMEDIATES edge into `Impaired striatal plasticity`. The
      node records what was actually observed - highest putaminal expression, a
      putamen co-expression network enriched for dystonia genes, and abnormal
      ER-dependent calcium signaling in patient fibroblasts - and cites the authors'
      own statement that further work is needed, rather than asserting a settled
      route.
    - Added `relationship_type: CAUSATIVE` to both gene records.
    - `just tag-references` tagged the already-cited GeneReviews chapter
      PMID:20301587, which `check-genereviews` reported as CITED_UNTAGGED.

    New reference cached: PMID:25983243.

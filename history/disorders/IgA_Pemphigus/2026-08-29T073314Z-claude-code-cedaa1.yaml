  summary: 'Review round 1: address ai4c-reviewer items on PR 10026'
  details: |
    Addressed all five IMPORTANT items and all three suggestions from the automated review of PR 10026.

    Items 1 to 3 were mechanical rebindings against terms already in the committed caches. UBERON:0002027 stratum corneum of epidermis replaced by UBERON:0001003 skin epidermis on both nodes that used it - the claims are about the living epidermis, one of them explicitly about all layers, so binding to the stratum corneum was wrong in a way that would have propagated into anatomical queries. HP:0006775 Multiple myeloma replaced by HP:0020194 IgA heavy chain paraproteinemia, which is the exact match for the 9.5 per cent figure the phenotype quotes; the reviewer's point that the old binding inflated the myeloma frequency roughly two-fold against the seven reported cases is correct. The generic NCIT:C20401 Monoclonal Antibody replaced by NCIT:C65216 Adalimumab and NCIT:C74007 Daratumumab on the two treatments that name a specific drug.

    Item 4, the missing FcalphaRI step. Added a node between IgA deposition and neutrophil recruitment, backed by two freshly fetched references. This is the step that makes the isotype matter: cross-linking CD89 with IgA immune complexes releases leukotriene B4, recruiting further neutrophils in a positive feedback loop that self-terminates against an opsonised organism and does not against a fixed epidermal autoantigen. The node's description states that its evidence is receptor biology from human neutrophils and a linear IgA bullous disease mouse model rather than from IgA pemphigus patients, and that it is graded ESTABLISHED on the strength of the receptor work rather than on a disease-specific experiment. The entry notes say the same.

    Item 5, phenotypes disconnected from the pathograph. Added downstream edges from three nodes into six phenotypes. The one that matters is the edge from the PROVISIONAL adhesion node to Acantholysis, which puts the entry's central uncertainty into the graph rather than leaving it in prose: a PROVISIONAL node reaching a phenotype curated OCCASIONAL whose evidence includes a source denying it occurs at all. Pruritus is reached by an INDIRECT_UNKNOWN_INTERMEDIATES edge, because nothing cited explains how the lesion produces the itch.

    Suggestions taken. Etretinate is now bound alongside isotretinoin on the retinoid treatment, since the SUPPORT evidence there is an etretinate regimen and only isotretinoin was bound. The daratumumab-lenalidomide-dexamethasone regimen's therapeutic_modality changed from MONOCLONAL_ANTIBODY to OTHER, with all three agents bound individually and a note explaining that tagging a three-component regimen by its antibody component misclassifies it. A Haematological Surveillance After Diagnosis entry was added to diagnosis, recording that in most reported IgA myeloma cases the myeloma was diagnosed at the same time as or after the skin disease, so a normal screen at presentation does not close the question.

    The reviewer explicitly endorsed keeping the WRONG_STATEMENT and REFUTE evidence items, and added a fact worth recording: PMID:38751960's own figure legend contradicts its introduction's denial of acantholysis. That strengthens the case for recording the disagreement rather than resolving it.

    Validation after changes. Schema validation passes; 40 of 40 evidence snippets verified, up from 36; term validation, entity-ref and duplicate-key checks pass.

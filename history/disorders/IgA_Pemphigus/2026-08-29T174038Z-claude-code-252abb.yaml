  summary: Regrade the WRONG_STATEMENT item to NO_EVIDENCE
  details: |
    WRONG_STATEMENT was retired by issue #7439. This entry held the only remaining use in the KB, so it had to be regraded by hand: the migration script never migrates that value automatically, because the right direction depends on whether the entry's own text has since been corrected. Unlike the Huntington_Disease case, where WRONG_STATEMENT recorded that the entry's own text was wrong, here the cited sentence contradicts the curated phenotype directly.
    Graded NO_EVIDENCE, not REFUTE, and the choice is the substance of this edit. REFUTE reads better as direction and was what I applied first. It is wrong here because on a phenotypes[] item supports is also a publication decision: SUPPORTS_TO_QUALIFIER maps REFUTE to an HPOA NOT qualifier, so the KB would have asserted that IgA pemphigus does not feature acantholysis -- on the strength of a single 2024 case report that this entry's own explanation argues is not supportable, against three sources describing acantholytic cells or blisters. NO_EVIDENCE falls in DROP_SUPPORTS, so the item, its quote and its reasoning stay visible while nothing is published downstream.
    Correcting a false verification claim in the first version of this record. It said the exporter emitted no NOT row under REFUTE. It does emit one. The check behind that claim was broken: hpoa_rows_for_disorder returns a list of lists, and the filter tested membership of an HP id in a list of dicts, which is always false, so both arms of the comparison returned zero and the false negative was read as a clean result. The reviewer on PR #10083 caught it. Re-verified properly: against origin/main this entry now exports 9 phenotype rows rather than 10, with zero NOT rows, and the single delta is the removal of a positive HP:0100792 row for PMID:38751960 -- main was publishing the denying source as though it supported the phenotype, which was wrong in the other direction.
    Prose sites stating what the entry currently carries were updated alongside the value, since the regrade would otherwise have made them false.

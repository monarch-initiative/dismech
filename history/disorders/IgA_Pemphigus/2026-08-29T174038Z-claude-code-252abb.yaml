  summary: Regrade the WRONG_STATEMENT item to REFUTE
  details: |
    WRONG_STATEMENT was retired by issue #7439. This entry held the only remaining use in the KB. Unlike the Huntington_Disease case, where WRONG_STATEMENT recorded that the entry's own text was wrong, here the cited sentence contradicts the curated phenotype directly, so REFUTE is the accurate direction. The entry's own curation note already treated the two values as the same kind of thing -- it described this item and the retinoid REFUTE item together as sources that contradict the claim they attach to. Checked the HPOA export before committing, because REFUTE maps to a NOT qualifier and could have asserted that IgA pemphigus patients cannot have acantholysis: the exporter emits no NOT row here and the positive Occasional row from the sibling SUPPORT item (PMID:10886149) is unchanged. Three prose sites asserting that the entry carries a WRONG_STATEMENT item were updated in the same commit, since regrading would otherwise have made them false.

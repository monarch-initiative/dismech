  summary: Fix a folded-scalar hyphen split found by a full gate re-run
  details: |
    One folded-scalar hyphen split, found by running the full ungated gate set across all five entries in this curation batch rather than the subset I had been running.

    A line in the adhesion node's description ended in anti-, so the loaded value read anti- desmocollin with a space. Reworded so the compound stays on one line. No reviewer had reached this file's version of the defect; it was found by generalising a fix from the LCA13 entry in the same batch, where the reviewer caught the equivalent problem.

    Recording it because the pattern is the point. check-folded-hyphens, check-snippet-length and check-title-snippets are ungated whole-KB CI steps, specifically so that a kb-only PR cannot skip them, and I had been running only validate, validate-terms, check-entity-refs and check-duplicate-keys after each edit. The defect is invisible in the source file - the YAML reads correctly, and only the loaded scalar is wrong - so nothing but the check finds it.

    Validation after change. Schema validation passes; 40 of 40 evidence snippets verified, unchanged; check-folded-hyphens, check-snippet-length, check-title-snippets, term validation, entity-ref and duplicate-key checks all pass.

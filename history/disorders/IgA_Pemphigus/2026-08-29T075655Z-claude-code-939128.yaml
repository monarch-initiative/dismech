  summary: 'Review round 2: two prose defects on PR 10026'
  details: |
    Two one-line prose corrections from the second review round. No term, snippet or structural change.

    First, the gammopathy phenotype's explanation still described the binding it had before round 1 - it said the HPO term bound here is Multiple myeloma, the nearest available term, fifteen lines below the block where the term had been rebound to HP:0020194. That is the same failure mode as the enum-versus-prose divergence caught on the Papillon-Lefevre entry in this batch: I corrected a structured field and left the prose written to justify the old value. Nothing checks that a term change and the explanation that reasons about it stay in step, and in both cases the stale prose was the more misleading half.

    Second, and more substantively, the PMID:37081893 evidence item on the FcalphaRI node called it independent confirmation from a different group. Both halves are wrong. Van Egmond M is senior author on that paper and on PMID:28736835 - same VU Amsterdam anti-CD89 programme - and the quoted sentence is that paper's introduction citing its own group's prior work, which its wording says outright: previous work of our group showed. The explanation now says so.

    This one is load-bearing rather than cosmetic, and it is worth recording why. The FcalphaRI node is graded ESTABLISHED on evidence that is explicitly not disease-specific: receptor biology in human neutrophils and a linear IgA bullous disease mouse model, applied to IgA pemphigus on the grounds of shared isotype and shared neutrophil-rich histology. How much independent corroboration that evidence carries is the whole basis for the grade, so describing two papers from one lab as two groups inflated it. The grade is left at ESTABLISHED because the underlying receptor biology is not in doubt, but the entry no longer overstates how many independent sources support it.

    There is a generalisable gap here for evidence metadata. Nothing in an evidence item records author or group overlap between references, so two citations from the same laboratory look identical to two from independent groups - and a reader counting supporting items has no way to discount for it. I caught this only because a reviewer read the author lists.

    Validation after changes. Schema validation passes; 40 of 40 evidence snippets verified, unchanged; term validation, entity-ref and duplicate-key checks pass.

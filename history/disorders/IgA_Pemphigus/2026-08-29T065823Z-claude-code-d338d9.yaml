  summary: 'Create: IgA Pemphigus (MONDO:0034127)'
  details: |
    New disorder entry for IgA pemphigus, the pemphigus variant in which the autoantibody isotype is IgA rather than IgG.

    Lump/split decision. Curated as one Disease with two has_subtypes entries, SPD type and IEN type, rather than as two diseases or as a subtype of an existing pemphigus entry. The shared IgA-plus-neutrophil mechanism is what distinguishes the disease from the IgG pemphigus variants already in the KB, and it is shared by both subtypes; what differs between them is the target antigen and the level of the epidermis involved. The decision is recorded as revisitable in a discussion, because published cases keep failing to fit the two-type scheme and one review has proposed replacing it with an IgA pemphigus spectrum.

    Curation inputs. One Perplexity deep-research run, committed alongside, plus independent PubMed E-utilities searching. Its reference_validation block reported 5 of 5 citations resolving with 4 of 5 on topic. Its term_validation block reported zero terms checked, because the report offered no ontology CURIEs at all. That is a different failure from the mislabelled CURIEs the other reports in this batch produced, and it means the clean term-validation result carries no information - worth recording, because a reader skimming for needs_review would see a clean section and conclude the opposite.

    No GeneReviews chapter applies; this is an acquired autoimmune disease.

    Structure. Five pathophysiology nodes: IgA autoantibody production against the keratinocyte cell surface, IgA deposition in the epidermal intercellular space, then two parallel effector branches - impaired desmosomal cell-cell adhesion and neutrophil recruitment into the epidermis - converging on intraepidermal pustule and vesicle formation.

    The grading of those two branches is the substantive curation judgement in this entry. The neutrophil branch is ESTABLISHED; the adhesion branch is PROVISIONAL. Desmocollin 1 is securely established as the SPD-type autoantigen by a clean transfection experiment, but a 2023 review concludes there is no clear evidence that anti-desmocollin autoantibodies are pathogenic, in contrast to the well-established anti-desmoglein ones. The histology points the same way: acantholysis is slight where present, and the dominant finding is neutrophilic. So the alternative reading - that the IgA acts mainly by recruiting neutrophils and the adhesion molecule it binds is a marker rather than the mechanism - is not excluded by anything cited here, and the grading says so.

    Two evidence gradings are unusual and deliberate. The acantholysis phenotype carries a WRONG_STATEMENT item, from a 2024 case report stating flatly that acantholysis is not a feature of IgA pemphigus, which two other cited sources contradict. The retinoid treatment carries a REFUTE item, an isotretinoin-plus-prednisone regimen achieving only a slight effect after six months. Both are kept rather than dropped because in a literature of 137 reported patients across 119 publications, one contradicting source is a meaningful fraction of what is known.

    Two discussions, both KNOWLEDGE_GAP: whether the two-type classification survives the atypical cases, and whether anti-desmocollin antibodies are pathogenic at all.

    A diagnostic point carried in has_subtypes and in differential_diagnoses: SPD-type IgA pemphigus is clinically and histopathologically indistinguishable from classical subcorneal pustular dermatosis, and in the largest cohort all thirteen classical SPD cases were immunologically negative and could not be told apart on any other grounds. Immunofluorescence is the only discriminator.

    Validation. Schema validation passed on the first run; 36 of 36 evidence snippets verified against cached primary references; term validation, duplicate-key, entity-ref and snippet-grading checks all pass. One reference validation warning is environmental rather than a content problem: the validator attempted a full-text download from derm101.com and got a TLS error; the snippet in question verified against the cached abstract.

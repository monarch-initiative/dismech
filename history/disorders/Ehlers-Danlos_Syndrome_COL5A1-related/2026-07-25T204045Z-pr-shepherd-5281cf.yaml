  details: |
    PR #6961 review follow-up (ai4c-reviewer CHANGES_REQUESTED). Added evidence_source: MODEL_ORGANISM to the two remaining unambiguous mouse-model items (PMID:34740257 'mouse model of classic Ehlers-Danlos syndrome'; PMID:28387435 'murine model of classic Ehlers-Danlos syndrome'), which had been falling through to the HUMAN_CLINICAL default alongside the already-tagged PMID:2728341. Also addressed reviewer suggestion 3: the genetic[COL5A1] evidence list left the Frameshift Mutations variant class uncited after the 1989 citation was dropped, so added PMID:16278879 (already present in references_cache/), whose abstract states that roughly one third of classic EDS is caused by a non-functional COL5A1 allele producing haploinsufficiency - the mechanism frameshift/premature-stop variants act through. Snippet verified offline as an exact whitespace-normalised substring of references_cache/PMID_16278879.md; linkml-reference-validator reports 'Total checks: 0' in this environment so it cannot be relied on. linkml-validate passes.

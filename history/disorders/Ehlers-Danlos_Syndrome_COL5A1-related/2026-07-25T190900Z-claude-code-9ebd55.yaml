  summary: 'Review: remove unsupported claims and non-supporting evidence (ECM review)'
  details: |
    Claim-evidence correctness review of ECM disorders. Removed: (1) the Myopia phenotype (frequency OCCASIONAL) and its Connective Tissue Fragility -> Myopia causal edge - its only two evidence items were a PARTIAL whose explanation stated the paper does not mention myopia and a NO_EVIDENCE feline case report, leaving a frequency-banded phenotype with zero support. (2) PMID:2683783 from genetic > COL5A1, a 1989 review marked NO_EVIDENCE whose explanation stated it made the Frameshift Mutations claim unsubstantiated. (3) Three NO_EVIDENCE items from treatments > Supportive Care, including PMID:32941194 on vascular EDS - a different subtype. (4) PMID:37594181 (feline case report) from Wound Care and Skin Hyperextensibility, both NO_EVIDENCE. Retagged: PMID:33741806 SUPPORT -> PARTIAL on Supportive Care, since its cohort is hypermobile EDS / hypermobility spectrum disorder rather than COL5A1 classic EDS; PMID:26376608 NO_EVIDENCE -> PARTIAL on Gastrointestinal Management with an explanation naming the cohort and efficacy limits. Frequency: Delayed Wound Healing VERY_FREQUENT -> FREQUENT to match its own ORPHA:287 row (Poor wound healing | Frequent 79-30%), which had been marked SUPPORT while contradicting the asserted band. evidence_source added where unambiguous: PMID:2728341 MODEL_ORGANISM (dogs and cats), PMID:15095409 x2 and PMID:33189937 IN_VITRO (cultured fibroblasts / functional cell assays). Deferred to issue #6954: the remaining ~45 items still lack evidence_source (this is the only file of ten reviewed with the field systematically unset); the Frameshift Mutations variant class is now uncited; and Chronic Joint Pain cites PMID:10906878, which reports classic-EDS (Types I/II) patients having LESS joint pain than hypermobile-type patients. Validated with linkml-validate and an offline snippet-vs-cache substring check.

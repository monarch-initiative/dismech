  summary: Map Ehlers-Danlos Syndrome COL5A1-related to OMIMPS:130000
  details: |
    Prioritized from the CLINICAL.T01.01 disease list. Compared January 2026 OMIM membership with September 2026 MONDO and existing KB scope. PS130000 covers the full Ehlers-Danlos syndrome family, including both classical EDS records OMIM:130000 and OMIM:130010 and multiple non-classical forms. This Disease is restricted by its name and description to COL5A1-related classical EDS, so the series is a broader target. The mapping does not equate this gene-specific entry with all classical EDS or with the entire EDS family. The existing MONDO:0007522 binding names the broader classical subtype; that pre-existing granularity difference does not justify an exact OMIMPS mapping.
    Quoted an existing mapping justification containing a PR-number hash to prevent yamlfix from changing its parsed value; the text is unchanged.

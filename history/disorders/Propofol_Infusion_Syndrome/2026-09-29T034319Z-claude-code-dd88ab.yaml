  summary: 'Create: Propofol Infusion Syndrome'
  details: |
    Created the entry from issue #13101, which proposed it because propofol
    infusion syndrome is the clinical setting the term Brugada phenocopy was
    coined for and dismech had no record of it.

    No disease_term. MONDO has no term for the syndrome: ols:mondo returns
    nothing for `search l~propofol` or for free-text "propofol" and "propofol
    infusion syndrome", against a positive control on `l~Brugada` that returns
    the expected terms. NCIT holds only the drug, NCIT:C29384. No cached
    Orphanet leaf record mentions propofol. The searches and the positive
    control are recorded in the entry's own notes so the negative-existence
    claim is checkable. The MONDO parent-term question the issue raised is left
    open; it blocks a term request, not the entry, and 38 of 3,230 entries on
    main carry no disease_term.

    No conforms_to. Both candidate modules were read before deciding, as the
    issue asked. mitochondrial_dysfunction scopes itself to the hallmark of
    aging and its chain starts at mtDNA mutation and passes through impaired
    mitophagy, which an acute pharmacological inhibition does not have.
    metabolic_intoxication_decompensation scopes itself to inborn errors with a
    deficient enzyme or transporter, where this is reversible drug inhibition of
    a normal pathway. Recorded in notes rather than conforming to a module whose
    own description excludes the case.

    Pathophysiology follows the two proposed mechanisms as separate molecular
    nodes, respiratory-chain inhibition and impaired fatty acid oxidation, both
    feeding one bioenergetic-failure node that fans out to myocyte necrosis and
    cardiac conduction instability. The hedging in the source is preserved: the
    reviews say the syndrome "may be caused by" these mechanisms, and the
    evidence explanations say so rather than asserting an established mechanism.

    The Brugada relationship is a differential diagnosis carrying both sides of
    the dispute rather than a phenocopy claim. PMID:23094876 credits Riera with
    introducing the term for this syndrome and, in the same text, lists propofol
    among its Group 1 agents, says nearly all act by sodium channel blockade,
    and concludes Group 1 drugs mostly cannot be considered phenocopies. Those
    two statements are recorded as a SUPPORT and a REFUTE item against the same
    paper, which is what the evidence model asks for when one source cuts both
    ways. No sodium-channel mechanism is asserted in the pathophysiology,
    because the reviews cited attribute the syndrome to mitochondrial impairment
    and do not establish a channel-blocking route to the ECG change.
    Brugada_Syndrome already carries the reciprocal differential from #12929.

    The open question about inherited susceptibility is a KNOWLEDGE_GAP
    discussion attached to both molecular nodes, evidenced by the 2010 paper's
    own statement that uncertainty remains and by the review that lists
    subclinical mitochondrial disease among predisposing factors.

    Curated by hand rather than by the autonomous agent. The summon on #13101
    fired the mention workflow, whose gate logged `User: gingin77, Allowed:
    false, Has mention: true` and skipped the job that would have done the work;
    the allowlist is .github/ai-controllers.json on the default branch. The
    issue comment was updated to record that, and no self-authorizing change to
    that file was made.

    Six references fetched and cited: PMID:20544610, PMID:17567345,
    PMID:26558513, PMID:30857601, PMID:36407194, plus the already-cached
    PMID:23094876. One snippet had to be reselected: a sentence carrying
    bracketed citation markers failed exact-quote validation, and a bracket-free
    sentence from the same review was used instead.

    Review round 1. The reviewer found two features present in more than 10% of
    reported cases that the entry missed, from a frequency table in a paper it
    already cited: arrhythmia at 66%, modelled only as bradycardia, and
    hypotension at 30%, absent entirely. Both are now phenotypes wired from the
    conduction-instability node, and nine phenotypes carry frequency values
    quoted from that table. Hypertriglyceridemia previously cited a sentence
    saying "Lipidaemia" while binding the narrower triglyceride term; it now
    cites a sentence naming hypertriglyceridaemia directly, which also records
    the review's caution that the feature is missing in most cases. The
    discontinuation treatment moved from NCIT:C49236 Therapeutic Procedure to
    NCIT:C128535 Pharmacotherapy Discontinuation, verified by lookup rather than
    taken from the review, and already used by Eosinophilia-Myalgia_Syndrome. The
    Myocyte Injury node cited only a sentence about when rhabdomyolysis appears,
    which did not support the node's own claim; it now carries two mechanistic
    sentences from PMID:36407194.

    The review also asked for the deep-research artifact the policy requires for
    a new entry, and was right that a hand pass can miss what a run catches. The
    run produced research/Propofol_Infusion_Syndrome-deep-research-claude_code.md
    (falcon requested, fell back to claude_code; 25/25 references verified, 0
    confabulation) and surfaced two things the entry lacked. A prospective
    multicenter cohort of 1,017 ICU adults gives the only real incidence figure,
    slightly above 1% (PMID:19874582), which is now an epidemiology record
    alongside the pooled case count and says explicitly that every other figure
    here has an unknown denominator. And MeSH does code the syndrome as the
    supplementary concept D000072736, which matters for the MONDO request; there
    is no MeSH mapping slot, so it is recorded in notes. That identifier was
    verified against the NCBI MeSH database before use, and the first lookup
    attempt failed because a supplementary concept is retrieved by its own UID
    rather than the 68-prefixed descriptor form.

    Two term defects inside the report were left alone rather than propagated,
    which is what a report being a lead means: its own validation flags
    GO:0055114 as obsolete, and CL:1001603 as labelled 'kidney proximal tubule
    epithelial cell' in the report when the ontology says 'lung macrophage'.
    Neither is bound anywhere in this entry. The report also cites issue #13101
    as a source for MONDO having no term, so its agreement on that point is not
    independent of the claim it was asked about.

    Review round 2, on the approving review's non-blocking note: the two
    remaining features above 10% in the same frequency table were added, abnormal
    liver function tests at 13% and discolouration of urine at 11%, so the entry
    now covers every feature the table reports above that threshold. Each is
    bound to a term its own snippet supports rather than to the most precise
    concept available: elevated transaminases rather than a generic
    liver-function term, since the clinical review names elevated liver enzymes;
    and abnormal urinary colour rather than myoglobinuria, since the 11% counts
    observed discolouration rather than a confirmed myoglobin measurement, with
    the myoglobin mechanism carried in the description and evidenced separately.
    The urine phenotype is wired from the myocyte necrosis node.

    Validation after review round 2: just validate (46/46 snippets, 53 titles,
    0 issues),
    validate-terms, count-verified-snippets, check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-qualifier-terms,
    check-granularity, and the batched validate-disorders all pass. Whole-KB
    gates clean: check-folded-hyphens, check-snippet-length,
    check-title-snippets, check-snippet-grading, check-reference-titles,
    check-coarse-phenotypes, check-enum-values, check-case-collisions,
    check-delivery-system. No baseline file was updated. No environmental[] or
    influences_mechanisms links, pending #10395.

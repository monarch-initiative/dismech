  summary: Addressed PR 17267 review feedback on proband 4 prenatal findings, CCN2
    differential discriminators, femoral phenotype naming, and snippet grading
  details: |
    Corrected genetic[0].notes to match PMID:37934770 Table 1 so proband 4 (p.Thr195Lys) is described with prenatal osteopenia, hypomineralization, bent and short long bones, and hypoplastic/unossified vertebrae and pelvic bones without in utero fractures (which occurred in proband 3 p.Gly90Ala). Rewrote the CCN2-related kyphomelic dysplasia differential diagnosis to drop overlapping cleft palate and micrognathia as discriminators and contrast autosomal recessive consanguineous inheritance, radial head dislocations, and mild platyspondyly (PMID:39506047) against KIF5B postnatal osteoporosis/fractures and optic atrophy (PMID:35342932). Renamed Sharp Angulation of Femora and Humeri to Sharp Angulation of the Femora, regraded the PMID:39506047 zebrafish cartilage-remodeling background quote to MODEL_ORGANISM, and added notes on the six facial phenotypes explaining why per-patient frequency is omitted.

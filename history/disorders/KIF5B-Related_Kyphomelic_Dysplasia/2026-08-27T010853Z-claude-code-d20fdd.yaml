  summary: Classify into ISDS group 20 (NOS 20-0040)
  details: |
    The entry had no isds_skeletal_category despite being a listed ISDS disorder, so it was invisible on the ISDSNosologyGroupEnum classification page. Added bent_bone_dysplasia with provenance for NOS 20-0040, "Kyphomelic dysplasia with facial dysmorphism, KIF5B-related" (AD, KIF5B).

    The note records that the 2023 row attaches MIM 211350 to a KIF5B-named entry, and that OMIM has since resolved 211350 to the recessive CCN2 form (the KIF5B form being OMIM:621644). The assignment here rests on the row's gene attribution, not its MIM number. No other change.

    Part of a completeness and consistency pass over ISDS 2023 nosology group 20 (Bent bones dysplasia group). After this pass all six 2023 rows are curated and classified, plus the post-revision CCN2 entity.

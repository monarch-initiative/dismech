  summary: 'Publication review: Aortitis'
  details: |
    Full publication-readiness review through 2026-08-05. Audited primary and authoritative evidence for definition, etiologic subtypes, mechanisms, phenotypes and natural history, selected-cohort epidemiology, diagnostics and differentials, treatment, trials, and experimental models. Added current 2025-2026 evidence for perioperative outcomes, TNC/IL-6 stromal biology, GCA dilation risk, remission discordance, and inflammatory aneurysm growth; added dedicated imaging, differential, trial, model, and knowledge-gap records; removed redundant passive reference findings that did not encode interpreted claims. The D2P audit returned five medium unlinked local phenotypes: defining Aortitis was not linked to itself; CRP and ESR were represented as evidence-backed observational readouts; fever and aortic regurgitation were left unlinked because available evidence did not license direct causal edges. No disorder-level gene assertion was added because susceptibility evidence is etiology-specific rather than shared across this heterogeneous syndrome. Model and clinically isolated aortitis treatment limitations remain explicitly open.

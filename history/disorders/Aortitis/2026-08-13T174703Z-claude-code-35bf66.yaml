  summary: Link G-CSF to the node named for it, and smoking with its target stated
    as inference
  details: |
    Backfill for issue #8085. G-CSF exposure is TRIGGERS with DIRECT into G-CSF-associated aortic inflammation, a node named for the drug, so the exposure is the node's own content rather than something inferred onto it, and DIRECT is honest for a drug-induced inflammation with no intervening disease. The link originally carried a single PARTIAL item ranking which G-CSF is most often implicated, pegfilgrastim, which presupposes the association rather than demonstrating it. The reviewer of PR #8429 pointed out that stronger sentences were available in the same cached record, and they were: the review states outright that G-CSF-induced aortitis is a rare but particularly serious adverse event, and concludes from its re-administration cases that patients with a history of it cannot be assumed safe on repeated use or on a change of preparation. Recurrence on re-exposure is the classic argument for drug causation, so that second item is what the link now rests on and both are SUPPORT. Its explanation also carries the two limits the source itself attaches: the authors qualify that same sentence by noting reporting bias means the possibility needs further validation, and the underlying numbers are small, three re-administrations plus two preparation switches. The original item is kept at PARTIAL, and the earlier explanation justifying a PARTIAL against this node's SUPPORT is no longer needed and was removed. Current tobacco smoking is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into Aortic wall structural remodeling. The target was forced by the graph as much as chosen, a point the reviewer of PR #8429 asked to see stated explicitly: every inflammatory node in this entry is etiology-specific, naming large-vessel vasculitis, infection, G-CSF or IgG4, so wall remodeling is the only etiology-agnostic node available to an exposure belonging to none of those arms. Beyond that the target is an inference rather than a reading of the evidence: the cited multivariate regression associates smoking with aortitis as a whole and names no mechanism, so the remodeling node was chosen as the step through which a chronic inhaled exposure is understood to reach the aorta. That is stated in the link description rather than left implicit, and it is the weakest link in this tranche. Verification note: both references here are DOIs, and the reference validator skips DOI-prefixed snippets, so both quotes were checked against the cached records by hand. This entry is unusually exposed to that gap, with 49 of its 80 snippets skipped by prefix.

  details: |
    Backfill for issue #8085. G-CSF exposure is TRIGGERS with DIRECT into G-CSF-associated aortic inflammation, a node named for the drug, so the exposure is the node's own content rather than something inferred onto it, and DIRECT is honest for a drug-induced inflammation with no intervening disease. Its item is PARTIAL because it ranks which G-CSF is most often implicated, pegfilgrastim, which presupposes the association rather than demonstrating it. That grading diverges from this node, which records the same sentence as SUPPORT; the divergence is deliberate and stated in the explanation, because the node claims such an inflammation exists while the link claims the exposure produces it in an exposed patient. Current tobacco smoking is PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES into Aortic wall structural remodeling, and the target is an inference rather than a reading of the evidence: the cited multivariate regression associates smoking with aortitis as a whole and names no mechanism, so the remodeling node was chosen as the step through which a chronic inhaled exposure is understood to reach the aorta. That is stated in the link description rather than left implicit, and it is the weakest link in this tranche. Verification note: both references here are DOIs, and the reference validator skips DOI-prefixed snippets, so both quotes were checked against the cached records by hand. This entry is unusually exposed to that gap, with 49 of its 80 snippets skipped by prefix.

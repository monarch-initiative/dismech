  summary: 'Address automated review: Aortitis'
  details: |
    Addressed the four important findings from the automated Claude review on commit 9ead67d892740ed767ef3c170b244ab8b70c3710. Added evidence-backed serum IgG4 phenotype/readout; named representative infectious organisms and subacute syphilitic/tuberculous forms; connected G-CSF inflammation to rare structural complications; and connected LVV inflammation upstream of lesion-localized TNC/IL-6 persistence. Also removed a duplicated diagnostic dichotomy from differential_diagnoses, moved perioperative outcomes from epidemiology to progression, documented intentional imaging ontology gaps and reference-list policy, and added the aortitis target phenotype only to the aortitis-specific trial. Broader subtype symptom additions and direct fever/regurgitation causal edges were not added because the available disease-level evidence did not license those umbrella claims. The updated D2P audit yields six medium suggestions, all explicitly dispositioned; three laboratory features are modeled as reports_on readouts.

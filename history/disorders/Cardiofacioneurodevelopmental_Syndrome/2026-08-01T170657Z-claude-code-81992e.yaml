  summary: 'Create: cardiofacioneurodevelopmental syndrome'
  details: |
    Created kb/disorders/Cardiofacioneurodevelopmental_Syndrome.yaml for MONDO:0030873 (OMIM:619123), causal gene CCDC32 (hgnc:28295), toward epic #1079. NEC preflight PASSED before any deep-research content was used: runoak on MONDO:0030873 returned RO:0004003 HGNC:28295 CCDC32 and xref OMIM:619123, and runoak relationships on HGNC:28295 returned MONDO:0030873 as the only linked disease; a gene-mention count over the claude_code deep-research report returned 123 CCDC32/C15orf57 hits against 3 genuine BRAF hits (all inside a cardiofaciocutaneous differential row), with OMIM:619123 asserted 10 times. The entry was nevertheless drafted from primary literature before the report finished; the report was used only as a coverage cross-check and as the source of two leads (the HPO annotation set and the ClinGen classification), each of which was then re-verified independently against ontology.jax.org and search.clinicalgenome.org respectively. Curated eight PMIDs, all fetched with just fetch-reference: PMID:32307552 (founding report, zebrafish, ciliary arm), PMID:35451546 (phenotype expansion and core phenotype), PMID:38818818 (fourth patient; PubMed-indexed WITHOUT an abstract, so the single evidence item citing it quotes the article title and no clinical detail from it is asserted), PMID:41639596 (two siblings, RNA-seq diagnosis, 2026 review), PMID:33859415 (co-essentiality screen linking C15orf57 to AP2), PMID:39145939 (AAGAB-to-CCDC32 handover), PMID:41489497 (clathrin-coated pit stabilization; patient-derived truncation), PMID:42234739 (membrane-switch AP-2 assembly), plus PMID:31104773 and PMID:20301365 cited ONLY inside differential-diagnosis blocks. Modelled a six-node pathograph with two competing mechanism arms recorded as mechanistic_hypotheses (AP-2 assembly chaperone / CME, CANONICAL, ESTABLISHED; ciliary contribution, ALTERNATIVE, PROVISIONAL) and both edges into the morphogenesis outcome typed INDIRECT_UNKNOWN_INTERMEDIATES because neither arm has been connected to a human malformation. Four discussions capture the open questions (AP2 vs cilia, the three-way disagreement between the 2024-2026 AP-2 mechanism papers, hypomorph vs null, and the denominator/natural-history gap). NO frequency band is asserted on any phenotype and no prevalence rate is given, because the total published denominator is fewer than ten individuals; raw counts are recorded in per-phenotype notes instead. Nine phenotypes derived from the HPO annotation for OMIM:619123 are curated WITHOUT evidence items and each says so explicitly in its notes, because the underlying counts come from the full text of PMID:32307552, which returned HTTP 403 from both the publisher and PMC. Validated: just validate (schema, terms, references) PASS with 83/83 snippets verified; scripts/check_snippets_verbatim.py PASS 83/83; just validate-terms PASS; check_folded_hyphens PASS; linkml-data-qc compliance 91.7 percent global, 92.1 percent weighted; 5292 targeted pytest data tests pass.

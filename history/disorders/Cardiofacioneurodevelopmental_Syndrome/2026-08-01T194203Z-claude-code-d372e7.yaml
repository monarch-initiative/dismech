  summary: 'Address PR #7726 review: allele-level variant curation, NCIT specificity,
    NAHR knowledge gap'
  details: |
    Response to the ai4c-reviewer REQUEST_CHANGES review on PR #7726 (1 IMPORTANT, 6 SUGGESTIONS).

    BLOCKING ITEM 1 - genetic.variants lacked allele-level detail. Added three new allele-level Variant blocks (CCDC32 c.27dup / p.Thr10fs family A; c.162_163dup / p.Glu55fs family B; c.471T>A / p.Tyr157Ter VUS) carrying synonyms for both published and current HGVS nomenclatures, identifiers (ClinVar VCV, OMIM allelic variant, dbSNP, ClinGen CAID), and external_assertions recording each ClinVar germline classification with review status and evaluation date. Added ClinVar accessions plus external_assertions for the two large deletions. Every identifier was verified live against the NCBI eutils ClinVar esummary and VCV efetch endpoints on 2026-08-01, not taken from the deep-research artifact.

    Transcript hazard: the research artifact framed the c.54dupT vs c.27dup discrepancy as a transcript-CHOICE difference (NM_001080791.2 vs NM_001080792.4). The ClinVar VCV XML shows this is wrong - all thirteen current RefSeq transcripts, including NM_001080791.4, number the alleles c.27dup and c.162_163dup. It is a transcript-VERSION artefact with a 9-codon offset, the same offset that explains the 194 vs 185 aa protein-length discrepancy. Curated as such in genetic[0].notes, with the direct documentation quoted from PMID:41489497 (the 9 aa VRGSCLRFQ N-terminal peptide sentence).

    Gene constraint: recorded pLI 0.16 / LOEUF 0.78 (obs 9 / exp 20.1 LoF) from a live gnomAD GraphQL query on 2026-08-01, explicitly noting these differ from the research artifact's pLI 0.19 / LOEUF 0.76 and that the verified values are the ones recorded.

    SUGGESTION 2 - replaced generic NCIT:C15329 on the cleft treatment with NCIT:C168380 Palatorrhaphy and split the treatment into cleft palate repair and cleft lip repair.

    SUGGESTION 3 - added Nutritional and feeding support in infancy (NCIT:C15433) and Orchidopexy for cryptorchidism (NCIT:C111066 Orchiopexy, verified reachable from NCIT:C25218), closing the promote-then-manage loop for HP:0008872 and HP:0000028.

    SUGGESTION 4 - added the ccdc32_recurrent_15q15_deletion KNOWLEDGE_GAP discussion covering the possible NAHR-mediated or founder recurrent deletion, with the ClinVar breakpoint coordinates and an explicit statement that the coordinates are ClinVar record fields rather than author claims, and that the Fernandes da Rocha breakpoints are HGVS-uncertain.

    SUGGESTION 5 - DECLINED. The three-organ outcome node is left unsplit; reasoning recorded as entry note (13).

    SUGGESTION 6 - DECLINED promotion of HP:0012110, HP:0000286, HP:0000752. Neither route into the entry is available: the HPO API was re-queried on 2026-08-01 and returns 25 terms, none of them these three; PMID:32307552 was re-fetched and remains abstract_only, and a grep across all cached references for this entry finds no clinical hit. Reasoning recorded as entry note (10a) with the verified HP identifiers preserved for a future curator.

    SUGGESTION 7 - replaced the mid-clause PMID:39145939 fragment with a complete ASCII sentence carrying the same claim.

    Validation: just validate / validate-terms / validate-references all pass; both snippet checkers report 88/88 verbatim; check_folded_hyphens --check OK; validate-history-all passes. references_cache/ churn from the validator was reverted and no new cache file was needed.

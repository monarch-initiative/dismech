  summary: Review CCDC32 clinical and mechanistic evidence against full texts
  details: |
    Reviewed the complete existing entry against cached primary sources and the matching
    claude_code deep-research report and citation list. Eligible Mendelian entry with no
    prior REVIEW event; infectious, environmental and poisoning entries remain excluded.
    The isolated branch was created from and rebased onto origin/main dc36c5202f4.

    Recovered the full 2020 clinical/model paper and full 2024 PNAS paper through the
    NCBI PMC URL fetcher. Refetched PMID:42234739 as full_text_xml and read its structural
    mechanism alongside the cached full eLife article. Used the public 2026 Nature figure
    captions for MRI, fibroblast RNA and genomic-confirmation findings. The PMID:41639596
    cache is labeled full_text_html but contains a landing-page abstract, not the full
    paper; primary full texts for the 2022 and 2024 clinical reports and the complete 2026
    clinical article remained inaccessible. Cached ClinGen's dated gene-validity assertion.
    Every cache file was generated/refreshed by repository reference-fetching tools;
    no reference-cache Markdown was manually created or edited.

    Content-completeness cross-check:
    - Phenotypes: replaced nine HPO-only assertions with primary full-text evidence and
      expanded the entry from 26 to 44 specific observations, removing broad duplicate
      facial, cardiac, laterality and finger rows. Included pontine hypoplasia,
      hyperactivity, epicanthus, additional facial/digital findings, anterior pituitary
      hypoplasia, absent right internal carotid artery and a thin optic nerve. Did not
      infer hormone deficiency, optic atrophy, primary hypodontia or population frequencies.
    - Subtypes: no source-defined mechanistically distinct CFNDS subtypes justified.
    - Pathophysiology: separated knockout-associated AP-2 abundance loss from coated-pit
      defects under partial knockdown with normal AP-2 levels. Retained the membrane-dependent
      assembly model and indirect human developmental links; separated organ outcomes.
    - Treatments/trials: retained explicitly extrapolated supportive care, removed
      unsupported fixed ages and universal lifelong antibiotics, and cited the asplenia
      review for risk-dependent prevention. No verified disease-modifying trial surfaced.
    - Genetics: corrected exact patient allele versus 1-54 experimental construct, used
      transcript-version-aware nomenclature, preserved VUS uncertainty, distinguished
      structural alleles and documented ClinGen's unscored fourth case. Removed ungrounded
      recurrent-deletion/founder and fetal-lethality inferences and title-only evidence.
    - Diagnostics/biomarkers: added patient fibroblast RNA findings and PCR/Sanger confirmation;
      explained the earlier gene-panel omission instead of claiming DNA invisibility.
    - References: incorporated recovered clinical, experimental and figure material;
      unavailable PMID:38818818 remains a bibliographic lead only. New evidence titles
      were read against the cache and matched to their attached findings.
    - Overall: incorporated central quotable research leads while rejecting unsupported
      prevalence, carrier-frequency, universal-absence and protocol claims in the report.

    Corrected the zebrafish model to mosaic F0 CRISPR/Cas9, two sgRNAs within one study;
    the 2022 report is a citation, not independent replication. Added engineered human
    cell, mouse IMCD3 and patient-fibroblast systems with explicit translational limits.
    The GeneReviews check returns TAGGED for the differential-only cardiofaciocutaneous
    chapter; it is not a clinical baseline for CCDC32-related CFNDS. Live HPO term/definition
    lookups were used for new bindings; unmatched anatomy remained explicitly unbound.
    Moved curation-session narrative out of the disease notes. The deep-research reference
    validation resolved all 20 references (zero off-topic findings). Offline snippet
    validation verified 141/141 evidence items with none unavailable or mismatched.

    Final batched schema, live-term and reference validation passed: 141 snippets and
    157 titles checked, zero skipped/unavailable snippets or issues. Rendering passed;
    causal targets, coarse phenotypes, entity references, qualifier terms and node-class
    examples resolved. Gene activity grounding is 1/1. The single added HPO cache row
    is HP:0001802 (Absent toenail), generated by term validation.

  summary: 'Create: Spermatogenic Failure 28 (FANCM)'
  details: |
    New entry for spermatogenic failure 28 (MONDO:0054732), autosomal recessive non-obstructive azoospermia from biallelic FANCM loss of function. Lump/split: kept as a DISEASE at the MONDO SPGF28 concept, with a skos:broadMatch to MONDO:0100578 (FANCM Fanconi-like genomic instability disorder), the broader disease into which ClinGen lumps SPGF28, POF15 and Fanconi-like syndrome. Pathograph: FANCM DNA translocase loss (GO:0015616) -> defective interstrand crosslink repair -> progressive germ cell depletion -> Sertoli cell-only, NOA, oligozoospermia, small testes, raised FSH, infertility; a mouse-derived round spermatid arrest branch; and a separate mouse-only meiotic crossover node not drawn as a cause of infertility. Cancer and chemotoxicity risk in men is recorded as an EMERGING mechanistic hypothesis with supporting and refuting evidence rather than as phenotypes. The falcon provider failed authentication; the claude_code deep-research report (research/Spermatogenic_Failure_28-deep-research-claude_code.md) was used as leads, and every snippet was taken from references fetched with just fetch-reference. preflight-dr was not run because no local MONDO build is available. Validated with validate-disorders, validate-terms, count-verified-snippets and the offline QC gates.

  summary: 'Review round 1: add diagnosis and treatments'
  details: |
    Responded to the first review of PR 14372. Added five diagnosis rows: karyotype/Y-microdeletion exclusion (NCIT:C16768), semen analysis (NCIT:C25294), testicular biopsy histology (NCIT:C15189), exome sequencing (NCIT:C101295) and the mitomycin C chromosomal breakage test (NCIT:C18280). Added four treatment rows: genetic counseling (NCIT:C15240), cancer and hematologic surveillance (NCIT:C15406), caution with chemotherapy and radiotherapy (no NCIT term bound; linked to the crosslink repair node), and micro-TESE (NCIT:C94427; no retrieval outcome is reported, so yield is stated as unknown). All NCIT labels were confirmed through OLS. Moved the ClinGen Fanconi anemia Refuted record off the causative gene record onto the chromosomal breakage phenotype, quoting ClinGen's no-marrow-failure sentence. Clarified that only the human half of the PMID:29895858 REFUTE quote is used. Re-ran validate-disorders (49/49 snippets), validate-terms and the offline QC gates.

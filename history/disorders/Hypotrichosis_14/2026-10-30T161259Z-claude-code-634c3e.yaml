  summary: 'Create: Hypotrichosis 14 (LSS)'
  details: |
    New entry for hypotrichosis 14 (MONDO:0032649), autosomal recessive nonsyndromic hypotrichosis simplex caused by biallelic LSS variants.

    Lump/split decision: curated as a separate Disease. MONDO keeps HYPT14, APMR4 (MONDO:0030009), cataract 44 (MONDO:0014673) and PPKCA2 (MONDO:0008923) as separate leaves, and the existing APMR4 entry already treats allelic LSS disorders as separate entries. HYPT14 is recorded with intellectual disability EXCLUDED, and the three allelic disorders are listed as differential diagnoses. Not added to the APMR grouping (no intellectual disability) or to the pure hair and nail ectodermal dysplasia grouping (no nail dystrophy; LSS is not one of its genes).

    Sources: drafted from PubMed primary reports (gene discovery PMID:30401459; mouse and sebum biomarker study PMID:32101538; case series PMID:33155697, 36685177, 37029088, 37455568, 37947113, 40364812, 40696433, 41442087; allelic PPKCA2 and cataract reports PMID:35413293, 26200341), then checked against one OpenScientist deep-research report (research/Hypotrichosis_14-deep-research-openscientist.md). The report resolved 22 of 22 references (confabulation rate 0.0, 16 on topic, 0 off topic); its term validation flagged one invented HP CURIE (HP:0002116), one obsolete term (HP:0001006) and one mislabelled CURIE (HP:0100836), none of which were used. just preflight-dr passed (LSS mentioned 58 times, OMIM 618275 matches). Two report citations were added that the PubMed draft lacked: PMID:14766201 (LSS is a monotopic membrane protein) and PMID:24898506 (no therapy for these alopecias). PMID:31322293 and PMID:34318586 have no PubMed abstract and were not cited.

    Mechanism: both proposed routes are recorded, mutant protein mislocalization outside the ER (hypothesis, from keratinocyte imaging) and tissue-local loss of lanosterol synthesis (sebum substrate/product ratio in patients, inducible epidermal and lens Lss knockouts in mice), with a knowledge gap on which dominates. The PMID:32101538 patients also had midline anomalies; that paper is cited for mechanism, biomarker and mouse models only.

    Validation: just validate, validate-terms, count-verified-snippets (70/70), the CI offline gates, check-snippet-grading, check-genereviews (no chapter), list-gene-term-mismatches and list-disconnected-phenotypes (only the EXCLUDED intellectual disability phenotype is unconnected), and validate-disorders.

  summary: 'Create: Autosomal Dominant Cutis Laxa 1 (MONDO:0007411)'
  details: |
    New entry curated from the Edison Falcon deep-research report research/Autosomal_Dominant_Cutis_Laxa_1-deep-research-falcon.md with report DOIs resolved to PMIDs through PubMed and all snippets quoted from cached abstracts; the GeneReviews chapter PMID:36173875 (ELN-Related Cutis Laxa) is tagged and every finding in its clinical characteristics is curated. Ten-node pathograph: heterozygous 3-prime ELN frameshift, stable mutant transcript escaping nonsense-mediated decay, synthesis and secretion of C-terminally altered tropoelastin, dominant-negative disruption of elastic fibre assembly, endoplasmic reticulum stress and apoptosis from retained mutant tropoelastin, fragmented sparse elastic fibres in dermis, lung and arterial media, increased TGF-beta signalling from a compliant matrix, loss of elastic recoil in skin, emphysematous airspace enlargement, and aortic medial degeneration with root dilatation. Lump/split: the ELN form only; ADCL2 (FBLN5) and ADCL3 (ALDH18A1, already curated) are separate entries. The allelic haploinsufficiency disease (supravalvular aortic stenosis, Williams syndrome) is described as the mirror-image mechanism and the Eln+/- mouse is recorded as a model of that allelic disease that fails to recapitulate ADCL1. The aortic arm conforms to aortopathy_tgfbeta_dysregulation at three nodes with mutant tropoelastin as the disorder-specific ECM substitution; emphysema_protease_antiprotease_imbalance was rejected because the emphysema here is a primary elastin assembly defect. Genetic block records DOMINANT_NEGATIVE functional impact and the 3-prime clustering of variants. Validated: just validate passed; count-verified-snippets 130/130; validate-terms, check-entity-refs, check-causal-targets, check-enum-values and check-duplicate-keys passed; pytest -k Autosomal_Dominant_Cutis_Laxa_1 passed. A first attempt at this curation was cut off by a session limit before writing; this record describes the completed second pass.

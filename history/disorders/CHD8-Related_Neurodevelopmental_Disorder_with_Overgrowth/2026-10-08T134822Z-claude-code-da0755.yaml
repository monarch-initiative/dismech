  summary: 'Evidence-claim mismatch review: differential, model and treatment evidence
    corrected'
  details: |
    Evidence-claim mismatch review against the saved evaluation for issue #13622. All 8 whole-claim mismatch findings and the higher-confidence partial findings were checked against the cached sources.

    Corrected:
    - CHD2 developmental and epileptic encephalopathy differential: the only evidence was a CHD8 GeneReviews seizure-frequency sentence, which says nothing about CHD2. Added the CHD2 GeneReviews chapter (PMID:26677509) for the defining early-onset epileptic encephalopathy and the shared intellectual disability/autism overlap; description and distinguishing feature now state the contrast. The CHD8 seizure-frequency item is kept as the CHD8 side of the contrast.
    - Overgrowth-with-intellectual-disability differential: the only evidence said CHD8 is an OGID gene. Added Tatton-Brown et al. 2017 (PMID:28475857) for Sotos/Weaver as prototypic OGID disorders, the NSD1/EZH2/DNMT3A/NFIX/CHD8 gene spectrum, and Beckwith-Wiedemann syndrome as overgrowth without intellectual disability. The Beckwith-Wiedemann clinical features (lateralized overgrowth, macroglossia, embryonal tumors) and the methylation-testing sentence remain unevidenced background statements.
    - Engineered H9 cerebral organoid model: the model-level snippet was a methods reagent-availability line. Replaced with the abstract's isogenic patient-allele/mosaic-organoid sentence, the single-female-line statement, and the S62X/E1114X allele definitions. Added the source sentence that S62X hardly affects organoid size by day 120 to the enlargement link, supporting its stated limitation.
    - Conditional CHD8 neuron chromatin model: the only model-level evidence was an unchanged-EPSC result. Added the abstract sentence describing the conditional-allele chromatin design; the EPSC item is kept for the description's physiology sentence.
    - Deep brain stimulation: snippet did not establish that the treated patients had CHD8 disease. Extended it to the abstract sentences identifying CHD8 nonsense and frameshift variants, and added the two patient-level sentences for the roughly 30% three-year benefit and the modest rating-scale change. "Two women" corrected to "two unrelated female patients", since one was 17.
    - Levodopa: added the second 2021 patient's levodopa non-response, which the description asserted but no item quoted.
    - Chiari I surgery: added the GeneReviews table row naming foramen-magnum decompression.
    - CHD8 haploinsufficiency node: the mouse snippet said only that no truncated product was found; extended to include the 51% protein reduction.
    - Shortened G1 phase node: the ERK snippet said only that total ERK was unchanged; extended to include the increased phospho-ERK activity.
    - Developmental glial sleep node: added the post-eclosion knockdown result supporting "adult-only knockdown does not reproduce the phenotype".
    - Striatal circuit node: evidence covered only adult perturbation; added the slice electrophysiology sentences for the excitatory/inhibitory and miniature-current findings.
    - Delayed cortical spine development (node and model link): extended the snippet to include the normal adult spine density and dynamics.
    - Anxiety: added the source sentence for the r = 0.55 age correlation.
    - HELIC domain variant and CHD8 genetic notes: the claim that the 2022 aggregation "did not reproduce" the domain association overstated the source, which compared missense with other variant classes and did not test severity by domain. Narrowed the wording and added the 2020 association and the 2022 variant-map statement as evidence.

    Retained after review:
    - Pathophysiology "Developmental Glial Sleep Regulation Defect" and other fly/mouse/monkey nodes flagged for disease context: model-organism evidence is graded MODEL_ORGANISM and the descriptions already state the translational limit.
    - Treatments: Levodopa REFUTE items are kept as REFUTE (no benefit in those patients), alongside SUPPORT items for partial and carbidopa-levodopa responses; the description already presents the response as inconsistent.
    - Model-link limitations that state curator caveats (cross-model direction differences, small animal numbers, single backgrounds) are judgement, not quoted findings, and were left as written.
    - Phenotype frequency contexts drawing on several cohorts, discussion ids/kinds, and enum fields flagged by the evaluator were not changed: each evidence item supports its own cohort figure, and the metadata flags were evaluator category errors.

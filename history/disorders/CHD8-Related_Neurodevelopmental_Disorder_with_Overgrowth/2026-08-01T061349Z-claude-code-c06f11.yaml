  summary: 'Create: CHD8-Related_Neurodevelopmental_Disorder_with_Overgrowth'
  details: |
    Created the monogenic CHD8 haploinsufficiency syndrome entry (MONDO:0014017 / OMIM:615032 / RO:0004003 HGNC:20153, all three anchors re-verified with OAK before writing). Deep research was run with the claude_code provider (just research-disorder claude_code ...; 1602-line report, 29 web searches, 78 turns) and read in full; because that report warns its own snippets are model-summarised, every one of the 30 cited PMIDs was independently fetched with just fetch-reference and every snippet copy-pasted from the cached abstract. GeneReviews baseline PMID:36302072 was found, fetched, tagged GeneReviews, and every Clinical Characteristics phenotype cross-checked into the entry. Curated: a single-rooted 15-node / 20-edge pathograph from CHD8 haploinsufficiency through chromatin-remodelling failure, neurodevelopmental network dysregulation, Wnt and REST branches, progenitor proliferation, brain overgrowth, primate gliogenesis, E/I trajectory imbalance, long-range connectivity, striatal circuits, a glial/serotonergic sleep arm, and a parallel enteric neural crest / gut epithelial arm; 26 HPO-bound phenotypes with cohort-defensible frequency bands; two mechanistic_hypotheses (canonical haploinsufficiency; remodelling-independent missense mechanism); genetic and variant records including the HELIC-domain correlate and the missense-causality caveat; molecular diagnosis with DNA-methylation episignature; 8 treatments including deep brain stimulation for refractory dystonia; mouse/zebrafish/primate animal models and cerebral-organoid experimental models; 8 differential diagnoses covering the NEC boundaries (multifactorial ASD, CHD7/CHARGE, CHD2/DEE, CHD4/Sifrim-Hitz-Weiss, 14q11.2 duplication, PTEN, overgrowth-ID syndromes); 8 discussions including a HUMAN_MODEL_MISMATCH on rodent-versus-primate megalencephaly mechanism. Validation: just validate clean (schema no issues, term validation passed, 154/154 snippets verified against cached references); just validate-references clean; just compliance 92.3 percent global / 92.5 percent weighted. Deliberate omissions (prevalence, unquotable table frequencies, tumour risk, inferred drug agents) are documented in the entry notes.

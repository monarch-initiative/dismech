  summary: 'Create: Dilated Cardiomyopathy 1HH (BAG3)'
  details: |
    Curated CMD1HH (BAG3, MONDO:0013479; ClinGen Definitive). Mechanistically distinct from the sarcomeric DCMs: BAG3 is the organizing co-chaperone of chaperone-assisted selective autophagy (CASA) at the Z-disc, so the lesion is a failure of protein quality control and structural turnover, not of force generation. Five-node pathograph: BAG3 loss-of-function -> impaired CASA at the Z-disc -> Z-disc disintegration and sarcomere structural failure -> ventricular dilation -> heart failure; conforms to cardiomyopathy_maladaptive_remodeling. Founding Norton 2011 CNV+exome family evidence and zebrafish bag3 knockdown curated. Evidence-scope caveat recorded (CASA nodes rest on fly/mouse/cell work; human evidence is genetic). Deleted stub. 14 snippets verified; validation passes.

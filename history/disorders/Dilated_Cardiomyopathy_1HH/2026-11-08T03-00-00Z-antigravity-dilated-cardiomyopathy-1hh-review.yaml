  summary: Enriched classifications with proteotoxic mechanistic category and evidence, wired pathophysiology downstream edges, added BAG3 genetic diagnosis, and linked treatments to target mechanisms for Dilated Cardiomyopathy 1HH.
  details: >-
    Added verbatim literature evidence to Harrison's chapters (CARDIOVASCULAR,
    GENETICS_ENVIRONMENT_DISEASE) and added the proteotoxic disease mechanistic
    category backed by BAG3 protein quality-control and CASA evidence. Enriched
    pathophysiology nodes with heart location bindings and downstream causal
    edges to Dilated Cardiomyopathy and Congestive Heart Failure phenotypes,
    keeping diagnostic: true solely on Dilated Cardiomyopathy. Added BAG3
    coding-exon sequencing and copy-number variation analysis under diagnosis
    with indirect discovery/cohort evidence explaining why both sequence and
    deletion analysis are required, added NCIT therapeutic_agent drug classes to
    Heart Failure Pharmacotherapy, and linked heart failure pharmacotherapy and
    heart transplantation to target pathophysiology nodes with non-overclaiming
    transplantation indication evidence.

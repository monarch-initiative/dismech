  summary: 'Create: POLR-Related Leukodystrophy (4H, MONDO:0100605)'
  details: |
    De-novo umbrella entry for POLR-related (4H) leukodystrophy, MONDO:0100605, covering the Pol III subunit spectrum (POLR3A/POLR3B/POLR1C/POLR3K).

    Deep research: claude_code provider (research/POLR-Related_Leukodystrophy-deep-research-claude_code.md; 21 web searches, 24 turns). DR output was treated as leads only: every PMID was independently re-verified via PubMed esummary before use, and two DR leads were corrected — the de novo POLR3B paper resolved to the 2021 original (PMID:33417887) rather than its 2022 erratum, and several DR citations given only as PMC/DOI were resolved to real PMIDs.

    GeneReviews baseline PMID:22855961 fetched, tagged in top-level references, and cross-referenced: all Clinical Characteristics items (neurologic, dental, endocrine, ocular) are represented in phenotypes. NEC preflight against MONDO:0100605 passed — the report's gene set (POLR1C/POLR3A/POLR3B) and the Orphanet:289494 xref both match the MONDO record.

    Pathophysiology was deliberately built as 19 atomic single-claim nodes to avoid bundling. Four initially bundled nodes were split during self-review: lysosomal mislocalization vs mTOR suppression; tRNA pool vs translational capacity; cerebellar atrophy vs cerebral neurodegeneration; and 'somatotropic insufficiency and growth restriction' renamed to the growth outcome the evidence actually supports.

    Also curated: 4 gene-level subtypes, 19 phenotypes, 4 imaging findings, 3 animal models (including a negative knock-in result recorded as REFUTE), 5 treatments (ibuprofen flagged as preclinical-only), 6 differential diagnoses covering the allelic POLR3A spastic-ataxia, Wiedemann-Rautenstrauch and POLR1C-Treacher-Collins disorders, and 8 discussions covering oligodendrocyte selective vulnerability, the tRNA-vs-5S/7SL controversy, mouse-model fidelity (HUMAN_MODEL_MISMATCH), the POLR1A umbrella-scope question, MRI-gated ascertainment bias, the ibuprofen allele-class translation gap, the Pol III DNA-sensing/VZV arm, and a deliberately deferred cerebellar module-conformance decision.

    Validation: just validate passes (schema + terms + references) with 101/101 snippets verified against cached references; just validate-graphs reports no dangling causal edges for this entry; compliance 84.6% global / 84.8% weighted.

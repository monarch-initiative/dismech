  summary: 'Address PR #7331 review: subtype MONDO bindings, management section, onset'
  details: |
    Response to the ai4c-reviewer REQUEST_CHANGES review on PR #7331, plus a real CI failure fix.

    CI fix: the differential-diagnosis snippet from PMID:29179231 (the medial-lemniscus/PMD contrast) lives in the article body, not the abstract. The committed cache for that PMID was abstract-only while the local re-fetch had enriched it to full text, so it passed locally and failed in CI. Committed the enriched full-text cache so the quote validates deterministically.

    Review items addressed: (1) bound subtype_term MONDO identifiers for POLR3A/HLD7 (MONDO:0011897), POLR3B/HLD8 (MONDO:0013722) and POLR1C/HLD11 (MONDO:0014666), all verified with OAK; POLR3K left unbound with the reason stated in its description, as no distinct MONDO term exists. (2) Fixed the broken parent cross-reference by setting Hypomyelinating_Leukodystrophy_7 parents to this entry's exact name. (4) Added Dystonia Monitoring and Treatment and Deep Brain Stimulation for Refractory Dystonic Tremor treatments; the DBS paper the DR cited only as a PMCID was resolved to PMID:38700104. (5) Added Endocrine Surveillance and Replacement Therapy, sourced to a newly found 150-patient cohort (PMID:33005949) and explicitly carrying that paper's caveat that evidence-based endocrine management recommendations do not yet exist. (6) Added onset descriptors (CHILDHOOD) to Cerebral Hypomyelination and Motor Delay with supporting quotes, including the 10-percent later-onset minority.

    Item (3), agents/circumstances to avoid: NOT added. The dopamine D2 blocker claim came from the deep-research artifact; targeted PubMed searching found no source making it specifically about POLR3-related leukodystrophy, and the cached GeneReviews abstract carries no Agents-to-Avoid statement. Rather than curate an unverified drug-safety assertion, recorded it as a CURATION_TODO discussion with a proposed source hunt.

    Also taken from the suggestions: POLR3B large exonic deletions added to the genetic section with PMID:26045207 and their testing-strategy implication; new Abnormal Thyroid Function phenotype (HP:0002926, 22%, OCCASIONAL) from the endocrine cohort; short stature and delayed puberty now carry quantitative cohort support. Delayed puberty was banded FREQUENT rather than VERY_FREQUENT because the cohort overall figure is 77%, inside the 30-79% band.

    Validation after changes: 111/111 snippets verified; schema and term validation pass on both edited files; no dangling causal edges; compliance 85.1% global / 85.3% weighted; 18/18 targeted tests pass.

  summary: 'Apply approving-review suggestions: treatment modality and onset bound'
  details: |
    Two non-blocking suggestions from the approving re-review of bfda579, applied because they are correct and cost nothing.

    (a) Endocrine Surveillance and Replacement Therapy: therapeutic_modality changed from BEHAVIORAL to OTHER. BEHAVIORAL covers behavioral, physical, dietary and lifestyle interventions, but this node names pubertal induction and sex-hormone and growth-hormone replacement, which belong to the drug bucket. OTHER was chosen over splitting the node into separate surveillance and pharmacotherapy arms because the cited source (PMID:33005949) states that evidence-based management recommendations do not yet exist for this disorder, so a two-arm split would encode a protocol granularity the evidence does not carry. The reason is recorded in the treatment description so a later curator does not revert it.

    (b) Motor Delay onset descriptor: dropped max_age_years 6.0, keeping onset_category CHILDHOOD plus notes. The numeric bound would be read as a hard ceiling by a structured-query consumer while the adjacent evidence item in the same phenotype states that ten percent of patients present beyond age 10; a prose caveat in notes cannot reach that consumer. The notes now state why no numeric bound is recorded, rather than the bound simply being absent.

    Note on history convention: a separate record was added rather than amending the bfda579 record, since history records are append-only.

    Validation: schema and term validation pass; 111/111 snippets verified against cached references (unchanged, confirming no evidence was disturbed); no dangling causal edges for this entry.

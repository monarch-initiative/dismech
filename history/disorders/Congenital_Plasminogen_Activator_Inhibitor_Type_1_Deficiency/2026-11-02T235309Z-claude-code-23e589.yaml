  summary: 'Create: Congenital Plasminogen Activator Inhibitor Type 1 Deficiency'
  details: |
    New entry for MONDO:0013227 (SERPINE1). entry_type decided as DISEASE: MONDO lists no descendants, one causal gene, and ClinGen rates SERPINE1 Definitive AR (recorded as gene_disease_validity). The GeneReviews chapter on complete PAI-1 deficiency (PMID:28771291) is the phenotype baseline. Pathograph: biallelic SERPINE1 loss of function (loss of serpin inhibitor activity) -> unopposed plasminogen activation and hyperfibrinolysis -> delayed bleeding after surgery or trauma, joint and intracranial haemorrhage, menorrhagia (with iron deficiency anaemia as sequela), postpartum haemorrhage, bruising and epistaxis; and a second branch, derepressed cardiomyocyte TGF-beta signalling -> myocardial fibrosis, supported by Amish homozygote imaging and iPSC data with mechanism from mouse studies. The Amish founder c.699_700dupTA is recorded with its carrier findings (no bleeding; longer telomeres and lower diabetes prevalence). No fibrinolysis module exists to conform to, and none was created for a single entry. Deep research: falcon not configured; the run falls back to openscientist and its report is added in a follow-up commit. Validated with just validate (47 snippets, 0 issues), just validate-terms, check-gene-validity and the offline per-file gates.

  summary: 'Review round 1: scope fix, GeneReviews surveillance and avoidance'
  details: |
    Addressed the first automated review. Removed PMID:15247991 (a qualitative PAI-1 defect with normal antigen, outside the entry's stated scope of complete deficiency): its menorrhagia item was redundant with PMID:9207454 and GeneReviews, and the iron deficiency anaemia phenotype it alone supported was dropped with its sequela link. Added from the GeneReviews chapter (PMID:28771291): a cardiac surveillance diagnosis row (echocardiogram, EKG, cardiac MRI at diagnosis and continued follow-up, bound to NCIT:C137915), an avoidance row for drugs affecting coagulation and contact sports (drugs named in prose, not bound as therapeutic agents, because the advice is to withhold them), and a GeneReviews baseline snippet on Myocardial fibrosis. Renamed the node 'Unopposed Plasminogen Activation and Hyperfibrinolysis' to 'Unopposed Plasminogen Activation' and updated all five references, so the edge to the Hyperfibrinolysis phenotype reads as cause to readout. Epistaxis keeps no frequency because no source gives one.

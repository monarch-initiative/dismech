  summary: 'Address PR #8222 review: extrarenal phenotypes, anti-TNF, animal model,
    evidence-quality fixes'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #8222 (five IMPORTANT
    findings plus most suggestions).

    Root cause of the gaps: PMID:38568326 is cached as full_text_xml, not
    abstract_only. The initial curation pass only read its abstract section and so
    missed the extrarenal organ paragraph, the treatment section, and the
    epidemiology figures. All new evidence in this round is quoted from that already
    cached full text or from PMID:15829582; no new references were fetched.

    IMPORTANT findings, all addressed:
    1. Gastrointestinal involvement now modeled as phenotypes - Chronic Diarrhea
       (HP:0002014, CHRONIC, FREQUENT, quoting the ~30% figure), Malabsorption
       (HP:0002024), Gastrointestinal hemorrhage (HP:0002239).
    2. Splenomegaly re-cited to HUMAN_CLINICAL evidence; the murine statement is
       retained as explicitly supplementary rather than sole support.
    3. Hepatomegaly re-cited to the same human quote, replacing the non-AA-specific
       mixed-cohort liver-stiffness quote, plus the reviewer-relevant caveat that
       hepatic deposition is commonly imaged but of limited clinical relevance.
    4. Anti-TNF-alpha therapy added as a treatment with target_mechanisms on the
       trigger node, carrying the 15-patient retrospective and 36-patient
       prospective 5-year datasets and the head-to-head result showing tocilizumab
       superior. The progression-in-largest-group result is marked PARTIAL so the
       entry does not overstate efficacy.
    5. The murine AA-induction / amyloid-enhancing-factor model was added under
       animal_models, NOT experimental_models as the review requested: the schema
       defines ExperimentalModel as "a disease-relevant non-animal experimental
       model system", so a mouse model does not belong there. Consequence noted in
       the PR reply - AnimalModel has no modeled_mechanisms slot, so the pathograph
       join point the reviewer wanted is not expressible on that class.

    Suggestions taken: amyloid storm as a distinct progression phase; weight loss
    (HP:0001824); elevated alkaline phosphatase (HP:0003155, OCCASIONAL at 5%) with
    the acute-phase-reactant interpretive caveat; dialysis as a treatment with its
    poor-survival caveat; SAA2 as a second SUSCEPTIBILITY locus; the 960-patient
    colchicine prevention data (1.7% vs 48.9% proteinuria at 11 years) plus the
    explicit statement that colchicine evidence outside FMF is limited; the >90%
    renal-presentation figure strengthening the Proteinuria frequency band; and the
    cardiac-rarity quote strengthening the AL differential.

    Suggestions declined, with reasons recorded in the entry notes: Eprodisate still
    carries no therapeutic_agent because both NCIT eprodisate terms (C166957,
    C65520) are outside the ChemicalEntityTerm dynamic enum and CHEBI has no
    eprodisate entry; ACE-I/ARB supportive care is omitted because no quotable
    AA-specific statement exists in the cached sources. MICA was not added - the
    review's own genetics section does not discuss it and the already-cited
    PMID:15018633 is the only source, which is thin for a standalone locus.

    Two reviewer observations corrected rather than accepted: the review flagged a
    divergence between CHEBI:3532 (asserted by the deep-research report for
    colchicine) and the CHEBI:23359 used in the entry - OAK confirms CHEBI:3532 is
    Centrolobine, so the entry's term is correct and the DR was wrong. Separately,
    my own earlier commit message described the DR's "42 patients" tocilizumab
    figure as a miscount; the full text shows it is a real 42-patient study
    (reference [82] of the review), which the DR misattributed to PMID:26120866
    (20 patients). The entry's use of 20 for that PMID was and remains correct, and
    the 42-patient comparison is now cited in its own right under anti-TNF therapy.

    Term-cache hygiene: three wrong NCIT IDs guessed from the DR report
    (C1728/C1857/C1490 for infliximab/etanercept/adalimumab) were caught by the
    pre-edit validation hook; OAK gave the correct C1789/C2381/C65216. The rejected
    attempts had left label rows in cache/ncit/terms.csv and
    cache/enums/chemicalentityterm_*.csv, so those files were reset with git
    checkout and re-derived by the validator, leaving only the hgnc:10514 SAA2 row
    the entry actually uses.

    Validation actually run and read after the changes: just count-verified-snippets
    reported 93/93 verified; just validate-terms passed; just validate-disorders
    (the batched sweep CI runs) passed with 93/93; compliance rose from 88.8% to
    90.6% global and 89.1% to 90.9% weighted; pytest tests/test_data.py -k
    AA_Amyloidosis passed 11/11; all 22 reference-title pairs still match their
    cached abstracts. No new reference cache files were added this round.

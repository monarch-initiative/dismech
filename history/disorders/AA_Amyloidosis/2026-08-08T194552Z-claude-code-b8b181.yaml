  summary: 'Create: AA Amyloidosis (MONDO:0019439), full amyloidogenesis conformer'
  details: |
    Created the AA (serum amyloid A) amyloidosis entry, previously absent from the KB
    despite AL and ATTR entries existing and the amyloidogenesis module explicitly
    naming AA as a precursor substitution.

    Deep research: claude_code provider, report at
    research/AA_Amyloidosis-deep-research-claude_code.md (22 web searches, 30 turns,
    45 citations, ~$2.34, 403s).

    NEC preflight: `just preflight-dr` returned SKIP because MONDO records no causal
    gene for this acquired disease. Manual MONDO/Orphanet fallback passed - the
    MONDO:0019439 definition names SAA, chronic inflammation and renal dominance,
    matching the report; SAA1 dominated the report's gene mentions (56) with MEFV
    (21) as the trigger-disease gene, exactly the expected pattern.

    DR errors caught and corrected: PMID:26221758 was cited for the anti-SAP antibody
    NEJM study but is actually an orthopedics paper on PyroCarbon joint components -
    discarded, and the real paper (PMID:26176329) used instead. The report also
    described the tocilizumab series as 42 patients; the actual paper reports 20, and
    the entry uses the true figure.

    Content: the pathophysiology is a full-chain conformer to all five
    amyloidogenesis module nodes, with AA-specific substitutions - chronic
    inflammatory/autoinflammatory/infectious trigger, IL-6-driven hepatic acute-phase
    response, sustained circulating SAA as precursor, C-terminal proteolytic
    truncation with beta-sheet misfolding, and glycosaminoglycan/SAP-assisted fibril
    nucleation and deposition, leading to glomerular barrier disruption and
    progressive kidney failure. Treatments use target_mechanisms: colchicine and IL-1
    blockade on the trigger node, tocilizumab on the IL-6 node, eprodisate on the
    GAG-assisted deposition node. SAA1 and MEFV are curated as SUSCEPTIBILITY loci,
    not causal genes. Obesity is linked into the pathograph via influences_mechanisms
    with environmental_effect PREDISPOSES. Two KNOWLEDGE_GAP discussions with
    structured proposed_experiments record why sustained high SAA is necessary but
    not sufficient, and the absence of any deposit-clearing therapy.

    Deliberate exclusions, recorded in notes: cardiac amyloidosis, peripheral
    neuropathy and macroglossia are NOT curated as phenotypes because they are
    uncommon in AA - they appear instead as AL differential-diagnosis discriminators.
    The hereditary SAA1-promoter form was omitted because no verifiable PMID was
    available. GeneReviews baseline does not apply to this acquired disease; the
    PubMed search returned only the FMF and TRAPS chapters for the trigger diseases.

    Validation actually run and read: `just validate` passed (schema, terms,
    references); `just validate-terms` passed; `just count-verified-snippets`
    reported 70/70 verified; `just validate-disorders` - the batched pre-PR sweep CI
    runs - passed with 70/70 snippets verified; compliance 88.8% global / 89.1%
    weighted; `pytest tests/test_data.py -k AA_Amyloidosis` passed 11/11. All 22
    reference titles were programmatically compared against their cached abstracts
    and match. One unrelated pre-existing test failure
    (X-Linked_Infantile_Spinal_Muscular_Atrophy.yaml) is present on origin/main and
    was not touched.

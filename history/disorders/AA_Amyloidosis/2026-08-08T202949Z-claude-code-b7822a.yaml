  summary: 'Post-approval follow-up: record MICA null result, document evidence_source
    convention'
  details: |
    Follow-up on the approving re-review of PR #8222, taking the remaining
    non-blocking suggestions. No new references fetched; all evidence quotes
    already-cached full text.

    The MICA suggestion was investigated and NOT implemented as asked, because the
    underlying claim is wrong. The deep-research report asserted that MICA
    polymorphisms modify amyloidosis risk in FMF, citing PMID:15018633, and the
    reviewer suggested adding MICA to the genetic section on that basis. Reading the
    paper's cached full text shows it reports the opposite: it tested the MICA exon
    5 polymorphism and found no association with renal amyloidosis, while confirming
    the SAA1 association in the same cohort. Adding MICA as a modifier locus would
    have propagated a DR misreading into the KB. Instead a discussions entry
    (kind: INTERPRETATION, id mica_not_a_modifier_locus) records the negative result
    with REFUTE evidence, so the next curator who reads the same DR report does not
    re-add it. This is the second DR error in this entry traced to PMID-level
    misattribution rather than fabrication.

    Thyroid and adrenal involvement remain uncurated, with the reason now stated in
    notes: the only available sentence carries no frequency and no functional claim,
    so binding it to an HPO term would assert more precision than the source
    supports.

    The reviewer's macroglossia observation was correct and is now reflected
    honestly: PMID:38568326 does list macroglossia among AA presenting symptoms, in
    a sentence this entry already quotes twice. The notes no longer imply it is
    absent from AA - it is less frequent than in AL, which is what makes it a
    discriminator rather than an AA phenotype.

    The evidence_source convention for PMID:38568326 is now documented in notes:
    HUMAN_CLINICAL where the review makes a direct clinical observation, OTHER where
    it reports the numbers of a specific primary series it summarizes.

    Validation actually run and read: just count-verified-snippets reported 95/95
    verified; just validate-disorders (the batched sweep CI runs) passed; compliance
    90.6 -> 90.7 percent global and 90.9 -> 91.0 percent weighted; pytest
    tests/test_data.py -k AA_Amyloidosis passed 11/11.

  summary: Review AA amyloidosis causes, atomic mechanisms, renal care and trial
    evidence
  details: |
    Reviewed the complete pre-existing entry after a fresh, fully paginated scan of 142 open PRs found no disorder overlap, and confirmed the history contained CREATE/EDIT but no REVIEW. Read the matching deep-research report and citation sidecar. Assessed all 22 originally cited sources at their actual available level and the two relevant GeneReviews summaries; a full-text label alone was not accepted as proof of an article body. All four originally cached full bodies were consumed: the FMF genetic study, adipocyte experiments, contemporary clinical review, and recombinant SAA/GAG paper. The last had an independent full-source mechanism audit. Original abstract-only sources were regenerated where possible, then originals restored when full text remained unavailable. No reference Markdown was hand-edited and the frozen dataset-accessions file was never accessed.

    Recovered the missing primary SAA1 promoter family (PMID:34560138), which establishes a rare autosomal dominant hereditary form and invalidates the prior claim that all AA requires inflammation or that SAA1 is only a modifier. Separated this regulatory cause from common coding susceptibility alleles and from inheritance of upstream FMF/TRAPS. Added etiologic presentations, selected promoter testing and family counseling. Removed the unsupported SAA2 susceptibility relationship while retaining its documented precursor-production biology. The full FMF paper supports an SAA1 association and a cohort-specific MICA null, not a universal absence of MICA effects. The obesity paper has inconsistent total/subgroup counts; no derived proportion was used.

    Rebuilt 15 atomic mechanism nodes separating inflammatory hepatic production, adipose production, promoter activity, precursor elevation, HDL remodeling, proteolysis, truncation-associated structure, GAG binding, fibril assembly, extracellular burden and organ consequences. The cell-free GAG study starts with lipid-free protein and does not measure HDL release. Its early acidic beta-sheet is reversible and distinct from amyloid, apparent droplets are not a proven necessary intermediate, and GAG-free controls eventually form fibrils. Deposit fragment composition does not prove cleavage precedes fibrils. Separate MMP and synthetic-truncation experiments are not forced into a proven human processing chain. Five experimental-model records and a bounded abstract-supported murine cross-seeding record preserve assay, species and readout limits.

    Corrected clinical frequency interpretation: glomerular-form prevalence is not proteinuria prevalence, a combined renal presentation is not an individual symptom denominator, and gastrointestinal involvement is not diarrhea frequency. Retained selected renal cohort and follow-up context. Removed SAA-backed CRP phenotype claims, restored less common documented manifestations, and avoided inferring endocrine failure from organ deposition. Added infection-directed treatment, antiproteinuric care, fluid management and avoidance of secondary renal injury. Historical colchicine dose/creatinine associations are no longer universal prescribing thresholds. Mixed biologic classes no longer call etanercept or anakinra monoclonal antibodies. Nonrandomized comparisons do not establish universal treatment superiority.

    Recovered and independently audited the complete initial NEJM eprodisate paper and EU confirmatory results. Both initial prespecified analyses are retained: fixed-time proportions P=.06 and time-to-event HR 0.58/P=.02; there was no significant ESKD or mortality benefit. Placebo included physician-managed inflammatory therapy and is not untreated natural history. The confirmatory trial used a different renal composite and failed superiority (HR 1.0, 95% CI 0.7–1.4; P=.882 in 260 treated participants). Irregular registry event-time cells were not imported. The generated registry summaries describe purpose rather than efficacy.

    Recovered and independently audited full primary anti-SAP extension and cardiac studies. The two AA participants each received one dose; one had renal amyloid-load reduction, without demonstrated early kidney-function or proteinuria improvement, and neither had liver deposits. The later cardiac studies enrolled ATTR/AL, not AA, and reported no deaths. Their termination followed absent cardiac efficacy and suspected large-vessel vasculitis in the AL participant; the clinical review's fatal-arrhythmia account was not repeated. This is neither proof of routine AA benefit nor an AA-specific contraindication.

    GeneReviews has no disease-wide AA chapter. The FMF and TRAPS chapters are tagged and used for their applicable clinical cause, diagnosis, preventive management and family evaluation, with disease-specific inheritance scope retained. All 32 source records are catalogued; every evidence item has a metadata-matching title and explicit provenance. Authoritative validate-disorders passed schema, live ontology terms and 167/167 exact snippets. All twenty additional repository guards passed, including the whole-KB title-snippet, reference-title and reference-cache-frontmatter checks. Existing unrelated cache-delimiter advisories were nonfatal. Independent clinical/trial and source-specific graph/model reviews found no blocking issue. Denominator, comparator and population-scope refinements are incorporated. The graph/model review refined two assembly links to INDIRECT_UNKNOWN_INTERMEDIATES because the structural and binding observations do not resolve the intervening causal sequence. History validation passed. Commit hooks applied standard formatting to the curation YAML and generated caches; parsed YAML data were unchanged. Automated PR review and CI will provide the next review round.

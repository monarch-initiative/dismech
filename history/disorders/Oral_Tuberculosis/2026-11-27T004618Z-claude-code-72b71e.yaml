  summary: 'Create: Oral_Tuberculosis'
  details: |
    New entry for oral tuberculosis (MONDO:0005887), deleting stubs/Oral_Tuberculosis.yaml. Scoped to the oral cavity proper (oral mucosa and jaw bones); larynx, cutaneous lupus vulgaris spreading to the mouth, and tonsillar/oropharyngeal disease are left to their own entries, and the boundary is recorded in notes. Primary and secondary oral tuberculosis are clinical-form subtypes; organisms and oral sites are deliberately lumped (review_notes). Pathograph: two roots (active pulmonary tuberculosis with bacilliferous sputum; breach of the oral mucosal barrier) feeding mycobacterial inoculation and hematogenous dissemination, a caseating granulomatous inflammation node conforming to granuloma_formation#Organized Granuloma Assembly, and ulceration, proliferative mass, regional lymphadenitis and jaw osteomyelitis branches reaching 14 HP phenotypes. Evidence is from two systematic reviews of pooled case reports (PMID:20486998, PMID:35785411), a 42-patient series (PMID:10673784), two full-text reviews (PMID:31143712, PMID:26366156) and case series and reports; every snippet was checked against the cached reference. Deep research: research/Oral_Tuberculosis-deep-research-claude_code.md (claude_code; the first run was marked unsuccessful and deleted, the second succeeded) was used for leads only.

  summary: 'Review round: clinical trials, unsourced cataract/glaucoma edges'
  details: |
    Added a clinical_trials block with NCT07146516 (ora secunda cerclage laser retinopexy, recruiting, phase not applicable) and NCT04465188 (prophylactic scleral buckling, phase 2, withdrawn with no enrolment); phase and status were read from the ClinicalTrials.gov API and both descriptions note that neither trial is restricted to exon 2 disease. Removed the downstream edges from Retinal Tear and Rhegmatogenous Detachment to Presenile Cataract and Glaucoma, because the only source (PMID:12429250) reports co-occurrence in one pedigree and no cited source gives a mechanism; each phenotype's notes now say why it has no inbound edge. Merged main. Validated with validate-disorders, validate-terms and the offline gates.

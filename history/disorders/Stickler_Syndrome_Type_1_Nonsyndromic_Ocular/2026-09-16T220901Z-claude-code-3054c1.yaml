  summary: 'Create: Stickler Syndrome Type 1 Nonsyndromic Ocular (MONDO:0012287, COL2A1)'
  details: >-
    Claim issue #11975. Resolved as DISEASE and curated standalone rather than as a
    has_subtypes row on Stickler_Syndrome_Type_1, which was the obvious alternative
    because MONDO places MONDO:0012287 directly under the curated MONDO:0007160.
    Three things decided it: the lesion is different in kind (haploinsufficiency of
    one alternatively spliced isoform, with the other isoform from the same allele
    intact) and contributes three pathophysiology nodes at the top of the chain
    rather than a detail hanging off the parent; the clinical pathway is different
    (vitreoretinal surveillance only, without the audiological, craniofacial and
    orthopaedic surveillance GeneReviews specifies); and it has its own primary
    literature spanning twenty-five years, including a 100-individual
    eight-generation pedigree and a 50-family mutation-screening series. This
    follows the recent standalone COL2A1 precedents #10987 and #11550.

    GENE. COL2A1, hgnc:2200, verified via the HGNC REST API (COL2A1, "collagen type
    II alpha 1 chain", 12q13.11, OMIM 120140) and confirmed independently as the
    gene for OMIM:609508 by NCBI mim2gene_medgen (GeneID 1280). The local cache
    resolves hgnc:2200 to the label COL2A1, which is what term.label carries. kb/
    was searched by label and by COL2A1 first: Stickler_Syndrome_Type_1,
    Stickler_Syndrome_Type_2, Stickler_Syndrome_Type_6 and Marshall_Syndrome all
    exist and none covers MONDO:0012287 or the exon 2 mechanism
    (grep for "exon 2", "ocular-only" and MONDO:0012287 in
    Stickler_Syndrome_Type_1.yaml returns nothing).

    CONTENT. Seven pathophysiology nodes from the exon 2 null allele through
    isoform-restricted loss of type IIA procollagen to retinal tear and detachment,
    including a modulator node (preserved type IIB in adult cartilage) that
    deliberately carries no downstream edge because what it produces is the
    non-occurrence of the systemic phenotype. Eight phenotypes, all wired: zero
    unresolved bare-name targets and zero orphan phenotypes, checked by diffing
    every downstream/sequelae/reports_on/target_mechanisms target against node and
    phenotype names. One COL2A1 genetic row, two diagnosis entries, five
    treatments, a CASES_IN_LITERATURE prevalence, three differentials, two
    knowledge-gap discussions with three proposed experiments.

    FREQUENCY BANDS. Five phenotypes carry bands, all computed from one
    eight-generation pedigree of 100 affected individuals segregating a single exon
    2 allele (PMID:12429250): RPRD 100/100 OBLIGATE, vitreous syneresis 100/100
    OBLIGATE, high myopia 76/100 FREQUENT, retinal detachment 65/100 FREQUENT,
    presenile cataract 78/100 FREQUENT, glaucoma 18/100 OCCASIONAL. The
    single-family, single-allele caveat is repeated in every one of those
    phenotypes' notes as well as in the entry notes, so it cannot be lost by
    reading one row. No band is computed from more than one source or averaged
    across sources. Three phenotypes with no usable denominator carry no band.

    HONESTY ITEMS THAT ARE CURATED RATHER THAN SMOOTHED. The exon 2 rule is not a
    law: an Arg453Ter helical-domain allele (PMID:12939326) is recorded as a REFUTE
    evidence item on the genetic block, and an intron 51 splice-site allele
    (PMID:16752401) and an exon 50 frameshift (PMID:41050055) are curated in a
    knowledge-gap discussion. "Nonsyndromic" is an overstatement the sources do not
    make: 4/100 in the largest pedigree had extraocular manifestations and the most
    recent family had scoliosis and mild hearing loss, curated as a second
    knowledge gap. Three quotes carry quote_role BACKGROUND or REVIEW_SYNTHESIS
    where the quoted sentence restates established work rather than the citing
    paper's own finding.

    ONTOLOGY TERMS. Every CURIE resolved through OLS at the time of writing with
    its canonical label copied from the lookup: HP:0000006, HP:0004327, HP:0000546,
    HP:0011003, HP:0012230, HP:0011958, HP:0007992, HP:0000518, HP:0000501,
    GO:0000184, GO:0000380, GO:0005201, GO:0030199, CL:0000138, UBERON:0001798,
    NCIT:C38060, NCIT:C19770, NCIT:C15466, NCIT:C50837, NCIT:C181743, NCIT:C15240,
    hgnc:2200. UBERON:0001796 was checked first and rejected - it is "aqueous humor
    of eyeball", not the vitreous; the vitreous body is UBERON:0001798. HPO has no
    giant retinal tear or radial perivascular retinal degeneration term, so those
    are bound to Retinal perforation and Retinal degeneration with the specific
    lesion carried in preferred_term, and each says so in its notes.

    DEEP RESEARCH. One falcon run, committed. preflight-dr returned SKIP (MONDO
    records no causal gene for this term); the manual fallback is decisive - COL2A1
    40 mentions against 3 for COL11A1 and 3 for VCAN, both of which appear only as
    differentials, exon 2 discussed 28 times, OMIM 609508 and no other disease MIM.
    The report independently reached this entry's framing, including preferring
    "predominantly ocular" to "ocular-only" for the same two reasons this entry
    curates as a REFUTE item and a knowledge gap. Nothing was bound from it; its
    leads are recorded in the entry notes. The six DOI_*.md cache files the
    report's reference validator wrote are not committed, because this entry
    cites none of them.

    VALIDATION. just validate, validate-terms, validate-disorders (batched),
    count-verified-snippets (55/55 verified, 0 skipped by prefix),
    check-entity-refs, check-duplicate-keys, check-causal-targets,
    check-qualifier-terms, check-enum-values, check-folded-hyphens,
    check-title-snippets, check-snippet-length, check-snippet-grading,
    check-stubs, validate-history. Two snippet transcription errors were caught by
    re-reading the cache before the first validate run - a duplicated clause in the
    frequency-table quote and two non-adjacent sentences concatenated - and both
    were corrected against the cached text rather than by relaxing the matcher.

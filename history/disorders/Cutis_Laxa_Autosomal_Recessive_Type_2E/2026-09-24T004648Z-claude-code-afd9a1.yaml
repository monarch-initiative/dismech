  summary: 'Create: Cutis_Laxa_Autosomal_Recessive_Type_2E'
  details: |
    New entry for autosomal recessive cutis laxa type 2E (MONDO:0030337, OMIM #619451), LTBP1-related cutis laxa syndrome.

    Deep research: one report, research/Cutis_Laxa_Autosomal_Recessive_Type_2E-deep-research-claude_code.md. falcon was requested and returned HTTP 402 (ProviderBillingError, account out of credits); the run fell back to claude_code, which the report frontmatter records (fell_back: true, requested_provider: falcon). The report's Reference Validation section reports 4/4 references resolved, 0 unresolved, 0 off topic; it carries no Term Validation section, so every CURIE in this entry was looked up independently rather than taken from the report. just preflight-dr returned PASS (intended entity MONDO:0030337, canonical gene LTBP1, 32 mentions, OMIM 619451 matching on both sides).

    Report content treated as a lead and checked against the primary source. Two report claims were wrong and were corrected from the cached full text: the report described PMID:34861177 as an author-name correction, when it is in fact a variant-nomenclature correction changing the family 3 allele from c.3991_3995del (p.Thr1331Asnfs*20) to c.3991dup (p.Thr1331Asnfs*22) - the corrected form is what this entry records; and the report suggested HP:0001636 for tricuspid regurgitation, which is Tetralogy of Fallot (HP:0005180 is the correct term).

    Evidence: 125 snippets, all verified against cached references by just count-verified-snippets. Sixteen of the entry's 41 phenotypes carry a causal inlink (just list-disconnected-phenotypes); the craniofacial, sensory, gastrointestinal and urological features are left unconnected because the source offers no mechanism for them, and the entry notes say so. References cited: PMID:33991472 (Pottie et al. 2021, the founding cohort; full text cached), PMID:34861177 (its erratum), PMID:35452817 (LTBP1 coordinates fibrillin incorporation, TGF-beta-independent), PMID:25960419 (LTBP family review, cited for the paralog-redundancy hypothesis), PMID:17804598 (Ltbp1L-null mouse, cited for the species mismatch), PMID:38318288 (craniosynostosis sequencing cohort, cited as NO_EVIDENCE in a knowledge-gap discussion so it is not mistaken for a replication cohort). PMID:17804598 was re-fetched during this session because the previously cached copy had an empty Content section.

    Baselines checked and recorded as absent: just check-genereviews --online returns NO_CHAPTER for both GeneReviews and StatPearls; the Orphadata en_product1.xml release pinned in data/orphadata/MANIFEST.yaml was grepped and contains no LTBP1 mention and no type 2E disorder. A PubMed search for LTBP1 with cutis laxa/ARCL2E/craniosynostosis returned only four records, confirming no second cohort. Those negative results are recorded in the entry notes with the queries that produced them.

    Lump/split: curated as a standalone Disease entry rather than a has_subtypes entry on an ARCL2 parent. There is no ARCL2 parent entry in this KB, the type 2 numbering spans mechanistically unrelated genes (V-ATPase subunits, PYCR1, LTBP1), and ARCL2E has its own MONDO and OMIM identifiers plus a single causal gene. The within-entry split of the N-terminal and C-terminal truncation classes into has_subtypes was considered and rejected: the two classes differ in cell culture but have no demonstrated clinical correlate, so they are modelled as two pathophysiology branches instead. Both decisions and their reasoning are in the entry notes.

    No conforms_to declared. aortopathy_tgfbeta_dysregulation was evaluated at the suggestion of the automated second opinion on issue #12638 and rejected: the module scopes itself to thoracic aortic aneurysm and dissection and runs through medial degeneration to dilation, none of which is reported in ARCL2E, whose cardiac findings are a septal defect and mild valvular and ventricular changes. No elastic-fibre-assembly module exists in kb/modules/.

    Validation run: just validate, just count-verified-snippets (114/114), just validate-terms, just check-duplicate-keys, just check-entity-refs, just check-causal-targets, just check-qualifier-terms, just check-qualifier-terms-online, just check-enum-values, just check-snippet-length, just check-title-snippets, just check-snippet-grading, just check-folded-hyphens, just check-environmental-evidence, just check-coarse-phenotypes, just check-reference-titles, just list-gene-term-mismatches, pytest tests/test_data.py -k Cutis_Laxa, and just validate-disorders.

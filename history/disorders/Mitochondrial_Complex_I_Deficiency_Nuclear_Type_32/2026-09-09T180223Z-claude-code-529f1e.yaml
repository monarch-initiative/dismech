  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 32 (MONDO:0032635,
    NDUFB8)'
  details: |
    De novo curation of MC1DN32 (MONDO:0032635), the NDUFB8-related isolated complex I
    deficiency, as a standalone kb/disorders entry.

    Lump/split decision. entry_type DISEASE, standalone. dismech already curates the numbered
    MC1DN series as separate per-gene files (nuclear types 1, 2, 3, 6, 12, 14, 21, 23, 24, 31,
    33, 34, 36, 39), and ClinGen's Mitochondrial Diseases Gene Curation Expert Panel states
    that NDUFB8 has been associated with a single disease entity to date, so there is no
    allelic series to lump. The stub is deleted because MONDO:0032635 is now bound by this
    entry's disease_term.

    Gene identity. NDUFB8 (hgnc:7703), from the stub's MONDO RO:0004003 assertion, cross-checked
    against OMIM 618252 via mim2gene_medgen (NCBI GeneID 4714) and against the ClinGen
    gene-validity record. ClinGen grades the relationship Moderate, not Definitive, on three
    unrelated cases from two publications; the entry says so in genetic.notes and in the
    prevalence and phenotype frequency notes rather than presenting the entity as better
    established than it is.

    Preflight on the issue's warning. The issue flagged NDUFB8 mentions in
    COA5-Related_Fatal_Infantile_Cardioencephalomyopathy, Combined_Oxidative_Phosphorylation_Defect_Type_30
    and Combined_Oxidative_Phosphorylation_Deficiency_48. Those were checked and are indeed
    subunit-list or immunoblot-readout mentions, not causal-gene assignments; no existing entry
    binds MONDO:0032635 or claims NDUFB8 causation. The same confusion is the dominant hazard in
    this gene's literature - NDUFB8 is the standard antibody probe for complex I in OXPHOS
    immunoassay panels - and that is recorded at length in the genetic block so a future curator
    does not attach a PUS1, MCAT or EARS2 paper to this entry.

    Evidence base. Five references. PMID:29429571 is the defining 2018 AJHG report (abstract
    only; no full text retrievable). PMID:33233646 is a 2020 review with a dedicated NDUFB8
    section that reproduces the per-patient allele analysis, the exonic-splicing-silencer
    finding and the structural contact map; where a claim depends on that second-hand account
    the evidence item cites the review rather than the paper it summarises. PMID:30770271
    supplies the third patient (cavitating leukoencephalopathy cohort). PMID:27626371 is the
    systematic accessory-subunit knockout survey. PMID:29142257 documents the NDUFB8-based
    OXPHOS immunoassay and is cited in diagnosis for the directionality trap. One ClinGen
    gene-validity assertion (CGGV:assertion_ef011d17-...-2024-11-18) was newly built into
    references_cache for this entry.

    Frequency discipline. Denominators are two and three, so every band carries its numerator in
    notes and none is graded OBLIGATE. Left ventricular hypertrophy is FREQUENT on 1 of 2 - the
    source's own parenthetical "encephalo(cardio)myopathic" signals the cardiac component is not
    universal, and the review attributes it to Patient 1 specifically. Seizure is OCCASIONAL
    because it appears only in a ClinGen feature list with no count and is absent from the 2018
    abstract. Cavitating leukoencephalopathy is OCCASIONAL on 1 of 3 with a note that the
    denominator is distorted by phenotype-first ascertainment.

    Pathograph. Eleven nodes from biallelic variant through subunit depletion, assembly failure,
    isolated enzyme deficiency and impaired NADH-linked OXPHOS to three tissue-level failure
    nodes. All ten phenotypes are wired; a scripted diff of every downstream target against node
    and phenotype names returned zero dangling targets and zero unwired phenotypes. The exonic
    splicing silencer created by c.432C>G is curated as its own node because that allele's
    molecular consequence is not what its protein nomenclature suggests.

    Honest absences. No animal model, no dataset accession, no prevalence rate, no treatment
    evidence, no patient complexome profile and no residual-activity percentages exist for this
    entity. The treatments section carries a single evidence-free supportive-care record with a
    note saying why, and a KNOWLEDGE_GAP discussion records the missing patient assembly data
    against the sibling entries that do have it.

    Validation. just validate (schema, terms, references) passed with 59/59 snippets verified
    against cached references and no prefix skips. check-entity-refs, check-duplicate-keys,
    check-causal-targets, check-enum-values, check-qualifier-terms, check-folded-hyphens,
    check-title-snippets all clean.

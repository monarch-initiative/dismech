  summary: 'Review round 2: bind HP:0033369, tag GeneReviews, narrow a notes claim
    (MC1DN32)'
  details: |
    Response to the second ai4c-reviewer round on PR #11544. Three items, all accepted.

    1. Cavitating leukoencephalopathy was bound to HP:0002352 (Leukoencephalopathy) with a notes
    sentence saying HPO has no cavitating-leukoencephalopathy term. The reviewer is right and the
    sentence was false: HP:0033369 'Cavitating leukodystrophy' exists, is already in
    cache/hp/terms.csv and in the phenotype-term enum cache, and is already bound for this same
    imaging phenotype in COA8-Related_COX_Deficiency. Rebound to HP:0033369; preferred_term keeps
    the source's wording ('Cavitating leukoencephalopathy'); the false sentence is replaced by one
    naming the sibling entry the binding follows. No cache row was added - the term was already
    cached.

    2. PMID:26425749, Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview, is now tagged in the
    top-level references block with tags: [GeneReviews], following the convention in MC1DN2,
    MC1DN6, MC1DN23, MC1DN34 and MC1DN36, and a notes paragraph explains why it is deliberately
    not cited as evidence: the cached record carries the chapter header and author list and no
    clinical content. The paragraph adds one thing the sibling entries do not need to say - the two
    2018 patients are described as Leigh-*like* rather than as Leigh syndrome, so the chapter's
    scope is adjacent to this entity rather than covering it.

    3. The notes said residual complex I activity percentages 'have not been published for this
    entity'. The reviewer found, from the falcon report this PR carries, that they have been - in
    the AJHG full text. The claim was wrong in the same way as item 1: a statement that something
    does not exist, where the truth is that it was not reachable. The sentence is narrowed to say
    the figures exist and are unquotable here because PMID:29429571 is abstract-only in this
    repository's cache, and that a curator with journal access should add them. The complexome
    claim in the same paragraph is confirmed by the report and is kept.

    No other change. The activity figures themselves were not curated, as the reviewer asked.

    Validation after the edit: just validate passed with 59/59 snippets verified,
    check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values,
    check-qualifier-terms and check-folded-hyphens all clean.

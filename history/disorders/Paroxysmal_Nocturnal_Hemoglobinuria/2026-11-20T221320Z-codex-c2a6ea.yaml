  summary: Align the non-Mendelian PNH family and add PIGT-PNH coverage
  details: |
    The named PNH disease family aligns with the phenotypic series. The January 2026 source enumerates PIGA-associated PNH1 (OMIM:300818) and PIGT-associated PNH2 (OMIM:615399). This mapping does not imply Mendelian inheritance, identical proximal mechanisms, or an exhaustive catalog of every possible GPI-pathway cause of PNH. Broadened the overview and replaced the stale PNH2-gap note; detailed PIGT mechanisms remain in a dedicated entry.

  summary: 'Review round 2: correct the PNH2 mapping justification'
  details: |
    Answers blocking finding 2 of review round 2. The MONDO:0014166 mapping_justification described PNH2 as 'a distinct germline PIGT-related form, mechanistically different from the acquired somatic PIGA disease', which reads as an inherited, non-clonal disorder. It is not one. Verified against OLS: MONDO's own synonym for the term is 'paroxysmal nocturnal hemoglobinuria 2, autosomal dominant, somatic mutation', and OMIM 615399 rests on Krawitz et al. 2013, a case caused by a germline hypomorphic PIGT allele unmasked by a somatic second hit. PNH2 is still a somatically driven clonal hematopoietic stem cell disease; what distinguishes it from the PIGA form this entry models is the germline first hit and the gene, not the absence of a somatic event. Rewrote the justification to say that, quoting MONDO's synonym. The mapping_predicate remains skos:narrowMatch and the term binding is unchanged. Validation: just validate 35/35 snippets, validate-terms passed, check-duplicate-keys, check-entity-refs, check-enum-values all pass.

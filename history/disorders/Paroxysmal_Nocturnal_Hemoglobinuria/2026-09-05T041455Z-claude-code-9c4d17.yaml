  details: |
    Added an inheritance block bound to HP:0001442 describing PNH as an acquired clonal disorder (evidence: PMID:41002734 and PMID:19707355, both already cited in the entry); set variant_origin SOMATIC on PIGA. This follows the VEXAS precedent for acquired clonal haematopoietic mosaicism.Part of the somatic-mosaicism normalization tranche. Convention applied across the tranche: a disorder whose causal variant is post-zygotic (or which has a recognized post-zygotic arm) carries an inheritance block bound to HP:0001442 (Typified by somatic mosaicism) with its own snippet-backed evidence, plus variant_origin SOMATIC on the causal gene. Every evidence snippet reused here was already present and verified elsewhere in the same entry, or is an exact substring of an already-cached reference; no reference cache file was created or edited. Validation: just validate, just count-verified-snippets, just validate-terms, check-snippet-grading, check-enum-values, check-duplicate-keys, check-entity-refs and check-causal-targets all pass on the edited file. The entry was added as a member of the new kb/groupings/Somatic_Mosaic_Disorders.yaml grouping.

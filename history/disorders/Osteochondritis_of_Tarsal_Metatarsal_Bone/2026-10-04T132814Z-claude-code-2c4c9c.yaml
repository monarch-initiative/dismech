  summary: Conform ischemic bone necrosis nodes to ischemic_bone_necrosis_and_repair
  details: |
    Added conforms_to links to the ischemic_bone_necrosis_and_repair module on both
    pathophysiology nodes: Disturbed Navicular Ossification and Circulation -> Bone
    Vascular Supply Interruption; Navicular Osteonecrosis and Structural Remodeling ->
    Structural Failure of Necrotic Bone under Mechanical Load. The entry has only these two
    nodes, so the module's cell-death, growth-plate and repair-phase nodes have no
    conformer here; the second node bundles necrosis, remodeling and structural change and
    was mapped to the structural-failure node because its bindings and description are
    about sclerosis, flattening and fragmentation under load. The epiphyseal-arm nodes were
    not declared because the entry has no node describing cartilage-canal chondronecrosis
    as such. No node content was changed.

  summary: 'Create: Thrombocytopenia_9'
  details: |
    New entry for thrombocytopenia 9 (THC9, OMIM 620478), the autosomal dominant mild thrombocytopenia caused by monoallelic loss-of-function THPO variants. Inheritance, phenotype and mechanism come from the defining cohort (PMID:32150607, full text) and from heterozygous carriers in families with biallelic THPO disease (PMID:24085763, 36226497, 40386912, 39479124), with the Thpo knockout mouse (PMID:8627177) for gene dosage and megakaryopoiesis. Biallelic THPO disease (CAMT2, MONDO:0957575) and gain-of-function thrombocythemia 1 are recorded as differential diagnoses, not subtypes, following OMIM/MedGen, which define THC9 as autosomal dominant and CAMT2 as autosomal recessive. The OpenScientist deep-research report was run and committed but used only as a lead: it describes THC9 as autosomal recessive aplastic anemia, which is CAMT2, and never cites PMID:32150607. Its references were 20/20 resolved and 15/15 quotes valid; preflight-dr returned WARN (TPO counted as a second gene; it is the protein name; OMIM cited 600044 and 187950, not 620478). Filed as issue 15234. PMID:28466964 (Noris 2018) has no abstract in PubMed and was not cited. Thrombopoietin receptor agonist evidence is from biallelic patients and is marked INDIRECT. Platelet size is reported both increased (PMID:32150607) and normal (PMID:36226497); both recorded with a KNOWLEDGE_GAP discussion. Validation: just validate, validate-terms, count-verified-snippets (34/34), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-block-scalar-comments, KB-wide snippet gates, check-genereviews --online (NO_CHAPTER).

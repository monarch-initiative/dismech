  summary: Review ASH1L phenotype specificity, source scope and causal hypotheses
  details: |
    Reviewed all 19 original phenotypes against full Falcon/citations, clinical narratives and labelled patient tables, then added 36 case-scoped findings. Rebound compulsive behavior to obsessive-compulsive trait; separated ID from combined ID/DD and corrected seven unsupported frequency claims. Preserved TNR gait and POU4F3/ATP2B2 hearing confounds, missense-case uncertainty and original hypothyroidism versus secondary hyperthyroidism transcription. Distinguished direct H3K36 catalysis from indirect promoter H3K4me3 changes. Replaced bundled clinical mechanism endpoints and generic developmental fanout with evidence-qualified transcription, pruning, excitability, arborization and hypothalamic hypotheses. Retained causal gene-dosage evidence despite unknown intermediates while documenting actual attribution, genotype and model-translation gaps. Preserved prior history and all model assay readouts. All newly changed evidence titles copied exactly from fetched metadata.

  summary: 'Create: Intellectual Disability Autosomal Dominant 52 (ASH1L)'
  details: |
    De novo creation of the MRD52 / ASH1L entry from the stub
    stubs/Intellectual_Disability_Autosomal_Dominant_52.yaml, closing issue #9580.

    Entry-type decision: Disease. The stub carries no mondo_descendant_count, and
    `runoak -i sqlite:obo:mondo info MONDO:0030918 -O obo` returns a leaf term with
    one RO:0004003 causal-gene relationship (HGNC:19088, ASH1L) and an OMIM:617796
    xref.

    Naming note recorded in the entry description rather than acted on: the
    OMIM/MONDO label names only the cognitive component, while the entity ClinGen
    curated (and classified Definitive) is a syndromic complex neurodevelopmental
    disorder. The entry curates the broader phenotype under the MONDO identifier the
    stub supplied, and lists the ASH1L-related names as synonyms.

    Curated from primary literature: PMID:38674358 (Brain Gene Registry review with
    the phenotype-frequency tabulation and denominators), PMID:28191889 (Stessman
    2017 gene delineation), PMID:34373061 and PMID:39902220 (further patients plus
    genotype-phenotype review), PMID:34782621 (prefrontal knockdown, chromatin and
    electrophysiology), PMID:35081333 (haploinsufficient mouse, EPHA7 pruning),
    PMID:34145365 (developing-brain knockout), PMID:38943682 (cortical patterning and
    craniofacial), PMID:39766886 (gene-trap haploinsufficient model).

    Mechanism model: 12 pathophysiology nodes, 14 edges, one root, no unreachable
    node. Chain runs heterozygous ASH1L loss of function -> reduced methyltransferase
    activity -> loss of activating promoter marks -> downregulated synaptic and
    neurodevelopmental gene programmes, which is the branch point. Three arms
    descend from it: synaptic pruning failure (EPHA7/EZH2 route), cortical
    excitation-inhibition imbalance conforming to three nodes of
    kb/modules/epilepsy_excitation_inhibition_imbalance.yaml, and disrupted cortical
    neuron specification. An extraneural arm carries the genital, musculoskeletal and
    craniofacial findings.

    Phenotype frequency bands are all carried by explicit denominators from the 2024
    review's tabulation, and every explanation states the fraction, the resulting
    percentage, and the band it maps to. The denominators are small (4-16) and the
    explanations say so; the facial-dysmorphism explanation additionally records the
    source's own warning that the figure is likely inflated by unreported negative
    assessments.

    Deliberately not curated: no genotype-phenotype subtype split on missense versus
    truncating alleles (two sources take opposite positions and no functional assay
    exists for any human missense allele) - recorded as a KNOWLEDGE_GAP. No single
    histone mark asserted as the disease-relevant one; both H3K36 and H3K4 are
    curated on the enzyme node with the discrepancy carried as a KNOWLEDGE_GAP. No
    treatment claim beyond empirical antiseizure medication and supportive
    developmental care; the diazepam/chemogenetic rescue is model-only and lives in
    the HUMAN_MODEL_MISMATCH discussion rather than in `treatments`.

    Deep research: `just research-disorder falcon` run, report committed. NEC
    preflight PASS (ASH1L=34 mentions). Nothing was curated from the report. Two
    provider defects observed and not propagated: the report gives ASH1L as
    HGNC:19208 (the correct identifier is HGNC:19088), and its evidence base is one
    PMID plus a bioRxiv preprint, missing the entire clinical phenotyping literature
    including PMID:38674358; only 1 of its 4 references was scored on topic.


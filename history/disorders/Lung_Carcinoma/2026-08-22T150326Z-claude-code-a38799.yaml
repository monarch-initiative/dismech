  summary: Add alveolar type 2 / respiratory epithelial plasma proteomic aging clock
    biomarker
  details: |
    Curated the alveolar type 2 and respiratory epithelial cell aging clocks from Ding et al. (PMID:42297981, Nat Med 2026) as a biochemical biomarker with a PREDICTS readout onto Oncogenic Driver Mutations in NSCLC. HR 8.39 (alveolar type 2) and 8.47 (respiratory epithelial lineage) for incident lung cancer over 15 years of UK Biobank follow-up. The claim that earns the entry is incremental value over smoking: current smokers with extreme aging in both compartments carried HR 15.33 versus 9.69 for current smoking alone (58% higher hazard), and both signatures stayed prognostic after adjustment for age, sex, smoking status and estimated pack-years. The readout is anchored on the authors' cell-of-origin argument (alveolar type 2 cells are the origin of lung adenocarcinoma), and the interpretation states explicitly that the study does not show the age gap predicts any specific driver lesion. Bound to CL:0002063 and CL:0002368, grounded to NCIT:C97139 Proteomic Profile. This entry had no biochemical section before. Validation: linkml-validate clean; term validation passed; reference validation --no-full-text exit 0; new snippets confirmed as exact literal substrings of the cached full text.
    Source of this curation: the Cell Reports Medicine Spotlight by Heikal & Salama
    (PMID:42612620, doi:10.1016/j.xcrm.2026.102996), which surveys Ding et al.
    All numbers were taken from the primary paper rather than the commentary.
    Companion records in the same tranche: Alzheimer_Disease (astrocyte, OPC,
    inhibitory neuron) and Amyotrophic_Lateral_Sclerosis (skeletal myocyte).

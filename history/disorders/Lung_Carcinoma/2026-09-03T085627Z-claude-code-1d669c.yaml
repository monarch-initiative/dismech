  summary: Bind both NSCLC lineages on the driver-mutation node
  details: |
    Follow-up to PR review (monarch-initiative/dismech#10629), non-blocking suggestion. The backfill had borrowed a single bronchial epithelial cell binding onto 'Oncogenic Driver Mutations in NSCLC', so this broad lung pool derived one cell of origin while its own narrower subtype entry (Non-Small_Cell_Lung_Cancer) correctly derives two. The broad entry is where the lump/split question is more pressing, so under-reporting it there was backwards. Added pulmonary alveolar type 2 cell (CL:0002063) alongside bronchial epithelial cell (CL:0002328), matching how the NSCLC entry binds its equivalent node: adenocarcinoma arises from alveolar type 2 cells, squamous carcinoma from bronchial epithelium. Lung_Carcinoma now reports MULTI_ORIGIN_CELL, which is the correct signal for a pool spanning both.

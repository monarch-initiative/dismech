  summary: Split NSCLC driver lesions, replace SCLC GO:0005515 and route chemotherapy
    to SCLC proliferation, and add radiotherapy plus ALK/KRAS/SCLC-immunotherapy regimens
  details: |
    Split Oncogenic Driver Mutations in NSCLC into atomic somatic lesion nodes for EGFR Activating Mutations in NSCLC, KRAS Activating Mutations in NSCLC (GO:0003924 GTPase activity DECREASED), and ALK Oncogenic Fusions in NSCLC while retaining CL:0002063 and CL:0002328 cell_types on each somatic lesion node, and updated EGFR biomarker readout and osimertinib target_mechanisms accordingly. Replaced overly broad GO:0005515 (protein binding) on TP53 and RB1 Tumor Suppressor Inactivation in SCLC with GO:0140297 (DNA-binding transcription factor binding, DECREASED), added downstream CELLULAR node Unrestrained Neuroendocrine Tumor Cell Proliferation in SCLC (GO:0008283 INCREASED, CL:1000223), and retargeted Chemotherapy from the RB1/TP53 loss-of-function lesion to Unrestrained Neuroendocrine Tumor Cell Proliferation in SCLC. Added Radiation Therapy (RADIOTHERAPY, NCIT:C15313), ALK Tyrosine Kinase Inhibitor Therapy (Alectinib, CHEBI:90936), KRAS G12C Inhibitor Therapy (Sotorasib, CHEBI:178199), PD-L1 Checkpoint Blockade with Platinum-Etoposide in SCLC (Atezolizumab NCIT:C106250 and Durvalumab NCIT:C103194), Large Cell Lung Carcinoma subtype (MONDO:0003050), and PMID:27942407 evidence on the Intrathoracic Local Invasion and Airway Compression to Chest Pain edge.

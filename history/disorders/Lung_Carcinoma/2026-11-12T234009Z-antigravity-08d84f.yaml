  summary: Review and enrich Lung_Carcinoma classifications, subtypes, somatic drivers,
    causal graph, diagnosis, and targeted/immunotherapy treatments
  details: |
    Audited all existing claims, snippets, evidence_source, quote_role, and ontology bindings in Lung_Carcinoma.yaml while preserving pathograph nodes verbatim. Added synonyms, ICD-O morphology (Carcinoma) and Harrison's chapters (ONCOLOGY_HEMATOLOGY, RESPIRATORY), bound subtype_term on all subtypes and added Squamous Cell Lung Carcinoma (MONDO:0005097), curated somatic driver alterations (EGFR, KRAS, ALK, TP53, RB1), expanded pathophysiology to 7 atomic scale-typed nodes with molecular_functions, locations, conforms_to, and bare-name downstream edges connecting all 5 phenotypes (added Hemoptysis HP:0002105), added 4 diagnosis modalities (histopathology, molecular profiling, chest CT, PD-L1 IHC), and enriched treatments with platinum chemotherapy, surgical resection, osimertinib EGFR TKI (PMID:34273294), and pembrolizumab PD-1 blockade (PMID:27718847) alongside Iloprost.

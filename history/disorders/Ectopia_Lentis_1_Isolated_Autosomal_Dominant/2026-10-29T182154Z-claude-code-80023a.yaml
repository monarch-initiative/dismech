  summary: 'Create: Ectopia_Lentis_1_Isolated_Autosomal_Dominant'
  details: |
    New entry for FBN1-related isolated ectopia lentis (MONDO:0007514, OMIM 129600). No deep-research provider was run (no provider API keys in the environment); literature was gathered by PubMed E-utilities searches for isolated/familial ectopia lentis with FBN1 and ADAMTSL4, and every cited PMID was cached with just fetch-reference. Kept as a separate Disease entry rather than a Marfan_Syndrome subtype: MONDO and OMIM keep the concept, and the revised Ghent nosology names it ectopia lentis syndrome, with the boundary set by whether the FBN1 variant has been reported with aortic disease (Chandra 2015, PMID:24635535); the continuum is recorded in notes and in a cardiovascular-surveillance treatment. Two-node pathograph (germline FBN1 variant -> defective zonular fibrillin-1 microfibrils -> ectopia lentis) with ectopia lentis sequelae to high myopia, astigmatism, glaucoma and rhegmatogenous retinal detachment. No mechanism module fits zonular failure, so no conforms_to. Differentials: Marfan syndrome, ADAMTSL4 recessive ectopia lentis, Weill-Marchesani syndrome, classic homocystinuria. Validated with just validate, count-verified-snippets, validate-terms, the offline entity/causal/enum/duplicate/coarse/qualifier gates, and validate-disorders.

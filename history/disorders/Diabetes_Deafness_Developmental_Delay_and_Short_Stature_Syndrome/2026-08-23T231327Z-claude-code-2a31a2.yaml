  summary: 'Edit: MANF syndrome - review round 1 corrections'
  details: |
    Review round 1 on PR #9334, four IMPORTANT findings, all correct and all invisible to deterministic validation. First, two diagnosis entries had been appended into the inheritance list because an insertion anchored on the wrong section; content making no inheritance claim was sitting in the inheritance block and is now under diagnosis. Second, the deafness phenotype was bound to HP:0000407 Sensorineural hearing impairment while the phenotype's own name asserts bilaterality and the source says bilateral; rebound to HP:0008619 Bilateral sensorineural hearing impairment. Third, the pathograph was in two components: the extrapancreatic node had no incoming edge. It is now wired to the Loss of ER Stress Attenuation node as INDIRECT_UNKNOWN_INTERMEDIATES, with the edge carrying its own evidence and its own honest strength - the link rests on the authors' argument from the behaviour of related ER-stress diabetes syndromes and on two different variants producing the same extrapancreatic picture, not on a traced pathway. Fourth, the brefeldin A result was overstated in the narrative as 29 percent of knockout cells against far fewer wild-type when the source says 29 percent against 18 percent; both numbers are now in the narrative and the snippet was extended to cover the comparison, because against an 18 percent baseline the finding is a shift in susceptibility rather than a switch between survival and death, and quoting only the higher number implied a starker result than the experiment produced. Validation after the fixes: 'just validate' passes with 40 of 40 snippets verified against cached references, 'just validate-terms' passes, model-readout and conforms_to tests pass, ungated CI gates clean.

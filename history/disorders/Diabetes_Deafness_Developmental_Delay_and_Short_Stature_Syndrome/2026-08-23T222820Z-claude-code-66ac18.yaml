  summary: 'Create: Diabetes Deafness Developmental Delay and Short Stature Syndrome
    MONDO:0957997'
  details: |
    Curated de novo from a Perplexity sonar-deep-research report that passed 'just preflight-dr' against MONDO:0957997 with a PASS verdict: canonical gene MANF mentioned 244 times, OMIM 620651 matching the MONDO xref. The report also names OMIM 222300 and 601916, Wolfram syndrome and WFS1, which are the expected differential for syndromic diabetes with deafness rather than a sign of entity confusion. The report validated only three references and carried one PubMed link, so the entry rests on the defining paper plus the mouse study, both located and read directly - a thin corpus because the disease is thin, with two patients described and a negative screen of 187 further candidates. The pathograph is built on the human hESC-knockout result rather than the mouse: MANF loss removes an ER stress buffer, and human MANF-null beta cells develop normally but lose tolerance of a block in secretory export, discriminated by brefeldin A but not by tunicamycin or thapsigargin. A HUMAN_MODEL_MISMATCH discussion records the divergence from the Manf-null mouse, which loses beta-cell mass through reduced proliferation and increased apoptosis, while noting the authors' own reading of part of the difference as one of rate and their statement that the mouse neurological phenotypes resemble the human ones. Three false negative assertions in the first draft were caught by grepping the cached full text for the facts rather than for strings, and corrected before commit: the draft claimed no reference described a treatment given to a patient (both patients are on insulin, now curated as a treatment; a nearby metformin statement turned out to describe the heterozygous father of case 1 with ordinary type 2 diabetes and is deliberately not curated), it claimed no mechanism was offered for the extrapancreatic features (the discussion proposes brain ER-stress sensitivity by analogy with other ER-stress diabetes syndromes and cites mouse inner-ear hair-cell death and a diabetes-independent mouse growth defect), and it missed case 2's partial hypopituitarism entirely, which is both a phenotype and an alternative sufficient explanation for that patient's short stature. Two schema errors were also caught and fixed: experimental_model_type STEM_CELL_DERIVED is not a permissible value (changed to IPSC_DERIVED_MODEL) and GO:0034976 was placed under molecular_functions when it is a biological process. Validation: 'just validate' passed with 38 of 38 snippets verified against cached references, including full-text quotes; 'just validate-terms' passed; the model-readout-target and failure-to-recapitulate tests passed; the ungated CI gates are clean.

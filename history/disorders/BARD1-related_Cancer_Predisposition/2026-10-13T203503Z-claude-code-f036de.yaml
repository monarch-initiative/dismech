  summary: 'Create: BARD1-related_Cancer_Predisposition'
  details: |
    Created the entry for MONDO:0700267 from primary literature, the cached ClinGen gene-disease validity records, and one deep-research report used only as a lead. Falcon (Edison) was the assigned deep-research provider but failed twice with '503 Failed to authenticate' before any provider task was created (once at 20:16 UTC and again after a ten-minute wait); no falcon report exists. One claude_code report was run instead (research/BARD1-related_Cancer_Predisposition-deep-research-claude_code.md). That report did not find the ClinGen assertion, treated the 2023 haploinsufficiency preprint as unpublished (it is PMID:37688570), and said no human two-hit data existed; each of those was checked against primary sources and superseded. Its secondary sources (payer policy, NSGC news item, FORCE, NHS Genomics Education, Rofes 2021) were not cited.

    Lump/split: ClinGen (CGGV assertion 09113d8c, Definitive, AD, Hereditary Cancer GCEP, 2024) lumps breast cancer and neuroblastoma into MONDO:0700267 and curates BARD1-familial ovarian cancer (MONDO:0016248) separately as Disputed (CGGV assertion 02af8326). The entry follows that: breast carcinoma and neuroblastoma are phenotypes; ovarian cancer is a CONTROVERSY discussion with REFUTE evidence (ClinGen, Suszynska 2020 pooled OR, Ramus 2015, Weber-Lassalle 2019) and the one supporting study (Norquist 2016) with its BRCA1 co-carrier caveat. Common-variant 2q35 GWAS susceptibility to neuroblastoma (Capasso 2009) is recorded only as a boundary in a knowledge-gap discussion, not as a phenotype. No constitutional biallelic BARD1 phenotype was found (PubMed query recorded in the discussion); recorded as a knowledge gap.

    Pathograph: germline BARD1 LOF (GO:0061630 ubiquitin protein ligase activity, decreased) and somatic second hit -> impaired BRCA1-BARD1 homologous recombination (GO:0000724) -> genomic instability/HRD -> breast carcinoma and neuroblastoma; HR defect -> PARP/platinum sensitivity (talazoparib case report). Conformance declared to germline_two_hit_tumor_predisposition, dna_repair_synthetic_lethality and genome_instability_mutation nodes.

    Validation: just validate, count-verified-snippets (56/56), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-genereviews (no GeneReviews chapter in the 2026-09-10 index), list-gene-term-mismatches, check-block-scalar-comments, the whole-KB ungated gates, the gene-activity grounding script, and validate-disorders.

    Gaps: no GeneReviews chapter; current NCCN text not read directly (surveillance cites a 2022 review table adapted from NCCN v2.2022); absolute neuroblastoma penetrance and any pediatric surveillance recommendation not found; possible cohort overlap between the two neuroblastoma case-control studies not assessed; preflight-dr could not run (no local mondo.db, exit 2).

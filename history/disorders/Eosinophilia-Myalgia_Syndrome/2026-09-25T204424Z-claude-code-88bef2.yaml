  summary: 'Review round 1: wire the pulmonary branch (PR #12853)'
  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED review on PR #12853. One blocking finding and four suggestions; all are answered in a single push.

    Blocking: the lung had phenotypes and no pathophysiology node. Dyspnea, Decreased DLCO and Pulmonary arterial hypertension had no incoming edge, and the entry notes listed which gaps were deliberate without listing those three. The reviewer was right that this read as an omission rather than a scoping decision, and it was one: the entry's own clinical_burden quotes 81% of the 36 reported deaths as having pulmonary complications. Added Pulmonary Eosinophilic and Lymphocytic Inflammation, a TISSUE node downstream of both Eosinophil Expansion with Tissue Degranulation and T Cell Mediated Immunity Against Extracellular Matrix, and upstream of Dyspnea and Decreased DLCO. It is grounded in four quotes from PMID:1582284, which was already cached and already cited: BAL eosinophils in two patients and lymphocytes in a third, raised CD8+ proportion in BAL, fibroblast proliferation-stimulating activity in BAL that fell to normal on corticosteroid, and abnormal HRCT in four patients. GO:0048144 fibroblast proliferation is bound here as well as on the dermal node, because the lavage measurement is the one figure anywhere in the entry that reverses under treatment. Pulmonary arterial hypertension is deliberately left unwired: it rests on one patient in a six-patient series and no cited source connects the inflammation to vascular remodelling. The entry notes now say all of this, including why the one exception is an exception.

    Suggestion 2 accepted, and it reverses part of the pre-PR self-review. GO:0032604 granulocyte macrophage colony-stimulating factor production was dropped from the Type 2 Cytokine Response to Peak E node. The reviewer's argument is the entry's own argument turned around: GM-CSF is not a type 2 cytokine, PMID:7797795 attributes the response to endotoxin rather than to peak E, and the REFUTE evidence item attaches to the node regardless, which was the reason the descriptor was never needed. The node now binds GO:0032634 alone and its notes record all three attempts, because the first two were each wrong in ways no validator could see.

    Suggestion 1 accepted after a PubMed pass. The reviewer noted that weight loss, paresthesia and xerostomia appear in the deep-research report with frequencies and in no cached abstract, and asked for one search. Three cohort abstracts state them: PMID:1520057 (Oregon population-based, 53 interviewed), PMID:8129767 (57 patients prospective, mean 36 months) and PMID:7857025 (head and neck questionnaire across 33 states). Added Paresthesia (HP:0003401, FREQUENT, 62% with objectively demonstrated hypesthesia), Xerostomia (HP:0000217, FREQUENT, 66%) and Dysphagia (HP:0002015, FREQUENT, 56%). The same abstracts finally put sourced frequencies on three records that had none: Fatigue FREQUENT, Muscle weakness FREQUENT and Cognitive impairment VERY_FREQUENT. Fatigue takes the population-based 77% rather than the referral cohort's 91%, which would have crossed into VERY_FREQUENT, and the explanation says so. Weight loss stays absent: its 50% figure is still unquotable from anything cached, and the notes record that rather than carrying a number with no source.

    Suggestion 4 accepted in narrowed form. Added a diagnosis section with three entries limited to what a cached abstract states: high-resolution CT (abnormal in four of six, with one normal plain radiograph, so a normal film does not exclude), electrodiagnostic studies (the multifocal conduction block and prolonged F-responses that make the neuropathy demyelinating), and muscle biopsy (eosinophilic perimyositis in four of five biopsied, and the septal and fascial location of the earliest change, which is why sampling depth matters). Its notes record that the wider workup the report describes, including muscle MRI and parasite exclusion, is general practice no cached reference attributes to a study of this disease, so it is not written down as though it were.

    Suggestion 3 accepted: two errors in the first history record for this entry were corrected before merge, as the reviewer asked. It said 'five discussions' where there are six, and it stated the NCIT:C15747 binding in the present tense in one paragraph while a later paragraph described correcting it to NCIT:C128535. The node count in the same sentence was also stale and is now 13 plus the deliberately isolated PAP node.

    Validation: 'just validate-disorders' passes with 159/159 snippets verified, 165 titles checked and 0 issues. Green on check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-reference-titles, check-coarse-phenotypes, check-case-collisions, check-term-cache-integrity and check-cache-order. Three new reference cache files committed (PMID_1520057, PMID_8129767, PMID_7857025), all cited. Causal connectivity rises from 7/22 to 9/25 phenotypes.

  summary: 'Create: Eosinophilia-Myalgia Syndrome'
  details: |
    Created kb/disorders/Eosinophilia-Myalgia_Syndrome.yaml (MONDO:0004941) de novo.

    Deep research: Edison Scientific falcon, via 'just research-disorder falcon Eosinophilia-Myalgia_Syndrome'. The first attempt failed at authentication because the connection to api.platform.edisonscientific.com timed out before the key was judged; the second run of the same command succeeded. The report is committed at research/Eosinophilia-Myalgia_Syndrome-deep-research-falcon.md with its citations sidecar and one artifact. The run exited 3 because term validation could not reach EBI OLS (read timeout resolving MeSH:D016603), so no frontmatter validation block was written; both sections were retro-fitted afterwards with 'just validate-research-reference' and 'just validate-research-terms'. The reference retro-fit reports 9/9 resolved, 0 unresolved, and flags DOI:10.2903/j.efsa.2024.8707 (an EFSA feed-additive opinion) as possibly off topic; that reference is not cited in the entry. The term retro-fit failed again on an OLS timeout, so the report carries no Term Validation section and every CURIE in this entry was instead looked up against the committed caches or via runoak at the point of writing.

    Falcon cites by author-year key with DOI links and no PMIDs, so its nine sources were mapped DOI to PMID through esearch and fetched. The report's coverage is thin by design (7 papers plus one trial record), so it was used for framing and the entry's evidence base was built out by PubMed search: 44 distinct references are cited, 42 of whose cache files are new here; PMID:8555405 and PMID:8285738 were already committed for Toxic_Oil_Syndrome. Eighteen further fetches, including the eight DOI records the report's reference validation resolved, went uncited and were pruned rather than committed.

    Pathophysiology is a connected chain of 11 nodes from ingestion of contaminated manufactured L-tryptophan through contaminant exposure, a type 2 cytokine response, eosinophil chemotaxis and degranulation, a T cell process against extracellular matrix, tissue infiltration, microangiopathy, fibroblast activation, fascial and dermal fibrosis, perineural injury and cardiac conduction-system fibrosis. Three mechanistic_hypotheses groups (contaminant-driven type 2 immunity as CANONICAL, direct fibroblast activation and T cell matrix autoimmunity as ALTERNATIVE) and five discussions record what is unsettled.

    Deliberate non-assertions, each recorded in the entry: the etiologic agent is not named (PMID:8356958 is carried as REFUTE against EBT as sole agent); myalgia and peripheral eosinophilia carry no frequency because the CDC surveillance definition requires them and PMID:8895176 records that the definition was never validated; myalgia has no incoming causal edge because PMID:1563745 found minimal myofiber damage despite severe myalgia; the PAP-to-PAA node has no downstream edge because nothing traces a route from the shared metabolite to any lesion; and 15 of 22 phenotypes are unwired for the same reason, which is stated in the entry notes rather than papered over with edges.

    Two bindings are compromises and say so in place. environmental[0].exposure_term binds ECTO:9002126 (exposure to environmental food contaminant) rather than ECTO:9002895 (exposure to tryptophan): the latter names the amino acid, which the epidemiology rules out as the cause, and it also carries no label in the committed ECTO build so it is not in the ExposureTerm enum. The first treatment binds NCIT:C15747 (Supportive Care) for supplement withdrawal because TreatmentTerm is rooted at NCIT:C25218 Clinical Intervention or Procedure and no reachable term names cessation of a causative agent. Both notes name the searches run.

    Datasets: 'just discover-datasets' returned only GENE_ONLY hits on HLA-DRB1, none about this disease, so GEO was searched directly; geo:GSE26934 is the one EMS-specific series and is curated with its cache file and a quoted summary.

    Validation: 'just validate-disorders' passes with 140/140 snippets verified, 146 titles checked and 0 issues. 'just verify-datasets' OK 1/1. Green on check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-reference-titles, check-case-collisions, check-coarse-phenotypes and check-delivery-system. 'just check-genereviews --online' returns NO_CHAPTER for both Bookshelf collections, which is what the entry notes claim. 7 of 22 phenotypes are causally connected, which is stated in the entry notes rather than raised by adding edges.

    A self-review round was run before the PR, with a subagent applying the dismech-pr-review skill against the uncommitted entry, and its blocking findings were fixed in this same commit. Two of them were false justification notes of the exact shape CLAUDE.md warns about, both written by me and both refuted by re-running the search the note named. The treatment for supplement withdrawal claimed no reachable NCIT term for stopping a causative agent exists; 'runoak -i sqlite:obo:ncit search "l~discontinuation"' returns NCIT:C128535 Pharmacotherapy Discontinuation, which is-a C21090 is-a C49236 is-a C25218, so it is in the TreatmentTerm enum, and the treatment is now bound to it. The false note had searched only the committed cache/ncit/terms.csv, where an absent row is silence rather than a negative answer. A dataset note said the TGF-beta signature was curated on the fibroblast node through PMID:21702023 when that reference was nowhere on that node; the evidence item now exists and the note records the correction. The ECTO note survived re-running: ECTO:9002895 and ECTO:0070245 both resolve to no label in the committed build, and a search for supplement exposure returns only substance-specific classes.

    Four further blocking fixes. The Type 2 Cytokine node bound GO:0032604 granulocyte macrophage colony-stimulating factor production under a preferred_term of interleukin-5 production, defended by a note arguing the node had to carry the GM-CSF finding for an evidence item to attach to; an evidence item attaches to the node, not to a process descriptor, and biological_processes is multivalued, so GO:0032634 is now bound alongside it. The Peripheral neuropathy clinical_course PROGRESSIVE was cited against a snippet reading 'only peripheral neuropathy was unchanged'; the surveillance 'progressive polyneuropathy' item now carries the qualifier and the older explanation says what its sentence supports. Two denominators in Decreased DLCO and Dyspnea were asserted beyond the source and are corrected ('five of the six reported', 'two of the three who underwent lavage'). Sudden cardiac death now quotes the sentence naming the two arrhythmic deaths rather than the generic cardiac-involvement figure.

    Non-blocking items taken in the same push, per CLAUDE.md's one-push rule: a sourced upstream edge from the contaminant exposure to the T cell node, which was the entry's second unexplained root; deletion of the UNKNOWN edge into the PAP metabolite node, whose own description disclaimed the causation the arrow asserted, leaving that node deliberately isolated; PMID:8285738 added for TGF-beta in perimysial connective tissue and one sural nerve, which is the only molecular observation in a peripheral nerve anywhere in the cited literature; a mast cell binding and human counterpart from PMID:2273104; a Steroid-Sparing Immunosuppression treatment from the 2011 case, carrying the methotrexate and anakinra failure as REFUTE; a definitions entry for the CDC 1989 surveillance case definition with validation_status UNVALIDATED; a tryptophan_metabolism_abnormality knowledge gap for IDO; reports_on readout links for the two laboratory phenotypes; the HLA-DRB1 implicated-lot qualification, where DRB1*03 was not a risk factor; and three grading corrections. The DR4 trend item was regraded from REFUTE to SUPPORT with directness INDIRECT, because a non-significant trend in the same direction is a failure to confirm rather than a contradiction.

    Three reviewer findings were declined. There is no differentials slot on the Disease class and no MeSH slot under mappings, so those two suggestions have nowhere to go. No histopathology or diagnosis section was added, and the entry notes now record why: in this disease the histology is the mechanism and is carried as pathophysiology nodes, so a parallel descriptive section would state each finding twice.

  details: |
    Answered the first review round on PR 11401. Blocking finding one: two evidence explanations justified themselves as recording a phenotype FREQUENT rather than obligate or very frequent, but no phenotype in the file carries a frequency slot and no source states a frequency for CMT4B3. Rewrote both explanations to describe only what the cited paper shows, which is a negative observation in one family, rather than adding a frequency the literature does not support at this sample size. Blocking finding two: the GeneReviews CLINICAL CHARACTERISTICS section was unmined. Added its typical-phenotype sentence to three phenotypes, Distal Muscle Weakness and Atrophy, Distal Sensory Loss, and Foot Deformity, each graded evidence_source OTHER and directness INDIRECT because the sentence is made of the whole autosomal recessive CMT4 group of eleven genes rather than of CMT4B3 specifically, and drawn from a chapter GeneReviews has retired. On the foot deformity phenotype that sentence is also the only frequency statement any source makes about pes cavus in this disease group, so it substantiates the prose the first finding removed rather than leaving the point unmade. Accepted two suggestions: added the missing reference_title to the GEO GSE290354 dataset evidence item, copied exactly from the cached record frontmatter, and added a Respiratory Insufficiency phenotype bound to HP:0002093, which the entry previously implied through its Respiratory and Nutritional Support treatment without carrying a node. That phenotype deliberately carries no subtype value because the severe infantile axonal case is not one of the two subtypes this entry declares, matching how the Congenital Talipes phenotype from the same case is handled. Validation after the edits: just validate passed with 112 of 112 snippets verified, up from 108; just validate-terms passed; check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-snippet-grading, check-title-snippets and check-snippet-length all clean with no new baseline entries; just validate-disorders passed as the authoritative batched gate. just qc was not run because it exceeds the available tool timeout.

  summary: Review CMT4B3 clinical evidence, variant uncertainty, mechanisms and experimental
    models
  details: |
    Reviewed the existing disease entry against cached primary clinical and experimental literature and the matching deep-research report. Used full text for the Korean-family comparison, Spanish and British clinical reports, Italian R763H/G1064E report, mouse and zebrafish studies, biochemical MTMR2/MTMR5 experiments, patient iPSC resources, dominant/toe-walking reports, and fibroblast studies. Upgraded PMID:12668758 and PMID:42627996 to full text through the supported fetcher; fetched and read full PMID:39918771 and PMID:35580604. PMID:40998285 remained abstract-only after an unsuccessful full-text fetch. Corrected British ancestry, Spanish compound-heterozygous phase, respiratory involvement, Italian uncertain/likely-benign variant classifications, and the dominant H466Q VUS interpretation. Separated phenotypes and biochemical observations; distinguished demonstrated protein loss, model-specific sorting/myelin findings, and hypothesized trafficking/mitochondrial links. Added assay-specific model limits, partial morphological Mdivi-1 rescue, four-line redox results and healthy-donor neuronal autophagy context. Replaced retired care evidence with the full current GeneReviews CMT Overview, explicitly indirect for general guidance. Verified GEO:GSE290354 and checked ClinicalTrials.gov on 2026-11-06; added the broad observational registry NCT05902351 without implying an SBF1-specific treatment. Schema/ontology/reference validation passed with 169 snippets and 173 titles, none skipped or unavailable. Targeted structural, graph, phenotype and source-claim checks passed; rendered page inspected. No population-wide phenotype frequencies or clinical efficacy inferred from these small studies.

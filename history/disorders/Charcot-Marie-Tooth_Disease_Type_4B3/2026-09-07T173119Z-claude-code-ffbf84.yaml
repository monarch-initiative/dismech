    Cache additions introduced by this entry, and staged with it: MONDO:0014117,
    HP:0004336, GO:0072542, hgnc:10542, NCIT:C154784 and NCIT:C217131 in the
    term caches plus the matching enum-membership rows. Nineteen new
    references_cache files, all cited by this entry.

    A `diagnosis:` block is included with four records - SBF1 molecular genetic
    testing (NCIT:C15709), whole exome sequencing (NCIT:C101295), nerve
    conduction studies and electromyography (NCIT:C154784 Electroneurography),
    and sural nerve biopsy (NCIT:C217131 Nervous System Biopsy Procedure). The
    focally folded myelin finding appears in BOTH `diagnosis:` (as the result of
    the biopsy procedure) and `histopathology:` (as the tissue finding), which
    is deliberate: it is the CMT4B group's diagnostic hallmark. All four NCIT
    terms were checked as reachable from NCIT:C25218 before use.
    `Inheritance.penetrance` and `expressivity` are not populated; no claim
    about penetrance or expressivity is made anywhere, and the reasoning about
    inheritance lives in the inheritance `description` and in the
    cmt4b3_dominant_report discussion.

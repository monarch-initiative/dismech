  summary: 'Create: Charcot-Marie-Tooth_Disease_Type_4B3'
  details: |
    De novo creation of kb/disorders/Charcot-Marie-Tooth_Disease_Type_4B3.yaml
    (CMT4B3, MONDO:0014117, SBF1/MTMR5), closing the claim issue #11356 and
    deleting stubs/Charcot-Marie-Tooth_Disease_Type_4B3.yaml.

    LUMP/SPLIT DECISION. Curated as ONE Disease entry with two has_subtypes
    entries (Classic CMT4B3; Syndromic SBF1 Neuropathy) rather than as separate
    entries. Reasons recorded in the entry's notes: MONDO models MONDO:0014117
    as a leaf under MONDO:0018995 with one causal gene and no descendants; the
    literature publishes each severe family as "expanding"/"broadening the
    clinical spectrum" of CMT4B3 rather than as a new entity; there is no
    separate MONDO, OMIM or Orphanet concept for the syndromic form; and
    ClinGen curates a single SBF1-CMT4B3 gene-disease relationship. The subtype
    split is recorded as provisional in the cmt4b3_spectrum_boundaries
    discussion, because the demyelinating/axonal axis and the pure/syndromic
    axis are not congruent (PMID:34118926 reports severe infantile AXONAL
    disease with normal cognition and normal brain/spine MRI).

    DEEP RESEARCH. `just research-disorder falcon Charcot-Marie-Tooth_Disease_Type_4B3`
    FAILED: the Edison/Falcon account returned HTTP 402 Payment Required (out of
    credits). Retried once with `just dr_fallback='--fallback' research-disorder
    falcon ...`, which fell back to openscientist; that job ran about an hour
    and was cancelled server-side ("OpenScientist job timed out after 3600s",
    job d6d63137-ccae-46d0-8409-b77728d60a8f). Neither provider produced a
    report. A third run, `just research-disorder claude_code
    Charcot-Marie-Tooth_Disease_Type_4B3`, succeeded in 5m36s, and
    research/Charcot-Marie-Tooth_Disease_Type_4B3-deep-research-claude_code.md
    plus its .citations.md sidecar are committed with this entry. It is a
    claude_code report, NOT a falcon one: the filename says so, and no
    `fell_back` frontmatter was written because the successful run was a fresh
    invocation rather than a fallback hop.

    The report's own validation. reference_validation: 14/14 verified,
    confabulation_rate 0.0, but needs_review true, driven by quotes_valid 1/2
    (one unsupported quote, attributed to PMC:PMC12926636) and 11/14 on-topic.
    Nothing appears under unresolved_references, so no identifier was excluded
    on that basis; the unsupported quote was not reused - the underlying paper
    (PMID:41737274) was fetched independently and quoted from its own cache.
    term_validation: 61/68 verified, needs_review true, unresolved_terms
    [HP:0007257] (never bound here), obsolete_terms HP:0002355 and GO:0032313
    (never bound here), and one mislabelled_terms entry where the report calls
    MONDO:0014117 "MONDO" - a table-formatting artifact, not a wrong binding.

    `just preflight-dr <report> MONDO:0014117` returned WARN: SBF1 dominant at
    59 mentions and the MONDO OMIM xref 615284 present, but rival gene MTMR2 at
    18 mentions (31% of SBF1) and OMIM 614895 (CMT4B2) also carried. Resolved
    rather than dismissed: MTMR2 and SBF2 appear because they are the
    mechanistic partner and the sibling diseases, which this entry discusses on
    purpose. The Named Entity Confusion rule was applied throughout - no CMT4B1
    or CMT4B2 result is presented as a CMT4B3 finding, and the sibling diseases
    are named explicitly in differential_diagnoses.

    The report was used as a lead source, not as content. It was read in full
    and corroborated the entry already built. Four things were taken from it and
    then independently sourced and quote-verified against the caches before use:
    the beta1-integrin/Rab21 and ErbB2/3 Schwann-cell cargo argument
    (PMID:34718573 full text), the Mtmr2-maintains-Mtmr5/Mtmr13 mutual
    stabilization result (PMID:34718573 abstract), the zebrafish finding that
    the microcephaly is a neurogenesis defect rather than apoptosis
    (PMID:40066109 full text), and congenital clubfoot as the earliest
    manifestation in the severe infantile case (PMID:34118926). Two further
    references were added on its leads: PMID:20658556 (the original "fork and
    bracket" description, which predates the SBF1 link) and PMID:41737274 (a
    2026 toe-walking cohort with heterozygous SBF1 variants of uncertain
    significance). Claims sourced in the report only to a patient-advocacy
    website, an institutional news item, or GeneCards/ResearchGate - including
    the "only 14 documented cases worldwide" figure and the Rab28 GEF
    suggestion - were NOT curated.

    Every claim in the entry is anchored to a reference fetched with `just
    fetch-reference` and quote-verified against references_cache/.

    LITERATURE SET. Built from PubMed E-utilities searches on
    "SBF1 AND (neuropathy OR Charcot-Marie-Tooth OR CMT4B3)" and on SBF1/MTMR5
    with syndromic terms, then triaged by reading each abstract. References
    cited: PMID:23749797 (Nakhro, index Korean family, names CMT4B3),
    PMID:27123480 ("fork and bracket", spectrum + genotype-phenotype),
    PMID:28005197 (axonal with cranial nerve involvement), PMID:30039846
    (splice-site null, Bedouin syndromic), PMID:32444983 (frameshift, necklace
    fibres, MTMR5 protein reduction), PMID:34118926 (severe infantile axonal,
    secondary mitochondrial dysfunction), PMID:34718573 (Mtmr5-null mouse),
    PMID:40066109 (mtmr5-null zebrafish), PMID:12668758 (MTMR5 is a
    catalytically inactive regulator of MTMR2), PMID:12687498 (MTMR13/CMT4B2,
    for the differential), PMID:27666502 (myotubularin family review),
    PMID:39664754 (the autosomal dominant claim), PMID:40998285 and
    PMID:42627996 (patient fibroblast mitochondria/autophagy), PMID:36272304 and
    PMID:39461113 (patient iPSC lines), PMID:20301641 (retired GeneReviews CMT4
    chapter, for management and the diagnostic gene list),
    CGGV:assertion_c0f814d9-... (ClinGen SBF1-CMT4B3, AR, Moderate), and
    GEO:GSE290354 (the zebrafish RNA-seq dataset).

    GENEREVIEWS BASELINE. There is no CMT4B3-specific GeneReviews chapter. The
    CMT4 chapter (PMID:20301641) is RETIRED; its abstract is the only
    GeneReviews text that names SBF1/CMT4B3, and it is cited for the diagnostic
    gene list, management, agents to avoid, and recurrence risk, with the
    retirement stated in each explanation. The current CMT Overview
    (PMID:20301532) has no clinical-characteristics content in its PubMed
    abstract, so it is listed in `references:` with the GeneReviews tag but is
    not quoted anywhere.

    CITED BUT NOT QUOTED. PMID:24799518 (Alazami, the primary report of the
    Saudi syndromic family) is listed in `references:` for provenance only:
    PubMed holds no abstract and the publisher full text returned HTTP 403, so
    the cache has no body and no snippet is taken from it. The Saudi family's
    phenotype is cited from PMID:27123480 instead, which describes it.

    CLAIM DELIBERATELY NOT MADE. The task brief described the syndromic form as
    involving optic atrophy. A PubMed search for (SBF1 OR MTMR5) AND (optic
    atrophy OR optic nerve) returned zero records, and none of the primary
    reports read describes optic atrophy - the ocular involvement reported is
    cranial-neuropathic (ophthalmoparesis, absent pupillary light reactivity,
    strabismus) plus one non-specific "vision problem". Optic atrophy is
    therefore NOT curated as a phenotype, and the entry's notes say so
    explicitly.

    OTHER HONESTY NOTES. (a) `genetic_context.zygosity` is left unset on the
    SBF1 node because reported families are homozygous or compound
    heterozygous, the slot is single-valued and the enum has no "biallelic"
    value. (b) No phenotype carries a `frequency:` band: with seven to ten
    published families and no cohort study, every band would be a guess, so the
    schema's "omit rather than guess" guidance was followed. (c) ORPHA:363981
    exists and would be a citable source for definition and epidemiology, but
    the Orphadata bulk XML is absent from this checkout and rebuilding the cache
    requires a download and manifest re-pin; that gap is recorded in the entry's
    notes. (d) The three quotes originally taken from background/review
    paragraphs of the zebrafish paper (PMID:40066109) were replaced or regraded
    so that no evidence item claims a study type the cited publication does not
    report; PMID:27666502, a review, now carries the myotubularin-biochemistry
    framing at evidence_source OTHER. Every reference in the file now has
    exactly one evidence_source, matching its publication type.

    CONFORMANCE. Four pathophysiology nodes declare `conforms_to`: three against
    schwann_cell_myelin_maintenance (trigger, remodeling, dysmyelination) and
    one against peripheral_axonal_degeneration#Distal Axonal Degeneration and
    Demyelination, as that module's notes direct for demyelinating hereditary
    neuropathy. The conforming nodes were given the module nodes' expected GO
    and CL terms, specializing CL:0002573 to CL:0000218 where the claim is
    specific to the myelinating lineage.

    NEGATIVE AND CONFLICTING EVIDENCE IS CURATED, NOT DROPPED. The Mtmr5-null
    mouse's failure to reproduce myelin outfoldings is recorded as a
    FAILS_TO_RECAPITULATE model link plus a HUMAN_MODEL_MISMATCH discussion; the
    single autosomal dominant report (PMID:39664754) is recorded as a
    CONTROVERSY discussion rather than being folded into the inheritance block;
    and REFUTE evidence items are attached where a source contradicts a
    phenotype's generality.


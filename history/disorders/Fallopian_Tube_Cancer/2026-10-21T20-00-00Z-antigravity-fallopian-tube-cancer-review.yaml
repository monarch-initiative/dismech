  summary: >-
    Add evidence, ontology annotations, causal edges, Latzko triad phenotypes,
    and treatment target mechanisms to Fallopian Tube Cancer.
  details: >-
    Added literature evidence (PMID:38956451, PMID:23730659) to classifications
    (harrisons_chapter and icdo_morphology) and the HGSC subtype; added
    cell_types (CL:4030006), molecular_functions (GO:0003700 on TP53 Mutation in
    Tubal Secretory Cells), and biological_processes (GO:0006915, GO:0008283,
    GO:0000724) annotations to pathophysiology nodes, and wired downstream edges
    from Invasive High-Grade Serous Carcinoma and Peritoneal Spread to all
    presenting phenotypes; replaced the mismatched Abnormal vaginal bleeding
    entry with Pelvic pain (HP:0034267) and Abnormal vaginal discharge
    (HP:0034269) supported by Latzko triad evidence (PMID:23730659), and added
    PMID:23730659 evidence to Pelvic mass (HP:0031501); added TCGA genomic
    profiling evidence (PMID:21720365) to the somatic TP53 genetic entry; and
    added therapeutic_modality annotations and target_mechanisms to
    Cytoreductive Surgery, Platinum-Taxane Chemotherapy, PARP Inhibitor
    Maintenance, and Risk-Reducing Salpingo-Oophorectomy.

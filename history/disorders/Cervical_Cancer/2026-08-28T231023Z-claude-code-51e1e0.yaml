  summary: 'Detailed evidence review: Cervical Cancer evidence and reference audit'
  details: |
    Full per-item evidence review of kb/disorders/Cervical_Cancer.yaml.

    Scope: 27 evidence snippets checked across 17 distinct references. All ten
    PMID-backed references were read in full from the cache (PMID:2175676 Scheffner
    E6/p53 degradation, PMID:2537532 Dyson E7/pRB binding, PMID:28112728 TCGA
    integrated characterization, PMID:12953088 Schlecht CIN progression cohort,
    PMID:14690308 cervical pathology review, PMID:29794500 Botswana presenting-symptom
    series, PMID:23244084 hematuria screening study, PMID:41503346 Philippines HPV
    prevalence study, PMID:41777072 Korean Society of Gynecologic Oncology guideline,
    PMID:39215938 SEOM-GEICO guideline). The seven DOI-prefixed entries in the
    top-level references block are deep-research provenance records that the
    reference validator skips by prefix; they were read but are not cache-verifiable
    and were left as-is.

    The dominant defect class in this file was truncation: seven snippets were
    mid-sentence fragments produced by copying across a line break in the cached
    text. Each was an exact substring, so every mechanical check passed, but as
    written they were not propositional statements and several began or ended
    mid-clause. Each was repaired by extending to the complete sentence from the
    same cached reference. No quote was paraphrased, and no reference was added.

    Defects found and fixed.

    1. E6 Oncoprotein-Mediated p53 Degradation. "that bind p53 stimulate the
    degradation of p53." extended to the full result sentence beginning "In this
    study we demonstrate that the E6 proteins of the oncogenic HPVs...".

    2. Loss of DNA Damage Response. "p53 is ATP dependent and involves the
    ubiquitin-dependent protease system." extended to "The E6-promoted degradation
    of p53 is ATP dependent and involves the ubiquitin-dependent protease system."
    Also marked directness INDIRECT under the narrowed supports enum (which
    retired PARTIAL while this review was in flight): this 1990 biochemical study
    characterizes p53 destruction, the cause, and does not measure the
    DNA-damage-response or checkpoint readout the node asserts.

    3. E7 Oncoprotein-Mediated pRB Inactivation. "form similar complexes with
    p105-RB. Human papilloma virus-16 is found" spanned a sentence boundary and
    ended mid-clause. Replaced with the complete sentence "These assays have been
    used to demonstrate that the E7 oncoprotein of the human papilloma virus type-16
    can form similar complexes with p105-RB."

    4. Uncontrolled Cell Proliferation. "implicate RB binding as a possible step in
    human papilloma" extended to the full concluding sentence. Also marked
    directness INDIRECT: the study proposes RB binding as a possible transforming
    step and does not measure S-phase entry or proliferation.

    5. Genomic Instability, HPV Genome Integration, and Constitutive E6/E7
    Expression all cited the same fragment, "aberrations and increased target-gene
    expression." All three were extended to the full TCGA sentence, "Integration of
    human papilloma virus (HPV) was observed in all HPV18-related samples and 76% of
    HPV16-related samples, and was associated with structural aberrations and
    increased target-gene expression." All three keep evidence_source HUMAN_CLINICAL
    so the shared sentence is graded consistently.

    6. Constitutive E6/E7 Expression, additionally. Its use of that TCGA sentence
    was marked directness INDIRECT, because the "target-gene expression" measured
    is that of host genes at integration sites, not E6/E7 transcript levels, which
    the quote does not report. Its second item, from the E6 paper, had the fragment "one of
    two viral products expressed in HPV-associated cancers. E6 is an", which spanned
    a sentence boundary; extended to the complete sentence naming E6 as one of two
    viral products expressed in HPV-associated cancers, which is the claim actually
    being made.

    7. Cervical Intraepithelial Neoplasia Progression. "Precursor lesions of the
    cervix persist longer and progress more" was cut mid-sentence, dropping the
    comparison that carries the meaning. Extended to the full conclusion, "...more
    quickly in women with oncogenic HPV infections than in women with non-oncogenic
    infections or without HPV."

    8. Histopathologic confirmation of cervical malignancy. Its quote, "This article
    discusses the epidemiology and pathogenesis of the squamous cell carcinoma...",
    is an article-scope sentence describing what the paper covers, not a finding.
    Replaced with the pathology review's actual finding sentence, "Squamous cell
    carcinoma is the most common malignant cervical tumor, but the incidence of
    adenocarcinomas has been rising during the past few decades", which names the
    two histologic classes this diagnostic step distinguishes.

    9. Pembrolizumab treatment. The cited guideline sentence referred only to
    "immunotherapy" generically while the explanation asserted the guideline
    supports pembrolizumab specifically. Replaced with the sentence from the same
    guideline that names the drug and its approved indication: "leading to
    regulatory approval of pembrolizumab for persistent, recurrent, or metastatic CC
    tumors expressing PD-L1 with a combined positive score (CPS) >= 1", which
    matches the PD-L1 CPS of at least 1 criterion in this entry's description.

    10. Two evidence items carried no evidence_source at all (the infectious_agent
    HPV item and the squamous cell carcinoma histopathology item). Both cite human
    studies and both were set to HUMAN_CLINICAL, matching how the same references
    are graded elsewhere in the file.

    Verified without change: the Botswana series percentages (abnormal vaginal
    bleeding 75.8%, low abdominal pain 66.4%, malodorous discharge 39.6%) support
    all three phenotypes they are attached to and all three sit correctly in the
    FREQUENT band; the hematuria study's 41.5% likewise supports the FREQUENT band,
    and the phenotype description's hedged wording about bladder mucosal involvement
    is consistent with the study finding confirmed infiltration in only 3.08%; the
    Philippines study quotes support HPV as the necessary cause and genotyping as
    the diagnostic method; the Korean guideline recommendation is correctly graded
    OTHER. No Named Entity Confusion was found; every cited paper is about cervical
    cancer or its causal HPV infection.

    Noted, not changed: PMID:39215938 and the top-level reference
    DOI:10.1007/s12094-024-03604-3 are the same SEOM-GEICO guideline cited under two
    identifier forms. This is duplication in the references block rather than an
    evidence defect, so it was left for a curator to consolidate.

    Validation after edits: just validate passed. just count-verified-snippets
    reported 20/27 verified against cached references, with 7 skipped by prefix (the
    DOI-prefixed deep-research references, which the validator skips by
    configuration). just validate-disorders passed for this file; its three warnings
    are pre-existing "could not fetch reference" notices for the ega: dataset
    accessions in the datasets block, which are not literature references and were
    not touched. check-duplicate-keys, check-entity-refs, check-title-snippets,
    check-snippet-length, check-snippet-grading and check-folded-hyphens are all
    clean for this file.

  summary: 'Create: Cornelia de Lange Syndrome 1 (NIPBL)'
  details: |
    De-novo curation of Cornelia de Lange syndrome 1 (MONDO:0007387, NIPBL),
    claimed at #11152. entry_type resolved to DISEASE and the stub deleted.

    Scope. kb/disorders/Cornelia_de_Lange_Syndrome.yaml holds the umbrella term
    MONDO:0016033 with a generic pan-cohesin chain and no has_subtypes block, and
    Cornelia_de_Lange_Syndrome_4.yaml holds the RAD21 form as its own record. This
    entry follows that precedent. What it carries beyond the umbrella is
    NIPBL-specific: the dosage argument, the postzygotic mosaicism that is under
    negative selection in blood, and the SMC1A genotype comparison.

    The mechanism is curated as transcriptional, structurally and not only in prose.
    There is deliberately no sister-chromatid-cohesion node, because the cited work
    states that cohesion is largely spared and that gene activation is the cohesin
    function sensitive to NIPBL reduction. That absence is a claim.

    Deep research: one OpenScientist run, committed with the entry. Its own
    validation reported 33/33 references resolved, 19/19 quotes valid, one off-topic
    reference (PMID:36053618, which is a gastrostomy population study and is in fact
    on topic for the feeding morbidity it is cited for), 44 terms with 40 verified
    and one obsolete.

    Report term errors, none of which were bound. GO:0032116 was offered for "sister
    chromatid cohesion"; it is SMC loading complex, and it is a cellular component
    rather than a process. GO:0035064 was offered for methylated histone binding and
    is obsolete. NCIT:C15329 was offered as "Gastrostomy"; that code is Surgical
    Procedure, and the entry binds NCIT:C52006 instead. The first two were flagged by
    the report's own term validation; the NCIT one was not, which is the pattern
    reported on #10459.

    Both congenital heart defect frequencies are curated rather than one being
    chosen: 33.3% from a consecutive echocardiographic cohort and 45.6% from
    population registry data. A KNOWLEDGE_GAP records why they differ and that no
    NIPBL-stratified figure exists.

    The collective-perturbation node carries a KNOWLEDGE_GAP saying it is the
    weakest link in the chain. Its own authors frame it as an intriguing possibility
    raised by the data, and the alternative that a small number of the expression
    changes are the pathogenic ones has not been excluded. That distinction is
    therapeutically consequential, so it is recorded rather than smoothed over.

    One error caught by a gate rather than by me: I wrote reference_title for
    PMID:36053618 from memory as "Gastrostomy insertion in children with congenital
    anomalies: A EUROlinkCAT study." The cached title is "Gastrostomy and congenital
    anomalies: a European population-based study." The title check flagged it and it
    was corrected from the cache.

    Validation: just validate-disorders passes schema, terms and 31/31 snippets.
    check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values
    and check-qualifier-terms are clean. preflight-dr PASSes with NIPBL mentioned 63
    times and the OMIM number matching. Eighteen references fetched during research
    but not cited were pruned from references_cache rather than staged.

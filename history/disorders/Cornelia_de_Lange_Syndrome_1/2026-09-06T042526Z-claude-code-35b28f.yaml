  summary: 'Review round 1: fix a contradictory GO binding, an uncited dosage claim,
    and mine GeneReviews'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR 11169 in a single push. All five blocking items verified against primary sources before acting; all five were correct.

    1. The cohesin-loading node was bound to GO:0034088 'maintenance of mitotic sister chromatid cohesion' with modifier DECREASED, which asserts impaired sister-chromatid cohesion. The entry argues the opposite in three places, including the evidence snippet directly beneath the binding. Rebound to GO:0006325 chromatin organization plus GO:0003682 chromatin binding, following the umbrella Cornelia_de_Lange_Syndrome entry; both were already cached. preferred_term 'cohesin loading onto chromatin' is kept, which is the case the term contract covers. Every GO cohesin-loading process term is obsolete, which is why there is nothing more specific to bind.

    2. The description claimed mouse models expressing roughly 30-75% of normal transcript reproduce the syndrome, with no evidence for it. The cached sources say a decrease of under about 30%, which is a residual level of about 70-75%. The 30% lower bound came from reading 'a 30% decrease' as '30% of normal'. Corrected, and now cited to PMID:22039349, whose sentence covers humans as well as mice and so states the dosage argument more strongly than the original claim did.

    3. A snippet truncated at a cache line wrap ('...all of which have a structural') replaced with the full sentence.

    4. GeneReviews (PMID:20301283) was tagged and cached but only its CLINICAL CHARACTERISTICS section was mined. Added its gonadal-mosaicism and 50%-transmission sentences to inheritance, its GERD and therapy-triad sentences to treatments, and a new diagnosis entry for the primary route quoting its diagnostic criterion.

    5. Hirsutism was missing despite appearing in the entry's own description. Added, bound to HP:0001007, with the band taken from the GeneReviews characterisation rather than from the 76.9% figure, whose source is not cached.

    Suggestions taken: gastroesophageal reflux added as a phenotype (HP:0002020) with a sequela edge to the feeding difficulties the gastrostomy treats; Motor stereotypy lowered OBLIGATE to VERY_FREQUENT because the 100% figure is for repetitive behaviour of any kind; the over-specific HP:0009821 Forearm undergrowth binding relaxed to HP:0002817 Abnormality of the upper limb, since the quoted 73.1% covers limb defects as a class; and animal_models added for the Nipbl+/- mouse and the nipbl-deficient zebrafish, each with modeled_mechanisms, fidelity, model_scale and limitations.

    Both new phenotypes were given incoming causal edges so the connectivity fixed in the previous round did not regress. Verified by recomputing in-edges: 16 phenotypes, zero orphans, no unresolved targets.

    One self-inflicted error caught during the round: I wrote a reference_title for PMID:22039349 from memory and it was wrong. The cache gave the real title. That is the same defect as the earlier PMID:36053618 case in this run. A second was caught by check-snippet-length: the first hirsutism snippet was a four-word noun phrase, the same defect the reviewer had flagged on the sibling CARD11 PR. Replaced with the full sentence.

    Validation: schema pass, term validation pass, 41/41 snippets verified against the local cache (was 31/31), entity refs, causal targets, duplicate keys, enum values and qualifier terms clean, whole-KB gates report nothing for this entry. No cache change; every term was already cached.

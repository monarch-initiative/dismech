  summary: Join all phenotypes to the pathograph
  details: |
    Cross-applied a blocking finding the reviewer raised on the sibling PR 11177 (CARD11): phenotypes with no incoming causal edge are invisible to the graph.

    Eight of this entry's fourteen phenotypes had no incoming edge. All eight are now attached to Disrupted Multi-Organ Developmental Programmes, the terminal pathophysiology node, but with deliberately different link types.

    DIRECT, because the node's own description and its cited evidence name these organ programmes explicitly:
    - Synophrys and Abnormal brain morphology, the craniofacial and central nervous system programmes.
    - Pulmonic stenosis, curated as its own edge rather than as a sequela of Congenital heart defect, because it is a specific lesion within that category rather than something the category causes.

    INDIRECT_UNKNOWN_INTERMEDIATES, because no cited source traces a route from the transcriptional lesion to the outcome:
    - Feeding difficulties. The node names foregut development, but the feeding difficulty in practice mixes structural, oromotor and reflux contributions and nobody has separated them.
    - Delayed speech and language development and Delayed gross motor development, attached to the developmental node rather than to Intellectual disability, because they are parallel manifestations of one programme failure rather than consequences of the intellectual disability.
    - Self-injurious behavior and Motor stereotypy. The edge records that they belong to the disease's central nervous system involvement; the link type records that the intermediates are unknown.

    Verified by recomputing phenotype in-edges from the file: zero orphans, no unresolved targets.

    Validation: schema pass, term validation pass, 31/31 snippets verified against the local cache, entity refs, causal targets, duplicate keys and enum values clean. Whole-KB gates report nothing for this entry. No cache change.

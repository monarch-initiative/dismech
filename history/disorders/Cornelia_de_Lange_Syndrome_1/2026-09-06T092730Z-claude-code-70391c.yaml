  summary: 'Review round 4: audit every frequency band, not only the ones a reviewer
    names'
  details: |
    The blocking finding was a third instance of the denominator defect, and it survived the sweep I had run for the first two: Congenital diaphragmatic hernia carried frequency OCCASIONAL while no cited source reports a CDH prevalence at all. The only two percentages in the cached references are cause-of-death attributions, 5-20% of CdLS deaths and 17% of infant deaths, whose denominator is deaths rather than patients, and OCCASIONAL brackets both. The band is removed and a phenotype notes line records why. Rather than fix only what was named, I audited all sixteen bands against the figure behind each. That found three more instances the reviewer had not raised. Feeding difficulties was VERY_FREQUENT on the strength of a gastrostomy rate, which counts an intervention rather than the phenotype, so its band is removed. Intrauterine growth retardation was VERY_FREQUENT on GeneReviews cardinal-feature phrasing carrying no figure; it is now FREQUENT, citing the registry finding that almost 70% of patients born at term weighed 2,500 g or less, with the proxy and the restricted denominator recorded. Delayed speech and language development is lowered to FREQUENT, the band containing the 70% quoted for it, per the reviewer's suggestion. Synophrys and Intellectual disability keep VERY_FREQUENT but now rest on counted figures, eleven of eleven and ten of eleven in PMID:34326454, rather than on cardinal-feature phrasing; both explanations record that the cohort is selected for postzygotic mosaicism and so supports the band without being an unselected prevalence. A notes paragraph sorts all sixteen phenotypes into the four resulting groups so the audit is checkable. Validation: schema, terms, 45/45 snippets (was 43/43), entity refs, causal targets, duplicate keys, enum values, qualifier terms clean; five whole-KB gates report nothing naming this entry; graph unchanged with zero orphans; no cache change.

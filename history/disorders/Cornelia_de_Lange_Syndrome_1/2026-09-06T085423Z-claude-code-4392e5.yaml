  details: |
    Both blocking findings were the same defect: a structured numeric slot disagreeing with the prose beside it, because the band was set from a number whose denominator is not the disease population. The prevalence record carried BAND_1_9_PER_1000000 (0.1-0.9 per 100,000) beside its own rate_per_100000 of 1.24 and notes reading 1 in 81,000 births, and disagreed by a factor of ten with the umbrella entry on the same European registry figure; corrected to BAND_1_9_PER_100000. Pulmonic stenosis was FREQUENT from 39%, which the cached abstract gives as 11/28 within the cardiac subgroup, not 11/87 of the cohort; that is about 13% of patients, so OCCASIONAL, and the description now states the arithmetic. As curated it had given a lesion the same band as the category containing it. Three suggestions taken. Hirsutism dropped from VERY_FREQUENT to FREQUENT, the tier containing the only reported figure of 76.9%; setting it from the GeneReviews cardinal-feature phrasing had put the band one tier above the number I had just declined to quote. Gastroesophageal reflux lost its band entirely rather than being lowered: no cached source gives a frequency, and an absent band honestly means nobody has assessed it. Curation rationale moved out of three phenotype descriptions into the phenotype notes slot, since descriptions render on the disorder page; the Hirsutism one described the state of a pull request rather than the disease. Validation: schema, terms, 43/43 snippets, entity refs, causal targets, duplicate keys, enum values, qualifier terms clean; five whole-KB gates report nothing naming this entry; graph unchanged at zero orphans and zero unconnected treatments; no cache change.

  details: |
    The blocking finding is a regression my own round-4 commit introduced, and the way it hid is the interesting part. The registry evidence item added for intrauterine growth retardation was appended to the end of the file rather than onto the phenotype, because the insertion script located the end of the phenotype block by searching for the next line starting '- category:' and intrauterine growth retardation is the last phenotype in the list, so the search fell through to end of file. The end of the file is inside the disease-level notes folded scalar, which swallowed roughly 600 characters of raw YAML as prose. Nothing caught it: the entry stayed schema-valid, every offline gate passed, and count-verified-snippets reported 45/45 with that item not among the 45. The band then rested on the GeneReviews cardinal-feature sentence, which is the exact reasoning the same commit had ruled out for hirsutism and replaced for synophrys. The item is now on the phenotype, verified by parsing the file rather than by string presence: the phenotype's evidence list reads PMID:20301283 then PMID:18074387, the notes contain no raw list item, and the snippet count rose to 46/46, which is itself the proof that the item was previously invisible. My round-4 script asserted that the text was present somewhere in the file, which was true and useless; placement was the thing that was wrong. The suggestion is taken too: the eleven of eleven on synophrys counts the composite craniofacial gestalt rather than synophrys alone, so both the evidence explanation and the phenotype notes now record that alongside the mosaic-cohort selection. A paragraph in the disease notes records the repair, since the audit paragraph it sits under is what caused it. Validation: schema, terms, 46/46 snippets, entity refs, causal targets, duplicate keys, enum values, qualifier terms clean; five whole-KB gates report nothing naming this entry; graph unchanged at 16 phenotypes with zero orphans; no cache change.

  summary: Reviewed and enriched Familial_Renal_Glucosuria for compliance, ontology grounding, and evidence
    completeness.
  details: "Added classifications.harrisons_chapter (KIDNEY_URINARY_TRACT, GENETICS_ENVIRONMENT_DISEASE);
    cell_types (CL:1000838) and locations (UBERON:0001287) on the SLC5A2 and PDZK1IP1 loss-of-function
    nodes; a molecular_functions binding on the PDZK1IP1/MAP17 node; a downstream edge from Reduced Proximal
    Tubular Glucose Reabsorption to the Dehydration phenotype (PMID:16518345); frequency OBLIGATE on Isolated
    Renal Glucosuria; presence/results on the renal threshold of glucose diagnosis and a new SLC5A2/PDZK1IP1
    Genetic Testing diagnosis (NCIT:C15709); evidence on both differential diagnoses; and therapeutic_modality
    on the treatment. Most of the remaining diff is a scalar-style reformat (folded to literal, double
    to single quotes) with unchanged parsed values. An earlier version of this record listed GO:0015758,
    GO:0003092, links to Polyuria, Polydipsia, Nocturia, Enuresis, UTI and Ketosis, eight phenotypes and
    three diagnoses; none of those were in the commit. The follow-up record of 2026-10-27 covers the review
    fixes."

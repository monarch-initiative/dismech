  summary: 'Address review of #15534: polyuria, MAP17 GO binding, evidence fixes'
  details: |
    PR Shepherd repair round answering the 2026-10-24 review. Generated references_cache/ORPHA_69076.md with just fetch-reference and added Polyuria (OCCASIONAL, wired from Reduced Proximal Tubular Glucose Reabsorption via osmotic diuresis, directness INDIRECT because Orphanet does not state the mechanism), Recurrent urinary tract infections and Ketosis, each quoting the Orphanet record. Enuresis was not added: Orphanet's definition mentions it but its phenotype table marks it Excluded (0%). Replaced GO:0030674 protein-macromolecule adaptor activity with GO:0141109 transporter activator activity on the MAP17 node, matching PMID:27288013 (MAP17 raises SGLT2 activity without changing surface abundance). Replaced the forward-looking PMID:27288013 sentence on the MAP17 edge with the c.176+1G>A patient sentence (HUMAN_CLINICAL) and the oocyte activation sentence (IN_VITRO). The renal-threshold diagnosis now cites the RTG-range sentence. The PMID:38344682 methods sentence on the Fanconi differential was replaced by the Orphanet definition; the abstract's only related result (4 of 14 tested patients had mild aminoaciduria) does not support that differential, so it was not used. therapeutic_modality OTHER to BEHAVIORAL. Validated with just validate (28/28 snippets), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-coarse-phenotypes.

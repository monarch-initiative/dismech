  summary: 'Create: Familial Renal Glucosuria'
  details: |
    Created a single disease entry MONDO:0009297 modeling familial renal glucosuria with two has_subtypes: SLC5A2-Related classic/common, OMIM:233100, ORPHA:69076 and PDZK1IP1-Related rare genocopy, OMIM:607178 gene locus. Preflight confirmed one MONDO entity covers both genes; the definition text explicitly names SLC5A2 as cause and no separate MONDO/OMIM phenotype entry exists for PDZK1IP1. Verified the PDZK1IP1-glucosuria link is real via PMID:27288013 Coady et al 2017 JASN, which reports a patient homozygous for a PDZK1IP1 splice variant c.176+1G greater-than A with no SLC5A2 mutation, functionally confirmed as necessary for SGLT2 activity. Also cited PMID:14569097 Santer 2003 founding genetics paper, PMID:22314875 Lee 2012 codominant/incomplete-penetrance genotype-phenotype cohort, PMID:38344682 Xu 2024 contemporary SLC5A2 plus PDZK1IP1 sequencing cohort with RTG quantification, and PMID:16518345 Calado 2006 documenting mild volume depletion/dehydration risk with massive glucosuria. Modeled inheritance as HP:0032113 Semidominant inheritance with INCOMPLETE penetrance per literature explicitly calling this a codominant trait with incomplete/variable penetrance. Pathophysiology debundled per CLAUDE.md pattern: shared Reduced Proximal Tubular Glucose Reabsorption node plus gene-specific SLC5A2 and PDZK1IP1/MAP17 nodes tagged with pathophysiology subtypes. Could not access the Orphanet structured-source cache due to an XML checksum mismatch against the pinned MANIFEST in this sandbox, so polyuria/enuresis and recurrent-UTI phenotype claims sourced only from the unfetchable ORPHA:69076 were dropped rather than fabricated; dehydration/volume-depletion risk was instead backed by a directly quotable PMID Calado 2006. differential_diagnoses documents the distinction from Fanconi-Bickel syndrome SLC2A2, curated separately by another agent and diabetes mellitus. Validated with just validate, just validate-references, and just validate-terms all pass, plus tests/test_data.py subtype-foreign-key and mechanism-target tests pass.

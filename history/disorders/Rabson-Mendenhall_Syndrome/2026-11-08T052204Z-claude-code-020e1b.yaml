  summary: Add 259-person biallelic INSR review (preprint) as corroborating evidence
  details: |
    Added PPR:PPR1354750 (D'Silva et al. 2026, Research Square preprint, full text cached) as corroborating evidence on existing claims: INSR genotype spectrum (complete loss-of-function genotypes present neonatally; missense and in-frame genotypes span a wide range of survival), DKA frequency and infection as a trigger, nephrocalcinosis (75%), enlarged polycystic ovaries (90% of females), metformin and insulin as mainstays, SGLT2 inhibitor promise with a ketone-monitoring caveat, inconsistent rhIGF-1 benefit, and metreleptin discontinuation for unwanted weight loss. Revised the genotype-phenotype knowledge-gap rationale and the DKA description. As the issue asked, the preprint is never the sole support for a claim; each item sits beside a peer-reviewed or GeneReviews citation. The pooled figures span Donohue syndrome and RMS, and the text says so. All 88 snippets verified and validate-disorders passed.

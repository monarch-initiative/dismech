  summary: 'Create: Rabson-Mendenhall syndrome'
  details: |
    De novo curation of Rabson-Mendenhall syndrome (MONDO:0009874), the intermediate-severity INSR-related severe insulin resistance syndrome. Pathograph: biallelic INSR loss-of-function -> impaired insulin receptor (PI3K-AKT) signalling -> severe insulin resistance -> compensatory hyperinsulinaemia branching to cutaneous IGF-1R cross-activation (acanthosis nigricans), ovarian androgen excess (hyperandrogenism), beta-cell decompensation (insulin-resistant diabetes -> DKA), GH resistance (growth failure), plus a tissue-autonomous renal INSR dysfunction node (nephrocalcinosis). 11 phenotypes with HP terms and cohort frequencies from the 42-patient pooled series (PMID:38957655); INSR genetic section (hgnc:6091, AR, LOSS_OF_FUNCTION functional_impact_category on the trigger node); treatments (insulin sensitizers, high-dose insulin, empagliflozin/SGLT2i, mecasermin/rhIGF-1, metreleptin, antiandrogens, oophorectomy, genetic counseling) using the therapeutic_agent pattern; HUMAN_MODEL_MISMATCH discussion on the murine-vs-human renal phenotype (PMID:25358339) and a KNOWLEDGE_GAP on the absent genotype-phenotype correlation. All 65 evidence snippets verified against cached references. Corrected two Named-Entity-Confusion NCIT codes (metreleptin/mecasermin) and two hallucinated HP codes suggested by the deep-research lead. Kept separate from Donohue and type A (INSR allelic series) and from autoimmune type B insulin resistance.

  summary: 'Review response: GeneReviews manifestation mining, new diagnosis section,
    transmission risk, pregnancy risk'
  details: |
    Response to the CHANGES_REQUESTED review on PR #8862 (comment 5334389558). Every item below was validated on the changed file before commit.

    CRITICAL 1 - GeneReviews CLINICAL CHARACTERISTICS mined. PMID:20301312 was cited nine times but by no phenotype. Added eight phenotypes carrying GeneReviews evidence, covering the three absent manifestation domains: allergic/inflammatory predisposition (HP:0012393, umbrella) with Asthma (HP:0002099) and Eczema (HP:0000964 Eczematoid dermatitis) as atomic members; gastrointestinal inflammation as Eosinophilic Esophagitis (HP:0410151), Gastritis (HP:0005263) and Inflammatory Bowel Disease (HP:0002037); cervical spine malformation/instability (HP:0010646); and pregnancy-related vascular/uterine complications (HP:0100718). No frequency band was curated for any of them - GeneReviews gives no quantitative figure and no TGFB2-specific frequency exists, so a band would have been fabricated justification. The allergic umbrella and IBD phenotypes carry a second, independent source: the NCT05472519 registration record, which enumerates the same immuno-allergic manifestation set.

    IMPORTANT 2 - surveillance imaging recategorised. Whole-Arterial-Tree Surveillance Imaging was removed from treatments: (where it carried treatment_term NCIT:C16502 and therapeutic_modality DEVICE, asserting a device therapy for what is a diagnostic procedure) and rebuilt as a diagnosis: entry with diagnosis_term NCIT:C16502, following the sibling LDS3 entry Aneurysm-Osteoarthritis_Syndrome. The entry had no diagnosis: section at all; one was created with two entries - molecular confirmation of a pathogenic TGFB2 variant (NCIT:C15709, multigene HTAD panel plus mandatory deletion/duplication analysis, with the RNA-level reclassification branch for near-splice-site variants) and the imaging entry. The del/dup requirement is evidenced by PMID:34680857, a case where panel sequencing alone was insufficient and array CGH made the diagnosis.

    IMPORTANT 3 - transmission risk added to inheritance:. Three further GeneReviews evidence items: 50% per-child recurrence, ~75% de novo / ~25% inherited, and prenatal/preimplantation testing availability once the familial variant is known. The de novo figure is explicitly annotated as spectrum-wide rather than TGFB2-specific, with the note that comparatively common non-penetrance in TGFB2 families means an apparently de novo LDS4 presentation warrants parental testing rather than parental examination.

    IMPORTANT 4 - the three fetched-but-uncited TGFB2 papers, handled according to what their cache actually contains. PMID:24193348 has a full abstract and is now cited twice in genetic: (the c.1165dupA frameshift pedigree extending the variant spectrum, and the nosological placement of TGFB2 disease within LDS rather than MFS-related disease). PMID:23102774 and PMID:28544325 are both indexed in PubMed as Letters and cache with metadata only - no abstract, no retrievable full text - so under CLAUDE.md "A Title Is Not a Finding" neither can carry a verifiable evidence snippet. They are recorded as top-level references: entries instead, and their substance is carried where it belongs. The Mitral Valve Prolapse description was rewritten around the Renard finding and now rests on the PMID:25163805 full-text sentence that states it ("a high rate of mitral valve disease, suggesting that this might be a signature feature of the disorder that may direct molecular analysis"), replacing the five-word fragment the reviewer flagged as primary support. The Gaspar 4.7 Mb deletion with adult osteoporosis is recorded in the genetic: notes and in a new notes: block on the tgfb2_deletion_neurodevelopmental_phenotype KNOWLEDGE_GAP, where it broadens the contiguous-gene attribution problem beyond neurodevelopment to skeletal density and adds a scoring dimension to the proposed cohort comparison.

    IMPORTANT 5 - pregnancy risk. Added the phenotype above plus a Pregnancy Risk Counselling and Intensified Peripartum Aortic Imaging treatment carrying the GeneReviews management paragraph. Two new references were fetched: PMID:41718126 (an LDS pregnancy cohort plus the 522-pregnancy systematic-review figures, ~4% aortic dissection and ~1% peripartum maternal mortality, both marked PARTIAL because the cohort's commonest genotypes were TGFBR2/TGFBR1/SMAD3 and neither figure is TGFB2-specific) and PMID:30725712 for the ARB contraindication in pregnancy, which is now stated in the Angiotensin Receptor Blocker Therapy description and cited there and on the pregnancy treatment, marked PARTIAL as a class-level safety statement rather than LDS evidence.

    SUGGESTIONS 6-8. Added Surgical Fixation of Cervical Spine Instability (NCIT:C16186), Subacute Bacterial Endocarditis Prophylaxis (NCIT:C51993), Hernia Repair with Supporting Mesh (NCIT:C168249, pairing with the existing Recurrent Hernia phenotype) and Allergy and Gastrointestinal Inflammation Management (NCIT:C15747), all on GeneReviews management quotes. Added clinical_trials: NCT05472519 (I-LoDiS), which is justified now that the immuno-allergic phenotypes are curated - it reads out pSMAD2/3, the same signal whose direction is the subject of tgfb2_signaling_direction_paradox - with all its evidence marked OTHER and a notes: block recording that a registration record is a study description, not study evidence, and that no results are quoted. The three orphan DOI cache files (DOI:10.1038/ng.2349, DOI:10.3390/diagnostics13040772, DOI:10.3400/avd.ra.24-00013) were deleted: nothing anywhere in kb/ cited them, they duplicated already-cited PMIDs, and DOI: is in skip_prefixes so they were never snippet-checked.

    SUGGESTION 9 - the deferred umbrella Type 4 contradiction is now filed as issue #8867. The deferral itself stands: kb/disorders/Loeys-Dietz_Syndrome.yaml was again left untouched because PR #8861 is live in that file.

    Validation actually run on the changed file: just validate (schema PASSED, term validation PASSED, reference validation PASSED); just count-verified-snippets (124/124 verified against cached references, up from 92/92); just validate-terms (PASSED); just check-duplicate-keys (OK, no duplicate mapping keys); just check-empty-snippets (none); just check-title-snippets --check --against-ref origin/main (no findings in this entry - the four reported are pre-existing in an unrelated file, Juvenile_Neuronal_Ceroid_Lipofuscinosis.yaml); and just validate-disorders on the changed file as the pre-PR sweep (passed, including the --no-full-text reference pass). All new reference cache files were created by just fetch-reference, never by hand.

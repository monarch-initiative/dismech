  summary: 'Review round 3: reconcile cervical spine instability, curate BAV, evidence-discipline
    fixes'
  details: |
    Third-round review response.

    BLOCKING item - cervical spine malformation/instability contradicted itself in four
    places. The entry asserted absence in TGFB2 patients in the description and in
    differential_diagnoses/distinguishing_features (PMID:29392890, TGFB2-specific mutation
    update) while simultaneously curating the feature as a phenotype (HP:0010646) and as a
    treatment (surgical fixation) on spectrum-level GeneReviews evidence (PMID:20301312,
    which spans SMAD2/SMAD3/TGFB2/TGFB3/TGFBR1/TGFBR2/IPO8 collectively and makes no
    per-gene assignment). Reconciled by option (a): removed the phenotype and treatment
    blocks and added KNOWLEDGE_GAP discussion
    lds4_cervical_spine_instability_subtype_status, which retains both mined GeneReviews
    snippets as supports: PARTIAL evidence, states the scope mismatch explicitly, records
    the non-curation decision and its reasoning in notes, and proposes systematic cervical
    spine imaging in a molecularly confirmed TGFB2 cohort with a receptor-related
    comparison group. attaches_to points at
    pathophysiology#Reduced TGF-beta 2 Ligand Availability. Description and
    distinguishing_features softened from "has not been reported" to "has not yet been
    reported" to match the source wording and the open-gap framing, and
    distinguishing_features now cross-references the discussion id. All four locations
    now agree.

    Suggestion 2 - dropped frequency: FREQUENT from Scoliosis; both snippets are
    membership lists establishing presence rather than prevalence, and the reason is now
    recorded in the phenotype description.

    Suggestion 3 - curated Bicuspid Aortic Valve (HP:0001647) from the PMID:34680857
    LDS-shared feature group, so the SBE-prophylaxis description's reference to "the valve
    disease curated here" is now true. No frequency band curated.

    Suggestion 4 - Pectus Deformity rebound from HP:0000767 Pectus excavatum to the parent
    HP:0000766 Abnormal sternum morphology, since the source states only "pectus deformity"
    and no cited source states excavatum rather than carinatum; the granularity mismatch
    and both specific children are recorded in the description.

    Suggestion 5 declined - the deep-research report itself cautions that the 15-patient
    founding cohort is too small for stable prevalence estimates, and NCT02504853 is a
    spectrum-level natural history study of the same class as the GeneReviews evidence
    just demoted.

    Validation actually run: just validate (schema + terms + references) passed;
    just count-verified-snippets reports 125/125 verified against cached references;
    just validate-terms passed; just check-duplicate-keys OK; just validate-disorders
    passed; uv run pytest tests/test_data.py -k "discussion or attaches or conforms or
    subtype_foreign" 6191 passed. No new PMIDs were introduced, so no reference fetch was
    needed, and no ontology terms were added that were not already in cache/hp/terms.csv
    and the phenotypeterm enum cache.

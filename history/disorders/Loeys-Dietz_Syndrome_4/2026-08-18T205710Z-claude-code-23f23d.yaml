  summary: 'Create: Loeys-Dietz Syndrome 4 (TGFB2, MONDO:0013897)'
  details: |
    New standalone Mendelian entry for Loeys-Dietz syndrome 4 (TGFB2, MONDO:0013897, OMIM:614816), resolving issue #8750.

    Deep research: falcon (research/Loeys-Dietz_Syndrome_4-deep-research-falcon.md). NEC preflight `just preflight-dr <report> MONDO:0013897` returned PASS (canonical gene TGFB2 mentioned 50 times; next gene TGFBR1 at 11; MONDO OMIM xref 614816). The report's own Reference Validation section reported 4/4 references resolved, 0 unresolved. Substantive curation was anchored on primary literature fetched directly with `just fetch-reference` rather than on falcon-keyed citations: the two 2012 defining papers (PMID:22772368 Lindsay, PMID:22772371 Boileau), the 2018 LDS mutation update (PMID:29392890), GeneReviews Loeys-Dietz Syndrome (PMID:20301312, tagged GeneReviews in the top-level references block), plus PMID:25163805, PMID:27782106, PMID:34680857, PMID:35426477, PMID:39737004, PMID:40139558, PMID:41170304, PMID:38919319, PMID:36832261 and ORPHA:60030.

    Content: six-node pathophysiology chain (TGFB2 loss-of-function variant -> reduced ligand availability -> paradoxical aortic TGF-beta signalling dysregulation -> medial degeneration -> progressive aortic root dilation -> dissection/rupture), with a parallel TGFBR3-dependent smooth muscle differentiation arm; four nodes declare conforms_to against aortopathy_tgfbeta_dysregulation. Two mechanistic_hypotheses (CANONICAL compensatory ligand overshoot; EMERGING TGFBR3-dependent SMC differentiation defect) and two KNOWLEDGE_GAP discussions (direction of the TGF-beta paradox; attribution of the 1q41-deletion neurodevelopmental phenotype between TGFB2 and the co-deleted RRP15). Tgfb2+/- mouse (animal_models) and TGFB2-KO/+ human iPSC SMC/tissue-ring system (experimental_models) are both linked into the pathograph via modeled_mechanisms with readouts and per-link evidence. 19 phenotypes, 6 treatments, 3 differential diagnoses, 3 progression phases.

    Scoping decision: curated as a standalone entry rather than by binding the unbound "Loeys-Dietz Syndrome Type 4" subtype stub in kb/disorders/Loeys-Dietz_Syndrome.yaml. This matches the established precedent for the other gene-defined LDS subtypes - LDS3 (SMAD3) is Aneurysm-Osteoarthritis_Syndrome on MONDO:0013426 and LDS5 (TGFB3) is Rienhoff_Syndrome on MONDO:0014262, both standalone entries on their own MONDO terms while the umbrella entry retains narrative subtype stubs. Loeys-Dietz_Syndrome.yaml was deliberately left untouched because sibling agents are concurrently curating LDS2 (#8749) and LDS6 (#8751). Noted for a follow-up: the umbrella's Type 4 stub says "lower prevalence of musculoskeletal involvement", which is contradicted by PMID:25163805 ("articular and skeletal signs are prevalent"); not corrected here to avoid a concurrent-edit conflict.

    Validation actually run on the entry: `just check-duplicate-keys` (OK, no duplicate mapping keys); `just validate` (schema PASSED; the reference pass surfaced one snippet failure caused by a stripped bracketed [s] span, fixed by shortening the quote); `just count-verified-snippets` (92/92 verified against cached references); `just validate-terms` (PASSED); and `just validate-disorders` on the changed file as the pre-PR sweep.

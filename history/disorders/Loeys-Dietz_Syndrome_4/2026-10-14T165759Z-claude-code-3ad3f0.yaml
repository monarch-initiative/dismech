  details: |
    Evidence-claim review of the full entry (129 snippets, all verified against the local reference cache; literature was limited to that cache because PubMed was unreachable). Fixed one mismatch: the PMID:24193348 item in genetic[] claimed its snippet supported the haploinsufficiency mechanism, but the quoted sentence speaks only to rarity and Loeys-Dietz rather than Marfan placement; the explanation was corrected and the abstract's own haploinsufficiency sentence added as a separate INDIRECT item. Added quote_role BACKGROUND to five items whose snippets come from a paper's introduction or background rather than its own results (PMID:25163805 x3 including the Renard et al. summary, PMID:41170304, PMID:39737004 prevalence sentence). Checked gaps: inheritance is bound to HP:0000006; no cached ClinGen CGGV record exists for TGFB2, so no gene_disease_validity was added; the only causally unconnected phenotype is Hypotonia and Gross Motor Delay, deliberately left unwired because the 1q41 deletion also removes RRP15 and attribution to TGFB2 is an open discussion. Validated with validate, validate-terms, count-verified-snippets, entity-ref, causal-target, duplicate-key, qualifier-term and gene-term checks, the KB-wide snippet/prose gates, and validate-disorders.

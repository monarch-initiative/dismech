  summary: 'Close reviewer blocking items 1-4 and 9 on PR #7631'
  details: |
    Applied the five open reviewer items on PR #7631.

    Item 1 (the one that mattered). The top-level notes: block asserted that 'no verbatim snippet supporting them exists in any cached abstract' for a list of HPOA-annotated features including long philtrum. That assertion was false: references_cache/PMID_34680978.md contains, verbatim, 'We suggest that Williams syndrome-like phenotypes, namely, periorbital edema, hanging cheek, and long and smooth philtrum represent expanded phenotypes of OTUD6B-related ID.' The false claim was removed and replaced with an accurate account of why the remaining HPOA rows are omitted (they come from the PMID:28343629 full-text table, not its abstract), which also folds in reviewer suggestion #7 by acknowledging that the cached full text of PMID:41188742 does carry a 28-case aggregate table with several of those rows. Four new phenotypes were curated from the Williams-like sentence: Periorbital Edema (HP:0100539), Hanging Cheek (HP:0004426 Abnormal cheek morphology, the closest available parent; HPO has no 'hanging cheek' term and the published wording is kept in preferred_term), Long Philtrum (HP:0000343) and Smooth Philtrum (HP:0000319). All four are supports: PARTIAL. The PMID:34680978 proband is a dual-locus case, carrying a hemizygous OTUD6B c.873delA over a paternal 0.118 Mb 8q21.3 whole-gene deletion AND a heterozygous ZMIZ1 c.1491 + 2T > C splice variant confirmed by mRNA study to skip exon 14, so attribution of the facial gestalt to OTUD6B alone is not secure and the paper itself only 'suggests' it. Each phenotype's notes: names the ZMIZ1 confounder and cross-references the ZMIZ1 differential (MONDO:0032855). The 'Blended phenotypes and attribution discipline' paragraph was rewritten to match, since it previously claimed no PMID:34680978 features were attributed at all.

    Item 2. The pathophysiology node 'Impaired Cell Growth and Proliferation' bound GO:0030182 neuron differentiation with modifier ABNORMAL, which none of its evidence supported; its evidence is entirely about DNA synthesis in NSCLC cell lines. Replaced with GO:0008283 cell population proliferation (ABNORMAL) and GO:0040007 growth (DECREASED), with a node-level note recording the removal and why.

    Item 3. Added a diagnosis: section with three records, and moved the diagnostic claim that was living inside a genetic: evidence explanation out of that section. Trio Exome Sequencing (NCIT:C101295) cites the trioWES sentence from PMID:41188742 and the parental-segregation sentence from PMID:30364145, the latter because the trio design is what establishes the two alleles are in trans. Chromosomal Microarray (NCIT:C18477) cites the CMA/WES/mRNA assay sentence and the 8q21.3 deletion sentence from PMID:34680978, making the point that exome alone reports that proband as a single heterozygote and misses the diagnosis. Reflex OTUD6B Testing in Suspected Rubinstein-Taybi or Kabuki Syndrome (NCIT:C15709) cites the authors' own reflex-testing recommendation in PMID:30364145 plus the documented Kabuki misdirection in PMID:38389298; PMID:30364145 had not previously been used for its diagnostic-pathway content.

    Item 4. Added Levothyroxine Replacement for Hypothyroidism (NCIT:C15986 Pharmacotherapy, therapeutic_agent CHEBI:18332 L-thyroxine, therapeutic_modality SMALL_MOLECULE), citing two verbatim sentences from the cached full text of PMID:41188742: treatment initiation and the dose-titration/normal-range follow-up. The second snippet is quoted with the source's own typographic artifacts ('3monts') rather than retyped.

    Item 9. Bound disease_term on all four differential_diagnoses entries: MONDO:0060596 (BPTF/NEDDFL), MONDO:0032855 (ZMIZ1), MONDO:0025351 (OTUD5, RO:0004003 HGNC:25402, OMIM:301056) and MONDO:0012774 (chromosome 15q13.3 microdeletion syndrome). Every label was read off the ontology with OAK rather than assumed. The 15q13.3 binding carries a note explaining that MONDO has no OTUD7A gene-disease entity and no RO:0004003 OTUD7A relation on that term, so the contiguous-gene deletion syndrome is the correct and only bindable target. The BPTF and ZMIZ1 differentials also gained evidence: PMID:33522091 (fetched; previously named in notes as excluded, now cited only against the BPTF differential, which is the honest place for it) and three sentences from PMID:34680978 establishing the ZMIZ1 phenotypic overlap, the inheritance-mode discriminator and the exon-14-skipping functional confirmation.

    Validation. just validate clean (schema, terms, references). 100/100 snippets verified by both just validate-references and scripts/check_snippets_verbatim.py. check_folded_hyphens.py clean. Compliance 98.7 percent global / 99.1 percent weighted, up from 98.3/98.7. references_cache/ churn from #7507 reverted; only the newly fetched PMID_33522091.md is added. cache/*.csv additions are purely additive (10 added lines, 0 deleted). No MANIFEST bump and no scope-override; the ClinGen and Orphanet structured-source pins remain stale per #7622 and are still recorded descriptively in notes: rather than cited.

    Not done. Reviewer suggestions #5 (a discussions: HUMAN_MODEL_MISMATCH block for the subviable Otud6b null mouse versus surviving human null-allele individuals) and #6 (PMID:21267069, the first functional characterization of OTUD6B DUB activity) are left open as non-blocking. The OTUD5 and 15q13.3 differentials still carry no evidence, because no suitable reference is cached and guessing a PMID would violate the no-fabrication rule.

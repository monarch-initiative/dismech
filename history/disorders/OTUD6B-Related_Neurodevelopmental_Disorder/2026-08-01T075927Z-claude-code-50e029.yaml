  summary: 'Create: OTUD6B-Related_Neurodevelopmental_Disorder'
  details: |
    Created the dismech entry for OTUD6B-related neurodevelopmental disorder (IDDFSDA), anchored on MONDO:0044319 / OMIM:617452 / OTUD6B (hgnc:24281). NEC preflight run first: 'uv run runoak -i sqlite:obo:mondo info MONDO:0044319 -O obo' confirmed the RO:0004003 gene-association relation points to HGNC:24281 OTUD6B. The entry is explicitly kept distinct from the near-identically-named MONDO:0060596 (BPTF-related NEDDFL) and MONDO:0032855, and from the other OTU-family disease genes OTUD5, OTUD7A and OTUD1/OTUB1; the large OTUD6B-AS1 lncRNA cancer literature was excluded. Deep research provider: claude_code (just research-disorder claude_code), 17m23s, 6 web searches, 96 turns, 40 citations, report committed under research/. No GeneReviews chapter exists for OTUD6B (PubMed searches for 'OTUD6B GeneReviews' returned zero hits), so no GeneReviews baseline was available. Content: 9 atomic pathophysiology nodes forming one connected DAG rooted at 'Biallelic OTUD6B Loss-of-Function Variants', covering the patient-validated 26S proteasome assembly arm (19S incorporation defect, reduced chymotrypsin-like activity, ubiquitin-conjugate accumulation) and the mTORC1-linked translation-initiation arm, converging on impaired growth/proliferation and disrupted organogenesis; every causal edge carries its own evidence item. 25 phenotypes with HPO bindings, including a REFUTE-flagged Retinal Degeneration entry recording that the retinal phenotype in PMID:34354232 was traced to a co-segregating RP1L1 variant rather than OTUD6B. Frequency bands were applied only where a published denominator exists: eight bands derived from phenotype.hpoa n/m counts for OMIM:617452 (independently verified against the current HPO release, not taken on trust from the research report) and one from the explicit 1-of-28 denominator in PMID:41188742; all other bands omitted by design, with the ascertainment-bias caveat recorded in notes. Also added genetic, inheritance, prevalence, classifications and four treatment entries. Structured-source citations (CGGV for the ClinGen Definitive assertion, ORPHA:505237) could not be generated in this environment and are recorded descriptively in notes per the guidance in issue 7622. Validation: 'just validate' clean (schema, terms, references), 84/84 snippets verified by both the built-in reference validator and the independent scripts/check_snippets_verbatim.py, check_folded_hyphens.py clean, compliance 99.5 percent global / 100 percent weighted.

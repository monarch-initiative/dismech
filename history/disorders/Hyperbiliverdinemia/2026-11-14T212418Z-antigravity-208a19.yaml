  summary: Review and enrich Hyperbiliverdinemia
  details: >-
    Audited and enriched Hyperbiliverdinemia (MONDO:0013595). Populated evidenced Harrison chapters (GASTROINTESTINAL, ENDOCRINOLOGY_METABOLISM with heme-catabolism support from PMID:40002374, GENETICS_ENVIRONMENT_DISEASE) and ICIMD category heme_degradation_and_bilirubin. Grounded Cholestatic Impairment of Biliary Biliverdin Clearance with liver (UBERON:0002107) and biliary tree (UBERON:0001173) anatomy while omitting hepatocyte/liver restriction on the ubiquitous BLVRA enzymatic lesion node and omitting GO:0032782 (bile acid secretion) where biliverdin retention is the claimed process. Added Cholestasis (HP:0001396) phenotype backed by PMID:21278388 and ORPHA:276405 as the upstream unmasking clinical condition, and split diagnostic LC-MS and sequencing entries with specific NCIT bindings (NCIT:C47868 Blood Chemistry Measurement, NCIT:C61044 Urine Chemistry Measurement, NCIT:C153598 DNA Sequencing).

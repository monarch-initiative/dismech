  summary: Review and enrich Hyperbiliverdinemia
  details: >-
    Audited and enriched Hyperbiliverdinemia (MONDO:0013595). Populated evidenced Harrison chapters (GASTROINTESTINAL, ENDOCRINOLOGY_METABOLISM, GENETICS_ENVIRONMENT_DISEASE) and ICIMD category heme_degradation_and_bilirubin. Enriched pathophysiology grounding with hepatocyte (CL:0000182) and liver (UBERON:0002107) on Impaired Reduction of Biliverdin IXalpha to Bilirubin, and liver (UBERON:0002107), biliary tree (UBERON:0001173), and decreased bile acid secretion (GO:0032782) on Cholestatic Impairment of Biliary Biliverdin Clearance. Added Cholestasis (HP:0001396) phenotype backed by PMID:21278388 and ORPHA:276405 as the upstream unmasking clinical condition, and split diagnostic LC-MS and sequencing entries with specific NCIT bindings (NCIT:C47868 Blood Chemistry Measurement, NCIT:C61044 Urine Chemistry Measurement, NCIT:C153598 DNA Sequencing).

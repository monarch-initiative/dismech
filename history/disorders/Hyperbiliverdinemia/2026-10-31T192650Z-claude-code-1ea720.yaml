  summary: 'Create: Hyperbiliverdinemia (BLVRA)'
  details: |
    New entry for hyperbiliverdinemia (MONDO:0013595), the BLVRA-related inborn error of heme catabolism. Curated from primary sources: Nytofte 2011 (PMID:21278388, homozygous c.214C>A p.Ser44Ter in two Greenlandic Inuit women, in vitro null enzyme, reversal after surgical relief of cholestasis, unaffected homozygous sister), Gafvels 2009 (PMID:19580635, heterozygous p.Arg18Ter with decompensated cirrhosis), the Greenland carrier screen in PMID:27387768, the Mancuso 2025 review abstract (PMID:40002374), the canine BLVRA deletion paper (PMID:39766828) and the Blvra knockout mouse (PMID:40659617), plus ORPHA:276405 (newly cached) and the ClinGen CGGV record (Moderate, AR), copied into gene_disease_validity. Causal chain: BLVRA loss of function -> failed biliverdin IXalpha reduction -> systemic biliverdin accumulation, with a second required input from cholestatic impairment of biliary clearance; all four clinical phenotypes are wired from the accumulation node. Cholelithiasis is recorded without an inbound edge because the source states a causal link could not be determined. Name kept as Hyperbiliverdinemia (no established BLVRA gene-related name; scope caveat in notes). HP:0001000 carries the cached label 'Abnormality of skin pigmentation' rather than the current OLS label (dismech#11750). One openscientist deep-research report was used as leads only: 14/14 references resolved, preflight-dr PASS. It added no claim to the entry; it misstated that a homozygous brother was unaffected (the abstract says the brother was homozygous normal), described the canine paper as human clinical, and omitted the Gafvels case. A plain re-fetch of PMID:40002374 rewrote its committed abstract-only cache file with full text; that change was reverted, and only abstract text from it is cited. Validated with just validate, count-verified-snippets (all verified), validate-terms, check-genereviews (NO_CHAPTER), the whole-repo gates and validate-disorders.

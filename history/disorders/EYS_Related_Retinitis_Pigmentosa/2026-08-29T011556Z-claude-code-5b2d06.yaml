    # Fixes: EYS-Related Retinitis Pigmentosa

    File: `/home/user/dismech/kb/disorders/EYS_Related_Retinitis_Pigmentosa.yaml`
    Review: `reviews/EYS_Related_Retinitis_Pigmentosa.md` (4 MAJOR + 4 MINOR)

    ## New references fetched (via `scripts/run_reference_validator.sh cache reference`)

    | ID | Paper | Used for |
    |---|---|---|
    | PMID:27737822 | Yu 2016, *Eyes shut homolog is required for maintaining the ciliary pocket and survival of photoreceptors in zebrafish* | vertebrate connecting-cilium/transition-zone localization; zebrafish mutant photoreceptor loss |
    | PMID:28378834 | Lu 2017, *Ablation of EYS in zebrafish causes mislocalisation of outer segment proteins, F-actin disruption and cone-rod dystrophy* | TALEN zebrafish knockout phenotype; EYS role in protein transport |
    | PMID:27846257 | Alfano 2016, *EYS Is a Protein Associated with the Ciliary Axoneme in Rods and Cones* | human Y79 ciliary-axoneme localization |
    | PMID:20333770 | Audo 2010, *EYS is a major gene for rod-cone dystrophies in France* | European case fraction (12%); non-truncating variants |
    | PMID:22363543 | Hosono 2012, *Two novel mutations in the EYS gene ... Japanese population* | Japanese arRP case fraction (18%) |

    Note: the review named **PMID:27812112** as "Alfano 2016". That PMID is a
    tacrolimus-vs-ciclosporin liver-transplant meta-analysis. The real Alfano 2016
    EYS paper is **PMID:27846257**, which is what was cited.

    ## Findings fixed

    1. **MAJOR — same sentence, two `evidence_source` values (baselined divergence).**
       The PMID:18836446 sentence "EYS is independently disrupted in four other mammalian
       lineages, including that of rodents" reports comparative genomics, so it is now
       `COMPUTATIONAL` in **both** places (`treatments` > Gene Augmentation Therapy,
       `animal_models` > Zebrafish). The overlapping longer quote in the `references:`
       section ("Spanning over 2 Mb ... including that of rodents"), which the
       containment rule also compares, was regraded to `COMPUTATIONAL` too, so all three
       agree. `scripts/check_snippet_grading.py` no longer reports this file (its
       baseline row at line 96 is now stale, not violated; the baseline file was **not**
       edited).

    2. **MAJOR — zebrafish model attributed to a paper with no zebrafish.** The model is
       now grounded in two real zebrafish EYS papers: Lu 2017 (TALEN EYS-knockout line,
       early visual impairment, progressive cone-predominant degeneration) and Yu 2016
       (engineered loss-of-function alleles, progressive cone and rod loss). Removed the
       uncited morpholino/CRISPR and "primary in vivo system ... for preclinical gene
       therapy evaluation" claims; `genotype` changed to the engineered alleles actually
       reported. The PMID:18836446 pseudogenization quote is retained but downgraded to
       `PARTIAL`/`COMPUTATIONAL` with an explanation stating it says nothing about
       zebrafish. Top-level `notes` lost the uncited "pig models" claim.

    3. **MAJOR — uncited prevalence figures + deprecated `percentage`.** The derived
       "1 in 70,000–200,000" / "5–11% of ARRP" record is gone. Replaced with a structured
       record (`measure_type: UNKNOWN`, `prevalence_class: NOT_YET_DOCUMENTED`, no
       `percentage`) whose notes state plainly that no EYS-specific population prevalence
       is cited, evidenced by the Orphanet worldwide RP point-prevalence row
       (`1-5 / 10 000 | Worldwide | Point prevalence | EXPERT`, graded PARTIAL) and the
       RP25 "first major locus" quote (PARTIAL, explanation now says the paper gives no
       case fraction or rate). The genuine, citable quantities moved to
       `genetic[0].case_fractions` per CLAUDE.md: 12% of a 239-case French cohort
       (PMID:20333770) and 18% of a 100-case Japanese arRP cohort (PMID:22363543). The
       `description`'s epidemiology sentence now quotes those two cohort numbers instead
       of the uncited 5–11% / East Asia phrasing.

    4. **MAJOR — Ciliary Structural Disruption grounded only in Drosophila.** Added three
       sources: Yu 2016 for "EYS localized near the connecting cilium/transition zone in
       photoreceptors" and for ciliary-pocket disruption in mutant zebrafish
       (MODEL_ORGANISM), Alfano 2016 for "EYS was observed at the ciliary axoneme in Y79
       ciliated cells" (IN_VITRO — the closest human-derived support), and Lu 2017 for the
       protein-transport role (MODEL_ORGANISM), which is what the `protein localization to
       cilium` / `intraciliary transport` annotations rest on. The node description now
       attributes the localization/transport claims to zebrafish, primate retina and human
       Y79 cells and says explicitly that the human claims are inferred from these rather
       than directly demonstrated. Same softening applied in the "EYS Protein Deficiency"
       description and the top-level `description`. **No ontology bindings were changed.**

    5. **MINOR — `evidence_source` misgrading inside PMID:18836446 items** (`EYS Protein
       Deficiency`): domain-prediction quote → `COMPUTATIONAL`; RT-PCR tissue/Y79
       expression quote → `IN_VITRO`; insect-ortholog inference quote → `MODEL_ORGANISM`
       with an explanation noting it is hedged ("may possess"). Explanations updated to
       match.

    6. **MINOR — pooled-RP (ORPHA:791) frequencies on an EYS-specific entry.** No evidence
       deleted (the review calls the parent record a reasonable, disclosed fallback).
       Added an explicit statement to top-level `notes` that all phenotype and diagnostic
       frequencies are Orphanet pooled-RP values, not RP25 values, because no EYS-specific
       natural-history frequency source is cited.

    7. **MINOR — treatment claims exceeding evidence.** Gene Augmentation Therapy: the
       uncited "9.5 kb" is now "approximately 9 kb", sourced by a new PMID:18836446 item
       ("The full coding region of the RP25 gene (~9 kb) was amplified in two overlapping
       fragments", IN_VITRO), and "investigational programs are ongoing" is replaced with
       "no specific investigational program is cited in this entry". Carbonic Anhydrase
       Inhibitor Therapy: description now states that the efficacy evidence is from the
       general RP literature and is not cited here; the ORPHA target-phenotype evidence is
       unchanged (still PARTIAL).

    8. **MINOR — "all described pathogenic variants lead to premature stop codons".**
       Rewritten in both `genetic[0].features` and the top-level `description` to bound the
       claim to the original six variants, with a new Audo 2010 evidence item ("In
       addition, twenty missense, silent or splice-site mutations were detected.") showing
       non-truncating variants exist. The 2008 six-mutation item's explanation now says it
       is a statement about those six variants, not the full spectrum.

    ## Skipped / deliberately not done

    - **Ontology bindings on the Ciliary Structural Disruption node** (`GO:0035869`,
      `GO:0061512`, `GO:0042073`): kept. The review flags them as under-evidenced rather
      than wrong, and the protocol allows a binding change only when the report says the
      term is wrong. They are now supported by the zebrafish transport/ciliary-pocket
      evidence, with the species caveat stated in the node description.
    - **`tests/snippet_grading_baseline.txt`**: not edited (out of scope; a stale
      grandfather row is harmless, and the checker reports nothing for this file).
    - **`references:` section**: the five new PMIDs are cited inline but not added as new
      top-level `references:` entries, to keep the change minimal; only the incorrect
      claim inside the existing PMID:18836446 finding statement ("supports zebrafish as
      the preferred experimental organism") was corrected.
    - **No `modeled_mechanisms` added** to the zebrafish model (would be an enhancement,
      not a defect fix).


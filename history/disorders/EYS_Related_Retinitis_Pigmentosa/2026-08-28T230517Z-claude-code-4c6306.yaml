    # Review: EYS-Related Retinitis Pigmentosa

    - File: `/home/user/dismech/kb/disorders/EYS_Related_Retinitis_Pigmentosa.yaml`
    - Review date: 2026-08-28
    - Mechanical snippet audit: **35/35 verified** against cached references (no unverified snippets)

    ## Verdict: NEEDS_FOLLOWUP

    All snippets are verbatim, but several claim-fidelity problems exist: a same-sentence
    evidence_source conflict (already baselined), an animal-model description whose species
    claims appear in no cited source, quantitative prevalence figures with no supporting
    citation, and a mechanism node whose key vertebrate-localization claims rest solely on
    a Drosophila quote.

    ## Findings

    ### 1. MAJOR — Same quoted sentence graded with two different `evidence_source` values
    - Location: `treatments` > "Gene Augmentation Therapy (EYS, Investigational)" (PMID:18836446, `HUMAN_CLINICAL`) vs `animal_models` > Zebrafish (PMID:18836446, `MODEL_ORGANISM`).
    - Entry: both cite the identical sentence "EYS is independently disrupted in four other mammalian lineages, including that of rodents" with different `evidence_source` values.
    - Paper: the sentence reports a comparative-genomics analysis of mammalian genome sequences ("this gene has been dispensed with on at least four separate occasions in the last ~100 million years of mammalian evolution"); it is neither a human clinical observation nor an in vivo animal experiment — `COMPUTATIONAL` is the closest fit for this specific sentence.
    - Why it matters: this is precisely the check-snippet-grading (#8184) defect class — `evidence_source` classifies the cited publication content and cannot change because the quote moved. It is already recorded in `tests/snippet_grading_baseline.txt` (line 96), so CI tolerates it, but the review should surface it: both instances are misgraded, not just inconsistent.

    ### 2. MAJOR — Zebrafish animal model: species claims not in the cited source
    - Location: `animal_models` > Zebrafish "eys morphant/mutant" (only evidence: PMID:18836446).
    - Entry claims: "Zebrafish express eys in photoreceptors... Morpholino-mediated knockdown or CRISPR knockout of zebrafish eys produces photoreceptor structural defects, validating the ciliary spacer function of EYS. These models are the primary in vivo experimental system... for preclinical gene therapy evaluation."
    - Paper actually says: nothing about zebrafish. Its experimental species are Drosophila (rhabdom architecture), human (patients, retina RT-PCR, Y79 cells), and mammalian genome comparisons; mouse is discussed only as lacking eys. The quoted snippet supports only rodent pseudogenization.
    - Why it matters: the entire zebrafish phenotype claim (knockdown/knockout retinal defects) is attributed to a paper that never mentions zebrafish. Real zebrafish eys papers exist (e.g., Yu 2016, Lu 2017, Messchaert 2018) but none is cited. This is an unsupported model-organism claim, and the model has no citable grounding in the entry.

    ### 3. MAJOR — Prevalence figures unsupported by the cited evidence
    - Location: `prevalence` (population "General European population", `percentage: 0.0005-0.0014%`, notes claiming "1 in 70,000–200,000", "~1 in 4,000" RP prevalence, "5–11% contribution of EYS variants... in European cohorts"); the 5–11% and East Asian claims also appear in the top-level `description`.
    - Only evidence: PMID:18836446 snippet "RP25 as the first major locus for recessive retinitis pigmentosa".
    - Paper actually says: only that other ARRP loci each account for 1–5% and that RP25 is the "first major locus"; it gives no EYS case fraction, no overall RP prevalence, and says nothing about East Asian populations (the 5–11% / East Asia figures come from later cohort literature, e.g., Audo 2010, Hosono 2012 — none cited).
    - Why it matters: every number in the prevalence record and the description's epidemiology sentence is uncited. The derivation chain (1/4,000 × 5–11% of ARRP) is curator arithmetic presented as sourced fact. Structured `measure_type`/`prevalence_class`/`rate_per_100000` slots are also absent while the deprecated `percentage` field is populated on a new (2026-06-30) entry, contrary to the "do not populate `percentage` on new records" rule.

    ### 4. MAJOR — Ciliary Structural Disruption node: vertebrate localization claims rest solely on Drosophila evidence
    - Location: `pathophysiology` > "Ciliary Structural Disruption" (sole evidence: PMID:18836446 Drosophila rhabdom sentence, correctly graded MODEL_ORGANISM); related text also in "EYS Protein Deficiency" description.
    - Entry claims: "EYS localizes to the connecting cilium and periciliary space of photoreceptors... Loss of EYS disrupts the structural integrity of this ciliary compartment, impeding the transport of newly synthesized membrane components into the outer segment"; annotates GO:0035869 (ciliary transition zone), GO:0061512 (protein localization to cilium, ABNORMAL) and GO:0042073 (intraciliary transport, ABNORMAL).
    - Paper actually says: SPAM localizes "in the photoreceptor layer" (immunohistochemistry) and that insect orthologs suggest a role "in maintaining the integrity of the photoreceptor cells". It contains no connecting-cilium/periciliary localization, no transition-zone data, and nothing about intraciliary transport. Those claims come from later work (e.g., Alfano 2016 PMID:27812112) that is not cited.
    - Why it matters: the node's ontology annotations and its `conforms_to` ciliopathy-module claim are grounded, within this entry, only in an insect-eye architecture experiment. The human/vertebrate ciliary mechanism — the actual content of the node — has no citation, and the only evidence is model-organism data standing alone for a human-disease mechanism node.

    ### 5. MINOR — evidence_source misclassifications within PMID:18836446 items
    - Location: `pathophysiology` > "EYS Protein Deficiency" evidence items (all graded HUMAN_CLINICAL).
    - (a) RT-PCR snippet ("amplified the expected-size product only from the retina and from a photoreceptor-like cell line, Y79") is an expression assay on tissue cDNA and a cultured cell line — IN_VITRO per the repo's rules. (b) "RP25 is predicted to be a multidomain protein..." is an in silico sequence/domain prediction — COMPUTATIONAL. (c) "Information about the established function of insect orthologs suggests..." is an inference from insect data, not a human clinical observation.
    - Why it matters: the paper mixes sources; per CLAUDE.md, items should be split and graded per sentence. Low impact because the claims themselves are correctly quoted.

    ### 6. MINOR — Generic-RP (ORPHA:791) evidence carries all phenotype/diagnosis frequencies for an EYS-specific entry
    - Location: all 9 `phenotypes`, 4 of 5 `diagnosis` entries, 3 of 5 `treatments`.
    - ORPHA:791 is the parent disease "Retinitis pigmentosa" (all genetic forms); its frequency bands (e.g. HP:0007675 Very frequent) describe RP overall, not RP25. Explanations mostly disclose this ("of RP in general"), and using the parent record is a reasonable fallback, but the `frequency:` values on EYS-RP phenotypes are inherited from the pooled-RP table without any EYS-specific frequency source; no EYS natural-history study (e.g., Pierrache 2019) is cited anywhere.
    - Why it matters: mild sibling/parent-disease generalization; consistent and disclosed, so MINOR.

    ### 7. MINOR — Treatment claims exceeding their evidence
    - Location: `treatments` > "Gene Augmentation Therapy" (9.5 kb exceeding AAV capacity, dual-vector strategies, "investigational programs ongoing" — no citation; the PARTIAL-graded rodent-pseudogenization quote is only tangentially related) and > "Carbonic Anhydrase Inhibitor Therapy for CME" (efficacy claim; explanation itself concedes "Specific CAI evidence is from the broader RP literature" and grades PARTIAL).
    - Why it matters: both are honestly graded PARTIAL and hedged, but the substantive treatment claims have no supporting citation in the entry.

    ### 8. MINOR — "All described pathogenic variants lead to premature stop codons" overgeneralizes a 2008 six-family result
    - Location: `genetic` > "EYS Biallelic Variants" `features` and top-level `description` ("all leading to premature termination").
    - Paper actually says: "we have identified six independent mutations... all leading to premature stop codons in five unrelated families" — a statement about the first six variants, not about the EYS variant spectrum (missense and other non-truncating pathogenic EYS variants are well described in later literature).
    - Why it matters: a bounded 2008 observation is restated as a general property of the gene's mutational spectrum.


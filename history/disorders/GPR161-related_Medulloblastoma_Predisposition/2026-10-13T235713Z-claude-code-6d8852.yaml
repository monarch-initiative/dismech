  summary: 'Create: GPR161-related_Medulloblastoma_Predisposition'
  details: |
    New entry for GPR161-related medulloblastoma predisposition (MONDO:1010204), curated as a germline predisposition separate from Medulloblastoma_SHH_Activated and from the PTCH1- and SUFU-related nevoid basal cell carcinoma syndrome entries.

    Deep research. A falcon (Edison) report was requested and its provider task was created (Edison trajectory ee86eb54-9615-4866-ad21-1b41e1f12838), but the Edison API returned 503 while the client polled it, and 19 attempts to rehydrate that trajectory over about 90 minutes failed with 'Failed to authenticate' while the API root returned 503. Falcon was not restarted. At the orchestrator's direction exactly one claude_code report was run instead and is the committed report (research/GPR161-related_Medulloblastoma_Predisposition-deep-research-claude_code.md). The falcon trajectory can be recovered later with just rehydrate-edison-trajectory ee86eb54-9615-4866-ad21-1b41e1f12838. The claude_code report was built from web-search snippets and was used as a lead only. Its one failed quote (PMC7658916, i.e. PMID:33194646) differs from the source only in formatting. Its carrier-frequency figure (1 in 42,000 to 1 in 125,000) is the per-variant frequency in Begemann 2020, not the overall truncating-variant frequency, so it was not used. Its statements that penetrance, ClinGen validity and surveillance guidance were unknown were superseded by the projected risk in PMID:36961676, the ClinGen Strong assertion, and the 2024 AACR update (PMID:38573059). just preflight-dr exited 2 because the local mondo.db is absent.

    Sources. Begemann et al. 2020 (PMID:31609649) is the defining series and supplies the allele spectrum, second-hit route, onset, subgroup and case fractions. The ClinGen gene-disease validity assertion for this MONDO term (Strong, AD, 2026-01-13) was cached from the current ClinGen download; that download does not match the sha256 pinned in data/clingen/MANIFEST.yaml, and the manifest was not repinned. Mechanism nodes rest on mouse conditional-knockout data (PMID:29386106) and on cell-based work (PMID:23332756, PMID:27357676, PMID:38326651). Management follows the AACR 2024 update. Lump/split: ClinGen split GPR161 medulloblastoma predisposition from pituitary stalk interruption syndrome and spina bifida, and neither is curated here. The 2025 WHO genetic tumour syndrome classification lists GPR161 under nevoid basal cell carcinoma syndrome; that is recorded as a CONTROVERSY discussion and not adopted.

    Gaps. Penetrance is a modelled projection from four truncating cases. The tumor spectrum beyond infant SHH medulloblastoma is unknown. The adult tumors in the index pedigree are not curated as phenotypes. No outcome or treatment-response data specific to carriers were found.

    Validation: just validate, validate-terms, count-verified-snippets (48/48), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-genereviews (NO_CHAPTER), list-gene-term-mismatches, check-block-scalar-comments, check-gene-validity, the gene-activity grounding guard, the ungated snippet/title/grading/retired-prose/environmental/coarse-phenotype/reference-title/folded-hyphen gates, and just validate-disorders (48 snippets, 48 titles, 0 issues) all passed.

  details: |
    Review round on PR #12473 reversed this entry's earlier decision to withhold the GENETICS_ENVIRONMENT_DISEASE Part tag. The earlier rationale keyed on genetic.relationship_type being DISPUTED rather than CAUSATIVE, which is a criterion the enum does not use: HarrisonsChapterEnum keys GENETICS_ENVIRONMENT_DISEASE on chromosomal and Mendelian disorders not better classified by organ system, says nothing about how settled a gene-disease relationship is, and explicitly sanctions dual-tagging an organ-system-classified hereditary disease. Verified the three supporting facts directly: the enum description carries no causal-certainty criterion; Hypertrophic_Cardiomyopathy_25 has relationship_type DISPUTED on its sole causal gene (TCAP) and carries both CARDIOVASCULAR and GENETICS_ENVIRONMENT_DISEASE; and 13 kb/disorders entries combine DISPUTED with this tag. The withheld-tag argument also proved too much, since the entry already asserts category Mendelian, a MONDO term labelled autosomal recessive primary immunodeficiency, and an HP:0000007 autosomal recessive inheritance block. Took Option 1 from the review: added the classification_value with an iuis_category-style caveat note recording that the Part registers the disorder's nosological kind rather than ruling on FCGR3A L66H causality, pointing at the l66h_pathogenicity_disputed discussion and naming the HCM_25 precedent. The L66H causality dispute itself is unchanged and still recorded in the genetic block, the top-level notes Causality paragraph, and that discussion. Validated with just validate (37/37 snippets), check-enum-values, check-duplicate-keys and check-folded-hyphens.

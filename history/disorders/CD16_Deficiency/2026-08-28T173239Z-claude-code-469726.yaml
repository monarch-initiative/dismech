  summary: 'Review round 1: incorporate two omitted homozygotes; causality now disputed'
  details: |
    Review round 1 on PR #9887. The reviewer found two published FCGR3A L66H homozygotes omitted from the initial entry, and both argue against its central claim. Both findings verified independently and both were correct.

    PMID:8874200 [de Vries 1996, Blood] is a second 1996 homozygote, numbered p.L48H from the mature protein, with recurrent viral infection and a severe course after BCG, EBV and VZV, but NORMAL spontaneous cytotoxicity and normal ADCC on formal testing, and an explicit closing caveat asking whether the genotype is causally related to NK deficiency. It was reachable as reference 17 of PMID:23006327, which this PR already cached, so the omission was avoidable from material already in hand.

    PMID:34448085 [Izadi 2021, J Clin Immunol] reports an asymptomatic homozygote found on newborn TREC screening with normal NK lytic function, documents the flow-cytometry gating artifact by which an L66H homozygote reads as NK-cytopenic under a CD16-inclusive gate, reports gnomAD frequency of about 5 percent overall with roughly 100 homozygotes, and concludes the variant is unlikely to be a direct genetic cause.

    Substantive consequences, not cosmetic: genetic.relationship_type moved CAUSATIVE to DISPUTED; the variant clinical_significance moved PATHOGENIC to UNCERTAIN_SIGNIFICANCE; the cytotoxicity node gained two REFUTE-graded evidence items and PROVISIONAL mechanism_confidence; a new l66h_pathogenicity_disputed CONTROVERSY was added; the NK-count controversy was rewritten around three distinct mechanisms, preserving the reviewer precision point that Jawahar gated CD56+CD3- without CD16 so the index patient count is NOT the artifact; prevalence now separates syndrome rarity from genotype commonness.

    Other review items addressed: dropped the HP:0031410 phenotype, which asserts an altered subset proportion while the claim and snippet were about subset-restricted CD2 expression, since the biology is carried by the pathophysiology node; removed the downstream causal edge into the preserved-function node, which asserted that epitope loss causes Fc binding to be retained, keeping the node unrooted per the Calvarial_Doughnut precedent and folding the reasoning into its description with mechanism_confidence ESTABLISHED; graded the wild-type CD16-CD2 association evidence PARTIAL since it documents the normal association on a node asserting its failure; added VZV and BCG to the infection spectrum; added pathophysiology-to-phenotypes edges; recorded the three numbering conventions for the one substitution in notes; added a research/ literature-sweep record documenting the searches and what they changed.

    Validation after changes: just validate-disorders passed; 31/31 snippets verified; terms validated; all ungated gates pass.

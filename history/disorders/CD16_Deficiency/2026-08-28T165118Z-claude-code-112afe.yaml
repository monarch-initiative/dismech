  summary: 'Create: CD16 Deficiency'
  details: |
    De novo curation of MONDO:0014313 [immunodeficiency 20 / CD16 deficiency] from two primary papers: PMID:8608639 [Jawahar 1996, index patient] and PMID:23006327 [Grier 2012, second patient plus NK-92 reconstitution mechanism].

    Entry-type decision was DISEASE. MONDO parents are only the broad "inborn error of immunity" and "hereditary disease", and nothing in kb/ covered the concept - FCGR3A appears elsewhere in the KB only as a polymorphic Fc receptor in Kawasaki disease and neuropsychiatric SLE, which is a different claim about a different allele.

    Modelling decisions. The dissociated defect is modelled as separate pathophysiology nodes for spontaneous cytotoxicity [failing] and ADCC [preserved], including an explicit preserved-function node, because collapsing them into a single "NK dysfunction" step would erase the finding the disease exists to demonstrate. The NK-92 reconstitution is recorded as an experimental_models entry with modeled_mechanisms: RECAPITULATES for the CD16-CD2 association node, and PARTIALLY_RECAPITULATES for the cytotoxicity node because the source demonstrates the reconstitution arm against the melanoma target rather than a matched L66H cytotoxicity comparison.

    Two discussion entries record open questions: a CONTROVERSY that the two reported patients disagree on whether NK cytopenia is a feature of the disease, and a KNOWLEDGE_GAP between the measured in vitro cytotoxicity deficit and the severity of in vivo viral susceptibility.

    No treatments section was curated: no disease-directed therapy has been reported, and a generic supportive-care entry would carry no citable evidence behind it.


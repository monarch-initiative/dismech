  details: |
    Review round 2 on PR #9887. Both round-1 blocking findings confirmed resolved by the reviewer; four smaller items raised, three of them consequences of my own round-1 revision.

    Item 1, the subset-restriction claim became unevidenced when I dropped HP:0031410 in round 1. The Reduced CD2 Surface Expression node carried the subset claim alone with only the abstract sentence behind it, which says nothing about subsets. Now evidenced from the cached full text. Worth recording: the snippet is line-wrapped in the cached PDF between NK cells and was, and it verifies anyway, so the reference validator normalises whitespace. In round 1 I declined a different full-text snippet believing line wrapping would break it. That belief was wrong and the decision should not be repeated.

    Item 2, diagnosis contradicted genetic. FCGR3A sequencing still said confirmation rests on demonstrating the homozygous substitution while the genetic block had moved to DISPUTED and UNCERTAIN_SIGNIFICANCE. Rewritten so sequencing is necessary but not sufficient, with the Izadi NGS filtering pitfall cited: a standard rare-variant pipeline may discard the allele as too common to report.

    Item 3, the paired-clone flow signature was presented as diagnostic when the PR own new source says loss of the B73.1 epitope can occur independently of L66H and must be confirmed by sequencing. Reframed as a screening signal, with that qualification cited as PARTIAL.

    Item 4 is a regression I introduced and nobody asked for. Rewriting the discussions block wholesale in round 1 deleted the cytotoxicity_to_viral_susceptibility_gap KNOWLEDGE_GAP. Restored, and widened with the round-1 papers: de Vries had a severe viral course after BCG, EBV and VZV with normal cytotoxicity, and the Izadi homozygote has normal cytotoxicity and no disease, so the gap is larger than originally written.

    Non-blocking items also done: refreshed the stale NK-count phenotype description to reflect all four homozygotes; added the second pathophysiology-to-phenotype edge; added the 346-child cohort frequency alongside gnomAD, graded PARTIAL because it qualifies rather than simply supports the population argument; set mechanism_confidence PROVISIONAL on the infection node.

    One process note: merging the two evidence blocks in the FCGR3A sequencing diagnosis entry produced a duplicate evidence key, caught by check-duplicate-keys. Fixed by merging the lists rather than deleting a block, per CLAUDE.md.

    Validation: just validate-disorders passed; 35/35 snippets verified; terms validated; duplicate-key, entity-ref and all baseline gates pass.

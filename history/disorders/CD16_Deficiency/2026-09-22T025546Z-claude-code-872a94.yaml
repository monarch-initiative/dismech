  summary: Record non-assignment reasoning for GENETICS_ENVIRONMENT_DISEASE (#11879
    item 4)
  details: |
    Item 4 of #11879 asked to either add GENETICS_ENVIRONMENT_DISEASE to CD16 Deficiency to match STAT2 Deficiency's tag, or record why it should differ. Checked this entry's own genetic block: relationship_type is DISPUTED (not CAUSATIVE) — two of four published FCGR3A L66H homozygotes lack the cytotoxicity defect, the allele is far too common in gnomAD for a fully penetrant recessive immunodeficiency, and the most recent cited report concludes L66H is unlikely to be a direct genetic cause. This is a real difference from STAT2 and Immunodeficiency 65 (IRF9 Deficiency), both of which are relationship_type CAUSATIVE. Rather than mechanically copying the tag, extended the IMMUNE_RHEUMATOLOGIC classification's notes to record the non-assignment decision and its reasoning, so it is not re-derived from scratch. No classification_value added; only notes text changed. Validated with just validate-disorders.

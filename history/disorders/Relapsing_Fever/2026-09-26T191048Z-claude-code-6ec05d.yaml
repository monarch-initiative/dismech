  details: |
    Round-1 ai4c-reviewer content-under-consumption fixes. (2) Swapped the defining phenotype from Fever+temporality:RECURRENT to the pre-composed HP:0001954 Recurrent fever. (3) Split the bundled 'Severe Systemic Relapsing Fever' node into burden-driven severe progression and a distinct iatrogenic 'Antibiotic-Triggered Jarisch-Herxheimer Reaction' node (downstream of the antibiotic via treatment target_mechanisms ACTIVATES), carrying the PMID:1569394 cytokine evidence and the PMID:8663853 anti-TNF-alpha Fab RCT. (4) Regraded the three PMID:26327444 introductory framing sentences from MODEL_ORGANISM to HUMAN_CLINICAL + quote_role BACKGROUND. Added six phenotypes (Chills HP:0025143, Altered mental status HP:0004372, Arthralgia HP:0002829, Skin rash HP:0000988, Jarisch-Herxheimer reaction [free-text, no HP term], Premature birth HP:0001622 from the Tanzania pregnancy study PMID:9351408), all wired into the pathograph (11/11 connected). Added diagnosis: (blood-film microscopy + 16S rRNA PCR PMID:27188655, GlpQ serology PMID:32303256, NCIT:C16853). Added prevalence: (Senegal NMFI 15.5% POINT_PREVALENCE PMID:38272885; European imported LBRF CASES_IN_LITERATURE PMID:27340042). Added animal_models: inbred laboratory mouse B. hermsii (RECAPITULATES cytopenias PMID:19995898 and IgM/B1b clearance PMID:12646649) and Peromyscus reservoir (FAILS_TO_RECAPITULATE severe disease, PMID:27381345). Suggestions taken: therapeutic_modality SMALL_MOLECULE; swapped generic GO:0010468 for GO:0006310 DNA recombination on the Vmp node; quote_role REVIEW_SYNTHESIS on the two review citations (PMID:34412488, PMID:25914944). 40/40 snippets verified, model-scale strict clean, all gates green.

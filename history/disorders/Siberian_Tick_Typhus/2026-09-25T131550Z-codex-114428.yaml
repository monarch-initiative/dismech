  summary: 'Create: Siberian Tick Typhus'
  details: |
    Created a standalone Siberian Tick Typhus entry for MONDO:0001154 after an
    ignored-file-inclusive local search found the MONDO ID and major synonyms only
    in the Spotted_Fever_Rickettsiosis subtype row, generated Boomer/pages output,
    rare-disease mapping worklists, and existing rickettsial reference caches. The
    all-state PR search for "Siberian tick typhus" found only the merged spotted-fever
    root PR (#8899), and all-state GitHub issue searches for both `Siberian tick
    typhus` and `MONDO:0001154` returned no matches.

    PROMOTION. Promoted the North Asian/Siberian tick typhus subtype out of the
    deliberately thin Spotted_Fever_Rickettsiosis root while leaving that parent
    intact, and changed the subtype description there from "No standalone dismech
    entry yet" to `Curated in full in Siberian_Tick_Typhus.yaml`.

    DEEP RESEARCH. Seeded the entry with its MONDO term, Rickettsia sibirica subsp.
    sibirica infectious-agent binding, and a cached R. sibirica genome announcement
    (PMID:22493192), then ran `just research-disorder openscientist
    Siberian_Tick_Typhus`. The OpenScientist run completed normally and wrote
    `research/Siberian_Tick_Typhus-deep-research-openscientist.md`, its citation
    sidecar, and HTML/PDF artifacts. The report resolved all 18 references and marked
    8 as on-topic.

    NEC. `just preflight-dr
    research/Siberian_Tick_Typhus-deep-research-openscientist.md MONDO:0001154`
    returned SKIP because MONDO records no RO:0004003 causal gene for this acquired
    infection. Manual identity review found one real Named Entity Confusion hazard:
    the report broadened the agent from R. sibirica subsp. sibirica to the R. sibirica
    parent species and included sibling R. sibirica subsp. mongolitimonae /
    lymphangitis-associated rickettsiosis evidence. The final entry keeps only
    NCBITaxon:1144281 as infectious agent and does not curate the mongolitimonae/LAR
    leads.

    TERM REVIEW. The report's term validation resolved 28/29 suggested CURIEs and
    flagged one obsolete GO term, `GO:0030260`, which is replaced by `GO:0044409`.
    The curated entry did not use the obsolete term.

    CONTENT. Curated R. sibirica subsp. sibirica as the etiologic agent, Dermacentor
    tick transmission, North Asian/Siberian/eastern Chinese epidemiology, Dermacentor
    inoculation, early dermal macrophage/dendritic-cell infection, the conserved
    rickettsial endothelial vasculitis mechanism, the shared bacterial ribosomal
    doxycycline target, and the shared intracytosolic Rickettsia niche. Added four
    directly supported phenotypes from the CDC tick-borne rickettsial disease table
    and wired all four to causal parents: eschar, regional lymphadenopathy, fever, and
    maculopapular rash. Added eschar PCR, indirect immunofluorescence serology, and
    empiric doxycycline treatment targeting both the ribosomal translation node and
    the intracellular niche.

    VALIDATION. `just validate kb/disorders/Siberian_Tick_Typhus.yaml` passed with
    19 snippets checked, no skipped or unavailable snippets, and 21 titles checked.
    `just count-verified-snippets kb/disorders/Siberian_Tick_Typhus.yaml` reported
    19/19 snippets verified against cached references. `just list-disconnected-phenotypes
    kb/disorders/Siberian_Tick_Typhus.yaml` reported 4/4 phenotype nodes causally
    connected. `just validate kb/disorders/Spotted_Fever_Rickettsiosis.yaml` passed
    after the parent row pointer edit.

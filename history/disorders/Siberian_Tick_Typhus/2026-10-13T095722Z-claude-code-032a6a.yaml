  summary: Bind the spotted fever group Rickettsia antibody test as a LOINC measurement
  details: |
    Added measurements: LOINC:22474-1 (Rickettsia spotted fever group Ab [Presence] in Serum) to the Indirect immunofluorescence assay serology row. The row's own description states explicitly that genus-level cross-reactivity prevents species assignment, so the group-level code matches the test's actual identity rather than an R. sibirica-specific code (none exists in the Monarch KG; checked by search). Same code reused from Flea_Borne_Spotted_Fever and Far_Eastern_Spotted_Fever in batch 9, for the same reason. Label verified against the Monarch KG via scripts/seed_loinc_cache.sh and cached in cache/loinc/terms.csv. Part of dismech tranche-B batch10 (LOINC_DIAGNOSTICS.md tranche B).

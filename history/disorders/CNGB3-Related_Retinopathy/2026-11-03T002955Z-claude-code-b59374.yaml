  summary: 'Create: CNGB3-Related Retinopathy'
  details: |
    New gene-level entry for CNGB3-related retinopathy (MONDO:0100446), modelled on the GNAT2- and PDE6C-related retinopathy siblings. Pathograph: CNGB3 cone CNG channel beta-subunit deficiency, then loss of functional cone CNG channels (with CNGA3 down-regulation in the Cngb3 knockout mouse), branching to failure of the cone light response (congenital cone dysfunction and its phenotypes) and to ER stress-associated cone apoptosis, then slow cone degeneration (macular atrophy, cone dystrophy). Nodes conform to phototransduction_cascade_dysfunction; the photoreceptor_degeneration module was not used because it models rod-first degeneration. Subtypes: ACHM3 (MONDO:0009875) and an unbound progressive cone dystrophy subtype; phenotypes specific to one subtype are scoped to it. Genetics carries the ClinGen Retina GCEP Definitive (AR) assertion copied from its CGGV record, two cohort case fractions and four variant records.

    Deep research: requested falcon, which had no API key in this environment; the run used --fallback and the report was produced by openscientist (research/CNGB3-Related_Retinopathy-deep-research-openscientist.md). Its reference validation showed 31/31 references resolved and 17/17 quotes valid; term validation reported two harmless label paraphrases; preflight-dr passed with CNGB3 the dominant gene. The report contributed the ER-stress/RyR2 degeneration branch, the founder-effect paper for c.1148delC and the CNGB3 longitudinal foveal-structure study; the other references came from PubMed searches. The GeneReviews Achromatopsia chapter (PMID:20301591) is tagged as the phenotype baseline.

    A fresh-context self-review led to corrections before the PR: subtype scoping, the cone-dystrophy genotype (truncating alleles as well as Arg403Gln), the oocyte gain-of-function statement for macular-degeneration alleles, rod responses described as normal or mildly reduced, mouse-only findings marked as such, specific NCIT diagnosis terms, and CELL_THERAPY for the CNTF implant. No therapeutic_agent is bound for the CNTF implant because the cited abstract does not name the product. NCT02599922 status could not be re-audited because ClinicalTrials.gov was unreachable from the session.

    Validation: just validate (schema, terms, references) passed; count-verified-snippets 75/75; check-genereviews TAGGED; entity-ref, causal-target, logical-rule, block-scalar, enum, snippet-length, title-snippet and snippet-grading gates passed.

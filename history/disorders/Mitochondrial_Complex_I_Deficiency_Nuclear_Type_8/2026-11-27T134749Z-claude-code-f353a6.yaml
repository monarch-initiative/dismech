  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 8 (NDUFS3)'
  details: |
    New entry for MONDO:0032613, the recessive complex I deficiency caused by biallelic NDUFS3 variants, created from its stub (stub deleted). NDUFS3 is modelled as a non-catalytic core subunit (GO:0005198 structural molecule activity, DECREASED) that seeds Q-module assembly (PMID:33882309, PMID:17209039), leading to reduced complex I assembly (GO:0032981) and NADH:ubiquinone oxidoreductase activity (GO:0008137, GO:0006120), a glycolytic shift seen in neuronal Ndufs3 knockout mouse brain (PMID:33148885), Leigh-type basal ganglia and brainstem injury, and a muscle myopathy (one patient, PMID:36531773; muscle knockout mouse, PMID:31916679). Phenotypes come from the six reported families: PMID:14729820, PMID:22499348, PMID:30140060, PMID:33097395 (whose Table 1 summarises the earlier cases) and PMID:36531773; earlier-patient findings are quoted from the 2020 and 2021 summaries because the 2004 and 2012 papers are cached as abstracts only. relationship_type is UNKNOWN because ClinGen rates NDUFS3 Moderate for Leigh syndrome and for mitochondrial disease, both lumped MONDO terms, so no tier was copied. Not curated as disease evidence: a single heterozygous P223L (PMID:19167255) and a 2026 homozygous A241T variant of uncertain significance with retinal and hearing findings (PMID:42232357). GeneReviews has only the Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview (PMID:26425749), tagged; it holds no clinical content. Preclinical AAV gene replacement (PMID:31916679, PMID:39169163) and metformin (PMID:33148885) are recorded as mouse-only treatments. Validated: linkml-validate, term validation, reference validation (66/66 snippets, 0 issues), entity-ref, causal-target, name-collision, gene-validity, enum, duplicate-key, coarse-phenotype, folded-hyphen and gene-term checks.

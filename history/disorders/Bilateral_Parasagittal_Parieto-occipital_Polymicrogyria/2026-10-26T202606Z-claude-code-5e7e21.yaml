  summary: 'Create: Bilateral Parasagittal Parieto-occipital Polymicrogyria (FIG4)'
  details: |
    Created the FIG4-related bilateral parasagittal parieto-occipital polymicrogyria entry (MONDO:0012986), entry_type DISEASE. Curated a causal chain FIG4 loss of function -> PI(3,5)P2 deficiency -> endolysosomal vacuolization -> impaired cerebral cortical development -> polymicrogyria, plus phenotypes (polymicrogyria, epilepsy, psychiatric manifestations) and autosomal recessive inheritance with the homozygous p.Asp783Val variant. Evidence grounded in the defining paper PMID:24598713 (Baulac et al., Neurology 2014) plus FIG4/PI(3,5)P2 complex mechanism from PMID:26604144 and PMID:27292112. Deep research: falcon (Edison) was unavailable (403 auth failure) so the required run used the claude_code provider; preflight-dr PASSed (FIG4=23 mentions, OMIM 612691 match, no Named Entity Confusion). Kept distinct from the other FIG4 entities (CMT4J, Yunis-Varon, ALS11) per the granularity rules. Validated with just validate, just validate-disorders (13/13 snippets verified), count-verified-snippets, and the offline gates (entity-refs, causal-targets, coarse-phenotypes, enum, duplicate-keys, qualifier-terms, snippet-grading).

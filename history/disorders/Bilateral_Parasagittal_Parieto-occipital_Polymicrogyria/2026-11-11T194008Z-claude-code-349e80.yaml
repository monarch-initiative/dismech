  details: |
    Addressed the round-1 review of PR #17068. Removed the fibroblast vacuole rescue assay from diagnosis: in PMID:24598713 it was a research experiment in Fig4-null mouse fibroblasts, not a clinical test, and the same snippet already supports the Endolysosomal Vacuolization node. On Impaired Cerebral Cortical Development, removed cerebellum and hippocampal formation (shown only in Fig4-null mice) and parietal lobe, and added temporal lobe, because the source describes the family's malformation as temporo-occipital. The top-level description now attributes hippocampal and cerebellar impairment to the mouse. The exome-sequencing result now says homozygous (one family, p.Asp783Val) instead of homozygous or compound heterozygous. On Endolysosomal Vacuolization, removed the unsupported claim that patient fibroblasts were examined and removed the unevidenced neuron cell type. Gave the Epilepsy and Psychiatric manifestations edges the paper's CONCLUSIONS sentence as INDIRECT evidence and removed the hippocampal wording from their descriptions. Removed the duplicate GO:0046854 binding from the FIG4 Loss of Function node; it remains on PI(3,5)P2 Deficiency.

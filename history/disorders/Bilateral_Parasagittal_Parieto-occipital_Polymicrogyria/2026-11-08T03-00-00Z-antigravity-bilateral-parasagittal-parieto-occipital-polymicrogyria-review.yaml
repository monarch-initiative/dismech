  summary: Added top-level description, classifications, diagnostic assays, and enriched pathophysiology ontology groundings and causal edges for Bilateral Parasagittal Parieto-occipital Polymicrogyria.
  details: Added a comprehensive top-level disorder description and Harrison's chapter classifications (NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE) with verbatim evidence from PMID:24598713. Enriched FIG4 and PI(3,5)P2 pathophysiology nodes with GO biological processes, endolysosomal cellular components, neuronal and fibroblast cell types, UBERON brain region locations, and downstream causal edges to epilepsy and psychiatric manifestations. Added diagnostic flags to core phenotypes and curated diagnostic entries for whole-exome sequencing and fibroblast vacuole rescue microscopy.

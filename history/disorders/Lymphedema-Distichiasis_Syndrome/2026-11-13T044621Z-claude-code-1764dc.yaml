  summary: 'Create: Lymphedema-Distichiasis Syndrome'
  details: |
    New entry for lymphedema-distichiasis syndrome (MONDO:0007922), expanded from the stub nominated by the genetics-gap scan. Phenotype baseline: GeneReviews NBK1457 (PMID:20301630), tagged in references; every feature in its Clinical Characteristics abstract is represented. Frequencies come from the 74-patient cohort (PMID:12114478): distichiasis 94%, varicose veins 49%, ptosis 31%, congenital heart disease 6.8%, cleft palate 4%. Venous valve failure from duplex study PMID:17372167. Pathograph: FOXC2 haploinsufficiency leads to defective lymphatic valve formation and maintenance, abnormal mural cell coverage of lymphatic capillaries, venous valve failure and meibomian gland lash metaplasia; lymphatic reflux and dependent drainage failure lead to lower-limb and genital lymphedema, fetal hydrops, nuchal translucency and pulmonary lymphangiectasia. Mouse evidence (Foxc2 heterozygous, null and inducible lymphatic deletion) is graded MODEL_ORGANISM; edges from FOXC2 to heart, palate, renal and spinal features are marked INDIRECT_UNKNOWN_INTERMEDIATES. Gene-disease validity copied from ClinGen CGGV assertion 757840b2 (Definitive, AD, Prenatal GCEP). LAMA5 recorded as a candidate MODIFIER from a single exome study (PMID:29908552). One openscientist deep-research report was used as leads: 33/33 references resolved, 13/13 quotes valid, 1 off-topic reference (PMID:42886966, lipedema, not used); term validation flagged HP:0010729 labelled as Distichiasis (it is Cherry red spot of the macula), not used; preflight-dr PASS (FOXC2 mentioned 73 times). From the report, PMIDs 39653349, 29908552, 20535019, 24278289, 29459084 and 27313318 were fetched and cited. Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), check-causal-targets, check-entity-refs, check-enum-values, check-duplicate-keys, check-coarse-phenotypes (HP:0001627 with SOURCE_UNSPECIFIED), check-qualifier-terms, check-genereviews, list-gene-validity, and validate-disorders all passed. Ptosis has no causal in-link because no source proposes a mechanism.

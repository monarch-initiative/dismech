  summary: Bind newborn-screening LOINC measurements and cut-offs
  details: |
    Added a newborn-screening diagnosis row (NCIT:C81178) alongside the three pre-existing confirmatory and surveillance rows, binding LOINC:79321-6 Lysophosphatidylcholine(26:0) [Moles/volume] in DBS, the method-less molar code; the LC-MS/MS and mass-concentration variants are not bound. One reference range from the Illinois programme (PMID:35076462) with three bands: below 0.18 umol/L negative, 0.18 to below 0.28 borderline, 0.28 and above positive, both abnormal tiers flagged HIGH; the programme's inclusive lower bounds match the half-open convention exactly. The Minnesota 5-year report's observation that confirmed cases had values over 0.3 umol/L (PMID:39803877) is quoted as evidence, not a band. Bound LOINC:43677-4 Fatty acid very long chain (C22-C26) panel - Serum or Plasma on the Very-long-chain fatty acids marker, which describes plasma. The existing Plasma very-long-chain fatty acid measurement row carries no measurements because it is outside this tranche's newborn-screening scope; it binds NCIT:C124351 Clinical Evaluation, which a later pass may want to revisit. Validated with the per-file gates, validate-disorders and the KB-wide snippet-grading gate.

  summary: 'Gene-family review: ABCD1'
  details: |
    The ABCD1 record is typed CAUSATIVE with germline origin and carries ClinGen's Definitive classification for adrenoleukodystrophy (MONDO:0018544, this entry's disease term; CGGV:assertion_815e0f84-b530-4fd2-81a9-02e02bf352ee-2020-12-18T050000.000Z). The inheritance block was bound to X-linked recessive inheritance (HP:0001419) with no evidence; it is now X-linked inheritance (HP:0001417), with PMID:32101828 for the X-linked transmission and PMID:30732635 for the observation that over 80% of heterozygous women develop spinal cord disease in adulthood, which is why the pattern is not strictly recessive. ClinGen also records the mode of inheritance as XL. The ABCD1 node already bound ABC-type fatty-acyl-CoA transporter activity (GO:0015607, DECREASED), the very-long-chain acyl-CoA import into peroxisomes that ALDP performs.

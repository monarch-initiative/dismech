  summary: 'Integrate assessed OpenScientist findings: ELOVL1 dual accumulation, saturated-VLCFA
    toxicity, immune arms, adrenal and animal-model gaps'
  details: |
    Assessed the OpenScientist hypothesis-search report for canonical_abcd1_vlcfa_demyelination_adrenal_model (kb/hypotheses/adrenoleukodystrophy/canonical_abcd1_vlcfa_demyelination_adrenal_model/openscientist.md) and wrote assessments/openscientist-assessment-by-claude-opus-5.yaml with verdict PARTIALLY_SUPPORTED across 19 claims, a data_sources block (ClinVar/ClinGen/GenCC CITED_NOT_ACCESSED, PubMed UNVERIFIABLE) and two REPORTED_ONLY/UNVERIFIABLE analyses. Sixteen cited PMIDs were fetched and checked against the reference cache before use; every new snippet was re-derived from references_cache rather than copied from the report.

    Integrated only RETAINED/QUALIFIED claims the entry lacked. pathophysiology: added cryo-EM substrate-recognition (PMID:36810450) and missense proteasomal-degradation (PMID:21039332) evidence to the ABCD1 transport-defect node; added ELOVL1 chain-elongation (PMID:22483867) and saturated-versus-monounsaturated ER-stress specificity (PMID:33690217) evidence to the VLCFA accumulation node and rewrote its description to carry both refinements; added CD36/JNK macrophage priming (PMID:36528616) and 25-hydroxycholesterol/NLRP3 (PMID:27779191) evidence to the microglial and macrophage node; added CD8 cytotoxic T-cell cytolysis of oligodendrocytes (PMID:11589421) evidence plus a CL:0000794 cell type to the inflammatory cerebral demyelination node. mechanistic_hypotheses: added PMID:25999754 and PMID:34716609 evidence substantiating the no-genotype-phenotype-correlation and no-spontaneous-animal-model qualifications that the notes previously asserted uncited; status left CANONICAL as the report itself recommends. biochemical: added PMID:41862589 pre-treatment NfL stratification evidence to the existing NfL readout and recorded the 14-patient cohort caveat in context. discussions: added four new records, ald_cerebral_conversion_trigger (KNOWLEDGE_GAP), ald_no_spontaneous_cerebral_animal_model (HUMAN_MODEL_MISMATCH), ald_adrenal_pathogenesis_mechanism (KNOWLEDGE_GAP) and ald_ferroptosis_emerging (EMERGING_HYPOTHESIS), each with a proposed experiment and cache-verified evidence.

    Deliberately not integrated: the report's quotation attributed to PMID:41862589 about NfL surpassing Loes scoring, which does not appear in that paper (assessment claim nfl-outperforms-loes-quotation, REJECTED); the unrestricted evidence-matrix claim that VLCFA does not correlate with phenotype, since PMID:15800013 reports the opposite for normal-appearing white matter; the 35 to 40 percent cerebral conversion figure, which conflicts with the Danish national cohort and with PMID:39467011; the lysosomal-cholesterol adrenal mechanism as a pathograph node, kept as a discussion lead because it rests on one mouse and knockdown study; and ferroptosis as a node, kept as an emerging-hypothesis discussion pending replication. No variant-level content was taken from the report, which did not query ClinVar, ClinGen or GenCC.

  summary: Upgrade Focal Dermal Hypoplasia with classifications, prevalence, progression, somatic mosaicism
    inheritance, PORCN molecular function grounding, diagnosis, and differential diagnoses
  details: 'Upgraded kb/disorders/Focal_Dermal_Hypoplasia.yaml (issue #3018):

    - Added classifications (harrisons_chapter: DERMATOLOGY, GENETICS_ENVIRONMENT_DISEASE), prevalence
    (CASES_IN_LITERATURE, ULTRA_RARE, ~300 cases in literature with ~90% females and ~10% mosaic males,
    PMID:37859990 and PMID:20301712), and two-stage progression (congenital Blaschko-linear dermal aplasia/fat
    herniation and limb/ocular malformations; postnatal childhood/adult development of mucocutaneous verrucous
    papillomas, PMID:20301712).

    - Added top-level inheritance covering both X-linked dominant inheritance (HP:0001423) and postzygotic
    somatic mosaicism (HP:0001442, Typified by somatic mosaicism) backed by PMID:20301712 and PMID:19586929,
    and annotated variant_origin: GERMLINE_AND_SOMATIC on the PORCN genetic entry.

    - Grounded the root pathophysiology node ("PORCN Loss Impairs WNT Palmitoleoylation and Secretion")
    with PORCN (hgnc:17652) and molecular_functions palmitoleoyltransferase activity (GO:1990698, DECREASED).

    - Added diagnosis (PORCN Molecular Genetic Testing NCIT:C19770, Dermatologic Examination NCIT:C168436,
    Skeletal Radiography NCIT:C38092, Ophthalmologic Examination NCIT:C38060) and differential_diagnoses
    (Incontinentia pigmenti MONDO:0010631, Rothmund-Thomson syndrome MONDO:0010002).

    '

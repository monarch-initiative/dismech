  summary: 'Create: LETM1-Related_Childhood-Onset_Neurodegeneration'
  details: |
    Created the entry for bi-allelic LETM1 disease (MONDO:0859304), the recessive mitochondrial disorder distinct from Wolf-Hirschhorn syndrome.

    DEEP RESEARCH PROVIDER: Falcon (Edison Scientific) ran and SUCCEEDED (636s, 26 citations, 1 artifact). 'just preflight-dr' was run manually against MONDO:0859304 and PASSED, with LETM1 mentioned 72 times and no competing gene. The report is committed at research/LETM1-Related_Childhood-Onset_Neurodegeneration-deep-research-falcon.md.

    FALCON PMID GAP: consistent with the known pattern for this provider in this repo, the report contained ZERO PMIDs - its citations are DOIs and author-year keys, and only 8 references were extractable for validation against 26 claimed citations. The report was therefore used strictly as leads. Every PMID cited in the entry was independently located via the PubMed E-utilities API and fetched with 'just fetch-reference'; no snippet was taken from the report. Four report DOIs were resolved to PMIDs via the PMC ID converter and proved genuinely additive over my own PubMed searches: PMID:32139798 (LETM1 organizes cristae via proteoliposome reconstitution), PMID:29123128 (PINK1 phosphorylates LETM1 at Thr192 to regulate mitochondrial Ca2+ and protect neurons), and PMID:30012579 (LETM1 associates with mitochondrial ribosomes and regulates pyruvate dehydrogenase - a third candidate core function). The report's term validation flagged HP:0001244 as nonexistent in HPO; it was not bound. Its two 'mislabelled' flags (HP:0100022, HP:0000518) were markdown-parsing artifacts, and HP:0000518 Cataract was verified correct with OAK before use.

    CONTENT: 15 PMIDs, 58 evidence items all with snippets verified against the local cache. Pathograph is a connected 8-node chain from biallelic LETM1 loss of function through defective mitochondrial K+/H+ exchange, matrix swelling with cristae disorganization, membrane potential depolarization, respiratory chain complex deficiency, and cellular energy failure, to progressive neurodegeneration and multisystem involvement, which fans out to 10 phenotype nodes. Eleven clinical phenotypes with cohort frequencies mapped to FrequencyEnum from the reported percentages (respiratory chain deficiency 100% OBLIGATE through diabetes 27% OCCASIONAL). Biochemical: lactate, 3-methylglutaconic aciduria, alanine. Muscle histopathology as COX-negative and ragged-red fiber phenotypes.

    CONTESTED MECHANISM: the K+/H+ versus Ca2+/H+ transport question was represented as contested rather than resolved, per the curation brief. Two mechanistic_hypotheses groups were created - letm1_k_h_exchange (CANONICAL, evidenced by PMID:15904662 yeast loss-and-rescue) and letm1_ca_h_exchange (ALTERNATIVE, PMID:19797662 SUPPORT for the antiporter claim and PMID:36321428 REFUTE for the TMBIM5 result showing LETM1 is not the Ca2+/H+ exchanger). A CONTROVERSY discussion attaches to both nodes and both hypothesis groups and also records the third candidate core function and the 2024 review (PMID:39481506) stating the core function remains elusive. The pathograph spine deliberately runs through the K+/H+ arm because that is the activity assayed in patient-derived material; the Ca2+ node is marked HYPOTHETICAL with no patient-level evidence. A separate KNOWLEDGE_GAP discussion records the absent genotype-phenotype correlation, absent natural history, and absent disease-modifying therapy.

    NAMED ENTITY CONFUSION CONTROL: kb/disorders/Wolf-Hirschhorn_Syndrome.yaml was read before curation. No phenotype, prevalence, or evidence content was imported from it. The distinction (de novo monoallelic 4p16.3 contiguous-gene deletion versus bi-allelic LETM1 variants) is recorded in the entry notes. Older LETM1 functional literature framed around WHS seizure candidacy is cited only for LETM1 protein function; the three animal models carry explicit limitations stating they were built as WHS haploinsufficiency models, and the mouse model additionally notes that the genotype matching human patients is embryonic lethal in mouse.

    MODEL VERSUS HUMAN EVIDENCE: all yeast, fly, worm, rat and mouse evidence is graded MODEL_ORGANISM or IN_VITRO. No human phenotype is supported by model evidence alone - all eleven clinical phenotypes cite the human cohort PMID:36055214.

    LUMP/SPLIT: curated as its own DISEASE entry. MONDO parent is the broad MONDO:0024237, so no numbered-series parent exists. The 11 families share one reasonably conserved pathograph (universal respiratory chain deficiency; the same osmoregulatory lesion shown in fibroblasts, muscle and yeast complementation); heterogeneity is in tempo of progression, recorded in progression rather than split into has_subtypes.

    MODULE CONFORMANCE: one node conforms to mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress, following the precedent set by Combined_Oxidative_Phosphorylation_Deficiency_42. The conformance note records that the module's age-related upstream node does not apply to a childhood-onset nuclear-gene defect and that the module's ROS arm was not measured in this cohort, so conformance is declared at that single node.

    VALIDATION: just validate-disorders PASSED (authoritative, run to completion). just validate, validate-terms, count-verified-snippets (58/58), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-stubs, check-title-snippets, check-folded-hyphens, check-snippet-length, check-snippet-grading and check-environmental-evidence all pass. Three self-inflicted defects were caught by the gates and fixed: a paper title used as an evidence snippet in the classifications block, two folded-scalar hyphen splits, and a variant snippet that misquoted the family identifier (F1 rather than F1:S2). No qualifier terms were added, so check-qualifier-terms-online was not required. references_cache/PMID_36055214.md was upgraded from abstract-only to full text by fetch-reference; the change is purely additive and Wolf-Hirschhorn_Syndrome, which cites the same paper, was re-checked and still verifies 169/169. The stub was deleted.

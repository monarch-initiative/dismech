  summary: 'Address review feedback on PR #10445'
  details: |
    Revision responding to the ai4c-reviewer CHANGES_REQUESTED review on PR #10445, which raised three blocking items.

    reference_title was absent from every evidence item. Added it to all 69 evidence items, derived mechanically from the title: key in each references_cache/PMID_<id>.md YAML frontmatter rather than typed from memory, covering 15 distinct PMIDs. The two entries in the top-level references: block already carried title: and were left untouched. just check-reference-titles reports no new mismatches.

    Phenotypes above the >10% frequency threshold were missing. Added nine, all with exact-substring snippets from references_cache/PMID_36055214.md: Nystagmus (HP:0000639, 7/13 54%), Hyperkinetic Movement Disorders (HP:0002487, 4/12 33%), Spastic-Ataxic Gait (HP:0002497, 3/9 33%), Hyperreflexia (HP:0001347, brisk deep tendon reflexes 4/10 40%), Extensor Plantar Response (HP:0003487, upgoing plantar 4/9 44%), Peripheral Neuropathy (HP:0009830, 3/9 33%), plus Failure to Thrive (HP:0001508), Feeding Difficulties (HP:0011968) and Respiratory Distress (HP:0002098) from the presenting-symptom sentence with frequency deliberately omitted and the missing-denominator reason recorded on each. All six frequency-bearing additions are FREQUENT (30-79% band).

    Departed from the reviewer's suggested CURIE in one place. For hyperkinetic movement disorders the review proposed HP:0100022 Abnormality of movement; bound HP:0002487 Hyperkinetic movements instead, which is its direct is_a child, carries Hyperkinesia/Hyperkinesis as exact synonyms, and matches the claim without the loss of specificity. HP:0000639 Nystagmus was used as suggested.

    GO:0006884 was a cell-scope term on an organelle-scope claim. Dropped the binding from the Mitochondrial Matrix Swelling and Cristae Disorganization node. GO:0006884 is defined over the three-dimensional space occupied by a cell, is_a GO:0008361 regulation of cell size, and carries RO:0019000 some OBA:0000056 cell volume, while the claim is about mitochondrial matrix volume. Searched GO for mitochondrial volume, mitochondrion volume, organelle volume and mitochondrial swelling, all returning nothing, so preferred_term was kept unbound as mitochondrial matrix volume homeostasis with the NTR rationale in the descriptor description. GO:0007005 and GO:0042407 on the same node still carry the mechanism.

    Also took three of the reviewer's non-blocking suggestions: quoted the quantified progression tempo figures (rapid 9/18 50%, moderate 4/18 22%, slow 5/18 28%) into the Progressive course phase; added a Mortality progression phase recording that 9/18 died between 2 months and 8 years, with the caveat that this is one ascertained cohort and not a population survival estimate; and added CL:0000169 type B pancreatic cell to the Cellular Energy Failure node's cell_types, which the node description already named.

    Recorded deliberate omissions in the top-level notes rather than leaving them silent: why there is no diagnosis: section (no LETM1-specific assay, criteria set or published testing algorithm; the cohort was assembled genotype-first), why the ataxia phenotype stays on HP:0001251 Ataxia with clinical_course: PROGRESSIVE rather than moving to the reviewer-suggested HP:0002073 Progressive cerebellar ataxia (HP:0001251 carries Cerebellar ataxia as an exact synonym, and the cited 78% sentence establishes the ataxia but not its tempo, so the separable qualifier keeps the two claims distinct), and why frequency is omitted on the five phenotypes that lack a usable denominator.

    Validation: just validate passed; just validate-terms passed; just count-verified-snippets 69/69 verified, up from 58/58; check-duplicate-keys, check-entity-refs, check-causal-targets (no new broken targets), check-enum-values, check-title-snippets, check-snippet-length and check-snippet-grading all OK; just validate-disorders passed with 69/69 snippets. No cache/**/*.csv churn, since every HP and CL term bound was already cached.

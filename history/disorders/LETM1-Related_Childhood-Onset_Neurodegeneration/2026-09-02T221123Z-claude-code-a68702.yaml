  summary: 'Address round-5 review on PR #10445'
  details: |
    Round-5 review fixes. Blocking items: (1) added Muscular Wasting (HP:0003202 Skeletal muscle atrophy, FREQUENT) for the Table 2 row at 7/10 (70%), curated distinctly from the existing Myopathy entry at 50% because the source tabulates them as separate rows with different denominators; (2) added Impaired Speech Acquisition (HP:0000750 Delayed speech and language development, FREQUENT) for 6/9 (67%); (3) split the PMID:17606466 evidence item on Mitochondrial Matrix Swelling and Cristae Disorganization, whose single snippet spanned human cells and C. elegans under one IN_VITRO grading, into an IN_VITRO item quoting the mammalian-cell overexpression result and a MODEL_ORGANISM item quoting the C. elegans clause. Both reviewer-supplied quotes were re-verified as exact substrings of references_cache/PMID_36055214.md before use. Non-blocking items taken: added High Palate (HP:0000218) and Teeth Abnormalities (HP:0000164) so all four components of the quoted dysmorphism sentence are curated; promoted Loss of Ambulation (HP:0002505) out of the Developmental Regression description into its own phenotype; gave Hypotonia its stated 11/18 (61%) frequency and an evidence item that actually states it; wired Loss of Ambulation, Pontine Hypoplasia, Spastic-Ataxic Gait and Impaired Speech Acquisition from Progressive Neurodegeneration and Multisystem Involvement, and Muscular Wasting from Cellular Energy Failure in High-Demand Tissues, so the previously orphaned neurologic phenotypes match their already-wired siblings; added the zebrafish letm1-/- knockout (Dao 2022, DOI:10.26508/lsa.202101194, newly fetched into references_cache) as an animal model with PARTIALLY_RECAPITULATES / LOW fidelity against the energy-failure node, with limitations recording that the readout is NAD/circadian rather than respiratory chain, that mutants split into compensating and non-compensating developers, and that the null is viable in fish but embryonic lethal in mouse. Deferred and recorded in notes: differential diagnosis (OPA1, ATAD3A, TARS2, SERAC1, DNAJC19, HTRA2, Barth/TAZ) as a follow-up rather than first-entry scope, and no C. elegans animal_models entry because the abstract-only cache gives no genotype or readout detail. Developmental-regression frequency remains omitted. Validation: just validate, validate-terms, count-verified-snippets, check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values and check-reference-titles all pass.

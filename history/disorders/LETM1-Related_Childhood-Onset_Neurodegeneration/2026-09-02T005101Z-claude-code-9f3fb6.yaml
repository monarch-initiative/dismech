  summary: 'Add dysmorphology phenotypes per review on PR #10445'
  details: |
    Second review pass on PR #10445 left one blocking item: the entry quoted a source describing 'neurological, metabolic, and dysmorphic symptoms' four times while curating no dysmorphic feature, and PMID:36055214 Table 2 carries a Facial dysmorphism row at 4/10 (40%), above the >10% curation threshold.

    Added seven phenotypes, all from PMID:36055214. Blocking set: Facial Dysmorphism (HP:0001999 Abnormal facial shape, FREQUENT, 4/10 = 40%), Microcephaly (HP:0000252, FREQUENT, occipitofrontal circumference below third percentile in 2/6 = 33%), Micrognathia (HP:0000347, no frequency), Low-Set Ears (HP:0000369, no frequency). Non-blocking set the reviewer also raised and the source supports: Pontine Hypoplasia (HP:0012110 Hypoplasia of the pons, no frequency), Ventriculomegaly (HP:0002119, no frequency), Pericardial Effusion (HP:0001698, OCCASIONAL, 3/11 = 27%).

    Frequency rule applied uniformly and recorded in notes: a band is set only where the source states the fraction itself. Facial dysmorphism, microcephaly and pericardial effusion carry one; the individual components of the dysmorphic pattern and the two extra neuroimaging findings are narrative counts inside the six-person MRI subset and do not. Developmental regression stays without a frequency, which the reviewer explicitly endorsed as the more rigorous call.

    The reviewer's transcription of the key discussion sentence was not an exact substring - the cached text carries U+00A0 non-breaking spaces at 'ascribed to\u00a0the LETM1 deletion' and '2/6 persons\u00a0(33%)'. Every snippet was re-derived by direct substring test against references_cache/PMID_36055214.md rather than copied from the review; the spans used avoid the non-breaking spaces.

    Updated the 'Not Wolf-Hirschhorn syndrome' notes reasoning so the new evidence sharpens the split instead of undercutting it. The source describes these bi-allelic patients as showing a milder spectrum of WHS signs newly ascribed to LETM1, which is exactly what a reader needs to weigh the split; the notes now record that overlap explicitly and give three reasons it does not merge the entries - the source attributes WHS microcephaly and facies to WHSC1 haploinsufficiency 'a region located far from LETM1' and treats the overlap as convergent; the overlap is partial and attenuated (4/10, 2/6) against the near-constant WHS gestalt; and the features dominating this pathograph are named by the same source as not typical of WHS and typical instead of archetypal mitochondrial disorders.

    Also flagged in the Pontine Hypoplasia description that the source is internally inconsistent about the pontine lesion - text and figure legend say hypoplasia, the Table 2 abbreviation key expands the same code as 'pontine atrophy'; HP:0012110 follows the narrative.

    Validation: just validate passed with snippets 79/79 verified (was 69/69). validate-terms passed. check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-title-snippets, check-snippet-length, check-snippet-grading, check-reference-titles all OK with no new findings. just validate-disorders passed all three batched lanes. No cache churn.

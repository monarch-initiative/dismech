  summary: Fold the duplicate MONDO:0859304 entry's Wolf-Hirschhorn differential into
    this entry
  details: |
    PR 11210 had added a second Disease entry (Neurodegeneration_Childhood-onset_With_Multisystem_Involvement_Due_To_Mitochondrial_Dysfunction) for MONDO:0859304, which this entry already covers (merged in PR 10445). Following the review's suggested remedy, the duplicate file was removed and the content this entry lacked was carried over. This entry had no differential_diagnoses section; it now has a Wolf-Hirschhorn syndrome row with the duplicate's two already-verified evidence items (PMID:23963300, monoallelic WHSC1/LETM1 loss is not sufficient for the full WHS phenotype; PMID:26747863, the WHS seizure phenotype maps to the terminal 751 kbp interval). These give citations for the separation from WHS that this entry's notes previously stated without one. Both PMIDs were added to references. Not carried over: the duplicate's PMID:41191133 review quotes on K+/H+ exchange, matrix swelling and cochlear/cerebellar neurons, because this entry already curates those mechanisms from primary studies; its PMID:26917594 statements of general mitochondrial-disease management (vitamin cofactors, avoiding aminoglycoside and tetracycline antibiotics), which are not specific to LETM1 and are left for a curator to decide on as a possible 'Avoidance of Mitochondrial Toxins' treatment; and the Leigh-syndrome differential row, whose only support was a count of known mitochondrial disease genes. The duplicate's three history records were moved here with target.superseded_by.

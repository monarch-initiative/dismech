  summary: 'Create: VPS13C-Related Parkinson Disease (PARK23)'
  details: |
    Created standalone per-gene entry VPS13C-Related Parkinson Disease (PARK23, MONDO:0014796), split from the Parkinsons_Disease basket. VPS13C is the ER-late endosome/lysosome lipid-transfer protein; its loss drives two complementary limbs. Mitochondrial limb: VPS13C loss of function (phospholipid transfer GO:0120014 decreased) -> mitochondrial dysfunction (fission GO:0000266) -> exacerbated PINK1/parkin mitophagy (GO:0000423). Endolysosomal limb: -> lysosomal lipid-homeostasis failure (phospholipid homeostasis GO:0055091, di-22:6-BMP accumulation) -> mtDNA-dependent cGAS-STING innate-immune activation (GO:0140896, PROVISIONAL, cell-model). Both converge on nigrostriatal dopaminergic neurodegeneration (conforms parkinsonism_dopaminergic_degeneration) -> striatal deficit -> parkinsonian motor syndrome; diffuse Lewy body pathology, genetic alpha-synucleinopathy. Phenotypes: parkinsonism, early cognitive decline. Variants: biallelic truncating + canonical splice-site. Evidence from PMID:26942284 (discovery + cell-model mitochondrial), PMID:30093493 (Kumar, lipid transport at ER contact sites), PMID:35657605 (Hancock-Cerutti, ER-lysosome/STING), PMID:34875562 (cohort + diffuse Lewy body), PMID:28862745 (exome replication). claude_code deep-research run came back answer_status: unsuccessful and was deleted (report + sidecar); its real PMID leads were fetched and every snippet verified exact against references_cache (34/34). No GeneReviews chapter exists (check-genereviews NO_CHAPTER). Validated with validate-disorders (34/34 snippets, terms pass) plus the offline gate list. Basket trimmed: PARK23 subtype row gained curated_in + pointer, VPS13C genetic row gained a pointer; nothing removed.

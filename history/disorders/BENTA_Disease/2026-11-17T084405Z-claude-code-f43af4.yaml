  summary: Regrade the PMID:23129749 T cell sentence to IN_VITRO and ground CARD11
  details: |
    Review round on PR #17385, addressing the one remaining reviewer finding plus a red CI check, in a single push.

    Reviewer finding (IMPORTANT, taken). The previous round regraded the E127G variant evidence item to IN_VITRO. That item's longer snippet contains the sentence 'these CARD11 mutants rendered patient T cells less responsive to AgR-induced activation', which is also quoted on its own on the Constitutive NF-kappaB Activation to T Cell Anergy edge, where it was still HUMAN_CLINICAL. One sentence of one reference therefore carried two grades in one file and check-snippet-grading failed on it. The reviewer is right that IN_VITRO is the correct grade: the finding is patient T cells stimulated through the antigen receptor in culture, so the evidence the sentence describes is an in vitro result even though the cells came from patients. The edge item is now IN_VITRO and its explanation says why. check-snippet-grading passes on this head.

    CI failure, not raised by the reviewer. check_gene_activity_grounding failed with one new finding: CARD11 wired into the pathograph with no molecular function on the node it lands on. That gate is in the CLAUDE.md pre-PR list and I had not run it before opening the PR. Bound molecular_functions on the Germline CARD11 Gain-of-Function Variant node: GO:0035591 signaling adaptor activity, modifier GAIN_OF_FUNCTION, preferred_term 'CARD11 scaffold activity nucleating the CBM signalosome'. The term was taken from CARD11's own GO annotations rather than written to fit the prose. QuickGO returns four molecular-function annotations for UniProtKB:Q9BXL7: GO:0035591 signaling adaptor activity, GO:0004385 guanylate kinase activity, GO:0050700 CARD domain binding and GO:0005515 protein binding. GO:0035591 is the one that describes what the disease lesion dysregulates, since the gain-of-function alleles act by making the scaffold assemble the CBM signalosome without an antigen receptor signal; the guanylate kinase activity of the MAGUK domain is not what the variants change. The label was verified in OLS.

    The cross-file snippet-grading finding the reviewer mentions, between Primary_Ciliary_Dyskinesia and Young_Syndrome, involves neither file in this PR and was left alone.

    This branch had also been advanced by the repository pr-shepherd on 2026-11-15 (commit bf17d5c36, its own history record 2026-11-15T174013Z-pr-shepherd-7291c4.yaml), which addressed the first review round while this session was idle, including the ClinGen CGGV assertion, the biallelic R331P form, the vaccine-response and memory B cell bindings, the tacrolimus evidence and the ABC-DLBCL grading. That work is untouched here.

    Re-verified on this head: just validate passes (73/73 snippets, 0 issues), check-snippet-grading reports no new divergences, check-gene-activity-grounding reports no newly ungrounded genes.

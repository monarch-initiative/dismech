  summary: 'Create: BENTA Disease (CARD11 gain of function)'
  details: |
    New entry for BENTA disease (MONDO:0014645), the CARD11 gain-of-function inborn error of immunity.

    Deep research: one openscientist run, research/BENTA_Disease-deep-research-openscientist.md (job 7be8ba4f, 18 citations). Its reference_validation reports 18/18 resolved, confabulation_rate 0.0, with needs_review set because one reference (PMID:37126937, MALT1 in cancer) scored off topic; that reference is about a different disease and is not cited here.

    Its term_validation also set needs_review, with nine mislabelled CURIEs. Two are outright wrong drug codes: NCIT:C312, offered as Prednisolone, is Bleomycin Sulfate, and NCIT:C1133, offered as Tacrolimus, is ImuVert. Neither was bound. The codes used are NCIT:C769 Prednisolone and NCIT:C1311 Tacrolimus, both looked up in OLS. Every other CURIE in the entry was looked up the same way, including MGI:1916978 for mouse Card11, which was verified against the MGI marker page and then cached by just check-gene-namespaces-online.

    GeneReviews: none exists. PubMed searches of the GeneReviews book for the disease name and for CARD11 both returned zero, and just check-genereviews reports NO_CHAPTER on an entry that does carry synonyms, so the negative is meaningful. The phenotype baseline is the two 2025 systematic reviews (PMID:39998705, PMID:40157432).

    Scope: the entry covers only the gain-of-function pole of the CARD11 allelic series, and the notes say so explicitly, because the same gene causes a biallelic combined immunodeficiency and the dominant-negative atopy syndrome CADINS.

    Pathophysiology is a chain from the germline variant through self-aggregation into mCADS, antigen-independent CBM signalosome assembly, constitutive NF-kappaB, and then three branches: B cell expansion, the plasma cell differentiation block that explains the humoral immunodeficiency, and T cell anergy. Three edges resting on an author's stated speculation or on a general statement about immunocompromised hosts carry causal_link_type INDIRECT_UNKNOWN_INTERMEDIATES and directness INDIRECT.

    One evidence item is graded REFUTE: the observation that splenectomy worsened the lymphocytosis argues against splenectomy as a treatment, and that is recorded on an avoidance treatment entry rather than as support.

    Two KNOWLEDGE_GAP discussions record the unexplained B cell versus T cell asymmetry and the fact that no CBM-targeted agent has been given to a BENTA patient.

    Validation: just validate-disorders passes; 67/67 snippets verified; all per-file and whole-tree gates pass.

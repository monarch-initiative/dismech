  summary: 'Create: Polymyalgia Rheumatica'
  details: |
    Curated a new Disease entry for polymyalgia rheumatica (MONDO:0019735) from the stub queue, resolving entry_type as DISEASE rather than folding it into the already-curated Giant_Cell_Arteritis. The two are closely interlinked and are sometimes treated as a single GCA-PMR spectrum, but PMR occurs far more often in isolation, its lesion is peri-articular bursitis and synovitis rather than large-vessel vasculitis, and it carries none of the vision-loss risk of GCA. The three existing polymyalgia mentions in the GCA entry are correct and were left untouched; a comorbidity record is the likely right place for the overlap and was not attempted here. Six pathophysiology nodes run from age-associated inflammatory susceptibility, through bursal macrophage and synoviocyte activation and a feed-forward IL-6 amplification loop, to three parallel consequences: peri-articular bursitis, the systemic acute-phase response, and IL-6-mediated constitutional symptoms. The last is modelled separately because it explains fatigue and mood disturbance that bursitis pain alone would not, and predicts that IL-6 blockade should improve them. Anatomy is bound to UBERON synovial bursa and shoulder joint on imaging and bursal-biopsy evidence; notes record that the disease name is a historical misnomer and that muscle-pathology terms must not be bound on the strength of it. Treatments contrast broad glucocorticoid suppression against mechanistically targeted IL-6 receptor blockade, with the PMR-SPARE randomised trial recorded under clinical_trials. All 27 evidence snippets verified against the local reference cache; schema and term validation pass.

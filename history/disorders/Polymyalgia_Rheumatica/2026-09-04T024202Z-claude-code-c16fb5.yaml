  summary: Add qualitative prevalence record
  details: |
    Applied proactively the class of findings the reviewer raised on the sibling PR 10852. Added a prevalence record for adults aged 50 and over. Deliberately qualitative: prevalence_class COMMON with no rate_per_100000, because the cited sources give no numeric rate, and measure_type UNKNOWN rather than guessing between point prevalence and incidence. The population is recorded as the at-risk age group rather than the general population, since the disease is essentially confined to people over 50, and the notes state plainly that no numeric rate is recorded and why. Two sources support the qualitative band, one calling it among the most common inflammatory rheumatic diseases of this age group and the other calling it the second most common. Quotes already in the local reference cache; no new references fetched. All 29 snippets verified; schema, term and offline gates pass.

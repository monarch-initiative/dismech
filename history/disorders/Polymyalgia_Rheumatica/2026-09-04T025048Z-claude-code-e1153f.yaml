  summary: 'Address review: ontology precision, genetic, biochemical, methotrexate'
  details: |
    Acted on the REQUEST_CHANGES review on PR 10851. Five mechanical ontology fixes: fibroblast-like synoviocyte rebound from CL:0000214 synovial cell to CL:0002301 type B synovial cell at both sites, which matters because the cited abstract distinguishes macrophages from FLS and type A synovial cells are the macrophage-like population; morning stiffness now uses the pre-composed HP:0005197 rather than HP:0001387 plus temporality DIURNAL; the Systemic Acute-Phase Response node now carries GO:0006953 acute-phase response rather than interleukin-6 production; the IL-6-Mediated Constitutional Symptoms node now carries GO:0070102 interleukin-6-mediated signaling pathway, which also removes the identical term-plus-modifier pair that made the two nodes indistinguishable in the process layer; and onset_category moved from MIDDLE_AGE to LATE, which the cited evidence actually supports. The genetic section is the substantive part and does not do what the review suggested. The review proposed carrying HLA-DRB1 across from Giant_Cell_Arteritis, but the PMR literature does not support that: the Spanish cohort found the DRB1 allele distribution in PMR very similar to controls, with DRB1*0401 and *0404 overrepresented in GCA only, and the authors conclude the susceptibility alleles for the two diseases are different. HLA-DRB1 is therefore recorded as MODIFIER with a REFUTE evidence item against susceptibility and a SUPPORT item for the DRB1*09 relapse association. That turns the reviewer suggestion into a second independent line of evidence for the lump/split call rather than an unexamined borrowing from GCA. Added a biochemical section for ESR and CRP with the treated-flare caveat, and a methotrexate treatment carrying the randomised placebo-controlled trial, since presenting tocilizumab as the only steroid-sparing route misstated the landscape; methotrexate deliberately carries no target_mechanisms link because the trial endpoints are steroid sparing and relapse rather than a measured mechanistic effect. Replaced the EULAR scope-fragment snippet on glucocorticoid therapy with the dose and relapse sentences that actually carry the claim, and added bursitis-in-more-than-half and mortality-not-increased evidence. Prevalence stays qualitative: no Orphanet record for PMR is cached and no source gives a rate. All 41 snippets verified; schema, term, grading, length and offline gates pass.

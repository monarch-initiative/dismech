  summary: Restore two dropped references after the base moved under this PR
  details: |
    The base moved under this branch. When this PR was written kb/disorders/Legius_Syndrome.yaml did not exist; a 387-line entry with creation_date 2026-07-13 has since merged to main via PR #6475, so what was authored as a create is now a rewrite of a live entry. The rewrite silently dropped two references that main carries, and this round restores them.

    PMID:22751498, Stowe et al. 2012 Genes Dev, three evidence items restored. The membrane-localization sentence, 'We show that Spred1 binding induces the plasma membrane localization of NF1, which subsequently down-regulates Ras-GTP levels.', is attached at node level to pathophysiology 'Impaired Neurofibromin Recruitment to Activated RAS', because that node's description asserts SPRED1 acts as a membrane-targeting adaptor for neurofibromin and the two papers left supporting it, PMID:26635368 and PMID:32697994, establish the EVH1-GRD interface and the complex structure but not membrane recruitment itself. The molecular-bridge sentence is attached at the same node level as the shared-pathophysiology claim. The Spred1-interacting-protein sentence is attached to that node's downstream edge to 'RAS-MAPK Pathway Hyperactivation'.

    PMID:19366998, Pasmant et al. 2009 J Med Genet, five French families out of 61 index cases, three evidence items restored as the independent replication cohort: learning disability on phenotypes 'Specific Learning Disability', which was otherwise single-sourced to GeneReviews; the objective sentence identifying germline SPRED1 loss of function in NF1-criteria patients without an NF1 variant, on genetic 'SPRED1'; and the counseling sentence on treatments 'Genetic Counseling'.

    Other changes in the same round. creation_date restored to 2026-07-13T00:00:00Z, main's value, rather than the 2026-07-25 the rewrite substituted; CLAUDE.md requires it stable after first creation. A top-level references block was added with just tag-references, tagging PMID:20945555 as GeneReviews; it is cited in eight evidence items and was untagged. The Macrocephaly phenotype graded PMID:26635368 as HUMAN_CLINICAL while the same publication is graded IN_VITRO in five other places in this file; the quoted sentence is a framing sentence from that biochemical study's introduction, so it was regraded IN_VITRO, matching the publication's own evidence type, and a genuine human clinical source, PMID:17704776, was added alongside it. This branch's schema has no quote_role slot, which is what would otherwise record HUMAN_CLINICAL plus BACKGROUND.

    The second prevalence record was a diagnostic yield, not a prevalence: 1.9 percent of individuals with a clinical NF1 diagnosis by NIH criteria have Legius syndrome, carried as rate_per_100000 1900.0 and prevalence_class ABOVE_1_IN_1000 directly beneath a BAND_1_9_PER_1000000 birth-prevalence record for the same disease. It was removed from prevalence and its evidence relocated to the neurofibromatosis type 1 differential_diagnoses entry, with the figure and its ascertainment caveat stated in that entry's description.

    Two supports: PARTIAL values were changed to SUPPORT. The value is retired on main, dismech#10061, though still permissible in this branch's older schema, so leaving them would land invalid values on merge. The qualifying prose was kept in the explanation fields.

    therapeutic_modality was deliberately left off all three treatments. All three bind generic action terms, NCIT:C15747 Supportive Care twice and NCIT:C15240 Genetic Counseling, which CLAUDE.md's mechanical backfill table excludes by name as not platform-classifiable.

    Validation: just validate, covering schema, terms and references, passed with 51 of 51 snippets verified against the cached references; just validate-terms passed; just check-duplicate-keys and just check-entity-refs passed; just validate-history-all passed. just check-enum-values and just check-genereviews do not exist as recipes on this branch, which is behind main, so they could not be run.

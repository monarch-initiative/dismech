  summary: 'Create: Legius Syndrome SPRED1 RASopathy'
  details: |
    Created new Legius syndrome entry MONDO:0012669 SPRED1, the first of the missing germline RASopathies requested in issue #6206. Curated SPRED1 loss-of-function to neurofibromin mislocalization to RAS-MAPK hyperactivation pathophysiology from Brems 2007 PMID:17704776 and the Stowe 2012 mechanism PMID:22751498; NF1-like pigmentary phenotypes without tumor complications from Pasmant 2009 PMID:19366998; autosomal-dominant inheritance; birth prevalence and the NF1 differential from the revised consensus criteria Legius 2021 PMID:34012067. All snippets verified as exact substrings of fetched abstracts; a PMID initially recalled for the mechanism 22711829 was found via verification to be an unrelated Alzheimer/APP paper and replaced with the correct Stowe paper 22751498. Added MONDO:0012669 to the DiseaseTerm enum cache, verified reachable from MONDO:0000001. Schema, term, and reference validation all pass.

  summary: Create Legius Syndrome SPRED1 RASopathy entry
  details: |
    First of four missing core RASopathy entries requested in issue 6206. Created kb/disorders/Legius_Syndrome.yaml for MONDO:0012669 OMIM:611431 SPRED1 hgnc:20249. Models the SPRED1 loss-of-function causal chain: impaired neurofibromin membrane recruitment, RAS-MAPK hyperactivation, and melanocyte somatic second-hit cafe-au-lait macule formation. Includes cutaneous, craniofacial and neurodevelopmental phenotypes, SPRED1 genetics, autosomal dominant inheritance, NF1 differential, genetic-counseling and supportive treatments, and Harrison classification. Evidence from three verified references: PMID:17704776 Brems 2007 foundational; PMID:22751498 Stowe 2012 mechanism; PMID:34012067 2021 revised NF1 and Legius criteria. All snippets verified as exact substrings; schema, term and reference validation pass. DiseaseTerm enum cache extended with MONDO:0012669 through the validator using a local MONDO sqlite adapter.

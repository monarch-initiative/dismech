  summary: 'Create: Legius Syndrome (SPRED1, MONDO:0012669)'
  details: |
    New disorder entry for Legius syndrome (LGSS; formerly NF1-like syndrome / NFLS), created by the automated curation scanner (high_effort tier) working issue #6206, which listed four missing germline RASopathies. Verified against main first: Legius, NF-Noonan, and CBL-related disorder were all still absent; Noonan syndrome-like disorder with loose anagen hair had already landed, so it was dropped from scope.

    NEC preflight: MONDO:0012669 was resolved against the local MONDO snapshot before curation. It is anchored to SPRED1 (RO:0004003 HGNC:20249) and cross-references OMIM:611431 / Orphanet:137605, matching the gene named throughout the cited literature. No eponym collision or numbered-series ambiguity.

    Pathophysiology is a six-node chain: germline SPRED1 loss of function (MOLECULAR) -> impaired neurofibromin recruitment to activated RAS via the EVH1-GRD interface (MOLECULAR) -> RAS-MAPK pathway hyperactivation (CELLULAR), which branches into biallelic SPRED1 inactivation in melanocytes (CELLULAR) -> cafe-au-lait macule formation (TISSUE), and into hippocampal synaptic plasticity impairment (CELLULAR). Every node carries an explicit biological_scale tag. No conforms_to was declared: no RAS-MAPK mechanism module exists, and none of the sibling RASopathy entries (Noonan, Costello, CFC, NF1) declare one either.

    The NF1 contrast is modeled structurally rather than only in prose: two explicitly absent phenotypes (Neurofibroma HP:0001067 and Lisch nodules HP:0009737, both with modifier ABSENT, following the Osteogenesis_Imperfecta_Type_X/XI convention), a differential_diagnoses block against neurofibromatosis type 1 (MONDO:0018975) plus CMMRD, and a DIAGNOSTIC_CRITERIA definition capturing Table 2 of the 2021 I-NF-DC consensus, whose defining feature is that the molecular SPRED1 criterion is mandatory.

    Two discussions were added rather than asserting more than the evidence supports. gap_legius_residual_tumor_risk (KNOWLEDGE_GAP) notes that the no-tumor-risk claim underpinning non-oncologic surveillance rests on a zero count in 42 individuals whose 95% CI extends to 7%, and proposes a biobank genomic-ascertainment cohort. gap_legius_human_model_cognitive_mechanism (HUMAN_MODEL_MISMATCH) flags that the hippocampal LTP/LTD mechanism comes from homozygous Spred1 null mice while human disease is heterozygous, with no corresponding human plasticity data.

    Evidence discipline: seven PMIDs, all fetched with just fetch-reference and snippet-verified against the cached abstracts. Three PMIDs recalled from memory during scoping (17632515, 22588719, and an initially guessed Brems 2007 id) resolved to unrelated papers and were discarded rather than used; the correct ids were found via PubMed esearch. Mouse-model evidence (PMID:19118178) is tagged MODEL_ORGANISM and biochemical/structural evidence (PMID:26635368, PMID:32697994, PMID:11493923) IN_VITRO, so no human phenotype rests on animal data alone. Snippet fixes made during validation: five snippets needed the accented cafe-au-lait spelling to match the cached abstracts, and one snippet spanning a bracketed CI abbreviation was rewritten with an ellipsis elision.

    Cache additions committed alongside: MONDO:0012669 into the DiseaseTerm enum cache and HP:0030052 (Inguinal freckling) into the PhenotypeTerm enum cache, plus hgnc:20249 (SPRED1) and HP:0030052 label-cache rows. The DiseaseTerm row is required because the configured MONDO adapter (ols:mondo) does not place MONDO:0000001 above the disease hierarchy in the OLS build, so lazy enum expansion cannot resolve any newly cited MONDO term; the term itself was independently confirmed reachable from MONDO:0000001 in the local MONDO sqlite snapshot.

    Validation run in the worktree: linkml-validate (schema) clean, just validate-terms clean, just validate-references clean, and dismech.graph --validate reports no issues for this entry.

    Follow-ups left on the issue: Neurofibromatosis-Noonan syndrome (MONDO:0011035) and CBL-related disorder (MONDO:0013308) remain uncurated, and a kb/groupings/RASopathies.yaml grouping is now warranted but deliberately out of scope here.

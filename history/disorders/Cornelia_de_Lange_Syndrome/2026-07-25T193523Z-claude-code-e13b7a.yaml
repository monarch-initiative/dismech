  summary: 'Review: Cornelia de Lange syndrome prevalence field cleanup'
  details: |
    Manual claim-evidence review of 10 microcephaly disorders. CdLS edit: removed the deprecated Prevalence.percentage field ('1-9 per 100,000 births') from the Europe birth-prevalence record on this post-migration entry, per the project guidance that new records should not populate percentage; the structured fields (prevalence_class BAND_1_9_PER_100000, rate_low 1.0, rate_high 9.0) already carry the occurrence data. All ORPHA:199-sourced phenotype/frequency rows and other evidence pairs were reviewed and found to be accurate snippet-validated substrings; the general Hearing impairment (HP:0000365) phenotype is a defensible ontological roll-up of the ORPHA conductive (HP:0000405) and sensorineural (HP:0000407) rows and was left unchanged.

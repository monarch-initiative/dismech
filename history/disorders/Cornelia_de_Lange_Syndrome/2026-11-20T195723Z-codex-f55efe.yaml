  summary: Map Cornelia de Lange syndrome to OMIMPS:122470
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS122470 contains the six numbered NIPBL-, SMC1A-, SMC3-, RAD21-, HDAC8-, and BRD4-related Cornelia de Lange forms in the January 2026 OMIM snapshot. These match the six children of MONDO:0016033 in September 2026 and the cohesin/chromatin-regulation spectrum described by this entry. ExactMatch aligns the clinical syndrome concept, including variable severity and mosaic presentations, rather than asserting a single inheritance pattern or that NIPBL alone defines the disease. The separately curated type 1, 4, and 5 entries provide more specific accounts within that scope; the mapping does not merge those records or all disorders caused by the same genes.

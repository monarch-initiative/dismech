  summary: 'Create: Myopathy_Due_To_Calsequestrin_And_SERCA1_Protein_Overload'
  details: |
    New entry for CASQ1-related myopathy (MONDO:0014546, OMIM:616231), claimed in issue 14385.

    Scope decision: one Disease entry. MONDO has a single term for CASQ1 muscle disease, so the vacuolar aggregate presentation (p.Asp244Gly founder allele, p.Asp244His) and the tubular aggregate presentation (p.Asp44Asn, p.Gly103Asp, p.Ile385Thr) are recorded as allelic has_subtypes. The pathograph shares a polymerisation-defect root and branches: aggregation, junctional mislocalisation, ER stress and failed aggregate clearance for the vacuolar alleles; reduced calcium storage and loss of CASQ1 inhibition of store-operated calcium entry for the tubular aggregate alleles. Knock-in p.Asp244Gly mice show no SOCE increase (PMID:33786938), which supports keeping the branches separate.

    Deep research: OpenScientist (research/Myopathy_Due_To_Calsequestrin_And_SERCA1_Protein_Overload-deep-research-openscientist.md). preflight-dr PASS (CASQ1 mentioned 58 times). Its reference validation resolved 14/14 PMIDs; one quote attributed to PMID:26416891 was stitched across an ellipsis and was not reused. Its term validation flagged four wrong CURIEs (UBERON:0011907, NCIT:C15336, NCIT:C15682, NCIT:C98225); none were used. The report did not describe the SOCE mechanism of the tubular aggregate alleles; that branch comes from PMID:28895244 and PMID:39126637. Its Casq1-knockout and malignant-hyperthermia material (PMID:22130610, 26132720, 29062464, 22049211, 28465322, 36311237) concerns loss of CASQ1 function and was not curated into the entry.

    Additional primary literature beyond the report: PMID:28895244, 39126637, 36514469, 41313434, 38818562, 34908252, and ORPHA:88635 (Orphadata release 2026-06-23, newer than the manifest pin). PMID:29039140 (Bohm 2018) could not be retrieved with quotable text and is not cited. No GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER). No treatment has been evaluated in patients, so there is no treatments section.

    Validation: just validate passes (schema, terms, references); count-verified-snippets all verified; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-block-scalar-comments pass. A red-team review before the PR found a false note claiming HPO had no non-rimmed vacuole term (HP:6000978 exists and is now used), an edge from calcium storage to SOCE that the source treats as parallel, and ER-stress edge evidence attached to the wrong edge; all were fixed.

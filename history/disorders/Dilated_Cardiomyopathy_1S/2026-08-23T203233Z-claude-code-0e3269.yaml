  summary: 'Create: Dilated Cardiomyopathy 1S (MYH7)'
  details: |
    Curated CMD1S (MYH7, MONDO:0013262; ClinGen Definitive). Curated primarily to carry the allelic contrast with Hypertrophic Cardiomyopathy 1: the dilated MYH7 alleles (Ser532Pro, Phe764Leu) diminish contractile function and the ventricle dilates, where the hypertrophic alleles increase it and the ventricle thickens. The founding study's statement of that principle is curated as evidence on the effector node, together with the absence of antecedent hypertrophy or hypertrophic histopathology. Conforms to cardiomyopathy_maladaptive_remodeling. Deliberately does not assert a domain-based genotype-structure rule. Stub deleted; added to Familial Dilated Cardiomyopathy grouping. 11 snippets verified.

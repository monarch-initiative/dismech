  summary: 'Curate phenotypes: add LV systolic dysfunction and LV noncompaction'
  details: |
    Added Left Ventricular Systolic Dysfunction (HP:0025169) and Left Ventricular Noncompaction (HP:0030682, frequency FREQUENT from 36% in the 147-carrier cohort and 38% hypertrabeculation in the pediatric series), cited from PMID:36007715 and PMID:39494569. Added infantile-onset evidence to the Dilated Cardiomyopathy phenotype and a causal edge from Ventricular Dilation and Systolic Dysfunction to the new systolic dysfunction phenotype. The GeneReviews chapter is an Overview with purpose statement only and Orphanet has no MYH7-specific CMD1S record, so no phenotype baseline was available there. Noncompaction is left unwired because no source states a mechanism. Validated with validate, count-verified-snippets, validate-terms, validate-disorders, check-causal-targets, check-coarse-phenotypes and check-name-collisions.

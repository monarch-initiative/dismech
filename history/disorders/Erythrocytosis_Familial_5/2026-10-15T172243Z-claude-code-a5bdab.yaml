  summary: 'Create: Familial Erythrocytosis 5 (ECYT5, EPO)'
  details: |
    De novo curation of MONDO:0033483 (erythrocytosis, familial, 5; ECYT5), autosomal dominant erythrocytosis caused by germline EPO variants. The first draft was built from PubMed E-utilities searches; an openscientist deep-research report (research/Erythrocytosis_Familial_5-deep-research-openscientist.md, template_sha 1e7ea4ee817acfe1dda5f77fafe6f2e8b5927666) landed afterwards and was then screened and partly integrated, as recorded below.

    Ten references are cited. The first six, all fetched with just fetch-reference and read from references_cache before quoting, are: PMID:29514032 (Zmajkovic 2018 NEJM, the sentinel EPO c.32delG family; abstract only in cache), PMID:40305710 (Martin 2025 NEJM, six families with noncoding EPO variants and hepatic-like EPO; abstract only), PMID:41574959 (Lanikova 2026 Am J Hematol, EPO c.-136G>A promoter variant, five-generation kindred, CRISPR Hep3B functional work; full text), PMID:41713879 (Martin 2026 Drug Test Anal, erythropoietin isoelectric focusing profiles and the clinical and treatment details of four noncoding-variant patients; full text), PMID:31350093 (review, source for the ECYT5 designation, the signal-peptide frameshift, the intron 1 P2 promoter transcript and the c.19delC allele), PMID:41123216 (JAK2 unmutated erythrocytosis 2026 update, source for management and for the field-level summary of the EPO-variant mechanism).

    Pathophysiology is a nine-node chain with two initiating lesions that converge: the exon 2 frameshift deletion reaches excess bioactive erythropoietin through reading-frame rescue of the normally noncoding intron 1 P2 transcript, while the noncoding promoter and intron 1 variants reach it through increased transcription from hypoxia-responsive cis-regulatory elements, with a parallel branch through hepatic-type glycosylation of the secreted hormone. Both converge on increased erythropoietin receptor signalling in erythroid progenitors, increased erythroid output and increased red cell mass, which is wired to all three phenotype nodes.

    Patient versus cell-line attribution was kept explicit. The transcriptional gain of function, the P2 translation result, the 2.7-fold secretion increase and the receptor-proliferation results are graded IN_VITRO; segregation, hematocrit and hemoglobin values, the erythropoietin concentrations, the isoelectric focusing profiles and the phlebotomy treatment are graded HUMAN_CLINICAL. quote_role BACKGROUND is used where a sentence in PMID:41713879 restates the earlier genetic report or the textbook physiology of erythropoietin, and REVIEW_SYNTHESIS for the review-sourced items. One REFUTE item is recorded on the promoter-transcription node for the negative chromatin immunoprecipitation result.

    The Excess Bioactive Circulating Erythropoietin node carries the EPO gene descriptor and a molecular_functions binding, GO:0005179 hormone activity with modifier INCREASED, so the causal gene lands on a node that names what the protein does and not only on nodes naming what the cell does. The binding sits on the excess-hormone node rather than on either lesion node because that is where the hormone's activity is the claim: in the noncoding families the protein sequence is unchanged and erythropoietin purified from patient plasma signals more strongly through its receptor than wild-type hormone, which is a quantitative increase in a normal activity, so INCREASED rather than GAIN_OF_FUNCTION. Putting it on the exon 2 lesion node would have been wrong in the opposite direction: there the canonical transcript stops producing hormone altogether. The grounding evidence is a shortened extent of a snippet already quoted on the glycosylation edge, kept at the same IN_VITRO grading. check_gene_activity_grounding.py reports no newly ungrounded genes with no exemption added to tests/gene_activity_grounding_baseline.txt.

    Deep-research screening. just preflight-dr against MONDO:0033483 returned PASS: canonical gene EPO mentioned 134 times against EPOR 20, JAK2 20, EPAS1 6, and the report's OMIM 617907 matches MONDO's. The report's own frontmatter recorded 16 of 16 references resolved with a 0.0 confabulation rate but only 6 judged on topic and 0 off topic, so the remaining 10 were read before any were used. Term validation was flagged needs_review and its flags were acted on rather than trusted: GO:0005615 is obsolete and was never bound; HP:0200071 was reported as erythromelalgia and is in fact Peripheral vitreoretinal degeneration, so it was not bound; HP:0002315 Headache and HP:0000989 Pruritus are real terms but were traced to their sources before any decision.

    What the report added. Four references, all previously absent, all on the tg6 transgenic mouse that overexpresses human EPO hypoxia-independently: PMID:16690772 (the line, hematocrit to 0.89, multi-organ degeneration and reduced lifespan), PMID:18256329 (plasma erythropoietin elevated twelve-fold; midgestation abortion unless hematocrit is lowered), PMID:16254128 (reduced brain vessel density with endothelial activation), PMID:21859826 (endothelial glycocalyx nearly abolished at a hematocrit of about 0.85). These fill the animal_models gap the first draft recorded as empty. The entry now carries one animal model with two ModelMechanismLinks, to Excess Bioactive Circulating Erythropoietin and to Increased Red Cell Mass, each RECAPITULATES at MODERATE fidelity with model_scale ORGANISM (both ALIGNED, no scale extrapolation), each with a readout and typed divergences: CAUSE_UNREPRESENTED because erythropoietin excess is imposed by a transgene and no EPO allele is encoded, SPECIES_MISMATCH, and OTHER for the supraphysiological degree (hematocrit 0.85 to 0.89 against roughly 0.50 to 0.63 in patients). OTHER is used deliberately: the taxonomy has no value for a correctly modelled quantity held at a supraphysiological level, which CLAUDE.md anticipates as a likely future SUPRAPHYSIOLOGICAL_EXPRESSION value.

    A fourth discussion was added, kind HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP, because the model evidence here is good and consistent across four studies while its transfer to patients is the open question: the damage is attributed by the model's own authors to the degree of erythrocytosis, and the degree is the one variable that does not match. The two stale sentences claiming no animal model existed were corrected, in the tissue-of-origin gap and in notes.

    What the report offered and was rejected. Nine of its sixteen references were not used and their caches were pruned. Headache (HP:0002315), pruritus (HP:0000989), erythromelalgia, visual disturbance and thrombosis were declined as phenotypes: the report sources them to PMID:42557631, whose quoted sentence describes polycythemia vera, and to the general reviews PMID:41347984 and PMID:36966432, none of which observes an EPO-variant carrier. Importing them would have attributed another disease's symptom list to this one, which is the named-entity risk the preflight exists for. PMID:21511372 and PMID:33456185 concern high-oxygen-affinity hemoglobin and Hb San Diego, PMID:28699191 hydroxyurea in polycythemia vera, all different diseases; PMID:23291219 (HIF regulation of erythropoiesis) and PMID:9664155 (EPOR physiology) are background already covered by primary sources in the entry; PMID:17365666 is a further tg6 capillary-oxygen-delivery study not needed for either link; PMID:42557631 and PMID:41347984 duplicate management content already sourced from PMID:41123216. The report's own frequency column (Obligate, Characteristic, Variable, Occasional) carries no denominator in any cited source and was not used, so no frequency value was added. Its HP:0020059 for increased circulating erythropoietin was not used either: the term is real but means Increased red blood cell count, which the report's own validator surfaced in its worth-a-second-look tier rather than in the frontmatter mislabelled list. The entry keeps the erythropoietin finding in diagnosis, where the inappropriately-normal reading can be stated, and does not add a fourth overlapping lab phenotype for red cell count.

    One grading correction was made during validation. check-snippet-grading treats overlapping quotes of one reference as the same sentence, and the four PMID:29514032 citations quoted nested extents of a single abstract sentence under two different evidence_source values. All four are now HUMAN_CLINICAL, that publication being a family study; the in vitro demonstration of the P2 mechanism is carried separately by the PMID:31350093 transfection quotes, which stay IN_VITRO. Two review-sourced sentences that contain no clinical observation, the ECYT5 nomenclature statement and the sequence-level account of the frameshift, are graded OTHER rather than HUMAN_CLINICAL; the repository carries both conventions and that gate deliberately does not decide between them.

    Three deliberate omissions. No frequency values on any phenotype, because no source reports a denominator. No prevalence block, for the same reason. No thrombotic or hyperviscosity phenotype, because the sources mention vascular consequences only in passing and no cohort reports event rates; this is recorded in notes. gene_disease_validity is omitted because no cached ClinGen CGGV record exists for EPO with this disease. No animal_models section: none has been reported, and the absence is named in the tissue-of-origin knowledge gap.

    Three KNOWLEDGE_GAP discussions: the erythropoietin-producing tissue is inferred from hormone glycosylation and never identified directly; whether the exon 2 and noncoding routes are one disease entity, which is the lump and split question for this entry; and which transcription factor mediates the c.-136G>A promoter effect given that chromatin immunoprecipitation did not confirm HIF binding.

    No GeneReviews chapter exists. just check-genereviews --online over the entry's name, disease term and six synonyms returns NO_CHAPTER for both GeneReviews and StatPearls. The nearest chapter, Primary Familial and Congenital Erythrocytosis, is about EPOR and scopes itself to erythrocytosis without a secondary cause, so it is not this disease's baseline; it is named in notes but deliberately not cited, and the reason is recorded there.

    Validation after integration: just validate passed (schema, terms, references; 56 snippets checked, 0 issues, 66 titles checked). just validate-terms passed. just count-verified-snippets reported 56/56. just model-scale-audit reports 2 of 2 model links scale-determined and ALIGNED. check_gene_activity_grounding.py against origin/main reports no newly ungrounded genes. check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-block-scalar-comments all clean for this file. The whole-KB gates check-coarse-phenotypes, check-snippet-length, check-title-snippets, check-snippet-grading, check-retired-support-prose, check-environmental-evidence, check-enum-values and check-reference-titles all report no new findings. just validate-disorders on this file passed end to end (48 snippets, 0 issues). just list-gene-term-mismatches examined all three gene bindings and found the entry names the gene it binds in each. just list-disconnected-phenotypes reports all three phenotype nodes causally connected. Cache additions are GO:0042446 and MONDO:0033483 and their enum-membership rows, all four used by this entry; just normalize-cache left the files otherwise unchanged.

  summary: Link the three chronic liver injury exposures to the substrate node
  details: |
    Backfill for issue #8085. All three exposures target the chronic liver disease substrate node. Chronic hepatitis B or C infection and Cirrhosis are graded identically at TRIGGERS with DIRECT and supports SUPPORT, because they rest on the same sentence, which names hepatitis and cirrhosis together among the chronic liver diseases in which hepatocellular carcinoma typically arises; each exposure constitutes the node rather than acting on it from outside. Alcohol and aflatoxin exposure into the same node is graded lower at PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES and supports PARTIAL, for two reasons stated in the link description rather than left to inference: the cited sentence covers only the aflatoxin half of this bundled exposure and says nothing about alcohol, and it is hedged as a belief about population prevalence rather than a measured interaction. The bundled exposure name is pre-existing and was not changed. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 19 of 41 with 22 pre-existing DOI-prefix skips, and every snippet added by this change was checked against its cache by hand.

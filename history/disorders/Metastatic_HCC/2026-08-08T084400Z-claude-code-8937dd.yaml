  summary: Remove Cirrhosis from environmental list; moved to comorbidity entry (#8185)
  details: |
    Removed the 'Cirrhosis' environmental entry: cirrhosis is one of the chronic liver injury states already enumerated by this entry's own 'Chronic Liver Disease Substrate' pathophysiology node, and is a first-class Disease entry (kb/disorders/Liver_Cirrhosis.yaml), so modeling it as an environmental exposure was near-tautological and invisible to comorbidity querying. Split out as kb/comorbidities/com_Liver_Cirrhosis__Metastatic_HCC.yaml (directionality A_BEFORE_B, effect_direction RISK), reusing the existing PMID:41567639 evidence and adding a new quantitative snippet (90 percent cirrhosis prevalence in the cited Tunisian HCC cohort). The sibling 'Chronic hepatitis B or C infection' environmental entry is a genuine exposure and was left unchanged.

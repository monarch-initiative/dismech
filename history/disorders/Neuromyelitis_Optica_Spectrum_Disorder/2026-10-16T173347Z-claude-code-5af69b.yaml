  summary: Merge Neuromyelitis_Optica into Neuromyelitis_Optica_Spectrum_Disorder
  details: |
    Merged the duplicate Neuromyelitis_Optica entry into this one. Both bound disease_term MONDO:0019100 (neuromyelitis optica), and the 2015 international consensus criteria (PMID:26092914) fold NMO into NMOSD. This file keeps its name, node names and creation_date; Neuromyelitis_Optica.yaml was deleted and its four history records moved here with a target.superseded_by block.

    Folded in from Neuromyelitis_Optica: the epidemiology sentences of its description; synonym Neuromyelitis Optica; all four prevalence records; both epidemiology records; the 2015 IPND adult diagnostic-criteria definition; six pathophysiology nodes (AQP4 Endocytosis and Complement-Independent Cytotoxicity; IL-6-Mediated Th17 Skewing and Blood-Brain Barrier Disruption; B Cell and Plasmablast-Mediated AQP4-IgG Production; Glutamate Excitotoxicity via EAAT2 Downregulation; Complement Bystander Injury to Oligodendrocytes and Neurons; Granulocyte Infiltration and Vasculocentric Immune Complex Deposition); eight phenotypes (Visual Loss, Muscle Weakness, Spasticity, Intractable Hiccups, Neuropathic Pain, Painful Tonic Spasms, Neurogenic Bladder Dysfunction, Depression); classifications (Harrison's NEUROLOGIC and IMMUNE_RHEUMATOLOGIC); two Metabolomics Workbench datasets (ST001035, ST001036); and 17 references-list rows not already present.

    Merged as duplicates, keeping this file's item and adding the other item's evidence: AQP4-IgG-Mediated Astrocyte Injury into Aquaporin-4 Autoimmunity (adds PMID:28235212 evidence, the 80 percent seropositivity sentence and modifier INCREASED on complement activation; treatment target_mechanisms retargeted to Aquaporin-4 Autoimmunity); phenotypes Optic Neuritis, Myelitis into Longitudinally Extensive Transverse Myelitis, and Nausea and Vomiting into Area Postrema Syndrome (category, and PMID:28235212, PMID:21368286 and ORPHA:71211 evidence added); treatments Eculizumab, Inebilizumab, Satralizumab and Rituximab (evidence and target_mechanisms added), High-Dose Corticosteroids into Acute Attack Treatment - Corticosteroids (description, therapeutic_modality, methylprednisolone therapeutic_agent, evidence and target_mechanisms added), and Plasma Exchange into Acute Attack Treatment - Plasma Exchange. The three GEO datasets and three references rows were identical in both files and kept once. No evidence item was dropped and no snippet was edited. Where two merged items disagreed (Area Postrema Syndrome frequency FREQUENT here against OCCASIONAL for Nausea and Vomiting), this file's value was kept.

    One explanation on the Eculizumab to Aquaporin-4 Autoimmunity mechanism link argued for the retired PARTIAL grade; it now carries directness INDIRECT and the grade name is dropped.

    Added a skos:exactMatch mondo_mappings row for MONDO:0019100, and subtype_term bindings for the three serostatus subtypes (MONDO:0035663, MONDO:0035664, MONDO:0035665; labels checked in OLS and by validate-terms). The AQP4-IgG subtype carries curated_in Neuromyelitis_Optica_Spectrum_Disorder_with_Anti-AQP4_Antibodies, the existing entry whose disease_term is MONDO:0035663.

    Validated with just validate, just validate-terms, just count-verified-snippets (78/78), just validate-disorders (78 snippets, 116 titles, 0 issues), and the offline whole-KB gates listed in the PR.

    Review round on PR 14556: dropped the deprecated percentage field from the four prevalence records moved from Neuromyelitis_Optica; each already carries rate_per_100000.

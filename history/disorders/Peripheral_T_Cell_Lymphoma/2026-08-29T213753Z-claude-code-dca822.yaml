  summary: 'Evidence-integrity review: claims vs cited publication text'
  details: |
    Evidence-integrity review of all 42 evidence items against 17 cached references, re-reading each cited publication. Three defects found and fixed, all in the newest material - the 2026 single-case CAR-T-derived secondary PTCL report (PMID:42419880) - and all the same over-claim: (1) the pathophysiology node description asserted CAR vector integration events in cancer-associated genes as part of a multistep oncogenic process, while the cited abstract explicitly says no functional evidence supports a direct oncogenic role; rewrote to attribute the multistep process to BLM deficiency, somatic TET2 mutations and genomic instability, demote integration events to clonal-expansion markers, state the single-case basis, and carry the authors' own spectrum caveat; (2) one evidence explanation contradicted its own quoted disclaimer - corrected; (3) the BLM genetic notes propagated the same over-claim - aligned. Subtype-identity check (PTCL-NOS vs AITL vs ALCL) is clean: RHOA G17V/VAV1 confined to AITL-typed material, GATA3/TBX21 and STAT3/DNMT3A to PTCL-NOS, ALCL subtypes cite a sentence naming ALK-positive/negative ALCL, TET2 attached to the TFH branch matching its source. Grading spot-checks passed, including the correct IN_VITRO vs HUMAN_CLINICAL split of PMID:28832024 by sentence. Left unfixed with reasons: deprecated percentage prevalence field (schema migration, evidence itself sound); a narrative pathology review graded HUMAN_CLINICAL in ten places (open repo-wide convention, internally consistent); target_mechanisms links without link-level evidence (recommended, not required); notes-only biochemical entries. Validation: just validate passes; strict snippet audit clean.

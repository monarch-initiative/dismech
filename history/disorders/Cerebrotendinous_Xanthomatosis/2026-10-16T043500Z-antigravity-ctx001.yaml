  summary: >-
    Reviewed Cerebrotendinous_Xanthomatosis.yaml against the Falcon deep-research
    report and cached literature; added Harrison's and ICIMD classifications,
    clinical subtypes (classical, spinal, and non-neurological CTX), Druze
    founder population epidemiology, 7alpha-C4/27-OHC/FGF19 biochemical readouts,
    newborn screening and Mignarri suspicion index diagnostics, five differential
    diagnoses, and murine and patient iPSC-derived cortical neuron models.
  details: |
    Confirmed that existing causal edges, phenotype-mechanism bindings, ontology
    labels, and exact-quote evidence snippets in Cerebrotendinous_Xanthomatosis.yaml
    pass all validators. Expanded missing high-value sections supported by the
    Falcon deep-research report and cached references:
    - classifications: Harrison's chapters (Disorders of Endocrinology and
      Metabolism; Neurologic Disorders; Genetics, Environment, and Disease) and
      ICIMD category bile_acid_metabolism.
    - has_subtypes: Classical CTX, spinal xanthomatosis, and non-neurological CTX
      (DOI:10.3389/fneur.2022.1049850).
    - prevalence: High-prevalence northern Israel Druze community with 1:11
      carrier frequency (PMID:19092443).
    - biochemical: 7alpha-hydroxy-4-cholesten-3-one (7alpha-C4),
      27-hydroxycholesterol (27-OHC), and postprandial FGF19 with mechanistic
      readouts (PMID:20494109, DOI:10.3389/fneur.2022.1049850,
      DOI:10.1186/s13023-023-02666-w, DOI:10.3390/nu15214625).
    - diagnosis: Newborn screening dried blood spot bile alcohol glucuronide
      testing and Mignarri clinical suspicion index
      (DOI:10.3389/fneur.2022.1049850).
    - differential_diagnoses: Sitosterolemia, familial hypercholesterolemia,
      hereditary spastic paraplegia 5A (SPG5A), Smith-Lemli-Opitz syndrome, and
      Alagille syndrome (PMID:27678445, PMID:19812052,
      DOI:10.1186/s13023-023-02666-w, DOI:10.3389/fneur.2022.1049850).
    - animal_models & experimental_models: Cyp27a1-/- knockout mouse model and
      CTX patient iPSC-derived cortical projection neuron model.

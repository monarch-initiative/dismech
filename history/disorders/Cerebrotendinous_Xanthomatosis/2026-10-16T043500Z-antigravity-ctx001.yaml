  details: "Confirmed that existing causal edges, phenotype-mechanism bindings, ontology\nlabels, and\
    \ exact-quote evidence snippets in Cerebrotendinous_Xanthomatosis.yaml\npass all validators. Expanded\
    \ missing high-value sections supported by the\nFalcon deep-research report and cached references,\
    \ and resolved PR #14475\nreview feedback:\n- classifications: Harrison's chapters (Disorders of Endocrinology\
    \ and\n  Metabolism; Neurologic Disorders; Genetics, Environment, and Disease) and\n  ICIMD category\
    \ bile_acid_metabolism.\n- has_subtypes, progression, pathophysiology & phenotypes: Classical CTX,\n\
    \  spinal xanthomatosis (updated with 34-case review summary showing complex\n  HSP predominance,\
    \ 23.5% isolated spastic paraplegia, 78% cataracts, 65%\n  chronic diarrhea, and 31% xanthomas), and\
    \ non-neurological CTX\n  (DOI:10.3389/fneur.2022.1049850), linked via subtype foreign keys in\n \
    \ progression, pathophysiology.subtypes, and phenotypes.phenotype_contexts.\n- prevalence: Replaced\
    \ deprecated percentage field with measure_type:\n  CARRIER_FREQUENCY and rate_per_100000: 9090.9\
    \ for the 1:11 carrier\n  frequency in the northern Israel Druze community (PMID:19092443).\n- biochemical:\
    \ 7alpha-hydroxy-4-cholesten-3-one (7alpha-C4, keeping single\n  DIAGNOSTIC readout), 27-hydroxycholesterol\
    \ (27-OHC), and postprandial\n  FGF19 (DIAGNOSTIC readout reflecting 3-week CDCA/statin washout vs\
    \ matched\n  healthy controls) (PMID:20494109, DOI:10.3389/fneur.2022.1049850,\n  DOI:10.1186/s13023-023-02666-w,\
    \ DOI:10.3390/nu15214625).\n- diagnosis: Framed dried blood spot GlcA-tetrol and GlcA-tetrol/TCDCA\n\
    \  LC-MS/MS testing as a candidate research-context neonatal screening\n  strategy and added Mignarri\
    \ clinical suspicion index\n  (DOI:10.3389/fneur.2022.1049850).\n- differential_diagnoses: Sitosterolemia,\
    \ familial hypercholesterolemia,\n  hereditary spastic paraplegia 5A (SPG5A), Smith-Lemli-Opitz syndrome,\
    \ and\n  Alagille syndrome (PMID:27678445, PMID:19812052,\n  DOI:10.1186/s13023-023-02666-w, DOI:10.3389/fneur.2022.1049850).\n\
    - animal_models & experimental_models: Cyp27a1-/- knockout mouse model\n  (disambiguated PMID:20494109\
    \ MODEL_ORGANISM snippet) and CTX patient\n  iPSC-derived cortical projection neuron model bound to\
    \ CL:0010012\n  (cerebral cortex neuron) with MODERATE fidelity, CELLULAR model_scale,\n  and BOUNDARY_OMISSION\
    \ divergences.\n"

  summary: Repair evidence-claim mismatches (issue 16983)
  details: |
    Reviewed the Jev evidence-claim assessments for this entry, concentrating on the five whole-claim MISMATCH findings and the issue's examples. SPG5A differential: removed the unsourced 'dorsal column sensory loss' and 'absence of tendon xanthomas' claims; restated the 27-OHC feature as measured (raised plasma 27-OHC in SPG5 patients, PMID:19812052; raised in SPG5 and reduced in CTX iPSC-derived neurons, DOI:10.1186/s13023-023-02666-w); added the practice review's statement that cataracts and chronic diarrhea separate CTX from HSP type 5A and its spinal-xanthomatosis frequencies (xanthomas 31%, cataracts 78%, diarrhea 65%). Alagille differential: added evidence for each half of the distinguishing feature (normal or slightly raised GGT and bile alcohol glucuronides in CTX from the practice review; bile duct paucity and JAG1/NOTCH2 from GeneReviews PMID:20301450) and softened 'low/normal GGT' to the source's 'normal or slightly elevated'. Peripheral nerve node: removed iPSC cortical-neuron evidence that does not bear on peripheral nerve; the axonopathy node that carries it now says the model does not address the neuropathy. Corticospinal node: replaced the fragments 'bulbar palsy' and 'hyperintensity ... MRI hallmark' with full sentences naming the bulbar palsy and the dentate nuclei. Paraparesis edge: added a corticospinal-axon-degeneration quote, since the Orphanet frequency row shows only that the phenotype occurs. Supportive care: rewrote the description to match GeneReviews (cataract extraction, symptomatic epilepsy/spasticity/parkinsonism, annual surveillance) and added the surveillance quote. NCT02638220: extended the snippet to the full sentence; status COMPLETED and observational design confirmed against the ClinicalTrials.gov API. Retained: Orphanet HPO-frequency rows on downstream edges flagged PARTIAL, which correctly support phenotype occurrence alongside the node evidence. Validated with just validate-disorders, count-verified-snippets (236/236) and the whole-repo snippet gates.

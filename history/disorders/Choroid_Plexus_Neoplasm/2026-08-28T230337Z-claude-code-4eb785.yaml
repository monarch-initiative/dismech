  details: |
    Detailed evidence review of the umbrella choroid plexus neoplasm entry. All 157 evidence snippets across epidemiology, prevalence, subtypes, progression, pathophysiology, histopathology, imaging, phenotypes, biochemical, genetic, inheritance, environmental, treatments, diagnosis, differential diagnoses, discussions, clinical trials, and animal models were mechanically verified against the reference cache, 157/157 passing. All 36 unique cited references - 35 PMIDs plus clinicaltrials:NCT04994977 - were re-read in full from references_cache and each snippet was checked for exact-substring status, semantic support of the specific attached claim, supports grading, evidence_source classification, and named-entity confusion across the three WHO grades: CPP vs aCPP vs CPC. No defects found: quotes match the graded entity they are attached to - papilloma case reports support papilloma and family-level claims, SJYC07 and CPT-SIOP-2000 carcinoma results support the carcinoma-scoped claims. PARTIAL gradings on mouse-model sufficiency claims and on the imaging and intracranial-pressure items are deliberate and correct, and REFUTE tagging on the SV40 evidence matches the contested-exposure framing. reference_title values were spot-checked against cache frontmatter with no mismatches. evidence_source OTHER on StatPearls PMID:30969571, the Adv Cancer Res overview PMID:41198335, and background sentences of PMID:35322202 was reviewed and deliberately left as-is: these quote textbook or review consensus statements rather than a study's own data, a defensible convention applied consistently in this entry. just validate and just count-verified-snippets both pass with no changes needed.

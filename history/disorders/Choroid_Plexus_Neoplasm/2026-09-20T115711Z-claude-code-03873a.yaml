  summary: 'Genetics pass: bind TP53 to the carcinoma row; record MONDO disagreement
    on papilloma'
  details: |
    Genetics pass for #12192. TP53 and TERT were already curated and already wired to mechanism nodes, so the entry needed no new genes. Bound TP53 on the CPC row with PMID:20308654's carcinoma-specific 50% figure. The checklist pair here is TP53 for MONDO:0009837, choroid plexus *papilloma*, and after reading the entry's sources I could not support it at that granularity: every TP53 source cited attributes the gene to the carcinoma, with papillomas appearing as the low-structural-variation comparison group, and the one family-wide rate (7/47 tumours, PMID:33249490) is not broken down by grade. Recorded that reasoning in `review_notes` on the CPP row rather than binding a gene there, and a matching note on the aCPP row, whose own cited evidence is that methylation and copy-number profiling do not separate it from CPP.

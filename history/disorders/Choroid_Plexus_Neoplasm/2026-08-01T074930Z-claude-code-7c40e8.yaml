  summary: 'Create: Choroid Plexus Neoplasm (MONDO:0016717)'
  details: |
    New umbrella entry for the choroid plexus tumor family (MONDO:0016717), spanning choroid plexus papilloma (WHO grade 1, MONDO:0009837), atypical choroid plexus papilloma (WHO grade 2, MONDO:0002684) and choroid plexus carcinoma (WHO grade 3, MONDO:0016718). Deep research via Edison/Falcon (research/Choroid_Plexus_Neoplasm-deep-research-falcon.md, 41 citations, 527s); DR output treated as leads only, with every PMID re-fetched via just fetch-reference and every ontology ID OAK-resolved. The DR emitted DOIs rather than PMIDs for its key sources, which were resolved through the PMC ID Converter. Central modelling decision: hydrocephalus is represented as TWO distinct pathophysiology nodes (CSF overproduction by secretory tumour epithelium; obstruction of CSF pathways by mass effect) converging on a shared ventricular-enlargement node, evidenced by a paired set of CSF-dynamics measurement studies (PMID:1022421 proving overproduction, PMID:7414480 a case with normal production and pure obstruction, PMID:6738779 hydrocephalus persisting after radical resection). TP53 modelled as the dominant prognostic axis with separate germline (CAUSATIVE) and somatic (SOMATIC_DRIVER) genetic entries, cross-referencing kb/disorders/Li-Fraumeni_Syndrome.yaml, plus pre-treatment germline testing as a first-class treatment. SV40 curated honestly as contested and currently unsupported, with REFUTE-tagged evidence and an open KNOWLEDGE_GAP discussion rather than an assertion either way. Module conformance claimed only for the TP53 arm (evading_growth_suppressors#Tumor Suppressor Inactivation, genome_instability_mutation#Mutator Phenotype and Chromosomal Instability). ICD-O morphology deliberately omitted and the omission documented, because the closed enum has no papilloma or mixed-behaviour value and tagging the family Carcinoma would misclassify its two non-malignant members. A pre-PR red-team review against the dismech-pr-review skill was run in a fresh-context subagent and its findings were applied before opening the PR: seven phenotypes whose evidence was context-only were re-sourced to directly supporting case and series abstracts (PMID:34754533 for the dual mechanism, bulging fontanelle and papilledema; PMID:21121734 for macrocephaly and vomiting; PMID:27913261 for headache, ataxia, gait disturbance and cranial-nerve dysfunction; PMID:37928807 for seizure); frequency bands were corrected against the entry's own quoted numbers (Kir7.1 VERY_FREQUENT to FREQUENT at 17/23, hydrocephalus VERY_FREQUENT to FREQUENT on an 'often' source); the gross-total-resection superlative was scoped to carcinoma because the entry's own SEER citation shows no survival difference in papilloma or atypical papilloma; the infant prevalence class was corrected from BELOW_1_IN_1000000 to BAND_1_9_PER_1000000; the developmental-delay phenotype was retargeted to HP:0012759 and scoped to CPC; and three already-cached but unused references were consumed (PMID:39482394 tumour microenvironment and pedB risk class, PMID:25315281 alternative lengthening of telomeres, plus the EPHA7 and transposable-element findings from PMID:38867333). A clinical_trials record (NCT04994977) and two animal_models records were added. Validation: just validate PASS, just validate-terms PASS, just validate-references PASS (156/156 snippets), compliance 92.8 percent global / 93.0 percent weighted, phenotype connectivity 13/13 and gene-to-mechanism wiring 3/3 at 100 percent. All reference_title values audited against cached paper titles (37/37 match). The references_cache reformatting churn of issue 7393 was reverted before staging.

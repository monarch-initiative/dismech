  summary: 'Create: X-linked Retinoschisis'
  details: |
    New entry curated from the stubs queue; the stub was deleted in the same change. Five pathophysiology nodes from RS1 loss of function through failure of retinoschisin octamer-mediated adhesion to intraretinal schisis, with two divergent consequences: disrupted photoreceptor-to-bipolar transmission giving the electronegative ERG, and retinal fragility giving haemorrhage and detachment. Records the structural evidence that disease-associated residues map to the octamer assembly interfaces. Treatments cover topical dorzolamide and the AAV8-RS1 phase I/IIa trial, both recorded with their actual evidential weight rather than as established therapy. Carries a KNOWLEDGE_GAP on the absence of genotype-phenotype correlation. Validated: linkml-validate clean, term validation passed, 25 of 25 snippets verified against cached references.

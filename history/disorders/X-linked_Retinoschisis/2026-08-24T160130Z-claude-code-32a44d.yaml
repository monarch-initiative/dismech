  summary: Add GeneReviews baseline (PMID:20301401) and correct the acuity trajectory
  details: |
    Added the X-Linked Congenital Retinoschisis GeneReviews chapter as a top-level tagged reference. Mining it produced a correction rather than a confirmation: this entry described acuity as largely stable through adult life, whereas GeneReviews states it deteriorates through the first and second decades and only then remains relatively stable until the fifth or sixth decade. The node description was amended. Also newly cited: the 20/60-20/120 acuity range and the approximately 50 percent peripheral schisis figure, both previously asserted without a source, and a management item the entry lacked entirely - avoidance of head trauma and high-contact sports, wired to the retinal fragility node.

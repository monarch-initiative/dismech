  summary: 'Create: SLC1A2-Related Developmental and Epileptic Encephalopathy (DEE41)'
  details: |
    New gene- and mechanism-anchored entry for developmental and epileptic
    encephalopathy 41 (DEE41; MONDO:0014916; SLC1A2 / EAAT2 / GLT-1), curated for
    IEMbase metabolic package WP-004 (issue #5559), row 1.11.04.02 "SLC1A2-related
    astroglial glutamate aspartate transporter deficiency", which had no dedicated
    KB entry (the gene appeared only as passing mentions in unrelated files).

    Modeling. Ten pathophysiology nodes: SLC1A2 trimerization-domain missense
    variant -> dominant-negative suppression of wild-type EAAT2 -> impaired
    astrocytic glutamate clearance -> extracellular glutamate accumulation and
    excitotoxicity -> excitation-inhibition imbalance and neuronal hyperexcitability
    -> refractory neonatal-onset multifocal epilepsy -> developmental and epileptic
    encephalopathy, with a parallel mutant-anion-pore glutamate-efflux arm, a
    progressive excitotoxic neuronal/white-matter-injury arm, and an off-chain
    store-operated-calcium-entry arm. Four nodes declare conforms_to against
    epilepsy_excitation_inhibition_imbalance (Ion Channel and Synaptic Dysfunction;
    Excitation-Inhibition Imbalance; Neuronal Hyperexcitability and Hypersynchrony;
    Recurrent Unprovoked Seizures).

    Three mechanistic_hypotheses are curated rather than one settled chain:
    transport_loss_of_function_model (CANONICAL),
    anion_pore_glutamate_efflux_model (ALTERNATIVE - the pore-lining Gly82Arg and
    Leu85Pro substitutions widen the EAAT anion pore enough to make the mutant
    transporter a glutamate EFFLUX pathway, a gain of function with the opposite
    therapeutic prediction), and soce_disruption_model (EMERGING, hedged in its
    source and deliberately kept off the canonical chain).

    Two discussions. HUMAN_MODEL_MISMATCH: the workhorse GLT-1 knockout mouse
    reproduces the phenotype only when homozygous, while heterozygous Slc1a2-null
    mice and humans with heterozygous SLC1A2 deletion (WAGR) are essentially
    unaffected - so the available null models represent an allelic state no patient
    has, and the reconciling 0-50% critical-dosage threshold is inferred rather than
    measured. KNOWLEDGE_GAP: whether therapy should raise transporter expression or
    block the mutant anion channel; the single negative n-of-1 ceftriaxone trial
    cannot separate "wrong mechanism" from "right mechanism, treated too late".

    Evidence discipline. Six references, every one fetched with just
    fetch-reference; no cache file was hand-written. The failed ceftriaxone trial is
    recorded with supports: REFUTE so the negative result cannot be read as support,
    and the hedged SOCE observation is recorded as PARTIAL. Model-organism evidence
    (GLT-1 null mouse, eaat2a-null zebrafish, variant knock-in mouse) is tagged
    MODEL_ORGANISM and never carries a human phenotype claim alone. PMID:23934111
    (Epi4K 2013 Nature) was fetched but deliberately NOT cited: its abstract does not
    mention SLC1A2.

    Validation. just validate passes; 72/72 evidence snippets verified against
    cached references; just validate-terms passes; just check-term-cache-integrity
    reports OK. The 10 new term-cache rows are all well-formed three-field rows,
    including the correctly CSV-quoted MONDO:0014916 label (which contains a comma).
    The unrelated repo-wide references_cache DOI-quoting churn produced by running
    the validators locally was reverted and is not part of this change.

  details: |
    Follow-up to the reviewer's outstanding deep-research-artifact request on PR #8035. Ran a targeted literature-gap sweep (research/SLC1A2-Related_Developmental_and_Epileptic_Encephalopathy-literature-sweep-claude.md) rather than the generic disease-characteristics harness, which errored on an unrelated StructuredOutput schema bug. Confirmed the reviewer's recollected 'Kovermann Brain ~2017' SLC1A2 anion-current paper does not exist; the closest real paper (PMID:23107647) is about a different gene (SLC1A3/EAAT1), variant, and disease (episodic ataxia 6) and was not added to the evidence chain. Found and added PMID:40174554 (Kovermann et al. 2025, EBioMedicine), an independent 18-patient/13-variant cohort that reports a fourth pore-lining variant (p.Leu85Arg) and directly corroborates the anion-pore gain-of-function hypothesis at the clinical level (mixed loss-of-transport/gain-of-anion-channel variants are more severe than pure loss-of-function variants). Also added PMID:33507976 and PMID:34571003 to strengthen the Ceftriaxone treatment section's pharmacological context. Separately, merged current main (branch was a month stale) and fixed three supports: PARTIAL values (retired by #10003 while this PR was in flight) to SUPPORT+directness:INDIRECT or plain SUPPORT per the CLAUDE.md migration table. Full validation re-run after all changes: just validate (schema/terms/references all pass, 77/77 snippets verified), check-duplicate-keys, check-enum-values, check-causal-targets, check-entity-refs, check-qualifier-terms, check-snippet-grading, check-title-snippets, check-folded-hyphens, check-environmental-evidence all pass with no new issues.

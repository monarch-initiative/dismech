  summary: Review and enrich TLR3 Deficiency compliance and mechanistic grounding
  details: '- Added `classifications` (`IMMUNE_RHEUMATOLOGIC`, `INFECTIOUS_DISEASES`, `GENETICS_ENVIRONMENT_DISEASE`,
    and `iuis_category: innate immunity defect`) and `inheritance` (`Autosomal dominant` and `Autosomal
    recessive`) backed by PMID:17872438, PMID:21911422, and PMID:39567785.

    - Grounded `pathophysiology` nodes (`TLR3 Loss of Function`, `Deficient Type I and III Interferon
    Induction`, `Impaired CNS Neuron-Intrinsic Antiviral Immunity`, `Impaired Pulmonary Epithelial Antiviral
    Immunity`, and `Uncontrolled HSV-1 Replication in the CNS`) with `molecular_functions` (`GO:0003725`),
    `biological_processes` (`GO:0034138`, `GO:0032606`, `GO:0034343`, `GO:0051607`), `locations` (`UBERON:0001017`,
    `UBERON:0000956`, `UBERON:0002048`), `cell_types` (`CL:0010012`, `CL:0000082`, `CL:0000057`), and
    causal `downstream` edges.

    - Marked core phenotypes with `diagnostic: true` and structured `diagnosis` (`TLR3-pathway functional
    assay and genetic testing`) and `treatments` (`Acyclovir antiviral therapy`, `Interferon therapy`,
    and `Genetic counseling`) backed by PMID:17872438, PMID:21911422, PMID:31217193, and PMID:39567785.


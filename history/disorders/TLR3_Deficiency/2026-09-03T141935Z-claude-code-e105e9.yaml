  summary: 'Create: TLR3 Deficiency (IMD83)'
  details: |
    De novo curation of TLR3 deficiency / immunodeficiency 83 (MONDO:0800187) from a Perplexity sonar-deep-research report. Modeled the tissue-specific innate-immunity defect as a branched chain: TLR3 LOF -> deficient type I/III IFN induction -> impaired CNS neuron-intrinsic (HSV-1 encephalitis) and pulmonary epithelial (influenza ARDS) antiviral immunity. Verified snippets (14/14) from Zhang 2007 Science (PMID:17872438), Guo 2011 JEM (PMID:21911422), and Lim 2019 JEM (PMID:31217193). Corrected deep-research CURIE errors verified against ontologies: TLR3 HGNC:11850->hgnc:11849 (11850 is TLR4); HSE HP:0006802->HP:0012302 (6802 is anterior horn cell). Validated with just validate, validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys.

  summary: Review CPLX1 clinical spectrum, variant uncertainty and model-specific
    synaptic mechanisms
  details: |
    Reviewed the existing entry and five CREATE/EDIT histories; no prior REVIEW or matching deep-research artifact was present. Used full cached primary clinical and mechanistic papers, including the 2017 clinical table from the institutional PDF, 2015 CPLX1 family, dual-knockdown cortical cultures, single-knockout calyx physiology, mouse stereology, complexin membrane binding, and the published patient iPSC resource. Refetching PMID:28422131 recovered real PMC full text in place of landing-page material. Expanded 3 to 30 case-qualified phenotypes and added four transcript-specific alleles. Separated evoked, spontaneous, asynchronous and postsynaptic effects by experimental context; removed unsupported complete protein absence, direct cortical excitation/inhibition mechanism, blanket infantile onset and worldwide prevalence inference. ClinVar p.Leu128Met classifications conflict; p.Glu2Lys co-occurs with an SCN9A deletion and has no demonstrated neuronal effect. Removed unsupported levetiracetam and recorded actual antiseizure medication resistance and ketogenic-diet nonresponse. Kept inferred supportive care and conditional Mendelian counseling distinct from observed efficacy. Corrected the secondary claim of no mouse neuron loss using the primary granule-cell finding. Preserved discussion/experiment identifiers and retargeted renamed nodes. No disease-specific GeneReviews chapter was found by the expanded-name offline gate or official search. No clinical trial or patient-neuronal rescue result was identified in the consumed sources. Additional alleles, population frequencies and human neurodegeneration remain unestablished; no severity subtypes inferred.

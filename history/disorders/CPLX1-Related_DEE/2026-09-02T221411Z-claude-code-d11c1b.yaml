  summary: Treatment evidence for CPLX1-related DEE, and a recorded absence of treatment-response
    data
  details: |
    Weekly compliance sweep targeting treatments. None of the three treatments carried evidence. Searched PubMed for CPLX1 combined with epilepsy, seizure, encephalopathy and treatment terms, read the full text of Karaca et al. (PMID:26539891, already in the reference cache from the VARS1 entry) and the abstract of Redler et al. (PMID:28422131): no published CPLX1 report names an antiseizure agent or reports a treatment response. Added four evidence items covering what is documented - malignant migrating epilepsy as the seizure syndrome treated, marked developmental delay in every reported patient behind supportive care, and homozygous variants in unrelated families plus an affected homozygous sibling pair behind autosomal-recessive counseling. Three of the four carry directness INDIRECT because the sources describe the phenotype rather than its treatment. Recorded the evidential gap explicitly in a Treatment review_notes rather than leaving it implicit: the levetiracetam therapeutic_agent binding is unsourced, was left in place because no better-sourced value exists to replace it with, and should be revisited when a CPLX1 natural-history cohort is published. Added PMID:26539891 to the entry reference list. Validated with just validate, just validate-terms, just count-verified-snippets (22/22), and just check-snippet-grading.

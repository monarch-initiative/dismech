  summary: 'Create: Eiken_Syndrome'
  details: |
    New entry for Eiken syndrome (MONDO:0010803), biallelic PTH1R. Six pathophysiology nodes model altered rather than absent receptor signaling (raised basal cAMP, impaired beta-arrestin2 desensitization) leading to enhanced PTHrP signaling in growth plate chondrocytes, delayed hypertrophic differentiation and delayed endochondral ossification, with a branch to renal PTH resistance and to failure of tooth eruption. Fourteen HP-bound phenotypes, all wired into the pathograph. Evidence drawn from the original family report, the PTH1R identification, two further family reports, the 2023 cell-signaling study, the 2025 review of homozygous PTH1R disorders and the 2026 humanized R485X knock-in mouse (recorded as an animal model). Deep research: an OpenScientist report from an earlier attempt was reused, not rerun; preflight-dr WARN only because PTH (the receptor ligand) is frequently mentioned, which is expected. Its unresolved HP CURIEs were not used. ISDS classification not added because the cached nosology text does not name Eiken syndrome. No GeneReviews chapter exists (check-genereviews NO_CHAPTER). Validated with validate, validate-terms, count-verified-snippets (41/41), entity-ref, causal-target and the other offline gates, and validate-disorders.

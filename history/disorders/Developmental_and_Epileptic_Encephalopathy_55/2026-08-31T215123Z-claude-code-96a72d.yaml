  summary: 'Create: Developmental and Epileptic Encephalopathy 55'
  details: |
    De-novo curation of DEE55 (MONDO:0033364, PIGP) resolving curation claim #10292. Pathograph runs biallelic hypomorphic PIGP variants -> impaired first step of GPI anchor biosynthesis -> reduced GPI-anchored protein surface expression -> disrupted neurodevelopment and cortical excitability -> refractory epilepsy plus profound developmental impairment. The edge into the neurodevelopmental node is marked INDIRECT_UNKNOWN_INTERMEDIATES because no study attributes the phenotype to any of the >150 GPI-anchored proteins; that is recorded as a knowledge gap rather than papered over. Two further gaps recorded: genotype-severity correlation across the DEE55-to-MCAHS spectrum, and the absence of a GPI-anchor-biosynthesis module in kb/modules/ (so no conforms_to was declared). Deep research: one OpenScientist run, committed, 12/12 references resolved with none off topic; it contributed PMID:31139695 (second family, recurrent c.456delA), PMID:25803904 (complete GPI deficiency is embryonic lethal, which grounds the hypomorphic framing), PMID:38456468 and PMID:35562242 (treatments). All quotes were re-verified against the fetched reference cache, not taken from the report. just preflight-dr warns that GPI is a rival gene at 72 mentions; that is a false positive - GPI there is the anchor, not the glucose-6-phosphate isomerase gene - and the report OMIM matches MONDO. One error caught during curation: hgnc:8967 is PIGN, not PIGP; the correct id is hgnc:3046, confirmed against the HGNC REST API after linkml-term-validator flagged the label mismatch. Validated with just validate (29/29 snippets verified), just validate-terms, check-entity-refs, check-duplicate-keys, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading and check-folded-hyphens.

  summary: 'Review round 1: correct the GTP-loading modifier, regrade a case-report
    result, add antimicrobial prophylaxis'
  details: |
    Review round 1 on PR #11114. Two blocking findings, both fixed, plus all
    three suggestions. One push.

    Finding 1. The node Constitutive GTP-Loading of RAC2 bound GO:0003924
    (GTPase activity, meaning hydrolysis) with modifier GAIN_OF_FUNCTION, which
    asserts that RAC2 hydrolyses GTP more readily. That is the opposite of the
    mechanism the node describes, and it contradicted the immediately upstream
    node, which correctly carries DECREASED on the same term. Rebound to
    GO:0005525 (GTP binding) with INCREASED, which is the occupancy claim the
    node's name and description actually make, so the two nodes now say
    complementary things: GAP-resistant hydrolysis upstream, prolonged GTP
    occupancy downstream. The reviewer's alternative, GO:0007264 with
    GAIN_OF_FUNCTION, would model the signalling state instead; that is already
    where the downstream effector branch lives, so binding it here would have
    duplicated it.

    Finding 2. One PMID:35596857 result was graded IN_VITRO while seven other
    items from the same paper were graded HUMAN_CLINICAL. The paper is a case
    report and the assays are on the patient's own neutrophils and T
    lymphocytes, so HUMAN_CLINICAL is right and the outlier is now consistent
    with the other eight. check-snippet-grading could not see this, because the
    gate keys on one identical sentence carrying two different grades and the
    divergent items quote different substrings of the same result.

    Suggestions taken. The remaining IN_VITRO item from that paper quotes
    background RAC2 switch biochemistry rather than a result of the case, and is
    regraded OTHER. Antimicrobial prophylaxis is added as a treatment, with
    cotrimoxazole named (NCIT:C909) from the sibling pair and the three-patient
    prophylaxis outcome, and the description says plainly that the sibling
    comparison is one uncontrolled within-family observation rather than
    evidence of efficacy. The PMID:40860338 scoping decision is recorded in
    notes: it is a MENA registry of the broader RAC2-pathway actinopathies, so
    attributing its phenotype rates to dominant-activating RAC2 would be a
    named-entity error of exactly the kind the repository warns about.

    Two errors of my own, found while doing this round and recorded here rather
    than only in the commit message.

    The new treatment first declared target_mechanisms against "Recurrent
    Bacterial Infection", which is not a node in this entry. No schema check
    sees an invented bare-name causal target; check-causal-targets caught it,
    which is precisely the silent-failure class that gate exists for. The
    renderer would have drawn a phantom red node and dropped the real one.
    Retargeted to Recurrent Respiratory Tract Infection.

    Worse, I typed the reference_title for PMID:38194689 from memory instead of
    copying it out of the cache, producing a plausible paraphrase that is not
    the paper's title. That is the same defect the reviewer caught on this PR
    for PMID:15528331, repeated in the commit that fixed it. Fixed by reading
    the title out of references_cache directly. The rule that follows is simple
    and absolute: never type a reference title.

    Validation on this tree: just validate clean, 64/64 snippets verified, up
    from 62. Terms, entity-refs, causal-targets, duplicate-keys, enum-values,
    qualifier-terms, snippet-length, title-snippets, snippet-grading,
    folded-hyphens and reference-titles all pass. One new cache row pair,
    GO:0005525.

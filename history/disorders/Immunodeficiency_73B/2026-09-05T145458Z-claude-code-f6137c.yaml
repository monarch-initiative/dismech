  summary: 'Create: Immunodeficiency 73B (RAC2 dominant-activating combined immunodeficiency)'
  details: |
    New kb/disorders entry for IMD73B (MONDO:0033554), claimed via issue #11107. Curated as the dominant-activating arm of the RAC2 allele-class spectrum, which the existing Neutrophil_Immunodeficiency_Syndrome entry (IMD73A, dominant-negative) explicitly scopes out of itself. Pathograph branches at constitutive GTP-loading into the NADPH-oxidase arm, the actin arm and an apoptosis arm, converging on myeloid effector dysfunction and on T/B lymphopenia with impaired output. Nine HPO-bound phenotypes, four variants with functional evidence, two mouse models (the allele-matched Rac2+/E62K knock-in as RECAPITULATES, the Rac2 null as FAILS_TO_RECAPITULATE with an inverted-lesion limitation), and two KNOWLEDGE_GAP discussions. Deep research: OpenScientist report committed. Two of its claims were rejected and the rejections recorded in entry notes. First, it listed the G15D allele (PMID:36459342) as dominant-activating; the paper classifies it as loss-of-function inactivating, so it is excluded. Second, it states no knock-in mouse exists for a human dominant-activating allele; PMID:30723080 reports Rac2+/E62K, which is curated as the primary model. Reference validation: the report flagged PMID:15814684 as unresolved (confabulation_rate 0.083). I re-checked that identifier directly against NCBI esummary during curation; it resolves to Carstanjen et al. 2005 J Immunol with the title the report attributed to it, so the failure was in the lookup rather than the citation, and it is cached and cited on that basis. PMID:31382036 has no PubMed abstract (content_type unavailable) so it carries no evidence item and appears in the reference block only. Four snippets had to be requoted around square-bracketed allele designations (RAC2[E62K], RAC2 [N92 T]) that the reference validator strips; commented on issue #10192 with this as a new sub-form no proposed keep-pattern reaches. No iuis_category asserted, to avoid pre-empting the IUIS campaign in PRs #10106 and #10477, both of which deliberately left RAC2 unclassified. Validation: schema pass, term validation pass, 62/62 snippets verified, check-entity-refs / check-causal-targets / check-duplicate-keys / check-enum-values clean.

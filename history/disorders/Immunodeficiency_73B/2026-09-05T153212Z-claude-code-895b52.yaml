  summary: 'Fix: wrong reference_title for PMID:15528331'
  details: |
    CI round 1. check_reference_titles (run with --against-ref origin/main, where grandfathering is off) caught that PMID:15528331 was given the title 'Nonredundant role of Rac2 in Fc gamma receptor-mediated phagocytosis and NADPH oxidase activity in macrophages.' The cached frontmatter title is 'Rac2-deficient murine macrophages have selective defects in superoxide production and phagocytosis of opsonized particles.' Similarity 0.30. Both occurrences corrected to the cached title, in animal_models[1].evidence[0].reference_title and references[7].title. The snippet quoted from that reference was and remains exact and verified, which is the point of the gate: a verified snippet does not vouch for the citation title written beside it. The title I supplied was an accurate paraphrase of what the paper reports rather than a transcription of its title, which is precisely the failure mode a similarity threshold catches and a snippet check cannot. 62/62 snippets still verified; schema, terms and all offline gates re-run clean.

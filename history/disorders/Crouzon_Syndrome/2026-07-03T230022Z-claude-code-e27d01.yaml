  summary: Reference-title backfill, evidence re-verification, and full-text enrichment
  details: |
    Backfilled reference titles on all previously untitled references including PMID 1633640 PMID 29085273 the SUPPORT and variant instances of PMID 8528214 the DOI 10.1002 dvdy.22314 mouse model and every ORPHA 207 phenotype and downstream row. Re-verified every existing snippet as an exact whitespace-normalized substring of its cached source and confirmed each genuinely supports its claim. Added a SUPPORT inheritance evidence item from PMID 29085273 for autosomal dominant inheritance with complete penetrance and variable expressivity. Added a MODEL_ORGANISM evidence item from the codon 290 W290R mouse DOI 10.1002 dvdy.22314 documenting constitutive ligand-independent FGFR2 activation on the gain-of-function node. Added three ORPHA-supported phenotypes Brachycephaly frequent Hydrocephalus occasional and Convex nasal ridge beaked nose occasional. Deliberately excluded acanthosis nigricans and other FGFR3-linked features that Orphanet lists under ORPHA 207 to avoid conflation with the distinct Crouzon with acanthosis nigricans FGFR3 Ala391Glu entity.

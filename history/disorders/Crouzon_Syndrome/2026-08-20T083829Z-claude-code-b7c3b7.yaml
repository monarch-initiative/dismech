  summary: 'Review: add optic-nerve phenotypes from the 2026 cranial-nerve systematic
    review'
  details: |
    Added Papilledema (HP:0001085) and Optic atrophy (HP:0000648) from a 2026 systematic review of cranial-nerve involvement in craniosynostosis (PMID:42091709). Optic nerve involvement was the only cranial nerve with enough published data to analyse statistically (140 patients across 44 papers), and Crouzon syndrome was the most frequently named underlying syndrome among the 68 patients whose syndrome was specified (27/68, 39.7%). Visual function was reduced in 65 of the 140 and normal in only 9, which is the argument for scheduled pressure and visual surveillance rather than symptom-triggered assessment.

    Curated with the authors' own caveat quoted as PARTIAL evidence: this is a case-series literature that the review describes as under-investigated, so these are not frequency estimates and no frequency band was assigned.


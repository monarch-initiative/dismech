  summary: 'Review: X-linked Dystonia-Parkinsonism'
  details: |
    Completed a claim-by-claim REVIEW of the XDP entry against cached primary literature, GeneReviews, a recent cohort-focused review, the existing Falcon synthesis, Monarch D2P audit output, current ClinicalTrials.gov cache records, and GEO discovery. Recalibrated the disease course to the >80% focal-dystonia-first pattern with a 14% parkinsonism-first minority; added numeric Panay prevalence, aspiration pneumonia and weight loss without unsupported frequency tags, and molecular-confirmation context. Rebuilt the mechanism graph to distinguish rescue-supported SVA-to-TAF1 dysregulation from the emerging hexamer-repeat-RNA/R-loop neurodegeneration route; all five pathophysiology edges carry evidence, the two symptom-producing edges are explicitly hypothesis-scoped, and the graph has 30 nodes, 19 total graph edges, zero integrity issues, and zero orphan targets. Added five evidence-backed human cellular models, three directly relevant GEO datasets, swallowing/mobility support, and three registered studies while avoiding efficacy or status claims not present in cached text. D2P suggestions were treated as leads: five externally listed phenotypes and frequency assertions were not imported without exact local evidence, and unsupported causal arrows were not added merely to raise connectivity. Validation passed schema, ontology terms, reference cache contracts, graph integrity, and 71/71 exact snippets; target-focused dataset metadata was independently verified with scripts/discover_datasets.py.

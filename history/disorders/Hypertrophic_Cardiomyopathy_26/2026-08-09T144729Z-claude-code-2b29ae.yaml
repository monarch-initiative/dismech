  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #7831, plus a merge of origin/main to clear cache-CSV conflicts.

    Blocking fix (reviewer IMPORTANT item 1): the Left Ventricular Hypertrabeculation phenotype was bound to HP:0030682 "Left ventricular noncompaction". The source (PMID:35952944) reports "left ventricular hypertrabeculation (saw-tooth appearance)" only and never uses the word noncompaction; the HPO definition of LVNC additionally requires deep intertrabecular recesses and a thin compacted layer, the latter contradicting the thick-walled hypertrophic phenotype this entry models. Rebound to HP:0031194 "Increased density of left ventricular trabeculae", an HP:0031192 sibling of HP:0030682 that asserts only what the source reports; the label was confirmed against OLS. HP:0031195 (apical hypertrabeculation) was not used because the source does not localize the finding. The evidence explanation was rewritten to state why the less committal term is correct, rather than describing LVNC as the closest available binding.

    Non-blocking fix (reviewer suggestion 2): added an evidence item to the Genetic Testing diagnosis node recording the FLNC pseudogene sequencing hazard, quoted from PMID:39132495 (already in the entry's reference set) - the pseudogene lies 53.6kb downstream and exons 46-48 are 98% homologous, making short-read calls in that region ambiguous. Classified evidence_source OTHER because the source is an expert-panel reappraisal document, not a primary study. The node description was extended from two interpretive rules to three.

    Reviewer suggestions 3-5 (a definitions[] PHENOTYPE_ALGORITHM for the ECG-first case-finding rule; optional ventricular-arrhythmia and atrial-fibrillation phenotypes with associated treatments; a z_disc_proteostasis_aggregation module) were not taken here. The reviewer marked all three as non-blocking, and the phenotype/treatment additions in particular would require missense-arm evidence the entry does not have - the available quantitative figures come from the truncating cohort, which this entry deliberately refuses to import. The module remains a follow-up.

    Merge rather than rebase: the branch is authored by another contributor and must not be force-pushed, so origin/main was merged in. Conflicts were confined to five cache CSVs and were resolved as the union of both sides followed by normalize-cache; the resulting diff against main is 12 additive lines across six cache files with zero deletions.

    Validation after the changes: validate PASS, validate-terms PASS, validate-disorders PASS (schema, terms and references batched - the CI-equivalent sweep), snippets 96/102 verified against cached references with 6 skipped by prefix (the pre-existing DOI-cited Agarwal 2021 items), and the 5932 selected tests/test_data.py cases pass.

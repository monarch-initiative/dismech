  summary: 'Create: Hypertrophic Cardiomyopathy 26 (FLNC)'
  details: |
    New entry for MONDO:0014883 (hypertrophic cardiomyopathy 26 / CMH26 / OMIM 617047 / FLNC, hgnc:3756), the non-truncating FLNC arm of cardiac filaminopathy.

    DEEP-RESEARCH PROVIDER SUBSTITUTION. The brief specified falcon, but falcon is unavailable in this environment: neither EDISON_API_KEY nor FUTUREHOUSE_API_KEY is set and deep-research-client reported "Provider 'falcon' not available. Available: claude_code". The claude_code provider was substituted (research/Hypertrophic_Cardiomyopathy_26-deep-research-claude_code.md; 871s, 20 web searches, 53 turns, 23 citations). DR output was treated as leads only.

    NEC PREFLIGHT. MONDO:0014883 was pulled with OAK before any DR content was used: the definition names FLNC, the xref is OMIM:617047, and the synonyms include CMH26 and (notably) "cardiomyopathy, familial restrictive 5". The DR report names FLNC 128 times versus MYH7/MYBPC3 four times each and asserts OMIM 617047, so it passed the gene, OMIM and synonym checks. One DR claim was rejected on verification: the report asserted that ClinGen classifies FLNC (non-LOF) as Definitive for HCM. The ClinGen gene-validity download contains only two FLNC assertions - myofibrillar myopathy (Definitive, assertion d61672a0) and dilated cardiomyopathy (Definitive, assertion edb5197f) - and no FLNC row at all in the hypertrophic cardiomyopathy gene list. No CGGV evidence row is therefore cited for the HCM relationship. Following that lead further into the ClinGen HCM reappraisal preprint (PMID:39132495) established the accurate position, which is now curated: the Hereditary Cardiovascular Disease GCEP re-curated FLNC as one of three genes for HCM-like phenotypes presenting as isolated LVH, restricted the curation to non-loss-of-function variants, retained a Definitive classification (8.1 genetic + 6 experimental = 14.1 points), and assigned it to the disease entity myofibrillar myopathy with LVH and RCM as associated features rather than to a standalone hypertrophic entity. That is a substantive argument against CMH26 as a separate entity; the entry keeps the MONDO-anchored node but records the disagreement openly in the flnc_missense_hcm_pathogenicity_contested discussion and in notes.

    GENOTYPE-PHENOTYPE DISCIPLINE (the central requirement). The truncating-versus-missense split is captured with its own cited evidence in four places: the genetic[].features text; four evidence items on the genetic entry (PMID:34535832 "Truncated FLNC is enriched in dilated cardiomyopathy and arrhythmogenic right ventricular cardiomyopathy. Non-truncated FLNC is enriched in hypertrophic cardiomyopathy and restrictive cardiomyopathy"; PMID:32112656 for both arms plus the ROD2 missense clustering; PMID:27908349 "Truncating FLNC mutations were absent in patients with other phenotypes, including 1,078 patients with hypertrophic cardiomyopathy"; PMID:41672210 "Pathogenic FLNC variants in patients with HCM/RCM are nontruncating"); a negative-control evidence item on the aggregation pathophysiology node (PMID:27908349, no filamin C aggregates in truncating carriers); and a dedicated differential-diagnosis entry for FLNC truncating dilated / left-dominant arrhythmogenic cardiomyopathy. Every other claim is sourced to a hypertrophic or restrictive study; DCM, ARVC and MFM papers appear only where the contrast itself is the claim.

    MECHANISM FRAMING. Modelled as a Z-disc / protein-quality lesion, not a thick- or thin-filament contractile lesion: filamin C actin cross-linking and Z-disc targeting (PMID:32295012), misfolding and failed dimerization producing aggregates (PMID:25351925, PMID:26666891, PMID:32112656), lysosomal and autophagic accumulation in an isogenic hiPSC-cardiomyocyte series (DOI:10.1161/CIRCRESAHA.120.317076), then sarcomere disarray, extracellular matrix remodeling, hypertrophy without hypercontractility, diastolic dysfunction, arrhythmia and heart failure. Four nodes declare conformance to cardiomyopathy_maladaptive_remodeling (Primary Cardiomyocyte Insult, Ventricular Remodeling, Progressive Contractile Dysfunction, Structural Cardiac Impairment and Heart Failure). Three mechanistic_hypotheses are recorded: CANONICAL non-truncating aggregation, ALTERNATIVE convergent proteotoxicity across variant classes, and an EMERGING ROD2 non-aggregating signaling arm.

    BALANCE. PMID:30411535 (540 HCM patients, FLNC variants at 7.2% versus 4.2% in controls, no excess mortality, poor pedigree segregation) is curated as a REFUTE item against the sudden-death claim and as PARTIAL on the case fraction, and drives an OPEN CONTROVERSY discussion.

    SCOPE AND NON-DUPLICATION. Arrhythmogenic_Right_Ventricular_Cardiomyopathy and DSP_Cardiomyopathy were checked on origin/main and contain no FLNC content, so the truncating arrhythmogenic arm is cross-referenced through differential_diagnoses rather than duplicated. Myofibrillar_Myopathy (FLNC/MFM5), Dilated_Cardiomyopathy (FLNC gene node and ClinGen FLNC-DCM assertion) and Dilated_Cardiomyopathy_1AA are likewise cross-referenced. The umbrella Hypertrophic_Cardiomyopathy entry was not edited. The duplicate preflight was re-run against freshly fetched origin/main (2413d9ff45): no MONDO:0014883, no parent MONDO:0024573, no CMH26 anywhere in kb/, and no prior PR or issue.

    GENEREVIEWS. A PubMed search for a GeneReviews chapter covering FLNC or CMH26 returned only PMID:20301672, the retired Myofibrillar Myopathy chapter. No current GeneReviews chapter exists for FLNC-related cardiomyopathy, so no GeneReviews phenotype baseline was applied.

    PRE-PR RED-TEAM REVIEW. A fresh-context subagent reviewed the draft against the dismech-pr-review checklist before any commit. It confirmed snippet integrity, the NEC preflight, internal consistency and non-duplication, and raised one CRITICAL and seven IMPORTANT findings, all of which were addressed: (1) the ClinGen statement was materially wrong and is now corrected and cited (PMID:39132495, two evidence items on the controversy discussion plus a rewritten notes paragraph acknowledging that dismech splits where ClinGen lumps); (2) Agarwal 2021 is deliberately cited by DOI rather than PMID:34405687 because the PubMed record carries only a graphical abstract and the PMID cache holds no quotable text - documented in notes, and all six DOI-prefixed snippets were verified by hand since the validator skips that prefix; (3) the truncating negative-control evidence item was downgraded from SUPPORT to PARTIAL for consistency with the other contrast citations; (4) the de novo claim in the inheritance description was quantified and given two evidence items (PMID:35952944, PMID:41672210); (5) two treatments were added - symptom-directed heart failure and antianginal pharmacotherapy, and a Cardiac Myosin Inhibition entry that exists specifically to record that mavacamten's mechanistic premise fails here, curated with supports REFUTE on the without-hypercontractility snippet; (6) a HUMAN_MODEL_MISMATCH discussion was added recording that every published Flnc mouse model is loss-of-function and reproduces the dilated arm (PMID:35055055 inducible cardiac knockout gives DCM; PMID:36706168 global and cardiomyocyte knockouts die in utero from myocardial rupture), so no in vivo model of the hypertrophic arm exists; (7) a mixed-source PMID:25351925 snippet was split into HUMAN_CLINICAL and IN_VITRO items; (8) the previously unwired flnc_convergent_proteotoxicity hypothesis is now attached to the aggregation-to-disarray edge, which was also downgraded to INDIRECT_UNKNOWN_INTERMEDIATES because sarcomere assembly was preserved in the heterozygous iPSC-CM lines. Minor findings addressed: quotation marks restored in three PMID:41672210 snippets; the domain-clustering claim narrowed to ROD2, the only clustering the sources support; repeat-24 dimerization sourced (PMID:32295012); beta-1 integrin coupling sourced to PMID:36706168 as MODEL_ORGANISM; unsourced editorialising removed from the arrhythmogenesis and extracellular-matrix node descriptions; the skeletal-myopathy-absence item changed from PARTIAL to REFUTE; the rat H9c2 line disclosed in the cell-model entry; heart transplantation retagged SURGERY; cardiac MRI added to diagnosis; eight missing references added to the top-level block. Two findings were deliberately not actioned and are disclosed in notes: no node conforms to the module's Neurohormonal Activation step (no FLNC-specific evidence for it), and no biochemical section was added (no FLNC-specific biomarker).

    VALIDATION. just validate, just validate-references and just validate-terms all pass. 95 of 101 snippets are machine-verified against cached references; the 6 skipped items are all uses of the DOI-prefixed Agarwal reference, and every one was independently verified in-script as a whitespace-normalized substring of its cache file (a full re-verification of all 101 snippets found zero mismatches). just check-snippet-length reports no new short snippets. Compliance is 89.1 percent (weighted 89.4). tests/test_data.py passes for this file; the single whole-suite failure, in Adrenal_Cortex_Adenoma.yaml, is pre-existing on origin/main and untouched here.

    COMMIT HYGIENE. Running the validators locally rewrites reference_id quoting in roughly 7,600 unrelated references_cache files. Those were restored with git restore before staging, and only this entry's own new cache files were added by explicit path.

    ENVIRONMENT. The repo default venv resolves to Python 3.14, which breaks oaklib/runoak via pyhornedowl; a Python 3.13 venv (uv venv -p 3.13 && uv sync) was used for all OAK and validator runs.

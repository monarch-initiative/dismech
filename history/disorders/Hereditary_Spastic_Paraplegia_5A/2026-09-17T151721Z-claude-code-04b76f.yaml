  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #12042 in a single push, per the repo's dismiss_stale_reviews discipline.

    Blocking items taken:
    1. HP:0002352 Leukoencephalopathy replaced with HP:0030890 Hyperintensity of cerebral white matter on MRI. The reviewer is right that leukoencephalopathy is a diffuse white-matter disease concept while the quoted snippet reports a focal MRI signal finding; HP:0030890 is an exact match for the preferred_term already written.
    2. CL:0000598 pyramidal neuron replaced with CL:0010012 cerebral cortex neuron. The cited toxicity experiment was in cortical neurons generally, so the pyramidal binding asserted more than the evidence does.
    3. Added a diagnosis section with three entries - CYP7B1 sequencing, plasma and CSF oxysterol quantification, and brain MRI/MR spectroscopy - using references already in the file. This surfaced content that had been under-consumed: PMID:24117163's MR spectroscopy result is the subject of its own title and was previously cited only for a generic gene-disease statement. Its elevated myo-inositol/creatine ratio in two of four patients, one with a normal conventional MRI, is now recorded with the authors' own 'may be indicative' hedge quoted rather than strengthened.
    4. Pes cavus NOT added; a negative search is recorded in notes instead, which the reviewer offered as an acceptable outcome. The report's source is Orphanet 100986 and no references_cache/ORPHA_1009*.md exists. The documented route fails at the first step: just refresh-orphadata aborts because the committed sha256 in data/orphadata/MANIFEST.yaml no longer matches the unversioned upstream URL, and recovering it with --repin would regenerate the whole ORPHA cache - thousands of files of churn that must not ride on a curation PR. PubMed searches for pes cavus with SPG5, CYP7B1 and hereditary spastic paraplegia type 5 return nothing about this disease, and none of the six cached references for this entry contains the string.

    Optional items taken:
    - HP:0001347 Hyperreflexia replaced with HP:0002395 Lower limb hyperreflexia, which is literally the preferred_term string.
    - Variant classes extended with c.509delT (p.L170fs) and c.945_947dupGGC (p.A316AA) plus their evidence item. Notably these came from the cached PMID:24117163 abstract rather than from the deep-research report, which is what the reviewer's own warning about confabulated deep-research PMIDs called for.

    Optional item declined with reasoning: the disconnected Optic atrophy node stays disconnected. The reviewer agreed it is very likely correct - single-case complicated-phenotype feature with no established mechanism - and adding an edge to clear a report is worse than no edge.

    One schema discovery worth recording: Diagnosis.markers has range string, not a descriptor list, so ontology-bound markers cannot be attached there. The oxysterols are named in prose on the diagnosis entry and remain bound as descriptors in the biochemical section.

    Validation after fixes: just validate passed; 36/36 snippets verified (up from 30/30); just validate-terms passed; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms all OK; list-gene-term-mismatches 0 findings; 5 of 6 phenotypes causally connected.

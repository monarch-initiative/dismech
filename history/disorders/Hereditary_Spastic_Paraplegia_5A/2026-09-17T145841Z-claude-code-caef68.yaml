  summary: 'Create: Hereditary Spastic Paraplegia 5A (CYP7B1)'
  details: |
    De-novo curation of SPG5A (MONDO:0010047), biallelic CYP7B1 variants, from a Perplexity sonar-deep-research run (research/Hereditary_Spastic_Paraplegia_5A-deep-research-perplexity.md, 393s, 20 citations).

    The run's term and reference validation aborted mid-way on an EBI read timeout while resolving MeSH:C564811, so the report was written without its validation sections and they were retro-fitted afterwards with just validate-research-reference and just validate-research-terms. The retro-fitted Term Validation section is the worst of the five runs in this batch: 16 of 46 named terms resolve to a different term than the report calls them, including CL:0002392 offered as 'pyramidal neuron' (CL: obsolete plant spore), UBERON:0002446 offered as 'cerebral white matter' (UBERON: patella), HP:0001251 offered as 'Spastic paraplegia' (HP: Ataxia) and GO:0030425 offered as 'axon degeneration' (GO: dendrite). No CURIE was taken from the report. Every term here was looked up against OLS in the step it was written; hgnc:2652 was read from the repository's own cache/hgnc/terms.csv.

    References sourced independently via PubMed esearch: PMID:19812052 (Schüle/Björkhem, oxysterol accumulation magnitudes by compartment and the mouse model comparison), PMID:29126212 (Schöls Brain 2017: natural history, biomarker correlation, human cortical neuron toxicity, and the atorvastatin RCT), PMID:19439420 (Goizet, allelic spectrum, R417 hot spot, series yield, white matter hyperintensities), PMID:18855023 (non-consanguineous cases, compound heterozygosity, optic atrophy), PMID:24117163 (SPG5A named, MRS), PMID:20301682 (GeneReviews Uncomplicated (Pure) HSP Overview).

    Curation judgements worth recording. There is no GeneReviews chapter for SPG5 itself; the Pure HSP Overview covers the class and is tagged GeneReviews in the references block with the scope difference stated in notes, because just check-genereviews correctly reports NO_CHAPTER against the entry's own names. The Cyp7b1 knockout mouse is recorded as FAILS_TO_RECAPITULATE with two evidence items: the negative neurological phenotype, and the 20%-of-patient-level plasma figure that explains why the negative result does not refute the oxysterol hypothesis - without the second the model reads as evidence against the mechanism. That ambiguity is also filed as a HUMAN_MODEL_MISMATCH discussion. The atorvastatin trial is deliberately not presented as therapy: a second evidence item quotes the non-significant CSF reduction so the qualification travels with the claim, and a KNOWLEDGE_GAP records the missing central target engagement. The prevalence record uses measure_type UNKNOWN with no rate, because the only numbers available (7.3% of 82 AR HSP families, 3.3% of 90 sporadic) are yields in referred series and not population rates. 27-hydroxycholesterol is bound to CHEBI:17703, whose canonical label is 26-hydroxycholesterol - the same molecule under IUPAC numbering - with the clinical name kept in preferred_term and a note warning against 'correcting' either.

    One validation repair worth recording: the atorvastatin effect-size snippet initially failed because the reference validator strips bracketed spans before matching and the sentence contains '[interquartile range (IQR) 683-1113]' mid-quote. The snippet was shortened to stop before the bracket, with the full figures moved into the explanation and the treatment description rather than dropped.

    The atorvastatin trial is keyed on its EudraCT number. just ictrp-fetch 2015-000978-35 returns no ICTRP record for that identifier, so no ICTRP evidence item could be attached and the trial is evidenced from the publication instead; this is recorded in the clinical trial's notes rather than left implicit.

    Validation: just validate passed; 30/30 snippets verified against cached references; just validate-terms passed; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-snippet-length all OK; 5 of 6 phenotypes causally connected (83.3%).

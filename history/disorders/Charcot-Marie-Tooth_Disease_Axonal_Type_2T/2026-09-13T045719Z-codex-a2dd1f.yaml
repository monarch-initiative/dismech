  summary: Review CMT2T phenotype evidence and causal attribution
  details: |
    Reviewed all 16 original phenotypes on evidence, HPO specificity and causal explanation, plus full Falcon and primary clinical/functional source context. Corrected mixed-cohort frequency and onset generalizations, restored the biallelic late-life dementia case with unresolved attribution and preserved person-scoped negative cognition/PET observations. Added case-scoped neurological, muscular, renal and electrophysiological findings; separated NCS/EMG and circulating protein readouts from causation. Preserved qualified neprilysin/Schwann-axon and nociceptive hypotheses, added established neurogenic motor/sensory consequences and qualified foot-deformity routes, and retained precise causal-attribution gaps. Distinguished patient nerve/RNA observations, recombinant activity/NMD experiments, sequence predictions and young versus aged mouse results; revised diagnostic-yield and management limitations. Source titles are exact fetched metadata, including full-text repository URLs. Existing history preserved. General CMT GeneReviews was additionally mined for clinical sensory findings, family/genetic diagnosis, orthotic and preventive care, and conditional Mendelian/reproductive counseling, without transferring broad onset, frequency, or universally asymptomatic-carrier assumptions.

  summary: 'Create: Charcot-Marie-Tooth disease, axonal, type 2T'
  details: |
    De-novo creation of the CMT2T (MME / neprilysin) entry from stubs/.

    Ontology identity correction. The stub and claim issue name MONDO:0014866. That
    term is OBSOLETE in the MONDO release the term validator uses (OLS) and is
    replaced by MONDO:0044640 "Charcot-Marie-Tooth disease type 2T"; the entry uses
    the replacement. The obsoletion is substantive, not cosmetic: MONDO:0014866
    carried both OMIM:616233 and OMIM:617017, listed DNAJB2 synonyms, and named MME
    as its causal gene - it conflated two distinct gene-disease pairs sharing the
    label CMT2T. MONDO:0044640 carries only OMIM:617017 and the MME synonyms.

    Tooling observation recorded here because it is reproducible: the local
    sqlite:obo:mondo build still had MONDO:0014866 active with the DNAJB2 synonyms,
    while OLS had it obsolete - the two adapters disagreed, and the stub queue was
    built from the older view. In the same older build MONDO:0044640 exists only as
    an Orphanet-derived shell with no OMIM xref and no RO:0004003 causal gene, which
    is why just preflight-dr returns SKIP against the correct current term.

    Deep research: falcon report NEC-checked. Against MONDO:0044640 the automated
    check returns SKIP (no causal gene in the local build). Against the older
    MONDO:0014866 the same report returns PASS with MME = 39 mentions and no rival
    gene. Manual preflight per the SKIP path: the current MONDO:0044640 definition
    names MME, its OMIM xref is 617017, the report cites no conflicting OMIM ID, and
    DNAJB2 does not appear among the report's genes at all - so the report is about
    the intended entity. Its own reference_validation reported 6/6 resolved, 0
    unresolved. Used as a lead source only; every curated PMID fetched independently
    and every snippet checked against cached text.

    Pathograph: 6 nodes, 6 edges, single root, all nodes reachable from the root
    (measured). MME loss of function -> neprilysin deficiency in peripheral nerve ->
    loss of peptidase activity at myelin-associated compartments -> length-dependent
    axonal degeneration -> late-onset axonal sensorimotor polyneuropathy, with a
    parallel branch to a predisposition to superimposed inflammatory demyelinating
    neuropathy. Conformance declared to three peripheral_axonal_degeneration nodes.

    Contested inheritance curated as contested. Two Inheritance blocks are recorded -
    autosomal recessive (the defining Higuchi series, plus independent recessive
    families) and autosomal dominant with age-related incomplete penetrance
    (Auer-Grumbach; corroborated by a 230-patient cohort where dominant transmission
    was commoner). The trigger node's genetic_context deliberately leaves zygosity
    UNSET, because setting it would encode one side of an unresolved question. A
    third possibility from the 2024 Italian series - that heterozygous variants are a
    susceptibility factor rather than a monogenic cause - is curated as PARTIAL
    evidence and elaborated in a KNOWLEDGE_GAP discussion, together with that
    series' ACMG breakdown (10 of 32 variants VUS, 1 likely benign).

    Mechanism honesty. The node connecting neprilysin loss to axonal degeneration is
    marked HYPOTHETICAL and its outgoing edge typed INDIRECT_UNKNOWN_INTERMEDIATES,
    because the cited authors state plainly that the pathophysiology of the
    neuropathy is unknown. The two obvious candidate mechanisms are curated as
    refuted rather than omitted: beta-amyloid accumulation is excluded by the absence
    of dementia and of PET amyloid in patients (REFUTE evidence from two independent
    cohorts, curated as an EXCLUDED phenotype), and a remyelination role is excluded
    in the MME knockout mouse (two FAILS_TO_RECAPITULATE model links).

    The feto-maternal alloimmunisation route to antenatal membranous nephropathy is
    recorded in a discussion with its screening and pharmacovigilance implications
    rather than as a pathophysiology node, because the disease it causes occurs in
    the patient's offspring and is immune mediated.

    Validation run in the worktree: just validate -> all validations passed;
    just count-verified-snippets -> 56/56 verified against cached references;
    just validate-terms -> passed; just validate-disorders run once before the PR. A
    reference_title audit script confirmed all 10 cited reference_title values
    byte-match the title: line in their cache frontmatter.

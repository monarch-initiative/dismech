  summary: Link the four clinical contexts, routing pregnancy to rupture
  details: |
    Backfill for issue #8085. Portal hypertension is TRIGGERS with DIRECT into the node named for the hyperkinetic splenic flow it produces, so exposure and node are the same claim seen from either end; its stronger item proposes that hyperkinetic state as the route rather than reporting incidence. The liver transplantation context is graded below it into the same node, because its evidence is really about portal hypertension rather than about transplantation: within a transplant series, aneurysms were found in 16 percent of patients with portal hypertension and in none without it, so the transplant setting is where the observation was made and not what it is of. Essential hypertension is pointed at arterial wall remodeling instead, because the whole interest of that exposure is that it operates in patients without portal hypertension, by a systemic pressure route rather than a splanchnic flow one; its cohort is twelve patients, hence PARTIAL. Pregnancy is the link where the evidence forced the target. It points at aneurysm rupture rather than at the pregnancy-stress node this entry also carries, because neither cited sentence establishes that pregnancy causes an aneurysm to form: one reports mortality after rupture, and the other attributes the fourfold female preponderance to incidental findings coinciding with obstetric ultrasonography, which is ascertainment rather than risk. That second sentence is carried on the link deliberately, as the bound on the exposure. Validated with linkml-validate and just validate-terms.

  summary: 'Gene-family review: ABCC8, KCNJ11, GLUD1, HADH, HNF1A, HK1'
  details: |
    K-ATP: the loss-of-function node bound only Kir6.2's channel activity although it carries both subunit genes; it now also binds SUR1's potassium channel regulator activity (DECREASED). The ABCC8 record, previously named for both genes, is renamed ABCC8 variants (HHF1); its and KCNJ11's inheritance blocks now bind HP:0000007 and add HP:0000006 for the dominant forms (PMID:25733449). GLUD1's AD block now binds HP:0000006. HADH: ClinGen's Definitive AR classification is copied onto the SCHAD-HI record; ClinGen filed it under MONDO:0009278, now obsolete and replaced by MONDO:0012382, this entry's SCHAD-HI subtype term. HNF1A: the HNF4A/HNF1A-HI subtype named HNF1A without a genetic record; one is added, typed UNKNOWN because HNF1A hyperinsulinism rests on five patients in a multicentre cohort and has no ClinGen classification (PMID:35089870). HK1: absent from this entry although non-coding HK1 regulatory variants are an established cause of isolated hyperinsulinism (14 de novo variants in the discovery study, PMID:36333503; 89 of 1761 genetically unsolved probands, PMID:40033430; one proband in the Norwegian cohort already cited here, PMID:38963811). Added a CAUSATIVE AD record and a node, Loss of Beta-Cell Hexokinase 1 Silencing, binding hexokinase activity as INCREASED (ectopic expression of a normally silenced gene), wired to the shared secretion node. MONDO's HHF8 (MONDO:0859362) is SLC25A36, not HK1, so no HK1 subtype row was added.

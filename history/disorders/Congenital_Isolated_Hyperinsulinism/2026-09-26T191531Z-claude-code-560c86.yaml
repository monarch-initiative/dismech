  details: |
    Genetics pass for issue #12263. This entry was the unbound-rows case rather than the over-broad-anchor case: it already carried six has_subtypes rows naming the right diseases, and not one had a bound subtype_term, no row carried genes or inheritance, and no genetic record carried a reciprocal subtype key. So the coverage comparison could not see coverage that was already present in prose. Bound five subtype terms, added the EIHI row for SLC16A1 against MONDO:0012396, took the genetic section from three records to seven, and gave all seven a reciprocal subtype foreign key. Nine of ten subtype-gene pairs are now WIRED_DIRECT. HNF1A on the HNF4A/HNF1A-HI row remains unwired: wiring it needs a source establishing which mechanism node it acts at, and none of the references cited by this entry states that, so it is left for a pass that can research it rather than wired on inference. The curating subagent hit a session limit partway through this issue, having completed this entry and fetched three Moyamoya_Disease references without writing any Moyamoya content; those three caches were deliberately not committed, since an uncited reference cache should not be, and the PMIDs are named in the pull request body so the follow-up need not re-fetch them. Four of the issue's five parents are untouched and itemised there.

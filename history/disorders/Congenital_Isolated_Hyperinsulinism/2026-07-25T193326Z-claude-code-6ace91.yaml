  summary: 'Review: pancreatectomy evidence mismatch, deprecated percentage field'
  details: |
    Correctness review of a generally high-quality entry. (1) Near-Total Pancreatectomy cited PMID:35018160 as SUPPORT via a sentence about resecting a FOCAL lesion ('the lesion can be surgically removed allowing complete resolution') - the explanation itself conceded near-total pancreatectomy is only 'the diffuse-disease analog'. The evidence does not support the diffuse-disease claim, nor the stated later diabetes and exocrine-insufficiency risk. Regraded to PARTIAL with the gap stated. (2) Focal Lesionectomy's treatment_term preferred_term read 'pancreatectomy', understating that a lesionectomy is a limited resection; changed to 'focal lesionectomy (limited partial pancreatectomy)' while keeping the MAXO:0001070 binding. (3) Removed the deprecated free-text 'percentage: 1 in 19,400 live births' field - the entry was created after the prevalence migration and the structured rate_per_100000/prevalence_class/notes already carry it.

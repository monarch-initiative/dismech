  summary: Create Arboleda-Tham Syndrome (KAT6A)
  details: |
    New KB entry for Arboleda-Tham syndrome / KAT6A syndrome (MONDO:0014558, gene KAT6A hgnc:13013). NEC preflight confirmed MONDO:0014558 maps to KAT6A/Arboleda-Tham (OMIM:616268), not CDK13. Deep research via falcon (Edison). Primary-literature baseline: the two founding AJHG 2015 papers (PMID:25728775 Arboleda, PMID:25728777 Tham), the 76-patient genotype-phenotype cohort (PMID:30245513 Kennedy 2019), and the KAT6A neuropsychological profile (PMID:38741077 Ng 2024). No dedicated KAT6A GeneReviews chapter exists. Curated a four-node pathophysiology chain (heterozygous KAT6A variant -> allele-dependent NMD -> dysregulated H3K9/H3K18 acetylation and altered p53 signaling -> altered developmental transcriptional programs) with early/late-truncating NMD hypothesis groups; 18 phenotypes with frequency bands and exact-quote evidence; KAT6A causative genetic block; supportive-care, speech-therapy, and cardiac-intervention treatments. All snippets verified as exact substrings of cached abstracts. Validated with just validate (schema+terms+references pass); compliance 99.1%.

  details: |
    Addressed ai4c-reviewer REQUEST_CHANGES on PR #7200 (all IMPORTANT, no CRITICAL). (1) Debundled two pathophysiology nodes: split allele-dependent NMD node into NMD-Mediated KAT6A Haploinsufficiency and NMD-Escaping Dysfunctional KAT6A Protein, each downstream edge tagged with its own hypothesis group; split the acetylation+p53 node into a Dysregulated Histone H3 Acetylation node with a downstream Altered p53 Signaling node. (2) Ontology granularity: dropped the overly broad GO:0018393 internal-peptidyl-lysine-acetylation BP (noted the obsolete H3-specific-BP gap; H3 specificity carried by H3K9/H3K18 molecular functions); repointed the CA3 cell type from CL:0000598 pyramidal neuron to CL:1001571 hippocampal pyramidal neuron. (3) Added a diagnosis section (exome/genome sequencing; baseline cardiac evaluation). (4) Added eight phenotypes from the already-cached PMID:30245513 full text: craniofacial dysmorphism (umbrella), low-set posteriorly rotated ears, hearing impairment, dental anomalies, PDA, PFO, amblyopia, cryptorchidism. (5) Added a Mitochondrial and Bioenergetic Dysfunction node and linked the pantothenate+L-carnitine treatment to it via target_mechanisms RESTORES. (6) Improved pathograph connectivity by linking hypotonia, feeding difficulties, microcephaly, GERD, and constipation to the transcriptional-programs node; resolved a pre-existing dangling Craniofacial Dysmorphism edge. Suggestions: downgraded broad-nasal-tip and thin-upper-lip frequency VERY_FREQUENT->FREQUENT; cardiac treatment term MAXO:0000004->NCIT:C148075 Septal Defect Repair; added a second PMID:38741077 evidence item to the ID phenotype. All new snippets verified as exact substrings of cached abstracts/full text. just validate passes; weighted compliance 98.4 percent.

  summary: 'Phenotype review: Arboleda-Tham_Syndrome'
  details: |
    Campaign phenotype review of all 32 phenotypes against cached sources (95 baseline snippets re-read in whole-paper context; all consistent, no wrong-disease or negation misuse found). One term rebind: Cerebral White Matter Hyperintensities broadened from HP:0040329 (Multifocal hyperintensity...) to HP:0030890 (Hyperintensity of cerebral white matter on MRI) because neither cohort asserts multifocality. Pathograph: added 16 downstream edges from Altered Developmental Transcriptional Programs to the specific congenital/neurobehavioral features the cohorts document (ASD, VSD, PDA, PFO, broad nasal tip, thin tented upper lip, ear anomalies, craniosynostosis, dental anomalies, hearing impairment, strabismus, cryptorchidism, intestinal obstruction incl. malrotation/duodenal web, autistic behavior, sleep disturbance, seizures), all INDIRECT_UNKNOWN_INTERMEDIATES with per-edge cohort evidence; added new provisional node Impaired Hematopoietic Stem Cell Function (mouse KO hematopoiesis failure + cohort blood-cell-line hypothesis, directness INDIRECT) wired to Neutropenia and Aplastic Anemia; added Strabismus->Amblyopia sequelae edge per the cohort's explicit amblyopia-risk statement. Deliberately left unexplained with new KNOWLEDGE_GAP discussions: Recurrent Infections (cohort cautions infections are not necessarily immunodysfunction) and Chiari Malformation + Cerebral White Matter Hyperintensities (2/10 grouped imaging finding, no mechanistic literature). Connectivity 10/32 -> 29/32. Kept HP:0000377 for Low-Set, Posteriorly Rotated Ears (combined HP:0000368 is obsolete; either narrower position term would drop half the claim) and generic HP:0002308 Chiari (type unspecified in one of two sources). All gates pass: validate, 121/121 snippets, terms, duplicate-keys, entity-refs, validate-disorders, snippet-length/title/folded ratchets.

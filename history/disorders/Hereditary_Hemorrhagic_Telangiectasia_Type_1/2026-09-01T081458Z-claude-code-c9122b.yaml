  details: |
    Acted on the non-blocking suggestions in the approving re-review of PR #10351. The PR was already approved; these are corrections and improvements taken on their merits, not blockers.

    Substantive correction. The clinical_burden notes claimed PMID:33407668 reports genotype 'only to compare SMAD4 against ACVRL1 or ENG pooled'. That was false and the reviewer caught it: the cached full text also contains 'There was no significant difference in mortality between patients with ACVRL1 and ENG mutation (p > 0.05)' plus a Table 2 row (HR 1.54, 95% CI 0.70-3.38, p = 0.286). Verified against the cache before changing anything. That null is the single most HHT1-relevant mortality statement in the cited literature, so it is now curated as its own evidence item rather than described as absent, and the notes are rewritten to say what the paper actually reports - including that ENG was the commonest genotype in that cohort (496/886, 56%). The practical reading recorded is that HHT1 carries HHT's mortality burden rather than a distinct one, which is the opposite of the pattern seen for lesion distribution.

    Prevalence band coherence. The record paired rate_per_100000: 10.0 with prevalence_class BAND_1_9_PER_100000, but the repo's own bucketing function (_band_from_rate in scripts/migrate_prevalence.py) sends 10.0 to BAND_1_5_PER_10000, so the two slots disagreed at a boundary. Resolved by expressing the derivation as the range it actually is: rate_low 4.7 / rate_high 10.0, with rate_per_100000 dropped because there is no single point estimate. The bounds are the two cited HHT prevalence inputs halved for the ENG share - 1 in 5,000 (20 per 100,000) gives 10, and the Swedish registry figure of 9.3 per 100,000 gives about 4.7. This also resolves the reviewer's second suggestion without flipping a grade: with the range recorded, the Swedish evidence item anchors the lower bound, so SUPPORT remains correct and REFUTE would now be wrong. The prevalence notes were rewritten because they had come to state the contested-input point twice.

    Diagnosis terms. Added diagnosis_term bindings to all three diagnosis records - NCIT:C15709 Genetic Testing, NCIT:C16525 Echocardiography Test, NCIT:C16809 Magnetic Resonance Imaging - all of which validate against the dynamic enum.

    Causal edge evidence, partially. Two of the twelve uncited downstream edges had a genuinely causal source and now carry edge-level evidence: shunt -> brain abscess (antibiotic prophylaxis conditioned on the presence of shunting, marked INDIRECT) and shunt -> ischemic stroke (PAVM occlusion performed for stroke prevention). The remaining ten were left uncited deliberately. Three are near-identity lesion-to-phenotype edges where a separate citation would only restate the node evidence, and CLAUDE.md's own guidance is that an uncited edge is acceptable but reaching for a node's citation to paper over an unsourceable edge is not. Padding all twelve would have been the worse outcome.

    Not done: a BiomarkerReadout link on the soluble endoglin record, which the reviewer explicitly said is fine to leave for a research-stage marker.

    Validation: just validate-disorders over both changed files passes with 185/185 snippets verified. All offline gates pass. Pathograph re-checked - no broken targets, no unreached phenotypes. All 107 titled evidence items re-audited against their cache files with 0 mismatches.

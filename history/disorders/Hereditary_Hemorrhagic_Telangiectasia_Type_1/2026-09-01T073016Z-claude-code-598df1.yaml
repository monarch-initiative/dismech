  summary: 'Create: Hereditary Hemorrhagic Telangiectasia Type 1 (ENG, MONDO:0008535)'
  details: |
    Created a standalone entry for ENG-related HHT1 (MONDO:0008535), which previously existed only as a has_subtypes record on the parent Hereditary Hemorrhagic Telangiectasia entry. Followed the Hereditary_Hemorrhagic_Telangiectasia_4 precedent: the parent subtype record is kept and cross-referenced, not superseded.

    Deep research: falcon was requested per the curation default but the Edison endpoint returned 403 ProviderAuthError. Rather than substituting a provider by hand, the run was re-issued through the recorded-fallback path (just dr_fallback='--fallback' research-disorder falcon ...). OpenScientist produced the report, which was renamed accordingly to research/Hereditary_Hemorrhagic_Telangiectasia_Type_1-deep-research-openscientist.md and carries fell_back/requested_provider/provider_attempts in frontmatter.

    Report validation was read before use. reference_validation: 44/44 resolved, confabulation_rate 0.0, needs_review true on two off-topic references (PMID:42162269, PMID:42410718) - neither cited. term_validation: only 10 of 22 labels matched; every drug CURIE the report offered names a different drug (NCIT:C47737 given as tranexamic acid is Sulfamethoxazole; NCIT:C72713 as pomalidomide is Azipramine; NCIT:C1794 as thalidomide is Capecitabine; NCIT:C71146 as pazopanib is Salirasib). No CURIE in the entry came from the report; all bindings were taken from the committed caches and OAK.

    just preflight-dr against MONDO:0008535 returned WARN: rival gene KIT mentioned 22 times (42% of ENG), indicating a mixed second entity. Inspection confirmed it: the report's KIT section rests on an Alk1 mouse model (PMID:42579368), its gene-specific-programs claim on a SMAD4/ALK1 study (PMID:42460472), and its variable-expressivity section on PMID:10946360, which is titled for an HHT type 2 kindred. Those sections were excluded. Only two report-sourced references were used, each checked individually against PubMed: PMID:28564608 (endoglin-BMP9 crystal structure, explicitly HHT1) and PMID:39299239 (LOH as a second-hit route, marked INDIRECT since it works at the level of 'an HHT gene').

    A second entity-confusion trap was hit and avoided during independent literature search: PMID:24957885 is a VEGF-neutralization study in an HHT2/Alk1 model and was excluded as HHT1 mechanism evidence despite matching every HHT mouse-model search term. The animal model curated is the Eng+/- mouse (PMID:10562296). Both traps are recorded in the entry's notes as a guardrail.

    GeneReviews baseline: PMID:20301525 fetched, cached and tagged GeneReviews in the top-level references block. Clinical Characteristics items are each represented; GI polyps/juvenile polyposis overlap (SMAD4) and pulmonary arterial hypertension (chiefly ACVRL1/GDF2) are deliberately excluded with the reason recorded in notes. The Agents/Circumstances to Avoid warnings are captured verbatim as a treatment record.

    Content: a 10-node causal chain from the germline ENG truncating variant through endoglin haploinsufficiency, impaired BMP9-ALK1-SMAD1/5/8 signaling and somatic second-hit biallelic inactivation to loss of the intervening capillary bed and the organ-specific lesions; 10 phenotypes carrying the cohort-level HHT1-vs-HHT2 contrast (PAVM 75 vs 44 percent, CAVM 20 vs 0 percent, cerebral abscess 7.5 vs 0.8 percent, GI bleeding 6.5 vs 16.4 percent running the other way); 9 treatments; the Eng+/- mouse with three modeled_mechanisms links including a PARTIALLY_RECAPITULATES with limitations; PATH-HHT (NCT03910244); two diagnosis records; three knowledge gaps; one GEO dataset (GSE197105, included only for its Eng arm after relevance triage rejected the Alk1/Smad4 candidates). Prevalence is recorded as derived, not surveyed, with the derivation stated in the record's own notes.

    Validation: just validate-disorders over both changed files passed with 164/164 snippets verified (89/89 for the new entry after later edits). check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms-online, check-folded-hyphens, check-title-snippets, check-snippet-grading and check-environmental-evidence all pass. just verify-datasets resolves the one accession. Weighted compliance 93.1 percent. Pathograph connectivity was checked programmatically: no broken targets, no orphan nodes, no unreached phenotypes.

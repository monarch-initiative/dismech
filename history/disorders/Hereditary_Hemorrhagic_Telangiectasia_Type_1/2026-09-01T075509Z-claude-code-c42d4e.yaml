  summary: 'Address PR #10351 review: evidence_source fix, cerebral surveillance,
    mortality burden'
  details: |
    Responded to the ai4c-reviewer REQUEST_CHANGES verdict on PR #10351. All three IMPORTANT items were verified against primary sources and fixed.

    IMPORTANT 1 (evidence_source): confirmed by census - PMID:10562296 was graded HUMAN_CLINICAL on the ENG-variant -> haploinsufficiency downstream edge while the same PMID was correctly MODEL_ORGANISM in its seven other uses in the file. It is a mouse study (J Clin Invest, Eng+/- model). Corrected to MODEL_ORGANISM.

    IMPORTANT 2 (GeneReviews surveillance): added a third diagnosis record for cerebral AVM screening by brain MRI with and without contrast in infancy and again by age 18-20, quoting the GeneReviews abstract exactly. The reviewer's point was well made: the entry curates cerebral AVM as the HHT1-distinguishing phenotype (20 percent vs 0 percent) while omitting its screening recommendation.

    IMPORTANT 3 (mortality/prognosis): added a clinical_burden record (burden_level HIGH) and a progression record using the three cached-but-uncited references. PMID:42410718 gives life expectancy 73.0 vs 80.5 years; PMID:33407668 gives the mortality predictors (anemia HR 2.93, GI bleeding HR 2.63, symptomatic liver VMs HR 2.10) and the negative result that brain VMs and pulmonary AVMs were NOT associated with mortality; PMID:29781402 gives causes of death (sepsis 35 percent, cardiac failure 26 percent). The negative result is curated together with the authors' own explanation that it reflects routine screening and pre-emptive treatment at HHT centres, so it cannot be misread as evidence those lesions are harmless. A notes field records that none of the three studies stratifies ENG vs ACVRL1, so the burden is HHT-wide and not an HHT1-specific mortality estimate; PMID:33407668 reports genotype only as SMAD4 against pooled 'ACVRL1 or ENG' on four deaths, which is too coarse to yield an HHT1 figure.

    Note on PMID:42410718: the deep-research report's own reference validation had flagged this as one of two off_topic_references. Per the skill, off-topic is evidence rather than a verdict, so the paper was read before use - it is a Swedish national-register HHT mortality and prevalence study and is squarely on topic. The off-topic flag was wrong here.

    Reviewer suggestions (non-blocking) also addressed: added a Congestive heart failure phenotype (PMID:29781402: 69 percent non-fatal comorbidity; GeneReviews ties refractory high-output failure to hepatic AVMs and liver transplantation) with a sequela edge from Hepatic arteriovenous malformation, which also connects that previously leaf phenotype into the graph; and a biochemical record for soluble endoglin (PMID:25873934), curated explicitly as a research-stage candidate with no threshold, since the source is a biomarker review reporting no diagnostic performance.

    Additional honesty fix found while doing IMPORTANT 3: PMID:42410718 measures HHT prevalence at 9.3 per 100,000, less than half the 1-in-5,000 figure the entry's derived HHT1 prevalence rests on. That caveat and its evidence item were added to the prevalence record rather than left implicit, since taking the registry figure instead would roughly halve the estimate.

    Self-caught defect: the reference_title first written for PMID:42410718 was invented and did not match the cache. All 104 titled evidence items were then audited programmatically against their cache files; 0 mismatches remain.

    Validation: just validate-disorders over both changed files passes with 182/182 snippets verified. check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-folded-hyphens, check-title-snippets, check-snippet-grading and check-snippet-length all pass. Pathograph re-checked programmatically: no broken targets, no unreached phenotypes (11 phenotypes, 10 pathophysiology nodes). Weighted compliance rose from 93.1 to 94.1 percent.

  summary: 'Create: Syndromic_X-linked_Intellectual_Disability_94'
  details: |
    Created the GRIA3 entry for syndromic X-linked intellectual disability 94 (MRXSW, Wu type; MONDO:0010402) from the existing Edison/falcon deep-research report research/Syndromic_X-linked_Intellectual_Disability_94-deep-research-falcon.md. No new deep research was run. just preflight-dr against MONDO:0010402 returned PASS with GRIA3 as the top gene at 24 mentions, confirming the report is about the intended disease. The pathograph branches at the allele rather than merging the two functional classes: GRIA3 Pathogenic Variant splits into GluA3 Loss of Function and GluA3 Gain of Function, each carrying its own genetic_context with the matching functional_impact_category plus a ModifierEnum on the GO:0004971 AMPA glutamate receptor activity term, and the branches drive separate current nodes that produce opposite tone and sleep phenotypes before converging on shared disturbed synaptic transmission and global developmental delay. Curated 7 pathophysiology nodes, 26 phenotypes, 6 variants, 5 treatments, 2 inheritance blocks, 3 animal models, 2 experimental models and 3 discussions. Recorded the genotype-guided carbamazepine response in the functionally confirmed p.Ala615Val gain-of-function case together with a REFUTE evidence item quoting the carbamazepine failure in an untested allele, and a FAILS_TO_RECAPITULATE link for the Gria3 null mouse whose spatial memory is intact. All 13 of the report's citations were DOI-only; each was resolved to a PMID before use, 11 through the PMC ID converter and one (PMID:35031858, the Hamanaka carbamazepine paper) by PubMed title search after the converter returned no record, so no evidence item sits on the DOI prefix that the gating reference validator skips. Two report sources were deliberately not cited and are recorded in the entry notes instead: the BJSTR exon 5-12 deletion prenatal case has no PubMed or PMC record, and the Huang bioRxiv transcriptomics preprint models a schizophrenia-associated allele rather than this disorder. Corrected five ontology CURIEs the report proposed and its own Term Validation section reported clean at 47/47: HP:0002169 was offered as Hyperekplexia but is Clonus (corrected to HP:0002267 Exaggerated startle response), and four stale labels were fixed against the canonical HPO labels for HP:0001252, HP:0002123, HP:0100022 and HP:0002360. ClinicalTrials.gov was queried directly rather than trusted from the report; the only GRIA3 term hit is the unrelated NCT03676569 and a condition search returns nothing, so no clinical_trials block was curated. Validation: just validate passed, just count-verified-snippets reported 103/103 verified, just validate-terms passed, just check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms and check-enum-values all OK on the file, just validate-disorders passed as the final batched gate, and the whole-KB baselines check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence added no new defects. Term and enum caches were normalized and pass check-term-cache-integrity and check-cache-order. Deleted the corresponding curation stub.

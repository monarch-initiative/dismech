  summary: Bind molecular function on gene landing node
  details: |
    Bound a molecular function on the pathophysiology node a wired gene lands on, so the gene-activity grounding gate no longer reports it: "Fatty-Acid Metabolizing Enzyme Defect with Mitochondrial Bioenergetic Failure (SPG28)" gains GO:0004620 glycerophospholipase activity, modifier DECREASED; "Mitochondrial Coenzyme Q10 Headgroup Biosynthesis Defect (SPG83)" gains GO:0050585 4-hydroxymandelate synthase activity, modifier DECREASED; "Nucleocytoplasmic Transport Defect (SPG88)" gains GO:0061608 nuclear import signal receptor activity. The node's own description already states this activity. The term was chosen from the gene product's QuickGO molecular-function annotations with experimental, phylogenetic or curated (non-electronic) evidence, preferring the most specific term the node's text supports; label copied from QuickGO. Validated with linkml-validate and the online term validator.

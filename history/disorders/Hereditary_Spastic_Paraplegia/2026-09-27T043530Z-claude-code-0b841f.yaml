  summary: 'Genetics pass part 2: SPG83 and SPG88 curated, five rows dispositioned'
  details: |
    Part 2 of the genetics-gap pass over the gene-defined spastic-paraplegia diseases the d2g comparison files under this entry's MONDO class (issue #12222; part 1 was #12221/PR #12880). The two row sets are disjoint: 25 MONDO ids in #12221, 7 in #12222, empty intersection.

    The parent anchor was checked in both directions and left alone. MONDO:0019064 hereditary spastic paraplegia is what this umbrella entry models; all seven listed diseases are direct children of it; and every subtype_term already bound on the entry sits inside its subtree, seven directly and five through MONDO:0015149 pure hereditary spastic paraplegia. So the re-nomination mechanism here is unbound rows, not an over-broad anchor.

    Curated as has_subtypes rows with a bound subtype_term, a genes list, an inheritance block, cited evidence and a reciprocal genetic[] record keyed by subtype:

    - SPG83 (MONDO:0033614), HPDL hgnc:28242, autosomal recessive, from PMID:33970200 (25 families, 34 individuals) and PMID:40368591 (three severity classes, genotype correlation).
    - SPG88 (MONDO:0859309), KPNA3 hgnc:6396, autosomal dominant, from PMID:34564892 (8 patients, de novo in 4).

    Both genes reach the pathograph through a new node that conforms_to corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect and feeds the existing length-dependent degeneration node: a coenzyme Q10 headgroup biosynthesis node for HPDL bound to GO:0006744 and GO:0005739, and a nucleocytoplasmic transport node for KPNA3 bound to GO:0006913 with modifier ABNORMAL rather than DECREASED, because the source describes the mutant proteins' deficits as varying between alleles.

    Five rows were declined structurally, with the reasoning recorded in the entry's notes: SPG50 (AP4M1) and SPG82 (PCYT2) to the complex hereditary spastic paraplegia entry; SPG30 (KIF1A) to a future record covering the whole KIF1A spectrum; and the IFIH1 and RNASEH2B pure-HSP classes to Aicardi_Goutieres_Syndrome, where both genes are already bound on their AGS type rows, completing the disposition part 1 began with ADAR.

    PMID:31637422 and PMID:41941559 were added to the top-level references block as the sources of the PCYT2 and KIF1A rulings; the KIF1A GeneReviews chapter is tagged, which moves the entry's check-genereviews status from CITED_UNTAGGED to TAGGED.

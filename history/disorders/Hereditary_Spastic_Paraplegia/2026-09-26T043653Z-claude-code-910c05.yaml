  summary: 'Review round 1: SPG72 recessive inheritance added, REEP2 ER binding sourced'
  details: |
    Review round 1 on PR #12880 (issue #12221).

    Blocking finding, fixed. The SPG72 subtype row recorded autosomal dominant
    inheritance only, and its description justified the omission by saying that the
    cited report evidences only the dominant mode. That was wrong: PMID:28491902's
    abstract states "A closely-related gene, REEP2, is mutated in SPG72, with both
    autosomal and recessive inheritances." The false justification is removed, and an
    Autosomal Recessive block bound to HP:0000007 is added to both the SPG72 subtype
    row and the REEP2 genetic record. The recessive mode is now backed by the original
    REEP2 report, PMID:24388663, whose abstract describes a heterozygous missense
    allele in a dominant family and a missense allele in trans with a splice-site
    allele in a recessive family, and concludes that both modes follow from the nature
    of the alleles. HP:0000007 and its label were read from cache/hp/terms.csv.

    REEP2's binding on the tubular ER-shaping node no longer rests on its similarity
    to REEP1. The reviewer offered a sentence about siRNA-mediated REEP2 depletion in
    COS7 cells; that sentence sits in PMID:28491902's discussion, not its abstract, so
    it would pass just validate-kb-references and fail just validate-disorders, which
    passes --no-full-text. PMID:24388663's abstract carries a stronger claim that is
    inside the abstract: REEP2 belongs to the ER-shaping protein family, and the ER was
    altered in fibroblasts from an affected subject. That is the evidence item added,
    and the node description was updated to match it.

    Declined: renaming the fatty-acid node. Pathograph downstream targets are bare
    names matched verbatim, so a rename silently dangles every edge pointing at the old
    name and renders a phantom node rather than a missing arrow. The node name is not
    wrong, the existing SPG7 node has the same cause-plus-consequence shape, and the
    reviewer marked it non-blocking.

    Taken in passing: the ragged line break in the entry notes was reflowed.

    Validation after the fixes, under linkml-reference-validator 0.3.0rc2 (confirmed
    from .venv/lib/python3.12/site-packages/linkml_reference_validator-0.3.0rc2.dist-info
    after a plain uv sync, which is how CI installs): just validate-disorders 119/119
    snippets and 111/111 titles, 0 issues; validate-terms passed; check-causal-targets
    no new broken targets; check-entity-refs, duplicate-keys, enum-values,
    qualifier-terms, folded-hyphens, snippet-length, title-snippets, snippet-grading,
    coarse-phenotypes, environmental-evidence, case-collisions and
    check-term-cache-integrity all clean; list-gene-term-mismatches 43/43 bindings
    compared against HGNC with 0 findings and 0 uncached; subtype-usage-audit unchanged
    at 15/16 subtypes referenced and 13/14 subtype genes wired; compliance-connectivity
    56.4% against the 50.0 floor. references_cache churn from the validator run
    (dismech#12672, still present in rc2) was reverted before staging.

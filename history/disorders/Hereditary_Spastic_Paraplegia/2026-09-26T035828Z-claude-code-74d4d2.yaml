  summary: 'Genetics pass: 10 gene-defined SPG subtypes, 6 mechanism nodes, 2 DISPUTED
    genes'
  details: |
    Genetics pass for issue #12221 (d2g series-014, part 1): the 25 gene-defined
    spastic-paraplegia diseases MONDO files under MONDO:0019064.

    Anchor check first. The parent's disease_term is MONDO:0019064 hereditary
    spastic paraplegia, and the entry is genuinely that umbrella -- it carries
    Pure HSP and Complex HSP clinical-classification subtype rows and a shared
    corticospinal-tract axonopathy pathograph. So the dismech#12184 over-broad
    anchor pattern does not apply and the anchor was left unchanged.

    Ten gene-defined subtypes added as has_subtypes rows with MONDO-bound
    subtype_term, genes, inheritance and cited evidence: SPG6/NIPA1, SPG8/WASHC5,
    SPG12/RTN2, SPG13/HSPD1, SPG28/DDHD1, SPG31/REEP1, SPG62/ERLIN1, SPG72/REEP2,
    SPG80/UBAP1, SPG87/TMEM63C. Each has a reciprocal genetic[] record carrying the
    subtype foreign key; REEP1 also carries two case_fractions from a 535-patient
    screen (3.0% overall, 8.2% within the pure HSP sub-sample).

    Six pathophysiology nodes added so every new gene reaches the pathograph at the
    mechanism it acts on, rather than as one flat list: tubular ER-shaping protein
    network (RTN2, REEP1, REEP2), mitochondrial chaperonin Hsp60 folding (HSPD1),
    fatty-acid metabolizing enzyme defect with mitochondrial bioenergetic failure
    (DDHD1), endosomal membrane trafficking and sorting (NIPA1, WASHC5, UBAP1),
    mitochondria-ER contact site and organelle morphology (TMEM63C), and the
    erlin-1/erlin-2 complex (ERLIN1). All six conform to
    corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect and feed
    the existing length-dependent degeneration node.

    Two genes recorded as relationship_type DISPUTED instead of as subtypes.
    ZFYVE27 (SPG33): ClinGen's Cerebral Palsy GCEP graded it Disputed in 2023
    because both reported variants are too common in the general population to
    score and the functional evidence on the original allele conflicts. SLC33A1
    (SPG42): the relationship rests on a single pedigree and a 220-patient screen
    of SPAST-negative dominant HSP found no SLC33A1 variants by either mutation
    scanning or dosage analysis.

    Thirteen checklist rows declined structurally, with the routing rule recorded in
    the entry notes: SPG2 (PLP1), SPG21 (Mast syndrome), SPG35 (FA2H), SPG47
    (AP4B1), SPG51 (AP4E1), SPG52 (AP4S1) and SPG56 (CYP2U1) belong to the separate
    complex hereditary spastic paraplegia entry; SPG79A (UCHL1), SPG91 (SPTAN1),
    SPG93 (NFU1), SPG77 (FARS2) and ADAR-related spastic paraplegia belong to
    existing gene-specific entries elsewhere in the knowledge base.

    No phenotype edges were added. This was a genetics pass; wiring a mechanism to a
    clinical feature needs a source for that specific edge, and none of the sources
    consulted here carries one for the new subtypes.

    Validation under linkml-reference-validator 0.3.0rc2 after uv sync --frozen:
    just validate-disorders 113/113 snippets and 105/105 titles, 0 issues;
    just validate-terms passed; list-gene-term-mismatches 43/43 bindings compared

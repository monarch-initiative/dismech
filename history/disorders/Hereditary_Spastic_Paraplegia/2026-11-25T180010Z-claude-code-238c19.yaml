  summary: 'Gene-family review: HPDL'
  details: |
    Reviewed the HPDL (SPG83) record and node. The 4-hydroxymandelate synthase binding (GO:0050585) matches the identification of HPDL as the mitochondrial enzyme making 4-hydroxymandelate for the CoQ10 head group (PMID:34471290). The genetic record gave no variant origin; recorded it as germline. The infantile-onset allelic form, neurodevelopmental disorder with progressive spasticity and brain white matter abnormalities (MONDO:0033613; PMID:32707086, PMID:33188300, PMID:33634263), has no entry and was added to the stub queue.

  summary: 'Gene-family review: COA3'
  details: |
    COA3 genetic record typed UNKNOWN with variant_origin GERMLINE and its recessive inheritance block bound to HP:0000007; the disorder rests on one compound heterozygous patient (PMID:25604084) and ClinGen rates COA3 Limited (AR) only for mitochondrial disease (MONDO:0044970). The COA3 node now binds a molecular function, GO:0044183 protein folding chaperone (DECREASED), described as co-translational stabilization of newly synthesized COX1, with new evidence that hCOA3 stabilizes COX1 co-translationally and promotes its assembly (PMID:23362268); GO also annotates COA3 to this function from direct assay.

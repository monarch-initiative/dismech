  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 29 (TMEM126B)'
  details: |
    New entry for MONDO:0032633, the recessive complex I deficiency caused by biallelic TMEM126B variants, created from its stub (stub deleted). TMEM126B is modelled as an MCIA-complex assembly factor, not a subunit. Its molecular function is bound as GO:0043495 protein-membrane adaptor activity (DECREASED), on the basis of its description as an inner-membrane protein anchoring complex I assembly intermediates (PMID:40970474, BACKGROUND); the node description says its precise biochemical activity is undefined. The chain runs to MCIA failure and stalled membrane-arm (ND2-module) assembly (GO:0032981; PMID:22982022, PMID:32320651, PMID:27374774, PMID:27374773), isolated complex I deficiency in muscle (with a REFUTE item for normal fibroblasts in a p.Gly212Val homozygote), skeletal muscle energy failure, compensatory mitochondrial proliferation and renal tubulointerstitial injury. Phenotypes: the usual pure mitochondrial myopathy (exercise intolerance, exercise-induced myalgia, proximal leg weakness, raised lactate) from the two 2016 cohorts; the infantile multisystem case (hypertrophic cardiomyopathy, renal tubular acidosis, chronic renal failure, failure to thrive); the Leigh-like case with brainstem lesions, gait ataxia and strabismus (PMID:36482121); and adult kidney failure with tubulointerstitial nephritis (PMID:40970474, PMID:41278337). relationship_type CAUSATIVE: ClinGen rates TMEM126B Definitive for mitochondrial disease (lumped MONDO:0044970), recorded in notes only. Treatments: coenzyme Q10 supplementation (uncontrolled), kidney transplantation and renal supportive therapy. Validated: linkml-validate, term validation, reference validation (46/46 snippets, 0 issues), entity-ref, causal-target, name-collision, gene-validity, enum, duplicate-key, coarse-phenotype, folded-hyphen and gene-term checks.

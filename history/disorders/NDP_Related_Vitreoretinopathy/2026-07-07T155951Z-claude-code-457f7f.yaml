  summary: 'Create: NDP-Related Vitreoretinopathy'
  details: |
    New entry for NDP-Related Vitreoretinopathy (MONDO:1040064 -> corrected to MONDO:0700377), the next medium-priority gene target from issue #4008's retinopathy curation follow-up. Norrie disease / NDP was previously only covered as the EVR2 subtype within Familial_Exudative_Vitreoretinopathy.yaml; this entry covers the broader gene-level spectrum per the maintainer-approved guidance's 'NDP special case' -- a separate entry for the full NDP-Related Vitreoretinopathy continuum (Norrie disease as the severe/primary subtype, NDP-related FEVR referenced as the milder branch already modeled in detail in the FEVR entry, to avoid duplicating that content). Primary evidence base: a dedicated GeneReviews chapter (PMID:20301506, 'NDP-Related Retinopathies') used as the mandatory clinical baseline per the skill's Step 3b, plus PMID:37947657 (mechanism review already cited by the sibling FEVR entry, confirming the shared Norrin-FZD4-LRP5-TSPAN12 canonical Wnt pathway), PMID:41862006 (Norrin/FZD4/beta-catenin blood-retinal-barrier review), PMID:35132964 (mouse model study establishing that cochlear microvascular malformation precedes and drives the sensorineural hearing loss extraocular feature -- a genuinely novel mechanistic addition beyond what the FEVR entry covers, since FEVR lacks the extraocular Norrie phenotype), and PMID:28602015 (Indian clinical cohort). Models Norrie disease's distinguishing extraocular features (hearing loss, intellectual disability, seizures) with their own pathophysiology node explaining the parallel cochlear-vascular mechanism. Deep research: first  attempt failed with a transient network ConnectError during long-polling (Edison API); retried. No content in this entry was blocked on the retry succeeding -- built entirely from independently-verified primary literature per the anti-hallucination SOP. Validated: schema, ontology terms (all HP/MONDO/GO/CL/hgnc/MAXO terms verified via OAK, including catching MAXO:0000005 being 'clinical imaging procedure' not 'monitoring' on first pass, corrected to MAXO:0000873 'hearing examination'), and reference/snippet validation all pass cleanly (via scripts/run_reference_validator.sh directly, working around the known Windows fix-references-cache python-shim issue in the just recipe). Compliance: 95.8% global / 97.8% weighted on first pass.

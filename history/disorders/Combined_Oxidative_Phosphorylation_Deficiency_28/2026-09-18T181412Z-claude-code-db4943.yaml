  details: |
    De novo curation of COXPD28 / SLC25A26 deficiency (MONDO:0014775) from an openscientist deep-research report plus independent PubMed work.

    Deep research: just research-disorder openscientist; report committed at research/Combined_Oxidative_Phosphorylation_Deficiency_28-deep-research-openscientist.md. Frontmatter: reference_validation 11/11 verified, confabulation_rate 0.0. quotes_valid 22 of 23, with one quote flagged unsupported against PMID:26522469; that is an ellipsis artifact, not a fabrication - the report elided 'in three families' with a Unicode ellipsis and exact-substring matching correctly failed, and the validator printed the closest source text, which matches. The entry quotes the full unelided sentence. term_validation reports 2 mislabelled terms, both the same table-column parsing artifact seen in the CLIPPERS report: the report's identifier table has the ontology name in the column the parser read as the label, so MONDO:0014775 is 'reported as' MONDO.

    The report materially changed the entry and the change was a correction, not an addition. My first pass modelled SAMC as a SAM importer and the disease as a single depleted-pool bottleneck. SAMC is an antiporter: it imports SAM in exchange for exporting SAH, and PMID:35024855 shows in mouse and fruit fly that preferential impairment of the SAH-export leg underlies a mild adult-onset mitochondrial myopathy, distinct from the severe neonatal disease that SAM-import loss causes. That added a second molecular node (Impaired Matrix SAH Export), an EMERGING mechanistic_hypotheses group for the branch, an animal_models block with a SCALE_EXTRAPOLATION divergence, two adult phenotypes, and a rewritten description. It also changed the answer to the SAM-supplementation discussion: if a patient sits on the SAH-export limb, adding SAM could plausibly worsen matrix SAH accumulation, so 'try SAM' is two opposite proposals rather than one.

    Evidence grading notes. The two PMID:35730628 items are OTHER with quote_role REVIEW_SYNTHESIS: the source is a review stating established biochemistry rather than reporting a study. The PMID:36456512 transfection result is IN_VITRO. The branch-point claim is MODEL_ORGANISM throughout and the authors' own 'likely' is preserved in both the snippet and the hypothesis description.

    Validation: just validate passes with 31/31 snippets verified; validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values and check-qualifier-terms all pass. One duplicate evidence key was introduced during editing and caught by the validator before commit. GeneReviews: NO_CHAPTER for both collections.

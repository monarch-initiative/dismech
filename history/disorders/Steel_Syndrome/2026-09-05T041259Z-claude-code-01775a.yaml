  details: |
    Created the Steel syndrome entry (MONDO:0014061), an autosomal recessive COL27A1 skeletal dysplasia. Curated the pathophysiology chain from COL27A1 loss through defective type XXVII collagen in the cartilage pericellular matrix to disordered growth-plate chondrocyte columns, and from there to the bilateral hip and radial head dislocations, carpal coalition, scoliosis and short stature. Bound HP terms for each phenotype and NCIT clinical-intervention terms for the management options. Every evidence snippet was verified as an exact substring of a fetched reference cache file; schema, ontology term, entity-reference, pathograph-target and enum gates all pass.

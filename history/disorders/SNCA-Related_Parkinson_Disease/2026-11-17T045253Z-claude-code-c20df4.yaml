  summary: 'Create: SNCA-Related Parkinson Disease'
  details: |
    Split the SNCA (alpha-synuclein) Mendelian forms out of the Parkinson disease basket into a per-gene entry bound to MONDO:0008200 (PARK1, missense) carrying PARK4 (MONDO:0011562, locus multiplications) as a subtype. Deep research used the claude_code provider (its own quote validator flagged 34 of 57 quotes unsupported, so it was treated as a lead only); all evidence snippets were verified against references fetched into references_cache. No GeneReviews chapter covers SNCA (only the Monogenic Parkinson Disease Overview, tagged, reports TAGGED_OVERVIEW), so phenotypes come from the MDSGene systematic review and primary literature. Validated with just validate, validate-terms, count-verified-snippets (123/123), and the gate suite (gene-activity-grounding, entity-refs, causal-targets, name-collisions, coarse-phenotypes, logical-rules, enum-values, qualifier-terms, duplicate-keys, snippet-length/title/grading, shared-disease-terms, model-scale-audit, conformance-content).

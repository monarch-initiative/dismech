  summary: 'Create: Cryptosporidiosis'
  details: |
    Created a standalone infectious-disease entry for Cryptosporidiosis [MONDO:0015474]. The curation records Cryptosporidium as the NCBITaxon-bound agent with C. hominis and C. parvum as etiologic species subtypes, models the environmentally resistant oocyst and epithelial intracellular replication life cycle, adds fecal-oral waterborne, foodborne, and household routes, captures the high pediatric burden in Africa and Asia, connects epithelial injury to diarrhea and dehydration, and records severe biliary persistence in immunocompromised hosts. The entry also adds contaminated-water and immune-impairment modifiers plus nitazoxanide and fluid/electrolyte supportive care, supported by cached PMID:37764167 and PMID:23440042.
    The local adversarial pass filed and fixed three issues before PR: it added
    antigen and nucleic-acid diagnostic support to the stool-based case
    definition, added mammalian hosts to the Cryptosporidium life-cycle block,
    and weakened the nitazoxanide treatment text so a 2023 FDA-exclusivity claim
    is not presented as timeless.

  summary: 'Create: Cryptosporidiosis'
  details: |
    Created a standalone infectious-disease entry for Cryptosporidiosis [MONDO:0015474]. The curation records Cryptosporidium as the NCBITaxon-bound agent with C. hominis and C. parvum as etiologic species subtypes, models the environmentally resistant oocyst and epithelial intracellular replication life cycle, adds fecal-oral waterborne, foodborne, and household routes, captures the high pediatric burden in Africa and Asia, and connects epithelial infection, epithelial injury, lamina-propria inflammation, barrier dysfunction, fluid loss, prolonged diarrhea, malnutrition, growth delay, and severe biliary persistence in immunocompromised hosts. The entry also adds contaminated-water, immune-impairment, HIV/AIDS, MBL2, and CD40LG modifiers; stool microscopy, antigen, and nucleic-acid diagnostics; plus nitazoxanide, antiretroviral therapy, and fluid/electrolyte supportive care, supported by cached PMID:37764167, PMID:27219054, PMID:23440042, PMID:11398117, PMID:12423984, PMID:11103042, PMID:19212310, and PMID:22459705.
    The local adversarial pass filed and fixed three issues before PR: it added
    antigen and nucleic-acid diagnostic support to the stool-based case
    definition, added mammalian hosts to the Cryptosporidium life-cycle block,
    and weakened the nitazoxanide treatment text so a 2023 FDA-exclusivity claim
    is not presented as timeless.

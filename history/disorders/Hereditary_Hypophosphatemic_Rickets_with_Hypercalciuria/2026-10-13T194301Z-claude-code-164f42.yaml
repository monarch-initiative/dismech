  summary: 'Review round 1: diagnosis, biochemistry, distal-tubule node, deep research'
  details: |
    Addressed the first review of PR #13888.
    - Ran a Falcon deep-research report (research/...-deep-research-falcon.md; 12/12 references
      resolved) and reconciled the entry against it. The preflight reported WARN only because FGF23
      is mentioned as a biomarker and comparator, not as a second disease.
    - Added diagnosis (clinical/biochemical evaluation, SLC34A3 genetic testing, renal ultrasound)
      and biochemical sections (serum phosphate, TRP/TmP-GFR, FGF23, calcitriol, urinary calcium,
      PTH, serum calcium, ALP), quoted from PMID:38364990, PMID:35689455, PMID:37981601 and the
      Molin 2021 cohort.
    - Split the renal arm of the hypercalciuria into a new node, Reduced PTH-Dependent Distal
      Tubular Calcium Reabsorption. GO has no renal or intestinal calcium-absorption term, so neither
      node binds one.
    - Bound FGF23 and calcitriol on the calcitriol-elevation node; added renal cyst and fracture
      phenotypes, a low-BMD edge, frequency evidence for hypophosphatemia and heterozygote renal
      calcification, PTH monitoring on phosphate therapy, and a citation for PMID:38642991.
    - From the deep research: digenic SLC34A3/SLC34A1 inheritance (HP:0010984) with SLC34A1 as a
      modifier (Gordon 2020), and normophosphatemic biallelic carriers (Molin 2021). The growth
      hormone adjunct in one uncontrolled two-brother report was not added.
    - Enthesopathy was not added: HPO has no enthesopathy term, and it is a single case.
    Validation: just validate, validate-terms and count-verified-snippets (97/97) pass, as do the
    entity-ref, causal-target, duplicate-key, enum and block-scalar checks.

  summary: 'Create: Hereditary Hypophosphatemic Rickets with Hypercalciuria'
  details: |
    New SLC34A3-related HHRH entry (MONDO:0009431), item 6 of issue #8995. Pathograph runs from biallelic SLC34A3 loss of function through renal phosphate wasting and systemic phosphate depletion, which conforms to the phosphopenic arm of defective_skeletal_mineralization, to two branches: FGF23-independent calcitriol elevation driving calcium hyperabsorption, hypercalciuria, PTH suppression and renal calcification; and impaired skeletal mineralization (conforming to the module's central effector node) driving rickets, osteomalacia, bowing, short stature and bone pain. Evidence from the original Tieder 1985 kindred, the two 2006 gene-discovery papers, oocyte/OK-cell functional work, the 2019 review, the 2022 and 2024 cohort studies and the Npt2a/Npt2c knockout mice. No GeneReviews chapter or ClinGen validity record exists. All 62 snippets verified against cached abstracts; term validation passed.

  summary: 'Gene-family review: SLC34A3, SLC34A1, FGF23'
  details: |
    SLC34A3 modelling re-reviewed and found correct: biallelic loss of NaPi-IIc, with the trigger node binding sodium:phosphate symporter activity (GO:0005436) as decreased. The SLC34A3 record's note said no ClinGen assertion existed; ClinGen's Tubulopathy GCEP classifies SLC34A3 as Definitive (AR) for this disease (2022-11-17), so the tier is now recorded (CGGV:assertion_32a838b7-87b4-48ef-b44a-6f6981959881-2022-11-17T060000.000Z) and the note corrected. The node FGF23-Independent Calcitriol Elevation carried FGF23 with no molecular function; its own evidence states that FGF23 is appropriately suppressed and significantly decreased in HHRH (PMID:38364990), so it now binds hormone activity (GO:0005179) as decreased, the opposite direction to the FGF23-excess hypophosphatemias. The SLC34A1 modifier record from one digenic kindred (DOI:10.1210/clinem/dgaa217) was reviewed and left unchanged.

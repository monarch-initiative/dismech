  summary: Add HP:0033525 central-pair phenotype and the pig SPEF2 tissue-restriction
    evidence
  details: |
    Acts on the automated second opinion posted to claim issue #10776, after
    checking each of its factual claims.

    Added. A phenotype for the defining ultrastructural lesion, Absent Sperm Axoneme
    Central Pair Complex (HP:0033525), resolved through the OLS API and label-checked;
    the original entry carried the 9+0 finding only inside pathophysiology prose.
    Evidence is the ultrastructural sentences from PMID:38568462 and PMID:31942643.

    Added. PMID:16549801, the Finnish Yorkshire pig immotile short-tail sperm defect,
    as two evidence items on the open SPEF2 / PCD boundary discussion. It matters
    because it is a naturally occurring SPEF2/KPL2 allele whose aberrantly spliced
    exon is testis-predominant, giving a sperm-restricted disease with cilia
    elsewhere unaffected. The discussion previously described the transcript
    explanation as untested; that was too weak. It is untested against the human
    genotypes, but it is a demonstrated mechanism for this gene in another species,
    and the rationale now says exactly that.

    Not added, with reasons. The pig disease is not entered as an animal_model: it
    is a spontaneous disease of a farmed species rather than a model built for this
    disorder, and the two mouse models already carry every mechanism link the
    pathograph needs. The closing note was corrected accordingly — it previously
    said the livestock reports were not read in their primary sources, which is no
    longer true of the pig paper. The cattle report still has not been read and is
    not cited. The second opinion's ART outcome percentages from PMID:39753944 are
    still not curated, because they pool FSIP2 and SPEF2 probands.

    Its C8-style suggestion to bind by author attribution was not applicable here,
    but two of its author attributions are wrong (PMID:31048344 is Liu C et al., not
    Tu; PMID:31942643 is not Liu 2020 in the sense its table implies), so no author
    name from that comment was carried into the entry.

    Validation. just validate, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-snippet-grading, check-title-snippets,
    check-snippet-length, check-folded-hyphens and check-reference-titles all exit 0.
    Reference validation reports 57/57 snippets verified.

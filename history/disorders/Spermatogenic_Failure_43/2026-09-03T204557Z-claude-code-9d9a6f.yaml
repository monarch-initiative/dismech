  summary: 'Create: Spermatogenic failure 43 (MONDO:0032898, SPEF2)'
  details: |
    New entry for spermatogenic failure 43 (MONDO:0032898), the male reproductive
    presentation of biallelic SPEF2 disease. Stub entry_type resolved as DISEASE:
    MONDO:0032898 is a distinct MONDO concept with its own OMIM entry (618751), it is
    bound nowhere else in kb/, and Spermatogenic_Failure_98 already established the
    standalone per-gene spermatogenic-failure entry as the convention here.

    The SPEF2 / PCD boundary, which was the substance of the claim. SPEF2 causes both
    this disorder and primary ciliary dyskinesia, and the two are not cleanly
    separable, so the boundary was set explicitly rather than by default:

      * This entry does NOT claim the respiratory phenotype. No airway phenotype
        (recurrent airway infection, bronchitis, rhinosinusitis, bronchiectasis)
        appears in its phenotypes block. Reasons: the airway mechanism is already
        curated in Primary_Ciliary_Dyskinesia.yaml, which carries SPEF2 with the
        ClinGen Definitive assertion; MONDO keys SPGF43 and PCD separately and
        dismech entries follow MONDO; and Spermatogenic_Failure_98 made the same
        split for CFAP54 in a structurally identical situation.
      * The exclusion is the harder call, not the easy one, and the entry says so.
        In PMID:31942643 -- the only SPEF2 infertility cohort that took a
        respiratory history systematically -- all six biallelic men had PCD-like
        symptoms, and all three men in PMID:38568462 had infertility with PCD or
        likely PCD. That is stated in the entry description, in the differential
        diagnosis, and in the open discussion, so the co-occurrence is visible
        rather than hidden by the scope decision.
      * The question itself is curated as an OPEN KNOWLEDGE_GAP discussion
        (spgf43_reproductive_versus_pcd_spectrum) attaching to the SPEF2 Loss of
        Function and Male Infertility nodes, with evidence on both sides: the 6/6
        PCD-like symptom finding and ClinGen's formal lumping recommendation
        (recorded as REFUTE against the split) against the ClinGen statement that
        some probands had respiratory features confirmed absent, and the
        tissue-level dissociation in which respiratory cilia keep a normal 9+2
        axoneme while sperm flagella are 9+0. Two proposed experiments accompany it.

    Pathograph. Five nodes: SPEF2 Loss of Function (MOLECULAR, trigger) -> Impaired
    Manchette and Intraflagellar Cargo Transport (CELLULAR, PROVISIONAL -- the
    transport defect is demonstrated in mouse, with human evidence limited to
    heterologous-cell interaction and allele transcript position) -> Sperm Flagellar
    Central Pair Apparatus Failure -> Multiple Morphological Abnormalities of the
    Sperm Flagella (conforms_to ciliopathy_dysfunction#Motile Cilia Beat Dysfunction)
    -> Male Infertility (ORGANISM, consequence).

    Models. Both go in animal_models with modeled_mechanisms links: the spontaneous
    Spef2 bgh mouse (RECAPITULATES the flagellar node with two histology readouts;
    PARTIALLY_RECAPITULATES Male Infertility, because the mouse has full PCD rather
    than isolated infertility) and the male-germ-cell conditional knockout
    (RECAPITULATES the transport node, two readouts).

    Deep research. research/Spermatogenic_Failure_43-deep-research-falcon.md, falcon
    provider, 686 s, 31 citations, 5/5 references resolved, preflight-dr PASS
    (SPEF2 mentioned 68 times, OMIM 618751 matches MONDO). Used as leads only. Its
    suggested HPO terms were checked through OLS and four were wrong: HP:0032223 was
    offered as 'Chronic wet cough' but is 'Blood group'; HP:0011961 was offered as
    'Asthenozoospermia' but is 'Non-obstructive azoospermia'; HP:0012864 was offered
    as 'Teratozoospermia' and HP:0000798 as 'Oligospermia', neither of which is the
    canonical label. None was used as offered. Every CURIE bound in this entry was
    resolved through the OLS API and its label copied from the response.

    Denominators. The cohort yields in the genetic section (2/42, 2/50, 4/45) have
    MMAF or severe-asthenozoospermia denominators, not SPGF43, so they are recorded
    as free-text frequency plus notes rather than as case_fractions, and no
    prevalence record is created. PMID:39753944's ART outcome percentages are pooled
    across FSIP2 and SPEF2 probands, so only its qualitative conclusion is cited and
    the numbers are not curated as SPEF2 outcomes.

    Reference cache. The ClinGen SPEF2 record
    (CGGV:assertion_e137eed5-...-2025-01-09T170000.000Z) was regenerated with
    'just clingen-rebuild --id', which added the Evidence summary narrative the
    committed copy lacked. That narrative is the source of the lumping and
    confirmed-absence-of-respiratory-features quotes. It was regenerated through the
    sanctioned recipe, not hand-edited.


  summary: Add molecular genetic testing diagnosis, connect phenotypes to the pathograph,
    address review
  details: |
    Addresses the CHANGES_REQUESTED review on PR #10786. Each reviewer claim was
    checked before acting on it.

    Blocking item, taken. diagnosis: now leads with Molecular Genetic Testing, bound
    to NCIT:C15709 Genetic Testing (resolved through OLS, label copied from the
    response, and the same term the SYCP2 and SYCP3 sibling entries bind -- both
    checked). The reviewer was right that the primary diagnostic modality for a
    disorder defined by biallelic variants appeared only obliquely, inside the
    immunofluorescence entry's phrase 'a practical adjunct to sequencing'. The new
    entry cites the whole-exome sequencing sentence from PMID:31048344 and the
    combined-workup sentence from PMID:36873931, and its description records that
    splice-aware and copy-number-aware analysis matters here specifically, since
    reported alleles include canonical splice variants and the pig founder disease
    is an intronic insertion acting through aberrant splicing.

    Optional item 2, taken with a correction to the reviewer. The suggestion was
    'sequelae edges from the MMAF node'; sequelae is a slot on Phenotype, not on
    Pathophysiology, so the mechanism that actually connects a pathophysiology node
    to a phenotype is downstream. Four downstream edges were added: Sperm Flagellar
    Central Pair Apparatus Failure -> Absent Sperm Axoneme Central Pair Complex, and
    Multiple Morphological Abnormalities of the Sperm Flagella -> Abnormal Sperm
    Morphology, Abnormal Sperm Tail Morphology and Reduced Sperm Motility. All five
    phenotypes are now reachable; check-causal-targets still reports no new broken
    targets.

    Optional item 4, taken. PMID:20301301 (PCD GeneReviews) added to references with
    tags: [GeneReviews] for navigability, plus a notes paragraph stating why it is
    listed but never cited as evidence -- the cached record is abstract_only, holds
    only a purpose statement, and does not mention SPEF2, so the only quotable text
    in it is the title.

    Optional item 5, taken. The genetic counselling description now names PGT-M and
    prenatal diagnosis explicitly rather than leaving them implicit in 'cascade
    carrier testing'.

    Optional item 1, declined with a reason recorded in notes. Oligozoospermia
    (HP:0000798) is not curated. Sperm concentration is reported for three men
    (9.3, 10.4 and 21.0 million/mL) and the third is above the WHO lower reference
    limit, so the reported values do not support reduced concentration as a feature.
    The disorder as reported is one of sperm quality, not sperm number.

    Optional item 3 needed no change; the CGGV evidence_source split is per-snippet
    consistent and matches the SPGF98 precedent.

    Also included, not from the review. The boundary discussion now records that the
    three-man series was ascertained on infertility and PCD phenotypes together, so
    its 3/3 describes who was recruited rather than an independent frequency, while
    the six-man cohort was ascertained on severe asthenozoospermia alone and is
    therefore the load-bearing observation on that side.

    Validation. just validate, check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-snippet-grading, check-title-snippets,
    check-snippet-length, check-folded-hyphens and check-reference-titles all exit 0.
    Reference validation reports 59/59 snippets verified. No new term-cache rows were
    needed; NCIT:C15709 was already cached.

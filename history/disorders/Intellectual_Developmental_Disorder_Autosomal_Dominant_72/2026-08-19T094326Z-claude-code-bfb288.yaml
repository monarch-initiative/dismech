  summary: 'Create: Intellectual Developmental Disorder, Autosomal Dominant 72 (SRRM2)'
  details: |
    Created MRD72 / SRRM2-related neurodevelopmental disorder (MONDO:0957397, OMIM 620439) de novo.

    Deep research: falcon was attempted first (the /curate default) but the Edison API returned HTTP 402 Payment Required, so the run was replaced with claude_code and openscientist. Both reports passed `just preflight-dr` against MONDO:0957397 (canonical gene SRRM2; report OMIM 620439 matches the MONDO xref). Both carried reference_validation frontmatter with 0 unresolved references and no needs_review flag. The openscientist report's own Section 16 records that its early iterations mis-attributed MRD72 to ZBTB7A before self-correcting, so all ZBTB7A-derived material was excluded and that NEC episode is documented in the entry's differential_diagnoses notes.

    GeneReviews: a PubMed search for "SRRM2 GeneReviews[All Fields]" returned 0 results; no chapter exists, so the GeneReviews baseline step was not applicable. Recorded in the entry notes.

    Curated: a six-node pathograph (SRRM2 haploinsufficiency -> nuclear speckle scaffold disruption / alternative pre-mRNA splicing dysregulation -> impaired neuronal and oligodendrocyte development and loss of stemness -> neurodevelopmental phenotype), with downstream edges resolving the organism-level bundle into the individually curated clinical phenotypes; 30 phenotypes; the large-16p13.3-deletion subtype; a genetic section covering the CpG-deamination recurrent-nonsense mechanism, the IDR missense allele, and the multisystem-proteinopathy allele recorded as an explicit non-haploinsufficiency contrast; three ascertained-cohort prevalence yields plus one general-population estimate; five treatments; the Srrm2 heterozygous mouse plus two experimental models; a ZTTK/SON differential diagnosis; dataset geo:GSE299937; and three discussions (a HUMAN_MODEL_MISMATCH on the mouse model, a KNOWLEDGE_GAP on whether 50 percent SRRM2 dosage is sufficient to degrade speckle architecture, and a KNOWLEDGE_GAP on the genotype-severity gradient).

    Red-team review before PR (dismech-pr-review skill, run in a subagent) returned three blocking findings, all fixed. Seizures had been attributed to the deletion subtype when the cited paper's own case narratives show both seizure cases carried protein-truncating point variants, one additionally confounded by biallelic SLC17A5 variants. The deletion-versus-point-variant severity gradient was asserted as fact when the source is a cohort-versus-cohort comparison over a mixed-genotype group containing two blended phenotypes. And one hand-written reference_title for PMID:38290089 did not match the cached title. Also fixed from that review: bound Overfriendliness to HP:0100025, which does exist contrary to the original note; retagged human iPSC-neuron evidence IN_VITRO and the SON mouse-model paper MODEL_ORGANISM; downgraded the nuclear-speckle node to PROVISIONAL because the published dissolution experiments used co-depletion of both scaffolds rather than haploinsufficiency; corrected the 1/1300 prevalence band to BAND_1_5_PER_10000; and split two bundled phenotypes into atomic ones.

    Validation: `just validate-disorders` (the batched schema + terms + references sweep that CI runs) passes with 104/104 snippets verified against cached references. `just check-duplicate-keys`, `just check-reference-cache-frontmatter`, `just check-term-cache-integrity`, and `just verify-datasets` all pass. `scripts/check_title_snippets.py --check` reports no new title-quoting snippets. The 16 pytest cases selected for this file pass. Thirteen fetched-but-uncited reference cache files were deleted rather than committed.

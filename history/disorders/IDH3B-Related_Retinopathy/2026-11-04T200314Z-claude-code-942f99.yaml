  summary: 'Review round 1: IDH3B-Related_Retinopathy'
  details: |
    Answered the first automated review of PR 16522. The cached full text of PMID:30478029 (Findlay 2018) states that IDH3 alpha-gamma dimers keep 36 percent of the heterotetramer's specific activity in vitro, and the authors propose this residual activity as the reason Idh3b mutant mice do not degenerate and IDH3B patients have milder, later-onset disease than IDH3A patients. Both sentences are now evidence on the idh3b_mouse_retina_mismatch discussion (IN_VITRO with quote_role BACKGROUND for the enzymology, MODEL_ORGANISM and INDIRECT for the authors' interpretation), and the rationale lists the alpha-gamma explanation alongside the tension with the Idh3b knockout (PMID:35985423), in which beta-subunit loss almost completely abolished tissue IDH3 activity. The free-text genetic association no longer says Causative, which contradicted the unset relationship_type. Checked: just validate, count-verified-snippets (56/56), check-entity-refs, check-snippet-grading, check-snippet-length, check-title-snippets, check-retired-support-prose, check-folded-hyphens, check-folded-yaml.

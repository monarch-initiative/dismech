  summary: 'Create: IDH3B-Related_Retinopathy'
  details: |
    Created the IDH3B-related retinopathy entry (MONDO:0800393) from the stub. Retinitis pigmentosa 46 (MONDO:0012943, OMIM:612572), the only MONDO descendant, is treated as the same entity: every reported patient has nonsyndromic RP, so it is recorded as a synonym and a skos:narrowMatch mapping rather than a has_subtypes row. Primary sources: Hartong et al. 2008 (PMID:18806796; families, variants, lymphoblast NAD-IDH kinetics, clinical findings, EyeSAGE expression argument), Zenteno et al. 2019 (PMID:31736247; third case, p.Gly286Glu, subcapsular cataract), the ClinGen Retina GCEP record (Moderate, AR), two Idh3b-null mouse papers (PMID:30478029, PMID:35985423) and an ex vivo retinal respiration study (PMID:26747773). The pathophysiology chain runs from biallelic IDH3B loss of function to NAD-IDH deficiency, impaired isocitrate oxidation, a hypothesised photoreceptor energy insufficiency (mechanism_confidence HYPOTHETICAL, with a REFUTE item for normal respiration in Idh3b-null fibroblasts) and rod and cone degeneration wired to eight phenotypes. Both mouse lines are recorded with FAILS_TO_RECAPITULATE links for photoreceptor degeneration and a HUMAN_MODEL_MISMATCH discussion. gene_disease_validity copied from the ClinGen CGGV record; relationship_type left unset because CAUSATIVE requires Definitive or Strong. GeneReviews has no IDH3B chapter; the Nonsyndromic Retinitis Pigmentosa Overview is tagged. The OpenScientist deep-research report had not been produced when this record was written, so the entry is built from the primary literature above. Checked with just validate, count-verified-snippets, validate-terms, check-genereviews and the offline whole-repo gates.

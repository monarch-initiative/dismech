  summary: 'Create: IDH3B-Related_Retinopathy'
  details: |
    Created the IDH3B-related retinopathy entry (MONDO:0800393) from the stub. Retinitis pigmentosa 46 (MONDO:0012943, OMIM:612572), the only MONDO descendant, is treated as the same entity: every reported patient has nonsyndromic RP, so it is recorded as a synonym and a skos:narrowMatch mapping rather than a has_subtypes row. Primary sources: Hartong et al. 2008 (PMID:18806796; families, variants, lymphoblast NAD-IDH kinetics, clinical findings, EyeSAGE expression argument), Zenteno et al. 2019 (PMID:31736247; third case, p.Gly286Glu, subcapsular cataract), the ClinGen Retina GCEP record (Moderate, AR), two Idh3b-null mouse papers (PMID:30478029, PMID:35985423) and an ex vivo retinal respiration study (PMID:26747773). The pathophysiology chain runs from biallelic IDH3B loss of function to NAD-IDH deficiency, impaired isocitrate oxidation, a hypothesised photoreceptor energy insufficiency (mechanism_confidence HYPOTHETICAL, with a REFUTE item for normal respiration in Idh3b-null fibroblasts) and rod and cone degeneration wired to eight phenotypes. Both mouse lines are recorded with FAILS_TO_RECAPITULATE links for photoreceptor degeneration and a HUMAN_MODEL_MISMATCH discussion. gene_disease_validity copied from the ClinGen CGGV record; relationship_type left unset because CAUSATIVE requires Definitive or Strong. GeneReviews has no IDH3B chapter; the Nonsyndromic Retinitis Pigmentosa Overview is tagged. The OpenScientist deep-research report (research/IDH3B-Related_Retinopathy-deep-research-openscientist.md) was read after the first draft and used as a lead list. Its reference validation resolved 11 of 11 references (none unresolved, none off topic); its term validation resolved 27 of 30 terms with none unresolved but flagged 9 HP labels as naming different terms (for example HP:0001104 Macular hypoplasia offered for optic disc pallor and HP:0000608 Macular degeneration for abnormal dark adaptation), so no term was taken from the report. just preflight-dr returned WARN: the disease and gene are correct (IDH3B mentioned 77 times) but the report gives HGNC:4521 for IDH3B, which is hgnc:5385; no gene identifier was copied from it. From its citations the entry gained the photoreceptor-specific Pdha1 deletion study (PMID:41780638) and a photoreceptor energetics review (PMID:32094231) as indirect support for the energy node, and an IDH3 structural review (PMID:37542909) for subunit assembly. Report claims not taken: the alpha-gamma versus alpha-beta dimer activity figures attributed to Findlay et al. (not present in the cached text of PMID:30478029), the missense coordinate c.293T>C (the paper gives c.395T>C), and the supportive-care and gene-therapy treatment section, which cites no IDH3B-specific source. Checked with just validate, count-verified-snippets, validate-terms, check-genereviews and the offline whole-repo gates.

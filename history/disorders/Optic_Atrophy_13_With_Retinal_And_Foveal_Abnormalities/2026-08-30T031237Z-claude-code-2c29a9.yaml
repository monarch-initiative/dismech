  summary: 'Create: Optic Atrophy 13 With Retinal and Foveal Abnormalities'
  details: |
    New entry for SSBP1-related dominant optic atrophy (MONDO:0008135), curated from four primary references fetched into the cache for this PR. Sources found by PubMed search; all ontology terms verified against OLS before binding.

    The claim issue asked whether the mechanism is mtDNA depletion, mtDNA deletion, or a dominant-negative effect on the SSBP1 tetramer. The published evidence resolves this: they are not competing hypotheses but successive steps. The missense changes destabilise dimer/tetramer assembly and distort the DNA-binding region, that impairs mtDNA replication, and depletion follows. The pathophysiology is written as that chain, with the dominant-negative claim attached specifically to the multimer-assembly node rather than to the disease as a whole.

    The dominant-negative claim rests on two independent lines: structural and fibroblast evidence that R38Q destabilises dimer/tetramer formation, and the zebrafish result that mutant mRNA phenocopies knockdown of the endogenous transcript - the functional signature that distinguishes interference from insufficiency, and something difficult to establish in patient cells carrying one variant copy.

    The foveopathy is curated as developmental rather than degenerative on two load-bearing observations: it is identical at all ages, and it does not affect visual acuity. It is described as a diagnostic marker rather than a component of visual disability, which is what the source argues.

    Incomplete penetrance (3 of 27 carriers asymptomatic) is curated as its own Inheritance block, and maternal germline mosaicism is recorded in the genetic notes because it changes recurrence-risk counselling for an apparently de novo variant.

    Two reference-validator constraints were handled without touching config: one snippet was shortened to stop before bracketed variant annotations (which the validator strips before matching), with the variant names carried in the node description instead; and a three-word snippet was extended to a propositional clause after check-snippet-length flagged it.

    Validation: schema clean, terms clean, 30/30 snippets verified, all offline gates clean.

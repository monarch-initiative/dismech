  summary: 'Review round 1: correct the eye-restricted framing, add retinal and extra-ocular
    phenotypes'
  details: |
    Addressed the round-1 review on PR 10131. All fixes drew on the four references already committed; no new sources fetched.

    The substantive correction is factual. The entry described the disease as largely eye-restricted and built its tissue-selectivity knowledge gap on that premise. Checking the cited cache lines confirmed the reviewer was right that this is wrong: PMID:31298765 documents hypothyroidism in four subjects and renal disorder including renal failure in three, and PMID:34548540 states that purely ocular disease is a property of the p.Arg38Gln allele, contrasting with syndromic presentations of other SSBP1 missense variants. Since this entry curates p.Arg107Gln as well, the extra-ocular features belong to it. The description, notes, depletion node and discussion were all corrected, and hypothyroidism and renal insufficiency were added as phenotypes.

    The same source also supplies a proposed explanation for the tissue distribution that the entry had treated as unexplained: severity may track residual mtDNA levels, with variants differing in their effect on tetramer abundance and activity, against a per-organ depletion threshold. The knowledge gap was rewritten from 'unexplained' to 'proposed but untested', with the competing selective-vulnerability account stated as making a different prediction, and the proposed experiment extended to compare alleles.

    Retinal pigmentary changes (65% of 60 published patients) and retinal vessel attenuation were added; both were absent despite the disease name foregrounding retinal abnormalities. Optic nerve hypoplasia added. Frequency values added to optic atrophy (95%), foveopathy (57.8%) and rod-cone dystrophy (29.3%) from the 60-patient denominator, replacing estimates derived from single-family series - the rod-cone figure in particular is much higher than the 2-of-27 the entry previously implied.

    A diagnosis section was added with the OCT plus wide-field autofluorescence protocol and the 11%-asymptomatic-carrier counselling point. Prevalence record added as CASES_IN_LITERATURE.

    The reviewer's OMIM:165510 suggestion could not be implemented as mappings.omim_mappings because DiseaseMappings has slots for ICD10CM, ICD11F, MONDO and NCIT only. It is recorded as an external_assertions entry instead, following the pattern in 15q11q13_Microduplication_Syndrome, with a note saying why.

    The zebrafish retinal-ganglion-cell link was downgraded from RECAPITULATES to PARTIALLY_RECAPITULATES per the reviewer's suggestion: the model reproduces involvement of the right cell type by the wrong route, differentiation failure in an embryo against degeneration of a differentiated cell.

    Validation: 44/44 snippets verified (was 30/30), schema and terms clean, all offline gates clean.

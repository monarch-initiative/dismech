  summary: Add the coccidioidal granuloma composition/maintenance hypothesis group
    and dispatch it to OpenScientist
  details: |
    Added the entry's first `mechanistic_hypotheses` group,
    `granuloma_composition_containment_model` (status EMERGING), and dispatched
    it to OpenScientist for hypothesis exploration.

    Why this hypothesis. The granuloma-module conformance added earlier in this
    session is real but rests on two causal edges whose evidence is PARTIAL -
    Th1/Th17 -> epithelioid transformation, and epithelioid transformation ->
    organized granuloma assembly. That is not a curation shortcut: the primary
    literature says the intermediate steps are unknown. PMID:33262956 states
    that "we do not know what cells are recruited to the granuloma, what signals
    form and maintain the granuloma structure, nor details on the immune
    microenvironment within the granuloma interior", and PMID:37367586 - a
    review dedicated to coccidioidal granulomas - says outright that "very
    little is known about granulomas during Coccidioides infection" and that the
    current model is extrapolated from tuberculosis. The hypothesis group makes
    that dependency explicit rather than implied: both PARTIAL edges are tagged
    into it via `downstream[].hypothesis_groups`.

    The hypothesis as stated: spherule resistance to phagocytosis obliges a
    sustained macrophage-transformation program (epithelioid differentiation and
    giant-cell fusion under Th1/Th17 and TNF drive), and the identity of
    recruited cells, the maintenance signals, and the granuloma interior
    microenvironment are what separate a contained lesion from one that necroses
    and disseminates.

    Why it is tractable now. The scRNA-seq time course (GSE274766, D0/5/9/14)
    and Visium spatial transcriptomics (GSE274767, D0/D14) added to this entry's
    `datasets` block earlier in the session are matched data for the
    cell-identity and spatial-organization components, so the exploration is not
    purely literature-bound. Two in-KB comparators reach the same question
    through the shared module: Sarcoidosis
    (`antigen_persistence_granuloma_chronicity_model`) and
    Chronic_Beryllium_Disease.

    Status is EMERGING, not CANONICAL, on purpose - the chain is borrowed from
    TB rather than measured in this disease.

    Provider run. `just research-hypothesis openscientist Coccidioidomycosis
    granuloma_composition_containment_model`, output to
    kb/hypotheses/Coccidioidomycosis/granuloma_composition_containment_model/.
    Per the review-hypothesis-exploration skill the report is a research lead,
    not a source of truth: nothing from it may be promoted into the disorder
    YAML without an assessment sidecar and normal reference-cache/evidence
    validation. Named Entity Confusion risk is elevated for this disease - the
    "Valley fever" synonym resolves to Rift Valley fever and already
    contaminated 9 of 12 dataset candidates earlier in this session - so the
    report must be checked for wrong-entity drift before any use.


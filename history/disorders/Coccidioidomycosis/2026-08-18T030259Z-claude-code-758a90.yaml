  summary: 'Address PR #8784 review: add the alternative neutrophil/inflammasome model,
    TB-analogy qualifier, human cavitary pathology, and evidence_source fix'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #8784 (4
    IMPORTANT findings, no CRITICAL). All four addressed; two of the four
    non-blocking suggestions adopted, one disputed with reasons.

    Finding 1 - competing neutrophil/inflammasome axis absent. Added
    `neutrophil_inflammasome_immunopathology_model` (status ALTERNATIVE) plus a
    new pathophysiology node, "Spherule rupture-triggered inflammasome
    activation and neutrophil recruitment". Registered as a genuine alternative
    rather than a component of the containment model because two independent
    loss-of-function experiments run opposite to a protective reading:
    CXCR2/IL-8R2-deficient mice have fewer neutrophils AND fewer organisms with
    higher Ifng/Il17a (PMID:33106296), and caspase-1-deficient mice show
    improved tolerance at equivalent fungal burden (PMID:42386736). Wired from
    the shared "Phagocytosis-resistant spherule persistence" trigger (the two
    models diverge at rupture, which PMID:42386736 shows is the specific
    inflammasome trigger) and downstream to "Pulmonary cavitary disease".
    Deliberately carries NO edge to Th1/Th17: the claim there is that neutrophil
    influx impairs the protective response, and `CausalEdge` has no polarity
    slot, so such an edge would misread as promotion. That reasoning is recorded
    in the node description.

    Finding 2 - TB-analogy qualifier. Added PMID:33276795 to the
    `granuloma_composition_containment_model` evidence as PARTIAL. Curated with
    a narrower claim than the review proposed: the review quoted "Despite
    histologic similarities, DEGs and pathway enrichment markedly differed",
    but in the source that sentence compares sarcoidosis LUNG versus LYMPH NODE,
    not one disease against another. The cross-disease sentence
    ("Comparisons between sarcoidosis and pathogen granulomas identified pathway
    divergences and commonalities...") is quoted instead, and the explanation
    records the bounds: sarcoidosis-centred design, only three
    coccidioidomycosis subjects, commonalities as well as divergences, and no
    direct coccidioidomycosis-versus-tuberculosis comparison - which is the
    specific analogy at issue.

    Finding 3 - human cavitary pathology. Added PMID:24321524 to the "Pulmonary
    cavitary disease" node. This materially qualifies the conformance this PR
    introduced: the cavity wall shows "chronic inflammation and occasional giant
    cells but no granulomas", with a lining of "neutrophils and caseous
    necrosis". The node description now states that it conforms to the module's
    destruction arm as the outcome of containment FAILING, not as a
    granulomatous lesion in its own right. The granuloma-to-cavity edge's
    supporting quote from PMID:24613568 ("All cases showed granulomatous
    pleuritis") was downgraded SUPPORT -> PARTIAL and explicitly scoped to the
    pleura, since it describes granulomatous pleuritis at the rupture site
    rather than the cavity wall.

    Finding 4 - evidence_source. Changed HUMAN_CLINICAL -> OTHER on the
    prevalence evidence citing PMID:32358020. The review is right: that
    publication is a mouse vaccine study and the ~150,000-infections line is
    background it reports, not a human clinical finding of its own.

    Suggestion 8 adopted - added subtype-scope notes to the STAT4, STAT3, and
    IL12RB1 `genetic:` entries recording that the human Th1-axis evidence comes
    from disseminated cases and should not be read as explaining severity within
    primary pulmonary infection, plus a note that Mendelian defects of this axis
    explain only a small minority of disseminated disease.

    Suggestion 6 addressed - the two PARTIAL conformance edges no longer rest
    solely on one shared PMID:37367586 snippet; the hypothesis group they are
    tagged into now also carries PMID:33276795.

    Suggestion 5 disputed, not applied. The review asks for one evidence_source
    per publication on the PMID:34877441 dust-storm edge. CLAUDE.md says the
    opposite where a paper mixes evidence types: "If a paper mixes sources,
    split evidence items so each item gets a single evidence_source." The
    SUPPORT item quotes a background statement about arthroconidia transport
    physics (OTHER); the REFUTE item quotes the study's own epidemiological
    analysis of human case data (HUMAN_CLINICAL, which CLAUDE.md lists as
    covering epidemiology). Each item carries a single type, which is what the
    rule requires. The same reasoning applies to PMID:30166741. Raised on the
    PR rather than changed unilaterally.

    Suggestion 7 (missing .citations.md sidecar, dangling artifact links) is a
    property of the provider run, not of the YAML; already documented in the PR
    body and in the previous history record.

    Also: `CLAUDE.md` was removed from this PR entirely. CI's curation-scope
    guard fails any PR that touches `kb/` and infra files together without a
    `scope-override` label; the module-registry bullet is separable and will go
    in its own PR rather than bypassing the gate with a label.

    Validation: `just validate-disorders` passes with 124/124 snippets verified
    against cached references (up from 110). Four new references fetched with
    `just fetch-reference`: PMID:24321524, PMID:33106296, PMID:33276795,
    PMID:42386736. Connectivity holds at 14/14 phenotypes and 5/5 genes. 8364
    targeted KB tests pass. `just research-hypotheses` now lists both hypothesis
    groups for this disorder.

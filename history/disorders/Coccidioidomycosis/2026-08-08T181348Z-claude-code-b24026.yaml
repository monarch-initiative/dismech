  summary: Add dust storms as an upstream aerosolization exposure, with the dust-storm/incidence
    controversy curated
  details: |
    Added dust storms as an explicit upstream exposure node rather than leaving
    them buried in the prose of the generic soil-exposure entry.

    New `environmental` entry "Dust storm and windblown dust events", bound to
    ECTO:7000001 (exposure to dust) with ENVO:00002008 (dust) as environment
    context, carrying a TRIGGERS/DIRECT `influences_mechanisms` edge onto
    "Arthroconidia inhalation and spherule morphogenesis". Because these edges
    have no incoming edges, it lands at the leftmost layer of the pathograph as
    an initiating step, which is what was asked for.

    The literature here is genuinely contested, so the edge is scoped narrowly
    and curated with its refutation attached rather than asserted unqualified.
    Two claims are kept apart. (1) That a dust event aerosolizes and transports
    arthroconidia is not disputed - Comrie (PMID:34877441), the paper arguing
    against a dust-storm/case link, states outright that arthroconidia are
    transported in individual dust events. That is what the mechanism edge
    asserts. (2) Whether discrete dust storms drive measurable subsequent
    increases in incidence is disputed, and the edge does NOT assert it.

    The dispute is a published exchange in one journal: Tong et al. 2017
    (PMID:30166741) report that dust storm frequency correlates with Valley
    Fever incidence in Maricopa and Pima Counties at least as strongly as other
    accepted controls; Comrie 2021 (PMID:34877441) applies superposed-epoch
    analysis to all recorded 2006-2020 dust storms near Phoenix and Bakersfield
    and finds no difference in case patterns after dust storms versus
    non-dust-storm conditions; Tong et al. 2022 (PMID:35949254) reply that the
    NOAA Storm Events dust records are unsuitable for the question and that
    "dust storm" is not consistently defined across communities. The Comrie
    null result is carried on the mechanism edge as a REFUTE evidence item, and
    the whole exchange is recorded as a `discussions` entry with kind
    CONTROVERSY (discussion_id controversy_dust_storms_vs_incidence, status
    OPEN), attaching to both the environmental entry and the pathophysiology
    node, with a proposed experiment that addresses the exposure-measurement
    disagreement both sides are really having.

    The pre-existing "Arid and semi-arid soil exposure" description listed dust
    storms among soil-disturbance modes; that mention was redirected to the new
    entry so the two do not read as competing unqualified claims.

    Four new references fetched with `just fetch-reference` and committed:
    PMID:30166741, PMID:34877441, PMID:35949254, PMID:39432997.

    Validation: `just validate-disorders kb/disorders/Coccidioidomycosis.yaml`
    (batched CI-equivalent sweep, --no-full-text) passed with 106/106 snippets
    verified against cached references; term validation passed, including the
    new ECTO and ENVO bindings. Targeted KB integrity tests including
    test_environmental_mechanism_targets passed.

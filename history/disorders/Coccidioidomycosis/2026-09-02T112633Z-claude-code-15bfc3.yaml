  summary: Integrate assessed OpenScientist granuloma-model findings
  details: |
    Assessed kb/hypotheses/Coccidioidomycosis/granuloma_composition_containment_model/openscientist.md (verdict PARTIALLY_SUPPORTED; sidecar assessments/openscientist-assessment-by-claude-opus-5.yaml) and promoted its verified primary literature. Added to pathophysiology#Phagocytosis-resistant spherule persistence: PMID:6300253 (antiphagocytic arthroconidial wall; only 20-30 percent of ingested organisms killed by PMNs) and PMID:21129481 (secreted fungal factor suppresses macrophage NO and iNOS, with the caveat that iNOS-deficient macrophages kill normally). Added to pathophysiology#Granuloma formation and containment: PMID:18852250 both arms of the mouse-strain histopathology (organized granuloma with macrophage/lymphocyte mantle in resistant mice; neutrophils, spherules and T-cell collapse with death in susceptible mice) and PMID:20930107 canine granuloma T-cell predominance, cited with the species caveat the source itself records. Added to the granuloma_composition_containment_model hypothesis: PMID:39611685 (the publication behind GSE274766/GSE274767, reporting monocyte-derived Spp1-expressing macrophages plus neutrophil infiltration and defective lymphocyte responses) and PMID:40704794 (PD-L1-positive neutrophils and contact-dependent Spp1 macrophages at 24h). Added PMID:28098554 to genetic#STAT3, which previously had only mouse evidence. Added two KNOWLEDGE_GAP discussions: the unmeasured Th1/Th17-to-epithelioid and epithelioid-to-organized-granuloma edges, and the absent regulatory T cell / B cell arm. Deliberately not changed: hypothesis status stays EMERGING (the report agrees); no Treg or B cell pathophysiology nodes, since the only evidence is chronic beryllium disease; no TNF evidence from PMID:33933122, whose proposed snippet is background prose in a case report and whose claim is already covered by cohort-validated PMID:38667927; no adoption of the report's reading of PMID:33276795, whose quoted sentence compares tissue sites within sarcoidosis rather than etiologies; no ontology binding from the report's candidate list, since CL:0000878 is central nervous system macrophage rather than an epithelioid macrophage. Verified with check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, and count-verified-snippets (137/137).

  summary: Conform Valley Fever to the granuloma_formation module; wire genes and
    phenotypes; add prevalence and datasets
  details: |
    Enhancement pass on the existing Valley Fever (Coccidioidomycosis) entry.

    Module conformance. The entry now declares conformance across all five
    granuloma_formation nodes, making it the module's first fungal-infection
    conformer - the module description names fungal infection but no fungal
    disease conformed to it. Two new pathophysiology nodes complete the chain:
    "Phagocytosis-resistant spherule persistence" (role trigger; the
    disease-specific substitution for the module's persistent indigestible
    stimulus, since the mature spherule exceeds host phagocytic capacity,
    PMID:33262956) and "Epithelioid transformation and multinucleated giant cell
    formation" (role central_effector; human tissue histopathology places
    spherules predominantly inside multinucleated giant cells, PMID:28857979).
    The existing Th1/Th17, granuloma-formation, and cavitary-disease nodes were
    mapped to the module's amplifier, effector, and consequence nodes
    respectively, and the intervening causal edges added. Two conformance-chain
    edges carry PARTIAL support on purpose: the best available Coccidioides
    granuloma review (PMID:37367586) establishes that granuloma formation is the
    host response but explicitly notes how little is known about the assembly
    steps in this disease specifically.

    Connectivity. Gene-to-mechanism wiring went 0/5 to 5/5 by adding hgnc-bound
    `genes` descriptors to the two immune nodes (CLEC7A/CARD9 on innate
    recognition; STAT4/STAT3/IL12RB1 on Th1/Th17) and `gene_term` bindings to
    the five `genetic` entries. Phenotype connectivity went 12/14 to 14/14 by
    adding downstream edges for night sweats and weight loss.

    Environmental. Added TNF-alpha inhibitor therapy as an iatrogenic exposure
    with a PREDISPOSES `influences_mechanisms` edge onto the Th1/TNF
    macrophage-activation node - the granuloma-module drug pattern read in
    reverse, since what is therapeutic in sterile granulomatous disease is a
    dissemination risk when a live contained fungus is present.

    Prevalence. Added a structured ANNUAL_INCIDENCE record normalized from the
    cited estimate of ~150,000 US infections per year. The source states an
    absolute count rather than a rate, so the population denominator is recorded
    in `notes` as this entry's stated assumption, along with the caveat that
    estimated infections substantially exceed reported cases and that the
    national average flattens a sharply focal endemic distribution.

    Datasets. Three GEO accessions added (GSE274766 scRNA-seq time course,
    GSE274767 Visium spatial transcriptomics, GSE179468 C. immitis phase
    transition), all resolved with `just verify-datasets`. Nine of the twelve
    discovery candidates were rejected as Named Entity Confusion: the "Valley
    Fever" synonym matched Rift Valley fever virus datasets, a different disease
    entirely. Per the dataset SOP these records carry `publication` and
    provenance `notes` rather than a fabricated evidence quote.

    Mechanical: therapeutic_modality SMALL_MOLECULE on the three antifungals,
    reference_title on the two clinical-trial evidence items, biological_scale
    tags on the pathophysiology nodes.

    Validation. `just validate-disorders kb/disorders/Coccidioidomycosis.yaml`
    (the batched CI-equivalent sweep, --no-full-text) passed: schema clean, term
    validation passed, 98/98 snippets verified against cached references. No new
    references were fetched - every snippet quotes an already-cached source.
    Compliance 98.3 -> 98.7 percent; the residual gap is the three dataset
    records' absent evidence blocks, which is the documented policy for
    bulk-discovered accessions.

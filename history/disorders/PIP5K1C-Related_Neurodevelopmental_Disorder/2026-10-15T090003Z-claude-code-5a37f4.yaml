  summary: 'Create: PIP5K1C-Related Neurodevelopmental Disorder'
  details: |
    New entry for PIP5K1C-related neurodevelopmental disorder (MONDO:1010145, NEDVIL, PIP5K1C gain of function). Source report: research/PIP5K1C-Related_Neurodevelopmental_Disorder-deep-research-perplexity.md, generated with Perplexity sonar-deep-research at reasoning_effort=low, because two runs at the default effort were disconnected at about 300 seconds. Reference validation resolved 15/15 references and flagged one off-topic (PMID:34211152, an ACMG sequencing guideline), which is not cited. preflight-dr returned WARN because its heuristic lexicon counted the disease abbreviation NEDVIL as a second gene; the report is about PIP5K1C and keeps the recessive allelic disease LCCS3 separate. The only primary report (PMID:37451268) is cached as abstract only, so the report's per-feature counts from its full text were not curated and phenotypes are limited to those named in the abstract. LCCS3 (PMID:17701898) is a differential. Validated with just validate, count-verified-snippets (24/24), validate-terms, check-genereviews (NO_CHAPTER), check-causal-targets and the gene-grounding gate.

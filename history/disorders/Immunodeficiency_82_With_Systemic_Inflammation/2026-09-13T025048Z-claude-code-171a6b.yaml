  summary: 'Review round 1: add DLBCL and three organ phenotypes, allelic series,
    prevalence, OMIM assertion, surveillance and diagnosis'
  details: |
    Answers all eight blocking findings plus two of four suggestions in one push. Every reviewer claim was verified against references_cache/PMID_33782605.md or the term caches before acting; all four quoted sentences it cited are verbatim substrings.

    Findings 1 and 2 together: added a B-cell lymphoma phenotype bound to HP:0012191 (read from cache/hp/terms.csv) and wired it as the downstream target of B Cell Lymphomagenesis, which previously dead-ended.

    Finding 3: added Pulmonary inflammation, Neuroinflammation (HP:0033429) and Hepatic granulomatosis (HP:0011955) downstream of Multi-Organ Inflammatory Disease, all quoting the single multi-tissue sentence that names the organs and the affected patients.

    Pulmonary inflammation is deliberately left UNBOUND. HPO was searched through the OLS adapter for pulmonary/lung inflammation, pneumonitis and abnormal pulmonary terms. Every candidate is either narrower than the source supports (HP:0006515 Interstitial pneumonitis, HP:0002113 Pulmonary infiltrates) or morphological rather than inflammatory (HP:0002088 Abnormal lung morphology). The source says only that lung was among the inflamed tissues. The reason is recorded in the phenotype notes rather than a plausible binding being manufactured.

    Frequency bands carry their arithmetic in the explanation, not just the band: lung 3/6 = 50 percent FREQUENT, CNS 2/6 = 33 percent FREQUENT, liver 1/6 = 17 percent OCCASIONAL. For DLBCL the source says 2 of 4 adults (50 percent) while the whole cohort is 6 (33 percent); both fall in FREQUENT so the band does not depend on the denominator, and the explanation says so and notes the risk is age-conditioned. This follows the #11744 round-2 lesson, where a band disagreed with the number beneath it and no gate could see it.

    Finding 4: the genetic notes now carry the full five-allele series with de novo status, the three structural classes the source distinguishes (activation loop, ATP pocket, interdomain B autoinhibitory linker), CADD above 25 and the ClinVar accession range, plus two new evidence items. The interdomain B item is graded IN_VITRO because the claim rests on structural and biochemical characterisation rather than a patient observation.

    Findings 5, 6, 8: external_assertions with OMIM:619381, prevalence CASES_IN_LITERATURE / ULTRA_RARE, and a top-level references block, all following Immunodeficiency_81.yaml. The OMIM id was re-derived by re-running just preflight-dr, which reports OMIM (MONDO) 619381 from MONDO itself, rather than copied from the research report.

    Finding 7 and the diagnosis suggestion: a Haematological malignancy surveillance treatment quoting the authors' recommendation verbatim, and a diagnosis entry for the spontaneous pSYK Y525/526 assay.

    Suggestion taken: GO:0004713 to GO:0004715, non-membrane spanning protein tyrosine kinase activity, which is accurate for a cytoplasmic non-receptor kinase.

    Two suggestions declined with reasons. The onset descriptors rest on Table 1 ages that are not in the cached reference; only Patient 1's presentation at 2 weeks is quotable, and one patient does not establish the bimodal pattern. HP:0011123 is labelled Inflammatory abnormality of the skin, not Dermatitis as the review stated, and is broader than the HP:0000988 Skin rash already curated, so adding it would double-count the skin at lower precision.

    Two defects of my own were caught during this round and are recorded because they are the point. First, I wrote NCIT:C39321 labelled Screening Procedure from memory for the surveillance treatment. NCIT:C39321 is Analytical Biochemistry Shared Resource. It is a real CURIE, so it would not have failed as nonexistent; it was caught by checking cache/ncit/terms.csv immediately after writing it, and replaced with NCIT:C15406 Cancer Screening read from an OLS search in the same step. Second, the three organ targets were first inserted into the node's evidence list instead of its downstream list; schema validation named the exact JSON paths and the block was moved.

    A third defect was found by the gates rather than by the review, and it
    pre-dated this round. check-snippet-grading, run with --against-ref origin/main,
    reported PMID:33782605 graded HUMAN_CLINICAL at genetic[0].evidence[1] and
    MODEL_ORGANISM at animal_models[0].evidence[0]. Confirmed pre-existing by
    stashing this round's edits and re-running: it has been in the entry since the
    original commit. The review's checklist records this gate as PASS, which is
    consistent with running it without --against-ref, since the committed baseline
    grandfathers the row and a new entry has no rows on main.

    The defect is real. PMID:33782605 is a combined human and mouse study, and one
    sentence spans both halves: the genetic record quoted the whole sentence as
    HUMAN_CLINICAL while the animal model quoted its mouse clause as
    MODEL_ORGANISM. Fixed by re-quoting the genetic item to the human clause alone,
    so each item cites the clause it is graded on. This is the same mixed-source
    situation as PMID:19182804 in Torsion_Dystonia_6, with the opposite outcome:
    there the two items quote distinct sentences and the split is sound, here they
    overlapped and it was not. The sentence-keyed gate discriminates between those
    two cases correctly, which is worth recording against the claim that it is
    blind to mixed-source papers.

    Validation: 48/48 snippets verified (was 35), schema and terms pass, all five per-file gates and the whole-KB baseline gates green.

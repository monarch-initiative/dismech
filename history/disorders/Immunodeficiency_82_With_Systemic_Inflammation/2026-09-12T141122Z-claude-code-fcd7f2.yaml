  summary: 'Create: Immunodeficiency 82 With Systemic Inflammation (SYK, MONDO:0030308)'
  details: |
    De novo curation of IMD82, monoallelic SYK gain-of-function disease, from claim issue #11740.

    The entry models one upstream node, constitutive SYK kinase hyperactivation, branching into three: multi-organ inflammatory disease, impaired humoral immunity, and B cell lymphomagenesis. The second branch is the counter-intuitive one and is curated rather than dropped: an activating variant in a proximal immunoreceptor kinase predicts inflammation, and these patients also have reduced memory B cells, low IgM and IgG, and fatal infection. An OPEN_QUESTION discussion sets out the candidate explanations and says none is established by the curated evidence.

    Gain of function is recorded in both places the CLAUDE.md rule requires, because they are two claims: functional_impact_category GAIN_OF_FUNCTION on the variant genetic_context, and modifier GAIN_OF_FUNCTION on the kinase activity descriptor. The modifier is the qualitative value rather than INCREASED because the variants remove the kinase from normal autoinhibitory constraint rather than merely raising its level.

    Evidence base. Essentially the whole entry rests on one 2021 report of six patients. That is recorded as a KNOWLEDGE_GAP rather than left implicit, because it changes how the phenotype list should be read: it is the presentation of one ascertained series, not a frequency distribution. Both treatments carry evidence_source MODEL_ORGANISM and notes stating that efficacy was shown in the knock-in mouse and was partial there, with no human trial reported. The authors' phrase potentially treatable is quoted rather than upgraded, and is marked directness INDIRECT because it is a forward-looking claim resting on the mouse.

    Deep research required two runs and the first was discarded. The first openscientist report for this disease contained zero mentions of SYK and fifty of RIPK1: an entirely different disease. just preflight-dr returned FAIL and correctly said to discard it rather than cherry-pick. Re-running returned the identical report from the local deep-research cache in 0.01 seconds with cached true, because the cache is keyed on the query and the query was correct; the provider had simply answered the wrong question. Recovery required evicting the specific cache entry by hand, after which the re-run produced a correct report with 98 SYK mentions, zero RIPK1, a preflight PASS, and an OMIM number matching MONDO. Both the provider failure and the absence of a supported cache-bust path are filed as issue #11748; the off-target report and its cache entry are preserved outside the repository.

    The corrected report was read and deliberately not mined for additional citations. Its reference list is padded with general SYK biology that is not about this disease: mantle cell lymphoma BCR signalling, a SYK chemical-genetics mouse. Adding those would have inflated the apparent evidence base of an entry whose honest state is one source, which is the opposite of what the KNOWLEDGE_GAP records.

    One binding correction during curation: cache/hp/terms.csv holds HP:0002850 as Decreased circulating total IgM while a live OLS lookup returns Decreased circulating IgM concentration. Term validation is cache-first, so the live label failed. The cached label was used, matching the five existing KB entries that bind this CURIE, and the discrepancy is recorded in the phenotype notes and filed as issue #11750.

    Validation: just validate passed with 35/35 snippets verified; just validate-terms passed; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms and check-snippet-length all clean.

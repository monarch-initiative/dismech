  summary: 'Create: SNUPN-Related Muscular Dystrophy'
  details: |
    New entry for SNUPN-related muscular dystrophy with or without multi-system involvement (MONDO:0100584). Named SNUPN-Related Muscular Dystrophy, the form used in the 2026 Muelas et al. title; the MONDO label is kept as a synonym. LGMDR29 (MONDO:0971171), MONDO's only descendant, is recorded as a has_subtypes row for mapping, without stratified rows, because the ClinGen entity covers the same patients. Deep research run with the claude_code provider (research/SNUPN-Related_Muscular_Dystrophy-deep-research-claude_code.md): 12/12 references resolved, 7/7 quotes valid, preflight-dr PASS. Primary sources fetched with just fetch-reference: Nashabat 2024 (Nat Commun, 18 patients, full text; Table 1 rows quoted for frequencies), Iruzubieta 2024 (Brain, 5 patients and the Drosophila knockdown, full text), Muelas 2026 (adult-onset family), Okubo 2026 (spinocerebellar atrophy families and knock-in mouse), and the ClinGen CGGV record (Strong). Every HP code in Nashabat Table 1 was resolved against the HP cache or OLS before binding. One was not used: the table codes thin corpus callosum as HP:0200012, which HPO labels Short corpus callosum, so the entry binds HP:0033725 Thin corpus callosum and says so in notes and in the evidence explanation. Thin corpus callosum and congenital cataract have no upstream edge because no mechanism has been studied. Treatments are supportive (non-invasive ventilation, cataract surgery, physiotherapy, genetic counselling). No GeneReviews chapter (just check-genereviews NO_CHAPTER). Validated with just validate, validate-terms, check-entity-refs, check-causal-targets, check-name-collisions, check-snippet-grading, check-gene-validity, check-logical-rules, check-coarse-phenotypes and validate-disorders.

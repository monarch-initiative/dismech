  summary: Add the Brucella abortus pointer subtype required by design decisions 3e
  details: |
    PR Shepherd round on #14916. MONDO:0001973 is curated as its own entry (Brucella_Abortus_Brucellosis) but the parent carried no row for it, so the child was unreachable from the parent and design decisions 3e R20 was unsatisfied. check-granularity does not catch a missing pointer, only a mismatched one, which is why it passed.

    Added a has_subtypes row mirroring the existing melitensis pointer: classification etiologic_species, curated_in: Brucella_Abortus_Brucellosis, subtype_term MONDO:0001973, and one evidence item quoting the cached PMID:21346896 sentence naming B. abortus among the species of public-health concern. just check-granularity on the parent now reports POINTER 2 with no DANGLING_POINTER or POINTER_TERM_MISMATCH.

    Note for a maintainer: the melitensis review_notes justify not creating a brucellosis-species Grouping on the grounds that melitensis was the only curated species child. With abortus curated that no longer holds.

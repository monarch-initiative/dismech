  summary: Add the zoonotic acquisition node and move exposures onto validated PMIDs
    (#8302)
  details: |
    Third instance on the #8302 running list. All 17 pathophysiology nodes were downstream of established infection - the chain began at 'Intracellular macrophage survival' - so the three environmental entries, all of which describe acquisition and control context, could reach nothing. For a zoonosis, how the organism gets into a person is arguably the single most important environmental fact, and the pathograph had nowhere to put it. Added 'Zoonotic acquisition and inoculation' (ORGANISM, trigger) covering the occupational contact and food-borne routes, evidenced by the One Health review (PMID:37630630) naming both the risk-group occupations and the raw-milk route, and linked it into 'Intracellular macrophage survival' as INDIRECT_KNOWN_INTERMEDIATES with mucosal penetration and phagocytic uptake named as the unmodelled steps. Linked all three exposures into it: livestock-dependent setting PREDISPOSES (a determinant of contact rather than an exposure), maternal livestock exposure TRIGGERS/DIRECT (the exposure event itself, 70% of cases in that group), and inadequate One Health control infrastructure PREDISPOSES with unknown intermediates (it acts on the animal reservoir, and the review argues importance for control rather than measuring an effect on acquisition). On the DOI blind spot the issue raised: all four pre-existing DOI-prefixed snippets were checked by hand against their cached documents and all four verify, so the blind spot had not hidden a fabrication here. Two of them cite Microorganisms 11(8):2070, which does have a PMID, so those were moved to PMID:37630630 and are now checked by linkml-reference-validator rather than skipped; the maternal-health scoping review has no PMID (Beni-Suef University Journal is not PubMed-indexed) and necessarily stays on a DOI, recorded in notes. DOI-prefixed references in the entry went 44 to 43 and PMIDs 57 to 65. On the Research Square preprint: kept, but demoted from SUPPORT to PARTIAL and displaced as the primary support for the livestock-dependent-setting claim by PMID:37630630, with the decision and its reasoning recorded in notes - the objection was to its epistemic status, not its accuracy, and its snippet does verify. Bound maternal livestock exposure to ECTO:3000000 exposure to organism, the most specific applicable term (ECTO has no Brucella, livestock or raw-milk class, searched 2026-08-25); left the setting and infrastructure entries unbound as a regional-economic and a health-system determinant respectively. Validated with just validate (65/108 snippets verified, 43 skipped on DOI prefixes), just validate-terms, the batched just validate-disorders sweep, the duplicate-key, snippet-length, title-snippet, environmental-evidence and folded-hyphen gates, and pytest -k 'entity_ref or environmental_mechanism or Brucell' (7121 passed; the only 2 failures are the pre-existing alias-prefix ones in untouched files).

  summary: 'Full curation + preprint de-risking (issue #6229)'
  details: |
    Addressed issue #6229 for Brucellosis and did a full curation pass. Replaced load-bearing Research Square preprint (DOI:10.21203/rs.3.rs-4929733/v1) citations with peer-reviewed sources for classification (Pappas global-map review, PMID:16439329), definition/transmission and the fever/fatigue/arthralgia/endocarditis/arthritis phenotypes (Dean systematic review of clinical manifestations, PMID:23236528); the preprint now remains only on the already-caveated seropositivity prevalence record. Added frequency bands (fever FREQUENT 78%, arthralgia FREQUENT 65%, endocarditis VERY_RARE ~1%) and two new peer-reviewed phenotypes (sacroiliitis HP:0012317; epididymo-orchitis HP:0100796). Added pediatric/adolescent scope + 2-trial caveat to the doxycycline-gentamicin regimen (NMA DOI:10.1371/journal.pntd.0012405). Added three antimicrobial module conformance nodes (intracellular_pathogen_persistence, bacterial_protein_synthesis_inhibition, bacterial_rna_polymerase_inhibition) matching the drug mechanisms. Added a discussions section with three knowledge gaps (adult/focal regimen uncertainty; prognostic biomarkers; HUMAN_MODEL_MISMATCH on the in-vitro MHC-I immune-evasion mechanism), grounded in the Franco review (PMID:18045560). Validated: linkml schema, term validation, and manual snippet substring checks (validate-references reports 0 checks).

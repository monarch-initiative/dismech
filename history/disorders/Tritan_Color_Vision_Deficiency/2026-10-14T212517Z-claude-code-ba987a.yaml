  summary: 'Create: Tritan_Color_Vision_Deficiency'
  details: |
    Created the autosomal dominant tritan colour vision deficiency entry (MONDO:0008610, blue color blindness; OPN1SW, hgnc:1012) from the curation stub stubs/Blue_Color_Blindness.yaml, which this change deletes. The entry covers the whole inherited tritan series; acquired tritan defects are out of scope, and tritanopia and tritanomaly are not split into subtypes because family data (PMID:3872255) and the rod-intrusion explanation of anomalous tritan matches (PMID:17429491) argue against that subdivision.

    Content: autosomal dominant inheritance with incomplete penetrance and variable expressivity; two screening-based prevalence records; seven OPN1SW variants (L56P, G79R, T190I, S214P, P264S, R283Q and the intron 3 +5G splice-donor deletion); a seven-node causal chain from the heterozygous OPN1SW variant through two competing branches (misfolded mutant opsin leading to progressive S-cone degeneration, recorded as an emerging dominant-negative hypothesis; and halved S-opsin dosage from the splice allele, recorded as an emerging haploinsufficiency hypothesis) that converge on reduced S-cone signal and loss of the blue-yellow opponent signal; four phenotypes (tritan colour vision defect, tritanopia, HRR tritan plate errors, reduced S-cone ERG), all causally connected; diagnosis (tritan-sensitive colour testing, S-cone ERG, OPN1SW sequencing); three differential diagnoses (dominant optic atrophy, blue cone monochromacy, the 16q12 IRXB-duplication cone dystrophy with early tritanopia); and the S-opsin-null mouse recorded as FAILS_TO_RECAPITULATE for S-cone degeneration. No treatment section: no disease-specific treatment was found. No GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER).

    Deep research: one OpenScientist report (research/Tritan_Color_Vision_Deficiency-deep-research-openscientist.md). Reference validation 11/11 resolved, 0 off topic; preflight-dr PASS (OPN1SW mentioned 33 times, OMIM 190900 matches). Term validation flagged mislabelled or wrong suggestions that were not used: HP:0000496 (the report's 'Abnormality of color vision' is Abnormality of eye movement), UBERON:0001782 (pigmented layer of retina, not the photoreceptor layer), and CL:0000573 offered for S cones where CL:0003050 S cone cell is the specific term. The report describes the disorder as congenital, stationary and non-degenerative, inferring this from S-opsin-null mouse cone survival; that conflicts with the human adaptive optics study (PMID:17429491, not cited by the report), the T190I family age data and the 2026 review it does cite (PMID:42346125, which says progressive tritanopia), so the entry records a progressive course and the mouse as not recapitulating degeneration. Report citations used: PMID:23022137, 32400513, 42346125, 40769301, 21219924, 25605338, 33891002. Not used: PMID:41317340 (acquired tritan defects in multiple sclerosis, out of scope), PMID:38060327 (cone opsin gene therapy in a blue cone monochromacy model, not a tritan treatment), PMID:30443703 (quality of life in colour vision deficiency generally, not tritan-specific), PMID:15094734 (blue cone monochromacy testing). Most primary evidence came from PubMed searches outside the report (Weitz 1992, Gunther 2006, Baraas 2007, Went and Pronk 1985, Miyake 1985, Shinzato 1986, Pokorny 1981, Padmos 1978, Higgins 1983, Curcio 1991, Deeb 2004). The original P264S paper (PMID:1386496) and six early pedigree papers had no abstract or full text on retrieval and are named in notes rather than cited.

    Validation: just validate, validate-terms, count-verified-snippets (all snippets verified), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-block-scalar-comments and the whole-KB offline gates passed; validate-disorders run before commit.

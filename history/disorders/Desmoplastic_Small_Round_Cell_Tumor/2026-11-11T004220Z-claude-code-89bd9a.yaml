  summary: 'Desmoplastic small round cell tumour: evidence on the two mechanism edges,
    a stromal reaction node and the first differential diagnoses'
  details: |
    The entry had three mechanism nodes whose two edges carried no evidence, and no differential diagnoses. This pass adds evidence to both edges, one mechanism node, more evidence on two existing nodes, and a differential_diagnoses section. Part of the neuroblastoma-related series (issue 15822): the tumour is one of the small round cell tumours of childhood. Nothing was removed; the two edge descriptions were rewritten and three sentences were added to the description of the fusion node.

    Edges. EWSR1-WT1 Fusion Oncogene to PDGFA Activation is now typed DIRECT, with the 1997 study that identified PDGFA as a target (PMID:9354795): induction in an inducible cell model, no regulation by wild-type WT1, and expression in the tumour cells of primary tumours. EWSR1-WT1 Fusion Oncogene to Multiphenotypic Differentiation is typed INDIRECT_UNKNOWN_INTERMEDIATES, because no study cited shows which targets produce the mixed marker expression; its two evidence items are graded directness INDIRECT.

    New node. Desmoplastic Stromal Reaction (TISSUE, fibroblast), with an edge from PDGFA Activation that rests on the authors' own conclusion that PDGFA contributes to the reactive fibrosis; the description says that the response of the stromal fibroblasts was not measured.

    More evidence. The fusion node gains the first molecular study (PMID:8187063), the breakpoint study (PMID:7862627), a cell-line study showing dependence on the fusion (PMID:32345977, IN_VITRO) and a 2024 study showing that both isoforms are needed for tumour formation (PMID:39198430, graded MODEL_ORGANISM because the tumours were xenografts in mice). The multiphenotypic node gains the first series of 19 cases (PMID:1709557) and a 2021 review's list of markers (PMID:33525546).

    Differential diagnoses. Four rows, the round cell neoplasms that the 2021 review names: Ewing sarcoma (MONDO:0012817), rhabdomyosarcoma (MONDO:0005212), malignant mesothelioma (MONDO:0006292) and small cell carcinoma (MONDO:0000402). Ewing sarcoma and malignant mesothelioma use the MONDO terms of their own entries. The review names no subtype, so rhabdomyosarcoma and small cell carcinoma use the generic terms: MONDO:0005212 is already used in three entries, MONDO:0000402 is new to the cache, and both were read through OLS on 11 November 2026. The Ewing sarcoma row has three distinguishing features, each with its source; the other three rows rest on the review's statement that the EWS-WT1 translocation separates DSRCT from the others. The rhabdomyosarcoma row also records, from the review and from the first series, that DSRCT itself reacts for desmin, a muscle marker; it draws no conclusion from that.

    Sentences that the entry already quoted keep their evidence_source (the PDGFA induction sentence IN_VITRO, the authors' conclusion HUMAN_CLINICAL). Five references are new to the cache. Left for a later pass: the five phenotypes and three treatments still carry no evidence.

    Validation: just validate, validate-terms and validate-disorders pass; 44 of 44 snippets verify against the cached references; the whole-repo gates and the kb test lane were run locally and pass. Term validation added cache rows for MONDO:0000402.

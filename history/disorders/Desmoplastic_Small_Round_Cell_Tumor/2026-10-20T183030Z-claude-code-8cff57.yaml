  details: |
    Rebinds cyclophosphamide in the Multi-Agent Chemotherapy treatment's therapeutic_agent list from CHEBI:4026 (cyclophosphamide hydrate, which ChEBI defines as the monohydrate of cyclophosphamide) to CHEBI:4027 (cyclophosphamide), matching the descriptor's preferred_term and the binding already used for cyclophosphamide in 45 other kb entries, including Neuroblastoma, where the same correction was made in maintainer PR 7114. Both CURIEs and labels were re-checked in OLS and cache/chebi/terms.csv; CHEBI:4027 is in the chemical-entity enum cache. Validation on both changed entries: just validate, validate-terms, check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-gene-activity-grounding --against-ref origin/main, and validate-disorders (132 snippets and 179 titles checked, 0 issues). Part of the neuroblastoma PR series tracked in issue 14976.

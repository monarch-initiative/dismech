  summary: 'Create: NAD(P)HX Dehydratase Deficiency'
  details: |
    De novo curation of NAXD deficiency / PEBEL2 (MONDO:0034121). An openscientist deep-research report was generated and used as leads only; its preflight flagged NAXE contamination (25 mentions vs 52 for NAXD) and the NAXE-derived clinical findings were deliberately excluded. One CURIE the report proposed was wrong: HP:0100697 offered as 'Necrosis of the skin' is actually Malignant peripheral nerve sheath tumor; HP:0033126 Cutaneous necrosis was substituted after checking HPO directly. Every report PMID used was verified against PubMed first. has_subtypes splits the disease by NAXD isoform (combined cytosolic+mitochondrial vs mitochondrial-restricted), with a KNOWLEDGE_GAP recording that the split rests on ~12 patients. Two environmental entries model the febrile and head-trauma triggers via influences_mechanisms; both exposure_terms are deliberately unbound with a recorded ECTO search. Validated: just validate (51/51 snippets verified), validate-terms, check-entity-refs, check-causal-targets, check-enum-values all pass.

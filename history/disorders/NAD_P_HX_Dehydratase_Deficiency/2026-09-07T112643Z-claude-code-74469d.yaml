  summary: 'Post-approval correction: false grep claim in notes, missing subtype key'
  details: |
    Two non-blocking items raised in the approving review, taken because one of them was a false statement. The notes claimed that a grep of the cached NAXD sources returns no fever-management sentence to quote. That is wrong: PMID:34161859, a NAXD paper cached in this PR, describes a patient managed on antibiotics, antipyretics and antiepileptics. The reviewer was right, and the sentence is rewritten to claim only what is true, that no committed reference recommends fever management, with the counterexample named and the reason it cannot support a treatment entry stated: it reports what one child received before she died rather than recommending antipyresis. The counselling half of the original claim was re-verified by the reviewer and by me and stands. Also added subtype Mitochondrial isoform to the Peripheral neuropathy phenotype, which its description already asserted in prose and which its sibling Muscle weakness, derived from the identical source sentence, already carried; the structured field and the prose had disagreed for one of the two. This push dismisses the approval the entry had just received, which is the correct trade: a knowingly false sentence about repository state is the same defect class this batch has been correcting elsewhere. Validated: just validate (58/58 snippets verified), validate-terms, check-enum-values.

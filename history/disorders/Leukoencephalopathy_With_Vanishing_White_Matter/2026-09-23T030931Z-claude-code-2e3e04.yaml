  summary: Add 2025 consensus diagnostic definition and birth-prevalence estimate
    (#10427)
  details: |
    Added a DIAGNOSTIC_CRITERIA definitions block from the 2025 VWM consortium Delphi guideline (PMID:41232062): diagnosis rests on clinical features plus the characteristic MRI pattern plus biallelic EIF2B1-5 variants; a typical MRI with a single variant prompts a search for a second variant in trans; a VWM-like MRI with no EIF2B1-5 variant makes VWM unlikely (mitochondrial leukoencephalopathy the main alternative). Guideline Table 2 is absent from the cached full text, so the imaging requirement is summarized from the Figure 1 legend and recorded as such in notes. Added a BIRTH_PREVALENCE record from the guideline's estimated live-birth incidence of ~1:100,000, kept alongside the existing qualitative RARE record. Items 3-5 of #10427 (astrocyte/oligodendrocyte framing, animal models, cns_myelin_failure conformance) and the VWM1-5 subtype/mapping route were deliberately left alone. Four new snippets verified against the cache; just validate, validate-terms, check-entity-refs, check-enum-values pass.

  summary: Update VWM for the guanabenz phase 1/2 trial, fosigotifator study, and
    ISR-activating anaesthetics
  details: |
    Addresses items 1 and 2 of issue 10427 plus the first cleanup in item 6.

    Item 1 (guanabenz is no longer investigational-in-mice). The ISR Modulation treatment closed with 'These remain investigational and are not established human therapies', citing only mouse work from 2017 and 2019. That sentence is now wrong about guanabenz. Rewrote the description around the completed single-arm phase 1/2 trial (PMID:42586097, Lancet Neurol 2026) and added three human-clinical evidence items to the treatment: the primary efficacy result (HR 0.33, log-rank p=0.0061 for time to loss of walking with support, 33 treated vs 66 matched historical controls), the serious-adverse-event rate (63 events in 76% of patients), and the authors' own tolerability conclusion. The description keeps the non-randomised design and the call for a long-term extension study, so guanabenz reads as investigational-with-a-human-efficacy-signal rather than established.

    Added the clinical_trials block the entry lacked entirely, with both ISR-modulation arms. The guanabenz trial has no ClinicalTrials.gov identifier - it is registered on the EU Clinical Trials Register (EudraCT 2017-001438-25) and CTIS - so it is keyed on its WHO ICTRP record, ICTRP:EUCTR2017-001438-25-NL, fetched with just ictrp-fetch. The fosigotifator study NCT05757141 (raised by kevinschaper on the issue) is the second arm and is mechanistically distinct: a direct eIF2B activator against guanabenz's indirect action through eIF2 phosphorylation. Both are curated PHASE_II because ClinicalTrialPhaseEnum has no combined phase 1/2 value; the reason is recorded in each trial's notes. Status for NCT05757141 is RECRUITING per the ClinicalTrials.gov record verified 2026-06.

    Item 2 (consensus guidelines), drug half only. The 2025 Delphi guideline (PMID:41232062, Neurology) sorts clinically used drugs by their effect on the integrated stress response. Curated the one class the guideline says has clinical rather than theoretical evidence - inhalation anaesthetics - as an environmental entry bound to ECTO:2000059 (exposure to anesthetics), with influences_mechanisms EXACERBATES pointing at the existing Deregulated Integrated Stress Response node. Entry-level evidence is the cohort figure (anaesthesia a provoking factor in 16% of patients with episodes of acute decline); the link carries its own evidence for the ISR-activation mechanism and the propofol substitution. The guideline's remaining drug classes are deliberately not curated and the reason is recorded in the entry's notes, quoting the guideline's own statement that the risk is theoretical for other drugs.

    Item 6, first bullet: removed the deprecated percentage: Rare field from the prevalence record, which already carried prevalence_class: RARE.

    Deliberately NOT done, and left on issue 10427: item 3 (the astrocyte-primary framing revision), item 4 (animal_models, where the R191H-to-human-variant correspondence is still unsourced), item 5 (conforms_to cns_myelin_failure), the definitions block for the MRI and genetic diagnostic criteria, and the mappings/has_subtypes route for the VWM1-5 sibling terms. Items 3 and 5 are linked judgement calls that the prior issue assessment flagged as needing a human decision rather than a silent agent one.

    Validation: just validate (schema, terms, references) passed with 41/41 snippets verified against the cache. check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-enum-values and check-reference-titles all pass. New cache files committed: PMID_42586097, PMID_41232062, clinicaltrials_NCT05757141, ICTRP_EUCTR2017-001438-25-NL.

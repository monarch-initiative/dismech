  summary: Align Vanishing white matter leukoencephalopathy with OMIMPS:603896
  details: |
    The January 2026 series contains five numbered forms, one for each EIF2B subunit gene. This Disease already covers EIF2B1 through EIF2B5, with age-at-onset rather than gene identity as its clinical subtype axis. Their shared eIF2B/integrated-stress-response disorder supports syndrome-level alignment while retaining gene-level annotations and variable onset. The series is not interchangeable with its first EIF2B1-related numbered record.

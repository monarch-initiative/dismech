  summary: 'VWM: revise astrocyte-primary framing with cell-specific Eif2b5 data'
  details: |
    Addresses item 3 of issue #10427. The entry modelled astrocytes as the sole primary cell type, with oligodendrocyte dysfunction as a secondary consequence. PMID:40326783 (Brain 2025) separates the contributions with cell-specific Eif2b5 conditional mice: the oligodendrocyte-restricted line develops gait ataxia matching the whole-body mutant with numerous unmyelinated axons and immature cycling oligodendrocytes, while the astrocyte-restricted line reproduces the ATF4 transcriptome and intramyelinic vacuolization but leaves oligodendrocyte density and maturity normal and causes only very mild ataxia. Added a new pathophysiology node, Cell-Autonomous Oligodendrocyte Maturation Failure, fed directly from the ISR node and feeding the white-matter rarefaction node, so the oligodendrocyte arm is no longer modelled as downstream of the astrocyte. Softened the astrocyte node description and the entry description accordingly, and re-pointed the Cnp-2b5 animal model link from the astrocyte node to the new node, where it is RECAPITULATES rather than PARTIALLY_RECAPITULATES. Conformance to cns_myelin_failure (item 5) was deliberately not added: that module scope note names VWM as a canonical near-miss that must not conform at the trigger or oligodendrocyte nodes. Validation: just validate, validate-terms, validate-disorders, count-verified-snippets (111/111), check-causal-targets, check-entity-refs, check-logical-rules, check-snippet-grading, check-gene-activity-grounding, check-coarse-phenotypes, check-enum-values, check-duplicate-keys, check-folded-hyphens, check-name-collisions all pass.

  details: |
    Review round on PR 11253, answering the four blocking findings of the 2026-09-06 ai4c-reviewer review plus two of its non-blocking suggestions. All four findings were in code the PR itself had touched.

    Finding 1, missing reference_title. The fosigotifator clinicaltrials:NCT05757141 evidence item was the only one of eleven new items without reference_title. Copied it verbatim from the title frontmatter of references_cache/clinicaltrials_NCT05757141.md, per the rule that a citation string is copied from the cache and never composed.

    Finding 2, the ISR Modulation treatment did not join the pathograph. It had no target_mechanisms, so a treatment named for eIF2B activity enhancement was invisible to the causal graph while this PR was linking an ISR-activating exposure into the same node - the graph asserted anaesthesia pushing the ISR with nothing pushing back. Added a target_mechanisms link to the bare node name Deregulated Integrated Stress Response (bare name, not the pathophysiology# entity-reference form, which target slots in the causal graph do not use) with treatment_effect INHIBITS. The link carries its own evidence, separate from the treatment's: PMID:42586097's background statement that guanabenz inhibits the stress response and showed benefit in a mouse model, graded MODEL_ORGANISM because the benefit that sentence reports is the mouse result rather than the trial's own human outcome; and the guideline statement (PMID:41232062) that both curated agents activate eIF2B indirectly or directly, which is what makes them one treatment link on this node rather than two unrelated drugs.

    Finding 3, only one of two named agents was machine-queryable. The rewritten description names fosigotifator as a second agent and the entry carries a whole clinical_trials record for it, but therapeutic_agent listed guanabenz alone. Added fosigotifator. The reviewer offered NCIT:C203230; CHEBI is preferred for a specific small molecule and CHEBI:759733 (fosigotifator) exists, resolves through the same ols:chebi adapter term validation uses, and is reachable from CHEBI:24431, so the CHEBI term was bound instead. Kept both agents in one treatment rather than splitting: they are one modality acting on one node, and the description already distinguishes indirect from direct eIF2B activation.

    Finding 4, the environmental block omitted the disease's hallmark triggers. The PR introduced environmental: and populated it only with anaesthesia, a factor in 16% of acute-decline episodes, leaving febrile infection and minor head trauma - the defining VWM provoking factors, already carried by the entry's own summary and by the Stress-Provoked Neurological Deterioration node - with no exposure node at all. The result was a pathograph asserting that the exposure driving the ISR in VWM is anaesthesia. Added both, with evidence that was already on disk.

    Febrile infection gets two mechanism links because the guideline supports two distinct claims: EXACERBATES into Deregulated Integrated Stress Response (fever activates the ISR the eIF2B defect has already deregulated - EXACERBATES rather than TRIGGERS, since the genetic defect and not the infection establishes the deregulated state), and TRIGGERS into Stress-Provoked Neurological Deterioration, causal_link_type INDIRECT_KNOWN_INTERMEDIATES, because the episode does not occur without a stressor and the ISR node is the intermediate. Minor head trauma is linked only to the deterioration node with TRIGGERS: it is the second most common trigger of acute decline, but no source in the cache states that it acts by activating the ISR, and the entry says so explicitly rather than assuming the fever mechanism generalises.

    Both new exposures are deliberately left ontology-unbound, with the search recorded in each block's notes. ECTO has no class for infection or fever as an exposure - only named-pathogen children of ECTO:3000000 and named-virus children of ECTO:3000001, where the curated exposure is any febrile infection and what the guideline says acts on the ISR is the fever, not the organism - and no branch for physical trauma or injury at all. ECTO:4000001 is ambient rather than body temperature and is not a substitute; the environmental-term-audit's reuse suggestion of ECTO:0010003 (exposure to environmental physical object quality) for head trauma does not denote a traumatic impact and is rejected in the notes. exposure_term is omitted entirely rather than carrying a free-text preferred_term with no term:, so the audit reports these as UNBOUND rather than as the PARTIAL state that looks grounded without being grounded.

    Two non-blocking suggestions taken. Added HP:0002540 (Inability to walk) to the guanabenz trial's target_phenotypes, which maps the trial's stated primary efficacy outcome - time to loss of walking with support - where the existing ataxia and spasticity terms did not. Added directness: DIRECT to the two guanabenz evidence items that lacked it: both quote the trial's own reported safety and tolerability results and so assert the claim directly, which makes the trio consistent and records an assessment actually made rather than a default.

    Two suggestions deliberately not taken. The exposure named ISR-activating inhalation anaesthetics is left as it is: the reviewer's own reading is that the broad ECTO:2000059 binding is right because the propofol substitution only makes sense at the class level, and renaming the entry to match the binding would lose the reason the class was curated. The observation that the NCT05757141 notes describe a PHASE1|PHASE2 / RECRUITING record the summary-only cache does not contain is a property of the ClinicalTrials.gov fetcher, not of this entry, and is left for a fetcher change rather than papered over here.

    Nothing was changed about items 3, 4 and 5 of issue 10427 (astrocyte-primary framing, animal_models, conforms_to cns_myelin_failure). The reviewer agreed those are human judgement calls; they stay open on the issue.

    Validation: just validate passed with 50/50 snippets verified against the cache (41/41 before this round), schema clean, terms clean. check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-environmental-evidence, check-folded-hyphens and check-reference-titles all pass. The causal graph builds with an empty orphan_targets set and all four new edges present. check-snippet-length, check-title-snippets and check-snippet-grading report findings only in MPI-Congenital_Disorder_of_Glycosylation and ZNF407-Related_Neurodevelopmental_Disorder - entries this branch does not touch, whose branch copies predate fixes made on main in the 279 commits since the branch was cut; zero findings in this file. One new cache row was written by term validation for CHEBI:759733; the incidental full-text refetch churn on six unrelated PMID caches was reverted.

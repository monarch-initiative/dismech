  summary: 'Genetics pass: wire five EIF2B genes into the pathograph and narrowMatch
    the five per-gene MONDO leaves'
  details: |
    Genetics pass for the d2g gap list in issue #12258 (series-051). The five EIF2B subunit genes were already present in `genetic:` with HGNC bindings, inheritance and evidence, but none reached the pathograph: gene-to-mechanism wiring measured 0/5 and phenotype causal inlink 0/9.

    Changes. (1) All five genes (EIF2B1 hgnc:3257, EIF2B2 hgnc:3258, EIF2B3 hgnc:3259, EIF2B4 hgnc:3260, EIF2B5 hgnc:3261, each read live from rest.genenames.org) are bound as `genes:` descriptors on the first pathophysiology node, "eIF2B Translation Initiation Complex Deficiency". That node, not five per-subunit nodes, is the right home: two independent cohorts report that which subunit gene is mutated does not predict the phenotype (PMID:15136673, 83 individuals; PMID:34745209, 341 patients), and both are now cited on the node as the reason the wiring is complex-level. Gene wiring 0/5 -> 5/5.

    (2) `mappings.mondo_mappings` records the five per-gene MONDO leaf classes (MONDO:0020507, MONDO:0957870, MONDO:0957871, MONDO:0957872, MONDO:0957873) as `skos:narrowMatch`, each justified by the `genetic:` record that is the dismech locus for it. All five were confirmed by OLS hierarchicalParents to be direct children of this entry's own MONDO:0800448 anchor, and their RO:0004003 gene assertions were read from the OLS v2 class records (3257, 3258, 3259, 3260, 3261 in numeric order). They are deliberately NOT has_subtypes rows: `has_subtypes` here carries the age-at-onset axis, which three phenotypes already key on with `subtype:`, and `subtype:` is single-valued. This is the retirement route stubs/Leukoencephalopathy_With_Vanishing_White_Matter_5.yaml itself proposed; that stub is deleted in the same change.

    (3) Per-gene `case_fractions` added to all five records from PMID:34745209 (1.5, 15.2, 11.1, 10.3 and 61.9 percent of 341 patients for EIF2B1-5 respectively), with cohort_size 341.

    (4) Two sourced mechanism-to-phenotype edges: "Progressive White Matter Rarefaction and Cavitation" -> Leukoencephalopathy and "Stress-Provoked Neurological Deterioration" -> Coma, both quoting PMID:9109866. Phenotype causal inlink 0/9 -> 2/9. Ataxia, spasticity, optic atrophy, cognitive decline, personality change, premature ovarian insufficiency and seizures were deliberately left unwired: the sources consulted state them as disease characteristics, not as consequences of a named node, and an edge added to move the metric would be an unsourced claim.

    (5) EIF2B5 `notes` records that severity varies by allele within the gene (PMID:20975056, p.Arg113His vs p.Thr91Ala), with that paper cited as evidence on the record.

    Validation. linkml-validate no issues; linkml-term-validator passed; reference validation 64/64 snippets and 65 titles, 0 issues, under linkml-reference-validator 0.3.0rc3 with --no-full-text. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-case-collisions, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-coarse-phenotypes all OK. list-gene-term-mismatches --resolve: 22 bindings across both changed entries, 22 compared against HGNC, 0 mismatches, 0 uncached. No references_cache churn to revert.

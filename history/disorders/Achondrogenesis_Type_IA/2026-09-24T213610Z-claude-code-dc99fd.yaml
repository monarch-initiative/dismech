  summary: 'Create: Achondrogenesis_Type_IA'
  details: |
    New entry for achondrogenesis type IA (MONDO:0008701, TRIP11). The Perplexity deep-research report (research/Achondrogenesis_Type_IA-deep-research-perplexity.md) was used as a lead list only. preflight-dr returned PASS (TRIP11 mentioned 114 times, OMIM 200600 matches). The report carried no citation or term validation sections at generation time, so both were added: validate-research-reference resolved its one PMID, PMID:20065354, which is an unrelated leukemia paper the report attributed to Smits et al. 2010 NEJM; the real paper (PMID:20089971) was found by PubMed search and cited instead. validate-research-terms found 2 nonexistent HP CURIEs (HP:0002985, HP:0005485), 2 obsolete terms (GO:0006486, NCIT:C28048) and 11 CURIEs naming unrelated terms (e.g. CL:0000128 oligodendrocyte for osteoblast, NCIT:C533 Guanosine for genetic counseling, UBERON:0001810 nerve plexus for growth plate); no CURIE was taken from the report, and every binding was looked up in the local caches, sqlite:obo:hp/mondo/hgnc or OLS. The report also gave ORPHA:932 (the achondrogenesis group) as the subtype record; MONDO's xref is ORPHA:93299. Evidence comes from 13 PubMed records fetched with just fetch-reference: gene discovery and mouse (20089971), patient series and case reports (23956106, 29872333, 34057271, 31903676, 3275766), patient-cell mechanism (30728324 abstract only, 30518689, 25717001), conditional mouse models (29180569, 35147267), the ACG1B/ACG2 radiographic distinctions (31523626), and one clinically diagnosed family arguing against recessive segregation (30951048, recorded as REFUTE). Snippets from the cached full text of PMID:30728324 (full_text_html) fail validate-disorders, which treats that cache as abstract-only, so only its abstract is quoted. No GeneReviews chapter exists (check-genereviews: NO_CHAPTER). Validated with just validate, validate-terms, count-verified-snippets (101/101), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-snippet-length, check-title-snippets, check-snippet-grading, check-folded-hyphens, check-coarse-phenotypes, check-reference-titles and validate-disorders, all passing. 13 of 14 phenotypes are causally connected; hydrops fetalis is left unconnected because no source explains it.

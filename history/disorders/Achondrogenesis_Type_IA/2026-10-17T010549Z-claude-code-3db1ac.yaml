  summary: Bind the fetal nuchal translucency LOINC measurement code
  details: |
    LOINC tranche K batch 2. This entry reports an actual measured nuchal translucency value (4.3 mm at 14 weeks) on its own phenotype node and in the Prenatal Ultrasound diagnosis row's evidence, unlike the other two nuchal-translucency candidates examined in this batch (Tonne-Kalscheuer_Syndrome and CHRNA1-associated_Fetal_Hypo-akinesia_Disorder_of_Prenatal_Onset, both declined for naming NT only as a categorical soft finding with no reported value). Bound LOINC:33069-6 (Fetal nuchal translucency measured by US), the raw ultrasound measurement code, rather than the combined first-trimester screening-panel code (LOINC:49086-2) or the trisomy-risk-calculation codes bundling NT with serum markers (LOINC:49030-0, LOINC:88004-7), since this entry's NT finding is used as a nonspecific skeletal-dysplasia marker, not an aneuploidy risk calculation. Code verified by a fresh Monarch KG entity lookup and confirmed absent from origin/main before seeding.

  summary: 'Create: Oropouche Fever'
  details: |
    Created Oropouche Fever (MONDO:0000345), an emerging Culicoides-borne orthobunyavirus arbovirosis. Deep research via claude_code provider. Modelled causal chain from Culicoides inoculation and NSs IFN-antagonism through viraemia to three branches: hepatotropism/coagulopathy (PMID:42377030 mouse models), CNS neuroinvasion (PMID:42742818 Panama case series), and transplacental vertical transmission to fetal neurodevelopmental injury (PMID:42811037 embryonic-mouse model; PMID:42896562 pregnancy cohort). Phenotypes, agent/transmission/life-cycle, progression (biphasic recurrence), 2024 outbreak prevalence, supportive-care treatment. Term confabulations in the DR report (NCBITaxon:71617 'Culicoides', NCBITaxon:161674 'sloth', HP:0007177 'GBS') were caught by report term-validation and re-looked-up independently; bindings use NCBITaxon:118655, NCBITaxon:1027879, NCBITaxon:9354 and HP:0007131. Validated: just validate (schema+terms+31/31 snippets), entity-refs, causal-targets, granularity (deterministic classes clean), coarse/qualifier/logical/enum/duplicate-key gates, snippet-length/title/grading/reference-titles. preflight-dr SKIP (no causal gene; infectious).
    Self red-team review (fresh-context subagent) applied before PR: fixed a double-negated modifier on the NSs IFN-antagonism node, rebound the liver-enzyme phenotype from the ALT-specific HP:0031964 to the broader HP:0002910, replaced a timing snippet with the clathrin-entry quote on the entry node, split the hepatotropic node into TISSUE infection and ORGANISM coagulopathy, wired 14/15 phenotypes into the pathograph (GBS left disconnected as post-infectious autoimmunity), added a diagnosis section and a vertical-transmission route.

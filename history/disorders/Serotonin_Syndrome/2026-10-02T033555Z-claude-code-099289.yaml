  details: |
    Per curator, a 10-source batch, used selectively to avoid redundant case-report pile-up (reviewer had noted class-level sources anchor better than more cases). USED: PMID:41194881 (FAERS disproportionality, 68 drugs) and PMID:39866251 (primary-care series, mild SS after a second antidepressant) added to the etiology node for drug breadth and the common second-agent route; PMID:40704237 added for SS at stable therapeutic doses without overdose; PMID:40510098 added as a Kava environmental entry WITHOUT an influences_mechanisms link, because kava has no established serotonergic mechanism and the concurrent duloxetine->venlafaxine transition is itself sufficient (honest non-overclaim; ECTO has no kava term, searched); PMID:41111752 added to Muscle rigidity (rigidity can mask the hyperreflexia/myoclonus used to diagnose); PMID:41348645 added to Seizure (massive-overdose case with spontaneous clonus and seizures). NOT separately modeled, as corroborating existing content: PMID:41415936 (pediatric SS/NMS overlap, already covered by 41652380), PMID:41282384 (OTC cold-med/SSRI), PMID:40696580 (linezolid+pentazocine) - both instances of the drug breadth FAERS captures; PMID:39877701 (rat sertraline-prodrug PK study) is not about SS causation or phenotype and was not used. Validated: validate-disorders clean, entity-refs/environmental-evidence/snippet-grading clean. Branch is current with origin/main (merged earlier at 01b563f16).

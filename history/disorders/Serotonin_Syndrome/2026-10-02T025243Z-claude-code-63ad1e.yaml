  summary: Add ayahuasca+serotonergic agent as an environmental trigger
  details: |
    Per curator request. Added an environmental entry for ayahuasca combined with a serotonergic agent, influences_mechanisms TRIGGERS -> Excess Synaptic Serotonin, cited to PMID:42713547 (severe SS with acute respiratory failure after ayahuasca + OTC dextromethorphan). Mechanism: ayahuasca's beta-carboline alkaloids are reversible MAO-A inhibitors, so combined with another serotonergic agent it raises synaptic serotonin - the same MAOI-plus-serotonergic pairing as prescription MAOIs. No ECTO class for ayahuasca/harmine/DMT (searched l~ayahuasca, l~harmine, l~dimethyltryptamine in sqlite:obo:ecto, all empty), so exposure_term omitted with the search recorded in notes. Validated: validate-disorders clean, environmental-evidence/causal/entity-refs clean.

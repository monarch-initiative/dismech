  summary: 'Create: Serotonin Syndrome'
  details: |
    De-novo curation of serotonin syndrome (MONDO:0018546), a drug-induced toxidrome. Deep research requested from falcon via --fallback; no falcon key, so claude_code produced the report (frontmatter records fell_back). Report was honest about unverified claims; every snippet in the entry comes from independently fetched PubMed records. Causal chain: excess synaptic serotonin -> 5-HT2A/5-HT1A receptor overactivation -> neuromuscular hyperexcitability / central noradrenergic hyperactivity / autonomic hyperactivity -> clinical triad, with sustained muscle activity -> hyperthermia and rhabdomyolysis. Mechanism and treatment rationale anchored to the Nisijima rat clorgyline+5-HTP model (5-HT2A antagonists abolish hyperthermia and the hypothalamic NA surge; animal edges graded MODEL_ORGANISM/INDIRECT). Clinical features from Sternbach PMID:2035713, Volpi-Abadie PMID:24358002, Hunter criteria PMID:12925718, Werneke meta-analysis PMID:27406219, fatal-case review PMID:33196298. Treatments: discontinuation/supportive (NCIT:C15747), cyproheptadine (5-HT2A antagonist, CHEBI:4046) INHIBITS the receptor node, benzodiazepine sedation. No causal gene or inheritance (acquired toxidrome); pharmacogenetic modifiers noted as unestablished. Hyperthermia bound to HP:0001945 (Fever) not HP:0002047 (Malignant hyperthermia). Validated: validate-disorders 32/32 snippets, entity-refs, causal-targets, enum, duplicate-keys, coarse-phenotypes, model-scale-audit all clean; 12/12 phenotypes causally connected; GeneReviews NO_CHAPTER.

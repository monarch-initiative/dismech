  summary: 'Enrich pathophysiology: muscle hyperthermogenesis, seizure mechanism nuance,
    consensus gap'
  details: |
    Per curator, a 6-source enrichment batch. USED: PMID:33508784 (drug-induced hyperthermic syndromes review) and PMID:30056864 (SS rat metabolome: anaerobic muscle hypermetabolism + UCP-3 -> hyper-thermogenesis) added to the Neuromuscular Hyperexcitability -> Hyperthermia edge, giving the muscular/metabolic basis of the heat; PMID:36297366 (rat) added to the Seizure phenotype as a REFUTE for the serotonergic attribution - tramadol-overdose seizures are mainly GABAergic, not serotonergic; PMID:28943544 (general-hospital MS-vs-SS series) added to the NMS differential (MS more frequent than SS; differential often difficult); PMID:38855279 (consensus controversy) opened a new discussions KNOWLEDGE_GAP on SS terminology/criteria/pathophysiology, attaches_to diagnosis#Hunter Serotonin Toxicity Criteria. NOT USED: PMID:39621873 (serotonin autoxidation to amyloid-like nanoassemblies) - an in-vitro basic-chemistry paper that only mentions SS in one passing clause among many conditions; using it as SS pathophysiology would overclaim a speculative mechanism not shown in SS. Validated: validate-disorders clean, entity-refs/causal-targets/snippet-grading clean.

  summary: 'Gene-family review: PEX2'
  details: |
    PEX2 landed on the genotype node 'Biallelic PEX2 Genotype With Residual Peroxin-2 Function', which named only a biological process. That node now binds ubiquitin protein ligase activity (GO:0061630, DECREASED), the RING E3 activity whose partial loss the genotype causes, supported by the PMID:21392394 statement that the PEX2, PEX10 and PEX12 RING fingers act as ubiquitin ligases for PEX5. The genetic record was already typed CAUSATIVE with germline origin; ClinGen's PEX2 assertion is for the parent MONDO:0019234, so no tier was copied here.

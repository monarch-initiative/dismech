  summary: 'Create: Peroxisome_Biogenesis_Disorder_5B'
  details: |
    New entry for the mild, non-Zellweger band of PEX2-related peroxisome biogenesis disorder (MONDO:0013933, OMIM 614867). Curated as a standalone Disease entry following the repository's existing A/B granularity (4A/4B, 11A/11B) and MONDO's separate identifiers for 5A and 5B under the shared PEX2 parent MONDO:0100260; PBD5A is not curated here. Two has_subtypes rows: the childhood-onset ataxic form (three patients in two families) and the neonatal adrenoleukodystrophy / infantile Refsum presentation (individually reported patients). Seven-node pathograph from the residual-function biallelic PEX2 genotype through partial RING ubiquitin-ligase loss, partial matrix-protein import failure with peroxisomal mosaicism and catalase-less peroxisomes, residual beta-oxidation and ether-lipid synthesis, branched-chain fatty acid accumulation, cerebellar neurodegeneration, peripheral axonal degeneration and multisystem disease; four nodes conform to peroxisomal_metabolic_failure. Deep research: falcon returned HTTP 402 and the claude_code fallback produced a report about PEX5 rather than PEX2, i.e. the PBD2A/2B locus already curated here as Peroxisome_Biogenesis_Disorder_2B. preflight-dr returned SKIP because MONDO records no causal gene for MONDO:0013933, so the manual OMIM check was run instead and the report failed it. The report was NOT committed; it was kept in the session scratchpad and the entry was curated from primary literature only. The second opinion on claim issue #12952 was read and acted on: PMID:10652207 was added for the PEX2 domain/severity rule, and the overlap with the PEX2-ZSD subtype row on Zellweger_Spectrum_Disorders.yaml is recorded in notes. Phenotype frequencies are deliberately absent and the entry labels every claim as PEX2-specific or Zellweger-spectrum-general.

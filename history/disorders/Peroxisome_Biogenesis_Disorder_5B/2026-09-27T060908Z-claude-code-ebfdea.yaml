  summary: 'Review round 1 fixes: deep-research report added, module conformance retargeted,
    three evidence repairs'
  details: |
    Response to review 5328690280 (ai4c-reviewer, CHANGES_REQUESTED) on commit b709586b65.

    Deep-research report. The first attempt returned the same report that had
    already been discarded for being about PEX5: the deep-research client served
    it from cache (frontmatter cached: true, duration 2.46 s), so restating PEX2
    in the template variables changed nothing. Re-running with --no-cache
    produced a genuine 339 s run that is about PEX2: 86 PEX2 mentions against 7
    for PEX5, and the overview correctly separates OMIM #614867 (PBD5B, this
    entry) from the allelic #614866 (PBD5A/Zellweger). just preflight-dr returns
    SKIP rather than PASS because MONDO records no RO:0004003 causal gene for
    MONDO:0013933, so the automated gene check cannot discriminate; the manual
    OMIM check it falls back to passes, since MONDO's only OMIM exact match for
    this term is 614867 and the report's primary entity is 614867. Report
    validation: 15/15 references resolved, none off topic, no unresolved terms.
    One naming mismatch, UBERON:0001846 called "inner ear structures" where
    UBERON calls it internal ear; that term is not bound in this entry.

    Module conformance. Cerebellar Neurodegeneration conformed to
    peroxisomal_metabolic_failure#Neural Membrane and Redox Dysfunction, which is
    about plasmalogen-dependent myelination and white-matter demyelination and so
    asserted the opposite of this node's own claim that there is no white-matter
    change. Retargeted to
    cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration, whose module
    description scopes it to cerebellar degeneration converging on Purkinje cell
    loss and ataxia. To make the conformance substantive rather than nominal the
    node now binds CL:0000121 Purkinje cell and carries the PEX2-null mouse
    finding of abnormal Purkinje dendritic arborization, graded MODEL_ORGANISM
    with quote_role BACKGROUND because the sentence sits in a human case report
    restating a mouse result it did not generate. The description records that
    the cell-level localisation is an inference from that model, since no human
    PEX2 neuropathology exists. Peripheral Axonal Degeneration gained
    peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination,
    the module's central-effector node, which explicitly covers predominantly
    axonal neuropathies.

    Dietary phytanic acid restriction. The only evidence was an aim sentence
    ("Here, we provide an overview of current clinical approaches"), which states
    nothing about diet. Replaced with the Zellweger spectrum management review
    (PMID:26627182), which does state the recommendation and conditions it:
    restriction is necessary only at extremely high phytanic acid levels and is
    not recommended when levels are moderately raised. The treatment description
    now carries that threshold, and records that the PEX2 patients cited here are
    reported only as having increased branched-chain fatty acids, with no
    statement that phytanic acid reaches the level at which restriction is
    indicated. PMID:26627182 was already cached as a PDF extraction whose column
    interleaving and end-of-line hyphenation break both quoted sentences, so each
    snippet is trimmed to the longest contiguous exact run.

    Peripheral Axonal Degeneration to Areflexia. The edge quoted a diagnostic
    recommendation rather than the causal step, while the same node's REFUTE item
    records both Sevin brothers having reduced reflexes with normal nerve
    conduction. causal_link_type moved from DIRECT to
    INDIRECT_UNKNOWN_INTERMEDIATES, directness INDIRECT, and the snippet replaced
    with the Italian patient's examination paired with his nerve conduction
    result. The description now states that the neuropathy explains the areflexia
    in one of the three reported patients and that in the other two the
    hyporeflexia preceded any demonstrable neuropathy.

    GeneReviews DIAGNOSIS/TESTING. The PEX gene sequencing diagnosis row now
    quotes the chapter's diagnostic criterion, that the diagnosis is established
    by biallelic pathogenic variants in one of the 13 known ZSD-PEX genes.

    Two phenotypes added from the deep-research walk-through, both scoped to the
    NALD-IRD subtype and both spectrum-level rather than PEX2-observed:
    Leukodystrophy (HP:0002415), which GeneReviews names for this band and whose
    absence is part of what defines the entry's ataxic subtype, and Cataract
    (HP:0000518) from the management review's list of typical ocular findings.

    The report also names a recruiting natural-history study of Zellweger spectrum
    retinopathy, NCT06190626, which is now the entry's first clinical_trials
    record, targeted at the retinal dystrophy phenotype. Its status slot is left
    empty: the cached ClinicalTrials.gov record holds only the summary text and no
    overall-status field, so the recruiting status the report asserts is not
    quotable and was not copied across.

    Also taken from the review's suggestions: the Multisystem Peroxisomal Disease
    explanation no longer claims a subtype scope a pathophysiology node cannot
    have, and its description no longer says none of its features is reported in a
    PEX2 patient, since hypoacusia and early retinopathy were both observed in the
    Italian adult; the sentence is narrowed to the liver, adrenal, renal, enamel
    and bone features.

    Declined: the suggestion to check PMID:11330043's year. The cached record's
    year field is 2000, so "the 2000 study" is already correct and was left alone.

    No reference cache files are committed with this round. The 17 that the
    deep-research run wrote are cited neither by the entry nor by the report's
    reference-validation section, so they were removed. Three already-tracked
    caches were modified as a side effect and reverted; one of them,
    PMID_26627182.md, had its committed full-text PDF body replaced by a shorter
    XML extraction by just fetch-reference, which is a regression worth noting
    since the PDF body is the one the quoted sentences live in.

    Cataract is additionally wired as a downstream edge from Multisystem
    Peroxisomal Disease, beside the Retinal dystrophy edge that quotes the same
    source sentence; phenotype causal connectivity moves from 17/19 to 18/21.
    Leukodystrophy is deliberately left unwired, because no cited source states a
    mechanistic step to it for this band and the entry's own PEX2 patients are
    reported without it.

    Validation: just validate, count-verified-snippets (114/114), validate-terms,
    check-duplicate-keys, check-entity-refs, check-causal-targets,
    check-qualifier-terms, check-enum-values, list-gene-term-mismatches,
    check-snippet-length, check-title-snippets, check-snippet-grading,
    check-folded-hyphens, check-environmental-evidence, check-coarse-phenotypes,
    check-reference-titles, check-genereviews, pytest tests/test_data.py, and
    just validate-disorders.

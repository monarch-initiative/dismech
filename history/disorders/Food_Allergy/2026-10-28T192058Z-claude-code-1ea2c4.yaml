  details: |
    Review-response round. Added a genetic: block (FLG, SERPINB10, IL4, EMSY as GWAS RISK_FACTOR loci, from PMID:29051540, 29030101, 39698764); an environmental: block with the early-oral-introduction protective exposure (LEAP/EAT, PMID:38804779, 36435990, 36521802) linked PROTECTS_AGAINST the oral-tolerance node and the cutaneous dual-allergen-exposure route (PMID:38740132, 41967460) linked PREDISPOSES the type 2 node; a diagnosis: block (skin prick test, serum specific IgE, oral food challenge gold standard, serum tryptase, from PMID:42358594, 38108678); and omalizumab as a treatment (OUtMATCH, PMID:38407394, therapeutic_agent NCIT:C29299, MONOCLONAL_ANTIBODY). Rebound the tolerogenic APC from CL:0000990 conventional dendritic cell to CL:0000145 professional antigen presenting cell, since PMID:41328802 defines the RORgt+/PRDM16+ lineage by contrast with conventional DCs; recorded the CL search in a node note. Made quote_role consistent on the two prevalence items. Changed AR101 treatment_term to NCIT:C15262 Immunotherapy and recorded why no therapeutic_agent binds. Added a disease_term scope note. Pruned 33 fetched-but-uncited reference caches that were off-scope or redundant. Merged current origin/main, which brings the fresh gene-activity baseline (#15837) and the Robinow NXN fix (#15551). Citations rose from 9 to 20. Validation: just validate, validate-terms, 35/35 snippets; causal-targets, entity-refs, duplicate-keys, enum-values, coarse-phenotypes, environmental-evidence, gene-activity (vs main) all clean.

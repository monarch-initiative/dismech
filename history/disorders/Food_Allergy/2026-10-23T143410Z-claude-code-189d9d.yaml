  summary: 'Create: Food Allergy'
  details: |
    New entry for IgE-mediated food allergy to protein allergens, anchored on MONDO:0700226. Scoped deliberately to protein allergens, with a notes field recording why alpha-gal syndrome is excluded (carbohydrate epitope, tick-bite sensitisation, delayed reaction) rather than asserting a universal that all food allergens are proteins.

    Seven-node pathograph from dietary protein exposure through to the clinical reaction, built around four emphases requested by a UNC researcher in session: (1) reprogramming of signalling pathways, curated as failure of RORgt/PRDM16-dependent tolerogenic antigen presentation and peripheral Treg induction, then type 2 reprogramming and IgE class switch; (2) allergen oligomerisation interfaces, curated as a dedicated Oligomeric Allergen Epitope Display node; (3) mast cell and basophil degranulation as the effector node; (4) avoidance and epinephrine as the treatment mainstay, with AR101 oral immunotherapy recorded as an adjunct that desensitises without replacing epinephrine.

    Deep research: falcon was requested but returned 403 ProviderAuthError (EDISON_API_KEY invalid or lacking endpoint access). Re-run with dr_fallback='--fallback' on the user's instruction; openscientist produced the report, which is named for openscientist and carries fell_back/requested_provider/provider_attempts in its frontmatter. Report validation read before use: references 44/44 resolved, confabulation_rate 0.0, 36/44 on topic; terms 37/43 resolved with 1 obsolete (NCIT:C2175, unrelated to this entry and not bound) and 3 reported label mismatches which on inspection are artifacts of the report placing frequency percentages in its label column -- HP:0001025, HP:0100665 and HP:0001047 are correctly identified, and the two I bound were independently resolved from OLS before the report existed.

    The report does not mention oligomerisation, valency, Ara h 1 or beta-lactoglobulin anywhere, so the oligomerisation arm was curated entirely from primary literature found by direct PubMed search: PMID:33439436 for Ara h 1 occurring as nonamer/decamer with the N-terminal domain as the higher-order oligomerisation interface (this also corrected an initial assumption that native Ara h 1 is trimeric -- the trimer is the truncated 54 kDa isoform), PMID:30923869 for beta-lactoglobulin dimerisation, and PMID:42589421 for valency and epitope spacing dictating FcepsilonRI aggregate geometry and degranulation.

    On the researcher's request to include variants of beta-lactoglobulin: no literature was found tying the bovine A/B genetic variants to allergenicity or IgE crosslinking (that literature is dairy-production: cheese yield, milk composition), so no such claim was written. The defensible variant axis is ligand-loading state, curated from PMID:32485264 -- modelling predicts ligand binding masks major IgE and T-cell epitopes, holo-BLG reduced IgE binding from milk-allergic children and impaired mast cell degranulation, and only holo-BLG prevented sensitisation in mice while sustaining Tregs.

    Prevalence records both the 7.6% paediatric / 10.8% adult US figures (PMID:38349368) and the ~2% adult Western figure (PMID:39257598), with notes recording that the adult gap is a measurement disagreement rather than a trend and that the lower figure spans IgE and non-IgE conditions, rather than averaging them.

    Validation: just validate-disorders passes with 20/20 snippets and 20/20 titles verified; term validation passes; check-causal-targets, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms and check-shared-disease-terms all clean. check-genereviews --online reports NO_CHAPTER with synonyms present, as expected for a complex non-Mendelian disease. One reference_title was initially written from inference and was corrected against the cached title before commit.

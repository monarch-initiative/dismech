  summary: 'Phenotypes: add six DFNA13/DFNB53 audiologic and vestibular phenotypes'
  details: |
    Added mid-frequency, high-frequency, progressive, postlingual, vestibular (DFNA13) and profound (DFNB53) phenotypes from abstracts of PMID:10581026, 10733181, 11559344, 25633957. Conflicting reports on progression and vestibular function are recorded as REFUTE items. Wired two phenotypes from the existing tectorial-membrane and recessive nodes. GeneReviews has only the Genetic Hearing Loss Overview, so it was not a baseline. Validated with validate-disorders and the causal-target, coarse and name-collision checks.

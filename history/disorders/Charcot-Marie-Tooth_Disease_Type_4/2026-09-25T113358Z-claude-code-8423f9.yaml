  summary: 'Genetics pass: complete CMT4 subtype roster, EGR2/HK1/FGD4 added, FIG4
    wired'
  details: |
    Genetics pass for the genetics-gap campaign (issue #12248, series-041). Enumerated all 12 hierarchical descendants of MONDO:0018995 via OLS4; every one carries exactly one RO:0004003 gene edge, so the compartment roster is fully gene-defined in MONDO. The entry had seven has_subtypes rows, none of them MONDO-anchored and none carrying a gene descriptor. Added subtype_term and genes to all seven, then added the five missing rows so the roster matches MONDO exactly: CMT4B3 (SBF1), CMT4E (EGR2), CMT4G (HK1), CMT4H (FGD4) and CMT4K (SURF1). CMT4B3, CMT4C, CMT4D and CMT4K each carry a dedicated dismech entry; their rows say so and deliberately do not duplicate the gene-level curation that lives there. Added genetic records with subtype foreign keys and abstract-quoted evidence for the three genes with no other home in the repository: EGR2, HK1 and FGD4. Added three pathophysiology nodes so every gene reaches the pathograph: EGR2-Dependent Schwann Cell Differentiation Block, Frabin Cdc42 Exchange Factor Defect, and Endosome-Lysosome Trafficking Defect. The last of these closes a pre-existing gap: FIG4 was in the genetic section but reached no mechanism node at all. HK1 is bound on the terminal Demyelination and Secondary Axonal Loss node rather than on an upstream node, because the HMSN-Russe report measured no difference in hexokinase activity or peripheral-nerve immunostaining and states the mechanism is unknown; both the node description and the genetic record say so. Corrected a factual error in the differential_diagnoses block, which claimed CMT4K was the only CMT4 subtype curated as its own entry when four are. Tagged the retired GeneReviews CMT4 chapter (PMID:20301641) in the references block via just tag-references; its eleven-gene roster sentence is now the source for the subtype-to-gene assignments. Deleted five stubs this pass curates as subtype rows (CMT4A, CMT4B2, CMT4F, CMT4G, CMT4J), all confirmed stale by just tidy-stubs. Every MONDO CURIE and label read from OLS4 and every HGNC CURIE from the HGNC REST API in the same session as the binding. Gates: just validate 51 snippets 0 issues, validate-terms passed, list-gene-term-mismatches 0 findings.

  summary: 'Review round 1: CMT4K differential wording and EGR2 evidence grading'
  details: |
    Addressed the two blocking findings on PR 12775 and two of its non-blocking suggestions. The CMT4K differential explanation said SURF1 was a cause of CMT4 that the has_subtypes list does not cover; the same PR adds a CMT4K row, so the sentence had become false and now states only the gene-disease link and its share of unsolved CMT4. The CMT4K differential description carried a self-correction clause about what an earlier version of the text claimed, which is editing history rather than disease fact; removed, and recorded here instead - the earlier text asserted CMT4K was the only subtype of this compartment with a dedicated dismech entry, where four have one. The EGR2 to Demyelination edge quoted the study's hypothesis sentence; replaced with the study's own mutation finding in CHN and CMT1 patients. The EGR2 node's BACKGROUND quote about Egr2 expression timing was graded OTHER; the sentence restates rodent Egr2 developmental data, so it is now MODEL_ORGANISM with BACKGROUND retained.

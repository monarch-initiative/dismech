  summary: 'HK1 (CMT4G): record germline origin and autosomal recessive inheritance'
  details: |
    Requested by the insulin-secretion and glycogen gene-family review. The HK1 (CMT4G / HMSN-Russe) record had no variant origin or inheritance. Added variant_origin GERMLINE, supported by the segregation of the founder variants with disease in affected families and their low heterozygote frequency in controls (PMID:19536174), and an autosomal recessive inheritance block (HP:0000007) quoting the same study's statement that HMSN-Russe is a severe autosomal recessive disorder. HK1 stays off every pathophysiology node: the founder variant lies in an alternative untranslated exon and the reporting study found no difference in hexokinase activity between patients and controls (PMID:19536174), so no molecular function change can be bound. The record keeps its CAUSATIVE typing; ClinGen has no HK1 assertion in the 2026-11-22 export. The HK1 curated summary (hgnc_4922) was refreshed for the recorded germline origin and verifies.

  summary: 'Create: Charcot-Marie-Tooth Disease Type 4 (autosomal-recessive compartment)'
  details: |
    New entry completing the CMT compartment trio (CMT1 demyelinating / CMT2 axonal / CMT4 autosomal-recessive) already assumed by the umbrella Charcot-Marie-Tooth Disease entry. Covers 7 verified subtypes: CMT4A/GDAP1 (PMID:11743580), CMT4B1/MTMR2 (PMID:10802647), CMT4B2/SBF2-MTMR13 (PMID:12687498), CMT4C/SH3TC2 (PMID:14574644), CMT4D/NDRG1-HMSN-Lom (PMID:10831399), CMT4F/PRX-periaxin (PMID:11157804), CMT4J/FIG4 (PMID:17572665). Pathophysiology cleaves the recessive lesions into four mechanism nodes (GDAP1 mitochondrial dynamics; myotubularin phosphoinositide dysregulation/myelin outfolding; SH3TC2 endosomal recycling; NDRG1/periaxin axon-glia interaction) converging on a shared terminal node conforming to peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination, mirroring the CMT1 entry. All 25 evidence snippets independently verified as exact substrings of freshly fetched PubMed caches; schema, term, and causal-graph validation all pass. MONDO:0018995; genes bound to HGNC (GDAP1 hgnc:15968, MTMR2 hgnc:7450, SBF2 hgnc:2135, SH3TC2 hgnc:29427, NDRG1 hgnc:7679, PRX hgnc:13797, FIG4 hgnc:16873).

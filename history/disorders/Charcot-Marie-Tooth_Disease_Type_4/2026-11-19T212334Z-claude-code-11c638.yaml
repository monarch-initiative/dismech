  summary: 'CMT4J row: pediatric FIG4 presentation'
  details: |
    Extended the CMT4J subtype description to record that children with biallelic FIG4 variants often present with a severe neurodevelopmental disorder and a movement disorder rather than a neuropathy, and that FIG4 testing belongs in the workup of infants with hypotonia, developmental delay or early dystonia. Added three evidence items quoting the pediatric cohort of PMID:42974926 (full text cached from PMC13729235). The Subtype class has no notes slot, so the text sits in the row description. Pointed the row at the new FIG4-Related Disorders grouping. Validated with just validate-disorders (54 snippets, 56 titles, no issues), check-snippet-grading, check-entity-refs and the snippet-length, title-snippet, reference-title, folded-hyphen and retired-prose gates. Validation also recorded enum membership for 11 existing CMT4 subtype MONDO terms in cache/enums/diseaseorsubtypeterm_25e3df8b550a.csv.

  summary: 'Create: Immunodeficiency_Due_To_MASP-2_Deficiency'
  details: |
    New Mendelian entry for MASP-2 deficiency (MONDO:0013423, MASP2 hgnc:6902), curated against claim issue #14249 and replacing stubs/Immunodeficiency_Due_To_MASP-2_Deficiency.yaml.

    Deep research was unavailable: 'just research-disorder falcon' failed twice with 'Edison authentication failed' (503), so the literature was assembled directly from PubMed via the PubMed MCP tools and E-utilities, and every reference was fetched with 'just fetch-reference'.

    Curated content: a four-node pathograph running from the p.D120G loss of binding to mannose-binding lectin, through failure of lectin-pathway C4 cleavage, to reduced opsonisation and (separately, and flagged as a different genetic architecture) impaired antiviral activity; three phenotypes, all causally connected; a European genotype-frequency prevalence record; two biochemical markers; one MASP2 genetic record with the p.D120G variant; and two KNOWLEDGE_GAP discussions.

    The central curation decision is that clinical penetrance is unsettled and the entry says so rather than taking a side. Four evidence items are REFUTE: the targeted study's own redundancy conclusion (PMID:31828694) against both the infection and the autoimmunity phenotype, the neonatal cohort finding no excess perinatal infection (PMID:19307021), the cystic fibrosis cohort finding no outcome effect of MASP2 genotype (PMID:15654829), and the MASP-2-deficient mouse line not more susceptible to T. cruzi (PMID:25548381). No frequency band is tagged on any phenotype, and the prevalence record uses measure_type UNKNOWN with no prevalence_class, because the figure is a genotype frequency and the 7-14/10,000 range straddles a band boundary.

    Four papers that bear directly on the disease (PMID:12904520 index case, PMID:17137870, PMID:24332888, PMID:24658431) have no abstract in PubMed, so nothing is cited to them; this is recorded in the entry notes and claims unique to them are left uncurated. 'just check-genereviews' reports NO_CHAPTER for both name and synonyms. No treatments are curated, for the reason given in notes.

    kb/groupings/Complement_Deficiency_IEIs.yaml gains a member row for this entry (the lectin-pathway enzyme row beside the ficolin-3 recognition-molecule row) plus one stale-sentence fix in its notes; the edit was deliberately kept to the MASP2 row because a sibling PR is adding a C3 row to the same file.

    Validation: just validate, validate-terms, count-verified-snippets (29/29), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-block-scalar-comments, check-coarse-phenotypes, check-term-cache-integrity and validate-disorders all pass; just validate-grouping and just check-groupings pass on the grouping with the new member SATISFIED.

  summary: 'Gene-family review: type FGFR1 and add KRAS (somatic mosaic)'
  details: |
    The FGFR1 record was untyped; it is now typed CAUSATIVE (somatic), with the discovery study added as evidence (PMID:26942290: mosaic FGFR1 kinase-domain mutations p.Asn546Lys and p.Lys656Glu in four of five unrelated individuals, plus one in an independent cohort). The entry's own description and an existing snippet (PMID:37486073) already said ECCL is caused by somatic FGFR1 and KRAS variants, but no KRAS record existed. A KRAS record was added, typed UNKNOWN with variant_origin SOMATIC, because the ECCL-specific evidence is a small number of single-patient reports with no external classification (PMID:26970110: mosaic KRAS codon 146 mutations in lesional tissue of one ECCL and three oculoectodermal syndrome patients). KRAS is not placed on the FGFR1 mechanism node.

    Integration cleanup of errors already present on main: linkml-reference-validator 0.8.0 failed this entry's evidence or deep-research reference annotations, so CI rejects any PR that touches it. Removed 3 deep-research reference finding(s) whose statement and supporting text were only the reference title, on references cached without retrievable text; the reference entries stay.

  summary: 'Create: Neurodevelopmental_Disorder_With_Ataxia_And_Brain_Abnormalities'
  details: |
    Created the PTPMT1 (NEDAXBA, MONDO:0978300) entry from one Perplexity deep-research report. Three medium-effort Perplexity runs were cut at about 300 s (server disconnected), so the report used was run with reasoning_effort=low; it carried a PTPMT1 causal-gene anchor supplied through a temporary genetic row because the stub had no genes block. The report's 16 references all resolved; its term check flagged only the MONDO label (read from the template block). All claims were re-sourced from the cached full text of the defining study (PMID:39279645) and two mouse papers (PMID:21641550, PMID:30338292); 73/73 snippets verified. Pathograph: PTPMT1 loss (MF GO:0008962 from QuickGO, IBA/ISS) -> cardiolipin deficiency -> mitochondrial fragmentation and impaired OXPHOS -> mouse neural precursor bioenergetic stress -> impaired cerebellar development -> ataxia/cerebellar atrophy, with model-based and authors-inferred edges marked INDIRECT. Hearing, optic, corticospinal, seizure and white-matter phenotypes are left unconnected under a KNOWLEDGE_GAP. Feature frequencies omitted (n=6). No GeneReviews chapter (check-genereviews --online). Did not conform to complex_i_deficiency (isolated CI scope). preflight-dr not usable without a local MONDO build; checked wrong-disease drift by hand (report names PTPMT1 47 times and matches OMIM 621199).

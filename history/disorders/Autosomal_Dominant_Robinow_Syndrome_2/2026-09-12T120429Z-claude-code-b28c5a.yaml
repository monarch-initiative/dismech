  summary: 'Reconcile DVL1/WNT5A mechanism prose (issue #9803)'
  details: |
    Added a mechanistic_hypotheses block naming the entry's currently-modeled mechanism as an explicit EMERGING hypothesis (nuclear_mislocalization_transcription_model, tagged onto the existing 'Nuclear Mislocalization of Altered Dishevelled' -> 'Increased Cranial Bone Mineral Density' downstream edge via hypothesis_groups) alongside a second, older ALTERNATIVE hypothesis (coexpression_canonical_wnt_gain_model) drawn from PMID:25817014, which proposed that co-expressing a DVL1 frameshift with wild-type raises canonical Wnt signalling and drives the osteosclerosis. That second hypothesis carries both a SUPPORT evidence item (PMID:25817014's 2-fold co-expression increase) and a REFUTE item quoting PMID:42424595, where the same research group's own equimolar co-expression assay of a DVL1 frameshift instead found dominant-negative inhibition -- the opposite direction. Extended the existing dvl1_frameshift_mode_of_action KNOWLEDGE_GAP discussion's rationale and evidence to state this unreconciled conflict explicitly, and added an attaches_to link to the new hypothesis. Prompted by issue #9803, which flagged that the sibling Autosomal_Dominant_Robinow_Syndrome_1 entry's prose asserted DVL1 runs the pathway in an 'opposite direction' from WNT5A, when in fact both DVL1 studies agree the mutant protein alone signals less (same direction as WNT5A); the 'gain' claim is specific to a contested co-expression finding plus a distinct nuclear-mislocalization property. This entry's own pathophysiology nodes were not changed; only the interpretive/discussion layer was added.

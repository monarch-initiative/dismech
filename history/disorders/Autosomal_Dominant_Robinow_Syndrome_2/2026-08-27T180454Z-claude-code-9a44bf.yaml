  summary: 'Create: Autosomal Dominant Robinow Syndrome 2 (DVL1)'
  details: |
    Split out of the lumped Robinow_Syndrome entry after PR 9600 merged a standalone WNT5A DRS1 entry on main, on the maintainer's instruction to stay consistent with that precedent for now. Covers row NOS 15-0060 of ISDS group 15. The pathograph separates two effects of the penultimate-exon frameshift that had been conflated: reduced canonical and JNK-PCP signalling, which PMID:42424595 shows is shared with a plain stop codon at the same position and so is attributable to losing the wild-type C-terminus, and nuclear mislocalization plus morphogenetic disruption, seen only with the frameshift. The DVL1-specific osteosclerosis is wired from the second of those rather than from the shared PCP node, because it is confined to this genotype. Phenotype causal-inlink and gene-to-mechanism wiring are both 100 percent.

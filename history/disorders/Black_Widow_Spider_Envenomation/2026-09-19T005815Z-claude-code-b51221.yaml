  details: |
    Answers review 5253855067, whose only blocking finding is mine and is the same defect class as the one the previous round fixed. Round 1 added a third local bite-site phenotype (Local edema, HP:0000969) without updating the scope paragraph in notes:, which still said two local phenotypes were curated and that local oedema had been left out for want of a quotable source - contradicted by a phenotype 790 lines below citing PMID:32462634. A false justification tells the next reviewer the check was already done, which is exactly why the previous round removed one. The paragraph now says what is true: erythema, local pain and local oedema curated; only the target-pattern localized sweating left out, for want of a quotable sentence about a widow bite; the deep-research report's frequency table not used because the row carries no citation. Also removed the absolute claim that widow bites are characteristically non-necrotic. That is the other half of the unsourced no-ulceration claim deleted from the erythema description in round 1 - PMID:32462634, cited by this entry and quoted under the local oedema phenotype, says patients may experience necrosis at the inoculum site. What survives is the defensible part, that the necrotic-arachnidism picture belongs to Loxosceles, which PMID:21762981 supports, plus an explicit note that the one source mentioning necrosis is quoted whole rather than cropped and that only the oedema is curated from it. No evidence items, snippets, terms or causal edges changed in this round; the diff is notes: prose only. Validation: just validate-disorders passes with 70/70 snippets verified; duplicate-key, entity-ref, causal-target, enum-value, qualifier-term, folded-hyphen and case-collision gates all clean.

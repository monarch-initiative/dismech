  summary: 'Review round 1 on PR #12170: evidence grading, full-sentence snippets,
    local bite-site phenotypes'
  details: |
    Answers review 5253739817 in one push. Finding 1: the equine-antivenom evidence item carried explanation prose claiming it was graded OTHER while the value said HUMAN_CLINICAL; both items on PMID:11407496 are mouse lethality assays and are now MODEL_ORGANISM, with the explanations rewritten to match. Finding 2: two PMID:11407496 snippets had been trimmed with a justification that the cache disproves - the cached sentence is one continuous line and nothing wraps. The trimmed clause names L. hesperus and L. mactans, which is the claim the antivenom_efficacy_is_unsettled discussion rests on, so both now quote the whole sentence and the invented cache-formatting rationale is gone. That justification was fabricated; recording it here rather than only fixing it. Finding 3: added three local bite-site phenotypes - Erythema (HP:0010783, PMID:37377825, a measured 3x2mm finding in a confirmed widow envenomation), Pain (HP:0012531, PMID:21762981, wired from the binding node as INDIRECT_UNKNOWN_INTERMEDIATES because the entry models no local sensory-terminal node) and Local edema (HP:0000969, PMID:32462634). The frequencies the review quoted (28.6 / 17.9 / 13.6 percent) are not curated: they sit in an uncited table row of the deep-research report, so each phenotype is cited to a source that states the finding rather than to the frequency. The PMID:32462634 sentence also asserts necrosis at the inoculum site, which is the classic loxoscelism finding and which nothing else here reports; it is quoted whole rather than cropped, and the explanation says so. Removed an unsourced negative claim from the erythema description - widow bites do not ulcerate - which no cited source supports and which that same sentence contradicts. Erythema and local edema are deliberately left unwired: nothing cited traces a route from toxin binding to a local vascular change. Validation: just validate passes with 70/70 snippets verified, duplicate-key, entity-ref, causal-target, qualifier-term, enum-value and case-collision gates all clean; 14 of 15 phenotypes causally connected.

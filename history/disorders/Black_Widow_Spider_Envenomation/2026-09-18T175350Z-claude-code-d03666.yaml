  summary: 'Create: Black Widow Spider Envenomation (MONDO:0800176)'
  details: |
    New entry for latrodectism, curated from a claude_code deep-research run committed alongside (47 citations, 20 web searches, 293 s).

    Mechanism. Alpha-latrotoxin is curated as two competing arms rather than one chain, because the literature genuinely supports two. CANONICAL pore_mediated_calcium_influx: receptor tethering, divalent-cation-dependent tetramerisation, a prepore-to-pore transition resolved by cryo-EM (3.1 and 3.7 Angstrom), calcium influx through the resulting channel, then unregulated exocytosis. ALTERNATIVE receptor_mediated_secretion: latrophilin-1 couples to Gaq-phospholipase C, IP3 releases store calcium, store depletion opens store-operated calcium entry. Causal edges opt in via hypothesis_groups. The alternative is not speculative - it was demonstrated with the pore-deficient toxin mutant LTXN4C in latrophilin-1 knockout mice - but it was characterised for spontaneous quantal release at the mouse neuromuscular junction, not for the massive discharge of an envenomation, and the entry says so in every place it matters.

    Antivenom is the contested treatment and is curated as a disagreement, not a verdict. Four studies bear on it: a 163-case retrospective reporting resolution in 31 minutes, RAVE-I concluding antivenom may add nothing over placebo, RAVE-II finding no benefit over standardised analgesia in 224 patients, and a 60-patient trial meeting its primary endpoint. Each carries a supports: value pointing the way its own source points, and a discussion lists the four candidate explanations for the disagreement. Calcium gluconate is curated as a refuted former standard with REFUTE evidence and deliberately no target_mechanisms edge.

    Ontology. Every CURIE was re-derived from a live OLS lookup at the point of writing; none from the research report was used. The report's term validation flagged three that name unrelated concepts (HP:0100751 offered as Excessive salivation is Esophageal neoplasm; HP:0000640 as Dilated pupil is Gaze-evoked nystagmus; HP:0025400 as Priapism is Nodular-random pattern on pulmonary HRCT), plus two obsolete terms. The schema caught two of my own errors during the build: HP:0003394 is Muscle spasm not Muscle cramps, and GO:0070588 is a biological process so cannot sit in molecular_functions.

    Red-team round before PR. A subagent reviewed with fresh context against dismech-pr-review and found three blocking defects, all verified independently before being acted on and all fixed here.
      1. Two notes: blocks cited a sibling Scorpion_Envenomation entry as precedent for the ECTO and NCIT bindings. That entry exists only in unmerged PR #12127, so on this branch the justification pointed at nothing. This is the failure CLAUDE.md describes - a false justification that tells the next reviewer the check was already done - and it was wrapped around ECTO and NCIT searches that had genuinely been run, which is what made it read as verified. Both sentences removed; the one true precedent (Snakebite_Envenoming binds NCIT:C15986) kept.
      2. A discussion stated the pore was resolved to 3.1 Angstrom. The cached full text says 3.1 is the prepore (state 1) and 3.7 the pore (state 2). Corrected.
      3. PMID:42121922, the paper that fills the transduction gap, was cached twice by this PR and cited zero times, while the entry asserted in four places that the step between receptor engagement and exocytosis was unknown. That claim was stale. The edge moved from INDIRECT_UNKNOWN_INTERMEDIATES to INDIRECT_KNOWN_INTERMEDIATES with the intermediates named, the hypothesis description was rewritten, and the REFUTE item on that node was re-scoped: it excludes a G-protein route to channel formation in HEK293 cells, which is a different claim from the secretion route the node makes, and calling it the strongest evidence against the arm was wrong.

    Also fixed from that round: a node named Catecholamine-Mediated Myocardial Stress asserting a mechanism no cited source demonstrates, renamed Envenomation-Associated Myocardial Injury; PMID:1967610 cited SUPPORT/DIRECT for vesicle depletion when its own calcium-present control found active recycling and no depletion, now INDIRECT with the control added as a REFUTE item and the calcium-free limitation stated in the node; a Myocarditis description claiming reversibility against a cached source saying such cases can be fatal; two clinical_burden claims with no citation; an unsourced antivenom product-composition claim that may have been backwards, removed rather than guessed; the antivenom death in the entry's own most-cited source, which had been omitted from a treatment framed as a risk-benefit judgement; and eight quote_role or evidence_source values, including two on an NLM-typed Review graded PRIMARY_RESULT.

    Deliberate omissions, recorded in notes: no module conformance, because neuromuscular_transmission_failure and synaptic_vesicle_cycle both model failure of release and this disease is pathological excess - alpha-latrotoxin is the inverse of botulinum toxin; no local bite-site phenotypes, because no cited source describes them quotably; no insect- or crustacean-specific latrotoxins. Tremor and Agitation were drafted and removed for want of a quotable source.

    Validation: just validate-disorders passes (schema, terms, references batched), 65/65 snippets verified offline, weighted compliance 86.7%, all 13 phenotypes causally connected, causal graph orphan_targets empty (28 nodes, 27 edges), check-genereviews NO_CHAPTER for both collections. Offline gates green: entity-refs, causal-targets, duplicate-keys, enum-values, qualifier-terms, snippet-length, title-snippets, snippet-grading, reference-titles, environmental-evidence, case-collisions. The cited-identifier set was re-derived from the entry, report and sidecar immediately before deciding on cache pruning; four cache files that looked orphaned resolve to report sources cited by PMC or URL rather than PMID, so nothing was pruned.

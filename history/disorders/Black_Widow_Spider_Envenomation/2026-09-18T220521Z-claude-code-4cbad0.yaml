  summary: Evidence the antivenom-to-binding treatment edge
  details: |
    The Equine antivenom target_mechanisms edge to Alpha-Latrotoxin Binding to Presynaptic Receptors asserted a substantive pharmacological claim - that antivenom neutralises circulating toxin and therefore acts upstream of the receptor - with no evidence slot at all. The pre-PR red-team round flagged it and I left it, which was the wrong call: an edge with a mechanism claim and no evidence is the defect pattern the Ricin review was filed about.

    Now cited from PMID:11407496, which was already cached and uncited. Two items. The neutralisation result is graded INDIRECT because it is a mouse lethality assay rather than a measurement at the receptor. The second quote is the authors' own caveat - the study is limited by optimized premixing of antigen with antibody - which is cited because it strengthens the edge's stated limitation rather than the treatment's case: premixing guarantees the antivenom meets the toxin before the toxin meets a receptor, which is exactly the condition a patient presenting hours after a bite does not satisfy.

    Validation: just validate passes, 67/67 snippets verified offline (was 65/65). Offline gates green: entity-refs, causal-targets, duplicate-keys, enum-values, snippet-length, title-snippets, snippet-grading.

    Process note, recorded because it is about the PR rather than the entry. PR #12170 was opened at 20:54Z and after an hour carried only one check run, close-fork-prs (skipped, pull_request_target). No pull_request-triggered workflow ran on it at all - not claude-code-review, not main.yaml. Actions is demonstrably healthy repo-wide over the same window: PR #12171, opened at 21:50Z, started all three workflows immediately, and #8790 ran them at 21:29Z. The cause was not established. This push is a genuine fix that also produces a synchronize event, which is the ordinary way to get CI to start; it is not an empty commit and was not made for that purpose alone.

  summary: Rewrite 21 explanations naming the retired PARTIAL grade; add directness
  details: |
    Residue cleanup after #10003, which retired supports: PARTIAL and migrated 11,804 enum values to SUPPORT while deliberately leaving every explanation that justified the old grade in place, so this entry explained a value the schema no longer has. Each explanation is rewritten to preserve the original curator's reasoning verbatim, restated in terms of the current enum, following the pattern set by PR 10120 and continued in PR 10258. Where the reason IS an inference step - the quote reaches the claim through a broader statement, an adjacent subject, a proxy system or a different population - directness: INDIRECT is added, because that is the slot the reason was always describing. Where the reason is something else, the token is dropped without asserting a directness nobody assessed. A consistency check enforces both directions: no explanation claims INDIRECT without the item carrying the slot, and no item carries the slot without the explanation saying why; both are zero. No supports value, snippet, reference, evidence_source or ontology term changed. All 21 items in this entry share one reason and all 21 are INDIRECT. The delineating paper is open access in PMC but its publisher PDF returns HTTP 403 to the reference-cache fetcher, so only the abstract is quotable while the per-individual counts live in Table 1 and the Results text. Every evidence item therefore quotes a cohort-level or adjacent abstract sentence and reaches its specific phenotype through an inference step, which is the definition of INDIRECT. The entry-level scope note that documented the pattern in terms of PARTIAL now documents it in terms of directness. The deliberate omission of frequency bands where the only citable snippet is the abstract's cohort-methods sentence is unchanged, and remains the right call under docs/frequency-evidence-guidelines.md. Validated with just validate-disorders across the tranche: 192/192 snippets verified.

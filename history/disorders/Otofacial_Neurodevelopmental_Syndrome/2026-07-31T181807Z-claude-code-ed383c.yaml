  summary: Add falcon deep research and Owrang/Vona review citation
  details: |
    Follow-up deep-research pass after the user supplied a working Edison/Falcon API key. The earlier falcon attempt during the CREATE session had failed with HTTP 402 Payment Required.

    Falcon run completed in 486 s and is committed at research/Otofacial_Neurodevelopmental_Syndrome-deep-research-falcon.md, with its citations sidecar and one markdown artifact at research/Otofacial_Neurodevelopmental_Syndrome-deep-research-falcon_artifacts/artifact-00.md. The artifact is a tabular evidence summary, not an image, so no evidence images slot was populated.

    NEC preflight on the falcon report passed: ZSCAN10 appears 39 times against a single incidental CHD7 mention, MONDO:0975705 is the only MONDO ID asserted, and PMID:38386308 is the only PMID cited. No named-entity confusion.

    Falcon corroborated the existing entry on every overlapping claim: seven affected individuals, biallelic loss of function, autosomal recessive inheritance, global developmental delay, facial asymmetry, outer ear malformation, semicircular canal dysplasia, and sensorineural hearing loss in 4 of 5 tested. It contradicted nothing.

    Falcon reported several fields as "not established" that the entry does in fact carry, specifically the OMIM identifier, the founder allele, and the animal models. These are falcon retrieval gaps rather than corrections: OMIM:620910 was verified directly from the MONDO record via OAK, and the founder allele and mouse models are documented in PMID:38386308 and PMID:25111779. No entry content was weakened on the basis of falcon's non-retrieval.

    One genuinely new lead was extracted and independently verified rather than trusted: the review Owrang D and Vona B, "Neurogenetic Disorders with Hearing Loss: Mechanisms, Classifications, and Emerging Insights", Curr Neurol Neurosci Rep 2025. The DOI 10.1007/s11910-025-01466-y was resolved through the PMC ID converter to PMID:41191133, then fetched and cached. It is added to the top-level references and cited on the hearing-rehabilitation treatment with supports: PARTIAL, since it is a narrative review of 38 genes whose abstract does not name ZSCAN10 and therefore supports only the early-identification management framing.

    Validation after the change: just validate passes with 54/54 snippets verified against cached references. just compliance reports 85.3 percent global and 85.6 percent weighted.

    Note on repository hygiene: each validator run rewrites roughly 7400 references_cache files with a reference_id quoting normalization unrelated to this curation. That churn was reverted before committing so only the new cache file for PMID:41191133 is included.

  summary: 'Create: Otofacial Neurodevelopmental Syndrome (ZSCAN10)'
  details: |
    Created kb/disorders/Otofacial_Neurodevelopmental_Syndrome.yaml (MONDO:0975705, OMIM:620910, ZSCAN10 / hgnc:12997) de novo.

    Duplicate preflight: no matching MONDO ID, preferred name, or ZSCAN10 synonym in kb/ on origin/main; no open or closed PR; no matching issue.

    Deep research: falcon (Edison) was attempted first per the /curate default but the API returned HTTP 402 Payment Required, so no falcon report was produced. Fell back to the claude_code provider, which completed (research/Otofacial_Neurodevelopmental_Syndrome-deep-research-claude_code.md; 6 web searches, 15 turns, 14 citations). An openscientist run was also submitted and was still queued at commit time. The claude_code report was treated as leads only: its suggested HP:0011387 for semicircular canal dysplasia was checked with OAK and rejected (that ID is "Enlarged vestibular aqueduct"); HP:0011380 "Abnormal semicircular canal morphology" was used instead, and its suggested HP:0031703 was superseded by the more specific HP:0000356.

    Primary source: PMID:38386308 (Laugwitz et al., Brain 2024), the delineating cohort of seven individuals from five unrelated families. The PMC open-access full text (PMC11224597) was read for clinical detail, but the publisher PDF returns HTTP 403 to the reference-cache fetcher so only the abstract is cached. Every evidence snippet therefore quotes the cached abstract, and claims sourced from Table 1 or the Results/Discussion body are graded supports: PARTIAL with the reason stated in each explanation. This limitation is also recorded in the entry-level notes.

    Supporting references fetched and cached: PMID:16971461, PMID:17628018, PMID:19740739 for ZSCAN10/Zfp206 pluripotency-network function; PMID:25111779 for the independent Zscan10 mutant mouse; PMID:26592664, an inducible knockout showing Zscan10 is dispensable for ESC pluripotency, curated as supports: REFUTE on the pluripotency node, which is marked mechanism_confidence: HYPOTHETICAL; PMID:40605417, a Goldenhar-mimicking case report that is a letter with no abstract, so only its title is quotable.

    GeneReviews: PubMed searches for "ZSCAN10 GeneReviews" and "otofacial GeneReviews" returned zero results. No chapter exists for this 2024-delineated disorder, as recorded in notes.

    Content: six-node pathograph running ZSCAN10 loss of function to mislocalization and loss of enhancer binding to pluripotency-network dysregulation to craniofacial/otic morphogenesis and impaired neurodevelopment; 19 phenotypes; one MRI imaging finding; a causative genetic entry with the four reported protein-truncating variants and founder-allele detail; two mouse models; two differential diagnoses (CHARGE syndrome and oculo-auriculo-vertebral spectrum); three supportive treatments; prevalence; and two discussions, one KNOWLEDGE_GAP on the pluripotency-to-craniofacial step and one HUMAN_MODEL_MISMATCH on mouse-only extra-craniofacial phenotypes.

    Validation: just validate passes, covering schema validation, term validation, and 52/52 snippets verified against cached references. just compliance reports 85.6% global and 86.0% weighted.

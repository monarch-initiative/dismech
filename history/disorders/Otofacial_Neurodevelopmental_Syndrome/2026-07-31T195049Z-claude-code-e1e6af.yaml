  summary: Record frequency denominator decisions and reconcile entry notes
  details: |
    Covers the two prose-only commits made after the reviewer approval on PR 7409. (1) Commit 3c10805f expanded the Sensorineural Hearing Loss evidence explanation to record the frequency denominator decision explicitly, as the reviewer asked. FREQUENT is retained over VERY_FREQUENT because the paper reports hearing loss in 4 of 5 individuals formally assessed (80 percent) but 4 of the full 7-individual cohort (57 percent); the assessed-only denominator would bias the band upward because audiology is not performed at random (individuals are assessed because hearing loss is suspected), so the two unassessed individuals are treated as unknown rather than dropped. This follows docs/frequency-evidence-guidelines.md Pattern D, which permits a clinical-estimate band provided the explanation says so plainly. No band was changed. (2) This commit reconciles the entry-level notes, which still claimed facial asymmetry was the single place where a Table 1 count arbitrates a band. That became stale once the SNHL denominator reasoning was recorded. The notes now describe both cases, state that in both the count moves the band downward, and draw the distinction from the seven frequency-less phenotypes: for facial asymmetry and SNHL the cited snippet does establish the disease-phenotype association and only the band is Table 1-derived, whereas for the seven the snippet supported neither the association nor a band. No structural or evidentiary change in either commit; validation unchanged at 65/65 snippets verified.

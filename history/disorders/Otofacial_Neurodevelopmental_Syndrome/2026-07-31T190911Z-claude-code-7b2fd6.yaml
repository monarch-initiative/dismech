  summary: Address ai4c-reviewer REQUEST_CHANGES on PR 7409
  details: |
    Addressed all five IMPORTANT items from the automated review. (1) Added a diagnosis: section with four entries: molecular confirmation by trio exome/genome sequencing (NCIT:C15709, two SUPPORT snippets), audiological assessment (NCIT:C18020, PARTIAL), temporal bone and cerebral MRI (NCIT:C16809, SUPPORT), and computational facial gestalt analysis via GestaltMatcher (NCIT:C18020, two SUPPORT snippets). (2) Removed frequency from the seven phenotypes whose only citable snippet was the abstract cohort-methods sentence (cleft palate, micropenis, cryptorchidism, visual impairment, cardiac malformation, aggressive behavior, hyperphagia), each with an inline comment recording the uncitable Table 1 count; PMC full text is not retrievable (PMC is not a supported reference type) and hand-editing the reference cache is prohibited, so per docs/frequency-evidence-guidelines.md the band is omitted rather than inferred. (3) Lowered Facial Asymmetry from VERY_FREQUENT to FREQUENT to match the Table 1 count of 5/7 (71 percent), with the reasoning recorded in the evidence explanation. (4) Added the previously unmodeled Unilaterally Reduced Facial Movement phenotype (HP:0012799) that the entry description called the leading dysmorphic feature, plus Motor Stereotypy (HP:0000733) from the suggestions. (5) Replaced the over-generic Supportive Care hearing treatment with two specific treatments: Cochlear Implantation (NCIT:C15329 plus medical-device qualifier NCIT:C157820, following the Labyrinthitis precedent) carrying a target_mechanisms BYPASSES edge to the Inner Ear Labyrinthine Malformation node and an anatomy-dependent candidacy caveat, and Hearing Amplification (NCIT:C49236 plus NCIT:C183182). Also added a classifications block (harrisons_chapter GENETICS_ENVIRONMENT_DISEASE and NEUROLOGIC) and CONGENITAL onset with STABLE clinical_course on the three congenital structural phenotypes. Reviewer-suggested HP:0000356 relabel was not applied: OAK confirms the canonical label is 'Abnormality of the outer ear' as already curated. Validation: schema, terms, and references all pass; 65/65 snippets verified (up from 54).

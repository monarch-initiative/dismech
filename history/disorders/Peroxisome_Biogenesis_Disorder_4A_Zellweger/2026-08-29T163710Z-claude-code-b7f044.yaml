  summary: 'Create: Peroxisome Biogenesis Disorder 4A (Zellweger)'
  details: |
    Created the PBD4A entry as the severe, neonatal-lethal PEX6 counterpart of the existing Peroxisome Biogenesis Disorder 4B entry, following the precedent set by the 3A (PEX12) and 11A (PEX26) entries. The pathograph runs from the biallelic null PEX6 genotype through receptor-export-module failure and matrix-import collapse to four downstream arms: fatty acid oxidation, plasmalogen synthesis, bile acid intermediates, and cortical neuronal migration. The gene-agnostic spectrum-wide cascade is left on the Zellweger Spectrum Disorders entry rather than duplicated. Deep research: openscientist, research/Peroxisome_Biogenesis_Disorder_4A_Zellweger-deep-research-openscientist.md. That report supplied three things the first draft lacked: a PEX6-specific genotype-severity source PMID:41787707, the phase 3 oral cholic acid trial PMID:28644367, and the negative DHA randomised trial PMID:20805528, curated as a REFUTE item. It also supplied the Pex5 liver-rescue experiment PMID:14586000 that keeps the neuronal-migration knowledge gap open. Claims from the report that were NOT adopted: its suggested disease mapping MONDO:0009279, which the report's own term validation flags as triple-A syndrome; PMID:28742939, cited by the report for the human PEX1-PEX6-PEX26 mechanism but actually an Arabidopsis paper; and its CHEBI and HP suggestions for VLCFA and phytanic acid, which the term validator showed resolve to unrelated terms. Validated with just validate, 46 of 46 snippets verified, plus just validate-terms and just check-entity-refs.

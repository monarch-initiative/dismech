  summary: 'Review round 1: address PBD4A review blockers'
  details: |
    Addressed the three blocking items and all five suggestions from the automated review on PR 10072. Blockers: added a top-level references block tagging PMID:20301621 with tags GeneReviews, matching the sibling 3A entry; added an animal_models section for the Pex5 knockout mouse with tissue-selective peroxisome reconstitution, carrying two modeled_mechanisms links, one RECAPITULATES on the migration node and one FAILS_TO_RECAPITULATE recording that the model does not reproduce the lipid lesion's explanatory role, with the negative readout of unchanged brain VLCFA, DHA and plasmalogen now structural rather than prose; and split the bundled bile-acid node into C27 Bile Acid Intermediate Accumulation at MOLECULAR scale and Cholestatic Liver Injury at TISSUE scale, which also sharpened the cholic acid target_mechanisms link to point at the accumulation node where the drug actually acts. Suggestions: connected the previously dead-ending fatty acid oxidation and plasmalogen arms to their biochemical readouts and the liver injury node to its two phenotypes; removed the Purkinje cell binding from the cortical migration node and replaced it with an explanation noting the cited sentence attributes arborisation rather than migration abnormality to Purkinje cells; added a newborn screening diagnosis entry for C26:0-lysophosphatidylcholine citing PMID:37977233 with directness INDIRECT since the pilot reports no PBD4A case; recorded the pexophagy mechanism from PMID:41787707 as a genetic note rather than a pathophysiology node because no measurement in a PBD4A genotype was found; rewrote the evidence_source rule in notes to state the actual axis, which is what kind of evidence the quoted sentence reports rather than primary versus review, resolving the apparent inconsistency in the Klouwer grading; and recorded that CHEBI carries no plasmalogen term so the ether lipid parent binding is deliberate. Revalidated: just validate with 55 of 55 snippets verified, just validate-terms, just check-entity-refs, just check-duplicate-keys, scripts/check_reference_titles.py, and the entity-reference pytest selection.

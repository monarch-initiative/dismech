  details: |
    Backfill for issue #8085. Dietary fermentable carbohydrate is TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES into acid-mediated enamel demineralization, because sugars are the substrate rather than the acid: cariogenic biofilm ferments them to organic acids which then dissolve mineral. Fluoride deficiency is PREDISPOSES, deliberately not TRIGGERS, because the cited evidence demonstrates fluoride's protective effect and the harm of its absence is an inference from that; the explanation states this rather than implying the source measured deficiency. Xerostomia is EXACERBATES into the salivary defence node, since losing saliva removes buffering, clearance and remineralisation rather than initiating decay. Validated with linkml-validate and just validate-terms, and every new evidence item was verified part-by-part against the committed reference cache by a local audit. The project's just validate-references sweep was not run to completion on this tranche locally because it rescans the whole cache per file; CI runs it authoritatively on the pull request; integrity issue count unchanged. PR review found the carbohydrate link quoted a general risk-factor list that never mentions carbohydrate, under an explanation claiming it named dietary factors. It now quotes the sentence already present in the same cached reference which states the interaction directly, between acid-producing bacteria and fermentable carbohydrate. That is the bacterial-fermentation intermediate the INDIRECT_KNOWN_INTERMEDIATES grading routes through. The pre-existing entry-level item retains the risk-factor sentence. Re-verified: 32 of 32 snippets.

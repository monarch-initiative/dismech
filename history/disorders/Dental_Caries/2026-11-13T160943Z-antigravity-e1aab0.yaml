  summary: 'Review: enrich dental caries prevalence, subtype evidence, anatomical/phenotype
    pathophysiology wiring, diagnosis, and preventive treatments'
  details: |
    Added Tooth Decay synonym, INFECTIOUS_DISEASES classification, global GBD (PMID:25740856) and German adult/pediatric point prevalence (PMID:41999496), MONDO:0006957 binding on Root Caries and radiotherapy/xerostomia evidence on Rampant Caries (PMID:37756422), biological_scale and UBERON dental/oral anatomical locations across all 5 pathophysiology nodes (preserving Oral Microbiome Dysbiosis and Dentin Invasion and Pulpal Inflammation) with downstream edges to Enamel Hypomineralization, Carious Teeth, and Tooth Abscess, visual-tactile/radiographic/fluorescence diagnostic modalities, German S3 guideline evidence on Pit and Fissure Sealants plus therapeutic_modality and mechanism/phenotype targets across treatments, and StatPearls tags on PMID:31869163, PMID:34662024, and PMID:37983328.

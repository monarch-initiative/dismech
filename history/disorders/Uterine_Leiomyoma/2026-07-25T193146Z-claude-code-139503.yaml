  summary: 'Review: Uterine Leiomyoma - structured prevalence, uncited HLRCC claim,
    phenotype scope'
  details: |
    Manual claim-evidence review. Fixed: (1) both prevalence records used only population+notes+evidence - added measure_type, prevalence_class and rate_per_100000 (60% and 70% normalised to 60000 and 70000 per 100,000) per the structured-prevalence policy; (2) the pathophysiology description restated the source's 'a quarter of reproductive-age women' as 'a quarter of affected women' - reworded to match the cited denominators; (3) the FH genetic entry asserts the HLRCC germline syndrome but its only citation supports FH merely as a recurrent driver gene - added variant_origin: GERMLINE_AND_SOMATIC and an explicit note that the HLRCC statement is uncited; (4) the 'Bulk-Related Pressure Symptoms' phenotype described both rectal and bladder compression but was bound only to HP:0002019 Constipation - renamed to match the bound term and noted the unmodelled urinary phenotype.

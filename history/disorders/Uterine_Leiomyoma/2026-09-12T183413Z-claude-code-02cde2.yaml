  summary: 'Edit: Uterine Leiomyoma - pathograph split and extension, subtypes, histopathology, imaging,
    environmental, models, discussions'
  details: "Augmented the existing Uterine_Leiomyoma entry (created 2026-06-22, PR #4717;\nreference_title\
    \ backfill in PR #5270). Not a new entry: the duplicate preflight found\nthe file already on origin/main\
    \ under MONDO:0007886, with issue #4706 and both prior\nPRs closed and nothing in flight, so this\
    \ session ran as an EDIT.\n\nDeep research. Ran `just research-disorder claude_code Uterine_Leiomyoma`,\
    \ producing\nresearch/Uterine_Leiomyoma-deep-research-claude_code.md (claude-haiku-4-5 +\nclaude-sonnet-5,\
    \ 17 web searches, 19 turns, ~4m51s). Its own validation reported\n49/49 references resolved (confabulation_rate\
    \ 0.0, 1/1 quotes valid) but\nterm_validation needs_review: true, with four CURIEs naming different\
    \ terms\n(HP:0030318 = Angular cheilitis for \"Pelvic pain\", HP:0030068 = Olfactory\nesthesioneuroblastoma\
    \ for \"Dyspareunia\", HP:0031801 = Vocal cord dysfunction for\n\"Abdominal mass\", UBERON:0000459\
    \ = uterine wall for \"endometrium\") and six more\nflagged for a second look (including CL:0002598\
    \ = bronchial smooth muscle cell offered\nas \"myometrial smooth muscle cell\", HP:0100608 = Metrorrhagia\
    \ offered as\n\"Dysmenorrhea\", and HGNC:29305/HGNC:5013 offered for MED12/HMGA2). None of the\nreport's\
    \ CURIEs were bound. Every ontology identifier in this change was looked up\nindependently in cache/<prefix>/terms.csv,\
    \ the local OAK builds, or the OLS4 API in\nthe same step it was written.\n\nThe pre-existing research/Uterine_Leiomyoma-deep-research-falcon.md\
    \ was also read. It\ncites by author-year key with no PMIDs in the body, so its 15 DOIs were resolved\n\
    through the PMC ID converter; that recovered PMID:36982825, PMID:39335725,\nPMID:38326302, PMID:40898238,\
    \ PMID:40369458 and PMID:41810407 as new, and confirmed\nPMID:37668348 and PMID:34626221 were already\
    \ cited here.\n\nNamed-entity-confusion preflight. `just preflight-dr` returned SKIP because MONDO\n\
    records no RO:0004003 causal gene for MONDO:0007886, so the gene-identity check cannot\ndiscriminate.\
    \ Checked manually instead: the report's OMIM identifiers are 150699\n(matching MONDO's) plus 150800,\
    \ which it correctly labels as the separate HLRCC\nsyndrome, and its top gene terms are FH/MED12/HMGA2.\
    \ Right disease. HLRCC content was\ndeliberately kept minimal and pointed at the existing\nHereditary_Leiomyomatosis_and_Renal_Cell_Cancer\
    \ entry rather than curated here.\n\nGeneReviews baseline. Searched PubMed for \"uterine fibroid[TI]\
    \ GeneReviews[TI]\" and\n\"uterine leiomyoma GeneReviews[All Fields]\"; both returned zero. No GeneReviews\
    \ chapter\nexists for this disease, which is expected for a complex non-Mendelian entry, so step\n\
    3b of the skill contributed no baseline.\n\nPathophysiology. The graph went from 3 nodes to 8 and\
    \ the phenotypes are now connected\nto it, which they were not before. The existing node \"Hormone-Driven\
    \ Myometrial Smooth\nMuscle Proliferation and ECM Deposition\" was split: it bundled a CELLULAR claim\n\
    (population expansion) and a TISSUE claim (matrix deposition), which is exactly the\nsingle-valued-biological_scale\
    \ signal the skill describes. It is now\n\"Hormone-Driven Myometrial Smooth Muscle Proliferation\"\
    \ (CELLULAR, keeping its\nsex_steroid_driven_proliferation#Target-Cell Population Expansion conformance)\
    \ feeding\na new \"Excessive Extracellular Matrix Deposition and Tissue Stiffening\" (TISSUE,\nconforming\
    \ to fibrotic_response#Excessive ECM Deposition). Four further nodes were\nadded: \"Fumarate Accumulation\
    \ and Pseudohypoxia in FH-Deficient Leiomyoma\" (MOLECULAR,\nconforming to oncometabolite_dioxygenase_inhibition#Oncometabolite\
    \ Accumulation),\n\"Aberrant Pseudocapsule Angiogenesis and Venous Ectasia\" (TISSUE),\n\"Endometrial\
    \ Hemostatic Failure and Impaired Vessel Closure\" (ORGANISM) and\n\"Bulk Compression of Adjacent\
    \ Pelvic Organs\" (ORGANISM). biological_scale was set on\nall eight, and genetic_context (SOMATIC\
    \ / GAIN_OF_FUNCTION) on the initiating node,\nwhich makes it the derivable cell-of-origin node.\n\
    \nA note on the angiogenesis node: PMID:36303616 attributes fibroid angiogenesis\nprincipally to the\
    \ IGF system rather than to HIF-1-alpha/VEGF, and reports HIF-1-alpha\nas absent from fibroids where\
    \ it is readily shown in leiomyosarcoma. The claude_code\nreport said VEGF. The primary source's reading\
    \ was followed, and the node was NOT\nconformed to tumor_angiogenesis, whose trigger is \"Intratumoral\
    \ Hypoxia and HIF\nStabilization\" - the wrong mechanism for this tumor.\n\nNew sections: has_subtypes\
    \ (MED12-mutant, HMGA2-rearranged, FH-deficient - molecular\nrather than FIGO-anatomical, since that\
    \ is what the genetic section describes),\nhistopathology (3), imaging_findings (3), environmental\
    \ (5, all pathograph-linked\nexcept alcohol), progression (3 phases), clinical_burden (VARIABLE),\
    \ \ndifferential_diagnoses (3), animal_models (2), discussions (3), classifications\n(harrisons_chapter\
    \ ENDOCRINOLOGY_METABOLISM) and mappings (ICD10CM:D25 exactMatch,\nNCIT:C3434 exactMatch). phenotypes\
    \ went 7 -> 13, prevalence 2 -> 4.\n\nTensions recorded rather than smoothed over. Three, deliberately:\n\
    (1) PMID:41493967 reports MED12 wild-type leiomyomas growing faster than mutant ones\nwith higher\
    \ CDK8 activity, which cuts against reading the gain-of-function label as\ngrowth-promoting. Curated\
    \ as a REFUTE evidence item on the genetic record plus a\nCONTROVERSY discussion, not omitted.\n(2)\
    \ The GBD 2021 age-standardized prevalence of 2841.07/100,000 sits an order of\nmagnitude below the\
    \ 60-70% screening figures already in the entry. The new prevalence\nrecord says explicitly that these\
    \ do not contradict - GBD models diagnosed disease,\nthe screening studies count incidental findings\
    \ - and the gap is the asymptomatic\nfraction.\n(3) PMID:38710995's adjusted analysis drops miscarriage\
    \ from the significant obstetric\nassociations its unadjusted analysis includes. Both are curated\
    \ on the\nRecurrent Pregnancy Loss phenotype as a SUPPORT and a REFUTE item, since one evidence\n\
    item cannot carry two directions.\n\nFixed a recorded defect: the FH genetic record carried a NOTE\
    \ saying its HLRCC\ngermline statement was uncited and needed a reference. PMID:36981015 now supplies\
    \ it,\nwith PMID:37263921 adding the germline/somatic split (31/29/20 of 80 cases) and the\n69% family-history\
    \ rate.\n\nOntology gaps left unbound on purpose, each with the search recorded. HP:0200067\n(Recurrent\
    \ spontaneous abortion) means exactly the pregnancy-loss phenotype but sits\nunder HP:0032443 past\
    \ medical history, outside the PhenotypeTerm enum root HP:0000118;\nHP:0005268 Miscarriage and HP:0003826\
    \ Stillbirth are outside it too, under clinical\nmodifier. Left as preferred_term, following the Asherman_Syndrome\
    \ precedent for the\nsame term (issue #7837 gap 3). Three exposure_terms are unbound: vitamin D deficiency\n\
    (ECTO and XCO searched; the only candidates, ECTO:9000133 and XCO:0000543, name the\npresence of the\
    \ exposure, the inverse of the risk factor), obesity (ECTO and XCO\nsearched for obesity/body mass/high\
    \ fat diet, nothing), and parity (not an\nenvironmental exposure at all). Each carries a review_notes\
    \ line naming the searches.\nNote these are PARTIAL rather than waived in environmental-term-audit\
    \ terms; they are\nnot \"Left deliberately uncited.\" waivers, since all five environmental entries\
    \ carry\nreal evidence.\n\nDevices and modality. therapeutic_modality was backfilled on all 13 treatments\
    \ using\nthe mechanical treatment_term mapping where it applies (SURGERY for myomectomy,\nhysterectomy,\
    \ embolization and the two ablations - the enum's own gloss is \"surgical or\nprocedural intervention\"\
    ), PEPTIDE for leuprolide, SMALL_MOLECULE for the small-molecule\ndrugs, and DEVICE for the levonorgestrel\
    \ intrauterine system, which is literally an\nimplanted therapeutic device.\n\nModel credibility.\
    \ Both animal models carry modeled_mechanisms with model_scale,\nfidelity, limitations and typed divergences.\
    \ The Eker rat is deliberately recorded as\nFAILS_TO_RECAPITULATE against the initiating-lesion node\
    \ - its germline Tsc2/mTOR\nlesion is none of MED12, HMGA2 or FH - alongside PARTIALLY_RECAPITULATES\
    \ for the\nhormone-dependent growth node, and a RESCUES link for the vitamin D3 result that\ncarries\
    \ PROXY_QUANTITY (INVALIDATING) and SCALE_EXTRAPOLATION divergences because the\nmeasured endpoint\
    \ is stem-cell DNA repair, not matrix. A HUMAN_MODEL_MISMATCH\ndiscussion records the same point structurally.\n\
    \nValidation run. `just validate` and the authoritative batched\n`just validate-disorders kb/disorders/Uterine_Leiomyoma.yaml`\
    \ both pass, with 137/137\nsnippets verified against the cached references. Also passed: check-entity-refs,\n\
    check-causal-targets, check-duplicate-keys, check-qualifier-terms (0 qualifier terms),\ncheck-folded-hyphens,\
    \ check-snippet-length, check-title-snippets,\ncheck-snippet-grading, check-environmental-evidence,\
    \ check-enum-values, and\nmodel-scale-audit (the 2-step upward extrapolation on the Eker rat rescue\
    \ link carries\nits required SCALE_EXTRAPOLATION divergence). Weighted compliance is 96.5%, unchanged\n\
    from before the augmentation despite roughly quadrupling the content. No DOI-keyed\nevidence items\
    \ were added, so no --unskip-prefix DOI run was needed. The page renders\n(dismech.render), and pages/\
    \ was reverted rather than committed.\n\nThree checks caught real defects during the session, all\
    \ fixed: a snippet quoting\nPMID:34626221's title (moved to a body finding and split out as a third\n\
    differential_diagnoses entry for endometrial stromal tumor), three snippets broken by\nbracketed citation\
    \ spans being stripped before matching ([39], [7,8,9]), and one\nsnippet (\"UFs rarely develop before\
    \ menarche\") that came from the falcon report's prose\nand is in no cached source - re-anchored on\
    \ PMID:37668348's sex-steroid-dependence\nstatement and graded INDIRECT, since the premenarchal absence\
    \ follows from the\ndependence rather than being stated.\n\ncache/hierarchy for ICD10CM and NCIT was\
    \ rebuilt because the two new mappings were\nmisses costing roughly 30 s each on every page build.\
    \ The builder is whole-cache and\nincremental, so ten pre-existing misses from other entries came\
    \ along with the two new\nrows; it preserves retrieved_at on unchanged rows, so the diff is additions\
    \ only.\n\nSelf-review round (skill step 7, dismech-pr-review in a fresh-context subagent) before\n\
    opening the PR. It found five blocking errors, all of which are fixed here rather than\ndeferred:\n\
    \n(1) The MED12 case_fractions record said 34.1% from PMID:41493967's 44-tumor series. That\ncounted\
    \ one of four study arms. Table 1 of the cached full text gives GnRHa(-)/WT 11,\nGnRHa(-)/MUT 15,\
    \ GnRHa(+)/WT 9, GnRHa(+)/MUT 9, so total mutant is 24/44 = 54.5% - inside\nthe 50-80% range the note\
    \ claimed it undercut, which collapsed the whole argument. The\nrecord is deleted rather than restated\
    \ at 54.5%: the series was group-balanced by design\nand was never a prevalence estimate. Nothing\
    \ in the toolchain could have caught this,\nsince the snippet supplies only \"44\" and 34.1 was derived.\n\
    \n(2) The FH node asserted fumarate-driven prolyl-hydroxylase inhibition and pseudohypoxic\nHIF stabilization\
    \ with no evidence item supporting any of it, while two other places in\nthe same entry quoted PMID:36303616\
    \ saying HIF-1-alpha is absent from uterine fibroids.\nAn unintended contradiction, unlike the two\
    \ that are recorded deliberately. Fixed by\nsplitting the node along the module's own chain - \"Fumarate\
    \ Accumulation in FH-Deficient\nLeiomyoma\" (conforming to oncometabolite_dioxygenase_inhibition#Oncometabolite\n\
    Accumulation, now also carrying GO:0006099 DECREASED as the module expects) feeding a new\n\"Pseudohypoxic\
    \ HIF Stabilization in FH-Deficient Leiomyoma\" (conforming to\n...#Pseudohypoxic HIF Stabilization)\
    \ - and by citing PMID:36981015's own sentence on\nprolyl-hydroxylase inhibition on both the node\
    \ and the edge. The reconciliation is stated\nin both places: the HIF-absent observation comes from\
    \ unselected (so overwhelmingly\nMED12/HMGA2) fibroids and is what establishes that the common fibroid\
    \ does not use the\nhypoxia route, while pseudohypoxia is metabolite-driven and confined to the uncommon\n\
    FH-deficient subtype. This also resolved the separate finding that the old node bundled\nfour module\
    \ nodes into one.\n\n(3) An evidence item on PMID:32545544 was graded HUMAN_CLINICAL. That paper is\
    \ a\npure Eker-rat study (MeSH Animals, Rats, no human subjects) and the quoted sentence is a\nbackground\
    \ assertion about other people's epidemiology, so the grade claimed the\npublication presents human\
    \ evidence, which is what the CLAUDE.md rule forbids. The\nper-sentence split is sanctioned for papers\
    \ that mix evidence types and this one does not.\nReplaced with PMID:36982852, a human review that\
    \ lists endocrine-disrupting chemical\nexposure among the established risk factors. check_snippet_grading\
    \ structurally cannot\nsee this class of error, since it keys on the sentence rather than the paper.\n\
    \n(4) Four evidence items quoted PMID:40970558's \"abnormal uterine bleeding (AUB),\ninfertility,\
    \ recurrent pregnancy loss, pressure, pain, urinary frequency, or\ngastrointestinal dysfunction may\
    \ be present with a variety of otherwise unrelated\nconditions\" as SUPPORT for fibroid bulk symptoms.\
    \ In context that sentence begins\n\"Furthermore, when symptoms occur, they may not be related to\
    \ the fibroids since...\" - its\npurpose is to caution against the attribution it was being used to\
    \ make. The same cached\nfull text contains the sentence that does make the claim (\"Fibroids positioned\
    \ anteriorly\nor posteriorly can compress the bladder or rectum, resulting in urinary frequency,\n\
    difficulty emptying the bladder, or constipation.\"), which now replaces it in all four\nplaces; the\
    \ Constipation edge dropped its directness: INDIRECT as a result, since the\nsource names constipation\
    \ outright. The anti-attribution sentence is retained on the\nUrinary Frequency phenotype, quoted\
    \ in full including the \"may not be related to the\nfibroids\" clause, as the source's own counter-caution.\
    \ The adjacent sentence on urinary\nobstruction and hydronephrosis now cites the node's previously\
    \ uncited severe-end claim.\n\n(5) The Bulk Compression node said the symptoms track fibroid size\
    \ \"rather than fibroid\nnumber\", which PMID:40970558 contradicts directly (\"correlate with fibroid\
    \ size, number,\nand anatomical placement\"). Reworded and cited.\n\nAlso fixed from the same review:\
    \ genetic_context on the driver node stamped SOMATIC /\nGAIN_OF_FUNCTION over a node listing MED12,\
    \ HMGA2 and FH, which is false for FH (biallelic\ntumor-suppressor loss, germline in roughly half\
    \ of FH-deficient tumors) and a stretch for\nHMGA2 rearrangement - the slots are single-valued, so\
    \ they now carry a notes line saying\nthey describe the MED12 arm only, which matters because a somatic\
    \ genetic_context is what\nmarks the derived cell-of-origin node. The FH-deficient subtype's \"roughly\
    \ half germline\"\nbecame the precise 31/80 (39%), or 52% of variant-detected cases, matching the\
    \ genetic\nsection. The hemostatic node moved from ORGANISM to TISSUE with its bundled organ-level\n\
    claims attributed to the tumor-mass nodes where they belong. The source's \"likely\" hedges\non the\
    \ BMPR-2 and PAI-1/ATIII/thrombomodulin steps were restored, with a note that two of\nthose three\
    \ regulators are themselves anticoagulants so the DECREASED modifier records a\nnet outcome rather\
    \ than a per-protein reading. The venous-lake node now records that its\nown source later challenged\
    \ the interstitial-pressure explanation. The linzagolix snippet\nwas the study objective rather than\
    \ a finding and is now the PRIMROSE withdrawal result,\nwith relugolix (NCIT:C114498) and linzagolix\
    \ (NCIT:C148479) bound as therapeutic_agent\nalongside elagolix. HMGA2/MED12 mutual exclusivity is\
    \ now cited (PMID:38326302). The CD10\nfigure was described as a \"substantial minority\" when 65.4%\
    \ is a majority. The two\nreproductive phenotypes were wired into the pathograph via Infertility sequelae.\
    \ Both\ndifferentials that have dismech entries gained a disease_term (MONDO:0016262,\nMONDO:0010888).\
    \ Two clinical_trials records were added for LIBERTY 1 and 2\n(NCT03049735, NCT03103087).\n\nTwo of\
    \ the review's suggestions were resolved by removal rather than by curation, because\nno source supports\
    \ them:\n\n- The Fatigue phenotype (HP:0012378) was drafted and then deleted. No reference cited\n\
    \  anywhere in this entry names fatigue as a fibroid symptom, and a targeted PubMed search\n  (fibroid\
    \ + iron deficiency + fatigue in title/abstract) returned nothing usable. The\n  claim is clinically\
    \ obvious and bibliographically unsupported here, so it is recorded as\n  a notes line on the Iron\
    \ Deficiency Anemia phenotype instead of as an ontology-bound\n  phenotype resting on an inference.\n\
    - therapeutic_agent on Iron Replacement Therapy was left absent, with the reason in the\n  treatment\
    \ description: NCIT:C210688 \"Iron Supplement\" is the right concept but is not a\n  member of the\
    \ ChemicalEntityTerm dynamic enum (confirmed by a failing term-validation\n  run), and every CHEBI\
    \ member term names one specific salt or hydrate, which would assert\n  a preparation the source does\
    \ not specify.\n\nDyspareunia was kept but re-sourced: it previously rested on an INDIRECT quote about\
    \ the\npelvic-pain complex, and now cites PMID:35106750, which names dyspareunia outright.\n\nOne\
    \ review suggestion was declined. Uterine Artery Embolization is tagged\ntherapeutic_modality: SURGERY\
    \ here where the sibling Adenomyosis entry uses DEVICE. The\nenum's own gloss for SURGERY is \"surgical\
    \ or procedural intervention\", and embolization is\na procedure whose therapeutic principle is arterial\
    \ occlusion rather than an implanted\ndevice; the coarse-bucket table in CLAUDE.md puts SURGERY, RADIOTHERAPY\
    \ and DEVICE all\nunder PROCEDURE, so nothing downstream distinguishes them. Left as SURGERY; the\
    \ cross-entry\ninconsistency is real and is worth a separate normalizing pass rather than a change\
    \ made\nhere in one direction on one entry.\n\nFinal state after the review round: just validate and\
    \ the batched\njust validate-disorders both pass with 144/144 snippets verified, all eleven offline\
    \ gates\npass, and weighted compliance is 95.8%. cache/icd10cm/hierarchy.csv and\ncache/ncit/hierarchy.csv\
    \ were rebuilt and the hierarchy cache is now complete for every\nmapped CURIE in the repository.\n\
    \nReview round 1 (PR #11756, ai4c-reviewer changes-requested, 2026-09-12T22:51Z). The\nautomated review\
    \ confirmed schema/term/snippet validation, evidence_source grading,\nontology precision, node atomicity\
    \ and scope hygiene, and raised two blocking\nclaim/snippet mismatches. Both were correct, both were\
    \ pre-existing items carried forward\nfrom the entry's original creation rather than added by this\
    \ session, and both were fixed\nfrom references this PR had already cached:\n\n- The Dysmenorrhea\
    \ phenotype quoted PMID:38723935's \"in approximately 30% of cases, UFs\n  affect the quality of life\
    \ and women's health\", which never names dysmenorrhea; the\n  explanation was supplying the inference.\
    \ Re-sourced to PMID:41514933, which names\n  dysmenorrhea outright among fibroid symptoms, plus PMID:39335725\
    \ as a second\n  attestation (\"fibroid-related dysmenorrhea\"). The quoted span stops before the\
    \ source's\n  \"[6,7,8]\" citation marker, since bracketed spans are stripped before matching.\n-\
    \ The Constipation from Bulk Compression phenotype quoted PMID:38929485's \"pelvic masses\n  causing\
    \ pressure or pain\", which never mentions constipation. Re-sourced to\n  PMID:40970558's \"Fibroids\
    \ positioned anteriorly or posteriorly can compress the bladder\n  or rectum, resulting in urinary\
    \ frequency, difficulty emptying the bladder, or\n  constipation\", which names both the phenotype\
    \ and its mechanism. The description was\n  tightened to say \"posteriorly placed\" rather than \"\
    larger\", matching the source.\n\nTwo non-blocking suggestions were taken in the same push, since\
    \ the push was happening\nanyway and main has dismiss_stale_reviews:\n\n- The COL4A5/COL4A6 and SRCAP-complex\
    \ driver classes are now covered by an explicit\n  scoping note on the driver node, recording that\
    \ their omission from has_subtypes is a\n  decision (rare relative to the three modelled classes,\
    \ no distinct pathophysiology arm\n  beyond the shared ECM output, no management consequence) rather\
    \ than an oversight.\n- Mifepristone is curated as a fourteenth treatment, SMALL_MOLECULE, bound to\n\
    \  CHEBI:50692, with a target_mechanisms link to the hormone-driven proliferation node and\n  PMID:39335725\
    \ as evidence. It groups with the progesterone-receptor agents rather than\n  the symptomatic ones.\n\
    \nOne non-blocking suggestion was declined, with the reason recorded rather than left\nimplicit. The\
    \ reviewer noted the Wnt4/beta-catenin and TDO2-kynurenine-AHR arms are\nsurfaced by the research\
    \ but not modelled as pathophysiology nodes. Wnt is already\nrepresented: the driver node carries\
    \ GO:0016055 (Wnt signaling pathway) with\nmodifier: INCREASED. The TDO2-kynurenine-AHR arm has no\
    \ suitable GO process term - OLS\nreturns nothing for a tryptophan-to-kynurenine catabolic process,\
    \ and the available\nalternatives are a cellular component (GO:0034753, nuclear aryl hydrocarbon receptor\n\
    complex) or a molecular function (GO:0017162, aryl hydrocarbon receptor binding), neither\nof which\
    \ is the process being claimed. Binding a term that names the wrong kind of thing\nwould be worse\
    \ than leaving the arm unmodelled, and the reviewer's own assessment was\nthat adding it would deepen\
    \ the mechanism rather than correct it.\n\nNote on cache churn in this round: `just validate` triggered\
    \ normalize-cache, which\nre-sorted seven rows across cache/go/terms.csv, cache/hp/terms.csv and\n\
    cache/mondo/terms.csv. This is the pre-existing ordering drift that\ncheck-term-cache-integrity reports\
    \ as advisory pending a coordinated cutover. The diff is\nseven lines, not a whole-file re-sort, so\
    \ it is carried rather than reverted.\n\nAfter this round: `just validate` and the batched `just validate-disorders`\
    \ both pass with\n146/146 snippets verified, all eleven offline gates pass, weighted compliance 95.6%.\n"

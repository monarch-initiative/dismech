  summary: 'Round 2 review response: stale HP prose, FLNA differential rescope'
  details: |
    Answered round 2 of automated review. Two blocking items and all four suggestions.

    Blocker 1. Round 1 rebound the corpus callosum phenotype from HP:0001274 Agenesis to HP:0001273 Abnormal corpus callosum morphology, and three prose blocks still described the old binding as current: an evidence explanation pointing at a notes paragraph, the notes paragraph itself calling HP:0001274 the nearest available term, and a review_notes paragraph asking a reviewer to repoint a term that had already been repointed. All three deleted. The reasoning survives in the phenotype description, where it is correct.

    Blocker 2. The FLNA differential attributed female predominance, arachnoid cysts, cardiac abnormalities and a low seizure burden to the FLNA genotype. PMID:28411558 defines its classical group radiologically - bilateral frontal and body, n=41 - within a sporadic PVNH cohort in which FLNA variants were found in 8 of 100 patients, so those are properties of an imaging class rather than of the gene. The description is rescoped to the radiological group, the group definition and the 8/100 yield are now quoted as their own evidence items, and the statistics item is graded INDIRECT with an explanation saying why. "Mostly seizure-free" is no longer carried as an FLNA property: epilepsy is common in the familial FLNA literature, so that reading would have steered a clinician wrong.

    Suggestions. diagnosis_term NCIT:C101295 Whole Exome Sequencing bound on the sequencing entry. Two phenotypes added from a snippet already in the file - HP:0001263 Global developmental delay and HP:0001999 Abnormal facial shape - with the facial one graded INDIRECT because the same sentence records prenatal alcohol exposure, whose recognised phenotype includes facial dysmorphism. A prevalence record added as UNKNOWN / NOT_YET_DOCUMENTED, carrying the "about a tenth of all PVNH" figure as context for the imaging class rather than as a rate for the disease. The check-genereviews CITED_UNTAGGED finding for NBK1213 is dispositioned in the differential's description: the chapter belongs to FLNA, not to MAP1B, which still has none.

    One error of mine, caught by a gate. The sequencing diagnosis first carried a qualifier predicate bound to NCIT:C25218 labelled "Intervention or Procedure", written from memory; the canonical label is "Clinical Intervention or Procedure". just check-qualifier-terms caught it only because NCIT:C25218 was already cached from elsewhere in the KB - that gate is offline and cache-first, and just validate-terms never reaches inside qualifiers at all. The qualifier was dropped rather than corrected: "also performed" is not what NCIT:C25218 means, so the predicate was a stretch independently of the label.

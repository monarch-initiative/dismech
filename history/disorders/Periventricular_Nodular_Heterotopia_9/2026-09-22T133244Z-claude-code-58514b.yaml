  summary: 'Create: Periventricular Nodular Heterotopia 9 (MONDO:0030061)'
  details: |
    De novo curation of PVNH9 / MAP1B-related syndrome (MONDO:0030061), claimed in #12508.

    This claim replaced #12501 (hypertrophic cardiomyopathy 18), which was withdrawn as a duplicate of the assigned genetics-gap batch #12252 after an automated duplicate notice. The original preflight searched kb/ on origin/main and open PRs and found nothing, because MONDO:0013475 is named only in an open issue body and in stubs/.

    entry_type decision: DISEASE. A single-gene leaf under periventricular nodular heterotopia.

    Pathograph: five nodes from MAP1B haploinsufficiency through impaired microtubule stabilization to two arms - failure of radial neuronal migration, and disrupted axon guidance and cortical circuit formation.

    Evidence discipline is the substance of this entry. The gene-disease relationship rests on a gene-level collapsing analysis of 202 sporadic PVNH exomes driven by four ultra-rare loss-of-function carriers, not on a segregating pedigree, and the entry says so in the description, in the gene evidence explanation, and in a knowledge gap. The authors' own verb, 'implicate', is quoted and not upgraded. Two pathophysiology nodes carry mechanism_confidence PROVISIONAL with evidence graded REVIEW_SYNTHESIS + OTHER + INDIRECT, because the mechanism comes from a case series' summary of animal and cell work with no measurement in a MAP1B-haploinsufficient human neuron.

    One REFUTE item: PMID:40869917 reports a nonsense-allele carrier with bilateral PVNH and an IQ of 99, which refutes intellectual disability as a constant feature. Recorded on the phenotype it contradicts.

    Confounder preserved: PMID:31317654's case had significant prenatal alcohol exposure, which the authors flag; this is carried in the Microcephaly evidence explanation rather than dropped.

    Binding flagged as weak: HP:0001274 Agenesis of corpus callosum is bound to a source that says dysgenesis. No dysgenesis term is in the term cache; the mismatch is recorded in notes and review_notes for a reviewer to repoint or remove.

    Validation: just validate, just validate-terms, just count-verified-snippets (18/18), check-duplicate-keys, check-entity-refs, check-causal-targets, check-coarse-phenotypes.

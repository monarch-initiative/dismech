  summary: 'Create: TRAF3 Haploinsufficiency'
  details: |
    De-novo curation of TRAF3 haploinsufficiency, the loss-of-function immune dysregulation syndrome numbered IMD132B. Deep research was run with the claude_code provider; the report is committed at research/TRAF3_Haploinsufficiency-deep-research-claude_code.md. The report could not resolve a MONDO identifier and said so; MONDO:0100513 (TRAF3 haploinsufficiency) was found by direct OLS lookup and is bound as the disease term. The stub for this disease was keyed on MONDO:0976228 (immunodeficiency 132b), which MONDO records as scheduled for merge into MONDO:0100513 and subsequent obsoletion, so the entry binds the surviving term and records MONDO:0976228 as a skos:exactMatch mapping with that reasoning. The entry is deliberately scoped to the loss-of-function disease only; the allelic dominant-negative disorder (herpes simplex encephalitis susceptibility) is curated under differential diagnoses and flagged in notes as the main named-entity trap for this gene. Evidence comes from PMID:35960817 (founding cohort, abstract), PMID:39579173 (CVID reanalysis cohort, full text), PMID:40773231 (B-cell-conditional heterozygous mouse and human B cell ageing, full text) and PMID:25468570 (canine lymphoma, cited PARTIAL because the variants there are largely somatic). All 42 snippets verified against the reference cache. Validated with just validate plus the offline gates check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets and check-environmental-evidence.

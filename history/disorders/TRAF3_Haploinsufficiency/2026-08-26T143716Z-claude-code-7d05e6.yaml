  summary: 'Review response: TRAF3 Haploinsufficiency'
  details: |
    Response to the automated review on PR #9530. The review's central finding was that PMID:39579173 is cached as full text and had been mined only for its abstract; its Table 3 pools all 12 published patients across both cohorts. Added Splenomegaly (7/12), Gastrointestinal Inflammation (5/12, with the endoscopic detail) and Bronchiectasis, sourced from that table plus the results text, and sourced the previously estimated autoimmunity and lymphadenopathy frequencies from the same table. Promoted the B cell maturation defect from prose in an edge description to its own pathophysiology node and phenotype (HP:0030388), routed the INDIRECT_KNOWN_INTERMEDIATES edge through it via intermediate_mechanisms, and repointed the immunoglobulin knowledge gap's would_support at it. Reworded the LOSS_OF_FUNCTION rationale, which had asserted a protein level consistent with simple half-dose loss while the cached source reports greater than 50% reduction plus proposed wild-type destabilisation; the >50% figure now carries its own PARTIAL evidence item. Retyped the canine lymphoma evidence from OTHER to MODEL_ORGANISM per the veterinary rule. Restated the MONDO merge note in checkable terms: the note exists but is an rdfs:comment rather than an IAO:0000233 tracked item, which is why an OAK stanza dump misses it. Added the founding-cohort alleles to the genetic association with the table's allele row as evidence, and the impaired lymphocyte proliferation finding to the T cell node. Rooted the T cell node on Reduced TRAF3 Protein Dosage. Confirmed by PubMed query that no GeneReviews chapter exists for TRAF3. Validated with just validate (56/56 snippets verified) plus the offline gates.

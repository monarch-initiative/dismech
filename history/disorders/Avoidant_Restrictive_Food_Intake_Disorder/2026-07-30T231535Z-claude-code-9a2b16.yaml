  summary: Replace MAXO treatment terms with clinically preferred NCIT terms
  details: |
    Follow-on to PR #7117. Both MAXO treatment_term bindings replaced with clinically preferred NCIT terms:

    - Cognitive-Behavioral Therapy for ARFID (CBT-AR): MAXO:0000883 -> NCIT:C64345 Cognitive Behavior Therapy. MAXO:0000883 is defined verbatim from NCIT:C64345 and carries it as its only xref, so this binds directly to the clinical source vocabulary. preferred_term sharpened to "cognitive behavior therapy for ARFID (CBT-AR)" to keep the disorder-specific protocol name visible, which the schema explicitly permits for preferred_term.
    - Nutritional Rehabilitation and Enteral Feeding: MAXO:0000106 nutritional supplementation -> NCIT:C67022 Nutritional Intervention. This is an accuracy fix, not just a vocabulary swap. MAXO:0000106 and its NCIT counterpart C15425 are definitionally about adding deficient elements or compounds to the diet, which mischaracterizes ARFID nutritional rehabilitation. The curated treatment spans gradual expansion of accepted foods, oral supplementation, and nasogastric tube feeding, and the cited evidence is specifically about discontinuing tube feeding. NCIT:C67022 - a diet or dietary change designed to improve or correct an individual's nutritional condition - is the parent of both Nutritional Supplementation and Enteral Tube Feeding and covers the whole intervention. preferred_term set to "nutritional rehabilitation with enteral tube feeding".

    Validation: just validate passes for the entry - schema validation, term validation with --labels, and reference validation.

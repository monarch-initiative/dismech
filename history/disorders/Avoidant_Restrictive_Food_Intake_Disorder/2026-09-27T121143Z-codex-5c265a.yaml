  summary: Review ARFID mechanisms, clinical findings, genetics and treatment evidence
    against cached full texts
  details: |
    Reviewed the full disorder entry, both validated deep-research reports and their citation lists, and cached primary/review evidence. Disease identity is MONDO:7770002; this is an eligible psychiatric disorder, not an infectious or environmental disease. No prior REVIEW event was present. The branch was created from current main and its base was rechecked before this review.

    Full-text audit: consumed scientific text, methods, results, tables and figure legends for the Swedish twin study (36723946), food-cue fMRI (39964683), pleasure study (37950288), prospective course (38718975), neurobiology/treatment review (38849953), pediatric epidemiology review (36527163), latent-class study (38333539), Generation R MRI study (39623765), food-allergy review (39275348), adult GI concept analysis (40568462), and ARFID-GEN protocol (37990202). Recovered readable full texts through generated PMC/BioC or NCBI Bookshelf cache entries when the original PMID held an abstract or PDF extraction artifacts. StatPearls was tagged and its clinical evaluation, complications and management sections checked alongside primary clinical evidence.

    Added and read primary full texts: child and adult CBT-AR pilots (32776570, 34423319), 2026 FBT randomized trial (42019720), CCK case-control study (35830620), longitudinal CCK/ghrelin study (42159358), retrospective mirtazapine study (40265508), CBT-AR imaging follow-up (41803077), MoBa ARFI genetics (41284261), and SPARK ARFID-risk genetics (34177659; also read its generated DOI PDF). Several imaging, endocrine, pleasure and treatment reports use overlapping NIMH participants, so they are not counted as independent replications.

    Main corrections: removed unsupported taste-receptor, enteroendocrine-cell and specific neuronal annotations. Kept imaging/endocrine associations distinct from initiating causes. Preserved null hypothalamus group contrast, null fear-severity correlation, negative insula findings, depression-related attenuation of pleasure differences, and anxiety-adjusted attenuation of the CBT imaging result. The longitudinal CCK group difference occurred only at year 1. The source misspelling of amygdala is retained only inside an exact quotation. The MRI abstract's comparator-count inconsistency is resolved using full-text results and Table 1.

    Treatment evidence now distinguishes the 98-child FBT trial's weight benefit from its lack of overall symptom superiority, uncontrolled CBT feasibility findings, and nonrandomized inpatient mirtazapine associations. Removed the incorrectly attributed tube-weaning result from nutrition-only treatment. ClinicalTrials.gov records checked 2026-09-27: NCT04450771, NCT02963220, NCT03778216 and NCT05954728 completed; NCT06110806 terminated with the primary six-month assessment uncollected. NCT06420232 was also terminated; its eligibility was feeding anxiety rather than confirmed ARFID, so it is explicitly a related pilot. Its tiny results do not establish therapy efficacy.

    Genetics: preserved the broad childhood ascertainment and sibling-contrast limitations of the twin estimate. MoBa ADCY3 association concerns ARFI traits, not confirmed ARFID; SPARK rs13177031 is a risk-score association near ZSWIM6 without demonstrated variant-to-gene regulation. Both gene relationships remain UNKNOWN, with no invented Mendelian inheritance, penetrance or functional consequence. The 2025 ARFID-GEN conference abstract (10.1016/j.euroneuro.2025.08.308) still describes future GWAS results; it is not evidence for a discovered locus. TAS2R claims in the reports concern generic taste biology, not verified ARFID causation, and were not imported.

    Content-completeness assessment:
    1. Phenotypes: adequate. Thirteen findings cover restriction, appetite, feeding, weight/growth and major malnutrition complications; anxiety/autistic behavior are labeled comorbid context. No unsupported universal frequencies. Eleven of thirteen have causal inlinks; comorbid anxiety/autistic behavior intentionally have no ARFID-causes-comorbidity edge.
    2. Presentations: adequate. Sensory, low-interest, fear and study-derived combined presentations are explicit, with overlap and ascertainment limitations; they are not presented as separate Mendelian entities.
    3. Mechanisms: adequate. Behavioral drivers, shared liability, restrictive intake, nutritional consequences and direct psychosocial impairment are distinguished. Cellular circuit claims are not inferred from region-level imaging. Conditioned taste aversion from the reports is a limited conceptual analogue, not a validated whole-disorder animal model.
    4. Treatments/trials: adequate. CBT-AR, FBT, nutritional rehabilitation/refeeding monitoring and adjunctive off-label medications are covered; all verified report trial leads are accounted for. No trial registration is treated as proof of benefit.
    5. Genetics: adequate. Twin estimates and common-variant findings include study-specific phenotyping and uncertainty. No monogenic causal gene or penetrance estimate was established.
    6. Diagnostics/biomarkers: adequate. Diagnostic exclusions/coexistence, PARDI/NIAS screening, individualized medical evaluation, research hormones and imaging are separated. Necessary allergen avoidance is not equated with ARFID.
    7. References: adequate. High-value primary studies replace protocol, introductory or review-only support where available. Full-text caveats and negative findings changed the curation materially. Supplement-only analyses not retrieved were not used as primary quantitative evidence. Failed/recaptcha cache artifacts are excluded from the PR.
    8. Overall consumption: adequate. Broad clinical, mechanistic and treatment themes were used, with explicit limits on causal, diagnostic and cross-population extrapolation. No blocking omission identified.

    Validation: authoritative batched schema, term and reference validation passed: 97 snippets, 129 titles, zero skipped/unavailable, zero issues. Entity/causal targets, coarse phenotype bindings, source-defect claims and snippet boundaries passed. The prose-figure audit's lone flag is a parsing artifact within the valid conversion of 0.3%-15.5% to 300-15,500 per 100,000; the text identifies heterogeneous screening studies rather than a pooled diagnostic prevalence. Both scoped data tests passed. Repository ratchets for snippet length, title quotations, snippet grading and reference titles passed without new violations; node-class examples also passed.

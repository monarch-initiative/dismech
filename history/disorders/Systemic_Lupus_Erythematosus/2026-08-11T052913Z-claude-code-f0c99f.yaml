  summary: Record cuproptosis evidence-hierarchy knowledge gap (dismech#6381)
  details: |
    Added one KNOWLEDGE_GAP discussion, gap_sle_cuproptosis_evidence_hierarchy, recording that canonical cuproptosis is deliberately NOT modeled as a mechanism in this entry, and why.

    Source: PMID:42435071, the Inflamm Res review named in dismech#6381. It names this disease explicitly among the autoimmune diseases surveyed, and reports that the AID cuproptosis literature is transcriptomic, bioinformatic, or model-dependent and does not meet the five-part canonical bar: copper dependence, FDX1-lipoylation axis involvement, lipoylated-protein aggregation, Fe-S cluster destabilization, and functional rescue.

    The discussion attaches_to existing pathophysiology nodes in this entry, carries four snippet-verified evidence items from that single reference, and proposes one experiment whose decision_criterion is written against those five canonical criteria. No pathophysiology node, causal edge, treatment, or ontology binding was added: the deliberate non-assertion is the content. evidence_source is OTHER throughout because the source is a narrative review, which has no settled rule yet - see open issue #8184.


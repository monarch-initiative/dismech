  summary: OpenScientist GSE65391 dataset analysis of the canonical interferon hypothesis,
    assessed
  details: |
    Ran the execution-gated OpenScientist dataset-analysis template (templates/hypothesis_dataset_analysis.md, provider job 90f1de29-fb10-4734-bc54-35771bfb91d7) against the canonical hypothesis nucleic_acid_immune_complex_interferon_tissue_injury_model, using GEO GSE65391 (pediatric SLE whole blood, Illumina GPL10558), which was located through the NIAID Data Discovery Portal's MONDO:0007915 tag. Prespecified first-visit contrasts: a six-gene interferon score separates SLE from healthy (158 vs 46, d=2.18) and is higher with SLEDAI>=6 (94 vs 64, d=0.89; rho with SLEDAI +0.44, inverse with C3/C4). The prespecified nephritis contrast was null (33 vs 125, d=0.22), but its comparator pooled biopsy-confirmed NoLN (66, mostly SLEDAI<6) with 'Data Not Available' patients (59, 55 SLEDAI>=6). An assessor sensitivity script that reuses the provider's own functions gives nephritis vs NoLN d=0.57 (q=0.026), matching figures the provider reported without code; an activity-matched stratum has only 7 NoLN patients. Nephritis and high activity are near-collinear in this cohort, so the hypothesis's claim that organ injury is selected by local factors rather than by systemic interferon alone is not testable here. The provider's plasmablast severity-axis inference is rejected: plasmablast genes show no nephritis difference under either comparator. Verdict PARTIALLY_SUPPORTED. Provenance: the client extension allowlist dropped MANIFEST.yaml, analysis.py and environment.txt; they were restored from the provider artifacts zip, and nine flattened duplicates were removed after byte-identity checks. Manifest corrections were metadata and layout only (provider field, inputs list with gate field names, replay outputs moved from replay/output/ to replay/), recorded in assessor_corrections with the pre-correction sha256; the report was bound to the corrected manifest. An isolated replay with pinned versions reproduced all tables byte-identically, and just validate-hypothesis-analysis-run, validate-hypothesis-assessment and check-hypothesis-links pass. kb/disorders/Systemic_Lupus_Erythematosus.yaml is unchanged; a longitudinal within-patient model of the same cohort is the follow-up that could test the local-selection claim.

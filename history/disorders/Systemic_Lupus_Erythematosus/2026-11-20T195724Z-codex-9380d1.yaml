  summary: Map Systemic lupus erythematosus to OMIMPS:601744
  details: |
    Compared January 2026 OMIM series members, September 2026 MONDO children, and existing Disease scope. PS601744 is a mixed series: the January 2026 snapshot contains the general SLE record, susceptibility loci 1 through 15, and genetically defined SLE16, SLE17, and SLE18. The clinical autoimmune Disease here is not equivalent to that set of susceptibility and disease records. RelatedMatch preserves the connection without treating SLE as uniformly Mendelian or treating all series members as only risk loci. PRKCD-, TLR7-, and UNC93B1-related disease have separate entries in the KB, while the broad entry discusses polygenic and environmental contributions. MONDO:0007915 also has clinical and gene-related subdivisions; its crosswalk alone does not establish equivalence of these scopes.

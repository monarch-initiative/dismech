  summary: Add two computable phenotype definitions (PheKB 1058, HDR UK PH3024)
  details: |
    Added definitions[] for two computable phenotypes. PheKB 1058 (Barnado et al. 2017, Vanderbilt) records the highest-PPV algorithm: three or more counts of ICD-9-CM 710.0, ANA titer 1:40 or above, ever use of both a DMARD and a systemic corticosteroid, excluding 710.1 and 710.3 codes, combined ALL_OF. PheKB's only attachment for 1058 is the published paper, which the PheKB source lists but does not transcribe, so the codes and their evidence are quoted from PMID:27390187 and the code lists carry no source_reference; their labels are the paper's disease names. HDR UK PH3024 (OpenSAFELY / NHSD SLUPUS_COD, 87 SNOMED CT codes) was converted by just hdruk-definition. The entry passes just validate and just check-codelists.

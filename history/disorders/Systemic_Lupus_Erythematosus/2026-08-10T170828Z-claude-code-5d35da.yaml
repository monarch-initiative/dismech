  details: |
    Backfill for issue #8085. Stress and infection both point at the flare node, joining this entry's pre-existing ultraviolet link there, and both are graded just below it. Ultraviolet is recorded with known intermediates because this entry models the apoptotic and nucleic-acid-sensing route it acts through; nothing here follows stress or infection to any node, so both are INDIRECT_UNKNOWN_INTERMEDIATES. Within the stress link the strongest item is a longitudinal cohort finding worse disease activity and symptom burden at follow-up in patients whose stress increased, which measures the outcome this node holds; the two review items are PARTIAL because they support the category rather than the exposure. For infection, the onset arm was deliberately not drawn as a separate link even though this entry models nucleic-acid sensing and interferon activation that a viral trigger would plausibly enter, because the one item addressing the question states that the underlying mechanism remains to be elucidated. That item is carried on the link rather than left out, so the open question travels with the claim. Eight evidence items across the two exposures carried no evidence_source and would have defaulted to HUMAN_CLINICAL; reviews are now tagged OTHER and primary studies HUMAN_CLINICAL. Separately, and outside the scope of the backfill: both animal_models entries lacked the required name field, so this file did not validate against the schema on main. Names were added from data already in each record, MRL/lpr from the genotype field and NZB/W F1 from the background field, which is a mechanical fix rather than new curation. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 210 of 210 verified.

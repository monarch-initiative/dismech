  summary: Link ultraviolet exposure as a flare exacerbator
  details: |
    Backfill for issue #8085. Ultraviolet exposure is EXACERBATES with INDIRECT_KNOWN_INTERMEDIATES into the flare-ups node. The cited source is unusually explicit that these are two separable claims: that ultraviolet radiation may exacerbate pre-existing lupus, and that whether it is a risk factor for developing the disease remains unclear. EXACERBATES records the supported half and declines the unsupported one, which is exactly the distinction this effect value exists to encode. Validated with linkml-validate and just validate-terms; the file carries one pre-existing pathograph integrity issue, confirmed identical on origin/main.

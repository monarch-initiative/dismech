  summary: 'Adversarial-review fixes: add PMID:39321216 human SDHA-knockout functional
    data; retract overstated no-experiment-exists claims; drop ancestry-from-affiliation'
  details: |
    Post-review fix pass over the new NDAXOA entry, triaging findings from an independent adversarial verifier.

    The substantive finding was real and is fixed. PMID:39321216 (Kent, Klug and Heinrich, Clin Cancer Res 2024; PMC11611653) expressed SDHA missense variants in a clonal human SDHA-knockout cell line via Bxb1 recombination and measured SDH activity and SDHA abundance for each. Both codons this entry curates are in that panel: p.Arg451Cys is amorphic while retaining high SDHA protein (a stable, catalytically dead subunit, which the authors attribute to Arg451 stabilising the quinone-methide intermediate of covalent flavinylation), and p.Arg662Cys is one of the 22 assayed VUS and received strong functional evidence toward reclassification. The entry previously cited neither this paper nor its 2017 predecessor and asserted three times that no such experiment existed. Added the reference plus four evidence items (both pathophysiology nodes, both variant records), all snippets verbatim from the cached abstract, and rewrote the three overstated claims. The paper is abstract_only in references_cache because the AACR PDF returns HTTP 403 and PMC11611653 is not in the OA subset, so the per-variant figures are recorded in notes with explicit figure/table and retrieval provenance rather than quoted as snippets, following the same live-provenance pattern the entry already uses for ClinVar.

    Retractions and narrowings. The flavinylation node no longer says no human experiment exists; it now states the narrower and still-true claim that nobody has measured the covalent FAD linkage itself, and says so alongside the human loss-of-activity data. The dominant-negative node keeps its HYPOTHETICAL confidence and its enumerated absences (allele-specific quantification of assembled complex in a heterozygote, mutant-to-wild-type ratio within assembled complex II, heterozygous knock-in), which the Kent assay does not supply because it is run in a null background with no wild-type subunit to compete against, but no longer claims that no experiment has been performed on either allele. The sdha-flavinylation-assay-human-alleles proposed experiment no longer calls itself the single missing experiment; it now says the null-cell system exists, both alleles have been through it, and the residual experiment is the direct FAD-linkage measurement.

    Unsourced prose removed or sourced. Deleted the ancestry claim in the prevalence notes: no cached report states any family's ancestry, only the reporting centres (Newcastle upon Tyne, Bern, Afula), and the replacement text says exactly that and warns against reading it as ancestry. The inheritance claim that heterozygous SDHA null alleles are not rare now cites PMID:33960148 with a verbatim snippet (p.Arg31* in 0.3 percent of healthy controls, Korpershoek series) and is marked PARTIAL; a cross-reference in the genetic notes keeps that figure from being mistaken for an NDAXOA allele frequency.

    Smaller corrections. The ClinVar provenance URL gained the required &is_variationid parameter (the recorded URL returned an empty result set). The recorded OAK command is now runoak -i sqlite:obo:hgnc info hgnc:10680, since the bare form errors. The two ClinVar CURIEs moved from CLINVAR: to the schema-declared lowercase clinvar: prefix. The riboflavin prose no longer says lactate normalised; it now matches the cached wording, plasma lactate decreased to near-normal levels.

    Validation: just validate PASS, validate-terms PASS, reference validation 80/80 snippets verified, check_snippets_verbatim 80/80 PASS, check_folded_hyphens PASS, check_snippet_length --against-ref origin/main reports no new findings, pytest tests/test_data.py 16791 passed and 0 failed. No other kb/ file was modified; references_cache churn from the validator was reverted except the newly added PMID_39321216.md.

  summary: 'Create: SDHA-Related Neurodegeneration With Ataxia and Optic Atrophy (MONDO:0031006)'
  details: |
    New deep curation of NDAXOA (MONDO:0031006, OMIM:619259, SDHA / hgnc:10680), the autosomal dominant neurodegenerative phenotype of heterozygous SDHA missense alleles. NEC preflight was run with OAK before any content was written: MONDO:0031006 xrefs OMIM:619259 and carries RO:0004003 HGNC:10680; the ancestor query confirms it is NOT a descendant of MONDO:0100294 (mitochondrial complex II deficiency nuclear type 1); the gene-to-disease query returns exactly four SDHA MONDO terms, all curated here as differentials rather than merged. Mechanism is curated as a chain from a heterozygous arginine-to-cysteine substitution, through failure of covalent FAD attachment to the flavoprotein subunit, to a hypothesised catalytically inert subunit competing for complex II assembly, to the measured half-normal succinate dehydrogenase deficit, to selective bioenergetic failure in retinal ganglion cells, cerebellum and striated muscle. A separate node marks the divergence from the SDHx oncometabolite tumour arm. Six knowledge-gap discussions record what is genuinely unresolved: dominant-negative versus haploinsufficiency, tumour risk in carriers, tissue expression of the enzyme defect, the late-onset label, second-allele attribution, and the total absence of neuropathology. Validation: just validate PASS, validate-terms PASS, validate-references 75/75, check_snippets_verbatim 75/75 PASS, check_folded_hyphens PASS, pytest tests/test_data.py 16791 passed and 0 failed. No existing kb/ file was modified.

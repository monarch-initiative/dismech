  details: |
    Response to the PR #7846 REQUEST_CHANGES review (comment 5155370248). Two of the reviewer's four findings were actioned, one was out of scope, one was rejected with reasoning.

    IMPORTANT 2, actioned: PMID:39321216 per-variant prose was unverifiable from the cache. references_cache/PMID_39321216.md is content_type abstract_only, and the cached abstract reports only aggregate results (72 variants characterised, 22 VUS assayed, 21 of 22 yielding functional evidence, 19 favouring pathogenicity) while naming neither p.Arg451Cys nor p.Arg662Cys. The previous commit had already recorded figure/table provenance in three places, but five further prose sites asserted the same per-variant results with no marker at all, which is exactly the unpoliced-prose exposure of issue #7791: the snippet checkers read only evidence[].snippet, so all 80 snippets pass while the figure-level claims sit unchecked. Took the reviewer's option (c) uniformly rather than option (b), because scoping back to the aggregate would silently reinstate the "no human functional experiment exists" claim that the preceding commit retracted. Every site in the entry that states a per-variant result from this paper now names the source (PMC11611653), the specific figure or table, the 2026-08-01 retrieval date, and the fact that the cached reference is abstract-only and therefore cannot verify it. The eight sites are the entry-level scope notes, the Failure of Covalent FAD Attachment node's evidence explanation and notes, the Catalytically Inert SDHA Subunit node's evidence explanation and notes, the genetic-section allelic-architecture notes, both variant descriptions and both variant evidence explanations, and the sdha-flavinylation-assay-human-alleles proposed experiment. The entry-level note additionally states the provenance limit once, up front, so a reader meets it before any downstream node repeats it. No snippet was changed; all remain scoped to the aggregate statements the abstract supports.

    Independent verification attempted and failed, which is why the marker rather than the assertion is the fix. Europe PMC reports PMC11611653 as isOpenAccess N; the fullTextXML endpoint returns empty and the annotations API exposes title and abstract sections only, with no mention of residue 451 or 662. The AACR PDF is paywalled. The per-variant claims therefore remain a recorded full-text derivation from the earlier session, not something this session could re-verify, and the prose now says so rather than implying snippet support.

    SUGGESTION 3, actioned: riboflavin target_mechanisms treatment_effect changed from RESTORES to MODULATES. RESTORES asserts that the treatment returns a disrupted mechanism to normal function, which contradicts the entry's own treatment description ("no obvious mechanism against a subunit that cannot form the covalent linkage at all, and none at all if the dominant allele acts by competing for assembly slots"). MODULATES ("alters the mechanism without clear unidirectional effect") is the honest predicate. The link to the FAD-attachment node was kept rather than dropped, because the drug and the node are genuinely the same chemistry and the rationale is the reason the treatment is recorded at all; the edge description now states explicitly why the weaker predicate was chosen and that direction and magnitude are unestablished. Both evidence items were already PARTIAL and are unchanged.

    SUGGESTION 4, rejected: Saccharomyces cerevisiae under animal_models. The reviewer characterises this themselves as "a labelling nit, not a correctness problem" and notes it is "worth noting only in case the schema later grows a better-fitting slot". The schema offers no in-vitro or model-system slot that would fit a site-directed-mutagenesis yeast experiment better, the node already states in its own description that the residues mutated are yeast Arg582 and Arg638 rather than the human ones, that no alignment to human Arg451 or Arg662 was performed or asserted, and that no animal model of NDAXOA exists in any species. Relocating the content would lose it; inventing a slot is out of scope for this file. Left as is.

    IMPORTANT 1, out of scope: the missing deep-research artifact is being handled at the batch level and was not addressed here.

    Validation: just validate PASS (80/80 snippets verified against cached references), validate-terms PASS, check_snippets_verbatim 80/80 verbatim and 0 failed, check_folded_hyphens PASS with no new folded-scalar hyphen splits, check_snippet_length --against-ref origin/main reports no new snippets under 5 words, pytest tests/test_data.py PASS. One HTTP 403 was logged during reference validation for the third-party publisher PDF at erc.bioscientifica.com; it is an external paywall hit by the validator's full-text fetch, not a repository permission problem, and validation still passed. Only the disorder YAML and this history record were modified; the ~7,600 references_cache files rewritten by the validator (issue #7507) were reverted with git checkout, and no cache/*.csv file changed.

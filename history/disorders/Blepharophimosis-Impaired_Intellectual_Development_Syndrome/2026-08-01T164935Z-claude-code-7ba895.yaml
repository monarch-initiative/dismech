  summary: 'Create: blepharophimosis-impaired intellectual development syndrome'
  details: |
    De-novo creation of the BIS (SMARCA2, MONDO:0859139, OMIM:619293) entry.

    NEC preflight, run before any research output was used: MONDO:0859139 was confirmed via OAK to carry RO:0004003 to HGNC:11098 (SMARCA2) and skos:exactMatch OMIM:619293. The confusable allelic sibling disorder Nicolaides-Baraitser syndrome (NCBRS) was resolved to MONDO:0011053 (OMIM:601358; MONDO label "intellectual disability-sparse hair-brachydactyly syndrome"). Note a correction to issue 7692: the MONDO ID it quotes for NCBRS (MONDO:0009543) is wrong -- that ID is prominent glabella-microcephaly-hypogenitalism syndrome. The entry uses the verified MONDO:0011053.

    Deep research: 'just research-disorder claude_code' was run (report at research/Blepharophimosis-Impaired_Intellectual_Development_Syndrome-deep-research-claude_code.md, 20 min, 6 web searches, 74 turns, 23 citations). NEC gate applied to the report before use: SMARCA2 appears 98 times versus ADNP 15, SMARCA4 12, KAT6B 2, FOXL2 1, ARID1B 1; OMIM 619293 appears 12 times versus 601358 three times (each as an explicit NCBRS contrast). The report PASSED the gate and was used as a lead source only; every PMID and snippet it suggested was independently re-fetched with 'just fetch-reference' and verified verbatim against the cache.

    Evidence base. BIS-specific: PMID:32694869 (Cappuccio 2020, founding delineation, 14 BIS individuals) and PMID:38884529 (Sarli 2024, shared BIS / class-II-HVDAS episignature, 15 BIS individuals). Independent BIS-versus-NCBRS confirmation: PMID:37500730 (Valencia 2023 pan-mSWI/SNF landscape; full text cached, contains an explicit statement that SMARCA2 mutations outside the helicase domain cause BIS). NCBRS comparator for the differential: PMID:22366787 (Van Houdt 2012). Scoped general BAF biology, all marked PARTIAL or background: PMID:17640523 (npBAF/nBAF subunit switch), PMID:9843504 (Brm-null mouse), PMID:38751117 (SMARCA2 M856V / SMARCA4 M866V paralog episignature convergence, with the BIS attribution explicitly flagged as inference because the Sarli variant table is not quotable).

    Deliberate NEC exclusions, recorded in the entry notes: PMID:40513420 (Seizure 2025 SMARCA2 epilepsy cohort -- 77.3 percent of variants in the SNF2-ATPase domain, i.e. the NCBRS allele class), PMID:38877377 (prenatal case framed within the NCBRS spectrum), PMID:42528014, PMID:34906496 and PMID:34706719 (multi-gene BAFopathy/chromatin-remodeling cohorts that do not state which SMARCA2 disorder their patients have), and PMID:26468571 (GeneReviews chapter for NCBRS).

    Known limitations, all documented in the entry notes rather than papered over. Both primary BIS papers are paywalled and absent from PMC and Europe PMC, so only their abstracts are quotable; this caps phenotype depth. The HPO annotation of OMIM:619293 (all sourced to PMID:32694869 full-text tables) records a much richer feature list with n/N counts -- hypotonia, thin upper lip vermilion, sparse eyebrows and eyelashes, wide nasal bridge, tapered fingers, hypertelorism, frontal bossing, flexion contractures -- which were deliberately NOT curated as phenotype entries rather than asserted without a quotable snippet. Frequency bands are set only on the three definitional features (blepharophimosis, intellectual disability, global developmental delay) and each carries a notes block stating the basis. The word "non-truncating" is deliberately not asserted of the BIS allele class, because the quotable abstract applies it to the NCBRS class only. No GeneReviews chapter exists for BIS (verified with three PubMed queries). Orphanet ORPHA:637013 was not cited because the pinned Orphadata snapshot no longer matches upstream (sha256 mismatch) and bumping data/orphadata/MANIFEST.yaml is out of PR scope; the downloaded XML was deleted and the manifest left untouched. No ClinGen record was cited for the same manifest-scope reason.

    Also curated: an EMERGING mechanistic_hypotheses entry (BIS = BAF inter-subunit interface lesion versus NCBRS = ATPase catalysis lesion) with its evidence marked PARTIAL because no BIS allele has been biochemically assayed; an animal_models entry for the Brm-null mouse; and three discussions -- two KNOWLEDGE_GAP (BIS allele biochemical consequence; natural history and management) and one HUMAN_MODEL_MISMATCH (Brm-null mouse develops normally via BRG1 compensation and so cannot model a dominant non-truncating allele).

    Validation: just validate (schema + terms + references) passes; just validate-terms passes; just validate-references reports 50/50 snippets verified; scripts/check_snippets_verbatim.py reports 50/50 verified verbatim; scripts/check_folded_hyphens.py --check OK; just validate-history-all passes over 2906 records; pytest tests/test_data.py passes for this file (the one suite failure, SETD5_Haploinsufficiency_Syndrome, is pre-existing on origin/main and unrelated). references_cache churn from 'just validate' was discarded with git checkout and only the explicitly fetched PMID cache files were staged.

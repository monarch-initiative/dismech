  summary: 'Address PR #7727 review: remove residual non-truncating assertions; add
    SMARCA2-degrader inverse-pharmacology guardrail'
  details: |
    Responds to the ai4c-reviewer REQUEST_CHANGES review on PR #7727 (two IMPORTANT items, five suggestions).

    IMPORTANT 1 - reconciled four residual 'non-truncating' assertions with the deliberate under-assertion recorded in genetic[].notes. PMID:32694869's abstract applies 'nontruncating' to the NCBRS variant class, not to the BIS class, so the entry declines to assert the BIS consequence class; but mechanistic_hypotheses[0].description, animal_models[0].description, and the HUMAN_MODEL_MISMATCH discussion prompt and rationale all still rested on that premise. All four were rewritten to lean only on what is directly evidenced: heterozygous, de novo, dominant, clustered outside the helicase domains as the founding paper partitions them, plus two positive arguments against simple haploinsufficiency (the phenotypically normal Brm-null mouse rescued by BRG1 compensation, and the reproducible BIS DNA methylation episignature). The word 'non-truncating' now survives only where it quotes or paraphrases PMID:37500730's statement about the aggregate mSWI/SNF NDD variant class, in evidence explanations that are PARTIAL and explicitly scoped as not BIS-specific.

    IMPORTANT 2 - added an inverse-pharmacology guardrail paragraph to the disease-level notes block (extended the existing block; no new notes key). Records that SMARCA2-lowering oncology drugs developed for SMARCA4-deficient cancers are mechanistically inverse to a SMARCA2-opathy and must be excluded from BIS treatment curation. All five NCT records were verified live against the ClinicalTrials.gov v2 API on 2026-08-01 rather than copied from the deep-research report: NCT06560645 PRT7732 (terminated), NCT05639751 PRT3789 (completed), NCT06682806 PRT3789+pembrolizumab (terminated), NCT07284186 PLX-61639 (recruiting), NCT06561685 LY4050784 (recruiting). That verification corrected the review's framing: LY4050784 is a selective SMARCA2/BRM INHIBITOR, not a degrader, per its official title; the note now says so. Two of the protocols themselves exclude participants with SMARCA2 loss-of-function or loss of expression, which is recorded as corroboration.

    Suggestion b (taken) - the Blepharophimosis phenotype description said 'Horizontally narrowed palpebral fissures', contradicting the HPO definition of HP:0000581 ('A fixed reduction in the vertical distance between the upper and lower eyelids with short palpebral fissures', confirmed via OAK). Reworded to state both axes.

    Suggestion a (declined, with a mitigation) - the reviewer suggested folding HP:0045025 Narrow palpebral fissure into the HP:0000581 Blepharophimosis entry as a near-duplicate. Declined: the HPO annotation of OMIM:619293 itself carries both terms at different counts (blepharophimosis 14/14, narrow palpebral fissure 10/14, both sourced to PMID:32694869), verified directly against the HPO annotation API on 2026-08-01, so collapsing them would discard a distinction the source annotation makes; and HP:0045025 is the term carrying the BIS-versus-HVDAS shared-craniofacial-feature evidence that motivated the episignature study. Added a notes block on the HP:0045025 entry recording the sibling relationship, the definitional difference, and an explicit instruction that consumers treat it as subsumed by HP:0000581 rather than additive, which addresses the reviewer's actual concern (downstream double-counting).

    Suggestion c (taken) - added a domain-boundary paragraph to genetic[].notes. UniProt P51531 annotates Helicase ATP-binding at residues 736-901 (feature table fetched from the UniProt REST API 2026-08-01), and the BIS alleles p.(Met856Val) and p.(Leu766Val) fall inside that span, so 'outside the helicase domains' is the authors' functional partition (ultra-conserved catalytic motifs), not UniProt's boundary. Flagged because the PMID:38751117 evidence item on the episignature node is about M856V.

    Suggestion e (declined) - PMID:17640523 evidence_source remains IN_VITRO. CLAUDE.md classifies cultured cells of animal origin as IN_VITRO, and both evidence explanations already state the assay basis (proteomic analysis of neural stem/progenitor cell complexes). The reviewer agreed this is a judgment call rather than an error.

    Suggestion d (not actionable in this PR) - the Wiley open-access fetcher improvement for PMID:38884529 is a change to the reference-fetching tooling, out of scope for a single-disorder content PR; raised in the PR comment instead.

    No new PMIDs were cited, so no new reference cache files were fetched. Validation after reverting the references_cache side-effect churn from 'just validate': schema validation passed, term validation passed, reference validation 52/52 snippets verified, scripts/check_snippets_verbatim.py 52 verified / 0 failed, check_folded_hyphens.py clean, validate-history-all passed.

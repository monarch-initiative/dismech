  details: |
    IUIS Table 2 publication-completeness review against the cached full text of PMID:19267933. Quantified existing phenotypes: Paris-Trousseau penetrance at least 88.5%, giant platelets/alpha granules, intellectual disability 97% with deletion-size correlation, height below 10th centile in 75%, congenital heart malformations 56% (95% of deceased children; HLHS 5%). New phenotypes: structural brain abnormalities (65% of those imaged), ADHD, cryptorchidism (36% of males). Fidelity fix: FLI1 relationship_type SUSCEPTIBILITY (schema-defined as polygenic/GWAS loci) corrected to CAUSATIVE for the Paris-Trousseau component phenotype, with first-ever evidence on that gene entry. New sections: progression (about 20% mortality in first two years from CHD/bleeding; diagnosis timing; platelet-count normalization), clinical_burden (HIGH), differential_diagnoses (Turner, Noonan), treatments (prophylactic platelet transfusion NCIT:C15366; genetic counseling and prenatal diagnosis NCIT:C15240), and a notes block recording the no-known-malignancy-excess statement and the deliberate omission of controversial growth hormone therapy. One snippet shortened to avoid a hyphen-broken word in the cached PDF text. Validated with just validate, count-verified-snippets, check-duplicate-keys, check-entity-refs, validate-disorders.

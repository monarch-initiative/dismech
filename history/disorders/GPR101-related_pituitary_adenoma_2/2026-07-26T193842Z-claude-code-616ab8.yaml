  summary: 'Review: GPR101-related pituitary adenoma 2 (X-LAG)'
  details: |
    Manual correctness review of claim-evidence matching.

    Internal inconsistency: the node 'Increased growth hormone secretion' sits in the
    GPR101 copy-number-gain chain, but its only evidence was the p.E308D transfection
    experiment - the point-variant branch this same entry retains only as a provisional
    association and cites a REFUTE item against. Worse, the discovery paper explicitly
    reports that overexpression of nonmutant GPR101 alone did NOT increase GH secretion
    or proliferation in GH3 cells.

    - Added PMID:25470569 human evidence (elevated IGF-1 in Xq26.3 microduplication
      carriers) as the primary anchor for this node.
    - Downgraded the p.E308D transfection item SUPPORT -> PARTIAL, explaining it belongs
      to the provisional point-variant branch.
    - Added the nonmutant-GPR101-overexpression result as REFUTE, since it is the
      closest cell-model analogue of the dosage mechanism and it failed.
    - Added knowledge gap gap_gpr101_dosage_to_gh_secretion citing the paper's own
      statement that the mechanism linking GPR101 to increased GH secretion is unclear.

    All snippets re-verified as exact substrings of references_cache; linkml-validate,
    term validation, and graph edge-target validation pass.

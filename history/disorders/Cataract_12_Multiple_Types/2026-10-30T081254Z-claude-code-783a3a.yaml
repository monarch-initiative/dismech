  summary: 'Create: Cataract_12_Multiple_Types'
  details: |
    New entry for cataract 12 multiple types (CTRCT12, OMIM 611597), caused by
    BFSP2 (phakinin/CP49), structured after the allelic sibling Cataract_33
    (BFSP1). Curated from PubMed: the founding dominant families (E233del,
    PMID:10739768; R287W juvenile-onset, PMID:10729115), later dominant
    families (E233del Y-sutural with myopia, progressive sutural and
    progressive congenital; R339H lamellar; G112E pulverulent sutural), panel
    and exome cohorts reporting further E233del families and an R89W variant of
    uncertain significance, and the recessive Saudi family with a likely null
    allele (PMID:21836522, PMID:26622071). Pathophysiology has two initiating
    nodes (heterozygous dominant variants; biallelic loss of function)
    converging on beaded filament assembly failure, loss of fiber cell
    architecture, and lens light scattering, which conforms to
    cataract_lens_opacification. The dominant-allele effect on filament
    assembly is a review prediction and is marked INDIRECT; no functional study
    of a human BFSP2 allele was found. Animal models: the targeted CP49
    knockout and the natural Bfsp2 deletion in 129/CBA/101/FVB/N strains.
    Myopia is included from one family, wired to light scattering only through
    a review's proposed explanation. 24 PMIDs cited, 67 snippets.

    One OpenScientist deep-research report was used
    (research/Cataract_12_Multiple_Types-deep-research-openscientist.md):
    18/18 references resolved; term validation flagged six mislabelled CURIEs
    in the report (none used here). preflight-dr returned WARN only because
    "AR" (autosomal recessive) was counted as a gene. The report agreed with
    the PubMed curation; two of its sources were folded in (PMID:15777782 on
    CP49 being tailless and unable to assemble alone; PMID:31317088 on general
    pediatric cataract surgical indication). The report places family ADCC-3 in
    Germany; the source paper is from Oregon, so that statement was not used.


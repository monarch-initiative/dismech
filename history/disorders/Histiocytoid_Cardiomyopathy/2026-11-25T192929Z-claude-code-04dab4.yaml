  summary: 'Gene-family review: NDUFB11, NDUFAF2, NDUFB9 (and MT-CYB activity binding)'
  details: |
    The node Mitochondrial Respiratory Chain Subunit Defect named MT-CYB and NDUFB11 with protein-complex terms but no molecular function. It now binds each gene's own activity, with a description saying which arm each belongs to: structural molecule activity, decreased, for NDUFB11, an accessory non-catalytic structural component of complex I (PMID:28050600), and quinol-cytochrome-c reductase activity, decreased, for cytochrome b (MT-CYB), the catalytic core of complex III, supported by a new evidence item quoting the biochemically documented ubiquinol cytochrome c oxidoreductase defect in the m.15498G>A patient (PMID:10960495). The genetic records were checked: NDUFB11 causative and de novo; NDUFAF2 and NDUFB9 typed UNKNOWN because they rest on one doubly heterozygous proband (PMID:25921236); these were left unchanged.

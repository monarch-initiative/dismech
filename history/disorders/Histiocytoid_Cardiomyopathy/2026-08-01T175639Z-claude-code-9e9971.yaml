  summary: 'Create: Histiocytoid Cardiomyopathy (MONDO:0010771)'
  details: |
    De-novo curation of histiocytoid cardiomyopathy (MONDO:0010771, OMIM 500000), an ultra-rare female-predominant arrhythmogenic infantile cardiomyopathy of Purkinje-like oncocytic cardiomyocytes. NEC preflight was run per CLAUDE.md before any deep-research output was used: runoak on MONDO:0010771 confirmed the OMIM:500000 xref and all four queried synonyms (infantile xanthomatous cardiomyopathy, oncocytic cardiomyopathy, foamy myocardial transformation of infancy, Purkinje cell hamartoma), and gene identity was independently confirmed against primary literature for both arms (MT-CYB/complex III via PMID:10960495 and PMID:6093033; NDUFB11/complex I via PMID:25921236 and PMID:28050600), matching the Edison/falcon report's principal gene. Preflight PASS. Duplicate preflight against origin/main kb/, plus all-state PR and issue searches by MONDO ID and by each synonym, found no existing coverage. Deep research: falcon/Edison via just research-disorder (566 s, 18 citations, 1 artifact); the report was read in full and treated as leads only. Two DR claims attributed to the 2015 WHO cardiac-tumour review were checked against PMID:26725181, found absent from that abstract, and dropped rather than cited; the DR report's assertion that no OMIM identifier exists was rejected against the MONDO xref. Curated content: six-node pathophysiology chain from respiratory-chain subunit defect through OXPHOS failure, oncocytic Purkinje-myocyte transformation, hamartomatous conduction-system nodules and arrhythmogenic triggered activity to circulatory failure and sudden death, with biological_scale tags; three mechanistic_hypotheses (CANONICAL mitochondrial, ALTERNATIVE Purkinje hamartoma, EMERGING IL-33/S100A axis); 15 phenotypes; 3 histopathology findings; 6 genetic entries including REFUTE evidence against MT-CYB generality and DISPUTED HCCS/COX7B; 5 treatments with target_mechanisms; 2 animal models (zebrafish ndufb11 morphant and a Savannah kitten veterinary case); 3 discussions including a HUMAN_MODEL_MISMATCH on zebrafish model fidelity. No GeneReviews chapter exists for this disease (PubMed search returned zero results). Validation: just validate passes schema, term and reference checks, with 111/111 snippets verified against cached abstracts.

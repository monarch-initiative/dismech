  summary: 'Create: NEDHFDB (WBP4 spliceosomopathy)'
  details: |
    De novo curation of NEDHFDB (MONDO:0971043, OMIM:620852, WBP4), resolving issue #8540. NEC preflight: OAK confirmed MONDO:0971043 carries xref OMIM:620852 and relationship RO:0004003 to HGNC:12739 WBP4; just preflight-dr PASSED on the falcon report with WBP4 the top gene at 23 mentions. Deep research: falcon (Edison) only. The report retrieved no primary-paper content beyond an Open Targets query and supplied no citable snippets, so it was used for orientation only - confirming the gene, the recessive mechanism, the absence of interventional trials and the absence of any animal or iPSC model - and its suggested ontology terms were re-derived from OAK rather than trusted. All evidence derives from four primary references fetched with just fetch-reference: PMID:37963460 (AJHG 2023 defining cohort, abstract), PMID:37425688 (medRxiv preprint, open-access full text used for detailed clinical and RNA-seq content), PMID:28838205 (FBP21/Brr2 in vitro mechanism) and PMID:33276377 (WBP11 differential, human plus mouse). No GeneReviews chapter exists; PubMed searches for WBP4 GeneReviews[All Fields] and for the disease name with GeneReviews[TI], run 2026-08-17, returned zero results, and this is recorded in the entry notes. Seven-node pathograph runs from biallelic loss-of-function variants through complete protein loss and loss of SNRNP200 restraint in the spliceosomal B complex to transcriptome-wide mis-splicing and two clinical arms; every node carries a single biological_scale and a mechanism_confidence, and every phenotype is reachable from a mechanism node. Patient-derived primary fibroblasts are curated under experimental_models with three modeled_mechanisms links, including a LOW-fidelity PARTIALLY_RECAPITULATES link carrying explicit limitations. Three discussions: a KNOWLEDGE_GAP for the unproven mis-splicing-to-phenotype step with three proposed experiments, a HUMAN_MODEL_MISMATCH for fibroblast-to-brain fidelity, and an OPEN_QUESTION for the unexplained variable expressivity. Frequency bands are mapped only from the source qualitative language, with most common and almost half both mapping to FREQUENT; single-case features carry no frequency; group-level HP terms are bound where the source reports a category. Prevalence is CASES_IN_LITERATURE / ULTRA_RARE with no invented rate. Treatment action terms use NCIT rather than MAXO because TreatmentActionTerm is reachable only from NCIT:C25218. Validation: just validate, just validate-references and just validate-terms all pass, with 71/71 snippets verified against cached references.

  summary: 'Create: DPAGT1-congenital disorder of glycosylation'
  details: |
    Created the DPAGT1-CDG entry (MONDO:0011964, CDG-Ij). Modelled the mechanism from hypomorphic biallelic DPAGT1 variants through reduced GlcNAc-1-phosphotransferase activity at the first committed step of lipid-linked oligosaccharide synthesis, to global protein N-hypoglycosylation with a type I transferrin isoform pattern, and on to the severe multisystem phenotype. Kept the account of the ALG13-ALG14-DPAGT1 complex consistent with the existing ALG14 congenital myasthenic syndrome entry, and was explicit about the boundary with the milder allelic DPAGT1 myasthenic phenotype. Every evidence snippet was verified as an exact substring of a fetched reference cache file; all offline gates pass.

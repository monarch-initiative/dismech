  summary: Tag subtype-specific phenotypes and genes with subtype foreign keys
  details: |
    Added subtype foreign keys to make gene-specific associations machine-queryable, now that all three subtypes are defined and MONDO-mapped. Tagged the five FOXC1/RIEG3-characteristic phenotypes (Hearing Loss, Congenital Heart Defects, Cerebral White Matter Abnormalities, Ventriculomegaly, Hypotonia and Developmental Delay) with subtype 'Axenfeld-Rieger Syndrome Type 3 (RIEG3)', supported by Reis 2023 PMID:35882526 and PMID:32741584. Tagged the PITX2 and FOXC1 genetic blocks with their subtypes RIEG1 and RIEG3. Left genuinely cross-subtype phenotypes (glaucoma, posterior embryotoxon, iris hypoplasia, corectopia, dental, craniofacial, periumbilical skin) untagged to avoid asserting false subtype exclusivity. All 1645 subtype foreign-key checks pass; passes just validate.

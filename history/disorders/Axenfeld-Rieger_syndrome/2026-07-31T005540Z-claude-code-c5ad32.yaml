  summary: Add missing RIEG2 subtype and map all three ARS subtypes to MONDO
  details: |
    Follow-up to the augmentation commit. Coverage/mapping gap fix on has_subtypes. Added the previously missing Axenfeld-Rieger syndrome type 2 (RIEG2, MONDO:0011097, OMIM:601499) as the 13q14 locus with no definitively identified gene, cited to Phillips 1996 PMID:8751862. Added subtype_term and mondo_mappings to all three subtypes: RIEG1 MONDO:0008386 (PITX2, hgnc:9005), RIEG2 MONDO:0011097, RIEG3 MONDO:0011233 (FOXC1, hgnc:3800). Corrected the RIEG3 description, which previously claimed phenotypic similarity to RIEG1, to reflect the distinct expanded FOXC1opathy phenotype (earlier severe glaucoma, hearing loss, CHD, skeletal and CNS involvement; overlaps De Hauwere syndrome), cited to Reis 2023 PMID:35882526. All snippets verified as exact substrings; passes just validate.

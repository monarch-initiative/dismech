  summary: 'Augment Axenfeld-Rieger syndrome: inheritance, classifications, prevalence,
    FOXC1 CNS phenotypes, variant evidence'
  details: |
    Augmented existing ARS umbrella entry. Added inheritance block: autosomal dominant HP:0000006 for both RIEG1/RIEG3, and digenic HP:0010984 citing the Kelberman 2011 double-heterozygote report PMID:21837767. Added classifications block with Harrison's GENETICS_ENVIRONMENT_DISEASE. Rewrote prevalence to the well-cited ~1:200,000 birth-prevalence estimate BAND_1_9_PER_1000000 rate 0.5 per 100000, sourced to PMID:32357855 and PMID:35733478, removing the deprecated percentage field and several unrelated-disease NO_EVIDENCE references. Replaced the three NO_EVIDENCE items on the PITX2 V45L p.Val136Leu variant with the correct primary functional source Priston 2001 PMID:11487566. Added FOXC1-related CNS/neurodevelopmental phenotypes white matter HP:0002500, ventriculomegaly HP:0002119, hypotonia HP:0001290, plus a Systemic Anomalies CNS downstream edge, and gene-specific genotype-phenotype evidence on the PITX2 and FOXC1 genetic blocks, all from the landmark Reis 2023 cohort PMID:35882526. Tagged pathophysiology nodes with biological_scale. Research base: existing Falcon deep-research report; a fresh Falcon run failed 402 out of credits. All snippets verified as exact substrings of just-fetched caches; passes just validate schema, terms, references.

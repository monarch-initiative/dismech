  summary: Add BEC biomarker and enhance IL-5 eosinophil biology
  details: |
    Added structured blood eosinophil count (BEC) biochemical biomarker with LOINC binding, clinical reference ranges, and interpretation bands (normal 0-300, mild 300-400, moderate 400-600, high ≥600 cells/μL) correlating with biologic therapy thresholds. Evidence from PMID:42613890 establishes BEC as most accessible biomarker for eosinophilic asthma phenotyping. Enhanced Type 2 Immune Response pathophysiology node with explicit IL-5 mechanism as principal regulator of eosinophil maturation/survival via IL-5R signaling.

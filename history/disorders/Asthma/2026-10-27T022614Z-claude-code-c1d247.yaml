  summary: Conform Asthma to the new beta2_adrenergic_receptor_agonism module
  details: |
    Wires this entry to the new beta2_adrenergic_receptor_agonism module (GPCR project, Workstream A).

    Adds one pathophysiology node, 'Beta2 Agonist Occupancy of Airway Smooth Muscle Receptors', conforming to
    the module's trigger and carrying no downstream edge: the relation to the entry's existing
    Bronchoconstriction node is reversal, and a downstream edge would assert that agonist occupancy causes the
    obstruction the drug relieves. The node's description names Bronchoconstriction as what is reversed without
    drawing an edge to it.

    Both pre-existing beta-agonist treatments, 'Long-acting Beta Agonist' and 'Short-acting Beta Agonist', are
    wired to that one node with ACTIVATES links and each gains therapeutic_modality: SMALL_MOLECULE, which both
    lacked. They link to a single node rather than two because the receptor is the same; what differs is how
    the agonist reaches it and for how long, which each link's description states.

    This entry was already the best conformer available: the two treatments were separate before this change,
    unlike the bundled bronchodilator treatments elsewhere in the corpus, so no treatment splitting was needed.


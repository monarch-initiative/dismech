  summary: Add mechanistic computational models for asthma
  details: |
    Added two complementary paper-derived physiological models: a mechanochemical morphoelastic airway-wall model linking transient challenges, smooth-muscle contraction, mechanotransduction, and long-term remodeling; and an integrative 12-generation bronchial-tree model of acute heterogeneous constriction, pressure, and ventilation defects. Linked them to existing airway inflammation, bronchoconstriction, and remodeling nodes with distinct fidelity and limitations. A three-iteration OpenScientist exploration supported the wall-scale feedback as a simulation hypothesis, clarified that the tree model represents a different acute flow-pressure instability, and found no publicly deposited exact solver or operational human asthma digital twin. All evidence snippets and model exports were validated.

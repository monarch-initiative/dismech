  summary: Add CC16/SCGB1A1 club-cell secretoglobin protective pathophysiology node
  details: |
    Added one pathophysiology node 'Reduced Club Cell Secretoglobin (CC16/SCGB1A1) Anti-Inflammatory Protection' capturing the protective role of club-cell CC16 (SCGB1A1/uteroglobin/CC10). Bound club cell (CL:0000158), SCGB1A1 (hgnc:12523), phospholipase A2 inhibitor activity (GO:0019834), negative regulation of inflammatory response (GO:0050728) and negative regulation of type 2 immune response (GO:0002829); tagged biological_scale MOLECULAR. Wired a downstream causal edge to the existing 'Type 2 Immune Response / Th2 Signaling' node (reduced CC16 de-represses the Th2 program). Evidence: mouse CC10-knockout/reconstitution Th2-suppression study (PMID:15356574, MODEL_ORGANISM) on the edge; human Tucson Children's Respiratory Study cohort low-CC16/asthma and lung-function/AHR findings plus a background phospholipase A2 inhibition statement (PMID:30543455, HUMAN_CLINICAL and IN_VITRO/BACKGROUND) on the node. All snippets verbatim-verified. Validated with just validate, count-verified-snippets (218/218), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-snippet-grading, and the authoritative validate-disorders.

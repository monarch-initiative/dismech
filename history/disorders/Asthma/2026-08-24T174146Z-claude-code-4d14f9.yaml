  summary: Add NO2-specific environmental exposure bound to ECTO:9000252
  details: |
    Added an 'Ambient Nitrogen Dioxide (NO2)' environmental entry bound to ECTO:9000252, linked with influences_mechanisms to the existing 'Airway Inflammation' node (EXACERBATES, INDIRECT_UNKNOWN_INTERMEDIATES), citing the already-curated PMID:35307034 Berlin cohort. The point of the change is that the entry's general 'Air Pollution' factor cites a mixture of pollutants (PM10, mould, NO2, generic pollution) against one generic ECTO:8000036 term, so the pollutant the study measured was not the pollutant the exposure term named; this splits out the one pollutant with a quantitative association in the cited evidence. Deliberately did NOT declare conformance to the new particulate_air_pollution_injury module: the asthma inflammation node is predominantly type-2/eosinophilic while that module's effector node is neutrophilic, so conformance would claim more than the evidence in this entry supports. That decision is recorded in the new entry's notes. Schema, term and snippet validation pass.

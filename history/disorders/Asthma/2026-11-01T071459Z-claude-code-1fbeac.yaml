  summary: Add respiratory-sensitizer lysine-reactivity axis and HLA-DR7 occupational
    finding (#15944)
  details: |
    Added an evidence item to the Occupational Exposures environmental node (PMID:34003265) giving a protein-reactivity-chemistry axis (lysine versus cysteine preference) that separates low-molecular-weight respiratory sensitizers from the cysteine-preferring skin-sensitizer chemistry curated in Contact_Dermatitis.yaml, noting the effect is driven largely by acid anhydrides rather than being general. Added a new genetic entry, HLA-DRB1 (HLA-DR7 serotype; occupational sensitization to animal protein allergens), citing PMID:12704360, distinct from the existing general HLA-DQ asthma association: this is laboratory-animal-allergen occupational asthma, a protein allergen presented without covalent haptenation, used as the contrast case in Contact_Dermatitis.yaml's new HLA-basis-for-hapten-susceptibility knowledge-gap discussion. Ran just validate-disorders, check-entity-refs, check-enum-values, check-duplicate-keys, list-gene-term-mismatches; all pass (one benign advisory on the HLA serotype naming).

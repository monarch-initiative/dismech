  summary: 'Review round: re-source BEC reference range and bands, cite IL-5 prose'
  details: |
    Review round on PR #11914 (reviewer verdict CHANGES_REQUESTED), addressing the
    blocking items and the three actionable suggestions in one pass.

    Blocking items:
    - The BEC biochemical evidence item spliced the first and last sentences of the
      PMID:42613890 RESULTS section together, dropping three sentences in between.
      Split into two evidence items, each quoting one contiguous sentence.
    - The reference_ranges 0-300 cells/uL interval was a biologic-therapy decision
      threshold presented as an adult laboratory normal interval, and its attached
      snippet contained no number. Removed the numeric bounds: the record now asserts
      no laboratory reference interval, and a notes block says so and says why.
    - The interpretation bands (300/400/600 cells/uL) and their interpretation prose
      were uncited, and two were wrong on the literature. Replaced with the four
      baseline blood eosinophil strata published in the DREAM/MENSA secondary analysis
      (PMID:27177493) - below 150, 150-299, 300-499, 500 or greater cells/uL - with
      each boundary carrying a quoted source, and CALIMA (PMID:27609406) corroborating
      the 300 cells/uL cut. Dropped the severity grades, which graded response
      prediction as if it were clinical severity. abnormal_flag is NORMAL below 500
      cells/uL, since those counts sit inside the conventional laboratory range for
      this analyte.
    - The new IL-5 prose on the Type 2 Immune Response / Th2 Signaling node carried no
      supporting evidence. Added the PMID:42613890 sentence naming IL-5 as the principal
      regulator of eosinophil maturation and survival, and trimmed the uncited claim
      about IL-5R on eosinophil progenitors down to the receptor-alpha-on-eosinophils
      claim that CALIMA supports indirectly through benralizumab depleting eosinophils.

    Suggestions taken:
    - quote_role REVIEW_SYNTHESIS on the two narrative-review sources (PMID:42613890,
      PMID:29427989) and PRIMARY_RESULT on the two trial analyses.
    - Swapped the PMID:29427989 snippet for the sentence that names blood eosinophil
      counts as a phenotyping input, rather than the phenotype/biologic sentence whose
      support for the explanation took an inference step.
    - Added a notes block distinguishing this disease-wide, LOINC-bound record from the
      subtype-scoped "Eosinophils" biochemical record above it.
    - Normalized the unit strings to UCUM cells/uL.

    New reference caches: PMID_27177493 (DREAM/MENSA threshold analysis) and
    PMID_27609406 (CALIMA). Validation: just validate kb/disorders/Asthma.yaml passes
    (schema, terms, references; 210/210 snippets verified), plus check-duplicate-keys,
    check-entity-refs, check-causal-targets, check-qualifier-terms, check-folded-hyphens,
    check-snippet-length, check-title-snippets, check-snippet-grading, check-enum-values
    and check-reference-titles.

  summary: Link allergen, pollutant, smoke and occupational exposures
  details: |
    Backfill for issue #8085. Five entries graded three ways against the same disease. Allergens are TRIGGERS into the type 2 immune response node. Occupational exposures are also TRIGGERS but into airway inflammation, because occupational asthma is distinctive in causing new-onset disease in previously unaffected adults. Air pollution and tobacco smoke are EXACERBATES: both cited sources report aggravation and increased severity of established asthma rather than causation, so grading them as triggers would have overstated what the evidence says. Prenatal acid-suppressive medication exposure is PREDISPOSES, a modest relative risk of 1.34 for childhood asthma with no established mediating step. Validated with linkml-validate and just validate-terms, and every new evidence item was verified part-by-part against the committed reference cache by a local audit. The project's just validate-references sweep was not run to completion on this tranche locally because it rescans the whole cache per file; CI runs it authoritatively on the pull request; integrity issue count unchanged. PR review found the Allergens link's citation did not support its grading: PMID:29732974 is a food-allergy comorbidity mini-review whose snippet makes only a comorbidity-and-severity claim, while the link asserted INDIRECT_KNOWN_INTERMEDIATES naming epithelial alarmin release and antigen presentation as those intermediates. It now cites PMID:20406590, already cached and cited elsewhere in this entry, whose sentence names the active role of airway epithelium and the central importance of dendritic cells, which are precisely the intermediates claimed. evidence_source is set explicitly to OTHER since that source is a narrative review.

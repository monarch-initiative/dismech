  summary: Link allergen, pollutant, smoke and occupational exposures
  details: |
    Backfill for issue #8085. Five entries graded three ways against the same disease. Allergens are TRIGGERS into the type 2 immune response node. Occupational exposures are also TRIGGERS but into airway inflammation, because occupational asthma is distinctive in causing new-onset disease in previously unaffected adults. Air pollution and tobacco smoke are EXACERBATES: both cited sources report aggravation and increased severity of established asthma rather than causation, so grading them as triggers would have overstated what the evidence says. Prenatal acid-suppressive medication exposure is PREDISPOSES, a modest relative risk of 1.34 for childhood asthma with no established mediating step. Validated with linkml-validate, just validate-terms and just validate-references; integrity issue count unchanged.

  summary: 'Genetics pass: MONDO anchoring of the MDDG gene-by-severity series'
  details: |
    Genetics pass for the genetics-gap campaign (issue #12248, series-041). The entry already curated all 17 alpha-dystroglycan glycosylation genes in the genetic section, in per-gene has_subtypes rows, and as genes descriptors on the core glycosylation node, so no gene was missing. The gap was ontology anchoring: none of the MDDG series MONDO classes was bound anywhere in the entry, which is why a gene-keyed knowledge-graph comparison reported these subtypes as uncurated. Enumerated all 38 hierarchical descendants of MONDO:0018276 via OLS4 and read each one's RO:0004003 gene edges. Nineteen carry a gene edge and nineteen carry none. Added mappings.mondo_mappings to all 17 gene rows, covering every gene-edged descendant plus two classes that carry a gene edge from outside the branch. The predicate is skos:narrowMatch on the fourteen MDDG rows, because each row is gene-scoped and spans every severity type reported for its gene while each MONDO class is gene-and-severity scoped, and skos:exactMatch on the three DPM rows, where MONDO has a single class for the whole disease caused by each gene. Added a notes block recording the 19 versus 19 gene-edge split, naming the MDDG classes MONDO has left without a gene edge, and recording two structural observations about MONDO: autosomal recessive limb-girdle muscular dystrophy type 2I (MONDO:0011787, FKRP) and congenital disorder of glycosylation type 1E (MONDO:0012123, DPM1) both carry gene edges to dystroglycanopathy genes but are not descendants of MONDO:0018276, while the other seven limb-girdle dystroglycanopathy classes are. The same notes block records the division of labour with Autosomal_Recessive_Limb-Girdle_Muscular_Dystrophy, which owns FKRP as LGMDR9, and with Lissencephaly_Spectrum_Disorders, which owns the cobblestone malformation as a lissencephaly subtype. Every MONDO CURIE and label was read from OLS4 in this session. No pathophysiology or evidence was changed. Gates: just validate 63 snippets 0 issues, validate-terms passed over all 21 new MONDO labels, list-gene-term-mismatches 0 findings.

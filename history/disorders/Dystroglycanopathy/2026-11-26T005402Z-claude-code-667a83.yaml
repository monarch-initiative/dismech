  summary: 'Gene-family review: DPM1, DPM2, DPM3; add DPM synthase node and type records'
  details: |
    DPM1, DPM2 and DPM3 sat on the shared O-mannosylation node, which carries the O-mannosylation pathway enzymes and no molecular function, although they act upstream as the dolichol-phosphate-mannose synthase that supplies the mannose donor. They now sit on a new node, Dolichol-Phosphate-Mannose Synthase Deficiency, linked to the O-mannosylation node, binding dolichyl-phosphate beta-D-mannosyltransferase activity (GO:0004582, catalytic DPM1), enzyme activator activity (GO:0008047, DPM2 raises activity about tenfold, PMID:10835346) and protein-membrane adaptor activity (GO:0043495, DPM3 tethers DPM1 to the ER membrane, PMID:16280320), all decreased, with dolichol phosphate mannose biosynthetic process (GO:0180047) decreased. Patient evidence: about 95% loss of Dol-P-Man synthase activity in DPM1-CDG fibroblasts (PMID:10642597) and strongly reduced activity with reduced alpha-dystroglycan O-mannosylation in DPM3-CDG (PMID:19576565). Records: DPM1 is now CAUSATIVE, germline, subtype-scoped, with the ClinGen Definitive tier for congenital disorder of glycosylation type 1E (the subtype's exactMatch MONDO:0012123); DPM2 is UNKNOWN (ClinGen Moderate, already recorded) with evidence PMID:23109149; DPM3 is UNKNOWN, germline, subtype-scoped, with the ClinGen Moderate tier for DPM3-CDG (MONDO:0013049). The DPM1 and DPM3 records previously had no evidence.

  details: |
    Weekly compliance sweep (focus: taxonomies/classification for metabolic disorders). Added a classifications block: harrisons_chapter NEUROLOGIC + GENETICS_ENVIRONMENT_DISEASE + ENDOCRINOLOGY_METABOLISM, and icimd_category 'o_linked_protein_glycosylation' (ICIMD group 'Disorders of O-linked protein glycosylation' under category 'Congenital disorders of glycosylation'; Ferreira et al. 2021, PMID:33340416). The notes record the two discriminations that matter: O-linked rather than N-linked, because the lesion is in O-mannosyl glycosylation of alpha-dystroglycan; and glycan synthesis rather than glycan degradation, contrasting with the 'Disorders of complex molecule degradation' category assigned to the oligosaccharidoses elsewhere in this same sweep. Provenance in notes rather than a fabricated evidence snippet, per the disease-classification skill. No other changes. Validated with 'just validate' - schema, term and reference validation all passed.

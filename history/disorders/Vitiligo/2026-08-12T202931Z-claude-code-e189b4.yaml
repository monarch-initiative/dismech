  summary: Link chemical exposure and stress, at very different grades
  details: |
    Backfill for issue #8085. Chemical exposure is the best-evidenced link in this tranche and the only one with a quantified effect, phenol and catechol derivatives carrying a three to fourfold increase in a case-control study. It is TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES into melanocyte destruction, and the intermediates are recorded as known because one cited sentence names the step, describing these chemicals as appearing to induce melanocyte autoimmunity, which is the route to the destruction the node holds. Stress is graded well below it and points at the oxidative stress node rather than at melanocyte destruction, because that is the step this entry models as making melanocytes vulnerable and it is the plausible entry point for a systemic stressor. That target choice is an inference and the link description says so: no cited sentence follows psychological stress to any molecular step, which is why the intermediates are unknown. Its cross-sectional item is graded PARTIAL with the reason stated, that a difference in perceived stress between affected and unaffected people cannot separate stress as cause from stress as consequence of a visible skin disease. The animal item is carried alongside the human ones and not alone; its snippet asserts a human claim while the study is a mouse model, and it is tagged MODEL_ORGANISM accordingly. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 122 of 123 with 1 pre-existing DOI-prefix skip.

  details: |
    Curated PMID:42374868 (He MJ et al., 2026) into kb/disorders/Vitiligo.yaml to close the kgap-scan gap (issue #5783) on CTSS-mediated IFN-gamma signaling and melanocyte immunogenic phenotype. Added three new pathophysiology nodes: 'CTSS Upregulation via IFN-gamma/STAT1 Signaling' (multi-omics TWAS/SMR/colocalization prioritizes CTSS as a 1q21 susceptibility gene; CTSS induced downstream of IFN-gamma/STAT1 in lesional melanocytes; positively associated with an oxidative-phosphorylation transcriptional signature, hedged as correlative per the source), 'CTSS-Driven Melanocyte MHC Class II Acquisition' (CTSS overexpression induces HLA-DRA; selective inhibitor RO5459072 attenuates the induction; downstream edge to the existing Melanocyte Destruction node is deliberately hedged as INDIRECT_UNKNOWN_INTERMEDIATES since the source frames this as partial immunogenic conversion and does not test a link to cytotoxic killing), and 'CTSS-Mediated Melanocyte Apoptosis and Proliferation Suppression' (functional overexpression increases apoptosis and suppresses proliferation; DIRECT downstream edge to Melanocyte Destruction as a melanocyte-intrinsic loss mechanism). Added a genetic entry for CTSS (hgnc:2545, looked up live via OLS/HGNC OAK build, not from memory) noting the 1q21 TWAS/SMR/colocalization susceptibility signal, and a biochemical entry for serum CTSS as an elevated, disease-activity-correlated biomarker (AUC 0.787). All evidence uses exact-quote snippets from the newly fetched references_cache/PMID_42374868.md. Validated: linkml-validate, linkml-term-validator (HGNC hit fresh-cached), just count-verified-snippets (133/134, 1 skipped by prefix -- pre-existing), check-causal-targets, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms, and the batched just validate-disorders -- all pass.

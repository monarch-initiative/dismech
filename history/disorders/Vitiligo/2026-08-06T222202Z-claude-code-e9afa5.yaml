  summary: Record ultraviolet phototherapy as a protective link
  details: |
    Backfill for issue #8085. This is the first PROTECTS_AGAINST edge in the knowledge base. The environmental entry named 'UV Exposure' carries evidence that is entirely about therapeutic phototherapy, which drives repigmentation by stimulating melanocyte precursors from the follicular reservoir, so it is linked as PROTECTS_AGAINST with INDIRECT_KNOWN_INTERMEDIATES to the 'Skin depigmentation' phenotype. PR review pointed out that the cited repigmentation evidence measures repopulation of lesional skin, which opposes the depigmented phenotype rather than the melanocyte-destruction process the link originally targeted; phototherapy's separate immunomodulatory action on the autoreactive attack would support the process node but is not evidenced in this entry. The curation observation about this entry's container was moved out of the edge description into the environmental entry's notes, where a curator will find it. Modelling it as TRIGGERS, the default assumption for an environmental entry, would have inverted the direction of a well-established treatment. Flagged for curation review that this entry arguably belongs under treatments rather than environmental. This link cites a different evidence item from the same entry than the one first selected. The substitution was made after an over-strict local audit appeared to fail the original; on closer inspection that snippet is correctly quoted and the apparent failure was curator-supplied terminal punctuation where the source sentence continues. Either item would have supported the link; the one used here is the more concise statement of repigmenting efficacy. Validated with linkml-validate and just validate-terms.

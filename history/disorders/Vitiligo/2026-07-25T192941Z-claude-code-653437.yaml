  summary: 'Review: Vitiligo - claim-evidence correctness fixes'
  details: |
    Claim-evidence audit of a 10-entry dermatology review set. Removed the zmiz1a/zmiz1b zebrafish animal_models entry: both supporting citations were marked NO_EVIDENCE and neither reference mentions zmiz1 or vitiligo. Removed PMID:31580326 from Associated Autoimmune Disorders (the paper is about the autoimmune spectrum of Turner syndrome, not vitiligo comorbidity). Removed PMID:32462299 (cancer-risk Mendelian randomization) from Depigmented Patches, where it supported neither the phenotype nor any current claim. Rewrote four Depigmented Patches explanations that argued about social stigma rather than the curated phenotype. Replaced the Inflammatory Cytokines snippet, which contained no cytokine content, with the chemokine sentence from the same paper. Replaced the IRF4 snippet, which never named IRF4, with the loci list that does, and raised it PARTIAL to SUPPORT. Removed two title-as-snippet evidence items (PMID:26728804, PMID:6600753). Normalized category Dermatologic to Dermatological. Rewrote review_notes, which had recorded that frequencies were set from clinical impression rather than evidence, into an explicit caveat. Validated: linkml-validate, linkml-term-validator, linkml-reference-validator all pass.

  details: |
    Backfilled reference_title on 13 previously untitled inlined evidence items across 9 unique PMIDs plus ORPHA:3435 (prevalence, inheritance, Uveitis, Dry Eye, Koebner, Sensorineural Hearing Loss, and Halo Nevi nodes). Ran validate-references first to re-sync references_cache and pull full text where available (18 sources now carry full text). Re-verified every inlined snippet as an exact whitespace-normalized substring of the refreshed cache and confirmed each supports its attached claim. Content fixes. Fixed evidence_source on PMID:37481827 from HUMAN_CLINICAL to MODEL_ORGANISM because that publication is a restraint-stress mouse model plus in vitro study, not a human study, and clarified its explanation. Added 4 new full-text-mined evidence items on existing nodes, each with a verified exact quote. Inheritance node gained the 23 percent monozygotic-twin concordance finding from PMID:28317533 supporting the multifactorial model. NALP1 genetic node gained the NLRP1 constitutive gain-of-function IL-1 beta mechanism from PMID:28317533. TYR genetic node gained the finding that tyrosinase is the major vitiligo autoimmune antigen with protective coding SNPs from PMID:28317533. Sensorineural Hearing Loss node gained the 5.4 percent immune-mediated inner ear disease prevalence figure from PMID:37062442. No new structural elements were added. Schema, term, and reference validation all pass.

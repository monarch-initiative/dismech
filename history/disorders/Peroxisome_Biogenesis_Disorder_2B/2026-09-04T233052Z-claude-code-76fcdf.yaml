  details: |
    Addressed the CHANGES_REQUESTED review on PR #11030.

    IMPORTANT 1 (peroxisomal biochemical markers missing): added two biochemical entries following the Peroxisome_Biogenesis_Disorder_1B pattern - very-long-chain fatty acids (biomarker_term CHEBI:27283) and C26:0-lysophosphatidylcholine - each with a readouts link into Attenuated Peroxisomal Metabolic Block (READOUT_OF / POSITIVE / DIAGNOSTIC), citing PMID:28677031 which was already cached. Also added an evidence item to the sequencing diagnosis entry backing the previously uncited prose claim that a raised VLCFA profile is what brings the patient to genetic testing. All PMID:28677031 items are graded directness INDIRECT because the cohort is Zellweger spectrum at large, not PEX5 patients - consistent with the entry's existing discipline.

    IMPORTANT 2 (osteopenia omitted): added Osteopenia (HP:0000938, directness INDIRECT) quoting the GeneReviews Clinical Characteristics sentence, wired from Progressive Degenerative Multisystem Disease, and added the GeneReviews management recommendation (vitamin D, consideration of bisphosphonates) to the supportive-care treatment.

    Suggestions accepted: postnatal growth failure added as a phenotype bound to HP:0008897 (Postnatal growth retardation) rather than HP:0001508 (Failure to thrive) which the sibling _1B uses for the same sentence - the divergence and its reason are recorded in the phenotype notes; nephrolithiasis added (HP:0000787) and wired as a sequela of Hyperoxaluria with causal_link_type INDIRECT_KNOWN_INTERMEDIATES; a separate Scheduled Multisystem Surveillance treatment entry with action_category MONITORING and free-text treatment_term, mining four GeneReviews Surveillance sentences (audiology/ophthalmology/hepatic, adrenal ACTH, urine oxalate ratio, dental); the 25 percent recurrence-risk figure now quoted in the inheritance evidence rather than asserted in prose; PMID:26220973 now cited twice on the RCDP5 differential.

    Declined: the datasets suggestion. Its premise is wrong - siblings _1B and _4B both carry 'datasets: []', an empty list, not a dataset record. Recorded in notes together with the dataset-relevance risk specific to this entity.

    Validation: just validate, validate-terms, count-verified-snippets (59/59, none skipped by prefix), check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, whole-KB check-title-snippets / check-snippet-length / check-snippet-grading, and validate-disorders all pass. No dangling pathograph targets and no orphan phenotypes: all 14 phenotypes are now wired.

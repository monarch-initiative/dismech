  summary: 'Create: Peroxisome Biogenesis Disorder 2B (MONDO:0008736, PEX5)'
  details: |
    New standalone Disease entry for PBD2B (OMIM 202370), the non-classic end of the PEX5-related Zellweger spectrum.

    entry_type decision: DISEASE, not SUBTYPE. The claim issue flagged this as a likely SUBTYPE of kb/disorders/Peroxisome_Biogenesis_Disorder.yaml. That was reasonable a priori and is superseded by what is actually on main: dismech already curates the per-complementation-group non-classic entries as standalone files - Peroxisome_Biogenesis_Disorder_1B (PEX1), 4B (PEX6) and 11B (PEX13) all exist, and 1B's own notes state the reasoning explicitly, that the A/B split within a PEX group is a mechanistic statement about residual peroxin function rather than a severity label, and that the causal gene differs. PBD2B is the direct PEX5 analogue. The general Peroxisome_Biogenesis_Disorder.yaml entry is the gene-agnostic spectrum entry and lists PEX5 in its genetic block; it has no has_subtypes block at all, so there was no subtype slot to fill.

    MONDO:0008736 is bound as the entry's disease_term, so the stub is deleted.

    What is PEX5-specific in this entry, as opposed to inherited from the spectrum. The mechanism is: PEX5's residual function in the non-classic alleles is cargo-selective rather than merely reduced. The S563W receptor still imports the canonical -SKL cargo and fails the weaker -AKL and -KANL signals (PMID:10462504). That has no counterpart in PBD1B/PBD4B, where the gradient is set by how much peroxin protein survives, and it generates a testable prediction of an uneven biochemical profile that nobody has measured. The PTS2 arm is modelled separately because PEX5L is the PEX7 co-receptor and the three characterised patients separate on which arms fail.

    What is borrowed, and marked as such. There is no PEX5-specific clinical series. Every phenotype is curated at the level of intermediate/milder Zellweger spectrum disorder from GeneReviews (PMID:20301621) and a 31-patient prolonged-survival cohort (PMID:15098231), and every one carries directness: INDIRECT. The import is licensed by the sources themselves - GeneReviews states the ZSD term now covers any ZSD-PEX gene defect regardless of phenotype - but the countervailing fact is recorded in notes and in a differential: 21 of the 31 cohort patients had PEX1 mutations, so the clinical expectations attached to this entry are in substance PEX1-derived. A knowledge gap discussion proposes assembling a PEX5-specific series.

    Evidence: 41/41 snippets verified. No DOI-prefixed citations, so nothing was skipped by prefix. Sources: PMID:7719337 (the 1995 paper assigning PEX5/PXR1 to complementation group 2), PMID:10462504 (the three-patient cargo-selectivity study that is the mechanistic core), PMID:9668159 (PEX5L/PTS2 isoform architecture), PMID:11405337 (temperature sensitivity in mild PBD phenotypes), PMID:20301621 (GeneReviews), PMID:15098231 (prolonged-survival cohort), PMID:40205409 (2025 Iranian series, for PEX5's rarity relative to PEX1), PMID:35917894 (peroxisome functions), and the ClinGen PEX5 definitive assertion.

    One gate finding fixed during curation: check-snippet-grading caught the PMID:7719337 complementation sentence graded HUMAN_CLINICAL on one node and IN_VITRO on another. It is a rescue experiment in cultured fibroblasts, so both are now IN_VITRO and the explanation says so.

    Deep research: falcon, disambiguated query naming PEX5, OMIM 202370 and complementation group 2. preflight-dr returned SKIP, not PASS - MONDO records no causal gene for MONDO:0008736 so the gene-identity check cannot discriminate. Manual fallback per the SKIP guidance: PEX5 mentioned 120 times against PEX1 21 and PEX2 9; the report's own scope paragraph states it concerns PEX5 complementation group 2 and not PEX1 or PEX2; report OMIM 202370 matches MONDO. Right entity. The report independently reached the same framing and its extra leads are recorded in notes as uncited leads, including why no animal_models block is curated (Pex5-null mouse and zebrafish models resemble severe Zellweger syndrome, not this entity).

    Validation: just validate, validate-terms, count-verified-snippets, validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms, check-stubs all pass; whole-KB check-title-snippets, check-snippet-length and check-snippet-grading pass. Pathograph orphan audit: no orphan downstream or target_mechanisms targets, no unwired phenotypes, no isolated nodes.

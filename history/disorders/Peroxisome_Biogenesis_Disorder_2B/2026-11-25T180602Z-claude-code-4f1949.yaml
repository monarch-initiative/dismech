  summary: 'Gene-family review: PEX5'
  details: |
    PEX5 landed on 'Hypomorphic PEX5 Variants with Residual PTS1 Receptor Function', which named no molecular function. The node now binds peroxisome signal sequence receptor activity (GO:0000268, DECREASED), the PTS1 receptor activity the residual-function alleles reduce, citing PMID:9668159 for PEX5 as the PTS1 receptor gene of complementation group 2. The genetic record was already typed CAUSATIVE with germline origin; ClinGen's PEX5 assertion is for the parent MONDO:0019234, so no tier was copied here. The PEX5 long-isoform entry (Rhizomelic_Chondrodysplasia_Punctata_Type_5) was reviewed and needed no change: its node already binds protein carrier activity for the PTS2 co-receptor role of PEX5L.

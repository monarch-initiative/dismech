  summary: 'Create: ALG11-congenital disorder of glycosylation'
  details: |
    New entry curated from primary literature. A Perplexity sonar-deep-research report was generated and cleared the NEC preflight against MONDO:0013349 with verdict PASS - ALG11 mentioned 130 times, no rival gene - but returned zero PMIDs in its body, so it served only as a lead-generation aid: all six references were located independently in PubMed and fetched with 'just fetch-reference'. The pathograph runs ALG11 mannosyltransferase deficiency -> LLO assembly arrest at Man3/Man4GlcNAc2-PP-dolichol -> protein hypoglycosylation -> multisystem glycoprotein dysfunction -> progressive loss of brain structures, declaring conformance to three congenital_disorder_of_glycosylation module nodes. Two judgements are recorded rather than smoothed over. First, the Type I transferrin isoform phenotype carries a REFUTE evidence item and deliberately no frequency band, because PMID:30676690 documents a genetically and biochemically confirmed patient with two rounds of normal carbohydrate-deficient transferrin. Second, the prenatal course is curated as an open KNOWLEDGE_GAP because PMID:22213132 reports an unremarkable prenatal period across four patients while PMID:30770273 documents arrest of fetal brain growth between 20 and 36 weeks. Validated with 'just validate' for schema and terms, 43/43 snippets verified against cached references, and the six offline CI gates. An initial draft used hgnc:20507 for ALG11, which is in fact H2AW; 'just validate-terms' caught the label mismatch and the identifier was corrected to hgnc:32456 against the HGNC REST API.

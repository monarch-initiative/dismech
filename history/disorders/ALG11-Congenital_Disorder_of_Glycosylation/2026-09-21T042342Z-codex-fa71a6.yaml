  summary: Review ALG11-CDG evidence, clinical variability and causal mechanisms
  details: |
    Comprehensive review of the existing entry, all six original PMID sources, the genuine deep-research report, and additional clinical literature. Regenerated the two available 2019 full texts and consumed their main bodies and restored phenotype tables. Read the complete 2015 two-patient report and the full historical GeneReviews overview, explicitly retired in June 2026 with last substantive update in 2017. Other reports remain abstract-only after full-text retrieval attempts; a 2024 publisher indexed methods/results excerpt clarified expression-versus-protein-stability interpretation. Added primary reports from 2022, 2024 and 2025 and scoped two mixed-CDG 2017 abstracts without assigning pooled outcomes to ALG11. Corrected case-count denominators and removed unsupported population prevalence and penetrance bands. Split allele-dependent protein abundance from mannosyltransferase activity; retained measured LLO and GP130 findings but removed unestablished glycoprotein-to-brain mechanisms. Distinguished prenatal growth arrest from later tissue loss in the same longitudinal child and recorded normal imaging and prolonged seizure freedom in another individual. Expanded observed tone, feeding, visual, seizure, callosal and dysmorphic findings; added individualized nutritional, developmental, sensory, reproductive and palliative care with explicit historical/general-CDG scope. Primary topiramate evidence documents partial response without disease modification. New tissue and symptomatic treatment links are evidence-qualified; other unproved causal routes are explicitly left as gaps. GeneReviews mined for clinical, diagnostic, care and counseling context and tagged. NEC preflight passed MONDO:0013349/ALG11; deep-research term mismatches were not propagated. Authoritative schema/live-ontology validation and 124/124 evidence snippets passed, together with all 25 repository QC gates and whole-KB node-class example integrity (101 classes, 2192 examples). No other disorder consumes the regenerated references.
    A peer read-only mechanism/model review found no material causal blocker; its refinement to avoid over-quantifying rescue from the index abstract was incorporated.

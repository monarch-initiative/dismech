  summary: 'Review round 1: consume PMID:30770273, add biochemical, prevalence and
    experimental models'
  details: |
    Addresses all three blocking findings and four of five suggestions from the ai4c-reviewer review on PR 9418. Finding 1: the Progressive Microcephaly description asserted in-utero growth arrest that its single evidence item did not support, so a second item from PMID:30770273 was added establishing microcephaly developing during the late second and third trimester. Finding 2: PMID:30770273 was in references and cited in prose but appeared in no evidence item despite being cached as full text; it now carries three structured evidence items across the microcephaly phenotype and the progressive brain-loss node. Finding 3: a biochemical section was added with GP130 glycosylation status and the serum transferrin isoform profile, the GP130 entry carrying the sentence in which the same patient shows GP130 hypoglycosylation and a normal transferrin profile, which is the pair that makes GP130 the more reliable readout. Suggestion 4: Temperature instability HP:0005968 added as a phenotype. Suggestion 6: the exome sequencing diagnosis entry moved from the generic NCIT:C19770 to NCIT:C101295 Whole Exome Sequencing. Suggestion 7: a prevalence record added as CASES_IN_LITERATURE with prevalence_class ULTRA_RARE and deliberately no rate_per_100000, since the only figure any cited source gives is a case count and converting it to a rate would invent a denominator. Suggestion 8: two experimental_models added, the patient fibroblast LLO analysis and the yeast alg11 deletion complementation assay, both linked by modeled_mechanisms with MEASURES relationships, fidelity, limitations, and in the fibroblast case a readout carrying its own evidence. Suggestion 5, a therapeutic_agent for the anti-seizure treatment, was not actioned and is answered on the PR: topiramate appears only in the deep-research artifact and is not quotable from any cached reference, and the reviewer flagged it as fine to leave. One correction made while checking: the reviewer's ready-to-paste snippet for PMID:30770273 contains non-breaking spaces between the gestational-age numerals and the word weeks, so it would not have verified as pasted; NBSP-free spans conveying the same fact were used instead. Revalidated: schema and terms pass, snippets rose from 43/43 to 55/55 verified, offline gates clean, zero dangling entity refs, and the one model readout target matches its link target.

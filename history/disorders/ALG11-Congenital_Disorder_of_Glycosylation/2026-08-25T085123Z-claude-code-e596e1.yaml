  summary: Fix non-canonical entity-ref prefix that broke main after merge
  details: |
    Post-merge correction. PR #9418 was reviewed and approved against a base that predated the entity-ref prefix normalisation (#9394), so it was green on its own branch and turned `main` red the moment it merged as fd52f1e09. `test_entity_ref_prefixes_are_schema_slot_names` fails on this entry:

      discussions[1].attaches_to[0]='phenotype#Sensorineural Hearing Impairment'
      uses the alias 'phenotype#'; write 'phenotypes#' (the schema slot name)

    Changed that one reference to the canonical plural slot name. Nothing else in the entry is touched; no content, evidence, or ontology binding changes.

    Note this is a spelling defect, not a broken link: SECTION_KEYS resolves both spellings, so `test_entity_ref_foreign_keys` was and remains green, and the discussion was always attached to the phenotype it names. The newer gate exists to keep the curated corpus in one spelling so a `phenotypes#` grep finds every reference.

    Same class of merge-time breakage that CLAUDE.md documents for duplicate YAML keys: green against its own base, red after merge, invisible to the author's pre-PR checks.

    Verification: entity-ref scan reports 0 aliases and 0 dangling refs in this file; `just validate` passes with 55/55 snippets verified against cached references; `just check-duplicate-keys` clean.

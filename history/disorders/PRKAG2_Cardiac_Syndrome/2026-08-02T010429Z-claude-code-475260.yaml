  summary: Subsume CMH6 (MONDO:0010946) into PRKAG2 Cardiac Syndrome as a narrowMatch
    mapping
  details: |
    Curation request targeted 'hypertrophic cardiomyopathy 6' (MONDO:0010946, CMH6, OMIM:600858, PRKAG2) as a new disorder entry. Duplicate preflight against origin/main found that PRKAG2 disease was already curated comprehensively in kb/disorders/PRKAG2_Cardiac_Syndrome.yaml (2644 lines; PR #7455, merged 2026-08-01T21:24Z, after the requesting checkout was taken). OAK verification (runoak -i sqlite:obo:mondo info MONDO:0010946 -O obo) shows MONDO:0010946 is_a MONDO:0800484 (the existing entry's disease_term) and carries only the disease-series-by-gene template definition ('Any hypertrophic cardiomyopathy in which the cause of the disease is a mutation in the PRKAG2 gene'), i.e. it asserts no mechanism, phenotype, or management beyond the gene already curated. Creating a parallel Hypertrophic_Cardiomyopathy_6 entry would have fragmented PRKAG2 disease across two files with duplicated evidence and no mechanistic distinction, so no new disorder file was created. Instead MONDO:0010946 was recorded on the existing entry as a skos:narrowMatch in a new mappings.mondo_mappings block (alongside a skos:exactMatch self-mapping to MONDO:0800484), its OMIM/DOID-side names were added to synonyms (Hypertrophic cardiomyopathy 6; CMH6; PRKAG2 hypertrophic cardiomyopathy; Cardiomyopathy, familial hypertrophic, 6) so CMH6 lookups resolve here, and a CMH6/MONDO:0010946-IS-SUBSUMED-HERE paragraph was added to notes recording the subsumption rationale. That paragraph also flags the naming trap CMH6 creates: the CMH numbered series places PRKAG2 disease alongside genuinely sarcomeric members (CMH1/MYH7, CMH3/TPM1, CMH4/MYBPC3, CMH7/TNNI3), which is exactly the sarcomeric-HCM conflation the entry's existing LUMP-VS-SPLIT paragraph rejects; series membership is an OMIM numbering artifact, not a claim that PRKAG2 disease is a sarcomeropathy. No new evidence items, phenotypes, pathophysiology nodes, or treatments were added, and no existing content was altered - every added assertion is ontology-derived and verifiable via OAK, so no deep-research run was performed and no new PMIDs were fetched. The glycogen-storage phenocopy mechanism, the WPW/pre-excitation phenotype, and the deliberate partial (late-node-only) conformance to cardiomyopathy_maladaptive_remodeling were already correctly curated in the existing entry and were left untouched. Validation: just validate PASS (124/124 snippets verified), just validate-references PASS (124/124), just validate-terms PASS. cache/mondo/terms.csv and cache/enums/diseaseterm_f618932bb23f.csv picked up canonical-order rows for MONDO:0010946.

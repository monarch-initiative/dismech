  summary: 'Create: PRKAG2 Cardiac Syndrome (MONDO:0800484)'
  details: |
    New entry for PRKAG2 cardiac syndrome, a non-lysosomal cardiac glycogenosis and a genocopy (not a form) of sarcomeric hypertrophic cardiomyopathy.

    NEC FINDING. The curation assignment named MONDO:0859372 ("cardiomyopathy, familial hypertrophic, 29, with polyglucosan bodies") as the target but described PRKAG2 biology throughout. The mandatory NEC preflight showed MONDO:0859372 carries the gene association HGNC:25947 = KLHL24 (OMIM:620236), NOT PRKAG2. The entry was therefore curated under MONDO:0800484 "PRKAG2-related cardiomyopathy", whose MONDO definition matches the assignment prose verbatim and which carries HGNC:9386 (PRKAG2). A gene-frequency check of the deep-research report corroborated this: PRKAG2 53 mentions, KLHL24 zero. MONDO:0859372 / KLHL24-related CMH29 remains uncurated and is available as a separate future entry.

    CURATED. A 14-node pathograph (verified single connected component, no orphan nodes, no dangling downstream targets) running from PRKAG2 CBS-domain missense variant, through dysregulated AMPK nucleotide sensing, to excessive cardiomyocyte glycogen and polyglucosan accumulation, then branching into three arms: (a) storage-driven cardiomyocyte vacuolation and left ventricular hypertrophy mimicking sarcomeric HCM; (b) glycogen-laden myocytes disrupting the annulus fibrosus, creating microscopic accessory atrioventricular connections and ventricular pre-excitation; (c) conduction-system glycogen infiltration causing progressive atrioventricular block and early pacemaker dependence. Also curated: 10 phenotypes with HPO terms, 4 histopathology findings, PRKAG2 genetic block with 4 recurrent alleles and 2 structured case_fractions, autosomal dominant inheritance, prevalence, 5 diagnosis entries, 5 treatments, and 4 discussions.

    AMPK DIRECTION DELIBERATELY UNRESOLVED. The gain- vs loss-of-function controversy is not adjudicated. It is modelled as three mechanistic_hypotheses (constitutive_ampk_activation, ampk_loss_of_function, glycogen_independent_myosin_interaction) whose ids are carried on the relevant downstream edge hypothesis_groups, plus a KNOWLEDGE_GAP discussion and two HUMAN_MODEL_MISMATCH discussions covering transgenic-overexpression fidelity and the glycogen-independent zebrafish arm.

    MODULE CONFORMANCE. Both cardiac modules were read and evaluated. cardiac_ion_channel_repolarization is explicitly NOT conformed to, because PRKAG2 pre-excitation is anatomical (a physical breach of the annulus fibrosus) rather than a channelopathy, and the bradyarrhythmia is degenerative infiltration rather than pacemaker-channel loss of function. cardiomyopathy_maladaptive_remodeling is conformed to only at the two late nodes (Progressive Contractile Dysfunction, Structural Cardiac Impairment and Heart Failure), because the early hypertrophy is storage mass and water rather than neurohormonally driven remodeling. Both conforms_to targets were verified to resolve against kb/modules/.

    HISTOPATHOLOGY. Curated in detail as the diagnostic discriminator from sarcomeric HCM: PAS-positive, DIASTASE-RESISTANT polyglucosan inclusions; vacuolated cardiomyocytes; and the diagnostically weighty ABSENCE of myofibre disarray with minimal interstitial fibrosis.

    CURATION DISCIPLINE. Diagnostic content is in the diagnosis: section, not treatments:. Prevalence is recorded as measure_type UNKNOWN / prevalence_class UNKNOWN rather than promoting a referral-cohort diagnostic yield into a population prevalence; the 7-of-24 and 0-of-20 yields live in genetic.case_fractions instead. Frequency bands are given only where a cohort percentage supports them, and omitted for WPW syndrome, sinus bradycardia, supraventricular tachycardia, and syncope.

    DEEP RESEARCH. research/PRKAG2_Cardiac_Syndrome-deep-research-claude_code.md (claude_code provider, 22 web searches, 19 citations, ~5 min). Used as leads only. Two DR assertions were checked and REJECTED: it gave PRKAG2 as HGNC:9385 (OAK confirms hgnc:9386), and it described the biopsy glycogen as "diastase-sensitive" (primary source PMID:11827995 reports diastase-RESISTANT, which is the entire diagnostic point). Its flat claim that all PRKAG2 variants are gain-of-function was also not adopted.

    VALIDATION. just validate PASS (101/101 snippets verified against cached references); just validate-terms PASS; just validate-references PASS (101/101).

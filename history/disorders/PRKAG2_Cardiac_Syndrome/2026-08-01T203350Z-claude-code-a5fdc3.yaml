  summary: 'Address PR #7455 review: lethal congenital subtype, extracardiac phenotypes,
    AF anticoagulation, referral prevalence'
  details: |
    Addressed the four IMPORTANT items from the ai4c-reviewer Content-Completeness Checklist on PR #7455.

    (1) Lethal congenital form. Added a has_subtypes entry 'Lethal Congenital' bound to MONDO:0009867 (lethal congenital glycogen storage disease of heart), with a mondo_mappings record citing mapping_source OMIM:261740. NEC preflight run with 'runoak -i sqlite:obo:mondo info MONDO:0009867 -O obo' confirmed xref OMIM:261740, is_a MONDO:0800484 (this entry's disease_term), and gene association RO:0004003 HGNC:9386 (PRKAG2) - a genuine child of the curated disease, unlike the previously rejected MONDO:0859372 (KLHL24/CMH29). Also added the p.Arg531Gln variant to genetic.variants with three evidence items from PMID:15877279 (new), covering the clinical recurrence, the >100-fold nucleotide-binding defect, and the authors' explicit cross-allele severity comparison. The same-codon contrast with the already-curated p.Arg531Gly (hypertrophy-free childhood onset) is stated in both places.

    (2) Extracardiac coverage. Added five non-Cardiovascular phenotypes from PMID:39082507 (new; 66-member Brazilian p.K290I kindred, 18-year follow-up): Intellectual disability (HP:0001249), Anxiety (HP:0000739), Aggressive behavior (HP:0000718), Speech disorder (HP:0002167), and an obstetric entry anchored on HP:0001787 Abnormal delivery. No frequency band is asserted on any of them because the source's denominators mix carriers, pregnancies, and deliveries. Skeletal-muscle glycogen storage and liver cirrhosis were deliberately NOT curated and are recorded as sourcing gaps in notes. A full HPO term-search record is written into notes: HP:0003811 Neonatal death and HP:0001522 Death in infancy both sit under HP:0040006 Mortality/Aging and are therefore not legal PhenotypeTerm values (HP:0003811 was tried and rejected by validate-terms); HP:0200067 Recurrent spontaneous abortion sits under HP:0032443 Past medical history and is also illegal, besides over-specifying the source.

    (3) Treatments. Added 'Anticoagulation for atrial fibrillation' (NCIT:C63341 Anticoagulation Therapy + NCIT:C263 Anticoagulant Agent) with three evidence items, and 'Septal myectomy' (NCIT:C51591 Myectomy) graded PARTIAL from the single PRKAG2 case report PMID:19787389 (new). No target_mechanisms link is declared for anticoagulation, with the reason stated in-line: none of the five permissible treatment_effect values honestly describes interrupting a thromboembolic consequence downstream of the arrhythmia node.

    (4) Prevalence. Added a second Prevalence record for the referral population (patients with left ventricular hypertrophy), POINT_PREVALENCE / ABOVE_1_IN_1000, rate_low 230.0, rate_high 1000.0, from PMID:39273120 (new) which states the 0.23-1% range verbatim with its denominator. The original UNKNOWN population-prevalence record is retained unchanged and the two are explicitly kept separate. Three alternative sources were audited and rejected, with reasons recorded in the record's notes: PMID:28771489 and PMID:30775854 pool PRKAG2 with other genes, and PMID:41998504's '0.7% of the cohort' is internally inconsistent with its own denominators.

    Suggestions: mined PMID:33244021 (new; South Asian cohort) into the LVH phenotype, the pacemaker treatment, and the Progressive Contractile Dysfunction node. The iPSC-CM suggestion was already satisfied by the pre-existing exp_prkag2_isogenic_ipsc_timecourse proposed experiment, and the burned-out DCM phase was already in the Progressive Contractile Dysfunction node description; the latter gained human evidence rather than new prose.

    Validation: just validate PASS (Snippets checked 124/124), just validate-terms PASS, just validate-references PASS 124/124, main's scripts/check_snippets_verbatim.py PASS 124 verified / 0 failed, check_folded_hyphens.py --check OK, validate-history-all PASS. references_cache churn from just validate was discarded with 'git checkout -- references_cache/' and only the five newly fetched PMID files were staged; cache/*.csv diff is +N -0 on every file (no re-sort churn), and both snippet checkers were re-run after the revert.

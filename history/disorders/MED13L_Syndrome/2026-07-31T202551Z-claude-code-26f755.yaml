  summary: Create standalone MED13L Syndrome entry
  details: |
    Created a standalone MED13L Syndrome (MRFACD / MED13L haploinsufficiency
    syndrome) disease entry, parallel in depth to the existing MED13_Syndrome.yaml,
    so the flagship Mediator kinase-module disorder has its own richly-curated page
    in addition to being a subtype of the Mediator_Complex_Neurodevelopmental_Disorder
    grouping. Grounded to MONDO:0014773 (OMIM 616789).

    Content: full pathophysiology graph (Mediator/CKM transcriptional dysregulation;
    cyclin C mislocalization -> mitochondrial dysfunction; neurodevelopmental
    transcriptional dysregulation with cortical-neurogenesis mechanism; cardiac
    developmental dysregulation from the original TGA gene-discovery link; craniofacial
    and sensory arm), 15 phenotypes, the MED13L haploinsufficiency genetic block
    (de novo LoF + recurrent missense p.Asp860Gly, mosaicism note), treatments, and
    two datasets (Med13l KO mouse scRNA-seq GSE277054; Simons Searchlight registry).

    Evidence discipline: all 33 evidence snippets verified as exact whitespace-normalized
    substrings of fetched PubMed abstracts (0 failures). New foundational PMIDs fetched
    for this entry: 14638541 (Muncke 2003, original TGA/PROSIT240 gene link), 23403903
    (Asadollahi 2013 delineation), 24781760 (van Haelst 2015), 25758992 (Adegbola 2015
    "Redefining"), 29959045 (Torring 2019). Reuses previously-validated snippets from
    40228085 (GeneReviews), 28645799, 40500968, 40775066, 35198885, 40989238.
    `just validate` (schema + term + reference) passes; disease name is unique.

    Note: MED13 remains the only other mediator gene with a standalone entry; the
    remaining mediatorpathies (MED12, CDK8, CDK19, MED12L, MED11, MED17, MED20, MED25,
    MED27, MED16) currently exist only as subtypes of the grouping entry.

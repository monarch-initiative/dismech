  summary: 'Create: MED13L Syndrome'
  details: |
    New standalone entry for MED13L syndrome (MONDO:0014773), previously represented in dismech only as a molecular subtype of the Mediator_Complex_Neurodevelopmental_Disorder grouping entry. Curated from an Anthropic-generated systematic-review pipeline output that had been held out from this repository during its own generation, so the two curations are independent. The pipeline's evidence snippets are verbatim spans of its own review text rather than of source abstracts, so every claim was re-derived here against PubMed abstracts fetched via linkml-reference-validator. NEC preflight run: MONDO:0014773 confirms causal gene HGNC:22962 MED13L, OMIM:616789, ORPHA:369891, distinguishing this entity from the MED13 paralog disorder MONDO:0032485. Validated with linkml-validate (Disease), linkml-term-validator (--labels, all HP/GO/CL/MAXO/MONDO/NCIT terms pass) and linkml-reference-validator (all snippets exact substrings of cached abstracts).

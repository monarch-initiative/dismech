  summary: >-
    Reviewed Sandhoff_Disease.yaml and added missing classifications,
    prevalence, progression, and diagnosis sections plus structured ClinGen
    gene-disease validity assertion on HEXB.
  details: >-
    Added Harrison's chapters (ENDOCRINOLOGY_METABOLISM, NEUROLOGIC,
    GENETICS_ENVIRONMENT_DISEASE), lysosomal_storage_category
    (sphingolipidosis), and icimd_category (sphingolipid_degradation);
    pan-ethnic rare prevalence entry noting Sandhoff disease represents ~7% of
    lysosomal storage disorder cases (PMID:28553389, PMID:37209042,
    PMID:40710901); subtype-stratified progression entries for Infantile
    Sandhoff disease (6-18 month onset and mortality before age 4 years;
    PMID:28553389, PMID:22025593, CGGV assertion), Juvenile Sandhoff disease
    (CGGV assertion), and Adult Sandhoff disease (PMID:31995250); structured
    ClinGen DEFINITIVE gene_disease_validity assertion on HEXB; and four
    diagnosis entries (Beta-hexosaminidase A and B enzyme activity assay
    NCIT:C64430, HEXB molecular genetic testing NCIT:C15709, Urinary
    oligosaccharide analysis NCIT:C17241, and Brain magnetic resonance imaging
    NCIT:C16809).

  summary: Reviewed Sandhoff_Disease.yaml, integrated the dedicated Sandhoff Disease GeneReviews chapter
    (PMID:35420740), added missing classifications, prevalence, progression, and diagnosis sections plus
    structured ClinGen gene-disease validity assertion on HEXB, and refined Brain MRI and adult progression
    evidence.
  details: Added Harrison's chapters (ENDOCRINOLOGY_METABOLISM, NEUROLOGIC, GENETICS_ENVIRONMENT_DISEASE),
    lysosomal_storage_category (sphingolipidosis), and icimd_category (sphingolipid_degradation); integrated
    the dedicated GeneReviews chapter on Sandhoff disease (PMID:35420740, tagged GeneReviews) across inheritance,
    has_subtypes, progression, phenotypes, diagnosis, differential_diagnoses, treatments, and references;
    added pan-ethnic rare prevalence entry noting Sandhoff disease represents ~7% of lysosomal storage
    disorder cases (PMID:28553389, PMID:40710901); added subtype-stratified progression entries for Infantile,
    Juvenile, and Adult Sandhoff disease (PMID:35420740, PMID:28553389, PMID:22025593, PMID:31995250,
    CGGV assertion); added structured ClinGen DEFINITIVE gene_disease_validity assertion on HEXB; and
    added four diagnosis entries (Beta-hexosaminidase A and B enzyme activity assay NCIT:C64430, HEXB
    molecular genetic testing NCIT:C15709, Urinary oligosaccharide analysis NCIT:C17241, and Brain magnetic
    resonance imaging NCIT:C16809 with infantile T2-weighted basal ganglia/ventral thalamic findings from
    PMID:28553389 and quantitative late-onset volumetric/DTI comparisons from PMID:40266357).

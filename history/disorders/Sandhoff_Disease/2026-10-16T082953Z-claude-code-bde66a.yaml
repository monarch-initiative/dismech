  summary: Add total hexosaminidase (not the A/B panel) binding (tranche D batch 2)
  details: |
    LOINC tranche D batch 2 (enzyme activity and metabolite assays). This is the sharpest call of the batch, by design (complement of Tay-Sachs, where LOINC:21328-0 the HexA-and-HexB interpretation panel was bound in batch 1). Added loinc_term: to the existing 'Total hexosaminidase A + B activity' biochemical[] marker, binding LOINC:LP14022-5 (Beta-N-acetylhexosaminidase -- the plain total component, with no A or B qualifier), NOT LOINC:21328-0. Reasoning recorded in notes:: Tay-Sachs' diagnostic claim is genuinely the A-versus-B comparison (HexA deficient, HexB normal/raised), which the interpretation panel reports; Sandhoff's own cited source (PMID:28553389, already cited three times in this entry) states a single combined quantity instead -- 'Serum levels of beta hexosaminidase total (A + B) were low' -- so the plain-total Part code matches the actual claim and the interpretation panel would not. Searched the Monarch KG for 'Beta-N-acetylhexosaminidase' and confirmed three distinct Part-level codes exist as siblings: LP14022-5 (plain total, bound here), LP14296-5 (.A specifically), LP14021-7 (.B specifically), plus LP35052-7 ('Beta-N-acetylhexosaminidase A & B', the likely underlying component of the interpretation panel, not bound here). No reference_ranges band: 'low' is qualitative. No third-party copyright notice required. No collision with this code on any other open loinc-* branch's cache. just validate-disorders, check-entity-refs, check-duplicate-keys, check-causal-targets, check-qualifier-terms, check-enum-values, and tests/test_loinc_measurement_schema.py all pass.

  details: |
    Genetics pass for issue #12193 (d2g wiring-004). All five checklist genes (SCN9A, PRDM12, NTRK1, NGF, SCN11A) were already bound, and all five MONDO terms were already bound as has_subtypes rows. Seven pathophysiology nodes already carried genes lists, so this entry was the best-wired of the nine on arrival. The checklist items are export-layer gaps: the entry's own disease_term is the broad MONDO:0015364 hereditary sensory and autonomic neuropathy class, and gene_to_edge exports against that alone.

    What changed. Each of the five has_subtypes rows gained its genes list. The five subtype-matched genetic records gained relationship_type CAUSATIVE, variant_origin GERMLINE, and a subtype foreign key.

    RETREG1 and the overlap with another entry. RETREG1 is a sixth gene record here with no corresponding has_subtypes row, and it should not acquire one: it is the HSAN2B gene, and dismech already curates it at the right granularity in Hereditary_Sensory_and_Autonomic_Neuropathy_Type_2, which carries an HSAN2B subtype row for it alongside WNK1 and KIF1A. That entry was NOT edited - it is being worked concurrently in another branch. The record here gained relationship_type CAUSATIVE, variant_origin GERMLINE, and a notes block recording the overlap, why no subtype is set, and that the record should move rather than be duplicated if this entry is ever re-anchored on a true congenital-insensitivity-to-pain class.

    GeneReviews baseline. Two chapters matching this entry's scope were uncited: the Congenital Insensitivity to Pain Overview, which matches the entry name exactly, and NTRK1 Congenital Insensitivity to Pain with Anhidrosis. Both were fetched, added to references with the GeneReviews tag, and recorded in notes. Neither is quoted as evidence: only abstracts are cached, and the overview's abstract is a statement of the chapter's purpose rather than a finding, so there is no propositional sentence available to quote. The notes say so rather than leaving the omission unexplained.

    Validation. just validate-pre-edit, count-verified-snippets 41/41, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, list-gene-term-mismatches all clean. Gene-to-mechanism wiring is 5/6 before and after; the unwired gene is RETREG1, which has no node here by the reasoning above.

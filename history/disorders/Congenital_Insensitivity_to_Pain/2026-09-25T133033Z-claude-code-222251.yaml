  summary: 'Genetics pass (d2g series-044): Congenital_Insensitivity_to_Pain'
  details: |
    Genetics pass for issue #12251 (d2g series-044). Re-anchored the entry from MONDO:0015364 hereditary sensory and autonomic neuropathy to MONDO:1060232 congenital insensitivity to pain, the exact term the entry's notes previously said did not exist; the search behind that correction (runoak -i ols:mondo search 'congenital insensitivity to pain') is recorded in the notes, and the old anchor is kept as a skos:broadMatch cross-reference alongside the new exactMatch. Added the ZFHX2 Marsili-type subtype (MONDO:0958106) with its genetic record and a new pathophysiology node for transcriptional deregulation in surviving nociceptors, feeding the shared loss-of-protective-pain-perception node. Removed the RETREG1 genetic record, following the instruction its own notes carried: RETREG1 is the HSAN2B gene and is already curated on Hereditary Sensory and Autonomic Neuropathy Type 2, and it was only present here because of the broad anchor. Recorded why five further descendants of the old anchor are not curated here (cold-induced sweating syndrome 1 and 2, PERCHING syndrome, HSAN1A, HSN1F) and which two descendants of the new anchor carry no causal gene in MONDO. Validated with linkml-reference-validator 0.3.0rc1.

  details: |
    Curation-scanner (high_effort tier) response to the ai4c-reviewer CHANGES_REQUESTED review on PR #7905.

    IMPORTANT #2 fixed: the "Diagnostic Skin Biopsy" entry was removed from treatments: (where it had been bound to NCIT:C49236 Therapeutic Procedure on the incorrect premise that dismech has no diagnostic-procedure slot) and re-curated in a new diagnosis: block using the Diagnosis class. Three diagnosis entries: Skin Biopsy (NCIT:C51692), Diffusion-Weighted Brain MRI (NCIT:C111116, the corticomedullary-junction DWI sign), and NOTCH2NLC GGC Repeat-Length Genetic Testing (NCIT:C15709). The DWI entry deliberately carries a PARTIAL evidence item bounding the sign's sensitivity (only about 37.5% of familial expansion carriers in PMID:31178126 showed it), so the entry does not overstate a negative MRI as excluding NIID.

    Review suggestion 6 addressed by mining the cached full text of PMID:31178126 more fully: added a Tremor phenotype (HP:0001337, 47.5%, frequency FREQUENT) and frequency bands for bladder dysfunction (56.4%), muscle weakness (46.2%), and sensory disturbance (35.1%). Frequency was deliberately NOT added to dementia, ataxia, or miosis, whose familial-cohort and sporadic-series figures straddle a FrequencyEnum band boundary.

    Genetic section gained the repeat-length distribution (66-517 in affected individuals vs 5-38 in 211 controls), the absence of any repeat-size/severity or repeat-size/onset association, and the unmethylated-expansion plus unchanged-NOTCH2NLC-expression findings. The last two were also added to the ALTERNATIVE repeat-RNA gain-of-function hypothesis as a PARTIAL item, framed explicitly as permissive (repeat-containing transcript is still produced) rather than demonstrative of RNA toxicity.

    Review suggestion 1 addressed by softening the inheritance evidence explanation so linkage mapping is no longer described as supporting dominance. Review suggestion 3 partly addressed with an ncit_mappings entry (NCIT:C122655, skos:exactMatch); OMIM and Orphanet cannot be encoded because DiseaseMappings only supports icd10cm/icd11f/mondo/ncit.

    Validation: just validate PASS (schema, term, reference) with 89/89 snippets verified against cached references, up from 70/70; just check-term-cache-integrity and just check-cache-order both OK; targeted pytest subset 5615 passed. No references_cache file was hand-written; the two new NCIT term-cache rows (C111116, C122655) were written by linkml-term-validator.

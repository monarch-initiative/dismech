  details: |
    Duplicate-entity collision resolution.

    PR #6120 (opened 2026-07-11, dragon-ai-agent) and PR #7905 (opened 2026-08-03,
    ai4c-agent) were both curating NIID for the SAME issue, #6112. #6120 was merged
    on 2026-08-07T23:18Z, about 17 hours after #7905's third review round, closing
    #6112 and landing a 590-line entry on main. That left #7905 with an add/add
    conflict on kb/disorders/Neuronal_Intranuclear_Inclusion_Disease.yaml.

    Resolved by superseding the merged entry with the #7905 version after verifying
    it is a strict content superset on every axis measured:

      metric                    main [6120]   this PR
      evidence items                     25        89
      distinct PMIDs                      4         7   (all 4 of main's included)
      pathophysiology nodes               3         8
      phenotypes                          8        14
      HP terms                            9        16   (main's 9 are a subset)
      GO terms                            2         4   (subset)
      CL terms                            1         6   (subset)
      top-level sections                 15        22

    Sections present only in this version: mappings, mechanistic_hypotheses
    (CANONICAL uN2CpolyG proteotoxicity vs ALTERNATIVE repeat-RNA gain of function),
    biochemical, histopathology, discussions (one INTERPRETATION, one KNOWLEDGE_GAP
    with proposed_experiments), datasets.

    Nothing unique was lost. The single term on main absent here is NCIT:C16809
    (Magnetic Resonance Imaging) on the DWI diagnosis entry; this entry binds the
    strictly more specific NCIT:C111116 (Diffusion Weighted Imaging). Main's
    NIID-related-disorders spectrum prose is covered, with more structure, by the
    gap_niid_notch2nlc_genotype_phenotype KNOWLEDGE_GAP discussion. Both entries
    carry reference_title on every evidence item (25/25 and 89/89).

    Carried forward from the merged entry: creation_date 2026-07-11T12:00:00Z, kept
    stable from first creation rather than reset to this branch's date, and the three
    synonyms it held uniquely (Intranuclear inclusion body disease, NIID-related
    disorders, NIIDRD).

    Branch refreshed by merging origin/main. GitHub's update-branch API returned 422
    merge conflict, and CLAUDE.md forbids a local rebase for PR conflicts. The three
    conflicting references_cache files differed only by trailing whitespace; main's
    normalized copies were taken. cache/mondo/terms.csv conflicted only on the
    retrieval timestamp for MONDO:0011327; main's row was kept.

    Validation on the merged tree: schema clean, term validation passed, 89/89
    snippets verified against cached references, check-term-cache-integrity OK.

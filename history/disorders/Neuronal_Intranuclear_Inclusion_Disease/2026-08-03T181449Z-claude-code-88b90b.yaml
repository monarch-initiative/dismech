  summary: 'Create: Neuronal Intranuclear Inclusion Disease (MONDO:0011327)'
  details: |
    New Disease entry for neuronal intranuclear inclusion disease (NIID), created by the curation-scanner (high_effort tier) in response to issue #6112 (lit-scan:new). Modeled the NOTCH2NLC 5' UTR non-coding GGC repeat expansion as the trigger, with two curated mechanistic_hypotheses: a CANONICAL uORF-translated polyglycine (uN2CpolyG) proteotoxicity model (Boivin 2021, PMID:33887199, including the mouse sufficiency experiment) and an ALTERNATIVE expanded-repeat RNA gain-of-function model (patient-specific antisense transcripts, Sone 2019 PMID:31332381), with downstream causal edges opting into the corresponding hypothesis_groups. Pathophysiology chain: repeat expansion -> uORF polyG translation / repeat-transcript accumulation -> eosinophilic ubiquitin and SUMO1-positive intranuclear inclusion formation (conforms_to loss_of_proteostasis#Misfolded-Protein Aggregation) -> progressive neuronal dysfunction and loss -> corticomedullary-junction leukoencephalopathy plus peripheral/autonomic nerve involvement -> multisystem neurological decline. Phenotypes, genetics, prevalence, progression, histopathology, and treatments were curated from Sone 2016 Brain (PMID:27797808, 57-case adult-onset series), Sone 2011 Neurology skin biopsy (PMID:21411744), Tian 2019 AJHG (PMID:31178126), Ishiura 2019 Nat Genet (PMID:31332380), and the triggering case report (PMID:42428984, used for clinical/diagnostic description only, never as sole support for a mechanistic claim). Deliberate non-assertions recorded in the entry notes: no conformance to polyglutamine_expansion_proteotoxicity (NIID is a polyglycine disease from a non-coding repeat, and that module is explicitly scoped to translated CAG/polyQ disorders), and no peripheral_axonal_degeneration conformance (the available evidence is frequent nerve-conduction abnormality, not a demonstrated distal axonal-degeneration/demyelination chain). Two discussions added: a KNOWLEDGE_GAP on NOTCH2NLC genotype-phenotype heterogeneity (NIID vs OPDM3 vs parkinsonism/AD) with two proposed experiments, and an INTERPRETATION on the RNA-versus-protein toxicity balance. Validation: schema validation PASS (via the pre-edit hook), just validate-terms PASS, just validate-references PASS with 70/70 snippets verified against cached references. Two candidate PMIDs were fetched, found to be the wrong papers (PMID:21832227 is SLC2A1/GLUT1; PMID:33831349 is astrocytic APOE4/tau), and discarded rather than cited; their cache files were not committed.

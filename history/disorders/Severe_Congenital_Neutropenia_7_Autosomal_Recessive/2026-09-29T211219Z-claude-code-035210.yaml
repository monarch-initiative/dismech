  summary: 'Create: Severe Congenital Neutropenia 7, Autosomal Recessive (CSF3R deficiency)'
  details: |
    Curated de novo the autosomal recessive SCN7 / G-CSF receptor deficiency entry (MONDO:0014865, gene CSF3R hgnc:2439) entirely from independently verified primary literature. Deep research took three runs to land on this disease. OpenScientist was run twice: the first report was about JAGN1 deficiency (SCN6, OMIM 616022) rather than CSF3R, and after clearing that query from the deep-research-client cache (issue #11748) the second OpenScientist run again asserted JAGN1 as the SCN7 gene, though it had at least picked up the right OMIM. preflight-dr against MONDO:0014865 caught both (run 1: CSF3R x2 vs JAGN1 x48, OMIM 616022; run 2: CSF3R x14 vs JAGN1 x48). Neither OpenScientist report is committed. `--fallback` could not switch provider because OpenScientist does not fail, it returns the wrong disease; Edison/falcon then refused the stored key with a 403, so the run that produced the committed report is claude_code. preflight-dr confirms that one is on this disease: CSF3R the top gene at 16 mentions, JAGN1 absent, report OMIM 617014 matching the MONDO xref, with only STAT3 flagged as a second gene, which is this disease's own signalling effector. Its own reference validation is 10/10 verified with 0 unresolved; its `needs_review: true` is set only because 2 of the quotes it composed did not match their sources, and none of its quoted material was reused here. The entry was cross-checked against it; its causal chain, its G-CSF-refractory/GM-CSF-responsive treatment branch and its preserved-marrow-maturation distinction all agree with what was already curated. Pathophysiology modelled as a causal chain: biallelic extracellular LOF CSF3R variants -> deficient cell-surface G-CSFR (N-glycosylation defect / ER retention or truncation) -> absent G-CSF JAK-STAT3/STAT5 signalling -> impaired granulocytic proliferation/survival with increased apoptosis -> profound peripheral neutropenia, plus a branch to preserved bone-marrow granulocytic maturation (the morphologic feature distinguishing SCN7 from ELANE/HAX1 maturation arrest). Key references verified against fetched cache: Triot 2014 (PMID:24753537, the defining biallelic-CSF3R report; full maturation, G-CSF non-response), Zhou 2021 (PMID:34778134, GM-CSF response, SCN7 label, case-series table), the 2026 Crohn/thalidomide review (PMID:42482462, extracellular vs cytoplasmic variant contrast, phenotype spectrum, 18 patients), Sippel/di-proline hinge (PMID:36316822), Csf3r-/- mouse (PMID:8934575), csf3r zebrafish (PMID:28281657), heterozygous-germline-risk paper (PMID:33108454, LOF-vs-activating contrast), Turkish registry (PMID:31321910, 6/216 case fraction), and IUIS 2022 (PMID:35748970) for classification. Distinction from somatic cytoplasmic-tail CSF3R (leukemic evolution of SCN1) and germline activating T617N hereditary neutrophilia stated explicitly in description and notes. Klimiankou 2015 (PMID:26324699) and Sprenkeler 2020 (PMID:32966608) were fetched but had no quotable PubMed abstract (content unavailable) so were not cited. No GeneReviews chapter exists (verified offline and --online over name+synonyms). All gates pass: validate, validate-terms, 45/45 snippets verified, entity-refs, causal-targets, duplicate-keys, qualifier-terms, coarse-phenotypes; 7/9 phenotypes causally connected (JIA and Crohn left unwired as immune-dysregulation features not directly downstream of neutropenia).

    Review round 1 (ai4c-reviewer, PR #13177). Replaced the off-target OpenScientist bundle as described above. Removed the contradiction between the proliferation node and its neighbour: the node bound GO:0002318 myeloid progenitor cell differentiation DECREASED while the adjacent node asserts maturation is preserved, so the differentiation binding was replaced with GO:0008283 cell population proliferation DECREASED, GO having no granulocyte-progenitor proliferation term. Rewrote the Csf3r-null mouse description, which had claimed no maturation arrest "mirroring the human SCN7 marrow" where PMID:8934575 reports terminal differentiation is impaired; the human/mouse difference is now a SPECIES_MISMATCH divergence on the model link. Gave the signalling-to-preserved-maturation edge its own evidence and wording that says maturation persists despite the lost signal rather than because of it. Renamed the signalling node from Absent to Reduced, since its own evidence says transduction is not completely abrogated, and softened the GO:0038158 modifier from LOSS_OF_FUNCTION to DECREASED to match. Added therapeutic_modality PROTEIN_REPLACEMENT to the two recombinant-cytokine treatments, moved both precursor cell bindings from GMP to CL:0000834 neutrophil progenitor cell, and regraded the PMID:24753537 cell-based summary sentence from HUMAN_CLINICAL to IN_VITRO. Added the dominant-negative heterozygous extracellular CSF3R variants that Triot's introduction describes, with the primary demonstrations (PMID:14528102, PMID:10449521), kept explicitly separate from this biallelic recessive disease. Added the original Klimiankou GM-CSF case through the review table that reproduces it, and listed PMID:26324699 under references; that letter has no retrievable abstract by PMID or DOI even with --force, so it carries no evidence item and the reason is recorded in notes. Also fixed the CI gate `check_gene_activity_grounding`, which flagged CSF3R as newly wired into the pathograph without a molecular function on its landing node: bound GO:0004902 granulocyte colony-stimulating factor receptor activity with modifier LOSS_OF_FUNCTION on the lesion node, matching that node's own functional_impact_category. Considered and rejected adding a Death in infancy phenotype that the on-target report surfaced: HP:0001522 sits in HPO's mortality branch, outside the PhenotypeTerm enum, and binding a substitute would have overstated; the reason is recorded in notes.

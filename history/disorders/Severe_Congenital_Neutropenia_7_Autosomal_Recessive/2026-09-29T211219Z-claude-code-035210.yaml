  summary: 'Create: Severe Congenital Neutropenia 7, Autosomal Recessive (CSF3R deficiency)'
  details: |
    Curated de novo the autosomal recessive SCN7 / G-CSF receptor deficiency entry (MONDO:0014865, gene CSF3R hgnc:2439) entirely from independently verified primary literature. An OpenScientist deep-research run was launched in parallel but its report came back OFF-TARGET: it is about JAGN1 deficiency (SCN6, OMIM 616022, gene JAGN1 HGNC:26926), not CSF3R deficiency (SCN7, OMIM 617014). preflight-dr against MONDO:0014865 confirmed this (CSF3R mentioned 2 times vs JAGN1 48 times; report OMIM 616022 vs MONDO xref 617014). None of the report's content or citations were used and the entry does not depend on it; the report, its citations sidecar and artifacts are committed for provenance only and flagged off-target here and in the PR. Pathophysiology modelled as a causal chain: biallelic extracellular LOF CSF3R variants -> deficient cell-surface G-CSFR (N-glycosylation defect / ER retention or truncation) -> absent G-CSF JAK-STAT3/STAT5 signalling -> impaired granulocytic proliferation/survival with increased apoptosis -> profound peripheral neutropenia, plus a branch to preserved bone-marrow granulocytic maturation (the morphologic feature distinguishing SCN7 from ELANE/HAX1 maturation arrest). Key references verified against fetched cache: Triot 2014 (PMID:24753537, the defining biallelic-CSF3R report; full maturation, G-CSF non-response), Zhou 2021 (PMID:34778134, GM-CSF response, SCN7 label, case-series table), the 2026 Crohn/thalidomide review (PMID:42482462, extracellular vs cytoplasmic variant contrast, phenotype spectrum, 18 patients), Sippel/di-proline hinge (PMID:36316822), Csf3r-/- mouse (PMID:8934575), csf3r zebrafish (PMID:28281657), heterozygous-germline-risk paper (PMID:33108454, LOF-vs-activating contrast), Turkish registry (PMID:31321910, 6/216 case fraction), and IUIS 2022 (PMID:35748970) for classification. Distinction from somatic cytoplasmic-tail CSF3R (leukemic evolution of SCN1) and germline activating T617N hereditary neutrophilia stated explicitly in description and notes. Klimiankou 2015 (PMID:26324699) and Sprenkeler 2020 (PMID:32966608) were fetched but had no quotable PubMed abstract (content unavailable) so were not cited. No GeneReviews chapter exists (verified offline and --online over name+synonyms). All gates pass: validate, validate-terms, 45/45 snippets verified, entity-refs, causal-targets, duplicate-keys, qualifier-terms, coarse-phenotypes; 7/9 phenotypes causally connected (JIA and Crohn left unwired as immune-dysregulation features not directly downstream of neutropenia).

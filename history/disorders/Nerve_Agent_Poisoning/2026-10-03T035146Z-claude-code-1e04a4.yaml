e pharmacodynamic difference (potency; oxime-refractory aging) with a cross-reference to Organophosphate_Poisoning. The lump/split scope decision (sibling Disease vs has_subtypes vs split+Grouping) is left to @cmungall as the reviewer routed it. Pyridostigmine prophylaxis not added (no quotable source fetched). New reference: PMID:16945386. 50/50 snippets verified; validate-disorders, validate-terms, entity-refs, causal-targets (14/14 phenotypes connected), duplicate-keys, enum-values, coarse-phenotypes, qualifier-terms pass.

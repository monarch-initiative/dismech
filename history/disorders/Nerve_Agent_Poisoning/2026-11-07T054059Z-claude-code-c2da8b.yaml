  details: |
    Closed the conformance asymmetry against kb/modules/acetylcholinesterase_inhibition.yaml: this entry conformed at five nodes while Organophosphate_Poisoning and Carbamate_Poisoning also conform at '#Cholinergic Crisis and Respiratory Failure'. Added an ORGANISM-scale pathophysiology node 'Cholinergic Crisis and Respiratory Failure' declaring that conformance, bound to GO:0007585 respiratory gaseous exchange by respiratory system with modifier DECREASED as the module node does. Rewired the convergence: the muscarinic, nicotinic and central arms now each carry a described downstream edge to the new node, which carries one edge to the pre-existing 'Respiratory failure' phenotype. The two previous bare arm-to-phenotype edges (causal_link_type DIRECT, no description or evidence) were replaced, so no curated content was lost; the Bronchospasm and Bronchorrhea phenotype sequelae to Respiratory failure were left in place as a second, genuine route. Followed Carbamate_Poisoning rather than Organophosphate_Poisoning as the naming pattern: the latter names its convergence node 'Respiratory failure', identical to its own phenotype, which just check-name-collisions reports as a pre-existing CROSS_SECTION collision in that file, so copying it would have collapsed two nodes into one here. No deep research was run; this is a structural change over existing curated content. Evidence for the new node is PMID:16945386 (The acute treatment of nerve agent exposure), quoting the contiguous passage that traces all three cholinergic arms and states that most deaths are due to respiratory failure, graded HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS because the chapter synthesises clinical toxicology it did not itself perform. Validated with just validate-disorders (passed), count-verified-snippets 52/52, check-entity-refs, check-causal-targets, check-name-collisions (no new collision), check-conformance-content (6 links, no edges_absent, the new link shares the module node's GO term)
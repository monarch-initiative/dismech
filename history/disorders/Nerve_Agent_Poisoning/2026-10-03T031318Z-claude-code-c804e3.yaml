  summary: 'Create: Nerve Agent Poisoning'
  details: |
    Created Nerve Agent Poisoning (MONDO:0100331) as an acquired organophosphorus chemical-warfare toxidrome, a MONDO sibling of organophosphate (pesticide) poisoning. Pathophysiology modeled as a causal chain: nerve agent exposure -> acetylcholinesterase inhibition -> (branch: aging of the AChE adduct, oxime-refractory) -> synaptic acetylcholine accumulation -> muscarinic / nicotinic / central cholinergic overstimulation -> convergent respiratory failure; receptor-overstimulation nodes wired to 9 HP-coded phenotypes (all causally connected). Treatments: atropine (CHEBI:16684), pralidoxime oxime (CHEBI:8354), diazepam benzodiazepine (CHEBI:49575), decontamination/supportive care. Environmental exposure bound to ECTO:9000284 and linked TRIGGERS to AChE inhibition. Differential vs organophosphate pesticide poisoning (MONDO:0800386). Deep research requested as falcon but fell back to claude_code (no EDISON_API_KEY); report used as a lead only. Evidence anchored on PubMed reviews/clinical series: PMID:30159887 (Epilepsia human review, full text), PMID:16168308 (Crit Care Clin review), PMID:21783510 and PMID:15979676 (Tokyo subway sarin), PMID:18555982 (in-vitro aging/oxime kinetics), PMID:32198755 (treatment/exposure review). All 34 snippets exact-quote verified; validate-disorders, validate-terms, entity-refs, causal-targets, duplicate-keys, enum-values, coarse-phenotypes, snippet-grading, environmental-evidence all pass. No GeneReviews chapter (acquired toxidrome). Bradycardia was considered but omitted for lack of a quotable source.

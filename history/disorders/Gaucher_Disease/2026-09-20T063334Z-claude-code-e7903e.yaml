  summary: 'Genetics pass: bind GBA1 to all five subtype rows, add relationship_type,
    evidence the Type 3 and cardiovascular genotypes'
  details: |
    Genetics pass for the d2g wiring-008 tranche (issue #12197).

    GBA1 was already bound on two pathophysiology nodes and on three genetic[]
    records scoped to Types 1-3, and all five MONDO-checklist subtypes already had
    their MONDO terms. Note that the GBA1 preferred_term against an hgnc:4177
    binding labelled GBA is correct, not a mismatch -- GBA1 is a synonym of the
    HGNC-approved symbol and CLAUDE.md records this exact case.

    Changes:
    - genes: GBA1 bound on all five has_subtypes rows (MONDO:0009265, 0009266,
      0009267, 0011945, 0009268). The perinatal-lethal and cardiovascular rows had
      no genetic[] record pointing at them at all, so each also gained evidence for
      the gene claim: PMID:42165577 for the perinatal-lethal form and PMID:8544197
      for the cardiovascular form. Both references were fetched for this pass.
    - relationship_type: CAUSATIVE and variant_origin: GERMLINE added to the three
      Type records, which previously carried only free-text association: Causative.
    - A new genetic[] record scoped to the Cardiovascular subtype, recording the
      homozygous D409H genotype with the sib-series evidence.
    - The Type 3 genetic[] record had no evidence block at all while asserting both
      the L444P and the D409H associations. Both are now cited (PMID:10464619 and
      PMID:8544197), including the D409H paper's own statement that the
      genotype-phenotype link needs further cases before it can be confirmed.
    - The fourth genetic[] record, GBA1 as a Parkinson disease risk factor, now
      carries relationship_type: RISK_FACTOR. A review_notes: was added recording
      that the risk is risk of Parkinson disease and not of Gaucher disease, and
      that the KGX exporter does not read relationship_type (dismech#12320), so the
      record currently exports as an undifferentiated causal-shaped edge.

    Declined: case_fractions for the N370S Ashkenazi figure, suggested on the
    issue. case_fractions records the share of cases a gene explains in a
    genetically heterogeneous disease; Gaucher disease has one gene, so the share
    is 100% by construction and an allele frequency is not the same quantity.
    The figure stays where it is, in the Type 1 record's notes.

    Prose self-review: removed an unsourced "first" from an explanation claiming
    priority for the D409H sib series, and tightened a variant description to the
    numbers the abstract actually gives (4% fibroblast / 11% liver activity,
    ophthalmoplegia in two of the three sisters).

    Validation: just validate, validate-terms, count-verified-snippets (193/193),
    check-genereviews (already TAGGED), check-duplicate-keys, check-entity-refs,
    check-causal-targets, check-qualifier-terms, check-enum-values,
    list-gene-term-mismatches (13 advisory GBA1/GBA rows, 0 wrong bindings),
    validate-disorders.

  details: |
    Landed the part of the earlier OpenScientist sweep (branch os-review-fable) still missing from main after the parallel Codex-assessment effort edited the same entry. Applied PMID:35764179 as a second evidence item on the Impaired Sphingolipid Catabolism -> Glucosylsphingosine Accumulation edge; it names lysosomal acid ceramidase as the deacylating enzyme recorded in that edge's intermediate_mechanisms and calls the product a toxic metabolite, which the sibling PMID:28218669 item ('a ceramidase') does not. Added the GBA1-Parkinson substrate knowledge gap (gap_gd_brain_substrate_in_gba1_parkinson) carrying two PMID:37080432 items: the absence of convincing substrate accumulation in GBA1-PD brains, and the competing misfolded-GCase ER-stress/UPR mechanism. Main previously carried this only as an 'ER stress predominance remains unresolved' clause in the canonical hypothesis notes. Two corrections against the old sweep's version: its would_refute pointed at GBA1-Associated Alpha-Synuclein Proteostasis, which main has since rewritten to cover mutant GCase handling as well as reduced activity, so an ER-stress result is compatible with that node rather than refuting it - would_refute is omitted and the reason recorded in experiment notes; and the rationale now records that the codex assessment on main REJECTED the strong reading that this absence proves gain-of-function predominance, so the gap is stated as an open question only. Skipped PMID:34161616 (ENGAGE 4.5-year final results): main already supports the same substrate-fall-with-clinical-improvement inference on the same mechanistic_hypotheses node via PMID:36739645, and cites the ENGAGE RCT itself (PMID:25688781) on Substrate Reduction Therapy. Copied the missing assessment sidecar openscientist-assessment-by-claude-opus-5.yaml across byte-identically (cmp verified) alongside the existing codex assessment, and updated the hypothesis notes pointer to name both assessments with their differing overall verdicts (SUPPORTED vs PARTIALLY_SUPPORTED). Verified no re-application needed for the sweep's other prose items: the complement amplification loop (macrophage storage -> Complement C5aR1 Activation -> Increased Glucosylceramide Synthesis -> back to storage) and the ambroxol chaperone treatment with an unbound free-text agent are both already on main, no ambroxol term is cached, and main asserts no single-biomarker diagnostic accuracy figure. Checks: linkml-validate clean, 187/187 snippets verified, duplicate-keys/entity-refs/causal-targets/enum-values all OK, validate-hypothesis-assessment clean.

  summary: Enrich Gaucher Disease with clinical care guideline evidence
  details: |
    Mined four clinical practice guidelines for issue #4878. Reinforced the glucosylsphingosine (lyso-Gb1) biomarker entry with the ACMG biomarker-testing technical standard (PMID:39499245) and the IWGGD patient-centered laboratory-diagnosis guideline (PMID:36544230, first-line biomarker testing). Added a new Orthopedic Management of Skeletal Disease treatment (NCIT:C16186) for Gaucher osteonecrosis/avascular necrosis, citing the ACR Appropriateness Criteria Osteonecrosis 2022 update (PMID:36436966, Gaucher as osteonecrosis risk factor; early surgical prevention of articular collapse) and the GED-C consensus (PMID:30414226, bone-related manifestations as a major type-1 sign). Excluded no in-scope guideline. Did not duplicate existing ERT/SRT/gene-therapy treatments. Schema and term validation pass; all snippets verified as exact abstract substrings.

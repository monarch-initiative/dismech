  summary: 'Integrate assessed OpenScientist findings: complement amplification loop,
    gammopathy risk, ambroxol, two knowledge gaps'
  details: |
    Assessed the OpenScientist hypothesis-search report for canonical_gba1_glucocerebroside_lysosomal_storage_model (sidecar: kb/hypotheses/Gaucher_Disease/canonical_gba1_glucocerebroside_lysosomal_storage_model/assessments/openscientist-assessment-by-claude-opus-5.yaml, verdict SUPPORTED, 14 claims) and integrated its RETAINED and QUALIFIED claims. Every PMID checked in the report resolved to a real paper saying what the report said it said; snippets were re-derived from references_cache rather than copied from the report. ADDED: (1) PMID:34161616 (ENGAGE 4.5-year final results) on the mechanistic_hypotheses entry, since clinical improvement arriving concurrently with the fall in both substrates is the pharmacological observation tying the canonical chain's endpoints to its metabolic step; the entry previously cited only the 9-month primary analysis. (2) A new pathophysiology node, Complement C5a-C5aR1 Amplification Loop, with an incoming edge from Glucocerebroside Accumulation in Macrophages and outgoing edges back to that node (C5aR1 control of glucosylceramide synthase) and to Macrophage Inflammatory Mediator Release; evidence PMID:28225753 (Nature 2017), graded MODEL_ORGANISM. This mechanism was wholly absent and converts stored substrate from inert deposit to active amplifier. (3) PMID:35764179 naming acid ceramidase on the Impaired Sphingolipid Catabolism to Glucosylsphingosine Accumulation edge. (4) PMID:37249220 human dose-response evidence (1.2 percent osteonecrosis risk per ng/ml glucosylsphingosine) on the glucosylsphingosine-to-skeletal edge, which previously rested only on a GBA2-deletion mouse result. (5) PMID:24076352 in vitro conditioned-media evidence substantiating both the osteoclast-stimulation and osteoblast-inhibition intermediates already asserted on the inflammatory-mediator-to-skeletal edge. (6) PMID:21700325 as the primary source for the GCase and alpha-synuclein bidirectional loop, previously asserted on review citation only. (7) A Monoclonal Gammopathy phenotype (HP:0031047 Paraproteinemia, OCCASIONAL, Type 1) with an INDIRECT_UNKNOWN_INTERMEDIATES edge from Macrophage Inflammatory Mediator Release; the entry carried no malignancy or gammopathy content despite an 11 percent registry frequency and gammopathy being a GED-C major presenting sign already cited elsewhere in the file. (8) An Ambroxol Pharmacological Chaperone Therapy treatment with target_mechanisms on Glucocerebrosidase Deficiency and Neuronal Glycosphingolipid Accumulation, marked investigational and off-label, with the uncontrolled nature of both supporting studies stated in notes. (9) Two KNOWLEDGE_GAP discussions with proposed experiments: absence of brain substrate accumulation in GBA1-Parkinson disease, and the missing mechanism connecting substrate accumulation to early gammopathy and plasma-cell malignancy. NOT ADDED, deliberately: no hypothesis status change (the report itself recommends retaining CANONICAL); no separate glucosylsphingosine-cytotoxicity or gain-of-function hypothesis entry, since the glucosylsphingosine node and edges already exist and the gain-of-function branch is better represented as the knowledge gap that was added; no Mincle-ligand node (PMID:28373578 is in vitro with no Gaucher-patient tissue); no ALPS-like immune dysregulation content (PMID:32702516 is 7 of 10 patients, too thin to model); no ambroxol therapeutic_agent CURIE, because ambroxol is in neither the CHEBI nor the NCIT term cache and this sweep forbids introducing uncached terms. The report's own limitation that the complement work used chemical-inhibitor rather than genetic models is wrong and was not carried over: that study's central experiment is a germline GCase and C5aR1 double-deficient rescue. Its claim that glucosylsphingosine alone predicts osteonecrosis at ROC AUC 0.894 was not carried over either; the AUC belongs to a combined biomarker set. Verified: 129 of 129 snippets against cached references, plus check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values and check-folded-hyphens.

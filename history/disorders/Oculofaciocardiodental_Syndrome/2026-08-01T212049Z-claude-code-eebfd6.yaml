  summary: 'Create: Oculofaciocardiodental Syndrome (MCOPS2, BCOR)'
  details: |
    De novo curation of Oculofaciocardiodental (OFCD) syndrome / microphthalmia, syndromic 2 (MCOPS2, MONDO:0010261, OMIM:300166, BCOR).

    Deep research: falcon was attempted first per the skill default but the Edison API returned 402 Payment Required, so claude_code and openscientist were used instead. Both passed the NEC preflight (BCOR dominant in each report, OMIM:300166 matching the MONDO xref, no competing gene), and openscientist independently cited four of the same core PMIDs.

    Curated 10 pathophysiology nodes spanning the BCOR-null -> ncPRC1.1 corepressor deficiency -> X-inactivation mosaicism trunk, with lineage-specific arms for neural-crest craniofacial, Isl1 cardiac, ocular, and dental phenotypes, plus hemizygous male lethality. Two competing molecular accounts of radiculomegaly (BCL6/ZFPM2, PMID:35957990; chromatin/AP-2alpha, PMID:19578371) are recorded as parallel EMERGING mechanistic_hypotheses with hypothesis_groups on the corresponding causal edges, rather than collapsed into one claim. A separate BCL6-BCOR/Notch-Pitx2 left-right patterning arm (PMID:20230751, PMID:24440151) covers the cardiac/laterality features. A HUMAN_MODEL_MISMATCH discussion records that conditional Bcor mice cannot express radiculomegaly at all, because mice are monophyodont, so the syndrome's pathognomonic feature rests on single-patient in vitro work.

    Anti-hallucination: deep-research ontology suggestions were independently verified with OAK and several were rejected as wrong - HP:0010786 is Urinary tract neoplasm (not congenital cataract), HP:0006486 is Abnormal dental root morphology (radiculomegaly is HP:0033189), CL:0000058 is chondroblast (not odontoblast), CL:0000452 is obsolete, and NCIT:C15311 is Quality Control (not Dental Care). A recalled PMID for the Ng 2004 gene-discovery paper was also wrong and was corrected to PMID:15004558 by PubMed search. No GeneReviews chapter exists for OFCD or BCOR-related disorders (PubMed searched 2026-08-01).

    Validation: just validate passes (schema + terms), 60/60 evidence snippets verified against cached references, validate-graphs clean, compliance 95.4% global / 96.0% weighted.

  summary: Type TRPV2 as protective and cite its source
  details: |
    The TRPV2 genetic record said 'Protective Factor' in association text with no relationship_type and no evidence. Found and cached its source, Park et al. 2016 (PMID:27079220), a Korean case-control study (409 patients, 423 controls) in which the GTA haplotype of TRPV2 showed a defence against fibromyalgia susceptibility (P = 0.035) while no individual allele or genotype was associated. Added relationship_type: PROTECTIVE, an evidence item quoting the haplotype result, and a note stating how thin the support is (one study, uncorrected P, haplotype-only). The neighbouring TRPV3 record was not changed. The same paper ties TRPV3 to symptom severity rather than susceptibility, so its 'Risk Factor' association text may be better typed as MODIFIER; left for a separate change. Identified by the prose-only census in docs/reports/protective-modifier-sources-2026-11-05.md.

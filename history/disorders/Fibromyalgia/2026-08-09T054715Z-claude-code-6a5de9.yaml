  summary: Add sex-specific pathophysiology knowledge-gap discussion
  details: |
    Added the KNOWLEDGE_GAP discussion gap_fm_sex_specific_pathophysiology, attached to the HPA Axis Dysregulation, Neuroinflammation, and Central Sensitization pathophysiology nodes, sourced from the Kaur et al. 2026 systematic review (PMID:42455336).

    The review reports FM prevalence of 2.4-6.8% in women vs 0.2-2.4% in men, but concludes the true sex-specific prevalence is uncertain: men were examined in only 2/54 (3.7%) of included studies, direct sex comparisons appeared in 15/54 (27.7%), and no study investigated pathophysiological sex differences at all. KNOWLEDGE_GAP is the correct discriminator rather than HUMAN_MODEL_MISMATCH because the evidence is absent, not model-derived-but-untranslated.

    Two evidence items cite PMID:42455336 with snippets verified as exact substrings of the cached abstract.

    Review follow-up (PR #7144, ai4c-reviewer CHANGES_REQUESTED):
    - Added this history record, which was the sole blocking item.
    - Reworded the rationale so the three candidate mechanistic domains (sex-hormone neuroendocrine signaling, Th17/Treg balance, pain-processing circuitry) are explicitly attributed to this entry's own framing rather than reading as findings of Kaur et al., who propose no candidate mechanisms. This addressed the reviewer's precision concern.
    - Added proposed_experiments exp_fm_sex_balanced_mechanistic_cohort, a sex-balanced mechanistic phenotyping cohort whose decision_criterion discriminates a true biological sex difference from ascertainment bias, making the gap actionable.
    - Deliberately did NOT add a prevalence block from this source, despite the reviewer's optional suggestion. The 2.4-6.8% / 0.2-2.4% figures are an average across 59 heterogeneous studies that the review itself frames as unreliable, and the entry has no existing prevalence block to slot them into. Choosing measure_type and prevalence_class for such an aggregate is a curation judgement better made by a human than guessed here.

    The branch was also merged with origin/main to pick up the MAXO to NCIT treatment-term remap, without which the entry no longer validated.

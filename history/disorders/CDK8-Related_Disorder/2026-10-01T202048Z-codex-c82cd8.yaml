  summary: Review CDK8 clinical spectrum, inheritance and assay-specific mechanisms
  details: |
    Reviewed the complete entry and shared Mediator research report, the full primary 2019 and 2020 articles, and the entire 2019 clinical and methods supplement fetched as a publisher PDF. The 2024 inherited case and 2007 mouse report were available as abstracts after full-text attempts; inaccessible/captcha caches were excluded. Corrected ten confirmed de novo cases rather than twelve, removed unsupported population prevalence, retained original cohort denominators where a later table recounts them inconsistently, and added affected mother-child transmission with variable progressive contractures. Expanded case-level phenotypes, documented interventions and positive, absent or negative treatment outcomes. Separated catalytic loss, structural predictions and unproven dominant-negative occupancy; distinguished cell assays, overexpression, dual-kinase inhibition and complete mouse loss. Recorded G2P Definitive validity with correct attribution. No established clinical subtypes, GeneReviews chapter or relevant congenital-disease trial was identified; cancer inhibitor trials and paralog-specific mitochondrial interventions were not transferred. Other candidate variants and isolated CSF findings remain qualified. All 168 quotations and 174 titles verify, as do 592 quotations across the four consumers of the refreshed shared cache; schema and ontology validation pass. Reviewed breadth and biological detail across all applicable sections; remaining patient-cell and allele-severity questions are explicit discussions.

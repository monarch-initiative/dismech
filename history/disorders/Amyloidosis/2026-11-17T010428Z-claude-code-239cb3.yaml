  summary: 'Review round 1: move PMID:42409418 from a TRAPS differential to the AA
    subtype evidence'
  details: |
    Review of PR 18247 found that PMID:42409418 presents an autoinflammatory disease as a possible underlying cause of AA amyloidosis, not as a condition that mimics it, so a differential_diagnoses row was the wrong home. Removed the TNF receptor 1-associated periodic fever syndrome differential row and its TRAPS-specific description. Added two PMID:42409418 evidence items to the AA has_subtypes entry: the BACKGROUND sentence that AA amyloidosis may be the first manifestation of an underlying autoinflammatory disease, and the conclusion that autoinflammatory disease should be considered in adults with unexplained AA amyloidosis. The explanation states that the single patient carried only TNFRSF1A p.Arg121Gln (legacy R92Q), a low-penetrance variant, so no TRAPS-specific or TNFRSF1A gene-disease claim is made and no genetic row was added. The TRAPS-definition snippet was dropped because it supports no amyloidosis claim. Moved the references entry to the end of the list. Corrected the round-0 history record's links to name the issue and PR.

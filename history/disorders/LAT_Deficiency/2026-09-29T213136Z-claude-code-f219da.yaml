  summary: 'Create: LAT_Deficiency'
  details: |
    Created the LAT deficiency entry (MONDO:0044721, IMD52, LAT hgnc:18874, autosomal recessive) from the primary literature plus a committed OpenScientist deep-research report.

    Deep research: research/LAT_Deficiency-deep-research-openscientist.md, with its citations sidecar and the two provider artifacts (final_report.html/pdf). Its own frontmatter reports 13/13 references resolved, 0 unresolved, 11/13 on topic, and term validation with 35/38 terms resolved but 10 mislabelled and needs_review true. 'just preflight-dr research/LAT_Deficiency-deep-research-openscientist.md MONDO:0044721' returns PASS with LAT mentioned 71 times and the MONDO OMIM (617514) matching. None of the report's suggested CURIEs was copied: every ontology identifier in the entry was looked up through ols: or the committed term caches at the point of writing. Two of the report's bindings were wrong in ways that would have propagated - HP:0004810 offered for autoimmune haemolytic anaemia is Congenital hypoplastic anaemia, and HP:0002720 offered for hypogammaglobulinaemia is Decreased circulating IgA concentration - and the report also gives HGNC:6533 for LAT, where the gene is hgnc:18874.

    Sources. Three human reports exist: Keller 2016 (PMID:27242165, full text, three siblings, the only report with detailed clinical and immunological data), Bacchelli 2017 (PMID:27522155, abstract only, the SCID pedigree) and Alizadeh 2023 (PMID:37516813, one patient in a SCID exome series). Mechanism and model content comes from PMID:9489702, PMID:26354432, PMID:17534068, PMID:16102570, PMID:10204488, PMID:12065840, PMID:12065839, PMID:16887989, PMID:18209052, PMID:19682930, PMID:20542732 and PMID:26034173; the IUIS 2024 classification row is PMID:41608114, already in the committed cache.

    Content. Sixteen pathophysiology nodes run as a single chain from the biallelic truncating allele through loss of the cytoplasmic phosphotyrosines, failure of signalosome assembly, and abolished ERK activation, then branch into the developmental arrest, the loss of LAT-dependent restraint that produces lymphoproliferation and autoimmunity, and the progressive immune collapse. Twenty-eight phenotypes, all causally connected (just list-disconnected-phenotypes reports 28/28). Both mouse models carry modeled_mechanisms with limitations and typed SPECIES_MISMATCH divergences. Five discussions record the mouse/human developmental mismatch, the unexplained residual calcium and NF-kappaB signalling, the SCID versus CID presentation question, the untested IL-6 hypothesis, and the uncharacterised non-T lineages.

    Judgement calls. The SCID and CID presentations are curated as one entry, following the single IUIS row, with the difference recorded as an OPEN_QUESTION rather than a has_subtypes split. frequency is unset throughout because the denominator is three kindreds. A recurrent-gastroenteritis phenotype was dropped: HPO has no term for a single episode and the source does not say it recurred. TREC newborn screening, the general SCID supportive-care package and general SCID survival figures were surfaced by the report and left out because no source ties them to this disease; the reasons are recorded in notes.

    Validation: just validate, just validate-terms, just check-entity-refs, just check-causal-targets, just check-duplicate-keys, just check-qualifier-terms, just check-enum-values, just check-coarse-phenotypes, just check-snippet-length, just check-title-snippets, just check-snippet-grading, just check-folded-hyphens, just check-environmental-evidence and just check-term-cache-integrity all pass. just count-verified-snippets reports 96/96 verified. just validate-disorders passes with 96 snippets and 113 titles checked and no issues. just check-genereviews reports NO_CHAPTER offline and with --online, so the note that no GeneReviews chapter exists is verified.

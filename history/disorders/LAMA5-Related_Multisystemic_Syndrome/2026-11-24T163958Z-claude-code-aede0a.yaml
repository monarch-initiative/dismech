  summary: 'Create: LAMA5-Related Multisystemic Syndrome'
  details: |
    New entry for MONDO:0033856, scoped to the MONDO/Orphanet (ORPHA:521450) definition: the autosomal dominant syndrome of the single three-generation family heterozygous for LAMA5 c.9418G>A (p.V3140M) reported in PMID:28735299, and its knock-in mouse. The founding paper is available as an abstract only, so phenotypes not named in the abstract come from the Orphanet definition. ClinGen's Glomerulopathy GCEP files an autosomal recessive LAMA5 Definitive classification under the same MONDO identifier, built on nine papers about biallelic LAMA5 disease; it describes a different concept and was not recorded as this entry's gene_disease_validity. The gene relationship is graded DISPUTED: one unreplicated family, and PMID:33242826 states that the variant was also present in unaffected relatives. Edges from the extracellular-matrix node to connective-tissue phenotypes are the authors' framing; retinal, muscle, intestinal and thyroid phenotypes are left unconnected because no mechanism has been reported. One Perplexity deep-research report was used as leads only; its claim that the variant was absent from unaffected relatives conflicts with PMID:33242826 and was not used. Validated with just validate, count-verified-snippets (33/33) and validate-terms.

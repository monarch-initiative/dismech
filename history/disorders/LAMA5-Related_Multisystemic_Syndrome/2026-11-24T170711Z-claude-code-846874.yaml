  details: |
    Addressed review of PR 18874. Rewrote the Hedgehog-GLI1 to dermal papilla edge description: the two findings are reported together, and because Hedgehog normally promotes follicle downgrowth, increased signaling would predict more downgrowth rather than arrest, so the step is unexplained; the edge was kept rather than dropped. Changed quote_role from REVIEW_SYNTHESIS to BACKGROUND on the PMID:33242826 and PMID:35584218 items (primary papers restating another group's report) and narrowed the PMID:35584218 explanation to the absence of shown basement-membrane pathology. Added a sentence that GO:0030198 is a coarse stand-in for reduced COL1A1/MMP1/MMP3 expression.

  summary: 'Review round 2: add common phenotypes, MRC grade progression, causal wiring'
  details: 'Addressed the 2026-10-21 review (round 2) of PR 14910.


    Phenotypes added, each with a cited frequency: nuchal rigidity (HP:0031179) and vomiting
    (HP:0002013) from a 52-patient Karachi cohort (PMID:23757980) and, for vomiting, a prospective
    Chandigarh cohort (PMID:34100953); cranial nerve paralysis (HP:0006824) from a 47-study
    meta-analysis (PMID:41799630, pooled 26.5%) with the abducens nerve as the most affected
    nerve (PMID:21570650); seizure (HP:0001250, 34%, PMID:30396007); hemiparesis (HP:0001269,
    35.7%, PMID:15206503); hyponatremia (HP:0002902, pooled 52%, PMID:34752323).


    Progression: added modified MRC grades I-III as phases, with grade definitions from PMID:29029055
    and grade-dependent in-hospital mortality from PMID:30611205.


    Pathograph: basal exudate now links to cranial nerve paralysis (PMID:32118118, exudates
    encase cranial nerves) and, without separate edge evidence, to nuchal rigidity, headache
    and fever. Ischemic cerebral infarction links to hemiparesis (PMID:36048445), seizure
    (PMID:30396007) and cognitive impairment (PMID:32118118). Obstructive hydrocephalus links
    to coma (PMID:35102984) and cognitive impairment (PMID:32118118). Edges that rest on an
    association or on a broader outcome (focal weakness, neurodisability, deteriorating consciousness)
    are marked directness INDIRECT.


    PMID:31082059 (StatPearls) was fetched but is abstract-only and carries no phenotype content,
    so it is not cited.


    Not done: no deep-research report is committed. No deep-research provider was available
    in the shepherd runner, and the OpenScientist report the entry notes describe is not in
    the repository. The optional suggestions (transmission evidence, HIV co-infection modifier,
    drug-resistant TBM and tuberculoma, LTA4H genetic row, NCT03100786) were not taken in
    this round.


    Validated with just validate (48/48 snippets, 0 issues).'

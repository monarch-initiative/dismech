  details: |
    Addressed the 2026-10-19 review of PR 14910.

    Dexamethasone: the LTA4H sentence from PMID:41540106 is the trial's stated hypothesis, now marked quote_role BACKGROUND. The trial's result (no outcome difference between TT and CC/CT genotypes; no benefit or heterogeneity in any prespecified subgroup) is recorded as a GENOTYPE effect_modifiers entry with NO_DIFFERENCE and CROSS_STRATUM_COMPARISON, because TT participants were not randomized. Treatment and zebrafish-model descriptions no longer state genotype-dependent benefit.

    Pathophysiology: split 'Tuberculous Arteritis and Infarction' into 'Tuberculous Cerebral Arteritis' (middle cerebral artery, PMID:7610242) and 'Ischemic Cerebral Infarction' (basal ganglia, PMID:28281443). Split 'MMP-9 Blood-Brain Barrier Breakdown' into 'CSF MMP-9 Elevation' (human, PMID:19789647) and 'Blood-Brain Barrier Disruption' (mouse, PMID:39536643, MODEL_ORGANISM). The Rich-focus rupture evidence is marked directness INDIRECT, since the abstract places the focus upstream of the exudate without naming rupture.

    Pathograph: wired Obstructive Tuberculous Hydrocephalus -> Hydrocephalus and Basal Granulomatous Meningeal Exudate -> CSF pleocytosis with cited edge evidence. Antituberculous therapy now targets the basal exudate instead of the rupture event. Added a Coma phenotype (HP:0001259) from PMID:28281443. The mouse SHH model links to Blood-Brain Barrier Disruption (PARTIALLY_RECAPITULATES, LOW fidelity, with limitations). BCG vaccination carries therapeutic_modality VACCINE and therapeutic_agent NCIT:C298 BCG Vaccine in place of the qualifier pair.

    Not done: no deep-research report is committed; MRC grade progression, transmission evidence, cranial-nerve palsy, seizures, hemiparesis, hyponatremia and HIV co-infection were not added because no cached source supports them. A hemiparesis edge from infarction was considered and dropped because no cached source names hemiparesis.

    Validated with just validate (30/30 snippets), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys and model-scale-audit.

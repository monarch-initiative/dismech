  summary: 'Create: Mayer-Rokitansky-Kuster-Hauser syndrome (MONDO:0017771)'
  details: |
    New DISEASE entry for MRKH syndrome, curated from the obstetrics/gynaecology coverage-gap punch list in issue #7837, where MRKH had been listed as still absent since 2026-08-02. The stub (stubs/Mayer-Rokitansky-Kuster-Hauser_Syndrome.yaml, entry_type UNDECIDED) is deleted by this change.

    Lump/split call: single DISEASE entry with MONDO's own two children (MONDO:0010173 type 1, MONDO:0010989 type 2) as has_subtypes. Reasons recorded in the entry notes: the MONDO term is itself written as a spectrum; the two types share one mechanism, one anatomy and one treatment pathway; and the type 1 / type 2 boundary moves with how hard anyone looked for extragenital anomalies (renal imaging reclassifies type 1 as type 2, one cohort imaged no urinary tract in a third of patients, systematic ear assessment roughly doubles the reported ear-anomaly rate). MURCS is deliberately folded into type 2 rather than given its own record.

    Pathograph: 10 nodes, all biological_scale-tagged, from a MOLECULAR transcription-factor-dosage trigger through CELLULAR duct epithelial failure to TISSUE aplasia, with two ORGANISM outcomes. The organising mechanistic claim is that the Müllerian ducts and the ovary have different embryonic origins: a 'Spared Gonadal Ridge Lineage with Normal Ovarian Steroidogenesis' node is curated as a mediator rather than dropped as an incidental normal finding, because ovarian sparing is what makes the presentation isolated primary amenorrhea AND what drives the cyclic-endometrium arm (catamenial pain, endometriosis). Extragenital anomalies branch off the same trigger node via shared intermediate mesoderm (renal) and paraxial mesoderm (axial skeletal) rather than being listed as unexplained associations.

    Four mechanistic hypotheses: md_developmental_arrest (CANONICAL), mesodermal_transcriptional_program (EMERGING - bounded explicitly at ~10% of patients for recurrent CNVs), nonmendelian_somatic_or_environmental (ALTERNATIVE, with a REFUTE item attached for the inconsistent epigenetic findings), amh_overexpression (DEPRECATED, retained with its negative evidence because it is the one etiological question the field has closed and it is what separates this syndrome from the 46,XY differentials).

    Genes: GREB1L / PAX8 / HNF1B curated CAUSATIVE; LHX1 DISPUTED (clean Lhx1-null mouse, negative human cohorts); TBX6 SUSCEPTIBILITY (real cohort enrichment, no established mechanism for monoallelic variants, and the scoliosis compound-inheritance model does not transfer - recorded as a HUMAN_MODEL_MISMATCH discussion); WNT9B and RBM8A UNKNOWN. WNT4-related Müllerian aplasia with hyperandrogenism is kept out of the genetic section and curated as a differential diagnosis, per the literature's separate-entity treatment.

    Three discussions: KNOWLEDGE_GAP for the unexplained etiology in most patients (with a discordant-monozygotic-twin somatic/methylation experiment and its own interpretive caveat), HUMAN_MODEL_MISMATCH for TBX6, OPEN_QUESTION for the seven meta-analysis patients who had endometriosis with no functional endometrium and no uterine remnant.

    Ontology gaps recorded rather than papered over: no HPO term for catamenial pain / cryptomenorrhoea (bound to HP:0002027 with temporality RECURRENT), no HPO term for haematometra (prose only), no NCIT clinical-action term for vaginoplasty (bound to the generic NCIT:C15329). No ICD-10-CM or ORPHA mapping block, because neither prefix could be validated offline from the committed caches in this session. No biochemical section, because the point about lab values here is that they are normal.

    Also updated kb/groupings/46_XX_Disorder_of_Sex_Development.yaml. That grouping's mappings justification and notes both asserted that the structural/Mullerian arm had no dismech Disease entry and that MRKH was an open stub - prose that this change falsifies. MRKH is added as its fifth member with differentiating_mechanisms, and both passages are rewritten. The grouping's second NECESSARY criterion allowed only a gonadal or a steroidogenic route, so the new member failed it; a third 'structural route' operand (GO:0061205 paramesonephric duct development) was added, which the grouping's own notes already anticipated in saying a third arm 'would strengthen, not weaken, the split rationale'. All five members now report SATISFIED.

    Validation: just validate passes schema + terms with 92/92 snippets verified. Grouping: validate-grouping passes 6/6 snippets, check-groupings structure OK. Offline gates clean: check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading. Nine references, all newly cached via just fetch-reference. Snippets were taken preferentially from full-text XML and structured abstracts; four PMIDs recalled from memory during reference gathering resolved to unrelated papers and were discarded rather than cited, and their cache files removed.

  details: |
    Curated osteochondrosis (MONDO:0018381) for issue #8963 as a CURATE_ROOT_WITH_SUBTYPES Disease entry with has_subtypes by site: Legg-Calve-Perthes disease (MONDO:0007885, femoral head), Osgood-Schlatter disease (MONDO:0004241, tibial tuberosity), Sever disease (no MONDO term, calcaneal apophysis), Kohler disease (MONDO:0016086, navicular; linked to the existing kb/disorders/Osteochondritis_of_Tarsal_Metatarsal_Bone.yaml entry rather than duplicated), Freiberg infraction (MONDO:0023188, second metatarsal head), Scheuermann kyphosis (MONDO:0008410, vertebral ring apophyses), and osteochondritis dissecans (MONDO:0017178; a deliberate divergence from MONDO's own parent placement under osteonecrosis-of-genetic-origin, recorded in the subtype review_notes). Modeled the classical Siffert three-family nosology as three independent top-level pathophysiology chains (articular ischemic cartilage-canal chondronecrosis; apophyseal traction; physeal compressive vertebral endplate) tagged via subtypes rather than one lumped ischemic cascade, per research surfaced in the issue curation-scanner comment. Ran deep research via just research-disorder falcon Osteochondrosis; the Falcon/Edison report corroborated the family-split design (recommending named juvenile osteochondroses be kept as separate or linked records rather than merged) and surfaced a verifiable ACAN/OMIM 165800 familial-OCD genetic subtype, independently verified on PubMed as PMID:35338222 and added. Ran just preflight-dr against the Falcon report and MONDO:0018381: verdict SKIP, since MONDO records no causal gene for this grouping term, as expected, so fell back to the manual OMIM/synonym/gene checks per CLAUDE.md; confirmed each has_subtypes member cited evidence PMID titles match its specific eponym with no cross-contamination, given this is a high-NEC-risk eponym-dense disease class covering Perthes, Osgood-Schlatter, Kohler, Freiberg, Scheuermann, and Sever. Added genetic entries for COL2A1 Perthes Mendelian phenocopy, F5 and F2 thrombophilia risk factors for Perthes, and ACAN for familial OCD, plus an environmental secondhand-smoke entry for Perthes with influences_mechanisms, two discussions HUMAN_MODEL_MISMATCH on animal-to-human ischemia translation and KNOWLEDGE_GAP on undetermined Perthes etiology, diagnosis and treatment sections. Validation: just validate schema plus terms plus references 45 of 45 snippets verified, just validate-disorders batched pre-PR sweep 45 of 45 snippets verified no full text, just validate-terms passed, just check-duplicate-keys whole KB OK, just check-title-snippets whole KB OK no new title-quoting snippets.

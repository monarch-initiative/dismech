  summary: Conform ischemic bone necrosis nodes to ischemic_bone_necrosis_and_repair
  details: |
    Added conforms_to links to the ischemic_bone_necrosis_and_repair module on the three
    nodes of the articular-osteochondrosis chain only: Cartilage-Canal Ischemic
    Chondronecrosis -> Epiphyseal Cartilage-Canal Ischemic Chondronecrosis; Delayed
    Endochondral Ossification and Necrotic Fragmentation -> Growth Plate Injury and
    Delayed Endochondral Ossification; Revascularization and Remodeling under Mechanical
    Load -> Resorption-Dominant Revascularization and Creeping Substitution. These nodes
    carry the Legg-Calve-Perthes, Kohler, Freiberg and juvenile osteochondritis dissecans
    subtypes. Left unconformed on purpose: every node of the apophyseal (Osgood-Schlatter,
    Sever) and physeal (Scheuermann) chains, which are traction and compression lesions of
    growth cartilage with no ischemic trigger; the module notes forbid them from conforming.
    Legg-Calve-Perthes stays a has_subtypes row rather than being promoted to its own
    entry, which is the open human decision on issue #10063. No node content was changed.

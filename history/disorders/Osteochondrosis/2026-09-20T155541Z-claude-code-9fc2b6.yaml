  details: |
    Genetics pass for the d2g wiring-015 job (issue #12204, epic #12189). Genetics researched from the entry's own cited literature plus a GeneReviews baseline check (just check-genereviews), with MONDO/Monarch consulted only afterwards for reconciliation. ClinGen bulk refresh was unavailable (just clingen-refresh fails on a drifted pin, issue #10426), so no new ClinGen assertion was fetched. Every HGNC CURIE written here was read from cache/hgnc/terms.csv in the same step it was written; just list-gene-term-mismatches reports 0 findings over the changed files.

    This umbrella entry had four gene records and none of them reached a pathophysiology node (0/4). The two thrombophilia risk alleles were wired to the node their cited mechanism concerns: F5 and F2 now sit on Cartilage-Canal Ischemic Chondronecrosis, each with a descriptor note saying they are risk alleles rather than Mendelian causes. The two Mendelian genes could not honestly be attached to the ischemic chain, because neither acts through cartilage-canal vascular failure, so two new pathophysiology nodes were added instead: Heritable Type II Collagen Defect in Familial Perthes Disease (COL2A1) and Aggrecan G3-Domain Defect in Familial Osteochondritis Dissecans (ACAN). Each carries its own cited evidence from the reference the corresponding genetic record already used, and a downstream edge marked INDIRECT_UNKNOWN_INTERMEDIATES to the phenotype it converges on (Fragmented and Flattened Epiphysis, Osteochondritis Dissecans Lesion) because the intermediate steps are not established. Also bound COL2A1 to the Legg-Calve-Perthes Disease subtype row and ACAN to the Osteochondritis Dissecans row, in both cases with a descriptor note that the binding covers the rare familial form only. Wiring is now 4/4.

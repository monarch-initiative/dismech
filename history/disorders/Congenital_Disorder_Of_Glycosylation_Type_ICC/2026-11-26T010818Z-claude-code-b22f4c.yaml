  summary: 'Gene-family review: MAGT1; bind its oxidoreductase activity, type record,
    record ClinGen tier'
  details: |
    The MAGT1 lesion node named the gene only in its genetic_context and stated that MAGT1 has no catalytic molecular function. MAGT1 is an ER-lumenal thioredoxin homologue and STT3B-complex subunit whose CVVC active site is required for STT3B-dependent glycosylation of acceptor sites bracketed by disulfides or containing cysteine (PMID:25135935). The node now carries MAGT1 in genes and binds disulfide oxidoreductase activity (GO:0015036) and the complex's glycotransferase activity it contributes to (GO:0004579), both decreased, with the description corrected. The genetic record was untyped; it is now CAUSATIVE with the ClinGen Definitive tier for XMEN disease (MONDO:0010455, the Immunodeficiency subtype's term) recorded, subtype-scoped. A note records that ClinGen separately rates MAGT1 Disputed for X-linked intellectual disability (MONDO:0100284), a different disease, which bears on the Neurodevelopmental presentation.

  summary: 'Create: Congenital Disorder of Glycosylation, Type ICC (MAGT1-CDG / XMEN)'
  details: |
    Created the dismech entry for congenital disorder of glycosylation type ICC (MONDO:0026729), X-linked MAGT1 deficiency.

    LUMP/SPLIT DECISION: curated as ONE disease with two has_subtypes presentations (immunodeficiency/XMEN, and intellectual-and-developmental-disability) rather than as separate CDG-ICC and XMEN entries. This follows the literature: PMID:31036665 concludes 'we delineate MAGT1-CDG as a disorder associated with two different clinical phenotypes caused by defects in glycosylation', and PMID:35182234 describes one CDG with two distinct clinical phenotypes. Splitting would create two entries for one gene, one mechanism and one final common pathway differing only in ascertainment route.

    SUPERSEDED MECHANISM: the magnesium-transporter model is curated as a DEPRECATED mechanistic_hypotheses entry rather than deleted, because it named the disease and drove its clinical trial. Its refutation carries supports: REFUTE evidence at both in vitro (PMID:35182234) and clinical (PMID:34655400) levels. The current CANONICAL model is STT3B/OST hypoglycosylation, with the NKG2D deficit shown to be caused by hypoglycosylation of the receptor at a defined site.

    NEGATIVE RESULT CURATED DELIBERATELY: a treatment entry titled 'Magnesium Supplementation (tested and ineffective)' records the randomized double-blind placebo-controlled crossover trial NCT02496676, which found no change in EBV or NKG2D status and was stopped. Included rather than omitted because the magnesium rationale is embedded in the disorder's own name, so silence would leave the historical framing as the only signal a reader finds.

    DEEP RESEARCH: a Perplexity deep-research pass was run (research/Congenital_Disorder_Of_Glycosylation_Type_ICC-deep-research-perplexity.md, sonar-deep-research). Its own reference validation resolved 6/6 citations, confabulation rate 0.0, 6/6 on topic; just preflight-dr against MONDO:0026729 returned PASS with canonical gene MAGT1 dominant (286 mentions) and report OMIM IDs including the MONDO xref 301031. The report was used as a lead and cross-check only: every evidence snippet is quoted from a directly fetched primary reference and no PMID, snippet or ontology term was taken from the report unverified. It independently corroborated the lump decision and the HP:0003642 type-I transferrin assignment, and supplied the additional hypoglycosylated substrates (CD28, HLA-DR beta, TCR alpha) that are recorded in prose without an evidence block since the cited abstracts support the restricted-subset claim only generically.

    Corrections made during curation: an initial evidence item quoting the title of PMID:21796205 was replaced with the paper's own abstract statement of its finding once the cached record was checked and found to contain a full abstract; GO:0008250 was rejected by term validation as not a MolecularFunctionTerm (it is a cellular component) and the annotation was changed to the decreased protein N-linked glycosylation process, which is also more accurate since MAGT1 is a non-catalytic subunit.

    Validation: linkml-validate clean; term validation passed; reference snippet audit 29/29 verified; duplicate-key, folded-hyphen, snippet-length, title-snippet and environmental-evidence gates clean.

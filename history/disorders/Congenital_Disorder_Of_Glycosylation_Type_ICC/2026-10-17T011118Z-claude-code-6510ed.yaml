  summary: Bind the XMEN subtype to MONDO:0010455 and retire its stale stub
  details: |
    The Immunodeficiency subtype (the presentation historically named XMEN) had no subtype_term. MONDO:0010455 'X-linked immunodeficiency with magnesium defect, Epstein-Barr virus infection and neoplasia' cross-references OMIM:300853 and Orphanet:317476, which are the XMEN records, while the entry's disease_term MONDO:0026729 cross-references OMIM:301031 (CDG1CC). Binding MONDO:0010455 on the subtype records the OMIM 300853 presentation as covered, so the stub stubs/X-linked_Immunodeficiency_With_Magnesium_Defect_Epstein-Barr_Virus_Infection_And_Neoplasia.yaml, which was seeded because no kb/ entry carried that MONDO ID, is deleted rather than curated as a separate disease. Addresses the has_subtypes disease_term item of #9295 for the XMEN arm; the Neurodevelopmental arm is left unbound in this change. Validated with just validate (schema, terms, 48 snippets).

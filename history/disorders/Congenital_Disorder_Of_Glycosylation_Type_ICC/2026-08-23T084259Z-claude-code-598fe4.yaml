  details: |
    Response to the third ai4c-reviewer review on PR #9289. One blocking finding: six further rows of the cached Ravell Table 1 cohort frequency table remained uncurated, all above the >10% content-completeness threshold and two at 95%.

    All six rows were verified verbatim in references_cache/PMID_31714901.md before curating, and all suggested HPO terms were verified against OAK rather than taken on trust.

    Added: increased total B cell count (HP:0005404, 95%, VERY_FREQUENT); increased double-negative T cell number (HP:0002851, 95%, VERY_FREQUENT); transient creatine kinase elevation (HP:0003236, 52%, temporality TRANSIENT); severe autoimmune cytopenias (HP:0001973, 35%, severity SEVERE); recurrent oral ulceration (HP:0000155, 35%, temporality RECURRENT). The skin warts / condylomata row was folded into the existing Persistent Cutaneous Viral Infections phenotype as a second evidence item rather than becoming a separate entry, as the reviewer suggested.

    One improvement on the reviewer's suggestion: they reported being unable to find an HPO term for elevated alpha-beta double-negative T cells and proposed leaving it unbound. HP:0002851 does exist; its canonical label is 'Increased double-negative T cell number' (the label I first drafted from their wording, 'Elevated double-negative T cell proportion', was rejected by term validation and corrected against OAK). So that phenotype is bound rather than unbound.

    One deliberate narrowing recorded in notes: the severe autoimmune cytopenias phenotype is bound to HP:0001973 Autoimmune thrombocytopenia because HPO has no general autoimmune-cytopenia class spanning all lineages. The binding is narrower than the source's wording, and that is stated in the entry rather than left implicit.

    Non-blocking suggestions also taken: the Decreased CD4+ T Cell Proportion phenotype claimed 43% (9/21) but quoted the adjacent immunoglobulin row, which does not contain that figure - swapped to the row that names it, per 'phenotype support is not frequency support'. The one downstream edge lacking hypothesis_groups (Failure of Epstein-Barr Virus Control -> Multisystem Glycoprotein Dysfunction) is now tagged with glycosylation_defect_model, consistent with the other four.

    Not taken, with reasons already recorded in the PR: clinical_trials.phase remains NOT_APPLICABLE because the cached registry record carries no phase field and guessing one is worse than leaving it; has_subtypes disease_term, variant-level genetics and prevalence remain absent because their sources are OMIM/ClinVar/PanelApp rather than any cached primary reference, which the reviewer independently confirmed is evidence-constrained rather than under-consumption.

    Validation: linkml-validate clean; term validation passed; reference validation (--no-full-text) 46/46 snippets verified; all five ungated CI gates clean; cache diff carries only the two CURIEs newly introduced.

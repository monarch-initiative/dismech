  details: |
    Response to the ai4c-reviewer REQUEST_CHANGES review on PR #9289. No CRITICAL findings; six IMPORTANT items, all correct.

    Finding 1 (corrected). The notes field said 'No deep research provider was used; all content comes from directly fetched primary literature' while the same field's first paragraph described the Perplexity pass and the PR ships the artifact. This was a self-contradiction introduced when the deep-research paragraph was added and the original sentence left in place. Rewritten to say what is actually true: every evidence snippet is quoted from a directly fetched primary reference, and the Perplexity report was a cross-check rather than a source.

    Finding 2 (addressed). The two mechanistic_hypotheses groups were declared but no causal edge opted into them, so the CANONICAL/DEPRECATED distinction was prose only and invisible to graph consumers. The four downstream edges implementing the glycosylation chain now carry hypothesis_groups: [glycosylation_defect_model].

    Finding 6 (addressed). The phenotype named 'Cytopenias' was bound to HP:0001873 Thrombocytopenia, asserting a platelet-lineage restriction the evidence did not make. Replaced with the lineages the cohort table actually reports, each with its own frequency: thrombocytopenia 70%, transient neutropenia 61%, decreased CD4+ T cell proportion 43%.

    Finding 3 (addressed). Added phenotypes drawn from the 23-patient cohort frequency table already present in the cached source: splenomegaly 39%, molluscum contagiosum 35%, decreased IgA 78% and decreased IgG 74%. This also answers the reviewer's separate observation that the entry carried no frequency data at all.

    Finding 4 (addressed). Added a diagnosis section: NKG2D surface expression by flow cytometry (low in 100% of the cohort and the disease-specific test), serum transferrin isoelectric focusing, and MAGT1 molecular testing.

    Finding 5 (addressed). Added allogeneic HSCT, graded PARTIAL and carrying the source's own caveat that it has high mortality in XMEN from post-transplant bleeding, and gene therapy as explicitly investigational. Both are quoted from the cached trial paper rather than from the deep-research report. The reviewer also suggested rituximab, IVIG, CHOP-like chemotherapy and MAGT1 mRNA-corrected T/NK cell therapy; those are named only in the DR report and could not be supported by an exact quote from a cached primary reference, so they were deliberately NOT added rather than curated on DR authority.

    Term corrections found during this pass: HP:0002961 Dysgammaglobulinemia is obsolete and rejected by the dynamic enum; HP:0032151 is Episodic eosinophilia, not molluscum (correct term HP:0032163, whose canonical label is 'Unusual molluscum contagiosum'); HP:0410379 and HP:0001875 labels were wrong. All corrected against OAK.

    Validation after changes: linkml-validate clean; term validation passed; reference snippet audit 40/40 verified; all five ungated CI gates clean.

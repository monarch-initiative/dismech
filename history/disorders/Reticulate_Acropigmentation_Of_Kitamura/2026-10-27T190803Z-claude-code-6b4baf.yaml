  summary: 'Review round 1: deep research and review fixes'
  details: |
    Ran just research-disorder falcon with fallback; falcon was not configured, so OpenScientist produced the committed report (preflight-dr PASS, 28/28 references resolved). Checked the entry against it. Added from the report: the epidermal Adam10 knockout (PMID:21205794) as model-organism evidence that ADAM10 loss reduces epidermal Notch processing, and as an animal model linked to the Notch node; primary histology and ultrastructure in four patients (PMID:3994414) on the melanocyte node and histopathology; three single-case extracutaneous findings (fifth-finger clinodactyly and gingival overgrowth, PMID:35978738; absent distal toe phalanges, PMID:8973039) as VERY_RARE. The report gives no cohort proportion for palmar pits or dermatoglyphic breaks, so those stay FREQUENT. Ralser 2017 (PMID:29192958) still has no retrievable abstract and stays uncited. Review fixes: dropped the PMID:29201043 no-consensus quote from the laser treatment; Epidermal Melanocyte Expansion set to CELLULAR. evidence_source is graded by what each quoted sentence describes: patient histology and clinical description as HUMAN_CLINICAL, statements of molecular biology or stated speculation as OTHER, with quote_role recording review provenance.

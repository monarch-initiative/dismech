  summary: 'Audit and enrich Osteogenesis Imperfecta Type XXII: add synonyms, classifications,
    causal pathograph wiring, phenotypes, embryonic-lethal mouse model, diagnosis,
    and bisphosphonate therapy'
  details: |
    Added MONDO synonyms (OI22, CCDC134-related osteogenesis imperfecta, osteogenesis imperfecta IIA); added Harrison GENETICS_ENVIRONMENT_DISEASE and mechanistic_category collagenopathy classifications with evidence on ISDS skeletal category; preserved pathograph node class anchor Defective Bone Matrix, Reduced Mineralization, and Skeletal Fragility while grounding pathophysiology nodes with biological_scale, CCDC134 (hgnc:26185) germline loss-of-function genetic_context, protein-folding chaperone binding (GO:0051087), ER lumen (GO:0005788), skeletal locations, and bare-name downstream edges connecting all 7 phenotypes (100%); added phenotype categories, Wormian Bones (HP:0002645), and direct OI-XXII clinical evidence for Low Bone Mineral Density and Long-Bone Bowing; added Ccdc134-/- embryonic-lethal mouse model (FAILS_TO_RECAPITULATE); added Bone Radiography and Dual X-ray Absorptiometry diagnostic entries; enriched Bisphosphonate Therapy with SMALL_MOLECULE modality, pamidronate/zoledronic acid agents, and target_mechanisms with evidence.

  summary: Re-anchor MECP2 Duplication Syndrome to MONDO:0010283
  details: |
    Entry described MECP2 duplication syndrome but was anchored on MONDO:0010436 (OMIM:300815, 'chromosome Xq28 duplication syndrome') - the int22h1/int22h2-mediated Xq28 duplication involving CLIC2 and RAB39B, which carries no MECP2 gene relation and is a different disease. Re-anchored disease_term to MONDO:0010283 (OMIM:300260), which carries 'MECP2 duplication syndrome' as an EXACT synonym and an explicit RO:0004003 relation to HGNC:6990 MECP2, and added a matching mondo_mappings exactMatch with justification. Verified with runoak against sqlite:obo:mondo and against MedGen C2749007. No prose, phenotype, mechanism or evidence content changed. just validate passes.

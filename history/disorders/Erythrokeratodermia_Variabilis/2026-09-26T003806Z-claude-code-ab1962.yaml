  summary: 'Review round 1: state why the PERP route has no downstream edge'
  details: |
    Non-blocking suggestion on PR 12775. The Keratinocyte Hyperproliferation node is where the TRPM4 and PERP routes converge, but only TRPM4 carries a downstream edge into it; PERP reaches it through the gene binding alone. The node description now says so, and says why - the PERP report establishes that the skin is hyperproliferative without establishing whether that follows the desmosome maturation failure or accompanies it - so a reader does not expect a Desmosome Maturation Failure edge that the source does not support.

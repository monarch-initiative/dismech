  summary: 'Genetics pass: EKVP1-7 subtype series, four new genes, pathograph wiring'
  details: |
    Genetics pass for the genetics-gap campaign (issue #12248, series-041). Enumerated all 8 hierarchical descendants of MONDO:0017851 via OLS4 and read each term's RO:0004003 gene edges; seven carry exactly one edge and form the numbered EKVP series. Added has_subtypes rows EKVP1 to EKVP7, each with subtype_term bound to its own MONDO class and a genes descriptor. Added genetic records for the four genes the entry did not have: KDSR (EKVP4), KRT83 (EKVP5), TRPM4 (EKVP6) and PERP (EKVP7), each with subtype foreign key and abstract-quoted evidence from its primary report. Bound GJB3, GJB4 and GJA1 as genes on the existing Connexin Mislocalization node, which previously reached no gene, and added the GJB4 mislocalization evidence item that node was missing. Added four pathophysiology nodes so every gene reaches the pathograph: Epidermal Ceramide Synthesis Deficiency (KDSR), TRPM4 Cation Channel Hyperactivity, Desmosome Maturation Failure (PERP), Keratinocyte Hyperproliferation (the TRPM4 and PERP convergence), and Keratin 83 Loss of Function. The KRT83 node deliberately records a predicted null with no demonstrated downstream mechanism, because the single reporting kindred states the protein effect as an expectation. Rewrote the description and notes to record the connexin versus non-connexin split within the series, the eighth descendant MONDO:0018853 which carries no gene edge and is not curated here, and the fact that Orphanet could not be consulted from a worktree. Tagged the StatPearls chapter in a new references block. Every MONDO CURIE and label was read from OLS4, and every HGNC CURIE from the HGNC REST API, in the same session the bindings were written. Gates: just validate 62 snippets 0 issues, validate-terms passed, list-gene-term-mismatches 0 findings.

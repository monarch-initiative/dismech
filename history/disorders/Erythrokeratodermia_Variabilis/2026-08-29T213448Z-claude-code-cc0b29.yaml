  summary: 'Review: Erythrokeratodermia Variabilis evidence re-read against cached
    sources'
  details: |
    Re-read all 11 cached references and re-verified all 28 evidence items. Every snippet is
    an exact substring of its cache, including the ClinGen table row. No GJB3/GJB4/GJA1
    confusion anywhere: every gene-specific claim is cited to a paper about that gene, and the
    Cx31/Cx30.3/Cx43 correspondences are correct. evidence_source grading is internally
    consistent and correctly split - PMID:21564177 is cited with two different sentences, the
    mutation-detection one as HUMAN_CLINICAL and the site-directed-mutagenesis one as
    IN_VITRO. No defects.

    Recorded for follow-up:
    - inheritance[Autosomal recessive].evidence[1] cites PMID:22266302, but that paper's own
      result is a homozygous GJB4 variant it predicts to be benign - it documents no recessive
      EKV case, and the quote used is background review prose. The block's description is about
      biallelic GJB3 in consanguineous pedigrees, which its sibling item (PMID:21564177) does
      support.
    - progression[Onset] asserts birth-to-infancy onset only, while two of the entry's own
      cited references are late-onset cases - one says so in its title ("with adult onset") and
      its abstract states "it very rarely starts after childhood".
    - The Connexin Mislocalization -> Impaired Gap Junction Assembly backbone rests on a single
      sentence about one recessive GJB3 allele, reused three times; two already-cached papers
      offer independent IN_VITRO support for GJB4 and GJA1.
    - treatments curates only acitretin, although the entry's own cited review names topical
      keratolytics and emollients as the usual first line.

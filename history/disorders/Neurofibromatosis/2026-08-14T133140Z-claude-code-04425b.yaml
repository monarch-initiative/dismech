  summary: Address PR 8464 review (ai4c-reviewer CHANGES_REQUESTED)
  details: |
    Addressed the CHANGES_REQUESTED review on PR 8464.

    CRITICAL fix: the Meningioma phenotype previously cited PMID:36148553 with the
    snippet "driven by the TAZ protein in human and mouse NF2-null schwannoma cells",
    which evidences neither meningioma as an NF2 manifestation nor the SMARCB1 clause.
    Replaced with two correct cached GeneReviews citations: PMID:20301380
    ("schwannomas of other cranial and peripheral nerves, meningiomas, ependymomas")
    for meningioma as an NF2 manifestation, and PMID:29517885 ("Meningiomas have only
    been reported in individuals with SMARCB1-related schwannomatosis.") for the
    schwannomatosis clause. PMID:36148553 remains legitimately used (unchanged) on the
    Merlin Loss / Hippo pathophysiology node.

    IMPORTANT fixes:
    - Removed the incorrect tags:[GeneReviews] on PMID:34012067 (Legius et al., Genet
      Med 2021 revised diagnostic criteria; the tags enum only admits GeneReviews, and
      this is not a GeneReviews article).
    - Mined the NF1 GeneReviews (PMID:20301288): added it to references with the
      GeneReviews tag and cited it on the NF1 subtype (clinical characteristics), the
      Cutaneous Neurofibromas and Plexiform Neurofibroma phenotypes, the germline
      first-hit node, and the NF1 diagnosis entry.
    - Mined the NF2 GeneReviews (PMID:20301380) beyond the single reused sentence:
      added Bevacizumab (anti-VEGF) and Stereotactic Radiosurgery treatments (the
      latter carrying the radiation-avoidance caveat), NF2 annual brain MRI + BAER
      surveillance evidence, and the NF2 diagnostic-criteria entry.
    - Added a diagnosis: section (three entries: NF1 clinical+molecular criteria with
      PMID:34012067 as the revised-criteria headline, NF2, and schwannomatosis), each
      bound to NCIT:C15709 Genetic Testing.

    SUGGESTIONS implemented: subtype_term MONDO bindings on all three subtypes
    (NF1 MONDO:0018975, NF2 MONDO:0007039, schwannomatosis MONDO:0008075); changed the
    questionable MODEL_ORGANISM tag on PMID:36944680 to HUMAN_CLINICAL (the quoted
    claim concerns human schwannoma biology); added evidence to the germline first-hit
    node (PMID:20301288 AD germline + PMID:18072270 germline-plus-somatic two-hit);
    better-evidenced the Plexiform Neurofibroma phenotype with the NF1 GeneReviews
    frequency statement; added a prevalence: section (NF1 point prevalence 1 in 3,164,
    NF1 birth incidence 1 in 2,662, NF2 birth incidence 1.08 per 50,000) from the Lee
    et al. 2023 meta-analysis PMID:37710322; and broke the triple-reused "cardinal
    features" snippet by moving Cutaneous Neurofibromas to a distinct GeneReviews quote.

    Deep research: ran `just research-disorder perplexity "Neurofibromatosis"` (the
    first attempt failed with a transient Perplexity server disconnect; the retry
    succeeded). Report committed with its citations sidecar. Its Reference Validation
    section reported 12/12 resolved, but NEC/§2a check caught that the report cited
    PMID:37338824 for NF1 prevalence — that PMID is actually a bacterial-rhinosinusitis
    paper (misattribution), so it was discarded and the real meta-analysis
    (PMID:37710322) was located via PubMed and verified instead.

    Validation: just validate (schema + terms) OK; count-verified-snippets 49/49
    verified; just validate-disorders (batched schema+terms+references, the CI check)
    all passed; check-title-snippets OK (no new title-quoting snippets). Generated
    term-cache rows (cache/mondo/terms.csv, diseaseorsubtypeterm enum) committed;
    incidental validator full-text enrichment of unrelated reference_cache files was
    reverted to keep the diff targeted.

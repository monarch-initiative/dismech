    PR Shepherd follow-up to the ai4c-reviewer CHANGES_REQUESTED review on #8464, addressing the CRITICAL finding and two of the IMPORTANT findings. (1) CRITICAL: the Meningioma phenotype was evidenced only by PMID:36148553 with the snippet 'driven by the TAZ protein in human and mouse NF2-null schwannoma cells', a sentence fragment about ALDH1A1 as a Hippo target in schwannoma cells that does not evidence meningioma as an NF2 manifestation nor the SMARCB1 clause. Replaced with the two already-cached GeneReviews sentences the reviewer identified: PMID:20301380 (NF2-Related Schwannomatosis) for meningioma as a characteristic NF2 tumor, and PMID:29517885 (LZTR1- and SMARCB1-Related Schwannomatosis) for meningioma being restricted to the SMARCB1-related form. (2) Removed the incorrect GeneReviews tag from PMID:34012067, which is the Genet Med 2021 Legius et al. revised diagnostic criteria consensus paper, not a GeneReviews chapter. (3) Registered the NF1 GeneReviews chapter PMID:20301288 in the references block with the GeneReviews tag and cited it on the Plexiform Neurofibroma phenotype, which previously had only the SPRINT selumetinib treatment snippet as evidence. Deliberately not addressed and left for the author: the missing deep-research artifact, fuller mining of the NF2 GeneReviews Management and Genetic Counseling sections, bevacizumab as a treatment, the absent diagnosis section, and all six suggestions. Validated: just validate kb/disorders/Neurofibromatosis.yaml passed with Snippets checked 34/34 verified; check_folded_hyphens OK; check_title_snippets OK.

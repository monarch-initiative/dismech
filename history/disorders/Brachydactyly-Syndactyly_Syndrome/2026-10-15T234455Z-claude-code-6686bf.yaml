  summary: 'Create: Brachydactyly-Syndactyly Syndrome'
  details: |
    Created the BDSD entry (MONDO:0012544, OMIM 610713, ORPHA:93409) from the defining HOXD13 report (PMID:17236141), the Orphanet record ORPHA:93409 (definition, HPO frequencies, prevalence class, gene), and two functional papers on HOXD13 polyalanine tracts (PMID:37035736 nuclear localization of contracted HOXD13; PMID:37427568 condensation mechanism of the expansion alleles) plus PMID:8898214 for autopod Hoxd13 expression. Pathograph: polyalanine contraction (MOLECULAR) -> disturbed autopod patterning (TISSUE) -> serially homologous short digits with toe syndactyly (TISSUE) -> all 11 phenotypes, with conforms_to on the three limb_digit_patterning_serial_homology nodes. A KNOWLEDGE_GAP discussion records that the contraction mechanism is unexplained. One openscientist deep-research report was used (job acb08c9a-3212-43dd-a879-b82b08478951); it was retrieved by re-attaching to that original job after a container restart, with no second job submitted. Its reference validation resolved 35/35 citations (0 unresolved, 27 on topic, no quote check recorded); its term validation flagged 7 mislabelled CURIEs (including three NCIT treatment codes naming Mastectomy, Hematopoietic Cell Transplantation and Cryosurgery), none of which were used: every HP term here was taken from ORPHA:93409 and looked up in OLS, with obsolete HP:0009773 replaced by HP:0009700. Report citations dropped: the report folds BDSD into the whole HOXD13/synpolydactyly spectrum, so its SPD1, syndactyly type V (Q317R, Q50R mouse), I47L, truncating-variant, mouse-model and generic syndactyly-surgery citations were not used as BDSD evidence; its claim that the contraction acts by altered condensation is not supported by its cited sources and is contradicted for nuclear entry by PMID:37035736, so it was not adopted. No treatment was added because no source describes management of BDSD itself. just preflight-dr could not run: no local mondo.db and it was not downloaded (about 1.3 GB); a manual check found the report names HOXD13 64 times and the correct OMIM and defining PMID. just check-genereviews --online: NO_CHAPTER. Orphadata bulk files were fetched for ORPHA:93409 and differ from the manifest pin (release 2026-06-23 vs pin 2025-12-09); the manifest was not repinned. Validated with just validate, validate-terms, count-verified-snippets (30/30), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-snippet-length, check-title-snippets, check-folded-hyphens, check-block-scalar-comments, check-coarse-phenotypes, check-enum-values, check-snippet-grading, normalize-cache, check-term-cache-integrity and validate-disorders, all passing.

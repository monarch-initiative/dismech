  summary: Enriched brachydactyly-syndactyly syndrome with Harrison's classifications, autopod anatomical and subcellular grounding, phenotype descriptions, and diagnosis and treatment sections.
  details: Added GENETICS_ENVIRONMENT_DISEASE and IMMUNE_RHEUMATOLOGIC Harrison's chapter classifications backed by PMID:17236141. Grounded pathophysiology nodes with nucleus (GO:0005634) cellular component, regulation of DNA-templated transcription (GO:0006355), and limb bud, manus, pes, manual digit, and pedal digit anatomical locations. Added descriptions to all skeletal phenotypes lacking one, added HOXD13 molecular genetic testing and hand/foot radiography diagnosis entries, and added genetic counseling and supportive orthopedic care treatments.

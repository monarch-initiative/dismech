  summary: 'Create: Spermatogenic_Failure_39'
  details: |
    New entry for MONDO:0032845 (DNAH17-related SPGF39), curated from the open stub, which was deleted. Evidence comes from the full texts of PMID:31658987, PMID:41549443 and PMID:35692830, the abstracts of PMID:31178125, PMID:31841227, PMID:33070343, PMID:33724408, PMID:34126833, PMID:34373205, PMID:37574497, PMID:40009974 and PMID:41258988, and the ClinGen DNAH17/SPGF39 record (Definitive, copied into gene_disease_validity), all fetched with just fetch-reference. The causal chain runs from DNAH17 loss, to sperm outer dynein arm loss (with DNAH8, DNAI1, ODAD2 and ODAD4 depletion), to doublet 4-7 destabilization and axonemal disorganization, to MMAF and the phenotypes. Two hypotheses: sperm-specific ODA heavy chain (CANONICAL, with the unreplicated laterality report PMID:35692830 recorded as REFUTE) and allele-dependent severity, null alleles giving MMAF and the p.C1803Y hypomorph giving asthenozoospermia without MMAF (EMERGING). Mouse knockout, p.C1803Y knock-in mouse and Swiss Large White boar models are linked. ICSI outcomes are mixed and recorded with SUPPORT and REFUTE items. Deep research: just research-disorder falcon failed repeatedly with Edison 503 'Failed to authenticate' over about 40 minutes, including with --fallback and --fallback-provider claude_code; just research-disorder claude_code produced research/Spermatogenic_Failure_39-deep-research-claude_code.md. just preflight-dr returned WARN only because the report cites the gene OMIM 610063 rather than the phenotype OMIM 618643; both are now in notes. Validated with just validate, count-verified-snippets, validate-disorders (both files, 80/80 snippets), check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values and check-genereviews (NO_CHAPTER).

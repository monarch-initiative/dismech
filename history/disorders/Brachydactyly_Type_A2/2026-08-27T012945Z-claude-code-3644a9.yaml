  summary: 'Create: Brachydactyly Type A2'
  details: |
    Curated as part of a completeness pass over ISDS Nosology group 18 [Brachydactylies, isolated], which previously held only Brachydactyly Type A1 in dismech. Split rather than lumped: BDA2 is one nosology row with one MONDO class [MONDO:0007216] and three molecular routes, so the three genes are curated as separate pathophysiology trigger nodes converging on a shared BMP/SMAD effector rather than as separate entries. Pathophysiology covers dominant-negative BMPR1B [I200K kinase-deficient, R486W kinase-competent], the GDF5 R380Q precursor-processing defect, and the BMP2 limb-enhancer microduplication, all conforming to limb_digit_patterning_serial_homology. All 37 evidence snippets verified against the reference cache.

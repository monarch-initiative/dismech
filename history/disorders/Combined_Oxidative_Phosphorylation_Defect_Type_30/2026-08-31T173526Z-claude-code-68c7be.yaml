  summary: 'Create: Combined Oxidative Phosphorylation Defect Type 30 (TRMT10C/MRPP1)'
  details: |
    De novo curation of COXPD30 (MONDO:0014856), the TRMT10C/MRPP1 mitochondrial disease. One openscientist deep-research report was generated and preflighted with "just preflight-dr ... MONDO:0014856". The preflight returned WARN because PRORP is mentioned at 36 percent of the TRMT10C rate; that was checked and is legitimate mechanism context, since PRORP is the third subunit of the same mitochondrial RNase P holoenzyme, not a second disease entity mixed into the report.

    The entry was written from the primary literature, principally the disease-defining paper PMID:27132592, whose PMC full text supplied most of the evidence. The deep-research report then contributed two things that were fetched and verified independently before use: the cryo-EM structure of human mitochondrial RNase P (PMID:34489609), which shows PRORP is recruited and activated through interaction with the TRMT10C subcomplex and so makes the MRPP1-MRPP3 interface hypothesis structurally coherent, and the disambiguation from COXPD26, which is a TRMT5 disorder and is adjacent in the COXPD numbering.

    Pathograph: biallelic TRMT10C missense variants, MRPP1 protein destabilization, impaired mitochondrial RNase P 5-prime processing, impaired mitochondrial protein synthesis, combined complex I and IV deficiency, systemic lactic acidosis and multiorgan energy failure.

    Two curation decisions are worth recording. First, "Preserved m1R9 Methyltransferase Activity" is kept as a pathophysiology node with no downstream edge. It is not a step in the causal chain; it is the negative control that assigns the lesion to the RNase P arm of MRPP1 rather than to its methyltransferase arm, and dropping it would make the mechanism look less specific than the evidence supports. Second, that node's GO descriptor carries no modifier, because ModifierEnum has no permissible value for a process measured and found unchanged, and the nearest available values would assert the opposite of the finding. ExperimentalReadout.direction does have UNCHANGED for the same situation, so the gap is specific to descriptors.

    Death in infancy is recorded under progression rather than as a phenotype, because HP:0001522 is a mortality term and is not a member of the PhenotypeTerm dynamic enum. The phenotype list carries the terminal respiratory failure instead.

    Only two unrelated individuals have ever been reported, so every severity and organ-involvement statement in the entry describes an n of 2 and is caveated as such in the notes.

    Validated with just validate for schema and references, all snippets verified against cached references, plus just validate-terms, just check-entity-refs and just check-duplicate-keys, all passing.

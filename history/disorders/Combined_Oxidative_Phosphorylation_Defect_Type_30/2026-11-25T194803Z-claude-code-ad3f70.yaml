  summary: 'Gene-family review: TRMT10C'
  details: |
    None of the three TRMT10C nodes bound a molecular function. The RNase P processing node now binds ribonuclease P activity (GO:0004526) DECREASED: TRMT10C (MRPP1) is an essential, non-catalytic subunit of mitochondrial RNase P, and the patient variants lower MRPP1 protein and slow 5' processing while leaving m1R9 methyltransferase activity unaffected (PMID:27132592, quoted on the node). The node description states that distinction, so the methyltransferase activity TRMT10C also carries is deliberately not bound as decreased. The genetic record gains an autosomal recessive inheritance block (HP:0000007) citing biallelic variants in both patients (PMID:27132592).

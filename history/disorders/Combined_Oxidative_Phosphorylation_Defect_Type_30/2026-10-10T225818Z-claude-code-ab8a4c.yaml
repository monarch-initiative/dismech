  summary: Bind TRMT10C to MRPP1 destabilization and RNase P processing nodes
  details: |
    Gene-alignment review against the ai-gene-review TRMT10C review. The molecular nodes 'MRPP1 Protein Destabilization' and 'Impaired Mitochondrial RNase P 5' Processing' named MRPP1 in prose but carried no gene descriptor; added hgnc:26022 TRMT10C to both so the gene reaches the GO:0097745 node, which matches the gene's normal function (RNase P subunit; m1R9 methyltransferase). ClinGen classifies TRMT10C only for the broader 'mitochondrial disease' (MONDO:0044970), so no gene_disease_validity was recorded. Validated with just validate, validate-terms and count-verified-snippets (52/52).

  summary: 'Review response: term specificity, evidence grading, anatomical location'
  details: |
    Response to the first review round on PR #10252.

    Ontology bindings made more specific, both blocking. GO:0090646 (mitochondrial tRNA processing) replaced with GO:0097745 (mitochondrial tRNA 5'-end processing) on the Impaired Mitochondrial RNase P 5' Processing node: the node's whole claim is that the lesion is at 5' cleavage while ELAC2-mediated 3' processing stays intact, and the parent term collapsed that distinction. GO:0030488 (tRNA methylation) replaced with GO:0070901 (mitochondrial tRNA methylation) on the Preserved m1R9 Methyltransferase Activity node. Both replacements are direct is_a children in the BP branch and so remain BiologicalProcessTerm enum members; GO:0097745 was in neither cache and was resolved live through the ols:go adapter, adding one label row and one enum-membership row.

    Evidence grading corrected, blocking. The ExAC/ESP6500/COSMIC allele-frequency snippet was graded IN_VITRO; it is a sequence-database lookup with no cells, tissue or biochemical assay, so it is now COMPUTATIONAL, matching the SIFT/PolyPhen-2 item twelve lines away. The adjacent conservation-plus-rarity snippet was graded HUMAN_CLINICAL and is now COMPUTATIONAL as well. The reviewer suggested splitting that second item because the sentence bundles two claims; it is not split, because both halves are database and alignment work and would carry the same grade, so the split would add an item without adding information. The reason is recorded in the item's explanation.

    preferred_term on the m1R9 descriptor read "mt-tRNA m1R9 methylation, measured and found unaffected", which put a finding in a display-label slot. It now reads "mitochondrial mt-tRNA m1R9 methylation"; the negative result was already carried by the node description and the entry notes.

    Two non-blocking suggestions taken. A locations binding to UBERON:0001134 (skeletal muscle tissue) was added to the Combined Respiratory Chain Complex I and IV Deficiency node, which the node's own quoted biopsy snippet supports directly. Note the reviewer named the slot located_in; that slot is on Descriptor, whereas Pathophysiology carries locations, so the binding is on the node. PMID:34715011 was added to the PRORP differential, quoting the sentence that pathogenic variants in all three mt-RNase P subunits cause mitochondrial dysfunction each with distinct pleiotropic presentations. That is the allelic-series premise the differential section already rested on without citing.

    The third suggestion, modelling HP:0008314 as a phenotype as well as pathophysiology, is not taken. Decreased respiratory chain enzyme activity is a mechanism step here and is already the subject of a pathophysiology node; duplicating it as a phenotype would assert it twice.

    The ModifierEnum gap the PR body raised was not filed as a new issue. It is the same gap as issue #10108 (no way to assert a measured-normal value), whose option (b) is "a modifier value for NORMAL on descriptors". Commented there instead, adding three things: the resolution proposed on that issue, adding EXCLUDED to FrequencyEnum, cannot reach this case because Descriptor has no frequency slot; ModelReadoutDirectionEnum already carries UNCHANGED for the same claim in a different slot; and a GO binding does not need the Scott_Syndrome leave-it-unbound fallback, since a GO process term names a reaction without asserting impairment.

    Validation on the resulting file: just validate passes with 52/52 snippets verified, up from 51/51. validate-terms, validate-disorders, check-entity-refs, check-duplicate-keys, check-enum-values, check-cache-order, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-environmental-evidence all pass.

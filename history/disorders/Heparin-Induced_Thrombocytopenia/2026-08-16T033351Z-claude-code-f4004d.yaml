  summary: 'Address review on PR 8595: arterial phenotype, term rebinding, animal
    model, genetics gap'
  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR #8595: all three
    blocking items and seven of eight suggestions.

    IMPORTANT 1 - no arterial thrombosis phenotype. Added, bound to HP:0004420
    (already cached), with two evidence items: PMID:37959386 enumerating strokes,
    myocardial infarction and limb artery thrombosis and noting that some patients
    have both venous and arterial disease, and PMID:36669155 confirming the same
    spectrum independently. No frequency band asserted - the sources describe
    arterial events as prominent but none quantifies them.

    IMPORTANT 2 - NOT APPLIED IN THIS SESSION. The intent was to rebind Cerebral
    Venous Sinus Thrombosis from HP:0005305 to HP:0033724, an exact label match
    already in cache, but the edit was lost before the commit (see the correction
    note at the end of this record) and HP:0005305 remained bound. It was applied
    in the following corrective session.

    IMPORTANT 3 - added animal_models with the FcgammaRIIA/hPF4 double-transgenic
    mouse challenged with KKO plus heparin (PMID:11588041, newly fetched). Three
    modeled_mechanisms links rather than the two requested: RECAPITULATES on the
    FcgammaRIIA activation node and on platelet consumption, plus
    PARTIALLY_RECAPITULATES on Venous and Arterial Thrombosis. The third is graded
    down deliberately - the model's thrombosis is disseminated multi-organ with
    shock, closer to a shock syndrome than to the discrete DVT, PE and limb-artery
    events of human HIT, and it required 2.5 times the heparin dose used for the
    thrombocytopenia readout. Each link carries readouts with MODEL_ORGANISM
    evidence and its own limitations.

    The most important limitation recorded is that the model bypasses the immune arm
    entirely: a monoclonal antibody is injected rather than raised, so the system
    tests the effector limb and says nothing about why only some patients mount a
    pathogenic response. That is cross-referenced to the genetics knowledge gap
    below, since the two omissions are the same blind spot seen from two directions.

    SUGGESTION 4 - added the KNOWLEDGE_GAP on absent validated genetic determinants,
    citing PMID:30398086 and PMID:29934777 (both newly fetched). Curated with
    deliberate internal tension: the review's overall conclusion is that genetic
    studies have not consistently identified risk alleles, but the same review calls
    the FCGR2A H131R thrombosis association compelling, and a chromosome 5 SNP did
    replicate. Both are recorded, the dissenting items as PARTIAL, because
    flattening that disagreement would misrepresent the state of the field.

    SUGGESTION 5 - NOT fully addressed, and deliberately so. The reviewer prioritized
    an HLA class II presentation node driving the IgM-to-IgG class switch. I could
    not find a citable source with a quotable abstract statement of that mechanism in
    this curation pass; PMID:30398086 mentions HLA-DR only as a candidate
    susceptibility locus, which is a different claim. Adding a pathophysiology node
    on that basis would be an unevidenced assertion in the middle of the causal
    chain, which is worse than the gap it fills. The HLA-DR candidacy is instead
    recorded in the genetics KNOWLEDGE_GAP. NETosis and complement arms are likewise
    not added for want of cached sources.

    SUGGESTION 6 - added Skin Necrosis at Heparin Injection Sites (HP:0033126,
    already cached) with PMID:15570433, including a PARTIAL item recording that the
    sign is rare and probably under-reported, so its absence carries no weight even
    though its presence is informative. Adrenal haemorrhagic infarction and
    anaphylactoid reactions not added - no cached source with a quotable statement.

    SUGGESTION 7 - added Direct Oral Anticoagulants (rivaroxaban NCIT:C77995,
    apixaban NCIT:C61308) and Therapeutic Plasma Exchange (NCIT:C15304), both with
    target_mechanisms links. Plasma exchange targets the antibody node rather than
    the receptor or thrombin nodes, making it the only curated intervention acting
    upstream of all the others - which is exactly why it remains available when
    IVIG and direct thrombin inhibitors have both failed.

    SUGGESTION 8 - added historical-control outcome figures to the progression
    notes, citing the argatroban study's control arms (38.8% composite in HIT,
    56.5% in HIT with thrombosis at 37 days) rather than the research artifact's
    unsourced percentages.

    SUGGESTION 9 - ONLY HALF APPLIED IN THIS SESSION. The evidence item was copied
    onto Limb Gangrene, but the deletion of the standalone Limb Amputation
    phenotype and the extension of the gangrene description were both lost before
    the commit. The net effect was therefore to duplicate the evidence item across
    two phenotypes that still shared one HP:0100758 binding - worse than the state
    the suggestion was meant to fix. Completed in the following corrective session.

    SUGGESTION 10 - NOT APPLIED IN THIS SESSION. The snippet still ended mid-word
    at "disseminated intravascular coa" after this commit. Applied in the
    following corrective session.

    SUGGESTION 11 - filed issue #8597 documenting the bracketed-abbreviation
    normalization behaviour, with all four occurrences across this curation series
    ([GERD], [RR], [CI], [APTT]), the asymmetric-normalization diagnosis, and three
    suggested fixes.

    CORRECTION NOTE. This record originally claimed the three edits above had
    landed. They had not. A single Python edit script applied several replacements
    in sequence and wrote the file only at the end; one replacement raised an
    AssertionError because its target text had already changed, the script
    aborted, and the entire in-memory buffer was discarded. The three edits in
    that buffer were silently lost. Only the replacement re-run individually
    afterwards - the evidence-item copy in suggestion 9 - survived, which is why
    the fold appeared half-applied. The commit was purely additive as a result,
    and the reviewer detected it by diffing for the deletion lines a modification
    must produce. The root cause is the same class of failure that truncated a
    file to zero bytes earlier in this curation series: an edit script whose
    atomicity was assumed rather than verified. The lesson is that an edit claim
    must be checked against the file after writing, not inferred from the script
    having been invoked. The statements above were rewritten after re-checking
    the branch.

    The validation figures below were accurate as recorded for the commit they
    describe; the reviewer independently reproduced the 97/97 snippet count.

    Validation after changes: just validate, just validate-terms, and the full
    batched just validate-disorders sweep all pass; 97/97 snippets verified against
    cached references (was 77/77); compliance 96.3 percent global / 96.7 percent
    weighted, the absolute figure slightly lower than before because the denominator
    grew by 43 slots with the new model and discussion blocks while covered slots
    rose from 167 to 206. Folded-hyphen, snippet-length, and title-snippet gates
    clean. tests/test_data.py subset of 10,247 tests passes.

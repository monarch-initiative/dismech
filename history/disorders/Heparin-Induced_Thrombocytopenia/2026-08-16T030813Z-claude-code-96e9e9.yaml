  summary: 'Create: Heparin-Induced Thrombocytopenia'
  details: |
    Created kb/disorders/Heparin-Induced_Thrombocytopenia.yaml (MONDO:0018048) from
    a claude_code deep-research run plus independent primary-literature
    verification.

    Model: HIT as a drug-induced immunothrombotic disorder whose defining feature is
    an inversion - the falling platelet count marks consumption by activation, not
    bleeding risk. Eleven pathophysiology nodes trace heparin-PF4 neoepitope
    formation through the anti-PF4/heparin IgG response, FcgammaRIIA-mediated
    platelet activation, procoagulant microparticle release and monocyte tissue
    factor expression, explosive thrombin generation, and then the two divergent
    outcomes that share one cause: thrombocytopenia and venous/arterial thrombosis.
    A parallel autoimmune branch (heparin-independent platelet activation) converges
    back on the FcgammaRIIA effector node.

    Four nodes declare conforms_to against the thrombogenesis module (platelet
    activation, coagulation/thrombin, thrombus formation, occlusion/ischemia). Worth
    noting for future curators: that module carries a node named "Anticoagulation
    via Heparin-Potentiated Antithrombin" as its drug-target pattern, and this entry
    is the disease in which administering exactly that drug initiates the pathology.
    The pairing was a reason to pick this disease.

    Treatment logic is wired to mechanism rather than listed. Argatroban targets the
    thrombin-generation node; IVIG targets the FcgammaRIIA node instead, because in
    autoimmune HIT stopping heparin does not de-escalate antibody-induced activation
    and something must act at the receptor. Heparin cessation targets the trigger
    node and is explicitly curated as necessary but not sufficient.

    The warfarin contraindication is modeled as a node plus a treatment rather than
    left as prose. "Warfarin-Induced Protein C Depletion and Microvascular
    Thrombosis" is an iatrogenic pathophysiology node, and "Deferral of Vitamin K
    Antagonist Until Platelet Recovery" is a treatment whose target_mechanisms
    INHIBITS edge points at it. The schema has no contraindication slot; recording
    this only as prose would have left the entry's most counterintuitive clinical
    rule detached from the node that explains it. That modeling choice is documented
    in the treatment's notes.

    Discussions: a CONTROVERSY on direct thrombin inhibitor failure in autoimmune
    HIT (APTT confounding by concurrent DIC causes systematic underdosing, and DTIs
    also inhibit thrombin-induced protein C activation - connecting back to the
    warfarin-gangrene node), plus two KNOWLEDGE_GAPs: the unexplained difference
    between platelet-activating and merely-binding anti-PF4 antibodies, which is why
    no binding assay can be made specific; and non-random under-ascertainment of
    autoimmune HIT, since most laboratories do not test for it and the patients
    missed are exactly those whose disease begins after heparin stops.

    Deep-research handling. The report's reference_validation block reported 38/38
    identifiers resolved with confabulation_rate 0.0, but reported no quotes_checked
    count, so quote fidelity had no signal at all and every snippet was independently
    derived from cached abstracts rather than taken from the report. One DR-suggested
    ontology term was corrected on lookup: GO:0038096 (Fc-gamma receptor signaling
    pathway involved in phagocytosis) is the phagocytosis-specific child and is wrong
    for platelet activation; GO:0038094 (the parent) was used instead.

    NEC handling. This disease carries two genuine naming hazards, both flagged by
    the priority dashboard: the acronym HIT is ambiguous, and "type 1 versus type 2"
    is a numbered series. MONDO:0018048 lists "heparin-induced thrombocytopenia type
    2" among its exact synonyms, confirming this term is the immune disease. The
    non-immune type 1 phenomenon is curated as an explicit differential diagnosis
    and the scoping is stated in the entry's header notes.

    One evidence item quotes mid-sentence because a bracketed abbreviation ([APTT])
    does not survive reference-validator normalization; the omitted words are stated
    verbatim in the adjacent explanation, following the convention used elsewhere in
    the KB. This is the fourth entry in this curation series to hit that
    normalization behaviour.

    Two deliberate omissions rather than weak curation: the environmental heparin
    exposure carries no exposure_term because ECTO's exposure branches do not
    obviously cover a therapeutic drug and no term beats a bad one; and no frequency
    band is asserted for pulmonary embolism because no cached abstract quantifies it.

    Validation: just validate, just validate-terms, just count-verified-snippets
    (77/77), and the full batched just validate-disorders sweep all pass. Compliance
    97.7 percent global / 98.2 percent weighted. Folded-hyphen, snippet-length, and
    title-snippet gates clean. tests/test_data.py subset (12,218 tests covering
    conforms_to references, foreign keys, environmental mechanism targets, and

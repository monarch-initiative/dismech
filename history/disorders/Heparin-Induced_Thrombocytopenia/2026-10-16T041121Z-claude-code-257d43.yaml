  summary: 'LOINC: bind PF4/heparin immunoassay and functional assay codes'
  details: |
    Bound LOINC:73819-5 (Heparin induced platelet IgG Ab [Presence] in Serum or Plasma by Immunoassay) to the IgG-specific anti-PF4/heparin immunoassay diagnosis row, and both LOINC:50736-8 (Serotonin release.heparin.unfractionated panel - Serum) and LOINC:40723-9 (Heparin Ab [Presence] in Platelet poor plasma by Platelet aggregation) to the Functional platelet activation assay row, as part of dismech LOINC Diagnostics tranche C (autoantibodies). Per explicit coordinator instruction, the functional-assay row names two distinct modalities (serotonin release assay and heparin-induced platelet activation/aggregation test) and so got two measurements entries rather than one code with a caveat. No method-less IgG-specific immunoassay code exists (searched 'Heparin induced platelet IgG Ab', only by-Immunoassay variants found); the broader polyspecific code LOINC:34701-3 was deliberately not used since the row is specifically about IgG-restricted testing. The serotonin release assay has separate LOINC codes per heparin formulation (unfractionated/porcine/LMWH); the unfractionated-heparin panel code was chosen as the standard reagent, since the row does not name a specific formulation. All bound labels were verified against the Monarch KG entity API in the same step they were written. Confirmed all three bound CURIEs absent from origin/main's cache/loinc/terms.csv and from every other open loinc-*-batch* branch's committed cache before seeding.

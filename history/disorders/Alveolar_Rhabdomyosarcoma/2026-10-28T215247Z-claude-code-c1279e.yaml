  summary: Add neuroblastoma as a differential diagnosis
  details: |
    Appends a Neuroblastoma row after the existing differential_diagnoses rows. Both are small round blue cell tumours of childhood and are separated on tissue by lineage markers; a marrow-presentation case report (PMID:41225378) shows the pitfall, which the row states as a pitfall rather than a frequency. Two distinguishing features: PHOX2B immunohistochemistry (PMID:25822764, PMID:28640941) and myogenin/MyoD1 (Wang 1995, PMID:7495304). The case report's sentence on ALK immunostaining is not quoted. Part of the neuroblastoma expansion series (issue 15822); the same PR gives five other paediatric tumour entries a matching Neuroblastoma row. The row binds MONDO:0005072, copied from kb/disorders/Neuroblastoma.yaml, so the rendered page links to that entry. Every distinguishing feature is a finding from a quoted sentence. No other part of the entry changes. Validation on the branch rebased onto main: the run_c4 gate set over all six entries (validate-disorders, count-verified-snippets --strict, check-snippet-grading and the whole-repo gates), check-reference-titles-present, check-cache-order, check-logical-rules and check-qualifier-terms all passed.

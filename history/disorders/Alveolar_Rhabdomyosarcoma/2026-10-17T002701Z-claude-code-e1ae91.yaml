  details: |
    LOINC tranche F batch 1. This row names three methods (FISH, RT-PCR, sequencing) with no single committed method, and its own markers list names 'FOXO1 rearrangement' generically alongside the two specific partner fusions (PAX3-FOXO1, PAX7-FOXO1). Searched LOINC for a partner-agnostic FOXO1 rearrangement code and found LOINC:93807-6 (FOXO1 gene rearrangements in Tissue by FISH) -- the only code that is not restricted to one fusion partner, though it is FISH-specific since no partner-agnostic, method-neutral code exists. FISH is also the first-named of the three methods in this row and the one the entry's own cited cohort study (PMID:39686893) used. Newly seeded. just validate-disorders, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-causal-targets, and tests/test_loinc_measurement_schema.py all pass.

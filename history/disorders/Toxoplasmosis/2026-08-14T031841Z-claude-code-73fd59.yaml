  summary: Bind ECTO/XCO exposure_term on pathograph-linked environmental exposures
  details: |
    Bound exposure_term on environmental[] entries that carry influences_mechanisms and so render as nodes in the mechanism graph: Ingestion of undercooked meat containing tissue cysts -> ECTO:3000006 (exposure to Toxoplasma gondii); Exposure to oocyst-contaminated soil, water and produce -> ECTO:3000006 (exposure to Toxoplasma gondii). Terms were selected against the local sqlite:obo:ecto / sqlite:obo:xco builds that conf/oak_config.yaml configures for term validation, not against OLS, because the OLS-served ECTO release contains terms the pinned build lacks. Verified with linkml-validate (schema) and linkml-term-validator (--labels, dynamic-enum membership); no evidence items were added or changed, so snippet validation is unaffected.

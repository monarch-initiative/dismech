  summary: Bind the pathogen-specific diagnostic assays as LOINC measurements
  details: |
    Part of LOINC tranche B (issue 13667). Bound measurements on three existing rows: serology with IgG LOINC:22580-5 and IgM LOINC:25542-2 (method-less serum presence codes); IgG avidity with the method-less avidity ratio LOINC:34422-6; amniotic fluid PCR with LOINC:27999-2 (the specimen is the test identity; no method-less amniotic fluid code found). Added evidence from the review PMID:35874584, already cited in the entry and graded OTHER, on reading IgG and IgM together, IgM persistence, the categorical avidity interpretation and the negative predictive value of amniotic fluid PCR. No avidity band: cut-offs are assay-specific (PMID:27762213 compares two commercial assays) and the review gives no numeric threshold. No antibody bands either.

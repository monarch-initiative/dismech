  summary: 'Review round 1: address PR #8245 completeness gaps'
  details: |
    Round-1 review response for PR #8245 (reviewer: ai4c-reviewer, REQUEST_CHANGES, no CRITICAL issues, 6 IMPORTANT + 5 SUGGESTION items).

    All six IMPORTANT items addressed:
    1. Subtype MONDO bindings — added subtype_term to Congenital (MONDO:0005715), Ocular (MONDO:0005879) and Reactivation (MONDO:0005697). Acquired deliberately left unbound: MONDO has no term for postnatally acquired immunocompetent toxoplasmosis, and the reason is stated in its description rather than left implicit.
    2. genetic: section added — NLRP1/NALP1 host susceptibility locus (hgnc:14374, SUSCEPTIBILITY, PMID:21098108), the three-clonal-lineage parasite population structure (PMID:7594717, Howe & Sibley), and the NE-II serotype/prematurity-severity association (PMID:22499837, NCCCTS). No gene_term on the two parasite entries — HGNC is a human gene nomenclature and has no identifier for a parasite strain lineage; this is stated in the notes rather than forced.
    3. diagnosis: expanded — serology as primary modality (PMID:35694771) and IgG avidity dating of maternal infection (PMID:27762213), alongside the existing amniotic-fluid PCR and neuroimaging entries.
    4. treatments: five added — antiretroviral therapy (NCIT:C94631), co-trimoxazole prophylaxis (NCIT:C15604, PMID:1351371), atovaquone salvage (PMID:11941551), adjunctive corticosteroids (PMID:28125765) and VP shunt (NCIT:C168483, PMID:31491752).
    5. target_mechanisms added to TMP-SMX and pyrimethamine-clindamycin, plus to all five new treatments; every treatment now joins the pathograph.
    6. animal_models: (3 murine models) and experimental_models: (2 cell-culture models) added, with modeled_mechanisms linking back to the ROP/GRA effector and bradyzoite-differentiation nodes.

    Suggestions taken: split the bundled node "Loss of T-Cell Control and Cyst Recrudescence" into "Loss of T-Cell-Dependent Immune Surveillance" (ORGANISM, trigger) and "Bradyzoite-to-Tachyzoite Reversion and Cyst Rupture" (CELLULAR, effector), rewiring all three inbound references; four phenotypes added with quantitative frequency support (headache FREQUENT 56%, hemiparesis OCCASIONAL 29%, fever OCCASIONAL 29% from PMID:40985660; premature birth from PMID:22499837); reactivation-risk epidemiology added (30% lifetime risk untreated, 48% attack rate at CD4<50 seropositive vs 1.3% seronegative); treatment terms made more specific where a real NCIT action term existed; GSE276786 dataset title corrected.

    Suggestions NOT taken, with reasons: no histopathology: section and no purine-salvage node — no source with a quotable abstract describing the human microglial-nodule/necrotizing pattern or the salvage-pathway drug rationale could be found, and fabricating either would be exactly the failure mode this entry was built to avoid. The other two flagged "bundled" nodes were left intact: their paired events occur at the same scale in the same compartment, unlike the T-cell node whose ORGANISM/CELLULAR split was a genuine scale violation.

    Notable evidence-honesty decisions in this round: adjunctive corticosteroids curated with supports: NO_EVIDENCE because the Cochrane review found no eligible RCTs in either direction; atovaquone marked PARTIAL because its trial was explicitly noncomparative; VP shunt marked PARTIAL because outcomes were highly variable; and the prenatal-screening treatment now carries BOTH the SYROCOT null result (REFUTE) and the supportive REIV-TOXO cohort (PMID:39436926, SUPPORT), with the confounding-by-indication caveat stated rather than the conflict resolved in one direction.

    Validation: just validate-disorders passed (schema + terms + references, batched); snippets 150/150 verified against cached references; 4 GEO accessions re-verified OK; weighted compliance 96.4% (up from 95.0%); 7686 relevant pytest data-integrity tests pass. No DR-sourced citations were used for any addition.

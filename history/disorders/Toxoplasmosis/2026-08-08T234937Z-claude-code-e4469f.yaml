  summary: 'Create: Toxoplasmosis (MONDO:0005989)'
  details: |
    De-novo curation of systemic Toxoplasmosis (MONDO:0005989), previously absent from the KB — only ocular toxoplasmosis existed, as an infectious subtype of the Choroiditis entry.

    Deep research provider: claude_code (research/Toxoplasmosis-deep-research-claude_code.md; 164 s, run metadata in the report frontmatter).

    IMPORTANT PROVIDER FINDING — the claude_code run produced accurate narrative biology but a wholly fabricated citation apparatus. All 14 PMIDs in its "Summary of Key PMID Citations" table resolve to unrelated papers (each checked via NCBI esummary): 17825405 is a trial of food additives and hyperactive behaviour, not the SYROCOT meta-analysis; 16709124 is a Raman-spectroscopy paper on water, not Taylor et al. on ROP18; 24581229 is about soccer-pitch injuries. The report also mis-stated the MONDO id for toxoplasmosis (gave MONDO:0005108; correct is MONDO:0005989), gave HP:0000585 for chorioretinitis (that id is Band keratopathy; correct is HP:0012424), and gave CHEBI:8460 for pyrimethamine (correct is CHEBI:8673). The report was therefore used strictly as a topic outline. Every reference here was found independently via PubMed esearch/esummary, cached with `just fetch-reference`, and every snippet quoted from the cached abstract. The landmark papers the report intended to cite do exist and are now cited under their real PMIDs: SYROCOT PMID:17223474; Taylor ROP18 PMID:17170305; Gay TgIST PMID:27503074; Pappas seroprevalence PMID:19433092; Robert-Gangneux PMID:22491772.

    Content: 14-node pathograph running ingestion -> intestinal invasion -> active invasion and parasitophorous vacuole formation -> ROP/GRA effector immune subversion -> dissemination -> IFN-gamma-dependent cell-autonomous control -> BFD1-driven bradyzoite differentiation -> lifelong tissue-cyst persistence, branching to the three clinical outcomes (toxoplasmic encephalitis, recurrent retinochoroiditis, congenital neuroinflammatory injury and hydrocephalus) plus toxoplasmic lymphadenitis. Four subtypes — Acquired, Congenital, Ocular, Reactivation — with subtype-keyed phenotypes, progression and imaging. Treatments cover pyrimethamine-sulfadiazine with folinic acid, spiramycin, TMP-SMX, pyrimethamine-clindamycin and prenatal screening; the SYROCOT null result on clinical manifestations is curated as REFUTE rather than omitted, so the entry does not overstate prenatal-treatment benefit.

    Deliberately NOT asserted: no conforms_to on bacterial_folate_synthesis_inhibition despite the identical DHFR/DHPS sequential-blockade pattern, because that module is explicitly scoped to bacteria and Toxoplasma is a protozoan; recorded instead as a CURATION_TODO discussion (antifolate_module_scope) proposing either module generalisation or a separate protozoal module. Two KNOWLEDGE_GAP discussions record the unresolved parasite-versus-immune basis of ocular tissue destruction and the absence of any cyst-active drug.

    Validation: `just validate-disorders` (batched schema + terms + references) passed; snippets 107/107 verified against cached references; `just validate-terms` passed; 4 GEO dataset accessions confirmed with `just verify-datasets` (all OK, DIRECT relevance tier, relevance triaged manually against pathograph nodes); weighted compliance 95.0%.

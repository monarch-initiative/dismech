  summary: 'Review round 2: retarget mis-aimed co-trimoxazole causal edge'
  details: |
    Round-2 review response for PR #8245. One blocking item: a mis-targeted causal edge introduced by the round-1 fix.

    The "Co-trimoxazole Prophylaxis in HIV Infection" treatment carried target_mechanisms -> "Loss of T-Cell-Dependent Immune Surveillance" with INHIBITS. That asserted co-trimoxazole reverses host CD4 depletion, which is false; the drug is an antifolate acting on the parasite. It also collided with the antiretroviral-therapy edge on the same node, where the same predicate IS true. The reviewer caught this correctly - it was introduced by me in round 1 when adding target_mechanisms to every treatment.

    Retargeted to "Tachyzoite Replication and Haematogenous Dissemination", which is the SECOND of the two options the reviewer offered rather than the first ("Bradyzoite-to-Tachyzoite Reversion and Cyst Rupture"). Reason: co-trimoxazole does not act on the encysted bradyzoite or block the reversion event itself - it kills the tachyzoites that reversion produces. Asserting INHIBITS on the reversion node would have contradicted this entry's own no_cyst_active_therapy KNOWLEDGE_GAP discussion, which records that no available drug acts on the cyst stage. Targeting the replication node states the drug's actual molecular action and keeps prophylaxis consistent with the three other antifolate treatments; the prophylaxis-versus-treatment distinction is timing and indication, which lives in the treatment description rather than in the edge. The edge description was rewritten to say this explicitly.

    After the fix all eight treatment target_mechanisms edges resolve correctly and antiretroviral therapy is the only treatment acting on the host-immunity node.

    Also recorded (non-blocking, raised by the reviewer): the Hemiparesis phenotype description now states the term-choice tradeoff on the record - the source reports "paresis" without lateralising it, HPO has no plain "Paresis" term, so the options were the slightly over-specific Hemiparesis (chosen, because a focal mass lesion produces a lateralised deficit) or the under-specific Muscle weakness.

    Validation: just validate-disorders passed (schema + terms + references, batched); snippets 150/150 verified against cached references; treatment-edge audit confirms all eight targets resolve to real pathophysiology nodes.

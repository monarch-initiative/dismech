  summary: Record 1 deliberate no-link decision on environmental entries
  details: |
    Backfill for issue #8085. No pathograph link was added. This session records, in the entry's own review_notes: field, that the exposure is deliberately left unlinked, and why.

    Entry noted (1):
      - Obesity and elevated body mass index (host state)

    A demographic stratifier is not an exposure: nothing is encountered, ingested, inhaled, or administered, so there is no exposure for an edge to originate from. A host state or comorbid disease is the misfiling tracked in #8185, and an edge from it would render a coexisting disease as an environmental input to this one. In both cases the curated association stays as epidemiology.

    Why the reason is written into the entry rather than only here. A survey of main on 2026-09-04 found 1061 environmental entries, 704 linked, 357 unlinked, and exactly 2 whose entry text recorded the no-link as deliberate: earlier tranches of #8085 put the reason in the history record alone, where a reader of the knowledge base cannot see it and a survey counts the entry as unfinished work. The reason now goes in both places.

    Why review_notes rather than notes. `notes:` is disease content and renders on the public disorder page; `review_notes:` is the curation record and renders nowhere. The docstring of scripts/check_environmental_evidence.py states that split, and the repo already keys its environmental evidence waiver on review_notes alone. Raised as a suggestion by the reviewer on PR #10960 and adopted here. The waiver sentinel is a prefix match on a different sentence, so these dispositions do not trip it: the waiver count is unchanged at 4.

    Nothing was deleted, moved, or regraded. No entry carried a review_notes: field before, and notes: was left untouched, so the change is insertion-only: 272 insertions and 0 deletions across 27 files. Relocating a misfiled environmental entry is issue #8185's business and was not done here.

    Validation: linkml-validate passed on every changed file; count-verified-snippets reported no failing snippets; check-causal-targets, check-entity-refs, check-duplicate-keys, check-enum-values, check-snippet-boundaries, check-title-snippets, check-snippet-length, check-folded-hyphens, check-empty-snippets, check-reference-titles, check-environmental-evidence and check-snippet-grading all reported OK.

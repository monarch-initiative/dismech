  summary: Address review evidence grading and treatment annotations
  details: |
    Addressed the first independent review as one revision. Corrected the PVR conclusion from PMID35182176 to PRIMARY_RESULT; it is the medicolegal audit authors' own conclusion. Added verified NCIT action bindings for pain management, psychosocial care and transanal irrigation, and therapeutic modalities for decompression, physical/psychological support and catheter/irrigation devices. Live OLS searches reviewed; Catheterization NCIT:C38045 is outside the treatment-action enum and was not forced into the slot. The combined bowel program includes manual and pharmacological care, so no falsely specific single-action term or modality was assigned. Clarified that Lavy et al. assembled the comprehensive severity classification.

    Retained the generated registry API snapshot: the clinicaltrials summary cache contains the study purpose but omits recruitment status, so the snapshot is the cached support for ACTIVE_NOT_RECRUITING on the recorded date. Did not add unsupported vascular/edema-to-conduction arrows: the three cached porcine studies demonstrate separate compression responses rather than isolating those causal intermediates. Back pain, sciatica and depression remain unlinked without a precise source supporting those specific edges; the mental-health source explicitly limits causal attribution. Linked this append-only feedback record to PR13562; the earlier REVIEW record is preserved unchanged.

  summary: 'Review round: GeneReviews mining, new phenotypes, node split'
  details: |
    Tagged the cached GeneReviews chapter (PMID:20301684, MFN2 Hereditary Motor and Sensory Neuropathy) and cited all four sections with quote_role REVIEW_SYNTHESIS: the semidominant-inheritance sentence and the AR recurrence risk under inheritance; the AR/AD share and the neuropathy definition on the neuropathy phenotype; the AR median onset of eight years under progression; the 10 percent biallelic diagnostic share under diagnosis; multidisciplinary and low-vision management on supportive care; and a new agents-to-avoid treatment (vincristine, isoniazid, nitrofurantoin, alcohol, malnutrition, obesity). Added phenotypes Optic Atrophy (HP:0000648, OCCASIONAL on the GR AR figure of about 20 percent), Postural Tremor (HP:0002174) and Pes Cavus (HP:0001761), the latter two INDIRECT because GR states them for MFN2-HMSN as a whole; each is wired into the pathograph. Rewrote the genetic note that had said an MFN2 optic-atrophy paper is usually not about this entity. Changed prevalence_class to NOT_YET_DOCUMENTED and recorded the GR recessive share as a proportion, not a rate. Split the bundled Impaired Mitochondrial Quality Control and Axonal Delivery node into a quality-control node and a hedged axonal-delivery node with INDIRECT_UNKNOWN_INTERMEDIATES edges. Distal wasting, reflex loss and sensory loss were not curated: GR's abstract does not mention them and the falcon report's figures come from a broader MFN2 cohort that is not cached. Validated with just validate-disorders, validate-terms, check-genereviews --strict and the whole-KB offline gates.

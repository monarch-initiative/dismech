  summary: 'Create: Charcot-Marie-Tooth Disease, Axonal, Autosomal Recessive, Type
    2A2B (MONDO:0014906, MFN2)'
  details: |
    De novo curation of CMT2A2B (MONDO:0014906), the biallelic MFN2 form of axonal
    Charcot-Marie-Tooth disease, as a standalone kb/disorders entry.

    The dominant/recessive split was the decision, and the answer turned out to be more
    interesting than the question. entry_type DISEASE, standalone, with parents naming
    Charcot-Marie-Tooth Disease Type 2. Three things drove it. dismech curates axonal CMT2
    subtypes as separate files where they have their own MONDO term - 2C, 2JJ, 2P, 2S and 2T
    are all standalone with parents MONDO:0018993. MONDO places MONDO:0014906 directly under
    Charcot-Marie-Tooth disease rather than under CMT2A2 (MONDO:0012231, which has no children
    at all), so there is no ontology parent to attach it to as a subtype. And the biallelic
    form carries a distinct mechanistic claim - the semidominant dosage model - that a
    has_subtypes entry could not carry, since a Subtype has no pathophysiology of its own.

    Preflight against the issue's warning. Charcot-Marie-Tooth_Disease_Type_2.yaml has a
    has_subtypes entry named CMT2A described as MFN2-related, framed around dominant missense
    variants and binding no MONDO term - so it is CMT2A2A in substance though not in name.
    Nothing in kb/ binds MONDO:0014906 or MONDO:0012231 as a disease_term; MONDO:0012231
    appears only as a differential in MSTO1-Related_Mitochondrial_Myopathy. I did not modify
    the CMT2 entry: a one-line cross-reference there is the obvious follow-up and was left out
    to keep this PR to one file. The other MFN2 hits the issue named
    (AR_Cerebellar_Ataxia-Saccadic_Intrusion_Syndrome, Autosomal_Dominant_Optic_Atrophy_Plus)
    are separate entities and are handled as gene-level traps in the genetic notes.

    The mechanistic finding. 'Autosomal recessive' is a convenient label rather than an
    accurate mechanism, and the primary literature says so. The founding series (PMID:18458227)
    examined the parents of three children with biallelic MFN2 variants and found every carrier
    parent asymptomatic OR mildly symptomatic with signs of peripheral neuropathy, concluding a
    semi-dominant mechanism. A later family (PMID:26306937) dissected it allele by allele: a
    semidominant missense allele alone gave a mild subclinical neuropathy, a nonsense allele
    alone was phenotypically silent clinically and electrophysiologically, and the compound
    heterozygote had severe disease - so MFN2 haploinsufficiency is not disease-causing and the
    determinant is the dose of dysfunctional protein. ClinGen independently assigns the MFN2
    gene-disease relationship a semidominant mode of inheritance.

    That is curated three ways: an inheritance block that binds HP:0000007 (the transmission
    pattern the entity is named for and the one a clinician observes) while explaining the
    semidominant mechanism in its description, because HPO has no semidominant term; a
    dedicated pathophysiology node, 'Dysfunctional Mitofusin-2 Above the Semidominant Dosage
    Threshold'; and an OPEN_QUESTION discussion asking whether CMT2A2B is a distinct entity or
    the severe end of one continuous dosage spectrum. functional_impact_category is
    DOMINANT_NEGATIVE rather than LOSS_OF_FUNCTION, and its notes give the observation that
    forces the choice.

    Named Entity Confusion, checked and recorded. Recessive MFN2 also causes a partial
    lipodystrophy / multiple symmetric lipomatosis phenotype with no neuropathy, curated in
    dismech as part of Familial_Partial_Lipodystrophy. A gene-first search for 'recessive MFN2'
    returns both diseases. That is a differential_diagnoses entry with a citation, and it is
    listed not as a clinical differential - the two do not resemble each other - but as the
    search trap it is.

    Evidence base. Eight references, all newly fetched or already cached, none hand-edited:
    PMID:18458227 (founding series), PMID:26306937 (allele dissection), PMID:26955893 (infant
    with diaphragmatic paresis), PMID:29361379 (homozygous child, cerebellar peduncles),
    PMID:37804319 (homozygous antenatal case; supplies the cell biology), PMID:37797217
    (consanguineous Pakistani family), PMID:32733278 (MFN2 review, already in the repo cache),
    PMID:35129250 (neuropathic pain study, already in the repo cache).

    ClinGen is not cited as an evidence item. The current MFN2 / CMT2A2 assertion (Definitive,
    semidominant, August 2026) is absent from the snapshot pinned in data/clingen/MANIFEST.yaml
    and 'just clingen-refresh' fails on checksum drift; the older assertion that IS in the pin
    carries the disease label 'obsolete axonal hereditary motor and sensory neuropathy', which
    would be worse than not citing it. The classification is recorded in prose with its source
    named, and the same conclusion is independently supported by two cited primary papers.

    Scope discipline on the antenatal case. The homozygous fetus with lissencephaly,
    polymicrogyria and cerebellar atrophy supplies this entry's cell biology - clumped,
    tethered, unfusable mitochondria and complex I deficiency without mtDNA instability. Its
    malformation phenotypes are deliberately NOT curated as CMT2A2B phenotypes; whether that
    patient belongs to this entity is a KNOWLEDGE_GAP discussion with a proposed experiment.

    Frequency discipline. The literature is scattered case reports with no cohort, so no band
    is OBLIGATE and each carries its basis. Peripheral axonal neuropathy is VERY_FREQUENT but
    by definition. Gait disturbance, loss of ambulation and respiratory insufficiency are
    FREQUENT on syndrome-level descriptions with explicit qualifiers ('often', 'later') and no
    counts. Diaphragmatic weakness, hypotonia and motor delay are OCCASIONAL on single case
    reports.

    Pathograph. Seven nodes from biallelic variant through the dosage threshold, fusion
    failure, network fragmentation, quality-control and transport failure and respiratory-chain
    deficiency to length-dependent dying-back degeneration. Eight phenotypes, all wired; a
    scripted diff returned zero dangling targets and zero unwired phenotypes. The transport
    node is deliberately hedged - the cited review states the evidence for a mitofusin role in
    mitochondrial transport is contested, and that is curated as an INDIRECT evidence item
    rather than smoothed over.

    Validation. just validate passed with 45/45 snippets verified against cached references and
    no prefix skips. check-entity-refs, check-duplicate-keys, check-causal-targets,
    check-enum-values, check-qualifier-terms, check-folded-hyphens clean.

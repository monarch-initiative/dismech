  details: |
    Answered the 2026-10-24 review. Removed the isds_skeletal_category block: its note placed the entry in ISDS group 38 as covering HOXA13 disorders, but the schema's description of limb_hypoplasia_reduction_defects lists no HOXA13 disorder and allelic hand-foot-genital syndrome sits in group 19; no nosology row listing Guttmacher syndrome was found to cite. Removed the Genetic Counseling target_mechanisms link to the HOXA13 variant node, since counselling does not act on the variant. Removed CL:0000138 chondrocyte from Disrupted Autopod Patterning: HOXA13 patterns distal limb-bud mesenchyme before cartilage forms and no evidence on the node mentions chondrocytes. Removed the tissue-level GO processes and UBERON locations from the MOLECULAR variant node, where they duplicated its two downstream TISSUE nodes. Marked the HOXA13 genetic-testing evidence directness INDIRECT, since the snippet reports a family finding rather than a testing recommendation.

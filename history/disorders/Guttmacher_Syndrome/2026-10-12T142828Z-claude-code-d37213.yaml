  details: |
    De-novo curation of Guttmacher syndrome (MONDO:0008301, HOXA13), claim #13929. Curated as its own DISEASE entry: distinct MONDO/OMIM(#176305)/Orphanet(ORPHA:2957) entity, allelic to and distinguished from hand-foot-genital syndrome (MONDO:0007698, own entry) by postaxial hand polydactyly and uniphalangeal 2nd toes with absent nails. Four PMIDs quoted (8484413 Guttmacher 1993 original family; 11968094 Innis 2002 HOXA13 Q50L; 24934387 Imagawa 2014 severe-spectrum; 36734258 Jaouadi 2023 HOXA continuum background). Deep-research report used as leads only (thin, no verbatim quotes). Pathograph: 3 nodes (HOXA13 missense variant -> autopod patterning + male urethral development) wiring all 6 phenotypes via bare-name downstream edges; gene node grounded with GO:0003700 molecular_functions. gene_disease_validity omitted - only HOXA13 ClinGen assertion is for HFGS, not Guttmacher; recorded in genetic.notes. Validation: validate-disorders passed, 18/18 snippets verified, validate-terms passed, check-gene-activity-grounding clean, 6/6 phenotypes connected.

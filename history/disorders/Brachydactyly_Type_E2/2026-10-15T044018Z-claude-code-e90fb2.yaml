  summary: 'Create: Brachydactyly Type E2'
  details: "Created the PTHLH-related brachydactyly type E2 entry (MONDO:0013244), replacing its stub.\
    \ Deep research was requested from falcon, but the Edison endpoint returned 503 'Failed to authenticate'\
    \ on two attempts and 'deep-research-client providers --check' reported falcon UNREACHABLE; the --fallback\
    \ flag does not fire on that error, so claude_code was run directly (research/Brachydactyly_Type_E2-deep-research-claude_code.md).\
    \ That report is thin (two web searches, four references, all resolved, no quotes) and preflight-dr\
    \ passed (PTHLH 13 mentions, OMIM 613382). Its 'EJHG 2015 oligodontia' citation resolves to Floettmann\
    \ 2016 (PMID:26733284), a PTHLH duplication paper, so it was not used for the dental claim. The entry\
    \ is built mainly from primary literature found by PubMed search: the gene-identification paper (PMID:20170896),\
    \ the two translocation/cis-regulation papers (PMID:20015959, PMID:23093776), later variant reports,\
    \ the 2026 pooled genotype-stature review (PMID:42539507), and the mouse PTHrP growth-plate and tooth-eruption\
    \ literature. Pathophysiology is a chain from PTHLH loss of function (and, separately, disrupted long-range\
    \ cis-regulation) through reduced PTHrP signalling to prehypertrophic chondrocytes, premature hypertrophy,\
    \ and early growth-plate fusion in short tubular bones, with a separate tooth-eruption branch supported\
    \ by mouse and culture data. Only the consequence node conforms to the limb_digit_patterning_serial_homology\
    \ module, since PTHLH is not a patterning input. Seven phenotypes (oligodontia, learning disability,\
    \ speech delay, facial dysmorphism, delayed bone age, nails, breast) are left unwired because no source\
    \ gives their mechanism. Four existing reference-cache files that re-fetching rewrote were restored\
    \ to their committed versions. No GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER).\
    \ Validated: just validate, validate-terms, count-verified-snippets 72/72, check-entity-refs, check-causal-targets,\
    \ check-duplicate-keys.\n A fresh-context self-review before the PR led to these changes: the short-stature\
    \ edge was moved from the short-tubular-bone fusion node to the chondrocyte node, because the hand\
    \ and foot bones do not set height; the dental binding was changed from Oligodontia to Hypodontia,\
    \ because the one detailed case is missing two incisors; disproportionate short stature and obesity\
    \ were added as phenotypes; a breastfeeding finding was removed from the breast-hypoplasia description;\
    \ p.R57* was added to the allele list; and caveats were added for a review that pools in one PTHLH\
    \ duplication case and for a PTH-cascade review sentence that uses pseudohypoparathyroidism as its\
    \ example."

  summary: Expand Bieganski type mitochondrial and AIFM1 variant evidence
  details: |
    Added mitochondrial cellular-component grounding to the AIFM1 variant-associated mitochondrial dysfunction mechanism. Structured the existing AIFM1 genetic entries with variant evidence for p.Asp237Gly and exon 7-region intronic/synonymous variants, including exon 7 skipping. Added an explicit management knowledge-gap discussion because the reviewed AIFM1-associated Bieganski/SMD-H sources define phenotype, diagnosis, and limited natural history but do not establish disease-specific treatment or disease-modifying therapy. Schema, term, reference, full-file, and history validation were run for the edited disorder.

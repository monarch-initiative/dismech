  summary: 'Genetics pass: wire every MKS locus to its gene on the subtype rows, add
    NPHP3 and KIF14 rows'
  details: |
    Genetics pass for the d2g wiring-013 gap job (issue #12202). Research first: confirmed from the committed Bookshelf index that no GeneReviews chapter covers Meckel syndrome (recorded with its re-runnable query in notes:), then worked from the locus-to-gene series stated in PMID:23349226's introduction, the per-gene defining reports the entry already cited, and the ClinGen ciliopathy gene-validity assertions.

    The entry's pathophysiology was already well wired: eight nodes carried gene bindings covering 14 genes. The gap was the twelve has_subtypes rows, every one of which was a bare name plus a MONDO term with no description, no gene and no evidence.

    Changes:
    - Gave every numbered subtype row a description, a genes binding and evidence: MKS1, TMEM216 (2), TMEM67 (3), CEP290 (4), RPGRIP1L (5), CC2D2A (6), TCTN2 (8), B9D1 (9), B9D2 (10), TMEM231 (11), TMEM107 (13), TXNDC15 (14). Types 1-10 are backed by the locus series quoted from PMID:23349226 (tagged quote_role BACKGROUND, since it sits in that paper's introduction) plus each gene's own defining report; 11, 13 and 14 by their own reports.
    - Added two subtype rows the entry was missing, both MONDO descendants of its own anchor: NPHP3-related Meckel-like syndrome (MONDO:0009966, the MKS7 locus) and lethal fetal cerebrorenogenitourinary agenesis/hypoplasia syndrome (MONDO:0014552, OMIM's MKS12).
    - Added KIF14 (hgnc:19181) to genetic:, the one MONDO-recorded Meckel gene the entry did not carry at all.
    - Recorded the nosological caveat on the KIF14 row and in its genetic notes: the report that defined the entity described it as "not diagnostic of any known condition" and did not report the encephalocele-plus-polydactyly triad, and the only cached report placing KIF14 in a Meckel diagnosis reads it as digenic with a TMEM67 deletion (graded directness INDIRECT).
    - Added ClinGen evidence for the two genes ClinGen grades below Definitive (B9D2 Moderate, TXNDC15 Strong), each with an explanation saying the assertion is against the broad ciliopathy entity rather than against Meckel syndrome, and graded directness INDIRECT for that reason.
    - Added review_notes to TMEM17 and KIF7 explaining why neither gets a subtype row: no numbered locus, no MONDO Meckel term, and for KIF7 a modifier-strength claim.
    - Set relationship_type/variant_origin on all sixteen genetic entries.

    Validation: just validate (105/105 snippets), validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, list-gene-term-mismatches all clean.

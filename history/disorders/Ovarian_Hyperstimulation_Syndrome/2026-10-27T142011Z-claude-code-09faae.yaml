  summary: Wire phenotypes into the pathograph and refine two bindings after review
  details: |
    Addresses the non-blocking suggestions in the review of f6d9278e19. Phenotypes were not reached by any causal edge (0 of 26). Added downstream edges from the six consequence nodes whose descriptions already state they produce the phenotype: Ovarian Enlargement and Multicystic Change to Enlarged Multicystic Ovaries, Ovarian Cysts, Abdominal Pain, Nausea and Vomiting; Adnexal Torsion and Ovarian Infarction to Ovarian Torsion and Pelvic Pain from Adnexal Torsion; Third-Space Fluid Shift and Intravascular Volume Depletion to Ascites, Intravascular Hypovolemia, Hemoconcentration, Abdominal Distension, Rapid Weight Gain and Hypoalbuminemia; Hypercoagulability and Thromboembolism to Hypercoagulability and Thromboembolism; Renal Hypoperfusion and Oliguria to Oliguria and Acute Kidney Injury; Pleural Effusion and Respiratory Failure to Pleural Effusion, Respiratory Failure, Dyspnea and Acute Respiratory Distress Syndrome. The third-space edges cite PMID:10923741 (third space fluid shift leading to the listed findings) and the enlargement-to-symptom edges cite PMID:22065820 (enlargement of the ovaries causes abdominal pain, nausea and vomiting). 21 of 26 phenotypes are now connected; Leukocytosis, Hyponatremia, Hyperkalemia, Hepatic Involvement in Severe Disease and Increased Serum Estradiol are left unwired because no node in the entry is stated to produce them. The GnRH antagonist treatment's therapeutic_agent moves from NCIT:C1910 Gonadotropin-releasing Hormone Analog, which also covers agonists, to NCIT:C2092 Gonadotropin Releasing Hormone Antagonist (runoak -i ols:ncit search 'l~gonadotropin-releasing hormone antagonist'). GO:0019221 cytokine-mediated signaling pathway was removed from the organism-scale Inflammatory Cytokine Amplification node, whose evidence measures plasma and ascitic cytokine levels rather than cellular signalling. Validated: count-verified-snippets 186/186, just validate, check-entity-refs, check-causal-targets, check-enum-values, check-reference-titles, test_snippet_grading and test_causal_targets.

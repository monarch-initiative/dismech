  summary: 'Create: Ovarian Hyperstimulation Syndrome'
  details: |
    New entry created for issue #7837, the obstetric/gynaecologic coverage gap.
    Ovarian hyperstimulation syndrome was absent from kb/ (verified: no file, no
    use of MONDO:0011972 anywhere in the KB) and appears on that issue's
    benign-gynaecology list.

    Modelling. The entry is built around a single physiological lesion, which is
    what the mechanism literature says the disease is: supraphysiological
    multifollicular recruitment -> hCG-driven luteinization of the enlarged
    cohort -> ovarian VEGF-A hypersecretion -> VEGFR-2 activation on vascular
    endothelium -> increased systemic vascular permeability. Below that node the
    chain fans into third-space fluid shift (with separate compartment-compromise
    and volume-depletion arms), renal hypoperfusion, and thromboembolism. A
    second trigger node, "Promiscuous FSH Receptor Activation by hCG or
    Thyrotropin", carries the spontaneous form and converges on the same
    recruitment node; it keeps the two germline FSHR mutant classes separate
    (transmembrane-helix variants: constitutively active, hCG- and
    TSH-responsive; the single extracellular-domain variant p.Ser128Tyr: gains
    hCG affinity with neither constitutive activity nor TSH responsiveness),
    because collapsing them would assert a molecular mechanism the primary
    functional data contradict.

    Load-bearing judgements, recorded rather than left implicit:

    - Module conformance to `thrombogenesis` is claimed at two nodes only,
      "Virchow-Triad Prothrombotic Context" (hemoconcentration) and "Pathological
      Fibrin-Platelet Thrombus Formation" (thromboembolism). The
      coagulation-cascade node is deliberately NOT claimed: PMID:25014487 states
      that no single standard test estimates the thrombotic state and that the
      role of thrombophilia markers is controversial, so a thrombin/fibrin-level
      mechanism is not evidenced here. The reasoning is in the node's `notes:`.
    - The hemoconcentration -> thromboembolism edge is typed
      INDIRECT_KNOWN_INTERMEDIATES rather than DIRECT for the same reason.
    - The cytokine arm ("Inflammatory Cytokine Amplification") is curated as a
      node with an ALTERNATIVE hypothesis group, and its edge into the
      permeability node is typed UNKNOWN. The human evidence is correlative
      (IL-1/IL-6/TNF-alpha rise and fall with the clinical course, IL-6 and IL-8
      concentrated in ascites) and no interventional study has tested it, so two
      evidence items are recorded as PARTIAL rather than SUPPORT, matching the
      authors' own "suggest close association" and "may mediate" wording.
    - `modifier: GAIN_OF_FUNCTION` is used on the FSH-receptor molecular function
      because the claim is qualitative (the receptor responds to ligands it
      should not respond to at all), not that normal FSH signalling runs high.
    - The ovarian renin-angiotensin account is recorded as a named ALTERNATIVE
      hypothesis with no corresponding causal edge, since the cited review lists
      it among discussed mediators rather than demonstrating a role.

    Models. The PMSG/hCG-hyperstimulated Wistar rat is curated as an
    `animal_models` entry with `modeled_mechanisms` links: RECAPITULATES
    (MODERATE fidelity) the permeability node with two readouts - the 48 h
    permeability/VEGF-mRNA peak, and a RESTORED readout for SU5416 VEGFR-2
    blockade - and MEASURES the VEGFR-2 node with a cabergoline phosphorylation
    readout plus an UNCHANGED readout for the negative VEGF/VEGFR-2 mRNA result.
    That this one model carries nearly the entire causal weight of the canonical
    mechanism is recorded as a HUMAN_MODEL_MISMATCH discussion, quoting the
    paper's own statement that the decisive receptor-blockade experiment cannot
    be repeated in women because SU5416-class compounds are thromboembolic and
    disrupt the angiogenesis a pregnancy requires.

    Treatments all attach to specific nodes via `target_mechanisms`: cabergoline
    INHIBITS the VEGFR-2 node; GnRH agonist trigger and freeze-all both INHIBIT
    the hCG-luteinization node but via the exogenous and endogenous hCG sources
    respectively; the GnRH antagonist protocol MODULATES the recruitment node;
    paracentesis INHIBITS the compartment-compromise node; heparin INHIBITS the
    thromboembolism node; supportive care MODULATES the volume-depletion node.

    Three discussions besides the model mismatch: a KNOWLEDGE_GAP on the report
    that hCG is no longer considered necessary for OHSS (which the entry's
    committing node assumes), a CONTROVERSY on cabergoline reducing moderate but
    not severe disease across only 2 RCTs and 230 women, and an OPEN_QUESTION on
    whether the cytokines are cause or consequence.

    Deliberate omissions, stated in the entry `notes:`: no `stages` block
    (severity grading is described in the literature but the cached abstracts do
    not carry threshold values, and inventing them would be fabrication), and no
    `biochemical` block (haematocrit, oestradiol and IL-6 are curated as
    phenotypes because the available snippets report them as characteristics
    rather than with reference intervals). No deep-research provider report was
    generated or consumed, so none is cited and none exists under `research/`.

    Two label alignments were needed against the term cache: GO:0005021 and
    HP:0001974 are curated with the cached canonical labels
    ("vascular endothelial growth factor receptor activity",
    "Increased total leukocyte count"), matching the 26 existing KB uses of the
    latter. Note that OLS4 currently reports a newer label for GO:0005021
    ("vascular endothelial growth factor-activated receptor activity"); the
    cache row dates from 2026-03 and the divergence is upstream drift, not
    corruption - flagged here rather than worked around by hand-editing the
    cache.


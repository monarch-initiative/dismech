  summary: 'Review response: address 6 IMPORTANT + 4 suggestions on PR #9486'
  details: |
    Review response for PR #9486 (Ovarian Hyperstimulation Syndrome). Addressed all 6 IMPORTANT
    findings and all 4 suggestions from the automated review.

    IMPORTANT 1 - Hemoconcentration phenotype added, bound to HP:0001899 Increased hematocrit, using
    the PMID:26506672 eight-sign snippet already verified in this file, plus a second PMID:34644798
    item for the admission/rehydration consequence. Description records that the haematocrit rises
    because plasma is lost, not because red cell mass increases.

    IMPORTANT 2 - HP:0002098 Respiratory distress -> HP:0002878 Respiratory failure. The phenotype
    name, preferred_term and snippet all said "failure"; only the binding said "distress".

    IMPORTANT 3 - HP:0002027 Abdominal pain -> HP:0034267 Pelvic pain on the adnexal-torsion
    phenotype, so it no longer collapses onto the separately curated ascites-related abdominal
    distension.

    IMPORTANT 4 - Three treatments added. (a) "Secondary Prevention by Coasting, Cycle Cancellation
    or Freeze-All", using the PMID:24848075 snippet the reviewer identified, linked by
    target_mechanisms to the new luteinization node; its notes distinguish primary prevention
    (protocol choice before the response is known) from secondary. (b) "Elective Embryo or Oocyte
    Cryopreservation (Freeze-All)" curated separately because it is the only one with its own NCIT
    identity and because its mechanism is specifically temporal - it does not prevent early OHSS at
    all. (c) "Thromboprophylaxis" with two new references. The Hypercoagulability node prose was
    ALSO rewritten: it previously asserted thromboprophylaxis was standard management without
    modelling it, and it now records both the treatment link and the fact that PMID:36588288 found
    VTE attributable to OHSS at <0.001% with the OHSS increment not statistically significant
    (RR 14.83, 95% CI 0.86-255.62). The practice rests on consequence severity, not effect size.

    IMPORTANT 5 - clinical_trials section added with 5 trials, phase/status verified against the
    ClinicalTrials.gov v2 API (not guessed) and written as enum keys: NCT03996434 (PHASE_IV/COMPLETED,
    coasting vs GnRH antagonist), NCT02670304 (PHASE_IV/COMPLETED, letrozole), NCT02392520
    (NOT_APPLICABLE/UNKNOWN, GnRH antagonist in ESTABLISHED severe early OHSS - curated specifically
    because it addresses the evidence gap this entry's ohss_established_disease_evidence_base
    discussion names), NCT06333691 (NOT_APPLICABLE/COMPLETED, cabergoline comparators), NCT03794037
    (PHASE_II/SUSPENDED, montelukast - curated as a negative datum about the field). Two further NCTs
    the review listed (NCT04351126, NCT05198128) were fetched, read and NOT curated: 04351126 is a
    single-investigator "defective mineralocorticoid response" hypothesis trial whose premise
    contradicts the curated VEGF pathograph, and 05198128 has no phase and a calcium-infusion
    protocol with no mechanistic link to any node here. Their cache files were deleted rather than
    committed unused.

    IMPORTANT 6 - Both bundled nodes split.
    - "Multifollicular Recruitment and Luteinization" -> "Multifollicular Recruitment" (TISSUE, FSH-
      driven, the node AMH/AFC/oestradiol actually measure) -> "hCG-Driven Luteinization of the
      Recruited Cohort" (TISSUE, LH-like-signal-driven). The GnRH-agonist-trigger treatment was
      retargeted from Ovarian VEGF Hypersecretion to the luteinization node, which is where it acts;
      the reviewer correctly identified the mislink as a symptom of the bundling.
    - "VEGFR-2 Activation and Increased Vascular Permeability" -> "VEGFR-2 Activation on Vascular
      Endothelium" (MOLECULAR) -> "Increased Systemic Vascular Permeability" (TISSUE). Cabergoline
      retargeted to the MOLECULAR node, since its evidence is specifically about VEGFR-2
      phosphorylation.
    Graph re-checked directed after both splits: 15 nodes, 15 edges, 3 MOLECULAR roots, nothing
    dangling, nothing unreachable.

    SUGGESTION 7 - The notes rationale was factually wrong and is corrected IN PLACE rather than
    silently: PMID:27273307 does contain a quotable AMH/dendritic-cell/interleukin sentence, and it
    is now curated as PARTIAL evidence on the Increased Systemic Vascular Permeability node, where it
    qualifies the claim that the leak is a pure VEGF effect. It is deliberately NOT given its own
    node - "explored recently as contributors" supports a hedge, not a causal chain. The notes now
    state that the earlier claim was wrong.

    SUGGESTION 8 - progression section added with Early OHSS and Late OHSS phases, anchored on
    PMID:10785214 (Mathur 2000, the classic distinction paper) and PMID:18956797. Records that early
    OHSS is predicted by preovulatory oestradiol and oocyte number while late OHSS is not, that late
    OHSS is likelier to be severe, and that late OHSS is the arm freeze-all abolishes.

    SUGGESTION 10 - LHCGR added to genetic with relationship_type UNKNOWN, explicitly NOT as a causal
    gene. Its notes explain the mechanistic contrast the entry depends on: in iatrogenic OHSS hCG acts
    on its own receptor, whereas in the familial form the whole point is that hCG acts on a mutant
    FSHR whose ligand specificity is lost. relationship_type UNKNOWN was chosen because the enum has
    no value for "mechanistic participant with no disease-causing role", and UNKNOWN is honest where
    CAUSATIVE/RISK_FACTOR/MODIFIER would all be false.

    SUGGESTION 9 - abdominal distension and nausea added; hepatic transaminase elevation was NOT
    added because no cited source states it and the only mention was in the DR report's
    internal-citation-key prose, which cannot be verified.

    TOOLING DEFECT FOUND AND SELF-CAUGHT. An in-place edit inserted the LHCGR genetic block without a
    preceding newline, so "- name: LHCGR" was folded into the previous evidence explanation scalar and
    the block's remaining keys (gene_term, relationship_type, presence, notes, evidence) silently
    became DUPLICATE KEYS on the FSHR entry - overwriting FSHR's gene_term with hgnc:6585. Both
    linkml-validate and just validate-terms PASSED on the corrupted file, exactly as CLAUDE.md's
    duplicate-key section warns (PyYAML safe_load keeps the last value). just check-duplicate-keys
    caught it: "5 duplicate key(s) across 1 file(s)". Fixed, re-verified (genetic entries now
    ['FSHR','LHCGR'], FSHR gene_term back to hgnc:3969), and recorded here because it is a concrete
    instance of the failure mode that section exists to prevent.

    VALIDATION AFTER CHANGES (all run to completion, output quoted).
    - just validate-disorders kb/disorders/Ovarian_Hyperstimulation_Syndrome.yaml
        -> "All 1 disorder file(s) passed validation."
    - just count-verified-snippets -> "Snippets checked: 111/111 verified against cached references"
    - just validate-terms -> "Validation passed"
    - just check-duplicate-keys (whole KB) -> "OK: no duplicate mapping keys in 4361 YAML file(s)."
    - just check-title-snippets -> "OK: no new title-quoting snippets"
    - scripts/check_snippet_length.py --against-ref origin/main -> "OK: no new snippets under 5 words"
    - just compliance -> Global Compliance 91.1% (235/258), Weighted 91.0% (was 92.2%/92.1%; the fall
      is arithmetic, not regression - the added clinical_trials and progression sections introduce
      new recommended-but-unfilled slots)
    One snippet was initially quoted from a trial's TITLE (NCT06333691, whose registry record I first
    believed had no body text). It failed verification, the cached record turned out to have a
    substantive body, and the snippet was replaced with two body quotes instead - a better outcome

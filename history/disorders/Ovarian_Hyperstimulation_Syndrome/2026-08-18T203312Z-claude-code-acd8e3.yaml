  summary: 'Address review of PR #8417: CI blocker, unevidenced GO term, phenotype
    sourcing'
  details: |
    Review-response pass on PR #8417 (reviewer: ai4c-reviewer, CHANGES_REQUESTED
    2026-08-13). Six findings addressed; two answered rather than changed.

    CRITICAL finding 1 - CI blocker. `scripts/check_folded_hyphens.py` rejected the
    `Intravascular Volume Depletion and Hemoconcentration` description, whose folded
    scalar broke after "total-" and so rendered as "total- body fluid overload".
    Reflowed so "total-body" stays on one line. This mattered beyond the typo: the
    gate runs before `just qc` / `validate-disorders` / pytest, so none of the
    schema, term or reference validation had ever executed on this branch. It now
    passes ("no new folded-scalar hyphen splits").

    IMPORTANT finding 2 - unevidenced GO annotation contradicting the entry's own
    position. The hemoconcentration node carried GO:0002016 (regulation of blood
    volume by renin-angiotensin) with `modifier: INCREASED` and no evidence, while
    the entry's `ovarian_renin_angiotensin` hypothesis states outright that no node
    asserts a renin-angiotensin causal edge. Removed. The rejection and its reason
    are written into the node description rather than left as a silent deletion, so
    a later curator does not re-add it: the annotation would have asserted as
    canonical node biology exactly what the ALTERNATIVE hypothesis disclaims, and it
    is in any case the wrong descriptor for a node about plasma loss and rising
    haematocrit.

    IMPORTANT finding 3 - evidence that did not support its phenotype. The
    `Abdominal distention` phenotype cited PMID:21082501 with a generic
    disease-definition snippet whose own `explanation` conceded the abstract does
    not name the sign (CLAUDE.md section 6, structurally valid and substantively
    empty). Replaced with PMID:27343272, the consensus classification working group,
    which names "lower abdominal discomfort or distention, nausea, vomiting and
    diarrhea" as the complaints that trigger the OHSS diagnostic flow diagram, plus
    PMID:10923741 which records abdominal distension as an observed finding.

    IMPORTANT finding 4 - ten of twenty phenotypes carried no evidence. All ten are
    now evidenced; every phenotype in the entry carries at least one item. Six new
    references were fetched with `just fetch-reference`. Where a clinical series
    exists it is preferred over a review enumeration:

    - PMID:10201472 - prospective series of 50 consecutive patients with severe
      disease and ascites - Oliguria, Hyponatremia. The paper places both in the
      neurohormonal sodium-retention response rather than in primary electrolyte
      loss or intrinsic tubular injury, which is recorded in the explanations.
    - PMID:10923741 - ten ICU admissions with severe disease - Hypoalbuminemia,
      Abdominal pain, Abdominal distention, Pleural effusion (as hydrothorax),
      Increased body weight.
    - PMID:22065820 - Abdominal pain, Nausea and vomiting, Ovarian cyst. Attributes
      pain and vomiting to the ovarian enlargement rather than to the fluid shift,
      which is why they appear in mild disease before any ascites.
    - PMID:26506672 - Oliguria, Hyponatremia, Hyperkalemia, Increased body weight,
      Pleural effusion.
    - PMID:7547731 - Ovarian torsion, evidenced through its status as one of only
      two indications for surgery in an otherwise medically managed condition.
    - PMID:27343272 - Abdominal distention, Nausea and vomiting.

    Two honest limits are recorded in `notes:` rather than smoothed over.
    Hyperkalemia rests on a review enumeration alone (PMID:26506672, "Clinical signs
    may include any or all of the following"); no cohort measurement of it was
    found, and the explanation says so. Pleural effusion is evidenced through the
    older term hydrothorax; that synonymy is stated in the phenotype `description`
    rather than left for a reader to infer from the snippet. `frequency:` remains
    absent throughout - the reviewer confirmed omission is the correct call given no
    quotable frequency data, and nothing found in this pass changes that.

    SUGGESTION 6 - overstated snippet. The `Supraphysiological Multifollicular
    Recruitment` target_mechanisms edge cited PMID:35292717 with the six-word
    fragment "and lower number of retrieved oocytes" and claimed the protocol
    "yields a measurably smaller recruited cohort". The paper's primary pooled
    analysis found no difference (WMD -1.13, P = 0.26); the significant -1.82
    appears only after excluding a high-risk-of-bias trial and is GRADE low quality.
    Replaced with two items: a SUPPORT item quoting the authors' own account, which
    locates the difference at the pattern of gonadotropin suppression during the
    early follicular phase (matching the existing `MODULATES` typing), and a PARTIAL
    item quoting the null primary result, retained deliberately as a limit on the
    claim. The edge no longer asserts that fewer follicles are recruited.

    SUGGESTION 7 - term specificity. Freeze-All moved from the generic
    `NCIT:C49236 Therapeutic Procedure` to `NCIT:C16475 Cryopreservation`. Label
    confirmed with OAK; enum membership confirmed by validation, which added the
    CURIE to the TreatmentActionTerm membership cache, so it is genuinely reachable
    from NCIT:C25218 rather than assumed to be.

    SUGGESTION 9 - PCOS as the major risk factor. This was already curated: the
    recruitment trigger node carries PMID:21082501's "some are considered major risk
    factors such as polycystic ovary syndrome" and PMID:31097257's risk-factor
    sentence. Added a third independent source, PMID:7547731, chosen because it
    enumerates the risk factors in exactly the arrangement this entry models them -
    the host over-recruitment trait at the recruitment node, and the two separable
    hCG sources (exogenous trigger, endogenous pregnancy hCG) at the downstream
    luteinization node. The Disease class has no `comorbidities` slot, so a
    structured predisposing-comorbidity record is not currently representable; the
    trigger-node evidence is the available form.

    SUGGESTION 8 - not actioned. The `Spontaneous OHSS` subtype still has no
    `disease_term`. MONDO:0011972 is the only OHSS term, and `disease_term` is bound
    to an enum reachable only from MONDO roots, so the suggested OMIM:608115 cannot
    go in that slot. Left for a maintainer.

    IMPORTANT finding 5 - no deep-research artifact. Still none, and still disclosed
    in `notes:`. The reviewer raised it as important-not-critical and tied it
    explicitly to finding 4; finding 4 is now closed from primary literature and
    clinical series rather than from a DR report, so the concern it stood proxy for
    is addressed. No DR provider was run in this session. Whether the
    new-entry-needs-a-DR-report rule should be waived here remains a maintainer
    call, and is asked as such on the PR rather than assumed.

    Validation. `just validate` passes schema, term and reference validation with
    "Snippets checked: 96/96 verified against cached references" (up from 78).
    `check_folded_hyphens.py --check`, `check-cache-order`,
    `check-term-cache-integrity` and `check-reference-cache-frontmatter` all clean.
    `check-title-snippets` reports five findings, none in this file - they are
    pre-existing entries whose baseline moved on main after this branch forked, the
    staleness artifact described in issue #8434; the branch was refreshed against
    main to clear it. Cache diffs are additive only: one row in
    cache/ncit/terms.csv, one in the TreatmentActionTerm enum cache, six new
    references_cache files.

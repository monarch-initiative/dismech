  details: |
    Fifth review response for PR #9486. All 4 IMPORTANT findings and all 4 suggestions addressed.

    IMPORTANT 1 - GO:0002001 was a false match on the new ovarian RAS node. The reviewer is right and
    the check I failed to make is the one I have been making elsewhere: the GO definition is release of
    renin into the BLOOD by JUXTAGLOMERULAR cells, which contradicts both the compartment (local,
    intra-ovarian; renin measured in follicular fluid) and the cell type (granulosa cell) recorded in
    the same node block. Term removed. The node now carries free-text `preferred_term: intra-ovarian
    renin secretion` with no `term:`, and the node description records the search, the reason, and the
    NTR case - GO has a local-RAS precedent in GO:0002035 (brain renin-angiotensin system) but no
    ovarian analogue.

    IMPORTANT 2 - metformin's second evidence item was an argument from silence. Replaced with the
    on-point sentence the reviewer located, which names metformin directly and at HIGH grade, and
    retagged REFUTE rather than PARTIAL since it states the negative outright. The reviewer also spotted
    that ALBUMIN's description made the same "not among the effective agents" claim with no source at
    all; the same sentence names albumin too and is now cited there.

    IMPORTANT 3 - aspirin curated, and the calcium description corrected. This was round-3 finding 3
    and it fell through because rounds 3 and 4 landed against the same commit. The reviewer's framing
    is right: aspirin had strictly better standing in this entry's own sources than metformin, which was
    curated - RR 0.07 (the largest point estimate in either analysis), rank probability 36% AHEAD of
    calcium's 35%, a quotable COX-1 mechanism, and the identical cross-NMA discordance. New treatment
    with four evidence items including the REFUTE from Wu 2022.

    The calcium description said "the most effective prophylaxis available", which the entry's own
    quoted snippet contradicted twelve lines below by ranking aspirin above it. Rewritten to
    "best-supported", with the distinction stated explicitly: calcium is effective in BOTH analyses at
    high GRADE, whereas aspirin is graded LOW in the second and placed among the agents that did not
    work. The "concordant ranking" explanation on the calcium item was likewise corrected to say
    concordant on effectiveness, not on rank.

    IMPORTANT 4 - the RAS node's "sources are hedged" premise. PMID:18956797, already in the reference
    block, calls the ovarian RAS "clearly central to the pathogenesis" - not hedged. Rather than
    silently drop the premise or upgrade the node, the description now records BOTH: the two mechanism
    sources hedge, a third does not, and the third is PARTIAL because it asserts this in a single
    background sentence in a paper about embryo freezing with no supporting data. mechanism_confidence
    stays PROVISIONAL, and the reasoning for that is now visible rather than resting on a claim the
    reference set contradicts. The reviewer's caution about the cache extraction artifact was
    well-placed: the cached text reads "reninangiotensin" without the hyphen, and the snippet is quoted
    exactly as cached - not corrected, and the cache not touched.

    SUGGESTION 5 taken - HES SMALL_MOLECULE -> OTHER (polysaccharide colloid), Albumin
    PROTEIN_REPLACEMENT -> OTHER (volume expander, not replacement of a deficient protein). Reasoning
    recorded in the albumin notes so the distinction from genuine enzyme/factor replacement is legible.

    SUGGESTION 6 attempted and DECLINED on evidence. NCIT:C65218 "Albumin (Human)" exists with the
    right label, but `runoak ancestors -p i` places it under NCIT:C17021 Protein / NCIT:C26548 Gene
    Product - NOT under NCIT:C1909 Pharmacologic Substance - so it is unreachable from either root of
    the ChemicalEntityTerm enum and validate-terms rejects it. I searched for a live substitute: NCIT's
    other albumin concepts are measurements (C61015), radiolabelled imaging agents (C2557, C29127) or
    non-human (C85253), and CHEBI offers only the class term CHEBI:166964 "albumin type". The agent is
    therefore left with free-text preferred_term and no binding, with the whole search recorded in the
    treatment notes. This is the SECOND time in this session that a term verified as existing turned
    out not to be enum-reachable, which is the substance of the issue I filed as #9495.

    SUGGESTION 7 taken, and extended. PMID:35079118 and PMID:38487201 added to the top-level
    references. Applying the same completeness check found the five clinicaltrials: references were
    also cited in evidence but absent from that block; all five added. A programmatic check now reports
    zero cited references missing from references[], and all 24 entries carry a title.

    SUGGESTION 8 taken - Vomiting (HP:0002013) and Dyspnea (HP:0002094) added, both from the severe-
    symptom sentence in PMID:35079118. Each description says what the phenotype adds beyond its
    neighbours rather than restating the quote.


  summary: 'Review response round 2: NMA treatments, models, term fixes on PR #9486'
  details: |
    Second review response for PR #9486 (Ovarian Hyperstimulation Syndrome). All 5 IMPORTANT findings
    and all 5 suggestions addressed.

    IMPORTANT 1 - Nausea evidence replaced. The old snippet ("When OHSS occurs, it can usually be
    managed as outpatient care") supported nothing about nausea; the reviewer was right that a snippet
    supporting nothing should not be carried even as PARTIAL. Replaced with two PMID:35079118 quotes,
    one naming persistent nausea among severe symptoms and one placing nausea in the operative
    definition of MODERATE OHSS - the second being the more useful, since it shows nausea functioning
    as a severity criterion rather than an incidental symptom.

    IMPORTANT 2 - Abdominal Distension re-sourced. Primary evidence is now the direct PMID:35079118
    observation ("accompanied by abdominal bloating and mild abdominal pain"); the transudation quote
    is retained but downgraded to PARTIAL with an explanation saying its support is mechanistic, not
    observational.

    IMPORTANT 3 - Risk Stratification rebound from NCIT:C15747 (Supportive Care) to NCIT:C15843
    (Preventive Intervention). The reviewer's diagnosis was exact: Supportive Care is symptom-directed
    care of established illness, so it validated while being misleading. I confirmed independently
    that NCIT:C15367 Health Risk Assessment - the exact concept - is not reachable from NCIT:C25218
    and would fail the enum, and recorded that in the treatment's notes so the next curator does not
    retry it.

    IMPORTANT 4 - Both network meta-analyses now cited, and four treatments added: intravenous calcium
    (RR 0.14, GRADE high, SUCRA 92.4% - ranked ABOVE cabergoline), hydroxyethyl starch (RR 0.25),
    metformin (RR 0.20 in one analysis, absent from the other's conclusion - the discordance is
    recorded), and albumin, curated specifically BECAUSE its signal is negative (pregnancy rate RR
    0.85, 95% CI 0.74-0.97, tagged supports: REFUTE).

    Two mechanical points from this. First, I resolved both DOIs to PMIDs (35154015, 26752241) rather
    than citing them as DOIs, because DOI: is in skip_prefixes: while they were DOI references,
    count-verified-snippets reported "9 skipped by prefix" - nine snippets silently unchecked. Keying
    to PMID moved all nine into the checked set. Second, calcium is deliberately NOT given a
    target_mechanisms link: its proposed action is via the ovarian renin-angiotensin arm, which this
    entry does not curate for want of a verifiable source, and inventing a target to satisfy a link
    would be worse than leaving the treatment unlinked. Stated in the treatment description.

    IMPORTANT 5 - Three models added with modeled_mechanisms and readouts: the SVOG human
    granulosa-lutein line (experimental_models, PERTURBS the EGR1-TIE1 node, two readouts), the
    induced-OHSS rat with Tie1 knockdown (animal_models, RESCUES, two readouts), and the
    prolactin-supplemented cabergoline rat (animal_models, PERTURBS the VEGFR-2 node, three readouts
    including a deliberate UNCHANGED negative for luteal safety). The PROVISIONAL EGR1-TIE1 node now
    has its evidence base recorded structurally with stated fidelity and limitations instead of only
    narrated in a discussion.

    While doing this I found - and fixed - a problem the reviewer had not flagged: two PMID:35079118
    sentences each describe a cell-line result AND a rat result in one sentence, so quoting the whole
    sentence forced the same snippet to carry both IN_VITRO and MODEL_ORGANISM. Rather than pick one,
    I split each quote at the clause boundary so each evidence item quotes only its own system. A
    whole-document checker now reports zero (reference, snippet) pairs carrying more than one
    evidence_source.

    SUGGESTION 6 - LHCGR moved out of genetic: and onto the hCG-Driven Luteinization node as a genes:
    annotation. The reviewer was right that relationship_type: UNKNOWN with no LHCGR-specific evidence
    was signalling the entry did not belong in genetic:. The mechanistic contrast it existed to mark
    is preserved in the entry notes.

    SUGGESTION 7 - therapeutic_modality corrections: paracentesis DEVICE -> SURGERY, freeze-all
    DEVICE -> OTHER (a protocol decision, not a device), thromboprophylaxis SMALL_MOLECULE -> OTHER
    (LMWH is a polysaccharide, as the reviewer noted).

    SUGGESTION 8 - freeze-all de-duplicated. The grouped entry is renamed "Secondary Prevention by
    Coasting or Cycle Cancellation" and its description now explains why cryopreservation is curated
    separately rather than folded in: it acts at a different time and on a different arm, preventing
    only the LATE form driven by endogenous pregnancy hCG.

    SUGGESTION 9 - hepatic involvement added, but bound to HP:0031865 Abnormal liver physiology rather
    than the suggested HP:0002910. The transaminase figure the reviewer cites comes from DR prose with
    internal citation keys; no source cited on this entry states it. The verifiable quote says severe
    forms are "accompanied by electrolyte disturbances and cardiopulmonary, hepatic, renal, and
    hemoconcentration", which supports hepatic involvement but not a specific laboratory abnormality.
    The reasoning is recorded in the entry notes.

    SUGGESTION 10 - "Supportive Care and Therapeutic Paracentesis" split into two treatments, so
    paracentesis keeps NCIT:C15310 and supportive care keeps NCIT:C15747 where that term IS correct.

    TOOLING DEFECT FOUND. NCIT:C102744 "Hydroxyethyl Starch" is a RETIRED concept (ancestors:
    NCIT:C104171 Retired Concept 2012 -> NCIT:C28428 Retired Concept) and is not reachable from
    NCIT:C1909 Pharmacologic Substance, so just validate-terms rejected it. The live term is NCIT:C559
    Hetastarch. The stale label-cache row for the retired CURIE was removed from cache/ncit/terms.csv
    so the committed cache carries only rows this entry actually uses; check-term-cache-integrity and
    check-cache-order both pass afterwards.

    VALIDATION AFTER CHANGES (all run to completion, output quoted).
    - just validate-disorders -> "All 1 disorder file(s) passed validation."

  summary: 'Create: Ovarian Hyperstimulation Syndrome (MONDO:0011972)'
  details: |
    De-novo creation of the Ovarian Hyperstimulation Syndrome entry for MONDO:0011972 (claim issue #9438).

    ENTRY TYPE DECISION. The stub carried no mondo_descendant_count (leaf) and named FSHR. Direct
    inspection of MONDO:0011972 shows the term is internally conflated: its def: is the MeSH
    definition of the iatrogenic complication of ovulation induction, while its OMIM xref (608115),
    its RO:0004003 FSHR gene association, and its is_a MONDO:0003847 hereditary disease parent all
    belong to the rare familial gestational spontaneous form. Curated as a single kb/disorders/
    Disease with two has_subtypes (Iatrogenic OHSS, Familial Spontaneous OHSS), because both routes
    converge on one conserved pathograph: multifollicular luteinization -> ovarian VEGF
    hypersecretion -> VEGFR-2-mediated capillary leak -> third-spacing. A third trigger node covers
    promiscuous activation of the WILD-TYPE receptor (multiple/molar pregnancy, hypothyroidism,
    FSH-secreting adenoma), which belongs to neither subtype. Rationale recorded in the entry notes.

    DEEP RESEARCH. just research-disorder falcon Ovarian_Hyperstimulation_Syndrome (Edison, 659s).
    Report reference_validation: 7/7 references resolved, confabulation_rate 0.0, 0 unresolved, 0
    off topic. NEC preflight (just preflight-dr ... MONDO:0011972) returned WARN: FSHR=29 mentions
    (canonical gene, dominant) with LHCGR=20 flagged as a rival. Assessed as a false positive of the
    gene-frequency heuristic rather than a wrong-entity report -- LHCGR is the LH/choriogonadotropin
    receptor, a genuine co-actor in the same syndrome (hCG acts on it), and the other top genes
    (TIE1, KDR, VEGFA) are the angiogenic mediators of the same mechanism, not a second disease. No
    sections were excluded. Independently, the report cites Edison-internal keys rather than PMIDs,
    so no citation from it could be curated directly; it was used only as a lead list. Every PMID in
    this entry was found by direct PubMed E-utilities search and fetched with just fetch-reference.

    WHAT WAS CURATED. 13 pathophysiology nodes (3 MOLECULAR trigger roots; every non-root reachable
    from a root on a directed walk; scales MOLECULAR 5 / TISSUE 3 / CELLULAR 1 / ORGANISM 4),
    15 phenotypes, 2 subtypes, 1 inheritance block, 1 genetic block (FSHR, CAUSATIVE, GERMLINE),
    4 treatments (3 with target_mechanisms), 3 prevalence records, 2 diagnosis entries,
    3 discussions (2 KNOWLEDGE_GAP, 1 HUMAN_MODEL_MISMATCH), 1 dataset, 3 Harrison's chapters.
    81 evidence snippets across 11 PMIDs.

    JUDGEMENT CALLS.
    - PMID:12930927 (Vasseur NEJM 2003, the original FSHR/OHSS paper) has NO abstract in PubMed, so
      it could only have been cited by its title. Not cited. PMID:15080154 (Montanelli JCEM 2004)
      is used instead: it is the corrected republication of PMID:15001619 and its abstract restates
      the T449I/D567N findings, so the claim is carried by a quotable source.
    - The EGR1-TIE1 node (PMID:35079118) is curated as role: modifier / PROVISIONAL, not as a
      required step, because all its evidence is cultured cells, a granulosa-lutein cell line and
      rats; a HUMAN_MODEL_MISMATCH discussion records the translational gap in the authors' own words.
    - frequency: omitted on every phenotype -- the source (PMID:26506672) lists the clinical signs
      without per-sign proportions, so any band would have been invented.
    - Prevalence is recorded as PERIOD_PREVALENCE with cycle-based denominators and an explicit note,
      because the syndrome cannot occur without gonadotropin exposure or pregnancy and a
      general-population denominator would be meaningless.
    - Dataset triage: 3 candidates scored DIRECT; only geo:GSE183346 (OHSS mouse model) was kept.
      GSE229048 (ovine endometrium after FSH superovulation) and GSE39402 (epithelial ovarian tumour
      model) were rejected as Named Entity Confusion reached through dataset search -- both resolve
      perfectly and are about something else. Rejections recorded in the dataset notes.
    - "Risk Stratification Before Ovarian Stimulation" is deliberately NOT linked to a pathophysiology
      node: identifying a susceptible woman is clinical motivation, not a causal edge.
    - Not curated: the ovarian renin-angiotensin, IL-6/IL-8 and platelet-activating-factor arms --
      described in reviews but no primary source with a verifiable quotable statement was located.


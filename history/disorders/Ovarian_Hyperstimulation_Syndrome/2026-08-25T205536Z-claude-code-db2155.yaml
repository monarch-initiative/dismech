  summary: 'Review response 3: trial titles, evidence_source fix, curate the renin-angiotensin
    arm (#9486)'
  details: |
    Third review response for PR #9486. All 3 remaining IMPORTANT findings addressed.

    IMPORTANT 1 - reference_title on clinicaltrials evidence. All 7 items now carry it, taken from the
    title: frontmatter of the committed references_cache/clinicaltrials_NCT*.md files. The reviewer is
    right that this was raised in round 2 and not done; I read that finding as being about the
    top-level references: block, which already had titles, and did not check the inline evidence
    items. A whole-document check now reports 0 of 144 evidence items missing reference_title.

    IMPORTANT 2 - MODEL_ORGANISM on an in-vitro snippet. Correct on both counts, and the second count
    was the more useful one. The snippet quoted an SVOG cell-line result (human granulosa-lutein line,
    so IN_VITRO not MODEL_ORGANISM), and separately it did not attest that the RAT model is informative
    for the target node, which is what link-level evidence is for. Fixed by moving rather than
    relabelling: the PI3K/AKT sentence now sits on the SVOG experimental_models entry tagged IN_VITRO,
    and the rat link carries two genuinely rat, genuinely in vivo quotes instead - the histological
    methods statement naming the control/OHSS/knockdown arms, and "Tie1 silencing attenuates the
    progression of experimentally induced OHSS in rats."

    IMPORTANT 3 - the false scoping claim. This is the one that matters and the reviewer is right that
    it is a recurrence of round-1 finding 7: I asserted an absence of evidence without re-checking the
    references in hand, and the contradicting statements were in two files added by the very commit
    that made the claim.

    Rather than just delete the sentence, I curated the arm. New PROVISIONAL modifier node "Ovarian
    Renin-Angiotensin System Activation", wired from hCG-Driven Luteinization (gonadotropin stimulation
    raises follicular-fluid prorenin and renin) into Ovarian VEGF Hypersecretion
    (INDIRECT_KNOWN_INTERMEDIATES, since the angiotensin and ACE steps are named but proposed). Three
    evidence items, two of them PARTIAL because the sources hedge in their own wording.

    The consequence is that intravenous calcium - which ranks ABOVE cabergoline in both network
    meta-analyses - now has a target_mechanisms link with two evidence items, where in round 2 I had
    explicitly declined to give it one on the grounds that its target was not curatable. That
    declination is now shown to have been the wrong call, made for the right reason (not inventing a
    target) on a false premise (that no source existed).

    Both corrections are left VISIBLE in the entry notes rather than quietly edited away, because the
    defect class recurred and a future curator should see that it did.


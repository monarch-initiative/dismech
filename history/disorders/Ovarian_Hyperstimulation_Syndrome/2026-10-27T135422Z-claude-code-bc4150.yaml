  summary: Port this PR's unique content into the entry already on main (#9486)
  details: |
    PR 8417 and PR 9486 independently curated this disease under the same file. 9486 merged first and its entry is broader (16 nodes, 13 treatments, clinical trials, datasets), so it is kept as the base and this PR now adds only what 9486 lacks. Added: the Inflammatory Cytokine Amplification node with an UNKNOWN edge to Increased Systemic Vascular Permeability, the inflammatory_cytokine_mediation ALTERNATIVE hypothesis, and an OPEN_QUESTION discussion on whether cytokines drive or follow permeability (PMID:8671471, PMID:8224268); phenotypes Abdominal Pain, Acute Respiratory Distress Syndrome, Ovarian Torsion, Hypercoagulability, Increased Serum Estradiol and Hypoalbuminemia; clinical-series evidence on existing phenotypes Oliguria and Hyponatremia (PMID:10201472, 50 consecutive patients) and Pleural Effusion, Abdominal Distension and Rapid Weight Gain (PMID:10923741, 10 ICU patients); the GnRH Antagonist Stimulation Protocol treatment linked to Multifollicular Recruitment (PMID:27126581, PMID:35292717); clinical_burden; and a CONTROVERSY discussion on cabergoline and severe disease (PMID:22336848). The PR's Abdominal and Thoracic Compartment Compromise node was not ported because main's Pleural Effusion and Respiratory Failure node already covers diaphragmatic splinting and ARDS. Two evidence items the PR graded PARTIAL, a value since retired, were re-expressed: the cytokine association sentences now sit on the cytokine edge as SUPPORT with directness INDIRECT, and the null pooled oocyte result on the antagonist link is REFUTE against the stronger fewer-follicles reading. Eleven reference caches this PR added and nothing now cites were removed. Validated: count-verified-snippets 177/177, just validate, check-entity-refs, check-causal-targets, check-enum-values, check-reference-titles, test_snippet_grading and test_causal_targets (53 passed), and tests/test_data.py for this entry (4200 passed).

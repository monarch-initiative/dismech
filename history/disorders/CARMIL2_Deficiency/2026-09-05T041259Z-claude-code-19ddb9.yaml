  summary: 'Create: CARMIL2 deficiency'
  details: |
    Created the CARMIL2 deficiency entry (MONDO:0029134), an autosomal recessive inborn error of immunity. Modelled the mechanism from biallelic CARMIL2 loss through failed CD28 co-stimulatory signalling and defective actin remodelling at the immune synapse to impaired regulatory and effector T-cell function, and from there to the clinical spectrum of recalcitrant warts and molluscum, mucocutaneous candidiasis, EBV-driven smooth muscle tumours, dermatitis and inflammatory bowel disease. Kept the account of the CD28 axis consistent with the existing CD28-deficiency entry. Every evidence snippet was verified as an exact substring of a fetched reference cache file; all offline gates pass.

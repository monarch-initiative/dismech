  summary: Re-quote prevalence evidence to resolve a snippet-grading divergence
  details: |
    Fixed a snippet-grading divergence introduced by this PR and found by running the whole-KB gates that had been omitted from this branch's validation loop.

    PMID:36515678 was cited twice with the same quoted sentence graded two different ways: IN_VITRO on the pathophysiology node Failure of CD28-Dependent Canonical NF-kB Activation, and HUMAN_CLINICAL on the prevalence record. evidence_source classifies the cited publication, so one sentence cannot carry two values.

    The remedy taken is the second one the gate offers: re-quote so each item cites its own claim, rather than forcing the two gradings to agree. The sentence in question reports a functional assay, mutant alleles tested in T cells stimulated via CD28, so IN_VITRO is correct for the pathophysiology node and that item is unchanged. The prevalence record was citing it only for the incidental patient and family counts embedded in it, which is the weaker use of a stronger sentence. It now quotes the paper's own cohort statement instead, that biological and clinical phenotypes were established by studying 89 individuals from 52 unrelated families originating from 23 countries, which is a clinical cohort description and so is correctly HUMAN_CLINICAL, states the count directly rather than incidentally, and adds the country spread.

    Procedural note. check-snippet-grading takes no file argument and runs whole-KB, so it was omitted from the per-file validation loop used on this branch, as it was on the sibling Baller-Gerold branch where the same class of defect was found. The whole-KB gates are now run on this branch before pushing.

    Also checked and deliberately not acted on: the same gate reports a divergence in MPI-Congenital_Disorder_of_Glycosylation.yaml, which this PR does not touch. That file is 573 lines behind main on this branch and both instances of the quote are graded OTHER consistently on origin/main, so the finding is an artifact of the branch being behind rather than a defect, and editing a file this PR does not own would be wrong.

    Validation: just validate passes with 90/90 snippets verified; check-snippet-grading reports no finding in this entry.

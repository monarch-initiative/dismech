  summary: 'Create: Cataract_31_Multiple_Types'
  details: |
    New entry for cataract 31, multiple types (MONDO:0011547), autosomal dominant
    early-onset cataract caused by heterozygous CHMP4B missense variants. Curated
    from the claude_code deep-research report plus a PubMed search for CHMP4B
    and cataract (13 hits) and the primary papers. No GeneReviews chapter exists
    (check-genereviews --online: NO_CHAPTER). A StatPearls chapter on posterior
    polar cataract in general is reported as a candidate; it is not specific to
    CHMP4B and was not used.

    Content: five reported alleles (D129V, E161K, H57R, S196C, E161Q), autosomal
    dominant inheritance with incomplete penetrance in the D129V family, seven
    phenotypes (posterior subcapsular, posterior polar, progressive, anterior
    subcapsular and developmental cataract, plus nystagmus and posterior
    synechiae recorded in the single S196C proband), genetic testing, cataract
    surgery, two mouse models and a human-model-mismatch discussion.

    Pathograph: five nodes. The variant node (MOLECULAR) leads by two EMERGING
    hypothesis groups to lens opacity: impaired ESCRT-III membrane scission
    (CELLULAR; transfection data, Shiels 2007) then impaired lens fiber cell
    differentiation (CELLULAR; lens-specific knockdown mouse), and defective
    association of CHMP4B with extranuclear chromatin (CELLULAR; Sagona 2014).
    Both converge on loss of lens transparency (TISSUE), which feeds five
    cataract phenotypes. Five of seven phenotypes are connected; nystagmus and
    posterior synechiae were seen in one proband and are left unwired.

    Conformance: the variant node conforms to
    cataract_lens_opacification#Lens Homeostasis Insult and the opacity node to
    cataract_lens_opacification#Loss of Lens Refractive Transparency and Light
    Scattering. The module's crystallin solubility and aggregation nodes were
    not used, because no source shows crystallin aggregation in CHMP4B
    cataract. disabled_macroautophagy and loss_of_proteostasis are aging
    hallmark modules about age-related decline, and the CHMP4B autophagy link is
    a cell-line hypothesis, so neither was used. membrane_contact_site_dysfunction
    covers organelle tethering and lipid transfer, which ESCRT-III scission is
    not. cellular_senescence was considered for the cytokinesis-senescence route
    (PMID:34882480), but that paper concerns PI3K-C2alpha, not CHMP4B variants.

    Deep-research validation: 14/14 references resolved, 3/3 quotes found,
    22/24 terms resolved (OMIM unresolvable). preflight-dr PASS. Several report
    statements were not used because the cited sources do not support them: a
    six-generation D129V pedigree, absence of D129V from 384 control
    chromosomes, and "apparently full penetrance" (Zhou 2019 reports incomplete
    penetrance). The report also missed H57R (in the full text of PMID:30078984)
    and E161Q (PMID:40428427). PMID:37487085 (HSP90-beta and CHMP4B in aging
    cataract) and PMID:34882480 are mentioned in notes or not cited, as they do
    not concern the inherited alleles. Monarch's nuclear-cataract annotation had
    no citable source and was omitted.

    Validation: just validate, count-verified-snippets 52/52, validate-disorders
    passed; entity-ref, causal-target, logical-rule, coarse-phenotype,
    enum-value, duplicate-key, block-scalar and the whole-tree snippet gates
    reported no new findings.

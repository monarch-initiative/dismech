  summary: 'Audit and enrich Osteogenesis Imperfecta Type XVIII: add synonyms, classifications,
    causal pathograph wiring, phenotypes, animal models, diagnosis, and targeted bisphosphonate
    therapy'
  details: |
    Added MONDO synonyms (OI18, TENT5A-related and FAM46A-related osteogenesis imperfecta); added Harrison GENETICS_ENVIRONMENT_DISEASE and mechanistic_category collagenopathy classifications with evidence on ISDS skeletal category; grounded pathophysiology nodes with biological_scale, TENT5A (hgnc:18345) germline loss-of-function genetic_context, nucleotidyltransferase molecular_functions (GO:0016779), collagen type I trimer cellular_components (GO:0005584), skeletal locations, and bare-name downstream edges connecting all 8 phenotypes (100%); added phenotype categories, human clinical evidence for Growth Deficiency, and Progressive Scoliosis (HP:0002650) and Wormian Bones (HP:0002645); added Tent5a KO and Fam46a ENU mouse models; added Bone Radiography (NCIT:C137876) and Dual X-ray Absorptiometry (NCIT:C48789) diagnostic entries; enriched Bisphosphonate Therapy with SMALL_MOLECULE modality, pamidronate/zoledronic acid agents, and target_mechanisms with evidence.

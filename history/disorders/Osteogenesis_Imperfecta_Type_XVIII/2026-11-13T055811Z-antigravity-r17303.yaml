  summary: 'Addressed PR 17303 review: replaced Stuve-Wiedemann quotes with TENT5A-specific evidence, rebound Short stature, added human fibroblast poly(A)/collagen evidence, added 3 TENT5A phenotypes, and captured SMAD/BMP hypothesis'
  details: |
    Replaced Stuve-Wiedemann syndrome background quotes on Recurrent Fractures and Progressive Scoliosis with TENT5A-specific evidence (DOI:10.1007/s00223-024-01266-5, PMID:40575455, PMID:31220415) and removed Stuve-Wiedemann survivor phrasing from Progressive Scoliosis prose. Rebound Growth Deficiency to HP:0004322 (Short stature) with TENT5A cohort evidence and variable-penetrance phrasing. Removed unsupported fibroblast cell_types binding from the trigger node, re-tagged the PMID:29358272 osteoblast RT-PCR quote as IN_VITRO, annotated the Fam46a mouse sentence with quote_role: BACKGROUND across all 3 occurrences, and added human patient-derived fibroblast functional evidence for shortened COL1A1/COL1A2 poly(A) tails, reduced mineralization, and impaired collagen fibril assembly (PMID:41908159, PMID:40575455). Added Joint Hypermobility (HP:0001382), Motor Delay (HP:0001270), and Dentinogenesis Imperfecta (HP:0000703) with causal edges. Replaced generic pamidronate binding on Bisphosphonate Therapy with direct TENT5A OI bisphosphonate/zoledronic acid response evidence (PMID:40575455). Added OI type XIX / XVIII synonyms, documented the absence of a TENT5A-specific GeneReviews chapter and the OMIM vs Jovanovic & Marini type numbering in top-level notes, noted missense misfunction vs loss-of-function nuance on genetic, and added EMERGING_HYPOTHESIS discussion hyp_tent5a_smad_bmp_signaling.

  summary: 'Create: Immunodeficiency 60 (BACH2 haploinsufficiency)'
  details: |
    Curated de novo from stubs/Immunodeficiency_60.yaml; entry_type decided DISEASE and the stub deleted. No deep-research provider was used: this session had no outbound access to PubMed, Europe PMC, Crossref, ClinicalTrials.gov or the OLS ontology service (all 403 at the agent egress proxy), so no new references could be fetched and every evidence item is quoted from a reference already in references_cache/ or from the committed ClinGen snapshot. The backbone is the IUIS 2022 Table 4 row for BACH2 deficiency, recovered from the cached full-text PDF of PMID:35748970, which carries the mode of inheritance, both lymphocyte-compartment findings, the haploinsufficiency mechanism and the associated features; the ClinGen gene-disease validity record (CGGV assertion 2473560a, Moderate) was rebuilt offline with 'just clingen-rebuild --csv-only' from cache/clingen/gene_validity.csv. Treg mechanism from PMID:33996698 (Tregopathies), diagnostic setting and pulmonary surveillance from PMID:33864888; normal BACH2 molecular biology from PMID:29670635 and PMID:26235382, both graded INDIRECT. Classified IUIS Table 4 (immune dysregulation) rather than predominantly antibody deficiency, and added as a member of kb/groupings/Immune_Dysregulation_IEIs.yaml, where the NECESSARY criterion evaluates SATISFIED. Validation: schema validate clean; 19/19 snippets verified; offline term validation clean for every CURIE except MONDO:0032723, whose label and enum membership could not be checked because the ontology service was unreachable (the CURIE and label are corroborated by the committed ClinGen row); check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading all pass. Known gaps recorded as discussions rather than asserted: the quantitative humoral phenotype, the BACH2 repressor-direction paradox, and the IUIS-versus-ClinGen-panel classification tension.

  summary: Expand Immunodeficiency 60 onto the primary BRIDA literature
  details: |
    Network egress was opened mid-session, so the literature the first pass could not reach became available. Fetched PMID:28530713 (Afzali et al., Nat Immunol 2017, the founding BRIDA report; abstract only, full text still not retrievable), PMID:37148421 (second reported family), PMID:23728300 and PMID:15152264 (the Bach2 knockout studies behind the Treg and B-cell arms), PMID:40386599 and PMID:39826876. Added a BACH2 Protein Destabilization node upstream of the haploinsufficiency node, carrying the genetic_context that was previously on the latter; an Immunoglobulin deficiency phenotype (HP:0004313) between the memory B-cell node and the infection phenotype; a prevalence record (CASES_IN_LITERATURE); a treatments record for the prednisone plus tofacitinib response in the second family, scoped as one patient's response to the autoimmune arm; and two animal models with modeled_mechanisms and readouts - the dose-matched Bach2-heterozygous mouse (RECAPITULATES, HIGH) and the Bach2 knockout (PARTIALLY_RECAPITULATES, MODERATE, with the homozygous-versus-heterozygous dose mismatch recorded in limitations). Resolved the repressor-direction paradox discussion with a resolution_note: Bach2-null B cells still make IgM and still induce Blimp-1 and XBP-1, so plasmacytic differentiation does not require BACH2 and the defect is specific to class switch recombination. Narrowed the humoral-phenotype gap from absent to unquantified. Added discussions for incomplete penetrance (unaffected carrier father with extreme memory B-cell reduction) and for phenotype expansion, the latter deliberately keeping the single-case SLE and T-LGL reports out of the phenotype list. Strengthened the dosage-axis hypothesis with the founding report's own super-enhancer framing. Rewrote the description and notes, which had explained the entry's thinness by reference to the missing paper. Validation: just validate-disorders passes end to end, 48/48 snippets verified, term validation clean online, and the four term-cache rows for GO:0002319 and MONDO:0032723 are now generated by tooling and committed. All offline gates pass.

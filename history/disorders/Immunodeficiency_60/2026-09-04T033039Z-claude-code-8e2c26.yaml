  summary: Rebuild the entry on the founding report's full text
  details: |
    Issue #10867 asked for the founding BRIDA report (PMID:28530713) to be mined once
    its full text became reachable. It was already reachable; the cache said
    `abstract_only` because of a bug in this repository's own reference-validator
    patch, fixed in the same change.

    Why the fetch failed. `linkml-reference-validator`'s XMLExtractor discards a JATS
    document if the word "restricted" or the phrase "cannot be obtained" appears
    anywhere in it. PMC5593426 says "IgM-restricted plasma cells" in its results and
    "Searches were restricted to the period from ..." in its methods, so 50k characters
    of full text were thrown away over two sentences of ordinary English. A genuinely
    unavailable PMC record was checked against efetch and returns front matter with no
    <body> element at all, so the presence of a body carrying paragraphs is the correct
    test and the word match is noise. The dismech patch now recovers on that structural
    test rather than only on a `<restricted-by>` metadata tag.

    A second gap in the same extractor: it keeps <body> paragraphs only, so every table
    was dropped. In a clinical report that is where the per-patient phenotype lives.
    Tables are now appended as pipe-delimited rows in the same shape as the ORPHA and
    ICEES structured caches, so a curator can quote one row. Both changes are covered by
    new tests in tests/test_reference_validator_patch.py.

    What the full text settled, against the issue's list.

    Isotype pattern: answered, and the answer is that it is not uniform. Subjects A.II.1
    and B.II.1 were low in IgM, IgG, IgA and IgE; B.III.2, who carries the same E788K
    allele as her father B.II.1, had low IgA against raised IgM and IgG. IgA is the only
    isotype low in all three. So the humoral picture does not track the variant, and a
    normal or high IgG does not exclude the diagnosis. Curated on the Immunoglobulin
    deficiency phenotype and as a separate Decreased circulating IgA concentration
    phenotype.

    Isotype-level values: NOT obtainable, and probably permanently. The concentrations
    are in Supplementary Table 1, which PMC does not serve. Table 1 of the main article
    gives only Low/Normal/High. The entry therefore records direction per isotype and
    carries no `biochemical` block and no reference ranges, contrary to what the issue
    anticipated. The humoral discussion now says this explicitly.

    Patient class-switch and plasmablast assays: answered. Patient naive B cells
    activated with IL-21 show impaired plasmablast generation, class-switch
    recombination and class-switched antibody secretion. GO:0045190 isotype switching is
    now annotated on the memory B-cell node as the issue anticipated, alongside the
    existing GO:0002319, and the node also gains a class-switched memory B cell binding
    because the switched subset is reported as separately depleted.

    Per-compartment mouse phenotype: answered. The Bach2+/- link is raised to HIGH
    fidelity on the dosage node and gains readouts for reduced Bach2 message and
    protein with elevated Prdm1, plus an UNCHANGED readout recording that bulk
    lymphocyte counts are normal in unchallenged animals - a real negative that bounds
    the model. Two new links were added, to the memory B-cell node (minimal induction of
    class-switched B cells and plasma cells on NP-CGG immunization, reduced germinal
    center B cells) and to the new effector-skewing node.

    Mouse line provenance: answered. The methods state the Bach2 animals "were generated
    and housed as previously described", citing the study curated here as PMID:23728300.
    So the BRIDA heterozygote and that study's heterozygote are one line. The entry's
    over-counting warning is rewritten from "unknown whether" to a settled statement,
    and the do-not-double-count instruction stands.

    MeSH-indexed features: answered, and they belong. Splenomegaly (21.7 cm, one of
    three), pancytopenia (one of three) and non-infectious fever are quotable from the
    text; lymphadenopathy in all three and the isotype rows come from Table 1.
    Bronchiectasis in the older father is added, as are decreased memory and
    class-switched memory B cell proportions, decreased specific antibody response to
    vaccination, and decreased mitogen-induced T-cell proliferation. Ten phenotypes in
    all, each carrying its denominator in the description.

    Immunoglobulin replacement: the gap is closed. Table 1 records IVIg in the two
    pan-deficient subjects and not in the IgA-restricted one. Curated with a
    target_mechanisms link to the Immunoglobulin deficiency phenotype and the modality
    OTHER rather than PROTEIN_REPLACEMENT, since the schema defines that value as
    recombinant protein or enzyme replacement and IVIg is plasma-derived polyclonal
    antibody. Corticosteroid therapy is added with a paired SUPPORT/REFUTE item, because
    the authors state in one sentence both that steroids controlled the autoimmune
    features and that they did not touch the immunodeficiency or the pneumonitis.

    Beyond the issue's list. Three additions the full text made available. A new
    pathophysiology node, Gut-Homing TH1 Effector Skewing, sits between the Treg defect
    and the colitis and explains why the infiltration lands in the gut - patient CD4+ T
    cells show raised T-bet with raised CCR9 and beta-7 integrin, and the heterozygous
    mouse shows the same paired shift. Its gut-addressing half deliberately carries no
    ontology binding: GO has no term for homing to intestinal tissue, and the source
    reports receptor expression rather than migration, so binding T cell migration would
    assert more than the source says. A new experimental_models section curates the
    ~50% BACH2 RNAi knockdown in healthy human T and B cells, which is the entry's only
    dose-matched human system and the strongest causal evidence in it. And the resolved
    repressor-direction discussion loses its dose caveat, since that knockdown shows the
    class-switch dependency in human cells at human dosage rather than in a null mouse -
    while gaining a note that the patients' impaired plasmablast generation complicates
    the clean "switching fails, terminal differentiation does not" separation, which is
    why plasma cell differentiation is still not annotated.

    Validation: schema clean, 91/91 snippets verified, terms pass, and the entity-ref,
    causal-target, duplicate-key, qualifier-term, enum-value, folded-hyphen,
    snippet-length, title-snippet and snippet-grading gates are all clean.

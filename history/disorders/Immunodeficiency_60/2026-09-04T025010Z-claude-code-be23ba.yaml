  summary: 'Review round: correct knockout provenance, add the dose-matched Treg model'
  details: |
    Covers commits 67947c14 and b5b0ca67, both responses to review rounds on PR #10813. First round acted on the approving review's suggestions: replaced 'normally' with 'abundantly' for the Blimp-1/XBP-1 result in Bach2-null B cells and explained why the word matters (BACH2 represses BLIMP1, so a null de-represses it and the cell terminally differentiates without switching isotype); dropped the BRIDA heterozygote fidelity from HIGH to MODERATE since only the founding report's abstract is available; regraded the super-enhancer enrichment snippet COMPUTATIONAL; and split the Bach2 knockout into two animal_models entries so each publication matches the evidence on its own links. Second round corrected a factual error introduced by that split. The suggestion it acted on had asserted that PMID:23728300 and PMID:15152264 used independently derived knockout lines, and that claim was written into the entry. It is false: references_cache/PMID_23728300.md records that Roychoudhuri characterized 'knockout (KO) mice in which the Bach2 gene had been disrupted9', reference 9 being Muto 2004, and Muto A and Igarashi K co-author both papers. It is one Igarashi-derived line characterized in two studies. Verified against the cached full text rather than accepting the reviewer's correction on trust. Kept the split, since each publication genuinely should match its own evidence, but renamed both entries to Bach2-null mouse (Igarashi line, ...), removed the false prose, and added notes on each stating the shared provenance and instructing readers not to count them as independent replication - the concrete risk being over-counted replication. Extended the same treatment to the BRIDA heterozygote, whose line provenance is not stated in the retrievable abstract, so it too carries a note against being counted as a second independent heterozygous observation. Also added a new animal_models entry for the Bach2 heterozygote Treg result from the Roychoudhuri full text ('Treg cell formation was Bach2 gene-dose dependent since mice heterozygous for the KO allele had reduced frequencies of Treg cells'), which is now the entry's best-evidenced model link at fidelity HIGH because it matches both the gene dosage and the compartment of the human disease; its limitations field records why HIGH here sits beside MODERATE on the BRIDA heterozygote. Validation: just validate clean, 50/50 snippets verified, term validation clean, all offline gates pass.

  summary: Fix model readout target drift blocking the merge queue
  details: |
    The filgrastim macaque model carried two readouts on a single modeled_mechanisms link targeting 'Bone Marrow Hematopoietic Suppression', but the second readout, 'Duration of neutropenia', declared target 'Multilineage Peripheral Cytopenias'. check_model_readout_targets_match_link requires a readout's target to repeat its link's target, so this failed tests/test_data.py::test_disorder_file.

    The neutropenia measurement genuinely reports the peripheral cytopenia node rather than the marrow node, so the readout target was not relabelled to match the link; that would have asserted the measurement was made against a node it does not measure. Instead the readout moved onto a second modeled_mechanisms link on the same animal model, targeting 'Multilineage Peripheral Cytopenias' with its own description and limitations. The limitations record that filgrastim shortened neutropenia duration without changing the absolute neutrophil count nadir, so the readout does not show the depth of the cytopenia is rescued. The first link keeps its two evidence items and its mortality readout; no evidence item, snippet or reference was added, removed or re-graded.

    This defect was invisible on the pull request because the pull_request CI lane selects pytest by changed path and a kb/-only change matches neither the python nor the schema filter, so the KB test lane did not run. The merge_group lane runs ungated, so the failure appeared only inside the queue: eight merge-group runs failed on 2026-09-23 and the pull request's own checks stayed green throughout.

    Verified on the fixed tree: the previously failing test passes; just validate reports no schema issues and 179/179 snippets verified; check-entity-refs and check-causal-targets are clean.

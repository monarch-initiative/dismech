  summary: Create Acute Radiation Syndrome conforming to myelosuppression
  details: |
    New entry for the haematopoietic subsyndrome of acute radiation syndrome, absent from the KB. The myelosuppression module names ionizing radiation among its cytotoxic insults, so the conformance is one the module already anticipated.

    Three pathophysiology nodes, all three conforming to the module. The framing the entry adds beyond the module is that marrow fails first because its progenitors are the most rapidly cycling, which is the same reason it is dose-limiting for cytotoxic chemotherapy - the insult differs but the vulnerable cell population does not. Filgrastim and romiplostim both join the marrow-suppression node with RESTORES, since they rescue output from surviving progenitors rather than preventing the radiation injury itself.

    A HUMAN_MODEL_MISMATCH discussion records the epistemically unusual feature of this indication. Every treatment here carries MODEL_ORGANISM evidence, and that ceiling is permanent by regulatory design rather than a gap in curation: countermeasures are approved under the FDA Animal Rule, which permits approval on animal efficacy data precisely because deliberately irradiating humans to test a drug is neither ethical nor feasible. The efficacy claims can therefore never be upgraded to HUMAN_CLINICAL by finding a better trial, because no such trial will exist. The open question is how dose-equivalence and supportive-care differences between a primate protocol and a mass-casualty setting affect expected benefit.

    A curation error worth recording. The exposure was first bound to ECTO:0000006 (exposure to ultraviolet radiation), which is wrong - ultraviolet is non-ionizing and does not produce this syndrome - and was accompanied by a notes block asserting that no better term was available and that this was the least-bad option. That note was false: ECTO:7000047 (exposure to ionizing radiation) was already in the validated cache and resolves in the local ECTO build. The justification had been written without running the search. It is now bound correctly and the notes record what happened, because a confident but wrong rationale is more damaging than a bare wrong binding - a later curator would have trusted it and left the term alone.

    Deep research was run with claude_code and is committed as provenance. No quote from it was curated; all evidence was independently sourced and pre-verified against the local cache, and reference_title values were generated from cache rather than typed.

    Validated with just validate-disorders (batched sweep CI runs), just count-verified-snippets (7/7), just check-duplicate-keys, just check-entity-refs, and a graph build showing 5 edges with no integrity issues.

  details: |
    # Acute radiation syndrome source review

    Reviewed the original entry against every cited cached source, the matching deep-research report, current CDC/FDA guidance and directly retrieved registry protocols. Base eaa5fe99; parsed CREATE-only history. GeneReviews and StatPearls dated index (2026-09-10) both report NO_CHAPTER. Fresh fully paginated PR-file overlap preflight is saved separately.

    ## Original references

    - PMID34402734: complete 2021 review abstract. Sanctioned full-text refresh did not improve the available cache. Its claim that romiplostim is a small molecule was corrected using the FDA label (Fc-peptide fusion peptibody). The reference remains useful for growth-factor mechanisms, with its scope explicit.
    - PMID17993851: complete abstract; sanctioned refresh did not recover full text. Regression based on more than 100 radiation-accident cases supports time to emesis and lymphocyte kinetics as components of assessment, not exact individual dosimetry.
    - PMID23210705: complete cached scientific body, methods/results/discussion and tables/legends read. Forty-six Chinese-substrain rhesus macaques (38 males, 8 females), 7.5 Gy LINAC irradiation at 0.8 Gy/min; 24 treated versus 22 controls, both receiving medical management. Filgrastim began 23±3 hours after irradiation. Mortality was 20.8% versus 59.1%, a 38.3-percentage-point difference under this protocol. Neutropenia duration shortened, but ANC nadir, febrile-neutropenia incidence, diarrhea and selected platelet outcomes did not significantly improve. Animal results are not human effect estimates or evidence for all four parent drugs.
    - PMID36543843: complete ten-page scientific PDF text including methods, results, discussion, tables and legends. Ex-vivo healthy blood, two calibration donors and two independent validation donors; cobalt-60 irradiation, 0–4 Gy calibration, five blinded doses 0.5–4 Gy. Actual doses were within confidence intervals, with one lower confidence bound unavailable at 0.5 Gy. One calibration point remained overdispersed after filtering. This does not validate an assay in ARS casualties, partial-body exposure, doses above 4 Gy or below 0.5 Gy. Background diagnostic statements and experimental results are classified separately.

    ## Expanded full-text evidence

    - PMID21987000: complete 2011 WHO hematopoietic consensus main scientific body and tables. Human accident experience includes 18 cytokine-treated cases without adequate untreated comparators; spontaneous recovery can occur. Distinguishes suppression of progenitor mitosis from mature lymphocyte apoptosis. Strong G-CSF/GM-CSF recommendations, weak ESA and transplantation recommendations. ESA response takes weeks; selection and labeling warnings matter. Transplantation is conditional on lack of spontaneous/cytokine recovery after 2–3 weeks and absence of significant other-organ injury. Its historical lack of a thrombopoietic recommendation is superseded by current FDA romiplostim approval.
    - PMID21986999: complete 2011 nonhematopoietic consensus scientific text and tables read, first in the generated USZ PDF and then canonical full XML. Clinical GI, skin and neurovascular findings; barrier damage with bacterial translocation qualified as a possible mechanism; enteral support with ileus/diffuse-bleeding exceptions; antimicrobials, antiemetics, diarrhea control, topical care, conditional excision/grafting, psychological support and ICU organ support. Source-specific dose thresholds are not universal. Neurovascular edema/permeability mechanisms remain inferred. The inpatient scenario and extrapolated critical-care evidence are distinguished from direct ARS trials. Obsolete generic ICU recommendations were not imported (e.g. activated protein C).
    - PMID9525257: complete abstract; full-text retrieval did not succeed. Resting human lymphocytes exposed ex vivo to cobalt-60 or fast neutrons, 0.05–5 Gy, analyzed at 24 hours. Apoptosis rises steeply at low dose and flattens at high dose; this supports a separate mature-lymphocyte mechanism, not clinical timing estimates.
    - PMID35767939: complete 2022 review abstract read; full-text attempt timed out. Reiterates the limitations of controlled human evidence. Not needed as a redundant citation.
    - PMID24376971: complete abstract; publisher/PMC retrieval did not yield accessible full text. Its mixed countermeasure discussion requires irradiation-versus-internal-contamination distinctions. Better full consensus sources were used instead.

    ## Regulatory and clinical guidance

    - CDC clinical ARS page: complete generated HTML body and table footnotes. Distinguishes dose thresholds from temporal onset and distinguishes localized cutaneous injury from systemic ARS. Four clinical stages, serial assessment, broad symptom support and approximate gamma-equivalent dose ranges were consumed. Not population frequency data.
    - FDA radiological/nuclear preparedness page: complete generated HTML body, content current 2026-07-13. Confirms four parent agents and subsequent biosimilar approvals. Internal contamination and potassium iodide content was not conflated with treatment of external-radiation ARS.
    - FDA romiplostim 2021 label: relevant indication, molecular structure, mechanism, pharmacology and ARS efficacy sections read in full; unrelated ITP and patient instructions were not read in full. Forty animals per randomized blinded rhesus arm, 6.8 Gy cobalt-60, treatment at 24 hours with medical management; survival 29/40 versus 13/40. The exploratory combination arm is not a clinical comparison. No animal dose was curated because the extracted PDF unit is ambiguous. Human ARS pharmacokinetics were unavailable; dose bridging uses other human settings and animal efficacy.
    - FDA pegfilgrastim 2015 label: relevant indication, mechanism, ARS pharmacology/human bridge, safety context and efficacy section read in full; unrelated cancer/device instructions were not read in full. Separate macaque study, 23 per arm, 7.5±0.15 Gy, dosing on days 1 and 8 with medical management; survival 21/23 versus 11/23. No transfer of animal regimens into patient dosing instructions.
    - Generated URL-PDF metadata use URL titles. Human-readable identities are provided in evidence explanations, descriptions and this audit; cache metadata were not hand-edited.

    ## Registry and research completeness

    All eight included registry cache summaries were read in full, with directly retrieved protocol identification/status/design/intervention/population/endpoints inspected on 2026-09-21. HemaMax NCT01742221 is Phase I and NCT02343133 Phase II, both healthy-volunteer safety/pharmacology research. KMRC011 NCT03585803 and three BIO300 studies NCT06741345/NCT04650555/NCT00504335 are also healthy-volunteer development, not ARS survival trials. NCT03797040 (PLX-R18) is an exposed-person safety protocol with UNKNOWN status; estimated enrollment is not an observed result. NCT02587442 (RadProtect) is a healthy-volunteer protocol with UNKNOWN status. NCT00903929 concerns planned transplant-conditioning irradiation and was excluded from uncontrolled acute exposure scope.

    Read the entire actual deep-research report (scientific text lines 513–1590); preceding material is the retrieval prompt. Its citation analysis resolves 68 references, 44 on-topic, but report leads are not proof. Corrected its overgeneralized HSC cycling, syndrome timing and supposed permanent ceiling on all human research. Central acute mechanisms, four overlapping organ components, stages, clinical manifestations, diagnostic limitations, supportive care, approved agents and the Phase-II healthy-volunteer record are represented. Late radiation effects and exploratory regeneration/microbiome mechanisms are explicitly outside this acute entry's reviewed scope; animal-only findings were not promoted to human phenotypes.

    ## Final review

    Thirteen atomic pathophysiology nodes distinguish delayed marrow suppression, rapid mature-lymphocyte injury, GI barrier failure, skin injury, inferred neurovascular injury and cytogenetic damage. Twenty-four evidence-backed acute phenotypes; eighteen treatments; three distinct macaque models; two human ex-vivo models; eight registry records. A second agent independently read both consensus main bodies/tables, CDC/FDA guidance and relevant label efficacy sections and found no clinical/evidence blocker after duplicate-record and treatment-direction fixes. Full schema/ontology/reference validation passes with 172/172 snippets; final additional gates and formatting are tracked separately.

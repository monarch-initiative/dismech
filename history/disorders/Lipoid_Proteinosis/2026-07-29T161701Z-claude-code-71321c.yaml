  summary: 'Create: Lipoid Proteinosis (ECM1 / Urbach-Wiethe disease)'
  details: |
    New de-novo entry for lipoid proteinosis (Urbach-Wiethe disease, MONDO:0009530, ECM1). Deep research via the claude_code provider (research/Lipoid_Proteinosis-deep-research-claude_code.md); GeneReviews baseline (PMID:26803878) cross-checked. Seven atomic (unbundled) pathophysiology nodes model the ECM1 loss-of-function -> loss of matrix interactions -> hyaline deposition -> site-specific infiltration (larynx, skin/mucosa, medial temporal lobe calcification) -> impaired fear processing chain. 12 phenotypes (incl. GI hyaline nodules), ECM1 genetics with the Q276X founder allele, a diagnosis section (molecular + skin-biopsy histology), worldwide ULTRA_RARE plus Namaqualand founder prevalence, acitretin/surgical/antiseizure/surveillance treatments, and a discussions section (KNOWLEDGE_GAP on the calcification->neuropsychiatric mechanism; OPEN_QUESTION on genotype-phenotype modifiers). Includes review-response revisions (PR #7095): added the worldwide prevalence record and GI phenotype, corrected evidence_source on molecular-binding review snippets to OTHER, and mined additional GeneReviews management/counseling detail. Validated: linkml schema, term validation (--labels), and reference validation all pass; all evidence snippets verified as exact substrings of cached abstracts.

  summary: 'Evidence-integrity review: claims vs cited publication text'
  details: |
    Evidence-integrity review of all 58 evidence items against all 9 cached references, re-reading each cited publication; every snippet confirmed an exact whitespace-normalized substring of its cache body, including the DOI item the validator skips. Defects fixed: (1) molecular confirmation over-claimed on four fetal phenotypes - cystic hygroma, pleural effusion, pericardial effusion and pulmonary hypoplasia quoted the PMID:30564329 autopsy sentence with explanations asserting a molecularly confirmed CCBE1 fetus, but that autopsy is the second pregnancy, which the paper states could not be genotyped (only the fourth, G4, was); rewrote the three autopsy-based explanations and switched pleural effusion to the G4 ultrasound legend, which is the confirmed fetus; (2) six dysmorphology phenotypes (flat face, depressed nasal bridge, hypertelorism, narrow mouth, dental morphology, ear abnormality) downgraded SUPPORT to PARTIAL - their shared quote says features are similar to CCBE1 cases but names no individual feature; (3) named-entity discipline completed on the original 1989 Hennekam family (PMID:2624276), which was later shown FAT4-related - added the caveat where missing on the intestinal lymphangiectasia node/phenotype and lymphedema phenotype, plus CCBE1-anchored corroboration from PMID:30564329 for both phenotypes, which also grounds the CHRONIC/PROGRESSIVE qualifiers; (4) a non-propositional protein-loss fragment replaced with the actual sentence; (5) prevalence explanation trimmed of an unsourced fewer-than-100-families figure and downgraded to PARTIAL; (6) lymphedema supportive care given the case report's own conclusion on decongestive therapy. Left unfixed with reasons: an ungenotyped clinically diagnosed patient used in both Hennekam entries (curation-scope question, no explanation claims CCBE1); MODEL_ORGANISM gradings on mouse/zebrafish-carried claims confirmed correct. Assessment: variant-level curation matches its source line for line and the FAT4-attribution caveat was already present in most places; the one substantive failure was asserting molecular confirmation the cited paper explicitly denies. Validation: just validate, validate-terms, and strict snippet audit pass.

  details: |
    Response to two rounds of automated review on PR #10529. The prior record
    (2026-09-02T062814Z) covers the augmentation itself; this one covers the review pass.

    ROUND 1 - four blocking items, all fixed.

    1. Claim-evidence mismatch. PMID:32629717 was cited under 'Immunoglobulin replacement
    therapy' for a quote about albumin and IgG returning to normal. That case never gave
    immunoglobulin: it was managed with total parenteral nutrition, then enteral nutrition,
    plus ganciclovir/valganciclovir for CMV. The recovery followed from stopping the enteric
    protein loss. Moved to 'Dietary management of protein-losing enteropathy' with the
    explanation stating explicitly that no immunoglobulin was given. This was a real defect
    and the entry's own explanation had half-conceded it before the reviewer caught it.

    2. Variant spectrum. Added p.Arg158Cys (c.472C>T; homozygous in PMID:32629717, compound
    het with c.521G>A in PMID:32472549), p.Cys98Trp (PMID:25925991, the mild end - lymphatic
    dysplasia with no intellectual disability or dysmorphism), p.Asp104Asn (c.310G>A) and
    p.Leu27Pro (c.80T>C) (both PMID:27345729, the latter in the signal peptide). Added
    PMID:27345729 for the ~25% CCBE1 fraction stated against the named syndrome rather than a
    broader clinical cohort.

    The review attributed p.Asp104Asn and p.Leu27Pro to PMID:24523457. Checking the caches,
    both are in PMID:27345729; PMID:24523457 is the zebrafish Vegfc/Vegfr3 signalling paper and
    reports no human variants. Curated from the sources and flagged the discrepancy on the PR;
    the reviewer confirmed the correction in round 2.

    3. Diagnostics. Added lymphoscintigraphy (NCIT:C67262, PMID:32629717) and stool
    alpha-1-antitrypsin (NCIT:C80167, PMID:40394495). Declined the third suggested modality,
    endoscopic biopsy: the same source reports 'increased stool alpha1-antitrypsin, while
    endoscopy biopsies were normal' in a molecularly confirmed patient, which argues against
    biopsy sensitivity rather than for it. Recorded as a caveat in notes instead. The reviewer
    accepted this as the better answer.

    4. Dietary management. Added a target_mechanisms link to Protein-losing enteropathy so the
    cornerstone therapy joins the pathograph, plus PMID:19449286 outcome data (63% vs 35.7%
    symptom resolution, 3.7% vs 17.85% mortality), graded INDIRECT since that series is primary
    intestinal lymphangiectasia.

    5. Split the bundled pathophysiology node, which the reviewer identified from this PR's own
    animal-model limitations text describing a model as covering 'half' of a node. 'Impaired
    VEGF-C activation and lymphangiogenesis' became 'Impaired pro-VEGF-C proteolytic activation'
    (MOLECULAR, GO:0004222 DECREASED) feeding 'Failed lymphangiogenesis' (CELLULAR, GO:0001946
    DECREASED). All three animal models retargeted; the molecular node consumed PMID:27159393
    and PMID:28687807, both previously cached and unused. Pathograph builds with 43 nodes,
    23 edges, orphan_targets empty.

    6. Removed a stray NCIT:C594 (Iodine) label-cache row left by a rejected binding attempt
    earlier in the session.

    ROUND 2 - approved, with three optional items, all taken.

    A. The reviewer corrected one of my corrections. I had reported no p.Cys174Tyr anywhere in
    the cached set; the allele is there in one-letter form as C174Y, and my search regex only
    matched the three-letter spelling. Added it from PMID:26686525 (homozygous in two Turkish
    siblings, recurrent with a prior Dutch kindred) and PMID:25925991 (EGF-domain cysteine
    cluster). PMID:26686525 also contributed two things beyond the variant slot: its finding
    that the mutant is 'not loss-of-function by loss-of-expression' now qualifies the CCBE1
    loss of function node, so that node is not read as implying absent protein; and its
    intestinal-biopsy immunohistochemistry ('a strong decrease of lymphatic vessels, with a
    corresponding diminished expression of CCBE1') is now the human-tissue evidence on Failed
    lymphangiogenesis, which otherwise rested only on zebrafish and mouse.

    B. Linked the CCBE1 domain-deletion knock-in model to the new molecular node with
    relationship MEASURES, since PMID:25814692 assayed VEGF-C processing directly. The new node
    now has experimental grounding rather than only in vitro biochemistry from other groups.

    C. This record.

    VALIDATION. just validate-disorders passed. Snippets 121/121 verified (99 at PR open).
    check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys,
    check-qualifier-terms, check-snippet-length, check-snippet-grading, check-title-snippets,
    check-folded-hyphens, check-term-cache-integrity, check-cache-order all clean with no new
    findings. Compliance 98.8% (weighted 99.2%). Reference consumption of the caches added by
    this PR rose from 7 used to 15, and the entry now cites 23 PMIDs.

    GENEREVIEWS. The reviewer could not query PubMed (no network in its environment) and asked
    for confirmation. Four searches - 'Hennekam syndrome GeneReviews[All Fields]', 'CCBE1
    GeneReviews[All Fields]', 'Lymphedema Overview GeneReviews[TI]', 'hennekam lymphangiectasia
    lymphedema GeneReviews' - all return zero results. No GeneReviews chapter exists for this
    disorder; not a blocking omission. Reported on the PR and accepted.

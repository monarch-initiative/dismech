  summary: 'Augment: Hennekam lymphangiectasia-lymphedema syndrome 1 (CCBE1)'
  details: |
    Augmentation of the existing CCBE1 HKLLS1 entry (created 2026-08-02, PR #7834); no new entry was created.

    DEEP RESEARCH. falcon was requested per the /curate default and is UNREACHABLE in this
    environment (403 ProviderAuthError; EDISON_API_KEY present but rejected). Rather than
    substituting a provider by hand, the run was re-issued with 'just dr_fallback=--fallback
    research-disorder falcon ...' so the substitution is recorded by the run itself. openscientist
    produced the report: research/Hennekam_Lymphangiectasia-Lymphedema_Syndrome_1-deep-research-openscientist.md,
    frontmatter fell_back: true, requested_provider: falcon, provider_attempts listing the falcon 403.
    Its validation is clean: 37/37 references resolved, confabulation_rate 0.0, 14/14 quoted claims
    found in source, 0 off topic. Term validation 35/37 resolved, 0 named as a different term; the two
    'worth a second look' entries are benign (HP:0001888 called 'Lymphopenia', which is how this entry
    already uses it as preferred_term against the canonical label 'Decreased total lymphocyte count';
    and a paraphrase of GO:0004175). ORPHA has no resolver and was not checked either way.
    The recipe renamed the falcon output path to the openscientist name, which displaced the
    previously committed 2026-08-02 falcon report; that report was restored from origin/main, so the
    openscientist report is additive and both are committed. The falcon report gained only a
    template_sha stamp.

    GENEREVIEWS. Searched PubMed for a GeneReviews chapter ('Hennekam syndrome GeneReviews[All Fields]'
    and 'lymphedema GeneReviews[TI]'); no article exists for this disorder, so no GeneReviews baseline
    was available. Recorded per Step 3b rather than left silent.

    WHAT WAS ADDED.
    - classifications: harrisons_chapter GENETICS_ENVIRONMENT_DISEASE + CARDIOVASCULAR, each with a
      recorded reason.
    - animal_models (new section, 3 models, all with modeled_mechanisms + readouts): Ccbe1-null mouse
      (PMID:21778431), ccbe1 mutant zebrafish (PMID:19287381), CCBE1 domain-deletion knock-in mice
      (PMID:25814692). These grounded the mechanism chain that previously had no model layer.
    - Evidence added to 6 previously uncited pathophysiology downstream causal edges.
    - treatments: immunoglobulin replacement (NCIT:C62710 + NCIT:C80829) and octreotide for refractory
      PLE (CHEBI:7726), both with target_mechanisms links carrying their own evidence.
    - clinical_burden (HIGH), progression (3 phases), discussions (1 HUMAN_MODEL_MISMATCH +
      2 KNOWLEDGE_GAP).
    - Evidence added to both differential_diagnoses and to the Hypoalbuminemia and Lymphopenia
      phenotypes.
    - DOI:10.1161/CIRCRESAHA.116.304949 upgraded to PMID:25814692. The entry now has zero DOI-keyed
      evidence items, so every snippet is checked by the gating validator.

    RED-TEAM PASS. A subagent review against dismech-pr-review found 11 issues; all substantive ones
    were fixed before commit. Most important: PMID:18294365 (Vignes, primary intestinal lymphangiectasia
    / Waldmann disease) had been used as the SOLE evidence on the Hypoalbuminemia and Lymphopenia
    phenotypes, and that review explicitly lists Hennekam syndrome as a SEPARATE entity from its own
    subject - a wrong-disease citation. Replaced with on-disease evidence: PMID:32629717 (homozygous
    CCBE1 c.472C>T infant with documented hypoproteinemia, hypoalbuminemia, hypogammaglobulinemia) for
    Hypoalbuminemia, and PMID:29560340 for Lymphopenia. No source reporting lymphocyte counts in a
    molecularly confirmed HKLLS1 patient could be found (PubMed searched), so the lymphopenia item is
    graded INDIRECT and its explanation says so. The PIL review is retained only as a secondary
    shared-mechanism citation whose explanation now names the disease boundary. Also fixed: 4 PIL
    causal-edge items regraded DIRECT -> INDIRECT for consistency with the same inference step graded
    INDIRECT elsewhere; a clinical_burden rationale sentence claiming the three syndrome arms co-occur
    in all reported families, contradicted by this entry's own material (rewritten to argue severity,
    not universality); an uncited '33% of patients have seizures' figure in progression (now cited to
    PMID:29560340); a Ccbe1-null model evidence item that quoted the paper's RATIONALE gap statement
    ('mouse models for the disease do not exist') rather than a finding; a corneal-micropocket readout
    filed as a measurement of the null mouse when it is an exogenous recombinant-protein assay (demoted
    to link-level evidence with the provenance stated); fidelity HIGH -> MODERATE on that link because
    the same paper reports VEGFR-3 activation unaltered in mutants; an uncited claim that the zebrafish
    is the standard rescue-testing model; a differential-diagnosis overclaim that HKLLS1 and HKLLS2 are
    clinically indistinguishable; and evidence_source IN_VITRO -> OTHER on an attributive sentence.
    An unsourced allele nickname ('full of fluid') was removed from the zebrafish model name because it
    is not in the cached abstract.

    DELIBERATELY NOT DONE.
    - datasets stays empty. 'just discover-datasets' returned only 2 GENE_ONLY candidates (GSE307112,
      GSE307351), both alveolar stem-niche studies matching on CCBE1 alone and unrelated to lymphatic
      disease - the Named Entity Confusion case CLAUDE.md warns about. Both deep-research reports also
      state no disease-specific omics signature exists.
    - No conforms_to: there is no lymphangiogenesis or lymphatic-development module in kb/modules/.
    - classifications.harrisons_chapter carries no evidence items; a nosology assignment has no citable
      finding, and the exemplar entries do not carry one either.

    VALIDATION. just validate-disorders (schema + terms + references, the CI gate) passed. Snippets
    99/99 verified, and 99/99 again with --unskip-prefix DOI. check-entity-refs, check-causal-targets,
    check-enum-values, check-duplicate-keys, check-qualifier-terms, check-qualifier-terms-online,
    check-snippet-length, check-snippet-grading, check-title-snippets, check-folded-hyphens,
    check-term-cache-integrity, check-cache-order all OK with no new findings. pytest 10620 passed
    (model-readout, entity-ref, unique-name and treatment selectors). Compliance rose 92.3% -> 98.6%
    (weighted 92.8% -> 99.1%). Two term errors were caught by the validator during curation and fixed:
    NCIT:C594 is Iodine (not Immunoglobulin) and NCIT:C572 is not in the ChemicalEntityTerm enum.

  summary: Review CCBE1-specific phenotype evidence and mechanisms
  details: |
    Reviewed all 23 existing phenotypes against the full YAML, Falcon report/citation sidecar, cached sources and genotype-stratified cohort. Replaced mixed-genotype and ungenotyped support with direct CCBE1 observations; removed six subtype assertions lacking direct support. Added nine findings from CCBE1-positive cases, rebound flat midface and nonimmune hydrops, added seven supported causal summary/clinical edges and removed the inferred total-lymphopenia edge. Retained uncertain fetal family attribution explicitly. Recorded unresolved neurodevelopmental, facial, endocrine, hernia and fetal mechanisms, and excluded isolated neoplasms/uncertain polydactyly from established associations. No frequency bands assigned; removed mixed-genotype seizure frequency from progression.

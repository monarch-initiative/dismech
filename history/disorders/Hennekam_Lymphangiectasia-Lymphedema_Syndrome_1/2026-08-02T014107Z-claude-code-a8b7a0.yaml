  summary: 'Create: Hennekam lymphangiectasia-lymphedema syndrome 1 CCBE1'
  details: |
    De novo curation of CCBE1-related Hennekam syndrome MONDO:0009337, OMIM 235510. Deep research via Edison falcon provider. Curated the CCBE1/ADAMTS3/pro-VEGF-C activation/VEGFR-3 lymphangiogenesis mechanism, generalized lymphatic dysplasia, intestinal lymphangiectasia with protein-losing enteropathy, lymphedema, flat facial gestalt, intellectual disability, and severe prenatal nonimmune hydrops presentation. Evidence from primary literature: Alders 2009 PMID:19935664, Hennekam 1989 PMID:2624276, Jeltsch 2014 PMID:24552833, Le Guen 2014 PMID:24523457, Roukens 2015, Melber 2018 hydrops. Validated with just validate; schema, terms and references all pass; DOI snippets manually confirmed as exact substrings.

  summary: 'Address PR 7834 review: deepen HKLLS1 CCBE1 evidence'
  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED on PR 7834. Re-anchored 7 craniofacial/neuro phenotypes with CCBE1-confirmed corroboration from Melber 2018 PMID:30564329 rather than only the FAT4 original family. Added serosal/respiratory phenotypes from the CCBE1-confirmed Melber case: cystic hygroma, pleural effusion, pericardial effusion, pulmonary hypoplasia, ascites, plus pulmonary lymphangiectasia and epicanthus from Lee 2018 PMID:29560340. Added a Protein-losing enteropathy pathophysiology node wiring the hypoalbuminemia/immunoglobulin/lymphopenia lab phenotypes with incoming causal edges. Added variant-level genetic content with two specific CCBE1 variants and gnomAD allele frequencies from Melber. Upgraded diet and lymphedema treatments from title-snippets to real Lee 2018 evidence. Renamed Hypoproteinemia to Hypoalbuminemia, added biological_scale tags and lymphedema onset/course qualifiers. All snippets verified exact; just validate passes.

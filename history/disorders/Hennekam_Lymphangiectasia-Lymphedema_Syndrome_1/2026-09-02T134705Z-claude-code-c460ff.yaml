  details: |
    Continues the record at 2026-09-02T130101Z, which covered review rounds 1-2 on PR #10529.

    MERGE WITH MAIN. While this branch was in review, f19f3c58d landed on main from PR #10114
    (a lymphatic-disease evidence audit) and independently edited this same entry. Rebase was
    attempted first per the repository convention for branches you own, but it conflicted on the
    first of five commits; five resolutions on a file this size is where mistakes happen, so it
    was aborted in favour of the single-resolution merge the PR-handling rules prescribe for
    conflicts. The conflict itself was mechanical - main improved the prevalence evidence
    explanation while this branch appended clinical_burden, progression and discussions
    immediately after it. Both kept.

    One substantive follow-on from reading what main actually changed rather than resolving
    mechanically. Main established that the originally-described 1989 Hennekam family
    (PMID:2624276) was later shown to be FAT4-related (PMID:24913602) and qualified its citations
    accordingly. Two citations added on this branch make HKLLS1 claims from that same family, so
    both now carry the same qualification: clinical_burden says the family establishes the burden
    of the Hennekam phenotype rather than of the CCBE1 subtype, and the HUMAN_MODEL_MISMATCH
    discussion notes the same plus that no CCBE1-confirmed report addresses the
    lymphatic-to-cognition mechanism either. This is the same class of error as the
    wrong-disease citation caught in round 1, and it would have shipped had the conflict been
    resolved without reading main's diff.

    ROUND 3 BLOCKING ITEM. Prose added for the C174Y allele said the mutant protein 'is still
    expressed and secreted, so the loss of function is not a loss of protein', and the node
    explanation said a loss-of-function node 'should not be read as implying absent protein'.
    That stated the in vitro half of a two-halved finding as the general case, and contradicted
    the other item added from the same paper reporting CCBE1 scarce in patient intestinal tissue.
    PMID:26686525 reconciles the two itself and that sentence was what got dropped. Both places
    now carry the in vitro qualifier. Two evidence items were added so the fork is structural
    rather than only editorial: the authors' reconciliation sentence, and the alternative
    degradation hypothesis. The node now says loss of CCBE1 activity without a settled account
    of whether the protein is absent, misfolded, or degraded in vivo.

    ROUND 3 OPTIONAL ITEMS, all taken.
    - fidelity HIGH -> MODERATE on the knock-in MEASURES link, consistent with the null-mouse
      downgrade made in round 1 on the same reasoning.
    - Immunoglobulin replacement gained its first on-disease evidence: two genotype-confirmed
      CCBE1 C174Y patients (750 mg/kg every 2 weeks; 30 gm every 3 to 4 weeks). It previously
      rested only on a primary-intestinal-lymphangiectasia case graded INDIRECT. The '15 months
      without necessitating replacement' quote went to dietary management instead, since it is a
      statement about the diet displacing replacement rather than about replacement working.
    - Normal serum VEGF-C in both patients recorded as a notes caveat on Impaired pro-VEGF-C
      proteolytic activation, framed as neither supporting nor refuting the node, since the node
      is about processing rather than abundance.

    ROUND 4. Approved. One advisory nit taken here: the degradation-hypothesis evidence item was
    graded IN_VITRO, but the quoted sentence is a discussion-section proposal about what happens
    in vivo and reports no experiment. Regraded OTHER, with the reason recorded in the
    explanation.

    SNIPPET EXACTNESS. One snippet failed validation on first attempt because the cache carries a
    typographic apostrophe in P1's and an inline (Fig. 7) that had been silently dropped. The
    quote read correctly but was not byte-exact. Trimmed to a clean span rather than reproducing
    either character. Recorded because it is the second time in this curation that a tool caught
    a quoting error that reading did not.

    REVIEW ATTRIBUTIONS. Across four rounds, three reviewer attributions were corrected from the
    caches (p.Asp104Asn and p.Leu27Pro placed in the wrong paper; p.Cys174Tyr said to be in a
    paper that does not carry it) and one of ours was corrected by the reviewer (p.Cys174Tyr
    reported absent from the cached set when it is present in one-letter form as C174Y, missed
    because the search regex only matched the three-letter spelling). Every one was settled by
    reading the cache rather than by either side holding position.

    VALIDATION. just validate-disorders passed. Snippets 129/129 verified, up from 99 at PR open.
    check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys,
    check-qualifier-terms, check-snippet-length, check-snippet-grading, check-title-snippets,
    check-folded-hyphens, check-term-cache-integrity, check-cache-order all clean with no new
    findings. Pathograph builds with 44 nodes and 25 edges and no orphan targets.

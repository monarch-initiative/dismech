  summary: 'Deep review: publication-completeness pass (IUIS campaign)'
  details: |
    Publication-completeness deep review of an IUIS Table 2 entry, reviewed as a sibling pair with HKLLS2 (FAT4) to keep their scopes distinct. PRIMARY GAP: the Hypoalbuminemia and Lymphopenia phenotypes carried NO evidence at all - the two immune/biochemical consequences of lymph loss that are the reason an intestinal-lymphangiectasia syndrome appears in an immunodeficiency classification were asserted and unsupported. Fetched ONE new reference, PMID:18294365 (Vignes & Bellanger, primary intestinal lymphangiectasia / Waldmann disease), whose abstract states the chain directly, and evidenced both phenotypes plus corroborated hypogammaglobulinemia. Every explanation citing it states that the source describes primary rather than syndromic lymphangiectasia and is cited for the shared downstream mechanism, not as Hennekam-specific cohort data. IMPORTANT NUANCE ADDED: the same source records that despite moderate-to-severe hypogammaglobulinemia and lymphopenia, the risk of pyogenic bacterial infection is not significantly elevated and opportunistic infection is uncommon. This is now quoted on the Lymphopenia phenotype, whose description states that the abnormality is a quantitative loss of cells and protein into the gut rather than a functional immunodeficiency comparable to a primary T-cell defect. Without it the entry would have implied an infection risk the literature does not support. MISSED CLAIMS FROM ALREADY-CITED SOURCES: PMID:29560340 and PMID:30564329 are both cached as full text and were only lightly mined. Added a quantified seizure frequency (about 33%, FREQUENT band) from PMID:29560340; evidence from PMID:30564329 for the CHRONIC/PROGRESSIVE qualifiers on the Lymphedema phenotype term, which had previously been asserted without any evidence naming them; the mechanism of the low-fat/MCT diet (preventing lacteal engorgement and rupture; MCTs bypassing the lacteals via the portal circulation) and its need to be permanent; and a Lymphedema surgery treatment as a documented last resort. Added an animal_models entry for the Ccbe1 knockout mouse with a modeled_mechanisms link to Generalized lymphatic dysplasia, typed PARTIALLY_RECAPITULATES / MODERATE fidelity with explicit limitations - a constitutive null is more severe than human HKLLS1 genotypes and its prenatal lethality means it cannot model the postnatal phenotype that defines surviving patients. One snippet had to be trimmed to start after a hyphenated line break in the cached PDF ('Sur-gery'); the explanation records why. Snippets 62 -> 79, all verified; all validation gates pass.

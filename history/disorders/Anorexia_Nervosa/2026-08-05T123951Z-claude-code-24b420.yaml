  details: |
    Added the WFSBP consensus statement on candidate AN biomarkers (Himmerich et al. 2026, PMID:41765047) as a second authoritative evidence anchor on the existing 'Peripheral biomarkers are investigational' diagnosis entry. Snippet verified as an exact abstract substring. Deliberately did NOT bulk-import specific candidate biomarkers: the consensus abstract is domain-level only (no quotable per-marker directional claims) and its own conclusion states most AN biomarkers rest on group comparisons and lack validated sensitivity/specificity/prognostic value, so promoting them to curated entries would over-assert. This edit upgrades the investigational caveat from a single meta-analysis to field consensus. just validate passes.

  summary: Add Elevated Soluble Leptin Receptor biomarker from Wu 2024
  details: |
    Added Elevated Soluble Leptin Receptor (sOB-R) biomarker to the biochemical section of Anorexia_Nervosa.yaml. Source: Wu et al. 2024 meta-analysis DOI 10.3390/nu16132095. sOB-R is the shed extracellular domain of the leptin receptor, acting as a circulating leptin antagonist. Together with existing Hypoleptinemia marker, captures dual-arm leptin system dysfunction in acute AN. Validation passed for all checks.

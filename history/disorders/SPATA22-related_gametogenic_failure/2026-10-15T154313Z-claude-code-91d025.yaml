  summary: 'Create: SPATA22-related gametogenic failure (POF25 / SPGF96)'
  details: |
    New mechanism-first entry for biallelic SPATA22 disease, anchored on MONDO:0975843 (premature ovarian failure 25) with MONDO:0975843 and MONDO:0975842 (spermatogenic failure 96) carried as POF25 and SPGF96 subtype rows, following the HFM1-, STAG3- and SYCE1-related gametogenic failure entries. Deep research: research/SPATA22-related_gametogenic_failure-deep-research-claude_code.md (claude_code provider; 14/14 references resolved, 0 unresolved CURIEs; its one flagged item, PMID:34392356 attributed via LOVD, was fetched and read directly). just preflight-dr could not be run because no local MONDO build is present. The pathograph runs SPATA22 loss of single-stranded DNA binding (GO:0003697, sourced from PMID:33812231 and PMID:40296718, both reporting SPATA22 itself binds ssDNA; QuickGO carries only protein binding for SPATA22) to failed meiotic recombination and synapsis, early prophase I arrest with germ-cell loss, and sex-specific ovarian depletion and spermatogenic arrest, conforming to the meiotic_prophase_failure module. A 2026 heterozygous POI report (PMID:42098781) is recorded in notes and not modelled. No treatments were added because no SPATA22-specific management source was found. Validated with validate, validate-terms, count-verified-snippets (all verified), check-causal-targets, check-entity-refs, check-duplicate-keys and the gene-activity-grounding ratchet against origin/main.

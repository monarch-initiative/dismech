  details: |
    Responded to the CHANGES_REQUESTED review on PR 14379. Re-read the cached full text of PMID:42098781: its two variants are c.31C>T (p.Arg11Ter) and c.900+1G>A, the same pair PMID:35285020 reported as compound heterozygous in a sporadic POI patient, and the paper does not report phase or per-individual segregation; its heterozygous-sufficiency claim rests on a Spata22+/- mouse. Rewrote the entry notes and the genetic notes family count accordingly. Added the pedigree's clinical findings as exact quotes: irregular menstruation (HP:0000858), oligomenorrhea (HP:0000876), secondary amenorrhea (HP:0000869), elevated FSH (HP:0008232) and decreased AMH (HP:0031103) as POF25 phenotypes and as biochemical markers, plus PMID:42098781 as further POI evidence. Added a both-sex Infertility row (HP:0000789). Wired all new phenotypes downstream of the ovarian depletion node (Infertility also from spermatogenic arrest) and added evidence to the three previously uncited causal edges from snippets already in the entry. HP terms were taken from cache/hp/terms.csv and confirmed against OLS. The granulosa-cell mechanism remains unmodelled.

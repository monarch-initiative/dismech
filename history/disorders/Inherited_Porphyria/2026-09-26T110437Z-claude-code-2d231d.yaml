  summary: Record the four ClinGen gene-lump MONDO classes as broadMatch mappings
    on the porphyria subtype rows
  details: |
    Genetics pass under dismech#12257 (d2g series-050), inherited porphyria parent.

    Anchor: disease_term MONDO:0019142 inherited porphyria is kept. Note that OLS4 returns
    this term's description as a two-element list whose first element is an editor note
    about inherited versus sporadic porphyria cutanea tarda; the real definition is the
    second element and describes the group of eight hereditary heme-biosynthesis diseases
    this entry models.

    All five genes on the issue's reconciliation checklist (CPOX, HMBS, PPOX, UROD, UROS)
    were already curated, bound, and wired to per-enzyme pathophysiology nodes before this
    pass, so no genetics gap was found. What was missing was the mapping between the
    classical clinical subtype terms this entry binds and the four gene-named MONDO
    classes the gap list keyed on.

    Those four are ClinGen lumping classes, not duplicates: MONDO:0800180 says so in its
    own definition, and each sits as a direct MONDO parent of the classical term this
    entry already binds. Each is now recorded as skos:broadMatch on the affected
    has_subtypes row, with a note naming the descendants the lump covers that this entry
    does not model:

      MONDO:0700382 HMBS-related hepatic porphyria  -> Acute Intermittent Porphyria
      MONDO:0800180 CPOX-related hereditary coproporphyria -> Hereditary Coproporphyria
      MONDO:0700383 PPOX-related hepatic porphyria  -> Variegate Porphyria
      MONDO:0100498 UROD-related inherited porphyria -> Familial Porphyria Cutanea Tarda
                                                     and Hepatoerythropoietic Porphyria

    broadMatch is deliberate rather than exactMatch or narrowMatch: these classes are
    broader than the rows, and the coverage rule means a broadMatch does not retire the
    concept from the curation queue. That is the honest state, because the lumps' other
    children - harderoporphyria, the nonerythroid acute intermittent variant, and the
    porphyria-related encephalopathy and leukoencephalopathy concepts - are not modelled
    here.

    MONDO:0009902, listed on the checklist as cutaneous porphyria with gene UROS, needed
    nothing: it is already the subtype_term of the Congenital Erythropoietic Porphyria
    row, cutaneous porphyria being MONDO's primary label for that concept.
    stubs/Cutaneous_Porphyria.yaml was therefore deleted.

    Not changed, and left for a later pass: ALAS2 is bound as a gene on the Erythropoietic
    Protoporphyria subtype and on the erythroid protoporphyrin IX node but has no
    genetic: record of its own, and the UROD genetic record carries no subtype foreign key
    because it legitimately serves two subtype rows.

    Validation: just validate, validate-terms, count-verified-snippets and
    validate-disorders under linkml-reference-validator 0.3.0rc3. No snippet was added or
    changed by this pass.

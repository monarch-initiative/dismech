  summary: 'Review round: four more GeneReviews chapters, GATA1, reference titles'
  details: |
    Review round on PR #12302. The reviewer approved with three optional suggestions; all three were taken, two of them touching this entry.

    Tagged the four further GeneReviews chapters the Bookshelf index carries for subtypes this entry curates: Acute Intermittent Porphyria (PMID:20301372), Erythropoietic Protoporphyria Autosomal Recessive (PMID:23016163), Congenital Erythropoietic Porphyria (PMID:24027798) and Hepatoerythropoietic Porphyria (PMID:24175354), joining the three tagged in the first round. Three of them were mined for evidence rather than only tagged: the AIP chapter now backs the Hydroxymethylbilane Synthase Block node with its heterozygous-HMBS statement, the HEP chapter backs the Uroporphyrinogen Decarboxylase Block node with the sibship arithmetic that is the sharpest available statement of why one node carries two subtypes, and the CEP chapter backs the UROS gene record's biallelic lesion and recessive inheritance.

    Mining the CEP chapter turned up a gene this entry did not have and that is not on the issue's MONDO checklist: a hemizygous X-linked GATA1 variant is a rare alternative route to a congenital erythropoietic porphyria diagnosis. Added as a gene record with an X-linked inheritance block and a subtype foreign key, and bound on the CEP has_subtypes row, which is now the one subtype here with two genes and two modes of inheritance.

    GATA1 is deliberately left unwired to any pathophysiology node. It is a transcription factor rather than a heme-pathway enzyme, so none of the five per-enzyme-step nodes is its home, and neither the GeneReviews chapter nor anything else cited here states how it reaches the erythroid uroporphyrin accumulation. Gene-to-mechanism wiring therefore reads 7/8 rather than 7/7: the denominator grew by a real gene whose mechanism this entry does not model. An edge invented to keep the number at 7/7 would be worse than the honest 7/8.

    Also restored the trailing period on three reference_title values (PMID:30385147, PMID:30514647, PMID:33199206), copied from each cache file's own title frontmatter; twelve occurrences in total, including pre-existing ones, so the file is internally consistent.


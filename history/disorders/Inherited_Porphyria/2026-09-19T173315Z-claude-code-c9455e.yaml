  summary: 'Genetics pass: per-enzyme-step pathophysiology nodes wire 5 unwired genes'
  details: |
    Genetics pass under the genetics-gap campaign (issue #12200, epic #12189). Five of seven mechanism-relevant gene records reached no pathophysiology node: HMBS, ALAD, CPOX, PPOX and UROD. Wiring is now 7/7.

    The wiring is modelled on the enzymatic step rather than by listing the genes together, because in porphyria the step is the mechanism: which enzyme is blocked determines which intermediate accumulates and therefore which subtype a patient has. Five new pathophysiology nodes were added, one per blocked step -- Hydroxymethylbilane Synthase Block, ALA Dehydratase Block, Coproporphyrinogen Oxidase Block, Protoporphyrinogen Oxidase Block, Uroporphyrinogen Decarboxylase Block -- each carrying its gene with modifier DECREASED, the GO molecular function for that enzyme activity read from a lookup, a subtypes foreign key, conformance to heme_biosynthesis_porphyria#Heme Biosynthesis Enzymatic Block, and exact-quote evidence naming both the gene and the intermediate that accumulates behind it. The pre-existing group-level node is kept and its description now says explicitly that it is not where the individual genes hang.

    The UROD node carries two subtypes because that step splits on zygosity rather than on position: heterozygous variants give familial porphyria cutanea tarda, biallelic variants give hepatoerythropoietic porphyria. The UROD gene record therefore has no `subtype` foreign key, since that slot is single-valued; the reason is recorded in its notes.

    The MONDO checklist item for this entry is CPOX for MONDO:0007369 (hereditary coproporphyria), which was already a complete gene record. It is now additionally evidenced from the GeneReviews Hereditary Coproporphyria chapter, which was not previously cited anywhere in the entry. Two further GeneReviews chapters, Variegate Porphyria and Familial Porphyria Cutanea Tarda, were fetched, used, and tagged in the top-level references block.

    Also fixed: the Congenital Erythropoietic Porphyria subtype carried a free-text subtype_term with no bound term. It is now bound to MONDO:0009902, whose primary label reads "cutaneous porphyria" but which xrefs OMIM:263700 and Orphanet:79277, lists CEP and Gunther disease as exact synonyms, carries RO:0004003 to UROS, and is a direct child of this entry's disease term. The generic label is why a name search does not surface it; that is recorded in the subtype's review_notes. Gene bindings were added to every has_subtypes row and subtype foreign keys to the gene records.

    Validation: just validate, validate-terms, count-verified-snippets (89/89), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-genereviews, list-gene-term-mismatches, validate-disorders.

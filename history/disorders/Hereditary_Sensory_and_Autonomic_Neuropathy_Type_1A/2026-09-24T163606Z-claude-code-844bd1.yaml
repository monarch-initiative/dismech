  summary: 'Create: Hereditary_Sensory_and_Autonomic_Neuropathy_Type_1A'
  details: |
    New SPTLC1 HSAN1A entry curated from primary literature plus the GeneReviews SPTLC1-HSN chapter (PMID:20301564). Pathograph: SPT substrate shift (neomorphic, hgnc:11277) to 1-deoxysphingolipid accumulation to sensory and motor neuron toxicity, plus a retinal branch for macular telangiectasia type 2. Fifteen phenotypes, thirteen causally connected. Treatments: oral L-serine with the Fridman randomized trial (PMID:30626650), neuropathic pain pharmacotherapy, foot care, arthrodesis, and preclinical allele-specific GalNAc-LNA ASO silencing (PMID:41124364). C133W transgenic mouse curated as an animal model with modeled_mechanisms and readouts including the wild-type-subunit rescue. Deep research provider openscientist completed (EXIT 0, 34 references all resolved, 32 terms with one unresolved HP CURIE and four mis-named HP terms which were not used); its leads on founder allele, UK cohort frequency, incomplete penetrance, NMDAR-mediated toxicity, iPSC ganglioside deficits and the ASO study were each verified against a fetched source before use. just preflight-dr reported WARN only for an OMIM gene-versus-disease id difference. Validation: just validate (77 snippets, 78 titles, 0 issues), validate-terms, entity-refs, causal-targets, enum-values, duplicate-keys, delivery-system and validate-disorders all pass.

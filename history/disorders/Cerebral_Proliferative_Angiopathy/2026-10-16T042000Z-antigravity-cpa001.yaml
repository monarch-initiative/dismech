  summary: 'Review and expand Cerebral Proliferative Angiopathy entry: wire pathograph edges, add prevalence/progression/differential diagnoses, and fix ontology bindings'
  details: |
    Conducted completeness and quality review of Cerebral_Proliferative_Angiopathy against cached literature and Falcon deep research report. Added Harrison's chapter classifications (NEUROLOGIC, CARDIOVASCULAR), prevalence entries from the index Bicetre cohort (PMID:18239181; 49/1,434 brain AVM patients) and the 2020 PRISMA systematic review (PMID:32206904; 95 cases across 33 studies), progression phases covering onset demographics and long-term clinical outcomes, and a differential diagnosis block distinguishing CPA from classical brain AVM (MONDO:0007154). Added Thickened calvaria (HP:0002684; 43.8% in PMID:39833329), populated pooled phenotype frequencies from PMID:32206904 (headache 44.9%, seizure 37.1%, TIA 33.7%, hemorrhage 18.0%), and wired all 7 phenotypes to upstream pathophysiology mechanisms (7/7 causally connected, up from 0/6). Replaced coarse/inaccurate ontology bindings: Cerebral vascular malformation HP:0100026 -> HP:0002408 (Cerebral arteriovenous malformation), Indirect cerebral revascularization NCIT:C157806 (Cardiac Surgery) -> NCIT:C191567 (Invasive Revascularization Therapy), Targeted endovascular embolization NCIT:C49236 (Therapeutic Procedure) -> NCIT:C15230 (Embolization Therapy), added Conservative medical management (NCIT:C170740), and bound Digital subtraction angiography (NCIT:C190556) and histopathology Vascular Proliferation (NCIT:C35504).

  summary: 'Create: Staphylococcal Scalded Skin Syndrome'
  details: |
    New KB entry for staphylococcal scalded skin syndrome (MONDO:0018181), curated from a claude_code deep-research report (research/Staphylococcal_Scalded_Skin_Syndrome-deep-research-claude_code.md; 34/34 report references resolved, 0 unresolved, per the appended Reference Validation section). Modeled the six-node toxin cascade: localized S. aureus colonization with exfoliative toxin secretion, hematogenous toxin dissemination gated by host renal clearance and anti-toxin antibody, calcium-dependent single-bond cleavage of desmoglein 1 after Glu381, plakoglobin sequestration by the truncated cadherin, granular-layer acantholysis, and epidermal barrier failure with systemic complications. Eleven phenotypes, five treatments (including adjunctive clindamycin carried with REFUTE evidence for the null clinical result despite a sound ribosomal anti-toxin rationale), three diagnosis entries, three prevalence records, a three-phase progression, four differential diagnoses including the DSG1 genetic phenocopy SAM syndrome, two animal models with modeled_mechanisms and a readout, and four discussions (superantigen controversy, desmocollin-1 alternative target, host genetic susceptibility, dermal infiltrate fate). Deliberately no genetic block: SSSS has no causal human gene. Validated: just validate (schema) passed, just validate-terms passed, just count-verified-snippets reported 68/68 verified against cached references. One DR-sourced snippet was corrected during verification ('histone deacetylation' to 'histone deacetylase', PMID:21075858). Seeded cache/chebi and cache/enums for CHEBI:7447 and CHEBI:5098 by running the term validator against a local sqlite:obo:chebi adapter, then restored conf/oak_config.yaml unchanged.

  summary: Bind LOINC S. aureus nucleic acid code; culture arm left unbound
  details: |
    LOINC tranche B batch 28. This entry was deferred rather than rejected in batch 27, on the grounds that choosing between site-qualified and specimen-level S. aureus codes deserved its own pass. That pass resolved it in an unexpected direction.

    The real-time PCR arm takes LOINC:61404-0 (S. aureus DNA in Specimen by NAA with probe detection). The culture arm is left unbound, and the reason is specific. This row's clinical point is that periorificial swabs of the nares, throat, conjunctiva, umbilicus and perineum outperform blister fluid, so the site is the claim. LOINC's only plain S. aureus culture code carries no site at all, and every site-qualified S. aureus culture code in the 2.83 release is methicillin-resistant S. aureus, which asserts a resistance phenotype this entry does not claim. So there is no code that can express the row's actual point, and binding the site-less code would have quietly dropped it.

    Sources: observation-code existence and absence from the pinned Tuva LOINC 2.83 export (data/loinc/MANIFEST.yaml, sha256 verified, snapshot_date 2026-10-07), read in full at 112,405 rows with status and deprecation checked per code, so each result set is complete rather than a ranked page; Part-level questions from the Monarch KG, which the export cannot answer because it carries no LP or LG rows. Codes absent from cache/loinc/terms.csv on origin/main and seeded by the term validator against the Monarch KG; no label typed by hand. Checked against the 273 LOINC rows added by all 45 open loinc PRs, enumerated with pagination: no collision.

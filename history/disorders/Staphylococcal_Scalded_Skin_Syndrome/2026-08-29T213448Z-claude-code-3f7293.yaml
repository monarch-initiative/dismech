  summary: 'Review: Staphylococcal Scalded Skin Syndrome evidence re-read against
    cached sources'
  details: |
    Re-read all 17 cached references and re-verified all 77 evidence items. 76 of 77 matched
    their cache exactly. No Named Entity Confusion across the SSSS / bullous impetigo / TEN /
    pemphigus foliaceus / ETA-vs-ETB axis apart from the ETD finding below, and the whole
    desmoglein-1 cleavage chain is exactly sourced.

    Fixed in this pass:
    - pathophysiology[Desmosomal Cadherin Destabilization]: a genuine verbatim failure. The
      snippet read "Delta381-Dsg1" where PMID:21075858's cache has the Greek letter
      "Δ381-Dsg1". This is the item that would fail linkml-reference-validator. Restored.
    - The top-level description listed the SSSS exfoliative toxins as "(ETA, ETB, ETD)" and
      pathophysiology asserted "ETA, ETB, and ETD all converge on the same bond". ETD is
      uncited - the evidence covers ETA and ETB only - and is contradicted by a review the
      entry itself cites: PMID:39411997 says ETA and ETB "are responsible for most human cases
      of SSSS" and that ETD "is not strongly associated with SSSS". ETD removed from both
      claims and its status recorded in notes alongside the existing ETE paragraph.

    Recorded, not fixed:
    - animal_models[porcine EE] is graded MODEL_ORGANISM but that study has no live-animal
      experiment; it incubated baculovirus-expressed swine Dsg1 ectodomain in vitro.
    - differential_diagnoses[Pemphigus Foliaceus]: MODEL_ORGANISM on the paper's introductory
      rationale sentence about human pemphigus autoantibodies.
    - phenotypes[Hypothermia]'s sole evidence never mentions temperature.
    - Three phenotype explanations describe 1/21 as "within the OCCASIONAL band of 5 to 29%";
      1/21 is 4.8%.
    - Cefazolin is named and CHEBI-bound with no supporting citation.

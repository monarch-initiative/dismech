  details: |
    Addresses the CHANGES_REQUESTED review on PR 10176. The review's framing was right: nothing in the entry was wrong, but it under-consumed PMID:42253627, which this PR already commits as full text. Changes: connected the orphaned Immune Dysregulation with Autoimmunity and Vasculopathy node by adding an incoming edge from Collapse of TCR-to-RAS-ERK Signal Transduction, cited to the source sentence tying autoimmunity to impaired B-cell tolerance from the same lesion; added four phenotypes# downstream targets so the mechanism graph now reaches the clinical graph. Added frequency bands to four phenotypes (OBLIGATE for infections, VERY_FREQUENT for lymphoproliferation and autoimmunity, FREQUENT for lymphoma) each backed by its own cohort-percentage evidence item. Added seven phenotypes: DVT, splenomegaly, lymphadenopathy, ITP, TTP, pan-T-cell lymphopenia and Hodgkin lymphoma; the bundled vasculopathy phenotype was renamed and the venous event split out. Added a biochemical block for the antiphospholipid antibody panel. Added a prevalence CASES_IN_LITERATURE record with cohort size, family count, ancestry and median onset. Added two treatments - conservative immunosuppression, with its 45% mortality curated as REFUTE against it being adequate definitive management, and valganciclovir prophylaxis with EBV surveillance - and added the four-of-four remission outcome to the HSCT entry. Added coagulation screening to diagnosis. Added the CTPS1 and CD27-CD70 mechanism detail to the EBV node, which is the concrete reason this disease resembles the narrow-spectrum EBV IEIs. Added a HUMAN_MODEL_MISMATCH recording that mice are not susceptible to EBV, so the defining human arm has no animal counterpart while the autoimmune arm does. Regraded PMID:31402499 from HUMAN_CLINICAL to OTHER as a narrative review. TTP and DLBCL have no HPO terms; TTP is bound to the closest accurate parent with the specificity in preferred_term, DLBCL recorded in the lymphoma description. Snippets 54/54 verified; all gates pass.

  summary: 'Repair prefixed pathograph targets: Immunodeficiency_64'
  details: |
    Repaired 4 pathograph causal target(s) written with the `<kind>#<name>` entity-reference grammar in a slot that takes a BARE node name. This entry was merged to main while PR #10218 was open, so it post-dates that PR's sweep of the same defect and was caught by the new `check-causal-targets` gate the PR adds -- the gate would otherwise have turned main red on merge. `dismech.graph` matches these targets verbatim, so a prefixed value resolved to nothing: the edge was still appended but landed in `orphan_targets`, which the renderer draws as a phantom duplicate node while the real phenotype node dropped out of the graph. Only `target:` values changed; no claim, evidence item, description or ontology binding was touched. Verified by rebuilding the causal graph before and after: edge count unchanged, orphan targets to zero.

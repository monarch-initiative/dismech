  summary: 'Create: Immunodeficiency 64 (MONDO:0032803, RASGRP1)'
  details: |
    De novo curation of IMD64 / RASGRP1 deficiency (OMIM 618534). Sources: Salzer et al. 2016 (PMID:27776107, index kindred plus the DYNLL1/RhoA cytoskeletal arm and the lenalidomide rescue), Somekh et al. 2018 (PMID:30030704, replication and RAS-GTPase assays), Latour and Fischer 2019 (PMID:31402499, EBV-specific CD8 expansion), Mansour et al. 2023 (PMID:37898412), Ashari et al. 2026 (PMID:42253627, systematic review of 14+1 cases), and Iwig et al. 2013 (PMID:23908768, autoinhibition structure). Eight-node pathograph curated with two parallel arms from the same protein: a catalytic arm (TCR-RAS-ERK collapse -> failed antigen-driven expansion -> failed EBV-specific CD8 expansion -> EBV-driven B cell lymphoproliferation and lymphoma) and a RAS-independent cytoskeletal arm (loss of RASGRP1-DYNLL1 coupling -> reduced RhoA -> impaired NK cytotoxic synapse assembly). Lenalidomide curated with target_mechanisms against the cytoskeletal node and an attached KNOWLEDGE_GAP recording that the rescue is ex vivo only. Named Entity Confusion hazard recorded in notes and genetic review_notes: common RASGRP1 regulatory variants are GWAS autoimmunity susceptibility alleles and are deliberately not cited as evidence for any node. Validated with just validate, count-verified-snippets (33/33), check-entity-refs, check-duplicate-keys and the four baseline gates. Two classes of defect were caught and fixed before commit: three fabricated reference_title values taken from the deep-research report's citation labels rather than the reference cache, and one evidence_source divergence where the same quoted sentence was graded HUMAN_CLINICAL in one block and IN_VITRO in two others.

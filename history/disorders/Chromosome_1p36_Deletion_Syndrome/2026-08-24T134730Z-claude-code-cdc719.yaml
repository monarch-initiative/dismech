  details: |
    Created chromosome 1p36 deletion syndrome / monosomy 1p36 (MONDO:0011929), the most common terminal deletion in humans, from PMID:26345236 (Jordan 2015 update) and PMID:26910004 (Rocha size-phenotype review). Modeled terminal vs interstitial subtypes, contiguous-gene haploinsufficiency (candidate genes RERE/KCNAB2/PRDM16 etc.), and the size-severity discordance. Deleted the stub. Schema + term validation pass; 19/19 snippets verified.

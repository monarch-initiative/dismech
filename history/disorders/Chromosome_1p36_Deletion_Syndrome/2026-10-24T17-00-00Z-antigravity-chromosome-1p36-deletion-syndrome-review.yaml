  summary: Reviewed and enriched Chromosome_1p36_Deletion_Syndrome for compliance, ontology grounding,
    and evidence completeness.
  details: >-
    Added three Harrison's chapter classifications (GENETICS_ENVIRONMENT_DISEASE, NEUROLOGIC,
    CARDIOVASCULAR); evidence on the 1p36 Terminal Deletion -> Haploinsufficiency of 1p36 Genes edge;
    13 downstream edges from the Haploinsufficiency of 1p36 Genes node to the entry's phenotypes;
    diagnosis_term, description, presence, results and evidence on the Chromosomal Microarray
    diagnosis entry; and therapeutic_modality on the Multidisciplinary Supportive Care treatment.
    Phenotype frequencies and the genetic entry's evidence were already present and were not changed
    apart from line reflowing. No GO biological_processes, CL cardiac muscle cell or UBERON locations
    were added. A neuron cell_types annotation and evidence on both treatments were added in this
    session and then removed in review (see the follow-up history record), because the annotation had
    no supporting evidence and the treatment snippets listed phenotypes rather than management.

  summary: 'Review: Cockayne syndrome prevalence claim-evidence check'
  details: |
    Manual claim-evidence review of 10 microcephaly disorders. Cockayne edits: removed the deprecated Prevalence.percentage field from both prevalence records (the US record's value 0.000004 was also a raw fraction, not a percent); the structured rate_per_100000 values (0.4 and 0.27) are unchanged and correct. Reworded the US point-prevalence record's notes/explanation and downgraded its evidence to PARTIAL because the cited snippet (PMID:33536051) is a western-European INCIDENCE of ~1/360,000, not a US point-prevalence of ~1/250,000; it is retained only as order-of-magnitude corroboration. All other Cockayne claim-evidence pairs and PMIDs were spot-verified against PubMed and found accurate.

  summary: 'Genetics pass: add molecular CS-A/CS-B subtype rows carrying the MONDO
    gene terms, wire ERCC6/ERCC8 to the TC-NER node'
  details: |
    Genetics pass for issue #12193 (d2g wiring-004). MONDO records ERCC8 for MONDO:0019569 and ERCC6 for MONDO:0019570. Both genes were already curated; neither MONDO term was bound to a row that made a gene claim, and neither gene reached the pathograph.

    The axis problem, and how it was resolved. MONDO merges two independent subdivisions of Cockayne syndrome under numeric labels. MONDO:0019569 is labelled 'Cockayne syndrome type 1' but its definition is gene-specific, 'Cockayne syndrome caused by mutation(s) in the ERCC8 gene', and its exact synonyms include 'Cockayne syndrome A'. MONDO:0019570 is the same shape for ERCC6 and type B. The clinical literature uses types I, II and III for severity, and the two axes do not line up: the ERCC6 cohort cited in this entry contains four CS I, three CS II and one CS III patient, and its own abstract says there is no clear genotype-phenotype correlation for either gene. A previous curator had already spotted this and recorded it carefully, binding both terms at disease level with skos:narrowMatch and explaining in the mapping justification that binding them to the severity rows would import a gene claim those rows do not make.

    That reasoning is preserved, not contradicted. Two new has_subtypes rows were added with classification: molecular - 'Cockayne syndrome type A' (ERCC8, MONDO:0019569) and 'Cockayne syndrome type B' (ERCC6, MONDO:0019570) - so the gene claim MONDO's definitions make now has rows that make the same claim. The three existing severity rows gained classification: clinical_severity. The two disease-level mappings were kept as cross-references and their justifications extended to record where the authoritative binding now sits. Each genetic record gained relationship_type CAUSATIVE, variant_origin GERMLINE and a subtype foreign key to its molecular row.

    Pathograph. ERCC6 and ERCC8 were added as a genes list on Defective Transcription-Coupled Nucleotide Excision Repair, with a sentence explaining that both act at that single node - CSB is the ATP-dependent chromatin remodeler recruited to the stalled polymerase, CSA the substrate-recognition subunit of the ubiquitin ligase acting with it - so loss of either produces the same repair defect.

    ClinGen. Both genes gained their definitive gene-validity assertions. The ERCC6 one is scoped to 'Cockayne spectrum with or without cerebrooculofacioskeletal syndrome', which is recorded in the record's explanation because dismech curates COFS_Syndrome separately and that entry also binds ERCC6. UV-Sensitive_Syndrome, the mild allelic condition, binds both genes and is named in both records. No de Sanctis-Cacchione entry exists in kb/disorders, so nothing was duplicated there.

    Unsourced figure corrected. The ERCC8 record asserted 'accounting for approximately 25% of cases'. No reference cited by this entry states an ERCC8 case fraction; the 25 percent is the complement of the ERCC6 figure of approximately 75 percent that the cited snippet does give, and holds only on that source's premise that the two genes are together the predominant causes. The record now says so rather than presenting the number as reported. The two new subtype rows were written to avoid restating either figure as fact.

    Other. just tag-references added the GeneReviews tag to the Cockayne Syndrome chapter (PMID:20301516), which the entry already cited by PMID.

    Validation. just validate-pre-edit, count-verified-snippets 117/117, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, list-gene-term-mismatches all clean. Gene-to-mechanism wiring moved from 0/2 to 2/2.

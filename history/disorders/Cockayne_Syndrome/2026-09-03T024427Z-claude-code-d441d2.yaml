  summary: Add narrowMatch mondo_mappings for MONDO's numbered Cockayne type 1/2/3 classes
  details: |
    Issue #9868 asked that the numbered MONDO IDs folded by PR #9855's stub cleanup (Cockayne_Syndrome_Type_1/2/3) be re-bound so seed-stubs cannot re-nominate them. Added disease-level mappings.mondo_mappings entries (skos:narrowMatch, which the MONDO coverage index in src/dismech/compare/mondo_priority.py does read) for MONDO:0019569, MONDO:0019570 and MONDO:0008998.

    Correction (PR #10654 review round 2): the first version of this record, and the mapping_justification prose it describes, claimed MONDO's numbered terms sit on a gene axis distinct from this entry's clinical-severity has_subtypes. That is not what the records say, and the justifications have been rewritten. Resolving all three against MONDO shows each class merges both axes at once: MONDO:0019569 is defined as "Cockayne syndrome caused by mutation(s) in the ERCC8 gene" yet carries the exact synonyms "Cockayne syndrome type I" and "Cockayne syndrome classic form"; MONDO:0019570 likewise pairs an ERCC6 definition with the exact synonym "Cockayne syndrome type II". MONDO:0008998 is the clearest counterexample to the original claim -- it asserts no gene relationship whatsoever and its definition is purely the severity grade ("also known as the mild form ... not noticeable until later in childhood"), making it the same concept as this entry's has_subtypes row "Cockayne syndrome type III" rather than a gene-unresolved stratum.

    The bindings themselves are unchanged and remain correct: narrowMatch asserts containment, not sameness, so an overlap with the severity subtypes is not a defect. They are kept at disease level rather than on has_subtypes[].subtype_term because MONDO:0019569/0019570 carry gene-specific definitions, and binding them to a row that makes only a severity claim would import an ERCC8/ERCC6 causal claim that row does not make.

    Validated with just validate, just validate-terms, just check-duplicate-keys, just check-entity-refs, just check-enum-values, the batched just validate-disorders sweep (269/269 snippets verified across the 3-file tranche), and pytest -k Cockayne.

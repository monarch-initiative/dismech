  summary: Add narrowMatch mondo_mappings for MONDO's numbered CSA/CSB/type-3 strata
  details: |
    Issue #9868 asked that the numbered MONDO IDs folded by PR #9855's stub cleanup (Cockayne_Syndrome_Type_1/2/3) be re-bound so seed-stubs cannot re-nominate them. Unlike Bartter/Lynch, this entry's has_subtypes (Cockayne syndrome type I/II/III) encode a different axis than MONDO's numbered terms: the KB rows are the classic clinical-severity classification (mild/classic/severe), while MONDO:0019569/0019570/0008998 are the gene-specific CSA (ERCC8) / CSB (ERCC6) / gene-unresolved strata (confirmed by resolving each stub's recorded gene against this entry's existing genetic: block, and checking MONDO's own synonyms 'Cockayne syndrome, type A'/'type B'/'type C'). Binding these onto has_subtypes[].subtype_term would have been a Named-Entity-Confusion-style mismatch, so instead added disease-level mappings.mondo_mappings entries (skos:narrowMatch, which the MONDO coverage index in src/dismech/compare/mondo_priority.py does read) for all three, with mapping_justification explaining the axis distinction. Validated with just validate, just validate-terms, just check-duplicate-keys, just check-entity-refs, just check-enum-values, the batched just validate-disorders sweep (269/269 snippets verified across the 3-file tranche), and pytest -k Cockayne.

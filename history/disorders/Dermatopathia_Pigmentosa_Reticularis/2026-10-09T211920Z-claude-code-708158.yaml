  summary: 'Create: Dermatopathia_Pigmentosa_Reticularis'
  details: |
    Created the DPR entry (MONDO:0007445) from the Perplexity deep-research report
    research/Dermatopathia_Pigmentosa_Reticularis-deep-research-perplexity.md, which passed
    just preflight-dr (KRT14 mentioned 28 times; OMIM 125595 matches MONDO). The report's
    reference validation resolved 20/20 identifiers and flagged needs_review for two off-topic
    PMC records: PMC6440173 is a DPR case report (PMID:30983613) and PMC5672609 an acral
    reticulate pigmentary disorder review; neither was needed as evidence. Further DPR
    literature was found by PubMed esearch ("dermatopathia pigmentosa reticularis", 42 hits)
    and fetched with just fetch-reference.

    Lump/split: DPR is curated as its own entry, not as an NFJS/DPR spectrum with subtypes.
    MONDO (MONDO:0007445 vs MONDO:0008059), OMIM and the case literature keep two diagnoses,
    distinguished by lifelong versus fading pigmentation, alopecia in DPR and dental defects in
    NFJS. The mechanism is plausibly shared (both caused by heterozygous KRT14 head-domain
    nonsense/frameshift variants, PMID:16960809), but molecular evidence for DPR rests on one
    family in that study and the haploinsufficiency and TNF-alpha apoptosis data are from NFJS
    alleles (PMID:18049449), so the evidence does not clearly show one conserved pathograph
    that differs only in phenotype. The NFJS stub is left in place for separate curation; a
    future grouping or lump can revisit this once NFJS is curated.

    Pathograph: KRT14 head-domain truncating variant -> keratin 14 haploinsufficiency
    (PROVISIONAL, NFJS-derived) -> increased basal keratinocyte apoptosis (patient
    ultrastructure + HaCaT TNF-alpha assay) -> basal layer degeneration and pigment
    incontinence -> reticulate hyperpigmentation; a hypothetical developmental branch to
    adermatoglyphia and hypohidrosis; case-discussion edges to nail dystrophy and keratoderma.
    A rod-domain p.R125C DPR case (PMID:19040520) is recorded as a variant that does not fit
    the head-domain mechanism.

    Not quotable on the fetches made (content_type unavailable after --force retry):
    PMID:30968399, PMID:39106435, PMID:20180888, PMID:7591467; listed under references with
    no evidence. No disease-specific GeneReviews chapter (just check-genereviews: NO_CHAPTER).

    Validation: just validate, count-verified-snippets (56/56), validate-terms,
    check-entity-refs, check-causal-targets, check-genereviews and validate-disorders run on
    the file.

  summary: Review axial SMD against primary full texts and distinguish clinical findings from model inference
  details: 'Reviewed the complete entry and three prior CREATE/EDIT histories; no prior REVIEW event was present.
    This Mendelian skeletal-retinal disorder is eligible under the campaign''s infectious/environmental exclusions.
    Refreshed origin/main; worktree HEAD matched current main before changes.


    Read the substantive Perplexity report and its citation sidecar, resolving preflight gene heterogeneity against
    CFAP410/NEK1. The report ends at section 9.1 and contains wrong PMID assignments and ontology labels; it was
    used as leads only. Correct primary identifiers are PMID:26974433 and PMID:28123176; the Shinbashi paper is
    PMID:36950666/DOI:10.1002/ccr3.7110, not off-topic PMID:37477485. Report claims of complete penetrance and unmeasured
    Hedgehog/GLI signaling were not adopted.


    Primary source consumption: read the cached full scientific text, methods, results, figures/captions and tables
    of PMID:26974433, 26167768, 37188479, 40246852, 39232248, 37901396, 39255848, 40018707, 23371363 and 36950666.
    Read the complete 2025 clinical supplement via the Europe PMC supplementary-file archive, including skeletal
    and variant tables. The supplemental PDF was retained under tmp; no reference-cache file was hand-written. Regenerated
    the four original abstract-only caches (21910225, 26294103, 28123176, 9266195) and read those abstracts; also
    read 20503334. A publisher recovery attempt for 28123176 exposed only an abstract and a login requirement, so
    no inaccessible clinical detail was inferred. The ALS-focused 40282367 review was screened as related-gene background;
    ALS-specific TDP-43/cyclin-F hypotheses were not transferred into axial SMD. Other uncited retinal VUS reports
    were not promoted to causal axial SMD variants.


    Full text changed the conclusions: nine of 13 patients (six of nine families) were CFAP410-positive in 2016,
    with previously reported families overlapping earlier series. The 49-person 2025 ophthalmic cohort is not an
    axial SMD penetrance study; its 11 skeletal cases have heterogeneous findings and five patients lacked skeletal
    examination. Patient 7 had chest-expansion surgery, contradicting the prior no-intervention statement. Clinical
    counts, progressive femoral-neck shortening, coxa vara, scoliosis, nystagmus, flattened femoral heads, short
    ribs and metacarpal involvement were added. The apparent axial restriction and static adult course were corrected.
    Low-vision support and repeated ophthalmic examination now have source evidence.


    Mechanistic distinctions: co-immunoprecipitation is not purified direct binding; NEK1 kinase-dead protein rescues
    CFAP410 abundance but not ciliogenesis. OUMS-27 knockdown measures cartilage-marker expression, not failure
    of a patient growth plate; ATDC5 is an unperturbed expression time course. Photoreceptor localization does not
    demonstrate transport failure. The HR phenotype is from knockdown reporters, not an assay of each patient allele
    or proof of skeletal disease mediation. p.Tyr107His/p.Pro116Leu instability and ubiquitination are distinct
    from reduced CFAP410 abundance following NEK1 knockout. Structural studies distinguish N-terminal solubility
    and modest localization effects from C-terminal p.Leu224Pro tetramer disruption. The latter allele was initially
    reported in a Jeune-labeled family; broader ciliopathy models are explicitly scoped. Algal knockout does not
    reproduce the marked mammalian ciliation phenotype; differing Results/Discussion wording is retained. Zebrafish
    experiments use transient nek1 morpholinos and cross-gene rescue, not a stable axial SMD genetic model or treatment
    trial.


    Seven primary alleles are captured individually. The c.643-23A>T RNA result predicts an elongated altered-C-terminal
    protein; c.545+1G>A yields cryptic splice products with predicted truncation/NMD, not measured NMD. The 2016
    discussion''s c.545+1C>T is a source typo; Results/Table 2 specify G>A. The 2023 detailed assessment calls p.Pro116Leu
    likely pathogenic despite broader abstract wording. Isolated-retinopathy variants c.335_346del and p.Leu9Pro
    remain outside this axial SMD causal allelic series.


    Completeness cross-check: (1) Phenotypes: major clinical manifestations and observed cohort frequencies covered;
    genotype/ascertainment limits explicit. (2) Subtypes: CFAP410 and NEK1 etiologies distinguished in genetics,
    without inventing ontology subtypes. (3) Mechanisms: ciliation, association, selected-allele stability, cartilage
    markers and HR included; uncertain tissue-level edges labeled indirect. No unsupported patient histology. (4)
    Treatments/trials: respiratory assessment, low-vision support, counseling, reported chest expansion and ophthalmic
    surveillance covered. Live ClinicalTrials.gov API queries CFAP410, C21orf2 and exact axial spondylometaphyseal
    dysplasia returned zero records on 2026-09-27; this is a search result, not proof no broad retinal trial could
    enroll a patient. (5) Genetics: seven primary alleles, variable expression, residual function and RNA evidence
    included. (6) Diagnostics/biomarkers: skeletal survey, molecular testing, repeated ophthalmic examination and
    electrophysiologic distinctions; no validated molecular biomarker established by these studies. (7) References:
    central primary full texts and newer structural work consumed; exact snippets carry cached titles. (8) Overall:
    adequate disease-specific coverage with related-retinal/ALS/model findings scoped explicitly. GeneReviews and
    StatPearls index checks found no disease chapter. The unresolved mechanistic explanations remain discussions,
    not asserted pathways.


    PRIDE PXD036410 metadata was fetched through just fetch-reference using the official PRIDE API URL and committed
    as a per-record generated cache. The paper and repository agree on identity; five biological replicates per
    genotype in each of two bait comparisons are recorded. The retired shared dataset-accession blob was not read
    or recreated.


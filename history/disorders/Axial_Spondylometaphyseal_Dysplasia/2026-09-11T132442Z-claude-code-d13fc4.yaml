  summary: 'Review round 1: Axial_Spondylometaphyseal_Dysplasia (PR #11684)'
  details: |
    Addressed both blocking findings from the ai4c-reviewer CHANGES_REQUESTED review on PR #11684, plus two of the non-blocking suggestions. All findings accepted; none disputed.

    FINDING 1 - PMID:21910225 (Suzuki 2011) absent and uncached. Accepted and acted on; the reviewer was right that three separate gaps traced to one uncited paper. Fetched, cached, and now cited nine times. Consequences:
      (a) The Thoracic Constriction and Restrictive Ventilation node dead-ended without reaching a phenotype. It now has two downstream edges to new phenotypes, Neonatal respiratory distress (HP:0002643) and Recurrent respiratory infections (HP:0002205), both evidenced from the same sentence that attributes them to thoracic hypoplasia.
      (b) Growth was collapsed to Short stature. Split into Postnatal growth retardation (HP:0008897), Rhizomelia (HP:0008905, CHILDHOOD onset) and Disproportionate short-trunk short stature (HP:0003521), because the source describes an evolving pattern rather than a static one and the evolution is itself the observation.
      (c) The cone-rod versus rod-cone framing was WRONG, and this is the most substantive correction in the round. The entry implied two competing frequencies. In the clinically ascertained series the SAME eyes are called retinitis pigmentosa on fundoscopy and cone-rod dystrophy on electroretinogram - two instruments, one retina. Both phenotype records were rewritten to say so, the rod-cone frequency was raised from OCCASIONAL to FREQUENT since it was never a minority share, and the pathophysiology node description now distinguishes that series from the ophthalmically ascertained CFAP410 cohort where the two-to-one cone-rod majority actually is a population statistic.
      (d) The respiratory treatment's 'nothing quotable exists' note was true only because this paper had not been cited. Replaced with real evidence plus a note distinguishing what that evidence does establish (the risk) from what it does not (the management).
      Also added from the same paper: consanguinity and sibling-pair segregation evidence on the inheritance block, and a patient count (seven from five families) on prevalence.

    FINDING 2 - three bindings had a more specific term available. All accepted: CL:0000138 chondrocyte to CL:1000217 growth plate cartilage chondrocyte; GO:0003416 endochondral bone growth to GO:0003418 growth plate cartilage chondrocyte differentiation; HP:0002867 Abnormal ilium morphology to HP:0011867 Abnormal iliac wing morphology. All three were verified against OLS before writing.

    NON-BLOCKING, NOT DONE, with reason: the suggested mappings block for OMIM 602271 and ORPHA 168549 cannot be written. The Mappings class carries only icd10cm_mappings, icd11f_mappings, mondo_mappings and ncit_mappings; there is no OMIM or ORPHA slot. The OMIM identifier does now appear in the entry, inside a verified snippet, because Suzuki's abstract states it. PMID:20503334 (Isidor 2010) was fetched but is not cited: its content adds nothing the Suzuki series does not state more completely.

    Evidence count rose from 42 to 54 snippets across 9 PMIDs, all exact-quote verified. Re-validated with just validate (schema, terms, 54/54), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, and a bulk id/label comparison against OLS (0 mismatches of 36 pairs).

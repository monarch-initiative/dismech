  details: |
    The reviewer approved this PR and said explicitly that none of its five non-blocking suggestions needed another push. Two of them are nevertheless corrections rather than polish, so they are taken here; the other three are declined with reasons. The cost is the approval, which a push resets under dismiss_stale_reviews - accepted deliberately because both changes make the entry less assertive than the source warrants, which is the class of error this project treats as worth a cycle.

    Taken:
    - Removed severity: MODERATE from the Neonatal respiratory distress phenotype term. Suzuki reports 'mild to moderate'; the slot is single-valued, so recording either end asserts a grade the source does not. The description now says so, rather than leaving the omission unexplained for the next curator to 'fix'.
    - Added directness: INDIRECT to the Suzuki evidence on Respiratory surveillance and supportive care. The quoted sentence states the hazard; the indication for surveillance follows from it by an inference step. CLAUDE.md names this exact pattern, and the reasoning was previously only in explanation prose where nothing can query it.

    Declined, with reasons stated in the PR reply:
    - The mappings block still cannot hold OMIM 602271 or ORPHA 168549. Verified again against the schema: DiseaseMappings carries only icd10cm_mappings, icd11f_mappings, mondo_mappings and ncit_mappings. The reviewer's point that the OMIM id is now quotable from a cached abstract is correct but does not create a slot to put it in. The identifier does appear in the entry inside a verified snippet.
    - PMID:20503334 (Isidor 2010) stays uncited. The reviewer notes the cached Suzuki abstract names it as the two additional cases feeding the 2011 nosology, which is true, but everything it reports is stated more completely by Suzuki; citing it would add a reference without adding a claim.
    - preferred_term 'retinitis pigmentosa on fundoscopy' keeps the modality. The modality is the whole point of that record - the reframing this round turned on the same eyes being described two ways - so encoding it in the display name is carrying the finding, not decorating it.

    Validation: just validate-disorders (schema, terms, 54/54 snippets); check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-snippet-grading, check-title-snippets, check-snippet-length, check-reference-titles, check-folded-hyphens all clean. No cache rows added.

    Separately noted by the reviewer and not addressed here because it is not this PR's: check-snippet-grading reports a pre-existing divergence in kb/disorders/Wilsons_Disease.yaml (PMID:36010023 graded HUMAN_CLINICAL in one block and OTHER in another). That file is outside this diff.

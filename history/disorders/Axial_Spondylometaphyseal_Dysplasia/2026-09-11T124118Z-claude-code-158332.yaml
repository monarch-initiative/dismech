  summary: 'Create: Axial_Spondylometaphyseal_Dysplasia'
  details: |
    De novo curation of axial spondylometaphyseal dysplasia (MONDO:0011211; CFAP410/C21orf2 and NEK1) from a Perplexity sonar-deep-research report plus independent PubMed retrieval.

    Deep research: research/Axial_Spondylometaphyseal_Dysplasia-deep-research-perplexity.md (perplexity, sonar-deep-research, 396.3 s, 19 citations). Produced only after the installed deep-research-client Perplexity provider was patched locally to stream; see dismech#9357, which is already open with the same diagnosis and fix, so no duplicate issue was filed and no repository file was changed.

    just preflight-dr returned WARN: rival gene NEK1 mentioned 67 times against CFAP410's 84. Checked and dismissed as a false positive - NEK1 is a genuine second locus for this same disease (PMID:28123176), not a second disease bleeding into the report. Recording this because the WARN text tells a curator to exclude those sections, which would have been wrong here.

    The report's reference_validation flagged PMID:37477485 as off topic; it resolves to a paper on optical voltage imaging in neurogenic erectile dysfunction and is unrelated. Not cited. Its term_validation reports 13 of 47 checked labels mismatched, among them CL:0000097 offered as 'chondrocyte' (CL: mast cell), CL:0000742 as 'cone photoreceptor' (periarticular chondrocyte), GO:0035994 as 'primary cilium assembly' (response to muscle stretch) and HP:0000944 as 'Metaphyseal dysplasia' (Abnormal metaphysis morphology). No CURIE was taken from the report.

    Mistake made and corrected during curation, recorded because the failure mode is the one CLAUDE.md warns about: NCIT:C38101 was written with the label 'Diagnostic Imaging' from recall rather than from a lookup performed in the same step. Term validation caught it; the CURIE is real and the concept is right for a skeletal survey, but its canonical label is 'X-Ray Imaging'. Fixed by reading it from OLS. A second validation failure was a schema one - causal_link_type 'INDIRECT' is not a permissible value; the correct value for this edge is INDIRECT_UNKNOWN_INTERMEDIATES.

    Evidence: 42 snippets across 8 PMIDs, all exact-quote verified. Two pathophysiology nodes declare conforms_to against ciliopathy_dysfunction (basal body/transition zone, photoreceptor connecting cilium). The module's #Skeletal Dysplasia with Polydactyly and Thoracic Constriction node was deliberately not claimed because polydactyly is absent in this disease; the reasoning is written into the entry description rather than left as an omission.

    The chondrocyte arm of the pathograph is marked INDIRECT_UNKNOWN_INTERMEDIATES on purpose: no Hedgehog or other ciliary signalling readout has ever been measured in an axial SMD chondrocyte, and the only functional datum is described by its own authors as suggestive. Three knowledge gaps are recorded - the unmeasured signalling step, whether the homologous-recombination arm of the CFAP410-NEK1 complex contributes to either tissue phenotype, and why the dysplasia is confined to the axial skeleton.

    Validated with just validate (schema, terms, 42/42 snippets), check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms.

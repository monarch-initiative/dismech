  summary: 'Create: Distal Hereditary Motor Neuronopathy Type 9 (WARS1)'
  details: |
    New Disease entry for dHMN type 9 (MONDO:0060585, OMIM:617721), the WARS1-related autosomal dominant distal motor neuronopathy. Six pathophysiology nodes modelling a deliberately two-armed mechanism: the recurrent p.His257Arg allele acts as a dominant negative on TrpRS aminoacylation (reducing global protein synthesis) AND potentiates the non-canonical angiostatic TrpRS/VE-cadherin interaction. Which arm produces the neurite phenotype is unresolved in the source and is curated as an open KNOWLEDGE_GAP rather than settled toward the loss-of-charging story; a HUMAN_MODEL_MISMATCH records that all cellular evidence comes from transfected lines and rat motor neurons, which cannot test the length dependence that defines the disease. Conforms to peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination at the axonal-degeneration node only. Four phenotypes including a Sensory involvement entry curated specifically to record the conflict between the pure-motor dHMN definition and a Korean cohort that found sensory involvement in its WARS1 patients. Differential diagnoses cover the biallelic WARS1 neurodevelopmental syndrome (MONDO:0957218) and, critically, HMNR9/COQ7 (MONDO:0957874) - OMIM assigned the number 9 twice in this series, and the COQ7 form is potentially treatable with coenzyme Q10 while this one is not. Deep research: claude_code provider; report validation 9/9 references verified, confabulation_rate 0.0. just preflight-dr returned WARN (COQ7 at 51 percent of WARS1 mentions); inspection showed the report itself separated the two entities correctly, so it was a true-positive warning on a clean report and the COQ7 sections were excluded rather than the report discarded. Validation: just validate passed, 38/38 snippets verified against cached references; check-duplicate-keys clean; no folded hyphens; no short snippets. ClinGen rates WARS1-dHMN as Limited but is not cited, because that assertion postdates the pinned ClinGen snapshot and re-pinning does not belong in a curation PR - recorded in notes instead.

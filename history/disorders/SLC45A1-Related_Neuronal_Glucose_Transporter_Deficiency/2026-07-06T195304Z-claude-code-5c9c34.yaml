  summary: 'Create: SLC45A1-Related Neuronal Glucose Transporter Deficiency'
  details: |
    De-novo curation of the ultra-rare SLC45A1-related neurodevelopmental disorder (MONDO:0044322, OMIM:617532), part of metabolic WP-009. NEC preflight performed: MONDO:0044322 def cites Srour et al. 2017 and carries a direct RO:0004003 gene relationship to HGNC:17939 SLC45A1, confirming the seed OMIM id with no named-entity-confusion risk. Literature search via PubMed esearch/efetch (SLC45A1[TIAB]) identified only three usable primary/case reports as of 2026-07-06: Srour et al. 2017 (PMID:28434495, founding gene-disease paper, two consanguineous families, functional glucose-transport assay), Zhou et al. 2024 (PMID:39003656, independent compound-heterozygous family with mislocalization/activity-attenuation functional data), and Semal et al. 2025 (PMID:40541196, fifth reported patient, ketogenic-diet and acetazolamide response). All PMIDs fetched via just fetch-reference (abstract-only cache; full text behind paywalls at cell.com/wiley). All evidence snippets are exact substrings of the cached abstracts (two snippets adjusted to avoid a mid-sentence line-wrap/bracket artifact in the Srour abstract). Ontology terms verified with OAK: hgnc:17939 SLC45A1, GO:0055056 D-glucose transmembrane transporter activity, GO:1904659 D-glucose transmembrane transport, CL:0000540 neuron, CHEBI:17234 glucose, UBERON:0000955 brain, HP:0000007 autosomal recessive inheritance, HP:0001249 intellectual disability, HP:0007359 focal-onset seizure, HP:0000739 anxiety, HP:0001263 global developmental delay, MAXO:0000088 dietary intervention, NCIT:C15986 Pharmacotherapy, CHEBI:27690 acetazolamide. Pathophysiology chain limited strictly to what the papers document: SLC45A1 loss of function to reduced glucose transport activity in vitro to proposed impaired neuronal glucose transport (by analogy to GLUT1/SLC2A1 deficiency) to neurodevelopmental/epileptic phenotype, flagged in descriptions where the link is proposed/analogical rather than directly measured (e.g., CSF glucose was not reported low in these patients, unlike GLUT1 deficiency). Passed just validate, just validate-references, and just validate-terms.

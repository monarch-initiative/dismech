  details: '- Added `classifications` (Harrison''s `NEUROLOGIC`, `ENDOCRINOLOGY_METABOLISM`, and `GENETICS_ENVIRONMENT_DISEASE`;
    ICIMD `carbohydrate_transport_and_absorption`).

    - Enriched `pathophysiology` trigger node (`SLC45A1 Loss of Function`) with `SLC45A1` gene, GO molecular
    function (`GO:0055056` D-glucose transmembrane transporter activity), GO biological process (`GO:1904659`
    D-glucose transmembrane transport), CL `neuron`, CHEBI `glucose`, UBERON `brain`, and downstream links
    from `Impaired Neuronal Glucose Transport` to phenotypes.

    - Standardized phenotype categories to `Neurological`, added `diagnostic: true` to core phenotypes,
    and replaced title snippet on `Neuropsychiatric Features` with body text.

    - Added `variant_origin: GERMLINE` to `genetic` entry.

    - Added `diagnosis` section (`Whole Exome Sequencing`, `Electroencephalography`) with NCIT bindings
    and exact-quote evidence.

    - Added `therapeutic_modality` to `treatments` and `target_mechanisms` (`BYPASSES`) to `Ketogenic
    Diet`.


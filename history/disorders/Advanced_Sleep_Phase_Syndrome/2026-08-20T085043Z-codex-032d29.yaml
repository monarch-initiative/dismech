  summary: Add computational models for Advanced Sleep Phase Syndrome
  details: |
    Added two disease-specific PER2 phosphorylation ODE models, a coupled sleep-wake and circadian chronotype model, and a wearable-light phase-estimation model. Linked each model only to exact existing pathophysiology nodes, with explicit fidelity, readouts, evidence, and limitations. Inspected and pinned two public repositories, recorded license and dependency constraints, and independently smoke-tested the published revised phosphoswitch equations. A bounded OpenScientist run with hypotheses enabled completed with 17 of 17 references resolved but emitted no hypothesis section. Its report was manually reviewed and did not contribute claims because automated entity-gene preflight was indeterminate and the report retained outdated kinase assignments.

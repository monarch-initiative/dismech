  summary: 'Create: Advanced Sleep Phase Syndrome (MONDO:0015609)'
  details: |
    De novo curation of advanced sleep phase syndrome (ASPS/ASWPD, MONDO:0015609). Deep research via Edison/Falcon (research/Advanced_Sleep_Phase_Syndrome-deep-research-falcon.md, 22 citations, 600s). All DR leads treated as leads only: every PMID re-fetched via just fetch-reference, every snippet verified as an exact substring of the cached abstract, every ontology ID OAK-resolved and its definition read. Falcon emitted 6 semantically wrong ontology IDs that were rejected (HP:0002367 = Visual hallucination not 'Abnormality of sleep'; HP:0002189 obsolete; HP:0012686 = Increased pineal volume not 'Abnormality of circadian rhythm'; HP:0031473 = Anger not 'Impaired social interactions'; NCIT:C15407 = Family Study not Phototherapy; NCIT:C101216 = Myopathy not Melatonin) plus one mislabel (UBERON:0002034 called 'hypothalamus'). Mechanistic centrepiece is the familial form: a PER2-substrate (S662G, CK1 phosphoacceptor loss) and CSNK1D-kinase (T44A) convergence modelled as an explicit kinase-to-substrate causal edge evidenced by CKIdelta dosage epistasis (PMID:17218255), converging with CRY2 A260T (FBXL3 degradation) and PER3 destabilization on altered PER/CRY feedback, then on a shortened intrinsic period that yields an advanced phase angle of entrainment. TIMELESS modelled on a separate photic-entrainment branch since its mice show normal organismal period. Delayed-sleep-phase contamination actively guarded against: CRY1 and DEC2 deliberately excluded with written rationale, treatment direction (evening bright light, morning melatonin) verified correct in all five places it appears, and AASM non-endorsement of melatonin for ASWPD recorded as NO_EVIDENCE rather than implied support. Red-teamed against dismech-pr-review before opening the PR; fixes included replacing GO:0042754 (means loss of rhythmicity, opposite of the claim), removing a misleading HP term from a preserved-normal phenotype, upgrading CL:0000740 to CL:0020014 and NCIT:C15184 to NCIT:C63474, splitting mixed human/in-vitro evidence items, and dropping an unsupported frequency band. Validation: just validate PASS, validate-terms PASS, validate-references 75/75 snippets verified, compliance 84.4 percent (weighted 84.7), compliance-connectivity reports no gaps (all phenotypes causally connected, all causal genes wired). All 84 reference_title values scripted-checked against cached paper titles per issue 7536.

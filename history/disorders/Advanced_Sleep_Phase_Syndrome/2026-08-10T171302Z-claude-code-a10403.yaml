  summary: Link the two light exposures and the social schedule
  details: |
    Backfill for issue #8085. Three links, all EXACERBATES with DIRECT, but pointed at two different nodes for a reason that matters. The two light exposures reach the photic entrainment node, because light acting on the entrainment pathway is that node's own content. The social schedule reaches the misalignment node instead, because a schedule does not shift the clock; it sets what the clock must line up with, and this entry models that as the step at which an advanced clock becomes a disorder. The evidence for the schedule link approaches the claim from the opposite direction, observing that people who can adapt to an early chronotype seldom present, which is the same claim seen through ascertainment. Between the two light links, insufficient evening light is graded above morning light because its evidence is better rather than because its biology is stronger: its sentence names both halves of the behavioural contribution and states that the result is an advanced rhythm and a raised risk of an early sleep phase, which is the direction the morning-light sentence leaves out. That morning-light item is graded PARTIAL here while the same sentence is recorded as supporting on the node itself. The divergence is deliberate and is now stated in the item's explanation: the node claims that light entrains the pacemaker, which the sentence states outright, whereas the link claims that morning light reinforces an advance, which it does not. It was surfaced by a new check in the generator that compares each new evidence item against items on its target node, added after the review of PR #8293. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 121 of 121 verified.

  details: |
    Addressed the round-1 review of PR #17071. Retargeted the oral antidystonic pharmacotherapy edge to Generalized dystonia and the botulinum toxin edge to Retrocollis, since neither acts on PKR or eIF2-alpha. Removed the deep brain stimulation target_mechanisms edge, whose only evidence was a table-legend line recording that surgery was done; the treatment description now says the source reports no DBS outcome. Removed neuron, brain, collection of basal ganglia and regulation of translation from both molecular nodes, because PMID:33236446 measures only patient skin fibroblasts and does not measure translation. Kept fibroblast on the stress-response node only, and removed the duplicated integrated stress response process from the PKR node. Added an environmental entry for intercurrent viral or febrile illness (ECTO:3000001 exposure to virus) with its own evidence and an EXACERBATES link to the stress-response node, marked INDIRECT because the PKR route is inferred. Did not bind a botulinum toxin therapeutic_agent: the source does not name the serotype, and the admissible cached term is type A specifically.

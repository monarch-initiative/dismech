  summary: 'Create: Dystonia 33 (EIF2AK2)'
  details: |
    De novo curation of DYT33 (MONDO:0030513, OMIM 619687), autosomal-dominant isolated dystonia from a recurrent heterozygous EIF2AK2 (PKR) missense variant. Deep research via Perplexity. One pathophysiology node (EIF2AK2/PKR dysfunction, GO:0004694 eIF2-alpha kinase activity) -> Dystonia (INDIRECT_UNKNOWN_INTERMEDIATES; the path from kinase dysfunction to dystonia is not established). Causative-gene status and the dystonia phenotype cited from generalized-dystonia review PMID:40841848 (REVIEW_SYNTHESIS); EIF2AK2/PKR gene mechanism from the founding EIF2AK2 report PMID:32197074 (BACKGROUND gene facts; the reduced-kinase-activity IN_VITRO finding there was measured on the de novo LEUDEN alleles, not the DYT33 allele, and is labelled accordingly). DYT33-specific primary reports (PMID:33866603, 35146068, 36670070) have no retrievable abstracts/PMC full text, so no exact quote could be taken; recorded in notes. Distinct from, though allelic with, the de novo EIF2AK2 neurodevelopmental leukoencephalopathy LEUDEN (OMIM 618877). All gates pass.

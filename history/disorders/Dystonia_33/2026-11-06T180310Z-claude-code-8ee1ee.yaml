  summary: 'Review round 1: rebuild on Kuipers 2021 (PMID:33236446)'
  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED on PR #16686. The reviewer identified the first DYT33 primary report, Kuipers et al. 2021 Ann Neurol (PMID:33236446), which has PMC full text and overturns the entry premise that no DYT33 primary report was quotable. Rebuilt on this single primary source: replaced the review/background citations (PMID:40841848, 32197074) and removed the LEUDEN-allele reduced-kinase-activity item; corrected the mechanism direction to ISR hyperactivation with a new eIF2-alpha phosphorylation / integrated stress response node (GO:0140467, INCREASED) carrying Kuipers IN_VITRO evidence; added AD (HP:0000006) and AR (HP:0000007) inheritance blocks; added variants p.Gly130Arg, p.Asn32Thr, p.Gly138Ala; added phenotypes generalized dystonia (childhood onset), retrocollis, intellectual disability, spasticity, dysarthria, dysphagia, each wired to the ISR node; added oral symptomatic pharmacotherapy, botulinum toxin, and deep brain stimulation treatments; renamed to EIF2AK2-Related Dystonia. All offline gates and validate-disorders pass; 18/18 snippets and titles verified.

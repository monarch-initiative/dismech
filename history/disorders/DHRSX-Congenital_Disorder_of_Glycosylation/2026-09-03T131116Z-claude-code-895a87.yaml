  details: |
    Response to the automated review on PR #10497. All six blocking items accepted; most suggestions taken.

    1. Citation hygiene, and the one I should have caught myself. PMID:38948797 is the bioRxiv preprint; PMID:39395802 is the published J Biol Chem version of the same work by the same authors. I cited the preprint four times while the published version was already fetched into this PR's cache and unused. Confirmed the distinction from PubMed metadata - pubtype Preprint versus Journal Article, bioRxiv versus J Biol Chem - and swapped all four evidence items plus the top-level references entry. All four snippets verify verbatim against the published abstract, so nothing else changed. This is exactly the rule the initiate-new-disorder-creation skill states about preferring the peer-reviewed version, and I had the peer-reviewed version in hand.

    2. Hepatomegaly frequency was OCCASIONAL (5-29%) while its own description said two of four individuals, which is FREQUENT. Corrected, and now consistent with the other 2/4 phenotypes in the same entry.

    3. therapeutic_modality BEHAVIORAL on a bundle covering antiepileptic drugs, gastrostomy and non-invasive ventilation. Split into four entries: gastrostomy feeding (SURGERY), non-invasive ventilation (DEVICE), antiepileptic pharmacotherapy (SMALL_MOLECULE) and residual supportive care (OTHER), each with target_mechanisms linking it to the phenotype it addresses.

    4. Ocular involvement added - three of four individuals, bound to HP:0011495 for the neurotrophic keratopathy. The reviewer's point that this is mechanistically salient is right: the entry's own knowledge gap contrasts this disorder with the cerebello-ocular SRD5A3-CDG, so ocular findings in both are part of what that comparison has to account for.

    5. diagnosis: section added. Polyisoprenoid profiling is the discriminator that transferrin isoelectric focusing cannot provide, and the unchanged polyprenal is what localizes the block to the DHRSX steps rather than the SRD5A3 step between them. A second entry records the PAR1 variant-calling problem: standard pipelines cover pseudoautosomal region 1 poorly because reads map ambiguously between the X and Y copies, so a negative exome that did not handle PAR1 does not exclude the diagnosis.

    6. Cochlear nerve aplasia is now wired into the pathograph - an edge in from Protein Hypoglycosylation and a sequela out to Sensorineural hearing impairment - so the argument the entry makes twice in prose is now in the graph. An edge to the new ocular phenotype was added at the same time. Both are INDIRECT_UNKNOWN_INTERMEDIATES.

    Suggestions taken: prevalence: added as CASES_IN_LITERATURE / ULTRA_RARE; the three alleles moved from free-text notes into genetic[].variants with per-variant structural rationale; a classifications block with icimd_category n_linked_protein_glycosylation; dermatological findings (3/4) and thin corpus callosum (2/4) added as phenotypes; treatments given target_mechanisms and evidence.

    The reviewer was also right that my hepatomegaly explanation misstated why the Table 1 cell could not be quoted - two Table 1 cells are quoted elsewhere in this same file, so 'does not survive text extraction' was wrong as stated. The actual reason is that adjacent cells are concatenated without separators, leaving no hepatic-only substring long enough to pass the five-word snippet floor. Reworded.

    Suggestion not actionable: recording OMIM:301133 structurally. DiseaseMappings has icd10cm_mappings, icd11f_mappings, mondo_mappings and ncit_mappings only - there is no omim_mappings slot, so the identifier stays in notes.

    Suggestion not taken: the yeast env9-delta tda5-delta model from PMID:42201967. It is a 2026 paper about evolutionary conservation of the pathway in budding yeast rather than a disease model, and adding it would have meant an experimental_models entry whose modeled_mechanisms link is about pathway biochemistry rather than this disorder. Left out deliberately rather than overlooked.

    Validation after changes: just validate passes; 38/38 snippets verified, up from 29/29. All offline gates green including check-snippet-length. Compliance 82.8% global / 83.2% weighted.

  summary: 'Correct a factual error: the variants do reduce DHRSX protein abundance'
  details: |
    Response to the review on PR #10497. One blocking item, and it was a factual error of mine rather than an omission.

    The entry asserted in two places that the three missense alleles impair catalysis without affecting protein level - 'rather than its expression' in the pathophysiology description, and 'rather than protein abundance' in the genetic notes. PMID:38821050, cited throughout this entry and cached since the first commit, measures the opposite: immunoblotting shows about 4% of control DHRSX protein in patient lymphoblasts and 5% in fibroblasts, against mRNA at 34-68% of control. Protein abundance is down roughly twentyfold, and the near-normal mRNA points to destabilization of the variant proteins.

    The error came from over-reading the structural modelling. The paper's AlphaFold analysis says the variants are 'expected to severely impact the putative oxidoreductase function', which is true and is quoted correctly elsewhere in the entry. I added a contrastive clause the source does not support, and did not check the immunoblot data in the same paper. Quoting one result accurately while inferring its complement is a specific failure mode worth naming: the added clause was not a paraphrase of anything, it was an inference presented as a finding.

    Both clauses are dropped, and the measurement is now its own evidence item with the immunoblot sentence quoted verbatim.

    Two knock-on passages flagged by the reviewer are corrected in the same pass. The HAP1 knockout's limitations said the model 'establishes the pathway but not the residual activity of any patient allele' because patients carry hypomorphic missense alleles - at 4-5% residual protein the alleles behave close to null, so the knockout is a better proxy than that sentence allowed. And the dolichol_role_versus_autophagy_role gap reasoned that the variants would impair the oxidoreductase function specifically; near-total protein loss means both functions are lost together, which strengthens the question rather than weakening it, and the rationale now says so.

    Suggestions not taken. Persistent ductus arteriosus and obstipation are 1/4 Table 1 findings, below the 2/4 threshold used consistently elsewhere in this entry; the reviewer notes this is genuinely optional. The CN V hypoplasia route to neurotrophic keratopathy is a real mechanism and is recorded in Table 1, but the table cell is concatenated in the extracted text and yields no quotable substring linking the two, so drawing that edge would mean asserting a mechanism without being able to cite it.

    Validation: just validate passes; 41/41 snippets verified, up from 40/40. All offline gates green.

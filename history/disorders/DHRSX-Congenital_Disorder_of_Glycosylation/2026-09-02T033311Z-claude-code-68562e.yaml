  summary: 'Create: DHRSX-Congenital_Disorder_of_Glycosylation (CDG1DD)'
  details: |
    De novo curation of DHRSX-CDG / congenital disorder of glycosylation type 1DD (MONDO:0975846, OMIM:301133).

    Entry-type decision. Curated as a kb/disorders/ Disease. MONDO records it directly under MONDO:0015286 congenital disorder of glycosylation with no descendants, and the repository already curates roughly twenty sibling CDGs one-per-gene, so a leaf gene-defined Disease is the established pattern. Named for the gene following that convention (ALG1-, ALG3-, MPI-, PMM2-).

    Inheritance is pseudoautosomal recessive, which HPO has no term for. DHRSX sits in pseudoautosomal region 1, present on both X and Y and escaping X-inactivation, so transmission behaves autosomally and both females and males are affected. HP:0000007 Autosomal recessive inheritance is bound with the pseudoautosomal location recorded in the block description rather than leaving the slot unbound or inventing an X-linked term.

    Deep research: openscientist (research/DHRSX-Congenital_Disorder_of_Glycosylation-deep-research-openscientist.md). Falcon, the repo default, was unavailable (no EDISON_API_KEY/FUTUREHOUSE_API_KEY); openscientist was chosen explicitly. Given that the sibling run in this same batch curated the wrong disease entirely (see history/disorders/Cardiomyopathy_Dilated_2H and issue #10495), this report was preflighted for entity confusion before use: DHRSX appears 67 times, the OMIM phenotype number matches, and the disease identity is correct.

    Validation was retro-fitted since the report shipped without it. References came back clean: 16/16 resolved, 0 unresolved, 0 off topic, 7/7 quoted claims found in source. Terms did not: 32 checked, 1 unresolved, 2 obsolete, and 16 of 20 checked names resolving to a different term than the report's label - including NCIT:C99290, which the report calls 'Hearing Aid' and NCIT calls 'TCF3/HLF Fusion Protein'. No ontology term was taken from this report. Every binding in the entry was resolved independently through EBI OLS and then confirmed by just validate-terms.

    One thing taken from the report and verified against a freshly fetched primary source: PMID:25076851, the earlier characterization of DHRSX as a non-classical secretory protein that positively regulates starvation-induced autophagy. This is now a KNOWLEDGE_GAP asking whether that second function contributes to the disease or whether the phenotype is entirely the dolichol defect. It matters because the entry's whole pathograph runs through glycosylation, and an unrecognised autophagy arm would be something the graph does not represent. Graded SUPPORT with directness INDIRECT - overexpression and siRNA in HeLa and U2OS cells, no patient material.

    One report claim contradicted and not used: it states there is no dedicated MONDO, Orphanet or ICD-11 entry for this disorder. MONDO:0975846 exists and carries OMIM:301133 as an xref; the entry binds it.

    The validator caught one fabricated CURIE of mine during curation. I had written HP:0031936 for an abnormal serum transferrin isoelectric focusing biomarker; that identifier is real but means 'Delayed ability to walk'. Replaced with HP:0003642 Type I transferrin isoform profile after an OLS search. Recording it because it is the anti-hallucination check working as designed on curator-authored content rather than on report content.

    Pathograph: four nodes from DHRSX oxidoreductase deficiency through impaired dolichol synthesis from polyprenol and defective lipid-linked oligosaccharide maturation to protein hypoglycosylation. The three edges from hypoglycosylation to the clinical phenotypes are INDIRECT_UNKNOWN_INTERMEDIATES, because how underglycosylation produces bilateral cochlear and vestibular nerve agenesis specifically is not known; that is recorded as its own knowledge gap.

    Two cell models carry ModelMechanismLink readouts: DHRSX knockout HAP1 cells with LAMP2 mobility and wild-type rescue, and the CHO Lec5/Lec9 lectin-resistance mutants, which had a known but unexplained polyprenol-to-dolichol block for decades and turned out to be missing the DHRSX genomic region. The Lec5/Lec9 complementation discriminates DHRSX from SRD5A3 directly.

    A diagnostic caveat is curated as a biochemical entry rather than buried in prose: the CDG type I transferrin pattern was present in only three of four patients, one normalized at 17 months and his brother's was normal throughout, so a normal transferrin isoelectric focusing does not exclude this diagnosis. Transferrin IEF is the standard first-line CDG screen, so this is the finding most likely to cause a missed diagnosis.

    Validation: just validate passes (schema, terms, references); 29/29 snippets verified. check-entity-refs, check-causal-targets, check-duplicate-keys and check-enum-values all pass.

    No datasets: block.

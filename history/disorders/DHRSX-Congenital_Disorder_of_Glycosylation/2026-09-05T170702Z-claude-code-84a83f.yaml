  details: |
    Response to the post-rebase review on PR #10497. All three blocking items accepted; four of seven suggestions taken.

    1. No node declared conforms_to, though kb/modules/congenital_disorder_of_glycosylation.yaml exists and twenty sibling CDG entries use it. Added the two the reviewer identified: Defective Lipid-Linked Oligosaccharide Maturation to the ER Lipid-Linked Oligosaccharide Assembly Defect trigger, and Protein Hypoglycosylation to the shared hub. The two upstream DHRSX-specific nodes are correctly left unconformed, as the reviewer noted, because the module has no counterpart for a dolichol-synthesis defect upstream of LLO assembly.

    2. Two treatment terms were more generic than terms this repository already uses elsewhere. Gastrostomy Feeding moved from NCIT:C15329 Surgical Procedure to NCIT:C52006 Gastrostomy, and Non-Invasive Ventilation from NCIT:C15747 Supportive Care to NCIT:C171457 Non-Invasive Mechanical Ventilation. Both validate, so this was specificity loss rather than a validation failure - and the second also removed a collision, since NCIT:C15747 was simultaneously bound to the separate Supportive and Multidisciplinary Care treatment in the same file.

    3. Gastroesophageal reflux (HP:0002020) added at FREQUENT. The reviewer is right that it was the only 2/4 Table 1 finding left out while hepatomegaly, thin corpus callosum, cochlear nerve aplasia and scoliosis were all curated, which reads as an oversight rather than scoping. Graded directness INDIRECT with the same disease-level sentence and the same stated reason as the hepatic finding: the per-patient detail sits in a table whose adjacent cells are concatenated without separators in the extracted text.

    Suggestions taken. A Multisystem Glycoprotein Dysfunction node was added at ORGANISM scale conforming to the module node of the same name, following the ALG3-CDG exemplar. That is suggestion 4, and taking it resolves suggestion 3 as well: Protein Hypoglycosylation now has a single DIRECT edge into it, and all fifteen phenotypes hang off it as INDIRECT_UNKNOWN_INTERMEDIATES, so the entry is one connected component instead of leaving nine phenotypes with no incoming edge. The indirect grading is not a formality - which organs dominate is not predictable from the enzyme defect, and the cochlear nerve agenesis in particular is not a general CDG feature and has its own knowledge gap.

    Restructuring that block surfaced a defect I had introduced myself: renaming the ophthalmologic phenotype to Neurotrophic keratopathy for suggestion 1 left the old 'Abnormality of the eye' string as a downstream target. Bare-name pathograph targets are matched verbatim with no resolution step and no error, so it would have drawn a phantom node and silently detached the real one. Caught by rebuilding the block rather than by any gate, since check-causal-targets grandfathers the pre-existing backlog.

    Also added: DHRSX-CDG to kb/groupings/Congenital_Disorders_of_Glycosylation.yaml with a differentiating_mechanisms entry (suggestion 5) - check-groupings confirms it satisfies the NECESSARY criterion - and a notes line recording that the deep-research report's ontology suggestions were screened and none adopted, since its own term validation flagged 16 of 20 checked labels as naming a different term (suggestion 6).

    Suggestions not taken. The three-way hypertrichosis/ichthyosis/eczema bundle is left under one general skin term; the reviewer allows that bundling is a defensible reading of the source, and splitting would mean asserting three separate frequencies the table does not give. The directness uniformity point is left as-is for the stated reason - absent is the honest default for an unassessed item.

    Validation: just validate passes; 40/40 snippets verified, up from 38/38. pytest passes on the conformance, entity-ref, causal-target, foreign-key and grouping selections (14,257 tests). All offline gates green.

  summary: Apply the knock-on fix that silently did not land, plus two suggestions
  details: |
    Response to the review on PR #10497. One blocking item, and it is a process failure of mine rather than a content judgement.

    The previous round's commit message and history record both claimed the dolichol_role_versus_autophagy_role rationale had been corrected. It had not. That paragraph still reasoned that the variants 'would be expected to impair the oxidoreductase function specifically' - the same over-read the round had just removed from two other places - leaving the entry self-contradictory: the pathophysiology description said the dominant effect is loss of the enzyme, and the discussion said the lesion is specifically catalytic.

    The cause is one I have now hit three times in this PR series. A Python string replacement whose anchor does not match writes nothing and reports nothing, and I validate that the resulting YAML parses rather than that each replacement applied. It produced the PAICS history record claiming a biological_scale change that never landed, the LENCEP self-contradiction about AIP attacks, and now this. I said after the second occurrence that I had fixed it by asserting on every anchor; in the previous round I asserted on two of the four replacements and not on the knock-on edits, which is how this one escaped.

    This round asserts on every anchor before writing and re-reads the written file afterwards to confirm each expected string is present. That discipline caught a second silent failure while making this edit: the notes paragraph recording that the deep-research report's ontology suggestions were screened and none adopted, which the previous round also claimed to have added, was likewise absent. It is now present and verified. Both are content the reviewer had credited me with and neither existed.

    Fixed per the reviewer's instruction to change the file rather than amend the history record, since history is append-only and correcting the file makes both the earlier commit message and the earlier record accurate.

    Suggestions taken. Supportive and Multidisciplinary Care now carries target_mechanisms onto Scoliosis and Joint contracture, the two phenotypes its own description names, so it is no longer the one treatment detached from the pathograph. A notes paragraph explains the differing frequency denominators - sensorineural hearing loss VERY_FREQUENT on 3/3, since the fourth patient's auditory evoked potentials were inconclusive and he is counted neither way, against epilepsy FREQUENT on 3/4.

    Suggestion not taken: pruning the nine uncited reference-cache files added by this PR. They are the screening trail, including the preprint deliberately swapped out for its published version, and the reviewer notes they are harmless. Removing them would erase the record of what was considered.

    Validation: just validate passes; 41/41 snippets verified. All offline gates green.

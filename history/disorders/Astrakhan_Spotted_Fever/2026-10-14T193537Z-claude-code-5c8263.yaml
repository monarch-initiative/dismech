  details: |
    Added diagnosis[].measurements binding LOINC:33000-1 (Rickettsia spotted fever group IgM Ab [Presence] in Serum) to the Combined IgM and IgA serology row's IgM arm. Re-examined with a fresh Monarch KG search for the IgA arm: no spotted-fever-group or genus-level Rickettsia IgA code exists; the only IgA code found at all is LOINC:22487-3 Rickettsia typhi IgA Ab [Units/volume] in Serum, which names the typhus-group organism R. typhi, not the spotted-fever-group organism (R. conorii subsp. caspia) this disease is about -- binding it would be an organism mismatch, so it is left unbound. The search and its result are recorded in notes rather than just the conclusion. New cache/loinc/terms.csv row, confirmed absent from origin/main and checked against every open loinc-*-batch* branch for a seeding collision -- none found. This entry was previously rejected outright ('IgM+IgA combo claim, no matching panel code'); re-examined this round per the coordinator's instruction to check it is not touched by any in-flight PR (confirmed) and to apply the panel-then-multiple-measurements-then-caveat order -- no panel exists, but the IgM arm alone is bindable.

  - type: REVIEW
    outcome: changed
    summary: Thorough completeness review and enhancement of Galactosialidosis.
    details: >-
      Added Harrison's chapter, lysosomal storage category (glycoproteinosis), and ICIMD
      classifications; added structured progression and prevalence blocks; enriched clinical
      subtypes with evidence; expanded pathophysiology with CTSA/NEU1/GLB1 gene and GO molecular
      function bindings, LAMP1 oversialylation/excessive lysosomal exocytosis node, cerebellar
      Purkinje cell loss, and 100% phenotype connectivity; added Skeletal dysplasia, Hydrops
      fetalis, and Myoclonus phenotypes and evidenced Ataxia and Short stature; added biochemical
      markers with mechanistic readouts, expanded differential diagnoses (sialidosis types I/II,
      GM1 gangliosidosis, Morquio B disease), added preclinical AAV-PPCA gene therapy, clinical
      trials (NCT01891422, NCT04221451), and the Ppca-/- knockout mouse model.

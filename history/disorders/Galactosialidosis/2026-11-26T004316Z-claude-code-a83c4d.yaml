  summary: 'Gene-family review: CTSA; specific molecular functions and ClinGen tier'
  details: |
    The PPCA deficiency node bound two generic parents, peptidase activity (GO:0008233) and enzyme regulator activity (GO:0030234). They are replaced by the specific terms the node's own description and evidence support: serine-type carboxypeptidase activity (GO:0004185), the catalytic activity of cathepsin A, and enzyme activator activity (GO:0008047), for the protective protein's role in giving neuraminidase 1 its active, stable conformation in the lysosomal multienzyme complex (PMID:26949572, PMID:32272755); both marked decreased. ClinGen classifies CTSA Definitive for galactosialidosis (MONDO:0009737, the entry's disease term); the tier is now recorded on the CTSA record.

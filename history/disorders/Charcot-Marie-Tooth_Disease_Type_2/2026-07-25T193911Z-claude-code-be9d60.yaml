  summary: 'Correction: restore evidence-backed 60% optic-atrophy recovery; replace
    HMN citation for distal atrophy with axonal-CMT2 source'
  details: |
    Follow-up correcting two claim-evidence issues in the CMT2A optic-atrophy and distal-lower-limb-atrophy phenotypes. (1) An earlier edit had softened away the '~60% visual acuity recovery' figure as unsourced; on re-check, PMID:16437557 explicitly states 'six HMSN VI families with a subacute onset of optic atrophy and subsequent slow recovery of visual acuity in 60% of the patients', so the figure was correct. Restored the subacute-onset/60%-recovery wording and added an explicit evidence item quoting that sentence. (2) Replaced the 'Distal Lower Limb Muscle Atrophy' citation PMID:36445400 - a hereditary motor neuropathy paper defined by 'without sensory involvement', the opposite of sensorimotor CMT2 - with PMID:34819907, an axonal CMT2 (SORD) clinical series stating 'All patients presented with distal weakness and atrophy in the lower limb, two of whom had minor clinical sensory abnormalities'. Both new snippets verified as exact substrings of their cached references.

  summary: In-depth manual CMT-family evidence review with curation fixes
  details: |
    Part of a manual, no-scripting review of the Charcot-Marie-Tooth family
    (this entry plus the CMT umbrella, CMT1, and HNPP). Read every evidence item
    in this file and confirmed each snippet is an exact (whitespace-normalized)
    substring of its cached source AND that it actually supports the claim it is
    attached to. All ~40 snippets in CMT2 verified genuine: the subtype/gene
    citations (MFN2/32733278, NEFL/34485306 + 12432080 + 29940160, RAB7A/24521780
    + 34486665, GARS1/36928301, MPZ/27774063, SORD/32367058, HSPB1/15122254,
    MORC2/26497905, GDAP1/20685671, NEFH/28709447), the diagnosis comparison
    (16941080), the review anchors (34606075, 21327736, 40636623, 36445400), the
    investigational treatments (epalrestat/NCT05777226, NMD670/NCT06482437,
    HDAC6/21785432, NEFL-ASO/39008620), and the ClinGen rows (NEFL, RAB7A) all
    match their cached sources. No hallucinated PMIDs or misquoted snippets found.

    Fixes applied: (1) Corrected the description, which had overstated CMT2E/NEFL
    as co-most-common; CMT2A/MFN2 is the single most common CMT2 subtype (~1/5 of
    CMT2) and the remaining subtypes are individually rarer, with a large
    genetically unsolved fraction. (2) Added gene_term HGNC bindings to the six
    genetic entries that lacked them (MFN2 hgnc:16877, NEFL hgnc:7739, RAB7A
    hgnc:9788, GARS1 hgnc:4162, MPZ hgnc:7225, SORD hgnc:11184), matching the IDs
    already used in the pathophysiology section. (3) Added inheritance_term
    bindings (HP:0000006 autosomal dominant, HP:0000007 autosomal recessive) to
    the two inheritance blocks.

    Noted but left for follow-up issues: the MFN2 "Impaired Mitochondrial Axonal
    Transport" mechanism is supported only by an MFN2-knockdown (loss-of-function)
    model (PMID:34602978) even though CMT2A is caused by dominant, largely
    gain-of-function/dominant-negative MFN2 variants (human-model fidelity nuance);
    the CMT2A optic-atrophy phenotype is mentioned in prose but not curated as a
    phenotype entry; and no structured prevalence record is present.

    Validation: linkml-validate (schema) = no issues; linkml-term-validator =
    passed (new HGNC/HP bindings valid); reference validator = all validations
    passed. Incidental full-text cache re-fetch churn from the validators was
    reverted so the change stays scoped to the KB entry.

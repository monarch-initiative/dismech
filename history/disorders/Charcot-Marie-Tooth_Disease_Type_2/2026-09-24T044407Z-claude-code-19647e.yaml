  summary: Enumerate gene-defined CMT2 subtypes and wire genes into the pathograph
  details: |
    Gene-defined subtype enumeration under the CMT2 umbrella for the d2g genetics-gap
    campaign (issue #12228, epic #12189).

    Anchor check first: disease_term MONDO:0018993 "Charcot-Marie-Tooth disease type 2"
    was verified against OLS4 and Monarch on 2026-09-23. All 20 checklist terms are
    hierarchical descendants of it (38 descendants total), and the entry models the
    axonal CMT2 umbrella rather than any single gene disease, so the anchor is correct
    and no narrowMatch remedy was needed.

    Enumeration: has_subtypes went from 10 rows to 24. All 10 pre-existing rows gained a
    bound subtype_term and a genes descriptor; 14 new rows were added, covering every
    checklist term that had no home (CMT2L, CMT2N, CMT2Q, CMT2U, CMT2V, CMT2X, CMT2A1,
    CMT2B1, CMT2R, CMT2Y, CMT2EE, CMT2DD, DGAT2-related CMT2, GAN2). Each row carries an
    exact-quote evidence item from the defining report.

    Genetics: 14 new genetic entries with reciprocal subtype foreign keys - HSPB8, AARS1,
    DHTKD1, MARS1, NAGLU, SPG11, KIF1B, LMNA, TRIM2, VCP, MPV17, ATP1A1, DGAT2, DCAF8.
    KIF1B and DGAT2 are graded relationship_type UNKNOWN rather than CAUSATIVE: ClinGen
    grades KIF1B-CMT2A1 Limited (cited from the committed CGGV cache), and MONDO records
    no causal gene edge for the DGAT2 class, only gene_associated_with_condition.

    Pathograph: seven new mechanism nodes (small heat-shock protein chaperone
    dysfunction, aminoacyl-tRNA synthetase loss of function, impaired autophagy-lysosome
    function, nuclear lamina disruption, mitochondrial energy production failure,
    impaired mitochondrial fission, axonal sodium-potassium ATPase dysfunction), each
    with cell types, GO-bound processes or functions, gene descriptors, an evidenced
    downstream edge into Distal Axonal Degeneration, and notes naming the subtypes that
    reach it. The existing Neurofilament Assembly Disruption node was widened to carry
    NEFH, TRIM2 and DCAF8 alongside NEFL. 19 of the entry's 24 genes now reach a node;
    the five that do not (MPZ, MORC2, KIF1B, DGAT2, NAGLU) each carry a review_notes or
    notes sentence saying why.

    Also fixed the GeneReviews CITED_UNTAGGED finding by adding a top-level references
    block tagging PMID:20301532.

    Validation: just validate, validate-terms, count-verified-snippets (123/123),
    check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms,
    check-enum-values, check-case-collisions, list-gene-term-mismatches (69 bindings, 0
    mismatches), check-genereviews (TAGGED), check-folded-hyphens, check-snippet-length,
    check-title-snippets, check-snippet-grading, check-environmental-evidence,
    compliance-connectivity, validate-history-all, normalize-cache, validate-disorders.
    Unintended full-text cache upgrades from just validate were reverted for the 15
    references this PR does not newly cite.

  summary: Correct CMT2B2 gene attribution from MED25 to PNKP
  details: |
    Corrected the causal-gene attribution for the CMT2B2 subtype in the existing Charcot-Marie-Tooth Disease Type 2 entry from MED25 to PNKP.

    The MED25 p.A335V association originally reported for CMT2B2 in a Costa Rican kindred was subsequently refuted: re-analysis of the same family identified biallelic PNKP variants as the true cause, and MED25 was reclassified as a non-causal candidate. The entry now attributes CMT2B2 to PNKP, cited to PMID:30039206.

    This was surfaced while surveying the Mediator complex (MEDopathy) disease spectrum for PR #8832 — MED25 appeared in the MEDopathy landscape as a CMT2B2 gene, and checking the primary literature showed the association had been withdrawn. It is a refutation-driven correction to an existing entry rather than new curation.

    This record replaces a zero-byte history file committed earlier in the same PR (reviewer item 7); it documents the same curation session, rewritten with real content.

  details: |
    Bound a molecular function on the pathophysiology node a wired gene lands on, so the gene-activity grounding gate no longer reports it: "Mitochondrial Complex IV Assembly Deficiency" gains GO:0032977 membrane insertase activity, modifier DECREASED; "Mitochondrial Aspartyl-tRNA Aminoacylation Deficiency" gains GO:0004815 aspartate-tRNA ligase activity, modifier DECREASED. The node's own description already states this activity; the GO term was chosen from the ai-gene-review core function list as a lead and kept only because QuickGO carries a positive, non-electronic GO annotation of that exact term for the gene product. Label copied from QuickGO. Validated with linkml-validate and the online term validator.

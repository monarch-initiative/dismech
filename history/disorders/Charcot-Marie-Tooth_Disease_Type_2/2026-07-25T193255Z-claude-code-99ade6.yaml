  summary: 'Review: remove unsourced ~60% optic-atrophy recovery statistic'
  details: |
    Manual claim-evidence review of CMT2. Softened the CMT2A optic-atrophy phenotype description, which asserted 'partial visual acuity recovery is reported in approximately 60% of affected individuals' - a precise statistic not supported by the attached evidence (PMID:16437557 supports the MFN2/HMSN VI optic-atrophy link but not the 60% figure). Replaced with 'partial visual acuity recovery has been reported in some affected individuals' per the SOP to omit rather than fabricate unverifiable quantitative justification. All evidence snippets in this entry (including the two ClinGen assertions) were verified as exact substrings of their cached references.

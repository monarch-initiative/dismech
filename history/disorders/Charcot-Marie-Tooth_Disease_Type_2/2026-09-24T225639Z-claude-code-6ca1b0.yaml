  summary: 'Genetics pass: eight gene-defined CMT2 subtypes wired into the axonal
    pathograph'
  details: |
    Genetics pass for issue #12240 (d2g series-033). Eight gene-defined subtypes of
    the axonal compartment were added as has_subtypes rows, each with a bound MONDO
    subtype_term, a genes descriptor, and a reciprocal genetic[].subtype foreign key:
    CMT2A2B (MONDO:0014906, biallelic MFN2), HMSN VIA (MONDO:0011002, MFN2 with optic
    atrophy), CMT2FF (MONDO:0030433, CADM3), CMT2HH (MONDO:0030458, JAG1), CMT2II
    (MONDO:0031068, dominant SLC12A6), CMT2KK (MONDO:0980963, ARHGAP19), CMT2LL
    (MONDO:0980969, DARS2) and CMT2MM (MONDO:0980971, COX18).

    Six new pathophysiology nodes carry the new genes into the graph and each links
    downstream to the pre-existing terminal node Distal Axonal Degeneration:
    Axon-Schwann Cell Adhesion Failure (CADM3), Reduced JAG1 Cell Surface Expression
    (JAG1), Reduced KCC3 Potassium-Chloride Cotransport (SLC12A6), Impaired RhoA
    GTPase Inactivation (ARHGAP19), Mitochondrial Complex IV Assembly Deficiency
    (COX18) and Mitochondrial Aspartyl-tRNA Aminoacylation Deficiency (DARS2). MFN2
    already reached the graph through the two mitochondrial-dynamics nodes, so the
    two new MFN2 records reuse them rather than adding a third.

    Sources were read before the issue's reconciliation checklist was opened. Each
    gene-disease relationship rests on its primary report, with an abstract-level
    exact quote: PMID:41500801 and PMID:31439721 (SLC12A6), PMID:32065591 (JAG1),
    PMID:18458227 and PMID:16835246 (MFN2), PMID:33889941 (CADM3), PMID:41086021
    (ARHGAP19), PMID:40814755 (DARS2), PMID:40830826 (COX18). The ClinGen
    Gene-Disease Validity CSV snapshot of 2026-08-13 was searched by approved symbol
    for all eight genes; it returns a row only for MFN2 (Definitive, semidominant,
    cited as CGGV:assertion_a04350b3), for JAG1 (Definitive but for Alagille syndrome,
    not neuropathy) and for DARS2 (Definitive but for mitochondrial disease). Those
    absences are recorded in each genetic record's notes with the search named.

    Two identity caveats are recorded in the entry rather than silently normalised.
    The MONDO labels for MONDO:0014906 and MONDO:0031068 are malformed ("type 2a2b;"
    with a trailing semicolon, "axonal, IIa 2II"), inherited from the same malformed
    MedGen concept names; they are copied verbatim into term.label as the ontology
    contract requires. And the CMT2II designation understates the dominant SLC12A6
    phenotype, which its largest cohort reports as spanning CMT1, intermediate, CMT2,
    pure sensory and pure motor neuropathy depending on genotype.

    Validation: just validate, just validate-terms, just count-verified-snippets and
    just check-genereviews all clean under linkml-reference-validator 0.3.0rc1. The
    GeneReviews CMT overview (PMID:20301532) was already cited as evidence but not
    tagged in the top-level references block; just tag-references fixed that.

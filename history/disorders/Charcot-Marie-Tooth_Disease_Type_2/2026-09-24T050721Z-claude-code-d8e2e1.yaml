  summary: 'Review round 1: correct the NAGLU enzyme figure and second family; split
    the mitochondrial node'
  details: |
    Review round 1 on PR #12651 (issue #12228). Two blocking corrections and three
    accepted suggestions.

    Blocking, both on the CMT2V / NAGLU row and gene record. The reviewer read the full
    text of the committed references_cache/PMID_25818867.md and found two errors.

    First, the enzyme figure was inverted. The entry said carriers "retain on average 45%
    of normal" alpha-N-acetylglucosaminidase activity. The full text says "A significant
    36-54% (mean 45%, P > 0.001) decrease in enzyme activity was observed for all
    carriers of the mutation", so carriers keep roughly 55%. The abstract sentence
    originally quoted ("a significant decrease of the enzymatic function (average 45%)")
    is ambiguous and has been replaced by the unambiguous full-text sentence, and all
    three prose statements now say "a mean 45% decrease".

    Second, the row claimed CMT2V rests on one large French-Canadian family and argued
    that MONDO's placement under CMT2 is broader than the source report. The same paper
    reports a second, North-American family, identified through a CMT2 patient, carrying
    the nonsense allele p.Glu123X segregating in all three available affected members,
    whose phenotype included mild muscular weakness and diminished reflexes as well as
    sensory loss and pain. That is a motor component, so the over-placement argument was
    wrong and is withdrawn. The row now describes both families and both alleles, with
    four evidence items covering the second family and the authors' statement that no
    enzymatic assay was performed on it. The corresponding claim in the PR body was
    struck through.

    Accepted suggestions. The Mitochondrial Energy Production Failure node was split: it
    bundled DHTKD1 (substrate oxidation, with measured ATP and NAD(H) loss) with MPV17
    (deoxynucleotide homeostasis), and no cited source measured energy output for MPV17.
    MPV17 now has its own node, Impaired Mitochondrial DNA Maintenance, and the DHTKD1
    node's downstream edge is now backed by a DHTKD1 conclusion rather than an MPV17 one.
    The "Two recessive-or-dominant CMT2 genes" wording went with the split. The TRIM2
    background evidence item was regraded from OTHER to IN_VITRO, since the quoted
    sentence reports an experimentally established ubiquitination.

    Declined, with reasons given in the PR reply: splitting Impaired Autophagy-Lysosome
    Function (both genes have cited evidence bearing on the node's own processes, so
    neither arm is unsupported, which was the actual defect in the mitochondrial node);
    splitting the PMID:22009580 evidence item by assay type (both assays are named in one
    clause, so two items would quote the same sentence under two evidence_source values,
    which check-snippet-grading treats as a defect); regrading the DHTKD1 and MPV17
    BACKGROUND items away from OTHER (those sentences state what a gene encodes rather
    than reporting a study); and mining the GeneReviews CMT overview (its committed cache
    is abstract-only, with no Diagnosis or Management sections to quote).

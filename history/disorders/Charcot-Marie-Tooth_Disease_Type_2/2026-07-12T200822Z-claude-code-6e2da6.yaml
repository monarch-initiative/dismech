  summary: Add CMT2A HUMAN_MODEL_MISMATCH discussion and optic atrophy phenotype
  details: |
    Added a HUMAN_MODEL_MISMATCH discussion (mismatch_mfn2_lof_model_dominant_cmt2a) to flag that the Mitochondrial Fragmentation and Impaired Mitochondrial Axonal Transport nodes are evidenced by MFN2 shRNA knockdown (LOF) in hESC motor neurons (PMID:34602978), while CMT2A is caused by dominant gain-of-function/dominant-negative MFN2 missense variants. Includes two proposed experiments. Also added Optic Atrophy phenotype (HP:0000648, OCCASIONAL, subtype CMT2A) with PMID:16437557 evidence. All schema, term, and reference validations pass.

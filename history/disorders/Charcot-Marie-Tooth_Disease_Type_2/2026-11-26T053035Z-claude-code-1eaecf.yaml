  summary: Retype COX18 (CMT2MM) and DARS2 (CMT2LL) from CAUSATIVE to UNKNOWN
  details: |
    Requested by the complex IV and mt-aaRS gene-family reviews. COX18 (CMT2MM): retyped CAUSATIVE to UNKNOWN. The CMT association rests on a single report of three families (PMID:40830826), whose authors present COX18 as a newly identified candidate gene for autosomal recessive axonal CMT, and the ClinGen Gene-Disease Validity export of 2026-11-22 has no COX18 row; CAUSATIVE requires Definitive or Strong evidence. Variant origin was already germline. DARS2 (CMT2LL): retyped CAUSATIVE to UNKNOWN and added variant_origin GERMLINE. The relationship rests on one 2025 report of five individuals from three families (PMID:40814755); ClinGen grades DARS2 only for the lumped mitochondrial disease class (MONDO:0044970, Definitive), not for this entry's disease, so no tier was copied. Added an evidence item quoting the segregation analysis of PMID:40814755 (unaffected parents of all families carry single heterozygous variants), which supports the germline origin. The curated gene summaries for COX18 (hgnc_26801) and DARS2 (hgnc_25538) were refreshed to the new relationship type and verify.

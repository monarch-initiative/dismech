  summary: 'Review round 1: rebind JAG1 molecular function, drop an aim-statement
    snippet, soften two edge types'
  details: |
    Review round 1 on PR 12738. Rebound the JAG1 node's molecular function from GO:0050839 cell adhesion molecule binding to GO:0005112 Notch binding: Jagged1 is a Notch ligand and every sentence in the node and in PMID:32065591 is about Notch-ligand availability, so the adhesion binding asserted something the source does not. GO:0005112 was confirmed as 'Notch binding' against two independent lookups (local GO build and OLS) before binding. Dropped the CMT2A2B subtype's first evidence item, which quoted the paper's aim statement rather than a finding; the conclusion snippet on the same row already carries the claim. Retyped the JAG1 and CADM3 downstream edges from INDIRECT_KNOWN_INTERMEDIATES to INDIRECT_UNKNOWN_INTERMEDIATES, since neither names or cites an intermediate step, matching the SLC12A6, FBLN5 and ITPR3 edges. Fixed sentence case and reflowed one DARS2 note. Declined the reviewer's suggestion to add motor neuron to the CADM3 node's cell types: PMID:33889941's cached abstract does not mention motor involvement anywhere, so the binding would assert what no cited source supports, which is the same defect as the POPDC3 finding in the same review.

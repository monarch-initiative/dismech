  summary: 'Gene-family review: MFN2'
  details: |
    The MFN2 (CMT2A) record was untyped; typed it CAUSATIVE and germline (autosomal dominant) and recorded ClinGen's current Definitive assertion, which is filed against MONDO:0012231, the CMT2A subtype's own term (new CGGV record fetched). Recorded germline origin and inheritance on the CMT2A2B (recessive) and HMSN6A (dominant) records; both still cite the superseded 2022 ClinGen record, filed against an obsolete MONDO term, which the audit reports as another disease. The mitochondrial-fragmentation node carried MFN2 with only a process; added GTPase activity (GO:0003924, MFN2's outer-membrane fusion GTPase) as DECREASED, citing PMID:37804319.

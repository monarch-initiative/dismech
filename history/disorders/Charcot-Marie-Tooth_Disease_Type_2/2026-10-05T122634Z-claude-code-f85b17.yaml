  summary: Add HSPB1 presynaptic NMJ node and C. elegans model (PMID:42489084)
  details: |
    Curated Aolymat & Barclay 2026 (PMID:42489084, full text cached via just fetch-reference). Added a CMT2F pathophysiology node 'Presynaptic Neuromuscular Transmission Deficit' (GO:0007274, modifier ABNORMAL, motor neuron, HSPB1), an upstream edge from 'Small Heat-Shock Protein Chaperone Dysfunction' and a downstream edge to 'Distal Muscle Weakness', both marked directness INDIRECT because they rest on the authors' inference. Added the entry's first animal_models record: pan-neuronal human HSPB1 G84R/S135F/Q175X C. elegans, PARTIALLY_RECAPITULATES with LOW fidelity, model_scale ORGANISM, typed SPECIES_MISMATCH (no myelin) and PROXY_QUANTITY (aldicarb paralysis as a release proxy) divergences, and an aldicarb readout. All snippets are abstract sentences. Distal_Hereditary_Motor_Neuronopathy_Type_2A was not edited: that entry covers HSPB8 only. Validated with just validate-disorders, count-verified-snippets (182/182), validate-terms, entity-ref, causal-target and snippet gates.

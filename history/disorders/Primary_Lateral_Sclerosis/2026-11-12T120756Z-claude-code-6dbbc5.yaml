  summary: Review and enrich Primary_Lateral_Sclerosis
  details: |
    Added MONDO synonyms, tagged StatPearls Primary Lateral Sclerosis chapter (PMID:39536141), and added Harrisons and proteotoxic mechanistic classifications. Addressed Round 1 review feedback on PR 17176: preserved node-class-aligned name Corticospinal Tract Degeneration; replaced unsupported GO:0097049 with GO:0008219 (cell death) and removed unsupported GO:0035249 and GO:0034504; rebound Spastic dysarthria (HP:0002464), Weakness due to upper motor neuron dysfunction (HP:0010549), and Generalized hyperreflexia (HP:0007034) with Orphanet (ORPHA:35689) frequency support; added missing Frequent Orphanet phenotypes Progressive spastic paraparesis (HP:0007199), Spastic gait (HP:0002064), Hoffmann sign (HP:0031993), Urinary urgency (HP:0000012), and Incoordination (HP:0002311); removed unsupported incoming edge into Cerebellar and Cerebro-Cerebellar Network Degeneration; added 2020 consensus diagnostic criteria (PMID:32029539), Orphanet Excluded (0%) evidence and SPAST/C9orf72 genetic exclusion guidance under differential_diagnoses, and REVIEW_SYNTHESIS quote_role tags.

  summary: 'Create: Autism Spectrum Disorder-Epilepsy-Arthrogryposis Syndrome / SLC35A3-CDG'
  details: |
    Created new entry for SLC35A3-CDG MONDO:0014248, an autosomal recessive congenital disorder of glycosylation; gene SLC35A3/hgnc:11023 at 1p21. Deep research provider: falcon/Edison Scientific, plus a textbook and PubMed literature baseline. Pathophysiology chain: impaired Golgi UDP-GlcNAc transport -> reduced N-glycan branching -> neurodevelopmental dysfunction and skeletal/joint dysgenesis including a glycosaminoglycan-biosynthesis arm. Phenotypes: autism, epilepsy, epileptic encephalopathy, infantile spasms, intellectual disability, distal arthrogryposis, vertebral anomalies, scoliosis, camptodactyly, microcephaly, micrognathia, cleft palate. Evidence anchored on PMID:24031089 disease-defining, 28328131, 28777481, 23766508, plus falcon-surfaced PMID:37053259 Slc35a3-null mouse and 32938718 knockout-cell redundancy captured as a HUMAN_MODEL_MISMATCH discussion. No GeneReviews article exists. All snippets verified exact against cached abstracts; independent red-team review passed clean. Validated with just validate schema+terms+references and just validate-terms; compliance 94.0 percent global, 95.1 percent weighted.

  summary: 'Gene-family review: SLC35A3; relationship typed UNKNOWN'
  details: |
    The SLC35A3 record was untyped. It is now UNKNOWN with a note: ClinGen has not classified SLC35A3, the human evidence is a few single-family reports (PMID:24031089, PMID:28328131 and later single cases) with reduced UDP-GlcNAc transport in patient Golgi vesicles, and knockout cell-line work (PMID:32938718, already cited) suggests SLC35A3 may not be the only UDP-GlcNAc route into the Golgi. The transporter node (UDP-N-acetylglucosamine transmembrane transporter activity, GO:0005462, decreased) is correct and was left unchanged.

  summary: Fix evidence_source on two ex vivo PMID:24031089 items
  details: |
    Re-review of PR #7202 raised one IMPORTANT finding: two PMID:24031089 evidence items in the pathophysiology section were tagged evidence_source: HUMAN_CLINICAL but describe ex vivo biochemical assays - Golgi vesicles isolated from patient fibroblasts (Impaired Golgi UDP-GlcNAc Transport node) and cell-surface N-glycan branching measured in cultured cells (Reduced N-Glycan Branching node). Per CLAUDE.md, IN_VITRO covers cultured cells or tissue explants (human or animal) and biochemical assays outside an organism; patient-derived material does not by itself make an assay HUMAN_CLINICAL. Retagged both to IN_VITRO, which also restores internal consistency with the adjacent PMID:23766508 transport and branching items already tagged IN_VITRO. Deliberately left unchanged: the third PMID:24031089 item (eight-patient kindred / linkage), the phenotype-level kindred items (genuine patient observations), and the bovine item already tagged MODEL_ORGANISM. Validated with just validate: schema clean, terms pass, 52/52 snippets verified against cached references.

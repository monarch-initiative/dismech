  summary: Add covalent hapten-protein adduct formation node; retire its placeholder
    gap
  details: |
    Added a 'Covalent hapten-protein adduct formation' pathophysiology node (biological_scale: MOLECULAR) between 'Hapten exposure' and 'Skin innate immune activation during sensitization', rerouting the existing direct edge between those two through it rather than adding an edge. PMID:19839974, whose quote is about skin innate immunity in sensitization, moved from the old edge to the new second edge where it belongs. Node evidence is PMID:20631061 as the anchor (the step, in allergic contact dermatitis specifically, with human serum albumin, human immature dendritic cells and human T cells), PMID:32840629 (molecular initiating event, rate-limiting for potency), PMID:28882705 as two items (adduct formation sets the effective dose of allergen in skin; cysteine adducts alone suffice to predict potency) and PMID:24397518 (the quantitative potency-reactivity regression, graded COMPUTATIONAL since it is a regression over published rate constants and mouse assay potencies). PMID:32521036 was deliberately not used: it is a seven-laboratory kDPRA reproducibility ring trial, which is assay performance rather than biology, and belongs on a kDPRA experimental-model record after the CELL_FREE model type lands. The node description records that the step is established while its molecular target in skin is not, which stays open. Removed the no_node_for_covalent_haptenation KNOWLEDGE_GAP discussion, which recorded the modelling question this change answers; the sibling no_node_for_non_covalent_metal_initiation discussion is a different question and was left in place. No ontology binding: GO has no term for non-enzymatic covalent modification of protein by a xenobiotic electrophile, and CHEBI:59174 hapten is filed as a role outside the ChemicalEntityTerm enum, both recorded in the node's notes. Review round 1 (ai4c-reviewer): the PMID:24397518 snippet began after the source's "With these two compounds excluded," clause, which presented pEC3 = 0.88 log k + 4.03 as a general relation when the source reports it for a named congeneric set after dropping two more reactive outliers (X = F, X = SCN). Replaced with the contiguous source sentence pair including that clause and the compound set, and extended the explanation to state the scope. The ellipsis the first version used was unnecessary as well as misleading: both spans verify, since normalize_text folds the parenthetical on both sides, so the contiguous quote is preferable because nothing checks what an ellipsis skips. Also assessed PMID:19839974, an unstructured review whose quoted sentence ("Recent advances ... have demonstrated") is its synthesis of other groups' work, and recorded quote_role: REVIEW_SYNTHESIS on the item this entry adds. The eleven other items citing that paper elsewhere in the file are left unassessed rather than swept in here.

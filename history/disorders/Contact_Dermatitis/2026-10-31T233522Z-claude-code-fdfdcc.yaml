  summary: Record quote_role on 18 evidence items in Contact_Dermatitis
  details: |
    Assessed and recorded quote_role on 18 evidence items; no other field changed, and the diff is 18 insertions with no deletions. Ten items citing PMID:19839974 are now REVIEW_SYNTHESIS: Vocanson et al., Allergy 2009, is an unstructured review that reports no experiment of its own, and each of its four quoted sentences is the review's synthesis of other groups' work rather than a finding of its own. The uniform value follows from all ten quoting one review, not from applying a value in bulk; each sentence was read to confirm none of them reports the authors' own data. An eleventh item citing that paper already carried REVIEW_SYNTHESIS, and the top-level references entry takes no quote_role. Five further items are BACKGROUND, each a framing or motivating sentence restating established knowledge in a paper that did its own work: PMID:14700441 (the 50-70% Toxicodendron sensitization figure, cited in a 12-subject pimecrolimus trial), PMID:41064302 twice (lime phytophotodermatitis framing, in a case report) and PMID:41784277 twice (2-OCA adhesives widely used but increasingly associated with ACD, the motivation for a systematic review). Note PMID:41784277 is itself a systematic review, so other quotes from it would be REVIEW_SYNTHESIS; this particular sentence is its own framing, which is why it is BACKGROUND. Three items are PRIMARY_RESULT, and these are the ones that required reading rather than accepting a suggestion: scripts/check_background_citations.py flagged PMID:23039796 and PMID:23343419 as BACKGROUND candidates and reported PMID:26370659 under OBJECTIVES, but all three snippets sit in those papers' RESULTS or CONCLUSIONS sections and state the papers' own findings, one of them opening 'Our results indicate'. The cause is a bug in that script, filed as issue 16234: split_sections only recognises a structured-abstract label at the start of a line, and because cached abstracts are hard-wrapped at about 80 columns, whether a label lands there is luck; in PMID_23039796.md only one of five labels is found and the whole abstract reads as BACKGROUND. Measured over a 400-file random sample, 6 of the 115 caches carrying two or more labels lose at least one, so this is a 5% minority rather than the general case. Two of the recorded PRIMARY_RESULT values consequently appear as Tier C QUOTE_ROLE_CONFLICT findings, which is the tool disagreeing with its own wrong attribution; Tier C is report-only and should clear when 16234 is fixed. No evidence_source, supports, snippet or explanation was touched, so no grading claim changed.

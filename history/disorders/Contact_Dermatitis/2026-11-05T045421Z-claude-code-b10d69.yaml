  summary: Add the two uncurated OECD TG 442D methods, sourced from primary literature
  details: |
    Adds the two TG 442D methods this entry was missing, and sources every claim in all five TG 442D method records from the primary literature rather than from the guideline.

    Added: Epi2SensA (the second RhE marker-gene method, EpiDerm EPI-200 rather than LabCyte EPI-MODEL24, two-marker positive call, 60 percent viability floor; publication DOI:10.3390/toxics14040295) and alpha-Sens (the third ARE-Nrf2 luciferase method, quadruplicated AKR1C2 ARE driving Luc+ with an internal TK-Renilla viability control, FBS-free; publication PMID:32335162). Both MEASURES the Hapten-driven keratinocyte electrophile sensing node, with PROXY_QUANTITY and BOUNDARY_OMISSION divergences.

    An earlier version of this work cited OECDTG:442D in eleven evidence items. That was reversed. A Test Guideline describes an assay in the key-event terms of an Adverse Outcome Pathway, and a key event is not a pathograph node, so a guideline citation on a modeled_mechanisms link asserts an aggregation step that nothing in this repository records. The guideline is a lead here, on the same footing as AOP-Wiki, which no entry cites and which has never been an allowed reference prefix. Each affected model now carries a notes paragraph recording what the guideline says and why it is not cited.

    Re-sourced rather than dropped: the LuSens rat NQO1 regulatory element now cites the LuSens paper itself (PMID:25172300); the EpiSensA marker-gene to keratinocyte-response mapping now cites the EpiSensA paper (PMID:27965148), which reports the P2X7-antagonist and Nrf2-siRNA experiments that established it rather than asserting it; the Epi2SensA two-marker prediction model and 60 percent viability floor now cite the validation study (DOI:10.3390/toxics14040295). The Epi2SensA link, whose only evidence had been the guideline, now carries the EpiSensA knockdown result graded INDIRECT plus the validation study's statement that the two methods read the same markers.

    Left as leads in notes, with no primary source: the Validated Reference Method standing of KeratinoSens and of EpiSensA, the guideline's judgement that Nrf2-dependence is shown only indirectly for LuSens, and the guideline's quadruplicated-AKR1C2 construct description and 83 percent DASS accuracy figure for alpha-Sens.

    Also changed: the KeratinoSens record's OECD-acceptance evidence item was a quote_role BACKGROUND quote from the LuSens inter-laboratory paper's introduction, which attributed a regulatory statement to a research article that was only mentioning it. It was removed rather than replaced. LuSens gained a SPECIES_MISMATCH divergence for its rat NQO1 regulatory element, which until now was recorded only in prose. The EpiSensA link's description said the ATF3/IL-8 arm had no node in this entry; it now says why Keratinocyte inflammasome danger signalling is not that node, since that node's own notes decline to claim a proximal route into the inflammasome.

    Validated: just validate (190 snippets verified), plus check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-entity-refs, check-causal-targets, check-reference-titles and check-snippet-grading. check-snippet-length fails identically on an unmodified main checkout and is unrelated to this entry.

  summary: Add the two uncurated OECD TG 442D methods and cite the guideline directly
  details: |
    The guideline became citable as OECDTG:442D in the preceding commit, so the three TG 442D methods already in this entry now cite it for their own regulatory standing instead of quoting another paper's introduction, and the two methods missing from the entry were added.

    Added: Epi2SensA (the second RhE marker-gene method, EpiDerm EPI-200 rather than LabCyte EPI-MODEL24, two-marker positive call, 60% viability floor; publication DOI:10.3390/toxics14040295) and alpha-Sens (the third ARE-Nrf2 luciferase method, quadruplicated AKR1C2 ARE driving Luc+ with an internal TK-Renilla viability control, FBS-free; publication PMID:32335162). Both MEASURES the Hapten-driven keratinocyte electrophile sensing node, with PROXY_QUANTITY and BOUNDARY_OMISSION divergences.

    Changed: the KeratinoSens record's OECD-acceptance evidence item was a quote_role: BACKGROUND quote from the LuSens inter-laboratory paper's introduction, which attributed a regulatory statement to a research article that was only mentioning it. It was replaced with the guideline's own VRM statement. LuSens and EpiSensA each gained guideline citations they previously had none of, and LuSens gained a SPECIES_MISMATCH divergence for its rat NQO1 regulatory element, which until now was recorded only in prose. The EpiSensA link's description said the ATF3/IL-8 arm had no node in this entry; it now says why Keratinocyte inflammasome danger signalling is not that node, since that node's own notes decline to claim a proximal route into the inflammasome.

    Validated: just validate (195 snippets, 218 titles, 0 issues), plus check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-entity-refs, check-causal-targets, check-coarse-phenotypes, check-qualifier-terms, check-delivery-system, check-logical-rules, check-name-collisions, check-snippet-grading and check-snippet-length.

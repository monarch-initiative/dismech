  summary: 'Contact_Dermatitis: review round 1 on the SARA and SARA-ICE variables'
  details: |
    Review round on the pull request that structured the SARA and SARA-ICE input inventories. Three items, all accepted and pushed together.

    The blocking item was a consequence of the new record that the record itself pointed at. The no_node_for_integrated_outcome_prediction discussion opened 'The two computational models predict sensitization hazard and potency for the whole outcome' and its rationale enumerated 'Both the SARA model and the decision-tree defined approach'. Adding a third model with no mechanism link made the count and the enumeration false, and the new record's own notes refer the reader to that discussion, so the stale text sat exactly where a reader following the pointer would land. The prompt now speaks of the entry's computational models without counting them, and the rationale names all three. This is the failure mode the entity-reference rules describe for names, reached instead through prose: a cross-reference stayed valid while the sentence it pointed at stopped being true.

    The first optional item was a snippet that quoted from mid-sentence, beginning 'is a Bayesian framework for quantitative skin sensitization hazard and potency assessment'. It verified and cleared the length floor, but read as a fragment with its subject missing. The whole sentence from the cached abstract is now quoted, and it verifies.

    The second optional item was a provenance gap of the kind the record was otherwise careful about. The notes stated that the per-assay counts come from Methods section 2.1.1 and are not snippet-backed, but two other statements in the record are equally beyond the cached abstract and were not declared: the identification of the accepting instrument as OECD Guideline 497, where the abstract records only acceptance by the OECD and use under Mutual Acceptance of Data, and the defined approach's requirement of at least two key event inputs, which is in Methods section 2.1.2. Both are now named in the same sentence that disclaims the counts.

    Validation after the round: schema and reference validation pass with no unavailable snippets, and 145 of 145 snippets in the entry verify against cached references. validate-terms, check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-entity-refs, check-causal-targets, check-logical-rules, check-qualifier-terms, check-folded-hyphens, check-folded-yaml, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles and check-retired-support-prose all pass.

    Outcome is needs_followup because other models named in #15944 remain uncurated in this entry: U-SENS, the IL-8 Luc assay, EpiSensA, SENS-IS, skin-on-chip, and the human reference datasets. The TG 442C in chemico methods stay blocked on #16000, which proposes the CELL_FREE experimental model type they would need.

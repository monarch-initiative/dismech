  summary: Add the two OECD TG 406 guinea pig sensitization methods, mapped to the
    elicitation node
  details: |
    Issue #15944. The merged curation in #15958 added the mouse local lymph node assay but left the two guinea pig methods of OECD TG 406 uncurated, with no recorded reason. This adds them.

    Two records, not one. The source extraction that prompted this work collapsed "Buehler and Guinea pig maximization Test (GPMT)" into a single entry; they are distinct methods with different induction regimens and different sensitivity, and PMID:11028857 runs them head to head under identical conditions, so they are curated separately.

    Both map to 'Re-exposure-driven effector T-cell recruitment' as MEASURES at ORGANISM scale. That is the node whose biology each method reads: the scored endpoint is the challenge-patch reaction in an already-induced animal, which is the elicitation response to re-exposure, not the priming that produced it. Priming is inferred from the presence of that reaction. This follows Ginnie's instruction that the biology of a method is the basis for mapping it, rather than adding a node per AOP key event. Neither method is linked to 'Allergen-specific T-cell priming', which the local lymph node assay already occupies by reading draining-lymph-node proliferation directly.

    Both carry a PROXY_QUANTITY divergence: erythema and swelling graded on a four-point scale stand in for effector T-cell recruitment, with nothing antigen-specific or cellular in the readout. Allergic and irritant reactions are separated by the choice of a non-irritant challenge dose rather than by the measurement.

    Fidelity differs. GPMT is MODERATE. Buehler is LOW and carries a second divergence, BOUNDARY_OMISSION at INVALIDATING materiality, because eugenol and mercaptobenzothiazole are negative in it while scoring as strong sensitizers in the parallel GPMT under identical conditions, and higher induction concentrations are needed before allergenicity shows at all. The materiality is scoped to negative results; positive results are unaffected.

    One correction to issue #15944, which states that the guinea pig tests have documented false negatives including eugenol. PMID:11028857 shows eugenol is a strong sensitizer in the GPMT and negative in the Buehler test, so the class-level statement in PMID:20583317 conceals a method-level difference. The PMID:20583317 evidence item is graded INDIRECT on the GPMT record for that reason, and its explanation says which method the eugenol case belongs to.

    Added biological_scale: TISSUE to 'Re-exposure-driven effector T-cell recruitment' so these two links are determinable by the scale audit. Both read MODEL_ABOVE_TARGET, which the strict gate does not flag.

    Fetched PMID:11028857 and PMID:32799435 into references_cache. PMID:32799435 supplies the only cached description of the challenge scoring scale; no cached source describes the Buehler readout specifically, so the TG 406 parallel-design quote stands in for it on that record and is graded INDIRECT with the substitution stated in its explanation.


  summary: Add the two hapten-driven keratinocyte nodes (AOP 40 KE 826)
  details: |
    Closes the no_node_for_hapten_driven_keratinocyte_activation gap, which this entry had recorded in three places: the discussion itself, the limitations on the Keap1-Nrf2-ARE model link, and that link's CAUSE_UNREPRESENTED divergence.

    The entry's only keratinocyte node sat in the irritant arm, downstream of Epidermal barrier disruption, so the OECD TG 442D models were attached to the arm they exist to rule out. The sensitization arm skipped the step entirely, running from Covalent hapten-protein adduct formation straight to Skin innate immune activation during sensitization.

    Added two CELLULAR nodes rather than one, between the adduct node and innate activation:

    - Hapten-driven keratinocyte electrophile sensing (GO:0032980, GO:0062197), the Keap1-Nrf2-ARE arm.
    - Keratinocyte inflammasome danger signalling (GO:0032980, GO:0044546, GO:0141084), the NLRP3/ASC IL-1 family arm.

    Both correspond to AOP 40 Key Event 826 (Activation, Keratinocytes), and the new inbound edges are its KER 833 (KE 396 to KE 826). They were split rather than merged into one Key-Event-wide node because the entry's two models read different arms, so each now attaches to the arm it measures. The cost, recorded in the discussion's resolution_note, is that each node is narrower than the Key Event, so a consumer mapping KE 826 aggregates both. The adduct node keeps its existing direct edge to innate activation, which is AOP 40's separate KE 396 to KE 398 branch.

    Moved two model links and removed a divergence that no longer applies:

    - Keratinocyte Keap1-Nrf2-ARE sensitizer-response models moved onto the sensing node; the CAUSE_UNREPRESENTED divergence (models driven by electrophilicity, node driven by barrier injury) was deleted, and limitations rewritten to the caveats that remain, which are keratinocyte-only boundary omission and medium rather than per-area dosing in the monolayer arms.
    - NALP3- and ASC-deficient contact hypersensitivity mouse moved onto the danger-signalling node.

    No new references were needed. PMID:24794257 and PMID:17429439 were already cited in the entry; PMID:17632566, the accompanying commentary, was cached on main and is cited here for the first time. Every quote was cut as a contiguous span from the cached abstract rather than reused from the October deep-research report, which matched quotes against abstracts only. PMID:17429439's in vitro sentence is graded IN_VITRO to match the grading kb/modules/nlrp3_inflammasome_activation.yaml already gives the same sentence.

    Three of the eight new evidence items are introductory or editorial framing rather than their paper's own result and carry quote_role BACKGROUND or REVIEW_SYNTHESIS accordingly. The Nrf2 arm's outbound edge is typed INDIRECT_UNKNOWN_INTERMEDIATES and its node carries notes recording that Nrf2 induction is curated as the sensor readout, not as an established driver of the steps below it.

    The AOP 40 identifiers written into the node descriptions (Key Event 826 Activation Keratinocytes, Key Event 396, KER 833, and the KE 396 to KE 398 branch) are transcribed from issue #15944, which states them in its body and again in the comment this change answers. They were not independently checked against AOP-Wiki: aopwiki.org is outside this session's allowed network domains, so the lookup could not be run. Anyone with access should confirm them against https://aopwiki.org/aops/40 before relying on them.

    Validated: just validate, count-verified-snippets (136/136), validate-terms, and the offline per-file gates. GO:0062197 is the one new cache row.

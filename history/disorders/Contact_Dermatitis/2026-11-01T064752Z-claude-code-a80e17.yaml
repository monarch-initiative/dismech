  summary: Conform the keratinocyte inflammasome node to nlrp3_inflammasome_activation
  details: |
    Attaches conforms_to on Keratinocyte inflammasome danger signalling against nlrp3_inflammasome_activation#NLRP3 Inflammasome Assembly and Caspase-1 Activation, and records on the node why that anchor and not the module's Activating Danger Signal node.

    Why not Activating Danger Signal, which is what the module's own open discussion named and what this node's name suggests: that node is the module's Signal 2 and is defined by three proximal routes, potassium efflux, lysosomal rupture after phagocytosis, and mitochondrial damage with reactive oxygen species. Silicosis conforms there with specific crystal-uptake nodes. The evidence on this entry's node identifies none of the three, so conforming there would assert a route the entry cannot support. Which route a hapten uses is an open lead; curated later it belongs on a new upstream node.

    Why the assembly node: it states its own bar, an assembled caspase-1-activating NLRP3 complex in the causal chain, with elevated IL-1 beta alone explicitly insufficient. PMID:17429439 supplies ASC-dependent and caspase-1-dependent IL-1 beta and IL-18 processing in human keratinocytes plus the Nlrp3- and Pycard-deficient mice. The node binds both of that module node's biological processes, GO:0044546 and GO:0141084, and substitutes keratinocyte for the module's macrophage, which is the organ-specific substitution conformance exists for. It is also where all seven existing disorder conformers of this module attach.

    Not split, deliberately. The node also binds GO:0032611 and GO:0032621, which belong to the module's next node. Three conformers (Silicosis, Inflammatory_Bowel_Disease_30, Familial_Cold_Autoinflammatory_Syndrome) do split assembly from cytokine output, but each has separately evidenced steps; here one sentence covers both, so two nodes would carry the same quote with nothing distinguishing them, and the step is this entry's reading of AOP 40 Key Event 826, which a further split would fragment. No pyroptosis or gasdermin D evidence is curated, so that arm of the module's next node is not claimed.

    check-conformance-content reports no finding for the link. Read that precisely: the check asks whether the conformer shares a process term, binds a cell type, and has any downstream edge at all, and this link satisfies all three. It does not compare where the downstream edge goes. This node's edge follows the disease into skin innate immune activation rather than the module's cytokine node, and nothing checks that. An earlier draft of this record and of the module's resolution note predicted an edges_absent finding; that was wrong, because edges_absent fires only when the conformer has no downstream edges at all.

    Also folds in the cosmetic leftover review round 2 of PR #16244 flagged and declined to spend a cycle on, since this change touches the same file: the NALP3- and ASC-deficient mouse link's evidence explanation said "links this genotype to the keratinocyte activation step", phrasing from when that link pointed at the irritant arm's node, and now names the danger-signalling step it is actually attached to.

    Merge-queue ejection and its resolution. PR #16260 was enqueued and ejected with CI_FAILURE: the merge-group commit carried a duplicate `conforms_to` key on this node. PR #16269 (Curate skin sensitization AOP model inventory and mechanisms) had landed the identical conformance line on main while this change was in review, placing it before `biological_scale` where this change placed it after. Same node, same value, different line, so git merged both into one mapping with no conflict and both PRs were green against their own base. This is the merge-shaped duplicate-key failure CLAUDE.md documents, reproduced exactly. Resolved by merging origin/main into the branch and collapsing the two identical lines to one, keeping main's position; the values were byte-identical, so nothing was lost and no block had to be reconciled. Everything else in this change remained unique after #16269: the anchor-rationale note on this node, the mouse-link explanation wording, and the whole module-side resolution, which #16269 left OPEN and still attached to Activating Danger Signal.

    Validated: just validate, validate-module-batch, check-conformance-content, check-entity-refs, check-causal-targets, check-logical-rules, check-duplicate-keys, check-enum-values, check-block-scalar-comments, check-coarse-phenotypes, check-folded-hyphens, check-folded-yaml. No new references, no new cache rows, no evidence added or regraded.

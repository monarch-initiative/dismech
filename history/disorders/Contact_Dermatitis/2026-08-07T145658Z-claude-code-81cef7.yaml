  summary: Sort eleven exposures into the irritant and hapten arms
  details: |
    Backfill for issue #8085. This entry models two mechanistically separate routes to the same clinical picture, and the work here is sorting the exposures between them rather than pointing them all at one node. Wet work and detergent exposure is the sole irritant-arm link, TRIGGERS/DIRECT into the toxic-insult node, because water and surfactants damage keratinocytes directly with no sensitization required. Nine sensitizers are TRIGGERS/DIRECT into the hapten exposure node: nickel, fragrance, isothiazolinones, para-phenylenediamine, rubber accelerators, biocides, Mastisol adhesive, 2-octyl cyanoacrylate and Toxicodendron. Two further links target different nodes on purpose: repeated and high-concentration allergen exposure is PREDISPOSES into allergen-specific T-cell priming, since it is a property of the encounter rather than a hapten and the cited evidence is about risk of sensitisation; and 2-octyl cyanoacrylate gains a second TRIGGERS/DIRECT link into re-exposure-driven effector T-cell recruitment, citing the rise in reaction rates from a few percent at first exposure to over twenty percent on staged or repeat procedures, which is elicitation rather than sensitization. Not linked: the mare's milk soap entry, whose own description records that its single case report is indexed without an abstract so no quotable excerpt exists; linking it would require inventing evidence. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 85 of 99 with 14 pre-existing DOI-prefix skips; integrity issue count unchanged from origin/main.

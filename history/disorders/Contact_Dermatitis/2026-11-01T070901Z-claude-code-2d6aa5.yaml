  summary: 'Contact_Dermatitis: structure the SARA and SARA-ICE assay inputs and output
    quantities'
  details: |
    Structures the input inventory and the output quantities of the two skin-sensitization integration models this entry curates, which were previously recorded only as prose inside an evidence snippet.

    SARA model record. Added nine variables: the six input types the model accepts, and three output quantities. Added three evidence items from PMID:35835397 (Reynolds et al. 2022, Regul Toxicol Pharmacol), which was already cached in this repository and cited nowhere in kb/. That source supplies three things the entry lacked. It enumerates the six inputs and states that the model takes any combination of them. It names and defines the output quantities, the margin of exposure as the ratio of potency estimate to consumer exposure level and the risk metric as the probability that an exposure is low risk, where the entry had described this only as a measure of risk. And it sources the safety-assessment-factor question that this record's notes already asserted without a citation.

    SARA-ICE record. Added as a new computational_models record with eleven variables: seven input assay classes, each carrying its count in the model's training database, and four output quantities with units, the ED01 and the defined-approach point of departure in ug/cm2, the prediction uncertainty ratio, and the GHS subcategory probability. Six evidence items, all verified.

    Source for the SARA-ICE record: Reinke et al. 2026, NAM Journal 2:100078 (PMID:41816003, DOI 10.1016/j.namjnl.2026.100078), read from a copy of the published article supplied by the curator.

    Curation decisions. SARA-ICE is one record with two implementations, because the source presents SARA-ICE DA and SARA-ICE Extended as two implementations of one Bayesian framework differing in output and in mutability, not as two models. It is a separate record from the SARA model, because the source states SARA-ICE was built on the Unilever SARA model with an expanded training set, names the ED01 as its output quantity, and takes kinetic direct peptide reactivity assay data, which the SARA abstract's exhaustive input list does not include. Inputs and outputs both live in the variables slot, each description stating which it is, because the schema has no structural discriminator for the two; that is a candidate schema follow-up rather than something to encode in a variable name.

    Reference caching. Fetching PMID:41816003 failed repeatedly while the NCBI summary service returned 'the address table is empty' for every identifier it did not already hold. This was established to be a general outage rather than a problem with this record, by fetching a newer PMID from the same journal (42959949), which failed identically, and by establishing that an apparently successful fetch of PMID:35311660 had been a cache hit on an existing file. The identifier was independently confirmed real against Europe PMC, which returns the record and its abstract under EXT_ID:41816003. A retry loop succeeded on its sixteenth attempt. The reference is cached as abstract_only, which is the ceiling here, because neither Europe PMC nor the publisher serves a full text the fetcher can reach. All six snippets were then verified against that cache, and reference_title on each was copied from the cache frontmatter, including its trailing period, rather than written from the article. One snippet quotes the ED01 definition directly, which was only safe after confirming that the fetcher strips the abstract's subscript markup to a plain ED01 spelling; the snippet normalizer would not have folded that markup to the plain spelling.

    Facts taken from the article that no snippet covers, because they are in Methods section 2.1.1 rather than the abstract that is cached: the training database of 434 distinct chemicals and nearly 5000 data points, and its per-assay composition of 871 human predictive patch test results (506 maximization, 365 repeat-insult), 536 local lymph node assay, 650 direct peptide reactivity assay, 361 kinetic direct peptide reactivity assay, 972 KeratinoSens, 431 human cell line activation test and 164 U937 cell line activation test. The record's notes state where this enumeration comes from and that it is not snippet-backed.

    Questions the sources settled. Human repeat insult patch test and human predictive patch test are the same input under two names, the later being the umbrella term for the maximization and repeat-insult tests. Kinetic direct peptide reactivity assay is the one input class SARA-ICE adds over SARA. The 180 substances are the evaluation set, tested in three assays, and not the 434-chemical training database.

    Question left open. Each input's measured endpoint and unit as the model consumes it. The article states assay names only and defers the model internals to Reinke et al. 2025 (Curr Res Toxicol 8:100205) and Reynolds et al. 2019 and 2022, and ScienceDirect serves all three as landing pages only, so the fetcher caches them with no quotable body. Endpoints are therefore recorded only where this entry already curates the assay as its own model, as the h-CLAT record does for CD86 and CD54. Curating the direct peptide reactivity assay, kinetic direct peptide reactivity assay, KeratinoSens and U937 cell line activation test as experimental models in their own right is being handled separately under the parent issue and is deliberately out of scope here.

    Validation. Schema validation and reference validation both pass with no unavailable snippets; 145 of 145 snippets in the entry verify against cached references. validate-terms, check-duplicate-keys, check-block-scalar-comments, check-enum-values, check-entity-refs, check-causal-targets, check-logical-rules, check-coarse-phenotypes, check-qualifier-terms, check-delivery-system, check-folded-hyphens, check-folded-yaml, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, check-retired-support-prose and check-case-collisions all pass.

  summary: Link phytophotodermatitis exposure into the pathograph
  details: |
    Backfill for issue #8085. Lime and other psoralen-rich citrus exposure combined with ultraviolet light is TRIGGERS/DIRECT into the irritant exposure and toxic insult node, not into the hapten sensitization arm. Phytophotodermatitis requires both halves and is phototoxic rather than allergic: furocoumarins on the skin absorb ultraviolet A and become directly cytotoxic, so it belongs to the irritant branch of this entry. Validated with linkml-validate and just validate-terms; integrity issue count unchanged.

  summary: Add KeratinoSens and LuSens as OECD TG 442D experimental models
  details: |
    The entry curated each of the four OECD TG 442E methods as its own experimental_models entry but had none for either TG 442D method. KeratinoSens and LuSens were named only inside the description of the Keratinocyte Keap1-Nrf2-ARE sensitizer-response models entry, whose own limitations field says those four research systems are not the validated methods themselves, so the guideline tier was absent from the model list. Added one CELL_LINE entry each, both MEASURES against Hapten-driven keratinocyte electrophile sensing at CELLULAR scale, matching the node's own CELLULAR scale and the convention the TG 442E entries use (one link evidence item, limitations on every link, no readouts). KeratinoSens cites PMID:24055896 for the AKR1C2 ARE reporter construct and for the assay being a measure of the sensitizer-induced Nrf2 response, plus the TG 442D acceptance sentence from the LuSens inter-laboratory study (PMID:26796489) graded quote_role BACKGROUND and evidence_source OTHER, since that sentence restates a regulatory decision rather than reporting a result. LuSens cites PMID:26796489 for reproducibility and accuracy and PMID:25172300 for the rat NQO1 ARE construct in a human keratinocyte line. Limitations are grounded in the cited work rather than assumed: the KeratinoSens entry records that sensitizer-induced heat shock and stress markers in that same line were shown to be Nrf2-independent and so never reach the luciferase readout, and that Tween 80 is a documented Nrf2-dependent false positive. A pre/pro-hapten blind spot was considered and deliberately not recorded, because PMID:27569201 reviews the EURL ECVAM set and reports that sensitizers needing activation were correctly identified by one or more of these methods. The existing Keap1-Nrf2-ARE research-systems entry and the IL-8 Luc assay entry were left untouched; the IL-8 KE3 assignment is being revisited separately. Validated with just validate (schema, terms, 180 snippets, 203 titles) and the KB gates.

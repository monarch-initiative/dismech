  summary: Map the skin-sensitization test methods and models onto the pathograph,
    and record the steps none of them can reach
  details: |
    Issue #15944. Two OpenScientist runs over the literature behind PMID:38385441 supplied the method and mechanism detail; the runs and their prompts are committed under research/ and templates/.

    Mapped eleven methods to the nodes whose biology they measure, rather than expanding the pathograph to match AOP 40's five key events. Ginnie's instruction was that the biology of each method is the basis for mapping it to the existing pathograph, and that methods which cannot be mapped are recorded instead.

    experimental_models: h-CLAT and GARDskin onto 'Skin innate immune activation during sensitization' (both MEASURES; limitations state that THP-1 and MUTZ-3 are surrogate lines, not dendritic cells); the human T-cell priming assay onto 'Allergen-specific T-cell priming' (RECAPITULATES, primary human cells on both sides); the MUTZ-3 Langerhans-cell full-thickness skin equivalent onto the same innate node (PARTIALLY_RECAPITULATES, the only system that shows maturation together with migration out of the epidermis); and the keratinocyte Keap1-Nrf2-ARE models onto 'Keratinocyte activation and proinflammatory mediator release' with a CAUSE_UNREPRESENTED divergence, because that node is curated as the irritant arm's consequence of barrier disruption while these models drive keratinocytes through hapten electrophilicity with no barrier injury.

    animal_models: the Langerin-DTA mouse onto the innate node as PERTURBS, carrying the finding that contact hypersensitivity is amplified rather than abolished without Langerhans cells; NALP3/ASC-deficient mice onto the keratinocyte node; the DNFB regulatory T-cell model onto 'Breakdown of regulatory T-cell-mediated hapten tolerance'; and the mouse local lymph node assay onto 'Allergen-specific T-cell priming', with its nickel false negative recorded as a SPECIES_MISMATCH divergence explained by human-specific TLR4 coordination.

    computational_models: the SARA Bayesian model and the decision-tree defined approach with Derek Nexus and a kNN potency model, both onto the 'Contact dermatitis' outcome, since each infers the outcome from assay readouts rather than measuring a mechanism step.

    Three sets of methods could not be mapped, and are recorded as KNOWLEDGE_GAP discussions instead of being forced onto a node: the TG 442C in chemico methods (DPRA, ADRA, kDPRA), because no node represents covalent hapten-protein adduct formation, which is the rate-limiting step that sets potency; the TG 442D and reconstructed-epidermis methods, because the only keratinocyte node belongs to the irritant arm; and the metal route, because nickel and cobalt initiate by coordinating human TLR4 histidines 456 and 458 rather than by covalent binding.

    Did not add pathograph nodes for the five key events. Whether the pathograph should carry a chemical reaction as a mechanism step is a modelling decision left open in the covalent-haptenation discussion.

    Corrected an error in issue #15944 while working: I had described PMID:38385441 as attached to a pathophysiology node. It is not. The evidence item #15931 first placed there was removed during that PR's review as an evidence-claim mismatch, so the reference sits in the top-level catalog with findings: [] and supports nothing in the entry.

    Three reference_titles in the first draft of this change were written from memory and were wrong, one of them naming a different paper entirely for PMID:17429439; all titles were then taken from references_cache. One snippet was cut short of a bracketed isotope label that the snippet validator normalizes away.


  summary: Drop a GEO dataset evidence item that quoted only its own title
  details: |
    The evidence item on the geo:GSE153007 dataset record used the record's own title verbatim as its snippet, identical to datasets[].title and reference_title, so it asserted nothing the record did not already state. It was invisible until now because the title-snippet guard exempts dataset accessions it cannot fetch a title for, and that exemption is derived from the reference validator's skip_prefixes -- which this branch removes geo from. The GEO record has no summary (its summary field repeats the title) and NCBI reports no linked publication, so there is no abstract sentence to quote and no better source to cite. Per the guard's own documented remedies and the repository convention that a dataset record with nothing quotable carries publication/notes rather than manufactured evidence, the evidence block was removed and the reason recorded in notes. Title, description, organism, data_type and conditions are unchanged and still carry everything the evidence item restated.

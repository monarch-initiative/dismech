  summary: Curate skin sensitization AOP model inventory and mechanisms (#15944)
  details: |
    Added two pathophysiology nodes upstream of covalent hapten-protein adduct formation, split along mechanism rather than bundled: Abiotic pre-hapten autoxidation to a reactive electrophile (no ontology binding -- non-enzymatic oxidation outside the organism) and Keratinocyte pro-hapten bioactivation to a reactive electrophile (GO:0006805, keratinocyte cell type), evidenced from PMID:21742781 and PMID:23510343. Declared conforms_to from the Keratinocyte inflammasome danger signalling node to nlrp3_inflammasome_activation#NLRP3 Inflammasome Assembly and Caspase-1 Activation. Added experimental_models entries for U-SENS, the IL-8 Luc assay, EpiSensA, SENS-IS, a reconstructed-skin organ-on-chip (RhS-NP), and an endothelialised skin-on-chip (MMA-6MWP). The human predictive patch test (HPPT) reference database (PMID:37615678) is cited in the top-level references catalog and in the U-SENS record's evidence, not curated as its own experimental_models record -- it is reference data benchmarked against, not a model system. Added a computational_models entry for the Skin Sensitization Prediction Model (SSPM) and an evidence item on the existing Derek Nexus/kNN defined approach citing a structural-alerts/QSAR review. Updated the no_node_for_integrated_outcome_prediction discussion to include SSPM. Added two new KNOWLEDGE_GAP discussions (unresolved_human_priming_antigen_presenting_cell, no_reproducible_hla_basis_for_hapten_susceptibility). Added a reciprocal FLG/nickel evidence item cross-referencing Atopic_Dermatitis.yaml's genetic FLG record. Checked module fit for cdc1_tolerogenic_maturation and did not conform: that module's EPOR-driven cDC1 maturation chain is not evidenced in this entry. The TG 442C in chemico assays (DPRA, ADRA, kDPRA) remain uncurated, blocked on open PR #16010 adding a CELL_FREE experimental model type. This record was revised after an automated review round that required splitting the originally-bundled activation node, dropping the HPPT experimental_models entry, and other fixes described above; it describes the entry's state after that round, not the first commit. Ran just validate-disorders, check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-logical-rules, check-block-scalar-comments, check-folded-hyphens, check-conformance-content, model-scale-audit and check-snippet-grading; all pass.

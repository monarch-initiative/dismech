  summary: Record the unidentified proximal inflammasome route as a knowledge gap
  details: |
    Added a KNOWLEDGE_GAP discussion (unidentified_proximal_route_to_hapten_inflammasome_activation) attached to pathophysiology#Keratinocyte inflammasome danger signalling. The question of which proximal cellular event a contact hapten uses to trigger NLRP3 assembly existed only as free-text prose in that node's notes and in the nlrp3_inflammasome_activation module's resolution_note, where no query reaches it. No new literature: the one evidence item cites PMID:23809161, already cached and used in the module, quoting its introduction's enumeration of the candidate routes (graded BACKGROUND / OTHER because the sentence restates proposals established elsewhere rather than reporting this paper's own result). Validated with just validate, count-verified-snippets (176/176), check-duplicate-keys, check-entity-refs, check-enum-values and check-snippet-grading. Review round 1 corrected one phrase of the rationale: it had said the NLRP3 literature has not settled which route is causative for any one agonist class, which the evidence item directly below it contradicts, since the cited paper argues potassium efflux is the common trigger for bacterial toxins and particulate matter. It now says the literature has not reached consensus on a unifying route.

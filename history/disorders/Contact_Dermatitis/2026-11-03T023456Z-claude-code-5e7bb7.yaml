  summary: Review round 1 on the TG 442D model entries
  details: |
    Took all three optional suggestions from the automated review. Added a PROXY_QUANTITY divergence at QUALIFYING materiality to each of the two new links, because the measured quantity is induction of a transfected ARE luciferase reporter (AKR1C2 for KeratinoSens, rat NQO1 for LuSens) while the node's quantity is endogenous Keap1-Nrf2-ARE activation; this matches the EpiSensA link on the same node and the U-SENS link, which both type their caveats. No SCALE_EXTRAPOLATION was added, since model_scale and the node's biological_scale are both CELLULAR and asserting one would fail check_scale_extrapolation_divergence_agrees_with_scales. Repointed the LuSens publication slot from the inter-laboratory study to the development paper PMID:25172300, so both entries name their development paper, with the inter-laboratory study kept as the model-level evidence. Corrected the pre- and pro-hapten reasoning recorded in the preceding history entry: PMID:27569201 reports that sensitizers requiring activation were identified by one or more methods of the non-animal battery, which is a claim about the battery and not about either of these assays on its own, so the earlier decision to omit the caveat entirely read more into that paper than it says. Both limitations now record that a monolayer lacks the stratum corneum and metabolic competence a reconstructed epidermis uses to activate a pre- or pro-hapten, and state the battery-level finding alongside it rather than in place of it. That also removes an internal inconsistency: the U-SENS limitations already end with a cell-only pro-hapten caveat, and the EpiSensA description already credits the reconstructed epidermis with activating pre- and pro-haptens that monolayer cell-line assays miss, a sentence that describes these two entries. Re-validated with just validate (180 snippets, 203 titles), just model-scale-audit (14 typed divergences, no uncaveated upward extrapolation) and the offline KB gates.

  summary: 'Review round 1: split CHMP1A from TBC1D23, mine both GeneReviews chapters,
    wire the last 5 phenotypes'
  details: |
    Review round 1 on PR #12656. Addressed the reviewer's item 1: the Endosomal and Golgi Membrane Trafficking Failure node bound CHMP1A under GO:0042147 retrograde transport endosome to Golgi, which none of CHMP1A's cited sources support. Split into ESCRT-III Dysfunction and Impaired Progenitor Proliferation (CHMP1A, bound to GO:0036258 multivesicular body assembly and GO:0061351 neural precursor cell proliferation, both looked up in the local GO build and both directly quoted from PMID:30044992 and PMID:23023333) and Golgi Trafficking Failure (TBC1D23, keeping GO:0042147). Each node has its own evidence and downstream edge; the entry description, the PCH8 subtype row and the CHMP1A genetic notes were updated to match, and the CHMP1A note records why the gene is not grouped with TBC1D23. Addressed item 3: the two GeneReviews chapters were tagged but cited only for subtype definitions, so evidence was added from their Diagnosis sections to Molecular Genetic Testing (biallelic TSEN54 and biallelic EXOSC3 confirmation), from their Management sections to Symptomatic and Supportive Care (the PCH2 rhabdomyolysis risk during severe infections and the hydration measure directed at it) and to Physical Therapy and Movement-Disorder Care (contracture and scoliosis management), and from the Genetic Counseling section to the inheritance block (recessive mode plus the 25/50/25 sib risks). The rhabdomyolysis risk is now also stated in the supportive-care description and the PCH2A subtype description. Took suggestions A and C: regraded the PMID:42178111 introduction sentence from IN_VITRO to HUMAN_CLINICAL with quote_role BACKGROUND, since it describes human genetics in an in-vitro paper's introduction, and added a sentence to the spliceosome node saying that TOE1's snRNA maturation feeds the spliceosome PPIL1 belongs to, so the pairing reads as one pathway rather than one category. Also wired the five phenotypes that were still causally disconnected: Dyskinesia and Respiratory Insufficiency from the TSEN node, Lactic Acidosis from the RARS2 node, Hypotonia from the VRK1 node and Feeding Difficulties from the shared endpoint, each reusing a snippet and evidence_source already present in the entry. The entry now reports 11 of 11 phenotypes causally connected, up from 0 before this PR and 6 after its first commit.

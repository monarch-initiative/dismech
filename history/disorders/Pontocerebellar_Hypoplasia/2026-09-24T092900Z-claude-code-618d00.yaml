  summary: 'Round 2: source the PCH11 postnatal-timing claim, which no cited paper
    supported, plus two more'
  details: |
    Round 2 on PR #12656, pushed after approval because one of the fixes corrects a claim that misattributes support to a paper, rather than a stylistic point. Self-review of the round-1 edits found four prose claims that no cited snippet supported; three are on this entry. The serious one was introduced by round 1 itself: the Golgi Trafficking Failure node and its downstream edge both state that the cerebellar change in PCH11 is postnatal rather than prenatal, and until now nothing cited on either supported that. The nearest citation was PMID:28823706, which does not mention postnatal timing anywhere in the cached record; its own explanation field correctly scoped it to the milder clinical course, so no explanation field asserted anything false, but a reader checking the postnatal claim would have landed on a paper that does not make it. PMID:32360255 does make it, was fetched, and is now cited on both the node and the edge. PMID:28823706 stays where it is, still correctly scoped to the non-degenerative character of the subtype, which is what it reports. The second fix sources the same node's description claim that TBC1D23 bridges endosome-derived vesicles to golgins, which is present in the full text of PMID:38413626, a paper the node already cited, but had not been quoted. The third sources the ESCRT-III node's statement that the CHMP1A proliferation defect tracks loss of the normal BMI1 repression of INK4A, using the chromatin-immunoprecipitation sentence from PMID:23023333, which the node already cited for a neighbouring claim. No other content changed; the entry remains at 11 of 11 phenotypes causally connected and all 20 causal genes wired.

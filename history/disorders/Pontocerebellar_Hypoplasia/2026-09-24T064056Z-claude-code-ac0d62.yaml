  summary: 'Genetics pass: enumerate 17 gene-defined PCH subtypes, add 8 mechanism
    nodes, wire phenotypes'
  details: |
    Gene-defined subtype enumeration under the Pontocerebellar Hypoplasia umbrella for the genetics-gap campaign (dismech#12230, epic #12189). Sanity-checked the parent anchor first: MONDO:0020135 is the PCH group class this entry models, so the anchor is correct and no re-anchoring was needed. Added 17 gene-defined has_subtypes rows (PCH1C, PCH1D, PCH1E, PCH2A, PCH2B, PCH2C, PCH2F, PCH3, PCH5, PCH7, PCH8, PCH9, PCH11, PCH12, PCH14, PCH16, PCH17), each with a bound subtype_term, a bound hgnc gene descriptor, a sourced description and exact-quote evidence, taking the list from 6 rows to 23. Added 15 reciprocal genetic records carrying the subtype foreign key, added the FK to four pre-existing records, and bound a gene_term on the RARS2 record, which had none. Wired each new gene to the complex or process it acts in rather than to a flat list: widened the RNA exosome node to carry EXOSC3, EXOSC8 and EXOSC9, and added eight new mechanism nodes (spliceosome and snRNA maturation failure; endosomal and Golgi membrane trafficking failure; mitochondrial membrane dynamics disruption; coenzyme A biosynthesis deficiency; purine nucleotide metabolism failure; inositol polyphosphate metabolism failure; cerebellar GABAergic neuron specification failure; presynaptic active zone assembly failure), all converging on the existing shared endpoint node. That endpoint node had no downstream edges at all, so no phenotype in the entry was causally connected; it is now wired to six phenotypes and the entry reports 6 of 11 connected. Corrected a factual error in the existing TSEN54 notes, which assigned TSEN15 to PCH2D: PCH2D is caused by SEPSECS, and TSEN15 gives PCH2F. Sourced the previously uncited A307S Northern European founder claim. Updated the entry description and notes, which still said four subtypes were curated. Tagged the two GeneReviews chapters for this disease and cited both. Validated with just validate, just validate-terms, just count-verified-snippets (161/161), just list-gene-term-mismatches, the offline gates and just validate-disorders.

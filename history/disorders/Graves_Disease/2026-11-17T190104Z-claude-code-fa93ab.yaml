  details: |
    Issue #6330. Added three evidence items from the Yamauchi et al. medRxiv preprint (PPR:PPR1276345, 18-patient Japanese teprotumumab cohort versus a matched historical IV glucocorticoid cohort) to the existing Teprotumumab treatment: proptosis and CAS improvement, the MRI finding that teprotumumab reduced both extraocular muscle and orbital fat area while IVGC increased orbital fat, and 6/18 discontinuations for hearing loss. Each explanation states the preprint status. Added therapeutic_modality MONOCLONAL_ANTIBODY and target_phenotypes (proptosis, diplopia). Added a clinical_trials block with OPTIC (NCT03298867, phase 3, completed) and the phase 2 RV 001 trial (NCT01868997, completed); phase and status read from the ClinicalTrials.gov v2 API. No separate thyroid eye disease entry was created: TED stays inside Graves_Disease, where its mechanism node already lives. Validated with just validate-disorders (131/131 snippets), validate-terms, and the whole-repo snippet, title and grading gates.

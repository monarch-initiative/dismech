  summary: Backfill evidence_source on 121 evidence items (#6980)
  details: |
    Bulk-retagged all 121 evidence items in Graves_Disease.yaml that were missing evidence_source, per issue #6980's Section 1 audit (Graves_Disease had 121/122 items missing, the largest gap of the four flagged legacy entries after Addisons_Disease was fixed in PR #8720). Classification method: checked each of the 78 unique cited PMIDs' cached title/abstract (all already present in references_cache/) plus the exact quoted snippet text for animal/in-vitro/computational language. Of the 121 items, 102 are genuinely HUMAN_CLINICAL clinical-cohort, case-report, or systematic-review content (patient cohorts, thyroid function tests, ophthalmopathy series, genetic-association studies, treatment trials), 18 are the ORPHA:525731 reference items (Orphanet phenotype-frequency rows) tagged OTHER, matching the dominant existing convention for ORPHA references across the KB (6074 OTHER vs 200 HUMAN_CLINICAL corpus-wide), and 1 is MODEL_ORGANISM. The MODEL_ORGANISM exception, flagged in the issue itself, was confirmed and applied: biochemical[2].evidence[2] citing PMID:19631028 has a snippet explicitly about 'mice lacking the thyroid hormone receptors alpha and beta' -- tagged MODEL_ORGANISM despite the parent paper being a human-relevant review, since evidence_source classifies the cited claim's own evidence type, not the paper's overall subject. Applied via a surgical line-based script that located each '- reference:' block lacking a sibling evidence_source line and inserted it immediately after supports:, matching the file's existing field-ordering convention (reference, reference_title, supports, evidence_source, snippet, explanation) exactly -- no other content or formatting was touched. Post-review correction (PR #8844 review): biochemical[1].evidence[1] citing PMID:6894450 was retagged from the initially-applied HUMAN_CLINICAL to IN_VITRO -- the cited study is an ex vivo enzyme-kinetics assay on thyroid tissue homogenates obtained at surgery, not a clinical observation, matching how the file already tags the analogous PMID:9292944 T-cell assay. The corpus split is therefore 101 HUMAN_CLINICAL / 18 OTHER / 1 MODEL_ORGANISM / 1 IN_VITRO. Validated with just validate (schema + terms + references), just count-verified-snippets (126/126 verified), just check-duplicate-keys, and the full Graves-scoped pytest suite (16/16 passed).

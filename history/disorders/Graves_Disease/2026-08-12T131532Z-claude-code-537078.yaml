  summary: Link smoking to the orbital node and record the contested stress evidence
  details: |
    Backfill for issue #8085. Smoking points at the TSHR-IGF1R orbital fibroblast node rather than at the thyroid autoantibody nodes, because that is where its evidence actually lands: the strongest sentence available names smoking the most important risk factor for the occurrence and progression of the eye disease specifically, and for its poorer response to immunosuppression, not for hyperthyroidism. That sentence makes a wider claim than any single effect value can carry, covering occurrence, progression and treatment response at once, so the link description holds what the grade cannot. Stress is the weakest link in this tranche and its description says so rather than leaving it to the grade. Both available items are paper titles rather than sentences from an abstract, so each carries a claim without the result behind it, and they disagree with one another: one revisits stressful life events as a factor while the other reports that chronic recurrent stress from panic disorder does not precipitate the disease. The refuting item is carried on the link deliberately, since a contested exposure should look contested in the pathograph rather than appearing settled. The link is MODULATES rather than EXACERBATES, and the predicate choice is the whole content of the link. EXACERBATES is one of the causal predicates in qc_plugins, so it renders as a causal arrow and counts toward mechanistic explanation in compliance scoring; MODULATES is non-committal by construction. Nothing available here earns a causal claim, and contestedness belongs in the supports values rather than in the predicate. It was written as EXACERBATES first and corrected on review. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 126 of 126 verified.

  summary: 'Create: Severe_X-linked_Mitochondrial_Encephalomyopathy'
  details: |
    New entry for severe X-linked mitochondrial encephalomyopathy (COXPD6, MONDO:0010437), caused by hemizygous AIFM1 variants. Scoped to the encephalomyopathic, combined-OXPHOS-deficient end of the AIFM1 spectrum; CMTX4 (Cowchock), the AUNX1 subtype of Auditory Neuropathy and Spondyloepimetaphyseal Dysplasia Bieganski Type are left as their own allelic entries and named in notes.

    Sources. One openscientist deep-research report (research/Severe_X-linked_Mitochondrial_Encephalomyopathy-deep-research-openscientist.md) was used as leads. Its reference validation was retrofitted with just validate-research-reference: 18/18 references resolved, 18/19 quotes found (the unfound one was a title fragment of PMID:30300862, not used). Term validation could not be written into the report because every run of just validate-research-terms aborted on a 5 s OLS read timeout; the partial term cache showed the report's suggested NCIT:C737 (Pesticide, offered as riboflavin), NCIT:C1198 (Poly ICLC, offered as coenzyme Q10) and HP:0007002 (Motor axonal neuropathy, offered as axonal sensorimotor neuropathy) to be wrong, so no CURIE was taken from the report. just preflight-dr exited 2 because no local mondo.db is present; disease identity was checked by hand (the report names AIFM1 35 times, OMIM 300816 and p.Arg201del, matching the stub's MONDO causal gene). Additional primary literature was found by PubMed search (Berger 2011, Kettwig 2015, Ardissone 2015, Diodato 2016, Morton 2017, Zambon 2023, Hangen 2015, Meyer 2015, Salscheider 2022, Vahsen 2004, Joza 2005, Klein 2002).

    Content. Eight pathophysiology nodes form a chain from unstable AIF protein through impaired CHCHD4 import and defective complex assembly to combined OXPHOS deficiency, with a parallel parthanatos branch, converging on neuronal degeneration, mitochondrial myopathy and cardiomyocyte energy failure. Thirty phenotypes, all causally connected. Death in infancy is carried in progression rather than as a phenotype because HP:0001522 is outside the PhenotypeTerm enum. Two animal models (harlequin hypomorph, muscle/heart Aif knockout) are linked to mechanism nodes. Riboflavin/cofactor treatment is recorded with both supporting and refuting evidence. No GeneReviews or StatPearls chapter exists (check-genereviews --online: NO_CHAPTER).

    Validation. just validate, validate-terms, count-verified-snippets (101/101), check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence, check-folded-hyphens, check-coarse-phenotypes, check-reference-titles and validate-disorders all pass; list-disconnected-phenotypes reports 30/30 connected.

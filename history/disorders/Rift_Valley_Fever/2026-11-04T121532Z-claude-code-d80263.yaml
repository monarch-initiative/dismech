  summary: 'Create: Rift Valley Fever'
  details: |
    Created de-novo entry for Rift Valley fever (RVF), MONDO:0017880, an emerging mosquito-borne zoonotic phlebovirus (RVFV, NCBITaxon:11588) in the viral hemorrhagic fever family. Deep research performed with the claude_code provider (research/Rift_Valley_Fever-deep-research-claude_code.md; 4/4 references resolved, 0 off-topic, no needs_review). Pathophysiology curated as a causal chain: NSs-mediated type I interferon antagonism -> high viraemia/hepatotropic spread -> hepatocellular necrosis and endothelial activation/vascular leak -> consumptive coagulopathy/DIC -> hemorrhage/thrombocytopenia; plus two delayed severe nodes (immune-mediated retinitis -> vision loss; meningoencephalitis -> encephalitis). Two nodes conform to the viral_hemorrhagic_fever_syndrome module (High Viremia and Vascular Target Infection; Increased Vascular Permeability). Evidence anchored chiefly on the Ikegami & Makino pathogenesis review (PMID:21666766, full text), the Kenya 2007 outbreak risk-factor study (PMID:20682901, human clinical), and an RVFV-host innate immunity review (PMID:36618346). Corrected one textbook-draft claim against the review: Kupffer cells are not primary RVFV targets, so only hepatocyte replication is asserted. Added Rift Valley Fever as a member of the Viral_Hemorrhagic_Fevers grouping and deleted stubs/Rift_Valley_Fever.yaml. Validation: just validate (schema+terms+references) pass, 36/36 snippets verified, check-granularity deterministic classes 0, check-entity-refs/check-causal-targets/check-name-collisions/check-logical-rules/check-coarse-phenotypes/check-duplicate-keys/check-snippet-grading all clean, check-genereviews NO_CHAPTER (infectious, not Mendelian; recorded in notes). preflight-dr SKIP (no causal gene; arbovirus).

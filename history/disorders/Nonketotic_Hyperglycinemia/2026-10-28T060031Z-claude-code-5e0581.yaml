  summary: 'Address review of PR 15787: wire GlyT1 node to CSF glycine and respiratory
    distress'
  details: |
    Responding to the review of PR 15787. The GlyT1 glycine transporter loss of function node now has downstream edges to CSF glycine (Kurolap 2016, PMID:27773429, one human and one mouse sentence) and to Neonatal respiratory distress (PMID:27773429, PMID:33269555). A subtype-scoped biochemical record, Serum glycine in GlyT1 encephalopathy (presence NORMAL), records the normal serum glycine, and the unscoped Plasma glycine row now notes that its INCREASED value holds only for the glycine cleavage system forms. EEG with burst suppression gains a single-case GlyT1 encephalopathy evidence item from PMID:33269555. The subtype description now quotes the one-in-four survival figure instead of saying most die in infancy. No NMDA edge was added: the only quotable support in the cited abstracts is background framing about glycine as an NMDA co-agonist, which does not show that GlyT1 loss changes NMDA signalling in patients. Validated with just validate, validate-terms, count-verified-snippets (106/106), check-causal-targets, check-entity-refs, check-enum-values and check-snippet-grading.

  summary: 'Review round: bind MONDO:0017353 to the classical neonatal subtype'
  details: |
    Addresses the 2026-09-20 review on PR #12356, which found the PR title promised subtype_term binding that the diff did not contain.

    Bound 'Classical neonatal nonketotic hyperglycinemia' to MONDO:0017353 'neonatal glycine encephalopathy'. Verified with runoak -i ols:mondo info MONDO:0017353, which returns that label exactly. just validate-terms then added MONDO:0017353 to cache/enums/diseaseorsubtypeterm_6d5891ec946f.csv, which is the enum-membership confirmation - presence in the label cache alone would not have established it.

    Left the 'Attenuated nonketotic hyperglycinemia' row unbound and recorded the negative-existence search in its review_notes, per the CLAUDE.md rule that such a note must name the query verbatim and report what it returned. Both searches were re-run immediately before writing the note rather than taken from the review:
    - runoak -i ols:mondo search 'l~glycine encephalopathy' returns exactly six terms: MONDO:0011612 (parent, this entry's disease_term), MONDO:0017354 infantile, MONDO:0017353 neonatal, MONDO:0015010 atypical, and MONDO:0958179 / MONDO:0958192 (the GLDC/AMT numbered forms bound in this PR as disease-level narrowMatch mappings).
    - runoak -i ols:mondo search 'l~attenuated' returns six terms, none a glycine encephalopathy: attenuated FAP plus its APC- and AXIN2-related forms, classic-or-attenuated FAP, MPS II attenuated form, and attenuated Chediak-Higashi syndrome.
    The two remaining glycine-encephalopathy siblings are onset-based (infantile, atypical); neither means 'attenuated', so binding one would assert an onset this severity row does not claim. The reviewer reached the same conclusion independently.

    The PR title's subtype_term claim is now accurate, so no retitle is needed.

    Validation: just validate (86/86 snippets), just validate-terms, check-duplicate-keys, check-entity-refs, check-enum-values, check-term-cache-integrity all pass. Cache diffs are derived output of just validate-terms, not hand-written.

  summary: Add GlyT1 encephalopathy (SLC6A9, MONDO:0015010) subtype
  details: |
    Picked up the SLC6A9 item deferred by PR #12919 and listed as stranded on issue #12931. Added a MONDO-bound GlyT1 encephalopathy subtype (MONDO:0015010 atypical glycine encephalopathy, OMIM 617301, a MONDO child of the entry's MONDO:0011612), an SLC6A9 genetic record with ClinGen's Definitive AR tier copied from its CGGV record, a GlyT1 loss-of-function mechanism node wired to arthrogryposis and hypotonia, and an arthrogryposis phenotype scoped to the subtype. Evidence from PMIDs 27481395, 27773429, 32712301 and 33269555, all abstracts fetched with just fetch-reference. Also recorded ClinGen Definitive tiers on the existing GLDC and AMT records, which check-gene-validity listed as backfill. The GCSH/MMDS7 lump-split question from the same deferral was not decided. Validated with just validate-disorders, count-verified-snippets (100/100), validate-terms, check-gene-validity and the whole-repo snippet gates.

  details: |
    Bound MONDO:0958179 (glycine encephalopathy 1, GLDC-associated) and MONDO:0958192 (glycine encephalopathy 2, AMT-associated) as disease-level skos:narrowMatch mondo_mappings against this entry's MONDO:0011612 term. Both numbered MONDO IDs came from folded stubs Glycine_Encephalopathy_1.yaml and Glycine_Encephalopathy_2.yaml (deleted by PR #9855, genes GLDC/hgnc:4313 and AMT/hgnc:473 respectively). Confirmed both CURIEs and labels live via 'runoak -i ols:mondo info' before binding (both resolved with exactly the expected labels). Not bound as has_subtypes rows: this entry's existing has_subtypes (Classical neonatal nonketotic hyperglycinemia, Attenuated nonketotic hyperglycinemia) are defined by clinical severity, not by gene, and GLDC/AMT are already modeled as genetic: entries ('GLDC pathogenic variants', 'AMT pathogenic variants') rather than has_subtypes rows -- forcing the numbered MONDO IDs onto either severity row would misattribute gene identity to a severity axis. This follows the same pattern used in PR #12055 for Erythropoietic_Protoporphyria/Paroxysmal_Nocturnal_Hemoglobinuria. Validated with just validate, just validate-terms, just count-verified-snippets (86/86), just check-duplicate-keys, just check-entity-refs, just check-enum-values, just normalize-cache, just check-term-cache-integrity, just check-cache-order, and pytest -k Nonketotic (2 passed).

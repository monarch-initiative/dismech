  summary: 'Create: Distal Arthrogryposis Type 2B1 (TNNI2)'
  details: |
    New gene-specific entry for MONDO:0020820 (TNNI2-defined Sheldon-Hall syndrome). Lump/split: kept gene-specific to match MONDO's DA2B subtype split; the entry covers the TNNI2 allelic series including families labelled DA1 or DA2A, and records in description/notes that DA1 and DA2B have been proposed as phenotypic extremes of one disorder (PMID:23401156) and that a TNNI2 family met strict Freeman-Sheldon criteria (PMID:23850728). Mechanism chain: TNNI2 C-terminal variant (actin/tropomyosin binding GO terms, no modifier because the binding change itself was not measured) -> increased Ca2+ sensitivity (IN_VITRO, troponin-exchanged rabbit psoas fibers, PMID:17194691) -> proposed increased fetal fast-twitch contractility (author proposal, flagged as a knowledge gap per PMID:19309503) -> congenital distal contractures. A mouse-only bone/Hif3a node (PMID:25340332) explains small body size in the knock-in and is labelled as untested in humans; a type 2 fiber myopathy node rests on one K176del family (PMID:16924011). Clinical phenotypes come largely from a gene-pooled Sheldon-Hall review (PMID:19309503) so no frequencies are given. Parental somatic mosaicism (PMID:36631501) is recorded for counseling but HP:0001442 is not bound. Deep research: OpenScientist report committed under research/, used as leads only; all cited PMIDs were fetched and snippets verified against references_cache. PMID:24829975 was fetched but not cited because its abstract equates Sheldon-Hall with DA2A, and PMID:17101001 (R156X recurrence) was not cited because no abstract is cached. Validated with just validate, validate-terms, count-verified-snippets (59/59), validate-disorders and the KB gates.

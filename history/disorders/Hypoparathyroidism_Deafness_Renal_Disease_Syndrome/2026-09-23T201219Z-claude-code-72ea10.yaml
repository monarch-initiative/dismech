  summary: 'Create: Hypoparathyroidism-Deafness-Renal Disease Syndrome'
  details: |
    New entry for HDR (Barakat) syndrome, MONDO:0007797, caused by heterozygous GATA3 loss of function. Curated 9 pathophysiology nodes in three organ branches from GATA3 haploinsufficiency: parathyroid (reduced GCM2 expression in progenitors, parathyroid hypoplasia, reduced PTH transactivation, deficient PTH secretion), cochlea (outer hair cell degeneration) and kidney (dysregulated nephric duct and ureteric bud development, mesangial precursor deficiency, glomerular injury and nephron loss). 20 HP-bound phenotypes, all with an incoming causal edge; GATA3 genetic record; autosomal dominant inheritance; CASES_IN_LITERATURE prevalence; diagnosis; four treatments (calcium plus calcitriol, palopegteriparatide, hearing rehabilitation, kidney transplantation); three differential diagnoses; the Gata3 heterozygous mouse as animal model. No GeneReviews chapter exists (just check-genereviews --online: NO_CHAPTER). One OpenScientist report was used: research/Hypoparathyroidism_Deafness_Renal_Disease_Syndrome-deep-research-openscientist.md. Its generation step failed at term validation on an OLS timeout, so reference and term validation were re-run with just validate-research-reference and just validate-research-terms: 28/28 references resolved, 4 quoted claims not matched (all abbreviated with ellipses; the unabbreviated source text was confirmed), 1 off-topic reference (PMID:15253763, not cited), 0 unresolved terms. just preflight-dr returned WARN because the hormone PTH is mentioned often; MONDO, OMIM 146255 and GATA3 all match. Most evidence comes from PubMed searches; from the report the entry takes PMID:31069810, PMID:28857066, PMID:39987371 and PMID:42166177. The palopegteriparatide evidence is from hypoparathyroidism of mixed causes, not HDR specifically, and says so. Validation: just validate-disorders passed (schema, terms, 75/75 snippets verified); check-causal-targets, check-entity-refs, check-duplicate-keys, check-coarse-phenotypes, check-qualifier-terms, check-snippet-length, check-title-snippets, check-snippet-grading and check-reference-titles all OK.

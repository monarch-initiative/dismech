  summary: 'Review round 1: Hypoparathyroidism-Deafness-Renal Disease Syndrome'
  details: |
    Changes made in response to the first review of PR 12639. The genital phenotype was rebound from HP:0000078 to HP:0010460 (Abnormality of the female genitalia), with coarse_binding_basis VARIABLE_SPECTRUM and frequency FREQUENT. Its evidence is the PMID:42595857 statement that 37.5% (3/8) of female patients had anomalies; one of the three carries a GATA3 variant of uncertain significance. Bicornuate uterus (HP:0000813) was added from the same paper's Table 1. Vaginal atresia was not added, because it occurred only in the patient with the VUS, and uterine duplication was not added because the source does not say which form it was. Unilateral renal agenesis (HP:0000122) and hydronephrosis (HP:0000126) were added from PMID:42595857 and linked from the nephric duct node. The proteinuria phenotype was rebound to HP:0012593 Nephrotic range proteinuria, because both of its citations describe nephrotic-range disease. The frequency on hypocalcemic seizures was removed and the description rewritten to give the 2/6 source figure. A note on the GCM2 node records the CL searches showing there is no parathyroid progenitor term. The branchiootorenal syndrome differential now has evidence from PMID:42595857. Validation: just validate-disorders passed (schema, terms, 81/81 snippets); causal-target, entity-ref, duplicate-key, coarse-phenotype, qualifier, snippet-length, title-snippet, snippet-grading and reference-title checks all OK; 23/23 phenotypes causally connected.

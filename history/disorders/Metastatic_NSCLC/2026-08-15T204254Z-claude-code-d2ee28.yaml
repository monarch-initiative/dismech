  summary: Add ICD-O morphology and Harrison's chapter classification
  details: |
    Weekly compliance pass, cancer-classification/ICD-O theme. Added a classifications block with icdo_morphology=Carcinoma and harrisons_chapter=ONCOLOGY_HEMATOLOGY. Derivation: the entry disease term MONDO:0005233 non-small cell lung carcinoma carries NCIT:C2926 Lung Non-Small Cell Carcinoma, which OAK confirms is a descendant of NCIT:C2916 Carcinoma, the NCIT term the ICDOMorphologyEnum Carcinoma value is bound to. Carcinoma rather than Adenocarcinoma is the correct level because NSCLC is a clinical grouping spanning adenocarcinoma, squamous cell carcinoma and large cell carcinoma; that reasoning is recorded in notes. Validated with just validate.

  summary: Reground disease_term to MONDO:0043985 central nervous system lupus
  details: |
    Entry was grounded to MONDO:0007915 (systemic lupus erythematosus) - the parent disease rather than the neuropsychiatric manifestation - and shared that grounding with the Systemic_Lupus_Erythematosus entry. MONDO:0043985 'central nervous system lupus' is a child of MONDO:0007915 and carries 'neuropsychiatric systemic lupus erythematosus' as a RELATED synonym (oio:hasRelatedSynonym, from MESH:D020945); its only EXACT synonyms are 'CNS lupus' and 'central nervous system lupus', both CNS-scoped. Regrounded disease_term to MONDO:0043985, recorded as skos:closeMatch rather than skos:exactMatch on the basis of that RELATED synonym scope, corroborated by the MONDO label and definition being CNS-scoped whereas the ACR neuropsychiatric SLE case definitions also cover peripheral nervous system syndromes, so the concepts are not strictly co-extensive. Direction of the mismatch: MONDO:0043985 is NARROWER than this entry's scope, not broader - the entry curates peripheral neuropathy (HP:0009830) as both an ACR criterion and a full phenotype, so the disease_term does not subsume everything the entry covers. It remains the closest available grounding; MONDO has no standalone NPSLE term. MONDO:0007915 retained as skos:broadMatch. Validated with 'just validate' and 'just count-verified-snippets'.

    Correction (in place, pre-merge, in response to PR #8671 review): an earlier draft of this record and of the entry's mapping_justification stated that 'neuropsychiatric systemic lupus erythematosus' was an EXACT synonym of MONDO:0043985. That was wrong about MONDO - it is a RELATED synonym - and it made the justification reason against its own evidence, since an EXACT synonym would have argued for exactMatch rather than closeMatch. The stale description prose asserting that no standalone MONDO term was found and that the entry is anchored to the parent SLE term was corrected at the same time.

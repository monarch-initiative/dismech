  summary: Reground disease_term to MONDO:0043985 central nervous system lupus
  details: |
    Entry was grounded to MONDO:0007915 (systemic lupus erythematosus) - the parent disease rather than the neuropsychiatric manifestation - and shared that grounding with the Systemic_Lupus_Erythematosus entry. MONDO:0043985 'central nervous system lupus' carries 'neuropsychiatric systemic lupus erythematosus' as an exact synonym and is a child of MONDO:0007915. Regrounded disease_term to MONDO:0043985, recorded as skos:closeMatch rather than skos:exactMatch: the MONDO label and definition are scoped to the central nervous system, whereas the ACR neuropsychiatric SLE case definitions also cover peripheral nervous system syndromes, so the concepts are not strictly co-extensive. MONDO:0007915 retained as skos:broadMatch. Validated with 'just validate' and 'just count-verified-snippets'.

  summary: Remove mapping provenance from the disease description
  details: |
    The description ended with a paragraph explaining why the entry is grounded to MONDO:0043985 and why the mapping predicate is closeMatch rather than exactMatch. That is curation provenance about the mapping, not a description of the disease, and it does not belong in the description field.

    Introduced in PR #8671 when stale grounding prose in this field was rewritten rather than removed: the rewrite corrected the content but kept it in the wrong slot.

    The text is also fully redundant. mappings.mondo_mappings[0].mapping_justification already states every claim it made -- that MONDO has no NPSLE term, that MONDO:0043985 is the closest available grounding, that it is NARROWER than this entry's scope, and that closeMatch was chosen on that basis -- and states them more precisely, citing the RELATED synonym scope and the peripheral neuropathy phenotype. So this is a deletion, not a relocation to notes.

    The description now covers only the disease: the nervous-system manifestation spectrum of SLE, its central and peripheral syndromes, and the attribution difficulty.

    Checked the other four entries edited in the same PR (Aflatoxin_Related_HCC, Malnutrition-related_Diabetes_Mellitus, Adult_Refsum_Disease, and Metastatic_Prostate_Cancer which has since been folded into its parent by #9808) -- none carries mapping provenance in its description.

    A repo-wide scan finds 80 entries whose description mentions a MONDO CURIE, but sampling shows those are a different and defensible usage: referring to an identifier to make a scoping or differential claim precise, e.g. 'this entry models the primary disease represented by MONDO:0015281' or 'distinct from adult-type hypolactasia (MONDO:0100345)'. Those were left alone; only mapping-predicate provenance was removed here.

    Validated with 'just validate' (schema + terms + references) and 'just count-verified-snippets' (86/89 verified, 3 skipped by prefix).

  summary: 'Address review on PR #10448 (Denys-Drash)'
  details: |
    Response to the ai4c-reviewer CHANGES_REQUESTED review on PR #10448. Six items, all fixed.

    Item 2 was a genuine error, and one the PR description made worse. The review found that diffuse mesangial sclerosis, the disease-defining lesion, had no HPO binding and no phenotype entry, and that the PR body's claim that 'HP:0001967 is used instead' was not true of the diff. Verified: HP:0001967 appeared nowhere in the file. What happened is that the wrong CURIE from the deep-research report (HP:0005567, Renal magnesium wasting) was correctly rejected, the right term was looked up, and then the lesion was modeled only as a pathophysiology node with a CL cell-type binding, so the HP term never entered the entry. Diffuse Mesangial Sclerosis now exists as a bound phenotype alongside the pathophysiology node of the same name, and the PR description has been corrected.

    Item 1, reference_title: added to all evidence items, verbatim from each references_cache frontmatter.

    Item 3, GeneReviews DIAGNOSIS/TESTING unmined: added a diagnosis: block. The reviewer's observation that the entry argued for immunosuppression avoidance on the grounds of establishing the WT1 genotype early, then never modeled establishing it, was correct; the block description now makes that link explicit.

    Item 4, Wilms tumor surveillance: restored. This was dropped during initial curation for a traceable reason recorded in the first history record: NCIT:C17167 turned out to be Statistics rather than Screening, and the treatment was removed rather than rebound. NCIT:C15406 (Cancer Screening) is the correct term and is now used.

    Item 5, kidney replacement therapy and Wilms tumor treatment: both added. The entry established ESRD within four months in 7/10 patients and offered no treatment addressing it, which was a real gap.

    Item 6, Ratelade 2010 Wt1 R394W knock-in mouse: added as an animal_models entry, RECAPITULATES against the podocyte transcriptional program node, with a target-gene expression readout. Limitations record that the model speaks to the renal arm only.

    Non-blocking suggestions not taken this round, with reasons. The clinical_trials gap (NCT01252901) and a progression: section are both real but need their own sourcing pass rather than being assembled from what is already cached. The uncited 'transmission from an affected or mosaic parent' claim was noted by the reviewer as unfixable from PMID:1327525, whose cache is title-only; it is left as prose for now.

    Validation: validate-disorders passes; 41/41 snippets verified; 41/41 evidence items carry reference_title; entity-ref, causal-target, duplicate-key, enum-value, title-snippet, snippet-length and snippet-grading gates clean; the WT1_Disorders grouping still validates with all three members SATISFIED.

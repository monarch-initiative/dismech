  summary: 'Create: Denys-Drash Syndrome'
  details: |
    De novo curation of Denys-Drash syndrome (MONDO:0008682, WT1) from a falcon/Edison deep-research report (research/Denys-Drash_Syndrome-deep-research-falcon.md) plus independent PubMed searching, with the GeneReviews WT1 Disorder chapter (PMID:32352694) as the mandatory phenotype baseline.

    The falcon report was citation-thin: its sidecar contained only the query, and the body yielded 3 resolvable references and 4 DOIs, of which one (Ratelade 2010, PMID:19797313) was a usable primary source. Most references were therefore found independently, seeded by the PMID list the report surfaced from an Open Targets query. Evidence rests on PMID:1655284 (Pelletier, germline zinc-finger variants and tumor LOH), PMID:8388765 (dominant-negative mechanism), PMID:9607189 and PMID:24402088 (genotype-phenotype and cohort frequencies), PMID:19797313 (podocyte WT1 targets in a DMS mouse line), and PMID:9499425 (Frasier contrast).

    Two corrections against the report were applied rather than inherited. Its term-validation section flagged HP:0005567 (Renal magnesium wasting) as bound to a row describing diffuse mesangial sclerosis; the correct term HP:0001967 was used instead, and the wrong CURIE was not carried into the entry. Its UBERON:0000473 (testis) binding for a generic 'gonads' row was likewise not reused.

    Nosology: the GeneReviews chapter states that Denys-Drash and Frasier are one phenotypic continuum and are no longer clinically helpful designations. MONDO has no umbrella term for that continuum, so the entry is retained on MONDO:0008682 with the continuum recorded in the description, Frasier in differential_diagnoses, an OPEN KNOWLEDGE_GAP discussion, and a new kb/groupings/WT1_Disorders.yaml uniting Denys-Drash, WAGR, and Meacham. This framing was chosen by the curator, not assumed.

    Named Entity Confusion preflight PASS (WT1 mentioned 88 times; MONDO OMIM 194080). Validation: just validate passed; 31/31 snippets verified; validate-terms passed; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading all clean. Stub stubs/Denys-Drash_Syndrome.yaml deleted.

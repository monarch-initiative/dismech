  summary: 'Take review suggestions on PR #10448 (Denys-Drash)'
  details: |
    Second response round on PR #10448, after the reviewer approved the six blocking fixes and left three suggestions. All three taken, and the first corrects an error in the previous round's reasoning rather than adding an improvement.

    The inheritance description claims transmission from an affected or mosaic parent is documented. The previous round deferred citing it, recording in both a history record and a PR comment that PMID:1327525 could not supply a snippet because its cache is title-only. That statement about PMID:1327525 is true but was the wrong thing to check. The GeneReviews record already cited in this entry carries both halves of the claim outright: a parent heterozygous for the proband variant in rare instances, and sibling recurrence risk above background because of possible parental gonadal mosaicism. The clause was citable from a source already in hand, and the deferral happened because the search anchored on the reference the reviewer had named in passing instead of re-reading the cache the entry already uses. Both sentences are now evidence items.

    Also taken: diagnosis_term bound to NCIT:C15709 (Genetic Testing), matching the POT1 entry in this series and 416 others; and Kidney Replacement Therapy split into Dialysis (NCIT:C15221) and Kidney Transplantation (NCIT:C15265), because the single entry was named more broadly than the transplantation term it bound, leaving the dialysis half unqueryable. Both kidney-replacement evidence items now carry directness INDIRECT: the diaphragmatic-hernia-timing sentence supports dialysis by sequencing other surgery around it rather than by recommending it, and the four-month ESRD figure supports transplantation by establishing the course rather than the intervention.

    Noted and deliberately not changed: the Diffuse Mesangial Sclerosis phenotype shares its name with the pathophysiology node of the same name, so dismech.graph's flat namespace collapses them into one node. That is the documented issue #9896 pattern rather than a curation error, check-causal-targets reports self 0 for this file, and both items carry their own evidence. Binding the lesion in both places was judged better than leaving it unbound to avoid the collapse.

    Validation: 43/43 snippets verified; validate, reference-titles, entity-refs, causal-targets, duplicate-keys, enum-values, snippet-grading and snippet-length all clean; WT1_Disorders still validates with all three members SATISFIED.

  summary: 'Create: Spermatogenic Failure 49 (CFAP58)'
  details: |
    New entry for spermatogenic failure 49 (MONDO:0030868), CFAP58-related MMAF. Deep research with the claude_code provider (research/Spermatogenic_Failure_49-deep-research-claude_code.md); just preflight-dr returned PASS for CFAP58. Snippets taken from references_cache only; the primary CFAP58 papers are cached as abstracts, so per-feature flagellar HP terms were not bound and MMAF is recorded as Abnormal sperm tail morphology. Chain: loss of CFAP58 (structural molecule activity, decreased; midpiece) -> axoneme disorganization with central pair and radial spoke defects, plus mitochondrial sheath malformation -> MMAF -> infertility. The disagreement between central-pair assembly (knock-in mouse) and radial spoke-doublet interface (human sperm) is recorded in the node description and as a CONTESTED_ASSUMPTION divergence on the knock-in model. ICSI success recorded from two series. ClinGen has no CFAP58 curation and no GeneReviews chapter exists. Stub stubs/Spermatogenic_Failure_49.yaml deleted. Validated with the full gate list and validate-disorders.

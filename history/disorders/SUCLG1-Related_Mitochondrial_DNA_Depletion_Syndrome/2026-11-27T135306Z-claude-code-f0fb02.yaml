  summary: 'Create: SUCLG1-Related Mitochondrial DNA Depletion Syndrome (MTDPS9)'
  details: |
    New entry for mitochondrial DNA depletion syndrome 9 (MONDO:0009504; OMIM 245400; ORPHA:17), caused by biallelic SUCLG1 variants, created from the stub stubs/Mitochondrial_DNA_Depletion_Syndrome_9.yaml, which is removed. Named SUCLG1-Related Mitochondrial DNA Depletion Syndrome after the GeneReviews chapter title and the MONDO exact synonym, matching the sibling SUCLA2 entry. SUCLG1 encodes the alpha subunit common to the ADP- and GDP-forming succinyl-CoA ligases; the lesion node binds both GO activities (GO:0004775, GO:0004776) as DECREASED, supported by the finding that patient fibroblasts lose activity with ATP and GTP and lose the SUCLA2 and SUCLG2 beta subunits (PMID:20453710, PMID:31240156, PMID:20693550, PMID:27484306). The pathograph has three branches from the lesion: loss of Krebs cycle substrate-level phosphorylation (PMID:30470562) and anaplerosis feeding the liver disease (PMID:20453710); the proposed NDPK/nucleotide-supply route to mtDNA depletion and combined respiratory chain deficiency (PMID:17668387, PMID:18392745), with refuting evidence that depletion is not constant (PMID:20197121, PMID:26028457, PMID:30470562); and succinyl-CoA accumulation leading to the mild methylmalonic aciduria (PMID:28017724, PMID:42187506). Phenotypes follow the GeneReviews abstract (PMID:28358460) and the 71-patient SUCLA2/SUCLG1 review (PMID:26475597: onset at birth, median survival 20 months, hepatopathy 38%, hypertrophic cardiomyopathy 14%, basal ganglia involvement 80%), with counts from a 2026 systematic review of 13 Chinese cases (PMID:42187506). Treatments are supportive (GeneReviews), with single-case or uncontrolled reports of aspartate, vitamin/CoQ10 therapy, liver transplantation (one patient who also carried POLG variants) and the pooled deoxycytidine/deoxythymidine trial NCT04802707 (PMID:40175578). relationship_type CAUSATIVE: more than 20 patients from unrelated families with functional rescue (PMID:27484306). ClinGen classifies SUCLG1 only against Leigh syndrome spectrum (MONDO:0009723, Moderate, 2019); that tier is a broader disease and is recorded in genetic notes, not in gene_disease_validity. Validation: linkml-validate, term validation (OLS), reference validator with --no-full-text (137 snippets, 0 issues), count-verified-snippets 137/137, check-entity-refs, check-causal-targets, check-name-collisions, check-gene-validity (one report-only other_disease row for the Leigh record), check-enum-values, check-duplicate-keys, check-coarse-phenotypes, check-folded-hyphens, check-snippet-grading, list-gene-term-mismatches and check-genereviews all pass.

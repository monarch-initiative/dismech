  summary: 'Create: MTHFD1 Deficiency (MONDO:0060611, CIMAH)'
  details: |
    De-novo curation of MTHFD1 deficiency (MONDO:0060611). Deep research: openscientist, 2663s. The recipe exited 3 because term validation hit a 5s OLS read timeout (dismech#10396); reference validation was retro-fitted successfully (16/16 resolved, 0 confabulations, 13/16 assessed on topic, 0 off topic) but term validation could NOT be recovered - two further attempts failed, once on HP:0004430 and once on MedGen:1615364, so this report carries no Term Validation section. That is safe here because no ontology CURIE in this entry came from the report: every term was selected and validated independently, and just validate-terms passes. The report was checked for Named Entity Confusion: just preflight-dr PASSES, and although the report cites neural-tube-defect polymorphism literature, it does so under an explicit 'Common susceptibility (distinct entity)' heading contrasting the common R653Q variant against this Mendelian disorder, which is the correct distinction. The report contributed four references the initial curation had missed, three of which were used: PMID:32414565 (the first direct measurement of MTHFD1 enzyme function in patients - no detectable dehydrogenase activity in any of four, with protein at 4.8-14.3% of control in three and ~44% in a fourth, so protein level and catalytic function dissociate), PMID:23296427 (an independent SCID patient in whom immune reconstitution was only partial), and PMID:42301236 (two Kuwaiti children homozygous for c.517C>T p.Arg173Cys, adding failure to thrive, developmental delay and autoimmune thyroiditis, and a stark outcome contrast where one improved on folic acid and the other died on day 18 of intensive care). The fourth, PMID:26408344, was deliberately NOT used as an animal model: it is the Mthfd1S(+/-) mouse modelling the common R653Q polymorphism, a distinct entity, and adding it would have imported exactly the confusion the report avoided. A note on the molecular node records why no mouse model of this disease exists (homozygous Mthfd1 disruption is early embryonic lethal). The causal chain is built around the discriminating flux experiment: formate incorporation into methionine fell 90% and into dTMP 50% while purine biosynthesis was unaffected, so a single lesion in nuclear de novo thymidylate biosynthesis accounts for both the megaloblastic anemia and the immunodeficiency; that resolved question is recorded as an INTERPRETATION discussion. Validation: just validate passes with 43/43 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys and check-qualifier-terms all pass.

  summary: 'Review round 1 on PR #10990: autoimmunity phenotype, hydroxocobalamin,
    structured variants'
  details: |
    Applied all three blocking findings from the automated review of PR #10990, plus the
    two suggestions, in a single push (main has dismiss_stale_reviews, so each round costs
    a full re-review cycle).

    Blocking 1 - missing autoimmunity phenotype. Added Autoimmunity (HP:0002960, OCCASIONAL)
    with evidence from PMID:42301236 and PMID:32414565, and wired it into the pathograph as
    an INDIRECT_UNKNOWN_INTERMEDIATES downstream target of Lymphocyte Developmental and
    Proliferative Failure rather than leaving it as an unconnected clinical observation.
    While in the phenotype section, also added Retinopathy (HP:0000488), Hepatic fibrosis
    (HP:0001395) and Metabolic acidosis (HP:0001942).

    Term trap worth recording: the deep-research report suggested HP:0002153 for "severe
    metabolic acidosis". HP:0002153 is Hyperkalemia. The correct term is HP:0001942. The
    report's CURIE was checked against the ontology rather than taken on trust, per the
    dismech-terms rule that a report CURIE is a lead. This is noted in the evidence
    explanation on that phenotype so a later curator does not re-import the wrong code.

    Blocking 2 - hydroxocobalamin treatment. Added as pharmacotherapy with CHEBI:27786,
    carrying three evidence items including a REFUTE on cobalamin-responsiveness. The
    treatment is recorded as adjunctive and empiric, not mechanistically targeted: MTHFD1
    sits upstream of the cobalamin-dependent step, so B12 repletion does not correct the
    enzyme defect, and the cited series does not report a response attributable to it.

    Blocking 3 - structured genetics. Added relationship_type CAUSATIVE, variant_origin
    GERMLINE, and five structured variants covering all seven reported alleles
    (c.517C>T p.Arg173Cys; c.727+1G>A; c.806C>T p.Thr296Ile with c.1674G>A; c.146C>T
    p.Ser49Phe with c.673G>T p.Glu225*; exon 13 deletion). functional_effects is a list of
    FunctionalEffect objects (function/description/type), not a bare enum - two earlier
    shapes failed schema validation before this was established.

    Suggestions taken: added a biochemical section (four markers) and an experimental_models
    section (patient fibroblasts with modeled_mechanisms, readouts and limitations).

    Open question answered for the reviewer: there is no GeneReviews chapter for MTHFD1
    deficiency. This was checked against PubMed directly; the reviewer flagged it as
    unverified because their runner has no network egress.

    A note was added on the molecular node recording why no mouse model is cited: homozygous
    Mthfd1 disruption is early embryonic lethal so there is no viable null, and the available
    Mthfd1S(+/-) mouse models the common R653Q synthetase polymorphism, which is a distinct
    entity from this Mendelian disorder.

    Validation after the round: 64/64 snippets verified against cached references; schema,
    terms, entity refs, causal targets, duplicate keys and qualifier terms all clean.

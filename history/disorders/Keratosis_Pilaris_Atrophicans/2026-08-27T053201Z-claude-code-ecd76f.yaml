  details: |
    Curated the CURATE_ROOT_WITH_SUBTYPES entry for keratosis pilaris atrophicans (MONDO:0018855) per issue #8962. Modeled has_subtypes for keratosis pilaris atrophicans faciei/ulerythema ophryogenes (MONDO:0859588, closeMatch to MONDO:0018086) and atrophoderma vermiculatum (MONDO:0008849) with full description/evidence; cross-referenced (not duplicated) the pre-existing Keratosis_Follicularis_Spinulosa_Decalvans.yaml (MBTPS2) as the third subtype. Curated the root LRP1 autosomal-recessive causal gene (PMID:26142438), the monosomy-18p association (PMID:8041661, PMID:24801913), and the RASopathy (cardiofaciocutaneous/Noonan) phenotypic-overlap association (PMID:21062266, PMID:30141192, PMID:36541891), explicitly noting KPA is NOT modeled as a member of kb/groupings/RASopathies.yaml (association is phenotypic overlap, not RAS-MAPK-driven primary disease). Deep research: ran just research-disorder falcon Keratosis_Pilaris_Atrophicans; just preflight-dr FAILed on the automated gene-frequency heuristic (report most-mentioned gene MBTPS2 vs MONDO canonical-gene relationship LRP1, mentioned 0 times). Manually reviewed the report against the MONDO record's is-a subtype structure (KFSD/AV/UO-KPAF all confirmed true is-a children of MONDO:0018855), its OMIM handling (report correctly scoped OMIM:308800 to X-linked KFSD specifically rather than misattributing it to the root), and its subtype naming -- concluded this is a tool limitation for a genetically heterogeneous umbrella/disease_grouping MONDO term (LRP1 is reported in only one family) rather than true Named Entity Confusion, and independently re-verified the report's strongest quantitative claim (55/61, 90 percent UO in CFC) directly against the primary PMID:21062266 abstract before using it. All evidence items in the committed entry are sourced from PMIDs fetched and verified independently via PubMed E-utilities, not paraphrased from the falcon report. Validation: just validate (schema+terms+references, 27/27 snippets), just count-verified-snippets (27/27), just validate-terms (pass), just check-duplicate-keys (pass); just validate-disorders run once before PR.

  details: |
    Addressed the 4 IMPORTANT items from the claude-code-review of PR #9689 (0 CRITICAL). (1) Added a histopathology section with three findings (Follicular Keratotic Plugging NCIT:C35541, Perifollicular and Perivascular Lymphocytic Inflammation NCIT:C35980, Follicular Destruction and Dermal Fibrosis NCIT:C3044) each mapped to a named pathophysiology node; found a PMID (12602976) for the Jansen 2003 atrophoderma vermiculata case report that the reviewer had only cited by its DOI (10.1046/j.1468-3083.2003.00517.x, in skip_prefixes and not machine-verified) and used the PMID instead, independently re-fetching and re-verifying the abstract text was identical before quoting it; also cited PMID:8166484 (Baden and Byers 1994, a general 21-patient KPA case series) and PMID:9720693 (already cited). (2) Added a root-level 'Scarring alopecia of scalp' phenotype (HP:0004552) with a downstream edge from Follicular Atrophy and Cicatricial Change, sourced from the same PMID:8166484 case series (8/21 patients with scalp involvement), scoped carefully in its description to note the finding is most pronounced in the KFSD end of the spectrum but is documented in general/mixed-type KPA too, not only KFSD. (3) Bound inheritance_term on both inheritance blocks: HP:0001419 (X-linked recessive inheritance) on the KFSD subtype block, HP:0000007 (Autosomal recessive inheritance) on the LRP1 genetic entry block, matching the Alport_Syndrome.yaml pattern. (4) Wired target_mechanisms on three of four treatments: Topical Retinoid Therapy to Follicular Keratinocyte Hyperproliferation and Plugging (MODULATES), Topical Corticosteroid Therapy to Perifollicular Inflammation (INHIBITS), Pulsed Dye Laser Therapy to Perifollicular Inflammation (MODULATES, with its own evidence item noting the laser targets the vascular/erythema component specifically, mechanistically distinct from corticosteroid action). Left Genetic Counseling unwired deliberately -- it has no defensible mechanistic pathograph target.
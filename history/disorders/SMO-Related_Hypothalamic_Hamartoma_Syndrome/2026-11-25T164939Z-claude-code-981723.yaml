  summary: 'Create: SMO-Related Pallister-Hall-Like Syndrome'
  details: |
    De novo curation of MONDO:0009436 (SMO, AR Pallister-Hall-like syndrome / congenital hypothalamic hamartoma syndrome, OMIM 241800). claude_code deep research. Mechanism: biallelic germline SMO LoF -> impaired Hedgehog signal transduction at the primary cilium (normal ciliogenesis, dysregulated ciliary GLI2 trafficking) -> malformation continuum: hypothalamic hamartoma (->gelastic seizures), microcephaly, AVSD, postaxial polydactyly, short long bones, Hirschsprung disease. ClinGen MODERATE (Syndromic Disorders GCEP) in gene_disease_validity; kept distinct from GLI3 Pallister-Hall (AD) and mosaic activating-SMO Curry-Jones (MONDO:1030005). Smo-null mouse PARTIALLY_RECAPITULATES (embryonic-lethal, cardiac morphogenesis). Corrected a misremembered mouse-model PMID (11440719->11440720) by Europe PMC lookup. 16/16 snippets verified; all gates pass.

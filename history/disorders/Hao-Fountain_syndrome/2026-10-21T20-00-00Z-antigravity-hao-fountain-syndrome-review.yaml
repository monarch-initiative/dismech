  summary: Reviewed Hao-Fountain syndrome entry, mining GeneReviews (PMID:41343689) across inheritance, phenotypes, diagnosis, treatments, and references, adding ORPHA-derived prevalence and HAFOUS synonym, and refining USP7 haploinsufficiency molecular_functions.
  details: Added HAFOUS synonym; populated point prevalence (<1/1,000,000, ORPHA:643549); grounded USP7 haploinsufficiency with GO:0004843 (cysteine-type deubiquitinase activity) backed by DOI:10.3389/fcell.2026.1782599; mined GeneReviews (PMID:41343689) and tagged it in references, adding Hypogonadism (HP:0000135), Unsteady gait (HP:0002317), Strabismus (HP:0000486), Hypermetropia (HP:0000540), Nystagmus (HP:0000639), Reduced bone mineral density (HP:0004349), and Joint contracture (HP:0034392) with pathograph edges from PRC1-associated chromatin dysregulation, frequency qualifiers on Global developmental delay, Intellectual disability, and Hypogonadism, GeneReviews evidence on inheritance and diagnosis, and three management entries under treatments.

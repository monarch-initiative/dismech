  summary: Review CTLA4 insufficiency using primary full-text clinical and functional
    evidence
  details: |
    Reviewed the existing entry against the matching ASTA report and its citation list, then used cached primary publications and available full text to expand disease-specific evidence. Sources include the two 2014 discovery studies (PMID:25213377, PMID:25329329), the 2018 carrier and malignancy cohorts (PMID:29729943, PMID:30250467), the full 2022 treatment report recovered through its author-repository PDF (PMID:34111452), functional diagnostics (PMID:28159733), the 2019 MYPPPY and mRNA studies, the 2022 enteropathy and gene-editing studies, the 2026 Phe56Cys study, and the IUIS table. Used the 2024 transplant and 2026 ABACHAI abstracts where full text was unavailable; the official ICTRP:DRKS00017736 record supplies phase and completed status. Reference files were generated through the official fetcher.

    Separated quantitative CTLA4 loss, allele-specific dimerization, ligand capture, transendocytosis, Treg suppression, activation, tissue infiltration and B-cell abnormalities. Retained the disagreement about conventional T-cell and B-cell intrinsic effects, incomplete penetrance, mouse/human dosage mismatch, and the limited scope of ectopic-expression and adoptive-transfer experiments. Added ten representative alleles and distinguished preserved staining from functional competence. Avoided pooling overlapping cohorts, assigning composite-organ rates to specific phenotypes, or adopting internally inconsistent percentages.

    Completeness assessment: phenotype coverage adequate (36 findings across immune, blood, lung, gut, CNS, skin, endocrine, growth, liver, kidney and malignancy domains); subtypes not applicable because the sources do not establish distinct CTLA4 mechanistic disease subtypes; pathophysiology adequate (11 events, with provisional allele-specific and unresolved cell-intrinsic effects explicit); treatments/trials adequate (26 management records and completed phase II ABACHAI, including unsuccessful empiric treatments, expert-protocol sulfasalazine, transplant risk and limited splenectomy response); genetics adequate (dominant inheritance, penetrance, variant classes and representative functional evidence); biomarkers/diagnostics adequate (five diagnostic approaches and two explicitly limited biomarkers); references adequate (19 cited sources including primary full text); overall consumption adequate. ASTA retrievals about general CVID, LRBA-specific mechanisms, rheumatoid arthritis, cancer checkpoint blockade and aging were not transferred into genetic CTLA4 disease claims. Alias-aware GeneReviews check found no chapter in the 2026-09-10 snapshot.

    Schema, ontology and reference validation passed with 167 verified snippets and 186 checked titles. Dataset accession dbgap:phs000797 verified through the repository resolver. Internal entity references, causal targets, coarse phenotype annotations, knowledge-gap targets and source-defect checks passed. Additional pre-PR checks and independent PR review are recorded in the PR thread.

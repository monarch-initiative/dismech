  summary: 'Create: Mitochondrial Complex I Deficiency, Nuclear Type 39 (MC1DN39,
    NDUFB7)'
  details: |
    De novo curation of MC1DN39 (MONDO:0859320, OMIM:620135, NDUFB7). Deep research: one OpenScientist run, committed as research/Mitochondrial_Complex_I_Deficiency_Nuclear_Type_39-deep-research-openscientist.md. This run did emit both reference_validation and term_validation frontmatter blocks and both report sections (11/11 references resolved, 8/11 on topic; 37 terms checked, 1 obsolete, 4 labels mismatched). Three of those four label mismatches are false positives from the report's phenotype table, where the validator read the table's Type column as the term label, so HP:0001639 was reported as Sign/imaging and HP:0001903 as Lab abnormality; the CURIEs themselves are correct and are used. Entry content is built on PMID:33502047 (Correia 2021, the index patient with genome sequencing, RNA sequencing, protein and enzyme measurement and a wild-type NDUFB7 complementation rescue), PMID:27626371 (Stroud 2016, the accessory-subunit knockout screen) and PMID:22644603 (Koene 2012, 130 nuclear complex I deficiency cases). Two nodes carry mechanism_confidence PROVISIONAL: the assembly-destabilisation step, because the cached record of the knockout screen states the module principle across accessory subunits without naming NDUFB7's individual result, and the tissue-selectivity step, which is standard mitochondrial-medicine inference rather than a measurement in this patient. The complementation rescue is curated as a RESCUES modeled_mechanisms link on the patient fibroblast model, since it is the causality argument for the whole entry. Three knowledge gaps record the single-patient prognosis problem, the generic provenance of the module mechanism, and the ascertainment bias created by the causal variant being deep intronic. One schema constraint was hit and is documented in the prognosis discussion rather than worked around: the patient's fatal outcome could not be curated as a phenotype because HP:0003811 Neonatal death sits in HPO's mortality branch and is outside the PhenotypeTerm dynamic enum. Validation: just validate passed with 25/25 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-snippet-boundaries, check-snippet-length, check-title-snippets, check-folded-hyphens, check-snippet-grading and check-enum-values all clean.

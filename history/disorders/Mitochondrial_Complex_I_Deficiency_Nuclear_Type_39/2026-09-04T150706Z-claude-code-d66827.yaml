  summary: 'Review round 1: MC1DN39'
  details: |
    First review round on PR 10939, in response to the ai4c-reviewer CHANGES_REQUESTED review. All three blocking items and all five suggestions addressed in one push. Blocking item 1, no diagnosis section: added in the push immediately preceding this review round, covering the enzymology-then-genome-sequencing-then-RNA-sequencing route and why exome-only analysis would have returned nothing in this patient. Blocking item 2, no treatments section while a therapy review sat cached and uncited: two treatment entries were added, Supportive and Symptomatic Management bound to NCIT:C15747 and Empiric Mitochondrial Cofactor Supplementation bound to NCIT:C15986 with riboflavin, coenzyme Q10 and carnitine as CHEBI therapeutic_agent values, both citing PMID:28943110 with evidence_source OTHER because it is a narrative review of the disease class rather than a study of this disease. Both entries state plainly that nothing has been reported for a MC1DN39 patient and that the cofactor evidence base is a small number of trials in a heterogeneous group. Blocking item 3, GeneReviews: PMID:26425749 was tagged in the preceding push, and this round adds the notes paragraph the reviewer asked for, recording that it is deliberately not cited as evidence because its cached record carries only the chapter's statement of purpose, and noting that the index patient's cardiac-predominant congenital presentation is not a Leigh phenotype. Suggestions taken: a biochemical block recording NDUFB7 protein abundance and complex I activity as the paired diagnostic measurement, with the complementation assay as what makes them interpretable for a variant of uncertain significance; prevalence added in the preceding push; and the two orphaned phenotypes, intrauterine growth retardation and anemia, now carry explicit paragraphs saying they are left unconnected on purpose and why, rather than leaving a reader to wonder. On the uncited caches, the reviewer offered consume or drop: PMID:28943110 is now consumed, and PMID:20157008, PMID:25085991, PMID:26363424, PMID:26824698 and PMID:34069703 were removed from the PR. On the HP:0003811 request to file an issue, a duplicate check found issue 9496 already covering the mortality branch being outside PhenotypeTerm, so a comment was added there with this entry's data point instead of opening a second issue. Validation after the round: just validate passed with 33/33 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-snippet-boundaries, check-snippet-length, check-title-snippets, check-snippet-grading and check-enum-values all clean.

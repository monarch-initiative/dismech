  summary: 'Correct a history/tree mismatch: MC1DN39 GeneReviews paragraph'
  details: |
    The reviewer on PR 10939, while approving, noticed that the history record for the previous round claimed to add a paragraph recording why PMID:26425749 is tagged as GeneReviews but not cited as evidence, and that no such paragraph existed in the entry. That is correct and the cause was mine: the edit was applied with a string replacement whose anchor did not match, and unlike the other replacements in the same script that one carried no assertion, so it failed silently and the round was validated and pushed without it. The GeneReviews tag itself did land; only the explanatory paragraph was missing. This round adds the paragraph to the entry description, so the previous record's details are now true of the tree. That is the reason for pushing to an already-approved pull request and accepting the loss of the approval: a history record is append-only and, once merged, a record describing a change that is not in the tree cannot be corrected. Choosing between amending the earlier record and making the tree match it, making the tree match is the better outcome, because the paragraph is content the reviewer asked for in the first place and the entry is better for having it. The paragraph records that the chapter is tagged following sibling entries MC1DN2, MC1DN6 and MC1DN34, that its cached record carries only the chapter's statement of purpose so any snippet would attest to the chapter's aims rather than to a fact about NDUFB7 disease, and that the index patient's cardiac-predominant congenital presentation is not a Leigh phenotype. The reviewer also corrected their own earlier count of uncited caches in this pull request, from six to zero: four cache files are added by this branch and all four are cited, and PMID:26425749 was already present in main. No action follows from that correction. Validation after this change: just validate passed with 33/33 snippets verified; check-entity-refs, check-duplicate-keys, check-snippet-boundaries and check-folded-hyphens all clean.

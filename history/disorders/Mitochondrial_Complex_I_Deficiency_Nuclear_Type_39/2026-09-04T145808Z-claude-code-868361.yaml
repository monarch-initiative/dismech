  summary: 'Pre-emptive fixes from the DFNA83 review: MC1DN39'
  details: |
    Applied to this entry, before its own review ran, the structural findings from the ai4c-reviewer review of the sibling PR 10936. A prevalence record was added as CASES_IN_LITERATURE ULTRA_RARE, noting that a single case supports no estimate and pointing at the ascertainment discussion for why the reported count may understate the true one. A diagnosis block was added recording the route that actually solved this case: enzymology showing isolated complex I deficiency, then whole genome sequencing because the causal variant is deep intronic and outside reliable exome capture, then RNA sequencing to demonstrate rather than predict the splicing consequence. PMID:26425749 Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview is tagged as GeneReviews in the references block, tag only and with no evidence items, following the convention in sibling entries MC1DN2, MC1DN6 and MC1DN34. One self-inflicted defect was caught by a gate rather than by review and is worth recording: adding the diagnosis block introduced a third copy of the quoted sentence about reduced NDUFB7 protein and reduced complex I activity, graded IN_VITRO, while the two existing copies were graded HUMAN_CLINICAL. check-snippet-grading failed on the divergence. All three were normalised to IN_VITRO, which is the correct grading under the CLAUDE.md rule that measurements in cultured cells are IN_VITRO regardless of species, since these assays were run on patient fibroblasts. Validation after the round: just validate passed with 28/28 snippets verified; check-entity-refs, check-causal-targets, check-duplicate-keys, check-snippet-boundaries, check-snippet-length and check-snippet-grading all clean.

  summary: 'Gene-family review: FOLR1 on its trigger node; origin and ClinGen'
  details: |
    The trigger node FOLR1 Biallelic Loss of Function and Folate Receptor Alpha Deficiency bound folic acid receptor activity (GO:0061714) as decreased but did not name FOLR1; the gene is now on that node. The genetic record lacked a variant origin, record-level inheritance and its ClinGen tier; it now records germline origin, an autosomal recessive inheritance block copied from the entry-level evidence, and the ClinGen Intellectual Disability and Autism GCEP Definitive (AR) tier for MONDO:0013110, this entry's disease_term (CGGV:assertion_22c12588-dc55-4e90-827a-d7a6349e38a9-2017-10-20T100000.000Z).

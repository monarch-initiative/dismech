  summary: Add indoor firing range to the environmental exposure sources
  details: |
    Added an `Indoor firing range` record to `environmental:`, linked to the `Lead absorption` pathophysiology node with `environmental_effect: TRIGGERS`.

    The entry previously listed ten exposure sources - paint, dust, water, spices, food cans, battery manufacture, mining, e-waste, and lead-adulterated opium and heroin - and none of them was a firearms source, although indoor ranges are a recurring cause of frank occupational lead poisoning where the classical industrial sources are regulated. The record carries the inhalational route, which the paint and dust records do not, and the take-home route to household contacts.

    Evidence is three abstract snippets from the UK civilian range outbreak (PMID:38302418: the recognised-risk statement, the 87 exposed including close contacts, and the nine of sixty-three tested who reported any symptom) plus the Korean worker cohort's airborne measurement on the mechanism link (PMID:40551605: airborne lead near firing zones about seven times the occupational limit). Both are HUMAN_CLINICAL.

    Two deliberate restrictions. The exposure is not attributed to a named primer compound: lead azide prompted the record, but no source found attributes range lead to lead azide or lead styphnate specifically, the occupational literature measures elemental lead without speciating it, and the compound named in forensic residue work is lead styphnate. And the bindings are coarse because the ontologies are: ECTO has no inhalational lead class and ENVO no shooting-range class, with the searches recorded in the record's `notes`.

    Validation: `just validate` clean; `just count-verified-snippets` 154/154 verified; `just validate-terms` passed, adding one ENVO row to `cache/envo/terms.csv` and the environmentterm enum cache.

  summary: Drop vacuous title-echo findings from the references block
  details: |
    Seven entries in this entry's deep-research references block carried a findings item whose statement and supporting_text were both the paper's own title, with no evidence block. A paper title is not a finding, which is what check-title-snippets exists to catch, and these items asserted nothing. Their findings lists are now empty; each reference keeps its reference id, title and found_in, so no information is lost. Five of the seven were failing reference validation because their cached reference files carry content_type unavailable, leaving nothing for a supporting_text to be checked against, and that failure was blocking CI on PR 18934. The alternative route, fetching abstracts so that a title could be verified against a cached title, would have turned the gate green while leaving the defect in place. The four blocked DOIs do resolve to PubMed records with abstracts (PMID:35244845, PMID:11346806, PMID:39476342 which has no abstract, and PMID:39012763); the fetcher's DOI providers were unreachable from this container rather than the papers being unavailable. One cache file is improved in passing: a forced re-fetch of DOI:10.1289/ehp.6517 succeeded through a reachable provider and that file now holds the real abstract instead of empty content. Lead_Poisoning now validates with 0 issues and 0 unavailable snippets.

  details: |
    Follow-up to the review of PR #10123, addressing its two blocking findings.

    1. Ferrochelatase Inhibition node. The node bound heme biosynthetic process
    (GO:0006783, DECREASED) to a mature erythrocyte (CL:0000232). Ferrochelatase is
    a mitochondrial inner-membrane enzyme and mature erythrocytes are anucleate and
    amitochondrial, so the binding asserted heme synthesis in a cell that cannot
    perform it. Rebound the node to erythroblast (CL:0000765), the erythroid cell
    that does, matching the module's own trigger node. The description was rewritten
    to keep the zinc protoporphyrin biomarker claim correct: the block acts in the
    nucleated precursors, and the resulting ZPP persists in the circulating red
    cells the entry measures.

    2. Conformance completeness. Three nodes declaring or implying conformance were
    missing processes their module nodes declare.

    - Ferrochelatase Inhibition now declares conforms_to
      heme_biosynthesis_porphyria#Heme Biosynthesis Enzymatic Block and carries the
      module node's second process (GO:0006778, ABNORMAL). This also makes the
      module note added by PR #10123 accurate: it asserted that lead's
      ferrochelatase inhibition conforms to the same node set, while the node itself
      carried no conforms_to. Two nodes in one entry conforming to the same module
      node is established practice (Adult_T_Cell_Leukemia_Lymphoma among others),
      and is right here, because lead blocks the pathway at two independent steps.
    - Shortened Erythrocyte Lifespan and Erythropoietic Strain gained erythropoiesis
      (GO:0030218, INCREASED), which the module node declares and which the node's
      own PMID:1030853 evidence already documented (erythroid hyperplasia, increased
      production of erythrocytes).
    - ALA and Coproporphyrin Accumulation gained cell_types (erythroblast) and heme
      biosynthetic process (GO:0006783, ABNORMAL), with two supporting quotes from
      PMID:6999974 already in the cache. The erythroblast binding is evidenced
      rather than copied from the module: sideroblastic anemia and basophilic
      stippling are lesions of the nucleated erythroid precursors. Hepatocyte was
      deliberately not added, following PR #10123's reasoning that no lead-specific
      citation localizes precursor accumulation to the liver.

    Not addressed, and left as PR #10123 recorded them: the Hemolytic erythrocyte
    injury node still conforms to #Premature Erythrocyte Destruction rather than
    #Oxidative and Membrane Injury, and Oxidative stress response still has no
    downstream edge. Both were deferred for want of a lead-specific citation for
    oxidative or membrane injury to erythrocytes; the reviewer did not treat either
    as blocking.

    Validation: validate (122/135 snippets verified against cache, up from 120/133;
    both new snippets verify), validate-terms, check-entity-refs and
    check-duplicate-keys all pass. check-snippet-grading and check-title-snippets
    report findings only in unrelated files (Appendiceal_Neoplasm,
    Bullous_Pemphigoid, Follicular_Lymphoma, Epidermolysis_Bullosa_Simplex,
    Hennekam_Lymphangiectasia-Lymphedema_Syndrome_2, Meckel_Diverticulum, Pouchitis,
    Primary_Tonsillar_Lymphoma); these are artifacts of the branch base trailing
    origin/main, not of this change. pytest -k "conforms_to or entity_ref or causal
    or pathophysiolog": 8020 passed.

  summary: 'LOINC tranche I: bind blood lead and zinc protoporphyrin codes'
  details: |
    Bound LOINC:5671-3 (Lead, Blood) and LOINC:33007-6 (Protoporphyrin.zinc, Blood) as loinc_term on the two existing biochemical markers and as measurements on the two matching diagnosis rows. The CDC pediatric blood lead reference value (3.5 microg/dL, 2021, replacing a prior 5 microg/dL value) is already stated correctly and currently in the entry's prose; no reference_ranges band was added for it, because the cited source (PMID:37478813) itself states the elevated range using a strict inequality ('concentrations greater than 3.5 microg/dL'), and an inclusive-lower-bound interpretation_bands entry at 3.5 would assert that exactly 3.5 counts as elevated, which this citation does not support.

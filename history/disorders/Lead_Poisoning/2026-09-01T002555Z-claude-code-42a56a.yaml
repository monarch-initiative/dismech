  summary: 'Edit: Lead Poisoning - NMDA receptor blockade and BDNF-TrkB arm'
  details: |
    Added three pathophysiology nodes wiring lead's NMDA-receptor mechanism into the entry and into the new nmda_receptor_hypofunction module: 'NMDA receptor blockade in glutamatergic neurons' (conforms_to the module trigger), 'Reduced NMDA receptor-mediated calcium signaling' (conforms_to the module's key conformance target) and 'Reduced BDNF-TrkB signaling' (conforms_to the module effector), plus a new downstream edge from 'Systemic lead distribution'. This is a distinct neuronal action from the calcium-mimicry node already curated: lead blocks the principal activity-gated calcium channel of the excitatory synapse rather than substituting for calcium downstream of it. Evidence from Alkondon 1990 (selective NMDA channel block), Toscano 2005, Neal 2010 (APV mimics the deficit; BDNF rescues it), Stansfield 2012 (calcium-sensitive exon IV transcript) and Lanphear 2005 (human IQ). All snippets verified against cached abstracts.

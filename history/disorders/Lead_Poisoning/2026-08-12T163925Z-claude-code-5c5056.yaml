  summary: Wire three disconnected pathophysiology nodes into the causal graph
  details: |
    Fixes the orphan-node defect reported in issue 8390, found while grounding the AOP pilot in issue 8309.

    Before: "Mitochondrial dysfunction" and "Oxidative stress response" were fully isolated -- no incoming edge and no downstream. "Erythrocyte pyrimidine 5-prime-nucleotidase deficiency" had a downstream edge but no incoming edge. All three passed schema, term and reference validation, because no validator inspects graph shape; that is the gap issue 7855 proposes to close.

    Change: three new downstream edges added to "Systemic lead distribution", each carrying its own evidence.
    - to Erythrocyte pyrimidine 5-prime-nucleotidase deficiency, PMID:965496, HUMAN_CLINICAL
    - to Mitochondrial dysfunction, PMID:40981357, OTHER
    - to Oxidative stress response, PMID:40981357, OTHER

    Both PMIDs were already cited elsewhere in the entry and already cached. No new references were fetched and no snippet was newly authored. The two ion-mimicry edges carry causal_link_type INDIRECT_KNOWN_INTERMEDIATES with ion mimicry named in intermediate_mechanisms, because the cited sentence attributes both consequences to metal substitution rather than to systemic distribution directly.

    Deliberately not done: the cited abstract names mitochondrial dysfunction and oxidative stress as coordinate consequences of ion mimicry, not as a chain, so no "Mitochondrial dysfunction to Oxidative stress response" edge was added despite the issue text suggesting the snippet implied a progression. No downstream consequence was added for either node either: the candidate sources found for oxidative stress leading to anemia or neurotoxicity were animal antioxidant-intervention studies, too weak to license a causal edge under the evidence policy. Both nodes are therefore now reachable but terminal, which is why the outcome is recorded as needs_followup.

    Validation run in the worktree: just validate passed; just validate-terms passed; just count-verified-snippets reported 110/117 verified against cached references with 7 skipped by prefix; a graph re-check confirmed zero isolated nodes.

  details: |
    Second follow-up round on PR #10123, working the reviewer's five optional
    suggestions after the two blocking findings were fixed. Four taken, one taken
    in reduced form.

    Taken as suggested:

    - Dropped the porphobilinogen chemical entity (CHEBI:17381) from ALA and
      Coproporphyrin Accumulation. ModifierEnum has no UNCHANGED or NORMAL value,
      so an unqualified entity on a node named "Accumulation" renders as an
      accumulating species, which is the opposite of what the node's description
      and its PMID:6999974 snippet say. The ALA-up/PBG-not-up asymmetry is stated
      in the description and carried by the evidence, so nothing is lost. Note the
      same unqualified entity sits on the ADP node this one was modeled on
      (Porphyria_due_to_ALA_Dehydratase_Deficiency, "Hepatic and erythroid ALA
      accumulation without PBG overproduction"); that is out of scope here and left
      alone.
    - Added erythroblast (CL:0000765) alongside erythrocyte on Inhibition of
      delta-aminolevulinic acid dehydratase, so the node's compartments read
      cleanly against the module node it conforms to. Erythrocyte is kept, not
      replaced: ALAD is cytosolic and really is assayed in mature red cells. The
      description now says which cell each listing is for.
    - Added frequency bands to two phenotypes from PMID:1030853, already cited in
      the file: Abdominal pain FREQUENT (62% of 63 chronically exposed industrial
      workers) and Anemia OCCASIONAL (19%, and mild where present). Each carries
      its own evidence item with the cohort sentence, plus notes recording the
      exact percentage, following the convention in AFG2A-Related_Encephalopathy.
    - Added a discussions entry, kind KNOWLEDGE_GAP, attached to
      pathophysiology#ALA-Mediated Neurovisceral Neurotoxicity, recording that the
      three edges out of that node rest on an analogy sentence from an ALAD
      porphyria case report rather than on a lead-specific measurement, that lead's
      calcium-mimicry route is not distinguishable from it on the evidence cited,
      and what would settle it.

    Taken in reduced form:

    - The reviewer pointed at a stronger lead-specific ferrochelatase sentence in
      the PMID:17405745 full text. Its PDF breaks both "porphobilinogen" and
      "protoporphyrin" across lines, and the authoritative reference validator does
      not de-hyphenate, so no exact substring spans the ferrochelatase clause. The
      only clean substring naming ferrochelatase is four words and fails
      check-snippet-length. Added the longest clean propositional fragment instead
      ("the metal interferes with a variety of haeme biosynthetic enzymes"), which
      is lead-specific human case evidence, and kept the 1980 review quote that
      names ferrochelatase. The explanation on the evidence item records the
      constraint.

    Validation: validate, validate-terms, check-entity-refs, check-duplicate-keys,
    check-snippet-length, check-folded-hyphens, check-environmental-evidence and
    validate-disorders all pass. Snippets 126/140 verified against cache with no
    relaxed-normalization matches. pytest -k "discussion or entity_ref or
    conforms_to or frequency or phenotype": 8035 passed. check-snippet-length and
    check-title-snippets still report findings in unrelated files
    (Epidermolysis_Bullosa_Simplex, Hyperprolinemia_Type_2 and others); those are
    artifacts of this branch's base trailing origin/main, not of this change.

  summary: Rephrase instruction-like note; use the stronger reason for no band
  details: |
    Two fixes to the Blood Lead Level marker's notes. First, 'do not state 5 microg/dL as the current reference value' read as an instruction to the next curator rather than a fact; rephrased as 'the 5 microg/dL figure is the superseded pre-2021 value'. Second, replaced the band-declining reason: the prior note cited the cited source's own analysis-objective phrasing ('concentrations greater than 3.5 microg/dL', a strict inequality) as the reason no reference_ranges band is recorded. The stronger and more durable reason is that CDC's blood lead reference value (BLRV) is a population percentile -- a public-health intervention trigger -- not a diagnostic cut-off this disease owns, so it was never a candidate for a reference_ranges band regardless of how any one source phrases its own threshold. The decision not to add a band is unchanged; only the stated reason moved.

  details: |
    Dropped the unsupported FREQUENT band on Anemia: PMID:37478813 is an ICP-MS methods/trends paper whose background sentence supports only the disease-phenotype association, not a frequency. Re-banded Hypertension and Gout from OCCASIONAL to FREQUENT: the shared PMID:8475950 snippet says lead nephropathy 'frequently presents with hyperuricemia, gout and hypertension', and 'frequently' maps to FREQUENT (30-79%) under docs/frequency-evidence-guidelines.md Pattern C, so OCCASIONAL (5-29%) contradicted its own citation. Both explanations now name the Pattern C mapping and record that the denominator is established lead nephropathy rather than all lead poisoning, making the band an upper-bound estimate for the disease as a whole.

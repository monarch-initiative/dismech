  summary: Conform heme/red-cell pathophysiology to the porphyria and hemolytic-anemia
    modules (issue 9985)
  details: |
    Declared conforms_to on three existing nodes: ALAD block to heme_biosynthesis_porphyria#Heme Biosynthesis Enzymatic Block; P5N deficiency to hemolytic_anemia_erythrocyte_destruction#Reduced Erythrocyte Integrity; hemolytic erythrocyte injury to hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction (chosen over Oxidative and Membrane Injury because no lead-specific erythrocyte-oxidative-injury citation was found). Added four new pathophysiology nodes: ALA and Coproporphyrin Accumulation (conforms_to the porphyria module's central accumulation node, modeled on Porphyria_due_to_ALA_Dehydratase_Deficiency's node, giving mechanism to the previously-cited but unmodeled ALA/coproporphyrin biomarkers), ALA-Mediated Neurovisceral Neurotoxicity (conforms_to the module's neurovisceral effector, giving the previously-unreached Abdominal pain, Constipation, and Peripheral neuropathy phenotypes an incoming causal edge), Ferrochelatase Inhibition (a second, independent heme-enzyme block giving the existing Zinc Protoporphyrin biomarker a mechanism for the first time), and Shortened Erythrocyte Lifespan and Erythropoietic Strain (conforms_to the hemolytic module's effector node). Edited kb/modules/heme_biosynthesis_porphyria.yaml description and notes to state that acquired chemical enzyme inhibition (lead, succinylacetone) conforms to the same node set as the inherited porphyrias. All evidence came from references already cached before this change: PMID:6999974, PMID:17405745, PMID:10211628, PMID:1030853, DOI:10.3389/fgene.2022.867856; no new references were fetched. Did not extend the neurovisceral node to Encephalopathy since no source specifically attributes lead encephalopathy to precursor neurotoxicity rather than calcium mimicry, and did not give Oxidative stress response a new downstream edge since there is no lead-specific erythrocyte-oxidative-injury citation to hang it on. Validated with just validate-disorders, just check-entity-refs, just check-duplicate-keys, just check-folded-hyphens (fixed one new finding), just check-snippet-grading, and just check-title-snippets.

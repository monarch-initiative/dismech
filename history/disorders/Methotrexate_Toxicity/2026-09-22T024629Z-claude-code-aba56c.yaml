  summary: 'Create: Methotrexate Toxicity'
  details: |
    New entry for methotrexate toxicity (MONDO:0034212), curated de novo.

    Deep research: claude_code provider, 17 web searches, 57 citations
    (research/Methotrexate_Toxicity-deep-research-claude_code.md). The run was
    launched with --validate-references and --validate-terms but emitted
    neither section, so both were retro-fitted with
    just validate-research-reference and just validate-research-terms.
    References: 38/38 resolved, 0 unresolved, 0 off topic. Terms: the report
    offered HP:0001636 for "Myocarditis", which is Tetralogy of Fallot.
    just preflight-dr returned SKIP because MONDO records no causal gene for a
    drug toxicity, so identity was checked manually against the MONDO record
    (parent MONDO:0800390 chemotherapy-induced toxicity) and the report's gene
    profile (MTHFR, DHFR, SLCO1B1, ABCB1, ATIC).

    Structure. Two arms off one exposure node. The folate arm runs SLC19A1
    uptake -> polyglutamation -> DHFR inhibition -> tetrahydrofolate depletion,
    branching to thymidylate blockade (thence uracil misincorporation) and to
    de novo purine blockade, converging on replicating cell death and then on
    marrow, gut, skin and liver. The pharmacokinetic arm runs tubular
    crystallisation -> three independently sufficient injury limbs (obstruction,
    direct epithelial toxicity, afferent arteriolar vasoconstriction) ->
    impaired renal elimination, which closes a deliberate cited cycle back onto
    crystallisation and amplifies the tissue nodes. 22 pathophysiology nodes,
    16 phenotypes (15/16 causally connected), 6 treatments, 3 diagnostics, 2
    susceptibility genes, 5 environmental exposures, 1 animal model, 1
    mechanistic hypothesis, 3 knowledge gaps.

    Evidence. 91/91 snippets verified; each was additionally checked
    character-exact against references_cache before being written, which is
    stricter than the validator. Every reference_title was read off the cache
    frontmatter. Backbone is PMID:27496039 (full text cached); also
    PMID:36071163, PMID:2416193, PMID:12374095, PMID:25172240, PMID:32961024,
    PMID:32066940, PMID:36946211, PMID:36996098, PMID:36582751, PMID:36564450,
    PMID:33069634 and PMID:23728635.

    Three disagreements are recorded rather than resolved, each as a
    KNOWLEDGE_GAP discussion: pneumonitis (dose-response inverted relative to
    every other toxicity here, so the phenotype is deliberately left unattached
    to any node); the NSAID interaction (a SUPPORT from a mouse transporter
    study and a REFUTE from PMID:36946211 on the same link); and the MTHFR
    effect size (nephrotoxicity OR 13.08, CI 1.65-103.86). A fourth and fifth
    REFUTE record the folate/stomatitis null result and the absence of any
    rationale for therapeutic drug monitoring in low-dose toxicity.

    Errors found and fixed during curation. The DR report's HP:0002317 for
    leukoencephalopathy (correct: HP:0002352) and HP:0001394 for hepatic
    fibrosis (correct: HP:0001395) were wrong; caught by looking every CURIE up.
    A draft notes: field claimed ECTO had no term for the interacting-drug
    exposure; re-running the searches per dismech-terms step 3a returned
    ECTO:2000011 exposure to NSAIDs, so the entry was rescoped and bound rather
    than shipping a false negative-existence claim. A draft waiver misreported
    what l~fluid and l~acid return and was rewritten to match the actual output.
    Four frequency bands were corrected or removed against the figures cited
    beside them (Pancytopenia VERY_FREQUENT -> FREQUENT on 78.5%; bands dropped
    on Oral ulcer, Acute kidney injury and Interstitial pneumonitis).
    PMID:33799927 turned out to be about serum amyloid A in sarcoidosis and was
    discarded. HP:0000951's label was written from memory as "Abnormal skin
    morphology"; it is "Abnormality of the skin".

    A pre-PR adversarial review by a fresh-context subagent found 18 further
    defects, all fixed in this same pass. Three were blocking. First, a notes:
    paragraph claimed third-space fluid sequestration had been omitted for want
    of a citable source - false, and refuted by a reference the entry already
    cited 50 times; third spacing is now an environmental exposure and effusion
    drainage a treatment, and the note records the correction rather than being
    deleted. Second, sepsis was named twice in prose as the mortality mechanism
    with no node, no phenotype and no edge; it is now a phenotype with
    converging edges from marrow failure and mucosal breakdown, evidenced by
    PMID:25172240's own mortality data. Third, this details field was a
    placeholder: a regex substitution failed silently and validate-history
    passed it because the schema only requires a string.

    Of the non-blocking findings: GO:0008517 (folic acid transporter) was the
    wrong sibling for SLC19A1 and was rebound to GO:0008518, whose definition
    names both the carrier and methotrexate; CL:1000838 manufactured a proximal
    convoluted segment the source does not name and was widened to CL:1000507;
    the three-limb nephropathy node was split into three, as its own description
    conceded it should be; a direct exposure-to-white-matter edge was added so
    the neurologic arm no longer hangs solely on the adenosine hypothesis; the
    cycle edge gained the concentration-dependence quote that actually closes
    the loop; dermatologic toxicity was added; an uncited apoptosis binding was
    dropped; two BACKGROUND quote_roles were added; and several prose claims
    were corrected where they asserted more than the source (crypt turnover
    interval, encephalopathy resolution timeframe, single-centre attribution,
    NAFLD risk reattribution, the definition of thymineless death, and
    progression day ranges that appear in no cited reference).

    Validation. just validate (91/91 snippets), validate-terms,
    check-entity-refs, check-causal-targets, check-duplicate-keys,
    check-qualifier-terms, check-enum-values, check-coarse-phenotypes,
    check-reference-titles, check-snippet-grading, check-environmental-evidence,
    prose-figure-audit and list-disconnected-phenotypes all run and read. No
    GeneReviews chapter exists (check-genereviews --online: NO_CHAPTER).

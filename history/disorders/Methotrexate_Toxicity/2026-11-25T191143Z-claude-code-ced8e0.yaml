  summary: 'Gene-family review: DHFR and MTHFR'
  details: |
    DHFR is correctly modelled as the drug's target with no genetic record: the inhibition node binds dihydrofolate reductase activity as decreased because methotrexate occupies the folate site. The node Tetrahydrofolate Depletion carried MTHFR with no molecular function; it now binds methylenetetrahydrofolate reductase (NADPH) activity (GO:0106313) as decreased, with evidence that the common c.677C>T variant lowers MTHFR activity and makes it thermolabile (PMID:7647779), which is the basis of the MTHFR susceptibility record (PMID:33069634). The MTHFR record now records germline origin.

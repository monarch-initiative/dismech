  summary: Bind LOINC measurement to the serial plasma methotrexate diagnosis row
  details: |
    Added a LOINC-coded measurement (LOINC:3793-7, Methotrexate [Mass/volume] in Serum or Plasma, verified against the Monarch KG, confirmed absent from origin/main and from every other open campaign branch before seeding) to the existing Serial plasma methotrexate concentration diagnosis row. No reference range is bound: the decision threshold this row's own description names is a time-indexed nomogram, not a single concentration, and that nomogram is an intervention trigger for leucovorin/glucarpidase escalation rather than a diagnostic severity grade -- a fixed band would misstate both the shape of the threshold and the kind of claim it makes.

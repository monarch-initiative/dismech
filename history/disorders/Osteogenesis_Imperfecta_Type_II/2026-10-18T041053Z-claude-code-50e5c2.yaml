  summary: 'Address review on PR 14700: split ER-stress node, source differentials'
  details: |
    Split the ER-stress node: a new Impaired Procollagen Secretion and Degradation node (GO:0009306 protein secretion, DECREASED) carries the PMID:7643358 secretion/degradation snippet, tagged quote_role REVIEW_SYNTHESIS. The ER Stress and Osteoblast Dysfunction node now cites the Aga2 Col1a1 mouse study (DOI:10.1172/jci.insight.171984) as MODEL_ORGANISM evidence, marked INDIRECT because Aga2 is a C-propeptide frameshift rather than a glycine substitution. All new downstream edges carry a description and evidence. The thanatophoric dysplasia, achondrogenesis type II, hypophosphatasia and campomelic dysplasia differentials were rewritten to what cached sources state, and each now has quoted evidence. Unsourced features (telephone-receiver femora, metaphyseal spurs, 11 rib pairs, hypoplastic scapulae) were removed. Hypophosphatasia differential rebound to MONDO:0016605 perinatal lethal hypophosphatasia (checked in OLS). GO:0030020 given modifier DECREASED. The mosaicism supporting_text was extended, GeneReviews handling-avoidance evidence was added to Supportive Care, and the prevalence record was marked measure_type UNKNOWN with a note that it is a case mix. Validated with just validate, validate-terms and count-verified-snippets (56/56).

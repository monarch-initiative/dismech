  summary: 'Comprehensive curation review of Osteogenesis Imperfecta Type II (MONDO:0008147) for #3430:
    split and wired COL1A1 and COL1A2 with GO molecular function, added evidence to ER Stress and Supportive
    Care, removed deprecated percentage field, and added progression and differential diagnoses.'
  details: 'Reviewed Osteogenesis_Imperfecta_Type_II.yaml against PMID:20301472

    (GeneReviews), PMID:7643358, and PMID:30725642 (StatPearls). Split

    COL1A1/COL1A2 Structural Mutations into individual HGNC-grounded COL1A1

    (hgnc:2197) and COL1A2 (hgnc:2198) entries wired to Dominant-Negative

    Collagen Disruption with GO:0030020 (extracellular matrix structural

    constituent conferring tensile strength). Added evidence and causal edges

    to ER Stress and Osteoblast Dysfunction, added evidence to Supportive Care,

    removed deprecated percentage slot in prevalence, added Harrison''s chapter

    and collagenopathy classifications, and added progression, differential

    diagnoses, and reference findings.


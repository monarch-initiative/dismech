  summary: 'Review round 1: LCK_Deficiency phenotypes, autoimmunity edge, HSCT outcomes'
  details: |
    Addressed review on PR 16382. Added recurrent mucocutaneous candidiasis (HP:0002728), reported in the p.C465R, truncating and p.P440S families (PMID:38100037, 38112969, 37962568), wired from Defective T Cell Effector Function. Moved the Autoimmunity edge off the Treg node, which is scoped to the hypomorphic allele while the only autoimmune patient carries a complete-loss allele, onto Arrested Thymic T Cell Development, citing the mouse study's proposal of altered negative selection in both knockout and P440S mice as INDIRECT evidence and saying in the edge that the link is inferred. Corrected the HSCT description: one P440S sibling died on day +102 (added as REFUTE evidence), so two of four transplanted patients died. Suggestions taken: Defective T Cell Effector Function rescaled to CELLULAR; the Treg node now says the defect is Treg number and function, with knockout and P440S both reduced; added panniculitis, vasculitis and high IgM phenotypes; bound the immunophenotyping diagnosis to NCIT:C113003. HP:0002728 and HP:0003496 carry the labels in the committed HP cache (Chronic mucocutaneous candidiasis, Increased circulating IgM level), which differ from current OLS. Revalidated: just validate passed, 56/56 snippets, 13/13 phenotypes connected.

  summary: 'Create: LCK_Deficiency'
  details: |
    New entry for LCK deficiency (MONDO:0014334, IMD22), claimed in issue 12614. Curated as a standalone Disease rather than a SCID subtype: every published patient has T cells present (reduced, oligoclonal) with normal B and NK cells, which IUIS records as a combined immunodeficiency, and ZAP70_Deficiency sets the precedent for TCR-proximal kinase defects. Deep research: one Perplexity report (research/LCK_Deficiency-deep-research-perplexity.md), 11/11 references resolved, no unresolved terms; its suggested HP:0002723 and HP:0032180 were checked in OLS and name unrelated terms, so they were not used, and its two obsolete HP suggestions were replaced. Evidence comes from the five primary patient reports (PMID:22985903, 27087313, 38100037, 38112969, 37962568), the IUIS 2022 table row (PMID:35748970), the ClinGen Definitive record, and the PIDTC SCID transplant cohort (PMID:37352885, cited as SCID-wide). Pathograph: LCK kinase loss, then failure of proximal TCR signalling, branching to thymic arrest, defective effector function and, for the hypomorphic P440S allele, failed Treg development with CD4-driven intestinal inflammation. The stub was deleted. Validated with just validate and the whole-repo gates.

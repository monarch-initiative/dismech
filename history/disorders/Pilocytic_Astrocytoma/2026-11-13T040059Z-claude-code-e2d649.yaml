  summary: Review and enrich Pilocytic Astrocytoma
  details: |
    Added PA-specific synonyms (omitting broader grade I astrocytoma/astrocytic tumor umbrellas), US annual incidence prevalence block from ORPHA:251612 (BAND_1_9_PER_1000000, POPULATION_PER_YEAR), Harrison's chapter and ICD-O Glioma classifications, StatPearls (PMID:32809449) and Orphanet (ORPHA:251612) citations, specific GO molecular_functions grounding all four genes (GO:0004709 on BRAF/KIAA1549/RAF1, GO:0005096 on NF1), NF1 Tumor Suppressor Inactivation plus atomic Circumscribed Low-Grade Glioma Growth and Local Mass Effect and Anatomic Compression nodes connecting all 6 phenotypes (adding Increased intracranial pressure, Cerebellar-scoped Ataxia, and Nystagmus, with Hydrocephalus -> Increased intracranial pressure sequela), narrowed Neuroimaging description to match cited evidence, NCIT-bound diagnostic modalities, and 5-year EFS outcome evidence (PMID:22665535) on Carboplatin/Vincristine target_mechanisms.

  summary: 'Create: Miliary_Tuberculosis'
  details: |
    New entry for miliary tuberculosis (MONDO:0005848), seeded from research/Miliary_Tuberculosis-deep-research-claude_code.md (claude_code provider; preflight-dr SKIP because MONDO records no causal gene) and PubMed searches. Every snippet was read in the cached reference. Pathophysiology: a primary or reactivated focus and impaired Th1 containment lead to massive lymphohematogenous dissemination and multiorgan miliary granulomas (conforms to granuloma_formation#Organized Granuloma Assembly), which branch to pulmonary, hepatosplenic, marrow, CNS, choroidal, adrenal and renal involvement and a systemic inflammatory response; a nonreactive poorly-formed-granuloma node covers advanced HIV, and an ARDS node conforms to alveolar_capillary_barrier_failure. Phenotype frequencies come mainly from a 263-patient Turkish series (PMID:28151863), a 392-patient Chinese series (PMID:35488218), a UK cohort (PMID:28427368) and review tables (PMID:42577908). Tuberculous meningitis is cross-referenced to Meningeal_Tuberculosis rather than re-curated. M. tuberculosis and M. bovis BCG are lumped (review_notes). Urine LAM and urine Xpert evidence is from HIV inpatients with disseminated tuberculosis and is marked INDIRECT. Stub stubs/Miliary_Tuberculosis.yaml deleted.

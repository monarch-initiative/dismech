  summary: 'Review round 1: host susceptibility genes, model, node split'
  details: |
    Answered review 6077792431. Added a genetic section with SUSCEPTIBILITY rows for IL12RB1, IFNGR1 and TYK2 (P1104A), from freshly fetched and verified PMID:30268380, PMID:40656276, PMID:30578352 and PMID:31068474, all marked INDIRECT because none is specific to miliary tuberculosis; HGNC CURIEs taken from cache/hgnc/terms.csv. Added an 'Inborn Errors of IL-12/IL-23-IFN-gamma Immunity' node carrying the three genes and their GO molecular functions, wired to 'Impaired Cell-Mediated Immune Containment'. Added an IFN-gamma knockout mouse animal model (PMID:8245795) linked to that node. Split 'Immune-Mediated Marrow Suppression' out of the bone-marrow node so the cytopenia edges are atomic. Bound adalimumab and a target_mechanisms edge on the TNF-antagonist salvage treatment, and narrowed its description to say thalidomide is not bound. Gave latent-TB screening a target_mechanisms edge to the reactivating focus; no agent bound because neither cited source names the regimen. Corrected the progression wording from 'a median of about seven weeks' to the source's 'approximately 50 days (range 21-150)', and added smoking and laboratory outcome predictors (PMID:38848041). Declined HP:0001955 for fever of unknown origin because its definition requires no infectious cause, and declined the paediatric seizure/diarrhoea phenotypes because their only source (a BMC Pediatr DOI in the report) was not verified.

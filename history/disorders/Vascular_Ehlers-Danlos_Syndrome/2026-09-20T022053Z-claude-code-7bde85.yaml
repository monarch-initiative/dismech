  summary: 'Genetics pass: wire COL3A1 into the pathograph, add variant classes'
  details: |
    Genetics pass for the d2g wiring campaign (issue #12207, epic #12189).

    Research first: GeneReviews chapter PMID:20301667 is already tagged on this
    entry and was the baseline; ClinGen classifies COL3A1 against
    Ehlers-Danlos syndrome, vascular type (MONDO:0017314, the anchor of this entry)
    as Definitive, autosomal dominant. COL3A1 was already the sole curated gene and
    the pathophysiology was already correct.

    The real gap was wiring, not content: the entry had a genetic record for COL3A1
    and a pathophysiology node, Type III collagen matrix fragility, whose
    description and three evidence items are entirely about COL3A1, but the node
    carried no genes descriptor, so the gene reached no mechanism node. Gene
    mechanism wiring for this entry was 0/1 and is now 1/1. No new literature was
    needed for that.

    Changes:
    - Bound COL3A1 (hgnc:2201) on the Type III collagen matrix fragility node.
    - Added relationship_type: CAUSATIVE and variant_origin: GERMLINE to the COL3A1
      genetic record, which previously carried only a free-text association string.
    - Added two variants records for the COL3A1 variant classes that the entry's
      own description already discussed but did not model: the dominant-negative
      class (glycine substitutions plus splice-site and in-frame indels) and the
      milder class (haploinsufficiency plus terminal non-glycine missense), both
      from the 215-patient molecularly proven cohort in PMID:25758994, which was
      already cited in the entry.

    MONDO reconciliation: MONDO:0007524 COL3A1 is present. The entry anchors on
    MONDO:0017314 and already carries MONDO:0007524 as a skos:narrowMatch with a
    recorded justification, so the autosomal dominant child is covered.

    Validation: just validate, just validate-terms, just count-verified-snippets
    (39/39), just list-gene-term-mismatches, and the offline gates all pass.

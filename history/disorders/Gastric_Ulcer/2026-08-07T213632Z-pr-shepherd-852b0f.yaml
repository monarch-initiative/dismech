  summary: Add gastric core-microbiota dysbiosis mechanism with CST1A depletion
  details: |
    Added the gastric core-microbiota arm from PMID:42413498 - Huang et al., Cell Rep Med 2026;7:102905 - to Gastric_Ulcer.

    PR-shepherd follow-up addressing the ai4c-reviewer CHANGES_REQUESTED review on PR #6993:
    - CRITICAL: fetched and committed references_cache/PMID_42413498.md via 'just fetch-reference PMID:42413498'; never hand-written. All 8 evidence snippets in the file verify as exact substrings of their own cached reference under whitespace normalization.
    - Corrected an inverted modifier. The node describes CST1A depletion, so losing the anti-inflammatory taxon raises inflammation; GO:0006954 inflammatory response is now INCREASED rather than DECREASED.
    - Corrected evidence_source on the Achromobacter spanius claim. The snippet had been truncated before its classifying clause and tagged HUMAN_CLINICAL. The snippet now includes the qualifying prefix 'In vitro and in vivo experiments demonstrate that' and is split into a MODEL_ORGANISM item and an IN_VITRO item, per the CLAUDE.md rule that mixed-source papers get one evidence_source per item.
    - Removed the invented acronym expansion 'core species type 1A'. The abstract calls CST1A and CST1B antagonistic communities and never expands the acronym, so the description now says community state type without asserting an expansion the source does not support.
    - Split the bundled node into two atomic nodes and wired the previously orphaned content into the pathograph: Gastric Microbiota Dysbiosis with CST1A Depletion feeds Loss of CST1A-Mediated Mucosal Protection, which in turn feeds the pre-existing mucosal-injury node. The edge into mucosal injury is INDIRECT_UNKNOWN_INTERMEDIATES and carries its own MODEL_ORGANISM evidence, since the protective direction is shown in animal and cell-culture models rather than in humans.
    - Disclosed the cohort provenance the review flagged: the core structure was defined in 255 pediatric samples, and n=1,299 is the eight-dataset cross-cohort validation, not the primary cohort. Added a supporting evidence item for each.
    - Added the previously uncited motility-related functional claim as its own evidence item.
    - Set biological_scale: TISSUE on both nodes.

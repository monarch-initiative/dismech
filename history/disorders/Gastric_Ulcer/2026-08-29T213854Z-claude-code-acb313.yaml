    # Evidence review — Gastric_Ulcer.yaml

    ## Stats
    - Evidence items checked: 5 (`reference:` blocks)
    - Distinct references read from `references_cache/`: 2 (`PMID_42413498.md`, `PMID_28242110.md`) — both present. Two further identifiers appear in the top-level `references:` block (`PMID:19575764`, `PMID:38467155`) with empty `findings:` — these are bibliography entries, not evidence items, and were not snippet-checked.
    - Snippets mechanically verified against cache: 5/5
    - Verified clean: 4
    - Items with a finding below: 1 reported only; 1 additional structural note

    ## Findings

    1. **pathophysiology → "H. pylori and NSAID-associated mucosal injury", line 92** — `PMID:28242110` (Lanas & Chan, *Peptic ulcer disease*, Lancet 2017).
       Problem: the node claims that gastric ulceration commonly relates to H. pylori infection or NSAID exposure. The quoted sentence is about the **converse** population — "Peptic ulcers **not** associated with H pylori infection or the use of non-steroidal anti-inflammatory drugs are now also imposing substantial diagnostic and therapeutic challenges." It supports the claim only by presupposition (the existence of a named residual category implies the two main ones), and it is a statement about diagnostic/therapeutic difficulty, not about mucosal injury pathways. The `explanation` ("notes H. pylori infection and NSAID use as key etiologic contexts") is a fair reading of the paper but is not what the sentence states.
       Severity: MINOR. The PARTIAL grade is the honest one and materially limits the overreach, which is why this is not scored as a defect.
       ACTION: **reported only** — I read the full cached abstract. Its other candidate sentences ("The rapidly declining prevalence of Helicobacter pylori infection and widespread use of potent anti-secretory drugs means peptic ulcer disease has become substantially less prevalent…", and the Seminar's aims sentence) are about epidemiological trend and scope, not about H. pylori/NSAID-driven mucosal injury either. No exact quote in this reference is a strictly better fit, so substituting one would not improve the entry.
       Note also that this item has **no `evidence_source`**, so it defaults to HUMAN_CLINICAL. The cited work is a Lancet Seminar (narrative review) — `OTHER` would arguably be more accurate, but the sentence is a clinical-epidemiological statement, the field is absent rather than wrong, and changing it would be a judgement call, so I left it.

    2. **pathophysiology → "Loss of Achromobacter spanius Mucosal Protection", lines 70–85** — `PMID:42413498`, cited twice with the **same** quoted sentence ("In vitro and in vivo experiments demonstrate that CST1A-derived Achromobacter spanius alleviates gastric mucosal injury by modulating inflammatory responses"), once as `IN_VITRO` and once as `MODEL_ORGANISM`.
       Assessment: this is **correct, not a defect.** The sentence explicitly reports two experiment types, and CLAUDE.md directs that "if a paper mixes sources, split evidence items so each item gets a single `evidence_source`". The two `explanation` fields correctly attribute one item to the in-vitro arm and one to the in-vivo arm.
       Severity: NOTE.
       ACTION: **no action.** It does create a same-sentence/two-source divergence of the kind `check-snippet-grading` keys on; I ran `just check-snippet-grading` and it passes (the pair is grandfathered against `origin/main`). Recording it here so a future reviewer does not "fix" it by collapsing the split.

    ### Also noted (no action, not defects)
    - The three microbiota nodes (CST1A depletion → CST1B dominance → loss of *A. spanius* protection) are all supported by exact result sentences from the same 2026 Cell Reports Medicine paper, with grades and sources that match what each sentence reports: the 16S cohort findings are HUMAN_CLINICAL, the experimental sentence is split IN_VITRO/MODEL_ORGANISM. The `reference_title` on all five items matches the cache frontmatter verbatim. This is careful curation.
    - **Single-source dependency.** Four of the five evidence items come from one paper (`PMID:42413498`), and the entire causal chain the entry models rests on it. That is a fragility rather than an error, but it means the entry's mechanism is one 2026 pediatric cohort's framework, not a consensus account of gastric ulcer pathophysiology.
    - **Coverage gap.** The entry's own `description` names the mucus-bicarbonate barrier and prostaglandin-mediated cytoprotection as the core mechanisms, and NSAIDs as a dominant cause, but no pathophysiology node models either — the CST1A/CST1B microbiota axis is modelled instead, and NSAID injury appears only in the single PARTIAL node in finding 1. The two bibliography entries that would cover this (`PMID:19575764`, NSAID-induced peptic ulcer mechanisms; `PMID:38467155`, molecular pathways review) sit in `references:` with `findings: []` and are not used. Not an evidence defect; flagged as the most useful next curation step.
    - The single `phenotypes:` entry (Gastric ulcer, `HP:0002592`) carries no evidence. Schema-legal and self-evident for the disease's defining lesion.

    ## Sections reviewed
    pathophysiology, phenotypes, references, datasets, disease_term

    ## Verdict
    This is a small, clean entry: all five snippets are exact, on-topic, correctly attributed to their source study type, and honestly graded — including a well-executed IN_VITRO/MODEL_ORGANISM split of one mixed-methods sentence. The only substantive weakness is that the entry's headline mechanism (H. pylori/NSAID disruption of mucosal defense, per its own description) is represented by a single PARTIAL node whose quote actually describes ulcers *not* attributable to those causes, while the fully evidenced pathophysiology is a microbiota axis drawn entirely from one 2026 paper.

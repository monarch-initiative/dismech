  details: |
    Review response for PR #6993 (ai4c-reviewer, 2026-08-27), taking the reviewer's suggested salvage path rather than closing as a duplicate.

    The blocker was that this branch's two new pathophysiology nodes ("Gastric Microbiota Dysbiosis with CST1A Depletion" and "Loss of CST1A-Mediated Mucosal Protection") restate a three-node chain that reached main via PR #6920, from the same paper (PMID:42413498). Merging would have produced six nodes where three duplicate the other three, with the Achromobacter spanius sentence quoted five times in one file. Nothing in the validation stack catches duplicate node meanings, only duplicate node names.

    Action taken: merged origin/main into the branch, deleted both duplicate nodes, and applied the five increments the reviewer identified as genuinely additive to main's existing three nodes.

    1. GO:0006954 inflammatory response with modifier INCREASED added to "Loss of Achromobacter spanius Mucosal Protection", which previously had no biological_processes at all.

    2. Evidence added for the motility-related functional claim on "H. pylori-Driven CST1A Depletion". That node's description asserted CST1A is "linked to protective motility-related processes" with no evidence item behind it; it now cites the functional-profiling sentence from PMID:42413498.

    3. causal_link_type added to all three previously bare downstream edges: DIRECT for CST1A depletion to CST1B dominance (antagonistic community state types, so depletion directly releases CST1B from competition), DIRECT for CST1B dominance to loss of Achromobacter spanius (the taxon is CST1A-derived, so the same shift removes it), and INDIRECT_UNKNOWN_INTERMEDIATES for the edge into mucosal injury (the protective direction is established only in animal and cell-culture models, and the intermediates to human ulceration are unresolved).

    4. biological_scale TISSUE added to all three nodes.

    5. The pediatric-discovery-cohort caveat added to "CST1B Pathogenic Community Dominance": the core structure was defined in 255 pediatric samples, and its persistence across disease stages rests on cross-cohort validation over eight further datasets (n = 1,299), not on the primary cohort. The node's description previously asserted preservation across age cohorts without that provenance.

    Not carried over: the branch's duplicate edge-level evidence, which re-quoted the node evidence verbatim. The reviewer noted this was moot once the nodes were dropped, and the causal claim it carried is now expressed by causal_link_type plus the edge description on main's own edges.

    Correction to the earlier history record in this directory (2026-08-07T213632Z-pr-shepherd-852b0f.yaml): its details say references_cache/PMID_42413498.md was fetched and committed by this work. The file is in the tree but arrived via PR #6920. History is append-only, so that record is left as written; this note is the correction.

    Validation: just validate passed with 7/7 snippets verified against references_cache (down from 13, since the removed duplicates carried seven re-quotes of already-quoted sentences). Term validation passed. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, and check-enum-values all clean; check-snippet-grading reports no findings for this file.

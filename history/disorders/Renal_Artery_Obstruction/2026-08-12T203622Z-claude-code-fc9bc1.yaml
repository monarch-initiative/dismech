  summary: Link the atherosclerotic context and the viral thrombotic state
  details: |
    Backfill for issue #8085. The atherosclerotic risk context points at atherosclerotic renal artery stenosis at PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES, and the exposure is really a description of the population in which that arm appears rather than an agent acting on it; the cited sentence reports where prevalence rises rather than what raises it, hence PARTIAL. That item is PARTIAL here while the same sentence is SUPPORT on the node itself, which is deliberate and recorded in the explanation: the node claims that atherosclerotic stenosis is the common mechanism, which the sentence states outright, whereas the link claims the risk context predisposes to it, which prevalence enrichment supports only partly. The SARS-CoV-2 exposure points at the thromboembolic infarction node, which is named for the mechanism the exposure acts through, so the intervening step is known rather than unknown; it is PARTIAL because the sentence is doubly forward-looking, calling the virus an emerging cause and the rise in incidence anticipated rather than observed. Note that both exposures in this entry cite DOI-prefixed references, which the reference validator skips, so both snippets were verified by hand against the cache; this is the blind spot that hid a transliterated snippet in PR #8371. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 16 of 44 with 28 DOI-prefix skips.

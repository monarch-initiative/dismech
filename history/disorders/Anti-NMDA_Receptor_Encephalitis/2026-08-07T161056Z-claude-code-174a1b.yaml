  details: |
    Backfill for issue #8085. All four entries target the entry's own triggered anti-GluN1 autoimmunity node, which is the correct substrate since this disease is defined by a trigger breaking tolerance to a neuronal antigen. Ovarian teratoma and herpes simplex encephalitis are both TRIGGERS with INDIRECT_KNOWN_INTERMEDIATES, and they reach the node by opposite routes: a teratoma presents NMDA receptor ectopically outside immune privilege, while viral encephalitis releases the same antigen by destroying neurons within it. Group A Streptococcus infection and geographic and climatic factors are PREDISPOSES with INDIRECT_UNKNOWN_INTERMEDIATES, the first because its cited source goes only as far as suggesting a possible infectious contribution, the second because a latitude and temperature gradient points to an unidentified environmental agent without naming one. Validated with linkml-validate and just validate-terms; just count-verified-snippets reports 76 of 76 verified; integrity issue count unchanged.

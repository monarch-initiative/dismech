  details: |
    PR Shepherd, answering the 2026-09-20 review on #12313.

    Item 1 - the Catatonia notes claimed a convention that does not exist. The notes said the constituent signs are curated as sequelae following the same convention as the Catatonia entry. Re-checked: kb/disorders/Catatonia.yaml contains no sequelae at all and leaves Mutism and Abnormal posturing disconnected. What the two entries genuinely share is leaving the catatonia phenotype unbound because HPO has no class for it. The notes now say exactly that, and state that the sequelae attachment is this entry's own compromise rather than an established pattern. A false checkable claim about repository state is worse than an unexplained choice because it tells the next reader not to look.

    Item 2 - the catatonia edge description contradicted the cited abstract. The description argued resolution occurred without antipsychotic treatment of an assumed underlying psychosis. PMID:31115962 does not say that, and the same abstract reports that catatonia was associated with previous use of antipsychotics. The clause is dropped. The treatment-reversal argument stands on its own and the description now rests on the complete recovery from catatonic signs after immunotherapy, which is what the snippet says.

    Suggestion 1 taken - quote_role REVIEW_SYNTHESIS on the PMID:31326280 Coma evidence. The Lancet Neurology update is a review and the quoted sentence is its synthesis of how the syndrome came to be recognised, not a measurement it made. evidence_source stays HUMAN_CLINICAL.

    Suggestion 2 taken, with a modification. The memory and language edges quoted a domain ranking carrying p = 0.25 and p = 0.23. Rather than swap in the 34 percent persistent impairment / 65 percent below-average sentence and lose the domain specificity each edge needs, that robust sentence is added as a second evidence item on both edges and the existing explanations now say the domain-level comparison did not reach significance and is read as a descriptive ranking. Each explanation points at the other item so the pairing is legible.

    Suggestion 3 taken - the notes now record that the two sequelae edges carry a part-of relation rather than a causal one, that no part-of edge type exists in the schema, and that sequelae is the closest available slot.

    Suggestion 4 not taken this round. Lejuste 2016 on neuroleptic intolerance and malignant-catatonia overlap would need a reference fetch and new curated content, and item 2 is resolved by dropping the clause as the review asked. Recording the decision rather than leaving it open.

    Suggestion 5 not taken - the pre-existing Neuropsychiatric and Seizure Syndrome bundled node is out of scope for a review round on this PR and the review framed it as longer term.

    Validation: just validate clean (schema, terms, references), 94/94 snippets verified, plus check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-qualifier-terms and check-snippet-grading all clean.

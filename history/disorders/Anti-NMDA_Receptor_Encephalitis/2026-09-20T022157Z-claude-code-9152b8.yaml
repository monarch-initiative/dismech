  summary: Wire the pathograph to the clinical layer and add the missing catatonia
    arm
  details: |
    Follow-up named in the #6531 assessment when the standalone Catatonia entry (MONDO:0800105) landed in PR #8455: wiring the disorder entries that catatonia arises in. Anti-NMDA_Receptor_Encephalitis carried no catatonia record at all, despite catatonia being one of the multivariate-selected hallmarks of the disease, and none of its 10 phenotypes had a causal in-edge (0/10 per just list-disconnected-phenotypes). Added a Catatonia phenotype (VERY_FREQUENT; two independent prospective cohorts at 70.6% and 69%, systematic review at 60%), deliberately unbound because HPO still has no catatonia class -- re-verified 2026-09-20 against OLS hp -- with the constituent signs HPO does carry (Mutism HP:0002300, Abnormal posturing HP:0002533) added as sequelae, following the convention used in kb/disorders/Catatonia.yaml. Wired nine causal edges from the Neuropsychiatric and Seizure Syndrome node to the clinical phenotypes, and attached the two test-result phenotypes (EEG Abnormality, CSF Pleocytosis) with reports_on readout links rather than inventing causal edges for them. Causal phenotype connectivity moves 0/10 to 11/13. Fetched PMID:31115962 and PMID:35534479 with just fetch-reference. Validated with just validate-disorders (92/92 snippets verified), just validate-terms, check-entity-refs, check-causal-targets, check-duplicate-keys, check-qualifier-terms, check-enum-values, check-snippet-grading, check-snippet-length, check-title-snippets, check-folded-hyphens, check-case-collisions.

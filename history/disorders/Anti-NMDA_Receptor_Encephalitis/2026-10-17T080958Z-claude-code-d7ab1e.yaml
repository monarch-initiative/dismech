  summary: 'Bind LOINC: CSF/serum NMDAR IgG and CSF leukocyte count'
  details: |
    Added loinc_term LOINC:82988-7 (NMDAR IgG Ab presence in CSF by immunofluorescence) to the 'CSF Anti-NMDAR IgG' marker, LOINC:82981-2 (same assay, serum or plasma) to the 'Serum Anti-NMDAR IgG' marker, and LOINC:26465-5 (CSF leukocyte count) to the 'CSF White Blood Cell Count' marker, which already cited a disease-specific numeric threshold (>20 cells/uL as an independent outcome predictor). LOINC has no Part-level (method-free) code for NMDAR antibody testing -- an NLM Clinical Tables search for 'NMDA receptor antibody' returned 13 results, all qualified by method (cell-based assay or plain immunofluorescence) and specimen, none generic -- so the immunofluorescence-method codes were bound as the only available identity, consistent with this campaign's practice of binding a method-specific code when no Part exists. Checked the entry's definitions: block (the Graus-criteria case definition) separately: it lists only clinical/phenotypic criteria and a generic 'CSF abnormalities' investigation category, naming no specific analyte to bind. All three LOINC codes were newly seeded via just loinc-seed-cache. just validate-disorders passed with 0 issues.

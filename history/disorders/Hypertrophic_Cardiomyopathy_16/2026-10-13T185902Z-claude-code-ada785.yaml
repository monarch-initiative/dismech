  summary: 'Review: Hypertrophic Cardiomyopathy 16 (MYOZ2)'
  details: |
    Adversarial review of the new CMH16 entry. Corrections: the Walsh 2017 burden snippet (PMID:27532257) was not an exact quote (the cache reads 'TNNC1 21', the snippet had fused it to 'TNNC121') and failed just validate; requoted. The description said the burden analysis covered several thousand HCM cases; MYOZ2 was sequenced in 632, and the paper reports no significant excess, so the wording and explanations now say that. The left ventricular hypertrophy item citing Cecconi 2016 (PMID:27600940) for milder or borderline hypertrophy in MYOZ2 carriers was removed: the borderline patients in that study carried LAMP2 and MYOM1 variants, and the MYOZ2-only carrier had an 18 mm wall; the diagnosis description's matching sentence was removed too. Myocardial fibrosis was dropped as a clinical phenotype because its only support was mouse data, and recast as a TISSUE-scale pathophysiology node (Interstitial Myocardial Fibrosis) wired to Hypertrophic Cardiomyopathy. Mouse-derived evidence on pathograph nodes, edges and mechanistic hypotheses now carries directness INDIRECT. The ALTERNATIVE calcineurin hypothesis previously had no edges; the trigger now links to the Calcineurin-NFAT Disinhibition node (SUPPORT from the knockout, REFUTE from the allele mice) and that node to Cardiomyocyte Hypertrophy, both tagged with the alternative hypothesis group. A REFUTE item that quoted the binding-domain positions (a restatement citing an earlier paper) was replaced with the allele study's own null calcineurin-activity result. The HCM phenotype text now says probands, not carriers, were ascertained through HCM, since L169G-only carriers were clinically normal; notes no longer call MYOZ2 the single causal gene.

  summary: 'Create: Hypertrophic Cardiomyopathy 16 (MYOZ2)'
  details: |
    New entry for hypertrophic cardiomyopathy 16 (MONDO:0013455), the MYOZ2/calsarcin-1 node of the HCM series, replacing stubs/Hypertrophic_Cardiomyopathy_16.yaml. Deep research: research/Hypertrophic_Cardiomyopathy_16-deep-research-claude_code.md (preflight-dr PASS; 15/15 references resolved; PMID:7618393 flagged off topic and not cited; the report's suggestion to record the ClinGen tier in gene_disease_validity was not followed, see below). relationship_type is DISPUTED following the CMH14 (MYH6) and CMH25 (TCAP) precedent: ClinGen classifies MYOZ2-HCM as Disputed (downgraded from Limited 2022-10-27). That ClinGen record is curated against generic HCM (MONDO:0005045), not MONDO:0013455, so it is cited as evidence and explained in notes but not copied into gene_disease_validity (list-gene-validity reports it as other_disease). Pathophysiology is scoped to two mechanistic hypotheses: an EMERGING calcineurin-independent Z-disc structural model (Ruggiero 2013 allele-transgenic mice) and an ALTERNATIVE calcineurin-disinhibition model (Frey 2004 knockout, Frank 2007 overexpression) that the allele mice contradict; recorded as a CONTROVERSY discussion. Human genetic evidence includes REFUTE items from the negative 438-patient European screen (PMID:18591919), the Walsh 2017 burden analysis (PMID:27532257, MYOZ2 named explicitly in the HCM panel), and the Guo 2017 pedigree where L169G-only carriers were unaffected. Sudden cardiac death and anticipation from the Guo pedigree are deliberately not recorded as phenotypes because all severely affected members also carried MYH7 A719H. Arrhythmia (founding family) is left unwired because no mechanism links MYOZ2 to it. GeneReviews HCM overview (PMID:20301725) tagged in references; no MYOZ2-specific chapter exists. Validated with just validate, validate-terms, count-verified-snippets, check-causal-targets, check-entity-refs, check-duplicate-keys, check-gene-validity, the snippet/title/hyphen/retired-prose gates, check-gene-activity-grounding --against-ref origin/main, and validate-disorders.

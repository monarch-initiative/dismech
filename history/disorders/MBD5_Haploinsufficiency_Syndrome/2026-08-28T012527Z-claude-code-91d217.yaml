  summary: 'Review round 3: deletion-cohort phenotypes and germline mosaicism'
  details: |
    Closes review round-3 findings 1 and 2 and the standing genetic-section finding. Fetched the full text of PMID:27222293 (Mullegama and Elsea 2016, the 2q23.1 deletion syndrome review), which the abstract-only cache did not carry, and used it for four phenotypes the review asked for: hypotonia, small hands and feet, short attention span, and a corrected frequency for hyperactivity. The correction is the substantive part - the deep-research report gave hyperactivity as greater than 60 percent, but the deletion-cohort review puts hyperactivity at about 9 percent and short attention span above 80 percent. The report had conflated two phenotypes the source separates. Small hands and feet is additionally evidenced from the passage that names the deletion-only features and excludes the reciprocal duplication cohort, which is the attribution the review's Named Entity Confusion warning asked for. Hyperphagia and fifth-finger clinodactyly are not curated: hyperphagia appears only in a table cell whose PDF-extracted row layout is not quotable as prose, and the clinodactyly figure sits inside a ligature-corrupted clause. Also added variant_origin DE_NOVO and germline mosaicism evidence from PMID:36396431, a family with three affected siblings and two phenotypically normal parents where deep-coverage sequencing found the mosaic mother. ClinGen dosage sensitivity remains uncurated for a tooling reason rather than a research one: just clingen-dosage-refresh fails a stale checksum gate, as does just refresh-orphadata, which is why the ORPHA:228402 prevalence citation the review asked for also could not be produced. Both are tracked in issue 7622. Round-3 review fixes in the same session: an outright test failure (test_environmental_mechanism_targets) where influences_mechanisms[].target carried the phenotypes# entity-reference prefix - that slot takes a bare name, and just check-entity-refs resolves the prefixed form happily, so the check a curator would reach for does not catch it. Corrected prevalence_class from ABOVE_1_IN_1000 to BAND_1_5_PER_10000, which is what the record's own rate of 50 per 100,000 and its 1-in-2,000 snippet both say. Added a carbamazepine caution and valproate preference to the seizure-management treatment from PMID:33912662, already cached and cited elsewhere in the entry, graded PARTIAL because the source states no drug was clearly superior. Quantified mosaicism at 14 percent of families from the same paper, gave microcephaly a FREQUENT band from its nine-of-twenty-three count, and migrated GO:0006355 to the more specific GO:0006357. The variant-class breakdown remains uncurated, and the reason is now precise rather than provisional: the deep-research report attributes the figure to the Mullegama and Elsea review, whose full text has now been fetched and does not state it. Validation: just validate passes, 62 of 62 snippets verified, the previously failing test passes across 2358 cases, and entity-ref, duplicate-key, environmental-evidence and snippet-grading gates are clean.

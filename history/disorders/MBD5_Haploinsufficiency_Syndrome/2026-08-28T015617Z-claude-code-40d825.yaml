  summary: 'Review round 4: move a frequency to the phenotype it belongs to'
  details: |
    Three round-4 findings, all from one already-cached paragraph of PMID:27222293, and all three were correct. The substantive one: Hypotonia carried frequency VERY_FREQUENT on the strength of the sentence 'In infancy, hypotonia contributes to feeding difficulties for over 90% of the 2q23.1 population'. The over-90 percent figure belongs to the feeding difficulty, not to the hypotonia that causes it, so the band was supported by nothing. The figure now sits on Feeding Difficulties, which previously carried no frequency at all, and Hypotonia carries none, with a description saying why: the only prose figure in that sentence is not its own, and the review's frequency-table row for hypotonia is in a PDF-extracted column layout that is not quotable as prose. This is the same defect class recorded on issue 9785 - a frequency band is unsourceable, so nothing relates it to the evidence item beside it - reproduced in the entry where that pattern was identified. Second finding: Short Attention Span rested on a snippet stating no frequency, avoided on the grounds of a hyphenated line break. The break falls inside 'includ-ing', before the figure; the clause 'repetitive behaviors, are reported in more than 80% of individuals' is clean and contiguous and is now the snippet. Third: fifth-finger clinodactyly was omitted because its figure sits in a ligature-corrupted clause, while the hypotonia evidence item three entries above already quotes 'dif ficulties' with the ligature intact. That was an inconsistent call rather than a cautious one; clinodactyly is now curated at HP:0004209, FREQUENT, quoting the ligature as it stands. Hyperphagia stays omitted and the reviewer accepted that: its Table 1 row really is PDF-mangled. Note the reviewer named PMID:27514998 as the source to fetch; the record that resolves is PMID:27222293, the same paper under a second PubMed ID. Validation: just validate passes, 64 of 64 snippets verified, entity refs, duplicate keys, snippet length, folded hyphens and title snippets all clean.

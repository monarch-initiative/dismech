  summary: Add MAND patient iPSC-NPC transcriptome model
  details: |
    Adds the human iPSC-derived neural progenitor cell model from PMID:34050248 (Mullegama et al., Sci Rep 2021) as the entry's first experimental_models record, closing the item deferred from the review of the five curation PRs tracked on issue 9788. Two modeled_mechanisms links: a MEASURES link to MBD5 Haploinsufficiency carrying the halved MBD5 mRNA readout, and a PARTIALLY_RECAPITULATES link to Disrupted Chromatin-Mediated Transcriptional Regulation in Neurons carrying the 468-gene differential-expression readout and the FOXG1 de-repression readout. The second link carries three typed divergences: POPULATION_MISMATCH because all three donors carry contiguous 2q23.1 deletions rather than intragenic MBD5 alterations and the authors state the gene list may reflect other deleted genes; BOUNDARY_OMISSION because a progenitor monolayer carries no neuronal, synaptic or regional context; and SCALE_EXTRAPOLATION because mRNA abundances are a molecular measurement standing for a cell-level programme. The NPC doubling-time result and the supplementary-table pathway enrichment are deliberately left out and the reasons recorded in notes. Validated with just validate, just validate-terms, just count-verified-snippets (72 of 72), just validate-disorders, just check-duplicate-keys, just check-entity-refs, just check-causal-targets, just check-qualifier-terms, just check-block-scalar-comments and just model-scale-audit.

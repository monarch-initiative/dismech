  summary: 'Review round 1: GeneReviews baseline, circadian mechanism, clinical layer'
  details: |
    Addressed the CHANGES_REQUESTED review on PR 9780. The blocking item was that a GeneReviews chapter exists, PMID:27786435 MBD5 Haploinsufficiency, was cited nine times by this PR's own deep-research report, and was neither tagged nor mined. It is now in a top-level references block tagged GeneReviews and cited across all four of its sections. Its title also independently supports this entry's naming decision, since the chapter is itself titled MBD5 Haploinsufficiency rather than by the OMIM phenotype name. Two changes are corrections rather than additions. First, the node carried GO:0008327 methyl-CpG binding with modifier DECREASED while the next node's description disclaimed exactly that mechanism; the annotation had no evidence item and rested on the gene's name, so it was removed with the reasoning recorded in node notes. Second, the description asserted that MBD5-only patients are clinically and transcriptionally indistinguishable from whole-interval deletions, dropping the source's own qualifier largely, and omitted that a reference this entry already cites reports a broader phenotype when EPC2 is co-deleted. Both are now stated, with the EPC2 observation graded PARTIAL because it qualifies rather than supports the single-locus claim. Added the circadian arm, PMID:25271084, as a Dysregulated Circadian Gene Expression node branching off the chromatin node and pointing at the sleep phenotype; this is what connects the disease's most clinically useful phenotype to its molecular lesion and converts the Smith-Magenis resemblance from a diagnostic anecdote into a shared-pathway claim. Connected the terminal pathophysiology node to five phenotypes rather than absorbing them into its prose. Added five phenotypes from GeneReviews including self-injury and aggression at over 60 percent, and upgraded three frequencies that had been under-called because the previous evidence established presence rather than frequency: seizures and autistic behaviour and sleep disturbance all move to VERY_FREQUENT on GeneReviews figures. Added treatments, diagnosis, a prevalence class record, the Mbd5 gene-trap mouse as a structured animal model with a limitation recording that the defining human speech phenotype has no murine analogue, and the GeneReviews transmission asymmetry between whole-gene deletions and intragenic variants. Snippets 45 of 45 verified.

  details: |
    Addressed the round-2 CHANGES_REQUESTED review. Finding 1: scoliosis, hip dysplasia and cardiovascular anomalies were curated as treatments while never appearing as phenotypes, from a GeneReviews sentence already quoted in the file. Added all three, applying the same reasoning the entry already used for feeding difficulties, that a referral or an annual screening recommendation is not made for a finding that does not occur. Finding 3: HP:0000750 was bound to two separate phenotype entries, so any HP-keyed query would double-count speech impairment. The second is now bound to HP:0001344 Absent speech, which is what its own snippet supports. Finding 4: review-response prose was stripped from seven places. The reviewer was right that phrases like previously carried and now points at have no referent for a future reader, and that the change log belongs in the history record. The standing justifications were kept and reworded to stand on their own, notably the explanation of why no methyl-CpG-binding term is annotated. The same sweep was applied to the other four entries in this run, which carried the same defect. Finding 5: the uncited prevalence class was replaced with a cited figure that has a denominator, 1 in 2000 of 17477 clinical microarray samples, explicitly scoped as a diagnostic yield in an ascertained population rather than a general-population rate. ORPHA:228402 did not resolve through the reference fetcher, and that is recorded rather than worked around. Finding 6, partly: documented transmission from mildly affected or mosaic parents is now cited, which matters because de novo should not be read as no recurrence risk. The variant-class breakdown and ClinGen dosage assertion remain uncurated and the genetic notes now say so explicitly rather than leaving the absence unexplained. Also added hyperactivity as a phenotype and the fever, viral illness and hot weather seizure triggers as an environmental entry with an EXACERBATES link. Finding 2 partly deferred: the reviewer warned that the hypotonia and clinodactyly sentence available in cache comes from the 2q23.1 duplication cohort, so quoting it would be Named Entity Confusion that passes snippet verification cleanly. Those phenotypes are left out rather than sourced from the wrong syndrome. Snippets 53 of 53 verified.

  details: |
    Review round on PR #11162. Three changes. First, the explanation on the ClinGen haploinsufficiency evidence argued the causal mechanism, which is a pathophysiology claim, while the item sits on the top-level inheritance block whose headline assertion is HP:0000006; rewritten to argue the inheritance claim directly - sufficient evidence that one functional copy is not enough is what makes a single altered allele sufficient to cause disease - while keeping the corroboration-not-primary-report framing. Second, added reference_title 'MBD5 dosage sensitivity' to both new CGDS evidence items, matching the cache file's own title field and the BRPF1/PTCH1 precedent. Third, the genetic record's notes said the assertion was 'curated above', which is true in file order but sends a reader to the wrong section; it now names both landing sites and says explicitly that neither is that record's own evidence list. Declined the fourth suggestion, rebuilding the three CGDS cache files still on older snapshots, as its own PR - the reviewer proposed it that way and pulling unrelated entries' evidence into this review surface would be worse.

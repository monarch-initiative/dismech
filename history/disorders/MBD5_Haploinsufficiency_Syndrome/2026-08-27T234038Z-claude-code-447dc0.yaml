  summary: 'Create: MBD5 Haploinsufficiency Syndrome'
  details: |
    New Disease entry for MONDO:0007974, curated from a claude_code deep-research report at research/MBD5_Haploinsufficiency_Syndrome-deep-research-claude_code.md. The report resolved 16 of 16 references with confabulation_rate 0.0, but needs_review was true because the single quote it checked failed to match, and 12 of 16 scored on topic. The entry is named MBD5 Haploinsufficiency Syndrome rather than adopting the MONDO label. MONDO:0007974 and its OMIM source call this intellectual disability, autosomal dominant 1 and place it in the non-syndromic intellectual disability series, but every clinical series reports short stature, microcephaly, seizures, disturbed sleep, stereotypies and coarse facies, and the phenotype was mistaken for Angelman, Rett and Smith-Magenis syndrome because it has a syndromic gestalt. disease_term remains bound to MONDO:0007974 so the mapping is preserved; the discrepancy between a correct binding and a clinically misleading label is recorded in top-level notes. Pathophysiology is a four-node chain from MBD5 haploinsufficiency through disrupted chromatin-mediated transcription and impaired neurite outgrowth to the neurodevelopmental endpoint. The chromatin node is deliberately stated at the level the evidence supports, since MBD5 binding to methylated DNA has been questioned in the literature, and the neurite node is flagged as resting entirely on mouse gene-trap data. A KNOWLEDGE_GAP discussion records that MBD5 is dosage-sensitive in both directions and that no mechanism accounts for duplication and deletion both causing disease. Validated with just validate, just validate-terms, just count-verified-snippets at 21 of 21, just check-entity-refs and just check-duplicate-keys.

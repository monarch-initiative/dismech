  summary: 'Review response: pexophagy node, PEX13 FxxxF regulation, reviewer fixes'
  details: |
    Second review round on PR #9973, responding to two sources of feedback.

    From the automated second opinion on claim issue #9969: added the human PEX13 FxxxF autoregulatory switch (PMID:38632234) to the docking-complex node, including the finding that the human SH3 domain does NOT recognise PEX14 PxxP motifs unlike its yeast ortholog - curated explicitly because the yeast PxxP docking model is the one in most reviews and would be wrong if carried across. Added a PROVISIONAL "Pexophagy of Import-Incompetent Peroxisomes" node from PMID:36541703, where PEX13 loss lets ubiquitinated PEX5 accumulate and peroxisomal ROS rise, together inducing pexophagy of otherwise healthy peroxisomes, with a HUMAN_MODEL_MISMATCH discussion because the work is in edited cells and zebrafish with no patient measurement. This reverses an earlier scoping decision that left PEX13's autophagy role out entirely; the notes record the reversal and why.

    From the ai4c-reviewer approval on PR #9973 (suggestions only, no blocking findings): corrected a prose error where the Secondary Mitochondrial Dysfunction description said "curated as EMERGING" while the slot value is PROVISIONAL (EMERGING is not a MechanismConfidenceEnum member); added reference_title to the two structured-source evidence items (the ClinGen assertion and the ClinicalTrials record); and added Cerebellar Atrophy (HP:0001272) and Adrenal Insufficiency (HP:0000846) phenotypes. Apnea, elevated transaminases and lissencephaly were suggested but not added - they appear only in the HPO annotation set for OMIM:614883, which is not a quotable source here, and no cached reference states them for a PEX13 patient. The notes say so rather than binding them to a snippet that does not support them.

    Revalidated: just validate-disorders passes with 94/94 snippets verified, all ungated checks clean, compliance 88.6%.

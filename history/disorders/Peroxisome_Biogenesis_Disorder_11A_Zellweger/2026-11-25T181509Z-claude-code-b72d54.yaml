  summary: 'Gene-family review: PEX13'
  details: |
    Both PEX13 nodes bound SH3 domain binding (GO:0017124), which describes a protein that binds an SH3 domain; PEX13 is the protein that has one, and in human PEX13 that surface does not even bind the PEX14 PxxP motifs, as this entry's own evidence (PMID:38632234) states. 'Biallelic PEX13 Loss of Function' now carries the gene, which was previously unwired, and binds protein-macromolecule adaptor activity (GO:0030674) for the SH3 and FxxxF docking of PEX5 and PEX14 (PMID:38632234) together with transmembrane protein transporter activity (GO:0008320) for the YG-domain conduit through which PEX5 carries cargo (PMID:36520918), both DECREASED. The docking-complex node now binds the docking adaptor activity instead of SH3 domain binding. The PEX13 record records germline origin, and an explanation that argued for the retired PARTIAL grade now states why the item is graded COMPUTATIONAL.

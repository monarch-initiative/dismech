  summary: 'Create: Peroxisome Biogenesis Disorder 11A (Zellweger)'
  details: |
    Created the PEX13-related severe (Zellweger-end) entry for MONDO:0013949, the fourth per-PEX-gene entry in the KB after PBD1B (PEX1), 3A (PEX12) and 4B (PEX6). Modeled on the PBD3A entry's structure but with a deliberately different upstream pathograph: PEX13 is the SH3-domain docking peroxin that receives cargo-loaded PEX5/PEX7, so the first three nodes are a docking-step lesion rather than the retrotranslocation/recycling lesion the other three loci share; downstream nodes converge on the shared biogenesis phenotype.

    PEX13-specific content: cargo-class selectivity of the homooligomerisation defect (Krause 2013, PMID:23716570), the recurrent p.Arg294Trp allele and its predicted destabilisation of the PEX13/PEX14 module (Borgia 2022, PMID:35854306), a PROVISIONAL secondary-mitochondrial-dysfunction node, and a three-tier allele model (null / oligomerisation-disrupting / hypomorphic) that maps onto the 11A vs 11B split via Shimozawa 1999 (PMID:10332040). Two Pex13 mouse models carry modeled_mechanisms: the ubiquitous null (PMID:12897163) and the brain-restricted conditional (PMID:20959636, PMID:29187321), the latter PARTIALLY_RECAPITULATES for plasmalogen deficiency because VLCFA are normal in that model.

    DHA supplementation is curated as a REFUTE treatment from the Paker 2010 randomised trial (PMID:20805528), with no target_mechanisms link because every available treatment_effect value would assert an effect the trial found absent. The cholic acid entry carries the Berendse 2016 advanced-liver-disease hepatotoxicity caution (PMID:27469511).

    Deep research: `just research-disorder falcon` with --fallback. Falcon was not configured in this environment, so the run fell back to claude_code and the report is research/Peroxisome_Biogenesis_Disorder_11A_Zellweger-deep-research-claude_code.md, recording fell_back and requested_provider in its frontmatter. Its reference validation was clean (49/49 resolved, none off topic). Its term validation flagged no unresolved CURIEs, but two identifiers it offered would have been substantive errors if copied: HP:0034512, offered for elevated VLCFA, is Transitional-cell carcinoma of the ureter, and HP:0000934, offered for chondrodysplasia punctata, is Chondrocalcinosis. Neither is bound. NCT03856866 was surfaced as a candidate treatment but its registration restricts it to PEX1/PEX6/PEX26, so it was excluded.

    GeneReviews PMID:20301621 is tagged and mined across all four abstract sections (Clinical Characteristics, Diagnosis/Testing, Management, Genetic Counseling).

    Validated with just validate-disorders (schema, terms, 86/86 snippets verified against cached references), plus check-duplicate-keys, check-entity-refs, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-environmental-evidence. Compliance 87.3% (the PBD3A sibling is 77.8%).

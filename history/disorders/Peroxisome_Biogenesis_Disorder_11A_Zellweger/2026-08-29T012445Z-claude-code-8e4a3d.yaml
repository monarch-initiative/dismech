  summary: 'Review round 3: narrow overstated gaps, fix zebrafish evidence grading'
  details: |
    Third round on PR #9973, addressing a CHANGES_REQUESTED review with two blocking findings and two suggestions.

    Blocking finding 1: two curated sentences claimed an experiment had not been done when it partly had. PMID:27514574 studies the same brain-restricted PEX13 mouse already curated here and reports an expanded, morphologically modified mitochondrial population in the intact brain plus antioxidant rescue of mitochondrial superoxide and membrane depolarization in PEX13-deficient fibroblasts. The animal-model limitations said the measurement was "in cultured E19 neurons rather than in the intact brain", which was no longer true, and the mitochondrial-causal-direction discussion said a rescue experiment "has not been reported", which overstated the gap. Both narrowed to what is genuinely missing - the rescue in a neuron with a survival endpoint - and the paper is now cited on the node with two in-vivo readouts. The proposed experiment was sharpened accordingly, from "do a rescue" to "repeat the reported fibroblast rescue in neurons and make survival the primary endpoint".

    Blocking finding 2: evidence_source IN_VITRO on a PMID:36541703 snippet whose text names a zebrafish model. Regrading that item to MODEL_ORGANISM exposed a second problem the checker caught: the discussion's quote contains the pathophysiology node's shorter quote as a substring, so the two gradings collided. Resolved by grading the shared headline claim MODEL_ORGANISM in both places (it rests on the zebrafish arm as well as the cell lines) and leaving the cell-line mechanism sentence as IN_VITRO - the per-sentence split a mixed-source paper calls for.

    Suggestion 1: added the Klouwer 2015 (PMID:26627182) corticosteroid caveat to Adrenal Replacement Therapy - screen everyone, treat only demonstrated insufficiency on Synacthen testing, because cortisone causes growth suppression and osteoporosis. Symmetric to the cholic-acid hepatotoxicity caution already present.

    Suggestion 2: the reviewer noted the exclusion rationale for elevated transaminases applied a stricter standard than the newly added Adrenal Insufficiency phenotype. Correct. PMID:26627182 carries a quotable spectrum-wide sentence, so Elevated Hepatic Transaminases (HP:0002910) is now curated at the same PARTIAL footing. Apnea and lissencephaly stay out - no cached reference contains a sentence stating them - and the notes now state the single threshold applied to all three rather than implying different ones.

    Also repaired a self-inflicted editing error: a scripted patch intended for the top-level references list matched two evidence items as well and inserted reference-list entries inside them, breaking YAML parsing. Caught by just validate before commit and reverted.

    Revalidated: just validate-disorders passes with 99/99 snippets verified, all ungated checks clean, compliance 88.9%.

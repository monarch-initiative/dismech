  summary: 'Create: Intellectual_Disability_Autosomal_Recessive_65'
  details: |
    Created the MRT65 (biallelic KDM5B, MONDO:0020850) entry from the stub, and deleted the stub. Lump/split: DISEASE. The stub carried one causal gene (hgnc:18039 KDM5B), no MONDO descendants, and a single MONDO parent (MONDO:0019502), which is the leaf signature; the literature treats MRT65 as one entity keyed to the biallelic genotype (OMIM 618109), so no grouping or subtype call was warranted.

    Deep research provider chain: falcon was requested and returned HTTP
    402 (Edison account out of credits); the recorded --fallback run fell back to
    openscientist, which completed in 1283s and produced
    research/Intellectual_Disability_Autosomal_Recessive_65-deep-research-openscientist.md
    (reference_validation 9/9 resolved, 3/3 quotes valid, 8/9 on topic;
    term_validation 26/29 verified, 0 not found, needs_review true;
    just preflight-dr PASS). Because a sibling agent's openscientist run had been
    cancelled server-side after 3600s, a claude_code run was launched in parallel
    while the fallback was outstanding and completed first in 290s, producing
    research/Intellectual_Disability_Autosomal_Recessive_65-deep-research-claude_code.md
    (reference_validation 8/8 resolved, 0 unresolved, 7/8 on topic;
    term_validation needs_review true with 12 mislabelled terms, mostly frequency
    strings written into the label slot; just preflight-dr WARN, whose flagged
    rival gene was the HP ontology prefix, a false positive, and whose second OMIM
    id 617773 belongs to RUSC2-related Alwadei syndrome, which that report names
    explicitly as a differential rather than confusing with MRT65). Both reports
    are committed and both were read. They agree on disease definition, causal
    gene, mechanism and the absence of disease-modifying therapy. Where they
    disagree with the entry - the openscientist report calls biallelic penetrance
    full or high, and offers a theoretical 1-in-1.3-million birth incidence - the
    entry declines both and says so in its notes.

    Two errors in the claude_code report were caught and not used: hgnc:29332 for KDM5B (correct is hgnc:18039, verified against the HGNC REST API) and HP:0002510 offered as moderate intellectual disability (that CURIE is Spastic tetraplegia; the entry binds the unqualified HP:0001249 because the reported severity spans mild to severe). That report also attributes PMID:39202393 to Chong et al.; it is Borroto et al. The openscientist report gives the gene CURIE correctly as HGNC:18039.

    Penetrance was the substantive curation question and the answer went against the working assumption in the task prompt. The reduced penetrance repeatedly documented in the KDM5B literature is a property of the HETEROZYGOUS state - unaffected relatives and controls carrying single loss-of-function alleles, non-segregation of dominant variants within families, and a gnomAD loss-of-function observed/expected ratio of about 0.57 that Borroto et al. read as partial penetrance. No source reviewed reports an unaffected homozygous or compound heterozygous individual; every reported biallelic individual was affected, and all were ascertained through affected probands. Inheritance.penetrance is therefore set to UNKNOWN (not INCOMPLETE, which would import a finding about a different genotype; not COMPLETE, which a ~10-case ascertained series cannot support), with expressivity VARIABLE (mild ID in the 2024 biallelic pair versus moderate-to-severe in the earlier literature). The reasoning is in the inheritance description, and the gap is recorded as a KNOWLEDGE_GAP discussion with a genotype-first ascertainment experiment.

    Evidence: nine references, all PMIDs, 63/63 snippets verified. Snippets were extracted programmatically from references_cache rather than retyped. Discussions cover the contested dominant/monoallelic KDM5B entity (CONTROVERSY), unmeasured biallelic penetrance (KNOWLEDGE_GAP), the mouse autism-like phenotype against its absence in biallelic humans (HUMAN_MODEL_MISMATCH), memantine/NMDAR antagonism as a preclinical lead (EMERGING_HYPOTHESIS), and the developmental-versus-ongoing requirement for KDM5B (OPEN_QUESTION).

    Three pathophysiology nodes conform to epigenetic_machinery_neurodevelopmental_dysregulation. The initiating node deliberately does not: that module node is haploinsufficiency of a dosage-sensitive component, whereas this disorder is biallelic complete loss, and the direction of the chromatin change is inverted (an eraser is lost, so the permissive H3K4me3 mark accumulates).

    Validation run to completion: just validate (pass), just count-verified-snippets (63/63), just validate-terms (pass), just check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles, check-term-cache-integrity, just normalize-cache, and finally just validate-disorders (pass, 63/63). just qc as an aggregate was not run; it exceeds the session tool timeout.

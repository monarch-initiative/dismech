  summary: 'Create: ataxia-telangiectasia-like disorder 2 (MONDO:0014399, PCNA)'
  details: |
    De-novo curation of MONDO:0014399 as a DISEASE entry, known in the molecular literature as PARD. Curated as one disease with TWO mechanistic hypothesis groups rather than one chain, because the two causal alleles have incompatible published mechanisms: p.Ser228Ile impairs client binding across most PIP-box partners, while p.Cys148Ser has wild-type-like structure and affinity and causes the same disease. The shared property is a thermostability defect, curated as the EMERGING reduced_functional_clamp_pool hypothesis against the CANONICAL lost_client_interactions one, with a REFUTE evidence item on each side. Two knowledge gaps: whether the alleles converge mechanistically, and why a defect producing only subtle changes in undamaged cells produces progressive neurodegeneration. Deliberately named in notes: EvidenceItem cannot record which allele an experiment used, which in this disease is load-bearing. Validated: just validate (33/33 snippets verified), validate-terms, check-entity-refs, check-duplicate-keys, check-causal-targets, check-enum-values, check-qualifier-terms all pass.

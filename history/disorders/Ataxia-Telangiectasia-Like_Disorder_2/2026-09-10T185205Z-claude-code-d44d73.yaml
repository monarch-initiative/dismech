  summary: Consume the deep-research references before opening the PR
  details: |
    Pre-PR pass over the deep-research report, done before opening the PR rather than after review.

    The first draft cited 3 of the 14 references the report offers. That is the same under-consumption pattern the reviewers flagged on all four sibling PRs in this claim run (#11619, #11621, #11622, #11630), so it was worth fixing here before a reviewer had to. Eleven are now cited and verified snippets went 33 to 48. Reading the rest changed content rather than padding it.

    PMID:26688547 was the keystone omission: the crystal structure of the S228I variant. It shows the client-binding pocket itself is remodelled by a large conformational change, which makes the interaction defect a property of the clamp rather than of any one partner. It independently confirms the p21 exception the entry had already recorded from a different group and method, and it explains why the defect is selective rather than uniform - the remodelled pocket can still flex to accommodate some ligands.

    PMID:37511614 is a second laboratory reaching the C148S result by FRET, intrinsic tryptophan fluorescence, DSF and AF4: no partner-affinity effect, impaired stability, and a mechanism the founding report did not name, increased aggregation. That takes the EMERGING reduced_functional_clamp_pool hypothesis from one group's assay to two, and the aggregation finding bears on how the thermostability node should be read - a clamp that aggregates leaves the functional pool as surely as one that unfolds.

    PMID:25972089 supplies a candidate reason p21 in particular survives the pocket remodelling: it is an atypical PIP-box with the highest known PCNA affinity, tethered by a tyrosine that most partners do not carry. Graded INDIRECT because the work is on wild-type PCNA and does not test the variant. PMID:33984330 sets the scale the selectivity must be read against - native PIP-box affinities already span four orders of magnitude, so a pocket change will not affect all partners equally even before any structural accommodation.

    Two knowledge gaps added, both acting on report findings the first draft had left alone.

    why_the_phenotype_is_neurological asks the question the pathograph does not answer: PCNA is required in every dividing cell, so why is this a cerebellar disease. PMID:17236820 supplies a testable candidate, that global-genome NER and PCNA recruitment to UV-damage sites are both constitutively lower in neurons and astrocytes than in fibroblasts, so neural cells may already sit near the lower limit of what the pathway delivers. It is rat primary culture on wild-type cells, so it is graded INDIRECT and MODEL_ORGANISM and recorded as a hypothesis about general biology rather than an observation about this disease. The gap names the two measurements that would move it.

    untested_epigenetic_branch records that DNMT1 is among the impaired clients and that nobody has looked for a methylation defect in patient cells. PMID:23535145 establishes the PCNA-dependent loading route and PMID:17994007 the parallel UHRF1/Np95 route; the second matters because a PCNA-side defect need not abolish maintenance methylation, so the branch could be real and still hard to detect. Recorded rather than modelled - putting a methylation node in the pathograph would assert a claim no source makes.

    Three of the report's references describe MRE11-related ATLD1, a different gene and a different repair pathway sharing only the clinical name and the numbering. They are cited only in the ATLD1 differential row, their explanations say so, and notes records why quoting them anywhere else would be the same wrong-entity error the sibling KIDAR entry documents, reached through a shared name rather than a shared gene. Three further references are deliberately uncited and notes says which and why: a bacterial beta-clamp review, which is not evidence about a human disease, and a general cerebellar-atrophy review that mentions ATLD in a list and would add a citation without a claim.

    Also: the links.issues field on the CREATE record was empty and is now filled with issue 11610, read back from the API. Three of the four sibling PRs in this run had a wrong issue number in a history record because the numbers were written from working memory of a contiguous block; that is why this one was looked up.

    Validation: schema clean, terms clean, 48 of 48 snippets verified, and entity refs, duplicate keys, causal targets, enum values and qualifier terms all clean.

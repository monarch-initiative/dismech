  details: |
    Round 1 of review on PR #11641. Both blocking items and all four suggestions, in one push. Snippets 48 to 62; phenotypes 7 to 18.

    BLOCKING 1, premature aging. The reviewer is right and the miss is embarrassing in a specific way: the entry quotes the six-cardinal-features sentence six times, curates five of the six, declares Progeroid Syndrome among its parents, and asserts in a differential row that premature aging is cardinal here. Every signal pointed at the gap except the phenotypes list itself.

    One correction to the finding. Both the deep-research report and the review propose binding either HP:0007495 or HP:0001025. HP:0001025 is Urticaria. Binding it would have asserted an unrelated dermatological finding in a progeroid disorder, and it would have validated cleanly, because term validation checks that a label matches its CURIE and not that the concept matches the claim. Bound to HP:0007495 Prematurely aged appearance, with the reasoning recorded in the phenotype description so the next reader does not repeat the suggestion. This is the CLAUDE.md rule about a report's CURIE being a lead rather than an answer, and it survived one review round before being caught.

    BLOCKING 2, references. PMID:23436002 and PMID:24733832 were cited in the ATLD1 differential but absent from the top-level references block. Added with titles copied from the cache frontmatter.

    SUGGESTIONS, all taken. Nine further phenotypes from the founding report, which is the only clinical source this disorder has and was already committed here: cognitive decline, progressive gait instability, muscle weakness, dysphagia, dysarthria, foot deformity, photophobia, predisposition to sun-induced skin malignancy, and labyrinthine dysplasia. Three curation notes worth recording. Dysphagia and dysarthria are split from the source's single speech-and-swallowing clause because they are different functions with different consequences. Dysarthria is graded INDIRECT since the source says difficulties with speech without specifying a motor-speech deficit. The malignancy row asserts a predisposition rather than a rate, keeping the authors' evidence of qualifier, because four affected individuals cannot support a frequency.

    The unevidenced distinguishing feature is now evidenced. The ATM row asserted no immunodeficiency or raised alpha-fetoprotein with only a nosology review cited, which does not carry it. The founding report does, in two places: the absence sentence, and the methods-level list confirming AFP and immunoglobulins were measured and normal. The second matters because it turns an absence into a finding rather than an untested assumption. The same sentence supplied a discriminator the row had not named, oculomotor apraxia, now added.

    UV is curated as an environmental entry with influences_mechanisms to the repair node, environmental_effect EXACERBATES rather than TRIGGERS. The disease is the repair defect; UV is what makes it visible. The entry says so explicitly and notes the interaction is demonstrated in patient fibroblasts under controlled irradiation, with no dose-response reported in patients.

    Validation: schema clean, terms clean, 62 of 62 snippets verified, and entity refs, duplicate keys, causal targets, enum values and qualifier terms all clean.

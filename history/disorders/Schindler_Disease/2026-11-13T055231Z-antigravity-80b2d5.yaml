  details: |
    Re-graded all 11 PMID:31890708 items and the PMID:14685826 item on Lysosomal Glycopeptide Accumulation from evidence_source OTHER to HUMAN_CLINICAL while retaining quote_role BACKGROUND. Added the 9 infantile neurodegenerative phenotypes from ORPHA:79279 (Cerebral visual impairment, Severe intellectual disability, Generalized amyotrophy, Muscle weakness, Abnormal pyramidal sign, Abnormal brainstem morphology, Myoclonus, Nystagmus, and Strabismus), wired all 9 from Neuroaxonal Dystrophy and Neurodegeneration, and documented in notes why ORPHA:79279 cutaneous/vascular/cardiac/adult-type annotations (type II Kanzaki / type III) are excluded and why ClinGen's umbrella NAGA assertion (MONDO:0017779) is not recorded as a subtype-specific assertion on MONDO:0012221. Removed GO:0007040 and unsourced glycosidase-complex prose from Lysosomal Glycopeptide Accumulation and neutralized Areflexia and Optic atrophy edge descriptions.

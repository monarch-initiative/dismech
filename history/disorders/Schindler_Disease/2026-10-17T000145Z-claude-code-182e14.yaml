  details: |
    LOINC tranche D batch 6 (arylsulfatase family and sphingomyelinase). Schindler disease is the severe infantile-onset end of the alpha-N-acetylgalactosaminidase (NAGA) deficiency spectrum, the same enzyme deficient in Kanzaki disease (type 2), already bound to LOINC:LP14015-9 in tranche D batch 4. Added the same specimen-generic Part code to the existing 'Enzyme assay and molecular testing' diagnosis row, whose own evidence names only 'a blood test' generically. Not yet on origin/main (the Kanzaki binding is on the unmerged PR #14561), so seeded fresh here. No reference_ranges band: the source states 'diminished' activity qualitatively, with no numeric cut-off. just validate-disorders, check-entity-refs, check-duplicate-keys, check-enum-values, check-qualifier-terms, check-causal-targets, and tests/test_loinc_measurement_schema.py all pass.

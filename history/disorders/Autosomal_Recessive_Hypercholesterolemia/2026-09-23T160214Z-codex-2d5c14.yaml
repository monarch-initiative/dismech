  summary: Review LDLRAP1 cell-specific uptake, clinical outcomes and treatment evidence using full texts
  details: |-
    Reviewed the complete baseline, both prior CREATE/EDIT histories and the entire 6,268-character manual research fallback. No REVIEW existed. The fallback explicitly records a failed provider run caused by ENOSPC and a subsequent manual PubMed sweep; it is not misrepresented as provider-generated research. There is no companion citation appendix. Preflight raised a high LDLR comparator count, but the canonical LDLRAP1 gene, MONDO:0011374 and OMIM:603813 identify the correct disease. Comparative LDLR literature was retained only with explicit gene and model boundaries. Mendelian ARH is eligible under the scope excluding infectious diseases and environmental diseases/poisonings; treatment and environmental modifiers do not reclassify it. Live open-PR preflight found no overlapping ARH review.

    Used the existing cached abstracts for the founding gene discovery (PMID:11326085), Garuti's polarized WIF-B/domain study (16179341), Thedrez's patient-lymphocyte PCSK9 study (27079874), Sicilian allele survey (29153781) and 2020 review (32011344), and read them completely. Attempts to obtain the JBC full PDF failed; its abstract was not presented as a full-text assessment. Newly fetched abstracts 22157599, 30777337, 42730734 and 41671678 were read completely, respectively providing human tracer kinetics/statin response, the initiation-codon allele and clinical evolocumab response, the 2026 adolescent combination-treatment case, and confirmation of two LDLRAP1 participants in the evinacumab extension. The standard cache for the pivotal evinacumab trial PMID:32813947 remains abstract-only; an alternative PDF download failed certificate validation and was not used. Primary titles, authors, dates and disease identity were checked rather than relying on similarly named dominant FH studies.

    Read the entire scientific main text and methods, all seven figure captions and Table 1 of the 2007 JCI study PMID:17200716. No supplement was read. Arh-knockout mice differ from Ldlr-knockout mice in preserved VLDL-remnant uptake despite defective LDL clearance and similar VLDL secretion. The human-LDLR experiments, fresh primary hepatocytes, LRP deletion, heparinase, high-affinity antibody and aggregated-LDL experiments constrain the mechanism. Higher affinity or receptor clustering alone is not established as sufficient. Culture duration and ligand preparation can explain discrepant cell results. Preserved remnant uptake is represented separately from pathological LDL elevation without a false positive causal edge from the protective function to hypercholesterolemia. One human tracer study supports the principle but cannot establish a population-wide magnitude or hepatic exclusivity of measured whole-body clearance.

    Read all scientific main text, methods, figures and Table 1 in the publisher full text of PMID:17761685 (Eden 2007), recovered through the OUP article-minimal URL after the main publisher route failed. The cached HTML has genuine article content, not a challenge page. Patient fibroblasts have preserved baseline LDLR function; DAB2 depletion reduces receptor protein and uptake, not mRNA, with murine DAB2 rescue. The authors explicitly say this prevents isolation of DAB2's proposed endocytic role. Pulse-labeling supports a translation-related explanation, but degradation not blocked by the tested inhibitors remains possible. HeLa depletion results are contextual comparisons, not interchangeable with patient fibroblasts. Added the experimental model and a knowledge gap without claiming a human DAB2 modifier allele or proven simple adaptor redundancy.

    Read the full scientific main text, methods, all three tables, figure captions and clinical perspectives of the 2018 JACC 52-patient cohort (PMID:29348020) from the repository PDF. Online Tables 1/2 were not available/read. Thirty-nine homozygotes and 13 compound heterozygotes, two large rearrangements and Sardinian enrichment inform genetic scope. Baseline LDL-C includes already-treated patients; nadir is not longitudinal average exposure. Forty-seven of 52 had xanthomas of any morphology, not 90% tendon xanthomas. Five had myocardial infarction during follow-up. Valve follow-up was available in 45, although six new diagnoses were reported as 11.5% of the whole 52. Historical comparisons and nonrandom treatment groups do not prove identical risk across genes, independent effects of each drug or sex-specific biology. Avoided inconsistent dose summaries, prevalence extrapolations and the erroneous age-direction sentence. Removed the over-specific module assertion equating every ASCVD manifestation with plaque rupture; retained the supported arterial outcomes.

    Read the entire main scientific text/methods/results/discussion and captions of the nine-patient lomitapide study PMID:36072671 from the cached full text, and recovered both clinical and liver-safety tables from its publisher PDF. Four patients overlap the 2018 cohort and cannot be counted as independent additional patients. The LDL-C benefit occurs on background therapy, with variable apheresis/PCSK9 co-treatment. Gastrointestinal discontinuation, transaminase elevation and new/worsening liver fat qualify the abstract's broad safety conclusion; six normal stiffness measurements do not establish lifelong hepatic safety. Avoided the inconsistent best-response percentage and unavailable baseline fat measurements. Also read all scientific main text and methods of the pivotal lomitapide trial PMID:23122768; embedded table cells and supplements were not available. Its 29-adult single-arm results are explicitly pooled HoFH evidence, not a separate ARH efficacy estimate.

    Read all six pages, including both case narratives and the table, of the 2026 evinacumab two-ARH-patient report (DOI:10.1016/j.jacl.2026.02.007) via the institutional PDF. Background therapy changes and apheresis timing prevent attributing every percentage to evinacumab alone. The first case's printed 82% reduction is arithmetically inconsistent with its 549-to-62 pair; neither is used as an isolated treatment estimate. The second case maintained low LDL-C after evolocumab/bempedoic acid withdrawal while rosuvastatin/ezetimibe continued. Avoided its discrepant historical age and p.Trp44* annotation for c.65G>A, and did not promote APOE2/2 to an established ARH modifier. Mild transient infusion symptoms are retained. A DOI metadata cache without content and inaccessible additional publisher case were not cited. Read the introduction, methods and all results/tables of the 2025 Italian evinacumab five-patient series (PMID:40169529); all five genotypes were LDLR, so its five-year effect estimate was excluded from LDLRAP1-specific claims. Its later discussion was not read.

    Read the entire scientific main text, boxes and captions of the 2023 EAS HoFH consensus PMID:37130090, excluding supplemental Table S1. Read the full GeneReviews scientific chapter NBK174884 across clinical characteristics, diagnosis, management, counseling and molecular genetics, then recovered its PDF for exact quotations. Kept the PMID tagged GeneReviews and linked the PDF identity through publication findings. Severe clinical HoFH guidance is labeled as class-level, with treatment based on phenotype and response. No obsolete regulatory age threshold or blanket pregnancy statin contraindication was imported. Apheresis need not await coronary disease; invasive angiography is clinically indicated, not routine in all ARH. Added panel/CNV and VUS qualifications, parental segregation, cascade/carrier testing, partner/reproductive counseling, lifestyle, cardiovascular monitoring and pregnancy planning. Disease-specific differentials include other FH genes, sitosterolemia, LIPA deficiency, cerebrotendinous xanthomatosis and acquired causes.

    Fetched and read all three registry summaries and checked the live ClinicalTrials.gov API records for NCT00730236, NCT03399786 and NCT03409744 on 2026-09-23. All are completed phase III studies. Enrollment, ages, background-treatment constraints and eligibility are distinguished from their cached objective quotations; published result evidence accompanies the entries. The extension's 55-person identical-biallelic subgroup includes only two LDLRAP1 participants, so its pooled percentages are not ARH-specific. Normal fibroblast activity does not exclude genetically eligible ARH. No fabricated disease-specific trial was added.

    Corrected the combined Sardinia/Sicily Hardy-Weinberg estimate to the direct one-heterozygote/2,565 Sicilian ARH1-only observation. Removed unsupported complete penetrance and unconditional recurrence-risk statements. Modern locus and founder nomenclature, compound heterozygosity, rearrangements and residual activity replace the universal-null/homozygous model. Corrected absent-internalization and statin-resistance overclaims and ezetimibe's purported complete LDLR independence. Expanded xanthoma morphology without converting selected-cohort fractions into population penetrance. Separated animal and isolated-cell evidence and kept clinical drug responses distinct from lymphocyte experiments. Preserved uncertainty rather than inventing a complete remnant-entry mechanism.

    Completeness assessment against the manual research and current source review: phenotypes, genetics, atomic mechanisms, diagnostics/biomarkers, treatment/trials and central references are adequate after revision. Other causal genes are differentials, not LDLRAP1 subtypes. Novel translation/remnant machinery and long-term treatment outcomes remain explicit knowledge gaps. URL publication titles preserve fetcher metadata while findings identify the underlying publications. All used caches were fetched through the prescribed tooling; no reference-cache text was authored by the agent. OLS searches verified new phenotype, drug, counseling and differential-disease bindings. No dataset accession was curated, and the frozen dataset-accession blob was not accessed. Final schema, ontology, quotation, history and repository checks are reported in the PR.

    Independent review approved the initial head and suggested a cleaner founder-allele quote. Replaced the GeneReviews table fragment containing the next PCSK9 header with the primary 2018 cohort sentence naming the Sardinian variants. Retained the selected-cohort xanthoma fraction without a population frequency band, and retained evidence on both intervention and causal links where they support independently inspected assertions. The two intentional codespell exceptions for source names require the repository scope-override label; it was applied and CI rerun. No scientific source text was changed.

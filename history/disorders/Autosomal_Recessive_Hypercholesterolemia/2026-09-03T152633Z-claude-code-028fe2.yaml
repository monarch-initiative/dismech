  summary: 'Create: Autosomal Recessive Hypercholesterolemia'
  details: |
    Created the LDLRAP1/ARH recessive hypercholesterolemia entry (MONDO:0011374) end-to-end. entry_type DISEASE: distinct recessive gene (LDLRAP1) and mechanism (loss of the cytosolic adaptor bridging a structurally normal LDL receptor to clathrin-mediated endocytosis), kept separate from the dominant FH entries (LDLR/APOB/PCSK9). Curated a full pathophysiology chain (biallelic LDLRAP1 LOF -> loss of ARH adaptor bridging -> impaired hepatocyte LDLR clathrin-mediated endocytosis, liver-restricted -> impaired hepatic LDL clearance -> lifelong LDL-C elevation -> premature ASCVD and extravascular cholesterol deposition), 8 phenotypes (hypercholesterolemia, increased LDL-C, tendon xanthoma, premature coronary atherosclerosis, MI, aortic valve stenosis, xanthelasma, corneal arcus), LDLRAP1 genetic block with AR inheritance and Sardinian ARH1/ARH2 founder alleles, structured prevalence (ultra-rare; Sardinia/Sicily founder), LDL-C biomarker, and four treatments (statin+ezetimibe, lomitapide, lipoprotein apheresis, PCSK9 inhibitor) with target_mechanisms and therapeutic_modality. Evidence: PMID:11326085 (Garcia 2001 gene discovery), PMID:16179341 (adaptor/clathrin mechanism), PMID:32011344 (ARH 2020 review), PMID:36072671 (Pan-European lomitapide subanalysis), PMID:27079874 (PCSK9i in ARH), PMID:29153781 (Sicily/Sardinia epidemiology), PMID:24404629 (FH GeneReviews, class-level, tagged GeneReviews). Deep-research fallback: automated claude_code run produced no report (host filesystem ENOSPC, concurrent sibling run); performed a manual PubMed sweep instead, recorded in research/. Validated to green: just validate (49/49 snippets), validate-terms, validate-disorders, check-causal-targets, check-duplicate-keys, check-entity-refs, check-qualifier-terms, check-enum-values, snippet-grading/length/title/folded-hyphens all pass. Closes #10721; deletes stub.

  summary: 'Create grouping: ERCC6-Related Cockayne Spectrum'
  details: |
    Resolved the stub for MONDO:0100506 (Cockayne spectrum with or without cerebrooculofacioskeletal syndrome) as a GROUPING and deleted the stub. MONDO defines this term by gene, as the ERCC6 spectrum covering Cockayne syndrome type B, COFS1 and de Sanctis-Cacchione syndrome, and ClinGen's Definitive ERCC6 assertion is made against it. dismech already curates the first two as subtype rows in two different disease entries (the Cockayne syndrome type B row of Cockayne_Syndrome and the COFS1 row of COFS_Syndrome), so a new Disease entry would have duplicated both. The grouping lists those two rows as SUBTYPE members under one NECESSARY HAS_GENE ERCC6 criterion, and maps MONDO:0100506 as skos:exactMatch. The mapping justification records that MONDO places the members' own terms (MONDO:0019570, MONDO:0008955) beside the mapped class rather than under it. UV-Sensitive_Syndrome binds ERCC6 too but is excluded, because MONDO:0100506 does not include it. De Sanctis-Cacchione syndrome has no entry and is still queued as its own stub. No deep-research run was made: the user had asked for an antigravity run for a new Disease entry, then chose the grouping disposition, and every claim here rests on two already-cached member papers (PMID:38674442, PMID:20456449) and the cached ClinGen record. A fresh-context review before the PR found that the first draft's onset contrast (CS type B as the postnatal end, COFS1 as the prenatal end) contradicted PMID:38674442, which describes CS II as already showing growth failure and eye anomalies at birth and as partially overlapping COFS. The description and both differentiating_mechanisms were rewritten from that paper's own sentences, a second PMID:38674442 evidence item quoting the CS II/COFS overlap was added, the ClinGen wording was narrowed to what the cached single-row record states, and the ERCC6 file census in notes was corrected. Validation: just validate-grouping-batch passes (schema, terms, 3/3 snippets, strict offline audit with both members SATISFIED). just grouping-mondo-consistency reports 0/2 members descending from MONDO:0100506, which is report-only and explained in the mapping justification.

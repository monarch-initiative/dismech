  summary: 'Create: Treponematoses grouping'
  details: |
    Created the Treponematoses grouping over the four human treponemal diseases: Syphilis, Yaws, Bejel, and Pinta. This became possible only with the Syphilis entry added in the same pull request - the grouping's members must resolve to real Disease names, and the venereal member did not previously exist in the KB, which is why the group could not be assembled before.

    grouping_basis is SHARED_MECHANISM, SHARED_GENE_FAMILY, and CLINICAL_CONVENTION. The rationale records both why they belong together - near-identical organisms, a conserved chronic staged spirochetal mechanism, and universal retained penicillin susceptibility - and why they are deliberately kept as four separate Disease entries rather than merged: they differ in transmission route, in whether congenital infection occurs at all, in the organ systems ultimately damaged, and in second-line drug susceptibility.

    Accuracy point that shaped the criteria: Pinta is caused by Treponema carateum, a distinct species rather than a Treponema pallidum subspecies. A subspecies-based membership criterion would therefore have wrongly excluded it, so the criterion is worded as 'a pathogenic treponeme'. This was verified against the Pinta entry's own infectious_agent block rather than assumed.

    The membership criteria are a single NECESSARY block: an AND of an OTHER leaf carrying the pathogenic-treponeme requirement and an OR over the two antimicrobial-target modules that between them cover the regimens used across the group. The OR is satisfied by every member - Syphilis on both arms, Bejel and Pinta on the cell-wall arm, Yaws on the ribosome arm.

    Honest reporting of the evaluator output. just check-groupings reports structure OK and all four members as UNKNOWN, not SATISFIED. An earlier draft of the notes claimed the evaluator would report SATISFIED; that was wrong and was corrected before commit. UNKNOWN is the correct three-valued result because the OTHER leaf is not machine-evaluable, so the conjunction containing it can never resolve to SATISFIED regardless of member completeness. The notes now explain this, and also explain that the per-leaf NOT_SATISFIED lines printed for the unsatisfied arm of the OR are expected rather than violations.

    No SUFFICIENT criteria block is provided, deliberately, and the reason is recorded: encoding 'caused by a pathogenic treponeme' as sufficient would invite the classifier to propose polymicrobial periodontal disease entries involving commensal treponemes as candidate members. The real boundary is the four systemic human treponematoses, and it is recorded in the rationale rather than as machine-checkable sufficiency.

    MONDO mapping is skos:closeMatch to MONDO:0007000 Treponema infectious disease, not exactMatch, because the MONDO class is defined by causative genus and is therefore broader than the clinical category.

    Schema gap surfaced in notes: CriterionPredicateEnum has no infectious-agent predicate, which is why the causative-organism criterion has to be an unevaluable OTHER leaf. A HAS_INFECTIOUS_AGENT predicate taking an NCBITaxon-bound infectious_agent_term would make this criterion machine-checkable against each member's infectious_agent block and would generalize to any infectious-disease grouping.

    Validation: just validate-grouping passes schema, terms, and references; just check-groupings reports structure OK; the single reference supporting_text was independently verified as an exact substring of the cached PMID:24396138 abstract.

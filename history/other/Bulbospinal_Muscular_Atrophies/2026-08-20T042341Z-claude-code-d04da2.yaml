  summary: 'Create grouping: Bulbospinal Muscular Atrophies (MONDO:0016113)'
  details: |
    Curated MONDO:0016113 (bulbospinal muscular atrophy) for issue #8940 as a kb/groupings/ Grouping rather than a new kb/disorders/ Disease entry.

    SCOPING DECISION. MONDO:0016113 carries the disease_grouping, ordo_group_of_disorders and rare subsets and derives from the Orphanet group of disorders Orphanet:206701, so it names a group, not a disease. kb/disorders/Kennedy_Disease.yaml already exists bound to MONDO:0010735 (Kennedy disease), whose own MONDO definition reads "Kennedy's disease, also known as bulbospinal muscular atrophy (BSMA)". Option (a), a broader Disease entry with has_subtypes, was rejected because it would have re-derived the Kennedy pathophysiology without a distinct mechanism of its own. Option (c), a mappings.mondo_mappings addition on Kennedy_Disease, was rejected because MONDO:0016113 subsumes further entities (spinal atrophy-ophthalmoplegia-pyramidal syndrome MONDO:0015250, pontocerebellar hypoplasia types 1 and 2, and by disease_has_major_feature riboflavin transporter deficiency MONDO:0008891) and so is neither an exact nor a narrow match for Kennedy disease alone. Option (b), a Grouping, was chosen. MONDO:0016113 is mapped with skos:narrowMatch plus a consistency note recording that alignment is conceptual rather than extensional in both directions.

    MEMBERS. Kennedy Disease (MONDO:0010735), Brown-Vialetto-Van Laere Syndrome (MONDO:0008891, riboflavin transporter deficiency, including Fazio-Londe disease), and Madras Motor Neuron Disease (MONDO:0015307). All three already carry the HPO annotations the criteria are evaluated over. Pontocerebellar Hypoplasia was deliberately NOT listed despite MONDO placing PCH1/PCH2 under MONDO:0016113: the DisMech entry is bound to the broad MONDO:0020135 concept and annotates neither anterior-horn nor bulbar lower-motor-neuron involvement, so listing it would have created a criteria contradiction. Progressive Bulbar Palsy was excluded as a bulbar-onset ALS-spectrum variant with corticobulbar features and TDP-43 proteinopathy. Both exclusions are recorded explicitly, as a CURATION_TODO discussion and as mapping-consistency notes, rather than left implicit.

    CRITERIA. One NECESSARY block with structured logic: AND(HAS_PHENOTYPE HP:0002366 abnormal lower motor neuron morphology, OR(HP:0002483 bulbar signs, HP:0001283 bulbar palsy)). A second NECESSARY block states lower-motor-neuron predominance in prose only, with an explicit note that no boolean encoding is given because HPO annotation records presence rather than predominance, and pyramidal signs are documented in two of the three members.

    DEEP RESEARCH AND NEC OUTCOME. falcon (Edison) was run, producing research/Bulbospinal_Muscular_Atrophy-deep-research-falcon.md. Its own reference_validation frontmatter reports 8/8 references resolved, confabulation_rate 0.0, quotes 1/1 valid, and no unresolved_references. just preflight-dr against MONDO:0016113 returned SKIP (MONDO records no RO:0004003 causal gene for a grouping term), so the manual CLAUDE.md section 2b checks were applied and all three failed: the report's gene mentions are dominated by AR (46 mentions vs 1 for the next disease gene), it asserts OMIM 313200 while MONDO:0016113 has no OMIM xref at all, and it keyed off the "SBMA" and "spinal-bulbar muscular atrophy" EXACT synonyms that MONDO:0016113 shares with Kennedy disease. Verdict: Named Entity Confusion, the report is about Kennedy disease. It was discarded in full and NOT cherry-picked; no PMID, snippet, ontology term or claim from it appears in the grouping. It is committed as run provenance with a prominent curator NEC warning prepended to the report body, and the underlying synonym collision is recorded as the mondo_0016113_sbma_synonym_collision OPEN_QUESTION discussion on the grouping.

    EVIDENCE. All 10 evidence snippets were drawn from references already cached and previously verified on the member disease entries: PMID:37360345, PMID:20301508, PMID:24253200, PMID:22740598, PMID:20206331, PMID:24139842, PMID:12686396. Each is an exact substring of its cached reference. CORRECTION: an earlier draft of this record stated that no references_cache or cache file was created or edited by this session. That was wrong. The commit adds 8 DOI_*.md cache files, refetches PMID_37360345.md as full text, modifies PMID_22740598.md and PMID_24253200.md, and adds rows to cache/mondo/terms.csv and cache/enums/diseaseterm_f618932bb23f.csv. All of that is legitimate tool-generated output from just fetch-reference and the term validator; none of it was hand-written. The error was in the provenance statement, not the files.

    VALIDATION RUN AND READ. just validate-grouping kb/groupings/Bulbospinal_Muscular_Atrophies.yaml: schema OK, term validation passed, reference validation passed with "Snippets checked: 10/10 verified against cached references". just check-groupings on the file: structure OK, all 3 members SATISFIED under the boolean criteria. just check-duplicate-keys on the file: OK. just validate-disorders was NOT run because it targets kb/disorders/ files and this PR adds no disorder file; just validate-grouping is the equivalent gating check for a Grouping and it is what was run.

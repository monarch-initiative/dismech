  summary: 'Create: Channelopathies grouping'
  details: |
    New grouping of the 60 entries carrying a channelopathy_category tag (19 cardiac, 6 skeletal muscle, 27 neurological, 6 epithelial, 2 immune). Criterion 1 is NECESSARY: each member curates a GO molecular function under GO:0005216 monoatomic ion channel activity or GO:0099106 ion channel regulator activity. Criterion 2 is NECESSARY_AND_SUFFICIENT on the channelopathy_category tag, so tag and grouping stay in step. Twenty previously untagged entries were tagged; CAPOS syndrome lost its tag (ATP1A3 is a pump); five entries gained channel MF terms to satisfy criterion 1 and GABRB3 gained GO:0022851 beside GO:0004890. Deliberately excluded: Alternating Hemiplegia of Childhood (pump), Genetic Developmental and Epileptic Encephalopathy, Congenital Insensitivity to Pain and Familial Atrial Fibrillation (umbrella entries, mostly non-channel genes), Local Anesthetic Systemic Toxicity (acquired). The GO closure for the two criterion terms was added to cache/closure/go.csv with just build-grouping-closure-cache. just validate-grouping-batch passes, including the strict offline audit.

  summary: 'Create grouping: Inactivating PTH/PTHrP Signalling Disorders (iPPSD)'
  details: |
    New grouping following the EuroPHP iPPSD classification (PMID:27401862). It was created after splitting Pseudopseudohypoparathyroidism out of the Pseudohypoparathyroidism has_subtypes, so the relationship between the two is expressed as sibling membership instead of parent-child. Members: Chondrodysplasia Blomstrand Type (PTH1R), Pseudohypoparathyroidism (GNAS; PHP1A/PHP1B), Pseudopseudohypoparathyroidism (paternal GNAS), Acrodysostosis (PRKAR1A, PDE4D). Criteria are NECESSARY only: a gene OR over PTH1R/GNAS/PRKAR1A/PDE4D ANDed with a free-text direction-of-effect leaf, because activating lesions in the same genes (Jansen metaphyseal chondrodysplasia, GNAS-related pituitary adenoma) fall outside it. POH and osteoma cutis have no entries yet. No iPPSD number is asserted for Blomstrand chondrodysplasia. Validated with linkml-validate, the term validator, the reference validator (3/3 snippets), dismech.groupings --strict and the grouping pytest subset.

  summary: 'Create: 46,XX Disorder of Sex Development grouping (MONDO:0017576)'
  details: |
    Curated MONDO:0017576 as a kb/groupings/ Grouping rather than a Disease with has_subtypes, departing from the CURATE_ROOT_WITH_SUBTYPES hint on issue 9607 (per issue 8727 that hint is a prioritization signal, not a lump/split ruling).

    Scope decision. The 46,XX DSD category is defined by karyotype plus clinical presentation, not by mechanism. Its arms are independent causal chains: a steroidogenic enzyme block generating fetal androgen excess over a normal ovary (congenital adrenal hyperplasia, aromatase deficiency); a gonadal-determination lesion building a testis in an XX gonad (46,XX testicular DSD); failure of ovarian development with no androgen excess at all (46,XX gonadal dysgenesis); and a structural Mullerian arm. All four candidate members were already curated Disease entries, so a root entry with has_subtypes would have duplicated them and required a pathophysiology section false for most of the entity.

    Members: Congenital Adrenal Hyperplasia, Aromatase Deficiency, 46,XX testicular disorder of sex development, 46,XX Gonadal Dysgenesis. Each carries differentiating_mechanisms and one verified evidence item.

    Deliberate exclusions, recorded in notes: NR5A1-related sex development disorder (curated across both karyotypes, dominant presentation 46,XY; its 46,XX arm is represented via 46,XX testicular DSD); the Mullerian/structural arm and 46,XX ovotesticular DSD (no dismech Disease entry yet).

    Orthogonality: this grouping is the karyotype/clinical-category axis. The existing Gonadal_Dysgenesis and Androgen_Synthesis_and_Action_Disorders groupings are mechanism-axis unions; membership overlap with Gonadal_Dysgenesis is expected and asserts something different.

    MONDO mapping predicate is skos:closeMatch, not exactMatch: the grouping under-covers MONDO:0017576 (missing arms) and is not a subset of it (CAH and aromatase deficiency are karyotype-agnostic disease entities). MONDO:0017576 is therefore deliberately not retired from the curation queue.

    Nomenclature follows the Chicago consensus and its 2016 global update: disorders/differences of sex development, described by karyotype and mechanism, with the older intersex and hermaphroditism terms used only as historical synonyms where members already carry them.

    Validation: just validate-grouping passed (schema, terms, 4/4 snippets verified); just check-groupings shows all members SATISFIED on the process criterion and UNKNOWN on the karyotype OTHER leaf, which has no automatable predicate. All four references[].findings[].supporting_text values were separately confirmed as exact substrings of their reference caches.

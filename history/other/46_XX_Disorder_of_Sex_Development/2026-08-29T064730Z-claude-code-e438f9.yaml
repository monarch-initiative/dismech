  details: |
    Addressed all five non-blocking suggestions from the automated review on PR 10021.

    1. Aromatase Deficiency member: added a second evidence item quoting the sentence in PMID:31533357 that actually carries the member's distinguishing claims - that the fetal androgen excess is placental (unaromatized DHEA-S from the fetal adrenal is converted to testosterone) and that the mother virilizes during the pregnancy. The original snippet only distinguished tissue of origin.

    2. evidence_source consistency: the CAH member's PMID:31533357 item was graded HUMAN_CLINICAL while the aromatase item from the same narrative review was OTHER. Both are now OTHER, matching the other review citations in the file. evidence_source classifies the cited publication, and this publication is a narrative review throughout.

    3. 46,XX Gonadal Dysgenesis member: added GO:0008585 female gonad development alongside GO:0001541 ovarian follicle development. The member description leads with failure of ovarian development, which sits a level above follicle development; both readings are now represented rather than one replacing the other.

    4. Added PMID:20688619 to references[] with the three-category partition of 46,XX DSD and the nomenclature substitution it records. It independently corroborates the classification the membership follows and is the second source for the Chicago-consensus naming used in the description. PMID:16624884 (the 2006 consensus itself) is deliberately still uncited: its cache is title-only, so it carries no quotable finding and citing it would trip check-title-snippets.

    5. CAH member: added a clause naming CYP11B1, HSD3B2, and POR as further routes inside MONDO:0018479, so the member's breadth is visible rather than implied by the 21-hydroxylase description alone.

    Validation after the edits: just validate-grouping passed with 5/5 snippets verified; all five references[].findings[].supporting_text values re-confirmed as exact substrings; just check-groupings unchanged (all members SATISFIED on the process criterion); just check-folded-hyphens clean.

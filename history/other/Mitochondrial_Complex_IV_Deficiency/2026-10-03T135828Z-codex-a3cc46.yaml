  summary: Qualify COX4I2 membership without asserting patient assembly failure
  details: |
    The COX4I2 full-text review found normal patient fibroblast COX activity and no direct measurement of assembly failure in affected tissues. Removed the false non-neurological-triad claim and qualified acinar expression and tissue bioenergetics. Replaced an unconditional module-conformance criterion with an explicit union of module-conforming disorders and the COX4I2-associated disorder, retaining existing disease membership while avoiding a false necessary-condition assertion. Revised blanket grouping prose about lactic acidosis and direct holoenzyme destabilization. This is a correction to this grouping’s evidence and criteria, not a schema or project-scope change. Follows design-decisions sections 3 and 6: module conformance is a consistency assertion and evidence types remain distinct.

  summary: 'Edit: add COA6-Related Fatal Infantile Cardioencephalomyopathy as a grouping
    member'
  details: |
    Added COA6-Related Fatal Infantile Cardioencephalomyopathy as a DISEASE member of the Mitochondrial Complex IV Deficiency grouping, with a differentiating_mechanisms entry and the COA6 gene binding (hgnc:18025, verified in both directions).

    Why this is part of the curation rather than scope creep: the grouping is an explicit curated union of the Complex IV deficiency disorders, and it already lists the sibling members COA5-Related Fatal Infantile Cardioencephalomyopathy, COX16-Related COX Deficiency and COX4I2-Related Pancreatic Insufficiency-Anemia-Hyperostosis Syndrome. Creating a new sibling disease entry and leaving it out would make the union incomplete for exactly the disease that was just added. The grouping's own prose already referenced COA6 - in the COX16 member's description, as one of the copper-centre metallochaperones COX16 interacts with - so the concept was present in the grouping before the disease entry existed.

    The differentiating mechanism states what separates COA6 from the other members of the copper-delivery arm: COA6 is not a copper carrier but a thiol-disulfide oxidoreductase that reduces the copper-coordinating disulfides of SCO1, SCO2 and COX2, so its lesion is a failure to prepare the copper-accepting cysteines rather than a failure to deliver copper. That distinguishes it from the SCO1/SCO2/COX16/COX17 metallochaperone members and from the earlier assembly block in COA5. It also records the two features distinctive to this member - copper supplementation as the only documented mechanism-directed rescue in this arm, and the contested isolated-versus-combined enzyme phenotype - and follows the COA5 member's precedent in noting that no central nervous system lesion is documented despite the cardioencephalomyopathy in the disease name.

    VALIDATION: just validate-grouping passed. just check-groupings evaluates the new member as SATISFIED against the grouping's NECESSARY_AND_SUFFICIENT criteria, which is also an independent check that the disorder entry's conforms_to links to complex_iv_assembly_deficiency resolve correctly. No other member rows were touched.

    Filed under kind 'other' because the history tooling has no grouping kind; target.path names the grouping file.

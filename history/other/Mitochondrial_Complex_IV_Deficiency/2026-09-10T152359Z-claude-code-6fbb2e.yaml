  summary: 'Edit: correct a false distinctiveness claim in the COA6 member row'
  details: |
    Corrects the COA6 member row added minutes earlier in the same session.

    The row claimed copper supplementation gave COA6 'the only mechanism-directed therapeutic lead in this arm'. A pre-PR red-team review found this false, and it is contradicted twice inside this repository - once inside this very file. The COX5A member row already states that complex IV deficiency 'is partially rescued by copper supplementation in patient fibroblasts', and the SCO2 member's disorder entry carries a full Copper-Histidine Supplementation treatment reporting complete rescue in patient myoblasts plus a single-patient report of hypertrophic cardiomyopathy reverting on subcutaneous copper-histidine. SCO2's lead is strictly stronger than COA6's, having actually been given to a patient.

    Rewritten to place COA6 alongside the SCO2 and COX5A leads rather than above them, and to state the real distinction: unlike SCO2, no copper has been administered to a COA6 patient.

    Also softened the row's copper-carrier framing in step with the disorder entry: COA6's best-supported role is as a thiol-disulfide oxidoreductase rather than a copper carrier, but the flat negative was wrong, since COA6 binds copper in vitro and a metallochaperone role has also been proposed.

    Worth recording as a pattern rather than a one-off: a claim of distinctiveness is a claim about every sibling, and this one was written without checking the siblings. The information needed to falsify it was in the same file being edited.

    VALIDATION: just validate-grouping passes. just check-groupings still evaluates the COA6 member as SATISFIED. No other member rows touched.

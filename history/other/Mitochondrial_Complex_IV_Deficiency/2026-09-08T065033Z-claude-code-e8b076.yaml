  summary: Add COA5-Related Fatal Infantile Cardioencephalomyopathy as a member
  details: |
    Added COA5-Related Fatal Infantile Cardioencephalomyopathy (MONDO:0014667, CEMCOX3/MC4DN9, hgnc:33848) as a DISEASE member, together with the newly curated disorder entry, so grouping membership lands with the curation rather than in a later sweep.

    Membership rests on the grouping's single NECESSARY_AND_SUFFICIENT criterion, conformance to complex_iv_assembly_deficiency#Complex IV Biogenesis Failure. The new entry's first pathophysiology node declares exactly that conformance, and just check-groupings reports the member SATISFIED (24 members, all SATISFIED).

    The differentiating_mechanisms entry places the COA5 lesion at the transition between MTCO1 maturation and MTCO2 incorporation - one step earlier than the SCO1/SCO2/COX16/COX20 copper-delivery members and distinct from the heme a (COX10, COX15) and structural-subunit defects - and records that the whole reported disease is three patients in two Turkish families homozygous for one missense allele, with a cardiac-dominant neonatal phenotype and no documented CNS lesion despite the cardioencephalomyopathy in the disease name.

    The MONDO consistency note was updated from three exceptions to four: MONDO:0014667 is a child of MONDO:0015487 (a clinical-syndrome node), not of MONDO:0033885 (nuclear type), the same outside-the-subtree situation already recorded for SCO2-Related Fatal Infantile Cardioencephalomyopathy, COX15-Related COX Deficiency and COX4I2-Related Pancreatic Insufficiency-Anemia-Hyperostosis Syndrome. Note that MONDO's own synonym list for MONDO:0014667 nonetheless includes 'mitochondrial complex IV, deficiency, nuclear type 9', so the placement is a MONDO structural artefact rather than a disagreement about what the disease is.

    Validated with just validate-grouping (schema, terms, references all pass) and just check-groupings on the file. No other member rows were changed.

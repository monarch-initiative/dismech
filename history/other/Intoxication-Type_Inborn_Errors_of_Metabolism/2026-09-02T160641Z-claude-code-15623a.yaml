  summary: 'Edit: nest Citrullinemias as a GROUPING member'
  details: |
    Nested the Citrullinemias grouping as a `member_type: GROUPING` member of Intoxication-Type Inborn Errors of Metabolism, replacing the two direct rows it covers (Citrullinemia Type I, Citrin Deficiency). The per-disease differentiating mechanisms and gene bindings were folded into the GROUPING row's `differentiating_mechanisms` list so no curated text was lost, and `notes` records the change.

    Why: both citrullinemias are urea-cycle disorders that decompensate as hyperammonemic intoxication crises, both already conform to the metabolic_intoxication_decompensation module, and MONDO places citrullinemia (MONDO:0015991) under inborn errors of metabolism. The `just grouping-nesting-audit` report flagged the pair as an undeclared containment (every disease member of the child was a direct member here), and the grouping index rendered both as unrelated roots.

    Convention followed: as in Lysosomal_Storage_Disorders and Inborn_Errors_of_Immunity, a nested grouping replaces the direct rows it covers rather than duplicating them. Both diseases remain members: `evaluate_grouping` expands nested groupings and reports them as `(via Citrullinemias)`, both SATISFIED against the module criterion, and the parent page's coverage table shows them as `nested via` members rather than `not listed`.

    Not nested, deliberately: Carnitine Palmitoyltransferase Deficiencies (CPT1A deficiency is not a member here) and the other MONDO-descendant groupings the audit lists against this grouping's broadMatch term (glycogen storage diseases, porphyrias, LSDs), which are not intoxication-type disorders; a broadMatch parent term does not make its descendants members.

    Validation: linkml-validate (Grouping) clean; `just check-groupings --strict` exit 0 for this file.

  summary: Make the 2022 hallmarks deferral specific and cite the update
  details: |
    The collection's notes said the 2022 dimensions are excluded until each has a correctly scoped module, which is a policy rather than a finding, so a reader could not tell what was missing or whether an existing module would do. Checked all four against the module directory and recorded the specific blocker for each, with the 2022 paper added as two cited evidence items. Phenotypic plasticity has no module. Nonmutational epigenetic reprogramming is neither the aging epigenetic-drift module nor the neurodevelopmental chromatin-machinery module. Polymorphic microbiomes is not the aging gut-dysbiosis module, which is scoped to inflammaging. Senescent cells is the case worth recording: dismech has two senescence modules and neither fits, because the paper adds senescent cells as tumor-promoting constituents of the microenvironment, which is the deleterious SASP arm under the aging framework, while the cancer-scoped senescence module models the opposite protective arrest. Adding either would misstate the source, so the collection admits neither and the note says why. No membership rows changed. Validation: just validate-module-collection passed with all three snippets verified.

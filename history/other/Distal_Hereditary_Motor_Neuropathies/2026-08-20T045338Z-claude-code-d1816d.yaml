  summary: 'Review response: per-item evidence_source reclassification (PR #9048)'
  details: |
    Provenance record for the review-response edit made in commit 1a8b3af058 on PR #9048, which changed a KB entry without a matching history record.

    Review: https://github.com/monarch-initiative/dismech/pull/9048#issuecomment-5351418683

    Blocking finding (IMPORTANT), and it was correct: the entry as first committed carried a blanket "evidence_source: OTHER" on all 17 evidence items. CLAUDE.md classifies evidence_source by the type of evidence presented in the cited publication, not by the genre of the citing publication - a review reporting a human prevalence figure is still reporting human clinical evidence. The blanket value was introduced as an over-correction during pre-PR self-review: a red-team pass flagged that PMID:36445400 was tagged inconsistently across items, and the fix wrongly imposed uniformity instead of applying the per-item rule. It also put this entry at odds with its own sibling entries, which tag PMID:36445400 as HUMAN_CLINICAL seven times between them, and made it a repo-wide outlier among groupings carrying evidence.

    Final state after 1a8b3af058: 13 HUMAN_CLINICAL and 4 OTHER. HUMAN_CLINICAL covers the patient-level observations and human genetic findings - the clinical characterizations of the family, the dominant gene set, SORD, IGHMBP2/SMARD1, the TRPV4 phenotype spectrum, the 2.14/100,000 prevalence figure, the IGHMBP2 sensory-conduction-velocity and sural-nerve-biopsy finding, the about-32.5% diagnostic yield, and the more-than-60% genetically-uncharacterized figure. OTHER is retained where the quoted passage is not a patient observation: the PMID:22028385 classification of dHMN gene products by molecular function and the PMID:33210134 statement that the gene set converges on a bounded number of peripheral-nerve processes (both mechanistic syntheses drawing on in vitro and model work); the PMID:36445400 expert-opinion statement that the dHMN terminology may oversimplify pathophysiology; and the PMID:36445400 sentence beginning "Hereditary motor neuropathies (HMN) were first defined as", which reports a definitional convention rather than an observation made in patients. A now-stale explanation clause reading "Evidence source is OTHER because the citation is a review synthesizing clinical and molecular study types" was removed.

    Non-blocking suggestions also applied in that commit: grouping_rationale said "Three boundary decisions" while listing four; the Scapuloperoneal member's explanation no longer adopts the cited source's "HMN7" numeral, which conflicts with dismech's own assignment of dHMN7A to SLC5A7 and dHMN7B to DCTN1 in the dominant sibling entry; and stubs/Distal_Hereditary_Motor_Neuropathy.yaml was deleted, the stale-stub advisory CI raised once MONDO:0018894 became covered by this grouping.

    Correction to the PR description (not to the YAML): the stated rationale for choosing skos:exactMatch over skos:closeMatch rested on a false premise. For kb/groupings entries every mapping predicate counts toward MONDO coverage (src/dismech/stubs/model.py, _grouping_mondo_ids), unlike disease entries where only exact/narrow retire a concept, so closeMatch would also have retired MONDO:0018894 from the curation queue. exactMatch remains the right predicate on its own semantics - the grouping denotes the same concept as the MONDO class - but the coverage argument was wrong and is withdrawn.

    No snippet text was altered at any point in this review round; only evidence_source values and prose. Validation after the change: "just validate-grouping" passes (schema, terms, references) with "Snippets checked: 17/17 verified against cached references", and "just check-groupings" reports structure OK with all four members SATISFIED on both NECESSARY criteria blocks and no contradictions.

    Coverage gap surfaced during this round, affecting the repo rather than this entry: no CI workflow runs "just validate-groupings" or "just check-groupings". .github/workflows/main.yaml validates changed kb/disorders and kb/comorbidities files only, and logged "Skipping non-disorder file" for this entry; tests/test_data.py::test_valid_grouping_files covers Grouping schema conformance only. Ontology-term and reference/snippet validation for kb/groupings is therefore verified locally but not reproduced by CI.

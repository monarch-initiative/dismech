  summary: 'Create: Distal Hereditary Motor Neuropathies grouping (MONDO:0018894)'
  details: |
    Curated MONDO:0018894 (distal hereditary motor neuropathy) for issue #8942 as a kb/groupings Grouping rather than a kb/disorders Disease entry.

    Scoping decision. MONDO:0018894 is a parent term with exactly three MONDO children; two of them are already curated dismech Disease entries bound to their own MONDO ids (Distal_Hereditary_Motor_Neuronopathy_Autosomal_Dominant / MONDO:0015362 and Distal_Hereditary_Motor_Neuronopathy_Autosomal_Recessive / MONDO:0015363). Writing a broad Disease entry with has_subtypes would have duplicated the pathophysiology, phenotype, genetic, and treatment content of those two entries without adding mechanism. Both existing entries also already declare conforms_to against kb/modules/peripheral_axonal_degeneration.yaml at its "Distal Axonal Degeneration and Demyelination" node, so the conserved distal motor axonopathy is modeled once, in the module. What was genuinely missing was the nosology: which entries constitute the dHMN family, why they are grouped, where the boundary against CMT2 and proximal SMN1-SMA falls, and what differentiates each member. That is what this Grouping records.

    Members (4): the AD and AR parent entries, plus two entries inside the clinical dHMN spectrum - Spinal_Muscular_Atrophy_with_Respiratory_Distress_Type_1 (MONDO:0011436, a MONDO descendant of the recessive child; the severe infantile end of the same IGHMBP2 allelic continuum) and Scapuloperoneal_Spinal_Muscular_Atrophy (MONDO:0008408, TRPV4; included on allelic/clinical continuity with dHMN type 7 even though MONDO places it under spinal muscular atrophy rather than under MONDO:0018894, which is recorded explicitly in the mapping consistency notes).

    Criteria: two NECESSARY blocks (lower-motor-neuron / distal motor axon degeneration; distal weakness or amyotrophy). NECESSARY rather than NECESSARY_AND_SUFFICIENT because the same picture arises in CMT2, distal myopathy, and acquired lower-motor-neuron syndromes. No negated sensory leaf is curated: minor sensory abnormality is common in genetically confirmed dHMN and abnormal sensory conduction is the rule in the IGHMBP2 forms, so a NOT leaf would report correctly curated members as contradictions. This reasoning is recorded in an INTERPRETATION discussion with cited evidence rather than left implicit.

    Discussions (4): CONTROVERSY on whether the dHMN label tracks a biological substrate at all (PMID:36445400 states the objection directly); INTERPRETATION on the non-absolute pure-motor boundary; KNOWLEDGE_GAP on missing heritability (about 32.5 percent diagnostic yield) with a proposed genome/long-read experiment; CURATION_TODO recording that SMARD1 and Scapuloperoneal SMA should declare module conformance before a CONFORMS_TO_MODULE criterion can be added here.

    Deep research: no new DR run was generated. "just research-disorder" resolves only existing kb/disorders names, so it cannot be pointed at a grouping concept; the two relevant falcon reports for this spectrum (research/Distal_Hereditary_Motor_Neuronopathy_Autosomal_Dominant-deep-research-falcon.md and the Autosomal_Recessive counterpart) already exist in the repo and were generated for the children. Neither carries a Reference Validation section (both predate deep-research-client 0.2.9). All evidence here was instead sourced from primary reviews located via the PubMed E-utilities API and independently verified against the cached abstracts/full text: PMID:22028385 (Rossor/Reilly, JNNP 2012), PMID:33210134 (Beijer and Baets, Brain 2020), PMID:38702287 (Tazir and Nouioua 2024), PMID:36445400 (Zambon et al. 2022). NEC preflight was not run because "just preflight-dr" takes a DR report as input and no report was generated; disease identity was instead confirmed manually against the MONDO record (label, exact synonyms dHMN / dSMA / distal spinal muscular atrophy, Orphanet:53739, and the three-child subclass set) queried directly from the local mondo.db.

    Validation: "just validate-grouping" passed (schema, terms, references) with "Snippets checked: 17/17 verified against cached references". "just check-groupings" reports structure OK and all four members SATISFIED on both NECESSARY criteria blocks, with no contradictions. "just check-duplicate-keys" OK. "just check-cache-order" and "just check-term-cache-integrity" OK. "just validate-history" No issues found.

    Self-review. A red-team pass over the draft (dismech-pr-review) was run before opening the PR and its findings were applied: the MONDO mapping_predicate was changed from skos:closeMatch to skos:exactMatch (the justification already claimed conceptual equivalence, and closeMatch would have left MONDO:0018894 in the curation queue); an explanation that described a "diverse functions" quote as reporting "functional convergence" was reworded and backed with two better-matched quotes; the definitional clause was softened from strictly length-dependent to usually length-dependent, with a fourth recorded boundary decision covering the scapuloperoneal exception; HMNR1 was disambiguated between the AR member and SMARD1; the TRPV4 form was renamed from the incorrect "dHMN type 7" (this file assigns HMN7 to SLC5A7/DCTN1) to "TRPV4-related distal HMN"; evidence_source for PMID:36445400 was made uniformly OTHER; three fragment snippets were extended to full sentences; the TRPV4 mechanism claim was softened to match the sibling entry; and, most substantively, the notes were corrected - MONDO:0010338 is NOT uncurated, it is already curated as a has_subtypes subtype_term ("ATP7A-related distal motor neuropathy") on Menkes_Disease, so the entry now says that instead of claiming the X-linked branch is unrepresented. An orphaned references_cache/PMID_38915017.md fetched during research but cited nowhere was deleted rather than committed.

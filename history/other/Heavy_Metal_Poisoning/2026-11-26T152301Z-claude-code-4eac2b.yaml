  summary: 'Create: Heavy Metal Poisoning grouping (MONDO:0023305)'
  details: |
    Curate MONDO:0023305 as a Grouping (not a Disease): a union of distinct metal poisonings with different mechanisms. Members are the clinical-toxicology heavy metals already curated: Lead, Arsenic, Mercury, Cadmium, Thallium, each with a differentiating-mechanism snippet reused from the member entry's own validated evidence. grouping_basis CLINICAL_CONVENTION. Mapped to MONDO:0023305 with skos:closeMatch, not exactMatch/narrowMatch: in the Nov 2026 OLS hierarchy only thallium (and iron, cesium) descend from the heavy-metal node, while lead/mercury/cadmium sit directly under MONDO:0029000 poisoning and arsenic has no MONDO term, so a subsuming predicate would be contradicted. consistency block records the MONDO classification gap (candidate upstream review). Iron and cesium excluded with recorded rationale (iron oxidative/deferoxamine syndrome not in the clinical heavy-metals class; cesium an alkali metal, K-channel/radiological toxicity). Membership criterion uses the canonical Tchounwou priority-metals review (PMID:22945569). Validated with validate-grouping-batch, check-groupings --strict --offline, and grouping-mondo-consistency --strict (no predicate contradicted).

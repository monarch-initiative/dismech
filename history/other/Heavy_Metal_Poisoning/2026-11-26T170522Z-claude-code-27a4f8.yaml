  summary: 'Review round 1: Heavy Metal Poisoning grouping'
  details: |
    Addressed ai4c-reviewer CHANGES_REQUESTED. (1) Included Iron Poisoning (MONDO:0800385) and Manganism (MONDO:0017638) as members, resolving the self-contradictory iron-exclusion reasoning (iron IS deferoxamine-chelatable; thallium, already a member, is treated by Prussian blue ion exchange not a thiol chelator) and the unmentioned curated manganese poisoning. Both carry differentiating_mechanisms with reused verified snippets (PMID:3784842 HUMAN_CLINICAL + PMID:6421970 IN_VITRO for iron; PMID:40278159 HUMAN_CLINICAL/REVIEW_SYNTHESIS for manganese). (2) Reframed grouping_rationale and notes to drop 'chelatable metal toxicant' as a defining theme and state the clinical-convention basis honestly; only cesium (alkali metal) remains excluded, as a deliberate MONDO divergence. (3) Tightened the mercury differentiating description to organic-methylmercury CNS toxicity and added quote_role BACKGROUND to PMID:27538940. (4) Folded a thallium-convention note into membership criterion 1. (5) Updated mapping_justification and consistency note to the correct 2/7-descend count (thallium, iron). Kept lead PMID:3442386 as HUMAN_CLINICAL to preserve cross-file snippet-grading consistency with Lead_Poisoning.yaml. All gates green: validate-grouping-batch, grouping-mondo-consistency --strict (no contradiction), check-snippet-grading (no new divergences), count-verified-snippets 10/10.

  summary: 'Create grouping: Retinitis Pigmentosa'
  details: |
    De-novo Grouping record uniting the 19 dismech entries in which retinitis pigmentosa (rod-first photoreceptor degeneration) is the defining presentation: 15 gene-specific DISEASE members (RHO, PDE6A, RP1, RPGR, RP2, EYS, CFAP418, BBSome-related RP, PRPF31, MERTK, RPE65, RLBP1, CERKL, FLVCR1/PCARP, RCBTB1) and 4 SUBTYPE members naming their retina-restricted parents (PRPH2/RP7, CRB1/RP12, Stargardt/RP19, BEST1-RP). One NECESSARY criterion: OR over photoreceptor_degeneration conformance, HP:0000510 rod-cone dystrophy, and the retinoid visual-cycle route; the two non-module arms each admit one member (BEST1, Stargardt) and are justified in the criterion prose per the Mucopolysaccharidoses pattern. Syndromic RP (Usher, BBS, Alstrom, Senior-Loken, PHARC, Refsum, NARP, Kearns-Sayre) deliberately excluded; IFT140/RP80 excluded on the GroupingMember subtype-granularity limitation (IL17 precedent); exactMatch mapping to MONDO:0019200 with consistency recorded INCONSISTENT because gene-based MONDO retinopathy classes are not RP descendants. Validated: just validate-grouping, check-groupings --strict (all 19 SATISFIED, structure OK), validate-terms, check-duplicate-keys, grouping-nesting-audit (standalone, no undeclared containment).

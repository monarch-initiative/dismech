  summary: 'Create grouping: Retinitis Pigmentosa'
  details: |
    De-novo Grouping record uniting the 21 dismech entries in which retinitis pigmentosa (rod-first photoreceptor degeneration) is the defining presentation: 17 gene-specific DISEASE members (RHO, PDE6A, CNGB1, RP1, RPGR, RP2, ARL2BP/RP66, EYS, CFAP418, BBSome-related RP, PRPF31, MERTK, RPE65, RLBP1, CERKL, FLVCR1/PCARP, RCBTB1) and 4 SUBTYPE members naming their retina-restricted parents (PRPH2/RP7, CRB1/RP12, Stargardt/RP19, BEST1-RP). One NECESSARY criterion: OR over photoreceptor_degeneration conformance, HP:0000510 rod-cone dystrophy, and the retinoid visual-cycle route; the non-photoreceptor_degeneration arms admit three members (BEST1 and ARL2BP via the phenotype arm, Stargardt via the retinoid module arm) and are justified in the criterion prose per the Mucopolysaccharidoses pattern. Syndromic RP (Usher, BBS, Alstrom, Senior-Loken, PHARC, Refsum, NARP, Kearns-Sayre) deliberately excluded; IFT140/RP80 excluded on the GroupingMember subtype-granularity limitation (IL17 precedent); exactMatch mapping to MONDO:0019200 with consistency recorded INCONSISTENT because gene-based MONDO retinopathy classes are not RP descendants. CNGB1-related retinopathy (RP45) and Retinitis Pigmentosa With or Without Situs Inversus (ARL2BP, RP66) added as DISEASE members after automated review flagged their omission; taurine transporter deficiency named in the exclusion notes as syndromic. Validated: just validate-grouping, check-groupings --strict (all 21 SATISFIED, structure OK), validate-terms, check-duplicate-keys, grouping-nesting-audit (standalone, no undeclared containment).

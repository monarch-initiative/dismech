  summary: Create IL17_Immunity_Defects grouping (#7644)
  details: |
    New kb/groupings/ union grouping requested by #7644 as the sanctioned home for the mechanism-defined IL-17-circuit-loss union that kb/disorders/Chronic_Mucocutaneous_Candidiasis.yaml's has_subtypes previously asserted as a MONDO subsumption. Three members today (Chronic Mucocutaneous Candidiasis, Autoimmune Polyendocrine Syndrome Type 1, Autosomal Dominant Hyper-IgE Syndrome) - the only IL-17-circuit-loss entities with their own standalone Disease entry. A single NECESSARY, description-only OTHER-predicate criterion is used deliberately (no SUFFICIENT block, no bare GO-term leaf) per the reviewer comment on #7644: a bare HAS_BIOLOGICAL_PROCESS leaf on an IL-17 GO term would evaluate NOT_SATISFIED for every current member and, if made SUFFICIENT, would surface the ~64 IL-17-EXCESS entries (psoriasis, spondyloarthritis, etc.) as false candidates since the schema criteria tree cannot express direction. Not nested under Inborn_Errors_of_Immunity and no il17_mucosal_barrier_immunity module factored yet - both deferred to follow-up per the grouping's own notes. Validated with just validate-grouping and just check-groupings (structure OK, criteria UNKNOWN as expected for an unevaluated OTHER predicate, matching the parent Inborn_Errors_of_Immunity grouping's own pattern).

  summary: 'Create: Childhood Kidney Tumors grouping'
  details: >-
    A new Grouping over the renal tumours of childhood, four members and no new disease entry.
    Members are Wilms Tumor, Clear Cell Sarcoma of Kidney and Congenital Mesoblastic Nephroma as
    DISEASE members, and the RTK subtype of Rhabdoid Tumor as a SUBTYPE member. The grouping records
    a clinical convention, not a mechanism: the four drivers are unrelated (WT1/CTNNB1/WTX with
    nephrogenic rests; a C-terminal BCOR internal tandem duplication; biallelic SMARCB1 loss; an
    ETV6-NTRK3 fusion), and grouping_basis is CLINICAL_CONVENTION for that reason.


    Rhabdoid tumour enters as a subtype rather than a disease member because dismech curates it as
    one multisite entry. The imaging review cited says the anatomic site dictates nomenclature while
    SMARCB1 loss underlies the whole spectrum, so the renal form is a named part of a spectrum, not
    a separate disease; promoting it to its own entry purely to be listed here would duplicate the
    shared chromatin-remodelling pathophysiology. Kidney Sarcoma is deliberately excluded even though MONDO:0002930 is the ontology parent of two
    members' terms. The dismech entry is not that class: it frames the category as adult renal
    malignancy and explicitly excludes nephroblastoma, clear cell sarcoma of the kidney and rhabdoid
    tumour of the kidney as having their own entries, so it covers neither member. The exclusion
    therefore rests on the criterion, that its characteristic presentation is adult, and the same
    test admits Wilms Tumor whole even though that entry carries Childhood and Adult age_group
    subtypes, because its characteristic presentation is childhood and its own Adult row calls adult
    Wilms rare.


    The membership criterion carries no logic tree, which is a decision rather than an omission. The
    four members share no structured field that would be a faithful proxy: parents is free text and
    reads 'kidney neoplasm' on two, 'kidney sarcoma' on the third and nothing on the multisite
    rhabdoid entry; icdo_morphology splits them between Embryonal Neoplasm and Sarcoma; and
    HP:0009726 Renal neoplasm is carried by only two of the four. A HAS_PHENOTYPE criterion over
    HP:0009726 would have reported Wilms Tumor and Rhabdoid Tumor as contradictions, and the fix
    available for that would have been to add a redundant Nephroblastoma phenotype row to the Wilms
    Tumor entry, an annotation written to satisfy a gate rather than to say anything. The criterion
    is stated in prose at the conceptual level and the reason is recorded in the criterion's own
    description.


    The MONDO mapping is a closeMatch, and the reason is a finding worth reporting upstream. Only
    one of the four members, congenital mesoblastic nephroma, is inside the is_a closure of
    MONDO:0002730 childhood kidney neoplasm. Clear cell sarcoma of the kidney and rhabdoid tumour of
    the kidney reach kidney cancer only through MONDO:0002930 kidney sarcoma, which carries no age
    axis. And MONDO:0006058 Wilms tumor has no kidney ancestor at all, its is_a chain running
    through embryonal neoplasm, while a separate term, MONDO:0024676 childhood kidney Wilms tumor,
    does sit under the childhood kidney class. Checked against the local MONDO build on 13 November
    2026. Neither subsumption direction holds, so exactMatch and narrowMatch would both be false,
    and closeMatch also stops the grouping page from taking the MONDO subtree as its coverage scope.


    Eight evidence items across five references, three of them cited twice, all already committed in
    references_cache and all abstract-sourced. No reference was fetched for this change and no cache file was added. The gene
    bindings (hgnc:20893 BCOR, hgnc:11103 SMARCB1, hgnc:8033 NTRK3) were each checked in both
    directions against cache/hgnc/terms.csv and against how the member entries bind the same genes,
    because a gene binding only has to be self-consistent to pass term validation.


    The grouping is incomplete by construction and says so: childhood renal cell carcinoma,
    nephroblastomatosis, cystic partially differentiated nephroblastoma and childhood renal
    angiomyolipoma are childhood renal tumours with no dismech entry to list. Those are curation
    gaps, not exclusions.


    Validation: just validate-grouping (schema, terms, 8 snippets, 8 titles, 0 issues) and just
    check-groupings --strict --offline (structure OK) both pass.


    Two adversarial verifiers were run before pushing, split by axis. The evidence verifier returned
    thirteen findings and all are applied. Three mattered. The Kidney Sarcoma exclusion rested on a
    false sentence, that the entry covers clear cell sarcoma of the kidney: it explicitly excludes
    it, and the exclusion has been rebuilt on the criterion instead. The same exclusion rule, as
    first written, would have excluded Wilms Tumor too, which carries Childhood and Adult age_group
    subtypes; the rule now turns on characteristic presentation, which admits one and not the other.
    And the NWTSG enrolment quote was graded DIRECT against a definitional criterion it only reaches
    through an inference step, so it is now INDIRECT. The rest were over-reads corrected in place:
    an explanation claiming nephroblastoma's own cytokeratin status from a sentence about clear cell
    sarcoma only, an explanation attributing the classical-variant half of the mesoblastic nephroma
    split to a sentence that does not state it (the snippet now carries both sentences), a dropped
    SMARCA4, an unsourced 'biallelic', a cooperative-group claim resting on a title rather than the
    quoted sentence, and a gap list that missed angiomyolipoma under Perivascular Epithelioid Cell
    Neoplasm and paediatric renal rhabdomyosarcoma under Kidney Sarcoma.

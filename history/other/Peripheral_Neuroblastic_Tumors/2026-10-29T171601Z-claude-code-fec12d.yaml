  summary: Create the Peripheral Neuroblastic Tumors grouping
  details: |
    New grouping kb/groupings/Peripheral_Neuroblastic_Tumors.yaml with three DISEASE members, the Neuroblastoma, Ganglioneuroblastoma and Ganglioneuroma entries: the categories of the International Neuroblastoma Pathology Classification (INPC). grouping_basis CLINICAL_CONVENTION. Part of the neuroblastoma expansion series (issue 15822); it follows the Ganglioneuroma entry (PR 15862).

    MONDO mapping: skos:narrowMatch to MONDO:0006316 neuroblastic tumor. Its three direct subclasses are exactly the members' disease terms (OLS, 29 October 2026), but MONDO defines the class as nervous system tumours with neuronal differentiation, without restriction to peripheral tumours, and its subtree also holds olfactory, cerebral, retinal and CNS FOXR2-activated neuroblastoma and cutaneous ganglioneuroma, none of which is a member. The notes record these terms and an OLS search that found no MONDO class for composite pheochromocytoma; both were re-run before commit with the same results.

    One NECESSARY criterion, HAS_CLASSIFICATION on the members' parents tag 'neuroblastic tumor', stated as a proxy for the INPC category; all three members satisfy it. PHOX2B immunohistochemistry series are cited as evidence on the members, not used as a criterion, because the marker also appears in some paragangliomas and not every tumour was positive. Each member's differentiating mechanism states its INPC-defining features. All references were already cached; sentences that member entries already quote keep their grading. Two validator-written cache rows for MONDO:0006316.

    Validation: just validate-grouping, validate-grouping-batch, check-groupings, count-verified-snippets --strict, check-snippet-grading, the whole-repo offline gates, check-cache-order and check-term-cache-integrity passed. grouping-mondo-consistency reports this grouping consistent (3 of 3 members inside the mapped class); the recipe's --strict exit is non-zero only because of findings in other, existing groupings.

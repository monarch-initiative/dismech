  summary: 'Create grouping: Acromesomelic Dysplasias'
  details: |
    New grouping at kb/groupings/Acromesomelic_Dysplasias.yaml, resolving the stubs/Acromesomelic_Dysplasia.yaml queue entry (MONDO:0019696) as a GROUPING rather than a Disease. Membership is stated as NECESSARY_AND_SUFFICIENT on classifications.isds_skeletal_category = acromesomelic_dysplasias, since the grouping is a transcription of the ISDS committee's own placement; all five members evaluate SATISFIED. grouping_basis is SHARED_PHENOTYPE plus CLINICAL_CONVENTION rather than SHARED_MECHANISM, because the group spans two signalling pathways. A second criteria block states the radiographic definition in prose with no logic, deliberately: the acromesomelic phenotype is annotated with different HP classes across the two halves of the group and is not invariable, so making it a necessary condition would contradict a curated member.

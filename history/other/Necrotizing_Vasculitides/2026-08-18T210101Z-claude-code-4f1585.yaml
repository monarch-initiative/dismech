  summary: 'Create: Necrotizing Vasculitides grouping (MONDO:0800113)'
  details: |
    Curated MONDO:0800113 (necrotizing vasculitis) for issue #8754.

    ROUTE DECISION - Grouping, not Disease. The MONDO definition is explicitly a class over other diseases: "A type of vasculitis that is comprised of vasculitides that present with necrosis." Its asserted is_a descendants are themselves disease entries (GPA, MPA, EGPA, AAV, IgA vasculitis, disseminated visceral giant cell angiitis). A Disease entry would have had to invent a single pathophysiology graph for a set of disorders whose triggers are mutually exclusive - ANCA-driven neutrophil activation, immune-complex deposition, hepatitis-B-associated medium-artery disease, seropositive rheumatoid arthritis - which is precisely the blended-umbrella-graph outcome the Disease Groupings section of CLAUDE.md warns against (compare Diabetes_Mellitus: Grouping + module + per-type entries, not a blended umbrella graph). The falcon deep-research report reached the same conclusion independently and unprompted: it recommends modelling necrotizing vasculitis "as a histopathologic disease-pattern/umbrella concept, not as one etiologically uniform syndrome" and storing epidemiology, genetics, phenotype frequencies, prognosis and treatment "on the specific child diagnosis whenever possible".

    GROUPING SHAPE. grouping_basis is SHARED_PHENOTYPE plus SHARED_MECHANISM: the union is anchored on a histopathologic lesion (fibrinoid necrosis of the inflamed vessel wall) and on the effector step that produces it (leukocytes that have entered the wall degranulating there), not on aetiology. The rationale records both why the members belong together and why they stay eight separate Disease entries.

    Two NECESSARY criteria blocks. Block 0 carries machine-checkable logic - a single HAS_PHENOTYPE leaf on HP:6000253 Necrotizing vasculitis - with two evidence items. Block 1 is description-only, deliberately: it states the effector-mechanism requirement, and encoding it as a HAS_BIOLOGICAL_PROCESS leaf would assert a machine-checkable GO agreement that the member entries do not carry. A block without logic is skipped by evaluate_grouping, so this costs nothing and claims nothing.

    NOT stated as NECESSARY_AND_SUFFICIENT, and the reason is recorded in the rationale: the necrotizing pattern appears in a minority of biopsies in vasculitides whose dominant histology is something else (primary CNS vasculitis is granulomatous or lymphocytic in most series), and focal fibrinoid necrosis also occurs in malignant hypertension and thrombotic microangiopathy, neither of which is a vasculitis. Presence of the lesion in some patients is not sufficient for membership.

    MEMBERS (8): Granulomatosis with Polyangiitis, Microscopic Polyangiitis, Eosinophilic granulomatosis with polyangiitis, Primary Polyarteritis Nodosa, Rheumatoid Vasculitis, Cryoglobulinemic Vasculitis, IgA Vasculitis, Allergic Cutaneous Vasculitis. Each carries differentiating_mechanisms prose naming what separates it from its siblings.

    DELIBERATE EXCLUSIONS, recorded in notes with reasons: CNS Vasculitis (necrotizing in a minority - 5/10 in the Mayo spinal-cord cohort already curated on that entry - against granulomatous/lymphocytic dominance), Giant Cell Arteritis and Takayasu Arteritis (granulomatous panarteritis, not fibrinoid necrosis), Kawasaki Disease (necrotizing arteritis described in the acute phase but not classified as a necrotizing vasculitis by Chapel Hill, and the histology is not yet curated on that entry), Behcet Disease, Postinfectious Vasculitis and Livedoid Vasculopathy (the last is a thrombotic vasculopathy, not a vasculitis at all). Deficiency of Adenosine Deaminase 2 is a monogenic PAN-like mimic and is left as a candidate rather than asserted.

    MONDO MAPPING. skos:closeMatch to MONDO:0800113, not exactMatch, with an INCONSISTENT consistency block. Four of the eight members fall outside MONDO's asserted is_a subtree - primary polyarteritis nodosa, rheumatoid vasculitis, cryoglobulinaemic vasculitis and allergic cutaneous vasculitis - even though the standard definition of each names necrotizing or fibrinoid-necrotic injury. PAN is the most striking omission, since the 2012 Chapel Hill definition of PAN is "necrotizing arteritis of medium or small arteries". Conversely MONDO:0015492 (ANCA-associated vasculitis) is an intermediate grouping term with no dismech Disease entry, and MONDO:0800125 (disseminated visceral giant cell angiitis) has no dismech entry at all, so neither is listed as a member. Recorded as an upstream MONDO subtree-coverage gap rather than a scope difference.

    EVIDENCE. PMID:23045170 (the 2012 Chapel Hill nomenclature) was fetched and deliberately NOT cited: PubMed holds no abstract for it, so there is no quotable text, and quoting its title would be a title-snippet. Per CLAUDE.md the underlying studies are cited instead - PMID:27536680 (Xiao et al., pathogenesis of ANCA-associated vasculitis) for the ANCA arm and for the effector mechanism, and PMID:33713282 (Fraticelli et al., diagnosis and management of leukocytoclastic vasculitis) for the immune-complex arm.

    VALIDATION ACTUALLY RUN: just validate-grouping (schema + terms + references; PASS, "Snippets checked: 3/3 verified against cached references"); just check-groupings (structure OK, all 8 members SATISFIED under criteria 0); just check-duplicate-keys over the 9 changed YAML files (OK); just check-title-snippets (OK, no new title-quoting snippets).

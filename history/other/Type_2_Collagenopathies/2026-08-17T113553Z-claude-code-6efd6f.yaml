  summary: 'Create grouping: Type 2 Collagenopathies COL2A1 spectrum'
  details: |
    Created kb/groupings/Type_2_Collagenopathies.yaml as a Grouping over the six existing COL2A1-related Disease entries: Achondrogenesis Type II, Hypochondrogenesis, Spondyloepiphyseal Dysplasia Congenita, Kniest Dysplasia, Spondyloepimetaphyseal Dysplasia Strudwick Type, and Stickler Syndrome Type 1. grouping_basis SHARED_GENE_FAMILY plus SHARED_PATHWAY; one NECESSARY HAS_GENE COL2A1 hgnc:2200 criterion; per-member differentiating_mechanisms along the severity continuum from lethal achondrogenesis II to mild ocular-predominant Stickler 1, and by variant class: dominant-negative Gly-X-Y substitutions vs Kniest in-frame exon-skipping deletions vs Stickler haploinsufficiency. Mapped MONDO:0022800 with skos:closeMatch. Borderline lump-vs-split judgment per issue #8727: this single-gene allelic series could be a has_subtypes Disease, but members already exist as separate entries so a Grouping avoids duplication; flagged for reviewer confirmation in the PR. Validated with validate-grouping, check-groupings all six members SATISFIED, and validate-terms.

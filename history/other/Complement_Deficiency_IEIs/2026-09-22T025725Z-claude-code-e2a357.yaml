  summary: Add Ficolin 3 Deficiency as the lectin-pathway member; widen criterion
    to admit recognition molecules
  details: |
    Follow-through on #11920: Ficolin_3_Deficiency was curated in #11885 and
    deliberately left unlisted there to keep that diff to a single disease.

    Membership. Added `Ficolin 3 Deficiency` as a `member_type: DISEASE` row with
    a `differentiating_mechanisms` entry bound to FCN3 (hgnc:3625), placed
    alphabetically between the C2 and Hereditary Angioedema rows to match the
    existing ordering. Ran the member-set query the grouping's own notes
    prescribe -- `rg -l "classification_value: complement deficiency"
    kb/disorders/` -- before and after: it returns exactly four files, so this
    addition is the only outstanding drift and the list and the classifications
    now agree.

    Membership criterion. The issue asked that the criteria be checked rather
    than assumed to admit the member, and they did not, as written. The
    NECESSARY criterion's `logic` is a `HAS_CLASSIFICATION` leaf on
    `iuis_category: complement deficiency`, which the entry carries, so the
    evaluator reports SATISFIED. But the human-readable `description` said
    "deficiency of a complement component or complement regulatory protein", and
    ficolin-3 is neither: it is a recognition molecule that binds acetylated
    ligands and recruits the MASPs, sitting upstream of the C4/C2 cleavage step.
    Widened the description to "component, a complement pathway recognition
    molecule, or a complement regulatory protein", with the reasoning recorded on
    the criterion itself. Widening rather than noting an exception, per the
    curate-grouping skill's rule against encoding an acknowledged exception to a
    necessary condition -- and because the same gap applies to the uncurated MBL,
    MASP2 and C1q rows, so it was a defect in the criterion, not a special case.
    The `logic` leaf is unchanged.

    The judgement the issue flagged. The issue noted that a grouping organised
    around "pathway position predicts phenotype" has to say something about a
    member whose phenotype is contested, and asked for a decision rather than a
    default. Recorded the position in a new discussion,
    `complement_table8_lectin_arm_qualifies_the_claim`: the claim is bounded, not
    falsified. Ficolin-3 is one of several redundant recognition molecules (MBL
    and ficolin-2 initiate the same pathway), so its loss removes one route into
    the lectin pathway rather than the pathway itself; and both candidate
    readings of its phenotype -- impaired opsonophagocytosis, defective apoptotic
    and immune-complex clearance -- converge on cascade positions already
    represented by the C2 member, so position cannot adjudicate between them.
    The claim therefore holds at the granularity of the cascade arm rather than
    the individual protein, and weakens where an arm has redundant inputs. The
    discussion states the check this predicts: factor B and factor D are
    non-redundant components and should behave like C2 and the terminal
    components, whereas properdin is a stabiliser and may qualify the claim the
    same way, in which case redundancy and cascade position are two axes and the
    rationale should say so. No `attaches_to` anchor, because `members#` is not a
    resolvable prefix in `entity_refs.SECTION_KEYS` -- the same constraint
    Alopecia-Intellectual_Disability_Syndromes records.

    Stale prose. Updated the four places that described ficolin-3 as uncurated:
    the member-count line and the "still uncurated" list in `notes`, the coverage
    discussion's rationale, and the
    `curate_early_and_regulatory_complement_defects` experiment description --
    which also gained a correction, since it was written assuming each new arm
    would sharpen the contrast and the lectin arm did not. Also updated the
    closing paragraph of `kb/disorders/Ficolin_3_Deficiency.yaml`'s `notes`,
    which said the membership edit was left to a separate PR.

    Validation. `just validate-grouping` (schema, terms, references) passed;
    `just check-groupings` reports all four members SATISFIED against the
    NECESSARY criterion; `just validate-disorders` on the entry passed with 29/29
    snippets verified against the cache; `just check-duplicate-keys`,
    `check-entity-refs`, `check-enum-values`, `check-folded-hyphens` and
    `check-case-collisions` all clean. No reference cache changes -- no new
    evidence was added, since the grouping-level claims are curated as
    discussion and differentiating-mechanism prose over evidence the member entry
    already carries.

    Not done, and left for whoever curates the alternative-pathway member: the
    fifth cascade position, and the properdin check the new discussion names.

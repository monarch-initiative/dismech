  summary: 'Classify: IUIS 2022 Table 8 (complement deficiencies)'
  details: |
    Resynchronised the member list against the set of disorder entries actually carrying classifications.iuis_category: complement deficiency.

    The grouping listed one member (Late Complement Component Deficiency) and its notes claimed the early classical-pathway and regulatory arms were uncurated. That was already false: Complement Component 2 Deficiency merged in #9667 carrying the classification, and Hereditary Angioedema acquired it in this same pass. Both were classified-but-unlisted.

    Nothing catches that drift. just check-groupings evaluates membership criteria only against members already named in the file; it has no discovery step, so an entry that is classified but omitted from the list is silently invisible. The sync has to be a manual diff against rg -l 'classification_value: complement deficiency' kb/disorders/, which now returns exactly three files. The notes now name that command so the next person does not have to rediscover it.

    Added two member blocks with differentiating_mechanisms and gene bindings copied from each entry's own gene_term: Complement Component 2 Deficiency (C2, hgnc:1248, early classical arm) and Hereditary Angioedema (SERPING1, hgnc:1228, regulatory arm). Members are now ordered by cascade position, which is what the grouping_rationale turns on.

    Corrected the MONDO consistency note, which asserted a single member and is-a descent from MONDO:0003832. Re-verified with runoak: LCCD (MONDO:0015700) and C2D (MONDO:0009006) are descendants; Hereditary Angioedema is not, because MONDO splits the molecular lesion (MONDO:0007361 C1 inhibitor deficiency, which is a descendant) from the clinical syndrome (MONDO:0019623, placed under angioedema and skin vascular disease). That is a MONDO modelling choice, not a membership error, and it is recorded rather than papered over. The mapping stays CONSISTENT because the predicate is broadMatch.

    Updated the complement_table8_pathway_coverage knowledge gap. Its original form (a single terminal-pathway member) is closed: three cascade positions are now represented, so the pathway-position-predicts-phenotype contrast is demonstrable across members. What remains is breadth, three of thirty Table 8 disease rows, with the alternative and lectin pathways and the membrane regulators having no member at all. The proposed experiment was repointed at those.

    Recorded three Table 8 rows that are deliberately not members, so the reasoning is not rediscovered: periodontal Ehlers-Danlos (curated as a has_subtypes entry inside Ehlers-Danlos_Syndrome, and iuis_category is entry-level and single-valued), atypical HUS (IUIS anchors the six overlapping rows on the gene deficiency and lists aHUS as an associated feature; the entry also lumps an anti-factor-H antibody arm that is Table 10 and a DGKE arm that is not complement), and paroxysmal nocturnal hemoglobinuria (somatic PIGA, in neither table).

    Validation: just validate-grouping passed, just check-groupings and --strict report all three members SATISFIED, just check-duplicate-keys and just check-entity-refs clean.

  summary: Group Stuve-Wiedemann Syndromes under OMIMPS:601559
  details: |
    Compared actual dated OMIM members with current main disease records. Added the explicit union, evidence-supported distinctions and necessary annotation criteria. The shared skeletal-autonomic syndrome and overlapping cytokine-receptor signaling explain the series. LIFR and the more broadly shared GP130 transducer are not interchangeable receptor components, so the extended IL6ST phenotype remains a separate disease. Other allelic IL6ST immune phenotypes are outside this union.

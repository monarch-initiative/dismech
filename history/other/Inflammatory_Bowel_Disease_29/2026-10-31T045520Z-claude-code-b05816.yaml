  details: |
    Lump/split decision for stubs/Inflammatory_Bowel_Disease_29.yaml (MONDO:0054849, inflammatory bowel disease 29, OMIM 618077, gene INAVA, formerly C1orf106): OUT_OF_SCOPE as a susceptibility term. The stub was deleted and no kb/disorders/ entry was written. This record is attached to the deep-research report because that report is the only committed artifact of the decision.

    Why it is a susceptibility term and not a disease. OMIM 618077 is one of the serially numbered IBD susceptibility loci. The HPO annotation for it (via the Monarch API) gives autosomal dominant inheritance with incomplete penetrance and cites Rivas et al. 2011 (PMID:21983784), a pooled resequencing case-control study of GWAS loci that reported coding variants in C1orf106 "more associated than permitted by chance"; that is a population association, not a segregating family. The MedGen summary of the OMIM entry cites Mohanan et al. 2018 (PMID:29420262), which studied the coding risk variant (Y333F, written *333F there) in C1orf106-/- mice and cell lines. The other INAVA papers (PMID:28436939 on the intronic risk SNP rs7554511 lowering INAVA expression in macrophages; PMID:31022698 and PMID:30355448 on epithelial junction and IL-1/NOD2 signalling functions) all describe INAVA as a susceptibility gene for common Crohn disease and ulcerative colitis. There is no reported patient or family with a monogenic INAVA disease. A PubMed search for (INAVA OR C1orf106) AND (homozygous OR biallelic OR "very early onset" OR monogenic OR exome) on 2026-10-31 returned two records, neither about INAVA in IBD (a celiac disease association panel, PMID:41882060, and a multiple sclerosis study, PMID:37560832). ClinGen has no INAVA gene-validity assertion in cache/clingen/gene_validity.csv, and there is no GeneReviews chapter.

    The claim issue (#16129) described IBD29 as a monogenic autosomal recessive early-onset disease caused by biallelic INAVA loss. No source found here supports that description: there is no recessive INAVA disease in the literature to keep apart from the risk association, because the risk association is all that OMIM 618077 records.

    The openscientist deep-research run (research/Inflammatory_Bowel_Disease_29-deep-research-openscientist.md) completed and reached the same conclusion independently: it describes IBD29 as a polygenic susceptibility form of IBD that presents as Crohn disease or ulcerative colitis, with no genotype-specific clinical data. Its reference validation resolved 12 of 12 references with 5 of 5 quotes found, and just preflight-dr against MONDO:0054849 passed (INAVA mentioned 68 times, OMIM 618077 matched).

    Where the INAVA content belongs. The curatable entities are kb/disorders/Ulcerative_Colitis.yaml and kb/disorders/Crohn_Disease.yaml, where INAVA would be a genetic row with relationship_type SUSCEPTIBILITY (or RISK_FACTOR), and possibly an epithelial barrier node (INAVA restrains cytohesin-1/ARF6 activity and so stabilises E-cadherin adherens junctions, PMID:29420262). Neither entry currently mentions INAVA. That edit was left for a separate PR because this session was scoped to one stub.

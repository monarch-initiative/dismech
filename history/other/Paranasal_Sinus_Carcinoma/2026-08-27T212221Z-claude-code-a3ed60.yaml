  summary: 'Create: Paranasal Sinus Carcinoma grouping (MONDO:0000380)'
  details: |
    New Grouping over the paranasal sinus carcinoma histologies, mapped to MONDO:0000380. This is the scope decision for issue 9036.

    The issue carried the CURATE_ROOT_WITH_SUBTYPES priority hint and asked for the root to be modelled as a Disease with has_subtypes. It is modelled as a Grouping instead. The reasoning is recorded in grouping_rationale so the split is auditable: the member histologies share anatomic origin and the clinical syndrome that origin produces, but they do not share a pathograph. Their drivers are mutually exclusive (IDH2 R172 hypermethylator phenotype; dust-inflammation-associated TP53 mutagenesis with an enteric CDX2/CK20 phenotype switch; TP53/CDKN2A loss with an HPV-associated non-keratinizing subset), and each member conforms to a different mechanism module with none shared. Per issue 8727 the dashboard hint is a prioritization signal, not a lump-versus-split ruling. A further consideration: the members are already distinct Disease entries with their own MONDO terms, so a union reconciles the pre-existing squamous entry instead of duplicating its content inside an umbrella, which is what the issue asked for in substance.

    MONDO mapping is skos:closeMatch, not exactMatch, because the extensions diverge in both directions: the grouping under-covers MONDO:0000380 (adenoid cystic and mucoepidermoid carcinoma and the per-subsite classes have no dismech entries), and sinonasal undifferentiated carcinoma is a listed member on anatomic grounds while MONDO classifies it only under undifferentiated carcinoma. Because the predicate is closeMatch, MONDO:0000380 is deliberately not retired from the curation queue by this entry.

    Two NECESSARY membership criteria: a curator-checked OTHER leaf for carcinoma of paranasal sinus origin (the criteria vocabulary has no anatomic-site predicate), and an evaluable OR over the shared presenting phenotypes nasal congestion (HP:0001742) and epistaxis (HP:0000421). No SUFFICIENT criteria, because a site-less sufficient criterion would flag every non-neoplastic sinonasal entry as a candidate.

    Members: Paranasal Sinus Squamous Cell Carcinoma, Ethmoid Sinus Adenocarcinoma, Sinonasal Undifferentiated Carcinoma, each with differentiating_mechanisms naming its distinct driver, its occupational profile, and its module conformance.

    Validation: just validate-grouping passed on schema, terms and references.

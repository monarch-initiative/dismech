  summary: Add Megalencephaly-polydactyly Syndrome as the fifteenth member
  details: |
    Megalencephaly-polydactyly Syndrome (MONDO:0958279) records Neuroblastoma (HP:0003006) as a phenotype of the condition, with two evidence items, and was the only constitutional condition in kb/disorders binding a term in the HP:0004376 closure that the grouping did not list. Its entry was created on 30 October 2026, after the members added on 3 to 4 November had been chosen, so it was missed rather than excluded. Opsoclonus-Myoclonus Syndrome also binds HP:0003006, as the associated tumour rather than a predisposition, and stays out.

    The new member row binds MYCN (hgnc:7559), the only MYCN binding in the grouping. Its one quote is copied from the member entry's own Neuroblastoma phenotype, PMID:38884091, with reference_title, evidence_source HUMAN_CLINICAL and quote_role REVIEW_SYNTHESIS carried over unchanged, the convention the earlier members follow. The differentiating mechanism keeps to what the member entry states: Thr58 phosphodegron disruption and MYCN stabilisation, Thr58Met as a recurrent somatic mutation in neuroblastoma, two of three patients with infantile neuroblastoma, and a tumour link that is inferred rather than tested.

    The description now counts eight further members and names MYCN protein stabilisation among the routes they add; the notes record the addition in one sentence.


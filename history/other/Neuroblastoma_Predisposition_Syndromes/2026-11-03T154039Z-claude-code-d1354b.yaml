  summary: Add seven members and one evidence quote per differentiating mechanism
  details: |
    Grows the grouping from seven members to fourteen and gives every differentiating mechanism exactly one supporting quote.

    Members added, each with a differentiating mechanism and one quote: PHOX2B-related neuroblastic tumour susceptibility (MONDO:0700041), Li-Fraumeni syndrome (MONDO:0018875), neurofibromatosis type 1 (MONDO:0018975), Noonan syndrome (MONDO:0018997), Sotos syndrome (MONDO:0019349), Simpson-Golabi-Behmel syndrome type 1 (MONDO:0020602) and Fanconi anemia (MONDO:0019391). Six of these were named in the grouping's own notes when it was created as conditions that would become candidates once their entries recorded a neuroblastic tumour as a phenotype with evidence; that has since happened for all six. The seventh, PHOX2B-related susceptibility, is a new entry, and the grouping's open discussion had said its MONDO term should be added once an entry existed.

    The six existing members that had no quote on their differentiating mechanism now have one, which completes what was promised when the grouping was created. Every quote was taken from the member entry that already cites it, restricted to that entry's own neuroblastic-tumour phenotype, and carried over with its reference title, evidence source, quote role and directness unchanged. No new reference was fetched.

    One supports value differs from its source entry deliberately. The neurofibromatosis type 1 member quotes the 2017 AACR review sentence saying the co-occurrences may be coincidental. The disease entry grades that REFUTE, because there it bears on the claim that NF1 predisposes to neuroblastoma. Here the claim is that the association is unsettled, which the sentence supports directly, so it is SUPPORT. The evidence source is unchanged.

    Fanconi anemia is listed as a disease rather than by subtype, following Beckwith-Wiedemann syndrome, with its restriction to the biallelic BRCA2 (FA-D1) and PALB2 (FA-N) subtypes stated in the differentiating mechanism.

    The description now accounts for the added members and the mechanistic routes they bring, so the statement that no mechanism is common to all members still holds. The notes passage listing these conditions as not listed is replaced by what became of them. The discussion of MONDO's serial-numbered susceptibility terms records that term 2 is now curated and a member, and that the KIF1B stub for term 1 is marked blocked; it stays open because term 1 is undecided and terms 4 to 7 remain out of scope.

    Validation: schema, term and reference validation pass with 25 snippets and 25 titles checked and no issues; the strict offline membership audit reports all fourteen members satisfying the necessary criterion and no structural errors. The membership criterion is unchanged, so the committed ontology closure cache needed no rebuild.

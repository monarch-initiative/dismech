  summary: 'Create: Neuroblastoma Predisposition Syndromes grouping'
  details: |
    New Grouping of the seven constitutional conditions whose DisMech entries record a neuroblastic tumour: ALK-related neuroblastic tumour susceptibility, BARD1-related cancer predisposition, Beckwith-Wiedemann syndrome, congenital central hypoventilation syndrome, Costello syndrome, Intellectual disability X-linked 102 (DDX3X) and Weaver syndrome. Part of the neuroblastoma expansion series (issue 15822).

    Criterion: one NECESSARY HAS_PHENOTYPE leaf on HP:0004376 Neuroblastic tumor, whose closure includes Neuroblastoma and Ganglioneuroblastoma but not Ganglioneuroma (HP:0003005). just build-grouping-closure-cache added the six HP:0004376 rows to cache/closure/hp.csv. grouping_basis is SHARED_PHENOTYPE; membership does not imply a shared mechanism or grade the strength of the association. No MONDO mapping is recorded because MONDO has no class for this union (the OLS searches are in the notes).

    Evidence: four criterion items quote the 2023 AACR neuroblastoma predisposition update (PMID:38860978). A CURATION_TODO discussion explains why MONDO's neuroblastoma susceptibility terms 4 to 7 (association loci at 6p22, 2q35, 1q21.1 and 11p15) and term 1 (KIF1B; the family was re-analysed and the pheochromocytoma heritability attributed to MAX) are not members, and that term 2 (PHOX2B) has no entry yet; it cites PMID:18463370, PMID:19412175, PMID:19536264, PMID:21124317 and PMID:33112832. The BWS differentiating mechanism cites PMID:41126215. The notes name the entries that could join once they record the phenotype (Noonan, Li-Fraumeni and NF1, with the 2017 AACR caveats for each; Simpson-Golabi-Behmel type 1, Sotos and Fanconi anaemia, which mention neuroblastoma only in text), worded so they stay accurate whichever related PR merges first. A follow-up adds new members as their entries record the phenotype.

    New reference caches: PMID:18463370, PMID:19536264, PMID:21124317 and PMID:33112832.

    Validation on the branch rebased onto main: validate-grouping-batch, check-groupings --strict (7 of 7 members SATISFIED), count-verified-snippets --strict (12 of 12), check-reference-titles-present, the whole-repo gates (snippet grading, folded hyphens and YAML, snippet length, title snippets, retired-support prose, reference titles, case collisions, duplicate keys, entity refs, block-scalar comments, enum values), tests/test_grouping_closure_cache.py and grouping-nesting-audit (the grouping is standalone; no containment involves it). All passed.

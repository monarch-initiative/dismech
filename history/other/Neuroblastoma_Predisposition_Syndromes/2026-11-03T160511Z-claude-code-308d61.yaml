  summary: 'Review round 1: correct Li-Fraumeni''s provenance in notes, and two improvements'
  details: |
    The review found one factual error in the notes passage and made two suggestions; all three are taken, together with a folding defect found while fixing them.

    The error. The new notes paragraph said that Li-Fraumeni Syndrome and PHOX2B-Related Neuroblastic Tumor Susceptibility both arrived with the entries that record them. That is true of PHOX2B, a new entry created on 30 October 2026, and false of Li-Fraumeni, whose entry was created on 26 January 2026 and which gained its neuroblastoma phenotype by curation onto an existing entry, exactly as the other five did. The same sentence also said six conditions and then listed seven, because PHOX2B was never one of the six held back when the grouping was created; it was the susceptibility term named in the grouping's own discussion. The paragraph now separates the two routes and counts correctly.

    A folding defect of this PR's own making. Four lines of the added prose ended in a hyphenated word fragment, so that a folded block scalar would have joined them into the wrong words: Li- Fraumeni twice, non- haematological, and Wilms- led. These came from wrapping prose with a tool whose default is to break on hyphens. All four are reflowed, and the folded-hyphen gate passes. That gate has no baseline, so this would have failed continuous integration.

    First suggestion, taken. Fanconi anemia's membership rests on both of its severe complementation groups, but only BRCA2 was bound, with PALB2 named in prose. Since differentiating mechanisms are multivalued, the FA-N half now has its own mechanism row bound to PALB2, with its own quote giving the first-cancer counts for the FANCN genotype, so biallelic PALB2 is queryable. The inline PALB2 identifier is dropped from the BRCA2 row, which no longer needs it.

    Second suggestion, taken. The paragraph added to the description read as a changelog, opening with members having joined and closing with a sentence about quotes having been added. A description should say what the grouping is, so the closing sentence is removed and the opening is rewritten to state what the seven members contribute.

    Validation after the changes: schema, term and reference validation pass with 26 snippets and 26 titles checked and no issues; the strict offline membership audit reports structure OK and all fourteen members satisfying the necessary criterion; the folded-hyphen, duplicate-key, block-scalar, enum-value and entity-reference gates pass. No cache rows changed.

  summary: Create the ICCC-3 group IV grouping (neuroblastoma and other peripheral
    nervous cell tumors)
  details: |
    New grouping kb/groupings/Neuroblastoma_and_Other_Peripheral_Nervous_Cell_Tumors.yaml: group IV of the International Classification of Childhood Cancer, third edition (ICCC-3), with five DISEASE members. Neuroblastoma, Ganglioneuroblastoma and CNS Neuroblastoma, FOXR2-Activated are in subgroup IV(a); Olfactory Neuroblastoma and Pheochromocytoma and Paraganglioma are in subgroup IV(b). grouping_basis CLINICAL_CONVENTION. Part of the neuroblastoma expansion series (issue 15822). Written by hand from the two sources.

    Sources, all new to the reference cache: PMID:15712273, the paper that published the ICCC-3, cached as an abstract only, which states the structure and purpose of the classification but does not list its groups; and url:https://seer.cancer.gov/iccc/iccc3.html, the main classification table as the SEER programme publishes it, from which the group IV rows, the subgroup III(c) rows and SEER's caution on benign and borderline tumours are quoted; and two answers of the SEER Inquiry System (questions 20210041 and 20250024), which give the ICD-O-3.2 coding of paraganglioma and pheochromocytoma. Thirteen evidence items, all evidence_source OTHER. Table rows are graded REVIEW_SYNTHESIS, SEER's own caution and answers PRIMARY_RESULT, and rows that give codes without naming the tumour directness INDIRECT.

    One NECESSARY criterion with predicate OTHER: the tumour's ICD-O-3 morphology code is one that the table assigns to group IV, with malignant behaviour. The four-digit code is not a structured field of a Disease entry (issue 7548), so check-groupings reports UNKNOWN for every member, which passes --strict. The member list was drawn up from the entries whose names mark them as tumours of these kinds and is not offered as complete. Each member carries a differentiating_mechanisms row that gives its subgroup and code.

    The codes that link a table row to a tumour were read through OLS4 on 10 November 2026 and are recorded in notes, not as quoted evidence. NCI Thesaurus ICD-O-3_Code: Neuroblastoma 9500/3, Ganglioneuroblastoma 9490/3, Olfactory Neuroblastoma 9522/3 and 9523/3, Adrenal Gland Pheochromocytoma 8700/0, Paraganglioma 8680/1, their metastatic forms 8700/3 and 8680/3, Ganglioneuroma 9490/0. MONDO cross-references agree for the tumours that carry one. For CNS Neuroblastoma, FOXR2-Activated, MONDO and the NCI Thesaurus record no code on their own terms; the Disease Ontology term DOID:0080906, which MONDO records as an exact match of MONDO:0859597, carries ICDO:9500/3. Every lookup, and the MONDO name searches cited in notes, were run again at 23:08 UTC before the commit with the same results. A CURATION_TODO discussion asks for a primary coding source for that tumour and for a registry report that names it.

    Ganglioneuroma is not a member: its code is 9490/0, a benign one, and SEER's caution keeps benign and borderline tumours out of group IV. Pheochromocytoma and Paraganglioma is a member only for tumours registered as malignant, and which tumours those are depends on the coding edition: under the ICD-O-3 codes that the NCI Thesaurus records (8700/0, 8680/1) the group covers the entry in part, while ICD-O-3.2 lists paraganglioma, NOS as 8680/3 for cases diagnosed in 2021 and after and SEER tells registrars to report pheochromocytoma as 8700/3. The reviewer of the pull request raised this point from memory; it was checked against the two SEER answers before it was written in. No MONDO mapping is asserted. The grouping asserts no shared driver, pathway or origin among its members. just grouping-nesting-audit reports no containment; the Peripheral Neuroblastic Tumors grouping shares two of its three members with this one, which the rationale explains.

    Validation: just validate-grouping, validate-grouping-batch and check-groupings --strict --offline pass; 13 of 13 snippets verify against the cached references; the whole-repo gates, the welded-heading gate, check-cache-order, check-term-cache-integrity and the grouping tests were run locally and pass.

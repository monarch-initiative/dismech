  summary: Group IFAP Syndromes under OMIMPS:308205
  details: |
    Compared actual dated OMIM members with current main disease records. Added the explicit union, evidence-supported distinctions and necessary annotation criteria. The shared follicular skin, hair and ocular phenotype joins different lesions in regulated transcription-factor processing. IFAP1 affects site-2 protease, whereas IFAP2 substrate variants impair an earlier site-1 cleavage step; the latter is not simply a defect in MBTPS2 cleavage of the same site. The union preserves distinct inheritance and excludes other allelic skin or skeletal disorders.

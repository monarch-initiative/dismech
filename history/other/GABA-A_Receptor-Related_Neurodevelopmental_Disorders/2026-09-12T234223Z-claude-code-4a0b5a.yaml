  summary: 'Create: GABA-A Receptor-Related Neurodevelopmental Disorders grouping'
  details: |
    Created a Grouping over the two curated monogenic GABA-A receptor subunit disorders (GABRB3-Related DEE, GABRG2-Related Epilepsy), prompted by a 2025-11-14 ICD-10-CM proposal that requests a single code spanning the 19 GABA-A receptor subunit genes while dismech carried no grouping over them. Two NECESSARY criteria blocks: an OR over all 19 subunit genes (HGNC IDs verified against sqlite:obo:hgnc, not hand-derived), and conformance to epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance. Criteria are NECESSARY rather than NECESSARY_AND_SUFFICIENT because HAS_GENE cannot read relationship_type: a sufficient reading would sweep in contiguous-gene disorders spanning the 15q11-q13 subunit cluster (Angelman, 15q11q13 microduplication) and common epilepsies carrying a subunit gene as a SUSCEPTIBILITY allele (CAE, JAE, JME, EMAtS), none of which are monogenic receptor disorders. Verified with just validate-grouping (passed) and just check-groupings --strict (structure OK; both members SATISFIED on both blocks). No MONDO mapping asserted: MONDO has no GABA-A receptor grouping term. Candidate members recorded in notes but not added without review: DEE1 (GABRA1 CAUSATIVE) and GEFS+ (GABRG2 CAUSATIVE).

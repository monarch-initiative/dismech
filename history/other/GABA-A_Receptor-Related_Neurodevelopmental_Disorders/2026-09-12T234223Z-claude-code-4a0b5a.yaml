  summary: 'Create: GABA-A Receptor-Related Neurodevelopmental Disorders grouping'
  details: |
    Created a Grouping over the two curated monogenic GABA-A receptor subunit disorders (GABRB3-Related DEE, GABRG2-Related Epilepsy), prompted by a 2025-11-14 ICD-10-CM proposal that requests a single code spanning the 19 GABA-A receptor subunit genes while dismech carried no grouping over them. Two NECESSARY criteria blocks: an OR over all 19 subunit genes (HGNC IDs verified against sqlite:obo:hgnc, not hand-derived), and conformance to epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance. Criteria are NECESSARY rather than NECESSARY_AND_SUFFICIENT because HAS_GENE cannot read relationship_type: a sufficient reading would sweep in contiguous-gene disorders spanning the 15q11-q13 subunit cluster (Angelman, 15q11q13 microduplication) and common epilepsies carrying a subunit gene as a SUSCEPTIBILITY allele (CAE, JAE, JME, EMAtS), none of which are monogenic receptor disorders. Verified with just validate-grouping (passed) and just check-groupings --strict (structure OK; both members SATISFIED on both blocks). No MONDO mapping asserted: MONDO has no GABA-A receptor grouping term. One non-member satisfies both criteria blocks: Developmental and Epileptic Encephalopathy 19 (GABRA1 CAUSATIVE), which conforms at the named anchor epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance. It is recorded as an OPEN CURATION_TODO discussion, since the ICD-10-CM proposal names GABRA1 among its principal genes and the omission is a gap rather than a boundary decision. Generalized Epilepsy with Febrile Seizures Plus satisfies the gene block only (GABRG2 CAUSATIVE) and declares no conforms_to at all, so the NECESSARY criteria already exclude it; it is recorded as a settled exclusion in grouping_rationale, which also notes it would stay out on scope even if conformed, being a family-level genetically heterogeneous syndrome with SCN1A, SCN1B and STX1B also CAUSATIVE. Neither is a structural record: the schema has no slot for a deferred- or excluded-member list, tracked in dismech#11805.

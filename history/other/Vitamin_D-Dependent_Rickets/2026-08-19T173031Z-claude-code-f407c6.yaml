  summary: 'Create: Vitamin D-Dependent Rickets grouping'
  details: |
    Created the VDDR grouping over the five newly curated gene-level members (types 1A, 1B, 2A, 2B, 3), mapped skos:exactMatch to MONDO:0024299. grouping_basis SHARED_PATHWAY + SHARED_MECHANISM: the members are united by lesions at different points of one signalling axis, not by homology. The lump/split rationale records the differences that make merging wrong - calcitriol is low in 1A/1B/3 and high in 2A/2B, 25-hydroxyvitamin D is normal in 1A and low in 1B/3, and treatment differs from physiological calcitriol to lifelong high-dose vitamin D to calcium bypass. One NECESSARY criteria block is structured (calciopenic-arm conformance AND rickets) and evaluates SATISFIED for all five members. The second, arm-level exclusion criterion is deliberately left as prose with NO logic block: CONFORMS_TO_MODULE is evaluated on the module stem only (_eval_leaf in src/dismech/groupings.py splits the reference at '#' and discards the node anchor), so a NOT over the phosphopenic-arm leaf evaluated to NOT_SATISFIED for all five members and reported five false contradictions. The notes on that block record the limitation and the condition for restoring the structured form. Validation: just validate-grouping passed (schema + terms + references); just check-groupings reports structure OK and all five members SATISFIED.

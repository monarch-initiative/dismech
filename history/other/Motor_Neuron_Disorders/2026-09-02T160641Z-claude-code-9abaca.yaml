  summary: 'Edit: nest Bulbospinal Muscular Atrophies as a GROUPING member'
  details: |
    Nested the Bulbospinal_Muscular_Atrophies grouping as a `member_type: GROUPING` member of Motor Neuron Disorders, replacing the three direct rows it covers (Kennedy Disease, Brown-Vialetto-Van Laere Syndrome, Madras Motor Neuron Disease). The per-disease differentiating mechanisms and gene bindings from those rows were folded into the GROUPING row's `differentiating_mechanisms` list so no curated text was lost, and `notes` records the change.

    Why: the Bulbospinal grouping's own notes and rationale define it as "the bulbar-plus-spinal lower-motor-neuron subset" of this grouping, "of which every member is also a member", but neither file declared the relation, so the grouping index rendered both as unrelated roots. The `just grouping-nesting-audit` report (added in the same change) flagged the pair as an undeclared containment: every expanded disease member of the child was already a direct member here.

    Convention followed: as in Lysosomal_Storage_Disorders and Inborn_Errors_of_Immunity, a nested grouping replaces the direct rows it covers rather than duplicating them (the LSD review of 2026-08-20 removed exactly such a redundancy). The three diseases remain members: `evaluate_grouping` now expands nested groupings and reports them as `(via Bulbospinal Muscular Atrophies)`, all three SATISFIED against the motor-neuron phenotype criterion, and the parent page's coverage table shows them as `nested via` members rather than `not listed`.

    Validation: linkml-validate (Grouping) clean; `just check-groupings --strict` exit 0 for this file.

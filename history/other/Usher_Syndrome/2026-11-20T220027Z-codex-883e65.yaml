  summary: Align Usher syndrome with OMIMPS:276900
  details: |
    The January 2026 series contains fourteen clinical or locus records across Usher types 1, 2, 3 and 4. The four disease members organize that named clinical family at a coarser granularity. ExactMatch aligns the Usher syndrome concept, not a one-to-one count of molecular subtypes or acceptance of every historical locus assignment as an established causal gene. The ARSG-related type 4 member and the distinct mechanisms of the other types preclude a universal Usher-protein-complex mechanism. Other syndromic deaf-blindness disorders remain outside the curated union.

  summary: Add report-only conformance-content check
  details: |
    Added scripts/check_conformance_content.py, tests/test_conformance_content.py, two justfile recipes (check-conformance-content, list-conformance-content) and a CLAUDE.md section. A conforms_to anchor is already a foreign key via groupings.module_node_names, but nothing compared the conforming node against the module node it names, so CLAUDE.md's own contract (a conforming node should carry the module's expected processes and causal edges) was unenforced and unmeasured. Over the current corpus the check reports 3550 links: 1774 share at least one GO term with their module node, 1374 do not, 402 point at a module node binding no GO term at all, 476 bind no cell type where the module does, and 243 carry no downstream edge where the module node has one. Report-only and deliberately not in just qc, because a conformer binding the specific process where the module binds the generic one is the substitution the primer asks for rather than a defect, and telling that apart from a mis-picked anchor needs a GO closure walk that would require the go.db build conf/oak_config.yaml routes around; extending cache/closure/ to module-node terms is recorded as the right way to make it stricter. Ranked by finding count rather than ratio so a module with one divergent conformer does not outrank one with 57 of 63. Offline, exits 0, accepts file paths, and has --strict and --kind for whoever gates a subset later.

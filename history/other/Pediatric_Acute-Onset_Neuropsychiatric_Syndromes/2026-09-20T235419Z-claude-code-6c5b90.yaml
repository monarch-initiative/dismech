  summary: 'Create: PANS/PANDAS grouping, with the PR #7458 review round folded in'
  details: |
    Creation of the PANS/PANDAS grouping as an explicit curated union of the two new Disease entries, plus the review round on PR #7458.

    Blocking item 1 of the review propagated here: the membership criterion's restricted-eating leaf bound HP:0002039 Anorexia, which HPO defines as loss of appetite. Rebound to HP:0020302 Restrictive eating to match the correction in the PANS entry.

    A non-blocking suggestion was also taken. The criteria description promised a cardinal feature plus at least one concurrent neuropsychiatric manifestation, while the logic was a bare three-way phenotype OR - weaker than the text above it claimed. The logic is now an AND of two OR branches matching that description. The description's 'post-infectious or immune-mediated basis' clause is deliberately still not encoded: neither member carries an annotation a HAS_* leaf could test for it, and inventing one would make a NECESSARY criterion unfalsifiable. That decision is recorded in the grouping's notes.

    just check-groupings still reports both members SATISFIED. The per-leaf NOT_SATISFIED lines it prints (PANS has no tics, PANDAS has no restrictive-eating phenotype) are the expected behaviour of an OR branch, not findings.

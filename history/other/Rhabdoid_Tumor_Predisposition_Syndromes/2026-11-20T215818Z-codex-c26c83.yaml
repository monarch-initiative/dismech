  summary: Group Rhabdoid Tumor Predisposition Syndromes under OMIMPS:609322
  details: |
    Compared actual dated OMIM members with current main disease records. Added the explicit union, evidence-supported distinctions and necessary annotation criteria. The union groups inherited predisposition to rhabdoid tumors through distinct SWI/SNF components. A shared tumor-suppressor architecture does not make the gene-specific tumor spectra identical. Tumor occurrence is not required in every carrier: the phenotype criterion checks annotations on the disease records, not penetrance or a patient diagnosis. Sporadic rhabdoid tumors and unrelated allelic syndromes are excluded.

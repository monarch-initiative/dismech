  summary: 'Create grouping: Dystrophinopathies (MONDO:0700285)'
  details: |
    Resolved the curation stub for MONDO:0700285 (DMD-related muscular dystrophy) as a kb/groupings/ Grouping, not a Disease entry: the MONDO class groups the DMD-gene skeletal dystrophies, and both curated descendants (Duchenne MONDO:0010679, Becker MONDO:0010311) already have Disease entries.

    Members: Duchenne Muscular Dystrophy, Becker Muscular Dystrophy, X-linked Dilated Cardiomyopathy. A search of kb/ for hgnc:2928 found exactly these three disease entries. X-linked dilated cardiomyopathy (MONDO:0010542) was included because GeneReviews (PMID:20301298) defines the dystrophinopathies as Duchenne, Becker and DMD-associated dilated cardiomyopathy, and the entry lists Dystrophinopathy as a parent. Because MONDO places it outside MONDO:0700285, that class is mapped with skos:broadMatch (the grouping contains the class). MONDO:0016147 (the Orphanet dystrophinopathy group, Orphanet:207085) is mapped with skos:closeMatch and marked INCONSISTENT, since MONDO does not place Duchenne or Becker under it.

    MONDO:0008034 (muscular dystrophy, pseudohypertrophic, with Internalized capillaries, OMIM:159050) is a MONDO subclass of Becker muscular dystrophy with no MONDO definition. No entry was created; it is recorded in a CURATION_TODO discussion together with MONDO:0016103 (isolated asymptomatic elevation of creatine phosphokinase).

    Criteria: one NECESSARY block, HAS_GENE DMD (hgnc:2928); all three members evaluate SATISFIED. All nine evidence snippets come from references already cached and used on the member entries; validate-grouping reported 9/9 snippets and 9/9 titles verified. No references_cache file was added or changed. Term validation added the two new MONDO grouping CURIEs (MONDO:0700285, MONDO:0016147) to cache/mondo/terms.csv and the disease-term enum cache.

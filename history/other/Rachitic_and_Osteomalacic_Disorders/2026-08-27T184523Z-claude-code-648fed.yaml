  summary: 'Create: Rachitic and Osteomalacic Disorders grouping'
  details: |
    Curated MONDO:0005520 (rickets) as a broad Grouping rather than a Disease entry.

    Concept decision. Rickets is a dual-coded disease-like phenotype (HP:0002748 / MONDO:0005520) reached by three mechanistically incompatible routes, and kb/modules/defective_skeletal_mineralization.yaml already carries an explicit instruction not to create a Rickets Disease entry. A single Disease entry would have had to assert one causal chain across the calciopenic, phosphopenic and inhibitor-excess arms, which differ in parathyroid hormone, in 25-hydroxyvitamin D, and in therapy (calcium/calcitriol vs phosphate/burosumab vs asfotase alfa). The KB answer is therefore three artifacts: the existing mechanism module, the existing narrow Vitamin_D-Dependent_Rickets grouping, and this broad union across arms. This is the artifact requested as Rickets_and_Osteomalacia / Rachitic_Disorders in issue 8995 item 1.

    Independent corroboration of the decision: `just research-disorder falcon Rickets` cannot run, because the recipe requires kb/disorders/Rickets.yaml to exist. No deep-research report was generated or consumed, and no preflight-dr run was possible for the same reason. All evidence was curated directly from cached references instead.

    Membership. NECESSARY_AND_SUFFICIENT on CONFORMS_TO_MODULE defective_skeletal_mineralization, following the Lysosomal_Storage_Disorders precedent, which makes the union self-maintaining: any future module conformer is reported as a candidate member. Eight DISEASE members (X-Linked Hypophosphatemia, Hypophosphatasia, CKD-Mineral Bone Disorder, Cystinosis, Tyrosinemia Type I, Fanconi-Bickel Syndrome, Fibrous Dysplasia, Cadmium Poisoning) plus one nested GROUPING member (Vitamin D-Dependent Rickets), whose five gene-level entries are deliberately not re-listed. All eight disease members evaluate SATISFIED with no contradictions.

    A second NECESSARY criteria block, that every member expresses defective mineralization as rickets and/or osteomalacia, is left as prose with no structured logic. Written as an OR over HP:0002748 and HP:0002749 it would report a false contradiction for CKD-Mineral Bone Disorder, which curates neither HP term today despite osteomalacia being a recognized histological subtype of renal osteodystrophy. That is a missing annotation on the member entry, recorded as a member-level note and a follow-up rather than encoded as a contradiction.

    Mapping. skos:broadMatch to MONDO:0005520, per issue 8995. exactMatch would be wrong in both directions: MONDO flags its own label ambiguous and axiomatizes the class around decreased circulating vitamin D (RO:0004029 HP:0100512) while subsuming the vitamin D-resistant hypophosphatemic branch; conversely this grouping admits hypophosphatasia, which MONDO does not place under rickets, and Cadmium Poisoning, whose skeletal disease is osteomalacia. broadMatch also deliberately does not retire MONDO:0005520 from the curation queue while issue 8970 (the prioritizer ranking dual-coded phenotype umbrellas as CURATE_ROOT targets, with rickets as its named exemplar) is open.

    Evidence. Eleven evidence items, all verified against cached references (11/11). The organizing calciopenic/phosphopenic axis is cited to PMID:37427438, newly fetched with just fetch-reference; the third (inhibitor-excess) arm is cited to PMID:26893260 because that axis does not cover hypophosphatasia. Per-member differentiating evidence reuses reference/snippet pairs already validated in the member entries themselves.

    Deliberately not done. Nutritional and dietary calcium-deficiency rickets (issue 8995 items 3 and 4), tumour-induced osteomalacia and ferric-carboxymaltose hypophosphatemia (item 5), and the remaining hypophosphatemic subtypes ADHR/ARHR1/ARHR2/HHRH/Dent (item 6) have no Disease entries and so cannot be members; all are expected members once curated and none is excluded on boundary grounds. The Lowe_Syndrome rickets gap (item 7) is untouched. The VDDR1C retraction (item 8) is recorded in this grouping notes. Issue 8995 item 2 was already completed on main before this work began.

    Validation: just validate-grouping (schema: No issues found; terms: passed; references: all validations passed, 11/11 snippets verified), just count-verified-snippets (11/11), just validate-terms (passed), just check-groupings (structure OK, all 8 disease members SATISFIED), just check-duplicate-keys (OK).

  summary: Group Inherited Distal Renal Tubular Acidoses under OMIMPS:179800
  details: |
    Compared actual dated OMIM members with current main disease records. Added the explicit union, evidence-supported distinctions and necessary annotation criteria. The four numbered series members share defective distal urinary acidification. Basolateral anion exchange and apical proton pumping are different components of the acid-secretion machinery; erythroid and inner-ear involvement distinguish members further. The union is scoped to these four curated entities, not every acquired or newly discovered genetic cause of distal renal tubular acidosis, and does not impose recessive inheritance on every pump-related presentation.

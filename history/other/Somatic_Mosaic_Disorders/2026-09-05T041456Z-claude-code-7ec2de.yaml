  summary: 'Create grouping: Somatic Mosaic Disorders'
  details: |
    Created kb/groupings/Somatic_Mosaic_Disorders.yaml, a genetic-architecture grouping modelled on Digenic_and_Oligogenic_Disorders. SCOPE. Members are dismech entries carrying an inheritance block bound to HP:0001442 (Typified by somatic mosaicism), in two tiers stated per row: disorders in which post-zygotic mosaicism is the mechanism (Proteus, CLOVES, Klippel-Trenaunay/angioosteohypertrophic, hemimegalencephaly, FCD II, hypothalamic hamartoma, Sturge-Weber, nevus of Ota, blue rubber bleb nevus, sporadic brain AVM, ECCL, fibrous dysplasia, Pacak-Zhuang, VEXAS, PNH) and disorders with a recognized mosaic arm alongside a germline form (porokeratosis, focal hyperinsulinism, tuberous sclerosis complex, the MOGHE arm of SLC35A2-CDG). 19 members. CRITERIA. One NECESSARY HAS_INHERITANCE leaf on HP:0001442. NECESSARY rather than NECESSARY_AND_SUFFICIENT because HP:0001442 is also bound in the KB for an incidental mosaic proband (Neurodevelopmental Disorder with Hypotonia and Speech Delay) and for parental germline mosaicism (KCNH1 Associated Disorder); both are deliberately non-members and the rationale says so. EXCLUSIONS. CHILD syndrome (functional X-inactivation mosaicism; its HP:0001442 binding was removed in the same PR), Mosaic Variegated Aneuploidy Syndrome (AR; mosaicism is a downstream phenotype), MCAP-like STAMBP microcephaly-capillary malformation and PIEZO1 lymphatic malformation 6 (both germline despite the mosaic-sounding names). Unbound candidates are listed in notes: McCune-Albright (stub), Schnitzler, CINCA, congenital melanocytic nevus, craniofacial microsomia, CHIP. VALIDATION. just validate-grouping: schema, terms and references pass (no snippets on the grouping itself). just check-groupings --strict: structure OK, all 19 members SATISFIED. check-duplicate-keys, check-entity-refs, check-enum-values pass. just grouping-nesting-audit reports no containment involving this grouping. All gene bindings in differentiating_mechanisms resolve from cache/hgnc/terms.csv; no cache file was created or edited. A validation run refetched 40 unrelated references_cache files as a side effect; that churn was reverted and is not part of the commit.

  summary: 'Add member: Neurocutaneous Melanocytosis'
  details: |
    Added Neurocutaneous Melanocytosis (kb/disorders/Neurocutaneous_Melanocytosis.yaml,
    MONDO:0009578) as a member in the tier of disorders whose mechanism is post-zygotic
    mosaicism, placed after Nevus of Ota, the other melanocytic member. The entry
    carries an inheritance block bound to HP:0001442 with two cited evidence items,
    which meets the grouping's NECESSARY criterion (just check-groupings reports it
    SATISFIED), and an NRAS genetic row graded CAUSATIVE with variant_origin SOMATIC,
    following the convention the grouping's rationale describes. The member row's
    description rests on the entry's inheritance evidence and its source
    (PMID:23392294): in that series, a codon 61 NRAS mutation was found in the affected
    tissue of twelve of fifteen patients with multiple congenital melanocytic nevi and
    was absent from blood and unaffected tissue, and all eleven central nervous system
    samples, from five patients, carried it. The row gives no count, keeps the authors'
    hedge that the findings suggest one variant shared by the nevi and the nervous
    system disease in most cases, and notes, as the entry's BRAF row does
    (PMID:25490715), that BRAF V600E has been reported instead of the NRAS variant in a
    minority of patients. NRAS is added to the description's list of the genes the
    members span, and the notes' line naming congenital melanocytic nevus as a candidate
    now says the nevus has no entry of its own while Neurocutaneous Melanocytosis, in
    which the nevi occur with melanocytosis of the central nervous system, is listed.
    Validated with just validate-grouping-batch (schema, terms, references and the
    strict offline membership audit), just check-groupings, check-duplicate-keys and
    check-block-scalar-comments.

  summary: 'Add member: NF2-Related Schwannomatosis'
  details: |
    Added NF2-Related Schwannomatosis (kb/disorders/NF2-Related_Schwannomatosis.yaml,
    MONDO:0007039) as a member in the tier of germline disorders with a recognized mosaic arm,
    beside Tuberous Sclerosis Complex. The entry carries an inheritance block bound to Typified
    by somatic mosaicism (HP:0001442) with its own evidence, so it satisfies the grouping's
    NECESSARY criterion, which just check-groupings --strict --offline confirms. The member row
    says that the first NF2 variant of mosaic patients arose after conception and is carried by
    only some cells, that on current estimates they are close to 60% of de novo cases, and that
    their disease is milder and more asymmetrical than the constitutional form. The description
    and rationale were not changed.

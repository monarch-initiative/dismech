  summary: 'Create: Brucelloses grouping, the covering grouping 3e requires for the
    species-specific brucellosis entries'
  details: |
    Created as part of PR 14916, which promotes Brucella abortus brucellosis to its own entry. Design decisions 3e makes a covering Grouping a precondition for promoting an infectious-disease stratum, and none existed: the melitensis entry's review_notes declined to create one on the grounds that it was the only curated species child, and that reasoning expired when the abortus entry was curated. Members are the two curated species entries, matched on disease name. The parent Brucellosis entry is deliberately not a member - it is the genus-level entity the members are strata of, and it holds the exactMatch on MONDO:0005683, so this grouping maps the same class with skos:narrowMatch instead. The NECESSARY criterion ANDs an OTHER leaf for 'caused by a named Brucella species' with a CONFORMS_TO_MODULE leaf on intracellular_pathogen_persistence; the OTHER leaf is not machine-evaluable, so check-groupings reports both members UNKNOWN rather than SATISFIED, which the notes record as the expected three-valued answer. Validation: just validate-grouping-batch passes, structure OK, no foreign-key errors.

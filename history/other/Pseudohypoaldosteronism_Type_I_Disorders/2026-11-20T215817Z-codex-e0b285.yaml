  summary: Group Pseudohypoaldosteronism Type I Disorders under OMIMPS:177735
  details: |
    Compared actual dated OMIM members with current main disease records. Added the explicit union, evidence-supported distinctions and necessary annotation criteria. Aldosterone resistance joins receptor-level renal disease with epithelial sodium-channel defects affecting multiple tissues. Distinct subunits, inheritance and tissue distribution justify separate members. Neither a uniformly severe neonatal course nor one inheritance pattern is imposed; secondary transient pseudohypoaldosteronism is excluded.

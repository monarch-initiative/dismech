  summary: Map Neuronal Ceroid Lipofuscinoses to OMIMPS:256730
  details: |
    Prioritized from the CLINICAL.T01.01 disease list. Compared January 2026 OMIM membership with September 2026 MONDO and existing KB scope. The January 2026 PS256730 snapshot contains fifteen numbered or clinically subdivided records, including unresolved CLN9 and OMIM:611726, progressive myoclonic epilepsy 3 with or without intracellular inclusions. The latter record spans a broader phenotype than ceroid-storage NCL alone. Conversely, the NCL umbrella member here includes ATP13A2/CLN12, which is absent from this inspected series. RelatedMatch records the overlap without forcing either a closed gene union or equivalence from the MONDO:0016295 crosswalk. The existing grouping rationale and necessary lysosomal-storage and neurologic criteria continue to distinguish enzyme, membrane/trafficking, and synaptic-protein branches. Incomplete standalone member curation is separate from these source-scope differences.

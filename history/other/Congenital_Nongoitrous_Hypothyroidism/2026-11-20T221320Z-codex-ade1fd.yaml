  summary: Align the CHNG series and close its CHNG3 curation gap
  details: |
    The January 2026 OMIM snapshot contains CHNG1 through CHNG9. These nine numbered entities are represented by the named subtype members and dedicated disease entries, including the newly curated CHNG3. ExactMatch aligns this explicit historical clinical family with the series; it does not assert one shared causal pathway. Replaced the unsupported universal phenotype rule and payload-free mapping criterion; incorporated current primary evidence for CHNG3.

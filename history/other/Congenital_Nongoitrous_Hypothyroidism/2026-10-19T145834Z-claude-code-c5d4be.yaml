  summary: 'Create grouping: Congenital Nongoitrous Hypothyroidism'
  details: |
    Created a grouping for MONDO:0000045 (hypothyroidism, congenital, nongoitrous), mapped skos:exactMatch, and deleted stubs/Hypothyroidism_Congenital_Nongoitrous.yaml. Issue #9867 listed this stub as an undecided numbered family; its stated reason for holding back (CHNG6 being its own entity) was resolved by PR #11643. MONDO subclasses were read from the local MONDO build with runoak and matched to KB entries by grep: CHNG1/2/5 are subtypes of Congenital_Hypothyroidism, CHNG7/8/9 are subtypes of Central_Congenital_Hypothyroidism, CHNG4 is Isolated_Thyroid-stimulating_Hormone_Deficiency and CHNG6 is Resistance_to_Thyroid_Hormone_Alpha. CHNG3 (MONDO:0012360) is locus-only (15q25.3-q26.1, no gene) and is recorded as a gap. Gene labels were copied from cache/hgnc/terms.csv. Validated with just validate-grouping and just check-groupings --strict --offline. Review round 1 on PR #14926 corrected the description sentence that placed every defect upstream of the thyroid; it now says the gland is not enlarged because nothing drives TSH-dependent growth (the TSH signal is absent, the gland cannot respond, or the defect is in the target tissues).

  summary: Add XYLT2, CHSY1, CHST14/DSE and GALNT2 disorders (5 -> 9 members)
  details: |
    Added four members that satisfy this grouping's NECESSARY criterion (checked offline over cache/closure/go.csv): Spondylo-ocular Syndrome (XYLT2, the first xylosylation step of the GAG linker, which the parent grouping's SUFFICIENT ICIMD criterion had been listing as an unplaced candidate), Temtamy Preaxial Brachydactyly Syndrome (CHSY1, chondroitin-sulfate polymerisation), Musculocontractural Ehlers-Danlos Syndrome (CHST14 and DSE, dermatan-sulfate modification; ICIMD 18.2 per the repository's IEMbase crosswalk) and GALNT2-CDG (mucin-type O-GalNAc initiation, which the N-glycosylation CDG grouping's boundary paragraph excludes). The description and rationale now name mucin-type O-GalNAc and the chain-polymerisation and chain-modification steps of the GAG route, and correct the Peters plus wording: B3GLCT extends O-fucose on thrombospondin type-1 repeats with glucose, so the TSR branch is O-fucose, not O-glucose. MONDO consistency re-derived for the new members with the OLS hierarchicalAncestors walk: three descend from MONDO:0015286 and spondylo-ocular syndrome (MONDO:0011604) does not, so 6 of 9 members descend. Dowling-Degos disease was not added: only its POFUT1 and POGLUT1 forms are O-glycosylation disorders, so membership would need SUBTYPE rows and is left for a curator. Verified with just validate-grouping-batch.

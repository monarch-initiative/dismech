  summary: Create the O-linked child of the ICIMD-18 umbrella (5 members)
  details: |
    Created Disorders of O-linked Protein Glycosylation and nested it under Disorders of Protein and Lipid Glycosylation, filling the one ICIMD category-18 subdivision the umbrella had no member for when it was created.

    Members (5), all drawn from entries already carrying classifications.icimd_category o_linked_protein_glycosylation and surfaced as candidates by the umbrella's SUFFICIENT criterion: Dystroglycanopathy, Peters plus syndrome, Larsen-like Syndrome B3GAT3 Type, Immunoskeletal Dysplasia with Neurodevelopmental Abnormalities, and Seizures-scoliosis-macrocephaly syndrome.

    Scope. The branch is defined by the first sugar on the serine/threonine hydroxyl, and the members divide by it: O-mannose on alpha-dystroglycan (the 18-gene dystroglycanopathy series), O-glucose on thrombospondin type-1 repeats (B3GLCT), and the O-xylose linker that starts every glycosaminoglycan chain, itself split between the shared linker tetrasaccharide (B3GAT3) and heparan-sulfate initiation and polymerization (EXTL3, EXT2).

    Why the glycosaminoglycan disorders are here rather than in their own grouping: ICIMD titles this subdivision "Disorders of O-linked protein glycosylation (including glycosaminoglycan synthesis)", and mechanistically a GAG chain is built on an O-xylose attached to a core-protein serine, so a linker or chain-initiation defect is an O-linked defect by construction. The quoted ICIMD sentence is the criterion's evidence item and was verified as an exact substring of references_cache/PMID_33340416.md.

    Criterion is NECESSARY, an OR over GO:0006493 protein O-linked glycosylation, GO:0006024 glycosaminoglycan biosynthetic process, and GO:0030166 proteoglycan biosynthetic process. The third operand is not redundant: two members annotate only the proteoglycan-product classes (GO:0015012 heparan sulfate proteoglycan biosynthetic process, GO:0050650 chondroitin sulfate proteoglycan biosynthetic process) rather than the glycosaminoglycan class, and closure was checked empirically with the evaluator rather than assumed. All three labels were read from cache/go/terms.csv. All 5 members evaluate SATISFIED.

    Deliberately excluded and recorded in notes: Short Stature, Amelogenesis Imperfecta, and Skeletal Dysplasia with Scoliosis (SLC10A7) and Autosomal Recessive Cutis Laxa Type 2A (ATP6V0A2). Both annotate protein O-linked glycosylation and would satisfy this criterion, but their proximal lesions are Golgi calcium and Golgi pH, which disable several glycosylation branches together; both carry icimd_category multiple_glycosylation_pathways and went to that sibling instead. O-glycosylation being among a disorder's casualties does not make it an O-linked disorder.

    MONDO is mapped as skos:narrowMatch to MONDO:0015286 because MONDO has no class for the O-linked subdivision alone. Consistency is declared UNKNOWN: several members are classified by MONDO under their clinical presentation (muscular dystrophy, Larsen-like syndrome, Peters plus) rather than under the glycosylation class, so is-a descent is not expected to hold for all of them and its absence would not be a membership error.

    Dystroglycanopathy is listed as a DISEASE member because the KB curates the whole 18-gene series as one entry. Noted in the grouping that if it is ever split per gene, that row becomes a nested GROUPING row rather than five direct rows.

    Verification. linkml-validate against target-class Grouping: no issues found. dismech.groupings: structure OK, 5/5 SATISFIED. The nesting audit shows the umbrella with five children and no new undeclared containment. check-duplicate-keys, check-enum-values, check-entity-refs, check-case-collisions and check-folded-hyphens clean.

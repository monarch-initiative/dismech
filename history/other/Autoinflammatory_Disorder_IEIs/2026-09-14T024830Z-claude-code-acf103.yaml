  summary: 'Grouping sync: IUIS Table 7 autoinflammatory disorders (2 -> 17 members)'
  details: |
    Synchronised kb/groupings/Autoinflammatory_Disorder_IEIs.yaml with the IUIS Table 7
    backfill in the same change.

    Members. Grew from two to seventeen. Thirteen entries classified against Table 7 in this
    pass were added (Aicardi-Goutieres Syndrome, Blau Syndrome, Cherubism, Deficiency of
    Adenosine Deaminase 2, Familial Cold Autoinflammatory Syndrome, Familial Mediterranean
    Fever, H Syndrome, Mevalonate Kinase Deficiency, Proteasome-Associated Autoinflammatory
    Syndrome, Psoriasis 14 Pustular, Spondyloenchondrodysplasia, STING-Associated Vasculopathy
    with Onset in Infancy, TNF Receptor-Associated Periodic Syndrome), plus two entries that
    already carried the classification but had never been listed here (A20 Haploinsufficiency,
    Muckle-Wells Syndrome) -- those two were reachable by classification and not by grouping,
    which is the gap this grouping exists to close. Each member carries
    differentiating_mechanisms stating what separates it from its siblings, with the gene
    binding taken from the member entry's own gene_term.

    MONDO consistency. The mapping's consistency note claimed both members were is-a
    descendants of MONDO:0019751. Re-run against the full member list with `runoak -i
    sqlite:obo:mondo descendants -p i MONDO:0019751` (128 classes), fifteen of seventeen
    resolve inside that set; A20 haploinsufficiency (MONDO:0100222) and H syndrome
    (MONDO:0011273) do not. Both are nonetheless IUIS Table 7 rows, so this is MONDO's
    placement of those two classes rather than a membership error, and the note now says so
    instead of asserting a containment that no longer holds. Membership is decided by the
    HAS_CLASSIFICATION criterion, not by MONDO closure, so the criterion was left unchanged.

    Prose. grouping_rationale was extended to name the NF-kappaB arm and the
    secreted-enzyme case alongside the inflammasome and interferon arms, and to say why the
    grouping carries members whose presentation is not a periodic fever at all. notes were
    rewritten: the previous text described a two-member grouping and listed three entries as
    unclassified candidates, all three of which are now classified members.

    Coverage. Seventeen of the 56 disorders IUIS counts in Table 7 now have a dismech entry
    here, recorded in notes so the remaining gap is visible. POLA1 / X-linked reticulate
    pigmentary disorder is dual-listed by IUIS in Tables 2 and 7 and was deliberately not
    touched.

    Validation: just validate-grouping and just check-groupings --strict both pass with all
    seventeen members SATISFIED against the NECESSARY iuis_category criterion.

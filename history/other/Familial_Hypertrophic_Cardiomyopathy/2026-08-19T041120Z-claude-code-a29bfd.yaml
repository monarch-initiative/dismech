  summary: 'Create: Familial Hypertrophic Cardiomyopathy grouping (MONDO:0024573)'
  details: |
    Curated MONDO:0024573 (familial hypertrophic cardiomyopathy; Orphanet:155, OMIMPS:192600) as a kb/groupings/ union rather than a third Disease entry.

    Scope decision and why. DisMech already covers general hypertrophic cardiomyopathy at MONDO:0005045 (kb/disorders/Hypertrophic_Cardiomyopathy.yaml, carrying the full causal gene spectrum including phenocopy genes) and covers the individual familial forms as eleven separate Disease entries (CMH 2, 3, 4, 7, 8, 9, 20, 21, 25, 26 and the KLHL24/CMH29 entry). MONDO:0024573 is the class sitting between them. A Disease entry for it would duplicate the umbrella pathograph while asserting nothing the members do not already assert; the curatable content specific to this concept is the membership boundary and the per-member differentiators, which is exactly what a Grouping records. Five existing entries already cite MONDO:0024573 only as a parent term in notes/differential blocks, so nothing had to be retargeted.

    Membership. Eleven DISEASE members, each carrying its MONDO disease_term for auditability and a differentiating_mechanisms block written on the mechanistic axis that actually separates it from its siblings: which component of the contractile apparatus is perturbed (thin-filament regulation TNNT2/TNNI3/TPM1; lever arm MYL3; cross-bridge brake MYBPC3; Z-disc and titin spring TTN/TCAP/FLNC/NEXN), which allele class is operative (MYBPC3 truncating haploinsufficiency vs missense poison peptide; FLNC missense giving hypertrophy where FLNC truncation gives arrhythmogenic/dilated disease), and how strong the gene-disease evidence is. CMH21 carries no gene descriptor because its causal gene is unidentified (7p12.1-q21 linkage locus).

    Boundary work, recorded rather than assumed. MONDO:0024573 absorbs the OMIM CMH phenotypic series, so its asserted is_a descendants include Noonan syndrome and the RASopathies, LEOPARD syndrome, Beckwith-Wiedemann syndrome, myotonic dystrophy type 1, VLCAD and MADD deficiency, and cardiomyopathy-hypotonia-lactic acidosis syndrome. All of those are syndromic or metabolic phenocopies that the class definition's own qualifying clause ("in the absence of predisposing conditions") excludes. The grouping follows the definition, not the asserted descendant set, and the divergence is recorded in the mapping consistency note rather than silently applied. PRKAG2 Cardiac Syndrome, Immunodeficiency 93 and HCM, Immunodeficiency 80, and Cardiomyopathy-Hypotonia-Lactic Acidosis Syndrome are excluded for the same reason, each with its reason named in notes. The MONDO:0005045 umbrella entry is excluded as the grouping's superclass, not as a member.

    KLHL24/CMH29 is the one member the sarcomere-centred rationale fits least well: KLHL24 is a Cullin-3 E3 ubiquitin-ligase substrate adaptor, so the mechanism is proteostatic/intermediate-filament with polyglucosan bodies, and inheritance is recessive. It is retained because MONDO asserts CMH29 under this class and it is a non-syndromic familial HCM, but the divergence is stated on the member so a future decision to move it out is not blocked by silence.

    Criteria design. Two NECESSARY blocks, no SUFFICIENT block. Block 0 is the clinical necessary condition, written as an OR over HP:0001639 (hypertrophic cardiomyopathy, plus descendants through closure) and HP:0001712 (left ventricular hypertrophy) because HP:0001712 is NOT an HPO descendant of HP:0001639 - verified with runoak - and CMH9 and CMH21 carry only the latter. Block 1 is the mechanistic necessary condition, an OR over the GO:0003300 cardiac-muscle-hypertrophy process annotation and conformance to cardiomyopathy_maladaptive_remodeling, because CMH9 and CMH29 carry the GO annotation without the conforms_to edge while CMH21 carries the conforms_to edge without the GO annotation. Both blocks were written as disjunctions so that every listed member resolves to SATISFIED on the annotations the entries actually carry, rather than introducing curated contradictions.

    The Mendelian-inheritance clause is stated in prose in the block description and NOT as a structured HAS_INHERITANCE leaf: that predicate evaluates to UNKNOWN, and inside a conjunction it would mask the clauses that are checkable. The sufficient direction is deliberately withheld and the reason is recorded in grouping_rationale - "in the absence of predisposing conditions" is not reducible to a positive machine-checkable condition, and any sufficiency criterion built from HCM phenotype plus sarcomere gene would sweep in the syndromic MONDO descendants and would also flag the MONDO:0005045 umbrella entry, this grouping's own superclass, as a candidate member.

    Mapping. skos:exactMatch to MONDO:0024573 with a consistency note recording the two divergences from MONDO's asserted descendant set. exactMatch (rather than closeMatch) is the honest predicate here because the concept is the same; the numbered CMH entities MONDO carries without DisMech entries (CMH 1, 6, 10-19, 22-24, 27, 28, 30, 31) are curation gaps, and they are named as such in notes, with CMH1/MYH7 flagged as the highest-value follow-up since MYH7 is one of the two commonest causes of the disease and is currently represented only inside the umbrella entry and as a digenic modifier in CMH3.

    Evidence. Four EvidenceItem snippets on the two criteria blocks (PMID:28912181 x3, PMID:31006259) plus five reference findings with supporting_text (PMID:30681346 x3, PMID:28912181, PMID:28408708). All references were fetched with just fetch-reference; no cache file was hand-written. No title-quoting snippets were used - every snippet states a finding. PMID:29459239 was fetched as a candidate and discarded: its cached record is about diabetes and hypertension, not hypertrophic cardiomyopathy.

    Validation run and read. just validate-grouping: schema OK, term validation passed, reference validation passed with "Snippets checked: 4/4 verified against cached references". The five references[].findings[].supporting_text spans are not counted by that wrapper, so they were additionally verified as normalized substrings of their cached reference bodies with a short script - all five OK. just check-groupings: structure OK, and all 11 members SATISFIED on both NECESSARY blocks with zero contradictions; the per-leaf NOT_SATISFIED lines printed for the unsatisfied arm of each OR are expected, not violations. just check-duplicate-keys and just check-title-snippets both pass. The rendered grouping page was generated to confirm it renders, then deleted (derived artifact, not committed).

    No existing kb/disorders entry was modified. In particular, no conforms_to edge or GO annotation was added to CMH9, CMH21, or CMH29 to make them satisfy a tighter criterion - the criteria were written to match the evidence the entries actually carry, and the gaps are named in notes instead.

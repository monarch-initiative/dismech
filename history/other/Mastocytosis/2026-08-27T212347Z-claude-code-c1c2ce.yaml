  summary: 'Create grouping: Mastocytosis (MONDO:0007950)'
  details: |
    Settled the root concept for MONDO:0007950 as a Grouping rather than a root Disease with has_subtypes, and created kb/groupings/Mastocytosis.yaml as a union over the two already-curated arms (Maculopapular Cutaneous Mastocytosis MONDO:0019316 and Systemic Mastocytosis MONDO:0016586).

    The concept decision. Issue #9035 carried the CURATE_ROOT_WITH_SUBTYPES priority hint, which issue #8727 records as a priority signal rather than a lump-versus-split ruling, so the choice was made on the evidence. Against a root Disease: the five WHO systemic subtypes (indolent, smouldering, aggressive, SM-AHN, mast cell leukemia) are already has_subtypes of the Systemic Mastocytosis entry and the monomorphic/polymorphic variants are already has_subtypes of the cutaneous entry, so a root Disease would have had to duplicate both curated blocks or nest subtypes inside subtypes; and a single blended pathograph spanning frequently-regressing paediatric skin disease and mast cell leukemia would assert a course and a treatment logic that is false at both ends. For a root Disease: KIT is a genuinely conserved driver across the spectrum. That argument was answered by pointing the shared chain at a future kb/modules/ module rather than at a blended root, which is the pattern CLAUDE.md already applies to diabetes (Grouping plus module plus per-type entries). MONDO's own metadata corroborates the decision: MONDO:0007950 carries subset disease_grouping and subset ordo_group_of_disorders, records no causal gene (RO:0004003) and no OMIM xref, and its NCIT-sourced definition describes a range rather than an entity.

    Membership criteria are declared NECESSARY_AND_SUFFICIENT over an AND of three leaves (HAS_GENE KIT, HAS_BIOLOGICAL_PROCESS increased mast cell proliferation, HAS_PHENOTYPE Mastocytosis). Sufficiency was chosen so the three known membership gaps (diffuse cutaneous mastocytosis, mastocytoma of skin, mast cell sarcoma) self-report as candidate members once curated, instead of depending on someone remembering to revisit this file. It was checked empirically before being asserted: evaluated over the whole knowledge base the criteria return no candidate non-members, so sufficiency is not silently pulling in KIT-mutant neoplasms of other lineages or monoclonal mast cell activation syndrome. The gene leaf names KIT rather than D816V deliberately, because paediatric cutaneous disease carries non-exon-17 variants about as often as codon 816 ones and a D816V leaf would contradict the curated membership of the cutaneous arm.

    Deep research: research/Mastocytosis-deep-research-falcon.md (falcon; 9/9 references resolved, confabulation rate 0). just preflight-dr returned SKIP because MONDO records no causal gene for a grouping-subset class, so the manual NEC preflight was run instead: the report's gene profile is dominated by KIT (76 mentions against SRSF2/ASXL1/RUNX1/TET2 at 6 each, which are the expected advanced-SM co-mutations rather than a rival entity), the MONDO definition and synonyms match the queried concept, and there is no OMIM xref to disagree with. No named-entity confusion. The report's citations are DOI-only and DOIs are snippet-skipped by the reference validator, so nothing was cited from it; every snippet in the grouping is a PMID quote verified against the local reference cache.

    Validation: just validate-grouping passed (schema, terms, references; 9/9 snippets verified); just check-groupings reports structure OK with both members SATISFIED against the N&S criteria; just check-duplicate-keys clean over 4404 files; just check-title-snippets reports no new title-quoting snippets.

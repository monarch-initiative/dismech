  summary: 'Review response: re-anchor the MPCM regression evidence'
  details: |
    Addressed the CHANGES_REQUESTED review on PR #9767.

    Blocking item. The MPCM member's differentiating_mechanisms rested its regression claim on PMID:28770635, whose pooled complete-resolution rate for urticaria pigmentosa is 1.9% per year with a 95% CI of -0.5% to 4.3%. Urticaria pigmentosa is maculopapular cutaneous mastocytosis, i.e. this member, so the interval crossing zero means that quote did not establish the claim it was attached to; the only statistically distinguishable figure in it, 10% per year, is for mastocytoma of skin, which this grouping's own notes list as an uncurated member. That mattered more than an ordinary precision nit because paediatric regression is the load-bearing empirical claim of the whole grouping-versus-root-disease argument.

    The fix keeps the claim and replaces the quote. PMID:25662299 (systematic review of 1747 paediatric cases, already cited in this file and already cached) now carries the rate with "Clinical regression (complete or partial) occurred in 67% of cases and stabilization in 27%." The cutaneous-versus-systemic contrast is carried by a second, new PMID:28770635 item quoting the sentence that actually states it ("Diffuse cutaneous mastocytosis and systemic mastocytosis subtypes did not show evidence of complete resolution in the studies reviewed."), rather than by prose adjacent to a different quote. The original pooled-rate item is retained but re-graded PARTIAL, with an explanation naming what each interval does and does not establish and stating that the regression claim rests on PMID:25662299.

    Reviewer suggestion 1, taken. The same review opens by rejecting "benign and spontaneously regressing" as a description of the individual case and closes with a fatal outcome in 2.9% of patients. Both are now quoted as evidence items, and both grouping_rationale and the MPCM member description state regression as a population-level contrast with the systemic arm rather than as a prognosis. This qualifies the framing without weakening the split argument, which needs the two arms' natural histories to differ, not the cutaneous arm to be benign.

    Reviewer suggestion 2, taken. reference_title added to all 13 evidence items, matching Necrotizing_Vasculitides and Inborn_Errors_of_Immunity.

    Reviewer suggestion 3 was an explicit non-change request (the midostaurin PARTIAL grading) and was left alone. The member-entry depth gaps the reviewer noted for Systemic_Mastocytosis (S/A/R co-mutations, TPSAB1 hereditary alpha-tryptasemia, anti-mediator symptomatic therapy, epidemiology) are pre-existing and out of scope for a grouping; they belong in an issue against that entry alongside the BMM subtype gap already logged.

    Validation: just validate-grouping kb/groupings/Mastocytosis.yaml passed (schema, terms, references; 13/13 snippets verified against cached references); just validate-terms passed; just check-duplicate-keys clean; just check-groupings kb/groupings/Mastocytosis.yaml --strict reports structure OK with both members SATISFIED; just check-snippet-length, check-title-snippets, check-snippet-grading, check-reference-titles and check-empty-snippets all report no new divergences. No reference cache file or term cache row was hand-written; the two quotes newly used were already present in references_cache/PMID_25662299.md and references_cache/PMID_28770635.md.

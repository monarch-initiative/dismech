  summary: 'Create grouping: RNU4ATAC spectrum disorder'
  details: |
    Resolved the stub for MONDO:0100558 (RNU4ATAC spectrum disorder) as a GROUPING. Two of its three MONDO descendants, MOPD I and Roifman syndrome, are already separate Disease entries with their own pathographs, so a spectrum Disease entry would duplicate them. The grouping lists both as members, with a NECESSARY_AND_SUFFICIENT HAS_GENE criterion on RNU4ATAC (hgnc:34016, bound in no other KB entry), an exactMatch MONDO mapping, and differentiating mechanisms keyed to the 5' stem-loop genotype rule (PMID:41808109) and the radiographic pattern (PMID:29265708). Lowry-Wood syndrome (MONDO:0009191), the third phenotype, has no entry, so a stub was added for it. All snippets were drawn from reference caches already committed for the two member entries. Validated with just validate-grouping-batch (schema, terms, 5/5 snippets, strict offline membership audit: both members SATISFIED). Claim issue: dismech issue 15654.

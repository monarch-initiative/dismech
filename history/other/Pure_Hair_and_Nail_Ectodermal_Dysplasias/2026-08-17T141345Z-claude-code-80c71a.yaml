  summary: 'Create: Pure Hair and Nail Ectodermal Dysplasias grouping'
  details: |
    Created a Grouping over the three gene-resolved PHNED entries (KRT85/ECTD4, already curated, plus the new HOXC13/ECTD9 and KRT74/ECTD7 entries) mapped to MONDO:0019071 with skos:closeMatch, rather than curating MONDO:0019071 as an umbrella Disease with has_subtypes as the issue's CURATE_ROOT_WITH_SUBTYPES tag suggested. Rationale is recorded in grouping_rationale: each gene form already has its own MONDO child term; KRT85 was already a standalone entry that an umbrella would duplicate or force a retarget of; and Hypohidrotic_Ectodermal_Dysplasias is the direct precedent for expressing an ectodermal-dysplasia umbrella as a Grouping. Per dismech#8727 and #8661 the dashboard tag is a priority hint, not a lump-vs-split ruling. NECESSARY criteria are positive only (hair-deficiency phenotype AND nail dystrophy AND one of KRT85/KRT74/HOXC13); 'just check-groupings' reports structure OK with all three members SATISFIED and no contradictions. The sparing of teeth and sweat glands is deliberately NOT encoded as a negated HAS_PHENOTYPE leaf, because evaluate_grouping collects phenotype_term HP ids without consulting frequency, so an EXCLUDED phenotype is indistinguishable from a present one and a negated leaf would report three spurious contradictions; the limitation is documented in the grouping notes. A KNOWLEDGE_GAP discussion records that MONDO:0019071's Orphanet-derived definition states autosomal dominant transmission while all three molecularly resolved members are autosomal recessive.

  summary: Revert negated criteria leaves; grouping audit back to 3/3 SATISFIED
  details: |
    Response to ai4c-reviewer finding 1 on PR 8774, and to an independent pre-PR review that reached the same conclusion. Commit a2947844a had lifted the sweat-gland and dental sparing into the NECESSARY criteria as two negated HAS_PHENOTYPE leaves on HP:0000966 and HP:0000668. Measured effect: the KRT74 and HOXC13 members flipped to NOT_SATISFIED while KRT85, which curates neither exclusion and is simply silent, continued to pass. Cause is in groupings.py extract_disease_facts, which records every phenotype_term HP id in phenotype_freq without consulting the sibling frequency, so an EXCLUDED phenotype is indistinguishable from a present one at evaluation time and modifier ABSENT is never read. The result inverted the intent: the two members doing the curation the criteria ask for were the two reported as contradicting them. Per CLAUDE.md a NOT_SATISFIED listed member is a contradiction between two curated assertions and there is deliberately no acknowledged-exception slot, so documenting it in notes was not a legitimate resolution. That commit is reverted here. The audit is back to structure OK with 3/3 SATISFIED and no contradictions. The superseded notes text claimed the leaves would fail for all three members; that was wrong, it is two, and the corrected note now states the measured result including which member passes and why. The evaluator fix that would make informative negatives work for every future grouping is deliberately left out of this curation PR because it changes verdicts for all groupings and for the existing entries already using frequency EXCLUDED, and so needs its own change with a KB-wide replay.

  summary: 'Grouping sync: IUIS Table 9 membership'
  details: |
    Expanded the grouping from one member to seven by reading IUIS 2022 Table 9 (Tangye et al., PMID:35748970, lines 4104-4287 of the cached reference) row by row and matching each row against kb/disorders/. Added Fanconi_Anemia, Dyskeratosis Congenita, Revesz Syndrome, Autosomal Dominant Aplasia and Myelodysplasia, Pancytopenia-Developmental Delay Syndrome, and Radioulnar Synostosis with Amegakaryocytic Thrombocytopenia. Each member block carries differentiating_mechanisms prose naming what separates it from its siblings (crosslink repair vs telomere maintenance vs transcription-coupled repair vs co-translational targeting vs a haematopoietic transcription factor) plus a gene binding copied from the member entry's own gene_term. The MECOM entry is the instructive case: it had carried classifications.iuis_category: bone marrow failure since before this grouping existed and was simply never listed here. just check-groupings cannot catch that, because it evaluates the members a grouping already names and never discovers omitted ones, so membership was diffed by hand against rg -l 'classification_value: bone marrow failure' kb/disorders/. That diff is now empty. Also rewrote the notes, which had said the grouping was single-member and had named Shwachman-Diamond syndrome and severe congenital neutropenia with marrow failure as candidate Table 9 entities. Both are Table 5. Diamond-Blackfan anaemia, which the old iuis_category enum description also placed in Table 9, is absent from IUIS 2022 entirely; that enum text was fixed in dismech#10107. The notes now list the Table 9 rows still lacking a dismech entry - MIRAGE (SAMD9), ataxia pancytopenia syndrome (SAMD9L), Coats plus (CTC1/STN1), BMFS5 (TP53) - and record that the founding member, Nijmegen Breakage Syndrome-like Disorder, is a Table 9 row in the IUIS 2024 update rather than in 2022 and is retained on that basis. Validation: just validate-grouping passed; just check-groupings reports all seven members SATISFIED against the NECESSARY HAS_CLASSIFICATION criterion.

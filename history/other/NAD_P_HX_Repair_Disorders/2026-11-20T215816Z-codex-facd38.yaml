  summary: Group NAD(P)HX Repair Disorders under OMIMPS:617186
  details: |
    Compared actual dated OMIM members with current main disease records. Added the explicit union, evidence-supported distinctions and necessary annotation criteria. The common metabolite-repair cycle supports the union; the two enzymes catalyze distinct reactions and their phenotypic spectra differ. Early encephalopathy is the historical series presentation, not a necessary finding in every affected individual: mitochondrial-isoform NAXD deficiency can spare the characteristic neurologic and skin phenotype. A shared gene-level repair-system criterion is therefore used without requiring seizures or encephalopathy.

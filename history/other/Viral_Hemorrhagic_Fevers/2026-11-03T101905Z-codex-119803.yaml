  summary: Add Omsk hemorrhagic fever to the viral hemorrhagic fevers
  details: |
    Added Omsk Hemorrhagic Fever to kb/groupings/Viral_Hemorrhagic_Fevers.yaml as a DISEASE member after the new disease entry declared conformance to viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability through its NS1-mediated endothelial permeability node.

    Wrote a sibling differentiator that distinguishes Omsk from the other flaviviral hemorrhagic fevers by its focal western Siberian Dermacentor/muskrat ecology, muskrat-contact exposure, and lack of an approved specific antiviral or licensed human vaccine. Refreshed the grouping rationale sentence that still listed only Lassa fever and Rift Valley fever as missing members; it now records Lassa fever, Rift Valley fever, Kyasanur Forest disease and Alkhumra hemorrhagic fever as remaining uncurated viral-hemorrhagic-fever candidates.

    Validation: `just validate-grouping kb/groupings/Viral_Hemorrhagic_Fevers.yaml`, `just check-groupings kb/groupings/Viral_Hemorrhagic_Fevers.yaml`, `just validate-grouping-batch kb/groupings/Viral_Hemorrhagic_Fevers.yaml`, `just check-entity-refs`, `just check-duplicate-keys` and `just check-enum-values` all passed. The strict offline grouping audit reports all members, including Omsk, as UNKNOWN because the first NECESSARY criterion is deliberately a non-machine-evaluable OTHER leaf.

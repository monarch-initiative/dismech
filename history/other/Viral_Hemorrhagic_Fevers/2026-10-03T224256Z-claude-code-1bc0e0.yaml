  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR dismech#13485.

    Blocking: PMID:41754561 (CRISPR-Based Detection of Viral Hemorrhagic Fevers at the Point of Care) backed two verified evidence items in the retired Viral_Hemorrhagic_Fever entry's diagnosis block and had been dropped with no destination - grep for the PMID across kb/ returned nothing. The reviewer is right that it cannot wait for a member stub: the review's scope spans Ebola virus, Lassa virus, dengue virus and Crimean-Congo haemorrhagic fever virus, four members across four virus families, so the point-of-care gap is a property of the group in the same way the reference-laboratory requirement kept from PMID:31668201 is.

    Added it as a references[] entry with two findings rows, placed immediately after the PMID:31668201 reference-laboratory finding so the two group-level constraints on the diagnostic pathway read together. The first records that the established molecular and serological tests are not point-of-care tests; the second records that CRISPR-based point-of-care assays are the proposed remedy and that their evidence base in these diseases is explicitly thin, so it is logged as an open direction rather than an established alternative.

    Both supporting_text quotes were hand-checked against references_cache/PMID_41754561.md, and the title copied from that file's frontmatter, because just validate-grouping reports 'Snippets checked: 0' for a Grouping - nothing in the validation stack checks the findings[].supporting_text slot. All 12 findings across the grouping's now-five references verify as exact substrings, and all five titles match their cache frontmatter. The check was re-run after the cache files were whitespace-normalized.

    The reviewer's observation that early leukopenia reads as a phenotype each member will eventually want, rather than a permanent group-level fact, is accepted as correct; no change, because the module's chain genuinely does not explain it and the member entries do not carry it yet.

    Not done here, deliberately: the stale 'Still open' line in design decisions section 3e that lists the Viral_Hemorrhagic_Fever conversion. PR dismech#13481 rewrites exactly that status paragraph and was already open and approved when this round was prepared, so editing the same lines here would conflict. Recorded in a reply on dismech#13485 instead.

    Validation: just validate-grouping passes (schema, terms, references; 5/5 titles, 0 issues); just check-groupings reports structure OK with all three members UNKNOWN, which is the correct three-valued answer for the non-machine-evaluable OTHER leaf and not a defect.

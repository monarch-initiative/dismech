  summary: Add Kyasanur forest disease to the viral hemorrhagic fever grouping
  details: |
    Added Kyasanur forest disease as a distinct tick-borne orthoflaviviral member of the viral hemorrhagic fever grouping.

    The differentiating text records the Western Ghats H. spinigera ecology, macaque/langur mortality as an outbreak sentinel, local formalin-inactivated vaccine, occasional neurologic relapse, and the current mechanistic limit: KFDV has primary-cell support for endothelial activation and dendritic-cell paracrine signaling, but the final vascular-permeability conformance remains indirect.

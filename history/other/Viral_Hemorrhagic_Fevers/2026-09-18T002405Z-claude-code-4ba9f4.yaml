  summary: 'Create: Viral Hemorrhagic Fevers grouping (from the retired VHF umbrella
    entry)'
  details: |
    Created kb/groupings/Viral_Hemorrhagic_Fevers.yaml as the rung-1 replacement for the membership half of the retired kb/disorders/Viral_Hemorrhagic_Fever.yaml umbrella entry (design decisions section 3e, rules R4 and R20). The mechanism half is kb/modules/viral_hemorrhagic_fever_syndrome.yaml.

    Members are the three viral hemorrhagic fevers that already have Disease entries: Ebola Virus Disease (EVD), Dengue, and Hantavirus Hemorrhagic Fever with Renal Syndrome. Each carries differentiating_mechanisms naming virus family, reservoir or vector, geography, organ emphasis and specific therapy, which are the axes on which the members are deliberately kept split. The old entry's other five one-line subtypes have no entry and became stubs rather than being dropped.

    Criteria are NECESSARY: caused by a hemorrhagic fever virus (an OTHER leaf, because CriterionPredicateEnum still has no infectious-agent predicate, as Treponematoses also records) AND conforms to viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability. All three members declare that conformance.

    The MONDO mapping to MONDO:0018087 is skos:closeMatch, not exactMatch and not narrowMatch, and the justification says why: the intended boundary is the class's boundary so narrowMatch would be wrong, but only three of at least eight members are curated so exactMatch would assert a coextension that does not hold. closeMatch also has the right consequence under the MONDO coverage rule, since it does not retire the concept from the curation queue while most of the group is uncurated -- which the retired entry's disease_term binding did.

    Cross-group content from the old entry that is neither mechanism nor membership was preserved as references findings rather than dropped: the cross-VHF laboratory picture including early leukopenia, the three transmission categories, the shared nonspecific early presentation, the public-health response, the reference-laboratory diagnostic constraint, and the therapy and vaccine asymmetry that explains why the module carries no treatments block.

    Hantavirus pulmonary syndrome is deliberately excluded and the reasoning is in notes: the exclusion is a judgement about the clinical category, not about the mechanism, and that entry could reasonably conform to the module without becoming a member here.

    Validation: just validate-grouping and just check-groupings both pass; snippets in the references findings verified against cached references.

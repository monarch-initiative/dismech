  summary: Create the Undifferentiated Round Cell Sarcomas grouping
  details: |
    A six-member grouping over the round cell sarcoma differential: Ewing sarcoma, CIC-rearranged sarcoma, sarcoma with BCOR genetic alterations, round cell sarcoma with EWSR1-non-ETS fusion, desmoplastic small round cell tumour and clear cell sarcoma of the kidney. grouping_basis CLINICAL_CONVENTION, because the members share a diagnostic problem and not a mechanism: their drivers are unrelated fusions plus one internal tandem duplication, and the entries record no shared pathway.

    Three departures from the planned shape, all recorded in the grouping's own prose.

    Ewing sarcoma was added as a sixth member. The plan listed five. Ewing is in the WHO section in both the fifth and the sixth edition and is named first of the four in STB6; all three other WHO members in this grouping already name Ewing Sarcoma in their own differential_diagnoses; and the CIC survival figure, the BCOR survival figure and the CIC-versus-Ewing immunohistochemical panel are all stated as contrasts with it. A grouping of this differential without the entity the others are measured against would be wrong.

    The grouping is not named after either WHO edition's section. The planned title pinned it to WHO 2020. PMID:42839882, fetched for this PR, is the STB6 (2026) editors' review, and it renames the chapter to undifferentiated spindle and round cell sarcomas because several of the tumours show spindle as well as round cell morphology. It also splits the round cell sarcomas with EWSR1-non-ETS fusions category into NFATC2-rearranged sarcoma, kept in the section, and PATZ1-rearranged sarcoma, moved to tumours of uncertain differentiation. So one member's WHO category no longer exists. That is recorded on the member row with the STB6 quote, and flagged as an open question for the entry rather than acted on here. The entry's own notes had already called the category provisional and asked for its two strata to be read as separately evidenced, which is what STB6 has now acted on.

    The MONDO mapping is skos:relatedMatch on MONDO:0020661 undifferentiated round cell sarcoma, with consistency recorded as INCONSISTENT. Not one of the six members' primary MONDO terms resolves under that class, checked member by member through the OLS hierarchical-ancestors walk in scripts/grouping_mondo_consistency.py on 9 November 2026 - including the three entries that list undifferentiated small round cell sarcoma among their parents. A subsumption predicate would therefore be false for every member, and closure over that class would return no members at all. Recorded as inconsistent so the gap is visible; it is a candidate MONDO classification report rather than a membership error.

    Two membership criteria. The first is NECESSARY and machine-checkable, HAS_CLASSIFICATION on the keyed tag icdo_morphology:Sarcoma, which all six satisfy and which excludes the non-mesenchymal round cell mimics that are deliberately not members. The second is NECESSARY and deliberately carries no logic: the condition is that the diagnosis is settled molecularly rather than morphologically, no structured field records that, and a proxy would either admit non-members or exclude members.

    PPR:PPR1332161 is the first preprint cited in this family. It carries one measured claim, that nineteen of twenty-three tumours whose diagnosis clinical sequencing refined had arrived as sarcoma NOS or undifferentiated round or small cell sarcoma, and it sits on the same criterion as the WHO review and a peer-reviewed study of the category, so it is never sole support. Its preprint status and its denominator limit are stated in the evidence item's own explanation. Issue #5865 was checked first as the plan required: it is a different preprint, PPR1272455, a ctDNA-MRD simulation framework, unrelated to this grouping.

    Clear cell sarcoma of the kidney is the weakest membership and says so. It enters on the BCOR internal tandem duplication it shares with the BCOR sarcoma, not on the WHO section or on round cell morphology, and its member row records that its own morphology and clinical identity are renal.

    Two reference_title values were written from memory in the first draft and caught by reference validation; every title in the file was then rewritten from the references_cache frontmatter by script, which corrected five.

    Validated with just validate-grouping (13 snippets, 16 titles, 0 issues), just check-groupings --strict --offline (structure OK, 6/6 SATISFIED), just validate-grouping-batch, just grouping-nesting-audit (standalone, no undeclared containment), and the per-file and whole-tree offline gates.

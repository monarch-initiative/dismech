  summary: 'Review round 1: correct which source sits beside the preprint, and cite
    two description claims'
  details: |
    The reviewer found a factual error in the file's own prose and it is corrected. Two places said the preprint is cited beside the WHO classification review on the same criterion. It is not: criterion 2 carries two BACKGROUND items from PMID:39381843 plus the preprint, and PMID:42839882 is cited only on the Ewing and EWSR1-non-ETS member rows. Verified by reading the criterion's own evidence list before changing anything. Both passages now name PMID:39381843, and the notes paragraph states where the WHO review actually is. The substance was never at risk - the preprint was not sole support either way - but the sentence is the stated reason a preprint is acceptable here and no validator can check it, so it had to be right. The PR body carried the same claim and is corrected too.

    Both suggestions taken.

    The DSRCT item citing DOI:10.1158/0008-5472.can-23-3334 moves from evidence_source: OTHER to HUMAN_CLINICAL. The reviewer's reading is the rule CLAUDE.md states: grade evidence_source from what the quoted sentence describes and let quote_role carry the citing paper's mismatch. The sentence states a human clinical and molecular fact about the tumour; BACKGROUND already records that a therapeutic study is not where it came from. This is the same correction applied on PR 16917 for a different paper, so taking it keeps the two consistent.

    That regrade creates a cross-file divergence, deliberately and with its own follow-up. The Desmoplastic_Small_Round_Cell_Tumor entry grades the same sentence OTHER, so just list-snippet-grading --cross-file now reports the pair. It is report-only, not a gate failure, because pairs involving OTHER are held until issue 10273 settles that convention. The entry's own item is the one that should change by the same rule, and that is a one-line edit outside this PR's scope.

    Two description claims that outran their evidence are now cited rather than trimmed. The DSRCT row's desmoplastic stroma gains PMID:9354795, where the authors read the fibrosis as a consequence of EWSR1::WT1 inducing PDGFA, graded INDIRECT because it is their proposed mechanism for the stroma rather than a measurement of it. The CCSK row's nests-and-cords morphology gains PMID:30736802, its introduction restating the established histology. Both references were already cached by their own member entries and both are graded HUMAN_CLINICAL there, so the gradings carry over unchanged. Citing rather than trimming was the right way round here because the CCSK morphology is load-bearing - it is the stated reason that membership is the weakest of the six.

    The reviewer's two not-applicable findings are correct and nothing was done about them: the GeneReviews baseline and the deep-research checklist do not apply to a grouping, which carries no phenotype or treatment content.

    Validated with just validate-grouping (15 snippets, 18 titles, 0 issues), just validate-grouping-batch, just check-groupings --strict --offline (structure OK, 6/6 SATISFIED), and the whole-tree baseline gates.

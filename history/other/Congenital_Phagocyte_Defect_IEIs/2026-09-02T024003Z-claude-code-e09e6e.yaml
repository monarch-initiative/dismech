  summary: 'Classify: IUIS 2022 Table 5 (phagocyte defects)'
  details: |
    Grouping sync for the IUIS Table 5 backfill: expanded members from 2 to 12.

    The grouping's single membership criterion is a NECESSARY HAS_CLASSIFICATION leaf keyed on 'iuis_category:phagocyte defect'. Ten entries were given that tag in this pass, so leaving members at 2 would have left the grouping silently under-reporting the table. Added member blocks for: Shwachman-Diamond syndrome, EFL1-related Shwachman-Diamond syndrome, Papillon-Lefevre Disease, Leukocyte Adhesion Deficiency Type II, Neutrophil Immunodeficiency Syndrome, Hereditary Pulmonary Alveolar Proteinosis, deafness-lymphedema-leukemia syndrome, Barth syndrome, Cohen Syndrome, Glycogen Storage Disease Type I.

    Each carries differentiating_mechanisms following the pattern of the two existing members: what distinguishes the member from its siblings, plus a gene binding taken from that entry's own gene_term. Hereditary PAP carries two blocks (CSF2RA and CSF2RB) because it covers two Table 5 rows. Four members carry explicit scope notes in the differentiator text: the SDS/EFL1 pair splitting four rows, GSD I being Ib-only within a combined Ia+Ib entry, Emberger being one presentation of a generically named GATA2 row, and Cohen being held on the IUIS row rather than on a curated mechanism.

    Notes rewritten to record what the grouping does and does not cover. 12 members cover 19 of the table's 42 gene rows (CGD accounts for six, the SDS pair for four, PAP for two). Twenty-two rows have no KB entry - ELANE, ITGB2, FERMT3, HAX1, CEBPE and CXCR2 among them. Three deliberate non-assignments are recorded so they are not re-flagged as oversights: cystic fibrosis (a real Table 5 row, but single-valued iuis_category makes tagging it a maintainer policy call), G6PD deficiency class I (a real row, but the KB entry is scoped to the erythrocyte enzymopathy and has no neutrophil content), and myeloperoxidase deficiency, which is NOT a Table 5 row - MPO is absent from the entire IUIS 2022 paper.

    The intentional absence of a MONDO mapping was left alone, as its grouping_rationale asks.

    Validation: validate-grouping passes; check-groupings and check-groupings --strict report all 12 members SATISFIED against the NECESSARY criterion; check-duplicate-keys and check-entity-refs pass.

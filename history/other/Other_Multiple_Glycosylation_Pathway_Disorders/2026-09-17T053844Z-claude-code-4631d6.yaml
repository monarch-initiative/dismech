  summary: State the NECESSARY criterion at its intended branch-generic level (GO:0009101)
  details: |
    Added a GO:0009101 glycoprotein biosynthetic process operand as the first member of this grouping's NECESSARY criterion OR, and rewrote the logic description. Membership is unchanged; no member was added, removed, or retargeted.

    The defect. UGP2-related developmental and epileptic encephalopathy 83, a listed member, evaluated NOT_SATISFIED against this criterion - a contradiction of the kind the curate-grouping skill says to resolve rather than encode. The criterion enumerated only specific branches (GO:0006024, GO:0006493, GO:0006487, GO:0034975), while the entry annotated a branch-generic ancestor. Ontology closure runs downward, so an annotation at an ancestor of a named process never satisfies that process.

    Why the criterion was the wrong side, not the entry. This grouping's own rationale says its members are grouped "at the pathway-placement level as other/multiple glycosylation pathway disorders" - that is, a member is here precisely because its lesion is NOT specific to one branch. Requiring a named branch therefore contradicted the grouping's stated concept. UGP2 is the clean demonstration: its lesion is UDP-glucose supply feeding several glycosylation branches at once, and its cited result (hypoglycosylated LAMP2) does not resolve to N- or O-linked in the source, so the entry is right to decline a branch and the criterion was wrong to demand one. This is the skill's "state the criterion at the intended conceptual level rather than compensating for a missing annotation" - there was no missing annotation to compensate for.

    Why GO:0009101 specifically. It is the common ancestor of GO:0006487 and GO:0006493, confirmed by reading both terms' ancestor lists in OLS, and it excludes glycoprotein catabolism (which its own parent GO:0009100 would have admitted, letting a lysosomal glycoprotein-degradation disorder satisfy a glycosylation criterion). Note for the next editor: GO:0006486, the identifier one would reach for as "protein glycosylation", does not exist in GO - an OLS lookup including obsolete entities returns nothing.

    The named-branch operands were kept rather than replaced. Closure makes GO:0009101 subsume them, so they add no members, but they record which branch a member that does name one perturbs, which is readable off the per-operand verdicts in the evaluator output.

    Companion changes in the same commit: the UGP2 entry's node moved from GO:0009100 to GO:0009101 (a specificity improvement standing on its own - see that entry's history record), and the umbrella grouping Disorders of Protein and Lipid Glycosylation gained the same operand to preserve its documented property of being exactly the disjunction of its children's criteria.

    Verification. linkml-validate against target-class Grouping: no issues found. dismech.groupings on this file: structure OK, all 3 members SATISFIED, no contradictions. On the umbrella: 27 of 27 SATISFIED, previously 26. check-duplicate-keys, check-enum-values and check-entity-refs clean.

  summary: Add the Golgi pH/cation, mistargeting and ER quality-control CDGs (5 ->
    12 members)
  details: |
    Added seven members, each of which satisfies this grouping's NECESSARY criterion (checked offline over cache/closure/go.csv): CCDC115-CDG (moved from Congenital_Disorders_of_Glycosylation), TMEM199-CDG, Congenital Disorder of Glycosylation Type IIr (ATP6AP2), TMEM165-CDG, Congenital Disorder of Glycosylation Type IIw (SLC37A4), CAMLG-CDG and EDEM3-CDG. The first four are Golgi pH or cation disorders, the class this grouping's ATP6V0A2 row already places here because the lesion is outside the glycosylation machinery and disables N- and O-glycosylation together; ATP6AP2 and CAMLG entries already carry icimd_category multiple_glycosylation_pathways. SLC37A4 (a mislocalised glucose-6-phosphate transporter) and CAMLG (the tail-anchored protein insertion receptor) are lesions outside the glycosylation machinery that disturb several branches. EDEM3, an ER alpha-1,2-mannosidase that marks misfolded glycoproteins for degradation, joins UGGT1 as an ER glycoprotein quality-control disorder. The description's member list, which still named only UGDH, UGP2 and UGGT1, now names every member by class, and notes records why the V-ATPase family is held here as one unit. Every differentiating_mechanisms row uses only what the member entry states, with gene bindings copied from the entry. Verified with just validate-grouping-batch.

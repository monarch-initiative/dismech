  summary: Add CMT type 4 and type X members; move the GJB1 mechanism off the CMT1
    row
  details: |
    Resolves #10915 for the grouping file.

    Membership. Charcot-Marie-Tooth Disease Type 4 (MONDO:0018995) and Charcot-Marie-Tooth Disease Type X (MONDO:0018994) were both curated Disease entries and neither was listed, so the grouping held the CMT umbrella entry plus only two of the four compartments. Both were added as member_type: DISEASE with their own differentiating_mechanisms, drawn from the two entries' own description and has_subtypes text rather than from new literature: CMT4 anchored on SH3TC2 (hgnc:29427) for the autosomal-recessive compartment and on MTMR2 (hgnc:7450) for the myotubularin/focally-folded-myelin arm; CMTX anchored on GJB1 (hgnc:4283) for the connexin-32 reflexive gap-junction lesion and on AIFM1 (hgnc:8768) for the rare non-connexin loci. Every HGNC CURIE was read out of cache/hgnc/terms.csv, not from memory.

    Misattributed mechanism. The CMT1 member row claimed 'GJB1 connexin-32 dysfunction in overlapping X-linked or intermediate CMT' as a CMT1 mechanism. GJB1/connexin-32 is the CMTX1 lesion, curated as has_subtypes#CMTX1 inside Charcot-Marie-Tooth_Disease_Type_X.yaml (PMID:8266101, PMID:17353473). The clause was removed and the row now points at the type X member row instead; 'demyelinating' was qualified to 'dominantly inherited demyelinating' and 'peripheral myelin' to 'compact-myelin' so the row distinguishes itself from the newly added CMT4 (recessive demyelinating) and CMTX (non-compact myelin) rows.

    Prose that enumerated members. description, grouping_rationale, and the MONDO mapping's consistency notes each named the member set and were all updated to the four-compartment framing.

    Known incompleteness recorded, not closed. Fourteen further curated CMT Disease entries remain unlisted (axonal 2C/2P/2S/2T, 4B3, 4D, 4K, dominant intermediate B/E/G, recessive intermediate D, X-linked recessive 4, Intermediate CMT, and the CMT-hearing-loss-intellectual-disability syndrome). This was outside the issue's scope and the intermediate and X-linked-recessive entries additionally overlap compartment members, so the set is listed in the grouping's notes as an explicit gap rather than left implicit. Hence outcome needs_followup.

    Validation. just validate-grouping passed (schema, terms, references). just check-groupings reports structure OK and criteria 0 SATISFIED for all seven members, including the two added. just check-duplicate-keys and just check-folded-hyphens clean. An unrelated full_text_attempted rewrite of references_cache/PMID_28905383.md, produced incidentally by the validator, was reverted to keep the diff to the two intended files.

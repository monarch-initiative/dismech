  summary: Correct the inheritance framing in the CMT grouping prose
  details: |
    Review round (#11662): the previous edit introduced a 'compartments are separated by inheritance' framing in three places, and CMT2 does not fit it. The grouping's own CMT2 member row already said 'SORD-related recessive axonal CMT2', and kb/disorders/Charcot-Marie-Tooth_Disease_Type_2.yaml curates a full Autosomal Recessive inheritance block (HP:0000007; CMT2B1/LMNA, PNKP, SORD-CMT2) backed by a cited snippet, so the grouping was asserting in prose something its own member entry refutes with evidence. Three phrase fixes. (1) description: 'type 2 (dominant axonal)' -> 'type 2 (predominantly dominant axonal)', and 'type 4 (autosomal recessive)' -> 'type 4 (autosomal-recessive demyelinating)'. (2) grouping_rationale: the separation is now stated as primarily cell-biological (demyelinating versus axonal) and only incompletely by inheritance, with the exception named explicitly - inheritance separates type X from the autosomal compartments and type 4 from type 1, but recessive axonal forms such as SORD-CMT2 and CMT2B1/LMNA sit under type 2. (3) The new Type 4 member row opened 'The autosomal-recessive compartment', which claims a boundary the KB does not draw; it now reads 'The autosomal-recessive demyelinating compartment' and points the reader at type 2 for recessive axonal forms. That sentence matters because it is what a curator uses to place a new recessive CMT entry. Also took the reviewer's first non-blocking suggestion: the rationale now says the four-compartment expectation is over compartments, not over CMT entries generally, and points at the notes block recording the fourteen curated CMT entries the list does not carry - the same 'prose enumerates a set the file does not hold' failure that opened #10915. The second suggestion (filing the 14-entry sweep as its own issue) is a repository-queue action left for a maintainer. validate-grouping, check-groupings, check-duplicate-keys, check-enum-values and check-folded-hyphens all pass; no membership or criteria evaluation changed, since this edit is prose only.

  summary: 'Review: Mucopolysaccharidoses grouping (criteria, member conformance,
    gene bindings)'
  details: |
    Review of the grouping against its own NECESSARY criterion, the live MONDO descendant set, and the member entries.

    Finding 1, a listed member failed the necessary criterion. Attenuated Mucopolysaccharidosis Type I (added 2026-08-27) declared no conforms_to on any module and carried no GO glycosaminoglycan-catabolism process, so the evaluator reported it NOT_SATISFIED on both the CONFORMS_TO_MODULE and HAS_BIOLOGICAL_PROCESS operands. The 2026-08-27 record's statement that all nine members were SATISFIED did not hold on main. Resolved on the member side, as dismech#4192 did for the other members: the entry now binds its accumulation node to lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation, its extracellular-matrix node to mps_gag_storage#Dermatan Sulfate-Driven Connective-Tissue and ECM Storage, and its degradation node to GO:0006027 glycosaminoglycan catabolic process, DECREASED.

    Finding 2, the evaluator read an excluded phenotype as present. Mucopolysaccharidosis type X records Dysostosis multiplex (HP:0000943) with frequency EXCLUDED and modifier ABSENT, to say the hallmark is absent; extract_disease_facts folded that record into the phenotype facts, so the Dysostosis multiplex operand was SATISFIED for MPS X by the record denying it. The verdict for MPS X was unchanged (the joint operands admit it, as the criterion text says), but the operand-level report was wrong. Fixed in src/dismech/groupings.py with tests; an EXCLUDED or ABSENT phenotype record no longer counts as presence.

    Finding 3, the CONFORMS_TO_MODULE leaf was anchored to a node that half the members do not use. MPS VI, VII, IX and X bind their enzyme-deficiency node to the trunk's Lysosomal Hydrolase or Cofactor Deficiency node and their accumulation node to the MPS-specific mps_gag_storage hub, so the anchor audit reported four SATISFIED_ELSEWHERE_IN_MODULE flips (dismech#9403). The leaf is now stem-only, with the reason recorded in its description, and a second stem-only leaf on mps_gag_storage was added: the grouping never referenced the module written for it, and the generic trunk leaf alone cannot distinguish an MPS from any other lysosomal storage disorder. Every member conforms to both stems after finding 1; the anchor audit reports no flips for this grouping.

    Finding 4, MONDO coverage. OLS lists 22 is-a descendants of MONDO:0019249. Twenty are covered by a member's disease_term or has_subtypes. MONDO:0001586 mucopolysaccharidosis type 1 is spanned jointly by Hurler syndrome (exact to MONDO:0011758) and Attenuated MPS I (broadMatch only), so it has no exact or narrow match although no MPS I concept is uncurated; the consistency note now says so rather than naming Morquio syndrome C as the only gap. Morquio syndrome C remains deliberately uncurated.

    Finding 5, gene bindings. Sanfilippo syndrome carried only SGSH and Morquio syndrome only GALNS, although the member entries curate MPS IIIB, IIIC, IIID and IVB as subtypes. Added NAGLU, HGSNAT, GNS and GLB1 as differentiating mechanisms, copied from the cached HGNC rows the member entries already bind.

    Finding 6, recorded without change. The KB also carries a Disease entry named Mucopolysaccharidosis on the same MONDO:0019249 this grouping is exact to; the notes now say how the two relate and point at dismech#3614, which is that entry's own open review. The Lysosomal Storage Disorders grouping's row for this nested grouping still describes the members as having dysostosis multiplex and coarse facies, which MPS IX and X do not; left for that grouping's own review.

    Validation: linkml-validate (Grouping and Disease), linkml-term-validator on the member entry (all terms already cached, no cache change), check_entity_refs, check_causal_targets, check_duplicate_keys, the grouping evaluator (nine of nine SATISFIED), the module-anchor audit, and the grouping pytest modules including the new tests.

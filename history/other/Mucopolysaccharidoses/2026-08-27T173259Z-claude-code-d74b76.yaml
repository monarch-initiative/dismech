  summary: 'Update Mucopolysaccharidoses grouping: new members and boundary documentation'
  details: |
    Added the two newly curated members (Mucopolysaccharidosis type X, Attenuated Mucopolysaccharidosis Type I) and brought the grouping prose in line with them. Corrected the MONDO consistency note, which still said 'all 4 listed members' after membership had grown to nine. Extended the OR-criterion description so it explains why MPS X, like MPS IX, is admitted by the joint operands rather than by the two classic hallmarks: its primary reports state that typical dysostosis multiplex was not observed and that coarse facies is age-dependent and absent in younger patients. Added a boundary section to notes recording, with reasons, the disorders that look like members and are not - MPS-plus syndrome (storage without an enzyme deficiency, a VPS33A membrane-tethering defect), multiple sulfatase deficiency (a post-translational modification failure disabling all sulfatases at once), the mucolipidoses (mannose-6-phosphate trafficking), ARSG deficiency (MPS IIIE in mouse but Usher syndrome type 4 in humans, so the human disease fails the connective-tissue operand), and Morquio syndrome C (a disputed historical entity and the only remaining uncurated MONDO descendant). check-groupings reports all nine members SATISFIED against the NECESSARY criterion.

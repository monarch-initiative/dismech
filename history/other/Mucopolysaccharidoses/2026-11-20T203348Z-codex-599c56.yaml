  summary: Map mucopolysaccharidoses to OMIMPS:607014
  details: |
    PS607014 represents the mucopolysaccharidosis family and contains thirteen records in January 2026, including separate Hurler, Hurler-Scheie, and Scheie entries within MPS I. This grouping retains the same family concept while distinguishing the deficient enzymes, GAG substrates, inheritance, and neurologic involvement. The inspected series omits the N-acetylglucosamine-6-sulfatase deficiency of MPS IIID, already within the Sanfilippo member here; this is a source-enumeration gap, not an exclusion from the MPS concept. ExactMatch aligns the family rather than asserting identical record counts or a universal recessive inheritance pattern. The first record OMIM:607014 is Hurler syndrome alone and is not interchangeable with the series.

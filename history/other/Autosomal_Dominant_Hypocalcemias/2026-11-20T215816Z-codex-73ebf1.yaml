  summary: Group Autosomal Dominant Hypocalcemias under OMIMPS:601198
  details: |
    Compared actual dated OMIM members with current main disease records. Added the explicit union, evidence-supported distinctions and necessary annotation criteria. The two diseases share enhanced calcium-sensing signaling and hypocalcemia, but perturb different signaling components. The series label Hypocalcemia is broader in ordinary language than its actual two-member enumeration; acquired hypocalcemia, other hypoparathyroid disorders and loss-of-function hypercalcemia alleles are outside this union.

  summary: 'Create grouping: Familial Dilated Cardiomyopathy'
  details: |
    Created kb/groupings/Familial_Dilated_Cardiomyopathy.yaml, the dilated-series counterpart of the Familial Hypertrophic Cardiomyopathy grouping. Maps skos:exactMatch to MONDO:0700335 (familial isolated dilated cardiomyopathy), chosen over the broader MONDO:0016333 because the isolated qualifier is exactly the boundary drawn; all eight members were verified to be direct MONDO children of MONDO:0700335, so consistency is CONSISTENT. Two NECESSARY criteria (HAS_PHENOTYPE HP:0001644; CONFORMS_TO_MODULE cardiomyopathy_maladaptive_remodeling), both verified against the entries actual annotations before writing - all 8 members evaluate SATISFIED on both, no contradictions. SUFFICIENT deliberately withheld, with the three entries such a criterion would wrongly capture named explicitly (the Dilated Cardiomyopathy umbrella, DSP Cardiomyopathy, Left Ventricular Noncompaction 8). Members: CMD1A (LMNA), 1AA (ACTN2), 1B (locus-only), 1DD (RBM20), 1G (TTN), 1HH (BAG3), 1Z (TNNC1), 2A (TNNI3), spanning five classes of cardiomyocyte lesion - the groups principal contrast with the sarcomere-dominated hypertrophic grouping, recorded via grouping_basis SHARED_MECHANISM + SHARED_PHENOTYPE and deliberately not SHARED_GENE_FAMILY. Curation gaps recorded (DES, FLNC, MYH7/CMD1S, SCN5A/CMD1E, TNNT2/CMD1D, LMOD2).

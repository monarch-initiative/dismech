  summary: 'Update grouping: add five definitive-gene DCM members'
  details: |
    Added five members to the Familial Dilated Cardiomyopathy grouping - CMD1D (TNNT2), CMD1E (SCN5A), CMD1I (DES), CMD1S (MYH7) and CMD2G (LMOD2) - taking it from 8 to 13. All five were verified to be direct MONDO children of MONDO:0700335 before being added, so the CONSISTENT mapping verdict still holds and the consistency note was updated from eight to thirteen. Audit re-run: 26/26 SATISFIED across 13 members by 2 NECESSARY criteria, zero NOT_SATISFIED, UNKNOWN or contradictions. Mechanistic-spread note rewritten - the group now spans seven-plus classes of cardiomyocyte lesion including sarcomeric motor (MYH7), thin-filament length specification (LMOD2), cytoskeletal intermediate filament (DES) and ion channel (SCN5A). Curation-gaps note rewritten: ten of eleven ClinGen-Definitive DCM genes are now represented, and FLNC is recorded as a MONDO nosology gap rather than a DisMech gap - there is no numbered CMD class for FLNC dilated cardiomyopathy, only the broad filaminopathy class MONDO:0016189, and the truncating-FLNC phenotype is arrhythmogenic/left-dominant rather than isolated-dilated.

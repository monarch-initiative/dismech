  summary: 'Create: Long QT Syndromes grouping'
  details: |
    Created the Long QT Syndromes grouping for MONDO:0002442 (long QT syndrome), the stub's umbrella term, and deleted the stub. Lump/split decision: GROUPING, because the term spans familial, acquired and syndromic long QT forms that DisMech curates as separate entries. Members are the 10 entries bound to MONDO:0002442 descendants; numbered long QT types are covered as subtypes of Familial Long QT Syndrome. Membership criterion: NECESSARY HAS_PHENOTYPE HP:0001657 Prolonged QT interval; all 10 members satisfy it over the HP closure (closure cache rebuilt to add the term). Acquired long QT syndrome (MONDO:1060292) is in scope and will join once its entry exists. The grouping lives under kb/groupings/, so it does not collide with kb/disorders/Long_QT_Syndrome.yaml (the familial entry); that file's slug is raised on issue 15894.

    Review round 1: the Familial Long QT Syndrome row now carries one differentiating mechanism per major gene (KCNQ1, KCNH2, SCN5A) instead of KCNH2 alone; notes explain that CACNA1C appears in two members (LQT8 as a familial subtype, Timothy Syndrome as its own member); creation_date set to the actual creation time.

  summary: Group Bent Bone Dysplasia Syndromes under OMIMPS:614592
  details: |
    Compared actual dated OMIM members with current main disease records. Added the explicit union, evidence-supported distinctions and necessary annotation criteria. The shared bent-bone skeletal phenotype supports the clinical union, but the receptor-localization and extracellular-matrix lesions are mechanistically distinct. FGFR2 bent bone dysplasia is not grouped by a generic gain-of-function FGFR mechanism. Other skeletal dysplasias with bowed bones do not enter solely through that finding.

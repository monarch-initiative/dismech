  summary: 'Re-derive MONDO consistency by inverted ancestor lookup: 18 of 19 members
    descend'
  details: |
    Corrected the MONDO consistency note, which read "14 of the 15 listed members" against an actual membership that had reached 19 - three of those added by me in the preceding commit, so I had made the staleness worse while reporting mappings as unchanged. The count is now 18 of 19, derived rather than estimated, and the stale sentence claiming gaps are derivable "from this exact mapping" was corrected too: this row is skos:narrowMatch since the umbrella was created, and scripts/grouping_mondo_gaps.py derives gaps only from exactMatch, so gap derivation for MONDO:0015286 now comes from the parent grouping.

    Method, and why it is the point. The previous check expanded MONDO:0015286's descendant closure (169 terms) and tested members against it. That is the expensive direction and needs a local 588 MB MONDO build, because the configured ols:mondo adapter raises NotImplementedError for descendants - which is why this note sat stale and was recorded as unfixable offline. Inverting it removes the problem: resolve each member's own MONDO term to its ancestor set and look the class up in it. Each walk returns 13-38 terms, it is bounded by the member rather than by the ontology, and the OLS REST hierarchicalAncestors endpoint serves it directly even though the OAK wrapper over the same service does not expose it.

    Result: 18 of 19 members are hierarchical descendants of MONDO:0015286. The single exception remains VPS51-Related Pontocerebellar Hypoplasia-CDG, exactly as the previous note described it, so that paragraph is unchanged. The three members added in the preceding commit (MOGS-CDG MONDO:0011629, B4GALT1-CDG MONDO:0011772, CCDC115-CDG MONDO:0014789) all descend, which retrospectively supports their addition.

    No membership, criteria, rationale or predicate change. The consistency verdict stays CONSISTENT: one non-descendant out of 19, already documented as an upstream MONDO classification gap rather than a membership error.

    Verification. linkml-validate against target-class Grouping: no issues found. dismech.groupings: structure OK, 19/19 SATISFIED. check-duplicate-keys, check-enum-values, check-entity-refs and check-folded-hyphens clean.

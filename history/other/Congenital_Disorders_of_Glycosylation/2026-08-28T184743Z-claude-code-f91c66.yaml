  summary: 'Follow-up #9787: add PMM2-CDG as a member of the CDG grouping'
  details: |
    Adds PMM2-Congenital Disorder of Glycosylation to the members list. Deferred from PR #9755 review and tracked in issue #9787, held back deliberately because it edits a shared file and because the member string could not be written correctly until the PMM2 entry existed on main.

    Member string casing. members[].member matches the disease entry's top-level name field exactly. Existing members use the lowercase form (ALG9-congenital disorder of glycosylation); the PMM2 entry's name is title-cased (PMM2-Congenital Disorder of Glycosylation). The string was copied from the merged file rather than reconstructed by analogy with its siblings, which would have produced a foreign key that does not resolve. The unique-name foreign key check in tests/test_data.py is what would have caught it, but only after the fact.

    Placement. Inserted first rather than appended. PMM2-CDG is the commonest CDG by a wide margin and the reference case the others are described against, so listing it after thirteen rarer members would have misrepresented the group. The grouping_rationale's precursor-pool clause was updated from (MPI, PGM1) to (PMM2, MPI, PGM1) to match, since PMM2 is a precursor-supply defect rather than an assembly defect.

    differentiating_mechanisms. Written to say what distinguishes PMM2 from its siblings rather than to restate what PMM2-CDG is. Two points: it is upstream of every mannosyltransferase defect in the grouping, so ALG1/ALG3/ALG9/ALG12 each lose one step while PMM2 loss starves all of them of GDP-mannose donor; and MPI is its instructive counterpart, being the adjacent step in the same supply line but treatable with oral mannose where PMM2-CDG is not. The second paragraph records the group's genetic architecture, which is clearest in PMM2: complete loss of activity is not compatible with survival, so patients are hypomorph compound heterozygotes and per-allele residual activity sets severity.

    Criteria satisfaction was checked rather than assumed. The grouping's single NECESSARY criteria block is an OR over GO:0006487 (protein N-linked glycosylation) and GO:0006491 (N-glycan processing). The PMM2 entry carries GO:0006487 directly, so just check-groupings reports SATISFIED on the combined expression; the individual NOT_SATISFIED on the Golgi-processing leaf is expected and is shared by most existing members, since the criterion is a disjunction. The descriptor is also declared explicitly on the member's differentiating_mechanisms so the satisfaction is visible in the grouping file itself.

    Validation: just validate-grouping passed. just check-groupings kb/groupings/Congenital_Disorders_of_Glycosylation.yaml reports structure: OK and SATISFIED for all fifteen members including the new one. No evidence items were added, so there are no snippets to verify.

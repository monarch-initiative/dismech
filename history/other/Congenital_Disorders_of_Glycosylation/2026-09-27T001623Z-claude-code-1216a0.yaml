  summary: 'Review round on #12948: drop the now-false ''Known stale'' paragraph'
  details: |
    Review round for PR #12948 (ai4c-reviewer, CHANGES_REQUESTED). Notes only; membership, criteria and mappings unchanged.

    Removed the paragraph beginning "Known stale: the MONDO consistency note in mappings above reads '14 of the 15 listed members'". It was written when the count could not be re-derived offline, and it became false in the very next commit, which re-derived the mapping note to 18 of 19 by inverted ancestor lookup. The file was left asserting both at once - a corrected count in mappings and a warning above it saying the count was stale. The warning is what goes; the corrected note stands.

    Also corrected the nesting sentence, which said the parent "holds the four glycosylation sub-groupings". It holds five since the O-linked child was added.

    This is the second-order cost of the pattern the earlier record described: a note recording a limitation is content, and it rots the moment the limitation is lifted. Flagging a known-stale value in prose is right when it cannot be fixed; deleting that flag has to be part of fixing it.


  summary: Nest under the ICIMD-18 umbrella; MONDO exactMatch -> narrowMatch
  details: |
    This grouping became a member of the new umbrella grouping Disorders of Protein and Lipid Glycosylation (ICIMD category 18). Membership here is unchanged - no disease was added, removed, or retargeted.

    Two edits.

    1. mappings.mondo_mappings: skos:exactMatch -> skos:narrowMatch against MONDO:0015286, with a rewritten mapping_justification. The grouping is deliberately scoped to protein N-glycosylation and its precursor and trafficking supply lines, which its own grouping_rationale states and defends at length, while MONDO:0015286 additionally covers O-linked, GPI-anchor and glycosphingolipid defects. exactMatch asserted a correspondence the rationale explicitly declines. The exactMatch now sits on the parent, whose scope is the whole MONDO class. Per CLAUDE.md, narrowMatch still counts as curated for MONDO coverage and epic-checklist synchronization, so this downgrade retires nothing from the curation queue.

    2. notes: recorded the nesting and the predicate move, and flagged a stale count. The MONDO consistency note still reads "14 of the 15 listed members" against a current membership of 16. The arithmetic was NOT corrected in place: whether the sixteenth member is an is_a descendant of MONDO:0015286 requires a MONDO build to answer, and replacing a stale number with an unverified one is not an improvement. Flagged for re-derivation on the next pass that has MONDO available.

    The consistency block itself, the membership_criteria, and the members list were left untouched.

    Verification. linkml-validate against target-class Grouping: no issues found. python -m dismech.groupings on this file: structure OK, all 16 members SATISFIED, no contradictions.

    Candidate members surfaced by the parent's SUFFICIENT ICIMD criterion that would belong here rather than in a sibling: B4GALT1-CDG, MOGS-CDG and CCDC115-CDG, all carrying classifications.icimd_category n_linked_protein_glycosylation and in no grouping. This looks like the same membership drift the 2026-08-20 review corrected for seven other CDG entries. They were not added, because each needs evaluating against this grouping's NECESSARY criteria first and that widens the change beyond the nesting it was scoped to.

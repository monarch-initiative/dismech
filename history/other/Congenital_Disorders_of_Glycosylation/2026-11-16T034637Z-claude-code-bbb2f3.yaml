  summary: Add 14 N-glycosylation CDGs (20 -> 33 members); move CCDC115-CDG to the
    multiple-pathway grouping
  details: |
    Membership had drifted: 14 KB entries that are MONDO descendants of MONDO:0015286 and already satisfy this grouping's NECESSARY criterion (GO:0006487 or GO:0006491, evaluated offline over cache/closure/go.csv) were in no glycosylation grouping. Added: DPAGT1-CDG, Congenital Myasthenic Syndrome 15 (ALG14), ALG2-CDG, ALG11-CDG, RFT1-CDG, ALG6-CDG, SRD5A3-CDG, STT3A-CDG, Congenital Disorder of Glycosylation Type ICC (MAGT1), SSR4-CDG, Autism Spectrum Disorder-Epilepsy-Arthrogryposis Syndrome (SLC35A3), COG3-CDG, COG4-CDG and COG8-CDG. Each differentiating_mechanisms row is written only from what the member entry itself states, with the gene binding copied from the entry's genetic[].gene_term. Two rows follow corrections from the same review rather than the entries' current text: SRD5A3 is described as reducing polyprenal to dolichal (the middle of the three-step conversion that the existing DHRSX row already records), and the MAGT1 row does not present intellectual disability as established, since a 23-patient cohort cited by that entry found none and ClinGen rates the association Disputed.

    CCDC115-CDG moved to Other_Multiple_Glycosylation_Pathway_Disorders, together with the related Golgi pH and cation disorders added there (TMEM199, ATP6AP2, TMEM165), so that the V-ATPase family is not split across two siblings. Reasons: that grouping's ATP6V0A2 row states that a Golgi luminal lesion disabling N- and O-glycosylation together is what places a disorder there; the O-linked grouping's boundary paragraph says the same of Golgi pH and calcium defects; MONDO classifies CCDC115 and TMEM199 under disorder of multiple glycosylation; and CCDC115's own icimd_category note describes a defect arising from disturbed Golgi homeostasis rather than from a glycosyltransferase. grouping_rationale and notes now list the members per step and say where the ion-homeostasis disorders are held.

    MONDO consistency re-derived with the OLS hierarchicalAncestors walk for the new members: 32 of 33 members descend from MONDO:0015286; VPS51 remains the exception. Retinitis Pigmentosa 59 (DHDDS) also satisfies the criterion and is a MONDO descendant, but was not added because its transferrin glycosylation is normal in almost all patients and its placement deserves a curator's decision. Verified with just validate-grouping-batch (schema, terms, references, strict offline membership audit).

  summary: 'Review + membership completion: CDG grouping 7 -> 14 members'
  details: |
    Audited the CDG grouping against the MONDO 2026-08 release. MONDO:0015286 has 169 is_a descendants; 23 kb/disorders entries bind one as their primary disease_term, of which 14 fall inside this grouping's declared N-glycan boundary (GO:0006487 OR GO:0006491). Only 7 were listed.

    Added 7 members with differentiating_mechanisms: ALG1-CDG (hgnc:18294), ALG3-CDG (hgnc:23056), DPM2-CDG (hgnc:3006), MPI-CDG (hgnc:7216), PGM1-CDG (hgnc:8905), SLC35A2-CDG (hgnc:11022), and VPS51-Related Pontocerebellar Hypoplasia-CDG (hgnc:1172). Twelve of the fourteen already declared conforms_to against the congenital_disorder_of_glycosylation module, so the module graph already treated them as CDG while the grouping did not - the omission was drift, not a boundary decision.

    Rewrote grouping_rationale to state the N-glycan boundary explicitly and name the sibling groupings that hold the concepts a broader CDG reading would pull in (Disorders_of_GPI_Anchor_Biosynthesis; Other_Multiple_Glycosylation_Pathway_Disorders; the tsr_o_glycosylation_quality_control module). UGGT1-CDG was deliberately NOT dual-listed here - it is an ER re-glucosylation quality-control defect already held by the sibling grouping.

    Corrected the MONDO consistency note, which claimed "All 7 listed members are is-a descendants". Verified state is 13 of 14; the exception is VPS51-Related Pontocerebellar Hypoplasia-CDG, which carries no disease_term because MONDO has no class for it - an ontology gap already documented in that entry's own notes, not a membership error.

    Extended notes with the type I / type II / mixed axis (PGM1 spans both) and a treatability axis (MPI oral D-mannose, PGM1 oral D-galactose).

    No kb/disorders entry was edited. Validation: just validate-grouping PASS; just check-groupings reports structure OK with 14/14 members SATISFIED and no contradictions; just validate-terms PASS, which added hgnc:7216 MPI to the term cache, followed by just normalize-cache; just check-duplicate-keys PASS; just check-term-cache-integrity PASS.

    Full review, per-member completeness census, 2023-2026 literature sweep, and prioritised follow-up work are in docs/reports/glycosylation-groupings-review-2026-08-20.md.

  summary: 'Create: FIG4-Related Disorders grouping'
  details: |
    Created a gene-axis grouping over the four kb/ entries that bind FIG4 on a disease or subtype row: Yunis-Varon syndrome, bilateral parasagittal parieto-occipital polymicrogyria, the CMT4J row of Charcot-Marie-Tooth Disease Type 4, and the ALS11 row of Amyotrophic Lateral Sclerosis. The local MONDO build links exactly these four diseases to FIG4 through RO:0004003 and has no grouping class for FIG4 disease, so no MONDO mapping is recorded. Prompted by the pediatric FIG4 cohort in PMID:42974926 (Gangfuss et al. 2026, open access in PMC13729235, cached as full text), which is cited for the CMT4J and polymicrogyria differentiators and in an open KNOWLEDGE_GAP discussion on the neurodevelopmental-dominant phenotype, for which MONDO has no term. Other member evidence reuses quotes already cited in the member entries. Validated with just validate-grouping-batch (schema, terms, 11 snippets and 11 titles, strict offline membership audit with all four members SATISFIED) and the snippet-length, title-snippet, folded-hyphen, duplicate-key and block-scalar-comment gates.

  summary: Align Congenital disorders of deglycosylation with OMIMPS:615273
  details: |
    The January 2026 OMIM series contains OMIM:615273 (NGLY1) and OMIM:619775 (MAN2C1), matching the two explicitly curated members. Protein deglycosylation and cytosolic free-oligosaccharide catabolism are different steps within the shared glycan-removal pathway, not interchangeable enzyme activities. This aligns the two-disease family rather than the first numbered member alone.

  summary: 'Review: CDDG grouping is MONDO-complete; both members lag their literature'
  details: |
    Reviewed the CDDG grouping and both member entries; no membership change was needed.

    Completeness check: MONDO:0031376 has exactly two is_a descendants in the 2026-08 MONDO release - MONDO:0800044 (CDDG1, NGLY1) and MONDO:0030770 (CDDG2, MAN2C1) - and both are curated, so the grouping is MONDO-complete. Recorded that check in notes with its date and release, together with the mechanistic thread that justifies the OR over deglycosylation and free-oligosaccharide catabolism: NGLY1 releases the N-glycan from an ERAD substrate and MAN2C1 trims the free oligosaccharide that release generates, so the two act in sequence on the same pool. Also recorded explicitly that completeness here reflects the small size of the concept, not the depth of the member entries.

    The OMIM phenotypic series OMIMPS:615273 that MONDO:0031376 xrefs was not independently enumerated; the note says so rather than implying it was checked.

    Member review found both entries substantially behind their literature, but no content was changed - that needs the full fetch-and-verify evidence workflow, not a review pass. NGLY1-CDDG cites 5 references, the newest from 2019, and carries no treatments, clinical trials, animal models, progression, or discussions; it is missing the NFE2L1/Nrf1 sequence-editing mechanism (PMID:41468431), the aging Ngly1 rat (PMID:41721346), AAV9-hNGLY1 gene replacement and its partial rescue (PMID:41176936, PMID:40687377), the 2026 prospective natural history (PMID:42114141), the 2026 multicenter cohort with new phenotypes and frequency data (PMID:42361657), the Engase modifier axis (PMID:28426790), and the SEL1L modifier (PMID:40773511). MAN2C1-CDDG2 is a single-source entry built entirely on PMID:35045343; a second patient report published 2026-01 (PMID:41623318) is uncited.

    Neither member declares conforms_to against any module, and no deglycosylation module exists for them to target.

    Validation: just validate-grouping PASS; just check-groupings structure OK with both members SATISFIED; just check-duplicate-keys PASS.

    Full review in docs/reports/glycosylation-groupings-review-2026-08-20.md.

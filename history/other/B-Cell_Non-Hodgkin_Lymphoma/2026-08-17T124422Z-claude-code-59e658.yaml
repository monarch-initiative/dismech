  summary: Address CHANGES_REQUESTED review on PR 8732
  details: |
    Addressed the four IMPORTANT findings from the ai4c-reviewer CHANGES_REQUESTED review. Finding 1: fixed the double-negated exclusion leaf — payload now carries the positive concept 'Hodgkin lymphoma' with negated:true (mirrors Inherited_Arrhythmia_Syndromes NOT-leaf precedent), so the axiom no longer double-negates to 'is Hodgkin lymphoma'. Finding 2: downgraded the MONDO:0015759 mapping from skos:exactMatch to skos:closeMatch and rewrote the justification/consistency notes to state the divergence is intensional, not a coverage gap — MONDO's logical intersection (B-cell neoplasm AND non-Hodgkin lymphoma) includes B-lymphoblastic precursor neoplasms and leukemic-presentation mature entities (CLL/SLL, hairy cell leukemia) that this mature/non-leukemic-presentation grouping deliberately excludes (Diabetes_Mellitus closeMatch precedent). Finding 3: qualified the shared-mechanism prose in both the description and grouping_rationale — BCR survival signaling with constitutive NF-kB prominent in ABC/marginal-zone/lymphoplasmacytic entities but characteristically absent in Burkitt lymphoma, which depends on tonic BCR-PI3K. Finding 4: changed DLBCL differentiating gene from MYD88 to BCL6 (hgnc:1001, canonical 3q27 DLBCL partner); WM keeps MYD88. Validated with just validate-grouping, just check-groupings (structure OK, no contradictions), and just validate-terms (BCL6 already cached). The 8-member clinical scope and Grouping shape were confirmed correct by the reviewer and left unchanged.

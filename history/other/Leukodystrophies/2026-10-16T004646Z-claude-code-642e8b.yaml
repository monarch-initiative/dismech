  details: |
    New grouping Leukodystrophies, membership following the Vanderver et al. 2015 consensus case definition and Table 1 (PMID:25649058), with a nested Hypomyelinating Leukodystrophies grouping (NECESSARY criterion: conforms to cns_myelin_failure OR has HP:0003429). MONDO:0019046 mapped as broadMatch because MONDO's class also holds disorders the consensus calls genetic leukoencephalopathies (mitochondrial, glycosylation). Consensus-table disorders without a dismech entry (LBSL, LTBL, MLC) are listed in notes. The HP closure cache was rebuilt for HP:0003429. Both groupings pass just validate-grouping-batch and check-groupings --strict --offline.

  summary: 'Create grouping: Pure Hair and Nail Ectodermal Dysplasias'
  details: |
    Created kb/groupings/Pure_Hair_And_Nail_Ectodermal_Dysplasias.yaml as a Grouping for MONDO:0019071 pure hair and nail ectodermal dysplasia, following the multi-gene-family modeling guidance in issue 8727 (Grouping, not umbrella Disease). grouping_basis SHARED_PHENOTYPE; one NECESSARY membership criterion (hair phenotype OR-branch AND nail dystrophy AND hair-follicle-development BP). One curated member so far: KRT85-Related Pure Hair-Nail Ectodermal Dysplasia (ECTD4), which audits SATISFIED. Distinguished in the rationale from the existing Hypohidrotic Ectodermal Dysplasias grouping by sparing of teeth and sweat glands. Flagged as a thin one-member grouping for reviewer judgment, and recorded an ECTD-numbering discrepancy: issue 8656 lists ECTD8=HOXC13/ECTD9=HR, but MONDO places HOXC13 at ECTD9 and includes no HR-associated child under MONDO:0019071. TODO members ECTD6/7/9 noted with verified MONDO IDs. Validated with just validate-grouping, just check-groupings SATISFIED, just validate-terms; cache rows normalized.

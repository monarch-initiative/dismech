  summary: 'Create grouping: Cerebellar Ataxias (MONDO:0000437)'
  details: |
    Curated MONDO:0000437 "cerebellar ataxia" as a Grouping rather than a broad Disease entry (issue #8941, CURATE_ROOT).

    Scoping decision. MONDO flags MONDO:0000437 as subset disease_grouping / ordo_group_of_disorders and defines it logically as an atactic disorder located in the cerebellum (RO:0004020 UBERON:0002037) rather than as a disease with its own mechanism. The conserved mechanism a broad Disease entry would have carried is already modeled in kb/modules/cerebellar_purkinje_degeneration.yaml, and the KB already holds 32 curated Disease entries that are MONDO is_a descendants of the term. Writing a Disease entry would have meant either duplicating the module or blending 32 pathographs into one umbrella graph; the diabetes precedent in CLAUDE.md (Grouping + module + per-type entries) applies directly.

    Member selection. Members are exactly the intersection of kb/disorders/*.yaml with the MONDO is_a closure of MONDO:0000437 (runoak -i sqlite:obo:mondo descendants -p i MONDO:0000437): 32 of ~170 descendants. Eight further ataxia-named KB entries that MONDO does not place under MONDO:0000437 are deliberately excluded and enumerated in the entry notes.

    Criteria. Two NECESSARY blocks, no SUFFICIENT block. Block 0 is an OR over HP:0001251 (Ataxia) and HP:0010871 (Sensory ataxia): a single HP:0001251 leaf reported FLVCR1-Related Retinopathy, a curated posterior-column ataxia, as a contradiction, because HPO files sensory ataxia under HP:0010831 impaired proprioception rather than under Ataxia, while the MONDO definition explicitly admits the proprioceptive route. Block 1 is an OR over module conformance, HP:0001317 structural cerebellar abnormality, sensory ataxia, and an OTHER escape leaf for members whose lesion is in the cerebellar connections. SUFFICIENT semantics were rejected because ataxia is a syndrome that also occurs secondarily in stroke, tumour, multiple sclerosis, paraneoplastic and toxic cerebellar degeneration and multisystem metabolic disease; PMID:28250961 makes the same three-tier distinction.

    Validation. just validate-grouping: schema OK, term validation passed, reference validation passed. just check-groupings: structure OK, 32/32 members SATISFIED on criteria block 0 and no NOT_SATISFIED (contradiction) verdicts on either block; the remaining UNKNOWNs on block 1 are the expected consequence of the non-machine-evaluable OTHER leaf and are documented in the entry notes. just check-duplicate-keys: OK. The two references (PMID:29421540, PMID:28250961) were fetched with just fetch-reference and every supporting_text was verified to be an exact substring of the cached abstract by direct string match; note the reference validator reports "no reference/snippet pairs" for grouping files, so references[].findings[].supporting_text is not covered by the automated snippet check. Three PMIDs guessed from memory in an early attempt turned out to cite unrelated papers and were discarded, along with their cache files, before any were used.

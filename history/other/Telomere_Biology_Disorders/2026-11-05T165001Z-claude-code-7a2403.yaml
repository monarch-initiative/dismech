  summary: 'Create grouping: Telomere Biology Disorders'
  details: |
    New kb/groupings/ entry for the short telomere syndromes, from stubs/Telomere_Syndrome.yaml (MONDO:0100137), which this replaces. Members: Dyskeratosis Congenita, Dyskeratosis Congenita Autosomal Recessive 2 (NHP2) and 6 (PARN), Dyskeratosis Congenita Digenic (TYMS/ENOSF1) and Revesz Syndrome (TINF2) and Bone Marrow Failure Syndrome 6 (MDM4), each with a gene-bound differentiating mechanism. One NECESSARY criterion, HAS_BIOLOGICAL_PROCESS GO:0000723 telomere maintenance, which every member's own curation binds; it is stated on the GO process rather than the telomere_attrition module because the digenic entry does not conform to that module. The MONDO mapping is skos:closeMatch, with consistency INCONSISTENT: MONDO's definition matches the concept, but none of the members' disease terms descends from MONDO:0100137 (checked with OLS hierarchicalAncestors), and its descendants include primary biliary cholangitis, ICF syndrome and familial cirrhosis. Bone Marrow Failure Syndrome 6 was first left out and added after review on PR 16995, because its own entry places it inside the telomere biology disorders and binds GO:0000723. Inherited Aplastic Anemia, Werner Syndrome, Hutchinson-Gilford Progeria Syndrome, POT1 Tumor Predisposition Syndrome and Idiopathic Pulmonary Fibrosis were considered and left out, with reasons in the rationale. Closure cache rebuilt for GO:0000723. Validated with validate-grouping, check-groupings --strict --offline (all members SATISFIED) and validate-grouping-batch.

events:
- type: CREATE
  outcome: changed
  summary: 'Create: WT1_Disorders grouping'
  details: |
    New grouping uniting the constitutional WT1 disorders as an explicit curated union: Denys-Drash Syndrome (new in this PR), WAGR Syndrome, and Meacham syndrome.

    It exists because the GeneReviews WT1 Disorder chapter (PMID:32352694) has retired Denys-Drash and Frasier as clinical designations in favour of one phenotypic continuum, while MONDO carries no umbrella term for that continuum to bind. A grouping lists members directly, so it can represent the continuum without asserting a MONDO term that does not exist and without collapsing entries whose lesion classes genuinely differ: dominant-negative zinc-finger missense, 11p13 contiguous deletion with haploinsufficiency, and the Meacham malformation combination.

    grouping_basis is SHARED_GENE_FAMILY plus SHARED_MECHANISM; the single NECESSARY criterion is HAS_GENE WT1, and all three listed members evaluate SATISFIED.

    Two exclusions are recorded in grouping_rationale rather than left implicit. Frasier syndrome (MONDO:0007635) belongs to this concept and is absent only because it has no Disease entry yet, which is logged as the outstanding curation gap in notes. Wilms Tumor (MONDO:0006058) is excluded on principle: it is the somatic tumor these syndromes predispose to, and design decisions section 3a keeps germline predisposition syndromes separate from the tumors they predispose to.

    Validation: just validate-grouping passed and just check-groupings reports structure OK with all three members SATISFIED. One authoring error was caught and fixed: the HAS_GENE leaf initially used a 'genes' list, but the predicate requires singular 'gene'.

  summary: Align Robinow syndrome with OMIMPS:268310
  details: |
    The January 2026 series enumerates the WNT5A-, ROR2-, DVL1-, DVL3- and NXN-related Robinow forms, corresponding to the five current members. The mapping aligns the named Robinow family; the existing discussion of FZD2-associated disease identifies wider molecular coverage to curate, not a sixth member present in this source snapshot. The pathway rationale preserves gene-specific lesions and inheritance rather than treating every WNT-pathway disorder as Robinow syndrome.

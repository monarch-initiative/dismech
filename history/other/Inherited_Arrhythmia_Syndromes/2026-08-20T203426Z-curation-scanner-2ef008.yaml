  summary: Admit four audited candidate members; hold FAF and TANGO2 for maintainer
    decision
  details: |
    Curation-scanner (high_effort) run against issue #4242. `just check-groupings` had reported six unlisted disorders as satisfying the grouping's NECESSARY_AND_SUFFICIENT criterion, up from the single candidate recorded in the 2026-07-27 audit comment. Four were admitted as members with differentiating_mechanisms and an explicit module: node anchor: CASQ2 CPVT (hgnc:1513), Jervell and Lange-Nielsen Syndrome 1 (hgnc:6294), Jervell and Lange-Nielsen Syndrome 2 (hgnc:6240) and Sinoatrial Node Dysfunction and Deafness (hgnc:1391). Two were deliberately withheld and the reasoning recorded in the grouping notes: Familial Atrial Fibrillation (issue #4242 decision A - a live contradiction between the N&S logic and the mapping_justification prose, a nosology call for a maintainer) and TANGO2 Deficiency Disorder (a false positive: crisis-driven cardiomyocyte ATP depletion rather than a channel/calcium-handling gene lesion, with cardiomyopathy in ~70% of the reported cardiac-crisis cohort that the NOT leaf fails to exclude because the entry declares no cardiomyopathy_maladaptive_remodeling conformance). Also recorded a tooling caveat verified in src/dismech/groupings.py: evaluate_grouping and extract_disease_facts both discard the '#Node' anchor and match module stems only, so the criterion's anchor is decorative; four of the fourteen members (the three sinoatrial ones plus JLNS2) do not declare the anchored node and would flip to NOT_SATISFIED if the evaluator were made anchor-aware. Across all groupings, 30 of 44 CONFORMS_TO_MODULE leaves are node-anchored and nine groupings have listed members declaring only the stem, so an evaluator fix is not a safe drive-by change. Validated with just validate-grouping (schema, terms, references all pass), just check-groupings (14/14 members SATISFIED, candidate list reduced to the two held items) and just check-duplicate-keys. No disorder entry, evidence item or reference cache file was touched.

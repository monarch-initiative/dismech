  summary: Map Ehlers-Danlos Syndromes to OMIMPS:130000
  details: |
    Prioritized from the CLINICAL.T01.01 disease list. Compared January 2026 OMIM membership with September 2026 MONDO and existing KB scope. PS130000 is the Ehlers-Danlos syndrome family series, with 23 records in January 2026 spanning classical, classical-like, hypermobile, vascular, arthrochalasia, spondylodysplastic, periodontal, cardiac-valvular, kyphoscoliotic, dermatosparaxis, musculocontractural, brittle-cornea, and COL12A1-related presentations. The latter is labeled Bethlem myopathy 2 in the source and overlaps the myopathic EDS category. This aligns the family concept represented by this grouping, not classical EDS alone and not a claim that all 23 forms already have explicit member rows. Shared connective-tissue fragility supports the grouping while the distinct collagen, matrix-processing, and other mechanisms remain separate. It does not assert a known causal gene for every hypermobile EDS case.

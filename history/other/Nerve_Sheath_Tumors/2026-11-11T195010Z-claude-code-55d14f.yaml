  summary: 'Create grouping: Nerve sheath tumours'
  details: |
    New Grouping over the five nerve sheath neoplasm entries dismech already holds: Schwannoma, Acoustic Neuroma, Neurofibroma, Malignant Peripheral Nerve Sheath Tumor and Granular Cell Tumor. Membership was decided two ways and both agreed. Each member's own disease term was resolved to its is-a ancestors against the local MONDO build, and MONDO:0002547 (nerve sheath neoplasm) was present in all five, which is what the skos:exactMatch mapping records; and each member's pathophysiology binds CL:0002573 (Schwann cell), which is the lineage the group is named for. That second criterion is written as a NECESSARY description with no machine-evaluable logic because the criterion predicate vocabulary has no cell-type predicate. The predisposition syndromes that cause several of these tumours - neurofibromatosis type 1, NF2-related schwannomatosis, schwannomatosis and neurofibromatosis-Noonan syndrome - are deliberately excluded: they are germline syndromes rather than nerve sheath neoplasms, they are outside the mapped MONDO class, and the cancer granularity ladder keeps a predisposition syndrome separate from the tumours it predisposes to. Validated with just validate-grouping, just check-groupings and just validate-grouping-batch, all clean; cache rows for MONDO:0002547 committed with the entry. Two read-only verifiers were then run in parallel against the file, split by axis. The bindings and hygiene axis came back clean. The claim-truth axis found three false statements, all since corrected and each re-checked against MONDO or the member entry before the correction was made. The malignant peripheral nerve sheath tumour row said transformation from a neurofibroma was the route in most cases, where that entry's own cited sentence puts the neurofibromatosis type 1 setting at about half and carries sporadic and radiation-associated subtypes for the rest. The rationale said none of the four excluded predisposition syndromes is inside the mapped class, which is false for schwannomatosis: MONDO makes MONDO:0008075 a direct subclass of schwannoma and the dismech entry binds the Schwann cell six times, so it meets both necessary criteria and is excluded on editorial grounds alone, which the rationale now says. The notes named hybrid nerve sheath tumour as an uncurated MONDO descendant; MONDO has no such class, and the notes now say so and name perineurioma (MONDO:0019404) instead. Congenital epulis (MONDO:0015528) was also found to be a curated descendant that is not a member, correctly so because it binds no Schwann cell, and is now recorded in notes. Two de-hedges in the schwannoma row were also undone. The grouping name was changed from the underscored form to the spaced form used by 131 of the 134 committed groupings.

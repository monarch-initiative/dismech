  summary: 'Nerve sheath tumours: add the malignant melanotic nerve sheath tumour'
  details: |
    Added Malignant Melanotic Nerve Sheath Tumor as a member. Its disease term, melanotic
    neurilemmoma (MONDO:0002558), was resolved to its ancestors against the local MONDO build
    (release 2026-09-01) and sits under nerve sheath neoplasm (MONDO:0002547), and
    just grouping-mondo-consistency reports all six members inside the mapped class; the entry's
    pathophysiology binds the Schwann cell (CL:0002573) three times, so it meets both necessary
    criteria. The member row summarises the entry: Schwann cells that make melanin, the renaming
    from melanotic schwannoma and the redefinition as potentially aggressive in the
    2020 and 2021 WHO classifications, which treat it as a distinct tumour rather than a variant
    of schwannoma, frequent recurrence and metastasis, and MONDO's split of the tumour between
    the entry's term under schwannoma and a parallel class, malignant melanocytic neoplasm of
    the peripheral nerve sheath (MONDO:0003863), under malignant peripheral nerve sheath tumor;
    every MONDO term the entry names for the tumour is MONDO:0002558 or MONDO:0003863 or sits
    under one of them. The row also says that the schwannoma entry lists the tumour, under its
    former name, as the histologic subtype Melanotic/Psammomatous Schwannoma. The description's
    list of members now names it. The malignant peripheral nerve sheath tumour row, which called
    itself the only malignant member, now says it is one of the two, and no longer calls itself
    the only member whose entry models arising de novo as a named facet, since the new member's
    entry also has a subtype for tumours arising outside a named syndrome, and its sentence
    on the two malignant members moves to the end, so that 'Its own entry' follows that tumour's
    name. The neurofibroma row no longer calls itself the only member whose malignant
    counterpart is a member, since the tumour that the schwannoma entry carries as its melanotic
    subtype is now a member under its WHO name. The rationale's list of excluded predisposition
    syndromes now gives examples rather than reading as complete, since the new member's entry
    records tumours arising in a syndrome the list does not name, and the next paragraph's
    'One of the four' now reads 'One of these four'. Resolving every disorder entry's disease
    term against the same MONDO build finds eight inside the mapped class, the
    six members, schwannomatosis and congenital epulis, so the two curated descendants the
    mapping justification accounts for are still the only ones. Validated with
    just validate-grouping-batch and just check-groupings --strict --offline.

  summary: 'Nerve sheath tumours: add perineurioma'
  details: |
    Added Perineurioma as a member. Its disease term, perineurioma (MONDO:0019404), was resolved to its ancestors against the local MONDO build and sits under nerve sheath neoplasm (MONDO:0002547), so it meets the first necessary criterion. The second necessary criterion required every member to bind the Schwann cell (CL:0002573); the perineurioma entry binds the perineurial cell (CL:0002576) and no Schwann cell, so the criterion, the description and the rationale now read 'a nerve sheath cell': the Schwann cell, or for perineurioma the perineurial cell. The epulis note adds that S-100 negativity alone would not set epulis apart, since perineurioma is mostly S-100-negative too. Congenital epulis, the curated descendant of the mapped class that the criterion keeps out, binds only mesenchymal cell (CL:0008019), so the widened criterion still excludes it; the criterion now says so and the epulis note names both cells. The member row summarises the perineurioma entry on main: the only member of perineurial rather than Schwann cell lineage; an intraneural form causing a slowly progressive, motor-predominant neuropathy, usually of one nerve and sometimes of a plexus, in children and young adults, and a soft tissue form with sclerosing and reticular variants; both benign, the soft tissue form rarely recurring; malignant perineurioma rare, its status as a distinct tumour disputed, and carried as a subtype that the entry records as a malignant peripheral nerve sheath tumour with perineurial differentiation. The neurofibroma row's sentence on members that carry their malignant form as a subtype now names perineurioma beside granular cell tumour. The notes sentence naming perineurioma and reticular perineurioma as uncurated descendants is removed, since the entry now exists and carries reticular perineurioma as a subtype; the sentence on hybrid nerve sheath tumours is kept as its own paragraph. Validated with just validate-grouping, just check-groupings and just validate-grouping-batch, which runs the strict offline audit.

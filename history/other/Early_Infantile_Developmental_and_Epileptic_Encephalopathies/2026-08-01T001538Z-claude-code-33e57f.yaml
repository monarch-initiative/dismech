  summary: 'Create grouping: Early-Infantile Developmental and Epileptic Encephalopathies'
  details: |
    Created kb/groupings/Early_Infantile_Developmental_and_Epileptic_Encephalopathies.yaml as a curated union over the molecularly defined DEE entries whose documented seizure onset falls at or before three months, matching the ILAE early-infantile DEE syndrome definition (MONDO:0800491, skos:broadMatch). Members: KCNQ2 DEE, SCN2A-Related DEE, STXBP1 Encephalopathy, CDKL5 Deficiency Disorder, UGDH-related DEE 84 - each with a differentiating_mechanisms block naming its divergent lesion and an OAK-verified HGNC gene descriptor. No deep-research run was needed: the member Disease entries already carry the curated pathophysiology, so this is a pure union model per the project umbrella-to-Grouping pattern. Membership criteria are a single NECESSARY block: an OR over the seizure phenotypes the members actually assert (HP:0001250, HP:0011097, HP:0012469, HP:0032792, HP:0007359), AND an OR over developmental-delay terms (HP:0001263, HP:0011344), AND an OTHER leaf carrying the at-or-before-three-months onset boundary that has no structured leaf predicate. The phenotype disjunctions are enumerated deliberately because the membership evaluator matches terms exactly without HPO subsumption; a single generic Seizure leaf produced spurious NOT_SATISFIED verdicts against members annotated only with a specific semiology. CACNA1E, SCN8A, GNAO1 and KCNA2 DEE entries were considered and excluded on documented onset grounds, and that exclusion is recorded in the grouping_rationale. Validated with just validate-grouping (schema, term and reference validation all passed), python -m dismech.groupings --strict (exit 0; all five members advisory UNKNOWN via the OTHER onset leaf, the expected outcome), scripts/check_folded_hyphens.py, and the grouping/foreign-key subset of tests/test_data.py.

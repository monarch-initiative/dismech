  summary: 'Create grouping: Hereditary Systemic Amyloidoses'
  details: |
    Created kb/groupings/Hereditary_Systemic_Amyloidoses.yaml per @cmungall's directive on issue #8655 (represent hereditary amyloidosis as a Grouping, not an umbrella Disease; do not treat CURATE_ROOT_WITH_SUBTYPES as has_subtypes). SHARED_MECHANISM grouping over the amyloidogenesis module; single NECESSARY criteria block = CONFORMS_TO_MODULE amyloidogenesis AND HAS_INHERITANCE (hereditary/germline). Current member: Hereditary Transthyretin Amyloidosis (ATTRv). ADan amyloidosis EXCLUDED after verifying MONDO parentage via sqlite:obo:mondo: MONDO:0007297 is a descendant of MONDO:0018634 but via cerebral amyloid angiopathy (MONDO:0005620) and ITM2B amyloidosis (MONDO:0018591) - a hereditary CEREBRAL amyloidosis with the ITM2B/BRI2 precursor, outside the systemic scope. Mapped to MONDO:0018634 with skos:broadMatch (NOT exactMatch) because the MONDO class is broader. TODO precursor members (AApoAI/APOA1, AApoAII/APOA2, AGel/GSN, AFib/FGA, ALys/LYZ) recorded in grouping_rationale. Validated: validate-grouping, check-groupings, validate-terms all pass.

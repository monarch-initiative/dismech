  summary: 'Review round: two missing members, and the uniqueness claims they falsified'
  details: >-
    A review round on PR #17125. The reviewer found the membership claim incomplete: two entries
    binding hgnc:7559 were neither members nor named as exclusions. Both are now members.
    Medulloblastoma_Non_WNT_Non_SHH records MYCN amplification as a SOMATIC_DRIVER;
    IDH_Mutant_Astrocytoma records focal amplification as COOPERATING and is the group's only
    adult-type diffuse glioma. The counts in notes are corrected to thirteen binding entries and
    twelve members, with one exclusion, and notes now says that the parent Medulloblastoma entry's
    absence does not mean medulloblastoma outside the SHH group is missing. The binding sweep was
    re-run against current main immediately before pushing.


    Two adversarial verifiers were then run against the file, split by axis, and both independently
    found the same consequence of adding the members, which the review round had not looked for: a
    uniqueness claim elsewhere in the file that the new members falsified. The ALK-Related row said
    it was the only member whose MYCN record is COOPERATING. IDH_Mutant_Astrocytoma's record is also
    COOPERATING, so two are, and this diff's own new row said so three lines away. The lesson is
    specific and worth stating: adding a member to a grouping can make an existing member's claim
    false, so every uniqueness claim in the file has to be re-checked against the new membership,
    not only the counts.


    A second false claim came from the same place. The new IDH row called it the group's only adult
    glioma. Ependymoma is a glial neoplasm by its own entry's description and categories, and the
    member stratum of it is the spinal one, which that entry places in adults. The row now says
    adult-type diffuse glioma, which is true and is what the IDH entry's own parents field records.


    A third was in the new Medulloblastoma row, and was false in each of its parts. It said the
    entry records MYCN without a subtype in contrast with the SHH-activated member, where
    amplification marks a high-risk stratum. Neither entry scopes MYCN to a stratum: both records
    lack a subtype key, and the SHH entry's high-risk stratum is defined by TP53. The reason given
    was also wrong in kind, since comparable frequencies across Group 3 and Group 4 is a fact about
    distribution and not about prognosis. The row now states the difference where it actually lives,
    in the two entries' prose, and names the hedge the SHH entry puts on its own MYC-family
    prognostic claim.


    Two smaller corrections. The Ependymoma row said that entry states its MYCN scoping only in the
    prose of one node; it states it in three places, all prose, and the load-bearing claim is that
    none of them is structural. And a sentence added to notes had been inserted mid-paragraph,
    breaking the antecedent of the pronoun that closed it; it now sits after that sentence.


    The CREATE record for this grouping was restructured in the same round so that its final
    reasoning is stated once rather than as a first draft followed by corrections, which is what the
    reviewer asked for. This round's own account is here rather than appended to it, because each
    history file records one session.


    Validation: just validate-grouping, just validate-grouping-batch and just check-groupings
    --strict --offline all pass, with all twelve members SATISFIED. just grouping-nesting-audit
    reports no new undeclared containment. No cache or references_cache file is touched.

  summary: 'Create grouping: MYCN dosage disorders'
  details: |
    New Grouping over the ten curated entries whose mechanism turns on MYCN dose or activity. Membership was computed rather than assumed: every kb/disorders entry was parsed and every hgnc:7559 binding located, in genetic records, on pathophysiology nodes and on has_subtypes rows. Eleven entries bind the gene. Ten are members and all ten satisfy the NECESSARY HAS_GENE criterion under just check-groupings. Three of the ten are typed SUBTYPE, under a rule stated in the rationale: the entry's own content scopes MYCN to one named stratum rather than to the disease. Retinoblastoma carries the gene on the has_subtypes row itself and nowhere else; Feingold syndrome scopes its gene record with a subtype: Type 1 foreign key, type 2 being MIR17HG; and Ependymoma states the scoping only in the prose of its MYCN Amplification in Spinal Ependymoma node - its SP-MYCN row carries no genes and neither MYCN record carries a subtype key, which is a gap in that entry and is recorded in the member's own row. The grouping deliberately spans three opposite directions of the same locus - somatic amplification driving a tumour, germline haploinsufficiency in Feingold syndrome, and a germline Thr58 phosphodegron variant that stops the protein being degraded in megalencephaly-polydactyly syndrome - and each member's differentiating_mechanisms says which claim that member makes. Grouping on a gene rather than on a mechanism is the point: SHARED_MECHANISM would be false of a set whose members run the gene in opposite directions, and GroupingBasisEnum has no value for a single gene, so the basis is OTHER with the axis stated in grouping_rationale. Two entries that bind MYCN are excluded with reasons in notes. Esophageal_Atresia carries it only as MYCN-associated Feingold syndrome with relationship_type SUSCEPTIBILITY, so it is a manifestation of a member rather than a sibling of one. Wilms_Tumor was nominated by the source report and its entry contains no occurrence of MYCN at all, so it cannot satisfy the criterion; that is recorded as a question for the Wilms entry rather than papered over by relaxing the criterion. No ALK content was added: the ALK-Related Neuroblastic Tumor Susceptibility member is described purely in terms of its COOPERATING MYCN record and carries no evidence. Two read-only verifiers were then run in parallel against the file, split by axis, and between them found six things, four of them hard. All are corrected. The SUBTYPE typing rationale claimed a structural basis that is false for Ependymoma, as above. The Megalencephaly-polydactyly row said the entry models a malformation syndrome rather than a tumour, which that entry contradicts: it carries a Neuroblastoma phenotype under category Neoplasm, a downstream edge to it and a treatment row, and it is already a member of Neuroblastoma_Predisposition_Syndromes. The contrast with Feingold syndrome is between the two dosage directions, not between syndrome and tumour. The notes said Esophageal_Atresia carries MYCN only as a SUSCEPTIBILITY record; it binds the gene twice, the second time on a Foregut transcription factor dysfunction pathophysiology node, which is one of the three places this grouping's own criterion names - so the exclusion now rests on the criterion's second conjunct rather than on a false count. The sentence above both exclusions said two entries bind MYCN when only one does. The description framed the whole group as somatic amplification driving a tumour, which over-reaches for the two BIOMARKER members. And the rationale said GroupingBasisEnum has no value for a single gene: its SHARED_GENE_FAMILY description reads caused by variants in the same gene, gene family, or functionally related set of genes, and WT1_Disorders and Dystrophinopathies both use it for one gene. OTHER is kept, on the narrower and true ground that SHARED_GENE_FAMILY asserts members are caused by variants in the gene, which is false of the two members that record amplification as a biomarker. Two entries that mention MYCN without binding it, Small_Cell_Lung_Cancer and the parent Medulloblastoma, are now named in notes so they are not re-nominated as oversights.

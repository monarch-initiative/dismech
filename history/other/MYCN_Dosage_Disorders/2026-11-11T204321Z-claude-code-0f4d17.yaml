  summary: 'Create grouping: MYCN dosage disorders'
  details: >-
    New Grouping over the curated entries whose mechanism or risk stratification turns on MYCN dose
    or activity. Membership was computed rather than assumed: every kb/disorders entry was parsed
    and every hgnc:7559 binding located, in genetic records, on pathophysiology nodes and on
    has_subtypes rows. Thirteen entries bind the gene. Twelve are members and all twelve satisfy the
    NECESSARY HAS_GENE criterion under just check-groupings.


    Three members are typed SUBTYPE, under a rule stated in the rationale: the entry's own content
    scopes MYCN to one named stratum rather than to the disease. Retinoblastoma carries the gene on
    the has_subtypes row itself and nowhere else; Feingold syndrome scopes its gene record with a
    subtype: Type 1 foreign key, type 2 being MIR17HG; and Ependymoma states the scoping only in the
    prose of its MYCN Amplification in Spinal Ependymoma node, its SP-MYCN row carrying no genes and
    neither MYCN record a subtype key, which is a gap in that entry and is recorded in the member's
    own row.


    The grouping deliberately spans three opposite directions of the same locus - somatic
    amplification driving a tumour, germline haploinsufficiency in Feingold syndrome, and a germline
    Thr58 phosphodegron variant that stops the protein being degraded in megalencephaly-polydactyly
    syndrome - and each member's differentiating_mechanisms says which claim that member makes.


    grouping_basis is OTHER. SHARED_MECHANISM would be false of a set whose members run the gene in
    opposite directions. SHARED_GENE_FAMILY was considered and rejected on a narrow ground, and not
    on the ground that it cannot describe a single gene: its description reads caused by variants in
    the same gene, gene family, or functionally related set of genes, and WT1_Disorders and
    Dystrophinopathies both use it for one gene. It is rejected because it asserts members are
    caused by variants in the gene, which is false of the two members that record amplification as a
    biomarker.


    One entry that binds MYCN is excluded, with the reason in notes. Esophageal_Atresia binds it
    twice, as a MYCN-associated Feingold syndrome record with relationship_type SUSCEPTIBILITY and
    on a Foregut transcription factor dysfunction pathophysiology node, so it meets the structural
    half of the criterion. The exclusion rests on the second half: that node bundles three
    transcription factors and says nothing about MYCN dose, and oesophageal atresia is itself a
    manifestation of Feingold syndrome, which is a member. Wilms_Tumor was nominated by the source
    report and its entry contains no occurrence of MYCN at all, so it cannot satisfy the criterion;
    that is recorded as a question for the Wilms entry rather than papered over by relaxing the
    criterion. Small_Cell_Lung_Cancer and the parent Medulloblastoma entry mention MYCN in prose
    without binding it and are named in notes so they are not re-nominated as oversights.


    No ALK content was added: the ALK-Related Neuroblastic Tumor Susceptibility member is described
    purely in terms of its COOPERATING MYCN record and carries no evidence.


    Two read-only verifiers were run in parallel against the file before the first push, split by
    axis, and between them found six things, four of them hard. All were corrected before that push,
    and the reasoning above is the corrected reasoning rather than the first draft's. The SUBTYPE
    typing rationale had claimed a structural basis that is false for Ependymoma. The
    Megalencephaly-polydactyly row had said the entry models a malformation syndrome rather than a
    tumour, which that entry contradicts: it carries a Neuroblastoma phenotype under category
    Neoplasm, a downstream edge to it and a treatment row, and it is already a member of
    Neuroblastoma_Predisposition_Syndromes; the contrast with Feingold syndrome is between the two
    dosage directions, not between syndrome and tumour. The notes had said Esophageal_Atresia
    carries MYCN only as a SUSCEPTIBILITY record, and had said two entries bind MYCN without being
    members when only one does. The description had framed the whole group as somatic amplification
    driving a tumour, which over-reaches for the two BIOMARKER members. And the rationale had said
    GroupingBasisEnum has no value for a single gene, which is false.

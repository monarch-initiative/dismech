  summary: 'MONDO closure re-derived by inverted ancestor lookup: 24/38 descend, exactMatch
    is wrong'
  details: |
    Replaced the UNKNOWN consistency block with a derived result, and the "outstanding MONDO closure" note with what the check found. The mapping predicate is deliberately unchanged.

    Method. The closure was declared UNKNOWN because the configured ols:mondo adapter raises NotImplementedError for descendants, and expanding MONDO:0015286 downward otherwise needs a 588 MB local build. Inverting the question removes that dependency: instead of expanding the class and testing members against the result, resolve each member's own MONDO term to its ancestor set and look the class up in it. One bounded upward walk per member, 13-38 terms each, against the OLS REST hierarchicalAncestors endpoint, which serves ancestors even though the OAK wrapper over the same service exposes neither direction. Descendant expansion is the wrong direction for this question in general: it scales with the ontology, the inverted form scales with the member list.

    Result: 24 of 38 transitively held members are hierarchical descendants of MONDO:0015286; 14 are not. Recorded as INCONSISTENT because that is the measurement.

    The 14 divide into two kinds and only one is a defect. Genuine scope difference: MONDO scopes its congenital-disorder-of-glycosylation class narrower than ICIMD category 18 does. The two deglycosylation members sit under MONDO:0031376 congenital disorder of deglycosylation, a sibling of MONDO:0015286 beneath MONDO:0019052 inborn errors of metabolism, and five of six GPI-anchor members are also outside the class; ICIMD places both inside category 18. Classification by clinical presentation rather than mechanism: Dystroglycanopathy under muscular dystrophy, Autosomal Recessive Cutis Laxa Type 2A under cutis laxa and hereditary skin disorder (verified independently against its direct parents, none of which is a CDG term), the SLC10A7 and EXTL3 entries under skeletal system disorder, the PIG-gene entries under the epilepsies, VPS51-CDG under pontocerebellar hypoplasia. The second kind are candidate MONDO term requests, not membership errors; no member was moved or removed.

    Why the predicate was not flipped. The measurement says the umbrella's concept properly contains the MONDO class rather than equalling it, which is skos:broadMatch. But the change is not free: per CLAUDE.md a broadMatch does not count as curated for MONDO coverage, and scripts/grouping_mondo_gaps.py derives descendant gaps only from an exactMatch. Since the N-glycan child was downgraded to narrowMatch when this grouping was created, flipping the umbrella too would leave MONDO:0015286 with no exactMatch anywhere in the family and silently end gap derivation for the entire CDG branch. Semantics and tooling point opposite ways, so the argument is recorded in the consistency block and left for a decision rather than actioned - this predicate has already been changed once this week and a second unilateral change in the opposite direction is not warranted.

    Outcome is needs_followup for that reason: the audit is complete, the decision it implies is not.

    Verification. linkml-validate against target-class Grouping: no issues found. dismech.groupings: structure OK, 38/38 SATISFIED, no candidates. check-duplicate-keys, check-enum-values, check-entity-refs and check-folded-hyphens clean.

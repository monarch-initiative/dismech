  summary: Bind the GPI operand to GO:0180046 so GPAA1 and PIGS satisfy the parent
    criterion
  details: |
    The NECESSARY criterion of this grouping is meant to be the union of its five sub-groupings' criteria, but its GPI operand was bound to GO:0006506 (GPI anchor biosynthetic process) while the Disorders_of_GPI_Anchor_Biosynthesis branch's own criterion uses GO:0180046 (GPI anchored protein biosynthesis). GO:0180046's closure (cache/closure/go.csv) also covers GO:0016255 (attachment of GPI anchor to protein) and GO:0120574 (GPI anchor remodeling). Glycosylphosphatidylinositol Biosynthesis Defect 15 (GPAA1) and 18 (PIGS) are transamidase-complex disorders that annotate GO:0016255, so they satisfied the branch but not the parent: just check-groupings --strict --offline on this file exited 1 on main, reporting both as NOT_SATISFIED via the nested GPI grouping. The strict audit only runs in CI when a grouping file changes, which is why the failure was latent.

    Fix: the GPI operand now binds GO:0180046, the same term as the branch. Because GO:0180046's closure includes GO:0006506, no member that previously satisfied the operand can lose it. Labels checked with runoak -i ols:go info for GO:0180046 and GO:0016255.

    Verification: just validate-grouping-batch on this file passes (schema, terms, references, strict offline membership audit). The audit still lists three unlisted candidates that satisfy the SUFFICIENT classification criterion (CAMLG-CDG, Congenital Disorder of Glycosylation Type IIr, Spondylo-ocular Syndrome); placing them in a branch is part of a wider review of glycosylation-grouping membership.

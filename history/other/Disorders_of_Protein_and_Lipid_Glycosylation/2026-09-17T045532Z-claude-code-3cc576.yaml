  summary: 'Create umbrella grouping: Disorders of Protein and Lipid Glycosylation
    (ICIMD 18)'
  details: |
    Created the umbrella grouping over the four existing glycosylation sub-groupings: Congenital Disorders of Glycosylation (N-linked), Disorders of GPI Anchor Biosynthesis (lipid glycosylation), Other Disorders of Multiple Glycosylation Pathways, and Congenital Disorders of Deglycosylation. It carries no direct disease members, following the Inborn_Errors_of_Immunity pattern of a pure parent over nested sub-groupings.

    Why it was created rather than folded into the existing CDG grouping. That grouping is deliberately scoped to protein N-glycosylation, a boundary its own grouping_rationale states and defends, while binding MONDO:0015286 with skos:exactMatch. MONDO:0015286 is the broad class covering O-linked, GPI-anchor and glycosphingolipid defects as well, so the grouping was asserting exact correspondence with a concept it explicitly declines to cover. The umbrella resolves it: exactMatch moves here, and the child is downgraded to skos:narrowMatch (recorded in its own history record). narrowMatch still counts as curated for MONDO coverage per CLAUDE.md, so nothing is retired from the curation queue.

    The nosological authority is ICIMD category 18 (Ferreira et al. 2021, PMID:33340416), already encoded in src/dismech/schema/classifications/icimd.yaml. Its subdivision into N-linked, O-linked, lipid and multiple-pathway glycosylation disorders is what the four children mirror. Two evidence items quote it: the subdivision sentence, which is also what places GPI-anchor disorders inside the glycosylation umbrella rather than beside it, and the sentence excluding disorders of glycogen metabolism from the glycan-metabolism categories.

    Criteria. Criterion 0 is NECESSARY and is the disjunction of the four children's own NECESSARY criteria (GO:0006487, GO:0006491, GO:0006506, GO:0006493, GO:0006024, GO:0034975, GO:0006517, GO:0009313), so any disease satisfying its own sub-grouping satisfies this one by construction. Criterion 1 is SUFFICIENT over classifications.icimd_category category-18 values; it is a discovery lever, deliberately not NECESSARY because only 9 of the 27 transitively held diseases carry an icimd_category value and a NECESSARY reading would report that curation gap as a membership contradiction.

    Exclusions recorded in grouping_rationale. Glycogen storage diseases are out: glycogen is a storage homopolysaccharide rather than a glycoconjugate, and ICIMD excludes disorders of glycogen metabolism from the glycan-metabolism categories explicitly. The mucopolysaccharidoses are out: they are lysosomal GAG catabolism, already nested under Lysosomal_Storage_Disorders, and ICIMD places GAG synthesis (not degradation) under O-linked protein glycosylation. Including MPS would also have made it the first grouping with two parents; the declared nesting is currently a strict forest.

    Naming. ICIMD titles category 18 "Congenital disorders of glycosylation", but that name is held by the N-glycan child and grouping names are foreign-key targets, so renaming would break existing references and history records. The parent takes a descriptive name and carries "ICIMD category 18" in display_name.

    Verification. linkml-validate against target-class Grouping: no issues found. python -m dismech.groupings: structure OK, 26 of 27 transitively held members SATISFIED against criterion 0, and the SUFFICIENT criterion surfaced 11 candidate members matching an independent scan of the corpus exactly. Both evidence snippets verified as exact substrings of references_cache/PMID_33340416.md.

    Followed up rather than fixed, and recorded in notes: (1) UGP2-related developmental and epileptic encephalopathy 83 evaluates NOT_SATISFIED. This is pre-existing on main - it already fails the NECESSARY criterion of its own child grouping - and is inherited faithfully here because this criterion is the children's disjunction. Cause is a granularity mismatch: the entry annotates GO:0009100 glycoprotein metabolic process, an ancestor of the specific processes the criteria name, and closure runs downward. Deliberately not worked around by adding GO:0009100 to the disjunction, which would hide the defect and break the union property. (2) No O-linked child exists, though five entries already carry the o_linked_protein_glycosylation classification. (3) Eleven entries carrying an ICIMD category-18 value are in none of the four children and are named individually in notes as candidate additions. (4) This grouping's MONDO closure has not been re-derived, so its consistency block is declared UNKNOWN rather than CONSISTENT.

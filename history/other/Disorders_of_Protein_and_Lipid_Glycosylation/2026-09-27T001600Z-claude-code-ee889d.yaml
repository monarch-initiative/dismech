  details: |
    Review round for PR #12948 (ai4c-reviewer, CHANGES_REQUESTED). Every finding that touches this file, in one push. No membership change.

    CORRECTION TO THE PRECEDING RECORDS IN THIS DIRECTORY AND IN history/other/Other_Multiple_Glycosylation_Pathway_Disorders/ AND history/disorders/UGP2-Related_Developmental_and_Epileptic_Encephalopathy_83/. Those records state that GO:0006486 "does not exist in GO". That is wrong. GO:0006486 exists as an obsolete term: OLS returns label "obsolete protein glycosylation", is_obsolete true, term_replaced_by GO:0009101. The error came from passing the CURIE to an OLS *text* search (which matches nothing because the CURIE is not in the label) and reading the empty result as absence, rather than resolving it through the term endpoint. The corpus already contained the right answer - a dozen research/ reports annotate it as "obsolete protein glycosylation ... replaced by GO:0009101" - so a grep would also have caught it. The substantive conclusion is unaffected and in fact strengthened: GO:0009101 is both the replacement for the obsolete term and the common ancestor of the N- and O-linked classes, so the UGP2 rebinding was correct. The live prose in this grouping's notes is corrected in place; the earlier history records are append-only and are corrected by this record rather than rewritten.

    Stale prose, all of it written before the last three commits and not updated:
    - description said "points down to four nested sub-groupings" and listed four branches with O-linked missing; now five, with the O-linked branch named.
    - The criterion logic description and the ICIMD evidence explanation both said "four nested"; now five.
    - The O-linked operand described itself as "the branch a future O-linked sub-grouping would occupy". That child now exists, and the operand was also credited to the wrong sibling; it now names Disorders_of_O-linked_Protein_Glycosylation and notes that multiple-pathway members whose lesion reaches O-glycans also satisfy it.
    - The ICIMD coverage note said "only 9 of this grouping's 27 transitively held diseases carry a value". Recounted: 20 of 38, and all 20 category-18 entries in kb/disorders are now held here, which is why the SUFFICIENT criterion reports no candidates.
    - The differentiating_mechanisms gene lists for three children predated the eleven members added in the previous commit. Added MOGS, B4GALT1 and CCDC115 to the N-glycan row, PIGP to the GPI row, and ATP6V0A2 and SLC10A7 to the multiple-pathway row, each with the step it occupies.

    Substantive fix: added a GO:0030166 proteoglycan biosynthetic process operand to the NECESSARY disjunction. The logic description claims this criterion is the union of its children's criteria, and it was not - Disorders_of_O-linked_Protein_Glycosylation carries a GO:0030166 operand for the two members that annotate only the proteoglycan-product classes (GO:0015012, GO:0050650) rather than the glycosaminoglycan class. Every member satisfied the disjunction before and after, so this changes no verdict; it makes the stated property true rather than nearly true.

    Not changed, and why: the skos:exactMatch to MONDO:0015286. The reviewer asks for the semantics-versus-tooling tradeoff to move out of a notes field into the decision register or its own issue, and flags that by membership the N-glycan child (18 of 19 inside) is a closer match than this umbrella (24 of 38). Both points are correct. Changing the predicate is a design decision with consequences for MONDO coverage accounting and for grouping_mondo_gaps.py, and it is the PR author's call, so it is raised on the PR rather than actioned here.

    Verification. linkml-validate against target-class Grouping: no issues found. dismech.groupings: structure OK, 38/38 SATISFIED, no NOT_SATISFIED, SUFFICIENT criterion reports no candidates. check-duplicate-keys, check-enum-values, check-entity-refs, check-folded-hyphens and check-case-collisions clean.

  details: |
    Nested Disorders of O-linked Protein Glycosylation as a fifth child, and rewrote the two notes paragraphs that recorded the O-linked gap and the candidate backlog as outstanding. Criteria and mappings are unchanged.

    This closes both follow-ups the grouping was created carrying. It now holds all five ICIMD category-18 subdivisions, and its transitive membership is 38 diseases, up from 27, all SATISFIED against the NECESSARY criterion with no contradictions.

    Where the eleven candidates went. Five to the new O-linked child (Dystroglycanopathy, Peters plus syndrome, Larsen-like Syndrome B3GAT3 Type, Immunoskeletal Dysplasia with Neurodevelopmental Abnormalities, Seizures-scoliosis-macrocephaly syndrome). Three to the N-glycan child (MOGS-CDG, B4GALT1-CDG, CCDC115-CDG) - the same membership drift the 2026-08-20 review corrected for seven other CDG entries. One to the GPI child (Developmental and Epileptic Encephalopathy 55, PIGP). Two to the multiple-pathway child (Autosomal Recessive Cutis Laxa Type 2A, ATP6V0A2/Golgi pH; and Short Stature, Amelogenesis Imperfecta, and Skeletal Dysplasia with Scoliosis, SLC10A7/Golgi calcium).

    The last two are the judgement worth recording. Both annotate protein O-linked glycosylation and would have satisfied the O-linked child's criterion, but their proximal lesions are Golgi luminal conditions that disable several branches at once, and both carry icimd_category multiple_glycosylation_pathways. They went to the multiple-pathway sibling on that basis. O-glycosylation being among a disorder's casualties does not make it an O-linked disorder, and the exclusion is recorded in both groupings' notes so the next reviewer does not read it as an omission.

    What an empty candidate list does and does not mean, now written into notes: it means every entry that CARRIES a category-18 classification is held by a child. It says nothing about entries whose glycosylation lesion is real but unclassified - those are invisible to a criterion keyed on classifications.icimd_category. Widening that classification's coverage across kb/disorders is what would make the report say more, and is the successor to this backlog rather than its completion.

    Still outstanding, unchanged: this grouping's MONDO closure has not been re-derived from its own member set and its consistency block remains UNKNOWN; and the stale "14 of the 15 listed members" count in the N-glycan child's consistency note still needs a MONDO build to correct properly.

    Verification. linkml-validate against target-class Grouping: no issues found. dismech.groupings: structure OK, 38 of 38 SATISFIED, SUFFICIENT criterion reports no candidates. Nesting audit shows five children and no new undeclared containment; the declared forest remains a forest, with no grouping holding two parents. check-duplicate-keys, check-enum-values, check-entity-refs, check-case-collisions and check-folded-hyphens clean.

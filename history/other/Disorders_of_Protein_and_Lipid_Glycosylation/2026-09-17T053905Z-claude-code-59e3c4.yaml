  summary: Resolve the inherited UGP2 contradiction; add the GO:0009101 operand
  details: |
    Added a GO:0009101 glycoprotein biosynthetic process operand to criterion 0's disjunction, and replaced the notes paragraph that recorded the UGP2 failure as outstanding with one recording how it was resolved. Membership and nesting are unchanged.

    Context. When this grouping was created, 26 of its 27 transitively held members evaluated SATISFIED; UGP2-related developmental and epileptic encephalopathy 83 did not. That was inherited rather than introduced - the entry already failed the NECESSARY criterion of its own child, Other Disorders of Multiple Glycosylation Pathways, on main - and it was recorded in notes rather than worked around, specifically because adding a term to this disjunction purely to turn the report green would have hidden the defect and broken the documented property that this criterion is exactly the union of its children's.

    That property is why this file changes now. The child's criterion was corrected to state itself at its intended branch-generic level by gaining a GO:0009101 operand; this disjunction gains the same operand so it remains the union of its children's criteria rather than drifting narrower than one of them. The addition is therefore a consequence of the child's fix, not an independent widening - and it is not the workaround previously declined, because the underlying criterion was corrected rather than bypassed.

    The diagnosis, for the record. Ontology closure runs downward, so an entry annotated at an ancestor of the process a criterion names never satisfies it. Both criteria named only specific branches while the UGP2 entry annotated GO:0009100 glycoprotein metabolic process. The entry was right to stay branch-agnostic (its cited hypoglycosylated-LAMP2 result does not resolve to N- or O-linked, and UGP2's UDP-glucose lesion feeds several branches), so the criteria were the side stating the wrong level. The entry node was separately moved to GO:0009101, which is more specific than what it carried because it excludes glycoprotein catabolism, while still naming no branch.

    GO:0009101 was chosen because it is the common ancestor of GO:0006487 and GO:0006493, read off both terms' OLS ancestor lists. GO:0006486, the identifier one would reach for as "protein glycosylation", does not exist in GO.

    Verification. linkml-validate against target-class Grouping: no issues found. dismech.groupings on this file: structure OK, 27 of 27 members SATISFIED with no contradictions, and the SUFFICIENT ICIMD criterion still surfaces the same 11 candidate members. The nesting audit is unchanged. check-duplicate-keys, check-enum-values, check-entity-refs and check-folded-hyphens clean.

    Still outstanding, unchanged by this edit: no O-linked child grouping exists; 11 ICIMD category-18 entries are in none of the four children; and this grouping's MONDO closure is still declared UNKNOWN pending re-derivation.

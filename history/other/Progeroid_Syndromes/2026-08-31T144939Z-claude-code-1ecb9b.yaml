  summary: 'Create: Progeroid Syndromes grouping (MONDO:0015333)'
  details: |
    Curated MONDO:0015333 as a kb/groupings/ Grouping, per the entry_type GROUPING decision already recorded on stubs/Progeroid_Syndrome.yaml. The stub is deleted by the same change.

    Scope. Progeroid syndrome is a phenotype category, not a mechanism. The six members reach a prematurely aged appearance by unrelated routes: lamin A missplicing and progerin toxicity (Hutchinson-Gilford), BANF1/BAF DNA-binding failure (Nestor-Guillermo), RecQ helicase loss (Werner), transcription-coupled nucleotide-excision repair failure (Cockayne), a mitochondrial ATP-Mg/Pi carrier defect (Fontaine), and asprosin deficiency from C-terminal FBN1 truncation (marfanoid-progeroid-lipodystrophy). There is no single pathograph to curate, so a Disease entry over the category would have been wrong; an explicit union over already-separate Disease entries is the right shape.

    grouping_basis is SHARED_PHENOTYPE plus CLINICAL_CONVENTION, deliberately not SHARED_MECHANISM. The members do converge downstream on cellular senescence, but only Hutchinson-Gilford and Werner currently declare a cellular_senescence conformance, so requiring one would have excluded four members whose membership is not in doubt. The stub's own note anticipated this. The senescence and hallmarks-of-ageing modules are named in grouping_rationale as conformance targets for members rather than as a criterion.

    Criteria are NECESSARY only, one block: HAS_PHENOTYPE HP:0007495 AND HAS_INHERITANCE HP:0034345. Both leaves rely on HPO closure - HP:0005328 Progeroid facial appearance is a descendant of HP:0007495, which is how Cockayne and MPL satisfy the phenotype leaf, and autosomal dominant/recessive are descendants of HP:0034345. Not NECESSARY_AND_SUFFICIENT: several congenital lipodystrophies and cutis laxa syndromes satisfy both conditions without being counted among the progerias.

    Three members did not curate the defining phenotype and were fixed rather than exempted, per the curate-grouping rule against encoding exceptions to a necessary condition. HP:0007495 was added to Hutchinson-Gilford_Progeria_Syndrome, Nestor-Guillermo_progeria_syndrome and Werner_Syndrome, and inheritance blocks were added to the first two, which had none. Each new claim carries a cited, cache-verified snippet.

    Edge members recorded in member notes rather than argued away: Cockayne syndrome is dominated by neurodevelopmental disease with progeroid facies one feature among many, and marfanoid-progeroid-lipodystrophy syndrome arguably owes its aged appearance to congenital absence of adipose tissue rather than to accelerated ageing. Both are MONDO:0015333 descendants that curate the defining phenotype, so both are listed with the objection stated in their member notes.

    MONDO mapping is skos:exactMatch. The uncurated MONDO:0015333 descendants are listed in notes as curation gaps to be surfaced from the mapping. XFE progeroid syndrome (MONDO:0012590) has an open curation PR and should be added as a member once it merges. Bloom, Rothmund-Thomson, xeroderma pigmentosum and trichothiodystrophy are excluded with reasons recorded in notes: none is a MONDO:0015333 descendant, and admitting them would redraw the boundary as any genome-instability syndrome with ageing features.

    Validation: just validate-grouping passed (schema, terms, references). just check-groupings --strict reports all six members SATISFIED on the necessary criterion.

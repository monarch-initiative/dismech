  summary: Add XFE as seventh member; rebind non-differentiating modules; cite the
    NECESSARY argument
  details: |
    Review round on PR 10269. The ai4c-reviewer bot requested changes on one finding and raised four suggestions.

    Blocking finding, accepted and fixed: XFE Progeroid Syndrome (MONDO:0012590) merged to main after this branch was cut, so the notes gap list - introduced as "descendants without dismech Disease entries" - asserted the absence of an entry that now exists, and the grouping omitted a member its own criteria admit. Verified independently against origin/main before acting: the entry exists, its name is exactly "XFE Progeroid Syndrome", it curates HP:0005328 (inside the HP:0007495 closure) and HP:0000007 (inside the HP:0034345 closure), and ERCC4 is hgnc:3436. Rebased onto origin/main (19 commits behind, clean, no unrelated churn), added XFE as the seventh member with a differentiating_mechanisms block contrasting its loss of the incision endonuclease itself against Cockayne's loss of only the transcription-coupled branch, and noting the GH/IGF-1 somatotroph suppression that entry curates. Removed XFE from the gap list and updated the three places that said "six members".

    Suggestion 2, accepted: the module bindings on the HGPS and Werner differentiating_mechanisms did not differentiate. Confirmed by computing the conformance sets across all seven members - cellular_senescence#Senescence-Associated Cell Cycle Arrest, genomic_instability_aging#Declining Genome Maintenance and Erroneous Repair, and telomere_attrition#Progressive Telomere Attrition are all shared by HGPS and Werner, and both original bindings were in that shared set. The HGPS one was also in direct tension with grouping_rationale, which argues senescence convergence must not be treated as a discriminator. Rebound to member-unique nodes: HGPS to loss_of_proteostasis#Misfolded-Protein Aggregation (the progerin route), Werner to genomic_instability_aging#Accumulation of Somatic Mutations and Genomic Damage (the somatic-mutation burden behind its cancer predisposition).

    Suggestion 4, accepted: dropped the PMID:903377 item from the Werner phenotype. It was an exact quote and passed grading, but it is a mid-sentence descriptive clause rather than that paper's result, and the GeneReviews item states the same thing as a clinical characterization.

    Suggestion 5, partly accepted: added a references block citing PMID:23963297 for the claim that carries the NECESSARY-rather-than-NECESSARY_AND_SUFFICIENT argument - autosomal recessive cutis laxa presents progeroid features prominently enough to be a diagnostic confounder while not being a MONDO:0015333 descendant, so the two criteria are satisfied outside the grouping and cannot define it. The supporting_text was confirmed as an exact substring of the cache by direct comparison, since the reference validator does not check grouping references[].findings[].supporting_text. The other claim the reviewer named, downstream convergence on cellular senescence, was left uncited: nothing in the reference cache states it across members, and the nearest candidate (PMID:26993153) argues genomic instability as the common mechanism of segmental progeroid syndromes, which is in tension with this grouping including the mitochondrial and fibrillin members. Manufacturing a citation for it would have been worse than leaving it as stated reasoning.

    Suggestion 3, declined with reasons given on the PR: the reviewer asked for uniform phenotype-name casing across the three members. Each name matches its own file's local convention - Werner uses Title Case for all 26 of its phenotype names, HGPS and NGPS use sentence case throughout - so imposing cross-file uniformity would break within-file consistency in whichever file was changed.

    Validation after the changes: validate-grouping clean, check-groupings --strict with all seven members SATISFIED, validate on Werner clean, count-verified-snippets 179/179, check-entity-refs and check-duplicate-keys clean, and the four baseline gates clean.

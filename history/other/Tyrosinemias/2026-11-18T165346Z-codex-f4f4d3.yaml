  summary: Pilot a hereditary tyrosinemia grouping for OMIMPS:276700
  details: |
    Create an explicit union of types I, II and III with shared pathway and phenotype rationale and FAH/TAT/HPD differentiators supported by six validated snippets. The January 2026 OMIM snapshot lists OMIM:276700, OMIM:276600 and OMIM:276710. Exact mapping to the series; broadMatch to MONDO:0004741 because the September 2026 MONDO hierarchy also contains transient neonatal tyrosinemia, MONDO:0018083. The necessary pathway-and-gene criterion passes all three members; alkaptonuria fails it. This is not a sufficient classifier and does not validate allele pathogenicity or process direction. Generated GO closure cache.

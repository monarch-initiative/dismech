  summary: Map Glycogen Storage Diseases to OMIMPS:232200
  details: |
    Prioritized from the CLINICAL.T01.01 disease list. Compared January 2026 OMIM membership with September 2026 MONDO and existing KB scope. PS232200 includes 22 records in January 2026, spanning hepatic, muscular, lysosomal, synthesis-defect, and distal glycolytic forms, as well as PGM1-related congenital disorder of glycosylation type It. This grouping includes Fanconi-Bickel syndrome, adult polyglucosan body disease, and the broader PRKAG2 cardiac syndrome, which are not separately listed as such in the inspected series. Pompe is represented by an infantile-onset record in the series, while the grouping member covers the disease across onset ages. RelatedMatch records the overlapping clinical glycogenosis convention without asserting identical enumerated boundaries. The existing pathway, compartment, and physiologic distinctions explain why the member diseases remain separate.

  summary: Group Homocystinuria-Megaloblastic Anemia Disorders under OMIMPS:236270
  details: |
    Compared actual dated OMIM members with current main disease records. Added the explicit union, evidence-supported distinctions and necessary annotation criteria. The shared boundary is inherited methylcobalamin-dependent remethylation failure in the cblE, cblG and isolated cblD-HC forms. The distinctions are enzyme reactivation, the catalytic enzyme, and cofactor handling. The MMADHC parent also contains cblD-MMA and cblD-MMA/HC; these are explicitly excluded. The named subtype and its disease term define that member, while the current offline evaluator checks annotations on its broader parent.

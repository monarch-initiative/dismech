  summary: 'Add member: NF2-Related Schwannomatosis'
  details: |
    Added NF2-Related Schwannomatosis (kb/disorders/NF2-Related_Schwannomatosis.yaml,
    MONDO:0007039) as a member, after Schwannomatosis, the entry for the non-NF2 forms. The
    entry's germline and second-hit nodes now declare conformance to
    germline_two_hit_tumor_predisposition, so it satisfies the grouping's NECESSARY criterion,
    which just validate-grouping-batch confirms. The member row binds NF2 (hgnc:7773) and the
    module, and says that germline NF2 loss leaves every cell one somatic event from losing
    merlin, that biallelic loss in Schwann cells removes merlin-dependent growth restraint and
    underlies the vestibular schwannomas, that meningiomas and ependymomas are taken to arise by
    the same two-hit route, and that the mosaic form, whose first hit is not in every cell and
    whose disease is usually milder, departs from the constitutional first hit the grouping is
    built on. The description and rationale were not changed.

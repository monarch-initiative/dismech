  summary: Admit histiocytic sarcoma as the grouping's first malignant member
  details: |
    A decision taken on 20 November 2026: admit histiocytic sarcoma to this grouping with honest
    wording. The entry was curated in #18671 and binds GO:0000165 MAPK cascade and GO:0070371 ERK1
    and ERK2 cascade on its MAPK/ERK Pathway Activation node, so it satisfies this grouping's
    necessary criterion; just check-groupings reports all five members SATISFIED. The member row
    carries two quotes from the review's abstract - the aggressive behaviour and de novo or
    secondary origin, and the genomic alterations naming RAS/MAPK beside PI3K/AKT/mTOR, CDKN2A and
    TP53 - and binds CDKN2A (hgnc:1787), read from the entry's own genetic row rather than from
    memory. Both quotes are sentences of the review's abstract. They were chosen when the cached
    record held only the abstract; #19148 has since merged and upgraded it to the PMC full text,
    which leaves the quotes untouched because an abstract sentence survives such an upgrade. One
    sentence of the grouping was false the moment that entry merged and is rewritten: it said the
    malignant histiocytoses were undecided because nothing here said a histiocytic sarcoma satisfies
    the MAPK criterion. It now records that the curated entry does satisfy it, while noting that
    MONDO:0004612 malignant histiocytosis still has no entry of its own, so the wider class remains
    unlisted.

    Every count was re-derived rather than incremented - against the member entries, except the
    MONDO descent figure, which came from re-running the consistency audit - and several checks
    changed what was written. One of those corrected the change's own draft: a draft of the member
    row claimed that arising de novo or in association with another haematological neoplasm is
    unique to this member; juvenile xanthogranuloma's entry cites a shared somatic PTPN11 variant as
    evidence of a clonal link to another disease, so the row now says the origin is not unique and
    rests its distinction on the behaviour and on CDKN2A, the one of the sarcoma's own genes with a
    genetic row that no other member's entry mentions - other members have such genes too, juvenile
    xanthogranuloma's CSF1R among them; TP53 is quoted rather than modelled here and absent from the
    other four entries altogether, and PI3K/AKT/mTOR is not distinctive at all. Another corrected a
    sentence that was already wrong and that this change makes wrong in a further way: the
    description called the members proliferations driven by a somatic lesion of the MAPK pathway. It
    was already wrong of three of the four, which frame themselves as clonal neoplasms; the
    malignant fifth adds a second reason. Two further rounds were needed to land the replacement.
    Calling the other four proliferations was wrong as well, because three of them frame themselves
    as clonal neoplasms; but the obvious repair, calling all five neoplasms, was wrong too, because
    Rosai-Dorfman disease reframes only a substantial subset that way and its own notes decline
    module conformance on the ground that forcing it on the whole entity would overstate the
    neoplastic framing, which is the same judgement applied to a different question - which this
    grouping's description says too, that Rosai-Dorfman disease frames only its clonal arm that way.
    That sentence now says the sarcoma's entry calls its disease malignant where the other four
    entries do not, and leaves what each is otherwise called to its own entry - adding, with it, how
    those four differ: Langerhans cell histiocytosis, Erdheim-Chester disease and juvenile
    xanthogranuloma each frame themselves as clonal neoplasms, juvenile xanthogranuloma's entry
    carrying that framing's disagreement as an open knowledge gap, and Rosai-Dorfman disease only
    for its clonal arm.

    Two further checks corrected sentences this change did not write, for different reasons; a
    third, the juvenile xanthogranuloma comparison, is described below. The notes said the ICD-O
    criterion's value will need re-reading when the malignant histiocytoses are curated; one of them
    was curated on 21 November, before this branch was cut, so that sentence was already stale. It
    now records that one of them is curated and is a member, and says the criterion nominates nobody
    because nothing outside the grouping carries the tag. Separately, and with no connection to the
    new member, the notes put one targeted-therapy row with no evidence block where two have none -
    Langerhans cell histiocytosis's MEK inhibitor row and Rosai-Dorfman disease's sirolimus,
    counting a drug aimed at any arm of the pathway. Both rows predate the sarcoma and all four of
    its treatment rows carry evidence, so admitting it could not have moved that count.

    Four further claim-level edits: the display name's neoplasms is now said to name the ICD-O class
    the sufficient criterion reads rather than each member; the per-member driver lists state their
    selection rule and what it leaves out; the Langerhans row, whose claim that an unsettled lesion
    position separates that member was a fourth sentence already wrong at four members: juvenile
    xanthogranuloma's entry says its own cell of origin is not established. Admitting the sarcoma,
    whose entry says the same, only made it harder to miss; that row now rests on the two competing
    models for where in haematopoiesis its lesion sits, each offered as a hypothesis and neither
    settled, and its sibling description no longer calls juvenile xanthogranuloma the one member
    whose drivers leave the MAPK kinases, which is true of three. And the juvenile xanthogranuloma
    member row's comparison against "the three whose lesions sit in the cascade" was the third
    sentence already wrong at four members: Rosai-Dorfman disease's drivers are MAP2K1, KRAS and
    NRAS, and under the distinction this change adopts a RAS GTPase is not a cascade kinase, so that
    position was needed before the sarcoma arrived.

    The description's account of where the shared lesion sits was narrowed in the same pass. It had
    said the lesion is an activating somatic one in the MAPK pathway, in a kinase of the cascade or
    in the RAS GTPase above it or at an upstream receptor. Both halves over-claimed against a
    member's own entry: juvenile xanthogranuloma's CLTC::SYK fusion sits at none of those positions,
    that entry placing it on neither of the two cascades its module names because SYK is a
    non-receptor tyrosine kinase, and that entry's sources characterise the effect of only two of
    the six alterations it records, and those two only at a remove. The positions are now given as
    the usual ones, "activating" is gone, and both qualifications are stated; the rationale's
    parallel sentence is hedged to match. The cell-of-origin clause is rewritten. Three of the five
    entries decline to settle the cell their lesion arises in - Langerhans cell histiocytosis calls
    it contested, juvenile xanthogranuloma not established, the sarcoma not settled - so the clause
    names all three rather than singling out the new member. It also carries the other two clauses
    that entry attaches in the same sentence: that somatic origin is stated only for single tumours
    and not for its series, which hedges this grouping's own central claim for that member, and that
    it models a secondary arm descending from an earlier B-cell clone. The rationale's ground for
    excluding the haemophagocytic group is strengthened in the same pass, from "is not a MAPK-driven
    proliferation" to "is not driven by a somatic MAPK lesion at all": that entry binds neither
    GO:0000165 nor GO:0070371 on any node and carries no genetic row with a somatic origin.

    The figures: five members; four of the five bind GO:0070371, juvenile xanthogranuloma being the
    one that does not; three of the five carry the ICD-O histiocytic and dendritic cell neoplasm
    tag, unchanged, because the sarcoma's entry has no classifications block at all - adding that
    tag is left to a later change, which is why it follows this one; all five carry a
    targeted-therapy row, the sarcoma's MEK-inhibitor row carrying four single-patient responses,
    the most of any row resting on single patients, and ranked below the rows that rest on a treated
    series; three of the five state a regulatory status in prose their references do not carry, the
    sarcoma's row stating none. just grouping-mondo-consistency --grouping Histiocytoses now reports
    4/5 members descending from the mapped MONDO:0002637, naming histiocytic sarcoma (MONDO:0019479)
    as the one outside. The predicate is skos:broadMatch, which asserts no subsumption, so the audit
    contradicts nothing; the consistency note that recorded 4/4 and the mapping justification that
    said all four members resolve to descendants are both rewritten with the measured figure and the
    reason a member may sit outside.

    Fence (a) was observed: the note on ALK-positive histiocytosis is untouched. Validated with just
    validate-grouping, just validate-grouping-batch and just check-groupings --strict --offline on
    the changed file.

    Adversarial checking, split between an evidence axis and a bindings axis, found the quotes, the
    bindings and the counts sound from the first commit. What it found, mostly, were claims this
    change made about itself; it also found three defects in the curated prose - a member row whose
    closing clause contradicted its own earlier sentences, a caveat carried in half where the member
    entry attaches two, and a sentence inviting an is-a reading MONDO denies. The shapes are worth
    knowing because none is reachable by a gate. Counts written out in words, where adding a fifth
    member leaves a four-item list untouched and no search for a digit finds it, and `>-` folding
    hides the phrase from a plain grep. A claim corrected in one of the four documents that carry it
    - the grouping, this record, the commit message, the PR body - and left standing in the others.
    A repair that introduces the next error, twice from verifying a correction by grepping for a
    word instead of reading the claim it sat in. Sentences this change falsified without touching,
    which a diff review cannot see. And attribution drift: saying the change caused something it had
    merely found.

  summary: 'Create: Histiocytoses grouping'
  details: |
    A new grouping over the four histiocytoses this knowledge base curates as clonal neoplasms driven by a somatic MAPK-pathway lesion: Langerhans cell histiocytosis, Erdheim-Chester disease, Rosai-Dorfman disease and juvenile xanthogranuloma. All four entries already existed; nothing in them is edited.

    The basis is a shared mechanism, and the criterion was chosen from what the four entries actually bind rather than from the field's vocabulary. Every one of them binds GO:0000165 MAPK cascade in its pathophysiology, so that is the NECESSARY criterion, stated at the level of the cascade because the members enter it at different points - at BRAF, at MAP2K1, at RAS, and in juvenile xanthogranuloma at an upstream receptor or a kinase fusion. A criterion naming one of those kinases would report the others as contradictions. GO:0000165 is already in the committed closure cache, with 19 rows that are the reflexive self-row plus 18 descendants, so no cache rebuild was needed and the audit stays offline. The strict offline audit reports all four members SATISFIED.

    The second criterion is SUFFICIENT and not necessary, which is a deliberate asymmetry rather than an oversight. Three of the four entries carry classifications.icdo_morphology "Histiocytic and Dendritic Cell Neoplasm", and no entry outside the grouping carries it, so the tag is enough to imply membership. Juvenile xanthogranuloma has no classifications block at all, which is a gap in that entry; making the criterion necessary would record that gap as a contradiction, which it is not.

    The MONDO mapping is a broadMatch, not an exactMatch. All four members resolve to is-a descendants of MONDO:0002637 histiocytosis, checked one by one against the local build, but that class has 46 descendants and this grouping covers four, so MONDO's class is the broader concept and the predicate reads with the grouping as the subject. The justification names the residue, which took a corpus walk rather than a guess: the descendants with no entry here, of which it names three of the thirty-four, and the eight curated entries that bind a descendant and are not members - five storage disorders MONDO files under histiocytosis for their foam-cell morphology, sea-blue histiocyte syndrome, whose own entry calls it a lipid-storage histiocytosis, and H syndrome and papular xanthoma.

    Two parts of the field are deliberately excluded, recorded in the rationale so the concept is not re-nominated. Haemophagocytic lymphohistiocytosis, which this repository curates, is a disorder of cytokine-driven immune dysregulation rather than a clonal MAPK-driven proliferation, so including it would make the shared mechanism false of a member. The malignant histiocytoses have no entry here, so there is nothing to list. ALK-positive histiocytosis is also named as a non-member, with its MONDO CURIE; no ALK-inhibitor clinical or trial content is added, which is what content fence (a) covers.

    One defect was caught by the validator and is worth recording because it is the recurring one. The first draft of the Langerhans cell histiocytosis member's evidence carried a reference_title written from memory, and it named a different paper entirely; the same item's snippet had also been extended past the cached sentence with a clause that does not exist in the source. Both were replaced with the cache's own text before any further check was run.

    Two adversarial rounds then found eight prose claims that no gate can see, and the worst of them is the reason this record says so. The first draft placed juvenile xanthogranuloma in the cutaneous group of the 2016 classification - a claim that entry's own review_notes already record as one of three the deep-research report made and no cached reference supports, with the cached abstract naming its five groups and never naming this disease. It also stated the Langerhans cell histiocytosis progenitor finding as settled and under the wrong model name, where that entry carries two readings and says neither is settled; claimed only two members have an established targeted therapy, where all four carry a row and Rosai-Dorfman's asserts an FDA approval its own references do not carry; attributed to the juvenile xanthogranuloma entry a statement about MEK inhibitors that exists only in an unpushed branch; said Rosai-Dorfman carries clonality caveats the others do not, where juvenile xanthogranuloma carries one too; called RAS a kinase; asserted that Erdheim-Chester disease does not regress, which nothing cited here says; and named the haemophagocytic histiocytoses as descendants with no entry here, when they are neither. Every one is corrected above or removed. The grading of the Erdheim-Chester quote also moved from OTHER to HUMAN_CLINICAL, because that entry grades the same sentence HUMAN_CLINICAL in five places and the quote's content is findings in patients.

    A third round, this one a reviewer read rather than a source check, found one blocking defect and several things worth taking in the same push. The blocking one is the shape this record got wrong twice: the Erdheim-Chester row still said it "is the member that does not regress", which nothing cited here supports - that entry never mentions regression and nor does the paper the row cites - and which the rationale explicitly disclaims for the other three members, about 120 lines earlier in the file. The paragraph above said every such claim was corrected or removed; it was not, and only a reader going back to the file found it.

    Five passages were cut or shortened for writing about this session rather than about histiocytoses: a clause reporting what another entry's review_notes say about a deep-research report's claims, a criterion description explaining that a tag was not added because an open PR was editing that file, two member rows describing where another entry keeps its hypotheses instead of what the disease does, and one sentence telling the reader which of the writing agent's own findings it found interesting.

    Three things were added that the file needed. PMID:26966089 is now a named reference with a quoted finding, because five statements in the file rested on the 2016 classification and only one of them, on the Erdheim-Chester row, had a source of its own. The MONDO mapping carries a consistency block recording the 4/4 member audit, which 72 of the other 136 grouping files do and which this file had left in prose. And the description now says, where a reader meets the claim rather than 180 lines later, that Rosai-Dorfman disease carries a clonal lesion in about a third of cases - so the grouping's claim is that each member's entry records such a lesion, not that every case of all four has one. The display_name changed from "clonal" to "MAPK-driven" for the same reason.

    A fourth round, reading the same frozen commit from two angles, found five more. Two were claims about the corpus that the grouping's own criterion contradicts or that no cached source carries: it said neither H syndrome nor papular xanthoma satisfies the MAPK criterion, when H syndrome carries a pathophysiology node binding GO:0000165 and so satisfies it and is excluded anyway - which is the more interesting fact and is now what the justification says - and it called the haemophagocytic group of the 2016 classification "the H group", a letter that appears in neither cached source. One mischaracterised a non-member: sea-blue histiocyte syndrome's own entry calls it a lipid-storage histiocytosis, not a lysosomal storage disease, and it is now named apart from the five Niemann-Pick-family entries rather than counted with them. One was wrong about a cited paper: the Erdheim-Chester review was described as restating a consensus decision it did not make, when its first author was one of that consensus's authors. And one accused another curator's entry of a contradiction it does not contain. The therapy sentence said the Rosai-Dorfman row claims a 2022 regulatory approval while its only reference says there are none. The row in fact states both in one sentence - a class approval for histiocytic neoplasms, the registrational evidence centred on Erdheim-Chester disease, and no treatment specifically approved for Rosai-Dorfman disease at the time of the cited cohort - so it reconciles the two rather than contradicting the paper. The accusation came from reading the row's first clause and the reference's sentence and stopping. It is removed, and the sentence now only tells a reader to check each row's own evidence. What survives is weaker and is not this file's business: the regulatory-status sentences in the Rosai-Dorfman, Erdheim-Chester and Langerhans cell histiocytosis treatment rows are prose that their own cited references do not carry, and the Langerhans row carries no evidence block at all. That is recorded for the user, not published here.

    The reference block's finding statement was also narrowed: it had said the classification names no group for juvenile xanthogranuloma, which is an inference from the abstract's silence and the inverse of the claim round three removed. It now says only that the abstract names the five groups without naming the disease.

    A fifth round, a sweep for any claim a single command would falsify, enumerated 127 assertions across the two files and found eight. Four were in the grouping and are fixed: the first criterion's description read as a sufficient condition, which over a hundred non-member entries binding the cascade term falsify, and now says necessary and not sufficient in the same breath as the mapping justification twenty lines below; "accumulate in tissue and destroy it" added a destruction claim the cited abstract does not make, and now says what that abstract says; "periaortic infiltration" on the Erdheim-Chester row was the writer's word where the source says coated aorta and the entry says perirenal and retroperitoneal; and the therapy range's floor was wrong, because one of the four targeted-therapy rows carries no evidence block at all. The other four were in this record and are fixed above: the lysosomal wording the record itself says was corrected, a residue count that read as three where thirty-four descendants have no entry, "no ALK content of any kind is added" contradicted by the ALK CURIE in the same change, and a claim that the Rosai-Dorfman row cites an approval when it asserts one unreferenced.

    Validated with just validate-grouping (6 snippets, 7 titles, 0 issues) and the strict offline membership audit, all four members SATISFIED.

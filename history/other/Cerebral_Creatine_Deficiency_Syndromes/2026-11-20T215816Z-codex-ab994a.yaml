  summary: Group Cerebral Creatine Deficiency Syndromes under OMIMPS:300352
  details: |
    Compared actual dated OMIM members with current main disease records. Added the explicit union, evidence-supported distinctions and necessary annotation criteria. The common cerebral creatine-deficiency phenotype joins defects of synthesis and transport. The existing gene-defined diseases remain separate because their biochemical signatures, inheritance and treatment responses differ. Reduced creatine is a convergent consequence, not proof of a single proximal lesion.

  summary: Group Inherited Noradrenergic Orthostatic Hypotension Disorders under OMIMPS:223360
  details: |
    Compared actual dated OMIM members with current main disease records. Added the explicit union, evidence-supported distinctions and necessary annotation criteria. A selective noradrenergic failure phenotype joins defects in the synthetic enzyme and its vesicular reducing-equivalent supply. The gene-defined diseases remain distinct; the series does not encompass common drug-induced, volume-related or neurodegenerative orthostatic hypotension.

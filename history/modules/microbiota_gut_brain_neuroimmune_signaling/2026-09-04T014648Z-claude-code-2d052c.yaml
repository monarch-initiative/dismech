  summary: 'Create: Microbiota-Gut-Brain Neuroimmune Signaling module'
  details: |
    Created a six-node MGBA mechanism module scoped to the neuroimmune route (microbial community shift -> neuroactive metabolite output -> blood-brain barrier permeability -> microglial maturation/reactivity -> synaptic and circuit refinement -> affective and stress-responsive behavior). Central effector and key conformance target is the microglial node. The neuroendocrine/HPA route is carried as an ALTERNATIVE hypothesis group rather than a duplicated chain; the vagal route is out of scope. A third hypothesis group, developmental connectome programming, is held at EMERGING on the strength of one small prospective cohort (PMID:41168153). All 21 evidence snippets verified against fetched reference caches by linkml-reference-validator.

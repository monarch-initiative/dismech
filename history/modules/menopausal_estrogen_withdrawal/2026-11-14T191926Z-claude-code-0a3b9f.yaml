  summary: Correct elinzanetant's pharmacology on the NK3R antagonism treatment
  details: |
    Review round on PR 17805, suggestion: the Neurokinin-3 Receptor Antagonism treatment described elinzanetant as 'a second NK3R-targeted agent'. It is a dual neurokinin-1/neurokinin-3 antagonist, as the Vasomotor_Symptoms_of_Menopause entry already says. Corrected the explanation on the PMID:40454634 item and added the dual pharmacology as the second stated reason for its INDIRECT grading, since the result does not isolate NK3R. Added the statement to the treatment description, naming fezolinetant as the selective agent the therapeutic_agent slot records. Sourced the pharmacology in the module itself with a new PMID:39172446 item quoting the OASIS 1 and 2 trials' own characterisation of the drug as 'a selective neurokinin-1,3 receptor antagonist'; quote_role is left off because the sentence is the trials' objective, which the curation rules say has no value in that enum. Also added a PMID:42045091 item quoting that the only elinzanetant-versus-fezolinetant comparison is indirect and that head-to-head trials are required, graded REVIEW_SYNTHESIS and OTHER because the publication is a commentary; it was offered as a lead for the pharmacology itself, and was fetched and read before use, but the primary OASIS trial statement is kept as the source for the pharmacology and the commentary is cited only for the state of the comparison.

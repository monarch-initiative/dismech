  summary: 'Create module: Menopausal Estrogen Withdrawal'
  details: |
    Created kb/modules/menopausal_estrogen_withdrawal.yaml: a seven-node endocrine module from ovarian follicle-pool exhaustion through loss of granulosa-cell estradiol and inhibin B output to the two arms it drives - hypergonadotropic feedback disinhibition (FSH) and systemic estradiol withdrawal - and from there to the key conformance target, loss of estrogen receptor signalling in the target tissue, plus the hypothalamic KNDy arm and a convergent multi-system consequence node.

    Scope decisions recorded in the module's own description and notes: the RANKL/OPG bone arm stays in osteoporosis_bone_resorption and this module supplies only its upstream driver, binding no bone cell type or process; the hypothalamic KNDy/NK3R arm is one node here rather than a separate module, because every candidate conformer reaches it through the estrogen withdrawal already modelled, so a separate module would have no independent conformers; iatrogenic withdrawal is in scope when entered at the follicle pool (oophorectomy, chemotherapy, radiation) but GnRH-agonist, aromatase-inhibitor and SERM withdrawal is not, since those act downstream of the pool and conform at the systemic or receptor node; and the module is explicitly not an Xogenesis module, since no pathological anatomical entity is formed. The notes also record that no Menopause or Perimenopause Disease entry should be created, and that GO:0042697 must not be bound.

    Node granularity follows the single-value biological_scale discipline: systemic estradiol withdrawal (ORGANISM) is split from receptor-level loss (CELLULAR), which is how Heart_Failure splits its own two oestrogen nodes and is what lets those two nodes conform here one-to-one; granulosa secretory failure (CELLULAR) is split from follicle-pool exhaustion (TISSUE); and the KNDy node is confined to the neuronal state, leaving the thermoregulatory output to the conforming entry.

    Evidence: ten references cached with just fetch-reference, preferring primary human physiology and large cohorts - Richardson 1987 serial-section follicle counts, Faddy 1992 follicle-dynamics model (the basis for treating premature and iatrogenic withdrawal as the same mechanism entered early), Klein 1996 inhibin B and the monotropic FSH rise, SWAN (Randolph 2011) FSH and estradiol trajectories, Rance 1991 and Rometo 2007 human hypothalamic KNDy work with the ovariectomy-plus-replacement monkey arm, Jayasena 2015 NKB infusion, SKYLIGHT 1 and the OASIS-4 elinzanetant trial. Two review-grade sources are used and said to be so in their explanations: the 2024 ESHRE/ASRM POI guideline (consensus, graded OTHER with quote_role REVIEW_SYNTHESIS) and Kuiper 1997, whose ER tissue distribution is in rat and is graded MODEL_ORGANISM and INDIRECT. The Heart_Failure entry's own oestrogen snippets were deliberately not reused.

    Not verified: no conformer was edited, so no conforms_to link exists yet and check-conformance-content has nothing to compare; adding those links to Osteoporosis, Heart_Failure, Pelvic_Organ_Prolapse and the POI entries is a separate task. Pelvic_Organ_Prolapse is named in the description as belonging at the systemic node only, because its own evidence includes a REFUTE item against hormone therapy restoring pelvic support, which argues against conformance at the receptor node. CL:0000437 is bound with CL's own misspelled label 'gonadtroph'; the node description says so to stop a reviewer correcting it. No GO process is bound on the consequence node and its node-level notes say why.

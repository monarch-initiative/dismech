  summary: Add single-cell senescence datasets
  details: |
    Added a datasets block with two single-cell GEO series on telomere-driven arrest: geo:GSE119807 (human skin fibroblasts at early and late population doublings, replicative senescence and irradiation-induced senescence, Drop-seq) and geo:GSE169709 (HSCs from late-generation telomerase-deficient mice with telomerase reactivation, and stem/progenitor cells from TERT variant carriers; organism recorded as the majority mouse component). GSE169709's submitters report interferon-driven HSC exhaustion rather than senescence, so its description frames it as qualifying the senescence account of stem-cell failure. Titles are GEO's own (GSE119807 keeps GEO's misspelling); publication PMIDs cached with just fetch-reference. No evidence blocks. Validated with just validate, just validate-terms, just verify-datasets, check-duplicate-keys and check-block-scalar-comments.

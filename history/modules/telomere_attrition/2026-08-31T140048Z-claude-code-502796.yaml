  summary: Add leukocyte telomere length and measurement-reliability gap
  details: |
    Added leukocyte telomere length [NCIT:C129765] with two readouts and a KNOWLEDGE_GAP on measurement reliability. Source: PMID:30254001, a meta-analysis over 121,749 individuals with 21,763 deaths. Two readouts: READOUT_OF Progressive Telomere Attrition under MONITORING, and PREDICTS Tissue Replenishment Failure under PROGNOSTIC, both with direction NEGATIVE since shorter marks the more advanced state. The same meta-analysis supplies both the supporting association and its own limitation, curated as separate evidence items: assay technique and age at measurement drive between-study heterogeneity, and the hazard ratio attenuates above age 80. The knowledge gap is about measurement rather than biology, which is unusual among the aging-biomarker gaps: the population-level association is established, but whether a single individual measurement is actionable is not, and the 2025 Delphi consensus gave this marker the lowest agreement of its 14 on precision and reliability. Resolving it is an assay-standardization problem before it is a biology problem. Validation: just validate with 10/10 snippets verified, validate-terms, check-entity-refs, check-duplicate-keys and the whole-KB snippet gates all pass.

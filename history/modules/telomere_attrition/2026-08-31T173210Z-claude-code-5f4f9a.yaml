  summary: Add turquoise killifish (Nothobranchius furzeri) animal model with modeled_mechanisms
  details: |
    Added a turquoise killifish animal_models entry (GRZ vs MZM-0403 strain pair). PARTIALLY_RECAPITULATES 'Progressive Telomere Attrition' (age-dependent shortening in MZM-0403 only, proceeding despite INCREASED Tert expression and high telomerase activity), and FAILS_TO_RECAPITULATE 'Tissue Replenishment Failure and Age-Related Disease' (the authors conclude the short GRZ lifespan is not caused by diminished telomerase or accelerated shortening). The pairing is the point: the same study that establishes attrition in this model rules it out as the cause of the strain lifespan difference. Evidence: PMID:19428446, snippets exact-quoted and verified.

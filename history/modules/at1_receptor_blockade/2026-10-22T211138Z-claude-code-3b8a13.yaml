  summary: 'Create: AT1 receptor blockade module'
  details: |
    Creates kb/modules/at1_receptor_blockade.yaml, the fourth GPCR drug-mechanism module in the GPCR project (after mu-opioid agonism and antagonism, beta-adrenergic blockade and GLP-1 agonism). Nine nodes: AT1 antagonist occupancy (trigger, GO:0001596 DECREASED, AGTR1) to loss of AT1-mediated vasoconstrictor and mitogenic signalling (central effector, GO:0038166 DECREASED, the key conformance target), then four arms - reduced arteriolar vasoconstriction, reduced aldosterone-driven sodium retention, reduced intraglomerular pressure and proteinuria, and hyperkalaemia - plus a fetal renal tubular dysgenesis arm attached to the trigger because the injury is developmental rather than haemodynamic. Lower arterial blood pressure and slowed chronic kidney disease progression are kept as separate consequences because RENAAL reports the renal benefit as exceeding what the pressure change accounts for; collapsing them would assert the kidney protection is a pressure effect. Evidence from five references, four newly fetched (PMID:11683476 AT1-blocker pharmacology, PMID:11565518 RENAAL, PMID:35085685 RAAS-inhibitor hyperkalaemia cohort, PMID:37455034 renovascular hypertension physiology, PMID:40885583 blood-pressure meta-analysis) plus PMID:34082612, already cached for Renal_Tubular_Dysgenesis_-_ACE. The PMID:37455034 quotes describe angiotensin II agonist physiology rather than antagonist effect and are graded directness: INDIRECT with that stated in each explanation; the PMID:40885583 figure is pooled across the five antihypertensive classes rather than ARB-specific, and its explanation says so. GO:0038166 was first written into molecular_functions and the term validator rejected it as outside the MolecularFunctionTerm enum; it is a biological process and was moved to biological_processes. Three things the module declines to model and records in notes: ACE inhibitors, which act upstream of the receptor; the losartan-in-aortopathy TGF-beta claim; and the Gq/phospholipase C step, for which no citable source was found in the fetched set.

  summary: 'Review round 1: AT1 receptor blockade module'
  details: |
    Review round 1 on PR #15271. Both blocking findings were correct and both were mine. (1) The Sparsentan target_mechanisms description in IgA_Nephropathy carried a doubled apostrophe inside a plain scalar, where '' is not an escape, so the string loaded as Sparsentan''s. The cause was a wiring script that applied single-quote escaping to node descriptions, which are single-quoted scalars, and then reused the escaped text for an edge description written as a plain scalar. Fixed to a literal apostrophe and verified through yaml.safe_load on the loaded value rather than by reading the file. (2) All five new treatment edges onto the AT1 Receptor Blockade node omitted treatment_effect, so they fell back to a neutral predicate and were inconsistent with the module's own two treatments and with the merged beta-blockade conformers. ACTIVATES added to each and verified in the loaded data. Three of four suggestions taken: the fetal node's 'hypocalvaria' name half is now sourced by a second PMID:34082612 snippet, which the abstract carries; the Reduced Intraglomerular Pressure description no longer asserts preferential efferent constriction as established, and instead records that the cited evidence measures protein excretion rather than the arteriolar step; and the hyperkalaemia node is now bound to GO:0036359 renal potassium excretion DECREASED, which was already in the term caches. The fourth suggestion, splitting the bundled ACEi/ARB treatments in Heart_Failure and IgA_Nephropathy, is declined and answered on the thread: the reviewer called it defensible, the edge descriptions already name the ARB component as the one acting at the receptor, and splitting a curated treatment entry is a change to the entry's own structure rather than to this module's wiring.

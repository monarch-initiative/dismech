  summary: 'Review round 1 (PR #17328, ai4c-reviewer)'
  details: |
    Addressed the ai4c-reviewer review on PR #17328.

    Blocking (item 1): removed the GO:0006644 phospholipid metabolic process
    INCREASED binding from the Intralysosomal Phospholipid Accumulation node. It
    contradicted the module's own claim - the upstream node binds GO:0009395
    phospholipid catabolic process DECREASED and the prose states the lesion is
    lost catabolic capacity, not increased synthesis, so INCREASED on the parent
    process asserted raised flux through a pathway whose only perturbed arm is
    suppressed. GO:0019915 lipid storage INCREASED on the same node already
    states the pool increase correctly. Removing the binding also matters because
    the node is a conformance template.

    Non-blocking suggestions taken: (3) regraded the "Model experiments suggest"
    snippet on the catabolism node from evidence_source OTHER to IN_VITRO (it
    describes model-membrane experiments the review synthesises; quote_role stays
    REVIEW_SYNTHESIS); (5) dropped the mid-sentence fragment snippet on the
    Lamellar Body node, leaving the self-standing PMID:38804381 zebra/lamellar
    body definitional quote. Suggestion 2 (a second modeled_mechanisms link from
    the steatosis-module spheroid to this node) filed as a follow-up issue;
    suggestion 4 (terminal node has no term of its own) left as-is per the
    reviewer, the MPATH gap being already noted.

    Re-validated: schema, terms, reference validator (12/12), entity-refs,
    causal-targets, logical-rules, duplicate-keys, enum-values, snippet-grading,
    model-scale-audit (still 0 uncaveated).

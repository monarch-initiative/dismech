  summary: 'Create: Drug-Induced Phospholipidosis module'
  details: |
    Created kb/modules/drug_induced_phospholipidosis.yaml to give drug-induced
    phospholipidosis a mechanism home distinct from steatosis, closing the node
    gap (#16881) surfaced by the carboxylic-acid NAM paper (#16867,
    PMID:38428665). Phospholipidosis is lysosomal phospholipid accumulation,
    mechanistically closer to lysosomal_substrate_accumulation than to the
    triglyceride lipotoxicity of hepatic_steatosis_lipotoxicity, so a separate
    module was chosen over a node on the steatosis module - matching issue
    #16881's own step-2 reasoning.

    Four-node canonical cationic-amphiphilic-drug chain: lysosomal entrapment
    (trigger) -> impaired lysosomal phospholipid catabolism (central_effector,
    the key conformance target) -> intralysosomal phospholipid accumulation
    (effector) -> lamellar (zebra) body formation (consequence). The chain stops
    at the lesion and asserts no cell-death node, because a KNOWLEDGE_GAP
    discussion records that the field treats phospholipidosis as a possibly
    adaptive response of unsettled toxicological significance (PMID:16774494).
    Mechanism evidence from two reviews (PMID:31408430 Breiden & Sandhoff,
    PMID:16774494 Reasor) plus a definitional quote (PMID:38804381); all
    snippets abstract-only exact substrings (full text for #16867's paper was
    not reachable through the proxy, so the carboxylic paper is cited from its
    abstract).

    The #16867 carboxylic-acid NAM screen is homed here as an experimental_model
    (HepG2 HCS, CELL_LINE, model_scale CELLULAR, PARTIALLY_RECAPITULATES the
    accumulation node) carrying CAUSE_UNREPRESENTED (anionic carboxylic route is
    not the canonical CAD trigger) and BOUNDARY_OMISSION divergences, with a
    phospholipid-accumulation readout. The SAR/QSAR layer is a computational_model
    (MACHINE_LEARNING, model_scale MOLECULAR, MEASURES) carrying PROXY_QUANTITY,
    SCALE_EXTRAPOLATION and CALIBRATION_PROVENANCE divergences. The fatty-acid
    (steatosis) arm of the same screen is deliberately not linked here; it belongs
    to hepatic_steatosis_lipotoxicity. No disorder conformer exists yet (no CAD
    toxicity entry is curated); the module is created ahead of its conformers.


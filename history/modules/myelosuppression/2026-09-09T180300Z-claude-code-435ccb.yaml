  details: |
    Two changes, both raised as non-blocking suggestions in the review of PR #11252.

    First, a second environmental: entry, 'Exposure to Ionizing Radiation', bound to ECTO:7000047 and linked by influences_mechanisms (TRIGGERS, causal_link_type DIRECT) to 'Cytotoxic Insult to Proliferating Hematopoietic Progenitors'. PR #11252 folded radiation under ECTO:9001737 (exposure to antineoplastic agent), which does not cover it: radiation is neither a systemic agent nor a drug, and the module description names it as a first-class insult. The entry cites PMID:34402734 for the FDA-recognized hematopoietic acute radiation syndrome, marked directness INDIRECT because the quote reports the approved countermeasures rather than measuring marrow injury. The link cites PMID:31988457 for the measured fall in CD34+ progenitors after ionizing radiation on a human bone-marrow chip, evidence_source IN_VITRO.


  details: |
    Non-blocking finding from the ai4c-reviewer review of PR #11545. The radiation entry description asserted that radiation 'injures the marrow through the same preference for rapidly dividing cells'. Neither cited item states this: PMID:34402734 reports the FDA-approved countermeasures, and PMID:31988457 measures the CD34+ effect on chip. The reviewer checked the cache for a better quote and found none, since PMID_34402734 is PURPOSE and CONCLUSIONS only.


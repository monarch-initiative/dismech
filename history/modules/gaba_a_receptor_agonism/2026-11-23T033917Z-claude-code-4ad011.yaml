  summary: 'Create: GABA-A Receptor Agonism Module'
  details: |
    Created the gaba_a_receptor_agonism pharmacology module, the third inhaled-bronchodilator sibling after beta2_adrenergic_receptor_agonism and muscarinic_receptor_antagonism, closing issue #18502. Four-node chain: trigger (benzodiazepine-site occupancy of the alpha4/alpha5 airway GABA_A receptor), transducer/effector (increased chloride conductance and membrane-potential change reducing calcium influx), central_effector/key conformance target (airway smooth muscle relaxation), consequence (bronchodilation / reduced AHR). Evidence from four papers: Webb 2023 (PMID:37418196, the nam-mined paper, ex vivo relaxation and conscious-mouse plethysmography) and three Emala-lab primary sources supplying the airway receptor, the chloride-current transducer and the human-ASM relaxation (Mizuta 2008 PMID:18408071, Gallos 2015 PMID:25659897, Yocum 2016 PMID:26405827). The binding-affinity figures are brain-subtype proxies and are deliberately not recorded as airway affinity; the transducer sign is stated as measured (chloride current up, calcium influx down) with the hyperpolarisation principle kept as background. No conformer wired (the drug class is investigational). All offline gates pass; linkml/term/reference validators clean (13 snippets, 13 titles).

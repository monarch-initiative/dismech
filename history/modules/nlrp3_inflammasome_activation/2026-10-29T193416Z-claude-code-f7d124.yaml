  summary: Record Contact_Dermatitis as a candidate conformer blocked by a missing
    node
  details: |
    Issue #15944. Contact hypersensitivity is a documented route into this module: inflammasome components are present in human keratinocytes, contact sensitizers drive caspase-1/ASC-dependent IL-1 beta and IL-18 processing, and NALP3- and ASC-deficient mice respond poorly to them (PMID:17429439).

    No conforms_to was added. Contact_Dermatitis has no node this module can accept: its only keratinocyte node is curated in the irritant arm as the consequence of barrier disruption and describes mediator release without inflammasome assembly, and a hapten acting as a danger signal is not that node. Attaching conforms_to to it would assert a mechanism the node does not carry, so the blocked conformance is recorded as a CURATION_TODO discussion instead, paired with the disease-side gap no_node_for_hapten_driven_keratinocyte_activation.

    Recorded so that the absence of contact dermatitis from this module's conformer list is not read as evidence that the inflammasome plays no part in it.

    just validate-module kb/modules/nlrp3_inflammasome_activation.yaml: schema passed, 22 snippets checked, 22 titles checked, 0 issues. Outcome is needs_followup because the conformance itself remains open pending the disease-side modelling decision.

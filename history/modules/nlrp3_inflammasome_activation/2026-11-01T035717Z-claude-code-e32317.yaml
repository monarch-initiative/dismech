  details: |
    The curation_contact_dermatitis_blocked_conformer discussion said Contact_Dermatitis cannot conform because its only keratinocyte node is in the irritant arm and describes mediator release without inflammasome assembly. That became false in the same change that added a Keratinocyte inflammasome danger signalling node to that entry's sensitization arm, bound to GO:0044546 NLRP3 inflammasome complex assembly and GO:0141084 inflammasome-mediated signaling pathway.

    Rewrote the rationale to record that the attachment point now exists and the disease-side gap no_node_for_hapten_driven_keratinocyte_activation is resolved, so the question is live rather than blocked. Left status OPEN and attached no conforms_to: whether a hapten read as a danger signal by a keratinocyte is an instance of this module's Activating Danger Signal node, and whether a conforming node would carry this module's expected processes and outgoing chain, has not been assessed. Issue #15944 treats this module as its own target needing a scope check, so that assessment belongs in a separate pass.

    Evidence, members and every other discussion are unchanged. This is a prose correction to stop the module asserting a repository state that no longer holds.

  details: |
    Resolves curation_contact_dermatitis_blocked_conformer. Contact_Dermatitis now conforms, at NLRP3 Inflammasome Assembly and Caspase-1 Activation rather than at Activating Danger Signal, so the discussion is retargeted from the latter to the former and set RESOLVED with the reasoning in resolution_note.

    The prompt named the wrong anchor, and this record says so rather than quietly repointing it. Activating Danger Signal is Signal 2 and is defined by three proximal routes; the contact-dermatitis evidence identifies none of them. The assembly node's bar is what that evidence meets.

    One correction to an earlier draft of this change: it claimed check-conformance-content would report edges_absent for the new link, because the conformer's downstream follows the disease rather than this module's chain. That is wrong. edges_absent fires only when the conforming node has no downstream edges at all; it never compares where they point. The link produces no finding, and the resolution_note now states what the check does and does not ask rather than implying the clean result endorses the edge target.

    Evidence, members, nodes and every other discussion are unchanged. The two evidence items on the resolved discussion are kept, with one explanation moved from the conditional (the claim 'would rest on') to the indicative, since the conformance now exists.

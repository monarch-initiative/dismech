  summary: Make K+ efflux and ROS GO bindings directional at the danger-signal node
    (#8990)
  details: |
    Review round on PR #8990, non-blocking findings 2 and 3, folded in per the
    reviewer's suggestion.

    Finding 3 -- potassium efflux term made directional. The Activating Danger
    Signal node bound GO:0071805 "potassium ion transmembrane transport", which is
    undirected. Swapped to its strictly more precise child GO:0097623 "potassium ion
    export across plasma membrane". The K+ route is the best-evidenced arm at this
    node (Munoz-Planillo cited for sufficiency), so the directional term is
    warranted.

    Finding 2 -- ROS term pointed the wrong way. The node claims ROS generation as
    a danger signal ("mitochondrial damage with release of reactive oxygen
    species"), but GO:0006979 "response to oxidative stress" is the cell's response
    to ROS, one step downstream of what the node asserts. Swapped to GO:1903409
    "reactive oxygen species biosynthetic process", the generation-side term.
    preferred_term changed from "Mitochondrial reactive oxygen species stress" to
    "... generation" so the display name states the generation claim rather than a
    state, which is what made the original binding read as defensible.

    Not addressed in this round: findings 4 (no GO process term for the lysosomal-
    rupture route -- the reviewer's own search found only regulation-level terms, so
    this likely needs an NTR rather than a binding), 5 (pyroptosis term placement on
    the FCAS conformer), and 6 (the first evidence item on Sterile Inflammatory
    Tissue Injury supporting the module rationale rather than the node claim).

    Checks run: just validate (passed; 20/20 snippets verified), just validate-terms
    (passed; GO:0097623 newly cached, GO:1903409 already present), pytest
    tests/test_data.py -k "conform or Silicosis or nlrp3 or module" (2797 passed).

  summary: 'Create: nlrp3_inflammasome_activation mechanism module'
  details: |
    Created kb/modules/nlrp3_inflammasome_activation.yaml, the conserved two-signal NLRP3 inflammasome module identified as the one genuinely missing innate-immune module by two independent scanner assessments: issue #6189 on 2026-07-30 and its duplicate #5847 on 2026-07-12. Before this, 66 disorder entries mentioned the inflammasome in prose and about 20 carried a dedicated inflammasome pathophysiology node, but the only inflammasome node in kb/modules/ sat inside gout_urate_crystal_inflammation, scoped to monosodium urate crystal arthropathy and therefore not reusable by a silicosis, atherosclerosis, or neuroinflammation entry.

    Five nodes, trigger to consequence: priming and NLRP3 transcriptional upregulation as signal 1; activating danger signal as signal 2, holding potassium efflux, lysosomal rupture, and mitochondrial ROS/mtDNA as a union of non-exclusive routes; NLRP3-ASC assembly and caspase-1 activation as the central_effector and key conformance target; IL-1 beta and IL-18 maturation with gasdermin D-mediated pyroptosis; and sterile inflammatory tissue injury. Two complementary drug-target patterns: canakinumab INHIBITS the cytokine node, using NCIT:C80971 and the CANTOS randomized human evidence, and MCC950 INHIBITS the assembly node, using CHEBI:231684 and curated explicitly as a mechanistic design pattern rather than as available therapy.

    Deliberate non-actions, recorded rather than left implicit. gout_urate_crystal_inflammation is left untouched and no existing conformance to its NLRP3 node was retargeted; that question is recorded as an OPEN_QUESTION discussion because it is a governance call with consequences beyond this module. The non-canonical caspase-4/5 route is described in prose rather than given its own branch, because the assembled evidence does not separate its contribution in any conforming disorder. The three activating routes are curated as non-exclusive rather than ranked, with a KNOWLEDGE_GAP recording that PMID:23809161 found mitochondrial perturbation dispensable while PMID:21124315 found the mitophagy block sufficient; one evidence item from PMID:23809161 is typed PARTIAL for exactly that reason rather than being quietly dropped for contradicting the node it sits on.

    Two worked conformers were wired in the same change: Silicosis, on the particulate route, and Familial_Cold_Autoinflammatory_Syndrome, on the constitutive-variant route. Wiring them surfaced two conformance rules now written into the module notes: a conformer may split signal 2 across several atomic nodes that each conform to the single activating-signal node, and a gain-of-function NLRP3 variant enters at the central effector and must not be wired to the activating-signal node, because the point of the lesion is that no second signal is required.

    Nine references, all fetched with just fetch-reference; no reference cache file was hand-written. Validation: linkml-validate reported no issues; just validate-terms passed; just count-verified-snippets reported 20/20 snippets verified against cached references.

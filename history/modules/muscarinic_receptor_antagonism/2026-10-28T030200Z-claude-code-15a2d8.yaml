  summary: Source the Gq/phospholipase C/calcium step, bind the mucus node, strengthen
    the trigger evidence
  details: |
    Review found that the transducer node claimed three things no cited sentence supported: that the receptor couples through Gq, that the signal runs through phospholipase C, and that the output is calcium released from intracellular stores. The node carried no evidence of its own, and neither adjacent edge's evidence stated any of the three. Grading those edges INDIRECT did not cover it, because Gq coupling does not follow from a source saying only that the receptors are G-protein-coupled: the M2 subtype named in the same sentence is Gi-coupled, so the sentence fits either. The GO bindings for phospholipase C-activating signalling and calcium release therefore made an unsourced step look grounded, which is the one failure an ontology binding is most able to hide.

    Two sources now carry the step. PMID:17803731 states the M3-receptor-Gq/11-phospholipase C coupling in airway tissue directly; it is equine, and the sentence treats the coupling as the established pathway it set out to measure rather than as a species-specific finding. PMID:19549818 carries the rest of the chain in airway smooth muscle cells, from M3 through Gq and phospholipase C to IP3 and released calcium; its own novelty is that membrane depolarisation drives that chain without an agonist, so it is cited for the chain and not for its headline, and the explanation says so. Neither abstract states the species of the cell preparation, so none is asserted.

    The trigger gained a better sentence that was already in the cited cache and that the first draft missed: tiotropium antagonising the airway smooth muscle muscarinic receptors and reversing vagally mediated bronchoconstriction. That supports the occupancy directly, where the receptor-distribution sentence it previously relied on did not mention an antagonist at all, and it lets the withdrawal edge be graded DIRECT. The same sentence was added to the conforming node in Chronic_Obstructive_Pulmonary_Disease. The trigger description now also records that these agents antagonise the subtypes with differing kinetic selectivity rather than binding M3 alone, and the M3-mediated contractile response is sourced.

    The mucus arm was a leaf with no binding and now carries GO:0070254 mucus secretion with modifier DECREASED and CL:1000312 bronchial goblet cell.

    The clinical bronchodilation sentence is regraded from OTHER to HUMAN_CLINICAL, since it reports sustained bronchodilation in human trials. That change initially failed check-snippet-grading because the same sentence appears twice in the module and only one occurrence was regraded; evidence_source classifies the publication, so it cannot differ between two uses of one sentence. Both are now HUMAN_CLINICAL.

    Validation after the fixes: validate-module-batch on this module reports 10 snippets and 10 titles with 0 issues; validate-modules passes over every module; validate-disorders on the conformer reports 159 snippets and 166 titles with 0 issues; check-snippet-grading reports no new divergence, cross-file included; validate-terms, check-causal-targets, check-entity-refs, check-duplicate-keys, check-enum-values, check-logical-rules and check-block-scalar-comments all pass. All four new snippets were confirmed verbatim against the fetched cache before use, and both new reference titles were copied from the cache frontmatter.

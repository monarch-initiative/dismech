  summary: 'Review round 2: drop an overstated trigger citation'
  details: |
    Second review round on #15795, acting on three findings the reviewer marked non-blocking because two were defects introduced by this PR's own commits.

    Dropped the PMID:19549818 evidence item from the trigger node. Its snippet quoted only 'leading to a significant increase in the activity of Ca(2+) sparks and contraction in airway SMCs', whose own sentence in the abstract attributes that contraction to membrane depolarization rather than to M3 occupancy; the explanation nevertheless claimed it supported the contractile response being M3-mediated. The M3-to-Gq-to-phospholipase-C-to-calcium chain from the same abstract is already quoted on the transducer node, where it is the right claim, so the item was removed rather than re-explained. The trigger retains two DIRECT items naming the airway muscarinic receptors.

    Reworded the trigger-to-transducer edge description, which still said 'the cited review supports least directly'. The previous round replaced that edge's citation with PMID:17803731, a primary equine airway study, so the description contradicted its own evidence. The substance is unchanged and still explains the INDIRECT grade: the study measured the coupling in unblocked tissue, establishing the pathway the antagonist interrupts rather than the blocked state.

    Corrected the notes' species claim. They said neither abstract states the species of the cell preparation and asserted none. PubMed indexes PMID:19549818 under the MeSH descriptor Mice, verified against the E-utilities record rather than taken from the review comment, so the notes now say the cells are murine while recording that the abstract itself does not.

    Validation on the new head: validate-module-batch 9 snippets and 9 titles with 0 issues; validate-modules all pass; check-snippet-grading clean including the cross-file comparison; the offline structural gates clean.

  summary: 'Create: muscarinic receptor antagonism (airway)'
  details: |
    Eighth drug-mechanism module of the GPCR project's Workstream A, and the antagonist counterpart of beta2_adrenergic_receptor_agonism: the two relax the same airway smooth muscle cell through different receptors and opposite signs of signalling, which is why combination inhalers pair them.

    Chain: antagonist occupancy of the airway M3 receptor, to loss of the Gq-coupled phospholipase C arm and the calcium release that sustains contractile tone, to withdrawal of the standing cholinergic contraction, to bronchodilation. A second effector arm, reduced cholinergic mucus secretion, hangs off the trigger rather than the contractile chain, because the cited sentence names contraction and mucus secretion together and the arm reaches the clinical picture by a different route.

    The airway restriction is the substantive scope decision and it is recorded in the notes rather than left implicit, because it is not the obvious reading of the project's receptor-plus-direction rule. A census of the corpus found antimuscarinic drugs used for four mechanistically disjoint purposes that would share this trigger: airway bronchodilation in 3 entries, detrusor overactivity and neurogenic bladder in 11, striatal cholinergic blockade in dystonia and related movement disorders in 20, and reversal of a cholinergic crisis with atropine in 10. The airway arm is the smallest of the four, and only Chronic_Obstructive_Pulmonary_Disease carries a treatment specific enough to wire. The module is therefore scoped to the arm the Workstream A queue row named, not the arm where the class is most used, and that asymmetry is the opposite of the beta2 case, where the airway was the dominant use. Whether the other three arms become modules of their own or further effector arms off a shared trigger is the project's open tissue-axis question, unanswered at the time of writing.

    Several crisis-reversal entries already model the agonist side, with nodes named for muscarinic receptor overstimulation that atropine reverses. Those are the same drug-module pattern at the opposite polarity and would conform to a trigger of their own, not to this one.

    Evidence discipline: two cited reviews, both sourced for publication type rather than inferred. The receptor-level review (PMID:22842340) carries the trigger and both arms; the tiotropium review (PMID:15350163) carries the clinical consequence. The calcium and contraction steps are graded INDIRECT because both sources describe the unblocked cholinergic tone rather than measuring the blocked state. No transducer beyond the phospholipase C step is named, and no adverse-effect node is included: the antimuscarinic effects of inhaled therapy are real but no cited abstract states them, and an unsourced node would be the one claim an ontology binding made look grounded.

    Validation: validate-module-batch, validate-terms, check-causal-targets, check-entity-refs, check-duplicate-keys, check-enum-values, check-logical-rules and check-block-scalar-comments all pass. Every CURIE was looked up at the time of writing rather than recalled, and all three snippets were confirmed verbatim against the fetched cache.

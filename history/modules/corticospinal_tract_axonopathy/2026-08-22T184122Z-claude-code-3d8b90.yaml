  summary: 'Create: corticospinal_tract_axonopathy mechanism module'
  details: |
    Created the corticospinal tract axonopathy mechanism module, the hereditary spastic paraplegia final common pathway and the central-compartment counterpart of the existing peripheral_axonal_degeneration module. Five nodes: long-axon maintenance machinery defect (trigger), impaired axonal transport and organelle distribution (amplifier), distal length-dependent degeneration of long CNS axons (central effector and key conformance target), loss of supraspinal inhibitory control of the stretch reflex (effector), and progressive lower-limb spasticity and weakness (consequence). Anchored on Fink 2013 (PMID:23897027), whose abstract supplies both the eight functional categories of SPG proteins used as the trigger substitution list and the neuropathological statement that corticospinal degeneration is maximal in the thoracic cord while fasciculus gracilis degeneration is maximal cervico-medullary. Transport failure is evidenced directly in mutant spastin mice with confirmatory human post-mortem axonal swellings (PMID:19453301). Scope guardrails in notes: the myelin-formation SPGs (SPG2/PLP1, SPG42/GJC2) route to cns_myelin_failure and the neurodevelopmental SPGs (SPG1/L1CAM, SPG22/MCT8) are excluded, because a tract that never forms is not a tract that fails to be maintained. Validation run: linkml-validate reported no issues, linkml-term-validator passed, and just count-verified-snippets reported 11/11 evidence snippets verified.

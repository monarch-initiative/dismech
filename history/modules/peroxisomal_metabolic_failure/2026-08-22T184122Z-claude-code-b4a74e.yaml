  summary: 'Create: peroxisomal_metabolic_failure mechanism module'
  details: |
    Created the peroxisomal metabolic failure mechanism module, spanning both the peroxisome biogenesis disorders and the single-enzyme or single-transporter defects. Five nodes: peroxisomal biogenesis or enzyme defect (trigger), failure of peroxisomal fatty-acid oxidation and ether-lipid synthesis (amplifier), toxic fatty-acid accumulation with ether-lipid deficiency (central effector and key conformance target), neural membrane and redox dysfunction (effector), and multisystem peroxisomal disease (consequence). The central effector is written as an explicitly two-sided lesion because that is what is measured in human cerebral adrenoleukodystrophy white matter, where VLCFAs are raised while plasmalogens fall and ROS rise in the same tissue (PMID:18540993). The notes record, as the likeliest curation error, that the selective arms do not share the biogenesis arm's full biochemistry: PEX7/RCDP1 leaves VLCFAs normal, GNPAT and AGPS cause no fatty-acid accumulation at all, ABCD1 fails only VLCFA beta-oxidation, and PHYH fails only phytanic-acid alpha-oxidation. Congenital neuronal migration defects are flagged as a biogenesis-arm developmental feature rather than a consequence of the postnatal metabolic chain. Handoff to cns_myelin_failure is evidenced by the Gnpat-knockout demonstration that plasmalogen deficiency alone causes CNS hypomyelination progressing to demyelination and that oligodendrocytes require plasmalogens cell-intrinsically to ensheath an axon (PMID:30667116). Validation run: linkml-validate reported no issues, linkml-term-validator passed, and just count-verified-snippets reported 11/11 evidence snippets verified.

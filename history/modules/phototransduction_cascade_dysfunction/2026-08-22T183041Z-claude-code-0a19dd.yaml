  summary: 'Create: phototransduction_cascade_dysfunction module'
  details: |
    Created a mechanism module for the photoreceptor-intrinsic failure of the cGMP phototransduction cascade, covering both the activation arm (visual pigment, transducin, PDE6, CNG channel, guanylate cyclase and GCAP) and the shutoff arm (GRK1, SAG, RGS9 and RGS9BP). Five-node chain plus one conditional branch node marking the seam to photoreceptor_degeneration when cGMP and calcium overload supervenes. Key conformance target is the central_effector node 'Failure of Photoreceptor Light-Response Generation or Timely Recovery'. Scope explicitly excludes the Schubert-Bornschein CSNB genes, which are a photoreceptor-to-ON-bipolar transmission defect with the reciprocal ERG signature. Carries an AAV gene-supplementation RESTORES treatment pattern and a KNOWLEDGE_GAP on the stationary-versus-degenerative split within single genes. Validated: linkml-validate clean, linkml-term-validator passed, 15 of 15 snippets verified against cached references.

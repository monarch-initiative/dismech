  summary: 'Edit: say what the Replicative Immortality binding means'
  details: |
    Adds one sentence to the Replicative Immortality node's description: its cell population proliferation binding (GO:0008283, increased) records that the population keeps expanding past the limit telomere attrition would otherwise set, not that its cells divide faster. The point came up in the #15105 review, because neuroblastomas on the recombination route proliferate slowly yet conform to this node. The Neuroblastoma entry's Unlimited Replicative Potential node already states this reading for itself; the module now states it for every conformer. No binding, edge or evidence changed. Validation: validate-disorders, the C4 gate set including the kb pytest lane, validate-terms, check-logical-rules, check-cache-order and check-name-collisions pass, and validate-module-batch passes for the module.

  summary: Split the ALT route into its own node and add the telomerase target node
  details: |
    This module had a real defect rather than just a gap. Its central node, Telomere Maintenance Reactivation, names both the telomerase and the recombination route in prose and binds only GO:0007004 telomere maintenance via telomerase. So an ALT tumour conforming there asserts a mechanism it does not use, and the module's own notes direct ATRX/DAXX-mutant tumours to that node.

    Added Telomere Maintenance via Recombination (central_effector; GO:0000722 telomere maintenance via recombination) so the minority route has a node whose binding is true of it: 4 to 11% of cancers, concentrated in mesenchymal-origin tumours, poorer outcome, ATRX/DAXX and H3.3 mutations prevalent. The consequence that matters here is not statistical - because the route is telomerase-independent, an ALT tumour is indifferent to a telomerase inhibitor, and its recombination machinery is its own candidate target. PMID:32175073 four times.

    Added Telomerase as a Near-Universal Target (therapeutic_vulnerability; GO:0007004) for the other side. This hallmark is unusual in offering a target that is a property of the mechanism rather than of a tumour type: telomerase is silent in normal differentiated tissue and reactivated in most cancers, and imetelstat has now been approved. The node carries the hedge in the source's own words - almost universal - and says that telomere-maintenance route is a predictive marker here in the same way repair-pathway status is in genome_instability_mutation, so an entry proposing a telomerase-directed agent should have established that its tumour is telomerase-positive rather than inferring it from the hallmark. PMID:39349313 three times.

    The notes now route an ALT tumour to the recombination node explicitly and say why conforming to the reactivation node would be wrong for it.


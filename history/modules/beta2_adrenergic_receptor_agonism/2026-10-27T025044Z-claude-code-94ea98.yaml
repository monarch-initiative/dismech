  details: |
    Applied two of three non-blocking suggestions from review round 1 on PR #15706, both of them
    defects in content this PR introduced rather than style points.

    Thunderstorm_Asthma is now a third conformer. The module's scope notes explained the
    Chronic_Obstructive_Pulmonary_Disease and Cough_Variant_Asthma exclusions but said nothing about this
    entry, which the PR body had itself listed under the airway effector chain. Verified the reviewer's claim:
    it binds CHEBI:2549 albuterol specifically and already carried a target_mechanisms link, so the
    generic-Bronchodilator objection does not reach it. The silence was an omission, so wiring it was the right
    fix. The notes now name all three conformers and add Sulfur_Mustard_Poisoning to the excluded set, whose
    salmeterol sits inside a bundled supportive-care treatment with no agent-level binding.

    Two clauses in notes and description were cross-PR framing rather than durable fact -- 'worth setting
    beside h2_receptor_antagonism' and 'an open question on the project page rather than a decision taken
    inside this module'. Both are reworded to state the comparison and the undecided scoping question directly,
    without referring to sibling pull requests or to where a decision is recorded. This is the third time this
    register problem has been caught in these modules, so the root cause is worth naming: notes written while
    holding several sibling PRs in mind acquire references to that context, which stop making sense once the
    PRs are history.

    Not done in this PR: the projects/GPCR.md row for this module. That is a projects/-only change and CI's
    scope guard forbids one PR touching both kb/ and projects/, so it follows as its own PR once this merges,
    exactly as #15703 did for the two histamine modules.

    Validation: validate-module-batch 14/14 snippets and titles; validate-disorders and validate-terms pass on
    Thunderstorm_Asthma; the per-file gates clean on both changed files.

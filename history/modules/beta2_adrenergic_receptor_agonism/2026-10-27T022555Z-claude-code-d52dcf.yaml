  summary: 'Create: Beta2 Adrenergic Receptor Agonism Module (airway-scoped)'
  details: |
    Twelfth drug-mechanism module for the GPCR project (projects/GPCR.md Workstream A), and the beta2
    half of the airway row that PR #15703 split into two.

    Six nodes: agonist occupancy of beta2 on airway smooth muscle, Gs-coupled adenylate cyclase activation and
    cAMP generation, airway smooth muscle relaxation as the key conformance target, bronchodilation and relief
    of airflow obstruction, receptor desensitisation on continued exposure, and the serious-asthma-event risk
    that governs use without an inhaled corticosteroid. Two treatments and one KNOWLEDGE_GAP discussion.

    SCOPE DECISION, and the finding behind it. A corpus sweep for beta2-agonist treatments found the class used
    for three mechanistically disjoint purposes that share this module's trigger and transducer but not its
    effector: airway smooth muscle relaxation; enhancing neuromuscular transmission (the congenital myasthenic
    syndromes, ALG2-CDG, COXPD58, RYR1-Related_Myopathy); and driving potassium intracellularly
    (Hyperkalemic_Periodic_Paralysis). The project's recorded rule is receptor family plus direction of action,
    which does not separate them, so tissue became a third axis. This module is scoped to the airway, because
    that is how the Workstream A row names it and because tissue-scoped modules already exist in the project
    (cardiac_camp_pka_calcium_handling, spinal_hsp90_opioid_enhancement). The other two chains are recorded in
    the module description as candidates for their own modules or for further effector arms here, explicitly as
    an open question rather than a decision taken inside the module.

    The transducer and the receptor subtype are both bound, and both are more specific than the histamine
    modules' equivalents: GO:0004941 names the beta2 subtype where h1_ and h2_receptor_antagonism both had to
    use GO:0004969 histamine receptor activity, and GO:0071880 is adrenergic-specific where the H2 module could
    only use the generic GO:0007189. The module notes say this is ontology coverage rather than a claim that
    this receptor is better understood.

    Desensitisation is a mechanism node, not a knowledge gap, because the source states the mechanism
    (beta-ARK phosphorylation, beta-arrestin uncoupling, downregulation). That is deliberately set beside
    h2_receptor_antagonism, where tolerance IS a knowledge gap because its source says the mechanism is
    unclear, and beside this module's own gap on response variability, where the source says genotypic and
    phenotypic explanations have not been demonstrated. Three similar phenomena, three outcomes, driven by what
    the sources state.

    The serious-asthma-event node has no upstream edge, and the description says why: the sources report a risk
    associated with the class, and the trial cited found no significant excess for the fixed-dose combination,
    so nothing establishes that receptor occupancy causes the events. Same decision as the anticholinergic node
    in h1_receptor_antagonism. The monotherapy claim is scoped to PMID:21659855's recommendation and
    PMID:26949137's trial result; no cited source covers the regulatory history, so the module says nothing
    about boxed warnings.

    Every CURIE was looked up in the step it was written: hgnc:286 from the committed cache, GO:0004941 and
    CHEBI:5147 from OLS, and GO:0071880, GO:0006171, GO:0044557, CL:0002598, UBERON:0002185, CHEBI:2549,
    CHEBI:9011 and CHEBI:31441 from the committed caches. The monotherapy snippet is quoted with the source's
    own Greek beta after checking both spellings against the validator's normalizer.


  summary: Refine thrombogenesis boundary and evidence
  details: |
    Defined a branch-qualified operational boundary around pathological intravascular platelet-assisted thrombin/fibrin thrombus formation. Removed unsupported fixed arterial-versus-venous composition claims; excluded physiologic hemostasis, nonthrombotic occlusion, and TTP-like VWF-platelet microangiopathy; made Virchow-Triad Prothrombotic Context an optional generic context without endothelial-cell or coagulation bindings; established Pathological Fibrin-Platelet Thrombus Formation as the atomic Xogenesis output; and separated Thrombotic Vascular Occlusion and Ischemic Tissue Injury from the narrowly evidenced Venous Thrombus Embolization to Pulmonary Arteries consequence. Removed the universal rate-limiting claim, corrected the ontology-scope note to include UBERON anatomy, and replaced the mechanical-valve rivaroxaban example with an evidence-matched heparin-antithrombin mechanism plus an explicit disease-specific selection and contraindication guardrail. Module schema and term validation passed; configured reference validation verified 6 of 9 snippets and skipped 3 DOI snippets by prefix, all 3 of which were separately confirmed exact against their cached sources.

  summary: Add gerotherapeutic treatments (aspirin, metformin, SGLT2i) with mechanism
    links
  details: |
    Added the module's first treatments under the geroscience drug-repurposing project (projects/GEROSCIENCE_REPURPOSING.md; Kulkarni et al. 2022, PMID:35343051). All three link to 'Autophagy Machinery Decline'.

    Aspirin (ACTIVATES): Pietrocola et al. 2018 (PMID:29490275) shows salicylate induces autophagy by inhibiting EP300 acetyltransferase activity, with a C. elegans cpb-1 knockdown establishing the effect is EP300-dependent and conserved rather than off-target. The two items are graded IN_VITRO and MODEL_ORGANISM respectively.

    Metformin (ACTIVATES): Bharath et al. 2020 (PMID:32402267), one item documenting the age-associated autophagy defect in human T cells and one showing metformin corrects it.

    SGLT2 inhibition (RESTORES): Korbut et al. 2020 (PMID:32340263) reports both marker staining and direct electron-microscopic volume-density counts of autophagosomes and autolysosomes in podocytes, which is why the link is curated as restored flux rather than marker accumulation. The Miller et al. 2020 ITP canagliflozin lifespan result (PMID:32990681) is included as directness INDIRECT support: a 14% median male lifespan extension is why the class is worth curating, but it does not show the benefit runs through autophagy, and the effect was absent in females.


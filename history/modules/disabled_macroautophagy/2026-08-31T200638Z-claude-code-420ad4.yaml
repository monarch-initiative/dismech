  summary: Record that no human autophagic-flux biomarker exists
  details: |
    Added a KNOWLEDGE_GAP and deliberately NO biochemical block. Newly cached: PMID:30725456 and PMID:33342508, both autophagy methods reviews. Of the eleven hallmark-of-aging modules this is the only one where a literature search for an accessible human readout returns nothing usable, so the absence is recorded as a finding rather than left ambiguous. The obstacle is that autophagy is a flux and not a level: LC3 and SQSTM1/p62 are steady-state abundances of proteins consumed by the process, so raised LC3-II is equally consistent with increased autophagosome formation and with blocked degradation. Distinguishing them needs a lysosomal-inhibitor clamp or a tandem-fluorescent reporter, and the cited review scopes the quantitative flux method to cell culture and animal models. Two curator consequences are stated: do not import a single LC3 or p62 measurement as a readout, because without a flux clamp it has no direction; and this gap differs in kind from those in loss_of_proteostasis and stem_cell_exhaustion, where a marker exists but is narrowly scoped, since here the quantity of interest is not measurable by any accessible means and no further curation will close it. The gap uses the empty-anchor biochemical# form, the documented usage for a gap attached to an intentionally empty section.

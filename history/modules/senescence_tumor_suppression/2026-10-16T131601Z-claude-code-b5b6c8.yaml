  summary: Add single-cell senescence datasets
  details: |
    Added a datasets block with two single-cell GEO series on oncogene-induced senescence: geo:GSE115301 (IMR90 fibroblasts in RAS-induced primary and Notch-mediated secondary senescence plus mouse liver cells, scRNA-seq; organism recorded as the majority human component) and geo:GSE154679 (Braf-mutant melanocyte nevus mouse skin, scRNA-seq). GSE154679 is included deliberately as counter-evidence: its submitters found no evidence that the arrested nevus cells are senescent, which bears on the module's use of nevi as the oncogene-induced senescence example. GEO summaries were read for relevance; titles are GEO's own; publication PMIDs cached with just fetch-reference. No evidence blocks. Validated with just validate, just validate-terms, just verify-datasets, check-duplicate-keys and check-block-scalar-comments.

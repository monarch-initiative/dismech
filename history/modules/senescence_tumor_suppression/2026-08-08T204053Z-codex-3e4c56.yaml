  summary: Clarify senescence tumor-suppression boundaries
  details: |
    Clarified that senescence arrest and aging-associated loss of stemness are
    independent branches; bounded the latter to directly evidenced aged cells of
    origin; extended the terminal barrier wording to benign or low-grade
    progression; excluded inverse senescence-loss or escape nodes from direct
    positive conformance; required stable senescence-associated arrest plus an
    evidence-linked tumor-suppressive consequence while excluding marker-only,
    quiescent, differentiated, or reversibly cytostatic states; and removed the
    unsupported CDK4/6 example. Added a qualified Pilocytic Astrocytoma exemplar
    supporting specialization of the terminal barrier to low-grade progression.
    Updated the authoritative module registry with the same guardrails and the
    Pilocytic Astrocytoma worked conformer.


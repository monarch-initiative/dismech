  summary: 'Create module: IL-11 ERK-AMPK-mTORC1 ageing'
  details: |
    Created kb/modules/il11_erk_ampk_mtor_aging.yaml, a conserved IL-11-driven ageing mechanism module anchored on Widjaja et al., Nature 2024 PMID:39020175 open-access full text. Five-node chain trigger to amplifier to central_effector to effector to consequence: Age-Associated IL-11 Upregulation, IL-11 Receptor Signalling Activation, ERK-AMPK-mTORC1 Axis Dysregulation which is the key conformance target, Cellular Senescence and Metabolic Decline, then Frailty, Multimorbidity and Reduced Lifespan. Carries the anti-IL-11 X203 neutralizing-antibody target_mechanisms drug pattern that INHIBITS the receptor-signalling node, plus a KNOWLEDGE_GAP discussion on canonical JAK-STAT3 vs non-canonical MEK-ERK signalling contribution. Evidence mixes MODEL_ORGANISM Il11/Il11ra1 knockout and anti-IL-11 therapy in aged mice and IN_VITRO human fibroblast/hepatocyte IL-11 stimulation with U0126/rapamycin rescue. Validated with linkml-validate no issues found, count-verified-snippets 19/19 against cached PMID_39020175, and linkml-term-validator --labels passed. Registered in CLAUDE.md Available modules. Complements existing inflammaging and cellular_senescence modules as the IL-11-specific druggable driver arm.

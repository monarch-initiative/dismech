  summary: 'Create: necrotizing_vasculitis mechanism module'
  details: |
    Created kb/modules/necrotizing_vasculitis.yaml, a five-node mechanism module (trigger -> amplifier -> central_effector -> effector -> consequence) for the leukocyte-mediated fibrinoid necrosis of the vessel wall, and wired 21 conforms_to links across the eight member disorders of the existing Necrotizing_Vasculitides grouping.

    WHY A MODULE AND NOT A DISEASE ENTRY: MONDO:0800113 (necrotizing vasculitis) was already curated as kb/groupings/Necrotizing_Vasculitides.yaml (issue #8754, PR #8860). That grouping asserts a shared effector mechanism in its second membership criterion but records that it could not be encoded as a machine-checkable HAS_BIOLOGICAL_PROCESS leaf because no single shared GO process was annotated across the members. This module supplies that mechanism; the conforms_to links make the claim checkable.

    DEEP RESEARCH: falcon was requested and returned 403 ProviderAuthError. Rather than hand-substituting a provider, the run was re-issued with dr_fallback='--fallback', so openscientist produced the report and the fallback is recorded in the report frontmatter (fell_back: true, requested_provider: falcon, provider_attempts). The report was auto-renamed to research/modules/necrotizing_vasculitis-deep-research-openscientist.md. Its reference validation reports 20/20 references verified (confabulation_rate 0.0) and 14/15 quotes valid; needs_review is true because of one unsupported quote attributed to PMID:28029757 (a GWAS paper), which was NOT used in this module. Term validation: 6/6 resolved. The pre-existing disease-level report research/Necrotizing_Vasculitis-deep-research-falcon.md (falcon, 2026-08-18, from the grouping curation) was also read and mined for mechanism content.

    ACCURACY FIX MADE DURING CURATION: the amplifier node was first bound only to GO:0006957 (complement activation, alternative pathway) on the strength of the anti-MPO mouse knockout evidence. Mapping the immune-complex conformers exposed that as wrong for half the group, since deposited complexes engage the classical pathway (which is why low C4 marks cryoglobulinaemic and IgA vasculitis but not GPA/MPA). The node now binds the parent GO:0006956 alongside the alternative pathway, and its description states that the complement ENTRY ROUTE differs by arm while the shared convergent output (C5a acting on neutrophil C5aR1) is what the node is named for. The deep-research report independently reached the same two-branches-one-hub conclusion.

    BOUNDARY GUARDRAILS recorded in notes from the report's out-of-scope findings, because each is a live mis-wiring risk: Deficiency of Adenosine Deaminase 2 is already in kb/disorders/ and reaches a necrotizing medium-vessel lesion, but does so through M1 macrophage/TNF-alpha rather than the C5a/neutrophil hub, so it is deliberately NOT wired; lymphocyte-dominant vasculitides, angiotensin/pressure-driven fibrinoid vasculopathy and thrombotic microangiopathy are out of scope; in EGPA the neutrophil node is wired to the central effector while the eosinophil-infiltrative node is left unwired as an adjunct sub-branch.

    XOGENESIS ANCHOR AND AN OBO GAP: the terminal output is a canonical structure made pathological, so the anchor is OGMS:0000061 sub-typed as OGMS:0000080 pathological transformation at site UBERON:0001981. MPATH:9 fibrinoid necrosis was verified to sit in MPATH's process branch (under MPATH:596/MPATH:597), NOT in the MPATH:603 pathological-anatomical-entity subtree the Xogenesis convention normally draws from, and no MPATH continuant exists for a fibrinoid-necrotic vessel wall. That gap is recorded in notes rather than papered over by binding a continuant term that does not mean this. No CURIE in the anchor stanza is bound in a term slot.

    TERM CORRECTION: avacopan was first bound to NCIT:C124074, which term validation rejected as not in the ChemicalEntityTerm enum and whose real label is 'FGFR2 Gene Product'. Corrected to NCIT:C174788 (Avacopan), verified via OLS.

    VALIDATION: just validate-module passes (schema, terms, references) with all snippets verified as exact substrings of the cached abstracts. All eight edited conformer files pass linkml-validate. just check-entity-refs, just check-causal-targets, and just check-duplicate-keys all pass over the module and the eight conformers.

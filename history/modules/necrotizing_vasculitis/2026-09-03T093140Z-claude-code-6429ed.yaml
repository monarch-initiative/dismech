  summary: Address pre-PR red-team review of necrotizing_vasculitis module
  details: |
    Second pass on kb/modules/necrotizing_vasculitis.yaml after an adversarial pre-PR review (the dismech-pr-review pass the initiate-new-disorder-creation skill asks for). Every finding below was verified against the repository before acting on it, not taken on the reviewer's word.

    EVIDENCE CORRECTIONS. (1) PMID:19448636 was graded HUMAN_CLINICAL on a snippet describing NETs released by ANCA-stimulated neutrophils. That result was obtained by priming isolated neutrophils and incubating them with purified IgG, so the grade was wrong for the quoted claim; regraded IN_VITRO, and the paper's human arm (NET deposition in inflamed kidneys) was added as a separate HUMAN_CLINICAL item rather than conflating the two. (2) The avacopan target snippet was the fetcher's line wrap of a structured-abstract header, 'BACKGROUND: The C5a receptor inhibitor avacopan is being studied for the' - a non-propositional fragment that stopped mid-clause and passed check-snippet-length only because it is 12 words. Replaced with the complete sentence. (3) The amplifier node had no human evidence at all, only mouse and in vitro, which is the exact bias the module's own scope caveat admits; added PMID:32602136 reporting elevated serum C5a in patients versus controls. Its reference_title was initially guessed and was caught by the reference validator as a title mismatch; corrected to the real title. (4) The consequence node's second evidence item was a subjectless participial fragment whose explanation made a weaker claim than the node did, and which dragged in extravascular inflammation that this module assigns to granuloma_formation; replaced with a PMID:29078325 sentence that carries the actual ordering.

    UNSUPPORTED BINDING REMOVED. CL:0000771 eosinophil was bound at the central effector on a snippet calling eosinophils a hallmark and main effector of organ damage in EGPA. That sentence does not place eosinophil degranulation inside the vessel wall, which is the one thing that node is defined by, so the binding and its evidence item were dropped and the reason recorded in notes.

    CONFORMANCE MAPPING CORRECTED. The module declared the central effector the key conformance target that every conformer funnels through, while only two of eight wired it. GPA's and MPA's 'ANCA-Mediated Neutrophil Activation' nodes were wired to the trigger despite carrying GO:0043312 neutrophil degranulation, GO:0045730 respiratory burst and GO:0140645 NET formation - central-effector content - so both were re-pointed, taking the central effector to four of eight. The remaining four are blocked on bundled nodes in their own entries (IgA vasculitis and cryoglobulinemic vasculitis each fuse degranulation with the resulting fibrinoid necrosis in one node), which is now stated explicitly in the node description as a named follow-up rather than left as an implied claim. Splitting those nodes was deliberately not done here: it would restructure eight other people's curations inside a module PR.

    INTERNAL CONTRADICTION RESOLVED. The notes said 'the boundary is the C5a/neutrophil hub, not the lesion' and excluded DADA2 on that basis, while Primary Polyarteritis Nodosa was wired at the effector and consequence nodes only - that is, on lesion identity alone. Added an explicit distinction: PAN's mechanism is not yet curated in its dismech entry (its own evidence says idiopathic PAN's pathogenesis remains enigmatic) and the Chapel Hill definition places it on this chain, whereas DADA2's effector is known and is different. Not-yet-curated is not the same as contrary.

    DIVERGENCE FROM THE DEEP-RESEARCH REPORT RECORDED. The report recommended designating the amplifier the required hub, on the strength of its RCT and knockout evidence. The central effector was kept instead, because the key conformance target should be the most disorder-agnostic step rather than the best-evidenced one, and the amplifier is the one node whose entry route the module admits differs between arms. That reasoning is now in the module rather than implicit.

    RESEARCH FINDINGS THAT WERE CACHED BUT UNUSED. Added the feed-forward edge the report called for: the central effector now has a downstream edge back to the amplifier, cited to PMID:29078325 ('NETs provided a scaffold for AP activation'), so the chain is a loop at that point rather than a straight line. The same paper's NET-to-endothelial-damage result was added to the central-effector-to-effector edge.

    ONTOLOGY FIXES. Node locations were UBERON:0001981 blood vessel, which cannot express the wall-versus-lumen distinction the central effector is defined by; changed to UBERON:0035965 wall of blood vessel (already present in the anatomicalentityterm enum cache) on the trigger, amplifier, central effector and effector nodes, and the Xogenesis anchor site in notes was updated to match. UBERON:0002522 tunica media was dropped from the effector node: its definition is the middle layer of an artery or vein, which excludes the dermal postcapillary venules and capillaries four immune-complex conformers are wired to. The consequence node lost UBERON:0002049 vasculature (its payload is injury to the organ supplied, not to the vessel) and GO:0007596 blood coagulation (the normal haemostatic cascade, and duplicative of the thrombogenesis module). GO:0006958 complement activation classical pathway was added to the amplifier so the node's bindings match the classical-route prose already there, and GO:0042119 neutrophil activation was added to the trigger, which four of the conformers wired to it already carry.

    KNOWLEDGE GAP MADE STRUCTURAL. The asymmetry between the two arms - interventional and genetic evidence in the ANCA arm, histopathologic and review-level evidence in the immune-complex arm, with no branch-specific complement-blockade trial - was a paragraph in notes. It is now a discussions entry with kind KNOWLEDGE_GAP attached to the amplifier node, with a proposed experiment and both outcomes stated.

    GROUPING PROSE DE-STALED. kb/groupings/Necrotizing_Vasculitides.yaml still said its effector criterion was prose-only because no shared GO process was annotated across members. That is now half-false, so the criterion records where the machine-checkable form lives, that four of eight members carry it today, and why the criterion nonetheless stays prose there.

    CACHE CHURN DROPPED. cache/ncit/terms.csv had gained NCIT:C124074 'FGFR2 Gene Product' from the failed first avacopan binding. FGFR2 appears nowhere in this work; the row was removed.

    VALIDATION: just validate-module passes (schema, terms, references) with all snippets verified as exact substrings. just validate-grouping passes on the edited grouping. Both re-pointed conformers pass linkml-validate and check-entity-refs. check-causal-targets and check-enum-values pass on the module.

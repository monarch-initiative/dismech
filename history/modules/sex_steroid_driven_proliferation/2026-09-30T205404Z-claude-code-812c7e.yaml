  summary: Record why the receptor-hyperactivation node binds no receptor gene
  details: |
    Closes the last open item of the pathograph worklist in #12925. The Nuclear Steroid Receptor Hyperactivation node was the one worklist node with neither a receptor gene nor a recorded reason for its absence. The reason was already implicit in the node description, which says which receptor carries the signal is the tissue-specific substitution a conforming entry makes, oestrogen receptor in endometrium and breast and progesterone receptor in myometrium; binding one gene here would fix the choice the module exists to leave open. The node carries GO:0030518, GO:0030520 and GO:0050847 instead, which is the level the shared claim sits at. No gene was added and no claim changed. The related decision, not to create an estrogen receptor signalling module in dismech, was recorded on the issue and in the project page, and the receptor-keyed view is tracked as EnviroMech issue 3.

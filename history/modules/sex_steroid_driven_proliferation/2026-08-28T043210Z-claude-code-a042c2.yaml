  summary: Create the sex-steroid-driven tissue proliferation module and wire five
    conformers
  details: |
    New mechanism module factoring out the chain that five KB entries were each modelling separately with no conforms_to between them: sustained sex-steroid ligand exposure, nuclear steroid receptor hyperactivation, sustained mitogenic transcriptional output (the key conformance target), target-cell population expansion, and a benign hormone-dependent proliferative lesion. Nine evidence items across five references, all exact-quote verified. Two treatments follow the module drug-target pattern: steroid axis suppression INHIBITS the amplifier node, progestin opposition INHIBITS the consequence node. Conformers wired: Endometrial_Carcinoma and Endometrial_Endometrioid_Adenocarcinoma (amplifier plus consequence), ER_Positive_Breast_Cancer (amplifier plus central effector, whose Estrogen-Driven Transcription node already carried GO:0045944, the term independently chosen for the module central effector), Breast_Fibroadenoma (amplifier plus consequence), Uterine_Leiomyoma (effector). Scope discipline: GO:0030520 appears in twelve KB entries but only five belong here. Excluded are estrogen deficiency states (Aromatase_Deficiency, 46_XX_Gonadal_Dysgenesis, Heart_Failure, Triple_Negative_Breast_Cancer loss-of-signaling), receptor status curated as a tumor property (Metastatic_Breast_Carcinoma, PIK3CA_Mutant_Breast_Cancer, Testicular_Sex_Cord_Stromal_Neoplasm), and Lymphangioleiomyomatosis, where estrogen drives cell survival and dissemination rather than target-tissue proliferation. The amplifier node is written at the nuclear-receptor level rather than as an estrogen-specific step because the leiomyoma conformer runs on progesterone (GO:0050847). Deliberately not curated as an Xogenesis module: terminal outputs range from a diffuse hyperplastic tissue state to a discrete benign neoplasm, so no single pathological-anatomical-entity anchor fits, and none is asserted. Module notes also record the boundary against sustaining_proliferative_signaling: there the pathway is constitutively active and ligand-independent, here the receptor is intact and the abnormality is the duration and opposition of physiological ligand exposure.

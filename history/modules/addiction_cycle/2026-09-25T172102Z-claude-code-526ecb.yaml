  summary: 'Create: addiction cycle module'
  details: |
    New five-node module following the Koob and Volkow three-stage addiction cycle (PMID:27475769): Acute Mesolimbic Dopamine Reinforcement (trigger), Incentive Salience and Habit Formation (amplifier), Reward Deficit and Stress-System Recruitment (central effector and key conformance target), Prefrontal Executive Control Deficit (effector), and Compulsive Seeking and Loss of Control (consequence). One treatment block records the opioid-receptor antagonist drug-target pattern (naltrexone, nalmefene) with human trial evidence in alcohol dependence (PMID:21154349) and gambling disorder (PMID:16449486). Sixteen evidence items across nine PMIDs, all exact-quote verified against the cached abstracts or full text. Nodes bind GO, CL and UBERON terms only. GO has no kappa-specific signalling term, so the dynorphin arm is bound to GO:0038003 and the note says so. Three PMIDs fetched while drafting turned out to be unrelated papers (wrong IDs); their cache files were deleted and the correct papers were found via PubMed search. Conformers: Alcohol_Use_Disorder, Opioid_Use_Disorder, Gambling_Disorder.

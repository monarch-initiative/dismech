  summary: 'Create: Mitochondrial Iron-Sulfur Cluster Assembly Failure module'
  details: |
    Created a mechanism module for inherited failure of the mitochondrial iron-sulfur cluster assembly machinery. Deep research was requested from antigravity, whose quota was exhausted (HTTP 429), so the run fell back to claude_code and the report records requested_provider=antigravity with fell_back=true. The report's recommendations were followed rather than the module skeleton's first draft: the shared core was cut to three steps (factor lesion, reduced nascent supply, reduced delivery to client apoproteins), the client consequences were split into three sibling branches a conformer declares individually, and mitochondrial iron accumulation plus iron regulatory protein 1 activation were made optional rather than core, because iron accumulation is reported absent in FDX2 patient muscle and the protein-level IRP1 activation is demonstrated for GLRX5 rather than across the pathway. The export step (ABCB7) is excluded as a sibling mechanism, and the notes state what must not conform: client apoenzyme diseases, complex-specific assembly factor diseases, and cytosolic assembly or export diseases. Conformers were wired in review round 1, and only to entries already on main: Multiple Mitochondrial Dysfunctions Syndrome 1 (NFU1, four nodes), Multiple Mitochondrial Dysfunctions Syndrome 2 (BOLA3, four nodes) and Sideroblastic Anemia 3 (GLRX5, three nodes, including the optional iron-regulatory and erythroid branches). The three entries curated alongside this module in the same batch are NOT wired here: conforms_to is a hard foreign key, so a disorder PR carrying an anchor into a module file that is not yet on main fails CI, which is what happened on PRs 18448 and 18449. Their wiring is deferred to a follow-up PR once both halves are merged. X-Linked Sideroblastic Anemia With Ataxia is deliberately left unconformed as a cytosolic-export disease. Three discussion sections cover the branch-coverage gap being a literature artifact rather than biology, the optionality of iron accumulation, and whether a sibling cytosolic module should be written. Three snippets failed because the validator strips square brackets from cluster nomenclature and were replaced with bracket-free spans. Validated with just validate-module-batch (27 snippets, 0 issues) and just check-entity-refs.

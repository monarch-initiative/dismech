  summary: 'Create: Mitochondrial Iron-Sulfur Cluster Assembly Failure module'
  details: |
    Created a mechanism module for inherited failure of the mitochondrial iron-sulfur cluster assembly machinery. Deep research was requested from antigravity, whose quota was exhausted (HTTP 429), so the run fell back to claude_code and the report records requested_provider=antigravity with fell_back=true. The report's recommendations were followed rather than the module skeleton's first draft: the shared core was cut to three steps (factor lesion, reduced nascent supply, reduced delivery to client apoproteins), the client consequences were split into three sibling branches a conformer declares individually, and mitochondrial iron accumulation plus iron regulatory protein 1 activation were made optional rather than core, because iron accumulation is reported absent in FDX2 patient muscle and the protein-level IRP1 activation is demonstrated for GLRX5 rather than across the pathway. The export step (ABCB7) is excluded as a sibling mechanism, and the notes state what must not conform: client apoenzyme diseases, complex-specific assembly factor diseases, and cytosolic assembly or export diseases. Three disorder entries were wired as real conformers in the same change (MMDS3 six nodes, COXPD19 five, Sideroblastic Anemia 4 two), while X-Linked Sideroblastic Anemia With Ataxia and MMDS10 are deliberately left unconformed as cytosolic-pathway diseases. Three discussion sections cover the branch-coverage gap being a literature artifact rather than biology, the optionality of iron accumulation, and whether a sibling cytosolic module should be written. Three snippets failed because the validator strips square brackets from cluster nomenclature and were replaced with bracket-free spans. Validated with just validate-module-batch (27 snippets, 0 issues) and just check-entity-refs.

  summary: Add the transcript-collapse consequence node to the rifamycin module
  details: |
    Same shape of gap as the sibling fluoroquinolone module: target node, resistance node, and no account of the lesion in between. All three of the module's evidence items were abstract framing sentences from one review, PMID:32342856, none of them mechanistic.

    Added a consequence node, Abortive Transcription and Collapse of the mRNA Pool, bound to GO:0006351 DNA-templated transcription DECREASED and GO:0010467 gene expression DECREASED. It records the two facts that make the rifamycin lesion unusual and that the module previously asserted without a source: the drug does not occupy the active site, and catalysis is not what it blocks. Evidence is the Campbell 2001 crystal structure, PMID:11290327, cited twice as PRIMARY_RESULT - for the binding site being more than 12 A from the active site inside the DNA/RNA channel, and for the inhibitor blocking the elongating RNA's path once the transcript reaches two to three nucleotides. Those two also explain why a single rpoB substitution in that pocket abolishes the effect without costing the enzyme its function, which is the resistance node's premise.

    Graded IN_VITRO: crystallography plus biochemistry on purified polymerase. Extended the module description to say what the consequence node adds, per the rule that a module's description is its authoritative scope statement. Validated with just validate-module-batch (5 snippets, 0 issues) plus the offline per-file gates.

  summary: 'Create: GLP-1 receptor agonism mechanism module'
  details: |
    Second Workstream A module of the GPCR project after beta-adrenergic blockade. Chain: GLP1R agonist binding -> Gs coupling and adenylyl cyclase activation -> PKA and Epac2 effector engagement (the key conformance target for the metabolic arms) -> four arms: glucose-dependent potentiation of insulin secretion, suppressed glucagon secretion, slowed gastric emptying, reduced food intake. The first three converge on improved glycaemic control; the last two feed weight loss. Treatments carry the drug-target pattern for single-target agonists (semaglutide, liraglutide) and GLP-1/GIP co-agonists (tirzepatide), whose GIPR half is explicitly out of scope and whose receptor is deliberately not bound on any node.
    Two scope judgements are recorded rather than assumed. First, the module names no dominant mechanism for weight loss: PMID:42083883 assesses eight candidate mechanisms and concludes the evidence supports no single dominant one, and finds the liraglutide appetite effect moderate, not dose-dependent and transient. That quote is carried on the Weight Loss node and on the Reduced Food Intake node as a bound rather than as support, and the notes tell a conforming obesity entry to conform at the receptor or cAMP step instead of against an arm. Second, the emesis arm hangs off the trigger rather than the central effector, because the only direct evidence at that site (PMID:40622911, mouse) shows postsynaptic AMPA-receptor dependent coupling in the area postrema and does not place the step below cAMP/PKA; the notes say the edge should move if a cAMP-dependent account is established.
    The central effector names Epac2 beside PKA, following PMID:14693691: removing Epac function blunts the GLP-1 insulin-secretory effect, so PKA alone would be wrong. Epac2 is named in prose because no single GO term covers both effectors, and no CHEBI binding is placed on cAMP, per the convention in cardiac_camp_pka_calcium_handling. Complementarity stated in the description: this module is the cAMP-raising mirror of beta_adrenergic_receptor_blockade, and it stops short of diabetic_vascular_complications, which opens at chronic hyperglycaemia.
    Validation: linkml-validate, linkml-term-validator and just validate-module-batch (13/13 snippets, 13/13 titles, 0 issues); check-gene-activity-grounding against origin/main reports no newly ungrounded genes.

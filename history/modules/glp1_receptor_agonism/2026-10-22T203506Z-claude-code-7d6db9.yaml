  summary: 'Review round 1: GLP-1 receptor agonism module'
  details: |
    Review round 1 on PR #15252. Both blocking findings were correct. (1) The Reduced Food Intake node bound CL:4042033 pro-opiomelanocortin neuron and UBERON:0001932 arcuate nucleus of hypothalamus, but neither cited snippet names POMC neurons, the arcuate nucleus or the hypothalamus, and the node's own description says 'hypothalamus and hindbrain'. Searched all four cached references for an arcuate/POMC/hypothalamic sentence; the only hits are about GIP, which the module scopes out, or a list of brain nuclei. Both bindings removed and the description now records why no site is bound. (2) The two PMID:42083883 quotes the PR body described as bounds were recorded supports: SUPPORT / directness: DIRECT. Weight Loss now carries a direct outcome sentence from the same review ('unprecedented, nonsurgical levels of weight loss') and the no-single-dominant-mechanism sentence is regraded supports: NO_EVIDENCE, which is what CLAUDE.md's PARTIAL replacement table gives for a quote that is true and worth citing but not about this claim. Improved Glycaemic Control's islet snippet is regraded directness: INDIRECT and a class-level HbA1c-reduction sentence added from PMID:29949126. Also took three suggestions: the trigger node's degradation-resistance claim is now sourced to PMID:29949126 (newly fetched); GO:0044508 added to the area postrema node; TOXICOLOGY dropped from module_categories, since the adverse arm is a dose-limiting on-target effect at therapeutic exposure rather than toxicity. A first pass introduced a duplicate directness key, caught by the reference validator and repaired before commit.

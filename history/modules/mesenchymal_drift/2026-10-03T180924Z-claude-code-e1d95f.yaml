  summary: 'Create: mesenchymal_drift module'
  details: |
    New mechanism module for age-associated loss of cell identity (mesenchymal drift), prompted by Eric Topol's Ground Truths post 'Loss of cell identity drives human aging'. Five-node chain: epigenetic erosion of lineage-identity maintenance -> sustained pro-mesenchymal signaling -> mesenchymal drift of differentiated cells (key conformance target) -> loss of tissue homeostasis and fibrotic remodeling -> age-related organ decline and mortality. Evidence from the primary Cell 2025 study (PMID:40816266), the 2026 Cell framework perspective (PMID:42208498), a 2025 Frontiers in Pharmacology review (PMID:41322283) and a 2026 BMB Reports review applying the framework to Alzheimer's disease (PMID:42680479). Yamanaka-factor partial reprogramming recorded as an experimental INHIBITS intervention on the central node. A KNOWLEDGE_GAP discussion records that the evidence is transcriptomic and correlational, so causality is unsettled. The Gladyshev Nature 2026 perspective cited by the post was fetched but returned no quotable text and is not cited. GO epithelial-to-mesenchymal transition deliberately not bound, because the sources distinguish the drift from EMT. No conformers wired yet. Validated with just validate, count-verified-snippets (11/11), validate-terms, and the offline gates.

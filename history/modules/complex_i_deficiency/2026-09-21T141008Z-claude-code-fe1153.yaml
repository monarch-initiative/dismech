  summary: 'Create: complex_i_deficiency mechanism module'
  details: |
    Created kb/modules/complex_i_deficiency.yaml, a 4-node conserved mechanism module for isolated mitochondrial complex I (NADH:ubiquinone oxidoreductase) deficiency, mirroring the sibling complex_iv_assembly_deficiency module. Chain: Complex I Biogenesis or Repair Failure (trigger) -> Impaired NADH:Ubiquinone Oxidoreduction and ATP Synthesis (central_effector, the key conformance target) -> Lactic Acidosis and Metabolic Decompensation / High-Energy Tissue Dysfunction (consequences). Scoped deliberately wider than its complex IV sibling to span BOTH the assembly/subunit branch (the MC1DN series) and the subunit-exchange repair branch (DNAJC30/arLHON), because the LHONAR1 entry states its disease is one of impaired repair rather than impaired construction and a name like complex_i_assembly_deficiency would have excluded it. Takes no position on the open MC1DN lump/split nosology question in issue #9864, where the ruling is reserved for a human curator; a Mitochondrial Complex I Deficiency Grouping is the deferred follow-up. Validation: linkml-validate 'No issues found'; reference validator 'Snippets checked: 9/9 verified against cached references'; linkml-term-validator 'Validation passed' (5 GO terms, independently cross-checked against OLS because the local go.db is corrupt and OAK's downloader returns HTTP 403).

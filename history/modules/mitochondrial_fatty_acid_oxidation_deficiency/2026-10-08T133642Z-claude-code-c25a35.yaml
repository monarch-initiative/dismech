  summary: 'Create: mitochondrial_fatty_acid_oxidation_deficiency mechanism module'
  details: |
    Created kb/modules/mitochondrial_fatty_acid_oxidation_deficiency.yaml, a six-node module for the mitochondrial fatty acid oxidation disorders and their toxic phenocopies. Chain: Carnitine Cycle or Beta-Oxidation Enzyme Deficiency (trigger) -> Impaired Mitochondrial Fatty Acid Beta-Oxidation (central_effector, key conformance target) -> Fasting Energy Substrate Failure with Impaired Ketogenesis (effector, the catabolic-stress gate) -> three organ consequences: hypoketotic hypoglycemic crisis with hepatic dysfunction, exercise- and fasting-triggered skeletal muscle energy failure, myocardial energy failure with cardiomyopathy and arrhythmia. Peroxisomal oxidation, ketogenesis enzymes and the gene-specific toxic-acylcarnitine branch are excluded in the notes with reasons. Motivated by the corpus census: GO:0006635 was bound in 35 entries, 30 on non-conforming nodes, with no module binding it. Every PMID was found by PubMed search in this session, fetched with just fetch-reference, and every snippet copied from the cached abstract. 16 conformance links wired across 13 entries in the same change.

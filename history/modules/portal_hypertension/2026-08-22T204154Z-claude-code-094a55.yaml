  summary: 'Review fix: cite PREDESCI directly; retag review evidence; drop mismatched
    GO term'
  details: |
    Addresses two IMPORTANT review findings on PR #9260. PMID:37159031 is a JAMA narrative review and was tagged HUMAN_CLINICAL at four points; all four are now OTHER per the evidence-source SOP. That mattered because two of them carried the module's only hard nonselective-beta-blocker efficacy claim, so the PREDESCI trial (PMID:30910320) is now cited directly on both the treatment and its target_mechanisms link, supplying the 16% vs 27% primary-endpoint result and the trial's own conclusion at HUMAN_CLINICAL. PREDESCI also grounds the central_effector node quantitatively via the HVPG >=10 mmHg definition of clinically significant portal hypertension. Separately, GO:0097746 (blood vessel diameter maintenance) was removed from the Portal Hypertension node: that node is an organ-level haemodynamic state and the GO term describes a cellular process, so it was a false match; the node retains UBERON:0001639 and now carries a note explaining why it deliberately has no GO process term. Added the reciprocal cross-reference to cholestatic_liver_injury. Validation: schema, terms and snippets clean.

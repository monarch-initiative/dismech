  summary: 'Create module: portal_hypertension'
  details: |
    Created the portal hypertension mechanism module. Five-node haemodynamic chain: increased intrahepatic vascular resistance -> splanchnic vasodilation and hyperdynamic circulation (amplifier) -> portal hypertension (central_effector, key conformance target) -> portosystemic collateral formation and gastro-oesophageal varices -> hepatic decompensation. Notes document the pre-/sinusoidal/post-sinusoidal trigger substitutions and record that prehepatic portal vein thrombosis conforms at the portal hypertension node and below rather than at the intrahepatic-resistance trigger. Carries the nonselective beta-blocker drug-target pattern deliberately on the splanchnic inflow amplifier, with a KNOWLEDGE_GAP recording that the intrahepatic resistance arm has no established pharmacotherapy - the therapeutic asymmetry conformers must preserve. Validation: linkml-validate clean; linkml-term-validator passed; 12/12 evidence snippets verified against cached references.

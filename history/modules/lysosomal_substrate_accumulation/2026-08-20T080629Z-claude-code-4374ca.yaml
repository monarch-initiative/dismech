  summary: Add cross-cutting knowledge gaps; wire mps_gag_storage as a specialization
  details: |
    Reviewed the Lysosomal Storage Disorders grouping tree - the LSD grouping plus its nested Mucopolysaccharidoses, Mucolipidoses and Niemann-Pick Diseases groupings - for member completeness and currency against 2025-2026 literature. Two changes to this module. First, its Lysosomal GAG Accumulation counterpart in mps_gag_storage now declares conformance here, making the MPS module an explicit specialization of the general storage module rather than a parallel one. Second, added three evidence-backed KNOWLEDGE_GAP discussions attached to module nodes: CNS delivery, where the March 2026 US accelerated approval of tividenofusp alfa for MPS II rests on CSF heparan sulphate reduction rather than a measured neurologic outcome, with clinical benefit still to be verified; heterozygous LSD-gene carrier risk for adult-onset neurodegeneration, extending the GBA1 paradigm to MCOLN1; and the direction of TFEB dysregulation under active storage, where levacetylleucine lowers rather than raises nuclear TFEB in an NPC cell model, inverting the TFEB-activation therapeutic rationale. Validation: just validate passed; just count-verified-snippets reported 14 of 14 snippets verified against cached references; the targeted conforms_to and grouping pytest selection passed.

  summary: Add TPC2 direction-of-modulation controversy to the lysosomal storage module
  details: |
    Explored TPC2 (TPCN2, HGNC:20820) as a therapeutic target at user request, following the chlorpromazine ALS investigation. Added a kind: CONTROVERSY discussion (controversy_tpc2_direction_of_modulation) attached to pathophysiology#Lysosomal Substrate Accumulation and pathophysiology#Autophagic-Lysosomal Dysfunction and Secondary Cascade, with nine exact-quote-verified evidence items and one head-to-head experiment. The controversy is that three in vivo results point three ways on the same channel: small-molecule activation rescues MLIV/NPC1/Batten cellular phenotypes and MLIV mouse rotarod, P62 aggregates and cerebellar astrogliosis (PMID:35929194); trans-Ned-19 inhibition reduces infarct volume after rat tMCAO by hampering hyperfunctional autophagy (PMID:36708960); and in LRRK2 Parkinson's models TPC2 is itself pathogenic, with the authors concluding both inhibition and select activation are beneficial (PMID:40279672). The reconciling fact is pharmacological rather than disease-specific: TPC2 ion selectivity is set by the activating ligand, a NAADP-mimetic giving non-selective cation currents and a PI(3,5)P2-mimetic giving Na+-selective currents, coupled to opposing changes in lysosomal pH and exocytosis (PMID:32167471). Recorded the load-bearing detail that every experiment in the storage-rescue study, cells through MLIV mouse, used the PI(3,5)P2-mimetic TPC2-A1-P rather than the NAADP-mimetic TPC2-A1-N, so the strongest evidence for activating TPC2 is evidence for one specific mode; that snippet was extracted byte-exactly from the cache because the full text uses U+2010 hyphens. Two overclaims deliberately avoided: BAPTA-AM blunts TPC2-A1-P so the rescue is not Ca2+-independent, and TPC2-A1-P was undetectable in plasma and brain by 240 minutes at a dose chosen to sit above threshold for about 20 minutes, so it is a tool compound rather than a demonstration that sustained activation is safe or sufficient. The discussion explicitly complements the pre-existing gap_tfeb_direction_of_dysregulation_in_storage, which asks the same raise-or-normalize question one step downstream at TFEB. Companion analysis: docs/reports/tpc2-target-exploration-2026-09-26.md. Validated with just validate (23/23 snippets verified), check-duplicate-keys, check-entity-refs, check-enum-values, check-causal-targets, check-qualifier-terms.

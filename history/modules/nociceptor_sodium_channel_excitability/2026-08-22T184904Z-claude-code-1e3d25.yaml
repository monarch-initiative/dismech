  summary: 'Create: Nociceptor Sodium Channel Excitability module'
  details: |
    New bidirectional channelopathy module for the Mendelian nociceptor Nav disorders - SCN9A, SCN10A, SCN11A - created because the KB already held both directional extremes as separate entries, Congenital_Insensitivity_to_Pain and Primary_Erythermalgia, with no module tying them to a shared rate-limiting node.

    Chain: nociceptor voltage-gated sodium channel variant -> either loss of nociceptor sodium current or enhanced/persistent current -> nociceptor action potential threshold and firing, the central_effector and key conformance target -> hyperexcitability and ectopic firing, or failure of nociceptive signal transduction.

    The module exists specifically because the biophysical-to-clinical mapping is not monotonic. A crossing branch, Sustained Nociceptor Depolarization and Conduction Block, models SCN11A gain-of-function holding nociceptors depolarized so that action potentials fail, producing pain insensitivity from a biophysical gain, PMID:24036948. The notes state that the two directional branches are not interchangeable conformance targets and that a channel variant with no demonstrated effect on nociceptor firing does not conform.

    The drug-target pattern is branch-specific by evidence rather than by convention: carbamazepine INHIBITS the persistent-current node and is effective in PEPD but not in erythromelalgia, and the same paper shows the drug acting on one biophysical sub-mechanism and not the other, PMID:17145499. Carries a KNOWLEDGE_GAP on the failure of selective Nav1.7 blockers to reproduce the congenital-loss analgesia, so the clean human genetics at this node is not read as evidence for that drug strategy. The developmental NGF-TRKA and PRDM12 route to pain insensitivity, where nociceptors are lost rather than silenced, is explicitly scoped out.

    Conformers wired in the same change: Congenital_Insensitivity_to_Pain across all three branches, Primary_Erythermalgia, and the newly created Paroxysmal_Extreme_Pain_Disorder.


  summary: 'Review: replace non-supporting evidence, fix evidence_source, cite SCN10A'
  details: |
    Coherency and evidence review pass over the module as created earlier in this branch. Three defects found and fixed.

    1. The hyperexcitability node rested on a snippet that demonstrated nothing. It cited PMID:14985375's hedged sentence that SCN9A may play an important role in nociception and vasomotor regulation - a linkage/mutation paper that performed no electrophysiology - to support a node claiming nociceptors fire spontaneously and to innocuous stimuli. Replaced with PMID:18945915's direct current-clamp result that a gain-of-function variant renders DRG and trigeminal neurons hyperexcitable, plus PMID:22136189 for the clinical read-out including the innocuous-warmth trigger.

    2. Two evidence_source values misdescribed their publications. PMID:24036948's patch-clamp result on mutant Nav1.9 channels was tagged HUMAN_CLINICAL; corrected to IN_VITRO. The same paper's background statement of where SCN11A is expressed was also HUMAN_CLINICAL; corrected to OTHER.

    3. SCN10A was named in the trigger node, the module description and the notes but cited nowhere. Added PMID:24813307, which states that Nav1.8 (SCN10A) and Nav1.9 (SCN11A) variants lead to small-fibre neuropathy and congenital insensitivity to pain respectively - covering both the missing gene and both clinical directions the module models.

    Validation after the pass: linkml-validate clean; linkml-term-validator clean; validate-references 13/13 snippets verified.

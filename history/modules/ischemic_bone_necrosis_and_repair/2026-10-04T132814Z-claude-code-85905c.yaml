  summary: 'Create: ischemic_bone_necrosis_and_repair module (issue #10063)'
  details: |
    Created kb/modules/ischemic_bone_necrosis_and_repair.yaml for issue #10063, factoring
    the bone-death-from-interrupted-blood-supply mechanism out of Osteonecrosis and
    Osteochondrosis. Eight nodes on one trigger with two arms: Bone Vascular Supply
    Interruption (trigger) -> Ischemic Osteocyte and Marrow Cell Death (bony arm) and
    Epiphyseal Cartilage-Canal Ischemic Chondronecrosis -> Growth Plate Injury and
    Delayed Endochondral Ossification (epiphyseal arm); both arms converge on Necrotic
    Bone DAMP Release and Inflammatory Repair Bias (amplifier) -> Resorption-Dominant
    Revascularization and Creeping Substitution (central effector, the key conformance
    target) -> Structural Failure of Necrotic Bone under Mechanical Load -> Residual
    Articular Deformity and Secondary Osteoarthritis. Three nodes are new to the KB
    (growth-plate injury, DAMP-driven repair bias, resorption-dominant repair) and carry
    newly fetched evidence (piglet and rat infarction models, human perfusion MRI, human
    necrotic-bone-fluid and synovial-fluid cytokine studies). Two treatment patterns with
    target_mechanisms: antiresorptive therapy (bisphosphonate or RANKL inhibition) on the
    central effector and mechanical unloading/containment on structural failure. One
    HUMAN_MODEL_MISMATCH discussion records that the quantitative repair claims rest on
    piglet, foal, rat and mouse models. Deliberately excluded: marrow adipogenesis and
    lipotoxicity (glucocorticoid/alcohol-specific, stays in Osteonecrosis), the
    repeated-infarction model of Perthes disease (not asserted; an entry wanting it should
    carry an EMERGING mechanistic_hypothesis), the apophyseal and physeal osteochondroses
    (no ischemic trigger; forbidden from conforming), and any module_categories value.
    Validation: just validate-module passed (schema, terms, references; 46/46 snippets).
    Eleven references fetched with just fetch-reference; one new CHEBI term cache row
    (CHEBI:41060 ibandronate).

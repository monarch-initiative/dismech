  details: |
    Review of PR #13542. On the central effector, the PMID:40342202 explanation now says outright that the decreased osteoclast count at three weeks post-infarction precedes the resorptive phase and is not evidence against resorption dominance. On the amplifier, the PMID:36428981 item (a general bone-metabolism review) is graded directness INDIRECT and its explanation says the inference to the ischemic segment is the curator's and that it is kept because Kummell_Disease's HIF-1alpha node cites the same sentence. On the antiresorptive treatment, a notes field records that OLS searches of ChEBI for ibandron and ibandronic on 2026-10-04 returned only CHEBI:41060 (IBANDRONATE, canonical label upper-case) and CHEBI:756152 (ibandronate sodium), so no curated ibandronic acid term exists to prefer. Also restored six NCIT rows (C1027, C195, C29272, C29469, C47671, C80255) that the first commit had dropped from cache/enums/chemicalentityterm_b3afbb412a9e.csv; they are bound by CTLA4_Haploinsufficiency, Collagenous_Sprue and Hereditary_Spastic_Paraplegia_44 and the file now differs from main only by the added CHEBI:41060 row.

  summary: 'Add module-level environmental: entry for the culprit-drug exposure (#10959)'
  details: |
    Added an environmental: entry, 'Exposure to a Culprit Drug for Severe Cutaneous Adverse Reaction', bound to ECTO:0000509 (exposure to drug) and linked by influences_mechanisms (TRIGGERS, causal_link_type DIRECT) to the module's opening trigger node 'HLA-Restricted Drug Presentation to Drug-Specific T Cells'. Second pass on the scope proposed in #10959; PR #11252 left this module because ECTO has no drug-hypersensitivity exposure term.

    The binding follows the precedent that PR's reviewer accepted for viral_oncogenesis, which binds ECTO:3000001 (exposure to virus) while carrying the specificity in preferred_term. ECTO does carry terms for individual culprits (ECTO:9000603 carbamazepine, ECTO:9001359 sulfonamide, ECTO:9001740 anticonvulsant, ECTO:9001720 NSAID), but each names one substitutable culprit and the module's claim is that the culprit varies while the cascade does not. The search and the reasoning are recorded in review_notes rather than notes.

    Evidence. The entry cites PMID:17805350 (the EuroSCAR case-control study), newly cited in this module, twice: once for the confirmed culprit-drug classes as a group, once for the exposure window being restricted to the first weeks of intake. Both are HUMAN_CLINICAL, which also diversifies a module whose evidence was otherwise entirely review-sourced. The link cites PMID:28133001 for the drug, HLA and T-cell-repertoire combination; that quote extends the sentence the trigger node already cites, which stops before the drug-side terms, and the explanation says so.


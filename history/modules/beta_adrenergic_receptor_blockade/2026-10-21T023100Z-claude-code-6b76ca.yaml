  summary: 'Create: beta-adrenergic receptor blockade mechanism module'
  details: |
    First Workstream A module of the GPCR project after the mu-opioid pair. Chain: competitive ADRB1/ADRB2 antagonist occupancy -> loss of Gs coupling and adenylyl cyclase activation -> reduced cAMP-dependent protein kinase activity (the key conformance target) -> three tissue arms (sinoatrial firing and myocardial contractility, juxtaglomerular renin release, and loss of beta-2-mediated bronchiolar relaxation) -> reduced myocardial workload, or bronchospasm on the adverse arm. Treatments carry the drug-target pattern for cardioselective, non-selective and multi-mechanism agents.
    Two arms were deliberately not asserted. The intracellular calcium-handling chain is left to cardiac_camp_pka_calcium_handling, which travels the same cascade in the cAMP-raising direction; and no ocular arm was added, because whether topical timolol lowers intraocular pressure through ciliary-epithelial cAMP is disputed (PMID:11502564 argues for a cAMP-independent effect), so glaucoma is not offered as a conformer. The bronchospasm consequence carries an explicit selectivity precondition: the cited pharmacovigilance review found no asthma deaths attributable to cardioselective beta-1 blockers.
    GO has no bronchoconstriction class (OLS searches for 'bronchoconstriction' and 'bronchus smooth muscle contraction' return CHEBI and CL hits only), so the airway node binds GO:0044557 relaxation of smooth muscle with modifier DECREASED. Validated with linkml-validate, linkml-term-validator and the reference validator (14/14 snippets, 14/14 titles, 0 issues), plus just validate-module-batch.

  details: |
    Four changes from the #15087 and #15088 review rounds, all correct findings.
    Both PMID:32473788 snippets started at 'adrenoreceptors', dropping the beta1 and beta2 prefixes. On the airway node that removed the very subtype the selectivity argument rests on, while its explanation claimed the quote located the beta-2 population. Both snippets now carry the prefix; the unicode beta folds under normalization, so validation is unaffected.
    The PMID:24366330 item sat on the PKA node, where the quote supported neither PKA nor the 'not uniform across agents' clause its explanation claimed, because the snippet stopped before that clause. It is moved to the Beta Blockade with Additional Pharmacology treatment, whose premise is exactly that agents differ, with the clause restored.
    Reduced Sinoatrial Firing and Myocardial Contractility bundled chronotropy and inotropy in one node. Split into Reduced Sinoatrial and Atrioventricular Nodal Firing (the rate-control effect, and the bradycardia/heart-block cost) and Reduced Myocardial Contractility (the negative inotropy that up-titration works around); the PKA node now has an edge to each and both converge on the workload consequence.
    The notes gained a migraine scope note, which #15088's blocking review found missing: beta-blockers are established migraine prophylaxis but no step of this module has been shown to be the one that prevents attacks, so a migraine conformer would assert a mechanism rather than record one. The Non-Selective Beta Blockade description previously listed migraine prophylaxis among wanted uses and so read as an offer of a conformance target; it now says the opposite explicitly, for migraine and for portal hypertension and thyrotoxicosis alike.
    Revalidated: linkml-validate, linkml-term-validator and just validate-module-batch (15/15 snippets, 15/15 titles, 0 issues).

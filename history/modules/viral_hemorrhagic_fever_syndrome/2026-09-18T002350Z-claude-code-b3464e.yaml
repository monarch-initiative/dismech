  summary: 'Create: Viral Hemorrhagic Fever Syndrome module (from the retired VHF
    umbrella entry)'
  details: |
    Created kb/modules/viral_hemorrhagic_fever_syndrome.yaml by lifting the shared mechanism out of the retired kb/disorders/Viral_Hemorrhagic_Fever.yaml umbrella entry, under the infectious disease granularity ladder (design decisions section 3e, rules R4 and R24): an organ syndrome spanning unrelated organisms whose mechanism is organism-independent is a module plus conforms_to, and the membership is the sibling Viral_Hemorrhagic_Fevers grouping.

    The six pathophysiology nodes of the old entry moved across with their evidence intact and were renamed to title case; one trigger node, High Viremia and Vascular Target Infection, was added at the head so the module has the trigger-to-consequence chain a module needs and so conforming entries have a node to substitute their own agent, receptor and entry route into. The five clinical readouts the nodes pointed at (capillary leak, shock, hemorrhage, coagulopathy, thrombocytopenia) moved to the module's phenotypes block, following the myelosuppression and drug_induced_liver_injury precedent, so every bare-name downstream target still resolves. Both discussions moved with their anchors repointed to the new node names.

    Two judgements from the earlier codex review of the umbrella entry (PR dismech#8243) were deliberately preserved rather than reversed: no hemostatic umbrella parent node was reintroduced, so the four bleeding routes descend in parallel directly from the trigger, and no bundled shock-and-organ-dysfunction consequence node was created. Both are recorded in the module notes so a future reviewer does not re-derive them.

    No treatments block: no therapy acts on the shared mechanism, which is why supportive care is the cornerstone across the group. That asymmetry is recorded as a cross-group finding on the grouping instead.

    Validation: just validate-module passed (schema, terms, references) with 39/39 snippets verified against cached references. No new references were fetched; every PMID was already cached and carried by the old entry.

    Boundary against the cytokine modules, stated explicitly in the description on rebase: this module carries no cytokine node at all. The host cytokine response in severe hemorrhagic fever is modelled by cytokine_storm_hyperinflammation (the generation of the storm) and il6_hypercytokinemia (the ligand arm from the cytokine through gp130 to JAK-STAT3), so there is nothing here to duplicate or to conform to them. A conforming entry whose own chain has a cytokine step declares that node against one of those two and its permeability node against this module separately; Hantavirus_Hemorrhagic_Fever_with_Renal_Syndrome, which has both an IL-6 trans-signaling node and a permeability node, is the worked case.

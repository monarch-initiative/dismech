  details: |
    Addressed the ai4c-reviewer CHANGES_REQUESTED review on PR dismech#13485.

    Blocking: the trigger node's 'mononuclear phagocyte' cell type was bound to CL:0000235 macrophage. The node text, the module description and the notes all mean the compartment including dendritic cells, and the Ebola entry binds CL:0000451 dendritic cell on its corresponding node, so the preferred_term was broader than its binding. The Ontology Term Contract permits a preferred_term narrower than the bound term, never broader. Rebound to CL:0000113 mononuclear phagocyte, verified in cache/cl/terms.csv and against ols:cl before writing.

    Suggestion taken: dropped the GO:0007596 blood coagulation / DECREASED binding from 'Decreased Coagulation Factor Production' and bound CL:0000182 hepatocyte instead. The node is about impaired synthesis of factors, not the cascade running below normal, and the sibling 'Consumptive Coagulopathy' node already binds that GO term with ABNORMAL. A search of GO for coagulation-factor production or biosynthesis returns only factor-containing protein complexes and serine-endopeptidase activities, none of which names the synthetic step, so there is no term to substitute; the node notes record the search and the reasoning so a future curator does not re-add the wrong term.

    Suggestion taken: every one of the 28 written evidence items now carries quote_role: REVIEW_SYNTHESIS, which is true of all five cited sources - each is a narrative review and each quote is the review's own synthesis rather than a primary result. Six of those items, spanning five distinct sentences, were re-graded from evidence_source: OTHER to HUMAN_CLINICAL because the quoted text states a human clinical fact: the two dengue thrombocytopenia/plasma-leakage sentences, the VHF clinical-picture definition, the non-specific febrile presentation, and the laboratory-findings sentence. The remaining six distinct sentences stay OTHER because they are cross-study mechanism syntheses spanning human, non-human-primate and in-vitro work, or are statements about model fidelity, and no single evidence_source category is true of them. Grading was assigned per distinct sentence rather than per item, so no sentence carries two values - verified programmatically before and after, and check-snippet-grading reports no new divergence.

    Declined: the reviewer's note that the trigger node bundles immune failure and presentation to the vascular compartment. It is one shared upstream state rather than two events, the description argues that explicitly, and splitting it would create a node with no evidence of its own; the reviewer did not block on it.

    Validation: just validate-module (schema, terms, references) passes with 39/39 snippets and 39/39 titles, 0 issues; just validate-terms passes; check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values and check-snippet-grading all clean; just check-granularity still reports no Viral_Hemorrhagic_Fever finding.

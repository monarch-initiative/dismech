  details: |
    Created the defective_skeletal_mineralization mechanism module: three heterogeneous trigger arms (calciopenic, phosphopenic, mineralization-inhibitor excess) converging on one central_effector node - impaired hydroxyapatite deposition at the mineralization front - then a growth-plate effector node and a shared rickets/osteomalacia consequence. Includes the asfotase alfa enzyme-replacement drug-target pattern on the inhibitor arm, a HUMAN_MODEL_MISMATCH discussion on the mouse-only caspase-9 growth-plate mechanism, and a KNOWLEDGE_GAP on the local calcium-phosphate product threshold. Rationale: rickets is a phenotype dual-coded HP:0002748/MONDO:0005520, not a disease, and Hypophosphatasia, X-Linked_Hypophosphatemia and CKD-Mineral_Bone_Disorder each re-derived part of this chain independently. Validation: linkml-validate clean; just validate-terms passed; just count-verified-snippets reported 12/12 verified against cached references. Every PMID was fetched with just fetch-reference and its cached title checked against the intended paper before use - five of the first eight PMIDs recalled from memory were the wrong papers and were discarded.

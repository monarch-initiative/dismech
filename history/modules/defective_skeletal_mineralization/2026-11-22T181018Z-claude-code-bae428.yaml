  summary: Add dietary calcium deficiency and acquired FGF23 evidence to the mineralization
    module (#8995 items 4-5)
  details: |
    Calciopenic Substrate Deficiency: description extended to name dietary calcium deficiency as the usual cause of nutritional rickets in Nigerian children and the interaction between calcium intake and 25(OH)D; four evidence items added from the Thacher/Pettifor Nigerian series (PMID:22373953, PMID:24748637, PMID:33742199) and the calciopenic/phosphopenic review PMID:37427438. Phosphopenic Substrate Deficiency: description extended to the acquired FGF23 routes (tumor-induced osteomalacia, fibrous dysplasia/McCune-Albright, ferric carboxymaltose), and the PTH statement narrowed to the hereditary forms because the ferric carboxymaltose trial reports secondary hyperparathyroidism; five evidence items added (PMID:37427438, PMID:36511653 x2, PMID:30518682, PMID:39935027). New Calcium Supplementation treatment targeting the calciopenic node, with two INDIRECT items from the Nigerian RCTs (PMID:27311415, PMID:24748637). The 2014 trial's baseline mean 25(OH)D was 30 nmol/L, so the entry does not claim calcium-deficiency rickets occurs at normal vitamin D. All snippets verified against cached abstracts with count-verified-snippets; just validate passed.

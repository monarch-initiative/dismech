  summary: 'Create module: Spinal Hsp90 Inhibition Opioid Antinociceptive Enhancement'
  details: |
    Created a new opioid-adjuvant drug-mechanism module from PAIN 2026 (Bowden et al., PMID:41031962, DOI:10.1097/j.pain.0000000000003813) plus the supporting Streicher-lab series (PMID:32371496, PMID:37040443, PMID:38926482, PMID:42263270; PMID:32701840 for the brain-vs-spinal scope caveat). 5-node chain: Spinal Hsp90 Inhibition (trigger, drug-target) -> Microglial Src Kinase Activation (amplifier, flagship) -> ERK-RSK Cascade Activation (central effector, AMPK-feedback relief) -> Enhanced Spinal MOR Antinociceptive Signaling (effector) -> Increased Opioid Antinociception and Improved Therapeutic Index (consequence). Spinal-selective Hsp90-inhibitor treatment uses target_mechanisms INHIBITS on the trigger node. All 13 evidence snippets manually verified as exact substrings of cached abstracts; schema + term validation pass. All evidence MODEL_ORGANISM (mouse). Scope caveat captured in notes + a KNOWLEDGE_GAP discussion: effect is spinal-compartment-specific; brain/systemic non-selective Hsp90 inhibition blocks opioid antinociception.

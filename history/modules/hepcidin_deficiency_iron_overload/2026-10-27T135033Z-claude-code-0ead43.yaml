  details: |
    New mechanism module for the shared systemic iron-overload pathway of hereditary hemochromatosis and the iron-loading anemias. Seven nodes: three alternative triggers (BMP-SMAD sensing loss, erythroferrone suppression, hepcidin-resistant ferroportin) funneling through the key conformance target Unrestrained Ferroportin Iron Export to NTBI formation and parenchymal iron injury. Deep research via claude_code. Every snippet verified as an exact substring of its cached abstract (17 checked, 0 issues). Wired conformers: Hemochromatosis (branches A and C, export effector, NTBI node), Beta_Thalassemia and Congenital_Dyserythropoietic_Anemia (branch B, erythroferrone).

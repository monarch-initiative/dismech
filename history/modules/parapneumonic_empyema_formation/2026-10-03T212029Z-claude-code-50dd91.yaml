  summary: 'Create: Pleuropneumonia and Parapneumonic Empyema Formation module'
  details: |
    Created an 8-node mechanism module for pleuropneumonia / parapneumonic effusion / empyema (MONDO:0001940 is an organism-agnostic organ syndrome, so curated as a module per design decision 3e/R4, not a Disease entry). Chain: pneumonic inflammation adjacent to pleura -> mesothelial activation and barrier injury -> exudative effusion -> intrapleural procoagulant shift with suppressed fibrinolysis (central_effector / key conformance target) -> fibrin deposition and loculation -> bacterial invasion and purulent progression -> empyema (Xogenesis output, MPATH:609) -> organizing pleural peel (conforms_to fibrotic_response#Mesenchymal Cell Activation). Treatment drug-target pattern: intrapleural tPA+DNase (alteplase NCIT:C39607, dornase alfa NCIT:C81664) INHIBITS the procoagulant node, anchored on MIST2 (PMID:21830966) with MIST1 (PMID:15745977) as the negative fibrinolytic-alone counterpoint. Deep research: falcon requested, fell back to claude_code (no EDISON_API_KEY); used as a lead only, misquoted Thickett 1999 which was corrected to the real sentence. 11 references, 20 snippets all exact-quote verified. GO/CL/UBERON/MPATH/OGMS terms looked up fresh. Validated: schema, terms, reference snippets, entity-refs, causal-targets, duplicate-keys, enum-values. No conformers wired yet.

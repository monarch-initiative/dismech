  summary: 'Create: neuromuscular_transmission_failure mechanism module (#9005)'
  details: |
    Created the Tier-1 neuromuscular-junction mechanism module requested as the first trunk in epic #9005, which recorded that none of the 162 modules in kb/modules/ modelled endplate transmission.

    The module is organised around the safety factor of neuromuscular transmission, the disorder-agnostic scalar every endplate disease funnels through. Chain: "Endplate Component Lesion" (trigger) -> a parallel pair of arms, "Reduced Quantal Acetylcholine Release" (presynaptic) and "Reduced Postsynaptic Endplate Response to Acetylcholine" (postsynaptic) -> "Loss of the Safety Factor of Neuromuscular Transmission" (central_effector, the key conformance target) -> "Intermittent Endplate Transmission Block" (effector) -> "Fatigable Muscle Weakness" (consequence). The two arms are deliberately parallel rather than sequential because which arm a disorder engages is the discriminating fact between the conformers: Lambert-Eaton and botulism are presynaptic, AChR myasthenia gravis and most congenital myasthenic syndromes postsynaptic, and endplate acetylcholinesterase deficiency and the glycosylation CMS engage both.

    Boundary with synaptic_vesicle_cycle is stated in the module notes: that module owns the release machinery itself across all synapse types (and so the UNC13A/SNAP25/SYT2/VAMP1 presynaptic CMS); this one owns the endplate-specific consequence for the safety factor. A presynaptic conformer may legitimately declare both.

    Two treatment target_mechanisms patterns are carried on the module: acetylcholinesterase inhibition (pyridostigmine, CHEBI:8665) RESTORES the safety-factor node, and presynaptic potassium-channel blockade (amifampridine, CHEBI:135948) RESTORES the quantal-release node. The AChEI block records the contraindicated subset (slow-channel syndrome, endplate AChE deficiency, DOK7, LAMB2) rather than presenting the pattern as universal; its PMID:36835142 evidence item is graded PARTIAL for that reason.

    One KNOWLEDGE_GAP discussion records that the safety factor is not uniform across muscles - Ruff (PMID:22102453) excepts extraocular, middle ear and some facial/pharyngeal muscles from the "slave synapse" description that holds for extremity and axial fibres - which is the module-level instance of the domain-wide selective-vulnerability gap listed in #9005. Graded KNOWLEDGE_GAP rather than HUMAN_MODEL_MISMATCH because the evidence is absent, not model-derived.

    Evidence: 25 snippets, all machine-verified as exact substrings of cached references before commit. Four references were fetched with just fetch-reference (PMID:11275359 Wood and Slater safety-factor review; PMID:22102453 Ruff endplate contributions; PMID:18632162 Ruff and Lennon on how MG alters the safety factor; PMID:25792100 Engel CMS review). Remaining evidence reuses PMIDs already curated and cached in the conforming disorder entries. Three PMIDs recalled from memory during drafting resolved to unrelated papers and were discarded before any snippet was written; the mis-fetched cache files were removed rather than committed.

    Validation: linkml-validate, just validate-terms and just count-verified-snippets (25/25) all pass on the module; just check-entity-refs and just check-duplicate-keys pass across the module plus the six conformers; the four baseline gates (folded hyphens, snippet length, title snippets, snippet grading) report no new entries.

  summary: Add turquoise killifish (Nothobranchius furzeri) animal model with modeled_mechanisms
  details: |
    Added a turquoise killifish animal_models entry covering the deepest killifish evidence base in the tranche. Three links: RECAPITULATES 'Proteostasis Network Decline' (proteasome activity falls early and is sufficient in vivo to induce aging proteomic signatures; ribosome stalling; protein-mRNA correlation decay), RECAPITULATES 'Misfolded-Protein Aggregation' (tissue-specific aggregome across seven tissues, co-aggregation of quality-control machinery, ribosome stoichiometry loss), and PARTIALLY_RECAPITULATES 'Proteotoxic Cell Dysfunction and Neurodegeneration' (depletion of basic-amino-acid-rich DNA/RNA binding proteins, recorded with the authors' own hedging since the vulnerability is proposed rather than demonstrated). Evidence: PMID:32558274, PMID:40743332, PMID:38810654; all snippets exact-quoted and verified.

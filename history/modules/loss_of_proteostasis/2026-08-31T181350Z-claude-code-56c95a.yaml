  summary: Add naked mole-rat comparative negative model
  details: |
    Added the naked mole-rat as a comparative negative model with two links: FAILS_TO_RECAPITULATE on Proteostasis Network Decline, which is the one hallmark here with longitudinal rather than only cross-species evidence (no significant change in cysteine oxidation, ubiquitination, unfolding susceptibility or proteasome activity between 2 and over 24 years, PMID:19223593; maintained proteostasis and proteasome-mediated degradation during aging across a survey of eight rodent species, PMID:26894765; PMID:21993625), and FAILS_TO_RECAPITULATE on Loss of Proteostasis via increased translational fidelity and fewer aberrant proteins (PMID:24082110). Limitations record the liver-focused sampling, the subterranean-lifestyle confound the survey authors themselves raise, and that the 28S rRNA cleavage explanation is explicitly untested in the source. Validated with linkml-validate, term validation, reference validation (17/17 snippets) and the offline KB gates.

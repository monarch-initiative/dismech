  summary: Add plasma p-tau217; gap on absent proteostatic-capacity markers
  details: |
    Added plasma phosphorylated tau 217 [NCIT:C202389] with one readout, plus a KNOWLEDGE_GAP. Newly cached: PMID:32722745 Palmqvist JAMA 2020. The marker is scoped tightly and deliberately: it reports one aggregating protein in one disease, attaches only to the Misfolded-Protein Aggregation node, and its interpretation states that a normal value says nothing about alpha-synuclein, TDP-43 or transthyretin aggregation. The authors own scoping caveat about unselected and diverse populations is curated as readout evidence rather than left in prose. The knowledge gap records the structural point: the two upstream nodes, which are what the hallmark actually names, have no human biomarker at all, since chaperone capacity, ubiquitin-proteasome throughput and the heat-shock response are measurable in cells and model organisms but not from an accessible human sample. Consequence recorded for curators is that proteostasis can currently only be assessed after aggregation has occurred, and that importing more disease-specific aggregation markers would make the module look better covered than it is.

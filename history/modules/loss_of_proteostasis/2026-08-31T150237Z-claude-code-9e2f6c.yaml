  details: |
    Added three computational models covering both arms of the proteostasis network: the Proctor2005 chaperone/heat-shock model (BIOMD0000000091), the Proctor2007 ubiquitin-proteasome model with age-related decline (BIOMD0000000105), and the UCH-L1 inclusion-formation model. The Proctor2007 link records the published model-versus-experiment discrepancy on monomeric ubiquitin pool depletion in its limitations rather than omitting it.

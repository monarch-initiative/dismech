  summary: Clarify glucan-synthase conformance boundary and conditional outcome
  details: |
    Renamed the canonical target anchor to the species-portable Fks glucan
    synthase label and clarified that FKS1 is principal while FKS2 is additionally
    important in species such as Candida glabrata. Removed misleading positive
    edges from normal glucan synthesis to acquired and intrinsic resistance;
    neither resistance state is caused by normal synthesis. Also
    defined a high-precision operational node-level conformance boundary: explicit
    FKS-catalyzed beta-1,3-glucan synthesis (GO:0006075 plus GO:0003843) and an
    evidence-bearing disease echinocandin INHIBITS edge are required, whereas
    beta-glucan presence, a diagnostic biomarker, or host Dectin-1 recognition
    alone are insufficient. Removed the positive downstream edge from normal
    cell-wall assembly to the intervention-conditional lysis node and documented
    why no conditional replacement edge is available. Narrowed the intrinsic
    resistance node to its directly supported Cryptococcus claim; Mucorales and
    other organism-level exclusions remain in the dedicated intrinsic-resistance
    gating module. Also removed unsupported selectivity superlatives and fixed
    wording. Reused the existing cached evidence without fetching or editing any
    reference cache. Added the authoritative CLAUDE.md module-registry entry
    with the same boundary, worked conformer, and canonical target. Targeted
    module validation passed schema, terms,
    cached-reference validation, and 9/9 exact-snippet checks.

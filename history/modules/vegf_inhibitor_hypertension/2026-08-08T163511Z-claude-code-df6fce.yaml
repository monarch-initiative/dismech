  summary: 'Create: VEGF Inhibitor-Induced Hypertension module'
  details: |
    Created kb/modules/vegf_inhibitor_hypertension.yaml, a conserved treatment-toxicity module for the on-target antiangiogenic route to systemic hypertension, in response to issue #5923 ([kgap-scan:scope] Oncohypertension).

    Six-node chain: VEGF Signaling Pathway Inhibition (trigger) -> three parallel amplifier/effector arms (Endothelial Nitric Oxide Deficiency and Oxidative Stress; Endothelin-1 System Activation; Microvascular Rarefaction) -> Vasoconstriction and Increased Peripheral Vascular Resistance (central_effector, key conformance target) -> Treatment-Emergent Hypertension (consequence).

    Carries the antihypertensive drug-target pattern: ACE inhibitor/ARB and calcium channel blocker treatments use target_mechanisms with INHIBITS on the convergence node, deliberately NOT on the trigger, since restoring VEGF signalling would antagonize the antitumour effect of the culprit drug.

    Three discussions record the epistemic limits: a KNOWLEDGE_GAP that the integrated mechanism is unsettled (the AHA scientific statement calls the molecular mechanisms unclear; the vascular-toxicity literature calls them elusive), an OPEN_QUESTION on treatment-emergent hypertension as a candidate pharmacodynamic biomarker of antitumour efficacy (curated as open, not as an established prognostic claim), and an OPEN_QUESTION on the absence of oncology-specific management guidelines.

    Evidence: 7 references (PMID:36621810 AHA scientific statement, PMID:35179707, PMID:29931399, PMID:32990313, PMID:30706818, PMID:26386874, and PMID:42405920 the issue seed review), each fetched with 'just fetch-reference'; no cache file was hand-written.

    Validation run this session: linkml-validate against the Disease target class reported 'No issues found'; linkml-term-validator validate-data --labels reported 'Validation passed'; 'just count-verified-snippets' reported 21/21 snippets verified against cached references. The full (slow) linkml-reference-validator was then run directly on this module via scripts/run_reference_validator.sh with target class Disease and completed: 'All validations passed', 21/21 snippets verified. Note that 'just validate-disorders' cannot be used as the pre-PR sweep for a module — it prints 'Skipping non-disorder file' for kb/modules/ paths — which is why the validator was invoked directly here.

    Scope deliberately limited to the on-target antiangiogenic arm. Proteasome-inhibitor, corticosteroid, calcineurin-inhibitor and androgen-deprivation-therapy routes to raised blood pressure are noted in the module description as mechanistically distinct arms and are not modelled here.

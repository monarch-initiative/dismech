  summary: Bind the defining measurement and its guideline thresholds as LOINC measurements
  details: |
    Added a Bone Densitometry (DXA) diagnosis row (NCIT:C48789) binding LOINC:38263-0 DXA Femur T-score and LOINC:38267-1 DXA Lumbar spine T-score, the same codes as the Osteoporosis entry, with evidence from PMID:12057569 and PMID:16731427. No WHO T-score bands on the module: they define the disease osteoporosis and sit on the Osteoporosis entry, and they do not hold across the module's conformers (focal bone lesions, periodontitis, otosclerosis, childhood-onset monogenic disorders measured on Z-scores).

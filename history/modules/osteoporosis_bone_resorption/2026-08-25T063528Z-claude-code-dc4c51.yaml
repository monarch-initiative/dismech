  summary: 'Address review: retag CellPhoneDB evidence as COMPUTATIONAL'
  details: |
    Review-response session for PR 8365. Retagged both evidence items on the DIRECT edge from Endosteal Vascular Niche Dysfunction to Impaired Osteoblastic Bone Formation from MODEL_ORGANISM to COMPUTATIONAL: the cell-cell interactions come from CellPhoneDB v5.0.1 run on scRNA-seq, which CLAUDE.md classifies as in-silico network inference even when clinical or animal datasets are the input. Added a third COMPUTATIONAL item quoting the Methods sentence that names CellPhoneDB, so the evidence tier is self-documenting. Softened two over-statements that the source itself hedges: the node description now says the paper predicted that ECs and VSMCs can signal directly to osteoblast lineage cells, and the edge description states the interaction is in-silico and unconfirmed by a wet-lab ligand-receptor experiment. Changed the GO:0001525 angiogenesis modifier from DECREASED to DYSREGULATED to match the sibling GO:0048514 annotation, since no node-level directional evidence was cited. Added a naming snippet for the CL:0000669 pericyte cell type. Recorded in both the Nherf2 and Cbx6 knockout limitations that only female mice were phenotyped against a female wild-type reference range. Left CL:0000115 endothelial cell unchanged, the reviewer marked that suggestion optional and prevailing KB convention favours it. Validated with just validate, just validate-terms and just count-verified-snippets at 30 of 30.

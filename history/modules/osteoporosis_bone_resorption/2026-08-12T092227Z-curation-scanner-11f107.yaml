  summary: Add endosteal vascular niche (EC/VSMC) arm as an EMERGING upstream hypothesis
  details: |
    Curated the headline finding of Chai et al. 2026 (Nat Genet, PMID:42432248) into kb/modules/osteoporosis_bone_resorption.yaml, in response to issue #6400 ([lit-scan:new] Skeletal Disorders: endosteal cell types and disease-relevant genetic pathways). The issue explicitly asked for cross-cutting framework work rather than single-disease augmentation, so the paper was curated into the existing bone module rather than spread across skeletal disorder entries.

    Added one pathophysiology node, "Endosteal Vascular Niche Dysfunction" (biological_scale TISSUE; CL:0000115 endothelial cell, CL:0000359 vascular associated smooth muscle cell, CL:0000669 pericyte; UBERON:0009859 endosteum and UBERON:0001981 blood vessel; GO:0001525 angiogenesis DECREASED and GO:0048514 blood vessel morphogenesis DYSREGULATED), with two downstream edges: an INDIRECT_UNKNOWN_INTERMEDIATES edge to "Bone Remodeling Imbalance" and a DIRECT edge to "Impaired Osteoblastic Bone Formation" carrying the EC/VSMC-to-osteoblast interaction evidence.

    The arm is deliberately fenced off from the settled RANKL/Wnt chain. Both new edges opt into a new mechanistic_hypotheses group "endosteal_vascular_niche_model" with status EMERGING, and the module notes now state that a disorder node should conform to the vascular node only when it has a specific endothelial or vascular-smooth-muscle lesion in bone, not merely because it features low bone mass.

    Two discussions record the limits of the evidence rather than smoothing them over. A KNOWLEDGE_GAP ("endosteal_vascular_arm_causal_status") records that EC/VSMC programs reached only nominal enrichment for rare skeletal disorder genes, which the authors themselves attribute to genes shared with osteoblasts, and that in the MGI abnormal-bone-structure enrichment VSMCs were highly enriched but ECs were not - so the two vascular cell types are not equally supported. A HUMAN_MODEL_MISMATCH ("endosteal_map_species_mismatch") records that the cell map and every causal experiment are murine or zebrafish, and that the human validation tissue was adult femoral head bone rather than anatomically matched endosteum, so what was shown is population and expression correspondence, not mechanistic transfer. Three proposed_experiments are attached across the two discussions.

    Four animal_models were added with modeled_mechanisms links to the new node, all from the same publication: the Pls3 hemizygous null mouse (RECAPITULATES, MODERATE, readout: bone blood vessel size DECREASED), the pls3 crispant zebrafish embryo (PERTURBS, LOW, readout: intersegmental vessel patterning ALTERED - a bone-free system, which is what separates a direct vascular role from a secondary consequence of a bone defect), the Nherf2 knockout mouse (PERTURBS, MODERATE, endothelium-restricted gene, readout: femoral BV/TV and Tb.N DECREASED), and the Cbx6 knockout mouse (PERTURBS, MODERATE, VSMC-restricted gene, readout: femoral BMC and cortical thickness DECREASED). Each link's limitations field records the specific caveat: constitutive rather than lineage-restricted deletion, extraskeletal expression, unchanged bone strength for Nherf2, and n=2 knockout animals for Cbx6.

    The single reference was fetched with "just fetch-reference PMID:42432248" and never hand-written. Because that fetch returned full text, some snippets are drawn from the Results and Discussion rather than the abstract; module files are not run through the --no-full-text CI path, and the full "just validate-references" run, which permits full text, passes.

    Validation actually run and read: "just validate" (schema + terms + snippets) passed; "just validate-terms" passed; "just count-verified-snippets" reported 28/28 verified; "just validate-references" (full, full-text-permitting) reported all validations passed with 28/28 snippets verified; scripts/check_folded_hyphens.py and scripts/check_snippet_length.py --against-ref origin/main both clean; 8545 targeted pytest tests (module, conformance, model-readout, discussion and hypothesis selectors) passed.

    Deferred, not done in this run: no disorder entry was made to conform to the new node. PLS3-related X-linked osteoporosis is absent from kb/disorders/ and is the natural first conformer, but creating that entry needs its own MONDO anchor, NEC preflight and primary-literature evidence pass, and is left as a follow-up rather than rushed alongside the module change.

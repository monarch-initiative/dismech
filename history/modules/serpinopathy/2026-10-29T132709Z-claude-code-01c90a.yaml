  summary: 'Create: Serpinopathy module'
  details: |
    New mechanism module for the serpinopathies (conformational serpin polymerization), filling the gap the FENIB entry flagged (no serpinopathy/ER-stress module existed). Conserved chain: Serpin Conformational Instability (trigger) -> Serpin Polymerization (central_effector, key conformance target) -> Intracellular Polymer Retention (effector) -> parallel consequences: the gain-of-function arm Polymer Proteotoxicity, and the loss-of-function arm Circulating Serpin Deficiency -> Unopposed Protease Activity. (Review round 1: split the loss-of-function node into those two atomic steps; re-graded the two PMID:28752441 items to OTHER + REVIEW_SYNTHESIS to match AATD; dropped the unsupported ERAD-up binding and saturation clause on the retention node; added an ER-overload-vs-UPR caveat on the proteotoxicity node.) Evidence drawn from two exemplars: Z-alpha-1-antitrypsin (liver/lung; PMID:28752441, PMID:39440224) and neuroserpin (brain/FENIB; PMID:10517635), plus the conserved serpin biochemistry (PMID:20667823) and the ER-retention disease-class review (DOI:10.1186/s12929-024-01054-1). Complementary to er_protein_storage_disease (hepatocyte downstream) and distinct from amyloidogenesis (cross-beta). Investigational polymerization-inhibitor drug-target pattern points at the key node. GO/CL terms verified against caches; every snippet exact-quote verified. Module categories omitted (no single discipline fits). Wired Alpha_1_Antitrypsin_Deficiency Hepatic Protein Aggregation node as the prototype conformer.

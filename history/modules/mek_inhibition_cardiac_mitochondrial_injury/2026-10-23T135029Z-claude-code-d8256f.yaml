  summary: 'Create: MEK inhibition cardiac mitochondrial injury module'
  details: |
    Created a drug-toxicity mechanism module for cardiomyocyte injury under pharmacological MEK1/2 inhibition, from the Sci Adv 2026 mouse/cardiomyocyte study (PMID:42430470) plus the Wegrzyn Science 2009 mitochondrial STAT3 paper (PMID:19131594) that establishes the complex I/II dependence the canonical hypothesis rests on. Seven-node chain: MEK1/2 inhibition and ERK1/2 abrogation -> loss of mitochondrial STAT3-S727 phosphorylation -> cardiac mitochondrial respiratory chain failure (central_effector, key conformance target) -> mitochondrial DAMP release -> cGAS-STING innate immune activation -> reversible cardiac hypocontractility, with a hypothesised sterile neutrophilic inflammation arm. Three mechanistic_hypotheses: the CANONICAL MEK-ERK-STAT3 bioenergetic model, recorded with the authors' own statement that it is not exclusive, and an EMERGING neutrophil amplification model grounded in Morrissey/Kirkland/Jensen J Leukoc Biol 2025 (PMID:39936506),
    and an EMERGING cardiomyocyte identity/maturation destabilization model from
    Yao/Yelon Development 2024 (PMID:38293792) and Chattergoon 2026
    (PMID:42053511). The third arm is orthogonal to the bioenergetic one rather
    than a restatement: MEK1/2-ERK1/2 actively reinforces the ventricular gene
    programme in already-differentiated cardiomyocytes, and pharmacological MEK
    inhibition produces ectopic atrial and reduced ventricular gene expression
    in zebrafish, while B-Raf deletion across the murine
    proliferation-to-maturation window ends in dilated cardiomyopathy with the
    earliest echocardiographic signs only at three months. It predicts a
    component that need not reverse on withdrawal and makes paediatric exposure
    a distinct question, so it carries its own
    mekcard_paediatric_developmental_window KNOWLEDGE_GAP. Like the neutrophil
    arm it is carried only via downstream[].hypothesis_groups and is explicitly
    not asserted, since neither result comes from a mammalian heart exposed to a
    clinical MEK inhibitor; the module notes tell conforming entries to leave
    both hypothesis-group nodes alone without disease-specific evidence. The neutrophil arm is deliberately NOT asserted: no leukocyte population was typed, sorted or counted in the originating study, whose immune readouts are all whole-heart-lysate, whole-LV or serum, so the arm is carried only via downstream[].hypothesis_groups and a KNOWLEDGE_GAP on the unidentified cellular source. Mouse model and the NRVM/h-iPSC-CM systems carry ModelMechanismLink entries with model_scale, readouts and typed divergences (SPECIES_MISMATCH, POPULATION_MISMATCH, PROXY_QUANTITY, BOUNDARY_OMISSION). Three discussions: a HUMAN_MODEL_MISMATCH for the risk-prediction failure (the model reproduces the phenotype well yet no baseline patient parameter predicts it), the immune cell-source gap, and whether the cardiac lesion is separable from the antitumour effect, given the same respiratory lesion appears in some cancer lines but not others. No GO biological-process term bound on the DAMP-release node; the ols:go searches run and why the permeabilization terms were rejected are recorded in that node's notes. All 58 snippets and 58 titles verified against references_cache; linkml-validate, term validation and validate-module-batch pass.

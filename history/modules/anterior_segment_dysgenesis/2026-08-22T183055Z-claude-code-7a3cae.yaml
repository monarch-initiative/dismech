  summary: 'Create: anterior_segment_dysgenesis module'
  details: |
    Created a developmental mechanism module for the anterior segment dysgenesis spectrum, in which one neural-crest-derived periocular mesenchyme population builds cornea, iris stroma, iridocorneal angle, trabecular meshwork and Schlemm's canal, so a dose-sensitive lesion in its transcriptional programme produces a recurring multi-tissue bundle rather than an isolated defect. Five-node chain; key conformance target is the central_effector node 'Failed Differentiation and Separation of Anterior Segment Tissues'. The terminal consequence is deliberately the maldeveloped aqueous outflow pathway and developmental glaucoma rather than the visible malformation, which is the module's clinical point and its seam to glaucoma_optic_neuropathy. Notes distinguish it from ocular_morphogenesis_failure, which models the earlier optic vesicle, cup and fissure events. Includes a KNOWLEDGE_GAP on whether glaucoma risk is predictable from the visible malformation. Validated: linkml-validate clean, linkml-term-validator passed, 10 of 10 snippets verified against cached references.

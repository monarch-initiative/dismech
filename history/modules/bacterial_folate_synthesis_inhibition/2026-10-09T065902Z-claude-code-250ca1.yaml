  summary: Add the thymineless-death consequence node to the antifolate module
  details: |
    Third module with the target-then-resistance chain and no consequence node. The gap mattered more here than elsewhere because the module description listed three one-carbon deficits - nucleotide, amino-acid and protein synthesis - as if interchangeable, when only one of them is what kills.

    Added Thymidylate Starvation and Thymineless Death, bound to GO:0006231 dTMP biosynthetic process DECREASED and GO:0006260 DNA replication DECREASED. The licence for scoping the node to thymidylate is the pharmacological-genetic equivalence in PMID:34633866: thymineless death is produced either by denying a thyA mutant thymidine or by treating a wild-type cell with trimethoprim. That sentence is the paper's framing of established fact rather than its own finding, so it is recorded as quote_role BACKGROUND with evidence_source IN_VITRO - the case CLAUDE.md documents, where grading the publication alone would say something false.

    The node then records an open mechanism rather than inventing one. Two REVIEW_SYNTHESIS items from PMID:26253395 carry the three documented candidates - stalled forks, uracil misincorporation, origin-proximal degradation. A fourth item is a REFUTE against the most recently proposed account: PMID:34633866's own primary result is that oxidative damage does not contribute and that thymineless death remains enigmatic. That is worth recording as REFUTE rather than omitting, because the sibling fluoroquinolone module does invoke reactive oxygen downstream of DNA breakage, so a reader moving between the two modules would otherwise assume the same mechanism applies.

    Validated with just validate-module-batch (7 snippets, 0 issues) plus the offline per-file gates.

  summary: 'Review round 2: correct what each conformer reaches for pharmacology'
  details: |
    The description said a conforming entry reaches serotonin_1b_1d_receptor_agonism and cgrp_receptor_antagonism through its own therapeutic_vulnerability nodes. That is true only of Migraine. Migraine_with_Aura conforms to the 5-HT1B/1D module alone, and Familial_Hemiplegic_Migraine has no therapeutic_vulnerability node at all: its treatment records that triptans and ergot derivatives are contraindicated because of their vasoconstrictive effects. So the generalisation did not merely overstate the wiring, it pointed a reader at a drug class that must be avoided in one of the three conformers. The description now says what each entry reaches and names the contraindication, and records that the contraindication is a second reason the module carries no treatments block: a drug arm here would attach a therapy to a conformer that must avoid it. Caught on the companion project-page PR #15935, whose queue row carried the same sentence.

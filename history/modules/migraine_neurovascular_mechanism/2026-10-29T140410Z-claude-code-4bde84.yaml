  summary: 'Create: migraine neurovascular mechanism module'
  details: 'Five-node disease module factoring the chain that Migraine, Migraine_with_Aura and Familial_Hemiplegic_Migraine
    each re-derived: cortical hyperexcitability lowering the spreading-depolarization threshold, cortical
    spreading depolarization, trigeminovascular nociceptor activation (the key conformance target), meningeal
    neuropeptide release and neurogenic vasodilation, and central trigeminal sensitization. No treatments
    block: the migraine drug mechanisms are already modules of their own (serotonin_1b_1d_receptor_agonism,
    cgrp_receptor_antagonism) which the conformers reach through their own therapeutic_vulnerability nodes.
    The spreading-depolarization-to-trigeminal-activation edge carries a REFUTE item from PMID:40498799
    beside its SUPPORT item from the same essay, because the step is contested in humans. PMID:21731499''s
    introduction says the same thing independently and is named in the notes but not quoted as an evidence
    item: a statement that a question is open takes no direction on it. All 12 snippets verified against
    the reference caches with the real normalizer before writing, and every reference_title read programmatically
    from cache frontmatter.

    '

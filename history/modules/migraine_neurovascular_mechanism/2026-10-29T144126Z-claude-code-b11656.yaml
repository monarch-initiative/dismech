  summary: 'Review round 1: evidence the central sensitization node in its own compartment'
  details: |
    The blocking finding was mine and real. Central Trigeminal Sensitization described sensitization of the second-order trigeminal neurons but carried only one evidence item, from PMID:37487740, about mechanical sensitization of the meningeal afferents. Those are primary afferents, the same compartment as the Trigeminovascular Nociceptor Activation node above it, so the consequence node asserted a central claim on peripheral evidence. The Migraine entry being wired to that node already said as much about the same paper in its own explanation, so this repository contradicted the module. Replaced with two quotes from PMID:30982963, already cached and already used in Migraine with the same evidence_source values: the peripheral-to-TNC-second-order-to-thalamic progression, and the periorbital allodynia sentence that the node's description needed. The displaced meningeal-afferent quote moved to the trigeminovascular node, whose peripheral sensitization half it does describe. The node is now bound to UBERON:0002866 caudal part of spinal trigeminal nucleus, looked up rather than recalled, which is the compartment both quotes name. Three suggestions taken: rate-limiting step dropped from the module and node descriptions as an unsourced kinetic claim, since nothing cited shows this step limits the rate of an attack; the three animal-model SUPPORT items regraded INDIRECT, which the module notes already implied by saying the mouse-to-human step is an inference the module does not assert. One declined with a recorded reason: GO:0048265 response to pain stays on the nociceptor node, because Migraine and Migraine_with_Aura already bind it on the very nodes that conform there, and moving the module off it would put the module and two of its three conformers on different terms.

  summary: 'Create: Xenobiotic Cardiac Ion-Channel Perturbation module'
  details: |
    Created from the AOP-Wiki Key Event sweep in issue #10368, covering KE1529 (L-type calcium channel blockade), KE593 (ERG potassium channel inhibition) and KE2290 (funny current inhibition), widened to include pathological channel activation so that aconitine sodium-channel toxicity conforms alongside the blockade cases. Six-node chain: xenobiotic channel perturbation, altered ionic current, altered cardiac action potential (key conformance target), then two parallel branches for triggered activity and pacemaker rate depression, converging on arrhythmia. Complements cardiac_ion_channel_repolarization, which shares the downstream chain but opens at a germline variant. Every reference was found independently of AOP-Wiki: all seven relevant Key Event Relationships were uncited stubs at completion score 29.41, their parent pathways have never been OECD reviewed, and AOP 552's bibliography gave two citations that do not resolve to the papers it names (recorded in issue #10773). Evidence explanations lead with the experimental system and measurement method where the source has one, and say plainly when a source is a review without primary data. Wired three conforming nodes across Long_QT_Syndrome and Aconitine_Poisoning.

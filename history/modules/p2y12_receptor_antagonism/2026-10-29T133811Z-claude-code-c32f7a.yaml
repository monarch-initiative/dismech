  summary: 'Create: P2Y12 receptor antagonism module'
  details: |
    Created kb/modules/p2y12_receptor_antagonism.yaml, the seventh drug-mechanism module in the GPCR Workstream A queue of projects/GPCR.md, and wired three conformers.

    Five-node chain: P2Y12 antagonist occupancy of the platelet ADP receptor (trigger) -> loss of Gi-mediated adenylate cyclase inhibition (amplifier) -> suppression of ADP-induced platelet activation (central effector, the key conformance target) -> reduced platelet aggregation and arterial thrombosis, with bleeding as a second consequence arm off the central effector.

    The receptor term is specific here where the calcium-sensing module had to use a generic one. GO:0001621 G protein-coupled ADP receptor activity names exactly what P2RY12 does, so the trigger binds it rather than GO:0004930, and hgnc:18124 corroborates rather than carrying the receptor identity alone. That is a difference in ontology coverage between receptors, not a claim about how well either is understood.

    The transducer step is sourced, and the sourcing is uneven in a way the notes state. That P2Y12 signals through Gi in human platelets is quoted from PMID:36306820, but that sentence restates the authors' own earlier work and is graded BACKGROUND. The step from Gi through adenylate cyclase to cyclic AMP is quoted from PMID:39563013, whose subject is three natural products in transfected HEK293 lines rather than a licensed antagonist; it is cited for the pathway it maps, graded INDIRECT, and the notes say so. No cited abstract measures cyclic AMP rising in platelets under a licensed P2Y12 inhibitor, so the node asserts the loss of the inhibition rather than a quantified rise. This is the same discipline applied after the review of #15795, where binding a transducer chain no source named was the blocking defect.

    Scope is the receptor, not antiplatelet therapy: aspirin acts on cyclooxygenase and the glycoprotein IIb/IIIa antagonists on the fibrinogen receptor, neither a GPCR, and P2Y1 is Gq-coupled on the same cell and would be its own module.

    Conformers wired at the trigger, each with an ACTIVATES target_mechanisms link and no downstream edge: CADASIL_Type_1, Carotid_Stenosis, Coronary_Artery_Disease. Six further entries name a P2Y12 antagonist and are excluded for three distinct reasons recorded in the notes. Peripheral_Artery_Disease binds the generic NCIT:C1327 Antiplatelet Agent, which covers aspirin too, so wiring it would assert P2Y12 action for a cyclooxygenase inhibitor; that is the same defect as the generic Bronchodilator binding that blocked COPD from the beta2 module. Carotid_Artery_Occlusion names clopidogrel in prose but binds only acetylsalicylic acid. Grange_syndrome, Kawasaki_Disease and Renal_Artery_Obstruction bind no agent on the relevant treatment, and Secondary_Erythromelalgia names a P2Y12 antagonist outside its treatments. Bundling is not itself an obstacle: two of the three conformers pair the antagonist with aspirin and bind the components separately, so each receptor takes its own link.

    S1P receptor modulation was the next queue row and was deferred rather than built: only Multiple_Sclerosis treats with an S1P modulator. The four other mentions are a fingolimod result in Epm2b-/- mice, siponimod in a mouse retinal-injury model, a research-tool S1P antagonist in a rat knockdown, and fingolimod named in a list of MS immunotherapies in the NMOSD text. None is a human treatment, so that module would have had one conformer.

    Validation: validate-module-batch 11 snippets and 11 titles with 0 issues on first pass; validate-disorders over the three conformers 265 snippets and 323 titles with 0 issues; the offline structural gates and check-logical-rules clean. Every snippet was confirmed a verbatim substring of its cached abstract, and every reference_title was read programmatically from the cache frontmatter rather than typed, after a fabricated title was caught earlier in the same session.

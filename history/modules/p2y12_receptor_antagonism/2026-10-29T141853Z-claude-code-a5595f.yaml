  summary: 'Review round 1: fix a truncated quote and a failing snippet gate'
  details: |
    Three defects, all introduced in the creating commit. First, a three-word snippet 'preventing platelet activation' on the Gi-to-platelet-activation edge failed check-snippet-length, a whole-repo CI gate with no grandfathering for new findings; the gate had not been run before the PR was opened. It is replaced by the full first sentence of PMID:36306820, which carries receptor blockade through to suppressed platelet activation without naming the cyclic-AMP step, so the edge is now graded INDIRECT. Second, the quote 'selatogrel, ticagrelor, and elinogrel were shown to stabilize the inactive form' was cut before 'of the Galphai/o-Gbetagamma complex in cells with recombinant expression of the P2Y12 receptor', and every explanation citing it said instead that the antagonists hold the receptor in its inactive conformation. The quote is extended in all five places and the explanations now say what the result establishes, stabilization of the inactive Gi/o heterotrimer in cells with recombinant P2Y12; only selatogrel is shown by cocrystal to stabilize the inactive receptor itself. Third, PMID:36306820 names selatogrel, ticagrelor and elinogrel and never clopidogrel, so the items in CADASIL_Type_1 and Carotid_Stenosis, whose agent is clopidogrel, are graded INDIRECT. Also taken from the review: the abstract's framing first sentence is regraded BACKGROUND wherever it is quoted, and the human-platelet cyclic-AMP measurement from the same abstract is added to the Gi node, which required correcting the notes sentence that said no cited abstract measured it.

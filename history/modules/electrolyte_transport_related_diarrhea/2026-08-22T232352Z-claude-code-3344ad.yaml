  summary: 'Create: electrolyte_transport_related_diarrhea module'
  details: |
    Created the electrolyte-transport-related diarrhea mechanism module, the deliberate sibling of diet_induced_osmotic_diarrhea created earlier on this branch, and wired both of its conformers.

    The two modules together now cover both non-structural CODE classes as the current nosology (PMID:29654747) separates them. The separation is operational rather than cosmetic: diet-induced diarrhea has a high stool osmotic gap and remits on eliminating the offending nutrient, while the class modelled here has a low stool osmotic gap and persists through complete bowel rest, because the retained solute is an ion the body itself secretes and recycles. Each module's notes forbid a disorder conforming to both for the same node.

    Five-node chain: loss of an apical intestinal electrolyte transport step (trigger; DRA/SLC26A3, or NHE3/SLC9A3 lost directly or by constitutive inhibition from an activating GUCY2C variant upstream) -> luminal electrolyte retention and failure of net ion absorption (central_effector, key conformance target) -> obligated water loss and feeding-independent watery diarrhea, and in parallel ion-specific systemic depletion and acid-base derangement (two effectors) -> electrolyte crisis, growth failure and long-term morbidity (consequence).

    The module's main payoff is predictive rather than descriptive: the acid-base direction follows from which transporter's coupling partner is lost. DRA absorbs chloride in exchange for secreted bicarbonate, so its loss retains bicarbonate and gives alkalosis; NHE3 absorbs sodium in exchange for a secreted proton, so its loss retains protons and gives acidosis. The two conformers are therefore acid-base mirror images of one shared mechanism, which is also the fastest bedside discriminator between them. That node carries evidence from both conformers so the mirror-image claim is supported from both sides rather than asserted.

    Two treatment patterns on different nodes: oral electrolyte substitution INHIBITS the systemic node (life-saving, explicitly no effect on stool volume), and sodium butyrate ACTIVATES the trigger (the only curated intervention that reduces stool output). The butyrate pattern is marked chloride-conformer-specific and genotype-dependent, and explicitly not inherited by the sodium conformer.

    The older "secretory" label for this class is avoided throughout; in both conformers the primary lesion is failure of ion ABSORPTION, and PMID:29654747 makes that point when proposing the electrolyte-transport-related term.

    Conformers wired: Congenital_Chloride_Diarrhea (4 nodes), Congenital_Sodium_Diarrhea (5 nodes). The congenital chloride diarrhea notes, which previously flagged this module as a future factoring, were updated to record that it now exists.


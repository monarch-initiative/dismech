  details: |
    Created the oncometabolite module: TCA tumor-suppressor loss or IDH neomorphic gain, oncometabolite accumulation, competitive inhibition of 2-oxoglutarate-dependent dioxygenases as the key conformance target, then two evidenced effector branches (pseudohypoxic HIF stabilization; impaired TET/Jumonji demethylation) plus an FH-specific covalent KEAP1-succination/NRF2 branch. Carries the decitabine hypomethylating drug-target pattern, three competing hypothesis groups over which branch drives transformation, a CONTROVERSY discussion, and a HUMAN_MODEL_MISMATCH recording that the branch-assignment evidence is murine or cell-based. All 17 evidence snippets verified against cached abstracts; schema and term validation pass. An initially chosen CHEBI id for decitabine failed dynamic-enum validation and was corrected to CHEBI:749378 from OLS rather than being forced.

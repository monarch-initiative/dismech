  summary: 'Create: Sarcolemmal Fragility and Myofiber Necrosis Module'
  details: |
    Created the DGC muscular dystrophy mechanism module: 13 atomic pathophysiology nodes (one biological_scale each) from DGC mechanical-link loss and a parallel membrane-repair-failure arm, converging on Myofiber Cytosolic Calcium Overload (central_effector / key conformance target, justified by Millay 2009 PMID:19864620 calcium-sufficiency and calcium-clearance rescue), then calpain + mitochondrial permeability transition, myofiber necrosis, serum CK leakage, macrophage inflammation, satellite-cell exhaustion, and FAP-driven fibro-adipose replacement to progressive weakness. Fibro-adipose node conforms_to fibrotic_response#Mesenchymal Cell Activation. Three drug-target treatments (corticosteroids->inflammation, cyclophilin-D/mPTP inhibitor->permeability transition, micro-dystrophin->trigger). Deep research was the thin claude_code provider report (170s, 7/30 refs on-topic); used only as leads. Backbone PMIDs independently fetched and quote-verified: 8349731, 8475120, 9334342, 12736685, 19864620, 35939054, 26088163, 12354790, 18345011, DOI:10.1126/sciadv.adi2767, 23620650, 21084059, 21118895, 21145579, 6576361, 20081842, 22045730, 26676145, 27566742, 20637615, 11875496, 32539076. Validated: validate-module-batch passed (29/29 snippets, terms, schema), check-entity-refs, check-causal-targets, check-duplicate-keys, check-block-scalar-comments all clean. Review round 1 (ai4c-reviewer, changes requested): moved the CMD1A/LAMA2 conformer from Contraction-Induced Sarcolemmal Lesions to Sarcolemmal Mechanical Fragility (its evidence shows retained membrane integrity) and rewrote the boundary note to describe that actual conformance rather than a nonexistent calcium-node route; added GO:0035794 (positive regulation of mitochondrial membrane permeability) to the permeability-transition node; added alisporivir (CHEBI:149837) as the therapeutic_agent on the cyclophilin-D/mPTP treatment; softened the corticosteroid mechanism claim to reflect that the cited RCT shows a strength benefit rather than a node-specific action, with the mechanism debated; added a strength/ambulation snippet (PMID:23620650) to Progressive Muscle Weakness. 30/30 snippets, validate-module-batch clean, all 5 conformers still validate.

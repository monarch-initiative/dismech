  summary: 'Create: cul3_substrate_adaptor_dysfunction mechanism module'
  details: |
    Created kb/modules/cul3_substrate_adaptor_dysfunction.yaml, a four-node module for disorders of the cullin-3 RING ubiquitin ligase and its interchangeable BTB-domain substrate adaptors. Chain: CUL3 scaffold or BTB adaptor lesion (trigger) -> mis-set CRL3 ubiquitination of that adaptor's substrate (central_effector, key conformance target) -> substrate dosage error (effector, where the diseases diverge by substrate) -> tissue-restricted consequence. A KNOWLEDGE_GAP discussion holds the unexplained tissue restriction, which the KLHL24 cardiac paper states outright was unknown. This is the defensible slice of the ubiquitination candidate rejected earlier in the session: protein ubiquitination was bound on 39 corpus nodes spanning unrelated ligases, deubiquitinases and proteasome subunits with no shared rate-limiting step, which fails the create-module bar, whereas the CRL3 adaptor family is one scaffold, one adaptor position, one measurable step and nine corpus entries already describing it in those terms. The central node is named mis-set rather than reduced because KLHL24 is a gain-of-function adaptor that over-degrades its substrate while most lesions under-degrade; direction is a conformer substitution. 11 links wired across 9 entries. Two corrections before commit, both caught by tooling: GO:0031625 is a molecular function and failed the BiologicalProcessTerm enum, so it moved to molecular_functions; and check-conformance-content showed four conformers sharing no term with the trigger node, which was my node's fault rather than theirs, so it now also binds GO:1990756 ubiquitin-like ligase-substrate adaptor activity, the term one conformer already used and the most precise description of what a BTB adaptor does. One snippet was corrected after the reference validator found I had mis-transcribed its opening clause. Every PMID was found by PubMed search in this session and every snippet copied from the cached abstract. Validation: validate-module-batch passed with 15/15 snippets verified and terms clean.

  summary: 'Create: retinoid_visual_cycle_disruption module'
  details: |
    Created a mechanism module for defects of the retinoid visual cycle that regenerates 11-cis-retinal between the photoreceptor outer segment and the retinal pigment epithelium. Six-node chain with two parallel effector branches: RPE lipofuscin and bisretinoid loading on the clearance arm, delayed dark adaptation and night blindness on the chromophore-supply arm, converging on progressive photoreceptor and RPE degeneration. Key conformance target is the central_effector node 'Chromophore Insufficiency and Retinoid Intermediate Accumulation'. The module deliberately carries TWO treatment patterns pinned to opposite arms, because the arms take opposite therapeutic directions: RPE65 gene replacement RESTORES flux for a supply lesion, while visual-cycle modulation INHIBITS flux for a clearance lesion. Includes a KNOWLEDGE_GAP on why an equivalent-looking relay block gives stationary night blindness at one step and severe congenital blindness at another. Validated: linkml-validate clean, linkml-term-validator passed, 15 of 15 snippets verified against cached references.

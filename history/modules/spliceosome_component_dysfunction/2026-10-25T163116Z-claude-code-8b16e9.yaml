  summary: 'Create: spliceosome_component_dysfunction'
  details: |
    New mechanism module for germline spliceosomopathies: component variant -> mis-splicing of a sensitive transcript subset (key conformance target) -> optional P53 activation via MDM2 exon skipping -> failure of splicing-sensitive cells (neural crest, rods, RPE) -> tissue-restricted disease. Sources: reviews PMID:42293743 and PMID:41081049; SF3B4 frog (PMID:40126363); EFTUD2 mouse Mdm2/P53 (PMID:33601405) with the Trp53 non-rescue cited as REFUTE (PMID:36012294); EFTUD2/SNRPB/TXNL4A frog (PMID:35893124); PRPF31 organoids (PMID:30315276, PMID:35974011). Scope excludes cis splice variants, somatic myeloid splicing-factor mutations and SMN-type snRNP assembly defects. Conformers wired in the same change. Validated with validate-module-batch, count-verified-snippets 12/12, check-entity-refs and check-causal-targets.

  details: |
    PR Shepherd round answering the 2026-08-25 CHANGES_REQUESTED review.

    IMPORTANT 2 (content regression). The restructure renamed the resistance node 'Azole-Target Resistance' to 'Azole Target-Alteration, Overexpression, and Efflux Resistance' and replaced its three evidence items with a single reuse of PMID:33374996. The three deleted references are real, cached, on-topic and their snippets verify:

    - PMID:38878211 Azole resistance in Aspergillus fumigatus- comprehensive review.
    - PMID:31542320 Azole resistance mechanisms in Aspergillus: update and recent advances.
    - PMID:36458152 Understanding the environmental drivers of clinical azole resistance in Aspergillus species.

    With them went the TR34/L98H content entirely: the agriculturally selected A. fumigatus cyp51A tandem-repeat plus L98H allele conferring cross-resistance to clinical triazoles in azole-naive patients. Nothing in the restructure required dropping it, the node kept the same semantics and the same role adaptive_escape, and it matters to a conformer in this same PR since Otomycosis is an Aspergillus disease already modeling an Aspergillus intrinsic fluconazole resistance node.

    Restoration is purely additive. The three evidence items are restored verbatim from origin/main, each re-verified as an exact substring of its existing cache file (no fetching needed). The TR34/L98H sentence and the mechanism-driven-agent-choice rationale are restored into the node description, which otherwise keeps the PR's shortened wording and its new biological_scale CELLULAR. The PR's PMID:33374996 item is kept alongside rather than replaced, so the node now carries four evidence items.

    Module reference count went from 9 to 12. Validation: just validate passes (schema, terms, 12/12 snippets verified). The three conformers touched by this PR (Chromoblastomycosis 21/21, Coccidioidomycosis 144/144, Mycetoma 39/39) all still validate clean.

  summary: 'Create: methemoglobinemia module'
  details: |
    Created kb/modules/methemoglobinemia.yaml, a five-node final-common-pathway module for methemoglobinemia: Oxidation of Ferrous Heme Iron to the Ferric State (trigger) -> Heme Iron Oxidation Exceeding Reductase Capacity (amplifier) -> Methemoglobin Accumulation in the Erythrocyte (central_effector, the key conformance target) -> Raised Oxygen Affinity of the Remaining Ferrous Hemes (effector) -> Impaired Tissue Oxygen Delivery and Functional Anemia (consequence). The accumulation node also edges directly to the consequence node, so the two arms of the delivery defect (loss of carrying capacity, impaired unloading) are modelled separately. module_categories TOXICOLOGY, PHARMACOLOGY, METABOLISM. Nodes bind GO and CL terms only; methemoglobin and the oxidants are prose. Treatments carry the drug-target pattern: methylene blue ACTIVATES the balance node (adding an NADPH dependent reduction arm) and INHIBITS the accumulated pool, with REFUTE evidence for the glucose-6-phosphate dehydrogenase failure and the high-dose reversal; ascorbic acid is recorded with both a supporting case report and a REFUTE statement of unconfirmed benefit. Six reference cache files are new for this module (PMID:16634439, PMID:21954509, PMID:30788079, PMID:33274100, PMID:36412668, PMID:38707259); PMID:16634439 is a polarographic rat measurement that separates the affinity shift from the loss of functional hemoglobin and is the strongest evidence on the left-shift node, which Drug-Induced_Methemoglobinemia had recorded as an open discussion. Wired 11 conforms_to links across the four conformers: Hereditary_Methemoglobinemia (reduction arm) at the amplifier, accumulation and consequence nodes; Drug-Induced_Methemoglobinemia (excess oxidation) at the trigger, amplifier, accumulation and consequence nodes; Hemoglobin_M_Disease (ferric lock resistant to reduction) at the trigger, amplifier and accumulation nodes; Cyanosis_Transient_Neonatal (same lesion in HBG2) at the trigger node only. Validation: linkml-validate clean, linkml-term-validator passed, reference validation 26/26 snippets verified, just validate-module-batch clean, check-conformance-content resolves all 11 links. Review round 1 (ai4c-reviewer on PR 17011): added quote_role to every evidence item that lacked one (15 REVIEW_SYNTHESIS, 3 further BACKGROUND), rewrote the PMID:3752898 accumulation-node and PMID:19480335 ascorbic-acid explanations which had described abstract background paragraphs as the citing papers' own observations, reframed the ascorbic acid description so its two items are not presented as opposing weights, moved the glucose-6-phosphate dehydrogenase caveat into a structured effect_modifiers entry (COMORBIDITY / NO_EFFECT / OTHER) alongside the existing REFUTE item, removed the tool-output narration from notes while keeping the substantive CHEBI-versus-GO explanation, and noted in the PMID:38707259 explanation that the module does not adopt that source's "binds oxygen irreversibly" wording. The reviewer's GO:0006788 finding was not adopted: QuickGO gives the class definition as "The chemical reactions and pathways resulting in the loss of electrons from one or more atoms in heme", which is exactly the Fe2+ to Fe3+ electron loss the trigger node asserts, so the misleading caveat in notes was corrected to quote that definition rather than the binding being dropped. The five normalizer-rewritten reference cache files were reverted so the diff carries no derived-file churn; all snippets verify against the committed cache shape.

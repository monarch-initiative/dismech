  summary: 'Create: methemoglobinemia module'
  details: |
    Created kb/modules/methemoglobinemia.yaml, a five-node final-common-pathway module for methemoglobinemia: Oxidation of Ferrous Heme Iron to the Ferric State (trigger) -> Heme Iron Oxidation Exceeding Reductase Capacity (amplifier) -> Methemoglobin Accumulation in the Erythrocyte (central_effector, the key conformance target) -> Raised Oxygen Affinity of the Remaining Ferrous Hemes (effector) -> Impaired Tissue Oxygen Delivery and Functional Anemia (consequence). The accumulation node also edges directly to the consequence node, so the two arms of the delivery defect (loss of carrying capacity, impaired unloading) are modelled separately. module_categories TOXICOLOGY, PHARMACOLOGY, METABOLISM. Nodes bind GO and CL terms only; methemoglobin and the oxidants are prose. Treatments carry the drug-target pattern: methylene blue ACTIVATES the balance node (adding an NADPH dependent reduction arm) and INHIBITS the accumulated pool, with REFUTE evidence for the glucose-6-phosphate dehydrogenase failure and the high-dose reversal; ascorbic acid is recorded with both a supporting case report and a REFUTE statement of unconfirmed benefit. Three references were newly cached for this module (PMID:30788079, PMID:33274100, PMID:16634439); the last is a polarographic rat measurement that separates the affinity shift from the loss of functional hemoglobin and is the strongest evidence on the left-shift node, which Drug-Induced_Methemoglobinemia had recorded as an open discussion. Wired 11 conforms_to links across the four conformers: Hereditary_Methemoglobinemia (reduction arm) at the amplifier, accumulation and consequence nodes; Drug-Induced_Methemoglobinemia (excess oxidation) at the trigger, amplifier, accumulation and consequence nodes; Hemoglobin_M_Disease (ferric lock resistant to reduction) at the trigger, amplifier and accumulation nodes; Cyanosis_Transient_Neonatal (same lesion in HBG2) at the trigger node only. Validation: linkml-validate clean, linkml-term-validator passed, reference validation 25/25 snippets verified, just validate-module-batch clean, check-conformance-content resolves all 11 links.

  summary: 'Create: RNAi Gene Silencing Therapy Module'
  details: |
    Created the RNAi mechanism module as a sibling of antisense_oligonucleotide_therapy, whose notes had explicitly excluded siRNA/RNAi and left the slot open. Five nodes: Pathogenic Transcript Abundance (trigger) -> Target-Cell siRNA Delivery -> RISC Loading of the siRNA Guide Strand -> Argonaute-2 Cleavage of the Target Transcript (central effector) -> Sustained Reduction of the Encoded Protein (consequence). Chose a separate module over extending the ASO module's branches because the effector genuinely differs (Argonaute-2 slicer versus RNase H1) and the ASO module is already three-branched and heavily caveated; merging would have made its conformance guardrails harder to state. Delivery is modeled as a node inside the chain rather than as a module of its own, because delivery is what a conforming disorder specializes to its target organ. It is deliberately NOT its own module: conformance exists so an entry can substitute organ-specific content, and GalNAc chemistry is identical everywhere, so a delivery module would cost full duplication for zero disease-specific variation. Platform chemistry belongs on the treatment via oligonucleotide_details instead. Ontology bindings: GO:0016071, GO:0006898, GO:0016442, GO:0035197, GO:0070551, GO:0090625, GO:0010467, all verified against OAK before use — GO:0016246 was the obvious candidate for RNA interference and turned out to be obsolete with no label, so it was dropped rather than guessed at. Evidence: 13 snippets across one cached full-text review (DOI:10.1007/s40259-023-00577-7) and three trial or review PMIDs, deliberately spanning three genes and three diseases (TTR, PCSK9, ALAS1) so the module is grounded as cross-disease rather than as ATTR-specific. The DOI snippets are skipped by linkml-reference-validator's prefix filter, so all 7 were verified by hand as whitespace-normalized substrings of the cache body. Added a KNOWLEDGE_GAP discussion recording that the endosomal-escape fraction is the least characterized step and that attributing dosing-interval differences specifically to escape kinetics would exceed what the cited sources support. Treatments block carries patisiran, vutrisiran, inclisiran and givosiran as worked examples of the new oligonucleotide_details slots.

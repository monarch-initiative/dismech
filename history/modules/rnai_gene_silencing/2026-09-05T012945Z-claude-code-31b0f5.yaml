  summary: Fold the unevidenced RISC-loading node into Argonaute-2 cleavage
  details: |
    Folded the RISC Loading of the siRNA Guide Strand node into Argonaute-2 Cleavage of the Target Transcript, on review. The node claimed RISC loading, passenger-strand discard and guide-strand selection, but its only evidence was the snippet 'Binding triggers activation of the Argonaute slicer protein, which degrades the mRNA, thereby inhibiting TTR synthesis' - which describes the next step and was reused verbatim on the cleavage node below it. Verified independently rather than taken on the reviewer's word: the cited cache body contains zero occurrences of RISC, passenger, guide strand or silencing complex, and the module's other three references do not rescue it, so GO:0016442 and GO:0035197 on that node carried no evidence at all. That failed the bar the module's own notes set. Fixed by folding rather than by finding a new source: the loading step is now setup prose inside the cleavage node's description, carrying no ontology binding and no evidence of its own, and the two unevidenced bindings were dropped rather than relocated. Blast radius checked first - the only inbound edge was from the delivery node (re-pointed at the cleavage node) and nothing in kb/, src/, tests/ or docs/ referenced the node name; ATTR_Amyloidosis, the only conformer, already collapsed loading and cleavage into a single node and declared conforms_to against the other four. Added a Node granularity note recording why the node is absent and what would justify splitting it back out, so the omission reads as a decision rather than an oversight. Also corrected a phrase in the delivery node that called RISC loading catalytic; cleavage is the catalytic step. Separately, trimmed the module's inclisiran dosing_interval to drop the loading doses, per the convention this PR introduces.

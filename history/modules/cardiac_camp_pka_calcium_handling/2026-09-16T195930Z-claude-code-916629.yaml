  summary: 'Create: cardiac cAMP/PKA calcium-handling module (AOP-Wiki KE 693)'
  details: |
    Created kb/modules/cardiac_camp_pka_calcium_handling.yaml, the cardiomyocyte cAMP/PKA arm that destabilizes calcium handling. Five nodes: Cardiomyocyte cAMP-Raising Stimulus (trigger) -> Increased Cardiomyocyte cAMP (amplifier; the AOP-Wiki KE 693 analogue) -> PKA Activation and Phosphorylation of the Calcium-Handling Apparatus (central_effector, key conformance target) -> Increased Sarcoplasmic Reticulum Calcium Load (effector) -> Spontaneous Sarcoplasmic Reticulum Calcium Release and Triggered Activity (consequence). Three mechanistic_hypotheses: pka_phospholamban_sr_load_elevation (CANONICAL, the default edge), pka_ryr2_ser2808_calstabin_dissociation (ALTERNATIVE, Marx 2000 vs the S2808A knock-in and the Ser2030 group), pka_ryr2_ser2030_soicr_sensitization (ALTERNATIVE, Chen group vs the direct wave-threshold measurement). Three discussions: a CONTROVERSY on the RyR2 site and its functional consequence, a KNOWLEDGE_GAP on PDE isoform/compartment/disease-state conditioning of the cAMP rise (dismech issue 10454), and a KNOWLEDGE_GAP on whether the PROMISE milrinone mortality signal runs through this module's arrhythmic arm (the trial states the mechanism is unknown). One treatment: beta-adrenergic blockade with carvedilol, targeting two nodes because carvedilol both blocks the receptor and directly shortens RyR2 openings. No AOP-Wiki content was used as evidence; AOP-Wiki carries no citable reference and all four KERs touching KE 693 are 29.41-percent stubs with zero references in the 2026-09-16 snapshot, and AOP 558 has never been OECD reviewed. All 13 references were found independently from primary literature. Validated with just validate-module: schema clean, term validation passed, and reference validation reported Snippets checked 29/29 verified against cached references.

  sections:
  - datasets
  summary: Add single-cell senescence datasets
  details: |
    Added a datasets block with four GEO series that profile senescent or cell-cycle-arrested cells at single-cell or spatial resolution: geo:GSE226225 (human WI-38 fibroblasts, multiple senescence inducers and an etoposide time course, scRNA-seq), geo:GSE173879 (human clonal lines in oncogene-induced, replicative and DNA damage-induced senescence, scRNA-seq), geo:GSE312805 (p16-CreERT2;tdTomato reporter mice, p16-high vs p16-low hepatocytes after CCl4 injury, scRNA-seq) and geo:GSE278611 (p21-Cre;tdTomato mouse skin and wounds, Xenium spatial transcriptomics). Candidates came from NCBI GEO E-utilities searches; each GEO summary was read to confirm it profiles senescent or arrested cells rather than ageing in general. Titles are GEO's own; publication PMIDs are the series' linked PubMed records and were cached with just fetch-reference. No evidence blocks were added. Validated with just validate, just validate-terms, just verify-datasets (writes references_cache/GEO_*.md), check-duplicate-keys and check-block-scalar-comments.

  summary: Add anti-uPAR CAR T senolytic therapy and two GEO datasets
  details: |
    Leads came from Norn Group's Impetus Grants page (Corina Amor, CSHL). Added a CELL_THERAPY treatment (NCIT:C126102) targeting Senescent Cell Accumulation and Tissue Dysfunction, with evidence from PMID:38267706 (aged and high-fat-diet mice) and PMID:41291258 (intestinal aging). Added geo:GSE243616 (scRNA-seq of uPAR+/- cells from aged liver, fat, pancreas) and geo:GSE233431 (scRNA-seq of young/old intestinal crypts with CAR T treatment); the SuperSeries GSE301534 is noted but not recorded. Accessions resolved with verify-datasets; titles copied from GEO, including its misspelling 'Prophilactic'.

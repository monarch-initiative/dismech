  summary: Add turquoise killifish (Nothobranchius furzeri) animal model with modeled_mechanisms
  details: |
    Added a turquoise killifish (Nothobranchius furzeri) animal_models entry linking the GRZ/MZM strain pair to this module. Two ModelMechanismLinks: a FAILS_TO_RECAPITULATE link against 'Senescence-Associated Cell Cycle Arrest' (primary cultures from both strains do not enter replicative senescence, attributed by the authors to sustained telomerase activity and maintained telomere length), and a PARTIALLY_RECAPITULATES link against 'Senescent Cell Accumulation' (Cdkn1a/Cdkn2a-b rise with age in skin of the LONGER-lived MZM strain only). Both links carry limitations and evidence; the negative link is substantiated as required. Evidence: PMID:22445733, all snippets exact-quoted from the cached abstract and verified with count-verified-snippets. Deliberately anchored on the negative result because the KB previously had no killifish model at all and the species is widely cited for this module without the in-vitro caveat.

  summary: Add naked mole-rat comparative negative model and its translational-validity
    discussion
  details: |
    Added the naked mole-rat (Heterocephalus glaber) as a comparative negative model under animal_models, with four modeled_mechanisms links: RECAPITULATES on Senescence-Associated Cell Cycle Arrest (developmental, oncogene-induced and irradiation-induced senescence, PMID:29432174), PARTIALLY_RECAPITULATES on the SASP node (SASP genes induced as in mouse but with deeper down-regulation of DNA metabolism, transcription and translation), and FAILS_TO_RECAPITULATE on Senescent Cell Accumulation (PMID:21993625, PMID:33742113) and on Tissue Dysfunction and Age-Related Pathology (PMID:29364116). The two negative links carry limitations recording that no p16INK4a or SA-beta-gal census exists across the naked mole-rat lifespan, so the negative claim is an absence argument plus one cultured-fibroblast resistance mechanism rather than a measurement. Added a HUMAN_MODEL_MISMATCH discussion with two proposed experiments covering that gap and the transferability of the beta-catenin/cholesterol senescence brake to human cells. The model is a species comparison, not a disease model, and the notes now say explicitly that conforming disorder entries do not inherit these links. Validated with linkml-validate, linkml-term-validator, linkml-reference-validator (28/30 snippets verified, 2 non-PMID prefixes skipped), check-entity-refs, check-enum-values, check-duplicate-keys and the snippet-quality gates.

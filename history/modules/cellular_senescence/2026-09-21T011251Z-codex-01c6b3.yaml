  summary: Capture senescence immunosurveillance and qualify state biomarkers
  details: |
    Read the supplied Shakur et al. mini review in full and, after explicit authorization for a local module update, reused existing CL identity and GO biological-process fields. Added separate HLA-E display in senescent human skin fibroblasts, reduced NK-cell cytotoxicity, and impaired immune-clearance nodes. Used Pereira et al. as primary in-vitro evidence for the HLA-E/NKG2A branch; kept review synthesis and indirect population-level extrapolation explicit. Qualified arrest durability, SASP heterogeneity, and cell-state versus cell-burden semantics. Scoped the p16 transcript association to human IPF, removed its protein binding and unsupported general prognostic designation, and made SA-beta-gal an assay-contextual supportive readout. Added an open question on whether immune-rejuvenation benefits are mediated by senescent-cell clearance. Preserved all five prior node names and all treatment and model sections. Schema and ontology validation passed; all 46/46 evidence snippets verified, versus 35/35 before editing. Duplicate keys, entity references, causal targets and knowledge-gap targets passed; graph has 28 edges with no orphan targets. Detailed source pages, term lookups and validation records are in docs/reports/senescent-cell-representation-2026-09-20.md and its companion directory. The Demaria expression-of-concern example remains caveated research context and was not promoted as new module support. The local curation changed no schema or disease files and left the supplied PDF unchanged. Chris subsequently requested a PR. The branch was refreshed to f3df177789af41976971b15edbb91d65f0c67cc1, the module content hash remained unchanged, and schema, ontology, reference, design-fixture and module-content checks passed again; see the companion pr-validation.json. The source PDF and its local text extraction remain excluded from the commit.

  details: |
    Resolved the merge of origin/main (PR #10266, naked mole-rat comparative models) into the killifish branch for PR #10267. Both PRs append an animal_models block to this module. The merge keeps BOTH species' entries under a single animal_models key: main's version of the file is the base and the killifish entry is spliced into main's existing block, so the mole-rat entry is not moved, reordered or edited. Verified semantically rather than by diff: every element of every top-level section of both parents is present in the merge, exactly one animal_models key, and each entry's species/genotype/evidence/limitations are byte-identical to its origin, so no killifish claim is attached to a mole-rat model or the reverse. Re-validated on the merged tree: linkml-validate clean, validate-references clean, check-duplicate-keys and check-entity-refs clean KB-wide, and main's new enum/causal-target/qualifier gates pass. THIS FILE WAS THE DANGEROUS ONE: it did NOT conflict. Main placed animal_models AFTER experimental_models while this branch placed it BEFORE, so git auto-merged both into a file with two animal_models keys. PyYAML keeps the last, so the auto-merged file silently exposed only the mole-rat entry and dropped the killifish one -- invisible to every test, renderer and export, and caught only by check-duplicate-keys and the ruamel-backed reference validator. This is dismech#8623 in its exact documented form and is recorded here so the near-miss is not lost.

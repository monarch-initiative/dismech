  details: |
    Review response (PR #10283, ai4c-reviewer finding 3). Corrected model_format for the Verlingue2016 geroconversion model (MODEL1611180000) from SBML to SBML-qual. The BioModels API reports the format only as 'SBML', but the deposited file declares xmlns:qual with qual:required='true' and carries 397 qual-namespace elements, so a plain SBML reader cannot load it. Verified by downloading and inspecting the file rather than trusting the API summary.

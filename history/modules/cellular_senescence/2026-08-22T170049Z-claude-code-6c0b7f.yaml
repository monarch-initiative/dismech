  summary: Add knowledge gap on plasma cell-type aging clocks versus senescent-cell
    burden
  details: |
    Added discussion gap_senescence_vs_plasma_cell_type_aging_clocks, a KNOWLEDGE_GAP asking whether cell-type-specific plasma proteomic aging clocks report senescent-cell burden or a distinct axis of cellular aging. This records a curation boundary decision rather than inventing content: nine aging-clock biomarkers were curated across five disorder entries in this tranche and NONE were attached to this module, because the source work measures no senescence marker. The discussion names all nine and states that resolving the question either brings the whole set into conformance here or confirms it belongs outside. Three readings are laid out without choosing between them; the protective arm (youthful immune and neuronal lineages conferring survival at or above normal agers) is flagged as the strongest hint the clocks are not simply an inverse readout of senescent-cell burden, and is a resilience claim this module has no node for. Also records that the source study is MeSH-indexed under Cellular Senescence while making no senescence measurement, which is exactly the indexing-by-association that would let an unexamined conformance edge in. This is also where the polycellular aging risk score (PARS) and the cumulative-burden mortality dose-response are homed: they are disease-agnostic and had no natural disorder entry. Two proposed_experiments give the discriminating designs (matched tissue p16/SA-beta-gal versus plasma clock; senolytic intervention as a pharmacodynamic test). All four evidence items are marked PARTIAL because none measures a senescence marker. Deliberately did NOT create a new module for polycellular aging: applying the create-module skill's own bar, the candidate has no single rate-limiting node that every conformer funnels through - the pathways producing an aged astrocyte, myocyte and myeloid cell are unrelated - so it is the mechanistically heterogeneous case that skill says is not a module. Validation: linkml-validate clean; term validation passed; reference validation --no-full-text exit 0.
    Part of the cell-type plasma proteomic aging clock tranche prompted by the
    Cell Reports Medicine Spotlight (PMID:42612620); primary source throughout is
    Ding et al. (PMID:42297981). Companion records: Alzheimer_Disease,
    Amyotrophic_Lateral_Sclerosis, Lung_Carcinoma, Type_2_Diabetes_Mellitus,
    Frontotemporal_Dementia, and the cellular_senescence module.

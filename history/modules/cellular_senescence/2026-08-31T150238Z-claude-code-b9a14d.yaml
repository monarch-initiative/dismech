  summary: 'Add computational models and simulation resources relevant to aging: cellular_senescence'
  details: |
    Added four computational models: the Passos2010 p21-ROS senescence feedback loop (BIOMD0000000287), the Karin-Alon saturating-removal model of senescent-cell turnover that recovers the Gompertz law, the Verlingue2016 Boolean geroconversion model (MODEL1611180000), and a population model of DNA damage, senescence and stem-cell dynamics used to simulate senolytics. Each carries modeled_mechanisms links to declared pathophysiology nodes with relationship, fidelity and explicit limitations. Every PMID was resolved through a PubMed search and cached before use; every BioModels identifier was confirmed against the BioModels API, which also supplied the model-to-publication pairing. No evidence snippets were added, so no snippet claims are asserted.

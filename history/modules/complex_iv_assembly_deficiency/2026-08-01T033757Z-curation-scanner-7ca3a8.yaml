  summary: 'Audit: correct MONDO-anchoring note for the Complex IV family'
  details: |
    Audit of the MONDO anchoring of the Complex IV (COX) deficiency family, triggered by issue #3544 (MONDO New Term Requests for the Complex IV leaves).

    Verified against a freshly downloaded sqlite:obo:mondo adapter on 2026-08-01:

    1. All 24 dismech Complex IV disorder entries that conform to this module carry an exact, gene-consistent MONDO anchor (the 20 *-Related_COX_Deficiency entries plus Reversible_Infantile_Cytochrome_c_Oxidase_Deficiency, COX4I2-Related_Pancreatic_Insufficiency-Anemia-Hyperostosis_Syndrome, SURF1-Related_Leigh_Syndrome, and SCO2-Related_Fatal_Infantile_Cardioencephalomyopathy). For every anchored entry that MONDO gives an RO:0004003 edge, the MONDO causal gene matches the gene curated in the entry's genetic section, and every term.label matches the current canonical MONDO label. No mis-anchoring was found, so no disorder entry was changed.

    2. NTR 2 of issue #3544 (a COX18 class) has been satisfied upstream. MONDO now has MONDO:0980970 "mitochondrial complex 4 deficiency, nuclear type 25" (xref OMIM:621487). OMIM esummary and MedGen (UID 1896184) both confirm MC4DN25 is the COX18-related disorder first reported by Ronchi et al. 2023. dismech already repointed kb/disorders/COX18-Related_COX_Deficiency.yaml from the interim MONDO:0033885 to MONDO:0980970 in commit 47bdd143f0 (PR #4674), and no interim caveat text remains in that entry. Two further classes that the NTR did not request have also appeared and are already in use: MONDO:0859520 (MC4DN23, COX11) and MONDO:0980755 (MC4DN24, FASTKD5).

    3. NTR 1 of issue #3544 (a mitochondrial-type Complex IV grouping) is still unsatisfied, so the mtDNA-encoded structural-subunit causes (MT-CO1, MT-CO2, MT-CO3) still have no MONDO class to anchor a disorder leaf to. That work stays blocked on an upstream New Term Request that only a human can file in monarch-initiative/mondo.

    Change made: this module's notes field claimed that "MONDO lacks a non-obsolete pan-form Complex IV grouping class, so the umbrella disease entry that conforms to this module uses MONDO:0033885 (nuclear-type) as the closest available term". Two parts of that were wrong or imprecise and have been corrected:

    - There is no umbrella *disease* entry for this module. The nuclear-encoded arm is represented by the Grouping kb/groupings/Mitochondrial_Complex_IV_Deficiency.yaml, which maps MONDO:0033885 with skos:exactMatch and is deliberately scoped to the nuclear-type arm (see its display_name and mapping_justification). MONDO:0033885 is not a reluctant "closest available" compromise there.
    - MONDO:0033885 is labelled nuclear-type but is asserted directly under MONDO:0000066 and carries the pan-form umbrella cross-references (OMIMPS:220110, Orphanet:254905 "isolated COX deficiency", MESH:D030401, NCIT:C98910, DOID:3762, GARD:0000048), because MONDO has no pan-form Complex IV parent of its own. The note now records this explicitly, together with the Complex I precedent that Complex IV lacks: MONDO:0100133 (pan-form) over MONDO:0100223 (nuclear type) and MONDO:0100134 (mitochondrial type).

    Note that issue #3544 itself cites MONDO:0033893 as the Complex I nuclear-type grouping; that CURIE does not resolve in current MONDO, and the historical MONDO:0009640 nuclear-type class is obsolete. The live class is MONDO:0100223. The corrected note uses MONDO:0100223.

    Outcome recorded as needs_followup because the mitochondrial-type NTR remains open upstream; no pathophysiology, evidence, or ontology term in this module was altered.

    Validation: just validate and just validate-terms both pass on the module; scripts/check_folded_hyphens.py --check reports no new folded-scalar hyphen splits; 7/7 evidence snippets still verify against references_cache.

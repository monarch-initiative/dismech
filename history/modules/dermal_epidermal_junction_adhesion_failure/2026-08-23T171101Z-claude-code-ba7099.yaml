  summary: Resolve self-contradictory EBS guidance in module notes
  details: |
    The trigger-node substitution list named KRT5/KRT14 while the scope note two paragraphs later forbade an EBS entry conforming at that node, so a curator following the list would do what the note forbids. Removed KRT5/KRT14 from the list, kept PLEC as the genuine hinge, and stated why they are excluded. Also resolved the reviewer's question about whether EBS should conform at the separation node: it should not, because EBS splits intraepidermally through the cytolysing basal keratinocyte above an intact basement membrane zone, not at the dermal-epidermal junction. That reasoning is now in the notes so the omission does not read as an oversight.

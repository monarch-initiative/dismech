  summary: Rebind C5 convertase conformance target from GO:0006956 to the more specific
    GO:0001905
  details: |
    PR-shepherd pass addressing the blocking GO-granularity finding of the 2026-08-19T03:18 review.

    The reviewer identified a granularity inversion: the C5 Convertase Activation and Terminal Pathway Assembly node -- role central_effector, and the module's advertised key conformance target -- bound the parent term GO:0006956 "complement activation", while the node immediately upstream of it bound the more specific child GO:0006957 "complement activation, alternative pathway". A conformance target should not be less specific than its own upstream node.

    Rebound to GO:0001905 "activation of membrane attack complex". This was verified independently against OLS rather than trusted from the derived label cache: the term is non-obsolete, its canonical label is exactly "activation of membrane attack complex", and its definition -- "The activation of the membrane attack complex components of the complement cascade which can result in death of a target cell through cytolysis" -- matches this node's own description of C5b nucleating sequential C6/C7/C8/C9 assembly into the lytic C5b-9 complex. It also pairs correctly with the GO:0005579 membrane attack complex cellular_component already bound on the node, as the reviewer noted.

    No cache file was created or hand-edited. GO:0001905 was already present in cache/go/terms.csv and already a member of the biologicalprocessterm enum cache, so the rebinding required no cache write and validates offline.

    Validation actually run and read:
    - just validate-terms kb/modules/complement_dysregulation.yaml -- passed.
    - just validate kb/modules/complement_dysregulation.yaml -- schema, terms and references all passed; "Snippets checked: 16/16 verified against cached references".
    - pytest -k conforms_to_module_node_references -- 2154 passed, confirming no conforms_to reference to this module was broken by the change.
    - just check-duplicate-keys -- OK across 2314 YAML files.

    Incidental churn note: running the reference validator rewrote frontmatter in references_cache/PMID_29266249.md, a file unrelated to this change and not part of this PR. That churn was reverted rather than committed, keeping the diff scoped to the single node rebinding.

    The second blocking finding of the same review -- documenting the bundled out-of-scope commit 32c078df5 in the PR body -- is addressed in the PR description, not in this record.

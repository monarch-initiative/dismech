  summary: 'Create: complement_dysregulation mechanism module'
  details: |
    Created the complement_dysregulation mechanism module: loss of complement regulatory control -> unrestrained alternative pathway amplification -> C5 convertase activation and terminal pathway assembly (central effector, key conformance target) -> complement-mediated cell injury and endothelial activation -> complement-mediated tissue injury syndrome. Carries the terminal-complement-inhibitor drug pattern (eculizumab/ravulizumab, target_mechanisms INHIBITS against the C5 node).

    Scope decision: deliberately anchored on the alternative-pathway amplification loop, the conserved and druggable core. Classical/lectin-initiated disease enters at the amplification node rather than the trigger; this is stated in the module description and notes rather than silently covered. Complementarity with molecular_mimicry_autoimmunity (how an autoantibody arises, not what its complement-fixing effector arm does) and hemolytic_anemia_erythrocyte_destruction (broader red-cell destruction, of which complement-mediated intravascular haemolysis is one route) is recorded in the description.

    Evidence discipline: 6 PMIDs, all fetched via just fetch-reference with snippets taken from the real cached abstracts; 16/16 verified by the reference validator. Two PMIDs recalled from memory during planning were discarded after verification: PMID:19846853 (Noris and Remuzzi aHUS review) cached with no abstract body and so could not support a snippet, and PMID:24596416 proved to be a CAR-T AML paper rather than the intended PNH review.

    Conformers wired: Atypical_Hemolytic_Uremic_Syndrome (2 nodes; substitutes CL:0002188 glomerular endothelial cell for the module's generic endothelial cell), Paroxysmal_Nocturnal_Hemoglobinuria (2 nodes), Myasthenia_Gravis (1 node).

    Validation: linkml-validate clean, linkml-term-validator passed, reference validator 16/16 verified, pytest conformance selection 2727 passed.

  summary: Fix MG conformance granularity and classical-pathway entry point
  details: |
    Addresses two Cursor Bugbot findings on PR #8872, both verified as real before acting.

    1. MG conformance granularity (Bugbot, Medium). Myasthenia_Gravis "Complement Activation" declares conforms_to this module's "C5 Convertase Activation and Terminal Pathway Assembly" node, but bound the parent GO:0006956 with no membrane-attack-complex component, while the module node binds GO:0001905 + GO:0005579. This was the same granularity inversion the ai4c reviewer had already made me fix inside the module, reappearing in the conformer. The MG node's own description ("leading to membrane attack complex formation") and its cited snippet both describe MAC formation, so the rebinding to GO:0001905 with the GO:0005579 cellular_component records what the node already claimed. Both terms were already label-cached and enum-cached; no cache row was written.

    2. Internal inconsistency about where classical-pathway disease attaches (Bugbot, same finding). The description said classical/lectin-initiated disease "enters this chain at the amplification node", the notes listed myasthenia gravis among trigger-node substitutions, and the wiring attached MG at the terminal node - three statements that disagreed. Resolved in favour of the wiring, which matches MG's curated content: classical/lectin disease has no regulator lesion so it never conforms at the trigger, and enters at whichever node its own curated content models - amplification when curated at convertase level, terminal when curated through to MAC formation, as anti-AChR MG is. Notes updated to state MG is explicitly not a trigger-node conformer and why.

    Also added thrombogenesis to the module's sibling-boundary statement, closing a non-blocking suggestion from the ai4c reviewer.


  summary: 'Create module: mTOR adaptive resistance to androgen deprivation'
  details: |
    Created kb/modules/mtor_androgen_deprivation_resistance.yaml: a conserved PI3K/AKT/mTOR adaptive-resistance mechanism for AR-pathway blockade in prostate cancer. Five-node chain (AR pathway blockade -> reciprocal PI3K/AKT feedback activation -> mTORC1 hyperactivation [central effector / key conformance target] -> pro-survival translational/metabolic reprogramming -> adaptive castration resistance), an mTOR+ARPI co-targeting treatment (everolimus + abiraterone acetate; target_mechanisms INHIBITS on the mTORC1 node), and an EMERGING mechanistic_hypotheses group (mtor_resensitization). Evidence anchored on primary reciprocal-feedback literature (Carver PMID:21575859, Mulholland PMID:21620777; MODEL_ORGANISM) plus a PI3K/AKT/mTOR-in-PCa review (PMID:41525007; OTHER); all snippets verified exact substrings; schema + term validation pass. Motivated as the reusable mechanistic complement to AI-discovered cellular morphometric biomarkers of NADT response (Yan et al., Cancer Letters 2026, PMID:41887393), whose INR-like non-responder state converges on this axis.

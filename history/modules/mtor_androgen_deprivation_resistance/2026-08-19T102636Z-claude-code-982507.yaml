  details: |
    Review response to the ai4c-reviewer CHANGES_REQUESTED review of PR #8854. Addressed the three blocking items that were evidence-attribution defects fixable by re-quoting the caches already in this PR (review items 2, 3 and 4); left items 1 and 5 to the PR author because both are curation judgements rather than re-quoting.

    Item 2 - treatment evidence did not support its explanation. The second treatment evidence item on "mTOR Inhibition Combined with AR-Pathway Inhibition" quoted the PMID:41525007 sentence about immunotherapy (checkpoint inhibitors), docetaxel and ADT, which never mentions PI3K/AKT/mTOR targeting, while its explanation claimed support for pathway-targeted combinations. Re-quoted the on-point sentence from the same abstract, naming allosteric and ATP-competitive AKT inhibitors, isoform-selective PI3K inhibitors, and first- and second-generation mTOR inhibitors, and rewrote the explanation to match what that sentence actually says.

    Item 3 - amplifier-node evidence pointed the wrong direction. The PMID:21620777 item on the amplifier node quoted "PTEN loss suppresses androgen-responsive gene expressions by modulating androgen receptor (AR) transcription factor activity", which is the PTEN-to-AR arm, not the AR-blockade-to-AKT sensitization the node asserts. Replaced with the same abstract's Fkbp5/PHLPP sentence (conditional Ar deletion promotes Pten-null proliferation by downregulating Fkbp5 and preventing PHLPP-mediated AKT inhibition), which is the correct direction, and rewrote the explanation accordingly.

    Validation: just validate (all validations passed), just check-duplicate-keys (OK), just count-verified-snippets 55/71 verified with 16 skipped by prefix across the module and both disorder entries - identical to the pre-change baseline reported in the review, and both replaced snippets were additionally confirmed as exact whitespace-normalized substrings of their cached abstracts.

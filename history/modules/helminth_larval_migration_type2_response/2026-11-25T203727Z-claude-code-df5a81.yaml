  summary: 'Create module: Helminth Larval Migration and Type 2 Tissue Response'
  details: |
    New mechanism module for the conserved host response to a tissue-migrating helminth larva: trigger (larval tissue migration and epithelial injury) -> amplifier (epithelial alarmin IL-33/TSLP/IL-25 release and ILC2 activation; tuft-cell IL-25 circuit, PMID:26675736) -> central_effector / key conformance target (type 2 immune response IL-4/5/13 from Th2 and ILC2, PMID:29262347) -> effector (eosinophilia, IgE class-switching, mastocytosis, PMID:27262918) -> consequence (eosinophilic tissue inflammation around larvae). Complementary to granuloma_formation (macrophage/Th1) and chemical_respiratory_allergy (hapten airway sensitization). No Xogenesis anchor (terminal lesion is eosinophilic inflammation, not a discrete structure). Trichinellosis and Toxocariasis are wired as conformers in their own PRs. Validates against Disease; terms, references, causal-targets, name-collisions, folded-hyphens, enum-values all pass.

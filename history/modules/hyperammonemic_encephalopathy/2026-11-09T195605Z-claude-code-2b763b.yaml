  summary: 'Create: Hyperammonemic Encephalopathy module'
  details: |
    New mechanism module for the shared ammonia -> astrocytic glutamine -> osmotic swelling -> cerebral edema -> encephalopathy final common pathway of the urea cycle disorders. Five-node trigger->amplifier->central_effector->effector->consequence chain; central_effector (astrocytic glutamine accumulation and osmotic swelling) is the key conformance target. Evidence from hepatic-encephalopathy mechanistic reviews (PMID:17006913 Trojan-horse, 20654582, 22285152) and the Haberle UCD guidelines (PMID:30982989); 10/10 snippets verified. Wired six existing conformers (OTC, CPS1, Citrullinemia I, argininosuccinic aciduria, NAGS, HHH) via conforms_to, converting prior metabolic_intoxication_decompensation strings to lists where present. Complementarity to metabolic_intoxication_decompensation and glutamate_excitotoxicity stated in the description; Arginase deficiency caveat noted.

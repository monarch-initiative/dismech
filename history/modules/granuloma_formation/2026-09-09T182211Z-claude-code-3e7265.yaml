  summary: Soften the ECTO coverage enumeration in review_notes (#11545 review)
  details: |
    Non-blocking finding from the ai4c-reviewer review of PR #11545, and correct on the facts. The review_notes claimed the only organism-level exposure terms ECTO carries are ECTO:2000053 and ECTO:3000003. The cache also holds ECTO:3000000 (exposure to organism), ECTO:3000001 (exposure to virus) and ECTO:3000006 (Toxoplasma gondii), so the enumeration was too absolute.

    The disposition is unchanged and still correct: none of those is a granulomatous stimulus, and the entry stays unbound. The note now says ECTO carries no term for any granulomatous organism, describes its organism-level exposures as viral plus a few named non-granulomatous species, and records that ECTO:3000000 exists but is broad enough to cover every infection, so binding it would assert nothing the module does not already say.

    Re-validated: just validate (16/16 snippets verified), check-environmental-evidence, check-folded-hyphens, check-duplicate-keys, check-enum-values, check-entity-refs.

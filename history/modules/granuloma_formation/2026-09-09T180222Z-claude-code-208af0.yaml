  details: |
    Added an environmental: entry, 'Persistent Indigestible Particulate Exposure', linked by influences_mechanisms (TRIGGERS, causal_link_type DIRECT) to the module's opening trigger node 'Persistent Indigestible Stimulus'. Second pass on the scope proposed in #10959; PR #11252 covered four of the seven modules and left this one because no ECTO term fits.

    exposure_term is deliberately left unbound and the search is recorded in review_notes rather than notes, since it is a curation disposition and notes renders as module content. ECTO carries no mycobacterial, fungal, pathogen, infection or foreign-body exposure term; its only organism-level exposures are HPV and Helicobacter pylori. ECTO:7000068 (particulate matter) means airborne pollution, not a phagocytosis-resistant particle. ECTO:9000941 (beryllium) and ECTO:7000030 (silica dust) are genuine granulomatous stimuli but each names one substitutable member of the class, and binding one would make a stimulus-agnostic module read as specific to berylliosis or silicosis.

    Evidence. The entry cites PMID:31723695 (Histopathologic review of granulomatous inflammation), newly fetched, for the claim that granulomatous inflammation is caused by a heterogeneous set of exposures rather than one agent. The link carries two items: PMID:29400999 for the persistent-stimulus-to-macrophage-failure claim covering both arms, and PMID:18162407 (Foreign body reaction to biomaterials), newly fetched, for the non-infectious arm. The 29400999 sentence is the same one the trigger node cites; the reuse is stated in the explanation, because it is the one sentence in the cited literature that couples the exposure to the macrophage-level failure defining the node.

    Validated: just validate (16/16 snippets verified), check-environmental-evidence, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-snippet-grading, check-snippet-length, check-title-snippets, check-reference-titles, check-folded-hyphens, check-snippet-boundaries, check-term-cache-integrity, environmental-term-audit, pytest tests/test_data.py (6353 passed).

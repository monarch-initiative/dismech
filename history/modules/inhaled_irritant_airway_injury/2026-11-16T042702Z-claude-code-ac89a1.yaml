  summary: 'Add Calu-3 ALI aerosol NAM model link (PMID:38013136, #16859)'
  details: |
    Mined the Calu-3 air-liquid-interface 3D lung model (Effah et al. 2023, PMID:38013136) from the Toxicology NAMs special issue into the inhaled_irritant_airway_injury module as a cellular-scale experimental_models entry. Added one experimental_models entry (Calu-3 bronchial epithelial line at ALI; the model was validated over 28 days and the aerosol exposures were performed on 21-day ALI cultures) linked to Airway Epithelial Junctional Barrier Failure as RECAPITULATES/MODERATE at model_scale CELLULAR. Scale equals the node's cellular scale (ALIGNED, no upward-extrapolation caveat); the link carries one BOUNDARY_OMISSION/QUALIFYING divergence for the monoculture omitting the immune, endothelial and fibroblast compartments. Two readouts: decreased TEER (barrier integrity) and increased LDH (cytotoxicity) in the aerosol exposure arm, plus a fitness-for-purpose finding. The node already cited this paper as node evidence (abstract); this adds the structured model-side half with full-text results-section snippets. The 28-day differentiation-marker validation arm and the flavour/vehicle/particle-size exposure comparisons have no dismech shape and go to the external nams-registry; recorded in projects/NAMS_SPECIAL_ISSUE.md. Chose inhaled_irritant_airway_injury over the issue's proposed epithelial_barrier_dysfunction because the latter is scoped to the allergic/type-2 barrier hypothesis and a chemical aerosol insult does not conform honestly.

    Rebased onto current main to resolve a merge conflict with PR #18243 (1,3-DCP MucilAir nasal model, PMID:37863466), which had appended its own experimental_models block to the same module; both entries now sit under one experimental_models key.

    Review round (ai4c-reviewer, CHANGES_REQUESTED): (1) corrected the exposure-culture age — the differentiation validation ran to 28 days but the toxicant exposures were on 21-day ALI cultures (cache line 72), so the name, description, cell_source and culture_system no longer imply a 28-day exposure; (2) the link-level evidence snippet "Calu-3 cells are apt for screening respiratory irritation and toxicity" ends with an in-text citation to Ihekwereme et al. 2014, so it was replaced with the authors' own primary-result sentence on TEER as the tight-junction barrier indicator (PRIMARY_RESULT retained, now correctly).

    Gates green: validate (snippets+titles), validate-terms, model-scale-audit --strict (3 links, 2 ALIGNED + 1 MODEL_ABOVE_TARGET, 1 BOUNDARY_OMISSION), check-duplicate-keys, check-entity-refs, check-causal-targets, check-name-collisions, check-logical-rules, check-enum-values, check-snippet-length, check-snippet-grading, check-reference-titles, check-block-scalar-comments.

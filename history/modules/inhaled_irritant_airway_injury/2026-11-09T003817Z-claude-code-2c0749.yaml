  summary: 'Create: Inhaled Irritant Airway Epithelial Injury Module'
  details: |
    Created the module to close dismech#16877, which recorded that four papers in the Toxicology NAMs special issue measure chemical irritant injury of the conducting airway with no module to attach a model link to. Five nodes: reactive xenobiotic deposition, epithelial thiol depletion and electrophilic stress, junctional barrier failure (the key conformance target), loss of mucociliary differentiation, and impaired mucociliary clearance. Kept as one module rather than three despite the three separable measurements, because they form one ordered chain through one rate-limiting node; the reasoning is recorded in the module notes. The barrier node is deliberately worded to allow barrier failure without cell death: PMID:32588239 shows acrolein disrupting zonula occludens-1 and raising permeability without killing or detaching the epithelium, so making cytotoxicity the mechanism of barrier loss would be wrong for the best-characterised agent in the class. Evidence is PMID:37863466 (1,3-dichloropropene in human nasal air-liquid-interface culture) for the trigger, thiol and differentiation nodes, PMID:32588239 and PMID:38013136 for the barrier node. The consequence node rests on a BACKGROUND-graded human clinical statement rather than a measurement, which the notes say. Dosimetry and in-vitro-to-in-vivo extrapolation are deliberately outside the module; see dismech#16887. An OpenScientist deep-research run (research/modules/inhaled_irritant_airway_injury-deep-research-openscientist.md) was executed against a provisional version of this chain; it confirmed solubility-and-reactivity-governed regional dosimetry, barrier failure as the convergent central effector across chemically unrelated irritants, and 1,3-dichloropropene as the canonical exemplar. Three citations were adopted after verification: PMID:36183849 (the companion study delivering one vapour to five airway-region models, measuring transepithelial conductance), PMID:31808915 (in vivo GSH depletion above 30 ppm) and PMID:25398987 (chlorine injury repairing to a disordered mucociliary arrangement). The report also identified TRPA1 sensory irritation as a parallel reflex outside the chain, now recorded as a boundary note. The report carried no reference-validation section, so every citation taken from it was cached and snippet-checked by hand. All three gates pass: linkml-validate, linkml-term-validator, and the reference validator at 6 snippets and 6 titles with zero issues. Wired one real conformer, Formaldehyde_Poisoning 'Nasal and upper airway epithelial cytotoxicity'; check-conformance-content reports that link as process_absent because the conformer reaches barrier failure through apoptosis rather than junction disassembly, which the module notes allow as an additional route to the same node.

  summary: 'Create: Toxic Alcohol Alcohol-Dehydrogenase Bioactivation module'
  details: |
    Created a five-node toxicology mechanism module for the toxic alcohols and glycols, in which the ingested compound is comparatively inert and the poisoning is caused by its oxidation products.

    Chain: Exposure to a Toxic Alcohol or Glycol with Latent Toxicity (trigger) -> Alcohol Dehydrogenase Bioactivation of the Parent Alcohol (central_effector, the key conformance target) -> Sequential Oxidation to the Toxic Organic Acid Metabolite (amplifier) -> High Anion Gap Metabolic Acidosis (effector) and Metabolite-Specific Target Organ Injury (consequence).

    The module's organizing insight is that the acidosis is shared while the injured organ is decided by which acid was generated: formate injures the retina, optic nerve and putamen; oxalate crystallizes in the renal proximal tubule; diglycolic acid is concentrated into that same tubule by a dicarboxylate transporter. The strongest evidence that the divergence sits downstream of a shared step is therapeutic, since one enzyme inhibitor given early prevents both the renal failure of one poisoning and the visual injury of another (PMID:27147840).

    Three treatments are modelled, which is unusual for a module and deliberate here: the drug-target pattern is the module's defining feature rather than an addition to it. Fomepizole and ethanol both act by competitive inhibition at the central effector, and hemodialysis acts one step downstream because it clears the parent compound and the acid together.

    Evidence: 20 snippets across 9 references, every one verified as an exact substring of its cached abstract before the file was written, using a script that asserts substring presence under the validator normalization. Reference titles were read from cache frontmatter programmatically, never typed. All nine references were already cached and cited by the conformers; no new references were fetched. Four items are graded directness INDIRECT because they are therapeutic responses cited as validation of the mechanism they target, which is the inference pattern CLAUDE.md assigns to INDIRECT.

    Scope decisions recorded in notes. Ethanol itself is excluded because its acute toxicity is largely the parent compound; isopropanol is excluded because its metabolite is a depressant rather than an acid, and the general review cited at the trigger node draws exactly that line, so the exclusion is sourced rather than assumed. Formaldehyde is excluded as a parent because it enters as the aldehyde and bypasses the alcohol dehydrogenase step; it is a near-conformer sharing everything downstream of the central effector and is deliberately not wired.

    The aldehyde oxidation step is bundled with acid accumulation in one node rather than split out, because the three conformers model that sub-step inconsistently and a node per sub-step would conform cleanly to only one of them. The step stays queryable through its bound aldehyde dehydrogenase molecular function.

    The acidosis node carries no ontology binding. There is no GO process term for a high anion gap metabolic acidosis, and GO:0030641 regulation of cellular pH is both the wrong scale and absent from the committed term cache. Per the ontology term contract, no term beats a bad one.

    Validation: linkml-validate (no issues), linkml-term-validator --labels (passed), reference validator (20 snippets, 20 titles, 0 issues). All ontology identifiers were read from the committed term caches rather than written from memory.

    Wired three conformers in the same PR: Methanol_Poisoning (6 nodes), Diethylene_Glycol_Poisoning (5 nodes), Ethylene_Glycol_Poisoning (2 nodes). Ethylene glycol conforms at fewer nodes than intended because two of its nodes already carry a conforms_to to drug_induced_nephrotoxicity and the slot is single-valued; see that entry's history record for the detail and the open question raised in the PR.

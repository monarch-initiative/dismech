  summary: 'Create: germline_two_hit_tumor_predisposition module'
  details: |
    Created the Knudson two-hit mechanism module: constitutional first hit, somatic second hit, biallelic loss in a susceptible cell (the key conformance target), clonal expansion, and the early-onset/multifocal/bilateral tumor spectrum. Carries the CAPP2 aspirin chemoprevention drug-target pattern, the classical_two_hit vs continuum_haploinsufficiency hypothesis groups, and an open KNOWLEDGE_GAP on tissue selectivity. Scope guardrails in notes exclude proto-oncogene predisposition syndromes such as RET/MEN2 and MET from the second-hit and biallelic nodes. All 10 evidence snippets verified as exact substrings of cached abstracts by just count-verified-snippets; linkml-validate and linkml-term-validator both pass. Two candidate PMIDs recalled from memory resolved to unrelated papers on fetch and were discarded rather than cited.

  summary: 'Create: spliceosome_component_deficiency mechanism module'
  details: |
    Created kb/modules/spliceosome_component_deficiency.yaml, a six-node conserved mechanism module for the spliceosomopathies: germline deficiency of a core snRNP protein (EFTUD2, SF3B4, SNRPB, TXNL4A, PRPF31) or spliceosomal snRNA (RNU4-2, RNU4ATAC, RNU12). Chain: Core Spliceosome Component Deficiency (trigger) -> Transcriptome-Wide Pre-mRNA Mis-Splicing (central_effector, the key conformance target; the entry records its component-specific signature here) -> Selective Depletion of Splicing-Sensitive Lineage Transcripts (effector) -> three lineage consequences: Neural Crest-Derived Craniofacial Malformation, Photoreceptor Degeneration, Neurodevelopmental Impairment. Major and minor spliceosome are branches of one trigger node. Out of scope by the notes: cis splice-site variants in a single gene, repeat-RNA sequestration of splicing factors, somatic SF3B1-class change-of-function lesions, and TREX/EJC genes. A KNOWLEDGE_GAP discussion holds the lineage-restriction question. Motivated by the corpus census: GO:0000398 was bound in 35 entries, 34 on non-conforming nodes, no module binding it; about half of those are true component-deficiency entries. Every PMID was found by PubMed search in this session, fetched with just fetch-reference, and every snippet copied from the cached abstract. Validation: linkml-validate No issues found; reference snippet audit 26/26 verified; linkml-term-validator Validation passed. Conformers wired in the same change: 13 disorder entries, listed in the per-disorder history records.

  summary: 'Create: germinal_center_reaction mechanism module'
  details: |
    Created kb/modules/germinal_center_reaction.yaml, the first dismech module for the adaptive humoral arm of immunity (issue #10924). Five-node chain trigger -> amplifier -> central_effector -> effector -> consequence: Antigen Capture and Naive B Cell Activation -> Cognate T Follicular Helper Cell Help -> Germinal Center Reaction -> Affinity-Matured Class-Switched B Cell Output -> Durable Protective Humoral Immunity. The central_effector node (AID-dependent somatic hypermutation and class switch recombination under affinity-based selection) is the key conformance target. Scoped to the reaction itself rather than germinal-centre failure, per the issue: conformers set direction with node modifiers, so immunodeficiencies conform in the DECREASED direction and germinal-centre-derived lymphoma in the dysregulated direction. Bindings are GO/CL/UBERON only: GO:0019882, GO:0042113, GO:0061470, GO:0002467, GO:0002314, GO:0016446, GO:0045190, GO:0002317, GO:0002319, GO:0002377, GO:0016064, GO:0002455; CL:0000788, CL:0000442, CL:0002038, CL:0000844, CL:0000786, CL:0000787; UBERON:0000029, UBERON:0010754. Note UBERON:0010754 is the germinal centre term, not the UBERON:0002199 suggested on the issue, which is a different concept and was not used. Evidence: 10 references, all newly fetched into references_cache this session; the three the issue described as already cached (PMID:11007474, PMID:11007475, PMID:22224772) were in fact absent and were fetched. All 15 snippets verified as exact substrings of their cached abstracts. AID evidence is deliberately split by evidence_source: PMID:11007474 (AID-knockout mice) is MODEL_ORGANISM, PMID:11007475 (HIGM2 patient mutation series) is HUMAN_CLINICAL. Wired seven conforms_to edges across six existing entries: Common_Variable_Immunodeficiency, Activated_PI3K-delta_Syndrome and Kabuki_Syndrome at the central_effector node; Follicular_Lymphoma at both the central_effector and the Tfh help node as the dysregulated-direction conformer; Specific_Antibody_Deficiency at the output node; Autosomal_Agammaglobulinemia at the consequence node, where the chain fails by never starting. Specific_Antibody_Deficiency's 'Failure of T-Independent Type 2 B Cell Activation' node was deliberately NOT conformed: T-independent antigens are out of scope for this module. IgA_Nephropathy was considered and left unconformed because its BAFF/APRIL-driven mucosal class switching is not clearly the classical T-dependent germinal-centre route. No treatments block: the therapies acting on this machinery (B-cell depletion, immunoglobulin replacement) fall under the iatrogenic B-cell depletion mechanism the issue puts out of scope, so a target_mechanisms pattern would have overstated the module's coverage. Not an Xogenesis module, so no OGMS/MPATH anchor stanza. Validation: linkml-validate, linkml-term-validator, and linkml-reference-validator all pass on the module and every touched disorder file; check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length and check-title-snippets pass; pytest conforms_to, entity-ref foreign-key, unique-name and module-validity selections pass (5738 tests).

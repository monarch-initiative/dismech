    Addressed the automated reviewer's two IMPORTANT findings on PR #11908. (1) The description/notes asserted immunodeficiency conformers universally use DECREASED, but the newly added Hyper-IgM_Syndrome_Type_2 processes used LOSS_OF_FUNCTION -- changed those two modifiers to ABSENT (PATO:0000462), which matches the module's own cited HIGM2 evidence wording ('absence of ... recombination', 'lack of ... hypermutations') more precisely than LOSS_OF_FUNCTION does, and reworded the module prose to 'DECREASED or ABSENT' so text and data agree. (2) Dropped the module-notes mirror of the Selective_IgA_Deficiency exclusion's third reason (polygenic/associative genetics 'unlike every other conformer'), which the reviewer showed is false: Common_Variable_Immunodeficiency, a declared conformer, has its own genetics described as spanning monogenic/digenic/polygenic models with an IUIS 'Unknown' gene defect and a TNFRSF13B susceptibility node -- the same gene cited against SIgAD. The exclusion decision itself stands on the other two reasons.

  summary: Extend germinal_center_reaction to the clinical infection outcome
  details: |
    Issue #11907: the module ended at Durable Protective Humoral Immunity, which had no downstream edge, so the reason that immunity matters was absent while the sibling innate module (phagocyte_oxidative_burst_failure) already carried its infection outcome.

    Added a terminal node 'Clinical Susceptibility to Infection' (role: outcome, biological_scale: ORGANISM) and the edge into it from Durable Protective Humoral Immunity, with evidence on both.

    Edge evidence is PMID:20675197 (Orange et al. 2010), a meta-analysis of 17 studies, 676 patients and 2,127 patient-years of primary immunodeficiency with hypogammaglobulinemia: pneumonia incidence falls 27% per 100 mg/dL increment in trough IgG (IRR 0.726, 95% CI 0.658-0.801), and is 5-fold higher at a 500 mg/dL trough than at 1000. Because immunoglobulin replacement moves the exposure, this is interventional rather than correlational support for the direction of the edge; both items are graded HUMAN_CLINICAL / PRIMARY_RESULT / DIRECT.

    Node evidence is PMID:31690396 and PMID:19151170, two reviews stating the characteristic encapsulated-organism sinopulmonary spectrum across the antibody deficiencies as a class; both graded HUMAN_CLINICAL with quote_role REVIEW_SYNTHESIS, since the clinical picture is human but the citing publications are reviews restating it.

    Four modelling calls the issue left open are argued in the module notes rather than defaulted: (1) the node name is generic and the pathogen spectrum sits in the description, so X-linked_Agammaglobulinemia's disseminated enteroviral node can still conform; (2) the name is in the susceptibility direction although the module otherwise names nodes physiologically, because the node carries no processes for a modifier to act on and the protective statement is already made immediately upstream; (3) no intermediate node was inserted, because the edge evidence measures antibody level against infection incidence with nothing in between; (4) no GO/CL/UBERON binding, matching the sibling module's terminal node, since this is a clinical outcome rather than a host process.

    Validated with just validate, just validate-module, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading, check-enum-values, check-duplicate-keys, check-entity-refs, check-causal-targets, and pytest -k 'module or conform or causal or entity_ref' (3464 passed).

  summary: Add the disseminated-tumour-cell dormancy node
  details: |
    The module's colonisation node mentioned dormancy in a parenthesis and modelled only its alternative, and the module description did the same. That left out the state most disseminated cells are actually in, and with it the reason the cascade has a clinical course measured in years. 25 conformance links.

    Added Disseminated Tumour Cell Dormancy (intrinsic_resistance; GO:0044838 cell quiescence INCREASED, GO:0006914 autophagy INCREASED), downstream of extravasation alongside colonisation and with an edge onward into colonisation for the awakening step. GO:0044838 was verified against ols:go before binding; it was not in cache/go/terms.csv.

    Three things the node carries that the parenthesis could not. It is quiescence and not senescence - equally stable and non-proliferative but reversible, so the cell keeps latent tumour-initiating capacity, which senescence would preclude and which is required for the late metastasis to happen at all; the notes now say the node is therefore not a conformance target for the senescence modules. It explains a therapeutic failure: adjuvant therapy is given to clear residual disease and the available drugs act on proliferating cells, so a dormant cell is refractory by virtue of its state with no resistance determinant involved, which is why the role is intrinsic_resistance. And the biology of residual disease diverges from the proliferative lesion it came from, so therapy chosen on the primary tumour's characteristics may not reach it.

    PMID:25118602 four times, for the latency and evasion, the quiescence-senescence distinction, the divergence of residual-disease biology, and the proliferation-targeting limit of current therapy.

    Also rewrote the parenthesis in the module description into a statement of what the node adds, since the description is the authoritative scope statement, and told a conforming entry with late relapse to use this node rather than modelling it as slow colonisation.

    Validated: validate-module-batch (11 snippets, 0 issues), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values.

  summary: 'Create: mTORC1 hyperactivation (mTORopathy) module'
  details: |
    New six-node mTORopathy module: Loss of an Upstream mTORC1 Negative Regulator (trigger; TSC1/TSC2, GATOR1 DEPDC5/NPRL2/NPRL3 with KICSTOR/SZT2, and PTEN branches), Somatic Second-Hit Biallelic Inactivation in the Lesion (amplifier, optional for conformers), Constitutive mTORC1 Hyperactivation (central effector and key conformance target), Translation and Anabolic Cell Growth Upregulation and Autophagy Suppression (effectors), and Hamartomatous Overgrowth and Dysplastic Lesion Formation (consequence, MPATH:74 Xogenesis anchor). One treatment block records the rapalog drug-target pattern (sirolimus CHEBI:9168, everolimus CHEBI:68478) with target_mechanisms INHIBITS on the central effector. Twenty-four evidence items across sixteen references, all exact-quote verified against the cached abstracts; twenty-two reuse snippets already verified in the TSC, LAM, DEPDC5, SZT2 and PHTS entries, two are new (PMID:21258367 ULK1 phosphorylation, PMID:21746920 TSC autophagy), fetched after a PubMed title search because the PMID first recalled for the Parkhitko paper resolved to an unrelated PNAS article and was discarded. Autophagy suppression is left terminal because the same paper shows residual autophagy is required for TSC tumour growth. Scope is distinguished in the description from deregulated_nutrient_sensing, pi3k_akt_mtor_cortical_overgrowth, il11_erk_ampk_mtor_aging, mtor_androgen_deprivation_resistance and sustaining_proliferative_signaling. Motivation: 75 disorder entries name mTOR or mTORC1 in a pathophysiology node and only six conformed to any mTOR-bearing module. Twelve entries wired in the same change.

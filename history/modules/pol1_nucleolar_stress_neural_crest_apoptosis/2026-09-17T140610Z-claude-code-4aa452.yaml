  summary: 'Create: Pol I nucleolar-stress neural crest apoptosis module'
  details: |
    Created kb/modules/pol1_nucleolar_stress_neural_crest_apoptosis.yaml, factoring out the Pol I ribosomopathy mechanism that Acrofacial_Dysostosis_Cincinnati_Type and Treacher_Collins_Syndrome each re-derived.

    Six-node chain: reduced Pol I rRNA transcription (trigger) -> tissue-selective threshold failure in neuroepithelium and neural crest (amplifier) -> nucleolar stress with free RPL5/RPL11 sequestering MDM2 (central_effector, the key conformance target) -> p53-dependent apoptosis (effector) -> depletion of neural-crest-derived craniofacial skeletal precursors (consequence). A parallel effector node carries the p53-independent arm.

    Two hypothesis groups, reusing the ids the POLR1A entry already established so the two are directly comparable: pol1_nucleolar_stress_ncc_apoptosis (CANONICAL) and pol1_p53_independent_arm (EMERGING). The EMERGING group rests on tp53 inhibition in polr1a-mutant zebrafish suppressing apoptosis while leaving rDNA transcription and neural crest proliferation impaired, so cartilage is only partly rescued.

    Evidence: 25 snippets across 8 primary references, every one verified as an exact substring of its cached abstract or full text. PMID:35881792 supplies the shared Polr1a/Polr1c/Tcof1 mouse-lineage evidence and the RPL5/RPL11-MDM2 biochemistry; PMID:29750247 the zebrafish polr1a dissociation; PMID:27448281 and PMID:31649276 the polr1c/polr1d and polr1b arms; PMID:18246078 and PMID:16938878 the Tcof1 mouse; PMID:38556235 the pharmacological p53 inhibition; PMID:29364875 the human-cell selectivity; PMID:25913037 the defining POLR1A report.

    A treatments block records p53 inhibition as the drug-target pattern acting on the apoptosis node, framed explicitly as preclinical target validation and not a human therapy.

    Conformers wired: Acrofacial_Dysostosis_Cincinnati_Type at six nodes (its variant node is deliberately left unwired, since the module trigger is the transcription deficit rather than a gene lesion); Treacher_Collins_Syndrome at its apoptosis node only, because conforms_to is single-valued and its other mechanism nodes already conform to pharyngeal_arch_patterning_serial_homology. Stale prose in both entries describing the module as nonexistent was rewritten.

    Diamond-Blackfan anemia was deliberately NOT wired. It curates the same MDM2-p53 checkpoint but reaches it from ribosomal-protein haploinsufficiency rather than a Pol I transcription defect, and its vulnerable lineage is erythroid. The narrow-versus-broad scoping call is recorded in the module notes and raised for a human reviewer.

    Validation: linkml-validate and linkml-term-validator pass on all three files; reference validator reports 25/25 for the module and 213/213 across the changed set; check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys, check-qualifier-terms, check-folded-hyphens, check-snippet-length, check-title-snippets, check-snippet-grading and check-case-collisions all clean; 3467 targeted pytest checks pass.

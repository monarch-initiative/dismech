  summary: 'Review round 1: close conformance-content gaps and sharpen module scope'
  details: |
    Addressed the automated review on PR 12029. All findings were verified against the files before changing anything; every one checked out.

    Blocking (yellow): conforming nodes did not carry the module's defining GO terms. Nothing enforces conformance CONTENT — check_conforms_to_module_node_references only resolves the anchor — so this passed CI. Added GO:0006360 (transcription by RNA polymerase I, DECREASED) to the POLR1A entry's Reduced Pol I rRNA Transcription node, which asserted conformance to a Pol I module at a Pol I node without binding the one term the module exists for. Added GO:0072332 (intrinsic apoptotic signaling pathway by p53 class mediator) to the p53-apoptosis node of both conformers, which previously bound only the generic GO:0006915 and so lost the distinction the module draws between the p53 arm and the p53-independent arm beside it.

    Optional (blue) gaps closed in the same push: CL:0000710 on the POLR1A tissue-selectivity and apoptosis nodes (both are named for neuroepithelium and bound only neural crest), CL:0011012 on its nucleolar-stress node (which carried no cell type at all), GO:0048701 on its depletion node, and CL:0011012 on the Treacher Collins apoptosis node.

    Declined one normalization, with the reason recorded in module notes. The POLR1A depletion node binds CL:0011012 where the module binds CL:0000333 migratory neural crest cell. That is a real distinction rather than a gap: the depleted pool includes premigratory crest lost to apoptosis, not only cells that reached the arches, so the general term is correct there. The reviewer explicitly flagged this as possibly deliberate and asked for it to be stated rather than normalized.

    Scope argument sharpened. The reviewer showed the stated exclusion reason was too weak: Mandibulofacial_Dysostosis_with_Microcephaly (EFTUD2) depletes the SAME cranial neural crest lineage through the same MDM2-p53 checkpoint and uses the same pifithrin-alpha rescue, so a lineage-based argument does not exclude it. Verified this against the entry, which reaches p53 by mis-splicing MDM2 to skip exon 3. Notes now exclude it on entry point instead, which is the criterion that survives a rename of this module around nucleolar stress.

    Therapeutic agent left unbound, with the reason recorded. CHEBI carries only CHEBI:229924 pifithrin-alpha hydrobromide, a salt the cited studies do not name, and NCIT returns nothing for pifithrin. Binding the salt would manufacture a narrower match than the sources support, so the slot stays empty per the no-CURIE-from-memory rule.

    Also corrected a claim this PR had introduced earlier. The Treacher Collins review_notes said its partial conformance was slot cardinality. Measurement contradicts that: 212 entries conform to two or more modules, hepatocellular carcinoma to nine, by conforming at distinct nodes. The real cause is that the entry has no nucleolar-stress node at all, with MDM2, RPL5 and RPL11 absent from the file, and its trigger node bundles the molecular rRNA defect with the cellular selectivity claim. Filed as issue 12087; the note now records the accurate reason.

    Validation after the changes: linkml-validate and linkml-term-validator clean on all three files; reference validator 25/25 for the module and 188/188 for the two disorders; check-entity-refs, check-causal-targets, check-enum-values, check-duplicate-keys and check-qualifier-terms clean; 3467 targeted pytest checks pass. All five added CURIEs were confirmed present in the committed enum and label caches with matching labels rather than written from memory.

  summary: 'Create: skeletal muscle mechanotransduction failure module'
  details: |
    New module with a five-node chain: reduced mechanical loading -> Z-disc/costamere mechanosensor dysfunction (filamin C-BAG3-CASA, integrin-FAK, DGKzeta-phosphatidic acid) -> impaired load-dependent mTORC1 activation (key conformance target) -> reduced myofibrillar protein synthesis -> skeletal muscle fiber atrophy. Treatments: progressive resistance training (NCIT:C62739) and neuromuscular electrical stimulation (NCIT:C93012, confirmed under NCIT:C25218).

    The mTORC1-to-synthesis edge carries a REFUTE item from the raptor-knockout study (PMID:30509128), and a KNOWLEDGE_GAP discussion records it. Conformers wired in the same change: Sarcopenia (Blunted Load-Induced mTORC1 Signalling -> central effector) and Myofibrillar_Myopathy (Chaperone-Assisted Selective Autophagy Failure -> sensor node, justified by PMID:23434281). No module_categories: no current category fits muscle physiology without overclaiming. Validated with just validate-module and count-verified-snippets (20/20).

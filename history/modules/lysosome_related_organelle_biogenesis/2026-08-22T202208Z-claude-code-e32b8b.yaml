  summary: 'Create module: lysosome_related_organelle_biogenesis'
  details: |
    Created the lysosome-related organelle biogenesis and transport module, the follow-up flagged when Griscelli_Syndrome_Type_2 was curated with no module that fit. Spans Hermansky-Pudlak (BLOC/AP-3 cargo delivery), Chediak-Higashi (LYST size and fission control) and Griscelli (RAB27A-melanophilin-myosin Va peripheral capture), which are three steps of one organelle life cycle rather than unrelated pathways. Oculocutaneous albinism is recorded as an explicit negative boundary: there melanin is never synthesized, whereas here it is synthesized and retained. The module records that its three conformers attach at DIFFERENT nodes on purpose - only Griscelli reaches the delivery central effector, because only there is the melanosome fully built and simply undelivered - rather than forcing uniform conformance the evidence does not support. All snippets verified as exact substrings of cached abstracts (10/10 module, 118/118 across the module plus the three wired entries); linkml-validate, just validate-terms and check-duplicate-keys pass.

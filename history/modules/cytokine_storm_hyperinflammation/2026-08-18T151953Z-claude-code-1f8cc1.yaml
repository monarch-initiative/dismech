  summary: 'Create: cytokine_storm_hyperinflammation mechanism module'
  details: |
    Created the cytokine_storm_hyperinflammation mechanism module: uncontrolled immune activation trigger -> unrestrained myeloid cytokine amplification -> IL-6-driven systemic cytokine storm (central effector, key conformance target) -> endothelial activation and capillary leak -> shock and multiorgan dysfunction. Carries the IL-6-axis blockade drug pattern (tocilizumab, target_mechanisms INHIBITS against the storm node).

    Scope decision: this was the module flagged as hardest to scope without becoming a grab-bag, so it is deliberately anchored on the myeloid IL-6 / endothelial arm only. Boundaries recorded in the description: the type I interferon arm belongs to innate_antiviral_interferon_response, the IL-1/inflammasome arm currently sits in gout_urate_crystal_inflammation, the age-associated low-grade version is inflammaging, and the coagulation lesion is thrombogenesis. Acute systemic hyperinflammation only; chronic tissue-restricted inflammation is out of scope. The unifying claim that makes this a module rather than a Grouping is convergence on unrestrained myeloid cytokine output, not merely a shared clinical picture.

    The tocilizumab treatment deliberately carries a PARTIAL evidence item recording that IL-6 blockade did not prevent delayed neurotoxicity in the humanized-mouse model while IL-1 receptor antagonism did. This is kept rather than smoothed over because it is the evidence that the storm has parallel arms and that this module models one of them.

    Evidence discipline: 5 PMIDs, all fetched and snippets taken from real cached abstracts; 14/14 verified by the reference validator. Three PMIDs recalled from memory during planning were discarded after verification as off-topic (PMID:28680578 BMPR2/glutamine, PMID:29907598 ALK neuroblastoma) or unusable; replacements were found by PubMed esearch rather than recall.

    Conformers wired: Hemophagocytic_Lymphohistiocytosis (2 nodes: impaired lymphocyte cytotoxicity at the trigger, macrophage activation at the amplifier), Multicentric_Castleman_Disease (1 node at the IL-6 storm).

    Validation: linkml-validate clean, linkml-term-validator passed, reference validator 14/14 verified, pytest conformance selection 2727 passed.

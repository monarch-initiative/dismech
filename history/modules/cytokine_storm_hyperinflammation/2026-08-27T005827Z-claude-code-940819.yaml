  summary: Record IFN-gamma axis boundary; drop HLH amplifier conformance
  details: |
    Addresses a Cursor Bugbot finding on PR #8872, verified as real before acting.

    Hemophagocytic_Lymphohistiocytosis "Uncontrolled T-cell and Macrophage Activation and Cytokine Storm" declared conforms_to this module's "Unrestrained Myeloid Cytokine Amplification" node, but binds GO:0032609 type II interferon production from cytotoxic T cells, whereas the module node binds GO:0032755 positive regulation of interleukin-6 production. The module is deliberately scoped to the myeloid IL-6 arm, so that edge asserted the wrong cytokine axis.

    HLH hyperinflammation is canonically IFN-gamma-driven - the agent approved for primary HLH is anti-IFN-gamma (emapalumab), not an IL-6-axis drug - so the conformance was wrong rather than merely imprecise. The amplifier conformance is removed. The trigger conformance is kept and is unaffected: "Impaired Lymphocyte Cytotoxicity" is exactly the failed-perforin-killing route the module's trigger node models, with its own cited evidence (PMID:26461150).

    The module description now records the corollary the finding exposed - a disease may conform at the trigger without conforming at the amplifier, because the axis it amplifies through may not be this one - naming HLH as the worked case and stating that an IFN-gamma amplification arm belongs in a separate module rather than as a widening of this one. That keeps a future curator from re-adding the edge.

    Validation: linkml-validate clean, reference validator 14/14, entity refs resolve, 2553 conformance/entry tests passed.

  summary: 'Grade both PMID:29808007 evidence items directness: INDIRECT'
  details: |
    Follow-on to 2026-08-29T160154Z-claude-code-39b9df, which recorded the PARTIAL migration on this module and stated that the resulting REFUTE item carries directness: DIRECT. Commit bdfee52bf changed that to INDIRECT, so this record supersedes that statement. History records are append-only, so the earlier record is left exactly as written - it accurately describes the session as it ran - and this one records the correction.

    The change: both evidence items on PMID:29808007 in the IL-6 Axis Blockade treatment now carry directness: INDIRECT. Previously the REFUTE item carried DIRECT and its SUPPORT sibling carried nothing at all, which read as a judgement distinguishing the two sentences when the two items in fact quote the same humanized-mouse experiment on the same drug.

    DIRECT was wrong on the merits, not merely asymmetric. CLAUDE.md defines INDIRECT as covering "a therapeutic response cited as validation of the mechanism it targets, or a result from an inverted or non-human model system". These items satisfy both clauses at once: a tocilizumab response measured in humanized mice, cited to establish that IL-6 blockade acts on this module's central effector node in human disease. That is two inference steps from the claim, not zero.

    Graded both rather than clearing both. An absent directness asserts that nobody has assessed the item, which CLAUDE.md names as the honest default for most of the KB - but it is no longer true here, and saying so is more informative than reverting to silence. Note the slot's population is small enough for this to matter: directness has four uses across the entire KB, two of them these, so a wrong exemplar is disproportionately likely to be copied by the next curator who greps for existing uses.

    Raised as a non-blocking review suggestion on PR #8872 and taken rather than deferred, for that reason.


  summary: 'Create: DNA damage checkpoint arrest module'
  details: |
    Created kb/modules/dna_damage_checkpoint_arrest.yaml, a five-node mechanism module for DNA-damage-checkpoint-enforced cell-cycle arrest of proliferating progenitor cells. The chain is DNA damage or replication stress in a proliferating progenitor (trigger) -> ATM-CHK2 and ATR-CHK1 checkpoint signal transduction (amplifier) -> checkpoint-enforced arrest of the progenitor at G1/S via p53-p21 and at G2/M via CHK1-CDC25C (central_effector, the key conformance target) -> progenitor compartment attrition by apoptosis, premature terminal differentiation and loss of clonogenic capacity (effector) -> hypoplasia or functional failure of the dependent tissue (consequence).

    The module's distinguishing claim is that the checkpoint machinery is intact and actively signalling, so the pathology comes from the arrest itself. The description states complementarity with cellular_senescence, senescence_tumor_suppression, telomere_attrition, genomic_instability_aging, genome_instability_mutation, evading_growth_suppressors, nucleotide_excision_repair_deficiency, stem_cell_exhaustion and pol1_nucleolar_stress_neural_crest_apoptosis, and notes records the conformance boundary (an entry whose checkpoint is lost, or whose arrest has committed to a senescent program, must not conform here).

    Two worked settings supply the two arms of the central effector: Fanconi anaemia (exacerbated p53-p21 G0/G1 arrest of haematopoietic stem and progenitor cells) and parvovirus B19 infection of erythroid progenitors (NS1-driven ATR-CHK1-CDC25C-CDK1 G2 arrest). No conformers were wired; that is a separate task.

    Ten PMIDs cited, all fetched with just fetch-reference and quoted from the cached bodies: 20965415, 16314342, 19230643, 22683204, 22770237, 28264028, 24711418, 14625883, 32412895, 33002135. Every node and every causal edge carries evidence.

    Validation: linkml-validate (Disease) no issues; just validate-terms passed; just count-verified-snippets 24/24; just validate-module-batch passed with 24 snippets and 24 titles checked and 0 issues; check-duplicate-keys, check-block-scalar-comments, check-entity-refs, check-causal-targets and check-enum-values all clean; term and enum caches normalized and check-term-cache-integrity and check-cache-order clean. Refetching PMID:22683204 and PMID:33002135 upgraded two pre-existing cache files (metadata and full text); kb/disorders/Fanconi_Anemia.yaml re-verified at 463/463 snippets afterwards.

    No term was written from memory. GO, CL and UBERON CURIEs and labels were read from cache/go/terms.csv, cache/cl/terms.csv, cache/uberon/terms.csv or from runoak against ols:go and ols:cl in the same step. GO:0044783 and GO:0071156 were considered and dropped because ols:go returns no label for either. No GO class exists for replication stress or for cell-cycle arrest as such; searches are recorded in the module notes.

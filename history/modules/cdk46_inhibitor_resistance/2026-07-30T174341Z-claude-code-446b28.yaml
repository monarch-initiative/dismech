  summary: 'Create: cdk46_inhibitor_resistance mechanism module (#6033)'
  details: |
    Created the cdk46_inhibitor_resistance mechanism module in response to the cross-cancer knowledge gap raised in issue #6033 (PMID:42398754, "Involvement of cyclins in the pathogenesis of cancer"), which flagged three unresolved gaps: context-dependent cyclin-CDK roles, isoform-specific functions, and mechanisms of resistance to cyclin-targeted therapy.

    Scope decision: the module models the THERAPY-RESISTANCE arm (gap 3), not a generic "cyclin-CDK proliferation" hallmark. A generic proliferation module would have duplicated the existing evading_growth_suppressors module, which already covers RB/p53-axis tumor-suppressor loss including cyclin D/CDK4-6 amplification. Precedent for a resistance-shaped module is dna_repair_synthetic_lethality, which likewise chains a dependency to a drug to an escape route.

    Six-node chain: Cyclin D-CDK4/6-RB Pathway Dependency (trigger) -> Pharmacologic CDK4/6 Inhibition and G1 Arrest (amplifier) -> two parallel escape arms, Cell-Cycle Bypass Lesion Selection and Upstream Bypass Signaling Reactivation (effectors) -> RB Pathway Bypass and E2F-Driven S-Phase Re-entry (central_effector, the key conformance target) -> Acquired CDK4/6 Inhibitor Resistance and Tumor Progression (consequence). Drug-target pattern: a Selective CDK4/6 Inhibitor Therapy treatment uses target_mechanisms/INHIBITS on the trigger node (palbociclib CHEBI:85993, ribociclib CHEBI:230905; abemaciclib is named in prose only because it has no CHEBI class).

    Evidence discipline: 15 evidence snippets across 9 PMIDs (30478914, 35304604, 30206110, 30807234, 27748766, 30537512, 33364954, 32289274, 42398754), each fetched with "just fetch-reference" and verified as an exact whitespace-normalized substring of the cached abstract/full text. Note that the reference validator reports "Total checks: 0" for module files (same behavior on the pre-existing renal_cystogenesis module), so snippet-substring verification was additionally performed explicitly against references_cache.

    Deliberate epistemic caution: the PALOMA-3 ctDNA analysis (PMID:30206110) found acquired RB1 mutation in only 4.7% of palbociclib-treated patients, all subclonal, and found NO acquired CCNE1/CDK4/CDK6 amplification, contradicting the strong cell-line evidence. That RB1 evidence item is curated as supports: PARTIAL rather than SUPPORT, the discrepancy is recorded as an open KNOWLEDGE_GAP discussion with two proposed experiments, and the module notes instruct curators not to assert any single bypass lesion as the dominant clinical resistance mechanism. A second KNOWLEDGE_GAP captures the cyclin/CDK isoform context-dependence gap (gaps 1 and 2 from the issue) with a proposed isoform-resolved dependency screen.

    Conformers wired: Chordoma "Cell-Cycle Dysregulation via CDKN2A Loss" (p16/INK4 route) and Mantle_Cell_Lymphoma "G1/S cell-cycle acceleration" (CCND1 t(11;14) route), both at the trigger node. Further conformers (HR-positive/PIK3CA-mutant breast cancer, malignant mesothelioma, NRAS-mutant melanoma, oral cavity SCC) are candidates for follow-up but were left untouched in this PR.

    Validation: linkml-validate (module + both conformers) passed; linkml-term-validator --labels passed; all snippets verified against references_cache.

  summary: 'Create: mitochondrial_translation_deficiency mechanism module'
  details: |
    Created kb/modules/mitochondrial_translation_deficiency.yaml, a five-node conserved mechanism module for combined oxidative phosphorylation deficiency from failure of the mitochondrial protein-synthesis apparatus. Chain: Mitochondrial Translation Machinery Lesion (trigger; mitoribosomal protein, translation factor, mt-tRNA/rRNA, tRNA-modifying enzyme, aminoacyl-tRNA synthetase, or mitoribosome-binding drug) -> Impaired Synthesis of mtDNA-Encoded OXPHOS Subunits (central_effector, the key conformance target) -> Combined Respiratory Chain Complex Deficiency (effector) -> Lactic Acidosis and Metabolic Decompensation / Tissue-Selective Energy Failure (consequences). A KNOWLEDGE_GAP discussion holds the unexplained tissue selectivity. Motivated by the corpus census: GO:0032543 mitochondrial translation was bound on pathophysiology nodes in 46 disorder entries, 42 of them on nodes conforming to nothing, with no module binding the term. Scoped complementary to complex_i_deficiency and complex_iv_assembly_deficiency (isolated single-complex lesions) and to mitochondrial_dysfunction (aging hallmark). Every PMID was found by PubMed search in this session rather than recalled, fetched with just fetch-reference, and every snippet copied from the cached abstract. Validation: linkml-validate No issues found; reference snippet audit 20/20 verified; linkml-term-validator Validation passed (GO:0061668 label read from OLS, the rest from cache/go/terms.csv). Conformers wired in the same change: 33 disorder entries, listed in the per-disorder history records.

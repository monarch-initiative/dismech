  summary: Qualify the penetration rule with compartment pH, replication rate, and
    an open gap
  details: |
    The thinnest module in kb/ by evidence count - two nodes, two evidence items - against 33 conformance links. It is also the module CLAUDE.md names as the gating module a disease conforms to alongside a target module, so it was carrying a lot of weight on a single claim: the intracellular niche excludes poorly penetrant drugs, therefore use a cell-penetrant one.

    That claim is right and incomplete in two ways, and both are now nodes.

    Subcellular Compartment and Vacuolar pH Gate Drug Activity (intrinsic_resistance; GO:0007042 lysosomal lumen acidification) records that penetration is necessary and not sufficient. The worked case is Coxiella burnetii in an acidified phagolysosome at pH near 4.5, where doxycycline arrives and is not bactericidal - which is why the remedy is a lysosomotropic adjuvant that changes the compartment rather than a different antibiotic, and why monotherapy relapsed after years of treatment. Mycobacterium tuberculosis gives the general form: an organism spread across several compartments needs an agent crossing several membranes. PMID:24073941, PMID:37709598.

    Slow Intracellular Replication and Prolonged Therapy (consequence; GO:0040007 growth DECREASED) records that the niche sets the duration: 18 months for a native valve and 24 for a prosthetic one in chronic Q fever, among the longest regimens for any bacterial infection, and already the shortened figure - it was five years before hydroxychloroquine was added. That last fact is what makes duration a mechanistic claim in this module rather than a dosing detail, since correcting the compartment shortened the regimen.

    Added a KNOWLEDGE_GAP discussion, gap_intracellular_accumulation_versus_activity, attached to the therapeutic node. The module's therapeutic node rests on the accumulation-efficacy correlation, and the cellular pharmacology literature says plainly that equating accumulation with activity is incorrect; the acidified-vacuole node is one worked reason why, and aminoglycoside nephrotoxicity is the mirror case where accumulation predicts toxicity rather than cure. Recorded so a conforming entry does not infer from accumulation alone that an untried agent will work. PMID:14711080, PMID:28639230.

    Extended the description and notes to state both qualifications and to ask a conforming entry to name its organism's compartment, since that is what decides whether the pH node constrains it.


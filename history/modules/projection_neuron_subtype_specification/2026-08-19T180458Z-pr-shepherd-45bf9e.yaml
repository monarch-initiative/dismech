  details: |
    PR Shepherd fix addressing the blocking ai4c-reviewer CHANGES_REQUESTED review on PR 8974.

    The reviewer's IMPORTANT finding was verified and confirmed before editing. PMID:38718796 (Martins-Costa et al., Cell Stem Cell 2024) is titled "ARID1B controls transcriptional programs of axon projection in an organoid model of the human corpus callosum" -- a human neural-organoid study -- and the quoted sentence is the abstract's background framing rather than data the paper generated. The evidence_source: HUMAN_CLINICAL tag on the Aberrant Long-Range Cortical Circuit Assembly node therefore misclassified the publication's evidence type. The same paper is already tagged IN_VITRO twice elsewhere in this very file (the Mis-Specified Long-Range Axon Target Selection node and the HUMAN_MODEL_MISMATCH discussion) and IN_VITRO in all five pre-existing KB usages, including on the character-for-character identical snippet in Coffin_Siris_Syndrome.yaml, so the file contradicted itself between nodes.

    Changes: (1) retagged that evidence item IN_VITRO and rewrote its explanation, which had claimed the citation anchors the node "in a human patient population" -- a claim an organoid paper's background sentence cannot carry; the explanation now states honestly that the sentence gives the clinical premise motivating the organoid model. (2) Added PMID:34706719 (Lee et al., BMC Med Genomics 2021, a 12-patient Korean SWI/SNF-related intellectual disability cohort) as the genuine HUMAN_CLINICAL anchor the node was missing, with the quantitative callosal finding as its snippet.

    The reviewer's suggested snippet was checked as an exact substring rather than trusted: it is verbatim in the cached abstract but wraps across a hard line break in references_cache/PMID_34706719.md, so it matches only under the validator's whitespace normalization.

    Validation: just validate passes schema and reference validation, with snippets rising from 20/20 to 21/21 verified. just validate-terms passes. just check-duplicate-keys and just check-title-snippets pass. Incidental references_cache mutations produced as a side effect of running the validator (reference_id re-quoting, full_text_attempted flags, and a 110-line PMC full-text append to PMID_34706719) were reverted so the commit carries only the KB change; the added snippet then re-verified 21/21 offline against the pristine cache.

    Reviewer suggestions deliberately not actioned, and why: the CLAUDE.md "Available modules" registry line (suggestion 3) is outside the curation-scope paths this shepherd may edit; the two snippet-quality suggestions and the FOXG1 conformance-breadth point (suggestions 1, 2 and 4) are curatorial judgement calls left to the PR author. The pre-existing Coffin_Siris_Syndrome PMID:31273213 mis-tag that the reviewer flagged as out of scope was left untouched.

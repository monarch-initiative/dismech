  summary: Create cytosolic_deglycosylation module for the CDDG pair
  details: |
    New mechanism module for the congenital disorders of deglycosylation, created because the two CDDG entries had no conformance target and the one mechanism they genuinely share was captured nowhere structural.

    Five nodes: Cytosolic Deglycosylation Enzyme Deficiency (trigger) -> Impaired Cytosolic Deglycosylation of Retrotranslocated Glycoproteins (amplifier, NGLY1 arm only) -> Cytosolic Glycan Catabolite Dysregulation (central_effector, key conformance target) -> Neurodevelopmental and Multisystem Dysfunction (consequence), plus an NGLY1-only side branch Loss of Deglycosylation-Dependent Substrate Activation (effector) for the NFE2L1/Nrf1 sequence-editing function.

    The central node was deliberately NOT named for free oligosaccharides. MAN2C1 deficiency accumulates free oligosaccharides; NGLY1 deficiency accumulates the glycoasparagine GlcNAc-Asn via the ENGase bypass. Naming the node for the catabolite pool lets both arms conform without either overstating its own catabolite. The node was renamed from an initial Free Oligosaccharide Pool Dysregulation for exactly this reason during authoring.

    Guardrails written into notes: the ERAD/retrotranslocation node is NGLY1-only and a MAN2C1-type conformer must not attach there; the NFE2L1 branch requires direct evidence of a deglycosylation-dependent activation step and must not be attached on a proteasome or oxidative-stress phenotype alone. Boundary against congenital_disorder_of_glycosylation (synthesis vs clearance), lysosomal_substrate_accumulation (cytosolic and explicitly non-lysosomal here) and loss_of_proteostasis (specific enzymatic step, not generalized degradative collapse). Not an Xogenesis module: a normal catabolic route fails, nothing pathological is formed. GO and CL bindings only, per module convention.

    Carries a KNOWLEDGE_GAP on whether the catabolite pool is pathogenic or merely an accessible readout of a route failing elsewhere, and a HUMAN_MODEL_MISMATCH on ENGASE inhibition - Engase deletion rescues Ngly1-null mouse embryonic lethality, an endpoint no human patient has.

    Conformers wired: NGLY1-CDDG at four nodes including the Nrf1 branch, MAN2C1-CDDG2 at three. Registered in the CLAUDE.md module registry.

    Validation: just validate PASS; just validate-terms PASS; just count-verified-snippets 16/16 verified. Every conforms_to reference in kb/ resolves to a real module node.

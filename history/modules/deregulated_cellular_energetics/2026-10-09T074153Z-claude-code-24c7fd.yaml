  summary: Record that this hallmark is read rather than attacked
  details: |
    The module described the Warburg phenotype in full and said nothing about what it is used for clinically, which leaves a reader to infer a therapeutic vulnerability from the phenotype's prominence. The honest answer is the opposite and is worth stating.

    Added Glycolytic Flux as a Pharmacodynamic Readout (consequence; GO:0006096 glycolytic process DECREASED), downstream of the Warburg node. Because the flux is maintained from upstream rather than self-sustaining, inhibiting the driver collapses glucose uptake: small molecules disrupting PI3K signalling lower tumour FDG uptake, and in patients response to therapy is predicted by whether glucose metabolism is disrupted as measured by FDG-PET. So the hallmark is an early non-invasive reporter that a driver-directed agent is engaging its target, available before a size response - not a dependence to attack.

    Two consequences recorded for conforming entries: an FDG-PET finding belongs against this node as a readout of the upstream driver rather than as evidence of drugable glycolysis dependence, and a glycolysis-directed agent should not be hung here on the strength of the Warburg phenotype alone, because the target the dependence implies sits in sustaining_proliferative_signaling.

    The role is consequence rather than therapeutic_vulnerability deliberately: what is being measured is engagement of a target elsewhere. Evidence is two sentences from PMID:19460998, which the module already cited for a different claim.


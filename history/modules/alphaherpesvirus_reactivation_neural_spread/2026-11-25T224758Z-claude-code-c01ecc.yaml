  summary: 'Create: Alphaherpesvirus Reactivation and Neural Spread module'
  details: |
    New mechanism module factoring the conserved alphaherpesvirus (HSV-1/2, VZV) reactivation-and-neural-spread pathophysiology: ganglionic latency -> reactivation and lytic replication -> anterograde axonal transport (key conformance target) -> lytic epithelial infection -> ganglionic neuronal injury/neuropathic sensitization. Complementary to viral_latency_reservoir_persistence (the pharmacologic gating module). Evidence from the VZV prototype (PMID:27188665) and an alphaherpesvirus-generic directional-spread review (DOI:10.3390/v5020678). Validated with validate-module-batch (10 snippets exact-matched), snippet-length, name-collisions, duplicate-keys, enum-values, block-scalar-comments, causal-targets, title-snippets.

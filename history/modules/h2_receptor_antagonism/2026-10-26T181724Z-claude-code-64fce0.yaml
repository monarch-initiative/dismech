  details: |
    Applied the blocking finding and two of the three suggestions from the first review of PR #15689.

    Blocking. The node 'Nocturnal Acid Breakthrough Addressed by Adding an H2 Antagonist to a Proton Pump
    Inhibitor' and its treatment both rested on one quote -- that adding an H2RA to a PPI can be useful for
    controlling GERD over the short term -- which says nothing about night-time pH. The node's defining claim
    was therefore uncited, and both descriptions said 'some patients on a proton pump inhibitor', which is
    broader than the source allows. The sentence that carries the claim sits immediately before the one
    quoted and was not used: Helicobacter pylori-negative high-grade GERD with resistance to the inhibitor.
    It is now a SUPPORT item on both the node and the treatment, each explanation saying which half of the
    claim it carries, and both descriptions are narrowed to that population. The error was mine in both
    directions: the sentence was read during research and not quoted, and the description generalised past it.

    Suggestion taken: the module's description and notes referred to h1_receptor_antagonism as an existing
    sibling, which would have been false if this module merged first. Both now name it without asserting it is
    present, and the description says to check kb/modules/ rather than assuming.

    Suggestion taken: the notes opened with 'Scope and grading decisions recorded for the next curator' and
    described a worklist item as 'now met as predicted'. Both are process narration of the kind CLAUDE.md
    rules out for notes. The framing is gone; every fact under it is kept -- why the transducer is bound here
    and not in the H1 module, why ranitidine and nizatidine are unbound, the INDIRECT grading of the effector
    chain, the tolerance node's negative half, and the three entries that bundle H1 and H2 drugs.

    Validation: validate-module-batch 16/16 snippets verified against abstracts only and 16/16 titles;
    duplicate-keys, entity-refs, causal-targets, enum-values, block-scalar-comments and qualifier-terms clean.

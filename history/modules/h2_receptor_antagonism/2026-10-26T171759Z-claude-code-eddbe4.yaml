  summary: 'Create: H2 Receptor Antagonism Module'
  details: |
    New drug-mechanism module for the GPCR project (projects/GPCR.md Workstream A), the H2 half of
    the pair the project page's Workstream A table originally listed as one candidate with H1. Seven nodes:
    antagonist occupancy of H2 on the parietal cell, loss of the histamine-driven adenylate cyclase and cAMP
    arm, reduced H+/K+-ATPase-mediated acid secretion as the key conformance target, raised intragastric pH
    and mucosal healing, tolerance on repeated dosing, the nocturnal-breakthrough add-on, and the class's CNS,
    cardiac, endocrine and drug-interaction effects. Two treatments and one KNOWLEDGE_GAP discussion.

    Unlike h1_receptor_antagonism this module names a transducer, because a source states it: the Shamburek
    and Schubert review says histamine's parietal-cell effect is mediated by adenylate cyclase activation and
    cAMP generation, so GO:0007189 and GO:0006171 are bound. The H1 module left its transducer unasserted
    because no abstract cited there stated the coupling; the difference is in the sources, not in the biology
    being differently well understood. Both modules' notes record this.

    Grading: the effector chain is INDIRECT on that review throughout, because it describes the intact chain
    rather than measuring the blocked state. The tolerance node is the one DIRECT step, because its source
    measured the diminishing antisecretory effect, and it is graded HUMAN_CLINICAL rather than OTHER because
    the finding it synthesises is a human volunteer measurement. The tolerance evidence carries its own
    negative half, quoted rather than dropped: duodenal ulcer patients do not develop significant tolerance
    on the sparse data available, so the node is scoped to where its source puts it.

    Ranitidine is deliberately not bound as an agent although the cited 1992 review names it as first-line.
    PMID:35696227 is cited on the treatment for the reason, in the review's own terms -- recalls and
    registration suspensions, not a restated worldwide withdrawal. That is a contaminant and manufacturing
    matter rather than a consequence of H2 blockade, so it is treatment-level evidence and not a pathograph
    node. Nizatidine is left unbound as a deliberate silence: CHEBI:7601 exists, so the omission is not a
    missing lookup, but no source cited here establishes its current availability.

    Every CURIE was looked up in the step it was written: hgnc:5183 against the HGNC REST API, CHEBI:3699 and
    CHEBI:4975 against OLS, and CL:0000162, UBERON:0000945, GO:0001696, GO:0006171 and GO:0007189 against the
    committed term caches.


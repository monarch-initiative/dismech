  summary: 'Create: CGRP Receptor Antagonism Module'
  details: |
    Sixth GPCR drug-mechanism module in the Workstream A queue of projects/GPCR.md, and the decided half of the open question that page recorded about whether CGRP belongs with the 5-HT1B/1D triptan module. It does not: the cited pharmacology review separates the drugs that bind the CGRP peptide from the receptor antagonists, and the project rule is one receptor family plus one direction of action per module. Five nodes, trigger to central effector to an acute and a preventive consequence, plus one adverse node. Two treatments, acute and preventive. One KNOWLEDGE_GAP discussion on AMY1 off-target antagonism, whose clinical significance the cited review states is unknown and for which selectivity data are missing. Conformers are Migraine, through its named gepant treatment, and pseudotumor_cerebri, through its erenumab treatment, which makes the module indication-independent rather than migraine-only. Five references, 16 evidence items, all snippets and titles verified against the abstract.

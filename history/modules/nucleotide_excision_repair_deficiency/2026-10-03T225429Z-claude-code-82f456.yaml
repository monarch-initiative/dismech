  summary: 'Create: Nucleotide Excision Repair Deficiency Module'
  details: |
    Created kb/modules/nucleotide_excision_repair_deficiency.yaml in response to issue #11574 (raised in review of #11573). Nine nodes: a lesion-formation trigger (no GO binding by design; the input is chemistry and exposure), three alternative loss-of-function entry nodes (global-genome recognition XPC/DDB2; transcription-coupled initiation ERCC6/ERCC8/UVSSA; core verification and dual incision XPA/ERCC3/ERCC2/GTF2H5/ERCC5/ERCC4/ERCC1), the key conformance target Persistent Unexcised DNA Lesions, and two effector arms ending in Mutagenesis-Driven Carcinogenesis and Neurodegeneration and Segmental Progeroid Degeneration. A KNOWLEDGE_GAP discussion hosts the UVSS-versus-Cockayne severity question and points at the hypotheses curated in UV-Sensitive_Syndrome rather than modelling repair-independent CSA/CSB functions. GO:0033683 (NER DNA incision) was checked and found obsolete, so the core node binds GO:0006294 preincision complex assembly plus GO:0006289. Thirteen references fetched with just fetch-reference; five PMIDs recalled from memory resolved to unrelated papers and were discarded before use, which is the reason the identifiers were looked up rather than written. Validation: linkml-validate, linkml-term-validator (added GO:0070911, GO:0000715, GO:0006294 to the GO cache), 33/33 snippets verified against cached abstracts, check-reference-titles, check-entity-refs, check-causal-targets, pytest test_module_file.

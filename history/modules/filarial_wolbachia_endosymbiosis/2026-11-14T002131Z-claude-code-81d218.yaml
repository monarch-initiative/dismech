  summary: 'Create: filarial Wolbachia endosymbiosis module'
  details: |
    Created the module factored out of the shared Wolbachia mechanism in Onchocerciasis and Lymphatic filariasis (issue #6309). Six nodes: obligate endosymbiosis (trigger) -> release of Wolbachia and its lipoprotein on filarial death (amplifier) -> TLR2/6-dependent innate activation (central_effector, the key conformance target) -> neutrophil recruitment and NETosis (effector) -> Wolbachia-dependent inflammatory tissue pathology (consequence), plus a therapeutic_vulnerability node carrying the macrofilaricidal effect of depletion, which the doxycycline treatment's target_mechanisms points back at. Nine references fetched with just fetch-reference; all 18 snippets verified exact. The notes record three caveats: Loa loa and Mansonella ozzardi lack the symbiont so must not conform; the TLR and neutrophil steps rest on murine corneal models and human in vitro work; and the 2002 Science TLR4 attribution was superseded by later TLR2 knockout work, so that paper is cited only for Wolbachia being the inflammatory agent. A KNOWLEDGE_GAP records that the human evidence for the chronic lesions being Wolbachia-dependent is a treatment response and does not establish reversibility.

  summary: 'Create: Schwann Cell Myelin Maintenance module'
  details: |
    New mechanism module for the demyelinating arm of hereditary peripheral neuropathy, created after auditing the Mendelian PNS entries and finding that CMT1, CMT4 and HNPP each carry Schwann-cell-intrinsic myelin nodes with no module to check them against, and could only conform at the generic axon-centred node of peripheral_axonal_degeneration.

    Chain: myelin gene dosage or structural lesion in Schwann cells -> Schwann cell proteostatic stress and myelin protein mistrafficking -> dysmyelination and segmental demyelination of peripheral nerve (central_effector, key conformance target) -> nerve conduction slowing and conduction block -> secondary axonal loss and length-dependent deficit. A parallel branch carries the tomaculous/onion-bulb biopsy signature. The consequence node itself conforms to peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination, so the hand-off between the two modules is explicit rather than implied.

    Carries the UPR-modulator drug-target pattern - IFB-088/Sephin1/icerguestat INHIBITS the proteostatic-stress node, PMID:35501630 - plus a HUMAN_MODEL_MISMATCH discussion recording that the whole proteostatic arm and its drug pattern are transgenic-mouse-only, that mouse g-ratio rescue is not evidence of human disability benefit, and that conformers must not inherit it as a treatment.

    Deliberately NOT an Xogenesis module: the terminal output is failure of a normal process, myelination, not formation of a pathological entity. Acquired demyelinating neuropathy such as CIDP and Guillain-Barre, and central hypomyelination, are explicitly scoped out.

    Conformers wired in the same change: Charcot-Marie-Tooth_Disease_Type_1, Charcot-Marie-Tooth_Disease_Type_4, Hereditary_Neuropathy_with_Liability_to_Pressure_Palsies, Congenital_Hypomyelinating_Neuropathy.

    Validation: linkml-validate clean; linkml-term-validator clean; 15/15 snippets verified against cached references via just count-verified-snippets. Every PMID cached with just fetch-reference before use.

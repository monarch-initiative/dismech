  summary: 'Review: fix evidence-claim mismatches and conformance altitude'
  details: |
    Coherency and evidence review pass over the module as created earlier in this branch. Four defects found and fixed.

    1. Onion-bulb evidence was out of the module's own scope. The remodeling node cited PMID:8834544, a case of longstanding ACQUIRED demyelinating polyneuropathy, while the module notes explicitly scope acquired demyelinating neuropathy out. Replaced with PMID:34996390, which reports onion bulb formations on sural nerve biopsy in a genetically confirmed PMP22-duplication patient - inside the module's trigger scope.

    2. A statement of uncertainty was being read as mechanistic support. The central effector cited PMID:31586623's sentence that PMP22's precise role in myelin formation is still under active investigation, with an explanation claiming it placed the gene's normal function. Moved to the trigger node, where the same snippet legitimately supports Schwann-cell developmental induction, and rewrote the explanation to claim only that and to record the uncertainty the sentence actually states.

    3. The treatment's entry-level evidence did not name the agent. Replaced with the sentence naming Sephin1/IFB-088/icerguestat and the three mouse models it was administered to, so the evidence identifies what the treatment entry describes.

    4. Conformance ran specific-to-generic instead of generic-to-specific. The module bound CL:0000218 myelinating Schwann cell while all six existing conformers use the parent CL:0002573 Schwann cell, so no conforming node overlapped the module on cell type. Changed the module to the generic term and added a notes stanza saying conformers may specialize to CL:0000218.

    Validation after the pass: linkml-validate clean; linkml-term-validator clean; validate-references 15/15 snippets verified.

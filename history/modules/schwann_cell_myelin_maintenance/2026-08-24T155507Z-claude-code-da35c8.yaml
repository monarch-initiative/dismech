  summary: Add fifth trigger lesion class after review finding 5
  details: |
    Review finding 5 on PR #9381, and the reviewer was right.

    The trigger node enumerated exactly four lesion classes - dosage, misfolding-prone structural missense, gap-junction loss, transcription-factor loss - while three CMT4 nodes (MTMR2/SBF2 phosphoinositide, SH3TC2 endosomal recycling, NDRG1/PRX axon-glia) were attaching to it. None of the four covered a membrane-trafficking or endosomal-recycling lesion, so the module documented a narrower trigger than it was actually receiving.

    This is a residue of the earlier fix in this branch: those three nodes had been pointed at the ER/UPR proteostasis amplifier, were correctly moved to the trigger on the grounds that they are trigger-altitude entry points, and the trigger's own enumeration was not updated to match. The module description already said 'the recessive Schwann-cell trafficking genes of CMT4'; the node did not.

    Added class (5), Schwann cell membrane trafficking and phosphoinositide handling, naming MTMR2, SBF2, SH3TC2, NDRG1, PRX and FIG4, and recorded in the node text that it was added after review so the history of the enumeration is visible. Added a notes paragraph on trigger granularity: the five classes are deliberately one node because the module's claim is about convergence, and a conformer needing to distinguish the trafficking arm downstream should extend the remodeling branch rather than split the trigger.

    Validation: schema clean, term validation clean, 15/15 snippets verified.

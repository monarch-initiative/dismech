  summary: Add nmrHas2 transgenic mouse rescue arm and naked mole-rat comparative
    model
  details: |
    Added two models. The nmrHas2 transgenic mouse (PMID:37612507) is curated with RESCUES links on Chronic Low-Grade Sterile Inflammation and on Age-Related Morbidity and Mortality, and is the only intervention arm this module carries for the chain as a whole: overexpressing naked mole-rat hyaluronic acid synthase 2 attenuated inflammation across multiple tissues and produced lower spontaneous and induced cancer incidence, extended lifespan and improved healthspan. The naked mole-rat itself is added as a comparative negative model with FAILS_TO_RECAPITULATE on the outcome node (PMID:29364116) plus the hyaluronan characterization the transfer experiment rests on (PMID:23783513). Limitations record that the benefit is attributed by the authors to high-molecular-mass hyaluronan rather than to the naked mole-rat gene, that transgenic overexpression is not a physiological human range, and that part of the survival benefit may run through cancer resistance outside this module. A HUMAN_MODEL_MISMATCH discussion records the transfer question with two proposed experiments. Validated with linkml-validate, term validation, reference validation (12/12 snippets) and the offline KB gates.

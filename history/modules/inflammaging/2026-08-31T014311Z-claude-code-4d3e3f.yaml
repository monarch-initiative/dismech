  summary: Add knowledge gaps to inflammaging module
  details: |
    Added three KNOWLEDGE_GAP discussions to the inflammaging module, and strengthened the TNF biomarker entry. Gaps: (1) knowledge_gap_inflammatory_markers_vs_chronological_age - hsCRP and TNF-alpha are recommended aging biomarkers but did not reach consensus agreement that they predict biological age better than chronological age, which qualifies the PROGNOSTIC readouts curated in this module as mortality-risk claims rather than rate-of-aging claims; (2) knowledge_gap_composite_vs_single_inflammaging_markers - the field prefers composite biomarkers and has no consensus on the right combination, which is both a scientific gap and a structural one for dismech since a composite index is a model over features rather than an analyte and does not fit the Biochemical class cleanly; (3) knowledge_gap_marker_or_driver_cfmtdna_iggg0 - cf-mtDNA and IgG-G0 are both marker and mechanism, so an intervention that lowers them cannot be told apart from one acting only on the assay. Newly cached: PMID:39708300 (2025 Delphi expert consensus on biomarkers of aging for intervention studies) and PMID:32439659 (Science 2020, T-cell mitochondrial failure driving inflammaging). Note on process: the gap originally intended here was the Franceschi 2018 claim that the DNA-methylation-age/inflammaging relationship had not been investigated. A PubMed check found 51 papers on epigenetic age acceleration and inflammaging, so that claim is stale and was NOT recorded; the gaps above are grounded in the 2025 consensus instead. The TNF entry gained interventional mouse evidence (TNF blockade partially rescues premature aging in Tfam-deficient T-cell mice), and its note now records that the mouse interventional evidence is stronger than the human associational evidence for this marker. Validation: just validate with 24/24 snippets verified, validate-terms, check-entity-refs, check-duplicate-keys and whole-KB check-snippet-grading all pass; snippets independently confirmed as literal exact substrings of the cached references.

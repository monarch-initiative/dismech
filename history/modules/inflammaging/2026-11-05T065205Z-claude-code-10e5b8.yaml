  summary: Add RetiME retinal mortality estimator as a computational model
  details: |
    Added RetiME (Xu et al. 2026, Nature Biomedical Engineering, DOI:10.1038/s41551-026-01822-4), a deep-learning predictor of 13-year mortality from a fundus photograph, under computational_models with model_type MACHINE_LEARNING. It is linked only to the Age-Related Morbidity and Mortality node as PARTIALLY_RECAPITULATES, fidelity MODERATE, model_scale ORGANISM, with typed PROXY_QUANTITY and POPULATION_MISMATCH divergences, following the EpInflammAge precedent in the same module. It is not linked to the inflammation node because the CRP and proteomic signals are associations with a predictor trained on death. The biochemical route of the design decisions section 12 interim convention was rejected because the only assay term available, NCIT:C147467 Eye Fundus Photography, is an imaging procedure rather than a biomarker. No evidence block: the DOI fetch returned no abstract or full text and the paper has no PMID yet. Design decisions section 12 and the biomarkers-of-aging gap analysis report were updated to record RetiME as the first imaging-derived, outcome-trained estimator. Validated with just validate-module-batch and the model-link structural checks.

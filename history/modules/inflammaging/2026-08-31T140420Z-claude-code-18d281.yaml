  summary: Add gerotherapeutic treatments (metformin, senolytics) with mechanism links
  details: |
    Added the module's first treatments as part of the geroscience drug-repurposing project (projects/GEROSCIENCE_REPURPOSING.md), which brings the nine FDA-approved candidate gerotherapeutics prioritized by Kulkarni et al. 2022 (PMID:35343051) into the hallmark-of-aging modules.

    Metformin links to 'Chronic Low-Grade Sterile Inflammation' (INHIBITS), evidenced by Bharath et al. 2020 (PMID:32402267), which shows metformin reverses the age-associated Th17 inflammaging profile by restoring autophagy and mitochondrial bioenergetics in human CD4+ T cells, plus the Kulkarni et al. 2020 hallmarks review (PMID:32333835).

    Dasatinib plus quercetin links to two nodes: 'Age-Associated Inflammatory Stimuli' (INHIBITS, senescent-cell SASP is the first stimulus that node names) and 'Age-Related Morbidity and Mortality' (INHIBITS). Evidence from Xu et al. 2018 (PMID:29988130) is deliberately split into two items with different evidence_source values, because the human adipose-explant result is IN_VITRO while the aged-mouse survival result is MODEL_ORGANISM; grading one quote under both would be the defect check-snippet-grading exists to catch.

    The Kulkarni 12-point prioritization scores are recorded in treatment description prose and the project file, not as evidence items: the ranking is a prioritization snapshot, not a mechanistic claim, and its mechanism rows are tabulated from primary studies that are cited directly instead.

    Validation: linkml-validate (Disease) clean; linkml-term-validator clean; all snippets verified against the local reference cache; entity refs and duplicate-key checks clean.

  summary: Add geroscience endpoint knowledge gap; refine TNF per TAME panel
  details: |
    Added knowledge_gap_surrogate_for_which_geroscience_endpoint to the inflammaging module and refined the TNF entry, following meeting notes naming the geroscience clinical endpoint layer. The gap records that the module's CANDIDATE_SURROGATE and MONITORING contexts point at nothing, because dismech has no representation of the clinical endpoints aging biomarkers would be surrogates for. It names the three endpoint families and their flagship trials: disability-free survival as the ASPREE primary composite of death, dementia and persistent physical disability [PMID:30221596]; multimorbidity as the TAME design [PMID:30151729]; and the deficit-accumulation frailty index operationalized as a 36-item index in SPRINT [PMID:26755682] and used in Look AHEAD. It also records that the step making a surrogate legitimate, namely that a treatment-induced change in the marker predicts a change in the endpoint, is unestablished for all of these markers, and that kb/surrogate_endpoints/ has no aging row for regulatory_endpoint_refs to target. TNF entry refinement: the TAME Biomarkers Workgroup selected TNF-alpha receptor I or II rather than the ligand curated here, because the soluble receptors are more stable analytes; the note now records that sTNFR-I/II should supersede or accompany the current binding, and the TAME panel is cited on the readout. Newly cached: PMID:30151729 TAME Biomarkers Workgroup, PMID:30221596 ASPREE disability-free survival, PMID:26755682 SPRINT frailty index, plus PMID:30221595, PMID:27304507 and PMID:33745805 fetched as background. Validation: just validate with 29/29 snippets verified, validate-terms, check-entity-refs, check-duplicate-keys, and whole-KB check-snippet-grading, check-title-snippets and check-empty-snippets all pass; 13763 targeted pytest KB tests pass; snippets independently confirmed as literal exact substrings.

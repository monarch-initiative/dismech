  details: |
    Review response (PR #10283, ai4c-reviewer finding 6). Rewrote the Lewkiewicz2019 model description, which had outrun its source. The previous text asserted that peripheral homeostatic proliferation takes over maintenance of the naive T cell pool and that total cell numbers are partly preserved; neither claim appears in the cited abstract (PMID:31201663). The replacement follows the abstract, which attributes the fall in diversity primarily to diminished thymic output and the resulting loss of small immunoclones. Descriptions are not snippet-validated, so nothing automated would have caught this.

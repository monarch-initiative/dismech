  summary: 'Address ai4c-reviewer feedback on killifish animal model (PR #10267)'
  details: |
    Responded to the blocking review finding on PR #10267 that the 'Age-Related Morbidity and Mortality' link was not supported by its evidence: its only snippet was the study's framing sentence about the value of killifish for developing interventions, which does not bear on morbidity or mortality, and it was the sole link in the tranche with no readouts. Rather than dropping the link, grounded it in a measured endpoint: added a 'Tissue fibrosis in the aged hematopoietic organ' readout (Sirius Red/Fast Green collagen staining, three 7-week-old versus three 16-week-old fish) and moved the link-level evidence to the same finding. Rewrote description and limitations to say the link now reaches organ morbidity and NOT mortality, and to record the small sample size and kidney-marrow confinement. Also addressed suggestion 3: the 'Chronic Low-Grade Sterile Inflammation' link-level evidence was a background framing sentence and is now the authors' cross-method summary of the measured result; added an 'Acute-phase proteins in aged plasma' readout naming the complement proteins and coagulation factors behind that signal. All new snippets exact-quoted from the cached full text and verified (13/13).

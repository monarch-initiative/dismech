  summary: Add human cortical organoid aged-monocyte coculture NAM to inflammaging
  details: |
    Added the module's first experimental_models (non-animal model) entry and its only entirely-human model: a human cortical organoid microphysiological analysis platform cocultured with primary blood monocytes from aged versus young donors (PMID:35908805, Ao et al., Adv Sci 2022). Full text was cached, so snippets were sliced programmatically from the cache rather than transcribed.

    Modeled as CO_CULTURE / namo:CoCulture, following the organoid-plus-immune-cell precedent in kb/modules/drug_induced_liver_injury.yaml. Four modeled_mechanisms links, one per module node, so the model runs the whole stimulus-to-consequence chain in one system with donor age as the sole variable:
    - Age-Associated Inflammatory Stimuli (PARTIALLY_RECAPITULATES, MODERATE): aged donor monocytes instantiate the immune-cell-dysregulation stimulus class the node enumerates; readout is increased infiltration plus induction of aging-associated markers including p16 (GO:0030595, GO:0090398). Limitation records that only one of the seven enumerated stimulus classes is represented, n=3 donors per group, and that the paper states its donor age thresholds inconsistently between abstract (20-30 / over 60) and methods (under 35 / over 65).
    - Chronic Low-Grade Sterile Inflammation (PARTIALLY_RECAPITULATES, MODERATE): increased proinflammatory cytokine secretion (MCP-3, IL-1 beta, TNF-alpha by ELISA) with no pathogen present, so sterility is a property of the experiment (GO:0050729).
    - Systemic Propagation via Altered Intercellular Communication (PARTIALLY_RECAPITULATES, MODERATE): increased MCP-3 as a feed-forward recruitment signal plus increased prostaglandin E2 signaling, between two separately sourced human compartments (GO:0030595).
    - Age-Related Morbidity and Mortality (PARTIALLY_RECAPITULATES, LOW): neurons adjacent to infiltrated aged monocytes show apoptotic morphology (GO:0006915). Fidelity LOW because morbidity and mortality are organism-scale endpoints an organoid cannot reach and the observation is qualitative morphology rather than quantified cell death.

    Two limits are recorded on every link and in the module notes: the coculture is short (roughly one to three days), so the model addresses initiation of the chain rather than the chronicity that defines inflammaging; and the responding tissue is young by construction, which is the authors' own stated limitation that their hESC-derived organoids have long telomeres and do not reflect the senescent phenotypes of an aged brain.

    The model is not a disease model and does not resolve this module's existing HUMAN_MODEL_MISMATCH discussion, which concerns the naked mole-rat hyaluronan adaptation; conforming disorder entries do not inherit its links. Module notes updated accordingly.


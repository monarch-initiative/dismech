  summary: Add biomarker panel to inflammaging module
  details: |
    Added a five-marker biochemical block with BiomarkerReadout links, closing the module's biomarker gap identified in docs/reports/biomarkers-of-aging-gap-analysis-2026-08-31.md. Markers: circulating IL-6 [NCIT:C20451], high-sensitivity CRP [NCIT:C60651], TNF [NCIT:C20535], circulating cell-free mitochondrial DNA [NCIT:C28512], and agalactosylated IgG N-glycans [NCIT:C128469]. Sources newly cached: PMID:30046148 Franceschi 2018 Nat Rev Endocrinol, the canonical inflammaging review and origin of the biomarker-class framing; PMID:10335721 Harris 1999, prospective IL-6/CRP mortality association; PMID:24470107 Pinti 2014, cf-mtDNA; PMID:22353383 Dall'Olio 2013, N-glycomics. IL-6 carries two readouts to demonstrate one marker serving distinct contexts of use: READOUT_OF the inflammation node under MONITORING, and PREDICTS the outcome node under PROGNOSTIC. TNF is graded directness INDIRECT because the curated evidence is co-elevation with DAMP burden rather than an independent prospective association; a note records this and asks for a dedicated source before TNF is treated as independently prognostic. cf-mtDNA and IgG-G0 are both marker and mechanism, noted in each entry. The cf-mtDNA entry documents why NCIT:C28512 was chosen over NCIT:C128274 - neither term covers both molecule and compartment, so the compartment is carried in preferred_term. Validation: just validate with 18/18 snippets verified, validate-terms, check-entity-refs, check-duplicate-keys, check-snippet-grading, check-title-snippets, check-snippet-length, check-folded-hyphens and check-empty-snippets all pass; 13764 targeted pytest KB tests pass. Snippets were additionally verified as literal exact substrings of the cached abstracts, after correcting a TNF-alpha spelling to the Greek character the source actually uses.

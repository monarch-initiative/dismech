  summary: 'Create: Neuroinflammation and Glial Activation Module'
  details: |
    Created kb/modules/neuroinflammation_glial_activation.yaml to close AOP-Wiki gap KE 188 (issue #10368, gap 3: reactive microglial/astrocytic activation as a reusable process) and to deliver item 3 of the #6189 autophagy_senescence_inflammasome_axis reconciliation (the 'glial-mediation gap': decide whether a senescent/reactive glial state is a new module node or handled by substituting glial cell types on an existing cellular_senescence conformance). Decided in favor of a new, standalone module rather than routing through cellular_senescence: AOP-Wiki's KE 188 is its own Key Event with two cell-type components (microglial cell, astrocyte) rather than a senescence Key Event, and Escartin et al. (PMID:33589835) explicitly caution against extending the senescence concept to largely post-mitotic astrocytes. The module chain is trigger (Danger Signal Release into the CNS Parenchyma) -> amplifier (Glial Pattern-Recognition Receptor Priming and Danger-Signal Sensing) -> central_effector (Reactive Microglial and Astrocytic Activation, the KE 188 conformance target, binding CL:0000129 + CL:0000127 on one node) -> effector (Proinflammatory Cytokine and Chemokine Release) -> consequence (Bystander Neuronal and Oligodendroglial Injury). All 14 evidence snippets verified exact-substring against cached references (PMID:33239064 Kwon and Koh 2020; PMID:28099414 Liddelow et al. 2017; PMID:33589835 Escartin et al. 2021; PMID:25792098 Heneka et al. 2015, abstract-only cache; PMID:35978311 Singh 2022) after independently verifying titles by fetching -- two initially recalled PMIDs (29469568, 29561344) resolved to unrelated papers on fetch and were discarded rather than used. Explicitly complementary to, and does not re-derive, nlrp3_inflammasome_activation (priming/assembly), cellular_senescence and inflammaging (SASP/chronic accumulation), and glutamate_excitotoxicity (astrocytic glutamate clearance); reasoning recorded in the module notes field, plus an OPEN_QUESTION discussion on the unresolved acute-reactive-vs-senescent-glia boundary. Wired conforms_to onto the pre-existing bare 'Neuroinflammation' pathophysiology node in Huntington_Disease, Pick_Disease, and Alzheimer_Disease (none previously conformed to any module at that node). No treatments block: candidate microglial modulators (e.g. minocycline) lacked robust clinical-outcome evidence in the surveyed literature, so the drug-target pattern was deliberately deferred rather than forced. Validated with linkml-validate, linkml-term-validator, the reference validator (14/14 snippets verified), check_duplicate_yaml_keys, check_enum_values, check_entity_refs, check_causal_targets, and check_qualifier_terms -- all pass.
- type: EDIT
  outcome: changed
  sections:
  - pathophysiology
  - notes
  summary: 'Address PR #11898 review round 1'
  details: |
    Addressed the automated review on PR #11898 (REQUEST_CHANGES, two blocking findings) plus four optional suggestions taken in the same push, per CLAUDE.md's 'answer a review in one push' rule. Blocking finding 1 (evidence_source mis-grading): the two PMID:28099414 evidence items at the central_effector node ('Reactive Microglial and Astrocytic Activation') had explanations asserting the microglia-to-astrocyte causal link was established by cultured-cell experiments only. The cached full text shows the necessity half of that claim rests on in vivo mouse genetics (Csf1r-/- microglia-deficient mice, and Il-1a-/-Tnfa-/-C1q-/- triple-knockout mice). Corrected both explanations to stop asserting culture-only design, and added a third evidence item (evidence_source: MODEL_ORGANISM) quoting 'These findings show reactive microglia are required to induce A1 reactive astrocytes in vivo.' The two original items remain IN_VITRO, which is correct for the sufficiency experiments they actually report. Blocking finding 2 (conformance without matching processes): Alzheimer_Disease's Neuroinflammation node conforms to this module's central_effector node but bound none of its three defining biological_processes (GO:0150076, GO:0001774, GO:0048143) -- only a generic GO:0002253 (activation of immune response). Added GO:0001774 (microglial cell activation) and GO:0048143 (astrocyte activation), both modifier: INCREASED, backed by the node's own pre-existing evidence (PMID:35406803 for microglia, PMID:32061803 for astrocytes) -- no new citation needed. Also added GO:0001774 to Huntington_Disease's Neuroinflammation node, whose description already names reactive microglia but whose biological_processes carried only the umbrella GO:0150076. Suggestions taken: (3) added quote_role: REVIEW_SYNTHESIS to the 10 evidence items sourced from narrative-review or consensus PMIDs (33239064, 25792098, 33589835, 35978311); (4) added directness: INDIRECT to the PMID:35978311 item at the consequence node, since it is a disease-association statement rather than a direct observation of neuronal/oligodendroglial injury; (5) added GO:0007249 (canonical NF-kappaB signal transduction) to the amplifier node's biological_processes, matching the node's own description and already validated elsewhere in the KB; (6) added a clarifying clause to the module's 'Worked conformers' notes explaining that Pick_Disease's own text describes astrocyte-dominant reactivity with 'remarkably little activation of microglia', which still satisfies the node's microglial-and/or-astrocytic criterion. Re-validated: linkml-validate, linkml-term-validator, the offline reference/snippet audit (700/706 verified across all 4 changed files, 6 pre-existing skips unrelated to this change), check_duplicate_yaml_keys, check_enum_values, check_entity_refs, check_causal_targets, check_qualifier_terms -- all pass.

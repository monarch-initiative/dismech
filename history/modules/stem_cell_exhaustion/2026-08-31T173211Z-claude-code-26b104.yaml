  summary: Add turquoise killifish (Nothobranchius furzeri) animal model with modeled_mechanisms
  details: |
    Added TWO turquoise killifish animal_models entries, kept separate because the paradigms differ. (1) Aged telencephalon stab-wound injury: RECAPITULATES 'Decline in Stem Cell Self-Renewal and Function' (atypical non-glial progenitors lose proliferative capacity with age) and 'Regenerative Failure and Tissue Homeostasis Decline' (impaired, incomplete repair with inflammation and glial scarring as extrinsic barriers). (2) Aging intestinal mucosa with an intermittent-fasting arm: RECAPITULATES the same two nodes on stem cell cycle time and intestinal length/volume, plus a RESCUES link for intermittent fasting holding niche and circadian clock genes at adult levels into old age. The rescue limitations state plainly that the restoration is transcriptional and that cycle time and morphometry were not shown to be restored. Evidence: PMID:34428340 and PMID:40984680; snippets exact-quoted and verified.

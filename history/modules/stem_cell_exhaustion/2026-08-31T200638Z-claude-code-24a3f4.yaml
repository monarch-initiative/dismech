  summary: Add CHIP as stem-cell readout; gap on non-hematopoietic compartments
  details: |
    Added clonal hematopoiesis [NCIT:C158547] and a KNOWLEDGE_GAP. This is the same measurement curated in genomic_instability_aging making a different claim: there it reports accumulated somatic mutation, here it reports hematopoietic stem-cell clonal dominance, evidenced by the mechanism sentence stating the clone is detectable because a mutated stem cell gained a selective advantage. Readout targets and interpretations differ accordingly; the duplication is deliberate so a curator seeking a stem-cell marker need not know to search the genomic-instability module. Both entries note the relationship. The knowledge gap records that the only marker here is hematopoietic for a structural reason rather than an accidental one, blood being the tissue where a clonal expansion is both sequenceable and repeatedly samplable without biopsy, so the module's clinical face is much narrower than its mechanistic scope. Satellite-cell, intestinal-crypt and neural stem-cell decline have no equivalent accessible readout.

  summary: Add metformin MSC preconditioning treatment with mechanism links
  details: |
    Added the module's first treatment under the geroscience drug-repurposing project (projects/GEROSCIENCE_REPURPOSING.md; Kulkarni et al. 2022, PMID:35343051).

    This is an ex vivo preconditioning pattern rather than systemic gerotherapeutic dosing: metformin is applied to mesenchymal stem cells before autologous transplantation, targeting the accelerated senescence and DNA damage that CKD imposes on the patient's own MSCs. That distinction is kept in the treatment description because it is a different delivery model from the other entries in this project.

    Links to 'Decline in Stem Cell Self-Renewal and Function' (INHIBITS) and 'Regenerative Failure and Tissue Homeostasis Decline' (INHIBITS). Kim et al. 2021 (PMID:33524231) supplies both: the cell-intrinsic correction of proliferation, senescence and DNA damage (IN_VITRO) and the tissue-level reduction in inflammation and fibrosis by preconditioned cells in a mouse unilateral ureteral obstruction model (MODEL_ORGANISM). The Kulkarni et al. 2020 hallmarks review (PMID:32333835) is cited as OTHER for naming delayed stem cell aging among metformin's hallmark-level effects.


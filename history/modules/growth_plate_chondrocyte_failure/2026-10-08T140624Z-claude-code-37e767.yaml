  summary: 'Create: growth_plate_chondrocyte_failure mechanism module'
  details: |
    Created kb/modules/growth_plate_chondrocyte_failure.yaml, a four-node module for the skeletal dysplasias that shorten bone by disrupting the physis. Chain: Cartilage Matrix, Signalling or Chondrocyte Biosynthetic Lesion (trigger, naming the three input classes as the substitution) -> Loss of Growth Plate Zonal Organisation (central_effector, key conformance target; a conforming entry names the zone where its program stalls) -> Reduced Longitudinal Bone Growth (effector) -> Disproportionate Short Stature and Skeletal Dysplasia (consequence). A KNOWLEDGE_GAP discussion holds the unexplained mapping from input lesion to skeletal distribution and severity, which the type II collagenopathy review states is not understood. Motivated by the corpus census: GO:0051216 cartilage development was bound on 42 pathophysiology nodes and GO:0002062 chondrocyte differentiation on 48, almost all conforming to nothing, with no module binding either. Scope notes exclude FGFR3 gain of function (its own module, whose conformers stay there), rickets and hypophosphatasia (defective_skeletal_mineralization, the step after this module's terminal node), limb and digit patterning (limb_digit_patterning_serial_homology), osteogenesis imperfecta and heterotopic ossification. 30 conformance links wired across 28 entries. One snippet from PMID:26249260 was replaced because the bracketed calcium notation cannot be reproduced exactly; the substitute sentence is cited as BACKGROUND and the reason is recorded in the evidence explanation. Every PMID was found by PubMed search in this session, fetched with just fetch-reference, and every snippet copied from the cached abstract. Validation: linkml-validate No issues found; 16/16 snippets verified; linkml-term-validator Validation passed.

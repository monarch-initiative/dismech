  summary: 'Create: blood_brain_barrier_breakdown'
  details: |
    Created the blood_brain_barrier_breakdown mechanism module, the first of the two
    new modules in the build order of the traumatic brain injury pilot
    (docs/superpowers/specs/2026-10-01-traumatic-brain-injury-pilot.md) under design
    decision 3f. The module is written to be reusable outside trauma, so each step is
    evidenced from more than one insult type where the literature allows it.

    Five nodes in one chain: Neurovascular Unit Insult (trigger, TISSUE) ->
    Tight Junction Disassembly (amplifier, MOLECULAR) ->
    Blood-Brain Barrier Permeability Increase (central_effector, TISSUE, the key
    conformance target) -> Extravasation of Plasma Proteins into the Brain Parenchyma
    (effector, TISSUE) -> Vasogenic Cerebral Edema (consequence, ORGANISM). The
    permeability node carries two downstream edges, to the extravasation node and
    directly to the oedema node, because raised permeability produces the oedema by
    bulk fluid movement as well as by protein entry. No extra node was added.

    Evidence: 28 snippets over 18 PMIDs, all exact substrings of the cached abstracts
    or full texts, which were fetched with just fetch-reference. Insult types covered:
    ischaemia and reperfusion (16850029, 11567062, 24746419), neurotrauma (26574669,
    32919030, 24771110, 20551947, 15561417), systemic inflammation and sepsis
    (18987969, 17377766), seizure activity and chronic epilepsy (17124188, 17121744).
    Mechanistic anchors: claudin-5 sufficiency and its size selectivity (12743111),
    pericyte contribution to the barrier (20944627), fibrinogen-driven perivascular
    microglial clustering (23187627), oedema typology and clearance (3564903,
    17303532, 15208268). Human material supports the permeability and extravasation
    nodes (26574669, 17124188, 17377766); the mechanistic steps are predominantly
    rodent, and evidence_source records that rather than smoothing it over. The
    septic-shock imaging snippet is an inference from lesion distribution, not a
    permeability measurement, and the explanation says so.

    Ontology bindings were all read from runoak against the configured OLS adapters at
    curation time, none from memory: GO biological processes and cellular components
    (1905071, 1905605, 0035633, 0045056, 0022617, 0006833, 0007179, 0006954, 0001774,
    0048143, 0005923, 0005901, 0097450, 0005604), CL cell types (2000044 brain
    microvascular endothelial cell, 2000043 brain pericyte, 0000127 astrocyte, 0000129
    microglial cell) and UBERON locations (0000120, 0000955, 0002316). No CHEBI or
    MONDO term is bound on any node. module_categories is NEUROSCIENCE only.

    Not supported and therefore not asserted: the ordering of the transcellular and
    paracellular routes outside the one stroke model that imaged both, which the module
    notes record as open; and any claim that the chain covers cytotoxic (cellular)
    oedema, which the notes exclude from conformance on oedema alone.

    Validation run: linkml-validate against Disease (no issues found),
    linkml-term-validator with --labels (validation passed),
    just count-verified-snippets (28/28 verified), just check-entity-refs,
    just check-causal-targets, just check-duplicate-keys, just check-title-snippets,
    just check-snippet-length, just check-snippet-grading, just check-reference-titles,
    just check-folded-hyphens (all OK, no new findings), and just normalize-cache.
    No disorder file was edited; the conformance edits to Post-Traumatic_Epilepsy and
    the Traumatic_Brain_Injury entry are later steps in the pilot's build order.

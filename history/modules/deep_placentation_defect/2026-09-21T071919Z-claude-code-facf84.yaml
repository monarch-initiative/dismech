  details: |
    First review round on PR #12383.

    Blocking finding (evidence_source on review-synthesis quotes). Six evidence items from the two review articles (PMID:33007270 at the decidualization-resistance node and its outgoing edge and at the shallow-invasion node; PMID:21094932 at the invasion-depth edge and twice at the spiral-artery-transformation node) were graded evidence_source: OTHER with quote_role: REVIEW_SYNTHESIS. That pairing states the superseded rationale: evidence_source grades the evidence the quoted text describes, and quote_role records that the citing paper is not where it came from. Each of the six quoted sentences describes human placental-bed pathology or anatomy - decidualization controlling embryo invasion, shallow cytotrophoblast invasion in preeclampsia, transformation of the decidual and myometrial segments of ~100 spiral arteries, the clinical spectrum of defective deep placentation - so all six are now HUMAN_CLINICAL + REVIEW_SYNTHESIS. This also removes the file's internal inconsistency the review identified: the equivalent human-anatomy sentence from PMID:19375795 was already graded HUMAN_CLINICAL + BACKGROUND.

    One explanation, not three, carried the sentence 'Graded OTHER because the cited publication is a review'; it is rewritten to state the HUMAN_CLINICAL + REVIEW_SYNTHESIS reasoning instead.

    Suggestion 5 (terminal node molecular bindings). GO:0046903 secretion INCREASED added to Release of Placental Factors into the Maternal Circulation, with preferred_term carrying the specificity (secretion of sFlt-1 and apoptotic debris into maternal blood) since GO has no term for syncytiotrophoblast deportation. The gene and chemical-entity bindings the suggestion also floated are not added: sFlt-1, PlGF and VEGF appear in the node's prose and evidence, but binding them as entities would assert a molecular inventory this module does not measure, and the node's claim is the export event.

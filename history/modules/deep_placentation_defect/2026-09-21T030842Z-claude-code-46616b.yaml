  summary: 'Create: Defective Deep Placentation Module'
  details: |
    Created kb/modules/deep_placentation_defect.yaml, the KB's first obstetric mechanism module. Six-node chain: decidualization resistance (trigger) -> shallow extravillous trophoblast invasion of the junctional zone (amplifier) -> failure of spiral artery physiological transformation (central_effector, the key conformance target) -> high-momentum intermittent uteroplacental perfusion -> syncytiotrophoblast oxidative stress and apoptosis -> release of placental factors into the maternal circulation. Scoped deliberately to the deficient-invasion arm; placenta accreta spectrum and placenta previa are the mirror-image lesion and are excluded. Every CURIE was looked up via OLS at the time of writing (GO:0046697, GO:0061450, GO:0001974, GO:0001893, GO:0042310, GO:0006979, GO:0071456, GO:0006915, GO:0016525; CL:0002255, CL:2000002, CL:0008036, CL:4052028, CL:0000525; UBERON:0002450, UBERON:0015171, UBERON:0001987). Six references fetched with just fetch-reference; four PMIDs recalled from memory at the outset (21529757, 19324407, 28923931, 20951753) resolved to unrelated papers and were discarded, and the canonical Brosens 2011 paper was re-found by PubMed search as PMID:21094932. Validated: linkml-validate clean, linkml-term-validator passed, reference validator 17/17 snippets verified.

  summary: 'Create: cns_myelin_failure mechanism module'
  details: |
    Created the CNS oligodendrocyte/myelin failure mechanism module covering the myelin-disorder arm of the leukodystrophies, following the van der Knaap and Bugiani pathogenetic classification (PMID:28638987). Six nodes: oligodendrocyte-lineage or myelin-membrane insult (trigger), oligodendrocyte differentiation arrest and death (amplifier), a parallel microglial injury and reactive gliosis amplifier, deficient or unstable CNS myelin sheath (central effector and key conformance target), loss of oligodendroglial support for the axon (effector), and axonal degeneration with progressive white matter dysfunction (consequence). The microglial node is deliberately placed upstream of the sheath defect rather than downstream of it, because microglial loss precedes full-blown myelin breakdown in X-ALD and MLD human autopsy material (PMID:30980503). Scope guardrails are recorded in notes: astrocytopathies, leuko-axonopathies, microgliopathies and leuko-vasculopathies are excluded at the trigger node; acquired demyelination is excluded; the Schwann-cell peripheral arm routes to peripheral_axonal_degeneration instead. Validation run: linkml-validate reported no issues, linkml-term-validator passed, and just count-verified-snippets reported 15/15 evidence snippets verified against cached references.

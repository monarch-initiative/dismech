  summary: Bind the defining measurement and its guideline thresholds as LOINC measurements
  details: |
    Added a Tonometry diagnosis row (NCIT:C120543) binding LOINC:56844-4 Intraocular pressure of Eye, the same code as the Glaucoma entry, with no reference range, cited to PMID:24825645: in several population-based studies 25 to 50 percent of people with glaucoma had pressure below 22 mm Hg, and many with raised pressure never develop glaucoma; the module itself records normal-tension glaucoma.

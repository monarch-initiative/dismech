  summary: Add the BH3-mimetic dependence node and its resistance node
  details: |
    Three nodes, two cited references, and a description that named venetoclax as the rationale for the central node without the module containing a node for it. Of the hallmark set this is the clearest case of a defence that is also a liability, and the structure did not show it.

    BCL-2 Dependence as a BH3-Mimetic Target (therapeutic_vulnerability; GO:0097193 intrinsic apoptotic signaling pathway) records why the drug kills rather than arrests: a cell holding BAX, BAK and its BH3-only sensitizers in complex with a guardian is storing death signals, not lacking them, so displacing them is immediate - a single dose produced tumour lysis within 24 hours in three patients with refractory CLL. It also records the two conditions that make the node usable and were absent from the module. Selectivity: the non-selective predecessor inhibited BCL-XL and caused dose-limiting thrombocytopenia, so sparing BCL-XL is what turned the mechanism into a drug. And member specificity: the dependence is on a named guardian, so BCL-2-dependent and MCL-1-dependent tumours are not interchangeable even though the trigger node lists their lesions together.

    PMID:23291630 three times, split by evidence_source as the rule requires - OTHER and BACKGROUND for the established-mechanism framing, MODEL_ORGANISM for the in vivo tumour result, HUMAN_CLINICAL for the three-patient observation.

    Guardian Substitution and BH3-Mimetic Resistance (adaptive_escape; GO:0043066 INCREASED) records the two escape routes and why the first is this module's central node restored rather than a new lesion: BCL2 Gly101Val lowers venetoclax affinity so the sequestered effectors are no longer displaced. It appears at progression and in none at study entry, becomes detectable after 19 to 42 months, and is detectable months before clinical relapse, so it is a biomarker as well as a mechanism. PMID:30514704 three times, HUMAN_CLINICAL for the two patient observations and IN_VITRO for the binding and cell-line result.


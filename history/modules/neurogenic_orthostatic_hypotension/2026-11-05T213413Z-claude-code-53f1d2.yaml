  summary: Fold OpenScientist module research into the nOH module
  details: |
    Integrated the OpenScientist research-module report (research/modules/neurogenic_orthostatic_hypotension-deep-research-openscientist.md). The run was seeded with the provisional draft, so its agreement with the draft structure is not independent corroboration; only its primary sources were used. Every cited reference resolved (confabulation rate 0); 16 of 19 quotes were found verbatim; of the 3 misses, two are ellipsis splices of real sentences and the third (a droxidopa neurovascular-junction clause) was not used. Changes: conformance rule widened to at least one lesion-site branch, citing intermediolateral-nucleus neuron loss in Parkinson disease and dementia with Lewy bodies (PMID:27061071); plasma catechol separation of PAF from MSA (PMID:12707437); CYB561 cofactor mechanism (PMID:31822578) and the Dbh knockout mouse (PMID:27148966) on the synthesis branch; yohimbine supersensitivity (PMID:8089252); two reviews on the convergent release deficit (PMID:28702747, PMID:26373628); replacer versus enhancer rule (PMID:32979782) on midodrine and atomoxetine; atomoxetine systematic review (PMID:36647224) and the negative 4-week trial as REFUTE (PMID:39294522, graded as in Pure_Autonomic_Failure); new bedtime short-acting antihypertensive treatment (PMID:9890307); knowledge-gap discussion on the cause of supine hypertension in pure autonomic failure (PMID:11927799). Validated with validate-module, validate-terms, check-entity-refs, check-causal-targets and count-verified-snippets (36/36).

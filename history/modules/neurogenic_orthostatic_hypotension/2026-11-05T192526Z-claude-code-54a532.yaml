  summary: 'Create: neurogenic orthostatic hypotension module'
  details: |
    Provisional module drafted from Palma and Kaufmann 2018 (PMID:29508455), with the drug trials Singer 2006 (PMID:16476804), Byun 2017 (PMID:28794253) and Okamoto 2019 (PMID:30571543). Four lesion-site trigger nodes (central baroreflex efferent, ganglionic transmission, postganglionic denervation, noradrenaline synthesis) converge on deficient norepinephrine release at the neurovascular junction, the key conformance target. Side branches cover adrenoceptor denervation supersensitivity and supine hypertension with nocturnal pressure natriuresis. Five drugs and head-up tilt carry target_mechanisms: midodrine and droxidopa bypass the release deficit; atomoxetine and pyridostigmine amplify residual sympathetic traffic; fludrocortisone expands volume. The ganglionic and synthesis branch evidence reuses snippets already graded in the AAG and DBH deficiency entries. Validated with validate-module, validate-terms and count-verified-snippets (22/22). Seeds an OpenScientist research-module run.

  summary: 'Create: membrane_contact_site_dysfunction module'
  details: |
    New module for organelle communication at membrane contact sites: tether loss, disrupted non-vesicular lipid transfer (key conformance target), impaired ER-mitochondria calcium transfer, lipid imbalance with plasmalogen synthesis at ER-peroxisome contacts as the worked example, altered organelle morphology, impaired synapse formation, and neural dysfunction. Evidence from PMID:19052620, 28108524, 28108526, 30093493, 30765438, 40156832, 40672445, 31732717, 28538724, 40956669 and the bioRxiv preprint PMID:41726917 (flagged as a preprint in each explanation). A cardiac consequence node (cardiomyocyte differentiation and maturation) is supported by mouse and ESC-derived cardiomyocyte data (PMID:24091702, 41848670, 42848893), and Golgi-derived vesicle evidence for Golgi-mitochondria communication (PMID:32193326, 42848893) sits on the morphology node. Two knowledge-gap discussions propose multispectral organelle signature analysis in patient iPSC-derived neurons and astrocytes. Validated with just validate, validate-terms and count-verified-snippets (all snippets verified).
- type: EDIT
  outcome: changed
  sections:
  - pathophysiology
  - notes
  summary: Address first review round on PR 15328
  details: |
    The reviewer flagged the VPS13 human-disease quote (PMID:30093493) as graded IN_VITRO; it is now HUMAN_CLINICAL with quote_role BACKGROUND. The calcium -> neural edge now cites PDZD8 in neurons (PMID:29097544) and the morphology -> neural edge cites the neuron/astrocyte organelle signature result (PMID:40956669, INDIRECT). The mitochondrial-fusion cardiac evidence (PMID:24091702) is marked INDIRECT, with the contact-specific support named as the GRP75 IP3R-VDAC result. The SNX14 lipid-droplet result is INDIRECT on the lipid -> morphology edge and was added to the trigger -> morphology edge. The notes now call MFN2/CMT2A a candidate rather than a conformer, and record that "plasmalogen biosynthetic process" is a synonym of GO:0008611 (OLS search of GO for "plasmalogen", 2026-10-23).

  summary: 'Create: diet_induced_osmotic_diarrhea module'
  details: |
    Created the diet-induced (osmotic) congenital diarrhea mechanism module and wired its first four conformers.

    Scope was set from the current CODE nosology (PMID:29654747), which separates diet-induced diarrhea (high stool osmotic gap, normal villus-to-crypt ratio) from electrolyte-transport-related diarrhea and from the structural and immune-mediated enteropathies. The module models only the first class; the notes record the excluded classes and the boundary against intestinal_barrier_dysfunction, where malabsorption is downstream of mucosal injury rather than the primary lesion.

    Five-node chain: loss of a substrate-specific brush-border digestive or absorptive step (trigger) -> unabsorbed dietary solute retention in the intestinal lumen (central_effector, the key conformance target) -> osmotic water influx and luminal distension (amplifier), plus a parallel colonic microbial fermentation branch (amplifier, modelled separately because short-chain-fatty-acid-driven water salvage opposes the osmotic load and sets the symptomatic dose threshold) -> substrate-dependent watery diarrhea and nutritional consequences (consequence).

    Two treatment patterns on different nodes: dietary substrate elimination INHIBITS the central effector; sacrosidase oral enzyme replacement BYPASSES the trigger. The sacrosidase pattern is hydrolase-class-specific and is explicitly not inherited by transporter-class conformers.

    Conformers wired: Congenital_Lactase_Deficiency (2 nodes), Congenital_Sucrase-Isomaltase_Deficiency (2), Trehalase_Deficiency (4), Glucose-Galactose_Malabsorption (3). Before this change no Mendelian gut entry in the KB declared conformance to any module.

    Evidence discipline: three PMIDs recalled from memory during drafting resolved on fetch to unrelated papers (a neuroanatomy study, a synaptic-plasticity study, an AMPA-receptor study). All three were discarded, their cache files removed, and correct PMIDs resolved via PubMed esearch before use.

    Validation: linkml-validate clean; linkml-term-validator clean after correcting a guessed NCIT code for sacrosidase (C47649 -> C66525, verified via OLS); reference validator reports 13/13 snippets verified against cached abstracts.

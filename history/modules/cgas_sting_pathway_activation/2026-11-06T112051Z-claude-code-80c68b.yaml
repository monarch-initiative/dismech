  summary: Record the macrophage polarization branch-point gap on the cGAS-STING module
  details: |
    Addresses the scope question in issue #14549: whether the cell-type-dependent tumor-promoting arm of cGAS-STING signalling in digestive-tract cancers needs new disease entries, a new module, or can be carried by the existing kb/modules/cgas_sting_pathway_activation.yaml. Reviewed the module's own scope notes and its eight nodes against PMID:42852635 (Int J Oncol 2026 review, full text cached). The module already carries divergent productive and counter-regulatory arms, so the finding is a missing branch point rather than a missing module: the maturation node binds macrophage alongside conventional dendritic cell and runs downstream to antitumor T cell priming, but the review reports both M1 and M2 outcomes from macrophage-intrinsic activation in the same disease, and attributes the direction to which downstream branch is engaged rather than to pathway activity. Added one KNOWLEDGE_GAP discussion with three review-synthesis evidence items and two proposed experiments, and added ONCOLOGY to module_categories. No pathophysiology node was added or changed: whether the branch should become a node needs primary evidence for the STAT6 arm, not a review sentence. 28 of 28 snippets verify; validate, validate-terms, check-entity-refs, check-enum-values, check-duplicate-keys, check-snippet-grading and check-snippet-length all pass.

  summary: 'Create: conserved particulate and oxidant air pollution injury module'
  details: |
    Created kb/modules/particulate_air_pollution_injury.yaml as a five-node conserved chain (trigger: inhaled particulate and oxidant gas deposition; amplifier: airway epithelial and macrophage oxidative stress; central_effector: NF-kB activation and NLRP3 inflammasome assembly; effector: neutrophilic airway inflammation and cytokine release; two parallel consequence branches for airway epithelial barrier disruption and for systemic inflammation with endothelial dysfunction). Motivated by a gap analysis against the Monarch EnVar prioritized environmental variables survey, which found that 13 of its 38 priority variables are inhaled particulate or oxidant-gas exposures and that dismech carried only the flat ECTO:8000036 'exposure to air pollution' term across six airway-disease entries, with PM2.5, NO2, black carbon and ozone appearing only inside evidence snippets and one notes line. Six references cited, all fetched with linkml-reference-validator; 12/12 snippets verified against the cached abstracts with just count-verified-snippets. Schema validation and term validation both pass; ECTO:7000117 was confirmed reachable from the exposureterm dynamic enum during term validation and added to cache/ecto/terms.csv by the validator. Module scope boundaries recorded explicitly in notes: the protease-antiprotease, mesenchymal, type-2 sensitization and atherogenesis arms are left to sibling modules a conformer may declare in parallel, and the PAH mutagenesis route and carbon monoxide are declared out of scope. An evidence-discipline caveat is recorded in notes requiring conformers to keep human association evidence and in vitro/rodent mechanistic evidence as separate evidence items.

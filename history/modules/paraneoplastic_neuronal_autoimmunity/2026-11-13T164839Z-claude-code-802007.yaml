  summary: Create the paraneoplastic neuronal autoimmunity module
  details: |
    Creates a mechanism module for the autoimmunity a tumour provokes against the nervous system, and
    wires the two entries that already model it. The chain runs tumour expression of a neuronal antigen
    to an antitumour immune response that cross-recognises it, then to one of two effector arms, then
    to neuronal loss or dysfunction. The two arms are separate nodes rather than one immune-injury node
    because they diverge on the three things a curator needs from them: which cell does the killing,
    whether the antibody is the effector or only a biomarker, and whether the damage reverses. A node
    bundling them would assert the same prognosis for anti-Hu and for anti-NMDA-receptor disease, and
    those are opposite. The key conformance target is the cross-recognition node, the step that makes a
    syndrome paraneoplastic rather than merely concurrent with a cancer.

    Two facts about the sources shaped the module and are worth recording, because the plan it was
    built from assumed otherwise. The slate named the 2021 PNS-Care consensus criteria as the anchor.
    That paper cannot anchor the mechanism nodes: modules are snippet-checked against abstracts only,
    and its abstract is entirely diagnostic criteria with no mechanism sentence in it. It also argues
    against the framing it was meant to support, retiring the term onconeural precisely because the
    term implies the antigen is obligatorily expressed by both the nervous system and the cancer, which
    the Tr/DNER antigen of classical paraneoplastic cerebellar degeneration is not. So the consensus is
    cited only for that terminological point, which is in its abstract, and the trigger node states
    tumour expression as this module's own scope condition rather than as a universal claim. The
    mechanism nodes rest instead on papers the two conformers already cite: an anti-Yo review for the
    ectopic expression and for the contested division of labour between the arms, an autopsy comparison
    of anti-Yo against anti-P/Q-VGCC disease for the histology of each, and a 2026 review for the
    pathogenetic distinction between them.

    The second fact is which source carries the distinction quotably. The 2026 review (PMID:41562781)
    states it in a single sentence, and that sentence is what the module uses in the three places it
    is needed.

    No GO process is bound on the trigger or on the consequence node. On the trigger, the antigen and
    the tumour type are exactly what a conformer substitutes, so naming either would be wrong for a
    module. On the consequence, GO:0070997 neuron death is obsolete - checked against OLS rather than
    inferred from an empty term cache - and the sources name no death programme, so the node binds the
    cell and the site and stops, which is what the cerebellar degeneration entry's own equivalent node
    does. The central effector binds GO:0002418 immune response to tumor cell rather than the more
    generic adaptive immune response, which is both more precise for the node's claim and already the
    term one conformer binds there, so the key conformance target shares a term with its conformer
    rather than sitting above it.

    Conformance content, recorded so nobody reads the totals as a defect: of the nine links, two share
    a GO term, four are process_absent and three are anchor_no_process. Three of the four process_absent findings and two of the three anchor_no_process ones are the
    cerebellar degeneration entry, whose five conforming nodes bind no GO term at all. That is a
    pre-existing gap in that entry rather than a defect in this module or in the links, and it is
    left for a pass on that entry rather than widened into this change. The fourth process_absent
    finding is the neurological syndromes entry at the surface-antigen anchor, where that entry
    binds GO:0019724 B cell mediated immunity and GO:0007268 chemical synaptic transmission against
    the module's GO:0002455. Those are the specific and the generic form of one claim, which is the
    benign case the check cannot tell apart from a mis-picked anchor, so nothing is changed on
    either side.

    This module was built once before, on 11 November, and discarded unbuilt rather than pushed: a
    machine power-off interrupted that run before its two adversarial verifiers reported, and the
    project's rule is that half-finished unverified work is redone from scratch rather than trusted.
    Nothing from that attempt was reused. The two findings above about the sources were re-derived and
    every quote re-verified against the caches before this version was written.

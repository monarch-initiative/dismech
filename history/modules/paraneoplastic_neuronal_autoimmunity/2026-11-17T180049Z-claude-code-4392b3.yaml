  summary: 'Edit: paraneoplastic neuronal autoimmunity module — source the scope limit,
    hedge the marker claim, regrade two items'
  details: |
    Review round. The module's notes claimed it cited the 2021 PNS-Care consensus for the scope limit that gives the module its name, and it cited that paper nowhere; the scope limit therefore rested on uncited text. The consensus is now cited twice on the trigger node, for the term replacement and for the reason behind it, and the sourcing note has been rewritten.

    The note also gave a false reason for not citing it, that a module can only quote an abstract. What the module gate passes is --no-full-text, which suppresses fetching and not matching, so a quote from a committed full-text cache verifies like any other. The module batch run for this round checks seventeen snippets with none unavailable, including the body sentence, which is the direct evidence that the old premise was wrong.

    The top-level description stated flatly what the node it summarises hedges, that the antibody in the intracellular-antigen arm is a marker rather than the effector. It now carries the node's hedge, and it also records that the autopsy cohort cited here reports cytoplasmic immunoglobulin staining in some neurons, so antibody is not simply absent from that arm. The claim itself is now quoted, from the consensus, with its own hedge.

    Two gradings were overstated and are corrected. The co-occurrence sentence on the edge from the T cell arm to neuronal loss is regraded INDIRECT, since it reports cell loss and a cytotoxic infiltrate in the same tissue without asserting that one caused the other, and the authors' own reading of that tissue as T cell-mediated pathology is added as a second, DIRECT item. The consequence node's sole item is regraded INDIRECT because the sentence names neurological disability, an organism-level outcome, where the node is tissue-level neuronal loss.

    The surface-antigen arm asserted that the antibody binds its target and disturbs its function and quoted nothing for it. The sentence that does assert it, from the same cached cohort, is now on the node, with both of the authors' hedges and the note that their surface-antigen arm is a single case.

    Five evidence items citing the same narrative review are regraded from HUMAN_CLINICAL to OTHER. The quoted sentences are that review's own pathogenetic classification rather than its data, and the sibling disorder entry already grades the same sentence OTHER in five places, so the two files now agree.

    Smaller corrections: the sibling module is described as covering functionally diverse insults rather than only acquired disease, which is what its own description says; a negative-existence claim about CL terms is narrowed to the cytotoxic T cell terms it was actually checked against; and a plural that implied several surface-antigen cases is corrected to the one case the cohort had.

    Validated with the repository's nineteen-gate set over the three changed files and with the module batch validator that CI runs on a changed module. All passed.

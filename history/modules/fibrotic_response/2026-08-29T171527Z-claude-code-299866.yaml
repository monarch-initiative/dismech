  summary: Tag biological_scale on all five fibrotic_response module nodes
  details: |
    Added biological_scale to all five module nodes as part of the AOP 38 / Akura Twin NAM mapping exercise for issue #10051, matching AOP-Wiki's Level of Biological Organisation where the correspondence is clear: Tissue Injury (TISSUE - the conforming disease nodes are tissue-compartment injuries such as pericardial injury and injury to the alveolar-interstitial compartment, not single-cell-type events), Inflammatory Recruitment and Amplification (TISSUE - recruitment and inflammation are named tissue processes in the enum description, and this is the module counterpart of KE 1493 at Tissue), Mesenchymal Cell Activation (CELLULAR, KE 265 Cellular), Excessive ECM Deposition (TISSUE, KE 68 Tissue) and Architectural Distortion and Organ Dysfunction (TISSUE - AOP-Wiki puts the AO KE 344 at Organ, and BiologicalScaleEnum's TISSUE is defined as tissue/organ scale, so there is no organ-level gap here). No evidence, terms, causal edges, or other content changed. Validated with just validate, just check-duplicate-keys and just check-entity-refs.

  summary: Attach directional evidence to the PRO-C1/PRO-C6 readout
  details: |
    Third review-response session for PR #10282. The 'Type I and type VI collagen formation (PRO-C1, PRO-C6)' readout declared direction INCREASED but its only evidence was the PMID:32381012 Methods sentence stating the biomarkers were evaluated, not that they rose - the same defect shape corrected earlier on the myofibroblast readout. Added a second evidence item quoting 'TGF-beta1 induced synthesis of PRO-C1, PRO-C6 and FBN-C as compared with unstimulated fibroblasts at all timepoints', which names exactly these two markers in exactly this direction. Kept the Methods item and narrowed its explanation to what it actually establishes - the ELISA modality and supernatant compartment the interpretation depends on - noting explicitly that it does not carry the direction. Readout-local evidence is a design property per CLAUDE.md, since a readout must stay self-describing when lifted out of its link. Branch was also rebased onto current main in this session: main had added biological_scale to all five pathophysiology nodes (PR #10257), changed the schema, and introduced check-causal-targets and check-qualifier-terms, none of which the branch's earlier CI had seen; all re-validated clean after rebase. Validated: linkml-validate, count-verified-snippets (21/21), validate-terms, check-entity-refs, check-duplicate-keys, check-enum-values, check-causal-targets, check-qualifier-terms, check-snippet-grading, check-snippet-length, check-title-snippets, check-folded-hyphens - all clean.

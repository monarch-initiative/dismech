  summary: Add divergence-by-organ discussion (#10313)
  details: |
    Added an INTERPRETATION discussions entry (interp_fibrotic_chain_organ_divergence) recording that PMID:31676376 (murine PCTS: intestine/liver/kidney) and its human companion PMID:31754732 (murine+human PCTS: liver/kidney/gut) find the module's conserved fibrotic chain holds for the precursor fibroblast lineage and activation programme but not below it: 70% of ECM-related genes differ by organ at baseline, the non-canonical TGF-beta arm is engaged in liver/kidney PCTS but not intestinal PCTS, and the core-pathway inhibitor galunisertib produces organ-specific rather than uniform responses. Attached to Mesenchymal Cell Activation, Excessive ECM Deposition, and the Scar-in-a-Jar experimental model. Cited kind is INTERPRETATION rather than HUMAN_MODEL_MISMATCH because the human PCTS study reaches the same conclusion independently, so translational validity is not the open question. Also cited PMID:33981032 (Buechler et al., cross-tissue fibroblast atlas) as the positive counterpart establishing the conserved precursor lineage, both in the discussion and as an added evidence item on the Mesenchymal Cell Activation node. Amended the module description to name intestine (previously absent, and the organ where divergence is sharpest) and point at the new discussion. No existing pathophysiology, evidence, or conforms_to targets were changed. Fetched PMID:31676376, PMID:31754732, PMID:33981032, PMID:28691737, PMID:32443499 via just fetch-reference; all 10 new snippets verified as exact substrings of the cached references. Validated with just validate, just count-verified-snippets, just validate-terms, just check-entity-refs, just check-duplicate-keys, just check-enum-values, just check-snippet-grading, just check-folded-hyphens, and just check-title-snippets, all clean.

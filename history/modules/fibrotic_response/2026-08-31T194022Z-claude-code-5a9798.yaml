  summary: Add Scar-in-a-Jar module-level experimental model
  details: |
    Added an experimental_models block to kb/modules/fibrotic_response.yaml carrying the Scar-in-a-Jar macromolecular-crowding fibroblast fibrosis assay (PMID:34028741), with modeled_mechanisms links to Mesenchymal Cell Activation and Excessive ECM Deposition only. Both links are RECAPITULATES / MODERATE with per-link limitations recording that TGF-beta 1 is supplied exogenously in place of endogenous latent-TGF-beta activation, and that the deposited matrix is a two-dimensional in-well layer with no degradation arm measured. Readouts: alpha-SMA expression and myofibroblast formation for the activation node; PRO-C1/PRO-C6 collagen formation and FBN-C fibronectin deposition for the ECM node. The other three module nodes were deliberately not linked - a fibroblast monoculture has no epithelium, immune compartment or organ architecture. tissue_term is omitted because the fibroblast source is a parameter of the assay rather than a fixed feature; findings cite PMID:33521022 (primary adult human dermal fibroblasts, plus a published list of sources spanning lung, dermal, corneal and vocal fold fibroblasts) and PMID:32381012 (primary human lung fibroblasts) as the cross-organ demonstration that licenses a module-level rather than organ-level model. Validated: just validate, count-verified-snippets (18/18), validate-terms, check-entity-refs, check-duplicate-keys, check-snippet-grading, check-folded-hyphens, check-snippet-length, check-title-snippets - all clean.

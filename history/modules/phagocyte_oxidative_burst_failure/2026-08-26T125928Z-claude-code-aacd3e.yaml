  summary: 'Create: phagocyte_oxidative_burst_failure module and wire three conformers'
  details: |
    Created kb/modules/phagocyte_oxidative_burst_failure.yaml, factoring the NOX2 respiratory-burst chain out of Chronic_Granulomatous_Disease per the implementation request in monarch-initiative/dismech#9315. Five nodes: a trigger lesion-class node where CGD, G6PC3 deficiency and RAC2 disease substitute their different defects; the rate-limiting central effector 'Failed Respiratory Burst and Phagosomal ROS Deficiency' as the key conformance target; an obligate killing arm running to recurrent bacterial and fungal infection; and a conditional immunoregulatory branch that hands off to granuloma_formation rather than duplicating it. Each node carries its own independent evidence rather than reusing the single GeneReviews reference CGD used four times. Treatment target_mechanisms pattern: lentiviral gene therapy RESTORES the trigger node, cited to PMID:31988463. Two discussions: IFN-gamma prophylaxis recorded as a KNOWLEDGE_GAP rather than curated as a burst-restoring agent, and MPO-deficiency conformance left as a CURATION_TODO. Out-of-scope boundaries recorded in notes: increased-direction burst entries, non-NOX2 family oxidases, and neutropenia versus function. Wired conforms_to on Chronic_Granulomatous_Disease at two nodes, G6PC3_Deficiency at two nodes on the function arm only, and Neutrophil_Immunodeficiency_Syndrome at one node, since PR 9313 merged on 2026-08-24 and the RAC2 conformer is now on main. Validation: linkml-validate, linkml-term-validator and reference validation all pass; 13 of 13 module snippets verified against cached references; 7377 conformance and entity-ref tests pass.

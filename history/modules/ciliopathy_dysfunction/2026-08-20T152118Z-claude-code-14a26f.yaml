  summary: Admit tubulin-subunit lesions as a third entry route to the trigger node
  details: |
    Recommendation 2 of docs/reports/tubulinopathies-grouping-review-2026-08-20.md required TUBB/TUBB5-related Microcephaly to conform to this module for its newly curated ciliogenesis branch. As written, the trigger node admitted only lesions in basal body, transition zone, BBSome or IFT component genes, so a tubulin-subunit lesion could not conform honestly.

    Widened the trigger node to admit a third entry route - a dominant missense variant in a tubulin subunit gene impairing cilium assembly directly - backed by PMID:41309602 (Nat Commun 2025, TUBB G308S/E108K/E401K reduce ciliation in patient cells, isogenic lines and mice) and PMID:42091926 (npj Genom Med 2026 review of the tubulinopathy-ciliopathy link). Added both as evidence on the node.

    Added two guardrails to the module notes so the widening does not become a licence: conformance requires evidenced impairment of ciliogenesis or ciliary function in that specific disorder, not merely a microtubule lesion (every tubulinopathy perturbs microtubules and most have no ciliary evidence); and the reported mechanism is dose-dependent gain-of-function, since TUBB-haploid cells ciliate normally, so a tubulin loss-of-function or haploinsufficiency lesion is not evidence for this route.


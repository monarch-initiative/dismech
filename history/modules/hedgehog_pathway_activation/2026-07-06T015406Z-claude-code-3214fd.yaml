  summary: 'Create: hedgehog_pathway_activation mechanism module'
  details: |
    Created the oncogenic Hedgehog activation mechanism module capturing the conserved chain: loss of Hedgehog pathway negative regulation [PTCH1/PTCH2/SUFU loss-of-function or SMO gain-of-function] then constitutive Smoothened activity, then constitutive GLI transcriptional output, then Hedgehog-driven proliferation and tumorigenesis. Defines the SMO-inhibitor mechanism-of-action pattern via target_mechanisms on the Constitutive Smoothened Activity node, and marks the SMO-independent bypass via SUFU loss and GLI2 amplification on the GLI output node. Deliberately the gain-of-signal arm only; developmental Hedgehog loss-of-function disorders stay with ciliopathy_dysfunction and limb_digit_patterning_serial_homology, mirroring the cellular_senescence / senescence_tumor_suppression antagonistic-pleiotropy split. Evidence snippets reused verbatim from already-validated disorder entries; schema and term validation pass and snippets verified as exact substrings of cached abstracts.

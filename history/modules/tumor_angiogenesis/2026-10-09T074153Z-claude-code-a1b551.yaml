  summary: Add the VEGF-blockade evasive-resistance node
  details: |
    The module named anti-angiogenic therapy as the target of its consequence node and said nothing about how the drugs behave, which is the part a conforming entry needs. Added VEGF Pathway Blockade and Evasive Resistance (adaptive_escape; GO:0001525 angiogenesis INCREASED, GO:0048010 VEGFR signaling pathway DECREASED), downstream of the central angiogenic-switch node.

    The node's substantive content is that resistance here is unlike resistance in the sibling hallmark modules. It is not acquired by mutating the drug's target; the target stays inhibited and the tumour finds another route to perfusion - alternative pro-angiogenic ligands, recruited bone-marrow-derived pro-angiogenic cells, pericyte coverage that removes the VEGF survival dependence, or invasion along existing normal vasculature that dispenses with neovascularisation, which is where this module meets invasion_and_metastasis. A separate population is indifferent from the outset rather than adapting. So the benefit is real and transitory, measured in months, and a failure should be recorded as which route replaced the blocked one rather than as loss of the hallmark.

    PMID:18650835 four times - the transitory benefit, the two-mode structure, the indirectness that distinguishes this node, and the shape of the clinical benefit a conforming treatment description should match.


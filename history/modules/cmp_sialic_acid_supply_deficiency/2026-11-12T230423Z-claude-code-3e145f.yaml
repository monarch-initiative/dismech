  summary: 'Create module: CMP-Sialic Acid Supply Deficiency'
  details: |
    Created kb/modules/cmp_sialic_acid_supply_deficiency.yaml, a mechanism module for
    the inborn errors of the de novo sialic acid supply chain (GNE, NANS, NANP, CMAS,
    SLC35A1). Eleven pathophysiology nodes: three sibling triggers, one per compartment
    of the lesion (cytosolic synthesis, nuclear activation, Golgi import), converging on
    the central effector "Reduced Golgi CMP-Sialic Acid Availability" (the key
    conformance target), then two parallel molecular effectors (glycoprotein
    hyposialylation and ganglioside sialylation deficit) and five sibling tissue arms
    (muscle, platelet, podocyte, brain, growth plate). Triggers were kept apart rather
    than merged because the compartment determines whether precursor supplementation can
    bypass the block, which is also the treatments block: ManNAc (BYPASSES the cytosolic
    trigger, ACTIVATES the central node) and sialic acid replacement (ACTIVATES the
    central node).

    Six discussions: a CONTROVERSY over platelet production versus clearance (mouse
    conditional knockout versus a human series), a KNOWLEDGE_GAP on the unidentified
    critical muscle sialoproteins and quadriceps sparing, a HUMAN_MODEL_MISMATCH on the
    kidney arm that dominates two mouse models and is minor in people, an INTERPRETATION
    of the normal-transferrin diagnostic pitfall, a KNOWLEDGE_GAP on whether
    supplementation can help a lesion below where it enters the pathway, and a
    CONTROVERSY on why donor-pool correction has not translated into clinical benefit. Four carry
    proposed_experiments.

    Scope boundaries recorded in notes: Sialuria (GNE allosteric gain of function, flux
    in the opposite direction), the sialidoses, galactosialidosis and free sialic acid
    storage disease (lysosomal catabolic or efflux defects) are explicitly NOT
    conformers. Complementarity with congenital_disorder_of_glycosylation (N-glycan
    assembly and processing, no sialic acid supply arm) is stated in the description.

    Conformers wired in the same change: GNE_Myopathy (3 nodes) and
    SLC35A1-Congenital_Disorder_of_Glycosylation (6 nodes, one of them listing two
    anchors because its brain node covers both gangliosides and polysialylated NCAM). NANS-related
    spondyloepimetaphyseal dysplasia is an intended conformer being curated separately.

    Pre-PR self-review (fresh subagent, dismech-pr-review rubric) raised no CRITICAL
    findings and ten lesser ones, all addressed: the NANP phosphatase was demoted from a
    lesion site to prose plus a REFUTE evidence item (PMID:31121216 shows NANP knockout
    leaves CMP-sialic acid and surface sialylation normal); a sixth discussion was added
    weighing the biochemical-versus-clinical efficacy dissociation (negative phase 3
    aceneuramic acid trial PMID:31036580 and the NANS-CDG sialic acid study PMID:37340906
    against the on-mechanism ManNAc phase 2 PMID:34257421); the platelet node was
    narrowed to the hepatic clearance event (CELLULAR, with the Kupffer-cell snippet) and
    the podocyte node to the barrier-structure failure, leaving the count, bleeding,
    proteinuria and hematuria to conformer phenotypes; GO:0005794 was replaced with
    GO:0000139 Golgi membrane on the import trigger and GO:0001503 with GO:0003417 growth
    plate cartilage development; three evidence classifications were corrected
    (PMID:31495922 to IN_VITRO, REVIEW_SYNTHESIS on the PMID:24692354 review quotes, the
    PMID:22745475 caveat quote de-labelled from PRIMARY_RESULT); a misdirected
    would_refute was dropped; and the notes were reconciled with the central node's
    actual bindings and with GNE_Myopathy having no donor-pool node to conform at.

    Validation: just validate-module and just validate-module-batch pass (schema, terms,
    references); 50/50 snippets verified against cached abstracts by
    just count-verified-snippets; check-folded-hyphens, check-logical-rules,
    check-entity-refs and check-causal-targets clean; both conformer files re-validated
    with just validate. check-conformance-content reports three process_absent links on
    the SLC35A1 side, which are the reported-not-gated generic/specific substitution
    case (the conformer binds GO:0097503 sialylation where the module binds GO:1990743
    protein sialylation) plus two nodes that bind no process term.

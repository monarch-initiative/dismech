  summary: 'Create module: cDC1 tolerogenic maturation (EPOR switch)'
  details: |
    Created kb/modules/cdc1_tolerogenic_maturation.yaml from a single primary source, PMID:41372415 (Zhang et al., Nature 2026, "Erythropoietin receptor on cDC1s dictates immune tolerance"), supplied as a PDF by the requester and independently fetched into references_cache via `just fetch-reference`.

    Chain (6 nodes): Efferocytic Uptake of Cell-Associated Antigen by cDC1s (trigger) -> EPO-EPOR Signalling in cDC1s (amplifier, the switch node) -> Tolerogenic Maturation to CCR7+ Late-Mature cDC1s (central_effector; key conformance target) -> Integrin alpha-V beta-8-Dependent Latent TGF-beta Activation (effector) -> Antigen-Specific FOXP3+ Treg Induction and Restrained T Cell Priming (consequence). A sixth node, Immunogenic cDC1 Maturation and Enhanced T Cell Priming (adaptive_escape), branches off the switch node to curate the reciprocal EPOR-loss route; it is the rationale for the tolerance-breaking treatment arm.

    Bidirectional drug-target pattern on the switch node: recombinant erythropoietin ACTIVATES (tolerance-inducing arm, NCIT:C477) and investigational cDC1 EPOR blockade INHIBITS (tolerance-breaking arm; no agent exists, genetic proof of concept only). Both are explicitly marked as preclinical mechanism patterns, not treatment recommendations, and conforming disorders do not inherit them.

    Scoping decisions recorded in the module notes: (1) the Aldh1a2 / retinoic-acid route is deliberately NOT part of the chain, because cDC1-restricted Aldh1a2 deletion did not impair chimerism or donor-specific Treg induction in the source study whereas Itgb8 deletion did; (2) the module is positioned as the antigen-presenting-cell-intrinsic complement of immune_checkpoint_blockade (the tumour-cell-intrinsic PD-L1 / exhaustion arm) rather than a duplicate, and as distinct from tumor_promoting_inflammation; (3) positive conformance requires cDC1 lineage, cell-associated (dying-cell) antigen, and a tolerogenic readout. CCR7+ maturation alone is the shared gateway to both the tolerogenic and the immunogenic branch and is explicitly insufficient for conformance.

    NO CONFORMERS WIRED, deliberately. Every causal step rests on mouse genetics (Xcr1-Cre conditional Epor / Itgb8 / H2-Ab1 deletion, Epor-tdTomato and Zbtb46-GFP reporters, allogeneic bone-marrow and heterotopic heart transplantation, B16F10-OVA and MC38-OVA tumours). No step has been demonstrated in human cDC1s, and the KB currently has no graft-rejection or GVHD entry; conforming an existing human melanoma or other tumour entry would import an unverified species assumption, which the module's own SPECIES SCOPE guardrail forbids. Recorded instead as an open HUMAN_MODEL_MISMATCH discussion with two proposed experiments (human CD141+ cDC1 EPOR expression and efferocytosis-dependence; EPO-dependence of human cDC1 Treg induction and ITGB8 induction). A second KNOWLEDGE_GAP discussion raises whether therapeutic erythropoiesis-stimulating-agent exposure acts on this switch in patients, and states explicitly that the module must NOT be cited as support for a mechanistic claim about erythropoiesis-stimulating-agent safety: the source study neither dosed patients nor examined human tumour outcomes.

    Ontology grounding: CL:0000990, CL:0000841, CL:0000815; GO:0043277, GO:0038162, GO:0097029, GO:0042590, GO:0019886, GO:0030511, GO:0050431, GO:0045591, GO:0002458. CL has no cDC1-specific class, so nodes bind conventional / mature conventional dendritic cell and carry a more specific preferred_term per the preferred_term-vs-label convention. GO's direct "transforming growth factor beta activation" term is obsolete, so the integrin node uses GO:0030511 (biological process) plus GO:0050431 (molecular function).


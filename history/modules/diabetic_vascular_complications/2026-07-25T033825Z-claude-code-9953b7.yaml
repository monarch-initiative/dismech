  summary: Create diabetic_vascular_complications mechanism module
  details: |
    Created the diabetic_vascular_complications module: the conserved final-common vascular-injury cascade (chronic hyperglycemia -> oxidative/AGE-RAGE stress -> endothelial dysfunction and vascular inflammation -> micro-/macrovascular injury -> end-organ complications) shared by all diabetes types. 5 nodes (trigger->amplifier->central_effector->effector->consequence), central_effector 'Endothelial Dysfunction and Vascular Inflammation' is the key conformance target. Evidence reuses already-cached/validated PMIDs from the umbrella (PMID:32872570, 28460155, 39158206) plus SGLT2 outcome PMID:33441402 for the drug-target treatment. Part of the A2 diabetes refactor: distilled from the blended umbrella Diabetes_Mellitus.yaml pathophysiology graph. Validated: schema, terms, references.

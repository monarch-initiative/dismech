  summary: 'Create: norrin_fzd4_retinal_vascular_development module'
  details: |
    Created a mechanism module for the inherited retinal vascular diseases, factored out of the Familial_Exudative_Vitreoretinopathy and NDP_Related_Vitreoretinopathy entries, which independently modelled the same Norrin-FZD4-beta-catenin chain. Five nodes with two parallel effector arms - the angiogenic arm producing a peripheral avascular retina, and the barrier arm producing inner blood-retina barrier failure - converging on ischaemia-driven neovascularization and tractional detachment. Key conformance target is the central_effector node 'Insufficient Norrin-FZD4-beta-catenin Signalling in Retinal Endothelium'. The module's substantive modelling claim is that the phenotypic continuum from asymptomatic peripheral avascularity to congenital retinal dysplasia is a dose series on one pathway rather than distinct mechanisms, and its KNOWLEDGE_GAP challenges exactly that by noting interocular asymmetry within single genotypes. Scope note excludes retinopathy of prematurity and diabetic retinopathy, which reach the same ischaemic endpoint by different routes. Validated: linkml-validate clean, term validation passed, 11 of 11 snippets verified against cached references.

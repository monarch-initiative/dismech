  summary: Add quad co-culture liver spheroid NAM (PMID:38740170) model link
  details: |
    NAM mining of PMID:38740170 (Sun et al., Toxicology 2024), a self-assembled 3D quadruple co-culture liver spheroid (HepG2, PUMC-HUVEC-T1 endothelial, THP-1-derived macrophages, human hepatic stellate cells) for DILI prediction. Added one experimental_models entry with a modeled_mechanisms link to the Sterile and Immune-Mediated Inflammatory Amplification node, recorded PARTIALLY_RECAPITULATES (fidelity LOW) because the paper shows non-parenchymal cells amplify isoniazid cytotoxicity but infers rather than measures the immune-mediated mechanism (PROXY_QUANTITY divergence, QUALIFYING). Predictive-performance panel (22 DILI+/5 DILI-) recorded as a findings entry, not a mechanism link. Evidence snippets quote the paper abstract; full text was not reachable in the environment. Validated with validate-module-batch (schema+terms+references, 0 issues) and model-scale-audit.

  summary: Add New Approach Methodology (NAM) evidence and experimental models to
    the DILI module
  details: |
    Curation-scanner (high_effort) run against issue #4873 -- curate NAMs from the NAMeRS 2026 summit.

    Before this pass, every evidence item in the drug_induced_liver_injury module was
    evidence_source: OTHER (review articles) -- the module carried no human-cell-based
    experimental support at all. NAMeRS summit Project 5 (3D iPSC-hepatocyte models for
    AAV gene-therapy liver safety) and the Ingber/Wyss multi-organ-chip case study both
    map onto this module, so it was the clearest remaining NAM gap in the issue's
    curation plan; Endometriosis, peripheral_axonal_degeneration, and
    Esophageal_Adenocarcinoma had already been covered by earlier work.

    Added:
    - 4 IN_VITRO NAM evidence items across three pathophysiology nodes:
      * Mitochondrial Dysfunction and Oxidative Stress <- PMID:36473994, TMRM
        mitochondrial-injury imaging in the human quad-culture Liver-Chip.
      * Hepatocyte Cell Death <- PMID:39529647, acetaminophen/fialuridine toxicity at
        micromolar rather than millimolar concentrations in iPSC liver organoids on
        chip; and PMID:36473994, albumin loss as the most sensitive hepatocyte-toxicity
        marker.
      * Sterile and Immune-Mediated Inflammatory Amplification <- PMID:41001778,
        autologous HLA-genotyped organoid plus CD8 T cell co-culture: TNF-alpha and
        granzyme B secretion with cytokeratin-18 release, and flucloxacillin iDILI in
        HLA-B*57:01 carriers. This is the first evidence in the module for the
        adaptive, HLA-restricted arm of the amplifier node.
    - A new experimental_models section with 3 fully human, animal-free NAM systems
      (2 ORGAN_ON_CHIP, 1 CO_CULTURE), each with namo_type, cell types,
      modeled_mechanisms links to the module's pathophysiology nodes, and findings
      with verified snippets.

    Validation: just validate kb/modules/drug_induced_liver_injury.yaml passes
    (schema plus term validation). All 26 PMID snippets in the file, including the 10 new
    ones across evidence and findings, were independently confirmed to be exact
    whitespace-normalized substrings of the fetched references_cache abstracts. The
    three new references were fetched with just fetch-reference; no cache file was
    hand-written.

    Note for follow-up: just validate-references reports "Total checks: 0" for this
    module file both before and after this change, i.e. it is silently not
    snippet-checking this module file. That is a pre-existing tooling gap, not
    introduced by this pass, and is worth a separate issue.

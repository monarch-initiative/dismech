  summary: Record the Akura Twin MPS drug-challenge arm on the DILI module
  details: |
    Added the 384-well Akura Twin microphysiological system (PMID:40754287, Schmidt and Suter-Dick, Toxicology 2025) as a fourth experimental model on this module, recording the arm of the study that uses methotrexate and acetaminophen as hepatotoxicant challenges. Two modeled_mechanisms links. Hepatocyte Cell Death is PERTURBS rather than a recapitulation claim: the drugs are applied as a chemical challenge and only loss of albumin synthesis is reported, with no caspase, LDH or viability assay in the abstract, so the model drives the hepatocyte toward death without demonstrating death; the limitations also record that HepaRG carries a different drug-metabolizing enzyme profile from primary human hepatocytes, which matters for acetaminophen. Sterile and Immune-Mediated Inflammatory Amplification is PARTIALLY_RECAPITULATES at LOW fidelity, with the limitation stated plainly that the reported THP-1 activation is driven by exogenous TGF-beta 1 and not by either drug, so the drug-to-inflammation step this node turns on is not itself demonstrated. The fibrosis arm of the same system - stellate activation, matrix output, TGF-beta perturbation - is curated on Liver_Cirrhosis, which is where the paper's primary claim sits. Schema and term validation pass; 35/35 snippets verified against the cached abstract.

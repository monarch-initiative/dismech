  summary: Add the oncogene-dependence and ERK-persistence nodes; replace evidence
    that did not support its node
  details: |
    Three nodes, three evidence items, 30 conformance links including NSCLC, CML, GIST and melanoma. Two of the three evidence items did not support the node they sat on. The trigger node quoted a review's closing sentence about understanding becoming increasingly sophisticated, and the consequence node quoted a sentence about structural diversity in ligand-mediated RTK activation, which bears on how receptors are switched on and not on proliferation continuing without them. The central node quoted the hallmarks list, which establishes that the hallmark exists rather than that the MAPK arm is hyperactivated.

    Evidence repair. Added the Lynch 2004 EGFR-gefitinib series, PMID:15118073, to the trigger node twice - the human result that kinase-domain lesions raise signal output, and the in vitro kinase measurement. Added PMID:25435214 to the central node for MAPK hyperactivation across tumours and the lesions that cause it. Replaced the consequence node's citation with PMID:21376230 for the hallmark being an acquired capability, plus the Lynch response data at directness INDIRECT, since therapeutic response supports the proliferation being driver-dependent by an inference step rather than directly. Left the original PMID:20602996 item on the trigger node, where its claim about pathogenic RTK mutations driving cancer does hold.

    Two new nodes. Oncogene Dependence as a Therapeutic Vulnerability carries the hallmark's clinical corollary, which no node previously stated: chronic flux through a cascade is a chronic requirement for it, so a genomically complex tumour can still be stopped by inactivating one oncogene, and the lesion that creates the hallmark selects the patients in whom blocking it works - eight of nine responders versus none of seven non-responders in the EGFR series. PMID:18451130, PMID:15118073. ERK Signal Persistence and Adaptive Escape records that resistance to pathway inhibitors is usually the central node reasserting itself rather than a new mechanism, since intrinsic and acquired resistance alike travel with ERK signalling persisting through the drug. PMID:25435214, PMID:18451130.

    Also corrected an overstatement the module made throughout. It asserted that each route uncouples mitogenic signalling from the requirement for extrinsic growth factor, which is true of an activating RAS or BRAF substitution and not of the EGFR kinase-domain lesions - those are hyperresponsive to ligand, as the in vitro result in the paper the module now cites states plainly. The description, the trigger node and that evidence item's explanation now carry the distinction and ask a conforming entry to say which route its driver takes, because it decides whether depriving the tumour of ligand is a mechanism at all.

    Validated: validate-module-batch (12 snippets on this file, 0 issues), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms, and the whole-KB snippet gates.

  summary: Add GluN2B/alphaCaMKII->ERK1/2 parallel plasticity arm
  details: |
    Added a transcription-independent effector arm parallel to the BDNF route per issue #15643. New node 'Reduced GluN2B/alphaCaMKII-Dependent ERK1/2 Activation' takes the existing calcium node (conformance target, left unchanged) as its sole upstream edge and the existing plasticity node as its downstream target. GluN2B subunit qualifier carried on the new node, not the subunit-agnostic parent. Tightened the calcium node description from CaMKII to alphaCaMKII. Location bound to cerebral cortex (UBERON:0000956), not the parent's hippocampal formation, since El Gaamouch 2012 is cultured cortical neurons. Evidence: PMID:22855824 (all three issue quotes, verified exact) plus in vivo corroboration PMID:22234183 (GluN2B point-mutant mice, LTP reduced 50 percent). Literature check also surfaced context-dependence (NR2B inhibits Ras-ERK in mature neurons via SynGAP, PMID:15924861), recorded in node prose as a developmental-scope caveat. validate-module-batch: 24 snippets, 0 issues.

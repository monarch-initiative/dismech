  summary: 'Create: NMDA Receptor Hypofunction Module'
  details: |
    Created the mechanism module for suppressed NMDA-receptor glutamatergic signalling, the opposite-sign counterpart of glutamate_excitotoxicity. Six-node chain: NMDA Receptor Antagonism or Receptor Loss (trigger) -> NMDA Receptor Hypofunction (amplifier) -> Reduced NMDA Receptor-Mediated Calcium Influx (central_effector, key conformance target) -> Reduced BDNF Expression and Secretion -> Impaired Activity-Dependent Synaptic Plasticity -> Learning and Memory Impairment. Scope was set by AOP 12 (WPHA/WNT endorsed), whose KE201, KE195, KE52 and KE381 had no dismech module to map to. 19 evidence snippets, all verified against cached abstracts (Alkondon 1990 Pb channel block; Lovinger 1989 ethanol NMDA inhibition; Ikonomidou 1999/2000 developmental window; Hughes 2010 antibody-mediated receptor internalization; Toscano 2005; Neal 2010 and Stansfield 2012 BDNF-TrkB; Lanphear 2005 human IQ). A HUMAN_MODEL_MISMATCH discussion records that the molecular chain is rodent/in-vitro while the human evidence is epidemiological. Validated with linkml-validate, linkml-term-validator, the reference validator, and the causal-target, entity-ref, duplicate-key and enum-value gates.

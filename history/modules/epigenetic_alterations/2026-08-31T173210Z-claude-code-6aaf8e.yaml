  summary: Add turquoise killifish (Nothobranchius furzeri) animal model with modeled_mechanisms
  details: |
    Added a turquoise killifish animal_models entry covering both halves of the module. RECAPITULATES 'Age-Associated Epigenetic Drift' with four readouts: global 5mC declining with age in liver and muscle, coincident decline in maintenance and de novo DNA methyltransferase transcripts, H3K27me3/heterochromatin accumulation in aged skeletal muscle, and loss of euchromatic marks including H3K9ac. RECAPITULATES 'Altered Epigenetic Regulation of Gene Expression' on the integrated RNA-seq/ChIP-seq output. Limitations explicitly record that these are global and tissue-level measurements, not a CpG-resolution methylation clock. Evidence: PMID:34222326 and PMID:31569376; snippets exact-quoted (some from cached full text) and verified.

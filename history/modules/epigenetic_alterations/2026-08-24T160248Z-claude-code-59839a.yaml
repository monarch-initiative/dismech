  summary: 'Correct notes: drop Wiedemann-Steiner and Bainbridge-Ropers as conformers;
    record chromatinopathy scope boundary'
  details: |
    The notes named Wiedemann-Steiner syndrome (KMT2A) and Bainbridge-Ropers syndrome (ASXL3/PR-DUB) as worked conformers attaching at the central node. A sibling change in the same branch retargeted both of those entries to the new epigenetic_machinery_neurodevelopmental_dysregulation module, so those conformance edges no longer exist and this file's notes had become factually false. Corrected: both are dropped from the conformer list, and a scope-boundary paragraph is added stating that a germline lesion in a chromatin-machinery component should conform to the MDEM module rather than here, because this module's explanandum is age-associated partly stochastic drift of a normally-established epigenome. Heyn-Sproul-Jackson syndrome is explicitly retained with the reason given - its DNMT3A gain-of-function hypermethylation is curated as recapitulating age-related methylation gains, i.e. the drift phenotype, not merely as a machinery lesion. No pathophysiology, evidence or ontology bindings were changed; this is a notes-only correction. Raised by review on PR #9378, finding 3.

  summary: Add DNAm PhenoAge clock and ontology/representation gap
  details: |
    Added the DNAm PhenoAge epigenetic clock estimate with two readouts and a KNOWLEDGE_GAP covering both the ontology gap and the representational one. Source: PMID:29676998. Binding decision recorded in the entry notes: NCIT has no term for an epigenetic clock or for biological age, so the assay NCIT:C63328 DNA Methylation Analysis is bound and the clock identity carried in preferred_term. NCIT:C17961 DNA Methylation and NCIT:C16269 Aging were both considered and rejected because neither is the measurement. Readouts: READOUT_OF Age-Associated Epigenetic Drift under CANDIDATE_SURROGATE since no clock has been qualified as a surrogate for any clinical outcome, and CORRELATES_WITH Epigenetically Driven Cellular Decline under MONITORING. The second readout cites the transcriptional analysis linking epigenetic age acceleration to raised pro-inflammatory and interferon programmes and lowered DNA-damage-response and mitochondrial signatures, which connects this module to inflammaging and mitochondrial_dysfunction. Note this also supersedes the Franceschi 2018 claim, deliberately not curated earlier in this branch, that the DNA-methylation-age and inflammaging relationship had not been investigated. The knowledge gap records that a clock is a penalized regression over hundreds of CpGs rather than an analyte, so the same objection applies to frailty indices, composite panels and multimorbidity counts: dismech has no class for a computed index over other measurements. Flagged for the decision register. Validation: just validate with 16/16 snippets verified, validate-terms, check-entity-refs, check-duplicate-keys and the whole-KB snippet gates all pass.

  summary: 'Review round 1: D2 receptor antagonism module'
  details: |
    Review round 1 on PR #15299. Both blocking findings were prose defects in the module file and both were mine. (1) The description named two different nodes as the key conformance target: the summary line and the central-effector node's own description named the central effector, while the closing line named the trigger. Resolved toward the central effector, which is what at1_receptor_blockade and glp1_receptor_agonism both do, and the closing line now also records that an entry whose node represents the drug's receptor occupancy anchors at the trigger instead - the two are different claims rather than a disagreement, which is why those two modules are consistent despite their conformers also anchoring at the trigger. The reviewer proposed resolving the other way, toward the trigger, on the grounds that the four conformers anchor there; taking that would have made this module the odd one out in its own series. (2) Chemotherapy_Induced_Nausea_and_Vomiting straddled a line break inside a single-quoted scalar, so notes loaded as Chemotherapy_Induced_ Nausea_and_Vomiting with an injected space, naming a slug that does not exist. This is the folded-word corruption class on the underscore character, which check-folded-hyphens does not fingerprint and which no entity-reference check sees, because a slug in prose is not an entity reference. Rewrapped so the name sits on one line; verified through yaml.safe_load on the loaded value. The reviewer's own suggestion block had reworded the preceding clause, and it flagged that itself, so only the wrapping changed. Three non-blocking notes were left as they are and answered on the PR: grading the PET-occupancy quotes HUMAN_CLINICAL plus REVIEW_SYNTHESIS instead of OTHER, which the reviewer itself identifies as the settled pattern across the sibling GPCR modules and a separate pass; the shared conformer node name in Cannabis_Hyperemesis_Syndrome, where the node description already states the antiemetic indication; and the emesis arm having no conformer, which notes already explains.

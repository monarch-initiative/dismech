  summary: 'Create: D2 receptor antagonism module'
  details: |
    Creates kb/modules/d2_receptor_antagonism.yaml, the fifth GPCR drug-mechanism module in the GPCR project. Six nodes organised around the therapeutic window rather than around territory: striatal D2/3 antagonist occupancy (trigger, GO:0001591 DECREASED, DRD2, UBERON:0002435) to loss of D2-mediated Gi/Go inhibition of adenylyl cyclase (central effector, GO:0007195 DECREASED, the key conformance target), then antipsychotic response above an occupancy threshold, extrapyramidal effects at higher occupancy, and suppression of emesis; the prolactin arm hangs off the trigger instead, because the anterior pituitary lies outside the blood-brain barrier and is reached at concentrations the striatal occupancy figure does not predict. Three references, all newly fetched: PMID:19689327 (PET/SPECT imaging review, which supplies the trigger, the threshold, the therapeutic window and the necessary-but-not-sufficient bound), PMID:31106995 (P-glycoprotein and prolactin elevation), PMID:37584820 (D2 receptors in the vomiting act). Every snippet is taken from the abstract rather than the full text, because module validation matches against abstracts; PMID:19689327 is cached as full text and carries per-outcome occupancy percentages there, which are deliberately not quoted or paraphrased anywhere in the module. Three things declined and recorded in notes: the mesolimbic-versus-nigrostriatal split, which no cited sentence supports; tardive dyskinesia, whose mechanism the literature does not settle; and the non-D2 pharmacology of the atypicals. One defect caught in self-review before validation: metoclopramide's CHEBI id was written from memory as CHEBI:6801, which is metformin. It was corrected to CHEBI:107736 by lookup. Worth recording because CHEBI:6801 is already in the committed chemicalentityterm enum cache, so term validation would have raised only a label-mismatch WARN rather than a hard ERROR - the severity asymmetry CLAUDE.md describes, on a wrong drug in a treatment block.

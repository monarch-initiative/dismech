  summary: 'Create: focal_axonal_injury_wallerian_degeneration'
  details: |
    Created the acute focal axon-injury module called for by design decision
    section 3f and the traumatic brain injury pilot spec: six nodes from focal
    axonal injury through transport interruption with cargo accumulation, loss
    of the labile survival factor NMNAT2, SARM1 activation with axonal NAD+
    depletion (the central effector and key conformance target), Wallerian
    degeneration of the distal axon, and disconnection of neural circuits, wired
    as a linear downstream chain with bare-name targets. Each node and each edge
    carries evidence; 28 snippets over 13 PMIDs, all exact substrings of the
    cached references fetched for this change.

    The description states explicitly how the module differs from
    peripheral_axonal_degeneration and corticospinal_tract_axonopathy, which
    model slow length-dependent dying-back of long axons from a distributed
    insult rather than destruction of everything distal to a single focal lesion.
    The trigger node is written to admit mechanical stretch or shear,
    transection, crush and inflammatory attack, so spinal cord injury,
    peripheral nerve crush and inflammatory axon transection can enter it;
    human evidence is present at the trigger (multiple sclerosis lesion
    transection, human postmortem traumatic axonal injury), at the
    transport-interruption amplifier (beta-APP marking damaged axons in injured
    human white matter), at the Wallerian-degeneration effector, and at the
    consequence node. The two molecular nodes rest mainly on mouse genetics and
    neuronal culture, so a HUMAN_MODEL_MISMATCH discussion attached to the SARM1
    and NMNAT2 nodes records that gap and what would close it.

    A treatments entry records small-molecule SARM1 NADase inhibition with
    target_mechanisms INHIBITS on the central effector node, bound to
    NCIT:C15986 Pharmacotherapy with no therapeutic_agent because the cited
    inhibitor is an unnamed isoquinoline compound; both the treatment
    description and the module notes state it is preclinical. Ontology terms
    (GO biological processes, molecular functions and cellular components, CL
    neuron, UBERON white matter / corpus callosum / nerve, and HGNC SARM1,
    NMNAT2 and APP gene descriptors) were each looked up against OLS, the
    configured OAK adapters or the HGNC REST API when written; biological_scale
    is set on every node.

    Validation on this file: linkml-validate against Disease reported no issues;
    linkml-term-validator validate-data --labels passed; count-verified-snippets
    reported 28/28 verified; check-entity-refs, check-causal-targets and
    check-duplicate-keys all OK; normalize-cache left the caches clean after the
    additive GO, HGNC and enum-cache rows this change introduced. No disorder
    file was touched, so no conformer is wired yet.

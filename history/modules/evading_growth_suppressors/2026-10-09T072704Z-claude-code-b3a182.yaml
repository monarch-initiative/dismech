  summary: Add the CDK4/6 vulnerability and its resistance node, with the RB-status
    condition
  details: |
    Four nodes, 20 conformance links, and no therapeutic node - which looks defensible for a loss-of-function hallmark, since there is no inhibitor of an absent tumour suppressor. The exception is real and the module was missing it: the brake can be reimposed at the point where it is enforced rather than where it was lost.

    CDK4/6 Dependence of an Intact RB Brake (therapeutic_vulnerability; GO:0000082 G1/S transition, GO:1904030 negative regulation of cyclin-dependent protein kinase activity) records that a cell whose lesion lies upstream of RB - CDKN2A deletion, cyclin D or CDK4/6 amplification - still runs G1/S through that kinase step, so palbociclib, ribociclib or abemaciclib can hand the restraint back, while a cell with no functional RB has nothing to hand it to. PMID:27017286 three times.

    The condition is the whole content of the node, and writing it exposed a real defect in the module's existing prose: the trigger node and the description list biallelic RB1 loss alongside cyclin D amplification as routes to the same central node, which is true of the central node and false here. Retinoblastoma and a CDKN2A-deleted tumour converge on lost checkpoint control and diverge completely on whether this vulnerability exists. The notes now ask a conforming entry to say which side of RB its lesion sits on and name both worked cases.

    Restored G1/S Transit and Resistance to CDK4/6 Inhibition (adaptive_escape; GO:0000082 INCREASED) records resistance as this module's own mechanism recurring one step lower - RB loss, p16 amplification, CDK4/6 amplification, cyclin E-CDK2 bypass - plus the off-cycle FGFR and PI3K/AKT/mTOR routes, which is the point where this module meets sustaining_proliferative_signaling and its ERK-persistence node. PMID:36030016 three times, including the de novo and acquired rates, which is what stops a conforming entry treating RB status as a fixed property of the tumour.


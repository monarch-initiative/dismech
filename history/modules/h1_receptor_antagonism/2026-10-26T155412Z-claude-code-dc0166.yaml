  summary: 'Create: H1 Receptor Antagonism Module'
  details: |
    Ninth GPCR drug-mechanism module, from the Workstream A queue of projects/GPCR.md. The table listed H1 and H2 antagonism as one candidate row; they are two modules, by the one-receptor-plus-one-direction rule the page records. H2 sits on a different receptor on a different cell with a disjoint effector chain, gastric parietal-cell acid secretion, and a disjoint conformer set. Five nodes, built around the fact that decides this class clinically: the same receptor in two compartments. Peripheral occupancy removes the histamine-driven vasodilatation, plasma extravasation and itch that make a weal, which is the benefit; central occupancy, measured directly by PET rather than inferred from symptoms, produces sedation and cognitive impairment, which is the cost and the reason the class splits into brain-penetrating and non-penetrating agents. The central effector is graded INDIRECT on every item because its sources describe the unblocked mechanism rather than the blocked one. No transducer is asserted anywhere: no cited abstract states the receptor's coupling, and module snippets match the abstract, so the signalling is left unasserted rather than filled in from general knowledge. Two treatments, one per generation, kept apart because the platform is the same while the reason for prescribing is opposite. Four references, 14 evidence items, all snippets and titles verified against the abstract on the first pass.

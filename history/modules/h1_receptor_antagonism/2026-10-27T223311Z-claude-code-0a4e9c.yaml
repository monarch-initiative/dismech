  summary: Correct the notes passage saying bundled H1+H2 treatments cannot conform
  details: |
    The module's notes recorded that three named mast cell entries treat with H1 and H2 antihistamines bundled into one treatment and that 'none can be routed to an H1-only occupancy node without asserting H1 action for an H2 drug', with splitting those treatments listed as the prerequisite. Both halves were wrong, and all four such entries now conform to this module's trigger.

    What the passage missed is that a bundled treatment binding its components as separate agents already says which drug acts where, so the treatment can carry one target_mechanisms link per receptor and the link to this module's trigger asserts nothing about the H2 agent beside it. Three of the four entries already bound their agents separately; the fourth had agents missing, which were bound from its own citation. Splitting is positively the wrong move in two cases: Systemic_Mastocytosis' evidence is strategy-level rather than class-specific, so split halves would carry no evidence, and Monoclonal_Mast_Cell_Activation_Syndrome's cited sentence is a diagnostic criterion about the bundle as a whole.

    The notes now state that, and state what does hold the H2 side back: the H2 module's scope. h2_receptor_antagonism is a gastric acid-suppression chain, while these entries use H2 blockade for histamine-driven gastrointestinal symptoms without establishing the acid pathway, so an H2-mediated-symptom module distinct from acid suppression is what that side needs.

    The description also carried a stale conformer count, 'both current conformers do this', which was already out of date before this change and is now dropped rather than renumbered, since a count in a description goes stale every time an entry conforms.

    This matters beyond tidiness because CLAUDE.md makes a module's description and notes the authoritative statement of its scope and the thing a curator reads before conforming. Leaving the passage would have told the next curator to split treatments that should not be split.

  details: |
    Applied all four items from the first review of PR #15686.

    Blocking item 1. 'Sedation and Anticholinergic Effects of Brain-Penetrating Antihistamines' bundled two
    consequences of two different receptors behind one edge from central H1 occupancy, so the module asserted
    that H1 blockade causes thirst and tachycardia. Split into 'Sedation and Cognitive Impairment from Central
    H1 Occupancy', which keeps that edge, and 'Anticholinergic Effects of First-Generation Antihistamines',
    which has no upstream edge at all. The antimuscarinic step is conventionally the explanation but no cited
    abstract states it, so it is left unasserted and the node description says so -- the same decision already
    taken for the H1 receptor's transducer.

    Blocking item 2. The central effector bound CL:0000097 mast cell, which is the histamine source upstream
    and not a cell the drug acts on. Replaced with the cells the snippets name: CL:0000071 blood vessel
    endothelial cell (the abstracts say 'blood vasculature' and 'blood vessels', so the blood-vessel-specific
    term is better supported than the plain endothelial-cell term the review suggested) and CL:0000101 sensory
    neuron. Both verified in cache/cl/terms.csv. Reworded the PMID:34536239 explanation, which argued for the
    mast-cell binding.

    Suggestion, taken. Dropped locations: dermis from the trigger node. The trigger is drug occupancy wherever
    the receptor is and both the peripheral and the central arm hang off it, so one tissue contradicted its own
    children. Dermis stays on the peripheral effector and on the Urticaria conformer.

    Suggestion, premise corrected. The review proposed a note recording that no GO term fits itch. A search
    found GO:0160025 sensory perception of itch, which resolves and is admissible in BiologicalProcessTerm, so
    the term is bound DECREASED on the central effector rather than a false negative-existence note being
    written. The node now binds all three components of the triad.

    Validation: validate-module-batch 15/15 snippets verified against abstracts only, 15/15 titles; validate-terms
    passed and wrote the GO:0160025 cache rows; duplicate-keys, entity-refs, causal-targets, enum-values,
    block-scalar-comments, coarse-phenotypes, qualifier-terms and delivery-system all clean.

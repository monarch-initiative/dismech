  summary: 'Add three module-level environmental: entries for the inflammatory exposure
    classes (#10959)'
  details: |
    Added three environmental: entries, each with a bound ECTO exposure_term and each linked by influences_mechanisms (TRIGGERS, causal_link_type DIRECT) to the module's opening trigger node 'Chronic Inflammatory Stimulus'. Second pass on the scope proposed in #10959; PR #11252 left this module because no single generic ECTO term covers its exposure classes.

    The resolution is that the module does not need one generic term. Its own description enumerates the classes, so each bindable class gets its own entry: Chronic Tobacco Smoke Exposure (ECTO:6000029), Inhaled Asbestos Exposure (ECTO:9000033), and Persistent Helicobacter pylori Infection (ECTO:3000003). Three parallel exposures across different tumor types is the module's conserved claim, and is what keeps it from reading as a single-disease entry.

    All six evidence items are drawn from PMID:20303878 (Immunity, inflammation, and cancer), a pan-cancer review already the module's principal source, rather than from a gastric, lung or hepatic paper. This is the trap #10959 names: the natural citation for an H. pylori claim is usually a gastric-cancer paper, and using one would quietly make the module a gastric-cancer entry. Two snippets carry the review's own attribution to Aggarwal et al. and Takahashi et al. inside the quote, so a cited figure is not presented as the review's own finding. The asbestos link explanation records that the review hedges the onward tumorigenic step; the link is scoped to the inflammatory trigger and does not carry the hedged claim.

    Dispositions recorded in review_notes on the Helicobacter entry, not notes: hepatitis B and C virus and Schistosoma have no ECTO exposure term and are not modeled as separate entries; inflammatory bowel disease and chronic pancreatitis are deliberately not modeled as exposures at all, being disease states for which an exposure entry is the wrong shape.

    Validated: just validate (10/10 snippets verified), check-environmental-evidence, check-entity-refs, check-causal-targets, check-duplicate-keys, check-enum-values, check-snippet-grading, check-snippet-length, check-title-snippets, check-reference-titles, check-folded-hyphens, check-snippet-boundaries, check-term-cache-integrity, environmental-term-audit, pytest tests/test_data.py (6353 passed).

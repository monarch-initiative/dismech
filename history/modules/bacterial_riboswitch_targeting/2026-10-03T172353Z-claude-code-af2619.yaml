  summary: 'Create: bacterial_riboswitch_targeting module'
  details: |
    Antibacterial drug-mechanism module for riboswitch-targeting compounds, built to the target-class pattern of the sibling antibacterial modules (cell wall, ribosome, topoisomerase, RNA polymerase, folate) but naming a regulatory RNA target rather than a protein one.

    Six nodes: the riboswitch target itself (key conformance target, role therapeutic_vulnerability), ligand-mimetic aptamer occupancy (central_effector), repression of the metabolite biosynthesis and uptake genes, flavin cofactor starvation and growth arrest, and two escape nodes - exogenous metabolite salvage and target-site resistance mutation. The salvage node is specific to an RNA regulatory target gating a metabolite the organism can also import, and has no counterpart in the protein-target modules; it is what limits the spectrum.

    Four treatments, all preclinical and labelled as such: the ribocil series (no CHEBI class, so free-text therapeutic_agent with no term binding - CHEBI searched via OLS4 exact=true on 2026-10-03, no hits), roseoflavin (CHEBI:72346), an FMN riboswitch-directed pVEC-conjugated chimeric ASO, and the T-box riboswitch inhibitor T-box-i. Roseoflavin is deliberately annotated as multitarget rather than a clean riboswitch inhibitor, carrying a REFUTE item against the narrower attribution, because its flavin derivatives also inactivate flavoenzymes and the bacterial-human flavoenzyme conservation is a stated safety concern.

    One KNOWLEDGE_GAP discussion on the salvage node records a live disagreement in the literature: the dual-targeting work argues that engaging the biosynthesis and uptake riboswitches together overcomes riboflavin scavenging in Gram-positive organisms, while the Gram-negative work argues scavenging makes the target unsuitable there. No cited experiment separates the two predictions, so the module does not pick a side, and the gap states the experiment that would.

    Evidence: 8 references fetched via just fetch-reference (PMID 26416753, 27485612, 28434876, 29736707, 32432858, 25121086, 40962680, 41411532; 25121086 fetched during scoping and not cited in the end). 25 snippets and 25 reference titles verified exact by linkml-reference-validator. GO bindings (GO:0031555, GO:0010181, GO:0009231, GO:0032218, GO:0009398, GO:0006747, GO:0046677) each resolved before writing - from cache/go/terms.csv where present, otherwise the OLS4 API - and linkml-term-validator passes.

    Wired one conformer, Klebsiella_Pneumonia, where the evidence is an in vitro susceptibility panel of 54 multidrug-resistant clinical isolates plus the aptamer conservation figures that make the vulnerability genus-specific. Furunculosis (S. aureus) is a candidate conformer but was deliberately left unwired in this change: the FMN riboswitch route there is exactly what the recorded disagreement is about, and the T-box route would be a separate claim needing its own evidence.

  summary: 'Review round 1: fix unsupported modifier and withdraw a negative-existence
    claim'
  details: |
    Addressed both blocking items and all five suggestions from the automated review on PR #13459 in one push.

    Blocking 1, the salvage node asserted modifier INCREASED on GO:0032218 riboflavin transport while the node directly upstream of it asserted DECREASED on the same term, and no cited snippet stated an increase. The reviewer was right that the sources say the uptake route stays open, not that it is upregulated. Dropped the modifier rather than adding a derepression claim, because derepression under flavin starvation would be a coherent mechanism but is an inference none of the cited sources states.

    Blocking 2 was a negative-existence claim and the reviewer was right to stop it. The discussion rationale asserted that no published report tests a dual-engaging compound against a Gram-positive infection in an animal model. PMID:28434876 is titled 'in an Infectious Setting', is MeSH-indexed for Mice, and claims pharmacological evidence, so that absolute was unsupported by the very paper the gap cites. Attempted the full text four ways: Cell Press returns HTTP 403 to both curl and WebFetch, the article is in neither PMC (elink returns only pubmed_pmc_refs, no pubmed_pmc) nor Europe PMC open access (inEPMC=N, isOpenAccess=N), and the bgpt full-text evidence service refused on a free-tier limit. So the design detail the two predictions diverge on could not be checked, and the claim is withdrawn rather than narrowed.

    The rewritten rationale now states the opposite of what it did: in vivo work with the dual-engaging compounds exists, the dispute is over how to read it, and the full text was unreachable from this curation environment - recorded as a limit of the pass so the next curator checks it rather than inheriting the gap. It is anchored on a new evidence item from PMID:32432858, whose full text is in the cache: that group, writing three years after the dual-targeting work and citing it, still says scavenging tempers enthusiasm for the FMN riboswitch target in S. aureus. A later group reading the earlier result and not treating it as settled is better support for an interpretive disagreement than my asserted absence was, and it is checkable from the repository.

    Suggestions taken, all five. Added quote_role BACKGROUND to the roseoflavin REFUTE item. Re-graded the companion item from that paper REVIEW_SYNTHESIS to BACKGROUND, since the reviewer correctly noted PMID:27485612 is a primary RNA Biol paper rather than a review, which is what REVIEW_SYNTHESIS is defined for. Completed the ribocil negative search with NCIT, the other vocabulary ChemicalEntityTerm admits: exact=true for ribocil, ribocil-C and Ribocil C-PA, plus a non-exact ribocil query, no hits in any of the four. Added proposed_experiments structuring the experiment that was previously only in rationale prose, with would_support and would_refute pointing at the two competing nodes. Added a clause to the occupancy node saying the FMN-binding GO term is the aptamer's own function and not a claim that the drugs are FMN analogues.

    Validation after the changes: linkml-validate clean on both files (the first attempt caught supporting_outcome and refuting_outcome being multivalued, now lists), linkml-term-validator passes, reference validation 26/26 snippets and titles on the module and 33/5 on the disorder with 0 issues, and the duplicate-key, entity-ref, causal-target, qualifier-term, delivery-system and folded-hyphen gates pass.

  summary: 'Create: mu_opioid_receptor_antagonism'
  details: |
    Created kb/modules/mu_opioid_receptor_antagonism.yaml, the antagonism sibling of mu_opioid_receptor_agonism, following the GPCR project decision that agonism and antagonism of one receptor are separate modules because their consequence chains differ rather than inverting. Ten pathophysiology nodes: a competitive antagonist-occupancy trigger bound to OPRM1 (hgnc:8156, the identifier the agonism module binds); a central effector, Loss of Gi/o Signalling and Restored Neuronal Excitability, that is the explicit inverse of the agonism module's hyperpolarization node and is the key conformance target; and four branches - brainstem respiratory rhythm restoration to reversal of opioid-induced respiratory depression, locus coeruleus noradrenergic rebound to precipitated withdrawal, blockade of opioid and endogenous-opioid reward signalling to reduced reinforcement and relapse prevention, and enteric receptor blockade to relief of opioid-induced constipation. Four treatments point at the trigger node with treatment_effect ACTIVATES (naloxone, nalmefene, extended-release naltrexone, and the PAMORAs methylnaltrexone/naloxegol/naldemedine), so what distinguishes them on one node is duration of occupancy and blood-brain-barrier exclusion rather than receptor mechanism. Buprenorphine and the other partial agonists stay in the agonism module. The nalmefene entry records both sides of the live dispute over whether its higher affinity and longer duration are an advantage in overdose, including a REFUTE evidence item from the two toxicology societies' position statement. The reward branch stops at blockade of the dopamine reinforcement signal and defers the circuit consequences to addiction_cycle, which already carries its own opioid-antagonist treatment entry; nothing there was re-modelled. Two consequence nodes carry no biological_processes term because GO has no opioid-withdrawal or drug-reinforcement process; the searches run are recorded verbatim in the module notes. Evidence: 35 snippets across 15 references, all fetched with just fetch-reference and all 35 verified as exact substrings of their cached text. Validation run: validate-module-batch (schema, terms, references: 35/35 snippets, 35 titles, 0 issues), count-verified-snippets 35/35, check-causal-targets, check-entity-refs, check-duplicate-keys, check-enum-values, check-block-scalar-comments, check-snippet-length, check-title-snippets, check-snippet-grading, check-retired-support-prose. No conformers were wired in this change and neither the agonism module nor projects/GPCR.md was edited, to avoid conflicting with the open PR that adds them.

  summary: 'Review round 1: split the central effector into three trunk nodes'
  details: |
    Automated-reviewer round on PR 14456. Blocking change, taking the reviewer's first option: the single node 'Loss of Gi/o Signalling and Restored Neuronal Excitability' bundled three mechanistic claims and had no 1:1 counterpart in mu_opioid_receptor_agonism, whose trunk is three nodes. It is split into 'Loss of Gi/o Coupling and Relief of Adenylyl Cyclase Inhibition' (amplifier, MOLECULAR, GO:0031635 DECREASED), 'GIRK Closure and Recovery of Presynaptic Calcium Current' (amplifier, MOLECULAR, GO:0015467 DECREASED and GO:0005245 INCREASED as molecular_functions, the same two terms the agonism module binds with the modifiers reversed) and 'Restored Neuronal Excitability' (central_effector and key conformance target, CELLULAR, GO:0060081 DECREASED and GO:0007269 INCREASED), chained trigger to first to second to third with the four tissue branches now hanging off the third. Every reference to the old node name was repointed: the trigger's downstream target, the knowledge-gap discussion's attaches_to and its experiment's would_support, the top-level description and the INVERSE NODES paragraph in notes, which now states the five one-for-one inversions and says why the agonism module's analgesia and desensitization branches have no inverse here. The two new amplifier nodes needed their own evidence rather than inherited evidence, so two references were fetched: an in vitro receptor-pharmacology study measuring naloxone and nalmefene by the concentration at which they relieve agonist-driven cAMP inhibition, and a brainstem study identifying the opioid-evoked outward current as a barium-sensitive GIRK conductance and showing an antagonist reversing within minutes the respiratory effect attributed to it. Two review sentences from the molecular-mechanisms review the agonism module already cites carry the Gi coupling and the G beta-gamma calcium block in the agonist direction, both marked INDIRECT because the claims here follow from removing what those sentences assert. The two original evidence items stay on the central effector, where they bear on hyperpolarization and on firing above baseline after antagonist-precipitated withdrawal. Reviewer suggestion on the nalmefene position-statement item: it was recorded as REFUTE of a superiority claim the entry does not make, so it is now SUPPORT with directness INDIRECT, supporting the entry's recorded caveat that the balance is unsettled; no retired grade name appears in the prose. Reviewer suggestion on the reward branch: the GO response-to-morphine binding is dropped, the branch keeps GO:0014046 dopamine secretion plus prose, and the notes now record that neither that term nor conditioned place preference is bound anywhere in this module. Reviewer suggestion on the two reference-cache files: the whitespace rewrite and the extractor_version line were written by just fetch-reference and by the fix-references-cache step inside validate-module-batch, not by hand, and are left as the tooling produced them. Evidence is now 40 snippets across 17 references, all 40 verified against cached text. Validation re-run: validate-module-batch (schema, terms, references 40/40 snippets and 40 titles, 0 issues), count-verified-snippets 40/40, check-causal-targets, check-entity-refs, check-duplicate-keys, check-enum-values, check-block-scalar-comments, check-snippet-length, check-title-snippets, check-snippet-grading, validate-history. check-retired-support-prose still exits 1 on two mentions in kb/disorders/Neuroblastoma.yaml that this branch does not touch; they are an artefact of the branch being behind origin/main, where that prose has since been cleaned up, and this module file contains no such mention.

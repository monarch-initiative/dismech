  summary: 'Review round 1: Sperm Flagellum Assembly Failure Module'
  details: |
    Review round 1. The MMAF node said sperm counts are usually preserved, with no evidence; PMID:36425067, already cited in the module, says some MMAF patients have extremely low sperm concentration with head defects, so the sentence now says concentration varies with the gene and quotes that sentence, and the notes no longer contrast patients with oligozoospermic mice. Split the consequence node into Asthenozoospermia (CELLULAR, flagellated sperm motility) and Male Infertility (ORGANISM); ICSI now bypasses Male Infertility, and SPGF43's existing Male Infertility node conforms to it. The review also asked whether SPGF43, SPGF49 and SPGF98 justify a dual anchor to ciliopathy_dysfunction: SPEF2 (SPGF43) and CFAP54 (SPGF98) have documented PCD, CFAP58 (SPGF49) has no airway phenotype in its entry; that pre-existing anchor was left for a separate review rather than changed here.

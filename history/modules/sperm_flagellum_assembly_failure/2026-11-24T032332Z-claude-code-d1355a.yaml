  summary: 'Create: Sperm Flagellum Assembly Failure Module (MMAF)'
  details: |
    New mechanism module for multiple morphological abnormalities of the sperm flagella (MMAF). Motivated by about twenty numbered spermatogenic failure entries that already share node names (Multiple Morphological Abnormalities of the Sperm Flagella in about twenty, Sperm Axonemal Disorganization in about eight) with no module to conform to; two of them had conformed their MMAF node to ciliopathy_dysfunction#Motile Cilia Beat Dysfunction, which models beat failure of an assembled motile axoneme rather than failure to build the sperm flagellum. Chain: Loss of a Sperm Axonemal or Peri-Axonemal Protein (trigger) -> Defective Cargo Delivery to the Growing Flagellum (amplifier, IFT/IMT) -> Sperm Axonemal Disorganization (central_effector, the key conformance target) -> Multiple Morphological Abnormalities of the Sperm Flagella (effector) -> Asthenozoospermia and Male Infertility (consequence), with ICSI as a BYPASSES treatment on the infertility node. No deep-research run; evidence is from reviews (Toure 2021 Hum Genet, the 2024 Genes and 2022 Front Genet reviews, marked REVIEW_SYNTHESIS) and primary papers already cached (DNAH1 Ben Khelifa 2014, CFAP69 2018, Ift88 mouse 2015, CFAP43 IMT mouse 2020, the CFAP43/44 ICSI cohort). Wired 20 spermatogenic failure entries with conforms_to on exact-name or clearly equivalent nodes; the existing ciliopathy_dysfunction references on SPGF43, SPGF49, SPGF72 and SPGF98 were kept and converted to lists. check-conformance-content reports 21 of 35 links process_absent, mostly conformers binding the more specific sperm axoneme assembly term or binding only cellular components; report-only. Validated with validate-module-batch (19/19 snippets) and validate-disorders on all 20 conformers (983 snippets).

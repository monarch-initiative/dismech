  summary: 'Create: glymphatic_dysfunction mechanism module'
  details: |
    Created the glymphatic_dysfunction mechanism module in response to the kgap-scan scope issue #6480 (seed review PMID:42419635). Five-node chain: sleep disruption / loss of sleep-dependent glymphatic drive (trigger) -> perivascular AQP4 depolarization and reduced periarterial CSF influx (amplifier) -> impaired perivascular CSF-ISF exchange and solute clearance (central_effector, key conformance target) -> accumulation of aggregation-prone interstitial proteins (effector) -> neuroinflammation and progressive neurodegeneration (consequence). The three controversies the seed review flags are curated structurally rather than dropped: bulk flow vs diffusion as competing mechanistic_hypotheses (convective_glymphatic_transport CANONICAL vs diffusive_parenchymal_transport ALTERNATIVE) plus a CONTROVERSY discussion; species/model translatability as a HUMAN_MODEL_MISMATCH discussion; and imaging-biomarker validation as a KNOWLEDGE_GAP discussion. Each discussion carries a proposed_experiments block. Counter-evidence is recorded explicitly (PMID:28826498 curated as REFUTE on the AQP4-dependence node). All 29 snippets verified as exact substrings of cached abstracts; schema, term, and reference validation all pass.

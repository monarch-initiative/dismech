  summary: 'Create: dopamine receptor agonism module'
  details: |
    New drug-mechanism module for direct D2/D3 agonist activation, the agonist counterpart of d2_receptor_antagonism. Eight nodes: trigger (agonist receptor occupancy, GO:0001591 INCREASED, DRD2 + DRD3), central effector (GO:0007195 INCREASED, signalling independent of presynaptic dopamine), a striatal branch (motor-complication trade-off, impulse control disorders, somnolence and oedema, nausea and vomiting) and a pituitary branch (lactotroph prolactin suppression into normoprolactinaemia and restored gonadal function). Four treatments: non-ergot agonists, apomorphine rescue, ergot agonists for hyperprolactinaemia, agonists for restless legs. Evidence is deliberately two-sided: CALM-PD supplies both the dyskinesia benefit and the inferior UPDRS control. No anatomical site bound on the emesis node and no receptor gene on the impulse-control node, because no cited source supports either attribution. Validated with just validate (schema, terms, 16/16 snippets), check-duplicate-keys, check-entity-refs and check-causal-targets.

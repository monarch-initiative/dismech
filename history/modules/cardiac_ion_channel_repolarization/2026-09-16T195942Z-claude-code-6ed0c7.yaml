  summary: Add adrenergic and cAMP-dependent triggering node, conforming to the new
    cAMP/PKA module
  details: |
    Added one pathophysiology node, Adrenergic and cAMP-Dependent Triggering (role trigger, biological_scale MOLECULAR), between the variant trigger and the Altered Action Potential and Calcium Handling node. It declares conforms_to cardiac_camp_pka_calcium_handling#PKA Activation and Phosphorylation of the Calcium-Handling Apparatus, which is this module's only module-to-module conformance and is how the cAMP/PKA arm is referenced rather than duplicated. The node fills a gap this module already had, independently of the AOP-Wiki work that prompted it: the module opened at a germline variant and never said what converts a primed channel into a beat, although in CPVT and LQT1 the events cluster on exertion and the resting heart is unremarkable. Evidence: PMID:32115705 for the catecholamine-to-triggered-beat chain, and two items from PMID:11136691 carrying both the LQT1 exercise clustering (62 percent of events) and its limit, the near-reversal in LQT2 and LQT3 where most events occur at rest. The second item is deliberately curated as the node's counter-evidence so a later curator does not conform an LQT2 or LQT3 entry on the strength of the LQT1 pattern. Also updated the module description and notes to name the new arm and the reason it lives in a separate module. Validated with just validate-module: schema clean, term validation passed, reference validation reported Snippets checked 18/18 verified against cached references.

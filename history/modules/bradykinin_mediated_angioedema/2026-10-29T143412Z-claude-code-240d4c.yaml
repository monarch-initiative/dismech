  summary: 'Create: Bradykinin-Mediated Angioedema module'
  details: |
    New mechanism module for bradykinin-mediated angioedema, generalizing the conserved contact-system cascade shared by the hereditary and acquired angioedema entries. Chain: Kallikrein-Kinin Contact System Activation (trigger) -> Bradykinin Overproduction via Kininogen Cleavage (amplifier) -> Excess Bradykinin B2 Receptor Signaling (central_effector, KEY conformance target) -> Endothelial Adherens Junction Destabilization (effector) -> Vascular Hyperpermeability and Angioedema (consequence). The key node is etiology-agnostic: overproduction (C1-INH loss or contact-factor GOF) and impaired degradation (ACE-inhibitor angioedema) both converge there. Nodes bind GO processes + CL cell types only; etiology-specific genes (SERPING1, F12, KNG1, ANGPT1, HS3ST6) are described in prose as conformer substitutions. Drug-target pattern: icatibant (B2 antagonist) on the key node, plasma kallikrein inhibitors (ecallantide/lanadelumab/berotralstat) on the amplifier. Evidence from two independent exemplars (hereditary and acquired C1-INH-deficiency angioedema); every snippet exact-quote verified and graded to match the existing entries (no cross-file snippet-grading divergence). Complementary to complement_dysregulation (low C4/C1q is a diagnostic readout, not the swelling mechanism). module_categories IMMUNOLOGY + PHARMACOLOGY. Review round 1: added the verified FAST-2 efficacy quote (PMID:20818888, HUMAN_CLINICAL, directness INDIRECT) to the key node so the treatment-response validation of B2 signaling is sourced rather than implied by the "selective antagonist" explanation; added quote_role BACKGROUND to the PMID:19796797 B2 sentence and corrected its characterization (the study covers hereditary and acquired C1-INH deficiency, not acquired alone). Declined two non-blocking suggestions with reasons on the PR (a second bradykinin/VE-cadherin quote on the key->effector edge, and an HP phenotype anchor on a pathophysiology node). Also wired three further HAE nodes and two further AAE nodes beyond the key node.

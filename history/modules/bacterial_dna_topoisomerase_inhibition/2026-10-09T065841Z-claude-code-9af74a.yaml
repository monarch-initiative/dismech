  summary: Add the bactericidal consequence node to the fluoroquinolone module
  details: |
    The module had two nodes: the drug target and target resistance, with the target node's only downstream edge pointing at resistance. So the chain said what fluoroquinolones bind and how bacteria escape, and nothing about why the drug works. Added a consequence node, Chromosome Fragmentation and Quinolone-Mediated Killing, between them, bound to GO:0008219 cell death and GO:0009432 SOS response, both INCREASED.

    The node's substantive content is the bacteriostatic/bactericidal split that the previous chain collapsed. The trapped cleavage complex is reversible and at low drug concentration only blocks replication; killing needs the further, concentration-dependent release of the broken ends from topoisomerase constraint. Evidence: two PRIMARY_RESULT items from PMID:16803589, which measured that both lethal pathways track irreversible chromosome fragmentation and that the trapped complex holds the DNA ends by protein, and two REVIEW_SYNTHESIS items from PMID:33081547 for the growth-block arm and the concentration dependence. GO:0009432 was verified against ols:go before binding; it was not in cache/go/terms.csv.

    Also extended the module description to state the three-step chain, since the description is the authoritative scope statement and previously implied a two-step one. Validated with just validate-module-batch (7 snippets, 0 issues), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-qualifier-terms.

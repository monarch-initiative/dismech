  summary: Add IGF-1, insulin and HbA1c completing the TAME panel coverage
  details: |
    Added three markers completing this KB's coverage of the TAME Biomarkers Workgroup panel: serum IGF-1 [NCIT:C74864], fasting serum insulin [NCIT:C74788] and hemoglobin A1c [NCIT:C64849]. Newly cached: PMID:24618355 Milman, low IGF-1 predicts survival in nonagenarians. IGF-1 is the notable case: its direction is inverted relative to most markers in this KB, curated as NEGATIVE because lower IGF-1 predicts longer survival, and the effect is sex-dependent, holding in females but not males. Both facts are curated as separate evidence items rather than averaged away, since the sex-dependence qualifies the scope of the association rather than supporting it. IGF-1 carries a second readout to mTORC1 Hyperactivation as CORRELATES_WITH rather than READOUT_OF, because serum IGF-1 does not measure tissue mTORC1 activity and the two can dissociate. HbA1c carries a REFUTE evidence item from the 2025 Delphi consensus recording that it did not reach agreement on predicting biological age better than chronological age, so the limitation travels with the marker rather than sitting only in prose; it is curated as a monitoring readout of nutrient state, not as an aging measure. Insulin is curated on TAME panel membership and mechanistic proximity, with a note that it lacks the exceptional-longevity survival evidence IGF-1 has and was not among the Delphi 14. Validation: just validate with 45/45 snippets verified, validate-terms, check-entity-refs, check-duplicate-keys and the whole-KB snippet gates all pass; 13763 targeted pytest KB tests pass.

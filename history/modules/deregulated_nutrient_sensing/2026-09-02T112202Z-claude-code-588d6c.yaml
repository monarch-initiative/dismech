  summary: Integrate assessed OpenScientist findings on sex-dimorphic geroprotector
    exposure
  details: |
    Repo-wide sweep of OpenScientist hypothesis reports. Two hypotheses are filed
    on this module and both already carried an assessment sidecar by claude-code,
    so no new assessment was written; the existing ones drove the integration.

    sex_dimorphic_geroprotector_exposure (sidecar verdict REFUTED - refuted as a
    general model, surviving as a compound-specific contributor). All four
    RETAINED/QUALIFIED claims rested on primary sources the module did not cite,
    so all four were integrated. Five evidence items were added to the hypothesis,
    each with a snippet copied out of the reference cache after fetching, not out
    of the provider report:

      - PMID:27312235 (REFUTE, INDIRECT). Threefold dose escalation still gave a
        male-only 17-alpha-estradiol lifespan benefit, and NDGA stayed
        male-specific across a ninefold dose range. Graded INDIRECT because blood
        levels were not measured, so "more drug" implies "more exposure" only by
        inference.
      - PMID:42465412 (REFUTE, INDIRECT). The exposure manipulation finally done
        on canagliflozin: neither dose reduction nor the measured three- to
        fivefold higher female accumulation produced the benefit. Graded INDIRECT
        and flagged in its explanation because the endpoints are cognition and
        neuroinflammation rather than lifespan and the source is an unreviewed
        bioRxiv preprint.
      - PMID:29806096 and PMID:30740872 (both REFUTE, INDIRECT). Castration
        abolishes the male metabolomic and the male functional response to
        17-alpha-estradiol, which locates the sex difference in the responding
        substrate rather than in drug handling. Both are carried rather than one
        because the loss of response appears in two independent readout classes.
        Graded INDIRECT partly because drug levels went unmeasured in the
        gonadectomized arms, so equal exposure is inferred from equal dosing.
      - PMID:38500383 (SUPPORT, INDIRECT). Everolimus disposition differs by sex
        in mice, which evidences the model's premise at the level of the rapalog
        class. Graded INDIRECT because it is a different rapalog and the endpoint
        is drug concentration, not lifespan.

    Two prose changes accompany the evidence. The existing PMID:38753230
    explanation was hedged from "Direct pharmacokinetic support" because the
    20-fold blood-level finding is an association, never an exposure-matching
    test, and the manipulation has since been done in the same compound with the
    opposite result; the item is still SUPPORT, since the sidecar says demoting it
    is defensible but not settled while PMID:42465412 remains a preprint. The
    hypothesis notes now record the assessment, the pattern that the model has
    failed every time its prediction was manipulated rather than observed, the
    three limits on that counter-evidence (preprint status, castration studies not
    being exposure-matching tests, and the entire corpus being UM-HET3 mice from
    one program), and the fact that the recommended split into a
    pharmacokinetic-modulatory group and a pharmacodynamic group is left as an
    open curation decision.

    One discussion was added:
    knowledge_gap_exposure_matched_lifespan_test_by_compound (KNOWLEDGE_GAP,
    attaching to the hypothesis and to the rapamycin treatment), recording that no
    lifespan-endpoint exposure-matching experiment exists for rapamycin, acarbose
    or canagliflozin, and that rapamycin - the one compound whose numbers still fit
    the model - has never been subjected to the test that falsified it elsewhere.
    It carries two proposed experiments with entity refs in
    would_support/would_refute and prose in supporting_outcome/refuting_outcome.

    Deliberately not done for this hypothesis. status stays EMERGING: the sidecar
    declines to move it, and MechanisticHypothesisStatusEnum is positional rather
    than a place to record one provider run's verdict. No separate pharmacodynamic
    hypothesis group was created, even though claim C005 (the hybrid PK/PD
    synthesis) and C006 (the compound split) are RETAINED, because the sidecar
    explicitly leaves the split to a curator and the assessment's own scope caveat
    applies with more force to a group built on 17-alpha-estradiol castration data
    in a nutrient-sensing module. The C006 point that the single-model framing is
    wrong was already curated in the seeded notes. PMID:40717358 stays out: the
    sidecar marks it NEEDS_VERIFICATION and says it must not be promoted on the
    strength of the assessment alone. No new ontology terms were bound.

    rapamycin_distinct_from_dietary_restriction (sidecar verdict
    PARTIALLY_SUPPORTED). No changes needed - every RETAINED/QUALIFIED claim is
    already curated, checked claim by claim. C001 (distinct but partially
    overlapping) is the description's own wording; C002 is PMID:20074526, already
    an evidence item graded INDIRECT for the Drosophila extrapolation; C003 is
    PMID:30462643, carried as a REFUTE/SUPPORT pair; C004 is PMID:23881200,
    PMID:31577953 and PMID:25807975, all present; C006 is
    discussions#knowledge_gap_head_to_head_rapamycin_versus_dietary_restriction;
    and C007's PMID:30854544 has already been through fetch-reference and is
    curated with a verified snippet. C005 was REJECTED by the sidecar on schema
    grounds and status correctly remains EMERGING.

    Verification: linkml-validate against the Disease class (modules validate
    against Disease) reports no issues; count-verified-snippets 65/65;
    check-duplicate-keys, check-entity-refs, check-causal-targets and
    check-enum-values all clean on the module.

  summary: Record why the nutrient-sensing module still has no conformer
  details: |
    This is the only hallmark-of-aging module in kb/modules with no conformer; its siblings carry between three and thirty-nine. Searched the corpus for one and found none, so the reason is now recorded in the module description, matching the convention photoaging and cdc1_tolerogenic_maturation already use. The finding is a direction mismatch. The module's chain runs from nutrient surplus to persistent anabolic signalling, so a conformer needs a disease in which the anabolic sensors are chronically engaged. Sarcopenia carries the nearest-looking nodes, Declining Anabolic Hormone Signalling, Blunted Load-Induced mTORC1 Signalling and Anabolic Resistance, and all three run the other way, so wiring them would have inverted the module's claim. Type_2_Diabetes_Mellitus, Obesity and Metabolic_Dysfunction-Associated_Steatotic_Liver_Disease are genuine nutrient-surplus diseases but model insulin resistance, lipotoxicity and impaired mitophagy, with no mTORC1 step suppressing macroautophagy. Werner_Syndrome's NAD+ Depletion node is sirtuin-adjacent but arises from a WRN-dependent fall in NMNAT1 transcription, a biosynthetic failure rather than surplus-driven attenuation. The conformers of disabled_macroautophagy all reach autophagy failure through a direct lesion in the machinery. No node, evidence, term or edge was changed.

  summary: Fix inverted IGF-1 readout direction from PR review
  details: |
    Addressed both IMPORTANT findings from the ai4c-reviewer CHANGES_REQUESTED review on PR #10281. Finding 1, the substantive one: the IGF-1 readout to Nutrient Surplus and Anabolic Signaling carried direction NEGATIVE, which is wrong. The schema defines NEGATIVE as higher biomarker value tracking with less of the linked event, and higher IGF-1 means more anabolic signalling. The error was conflating two directions that genuinely point opposite ways for this marker: against the node it reports IGF-1 is ordinary and POSITIVE, while against outcome it inverts, since lower IGF-1 predicts longer survival in the oldest old. Encoding the outcome inversion in direction also created an internal contradiction, asserting NEGATIVE to a node and POSITIVE to mTORC1 Hyperactivation which is that node's direct downstream. Fixed direction to POSITIVE, changed presence from DECREASED to INCREASED for consistency with the sibling insulin and HbA1c entries and with the deregulated state this module models, and rewrote the notes, interpretation and one evidence explanation so the longevity inversion is kept as a claim about outcome rather than about the linked event. Finding 2: CLAUDE.md carried a hand-maintained count, Six of these carry a biochemical block, which was stale at ten and which CLAUDE.md line 525 explicitly forbids. Replaced with a grep invocation for the current set rather than a corrected number. Self-audit after the review: checked every readout direction added across all nine curated modules against its target node semantics. IGF-1 was the only instance; the three remaining NEGATIVE values, leukocyte telomere length against attrition and against tissue replenishment failure, and mtDNA copy number against mitochondrial damage, are all correct. The error was isolated to the one marker where the biology genuinely inverts against outcome, which is where the conflation is tempting. Report corrected to match, replacing a claim that IGF-1 was curated NEGATIVE and a stale six-of-eleven module count. Validation: just validate 45/45 snippets, validate-terms, check-entity-refs, check-duplicate-keys, and whole-KB check-snippet-length, check-snippet-grading, check-title-snippets, check-empty-snippets, check-folded-hyphens all pass; 13763 KB tests and 47 docs tests pass.

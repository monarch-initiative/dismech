  summary: 'Literature refresh: human FGF21 evidence, single-BCAA non-equivalence,
    two new discussions'
  details: |
    Follow-up literature sweep on the GCN2/FGF21 amino-acid-sensing arm added in the previous session, after rebasing onto current main. Searched PubMed for 2023-2026 work on protein/amino-acid restriction, GCN2, FGF21 and individual branched-chain amino acids. Four papers changed the model; all were fetched into references_cache and snippet-verified.

    1. HUMAN EVIDENCE NOW EXISTS FOR THE PROXIMAL ARM. The previous session recorded that no step of this chain had human support. That is no longer accurate for the FGF21 node. PMID:40050437 (Nat Metab 2025) is a controlled eucaloric protein-restriction intervention in healthy lean men with a hyperinsulinemic-euglycemic clamp: fasting plasma FGF21 rose during protein restriction, and energy intake had to be raised to hold body weight steady regardless of whether protein was replaced by carbohydrate or fat. Two HUMAN_CLINICAL evidence items added to "Attenuated FGF21 Endocrine Starvation Response". The explanations state explicitly that this establishes the proximal endocrine response only and carries no human lifespan claim.

    2. INDIVIDUAL AMINO ACIDS ARE NOT INTERCHANGEABLE. Three papers narrow the intervention from whole-protein restriction to single amino acids, and disagree with the simple anabolic-signalling prediction. Added to the "Dietary Protein and Amino-Acid Restriction" treatment: PMID:37939658 (isoleucine restriction extends lifespan in UM-HET3 mice, more in males); PMID:42498891 (Nat Aging 2026 - valine restriction raises median MALE lifespan 23%, reduces frailty, cancer prevalence and senescent cell burden in both sexes; the senescent-cell finding is a structural link to the cellular_senescence module); PMID:41817439 (restriction of isoleucine or valine, but NOT leucine, improved metabolic health in 3xTg mice). The leucine result is recorded as supports: PARTIAL because it qualifies rather than supports the treatment as named - leucine is the strongest mTORC1 activator of the three BCAAs and is precisely the one the anabolic model predicts should matter most.

    3. TWO NEW DISCUSSIONS. knowledge_gap_which_amino_acid_is_the_signal (KNOWLEDGE_GAP) records that the treatment node collapses isoleucine, valine and methionine restriction into one manipulation acting on one sensor, which the non-substitutability result contradicts; proposes Gcn2-null and Fgf21-null single-amino-acid restriction experiments to test whether GCN2/FGF21 is a common trunk or the routes diverge upstream. human_model_mismatch_amino_acid_restriction_lifespan (HUMAN_MODEL_MISMATCH) records that the two ends of the chain are unequally evidenced: proximal FGF21/energy-expenditure response shown in humans, distal lifespan benefit rodent-only and repeatedly male-biased, and no long-term human data in the over-65 population for whom higher protein intake is clinically recommended - the population where the recommendation conflict actually matters. Proposes an older-adult trial powered on lean mass and a sex-stratified single-amino-acid study.

    4. NOTES UPDATED with both cautions so a curator reading only the module header sees them: name the specific amino acid rather than asserting generic amino-acid restriction, and do not read the human proximal evidence as human lifespan evidence.

    Rebase note: rebased onto origin/main (1260 commits). One conflict in this file, purely additive and resolved by ordering - main had added a mechanistic_hypotheses block at the file tail while this branch added a third treatment. Both kept; the new Dietary Protein and Amino-Acid Restriction treatment now sits at the end of treatments: and mechanistic_hypotheses: follows. Worth noting main's new rapamycin_distinct_from_dietary_restriction hypothesis is directly relevant to this branch's content and is left as main wrote it.


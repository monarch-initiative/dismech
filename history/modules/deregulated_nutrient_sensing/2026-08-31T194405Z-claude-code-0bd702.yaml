  summary: Fold assessed rapamycin-vs-dietary-restriction findings into the module
  details: |
    Folded the retained findings of the openscientist hypothesis exploration at
    kb/hypotheses/deregulated_nutrient_sensing/rapamycin_distinct_from_dietary_restriction/
    into the module. That run was assessed on 2026-08-07 (overall_verdict
    PARTIALLY_SUPPORTED, six claims dispositioned) but its results were never
    applied to the module, so the hypothesis still rested on the single study it
    was seeded with.

    mechanistic_hypotheses#rapamycin_distinct_from_dietary_restriction: rewrote the
    description to state the claim as "distinct but partially overlapping" rather
    than fully distinct (assessment claim C001), naming where the two interventions
    converge (mTORC1 entry, translational suppression, autophagy, part of the hepatic
    methylome) and where they diverge (endocrine and metabolic axes, most sharply
    insulin sensitivity). Added eight evidence items to the one already there:
    PMID:30854544, a review devoted to this exact question concluding rapamycin is
    likely not a true dietary-restriction mimetic (C007, which the assessment left
    NEEDS_VERIFICATION pending fetch-reference and snippet validation -- both now
    done); PMID:25807975, opposite-direction effects of calorie restriction and
    rapamycin on liver proteome turnover (C004); PMID:20074526, the Drosophila
    epistasis result, graded directness INDIRECT because it reaches a
    mouse-evidenced module through a taxonomic inference step (C002, which the
    assessment QUALIFIED on exactly that ground); and PMID:30462643 split into two
    items, a REFUTE quoting the shared hepatic gene-body hypermethylation signature
    across dietary restriction, rapamycin and Ames dwarfism (C003 -- the evidence
    that most weakens the hypothesis, and the reason the description is hedged) and
    a SUPPORT quoting the divergent gene sets the two interventions hypermethylate
    within it. Splitting rather than averaging follows the CLAUDE.md rule for a
    source that supports one part of a claim and contradicts another.

    The insulin-sensitivity divergence that assessment claim C004 rests on was
    left uncited in the first pass and is now evidenced rather than asserted, on
    three items. PMID:31577953 is split the same way PMID:30462643 is: a SUPPORT
    quoting the opposite-direction claim with its mechanism (rapamycin induces
    insulin resistance by disrupting mTORC2, the complex dietary restriction does
    not act on), and a REFUTE quoting the study's actual conclusion -- that the
    calorie-restriction-induced improvement in insulin sensitivity is dispensable
    for fitness and lifespan in adipose-Rictor-null mice. The second is a check on
    the hypothesis's own best-known argument: the divergence is real, but the step
    from "the two differ here" to "the two reach longevity differently" does not
    follow if the axis is off the longevity path. The description and notes were
    amended to carry that caveat rather than to keep the stronger reading.
    PMID:23881200, a review of rapamycin beta-cell toxicity drawing on islet and
    renal transplant cohorts and on oncology use, grounds the rapamycin half of
    the divergence in treated humans -- the only human evidence anywhere in this
    hypothesis, in a module otherwise entirely rodent -- and is graded INDIRECT
    because it says nothing about dietary restriction.

    Status left at EMERGING. The assessment's C005 recommendation to raise it toward
    "partially supported" was rejected there on schema grounds --
    MechanisticHypothesisStatusEnum records a hypothesis's position among competing
    accounts, not one provider run's verdict -- and that reasoning is now recorded in
    the hypothesis notes so the next reader does not re-litigate it.

    discussions#knowledge_gap_head_to_head_rapamycin_versus_dietary_restriction: new
    KNOWLEDGE_GAP for assessment claim C006. The distinct-routes reading is assembled
    from studies that each compare the two interventions on one modality in one
    tissue at unmatched doses, so divergences are confounded with dose and duration.
    Attaches to the hypothesis, the mTORC1 node and the rapamycin treatment, and
    proposes two experiments: a lifespan-matched single-cohort multi-omic comparison,
    and a combination arm whose additivity discriminates the two models -- a
    prediction PMID:30854544 makes explicitly. Phrased as "not located" rather than
    "does not exist", preserving the assessment's distinction between a claim about
    a search and a claim about the literature.

    Deliberately not done: no causal edge was opted into hypothesis_groups. The
    hypothesis is about two interventions rather than about a specific edge, and
    tagging the canonical mTORC1 -> tissue-decline edge would misrepresent a
    consensus edge as belonging to an EMERGING model.


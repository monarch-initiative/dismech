  summary: Add turquoise killifish (Nothobranchius furzeri) animal model with modeled_mechanisms
  details: |
    Added an APRT heterozygous turquoise killifish animal_models entry - the only entry in this tranche built on a directed genetic manipulation rather than natural aging. PERTURBS 'AMPK and Sirtuin Catabolic-Sensing Attenuation' (reduced ATP with AMPK activation and enhanced nutrient sensitivity in heterozygous cells; lifespan extension in heterozygous males; the benefit ABOLISHED by lifelong intermittent fasting, which is the epistasis result placing the manipulation inside the pathway) and RESCUES 'Accelerated Cellular Aging and Age-Related Tissue Decline' (rejuvenated metabolic function, fasting-like profile, high-fat-diet resistance in old mutants). genes: bound to hgnc:626 (APRT), which passes term validation. Limitations note the manipulation is upstream of AMPK on the nucleotide pool, the sex- and dose-dependence, and that human APRT deficiency is a kidney stone disorder rather than a longevity phenotype. Evidence: PMID:37321215, snippets exact-quoted and verified.

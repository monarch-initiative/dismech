  summary: Seed ovarian mTOR follicle-reserve aging hypothesis
  details: |
    Added mechanistic hypothesis ovarian_mtor_follicle_reserve_aging (EMERGING), seeded from the human ovarian aging atlas (PMID:39578560, Impetus-funded) with mouse rapamycin evidence (PMID:28544226 support and a REFUTE item for long-term treatment harm; PMID:31887337 human xenograft) and the VIBRANT trial registration (NCT05836025). Created as its own group because the existing sex_dimorphic_geroprotector_exposure hypothesis concerns both-sex lifespan and cannot be tested with female-only ovarian data. An OpenScientist dataset run against geo:GSE202601 was launched on this group; its report and assessment will be added separately.

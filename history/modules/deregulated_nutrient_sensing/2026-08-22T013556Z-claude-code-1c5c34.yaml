  summary: Add GCN2 amino-acid-sensing and FGF21 arm plus dietary protein restriction
    treatment
  details: |
    Extended the deregulated nutrient sensing module with the amino-acid-scarcity sensing arm, which was previously absent (the module modelled only the mTORC1 anabolic node and the AMPK/sirtuin energy-sensing arm).

    Lead: Knopf & Lamming, "The hallmarks of protein and amino acid restriction in aging and longevity", Cell Press Blue 2026 (doi:10.1016/j.cpblue.2026.100079), supplied by the user as a PDF. The review itself is a 2026 corrected proof with no PMID, so it is NOT cited as evidence anywhere; it was used only to identify the primary literature, and every claim below is anchored on a primary paper fetched into references_cache and snippet-verified.

    Added two pathophysiology nodes:
    - "GCN2 Amino-Acid-Scarcity Sensing Attenuation" (role effector, MOLECULAR). GCN2 senses uncharged tRNA, phosphorylates eIF2-alpha, selectively induces ATF4, and directly restrains TORC1; a protein-replete state leaves this arm unmobilised. Downstream to mTORC1 Hyperactivation, the new FGF21 node, and Autophagy Suppression. Upstream edge added from Nutrient Surplus and Anabolic Signaling. Evidence: PMID:7623840 (uncharged tRNA is the direct GCN2 regulator), PMID:11106749 (GCN2/eIF2-alpha represses global translation, selectively induces ATF4), PMID:27979906 (GCN2 required for amino-acid-restriction lifespan extension, Drosophila), PMID:30117416 (Gcn2 activation extends replicative lifespan, yeast), PMID:28057755 (loss of Gcn2 raises TORC1 activity and uncouples it from amino-acid status - supports the GCN2 to mTORC1 edge).
    - "Attenuated FGF21 Endocrine Starvation Response" (role effector, ORGANISM). The hepatokine output of the GCN2/ATF4 arm; included because FGF21 is necessary for protein restriction to extend lifespan and sufficient on its own, i.e. an independent endocrine route to age-related decline rather than an mTORC1 readout. Evidence: PMID:27396336 (GCN2 links protein restriction to FGF21 induction), PMID:35393401 (FGF21 essential for the anti-aging effect of protein restriction), PMID:23066506 (FGF21 overexpression extends lifespan without affecting AMPK/mTOR signalling).

    Added one treatment: "Dietary Protein and Amino-Acid Restriction" (BEHAVIORAL, NCIT:C15447 Dietary Intervention), the non-pharmacological arm of the existing rapamycin/metformin geroprotector target pattern. Two target_mechanisms, both INHIBITS: on "Nutrient Surplus and Anabolic Signaling" (removes the amino-acid input) and on "GCN2 Amino-Acid-Scarcity Sensing Attenuation" (reverses the attenuation by engaging the sensor). Evidence: PMID:24606899 (macronutrient ratio, not calorie intake, dictates longevity - mice), PMID:35393401 (protein restriction increases lifespan and reduces frailty - mice).

    Also updated the module description and notes to name the two distinct catabolic sensing arms and to warn that they are not interchangeable: AMPK/sirtuins sense energy, GCN2 senses amino acids, and protein restriction acts through the GCN2/FGF21 arm rather than energy restriction. A disorder conforming only to the mTORC1 node should not be assumed to engage the GCN2/FGF21 arm.

    Evidence-source discipline: yeast studies tagged IN_VITRO (cultured single cells, not animals, per the CLAUDE.md classification rules); Drosophila and mouse studies tagged MODEL_ORGANISM. No human evidence is claimed for any of these nodes - the entire amino-acid-restriction lifespan literature added here is model-organism/in-vitro, and the nodes should not be read as established human mechanism.

    Validation: linkml-validate clean; validate-terms passed (GO:0140469, GO:0034198, GO:0140467, GO:0008543, GO:0042594, NCIT:C15447 all verified); snippet audit 23/23 verified against references_cache (was 12/12 before this change); graph validation and tests/test_data.py run.

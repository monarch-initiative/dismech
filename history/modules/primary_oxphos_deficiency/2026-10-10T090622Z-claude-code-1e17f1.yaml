  summary: 'Create: primary_oxphos_deficiency module'
  details: |
    New module for inherited (primary) OXPHOS deficiency, separating primary monogenic mitochondrial disease from the aging-hallmark mitochondrial_dysfunction module. Nodes: three alternative trigger lesion classes (OXPHOS Subunit or Assembly Factor Defect; Mitochondrial Translation Defect; Mitochondrial DNA Depletion or Deletion) converging on OXPHOS Complex Deficiency (key conformance target), then Cellular Energy Failure in High-Demand Tissues and NADH Redox Imbalance and Lactic Acidosis, with three tissue outcomes (Leigh-Type Necrotizing Encephalopathy, Mitochondrial Myopathy, Mitochondrial Cardiomyopathy). Biochemical block: blood lactate, serum FGF-21 and serum GDF-15, each with a REFUTE item recording its sensitivity or specificity limit; FGF-21 and GDF-15 evidence reuses the references already curated on mitochondrial_dysfunction (PMID:27794108, PMID:25446397). New references fetched: PMID:27775730 (Gorman 2016), PMID:29233888 (Frazier 2019, full text), PMID:23385875 (El-Hattab 2013), PMID:30406383, PMID:27504452. GO:0000002 mitochondrial genome maintenance was considered and rejected because it is obsolete in GO; GO:0006264 and GO:0032042 are bound instead. Validated with validate-module-batch (96 snippets, 0 issues), validate-terms and count-verified-snippets (40/40). The Single_Large-Scale_mtDNA_Deletion_Disorders grouping's CONFORMS_TO_MODULE criterion and member module anchors were moved from mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress to primary_oxphos_deficiency#Mitochondrial DNA Depletion or Deletion; both members (Pearson, Kearns-Sayre) remain SATISFIED.

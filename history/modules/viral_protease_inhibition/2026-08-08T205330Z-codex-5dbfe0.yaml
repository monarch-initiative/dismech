  summary: Split viral protease processing into replicase and structural-maturation
    branches
  details: |
    Review follow-up clarified ritonavir's modern pharmacokinetic-enhancer role.

    Corrected the shared viral-polyprotein processing module so SARS-CoV-2 Mpro and HCV NS3/4A terminate in the replicase-protein and viral-RNA-replication branch, while HIV protease terminates in the structural virion-maturation branch. Restricted immature non-infectious particles to the structural branch, kept viral protease substitutions as the resistance branch, and separated host CYP3A pharmacokinetic boosting from resistance. Added a high-precision operational boundary requiring the full polyprotein-synthesis -> virus-encoded processing -> applicable productive-output chain and explicitly excluding host proteases, boosting, isolated immune evasion, and endpoint-only matches. Added primary evidence PMID:35380892 and PMID:22558217.

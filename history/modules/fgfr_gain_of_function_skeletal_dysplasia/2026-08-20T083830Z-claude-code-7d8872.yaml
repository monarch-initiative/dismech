  summary: 'Review: add the receptor-directed TKI therapeutic arm and three knowledge
    gaps'
  details: |
    Reviewed as part of a completeness review of the FGFR-Related Skeletal Dysplasias grouping, which uses this module as its NECESSARY_AND_SUFFICIENT membership criterion.

    Treatments: the module previously carried the CNP-NPR2 counter-regulatory arm but no receptor-directed arm, which became a real omission in 2026 when direct FGFR kinase inhibition reached phase 3. Added a treatments block covering the arm with its selectivity axis made explicit: infigratinib (pan-FGFR1-3, phase 3 in achondroplasia, PMID:42370681) and TYRA-300 (FGFR3-selective, preclinical in both achondroplasia and hypochondroplasia mouse models, PMID:40178985), with target_mechanisms INHIBITS on Constitutive FGFR Activation. Two limits are stated in the treatment description so conforming disorders inherit them: efficacy is not established across the allelic series, and pan-FGFR inhibition has documented off-target skeletal effects (PMID:41641077, reduced male trabecular bone and bone strength).

    Discussions: added three KNOWLEDGE_GAP entries.
    - gap_fgfr_tki_selectivity_and_allele_specificity: whether receptor inhibition generalizes beyond FGFR3 p.Gly380Arg, given the module's own alternative hypothesis that the alleles activate the receptor by different biophysical mechanisms, and whether the benefit and the bone liability of pan-FGFR inhibition are separable. Matters most for the craniosynostosis arm, where the causal receptor is FGFR1 or FGFR2 and an FGFR3-selective agent would be the wrong drug.
    - gap_suture_stem_cell_niche_vs_receptor_lesion: whether craniosynostosis here is cell-autonomous receptor output or suture stem cell niche failure, citing three 2026 mouse results the module's straight-line node chain does not represent - a single-cell suture atlas (PMID:42071254), a dura-mater FGFR2-retinoic-acid axis whose genetic restoration rescues fusion (PMID:42604930), and Fgfr3-Wnt crosstalk (PMID:42527406, marked PARTIAL because it is a loss-of-function zebrafish model, the mechanistic inverse of this module's trigger). The last also supplies the model-fidelity quote that no Fgfr3 mouse model in either direction recapitulates the human cranial phenotype.
    - gap_germline_vs_somatic_fgfr_oncogenicity: why constitutional activating mutations in FGFR1/2/3, all established oncogenes, produce skeletal dysplasia rather than cancer predisposition. Cites the 53-year follow-up of 24 Apert patients (PMID:42082645) and the authors' proposed neighbour-context explanation, marked PARTIAL because that study measures outcome rather than signalling. Practically relevant now that chronic FGFR kinase inhibition is a phase 3 therapy.

    Validation: just validate PASS; just validate-terms PASS; just validate-references PASS; snippets 36/36 verified.

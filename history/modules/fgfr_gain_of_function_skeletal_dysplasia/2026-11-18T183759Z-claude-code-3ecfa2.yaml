  summary: Correct reversed FGFR2-retinoic acid direction in a knowledge-gap rationale
  details: |
    One sentence of the KNOWLEDGE_GAP rationale read as the reverse of PMID:42604930. It said FGFR2 signaling in the dura mater acts through a retinoic-acid axis to prevent fusion, which on a plain reading makes FGFR2 activity the thing that keeps the suture open. The paper shows the opposite for the receptor: FGFR2 signaling declines after birth, retinoic acid synthesis falls with it via Aldh1a3 and Rbp1, and that decline preserves GLI1+ progenitors and suture patency. FGFR2 overactivation holds the decline open, raises retinoic acid, and causes premature osteogenic differentiation and coronal craniosynostosis. The wording appears to have been paraphrased from the paper title, where prevent refers to the regulated axis as a whole rather than to FGFR2 activity, which reads the wrong way round in a gain-of-function module. Reworded to state the direction explicitly and to keep the adjacent-tissue point the gap is about. The two evidence items under the rationale were already correct and are unchanged; all 36 snippets still verify.

  summary: 'Review round 1: notes scope, ROS term precision, reference count'
  details: |
    Addressed the ai4c-reviewer approval round on PR #13724. The review was APPROVED with five non-blocking suggestions and one count correction; all were acted on in a single push, since any push to the PR drops the approval and a second round would cost another full review cycle.

    Taken:

    1. Removed a dangling sentence from the module notes that read 'See dismech issue for the toxicology module gap analysis' and named no issue. Also removed the preceding paragraph narrating how the curating session found the mechanism (reading node chains rather than clustering ontology terms, and the 350-of-391 figure). The reviewer was right that this is session methodology rather than module scope, and it was already recorded verbatim in the CREATE history record, so notes now carries only scope and reading guidance.

    2. Recorded the two-scale bundling in the Anaerobic Glycolytic Shift with Lactic Acidosis node rather than splitting it. The node carries a cellular metabolic shift and a systemic acid-base consequence and is tagged ORGANISM for the latter, which is a split signal under the single-value scale discipline. It is kept whole because the feedback the amplifier role rests on is a property of the acidosis, so splitting without re-pointing that edge would lose the reason the node is an amplifier. The notes now say so and state what a later split should do.

    3. Added GO:0072593 reactive oxygen species metabolic process alongside the existing GO:0006979 response to oxidative stress on the Secondary Mitochondrial Oxidative Stress node, rather than replacing it. The reviewer correctly observed that the node's primary claim is ROS production while GO:0006979 names the cell's response. Both are kept because both claims are made and because GO:0006979 is the term the conforming entries carry; the node description now explains the pairing. GO:0072593 was confirmed present in cache/go/terms.csv and in the biologicalprocessterm enum cache before use.

    4. Added a notes paragraph naming the scope leakage at the conforming carbon monoxide oxidative-stress node, which attributes reactive oxygen species both to mitochondrial dysfunction and to nitric oxide displaced from hemoproteins. The second route belongs to the oxygen-delivery arm this module scopes out. The bundling predates the module and is not introduced by it, but it deserved the same explicit line the delivery-node exclusion got.

    5. Added a paragraph to the Formaldehyde_Poisoning node notes stating why that entry conforms at a bundled node and that the conformance is scoped to the oxidase binding rather than to the acidosis, citing dismech#13726 where the split is tracked. This stops the next reader re-deriving the argument from the PR thread.

    Count correction: the CREATE record and the PR body both said 25 snippets across 22 references. There are 21 distinct reference identifiers across 25 evidence items (3 newly fetched plus 18 already cached, not 19). Corrected in the CREATE record in place, which was still unmerged and unreviewed, rather than left as a wrong number with a correction appended.

    Nothing in the review was declined. No evidence item was added, removed, or regraded, and no snippet text changed.

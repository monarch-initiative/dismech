  summary: 'Create: Xenobiotic Oxidative Phosphorylation Blockade module'
  details: |
    Created a six-node toxicology mechanism module for acute chemical poisoning of mitochondrial ATP synthesis (histotoxic hypoxia), factored out of six independently curated entries that had each written a near-identical chain.

    Chain: Xenobiotic Blockade of Mitochondrial Respiration (trigger) -> Cellular ATP Depletion despite Preserved Oxygen Delivery (central_effector, the key conformance target) -> Anaerobic Glycolytic Shift with Lactic Acidosis (amplifier) and Secondary Mitochondrial Oxidative Stress (amplifier) and Energy Failure of High Oxidative-Demand Tissue (effector) -> Selective Deep Grey Matter and Myocardial Necrosis (consequence). One treatment entry models the antidotal drug-target pattern with treatment_effect INHIBITS against the trigger node.

    How the mechanism was identified: by reading pathophysiology node chains across the 391 entries that declare a TRIGGERS or EXACERBATES exposure, not by clustering shared ontology terms. The GO terms these entries carry are too generic to cluster on (inflammatory response, apoptotic process, response to oxidative stress all dominate), which is why the mechanism had not been factored out before. 350 of those 391 entries conform to no toxicology module at all.

    Evidence: 25 snippets across 22 references, every one verified as an exact substring of its cached abstract before the file was written, using a script that asserts substring presence under the validator normalization rather than trusting a transcribed quote. Reference titles were read from the cache frontmatter programmatically, never typed. Three new references were fetched for this module (PMID:16863431 general drug-induced mitochondrial toxicity, PMID:26386112 drug-induced mitochondrial cardiotoxicity, PMID:29923671 the methanol Circulus hypoxicus patient series); the remaining 19 were already cached and cited by conformers, and their evidence_source grades were copied from existing use so the snippet-grading gate stays consistent.

    Two evidence items are graded directness INDIRECT rather than DIRECT, deliberately: PMID:27180631 attributes harm to formate and lactate together without separating the glycolytic contribution, and PMID:16863431 establishes necrosis as the general outcome without addressing the anatomical selectivity the consequence node is mainly about.

    Scope decisions recorded in notes: uncoupling is named as a fourth route into the same ATP deficit but no current dismech entry models an uncoupler as its primary mechanism, so no conformer exercises that arm; carbon monoxide's carboxyhemoglobin nodes are deliberately left outside the module because impaired oxygen delivery is a separate upstream mechanism, and only its direct cytochrome c oxidase arm conforms.

    Validation: linkml-validate (no issues), linkml-term-validator --labels (passed), reference validator (25 snippets, 25 titles, 0 issues). All ten ontology identifiers were read from the committed term caches rather than written from memory.

    Wired six conformers in the same PR: Cyanide_Poisoning, Carbon_Monoxide_Poisoning, Methanol_Poisoning, Diethylene_Glycol_Poisoning, Chloramphenicol_Toxicity, Formaldehyde_Poisoning.

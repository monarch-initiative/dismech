  details: |
    Mined the companion monoculture study (Garcia da Silva et al. 2024, PMID:38360295) from the Toxicology NAMs special issue into the chemical_respiratory_allergy module, the cellular-scale counterpart of the 3D tetraculture (PMID:38369009, #16866, handled in PR #17232). Added one experimental_models entry — three human airway cell lines (BEAS-2B bronchial epithelial, MRC-5 lung fibroblast, EA.hy926 endothelial) cultured separately — linked to Airway Epithelial Danger Signal Release as RECAPITULATES/MODERATE at model_scale CELLULAR. Scale equals the node's cellular scale, so no upward-extrapolation caveat; the link carries a BOUNDARY_OMISSION/QUALIFYING divergence for the missing multicellular tissue context and mucus barrier that the tetraculture adds. Three readouts cover the node's content: increased IL-8/IL-6/IL-1beta cytokines, decreased MUC1 barrier protein, increased endothelial ICAM-1. Recorded the paper's cell-free toxicant-mucin binding negative result (binding occurs for some sensitizers but is not common across chemical classes) as a KNOWLEDGE_GAP discussion (gap_mucin_toxicodynamic_target_cra) attached to the haptenation trigger node, since a chemical binding a secreted extracellular protein upstream of any cell has no dismech node shape. All snippets are exact substrings of the abstract_only cache (no PMC full text). Both experimental_models: and this module edit will fold with PR #17232's tetraculture experimental_models: block at merge. Gates green: validate (17 snippets/17 titles, 0 issues), validate-terms, validate-module-batch, model-scale-audit --strict (1 link, ALIGNED, 1 BOUNDARY_OMISSION), check-duplicate-keys, check-entity-refs, check-causal-targets, check-logical-rules, check-enum-values, check-block-scalar-comments, check-snippet-length, check-reference-titles, check-snippet-grading, check-qualifier-terms. The nams-registry rows for the three monocultures and the mucin assay are a separate PR in that repo.

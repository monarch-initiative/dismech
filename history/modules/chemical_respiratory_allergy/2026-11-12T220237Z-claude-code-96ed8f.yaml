  summary: Add 3D tetraculture NAM model links (PMID:38369009)
  details: |
    Added an experimental_models entry for the 3D tetraculture bronchial model (da Silva et al. 2024, PMID:38369009) mined from the Toxicology NAMs special issue (issue #16866). Two ModelMechanismLinks: RECAPITULATES on Airway Epithelial Danger Signal Release (TISSUE scale; IL-8/IL-6, ROS, epithelial-apoptosis readouts) and PARTIALLY_RECAPITULATES on Dendritic Cell Activation and Th2-Polarizing Antigen Presentation (TISSUE scale; monocytic IL-8 as an indirect DC-activation surrogate), the latter carrying a BOUNDARY_OMISSION divergence for the absent T lymphocyte compartment. Both links are model-above-target in scale, so no upward-extrapolation caveat is required. Evidence snippets are exact substrings of the cached abstract (abstract_only; no PMC full text). The module already cited this PMID and companion PMID:38360295 as node evidence from #16912; this adds the model-side half. A destination-decision note was recorded in projects/NAMS_SPECIAL_ISSUE.md, which also records that the method belongs additionally in the external nams-registry. The companion monoculture paper is left to its own issue #16865.

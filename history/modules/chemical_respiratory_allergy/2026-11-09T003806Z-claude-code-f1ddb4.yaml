  summary: 'Create: Chemical Respiratory Allergy Module'
  details: |
    Created the module to close dismech#16878. Structured on AOP-Wiki AOP 39 (covalent protein binding leading to increased allergic respiratory hypersensitivity response), whose five key events the five nodes follow one for one: KE 396 covalent protein binding, KE 1496 increased secretion of proinflammatory mediators, KE 398 activation of dendritic cells, KE 272 activation/proliferation of T cells, KE 313 increase in allergic respiratory hypersensitivity response. AOP structure read from aopwiki.org during curation; the AOP's own weight-of-evidence text is rendered client-side and was not readable, so no evidence claim rests on it. Evidence is independent: MDI-albumin adduct characterization for haptenation (PMID:23743149), two Toxicology NAMs special-issue airway papers for the epithelial and dendritic cell nodes (PMID:38360295, PMID:38369009), an HDI dendritic cell study (PMID:24742817), a TDI mouse Th2 model (PMID:16271432), and an occupational asthma review for the outcome (PMID:21573916). Specific IgE is deliberately absent from the chain because low molecular weight agents frequently sensitize without detectable specific IgE, which PMID:21573916 states. The trigger node binds no GO process: OLS searches for haptenation, protein adduct formation, covalent protein binding and xenobiotic conjugation return no suitable process class, and GO:0008213 protein alkylation denotes enzymatic modification rather than electrophilic xenobiotic adduction. An OpenScientist deep-research run (research/modules/chemical_respiratory_allergy-deep-research-openscientist.md) was executed against a provisional version of this chain; it independently confirmed the AOP 39 correspondence, the IgE-optional decision and the Th2 polarization, and supplied two citations adopted here after verification: PMID:12419703 (TMA Th2 versus DNCB Th1 cytokine fingerprinting, the evidential basis for keeping this module separate from skin sensitization) and PMID:28824649 (OX40L induction on dendritic cells discriminating respiratory from contact sensitizers). The report carried no reference-validation section, so every citation taken from it was cached and snippet-checked by hand; two of its quotes initially failed an exact-substring check only because the report lowercased the sentence-initial capital in running prose. All three gates pass: linkml-validate, linkml-term-validator, and the reference validator at 8 snippets and 8 titles with zero issues. No conformer wired: no occupational asthma entry exists, and Asthma.yaml mentions occupational agents only in evidence snippets without a sensitization pathophysiology node.

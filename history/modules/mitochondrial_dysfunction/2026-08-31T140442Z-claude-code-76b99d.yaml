  summary: Add gerotherapeutic treatments (methylene blue, metformin) with mechanism
    links
  details: |
    Added the module's first treatments under the geroscience drug-repurposing project (projects/GEROSCIENCE_REPURPOSING.md; Kulkarni et al. 2022, PMID:35343051). Both link to 'Bioenergetic Decline and Oxidative Stress'.

    Methylene blue is curated as MODULATES, not RESTORES. Duicu et al. 2017 (PMID:28738167) finds it improves respiratory function but has a dichotomic, substrate-dependent effect on ROS - increasing H2O2 release with complex I substrates while decreasing it with complex II substrate. A second evidence item quotes that unfavorable half explicitly so it is visible in the entry rather than folded into a summary sentence. Both items are IN_VITRO (mitochondria isolated from rat hearts, high-resolution respirometry).

    Metformin is curated as RESTORES: Bharath et al. 2020 (PMID:32402267) measures a bioenergetic defect in cells from older donors and shows metformin improves it. The second item quotes the conclusion that the mitochondrial and autophagic effects run largely in parallel, which is the stated reason the drug is curated against this module and disabled_macroautophagy independently rather than treated as one claim.


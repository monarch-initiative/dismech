  summary: Add biomarker panel and knowledge gap to mitochondrial_dysfunction
  details: |
    Added a three-marker biochemical block plus one KNOWLEDGE_GAP to the mitochondrial_dysfunction module, continuing the Tier 1 sweep from docs/reports/biomarkers-of-aging-gap-analysis-2026-08-31.md. Markers: serum GDF-15 [NCIT:C181406], serum FGF-21 [NCIT:C112280], and blood mtDNA copy number [NCIT:C28512]. Newly cached: PMID:25446397 GDF15 in mitochondrial disease, PMID:27794108 FGF21 validation study, PMID:32988399 mtDNA copy number in ARIC/CHS/FHS cohorts. Two markers carry REFUTE evidence items alongside their SUPPORT items rather than burying the limitation in prose: GDF-15 is not specific to mitochondrial disease, and FGF-21 is only weakly induced by structural respiratory-chain defects so a normal value does not exclude disease. FGF-21 is the module's cross-species case, with the human association reproduced in mouse mtDNA-deletion models in the same study. mtDNA copy number uses direction NEGATIVE and relationship CORRELATES_WITH rather than READOUT_OF, because copy number is not a direct measure of mitochondrial function. The knowledge gap records the scope limit that matters most for this module: FGF-21 and GDF-15 were validated in primary mitochondrial disease, where a single severe lesion gives a large signal, whereas the hallmark modeled here is diffuse gradual decline. GDF-15 has independent aging support via the 2025 Delphi consensus so its extension is licensed; FGF-21 does not, so it is scoped to the validated lesion types. Term correction during curation: an initially guessed FGF-21 CURIE of NCIT:C104220 was wrong and was replaced with NCIT:C112280 after checking OAK, chosen in the Measurement form to match the existing GDF-15 binding. Validation: just validate with 19/19 snippets verified, validate-terms, check-entity-refs, check-duplicate-keys and whole-KB check-snippet-grading all pass; 13763 targeted pytest KB tests pass; snippets independently confirmed as literal exact substrings.

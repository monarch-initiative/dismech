  details: |
    Added a turquoise killifish animal_models entry. PARTIALLY_RECAPITULATES 'Mitochondrial Damage and mtDNA Mutation': mtDNA copy number falls across five tissues with coordinated downregulation of Tfam/mtSsbp, but large-scale age-related mtDNA deletions were NOT detectable, which is recorded as a REFUTE-direction readout rather than omitted. RECAPITULATES 'Bioenergetic Decline and Oxidative Stress' on direct functional data (respiratory chain complex III/IV content and ADP-stimulated/succinate-dependent respiration both reduced); limitations note that ROS and oxidative damage were not measured, so the oxidative-stress half is not covered. Evidence: PMID:21624037, snippets exact-quoted and verified.

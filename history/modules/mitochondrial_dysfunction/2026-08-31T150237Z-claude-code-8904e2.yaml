  summary: 'Add computational models and simulation resources relevant to aging: mitochondrial_dysfunction'
  details: |
    Added four computational models: two Kowald-Kirkwood treatments of mtDNA deletion clonal expansion (the transcription-based selection-advantage model and the later hypothesis-discrimination study), the Sizek2023 MiDAS Boolean model of mitochondrial dynamics and cell-cycle control (MODEL2312140001), and the 1996 network theory of ageing. The MiDAS entry is the explicit bridge to cellular_senescence; its limitations record that the mechanism is offered as a testable hypothesis.

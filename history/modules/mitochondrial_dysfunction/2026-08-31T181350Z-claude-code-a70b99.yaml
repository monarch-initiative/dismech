  summary: Add naked mole-rat comparative negative model
  details: |
    Added the naked mole-rat as this module's counterexample to a simple oxidative-damage-to-aging chain: PARTIALLY_RECAPITULATES on Bioenergetic Decline and Oxidative Stress (lower GSH and GSH/GSSG, about tenfold higher in vivo lipid peroxidation and higher accrued oxidative damage than mice, PMID:17054663 - only the oxidative arm, since respiration and ATP output were not measured and the state is present in young animals rather than being age-progressive) and FAILS_TO_RECAPITULATE on Age-Related Tissue Dysfunction (PMID:17054663, PMID:29364116). Limitations record that the negative claim is organism-level and demographic and does not identify which node of the chain is broken, with the proteostasis and genomic-instability modules carrying competing candidate explanations for the same phenotype. Validated with linkml-validate, term validation, reference validation (13/13 snippets) and the offline KB gates.

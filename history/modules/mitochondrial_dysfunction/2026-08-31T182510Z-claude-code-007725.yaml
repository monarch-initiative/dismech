  summary: Add elamipretide pharmacological-probe arm to the mitochondrial dysfunction
    aging module
  details: |
    Curated the effects of elamipretide (SS-31) on mitochondrial phenotypes and aging into the mitochondrial_dysfunction hallmark-of-aging module, which previously had only a pathophysiology chain and no treatments, models, or discussions.

    Added treatments[Elamipretide (SS-31)]: therapeutic_modality PEPTIDE, NCIT:C15986 Pharmacotherapy with CHEBI:233331 elamipretide as therapeutic_agent (both already in the term caches from Barth_Syndrome). Three target_mechanisms links, each with its own evidence: Bioenergetic Decline and Oxidative Stress (INHIBITS -- cardiolipin binding, cristae/supercomplex protection, blocked cytochrome c peroxidase conversion, ANT1 proton leak, plus the reversal of ATPmax/P-O/PCr-ATP in aged mice and the single-dose human ATPmax rise), Age-Related Tissue Dysfunction (INHIBITS -- diastolic function, glomerulosclerosis, endurance), and Mitochondrial Contribution to Senescence and Inflammation (INHIBITS -- late-life SS-31 lowers glomerular senescence markers). Deliberately NOT linked to the Mitochondrial Damage and mtDNA Mutation node, because the drug acts on the regulatory redox and structural state of existing mitochondria rather than on accumulated mtDNA lesions; this is stated in the treatment description so a conformer does not copy the wrong target.

    Added animal_models[Naturally aged wild-type mouse] with two modeled_mechanisms links (both RECAPITULATES, fidelity MODERATE) carrying seven grounded readouts: ATPmax and P/O DECREASED with age and RESTORED on treatment, cardiomyocyte proton leak INCREASED, cardiac proteome S-glutathionylation RESTORED, and diastolic function, treadmill endurance, and glomerulosclerosis RESTORED. Fidelity is MODERATE rather than HIGH on the bioenergetic link because the in vivo deficit does not reproduce ex vivo in permeabilized fibers from the same muscles; the tissue link records that the organ benefits are regimen-dependent (intermittent dosing preserved exercise tolerance and LV mass but lost the renal effect).

    Added discussions[elamipretide_aging_translation_gap], kind HUMAN_MODEL_MISMATCH, attached to both pathophysiology nodes, the treatment, and the animal model. The mismatch is specifically at the bioenergetic-to-tissue-function edge and not at target engagement: the randomized human trial in 39 older adults preselected for poor mitochondrial function raised ATPmax but left fatigue resistance unchanged, and MMPOWER-3 missed both primary endpoints in primary mitochondrial myopathy. That negative human result is also recorded as a REFUTE evidence item on the Age-Related Tissue Dysfunction target_mechanism, per the evidence policy covering an item that supports one part of a claim and contradicts another. One proposed_experiment (chronic dosing with a matched-modality endurance endpoint) with a decision criterion and would_support/would_refute references.

    Updated the module description and notes to declare the new arm, since the description is the authoritative statement of module scope.

    Validation: just validate passed (30/30 snippets verified against cached references, term validation clean); check-entity-refs, check-duplicate-keys, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading all clean; 16326 pytest tests passed in the model-readout/entity-ref/module subset. Eleven new references_cache entries were fetched with just fetch-reference.

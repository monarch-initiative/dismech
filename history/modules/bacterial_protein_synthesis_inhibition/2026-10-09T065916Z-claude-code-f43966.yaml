  summary: Add consequence and intrinsic-resistance nodes to the ribosome module
  details: |
    This module already had three nodes and two conformance targets, and is the most heavily used of the antibacterial set - 47 of the 70 conformance links across the four modules point at its ribosomal target node. It still had no consequence node, so the most-cited drug-mechanism module in the KB said what the drugs bind and not what binding achieves.

    Added two nodes, following the pattern the sibling cell-wall module already sets.

    Loss of Proteome Supply and Translational Fidelity (consequence; GO:0006450 regulation of translational fidelity DECREASED, GO:0040007 growth DECREASED) carries the split that decides bacteriostatic from bactericidal, which the module previously stated in its description with no citation: most classes withhold peptide and arrest growth reversibly, while the aminoglycosides corrupt decoding and deliver mistranslated protein. Three REVIEW_SYNTHESIS items from PMID:29570352 support the misreading mechanism at A1492/A1493, the selectivity basis in the same decoding site, and the peptide-withholding arm across both Gram classes - the last of which also records the mitochondrial ribosome as the one host compartment where selectivity does not hold.

    Intrinsic Inaccessibility of the Ribosomal Target (intrinsic_resistance) covers the two organism groups that defeat the module with no determinant: strict anaerobes cannot import aminoglycosides because uptake needs the proton-motive force from oxidative metabolism, and the Gram-negative outer membrane excludes the hydrophobic macrolides. Both are from PMID:29570352. These were not expressible on the existing resistance node, which is about acquired, susceptibility-testable determinants, and they constrain empiric choice before an isolate exists.

    Also corrected the module description, which asserted that aminoglycosides are bactericidal 'because they cause misreading and membrane damage'. The misreading arm is what the new node's evidence supports; secondary membrane damage is a long-proposed contribution and is now stated as such rather than as established fact.

    Validated with just validate-module-batch (8 snippets, 0 issues) plus the offline per-file gates.

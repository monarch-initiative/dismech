  summary: 'Create: Hepatic Gluconeogenesis Failure Module'
  details: |
    Created the hepatic gluconeogenesis failure mechanism module: a 9-node atomic trigger-to-consequence pathograph for the gluconeogenic enzymopathies (fasting hypoglycemia + lactic acidosis final common pathway). Chain: Gluconeogenic Flux Block -> Failure of Hepatic De Novo Glucose Production (central_effector / key conformance target) -> branches to (a) Reduced Hepatic Glucose Output -> Fasting Hypoglycemia -> CNS Glucose Deprivation -> Neuroglycopenic Dysfunction and (b) Accumulation of Gluconeogenic Three-Carbon Substrates -> Lactate Overproduction -> Lactic Acidosis. Generic hepatocyte/neuron cell types and liver/brain locations for organ-agnostic conformance. Deep-research provider was claude_code (just research-module); its run was web-search-only (haiku/sonnet, agentapi absent) and lead-quality, so all evidence was sourced independently via NCBI E-utilities. Backbone PMIDs: 25246452 (FBPase deficiency is a gluconeogenesis defect), 28649521 and 34150393 (pyruvate carboxylase deficiency - substrate accumulation, lactic acidosis, seizures), 27139513 (GSD Ia/G6PC), 28216384 (cytosolic PEPCK/PCK1 deficiency), 28731034 (hepatic glucose metabolism review), 31804789 (FBP1 GeneReviews, neuroglycopenia; tagged in references). Validated: just validate (14/14 snippets, 15 titles, 0 issues), validate-terms PASS, count-verified-snippets 14/14, check-entity-refs/causal-targets/duplicate-keys/qualifier-terms/coarse-phenotypes/block-scalar OK, check-genereviews TAGGED=1, and the authoritative validate-module-batch PASS. Whole-KB sandbox checks (check-title-snippets/snippet-length/reference-titles) could not run due to a full shared disk; file-level title/snippet validation was covered in-place by just validate and validate-module-batch.

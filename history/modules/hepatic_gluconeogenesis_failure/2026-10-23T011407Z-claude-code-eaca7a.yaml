  summary: Record that all four gluconeogenic enzyme blocks now conform
  details: |
    The module was orphaned: it described the four classic gluconeogenic enzyme blocks and named the kb entries a curator would wire to it, but no entry declared conformance. All four are now wired, eight links in total. Fructose-1,6-Bisphosphatase_Deficiency (FBP1) at two nodes, Pyruvate_Carboxylase_Deficiency_Disease (PC) at one, Glycogen_Storage_Disease_Type_I (G6PC) at one, and Phosphoenolpyruvate_Carboxykinase_Deficiency_Cytosolic (PCK1) at four. Seven of the eight share a GO term with the module node they name and none is reported edges_absent. Updated the description, which said the PCK1 entry was being curated in parallel; that entry has since landed, so the sentence now records that all four are curated and conform, and notes that the PCK1 entry conforms along the chain rather than at the convergence alone. No node, evidence, term or edge in the module itself was changed.

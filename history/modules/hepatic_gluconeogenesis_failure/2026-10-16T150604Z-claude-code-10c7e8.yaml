  summary: Address review round 1
  details: |
    Addressed CHANGES_REQUESTED review round 1 on PR #14466 (Hepatic Gluconeogenesis Failure module). (1) Removed the PMID:34150393 evidence item from the Neuroglycopenic Dysfunction node: that Cureus PC-deficiency abstract attributes neuro damage to lactic acid/toxic components, not to glucose deprivation, so it does not support a neuroglycopenic mechanism; the FBP1 GeneReviews PMID:31804789 item that ties the neuroglycopenic features to hypoglycemia remains. (2) Replaced the misread PMID:34150393 quote on the Lactate Overproduction node (its 'This is due to the accumulation of lactic acid and toxic components' refers to neurological damage, not lactate production) with FBP1 PMID:25246452 'hypoglycaemia, ketosis and lactic acidosis', graded SUPPORT/HUMAN_CLINICAL/INDIRECT. (3) Re-scoped the lactic-acidosis branch framing in description and notes: the substrate-backup reading fits the pure gluconeogenic enzymes FBP1 (cleanest) and PEPCK best; PC's lactic acidosis is substantially anaplerotic and can occur without hypoglycemia; GSD Ia lactate is mostly glucose-6-phosphate shunted into glycolysis. Added a PMID:28649521 REFUTE evidence item on the Lactic Acidosis node documenting severe lactic acidosis with normal plasma glucose in PC deficiency (lactate/hypoglycemia decoupling). Suggestion taken: switched the central-effector GO term from GO:0019319 hexose biosynthetic process to the more specific, trigger-consistent GO:0006094 gluconeogenesis. All snippets exact substrings of cached references; validate-module-batch passed.

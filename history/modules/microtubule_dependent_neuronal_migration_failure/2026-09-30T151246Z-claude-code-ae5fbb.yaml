  details: |
    Follow-up to the review of PR 13043, whose five suggestions were optional and left open at merge. (1) The ABM's arrival-delay readout now binds GO:0021799 cerebral cortex radially oriented cell migration instead of GO:0001764 neuron migration; the Pafah1b1 cell-autonomy readout keeps GO:0001764, because PMID:9697693 reports cortex, hippocampus and olfactory bulb, and its preferred_term drops 'radial'. (2) The mosaic band-score readout now gives both figures from results.json: 0.63 to 0.73 across the affected-fraction sweep (fractions 0.1 to 0.9) and 0.7455 in the mosaic_severe scenario. (3) The arrest finding now says the arrested fraction rises up to a perturbation of 0.8, dips at 0.9 (0.665 against 0.715), and is zero at 1.0, where run.py sets motility to base_motility * (1 - e) = 0 so no neuron leaves the ventricular zone. Figures checked against models/neuronal_migration_abm/results.json.

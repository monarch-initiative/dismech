  summary: Curate quantitative migration readouts as calibration targets
  details: |
    Curated the measured quantities a radial-migration model would have to be calibrated against, which the module previously named nowhere. Four readouts on the existing organoid experimental-model link to Microtubule-Based Neuronal Motility Failure, all from the cached full text of PMID:28111201: average migration speed on radial processes (20 against 13 micrometres per hour, DECREASED), track straightness (DECREASED), fraction of neurons reaching the pial surface in cortical-explant co-culture (50 against about 10 percent, DECREASED), and the isogenic 17p13.3 rescue arm (RESTORED). Added a Pafah1b1 (Lis1) allelic-series mouse to a new animal_models section (PMID:9697693), with a PERTURBS link to Microtubule Apparatus Perturbation carrying an ordinal dose-response readout across the three-allele activity series, and a RECAPITULATES link to the motility node carrying the cell-autonomy readout that licenses the mosaic regime. Gene bound to hgnc:8574 PAFAH1B1, read from cache/hgnc/terms.csv; the GO:0001764 binding was likewise read from cache. Typed divergences on both animal-model links (PROXY_QUANTITY for gene dosage standing in for apparatus state, SPECIES_MISMATCH for the lissencephalic mouse cortex). Updated the agent-based model's two CALIBRATION_PROVENANCE divergences to name these curated targets and state that the model is fitted to neither, and its STRUCTURAL_IDEALIZATION divergence to note that track straightness measures a failure mode the model's two parameters cannot express. Also repaired a folded-scalar hyphen split (phase-dependent) introduced by the earlier model commit, which had check-folded-hyphens red on HEAD. Validated: just validate-module (40 snippets, 40 titles, 0 issues), entity refs, enum values, duplicate keys, model-scale-audit --strict, check-snippet-grading, check-title-snippets, check-snippet-length, check-reference-titles, check-folded-hyphens, and the model and KB data tests.

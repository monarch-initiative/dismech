  details: |
    Two module edits from docs/reports/tubulinopathies-grouping-review-2026-08-20.md.

    Recommendation 5: added a CRISPRa beta-tubulin isotype compensation treatment with a target_mechanisms link (RESTORES) on the Microtubule Apparatus Perturbation node, from PMID:42589608. This is the first non-supportive therapeutic candidate anywhere in the Tubulinopathies grouping, and the first use of the module drug-target pattern here. It is curated at module level rather than on a disorder entry because it is mutation-independent by design - the rationale is precisely that tubulinopathy variants are scattered across several genes, which defeats per-variant editing. Its preclinical, cell-based-only status is stated in the description, the notes and the evidence explanations so no conformer inherits it as an available therapy.

    Recommendation 11: added gap_tubulin_isotype_specificity_of_migration_lesions. The Tubulinopathies grouping keeps its members as separate Disease entries on the premise that tubulin isotypes differ in expression timing and binding partners - a load-bearing claim that was asserted nowhere-evidenced in the KB. Two 2026 lines of work now supply the two halves of a mechanism: spatially resolved atlases showing isotype transcripts are not interchangeable across cell states, and in silico work showing isotype-specific C-terminal tails differentially engage the dynein motor. The direct test - one substitution at an equivalent structural position across several isotypes in a common background - has not been done, so this is recorded as an open gap with the authors' own caveats quoted, not as settled support.

    Verified: just validate passed with 29/29 snippets verified against cached references.

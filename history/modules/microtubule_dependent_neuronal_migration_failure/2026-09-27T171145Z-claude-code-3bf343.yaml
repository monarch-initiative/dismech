  summary: Bind the agent-based model's readouts and variables to HPO terms
  details: |
    Semantic wiring of the repository-authored radial migration agent-based model. variables[].mappings_list now binds cortical_plate_fraction (below 0.95) to HP:0002269 Abnormality of neuronal migration, a new arrested_fraction variable (above 0.1) to HP:0002282 Gray matter heterotopia, and band_score (above 0.6) to HP:0032409 Subcortical band heterotopia; all three terms are ones the module's conforming disorder entries already bind, read from cache/hp/terms.csv. Every threshold is a placeholder equal to the runner's pattern-classifier value or a round number, stated as such in each mapping description; nothing is fitted. lamination_fidelity is deliberately unmapped: an OLS search of HPO for 'cortical lamination' returned no term, and lissencephaly would over-claim since the model cannot produce a thickened plate. The link readouts are grounded the same way (phenotype_term on the arrested-fraction and band-score readouts; biological_processes GO:0001764 neuron migration DECREASED on the arrival-delay readout). The spec's new phenotype_mappings section carries the same rules, with the compound condition for the band (band score plus at least half the affected neurons arrested plus at least 90% of unaffected neurons settled), and the runner records the phenotypes each scenario and sweep row activates in results.json; a test keeps spec and record in step and checks that wild type activates nothing, heterotopia needs the arrest rule, and the band term appears only where the pattern is band_heterotopia. Validated with just validate-module (schema, terms, references), entity refs, enum values, duplicate keys, model-scale-audit --strict, and the model and data tests.

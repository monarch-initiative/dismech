  details: |
    Added a computational_models record for a repository-authored, one-dimensional, stochastic agent-based model of radial neuronal migration (models/neuronal_migration_abm.yaml, .py, .results.json; guarded by tests/test_neuronal_migration_abm.py). Each of the model's rules transcribes a node or causal edge of this module and the spec names the curated source per rule; the inside-out settling rule is labelled a background assumption because no curated edge states it. The curated CRISPRa target_mechanisms edge is encoded as a swept rescue fraction. No rate is fitted to data; the module record's findings are stated as orderings of regimes (uniform slowing preserves lamination until late cohorts are stranded; arrest, not slowing, produces intermediate-zone ectopia; a heterotopic band emerges only under mosaicism; the model cannot produce a thickened plate because the module curates no neuron-to-settled-neuron interaction). Added biological_scale to the four pathophysiology nodes (MOLECULAR, CELLULAR, TISSUE, CELLULAR) so the model-scale audit can compare the model's CELLULAR observations against each target; the dyslamination link carries a SCALE_EXTRAPOLATION divergence accordingly. Validated with just validate-module, validate-terms, check-entity-refs, model-scale-audit and the model, models-export and data tests.

  summary: 'Review round 1: fix four unsourced or truncated claims'
  details: |
    First review round on #15925. All four blocking items were defects in the creating commit, and two of them were claims the module made about its own contents.

    The Hypocalcaemia snippet was cut at 'within 12', dropping the time unit the node description depends on. Extended to the full clause including the severity breakdown. The cause is worth recording: the cached source has a non-breaking space between 12 and months, which is why the quote was cut there and why a later literal substring check for the extended text failed; normalize_text collapses U+00A0 like any whitespace, so the snippet now uses a plain ASCII space.

    The module notes claimed the source's asymptomatic-and-transient finding was quoted on the node. It was not: it appeared only in the curator-written description. Added as a second evidence item on the Hypocalcaemia node, HUMAN_CLINICAL and PRIMARY_RESULT, so the notes sentence is now true.

    The Familial_Hypocalciuric_Hypercalcemia_2 conformer node said the drug acts downstream of the GNA11 defect. The calcium-sensing receptor is upstream of G-alpha-11, so this was backwards and contradicted the same treatment's existing target_mechanisms text. Reworded to say the drug acts at the receptor upstream of the defect so more signal passes through the partly functional mutant G protein, which is also how PMID:28833550 states the mechanism.

    The Parathyroid_Hyperplasia conformer node said the drug suppresses secretion without reducing gland mass. Nothing cited supports an absence of effect on gland mass, and the claim cut against the module notes, which record that effects on hyperplasia are reported but not established here. Replaced with a statement that the node does not model gland mass.

    Two of the three non-blocking suggestions were taken. A notes sentence now records that the single-valued therapeutic_modality of SMALL_MOLECULE names cinacalcet rather than the class, since etelcalcetide is a peptide. And each of three conformer nodes gained its own disease-specific evidence item from a source already cached on that entry: PMID:28833550 for FHH2, PMID:29047366 for parathyroid carcinoma, PMID:35566721 for FHH1. The third suggestion, quoting the hungry-bone-syndrome mechanism on the lowered-PTH edge, was declined on a checkable ground: that sentence is in the paper's introduction rather than its abstract, and module snippets are matched abstract-only, so it would fail validation in a module.

    One error was caught internally rather than by review. The FHH1 reference_title was first written from memory as 'Familial hypocalciuric hypercalcemia types I, II and III.' when the real title is 'Disorders of the Calcium Sensing Signaling Pathway: From Familial Hypocalciuric Hypercalcemia (FHH) to Life Threatening Conditions in Infancy.' All three newly added titles were then checked against their cache frontmatter and the wrong one corrected before validation.

    Validation on the new head: validate-module-batch 14 snippets and 14 titles with 0 issues; validate-disorders over the five conformers 272 snippets and 294 titles with 0 issues; validate-modules all pass; check-snippet-grading clean including the cross-file comparison; check-reference-titles clean; the offline structural gates clean.

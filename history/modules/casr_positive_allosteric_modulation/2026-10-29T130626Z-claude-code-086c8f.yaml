  summary: 'Create: CaSR positive allosteric modulation module'
  details: |
    Created kb/modules/casr_positive_allosteric_modulation.yaml, the sixth drug-mechanism module in the GPCR Workstream A queue of projects/GPCR.md, and wired five conformers.

    Five-node chain: calcimimetic occupancy of the parathyroid calcium-sensing receptor (trigger) -> increased receptor sensitivity to extracellular calcium (amplifier) -> suppression of parathyroid hormone secretion (central effector, the key conformance target) -> lowered circulating parathyroid hormone, calcium and phosphate -> hypocalcaemia. Hypocalcaemia is modelled as a consequence arm rather than an adverse-effect aside because it is the same mechanism read at the organism scale.

    Two deliberate omissions, both recorded in the module notes. GO has no calcium-sensing receptor activity term: OLS go search for 'calcium-sensing receptor activity' returns GO:0005220 and GO:0005219, both calcium channel activities, and 'extracellular calcium ion sensing' returns nothing, so the trigger sits on GO:0004930 G protein-coupled receptor activity and the receptor identity is carried by the CASR gene binding. And no transducer is bound: the receptor does couple through Gq/11 and phospholipase C, but no cited abstract states that step, so no GO terms were bound for it. That omission is deliberate and follows the review finding on #15795, where binding a Gq/phospholipase C chain no cited source named was the blocking defect.

    Grounded on two drugs rather than one. PMID:29534286 is cited for the sensitisation step because it states the mechanism for etelcalcetide and names the chief cell; PMID:25498383 states it for cinacalcet and carries it through to serum parathyroid hormone, calcium and phosphate. PMID:29680147 establishes that the receptor is a GPCR and that calcimimetics are positive allosteric modulators, which is also what scopes the module away from the calcilytics. PMID:18397701 is the randomised placebo-controlled trial behind the consequence node, PMID:31848883 the haemodialysis cohort behind the hypocalcaemia arm, and PMID:29047366 supports the central effector being indication-independent by reporting the same suppression in parathyroid carcinoma as in uraemic hyperplasia.

    Conformers wired at the trigger, each with a therapeutic_vulnerability node and an ACTIVATES target_mechanisms link and no downstream edge: CKD-Mineral_Bone_Disorder, Familial_Hypocalciuric_Hypercalcemia_1 and _2, Parathyroid_Gland_Carcinoma, Parathyroid_Hyperplasia. Two candidates excluded with reasons in the notes: Multiple_Endocrine_Neoplasia_Type_1 has no calcimimetic treatment to wire, only a mention inside a parathyroidectomy treatment binding no agent; Autosomal_Recessive_Hypophosphatemic_Rickets_1 records one adjunctive course that was stopped and whose own description says it does not establish routine efficacy. The autosomal dominant hypocalcaemia entries are recorded as never-conformers, since activating receptor variants make a calcimimetic the wrong direction of action.

    Validation: validate-module-batch 13 snippets and 13 titles with 0 issues; validate-disorders over the five conformers 269 snippets and 291 titles with 0 issues; check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values, check-block-scalar-comments, check-coarse-phenotypes and check-delivery-system all clean. Every snippet was confirmed a verbatim substring of its cached abstract before being written.

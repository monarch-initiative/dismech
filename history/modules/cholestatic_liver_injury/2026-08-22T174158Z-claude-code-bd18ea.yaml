  summary: 'Create module: cholestatic_liver_injury'
  details: |
    Created the cholestatic liver injury mechanism module as part of a hepatobiliary review. The whole cholestatic arm of the KB (PBC, PSC, IgG4-SC, PFIC, biliary atresia, ICP, Alagille) previously carried zero conforms_to links, indicating a missing conserved mechanism. Five-node chain: impaired bile formation/secretion -> hepatocellular and biliary bile acid retention -> bile-acid-mediated hepatocyte and cholangiocyte injury (central_effector, key conformance target) -> ductular reaction and cholangiocyte-driven fibrogenesis -> biliary fibrosis progressing to biliary cirrhosis. Carries the anticholestatic drug-target pattern on the retention amplifier (UDCA, obeticholic acid), with the POISE trial's null fibrosis result and pruritus aggravation curated as PARTIAL evidence so conformers cannot inherit an antifibrotic claim. An evidence-ordering guardrail from PMID:24742700 records that neutrophil recruitment follows rather than causes bile-acid-induced necrosis. A KNOWLEDGE_GAP records that no therapy acts on the ductular reaction node. Scope boundaries against cholelithiasis_biliary_supersaturation, fibrotic_response, drug_induced_liver_injury and the isolated bilirubin transport defects are stated in notes. Validation: linkml-validate clean; linkml-term-validator passed; 20/20 evidence snippets verified against cached references.

  summary: Add the blockade node the module was named for, and its resistance node
  details: |
    The module is called Immune Checkpoint Blockade, says in its own description that it defines the mechanism-of-action pattern for checkpoint inhibitor treatments, and had no node representing the blockade. Its chain ran neoantigen generation, T cell response, adaptive immune resistance, exhaustion and immune escape, then stopped. So a conforming entry's anti-PD-1 or anti-CTLA-4 agent had nothing to reach by target_mechanisms, and the module ended on the tumour winning. 34 conformance links.

    Checkpoint Blockade and Restoration of Effector Function (therapeutic_vulnerability; GO:0002456 T cell mediated immunity, GO:0002710 negative regulation of T cell mediated immunity DECREASED) is now that node, downstream of adaptive immune resistance. It records three things the module did not say: the antibody removes a brake from immunity the patient already has, so the upstream nodes are load-bearing rather than scene-setting; the two drug classes act at non-overlapping points of one cycle, which is the mechanistic argument for combining them rather than additive potency; and the immune-related toxicity is the same mechanism acting outside the tumour, which is why it is managed by suppressing the response instead of changing agent. PMID:20525992 for the randomised survival result and the 10 to 15% grade 3-4 rate, PMID:28187290 for the combination.

    Primary and Acquired Resistance to Checkpoint Blockade (adaptive_escape; GO:0019882 DECREASED) records where failure actually sits. Not at the checkpoint, which the antibody blocks reliably, but at the earlier nodes: no antigen, or antigen that can no longer be displayed through loss of B2M, MHC class I or TAP, or tumour-intrinsic routes that exclude T cells. The acquired form is the same lesion arriving later, and the worked case ties two modules together - in the mismatch-repair-deficient cohort that supplies the neoantigen vulnerability node added to genome_instability_mutation in this same branch, the brain metastases that escaped pembrolizumab had acquired truncating B2M mutations their primaries lacked. So the vulnerability and its escape route are measured in one series. PMID:28187290 three times, PMID:28596308 once.

    Also cited the CTLA-4 brake on the existing Anti-Tumor T Cell Response node, which asserted the CD28/B7 competition with no evidence at all.

    The notes now say where a conforming entry's inhibitor and its resistance route belong, and that an entry whose immunogenicity comes from a caretaker lesion can conform both here and to the genome-instability node, where the scope limit on mutational burden as a biomarker also applies.

    Left the deprecated updated_date in place, per the rule that existing entries carrying it may retain it until a bulk cleanup.


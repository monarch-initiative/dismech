  summary: 'Create: mu_opioid_receptor_agonism'
  details: |
    First drug-mechanism module of the GPCR project (projects/GPCR.md Workstream A, Phase 1): agonism at the mu-opioid receptor (OPRM1, hgnc:8156). Thirteen pathophysiology nodes: receptor activation trigger -> Gi/o coupling and adenylyl cyclase inhibition -> G beta-gamma gating of GIRK current and voltage-gated calcium channel inhibition -> neuronal hyperpolarization and reduced neurotransmitter release (central_effector, the key conformance target) -> four tissue branches with their consequence nodes (spinal/supraspinal antinociception -> analgesia; brainstem pre-Botzinger rhythm depression -> opioid-induced respiratory depression; enteric neuron inhibition -> opioid-induced constipation; mesolimbic dopamine disinhibition -> reward/tolerance/dependence), plus a GRK/beta-arrestin desensitization and internalization modifier node feeding the tolerance consequence. Three treatments on the trigger node with treatment_effect ACTIVATES, distinguished by intrinsic efficacy: full agonists (morphine, fentanyl, oxycodone), methadone, and buprenorphine, whose respiratory ceiling (PMID:16547090) is recorded on the respiratory branch rather than in a separate module. Antagonism (naloxone, naltrexone, PAMORAs) is deliberately out of scope and left to a planned sibling module. Biased agonism is recorded as an EMERGING mechanistic_hypotheses entry with refuting evidence (PMID:32052419, PMID:32854452) plus an OPEN KNOWLEDGE_GAP discussion, not asserted as settled. Boundary with addiction_cycle recorded in notes: this module stops at mesolimbic dopamine disinhibition, upstream of that module's trigger node. All 14 references fetched with just fetch-reference; all 35 snippets verified against the cached text. Validation: validate-module-batch (schema, terms, references) passed; count-verified-snippets 35/35; validate-terms, check-causal-targets, check-entity-refs, check-duplicate-keys all clean. No conforms_to edits to disorder entries in this change (GPCR project phase 2).

  summary: 'Review round 1: mu_opioid_receptor_agonism'
  details: |
    Addressed the automated review on PR #14453. Blocking item: the first evidence item on the biased_agonism_separates_analgesia_from_side_effects hypothesis quoted only a sentence naming the candidate compounds while graded SUPPORT/DIRECT. Replaced it with the beta-arrestin2 knockout sentence from PMID:32854452, which is the result the hypothesis was built on, graded MODEL_ORGANISM (the quoted text describes knockout animals) with quote_role kept at REVIEW_SYNTHESIS; the compound-naming sentence is retained as a separate NO_EVIDENCE item so the compound list is not read as support for the transducer account. Four suggestions taken. (1) The constipation consequence node now binds GO:0030421 defecation, looked up and label-confirmed via ols:go, instead of reusing GO:0030432 peristalsis from its upstream effector. (2) Split the combined consequence node into Opioid Reward and Reinforcement, fed by Mesolimbic Dopamine Disinhibition and carrying the declared hand-off to addiction_cycle, and Opioid Tolerance and Dependence, fed by Mu-Opioid Receptor Desensitization and Internalization; the three existing tolerance/dependence evidence items stayed with the latter and the reward node took two existing-reference quotes (PMID:40630856 on accumbens dopamine release producing euphoria, PMID:31009632 tracing VTA interneuron receptors to accumbens dopamine and subjective reward), so no new reference was fetched. Both downstream edges, the module description, and the addiction_cycle boundary paragraph in notes were updated; the old node name no longer appears anywhere under kb/ or history/. (3) Regraded the PMID:35471232 receptor-deletion quote from OTHER to MODEL_ORGANISM, keeping quote_role REVIEW_SYNTHESIS, and rewrote its explanation; the other OTHER-graded review quotes describe general pharmacology with no study design named, so they were left as they are rather than regraded on an inference the sentence does not state. No snippet carries two evidence_source values in the file. (4) Added CL:0002611 neuron of the dorsal spinal cord to the dorsal-horn effector node for the second-order neuron, with a description line recording why the broad class rather than CL:0011000 dorsal horn interneuron (the population includes lamina I projection neurons, for which CL has no class) and why GO:0019233 sensory perception of pain stands in for spinal nociceptive transmission (GO has no term for dorsal-horn transmission; the binding names the pathway the suppressed step belongs to, the modifier carries the direction, and the anatomy sits in locations). Validation after the round: validate-module-batch passed (schema, terms, references), count-verified-snippets 38/38, check-causal-targets, check-entity-refs, check-duplicate-keys, check-enum-values, check-block-scalar-comments, check-snippet-grading and check-retired-support-prose all clean. projects/GPCR.md was deliberately not touched: it was removed from this branch in f043cf028 because the CI scope guard forbids kb/ and projects/ changes in one PR, and it gets its own PR.

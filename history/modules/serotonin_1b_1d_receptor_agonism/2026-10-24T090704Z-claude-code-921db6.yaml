  summary: 'Create: 5-HT1B/1D Receptor Agonism Module'
  details: |
    Fifth GPCR drug-mechanism module in the Workstream A queue of projects/GPCR.md. Eight nodes: the trigger is 5-HT1B/1D receptor agonist occupancy, which diverges into the two arms the class is known for, 5-HT1B cranial extracerebral vasoconstriction and 5-HT1D presynaptic inhibition of trigeminal neuropeptide release, and those reconverge on the key conformance target, interruption of trigeminovascular nociceptive signalling. Three adverse nodes: coronary and systemic vasoconstriction hanging off the vascular arm, chest and central nervous system sensations hanging off the trigger because the pooled data report no mechanism for them, and migraine progression scoped to the high-frequency stratum the cited review actually found it in. Two treatments, oral and subcutaneous. Four references, 17 evidence items, all snippets and titles verified against the abstract.

  summary: 'Create module: bilirubin_conjugation_transport'
  details: |
    Created the bilirubin conjugation and transport module covering hepatocellular bilirubin disposal and the hereditary hyperbilirubinaemias. Deliberately branched rather than linear: one trigger (haem catabolism and unconjugated bilirubin load) feeds two non-interchangeable lesion arms (UGT1A1 glucuronidation deficiency; conjugated bilirubin transport failure) that converge on the hyperbilirubinaemia central_effector, from which only the unconjugated arm reaches the bilirubin neurotoxicity/kernicterus consequence. Notes make arm selection the curator's first decision and explicitly forbid a transport-arm conformer declaring conformance to the neurotoxicity node, since Dubin-Johnson and Rotor syndromes are benign and non-progressive. Phototherapy is curated as a containment therapy on the convergence node with PARTIAL evidence bounding it, and a KNOWLEDGE_GAP records that gene replacement is investigational. Scope boundary against cholestatic_liver_injury is stated. Validation: linkml-validate clean; linkml-term-validator passed; 16/16 evidence snippets verified against cached references.

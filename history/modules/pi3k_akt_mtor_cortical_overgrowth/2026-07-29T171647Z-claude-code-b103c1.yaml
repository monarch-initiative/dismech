  details: |
    Closed the last outstanding gap for issue #4101 (cortical malformation knowledge-gap sweep, epic #4098). This module was the only one of the eight cortical-malformation modules carrying no discussions block; the other seven each have a HUMAN_MODEL_MISMATCH entry and all 18 conforming disorder entries carry at least one gap annotation. Added two discussions: (1) KNOWLEDGE_GAP gap_mtor_mcd_undetected_brain_somatic_mosaicism, recording that brain somatic activating variants were recovered in only 15.6 percent of the flagship FCDII cohort and only via deep sequencing of resected brain tissue, so conforming entries must not claim complete genetic characterization; (2) HUMAN_MODEL_MISMATCH gap_mtor_cortical_overgrowth_human_model_translatability, recording that rodent in utero electroporation establishes the migration/cytomegaly/seizure arms but cannot test the gyral-overgrowth arm because lissencephalic rodents largely lack outer radial glia, with a proposed mosaic human cortical-organoid experiment. All snippets are exact quotes verified against pre-existing cached abstracts (PMID:25799227, PMID:28111201, PMID:28951247); no new references were fetched and no cache file was hand-edited. just validate passes schema, term, and reference validation.

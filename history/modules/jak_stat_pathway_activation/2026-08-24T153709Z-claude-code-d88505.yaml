  summary: Extend JAK-STAT activation module conformers; correct SOCS gap count
  details: |
    Follow-up on the module created earlier in this session, prompted by a CI curation-scope failure on PR #9376 and by main having moved 12+ commits underneath the branch.

    Added 5 conformance links across 4 further disorder entries, each checked against the module's own scope guard (constitutive or ligand-independent activity must be evidenced; 'cytokine signalling is increased' is not sufficient):
    - SOCS1_Haploinsufficiency 'Loss of JAK-STAT Negative Feedback' -> #Loss of SOCS-Mediated Negative Feedback. First real conformer for the SOCS node; qualifies via the documented-loss-of-brake route (PMID:38157076, 'Unlike WT SOCS1, Thr68fs SOCS1 fails to inhibit JAK-STAT signaling when expressed in vitro').
    - SOCS1_Haploinsufficiency 'Cytokine Hypersensitivity with Increased STAT Activation' -> #Constitutive STAT Activation and Nuclear Translocation.
    - Aggressive_NK-cell_Leukemia 'JAK-STAT Pathway Activation' -> STAT node (activating STAT3 mutations, 21% of patients).
    - Sezary_Syndrome 'JAK/STAT pathway activation' -> STAT node (recurrent gain-of-function mutations in JAK1, JAK3, STAT3, STAT5B; JAK1-mutant primary cells sensitive to JAK inhibition).
    - Breast_Implant_Associated_Anaplastic_Large_Cell_Lymphoma 'JAK/STAT Activation in BIA-ALCL' -> STAT node ('sequence variants leading to JAK/STAT activation in 10 out of 11 patients').

    Deliberately NOT wired: Classic_Hodgkin_Lymphoma 'Mutation-Driven JAK/STAT Activation'. cHL JAK-STAT activation is real biology, but the entry's cited snippet only lists JAK/STAT among several pathways carrying recurrent variants and does not evidence constitutive activity, so it fails the module's own scope guard. Left for a curation pass that strengthens that entry's evidence first.

    Corrected a factual staleness introduced by main moving: the KNOWLEDGE_GAP rationale and the CLAUDE.md registry line both said '2 entries mention SOCS'. Three entries now do (Chuvash_Polycythemia, SOCS1_Haploinsufficiency, Urticaria), and only SOCS1_Haploinsufficiency models the brake itself. Both texts corrected.

    Added a 'Straddling diseases' paragraph to the module notes. SOCS1_Haploinsufficiency is the worked example of one disease with a node on each arm: losing the SOCS brake raises STAT1 phosphorylation to a degree comparable with STAT1 gain-of-function disease while LOWERING STAT3 phosphorylation. Its increased-STAT and SOCS nodes conform here; its sibling 'Reduced STAT3 Phosphorylation' node deliberately does not. This is the two-module (activation / deficiency) split working at node rather than entry granularity.

    Also applied the 'scope-override' label to PR #9376. The curation-scope CI guard (added 2026-08-20) fails any PR touching kb/ plus a path outside the curation allowlist, and the create-module skill mandates registering new modules in CLAUDE.md. PR #9322 (photoaging module, merged 2026-08-24) established the label as the house remedy for exactly this shape.

    Validation: linkml-validate clean on the module and all 4 newly touched disorders; linkml-term-validator --labels passed; snippet audit over module plus newly touched entries 148/208 verified (60 skipped by prefix); folded-hyphen, snippet-length and title-snippet ratchets report no new findings; duplicate-key check clean across 4322 files; pytest -k conforms_to 2354 passed.

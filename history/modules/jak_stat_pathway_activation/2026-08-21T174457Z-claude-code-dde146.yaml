  summary: 'Create: JAK-STAT pathway activation module'
  details: |
    Created kb/modules/jak_stat_pathway_activation.yaml, a 6-node module for pathological ACTIVATION of the cytokine receptor-JAK-STAT axis: activating lesion or sustained ligand drive upstream of JAK (trigger) -> constitutive JAK kinase activation (amplifier; the JAK-inhibitor drug target) -> constitutive STAT activation and nuclear translocation (central_effector, key conformance target) -> sustained STAT-driven target-gene transcription (effector) -> cytokine-independent proliferation and chronic inflammation (consequence), plus loss of SOCS-mediated negative feedback (modifier) as a parallel entry into the effector node.

    Design decision: the KB's 42 ontology-grounded JAK-STAT nodes split 30 INCREASED / 7 DECREASED on GO:0007259, so the pathway fails in both directions. Following the cellular_senescence / senescence_tumor_suppression precedent (two modules rather than one effect-reversing edge, and that module's explicit rule that inverse mechanisms must not conform to the positive nodes), this module covers the ACTIVATION arm only; a jak_stat_signaling_deficiency module for the loss-of-signalling entries (IL2RG/JAK3 SCID, GHR growth hormone insensitivity, GM-CSF receptor dysfunction, LIFR/gp130 failure, dominant-negative STAT3) is a planned follow-up. A single neutral-backbone module was considered and rejected because GOF and LOF share no rate-limiting node.

    Paralog handling follows fgfr_gain_of_function_skeletal_dysplasia and cardiac_ion_channel_repolarization: module nodes carry the family census in genes (four JAKs on the JAK node; the four STATs with established human GOF disease on the STAT node) and conforming disorder nodes narrow to the paralog their own evidence supports. JAK3 is listed only in the four-paralog census, since human JAK3 disease is loss-of-function.

    Evidence: 14 evidence items across 5 PMIDs (25587654 O'Shea JAK-STAT review; 15793561 James JAK2 V617F; 22375971 COMFORT-I ruxolitinib; 17525754 Yoshimura SOCS; 22520844 Stark and Darnell). Newly fetched via the reference validator cache command: PMID:22520844, PMID:17525754, PMID:15793561, PMID:22375971.

    Carries an open KNOWLEDGE_GAP recording that the SOCS-feedback arm is almost entirely uncurated (2 KB entries mention SOCS against ~30 annotating GO:0007259 INCREASED), so the KB cannot currently distinguish a stuck accelerator from a failed brake.

    Wired 8 conformance links across 6 disorder entries: Polycythemia_Vera (JAK and STAT nodes), Essential_Thrombocythemia, Primary_Myelofibrosis, Autoinflammation_Immune_Dysregulation_and_Eosinophilia (JAK and STAT nodes), STAT6_Gain_of_Function_Disease, Chronic_Mucocutaneous_Candidiasis. Registered in the CLAUDE.md module catalog.

    Validation run: linkml-validate (module + all 6 touched disorders, no issues); linkml-term-validator --labels (passed); linkml-reference-validator validate data on the module (all validations passed, 14/14 snippets verified); reference_snippet_audit over the module plus all 6 touched disorders (455/491 verified, 36 skipped by prefix); check_folded_hyphens, check_snippet_length, check_title_snippets (no new findings); check_duplicate_yaml_keys and not4curation_audit on the touched files (clean); pytest -k conforms_to (2263 passed).

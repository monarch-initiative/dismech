  summary: 'Gene-family review: HMOX1'
  details: |
    The ARE regulon node names SRXN1, NQO1, HMOX1, GCLC and GCLM but bound only SRXN1's sulfiredoxin activity. HMOX1's own activity, GO:0004392 heme oxygenase (decyclizing) activity, is now bound as INCREASED, supported by the node's existing citation reporting up-regulation of HO-1 alongside SRXN1 (PMID:30841754). NQO1, GCLC and GCLM still have no activity of their own on this node; they were outside this review.

  summary: Create KEAP1-NRF2-ARE Signaling Module
  details: |
    Created the KEAP1-NRF2-ARE antioxidant-response mechanism module (seed PMID:40972999, issue #16807): five-node chain KEAP1 sensor cysteine modification -> NRF2 escape from KEAP1-CUL3 degradation -> NRF2 ARE transcription (key conformance target) -> ARE regulon (SRXN1/NQO1/HMOX1/GCLC/GCLM) -> cytoprotective antioxidant response, direction carried by the modifier a conformer sets. Node evidence from fetched/verified abstracts (PMID:27497696, 25014534, 42844347, 18757741, 30841754, 24714741) plus the seed computational model as a KINETIC computational_models entry with BOUNDARY_OMISSION + POPULATION_MISMATCH divergences; added a treatments block for KEAP1-targeting NRF2-activating electrophiles (dimethyl fumarate, bardoxolone methyl, omaveloxolone; PMID:42224961, 37188495). Wired 9 conformers via conforms_to to the central node, each carrying NFE2L2 (hgnc:7782) and the GO:0001228 transcription-activator function with an explicit DECREASED (blunted) or INCREASED (constitutive) modifier so the direction is queryable (HLRCC as a list alongside oncometabolite_dioxygenase_inhibition). Cross-checked against the openscientist deep-research run, which independently reproduced the backbone and the KEAP1-upstream ordering with no contradictions; the claude_code run refused to produce a report (its own safety classifier) and is not counted as a cross-check. SRXN1 confirmed hgnc:16132 by lookup. Validated: linkml-validate, term-validator, reference-validator, validate-disorders, and the offline gates.

  summary: 'Create: enterocyte_polarity_trafficking_failure module'
  details: |
    Created the enterocyte polarity and trafficking failure module, completing the set of three sibling modules covering the epithelial CODE classes as the current nosology separates them (PMID:29654747), and wired its two conformers.

    The three modules now are: diet_induced_osmotic_diarrhea (loss of a substrate-specific step handling an ingested nutrient; normal villus architecture; remits on dietary elimination), electrolyte_transport_related_diarrhea (loss of an ion-transport step; normal villus architecture; low stool osmotic gap; persists through bowel rest), and this one (loss of the polarized apical surface itself; abnormal villus architecture; persists through bowel rest; transplantation is the only cure).

    The discriminator that assigns a disorder to this module rather than either sibling is the villus-to-crypt ratio - abnormal here, normal in both others - which is exactly the split PMID:29654747 draws, and that sentence is cited on the Abnormal Villus Architecture node. Each module's notes forbid a disorder conforming to it and a sibling for the same node.

    Five-node chain: loss of apical delivery or junctional adhesion machinery (trigger) -> loss of a functionally polarized absorptive epithelial surface (central_effector, key conformance target) -> abnormal villus architecture and, in parallel, feeding-independent intractable diarrhea (two effectors) -> intestinal failure and parenteral nutrition dependence (consequence).

    The module deliberately admits two molecularly distinct trigger arms - apical-delivery trafficking failure (MYO5B/STX3) and junctional adhesion failure (EpCAM, directly or via SPINT2-unleashed matriptase). They are classified together as the defective enterocyte trafficking and polarity CODE category and converge on one rate-limiting node, but they are not equivalent: the histologies differ (intracellular microvillus inclusions versus focal epithelial tufts). The notes say so explicitly and instruct conformers to substitute their own arm's lesion rather than the generic description, so the convergence is not read as equivalence.

    Treatment patterns: parenteral nutrition BYPASSES the diarrhea node, and small-bowel transplantation RESTORES the central effector. The latter is the therapeutic signature of the class - neither sibling module has a curative intervention, because in those classes the epithelium is intact and a single step can be replaced or avoided instead. The CTE caveat against first-line transplantation is preserved in the treatment evidence.

    Explicit exclusions recorded in the notes: immune-mediated enteropathy (IPEX, autoimmune enteropathy), where epithelial damage is secondary to immune dysregulation and PMID:29654747 separates epithelium-intrinsic from immune-mediated CODEs on that basis; barrier injury and inflammatory villus blunting, covered by intestinal_barrier_dysfunction; and post-uptake intracellular metabolic defects such as DGAT1 deficiency, where the apical surface is intact and endoscopy is typically normal.

    Conformers wired: Microvillus_Inclusion_Disease (4 nodes, trafficking arm), Congenital_Tufting_Enteropathy (5 nodes, adhesion arm). The MVID notes, which previously flagged this module as a future factoring pending a second conformer, were updated to record that it now exists.


  summary: 'Review: trigger-node scope, evidence-claim trim, key-target coverage,
    conformer count correction'
  details: |
    Adversarial review pass for pathograph coherency and evidence-claim mismatch. Changes: (1) The trigger node was named for haploinsufficiency but several genuine conformers are not haploinsufficient - ATRX alleles are typically hypomorphic and hemizygous. The node description now states that the claim it makes is reduced functional dosage, so hypomorphic and hemizygous reduced-function alleles conform here, while dominant-negative or gain-of-function lesions do not and should attach downstream at the chromatin-state or transcriptional node, with Nicolaides-Baraitser (dominant-negative SMARCA2) named as the worked case already curated that way. (2) An evidence explanation on the BRPF1 item claimed that BRPF1 loss causes dominant intellectual disability; that is the cited paper's finding but is not asserted by the quoted sentence, so the explanation was trimmed to what the quote supports. (3) Added a key-target coverage section recording that 14 of 20 conformers declare the central_effector and 6 do not, with the two distinct reasons - a bundled disorder node forced into a single-valued conforms_to, or transcriptional evidence pointing somewhere other than neurodevelopment - so the gap is legible rather than looking like an oversight. (4) Corrected the conformer count from 21 to 20: the earlier figure was inflated by a grep that matched the module name in the prose notes of Cohen_Syndrome, which deliberately has no conformance edge. Edge count recorded as 58.

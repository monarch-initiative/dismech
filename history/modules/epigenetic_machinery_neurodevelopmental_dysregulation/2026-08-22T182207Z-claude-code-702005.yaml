  summary: 'Create: epigenetic machinery neurodevelopmental dysregulation module'
  details: |
    Created a mechanism module for the Mendelian disorders of the epigenetic machinery (MDEMs / chromatinopathies), a gap found while reviewing Mendelian intellectual disability coverage. The KB held dozens of chromatinopathy entries (Kabuki, Rubinstein-Taybi, Kleefstra, Coffin-Siris, Nicolaides-Baraitser, Cornelia de Lange, ATRX, ADNP, Weaver, BRPF1) with no shared mechanism module; the existing epigenetic_alterations module covers the aging hallmark (age-associated drift), a different explanandum. Five-node chain: machinery-component haploinsufficiency (writer/eraser/reader/remodeler) -> permissive-repressive chromatin state imbalance -> dysregulated neurodevelopmental transcriptional program (central_effector, key conformance target) -> impaired neuronal maturation, plasticity and postnatal neurogenesis -> ID with growth and craniofacial dysmorphism. Carries the HDAC-inhibitor chromatin-directed drug-target pattern (AR-42 in the Kmt2d+/betaGeo Kabuki mouse; vorinostat bound as the ontology-resolvable class exemplar because AR-42 has no CHEBI or NCIT identifier), guarded by a HUMAN_MODEL_MISMATCH discussion so conformers do not inherit it as a treatment recommendation. DNA-methylation episignatures were deliberately curated as a KNOWLEDGE_GAP discussion rather than as a causal node: they are measured in blood, not brain, and are a diagnostic biomarker rather than a demonstrated mediator. Wired 13 conforms_to edges across 7 disorder entries. Validation run: linkml-validate schema clean on the module and all 7 modified disorders; linkml-term-validator passed; 15 of 15 snippets verified against cached references; pytest -k conforms_to 2291 passed. Note that GO has obsoleted the histone-modification branch (GO:0016570, GO:0016573, GO:0016575), so current replacements were used (GO:0042800, GO:0004402, GO:0032452, GO:0006325, GO:0006338).

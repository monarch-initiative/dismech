  summary: Add naked mole-rat comparative negative model
  details: |
    Added the naked mole-rat as a comparative negative model with three links: RECAPITULATES on Accumulating DNA Damage (this species carries two- to eightfold more oxidative DNA damage than physiologically age-matched mice, PMID:17054663), FAILS_TO_RECAPITULATE on Declining Genome Maintenance and Erroneous Repair (2-3-fold more efficient bulky-lesion removal in cell extracts, PMID:29930219) and FAILS_TO_RECAPITULATE on the aging consequence node (PMID:21993625, PMID:29364116). The repair link carries a REFUTE evidence item (PMID:31085801) recording that poly(ADP-ribose) synthesis is more than tenfold higher in human than in either rodent extract, so repair superiority is pathway-specific rather than global, and limitations note that the comparison is cross-species at one age rather than longitudinal within the species. Validated with linkml-validate, term validation, reference validation (14/14 snippets) and the offline KB gates.

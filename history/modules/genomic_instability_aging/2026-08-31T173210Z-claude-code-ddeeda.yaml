  summary: Add turquoise killifish (Nothobranchius furzeri) animal model with modeled_mechanisms
  details: |
    Added a turquoise killifish kidney-marrow animal_models entry. RECAPITULATES 'Accumulating DNA Damage' (old immune progenitors carry increased DNA damage markers) and PARTIALLY_RECAPITULATES 'Declining Genome Maintenance and Erroneous Repair' (the replication-independent repair signature present in adult progenitors is absent in old ones). Limitations record that damage and repair are read from marker expression rather than lesion quantification or repair assays, and that killifish kidney marrow is the teleost equivalent of bone marrow rather than a homologous tissue. Evidence: PMID:41862756, snippets exact-quoted and verified. Paired with the inflammaging entry from the same study, citing different findings.

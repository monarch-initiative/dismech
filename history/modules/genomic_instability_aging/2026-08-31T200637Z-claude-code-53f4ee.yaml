  summary: Add CHIP biomarker with cross-species causal evidence
  details: |
    Added clonal hematopoiesis of indeterminate potential [NCIT:C158547] with two readouts. Newly cached: PMID:25426837 Jaiswal 17,182 participants, PMID:28636844 CHIP and atherosclerotic cardiovascular disease. CHIP is unusual among markers in this KB in being a genomic state rather than an analyte, detected by sequencing peripheral blood for recurrent driver mutations in DNMT3A, TET2 and ASXL1. Direction is PRESENT_ABSENT because CHIP is called at a variant-allele-fraction threshold rather than read as a continuous value. Two readouts: READOUT_OF Accumulation of Somatic Mutations under MONITORING, and PREDICTS DNA-Damage-Driven Cellular Dysfunction under PROGNOSTIC. The prognostic readout carries mouse bone-marrow-transplant evidence that Tet2-deficient marrow produces larger atherosclerotic lesions, making CHIP the rare case in this KB of a human aging marker with interventional cross-species support rather than association alone. The entry notes that the same measurement is curated in stem_cell_exhaustion making a different claim, so a reader does not take the duplication for an error.

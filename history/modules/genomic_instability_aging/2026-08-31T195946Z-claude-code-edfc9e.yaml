  details: |
    Responded to the blocking review finding on PR #10267 covering two defects in the 'Declining Genome Maintenance and Erroneous Repair' link. First, the link-level evidence reused the study's timescale sentence ('Within less than 10 weeks...'), which says nothing about genome maintenance; replaced with the proteomic finding that aged individuals had lower expression of proteins involved in DNA repair. Second, the readout was graded direction: DECREASED but its snippet was a contrastive sentence that never asserted a decrease - the explanation itself conceded it was 'the same contrast read for its repair-signature half'. Renamed the readout to 'Expression of proliferation- and DNA-repair-associated proteins with age' and re-cited it to the sentence that does state the decrease. Updated limitations to record that the proteomic signature also falls for proliferation and detoxification, so it is not specific to genome maintenance. Snippets exact-quoted from the cached full text and verified (11/11).

  summary: 'Create: alveolar-capillary barrier failure module'
  details: |
    Created from a PubMed scan of 2026 lung-on-chip and organ-on-chip literature (docs/reports/organ-on-chip-literature-scan-2026-08.md). Five papers using unrelated insults (diesel particulate PMID:42546767, chlorine gas PMID:41442163, whole cigarette smoke PMID:42473541, isothiazolinone PMID:42204607, cold-storage ischemia-reperfusion PMID:42083145) independently report that an exposure confined to one side of the blood-gas barrier injures the other, unexposed side. The chlorine paper times the propagation (epithelial immediate, endothelial at 72h) and the cigarette-smoke paper controls it: vascular networks exposed without an overlying epithelium stay intact. That coupling is the module's distinguishing claim, and it is only establishable in a compartmentalised model. Five nodes, trigger to consequence, key conformance target 'Alveolar Epithelial and Endothelial Junctional Disruption'. Deliberately narrower than epithelial_barrier_dysfunction, which models the allergic type-2 barrier hypothesis terminating in IgE sensitization; the distinction is recorded in the module notes. Real conformers wired in the same change: Acute_Respiratory_Distress_Syndrome (4 nodes) and High_Altitude_Pulmonary_Edema (3 nodes). Validated: linkml-validate clean, linkml-term-validator clean, 13/13 snippets verified against cached references.

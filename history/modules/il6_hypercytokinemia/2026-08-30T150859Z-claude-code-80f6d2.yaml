  summary: Split the bundled effector node after review on PR 9974
  details: |
    Addresses the CHANGES_REQUESTED review from ai4c-reviewer on PR 9974, which flagged 'Hepatic Acute-Phase Reprogramming and B-Lineage Differentiation' as the worst of three bundled non-atomic nodes, on the grounds that conforming entries inherit the bundle.

    Split into two atomic effector nodes: 'Hepatic Acute-Phase Reprogramming' (TISSUE, hepatocyte, acute-phase response) and 'B-Lineage Differentiation and Immunoglobulin Output' (CELLULAR, B cell and plasma cell). The central effector now fans out to both, with the B-lineage edge marked INDIRECT_KNOWN_INTERMEDIATES via IL-21, which is the demonstrated intermediate. Evidence was partitioned to match: the siltuximab normalization-sequence quote supports the hepatic arm, the IL-21/STAT3/PRDM1 quotes the B-lineage arm.

    The split is the right call independent of the review: the two arms act on different cell lineages, and their clinical read-outs normalize at opposite ends of the treatment-response sequence, so a single-valued biological_scale could never have been correct for the merged node. Both Castleman conformers were re-pointed to the new node names.

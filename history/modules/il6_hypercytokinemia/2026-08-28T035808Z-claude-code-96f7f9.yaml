  summary: 'Create: Interleukin-6 Hypercytokinemia Module'
  details: |
    Factors out the conserved ligand-driven IL-6 chain that the Castleman split would otherwise have restated in two entries, and that recurs well beyond Castleman disease - 119 kb/disorders entries mention IL-6.

    Five nodes with the standard role chain: sustained IL-6 oversupply (trigger) -> gp130 receptor complex engagement (amplifier) -> JAK-STAT3 activation in responder cells (central_effector, and the key conformance target) -> hepatic acute-phase reprogramming with B-lineage differentiation (effector) -> systemic inflammatory syndrome (consequence). Nodes bind GO and CL terms only, per the module contract.

    The module carries a three-rung drug-target ladder as treatments with target_mechanisms: anti-IL-6 antibody inhibits the trigger, anti-IL-6-receptor antibody inhibits the amplifier, and JAK inhibition acts at the central effector. That ladder is the module's practical point - the same chain is pharmacologically interruptible at three separate places.

    Deliberately distinct from the existing jak_stat_pathway_activation module, and the notes say so explicitly with a rule for choosing between them: that module covers cell-intrinsic, constitutive, ligand-INDEPENDENT activation from an activating receptor, JAK or STAT lesion, or from lost SOCS feedback, terminating in cytokine-independent proliferation. This one covers a structurally normal pathway driven by excess ligand, where blocking the ligand or its receptor switches the pathway off. A disorder that remits on IL-6 blockade conforms here, not there. A node should not conform to both.

    Not an Xogenesis module - the terminal output is a systemic physiological state, not a pathological anatomical entity - so no MPATH/OGMS anchor stanza applies.

    Wired six real conformers: the IL-6, JAK-STAT3 and acute-phase nodes of both Idiopathic_Multicentric_Castleman_Disease and HHV-8-Associated_Multicentric_Castleman_Disease. Unicentric_Castleman_Disease deliberately does not conform, because serum IL-6 is normal in most unicentric disease.

    Validation: schema, term and reference validation pass; 16/16 snippets verified verbatim; duplicate-key, folded-hyphen and snippet-length checks clean.

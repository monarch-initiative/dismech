  summary: Add the neoantigen-load therapeutic node, with its scope limit
  details: |
    Four nodes and four evidence items against 32 conformance links, with every item drawn from one of two reviews. The module explicitly defers the HRR/BRCA synthetic-lethality vulnerability to dna_repair_synthetic_lethality, which is right, but that left it with no account of the other therapeutic consequence of the mutator phenotype - and that one is not covered anywhere in kb/modules/.

    Added Neoantigen Load and Checkpoint-Blockade Sensitivity (therapeutic_vulnerability; GO:0002474 antigen processing and presentation of peptide antigen via MHC class I, GO:0002418 immune response to tumor cell), downstream of the central mutator node alongside clonal evolution. It is the one place where this hallmark's engine is itself the reason a therapy works: a hypermutated genome translates mutant peptides, and PD-1 blockade in mismatch-repair-deficient cancers gave objective responses in 53% of patients across twelve tumour types with neoantigen-specific T cell clones expanding in a responder, regardless of tissue of origin. PMID:28596308, cited three times - the claim, the effect size, and the mechanistic step between genome and response, which the response rate alone does not establish.

    The node carries its own scope limit, on the node rather than beside it, because a reader would otherwise infer the pan-cancer form of the claim from the tissue-agnostic result. PMID:33736924 is recorded twice: a REFUTE against mutational burden as a biomarker across all solid cancers, and a SUPPORT naming the condition the node actually depends on - that CD8 infiltration tracks neoantigen load in that tumour type - with the cancers where it does not. That pairing is what makes the REFUTE a scope limit rather than a contradiction, and the notes now tell a conforming entry it may claim this vulnerability from a defined repair-pathway defect and not from a high mutation count alone.

    Also added a human-tumour citation for the hypermutation form of the central node, replacing nothing - the review summary there stays - and recorded in Accelerated Clonal Evolution's own description why it is deliberately left with no ontology-bound process. Subclonal Darwinian selection is a population-level phenomenon and GO's biological-process branch describes what a cell or gene product does, so nothing in it names this; an over-broad binding would assert less than the absence does. That node therefore reads as anchor_no_process in just check-conformance-content by design, which the module notes now say.

    Validated: validate-module-batch (10 snippets, 0 issues), check-duplicate-keys, check-entity-refs, check-causal-targets, check-enum-values.

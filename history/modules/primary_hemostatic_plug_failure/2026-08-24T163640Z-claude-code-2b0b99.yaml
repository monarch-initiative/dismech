  summary: 'Create: primary_hemostatic_plug_failure module'
  details: |
    Created a conserved final-common-pathway module for the inherited platelet function disorders (the OMIM BDPLT series). Structure: one trigger (loss of a platelet primary-hemostatic component) fanning into four non-interchangeable parallel amplifier arms (adhesion; activation/granule secretion/integrin inside-out signalling; alphaIIbbeta3 aggregation; procoagulant membrane response), converging on a single central_effector (failure of primary hemostatic plug formation) and a consequence node (mucocutaneous bleeding diathesis).

    Design decisions, recorded here rather than only in the module notes:
    (1) Scoped to the QUALITATIVE arm only. Impaired thrombopoiesis / macrothrombocytopenia is a mechanistically distinct route despite sharing many genes (GP1BA/GP1BB/GP9, MYH9, ACTN1, TUBB1, FLI1, GFI1B, NBEAL2 break both at once), so conforming is explicitly NOT an assertion that the platelet count is normal.
    (2) The aggregation arm is gated on failure of the aggregation step itself, because every upstream arm reads out through aggregometry. BDPLT18/RASGRP2 is the worked counterexample: aggregation fails, the integrin is normal, PMA-induced aggregation is preserved.
    (3) Deliberately NOT an Xogenesis module - a normal programmed process fails and nothing pathological is formed - so the OGMS/MPATH anchor convention does not apply.
    (4) Positioned as the mechanistic inverse of thrombogenesis. The shared P2Y12 / alphaIIbbeta3 targets are the same machinery read from opposite directions, which is why the antiplatelet drug classes phenocopy these disorders.
    (5) The rFVIIa treatment uses BYPASSES rather than INHIBITS or RESTORES, because the agent repairs no arm - it drives thrombin generation on whatever activated platelet surface remains. Its evidence base is Glanzmann thrombasthenia and conformers do not inherit it.
    (6) GO has no 'platelet adhesion' class, so the adhesion node binds the parent GO:0007155 cell adhesion with a specific preferred_term. Noted in the module as an ontology gap rather than worked around silently.

    Carries one KNOWLEDGE_GAP discussion (whether arm identity predicts bleeding severity once residual function is accounted for), which is why the module supplies no severity expectation to conformers.


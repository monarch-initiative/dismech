  summary: Add gerotherapeutic treatments (metformin, acarbose) with mechanism links
  details: |
    Added the module's first treatments under the geroscience drug-repurposing project (projects/GEROSCIENCE_REPURPOSING.md; Kulkarni et al. 2022, PMID:35343051).

    Metformin links to 'Age-Associated Gut Microbiota Alteration' (MODULATES) and 'Intestinal Barrier Dysfunction and Microbial Translocation' (INHIBITS), evidenced by Ahmadi et al. 2020 (PMID:32129462), which attributes reduced leaky gut and inflammation in aged obese mice specifically to modulation of the microbiota, and names goblet cell mass and mucin production as the cellular mechanism.

    Acarbose links to the same microbiota node (MODULATES) and to 'Age-Related Health Decline and Reduced Survival' (INHIBITS). Smith et al. 2019 (PMID:31195972) supplies both the compositional/SCFA change and the Cox regression showing fecal acetate, butyrate and propionate jointly predict longevity while controlling for acarbose itself; that second item is marked directness INDIRECT because it is a statistical association, not a demonstration that raising SCFAs causes the lifespan extension - the authors state the causal test is still outstanding. Harrison et al. 2019 (PMID:30688027) anchors the ITP lifespan numbers, with the male/female dimorphism (16-17% vs 4-5%) kept in the explanation rather than dropped.


  summary: Add turquoise killifish (Nothobranchius furzeri) animal model with modeled_mechanisms
  details: |
    Added a turquoise killifish young-donor microbiota transfer animal_models entry. RECAPITULATES 'Age-Associated Gut Microbiota Alteration' and RESCUES 'Age-Related Health Decline and Reduced Survival' - the latter is the module's strongest causal claim in any model, since a microbiota-only intervention started in middle age moved both a survival and a behavioral endpoint. Limitations record what the model does NOT cover: the intervening 'Intestinal Barrier Dysfunction and Microbial Translocation' and 'Dysbiosis-Driven Systemic Inflammation' nodes are not measured by this study, and the young-like taxa are teleost gut genera with no human counterpart. Evidence: PMID:28826469, snippets exact-quoted and verified.

  summary: Add anaerobic human intestine-on-a-chip NAM to gut_dysbiosis
  details: |
    Added the module's first experimental_models (non-animal model) entry: the anaerobic human intestine-on-a-chip that cocultures a complex living human gut microbiome against human intestinal epithelium under a controlled transluminal oxygen gradient (PMID:31086325, Jalili-Firoozinezhad et al., Nat Biomed Eng 2019).

    Two modeled_mechanisms links, both MEASURES rather than recapitulation claims:
    - Age-Associated Gut Microbiota Alteration (fidelity LOW): the chip sustains and taxonomically profiles a community of over 200 OTUs from 11 genera with faeces-like Firmicutes/Bacteroidetes ratios, making community composition a measurable variable in human tissue. Fidelity is LOW and the relationship is MEASURES because the inoculum is not age-stratified and no young-versus-aged comparison was made, so the platform does not reproduce the age-associated drift the node asserts.
    - Intestinal Barrier Dysfunction and Microbial Translocation (fidelity MODERATE): barrier function measured in human epithelium with a complex living community on its luminal face; establishing the physiological hypoxia gradient increased barrier function relative to aerobic coculture (readout direction INCREASED, referenced to that oxygenation comparator). Limitations record that translocation itself is not reported in the cached abstract and that MEDLINE indexes the study under Caco-2 Cells.

    The same platform is already curated as a NAM in kb/disorders/Chemotherapy_Induced_Diarrhea.yaml with the same IN_VITRO grading, so check-snippet-grading stays clean.

    Module notes updated to record the model and to state explicitly that its links are assay-capability claims, not evidence for the trigger-to-effector step.


  summary: Add dysbiosis definition and causal-direction knowledge gap
  details: |
    Added a KNOWLEDGE_GAP discussion citing Hooks and O'Malley 2017 (PMID:29018121, PMC5635691), a bibliometric analysis of how the term dysbiosis is defined and used. Its three-way classification of definitions (change, imbalance, specific taxa) and its cause-versus-consequence argument are applied to the module's trigger node, which is written in the broad change sense. Two REFUTE items from PMID:33619379 record that the cohort study cited on the trigger node identifies rising microbiome uniqueness as part of healthy ageing and low uniqueness as the survival risk. The trigger node itself was not edited. Validated with just validate-module-batch (35/35 snippets verified) and the offline snippet, title, entity-ref and retired-prose gates.

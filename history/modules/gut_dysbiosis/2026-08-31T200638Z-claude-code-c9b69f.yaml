  summary: Add gut-permeability panel; gap on which microbiome measure reports aging
  details: |
    Added lipopolysaccharide-binding protein [NCIT:C105867] and soluble CD14 [NCIT:C191971], plus a KNOWLEDGE_GAP. Newly cached: PMID:31830000 SWAN gut permeability across the menopause transition, PMID:32714309 Hainan centenarian metagenomics. Both markers are curated against the barrier and inflammation nodes rather than the microbiota node, because they report host exposure and host response to translocated microbial product rather than composition; LBP can rise with unchanged microbiota if the barrier fails. Curating both LBP and sCD14 separates exposure from response, which can dissociate when innate responsiveness itself changes with age. FABP2 was measured in the same panel but has no NCIT term, so it is recorded in prose rather than as its own entry. The knowledge gap carries a REFUTE evidence item: in a longitudinal centenarian cohort followed to death there was no significant alpha-diversity difference before death while ten individual species changed significantly, refuting the default assumption a curator would otherwise import. NCIT:C68564 Microbiome exists and would validate but was deliberately left unbound, since binding it would assert that the microbiome is the biomarker without saying what is measured.

  summary: 'Create: hEDS x MVP comorbidity (honest negative)'
  details: |
    Curated the hEDS-MVP comorbidity from a large Mayo Clinic EDS Clinic cohort (PMID:38562189, n=568 with echocardiogram data, diagnosed per the 2017 hEDS/HSD criteria), which found MVP prevalence in hEDS of only 3.5%, similar to the cited general-population prevalence of 2.7%, and concluded that cardiac defects in hEDS/HSD overall are similar to the general population. This contrasts with older/smaller specialty-referral cohorts reporting higher MVP rates (noted in the entry's notes field as referral-bias context, not independently re-verified). Recorded honestly as REFUTE for a large comorbidity effect, consistent with the KB's evidence-integrity culture. PMID:38562189 was already committed in references_cache from an unrelated prior PR (Giardiasis), so no new fetch was needed. ICEES KG was checked and confirmed to contain no node for hEDS (MONDO:0007523); documented rather than omitted. Validated with just validate-comorbidity, just check-folded-hyphens, just check-duplicate-keys, just check-entity-refs.

  summary: Create candidate MDD-vitiligo comorbidity association
  details: |
    Created a CANDIDATE bidirectional risk association anchored by a UK primary-care cohort: MDD to vitiligo HR 1.64, and vitiligo to MDD HR 1.31 before age 30 and 1.22 at age 30 or older. Recorded competing acquired p38-alpha/MAPK14, inherited-liability, and psychosocial/surveillance/nonspecific-inflammatory explanations. The entry distinguishes robust pair-level epidemiology from weak mechanistic evidence and does not assert a causal shared pathway.

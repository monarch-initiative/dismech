  summary: 'Create: Chronic Kidney Disease x Dieulafoy Lesion comorbidity'
  details: |
    New comorbidity entry split out of kb/disorders/Dieulafoy_Lesion.yaml's environmental: block (dismech#8302). Source is a within-case comorbidity proportion (16% chronic kidney disease) from a 101-case systematic review of rectal Dieulafoy lesion (PMID:35243119, mean age 66+-17), no comparison population. directionality/effect_direction set UNKNOWN rather than A_BEFORE_B/RISK -- per the dismech#8195 review precedent, an unadjusted within-case proportion does not establish a directed risk signal, and the source proposes no mechanism linking CKD to submucosal-artery caliber persistence or mucosal erosion (uremic platelet dysfunction is a plausible route to bleeding severity, not lesion formation, but is not addressed by this source).

  details: |
    Addressed preprint-scan issue #6301 (genome-wide neuropsychiatric-cancer comorbidity architecture, PPR:PPR1277612) on the flagship AD-cancer inverse-comorbidity entry. Added a 'Shared molecular and inherited-genetic architecture' hypothesis: peer-reviewed transcriptomic meta-analysis (PMID:28667284, Sanchez-Valle 2017) anchors the molecular basis (genes oppositely expressed in AD vs lung cancer; concordant in AD vs glioblastoma = a DIRECT comorbidity; oppositely-regulated mitochondrial metabolism/OXPHOS; immune-system link), and the preprint's genome-scale genetic-correlation finding (cancer-neurological pairs have weakest genetic affinity; inverse comorbidities as competing apoptotic/immune/stress-response demands) is added as an emerging, non-sole-support lead. Captured the preprint's key subtype caveat (opposing familial vs late-onset AD correlations with lung cancer -> inverse signal may be subtype-dependent and aggregate estimates can dilute it). Extended notes to point at the AD-glioblastoma direct exception and subtype-dependence. Per the issue's guidance, the preprint is NOT sole support: every preprint-backed claim is paired with peer-reviewed transcriptomic/epidemiological evidence. Validated: schema (ComorbidityAssociation), term validation, folded-hyphen; all 14 snippets exact substrings.

  summary: 'Create: Psoriasis -> Psoriatic Arthritis comorbidity'
  details: |
    New directed comorbidity entry (A_BEFORE_B, RISK). Three hypotheses: shared IL-23/IL-17 axis acting at the enthesis-synovium interface (PMID:42540001); mechanical stress at entheseal insertions as the local trigger, the 'deep Koebner' phenomenon (PMID:21715249); and MHC evidence that PsA is not simply a later stage of psoriasis, since HLA-C*06:02 is protective against PsA relative to skin-only disease while amino acid 97 of HLA-B - the largest ankylosing spondylitis effect - is what discriminates (PMID:28821532). Two literature association signals: prospective incidence of 2.7 per 100 psoriasis patients per year in an arthritis-free cohort (PMID:26555117), and ~20% progression within 3 years in the arthralgia-enriched at-risk stratum (PMID:42540001), flagged as non-comparable in mapping_notes. Deliberately does not claim that treating psoriasis prevents PsA; interception trials are ongoing. Validated with just validate-comorbidity: schema, terms, and 8/8 snippets verified against cached references.

  summary: 'Create: hEDS x POTS comorbidity'
  details: |
    New comorbidity/trajectory pair: Hypermobile Ehlers-Danlos Syndrome (MONDO:0007523) x Postural Orthostatic Tachycardia Syndrome (MONDO:0011479), both already-curated kb/disorders/ entries. Duplicate preflight: no existing kb/comorbidities file for this pair on origin/main. Attempted an ICEES KG association signal per the dismech-references/ICEES workflow: ran just icees-refresh (bulk snapshot 8-20-2024) then just icees-rebuild --id MONDO:0007523,MONDO:0011479, which found no record for the pair. Confirmed by decompressing data/icees-kg/nodes.jsonl.gz directly (226 total nodes, a small UNC-Health cohort-specific slice e.g. asthma/PCD) -- neither MONDO ID appears in the node set at all, so no ICEES signal exists for this pair in the current snapshot. Recorded this as an association_signals entry with source ICEES and no evidence/statistics, documenting the search in mapping_notes, rather than silently omitting it. Built the entry instead from four literature references, all newly fetched via just fetch-reference: PMID:40387691 (2025 AGA Clinical Practice Update, Best Practice Advice 1 -- establishes the association as clinically recognized while explicitly stating the biological mechanism is 'limited and evolving', used as the mechanistic hypothesis's evidence and epistemic hedge), PMID:29519641 (Roma/Marden/De Wandele 2018 review of 10 studies -- POTS is the most commonly recognized circulatory disorder in EDS/joint hypermobility, quote_role REVIEW_SYNTHESIS), PMID:42229474 (2026 cross-sectional cohort of 37 clinically diagnosed HSD/EDS patients -- quantifies POTS prevalence at 60.9% in the SpA+EDS subgroup and 78.6% in the EDS-only subgroup), and PMID:35506776 (2022 community-based Colombian schoolchildren screening study, n=306 -- found no statistically significant excess co-occurrence of Beighton-score joint hyperlaxity and POTS, p=0.5188; graded REFUTE and explicitly caveated in mapping_notes as a different ascertainment population from clinically diagnosed hEDS, to keep the overall association honestly balanced rather than overclaiming from the smaller clinically-diagnosed cohort). directionality is UNKNOWN across all signals -- no source in the cited literature establishes temporal order. Encountered and fixed one reference-validation failure: the PMID:35506776 cached abstract carries a PubMed-side stray mid-word space ('hyperlaxi ty') that had to be copied verbatim into the snippet for an exact-substring match. Validated: just validate-comorbidity (schema + terms + references, 4/4 snippets verified), uv run pytest tests/test_data.py -k test_comorbidity_file (passed), check-duplicate-keys, check-entity-refs, check-enum-values, check-qualifier-terms, check-snippet-length (all clean).

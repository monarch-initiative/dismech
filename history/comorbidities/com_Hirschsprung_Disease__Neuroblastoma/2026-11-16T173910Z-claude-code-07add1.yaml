  summary: 'Create: Hirschsprung disease and neuroblastoma comorbidity (CANDIDATE)'
  details: |
    First comorbidity record pairing Hirschsprung disease with neuroblastoma. Nothing in
    kb/comorbidities/ previously named either disease, or PHOX2B.

    The record is deliberately small, because the two cited sources support less than the pairing's
    reputation suggests. What they establish is a germline PHOX2B missense variant (R141G, inherited
    from an unaffected mother) in one patient who had both conditions, with Hirschsprung disease
    diagnosed neonatally and multifocal neuroblastoma at nine months; and, separately, that PHOX2B
    variants reach neuroblastoma without Hirschsprung disease and the hypoventilation-plus-Hirschsprung
    phenotype without a tumour, which the source calls allelic conditions. That is a shared locus and
    an individual co-occurrence.

    No association_signals block, and no effect_direction. Three figures in the literature read like
    co-occurrence rates and none is: twenty per cent and five to ten per cent among hypoventilation
    patients, forty-five and ten cases in a 188-proband hypoventilation cohort, and eleven and six
    among thirteen carriers of a missense or frameshift variant. Each pair is two marginal proportions
    inside a congenital central hypoventilation syndrome denominator, joined by "respectively", so
    none gives the frequency of one member given the other. There is no EHR statistic to use instead:
    the committed ICEES set holds 505 pairs and none is keyed on MONDO:0005072 or MONDO:0018309.
    effect_direction would assert a risk relationship between the two diseases, and no cited source
    estimates one in either direction. directionality is UNKNOWN: one child's course is not a
    population ordering.

    Two adversarial passes before the push, split by axis, found six things worth changing and one
    thing that had to change. The item quoting the mother's transmission had been explained as
    showing incomplete penetrance; the paper offers that as the third of three candidate
    explanations, attributing even the suspicion to earlier neuroblastoma pedigrees, and the quote
    did not carry the word healthy at all. The quote is replaced with the sentence that does, and the
    explanation now records that the paper leaves the question open. The hypotheses block said both
    its quotes restated others' work, while grading the second PRIMARY_RESULT - the second is the
    authors' own. A description said one upstream genotype spans the set, where allelic means one
    locus and the other source cited here turns on which allele. The allelic quote was graded DIRECT
    where the same hypoventilation-denominator inference is graded INDIRECT four items earlier. The
    item recording that no tumour sample was available supports no claim in the record and is now
    NO_EVIDENCE. And two unsourced claims are gone: a frequency claim about how many patients carry
    no PHOX2B variant, and a claim about what sources this repository holds, which is replaced by the
    ICEES lookup actually run.

    The PHOX2B story is carried as shared_upstream_hypotheses rather than as a direct edge, with
    PHOX2B-Related_Neuroblastic_Tumor_Susceptibility (MONDO:0700041) as the upstream_disorder. That
    slot takes a disease, and this repository curates the predisposition as its own entry, so the
    locus is available as a concept rather than only as a gene named in prose. The hypotheses block
    quotes the authors stating that the molecular mechanism in neuroblastoma was unresolved between a
    dominant negative effect and haploinsufficiency, so the record names a shared gene and declines to
    name a mechanism. No cited source proposes a shared cell of origin.

    Two scope facts recorded in notes for whoever reviews this. MONDO:0013082 Hirschsprung
    disease-ganglioneuroblastoma syndrome models one such combination as a single disease, and the
    Ganglioneuroblastoma entry places that concept out of its own scope; the combined concept is
    specific to ganglioneuroblastoma while the patient cited here had neuroblastoma, and the larger
    cohort's tumour histology was mixed, so the pairing is not confined to the histology that concept
    names. Whether the broader pairing belongs as a disease rather than a comorbidity is open and is
    the first question to put to a reviewer. Separately, the two joined entries are asymmetric about
    each other: the Neuroblastoma entry names Hirschsprung disease once inside its PHOX2B genetic
    record, and the Hirschsprung disease entry does not mention neuroblastic tumours at all.

    Neither source screens an isolated Hirschsprung cohort for germline PHOX2B variants, so the gene's
    role in Hirschsprung disease without a hypoventilation syndrome or a tumour is not established by
    anything quoted here, and the record does not claim it. The word neurocristopathy appears in
    neither source and is not used.

    Both cache files were already committed. 8 snippets verified, 8 reference titles checked against
    their caches, 0 issues; offline gates green. No disorder entry was touched.

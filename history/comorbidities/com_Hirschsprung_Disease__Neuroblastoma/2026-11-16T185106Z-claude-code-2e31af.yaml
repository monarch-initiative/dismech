  summary: 'Review round 1: commit the mother-transmission fix, and four prose repairs'
  details: |
    Answers the review on PR #18291. The blocking finding was that a fix the previous PR body and history record both described had never been committed: the third literature_evidence item still quoted 'The mutation was inherited from the mother', which does not say the mother was unaffected, under an explanation stating incomplete penetrance as a conclusion. The snippet is now the sentence that does say it - 'The R141G mutation identified in patient 2 is inherited from the healthy mother (fig. 1A and 1C).' - and the explanation records that the paper offers three explanations for the observation, a tumour developing in adulthood, spontaneous regression, and incomplete penetrance, and chooses between none of them. Three suggestions taken in the same push. The shared_upstream_hypotheses description claimed frameshift and missense variants predispose to the tumour where polyalanine expansions do not, which rested on no quote. Two corrections were needed, both found by the pre-push adversarial pass rather than by the review. Saying the source 'states it with that hedge' was false of the paper: one Discussion sentence hedges, while the title says the genotype allows for prediction of tumour risk, the abstract says the analysis strongly supports the contention, and the summary says PHOX2B is a predisposing gene. And 'where polyalanine expansions do not' over-claimed: the same paper reports a differentiated ganglioneuroma in 2 of 161 patients with an in-frame duplication, against invasive neuroblastoma in 6 of 13 with a missense or frameshift variant. The description now gives both figures and says the expansion alleles are not risk-free, the sentence carrying the contrast is cited, and the quantitative sentence is cited beside it. A sentence in notes addressed a reviewer rather than a curator and is removed, leaving the scope question itself. A count of repository state in the ICEES paragraph is replaced by the fact it was there to support. One suggestion is not taken: the review said the twenty per cent Hirschsprung figure is not in either cached reference, but PMID:15657873 states it - Hirschsprung disease and neural crest tumours 'are noted in 20% and 5%-10% of patients with CCHS, respectively' - and the notes already attribute both figures to a hypoventilation cohort, which is the denominator that makes them not co-occurrence rates.

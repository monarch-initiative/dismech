  summary: 'Create: hEDS x CRPS type 1 comorbidity'
  details: |
    Curated the hEDS-CRPS type 1 comorbidity from a 2026 nationwide US claims database study (PMID:42398975) showing an approximately 11-fold higher proportion of recorded CRPS diagnoses among EDS patients versus non-EDS patients (1.05% vs 0.09%), with 76.8% of co-occurring CRPS cases being type 1 (matching this dismech entry's target disorder). The study codes EDS broadly (ICD-10 Q79.6x) rather than hEDS specifically; this is noted in mapping_notes. ICEES KG was checked and confirmed to contain no node for hEDS (MONDO:0007523) in the current snapshot, so no ICEES signal was available; this absence is documented rather than omitted. Validated with just validate-comorbidity, just check-folded-hyphens, just check-duplicate-keys, just check-entity-refs.

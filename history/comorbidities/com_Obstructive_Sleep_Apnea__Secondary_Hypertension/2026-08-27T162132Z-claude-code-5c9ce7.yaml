  summary: 'Create: Obstructive Sleep Apnea -> Secondary Hypertension comorbidity'
  details: |
    New directed comorbidity entry (A_BEFORE_B, RISK). Side B is Secondary_Hypertension rather than Essential_Hypertension because kb/disorders/Secondary_Hypertension.yaml already names obstructive sleep apnea among its causes, so OSA-driven hypertension is secondary by the KB's own definition; the notes record that this boundary is cleaner in the ontology than in the clinic, since population studies of hypertension in OSA do not separate the two. Two hypotheses: chronic intermittent hypoxia sensitizing the carotid body chemoreflex and driving sympathetic overactivity (PMID:42600231, with a null-mouse dissection of the pathway at PMID:39844350 graded MODEL_ORGANISM), and reversal by CPAP as causal corroboration, with the night-weighted blood pressure response matching a nocturnal driver (PMID:25582849). Association signal is the Wisconsin Sleep Cohort dose-response, AOR 2.03 for AHI 5-14.9 and 2.89 for AHI >=15 (PMID:10805822). Obesity recorded as a shared_upstream_hypotheses entry with PARTIAL evidence, since the cohort adjusted for BMI and neck/waist circumference without excluding residual confounding. Validated with just validate-comorbidity: schema, terms, and 8/8 snippets verified against cached references.

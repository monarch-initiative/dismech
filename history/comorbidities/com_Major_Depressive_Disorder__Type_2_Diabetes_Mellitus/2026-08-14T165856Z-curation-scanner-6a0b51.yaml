  summary: 'Create: MDD / Type 2 Diabetes Mellitus comorbidity entry (#6399)'
  details: |
    Created kb/comorbidities/com_Major_Depressive_Disorder__Type_2_Diabetes_Mellitus.yaml as the first bounded deliverable from issue #6399 (psychiatric-insulin resistance multimorbidity, PMID:42435748).

    Scope decision: the trigger paper is a genomic-SEM latent factor over eight conditions (five psychiatric, three insulin-resistance related). Rather than invent a new grouping for a latent statistical factor, this run curated the single best-evidenced pair implied by it - MDD and type 2 diabetes, both positive-loading - as a standard pairwise ComorbidityAssociation, and recorded the factor itself as one COMPUTATIONAL_INFERENCE association signal carrying an explicit mapping_notes caveat that it is not pair-specific evidence.

    Evidence: three references, all fetched with just fetch-reference.
    - PMID:19033418 (Mezuk 2008 meta-analysis): both prospective arms, RR 1.60 (1.37-1.88) depression to diabetes and RR 1.15 (1.02-1.30) diabetes to depression, plus adiposity-adjusted, publication-bias-corrected and long-follow-up sensitivity estimates.
    - PMID:40595333 (Bala 2025 bidirectional Mendelian randomization): OR 1.14 and OR 1.02 on the genetic-liability scale, BMI multivariable attenuation, TG:HDL-C readout, and mechanistically clustered T2D instrument results.
    - PMID:42435748 (Mota 2026, the issue trigger): Psych-IR latent factor loadings, 150 loci / 366 genes, insulin-binding and Notch gene sets, chr16p11.2 / BDNF / lipid enrichment, T-SEM MHC signal.

    Three competing hypotheses are curated rather than one settled mechanism: shared pleiotropic liability; adiposity / obesity-mediated insulin resistance as a mediating path; and behavioral, treatment and ascertainment explanations (health behaviors, antidepressant confounding by indication, and loss of the diabetes-to-depression arm when short-follow-up samples are excluded). Obesity is recorded under shared_upstream_hypotheses - the first use of that slot in kb/comorbidities.

    Curation guardrails applied: the entry notes state explicitly that anorexia nervosa and OCD load NEGATIVELY on the Psych-IR factor and that schizophrenia is excluded from it, so the factor must not be reused to assert positive metabolic comorbidity for those disorders. The issue body summary had flattened this to shared genetics across five psychiatric disorders.

    Validation: just validate-comorbidity passed schema, term and reference validation with 26/26 snippets verified against cached references; just check-title-snippets reported no new title-quoting snippets.

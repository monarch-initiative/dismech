  summary: 'Create: obesity to heart failure comorbidity'
  details: |
    Created from the Obesity row of Heart_Failure.yaml's environmental block (#8296, #8551). A_BEFORE_B / RISK. Carries a Framingham association signal (adjusted HR 2.12 in women, 1.90 in men, PMID:12151467) and an HFpEF-specific hypothesis (PMID:39555826). disease_b is Heart_Failure rather than an HFpEF entry because HFpEF exists only as a has_subtypes entry in this KB; the notes record that the Framingham cohort measured incident heart failure without ejection-fraction stratification while the HFpEF statement comes from a trial population selected for it. The reverse arm is not modeled: heart failure causes cachexia, not obesity.

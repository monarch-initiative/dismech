  summary: 'Create: Chronic Kidney Disease -> Gout comorbidity'
  details: |
    New directed comorbidity entry (A_BEFORE_B, RISK). Forward hypothesis is that impaired renal urate excretion, the dominant hyperuricemic mechanism in gout, makes kidney disease mechanistically upstream of crystal deposition (PMID:23318701), with serum urate acting as the graded driver of incident gout within a CKD cohort (PMID:41608294). The reverse direction is curated explicitly as a refuted hypothesis rather than left implicit: a 13-year population cohort found no difference in incident CKD between urate-lowering therapy users and non-users (PMID:34104091, graded REFUTE), which is why the entry is directed rather than BIDIRECTIONAL. Notes flag two confounders the sources do not separate - diuretic use, reported as an independent predictor of gout within the CKD population, and shared metabolic antecedents. Association signal is 41.9 incident gout cases per 1,000 person-years (140/771, 18.2%) in non-dialysis stage 3-5 CKD with asymptomatic hyperuricemia; mapping_notes record that the rate is conditioned on the hyperuricemic intermediate step. Validated with just validate-comorbidity: schema, terms, and 6/6 snippets verified against cached references.

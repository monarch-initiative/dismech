  summary: 'Create: obesity and PCOS comorbidity'
  details: |
    Created from the Obesity row of Polycystic_Ovary_Syndrome.yaml's environmental block (#8296, #8551). Typed BIDIRECTIONAL rather than A_BEFORE_B, on PMID:40580384, because the literature describes a self-reinforcing cycle and picking a direction would break a loop the sources decline to break. Two qualifiers are kept visible in the notes and carried by a second hypothesis: obesity is neither necessary nor sufficient for the phenotype and the association varies by population (PMID:30445140, PARTIAL), and the amplifying effect tracks visceral adiposity, which is present in lean patients too, so a BMI-defined entry understates it.

  summary: 'Create: hEDS x MDD comorbidity'
  details: |
    New comorbidity pair, part of a batch systematically linking hEDS's documented literature comorbidities. Quantitative anchor is PMID:41432355 (TriNetX propensity-matched cohort, 59,128 pairs): broad 'depression' diagnostic category prevalence 18.7%, OR 1.3 (95% CI 1.2-1.3) in EDS versus matched controls; honestly caveated in mapping_notes as a broader depressive-disorder category rather than MDD-specific. Corroborated by an independent smaller cohort (PMID:37761523, already cited in this session's hEDS x POTS work): a 100-patient adolescent/young-adult chart review reporting a 30% depression diagnosis rate. Hypothesis is chronic-pain/disability-driven mood dysregulation, noting the same neurovisceral-phenotype mechanism proposed for the paired hEDS x GAD entry may also contribute rather than depression being purely reactive to chronic illness. No ICEES signal: hEDS is not a node in the local ICEES KG snapshot at all. Validated: just validate-comorbidity-batch (18/18 snippets across the 5-file batch), pytest test_comorbidity_file, check-duplicate-keys, check-entity-refs, check-enum-values, check-qualifier-terms.

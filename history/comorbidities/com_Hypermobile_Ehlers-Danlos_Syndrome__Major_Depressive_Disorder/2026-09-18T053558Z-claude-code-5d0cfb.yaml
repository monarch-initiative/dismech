  details: |
    Addressed two IMPORTANT findings and several optional suggestions from the automated review round on PR #12111: (1) the MDD entry's 30% depression-diagnosis figure was mislabeled as a full-cohort proportion when the cited snippet's own denominator is the 59% psychiatric-comorbidity subgroup -- corrected both the metric-level notes and the top-level entry notes to state the correct denominator rather than deriving an unverified full-cohort number; (2) the GERD entry's pathophysiology node was bound to GO:0001696 (gastric acid secretion), which contradicts the node's own barrier-failure/dysmotility description -- rebound to GO:0014831 (gastro-intestinal system smooth muscle contraction, already cached) with modifier: DECREASED. Also took three optional suggestions in the same push: reworded the hEDS-POTS entry's second association signal's mapping_notes (which had used REFUTE for curation-balance reasons rather than an evidential one) and added directness: INDIRECT to make the grading self-consistent; rebound the POTS venous-pooling node from GO:0008015 (blood circulation, too generic/system-level) to GO:0042310 (vasoconstriction, modifier: DECREASED); and annotated six TriNetX-cohort-derived p_value: 0.001 metrics (Fibromyalgia, GERD, GAD, IBS, MDD, Migraine) as upper bounds (source reports p < 0.001) rather than point estimates. Left the harmless orphan GO:0060083 cache row and the low-priority table-extraction-artifact snippets as-is per the reviewer's own non-blocking framing. Re-validated with just validate-comorbidity-batch (7 files, 24/24 snippets verified), just check-folded-hyphens, just check-duplicate-keys, just check-entity-refs, just check-enum-values.

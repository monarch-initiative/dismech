  summary: 'Create: MASLD - coronary artery disease comorbidity entry'
  details: |
    New comorbidity entry joining Metabolic_Dysfunction-Associated_Steatotic_Liver_Disease (MONDO:0013209) to Coronary_Artery_Disease (MONDO:0021661), completing the structural step that dismech#6352 left open after PR #8300 added the hepatic sinusoidal endothelial node to the MASLD entry.

    Structure. disease_b is Coronary_Artery_Disease because atherosclerosis is modeled as kb/modules/atherogenesis.yaml rather than as a disease entry, and CAD is its closest disease-level conformer with coronary-specific measurements. A conforms_to edge from the MASLD sinusoidal node to atherogenesis#Endothelial Dysfunction and Subendothelial LDL Retention was rejected: that module node bundles subendothelial LDL retention, which the hepatic sinusoid does not have. A generic endothelial_dysfunction module was also rejected as a maintainer call, since the unifying claim currently rests on narrative reviews.

    Content. Three hypotheses (shared endothelial lesion; hepatic contribution independent of traditional risk factors, resting on the fibrosis-stage severity gradient; and the competing shared-cardiometabolic-antecedent reading recorded with a REFUTE item against its strong form), one shared_upstream_hypotheses entry for Obesity bounded by the adiposity-independence finding, and four association_signals separated by what was measured: two coronary-imaging signals (SAME_TIME prevalence comparisons, CTCA and coronary artery calcification) and two incident-event signals (A_BEFORE_B, one pooled and one sex-stratified). The incident-event signals carry an explicit endpoint-breadth caveat because their composite outcome includes stroke and so is broader than coronary atherosclerosis. The carotid intima-media thickness arm of PMID:34933963 is deliberately not curated here.

    References. PMID:42430855, PMID:34555346, PMID:40566760, PMID:38396359, PMID:34933963, PMID:32321858 - all fetched with just fetch-reference; five cache files are new in this branch.

    Validation. just validate-comorbidity passes: schema, terms, and 14/14 snippets verified against cached references. check-duplicate-keys, check-entity-refs, check-causal-targets, check-qualifier-terms, check-enum-values, check-folded-hyphens, check-snippet-length, check-title-snippets and check-snippet-grading all clean. The comorbidity page renders.

    Note on a schema limit hit while curating: AssociationSignal.demographics.sex is a single-stratum enum, so a sex-stratified signal holding both arms plus the test for the difference between them cannot use it. The split is recorded per metric instead, and the signal notes say why.

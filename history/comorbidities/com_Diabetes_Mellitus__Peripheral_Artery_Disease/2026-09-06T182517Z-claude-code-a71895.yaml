  summary: Retarget diabetes-PAD comorbidity to unstratified Diabetes_Mellitus to
    match its evidence (#8973)
  details: |
    Review round on PR #8973. Retargeted the diabetes-PAD comorbidity from
    Type_2_Diabetes_Mellitus to the unstratified Diabetes_Mellitus.

    The reviewer's point is that in a Comorbidity entry disease_a IS the claim, and
    the entry's sole citation (PMID:23915883) pools "diabetes" across 34 community
    studies with no stratification by type -- so a T2DM-specific disease_a was
    pitched above what its evidence reaches. Of the two remedies offered, adding
    T2DM-specific evidence was not available to this session, so the entry was
    retargeted to the level its evidence supports.

    Changes:
    - kb/comorbidities/com_Type_2_Diabetes_Mellitus__Peripheral_Artery_Disease.yaml
      renamed to com_Diabetes_Mellitus__Peripheral_Artery_Disease.yaml (git mv).
    - disease_a slug Type_2_Diabetes_Mellitus -> Diabetes_Mellitus, term
      MONDO:0005148 -> MONDO:0005015, preferred_term updated to match.
    - notes gained a paragraph recording why the unstratified term was chosen and
      stating that a T2DM-stratified PAD estimate, if one is found later, belongs in
      a separate com_Type_2_Diabetes_Mellitus__Peripheral_Artery_Disease entry
      rather than by narrowing this one.
    - The in-flight history record for the entry was moved to the new slug
      directory and its target.slug/target.path corrected. This is not a rewrite of
      a merged record: the entry has never existed in main under either name, so
      there is no past repository state being restated. superseded_by was not used
      because nothing was superseded.
    - The Peripheral_Artery_Disease disorder history record's details prose was
      updated to name the new filename, so it does not point at a file that will
      never exist.

    Not changed: the underlying evidence, directionality (A_BEFORE_B), effect
    direction (RISK), and the four other migrated comorbidity entries.

    Checks run: just validate-comorbidity on the renamed file (passed; 1/1 snippet
    verified), just validate-history-all (5604 records, no issues), and
    pytest tests/test_data.py -k "comorbid or history or duplicate or unique"
    (2233 passed).

  details: |
    PR-shepherd round on PR #8973, covering all five comorbidity entries in the
    tranche. Recorded under this slug; the sibling entries carry the same round.

    CRITICAL finding (retired supports: PARTIAL): main retired the value in #10003
    while this branch was 1085 commits behind, so the branch validated only against
    its own stale schema copy. Both occurrences are migrated:
    - com_Essential_Hypertension__Peripheral_Artery_Disease -> SUPPORT with
      directness: INDIRECT. The explanation already argued the inference step - the
      quote evidences the association, not the atherogenic mechanism the hypothesis
      names - so INDIRECT is a deliberate reading of what was written rather than an
      invented appraisal, and the prose now names the atherogenesis module for the
      missing step.
    - com_Obesity__Gastroesophageal_Reflux_Disease -> SUPPORT, explanation rewritten
      to the post-#10003 form that main now carries on the source row, with the
      'PARTIAL because' framing dropped and the US-versus-Europe heterogeneity kept
      as a plain statement.

    IMPORTANT finding (missing association_signals): four of the five entries now
    carry one, each built from effect sizes already inside snippets this PR had
    verified, so no new literature work was needed.
    - Diabetes -> PAD: meta-OR 1.88 (1.66-2.14), high-income stratum, from 34
      community studies and 112,027 participants. The LMIC estimate of 1.47
      (1.29-1.68) is recorded in the metric notes rather than pooled, since the two
      strata are not poolable and the slot holds one value.
    - Hypertension -> PAD: HR 1.23 (1.20-1.27) per 10 mm Hg pulse pressure, CALIBER,
      1.25 million patients. The metric notes keep the inverse abdominal-aortic-
      aneurysm association (0.91) from the same analysis, because that contrast is
      what makes the PAD figure endpoint-specific rather than a generic blood-
      pressure effect.
    - Obesity -> OSA: OR 6.0 (2.2-17.0) for moderate-to-severe SDB per 10% weight
      gain, Wisconsin Sleep Cohort, measured prospectively.
    - Obesity -> GERD: OR 2.15 (1.89-2.45) obese and 1.57 (1.36-1.80) overweight, US
      stratum only. The European stratum was heterogeneous and is deliberately not
      carried as a metric; an evidence item quoting that heterogeneity records why.
    Hyperlipidemia -> PAD gets no signal: its cited source states causality from
    Mendelian randomization and trial synthesis without a quotable point estimate,
    and manufacturing one would be worse than leaving the slot empty.

    Suggestions taken: the bracket-stripping note is restored on the diabetes
    snippet, which otherwise reads as though 1.88 were an LMIC smoking figure; and
    the unmodeled reciprocal Obesity/OSA arm is acknowledged in that entry's notes,
    with the point that the quoted weight-loss finding is the same direction
    inverted rather than the reverse arm. Both went where the schema allows -
    ComorbidityHypothesis has no notes slot, so the reciprocal-arm note sits in the
    entry's top-level notes.

    Branch state: merged origin/main (no rebase, no force-push). Both conflicts were
    in kb/disorders/ where #10003 had rewritten the same environmental rows this PR
    deletes; resolved by taking the deletion, as the review advised. That resolution
    does not by itself fix the copies in kb/comorbidities/, which is why the
    migration above was done separately.

    Not taken: PR-body staleness after the Type_2_Diabetes_Mellitus retarget is
    cosmetic and left to the author, and the prose-only module references are
    reasonable to defer under CANDIDATE.

    Validation: just validate-comorbidities clean across 26 files; just validate
    clean on all three touched disorder files; 10/10 snippets verified on the four
    changed comorbidity entries, including the two bracket-truncated quotes;
    check-enum-values, check-duplicate-keys, check-entity-refs,
    check-environmental-evidence, check-snippet-grading, check-title-snippets and
    check-snippet-length all clean whole-KB.

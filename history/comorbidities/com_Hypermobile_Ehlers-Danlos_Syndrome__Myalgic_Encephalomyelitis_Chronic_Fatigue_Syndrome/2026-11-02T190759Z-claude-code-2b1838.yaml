  summary: Remove unsupported vasoconstriction binding from venous laxity node
  details: |
    Addressed the review finding on PR 16317. The node 'Venous wall laxity and orthostatic venous pooling' was bound to GO:0042310 vasoconstriction (DECREASED), but PMID:10518084 proposes passive distension of a connective-tissue-abnormal vein wall rather than reduced smooth-muscle constriction. Removed the biological_processes block and recorded in node notes the OLS GO searches run (vein distension; blood vessel wall compliance; vein), none of which returned a term for passive venous distensibility. Validated with just validate-comorbidity-batch (8/8 snippets, 8/8 titles), check-entity-refs, check-causal-targets, check-duplicate-keys and check-block-scalar-comments.

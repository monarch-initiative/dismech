  summary: 'Create: hEDS x Fibromyalgia comorbidity'
  details: |
    New comorbidity pair, part of a batch systematically linking hEDS's documented literature comorbidities (following the earlier hEDS x POTS entry). Quantitative anchor is PMID:41432355, a large TriNetX propensity-matched cohort (59,128 pairs) giving fibromyalgia prevalence 9.5% and OR 1.7 (95% CI 1.6-1.8) in EDS versus matched controls. Corroborated by PMID:36462303, a systematic review of concomitant diagnosis (68-88.9% overlap in specialty hEDS/HSD clinic populations, explicitly caveated in mapping_notes as reflecting diagnostic-feature overlap and clinic selection rather than being directly comparable to the population-level OR), and PMID:34237584, a meta-analysis finding elevated joint hypermobility across functional somatic syndromes (pooled OR 3.27) including fibromyalgia specifically. Hypothesis is central pain sensitization from chronic joint/connective-tissue nociceptive input. No ICEES signal: hEDS is not a node in the local ICEES KG snapshot at all (established during the POTS entry). Validated: just validate-comorbidity-batch (18/18 snippets across the 5-file batch), pytest test_comorbidity_file, check-duplicate-keys, check-entity-refs, check-enum-values, check-qualifier-terms.

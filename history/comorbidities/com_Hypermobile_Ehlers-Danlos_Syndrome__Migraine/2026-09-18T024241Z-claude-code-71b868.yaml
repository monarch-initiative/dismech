  summary: 'Create: hEDS x Migraine comorbidity'
  details: |
    New comorbidity pair, part of a batch systematically linking hEDS's documented literature comorbidities. Quantitative anchor is PMID:41432355 (TriNetX propensity-matched cohort, 59,128 pairs): migraine prevalence 19.7%, OR 2.5 (95% CI 2.4-2.6) in EDS versus matched controls. Hypothesis-level evidence is PMID:37847487, a dedicated review establishing migraine as bidirectionally comorbid with the broader dysautonomia/POTS/hypermobility-spectrum/MCAS cluster that hEDS sits within, proposing autonomic cranial vascular dysregulation plus mast-cell-mediated neurogenic inflammation as shared contributors rather than migraine being an isolated, mechanistically unrelated comorbidity. No ICEES signal: hEDS is not a node in the local ICEES KG snapshot at all. Validated: just validate-comorbidity-batch (18/18 snippets across the 5-file batch), pytest test_comorbidity_file, check-duplicate-keys, check-entity-refs, check-enum-values, check-qualifier-terms.

  summary: Correct PREVALENCE metric_value from percentage to proportion
  details: |
    Review of PR #8658 found the new association_signals PREVALENCE metric recorded as a percentage, while AssociationMetricTypeEnum.PREVALENCE is defined in the schema as a 'Prevalence proportion' and all 10 pre-existing PREVALENCE values across kb/comorbidities/ are proportions in [0,1]. The metric notes already described the figure as a proportion of the 101-case rectal Dieulafoy lesion series, so the value and its own notes disagreed. Divided the value by 100 so it reads as a proportion. metric_value is an unconstrained float and the enum carries no range constraint, so nothing in the validation stack detects this class of unit error; it was caught by review. No notes, snippet, evidence, or ontology binding was changed. Re-validated with just validate-comorbidity: schema, terms, and references all pass, 1/1 snippet verified against the cached PMID:35243119 record.

  summary: 'Create: hEDS x Endometriosis comorbidity (honest negative)'
  details: |
    Curated the hEDS-Endometriosis comorbidity from a French cohort of 386 clinically diagnosed hEDS women (PMID:27619482). Despite a very high burden of gynecologic symptoms that clinically overlap with endometriosis (menorrhagia 76%, dysmenorrhea 72%, dyspareunia 38-43%), confirmed endometriosis prevalence was only 6%, matching the cited general-population range (3-6%); the study's own authors explicitly warn against over-diagnosis of endometriosis in hEDS patients on the basis of these overlapping symptoms. Recorded honestly as REFUTE for a true comorbidity effect rather than smoothing this into a positive association, consistent with the KB's evidence-integrity culture for negative findings (as previously done for the Arthrochalasia EDS fracture-risk REFUTE item). ICEES KG was checked and confirmed to contain no node for hEDS (MONDO:0007523); documented rather than omitted. Validated with just validate-comorbidity, just check-folded-hyphens, just check-duplicate-keys, just check-entity-refs.

  summary: 'Create: Alzheimer disease - type 2 diabetes comorbidity'
  details: |
    Created the AD-T2D comorbidity entry, a heavily replicated pair that had no representation in kb/comorbidities/ despite five other T2D or AD pairs existing. Backbone is PMID:31430566 (meta-analysis of 144 prospective studies, 1.25- to 1.91-fold excess risk of cognitive disorders) plus PMID:35453527 for the AD-specific pooled hazard ratios across 4,229,828 patients. Two scoping decisions are recorded in notes: all-cause dementia and Alzheimer disease are not interchangeable outcomes here (vascular dementia is both common and mechanistically closer to diabetes, so an all-cause figure overstates the AD-specific effect), and the risk is graded rather than threshold since prediabetes already carries excess risk. Directionality curated as B_BEFORE_A, the arm the prospective literature actually measures; the reverse arm is explicitly NOT claimed. Added one hypothesis on shared accelerated cellular aging from Ding et al. (PMID:42297981), whose load-bearing citation is the stratified analysis showing AD patients carry accelerated pancreatic endocrine cell aging in the ABSENCE of type 2 diabetes with T2D compounding it - the stratification is what separates a shared-aging signal from confounding by comorbid diabetes. The hypothesis states three limits explicitly: cross-sectional in the AD arm so it cannot order the conditions, probabilistic protein-to-cell-type mapping so the islet attribution is a plasma signature not a measured islet state, and a shared aging signature being equally consistent with common upstream drivers, reverse causation, or residual confounding. Validation: linkml-validate against ComorbidityAssociation clean; term validation passed; reference validation --no-full-text exit 0 with 8/8 snippets verified.
    Part of the cell-type plasma proteomic aging clock tranche prompted by the
    Cell Reports Medicine Spotlight (PMID:42612620); primary source throughout is
    Ding et al. (PMID:42297981). Companion records: Alzheimer_Disease,
    Amyotrophic_Lateral_Sclerosis, Lung_Carcinoma, Type_2_Diabetes_Mellitus,
    Frontotemporal_Dementia, and the cellular_senescence module.

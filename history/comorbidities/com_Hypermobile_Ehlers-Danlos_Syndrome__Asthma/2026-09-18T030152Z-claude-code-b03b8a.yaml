  summary: 'Create: hEDS x Asthma comorbidity'
  details: |
    Curated the hEDS-Asthma comorbidity from a 2021 review of EDS/HSD respiratory manifestations (PMID:34291699), which reports asthma prevalence of 23% in a cohort of mainly classical EDS patients (n=43) and 37% in joint hypermobility syndrome patients (n=51), versus 14% in controls, plus a proposed shared-polygenic-risk mechanism between asthma and EDS/hypermobility. The cited primary cohort is mainly classical EDS rather than hEDS specifically; this is noted in mapping_notes, and the entry is recorded against hEDS as the numerically dominant EDS/hypermobility-spectrum phenotype. ICEES KG was checked: although the snapshot does include asthma-cohort concepts, hEDS (MONDO:0007523) is not a node in it at all, so no hEDS-asthma pair signal could be built despite asthma itself being represented; documented rather than omitted. Validated with just validate-comorbidity, just check-folded-hyphens, just check-duplicate-keys, just check-entity-refs.

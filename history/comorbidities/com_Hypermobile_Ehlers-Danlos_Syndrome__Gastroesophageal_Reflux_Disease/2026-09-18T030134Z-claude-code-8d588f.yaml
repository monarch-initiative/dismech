  summary: 'Create: hEDS x GERD comorbidity'
  details: |
    Curated the hEDS-GERD comorbidity using the same TriNetX propensity-matched EDS cohort (PMID:41432355, 59,128 matched pairs) already cited for the hEDS-Fibromyalgia/IBS/Migraine/MDD entries, which found GERD as the single most common GI comorbidity in EDS (18.4% prevalence, OR 1.5, 95% CI 1.4-1.5). ICEES KG was checked and confirmed to contain no node for hEDS (MONDO:0007523) in the current snapshot, so no ICEES signal was available; documented rather than omitted. Validated with just validate-comorbidity, just check-folded-hyphens, just check-duplicate-keys, just check-entity-refs.

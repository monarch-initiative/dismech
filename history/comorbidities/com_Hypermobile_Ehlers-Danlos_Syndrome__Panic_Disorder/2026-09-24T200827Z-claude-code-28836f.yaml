  summary: 'Address review round 1: directness calibration, pathophysiology node split'
  details: |
    Addressed the ai4c-reviewer changes-requested review on PR 12715. Blocking: (1) corrected directness on the hypotheses[0] PMID:8464956 evidence item from DIRECT to INDIRECT -- the quote states a diagnosis-level association, not the interoceptive-mechanism claim the hypothesis makes; (2) split the single bundled pathophysiology node into two atomic nodes joined by downstream (Heightened Amygdala and Insular Threat Reactivity -> Lowered Panic-Attack Threshold via Interoceptive Misappraisal), moved GO:0042596 fear response onto the second node, and replaced the unsupported 'altered baroreflex/autonomic function' claim with two verified full-text quotes from PMID:25713509 (amygdala/insula as the proposed neural substrate, and a separately-flagged speculative autonomic-afferent-feedback mechanism, graded INDIRECT since the source itself calls it speculative). Suggestions taken: corrected directness on the PMID:9812121 'over 16 times more likely' item from INDIRECT to DIRECT (the quote does directly assert the association; the original INDIRECT reflected the metric's imprecision, not an inferential gap, which is a different axis); removed the false-precision p_value: 0.0001 from the Bulbena 2011 cohort's RR metric, keeping the P<.0001 upper-bound language in notes only; changed metric_type from PREVALENCE to OTHER for the two cumulative-incidence values (41.4%/1.9%) in that same cohort, since cumulative incidence over a follow-up period is not point prevalence; removed 'combined' from the Bulbena 1993 AOR note, which overstated what the abstract says. Re-validated with just validate-comorbidity (clean, 12/12 snippets and titles).

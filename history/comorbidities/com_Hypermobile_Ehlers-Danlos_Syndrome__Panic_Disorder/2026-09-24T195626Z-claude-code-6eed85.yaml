  summary: 'Create: hEDS x Panic Disorder comorbidity'
  details: |
    Curated the hEDS x Panic Disorder comorbidity entry, flagged as a follow-up during the hEDS x GAD entry's own review (that entry's literature review names panic disorder/agoraphobia, not GAD, as the specific anxiety association). Found a three-decade case-control and cohort literature, largely from one Barcelona research group (Bulbena, Martin-Santos et al.), specific to panic disorder/agoraphobia rather than anxiety disorders in general: Bulbena 1993 (PMID:8464956, age/sex-adjusted OR 10.7, explicitly not associated with GAD/dysthymia/MDD), Martin-Santos 1998 (PMID:9812121, 67.7% vs 10.1%/12.5% prevalence), Garcia Campayo 2010 (PMID:20118441, replication against three control groups), Bulbena 2011 15-year prospective cohort (PMID:21762833, RR 22.3 [4.6-108.7] for incident panic/agoraphobia after baseline JHS), and the Sanches 2012 systematic review (PMID:22729449). The 2011 cohort is a genuine prospective baseline-to-follow-up design, so directionality is recorded as A_BEFORE_B at the entry level rather than UNKNOWN, unlike most other hEDS comorbidity entries in this KB where only cross-sectional evidence exists. Pathophysiology hypothesis reuses the neurovisceral-phenotype/interoceptive framework already cited in the hEDS-GAD entry (PMID:20963520, PMID:25713509), narrowed to the panic-specific interoceptive-threat-misappraisal mechanism; bound to GO:0042596 (fear response) after confirming via runoak that GO has no more specific interoception term. ICEES KG checked and confirmed to still lack hEDS as a node (same finding as prior hEDS comorbidity entries this session). All studies predate the 2017 hEDS diagnostic criteria and use Beighton-criteria joint hypermobility syndrome (JHS); this is noted in the entry's notes as the closest available literature rather than treated as an exact terminology match. Validated with just validate-comorbidity, check-folded-hyphens, check-duplicate-keys, check-entity-refs, and check-enum-values, all clean on first pass.

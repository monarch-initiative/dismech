  summary: 'Create: hEDS x MCAS comorbidity (honest negative -- systematic review
    found no evidence)'
  details: |
    Curated the hEDS-MCAS comorbidity from a 2025 systematic review (PMID:40185471) that searched MEDLINE, EMBASE, Scopus, and Web of Science for studies diagnosing any mast cell activation disorder or hereditary alpha-tryptasemia alongside a formal POTS and/or EDS diagnosis under prespecified criteria, and found none (0 of 92 full texts reviewed met the bar) -- despite the popular hEDS-POTS-MCAS 'trifecta' narrative in patient communities. The review notes one 2020 letter (Vadas/McGillis et al., PMID:32798618) that came closer than any other study to meeting criteria but is not itself a confirming study; that letter has no PubMed abstract and was not independently quotable, so only the systematic review's own characterization of it is cited. Also cites the 2026 Canadian MCAS practical-approach review (PMID:41272881), which explicitly lists hEDS among conditions judged NOT clinically suggestive of MCAS per current ECNM-AIM consensus guidance. Recorded honestly as a REFUTE-leaning entry consistent with the KB's evidence-integrity culture for negative/uncertain comorbidity findings, following the same pattern used for the hEDS-Endometriosis and hEDS-MVP entries. ICEES KG was checked and confirmed to contain no node for hEDS (MONDO:0007523); documented rather than omitted. This entry depends on and follows the newly-created general Mast Cell Activation Syndrome disease entry (kb/disorders/Mast_Cell_Activation_Syndrome.yaml) on the same branch/PR. Validated with just validate-comorbidity (4/4 snippets verified), just check-folded-hyphens, just check-duplicate-keys, just check-entity-refs, just check-enum-values.

  summary: 'Create: hEDS x IBS comorbidity'
  details: |
    New comorbidity pair, part of a batch systematically linking hEDS's documented literature comorbidities. Quantitative anchor is PMID:41432355 (TriNetX propensity-matched cohort, 59,128 pairs): IBS prevalence 7.3%, OR 2.6 (95% CI 2.5-2.8) in EDS versus matched controls. Corroborated by PMID:27683076, a cross-sectional screening of 1,998 university students (a non-patient, non-clinic population) finding elevated GI symptoms (41.9% vs 27.3%) in EDS-hypermobility-type students, with the association statistically dependent on autonomic symptom burden but independent of pain and psychopathology -- used as the hypothesis-level evidence for an autonomic/motility mechanism over a purely psychosomatic one. Note this second source measures broader GI symptoms (postprandial fullness, early satiety) rather than a formal IBS diagnosis; recorded honestly as such rather than conflated with the cohort study's IBS-specific figure. No ICEES signal: hEDS is not a node in the local ICEES KG snapshot at all. Validated: just validate-comorbidity-batch (18/18 snippets across the 5-file batch), pytest test_comorbidity_file, check-duplicate-keys, check-entity-refs, check-enum-values, check-qualifier-terms.

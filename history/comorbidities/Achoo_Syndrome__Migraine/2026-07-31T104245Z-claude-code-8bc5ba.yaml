  summary: 'Create: com_Achoo_Syndrome__Migraine comorbidity'
  details: |
    Structured the migraine association previously recorded only as free-text notes in Achoo_Syndrome.yaml (issue #7263) into a proper ComorbidityAssociation entry. Cited PMID:31287245 (Sasayama et al. 2019, Japanese web-based cohort, n=11,840): OR=1.97 for migraine (95% CI 1.57-2.48, P=2.18e-9), verified against the cached abstract before curation per the issue's own verification instruction. Directionality UNKNOWN (cross-sectional self-report), effect_direction RISK. Added a ComorbidityHypothesis node for the shared trigeminal-nerve-hypersensitivity mechanism proposed by the authors. The same study's psychological-distress finding (K6>=5 OR=1.40; K6>=13 OR=1.49) is recorded in this entry's notes rather than as a second MONDO-anchored comorbidity, since psychological distress (a K6 symptom-scale construct) is not a discrete disease entity -- a deliberate scoping choice, not an oversight.

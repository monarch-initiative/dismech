  summary: 'Create: ADHD-obesity comorbidity'
  details: |
    Created the ADHD-obesity pairwise comorbidity entry, follow-up item 1 from issue #6399 (the Psych-IR genomic-SEM study). Evidence: two independent meta-analyses (PMID:26315982, PMID:26780581) for the age-dependent observational association and its medication moderation; bidirectional two-sample MR (PMID:31000774) supporting BMI-to-ADHD but not ADHD-to-BMI; ADHD GWAS genetic correlations with BMI, WHR and childhood obesity (PMID:30478444); the Psych-IR factor loading (PMID:42435748); and a mechanisms review (PMID:29772309). Entry-level directionality left UNKNOWN; the MR signal is recorded as B_BEFORE_A. Four hypotheses: shared genetic liability, behavioural ADHD-to-weight-gain routes (with the MR null recorded as REFUTE), adiposity-to-ADHD, and treatment/comorbidity moderation. Validated with just validate-comorbidity (25/25 snippets verified) and the whole-repo snippet/key/enum gates. One snippet containing bracketed CIs was replaced because brackets are stripped as editorial text.

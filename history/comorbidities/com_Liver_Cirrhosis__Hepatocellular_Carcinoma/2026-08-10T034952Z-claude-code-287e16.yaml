  summary: Retarget cirrhosis-HCC comorbidity from Metastatic_HCC to Hepatocellular_Carcinoma
    (#8195 review)
  details: |
    Response to the blocking review item on PR #8195.

    Retargeted side B from Metastatic_HCC to Hepatocellular_Carcinoma and renamed the entry (and this history directory) accordingly. Neither cited source addresses metastatic HCC: the PMID:41567639 snippet is a general statement about the chronic-liver-disease background of HCC, and the 40-patient Tunisian cohort behind the original quantitative snippet is an early/intermediate-stage series (42.5 percent of tumours under 2 cm), not a metastatic cohort. disease_b.term was already MONDO:0007256 hepatocellular carcinoma, identical to the term on kb/disorders/Hepatocellular_Carcinoma.yaml, so the entry was already indistinguishable from the correct pair at the ontology layer.

    Replaced association_signals[0]. The previous signal recorded metric_type PREVALENCE, value 90.0 - the proportion of cirrhosis among HCC cases in a 40-patient single-centre series. That is a within-case descriptive proportion with no comparison group and cannot support the directed A_BEFORE_B / RISK claim the signal carried. Swapped in PMID:28028370, a 10-year retrospective cohort of 453 cirrhosis outpatients under six-monthly surveillance, recorded as INCIDENCE_RATE 2.6 (Kaplan-Meier 1-year cumulative incidence of HCC, percent; 15.4 percent at 5 years, 28.8 percent at 10 years, 75/453 overall). The denominator is now the cirrhosis population followed forward, which is what a directed risk signal requires. This also retires the previous full-text-only snippet in favour of an abstract quote.

    Evidence: PMID:28028370 fetched with just fetch-reference; snippet verified verbatim against the cached abstract.

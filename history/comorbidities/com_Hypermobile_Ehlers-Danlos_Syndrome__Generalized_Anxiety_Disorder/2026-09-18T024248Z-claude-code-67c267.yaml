  summary: 'Create: hEDS x GAD comorbidity'
  details: |
    New comorbidity pair, part of a batch systematically linking hEDS's documented literature comorbidities. Quantitative anchor is PMID:41432355 (TriNetX propensity-matched cohort, 59,128 pairs): broad 'anxiety' diagnostic category prevalence 26.1%, OR 1.8 (95% CI 1.7-1.8) in EDS versus matched controls; honestly caveated in mapping_notes as a broader anxiety-disorder category rather than a GAD-specific figure, since dismech's GAD entry is the closest existing disorder to map it against. Hypothesis-level evidence is PMID:25713509 (the 'neurovisceral phenotype' model -- functional neuroimaging showing heightened amygdala/insular reactivity to negative emotional stimuli in hypermobile individuals) and PMID:20963520 (a dedicated review finding the single strongest joint-hypermobility psychiatric association is specifically with panic disorder/agoraphobia, not GAD, also disclosed honestly in mapping_notes). No ICEES signal: hEDS is not a node in the local ICEES KG snapshot at all (ICEES does carry a general 'anxiety' node, MONDO:0011918, but that is moot without hEDS itself present). Validated: just validate-comorbidity-batch (18/18 snippets across the 5-file batch), pytest test_comorbidity_file, check-duplicate-keys, check-entity-refs, check-enum-values, check-qualifier-terms.

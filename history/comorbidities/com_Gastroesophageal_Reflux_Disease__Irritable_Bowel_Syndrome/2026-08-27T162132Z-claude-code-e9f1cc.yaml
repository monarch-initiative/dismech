  summary: 'Create: GERD -> Irritable Bowel Syndrome comorbidity'
  details: |
    New directed comorbidity entry (A_BEFORE_B, RISK), curated from the candidate directional edge K21 -> K58 in projects/COMORBIDITIES.md. The Disease Trajectories edge is recorded as an association signal for provenance only, with mapping_notes stating it carries no independent evidential weight and that per-term GO identifiers are omitted because the underlying export is not committed to this repository. Directionality rests on a two-sample Mendelian randomization study: GERD liability raises IBS risk (OR 1.375) with a null reverse arm (PMID:38601073); mapping_notes flag that the reverse arm has 6 instruments against 74, so its null is weaker evidence than the forward estimate. Two indirect mechanisms: a shared trait of amplified visceral pain processing, supported by somatization and pain frequency discriminating the overlap group in a community survey (PMID:17635380), and an iatrogenic route through acid suppression raising SIBO risk (PMID:23270866, graded PARTIAL because the outcome measured is SIBO rather than IBS and the effect held only for aspirate culture). The entry states explicitly that no direct oesophagus-to-bowel mechanism is claimed. The Olmsted County cross-sectional signal carries directionality SAME_TIME even though the entry is A_BEFORE_B. Validated with just validate-comorbidity: schema, terms, and 7/7 snippets verified against cached references.

notes: >-
  Three providers compared: falcon (Edison, focused Kniest pathophysiology report),
  asta (retrieval-only corpus search - mostly off-target papers, but surfaces the
  Weis 1998 Kniest exon-24 paper and general COL2A1/ER-stress context), and
  perplexity (sonar-deep-research, comprehensive on-target report). All three concur
  on the COL2A1 dominant-negative type II collagenopathy mechanism and the recurrent
  in-frame exon-skipping variant class. Divergence is largely coverage/emphasis:
  Asta is silent on Kniest-specific phenotype, epidemiology, and treatment (findings
  6-9), and Falcon lacks a prevalence figure. Two substantive tensions were flagged
  rather than smoothed over: (1) ER-stress/UPR - Falcon foregrounds recent iPSC
  evidence that some ER storage defects do NOT trigger canonical UPR, whereas
  Perplexity foregrounds an active ER-stress-UPR-apoptosis cascade (both are
  compatible under mutation/dose dependence, so harmonized as CONCORDANT); and (2) a
  genuine CONTRADICTORY on the dwarfism subtype - Falcon (and classical teaching)
  "short-trunk" vs Perplexity "short-limbed." best_matching_text values are verbatim
  excerpts from the report files; literature evidence: blocks were intentionally left
  unpopulated pending fetch-reference verification of the underlying PMIDs/DOIs.

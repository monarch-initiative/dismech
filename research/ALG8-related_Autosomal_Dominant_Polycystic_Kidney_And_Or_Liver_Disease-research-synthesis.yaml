    best_matching_text: adding the third glucose to the dolichol-linked precursor
    explanation: >-
      The report's causal chain has ALG8 adding the third glucose and names the
      fully glucosylated Glc3Man9GlcNAc2-PP-dolichol as the product. That is the
      next reaction, catalysed by ALG10. The EC number it gives is right. The
      second-glucose step is stated by the primary source ("add the second of 3

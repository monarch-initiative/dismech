narrative:
  overview: >-
    One provider report was available. It is on topic, well cited, and largely
    agrees with the primary literature on ALG8 heterozygotes. It is weaker on
    structured identifiers and on enzyme biochemistry than on clinical
    synthesis.
  agreement: >-
    Gene discovery in isolated polycystic liver disease, the polycystin-1
    maturation mechanism, the mild kidney course without kidney failure in
    population cohorts, nephrolithiasis risk, incomplete penetrance, and the
    separation from biallelic ALG8-CDG all match the sources the entry cites.
  divergence: >-
    Five defects. ALG8 is assigned the third-glucose (ALG10) reaction instead of
    the second. The gene is given ALG2's HGNC identifier. Hepatic cysts are
    bound to Hepatic failure. Intrahepatic bile duct is bound to common bile
    duct. And the disease is framed as liver-predominant, which the report's own
    genotype-first quote does not support. None of these were caught by the
    report's automated validation: the HGNC prefix is skipped and the term
    check did not compare labels.
  integration: >-
    Integrated content was re-anchored to primary sources: PMID:28375157,
    PMID:39899384, PMID:36574950, PMID:37628703, PMID:21685914, PMID:42804492,
    the ClinGen and Orphanet rows, and PMID:23665274 for somatostatin analogues
    (the one lead taken from the report).
  not_integrated: >-
    Somatostatin response modifiers (young women, alkaline phosphatase) are a
    lead. The all-ADPLD prevalence, ClinVar counts, gnomAD constraint numbers
    and ADPKD biliary-tract risk were not curated.
notes: >-
  Quote verification method: each of the report's 11 "> *quote* [PMID]" blocks
  was checked against the cached text of the attributed paper after
  lowercasing, replacing non-word characters with spaces and collapsing
  whitespace, the same normalization the reference validator applies. All 11
  matched. The references_cache files fetched only for this check are not
  committed, because nothing in kb/ cites them.

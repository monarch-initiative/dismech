notes: >-
  Cross-provider synthesis of three deep-research reports on Hypochondrogenesis
  (COL2A1 type II collagenopathy). Falcon (Edison) and Perplexity (sonar-deep-research)
  are both full pathophysiology narratives and agree closely on the core mechanism
  (dominant-negative glycine substitution -> procollagen II misfolding/ER retention ->
  three-branch UPR -> chondrocyte apoptosis -> ECM/growth-plate failure ->
  perinatal-lethal skeletal dysplasia). Perplexity adds the most quantitative and
  mechanistic depth (>70%/20-30% mutation split, the Gly1170Ser knock-in mouse,
  hydrops fetalis, endochondral ossification detail). Asta is retrieval-only and mostly
  returned off-target papers; its usable support comes from two retrieved reviews
  (Nenna 2019 COL2A1/SEDC and Briggs 2015 GSD mechanisms), so it is SILENT on the
  ER-stress/UPR, apoptosis, fibrillogenesis, and treatment findings. No direct
  contradictions were found across the three reports; divergence is depth/coverage
  (Asta thinnest, Perplexity deepest) plus Falcon's caveat that canonical UPR activation
  varies by COL2A1 allele. best_matching_text values are verbatim excerpts from the
  cited report files; literature evidence: blocks were intentionally left out pending
  fetch-reference verification.

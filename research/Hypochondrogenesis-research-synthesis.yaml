narrative:
  overview: >-
    All three providers frame Hypochondrogenesis as the severe, usually
    perinatal-lethal end of the COL2A1 type II collagenopathy spectrum, driven by
    heterozygous mutations in COL2A1 (the alpha-1 chain of the principal cartilage
    collagen). Falcon (Edison) and Perplexity (sonar-deep-research) are full
    pathophysiology narratives that build the same molecular-to-clinical cascade:
    dominant-negative glycine substitutions produce misfolded procollagen II that is
    retained in the ER, triggers the unfolded protein response, drives chondrocyte
    apoptosis, and leaves a deficient/disorganized cartilage matrix that collapses
    endochondral ossification and yields a lethal skeletal dysplasia. Asta is a
    retrieval-only provider whose value here is narrow: most of its 20 returned papers
    are off-target (osteoarthritis, cancer, cardiomyopathy), and only two retrieved
    reviews (Nenna 2019 on COL2A1/SEDC and Briggs 2015 on skeletal-dysplasia mechanisms)
    speak to the disease.
  agreement: >-
    Convergence is strong on the disease backbone. Falcon and Perplexity agree, and
    Asta partially corroborates, that COL2A1 is the causal gene, that the most severe
    phenotypes arise from dominant-negative glycine substitutions in the triple-helical
    Gly-X-Y repeat while haploinsufficiency gives milder disease, that the chondrocyte
    is the primary affected cell whose stress response (not just the collagen defect)
    drives progression, that perinatal death is caused by pulmonary hypoplasia
    secondary to a narrow, thoracically constrained chest, and that hypochondrogenesis
    and achondrogenesis type II are a continuous severity spectrum rather than distinct
    entities. Falcon and Perplexity further agree unanimously on ER retention with
    three-branch (PERK/IRE1/ATF6) UPR activation, ER-stress-driven chondrocyte
    apoptosis, abnormal collagen fibrillogenesis, and 4-PBA chemical-chaperone rescue.
  divergence: >-
    Divergence is one of depth and coverage rather than conflict; no direct
    contradictions were found. Perplexity is the deepest, contributing quantitative and
    mechanistic detail the others lack: the >70% dominant-negative vs 20-30%
    haploinsufficiency split, the col2a1 p.Gly1170Ser knock-in mouse showing
    pre-hypertrophic apoptosis, and extended coverage of endochondral ossification and
    hydrops fetalis. Falcon's unique contribution is the therapeutic/model angle -
    chemical chaperones (TMAO, 4-PBA) and the ISR inhibitor ISRIB, the 2023 iPSC
    hypochondrogenesis chondronoid model (COL2A1 p.G1113C) - plus the important caveat
    that canonical UPR activation varies by COL2A1 allele and zygosity. Asta contributes
    no synthesis of its own; its only on-target support is the Nenna and Briggs snippets,
    leaving it SILENT on the ER-stress/UPR, apoptosis, fibrillogenesis, and treatment
    findings.
  integration: >-
    The eight core-mechanism findings are supported by at least two independent
    providers (Falcon and Perplexity) and are suitable for promotion into the disorder
    YAML: COL2A1 causation and spectrum placement; the dominant-negative-vs-
    haploinsufficiency genotype-severity model; ER retention and three-branch UPR;
    ER-stress-driven premature chondrocyte apoptosis with growth-plate disruption;
    abnormal fibrillogenesis and ECM deficiency; pulmonary-hypoplasia-driven perinatal
    lethality; the chondrocyte as the responsive primary cell; and the
    hypochondrogenesis-achondrogenesis type II continuum. Underlying PMIDs/DOIs must be
    fetched and snippet-verified before promotion.
  not_integrated: >-
    The 4-PBA chemical-chaperone finding is retained as a research lead rather than
    promoted: it is an emerging, mostly in-vitro/model-derived rescue (iChon/iPSC and
    ER-stress chondrodysplasia systems) with no disease-modifying use in
    hypochondrogenesis, and Falcon explicitly flags variable in vivo efficacy. It should
    be tracked as a mechanistic-therapeutic hypothesis, not curated as an established
    treatment.


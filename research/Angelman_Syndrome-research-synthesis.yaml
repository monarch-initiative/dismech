- statement: >-
    Angelman syndrome is caused by loss of functional maternal UBE3A in neurons;
    the intact paternal UBE3A allele is epigenetically silenced in neurons by the
    UBE3A antisense transcript (UBE3A-ATS), so neurons depend on the maternal copy.
  sections: [pathophysiology, genetic_factor]
  curation_status: INTEGRATED

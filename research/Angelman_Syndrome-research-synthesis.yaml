narrative:
  overview: >-
    Both providers frame Angelman syndrome as a neuron-specific imprinting disorder:
    loss of functional maternal UBE3A, whose paternal allele is silenced in neurons by
    the UBE3A-ATS antisense transcript. They converge on the molecular subtype spectrum,
    the deletion-worst severity gradient, epilepsy as the dominant clinical problem, and
    paternal-UBE3A unsilencing (especially ASOs) as the transformative therapeutic
    strategy. Falcon is oriented toward mechanism, EEG biomarkers, and the 2023-2024
    unsilencing pipeline; OpenScientist is broader and more clinically comprehensive.
  agreement: >-
    Strong agreement on the core biology (maternal UBE3A loss with paternal UBE3A-ATS
    silencing), UBE3A as an E3 ubiquitin ligase acting through the ubiquitin-proteasome
    system, the molecular-class frequencies (deletion ~70%, UPD, imprinting defects,
    intragenic UBE3A mutations), epilepsy in ~80-90% with genotype-dependent onset and
    prevalence, rarity (~1 in 12,000-20,000), and ASO-mediated paternal-UBE3A
    reactivation as the leading disease-modifying approach.
  divergence: >-
    Divergence is mostly coverage and depth, not conflict. OpenScientist develops the
    mitochondrial-dysfunction/oxidative-stress mechanism and its antioxidant-rescue
    leads, the full across-all-domains severity gradient, detailed antiseizure
    pharmacology, natural history, and differential diagnosis. Falcon foregrounds the
    quantitative-EEG delta-power biomarker as a longitudinal trial-monitoring tool and
    the newest unsilencing modalities (small-molecule unsilencers, Cas13). Numeric
    spreads (UPD ~5% vs 3-7%; prevalence 1 in 12,000-20,000 vs 1 in 10,000-24,000) are
    overlapping rather than contradictory, so no finding is marked CONTRADICTORY.
  integration: >-
    Integrate the imprinting causal mechanism, UBE3A E3-ligase/UPS gene function, the
    molecular-class frequency spectrum, the deletion-worst genotype-phenotype gradient,
    the epilepsy phenotype with genotype-dependent onset, the ASO/paternal-UBE3A
    unsilencing treatment concept, and the rare-prevalence epidemiology into the
    disorder YAML as curated content.
  not_integrated: >-
    The mitochondrial-dysfunction/oxidative-stress druggable pathway and the
    quantitative-EEG delta-power biomarker are retained as research leads: both are
    largely model- or trial-derived and warrant primary-literature verification before
    promotion to curated disease mechanisms.


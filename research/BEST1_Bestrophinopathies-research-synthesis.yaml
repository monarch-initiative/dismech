narrative:
  overview: >-
    Both providers frame BEST1 bestrophinopathies as a spectrum of inherited retinal
    dystrophies caused by variants in BEST1, encoding bestrophin-1, a pentameric
    calcium-activated chloride channel of the RPE basolateral membrane. The core
    pathophysiology in both reports is RPE ion/fluid-homeostasis failure producing
    vitelliform lesions, subretinal fluid, abnormal EOG, and progressive macular
    degeneration, with dominant-negative dominant forms and loss-of-function recessive
    forms, no approved therapy, and gene therapy as the emerging intervention.
  agreement: >-
    The two reports converge strongly on the molecular defect (bestrophin-1 pentameric
    Ca2+-activated Cl- channel in RPE), the phenotypic spectrum (BVMD, ARB, ADVIRC,
    BEST1-RP, adult-onset vitelliform) as a single disease continuum, the
    dominant-negative-versus-loss-of-function mechanistic split, the RPE downstream
    causal chain (impaired fluid transport and POS phagocytosis, lipofuscin/vitelliform
    accumulation, photoreceptor degeneration), the EOG as the hallmark diagnostic, the
    ARB anterior-segment/angle-closure phenotype, the deep-intronic/founder ARB
    variants resolved by WGS (c.867+97G>A Chinese founder), and the absence of approved
    therapy with gene therapy (AAV augmentation, CRISPR editing, NCT07185256 OPGx-BEST1)
    as the leading advance.
  divergence: >-
    The reports diverge mostly by depth and unique detail rather than by conflict.
    OpenScientist is more comprehensive and quantitative: it enumerates exactly five
    OMIM-coded phenotypes, gives the largest BVMD natural-history metrics (n=222; ~0.013
    logMAR/year), ClinVar variant counts (1,047 total, 693 P/LP), the BEST1-CaV1.3 axis,
    EMT/NF-kB iPSC-RPE signatures, and — uniquely — the Hsp70/CHIP ubiquitination-at-Lys149
    degradation mechanism for p.P233L/p.P346H. Falcon uniquely covers the Owji et al. (2024)
    ligand-bound bestrophin structures and PABA small-molecule channel-activation strategy
    that rescues dominant LOF mutants. Falcon also frames adult-onset vitelliform cases as
    reclassified into BVMD rather than a separate phenotype. No direct contradictions were
    found; differences are coverage and recency.
  integration: >-
    The shared core biology, phenotypic spectrum, dominant-negative/LOF mechanism, RPE
    causal chain, EOG diagnostic hallmark, ARB anterior-segment phenotype, and gene-therapy
    landscape are all supported by both providers and align with the existing
    kb/disorders/BEST1_Bestrophinopathies.yaml entry (channel dysfunction, RPE-photoreceptor
    interface disruption, subretinal fluid/vitelliform lesions, progressive degeneration).
  not_integrated: >-
    The OpenScientist-only Hsp70/CHIP ubiquitination mechanism and the Falcon-only PABA
    small-molecule activation strategy are retained as single-provider research leads
    pending primary-literature verification before promotion into curated disease mechanisms.


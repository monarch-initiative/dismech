narrative:
  overview: >-
    Both providers frame acute annular outer retinopathy (AAOR) as an ultra-rare
    acute outer retinal disorder within the AZOOR spectrum, defined by an annular
    peripapillary gray-white ring with acute scotoma and photopsia, primary
    photoreceptor/outer-retinal injury on multimodal imaging, an unknown but
    likely immune-mediated/post-viral etiology, and no proven treatment. Falcon
    used the pathophysiology-focused prompt and is mechanism-first and more
    concise; OpenScientist ran the broader disease-characteristics prompt and
    contributes more recent, quantitative clinical detail.
  agreement: >-
    The reports converge on the core picture: AAOR is a rare acquired
    (non-hereditary) outer retinopathy in the AZOOR/white-dot-syndrome family;
    etiology is unknown but autoimmune and/or post-infectious; antiretinal
    antibodies support immune targeting of photoreceptors; the defining lesion is
    at the photoreceptor/ellipsoid-zone level with RPE change as a downstream
    feature; presenting symptoms are acute photopsia, scotoma, and visual field
    loss; foveal/macular involvement governs visual prognosis; and no therapy
    (corticosteroids, immunosuppressants, antivirals) has proven effective.
  divergence: >-
    OpenScientist adds newer, quantitative literature (Chen 2025 formal
    three-stage APS/SS/AS course; Ramtohul 2025 symptom frequencies and the ASHH
    OCT sign; paired macular-involvement acuity figures; Herbort's explicit
    photoreceptor-primary-vs-choriocapillaritis distinction) and a firmer
    female-predominance demographic (1:3.2). Falcon, drawing on older
    case-report/DOI sources, offers only informal acute/subacute/chronic staging,
    qualitative symptom lists, and notably qualifies the female-predominance
    claim by stressing that AAOR itself spans both sexes and a wide age range.
    The two citation sets do not overlap, so they represent complementary review
    trails rather than conflicting claims; no direct contradictions were found.
  integration: >-
    Findings on disease definition/AZOOR-spectrum placement, unknown
    autoimmune/post-viral etiology, antiretinal antibodies, photoreceptor-primary
    injury with secondary RPE change, macular-involvement-dependent prognosis, the
    no-proven-treatment status, and the acute photopsia/scotoma symptom set align
    with and reinforce the existing kb/disorders/Acute_Annular_Outer_Retinopathy
    entry and are marked INTEGRATED.
  not_integrated: >-
    The formal Chen 2025 three-stage staging and the detailed
    epidemiology/demographic profile are retained as research LEADs pending
    fetch-reference verification of the underlying PMIDs before promotion; they
    refine rather than change the curated mechanism.

notes: >-
  Cross-provider synthesis comparing falcon (Edison Scientific Literature,
  pathophysiology-focused, DOI-based citations) and openscientist
  (openscientist-autonomous, comprehensive 15-domain, PMID-based citations).
  best_matching_text values are verbatim excerpts from the respective report

narrative:
  overview: >-
    Both providers frame ROS1-rearranged NSCLC as a rare, fusion-driven lung
    adenocarcinoma subtype (~1-2% of NSCLC) enriched in younger never-smoking
    women, with oncogene addiction to a constitutively active ROS1 kinase, high
    CNS tropism, a rapidly evolving ROS1 TKI landscape, and near-universal
    acquired resistance as the dominant clinical themes. Falcon is a
    therapy-and-trials-focused report; OpenScientist is a comprehensive
    15-domain characterization that adds mechanistic and normal-biology depth.
  agreement: >-
    The reports converge on the core driver biology (somatic ROS1 fusion →
    constitutive, ligand-independent kinase → RTK effector signaling driving
    proliferation/survival), the demographic profile (younger, female,
    never-smoker), frequent brain metastases at diagnosis driving TKI choice,
    the resistance landscape (on-target G2032R and other kinase-domain mutations
    plus off-target MET bypass), and the primacy of next-generation ROS1 TKIs
    (repotrectinib TKI-naive median PFS 35.7 months) with activity against
    G2032R.
  divergence: >-
    OpenScientist uniquely elaborates the signaling mechanism — convergence of
    all ROS1 fusions on STAT3 and stronger SHP2 phosphorylation than ALK fusions
    (nominating SHP2 as a therapeutic vulnerability) — and the normal
    NELL2-ROS1 lumicrine biology, both of which Falcon is silent on. It also
    develops the TP53/CDKN2A/B immunosuppressive, immune-cold microenvironment
    and its link to limited checkpoint-inhibitor benefit, where Falcon notes
    only that TP53 co-alteration worsens outcomes. Falcon contributes denser
    late-breaking trial and real-world detail (TRIDENT-1, TRUST-I, BFAST Cohort D
    liquid-biopsy selection, ROS1REAL). The only quantitative divergences are
    minor and non-contradictory (baseline brain-metastasis fraction 20-40% vs
    22-36%; frequency framed as 1-2.5% vs 1-2%).
  integration: >-
    Integrated into kb/disorders/ROS1_Rearranged_NSCLC.yaml: the ROS1-fusion
    driver and constitutive-kinase pathophysiology, the younger/female/
    never-smoker demographic profile, frequent CNS involvement, the expanded
    resistance node (G2032R and other on-target mutations, MET amplification,
    HGF-MET bypass, serial profiling), and the ROS1 TKI treatment nodes with
    repotrectinib (macrocyclic, CNS-penetrant, TRIDENT-1) and taletrectinib
    (TKI-naive/pretreated, intracranial, G2032R) detail.
  not_integrated: >-
    Retained as research leads rather than promoted: the SHP2/STAT3 convergence
    and SHP2-inhibitor combination rationale, the normal NELL2-ROS1 lumicrine
    biology, the TP53/CDKN2A/B immunosuppressive-microenvironment/immunotherapy
    interpretation, and emerging agents (zidesamtinib, cabozantinib for L2086F,
    unecritinib, APG-2449) and detailed adverse-event profiles.

notes: >-
  Cross-provider synthesis comparing two independent deep-research reports for

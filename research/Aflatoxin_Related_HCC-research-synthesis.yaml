narrative:
  overview: >-
    Both providers frame aflatoxin-related HCC as a paradigm of gene-environment
    carcinogenesis: chronic dietary AFB1 exposure is hepatically bioactivated to a
    reactive epoxide that forms DNA adducts and imprints the characteristic TP53
    R249S "fingerprint" mutation, with chronic HBV infection acting as a
    supra-multiplicative co-factor and with exposure reduction/chemoprevention as
    demonstrably effective public-health levers. Falcon is a biomarker- and
    prevention-centric report anchored on recent (2024-2026) reviews and drug-free
    of clinical-management detail; OpenScientist is a broader, mechanism-to-therapy
    report that adds molecular gain-of-function, host genetics, immune
    microenvironment, and standard-of-care treatment coverage.
  agreement: >-
    The two reports concur on the core causal chain — CYP-mediated AFB1
    bioactivation to the 8,9-exo-epoxide, N7-guanine/FAPY adduct formation, G->T
    transversions, and the TP53 codon 249 R249S hallmark mutation as a molecular
    fingerprint and circulating early-detection biomarker. They agree on the
    more-than-multiplicative HBV-AFB1 synergy, on the substantial attributable
    global burden concentrated in sub-Saharan Africa, Southeast Asia, and China,
    and on validated chemoprevention (oltipraz, chlorophyllin) from the Qidong
    trials.
  divergence: >-
    OpenScientist uniquely develops the R249S gain-of-function CDK4-PIN1-c-Myc
    proliferative axis, the host phase-II detoxification/DNA-repair susceptibility
    genotypes (GSTM1-null, GSTT1-null, XRCC1), the AFB1-driven IL-6/NF-kB/M2
    immunosuppressive microenvironment with an anti-IL-6 plus anti-PD-1 strategy,
    and standard HCC systemic therapy (atezolizumab plus bevacizumab). Falcon is
    largely silent on these, explicitly noting that clinical presentation, imaging,
    standard-of-care therapy, and host genetics were outside its retrieved corpus;
    it touches the immune axis only weakly, noting higher PD-L1 and microvessel
    density in dual-exposure tumors. The divergences are coverage/emphasis, not
    conflict — no genuine contradiction was found, and burden is expressed in
    complementary framings (Falcon population attributable risk of 17% vs
    OpenScientist absolute case counts).
  integration: >-
    Promote the shared causal-chain findings into kb/disorders/Aflatoxin_Related_HCC.yaml:
    AFB1 CYP bioactivation and epoxide/adduct formation, the TP53 R249S hallmark
    mutation (with its circulating cfDNA diagnostic role), the more-than-
    multiplicative HBV-AFB1 synergy, the substantial attributable epidemiologic
    burden, host GST/XRCC1 susceptibility genetics, the R249S CDK4-PIN1-c-Myc
    gain-of-function pathway, and Qidong-validated chemoprevention.
  not_integrated: >-
    The AFB1-driven immunosuppressive microenvironment and the anti-IL-6 plus
    anti-PD-1 combination are retained as a research lead: they rest on very recent
    (2025-2026) preclinical work not yet validated in human trials, and Falcon
    corroborates only the weaker dual-exposure immune-phenotype observation.
    Generic HCC standard-of-care systemic therapy (not aflatoxin-specific) is
    likewise held as context rather than promoted as an etiology-specific mechanism.

notes: >-
  Two independent provider reports were compared: falcon (Edison Scientific
  Literature; biomarker/prevention-focused) and openscientist
  (openscientist-autonomous; comprehensive mechanism-to-therapy). MONDO:0007256
  (hepatocellular carcinoma) is taken from kb/disorders/Aflatoxin_Related_HCC.yaml;
  neither aflatoxin-related HCC nor a distinct etiological subtype has its own MONDO
  entry. No direct contradictions were identified; divergence is coverage/emphasis
  (OpenScientist adds gain-of-function, host genetics, immune microenvironment, and
  treatment) plus complementary burden framings. best_matching_text values are
  verbatim excerpts from the cited report files; literature evidence snippets were
  intentionally left to the main curation pipeline pending fetch-reference
  verification.

narrative:
  overview: >-
    Both providers frame RET-rearranged NSCLC as a rare (~1-2%) but highly
    actionable fusion-driven lung adenocarcinoma subtype, enriched in younger,
    female, never/light-smoking patients, with constitutive RET kinase signaling,
    selective RET tyrosine kinase inhibition (selpercatinib, pralsetinib),
    frequent CNS metastasis, an immune-cold microenvironment, and acquired
    resistance as the major curated concepts.
  agreement: >-
    Both identify RET-rearranged NSCLC as a fusion-driven adenocarcinoma with
    KIF5B-RET as the dominant partner (followed by CCDC6 and NCOA4), constitutive
    ligand-independent RET signaling through RAS-MAPK, PI3K-AKT, JAK-STAT, and
    PLCgamma, and strong first-line benefit from selpercatinib (LIBRETTO-431 PFS
    24.8 vs 11.2 months). They converge on the immune-cold/low-TMB microenvironment
    with limited immunotherapy benefit, the CNS-metastasis propensity, and
    resistance via on-target RET G810 solvent-front mutations plus MET/bypass
    signaling.
  divergence: >-
    Falcon emphasized the selective RET inhibitor treatment landscape, diagnostic
    modality comparison (RNA-based NGS preferred), first-line selpercatinib and
    real-world RET-TKI cohorts, and a KIF5B-RET transgenic mouse model.
    OpenScientist added deeper molecular and resistance detail: RET protein-domain
    and structural biology, co-occurring TP53/CDKN2A alterations, an expanded
    bypass-resistance catalog (MET/KRAS amplification, AXL/IGF-1R, SMARCA4 loss),
    next-generation RET inhibitors, and the physiologic role of wild-type RET.
    Quantitative differences are minor (median age 63 vs 58 years; baseline
    brain-metastasis fraction ~25% vs 6.7%) rather than contradictions.
  integration: >-
    Integrated into kb/disorders/RET_Rearranged_NSCLC.yaml: the driver mechanism
    and fusion-partner spectrum, the multi-pathway effector signaling, the
    epidemiology/demographic enrichment, the CNS-metastasis phenotype, the
    immune-cold microenvironment and weak immunotherapy signal, the RET inhibitor
    resistance node (G810R/S/C plus MET/KRAS bypass), and the first-line
    selpercatinib LIBRETTO-431 evidence.
  not_integrated: >-
    Next-generation investigational RET inhibitors, experimental RET/SRC and
    RET/MET combination strategies, fine-grained adverse-event management, and the
    contextual normal-RET developmental biology were retained as research leads
    rather than promoted to curated disease mechanisms.


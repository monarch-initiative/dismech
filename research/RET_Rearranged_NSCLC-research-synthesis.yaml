- statement: >-
    RET-rearranged NSCLC is driven by a somatic chromosomal rearrangement that
    fuses the 3' RET kinase domain to a 5' partner gene, whose oligomerization
    domain forces ligand-independent, constitutive activation of the retained RET
    tyrosine kinase and drives lung adenocarcinogenesis.

narrative:
  overview: >-
    Both providers frame Arterial Calcification of Infancy as Generalized Arterial
    Calcification of Infancy (GACI), an ultra-rare autosomal recessive ectopic-mineralization
    disorder in which biallelic loss of ENPP1 (majority) or ABCC6 (minority) causes systemic
    inorganic pyrophosphate (PPi) deficiency, driving hydroxyapatite deposition and stenosis
    of large and medium arteries with high early mortality and, in survivors, an evolving
    lifelong ENPP1-deficiency spectrum.
  agreement: >-
    The reports converge tightly on the core biology: ENPP1 hydrolyzes extracellular ATP to
    AMP + PPi; PPi is the principal inhibitor of hydroxyapatite crystal growth; and a second
    AMP/adenosine arm restrains vascular smooth muscle cell proliferation, so its loss adds
    intimal/neointimal proliferation and stenosis. They agree on the clinical picture
    (fetal/neonatal arterial calcification, severe hypertension, heart failure, prenatal
    hydrops/polyhydramnios), on the natural-history mortality (54.7% overall, 50.4% before
    6 months, higher in ENPP1 than ABCC6), on the survivor spectrum (FGF23-mediated
    hypophosphatemic rickets/ARHR2, ~75% hearing loss, ~25% cervical spine fusion, enthesis
    calcification), on ENPP1-Fc/INZ-701 enzyme replacement as the leading disease-targeted
    therapy, and on the finding that bisphosphonates confer no matched survival benefit.
  divergence: >-
    Divergence is largely coverage and emphasis rather than contradiction. Falcon emphasized
    clinical-trial provenance for INZ-701 (ENERGY, ENERGY 2, ENERGY 3, ADAPT records) and
    the gene-proportion split framed as ~67-75% ENPP1 / ~9-10% ABCC6. OpenScientist provided
    a broader mechanistic and translational review, including a slightly different proportion
    estimate (~85% / ~15%), ENPP1 crystal structures, the FGF23 "mineralization paradox," and
    two threads Falcon does not cover at all: ENPP1 as an innate immune checkpoint via
    cGAMP-STING hydrolysis, and ENPP1 as a bidirectional calcification regulator (loss-of-
    function GACI vs gain-of-expression CPPD/chondrocalcinosis). The only numeric differences
    (gene-proportion estimates) are dataset-dependent, not conflicting.
  integration: >-
    Integrated into kb/disorders/Arterial_Calcification_of_Infancy.yaml: the ENPP1/ABCC6
    PPi-deficiency mechanism with the AMP/adenosine second-driver arm; the arterial phenotype
    and prenatal presentation; the natural-history mortality and ENPP1-vs-ABCC6 outcome
    difference; the survivor spectrum (FGF23/ARHR2, hearing loss, cervical spine fusion,
    enthesopathy); ENPP1-Fc/INZ-701 enzyme replacement as the leading therapy with the
    clinical-trial records; and the bisphosphonate no-survival-benefit update.
  not_integrated: >-
    Retained as research leads rather than promoted: the ENPP1 cGAMP-STING immune-checkpoint
    role and bidirectional CPPD/chondrocalcinosis association, speculative TNAP-inhibition and
    nanoparticle/chelator anti-calcification strategies, allele-specific 4-PBA chaperone
    rescue of ABCC6 mutants, expanded genotype-specific variant lists, and detailed prenatal
    ultrasound findings.


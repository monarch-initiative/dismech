    score: 0.95
    best_matching_text: >-
      mutations disrupt α3α4α5(IV) heterotrimer formation and basement membrane
      integrity, rendering the GBM vulnerable under filtration pressure, leading to
      haematuria and progressive injury.
    explanation: >-
      Falcon names the same three COL4 genes and the alpha3-alpha4-alpha5(IV) heterotrimer
      defect as the primary causal mechanism of GBM failure.
    citations: ["DOI:10.23876/j.krcp.24.065"]

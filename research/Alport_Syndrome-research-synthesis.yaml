- statement: >-
    Alport syndrome is a hereditary basement-membrane disorder caused by pathogenic
    variants in COL4A3, COL4A4, and COL4A5, which disrupt assembly of the
    alpha3-alpha4-alpha5 type IV collagen network of the glomerular (and cochlear/ocular)
    basement membranes.
  sections: [pathophysiology, genetic_factor]
  curation_status: INTEGRATED
  provider_support:

narrative:
  overview: >-
    Both providers frame Alport syndrome as a monogenic type IV collagen basement-membrane
    disease driven by COL4A3/COL4A4/COL4A5 variants, presenting with a kidney-ear-eye triad
    and progressing from hematuria through proteinuria to end-stage renal disease. Falcon is
    guideline- and trial-registry-oriented (ERKNet/ERA/ESPN guidance, ClinicalTrials.gov
    records), while OpenScientist is broader and more mechanistic, integrating over 60
    publications across genotype-phenotype, pathogenesis, animal models, and emerging therapy.
  agreement: >-
    The reports converge strongly on the core biology: the alpha3-alpha4-alpha5(IV) collagen
    defect, X-linked predominance (~80-85%) alongside AR/AD/digenic forms, the clinical triad,
    the pathognomonic basket-weave GBM change on electron microscopy, RAS/RAAS blockade as
    the disease-modifying standard of care, and SGLT2 inhibitors (DOUBLE PRO-TECT, NCT05944016)
    as an emerging add-on. Both also recognize that female X-linked carriers carry real disease
    burden.
  divergence: >-
    OpenScientist contributes quantitative genotype-phenotype detail (truncating vs
    non-truncating median ESRD 22 vs 39 years; glycine-substitution severity), quantified
    female-carrier burden (ECASCA/Korean cohorts), a detailed downstream cascade (ectopic
    laminin alpha2, IL-11/TGF-beta fibrosis, USAG-1/BMP-7), animal-model and carrier-prevalence
    data. Falcon uniquely details the bardoxolone methyl CARDINAL trial (efficacy signal vs
    safety/outcome concerns and FDA rejection) and the miR-21/lademirsen program. Quantitative
    differences (e.g., female renal-failure risk figures, prevalence framing) are coverage/
    granularity gaps rather than contradictions.
  integration: >-
    Promoted to the disorder entry: the COL4A3/4/5 alpha3-alpha4-alpha5(IV) driver mechanism
    and GBM pathogenesis, the inheritance-form spectrum with X-linked predominance, the
    kidney-ear-eye phenotype set, the truncating-vs-non-truncating prognostic split, the
    basket-weave EM diagnostic hallmark, RAAS blockade as standard of care, and SGLT2
    inhibitors/DOUBLE PRO-TECT as emerging therapy.
  not_integrated: >-
    Retained as research leads rather than curated mechanisms: bardoxolone methyl/CARDINAL
    (investigational, FDA-rejected), the miR-21/lademirsen and anti-IL-11 programs, gene-editing
    approaches, and the detailed downstream fibrosis signaling (IL-11/TGF-beta, USAG-1/BMP-7),
    pending primary-literature verification.


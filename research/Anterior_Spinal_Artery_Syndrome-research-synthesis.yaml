- statement: >-
    Anterior spinal artery syndrome is ischemia/infarction in the territory of the
    anterior spinal artery, which supplies the anterior (ventral) two-thirds of the
    spinal cord (corticospinal tracts, spinothalamic tracts, and anterior horn motor
    neurons); the dorsal columns are spared, producing the hallmark dissociated
    sensory loss.

narrative:
  overview: >-
    Both providers frame Anterior Spinal Artery Syndrome (anterior cord syndrome) as an
    acquired vascular myelopathy caused by ischemia in the anterior spinal artery
    territory, which supplies the anterior two-thirds of the spinal cord. They converge
    on the same clinical picture, imaging signature, and management posture, differing
    mainly in depth: Falcon centers on the diagnostic/perioperative-prevention framing
    drawn from spinal cord infarction and aortic-surgery literature, while OpenScientist
    is broader and adds quantitative epidemiology/outcomes, a fibrocartilaginous-embolism
    and pediatric arm, and a detailed molecular ischemia-reperfusion cascade.
  agreement: >-
    Strong concordance on the core concepts: ASA-territory anatomy with dorsal column
    sparing and dissociated sensory loss; predominantly vascular etiology led by aortic
    pathology (dissection, atherosclerosis, surgical repair); the acute triad of
    bilateral motor paralysis, pain/temperature loss, and autonomic dysfunction;
    hyperacute onset reaching nadir within hours; the pencil-like/owl's eye/snake-eye
    DWI-restriction MRI signature; poor and severity-dependent prognosis with ASIA A/B as
    the dominant predictor; the absence of a causal gene (not monogenic); and supportive,
    non-disease-specific management (perfusion optimization, CSF drainage, antithrombotics,
    rehabilitation). Both also independently cite ~3.1/100,000 person-year incidence and
    SCI at ~1-2% of strokes.
  divergence: >-
    OpenScientist contributes material Falcon does not: quantitative outcomes (~22%
    in-hospital mortality, 57% wheelchair dependence), the ASAS ontology identifiers
    (MONDO/MeSH/SNOMED/DOID), an explicit fibrocartilaginous-embolism and pediatric
    phenotype, naturally occurring canine/equine disease, and a granular molecular
    ischemia-reperfusion cascade (NF-κB, NLRP3, HMGB1, ferroptosis, pyroptosis) with
    named preclinical neuroprotective agents. Falcon uniquely details protocolized
    aortic-surgery spinal cord protection bundles (MAP/Hb targets, staging, CSF drainage)
    and TEVAR-like murine models. The only quantitative discrepancies are minor
    (time-to-nadir upper bound; antithrombotic emphasis) and do not amount to
    contradictions.
  integration: >-
    Promote the concordant backbone into kb/disorders/Anterior_Spinal_Artery_Syndrome.yaml:
    ASA-territory ischemia pathophysiology with anterior horn/tract injury and dorsal
    column sparing; the vascular/aortic etiology; the acute motor/dissociated-sensory/
    autonomic phenotype; hyperacute onset and the noncompressive MRI signature as
    diagnostic anchors; poor severity-dependent prognosis (ASIA A/B); the non-monogenic
    genetic statement; and the supportive treatment strategy.
  not_integrated: >-
    The detailed molecular ischemia-reperfusion cascades and preclinical neuroprotective
    agents (anti-HMGB1, CaMKII inhibition, ferroptosis/pyroptosis modulators) are retained
    as research leads pending human evidence, as are provider-specific extras such as the
    aortic-surgery prevention-protocol numbers, veterinary/comparative biology, and the
    ontology identifier crosswalk.


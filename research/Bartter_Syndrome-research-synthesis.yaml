    Bartter syndrome is an inherited salt-losing renal tubulopathy caused by defective
    NaCl reabsorption in the thick ascending limb (TAL) of the loop of Henle, producing
    hypokalemic hypochloremic metabolic alkalosis with hyperreninemic secondary
    hyperaldosteronism and characteristically normal-to-low blood pressure.

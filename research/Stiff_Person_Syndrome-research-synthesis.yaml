narrative:
  overview: >-
    All three reports were commissioned on the same autoimmune-pathophysiology
    template, but only two returned usable coverage. Falcon (Edison, SPS-focused,
    26 citations) and perplexity (sonar-deep-research, comprehensive, 41 citations)
    both frame Stiff Person Syndrome as an antibody-mediated failure of GABAergic
    inhibitory neurotransmission in the CNS, with high-titer anti-GAD65 antibodies
    as the central biomarker, impaired GABA synthesis and loss of reciprocal
    inhibition as the physiologic lesion, and a two-pronged treatment logic
    (GABA-enhancing symptomatic drugs plus immunotherapy). Perplexity reads as an
    exhaustive narrative review; falcon reads as a tightly cited mechanistic brief
    anchored on the Dalakas 2023 therapy review and recent cohort studies. Asta
    was a retrieval-only run and returned no on-topic material.
  agreement: >-
    Falcon and perplexity converge strongly and without contradiction on the core
    disease model: antibody-associated impairment of GABAergic (and, in PERM,
    glycinergic) inhibition; GAD65 as the principal autoantigen; a spectrum of
    additional synaptic autoantigens (GABARAP ~70%, GlyR/PERM, amphiphysin in
    paraneoplastic disease, gephyrin); the clinical spectrum of classic SPS,
    stiff-limb, SPS-plus, and PERM; and a symptomatic-plus-immunotherapy treatment
    frame with IVIg first-line and rituximab for refractory disease. Most strikingly,
    both cite the identical CSF statistics for intrathecal B-cell activation
    (oligoclonal bands in 67%, elevated GAD65-specific IgG index in 85%), which
    trace back to the same Dalakas source.
  divergence: >-
    Divergence is one of coverage and granularity rather than genuine conflict.
    Perplexity contributes unique depth and leads: quantitative MR-spectroscopy
    data (30-40% GABA reduction in sensorimotor cortex), motor-cortex
    hyperexcitability by TMS, and novel genetic markers beyond HLA (KLK10 in ~95%
    of patients, plus ORAI1 and LILRA4), as well as emerging therapies (anti-CD19
    CAR T-cells, extracorporeal photopheresis). Falcon contributes cohort
    epidemiology (0.11/100,000 in Japan, ~76% female, adult onset), prognostic
    signal (early immunotherapy improves outcomes; brainstem/cerebellar
    involvement predicts worse outcome), and complement inhibition (eculizumab) in
    GlyR-antibody-positive disease. Asta contributed no on-topic coverage
    whatsoever: its retrieval returned only unrelated diseases (progeria,
    cardiomyopathy, liver fibrosis, ALS, LGMD, Parkinson's, mitochondrial disease),
    so it is silent across every harmonized finding and adds nothing to the synthesis.
  integration: >-
    The falcon/perplexity consensus is solid enough to promote as curated content:
    the antibody-mediated GABAergic mechanism, GAD65 as principal antigen with
    impaired GABA synthesis, intrathecal B-cell activation (OCB 67% / IgG index 85%),
    reduced brain/CSF GABA with loss of reciprocal inhibition and cortical
    hyperexcitability, the additional-autoantigen subsets, the classic/stiff-limb/
    SPS-plus/PERM spectrum, and the GABA-enhancing-plus-IVIg/rituximab treatment
    frame. Each of these is dual-sourced and internally consistent with the existing
    disorder YAML.
  not_integrated: >-
    Two findings are retained as leads rather than promoted. The epidemiology claim
    is single-provider-strong (falcon's cohort figures) with only partial perplexity
    corroboration (prevalence but no sex ratio/onset), so the precise numbers should
    be verified against primary sources before promotion. The novel-genetics finding
    (KLK10 ~95%, ORAI1, LILRA4) is reported only by perplexity and rests on a single
    whole-exome study; it is a promising but unconfirmed lead that needs independent
    replication before it enters the disorder YAML. Perplexity's CAR-T and
    photopheresis material is likewise emerging and left as a lead.


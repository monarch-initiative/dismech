notes: >-
  Three providers were compared: falcon (Edison, SPS-focused pathophysiology, 26
  citations) and perplexity (sonar-deep-research, comprehensive 41-citation report)
  are both on-topic and broadly concordant, agreeing on the antibody-mediated
  GABAergic mechanism, GAD65 as principal antigen, intrathecal B-cell activation
  (OCB 67% / IgG index 85%, an exact numerical match), the additional-autoantigen
  subsets, the clinical spectrum, and the symptomatic-plus-immunotherapy treatment
  frame. Divergence is coverage/granularity rather than conflict: perplexity adds
  quantitative detail (MRS GABA 30-40% reduction) and unique leads (KLK10/ORAI1/LILRA4
  genetics, CAR-T and extracorporeal photopheresis), while falcon adds cohort
  epidemiology (0.11/100,000, ~76% female) and complement inhibition (eculizumab) in
  GlyR-positive disease. No CONTRADICTORY stances were found. The asta report is a
  retrieval-only run that returned exclusively off-topic papers (progeria,
  cardiomyopathy, liver fibrosis, ALS, LGMD, Parkinson's, mitochondrial disease);
  it contributes no SPS-relevant content and is therefore SILENT on every finding.
  best_matching_text values are verbatim excerpts from the report files; literature
  citations here are provider-reported and left unverified pending fetch-reference checks.

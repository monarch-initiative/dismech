narrative:
  overview: >-
    Both providers frame acute promyelocytic leukemia as a genetically defined AML
    subtype driven by the t(15;17) PML-RARA fusion oncoprotein, which blocks
    promyelocyte differentiation and disrupts PML nuclear bodies. Both center the
    same clinical story: a life-threatening DIC/hemorrhagic coagulopathy, a
    historic transformation to the most curable AML by ATRA plus arsenic trioxide
    differentiation therapy, and early death as the remaining barrier to cure.
  agreement: >-
    The reports converge tightly on the core biology and therapy: the fusion driver
    and differentiation block; the dual repressor / PML-nuclear-body mechanism; the
    dual-moiety mechanism of ATRA (RARA arm) and ATO (PML B-box 2 -> SUMOylation/
    ubiquitination degradation); the DIC coagulopathy hallmark; the transformation
    to >90% survival with ATRA+ATO; and early death within 30 days (up to ~30% in
    real-world cohorts, hemorrhage predominant) as the principal unmet challenge.
  divergence: >-
    Divergence is coverage/depth rather than conflict. OpenScientist (52 citations)
    adds substantial molecular and clinical granularity that Falcon (26 citations)
    omits: the epigenetic repressor hierarchy (NuRD -> Polycomb/H3K27me3, DNMT
    recruitment), quantified cooperating mutations (FLT3-ITD ~20-40%, WT1, NRAS/
    KRAS), therapy-related APL via topoisomerase II inhibitors, PML B-box2 ATO
    resistance mutations, breakpoint cluster regions, Sanz risk stratification,
    immunophenotype, and detailed treatment regimens. Falcon explicitly notes that
    environmental etiologies and several identifiers were not extractable from its
    retrieved evidence, which is why it is silent (not contradictory) on t-APL and
    the epigenetic-complex mechanism. No direct contradictions were found between
    the two reports.
  integration: >-
    The concordant core findings (fusion driver and differentiation block, dual
    repressor / PML-nuclear-body mechanism, ATRA/ATO dual-moiety mechanism, DIC
    coagulopathy hallmark, ATRA+ATO curability, and early-death barrier) are
    suitable for integration into kb/disorders/APL_PML_RARA.yaml pathophysiology,
    treatment, phenotype, and prognosis blocks, anchored on the verified PMIDs/DOIs
    each provider cites.
  not_integrated: >-
    The OpenScientist-only depth (epigenetic NuRD/Polycomb recruitment, quantified
    cooperating mutations, and topoisomerase II-mediated therapy-related APL) is
    retained as research leads pending independent PMID/snippet verification before
    promotion, rather than integrated directly from the synthesis.

notes: >-
  Cross-provider synthesis comparing falcon (pathophysiology/outcomes-focused, 26
  citations) and openscientist (comprehensive 15-domain, 52 citations). Agreement
  is strong on driver biology, ATRA/ATO mechanism and curability, coagulopathy, and
  early-death burden; divergence is coverage/depth (OpenScientist adds epigenetic,
  cooperating-mutation, and therapy-related-APL detail Falcon does not retrieve),
  with no direct contradictions. best_matching_text values are verbatim excerpts
  from the cited report files; literature evidence snippets are intentionally left
  for the main curation pipeline after fetch-reference verification.

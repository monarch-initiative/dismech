- statement: >-
    The pathogenic cascade proceeds from immune-complex deposition through
    classical-pathway complement activation (C3a/C5a) and neutrophil
    recruitment/degranulation to fibrinoid necrosis of the vessel wall,
    leukocytoclasia, and red-blood-cell extravasation.
  sections: [pathophysiology]
  curation_status: INTEGRATED
  provider_support:
  - provider: falcon
    source_report: research/Allergic_Cutaneous_Vasculitis-deep-research-falcon.md
    stance: CONCORDANT
    matched: true
    score: 0.92
    best_matching_text: >-
      4) **Classical complement cascade activation** (C3a/C5a generation) → 5)
      **mast cell degranulation and histamine release** → 6) **neutrophil
      recruitment and degranulation** → 7) **fibrinoid necrosis of vessel walls**
      and leukocytoclasia → 8) **RBC extravasation** causing non-blanching purpura.
    explanation: >-
      Falcon gives the ordered complement/neutrophil cascade ending in fibrinoid
      necrosis and RBC extravasation, and additionally emphasizes an upstream
      mast-cell degranulation step.
    citations: ["DOI:10.20431/2456-0022.0807003"]

narrative:
  overview: >-
    Both providers characterize allergic cutaneous vasculitis as an acquired,
    immune-complex-mediated (Gell-Coombs type III) small-vessel vasculitis of the
    superficial dermal postcapillary venules, presenting with palpable purpura on
    the lower extremities and diagnosed by biopsy showing leukocytoclasia,
    fibrinoid necrosis, and RBC extravasation. Falcon (Edison Scientific
    Literature) delivers a concise, guideline-anchored clinical guide; the
    OpenScientist report is far broader (15 domains, animal models, quantified
    epidemiology and etiology, and a genetic-susceptibility catalogue).
  agreement: >-
    The reports converge strongly on the core mechanism (immune-complex
    deposition → classical complement activation with C3a/C5a → neutrophil
    recruitment and degranulation → fibrinoid necrosis, leukocytoclasia, and RBC
    extravasation), the cardinal palpable-purpura phenotype on dependent skin,
    biopsy of a fresh (<48 h) lesion plus DIF as the diagnostic approach, an
    incidence on the order of 15-38 per million per year, a favorable self-limited
    course, and the same treatment ladder (trigger removal and supportive care →
    colchicine → dapsone → corticosteroids/immunosuppressants). Both also agree
    the disorder is non-Mendelian.
  divergence: >-
    Divergence is mostly coverage and quantification rather than conflict.
    OpenScientist quantifies the etiology breakdown (drugs ~40%, infections ~20%,
    idiopathic up to 50%), pins the relapse rate at 18-25% (versus Falcon's ~10%
    chronic/relapsing framing), assigns identifiers Falcon could not retrieve
    (MONDO:0019552, ORPHA:889), and adds a polygenic susceptibility catalogue
    (HLA-DRB1, IL1RN, complement C2/C4, TNF), animal Arthus-reaction models, and
    emerging biologic/JAK-inhibitor therapies. Falcon uniquely foregrounds an
    upstream mast-cell degranulation step in the cascade and current practical
    dosing. No direct contradictions were found.
  integration: >-
    The harmonized mechanism, phenotype, diagnostic, epidemiologic, prognostic,
    treatment, and genetic-architecture findings are all suitable to integrate
    into kb/disorders/Allergic_Cutaneous_Vasculitis.yaml, with OpenScientist
    supplying the quantified etiology/epidemiology figures and Falcon supplying
    the guideline-anchored diagnostic and treatment mechanics.
  not_integrated: >-
    Provider-specific extensions retained as research leads rather than promoted:
    OpenScientist's polygenic susceptibility loci, animal Arthus-reaction models,
    and emerging biologic/JAK-inhibitor therapies, and the urticarial-vasculitis
    subset detail. These require independent primary-literature verification
    before promotion to curated evidence.


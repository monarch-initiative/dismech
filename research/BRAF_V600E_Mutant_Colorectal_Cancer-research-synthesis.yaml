narrative:
  overview: >-
    Both providers frame BRAF V600E-mutant colorectal cancer as a molecularly
    distinct, clinically aggressive CRC subtype driven by constitutive RAF-MEK-ERK
    (MAPK) signaling, associated with the serrated neoplasia pathway, CIMP-high
    methylation and MSI-H, and defined therapeutically by combined BRAF plus EGFR
    targeting (encorafenib plus cetuximab). Falcon is trial- and treatment-centric
    (60 citations, heavy on BEACON/ANCHOR/BREAKWATER outcomes and real-world
    cohorts); OpenScientist is broader and more mechanistic (39 citations, detailing
    serrated pathogenesis, epigenetics, resistance biology, and MSI-H prognosis).
  agreement: >-
    Both treat BRAF V600E CRC as an aggressive subtype driven by constitutive
    MAPK/ERK signaling with poor prognosis (median metastatic OS ~14.9 months).
    They agree that EGFR feedback reactivation undermines single-agent BRAF
    inhibition and supports combined BRAF plus EGFR targeting, that BEACON CRC
    established encorafenib plus cetuximab (±binimetinib) as standard of care
    (OS 9.3 vs 5.9 months), that acquired resistance is polyclonal and convergent
    on MAPK reactivation (KRAS/RAS, MAP2K1, MET; TP53 to MET amplification), and
    that the subtype is enriched in right-sided, female, older, mucinous/MSI-H
    tumors.
  divergence: >-
    Falcon emphasized targeted-therapy trial evidence, real-world encorafenib
    outcomes, and the treatment landscape, and it foregrounds the EGFR-feedback
    rationale for combination therapy. OpenScientist added a clearer serrated
    neoplasia model — CIMP-high with MLH1 promoter silencing, the MSI-H versus MSS
    split — and quantified the prognostic penalty of BRAF V600E within MSI-H CRC
    (19 vs 113 months). Quantitative framing of prevalence differs but does not
    conflict: Falcon cites 6.77% in a nationwide advanced-CRC cohort and ~10-15%
    across trials/reviews, OpenScientist cites 8-15% of all CRC. No direct
    contradictions were found.
  integration: >-
    Integrated into kb/disorders/BRAF_V600E_Mutant_Colorectal_Cancer.yaml: the
    serrated-neoplasia/CIMP-high and MLH1-silencing pathophysiology, the constitutive
    MAPK driver and EGFR-feedback reactivation rationale, acquired MAPK-reactivation
    resistance (KRAS/MAP2K1/MET; TP53 to MET), the BEACON encorafenib+cetuximab
    (±binimetinib) targeted-therapy standard, MSI-H/dMMR checkpoint-inhibitor
    coverage, the clinicopathologic enrichment profile, and the poor-prognosis
    natural history.
  not_integrated: >-
    The precise BRAF-V600E-within-MSI-H prognostic contrast (19 vs 113 months) is
    retained as a research lead. Detailed investigational trial strategy
    (ANCHOR/BREAKWATER/SEAMARK), ctDNA-guided rechallenge and monitoring proposals,
    epigenetic-therapy hypotheses, first-line-optimization debates, and
    model-system limitations were left in research provenance as leads rather than
    promoted to curated disease mechanisms.


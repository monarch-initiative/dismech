- statement: >-
    AQP4-IgG binding to astrocytic AQP4 activates the classical complement
    pathway, progressing from C1q through C3 and C5 to formation of the C5b-9
    membrane attack complex (MAC) that lyses astrocytes; complement-dependent
    cytotoxicity is the principal effector of astrocyte destruction.
  sections: [pathophysiology]
  curation_status: INTEGRATED
  provider_support:

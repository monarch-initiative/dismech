    explanation: Falcon describes the classical complement cascade culminating in the MAC.
    citations: ["DOI:10.1186/s41232-023-00291-5"]
  - provider: asta
    source_report: research/Neuromyelitis_Optica-deep-research-asta.md
    stance: CONCORDANT
    matched: true
    score: 0.9
    best_matching_text: >-
      The binding of AQP4-IgG onto the AQP4 extracellular epitopes initiates
      astrocyte damage through complement-dependent cytotoxicity (CDC) and
      antibody-dependent cellular cytotoxicity (ADCC). Thus, a membrane attack
      complex is formed due to complement cascade activation; the membrane attack
      complex targets the AQP4 channels in the astrocytes, leading to astrocyte
      cell damage, demyelination of neurons and oligodendrocytes, and
      neuroinflammation.
    explanation: Asta's retrieved review lays out CDC/ADCC and MAC-mediated astrocyte damage.
    citations: ["DOI:10.3390/app13085029"]
  - provider: perplexity
    source_report: research/Neuromyelitis_Optica-deep-research-perplexity.md
    stance: CONCORDANT
    matched: true
    score: 0.97
    best_matching_text: >-
      The complement cascade activated by AQP4-IgG follows the classical pathway,
      progressing from C1q engagement through the sequential activation of C1r,
      C1s, C4, and C2, continuing through amplification steps involving C3 and C5,
      and culminating in formation of the membrane attack complex (MAC or C5b-9).
    explanation: Perplexity gives the full step-by-step classical pathway to MAC formation.


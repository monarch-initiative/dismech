notes: >-
  Three-way comparison of falcon (Edison, pathophysiology-focused), asta
  (retrieval-only Semantic Scholar snippets, no synthesis stage), and perplexity
  (sonar-deep-research, comprehensive). The three converge strongly on the core
  AQP4-IgG astrocytopathy/complement-MAC mechanism, the C5a-neutrophil and
  IL-6/Th17 amplification arms, and the mechanism-based biologic therapies. No
  direct contradictions were found; divergence is coverage/emphasis: falcon is
  silent on seroprevalence and disability dynamics (pathophysiology scope); asta
  provides only retrieval snippets and covers the C5a/BBB-neutrophil mechanism
  and the C. perfringens gut-mimicry lead but not their integration; perplexity
  is broadest (AQP4 OAP biology, HLA genetics, eosinophils, MOGAD contrast,
  double-negative NMOSD, environmental risk factors) but addresses the gut-brain
  mimicry only at the general molecular-mimicry level rather than the specific
  C. perfringens cross-reactivity. best_matching_text values are verbatim
  excerpts; literature evidence snippets and ontology terms were intentionally
  left to the main curation pipeline.

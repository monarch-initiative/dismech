notes: >-
  Cross-provider synthesis comparing falcon (a synthesized, pathophysiology-focused
  report, 19 citations) and asta (a retrieval-only literature listing of 18 papers with
  extracted snippets, no second-stage synthesis). The two agree strongly on the core
  biology: ERBB2 amplification/overexpression as oncogenic driver, PI3K/AKT/mTOR and
  RAS-MAPK signaling, ~15-25% prevalence with aggressive phenotype, trastuzumab plus
  ADCC as therapy backbone, and PI3K/AKT reactivation (PIK3CA mutation, PTEN loss) as a
  central resistance mechanism. No direct contradictions were found; divergence is by
  coverage — falcon adds CNS/brain-metastasis burden and the ADC bystander mechanism that
  asta does not describe (asta names the ADC agents but not the mechanism), while asta
  surfaces a circulating-metabolite biomarker lead absent from falcon. best_matching_text
  values are verbatim excerpts from the cited report files; literature evidence snippets
  and ontology terms are intentionally left to the main curation pipeline on the disorder
  YAML.

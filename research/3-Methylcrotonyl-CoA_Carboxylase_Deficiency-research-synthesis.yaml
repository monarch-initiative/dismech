narrative:
  overview: >-
    Both providers frame 3-MCCD as an autosomal recessive inborn error of
    leucine catabolism caused by biallelic MCCC1/MCCC2 variants, in which an
    enzymatic block at the fourth step of leucine degradation diverts
    3-methylcrotonyl-CoA to 3-HIVA, 3-MCG, and C5OH. Both emphasize that the
    condition is the most frequently detected organic aciduria on tandem-MS
    newborn screening yet has a strikingly variable, predominantly benign
    phenotype, driving an unresolved debate about screening utility.
  agreement: >-
    The reports converge on the core biology (leucine-catabolic block,
    biallelic MCCC1/MCCC2, mitochondrial biotin-dependent MCC), the
    highly variable phenotype from severe neonatal disease to asymptomatic
    adulthood, the absence of a reliable genotype-phenotype correlation and
    non-predictive NBS C5OH levels, the confirmatory biomarker profile (urine
    3-MCG/3-HIVA elevated in ~76.5% of cases, molecular testing definitive),
    frequent secondary carnitine deficiency, and supportive-only management
    (L-carnitine, fasting avoidance, emergency protocols). They also both
    flag the ~15% developmental-disability figure while cautioning that it is
    not clearly attributable to MCC deficiency.
  divergence: >-
    OpenScientist is broader and more registry/database-oriented: it supplies
    the explicit "most-frequent organic aciduria" claim, a 1:33,000-1:83,000
    incidence band, the MCCA-R385S dominant-negative allele, circadian
    regulation of MCC biotinylation, and structured OMIM/Orphanet/MONDO
    identifiers. Falcon is more literature-cohort-oriented: it foregrounds
    program-level newborn-screening performance (very low PPV ~0.69%, a wider
    1:2,400-1:68,000 prevalence band), the Morscher single-allele
    screen-positive caveat, the Shepard consanguinity/other-recessive-gene
    attribution problem, and a 2024 cryo-EM structural insight (exo-to-endo
    biotin relocation) that OpenScientist does not cover. The apparent
    numeric differences (asymptomatic fraction, prevalence framing) are
    coverage/denominator differences, not contradictions.
  integration: >-
    The concordant findings — AR biallelic MCCC1/MCCC2 etiology, the
    leucine-catabolic block and metabolite diversion, the variable/benign
    phenotype, absent genotype-phenotype correlation, the confirmatory
    biomarker hierarchy, secondary carnitine deficiency, and supportive
    management — are suitable for integration into the disorder entry with
    verified primary-literature evidence.
  not_integrated: >-
    The ~15% developmental-disability association is retained as a lead because
    both providers caution it may reflect other recessive disorders rather than
    MCC deficiency, and the 2024 cryo-EM exo-to-endo biotin-relocation insight
    is retained as a mechanistic lead pending peer review. Provider-specific
    items (dominant-negative R385S, circadian biotinylation, NBS PPV and
    single-allele screen-positive caveats) remain leads for targeted curation.

notes: >-
  Cross-provider synthesis comparing falcon (Edison Scientific Literature,
  cohort/structure-focused) and openscientist (autonomous, comprehensive
  15-domain) reports. No direct contradictions were found; divergence is

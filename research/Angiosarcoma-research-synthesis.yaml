narrative:
  overview: >-
    Both providers frame angiosarcoma as a rare, aggressive endothelial
    malignancy best understood as a set of molecularly distinct etiologic
    subtypes (primary/sporadic, radiation-associated, UV head/neck, chemical
    hepatic, chronic-lymphedema) unified by dysregulated angiogenesis and
    endothelial receptor signaling. Falcon is a focused pathophysiology/molecular
    report; OpenScientist is a comprehensive, 15-domain characterization that
    additionally covers diagnostics, prognosis, treatment trials, and a canine
    comparative model.
  agreement: >-
    The reports converge strongly on the core biology: endothelial cell of
    origin with dysregulated angiogenesis; near-universal MYC amplification (with
    frequent FLT4 coamplification) defining radiation-associated disease; KDR,
    PIK3CA, and PTPRB activation in primary/sporadic (especially breast)
    angiosarcoma; a UV mutational signature with high TMB in head/neck cutaneous
    disease; convergence on PI3K/AKT/mTOR and RAS-MAPK signaling; rising
    incidence driven by secondary breast/chest-wall disease; poor overall
    prognosis; and immune checkpoint inhibitor activity concentrated in
    UV/radiation high-TMB subtypes.
  divergence: >-
    Divergence is coverage and recency rather than conflict. OpenScientist adds
    substantial breadth Falcon lacks: comprehensive survival statistics (SEER
    5-year OS 26.7%), a full diagnostic IHC panel (CD31/ERG/MYC), modern
    immunotherapy trials (CEMangio cemiplimab, cabozantinib+nivolumab), hepatic
    chemical-carcinogen etiologies (vinyl chloride, thorotrast, arsenic,
    aristolochic acid), germline predisposition (Li-Fraumeni/CHEK2/xeroderma
    pigmentosum), and an extensive canine hemangiosarcoma model section on which
    Falcon is entirely silent. The only numeric differences (MYC 91.8% breast vs
    100% secondary; 5-year survival ~33.5% cutaneous vs 26.7% overall) reflect
    different denominators, not contradictions.
  integration: >-
    The concordant mechanistic and genetic findings (endothelial/angiogenic core;
    MYC-amplified radiation-associated program; KDR/PIK3CA/PTPRB primary drivers;
    UV-hypermutation subtype; downstream PI3K-AKT-mTOR/MAPK convergence),
    epidemiology (rising secondary breast incidence), prognosis, and ICI activity
    are suitable for integration into kb/disorders/Angiosarcoma.yaml as curated
    pathophysiology, genetic, epidemiology, prognosis, and treatment content.
  not_integrated: >-
    The canine hemangiosarcoma comparative model is retained as a research lead
    rather than promoted as human disease content, since dismech section tags do
    not include a model-organism category. OpenScientist's investigational
    treatment leads (photodynamic therapy, anti-SFRP2, CDK4/6 inhibitors, vaccine
    approaches) similarly remain leads pending curated evidence verification.

notes: >-
  Cross-provider synthesis comparing falcon (pathophysiology-focused) and
  openscientist (comprehensive, 15-domain) deep-research reports on Angiosarcoma.
  No genuine contradictions were found; divergence is coverage/recency plus
  denominator-driven numeric differences. best_matching_text values are verbatim
  excerpts from the two report files. Literature evidence snippets were left to
  the main curation pipeline; only per-provider citations are retained here.

narrative:
  overview: >-
    Both providers frame BRAF-mutant papillary thyroid cancer as a molecularly
    defined subtype of differentiated thyroid carcinoma driven by the somatic BRAF
    V600E (c.1799T>A, p.Val600Glu) mutation, which constitutively activates the
    MAPK/ERK cascade, suppresses thyroid differentiation and NIS/SLC5A5, and drives
    radioiodine refractoriness. Falcon is a focused, mechanism- and
    RAIR/redifferentiation-centric report (~20-22 cited sources) while
    OpenScientist is a comprehensive 15-domain characterization (~80 sources) with
    deeper epidemiology, prognosis, immunotherapy, and multi-omic detail.
  agreement: >-
    The reports converge on the core biology and management: somatic BRAF V600E as
    the constitutive MAPK driver; MAPK-mediated suppression of differentiation
    genes and NIS causing RAI refractoriness; BRAF V600E + TERT promoter synergy as
    the high-risk molecular subset; BRAF/MEK-inhibitor redifferentiation
    (dabrafenib-trametinib) restoring iodine uptake; lenvatinib/sorafenib
    first-line and cabozantinib later-line multikinase therapy for RAIR-DTC; and
    subtype enrichment of BRAF V600E in classic and tall-cell PTC. Notably both
    independently cite the same 2025 Brumfield cohort (78.7% prevalence; 88%
    classic, 100% tall cell, 38% follicular), and both temper BRAF's stand-alone
    prognostic value.
  divergence: >-
    Coverage and recency differ more than substance. OpenScientist adds
    quantitative epidemiology (GBD trends, ~25% global overdiagnosis), a formal
    excellent-prognosis frame (10-year DSS ~97.2%), active-surveillance safety
    data, single-cell immune-trajectory and resistance biology (TAZ/Hippo, fatty-
    acid-oxidation epigenetic reprogramming, RAS feedback), and quantitative
    immunotherapy efficacy in BRAF V600E ATC (ORR 61.1%). Falcon contributes a
    tighter mechanistic and RAIR/redifferentiation account, the BRAF V600E-TBX3-
    CXCR2-MDSC immunosuppression axis, SWI/SNF-loss chromatin resistance, SEER
    incidence-trend inflection points aligned with ATA guideline revisions, and a
    curated ClinicalTrials.gov trail. No direct contradictions were found; the ATC
    immunotherapy finding is the clearest divergence (OpenScientist quantifies the
    clinical benefit; Falcon supplies only the immune-microenvironment rationale).
  integration: >-
    Promotable to kb/disorders/BRAF_Mutant_Thyroid_Cancer.yaml: the BRAF V600E
    constitutive-MAPK driver node; the MAPK -> differentiation-gene/NIS suppression
    -> RAI-refractoriness chain; BRAF+TERT synergy as an adverse genetic/prognostic
    modifier; BRAF/MEK-inhibitor redifferentiation and multikinase-inhibitor
    treatments; the subtype-enrichment/prevalence epidemiology; and the
    excellent-overall-prognosis-with-limited-independent-BRAF-value framing.
  not_integrated: >-
    Retained as leads rather than promoted mechanisms: the BRAF V600E ATC
    immunotherapy efficacy (advanced/ATC-specific, single-source quantitation),
    preclinical resistance pathways (TAZ/Hippo, FAO epigenetic reprogramming, RAS
    feedback, SWI/SNF loss), single-cell/spatial multi-omic trajectories,
    overdiagnosis and active-surveillance epidemiology, and specific
    ClinicalTrials.gov entries — all pending primary-source verification before
    becoming curated evidence.


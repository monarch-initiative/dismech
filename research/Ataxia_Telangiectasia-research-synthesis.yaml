narrative:
  overview: >-
    Both providers frame ataxia-telangiectasia as an autosomal recessive,
    multisystem genomic-instability disorder caused by biallelic loss-of-function
    ATM variants, with the ATM serine/threonine kinase at the center of the
    DNA double-strand break response. From that shared molecular anchor they build
    the recognizable clinical picture: progressive cerebellar ataxia,
    oculocutaneous telangiectasia, combined immunodeficiency with recurrent
    sinopulmonary infection, marked radiosensitivity, and a high malignancy risk.
  agreement: >-
    The reports converge strongly on the core biology and clinical course: ATM as
    the causal DSB-response kinase; microglial/cGAS-STING neuroinflammation as a
    driver of cerebellar neurodegeneration; combined humoral/cellular
    immunodeficiency with class-switch defects; hematologic-predominant cancer
    predisposition; the imperative to avoid ionizing radiation; and a life-limiting
    prognosis in which cancer and respiratory infections are the leading causes of
    death. Notably, the survival figures agree despite coming from different cohorts
    (French ~53.4% vs Latin American ~52.6% 20-year survival), and both independently
    surface encapsulated/intra-erythrocyte dexamethasone as a leading emerging therapy.
  divergence: >-
    OpenScientist is the more comprehensive and quantitative report, contributing the
    residual-kinase-activity genotype-phenotype continuum (classical null vs variant
    hypomorphic disease), a 56-fold quantified cancer SIR, detailed mechanistic
    substrate and pathway lists, and cross-species/model-organism coverage. Falcon is
    leaner and cohort/trial-anchored, drawing on a 2024 Latin American registry and
    ClinicalTrials.gov records; it does not address the genotype-phenotype
    severity continuum (silent) and gives cancer risk only as a qualitative range
    rather than a relative risk. No genuine contradictions were found — divergence is
    coverage and quantification, not conflict.
  integration: >-
    The harmonized ATM-kinase/DSB mechanism, microglial cGAS-STING neuroinflammation,
    class-switch immunodeficiency, radiosensitivity-avoidance, hematologic cancer
    predisposition, and cancer/respiratory-infection mortality findings are strong,
    doubly-supported claims suitable for promotion into the disorder YAML's
    pathophysiology, phenotype, genetic, and prognosis sections. The
    residual-kinase genotype-phenotype continuum (OpenScientist-only but from the
    definitive study) is also promotable as a genetic/prognostic anchor.
  not_integrated: >-
    The emerging encapsulated-corticosteroid therapies and other investigational
    agents (triheptanoin, NAD+ boosting, N-acetyl-L-leucine, mutation-specific ASO)
    are retained as research leads pending abstract-verified evidence rather than
    promoted as curated treatment mechanisms.


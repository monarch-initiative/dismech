narrative:
  overview: >-
    This is a single-provider synthesis by necessity rather than by design. Of
    three providers attempted, only claude_code produced usable output. Its
    mechanistic account of Mitchell-Riley syndrome is accurate and well
    structured, and it correctly separates the two arms of RFX6 biology — the
    endoderm-patterning/islet-developmental arm and the enteroendocrine arm with
    its congenital GLP-1 deficiency — which is the organizing insight the curated
    pathograph adopts.
  agreement: >-
    Not assessable. Cross-provider agreement requires at least two usable
    reports; falcon produced none and asta produced an off-topic one.
  divergence: >-
    Also not assessable in the intended sense. The only divergence worth
    recording is between the report and the primary literature it cites: the
    report's mechanistic conclusions were consistently reproducible against
    fetched abstracts, but its bibliographic layer was not. Two citation defects
    are recorded under the claude_code provider's identifier_issues, and the
    report's own closing section volunteers that several PMIDs were unverified.
    The practical lesson is that a report can be scientifically reliable and
    bibliographically unreliable at the same time, which is exactly the case the
    verify-every-identifier rule exists for.
  integration: >-
    Eight findings were promoted to kb/disorders/Mitchell-Riley_Syndrome.yaml,
    covering the RFX6 loss-of-function trigger, primitive-gut-tube endoderm
    patterning, the NEUROG3-downstream islet block, the pancreatic-endoderm
    specification failure, beta-cell insulin and calcium-channel maintenance, the
    enteroendocrine/GLP-1 arm, liraglutide, and the allelic series. Every one was
    re-anchored to an independently fetched abstract; no evidence snippet was
    taken from the report text.
  not_integrated: >-
    Three findings were retained as leads: the Finnish founder allele, which
    belongs to the heterozygous MODY entity rather than to this syndrome;
    exocrine pancreatic insufficiency, which is plausible but uncited in the
    report and absent from the HPO annotation set; and the 3-of-4 cholestasis
    fraction with its liver-transplant detail, which is not in the cited
    abstract. The mouse enterochromaffin/serotonin expansion was integrated only
    as a HUMAN_MODEL_MISMATCH discussion, not as asserted human mechanism.

notes: >-
  Off-pattern in one respect: all 59 other syntheses in research/ compare two or
  more providers, and the ProviderReport class was designed around that. This one
  declares three providers of which two produced nothing usable, so the
  agreement/divergence narrative slots are largely empty by circumstance. It is
  recorded anyway because the provenance is worth keeping — a later reader
  should be able to see that falcon was attempted and failed on credit, not that
  it was never tried.

  The run_status, status_detail, nec_preflight_verdict, nec_preflight_detail and
  identifier_issues slots used here were added to the research_synthesis schema
  in the same change that created this file; this synthesis is their first
  worked example.

narrative:
  overview: >-
    Both providers characterize bejel (endemic syphilis) as a chronic
    non-venereal treponematosis caused by Treponema pallidum subsp. endemicum
    (TEN), one of the three endemic treponematoses, classically acquired in
    childhood in hot arid regions and treated with benzathine penicillin G. Both
    foreground the modern paradigm shift: molecularly confirmed, sexually
    transmitted TEN in MSM that is clinically indistinguishable from venereal
    syphilis and invisible to standard serology.
  agreement: >-
    The reports converge on the causative agent and non-venereal childhood
    epidemiology; the near-identity (>99%) of the ~1.14 Mbp TEN genome to the
    other pathogenic subspecies; the primary/secondary/tertiary staged clinical
    course with oral mucosal, osteoperiosteal, and destructive gummatous
    (gangosa) manifestations; the emergence of sexually transmitted TEN in MSM
    (both cite ~12% of typed MSM syphilis samples in Japan); the diagnostic
    limitation that serology cannot distinguish subspecies (requiring MLST of
    TP0136/TP0548/TP0705); TprK-mediated antigenic variation/immune evasion;
    benzathine penicillin G as first-line with no penicillin resistance; the
    A2058G macrolide-resistance threat; and a favorable prognosis with early
    treatment despite irreversible untreated tertiary destruction.
  divergence: >-
    OpenScientist is substantially more comprehensive (69 publications
    synthesized), supplying formal identifiers (MONDO:0001714, ICD-10 A65,
    ICD-11 1A62), a detailed molecular-immunology cascade (TprK →
    TLR2/JAK1/STAT1/IDO macrophage polarization; CD4/CD8 responses),
    experimental therapeutics (linezolid), an LSH-hamster congenital-transmission
    model, and non-human-primate (baboon) reservoir data. Falcon adds the Ghana
    lesion-differential study (serology-PCR discordance; H. ducreyi/HSV) and
    quantitative historical WHO burden/campaign figures. The one genuine
    scientific divergence is the nearest-relative framing of TEN: Falcon
    emphasizes ~99.7% identity to TPA, whereas OpenScientist places TEN
    phylogenetically closest to yaws-causing TPE — not a contradiction, since
    both agree the subspecies are near-identical. Quantitative differences
    (e.g., tertiary-disease fraction ~10% vs ~10-15%) are minor.
  integration: >-
    Promotable to kb/disorders/Bejel.yaml: the TEN etiology and non-venereal
    childhood epidemiology; the staged pathophysiology/phenotype nodes (primary
    mucosal, secondary mucocutaneous/osteoperiosteal, tertiary gummatous
    gangosa); the emerging sexually transmitted TEN/MSM epidemiology; the
    serology-cannot-distinguish-subspecies diagnostic limitation with MLST
    typing; TprK antigenic-variation immune evasion; benzathine penicillin G
    first-line with no penicillin resistance; the A2058G macrolide-resistance
    caveat; and the rarely-fatal-but-disfiguring prognosis.
  not_integrated: >-
    Retained as leads pending source verification: the detailed
    TLR2/JAK1/STAT1/IDO immune cascade, experimental linezolid, the hamster
    congenital model and non-human-primate reservoir biology, pre-Columbian
    paleogenomics, and the Ghana lesion-differential statistics — richer than
    the core curated mechanism set and best confirmed against primary abstracts
    before promotion.


narrative:
  overview: >-
    Both providers frame BRAF V600E-mutant NSCLC as a rare (~1-2% of NSCLC),
    molecularly defined, actionable lung adenocarcinoma subtype in which a somatic
    class I BRAF mutation constitutively activates the MAPK pathway independent of
    upstream RAS, with combined BRAF plus MEK inhibition as the central targeted
    treatment strategy. Falcon is treatment-landscape and pathophysiology focused;
    OpenScientist is broader and more recent, spanning epidemiology, diagnostics,
    prognosis, resistance, comorbidity, and model organisms.
  agreement: >-
    The reports agree on the core driver biology (constitutive, RAS-independent
    class I BRAF/MAPK signaling), the ~1-2% NSCLC frequency with V600E as roughly
    half of BRAF mutations, adenocarcinoma predominance and never-smoker enrichment,
    the two approved BRAF/MEK combinations (dabrafenib+trametinib and
    encorafenib+binimetinib/PHAROS) with ORRs around 63-75%, MAPK-reactivation and
    bypass signaling as the dominant resistance routes, the requirement for broad
    molecular profiling, and GEMM recapitulation of MAPK-driven lung adenocarcinoma.
  divergence: >-
    Divergence is largely coverage and recency rather than contradiction.
    OpenScientist adds the mature PHAROS survival readout (median OS 47.6 months,
    4-year OS 49%) and a MAIC suggesting encorafenib+binimetinib may outperform
    dabrafenib+trametinib, quantifies the demographic profile and PD-L1 positivity
    (~78% ≥1%), and uniquely reports the high thromboembolism risk (43% 1-year
    incidence), co-mutation prognostic effects, ctDNA diagnostics, and NKX2-1-loss
    lineage transformation. Falcon predates the mature PHAROS follow-up (recording
    PFS/OS as not estimable), is more cautious on immunotherapy (retrospective
    evidence "mixed"), and gives a lower adenocarcinoma fraction (>85% vs >95%);
    these are quantitative/recency differences, not conflicts.
  integration: >-
    Integrated into kb/disorders/BRAF_V600E_Mutant_NSCLC.yaml: the overview and
    treatment section include encorafenib plus binimetinib as a PHAROS-supported
    BRAF/MEK option; the resistance node was expanded to MAPK reactivation, bypass
    PI3K-AKT-MET signaling, histologic transformation, and acquired BRAF V600E after
    EGFR-TKI therapy; a BRAF HGNC gene annotation was added; and reference provenance
    for both providers was backfilled.
  not_integrated: >-
    Treatment-ranking claims from the indirect (MAIC) comparison, detailed
    thromboembolism management, the PD-L1/immunotherapy sequencing context, and
    proposed adjuvant/sequencing trials were retained as research leads rather than
    promoted to curated disease mechanisms.

notes: >-
  Cross-provider synthesis comparing falcon (treatment/pathophysiology focused) and
  openscientist (comprehensive, 15-domain) deep-research reports for BRAF
  V600E-mutant NSCLC. No direct contradictions were found; divergence is coverage
  and recency (mature PHAROS survival, thromboembolism, PD-L1/immunotherapy,
  co-mutations, ctDNA) plus minor quantitative differences (adenocarcinoma >85% vs
  >95%). best_matching_text values are verbatim excerpts from the cited report

narrative:
  overview: >-
    Both providers frame alveolar rhabdomyosarcoma as an aggressive, predominantly
    pediatric soft tissue sarcoma defined molecularly by PAX3-FOXO1 / PAX7-FOXO1
    fusion oncogenes, with the fusion transcription factor's super-enhancer-driven
    transcriptional program, fusion status as the dominant prognostic biomarker,
    multimodal chemotherapy/surgery/radiation care, and poor metastatic outcomes
    as the core curated concepts. Falcon is the more mechanism-/2023-2024-
    translational-focused report; OpenScientist is broader and more clinically
    quantitative.
  agreement: >-
    Both agree that ~80% of ARMS is fusion-positive (PAX3/7-FOXO1), that the
    fusion acts as an aberrant transcription factor activating super-enhancers /
    a core-regulatory network (an epigenetic addiction and therapeutic
    vulnerability), that fusion status is a key prognostic biomarker with worse
    outcomes in fusion-positive disease, that ARMS is a rare pediatric sarcoma,
    that standard care is risk-stratified multimodal chemotherapy plus local
    control, and that metastatic/high-risk disease has a poor prognosis.
  divergence: >-
    OpenScientist adds the near-universal RTK/RAS/PIK3CA axis alteration (93% of
    RMS) and its FGFR4-directed therapy framework, the precise PAX3-FOXO1-worse-
    than-PAX7-FOXO1 prognostic gradient, exact metastatic survival statistics
    (INSTRuCT 5-year OS 32%, post-relapse 3-year OS 8%), maintenance chemotherapy,
    CAR-T immunotherapy, and detailed site-specific prognosis and diagnostics.
    Falcon contributes the ctDNA prognostic biomarker, the single-cell RMS cell-
    state atlas, KDM3B-inhibitor epigenetic drug discovery, and — the one genuine
    conflict — a non-myogenic (endothelial progenitor) cell-of-origin model that
    contradicts OpenScientist's skeletal-muscle-progenitor origin. Quantitative
    framing differences on epidemiology and survival are complementary rather
    than contradictory.
  integration: >-
    Promote into kb/disorders/Alveolar_Rhabdomyosarcoma.yaml the fusion-driver
    biology (~80% PAX3/7-FOXO1), the constitutively active fusion transcription
    factor blocking myogenic differentiation while driving proliferation, the
    super-enhancer / core-regulatory transcriptional addiction as a therapeutic
    vulnerability, fusion status (PAX3-FOXO1 worse than PAX7-FOXO1) as the leading
    prognostic biomarker, pediatric epidemiology, multimodal standard of care,
    and the poor metastatic/relapse prognosis.
  not_integrated: >-
    The RTK/RAS/PIK3CA 93%-axis / FGFR4-directed therapy framework and the
    non-myogenic cell-of-origin question are retained as research leads: the
    former is single-provider (OpenScientist only), and the latter is an
    unresolved provider conflict requiring primary-literature adjudication before
    a curated cell-of-origin claim is made. Investigational agents (HDAC/KDM
    inhibitors, CAR-T/CAR-NK, ctDNA monitoring) remain leads pending PMID/abstract
    verification.


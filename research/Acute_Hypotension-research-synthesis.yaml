narrative:
  overview: >-
    Both providers frame acute hypotension not as a single disease but as a
    final common hemodynamic phenotype — a syndrome of inadequate tissue
    perfusion arising from distributive, cardiogenic, hypovolemic, and
    obstructive mechanisms. Falcon (Edison Scientific Literature) is threshold-
    and setting-oriented, anchored in 2023-2024 ICU/perioperative/peri-intubation
    literature and the unresolved problem of defining hypotension. OpenScientist
    is comprehensive and mechanism-rich, adding a molecular pathophysiology layer,
    a full diagnostics/treatment/model-organism survey, and disease-coding
    identifiers.
  agreement: >-
    The reports converge strongly on the core clinical picture: the four-mechanism
    hemodynamic classification, the absence of a single accepted definition with
    MAP <65 mmHg as the dominant threshold, hypotension as an independent
    severity/duration-dependent predictor of mortality and organ injury,
    norepinephrine as the first-line vasopressor targeting MAP ~65 mmHg, the value
    of early/preemptive vasopressor initiation, the non-monogenic (modulatory)
    role of genetics, and the high frequency of procedural/perioperative
    hypotension.
  divergence: >-
    Divergence is coverage/emphasis, not conflict. OpenScientist uniquely develops
    the iNOS/NO molecular mechanism of septic vasodilation (with the paradoxically
    protective HO-1/CO arm), which Falcon does not name. On prognosis the two
    report different effect sizes (Falcon's ICU mortality OR 1.45 vs
    OpenScientist's postoperative OR 2.51) because they draw on different
    populations — a quantitative difference, not a contradiction. On hemorrhagic
    shock they support the same lower-BP resuscitation theme through different
    interventions (OpenScientist: permissive hypotension; Falcon: early low-dose
    norepinephrine within a hypotensive MAP 65-75 target).
  integration: >-
    Integrated into the disorder entry: the syndrome-level four-mechanism framing,
    the definitional heterogeneity and MAP <65 mmHg threshold, the outcome/
    prognosis associations, first-line norepinephrine with a MAP ~65 mmHg target,
    the non-monogenic genetic characterization, and the epidemiologic prominence
    of intraoperative/peri-intubation hypotension.
  not_integrated: >-
    Retained as research leads rather than promoted: the detailed iNOS/NO (and
    HO-1/CO) septic-vasodilation molecular cascade, the early/preemptive
    prophylactic-norepinephrine evidence, and the permissive-hypotension
    hemorrhagic-shock strategy — all well-sourced but pending fetch-reference
    verification of the underlying PMIDs/DOIs before promotion to curated
    mechanisms and treatments.


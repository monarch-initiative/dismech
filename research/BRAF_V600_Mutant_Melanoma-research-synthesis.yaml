narrative:
  overview: >-
    Both providers frame BRAF V600 mutant melanoma as a MAPK-driven cutaneous melanoma
    subtype centered on constitutive, RAS-independent BRAF kinase activation, melanocyte
    proliferation, and high responsiveness to combined BRAF plus MEK inhibition, with
    acquired resistance and brain metastasis as the dominant clinical challenges.
  agreement: >-
    The two reports agree on the core driver biology (activating codon-600 BRAF
    mutation, V600E dominant, constitutive MAPK/ERK signaling), the several-hundred-fold
    kinase hyperactivation, the etiologic enrichment for younger patients and
    intermittent UV exposure, the three approved BRAF/MEK inhibitor combinations with
    ~60-70% response rates, the multifactorial acquired resistance driven by MAPK
    reactivation and PI3K/AKT bypass, and the clinical prominence of brain metastasis.
  divergence: >-
    Falcon emphasized recent clinical-sequencing evidence — SECOMBIT 4-year survival and
    brain-metastasis-free-survival, NeoTrio neoadjuvant, and adjuvant D/T-vs-anti-PD-1
    data — and concluded immunotherapy-first is preferred for most patients.
    OpenScientist was broader and more mechanistic, uniquely developing the
    glycolysis/OXPHOS metabolic-reprogramming axis (MITF-PGC1-alpha suppression),
    precise V600 subtype percentages, ctDNA prognostics, and a detailed diagnostics/
    testing-methods survey. Quantitative differences (V600E ~70-88% vs 79%;
    brain metastases ~40-50% cumulative vs ~32% at presentation) are framing/coverage
    differences, not contradictions.
  integration: >-
    Promoted into kb/disorders/BRAF_V600_Mutant_Melanoma.yaml: the BRAF V600 driver and
    subtype entries (V600E/V600K/V600R/V600M), the constitutive-MAPK pathophysiology and
    phosphomimetic gene-function detail, the intermittent-UV/younger-age etiology, the
    approved BRAF/MEK inhibitor combinations, the acquired-resistance node (MAPK
    reactivation plus PI3K/AKT bypass), and brain metastasis as a prognostic phenotype.
  not_integrated: >-
    Retained as research leads pending focused curator review: the glycolysis/OXPHOS
    metabolic-reprogramming resistance axis (OpenScientist-only), and the detailed
    metastatic sequencing/SECOMBIT and neoadjuvant/adjuvant regimen comparisons, which
    need dedicated evidence curation before promotion to first-class disease assertions.

notes: >-
  Cross-provider synthesis comparing the falcon (clinical-trial and sequencing focused)

- statement: >-
    BRAF V600 mutant melanoma is a cutaneous melanoma subtype defined by an activating
    somatic missense mutation at BRAF codon 600 (most commonly V600E) that produces a
    RAS-independent, constitutively active BRAF kinase driving the RAS-RAF-MEK-ERK
    (MAPK) cascade; BRAF mutations occur in roughly 40-50% of cutaneous melanomas.

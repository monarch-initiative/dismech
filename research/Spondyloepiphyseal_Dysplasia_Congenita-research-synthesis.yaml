notes: >-
  Three provider reports compared: falcon (Edison, pathophysiology-focused, ER
  stress / UPR emphasis), asta (retrieval-only paper+snippet listing, broad SED
  spectrum), and perplexity (sonar-deep-research, comprehensive COL2A1 review).
  Strong tri-provider agreement on the COL2A1 autosomal-dominant etiology,
  glycine-substitution mutation class, core short-trunk/platyspondyly/epiphyseal
  plus extraskeletal phenotype, and (falcon/perplexity) the ~3.4 per million
  prevalence. The one genuine conflict is on ER-stress signaling: falcon
  foregrounds the Yammine human iPSC finding of ER procollagen storage WITHOUT a
  coupled canonical UPR in clinically relevant heterozygotes, whereas perplexity
  presents canonical UPR activation (largely R992C mouse data) as the central
  mechanism — recorded as a CONTRADICTORY stance and a LEAD pending curation.
  Asta is SILENT on the intracellular ER-stress / apoptosis / fibrillogenesis
  mechanism (retrieval did not surface the mouse/iPSC mechanistic papers) but
  contributes a distinctive SED-spectrum genetic-heterogeneity/differential frame.
  best_matching_text values are verbatim excerpts from the cited report files;
  the perplexity DDRGK1/UFMylation ER-homeostasis lead was noted but not carried
  as a separate harmonized finding. Literature evidence snippets are intentionally
  left for the disorder-YAML curation pipeline.

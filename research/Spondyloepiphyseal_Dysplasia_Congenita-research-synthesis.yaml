narrative:
  overview: >-
    All three providers converge on the same disorder identity: SEDC is an
    autosomal dominant type II collagenopathy caused by heterozygous COL2A1
    variants that disrupt the alpha-1(II) chain of hyaline-cartilage collagen.
    They differ sharply in method and depth. Falcon (Edison) is a focused
    pathophysiology synthesis built around the intracellular mechanism —
    misfolded procollagen-II, ER retention, and the ER-stress / UPR / apoptosis
    cascade — and it deliberately foregrounds a recent conceptual tension in that
    cascade. Perplexity (sonar-deep-research) is the most comprehensive: it walks
    the full arc from gene structure and mutation classes through cellular ER
    stress, growth-plate and endochondral-ossification failure, matrix biology,
    and the multisystem (skeletal, ocular, auditory, cervical-spine, respiratory)
    clinical course. Asta is retrieval-only — a ranked list of papers and
    snippets with no second-stage synthesis — so it frames SEDC mainly through
    the broader, genetically heterogeneous spondyloepiphyseal-dysplasia spectrum
    rather than through a single mechanistic narrative.
  agreement: >-
    The three reports agree strongly on the disease's genetic and clinical core.
    COL2A1 is the causal gene and inheritance is autosomal dominant (all three);
    glycine substitution within the Gly-X-Y triple-helical repeat is the
    predominant mutation class, which perplexity quantifies (~74%) and asta and
    falcon corroborate qualitatively. The clinical picture is consistent across
    providers: disproportionate short-trunk short stature, platyspondyly, and
    epiphyseal dysplasia, with frequent extraskeletal involvement (myopia,
    retinal detachment, sensorineural hearing loss, cleft palate). Falcon and
    perplexity additionally agree on the same rare-disease prevalence (~3.4 per
    million) and, at the mechanistic level, on ER retention of misfolded
    procollagen as the central cellular defect and on a defective, sparse,
    thin-fibril extracellular matrix.
  divergence: >-
    The genuine conflict is over ER-stress signaling. Falcon foregrounds the
    Yammine human iPSC-derived cartilage model of COL2A1 p.Gly1170Ser, which
    shows ER procollagen storage WITHOUT a coupled canonical UPR — and without
    increased apoptosis — in clinically relevant heterozygotes, and it explicitly
    argues that UPR readouts are not reliable proxies for collagen-misfolding
    burden. Perplexity, drawing largely on the R992C transgenic mouse, presents
    canonical UPR activation (IRE1a/PERK/ATF6, CHOP-driven apoptosis) as the
    central, established mechanism and does not acknowledge the storage-without-UPR
    result. These stances are recorded as CONTRADICTORY (falcon CONCORDANT vs.
    perplexity CONTRADICTORY on the reframing). Part of the tension is that the
    two lean on different model systems (iPSC heterozygote vs. mouse) and allele
    dosages. Beyond that conflict, divergence is mostly coverage: perplexity
    uniquely details the dominant-negative vs. haploinsufficiency dichotomy, the
    DDRGK1/UFMylation ER-homeostasis axis, and the late clinical course
    (early-onset osteoarthritis, ~40-year total hip arthroplasty, cervical
    myelopathy risk); falcon uniquely surfaces the iPSC "ER storage disorder"
    reframing; and asta uniquely maps the heterogeneous SED spectrum and its
    other causal genes (SEDL/TRAPPC2, TRPV4, MBTPS1, MGP) as a differential frame.
    Asta is otherwise SILENT on the intracellular mechanism, having not retrieved
    the mouse/iPSC mechanistic papers.
  integration: >-
    Promote the tri-provider consensus into the disorder YAML: the COL2A1
    autosomal-dominant type II collagenopathy etiology, the predominant
    glycine-substitution / dominant-negative mutation mechanism, the
    misfolded-procollagen ER-retention cellular defect, the ER-stress-linked
    chondrocyte apoptosis and growth-plate / endochondral-ossification failure
    (as a MODEL_ORGANISM-supported node, given its mouse basis), the defective
    sparse-fibril cartilage ECM, the short-trunk/platyspondyly/epiphyseal plus
    extraskeletal phenotype set, and the ~3.4 per million prevalence. These are
    well corroborated and ready for evidence-backed curation once the underlying
    PMIDs/DOIs are fetch-verified.
  not_integrated: >-
    Retain as leads rather than promoting outright: (1) the model-dependent UPR
    question — whether clinically relevant heterozygous SEDC involves canonical
    UPR activation (mouse) or ER storage without a coupled UPR (human iPSC) — is
    an unresolved human-model-fidelity tension best captured as a knowledge-gap /
    HUMAN_MODEL_MISMATCH lead rather than asserted as settled mechanism; and
    (2) perplexity's DDRGK1/UFMylation-stabilized IRE1a axis and its implied
    therapeutic angle, which is a single-provider mechanistic lead not yet
    corroborated here. Both should await primary-literature verification before
    entering the disorder YAML.


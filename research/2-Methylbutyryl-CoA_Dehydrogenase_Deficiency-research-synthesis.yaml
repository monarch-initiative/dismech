narrative:
  overview: >-
    Both providers frame 2-methylbutyryl-CoA dehydrogenase deficiency (SBCADD) as
    a rare autosomal recessive inborn error of L-isoleucine catabolism caused by
    biallelic ACADSB loss of function, detected largely through expanded newborn
    screening and clinically benign in the great majority of identified
    individuals. Falcon used a pathophysiology-focused prompt and is mechanism-first
    (isoleucine block, ACAD/ETF electron transfer, R-pathway compensation, founder
    genetics, biomarkers). OpenScientist used a broad disease-characteristics prompt
    and adds clinical breadth (etiology, diagnostics, prognosis, treatment,
    pharmacogenomics, model systems, and knowledge gaps).
  agreement: >-
    The reports converge on the core biology and clinical picture: the SBCAD/ACADSB
    enzymatic block in proximal isoleucine oxidation; the diagnostic triad of
    elevated C5-acylcarnitine, urinary 2-MBG, and 2-EHA; the isobaric-C5 limitation
    of MS/MS newborn screening; the ~10% symptomatic rate with neurological features
    against a mostly asymptomatic background; the c.1165A>G Hmong founder allele; the
    R-pathway safety-valve hypothesis; and valproate avoidance grounded in
    valproyl-CoA interaction with SBCAD.
  divergence: >-
    Divergence is coverage/depth rather than contradiction. OpenScientist uniquely
    contributes a second founder allele (c.303+3A>G in the Somali/Eritrean
    population), a quantitative valproyl-CoA competitive inhibition constant
    (Ki = 249 ± 29 μM), and an explicit in vitro oxidative-stress neurotoxicity
    mechanism (2-MBG lipid peroxidation and glutathione depletion) — the latter a
    point where Falcon explicitly notes the absence of a direct neurotoxic-mechanism
    experiment. The two reports also cite non-overlapping identifiers (Falcon reports
    MONDO_0012392; OpenScientist reports MONDO:0012411 and adds Orphanet ORPHA:79157),
    and report population-specific incidences from different cohorts (Falcon's
    Huaihua 1:7,137; OpenScientist's Quanzhou ~1:38,544) that reflect different
    screened populations rather than a genuine conflict.
  integration: >-
    Findings on the ACADSB/SBCAD lesion, the C5/2-MBG/2-EHA biomarker signature, the
    isobaric-C5 screening caveat, the ~10% symptomatic phenotype spectrum, the Hmong
    c.1165A>G founder allele, valproate avoidance, and the R-pathway safety valve are
    concordant across both providers and suitable for integration into the disorder
    YAML. The Somali/Eritrean second founder allele and the 2-MBG oxidative-stress
    mechanism are retained as leads pending primary-source verification.
  not_integrated: >-
    The Somali/Eritrean c.303+3A>G founder allele (single-provider) and the in vitro
    2-MBG oxidative-stress neurotoxicity mechanism (single-provider, in vitro only,
    with Falcon flagging the absence of direct mechanism) are held as research leads.
    Provider-specific epidemiological rates, the MONDO/Orphanet identifier
    discrepancies, and speculative therapeutic directions (antioxidants, riboflavin,
    gene therapy, animal-model gaps) were not promoted as curated disease mechanisms.


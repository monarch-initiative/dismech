narrative:
  overview: >-
    Both providers characterize anorexia nervosa as a severe, heritable
    metabo-psychiatric eating disorder defined by energy-intake restriction,
    fear of weight gain, and body-image disturbance, with adolescent onset, the
    highest mortality of any psychiatric illness, pervasive starvation-driven
    endocrine adaptation, and family-based treatment as the mainstay. Falcon
    (Edison Scientific Literature) is a focused 2023-2024 evidence sweep;
    OpenScientist is a broader synthesis of 89 publications spanning genetics,
    neurobiology, outcomes, and therapeutics.
  agreement: >-
    The reports converge strongly on the core clinical definition, polygenic
    non-monogenic (metabo-psychiatric) genetic architecture with ~50-74% twin
    heritability, the highest-of-any-psychiatric-disorder mortality (SMR ~5.2-5.5),
    the starvation-adaptation endocrine signature (suppressed leptin, elevated
    ghrelin, GH resistance with low IGF-1, hypothalamic-pituitary dysfunction),
    gut-microbiome and immune/cytokine dysregulation via the gut-brain axis,
    cardiovascular and multi-organ complications, and FBT (adolescents) / CBT
    (adults) as first-line care with incomplete remission and no disorder-specific
    approved pharmacotherapy.
  divergence: >-
    The main divergences are coverage and quantitative anchoring rather than
    conflict. On GWAS genetics, OpenScientist anchors on the stringent 2019
    PGC-ED GWAS (eight genome-wide-significant loci), whereas Falcon anchors on a
    2023 conditional-FDR cross-trait analysis calling 58 loci. On the brain,
    OpenScientist adds the ENIGMA structural finding (largest cortical/gray-matter
    deficits of any psychiatric disorder, Cohen's d up to 0.95, only partially
    reversible), while Falcon reports only altered resting-state functional
    connectivity. OpenScientist provides deeper genetic (candidate genes FOXP1,
    CADM1, BDNF, HTR2A), neuroimaging, activity-based-anorexia model, and
    prognostic detail; Falcon provides sharper quantitative cardiovascular-cohort
    risk (MACE) and adolescent cytokine data. Minor numeric differences (SMR 5.21
    vs 5.52; heritability 50-60% vs 48-74%) are compatible, not contradictory.
  integration: >-
    Concepts promoted to kb/disorders/Anorexia_Nervosa.yaml align with the
    existing pathophysiology anchors (polygenic metabo-psychiatric liability,
    appetite/restrictive-eating circuit dysregulation, starvation-adaptation
    endocrine response, immune and microbiome-associated dysregulation,
    cardiovascular complication risk) and phenotype anchors (abnormal eating
    behavior, low body weight, bradycardia, amenorrhea): the core definition,
    polygenic/heritable liability, endocrine biomarker signature, microbiome/immune
    dysregulation, cardiovascular complications, highest-mortality prognosis, and
    FBT-first-line treatment.
  not_integrated: >-
    Retained as research leads rather than promoted: the specific competing GWAS
    locus counts (8 vs 58) pending reconciliation of the underlying analyses, and
    the ENIGMA brain structural-deficit magnitude, which is not yet an existing
    pathophysiology/phenotype node. Candidate-gene detail, activity-based-anorexia
    model findings, epigenetic (EWAS) leads, and investigational agents
    (GLP-1 receptor agonists, bone-targeted teriparatide/romosozumab, neuromodulation
    trials) remain leads for future curation.

notes: >-
  Cross-provider synthesis comparing the falcon (focused 2023-2024 sweep, 39
  citations) and openscientist (comprehensive, 71 citations) reports. No direct
  contradictions were found; divergence is coverage, recency, and quantitative
  anchoring (GWAS locus counts; brain structural vs functional emphasis; SMR and
  heritability ranges). best_matching_text values are verbatim excerpts from the
  cited report files; the legacy prose roll-up
  (Anorexia_Nervosa-research-synthesis.md) informed the narrative only.

narrative:
  overview: >-
    Both providers frame adenylosuccinate lyase deficiency as an ultra-rare
    autosomal recessive inborn error of purine metabolism caused by biallelic ADSL
    variants, in which loss of a bifunctional enzyme acting at two non-sequential
    steps of de novo purine synthesis and the purine nucleotide cycle leads to
    accumulation of the succinylpurines SAICAr and S-Ado and a predominantly
    neurological, early-onset phenotype (developmental delay, epilepsy, hypotonia,
    autistic features).
  agreement: >-
    The reports strongly converge on the core biology: the bifunctional enzyme
    mechanism, SAICAr/S-Ado accumulation as the diagnostic biochemical hallmark,
    SAICAr as the more neurotoxic species, the three-tier phenotypic spectrum
    (fatal neonatal, type I, type II), and the recurrent variants p.R426H, p.Y114H
    and p.D430N with the same patient counts. Both independently report the 81.8%
    epilepsy frequency from the 2024/2023 cohort appraisal, agree that severity
    tracks residual enzyme activity, and agree there is no curative therapy.
  divergence: >-
    Divergence is one of coverage and recency rather than contradiction.
    OpenScientist is broader and more current, contributing the emerging
    secondary-mitochondrial-disease framing (fragmentation, impaired respiration,
    ERK2/AKT suppression) and the alternative-complement-pathway neuroinflammation
    hypothesis, plus the published Phase II allopurinol outcomes and the
    residual-activity-plus-protein-stability genotype-phenotype rule. Falcon,
    pathophysiology-focused, instead foregrounds the 2023 C. elegans adsl-1
    tyramine-signaling mechanism (silent in OpenScientist) and treats the
    allopurinol efficacy publication as provisional/unretrievable.
  integration: >-
    Promote the shared, well-supported concepts into the disorder YAML: the
    bifunctional ADSL mechanism and dual purine synthesis / nucleotide-cycle role,
    SAICAr/S-Ado accumulation and diagnostic biomarker use, SAICAr neurotoxicity,
    the neurological phenotype with 81.8% epilepsy and first-year onset, the
    three-tier spectrum, the recurrent ADSL variants, the residual-activity
    severity correlation, and supportive management with allopurinol as a
    repurposing lead.
  not_integrated: >-
    Retain as research leads pending primary-literature verification: the secondary
    mitochondrial dysfunction / ERK2-AKT axis, the alternative-complement
    neuroinflammation hypothesis, and the C. elegans tyramine-signaling mechanism.
    These are single-provider, recent, and model-based, and should be confirmed
    against their cited abstracts before promotion to curated disease mechanisms.


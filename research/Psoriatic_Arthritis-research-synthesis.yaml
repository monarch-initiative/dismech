notes: >-
  Cross-provider synthesis of three independent PsA deep-research reports: falcon
  (mechanism/pathophysiology-focused, IL-23/IL-17 + enthesitis + genetics), asta
  (retrieval-only snippet corpus, strong on histopathology, cytokine profiling,
  and cardiometabolic comorbidity), and perplexity (broad, deeply detailed
  mechanism and phenotype coverage). Providers were concordant on the core
  mechanistic backbone (IL-23/IL-17 axis, enthesitis, bone-remodeling paradox,
  HLA/IL-23-pathway genetics, JAK/STAT hub, TNF). Divergence is coverage-driven,
  not contradictory: falcon is silent on the ~30% psoriasis-to-PsA epidemiology
  and on cardiometabolic comorbidity (asta's strength), while asta's retrieval-only
  snippets support mechanisms only partially. No direct contradictions were found.
  best_matching_text values are verbatim excerpts from the cited report files;
  falcon quotes preserve its non-breaking hyphen characters.

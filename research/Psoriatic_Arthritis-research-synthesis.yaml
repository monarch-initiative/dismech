narrative:
  overview: >-
    All three providers frame psoriatic arthritis as a complex, immune-mediated
    inflammatory musculoskeletal disease of psoriatic disease, converging on a
    genetic-susceptibility-plus-environmental-trigger model in which dysregulated
    innate and adaptive immunity target the synovium, the enthesis, the skin, and
    bone. Falcon and perplexity both used the mechanism-focused pathophysiology
    template and produced narrative, mechanistic accounts; asta is a retrieval-only
    corpus dump whose 19 papers and 20 snippets supply supporting evidence rather
    than a synthesized argument. Falcon organizes the disease around an
    enthesis-initiated, cytokine-amplified process integrated through JAK/STAT
    signaling; perplexity is the broadest and most granular, walking through
    genetics, the IL-23/IL-17 axis, TNF, JAK/STAT, individual innate and adaptive
    cell populations, bone remodeling, the enthesis, metabolism, epigenetics,
    angiogenesis, and clinical phenotypes; asta's retrieved literature adds
    histopathology, cytokine profiling, and a strong cardiometabolic-comorbidity
    thread.
  agreement: >-
    The providers agree on the core mechanistic backbone. The IL-23/IL-17 axis is
    treated as the dominant/central inflammatory pathway, amplified by TNF, with
    Th17 and innate-like cells producing IL-17 that acts on stromal and skeletal
    cells. Enthesitis and the synovio-entheseal complex are recognized as a
    primary/initiating lesion driven in part by mechanical stress. The paradoxical
    bone phenotype — simultaneous osteoclast-driven erosion and new bone formation
    via RANKL and Wnt-antagonist (DKK1/sclerostin) modulation — is a shared,
    PsA-distinguishing feature. Genetic susceptibility is anchored in HLA class I /
    antigen processing (notably HLA-B27) plus non-MHC IL-23-pathway loci (IL23R,
    IL12B, TYK2). JAK/STAT is described as a cytokine convergence hub and validated
    drug target, and TNF-alpha as a central destructive driver and anti-TNF target.
  divergence: >-
    Divergence is coverage-driven, not contradictory — no direct conflicts were
    found. Falcon uniquely commits to the enthesitis-first (GRAPPA) framing and the
    JAK2/TYK2/STAT3 unifying-hub argument, and it is the only provider foregrounding
    the DKK1/SOST Wnt-antagonist bone axis by name, but it is silent on the ~30%
    psoriasis-to-PsA epidemiology and on comorbidity. Perplexity contributes by far
    the most detail and several elements the others omit entirely — CD8+
    tissue-resident memory T cells with shared skin/joint clones, metabolic
    reprogramming/glycolysis, epigenetics, angiogenesis, complement, Toll-like
    receptors, and quantified clinical phenotypes (oligo/polyarticular, dactylitis,
    axial). Asta's distinctive value is the retrieved evidence base: the ~30%
    conversion figure, the cardiometabolic comorbidity burden, and synovial
    histopathology (IL-17+ mast cells increased in PsA vs RA). As a retrieval-only
    provider, asta supports mechanistic claims only partially, earning mostly PARTIAL
    stances where falcon/perplexity are CONCORDANT.
  integration: >-
    The concordant mechanistic backbone is ready for promotion into the disorder
    YAML: the IL-23/IL-17 axis as the central pathway, enthesitis / synovio-entheseal
    complex as an initiating lesion, the RANKL-erosion / Wnt-DKK1/sclerostin
    new-bone paradox, HLA class I (HLA-B27) plus IL23R/IL12B/TYK2 genetics, the
    JAK/STAT convergence hub with JAK/TYK2 inhibitors, and TNF-alpha with anti-TNF
    therapy. The ~30% psoriasis-to-PsA epidemiology (perplexity + asta) is a clean,
    two-provider prevalence claim suitable for the prevalence/description block.
    Each promoted claim should be re-grounded on verified primary literature
    (fetch-reference on the underlying PMIDs/DOIs) before it enters kb/disorders.
  not_integrated: >-
    Two findings are retained as leads rather than promoted. The cardiometabolic
    comorbidity burden (finding 8) rests on a single provider (asta) and belongs in
    a comorbidity entry with its own verified evidence rather than in the core
    pathophysiology. The mast-cell finding (finding 9) — IL-17+ mast cells enriched
    in PsA synovium versus RA — is supported by asta and perplexity but is a
    finer-grained cellular claim best held as a lead pending confirmation of the
    synovial-biopsy evidence. Perplexity-only threads (CD8+ Trm skin-joint clonal
    sharing, glycolytic reprogramming, epigenetics, angiogenesis, complement, TLRs)
    were not elevated to harmonized findings and remain research leads.


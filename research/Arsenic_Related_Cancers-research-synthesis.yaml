narrative:
  overview: >-
    Both providers frame arsenic-related cancers as a spectrum of malignancies
    caused by chronic inorganic-arsenic exposure (chiefly via contaminated
    drinking water), classified as an IARC Group 1 carcinogen, with skin, lung,
    and bladder as the best-established sites and kidney and hepatobiliary/
    digestive sites emerging. Both treat the mechanism as a largely non-mutagenic
    convergence of oxidative stress, impaired DNA repair, chromosomal instability,
    and epigenetic reprogramming, gated by inter-individual differences in arsenic
    methylation. Falcon is a compact, mechanism- and epidemiology-focused report;
    OpenScientist is a broader, more heavily quantified report with detailed
    genetics, latency, and treatment coverage.
  agreement: >-
    The providers converge on the core biology: IARC Group 1 causal status; the
    established cancer sites; the non-mutagenic/epigenetic mechanism (SAM
    depletion, DNA methylation dysregulation, DDR inhibition, chromosomal
    instability); AS3MT (10q24.32) methylation-efficiency variation as the key
    susceptibility locus; arsenical skin lesions as early precursors of skin
    cancer; long latency with persistent post-cessation risk; and the
    effectiveness (but slow, decades-long payoff) of drinking-water mitigation.
  divergence: >-
    OpenScientist adds substantial depth Falcon lacks: specific AS3MT/MTHFR/GSTO
    variants with odds ratios, the quantified 40-year Chile mortality persistence
    (lung RR 3.38, bladder RR 4.79), the supra-additive arsenic-tobacco synergism
    (70-130% excess), chemoprevention (selenium, BEST trial), and the paradoxical
    therapeutic use of arsenic trioxide in acute promyelocytic leukemia — a topic
    on which Falcon is silent. Falcon uniquely tabulates site-specific
    dose-response risk estimates and intervention-technology performance. No
    genuine contradictions were found; divergences are of coverage, granularity,
    and framing (e.g., Falcon frames smoking synergism for urinary-tract cancer,
    OpenScientist for lung cancer).
  integration: >-
    The established mechanism, susceptibility, phenotype, latency, and prevention
    findings (findings 1-7 and 9) reinforce and can refresh the existing
    Arsenic_Related_Cancers pathophysiology and phenotype nodes (arsenic uptake
    and metabolism, oxidative stress/DNA damage, epigenetic dysregulation, impaired
    DNA repair, tumor-suppressor silencing, genomic instability; skin/lung/bladder
    cancer and arsenical keratosis/hyperpigmentation phenotypes), with
    OpenScientist supplying quantified AS3MT genetics, latency, and smoking
    synergism.
  not_integrated: >-
    The paradoxical arsenic-trioxide/APL therapeutic dual-role finding is retained
    as a research lead rather than promoted, since it concerns a distinct
    hematologic indication rather than the environmental solid-tumor
    pathophysiology that is the entry's scope. Detailed variant-level odds ratios,
    chemoprevention trial specifics, and animal-model details remain provider
    leads pending fetch-reference verification before promotion to curated
    evidence.


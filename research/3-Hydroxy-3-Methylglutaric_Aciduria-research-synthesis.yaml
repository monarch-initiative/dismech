- statement: >-
    HMGCLD is an autosomal recessive inborn error caused by biallelic loss-of-function
    variants in HMGCL, encoding mitochondrial 3-hydroxy-3-methylglutaryl-CoA lyase,
    which cleaves HMG-CoA to acetyl-CoA and acetoacetate — the terminal step shared
    by both ketogenesis and leucine catabolism.

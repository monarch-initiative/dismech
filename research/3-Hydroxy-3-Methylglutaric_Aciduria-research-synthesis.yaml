narrative:
  overview: >-
    Both providers characterize 3-hydroxy-3-methylglutaric aciduria (HMG-CoA lyase
    deficiency, HMGCLD) as an autosomal recessive inborn error of ketogenesis and
    leucine catabolism caused by biallelic HMGCL variants, in which loss of the shared
    terminal HMG-CoA lyase reaction drives energy failure and accumulation of toxic
    leucine-derived organic acids, presenting as fasting/illness-triggered metabolic
    crises. Falcon used the pathophysiology-focused prompt and is mechanism-first
    (causal chains, molecular players, mitochondrial injury, recent metabolite-toxicity
    chemistry); OpenScientist used the broad disease-characteristics prompt and adds
    clinical breadth across etiology, phenotype frequencies, genetics, diagnostics,
    prognosis, treatment, and model systems.
  agreement: >-
    The reports converge on the core biology: the HMGCL enzyme defect, the dual
    ketogenesis/leucine-catabolism block, ketogenesis failure and loss of the brain's
    alternative fuel, oxidative-stress-mediated brain and liver damage from the
    accumulating organic acids, the acute decompensation triad (hypoketotic
    hypoglycemia, metabolic acidosis, hyperammonemia) triggered by fasting/illness,
    the R41Q Saudi founder mutation in a consanguineous population, ~16% mortality,
    and preventive dietary management (protein/fat restriction, L-carnitine,
    fasting avoidance) with exogenous ketone (sodium D,L-3-hydroxybutyrate) adjunct.
  divergence: >-
    Divergence is coverage/emphasis rather than contradiction. Falcon uniquely carries
    the recent experimental mechanisms — HMG-driven respiratory-chain/TCA impairment
    and DRP1-mediated mitochondrial fission in neonatal rat brain, the acetyl-CoA-dependent
    (carglumate-responsive) urea-cycle mechanism for hyperammonemia, and the 2024
    non-enzymatic 3MGCylation protein-acylation hypothesis. OpenScientist uniquely
    provides breadth: full ontology-annotated phenotype frequencies, the 147-variant
    ClinVar spectrum, absence of genotype-phenotype correlation, newborn-screening
    performance (C5-OH PPV), differential diagnosis, and model-organism gaps. Purely
    quantitative discrepancies (neonatal onset ~42% vs ~50%; founder allele 77.41% of
    individuals vs 89% of alleles; normal development 62.6% vs ~50%) reflect different
    cohorts, not conflicting claims.
  integration: >-
    The concordant mechanistic backbone (dual metabolic block, ketogenesis/energy
    failure, organic-acid oxidative stress, the crisis triad, founder genetics,
    outcomes, and dietary/ketone management) is promoted into the disorder YAML.
    Falcon's mitochondrial-dysfunction and acyl-CoA/hyperammonemia mechanisms
    substantiate the pathophysiology nodes; OpenScientist's clinical/diagnostic/
    prognostic detail substantiates the phenotype, genetic, prognosis, and treatment
    surfaces. Provider-specific citation trails are preserved for curator review.
  not_integrated: >-
    Retained as research leads pending human-tissue validation or curator review: the
    2024 non-enzymatic 3MGCylation protein-acylation hypothesis (author-flagged as
    requiring target identification), the Sod2-mediated oxidative-stress positive-feedback
    model, contiguous-gene-deletion (HMGCLD+fucosidosis) and other rare single-case
    findings, and the newborn-screening cost-effectiveness/PPV statistics.


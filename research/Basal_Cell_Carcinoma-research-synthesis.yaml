    Basal cell carcinoma is driven in nearly all cases by constitutive activation
    of the Hedgehog (HH) signaling pathway — most often loss-of-function mutation
    of the SMO repressor PTCH1 or activating mutation of SMO — leading to
    downstream GLI transcription-factor activation and basal keratinocyte
    proliferation.

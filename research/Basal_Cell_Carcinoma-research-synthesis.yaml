narrative:
  overview: >-
    Both providers frame basal cell carcinoma as the most common human
    malignancy — an indolent, locally invasive keratinocyte cancer driven in
    nearly all cases by constitutive Hedgehog pathway activation (PTCH1
    loss-of-function or SMO gain-of-function → GLI transcription), triggered by
    chronic UV exposure on a background of genetic susceptibility, and managed by
    a tiered ladder from surgery to Hedgehog inhibitors to PD-1 blockade.
  agreement: >-
    Both identify Hedgehog pathway activation as the central mechanism, usually
    through PTCH1 loss of function or SMO activation followed by GLI
    transcriptional activation and basal-cell proliferation, and agree on the
    ~73% PTCH1 / ~10-20% SMO mutation frequencies. They agree UV radiation is the
    dominant environmental driver, that Gorlin syndrome is the hereditary
    proof-of-concept, that BCC is very rarely metastatic, and on the core
    therapeutic categories: excision/Mohs for localized disease, Hedgehog pathway
    inhibitors for locally advanced or metastatic disease, and cemiplimab (PD-1
    blockade) after Hedgehog inhibitor failure.
  divergence: >-
    Falcon emphasized guideline-facing clinical management: recurrence
    benchmarks, NCCN-style treatment placement, and systemic photoprotection /
    nicotinamide chemoprevention — but explicitly declined to extract HH-inhibitor
    objective response rates or a consistent epigenetic signature from its
    sources. OpenScientist was broader and more quantitative on efficacy
    (vismodegib ORR 65%, sonidegib up to 89%) and added pathway context
    (Wnt/beta-catenin, TP53, PI3K/AKT/mTOR), the immune microenvironment, epigenomic
    reprogramming, dermoscopy/RCM/AI-assisted diagnosis, and animal-model detail.
    The differences are coverage and quantification, not direct contradictions.
  integration: >-
    The core PTCH1/SMO/Hedgehog/GLI cascade, UV etiology, subtype phenotypes,
    Gorlin-syndrome germline genetics, cell-of-origin lineages, and the
    surgery/HHI/cemiplimab treatment ladder are all supported by both providers
    and align with kb/disorders/Basal_Cell_Carcinoma.yaml; the HH-inhibitor
    response-rate quantification is contributed mainly by OpenScientist.
  not_integrated: >-
    Nicotinamide chemoprevention was retained as a research lead rather than
    promoted, because the cited evidence is mixed and partly oriented toward
    broader non-melanoma skin cancer prevention. Detailed dermoscopy patterns, AI
    diagnostic tooling, and model-organism variants were likewise left in research
    provenance.

notes: >-
  Cross-provider synthesis comparing two independent reports: falcon
  (guideline/management-focused) and openscientist (comprehensive, 15-domain).
  No direct contradictions were found; divergence is coverage and quantification
  (OpenScientist quantifies HH-inhibitor response rates and epigenetic
  reprogramming that Falcon covers only qualitatively or declines to assert;
  Falcon covers nicotinamide chemoprevention that OpenScientist omits). All
  best_matching_text values are verbatim excerpts from the cited report files;
  literature evidence snippets were intentionally left to the main curation
  pipeline pending fetch-reference verification.

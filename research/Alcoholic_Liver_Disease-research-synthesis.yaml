notes: >-
  Cross-provider synthesis comparing falcon (Edison, comprehensive 15-section
  template) and openai (o3-deep-research, pathophysiology-focused template). The two
  reports are strongly concordant on core mechanism (ethanol metabolism/oxidative
  stress, gut-liver axis, stellate-cell fibrogenesis), the steatosis-to-HCC spectrum,

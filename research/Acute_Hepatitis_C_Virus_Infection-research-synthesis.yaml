narrative:
  overview: >-
    Both providers frame acute hepatitis C as the first ~6 months after HCV
    exposure — a largely asymptomatic, self-limited-or-persistent phase whose
    central question is spontaneous clearance versus progression to chronic
    infection. Falcon (Edison Scientific Literature) is guideline- and
    clinically-oriented, anchored on diagnostic windows, natural-history
    definitions, risk groups, and AASLD-IDSA treatment principles. OpenScientist
    (autonomous) is broader and more mechanistic, spanning viral entry, innate
    immune evasion, host genetics, DAA efficacy data, epidemiology, and model
    systems.
  agreement: >-
    The reports converge on the core clinical picture: the 6-month acute-phase
    definition and >6-month viremia criterion for chronicity; ~70-80% of acute
    infections being asymptomatic; roughly 50-70% progression to chronicity with
    ~30-50% spontaneous clearance; the favorable role of IFNL3/IL28B rs12979860
    CC and HLA class II alleles in clearance; the transformative near-cure
    efficacy of pan-genotypic DAAs (glecaprevir/pibrentasvir, sofosbuvir/
    velpatasvir) with short courses; the absence of any preventive vaccine as the
    key elimination barrier; and a global burden on the order of 1.5 million new
    infections per year.
  divergence: >-
    The two reports are complementary rather than contradictory. OpenScientist
    supplies molecular depth that Falcon omits entirely — the HCV entry-factor
    cascade and the NS3/4A protease cleavage of MAVS and TRIF as the innate-immune
    evasion mechanism, quantified clearance predictors (OR 14.22 for IL28B CC),
    detailed DAA SVR data, and model-organism systems. Falcon supplies guideline
    granularity OpenScientist only gestures at — the explicit test-and-treat
    principle (treat acute the same as chronic, do not wait for spontaneous
    clearance) and the recommendation against abbreviated 6-week regimens.
    Quantitative differences are minor (e.g., ~80% vs 70-80% asymptomatic; ~1.5
    million in 2019 vs 1.5-2 million per year) and reflect framing/source choice,
    not conflict.
  integration: >-
    The convergent, well-supported claims map directly onto the existing
    kb/disorders/Acute_Hepatitis_C_Virus_Infection.yaml entry: the acute-vs-chronic
    definition and natural-history bifurcation, the asymptomatic-majority
    phenotype, the IFNL3/IL28B clearance genetics, the NS3/4A innate-evasion
    pathophysiology node, DAA treatment with high SVR, the test-and-treat
    principle, and the no-vaccine prevention gap.
  not_integrated: >-
    Broader breadth-only material was retained as research leads rather than
    promoted: detailed global/regional epidemiology and incidence trends, model
    organism and cell-culture systems, extrahepatic/secondary organ involvement,
    special-population treatment nuances, and reinfection/access considerations.
    Provider-specific citation trails (no PMID/DOI overlap between the two
    reports) are preserved as prioritization cues for curator follow-up, not as
    conflicts.


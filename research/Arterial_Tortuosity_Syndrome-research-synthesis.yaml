narrative:
  overview: >-
    Both providers frame arterial tortuosity syndrome as an ultra-rare autosomal
    recessive connective tissue disorder caused by biallelic loss-of-function
    variants in SLC2A10/GLUT10, in which impaired intracellular ascorbate biology
    produces defective extracellular matrix assembly (fragmented elastic fibers,
    disorganized collagen) and the hallmark vascular phenotype of arterial
    tortuosity, elongation, stenosis, and variable aneurysm formation. Falcon is a
    concise cohort/case-series synthesis; OpenScientist is a comprehensive
    15-domain report with deeper molecular mechanism and model-organism coverage.
  agreement: >-
    The reports converge on the core genetics (biallelic SLC2A10/GLUT10,
    autosomal recessive, frequent consanguinity and the Arab p.Ser81Arg founder
    allele), the ascorbate/dehydroascorbic-acid transporter role of GLUT10, the
    ECM ultrastructural pathology (fragmented elastin core with peripheral
    microfibrils of random directionality), the widespread vascular phenotype
    including pulmonary artery stenosis, the ultra-rarity (~106 confirmed
    individuals, <1/1,000,000), the milder-than-historically-reported prognosis
    with infancy as the critical window and no documented dissections, and empiric
    beta-blockade plus surveillance as the mainstay of management.
  divergence: >-
    OpenScientist adds substantial mechanistic depth that Falcon lacks: the
    explicit "ascorbate compartmentalization disorder" framing, the non-canonical
    alphavbeta3-integrin/FAK/Src/p38-MAPK TGF-beta route, oxidative-stress and
    mitochondrial arms, and a detailed model-organism section anchored on the
    GULO species difference (mice protected by endogenous ascorbate synthesis;
    Gulo;Slc2a10 double knockout needed). Falcon treats the GLUT10-ascorbate link
    as a hypothesis and only briefly mentions a zebrafish morpholino model, so it
    is silent on the GULO amplification factor. The only quantitative divergence
    is minor and non-contradictory (identifier mapping — OpenScientist lists
    MONDO:0009005/ORPHA:3342 while the dismech entry uses MONDO:0008818), with no
    genuine conflicts between the two reports.
  integration: >-
    The concordant findings (SLC2A10/GLUT10 biallelic loss of function; ascorbate
    compartmentalization; ECM fragmentation; generalized arterial tortuosity with
    stenosis and variable aneurysm; ultra-rare epidemiology; milder prognosis with
    infancy as the critical window and no dissections; empiric beta-blockade) are
    suitable for promotion into the disorder YAML with the harmonized statements
    as anchors.
  not_integrated: >-
    The GULO species-difference / human-amplification model insight and the
    detailed non-canonical TGF-beta and mitochondrial mechanistic arms are
    retained as research leads pending model-system-versus-human validation, along
    with speculative therapeutic directions (ascorbate supplementation, gene
    therapy proof-of-concept).


- statement: >-
    Argininosuccinic aciduria is an autosomal recessive disorder of the enzyme
    argininosuccinate lyase (ASL), which cleaves argininosuccinate to arginine and
    fumarate; loss of ASL blocks the urea cycle, causing argininosuccinate
    accumulation, arginine deficiency, and hyperammonemia.
  sections: [pathophysiology, genetic_factor]
  curation_status: INTEGRATED
  provider_support:

- statement: >-
    ASL has a dual catalytic and structural role: beyond ureagenesis it scaffolds a
    multiprotein complex that channels arginine to nitric oxide synthase, so ASL
    loss produces a nitric-oxide deficiency causing endothelial dysfunction and a
    Mendelian form of endothelial-dependent hypertension.

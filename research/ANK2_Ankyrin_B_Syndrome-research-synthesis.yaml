- statement: >-
    ANK2 ankyrin-B syndrome is an autosomal dominant, incompletely penetrant,
    variably expressive inherited arrhythmia disorder caused by loss-of-function
    ANK2 variants; originally designated long QT syndrome type 4 (LQT4), it is now
    termed "ankyrin-B syndrome" because the phenotype extends well beyond QT
    prolongation to sinus node dysfunction, atrial fibrillation, and ventricular
    arrhythmias.

- statement: >-
    The core molecular defect is loss of ankyrin-B scaffold/adaptor function,
    which fails to target key cardiac ion transporters (Na/Ca exchanger NCX1,
    Na/K-ATPase, InsP3 receptor) to their membrane microdomains, producing
    intracellular Na+/Ca2+ dysregulation and SR calcium overload.

narrative:
  overview: >-
    Both providers frame ANK2 ankyrin-B syndrome (historically LQT4) as an
    autosomal dominant, incompletely penetrant, variably expressive inherited
    arrhythmia disorder caused by loss-of-function ANK2 variants that impair the
    ankyrin-B membrane-cytoskeleton scaffold in cardiomyocytes and sinoatrial node
    cells. The shared curated concepts are the ion-transporter-targeting mechanism,
    the multi-phenotype arrhythmia spectrum (sinus node dysfunction, atrial
    fibrillation, ventricular arrhythmias, sudden death), and the pervasive problem
    of variant interpretation.
  agreement: >-
    The reports converge on the core scaffold mechanism (loss of ankyrin-B
    mistargets NCX1, Na/K-ATPase, and InsP3R, driving intracellular Ca2+
    dysregulation and SR Ca2+ overload), on sinus node dysfunction as a core
    highly penetrant phenotype phenocopied by AnkB+/- mice, on atrial fibrillation
    arising from reduced atrial Cav1.3 with atrial action-potential shortening, on
    the Q1283H knock-in evidence that metoprolol/flecainide suppress
    stress-induced arrhythmias, and on the S646F founder variant in a high-LQTS
    First Nations population. Notably, both reach the same cautionary conclusion
    that many ANK2 variants are common and low-penetrance, though Falcon anchors
    this on the Giudicessi/Mayo referral reappraisal while OpenScientist anchors it
    on the ClinGen Channelopathy Expert Panel curation.
  divergence: >-
    Falcon (pathophysiology-focused) uniquely develops the ankyrin-B/beta-catenin
    arrhythmogenic-cardiomyopathy pathway and the preclinical GSK-3beta inhibitor
    SB-216763 rescue in Ank2 conditional-knockout mice, and adds granular
    device/ablation and 2023-2024 case-report management detail. OpenScientist
    (broader disease-characteristics scope) uniquely covers ankyrin-B extracardiac
    and neuronal biology (axon guidance, L1-CAM cAMP signaling, OTUD7A/15q13.3
    microdeletion), CaMKII-dependent RyR2 hyperphosphorylation as a therapeutic
    target, and a fuller differential-diagnosis, model-organism, and knowledge-gap
    inventory. No direct contradictions were found; divergence is coverage and
    emphasis rather than conflicting claims.
  integration: >-
    Integrated concepts (INTEGRATED findings): the LQT4-to-ankyrin-B-syndrome
    reclassification and autosomal-dominant loss-of-function etiology; the
    scaffold ion-transporter-targeting mechanism with Ca2+ dysregulation; sinus
    node dysfunction and Cav1.3-driven atrial fibrillation; the disputed/
    low-penetrance variant-interpretation caveat; beta-blocker/flecainide therapy
    from the Q1283H knock-in; and the S646F Gitxsan founder epidemiology.
  not_integrated: >-
    Retained as research leads rather than promoted: the ankyrin-B/beta-catenin
    arrhythmogenic-cardiomyopathy pathway and the preclinical SB-216763 targeted
    therapy (single-provider, preclinical only), and ankyrin-B's extracardiac and
    neuronal functions whose human clinical relevance is unestablished.


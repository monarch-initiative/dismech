narrative:
  overview: >-
    Both providers frame aortitis as a heterogeneous syndrome rather than a
    single etiology, spanning large-vessel vasculitis (GCA, Takayasu),
    clinically isolated surgical aortitis, infectious aortitis, IgG4-related
    aortitis/periaortitis, and G-CSF-associated drug-induced disease. The shared
    disease axis is aortic-wall inflammation driving remodeling with aneurysm,
    dissection, stenosis, occlusion, and the need for imaging-based surveillance.
  agreement: >-
    The reports converge on the umbrella-syndrome definition, the primacy of the
    large-vessel vasculitides and their HLA-driven polygenic susceptibility
    (HLA-DRB1*04 in GCA, HLA-B*52:01 in Takayasu), the dendritic-cell ->
    Th1/Th17 T-cell -> macrophage immune circuit, the convergent structural
    remodeling that yields aneurysm/dissection/stenosis, glucocorticoids plus
    steroid-sparing tocilizumab (GiACTA) as the treatment backbone, and G-CSF as
    a recognized drug cause with recurrence on rechallenge.
  divergence: >-
    Falcon emphasizes the surgical-pathology, imaging, and G-CSF case-review
    literature: it uniquely develops the Takayasu MLX-Q139R -> TXNIP -> NLRP3
    inflammasome mechanistic axis and frames prevalence through a
    surgical-histology cohort in which clinically isolated aortitis predominates
    (~75%). OpenScientist is broader and more recent on treatment and genetics:
    it names seven signaling pathways, reports GCA as ~76% of clinical-series
    cases, adds the positive phase III SELECT-GCA upadacitinib result, and links
    G-CSF aortitis to HLA-B*52. The apparent GCA-vs-CIA predominance mismatch is
    a sampling-frame difference (clinical series vs surgical histology), not a
    true contradiction.
  integration: >-
    Integrated into kb/disorders/Aortitis.yaml: the umbrella-syndrome framing and
    multi-etiology scope; HLA polygenic susceptibility; the GCA immunopathology
    and convergent structural-remodeling causal chain; glucocorticoid +
    tocilizumab treatment with GiACTA support; clinically isolated aortitis and
    its surveillance recommendations; and G-CSF drug-induced aortitis with the
    HLA-B*52 recurrence signal.
  not_integrated: >-
    Retained as leads rather than promoted: the Takayasu-specific MLX-Q139R/
    NLRP3 mechanistic axis, the upadacitinib/SELECT-GCA JAK-inhibitor evidence
    (a GCA-context therapy whose aortitis-specific remodeling endpoints remain
    uncertain), and the finer-grained biomarker and imaging-prognosis details.

notes: >-
  Cross-provider synthesis comparing two independent Aortitis deep-research

narrative:
  overview: >-
    Both providers model BRCA-mutant prostate cancer as a molecularly defined
    prostate cancer subset driven by BRCA1/BRCA2 homologous recombination repair
    deficiency, with BRCA2 the dominant and more clinically important driver.
    They agree HRR loss produces genomic instability and aggressive metastatic
    behavior while simultaneously creating therapeutic sensitivity to PARP
    inhibition and platinum chemotherapy through synthetic lethality.
  agreement: >-
    The two reports converge on the core driver biology (biallelic BRCA loss to
    HRD), BRCA2 predominance over BRCA1, the aggressive phenotype and worse
    survival of carriers, the synthetic-lethality rationale and large PARP
    inhibitor benefit in BRCA-mutant mCRPC (PROfound olaparib rPFS HR 0.22), the
    move to first-line PARP-inhibitor plus AR-pathway-inhibitor combinations, and
    IMPACT-informed early PSA screening of male carriers from age 40.
  divergence: >-
    Falcon emphasized clinical implementation and diagnostics: PROfound,
    MAGNITUDE, TALAPRO-2, the AR-PARP crosstalk rationale, tissue-versus-ctDNA
    testing concordance (with structural-variant blind spots), and MRI/PSA
    screening pathways. OpenScientist emphasized resistance biology and
    longitudinal disease behavior; its strongest unique contribution is the
    acquired-resistance section on BRCA reversion mutations (39-79% prevalence,
    POLQ-mediated microhomology repair) and serial ctDNA monitoring, a topic on
    which Falcon is entirely silent. On the AR-PARP combination, OpenScientist
    documents the clinical practice but not the molecular crosstalk mechanism
    that Falcon supplies. No direct contradictions were found; divergence is
    coverage and emphasis, plus a difference in epidemiologic lens (Falcon's
    BRCA-specific stage-stratified frequencies vs OpenScientist's broader ~20-30%
    HRR framing).
  integration: >-
    Promoted into kb/disorders/BRCA_Mutant_Prostate_Cancer.yaml: HGNC-backed
    gene_term annotations for BRCA1 and BRCA2; the HRD/synthetic-lethality
    mechanism; a PARP-Androgen Receptor co-dependency node capturing the AR-PARP
    crosstalk rationale for combination therapy; a BRCA reversion-mediated PARP
    resistance node; and a PARP-inhibitor/AR-pathway-inhibitor combination
    treatment with talazoparib, enzalutamide, niraparib, and abiraterone agents,
    with Falcon and OpenScientist citation trails recorded as provenance.
  not_integrated: >-
    Retained as research leads rather than promoted: detailed trial subgroup
    tables, exploratory POLQ-inhibitor strategies, full ctDNA/tissue monitoring
    protocols and structural-variant concordance metrics, broad HRR-gene
    epidemiology, and non-BRCA HRR genes. These are useful provenance, but the
    entry is BRCA-focused and should not become a general HRR-mutated prostate
    cancer entry.

notes: >-
  Cross-provider synthesis of two independent deep-research reports: falcon
  (clinical-implementation and diagnostics emphasis) and openscientist
  (resistance-biology and comprehensive emphasis). No direct contradictions were
  found; the principal divergence is coverage (openscientist adds BRCA reversion
  resistance that falcon omits) and one PARTIAL stance (openscientist documents
  PARP/ARPI combinations without the AR-PARP crosstalk mechanism). All
  best_matching_text values are verbatim excerpts from the cited report files;

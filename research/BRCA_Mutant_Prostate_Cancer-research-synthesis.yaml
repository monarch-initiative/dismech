- statement: >-
    BRCA-mutant prostate cancer is driven by loss of BRCA1/BRCA2 homologous
    recombination repair function (HRD), which creates the therapeutic
    vulnerability exploited by PARP inhibitors through synthetic lethality:
    PARP inhibition converts unrepaired single-strand breaks into double-strand
    breaks that HR-deficient cells cannot repair.
  sections: [pathophysiology, gene_function, treatment]
  curation_status: INTEGRATED

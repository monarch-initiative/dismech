notes: >-
  Cross-provider synthesis for Osteosarcoma comparing three independent deep-research
  reports: falcon (pathophysiology-focused, single-cell/genomics oriented), asta
  (retrieval-only literature snippets, no synthesis stage), and perplexity
  (comprehensive multi-domain narrative). The three converge strongly on the core
  pathophysiology (TP53/RB1 inactivation, genomic instability/chromothripsis,
  mesenchymal-osteogenic cell of origin, PI3K/AKT/mTOR signaling, EMT-driven lung
  metastasis, immunosuppressive TME). Divergence is coverage-driven rather than
  contradictory: falcon is silent on clinical prognosis/survival and does not name the
  standard MAP regimen; asta (snippet-only) supports genomic complexity and TAM
  plasticity only partially, lacking the chromothripsis and full immune-evasion detail
  the other two provide. No direct contradictions were found. best_matching_text values
  are verbatim excerpts from the cited report files; per-provider citations reflect the
  source each report leaned on and were not independently fetch-verified here.

narrative:
  overview: >-
    All three providers frame osteosarcoma as the most common primary malignant
    bone tumor of children, adolescents, and young adults, arising from the
    mesenchymal-osteogenic lineage and defined clinically by aggressive local
    growth and early hematogenous lung metastasis. Where they differ is in
    altitude and method: falcon reads as a mechanism-first synthesis anchored in
    2023-2024 single-cell and genomics literature (genomic catastrophe, signaling
    convergence, immunosuppressive microenvironment); perplexity is a broad
    multi-domain narrative that walks from genetics through signaling, metabolism,
    cell of origin, tumor microenvironment, staging, clinical presentation, and
    chemoresistance; and asta is retrieval-only, surfacing verbatim snippets from
    the primary literature without a second-stage synthesis. Read together they
    triangulate a consistent picture in which a structural-variant-dominated
    genome, hijacked developmental signaling, and an immune-evasive bone niche
    drive a chemoresistant, metastasis-prone malignancy.
  agreement: >-
    Convergence is strong on the core pathophysiology. All three name TP53 and
    RB1 inactivation as the central genetic drivers, place the cell of origin
    along the mesenchymal-osteogenic lineage under bone-microenvironment
    influence, implicate PI3K/AKT/mTOR signaling in proliferation and survival,
    and treat EMT as a key step toward invasion and lung metastasis. falcon and
    perplexity independently foreground chromothripsis/genomic instability and an
    immunosuppressive tumor microenvironment; asta corroborates the surrounding
    facts (most-common bone tumor, MSC/osteogenic origin, PI3K/Akt involvement,
    macrophage plasticity, stage-dependent survival) from independent primary
    sources. asta and perplexity agree closely on the multimodal standard of care
    and on the localized-versus-metastatic survival split.
  divergence: >-
    Divergence is coverage-driven rather than contradictory; no direct conflicts
    were found. falcon contributes the richest single-cell microenvironment detail
    (mregDCs, SPP1+ TAMs, MHC-I/B2M loss, PD-L1/CD24 evasion, post-chemotherapy
    remodeling) but is silent on five-year survival figures and does not name the
    standard MAP regimen. perplexity is uniquely comprehensive on genetics beyond
    TP53/RB1 (MDM2, MYC/CCNE1, ATRX, chromoanagenesis), on additional pathways
    (Wnt/beta-catenin-RUNX2, HIF-1alpha, VEGF/angiogenesis), on metabolic
    reprogramming (Warburg, glutamine/GLS-1 dependency), and on clinical staging,
    presentation, and chemoresistance mechanisms. asta, being snippet-only,
    supports genomic complexity and macrophage M1/M2 plasticity only partially and
    lacks the chromothripsis and full immune-evasion detail the other two supply,
    but it adds the concrete standard-of-care MAP regimen and cell-death-pathway
    leads (ferroptosis, necroptosis, autophagy) the others underplay.
  integration: >-
    High-confidence, multi-provider claims are strong candidates for promotion
    into the disorder YAML: TP53/RB1 tumor-suppressor inactivation as the founding
    lesion; structural-variant/chromothripsis-driven genomic instability; the
    mesenchymal-osteogenic cell of origin shaped by bone-niche signals;
    PI3K/AKT/mTOR hyperactivation; EMT-driven lung metastasis; the
    immunosuppressive TAM-rich microenvironment; the multimodal MAP-chemotherapy
    plus surgery standard of care; and the stage-dependent prognosis (~60-70%
    localized vs ~20-30% metastatic five-year survival). These are already tagged
    INTEGRATED in the findings above.
  not_integrated: >-
    Several single-provider mechanistic leads are worth retaining but were not
    promoted here pending independent verification against primary abstracts:
    perplexity's specific TP53 fusion partners and percentages, MYC/CCNE1
    coamplification, HIF-1alpha/VEGF angiogenic and metabolic (glutamine/GLS-1,
    Warburg) axes, and the extensive miRNA/lncRNA regulatory nodes; and asta's
    alternative regulated-cell-death vulnerabilities (ferroptosis, necroptosis via
    RIPK/MLKL, PERK-mediated autophagy). These remain research leads rather than
    curated content because they rest on a single report and, in asta's case, on
    retrieval snippets without synthesis.


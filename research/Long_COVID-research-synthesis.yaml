notes: >-
  Three-way comparison of independent deep-research reports for Long COVID:
  cyberian (Claude deep-research, 13-mechanism narrative), falcon (Edison
  Scientific, endotype/biomarker-focused synthesis), and asta (retrieval-only
  Semantic Scholar corpus with per-paper snippets). Strong three-way concordance
  on the multi-mechanism/heterogeneity framing, viral persistence, immune
  dysregulation, mitochondrial/PEM biology, and the "many trials, none proven"
  treatment landscape. Divergence is coverage-driven, not contradictory: the
  peripheral-serotonin/gut-brain mechanism is unique to cyberian (SINGLE); the
  microclot/endothelial and autonomic/POTS mechanisms are absent from asta's
  retrieval; and host-genetic predisposition is developed only by asta with
  falcon silent. No genuine conflicts were found across the three providers, so
  no CONTRADICTORY stances were assigned. best_matching_text values are verbatim
  excerpts from the cited report files; literature evidence snippets are left to
  the main curation pipeline.

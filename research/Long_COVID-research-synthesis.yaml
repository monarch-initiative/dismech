narrative:
  overview: >-
    All three providers converge on Long COVID (PASC) as a heterogeneous,
    multisystem post-infectious condition that resists reduction to a single
    pathway. Cyberian offers the broadest mechanistic narrative, walking through
    roughly a dozen candidate mechanisms (viral persistence, immune
    dysregulation and NLRP3 inflammasome activation, autoimmunity, endothelial
    dysfunction/microclots, serotonin depletion and the gut-brain axis,
    mitochondrial dysfunction, autonomic dysfunction, neuroinflammation, mast
    cell activation, gut dysbiosis, pulmonary fibrosis, and latent-virus
    reactivation). Falcon is narrower and more quantitative, organizing the
    disorder around biological endotypes and serum biomarkers, with deep
    coverage of the inflammatory proteomic signature, persistent antigenemia,
    thrombotic endothelialitis, and skeletal-muscle OXPHOS failure driving
    post-exertional malaise. Asta is retrieval-only: it returns a ranked corpus
    of papers with snippets rather than a synthesis, so it corroborates the
    high-level framing (heterogeneity, immune dysregulation, host genetics, the
    large trial landscape) but supplies little independent mechanistic depth.
  agreement: >-
    Strong three-way concordance exists on the disorder's core framing:
    multi-mechanism heterogeneity/endotypes, viral persistence in tissue
    reservoirs, chronic immune dysregulation with low-grade inflammation, and
    mitochondrial/OXPHOS dysfunction underlying fatigue and post-exertional
    malaise. All three also agree on the therapeutic landscape — many candidate
    interventions (antivirals such as nirmatrelvir/ritonavir, immunomodulators,
    anticoagulants) are in active clinical trials, but none has proven efficacy
    in large randomized controlled trials. Cyberian and falcon additionally
    align closely on endothelial dysfunction and thromboinflammation as a
    vascular mechanism, and on immune dysregulation extending months beyond the
    acute infection.
  divergence: >-
    Divergence is driven by coverage and report type, not by contradiction — no
    genuine conflicts were found, so no CONTRADICTORY stances were assigned.
    Cyberian uniquely develops the peripheral-serotonin / tryptophan / gut-brain
    (vagal) axis mechanism from the Wong et al. Cell study, which both other
    providers are silent on. Cyberian also alone gives dedicated treatment to
    autonomic dysfunction/POTS, mast cell activation, gut dysbiosis, and
    EBV/latent-virus reactivation. Falcon's distinctive contribution is
    quantitative endotype and biomarker granularity — the IFN-gamma vs
    type-I-IFN/neutrophil clusters, prospective nucleocapsid antigenemia,
    thrombotic-endothelialitis biomarker panels, and the Appelman muscle-biopsy
    OXPHOS data — plus a concrete registered-trial catalogue. Asta's unique
    value is surfacing a host-genetics narrative review (genetic predisposition
    to acute and long COVID) that neither synthesis report develops, and
    quantifying the trial landscape (>400 registered), though its retrieval
    corpus is silent on microclots and autonomic dysfunction as Long COVID
    mechanisms.
  integration: >-
    The findings marked INTEGRATED are the multi-provider-supported claims ready
    to promote into the disorder YAML: the multi-mechanism/heterogeneity framing,
    viral persistence in tissue reservoirs, chronic immune dysregulation,
    endothelial dysfunction/microclots, mitochondrial-OXPHOS dysfunction driving
    PEM, autonomic dysfunction/POTS, and the "many trials, none proven"
    treatment landscape. These are well-anchored across cyberian and falcon (and
    corroborated by asta where its retrieval reaches) and correspond to
    pathophysiology, phenotype, and treatment blocks. Underlying PMIDs/DOIs
    should be fetched and snippet-verified through the main curation pipeline
    before promotion.
  not_integrated: >-
    Two findings are retained as LEADS rather than promoted. The peripheral
    serotonin / gut-brain axis mechanism rests on a single provider (cyberian)
    citing a single landmark study, which cyberian itself flags as needing
    replication across larger cohorts — promising but not yet multi-sourced.
    Host genetic predisposition is likewise held as a lead: asta supports it via
    a narrative review, cyberian offers only demographic/clinical risk factors,
    and falcon is silent, and the reviewed genetic associations are largely
    correlative rather than established causal drivers.


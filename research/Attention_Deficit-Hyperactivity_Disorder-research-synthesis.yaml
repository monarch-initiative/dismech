narrative:
  overview: >-
    Both providers frame ADHD as a common, highly heritable, polygenic
    neurodevelopmental disorder defined by developmentally inappropriate
    inattention and hyperactivity-impulsivity with childhood onset and
    cross-situational impairment. OpenScientist is a comprehensive, mechanism-rich
    report (catecholamine hypothesis, fronto-striatal-cerebellar circuits,
    candidate genes, prevalence, treatment effect sizes, comorbidity, model
    organisms), whereas Falcon is a narrower, recency-weighted report focused on
    epidemiological burden, transmission genetics, diagnostic-criteria
    comparison, real-world medication outcomes, and treatment innovations, and it
    explicitly flags several domains (mechanism, phenotype frequencies, anatomy,
    global prevalence) as not retrieved in its run.
  agreement: >-
    The reports converge on the polygenic, transmission-dominant genetic
    architecture; on the core three-domain clinical phenotype with childhood
    onset and impairment; on the age trajectory in which hyperactivity-impulsivity
    declines while inattention persists; on stimulant/non-stimulant
    pharmacotherapy; and on ADHD carrying excess premature mortality and adverse
    long-term outcomes.
  divergence: >-
    OpenScientist uniquely supplies the catecholamine / fronto-striatal-cerebellar
    pathophysiology, the worldwide-pooled 5.29% childhood prevalence, candidate
    genes (DAT1/SLC6A3, DRD4, DRD5, 5HTT, HTR1B, SNAP25), quantitative treatment
    effect sizes, and broad psychiatric comorbidity. Falcon uniquely emphasizes
    device/digital treatment innovations (TNS, digital therapeutics, transdermal
    amphetamine patch, viloxazine ER), medication benefit-risk pharmacoepidemiology
    (reduced injury/mortality during treated periods vs long-term cardiovascular
    risk), reduced adult life expectancy, and cross-disorder genetics with
    cannabis use disorder. The differences are coverage/recency, not direct
    contradictions; where they overlap on prevalence Falcon reports only regional
    figures and states the global estimate was not retrieved.
  integration: >-
    Findings promoted to the disorder entry are the polygenic/transmission genetic
    model, the core symptom phenotype and diagnostic criteria, the
    catecholamine / fronto-striatal-cerebellar pathophysiology, the age-dependent
    symptom trajectory, the ~5.29% childhood / ~2.5% adult prevalence, first-line
    stimulant and non-stimulant pharmacotherapy, and the excess-mortality /
    adverse-outcome prognosis.
  not_integrated: >-
    Retained as research leads rather than promoted: the emerging device/digital
    treatment modalities (TNS, digital therapeutics) and the shared-genetics /
    broad psychiatric comorbidity claims, which need further curation and
    reference verification before promotion to curated disease content.

notes: >-
  Cross-provider synthesis of two independent ADHD deep-research reports: falcon
  (Edison Scientific Literature; narrower, recency-weighted) and openscientist
  (comprehensive, 15-domain). No direct contradictions were found; divergence is
  coverage/recency plus Falcon's explicit non-retrieval of mechanism, phenotype
  frequencies, anatomy, and global prevalence. best_matching_text values are
  verbatim excerpts from the cited report files; literature evidence snippets are
  intentionally left to the main curation pipeline pending fetch-reference
  verification of the underlying PMIDs/DOIs.

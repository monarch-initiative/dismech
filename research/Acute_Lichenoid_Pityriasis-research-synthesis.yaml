- statement: >-
    Acute lichenoid pityriasis is synonymous with pityriasis lichenoides et
    varioliformis acuta (PLEVA) / Mucha-Habermann disease, the acute pole of the
    pityriasis lichenoides spectrum, presenting as recurrent crops of erythematous
    papulovesicular lesions that undergo necrosis/hemorrhagic crusting and can heal
    with varioliform scarring, with a rare severe febrile ulceronecrotic variant (FUMHD).

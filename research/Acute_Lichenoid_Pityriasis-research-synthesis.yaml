narrative:
  overview: >-
    Both providers characterize acute lichenoid pityriasis as pityriasis
    lichenoides et varioliformis acuta (PLEVA / Mucha-Habermann disease), the acute
    pole of the pityriasis lichenoides spectrum, whose severe end is febrile
    ulceronecrotic Mucha-Habermann disease (FUMHD). Falcon used the
    pathophysiology-focused template and is mechanism- and evidence-appraisal
    oriented; OpenScientist used the broad disease-characteristics template and is
    more clinical and quantitative, adding demographics, FUMHD mortality, and
    treatment-outcome numbers.
  agreement: >-
    The reports converge on the core disease model: a T-cell-mediated
    interface/lichenoid dermatitis driven by an immune hypersensitivity reaction to
    infectious (or occasionally drug/vaccine) triggers that are associated but not
    proven causal; characteristic clinicopathology (interface dermatitis, necrotic
    keratinocytes, lymphocytic vasculitis, erythrocyte extravasation); the absence
    of any causal gene and the non-diagnostic nature of TCR clonality; a benign,
    self-limited/relapsing natural history with only a small minority progressing to
    mycosis fungoides; and phototherapy (NB-UVB) as the most effective modality with
    erythromycin first-line in children in the absence of any RCT.
  divergence: >-
    Divergence is chiefly coverage and quantification, not conflict. OpenScientist
    asserts a specifically CD8+ cytotoxic T-cell predominance, whereas Falcon frames
    the infiltrate more agnostically as T-cell-driven and even reports one pediatric
    case with a CD4+++ immunophenotype. OpenScientist quantifies FUMHD mortality
    (12% overall; adults 20% vs children 2%) and an age-dependent sex reversal
    (M:F 1.7:1 in children vs 0.6:1 in adults) that Falcon does not capture; Falcon
    reports only an overall slight male predominance and describes FUMHD severity
    without mortality figures. OpenScientist also confidently assigns disease
    identifiers (MONDO:0024250, ICD-10 L41.0), while Falcon states the identifiers
    were not retrievable from its evidence base — a coverage gap rather than a
    contradiction.
  integration: >-
    The concordant mechanistic and clinical claims are suitable for promotion into
    kb/disorders/Acute_Lichenoid_Pityriasis.yaml: the T-cell interface-dermatitis
    pathophysiology with keratinocyte necrosis and lymphocytic vasculitis, the
    infectious-hypersensitivity trigger framing, the characteristic histopathology,
    the no-causal-gene/clonality-not-diagnostic genetics, the benign course with
    rare MF progression, the FUMHD severe-variant prognosis, and the phototherapy/
    erythromycin treatment hierarchy.
  not_integrated: >-
    The age-dependent sex-ratio reversal is retained as a research lead pending
    reconciliation of the single-cohort figure with Falcon's overall male
    predominance. Provider-specific quantitative details (exact clearance/recurrence
    percentages, FUMHD risk-score coefficients, per-pathogen case reports, COVID-19
    vaccine temporal associations) are kept as leads rather than promoted verbatim,
    to be re-verified against fetched abstracts before entering the disorder YAML.


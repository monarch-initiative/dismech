narrative:
  overview: >-
    Both providers frame Alpha-1 antitrypsin deficiency as an autosomal
    codominant SERPINA1 disorder in which the Z allele (Glu342Lys) misfolds and
    polymerizes, producing a dual pathology: loss of circulating antiprotease
    protection driving early-onset emphysema, and hepatocellular retention of
    Z-AAT polymers driving liver fibrosis, cirrhosis, and hepatocellular
    carcinoma. Falcon is a concise guideline/registry-anchored report; the
    OpenScientist report is broader and more quantitative, with mechanistic,
    epidemiologic, and therapeutic detail.
  agreement: >-
    The reports converge on the core biology: the SERPINA1 Z variant as the
    dominant lesion, the protein misfolding/polymerization/ER-retention chain,
    the dual loss-of-function (lung) and gain-of-toxic-function (liver)
    mechanism, the protease-antiprotease imbalance with unopposed neutrophil
    elastase, early-onset emphysema as the predominant pulmonary phenotype,
    marked underdiagnosis (~10% diagnosed), and IV augmentation therapy
    (60 mg/kg weekly) as the only disease-specific lung treatment.
  divergence: >-
    Divergence is mostly coverage and quantitative precision rather than
    contradiction. OpenScientist adds figures Falcon lacks — the RAPID
    CT-density benefit, ~78% RNAi knockdown, liver-transplant 20-year survival
    (89%), mortality rate ratio 6.2, and the polymer-load/fibrosis-outcome
    correlation — and reports a narrower Pi*ZZ prevalence (1:2,000–3,500) versus
    Falcon's wider 1:2,000–5,000. Falcon uniquely catalogues the recent
    investigational trial landscape (INBRX-101/SAR447537, KB408 inhaled HSV-1
    SERPINA1 delivery, NTLA-3001 CRISPR, ALN-AAT) and the EARCO registry, and it
    is silent on liver transplantation.
  integration: >-
    The concordant driver biology (Z-allele misfolding, dual mechanism,
    protease-antiprotease imbalance), the emphysema phenotype, prevalence and
    underdiagnosis, and augmentation therapy are promoted as curated content.
    Liver transplantation with long-term survival is integrated on the
    OpenScientist evidence.
  not_integrated: >-
    Emerging liver-directed RNAi is retained as a research lead pending
    verification of the knockdown figures and trial provenance; the broader
    investigational pipeline (recombinant/inhaled A1PI, gene editing),
    drug-repurposing signals, and single-registry epidemiologic point estimates
    are kept as leads rather than promoted.


    Alpha-1 antitrypsin deficiency is caused by pathogenic SERPINA1 variants,
    most importantly the Z allele (a glutamic acid to lysine substitution at
    residue 342), which destabilizes the AAT molecule and promotes its
    misfolding and polymerization.

narrative:
  overview: >-
    Both providers characterize beta-ketothiolase deficiency (BKD / T2 deficiency)
    as a rare autosomal recessive ACAT1 disorder in which loss of mitochondrial
    acetoacetyl-CoA thiolase blocks both the terminal step of isoleucine
    catabolism and ketolysis, producing episodic ketoacidotic crises under
    catabolic stress. Falcon is narrowly pathophysiology-focused (2023-2024
    literature, biochemistry, crisis physiology); OpenScientist is a broad
    15-section disease characterization (genetics, epidemiology, prognosis,
    diagnostics, treatment, models).
  agreement: >-
    The reports converge on the core molecular defect, the dual-pathway enzyme
    role, the episodic-crisis phenotype with infection/fasting/diet triggers, the
    characteristic urinary organic acids and acylcarnitines (with the caveat that
    the triad is not universal and 2-methylacetoacetate is unstable), the
    genotype-to-biochemical-phenotype relationship, a generally favorable
    prognosis, and dietary/supportive management (fasting avoidance, protein
    restriction, L-carnitine, sick-day IV dextrose).
  divergence: >-
    OpenScientist adds quantitative and mechanistic depth Falcon lacks: the
    explicit genotype-clinical dissociation (Fukao), outcome statistics (77%
    normal development, 89.6% with crises), the metabolic-stroke / basal-ganglia
    injury mechanism, the ACAT1 variant spectrum and structural mapping,
    consanguinity/founder effects, and animal/in-vitro models. The two most
    notable divergences are quantitative or emphatic rather than contradictory:
    incidence (Falcon's cohort-specific 1:32,237 in a Miao subgroup vs
    OpenScientist's broad ~1:1,000,000), and glucose handling (Falcon foregrounds
    DKA-mimicry and a rare adult with coexisting diabetes/hyperglycemia, whereas
    OpenScientist stresses that glucose is typically normal and hypoglycemia is
    absent).
  integration: >-
    The core ACAT1/T2 defect, impaired isoleucine catabolism and ketolysis, the
    episodic-decompensation cascade, the characteristic biomarkers (2M3HB,
    tiglylglycine, 2MAA, C5:1, C5-OH), the neurological sequelae, and the
    dietary/carnitine/dextrose/sick-day management model are supported by both
    providers and belong in the disorder YAML. The genotype-phenotype dissociation
    and favorable-prognosis statistics are OpenScientist-led but well founded.
  not_integrated: >-
    Variant-by-variant ACAT1 structural interpretation, the adult diabetic-
    ketoacidosis and DKA-mimicry edge cases, detailed newborn-screening operational
    metrics, and broad model-system / gene-therapy proposals are retained as
    research leads rather than promoted to curated disease mechanisms.

notes: >-
  Cross-provider synthesis comparing falcon (pathophysiology-focused, DOI-based
  citations) and openscientist (comprehensive, PMID-based). No direct

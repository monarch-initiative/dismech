narrative:
  overview: >-
    The two providers frame Costello syndrome from opposite ends of the
    deep-research spectrum. Falcon (Edison Scientific) delivers a synthesized,
    mechanism-first report that treats Costello syndrome as a prototypic RASopathy:
    a germline gain-of-function HRAS disorder whose RAS/MAPK (and secondary PI3K)
    hyperactivation drives multisystem disease, with unusually deep coverage of the
    cardiac phenotype, an hiPSC atrial-cardiomyocyte model of multifocal atrial
    tachycardia, and tumor predisposition. Asta is a retrieval-only corpus search
    whose 20 hits are largely off-topic (subarachnoid hemorrhage, caprine pregnancy
    toxemia, HHH syndrome, renal ciliopathies, diabetes mitochondria); only a
    handful of returned papers are genuinely on-topic (Dard 2022, Kontaridis 2022,
    Faienza 2024, Blachowska 2016). Consequently the harmonized picture is anchored
    by Falcon, with Asta supplying corroboration for a few shared claims plus a
    distinct bioenergetic angle and a prevalence figure.
  agreement: >-
    Both providers converge on the fundamentals: Costello syndrome is caused by
    heterozygous germline gain-of-function variants in the proto-oncogene HRAS, and
    the core dysregulated pathway is the canonical RAS/MAPK cascade. Both also place
    the disorder explicitly within the RASopathy family and affirm that
    cardiovascular disease is a major clinical feature. No direct contradictions
    were found between the reports; every point of contact is concordant or a
    weaker/qualified (partial) version of the same claim.
  divergence: >-
    Divergence is complementary coverage rather than conflict. Falcon uniquely
    contributes the PI3K/AKT effector axis, the hiPSC atrial-like cardiomyocyte
    mechanism linking HRAS to multifocal atrial tachycardia via enhanced pacemaker/
    nodal automaticity (with ivabradine/flecainide/verapamil as candidate
    modulators), quantified cardiac burden (CHD, HCM, supraventricular arrhythmia),
    and the ~10-15% tumor-risk spectrum (rhabdomyosarcoma, neuroblastoma, bladder
    transitional cell carcinoma). Asta uniquely surfaces the AMPK/mitochondrial
    bioenergetic mechanism from Dard 2022 — mutant HRAS inhibiting AMPK and impairing
    mitochondrial proteostasis/oxidative phosphorylation — together with mitochondrial
    modulators as a candidate therapy and an explicit birth-prevalence estimate.
    Where Asta touches Falcon's cardiac and tumor claims, its support is only partial:
    its cardiac prevalence figures are Noonan-syndrome-specific, and its tumor mention
    is a bare "predisposition to malignancies" with no risk estimate or spectrum.
  integration: >-
    The well-supported, provider-concordant claims should be promoted into the
    disorder YAML: the HRAS gain-of-function genetic cause, RAS/MAPK cascade
    hyperactivation as the core pathophysiology, cardiovascular disease
    (hypertrophic cardiomyopathy and supraventricular arrhythmias) as a major
    phenotype, and the characteristic malignancy predisposition. Falcon's quantified
    cardiac burden and the hiPSC-derived multifocal-atrial-tachycardia mechanism are
    strong single-provider contributions worth integrating with their primary-source
    citations verified.
  not_integrated: >-
    Several claims are retained as leads pending further verification rather than
    immediate promotion. The AMPK/mitochondrial bioenergetic mechanism and the
    mitochondrial-modulator therapeutic hypothesis rest on a single Asta-retrieved
    paper (Dard 2022) with predominantly model-organism/in-vitro evidence and should
    be corroborated before curation. The PI3K/AKT axis is Falcon-only and the birth-
    prevalence estimate is Asta-only; both are plausible but single-sourced. These
    are held as LEAD until their underlying PMIDs/DOIs are fetched and their snippets
    validated in the main curation pipeline.


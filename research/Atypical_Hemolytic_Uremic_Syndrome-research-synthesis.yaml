- statement: >-
    aHUS is a genetically heterogeneous complement disorder caused by
    loss-of-function variants in complement regulators (CFH, CFI, CD46/MCP, THBD)
    or gain-of-function variants in activators (C3, CFB), plus DGKE and CFHR
    rearrangements, with anti-factor H autoantibodies as an important acquired
    cause; CFH is the most common gene (~30%).
  sections: [genetic_factor, pathophysiology]

narrative:
  overview: >-
    Both providers frame atypical hemolytic uremic syndrome (aHUS) as a rare,
    complement-mediated thrombotic microangiopathy driven by uncontrolled
    activation of the alternative complement pathway, presenting as the TMA triad
    of microangiopathic hemolytic anemia, thrombocytopenia, and (predominantly
    renal) organ injury. Both center the disease on genetic/acquired defects in
    complement regulation, an incomplete-penetrance two-hit model, and the
    transformative role of terminal C5 inhibition.
  agreement: >-
    The reports concur on the core driver biology (alternative-pathway
    dysregulation causing endothelial injury and microvascular thrombosis); the
    genetic architecture (CFH ~30% as the leading gene, plus CD46/MCP, CFI, C3,
    CFB, THBD, DGKE and CFHR rearrangements, with anti-factor H autoantibodies as
    an acquired mechanism); incomplete penetrance (~50%) requiring a second-hit
    trigger; aHUS as a diagnosis of exclusion (ADAMTS13 >10% excludes TTP, Shiga
    toxin testing excludes STEC-HUS); the paradigm shift from C5 inhibitors
    (eculizumab/ravulizumab); and genotype-driven prognosis with CFH worst and
    CD46/MCP most favorable.
  divergence: >-
    OpenScientist is more quantitative and mechanistically deeper: it supplies
    definitive mouse-model evidence (CFH-mutant and C5-deficient crosses proving
    C5-dependence) that Falcon explicitly omits ("not available in this run"),
    emphasizes emerging proximal complement inhibitors (Factor B/iptacopan, Factor
    D, anti-properdin), and cites a population prevalence of 10.4 per million.
    Falcon reports a lower all-ages prevalence estimate (4.9 per million; 2.2-9.4
    per million in those <=20 years), leans on pregnancy-associated aHUS
    meta-analysis outcomes and detailed extrarenal organ frequencies, and lists
    only crovalimab among newer agents. The two also disagree on the disease's
    MONDO identifier (Falcon: MONDO:0016244, matching the dismech entry;
    OpenScientist: MONDO:0019632) — an identifier discrepancy, not a biological
    contradiction. Extrarenal involvement is affirmed by both but with divergent
    organ-specific frequencies (e.g., Falcon neurologic 8-48%/27.2%, cardiac up to
    43% in children; OpenScientist neurologic ~18%, cardiac ~19%, GI ~26%).
  integration: >-
    Integrated concepts for the disorder YAML: the alternative-pathway
    complement-dysregulation mechanism and TMA triad; the multi-gene genetic
    architecture with per-gene case fractions and the acquired anti-FH mechanism;
    incomplete penetrance and the two-hit trigger model; C5-inhibitor treatment
    with its outcome transformation; the exclusion-diagnosis workup; rare-disease
    epidemiology with adult female predominance; genotype-prognosis correlation;
    and the mouse-model proof of C5-dependence as mechanistic evidence.
  not_integrated: >-
    Retained as research leads rather than promoted: emerging proximal complement
    inhibitors (Factor B/D and anti-properdin), single-provider quantitative
    figures with wide inter-report spread (organ-specific extrarenal frequencies,
    competing prevalence estimates), and the pregnancy-associated aHUS
    meta-analytic outcome statistics.

notes: >-
  Cross-provider synthesis comparing the falcon (Edison Scientific Literature)
  and openscientist reports for atypical hemolytic uremic syndrome. No direct
  biological contradictions were found; divergence is coverage/quantitative
  (mouse-model evidence and proximal-inhibitor detail present only in
  OpenScientist; prevalence figures and extrarenal organ frequencies differ) plus
  a MONDO-identifier discrepancy. best_matching_text values are verbatim excerpts
  from the cited report files; literature evidence snippets and ontology terms are
  intentionally left to the main curation pipeline on the disorder YAML.

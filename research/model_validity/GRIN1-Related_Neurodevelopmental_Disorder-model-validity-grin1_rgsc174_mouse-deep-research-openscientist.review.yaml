claims:
- claim_id: OS-01
  topic: Origin of the allele
  report_section: Key Findings / The identity of the Rgsc174 allele
  report_quote: "is an ENU-induced behavioral-screen mutant, not a human patient variant."
  openscientist_position: >-
    The allele came from a forward-genetic behavioural screen, and this origin
    is taken to weaken its validity as a model of GRIN1-related disorder.
  author_results:
  - source: PMID:20345915
    system: ENU mutagenesis screen, heterozygous progeny
    result: Missense mutation in Grin1 causing an arginine-to-cysteine change in the C0 domain.
    quote: "This mutation results in an arginine to cysteine substitution in the C0 domain of the protein."
    quote_location: abstract
    quote_role: PRIMARY_RESULT
  - source: PMID:27164704
    system: human patient cohort
    result: The human substitution p.Arg844Cys recurred de novo in independent patients.
    quote: "Five de novo mutations have been detected recurrently in independent patients within our cohort (p.Asp552Glu, p.Gly815Arg, p.Phe817Leu, p.Gly827Arg, p.Arg844Cys)."
    quote_location: Results
    quote_role: PRIMARY_RESULT
  assessor_judgement: >-
    The origin statement is correct. The inference drawn from it is not: how an
    allele was found does not decide whether the same amino-acid change occurs
    in patients. The report never asks the second question, and Lemke 2016
    answers it. That mouse R844 and human R844 are the same position rests on
    the recorded sequence comparison noted under sources_checked, not on either
    paper.
  disposition: QUALIFIED
  basis: [PMID:20345915, PMID:27164704]
- claim_id: OS-02
  topic: Variant location and construct validity
  report_section: Key Findings / Construct validity is poor
  report_quote: "The spatial mismatch between where Rgsc174 sits (intracellular C0) and where disease variants cluster (transmembrane pore) is the single clearest argument against construct validity for GRIN1-NDD."
  openscientist_position: >-
    Disease variants cluster in the pore, so a C0-domain variant is in the wrong
    part of the receptor.
  author_results:
  - source: PMID:31429998
    system: selected patient variants
    result: The 12 variants studied were chosen because they lie in the M2 loop.
    quote: "Here, we summarize the clinical presentations for 18 patients harboring 12 de novo missense variants in GRIN1, GRIN2A, and GRIN2B that alter residues in the M2 re-entrant loop"
    quote_location: abstract
    quote_role: PRIMARY_RESULT
  - source: PMID:31429998
    system: literature summary
    result: The same paper states that clinically relevant variants occur in every domain, including the C-terminal domain.
    quote: "Clinically relevant rare variants reside in all NMDAR GluN subunits and across the whole gene (ATD, ABD, TMD, and CTD), but are enriched in the ABD and the TMD regions"
    quote_location: Introduction
    quote_role: BACKGROUND
  - source: PMID:27164704
    system: human patient cohort
    result: The de novo variants in this cohort, which include p.Arg844Cys, are described as clustering within or close to the transmembrane domains.
    quote: "All 16 different de novo mutations identified in the 23 novel and published cases are missense alterations and cluster within or in close proximity to the transmembrane domains forming the intrinsic ion channel pore of the receptor"
    quote_location: Results
    quote_role: PRIMARY_RESULT
  assessor_judgement: >-
    The report generalises from a study selected for M2-loop variants to all
    GRIN1 disease variants. Its own source says clinically relevant variants
    also occur in the C-terminal domain, and Lemke 2016 counts p.Arg844Cys
    among the de novo patient variants. The domain argument does not establish
    poor construct validity.
  disposition: REJECTED
  basis: [PMID:31429998, PMID:27164704]
- claim_id: OS-03
  topic: Disease features reproduced
  report_section: Summary
  report_quote: "The true Rgsc174 allele reproduces *none* of the core features of GRIN1-NDD (no reported epilepsy, intellectual disability, or hypotonia)"
  openscientist_position: The strain shows none of the core clinical features.
  author_results:
  - source: PMID:20345915
    system: offspring of heterozygous intercrosses, genotyped at E14, E17-18 and 4 weeks
    result: >-
      Homozygotes were 19 of 68 offspring at E14, 8 of 61 at E17-18 and 1 of
      31 at 4 weeks (Table 2).
    quote: "The number of homozygous pups gradually decreased from E17/E18 to 4 weeks postnatally (Table 2)."
    quote_location: Results and Table 2, p. 1285
    quote_role: PRIMARY_RESULT
    verified_against: SUPPLIED_PDF
  - source: PMID:23688147
    system: homozygous mice (summary table citing Furuse 2010)
    result: Summarised as premature death between embryonic day 17 and 4 weeks.
    quote: "Premature death (Embryonic 17th day to 4 weeks)"
    quote_location: Table 3
    quote_role: RESTATEMENT_OF_EARLIER_WORK
  assessor_judgement: >-
    Seizures, EEG, muscle tone and developmental milestones were not reported
    as tested in the sources checked, so their absence is unmeasured, not
    negative. The report says so itself under Limitations and Knowledge Gaps,
    which contradicts "reproduces none". The report also omits the loss of
    homozygotes, which in the original counts is a progressive decline with one
    homozygote of 31 offspring alive at 4 weeks. Whether the heterozygous
    phenotype corresponds to any feature of the human disorder is unresolved.
  disposition: QUALIFIED
  basis: [PMID:20345915, PMID:23688147]
  open_questions:
  - Were seizures, EEG or motor tone ever examined in either genotype?
- claim_id: OS-04
  topic: Behavioural readouts
  report_section: Key Findings / Face validity for GRIN1-NDD is poor
  report_quote: "The core readouts are therefore hyperactivity, fear-memory loss, and decreased acoustic startle with intact PPI"
  openscientist_position: Prepulse inhibition is intact.
  author_results:
  - source: PMID:23688147
    system: heterozygous male mice
    result: No significant genotype difference was detected in PPI.
    quote: "whereas no significant differences between genotypes were detected in the prepulse inhibition (PPI) test"
    quote_location: abstract
    quote_role: PRIMARY_RESULT
  assessor_judgement: >-
    Hyperactivity, fear-memory deficit and reduced startle are reported. "Intact
    PPI" turns a non-significant difference into a claim of normal function;
    the source reports only that no significant difference was detected.
  disposition: QUALIFIED
  basis: [PMID:23688147]
- claim_id: OS-05
  topic: Anxiety-like behaviour
  report_section: Key Findings / Face validity for GRIN1-NDD is poor
  report_quote: "In contrast to other Grin1 mutant mice, this mutant exhibited no evidence of heightened anxiety"
  openscientist_position: >-
    The report cites the 2010 statement that the strain shows no heightened
    anxiety, as part of a distinct psychiatric profile.
  author_results:
  - source: PMID:23688147
    system: heterozygous male mice, light/dark and elevated plus maze tests
    result: Anxiety-like measures differed from wild type, in conflicting directions between tests.
    quote: "They displayed abnormal anxiety-like behaviors in the light/dark transition and the elevated plus maze tests."
    quote_location: abstract
    quote_role: PRIMARY_RESULT
  author_interpretations:
  - source: PMID:23688147
    quote: "Further studies are needed to determine whether anxiety is increased or decreased in Grin1Rgsc174/Grin1+ mice."
  - source: PMID:29150978
    quote: "It has been previously reported that mice heterozygous for a missense mutation in Grin1 (Grin1Rgsc174 ) showed altered social behaviour, with increased locomotor activity, novelty seeking and anxiety."
  assessor_judgement: >-
    The quote is accurate for the 2010 paper, but the report leaves out the
    2013 results it also cites. The literature does not settle the direction
    of anxiety-like change in this strain.
  disposition: QUALIFIED
  basis: [PMID:20345915, PMID:23688147, PMID:29150978]
- claim_id: OS-06
  topic: Authors' disease framing
  report_section: Key Findings / The model's creators frame it as ADHD/schizophrenia/bipolar
  report_quote: "GRIN1-NDD is not mentioned as the target disorder."
  openscientist_position: >-
    The authors present the strain as a partial model of ADHD, schizophrenia and
    bipolar disorder.
  author_interpretations:
  - source: PMID:23688147
    quote: "Although Grin1(Rgsc174)/Grin1+ mice only partially recapitulate symptoms of patients with ADHD, schizophrenia, and bipolar disorder, they may serve as a unique animal model of a certain subpopulation of patients with these disorders."
  assessor_judgement: >-
    Correct as a description of the authors' framing. The framing was published
    in 2013, before Lemke 2016 reported p.Arg844Cys in patients, so it says
    nothing about whether the strain corresponds to the human GRIN1 disorder.
  disposition: QUALIFIED
  basis: [PMID:23688147, PMID:27164704]
- claim_id: OS-07
  topic: Independent review listing
  report_section: Key Findings / Independent corroboration
  report_quote: "This independent classification (in the review's full text) confirms the field treats Rgsc174 as a schizophrenia-spectrum model rather than a GRIN1-NDD model."
  openscientist_position: An independent review lists the strain among schizophrenia models.
  author_results:
  - source: PMID:32798374
    system: literature review of behavioural tasks
    result: The review includes the strain when summarising forced swim and radial maze results.
    quote: "Grin1(Rgsc174)/Grin1+ mice, a heterozygous mutant strain with a non-synonymous mutation of the C to T transition in exon 18 of the coding ionotropic glutamate receptor NMDA1 (Grin1) gene, revealed no effect on immobility time"
    quote_location: review body
    quote_role: REVIEW_SYNTHESIS
  assessor_judgement: >-
    The listing is real. A review that cites the strain in a schizophrenia-task
    survey records how the strain has been used; it does not show that the
    field has rejected a GRIN1-disorder correspondence.
  disposition: QUALIFIED
  basis: [PMID:32798374]
- claim_id: OS-08
  topic: Direction of receptor dysfunction
  report_section: Key Findings / Mechanism in Rgsc174
  report_quote: "The mechanistic data point to loss-of-function (hypofunction)."
  openscientist_position: The available data indicate NMDA receptor hypofunction.
  author_results:
  - source: PMID:20345915
    system: >-
      Primary cortical neurons cultured from E14-15 wild-type, heterozygous and
      homozygous embryos; 10 uM NMDA with 100 uM glycine at 37 C; indicator
      fluorescence (excitation 480 nm, emission 540 nm) read on an FDSS6000
      fluorimeter; n = 5 of each genotype (Methods p. 1283, Fig. 4 legend p. 1285)
    result: >-
      Peak response relative to baseline was higher in homozygous than in
      wild-type cells (Fig. 4A). The time at half-maximal level (T1/2max) was
      longer in homozygous cells than in wild-type or heterozygous cells (Fig.
      4B). No heterozygous-versus-wild-type difference is reported in the text
      or marked in Fig. 4.
    quote: "The maximum calcium influx level in the homozygote was significantly higher than in the wild type"
    quote_location: Results, p. 1285
    quote_role: PRIMARY_RESULT
    verified_against: SUPPLIED_PDF
  - source: PMID:20345915
    system: same cultures
    result: Duration comparison, as above.
    quote: "was significantly longer in the homozygote than in either the wild type or the heterozygote"
    quote_location: Results, p. 1285
    quote_role: PRIMARY_RESULT
    verified_against: SUPPLIED_PDF
  - source: PMID:23688147
    system: same experiment, restated in 2013
    result: Restates the 2010 homozygous result.
    quote: "The homozygous missense mutation (R844C) caused an increased and prolonged calcium influx in cultured cortical neurons after NMDA stimulation"
    quote_location: Background
    quote_role: RESTATEMENT_OF_EARLIER_WORK
  - source: PMID:23688147
    system: same experiment, restated in 2013
    result: Restates the genotype contrast; consistent with the 2010 Results text and Fig. 4.
    quote: "An increased and prolonged Ca2+ influx after activation of the NMDA receptor was observed in cultured cells derived from the cortices of Grin1Rgsc174/ Grin1Rgsc174, but not in Grin1Rgsc174/Grin1+ mice"
    quote_location: Discussion
    quote_role: RESTATEMENT_OF_EARLIER_WORK
  - source: PMID:27164704
    system: Xenopus oocytes, human GluN1 p.Arg844Cys with wild-type GluN2B
    result: No significant change in maximal agonist-evoked current or agonist affinity.
    quote: "However, functional analysis of mutations p.Ala645Ser and p.Arg844Cys revealed no significant effects on agonist Imax values or affinity, suggesting that these 2 substitutions may alter NMDAR function through other mechanisms."
    quote_location: Results
    quote_role: PRIMARY_RESULT
  author_interpretations:
  - source: PMID:20345915
    quote: "The results of immunohistochemical and biochemical analyses suggested that impaired interaction between the glutamatergic pathway and dopaminergic pathway may underlie the behavioral phenotypes of the Grin1(Rgsc174) mutant."
    note: Abstract. A pathway-level interpretation, not a receptor measurement.
  - source: PMID:20345915
    quote: "Altered NMDAR function in Grin1Rgsc174 heterozygote without any reduction in GRIN protein expression"
    quote_location: Results section heading, p. 1285
    verified_against: SUPPLIED_PDF
    note: >-
      The heading names the heterozygote, but the significant calcium
      differences reported under it are for homozygous cells.
  - source: PMID:20345915
    quote: "calcium influx was increased and prolonged in cortical neurons from the Grin1Rgsc174 mutant"
    quote_location: Discussion, p. 1289
    verified_against: SUPPLIED_PDF
    note: The Discussion links the result to an altered C0 domain without naming the genotype measured.
  - source: PMID:27164704
    quote: "disturbed interactions with intracellular proteins may impair receptor function"
    note: Offered for p.Arg844Cys specifically, and not tested in the paper.
  - source: PMID:27164704
    quote: "Our analyses of de novo mutations are consistent with a dominant-negative effect resulting in a significant loss of receptor function."
    note: >-
      A paper-wide interpretation. The R844C-specific measurement is the null
      Imax and affinity result above, and R844C is not in the paper's list of
      variants that result in loss of function (OM-01).
  assessor_judgement: >-
    No source checked measured receptor hypofunction in this strain. The
    report's support is an author interpretation about pathway interaction,
    not a receptor measurement. The direct data it omits do not point
    to loss of function. In Furuse 2010, cultured neurons from homozygous
    embryos showed a larger and longer NMDA-evoked calcium signal than
    wild-type neurons, and heterozygous neurons showed no reported difference
    from wild type. In Lemke 2016, human GluN1 p.Arg844Cys with GluN2B showed
    no significant change in Imax or agonist affinity. The calcium result is
    relevant functional evidence on NMDA-evoked signalling in this allele, and
    it is in the direction of more, not less. It does not by itself establish
    a receptor-level gain of function: it is a whole-cell fluorescence signal,
    so channel properties, surface receptor number and the source of the
    calcium are not separated, and it was significant only in homozygous
    cells. The direction of receptor-level change is unresolved.
  disposition: REJECTED
  basis: [PMID:20345915, PMID:23688147, PMID:27164704]
  open_questions:
  - Has R844C been studied co-expressed with wild-type GluN1, or for calmodulin or CaMKII binding?
  - Which calcium indicator and replicate unit lie behind n = 5 per genotype (Supporting Appendix S2, not checked)?
- claim_id: OS-09
  topic: C0 domain and CaMKII
  report_section: Key Findings / Mechanism in Rgsc174
  report_quote: "placing the Rgsc174 defect at the GluN1–CaMKII signaling/trafficking interface rather than at channel gating"
  openscientist_position: The defect lies in CaMKII signalling or receptor trafficking.
  author_results:
  - source: PMID:20345915
    system: adult male heterozygous and wild-type cortex, immunoblot, n = 5 per genotype (Fig. 5 legend, p. 1285)
    result: No significant difference in GRIN1, GRIN2A or GRIN2B protein relative to tubulin.
    quote: "no differences were found between the heterozygous and wild-type mice"
    quote_location: Results, p. 1285
    quote_role: PRIMARY_RESULT
    verified_against: SUPPLIED_PDF
  - source: PMID:23688147
    system: heterozygous mice (summary table citing Furuse 2010)
    result: Summarised as a normal expression level.
    quote: "| Effects on expression level | Normal [ 32 ] |"
    quote_location: Table 3
    quote_role: RESTATEMENT_OF_EARLIER_WORK
  author_interpretations:
  - source: PMID:23688147
    quote: "raising the possibility that the mutation in the C0 domain may alter the interaction between Grin1 and αCaMKII"
  assessor_judgement: >-
    CaMKII binding at the C0 domain is background from earlier work, and its
    alteration by this mutation is raised as a possibility. Neither binding nor
    trafficking was measured in the sources checked. Total cortical GRIN1
    protein in heterozygotes showed no significant difference from wild type
    in the original immunoblot, which Umemori 2013 summarises as normal; that
    does not address surface or synaptic receptor levels. The location is a
    hypothesis, not a finding.
  disposition: QUALIFIED
  basis: [PMID:20345915, PMID:23688147]
- claim_id: OS-10
  topic: Social dominance result
  report_section: Key Findings / Individual differences
  report_quote: "The line shows a vulnerable/resilient-style split along social dominance, but it is not anchored to human vulnerability data."
  openscientist_position: The strain splits into vulnerable and resilient animals.
  author_results:
  - source: PMID:29150978
    system: group-housed heterozygous mice, water competition test
    result: Heterozygotes as a group were socially subordinate to wild type.
    quote: "We found that Grin1Rgsc174/+ mice exhibited social subordination characterised by decreased corner visit frequency and occupancy time at the beginning of the task."
    quote_location: abstract
    quote_role: PRIMARY_RESULT
  assessor_judgement: >-
    The source reports a genotype difference, not a split of mutant animals
    into vulnerable and resilient subgroups. The finding is real; its
    description as an individual-differences split is not. The article title
    calls these mice lacking a functional NMDA receptor; that is the authors'
    framing, not a receptor measurement.
  disposition: REJECTED
  basis: [PMID:29150978]
- claim_id: OS-11
  topic: Immature dentate gyrus markers
  report_section: Key Findings / The only human-tissue anchor
  report_quote: "phenotype (upregulated *Drd1a*, downregulated desmoplakin/*Tdo2*)"
  openscientist_position: The strain shows Drd1a upregulation and Dsp and Tdo2 downregulation.
  author_results:
  - source: PMID:23688147

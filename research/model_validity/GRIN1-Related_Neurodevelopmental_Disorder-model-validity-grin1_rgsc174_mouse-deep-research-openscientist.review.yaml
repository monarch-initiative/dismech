- claim_id: OS-14
  topic: Separation from the Y647S model
  report_section: Flagged section on the Grin1 Y647S knock-in
  report_quote: "Rgsc174 ≠ Y647S."
  openscientist_position: The Y647S knock-in is a different allele and its results must not be attributed to Rgsc174.
  assessor_judgement: >-
    Correct and useful. The Y647S quotes the report gives match the cited

review_format:
  name: research-report-review
  status: PROPOSED
  version: '0.1'
  description: >-
    Proposed structured review of one deep-research report kept under
    research/. No dismech schema or validator covers this file. The claim
    dispositions (RETAINED, QUALIFIED, REJECTED, NEEDS_VERIFICATION) and the
    overall verdict value reuse the enums of
    src/dismech/schema/hypothesis_assessment.yaml so that the review can be
    migrated if a covering schema is adopted.
  why_not_hypothesis_assessment: >-
    The hypothesis_assessment schema and dismech.hypothesis_assessment require
    the file to live at kb/hypotheses/<Disease>/<hypothesis_id>/assessments/,
    a hypothesis_id equal to that directory name, and a source_report inside
    the same hypothesis directory. This report is a model-validity report under
    research/model_validity/ and belongs to no hypothesis directory. Using that
    format would mean moving the report or inventing a hypothesis_id, so it was
    not used.
  placement_note: >-
    CLAUDE.md reserves research/ for deep-research outputs and deterministic
    script outputs. This hand-written review sits beside the report because it
    is a review of that report; whether it should live here, under docs/, or in
    a new location is an open maintainer decision.


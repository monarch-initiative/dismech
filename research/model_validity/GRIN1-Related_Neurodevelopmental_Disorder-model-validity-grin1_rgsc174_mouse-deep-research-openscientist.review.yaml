  report_quote: "Allele-identity ambiguity is the dominant uncertainty."
  openscientist_position: The name Rgsc174 is ambiguous and must be resolved before curation.
  assessor_judgement: >-
    The sources checked use Grin1 Rgsc174 consistently for the ENU allele. The
    ambiguity came from the report's own early conflation with Y647S. The
    larger uncertainties are those in OS-08 and OS-11.
  disposition: REJECTED
  basis: [PMID:20345915, PMID:23688147]
- claim_id: OS-19
  topic: Limits of gain/loss labels
  report_section: Mechanistic Model / Findings that do not fit
  report_quote: "warning that receptor-level GoF/LoF labels may not hold at higher levels of organization"
  openscientist_position: Receptor-level labels may not transfer to synaptic or system levels.
  author_interpretations:
  - source: PMID:38836461
    quote: "discuss the limitations of this classification at the synaptic, cellular, or system level"
  assessor_judgement: >-
    Correctly quoted, and it applies to this case: a whole-neuron calcium
    response and adult behaviour are not receptor-level measurements. The
    report does not apply this caveat to its own loss-of-function
    recommendation.
  disposition: RETAINED
  basis: [PMID:38836461]

omissions:
- omission_id: OM-01
  description: >-
    Lemke et al. 2016 is not cited: p.Arg844Cys recurs de novo in GRIN1
    patients, the oocyte assay found no significant Imax or affinity change,
    and the authors do not include it among the variants they call loss of
    function.
  evidence:
  - source: PMID:27164704
    quote: "GRIN1 de novo mutations p.Pro557Arg, p.Ser560dup, p.Gly618Arg, p.Gly620Arg, p.Tyr647Ser, p.Gly815Arg, p.Phe817Leu, and p.Gly827Arg result in a loss of function."
    quote_location: Discussion
  affects_claims: [OS-01, OS-02, OS-03, OS-06, OS-08, OS-15, OS-16, OS-17]
- omission_id: OM-02
  description: >-
    The NMDA-evoked calcium response in cultured cortical neurons (larger and
    longer in homozygous cells; heterozygous cells measured, with no reported
    difference from wild type) is not mentioned.
  evidence:
  - source: PMID:23688147
    quote: "| Effects on receptor function | ND | Increased Ca2+ influx [ 32 ] |"
    quote_location: Table 3
  affects_claims: [OS-08, OS-15, OS-16]
  note: >-
    Furuse 2010 measured heterozygous cells (Fig. 4, n = 5 of each genotype),
    and its text and figure report no heterozygous-versus-wild-type
    difference, matching the Umemori 2013 Discussion. Umemori Table 3 still
    reads ND in the heterozygous receptor-function cell. ND is not defined in
    the table, so it cannot be read as showing that heterozygous cells were
    not measured; what it was meant to convey is unresolved.

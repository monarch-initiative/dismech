- claim_id: OS-12
  topic: Human tissue link
  report_section: Key Findings / The only human-tissue anchor
  report_quote: "This is the only direct human-tissue connection, and it directs the model toward schizophrenia/bipolar disorder"
  openscientist_position: The iDG result links the strain directly to psychiatric post-mortem tissue.
  author_interpretations:
  - source: PMID:23688147

feedback:
  provided_by: Yuki Yamagata
  github_login: yuki-yamagata
  received_on: '2026-11-17'
  handling: >-
    The feedback was treated as points to check against primary sources, not as
    findings. The findings recorded for each point are the assessor's. No
    endorsement of this review by the feedback provider is implied.
  points:
  - point_id: FB-A
    feedback_summary: >-
      The report recommends a loss-of-function reading of Rgsc174 (R844C) and may
      have missed Lemke et al. 2016, which reports human p.Arg844Cys and its
      functional analysis.
    assessor_finding: CONFIRMED
    detail: >-
      The report does not cite PMID:27164704 and never names residue 844. Lemke
      et al. report p.Arg844Cys as a recurrent de novo variant in GRIN1
      patients and found no significant effect on agonist Imax or affinity in
      oocytes. This bears on claims OS-02, OS-03, OS-08, OS-15 and OS-16. Two
      questions are kept separate: the mouse allele was found in an ENU screen,
      which is true, and the corresponding substitution has been reported in
      patients, which the report misses.
    related_claims: [OS-01, OS-02, OS-03, OS-08, OS-15, OS-16, OS-17]
  - point_id: FB-B
    feedback_summary: >-
      Homozygous versus heterozygous mice, animals versus cultured cells, mouse
      neuron calcium responses versus human-construct oocyte recordings, and
      original measurements versus later restatements should be kept apart.
    assessor_finding: CONFIRMED
    detail: >-
      The report does not merge the calcium and oocyte data; it omits both. It
      does present an author interpretation (Furuse 2010) and background
      statements about the C0 domain (Umemori 2013 introduction) as if they were
      measurements in this strain, which is the basis of its loss-of-function
      reading.
    related_claims: [OS-08, OS-09, OS-15, OS-16]
  - point_id: FB-C
    feedback_summary: >-
      The report's immature dentate gyrus statement, especially Drd1a and Dsp,
      may confuse the general pattern of other iDG models with the Calb1 and
      Tdo2 results measured in this strain.
    assessor_finding: CONFIRMED
    detail: >-
      In Umemori 2013, Tdo2 and Calb1 were significantly reduced in heterozygous
      hippocampus, while Dsp and Drd1a showed no significant genotype
      difference. Drd1a upregulation and Dsp downregulation are the pattern the
      authors cite for other iDG strains. The report attributes that pattern to
      Rgsc174 and omits Calb1.
    related_claims: [OS-11, OS-12]
  - point_id: FB-D
    received_on: '2026-11-17'
    feedback_summary: >-
      The increased and prolonged NMDA-evoked calcium response is relevant
      functional evidence but cannot by itself establish receptor-level gain of
      function; the omission of that evidence should be kept separate from
      whether the strain can be classified as gain of function.
    assessor_finding: CONFIRMED
    detail: >-
      Furuse 2010 measures a whole-cell fluorescence calcium signal in cultured
      neurons, not receptor currents. OS-08 and OS-15 were reworded and OS-15
      was re-graded from REJECTED to QUALIFIED.
    related_claims: [OS-08, OS-15]
  - point_id: FB-E
    received_on: '2026-11-17'
    feedback_summary: >-
      In Lemke 2016, the R844C-specific measurement should be kept apart from
      the paper-wide loss-of-function and dominant-negative interpretation, and
      the absence of wild-type GluN1 co-expression for R844C should be stated
      as not reported in the text checked.
    assessor_finding: CONFIRMED
    detail: >-
      The paper-wide interpretation now sits under author_interpretations in
      OS-08 and OS-17, and OS-17 states the co-expression point as a reporting
      scope.
    related_claims: [OS-08, OS-17]
  pdf_provision_note: >-
    The Furuse 2010 and Umemori 2013 PDFs were supplied by the feedback
    provider. Supplying them is not an endorsement of this review. PR 16959
    records that the same feedback provider supplied these PDFs for that
    curation; this assessor read the Furuse 2010 full text for the first time
    in revision 2.

sources_checked:
- reference: PMID:20345915
  short_name: Furuse et al. 2010
  cache: references_cache/PMID_20345915.md
  content_checked: FULL_TEXT_SECTIONS
  scope: >-
    Revision 1 used the abstract-only cache. Revision 2 used the supplied PDF
    (journal pages 1281-1291) and checked: Materials and methods on animals and
    sex and on mutation analysis (p. 1282), the measurement of NMDA-induced
    intracellular calcium (p. 1283) and statistics (p. 1284); Results on the
    mutation, homozygote survival (Table 2), the calcium measurement (Fig. 4
    and legend) and NMDAR subunit immunoblots (Fig. 5 and legend) (pp.
    1284-1285); and the Discussion section "Functional change in GRIN1
    protein" (p. 1289). Other results and figures were not checked against
    this review.
  limitation: >-
    The online Supporting Information was not available. Appendix S2, which
    describes how the cells for the calcium measurement were prepared, was not
    checked, so the calcium indicator, its loading and the replicate unit
    behind "n = 5 of each genotype" are not known here. Quotes taken from the
    PDF cannot be checked against the abstract-only cache.
  source_notes:
  - >-
    The Abstract and Fig. 3D give an arginine-to-cysteine change, matching the
    allele name R844C. The Results sentence reads "a substitution of arginine
    for cysteine at residue 844", and the Discussion (p. 1289) describes the
    wild-type residue as a cysteine replaced by arginine, the reverse
    direction. This review follows the Abstract and Fig. 3D.
  - >-
    The calcium Methods and the Fig. 4 legend describe cultures from embryos
    (E14-15 and E14); the Results text says the cultures came from pups.
  - >-
    The Fig. 4 legend gives n = 5 of each genotype and F(2,32) for the genotype
    effect; the main text does not state how the two relate.
  - >-
    For the NMDAR subunit immunoblots the Results text names the adult
    cingulate cortex and the Fig. 5 legend the cerebral cortex.
- reference: PMID:23688147
  short_name: Umemori et al. 2013
  cache: references_cache/PMID_23688147.md
  content_checked: FULL_TEXT
  scope: >-
    Revision 1 read the full-text cache. Revision 2 also viewed Table 3 in the
    supplied PDF (PDF pages 14-15).
  limitation: >-
    Table 3 and its caption do not define ND, and no definition was found by
    searching the text extracted from the PDF.

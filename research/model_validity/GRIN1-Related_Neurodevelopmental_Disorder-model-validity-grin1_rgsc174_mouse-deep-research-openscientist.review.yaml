unresolved:
- Direction of receptor dysfunction for R844C, in mouse or human. No direct measurement in the sources checked shows gain or loss of receptor function.
- The heterozygous calcium-imaging result and culture conditions in Furuse 2010, which were not available to this review.
- Per-patient genotype and phenotype for the p.Arg844Cys carriers in Lemke 2016 Table 1, published as an image.
- Whether any mechanism link from this strain to the GRIN1 disease entry is warranted.
- Whether this review format and its location under research/ should be adopted.

overall:
  verdict: WEAKLY_SUPPORTED_UNRESOLVED
  verdict_vocabulary: HypothesisAssessmentVerdictEnum, borrowed
  summary: >-
    Useful as a lead for the strain's origin, the authors' psychiatric framing,
    the male-only 2013 battery and the separation from the Y647S knock-in. Its
    central recommendation, to link the strain only to NMDA receptor loss of
    function, is not supported: it rests on an author interpretation and on
    background statements, and it omits the direct measurements that exist
    (the homozygous neuron calcium response and the human-construct oocyte
    assay), neither of which shows loss of function. It also attributes the
    general immature dentate gyrus marker pattern to this strain, and argues
    poor construct validity without noting that p.Arg844Cys has been reported
    in GRIN1 patients. The omissions do not show gain of function either; the
    direction of receptor dysfunction remains unresolved.

- claim_id: OS-15
  topic: Gain-of-function evidence
  report_section: Assessment table
  report_quote: "No GoF evidence"
  openscientist_position: >-
    The report's assessment table rates NMDAR gain of function "Poor
    (absent)" with the basis "No GoF evidence", and its mechanism table lists
    "None in Rgsc174" for the gain-of-function node.
  assessor_judgement: >-
    Two questions are kept apart. First, the report omits relevant functional
    evidence: the larger and longer NMDA-evoked calcium signal in homozygous
    cultured neurons (Furuse 2010, OS-08), so "no evidence" misdescribes what
    exists. Second, that evidence does not establish receptor-level gain of
    function, and the human-construct oocyte assay found no significant change
    in Imax or agonist affinity (Lemke 2016). Read as "no evidence establishing gain of function",
    the report's verdict stands; read as "no relevant evidence", it does not.
    Not linking the strain to the gain-of-function node, the current KB state
    after PR 16959, is consistent with this.
  disposition: QUALIFIED
  basis: [PMID:20345915, PMID:23688147, PMID:27164704]
- claim_id: OS-16
  topic: Recommended mechanism link
  report_section: Curator caveats
  report_quote: "permissible link is to *NMDA Receptor Loss-of-Function* only"
  openscientist_position: The strain should be linked only to the loss-of-function node.
  assessor_judgement: >-
    Not supported. The recommendation rests on OS-08, and no direct measurement
    in the sources checked shows loss of receptor function. The current KB
    records this strain with no mechanism link. Whether any link is warranted
    is an open curation question.
  disposition: REJECTED
  basis: [PMID:23688147, PMID:27164704]
- claim_id: OS-17
  topic: Receptor biophysics unmeasured
  report_section: Limitations and Knowledge Gaps
  report_quote: "Rgsc174's receptor biophysics (open probability, surface expression, current amplitude) have not been directly reported; the LoF assignment is inferred."
  openscientist_position: Receptor-level properties of the mouse allele have not been measured.
  author_results:
  - source: PMID:27164704
    system: Xenopus oocytes, human GluN1 p.Arg844Cys with wild-type GluN2B
    result: Mutant receptors were functional with Imax similar to wild type.
    quote: "Mutations p.Arg217Trp, p.Ala645Ser, and p.Arg844Cys generated functional receptors with agonist Imax values (p > 0.05, n = 5) similar to wild-type (data not shown)."
    quote_location: Results
    quote_role: PRIMARY_RESULT
  - source: PMID:27164704
    system: Xenopus oocytes, wild-type GluN1 co-expressed with mutant GluN1
    result: Co-expression is reported for two other variants.
    quote: "Coexpression of wild-type GluN1 with mutants GluN1 p.Tyr647Ser or p.Phe817Leu resulted in intermediate effects of agonist Imax values"
    quote_location: Results
    quote_role: PRIMARY_RESULT
  assessor_judgement: >-
    Right that no receptor recording of the mouse allele was found, and right
    that the loss-of-function reading is inferred. It misses the human-construct
    recording. That assay is limited: expression in oocytes, agonist Imax and
    affinity only, and the Imax data are not shown. In the main text checked,
    co-expression with wild-type GluN1 is reported for p.Tyr647Ser and
    p.Phe817Leu and not reported for p.Arg844Cys; the online data supplement
    was not checked. The paper-wide loss-of-function and dominant-negative
    interpretation is recorded under OS-08 and is not an R844C-specific
    measurement.
  disposition: QUALIFIED
  basis: [PMID:27164704]
- claim_id: OS-18
  topic: Allele-name ambiguity

    quote: "The expression of Tdo2 and Calb1 was slightly but significantly reduced in the mutant mice compared to wild-type mice"
    quote_location: Results
    quote_role: PRIMARY_RESULT
  - source: PMID:23688147
    system: hippocampal qRT-PCR, 27- to 29-week-old heterozygous and wild-type mice
    result: No significant genotype difference was detected for Dsp or Drd1a.
    quote: "There were no significant differences between Grin1Rgsc174/Grin1+ and wild-type mice in the expressions of Dsp or Drd1a (Figure 8; Dsp, p = 0.197; Drd1a, p=0.652)."
    quote_location: Results
    quote_role: PRIMARY_RESULT
  - source: PMID:23688147
    system: other mouse strains (background)
    result: The marker pattern is the one previously described in other iDG strains.
    quote: "Mouse strains with iDG show a characteristic marker expression pattern, upregulation of Drd1a, and downregulation of Dsp, Tdo2, and Calb1"
    quote_location: Discussion
    quote_role: BACKGROUND
  author_interpretations:
  - source: PMID:23688147
    quote: "In Grin1Rgsc174/Grin1+ mice, two out of the four marker genes showed iDG-specific gene expression patterns, suggesting that they may partially display the iDG phenotype."
  - source: PMID:23688147
    quote: "There is also the possibility that the downregulation of the two genes is caused by the effect(s) of NMDA receptor mutation that are independent of the maturation abnormality of granule cells."
  assessor_judgement: >-
    The report attributes the general iDG pattern to this strain. Measured here:
    Tdo2 and Calb1 reduced; Dsp and Drd1a no significant difference detected,

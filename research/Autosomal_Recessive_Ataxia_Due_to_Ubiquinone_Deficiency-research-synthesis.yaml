- statement: >-
    Loss of COQ8A destabilizes coenzyme Q10 biosynthesis; the resulting CoQ10
    deficiency impairs mitochondrial electron transport and oxidative
    phosphorylation and increases oxidative stress, causing preferential
    cerebellar (Purkinje cell) neurodegeneration.
  sections: [pathophysiology]
  curation_status: INTEGRATED
  provider_support:
  - provider: falcon
    source_report: research/Autosomal_Recessive_Ataxia_Due_to_Ubiquinone_Deficiency-deep-research-falcon.md
    stance: CONCORDANT
    matched: true
    score: 0.9
    best_matching_text: >-
      COQ8A dysfunction → reduced/abnormal CoQ10 homeostasis (ubiquinone/ubiquinol
      pool) → impaired electron transfer and oxidative phosphorylation + altered
      redox buffering → selective vulnerability of cerebellar circuitry (Purkinje
      system and dentate-related pathways) → progressive cerebellar syndrome
      (ataxia, dysarthria, tremor) ± multisystem features.
    explanation: >-
      Falcon lays out the same upstream-to-downstream causal chain from COQ8A
      dysfunction through OXPHOS failure to cerebellar/Purkinje vulnerability.
    citations: ["DOI:10.3390/metabo12100955", "DOI:10.1002/ana.25751"]
  - provider: openscientist
    source_report: research/Autosomal_Recessive_Ataxia_Due_to_Ubiquinone_Deficiency-deep-research-openscientist.md
    stance: CONCORDANT
    matched: true
    score: 0.95
    best_matching_text: >-
      Since CoQ10 serves as the essential electron carrier between complexes I/II
      and complex III of the mitochondrial respiratory chain, its deficiency
      causes impaired oxidative phosphorylation, decreased ATP production,
      increased reactive oxygen species (ROS) generation, and oxidative stress,
      ultimately leading to neurodegeneration with preferential vulnerability of
      cerebellar Purkinje cells.
    explanation: >-
      OpenScientist gives the identical mechanistic chain with the added specific
      Complex II+III/ATP/ROS detail and Purkinje-cell vulnerability.


narrative:
  overview: >-
    Both providers frame Autosomal Recessive Ataxia Due to Ubiquinone Deficiency
    as COQ8A-related primary coenzyme Q10 deficiency (COQ10D4 / ARCA2 / SCAR9,
    OMIM 612016): a recessive, potentially treatable mitochondrial disorder in
    which biallelic COQ8A loss impairs CoQ10 biosynthesis, degrades oxidative
    phosphorylation, and drives progressive cerebellar (Purkinje cell)
    neurodegeneration. Falcon is cohort/treatment-response focused (leaning on the
    n=59 multicenter study), while OpenScientist is broader and more mechanistic,
    adding molecular-function, model-organism, and diagnostic detail.
  agreement: >-
    The reports converge on the essentials: the COQ8A/ADCK3 genetic cause and
    disease identity; the CoQ10-deficiency-to-OXPHOS-failure-to-cerebellar-
    degeneration causal chain; the childhood-onset cerebellar ataxia with
    (near-)universal cerebellar atrophy and a variable epilepsy/cognitive/
    movement-disorder spectrum; muscle CoQ10 as the key diagnostic measurement;
    slow progression with an emphasis on early treatment; and CoQ10
    supplementation as the main therapy with only ~50% of patients responding.
  divergence: >-
    OpenScientist contributes material Falcon does not: the resolution of COQ8A as
    an atypical ATPase (not a canonical kinase) that stabilizes the CoQ synthome,
    a quantified ultra-rare prevalence band (<1/1,000,000), and the mammalian
    Coq8a-knockout mouse that recapitulates ARCA2. Falcon covers only the
    Drosophila model and leaves prevalence as "unknown" without a rarity band.
    These are differences of coverage and specificity, not conflicts — no
    genuine contradiction was found between the two reports.
  integration: >-
    The convergent core (COQ8A cause, CoQ10-deficiency mechanism, cerebellar
    phenotype with atrophy, muscle-CoQ10 diagnosis, slow progression, and partial
    CoQ10-supplementation response) supports the existing
    kb/disorders/Autosomal_Recessive_Ataxia_Due_to_Ubiquinone_Deficiency.yaml
    pathophysiology, phenotype, diagnosis, and treatment nodes.
  not_integrated: >-
    The COQ8A ATPase molecular-function detail, the ultra-rare prevalence
    estimate, and the animal-model recapitulation are retained as research leads
    pending verification of the underlying primary literature before promotion to
    curated evidence.


  - text: "We found a mutation in TGFBR1 or TGFBR2 in all probands with typical Loeys–Dietz syndrome (type I) and in 12 probands presenting with vascular Ehlers–Danlos syndrome (Loeys–Dietz syndrome type II)."
    claim_text: "Mutations in TGFBR1 or TGFBR2 cause both Loeys-Dietz syndrome type I and type II."

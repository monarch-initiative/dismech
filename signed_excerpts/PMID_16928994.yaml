  - text: "The natural history of both types was characterized by aggressive arterial aneurysms (mean age at death, 26.0 years) and a high incidence of pregnancy-related complications (in 6 of 12 women)."
    claim_text: "Loeys-Dietz syndrome types I and II are characterized by aggressive arterial aneurysms with a mean age at death of 26.0 years and high pregnancy-related complication rates."

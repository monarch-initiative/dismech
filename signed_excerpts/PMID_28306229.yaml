- text: The interpretation of variants of uncertain significance (VUS), especially missense variants,
    should include correlation with the complete clinical phenotype.
  claim_text: Missense VUS interpretation in EDS-associated genes requires correlation with the complete
    clinical phenotype and familial segregation studies.
  supports: SUPPORT

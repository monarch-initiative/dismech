- text: With the elucidation of the biochemical and molecular basis of many of these EDS types, a revised
    classification, the “Villefranche Nosology,” was published in 1998 ... This classification delineated
    six subtypes, for which major and minor clinical criteria were defined
  claim_text: The 1998 Villefranche Nosology delineated six Ehlers-Danlos syndrome subtypes based on clinical
    criteria and biochemical/molecular etiology.
  supports: SUPPORT
  explanation: Historical context for how the 2017 classification expanded from the six Villefranche subtypes
    to 13 subtypes.

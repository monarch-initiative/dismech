- text: Charcot-Marie-Tooth disease (CMT) is one of the most common and genetically heterogeneous inherited
    neurological diseases, with more than 130 disease-causing genes. ... Whole genome sequencing (WGS)
    has improved diagnosis across genetic diseases, but the diagnostic impact in CMT is yet to be fully
    reported.
  claim_text: Charcot-Marie-Tooth disease is caused by variants in over 130 genes, and whole-genome sequencing
    significantly increases diagnostic yield.

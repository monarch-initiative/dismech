- text: Although all three types of NPD can manifest with pulmonary involvement, lung disease occurs more
    frequently in NPD type B, typically with interstitial lung disease, recurrent pulmonary infections,
    and respiratory failure.
  claim_text: Pulmonary involvement (interstitial lung disease, recurrent infections, and respiratory
    failure) occurs most frequently in Niemann-Pick disease type B.
  supports: SUPPORT
  explanation: Highlights the characteristic pulmonary phenotype of NPD type B.

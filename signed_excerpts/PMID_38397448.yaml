excerpts:
- text: NPD type A and B are caused by mutations in the gene SMPD1 coding for sphingomyelin phosphodiesterase
    1, with a consequent lack of acid sphingomyelinase activity. ... NPD type C is a neurologic disorder
    due to mutations in the genes NPC1 or NPC2, causing a defect of cholesterol trafficking and esterification.
  claim_text: Niemann-Pick disease types A and B result from SMPD1 mutations causing acid sphingomyelinase
    deficiency, whereas type C is caused by NPC1 or NPC2 mutations.
  supports: SUPPORT
  explanation: Distinguishes the genetic and enzymatic etiology of ASMD (NPD types A/B) from NPD type
    C.

  - text: "NPD type A and B are caused by mutations in the gene SMPD1 coding for sphingomyelin phosphodiesterase 1, with a consequent lack of acid sphingomyelinase activity. ... NPD type C is a neurologic disorder due to mutations in the genes NPC1 or NPC2"
    claim_text: "Niemann-Pick disease types A and B result from SMPD1 mutations causing acid sphingomyelinase deficiency, whereas type C is caused by NPC1 or NPC2 mutations."

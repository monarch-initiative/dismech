    claim:
      about:
        disease:
          name: Asthma
          disease_term:
            preferred_term: asthma
            term:
              id: MONDO:0004979
              label: asthma
        context:
        - path: /discussions/1
          value:
            discussion_id: gap_asthma_epithelial_mucous_substates_resolution
            prompt: Which airway epithelial and goblet-cell states causally maintain mucus overproduction
              and airway remodeling in asthma, and which states are reversible downstream consequences
              of type 2 inflammation?
            kind: KNOWLEDGE_GAP
            status: OPEN
            attaches_to:
            - pathophysiology#Type 2 Immune Response / Th2 Signaling
            - pathophysiology#Mucus Overproduction
            - pathophysiology#Airway Remodeling
            rationale: The asthma entry captures type 2 signaling, mucus overproduction, and airway remodeling,
              but it does not yet distinguish reversible inflammatory epithelial states from remodeled
              mucous-cell states that continue after the trigger is removed. Recent human airway-epithelium
              perturbation data make this a tractable causal experiment rather than a descriptive subtype
              problem.
          role: ancestor
      assertion_type: Experiment
      assertion:
        experiment_id: exp_asthma_il13_mtor_airway_epithelium_resolution
        name: Patient-derived airway epithelium IL-13 withdrawal and MTOR-rescue assay
        description: Culture patient-derived bronchial epithelial cells at air-liquid interface or in
          an airway chip, induce type 2 mucous metaplasia with IL-13, withdraw the cytokine, and test
          whether MTOR inhibition separates reversible mucus induction from persistent remodeling-associated
          epithelial states.
        experiment_type:
          preferred_term: primary human epithelial perturbation experiment
        model_systems:
        - name: Patient-derived bronchial air-liquid-interface epithelium
          description: Differentiated human airway epithelial culture preserving basal, ciliated, and
            mucus-producing epithelial states for controlled cytokine withdrawal and epithelial-state
            resolution assays.
          experimental_model_type: PRIMARY_CELL_CULTURE
          organism:
            preferred_term: human
            term:
              id: NCBITaxon:9606
              label: Homo sapiens
          tissue_term:
            preferred_term: bronchus
            term:
              id: UBERON:0002185
              label: bronchus
          cell_types:
          - preferred_term: bronchial epithelial cell
            term:
              id: CL:0002328
              label: bronchial epithelial cell
          - preferred_term: goblet cell
          - preferred_term: ciliated epithelial cell
          cell_source: primary bronchial epithelial cells from severe asthma and non-asthma donors
          culture_system: air-liquid-interface culture with optional microfluidic airway-chip format
        perturbations:
        - name: IL-13 type 2 cytokine exposure and withdrawal
          target: pathophysiology#Type 2 Immune Response / Th2 Signaling
          description: Timed IL-13 stimulation followed by withdrawal to induce and then test resolution
            of type 2 mucous metaplasia.
          gene:
            preferred_term: IL13
            term:
              id: hgnc:5973
              label: IL13
          biological_processes:
          - preferred_term: type 2 immune response
            term:
              id: GO:0042092
              label: type 2 immune response
        - name: MTOR pathway inhibition
          target: pathophysiology#Mucus Overproduction
          description: Rapamycin or matched MTOR-pathway perturbation used to test whether epithelial
            growth and migration programs maintain mucous-cell remodeling.
          gene:
            preferred_term: MTOR
          biological_processes:
          - preferred_term: regulation of cell population proliferation
            term:
              id: GO:0042127
              label: regulation of cell population proliferation
        readouts:
        - name: MUC5AC mucous metaplasia
          target: pathophysiology#Mucus Overproduction
          description: MUC5AC-positive goblet-cell abundance and mucin secretion after IL-13 exposure,
            cytokine withdrawal, and MTOR inhibition.
          assays:
          - preferred_term: immunofluorescence assay
          - preferred_term: mucin secretion assay
          direction: POSITIVE
        - name: Basal-to-apical epithelial migration and proliferation
          target: pathophysiology#Airway Remodeling
          description: BrdU/Ki-67 and spatial-position readouts that test whether mucous metaplasia is
            coupled to epithelial proliferation and migration.
          biological_processes:
          - preferred_term: cell migration
            term:
              id: GO:0016477
              label: cell migration
          - preferred_term: cell population proliferation
            term:
              id: GO:0008283
              label: cell population proliferation
          assays:
          - preferred_term: proliferation assay
          direction: POSITIVE
        - name: Epithelial-state resolution
          target: pathophysiology#Airway Remodeling
          description: Single-cell transcriptomic recovery of basal, secretory, goblet, and ciliated epithelial-state
            proportions after cytokine withdrawal.
          assays:
          - preferred_term: single-cell transcriptomic profiling
          direction: NEGATIVE
        controls:
        - name: Non-asthma donor airway epithelium
          description: Matched epithelial cultures from donors without asthma.
        - name: Vehicle-treated airway epithelium
          description: Air-liquid-interface cultures receiving vehicle rather than IL-13 or MTOR inhibitor.
        decision_criterion: A persistent epithelial knowledge gap is resolved if a mucous-cell state remains
          after IL-13 withdrawal in severe-asthma cultures and is reduced by MTOR inhibition along with
          proliferation or migration readouts. Reversibility is supported if withdrawal alone restores
          epithelial-state proportions and MUC5AC secretion to non-asthma control ranges.
        would_support:
        - pathophysiology#Mucus Overproduction
        - pathophysiology#Airway Remodeling
        would_refute:
        - pathophysiology#Airway Remodeling
      selected_evidence:
        reference: PMID:40446022
        reference_title: MTOR signaling regulates the development of airway mucous cell metaplasia associated
          with severe asthma.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Airways from individuals with severe asthma showed increased MTOR signaling by RPS6 phosphorylation
        explanation: Supports MTOR signaling as a disease-relevant epithelial pathway in severe asthma
          mucous metaplasia.
      origin:
        assertion_path: /discussions/1/proposed_experiments/0
        evidence_path: /discussions/1/proposed_experiments/0/evidence/0
        context_paths:
        - /name
        - /disease_term
        - /discussions/1

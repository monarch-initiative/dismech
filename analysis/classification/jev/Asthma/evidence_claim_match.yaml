      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pgs_context_amplification
        hypothesis_label: Amplification of polygenic asthma risk in adverse contexts via shared airway-inflammation
          convergence
        status: EMERGING
        description: 'Polygenic-score-by-context (PGS×C) interactions reported for asthma in the UK Biobank
          appear to reflect amplification rather than context-specific causal variants: the same susceptibility
          loci (e.g. IL4, IL13, HLA-DQ, CDHR3) exert systematically larger effects in disease-promoting
          contexts. This entry proposes that the amplification arises because polygenic liability and
          adverse exposures — tobacco smoke, air pollution and allergen load — converge on the shared
          Airway Inflammation node, so their joint effect on the liability-threshold scale is super-additive
          rather than additive. Nagpal & Gibson (Nat Genet 2026, PMID:42443528) include asthma among the
          seven diseases showing pervasive PGS×context interactions in the UK Biobank.'
        notes: EMERGING hypothesis motivated by population-scale PGS×context analyses (primary source
          PMID:42443528; general amplification mechanism corroborated by PMID:37228747). The convergence
          claim (polygenic liability + adverse exposures → Airway Inflammation) is a mechanistic interpretation
          and is not itself established as causal — see the reverse-causation knowledge gap under discussions.
      selected_evidence:
        reference: PMID:37228747
        reference_title: Amplification is the primary mode of gene-by-sex interaction in complex human
          traits.
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: GxSex is pervasive but acts primarily through systematic sex differences in the magnitude
          of many genetic effects
        explanation: Corroborates amplification — systematic differences in the magnitude of polygenic
          effects rather than in the identity of causal variants — as the primary mode of gene-by-context
          interaction.

            whole-lung ventilation are outside the single-airway-wall formulation.
        - target: Airway Inflammation
          relationship: PERTURBS
          fidelity: LOW
          description: Represents transient inflammatory challenges and their clearance as model inputs
            that initiate remodelling and contraction feedback.
          limitations: Inflammation is reduced to agonist and mediator fields; immune-cell recruitment,
            asthma endotypes, and cytokine-specific signaling are not represented explicitly.
        variables:
        - name: Airway smooth muscle volume fraction

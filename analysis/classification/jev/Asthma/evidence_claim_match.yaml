          unit: model length
        findings:
        - statement: Mechanical stress generated by smooth-muscle contraction created a positive feedback
            loop that increased remodelling in hyper-responsive simulated airways.
        - statement: Persistent contractile tone emerged when feedback was pathological, agonist clearance

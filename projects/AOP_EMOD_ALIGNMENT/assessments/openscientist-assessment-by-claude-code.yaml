overall_verdict: PARTIALLY_SUPPORTED
summary: >-
  The report splits cleanly into a sound data-and-topology layer and a defective
  interpretive layer, and the split is the finding. Its extraction from AOP-Wiki
  is exact: all 35 Key Events and all 40 Key Event Relationship triples across
  AOPs 12, 499, 500, 552, 555, 556, 558, and 560 match the 2026-08-06 bulk XML
  snapshot, with nothing dropped or invented, including AOP 500's single
  non-adjacent KER. Its graph arithmetic also reproduces exactly from the figure
  code preserved in the job's provenance artifacts. But the unifying biological
  rationale the report builds on top of that structure - that lead is a
  well-documented calcium mimic, and that ionic mimicry at calmodulin justifies
  merging the redundant calcium Key Events - is contradicted by the very papers
  cited for it, which argue that Pb2+/calmodulin binding is opportunistic and
  allosteric and specifically cannot be described by ionic displacement. The
  structural findings are usable as they stand; the consensus-node proposals
  need a different rationale before they are, and the report's claim that no
  retrieved paper contradicted the proposal is false on its own source set.
artifacts: []
claims:
  - claim_id: ke-ker-extraction-faithful-to-aop-wiki
    statement: >-
      The union of the eight lead-stressor AOPs comprises 35 unique Key Events
      and 36 unique Key Event Relationships.
    disposition: RETAINED
    report_quote: >-
      Merging AOPs 12, 499, 500, 552, 555, 556, 558, and 560 yields **35 unique
      KEs and 36 unique KERs**
    rationale: >-
      Independently verified against the AOP-Wiki bulk XML snapshot of
      2026-08-06 (595 AOPs, 2361 KERs) held in the aop_wiki_cli cache. Per-AOP
      event membership matches exactly for all eight AOPs - 8/4/7/6/5/6/6/4
      events respectively, 35 unique, zero missing and zero extra. The 40 KER
      triples the report used likewise match the wiki's own upstream/downstream
      pairs for every AOP, collapsing to 36 unique edges, and include the one
      non-adjacent KER in AOP 500 rather than silently dropping it. This is the
      strongest part of the report and the layer downstream work can rest on.
    citations: []
  - claim_id: authored-network-decomposes-into-three-components
    statement: >-
      As authored, the eight AOPs do not form a connected network; the union
      decomposes into three weakly-connected components, and every shared Key
      Event and Key Event Relationship is strictly intra-organ.
    disposition: RETAINED
    report_quote: it decomposes into three weakly-connected components
    rationale: >-
      Reproduced exactly from the network data embedded in the report's own
      figure-generation code (artifacts/lead_aop_network.json): 3 weakly
      connected components of 17, 14, and 4 nodes, 8 Key Events used by two or
      more AOPs (341, 352, 389, 1339, 1532, 1535, 1962, 2146), and 4 reused
      edges (352-341, 2146-1339, 389-1532, 1532-1535). The intra-organ
      restriction also holds: no shared Key Event or edge bridges the
      neurodevelopmental and cardiac clusters. This finding is independent of
      the mimicry rationale below and survives its rejection.
    citations: []
  - claim_id: calcium-mimicry-as-unifying-rationale
    statement: >-
      Lead's ionic mimicry of calcium is the unifying molecular rationale that
      justifies merging the redundant calcium Key Events into a consensus node.
    disposition: REJECTED
    report_quote: >-
      The unifying molecular rationale is ionic mimicry at the calcium sensor
    rationale: >-
      The papers cited for this argue the opposite. PMID:23692958, the source of
      the 8-fold figure the report leans on, states that the effect of Pb2+ on
      Ca2+/calmodulin-regulated activities "cannot be described by the primary
      mechanism of ionic displacement (e.g., ionic mimicry)", and locates the
      significant structural change in the trans-domain linker, "due to
      Pb(2+)-binding outside of the known calcium-binding sites". Two further
      papers from the same group, consulted while checking this, agree:
      PMID:18684507 finds Pb2+ sites use 2-5 ligands against 7+/-1 for EF-hand
      Ca2+ sites and reports calmodulin changes that "appear to be unrelated to
      ionic displacement", attributing them to opportunistic binding; and
      PMID:27108875 describes "an opportunistic, allosteric binding of Pb(2+) to
      CaM, which is distinct from ionic displacement". Mimicry survives in that
      review only as one of three proposed modes, not as the unifying principle.
      The narrower claim the report could have made - that Pb2+ perturbs
      Ca2+/calmodulin signalling, and that this is shared across organs - is
      supported. The mimicry framing is not, and it is load-bearing here because
      it is also what names the report's "ionic-mimicry MIE cluster".
    citations:
      - PMID:23692958
      - PMID:18684507
      - PMID:27108875
  - claim_id: calmodulin-8fold-affinity-scope
    statement: >-
      Pb2+ binds calmodulin with approximately 8-fold higher affinity than Ca2+.
    disposition: QUALIFIED
    report_quote: >-
      Pb²⁺ binds calmodulin with **~8-fold higher affinity than Ca²⁺** in the
      N-terminal domain
    rationale: >-
      The number is accurate and correctly attributed, but it is narrower than
      its later reuse in the report implies. PMID:23692958 reports the 8-fold
      figure for the N-terminal domain only; the C-terminal domain shows a
      single higher-affinity site at roughly 3-fold, and Pb2+ displaces Ca2+
      "only in the N-terminal domain, with minimal perturbation of the
      C-terminal domain". The report states the scope correctly at first use in
      Finding 9 and then drops it when the figure is reused in the Summary and
      the Mechanistic Model section. A further qualification worth carrying:
      PMID:3964302 measured five Ca2+-binding proteins by flow dialysis and
      found calmodulin to be the exception rather than the pattern - Pb2+ ranks
      above Ca2+ for calmodulin, but is the weakest of the three metals tested
      for troponin C and parvalbumin.
    citations:
      - PMID:23692958
      - PMID:3964302
  - claim_id: no-retrieved-paper-contradicted-the-proposal
    statement: >-
      No paper retrieved during the investigation contradicted the
      consensus-node proposal.
    disposition: REJECTED
    report_quote: No retrieved paper contradicted the consensus-node proposal
    rationale: >-
      False on the report's own source set. PMID:23692958 is cited in the report's
      Evidence Base table as establishing the molecular rationale for the calcium
      consensus node, while that paper's stated purpose is to show the mechanism
      is not ionic displacement. A contradiction between an asserted rationale
      and its own citation is the kind this sentence should have caught, so the
      sentence is better read as evidence that retrieved abstracts were mined for
      supporting figures rather than read against the claim being built.
    citations:
      - PMID:23692958
  - claim_id: three-consensus-nodes-unify-the-network
    statement: >-
      Applying three consensus operations collapses the eight AOPs from three
      disconnected components into one connected component of 34 Key Events and
      39 Key Event Relationships.
    disposition: NEEDS_VERIFICATION
    report_quote: >-
      collapses the eight AOPs from three disconnected components into **one
      connected component of 34 KEs and 39 KERs**
    rationale: >-
      The graph operation itself is arithmetically sound, but two of the three
      operations are not yet independently justified. Operation A, merging
      KE1339 into KE389, is argued from the mimicry rationale rejected above and
      needs a different basis - the ontology-annotation and wiki-reuse arguments
      in Findings 4 and 6 may supply one, since KE389 and KE52 carry identical
      GO:0006816/CHEBI:39124 annotations and KE389 is the most-reused calcium
      node in the wiki, and neither of those depends on mimicry. Operation C,
      inserting an oxidative-stress node into the cardiac arm, is conceded by the
      report itself to rest on general cardiomyocyte biology rather than any
      Pb-specific cardiac KER. Held pending that rework rather than rejected: the
      merge may well be right for reasons the report did not give.
    citations: []
  - claim_id: weight-of-evidence-not-assessed
    statement: >-
      The analysis addressed network topology and node identity but not the
      empirical support for individual Key Event Relationships.
    disposition: QUALIFIED
    report_quote: >-
      **Weight-of-evidence not assessed.** This analysis addressed network
      topology and node identity, not the empirical support
    rationale: >-
      Honestly stated, and the omission matters more than the report allows -
      but the grades themselves cannot substitute for the assessment it skipped.
      Every one of the 40 relationship listings carries an ordinal evidence
      grade with none marked Not Specified (26 High, 11 Moderate, 3 Low), which
      looks like unusually complete documentation against the corpus-wide
      picture on the project page, where Not Specified accounts for roughly 34
      percent. It is not. The grade sits on the AOP's relationship listing while
      the citations sit on the KER, and nothing in the serialization couples
      them, so the grade is only worth what the KER cites behind it. On that
      test the eight AOPs split cleanly in two.
      Of the 36 unique KERs, 20 carry no references at all, no empirical-support
      free text, and no biological-plausibility free text - the fields are simply
      empty. All 20 are the cardiac KERs, spanning every relationship in AOPs
      552, 555, 556, 558, and 560. Eighteen of them are nonetheless graded High.
      The other 16 KERs, all in the neurodevelopmental AOPs 12, 499, and 500,
      are substantially documented, carrying between roughly 1,500 and 10,600
      characters of references (on the order of 11 to 118 citations each) plus
      empirical-support and biological-plausibility narrative.
      The grades run backwards to that documentation. All three Low grades and
      seven of the nine Moderates sit on the neuro KERs that actually cite
      literature, while the cardiac KERs that cite nothing are almost uniformly
      High. The same inversion holds at AOP level: AOP 12 is the only
      OECD-endorsed pathway of the eight and carries the only Low grades, while
      the unreviewed cardiac AOPs 552 and 555 self-report High on both axes
      throughout. Whatever else the consensus-node proposal has to answer for,
      it merges a documented neurodevelopmental half with an undocumented
      cardiac half as though they were peers, and no ordinal grade in the wiki
      records that difference.
    citations: []

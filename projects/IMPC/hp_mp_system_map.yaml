# Hand-curated correspondence between HPO organ-system classes (direct
# children of HP:0000118 Phenotypic abnormality) and the IMPC top-level MP
# phenotype categories, used only for the coarse system-level concordance in
# impc_disease_concordance.py. Labels are copied from hp.obo (2026-09-01) and
# from the IMPC genotype-phenotype `top_level_mp_term_name` field.
#
# An HP system with no MP counterpart (empty list) is excluded from the
# recall denominator: IMPC cannot reproduce it by construction. Neoplasm is the
# important one -- the adult pipeline ends at about 16 weeks and has no tumour
# screen -- and "Abnormal cellular phenotype" has no IMPC category either.
systems:
  - {hp_id: "HP:0000119", hp_label: Abnormality of the genitourinary system, mp_top_levels: [renal/urinary system phenotype, reproductive system phenotype]}
  - {hp_id: "HP:0000152", hp_label: Abnormality of head or neck, mp_top_levels: [craniofacial phenotype]}
  - {hp_id: "HP:0000478", hp_label: Abnormality of the eye, mp_top_levels: [vision/eye phenotype]}
  - {hp_id: "HP:0000598", hp_label: Abnormality of the ear, mp_top_levels: [hearing/vestibular/ear phenotype]}
  - {hp_id: "HP:0000707", hp_label: Abnormality of the nervous system, mp_top_levels: [nervous system phenotype, behavior/neurological phenotype]}
  - {hp_id: "HP:0000769", hp_label: Abnormality of the breast, mp_top_levels: []}
  - {hp_id: "HP:0000818", hp_label: Abnormality of the endocrine system, mp_top_levels: [endocrine/exocrine gland phenotype]}
  - {hp_id: "HP:0001197", hp_label: Abnormality of prenatal development or birth, mp_top_levels: [embryo phenotype, mortality/aging]}
  - {hp_id: "HP:0001507", hp_label: Growth abnormality, mp_top_levels: [growth/size/body region phenotype]}
  - {hp_id: "HP:0001574", hp_label: Abnormality of the integument, mp_top_levels: [integument phenotype, pigmentation phenotype]}
  - {hp_id: "HP:0001608", hp_label: Abnormality of the voice, mp_top_levels: []}
  - {hp_id: "HP:0001626", hp_label: Abnormality of the cardiovascular system, mp_top_levels: [cardiovascular system phenotype]}
  - {hp_id: "HP:0001871", hp_label: Abnormality of blood and blood-forming tissues, mp_top_levels: [hematopoietic system phenotype]}
  - {hp_id: "HP:0001939", hp_label: Abnormality of metabolism/homeostasis, mp_top_levels: [homeostasis/metabolism phenotype, adipose tissue phenotype]}
  - {hp_id: "HP:0002086", hp_label: Abnormality of the respiratory system, mp_top_levels: [respiratory system phenotype]}
  - {hp_id: "HP:0002664", hp_label: Neoplasm, mp_top_levels: []}
  - {hp_id: "HP:0002715", hp_label: Abnormality of the immune system, mp_top_levels: [immune system phenotype]}
  - {hp_id: "HP:0025031", hp_label: Abnormality of the digestive system, mp_top_levels: [digestive/alimentary phenotype, liver/biliary system phenotype]}
  - {hp_id: "HP:0025142", hp_label: Constitutional symptom, mp_top_levels: []}
  - {hp_id: "HP:0025354", hp_label: Abnormal cellular phenotype, mp_top_levels: []}
  - {hp_id: "HP:0033127", hp_label: Abnormality of the musculoskeletal system, mp_top_levels: [skeleton phenotype, muscle phenotype]}
  - {hp_id: "HP:0040064", hp_label: Abnormality of limbs, mp_top_levels: [limbs/digits/tail phenotype]}
  - {hp_id: "HP:0045027", hp_label: Abnormality of the thoracic cavity, mp_top_levels: []}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>dismech curator</title>
  </head>
  <body>
    <header>
      <span class="logo" aria-hidden="true"></span>
      <h1>dismech curator</h1>
      <a id="settings-link" href="#" title="Settings" aria-label="Settings">⚙</a>
    </header>

    <div id="status" class="status" hidden></div>

    <main id="form" hidden>
      <div class="kind-row">
        <span id="kind-badge" class="badge">detecting…</span>
        <span id="id-chips" class="chips"></span>
      </div>

      <label for="title">Issue title</label>
      <input id="title" type="text" autocomplete="off" />

      <label for="labels">Labels</label>
      <input id="labels" type="text" autocomplete="off" />

      <label for="body">Issue body</label>
      <textarea id="body" rows="12" spellcheck="false"></textarea>

      <div class="actions">
        <button id="create" class="primary">Create issue</button>
        <button id="copy" class="ghost" title="Copy body to clipboard">Copy</button>
      </div>
      <p id="mode-note" class="note"></p>
    </main>

    <script src="issue.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

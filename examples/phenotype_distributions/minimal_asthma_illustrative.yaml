# The smallest thing this schema can express. Read this one first.
#
# `charmpheno_population_eds.yaml` is the same shape filled in from a real
# model export, and carries everything that comes with real numbers —
# seventeen-digit weights, pinned commit provenance, and caveats about what a
# component does and does not mean. Useful, but not the place to learn the
# shape from.
#
# The weights are invented, which is what `provenance_tier: ILLUSTRATIVE` says.
# The renderer refuses to write an ILLUSTRATIVE set into `references_cache/`,
# so nothing here can become citable.
#
# The codes are meant to be the real OMOP concept ids for these conditions, so
# a reader can look one up and have it resolve. Worth knowing that nothing
# here checks that: `code` and `code_label` are validated against no
# vocabulary, unlike the MONDO term below, which `--check-terms` resolves
# against the ontology. A plausible-looking wrong code would pass every gate
# in this repo.

collection_id: EXAMPLE-MINIMAL-ASTHMA-001
name: Minimal phenotype profile set
provenance_tier: ILLUSTRATIVE

description: >-
  A profile set is one disease, one fitted model, and the profiles that came
  out of it. A profile is one recurring pattern in that cohort: a label, and a
  list of clinical codes with weights, grouped by the domain the codes came
  from. That is the whole shape.

# Declared once for the set. Every profile below is about this cohort.
disease:
  disease_name: Asthma
  disease_term:
    term_id: MONDO:0004979
    term_label: asthma

profile_source:
  resource: Illustrative example — not a real model run
  method: COMPUTATIONAL_INFERENCE
  weight_basis: >-
    Fraction of the whole fitted corpus. Required whenever a profile carries a
    `profile_weight`, because a share over a corpus and a share over one
    disease arm differ by orders of magnitude and look identical.

profiles:

- profile_id: EXAMPLE-ASTHMA-EXACERBATION-001
  profile_label: Frequent exacerbation with oral corticosteroid use
  # This profile's share of the fitted corpus — not a patient frequency.
  profile_weight: 0.02
  code_distributions:
  - clinical_domain: CONDITION
    # Codes are opaque identifiers; the vocabulary says how to resolve them.
    # These are clinical codes, not ontology terms — do not read them as HPO.
    code_vocabulary: OMOP_CONCEPT_ID
    # Top-N export, so the weights do not sum to 1. Saying so is what
    # distinguishes a truncated list from a distribution that lost mass.
    truncated: true
    description: >-
      The three highest-weighted codes, so the weights sum to ~0.55 rather
      than 1.
    weighted_codes:
    # A code's weight is its mass within this distribution. It is not the
    # frequency of that finding among patients, and the two are easy to
    # confuse because both look like proportions.
    - code: '317009'
      code_label: Asthma
      code_weight: 0.31
    - code: '255573'
      code_label: Chronic obstructive lung disease
      code_weight: 0.14
    - code: '4145356'
      code_label: Wheezing
      code_weight: 0.10

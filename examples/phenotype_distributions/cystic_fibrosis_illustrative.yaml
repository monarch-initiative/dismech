collection_id: EXAMPLE-CF-ILLUSTRATIVE-001
name: Illustrative phenotype distributions for Cystic Fibrosis
provenance_tier: ILLUSTRATIVE
description: >-
  Worked example of the statistical phenotype-distribution schema, exercising
  the four distribution shapes it is meant to carry: a binary occurrence
  (Beta posterior on a proportion), a continuous onset age (lognormal plus
  empirical bins and quantiles), a censored time-to-event (Kaplan-Meier), a
  count (negative binomial with a sex contrast), and a laboratory value
  (normal with interpretation bins).

  IMPORTANT — the numeric values in this file are ILLUSTRATIVE PLACEHOLDERS
  from a synthetic cohort. They are not curated estimates and must not be
  imported into any kb/ entry. Every `dismech_bindings` entry is therefore
  `import_status: PROPOSED` with the synthetic origin restated in
  `binding_notes`. The one exception is the literature evidence line on record
  CF-PI-PROPORTION-001, which quotes a real, cache-verified snippet
  (PMID:30986316, already cited by kb/disorders/Cystic_Fibrosis.yaml) and is
  scoped to the qualitative claim that snippet actually supports — which is
  precisely why its `strength_of_evidence_provided` is WEAK for a quantitative
  proposition it can only partly address.

disease:
  disease_name: Cystic Fibrosis
  disease_term:
    term_id: MONDO:0009061
    term_label: cystic fibrosis

source:
  source_name: Synthetic illustrative cohort (dismech schema example)
  source_type: SIMULATION
  source_version: '1'
  retrieved_date: '2026-07-31'
  license: BSD-3-Clause
  description: >-
    Values generated to demonstrate the schema. No real patient data, no real
    registry extract, and no numeric claim attributable to any publication.


cohorts:
- cohort_id: SYNTH-CF-EHR
  name: Synthetic CF EHR cohort
  data_source_type: EHR
  data_source_name: Synthetic health system extract
  ascertainment: CLINIC_BASED_REFERRAL
  case_definition: >-
    Two or more CF diagnosis codes on distinct dates, or one code plus a
    confirmatory sweat chloride result.
  geography: Synthetic
  care_setting: Mixed inpatient and outpatient
  n_individuals: 1240
  observation_start: '2010-01-01'
  observation_end: '2024-12-31'
  identification_steps:
  # Illustrating the full multi-vocabulary chain: name the disease in an
  # ontology, cross to the terminology the data are coded in, then walk that
  # terminology's hierarchy. Each hop can change who is counted, so each is a
  # step rather than a single "identification vocabulary" string.
  - step_role: SEED
    identification_vocabulary: MONDO
    identification_terms:
    - MONDO:0009061
    description: The disease as a human would name it.
  - step_role: MAPPING
    identification_vocabulary: SNOMED_CT
    identification_vocabulary_detail: SNOMED CT International, synthetic release
    identification_terms:
    - SNOMEDCT:190905008
    mapping_relation: EXACT_MATCH
    description: >-
      Crossed on an exact-synonym mapping, so the SNOMED selection still means
      what the MONDO seed means. A BROAD_MATCH here would widen the cohort
      without changing its label — which is the thing this slot exists to make
      visible.
  - step_role: EXPANSION
    identification_vocabulary: SNOMED_CT
    expansion_direction: SELF_AND_DESCENDANTS
    description: >-
      Sub-cohorts are assembled by walking down from the mapped concept. Walking
      up instead would build the super-cohort this one is contrasted against.
  - step_role: RESTRICTION
    description: >-
      Two codes on distinct dates, or one plus a confirmatory sweat chloride.
      The restriction is the same rule stated in `case_definition`; it appears
      here as a step so the chain is complete end to end.
- cohort_id: SYNTH-CF-NBS
  name: Synthetic newborn-screened CF cohort
  data_source_type: REGISTRY
  ascertainment: NEWBORN_SCREENING
  n_individuals: 860
  geography: Synthetic
  person_time: 7420.0
  person_time_unit: person-years
  identification_steps:
  - step_role: SEED
    identification_vocabulary: MONDO
    identification_terms:
    - MONDO:0009061
    description: >-
      Registry entry follows a positive newborn screen and diagnostic
      confirmation, so no terminology crossing is involved — a one-step chain is
      the normal case, and the point of the list is that it does not have to be.
- cohort_id: SYNTH-CF-DIAG
  name: Synthetic diagnostic sweat-test series
  data_source_type: EHR
  ascertainment: CLINIC_BASED_REFERRAL
  n_individuals: 512
  identification_steps:
  - step_role: SEED
    identification_vocabulary: LOINC
    identification_terms:
    - LOINC:2077-6
    description: >-
      Identified by the test performed rather than by a disease term: the series
      is everyone who had a quantitative sweat chloride, which is why it is a
      separate cohort from the diagnosed one and not a stratum of it.

generated_date: '2026-07-31'

tracked_issues:
- https://github.com/monarch-initiative/dismech/issues/7439

distributions:

# -- 1. Binary occurrence: Beta posterior on a phenotype proportion ----------
- record_id: CF-PI-PROPORTION-001
  measure_type: PHENOTYPE_PROPORTION
  measure_description: >-
    Proportion of a diagnosed CF cohort with exocrine pancreatic insufficiency
    at any point during follow-up.
  phenotype:
    preferred_term: Exocrine Pancreatic Insufficiency
    phenotype_term:
      term_id: HP:0001738
      term_label: Exocrine pancreatic insufficiency
    phenotype_definition: >-
      At least one recorded diagnosis of exocrine pancreatic insufficiency, or
      a dispensed pancreatic enzyme replacement therapy on two or more distinct
      dates at least 30 days apart.
  cohort_ref: SYNTH-CF-EHR
  distribution:
    family: BETA
    parameterization_note: >-
      Conjugate Beta(alpha, beta) posterior from a Beta(1, 1) prior with 1069
      of 1240 individuals affected; alpha = 1 + successes, beta = 1 + failures.
    estimation_framework: BAYESIAN_POSTERIOR
    n_observations: 1240
    n_events: 1069
    support_lower: 0.0
    support_upper: 1.0
    parameters:
    - parameter_name: alpha
      symbol: α
      value: 1070.0
      description: Posterior shape parameter for the affected count.
    - parameter_name: beta
      symbol: β
      value: 172.0
      description: Posterior shape parameter for the unaffected count.
    summary:
      point_estimate: 0.862
      point_estimate_type: POSTERIOR_MEAN
      interval_lower: 0.842
      interval_upper: 0.881
      interval_type: CREDIBLE_EQUAL_TAILED
      interval_level: 0.95
      standard_deviation: 0.0098
  implied_frequency_class: VERY_FREQUENT
  implied_frequency_basis: >-
    Posterior mean 0.862 falls in the HPO 80-99% band, and the whole 95%
    credible interval (0.842-0.881) lies inside that band, so the banding does
    not depend on which point estimate is used.
  bias_risks:
  - ASCERTAINMENT_BIAS
  - SINGLE_SITE
  - PHENOTYPE_MISCLASSIFICATION
  caveats:
  - >-
    Referral-clinic ascertainment enriches for classic pancreatic-insufficient
    genotypes; a newborn-screened population cohort would be expected to give a
    lower proportion.
  - >-
    Enzyme-replacement dispensing is a proxy for insufficiency and will
    misclassify individuals treated empirically.
  evidence_lines:
  - evidence_line_id: CF-PI-PROPORTION-001-EL1
    evidence_line_type: Cohort frequency estimate
    direction_of_evidence_provided: SUPPORT
    strength_of_evidence_provided: MODERATE
    description: >-
      The cohort estimate directly addresses the proposition, with a narrow
      credible interval, but comes from a single referral-based site.
    target_proposition:
      proposition_id: CF-PI-PROP
      subject: MONDO:0009061
      predicate: has_phenotype_with_frequency
      object: HP:0001738
      statement_text: >-
        Exocrine pancreatic insufficiency occurs in 80-99% of individuals with
        cystic fibrosis.
    has_evidence_items:
    - data_item_id: CF-PI-PROPORTION-001-DI1
      data_type: STATISTIC
      item_value: >-
        Exocrine pancreatic insufficiency, PHENOTYPE_PROPORTION, Beta posterior
        mean 0.862 (95% credible interval 0.842-0.881), n=1240.
      numeric_value: 0.862
      reported_in:
        id: dismech:examples/phenotype_distributions/cystic_fibrosis_illustrative.yaml
        document_type: DATA_ANALYSIS_REPORT
        name: Synthetic illustrative cohort (dismech schema example)
    contributor:
    - id: https://github.com/monarch-initiative/dismech
      name: dismech schema example
      agent_type: SOFTWARE
    specified_by:
      id: CF-PI-PROPORTION-001-ACT
      name: Conjugate Beta posterior estimation
      activity_type: STATISTICAL_ANALYSIS
      date: '2026-07-31'
      activity_parameters:
      - 'prior: Beta(1, 1)'
      - 'interval: equal-tailed 95% credible'
  - evidence_line_id: CF-PI-PROPORTION-001-EL2
    evidence_line_type: Qualitative literature corroboration
    direction_of_evidence_provided: PARTIAL
    strength_of_evidence_provided: WEAK
    description: >-
      A review describes pancreatic insufficiency as characteristic of CF. That
      supports the direction of the claim but says nothing about the 80-99%
      band, so it is PARTIAL and WEAK for this quantitative proposition even
      though it would be SUPPORT and STRONG for the qualitative one. Separating
      direction from strength is what lets both facts be stated at once.
    target_proposition:
      proposition_id: CF-PI-PROP
      subject: MONDO:0009061
      predicate: has_phenotype_with_frequency
      object: HP:0001738
      statement_text: >-
        Exocrine pancreatic insufficiency occurs in 80-99% of individuals with
        cystic fibrosis.
    has_evidence_items:
    - data_item_id: CF-PI-PROPORTION-001-DI2
      data_type: TEXT_SPAN
      item_value: >-
        Cystic fibrosis (CF) is an autosomal recessive disease characterized by
        pancreatic insufficiency and chronic endobronchial airway infection.
      reported_in:
        id: PMID:30986316
        document_type: REVIEW
        name: Review of Cystic Fibrosis.
  dismech_bindings:
  - target_kind: DISEASE
    target_entry: Cystic_Fibrosis
    target_section: PHENOTYPE_FREQUENCY
    target_path: phenotypes#Exocrine Pancreatic Insufficiency
    evidence_reference: PHENODIST:CF-PI-PROPORTION-001
    proposed_value: VERY_FREQUENT
    import_status: PROPOSED
    binding_notes: >-
      Illustrative only — the underlying cohort is synthetic. Do not import.

# -- 2. Continuous onset age: lognormal plus empirical bins and quantiles ----
- record_id: CF-AGE-AT-DIAGNOSIS-001
  measure_type: AGE_AT_DIAGNOSIS
  measure_description: Age at first CF diagnosis in a newborn-screened era cohort.
  unit: years
  phenotype:
    preferred_term: Cystic fibrosis diagnosis
    phenotype_definition: >-
      Date of the first qualifying CF diagnosis code, relative to date of birth.
  cohort_ref: SYNTH-CF-NBS
  distribution:
    family: LOGNORMAL
    parameterization_note: >-
      meanlog and sdlog are the mean and standard deviation of log(age in
      years); the distribution is heavily right-skewed because screening
      diagnoses cluster in infancy while a long tail is diagnosed in adulthood.
    estimation_framework: MAXIMUM_LIKELIHOOD
    n_observations: 860
    support_lower: 0.0
    unit: years
    parameters:
    - parameter_name: meanlog
      symbol: μ
      value: -1.42
      standard_error: 0.05
    - parameter_name: sdlog
      symbol: σ
      value: 1.36
      standard_error: 0.04
    summary:
      point_estimate: 0.24
      point_estimate_type: MEDIAN
      interval_lower: 0.21
      interval_upper: 0.28
      interval_type: CONFIDENCE
      interval_level: 0.95
      median: 0.24
      iqr_lower: 0.09
      iqr_upper: 0.71
      minimum_observed: 0.01
      maximum_observed: 41.2
      skewness: 4.8
      unit: years
    quantiles:
    - quantile: 0.1
      value: 0.05
      unit: years
    - quantile: 0.5
      value: 0.24
      unit: years
    - quantile: 0.9
      value: 2.6
      unit: years
    - quantile: 0.99
      value: 22.4
      unit: years
    bins:
    - bin_label: 0-1 month
      lower_bound: 0.0
      upper_bound: 0.083
      count: 402
      proportion: 0.467
    - bin_label: 1 month to 1 year
      lower_bound: 0.083
      upper_bound: 1.0
      count: 291
      proportion: 0.338
    - bin_label: 1-18 years
      lower_bound: 1.0
      upper_bound: 18.0
      count: 131
      proportion: 0.152
    - bin_label: 18 years and older
      lower_bound: 18.0
      count: 36
      proportion: 0.042
    goodness_of_fit:
    - statistic_name: Kolmogorov-Smirnov D
      value: 0.031
      p_value: 0.38
      description: No evidence against the lognormal fit.
  bias_risks:
  - SELECTION_BIAS
  caveats:
  - >-
    Restricted to a screened birth cohort; the adult tail is truncated by the
    observation window rather than by biology.
  dismech_bindings:
  - target_kind: DISEASE
    target_entry: Cystic_Fibrosis
    target_section: PHENOTYPE_ONSET
    evidence_reference: PHENODIST:CF-AGE-AT-DIAGNOSIS-001
    import_status: PROPOSED
    binding_notes: Illustrative only — synthetic cohort. Do not import.

# -- 3. Censored time-to-event: Kaplan-Meier --------------------------------
- record_id: CF-PSEUDOMONAS-TTE-001
  measure_type: TIME_TO_EVENT
  measure_description: >-
    Time from birth to first chronic Pseudomonas aeruginosa airway infection.
  unit: years
  phenotype:
    preferred_term: Chronic Pseudomonas aeruginosa airway infection
    phenotype_term:
      term_id: HP:0002205
      term_label: Recurrent respiratory infections
    phenotype_definition: >-
      Modified Leeds criteria — more than 50% of respiratory cultures in a
      rolling 12-month window positive for P. aeruginosa.
    notes: >-
      The bound HPO term is broader than the operational definition; this is the
      normal case, and it is why `phenotype_definition` is the field that
      determines comparability rather than the term.
  cohort_ref: SYNTH-CF-NBS
  distribution:
    family: KAPLAN_MEIER
    estimation_framework: EMPIRICAL_TABULATION
    n_observations: 860
    n_events: 388
    n_censored: 472
    discrete: false
    unit: years
    time_to_event:
      time_unit: years
      median_time_to_event: 14.6
      interval_lower: 13.1
      interval_upper: 16.9
      interval_type: CONFIDENCE
      interval_level: 0.95
      cumulative_incidence: true
      competing_risks:
      - Death before chronic infection
      - Lung transplantation
      curve:
      - time: 0.0
        at_risk: 860
        events_at_time: 0
        probability: 0.0
      - time: 5.0
        at_risk: 762
        events_at_time: 64
        probability: 0.089
        interval_lower: 0.071
        interval_upper: 0.111
      - time: 10.0
        at_risk: 601
        events_at_time: 121
        probability: 0.271
        interval_lower: 0.241
        interval_upper: 0.303
      - time: 15.0
        at_risk: 402
        events_at_time: 118
        probability: 0.511
        interval_lower: 0.472
        interval_upper: 0.550
      - time: 20.0
        at_risk: 244
        events_at_time: 85
        probability: 0.668
        interval_lower: 0.625
        interval_upper: 0.709
  bias_risks:
  - INCOMPLETE_FOLLOW_UP
  caveats:
  - >-
    Reporting this as a single lifetime percentage would discard the age at
    which it applies; the estimand is a curve, not a proportion.
  dismech_bindings:
  - target_kind: DISEASE
    target_entry: Cystic_Fibrosis
    target_section: PROGRESSION
    evidence_reference: PHENODIST:CF-PSEUDOMONAS-TTE-001
    import_status: PROPOSED
    binding_notes: Illustrative only — synthetic cohort. Do not import.

# -- 4. Counts with a stratum and a contrast: negative binomial -------------
- record_id: CF-EXACERBATION-COUNT-F-001
  measure_type: EVENT_COUNT
  measure_description: >-
    Pulmonary exacerbations requiring intravenous antibiotics per person-year,
    among adult women.
  unit: events per person-year
  phenotype:
    preferred_term: Pulmonary exacerbation requiring intravenous antibiotics
    phenotype_definition: >-
      An inpatient admission or home-IV course with a respiratory indication and
      at least 10 days of intravenous antibiotics.
  cohort:
    cohort_id: SYNTH-CF-EHR-ADULT-FEMALE
    name: Adult women within the synthetic CF EHR cohort
    data_source_type: EHR
    ascertainment: CLINIC_BASED_REFERRAL
    n_individuals: 318
    person_time: 1590.0
    person_time_unit: person-years
    notes: >-
      The subset of SYNTH-CF-EHR selected by this record's `strata`, described
      inline rather than by `cohort_ref` because its denominator differs: 318
      women contributing 1,590 person-years, not the parent cohort's 1,240
      people. Re-declaring the parent's id with a different count would make two
      incompatible cohorts share one identity — inline is for a population
      specific to one record, `cohort_ref` for a shared one.
  strata:
  - variable: SEX
    variable_label: sex
    stratum_value: FEMALE
  - variable: AGE
    variable_label: age at start of follow-up
    stratum_value: 18 years and older
    lower_bound: 18.0
    unit: years
  distribution:
    family: NEGATIVE_BINOMIAL
    parameterization_note: >-
      Mean-dispersion parameterization: mu is the expected count per
      person-year, theta the dispersion (variance = mu + mu^2 / theta). Not the
      r/p parameterization.
    estimation_framework: MAXIMUM_LIKELIHOOD
    n_observations: 1590
    n_events: 2130
    support_lower: 0.0
    parameters:
    - parameter_name: mu
      symbol: μ
      value: 1.34
      standard_error: 0.07
    - parameter_name: theta
      symbol: θ
      value: 1.82
      standard_error: 0.21
      description: Dispersion; theta well below infinity rules out a Poisson fit.
    summary:
      point_estimate: 1.34
      point_estimate_type: RATE
      interval_lower: 1.21
      interval_upper: 1.48
      interval_type: CONFIDENCE
      interval_level: 0.95
      variance: 2.33
      unit: events per person-year
    goodness_of_fit:
    - statistic_name: Likelihood-ratio test vs Poisson
      value: 214.6
      p_value: 0.0
      description: Strong overdispersion; a Poisson model would understate the variance.
  comparison:
    reference_group:
      name: Adult men in the same cohort
      n_individuals: 341
      strata:
      - variable: SEX
        variable_label: sex
        stratum_value: MALE
    effect_measure: Incidence rate ratio (female vs male)
    effect_value: 1.19
    interval_lower: 1.04
    interval_upper: 1.36
    interval_type: CONFIDENCE
    interval_level: 0.95
    p_value: 0.011
    adjusted_for:
    - age
    - baseline FEV1 percent predicted
    - CFTR modulator exposure
  bias_risks:
  - UNADJUSTED_MULTIPLICITY
  - SINGLE_SITE
  dismech_bindings:
  - target_kind: DISEASE
    target_entry: Cystic_Fibrosis
    target_section: PROGRESSION
    evidence_reference: PHENODIST:CF-EXACERBATION-COUNT-F-001
    import_status: PROPOSED
    binding_notes: Illustrative only — synthetic cohort. Do not import.

# -- 5. Laboratory value: normal with interpretation bins -------------------
- record_id: CF-SWEAT-CHLORIDE-001
  measure_type: LABORATORY_VALUE
  measure_description: >-
    Distribution of diagnostic sweat chloride concentration among individuals
    with two CF-causing CFTR variants.
  unit: mmol/L
  phenotype:
    preferred_term: Elevated sweat chloride
    phenotype_term:
      term_id: HP:0012236
      term_label: Elevated sweat chloride
    loinc_term:
      term_id: LOINC:2077-6
      term_label: Chloride [Moles/volume] in Sweat
    phenotype_definition: >-
      Highest sweat chloride concentration from a quantitative pilocarpine
      iontophoresis test with an adequate sweat weight.
  cohort_ref: SYNTH-CF-DIAG
  distribution:
    family: NORMAL
    parameterization_note: Mean and standard deviation on the mmol/L scale.
    estimation_framework: MAXIMUM_LIKELIHOOD
    n_observations: 512
    unit: mmol/L
    parameters:
    - parameter_name: mean
      symbol: μ
      value: 98.4
      standard_error: 0.71
    - parameter_name: sd
      symbol: σ
      value: 16.1
      standard_error: 0.50
    summary:
      point_estimate: 98.4
      point_estimate_type: MEAN
      interval_lower: 97.0
      interval_upper: 99.8
      interval_type: CONFIDENCE
      interval_level: 0.95
      standard_deviation: 16.1
      median: 98.1
      iqr_lower: 87.5
      iqr_upper: 109.0
      minimum_observed: 48.0
      maximum_observed: 148.0
      unit: mmol/L
    bins:
    - bin_label: Normal (<30 mmol/L)
      upper_bound: 30.0
      count: 0
      proportion: 0.0
    - bin_label: Intermediate (30-59 mmol/L)
      lower_bound: 30.0
      upper_bound: 60.0
      count: 11
      proportion: 0.021
    - bin_label: Abnormal (60 mmol/L and above)
      lower_bound: 60.0
      count: 501
      proportion: 0.979
      phenotype_term:
        term_id: HP:0012236
        term_label: Elevated sweat chloride
  bias_risks:
  - SELECTION_BIAS
  caveats:
  - >-
    Conditioning on two CF-causing variants removes the diagnostic grey zone the
    intermediate band exists to describe; this distribution cannot be read as
    the operating characteristic of the sweat test.
  dismech_bindings:
  - target_kind: DISEASE
    target_entry: Cystic_Fibrosis
    target_section: BIOCHEMICAL_REFERENCE_RANGE
    target_path: biochemical#Sweat Chloride
    evidence_reference: PHENODIST:CF-SWEAT-CHLORIDE-001
    import_status: PROPOSED
    binding_notes: >-
      Illustrative only — synthetic series. Also note this is an observed cohort
      distribution, which is a different object from the clinical decision
      thresholds a `reference_ranges` block records.

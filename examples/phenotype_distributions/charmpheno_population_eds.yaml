  evidence_lines:
  - evidence_line_id: CHARMPHENO-EDS-T91-CODEPROB-001-EL1
    evidence_line_type: Model-derived component composition
    direction_of_evidence_provided: SUPPORT
    strength_of_evidence_provided: WEAK
    description: >-
      The component independently recovers the recognized EDS-dysautonomia

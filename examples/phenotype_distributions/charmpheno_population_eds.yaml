# -- 4. Covariate-conditioned logistic-normal with the correlation block ----
- record_id: CHARMPHENO-EDS-T93-LOGISTICNORMAL-F63-001
  measure_type: LATENT_PHENOTYPE_WEIGHT
  measure_description: >-
    Prevalence of component 93 for a 63-year-old female document, on the latent
    eta scale, with the exported correlation structure over the EDS foreground
    components.
  latent_phenotype:
    component_id: '93'
    label: EDS hypermobility with pain and dysautonomia
    component_quality: phenotype
    estimation_scope: EDS arm only, 0.4998% of the 191,876-document corpus.
    estimation_scope_size: 959
    corpus_prevalence: 8.390437345493796e-05
    description: >-
      Bundle description: "Hypermobile EDS phenotype characterized by chronic
      widespread musculoskeletal and myofascial pain with multiple joint
      involvement, muscle pain/weakness, abnormal posture, ankle instability,
      and hand/wrist/foot complaints. Prominent orthostatic intolerance with
      postural dizziness suggests coexisting dysautonomia. Within the EDS
      subgroup, this pattern is more common in females."
    mapping_basis: >-
      Curator judgement from the top-weighted codes (muscle pain 0.10393,
      disorder of muscle 0.09093, joint pain 0.05327, multiple joint pain
      0.05309, chronic pain 0.03660). Mapped to the chronic-pain phenotype
      rather than to hypermobility as such.
    mapped_phenotype_terms:
    - preferred_term: Chronic pain
      term:
        term_id: HP:0012532
        term_label: Chronic pain
  cohort:
    cohort_id: CHARMPHENO-POPULATION-EDS
    name: CHARMPheno sampled population with gated EDS arm
    data_source_type: EHR
    ascertainment: POPULATION_BASED
    n_individuals: 191876
  strata:
  - variable: SEX
    variable_label: sex
    stratum_value: F
    notes: Reference level of the C(sex) design column; 63.78% of the corpus.
  - variable: AGE
    variable_label: age
    stratum_value: '63'
    lower_bound: 63.0
    upper_bound: 63.0
    unit: years
    notes: The bundle's default age; the covariate range is 33-83.
  distribution:
    family: LOGISTIC_NORMAL
    parameterization_note: >-
      eta ~ Normal(Gamma^T x, Sigma) with theta = softmax(eta). For the female,
      age-63 design row the linear predictor for component 93 is
      0.98307 + 0 - 0.00788 * 63 = 0.48663. Component 0 is the correlation
      reference, pinned to eta = 0 and excluded from the draw, so the exported
      correlation matrix is 99x99. The scale of Sigma is set by the exported
      eta_scale of 5.2724.
    estimation_framework: LAPLACE_APPROXIMATION
    discrete: false
    parameters:
    - parameter_name: eta_linear_predictor
      symbol: (Gamma^T x)_93
      value: 0.48663
      description: >-
        Evaluated from the exported Gamma coefficients at sex=F, age=63.
        Reported to five decimals to match the precision of the inputs, not to
        claim that precision for the estimate.
    - parameter_name: R_eds_subblock
      symbol: R
      description: >-
        Correlation sub-block over the three EDS foreground components discussed
        in this collection (91, 93, 96), extracted from the exported 99x99
        correlation matrix. A sub-block of a positive-definite matrix needs its
        own positive-definiteness check before being used for a Cholesky draw;
        that check has not been run here, hence `positive_definite` is omitted
        rather than asserted.
      matrix_value:
        matrix_kind: CORRELATION
        n_rows: 3
        n_columns: 3
        row_labels: ['91', '93', '96']
        column_labels: ['91', '93', '96']
        values:
        - 1.0
        - 0.0924
        - 0.0273
        - 0.0924
        - 1.0
        - 0.294
        - 0.0273
        - 0.294
        - 1.0
        reference_component: '0'
        identified: true
        support_count: 1124
    - parameter_name: alpha
      symbol: alpha_93
      value: 0.016749
  covariate_effects:
  - covariate: Intercept
    component: '93'
    coefficient: 0.98307
    coefficient_scale: latent logit (eta), relative to the pinned reference component 0
  - covariate: sex
    covariate_level: M
    reference_level: F
    component: '93'
    coefficient: -0.28399
    coefficient_scale: latent logit (eta), relative to the pinned reference component 0
    description: >-
      Negative for male, i.e. the component is more prevalent in female
      documents — matching the bundle's own description. A coefficient on the
      eta scale is not a probability difference and must be pushed through the
      softmax alongside every other component before it says anything about
      prevalence.
  - covariate: age
    component: '93'
    coefficient: -0.00788
    coefficient_scale: latent logit (eta) per year of age
  - covariate: sex
    covariate_level: M
    reference_level: F
    component: '91'
    coefficient: -0.26263
    coefficient_scale: latent logit (eta), relative to the pinned reference component 0
  - covariate: age
    component: '91'
    coefficient: -0.03184
    coefficient_scale: latent logit (eta) per year of age
    description: >-
      The steepest negative age slope of the three components, consistent with
      the bundle's note that the dysautonomia pattern skews younger within the
      EDS subgroup.
  - covariate: sex
    covariate_level: M
    reference_level: F
    component: '96'
    coefficient: -0.2182
    coefficient_scale: latent logit (eta), relative to the pinned reference component 0
  - covariate: age
    component: '96'
    coefficient: -0.01105
    coefficient_scale: latent logit (eta) per year of age
  bias_risks:
  - MODEL_DEPENDENT
  - APPROXIMATE_POSTERIOR
  - SCALE_NOT_CALIBRATED
  - SPARSE_STRATUM
  caveats:
  - >-
    Sigma is a property of the fit, not of this stratum; only the mean is
    conditioned on the covariates.
  - >-
    The correlation block is supported by 1,124 observations from the EDS arm,
    not by the 191,876-document corpus. Correlations among foreground components
    are only as well determined as that arm.
  - >-
    Mean-field variational inference is known to attenuate correlation
    structure, so these off-diagonal values should be read as ordering
    information rather than as calibrated correlations.
  - >-
    No standard errors are exported for the Gamma coefficients, so the
    covariate effects here are point estimates without uncertainty.
  dismech_bindings:
  - target_kind: DISEASE
    target_entry: Hypermobile_Ehlers-Danlos_Syndrome
    target_section: OTHER
    evidence_reference: PHENODIST:CHARMPHENO-EDS-T93-LOGISTICNORMAL-F63-001
    import_status: DEFERRED
    binding_notes: >-
      Deferred rather than rejected. The female skew and the negative age slope
      are the kind of covariate structure a dismech entry could eventually carry
      as a phenotype context, but not from uncalibrated point estimates with no
      standard errors; it needs either exported uncertainty or an independent
      replication.

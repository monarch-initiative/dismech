collection_id: CHARMPHENO-POPULATION-EDS-001
name: CHARMPheno population_eds profiles — Ehlers-Danlos syndrome
provenance_tier: TOOL_EXPORTED
description: >-
  Worked example of the profile side of the schema, populated from a **real
  exported model** in the CHARMPheno dashboard: the `population_eds` bundle
  (https://github.com/oneilsh/CHARMPheno, branch
  `claude/hybrid-domain-reliability-review-ckn2bq`, path
  `dashboard/public/data/population_eds/`).

  A `ProfileSet` is the smaller of the two shapes this schema carries. Where a
  `PhenotypeDistributionCollection` records the full statistical object behind a
  literature estimate — a family, its parameters, an interval, an ascertainment
  context — a profile records what co-occurs in a disease cohort, reduced to
  what a disease page can show: a label, a MONDO term, and weighted codes.

  **What this file deliberately does not carry.** An earlier draft of this
  example modelled the fit itself: component counts, inference method, the
  gated block structure, per-domain reliability, cohort arms and the
  denominators attached to them. That was the wrong altitude twice over — it is
  model *evaluation* rather than disease-page content, and it is the
  fastest-moving part of the pipeline, so encoding it here would have meant
  revising the schema every time the models moved. It now lives where it
  belongs, upstream. What survives is `profile_source`, including an open
  `profile_metadata` map for anything model-specific.

  **Provenance and status.** Every number below — code probabilities and the
  profile shares — is transcribed from that bundle's `phenotypes.json` and
  `corpus_stats.json`. Nothing is invented. What *is* curator judgement, and is
  marked as such, is the reading of an unsupervised component as a named
  clinical pattern. The bundle is a research artifact on a feature branch, not a
  published cohort study, so every `dismech_bindings` entry is `PROPOSED` or
  `REJECTED` and nothing here is citable from a kb entry yet.

profile_source:
  resource: CHARMPheno dashboard bundle population_eds
  description: >-
    Interpretable phenotype profiles from a Bayesian topic model over structured
    EHR records. The bundle carries no patient-level data — the dashboard
    generates synthetic patients in the browser from the exported parameters.
  method: COMPUTATIONAL_INFERENCE
  dataset: All of Us, harmonized OMOP records
  model_version: branch claude/hybrid-domain-reliability-review-ckn2bq
  cohort_size: 959
  url: https://github.com/oneilsh/CHARMPheno/tree/claude/hybrid-domain-reliability-review-ckn2bq/dashboard/public/data/population_eds
  profile_metadata:
  - metadata_key: cohort_definition
    metadata_value: >-
      Persons with a first EDS diagnosis (OMOP 79145 and descendants),
      contributing their 365-day post-diagnosis window; 959 of 191,876 sampled
      documents (0.4998%).
  - metadata_key: profile_share_denominator
    metadata_value: >-
      Shares are over the whole 191,876-document corpus, not over the 959-document
      EDS arm, which is why they are small; they are not occurrence rates.
  - metadata_key: vocabulary_selection
    metadata_value: 5,000 codes selected from a 10,000-code full vocabulary.

generated_date: '2026-08-02'

tracked_issues:
- https://github.com/monarch-initiative/dismech/issues/7439

profiles:

- profile_id: CHARMPHENO-EDS-HYPERMOBILE-001
  profile_label: Hypermobile Ehlers-Danlos syndrome
  disease:
    disease_name: Ehlers-Danlos Syndrome
    disease_term:
      term_id: MONDO:0020066
      term_label: Ehlers-Danlos syndrome
  profile_share: 5.9490516396083624e-05
  description: >-
    An `anchor`-quality profile, and the worked example of why that matters:
    half its mass (0.505) is the EDS type-3 code itself and a further 0.026 is
    the parent EDS code, so it largely restates its own diagnosis rather than
    describing a pattern around it. The musculoskeletal and autonomic codes
    below it are the informative part.
  code_distributions:
  - clinical_domain: CONDITION
    code_vocabulary: OMOP_CONCEPT_ID
    code_vocabulary_version: OMOP standard concepts, All of Us harmonized release
    truncated: true
    description: >-
      The eight highest-probability codes of a distribution over the 5,000-code
      vocabulary, so the weights sum to ~0.73 rather than 1.
    weighted_codes:
    - code: '4148925'
      code_label: Ehlers-Danlos syndrome, type 3
      code_weight: 0.50527
    - code: '44782549'
      code_label: Disorder of vertebral column
      code_weight: 0.03841
    - code: '761159'
      code_label: Pain of bilateral hands
      code_weight: 0.0384
    - code: '3123160'
      code_label: Autonomic failure
      code_weight: 0.03547
    - code: '437969'
      code_label: Talipes planus
      code_weight: 0.0338
    - code: '79145'
      code_label: Ehlers-Danlos syndrome
      code_weight: 0.02578
    - code: '4302537'
      code_label: Digestive system finding
      code_weight: 0.02552
    - code: '765422'
      code_label: Pain in right hip joint
      code_weight: 0.02428
  notes: >-
    Reading this profile as hypermobile EDS is a curator's judgement about an
    unsupervised component, not something the model asserted. The code weights
    are probabilities of a code given the profile; they are not the frequency of
    the finding among EDS patients, and the two are routinely confused.
  dismech_bindings:
  - target_kind: DISEASE
    target_entry: Hypermobile_Ehlers-Danlos_Syndrome
    target_section: OTHER
    evidence_reference: PHENODIST:CHARMPHENO-EDS-HYPERMOBILE-001
    import_status: REJECTED
    binding_notes: >-
      Kept as the worked example of a rejection. A profile whose dominant code
      is the disease's own diagnosis code adds nothing a dismech entry does not
      already state, and importing it would dress a tautology as evidence.

- profile_id: CHARMPHENO-EDS-DYSAUTONOMIA-001
  profile_label: EDS dysautonomia — POTS, syncope, and GI dysmotility
  disease:
    disease_name: Ehlers-Danlos Syndrome
    disease_term:
      term_id: MONDO:0020066
      term_label: Ehlers-Danlos syndrome
  profile_share: 0.00011972462747401996
  description: >-
    A `phenotype`-quality profile whose content is a genuine clinical pattern
    rather than a restatement of the anchor: tachycardia, arrhythmia, POTS,
    orthostatic hypotension, loss of consciousness, and IBS, with the EDS code
    itself third rather than dominant. The model recovers the recognized
    EDS-dysautonomia association from coding data alone.
  code_distributions:
  - clinical_domain: CONDITION
    code_vocabulary: OMOP_CONCEPT_ID
    code_vocabulary_version: OMOP standard concepts, All of Us harmonized release
    truncated: true
    description: >-
      The eight highest-probability codes of a distribution over the 5,000-code
      vocabulary, so the weights sum to ~0.71 rather than 1.
    weighted_codes:
    - code: '444070'
      code_label: Tachycardia
      code_weight: 0.15634
    - code: '44784217'
      code_label: Cardiac arrhythmia
      code_weight: 0.12954
    - code: '79145'
      code_label: Ehlers-Danlos syndrome
      code_weight: 0.1282
    - code: '4159659'
      code_label: Postural orthostatic tachycardia syndrome
      code_weight: 0.11381
    - code: '319041'
      code_label: Orthostatic hypotension
      code_weight: 0.09624
    - code: '372448'
      code_label: Loss of consciousness
      code_weight: 0.05832
    - code: '75576'
      code_label: Irritable bowel syndrome
      code_weight: 0.02688
    - code: '315078'
      code_label: Palpitations
      code_weight: 0.02577
  notes: >-
    Documents are a 365-day post-diagnosis window, so this describes coding in
    the year after EDS diagnosis rather than lifetime course.
  evidence_lines:
  - evidence_line_id: CHARMPHENO-EDS-DYSAUTONOMIA-001-EL1
    evidence_line_type: Model-derived profile composition
    direction_of_evidence_provided: SUPPORT
    strength_of_evidence_provided: WEAK
    description: >-
      The profile independently recovers the EDS-dysautonomia association from
      coding data alone, with the autonomic codes outweighing the anchor. That
      is real corroboration, but a single unsupervised profile from one fit on
      one population is weak evidence, and direction is what it establishes
      rather than magnitude.
    target_proposition:
      statement_text: >-
        Dysautonomia, including postural orthostatic tachycardia syndrome, is
        associated with Ehlers-Danlos syndrome.
    has_evidence_items:
    - data_item_id: CHARMPHENO-EDS-DYSAUTONOMIA-001-DI1
      data_type: DISTRIBUTION_PARAMETER
      item_value: >-
        Postural orthostatic tachycardia syndrome (OMOP 4159659) at 0.11381 and
        orthostatic hypotension (OMOP 319041) at 0.09624 within the profile.
      reported_in:
        id: https://github.com/oneilsh/CHARMPheno/tree/claude/hybrid-domain-reliability-review-ckn2bq/dashboard/public/data/population_eds
        document_type: DATA_ANALYSIS_REPORT
  dismech_bindings:
  - target_kind: DISEASE
    target_entry: Hypermobile_Ehlers-Danlos_Syndrome
    target_section: OTHER
    evidence_reference: PHENODIST:CHARMPHENO-EDS-DYSAUTONOMIA-001
    import_status: PROPOSED
    binding_notes: >-
      Proposed, not imported. The pattern is real and independently recognized,
      but the source is an unpublished research bundle and the profile carries
      no denominator a dismech frequency band could be derived from.

distributions:

# -- 0. Component mixture over the EDS foreground, as a vector parameter ----
- record_id: CHARMPHENO-EDS-MIXTURE-001
  measure_type: LATENT_PHENOTYPE_WEIGHT
  measure_description: >-
    Exported prior weight (alpha) across the 20 Ehlers-Danlos foreground
    components — the compositional, vector-valued form that no scalar estimate
    can carry.
  cohort:
    cohort_id: CHARMPHENO-POPULATION-EDS
    name: CHARMPheno sampled population with gated EDS arm
    data_source_type: EHR
    ascertainment: POPULATION_BASED
    n_individuals: 191876
  distribution:
    family: CATEGORICAL
    parameterization_note: >-
      The bundle's exported `alpha` sums to 1.000001 across all 100 components,
      so it is a normalized prior mean over components rather than a raw
      Dirichlet concentration vector; the export does not label which it is. It
      is recorded as a probability vector on that basis. The 20 EDS foreground
      components carry 0.206442 of the total; the remaining 0.793559 sits on the
      80 shared background components.
    estimation_framework: VARIATIONAL_POSTERIOR
    n_observations: 191876
    discrete: true
    parameters:
    - parameter_name: alpha
      symbol: alpha
      vector_value: [0.003252, 0.006389, 0.002956, 0.005287, 0.003223, 0.00494,
        0.005282, 0.004956, 0.024252, 0.006809, 0.003738, 0.067545, 0.005257,
        0.016749, 0.01538, 0.003232, 0.013647, 0.003591, 0.003875, 0.006082]
      index_labels:
      - 80 EDS diagnosis with multisystem features
      - 81 EDS dysautonomia, neuropathy, mast cell
      - 82 Ehlers-Danlos syndrome with hernias
      - 83 EDS with PCOS and musculoskeletal complications
      - 84 EDS hypermobility, injuries, IBS and migraine
      - 85 Ehlers-Danlos syndrome with cardiac findings
      - 86 EDS hypermobility, POTS and GI dysmotility
      - 87 EDS shoulder instability and laxity
      - 88 EDS pain, dysautonomia, and GI dysmotility
      - "89 EDS: joint derangement and aortic ectasia"
      - 90 EDS hypermobility, fatigue and neuropathy
      - "91 EDS dysautonomia: POTS and syncope"
      - 92 Ehlers-Danlos with spinal pain
      - 93 EDS hypermobility with pain and dysautonomia
      - 94 EDS hypermobility with hip pain
      - 95 Ehlers-Danlos with skin/vascular fragility
      - 96 Hypermobile Ehlers-Danlos syndrome
      - 97 EDS vascular-valvular disease and GI dysmotility
      - 98 Ehlers-Danlos with migraine and sprains
      - 99 EDS scoliosis and neuropathic pain
      description: >-
        Ordered as `index_labels`. Weight is concentrated: component 91
        (dysautonomia) alone holds 0.0675, a third of the foreground mass, and
        components 91, 88, 93 and 94 together hold 0.124 of the 0.206 total.
  bias_risks:
  - MODEL_DEPENDENT
  - APPROXIMATE_POSTERIOR
  caveats:
  - >-
    These are prior weights from the fit, not observed proportions of patients.
    They say how much of the model's foreground capacity each component
    occupies, which is a statement about the fit before it is a statement about
    patients.
  - >-
    Component labels are the bundle's own; several overlap substantially
    (hypermobility with pain appears in at least four), so the vector should not
    be read as a partition of distinct clinical subtypes.
  dismech_bindings:
  - target_kind: DISEASE
    target_entry: Ehlers-Danlos_Syndrome
    target_section: OTHER
    evidence_reference: PHENODIST:CHARMPHENO-EDS-MIXTURE-001
    import_status: DEFERRED
    binding_notes: >-
      Deferred. A foreground component mixture is a useful map of what an EHR
      population's EDS coding decomposes into, and it is suggestive of subtype
      structure, but it has no dismech slot until the components are
      individually mapped and reviewed.

# -- 1. Whole-population theta: a spike at zero with suppressed bins ---------
- record_id: CHARMPHENO-EDS-T96-THETA-001
  measure_type: LATENT_PHENOTYPE_WEIGHT
  measure_description: >-
    Whole-population distribution of per-document weight (theta) on component
    96, the hypermobile-EDS component.
  latent_phenotype:
    component_id: '96'
    label: Hypermobile Ehlers-Danlos syndrome
    component_quality: anchor
    estimation_scope: >-
      EDS arm only (documents whose source_cohort is `eds`), 0.4998% of the
      191,876-document corpus.
    estimation_scope_size: 959
    corpus_prevalence: 5.9490516396083624e-05
    description: >-
      Bundle description: "Hypermobile Ehlers-Danlos syndrome (type 3) with
      marked joint hyperextension, recurrent musculoskeletal pain and
      instability (patellofemoral, ankle/foot), flat feet, and back/hip pain.
      Dysautonomia and gastrointestinal complaints are frequent, with chronic
      fatigue and injury episodes also documented."
    mapping_basis: >-
      Curator judgement from the component's top-weighted codes, which are
      dominated by OMOP 4148925 "Ehlers-Danlos syndrome, type 3". The mapping to
      the dismech Hypermobile Ehlers-Danlos Syndrome entry is straightforward
      here precisely because the component is anchor-quality — which is also
      what limits what it can be used for.
    mapped_phenotype_terms:
    - preferred_term: Hypermobile Ehlers-Danlos syndrome
      term:
        term_id: MONDO:0007523
        term_label: Ehlers-Danlos syndrome, hypermobility type
  cohort:
    cohort_id: CHARMPHENO-POPULATION-EDS
    name: CHARMPheno sampled population with gated EDS arm
    data_source_type: EHR
    ascertainment: POPULATION_BASED
    n_individuals: 191876
  distribution:
    family: EMPIRICAL
    parameterization_note: >-
      Exported theta histogram over 50 equal bins spanning [0, 1] in steps of
      0.02, as per-document proportions. Bins whose cell count fell below the
      bundle's minimum of 20 documents are suppressed rather than reported.
    estimation_framework: EMPIRICAL_TABULATION
    n_observations: 191876
    support_lower: 0.0
    support_upper: 1.0
    discrete: false
    bins:
    - bin_label: '[0.00, 0.02)'
      lower_bound: 0.0
      upper_bound: 0.02
      proportion: 0.9993416097378554
    - bin_label: '[0.02, 0.04)'
      lower_bound: 0.02
      upper_bound: 0.04
      proportion: 0.0002317533722749227
    - bin_label: '[0.04, 0.06)'
      lower_bound: 0.04
      upper_bound: 0.06
      proportion: 0.00017381502920619203
    - bin_label: '[0.06, 0.08)'
      lower_bound: 0.06
      upper_bound: 0.08
      suppressed: true
      notes: Cell count below the bundle's 20-document suppression threshold.
    - bin_label: '[0.08, 0.10)'
      lower_bound: 0.08
      upper_bound: 0.1
      suppressed: true
    - bin_label: '[0.20, 0.22)'
      lower_bound: 0.2
      upper_bound: 0.22
      proportion: 0.0
      notes: >-
        A reported zero, not a suppression — the distinction the `suppressed`
        flag exists to keep.
    notes: >-
      Only the informative head of the histogram plus one reported-zero bin are
      transcribed. In the full 50-bin export, 12 bins are suppressed and the
      remainder are reported zeros.
    quantiles:
    - quantile: 0.05
      value: 0.0
    - quantile: 0.25
      value: 0.0
    - quantile: 0.5
      value: 0.0
    - quantile: 0.75
      value: 0.0
    - quantile: 0.95
      value: 0.0
    summary:
      point_estimate: 0.0
      point_estimate_type: MEDIAN
      minimum_observed: 0.0
      maximum_observed: 1.0
      notes: >-
        Every reported percentile through the 95th is exactly zero. This is the
        honest population summary and it conveys nothing about EDS patients.
  bias_risks:
  - DEGENERATE_IN_POPULATION
  - PRIVACY_NOISE_OR_SUPPRESSION
  - MODEL_DEPENDENT
  - SCALE_NOT_CALIBRATED
  caveats:
  - >-
    99.93% of documents fall in the lowest bin because the component belongs to
    an arm holding 0.5% of the corpus. The distribution that would answer a
    clinical question is the within-EDS-arm one, which this bundle does not
    export; the whole-population view is correct and uninformative.
  - >-
    Twelve of fifty bins are suppressed, all of them in the upper tail. The tail
    cannot be characterized from this export at all — not "is small", but "is
    unknown".
  - >-
    The theta scale depends on the exported eta_scale, whose selected value
    moves from 5.27 to 3.15 as the holdout fraction goes from 50% to 95%.
  dismech_bindings:
  - target_kind: DISEASE
    target_entry: Hypermobile_Ehlers-Danlos_Syndrome
    target_section: OTHER
    evidence_reference: PHENODIST:CHARMPHENO-EDS-T96-THETA-001
    import_status: REJECTED
    binding_notes: >-
      Rejected, and kept as the worked example of why. A whole-population theta
      distribution for a rare-disease component has no dismech slot: it is not a
      prevalence (the denominator is documents, not people at risk), not a
      phenotype frequency, and not interpretable as a severity scale. It would
      become importable if the bundle exported the within-arm distribution.


collection_id: CHARMPHENO-POPULATION-EDS-001
name: CHARMPheno population_eds gated STM — Ehlers-Danlos foreground phenotype profiles
provenance_tier: TOOL_EXPORTED
description: >-
  Worked example of the model-derived side of the schema, populated from a
  **real exported model** currently displayed in the CHARMPheno dashboard: the
  `population_eds` bundle
  (https://github.com/oneilsh/CHARMPheno, branch
  `claude/hybrid-domain-reliability-review-ckn2bq`, path
  `dashboard/public/data/population_eds/`).

  The bundle is a gated block-wise correlated structural topic model over the
  whole (sampled) population: 191,876 one-document-per-person records, K=100
  (80 shared background components + 20 Ehlers-Danlos foreground components),
  a 5,000-code vocabulary, and a sex-at-birth and age prevalence covariate.
  Persons with a first EDS diagnosis (OMOP 79145 and descendants) contribute
  their 365-day post-diagnosis window and are gated into the `eds` arm — 0.4998%
  of documents; everyone else contributes a deterministic random 365-day window
  anchored on one of their own condition eras and carries background components
  only.

  **Provenance and status.** Every number below — theta histograms, percentiles,
  NPMI, pair coverage, corpus prevalence, code probabilities, covariate
  coefficients, correlations, the eta scale and its standard error — is
  transcribed from that bundle's `phenotypes.json`, `model.json`,
  `covariate_effects.json`, `correlation.json`, `corpus_stats.json`,
  `covariate_schema.json`, and `gating.json`. Nothing is invented. What *is*
  curator judgement, and is marked as such throughout, is the mapping from an
  unsupervised component to a dismech phenotype. The bundle is a research
  artifact on a feature branch, not a published cohort study, so every
  `dismech_bindings` entry is `PROPOSED` or `REJECTED` and nothing here is
  citable from a kb entry yet.

  **Common denominator, not one export shape.** The schema's model layer holds
  only what every latent-phenotype model class shares — components with weighted
  features, a weight distribution, optional covariate dependence, quality
  metrics, estimation scope, provenance. This bundle's gated block structure is
  specific to one family and is recorded in `model_properties` as name/value
  pairs rather than in dedicated slots, and each component's `estimation_scope`
  carries the thing a consumer actually needs from gating: that these components
  were estimated from ~959 documents, not from 191,876. A different model class,
  or the next iteration of this one, should be recordable here without a schema
  change.

  Five records exercise the parts of the schema that scalar estimates cannot
  express, and each is chosen to demonstrate a different failure mode a curator
  has to see:

  * `...MIXTURE-001` — the prior weight vector across all 20 EDS foreground
    components: the compositional, vector-valued form, and a reminder that
    exported weights describe the fit's capacity allocation before they describe
    patients.
  * `...T96-THETA-001` — the whole-population theta distribution of the
    hypermobile-EDS component: an `EMPIRICAL` distribution that is a spike at
    zero with twelve of fifty bins suppressed for small cell counts. Technically
    correct, and useless as a population statement.
  * `...T96-CODEPROB-001` — the same component's code probabilities, where half
    the mass is the EDS type-3 code itself. An `anchor`-quality component
    largely restates its own diagnosis code.
  * `...T91-CODEPROB-001` — the dysautonomia component, a `phenotype`-quality
    component whose content is a genuine clinical pattern (POTS, orthostatic
    hypotension, syncope, GI dysmotility) rather than a restatement of the
    anchor.
  * `...T93-LOGISTICNORMAL-F63-001` — the covariate-conditioned logistic-normal
    form, with the real Gamma coefficients and the correlation sub-block.

disease:
  disease_name: Ehlers-Danlos Syndrome
  disease_term:
    term_id: MONDO:0020066
    term_label: Ehlers-Danlos syndrome
  notes: >-
    The gated arm is defined by OMOP 79145 (Ehlers-Danlos syndrome) and
    descendants, so the cohort is EDS at the umbrella level. Individual
    components resolve to more specific entities — component 96 is dominated by
    OMOP 4148925 "Ehlers-Danlos syndrome, type 3", i.e. the hypermobile type.

source:
  source_name: CHARMPheno dashboard bundle population_eds
  source_type: EHR
  source_version: branch claude/hybrid-domain-reliability-review-ckn2bq
  url: https://github.com/oneilsh/CHARMPheno/tree/claude/hybrid-domain-reliability-review-ckn2bq/dashboard/public/data/population_eds
  retrieved_date: '2026-07-31'
  description: >-
    Static dashboard artifact contract: a trained model exported as aggregate
    JSON. The bundle carries no patient-level data — the dashboard generates
    synthetic patients in the browser from the exported parameters.

model:
  model_name: population_eds
  model_family: STRUCTURAL_TOPIC_MODEL
  version: branch claude/hybrid-domain-reliability-review-ckn2bq
  n_components: 100
  component_count_inferred: false
  vocabulary_size: 5000
  covariate_formula: ~ C(sex) + age
  inference_method: STOCHASTIC_EM
  contains_patient_data: false
  artifact_url: https://github.com/oneilsh/CHARMPheno/tree/claude/hybrid-domain-reliability-review-ckn2bq/dashboard/public/data/population_eds
  description: >-
    Gated block-wise correlated STM. Design columns are Intercept,
    `C(sex)[T.M]` (F is the reference level; the corpus is 63.78% F / 36.22% M),
    and a continuous `age` main effect over the range 33-83 with a default of
    63. Vocabulary is 5,000 codes selected from a 10,000-code full vocabulary;
    4,997 are OMOP condition concepts and 3 are observation concepts. Component
    0 is the correlation reference topic, pinned to zero for identifiability.
  model_properties:
  - name: model_variant
    property_value: gated block-wise correlated STM
    description: >-
      The gated, block-wise-correlated variant. Recorded as a property rather
      than an enum value: `ModelFamilyEnum` deliberately names families only, so
      that a new variant does not require a schema change.
  - name: gating_variable
    property_value: source_cohort
    description: >-
      Document variable assigning each document to an arm. Recorded as a model
      property rather than a schema slot: gating is one family's way of
      restricting components to a subpopulation, and what a consumer needs
      downstream is each component's `estimation_scope`, not the mechanism.
  - name: gating_arms
    property_value: 'eds (0.4998% of documents); background-only (99.5002%)'
  - name: component_blocks
    property_value: >-
      components 0-79 shared background fitted across all 191,876 documents;
      components 80-99 EDS foreground estimated from the eds arm only
  - name: correlation_reference_component
    property_value: '0'
    description: Pinned to zero for identifiability; the exported correlation matrix is 99x99.
  hyperparameters:
  - parameter_name: eta_scale
    symbol: c*
    value: 5.272386501517754
    standard_error: 0.04907263129275225
    description: >-
      Latent-scale (concentration) parameter, selected by maximizing held-out
      predictive likelihood on a 50% holdout (`heldout_ll_gated`); grid argmax
      5.66, refined to 5.2724 by a log-quadratic smoother, interior to the grid.
      Held-out prediction is used deliberately rather than the in-fit estimate:
      during fitting beta co-adapts to whatever Sigma is, so a fit-derived scale
      is biased downward and makes documents look more diffuse across components
      than they are.
  - parameter_name: eta_scale_holdout_sensitivity
    symbol: c*(holdout)
    vector_value: [5.272386501517754, 3.9388681871708515, 3.152934829749566]
    index_labels:
    - 50% holdout (shipped)
    - 80% holdout
    - 95% holdout
    description: >-
      The selected scale moves with the holdout fraction, so the shipped
      standard error understates the real uncertainty in this parameter. Quoted
      here rather than buried, because the scale sets the spread of every theta
      drawn from the model.
  fit_metrics:
  - metric: PREDICTIVE_GAIN
    metric_value: 0.6997863247863247
    description: Presence-based predictive gain for component 96.
  - metric: PREDICTIVE_GAIN
    metric_value: 0.4337606837606838
    description: Presence-based predictive gain for component 91.
  - metric: PREDICTIVE_GAIN
    metric_value: 0.391025641025641
    description: Presence-based predictive gain for component 93.
  training_cohort:
    cohort_id: CHARMPHENO-POPULATION-EDS
    name: CHARMPheno sampled population with gated EDS arm
    data_source_type: EHR
    data_source_name: OMOP condition and observation records
    ascertainment: POPULATION_BASED
    case_definition: >-
      First EDS diagnosis by OMOP concept 79145 and descendants; the document is
      the 365-day window following that diagnosis. Background documents are a
      deterministic random 365-day window anchored on one of the person's own
      condition eras, so they capture real activity rather than an empty year.
    cohort_identification_vocabulary: >-
      OMOP concept 79145 and descendants. Note this differs from later
      CHARMPheno work, which identifies the target cohort with MONDO and places
      patients automatically with SNOMED — the identification vocabulary is a
      moving part and is not the same thing as the OMOP feature space the
      profiles range over.
    n_individuals: 191876
    notes: >-
      One document per person, disjoint arms. Mean 45.2 codes per document.

domains:
- domain_name: condition
  vocabulary: OMOP condition concepts (SNOMED-derived)
  feature_namespace: OMOP_CONCEPT_ID
  feature_namespace_detail: >-
    OMOP standard concepts over harmonized All of Us data. The `feature_id`
    values on this model's components are OMOP concept IDs, NOT MONDO or HPO
    terms — any ontology term on a component is a curator's mapping judgement
    recorded in `mapped_phenotype_terms`, not something the model emitted.
  n_features: 4997
  domain_role: PRIMARY
  description: >-
    Diagnosis codes. Carries essentially all the signal in this bundle.
- domain_name: observation
  vocabulary: OMOP observation concepts
  feature_namespace: OMOP_CONCEPT_ID
  n_features: 3
  domain_role: EXCLUDED
  description: Three observation concepts survived vocabulary selection.
  reliability:
    reliability_basis: SUPERVISED_HELDOUT_READOUT
    downweight_rationale: >-
      Reported as a general finding of the multi-domain readout work rather than
      a property of this bundle: across a 41-anchor disease readout the
      observation domain received zero median weight for every disease, and
      partial-precision analysis showed it acting as drag that AUROC hides.
      Measurement, by contrast, was worth roughly 2.3x observation as a third
      domain and rescued lab-defined diseases — but as a specialist channel,
      since no fixed combination rule beat the condition domain alone at macro.
      Hence `domain_role`, not a weight.


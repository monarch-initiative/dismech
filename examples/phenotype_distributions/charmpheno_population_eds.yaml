      frequency; and this component is anchor-quality, so it largely restates
      the code that defined the cohort. A record can be real, precise,
      well-provenanced and still be the wrong number for the slot.

# -- 3. Phenotype-quality component: a real clinical pattern ----------------
- record_id: CHARMPHENO-EDS-T91-CODEPROB-001
  measure_type: CODE_PROBABILITY
  measure_description: >-
    Probability of individual OMOP codes given component 91, the EDS
    dysautonomia component.
  latent_phenotype:
    component_id: '91'
    label: 'EDS dysautonomia: POTS and syncope'
    component_quality: phenotype
    estimation_scope: EDS arm only, 0.4998% of the 191,876-document corpus.
    estimation_scope_size: 959
    corpus_prevalence: 0.00011972462747401996
    description: >-
      Bundle description: "Dysautonomia in Ehlers-Danlos syndrome, dominated by
      postural orthostatic tachycardia, orthostatic hypotension,
      tachyarrhythmias, palpitations, syncope, and loss of consciousness.
      Associated features include autonomic dysfunction, migraines and
      dizziness, gastrointestinal dysmotility (IBS, chronic constipation),
      systemic mast cell disease, bleeding diathesis (von Willebrand), and
      occasional brain compression. Within the EDS subgroup this pattern skews
      younger."
    mapping_basis: >-
      Curator judgement. Unlike component 96 this is `phenotype`-quality: the
      EDS anchor code carries 0.128 of the mass while the top-weighted codes are
      a coherent autonomic pattern (tachycardia, cardiac arrhythmia, POTS,
      orthostatic hypotension, syncope) plus GI dysmotility. The mapping to POTS
      rests on OMOP 4159659 appearing at 0.114 alongside the orthostatic and
      syncopal codes, not on the component label.
    mapped_phenotype_terms:
    - preferred_term: Postural orthostatic tachycardia syndrome
      term:
        term_id: MONDO:0011479
        term_label: postural orthostatic tachycardia syndrome
    - preferred_term: Orthostatic tachycardia
      term:
        term_id: HP:0012173
        term_label: Orthostatic tachycardia
    top_features:
    - feature_id: OMOP:444070
      label: Tachycardia
      weight: 0.15634
      domain_name: condition
    - feature_id: OMOP:44784217
      label: Cardiac arrhythmia
      weight: 0.12954
      domain_name: condition
    - feature_id: OMOP:79145
      label: Ehlers-Danlos syndrome
      weight: 0.1282
      domain_name: condition
    - feature_id: OMOP:4159659
      label: Postural orthostatic tachycardia syndrome
      weight: 0.11381
      domain_name: condition
    - feature_id: OMOP:319041
      label: Orthostatic hypotension
      weight: 0.09624
      domain_name: condition
    - feature_id: OMOP:372448
      label: Loss of consciousness
      weight: 0.05832
      domain_name: condition
    - feature_id: OMOP:75576
      label: Irritable bowel syndrome
      weight: 0.02688
      domain_name: condition
    - feature_id: OMOP:315078
      label: Palpitations
      weight: 0.02577
      domain_name: condition
  cohort:
    cohort_id: CHARMPHENO-POPULATION-EDS
    name: CHARMPheno sampled population with gated EDS arm
    data_source_type: EHR
    ascertainment: POPULATION_BASED
    n_individuals: 191876
  distribution:
    family: CATEGORICAL
    parameterization_note: >-
      Probability vector over the 5,000-code vocabulary; the eight
      highest-probability codes are tabulated, so the proportions do not sum
      to 1.
    estimation_framework: VARIATIONAL_POSTERIOR
    discrete: true
    bins:
    - bin_label: 'OMOP:444070 Tachycardia'
      proportion: 0.15634
    - bin_label: 'OMOP:44784217 Cardiac arrhythmia'
      proportion: 0.12954
    - bin_label: 'OMOP:79145 Ehlers-Danlos syndrome'
      proportion: 0.1282
    - bin_label: 'OMOP:4159659 Postural orthostatic tachycardia syndrome'
      proportion: 0.11381
    - bin_label: 'OMOP:319041 Orthostatic hypotension'
      proportion: 0.09624
    - bin_label: 'OMOP:372448 Loss of consciousness'
      proportion: 0.05832
    - bin_label: 'OMOP:75576 Irritable bowel syndrome'
      proportion: 0.02688
    - bin_label: 'OMOP:315078 Palpitations'
      proportion: 0.02577
    parameters:
    - parameter_name: alpha
      symbol: alpha_91
      value: 0.067545
      description: >-
        Exported per-component concentration. The largest among the EDS
        foreground components examined here (96 is 0.013647, 93 is 0.016749),
        consistent with this being the most widely shared pattern in the arm.
  bias_risks:
  - MODEL_DEPENDENT
  - SINGLE_SITE
  - PHENOTYPE_MISCLASSIFICATION
  caveats:
  - >-
    Still a code probability conditional on the component, so it does not give

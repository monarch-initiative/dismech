    - id: https://github.com/oneilsh/CHARMPheno
      name: CHARMPheno
      agent_type: SOFTWARE
  dismech_bindings:
  - target_kind: DISEASE
    target_entry: Hypermobile_Ehlers-Danlos_Syndrome
    target_section: OTHER
    target_path: phenotypes#Orthostatic tachycardia
    evidence_reference: PHENODIST:CHARMPHENO-EDS-T91-CODEPROB-001
    import_status: PROPOSED
    binding_notes: >-
      Proposed as corroborating evidence for the existing Orthostatic
      tachycardia phenotype — NOT as a frequency value, which this record cannot

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "dismech"
description = "This is the project description."
authors = [
  {name = "My Name", email = "my-name@my-org.org"},
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dynamic = ["version"]

dependencies = [
  "beautifulsoup4>=4.14.3",
  "httpx>=0.28.1",
  "koza>=2.3.1",
  "linkml-data-qc[viz]",
  # >=0.2.1 (not the older rc2 pin): 0.2.1 is where _fetch_abstract split into
  # _fetch_pubmed_xml/_parse_abstract and _save_to_disk gained `private=`, both
  # of which src/dismech/patch_reference_validator.py now accommodates. Allowing
  # rc2 as well would keep a second, untested API shape reachable for non-dev
  # installs for no benefit.
  "linkml-reference-validator>=0.2.1",
  "linkml-runtime >=1.9.4",
  "linkml-term-validator>=0.4.4",
  "ndex2>=3.9.0,<4",
  "networkx>=3,<4",
  "oaklib>=0.7.4",
  "typer>=0.9.0",
  "markdown>=3.5",
]

[project.scripts]
dismech = "dismech.cli:main"
clingen-go = "dismech.clingen.cli:main"
dismech-cx2 = "dismech.export.cx2_export:main"
dismech-disease-inventory = "dismech.export.disease_inventory:main"
dismech-mondo-prioritize = "dismech.compare.mondo_priority:main"
dismech-node-embed = "dismech.node_embeddings.cli:main"
dismech-stubs = "dismech.stubs.cli:main"

[dependency-groups]
dev = [
    "linkml>=1.9.3",
    "mkdocs-material>=8.2.8",
    "jupyter>=1.0.0",
    "mknotebooks>=0.8.0",
    "deep-research-client[cyberian,validation]>=0.2.10",
    "pytest-xdist>=3.6.0",
]
export = [
    "biolink-model>=4.3.1",
]
embeddings = [
    "linkml-store[llm]>=0.2.0",
    "umap-learn>=0.5.0",
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "plotly>=5.0.0",
]
# Per-patho-event node embeddings (dismech.node_embeddings). model2vec is the
# default local backend; openai is optional (plug-in via --backend openai:...).
node-embeddings = [
    "numpy>=1.21.0",
    "model2vec>=0.3.0",
    "openai>=1.0.0",
]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "kb_data: whole-KB data-conformance sweep parametrized over every KB file (schema validation, required-field, foreign-key, and mechanism-target checks). Slow and CPU-bound; in CI it is gated on schema / conformance-test changes and run in parallel. Select with `just test-kb`; exclude with `just test-code` (pytest -m 'not kb_data').",
]

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "cache/*",
  "references_cache/*",
  "src/dismech/datamodel/dismech_pydantic.py",
  "src/dismech/datamodel/dismech.py",
  "research/*",
  "references_cache/*",
  # Generated schema docs (`just gen-schema-docs`). Spell-check the schema
  # source instead — these are derived, and both classes of hit here are
  # artifacts of generation rather than typos: ontology labels carrying proper
  # names (Weill-Marchesani, Leri-Weill — the same reason cache/* is skipped),
  # and descriptions truncated mid-word by the doc generator's column limit
  # ("procedure is performe…", correctly spelled "performed" in the schema).
  "docs/schema/*",
  "elements/*",
]

# Reminder: words have to be lowercased for the ignore-words-list
# Medical/scientific terms that codespell misidentifies:
# infarction (myocardial infarction), cyclin (protein), abl (ABL gene),
# connectin (titin/connectin protein), inactivate, heterogenous (in paper quotes),
# UES (upper esophageal sphincter), MIS (MIS-C), OND, TE, CAFs (cancer-associated
# fibroblasts), acapella (Acapella medical device),
# ect (ECT = electroconvulsive therapy), vas (vas deferens),
# esge (European Society of Gastrointestinal Endoscopy),
# ege (eosinophilic gastroenteritis),
# targetting (British spelling in PMID:28535799 abstract),
# precice (PRECICE surgical device), als (ALS = amyotrophic lateral sclerosis),
# lod (LOD score in genetics), ndd/ndds (neurodevelopmental disorders),
# anc (absolute neutrophil count), tme (tumor microenvironment),
# uesd (upper esophageal sphincter dysfunction),
# edn (EDN3 = endothelin 3 gene),
# contributs/occuring/histocompatability/continious (typos in published abstracts - must match source),
# gord (gastro-oesophageal reflux disease, British abbreviation),
# ser (Serum in LOINC term labels, e.g. "Ser/Plas"),
# ehr (Electronic Health Record),
# lamas (LAMAs = long-acting muscarinic antagonists),
# caf (cancer-associated fibroblast, singular),
# metrix (Metrix brand name in medical context)
# bloc (official medical phrase "en bloc" in surgical oncology)
# exra (extra-articular rheumatoid arthritis abbreviation in source abstracts)
ignore-words-list = "linke,infarction,cyclin,abl,connectin,inactivate,heterogenous,homogenous,ues,mis,ond,te,cafs,caf,acapella,bu,survivin,trough,tese,selectin,pase,ect,vas,esge,ege,targetting,precice,als,lod,ndds,anc,tme,uesd,edn,contributs,occuring,histocompatability,gord,ser,ehr,continious,lamas,metrix,mater,murr,ans,occurence,olt,sting,transferrin,unusal,fals,exra,bloc,aas"
quiet-level = 3

# Ref.: https://github.com/astral-sh/ruff
[tool.ruff]
exclude = [
  "src/dismech/datamodel/dismech.py",
  "src/dismech/datamodel/dismech_pydantic.py",
  "src/dismech/datamodel/__init__.py",
  "docs/schema/dismech.py",
  "attic/",
]

[tool.ruff.lint]
# We intentionally track ruff's default rule set (no explicit `select`) rather
# than pinning the ruff version, and mark the rules that don't fit this project
# as deliberately ignored. These are framework false-positives and intentional
# defensive/test patterns, not latent bugs — everything else ruff flags is fixed
# in-tree.
ignore = [
  "B008",   # function-call-in-default-argument: idiomatic Typer/Click CLI defaults (typer.Option/Argument)
  "BLE001", # blind-except: intentional defensive fallback paths (rendering, cache warmups, optional integrations)
  "TRY004", # prefer-type-error: our ValueError-on-bad-input choices are deliberate
  "SIM115", # open-without-context-manager: some call sites intentionally return/hold the handle
  "S110",   # try-except-pass: intentional best-effort cleanup
  "S112",   # try-except-continue: intentional skip-on-error in batch/sweep loops
  "S102",   # exec-builtin: only in tests that execute generated-code fixtures
]

[tool.ruff.lint.per-file-ignores]
# Every script in scripts/ is run directly rather than imported, so it has to
# put `src/` on sys.path before it can import `dismech.*`. That makes the import
# non-top-of-file by construction. Ruff 0.15 began reporting E402 by default,
# which turned nine long-standing scripts red at once on main and blocked every
# PR's lint step -- the cost of tracking ruff's default rule set unpinned, which
# is a deliberate choice made just above. Scoped to scripts/ so E402 still
# applies to src/ and tests/, where the idiom has no excuse.
"scripts/*" = ["E402"]

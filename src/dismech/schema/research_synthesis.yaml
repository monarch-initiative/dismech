id: https://w3id.org/monarch-initiative/dismech/research_synthesis
name: dismech_research_synthesis
title: Disorder Mechanisms Cross-Provider Research Synthesis Schema
description: >-
  Curated, cross-provider harmonization of deep-research reports for a single
  disorder. A synthesis pairs each harmonized finding (a canonical claim, tagged
  to the dismech section it informs) with a per-provider assessment scoring how
  each deep-research report stands relative to that finding (concordant, partial,
  contradictory, or silent). This artifact is curation *workspace* provenance and
  lives in `research/`, distinct from the integrated `references:`/`findings:`
  claims block that survives into the disorder YAML.

  Field names deliberately mirror the `deep_research_client.evaluation.models`
  pydantic model (GroundTruthClaim.category, ClaimMatch.matched /
  similarity_score / best_matching_text / explanation, DROutput.provider) so the
  curated artifact interoperates with the deep-research-client evaluation
  harness. The additions over that harness are (1) an aggregate that groups all
  providers under one harmonized finding and (2) an explicit `stance` enum that
  distinguishes concordance from contradiction, which the coverage-only
  ClaimMatch does not capture.
license: BSD-3-Clause

imports:
  - linkml:types

prefixes:
  linkml: https://w3id.org/linkml/
  dismech: https://w3id.org/monarch-initiative/dismech/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: dismech
default_range: string

enums:
  SynthesisSectionEnum:
    description: >-
      The dismech section a harmonized finding informs. The first five values are
      the upstream `deep_research_client.evaluation` GroundTruthClaim categories
      (kept verbatim for interop); the remainder extend the vocabulary to cover
      dismech blocks the upstream loader does not yet emit.
    permissible_values:
      pathophysiology:
        description: Mechanism / pathophysiology node (upstream category).
      phenotype:
        description: Clinical or cellular phenotype (upstream category).
      treatment:
        description: Treatment, drug, or clinical action (upstream category).
      genetic_factor:
        description: Causal gene, variant, or inheritance claim (upstream category).
      gene_function:
        description: Molecular function of an implicated gene product (upstream category).
      prognosis:
        description: Outcome, natural history, or prognostic association (dismech extension).
      diagnosis:
        description: Diagnostic criterion, test, or biomarker (dismech extension).
      epidemiology:
        description: Prevalence, incidence, or population occurrence (dismech extension).
      comorbidity:
        description: Comorbidity, association, or disease-disease link (dismech extension).
      other:
        description: A claim that does not fit the above sections.

  CurationStatusEnum:
    description: What curation did with the harmonized finding.
    permissible_values:
      INTEGRATED:
        description: Promoted into the disorder YAML as curated content.
      LEAD:
        description: Retained as a research lead, not yet promoted.
      REJECTED:
        description: Judged unsupported or out of scope and not promoted.

  ProviderStanceEnum:
    description: >-
      How one provider's report stands relative to the harmonized finding. This
      extends the coverage-only upstream ClaimMatch (matched true/false) with an
      explicit concordant-vs-contradictory distinction.
    permissible_values:
      CONCORDANT:
        description: The report asserts the finding (or a compatible stronger form).
      PARTIAL:
        description: The report supports part of the finding or a weaker/qualified form.
      CONTRADICTORY:
        description: The report asserts something that conflicts with the finding.
      SILENT:
        description: The report does not address the finding.

  ProviderRunStatusEnum:
    description: >-
      Outcome of the provider run itself, as distinct from the scientific quality
      of what it produced. A synthesis should record attempted-but-unproductive
      runs so that absent provider coverage is legible as a run failure rather
      than as a curator's choice not to consult that provider.
    permissible_values:
      COMPLETED:
        description: The run finished and produced a usable report.
      FAILED:
        description: >-
          The run did not produce a report (API error, auth/credit failure,
          timeout). No report file exists.
      UNUSABLE:
        description: >-
          The run produced a report file, but its content was off-topic,
          empty, or otherwise unfit to curate from. The file may still be
          committed for provenance.

  NecPreflightVerdictEnum:
    description: >-
      Verdict from the Named Entity Confusion preflight (`just preflight-dr`),
      which checks whether the report is actually about the intended MONDO
      entity. See CLAUDE.md section 2b.
    permissible_values:
      PASS:
        description: The canonical gene dominates the report's gene mentions.
      WARN:
        description: >-
          A rival entity is discussed substantively, the OMIM IDs disagree, the
          canonical-gene signal is weak, or a lookup the verdict depends on
          failed.
      FAIL:
        description: >-
          The canonical gene is absent while another gene is discussed
          substantively. The report should be discarded entirely, not
          cherry-picked from.
      SKIP:
        description: >-
          MONDO records no causal gene for the entity, so the automated check
          cannot discriminate; manual checks apply.
      NOT_RUN:
        description: The preflight was not run against this report.

  IdentifierIssueKindEnum:
    description: >-
      Class of identifier- or quote-level defect found in a provider report.
      Mirrors the three hallucination categories and the Named Entity Confusion
      failure mode enumerated in CLAUDE.md sections 2a and 2b. These are defects
      of the *report*, recorded so that a later reader does not re-trust a
      citation an earlier curator already disproved.
    permissible_values:
      NONEXISTENT_IDENTIFIER:
        description: >-
          The cited identifier does not resolve at all (fabricated PMID, DOI,
          NCT, or accession).
      MISATTRIBUTED_IDENTIFIER:
        description: >-
          The identifier resolves, but to a different work than the report
          claims — the citation is real but attached to the wrong paper.
      FABRICATED_QUOTE:
        description: >-
          A quoted snippet is not present in the cited source (paraphrased or
          invented rather than quoted).
      NONEXISTENT_ONTOLOGY_TERM:
        description: An ontology CURIE (HP, GO, CL, CHEBI, NCIT, MONDO) does not exist.
      MISMATCHED_ONTOLOGY_LABEL:
        description: >-
          The ontology CURIE exists but the label the report gives it does not
          match the canonical label.
      NAMED_ENTITY_CONFUSION:
        description: >-
          The identifier or the passage citing it belongs to a different disease
          entity than the one being curated (CLAUDE.md section 2b).
      OTHER:
        description: A defect that does not fit the above classes.

  IdentifierIssueDispositionEnum:
    description: What curation did about the identifier issue.
    permissible_values:
      DISCARDED:
        description: The citation and any claim resting on it were dropped.
      CORRECTED:
        description: >-
          The claim was retained but re-anchored to a different, verified
          source.
      RETAINED_WITH_CAVEAT:
        description: >-
          The claim was kept with the defect explicitly flagged in the curated
          entry.

slots:
  disease:
    description: Disorder name / slug this synthesis is about (matches a Disease.name).
    required: true
  mondo:
    description: MONDO CURIE for the disorder, when known.
  generated:
    description: When this synthesis was curated (ISO 8601 / RFC 3339).
    range: datetime
  synthesis_version:
    description: Schema/format version of this synthesis artifact.
  providers:
    description: The deep-research reports compared in this synthesis.
    multivalued: true
    range: ProviderReport
    inlined_as_list: true
  harmonized_findings:
    description: Canonical cross-provider claims with per-provider assessments.
    multivalued: true
    range: HarmonizedFinding
    inlined_as_list: true
  narrative:
    description: >-
      Optional free-text prose synthesis, preserving the qualitative "story" the
      legacy freehand roll-ups carried (agreement, divergence, integration).
      Complements — does not replace — the structured harmonized_findings.
    range: SynthesisNarrative
    inlined: true
  notes:
    description: Free-text curation notes, caveats, or follow-up context.

  # SynthesisNarrative slots (free text, all optional)
  overview:
    description: Big-picture prose summary of how the providers frame the disorder.
  agreement:
    description: Prose account of where the providers converge.
  divergence:
    description: Prose account of where the providers differ or contribute uniquely.
  integration:
    description: What was (or should be) promoted into the disorder YAML, in prose.
  not_integrated:
    description: Prose account of claims retained as leads rather than promoted.

  # ProviderReport slots
  name:
    description: Provider name (e.g. falcon, openscientist).
  report:
    description: Path to the provider's deep-research report file, relative to repo root.
  model:
    description: Model the provider used, when known.
  citation_count:
    description: Number of citations in the provider's report.
    range: integer
  run_status:
    description: >-
      Outcome of the provider run. Omit for ordinary completed runs; set
      explicitly to record an attempted run that failed or produced an unusable
      report.
    range: ProviderRunStatusEnum
  status_detail:
    description: >-
      Why a run FAILED or was judged UNUSABLE (e.g. the HTTP status returned, or
      what the off-topic report actually retrieved).
  nec_preflight_verdict:
    description: >-
      Verdict of `just preflight-dr <report> <mondo>` for this report. Recording
      PASS is as useful as recording FAIL — it tells a later reader the Named
      Entity Confusion check was actually performed.
    range: NecPreflightVerdictEnum
  nec_preflight_detail:
    description: >-
      Supporting detail for the preflight verdict (e.g. the gene-mention counts
      and the OMIM comparison the tool printed).
  identifier_issues:
    description: >-
      Identifier- or quote-level defects found in this provider's report:
      fabricated or misattributed citations, invented ontology terms, fabricated
      quotes, or Named Entity Confusion. Recorded per report so a later curator
      does not re-trust a citation this review already disproved.
    multivalued: true
    range: IdentifierIssue
    inlined_as_list: true

  # IdentifierIssue slots
  identifier:
    description: >-
      The identifier as cited in the report (e.g. PMID:20040488, HP:0000857,
      DOI:10.1000/xyz).
    required: true
  issue_kind:
    description: Class of defect.
    range: IdentifierIssueKindEnum
    required: true
  cited_as:
    description: >-
      What the report claimed this identifier was — the title, term label, or
      claim it was attached to.
  resolves_to:
    description: >-
      What the identifier actually is, on checking (real title, canonical
      ontology label), or a statement that it does not resolve.
  report_quote:
    description: >-
      Verbatim excerpt from the provider report showing the identifier in use.
      Unlike best_matching_text this is not machine-verified as a substring,
      because a defect may be recorded for a report that was never committed.
  verified_with:
    description: >-
      How the defect was established (e.g. "PubMed esummary", "just
      validate-terms", "just preflight-dr").
  disposition:
    description: What curation did about the issue.
    range: IdentifierIssueDispositionEnum

  # HarmonizedFinding slots
  statement:
    description: The canonical harmonized claim, phrased provider-neutrally.
    required: true
  sections:
    description: dismech section(s) this finding informs.
    multivalued: true
    range: SynthesisSectionEnum
    required: true
  curation_status:
    description: What curation did with this finding.
    range: CurationStatusEnum
  provider_support:
    description: Per-provider assessment of this finding.
    multivalued: true
    range: ProviderAssessment
    inlined_as_list: true
    required: true

  # ProviderAssessment slots
  provider:
    description: Provider this assessment is for (matches a ProviderReport.name).
    required: true
  source_report:
    description: Path to the provider report this assessment reads from.
  stance:
    description: How this provider's report stands relative to the harmonized finding.
    range: ProviderStanceEnum
    required: true
  matched:
    description: Whether the report covers the finding at all (mirrors ClaimMatch.matched).
    range: boolean
  score:
    description: >-
      Concordance/similarity score in [0,1] for how well the report matches the
      finding (mirrors ClaimMatch.similarity_score). Curator-assigned.
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
  best_matching_text:
    description: >-
      Verbatim excerpt from the provider report supporting the stance (mirrors
      ClaimMatch.best_matching_text). Must be an exact quote from the report.
  explanation:
    description: Why the report earns this stance/score (mirrors ClaimMatch.explanation).
  citations:
    description: Reference identifiers (PMID/DOI) the provider cited for this finding.
    multivalued: true

classes:
  ResearchSynthesis:
    description: Cross-provider deep-research synthesis for a single disorder.
    tree_root: true
    slots:
      - disease
      - mondo
      - generated
      - synthesis_version
      - providers
      - harmonized_findings
      - narrative
      - notes

  SynthesisNarrative:
    description: >-
      Optional free-text prose companion to the structured findings, mirroring
      the section headings of the legacy freehand synthesis roll-ups so their
      qualitative voice is not lost. All slots are optional.
    slots:
      - overview
      - agreement
      - divergence
      - integration
      - not_integrated

  ProviderReport:
    description: >-
      One deep-research report compared in the synthesis, or one attempted
      provider run that produced no usable report.
    slots:
      - name
      - report
      - model
      - citation_count
      - run_status
      - status_detail
      - nec_preflight_verdict
      - nec_preflight_detail
      - identifier_issues
      - notes
    slot_usage:
      name:
        required: true
      report:
        description: >-
          Path to the provider's deep-research report file, relative to repo
          root. Expected for any run that produced one; legitimately absent only
          when run_status is FAILED.

  IdentifierIssue:
    description: >-
      An identifier- or quote-level defect in a provider report — a fabricated or
      misattributed citation, an invented or mislabelled ontology term, a
      fabricated quote, or Named Entity Confusion. This records a property of the
      *report*, not of a harmonized finding, so it survives even when the
      affected claim was dropped and therefore appears nowhere else.
    slots:
      - identifier
      - issue_kind
      - cited_as
      - resolves_to
      - report_quote
      - verified_with
      - disposition
      - notes

  HarmonizedFinding:
    description: A canonical cross-provider claim tagged to dismech section(s).
    slots:
      - statement
      - sections
      - curation_status
      - provider_support
      - notes

  ProviderAssessment:
    description: How one provider's report stands relative to a harmonized finding.
    slots:
      - provider
      - source_report
      - stance
      - matched
      - score
      - best_matching_text
      - explanation
      - citations

id: https://w3id.org/monarch-initiative/dismech/classifications/exposure_classification
name: dismech-exposure-classification
title: Exposure and Hazard Classification
description: >-
  Sanctioned classification axes for an **exposure or its agent** — as distinct
  from the disease-level nosologies in ``DiseaseClassifications``.

  This is the load-bearing distinction in this module. ``ILOCausativeAgentEnum``,
  ``ILODiseaseCategoryEnum`` and ``EUOccupationalScheduleEnum`` classify a
  *disease*, so they hang off ``Disease.classifications`` — note that even the
  ILO's causative-agent axis is a statement about which agent-indexed item a
  *disease* is recognised under, not a property of the agent itself.
  Everything here classifies the *agent or the
  exposure event* — "benzene is an IARC Group 1 carcinogen" is a statement about
  benzene, not about any disease benzene causes. Putting agent-level facts into
  a disease-level slot would assert, wrongly, that the disease itself carries the
  hazard classification. These enums are therefore reached through
  ``Environmental.exposure_classifications``.

  Each axis below is an independent, published standard; they are deliberately
  separate enums rather than one blended vocabulary, because an exposure has a
  value on several of them at once (chronic + inhalation + chemical + IARC Group 1
  is a normal, non-redundant description of occupational benzene).

  These annotate an exposure that dismech has already grounded to ECTO/ExO via
  ``Environmental.exposure_term``. They do not replace that grounding — ECTO
  post-composes the exposure event itself ("exposure to arsenic in water via
  ingestion"), while these axes record the regulatory and toxicological
  classification of the agent and the exposure's shape. Where an ECTO term
  already encodes the route, the ``exposure_route`` value simply makes it
  queryable without parsing the term label.

  Scope note — carcinogen classifications. Only the IARC Monographs
  classification is encoded here. Three national systems classify the same agents
  on parallel scales — the US NTP *Report on Carcinogens* ("known to be a human
  carcinogen" / "reasonably anticipated to be a human carcinogen"), the US EPA
  IRIS cancer descriptors (five weight-of-evidence descriptors), and the ACGIH
  TLV carcinogenicity notations (A1-A5). They are deliberately **not** encoded:
  they largely re-rank the same evidence, and carrying four near-parallel scales
  invites curators to assert an NTP or ACGIH listing they have not checked. IARC
  is the WHO/international instrument and is the one cited in the occupational
  literature dismech curates. If a national listing is the specific point being
  made, state it in the assignment's ``notes`` with its source.

  Also deliberately not encoded: the GBD (IHME) environmental and occupational
  risk-factor hierarchy. It is a genuine sanctioned classification and would fit
  this module, but its exact Level 2 / Level 3 label set could not be verified
  against a primary source when this module was written, and transcribing an
  approximate hierarchy would defeat the purpose. Left for a follow-up that
  works from the GBD capstone appendix.

imports:
  - linkml:types

prefixes:
  linkml: https://w3id.org/linkml/
  dismech: https://w3id.org/monarch-initiative/dismech/
  PMID: http://www.ncbi.nlm.nih.gov/pubmed/

default_prefix: dismech

enums:

  # =====================================================================
  # Occupational hygiene: what kind of agent is it?
  # =====================================================================
  HazardAgentTypeEnum:
    description: >-
      The classical occupational-hygiene classification of workplace hazards by
      the *nature of the agent*. This is the organising scheme used throughout
      occupational health practice and teaching, and it is the axis the ILO list
      uses for its section 1 (chemical / physical / biological agents), extended
      with the two categories that scheme historically omitted — ergonomic and
      psychosocial — both of which the ILO list now recognises as causes in
      section 2 (musculoskeletal disorders; mental and behavioural disorders).

      Assign the agent's nature, not its effect: noise-induced hearing loss is a
      PHYSICAL hazard, not a physiological one.
    see_also:
      - https://www.ilo.org/publications/ilo-list-occupational-diseases-revised-2010
    permissible_values:
      CHEMICAL:
        description: >-
          A chemical agent — dusts, fumes, gases, vapours, mists, solvents,
          metals, pesticides, pharmaceuticals. The ILO list's section 1.1 and the
          European schedule's chapter 1.
      PHYSICAL:
        description: >-
          A physical energy or condition — noise, vibration, ionizing and
          optical radiation, extreme temperature, compressed or decompressed air.
          ILO section 1.2, European schedule chapter 5.
      BIOLOGICAL:
        description: >-
          A living agent or its product — bacteria, viruses, fungi, parasites,
          endotoxin, allergenic proteins such as latex. ILO section 1.3,
          European schedule chapter 4.
      ERGONOMIC:
        description: >-
          A biomechanical exposure — repetitive movement, forceful exertion,
          sustained or extreme posture, prolonged pressure, manual handling,
          whole-body vibration. The exposure class behind ILO section 2.3.
      PSYCHOSOCIAL:
        description: >-
          A work-organisation or psychosocial exposure — traumatic incident,
          violence, harassment, excessive demand, low control, shift work,
          effort-reward imbalance. The exposure class behind ILO section 2.4.
      SAFETY:
        description: >-
          A mechanical or safety hazard producing acute injury rather than
          disease — machinery, falls, electricity, fire, confined spaces. Present
          for completeness of the hazard taxonomy; dismech entries are diseases,
          so this value is rarely the right one.
      OTHER:
        description: An agent that does not fall into any of the above classes.

  # =====================================================================
  # Toxicology: how did the agent get in?
  # =====================================================================
  ExposureRouteEnum:
    description: >-
      Route of exposure — the portal by which an agent reaches the organism.
      Standard toxicological/regulatory axis, used by ATSDR toxicological
      profiles, EPA risk assessment and the GHS alike, and post-composed into
      ECTO exposure terms ("exposure to arsenic in water via ingestion").

      The route is a property of the exposure event, so one agent commonly has
      several — the slot is multivalued. Route matters mechanistically: the same
      agent produces different disease by different routes (inhaled versus
      ingested hexavalent chromium), which is why this is worth recording
      separately rather than leaving implicit in the ECTO label.
    see_also:
      - https://www.atsdr.cdc.gov/toxicological-profiles/index.html
      - https://www.epa.gov/risk/conducting-human-health-risk-assessment
    permissible_values:
      INHALATION:
        description: >-
          Uptake via the respiratory tract — gases, vapours, aerosols, dusts,
          fumes, fibres. The dominant route in occupational exposure.
      ORAL:
        description: >-
          Uptake by ingestion, including incidental hand-to-mouth transfer and
          contaminated food or drinking water.
      DERMAL:
        description: >-
          Uptake through intact or damaged skin, and local action on the skin
          itself.
      OCULAR:
        description: Contact with, or uptake through, the eye and conjunctiva.
      PARENTERAL:
        description: >-
          Uptake bypassing epithelial barriers — needlestick and sharps injury,
          injection, implantation, wound contamination. The route for
          occupational bloodborne infection.
      TRANSPLACENTAL:
        description: >-
          Uptake by the conceptus across the placenta following maternal
          exposure. The route underlying developmental toxicity and prenatal
          origins of later disease.
      LACTATIONAL:
        description: Uptake by the infant through breast milk following maternal exposure.
      MULTIPLE:
        description: >-
          Substantial exposure by more than one route where the individual
          routes are not separable. Prefer listing the specific routes when they
          are known.
      UNKNOWN:
        description: Route not established or not reported by the cited source.

  # =====================================================================
  # Toxicology: over what period?
  # =====================================================================
  ExposureDurationEnum:
    description: >-
      Duration of exposure. The day ranges given are those used by the US Agency
      for Toxic Substances and Disease Registry (ATSDR) in deriving Minimal Risk
      Levels, which is the most precisely specified of the common conventions:
      acute 1-14 days, intermediate 15-364 days, chronic 365 days and longer.

      Beware that agencies do not agree on the bin boundaries — EPA risk
      assessment uses acute / short-term / subchronic / chronic with different
      cut points, and the occupational literature often uses "chronic" to mean
      simply "long-term" with no threshold. The values here carry the ATSDR
      ranges as their definition; when a source uses a different convention,
      pick the value whose *meaning* matches and say so in ``notes`` rather than
      forcing the source's word onto a value with a different range.

      This describes the exposure, not the disease course. A single acute
      exposure can cause a chronic disease; use ``temporality`` /
      ``clinical_course`` on the phenotype descriptor for the latter.
    source: https://www.atsdr.cdc.gov/minimal-risk-levels/php/about/index.html
    permissible_values:
      ACUTE:
        description: >-
          A single exposure or repeated exposure over 1-14 days (ATSDR acute
          duration). Includes the single high-dose incident, spill or release.
      INTERMEDIATE:
        description: >-
          Repeated exposure over 15-364 days (ATSDR intermediate duration).
          Overlaps what other agencies call subacute or subchronic.
      CHRONIC:
        description: >-
          Repeated exposure over 365 days or longer (ATSDR chronic duration).
          The usual shape of an occupational exposure across a working life.
      INTERMITTENT:
        description: >-
          Recurrent discrete exposures separated by exposure-free intervals,
          where the episodic pattern rather than the cumulative dose is the
          salient feature (task-based peak exposure, seasonal work).
      LIFETIME:
        description: >-
          Continuous exposure across the whole lifespan, the framing used for
          ubiquitous environmental agents (background air pollution, residential
          radon) and for lifetime-risk cancer estimates.
      UNKNOWN:
        description: Duration not established or not reported by the cited source.

  # =====================================================================
  # IARC: is the agent carcinogenic?
  # =====================================================================
  IARCCarcinogenGroupEnum:
    description: >-
      Carcinogenicity classification of an agent by the IARC Monographs on the
      Identification of Carcinogenic Hazards to Humans (International Agency for
      Research on Cancer, WHO). Encodes the group set established by the
      Preamble as amended in January 2019.

      **This is a hazard identification, not a risk assessment.** The group
      states how strong the evidence is that the agent *can* cause cancer under
      some circumstance — it says nothing about potency, exposure level, or how
      much cancer the agent actually causes in a population. Group 1 contains
      both plutonium and processed meat. Curators must not paraphrase a group as
      a statement of risk, and a Group 1 listing is not by itself evidence that
      a particular disease entry's exposure caused a particular cancer.

      Groups are assigned to an *agent* (or a mixture, or an exposure
      circumstance such as "painter, occupational exposure as a"), so this
      belongs on the exposure, never on the disease. Note also that a group
      applies to the agent overall; the specific tumour sites with sufficient
      evidence are stated separately in the Monograph and should go in ``notes``
      if they matter.
    source: https://monographs.iarc.who.int/iarc-monographs-preamble-preamble-to-the-iarc-monographs/
    see_also:
      - https://monographs.iarc.who.int/agents-classified-by-the-iarc/
    permissible_values:
      GROUP_1:
        description: >-
          Group 1 - Carcinogenic to humans. Sufficient evidence of
          carcinogenicity in humans, or (exceptionally) sufficient evidence in
          experimental animals plus strong mechanistic evidence in exposed
          humans.
      GROUP_2A:
        description: >-
          Group 2A - Probably carcinogenic to humans. Typically limited evidence
          in humans together with sufficient evidence in experimental animals,
          or strong mechanistic evidence.
      GROUP_2B:
        description: >-
          Group 2B - Possibly carcinogenic to humans. Limited evidence in humans
          and less than sufficient evidence in experimental animals, or
          sufficient animal evidence alone, or strong mechanistic evidence alone.
      GROUP_3:
        description: >-
          Group 3 - Not classifiable as to its carcinogenicity to humans. A
          statement that the evidence is inadequate, NOT a finding of safety.
          Do not report a Group 3 agent as non-carcinogenic.
      GROUP_4:
        description: >-
          Group 4 - Probably not carcinogenic to humans. **Withdrawn**: the
          category was removed by the January 2019 amendment to the Preamble,
          having only ever been applied to a single agent - caprolactam, which
          was moved to Group 3 in the same revision. Retained only so historical
          assignments citing the pre-2019 scheme remain resolvable; never use
          for new curation.
        deprecated: >-
          Removed from the IARC classification scheme by the 2019 Preamble
          amendment. There is no replacement category; an agent formerly in
          Group 4 is now evaluated under the remaining groups.

  # =====================================================================
  # UN GHS: what kind of health hazard is it?
  # =====================================================================
  GHSHealthHazardClassEnum:
    description: >-
      Health hazard classes of the United Nations Globally Harmonized System of
      Classification and Labelling of Chemicals (GHS), the international standard
      implemented in EU law as the CLP Regulation (EC) No 1272/2008 and in the US
      as the OSHA Hazard Communication Standard.

      These ten classes are the GHS *health* hazards. GHS also defines physical
      hazard classes (flammability, explosivity, …) and environmental hazard
      classes (hazardous to the aquatic environment, hazardous to the ozone
      layer); neither is in scope here, since this axis exists to describe how an
      agent harms an exposed organism.

      Each class is subdivided into numbered categories (and sub-categories) that
      grade severity — Carcinogenicity 1A/1B/2, acute toxicity 1-5, and so on.
      The category is *not* encoded as a permissible value, because the category
      boundaries are defined per class in terms of class-specific criteria and
      flattening them into one enum would produce values that only make sense in
      context. Record the category in the assignment's ``notes`` (for example,
      "Carc. 1A") alongside the class.
    source: https://unece.org/transport/dangerous-goods/ghs-rev10-2023
    see_also:
      - http://data.europa.eu/eli/reg/2008/1272/oj
    permissible_values:
      ACUTE_TOXICITY:
        description: >-
          Acute toxicity - serious adverse effects, up to lethality, after a
          single or short-term oral, dermal or inhalation exposure.
      SKIN_CORROSION_IRRITATION:
        description: >-
          Skin corrosion / irritation - irreversible damage to, or reversible
          inflammation of, the skin after application of a substance.
      SERIOUS_EYE_DAMAGE_IRRITATION:
        description: >-
          Serious eye damage / eye irritation - tissue damage or serious
          physical decay of vision, or reversible ocular changes.
      RESPIRATORY_OR_SKIN_SENSITIZATION:
        description: >-
          Respiratory or skin sensitization - induction of hypersensitivity of
          the airways after inhalation, or an allergic response after skin
          contact. The GHS class corresponding to occupational asthma and
          allergic contact dermatitis.
      GERM_CELL_MUTAGENICITY:
        description: >-
          Germ cell mutagenicity - heritable gene mutations, including
          structural and numerical chromosome aberrations, in germ cells.
      CARCINOGENICITY:
        description: >-
          Carcinogenicity - induction of cancer or an increase in cancer
          incidence after exposure. Classified independently of, and on
          different criteria from, the IARC groups; the two frequently but not
          always agree, so record both rather than inferring one from the other.
      REPRODUCTIVE_TOXICITY:
        description: >-
          Reproductive toxicity - adverse effects on sexual function and
          fertility in adults, and developmental toxicity in the offspring.
      STOT_SINGLE_EXPOSURE:
        description: >-
          Specific target organ toxicity, single exposure (STOT-SE) - specific,
          non-lethal target-organ effects after one exposure.
      STOT_REPEATED_EXPOSURE:
        description: >-
          Specific target organ toxicity, repeated exposure (STOT-RE) - specific
          target-organ effects after repeated or prolonged exposure.
      ASPIRATION_HAZARD:
        description: >-
          Aspiration hazard - chemical pneumonia, pulmonary injury or death
          following aspiration of a substance into the trachea and lower
          respiratory system.

  # =====================================================================
  # Exposome: where in the exposure landscape does it sit?
  # =====================================================================
  ExposomeDomainEnum:
    description: >-
      Domain of the exposome, following the three-domain framing set out by
      Christopher Wild ("The exposome: from concept to utility",
      Int J Epidemiol 2012;41(1):24-32, PMID:22296988), which extended his 2005
      proposal of the exposome as the totality of non-genetic exposures from
      conception onwards.

      Wild is explicit that the domains overlap and that some exposures are hard
      to place — the internal domain is partly a *response* to the external. Use
      the value that names where the exposure is measured or acts, and do not
      treat a placement as a sharp claim. This axis is included because it is the
      standard vocabulary of exposome-scale epidemiology, which is increasingly
      the source of the environmental associations dismech curates; it is a
      framing device, not a regulatory instrument like the other enums here.
    source: PMID:22296988
    permissible_values:
      GENERAL_EXTERNAL:
        description: >-
          The general external environment - the wider social, economic and
          built context: socioeconomic position, education, urban-rural setting,
          climate, and other exposures acting at population rather than
          individual scale.
      SPECIFIC_EXTERNAL:
        description: >-
          The specific external environment - identifiable individual-level
          exposures: chemical contaminants, occupational agents, radiation,
          infections, diet, tobacco, alcohol, physical activity.
      INTERNAL:
        description: >-
          The internal environment - internal biological processes reflecting
          and responding to exposure: metabolism, endogenous hormones, oxidative
          stress, inflammation, gut microbiome, epigenetic modification.

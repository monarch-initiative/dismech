id: https://w3id.org/monarch-initiative/dismech/classifications/isds_skeletal_nosology
name: dismech-isds-skeletal-nosology
title: ISDS Nosology and Classification of Genetic Skeletal Disorders
description: >-
  Expert-consensus nosology of the genetic skeletal disorders, following the
  Nosology and Classification of Genetic Skeletal Disorders maintained by the
  Nosology Committee of the International Skeletal Dysplasia Society (ISDS).
  This enum encodes the 2019 revision — the tenth edition — which comprises
  461 disorders classified into 42 groups on clinical, radiographic, and/or
  molecular grounds (Mortier GR, Cohn DH, Cormier-Daire V, et al.,
  Am J Med Genet A 2019;179(12):2393-2419; PMID:31633310,
  DOI:10.1002/ajmg.a.61366).

  The ISDS groups are a flat, non-hierarchical partition: each of the 461
  disorders is deliberately listed exactly once, in a single group, to avoid
  redundancy in the Nosology. Group membership is therefore mutually exclusive
  within the nosology itself, even though the underlying biology frequently
  spans groups (Table 1 carries explicit "see also" cross-references for those
  cases). Groups mix organizing principles by design: some are molecular (a
  shared causal gene or gene family — groups 1-8), some radiographic (which
  segment of the growing bone is affected — groups 10-14), some anatomical or
  pathogenetic (craniosynostosis, brachydactyly, osteolysis).

  Curation guidance for dismech:

  - Assign a group only to entries the ISDS Nosology itself lists, or to
    entries that are an unambiguous subtype/synonym of a listed disorder. This
    is a transcription of an expert nosology, not an inference engine; do not
    extend it to skeletal-phenotype disorders the committee chose not to list.
  - The slot is multivalued only to accommodate an entry that lumps several
    distinct nosology disorders. A single ISDS-listed disorder should carry
    exactly one group.
  - Record the Table 1 provenance in the assignment's ``notes`` (which
    nosology revision, which group, and the listed disorder name where it
    differs from the dismech entry name). The paper's PubMed record is
    abstract-only, so the per-disorder group placement in Table 1 is not
    quotable as an evidence snippet; prefer ``notes`` over a snippet the
    abstract does not actually support.
  - Group values carry no ``meaning:``. The groups are nosological constructs
    and a ``meaning:`` would assert that the value *is* an ontology class,
    which is never quite true here. Where a MONDO class denotes the same
    disease family, it is recorded as a ``close_mappings:`` entry instead —
    see the mapping policy below.

  MONDO mapping policy. Only three groups carry a mapping, and the bar is
  deliberately high: a candidate MONDO class is rejected if it contains any
  entity that the ISDS Nosology itself lists in a *different* group, because
  such a mapping would silently contradict the committee's own placement. The
  surviving mappings are all gene-defined disease series whose extension nests
  cleanly inside one group:

  - group 1 → MONDO:0019685 FGFR3-related chondrodysplasia. Contains exactly
    the group's members and, importantly, excludes the FGFR3 craniosynostoses
    (Muenke, Crouzon with acanthosis nigricans), which ISDS places in group 33.
  - group 8 → MONDO:0018240 TRPV4-related bone disorder.
  - group 16 → MONDO:0019696 acromesomelic dysplasia.

  Rejected candidates, recorded so they are not re-proposed: MONDO:0022800
  type 2 collagenopathy for group 2 (contains spondylometaphyseal dysplasia
  'corner fracture' type, listed in group 12); MONDO:0019695 acromelic
  dysplasia for group 15 (contains pseudohypoparathyroidism type 1A from group
  38 and terminal osseous dysplasia from group 7); MONDO:0017198 osteopetrosis
  for group 23 (contains melorheostosis and osteopathia striata with cranial
  sclerosis, both in group 24); MONDO:0015338 syndromic craniosynostosis for
  group 33 (contains cranioectodermal dysplasia, in group 9). Groups 10, 19,
  21, 25 and 27 have no usable class at all — either the nearest MONDO term is
  obsolete (chondrodysplasia punctata) or it is *narrower* than the ISDS group,
  which mixes in entities that fall outside it.

  In every mapped case MONDO remains broader than the ISDS group, since the
  nosology lists only entities meeting its inclusion criteria; that is why the
  relation is ``close_mappings`` and not ``exact_mappings``.

  Exemplar disorders named in each description below are transcribed from
  Table 1 of the 2019 revision; they are illustrative, not the full membership
  of the group.

imports:
  - linkml:types

prefixes:
  linkml: https://w3id.org/linkml/
  dismech: https://w3id.org/monarch-initiative/dismech/

default_prefix: dismech

enums:
  ISDSNosologyGroupEnum:
    description: >-
      The 42 groups of the ISDS Nosology and Classification of Genetic
      Skeletal Disorders, 2019 revision (PMID:31633310, Table 1). Values are
      ordered as in the source; the group number opens each description.
    permissible_values:

      # =====================================================================
      # Groups 1-8: defined by a shared causal gene or gene family
      # =====================================================================

      fgfr3_chondrodysplasia:
        close_mappings:
          - MONDO:0019685   # FGFR3-related chondrodysplasia
        description: >-
          Group 1: FGFR3 chondrodysplasia group. Disorders caused by
          gain-of-function (and, for CATSHL, loss-of-function) variation in
          FGFR3 — thanatophoric dysplasia types 1 and 2, SADDAN,
          achondroplasia, hypochondroplasia, CATSHL syndrome. FGFR3-related
          craniosynostosis is listed in group 33 and LADD syndrome in group
          41 instead.
      type_2_collagen:
        description: >-
          Group 2: Type 2 collagen group. COL2A1-related type II
          collagenopathies spanning a lethal-to-mild continuum —
          achondrogenesis type 2, hypochondrogenesis, platyspondylic dysplasia
          Torrance type, spondyloepiphyseal dysplasia congenita, SEMD
          Strudwick type, Kniest dysplasia, spondyloperipheral dysplasia,
          Czech dysplasia, Stickler syndrome type 1.
      type_11_collagen:
        description: >-
          Group 3: Type 11 collagen group. COL11A1/COL11A2 disorders —
          Stickler syndrome types 2 and 3, Marshall syndrome,
          fibrochondrogenesis, otospondylomegaepiphyseal dysplasia (OSMED,
          recessive and dominant/Weissenbacher-Zweymuller types).
      sulphation_disorders:
        description: >-
          Group 4: Sulphation disorders group. Defects of sulfate transport
          and proteoglycan sulfation — SLC26A2 (achondrogenesis type 1B,
          atelosteogenesis type 2, diastrophic dysplasia, recessive MED),
          PAPSS2 (SEMD PAPSS2 type, recessive brachyolmia), IMPAD1, CHST3
          (chondrodysplasia with congenital joint dislocations), and
          CHST14/DSE (musculocontractural Ehlers-Danlos syndrome).
      perlecan:
        description: >-
          Group 5: Perlecan group. HSPG2 (perlecan) disorders — dyssegmental
          dysplasia (Silverman-Handmaker and Rolland-Desbuquois types) and
          Schwartz-Jampel syndrome (myotonic chondrodystrophy).
      aggrecan:
        description: >-
          Group 6: Aggrecan group. ACAN disorders — SED Kimberley type, SEMD
          aggrecan type, and short stature with advanced bone age.
      filamin_and_related:
        description: >-
          Group 7: Filamin group and related disorders. FLNA/FLNB
          filaminopathies and mechanistically allied conditions —
          frontometaphyseal dysplasia (FLNA, MAP3K7, TAB2), Melnick-Needles
          syndrome, otopalatodigital syndromes types 1 and 2, terminal osseous
          dysplasia, atelosteogenesis types 1 and 3, dominant Larsen syndrome,
          spondylocarpotarsal synostosis (FLNB, MYH3), Frank-ter Haar syndrome
          (SH3PXD2B), cardiospondylocarpofacial syndrome (MAP3K7).
      trpv4:
        close_mappings:
          - MONDO:0018240   # TRPV4-related bone disorder
        description: >-
          Group 8: TRPV4 group. TRPV4 skeletal channelopathies spanning a
          severity continuum — metatropic dysplasia, SED Maroteaux type,
          spondylometaphyseal dysplasia Kozlowski type, autosomal dominant
          brachyolmia, familial digital arthropathy-brachydactyly.

      # =====================================================================
      # Group 9: ciliary
      # =====================================================================

      ciliopathies_with_major_skeletal_involvement:
        description: >-
          Group 9: Ciliopathies with major skeletal involvement. Skeletal
          ciliopathies caused by intraflagellar-transport and basal-body
          defects — chondroectodermal dysplasia (Ellis-van Creveld),
          short-rib-polydactyly syndromes types 1-5, asphyxiating thoracic
          dysplasia (Jeune), cranioectodermal dysplasia
          (Levin-Sensenbrenner), Mainzer-Saldino syndrome, axial
          spondylometaphyseal dysplasia, orofaciodigital syndrome types 2 and
          4, thoracolaryngopelvic dysplasia. Weyers acrofacial (acrodental)
          dysostosis is listed in group 34 instead.

      # =====================================================================
      # Groups 10-14: defined radiographically, by the affected bone segment
      # =====================================================================

      multiple_epiphyseal_dysplasia_and_pseudoachondroplasia:
        description: >-
          Group 10: Multiple epiphyseal dysplasia and pseudoachondroplasia
          group. COMP, MATN3, and type IX collagen (COL9A1/2/3) disorders —
          pseudoachondroplasia, dominant multiple epiphyseal dysplasia,
          recessive Stickler syndrome.
      metaphyseal_dysplasias:
        description: >-
          Group 11: Metaphyseal dysplasias. Disorders with predominantly
          metaphyseal change — metaphyseal dysplasia Schmid type (COL10A1),
          cartilage-hair hypoplasia (RMRP), Jansen type and Eiken dysplasia
          (PTH1R), POP1 type, Shwachman-Diamond syndrome (SBDS, EFL1,
          DNAJC21, SRP54), metaphyseal anadysplasia types 1 and 2 (MMP13,
          MMP9), metaphyseal dysplasia with maxillary hypoplasia (RUNX2).
      spondylometaphyseal_dysplasias:
        description: >-
          Group 12: Spondylometaphyseal dysplasias (SMD). Combined vertebral
          and metaphyseal involvement — spondyloenchondrodysplasia (ACP5),
          odontochondrodysplasia (TRIP11), SMD corner-fracture/Sutcliffe type
          (FN1), SMD with cone-rod dystrophy (PCYT1A).
      spondylo_epi_metaphyseal_dysplasias:
        description: >-
          Group 13: Spondylo-epi-(meta)-physeal dysplasias (SE(M)D). A large,
          molecularly heterogeneous group with vertebral plus epiphyseal (with
          or without metaphyseal) involvement — Dyggve-Melchior-Clausen
          dysplasia, immuno-osseous dysplasia (Schimke), Wolcott-Rallison
          syndrome, the named SEMD types (matrilin/MATN3, biglycan, NANS,
          RSPRY1, TMEM165, EXTL3, DDRGK1, UFSP2, DDR2), X-linked SED tarda
          (TRAPPC2), spondylodysplastic Ehlers-Danlos syndrome (SLC39A13),
          SPONASTRIME dysplasia, Steel syndrome, CODAS, EVEN-PLUS and CAGSSS
          syndromes.
      severe_spondylodysplastic_dysplasias:
        description: >-
          Group 14: Severe spondylodysplastic dysplasias. Perinatally
          severe/lethal platyspondylic conditions — achondrogenesis type 1A
          (TRIP11), Schneckenbecken dysplasia (SLC35D1), SMD Sedaghatian type
          (GPX4), opsismodysplasia (INPPL1).

      # =====================================================================
      # Groups 15-17: limb-segment (acro/meso/rhizo) patterns
      # =====================================================================

      acromelic_dysplasias:
        description: >-
          Group 15: Acromelic dysplasias. Short-hand/foot dysplasias —
          trichorhinophalangeal dysplasia types 1-3 (TRPS1, and the
          Langer-Giedion contiguous deletion), acrocapitofemoral dysplasia
          (IHH), geleophysic and acromicric dysplasia (ADAMTSL2, FBN1,
          LTBP3), Weill-Marchesani syndrome, Myhre dysplasia (SMAD4),
          acrodysostosis (PDE4D, PRKAR1A), Leri pleonosteosis.
      acromesomelic_dysplasias:
        close_mappings:
          - MONDO:0019696   # acromesomelic dysplasia
        description: >-
          Group 16: Acromesomelic dysplasias. BMP/GDF/NPR2-pathway disorders
          with combined middle- and distal-segment shortening — acromesomelic
          dysplasia type Maroteaux (NPR2), Grebe dysplasia and the
          GDF5/BMPR1B chondrodysplasias, fibular hypoplasia with complex
          brachydactyly (Du Pan).
      mesomelic_and_rhizomesomelic_dysplasias:
        description: >-
          Group 17: Mesomelic and rhizo-mesomelic dysplasias. Middle-segment
          (with or without proximal-segment) shortening — Leri-Weill
          dyschondrosteosis and Langer mesomelic dysplasia (SHOX), Robinow
          syndrome (ROR2, NXN, WNT5A, DVL1, DVL3, FZD2), omodysplasia (GPC6,
          FZD2), and the Kantaputra, Nievergelt, Kozlowski-Reardon,
          Savarirayan, and Verloes-David-Pfeiffer mesomelic dysplasias.

      # =====================================================================
      # Groups 18-21: bent bones, primordial dwarfism, dislocations, CDP
      # =====================================================================

      bent_bone_dysplasia:
        description: >-
          Group 18: Bent bone dysplasia group. Disorders sharing the
          radiographic sign of bent (angulated) long bones — campomelic
          dysplasia (SOX9), Stuve-Wiedemann dysplasia (LIFR), kyphomelic
          dysplasia, bent bone dysplasia FGFR2 type. Renamed in the 2019
          revision from "Campomelic dysplasia and related disorders".
      primordial_dwarfism_and_slender_bones:
        description: >-
          Group 19: Primordial dwarfism and slender bones group. Severe pre-
          and postnatal growth restriction with gracile tubular bones — 3-M
          syndrome (CUL7, OBSL1, CCDC8), microcephalic osteodysplastic
          primordial dwarfism (RNU4ATAC, PCNT2, and the
          ATR/RBBP8/CEP152/DNA2/TRAIP/CENPE group), Roifman and Lowry-Wood
          syndromes, Sanjad-Sakati (TBCE) and Kenny-Caffey/osteocraniostenosis
          (FAM111A) syndromes, IMAGe syndrome, Hallermann-Streiff and
          Saul-Wilson syndromes. Renamed in the 2019 revision from "Slender
          bone dysplasia group".
      dysplasias_with_multiple_joint_dislocations:
        description: >-
          Group 20: Dysplasias with multiple joint dislocations. Largely
          proteoglycan-biosynthesis (linkeropathy) disorders — Desbuquois
          dysplasia types 1 and 2 (CANT1, XYLT1), spondyloepimetaphyseal
          dysplasia with joint laxity (KIF22, B3GALT6, EXOC6B), CSGALNACT1
          and B3GAT3 deficiency, pseudodiastrophic dysplasia, and the
          kyphoscoliotic Ehlers-Danlos syndromes (PLOD1, FKBP14).
      chondrodysplasia_punctata:
        description: >-
          Group 21: Chondrodysplasia punctata (CDP) group. Disorders with
          epiphyseal stippling — X-linked dominant Conradi-Hunermann CDPX2
          (EBP) and X-linked recessive brachytelephalangic CDPX1 (ARSE/ARSL),
          rhizomelic CDP (PEX7, GNPAT, AGPS, FAR1, PEX5), CHILD syndrome
          (NSDHL), Greenberg dysplasia (LBR), Keutel syndrome (MGP).

      # =====================================================================
      # Groups 22-26: bone density and mineralization
      # =====================================================================

      neonatal_osteosclerotic_dysplasias:
        description: >-
          Group 22: Neonatal osteosclerotic dysplasias. Increased bone density
          presenting at birth or in early infancy — Blomstrand dysplasia
          (PTH1R), desmosterolosis (DHCR24), Caffey disease (COL1A1), Raine
          dysplasia (FAM20C), Al-Gazali-type dysplastic cortical hyperostosis.
      osteopetrosis_and_related:
        description: >-
          Group 23: Osteopetrosis and related disorders. Osteoclast failure
          with defective bone resorption — infantile and intermediate
          osteopetrosis (TCIRG1, CLCN7, OSTM1, SNX10, TNFSF11, TNFRSF11A,
          PLEKHM1), late-onset (Albers-Schonberg) osteopetrosis, osteopetrosis
          with renal tubular acidosis (CA2), syndromic forms with ectodermal
          dysplasia/immune defect (IKBKG) or defective leucocyte adhesion
          (FERMT3), osteosclerotic metaphyseal dysplasia (LRRK1),
          pycnodysostosis (CTSK), dysosteosclerosis.
      other_sclerosing_bone_disorders:
        description: >-
          Group 24: Other sclerosing bone disorders. Increased bone mass or
          density from mechanisms other than osteoclast failure —
          osteopoikilosis and melorheostosis (LEMD3, MAP2K1), osteopathia
          striata with cranial sclerosis (AMER1), sclerosteosis and van Buchem
          disease (SOST, LRP4), craniometaphyseal dysplasia (ANKH, GJA1) and
          craniodiaphyseal dysplasia (SOST), Camurati-Engelmann diaphyseal
          dysplasia (TGFB1), hyperostosis-hyperphosphatemia syndrome (GALNT3,
          FGF23, KL), high-bone-mass LRP5 phenotypes, juvenile Paget disease
          (TNFRSF11B), Pyle disease (SFRP4), Lenz-Majewski hyperostotic
          dysplasia (PTDSS1), oculodentoosseous dysplasia (GJA1), Ghosal
          hematodiaphyseal dysplasia, hypertrophic osteoarthropathy.
      osteogenesis_imperfecta_and_decreased_bone_density:
        description: >-
          Group 25: Osteogenesis Imperfecta and decreased bone density group.
          OI types 1-5 across the classical COL1A1/COL1A2 loci and the
          collagen chaperone/modification, WNT1, IFITM5, and SERPINF1 genes,
          plus non-OI low-bone-mass and bone-fragility conditions — X-linked
          and autosomal dominant osteoporosis, osteoporosis-pseudoglioma
          syndrome (LRP5), Bruck syndrome types 1 and 2, Cole-Carpenter
          dysplasia (P4HB, SEC24D), spondylo-ocular dysplasia (XYLT2),
          gnathodiaphyseal dysplasia (ANO5), spondylodysplastic
          Ehlers-Danlos syndrome (B4GALT7), geroderma osteodysplasticum,
          autosomal recessive cutis laxa types 2A and 2B, and the
          Wiedemann-Rautenstrauch and Singleton-Merten syndromes.
      abnormal_mineralization:
        description: >-
          Group 26: Abnormal mineralization group. Disorders of the
          mineral/phosphate axis with skeletal consequences —
          hypophosphatasia (ALPL), X-linked and autosomal hypophosphatemic
          rickets (PHEX, FGF23, DMP1, ENPP1, CLCN5, SLC34A3), vitamin
          D-dependent rickets types 1A/1B/2A/2B (CYP27B1, CYP2R1, VDR),
          familial and neonatal hyperparathyroidism (CDC73, GCM2, CASR,
          TRPV6) and familial hypocalciuric hypercalcemia, and familial
          chondrocalcinosis / calcium pyrophosphate deposition disease type 2
          (ANKH).

      # =====================================================================
      # Groups 27-31: storage, osteolysis, disorganized development,
      # overgrowth, inflammatory
      # =====================================================================

      lysosomal_storage_with_skeletal_involvement:
        description: >-
          Group 27: Lysosomal storage diseases with skeletal involvement
          (dysostosis multiplex group). Mucopolysaccharidoses (types 1-4, 6
          and 7, plus VPS33A-related MPS-plus syndrome), mucolipidoses II and
          III, oligosaccharidoses (fucosidosis, alpha- and beta-mannosidosis,
          aspartylglucosaminuria, sialidosis, galactosialidosis), sialic acid
          storage disease, GM1 gangliosidosis, multiple sulfatase deficiency.
      osteolysis:
        description: >-
          Group 28: Osteolysis group. Progressive resorption of bone —
          familial expansile osteolysis (TNFRSF11A), multicentric osteolysis
          with nodulosis and arthropathy (MMP2, MMP14), multicentric
          carpal-tarsal osteolysis (MAFB), Hajdu-Cheney syndrome (NOTCH2),
          mandibuloacral dysplasia and Hutchinson-Gilford progeria (LMNA,
          ZMPSTE24).
      disorganized_development_of_skeletal_components:
        description: >-
          Group 29: Disorganized development of skeletal components group.
          Focal or mosaic disorganized bone and cartilage growth — multiple
          cartilaginous exostoses (EXT1, EXT2), enchondromatosis (Ollier) and
          Maffucci syndrome (IDH1, IDH2), metachondromatosis (PTPN11),
          cherubism (SH3BP2), polyostotic fibrous dysplasia / McCune-Albright
          syndrome (GNAS), fibrodysplasia ossificans progressiva (ACVR1),
          neurofibromatosis type 1, osteoglophonic dysplasia (FGFR1),
          Nasu-Hakola disease (TREM2, TYROBP), dysplasia epiphysealis
          hemimelica (Trevor), Gorham-Stout disease, osteofibrous dysplasia
          (MET).
      overgrowth_syndromes_with_skeletal_involvement:
        description: >-
          Group 30: Overgrowth (tall stature) syndromes with skeletal
          involvement. Sotos (NSD1), Weaver (EZH2), Tatton-Brown-Rahman
          (DNMT3A), Luscan-Lumish (SETD2) and Marshall-Smith (NFIX)
          syndromes, Proteus syndrome (AKT1) and CLOVES (PIK3CA), Marfan
          syndrome (FBN1), congenital contractural arachnodactyly (FBN2),
          Loeys-Dietz syndrome types 1-6 and Meester-Loeys syndrome (BGN).
      genetic_inflammatory_rheumatoid_like_osteoarthropathies:
        description: >-
          Group 31: Genetic inflammatory/rheumatoid-like osteoarthropathies.
          Monogenic conditions mimicking inflammatory arthritis or
          osteomyelitis — progressive pseudorheumatoid dysplasia
          (WISP3/CCN6), CINCA/NOMID (NLRP3/CIAS1), deficiency of the IL-1
          receptor antagonist (IL1RN), Majeed syndrome (LPIN2), hyaline
          fibromatosis syndrome (ANTXR2).

      # =====================================================================
      # Groups 32-36: dysostoses
      # =====================================================================

      cleidocranial_dysplasia_and_related:
        description: >-
          Group 32: Cleidocranial dysplasia and related disorders with
          maxillary hypoplasia. Cleidocranial dysplasia (RUNX2), CDAGS
          syndrome, Yunis-Varon dysplasia (FIG4, VAC14), isolated parietal
          foramina (ALX4, MSX2) and parietal foramina with cleidocranial
          dysplasia.
      craniosynostosis_syndromes:
        description: >-
          Group 33: Craniosynostosis syndromes. Syndromic premature suture
          fusion — Pfeiffer (FGFR1, FGFR2), Apert, Crouzon (with and without
          acanthosis nigricans), Muenke and Beare-Stevenson syndromes,
          Saethre-Chotzen syndrome (TWIST1), Antley-Bixler syndrome (POR),
          Boston-type (MSX2), coronal (TCF12) and complex (ERF)
          craniosynostosis, Shprintzen-Goldberg syndrome (SKI), Baller-Gerold
          syndrome (RECQL4), Carpenter syndrome (RAB23, MEGF8).
      dysostoses_with_predominant_craniofacial_involvement:
        description: >-
          Group 34: Dysostoses with predominant craniofacial involvement.
          Mandibulofacial dysostoses (Treacher Collins — TCOF1, POLR1C,
          POLR1D; EFTUD2-related with microcephaly; EDNRA-related with
          alopecia), acrofacial dysostoses (Nager and Rodriguez — SF3B4;
          Miller — DHODH; Cincinnati — POLR1A), frontonasal dysplasias types
          1-3 (ALX3, ALX4, ALX1), craniofrontonasal syndrome (EFNB1),
          acromelic frontonasal dysostosis (ZSWIM6), auriculocondylar syndrome
          (GNAI3, PLCB4, EDN1), Richieri-Costa-Pereira syndrome (EIF4A3),
          orofaciodigital syndrome type I (OFD1), Weyers acrofacial
          (acrodental) dysostosis (EVC1, EVC2), hemifacial microsomia.
      dysostoses_with_predominant_vertebral_and_costal_involvement:
        description: >-
          Group 35: Dysostoses with predominant vertebral with and without
          costal involvement. Spondylocostal dysostosis (DLL3, MESP2, LFNG,
          HES7, TBX6, RIPPLY2) and vertebral segmentation defects,
          Klippel-Feil syndrome (GDF6, MEOX1, GDF3, MYO18B), Currarino
          syndrome (MNX1), cerebrocostomandibular syndrome (SNRPB), NAD
          deficiency syndrome (HAAO, KYNU), diaphanospondylodysostosis
          (BMPER), spondylo-megaepiphyseal-metaphyseal dysplasia (NKX3-2).
      patellar_dysostoses:
        description: >-
          Group 36: Patellar dysostoses. Ischiopatellar (small patella)
          dysplasia (TBX4), nail-patella syndrome (LMX1B), genitopatellar
          syndrome (KAT6B), and ear-patella-short stature (Meier-Gorlin)
          syndrome with its pre-replication-complex genes (ORC1, ORC4, ORC6,
          CDT1, CDC6, GMNN, CDC45).

      # =====================================================================
      # Groups 37-42: limb malformation, reduction defects, synostoses
      # =====================================================================

      brachydactyly_without_extraskeletal_manifestations:
        description: >-
          Group 37: Brachydactylies (without extraskeletal manifestations).
          Isolated brachydactyly types A1 (IHH), A2 (BMPR1B, BMP2, GDF5), B
          (ROR2), B2 (NOG), C (GDF5), D (HOXD13) and E (PTHLH, HOXD13), plus
          brachydactyly with anonychia (Cooks syndrome, KCNJ2).
      brachydactyly_with_extraskeletal_manifestations:
        description: >-
          Group 38: Brachydactylies (with extraskeletal manifestations).
          Syndromic brachydactyly — brachydactyly-mental retardation syndrome
          (HDAC4), hyperphosphatasia with mental retardation (PIGV),
          brachydactyly-hypertension/Bilginturan syndrome (PDE3A), Temtamy
          preaxial brachydactyly (CHSY1), Rubinstein-Taybi syndrome (CREBBP,
          EP300), Coffin-Siris syndrome and the BAF-complex genes (ARID1B,
          SMARCB1, SMARCA4, SMARCE1), Feingold syndrome (MYCN),
          hand-foot-genital syndrome (HOXA13), Catel-Manzke syndrome (TGDS),
          pseudohypoparathyroidism type IA (GNAS).
      limb_hypoplasia_reduction_defects:
        description: >-
          Group 39: Limb hypoplasia-reduction defects group. Ulnar-mammary
          syndrome (TBX3), Holt-Oram syndrome (TBX5), Cornelia de Lange
          syndrome and the cohesinopathies (NIPBL, SMC1A, SMC3, RAD21,
          HDAC8), Fanconi anemia, thrombocytopenia-absent radius (RBM8A),
          Roberts syndrome (ESCO2), Okihiro/Duane-radial ray syndrome
          (SALL4), RAPADILINO syndrome (RECQL4), Adams-Oliver syndrome
          (ARHGAP31, DOCK6, NOTCH1, DLL4, RBPJ, EOGT), tibial hemimelia,
          acheiropodia and tetra-amelia (SHH, WNT3, RSPO2), Al-Awadi/
          Raas-Rothschild and Fuhrmann syndromes (WNT7A), Poland syndrome.
      ectrodactyly_with_and_without_other_manifestations:
        description: >-
          Group 40: Ectrodactyly with and without other manifestations.
          Split-hand/foot malformation and the ectrodactyly-ectodermal
          dysplasia-clefting spectrum — TP63-related EEC3, AEC, limb-mammary
          and SHFM4 phenotypes, SHFM1 (DLX5, DLX6), the 10q24-duplication
          SHFM3 locus, SHFM6 (WNT10B), split-foot malformation with mesoaxial
          polydactyly (ZAK), EEM syndrome (CDH3), Hartsfield syndrome (FGFR1).
      polydactyly_syndactyly_triphalangism:
        description: >-
          Group 41: Polydactyly-Syndactyly-Triphalangism group. Preaxial
          polydactyly types 1-4 and the SHH/ZRS limb enhancer, GLI3-related
          Greig cephalopolysyndactyly and Pallister-Hall syndromes,
          synpolydactyly (HOXD13, FBLN1), Townes-Brocks syndrome (SALL1),
          syndactyly types 1-5 and Cenani-Lenz syndactyly (LRP4),
          Laurin-Sandrow mirror-image polydactyly, acrocallosal syndrome
          (KIF7), Filippi syndrome (CKAP2L), STAR syndrome (FAM58A), Meckel
          syndrome types 1-6, LADD syndrome (FGFR2, FGFR3, FGF10).
      defects_in_joint_formation_and_synostoses:
        description: >-
          Group 42: Defects in joint formation and synostoses. Multiple
          synostoses syndrome (NOG, GDF5, FGF9, GDF6), radio-ulnar synostosis
          with amegakaryocytic thrombocytopenia (HOXA11, MECOM), Liebenberg
          syndrome (PITX1), SAMS syndrome (GSC).

id: https://w3id.org/monarch-initiative/dismech/classifications/icdo_morphology
name: dismech-icdo-morphology
title: ICD-O Morphology Classification
description: Histological/morphological classification of cancers based on ICD-O morphology
  axis. Applies only to neoplastic diseases. Single-inheritance hierarchy.
imports:
- linkml:types
prefixes:
  linkml: https://w3id.org/linkml/
  dismech: https://w3id.org/monarch-initiative/dismech/
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  # ICD-O is WHO-copyrighted and has no OBO PURL, so this expands through
  # Bioregistry rather than the OBO namespace. Note the local identifier
  # contains a slash (``ICDO:8140/0``); only the prefix is NCName-constrained,
  # so that is a legal CURIE, but it will not round-trip through an
  # ``obo/ICDO_`` style expansion.
  ICDO: "https://bioregistry.io/icdo:"
default_prefix: dismech
enums:
  ICDOMorphologyEnum:
    description: >-
      ICD-O morphology axis classification for cancer subtypes. Values link to
      NCI Thesaurus for formal definitions.

      This is a coarse histogenetic vocabulary, not a slot for four-digit ICD-O
      codes. Two rules govern it.

      Granularity (the lump/split rule): a value names a morphology *family*,
      not an individual tumour entity. A family earns its own value when the
      knowledge base holds neoplastic entries that no existing value can hold
      correctly, and when it is a top-level morphology group in ICD-O / the WHO
      classification. A sub-family is split out of its parent only when it
      dominates curation practice — which is why ``Adenocarcinoma`` and
      ``Squamous Cell Carcinoma`` sit beside ``Carcinoma``, and ``Multiple
      Myeloma`` beside ``Plasma Cell Neoplasm``, while single entities (glomus
      tumour, chordoma, GIST) are held by their family rather than given a value
      of their own.

      Behaviour: this axis names the morphology family, and most values are
      behaviour-neutral — ``Nerve Sheath Neoplasm`` and ``Pericytic Neoplasm``
      cover benign and malignant members alike. Where ICD-O itself splits a
      family on behaviour, the values follow it (``Adenoma`` vs
      ``Adenocarcinoma``). Do not read malignancy into a value that does not
      assert it. A first-class behaviour slot (the ICD-O ``/0``-``/3`` digit)
      and a place for the four-digit code itself remain open on
      monarch-initiative/dismech#7548.

      When no value fits, omit ``icdo_morphology`` and record why in the entry's
      ``notes`` or a ``CURATION_TODO`` discussion. There is deliberately no
      ``Other`` value: the omissions are the signal that tells us which family
      to add next, and this expansion was driven by exactly those notes.
    permissible_values:
      Carcinoma:
        description: Cancer arising from epithelial cells
        meaning: NCIT:C2916
        exact_mappings:
        - MONDO:0004993
        - ICDO:8010/3
      Adenocarcinoma:
        description: Carcinoma arising from glandular epithelium
        meaning: NCIT:C2852
        exact_mappings:
        - MONDO:0004970
        - ICDO:8140/3
      Squamous Cell Carcinoma:
        description: Carcinoma arising from squamous epithelium
        meaning: NCIT:C2929
        exact_mappings:
        - MONDO:0005096
        - ICDO:8070/3
      Sarcoma:
        description: Cancer arising from mesenchymal tissue
        meaning: NCIT:C9118
        exact_mappings:
        - MONDO:0005089
        - ICDO:8800/3
      Leukemia:
        description: Cancer of blood-forming tissues
        meaning: NCIT:C3161
        exact_mappings:
        - MONDO:0005059
        - ICDO:9800/3
      Lymphoma:
        description: Cancer of the lymphatic system
        meaning: NCIT:C3208
        exact_mappings:
        - MONDO:0005062
        - ICDO:9590/3
      Multiple Myeloma:
        description: Cancer of plasma cells
        meaning: NCIT:C3242
        exact_mappings:
        - MONDO:0009693
        - ICDO:9732/3
      Melanoma:
        description: Cancer arising from melanocytes
        meaning: NCIT:C3224
        exact_mappings:
        - MONDO:0005105
        - ICDO:8720/3
      Glioma:
        description: Cancer arising from glial cells
        meaning: NCIT:C3059
        exact_mappings:
        - MONDO:0021042
        - ICDO:9380/3
      Embryonal Neoplasm:
        description: Cancer arising from embryonic tissue
        meaning: NCIT:C3264
        exact_mappings:
        - MONDO:0005564
      # --- Epithelial families beyond carcinoma -----------------------------
      Adenoma:
        description: Benign neoplasm of glandular epithelium; the benign counterpart
          of Adenocarcinoma
        meaning: NCIT:C2855
        exact_mappings:
        - MONDO:0004972
        - ICDO:8140/0
      Trophoblastic Tumor:
        description: Neoplasm of trophoblastic cells, gestational or non-gestational
        meaning: NCIT:C3422
        exact_mappings:
        - MONDO:0002872
      Mesothelial Neoplasm:
        description: Neoplasm arising from the mesothelium lining the pleura, peritoneum,
          pericardium or tunica vaginalis
        meaning: NCIT:C3786
        exact_mappings:
        - MONDO:0006856
      # --- Mesenchymal families beyond sarcoma ------------------------------
      Pericytic Neoplasm:
        description: Mesenchymal neoplasm arising from the perivascular (pericytic)
          cells of connective and soft tissue
        meaning: NCIT:C6528
        exact_mappings:
        - MONDO:0002604
      # --- Neural and meningeal families beyond glioma ----------------------
      Nerve Sheath Neoplasm:
        description: Neoplasm arising from the cells of the peripheral nerve sheath
        meaning: NCIT:C4972
        exact_mappings:
        - MONDO:0002547
      Meningioma:
        description: Neoplasm of meningothelial (arachnoidal) cells
        meaning: NCIT:C3230
        exact_mappings:
        - MONDO:0016642
        - ICDO:9530/0
      # --- Germ cell and gonadal stromal families ---------------------------
      Germ Cell Tumor:
        description: Gonadal or extragonadal neoplasm originating from germ cells
        meaning: NCIT:C3708
        exact_mappings:
        - MONDO:0005040
      Sex Cord-Stromal Tumor:
        description: Neoplasm of the gonadal sex cord and stromal cells (granulosa,
          Sertoli, Leydig, fibroblast)
        meaning: NCIT:C3794
        exact_mappings:
        - MONDO:0006055
        - ICDO:8590/1
      # --- Neuroendocrine ---------------------------------------------------
      Neuroendocrine Neoplasm:
        description: Neoplasm of cells showing neuroendocrine differentiation
        meaning: NCIT:C3809
        exact_mappings:
        - MONDO:0019496
      # --- Haematolymphoid families beyond leukemia and lymphoma ------------
      Plasma Cell Neoplasm:
        description: Clonal proliferation of immunoglobulin-secreting plasma cells
        meaning: NCIT:C4665
        exact_mappings:
        - MONDO:0004959
      Myeloproliferative Neoplasm:
        description: Clonal myeloid neoplasm with effective but excessive production
          of one or more mature blood cell lineages
        meaning: NCIT:C4345
        exact_mappings:
        - MONDO:0020076
        - ICDO:9960/3
      Myelodysplastic Syndrome:
        description: Clonal myeloid neoplasm characterised by dysplasia and ineffective
          haematopoiesis
        meaning: NCIT:C3247
        exact_mappings:
        - MONDO:0018881
        - ICDO:9989/3
      Histiocytic and Dendritic Cell Neoplasm:
        description: Neoplasm of histiocytes and accessory/dendritic cells
        meaning: NCIT:C9294
        exact_mappings:
        - MONDO:0006247

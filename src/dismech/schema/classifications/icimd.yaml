id: https://w3id.org/monarch-initiative/dismech/classifications/icimd
name: dismech-icimd
title: International Classification of Inherited Metabolic Disorders (ICIMD)
description: >-
  Mechanistic (biochemical-pathway) classification of inherited metabolic
  disorders following the consensus International Classification of Inherited
  Metabolic Disorders (ICIMD; Ferreira CR, Rahman S, Keller M, Zschocke J &
  ICIMD Advisory Group, J Inherit Metab Dis 2021;44(1):164-177; PMID:33340416,
  DOI:10.1002/jimd.12348). ICIMD is a three-level hierarchy — 24 categories
  (layer 1) over 124 disease groups (layer 2) over ~1,450 individual disorders
  (layer 3). This enum encodes layers 1 and 2 as a single hierarchical
  permissible-value set: each category is a top-level value, and each group
  declares its parent category via ``is_a``. Curators should assign the most
  specific applicable node (usually a group); the parent category is then
  derivable through ``is_a``. Both category- and group-level values are valid
  assignments, so an entry may be tagged at category level when the specific
  group is unknown.

  Provenance note: the category set and group membership are transcribed from
  the ICIMD paper's Results section (the 24 numbered categories) and its
  Figure 1 sunburst (the group ring). The groups here are the primary
  ("group"-ring) nodes of that sunburst; a handful of the deepest
  glycosylation and glycerophospholipid subdivisions are folded into their
  parent group, so this enum carries 113 groups rather than the paper's
  headline 124. The eight ICIMD "super-domains" (e.g. "Intermediary
  metabolism: nutrients") sit ABOVE the category level and are recorded in the
  category descriptions rather than as separate enum nodes.

imports:
  - linkml:types

prefixes:
  linkml: https://w3id.org/linkml/
  dismech: https://w3id.org/monarch-initiative/dismech/

default_prefix: dismech

enums:
  ICIMDEnum:
    description: >-
      ICIMD category (layer 1) and disease group (layer 2) assignments. Groups
      point to their parent category via ``is_a``. See the schema-level
      description for provenance and the assign-most-specific rule.
    permissible_values:

      # =====================================================================
      # Super-domain: Intermediary metabolism — nutrients
      # =====================================================================

      # --- Category 1 ---------------------------------------------------
      amino_acid_metabolism:
        description: >-
          ICIMD category 1: Disorders of amino acid metabolism (super-domain:
          intermediary metabolism — nutrients). Enzyme deficiencies of amino
          acid pathways, frequently causing accumulation of toxic metabolites.
      branched_chain_amino_acids:
        description: Disorders of branched-chain amino acid (leucine, isoleucine, valine) metabolism.
        is_a: amino_acid_metabolism
      phe_and_tyr:
        description: Disorders of phenylalanine and tyrosine metabolism.
        is_a: amino_acid_metabolism
      sulfur_containing_amino_acids:
        description: Disorders of sulfur-containing amino acid (methionine, homocysteine, cysteine) metabolism.
        is_a: amino_acid_metabolism
      gly_and_ser:
        description: Disorders of glycine and serine metabolism.
        is_a: amino_acid_metabolism
      orn_pro_and_hyp:
        description: Disorders of ornithine, proline and hydroxyproline metabolism.
        is_a: amino_acid_metabolism
      lys_hyl_and_trp:
        description: Disorders of lysine, hydroxylysine and tryptophan metabolism.
        is_a: amino_acid_metabolism
      glu_gln_and_asp_asn:
        description: Disorders of glutamate/glutamine and aspartate/asparagine metabolism.
        is_a: amino_acid_metabolism
      histidine_metabolism:
        description: Disorders of histidine metabolism.
        is_a: amino_acid_metabolism
      organic_acidurias:
        description: >-
          Organic acidurias — deficiencies of mitochondrial enzymes for
          breakdown of CoA-activated small carboxylic acids, mostly from amino
          acid deamination.
        is_a: amino_acid_metabolism
      urea_cycle_and_hyperammonemias:
        description: Urea cycle disorders and other hyperammonemias.
        is_a: amino_acid_metabolism
      amino_acid_transport:
        description: Disorders of amino acid transport.
        is_a: amino_acid_metabolism
      amino_acids_other:
        description: Other disorders of amino acid metabolism.
        is_a: amino_acid_metabolism

      # --- Category 2 ---------------------------------------------------
      peptide_and_amine_metabolism:
        description: >-
          ICIMD category 2: Disorders of peptide and amine metabolism
          (super-domain: intermediary metabolism — nutrients).
      glutathione_metabolism:
        description: Disorders of glutathione biosynthesis and regeneration.
        is_a: peptide_and_amine_metabolism
      peptides_other:
        description: Other peptide disorders, including dipeptidase deficiencies.
        is_a: peptide_and_amine_metabolism
      methylamine_metabolism:
        description: Disorders of methylamine metabolism.
        is_a: peptide_and_amine_metabolism
      polyamine_metabolism:
        description: Disorders of polyamine metabolism.
        is_a: peptide_and_amine_metabolism

      # --- Category 3 ---------------------------------------------------
      carbohydrate_metabolism:
        description: >-
          ICIMD category 3: Disorders of carbohydrate metabolism (super-domain:
          intermediary metabolism — nutrients).
      galactose_and_fructose:
        description: Disorders of galactose and fructose metabolism.
        is_a: carbohydrate_metabolism
      gluconeogenesis:
        description: Disorders of gluconeogenesis (including pyruvate carboxylase deficiency).
        is_a: carbohydrate_metabolism
      glycolysis:
        description: Disorders of glycolysis.
        is_a: carbohydrate_metabolism
      glycogen_metabolism:
        description: Disorders of glycogen metabolism (glycogen storage diseases).
        is_a: carbohydrate_metabolism
      pentose_polyol_metabolism:
        description: Disorders of pentose and polyol metabolism.
        is_a: carbohydrate_metabolism
      carbohydrate_transport_and_absorption:
        description: Disorders of carbohydrate (hexose) transmembrane transport and absorption.
        is_a: carbohydrate_metabolism

      # --- Category 4 ---------------------------------------------------
      fatty_acid_and_ketone_body_metabolism:
        description: >-
          ICIMD category 4: Disorders of fatty acid and ketone body metabolism
          (super-domain: intermediary metabolism — nutrients).
      carnitine_metabolism:
        description: Disorders of carnitine metabolism.
        is_a: fatty_acid_and_ketone_body_metabolism
      mitochondrial_fatty_acid_oxidation:
        description: Disorders of mitochondrial fatty acid oxidation.
        is_a: fatty_acid_and_ketone_body_metabolism
      ketone_body_metabolism:
        description: Disorders of ketone body synthesis, breakdown and transport.
        is_a: fatty_acid_and_ketone_body_metabolism

      # =====================================================================
      # Super-domain: Intermediary metabolism — energy
      # =====================================================================

      # --- Category 5 ---------------------------------------------------
      energy_substrate_metabolism:
        description: >-
          ICIMD category 5: Disorders of energy substrate metabolism
          (super-domain: intermediary metabolism — energy).
      pyruvate_metabolism:
        description: Disorders of pyruvate metabolism.
        is_a: energy_substrate_metabolism
      krebs_cycle:
        description: Disorders of the Krebs (tricarboxylic acid) cycle.
        is_a: energy_substrate_metabolism
      creatine_metabolism:
        description: Disorders of creatine metabolism.
        is_a: energy_substrate_metabolism

      # --- Category 6 ---------------------------------------------------
      mitochondrial_dna_related_disorders:
        description: >-
          ICIMD category 6: Mitochondrial DNA-related disorders (super-domain:
          intermediary metabolism — energy).
      mtdna_encoded_respiratory_chain_proteins:
        description: Disorders of the 13 mtDNA protein-coding (respiratory chain) genes.
        is_a: mitochondrial_dna_related_disorders
      mtdna_encoded_trna_rrna:
        description: Disorders of mtDNA-encoded tRNA and rRNA genes.
        is_a: mitochondrial_dna_related_disorders
      single_large_scale_mtdna_deletions:
        description: Disorders associated with single large-scale mtDNA deletions.
        is_a: mitochondrial_dna_related_disorders

      # --- Category 7 ---------------------------------------------------
      nuclear_encoded_oxidative_phosphorylation:
        description: >-
          ICIMD category 7: Nuclear-encoded disorders of oxidative
          phosphorylation (super-domain: intermediary metabolism — energy).
      complex_i_subunits_and_assembly_factors:
        description: Nuclear-encoded complex I subunit and assembly factor defects.
        is_a: nuclear_encoded_oxidative_phosphorylation
      complex_ii_subunits_and_assembly_factors:
        description: Nuclear-encoded complex II subunit and assembly factor defects.
        is_a: nuclear_encoded_oxidative_phosphorylation
      complex_iii_subunits_and_assembly_factors:
        description: Nuclear-encoded complex III subunit and assembly factor defects.
        is_a: nuclear_encoded_oxidative_phosphorylation
      complex_iv_subunits_and_assembly_factors:
        description: Nuclear-encoded complex IV subunit and assembly factor defects.
        is_a: nuclear_encoded_oxidative_phosphorylation
      complex_v_subunits_and_assembly_factors:
        description: Nuclear-encoded complex V subunit and assembly factor defects.
        is_a: nuclear_encoded_oxidative_phosphorylation

      # --- Category 8 ---------------------------------------------------
      mitochondrial_cofactor_biosynthesis:
        description: >-
          ICIMD category 8: Disorders of mitochondrial cofactor biosynthesis
          (super-domain: intermediary metabolism — energy).
      coenzyme_q10_biosynthesis:
        description: Disorders of coenzyme Q10 (ubiquinone) biosynthesis.
        is_a: mitochondrial_cofactor_biosynthesis
      lipoic_acid_and_iron_sulfur:
        description: Disorders of lipoic acid and iron-sulfur cluster biosynthesis.
        is_a: mitochondrial_cofactor_biosynthesis
      cytochrome_c:
        description: Disorders of cytochrome c.
        is_a: mitochondrial_cofactor_biosynthesis

      # --- Category 9 ---------------------------------------------------
      mitochondrial_dna_maintenance_and_replication:
        description: >-
          ICIMD category 9: Disorders of mitochondrial DNA maintenance and
          replication (super-domain: intermediary metabolism — energy).
      nucleotide_pool_maintenance:
        description: Disorders of mitochondrial nucleotide pool maintenance.
        is_a: mitochondrial_dna_maintenance_and_replication
      mtdna_replication_and_maintenance:
        description: Disorders of mtDNA replication and maintenance.
        is_a: mitochondrial_dna_maintenance_and_replication

      # --- Category 10 --------------------------------------------------
      mitochondrial_gene_expression:
        description: >-
          ICIMD category 10: Disorders of mitochondrial gene expression
          (super-domain: intermediary metabolism — energy).
      mtdna_transcript_processing_and_modification:
        description: Disorders of mtDNA transcript processing and modification.
        is_a: mitochondrial_gene_expression
      mitochondrial_aminoacyl_trna_synthetases:
        description: Disorders of mitochondrial aminoacyl-tRNA synthetases.
        is_a: mitochondrial_gene_expression
      mitoribosome:
        description: Disorders of the mitoribosome.
        is_a: mitochondrial_gene_expression

      # --- Category 11 --------------------------------------------------
      other_mitochondrial_function:
        description: >-
          ICIMD category 11: Other disorders of mitochondrial function
          (super-domain: intermediary metabolism — energy).
      mitochondrial_shuttles_and_carriers:
        description: Disorders of mitochondrial shuttles and carriers.
        is_a: other_mitochondrial_function
      mitochondrial_protein_import:
        description: Disorders of mitochondrial protein import.
        is_a: other_mitochondrial_function
      mitochondrial_protein_quality_control:
        description: Disorders of mitochondrial protein quality control.
        is_a: other_mitochondrial_function
      mitochondrial_dysfunction_miscellaneous:
        description: Miscellaneous mitochondrial disorders not fitting other groups.
        is_a: other_mitochondrial_function

      # =====================================================================
      # Super-domain: Intermediary metabolism — other
      # =====================================================================

      # --- Category 12 --------------------------------------------------
      metabolite_repair_proofreading:
        description: >-
          ICIMD category 12: Disorders of metabolite repair/proofreading
          (super-domain: intermediary metabolism — other).
      metabolite_proofreading:
        description: >-
          Disorders of metabolite proofreading, addressing the promiscuity of
          certain intermediary-metabolism enzymes.
        is_a: metabolite_repair_proofreading

      # --- Category 13 --------------------------------------------------
      miscellaneous_intermediary_metabolism:
        description: >-
          ICIMD category 13: Miscellaneous disorders of intermediary metabolism
          (super-domain: intermediary metabolism — other).
      glyoxylate_and_oxalate:
        description: Disorders of glyoxylate and oxalate metabolism.
        is_a: miscellaneous_intermediary_metabolism
      intermediary_metabolism_miscellaneous:
        description: Other miscellaneous disorders of intermediary metabolism.
        is_a: miscellaneous_intermediary_metabolism

      # =====================================================================
      # Super-domain: Lipid metabolism and transport
      # =====================================================================

      # --- Category 14 --------------------------------------------------
      lipid_metabolism:
        description: >-
          ICIMD category 14: Disorders of lipid metabolism (super-domain: lipid
          metabolism and transport); follows the LIPID MAPS lipid classification.
      fatty_acyl_synthesis_elongation_and_recycling:
        description: Disorders of fatty acyl synthesis, elongation, and recycling.
        is_a: lipid_metabolism
      peroxisomal_fatty_acid_oxidation:
        description: Disorders of peroxisomal fatty acid oxidation.
        is_a: lipid_metabolism
      eicosanoid_metabolism:
        description: Disorders of eicosanoid metabolism.
        is_a: lipid_metabolism
      glycerolipid_metabolism:
        description: Disorders of glycerolipid metabolism.
        is_a: lipid_metabolism
      glycerophospholipid_metabolism:
        description: Disorders of glycerophospholipid metabolism.
        is_a: lipid_metabolism
      sphingolipid_synthesis_and_recycling:
        description: Disorders of sphingolipid synthesis and recycling.
        is_a: lipid_metabolism
      sterol_metabolism:
        description: Disorders of sterol metabolism.
        is_a: lipid_metabolism
      bile_acid_metabolism:
        description: Disorders of bile acid metabolism.
        is_a: lipid_metabolism

      # --- Category 15 --------------------------------------------------
      lipoprotein_metabolism:
        description: >-
          ICIMD category 15: Disorders of lipoprotein metabolism (super-domain:
          lipid metabolism and transport).
      hypercholesterolemias:
        description: Hypercholesterolemias.
        is_a: lipoprotein_metabolism
      hypertriglyceridemias:
        description: Hypertriglyceridemias.
        is_a: lipoprotein_metabolism
      mixed_hyperlipidemias:
        description: Mixed hyperlipidemias.
        is_a: lipoprotein_metabolism
      hdl_metabolism:
        description: Disorders of high-density lipoprotein (HDL) metabolism.
        is_a: lipoprotein_metabolism
      decreased_ldl_triglycerides:
        description: Disorders with decreased LDL and/or triglycerides.
        is_a: lipoprotein_metabolism
      lipoproteins_other:
        description: Other disorders of lipoprotein metabolism.
        is_a: lipoprotein_metabolism

      # =====================================================================
      # Super-domain: Metabolism of heterocyclic compounds
      # =====================================================================

      # --- Category 16 --------------------------------------------------
      nucleobase_nucleotide_nucleic_acid_metabolism:
        description: >-
          ICIMD category 16: Disorders of nucleobase, nucleotide and nucleic
          acid metabolism (super-domain: metabolism of heterocyclic compounds).
      purine_metabolism:
        description: Disorders of purine metabolism.
        is_a: nucleobase_nucleotide_nucleic_acid_metabolism
      pyrimidine_metabolism:
        description: Disorders of pyrimidine metabolism.
        is_a: nucleobase_nucleotide_nucleic_acid_metabolism
      ectonucleotides_and_nucleic_acids:
        description: Disorders of ectonucleotides and nucleic acids.
        is_a: nucleobase_nucleotide_nucleic_acid_metabolism
      non_mitochondrial_trna_metabolism:
        description: Disorders of non-mitochondrial tRNA metabolism.
        is_a: nucleobase_nucleotide_nucleic_acid_metabolism
      ribosomal_biogenesis:
        description: Disorders of ribosomal biogenesis (non-mitochondrial rRNA metabolism).
        is_a: nucleobase_nucleotide_nucleic_acid_metabolism

      # --- Category 17 --------------------------------------------------
      tetrapyrrole_metabolism:
        description: >-
          ICIMD category 17: Disorders of tetrapyrrole metabolism (super-domain:
          metabolism of heterocyclic compounds).
      heme_synthesis_and_porphyrias:
        description: Disorders of heme biosynthesis (porphyrias).
        is_a: tetrapyrrole_metabolism
      heme_degradation_and_bilirubin:
        description: Disorders of heme breakdown (biliverdin and bilirubin).
        is_a: tetrapyrrole_metabolism

      # =====================================================================
      # Super-domain: Complex molecule and organelle metabolism
      # =====================================================================

      # --- Category 18 --------------------------------------------------
      congenital_disorders_of_glycosylation:
        description: >-
          ICIMD category 18: Congenital disorders of glycosylation (super-domain:
          complex molecule and organelle metabolism).
      n_linked_protein_glycosylation:
        description: Disorders of N-linked protein glycosylation.
        is_a: congenital_disorders_of_glycosylation
      o_linked_protein_glycosylation:
        description: >-
          Disorders of O-linked protein glycosylation (including
          glycosaminoglycan synthesis).
        is_a: congenital_disorders_of_glycosylation
      lipid_glycosylation:
        description: >-
          Disorders of lipid glycosylation (including glycosylphosphatidylinositol
          biosynthesis).
        is_a: congenital_disorders_of_glycosylation
      multiple_glycosylation_pathways:
        description: >-
          Disorders affecting multiple glycosylation pathways (dolichol
          metabolism, Golgi transport and homeostasis, sialic acid metabolism).
        is_a: congenital_disorders_of_glycosylation
      other_glycan_metabolism:
        description: Other disorders of glycan metabolism.
        is_a: congenital_disorders_of_glycosylation

      # --- Category 19 --------------------------------------------------
      organelle_biogenesis_dynamics_and_interactions:
        description: >-
          ICIMD category 19: Disorders of organelle biogenesis, dynamics and
          interactions (super-domain: complex molecule and organelle metabolism).
      mitochondrial_membrane_biogenesis_and_remodeling:
        description: Disorders of mitochondrial membrane biogenesis and remodeling.
        is_a: organelle_biogenesis_dynamics_and_interactions
      mitochondrial_and_peroxisomal_dynamics:
        description: Disorders of mitochondrial and peroxisomal dynamics.
        is_a: organelle_biogenesis_dynamics_and_interactions
      peroxisomal_biogenesis:
        description: Peroxisomal biogenesis disorders (peroxin-related).
        is_a: organelle_biogenesis_dynamics_and_interactions
      lysosome_related_organelle_biogenesis:
        description: Disorders of lysosome-related organelle biogenesis.
        is_a: organelle_biogenesis_dynamics_and_interactions
      organelle_interplay:
        description: Disorders of organelle interplay.
        is_a: organelle_biogenesis_dynamics_and_interactions
      vesicular_trafficking:
        description: Disorders of vesicular trafficking.
        is_a: organelle_biogenesis_dynamics_and_interactions

      # --- Category 20 --------------------------------------------------
      complex_molecule_degradation:
        description: >-
          ICIMD category 20: Disorders of complex molecule degradation
          (super-domain: complex molecule and organelle metabolism); the
          classical lysosomal disorders.
      sphingolipid_degradation:
        description: Disorders of sphingolipid degradation (sphingolipidoses).
        is_a: complex_molecule_degradation
      glycosaminoglycan_degradation:
        description: Disorders of glycosaminoglycan degradation (mucopolysaccharidoses).
        is_a: complex_molecule_degradation
      glycoprotein_degradation:
        description: Disorders of glycoprotein degradation.
        is_a: complex_molecule_degradation
      neuronal_ceroid_lipofuscinosis:
        description: Neuronal ceroid lipofuscinoses.
        is_a: complex_molecule_degradation
      autophagy:
        description: Disorders of autophagy.
        is_a: complex_molecule_degradation
      complex_molecule_degradation_other:
        description: Other disorders of complex molecule degradation.
        is_a: complex_molecule_degradation

      # =====================================================================
      # Super-domain: Cofactor and mineral metabolism
      # =====================================================================

      # --- Category 21 --------------------------------------------------
      vitamin_and_cofactor_metabolism:
        description: >-
          ICIMD category 21: Disorders of vitamin and cofactor metabolism
          (super-domain: cofactor and mineral metabolism).
      tetrahydrobiopterin_metabolism:
        description: Disorders of tetrahydrobiopterin metabolism.
        is_a: vitamin_and_cofactor_metabolism
      thiamine_metabolism:
        description: Disorders of thiamine (vitamin B1) metabolism.
        is_a: vitamin_and_cofactor_metabolism
      riboflavin_metabolism:
        description: Disorders of riboflavin (vitamin B2) metabolism.
        is_a: vitamin_and_cofactor_metabolism
      niacin_and_nad_metabolism:
        description: Disorders of niacin/nicotinamide (vitamin B3) and NAD metabolism.
        is_a: vitamin_and_cofactor_metabolism
      pantothenate_and_coa_metabolism:
        description: Disorders of pantothenate (vitamin B5) and coenzyme A metabolism.
        is_a: vitamin_and_cofactor_metabolism
      pyridoxine_metabolism:
        description: Disorders of pyridoxine (vitamin B6) metabolism.
        is_a: vitamin_and_cofactor_metabolism
      biotin_metabolism:
        description: Disorders of biotin (vitamin B7) metabolism.
        is_a: vitamin_and_cofactor_metabolism
      folate_metabolism:
        description: Disorders of folate (vitamin B9) metabolism.
        is_a: vitamin_and_cofactor_metabolism
      cobalamin_metabolism:
        description: Disorders of cobalamin (vitamin B12) metabolism.
        is_a: vitamin_and_cofactor_metabolism
      molybdenum_cofactor_metabolism:
        description: Disorders of molybdenum cofactor metabolism.
        is_a: vitamin_and_cofactor_metabolism
      vitamins_other:
        description: Other disorders of vitamin and cofactor metabolism.
        is_a: vitamin_and_cofactor_metabolism

      # --- Category 22 --------------------------------------------------
      trace_elements_and_metals:
        description: >-
          ICIMD category 22: Disorders of trace elements and metals
          (super-domain: cofactor and mineral metabolism).
      copper_metabolism:
        description: Disorders of copper metabolism.
        is_a: trace_elements_and_metals
      iron_metabolism:
        description: Disorders of iron metabolism.
        is_a: trace_elements_and_metals
      manganese_metabolism:
        description: Disorders of manganese metabolism.
        is_a: trace_elements_and_metals
      zinc_metabolism:
        description: Disorders of zinc metabolism.
        is_a: trace_elements_and_metals
      trace_element_other:
        description: Other disorders of trace element and metal metabolism.
        is_a: trace_elements_and_metals

      # =====================================================================
      # Super-domain: Metabolic cell signaling
      # =====================================================================

      # --- Category 23 --------------------------------------------------
      neurotransmitter_disorders:
        description: >-
          ICIMD category 23: Neurotransmitter disorders (super-domain: metabolic
          cell signaling).
      monoamine_metabolism:
        description: Disorders of monoamine neurotransmitter metabolism.
        is_a: neurotransmitter_disorders
      gaba_metabolism:
        description: Disorders of GABA metabolism.
        is_a: neurotransmitter_disorders
      glutamate_neurotransmission:
        description: Disorders of glutamate neurotransmitter function.
        is_a: neurotransmitter_disorders
      glycine_neurotransmission:
        description: Disorders of glycine neurotransmitter function.
        is_a: neurotransmitter_disorders
      choline_metabolism:
        description: Disorders of choline metabolism.
        is_a: neurotransmitter_disorders
      synaptic_vesicle_cycle:
        description: Disorders of the synaptic vesicle cycle.
        is_a: neurotransmitter_disorders

      # --- Category 24 --------------------------------------------------
      endocrine_metabolic_disorders:
        description: >-
          ICIMD category 24: Endocrine metabolic disorders (super-domain:
          metabolic cell signaling).
      insulin_metabolism:
        description: Disorders affecting insulin metabolism.
        is_a: endocrine_metabolic_disorders
      steroid_hormone_metabolism:
        description: Disorders of steroid hormone metabolism.
        is_a: endocrine_metabolic_disorders

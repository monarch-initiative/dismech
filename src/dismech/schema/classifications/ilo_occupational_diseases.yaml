id: https://w3id.org/monarch-initiative/dismech/classifications/ilo_occupational_diseases
name: dismech-ilo-occupational-diseases
title: ILO List of Occupational Diseases
description: >-
  The international standard nosology of occupational disease: the **List of
  occupational diseases (revised 2010)**, annexed to the List of Occupational
  Diseases Recommendation, 2002 (No. 194) of the International Labour
  Organization. The 2010 revision was approved by the ILO Governing Body on
  25 March 2010 at its 307th Session, on the basis of two tripartite Meetings
  of Experts (2005 and 2009), and replaced the list adopted in 2002.

  This is the closest thing that exists to a globally sanctioned nosology of
  work-related disease. Recommendation No. 194 asks member States to establish a
  national list of occupational diseases for prevention, recording, notification
  and compensation, comprising "to the extent possible" the diseases in this
  annex; national schedules are therefore derived from it, and it is the common
  denominator across them. It is a *recognition* instrument rather than a
  mechanistic one — an item asserts that a causal link between a work exposure
  and a disease is established well enough to be recognised, which is exactly
  the claim dismech wants to record when it classifies an entry as occupational.

  **The list is biaxial, and dismech models that as two enums.** The instrument
  has four sections built on two different organising principles:

  - Section 1 ("caused by exposure to agents arising from work activities") and
    section 3.1 ("Cancer caused by the following agents") index by **causative
    agent** — the item names the agent, e.g. "Diseases caused by benzene or its
    homologues".
  - Section 2 ("by target organ systems") and section 4 ("Other diseases") index
    by **the disease itself** — the item names a clinical entity, e.g. "Asthma
    caused by recognized sensitizing agents", "Miners' nystagmus".

  Because the axes are orthogonal, one disease legitimately takes an item from
  each: occupational asthma from isocyanates is both 1.1.35 (agent) and 2.1.7
  (disease). Collapsing both axes into one enum would make it impossible for the
  schema to say which axis a value belongs to, so the values are split into
  ``ILOCausativeAgentEnum`` (sections 1 and 3) and ``ILODiseaseCategoryEnum``
  (sections 2 and 4), reached by two distinct slots that share a presentational
  ``slot_group``. This is the opposite of the ISDS nosology's rule, where a
  disorder is listed once by construction; do not carry the ISDS "assign exactly
  one" habit over to this instrument.

  Two consequences of the split a curator should know:

  - **The ILO's contiguous item numbering is spread across two enums.** Items
    1.x and 3.x live in ``ILOCausativeAgentEnum``; items 2.x and 4.x live in
    ``ILODiseaseCategoryEnum``. Each value records its item number verbatim at
    the head of its ``description``, so a number lookup still works, but you
    cannot assume one enum holds the whole list.
  - **Placing sections 3 and 4 is dismech's reading, not the ILO's.** The
    instrument presents four sections, not two axes. Section 3.1 is put on the
    agent axis because its own title indexes by agent; section 4 is put on the
    disease axis because its one named item is a clinical entity. If that
    reading is ever revised, the affected values move between enums.

  Two wrinkles in the instrument itself, reproduced rather than tidied:

  - **Section 1.3 names diseases, not agents.** Its title, "Biological agents
    and infectious or parasitic diseases", acknowledges the hybrid, and its
    items are Brucellosis, Tetanus, Tuberculosis and so on. It stays on the
    agent axis because the ILO places it under section 1.
  - **Both slots stay multivalued**, because more than one item from a single
    axis is normal: silicosis takes both 2.1.1 (pneumoconiosis) and 2.1.2
    (silicotuberculosis).

  Open items. Every subsection ends with an "open item" (1.1.41, 1.2.7, 1.3.9,
  2.1.12, 2.2.4, 2.3.8, 2.4.2, 3.1.21, 4.2) permitting recognition of a disease
  the list does not name, where a direct link to work exposure is established
  scientifically. These are transcribed as real permissible values because the
  instrument uses them substantively, but they are a weak assignment: prefer a
  specific item, and when using an open item say in ``notes`` what the agent or
  disease actually was.

  Mental and behavioural disorders (2.4) and the musculoskeletal section were
  new in the 2010 revision — the first time the ILO list named a mental disorder
  (post-traumatic stress disorder) explicitly.

  Curation guidance for dismech:

  - Assign only when the disease is genuinely recognised as occupational in
    origin, not merely because an exposure exists. Lead poisoning from a
    contaminated water supply is not ILO 1.1.8; lead poisoning in a smelter
    worker is.
  - A disease that occurs both occupationally and non-occupationally (asthma,
    COPD, mesothelioma, hearing loss) still takes the item — the assignment
    records that an occupational form is recognised, not that every case is
    occupational. Say which in ``notes``.
  - Record provenance in ``notes``: the revision (2010), the item number, and
    the item text where it differs from the dismech entry name. As with ICIMD
    and ISDS, this is a definitional taxonomy mapping, not an empirical disease
    claim, so ``notes`` is preferred over a manufactured evidence ``snippet``.
  - Pair with ``harrisons_chapter`` — usually ``ENVIRONMENTAL_EXPOSURES``,
    ``POISONING_ENVENOMATION``, or the relevant organ-system Part.

  Item numbers here ARE stable within the 2010 revision and are what national
  law and statistical reporting cite. They are NOT stable across revisions (the
  2002 list numbered differently), which is why, following the repo convention
  established by ``ISDSNosologyGroupEnum``, numbers are not part of any
  permissible-value key.

source: https://www.ilo.org/publications/ilo-list-occupational-diseases-revised-2010
see_also:
  - https://normlex.ilo.org/dyn/nrmlx_en/f?p=NORMLEXPUB:12100:0::NO::P12100_INSTRUMENT_ID:312532

imports:
  - linkml:types

prefixes:
  linkml: https://w3id.org/linkml/
  dismech: https://w3id.org/monarch-initiative/dismech/

default_prefix: dismech

subsets:
  ilo_causative_agent_axis:
    description: >-
      ILO items that index by the causative agent arising from work activities
      (sections 1 and 3). The item names the agent, not the resulting disease.
  ilo_disease_category_axis:
    description: >-
      ILO items that index by the disease itself — target organ system
      (section 2) or the residual "other diseases" section (section 4). The item
      names a clinical entity, not the agent.

enums:
  ILOCausativeAgentEnum:
    description: >-
      The **causative-agent axis** of the ILO List of Occupational Diseases
      (revised 2010): section 1 (diseases caused by chemical, physical and
      biological agents arising from work activities) and section 3
      (occupational cancer, itself titled "Cancer caused by the following
      agents"). Items point to their subsection, and subsections to their
      section, via ``is_a``; assign the most specific applicable item.

      Orthogonal to ``ILODiseaseCategoryEnum`` — a disease commonly takes an
      item from both, and this slot is multivalued because more than one agent
      item can apply.
    source: https://www.ilo.org/publications/ilo-list-occupational-diseases-revised-2010
    in_subset:
      - ilo_causative_agent_axis
    permissible_values:

      # ===================================================================
      # 1. Occupational diseases caused by exposure to agents arising from
      #    work activities
      # ===================================================================

      caused_by_agents_arising_from_work:
        description: >-
          ILO section 1: Occupational diseases caused by exposure to agents
          arising from work activities. Classifies by causative agent rather
          than by the resulting disease. Orthogonal to section 2.

      # --- 1.1 Chemical agents -------------------------------------------
      chemical_agents:
        description: >-
          ILO section 1.1: Diseases caused by chemical agents. The largest
          subsection (41 items); each item names an agent or agent family, and
          covers whatever disease that agent causes at work.
        is_a: caused_by_agents_arising_from_work

      beryllium:
        description: "ILO item 1.1.1: Diseases caused by beryllium or its compounds."
        is_a: chemical_agents
      cadmium:
        description: "ILO item 1.1.2: Diseases caused by cadmium or its compounds."
        is_a: chemical_agents
      phosphorus:
        description: "ILO item 1.1.3: Diseases caused by phosphorus or its compounds."
        is_a: chemical_agents
      chromium:
        description: "ILO item 1.1.4: Diseases caused by chromium or its compounds."
        is_a: chemical_agents
      manganese:
        description: "ILO item 1.1.5: Diseases caused by manganese or its compounds."
        is_a: chemical_agents
      arsenic:
        description: "ILO item 1.1.6: Diseases caused by arsenic or its compounds."
        is_a: chemical_agents
      mercury:
        description: "ILO item 1.1.7: Diseases caused by mercury or its compounds."
        is_a: chemical_agents
      lead:
        description: "ILO item 1.1.8: Diseases caused by lead or its compounds."
        is_a: chemical_agents
      fluorine:
        description: "ILO item 1.1.9: Diseases caused by fluorine or its compounds."
        is_a: chemical_agents
      carbon_disulfide:
        description: "ILO item 1.1.10: Diseases caused by carbon disulfide."
        is_a: chemical_agents
      halogen_derivatives_of_hydrocarbons:
        description: >-
          ILO item 1.1.11: Diseases caused by halogen derivatives of aliphatic
          or aromatic hydrocarbons.
        is_a: chemical_agents
      benzene_and_homologues:
        description: "ILO item 1.1.12: Diseases caused by benzene or its homologues."
        is_a: chemical_agents
      nitro_and_amino_derivatives_of_benzene:
        description: >-
          ILO item 1.1.13: Diseases caused by nitro- and amino-derivatives of
          benzene or its homologues.
        is_a: chemical_agents
      nitric_acid_esters:
        description: >-
          ILO item 1.1.14: Diseases caused by nitroglycerine or other nitric
          acid esters.
        is_a: chemical_agents
      alcohols_glycols_or_ketones:
        description: "ILO item 1.1.15: Diseases caused by alcohols, glycols or ketones."
        is_a: chemical_agents
      asphyxiants:
        description: >-
          ILO item 1.1.16: Diseases caused by asphyxiants like carbon monoxide,
          hydrogen sulfide, hydrogen cyanide or its derivatives.
        is_a: chemical_agents
      acrylonitrile:
        description: "ILO item 1.1.17: Diseases caused by acrylonitrile."
        is_a: chemical_agents
      oxides_of_nitrogen:
        description: "ILO item 1.1.18: Diseases caused by oxides of nitrogen."
        is_a: chemical_agents
      vanadium:
        description: "ILO item 1.1.19: Diseases caused by vanadium or its compounds."
        is_a: chemical_agents
      antimony:
        description: "ILO item 1.1.20: Diseases caused by antimony or its compounds."
        is_a: chemical_agents
      hexane:
        description: "ILO item 1.1.21: Diseases caused by hexane."
        is_a: chemical_agents
      mineral_acids:
        description: "ILO item 1.1.22: Diseases caused by mineral acids."
        is_a: chemical_agents
      pharmaceutical_agents:
        description: "ILO item 1.1.23: Diseases caused by pharmaceutical agents."
        is_a: chemical_agents
      nickel:
        description: "ILO item 1.1.24: Diseases caused by nickel or its compounds."
        is_a: chemical_agents
      thallium:
        description: "ILO item 1.1.25: Diseases caused by thallium or its compounds."
        is_a: chemical_agents
      osmium:
        description: "ILO item 1.1.26: Diseases caused by osmium or its compounds."
        is_a: chemical_agents
      selenium:
        description: "ILO item 1.1.27: Diseases caused by selenium or its compounds."
        is_a: chemical_agents
      copper:
        description: "ILO item 1.1.28: Diseases caused by copper or its compounds."
        is_a: chemical_agents
      platinum:
        description: "ILO item 1.1.29: Diseases caused by platinum or its compounds."
        is_a: chemical_agents
      tin:
        description: "ILO item 1.1.30: Diseases caused by tin or its compounds."
        is_a: chemical_agents
      zinc:
        description: "ILO item 1.1.31: Diseases caused by zinc or its compounds."
        is_a: chemical_agents
      phosgene:
        description: "ILO item 1.1.32: Diseases caused by phosgene."
        is_a: chemical_agents
      corneal_irritants:
        description: >-
          ILO item 1.1.33: Diseases caused by corneal irritants like
          benzoquinone.
        is_a: chemical_agents
      ammonia:
        description: "ILO item 1.1.34: Diseases caused by ammonia."
        is_a: chemical_agents
      isocyanates:
        description: "ILO item 1.1.35: Diseases caused by isocyanates."
        is_a: chemical_agents
      pesticides:
        description: "ILO item 1.1.36: Diseases caused by pesticides."
        is_a: chemical_agents
      sulphur_oxides:
        description: "ILO item 1.1.37: Diseases caused by sulphur oxides."
        is_a: chemical_agents
      organic_solvents:
        description: "ILO item 1.1.38: Diseases caused by organic solvents."
        is_a: chemical_agents
      latex:
        description: >-
          ILO item 1.1.39: Diseases caused by latex or latex-containing
          products.
        is_a: chemical_agents
      chlorine:
        description: "ILO item 1.1.40: Diseases caused by chlorine."
        is_a: chemical_agents
      other_chemical_agents:
        description: >-
          ILO item 1.1.41 (open item): Diseases caused by other chemical agents
          at work not mentioned in the preceding items where a direct link is
          established scientifically, or determined by methods appropriate to
          national conditions and practice, between the exposure to these
          chemical agents arising from work activities and the disease(s)
          contracted by the worker. Name the actual agent in ``notes``.
        is_a: chemical_agents

      # --- 1.2 Physical agents -------------------------------------------
      physical_agents:
        description: "ILO section 1.2: Diseases caused by physical agents."
        is_a: caused_by_agents_arising_from_work

      hearing_impairment_caused_by_noise:
        description: "ILO item 1.2.1: Hearing impairment caused by noise."
        is_a: physical_agents
      vibration:
        description: >-
          ILO item 1.2.2: Diseases caused by vibration (disorders of muscles,
          tendons, bones, joints, peripheral blood vessels or peripheral
          nerves).
        is_a: physical_agents
      compressed_or_decompressed_air:
        description: "ILO item 1.2.3: Diseases caused by compressed or decompressed air."
        is_a: physical_agents
      ionizing_radiation:
        description: "ILO item 1.2.4: Diseases caused by ionizing radiations."
        is_a: physical_agents
      optical_radiation:
        description: >-
          ILO item 1.2.5: Diseases caused by optical (ultraviolet, visible
          light, infrared) radiations including laser.
        is_a: physical_agents
      extreme_temperatures:
        description: "ILO item 1.2.6: Diseases caused by exposure to extreme temperatures."
        is_a: physical_agents
      other_physical_agents:
        description: >-
          ILO item 1.2.7 (open item): Diseases caused by other physical agents
          at work not mentioned in the preceding items where a direct link is
          established scientifically, or determined by methods appropriate to
          national conditions and practice, between the exposure to these
          physical agents arising from work activities and the disease(s)
          contracted by the worker. Name the actual agent in ``notes``.
        is_a: physical_agents

      # --- 1.3 Biological agents -----------------------------------------
      biological_agents_and_infectious_or_parasitic_diseases:
        description: >-
          ILO section 1.3: Biological agents and infectious or parasitic
          diseases. Unlike the rest of section 1, most items name the disease
          directly rather than the agent.
        is_a: caused_by_agents_arising_from_work

      brucellosis:
        description: "ILO item 1.3.1: Brucellosis."
        is_a: biological_agents_and_infectious_or_parasitic_diseases
      hepatitis_viruses:
        description: "ILO item 1.3.2: Hepatitis viruses."
        is_a: biological_agents_and_infectious_or_parasitic_diseases
      human_immunodeficiency_virus:
        description: "ILO item 1.3.3: Human immunodeficiency virus (HIV)."
        is_a: biological_agents_and_infectious_or_parasitic_diseases
      tetanus:
        description: "ILO item 1.3.4: Tetanus."
        is_a: biological_agents_and_infectious_or_parasitic_diseases
      tuberculosis:
        description: "ILO item 1.3.5: Tuberculosis."
        is_a: biological_agents_and_infectious_or_parasitic_diseases
      toxic_or_inflammatory_syndromes_from_bacterial_or_fungal_contaminants:
        description: >-
          ILO item 1.3.6: Toxic or inflammatory syndromes associated with
          bacterial or fungal contaminants.
        is_a: biological_agents_and_infectious_or_parasitic_diseases
      anthrax:
        description: "ILO item 1.3.7: Anthrax."
        is_a: biological_agents_and_infectious_or_parasitic_diseases
      leptospirosis:
        description: "ILO item 1.3.8: Leptospirosis."
        is_a: biological_agents_and_infectious_or_parasitic_diseases
      other_biological_agents:
        description: >-
          ILO item 1.3.9 (open item): Diseases caused by other biological
          agents at work not mentioned in the preceding items where a direct
          link is established scientifically, or determined by methods
          appropriate to national conditions and practice, between the exposure
          to these biological agents arising from work activities and the
          disease(s) contracted by the worker. Name the actual agent in
          ``notes``. This is the item under which COVID-19 in health and care
          workers is recognised, the ILO list predating the pandemic.
        is_a: biological_agents_and_infectious_or_parasitic_diseases

      # ===================================================================
      # 3. Occupational cancer
      # ===================================================================

      occupational_cancer:
        description: >-
          ILO section 3: Occupational cancer. Its single subsection lists the
          agents whose causal link to cancer is recognised; the item names the
          agent, not the tumour type.

      cancer_caused_by_agents:
        description: "ILO section 3.1: Cancer caused by the following agents."
        is_a: occupational_cancer

      cancer_asbestos:
        description: "ILO item 3.1.1: Cancer caused by asbestos."
        is_a: cancer_caused_by_agents
      cancer_benzidine_and_salts:
        description: "ILO item 3.1.2: Cancer caused by benzidine and its salts."
        is_a: cancer_caused_by_agents
      cancer_bis_chloromethyl_ether:
        description: >-
          ILO item 3.1.3: Cancer caused by bis-chloromethyl ether (BCME).
        is_a: cancer_caused_by_agents
      cancer_chromium_vi_compounds:
        description: "ILO item 3.1.4: Cancer caused by chromium VI compounds."
        is_a: cancer_caused_by_agents
      cancer_coal_tars_pitches_or_soots:
        description: >-
          ILO item 3.1.5: Cancer caused by coal tars, coal tar pitches or
          soots.
        is_a: cancer_caused_by_agents
      cancer_beta_naphthylamine:
        description: "ILO item 3.1.6: Cancer caused by beta-naphthylamine."
        is_a: cancer_caused_by_agents
      cancer_vinyl_chloride:
        description: "ILO item 3.1.7: Cancer caused by vinyl chloride."
        is_a: cancer_caused_by_agents
      cancer_benzene:
        description: "ILO item 3.1.8: Cancer caused by benzene."
        is_a: cancer_caused_by_agents
      cancer_nitro_and_amino_derivatives_of_benzene:
        description: >-
          ILO item 3.1.9: Cancer caused by toxic nitro- and amino-derivatives
          of benzene or its homologues.
        is_a: cancer_caused_by_agents
      cancer_ionizing_radiation:
        description: "ILO item 3.1.10: Cancer caused by ionizing radiations."
        is_a: cancer_caused_by_agents
      cancer_tar_pitch_bitumen_mineral_oil_anthracene:
        description: >-
          ILO item 3.1.11: Cancer caused by tar, pitch, bitumen, mineral oil,
          anthracene, or the compounds, products or residues of these
          substances.
        is_a: cancer_caused_by_agents
      cancer_coke_oven_emissions:
        description: "ILO item 3.1.12: Cancer caused by coke oven emissions."
        is_a: cancer_caused_by_agents
      cancer_nickel_compounds:
        description: "ILO item 3.1.13: Cancer caused by nickel compounds."
        is_a: cancer_caused_by_agents
      cancer_wood_dust:
        description: "ILO item 3.1.14: Cancer caused by wood dust."
        is_a: cancer_caused_by_agents
      cancer_arsenic:
        description: "ILO item 3.1.15: Cancer caused by arsenic and its compounds."
        is_a: cancer_caused_by_agents
      cancer_beryllium:
        description: "ILO item 3.1.16: Cancer caused by beryllium and its compounds."
        is_a: cancer_caused_by_agents
      cancer_cadmium:
        description: "ILO item 3.1.17: Cancer caused by cadmium and its compounds."
        is_a: cancer_caused_by_agents
      cancer_erionite:
        description: "ILO item 3.1.18: Cancer caused by erionite."
        is_a: cancer_caused_by_agents
      cancer_ethylene_oxide:
        description: "ILO item 3.1.19: Cancer caused by ethylene oxide."
        is_a: cancer_caused_by_agents
      cancer_hepatitis_b_and_c_viruses:
        description: >-
          ILO item 3.1.20: Cancer caused by hepatitis B virus (HBV) and
          hepatitis C virus (HCV).
        is_a: cancer_caused_by_agents
      cancer_other_agents:
        description: >-
          ILO item 3.1.21 (open item): Cancers caused by other agents at work
          not mentioned in the preceding items where a direct link is
          established scientifically, or determined by methods appropriate to
          national conditions and practice, between the exposure to these
          agents arising from work activities and the cancer(s) contracted by
          the worker. Name the actual agent in ``notes``.
        is_a: cancer_caused_by_agents


  ILODiseaseCategoryEnum:
    description: >-
      The **disease-category axis** of the ILO List of Occupational Diseases
      (revised 2010): section 2 (occupational diseases by target organ systems —
      respiratory, skin, musculoskeletal, mental and behavioural) and section 4
      ("Other diseases", the residual section). Items here name a clinical
      entity rather than an agent.

      Orthogonal to ``ILOCausativeAgentEnum``. Multivalued, because more than
      one disease item from this axis can apply to one entry — silicosis takes
      both 2.1.1 and 2.1.2.

      Note that section 4 is placed on this axis by dismech's reading of the
      instrument (its named item, miners' nystagmus, is a clinical entity), not
      by an explicit ILO statement; see the schema-level description.
    source: https://www.ilo.org/publications/ilo-list-occupational-diseases-revised-2010
    in_subset:
      - ilo_disease_category_axis
    permissible_values:

      # ===================================================================
      # 2. Occupational diseases by target organ systems
      # ===================================================================

      by_target_organ_system:
        description: >-
          ILO section 2: Occupational diseases by target organ systems.
          Classifies by the affected organ system rather than by causative
          agent. Orthogonal to section 1 — a disease commonly takes an item
          from both.

      # --- 2.1 Respiratory ------------------------------------------------
      respiratory_diseases:
        description: "ILO section 2.1: Respiratory diseases."
        is_a: by_target_organ_system

      pneumoconiosis_from_fibrogenic_mineral_dust:
        description: >-
          ILO item 2.1.1: Pneumoconioses caused by fibrogenic mineral dust
          (silicosis, anthraco-silicosis, asbestosis).
        is_a: respiratory_diseases
      silicotuberculosis:
        description: "ILO item 2.1.2: Silicotuberculosis."
        is_a: respiratory_diseases
      pneumoconiosis_from_non_fibrogenic_mineral_dust:
        description: >-
          ILO item 2.1.3: Pneumoconioses caused by non-fibrogenic mineral dust.
        is_a: respiratory_diseases
      siderosis:
        description: "ILO item 2.1.4: Siderosis."
        is_a: respiratory_diseases
      bronchopulmonary_disease_from_hard_metal_dust:
        description: >-
          ILO item 2.1.5: Bronchopulmonary diseases caused by hard-metal dust.
        is_a: respiratory_diseases
      bronchopulmonary_disease_from_organic_dust:
        description: >-
          ILO item 2.1.6: Bronchopulmonary diseases caused by dust of cotton
          (byssinosis), flax, hemp, sisal or sugar cane (bagassosis).
        is_a: respiratory_diseases
      occupational_asthma:
        description: >-
          ILO item 2.1.7: Asthma caused by recognized sensitizing agents or
          irritants inherent to the work process.
        is_a: respiratory_diseases
      extrinsic_allergic_alveolitis:
        description: >-
          ILO item 2.1.8: Extrinsic allergic alveolitis caused by the
          inhalation of organic dusts or microbially contaminated aerosols,
          arising from work activities.
        is_a: respiratory_diseases
      chronic_obstructive_pulmonary_disease:
        description: >-
          ILO item 2.1.9: Chronic obstructive pulmonary diseases caused by
          inhalation of coal dust, dust from stone quarries, wood dust, dust
          from cereals and agricultural work, dust in animal stables, dust from
          textiles, and paper dust, arising from work activities.
        is_a: respiratory_diseases
      lung_disease_caused_by_aluminium:
        description: "ILO item 2.1.10: Diseases of the lung caused by aluminium."
        is_a: respiratory_diseases
      upper_airways_disorders:
        description: >-
          ILO item 2.1.11: Upper airways disorders caused by recognized
          sensitizing agents or irritants inherent to the work process.
        is_a: respiratory_diseases
      other_respiratory_diseases:
        description: >-
          ILO item 2.1.12 (open item): Other respiratory diseases not mentioned
          in the preceding items where a direct link is established
          scientifically, or determined by methods appropriate to national
          conditions and practice, between the exposure to risk factors arising
          from work activities and the disease(s) contracted by the worker.
        is_a: respiratory_diseases

      # --- 2.2 Skin --------------------------------------------------------
      skin_diseases:
        description: "ILO section 2.2: Skin diseases."
        is_a: by_target_organ_system

      allergic_contact_dermatosis_and_contact_urticaria:
        description: >-
          ILO item 2.2.1: Allergic contact dermatoses and contact urticaria
          caused by other recognized allergy-provoking agents arising from work
          activities not included in other items.
        is_a: skin_diseases
      irritant_contact_dermatosis:
        description: >-
          ILO item 2.2.2: Irritant contact dermatoses caused by other
          recognized irritant agents arising from work activities not included
          in other items.
        is_a: skin_diseases
      occupational_vitiligo:
        description: >-
          ILO item 2.2.3: Vitiligo caused by other recognized agents arising
          from work activities not included in other items.
        is_a: skin_diseases
      other_skin_diseases:
        description: >-
          ILO item 2.2.4 (open item): Other skin diseases caused by physical,
          chemical or biological agents at work not included under other items
          where a direct link is established scientifically, or determined by
          methods appropriate to national conditions and practice, between the
          exposure to risk factors arising from work activities and the skin
          disease(s) contracted by the worker.
        is_a: skin_diseases

      # --- 2.3 Musculoskeletal ---------------------------------------------
      musculoskeletal_disorders:
        description: >-
          ILO section 2.3: Musculoskeletal disorders. Each item names both the
          lesion and the biomechanical exposure (repetitive movement, forceful
          exertion, extreme posture, prolonged pressure) that recognises it as
          occupational.
        is_a: by_target_organ_system

      radial_styloid_tenosynovitis:
        description: >-
          ILO item 2.3.1: Radial styloid tenosynovitis due to repetitive
          movements, forceful exertions and extreme postures of the wrist.
        is_a: musculoskeletal_disorders
      chronic_tenosynovitis_of_hand_and_wrist:
        description: >-
          ILO item 2.3.2: Chronic tenosynovitis of hand and wrist due to
          repetitive movements, forceful exertions and extreme postures of the
          wrist.
        is_a: musculoskeletal_disorders
      olecranon_bursitis:
        description: >-
          ILO item 2.3.3: Olecranon bursitis due to prolonged pressure of the
          elbow region.
        is_a: musculoskeletal_disorders
      prepatellar_bursitis:
        description: >-
          ILO item 2.3.4: Prepatellar bursitis due to prolonged stay in
          kneeling position.
        is_a: musculoskeletal_disorders
      epicondylitis:
        description: "ILO item 2.3.5: Epicondylitis due to repetitive forceful work."
        is_a: musculoskeletal_disorders
      meniscus_lesions:
        description: >-
          ILO item 2.3.6: Meniscus lesions following extended periods of work
          in a kneeling or squatting position.
        is_a: musculoskeletal_disorders
      carpal_tunnel_syndrome:
        description: >-
          ILO item 2.3.7: Carpal tunnel syndrome due to extended periods of
          repetitive forceful work, work involving vibration, extreme postures
          of the wrist, or a combination of the three.
        is_a: musculoskeletal_disorders
      other_musculoskeletal_disorders:
        description: >-
          ILO item 2.3.8 (open item): Other musculoskeletal disorders not
          mentioned in the preceding items where a direct link is established
          scientifically, or determined by methods appropriate to national
          conditions and practice, between the exposure to risk factors arising
          from work activities and the musculoskeletal disorder(s) contracted
          by the worker.
        is_a: musculoskeletal_disorders

      # --- 2.4 Mental and behavioural --------------------------------------
      mental_and_behavioural_disorders:
        description: >-
          ILO section 2.4: Mental and behavioural disorders. New in the 2010
          revision — the first time the ILO list named a mental disorder
          explicitly.
        is_a: by_target_organ_system

      post_traumatic_stress_disorder:
        description: "ILO item 2.4.1: Post-traumatic stress disorder."
        is_a: mental_and_behavioural_disorders
      other_mental_or_behavioural_disorders:
        description: >-
          ILO item 2.4.2 (open item): Other mental or behavioural disorders not
          mentioned in the preceding item where a direct link is established
          scientifically, or determined by methods appropriate to national
          conditions and practice, between the exposure to risk factors arising
          from work activities and the mental and behavioural disorder(s)
          contracted by the worker.
        is_a: mental_and_behavioural_disorders

      # ===================================================================
      # 4. Other diseases
      # ===================================================================

      other_diseases:
        description: >-
          ILO section 4: Other diseases. A residual section with a single named
          disease and one open item; its items sit directly under the section
          with no intervening subsection.

      miners_nystagmus:
        description: "ILO item 4.1: Miners' nystagmus."
        is_a: other_diseases
      other_specific_diseases:
        description: >-
          ILO item 4.2 (open item): Other specific diseases caused by
          occupations or processes not mentioned in this list where a direct
          link is established scientifically, or determined by methods
          appropriate to national conditions and practice, between the exposure
          arising from work activities and the disease(s) contracted by the
          worker. Name the occupation or process in ``notes``.
        is_a: other_diseases

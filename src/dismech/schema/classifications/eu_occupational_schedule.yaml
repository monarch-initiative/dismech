id: https://w3id.org/monarch-initiative/dismech/classifications/eu_occupational_schedule
name: dismech-eu-occupational-schedule
title: European Schedule of Occupational Diseases
description: >-
  The regional legal schedule of occupational disease for the European Union:
  Annex I and Annex II of Commission Recommendation 2003/670/EC of 19 September
  2003 concerning the European schedule of occupational diseases, **as amended**.

  This enum encodes the schedule in its **current consolidated form**, which is
  the version established by Commission Recommendation (EU) 2025/2609 of 18
  December 2025. Two amendments have changed the schedule since 2003:

  - **Recommendation (EU) 2022/2337** (28 November 2022) added item **408**,
    COVID-19 contracted through work in disease prevention, health and social
    care and domiciliary assistance, or in a pandemic context in sectors with a
    proven outbreak risk.
  - **Recommendation (EU) 2025/2609** (18 December 2025) added four
    asbestos-related diseases to Annex I — **311** cancer of the larynx, **312**
    cancer of the ovary, **313** pleural plaques with functional impairment, and
    **314** non-malignant pleural effusion — and three suspected asbestos-related
    cancers to Annex II (**2.309** colon, **2.310** rectum, **2.311** stomach).
    In the same revision Annex II item 2.308 (cancer of the larynx following the
    inhalation of asbestos dust) was **removed**, having been promoted into Annex
    I as item 311; it is therefore not a permissible value here. Member States
    were asked to report implementation by 31 December 2026.

  Relationship to the ILO list. This schedule and the ILO list
  (``ILOCausativeAgentEnum`` / ``ILODiseaseCategoryEnum``) are separate
  instruments over the same subject matter and are **not** substitutes: the ILO
  list is the global tripartite consensus and is *biaxial*, organising section 2
  by target organ system, which is why it takes two enums and two slots here.
  The European schedule is a regional instrument organised throughout by
  causative agent or route, so it is single-axis and takes one enum and one
  slot; it joins the ILO slots in the presentational
  ``occupational_classification`` slot group. The European
  schedule is also more specific in places the ILO list is generic — it names
  silicosis, asbestosis and mesothelioma as distinct items (301.11, 301.21,
  301.22) where the ILO list has one fibrogenic-mineral-dust pneumoconiosis item
  (2.1.1) — and it uniquely carries COVID-19 and the asbestos additions above.
  Assign both when both apply; neither implies the other.

  Two tiers, and they mean different things:

  - **Annex I** is the recognised schedule. Member States are asked to introduce
    these diseases into national law; a listed disease linked directly to the
    occupation is liable for compensation and subject to prevention measures.
  - **Annex II** is the *additional list of diseases suspected of being
    occupational in origin* — notifiable, and candidates for later inclusion in
    Annex I. An Annex II assignment records a suspected, not established,
    occupational aetiology. Annex II keys are prefixed ``suspected_`` so the two
    tiers can never be confused at a glance, and an Annex II assignment must say
    so in ``notes``.

  Structure. Both annexes use the same five chapters (chemical agents; skin
  diseases; diseases caused by inhalation; infectious and parasitic diseases;
  physical agents), and items are numbered — Annex I ``100``-``508``, Annex II
  ``2.101``-``2.503``. Chapters 1 and 2.1 name *agents* rather than diseases, so
  an item there covers whatever disease that agent causes at work. Items 201 and
  301 are themselves headers with numbered sub-items, and are encoded as
  intermediate nodes.

  The published numbering has genuine gaps (there is no 115.03, 134, 304.03,
  305.02, 501, 2.131-2.139, 2.302 or 2.306) and, in two places, sub-items are
  printed out of numeric order (201.01/201.03/201.02/201.04, and 304.05/305.01/
  304.06). Both are faithfully reproduced: the gaps are simply absent, and item
  order follows the published text, not numeric sort. Do not "repair" either.

  Curation guidance for dismech:

  - Assign only when the disease is recognised as occupational in origin, on the
    same reasoning as the ILO enum — the schedule requires that the disease "must
    be linked directly to the occupation".
  - Record provenance in ``notes``: the item number, the annex, and the amendment
    that introduced it where it is one of the post-2003 additions. As with ICIMD
    and ISDS this is a definitional taxonomy mapping, not an empirical disease
    claim, so prefer ``notes`` over a manufactured evidence ``snippet``.
  - Item numbers are stable within the consolidated schedule and are what
    national law cites, so each is recorded verbatim at the head of its
    ``description``. Following the repo convention set by
    ``ISDSNosologyGroupEnum``, numbers are not part of any permissible-value key,
    so a future renumbering does not invalidate stored assignments.

  Sources: Commission Recommendation 2003/670/EC (OJ L 238, 25.9.2003, p. 28);
  Commission Recommendation (EU) 2022/2337 (OJ L 309, 30.11.2022);
  Commission Recommendation (EU) 2025/2609 (OJ L, 2025/2609).
  http://data.europa.eu/eli/reco/2003/670/oj

source: http://data.europa.eu/eli/reco/2003/670/oj
see_also:
  - http://data.europa.eu/eli/reco/2022/2337/oj
  - http://data.europa.eu/eli/reco/2025/2609/oj

imports:
  - linkml:types

prefixes:
  linkml: https://w3id.org/linkml/
  dismech: https://w3id.org/monarch-initiative/dismech/


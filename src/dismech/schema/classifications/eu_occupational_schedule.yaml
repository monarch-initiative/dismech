enums:
  EUOccupationalScheduleEnum:
    description: >-
      Annexes, chapters and items of the European schedule of occupational
      diseases (Commission Recommendation 2003/670/EC as amended by 2022/2337
      and 2025/2609). Items point to their chapter, and chapters to their annex,
      via ``is_a``. Assign the most specific applicable item. Annex II values
      (``suspected_*``) record a SUSPECTED occupational aetiology, not an
      established one.

      ``source`` on this enum is the consolidated instrument. Individual values
      carry their own ``source`` ONLY where the item was introduced by an
      amendment rather than by the 2003 base schedule, so a per-value ``source``
      is a positive signal that the item is a recent addition.
    source: http://data.europa.eu/eli/reco/2025/2609/oj
    permissible_values:

      annex_i:
        description: >-
          Annex I: the European schedule of occupational diseases proper - the
          recognised list Member States are asked to introduce into national law,
          liable for compensation and subject to prevention measures. The
          diseases mentioned must be linked directly to the occupation.

      annex_ii:
        description: >-
          Annex II: the additional list of diseases suspected of being
          occupational in origin, which should be subject to notification and
          which may be considered at a later stage for inclusion in Annex I. A
          value under this node records a SUSPECTED, not established,
          occupational aetiology.

      annex_i_chemical_agents:
        description: >-
          Annex I chapter 1: Diseases caused by the following chemical agents.
        is_a: annex_i

      acrylonitrile:
        description: >-
          EU schedule item 100: Acrylonitrile.
        is_a: annex_i_chemical_agents


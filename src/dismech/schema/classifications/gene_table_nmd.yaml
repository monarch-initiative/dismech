prefixes:
  linkml: https://w3id.org/linkml/
  dismech: https://w3id.org/monarch-initiative/dismech/
default_prefix: dismech
default_range: string

imports:
  - linkml:types

enums:
  GeneTableNMDGroupEnum:
    description: >-
      The 17 disease groups of the Gene Table of Neuromuscular Disorders,
      ordered by the table's own group number. Names are transcribed verbatim
      from the group navigation of the online table. These groups are not
      mutually exclusive.
    permissible_values:
      muscular_dystrophies:
        title: Muscular dystrophies
        description: >-
          Group 1. Dystrophinopathies, the limb-girdle muscular dystrophies
          under the reformed 229th ENMC nomenclature (LGMD-D dominant, LGMD-R
          recessive), Emery-Dreifuss, facioscapulohumeral and oculopharyngeal
          muscular dystrophy.
      congenital_muscular_dystrophies:
        title: Congenital muscular dystrophies
        description: >-
          Group 2. Dystrophic muscle disease presenting at or near birth —
          dystroglycanopathies, collagen VI-related, LAMA2/merosin-deficient
          and SELENON-related congenital muscular dystrophy.
      congenital_myopathies:
        title: Congenital myopathies
        description: >-
          Group 3. Non-dystrophic congenital muscle disease, conventionally
          grouped by predominant histopathology — nemaline/rod, core (central
          core and multiminicore), centronuclear/myotubular, and congenital
          fibre-type disproportion.
      distal_myopathies:
        title: Distal myopathies
        description: >-
          Group 4. Myopathies with predominantly distal weakness at onset,
          organised by inheritance, age at onset and whether the anterior or
          posterior compartment is affected first.
      other_myopathies:
        title: Other myopathies
        description: >-
          Group 5. Residual myopathy group for entities fitting none of groups
          1-4, including the myofibrillar myopathies and hereditary myopathy
          with early respiratory failure.
      myotonic_syndromes:
        title: Myotonic syndromes
        description: >-
          Group 6. Myotonic dystrophy type 1 (DMPK) and type 2 (CNBP). The
          non-dystrophic myotonias arising from CLCN1 and SCN4A are ion channel
          diseases and are listed in group 7 instead.
      ion_channel_muscle_diseases:
        title: Ion channel muscle diseases
        description: >-
          Group 7. Skeletal muscle channelopathies — myotonia congenita
          (CLCN1), sodium-channel myotonia and paramyotonia congenita (SCN4A),
          hyperkalaemic and hypokalaemic periodic paralysis, Andersen-Tawil
          syndrome.
      malignant_hyperthermia:
        title: Malignant hyperthermia
        description: >-
          Group 8. Pharmacogenetic susceptibility to volatile anaesthetics and
          succinylcholine, chiefly RYR1 and CACNA1S. A susceptibility trait
          rather than a myopathy, which is why it is separated from group 3
          despite sharing genes with it.
      metabolic_myopathies:
        title: Metabolic myopathies
        description: >-
          Group 9. Muscle disease from a block in energy metabolism — the
          muscle glycogenoses, fatty-acid oxidation defects, and related
          disorders of substrate handling.
      hereditary_cardiomyopathies:
        title: Hereditary cardiomyopathies
        description: >-
          Group 10. Included because many genes are shared with skeletal muscle
          disease (LMNA, DES, FLNC, TTN, CRYAB, BAG3 each cause both).
      congenital_myasthenic_syndromes:
        title: Congenital myasthenic syndromes
        description: >-
          Group 11. Genetic defects of neuromuscular transmission,
          sub-classified by site of the lesion — presynaptic, synaptic basal
          lamina, postsynaptic, endplate development and maintenance, and
          glycosylation defects.
      spinal_muscular_atrophies_motoneuron_diseases:
        title: Spinal muscular atrophies and motoneuron diseases
        description: >-
          Group 12. SMN1-related spinal muscular atrophy and its non-5q forms,
          familial amyotrophic lateral sclerosis genes, distal hereditary motor
          neuronopathies, and spinal and bulbar muscular atrophy.
      hereditary_ataxias:
        title: Hereditary ataxias
        description: >-
          Group 13. Friedreich ataxia, the spinocerebellar ataxias, and ataxia
          with oculomotor apraxia. Present in a neuromuscular catalogue because
          of peripheral nerve involvement and shared genes.
      hereditary_motor_and_sensory_neuropathies:
        title: Hereditary motor and sensory neuropathies
        description: >-
          Group 14. The Charcot-Marie-Tooth spectrum, conventionally cut on
          median motor nerve conduction velocity into demyelinating, axonal and
          intermediate forms, plus the hereditary sensory and autonomic
          neuropathies.
      hereditary_paraplegias:
        title: Hereditary paraplegias
        description: >-
          Group 15. The hereditary spastic paraplegias, pure and complicated
          forms. An upper-motor-neuron group, shares genes with group 12.
      mitochondrial_myopathies:
        title: Mitochondrial myopathies
        description: >-
          Group 16. **nDNA-encoded only**, since the table excludes
          mitochondrial-genome defects by scope.
      other_neuromuscular_disorders:
        title: Other neuromuscular disorders
        description: >-
          Group 17. Residual group for monogenic neuromuscular entities the
          table places in none of groups 1-16. Not a home for acquired
          neuromuscular disease, which is outside the table's scope entirely.

id: https://w3id.org/monarch-initiative/dismech/classifications/gene_table_nmd
name: dismech-gene-table-nmd
title: Gene Table of Neuromuscular Disorders (WMS)
description: >-
  The 17 disease groups used to organise the Gene Table of Neuromuscular
  Disorders (nuclear genome), prepared by Gisele Bonne (Sorbonne
  Universite/Institut de Myologie) and Francois Rivier (CHU de Montpellier),
  published annually in *Neuromuscular Disorders* (the journal of the World
  Muscle Society) and served online at https://musclegenetable.fr/.

  This is a **gene** classification, not a disease classification. The table is
  a gene catalogue whose rows are genes, and the 17 groups are its filing
  system; a gene appears in as many groups as it has clinically distinct
  allelic presentations. TTN, for example, is Udd distal myopathy in group 4,
  LGMDR10 in group 1, centronuclear myopathy in group 3, HMERF in group 5, and
  dilated/hypertrophic cardiomyopathy in group 10. Group membership is
  therefore genuinely set-valued per gene, which is why it is recorded in
  ``kb/gene_classifications/nmd_gene_table.yaml`` against HGNC identifiers
  rather than as a single-valued classification on a disease entry.

  Note this is **not** an expert nosology in the sense of the ISDS Nosology of
  Genetic Skeletal Disorders, which is a nosology committee's placement of each
  disorder into exactly one of 41 groups. There is no equivalent whole-domain
  nosology for neuromuscular disease; the field instead has this gene catalogue
  plus a set of separate consensus classifications for individual sub-domains
  (the 229th ENMC LGMD nomenclature, the Engel classification of congenital
  myasthenic syndromes by defect site, CMT by nerve conduction velocity).

  Scope limits inherited from the source, both of which mean a gene is simply
  absent rather than assigned to a catch-all:

  - **Nuclear genome only.** Group 16 covers only nDNA-encoded mitochondrial
    myopathy; mtDNA-encoded disease such as MELAS or MERRF is out of scope.
  - **Monogenic only.** Acquired neuromuscular disease — myasthenia gravis, the
    inflammatory myopathies, Guillain-Barre syndrome, botulism — has no group.


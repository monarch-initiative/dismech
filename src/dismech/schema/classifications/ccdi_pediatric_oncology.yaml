id: https://w3id.org/monarch-initiative/dismech/classifications/ccdi_pediatric_oncology
name: dismech-ccdi-pediatric-oncology
title: CCDI Pediatric Oncology Diagnosis Grouping Category
description: >-
  The diagnosis grouping used by the NCI Childhood Cancer Data Initiative (CCDI)
  to file a pediatric cancer diagnosis under a disease group. It is a
  transcription of the value domain of caDSR common data element 16607972,
  "Diagnosis Pediatric Oncology Grouping Category" (version 1; value domain
  16607971 "Pediatric Oncology Category"; context Pediatric Cancer; released
  2025-10-22; permissible values last revised 2026-01-26 to harmonize with
  CC4K). Retrieved 2026-11-14 from the caDSR API.

  What an assignment claims. The CDE classifies a *diagnosis record*. On a
  dismech entry the value says which CCDI group a case of this disease is filed
  under. It does not say the disease is restricted to children: osteosarcoma
  and Hodgkin lymphoma carry a value although most cases are adult.

  How a value is assigned. Every value is bound to one or more NCI Thesaurus
  concepts by caDSR itself. An entry takes a value when the NCIt concept for
  its disease is that concept or a descendant of it, and takes the most
  specific such value (alveolar rhabdomyosarcoma is ``Rhabdomyosarcoma``, not
  ``Soft Tissue Tumors``). ``just ccdi-pediatric-oncology-audit`` computes this
  from each entry's MONDO term and its NCIT cross-reference; assign from its
  output, and record the NCIt concept used in the assignment's ``notes``.

  The four residual values (``Other Gliomas``, ``Other Brain Tumors``,
  ``Other Solid Tumors``, ``Other Hematopoietic Tumors``) are bound by caDSR
  to a parent concept post-coordinated with NCIT:C17649 (Other). They apply
  only when the disease
  falls under that parent and under no specific value. Where two specific
  values apply and neither is narrower than the other, leave the slot absent
  and say why in the entry's ``notes``.

  This is not a nosology and has no hierarchy. Keys are the CDE's permissible
  values verbatim, including "Ewings Sarcoma", so a value can be exchanged with
  a CCDI data submission without a lookup table.

imports:
  - linkml:types

prefixes:
  linkml: https://w3id.org/linkml/
  dismech: https://w3id.org/monarch-initiative/dismech/
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  # caDSR public IDs have no OBO PURL, so this expands through Bioregistry
  # (registered prefix ``cadsr``), as ICDO does in icdo_morphology.yaml.
  cadsr: "https://bioregistry.io/cadsr:"

default_prefix: dismech

enums:
  CCDIPediatricOncologyCategoryEnum:
    description: >-
      Permissible values of caDSR CDE 16607972, Diagnosis Pediatric Oncology
      Grouping Category. Each value's ``description`` is the label of the NCIt
      concept caDSR binds it to; a residual value carries ``residual_of``
      instead of ``meaning``, and a value bound to two concepts carries
      ``ncit_scope``.
    exact_mappings:
    - cadsr:16607971
    related_mappings:
    - cadsr:16607972
    permissible_values:
      Atypical Teratoid/Rhabdoid Tumors:
        description: Atypical Teratoid/Rhabdoid Tumor
        meaning: NCIT:C6906
      Choroid Plexus Tumors:
        description: Choroid Plexus Neoplasm
        meaning: NCIT:C3473
      CNS Germ Cell Tumors:
        description: Central Nervous System Germ Cell Tumor
        meaning: NCIT:C5461
      CNS Sarcomas:
        description: Central Nervous System Sarcoma
        meaning: NCIT:C5153
      Craniopharyngiomas:
        description: Craniopharyngioma
        meaning: NCIT:C2964
      Ependymoma:
        description: Ependymoma
        meaning: NCIT:C3017
      Glioneuronal and Neuronal Tumors:
        description: Glioneuronal and Neuronal Tumors
        meaning: NCIT:C4747
      High-Grade Glioma:
        description: Malignant Glioma
        meaning: NCIT:C4822
      Low-Grade Gliomas:
        description: Low Grade Glioma
        meaning: NCIT:C132067
      Medulloblastoma:
        description: Medulloblastoma
        meaning: NCIT:C3222
      Other CNS Embryonal Tumors:
        description: Central Nervous System Embryonal Tumor, Not Otherwise Specified
        meaning: NCIT:C5398
      Myeloid Leukemia:
        description: Myeloid Leukemia
        meaning: NCIT:C3172
      Lymphoblastic Leukemia:
        description: Acute Lymphoblastic Leukemia
        meaning: NCIT:C3167
      Hodgkin Lymphoma:
        description: Hodgkin Lymphoma
        meaning: NCIT:C9357
      Non-Hodgkin Lymphoma:
        description: Non-Hodgkin Lymphoma
        meaning: NCIT:C3211
      Lymphoproliferative Diseases:
        description: Lymphoproliferative Disorder
        meaning: NCIT:C9308
      Soft Tissue Tumors:
        description: Soft Tissue Sarcoma
        meaning: NCIT:C9306
      Neuroblastoma:
        description: Neuroblastoma
        meaning: NCIT:C3270
      Osteosarcoma:
        description: Osteosarcoma
        meaning: NCIT:C9145
      Renal Tumors:
        description: Kidney Neoplasm
        meaning: NCIT:C3150
      Germ Cell Tumors:
        description: Germ Cell Tumor
        meaning: NCIT:C3708
      Ewings Sarcoma:
        description: Ewing Sarcoma
        meaning: NCIT:C4817
      Liver Tumors:
        description: Liver Neoplasm
        meaning: NCIT:C7103
      Other Gliomas:
        description: >-
          Residual value. A glioma that is neither a high-grade nor a low-grade
          glioma nor an ependymoma under the CDE's own bindings.
        annotations:
          residual_of: NCIT:C3059
      Other Brain Tumors:
        description: >-
          Residual value. A brain neoplasm that falls under no specific CNS
          value and is not a glioma.
        annotations:
          residual_of: NCIT:C2907
      Other Solid Tumors:
        description: >-
          Residual value. caDSR binds it to Childhood Solid Neoplasm, which has
          few descendants in NCIt, so the audit rarely proposes it.
        annotations:
          residual_of: NCIT:C9107
      Rhabdomyosarcoma:
        description: Rhabdomyosarcoma
        meaning: NCIT:C3359
      Rhabdoid Tumors:
        description: Rhabdoid Tumor
        meaning: NCIT:C3808
      Retinoblastoma:
        description: Retinoblastoma
        meaning: NCIT:C7541
      Endocrine and Neuroendocrine Tumors:
        description: >-
          Bound by caDSR to two concepts, Neuroendocrine Neoplasm and Endocrine
          Neoplasm; a disease under either takes the value.
        annotations:
          ncit_scope: NCIT:C3809 NCIT:C3010
      Other Hematopoietic Tumors:
        description: >-
          Residual value. A hematopoietic or lymphoid neoplasm that is not a
          myeloid leukemia, a lymphoblastic leukemia, a lymphoma or a
          lymphoproliferative disorder under the CDE's own bindings.
        annotations:
          residual_of: NCIT:C27134

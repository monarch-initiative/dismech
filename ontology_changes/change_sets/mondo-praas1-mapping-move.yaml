id: mondo-praas1-mapping-move
title: Move the PRAAS1 DO mapping from the PRAAS family to its PRAAS1 subtype
change_set_type: MAPPING_MOVE
justification: 'The PRAAS family contains PRAAS1 and POMP-related PRAAS2. DOID:0050553 describes PRAAS1,
  including PSMB8-related and specified digenic forms involving PSMA3 or PSMB4; its OMIM:256040 agrees
  with MONDO:0054698. It therefore does not cover the entire family represented by MONDO:0009726 and DOID:0060913.
  The saved Boomer analysis has equally weighted best solutions exchanging the family-to-PRAAS1 and family-to-family
  DO mappings. Source scope resolves that ambiguity: retain DOID:0060913 on the family and move DOID:0050553
  to PRAAS1. The pinned before/current MONDO stanzas document the move applied in MONDO PR #10629. This
  does not resolve the residual family inheritance-edge provenance or the PRAAS1-specific EXACT synonyms
  JMP syndrome and Nakajo-Nishimura syndrome; those require separate scope review.'
ontology: MONDO
mapping_representation: MONDO_XREF_QUALIFIER

id: mondo-0958174-gorlin-add-subtype-doid
title: Add the subtype DOID mapping to the basal cell nevus syndrome 1
change_type: MAPPING_CREATION
ontology: MONDO
about_node:
  id: MONDO:0958174
  label: basal cell nevus syndrome 1
mapping_target:
  id: DOID:0070365
  label: nevoid basal cell carcinoma syndrome 1
mapping_representation: MONDO_XREF_QUALIFIER
new_value: MONDO:equivalentTo
origin: SELF_PROPOSED
confidence: HIGH
request_status: ACCEPTED
justification: 'Gorlin syndrome includes PTCH1-related and SUFU-related subtypes. DOID:0070365
  specifies PTCH1 and MIM:109400, matching MONDO:0958174 and OMIM:109400. DOID:0070366 specifies
  SUFU and is another child of DOID:2512. The family is therefore broader than the PTCH1 subtype.
  This is the creation half of the mapping move applied in MONDO PR #10628; companion record mondo-0007187-gorlin-remove-subtype-doid
  records the other half. The exact family mapping to DOID:2512 remains. Both the pre-change base
  and current MONDO stanzas were checked. The upstream PR also moves the corresponding DO subset
  provenance; those annotation edits are documented in the PR, not encoded as extra mapping operations
  here. Historical solver scores explain discovery of the conflict, not the biological justification.'
adoption_status: NOT_APPLICABLE
adoption_notes: The DisMech entry already uses the family MONDO term; no asserted DisMech mapping
  to the misplaced DO subtype needs migration. The saved before/after Boomer experiment is a controlled
  source intervention, not a live source refresh. Preserve historical inputs and use corrected
  upstream mappings for future captures.

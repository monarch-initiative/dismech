id: mondo-0011631-ferroportin-related-match
title: Distinguish ferroportin disease from the hemochromatosis type 4 definition
change_type: MAPPING_PREDICATE_CHANGE
ontology: MONDO
about_node:
  id: MONDO:0011631
  label: hemochromatosis type 4
mapping_target:
  id: Orphanet:648562
  label: Ferroportin disease
mapping_representation: MONDO_XREF_QUALIFIER
old_value: MONDO:equivalentTo
new_value: MONDO:relatedTo
origin: SELF_PROPOSED
confidence: HIGH
request_status: NOT_FILED
justification: 'MONDO:0011631 uses the definition of Orphanet:647834, SLC40A1-related hemochromatosis:
  increased transferrin saturation and hepatocellular iron deposition. Orphanet:648562 explicitly describes
  a distinct disorder, with macrophage iron retention, mild anemia and no high transferrin saturation.
  Both targets are currently marked equivalent to this one MONDO class, with no preferred-external annotation
  licensing a proxy merge. Retain the equivalence to Orphanet:647834 and change only the Orphanet:648562
  qualifier to MONDO:relatedTo, preserving the cross-reference. This conservative relation acknowledges
  their shared SLC40A1 and historical type-4 context without asserting equality or a settled containment
  direction. The current definition and source distinction justify the proposal; the scoped Boomer comparison
  tests its logical effect rather than establishing clinical identity. This is not a complete concept
  split: MONDO still has two exact ferroportin-disease synonyms, a broad gene-based logical definition,
  and legacy OMIM/DO mappings. Their scopes need coordinated review before claiming a fully separated
  loss-of-function entity. The qualifier correction alone neither creates that entity nor resolves those
  residual annotations.'
adoption_status: NOT_APPLICABLE
adoption_notes: No DisMech-to-Orphanet mapping is asserted here. The existing Type 4 row already describes
  both allelic classes and the MONDO synonym/definition inconsistency. Preserve that explicit caveat pending
  a coordinated MONDO scope review; this proposal is not a local subtype split. The separate PS mapping
  added by this pilot describes series scope, not adoption of this unfiled upstream edit.

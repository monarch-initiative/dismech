id: mondo-0019503-icd11-anterior-segment-broad-match
title: Qualify the ICD-11 structural anterior-segment anomaly mapping as broader than MONDO
  anterior segment dysgenesis
change_type: MAPPING_PREDICATE_CHANGE
ontology: MONDO
about_node:
  id: MONDO:0019503
  label: anterior segment dysgenesis
mapping_target:
  id: icd11.foundation:943599144
  label: Structural developmental anomalies of the anterior segment of eye
mapping_representation: MONDO_XREF_QUALIFIER
old_value: MONDO:equivalentTo
new_value: MONDO:mondoIsNarrowerThanSource
origin: SELF_PROPOSED
confidence: HIGH
request_status: NOT_FILED
justification: The saved WHO Foundation 2026-01 records distinguish anterior segment dysgenesis
  (1182282997) from its parent, structural developmental anomalies of the anterior segment
  of eye (943599144). The parent also contains Blue sclera and Heterochromia. MONDO:0019503
  describes anterior segment dysgenesis and still marks both ICD-11 targets equivalent in
  the MONDO commit checked on 2026-11-25. Keep the equivalence to 1182282997 and replace only
  the equivalence qualifier on 943599144 with MONDO:mondoIsNarrowerThanSource, preserving
  the xref and its other source annotations. This is skos:broadMatch from MONDO to ICD-11.
  The source-scope distinction supports the edit; the saved Boomer experiment confirms that
  it removes the modeled conflict but does not itself establish clinical equivalence. WHO
  scope evidence was captured on 2026-09-21 UTC and has not been refreshed for this proposal.
adoption_status: NOT_APPLICABLE
adoption_notes: The DisMech FOXE3 entry already qualifies its broad MONDO grounding. This
  proposal changes a MONDO-to-ICD xref, not a DisMech disease mapping. Historical solver artifacts
  remain immutable. New analyses should use an updated source snapshot after any upstream
  correction.

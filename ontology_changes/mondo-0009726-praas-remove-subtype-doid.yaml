id: mondo-0009726-praas-remove-subtype-doid
title: Remove the subtype DOID mapping from the proteosome-associated autoinflammatory syndrome
change_type: REMOVE_MAPPING
ontology: MONDO
about_node:
  id: MONDO:0009726
  label: proteosome-associated autoinflammatory syndrome
mapping_target:
  id: DOID:0050553
  label: proteasome-associated autoinflammatory syndrome 1
mapping_representation: MONDO_XREF_QUALIFIER
old_value: MONDO:equivalentTo
origin: SELF_PROPOSED
confidence: HIGH
request_status: ACCEPTED
justification: 'The PRAAS family includes PRAAS1 and POMP-related PRAAS2. DOID:0050553 specifies
  PSMB8-related PRAAS1 and defined digenic combinations involving PSMA3 or PSMB4; its MIM:256040
  agrees with MONDO:0054698 and OMIM:256040. DOID:0060914 specifies POMP and is another child
  of DOID:0060913. The family is therefore broader than PRAAS1; PRAAS1 must not be reduced to
  exclusively monogenic PSMB8 disease. This is the removal half of the mapping move applied in
  MONDO PR #10629; companion record mondo-0054698-praas-add-subtype-doid records the other half.
  The exact family mapping to DOID:0060913 remains. Both the pre-change base and current MONDO
  stanzas were checked. The upstream PR also moves the corresponding DO subset provenance; those
  annotation edits are documented in the PR, not encoded as extra mapping operations here. Historical
  solver scores explain discovery of the conflict, not the biological justification.'
adoption_status: NOT_APPLICABLE
adoption_notes: The DisMech entry already uses the family MONDO term; no asserted DisMech mapping
  to the misplaced DO subtype needs migration. The saved before/after Boomer experiment is a controlled
  source intervention, not a live source refresh. Preserve historical inputs and use corrected
  upstream mappings for future captures.

id: mondo-0012503-thiopurine-family-broad-match
title: Qualify poor thiopurine metabolism as broader than TPMT deficiency
change_type: MAPPING_PREDICATE_CHANGE
ontology: MONDO
about_node:
  id: MONDO:0012503
  label: thiopurine S-methyltransferase deficiency
mapping_target:
  id: DOID:0080172
  label: poor metabolism of thiopurines
mapping_representation: MONDO_XREF_QUALIFIER
old_value: MONDO:equivalentTo
new_value: MONDO:mondoIsNarrowerThanSource
origin: SELF_PROPOSED
confidence: HIGH
request_status: ACKNOWLEDGED
justification: 'DOID:0080172 contains TPMT-related poor metabolism of thiopurines 1 (DOID:0061004)
  and NUDT15-related poor metabolism of thiopurines 2 (DOID:0060996). MONDO:0012503 describes
  TPMT deficiency and already has an exact match to DOID:0061004. Keep that specific equivalence
  and qualify the family target as broader. Current MONDO still has both exact qualifiers, so
  this edit remains unapplied. MONDO PR #10630 also removes the broader DOID from exact-match
  subset and exact-synonym provenance while retaining the synonyms and their other sources. That
  annotation cleanup is part of the upstream implementation, not an additional mapping operation.
  The reviewer approved the PR but asked about equivalence of the family to MONDO:0000210 and
  whether obsolete NUDT15 deficiency MONDO:0014826 should be reinstated. Those are separate unresolved
  scope and lifecycle questions; neither is asserted as a second accepted change here.'
adoption_status: NOT_APPLICABLE
adoption_notes: DisMech remains grounded to the TPMT-specific MONDO term and does not assert the
  disputed DO family equivalence. The saved after model is a simulation of the proposal, not evidence
  that MONDO applied it. Preserve that experiment and refresh sources for future analyses after
  any upstream correction.

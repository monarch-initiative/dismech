---
name: Generate Pages

on:
  push:
    branches: [main]
    paths:
      - 'kb/disorders/*.yaml'
      - 'kb/comorbidities/*.yaml'
      # Grouping pages are handled by generate-grouping-pages.yaml (they re-parse
      # every disorder and so run on their own, less-frequent schedule).
      # Deep-research reports render to per-report pages under pages/research/
      # (via render_all_disorders -> render_research_index_page), so a new or
      # changed report must retrigger page generation.
      - 'research/*.md'
      - 'src/dismech/schema/**'
      - 'src/dismech/templates/**'
      - 'src/dismech/render.py'
      - 'src/dismech/qc_dashboard.py'
      - 'src/dismech/export.py'
      - 'scripts/qc_uncurated_disease_links.py'
      - 'conf/qc_config.yaml'
      - 'project.justfile'
      - 'mkdocs.yml'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if already ran today'
        type: boolean
        default: false
  # Daily full-rebuild backstop (issue #5507). Push builds may render only the
  # changed disorder pages; this scheduled run always does a FULL rebuild, healing
  # any cross-link drift an incremental build could leave behind. Page/build crons
  # are intentionally unmanaged by cron-profiles.yaml.
  schedule:
    - cron: '0 6 * * *'

# Let an in-flight build finish rather than killing it when a newer change lands.
# A full run takes ~30-60 min, so cancel-in-progress: true caused builds to be
# perpetually reset by later pushes and rarely complete (issue #5198). With
# cancel-in-progress: false, GitHub lets the running build finish and queues only
# the newest pending change (intermediate pending runs collapse), so every change
# is eventually built.
concurrency:
  group: generate-pages
  cancel-in-progress: false

jobs:
  generate-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      # The derived artifacts this workflow owns. Change-detection and `git add`
      # must agree on this list: a path missing from the first makes the run
      # skip its PR, and one missing from the second silently never updates.
      BUILT_PATHS: >-
        pages/ app/data.js app/models/data.js pathographs/ dashboard/ elements/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # "Stale" has to mean ABANDONED, not merely OLD.
      #
      # This workflow reuses a single branch and UPDATES one PR in place rather
      # than opening a new one per run, so a regen PR that is being actively
      # refreshed still ages by its creation date. Selecting on createdAt
      # therefore shoots exactly the PR that carries the newest output:
      #
      #   17:16  PR opened
      #   18:09  a full rebuild force-pushes 29 corrected pages onto it and arms
      #          auto-merge
      #   ~18:45 the next run (queued behind it by the concurrency group above)
      #          sees a PR 89 minutes old and closes it as stale
      #
      # That is how the 2026-08-07 environmental-pathograph repair was discarded
      # after it had already succeeded (#8033, #8085, #8149).
      #
      # Two guards. Age is measured from updatedAt, so a refreshed PR is young
      # again; and the PR whose head IS the branch's current tip is never closed
      # whatever its age, because that PR is by definition the pending output of
      # the most recent run rather than a leftover.
      - name: Close stale regen PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BRANCH_TIP="$(git ls-remote origin refs/heads/auto/generate-pages | cut -f1)"
          echo "Current auto/generate-pages tip: ${BRANCH_TIP:-<branch absent>}"

          mapfile -t stale_prs < <(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "auto/generate-pages" \
              --state open \
              --author "app/github-actions" \
              --json number,updatedAt,headRefOid \
              --limit 100 \
            | jq -r --arg tip "$BRANCH_TIP" '
                .[]
                | select(.headRefOid != $tip)
                | select((now - (.updatedAt | fromdateiso8601)) >= 3600)
                | .number
              '
          )

          if [ "${#stale_prs[@]}" -eq 0 ]; then
            echo "No stale regen PRs to close."
            exit 0
          fi

          for pr_number in "${stale_prs[@]}"; do
            echo "Closing stale regen PR #$pr_number"
            gh pr close "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by a newer automated pages regeneration run."
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install just
        run: uv tool install rust-just

      - name: Install project
        run: uv sync --dev

      # Decide whether the disorder-page render must be FULL (a template/render/
      # schema/style change could alter every page) or may be INCREMENTAL (only
      # changed kb/disorders/*.yaml pages). Non-push events (schedule, manual
      # dispatch) and forced pushes always do a full rebuild. Fails safe to full.
      # See scripts/classify_page_build.py and issue #5507.
      - name: Classify build scope (full vs incremental)
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCED: ${{ github.event.forced }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" != "push" ] || [ "$FORCED" = "true" ]; then
            echo "Event '$EVENT_NAME' (forced=$FORCED) -> full rebuild."
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            uv run python scripts/classify_page_build.py \
              --base "$BEFORE_SHA" --head "$HEAD_SHA" \
              --github-output --files-out "${{ runner.temp }}/changed_disorders.txt"
          fi

      - name: Generate static HTML pages (full)
        if: steps.scope.outputs.mode == 'full'
        run: just gen-pages

      - name: Generate static HTML pages (incremental)
        if: steps.scope.outputs.mode == 'incremental'
        run: just gen-pages-changed-from "${{ runner.temp }}/changed_disorders.txt"

      # Re-base the generated output onto the CURRENT tip of main before anything
      # else looks at it.
      #
      # This job checked main out once, at the start, and a build takes 30-60
      # minutes. Everything below — the drift check, the aggregates, the commit —
      # would otherwise reason about a snapshot of the KB that is already
      # historical. Two consequences, both observed on 2026-08-07:
      #
      #   1. Disorders merged mid-build are absent from the tree entirely, so the
      #      drift check compares a stale KB against its own matching stale pages,
      #      sees perfect agreement, and reports clean.
      #   2. The regen branch is built at this job's checkout, so merging its PR
      #      REVERTS any page that a later regen already corrected on main.
      #
      # Re-anchoring makes the working tree kb/ current while keeping the pages
      # this build rendered, which is exactly the input the drift check needs: it
      # now compares fresh KB against our pages and heals whatever we missed.
      #
      # Note this is NOT a --force-with-lease problem, which is the tempting
      # reading. The lease works: it guards against the branch moving between this
      # job's fetch and its push. On 2026-08-07 the clobbering run fetched at
      # 15:53, two minutes AFTER the full rebuild it went on to overwrite, so its
      # lease was legitimately current. What was stale was the page content it
      # rebuilt from main, not its view of the branch.
      - name: Re-anchor generated output on current main
        shell: bash
        env:
          BRANCH_NAME: auto/generate-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Park this build's pages in a throwaway commit so changing base cannot
          # lose them. Only pages/ needs parking: app/data.js, pathographs/,
          # dashboard/ and elements/ are all generated further down, and doing so
          # AFTER this step is what makes them come from the fresh KB.
          BASE="$(git rev-parse HEAD)"
          git add -A pages/
          git commit -q -m "wip: rendered pages" || echo "no page changes to park"
          PARKED="$(git rev-parse HEAD)"

          # Explicit refspec, and it must stay scoped to main. Relying on git's
          # opportunistic remote-tracking update would fail as a silent no-op that
          # still reports success; and a bare `git fetch` would also refresh
          # refs/remotes/origin/auto/generate-pages, which is the ref the
          # --force-with-lease at the push step compares against — quietly turning
          # the lease into an unconditional force.
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if [ "$(git rev-parse origin/main)" = "$BASE" ]; then
            echo "main did not move during this build."
          else
            echo "main advanced to $(git rev-parse --short origin/main) during this build; re-anchoring."
          fi
          git checkout -q -f -B "$BRANCH_NAME" origin/main

          # Re-apply ONLY the pages this build actually changed, never the whole
          # directory. Restoring all of pages/ would carry this build's stale copy
          # of every OTHER page along with it and overwrite anything main corrected
          # while we were rendering — turning a fix into a revert. This is the
          # explicit form of what a three-way merge used to do implicitly, and it
          # is the part that has to stay narrow.
          git diff --name-status --no-renames -z "$BASE" "$PARKED" -- pages/ |
            while IFS= read -r -d '' status && IFS= read -r -d '' path; do
              case "$status" in
                D) git rm -q --ignore-unmatch -- "$path" ;;
                *) git checkout -q "$PARKED" -- "$path" ;;
              esac
            done

          echo "Re-applied $(git diff --name-only --cached HEAD -- pages/ | wc -l) page(s) onto $(git rev-parse --short HEAD)."

      # The check compares the KB with the rendered pages on two axes (see
      # scripts/classify_page_build.py): page COUNT, and per-page CONTENT via the
      # sha256 revision stamp each page carries. The content axis catches the page
      # that is present but stale — invisible to a count check, and before #8150
      # permanent, because the regen branch is rebuilt from main's pages every run.
      # On 2026-08-07 that left 29 pages stale (#8033, #8085, #8140).
      #
      # It runs *after* rendering on purpose: beforehand, a push that adds a
      # disorder always shows one more YAML than page. It runs for FULL builds too,
      # not just incremental ones: after the re-anchor above, even a full rebuild's
      # pages can be stale with respect to a disorder that merged while it ran.
      - name: Detect page/KB drift
        id: drift
        run: |
          uv run python scripts/classify_page_build.py --check-page-drift \
            --github-output --stale-files-out "${{ runner.temp }}/stale_disorders.txt"

      # Drift whose every stale page is one the targeted render will rewrite —
      # pure staleness, and a disorder added mid-build, which after the re-anchor
      # above is the common case — is repaired by rendering just those entries
      # (measured: 1m28s for 29) instead of everything (~30-60 min). On a repo
      # where merges land faster than a full build completes, healing at full cost
      # every time would make this check too expensive to leave switched on.
      - name: Heal page/KB drift (targeted re-render)
        if: steps.drift.outputs.drift == 'true' && steps.drift.outputs.heal == 'targeted'
        run: just gen-pages-changed-from "${{ runner.temp }}/stale_disorders.txt"

      # Anything a targeted render cannot fix: a page that nothing in the render's
      # output set will rewrite, left by a rename or a deletion, and removable
      # only by the prune a full build does. NOT every count mismatch — a disorder
      # added mid-build also makes the counts disagree and is repaired above.
      - name: Heal page/KB drift (full rebuild)
        if: steps.drift.outputs.drift == 'true' && steps.drift.outputs.heal != 'targeted'
        run: just gen-pages

      # A targeted heal predicts its own repair; this confirms it. If drift
      # somehow survived, fall back to the full rebuild rather than publishing
      # pages known to misrepresent their KB entries.
      - name: Verify targeted heal cleared the drift
        id: drift_recheck
        if: steps.drift.outputs.drift == 'true' && steps.drift.outputs.heal == 'targeted'
        run: uv run python scripts/classify_page_build.py --check-page-drift --github-output

      - name: Heal residual drift (full rebuild)
        if: steps.drift_recheck.outputs.drift == 'true'
        run: just gen-pages

      - name: Generate browser data
        run: just gen-browser-data

      # Hard gate: data.js is rebuilt from the whole KB, so any page the render
      # step skipped becomes a dead link in the browser UI. Fail the run rather
      # than publish it. The drift check above should already have healed this;
      # this catches what a count comparison cannot see (e.g. a rename that keeps
      # the counts equal but changes a slug).
      - name: Verify browser data links resolve to rendered pages
        run: just check-browser-links

      # The models index is rebuilt from the same KB and committed alongside
      # app/data.js. It belongs to this run for the same reason app/data.js
      # does: it is derived from the whole KB, so a curation PR that
      # regenerates it collides with every sibling PR that also did
      # (issue #9804).
      - name: Generate models browser data
        run: just gen-models-data

      - name: Verify models browser data links resolve to rendered pages
        run: |
          uv run python scripts/check_browser_data_links.py \
            --data app/models/data.js

      - name: Generate pathograph artifact
        run: just gen-pathographs

      - name: Generate compliance dashboard
        # gen-dashboard already runs gen-priority-dashboard internally, so a
        # separate priority-dashboard step would rebuild it a second time (#5198).
        run: just gen-dashboard

      - name: Generate schema docs site
        run: just gen-schema-docs

      - name: Check for changes
        id: check-changes
        run: |
          # Compare against HEAD, not the index: the re-anchor step STAGES the
          # rendered pages (git checkout <parked> -- pages/), and a bare `git diff`
          # only reports unstaged changes, so it would see nothing and skip the PR.
          # Against HEAD (= current origin/main after the re-anchor) this is
          # exactly the regeneration delta.
          if git diff --quiet HEAD -- $BUILT_PATHS; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            git diff --stat HEAD -- $BUILT_PATHS
          fi

      - name: Create or update Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="auto/generate-pages"
          # No `git checkout -B` here: the re-anchor step already created this
          # branch AT CURRENT MAIN and we have been on it ever since. Re-creating
          # it at HEAD was how the branch came to sit on this job's original
          # checkout, which is what made merging its PR revert pages that a later
          # regen had already corrected on main.
          #
          # Since that safety net is gone, assert the invariant rather than
          # force-pushing whatever branch we happen to be standing on.
          CURRENT_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$CURRENT_BRANCH" != "$BRANCH_NAME" ]; then
            echo "Expected to be on $BRANCH_NAME after the re-anchor step, but HEAD is $CURRENT_BRANCH." >&2
            exit 1
          fi

          git add $BUILT_PATHS

          PAGE_COUNT=$(ls -1 pages/disorders/*.html 2>/dev/null | wc -l | tr -d ' ')
          COMORB_PAGE_COUNT=$(ls -1 pages/comorbidities/*.html 2>/dev/null | wc -l | tr -d ' ')
          DISORDER_COUNT=$(ls -1 kb/disorders/*.yaml 2>/dev/null | wc -l | tr -d ' ')
          COMORB_COUNT=$(ls -1 kb/comorbidities/*.yaml 2>/dev/null | wc -l | tr -d ' ')

          git commit -m "$(cat <<EOF
          Regenerate pages, app data, dashboard, and schema docs

          - $PAGE_COUNT disorder HTML pages
          - $COMORB_PAGE_COUNT comorbidity HTML pages
          - Browser app data.js
          - Compliance dashboard
          - Schema docs site (MkDocs)

          Triggered by changes to KB or templates.
          EOF
          )"

          git push --force-with-lease origin "$BRANCH_NAME"

          enable_auto_merge() {
            local pr_number="$1"

            gh pr merge "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --squash \
              --auto
          }

          EXISTING_BRANCH_PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH_NAME" \
            --state open \
            --json number \
            --limit 1 \
            --jq '.[0].number // empty')"

          if [ -n "$EXISTING_BRANCH_PR_NUMBER" ]; then
            echo "Updated existing regen PR #$EXISTING_BRANCH_PR_NUMBER; enabling auto-merge."
            enable_auto_merge "$EXISTING_BRANCH_PR_NUMBER"
            exit 0
          fi

          RECENT_REGEN_PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "auto/generate-pages" \
            --state open \
            --author "app/github-actions" \
            --json number,createdAt,headRefName \
            --limit 100 \
            --jq '[.[] | select(.headRefName != "'"$BRANCH_NAME"'" and (now - (.createdAt | fromdateiso8601)) < 3600)][0].number // empty')"

          if [ -n "$RECENT_REGEN_PR_NUMBER" ]; then
            echo "Recent regen PR #$RECENT_REGEN_PR_NUMBER already exists; skipping PR creation for $BRANCH_NAME."
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH_NAME" \
            --title "📄 Regenerate pages, dashboard, and schema docs ($(date +%Y-%m-%d))" \
            --body "$(cat <<EOF
          ## Summary

          Automated regeneration of static assets after KB or template changes.

          ## Generated Assets

          | Asset | Count/Status |
          |-------|--------------|
          | Disorder HTML pages | $PAGE_COUNT |
          | Comorbidity HTML pages | $COMORB_PAGE_COUNT |
          | Disorders in KB | $DISORDER_COUNT |
          | Comorbidities in KB | $COMORB_COUNT |
          | Browser data.js | ✅ |
          | Compliance dashboard | ✅ |
          | Schema docs site | ✅ |

          ## Trigger

          This PR was triggered by changes to:
          - \`kb/disorders/*.yaml\` - disorder data files
          - \`kb/comorbidities/*.yaml\` - comorbidity data files
          - \`src/dismech/schema/**\` - LinkML schema files
          - \`src/dismech/templates/**\` - Jinja2 templates
          - \`src/dismech/render.py\` - rendering code
          - \`src/dismech/export.py\` - export code
          - \`conf/qc_config.yaml\` - QC configuration
          - \`mkdocs.yml\` and \`docs/**\` - schema docs configuration/content

          ## Review

          - [ ] Spot-check a few HTML pages render correctly
          - [ ] Verify dashboard loads and shows charts
          - [ ] Verify schema docs load at /elements/
          EOF
          )"

          CREATED_PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH_NAME" \
            --state open \
            --json number \
            --limit 1 \
            --jq '.[0].number // empty')"

          if [ -z "$CREATED_PR_NUMBER" ]; then
            echo "Failed to resolve created regen PR number for $BRANCH_NAME."
            exit 1
          fi

          echo "Created regen PR #$CREATED_PR_NUMBER; enabling auto-merge."
          enable_auto_merge "$CREATED_PR_NUMBER"

      # Deterministically approve the regen PR (the composite action explains
      # why the approval lives in this workflow rather than claude-code-review,
      # and only ever vouches for the commit this run pushed).
      - name: Approve regen PR
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: ./.github/actions/approve-regen-pr
        with:
          branch-name: auto/generate-pages
          app-id: ${{ secrets.AI4C_REVIEWER_APP_ID }}
          private-key: ${{ secrets.AI4C_REVIEWER_PRIVATE_KEY }}

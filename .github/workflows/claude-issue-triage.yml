name: Claude Issue Triage
# Automatically triage GitHub issues using Claude Code.
# The issue number in the run name is what lets the PR Shepherd's retry sweep
# (scripts/retry_failed_reviews.py) find a failed run's issue again (#13150).
run-name: 'Triage issue #${{ github.event.issue.number || inputs.issue_number }}'

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: string

jobs:
  triage-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Run Claude Issue Triage
        uses: ./.github/actions/claude-issue-triage-action
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          CC_LANGFUSE_TRACE_TAGS: >-
            ["repo:${{ github.repository }}", "workflow:claude-issue-triage",
            "run:${{ github.run_id }}", "attempt:${{ github.run_attempt }}", "job:${{ github.job }}"]
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          cborg_api_key: ${{ secrets.CBORG_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          issue_number: ${{ github.event.issue.number || inputs.issue_number }}

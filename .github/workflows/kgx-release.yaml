---
name: KGX Export Release

# Generates KGX edge export and attaches to GitHub release
# Runs after a release is published via the GitHub UI

on:  # yamllint disable-line rule:truthy
  release:
    types: [published]

permissions: {}

jobs:
  kgx-export:
    name: Generate KGX export and attach to release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to upload release assets

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install just
        run: uv tool install rust-just

      - name: Install dependencies
        run: uv sync --group export

      - name: Generate KGX export
        run: just export-kgx

      # Checked before any rename so a missing or empty artifact fails with all
      # three files still under their generated names, rather than leaving the
      # output directory half-renamed. The SEPIO sidecar is the one at risk: it
      # is written by the transform itself, not by koza's node/edge writer, and
      # is skipped entirely when the configured writer has no output directory.
      - name: Verify export outputs
        run: |
          for f in kgx_export_nodes kgx_export_edges kgx_export_sepio; do
            path="output/kgx/${f}.jsonl"
            if [ ! -s "$path" ]; then
              echo "::error::$path missing or empty; not publishing"
              exit 1
            fi
            echo "$path: $(wc -l < "$path") lines"
          done

      - name: Rename output files
        run: |
          mv output/kgx/kgx_export_nodes.jsonl output/kgx/dismech_nodes.jsonl
          mv output/kgx/kgx_export_edges.jsonl output/kgx/dismech_edges.jsonl
          mv output/kgx/kgx_export_sepio.jsonl output/kgx/dismech_sepio.jsonl

      - name: Upload KGX export to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/kgx/dismech_nodes.jsonl
            output/kgx/dismech_edges.jsonl
            output/kgx/dismech_sepio.jsonl

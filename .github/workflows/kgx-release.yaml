---
name: KGX Export Release

# Generates the KGX export (JSON Lines and TSV) plus a metadata file
# naming the Biolink Model version, and attaches them to the GitHub release
# Runs after a release is published via the GitHub UI

on:  # yamllint disable-line rule:truthy
  release:
    types: [published]

permissions: {}

jobs:
  kgx-export:
    name: Generate KGX export and attach to release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to upload release assets

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install just
        run: uv tool install rust-just

      - name: Install dependencies
        run: uv sync --group export

      - name: Generate KGX export
        run: just export-kgx

      # Checked before any rename so a missing or empty artifact fails with all
      # three files still under their generated names, rather than leaving the
      # output directory half-renamed. The SEPIO sidecar is the one at risk: it
      # is written by the transform itself, not by koza's node/edge writer, and
      # is skipped entirely when the configured writer has no output directory.
      - name: Verify export outputs
        run: |
          for f in kgx_export_nodes kgx_export_edges kgx_export_sepio; do
            path="output/kgx/${f}.jsonl"
            if [ ! -s "$path" ]; then
              echo "::error::$path missing or empty; not publishing"
              exit 1
            fi
            echo "$path: $(wc -l < "$path") lines"
          done

      - name: Rename output files
        run: |
          mv output/kgx/kgx_export_nodes.jsonl output/kgx/dismech_nodes.jsonl
          mv output/kgx/kgx_export_edges.jsonl output/kgx/dismech_edges.jsonl
          mv output/kgx/kgx_export_sepio.jsonl output/kgx/dismech_sepio.jsonl

      # Converted from the JSON Lines rather than written by a second koza pass
      # with -f tsv: koza's TSV writer keeps only six edge columns (dropping
      # publications, supporting_text, knowledge_level and the qualifiers) and
      # writes each node once per entry that names it.
      - name: Write KGX TSV
        run: >-
          uv run python -m dismech.export.release_assets kgx-tsv
          --nodes output/kgx/dismech_nodes.jsonl
          --edges output/kgx/dismech_edges.jsonl
          --nodes-out output/kgx/dismech_nodes.tsv
          --edges-out output/kgx/dismech_edges.tsv

      # Records the Biolink Model version the export was built against (the
      # installed biolink-model package whose classes kgx_export.py uses),
      # plus node and edge counts by category and predicate.
      - name: Write KGX metadata
        run: >-
          uv run python -m dismech.export.release_assets kgx-metadata --biolink
          --nodes output/kgx/dismech_nodes.jsonl
          --edges output/kgx/dismech_edges.jsonl
          -o output/kgx/dismech_kgx_metadata.json

      - name: Upload KGX export to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/kgx/dismech_nodes.jsonl
            output/kgx/dismech_edges.jsonl
            output/kgx/dismech_sepio.jsonl
            output/kgx/dismech_nodes.tsv
            output/kgx/dismech_edges.tsv
            output/kgx/dismech_kgx_metadata.json

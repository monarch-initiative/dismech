# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python
---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

env:
  FORCE_COLOR: "1" # Make tools pretty.

permissions:
  contents: read
  pull-requests: read

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
      fail-fast: false

    steps:

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false   # keep python/uv/etc
          docker-images: true

      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check for changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          list-files: shell
          filters: |
            python:
              - 'src/**'
              - 'tests/**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'justfile'
              - 'project.justfile'
            schema:
              - 'src/dismech/schema/**'
              - 'src/dismech/groupings.py'
              - 'tests/test_data.py'
            schema_generation:
              - 'src/dismech/schema/**'
              - 'config.yaml'
              - 'config.public.mk'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'justfile'
            schema_terms:
              - 'src/dismech/schema/**'
              - 'conf/oak_config.yaml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'project.justfile'
            examples:
              - 'src/dismech/schema/**'
              - 'tests/data/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'justfile'
            kb_disorders:
              - 'kb/disorders/**/*.yaml'
              - '!kb/disorders/**/*.history.yaml'
            kb_comorbidities:
              - 'kb/comorbidities/**/*.yaml'
            history:
              - 'history/**/*.yaml'
              - 'src/dismech/schema/history.yaml'
              - 'project.justfile'
            app:
              - 'app/**'
              - 'tests/js/**'
              - 'package.json'
              - 'package-lock.json'
              - 'justfile'
              - 'project.justfile'

      - name: Check curation PR scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          if echo "$CHANGED" | grep -q '^kb/'; then
            INFRA=$(echo "$CHANGED" \
              | grep -vE '^(kb/|history/|cache/|references_cache/|research/|pages/|dashboard/)' \
              || true)

            if [ -n "$INFRA" ]; then
              LABELS=$(gh pr view "${{ github.event.pull_request.number }}" \
                --repo "${{ github.repository }}" \
                --json labels \
                --jq '.labels[].name')

              if echo "$LABELS" | grep -Fxq 'scope-override'; then
                echo "scope-override label found; allowing curation scope exception."
              else
                echo "::error::Curation PR modifies files outside curation scope:"
                echo "$INFRA"
                echo "If intentional, add the 'scope-override' label to this PR."
                exit 1
              fi
            fi
          fi

      # Advisory-only nudge (never fails the build): if a PR edits a KB entry
      # (disorder/module/comorbidity) but adds no matching history/ record, warn
      # so curation provenance keeps pace with content. See docs/history.md and
      # `just new-history`.
      - name: Check curation history coverage
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          ADDED_HISTORY=$(git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '^history/.*\.yaml$' || true)

          # KB entries touched by this PR (exclude legacy *.history.yaml).
          KB_ENTRIES=$(echo "$CHANGED" \
            | grep -E '^kb/(disorders|modules|comorbidities)/[^/]+\.yaml$' \
            | grep -v '\.history\.yaml$' || true)

          if [ -z "$KB_ENTRIES" ]; then
            echo "No KB entry changes; skipping history-coverage nudge."
            exit 0
          fi

          MISSING=""
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            subdir=$(echo "$entry" | cut -d/ -f2)          # disorders|modules|comorbidities
            slug=$(basename "$entry" .yaml)
            if ! echo "$ADDED_HISTORY" | grep -q "^history/${subdir}/${slug}/"; then
              MISSING="${MISSING}  ${entry}"$'\n'
            fi
          done <<< "$KB_ENTRIES"

          if [ -n "$MISSING" ]; then
            echo "::warning::This PR changes KB entries without adding a history/ record for them:"
            printf '%s' "$MISSING"
            {
              echo "### ⚠️ Curation history coverage"
              echo ""
              echo "This PR modifies KB entries but adds no \`history/\` record for:"
              echo ""
              echo '```'
              printf '%s' "$MISSING"
              echo '```'
              echo ""
              echo "Add one with \`just new-history\` (see \`docs/history.md\`). Advisory only — this does not block merge."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "History records present for all changed KB entries. 👍"
          fi

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # https://github.com/actions/setup-python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Install project
        run: uv sync --dev --group export

      - name: Validate schema term references
        if: steps.changes.outputs.schema_terms == 'true'
        run: just validate-terms-schema

      - name: Lint with ruff
        run: uvx ruff check .

      # Runs on every PR (not gated by path filters) so kb-only changes are
      # still checked. The full pytest guard only runs when src/tests change,
      # which would otherwise let folded-scalar hyphen splits into kb/ files.
      - name: Check for folded-scalar hyphen splits
        run: uv run python scripts/check_folded_hyphens.py

      - name: Validate changed disorder KB files
        if: steps.changes.outputs.kb_disorders == 'true'
        run: |
          echo "Validating changed disorder KB files..."
          for f in ${{ steps.changes.outputs.kb_disorders_files }}; do
            if [[ "$f" == kb/disorders/* && "$f" == *.yaml && "$f" != *.history.yaml ]]; then
              if [[ ! -f "$f" ]]; then
                echo "Skipping deleted file: $f"
                continue
              fi
              echo "=== Validating disorder: $f ==="
              just validate "$f"
            else
              echo "Skipping non-disorder file: $f"
            fi
          done

      - name: Validate changed comorbidity KB files
        if: steps.changes.outputs.kb_comorbidities == 'true'
        run: |
          echo "Validating changed comorbidity KB files..."
          for f in ${{ steps.changes.outputs.kb_comorbidities_files }}; do
            if [[ "$f" == kb/comorbidities/* && "$f" == *.yaml ]]; then
              if [[ ! -f "$f" ]]; then
                echo "Skipping deleted file: $f"
                continue
              fi
              echo "=== Validating comorbidity: $f ==="
              just validate-comorbidity "$f"
            else
              echo "Skipping non-comorbidity file: $f"
            fi
          done

      - name: Validate history records
        if: steps.changes.outputs.history == 'true'
        run: just validate-history-all

      - name: Set up Node.js
        if: steps.changes.outputs.app == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        if: steps.changes.outputs.app == 'true'
        run: npm ci

      # CI runs narrower slices of `just test-code` so unrelated test-only
      # changes do not pay for full LinkML project generation or Node setup.
      - name: Run schema generation smoke test
        if: steps.changes.outputs.schema_generation == 'true'
        run: just test-schema

      - name: Run Python code/logic tests
        if: steps.changes.outputs.python == 'true'
        run: just test-python-code

      - name: Run LinkML example tests
        if: steps.changes.outputs.examples == 'true'
        run: just test-examples

      - name: Run browser search tests
        if: steps.changes.outputs.app == 'true'
        run: just test-search

      # The whole-KB conformance sweep runs only when the schema itself (or the
      # conformance-test logic) changes — the only edits that can flip a KB
      # file's validity. Parallelized with xdist inside `just test-kb`.
      - name: Run whole-KB schema-conformance sweep
        if: steps.changes.outputs.schema == 'true'
        run: just test-kb

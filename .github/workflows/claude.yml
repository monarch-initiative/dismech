name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # For `issues: assigned`, this deliberately gates on the issue author's
    # association rather than the assigner. Assigning an externally-authored
    # issue should not turn untrusted issue text into an agent trigger.
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      ) ||
      (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve agent config
        uses: ./.github/actions/resolve-agent-config
        with:
          workflow: claude

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install python tools
        run: |
          uv sync

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Auth: prefer ANTHROPIC_API_KEY (pay-per-use, no weekly subscription
          # cap); fall back to the OAuth token only when no API key is set. The
          # conditional keeps exactly one non-empty, so the action never has to
          # arbitrate. Rationale in full: claude-code-review.yml.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # This workflow passes no github_token and has id-token: write, so the
          # action runs on the OIDC-minted Claude App token. additional_permissions
          # scopes THAT token (the job-level `permissions:` block only scopes the
          # unused GITHUB_TOKEN), so it is required for Claude to read CI results.
          additional_permissions: |
            actions: read
          # Nicer UX: one updating comment + progress tracking on the issue/PR.
          use_sticky_comment: true
          track_progress: true
          # v1 folds MCP/model/tools into claude_args. Wide-open tools
          # (--dangerously-skip-permissions) as elsewhere in the fleet — the
          # trusted-author `if:` gate above is the security boundary. Model comes
          # from the central agent-config.yaml via the resolver step above.
          claude_args: |
            --dangerously-skip-permissions
            --model ${{ env.AGENT_MODEL }}
            --mcp-config '{"mcpServers": {"ols": {"command": "uvx", "args": ["ols-mcp"]}}}'

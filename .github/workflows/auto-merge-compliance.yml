---
name: Classify Weekly Compliance PR

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Existing weekly-compliance PR number to classify for the shepherd"
        required: true
        type: string

concurrency:
  group: auto-merge-compliance-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare-pr:
    runs-on: ubuntu-latest

    steps:
      # pull_request_target executes trusted default-branch workflow code. Keep
      # the checkout pinned there; never execute policy code from the PR head.
      - name: Checkout trusted default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve target PR
        id: resolve-pr
        run: |
          echo "pr_number=${{ github.event.pull_request.number || inputs.pr_number }}" >> "$GITHUB_OUTPUT"

      - name: Check PR eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          python scripts/pr_shepherd_policy.py compliance \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --github-output "$GITHUB_OUTPUT"

      # Do not mark drafts ready or arm GitHub auto-merge here. Eligible
      # compliance PRs use the same just-in-time transition and deterministic
      # closing controller as every other PR.
      - name: Report shepherd ownership
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          echo "Weekly-compliance PR is eligible; deterministic PR Shepherd owns merging."

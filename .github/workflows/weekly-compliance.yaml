---
name: 00 · Weekly Compliance

on:
  schedule:
    - cron: "0 8 * * 5"  # weekly Friday 08:00 UTC (midnight PST / 03:00 EST)
  workflow_dispatch:
    inputs:
      num_files:
        description: 'Number of poorly performing files to fix'
        required: false
        default: '5'
        type: string

      areas_for_improvement:
        description: 'A narrative description of areas to focus on. Could be data model based (description, terms); type of assertion (prevalence; treatment); or disease (cancer, genetic)'
        required: false
        default: 'ALL'
        type: string

      model:
        description: "Optional model ID override (blank = use the configured default in agent-config.yaml)"
        required: false
        default: ""
        type: string

jobs:
  compliance-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Generate ai4c-agent token
        id: ai4c-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.AI4C_AGENT_APP_ID }}
          private-key: ${{ secrets.AI4C_AGENT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.ai4c-token.outputs.token }}
          persist-credentials: false

      - name: Resolve agent config
        uses: ./.github/actions/resolve-agent-config
        with:
          workflow: weekly-compliance
          model-override: ${{ inputs.model }}

      - name: Configure git identity and credential helper
        env:
          GH_TOKEN: ${{ steps.ai4c-token.outputs.token }}
          APP_SLUG: ${{ steps.ai4c-token.outputs.app-slug }}
        run: |
          # Act as the ai4c-agent App bot (the writer identity), distinct from ai4c-reviewer;
          # serve the short-lived token to git via the gh credential helper so `gh pr create`
          # and `git push` authenticate (the missing GH_TOKEN was why prior runs made no PR).
          APP_USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install python tools
        run: |
          uv sync

      - name: Install just
        run: |
          uv tool install rust-just
          uv sync

      # The compliance agent runs `just validate <file>`, which resolves
      # ontology terms via OAK. Persist the ontology SQLite cache so it does not
      # re-download whole ontologies from bbop-sqlite. See
      # docs/explanation/oak-database-caching.md.
      - name: Cache OAK ontology databases
        uses: ./.github/actions/oak-cache

      - name: Run Claude Compliance Fixes
        id: compliance-fixes
        uses: anthropics/claude-code-action@44423bdec74b97d67543eb16c110546762c110b2 # v1
        env:
          GH_TOKEN: ${{ steps.ai4c-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.ai4c-token.outputs.token }}
        with:
          # Auth: prefer ANTHROPIC_API_KEY (pay-per-use, no weekly subscription
          # cap); fall back to the OAuth token only when no API key is set. The
          # conditional keeps exactly one non-empty, so the action never has to
          # arbitrate. Rationale in full: claude-code-review.yml.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ steps.ai4c-token.outputs.token }}
          show_full_output: true

          claude_args: |
            --dangerously-skip-permissions
            --mcp-config '{"mcpServers": {"ols": {"command": "uvx", "args": ["ols-mcp"]}}}'
            --model ${{ env.AGENT_MODEL }}

          prompt: |
            You are running as part of an automated CI workflow to improve the dismech knowledge base.

            ## Your Task

            Note: use the dismech-compliance skill to help you with this task.

            1. **Get overall compliance report**: Run `just compliance-all` and look at per-file compliance

            2. **Select ${{ inputs.num_files || '5' }} poorly performing files**: From the report, identify the disorder YAML files with the LOWEST weighted compliance scores.
               Some randomness is fine, try for a common theme if possible. No need to over-analyze, gradual progression is the goal.

               These are the areas of improvement the user wants you to focus on: ${{ inputs.areas_for_improvement }}

            3. **For each selected file**:
               - Run `just compliance <file>` to get a detailed report
               - Identify the missing fields (e.g. terms; evidence; descriptions; etc.)
               - Use the dismech-terms skill to help you with terms task.
                  - avoid using terms that are too broad or are not good matches for the intended concept. better to be incomplete than incorrect
               - conduct additional literature review as necessary.
               - Edit the YAML file to add the missing ontology term bindings
               - Run `just validate <file>` to ensure the changes are valid
               - Create a PR on a per-file basis.
                  - Branch name: `weekly-compliance-YYYY-MM-DD-DISEASENAME`
                  - Title: "🤖 Weekly Compliance Fixes (YYYY-MM-DD)"
                  - Include a detailed report summary of what was changed in the PR body, what the original issue was, what was fixed, and any remaining issues.

            ## Important Guidelines

            - The goal is not to fix all compliance issues, which might be hard to do in one go. Incremental fixes are fine. We'll get to everything eventually.
            - Only add ontology terms you can verify via OAK - never hallucinate IDs or labels
            - Use the exact label returned by OAK for the `label` field

      - name: Write step summary
        if: ${{ !cancelled() && steps.compliance-fixes.outputs.execution_file != '' }}
        uses: ./.github/actions/agent-run-summary
        with:
          execution-file: ${{ steps.compliance-fixes.outputs.execution_file }}
          title: "🤖 Weekly Compliance Run"

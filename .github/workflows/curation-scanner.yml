name: 00 · Curation Scanner

on:
  schedule:
    - cron: "0 */4 * * 1-5"  # weekday: every 4h
    - cron: "0 */8 * * 0,6"  # weekend: every 8h
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note for the manual scanner run"
        required: false
        default: ""
        type: string

jobs:
  # The effort/model/selector fan-out lives in .github/agent-config.yaml so the
  # per-tier models are in one place (issue #5218). This job emits it as the
  # curation-scan strategy matrix.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Resolve curation matrix from agent config
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null \
            || pip install --quiet --disable-pip-version-check pyyaml
          matrix="$(python3 .github/actions/resolve-agent-config/resolve_agent_config.py \
            --config .github/agent-config.yaml --workflow curation-scanner --matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "curation matrix: $matrix"

  curation-scan:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    concurrency:
      group: curation-scanner-${{ matrix.effort }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      EFFORT_TIER: ${{ matrix.effort }}
      EFFORT_SELECTOR: ${{ matrix.selector }}

    steps:
      - name: Generate ai4c-agent token
        id: ai4c-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.AI4C_AGENT_APP_ID }}
          private-key: ${{ secrets.AI4C_AGENT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Author scanner PRs as the ai4c-agent App (the writer identity), now distinct
          # from the ai4c-reviewer App, so follow-up review can still act independently on
          # the resulting work. Do not persist the token in .git/config; git authenticates
          # via the gh credential helper configured below.
          token: ${{ steps.ai4c-token.outputs.token }}
          persist-credentials: false

      - name: Configure git identity and credential helper
        env:
          GH_TOKEN: ${{ steps.ai4c-token.outputs.token }}
          APP_SLUG: ${{ steps.ai4c-token.outputs.app-slug }}
        run: |
          # Commit as the ai4c-agent App bot (canonical <id>+slug[bot] noreply email);
          # serve the short-lived token to git on demand via the gh credential helper
          # instead of persisting it in .git/config.
          APP_USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install python tools
        run: |
          uv sync

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Run Curation Scanner
        id: curation-scanner
        uses: anthropics/claude-code-action@44423bdec74b97d67543eb16c110546762c110b2 # v1
        env:
          GH_TOKEN: ${{ steps.ai4c-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.ai4c-token.outputs.token }}
          # Research provider API keys — make available for `just research-disorder falcon ...`
          # FUTUREHOUSE_API_KEY and EDISON_API_KEY are both accepted by deep-research-client
          # for the `falcon` provider (Edison Scientific, formerly FutureHouse Falcon).
          # The `claude_code` provider needs no extra key — it reuses whichever Claude
          # Code credential is set under `with:` below (anthropic_api_key, else the
          # OAuth token) and auto-enables whenever the `claude` CLI is on PATH.
          FUTUREHOUSE_API_KEY: ${{ secrets.FUTUREHOUSE_API_KEY }}
          EDISON_API_KEY: ${{ secrets.EDISON_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          # Auth: prefer ANTHROPIC_API_KEY (pay-per-use, no weekly subscription
          # cap); fall back to the OAuth token only when no API key is set. The
          # conditional keeps exactly one non-empty, so the action never has to
          # arbitrate. Rationale in full: claude-code-review.yml.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ steps.ai4c-token.outputs.token }}
          show_full_output: true
          claude_args: |
            --dangerously-skip-permissions
            --mcp-config '{"mcpServers": {"ols": {"command": "uvx", "args": ["ols-mcp"]}}}'
            --model ${{ matrix.model }}
          prompt: |
            REPO: ${{ github.repository }}
            TRIGGER: ${{ github.event_name }}
            EFFORT TIER: ${{ matrix.effort }}
            EFFORT SELECTOR: ${{ matrix.selector }}
            MANUAL NOTE: ${{ inputs.note || '' }}

            You are running an automated curation scanner for the dismech repository.

            Scan only for open issues and pull requests that are unassigned and match
            EFFORT SELECTOR. Start by gathering candidate items with `gh issue list`
            and `gh pr list`, including metadata such as labels, assignees, updated
            time, review state, and reaction counts.

            Use searches equivalent to:
            - `is:open is:issue no:assignee label:curation ...effort selector...`
            - `is:open is:pr no:assignee label:curation ...effort selector...`

            Effort tier routing:
            - `low_effort`: suitable for bounded augmentation of existing disease
              entries and low-risk issue follow-up. Do not create new disease
              entries from this tier. If a task requires new disease curation,
              leave a brief comment and ensure the work is routed to `high_effort`.
            - `medium_effort`: suitable for bounded but less mechanical updates.
            - `high_effort`: default for curation work without lower-effort labels
              and for new disease entry creation.

            If an item has more than one effort label, skip it rather than guessing.

            You may scan multiple candidates, but you must choose exactly one issue or pull request
            to actively work on in this run. Leave all other items untouched.

            Rank candidates before acting. Use judgment, with these signals in mind:
            - prioritize `high-priority` items when that label is present
            - prioritize items with stronger positive reaction signals, especially `THUMBS_UP`
            - prioritize stale items that have not been updated recently
            - deprioritize `low-priority` items
            - deprioritize items that were updated very recently, unless they are clearly the best use of this run
            - prefer the single item where a safe, meaningful next step can be completed in one run

            Avoid repeatedly touching the freshest bottom-of-queue items while older unassigned
            candidates remain.

            Selection is deliberately restricted to items with no human / non-agent assignee, so the
            scanner never steps on work a person has already claimed. Always begin the comment or PR
            you post for the selected item with one sentence stating WHY you selected it over the
            other candidates — name the deciding ranking signal and confirm it had no non-agent
            assignee — so the selection is transparent and auditable.

            For the single selected unassigned curation issue:
            - Analyze the request.
            - Post a concise assessment comment covering the likely disease or disease area, what work is needed, and the estimated scope/risk.
            - If your analysis shows the task is already fully resolved, close the issue as completed
              (`gh issue close`) with a short comment explaining what resolved it. VERIFY completion
              against the actual repository state before closing — confirm the relevant `kb/` entry
              really contains the requested content (e.g. the specific variant, PMID, and a
              validation-passing snippet) and cite the real integrating commit, which you find with
              `git log -S '<distinctive string>' -- <path>` — do NOT trust a remembered or inferred
              PR number. If you cannot verify the content in the repository, do NOT close: leave the
              assessment comment and flag for human review instead.
            - Else, if the first step is straightforward and low-risk, create an initial PR.
            - Otherwise, leave the assessment comment and flag the issue for human review.

            For the single selected unassigned curation PR:
            - Inspect its current state, review history, and discussion.
            - Address review comments when the right fix is clear and safe.
            - If the branch is stale or conflicted, refresh it carefully.
            - Prefer GitHub's update-branch flow via `gh api` rather than local rebases for branch refreshes.
            - Never use a local rebase to resolve PR conflicts.
            - If the next step is unclear or risky, post a comment asking for guidance instead of guessing.

            General guidance:
            - Use judgment rather than rigid rules.
            - Be conservative. When in doubt, comment with your assessment instead of making a risky change.
            - Prefer draft PRs for new work unless the result is clearly ready for review.
            - Follow `CLAUDE.md` and the repository conventions.
            - Never create or hand-edit `references_cache/*.md`; regenerate cache entries with `just fetch-reference <ID>` if needed.
            - Validate any file edits you make with the relevant `just` or `uv run` commands before committing.
            - After choosing a target, spend the run on that one item only.

      - name: Write step summary
        if: ${{ !cancelled() && steps.curation-scanner.outputs.execution_file != '' }}
        uses: ./.github/actions/agent-run-summary
        with:
          execution-file: ${{ steps.curation-scanner.outputs.execution_file }}
          title: "🔍 Curation Scanner Run (${{ matrix.effort }})"

---
name: Refresh Title-Snippet Baseline

# `tests/title_snippet_baseline.txt` grandfathers the pre-existing backlog of
# evidence snippets that quote the cited paper's title (issue #8374). It is a
# derived artifact: `scripts/check_title_snippets.py --update-baseline`
# regenerates it from kb/ plus references_cache/.
#
# Nothing about a curation PR that *fixes* a title snippet requires the author
# to regenerate it -- CI grandfathers live against the base branch
# (`--against-ref "origin/$BASE_REF"`) and never reads the committed file. So
# the file drifts every time the backlog shrinks, and the drift surfaces only on
# some later, unrelated PR that happens to touch src/ or tests/ and thereby
# un-gates the full pytest suite. That is issue #8434; this workflow is the
# other half of the fix (the test no longer gates on shrinkage).
#
# Runs after any push to main that could change the finding set.
#
# The branch is named `auto/generate-title-snippet-baseline` rather than
# `auto/title-snippet-baseline` so it behaves exactly like the three sibling
# regen branches: `claude-code-review.yml` declines agentic review of bot PRs
# matching `auto/generate-*`, and a branch outside that glob would be a standing
# inconsistency. The branch and PR writes use the ai4c-agent App so required PR
# checks run normally; the separate ai4c-reviewer approval remains deterministic
# because this is a generated baseline rather than material for an LLM review.

on:
  push:
    branches: [main]
    paths:
      - 'kb/**/*.yaml'
      - 'references_cache/**'
      - 'scripts/check_title_snippets.py'
      - 'src/dismech/schema/**'
      - 'conf/reference_validator_config.yaml'
  workflow_dispatch:

# Let an in-flight run finish rather than killing it; queue only the newest
# pending change. Same rationale as the page-generation workflows (issue #5198).
concurrency:
  group: title-snippet-baseline
  cancel-in-progress: false

jobs:
  refresh-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Re-anchor on the current tip of main
        shell: bash
        run: |
          # The baseline is a function of the whole tree, so the inputs and the
          # branch base must be the SAME commit. Regenerating from this job's
          # (possibly already-superseded) checkout and then pushing onto a
          # fresher main is how the page-regen workflow came to revert
          # corrections a later run had already made -- see the comment in
          # generate-pages.yaml. Reset to the live tip instead.
          git fetch origin main
          git checkout -B auto/generate-title-snippet-baseline origin/main
          echo "Anchored at $(git rev-parse --short HEAD)"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install project
        run: uv sync --dev

      - name: Regenerate the baseline
        run: uv run python scripts/check_title_snippets.py --update-baseline

      - name: Check for changes
        id: check-changes
        shell: bash
        run: |
          if git diff --quiet tests/title_snippet_baseline.txt; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Baseline already matches main; nothing to do."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --stat tests/title_snippet_baseline.txt
          fi

      - name: Generate ai4c-agent auto-lane token
        id: auto-merge-token
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.AI4C_AGENT_APP_ID }}
          private-key: ${{ secrets.AI4C_AGENT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.auto-merge-token.outputs.token }}
        shell: bash
        run: |
          # With checkout credentials deliberately absent, this makes the App
          # the actor for branch pushes as well as PR creation and auto-merge.
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="auto/generate-title-snippet-baseline"
          CURRENT_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$CURRENT_BRANCH" != "$BRANCH_NAME" ]; then
            echo "Expected to be on $BRANCH_NAME after the re-anchor step, but HEAD is $CURRENT_BRANCH." >&2
            exit 1
          fi

          # Counts for the commit/PR body. TOTAL below counts non-comment,
          # non-blank baseline lines, i.e. distinct grandfathered (file, snippet)
          # keys -- not occurrences, which live in each line's leading count
          # column and can exceed 1.
          ADDED=$(git diff --numstat tests/title_snippet_baseline.txt | cut -f1)
          REMOVED=$(git diff --numstat tests/title_snippet_baseline.txt | cut -f2)

          git add tests/title_snippet_baseline.txt

          TOTAL=$(grep -c -v -e '^#' -e '^$' tests/title_snippet_baseline.txt || true)

          git commit -m "$(cat <<EOF
          Refresh the title-snippet baseline

          - $REMOVED line(s) removed, $ADDED added
          - $TOTAL grandfathered (file, snippet) key(s) remaining

          Regenerated from the current tip of main. Lines removed are backlog
          entries that curation has since fixed; see issue #8434.
          EOF
          )"

          git push --force-with-lease origin "$BRANCH_NAME"

          enable_auto_merge() {
            local pr_number="$1"

            # Replace a request armed by an older workflow run so enabledBy is
            # the App rather than github-actions[bot]. A no-request state is
            # normal for a newly created PR.
            if [ "$(gh pr view "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --json autoMergeRequest \
              --jq '.autoMergeRequest != null')" = "true" ]; then
              gh pr merge "$pr_number" \
                --repo "$GITHUB_REPOSITORY" \
                --disable-auto
            fi

            gh pr merge "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --squash \
              --auto
          }

          EXISTING_PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH_NAME" \
            --state open \
            --json number,author \
            --limit 100 \
            --jq '[.[] | select(.author.login == "app/github-actions" or .author.login == "app/ai4c-agent")][0].number // empty')"

          if [ -n "$EXISTING_PR_NUMBER" ]; then
            echo "Updated existing baseline PR #$EXISTING_PR_NUMBER; enabling auto-merge."
            enable_auto_merge "$EXISTING_PR_NUMBER"
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH_NAME" \
            --title "🧹 Refresh title-snippet baseline ($(date +%Y-%m-%d))" \
            --body "$(cat <<EOF
          ## Summary

          Automated refresh of \`tests/title_snippet_baseline.txt\`, the
          grandfathered backlog for the title-quoting evidence-snippet check
          (issue #8374).

          | | |
          |---|---|
          | Lines removed | $REMOVED |
          | Lines added | $ADDED |
          | Grandfathered keys remaining | $TOTAL |

          ## Why this exists

          Curation PRs that *fix* a title snippet have no reason to regenerate
          this file: CI grandfathers live against the base branch and never reads
          it. Without this workflow the file drifts, and the drift surfaces as a
          confusing red test on some later unrelated PR (issue #8434).

          **Removed lines are good news** -- they are backlog entries that have
          since been fixed. Added lines are not: a genuinely new title-quoting
          snippet should be caught by the \`Check for new title-quoting evidence
          snippets\` job on the PR that introduced it, so an addition here is
          worth a look.

          ## Review

          - [ ] Removals look like fixes, not deletions of evidence
          - [ ] Any additions are explained (see above)
          EOF
          )"

          CREATED_PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH_NAME" \
            --state open \
            --json number,author \
            --limit 100 \
            --jq '[.[] | select(.author.login == "app/github-actions" or .author.login == "app/ai4c-agent")][0].number // empty')"

          if [ -z "$CREATED_PR_NUMBER" ]; then
            echo "Failed to resolve created baseline PR for $BRANCH_NAME."
            exit 1
          fi

          echo "Created baseline PR #$CREATED_PR_NUMBER; enabling auto-merge."
          enable_auto_merge "$CREATED_PR_NUMBER"

      # Load-bearing, not a formality: branch protection requires an approving
      # review before the auto-merge armed above can fire. The App-authenticated
      # push starts the required PR checks; this separate reviewer identity
      # deterministically approves the exact generated commit without paying for
      # an LLM review. See the composite action and generate-pages.yaml.
      - name: Approve regen PR
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: ./.github/actions/approve-regen-pr
        with:
          branch-name: auto/generate-title-snippet-baseline
          app-id: ${{ secrets.AI4C_REVIEWER_APP_ID }}
          private-key: ${{ secrets.AI4C_REVIEWER_PRIVATE_KEY }}

# Deterministic duplicate-claim guard (issue #16202, proposal A).
#
# Why this exists: the LLM dedupe (claude-dedupe-issues.yml) searches with the
# GitHub *search* API, whose index lags creation by seconds-to-minutes, so it
# misses a claim filed seconds before this one. Every `claim` title carries an
# exact MONDO ID, so duplicates can be found deterministically off the
# immediately-consistent *list* endpoint instead. No LLM, no search API.
#
# Action: label the loser `duplicate-claim` and comment. The keeper is the
# lowest issue number among open claims sharing the MONDO ID, so every run
# converges on the same loser regardless of which issue triggered it. This does
# NOT close the loser -- closing a legitimate re-claim (where the lower one is
# actually abandoned) is the mistake we do not want a bot making; the label
# marks the loser for a maintainer to close.
name: Claim Dedupe Guard

"on":
  issues:
    # `labeled` catches a claim that gets the `claim` label after it was opened
    # (the job `if:` below keeps it to that one label); `gh issue create --label
    # claim` sets it at creation, so the common path is `opened`.
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Claim issue to re-check; leave blank to sweep every open claim (pair with dry_run to preview the backlog)
        required: false
      dry_run:
        description: Report duplicates without labelling or commenting
        type: boolean
        default: false
  # Backstop (hourly straggler sweep) for a sibling that was not yet visible at
  # open time. The repo's cron floor is hourly (see CLAUDE.md cron-profiles), so
  # this is the delayed re-check rather than a 5-10 min one; tighten only if the
  # floor is lifted. On a schedule run the script scans every open claim.
  # This cron is deliberately NOT in .github/cron-profiles.yaml: that file
  # manages the agentic workflows' cadence, and this guard is deterministic.
  schedule:
    - cron: '17 * * * *'

permissions:
  issues: write

jobs:
  guard:
    # On a `labeled` event only act when the label added is `claim`; every other
    # event (opened, dispatch, schedule) always runs. This keeps the broad
    # `issues: labeled` trigger from spinning a runner on unrelated label events.
    if: >-
      github.event_name != 'issues'
      || github.event.action != 'labeled'
      || github.event.label.name == 'claim'
    # One global group, not per-issue: the race this guards (two claims opened
    # seconds apart) runs both issues' jobs at once, and a per-issue group lets
    # both comment on the same loser. Serialized, the second run sees the label
    # the first added and skips. cancel-in-progress stays false, so a running
    # guard is never interrupted; a waiting run can still be displaced by a newer
    # one (GitHub keeps only one queued per group), but the hourly sweep is the
    # backstop that re-checks anything a displaced run would have caught.
    #
    # Set on the job, not the workflow: a skipped job (the `if:` above filtering
    # out a non-`claim` labeled event, including the `duplicate-claim` label this
    # guard adds itself) must not enter the group and displace a waiting run.
    concurrency:
      group: claim-dedupe-guard
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Flag duplicate claims by MONDO ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TRIGGER_ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 .github/scripts/claim_dedupe_guard.py

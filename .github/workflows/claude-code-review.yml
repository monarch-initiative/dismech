name: Claude Code Review
run-name: 'Review PR #${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}'

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (for fork PRs where OIDC fails)'
        required: true
        type: number

# Every comment on a PR starts an issue_comment run of this workflow. Only a
# `/review` comment asks for a review; any other comment's run skips all jobs.
# It must not share the PR's group, or it cancels the queued or running review
# on its way to skipping (dismech#18311). Such runs get their own group by
# appending the run id, so only real review requests replace each other.
concurrency:
  group: >-
    claude-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}${{ github.event_name == 'issue_comment' && github.event.comment.body != '/review' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  # dismech#18311: a `/review` comment otherwise gets no sign it was accepted
  # until the review job reaches a runner, which can take many minutes when CI
  # is busy. This small job (no project install, one-file checkout) posts a
  # status comment as soon as any runner is free: "queued" for an accepted
  # request, or a refusal saying why. The review job then edits that comment
  # to "started" and to the outcome. Gated on the exact body so ordinary
  # comments start no job here. The comment is posted with GITHUB_TOKEN, and
  # comments made with that token do not trigger workflows, so it cannot start
  # (or cancel) another run.
  acknowledge:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the status-comment script
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: scripts/review_status_comment.sh
          sparse-checkout-cone-mode: false

      - name: Post the review request status
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REQUESTER: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          # Must match the author check in claude-review's `if:` below.
          ACCEPTED: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
        run: |
          if [[ "$ACCEPTED" == "true" ]]; then
            bash scripts/review_status_comment.sh queued
          else
            bash scripts/review_status_comment.sh refused
          fi

  # Automated page-build regen PRs (auto/generate-pages,
  # auto/generate-grouping-pages, auto/generate-project-pages — opened by
  # ai4c-agent, with legacy open PRs authored by github-actions[bot]) are pure
  # derived-asset rebuilds: an agentic review of thousands of regenerated HTML
  # files is expense without signal, so this workflow declines to review them.
  # The approving review that branch protection (and their armed auto-merge)
  # requires is instead supplied deterministically by the regen workflows
  # themselves, right after each force-push.
  #
  # The pull_request skip in claude-review's `if:` is not enough on its own:
  # historically these PRs also reached review via pr-shepherd dispatching this
  # workflow for PRs stuck in
  # REVIEW_REQUIRED — the workflow_dispatch path, which the job-level `if:`
  # cannot inspect (the dispatch payload has only a PR number). This guard job
  # resolves the dispatched PR's head branch and author so claude-review can
  # decline those dispatches too. pr-shepherd is also instructed not to
  # dispatch for regen PRs; this is the deterministic backstop for that.
  #
  # The `/review` comment path is deliberately left open as the one manual
  # escape hatch: it requires an OWNER/MEMBER/COLLABORATOR author, so it is
  # always an explicit human request.
  dispatch-guard:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      page-build: ${{ steps.check.outputs.page-build }}
    steps:
      - name: Check whether the dispatched PR is an automated page-build PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          set -uo pipefail
          # Fail OPEN: if the PR cannot be resolved (bad number, transient API
          # error), run the review rather than silently disabling it — the
          # same posture as the diff-scale preflight in claude-review.
          info="$(gh pr view "$PR_NUMBER" --repo "$REPO" \
                    --json headRefName,author \
                    --jq '[.headRefName, .author.login] | @tsv' || true)"
          head_ref="${info%%$'\t'*}"
          author="${info##*$'\t'}"
          echo "Dispatched PR #${PR_NUMBER}: head_ref='${head_ref}' author='${author}'"

          # gh renders App authors with an app/ prefix; accept raw login forms
          # too, and retain github-actions for already-open legacy regen PRs.
          case "$author" in
            app/github-actions|github-actions|github-actions\[bot\]|app/ai4c-agent|ai4c-agent|ai4c-agent\[bot\]) is_bot=true ;;
            *) is_bot=false ;;
          esac

          if [[ "$head_ref" == auto/generate-* && "$is_bot" == true ]]; then
            echo "page-build=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Agentic review declined::PR #${PR_NUMBER} is an automated page-build regen PR (${head_ref}, author ${author}). These are approved deterministically by their regen workflow and get no agentic review. To force one, comment /review on the PR."
          else
            echo "page-build=false" >> "$GITHUB_OUTPUT"
          fi

  claude-review:
    needs: dispatch-guard
    # The needs/!cancelled() dance: dispatch-guard only runs on
    # workflow_dispatch, so for pull_request and issue_comment events it is
    # skipped — !cancelled() lets this job still evaluate its condition then
    # (a skipped need yields empty outputs, which pass the != 'true' check).
    # We deliberately do NOT gate on the guard's job result: a guard that fails
    # for an infrastructure reason must fail OPEN (run the review) rather than
    # silently disable it, matching the guard step's own fail-open posture.
    # Only an affirmative page-build == 'true' declines the review.
    # The pull_request branch declines bot-authored page-build regen PRs
    # directly from the event payload (see dispatch-guard's comment for the
    # full design); the author guard means a HUMAN pushing a PR from a branch
    # that happens to match the prefix still gets the normal agentic review.
    if: >-
      ${{
        !cancelled() &&
        needs.dispatch-guard.outputs.page-build != 'true' &&
        ((
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          !(
            startsWith(github.event.pull_request.head.ref, 'auto/generate-') &&
            contains(
              fromJSON('["github-actions[bot]","ai4c-agent[bot]"]'),
              github.event.pull_request.user.login
            )
          )
        ) ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          github.event.comment.body == '/review' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        ))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # dismech#18311. Copy the script out of the default-branch checkout before
      # the next steps switch to the PR branch, so the status updates always run
      # main's copy, then mark the request as started.
      - name: Mark the /review status comment as started
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REQUESTER: ${{ github.event.comment.user.login }}
        run: |
          cp scripts/review_status_comment.sh "${RUNNER_TEMP}/review_status_comment.sh"
          bash "${RUNNER_TEMP}/review_status_comment.sh" started

      - name: Resolve agent config
        uses: ./.github/actions/resolve-agent-config
        with:
          workflow: claude-code-review

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false   # keep python/uv/etc
          docker-images: true

      - name: Checkout PR branch (for manual review triggers)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout ${{ env.PR_NUMBER }}

      - name: Generate ai4c-reviewer token
        id: reviewer-token
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.AI4C_REVIEWER_APP_ID }}
          private-key: ${{ secrets.AI4C_REVIEWER_PRIVATE_KEY }}

      # Preflight: claude-code-action fetches the PR through GitHub's GraphQL API
      # and reads `pullRequest.files.nodes` with no null guard. Above GitHub's
      # diff-size ceiling that field comes back **null with no `errors` entry** —
      # a silent null, not an API error — so the action dies with
      # "TypeError: null is not an object (evaluating 'pullRequest.files.nodes')"
      # and no review is posted. Seen on PR #7912 (5,924 changed files: a full
      # page rebuild) and again on a regen PR on 2026-08-02. GraphQL also reports
      # changedFiles: 0 for these, while the REST files endpoint still returns
      # rows — so this is a GraphQL-side limit, not missing data.
      #
      # Detect it up front and skip the agent with a loud notice instead of a red
      # X on a PR nobody can do anything about. Note this does NOT unblock the
      # merge: branch protection requires 1 approving review, which the bot
      # normally supplies, so an oversized PR still needs a human approval — which
      # is why the skip path also comments on the PR, where that reader is.
      # Deliberately placed BEFORE the Claude/uv/just/project installs: it needs
      # only the token, so short-circuiting here saves those minutes entirely.
      # Upstream: anthropics/claude-code-action should null-guard the field
      # (reported as anthropics/claude-code-action#1587).
      - name: Check the PR diff is enumerable by the review action
        id: diff-scale
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          owner="${REPO%/*}"; name="${REPO#*/}"
          err_file="${RUNNER_TEMP}/diff-scale-probe.err"

          # Ask jq for an explicit token. Do NOT select the field directly and
          # compare against "null": gh --jq prints an EMPTY STRING for a JSON
          # null, so a naive `[ "$x" != "null" ]` never fires.
          #
          # PR_NULL is distinguished from FILES_NULL because jq propagates null
          # through indexing — a null `pullRequest` (visibility/permission
          # failure) would otherwise read as "oversized" and skip the review.
          # It is treated as inconclusive, so that path fails open.
          #
          # first:100 matches the page size the action itself requests. #7912
          # returns null even at first:1, so the ceiling looks PR-level, but
          # this is never *less* sensitive if it turns out to be page-size-driven.
          probe() {
            gh api graphql \
              -f query='query($owner:String!,$name:String!,$pr:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$pr){ files(first:100){ nodes{ path } } }
                }
              }' \
              -F owner="$owner" -F name="$name" -F pr="${PR_NUMBER}" \
              --jq 'if .data.repository.pullRequest == null then "PR_NULL"
                    elif .data.repository.pullRequest.files == null then "FILES_NULL"
                    else "FILES_OK" end' 2>"$err_file"
          }

          verdict=""
          for attempt in 1 2 3; do
            verdict="$(probe || true)"
            case "$verdict" in
              FILES_NULL|FILES_OK) break ;;
            esac
            echo "GraphQL probe attempt ${attempt} inconclusive (verdict='${verdict}')." >&2
            # Keep the underlying error: without it a future "review ran against a
            # broken API" investigation has nothing but the word "inconclusive".
            [ -s "$err_file" ] && sed 's/^/  probe stderr: /' "$err_file" >&2
            [ "$attempt" -lt 3 ] && sleep 5
          done

          # Fail OPEN. A transient API error, or a null pullRequest, must not
          # silently disable review — only a definite FILES_NULL earns a skip.
          if [ "$verdict" != "FILES_NULL" ]; then
            echo "PR #${PR_NUMBER}: probe=${verdict:-<none>}; running the review."
            echo "oversized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Deliberately no file count in the message. GitHub reports
          # changedFiles: 0 for these PRs and stops paginating the REST files
          # endpoint after one page, so any number we printed would be wrong —
          # worse than none. Describe the condition instead.
          # printf, not a quoted line continuation: inside double quotes a
          # trailing backslash continues the line but KEEPS each continuation's
          # leading indentation, which the ::notice annotation renders verbatim.
          msg="$(printf '%s' \
            "GitHub cannot enumerate PR #${PR_NUMBER}'s diff: the GraphQL API returns " \
            "pullRequest.files = null (and changedFiles: 0) for diffs past its size " \
            "ceiling, so the review action cannot fetch the PR and dies on the null. " \
            "Skipping the review rather than failing on something this PR cannot fix. " \
            "NOTE: branch protection still requires 1 approving review, so this PR " \
            "needs a HUMAN approval to merge. Typical cause: an automated full page " \
            "rebuild on auto/generate-pages (PR #7912 was ~5,900 files). Inspect the " \
            "diff locally with 'git diff --stat origin/main...<head>'.")"

          echo "::notice title=Claude review skipped: diff too large to fetch::${msg}"
          {
            echo "### ⏭️ Claude review skipped — diff too large to fetch"
            echo
            echo "${msg}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "oversized=true" >> "$GITHUB_OUTPUT"

          # A run-summary notice is invisible to whoever has to supply the human
          # approval above; they are reading the PR. Comment there too, but only
          # once — this workflow reruns on every synchronize, and a force-pushed
          # regen branch would otherwise accumulate identical comments.
          marker="<!-- claude-review-skipped-oversized -->"
          if gh pr view "${PR_NUMBER}" --repo "${REPO}" --json comments \
               --jq '.comments[].body' 2>/dev/null | grep -qF "$marker"; then
            echo "Skip notice already on PR #${PR_NUMBER}; not re-commenting."
          else
            printf '%s\n\n### ⏭️ Automated review skipped — diff too large to fetch\n\n%s\n' \
              "$marker" "$msg" \
              | gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file - \
              || echo "::warning::Could not post the skip notice to PR #${PR_NUMBER}."
          fi

      - name: Set up latest Claude Code
        id: setup-claude-code
        if: steps.diff-scale.outputs.oversized != 'true'
        uses: ./.github/actions/setup-claude-code

      # The review agent's allowedTools grant `Bash(just:*)` and `Bash(uv run:*)`
      # so it can run the deterministic validators (just qc / validate-kb-references /
      # validate-terms). Those binaries are not on standard runners, so set
      # them up here — mirrors the setup in main.yaml.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install just
        run: uv tool install rust-just

      - name: Install project
        run: uv sync --dev --group export

      # Timestamp for "Check a review verdict was published" below: a review
      # submitted at or after this instant belongs to this run.
      - name: Record review start time
        id: review-start
        if: steps.diff-scale.outputs.oversized != 'true'
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # dismech#18298: GitHub's reviews API reports every review's `commit_id`
      # as the PR's CURRENT head, not the commit that was reviewed — after a
      # rebase, older approvals are relabelled onto the new commit. An agent
      # that asks "is the head the commit I last approved?" from that field
      # always gets yes, declines to review, publishes nothing, and the verdict
      # check below turns the job red on a commit no later event can re-run.
      # Hand the agent the one comparison that is sound instead: a review
      # submitted before the head commit was committed cannot be a review of
      # it. (The converse does not hold — a later review may still predate a
      # push of an older commit — so the summary only ever says "predates".)
      # Fails open: if the API cannot be read, the agent is told so and
      # reviews from scratch, which is the safe direction.
      - name: Summarise prior reviews against the head commit
        id: prior-reviews
        if: steps.diff-scale.outputs.oversized != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          summary="$(
            head_sha="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid --jq .headRefOid)" \
              && head_at="$(gh api "repos/${REPO}/commits/${head_sha}" --jq .commit.committer.date)" \
              && reviews="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
                   --jq ".[] | select(.submitted_at != null) | \"- \\(.submitted_at) \\(.state) by \\(.user.login)\\(if .submitted_at < \"${head_at}\" then \" — PREDATES the head commit, so it is not a review of it\" else \"\" end)\"")" \
              && printf 'Head commit %s was committed at %s.\nPrior reviews (submitted_at, state, author):\n%s\n' \
                   "${head_sha}" "${head_at}" "${reviews:-- none}"
          )" || summary="Prior-review summary unavailable (GitHub API error). Review the PR from scratch."
          echo "$summary"
          {
            echo "text<<PRIOR_REVIEWS_EOF"
            echo "$summary"
            echo "PRIOR_REVIEWS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        if: steps.diff-scale.outputs.oversized != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          CC_LANGFUSE_TRACE_TAGS: >-
            ["repo:${{ github.repository }}", "workflow:claude-code-review",
            "run:${{ github.run_id }}", "attempt:${{ github.run_attempt }}", "job:${{ github.job }}"]
          # A Bash command that outlives its timeout is otherwise moved to the
          # background. In a headless run the agent can then end its turn to
          # "wait for the notification", which ends the session with a clean
          # result and no verdict posted. Keep every command in the foreground.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # Keep the .git suffix: the action validates marketplace URLs.
          plugin_marketplaces: |
            https://github.com/langfuse/Claude-Observability-Plugin.git
          plugins: |
            langfuse-observability@langfuse-observability
          # Auth precedence: ANTHROPIC_API_KEY (pay-per-use) wins when it is set —
          # it has no weekly subscription cap, so it keeps reviews running when the
          # shared OAuth account is exhausted. CLAUDE_CODE_OAUTH_TOKEN (Claude
          # subscription) is the fallback used only when no API key is configured.
          # The conditional keeps exactly one of the two non-empty so there is no
          # precedence ambiguity inside the action.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ steps.reviewer-token.outputs.token || github.token }}
          path_to_claude_code_executable: ${{ steps.setup-claude-code.outputs.executable }}
          track_progress: ${{ github.event_name == 'pull_request' }}
          allowed_bots: 'claude,github-actions,ai4c-agent'
          claude_args: |
            --model ${{ env.AGENT_MODEL }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api:*),Bash(cat:*),Bash(grep:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(find:*),Bash(ls:*),Bash(just:*),Bash(uv run:*)"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Review this pull request using the dismech-pr-review skill.

            EVERY RUN MUST END IN A SUBMITTED REVIEW (dismech#18298). Do not
            decline to review because the PR "was already reviewed" or
            "nothing changed". A run that submits no review fails this job,
            and that red check cannot be cleared by re-running it.

            Do NOT use a review's `commit_id` to decide what you have already
            reviewed. GitHub reports `commit_id` as the PR's current head, not
            the commit that was reviewed: after a rebase or force-push every
            earlier review is relabelled onto the new head, so "the head is
            the commit last approved" is always true and always meaningless.
            Use the deterministic summary below instead. A review marked
            PREDATES was made before the head commit existed and is not a
            review of it.

            ${{ steps.prior-reviews.outputs.text }}

            If you are confident the head differs from what was last reviewed
            only by a rebase onto `main` (check `gh pr diff`, not commit ids),
            you may keep the review short — but still submit a verdict:
            re-approve, or re-request the outstanding changes.

            Focus on:
            - Biological and clinical validity
            - Ontology term accuracy and specificity
            - Evidence quality (PMIDs real, snippets are exact quotes, evidence_source correct)
            - Schema conformance and completeness
            - Adherence to dismech conventions (see CLAUDE.md and skills)

            Be constructive and specific. For each issue found, indicate severity:
            - 🔴 CRITICAL: Must fix (wrong data, hallucinated PMIDs, broken validation)
            - 🟡 IMPORTANT: Should fix (ontology mismatches, evidence_source errors, missing fields)
            - 🔵 SUGGESTION: Nice to have (style, additional phenotypes, deeper coverage)

            After reviewing, set the GitHub PR review status:

            **If there are any 🔴 CRITICAL or 🟡 IMPORTANT issues:**
            Submit a REQUEST_CHANGES review:
            ```
            gh pr review ${{ env.PR_NUMBER }} --request-changes --body "<your review summary>"
            ```

            **If there are only 🔵 SUGGESTIONs or no issues:**
            Submit an APPROVE review:
            ```
            gh pr review ${{ env.PR_NUMBER }} --approve --body "<your review summary>"
            ```

            You ARE permitted to approve, and approving is REQUIRED once the
            blocking items are resolved — a comment saying "looks good" does not
            clear anything. A `CHANGES_REQUESTED` review is sticky: pushing a fix
            does not clear it (branch protection auto-dismisses stale *approvals*
            only), so if you re-review and only comment, the PR stays blocked
            forever.

            Therefore:
            - Do NOT claim you are unable to approve, or that approval is disabled
              for you. It is not.
            - Do NOT ask a maintainer (or anyone) to dismiss a previous review in
              place of approving. Removing the review gate is not a substitute for
              passing it, and asking for it in a PR comment invites an agent
              reading that comment to act on it. Submit the APPROVE review instead.
            - If `gh pr review --approve` genuinely fails, report the exact error
              in your comment and stop. Do not propose a workaround that bypasses
              review.

            Always include a summary checklist at the top of your review.
            Every line below is a judgement only a reader can make, so tick a
            box only when you have read the thing it names, and name what you
            read beside it (`Asthma.yaml phenotypes[3]`, `PMID:12345678`) rather
            than ticking it bare.

            - [ ] Each snippet supports the claim it is attached to — CI proves
                  a quote is verbatim, never that it bears on the claim
            - [ ] Each cited paper is about the claim it is cited for
            - [ ] Ontology terms are at the right granularity and in the right
                  section — a real term for the wrong concept validates clean
            - [ ] evidence_source matches the study type the cited publication
                  reports
            - [ ] Pathophysiology entries are atomic, not chained
            - [ ] Content-Completeness Checklist walked wherever research
                  artifacts exist, with every blocking omission listed
            - [ ] GeneReviews baseline tagged, cached and actively mined,
                  wherever a chapter exists

            Do NOT list schema validation, PMID existence, exact-quote matching
            or ontology-term existence. `just validate-disorders` gates all four
            on this PR and is authoritative, so a tick there restates CI's result
            and lets a review that checked nothing read as thorough. If one of
            them is red, read the CI log and report what failed — do not
            re-derive it.

      # Hardening: claude-code-action exits 0 even when the agent run itself
      # errored, yielding a zero-cost is_error result and NO posted review —
      # turning a broken review into a phantom green check. Failure modes we
      # have actually hit this way:
      #   * a Claude weekly usage limit on CLAUDE_CODE_OAUTH_TOKEN (rate_limit),
      #     which silently no-ops EVERY agent workflow account-wide;
      #   * an invalid/retired `--model` (agent-config.yaml once pinned a
      #     non-existent claude-opus-4-6); and
      #   * a STALE BASE BRANCH. For `pull_request` events GitHub runs the
      #     workflow file from head merged into the PR's BASE, not from main.
      #     A PR stacked on a long-lived integration branch therefore executes
      #     that branch's copy of this file — so fixing main does nothing for
      #     it. dismech#7655 burned hours on this: the base branch predated the
      #     ANTHROPIC_API_KEY fallback, so the run used the capped subscription
      #     token even though main had already been fixed. Re-running does not
      #     help either; a re-run replays the original workflow file. The fix is
      #     to merge main into the base branch.
      # Inspect the execution log and fail the job when the run errored, sorting
      # the credential failures into distinct branches (subscription cap vs API
      # account out of credit vs max-turns) because their remedies are different
      # and a wrong one sends debugging the wrong way — which is precisely how
      # each of the above stayed hard to diagnose. Loud red X, never a silent pass.
      - name: Verify the review agent actually ran
        # Skipped only when the preflight above proved the action *cannot* fetch
        # this PR. Every other path still gets the hardening — a missing
        # execution log must stay a loud red X, not a silent pass.
        if: always() && steps.diff-scale.outputs.oversized != 'true'
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -euo pipefail
          file="${EXECUTION_FILE:-}"
          if [[ -z "$file" || ! -f "$file" ]]; then
            file="${RUNNER_TEMP}/claude-execution-output.json"
          fi
          if [[ ! -f "$file" ]]; then
            echo "::error title=Claude review failed::No execution log found; the review agent did not run."
            exit 1
          fi
          python3 - "$file" <<'PY'
          import json, os, sys

          def summary(md):
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a", encoding="utf-8") as fh:
                      fh.write(md + "\n")

          raw = open(sys.argv[1], encoding="utf-8").read().strip()
          try:
              events = json.loads(raw)
              if not isinstance(events, list):
                  events = [events]
          except json.JSONDecodeError:
              events = [json.loads(line) for line in raw.splitlines() if line.strip()]

          results = [e for e in events if isinstance(e, dict) and e.get("type") == "result"]
          if not results:
              print("::error title=Claude review failed::No result event in the execution "
                    "log; the agent did not complete.")
              summary("### ❌ Claude review failed\nNo result event — the agent did not complete.")
              sys.exit(1)

          r = results[-1]
          stats = (f"num_turns={r.get('num_turns')} cost=${r.get('total_cost_usd')} "
                   f"subtype={r.get('subtype')}")

          if not r.get("is_error"):
              print(f"Claude review completed cleanly: {stats}")
              sys.exit(0)

          reason = str(r.get("error") or "").strip()
          detail = str(r.get("result") or "").strip()
          haystack = f"{reason} {detail}".lower()

          def fail(title, heading, body):
              print(f"::error title={title}::{body}")
              summary(f"### {heading}\n\n{body}")
              sys.exit(1)

          # Ordered most-specific first. Every branch must state a remedy that is
          # correct for ITS credential path — a confidently-wrong remedy is the
          # failure this whole block exists to prevent.

          # (a) Budget exhaustion is a workflow bug, not a quota problem. Checked
          # before the quota markers because "turn limit reached" would otherwise
          # match LIMIT_MARKERS and send the reader off to check billing.
          if r.get("subtype") == "error_max_turns":
              fail("Claude review errored: max turns",
                   "❌ Claude review ran out of turns",
                   f"The agent hit its max-turn budget before posting a review. {stats} "
                   f"detail={detail!r}. This is a workflow-budget problem, NOT a credential "
                   "problem: raise --max-turns or narrow the review prompt.")

          # (b) Billing failures come from the API-KEY path — the account behind
          # ANTHROPIC_API_KEY is out of credit. That is the opposite of a
          # subscription cap and has the opposite remedy, so it gets its own branch.
          BILLING_MARKERS = ("out of credit", "credit balance", "insufficient quota",
                             "billing", "payment required")
          if any(m in haystack for m in BILLING_MARKERS):
              fail("Claude review skipped: account credit exhausted",
                   "⛔ Claude review skipped — Anthropic account credit exhausted",
                   f"NO review ran. {stats} detail={detail!r}. This is a BILLING issue on "
                   "the account behind ANTHROPIC_API_KEY — not a subscription cap, and not "
                   "a problem with this PR. Fix: top up credit or check billing on that "
                   "Anthropic account. Re-setting the secret will NOT help; the key works, "
                   "the account is empty.")

          # (c) Subscription cap on the OAuth token. Claude phrases this several
          # ways and the wording has changed over time: matching only "usage limit"
          # /"weekly limit" missed the live message "You've hit your limit - resets
          # 8pm (UTC)", which fell through to the generic branch and blamed
          # --model/a bad token, pointing debugging the wrong way for hours. Match
          # the family. "rate_limit" (underscore) also covers the machine-readable
          # `error` value and any future rate_limit_error.
          LIMIT_MARKERS = ("usage limit", "weekly limit", "hit your limit",
                           "rate limit", "rate_limit", "limit reached")
          if any(m in haystack for m in LIMIT_MARKERS):
              base_check = ("gh api 'repos/{owner}/{repo}/contents/.github/workflows/"
                            "claude-code-review.yml?ref=<base-branch>' --jq .content | "
                            "base64 -d | grep -c anthropic_api_key")
              fail("Claude review skipped: usage limit",
                   "⛔ Claude review skipped — subscription usage limit reached",
                   f"NO review ran. {stats} detail={detail!r}. This is a SUBSCRIPTION quota "
                   "issue on CLAUDE_CODE_OAUTH_TOKEN, not a problem with this PR. This "
                   "workflow prefers ANTHROPIC_API_KEY (pay-per-use, no subscription cap) "
                   "and falls back to the OAuth token only when no API key is set, so "
                   "reaching this means the run used the subscription token. Two ways that "
                   "happens: (1) the ANTHROPIC_API_KEY repo secret is unset; or (2) this PR "
                   "targets a BASE BRANCH whose copy of this workflow predates the API-key "
                   "fallback — for pull_request events GitHub runs the workflow file from "
                   "head merged into BASE, not from main, so a fixed main does not help a "
                   "PR stacked on a stale branch. Authoritative check for (2): " + base_check
                   + " — a count of 0 means the base branch is stale; merge main into it. "
                   "Re-running this job will NOT help in that case: a re-run replays the "
                   "original workflow file.")

          msg = (f"Review agent errored (is_error=true); NO review was posted. "
                 f"error={reason!r} detail={detail!r} {stats}. Common causes: an "
                 "invalid/retired --model, a bad credential, or an aborted run.")
          print(f"::error title=Claude review errored::{msg}")
          summary("### ❌ Claude review errored\n\n" + msg)
          sys.exit(1)
          PY

      # The verify step above only asks whether the agent *errored*. A run can
      # also finish cleanly (is_error=false, subtype=success, real turns and
      # cost) and still publish nothing: PR #15393 got three such runs in a
      # row, each a green check holding no verdict. Green is the one state
      # pr-shepherd's retry-reviews never revisits, so those PRs sat blocked
      # until a human noticed. Ask GitHub whether a bot review landed during
      # this run, and turn the job red when none did, so retry picks it up.
      # A review submitted by a person in the same window would mask the miss;
      # that is rare enough not to be worth an author-identity lookup here.
      - name: Check a review verdict was published
        if: success() && steps.diff-scale.outputs.oversized != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STARTED_AT: ${{ steps.review-start.outputs.at }}
        run: |
          set -euo pipefail
          found="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq ".[] | select(.user.type == \"Bot\" and .submitted_at >= \"${STARTED_AT}\") | .state" \
            | wc -l)"
          if [[ "$found" -gt 0 ]]; then
            echo "Review verdict published on PR #${PR_NUMBER} (${found} bot review(s) since ${STARTED_AT})."
            exit 0
          fi
          msg="The review agent finished without error but submitted no PR review on #${PR_NUMBER} since ${STARTED_AT}. The PR is still unreviewed. The agent's transcript is hidden (show_full_output is off); its Langfuse trace for this run has the turn where it stopped. Re-run this job, or comment /review on the PR."
          echo "::error title=Claude review published no verdict::${msg}"
          printf '### ❌ Claude review published no verdict\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # dismech#18311: close out the /review status comment with the outcome.
      # Runs last so job.status reflects every step above, including the
      # verdict check: success here means a verdict was published.
      - name: Record the /review outcome in the status comment
        if: always() && github.event_name == 'issue_comment'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REQUESTER: ${{ github.event.comment.user.login }}
          JOB_STATUS: ${{ job.status }}
          OVERSIZED: ${{ steps.diff-scale.outputs.oversized }}
        run: |
          script="${RUNNER_TEMP}/review_status_comment.sh"
          [[ -f "$script" ]] || { echo "::warning::Status script missing; not updating the status comment."; exit 0; }
          if [[ "$OVERSIZED" == "true" ]]; then state=skipped
          elif [[ "$JOB_STATUS" == "success" ]]; then state=success
          elif [[ "$JOB_STATUS" == "cancelled" ]]; then state=cancelled
          else state=failure
          fi
          bash "$script" "$state"

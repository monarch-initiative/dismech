name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (for fork PRs where OIDC fails)'
        required: true
        type: number

concurrency:
  group: claude-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: >-
      ${{
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          github.event.comment.body == '/review' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Resolve agent config
        uses: ./.github/actions/resolve-agent-config
        with:
          workflow: claude-code-review

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false   # keep python/uv/etc
          docker-images: true

      - name: Checkout PR branch (for manual review triggers)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout ${{ env.PR_NUMBER }}

      - name: Generate ai4c-reviewer token
        id: reviewer-token
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.AI4C_REVIEWER_APP_ID }}
          private-key: ${{ secrets.AI4C_REVIEWER_PRIVATE_KEY }}

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.129
          "$HOME/.local/bin/claude" --version

      # The review agent's allowedTools grant `Bash(just:*)` and `Bash(uv run:*)`
      # so it can run the deterministic validators (just qc / validate-references /
      # validate-terms). Those binaries are not on standard runners, so set
      # them up here — mirrors the setup in main.yaml.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install just
        run: uv tool install rust-just

      - name: Install project
        run: uv sync --dev --group export

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # Auth precedence: ANTHROPIC_API_KEY (pay-per-use) wins when it is set —
          # it has no weekly subscription cap, so it keeps reviews running when the
          # shared OAuth account is exhausted. CLAUDE_CODE_OAUTH_TOKEN (Claude
          # subscription) is the fallback used only when no API key is configured.
          # The conditional keeps exactly one of the two non-empty so there is no
          # precedence ambiguity inside the action.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ steps.reviewer-token.outputs.token || github.token }}
          path_to_claude_code_executable: /home/runner/.local/bin/claude
          track_progress: ${{ github.event_name == 'pull_request' }}
          allowed_bots: 'claude,github-actions,ai4c-agent'
          claude_args: |
            --model ${{ env.AGENT_MODEL }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api:*),Bash(cat:*),Bash(grep:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(find:*),Bash(ls:*),Bash(just:*),Bash(uv run:*)"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Review this pull request using the dismech-pr-review skill.

            Focus on:
            - Biological and clinical validity
            - Ontology term accuracy and specificity
            - Evidence quality (PMIDs real, snippets are exact quotes, evidence_source correct)
            - Schema conformance and completeness
            - Adherence to dismech conventions (see CLAUDE.md and skills)

            Be constructive and specific. For each issue found, indicate severity:
            - 🔴 CRITICAL: Must fix (wrong data, hallucinated PMIDs, broken validation)
            - 🟡 IMPORTANT: Should fix (ontology mismatches, evidence_source errors, missing fields)
            - 🔵 SUGGESTION: Nice to have (style, additional phenotypes, deeper coverage)

            After reviewing, set the GitHub PR review status:

            **If there are any 🔴 CRITICAL or 🟡 IMPORTANT issues:**
            Submit a REQUEST_CHANGES review:
            ```
            gh pr review ${{ env.PR_NUMBER }} --request-changes --body "<your review summary>"
            ```

            **If there are only 🔵 SUGGESTIONs or no issues:**
            Submit an APPROVE review:
            ```
            gh pr review ${{ env.PR_NUMBER }} --approve --body "<your review summary>"
            ```

            Always include a summary checklist at the top of your review:
            - [ ] Schema validation would pass
            - [ ] All PMIDs verified as real
            - [ ] Evidence snippets are exact quotes
            - [ ] Ontology terms correct and specific
            - [ ] evidence_source classifications correct
            - [ ] No pathophysiology bundling (atomic entries only)

      # Hardening: claude-code-action exits 0 even when the agent run itself
      # errored, yielding a zero-cost is_error result and NO posted review —
      # turning a broken review into a phantom green check. Failure modes we
      # have actually hit this way:
      #   * a Claude weekly usage limit on CLAUDE_CODE_OAUTH_TOKEN (rate_limit),
      #     which silently no-ops EVERY agent workflow account-wide;
      #   * an invalid/retired `--model` (agent-config.yaml once pinned a
      #     non-existent claude-opus-4-6); and
      #   * a STALE BASE BRANCH. For `pull_request` events GitHub runs the
      #     workflow file from head merged into the PR's BASE, not from main.
      #     A PR stacked on a long-lived integration branch therefore executes
      #     that branch's copy of this file — so fixing main does nothing for
      #     it. dismech#7655 burned hours on this: the base branch predated the
      #     ANTHROPIC_API_KEY fallback, so the run used the capped subscription
      #     token even though main had already been fixed. Re-running does not
      #     help either; a re-run replays the original workflow file. The fix is
      #     to merge main into the base branch.
      # Inspect the execution log and fail the job when the run errored, sorting
      # the credential failures into distinct branches (subscription cap vs API
      # account out of credit vs max-turns) because their remedies are different
      # and a wrong one sends debugging the wrong way — which is precisely how
      # each of the above stayed hard to diagnose. Loud red X, never a silent pass.
      - name: Verify the review agent actually ran
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -euo pipefail
          file="${EXECUTION_FILE:-}"
          if [[ -z "$file" || ! -f "$file" ]]; then
            file="${RUNNER_TEMP}/claude-execution-output.json"
          fi
          if [[ ! -f "$file" ]]; then
            echo "::error title=Claude review failed::No execution log found; the review agent did not run."
            exit 1
          fi
          python3 - "$file" <<'PY'
          import json, os, sys

          def summary(md):
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a", encoding="utf-8") as fh:
                      fh.write(md + "\n")

          raw = open(sys.argv[1], encoding="utf-8").read().strip()
          try:
              events = json.loads(raw)
              if not isinstance(events, list):
                  events = [events]
          except json.JSONDecodeError:
              events = [json.loads(line) for line in raw.splitlines() if line.strip()]

          results = [e for e in events if isinstance(e, dict) and e.get("type") == "result"]
          if not results:
              print("::error title=Claude review failed::No result event in the execution "
                    "log; the agent did not complete.")
              summary("### ❌ Claude review failed\nNo result event — the agent did not complete.")
              sys.exit(1)

          r = results[-1]
          stats = (f"num_turns={r.get('num_turns')} cost=${r.get('total_cost_usd')} "
                   f"subtype={r.get('subtype')}")

          if not r.get("is_error"):
              print(f"Claude review completed cleanly: {stats}")
              sys.exit(0)

          reason = str(r.get("error") or "").strip()
          detail = str(r.get("result") or "").strip()
          haystack = f"{reason} {detail}".lower()

          def fail(title, heading, body):
              print(f"::error title={title}::{body}")
              summary(f"### {heading}\n\n{body}")
              sys.exit(1)

          # Ordered most-specific first. Every branch must state a remedy that is
          # correct for ITS credential path — a confidently-wrong remedy is the
          # failure this whole block exists to prevent.

          # (a) Budget exhaustion is a workflow bug, not a quota problem. Checked
          # before the quota markers because "turn limit reached" would otherwise
          # match LIMIT_MARKERS and send the reader off to check billing.
          if r.get("subtype") == "error_max_turns":
              fail("Claude review errored: max turns",
                   "❌ Claude review ran out of turns",
                   f"The agent hit its max-turn budget before posting a review. {stats} "
                   f"detail={detail!r}. This is a workflow-budget problem, NOT a credential "
                   "problem: raise --max-turns or narrow the review prompt.")

          # (b) Billing failures come from the API-KEY path — the account behind
          # ANTHROPIC_API_KEY is out of credit. That is the opposite of a
          # subscription cap and has the opposite remedy, so it gets its own branch.
          BILLING_MARKERS = ("out of credit", "credit balance", "insufficient quota",
                             "billing", "payment required")
          if any(m in haystack for m in BILLING_MARKERS):
              fail("Claude review skipped: account credit exhausted",
                   "⛔ Claude review skipped — Anthropic account credit exhausted",
                   f"NO review ran. {stats} detail={detail!r}. This is a BILLING issue on "
                   "the account behind ANTHROPIC_API_KEY — not a subscription cap, and not "
                   "a problem with this PR. Fix: top up credit or check billing on that "
                   "Anthropic account. Re-setting the secret will NOT help; the key works, "
                   "the account is empty.")

          # (c) Subscription cap on the OAuth token. Claude phrases this several
          # ways and the wording has changed over time: matching only "usage limit"
          # /"weekly limit" missed the live message "You've hit your limit - resets
          # 8pm (UTC)", which fell through to the generic branch and blamed
          # --model/a bad token, pointing debugging the wrong way for hours. Match
          # the family. "rate_limit" (underscore) also covers the machine-readable
          # `error` value and any future rate_limit_error.
          LIMIT_MARKERS = ("usage limit", "weekly limit", "hit your limit",
                           "rate limit", "rate_limit", "limit reached")
          if any(m in haystack for m in LIMIT_MARKERS):
              base_check = ("gh api 'repos/{owner}/{repo}/contents/.github/workflows/"
                            "claude-code-review.yml?ref=<base-branch>' --jq .content | "
                            "base64 -d | grep -c anthropic_api_key")
              fail("Claude review skipped: usage limit",
                   "⛔ Claude review skipped — subscription usage limit reached",
                   f"NO review ran. {stats} detail={detail!r}. This is a SUBSCRIPTION quota "
                   "issue on CLAUDE_CODE_OAUTH_TOKEN, not a problem with this PR. This "
                   "workflow prefers ANTHROPIC_API_KEY (pay-per-use, no subscription cap) "
                   "and falls back to the OAuth token only when no API key is set, so "
                   "reaching this means the run used the subscription token. Two ways that "
                   "happens: (1) the ANTHROPIC_API_KEY repo secret is unset; or (2) this PR "
                   "targets a BASE BRANCH whose copy of this workflow predates the API-key "
                   "fallback — for pull_request events GitHub runs the workflow file from "
                   "head merged into BASE, not from main, so a fixed main does not help a "
                   "PR stacked on a stale branch. Authoritative check for (2): " + base_check
                   + " — a count of 0 means the base branch is stale; merge main into it. "
                   "Re-running this job will NOT help in that case: a re-run replays the "
                   "original workflow file.")

          msg = (f"Review agent errored (is_error=true); NO review was posted. "
                 f"error={reason!r} detail={detail!r} {stats}. Common causes: an "
                 "invalid/retired --model, a bad credential, or an aborted run.")
          print(f"::error title=Claude review errored::{msg}")
          summary("### ❌ Claude review errored\n\n" + msg)
          sys.exit(1)
          PY

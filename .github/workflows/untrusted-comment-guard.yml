name: Untrusted Comment Guard

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  guard-comment:
    # Skip comments by GitHub App bots before a runner is assigned (#17150).
    # The trust gate already trusts every login ending in `[bot]`
    # (isBotLogin in .github/scripts/github-trust-gate.js), so for these the job
    # could only ever log "trusted" and exit. Bot comments, mostly automated
    # reviews, were 96 of the 100 most recent runs of this workflow.
    #
    # Deliberately not author_association (OWNER/MEMBER/COLLABORATOR): that is
    # broader than the gate, which requires triage/write/maintain/admin
    # permission. A read-only collaborator or org member would be skipped by it
    # but is untrusted by the gate.
    if: ${{ !endsWith(github.event.comment.user.login, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # Only .github/ is read (github-trust-gate.js, agent-mention.js and
          # ai-controllers.json). This job runs on every comment. Before this
          # checkout was made sparse, a full checkout took ~3.7 min per run
          # against <1 s of work (#17150).
          sparse-checkout: .github

      - name: Minimize risky untrusted comment
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const trustGate = require('./.github/scripts/github-trust-gate.js');

            const comment = context.payload.comment || {};
            const login = comment.user?.login || comment.author?.login || '';
            const [owner, repo] = [context.repo.owner, context.repo.repo];

            if (!comment.node_id) {
              core.info('Comment does not expose a GraphQL node_id; skipping moderation.');
              return;
            }

            const trusted = await trustGate.isTrustedLogin({
              github,
              owner,
              repo,
              login,
              controllers: trustGate.loadControllers(),
            });

            if (trusted) {
              core.info(`Comment author ${login || '<unknown>'} is trusted; leaving comment visible.`);
              return;
            }

            const risk = trustGate.classifyCommentRisk(comment.body || '');
            if (!risk.shouldMinimize) {
              core.info(
                `Comment author ${login || '<unknown>'} is untrusted, but no risky attachment or agent-trigger pattern was detected.`,
              );
              return;
            }

            core.warning(
              `Minimizing untrusted comment ${comment.html_url || comment.node_id}; reasons: ${risk.reasons.join(', ')}`,
            );
            await trustGate.minimizeComment({
              github,
              subjectId: comment.node_id,
              classifier: risk.classifier,
            });

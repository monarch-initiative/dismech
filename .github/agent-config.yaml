# Central runtime configuration for the agentic AI GitHub Actions.
#
# This is the single source of truth for which Claude model backs each agent
# workflow. Single-model workflows use `.github/actions/resolve-agent-config`
# to export `AGENT_MODEL`; curation-scanner calls the resolver in --matrix mode
# and passes each row's model directly to Claude Code. See docs/agent-config.md.
#
# Single-model resolution order (highest priority first):
#   1. an explicit per-run override (a workflow_dispatch `model:` input, passed
#      to the action as `model-override`),
#   2. the per-workflow `model:` below,
#   3. `default_model`.
# Matrix rows each require their own model: no fallback or per-run override.
#
# Keys under `workflows:` are the workflow file stem under .github/workflows/.
# Follow the latest model in each family via Claude Code's aliases. Release
# upgrades need no config edits; exact model IDs are for temporary rollbacks.
# All managed workflows install the latest CLI with setup-claude-code so alias
# mappings are not held back by the upstream action's bundled SDK.
# Changing default_model alone affects none of the current workflows: all have
# explicit models (including matrix rows).
#
# Scope note: this centralises the *AI model* for the agentic workflows only.
# Cron cadence stays in `.github/cron-profiles.yaml` (GitHub can't parameterise
# `schedule:` at run time); per-workflow enable/disable is a planned follow-up
# (issue #5218). `provider` is reserved for a future provider abstraction and is
# not yet consumed.

default_model: opus
provider: anthropic

workflows:
  # curation-scanner fans out across effort tiers in parallel, each tier bound to
  # a model and a GitHub label selector. The resolver's --matrix mode emits this
  # list, and curation-scanner's setup job feeds it to `strategy.matrix.include`.
  curation-scanner:
    matrix:
      - effort: low_effort
        model: haiku
        selector: "label:curation label:low_effort"
      - effort: medium_effort
        model: sonnet
        selector: "label:curation label:medium_effort -label:low_effort"
      - effort: high_effort
        model: opus
        selector: "label:curation -label:low_effort -label:medium_effort"

  discussion-scanner:
    model: sonnet

  claude-dedupe-issues:
    model: sonnet

  knowledge-gap-scan:
    model: haiku

  literature-scan:
    model: haiku

  preprint-scan:
    model: haiku

  post-review-agent:
    model: opus

  pr-shepherd:
    model: opus

  weekly-compliance:
    model: opus

  claude-code-review:
    model: opus

  # The interactive @claude mention responder (claude.yml).
  claude:
    model: opus

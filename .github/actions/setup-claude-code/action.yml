name: Set up Claude Code
description: Install the latest Claude Code independently of the workflow action's bundled SDK.

inputs:
  version:
    description: Release channel or exact version; change the default here for a temporary runtime rollback.
    required: false
    default: latest

outputs:
  executable:
    description: Absolute path to the installed Claude Code executable.
    value: ${{ steps.install.outputs.executable }}

runs:
  using: composite
  steps:
    - name: Install Claude Code
      id: install
      shell: bash
      env:
        CLAUDE_INSTALL_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 https://claude.ai/install.sh | bash -s -- "$CLAUDE_INSTALL_VERSION"
        executable="$HOME/.local/bin/claude"
        version="$("$executable" --version)"
        echo "executable=$executable" >> "$GITHUB_OUTPUT"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$version"
        printf 'Claude Code runtime: `%s` (requested `%s`)\n\n' \
          "$version" "$CLAUDE_INSTALL_VERSION" >> "$GITHUB_STEP_SUMMARY"

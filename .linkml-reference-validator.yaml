validation:
  cache_dir: references_cache
  # Default-discovery invocations must fail on unverified references too.
  # Keep this aligned with conf/reference_validator_config.yaml (#7514).
  unknown_prefix_severity: ERROR
  skip_prefixes:
    - SRA
    - MGNIFY
    - BIOPROJECT
    - GTEX
    - CELLXGENE
    - MORPHIC

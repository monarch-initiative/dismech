# Ontologies a deep-research report is asked to cite terms from, and how each
# is looked up when the report is checked. Passed to deep-research-client as
# --ontology-config (see `dr_term_validation` in project.justfile).
#
# The config does two things: it appends a section to the research prompt
# asking for `PREFIX:ID (term label)` CURIEs from these ontologies only, and it
# limits term validation to them. A CURIE from any other ontology is reported
# as NOT_CONFIGURED ("not asked to use"), without a lookup.
#
# An empty value uses the default adapter (ols:). "" names the prefix in the
# prompt without checking it, so its CURIEs are reported as unverifiable. HGNC
# is listed that way because gene CURIEs resolve unreliably through both OLS
# and sqlite:obo (see the dr_term_validation comment in project.justfile).
#
# Disease databases (OMIM, ORPHA, MedGen, ...) are deliberately left out: DRC
# neither asks for them nor looks them up. Identifiers a report cites from them
# are listed as off-list, which is informational, not a confabulation.
ontology_adapters:
  MONDO:
  HP:
  GO:
  CL:
  UBERON:
  CHEBI:
  NCIT:
  NCBITaxon:
  HGNC: ""

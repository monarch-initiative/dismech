# QC Configuration for dismech knowledge base compliance analysis
#
# This file configures weights and minimum thresholds for the compliance analyzer.
# Weights affect the weighted_compliance score (higher weight = more important).
# Thresholds trigger violations if compliance falls below the minimum.
#
# Precedence (highest to lowest):
#   1. Path-specific config (exact match on normalized path + slot)
#   2. Slot-specific config
#   3. Default values

# Default weight for all paths/slots not otherwise configured
default_weight: 1.0

# Default minimum compliance (null = no minimum required)
default_min_compliance: null

# Per-slot configuration (applies to all occurrences of a slot)
slots:
  term:
    weight: 2.0  # Ontology term bindings are important
    min_compliance: 80.0  # Require at least 80% term coverage
  evidence:
    weight: 1.5  # Evidence is valuable but not always required
    min_compliance: null
  description:
    weight: 0.5  # Descriptions are nice-to-have

# Per-path configuration (overrides slot config for specific paths)
# Use jq-style [] notation for list paths
paths:
  # Phenotype terms are critical - most phenotypes should have HPO terms
  "phenotypes[].phenotype_term.term":
    weight: 3.0
    min_compliance: 90.0

  # Cell type terms in pathophysiology are very important
  "pathophysiology[].cell_types[].term":
    weight: 3.0
    min_compliance: 85.0

  # Treatment terms are important for clinical relevance
  "treatments[].treatment_term.term":
    weight: 2.5
    min_compliance: 80.0

  # Disease term at root should always be present
  "disease_term.term":
    weight: 5.0
    min_compliance: 95.0

  # Pathophysiology descriptions are valuable
  "pathophysiology[].description":
    weight: 1.5
    min_compliance: 70.0

  # Pathophysiology evidence is critical
  "pathophysiology[].evidence":
    weight: 2.0
    min_compliance: 80.0

  # Graph-derived metric (dismech.qc_plugins, not a schema slot): fraction of
  # phenotype nodes actually wired into the causal pathograph -- i.e. reached by
  # at least one causal edge (a pathophysiology `downstream` target or an
  # upstream phenotype `sequela`). Surfaces "floating" phenotypes that score
  # full recommended-slot compliance yet are disconnected in the pathograph.
  #
  # min_compliance is a RATCHET AGAINST EROSION, not a per-PR gate, and the
  # distinction matters for reading a failure. `just compliance-connectivity`
  # applies this floor to the KB-WIDE AGGREGATE (every phenotype node in
  # kb/disorders/ pooled), not per file, so no single entry can trip it: at
  # 33k nodes, 100 new entries with every phenotype disconnected move the
  # aggregate by only ~1.5 points. What it catches is sustained drift -- entries
  # being added faster than they are wired up, over months.
  #
  # Set at 50.0 against a measured 52.4% (17354/33138) when the floor was first
  # turned on, so there is ~2.4 points of headroom, about 155 fully disconnected
  # new entries. That margin is deliberate: a tighter floor would go red on
  # ordinary curation batches that have nothing to do with connectivity, which
  # is the failure mode that makes a gate get disabled rather than fixed. Raise
  # it as the corpus improves -- it is meant to move up, never down.
  #
  # The per-entry signal this CANNOT give you is `just compliance-connectivity
  # --list-unconnected`, which names the floating phenotypes file by file, and
  # `just check-causal-targets`, which is the hard per-entry gate for the
  # adjacent defect (a target naming nothing).
  "phenotypes[].causal_inlink":
    weight: 1.5
    min_compliance: 50.0

  # Graph-derived metric (dismech.qc_plugins, not a schema slot): source-side
  # complement of causal_inlink. Fraction of mechanism-relevant top-level
  # `genetic` nodes wired into the pathograph -- i.e. `contributes_to` a
  # pathophysiology node via a shared `gene`/`genes` descriptor. Surfaces
  # Mendelian/causal genes that sit in the `genetic` block but never connect to
  # the mechanism graph. BIOMARKER/PROTECTIVE/MODIFIER/DISPUTED/UNKNOWN genetic
  # items are excluded from the denominator (not expected to explain mechanism).
  # min_compliance is intentionally null for now: advisory, contributes to
  # weighted scoring without gating CI while KB-wide baseline coverage is low.
  "genetic[].mechanism_outlink":
    weight: 1.5
    min_compliance: null

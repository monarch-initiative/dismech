# Hand-written matching rules for the twelve Key Events of the parkinsonian AOPs
# (AOP-Wiki AOPs 3, 587, 588, 589 and 593), for scripts/aop_dismech_crosswalk.py.
#
# Transcribed from RULES and the special cases in match_key_event and crosswalk in
# scripts/aop_parkinsonism_crosswalk.py, the script behind
# docs/reports/aop-parkinsonism-crosswalk-2026-10-25.md. With these rules the
# general script matches the same nodes, on the same bases, as that script does;
# tests/test_aop_dismech_crosswalk.py checks it.
#
# A Key Event listed here is matched by its rules only, not automatically.
# Fields, all optional, applied in this order:
#   conforms_to_prefixes  a node conforming to a ref starting with one of these.
#                         A prefix ending in "#" admits the whole module only when
#                         the conformed node's own name fits name_pattern.
#   go_ids                GO ids bound in biological_processes or molecular_functions.
#   conditions            each a label plus requirements that must all hold:
#                         cell_types_any, locations_any, processes_any (term ids),
#                         name_pattern, description_pattern (regexes, lowercase text).
#                         only_if_unmatched: true applies one only when nothing else did.
#   name_pattern          a regex against the node's lowercased name.
#   phenotypes            term_ids and a label: entry phenotypes binding one match.
key_events:
  "888":
    name_pattern: '(complex i\b|nadh[:\- ]ubiquinone).*(inhibitor|binding)|rotenone|mpp\+|mptp'
  "887":
    conforms_to_prefixes:
    - "complex_i_deficiency#"
    - "parkinsonism_dopaminergic_degeneration#Mitochondrial Complex I"
    go_ids: [GO:0006120, GO:0008137, GO:0032981]
    name_pattern: 'complex i\b|nadh[:\- ]ubiquinone'
  "1542":
    go_ids: [GO:0006122, GO:0008121, GO:0034551]
    name_pattern: 'complex iii\b|cytochrome bc1|antimycin'
  "2118":
    go_ids: [GO:0000104, GO:0006121, GO:0008177]
    name_pattern: 'complex ii\b|succinate dehydrogenase|\bsdh'
  "1543":
    conforms_to_prefixes:
    - "complex_iv_assembly_deficiency#"
    go_ids: [GO:0004129, GO:0006123, GO:0033617]
    # not COX-2 (cyclooxygenase)
    name_pattern: 'complex iv\b|cytochrome c oxidase|\bcox\b(?!-?2)'
  "2362":
    name_pattern: 'redox[- ]cycl|paraquat'
  "2363":
    conforms_to_prefixes:
    - "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
    - "xenobiotic_oxidative_phosphorylation_blockade#Secondary Mitochondrial Oxidative Stress"
    - "parkinsonism_dopaminergic_degeneration#Mitochondrial Complex I Inhibition and Oxidative Stress"
    name_pattern: 'mitochondrial (ros|reactive oxygen|oxidative|superoxide)'
    conditions:
    - label: "oxidative-stress GO + mitochondrial description"
      only_if_unmatched: true
      processes_any: [GO:0006979, GO:0072593, GO:1903409, GO:0000302]
      description_pattern: 'mitochondri'
      name_pattern: 'oxidat|reactive oxygen|\bros\b|free radical|redox'
  "177":
    conforms_to_prefixes:
    - "mitochondrial_dysfunction#"
    - "complex_i_deficiency#Impaired"
    - "complex_iv_assembly_deficiency#Impaired"
    - "xenobiotic_oxidative_phosphorylation_blockade#Cellular ATP Depletion"
    - "parkinsonism_dopaminergic_degeneration#Mitochondrial Complex I"
    go_ids: [GO:0007005, GO:0006119, GO:0042775, GO:0009060, GO:0022900]
    name_pattern: 'mitochondri|oxidative phosphorylation|respiratory chain'
  "889":
    conforms_to_prefixes:
    - "loss_of_proteostasis#"
    - "disabled_macroautophagy#"
    - "polyglutamine_expansion_proteotoxicity#"
    - "parkinsonism_dopaminergic_degeneration#Alpha-Synuclein"
    go_ids:
    - GO:0006457
    - GO:0043161
    - GO:0070841
    - GO:0006914
    - GO:0016236
    - GO:0061684
    - GO:0030968
    - GO:0034976
    - GO:0000422
    - GO:0006511
    - GO:0061077
    name_pattern: 'aggregat|proteostas|proteasom|inclusion|misfold|autophag|lewy|unfolded protein|er stress|endoplasmic reticulum stress|mitophag|proteotox|protein clearance'
  "188":
    conforms_to_prefixes:
    - "neuroinflammation_glial_activation#"
    go_ids: [GO:0150076, GO:0001774, GO:0048143]
    name_pattern: 'neuroinflam|microgli|astrogli|astrocytosis|gliosis|glial activation|brain inflammation'
    conditions:
    - label: "glial cell type + inflammation in name"
      cell_types_any: [CL:0000129, CL:0000127]
      name_pattern: 'inflam|activat|reactiv|cytokine'
  "890":
    conforms_to_prefixes:
    - "parkinsonism_dopaminergic_degeneration#Nigrostriatal"
    name_pattern: '(dopaminergic|nigr|substantia nigra).*(loss|degenerat|death|depigment|neurodegenerat)|(loss|degenerat|death).*(dopaminergic|nigr)|striatonigral'
    conditions:
    - label: "CL:0000700 + UBERON:0002038"
      cell_types_any: [CL:0000700]
      locations_any: [UBERON:0002038]
      name_pattern: 'loss|degenerat|death'
  "896":
    # Parkinsonism and the cardinal motor signs, matched on the entry's phenotypes.
    phenotypes:
      label: "parkinsonian HPO phenotype"
      term_ids:
      - HP:0001300
      - HP:0002548
      - HP:0002067
      - HP:0002063
      - HP:0002396
      - HP:0007076
      - HP:0007158
      - HP:0002322
      - HP:0025387
      - HP:0002172

# Perturbation config for the minimal HPT (hypothalamic-pituitary-thyroid)
# feedback model (models/hpt_feedback_axis.ant -> .xml), wired to
# Congenital_Hypothyroidism.
#
# Two ODEs: TSH (mU/L) and free T4 (pmol/L). Euthyroid steady state ~TSH 1.5,
# FT4 15. The disease-severity dial (`gfr_parameter`) is thyroid secretory
# capacity S_thy (1.0 = normal); reducing it models thyroid dysgenesis /
# dyshormonogenesis. Levothyroxine is the exogenous, TSH-independent T4 source
# LT4 (tiny nonzero baseline so the multiplicative treatment scenarios can raise
# it). Central hypothyroidism reduces pituitary capacity P_pit.

model_id: hpt_feedback_axis
sbml_file: hpt_feedback_axis.xml

# Congenital-hypothyroidism genes mapped to thyroid secretory capacity S_thy.
# Multipliers are calibrated to the model, not to clinical effect sizes.
gene_effects:
  TPO:
    parameter: S_thy
    LoF: 0.1
    description: >-
      Thyroid peroxidase catalyzes iodide organification and coupling; biallelic
      loss causes dyshormonogenetic congenital hypothyroidism with goiter.
      Modeled as reduced thyroid secretory capacity S_thy.
  TG:
    parameter: S_thy
    LoF: 0.1
    description: >-
      Thyroglobulin is the scaffold for thyroid hormone synthesis; loss-of-
      function causes dyshormonogenesis. Modeled as reduced S_thy.
  DUOX2:
    parameter: S_thy
    LoF: 0.15
    description: >-
      DUOX2 generates the H2O2 required for organification; loss-of-function
      causes (often transient) dyshormonogenetic hypothyroidism. Modeled as
      reduced S_thy.
  SLC5A5:
    parameter: S_thy
    LoF: 0.1
    description: >-
      SLC5A5 (NIS) is the sodium-iodide symporter; loss-of-function causes an
      iodide-transport defect. Modeled as reduced S_thy.
  TSHR:
    parameter: S_thy
    LoF: 0.15
    description: >-
      TSH receptor loss-of-function causes TSH resistance / thyroid hypoplasia,
      so the gland cannot respond to TSH drive. Modeled as reduced S_thy.
  PAX8:
    parameter: S_thy
    LoF: 0.05
    description: >-
      PAX8 is a thyroid-development transcription factor; loss-of-function causes
      thyroid dysgenesis (hypoplasia/agenesis). Modeled as severely reduced S_thy.
  NKX2-1:
    parameter: S_thy
    LoF: 0.05
    description: >-
      NKX2-1 (TTF-1) governs thyroid (and lung/brain) development; loss-of-
      function causes thyroid dysgenesis. Modeled as severely reduced S_thy.
  FOXE1:
    parameter: S_thy
    LoF: 0.05
    description: >-
      FOXE1 (TTF-2) is required for thyroid migration; loss-of-function causes
      thyroid agenesis (Bamforth-Lazarus). Modeled as severely reduced S_thy.

# Scenarios. `gfr` sets thyroid secretory capacity S_thy absolutely (1.0 =
# normal); param_overrides are multiplicative. Levothyroxine scenarios pair a
# diseased S_thy with a raised LT4.
scenarios:
  # --- disease drivers ---
  subclinical_hypothyroidism:
    label: "Subclinical primary hypothyroidism (S_thy=0.3)"
    gfr: 0.3
    causal_root: Defective Thyroid Hormone Biosynthesis
  overt_hypothyroidism:
    label: "Overt primary hypothyroidism (S_thy=0.1)"
    gfr: 0.1
    causal_root: Defective Thyroid Hormone Biosynthesis
  athyreosis:
    label: "Athyreosis / severe hypothyroidism (S_thy=0.03)"
    gfr: 0.03
    causal_root: Thyroid Gland Dysgenesis
  central_hypothyroidism:
    label: "Central (pituitary) hypothyroidism (P_pit low)"
    gfr: 1.0
    param_overrides:
      P_pit: 0.15
    causal_root: Impaired Hypothalamic-Pituitary TSH Drive
  TPO_LoF:
    label: "TPO loss-of-function (dyshormonogenesis)"
    gene: TPO
    effect: LoF
    gfr: 1.0
    causal_root: Defective Thyroid Hormone Biosynthesis
  TG_LoF:
    label: "TG loss-of-function (dyshormonogenesis)"
    gene: TG
    effect: LoF
    gfr: 1.0
    causal_root: Defective Thyroid Hormone Biosynthesis
  DUOX2_LoF:
    label: "DUOX2 loss-of-function (dyshormonogenesis)"
    gene: DUOX2
    effect: LoF
    gfr: 1.0
    causal_root: Defective Thyroid Hormone Biosynthesis
  SLC5A5_LoF:
    label: "SLC5A5/NIS loss-of-function (iodide transport defect)"
    gene: SLC5A5
    effect: LoF
    gfr: 1.0
    causal_root: Defective Thyroid Hormone Biosynthesis
  TSHR_LoF:
    label: "TSHR loss-of-function (TSH resistance)"
    gene: TSHR
    effect: LoF
    gfr: 1.0
    causal_root: Thyroid Gland Dysgenesis
  PAX8_LoF:
    label: "PAX8 loss-of-function (thyroid dysgenesis)"
    gene: PAX8
    effect: LoF
    gfr: 1.0
    causal_root: Thyroid Gland Dysgenesis
  NKX2-1_LoF:
    label: "NKX2-1 loss-of-function (thyroid dysgenesis)"
    gene: NKX2-1
    effect: LoF
    gfr: 1.0
    causal_root: Thyroid Gland Dysgenesis
  FOXE1_LoF:
    label: "FOXE1 loss-of-function (thyroid agenesis)"
    gene: FOXE1
    effect: LoF
    gfr: 1.0
    causal_root: Thyroid Gland Dysgenesis

  # --- treatment (diseased S_thy + levothyroxine) ---
  levothyroxine_underdosed:
    label: "Levothyroxine, under-dosed (residual hypothyroidism)"
    gfr: 0.03
    param_overrides:
      LT4: 50.0
    causal_root: Defective Thyroid Hormone Biosynthesis
  levothyroxine_full_replacement:
    label: "Levothyroxine, full replacement (euthyroid restored)"
    gfr: 0.03
    param_overrides:
      LT4: 70.0
    causal_root: Defective Thyroid Hormone Biosynthesis
  levothyroxine_over_replacement:
    label: "Levothyroxine, over-replacement (iatrogenic thyrotoxicosis)"
    gfr: 0.03
    param_overrides:
      LT4: 120.0
    causal_root: Defective Thyroid Hormone Biosynthesis

# Coupling / simulation plumbing. No extension model; the model is not stiff so
# the default tolerances are fine. The disease-severity dial is S_thy.
coupling:
  dt_hours: 50
  duration_hours: 2000
  gfr_parameter: S_thy
  baseline_gfr: 1.0

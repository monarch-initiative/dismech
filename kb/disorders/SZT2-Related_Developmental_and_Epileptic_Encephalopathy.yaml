      notes: >-
        Median seizure onset five months in biallelic null genotypes, twelve months
        with one null allele, and thirty-six months in biallelic non-null genotypes,
        so onset spans infancy into early childhood by genotype.
  evidence:
  - reference: PMID:37213690
    reference_title: "SZT2 variants associated with partial epilepsy or epileptic encephalopathy and the genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with biallelic null mutations presented significantly higher frequency of refractory seizures and earlier onset age of seizure than those with biallelic non-null mutations"
    explanation: >-

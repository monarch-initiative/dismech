name: SZT2-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
synonyms:
- DEE18
- EIEE18
- epileptic encephalopathy, early infantile, 18
- SZT2-related epileptic encephalopathy
- developmental and epileptic encephalopathy 18
description: >-
  SZT2-related developmental and epileptic encephalopathy (DEE18) is a rare
  autosomal recessive neurodevelopmental disorder caused by biallelic
  loss-of-function variants in SZT2, which encodes the largest subunit of the
  KICSTOR complex (KPTN, ITFG2, C12orf66, SZT2). KICSTOR tethers GATOR1 to the
  lysosomal surface, and it is that tether which allows amino-acid deprivation to
  switch mTORC1 off. Losing SZT2 therefore leaves mTORC1 constitutively
  lysosome-bound and active regardless of nutrient status, placing DEE18 among
  the genetic mTORopathies alongside TSC1/TSC2, DEPDC5, and NPRL2/NPRL3. The core
  clinical picture is early-onset, frequently drug-resistant epilepsy with global
  developmental delay and macrocephaly, characteristically accompanied by a thick
  and short corpus callosum with a persistent cavum septum pellucidum; cortical
  dysplasia, periventricular nodular heterotopia, and in some individuals a
  progressive loss of central myelination are also reported. Severity tracks
  residual SZT2 function: biallelic null genotypes give the severe early-onset
  encephalopathy, whereas biallelic missense genotypes can produce mild partial
  epilepsy with favourable outcome or, in a few individuals, no seizures at all.
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 18
  term:
    id: MONDO:0014201
    label: developmental and epileptic encephalopathy, 18
parents:
- Neurodevelopmental Disorder
- Genetic Disease

inheritance:
- name: Autosomal recessive
  description: >-
    DEE18 requires two pathogenic SZT2 alleles. Both homozygous genotypes, more
    common in consanguineous families, and compound heterozygous genotypes are
    reported.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:23932106
    reference_title: "Biallelic SZT2 mutations cause infantile encephalopathy with epilepsy and dysmorphic corpus callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations in SZT2 cause a severe type of autosomal-recessive infantile encephalopathy with intractable seizures and distinct neuroradiological anomalies"
    explanation: >-
      The founding report states the recessive mode of inheritance.

pathophysiology:
- name: Biallelic SZT2 Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    Two pathogenic SZT2 alleles are present. Most reported alleles are truncating -
    nonsense, frameshift, or canonical splice-site - and are predicted to trigger
    nonsense-mediated decay or premature protein truncation; missense alleles that
    retain partial function are also reported. This node records the genomic lesion
    only.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:23932106
    reference_title: "Biallelic SZT2 mutations cause infantile encephalopathy with epilepsy and dysmorphic corpus callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole-exome sequencing, we identified biallelic mutations in seizure threshold 2 (SZT2) in both affected children."
    explanation: >-
      Establishes biallelic SZT2 variants as the causal lesion.
  - reference: PMID:23932106
    reference_title: "Biallelic SZT2 mutations cause infantile encephalopathy with epilepsy and dysmorphic corpus callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all three mutations are predicted to result in nonsense-mediated mRNA decay and/or premature protein truncation and thereby loss of SZT2 function"
    explanation: >-
      Characterizes the variant class as loss of function.
  downstream:
  - target: Loss of Functional SZT2 Protein
    causal_link_type: DIRECT
    description: >-
      Truncation or transcript decay removes the SZT2 scaffold protein.

- name: Loss of Functional SZT2 Protein
  biological_scale: MOLECULAR
  description: >-
    The ~380 kDa SZT2 scaffold protein is absent or reduced. SZT2 has no
    enzymatic activity and no strong homology to other proteins; its role is purely
    structural, which is why loss of the protein and loss of the complex are
    distinct steps.
  evidence:
  - reference: PMID:28199306
    reference_title: "KICSTOR recruits GATOR1 to the lysosome and is necessary for nutrients to regulate mTORC1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "four proteins of unknown function encoded by the KPTN, ITFG2, C12orf66, and SZT2 genes and of predicted molecular weights of 48, 49, 50, and 380 kDa, respectively"
    explanation: >-
      Identifies SZT2 as the 380 kDa component of the complex.
  downstream:
  - target: Disassembly of the KICSTOR Complex
    causal_link_type: DIRECT
    description: >-
      SZT2 is the subunit that links the other three components together, so its
      loss dissolves the complex.

- name: Disassembly of the KICSTOR Complex
  biological_scale: MOLECULAR
  description: >-
    Without SZT2 the KPTN-ITFG2 heterodimer and C12orf66 no longer assemble into the
    high-molecular-weight KICSTOR complex. This is a complex-integrity failure,
    upstream of and separable from where GATOR1 ends up in the cell.
  evidence:
  - reference: PMID:28199306
    reference_title: "KICSTOR recruits GATOR1 to the lysosome and is necessary for nutrients to regulate mTORC1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "these results suggest that the four KICSTOR proteins form a large complex in which SZT2 serves as the link between the other three"
    explanation: >-
      Establishes SZT2 as the structural linchpin of the complex.
  downstream:
  - target: Failure of GATOR1 Recruitment to the Lysosomal Surface
    causal_link_type: DIRECT
    description: >-
      The complex's function is to bring GATOR1 to the lysosome, so its disassembly
      leaves GATOR1 mislocalized.

- name: Failure of GATOR1 Recruitment to the Lysosomal Surface
  biological_scale: MOLECULAR
  description: >-
    GATOR1, the GTPase-activating protein for RagA, is no longer brought to the
    lysosomal membrane and cannot reach its Rag GTPase substrates. This is a
    localization failure, distinct from the downstream signalling consequence.
  cellular_components:
  - preferred_term: lysosomal membrane
    term:
      id: GO:0005765
      label: lysosomal membrane
  evidence:
  - reference: PMID:28199306
    reference_title: "KICSTOR recruits GATOR1 to the lysosome and is necessary for nutrients to regulate mTORC1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "KICSTOR localizes to lysosomes; binds and recruits GATOR1, but not GATOR2, to the lysosomal surface; and is necessary for the interaction of GATOR1 with its substrates, the Rag GTPases"
    explanation: >-
      Establishes the recruitment function that is lost.
  downstream:
  - target: Loss of Amino-Acid-Sensitive mTORC1 Repression
    causal_link_type: DIRECT
    description: >-
      GATOR1 away from the lysosome cannot act on the Rag GTPases that control
      mTORC1 recruitment.

- name: Loss of Amino-Acid-Sensitive mTORC1 Repression
  biological_scale: MOLECULAR
  description: >-
    The nutrient-sensing arm that normally switches mTORC1 off during amino-acid or
    glucose deprivation is broken. This is the loss of a regulatory input; whether
    mTORC1 is in fact hyperactive is measured separately.
  biological_processes:
  - preferred_term: negative regulation of TORC1 signaling
    term:
      id: GO:1904262
      label: negative regulation of TORC1 signaling
    modifier: DECREASED
  - preferred_term: cellular response to amino acid starvation
    term:
      id: GO:0034198
      label: cellular response to amino acid starvation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28199306
    reference_title: "KICSTOR recruits GATOR1 to the lysosome and is necessary for nutrients to regulate mTORC1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "is required for amino acid or glucose deprivation to inhibit mTORC1 in cultured human cells"
    explanation: >-
      Names the specific regulatory input that KICSTOR loss abolishes.
  - reference: PMID:31430354
    reference_title: "Constitutive activation of mTORC1 signaling induced by biallelic loss-of-function mutations in SZT2 underlies a discernible neurodevelopmental disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, patients' LCLs display an excessive response to slight amino acid stimulation."
    explanation: >-
      Shows the sensing arm is disturbed in both directions in patient-derived cells.
  downstream:
  - target: Constitutive mTORC1 Hyperactivation
    causal_link_type: DIRECT
    description: >-
      With the brake removed, mTORC1 stays lysosome-bound and active.

- name: Constitutive mTORC1 Hyperactivation
  biological_scale: MOLECULAR
  description: >-
    mTORC1 remains at the lysosome and signals regardless of nutrient status. In
    patient-derived lymphoblastoid cell lines this is measurable as increased S6
    kinase and S6 phosphorylation under amino-acid starvation and as constitutive
    lysosomal mTOR localization. Note the inversion: the causal SZT2 variant is loss
    of function, but the pathway-level state is gain of function.
  biological_processes:
  - preferred_term: TOR signaling
    term:
      id: GO:0031929
      label: TOR signaling
    modifier: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:31430354
    reference_title: "Constitutive activation of mTORC1 signaling induced by biallelic loss-of-function mutations in SZT2 underlies a discernible neurodevelopmental disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Increased phosphorylation of S6 kinase and S6 was identified in patient-derived cell lines under amino acid-starved condition, suggestive of constitutive hyperactivation of mTORC1 signaling."
    explanation: >-
      Direct biochemical measurement of mTORC1 hyperactivation in patient cells.
  - reference: PMID:31430354
    reference_title: "Constitutive activation of mTORC1 signaling induced by biallelic loss-of-function mutations in SZT2 underlies a discernible neurodevelopmental disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This result was validated by constitutive lysosomal localization of mTOR in patients' LCLs."
    explanation: >-
      Independent localization evidence for the same node.
  - reference: PMID:28199306
    reference_title: "KICSTOR recruits GATOR1 to the lysosome and is necessary for nutrients to regulate mTORC1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice that lack SZT2, mTORC1 signalling is increased in several tissues, including in neurons in the brain."
    explanation: >-
      Confirms the same consequence in neurons in vivo.
  downstream:
  - target: Excess Outer Radial Glial Cell Production
    causal_link_type: DIRECT
    description: >-
      mTORC1 drives amplification of neural stem and progenitor cells in the
      subventricular zone.
  - target: Lowered Intrinsic Seizure Threshold
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Szt2 loss lowers seizure threshold in mice; the steps between mTORC1
      dysregulation and altered excitability are not established.

- name: Excess Outer Radial Glial Cell Production
  biological_scale: CELLULAR
  description: >-
    In SZT2-mutant human brain organoids the subventricular-zone-like layer contains
    significantly more outer radial glial cells than control organoids, with mTORC1
    activity elevated in that same layer. Outer radial glia are far more abundant in
    human than in mouse cortex, so this is a human-specific progenitor population.
  cell_types:
  - preferred_term: outer radial glial cell
    term:
      id: CL:0013000
      label: forebrain radial glial cell
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:41535455
    reference_title: "Brain organoid models of SZT2-related disease reveal an overproduction of outer radial glial cells through mTORC1 activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "found a significantly greater number of outer radial glial cells (oRGCs) in the subventricular zone-like layer (SVZ) of SZT2 mutant (MT) brain organoids compared to control (WT) brain organoids"
    explanation: >-
      Reports the progenitor overproduction directly.
  - reference: PMID:41535455
    reference_title: "Brain organoid models of SZT2-related disease reveal an overproduction of outer radial glial cells through mTORC1 activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SZT2 MT brain organoids showed higher mTORC1 activity in the SVZ, where neural stem/progenitor cells amplify for cortical expansion in response to mTORC1 activity"
    explanation: >-
      Localizes the elevated mTORC1 activity to the same compartment.
  downstream:
  - target: Excess Upper-Layer Cortical Neuron Generation
    causal_link_type: DIRECT
    description: >-
      Upper-layer neurons generally derive from outer radial glia, so more
      progenitors yield more of these neurons.

- name: Excess Upper-Layer Cortical Neuron Generation
  biological_scale: TISSUE
  description: >-
    The number of upper-layer neurons is significantly increased in SZT2-mutant
    organoids. This is a change in neuronal output that follows from, but is not the
    same measurement as, the progenitor expansion.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: cerebral cortex development
    term:
      id: GO:0021987
      label: cerebral cortex development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:41535455
    reference_title: "Brain organoid models of SZT2-related disease reveal an overproduction of outer radial glial cells through mTORC1 activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The number of upper-layer neurons, which generally originate from oRGCs, was also significantly greater in SZT2 MT brain organoids."
    explanation: >-
      Reports the increased upper-layer neuron count.
  downstream:
  - target: Brain Overgrowth and Cortical Malformation
    causal_link_type: DIRECT
    description: >-
      Excess neuronal production expands the cortex and disturbs its architecture.

- name: Brain Overgrowth and Cortical Malformation
  biological_scale: ORGANISM
  description: >-
    Clinically this appears as macrocephaly with structural anomalies - a thick and
    short corpus callosum with persistent cavum septum pellucidum, and in the more
    severely affected, cortical dysplasia and periventricular nodular heterotopia.
  biological_processes:
  - preferred_term: cerebral cortex cell migration
    term:
      id: GO:0021795
      label: cerebral cortex cell migration
    modifier: ABNORMAL
  evidence:
  - reference: PMID:41535455
    reference_title: "Brain organoid models of SZT2-related disease reveal an overproduction of outer radial glial cells through mTORC1 activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data suggest that SZT2 dysfunction may cause macrocephaly through dysregulation of mTORC1 in early neural development."
    explanation: >-
      Connects the organoid finding to the macrocephaly phenotype.
  - reference: PMID:37213690
    reference_title: "SZT2 variants associated with partial epilepsy or epileptic encephalopathy and the genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients with biallelic null mutations presented severe DEE featured by frequent spasms/tonic seizures and diffuse cortical dysplasia/periventricular nodular heterotopia."
    explanation: >-
      Documents the cortical malformations in the severe genotype group.
  downstream:
  - target: Cortical Network Hyperexcitability
    causal_link_type: DIRECT
    description: >-
      Dysplastic and heterotopic cortex is intrinsically epileptogenic.

- name: Lowered Intrinsic Seizure Threshold
  biological_scale: TISSUE
  description: >-
    SZT2 was originally identified as a seizure-threshold modifier in mice, where
    loss of function lowers the threshold for evoked seizures and enhances
    epileptogenesis. This arm is independent of any structural malformation, which
    matters because it predicts epilepsy even where imaging is normal.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:23932106
    reference_title: "Biallelic SZT2 mutations cause infantile encephalopathy with epilepsy and dysmorphic corpus callosum."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Szt2 has been shown to influence seizure threshold and epileptogenesis in mice, consistent with our findings in humans"
    explanation: >-
      States the seizure-threshold role established in mouse genetics.
  - reference: PMID:37213690
    reference_title: "SZT2 variants associated with partial epilepsy or epileptic encephalopathy and the genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice, heterozygous knock-out of Stz2 led to minimal clonic seizures, while the homozygous knock-out causes caused preweaning lethality with incomplete penetrance and maximal tonic hindlimb extension seizures"
    explanation: >-
      Gives the dose-dependent mouse seizure phenotype.
  downstream:
  - target: Cortical Network Hyperexcitability
    causal_link_type: DIRECT
    description: >-
      A lowered threshold makes network-level hyperexcitability more likely.

- name: Cortical Network Hyperexcitability
  biological_scale: TISSUE
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Cortical networks discharge abnormally, with multifocal epileptiform activity on
    EEG. Two independent upstream routes converge here - the structural malformation
    and the intrinsic threshold shift.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:29696782
    reference_title: "Mutations in SZT2 result in early-onset epileptic encephalopathy and leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her electroencephalogram was characterized by multifocal epileptiform discharges."
    explanation: >-
      Documents the multifocal electrographic correlate.
  downstream:
  - target: Drug-Resistant Early-Onset Epilepsy
    causal_link_type: DIRECT
    description: >-
      Sustained hyperexcitability manifests as recurrent, treatment-refractory seizures.

- name: Drug-Resistant Early-Onset Epilepsy
  biological_scale: ORGANISM
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  description: >-
    Seizures begin in the first months to years of life - median five months in
    biallelic null genotypes - and include epileptic spasms, tonic seizures, and
    focal seizures that may evolve to bilateral convulsions. Refractoriness is
    significantly higher in null than in non-null genotypes.
  evidence:
  - reference: PMID:37213690
    reference_title: "SZT2 variants associated with partial epilepsy or epileptic encephalopathy and the genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with biallelic null mutations presented significantly higher frequency of refractory seizures and earlier onset age of seizure than those with biallelic non-null mutations"
    explanation: >-
      Establishes the genotype dependence of refractoriness and onset age.
  - reference: PMID:29696782
    reference_title: "Mutations in SZT2 result in early-onset epileptic encephalopathy and leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her epilepsy was refractory to multiple medications, including lamotrigine, levetiracetam, phenytoin, phenobarbital, topiramate, rufinamide, midazolam, and the ketogenic diet."
    explanation: >-
      Illustrates the breadth of pharmacoresistance in a reported case.
  downstream:
  - target: Developmental Delay and Intellectual Disability
    causal_link_type: DIRECT
    description: >-
      Early, frequent seizures contribute to developmental impairment.

- name: Progressive Loss of Central Myelination
  biological_scale: TISSUE
  description: >-
    In a subset of individuals, serial imaging documents progressive loss of central
    myelination rather than a static hypomyelination. This is a separate,
    non-universal disease arm whose relationship to the mTORC1 defect is not
    established.
  biological_processes:
  - preferred_term: central nervous system myelination
    term:
      id: GO:0022010
      label: central nervous system myelination
    modifier: DECREASED
  evidence:
  - reference: PMID:29696782
    reference_title: "Mutations in SZT2 result in early-onset epileptic encephalopathy and leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serial imaging characterized the novel finding of progressive loss of central myelination."
    explanation: >-
      Documents the progressive myelin loss on serial imaging.
  downstream:
  - target: Developmental Delay and Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      White-matter loss plausibly contributes to the encephalopathy, though the
      contribution has not been quantified.

- name: Developmental Delay and Intellectual Disability
  biological_scale: ORGANISM
  description: >-
    Global developmental delay is the most common presenting feature, with
    intellectual disability ranging from mild to severe in proportion to residual
    SZT2 function. A minority of individuals with biallelic missense genotypes have
    normal neurodevelopment.
  evidence:
  - reference: PMID:37213690
    reference_title: "SZT2 variants associated with partial epilepsy or epileptic encephalopathy and the genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The three patients with biallelic missense variants presented mild partial epilepsy with favorable outcomes."
    explanation: >-
      Shows the milder developmental outcome at the hypomorphic end of the spectrum.
  - reference: PMID:23932106
    reference_title: "Biallelic SZT2 mutations cause infantile encephalopathy with epilepsy and dysmorphic corpus callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a distinctive early-onset epileptic encephalopathy characterized by refractory epilepsy and absent developmental milestones"
    explanation: >-
      Documents the severe developmental phenotype at the null end.

phenotypes:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The causative mutations include a homozygous nonsense mutation and a nonsense mutation together with an exonic splice-site mutation in a compound-heterozygous state."
    explanation: >-
      Reports the causal variant classes.
  - reference: PMID:37213690
    reference_title: "SZT2 variants associated with partial epilepsy or epileptic encephalopathy and the genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SZT2 variants were identified in six unrelated cases with heterogeneous epilepsy, including one de novo null variant and five pairs of biallelic variants."
    explanation: >-
      Independent replication and phenotypic spectrum.


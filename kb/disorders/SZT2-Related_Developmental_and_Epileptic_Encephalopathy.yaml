experimental_models:
- name: SZT2-mutant human cerebral brain organoid
  experimental_model_type: ORGANOID
  description: >-
    CRISPR-edited iPSC-derived cerebral organoids carrying compound heterozygous
    SZT2 exon-3 deletions, compared against isogenic wild-type organoids.
  publication: PMID:41535455
  modeled_mechanisms:
  - target: Excess Outer Radial Glial Cell Production
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Provides the only direct evidence that SZT2 loss expands a human-specific
      cortical progenitor population.
    limitations: >-
      The edited alleles produce in-frame deletions of 28 amino acid residues rather
      than the truncating variants that predominate in patients, so the model tests a
      hypomorphic rather than a null allele; and organoids lack the vasculature,
      microglia, and full laminar maturation of fetal cortex.
    readouts:
    - name: Outer radial glial cell number in the subventricular-zone-like layer
      target: Excess Outer Radial Glial Cell Production
      direction: INCREASED
      interpretation: >-
        SZT2 loss increases the outer radial glial progenitor pool.
      evidence:
      - reference: PMID:41535455
        reference_title: "Brain organoid models of SZT2-related disease reveal an overproduction of outer radial glial cells through mTORC1 activation."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "a significantly greater number of outer radial glial cells (oRGCs) in the subventricular zone-like layer (SVZ) of SZT2 mutant (MT) brain organoids compared to control (WT) brain organoids"
        explanation: >-
          Reports the quantified progenitor count behind this readout.
    evidence:
    - reference: PMID:41535455
      reference_title: "Brain organoid models of SZT2-related disease reveal an overproduction of outer radial glial cells through mTORC1 activation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Brain organoids derived from induced pluripotent stem cells (iPSCs) are a model which mimics the early stage of neural development in humans"
      explanation: >-
        Justifies the organoid as informative for early human cortical development.
- name: Patient-derived lymphoblastoid cell line
  experimental_model_type: CELL_LINE
  description: >-
    Epstein-Barr-virus-immortalized lymphoblastoid cell lines from two patients with
    biallelic SZT2 variants, used to assay mTORC1 activity under amino-acid

genetic:
- name: SZT2
  association: Biallelic pathogenic variants
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    SZT2 (chromosome 1p34.2, 71 exons) encodes the ~380 kDa scaffold subunit of the
    KICSTOR complex. Pathogenic alleles are predominantly truncating - nonsense,
    frameshift, and canonical splice-site - with missense alleles retaining partial
    function and producing milder phenotypes. Severity tracks residual function:
    biallelic null genotypes give severe DEE, biallelic missense genotypes mild
    partial epilepsy with favourable outcome.
  gene_term:
    preferred_term: SZT2
    term:
      id: hgnc:29040
      label: SZT2
  evidence:

discussions:
- discussion_id: gap_mtor_inhibitor_repurposing_in_szt2
  prompt: >-
    Would mTOR inhibition with sirolimus or everolimus, effective in other genetic
    mTORopathies, reduce seizure burden in SZT2-related DEE, and would any benefit
    require treatment before the progenitor-expansion window has closed?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Constitutive mTORC1 Hyperactivation
  - pathophysiology#Excess Outer Radial Glial Cell Production
  rationale: >-
    The mechanism converges on constitutive mTORC1 hyperactivation, the same node
    that mTOR inhibitors target in tuberous sclerosis complex, so repurposing is
    biologically motivated. No published clinical trial or treated case series exists
    for SZT2. The timing question is the substantive one: the organoid data place a
    large part of the pathology in progenitor amplification during early cortical
    development, which is complete long before a genetic diagnosis is typically made.
    If the macrocephaly and cortical malformation are developmentally fixed, an mTOR
    inhibitor started postnatally could at best address the residual excitability arm,
    and a trial designed around structural or head-circumference endpoints would be
    measuring the wrong thing.
  evidence:
  - reference: PMID:41535455
    reference_title: "Brain organoid models of SZT2-related disease reveal an overproduction of outer radial glial cells through mTORC1 activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data suggest that SZT2 dysfunction may cause macrocephaly through dysregulation of mTORC1 in early neural development."
    explanation: >-
      Places the progenitor mechanism in early development, which is what creates the
      therapeutic-window problem.
  - reference: PMID:28199306
    reference_title: "KICSTOR recruits GATOR1 to the lysosome and is necessary for nutrients to regulate mTORC1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "several KICSTOR components are mutated in neurological diseases associated with mutations that lead to hyperactive mTORC1 signalling"
    explanation: >-
      Places SZT2 in the mTORopathy family whose therapy is being considered for reuse.
  proposed_experiments:
  - experiment_id: exp_rapamycin_timing_window_organoid
    name: Rapamycin rescue as a function of treatment onset in SZT2-mutant organoids
    description: >-
      Treat SZT2-mutant cerebral organoids with rapamycin starting at successively
      later stages of organoid development and score outer radial glial cell number,
      upper-layer neuron number, and mTORC1 activity, to establish whether the
      progenitor phenotype remains correctable once cortical expansion is underway.

- discussion_id: gap_seizure_threshold_arm_independent_of_malformation
  prompt: >-
    Does SZT2 loss lower neuronal excitability threshold directly, or is the epilepsy
    entirely secondary to the cortical malformation produced by mTORC1-driven
    progenitor expansion?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Lowered Intrinsic Seizure Threshold
  - pathophysiology#Brain Overgrowth and Cortical Malformation
  rationale: >-
    Two arms converge on hyperexcitability in this model. The malformation arm is
    well evidenced in human imaging and organoids. The intrinsic-threshold arm rests
    on mouse genetics - Szt2 was named for its effect on seizure threshold - and no
    study has isolated it from structural change in a mammalian brain. The
    distinction is testable and consequential: individuals with biallelic missense
    genotypes can have epilepsy without the severe malformations, which is difficult
    to explain if malformation were the whole story, but that observation is
    confounded because milder genotypes also produce milder structural change. If the
    intrinsic arm is real, seizure control would not require reversing a structural
    abnormality.
  evidence:
  - reference: PMID:23932106
    reference_title: "Biallelic SZT2 mutations cause infantile encephalopathy with epilepsy and dysmorphic corpus callosum."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although the molecular role of the peroxisomal protein SZT2 in neuronal excitability and brain development remains to be defined, Szt2 has been shown to influence seizure threshold and epileptogenesis in mice"
    explanation: >-
      States both the seizure-threshold finding and that its molecular basis is
      undefined.
  - reference: PMID:37213690
    reference_title: "SZT2 variants associated with partial epilepsy or epileptic encephalopathy and the genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study suggested that SZT2 variants were potentially associated with partial epilepsy with favorable outcomes without NDD, expanding the phenotypic spectrum of SZT2."
    explanation: >-
      Documents epilepsy occurring without neurodevelopmental abnormality, which is
      the human observation that motivates a malformation-independent arm.
  proposed_experiments:
  - experiment_id: exp_adult_onset_szt2_deletion_excitability
    name: Excitability after adult-onset conditional Szt2 deletion
    description: >-
      Delete Szt2 conditionally in adult mouse forebrain neurons, after cortical
      development is complete, and measure seizure threshold to pentylenetetrazol and
      kindling rate alongside histology, to test whether excitability changes arise in
      the absence of any developmental malformation.

- discussion_id: mismatch_organoid_hypomorph_versus_patient_null
  prompt: >-
    Does the SZT2 brain-organoid model, which carries in-frame 28-residue deletions
    rather than the truncating variants that predominate in patients, report the
    same lesion as human biallelic-null disease, and are outer radial glia the right
    cell type to carry the mechanism given their scarcity in the mouse models that
    established the seizure-threshold arm?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Excess Outer Radial Glial Cell Production
  - pathophysiology#Excess Upper-Layer Cortical Neuron Generation
  rationale: >-
    The organoid study is the only model of the human cortical mechanism, and it is a
    genuine advance precisely because outer radial glia are far more abundant in human
    than in mouse cortex - so the mouse literature that established the
    seizure-threshold arm structurally cannot address this branch. But the CRISPR
    alleles used are in-frame deletions of 28 residues at the distal end of exon 3,
    described by the authors as of uncertain functional impact, whereas most patient
    alleles are predicted null. A hypomorph in a human model and a null in a mouse
    model between them leave the human null cortical phenotype uninterrogated, so the
    magnitude of progenitor expansion in patient brain remains an extrapolation.
  evidence:
  - reference: PMID:41535455
    reference_title: "Brain organoid models of SZT2-related disease reveal an overproduction of outer radial glial cells through mTORC1 activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the introduced mutations result in in-frame deletions of 84 bp (28 amino acid residues), corresponding to the distal portion of exon 3"
    explanation: >-
      Documents that the model allele is an in-frame deletion, not a truncating null.
  - reference: PMID:41535455
    reference_title: "Brain organoid models of SZT2-related disease reveal an overproduction of outer radial glial cells through mTORC1 activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "oRGCs are more abundant in humans than in mice, and contribute to the expansion of the human brain by differentiating into upper-layer neurons"
    explanation: >-
      States the species difference that makes mouse models unable to test this arm.
  - reference: PMID:23932106
    reference_title: "Biallelic SZT2 mutations cause infantile encephalopathy with epilepsy and dysmorphic corpus callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all three mutations are predicted to result in nonsense-mediated mRNA decay and/or premature protein truncation"
    explanation: >-
      Establishes that patient alleles are typically null, unlike the model allele.
  proposed_experiments:
  - experiment_id: exp_isogenic_null_versus_inframe_organoids
    name: Isogenic null versus in-frame-deletion SZT2 organoid comparison
    description: >-
      Generate isogenic organoid lines carrying a truncating SZT2 null allele
      alongside the published in-frame deletion, and compare mTORC1 activity, outer
      radial glial number, and upper-layer neuron number, to establish whether the
      published phenotype under-reports the human null lesion.

- discussion_id: gap_leukoencephalopathy_relationship_to_mtorc1
  prompt: >-
    Is the progressive loss of central myelination reported in some individuals with
    SZT2-related DEE a consequence of mTORC1 dysregulation in oligodendroglia, a
    consequence of sustained seizure burden, or an unrelated feature of the severe
    end of the spectrum?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Loss of Central Myelination
  rationale: >-
    Progressive myelin loss is documented on serial imaging but is not universal, and
    the mechanistic account curated here stops at the observation. mTORC1 has
    well-established roles in oligodendrocyte differentiation and myelination, so a
    direct route is plausible, but so is a seizure-burden explanation, and the single
    detailed case had a complex terminal course. Nothing in the published literature
    separates these. The distinction matters for prognosis: a directly
    mTORC1-dependent myelin phenotype would be a candidate target for mTOR
    inhibition, whereas a seizure-driven one would not.
  evidence:
  - reference: PMID:29696782
    reference_title: "Mutations in SZT2 result in early-onset epileptic encephalopathy and leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case expands our clinical understanding of the SZT2-phenotype and emphasizes the role of this gene in the diagnostic investigation for EOEE and leukoencephalopathies."
    explanation: >-
      Establishes the white-matter phenotype while leaving its mechanism open.
  - reference: PMID:29696782
    reference_title: "Mutations in SZT2 result in early-onset epileptic encephalopathy and leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reported imaging findings include atrophy and dysgenesis of the corpus callosum"
    explanation: >-
      Prior imaging reports describe callosal change but not progressive myelin loss,
      underlining that this feature is neither universal nor mechanistically explained.
  proposed_experiments:
  - experiment_id: exp_oligodendrocyte_specific_szt2_deletion
    name: Oligodendrocyte-lineage-restricted Szt2 deletion and myelination
    description: >-
      Delete Szt2 selectively in the oligodendrocyte lineage in mice, in the absence
      of neuronal deletion and therefore of seizures, and quantify myelin thickness,
      oligodendrocyte maturation markers, and mTORC1 activity over time to test
      whether myelin loss is cell-autonomous to the oligodendrocyte lineage.


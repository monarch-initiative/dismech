discussions:
- discussion_id: tyr89cys_pathomechanism_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Predicted Impairment of ERF DNA Binding
  prompt: >-
    How does the single ERF substitution p.(Tyr89Cys) produce hyperphalangism
    and airway malacia without craniosynostosis, when reduced ERF dosage
    causes craniosynostosis?
  rationale: >-
    Truncating ERF variants act by haploinsufficiency and cause
    craniosynostosis in humans and in mice with reduced Erf levels, yet none of
    the reported p.(Tyr89Cys) carriers has craniosynostosis. A simple loss of
    function therefore does not explain Chitayat syndrome. The variant is
    predicted to weaken DNA binding, but no study has measured DNA binding,
    target-gene repression, or ERK interaction of the mutant protein, and no
    animal model carries it. Whether the allele is hypomorphic for a subset of
    targets, dominant negative, or neomorphic is open.
  evidence:
  - reference: PMID:27738187
    reference_title: "Chitayat syndrome: hyperphalangism, characteristic facies, hallux valgus and bronchomalacia results from a recurrent c.266A>G p.(Tyr89Cys) variant in the ERF gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ERF variants have previously been associated with complex craniosynostosis. In contrast, none of the patients with the c.266A>G p.(Tyr89Cys) variant have craniosynostosis."
    explanation: States the allelic contrast that a loss-of-function model fails to explain.
  - reference: PMID:23354439
    reference_title: Reduced dosage of ERF causes complex craniosynostosis in humans and mice and links ERK1/2 signaling to regulation of osteogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Mice with functional Erf levels reduced to ∼30% of normal exhibit postnatal multiple-suture synostosis"
    explanation: Reduced Erf dosage causes craniosynostosis, the phenotype absent in Chitayat syndrome.
  - reference: PMID:38824261
    reference_title: Loss-of-function variants in ERF are associated with a Noonan syndrome-like phenotype with or without craniosynostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "This specific genotype-phenotype correlation has been reported in 13 affected subjects from 9 unrelated families, none of whom showing craniosynostosis"
    explanation: Confirms across later reports that craniosynostosis is absent in p.(Tyr89Cys) carriers.
- discussion_id: frameshift_labelled_chitayat
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - genetic#ERF
  prompt: >-
    Should a C-terminal ERF frameshift reported as Chitayat syndrome be counted
    as part of this disorder?
  rationale: >-
    Zhu et al. 2025 described a girl with short stature, facial dysmorphism and
    early developmental delay carrying ERF c.1201_1202del
    (p.Lys401Glufs*10), and labelled her as having Chitayat syndrome. Every
    other molecularly confirmed case carries p.(Tyr89Cys), and truncating ERF
    variants are the established cause of craniosynostosis 4 and a
    Noonan-like phenotype whose features (short stature, dysmorphism,
    developmental delay) match this child better than the hand, foot and airway
    findings that define Chitayat syndrome. The entry therefore does not use
    this report as evidence for the Chitayat phenotype, nor its growth-hormone
    outcome as a treatment for it.
  evidence:
  - reference: PMID:40840652
    reference_title: Further delineation of ERF-related Chitayat syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a patient of CHYTS resulting from a c.1201_1202del (p.Lys401Glufs∗10) frameshift variant in the ERF (NM_001429.3) gene."
    explanation: The report that applies the Chitayat label to a truncating allele.
  - reference: PMID:38824261
    reference_title: Loss-of-function variants in ERF are associated with a Noonan syndrome-like phenotype with or without craniosynostosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants were nonsense and frameshift changes, supporting ERF haploinsufficiency."
    explanation: Truncating ERF variants are associated with a distinct haploinsufficiency phenotype.

genetic:
- name: ERF
  gene_term:
    preferred_term: ERF
    term:
      id: hgnc:3444
      label: ERF
  association: Causative (Primary)
  relationship_type: CAUSATIVE
  notes: >-
    Chitayat syndrome is defined by a single recurrent ERF missense variant.
    Other ERF alleles cause different disorders: heterozygous truncating
    variants that reduce ERF dosage cause craniosynostosis 4 and a Noonan-like
    phenotype, and in-frame changes in the ERK-docking FSF motif cause a
    microcephaly-developmental delay-skeletal anomaly phenotype. One 2025
    report labelled a child with a C-terminal ERF frameshift as Chitayat
    syndrome; that allele is a truncating variant and is not treated here as
    evidence for the Chitayat phenotype (see discussions).
  evidence:
  - reference: PMID:27738187
    reference_title: "Chitayat syndrome: hyperphalangism, characteristic facies, hallux valgus and bronchomalacia results from a recurrent c.266A>G p.(Tyr89Cys) variant in the ERF gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The recurrent ERF c.266A>C p.(Tyr89Cys) variant causes Chitayat syndrome."
    explanation: >-
      Gene-discovery study identifying ERF as the causal gene. "c.266A>C" is
      a typo in the published abstract for c.266A>G and is quoted verbatim.
  - reference: PMID:39668184
    reference_title: Heterozygous variants disrupting the interaction of ERF with activated ERK1/2 cause microcephaly, developmental delay, and skeletal anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Heterozygous deleterious null alleles and specific missense variants in the DNA-binding domain of the ETS2 repressor factor (ERF) cause craniosynostosis, while the recurrent p.(Tyr89Cys) missense variant is associated with Chitayat syndrome."
    explanation: Independent restatement of the allele-specific gene-disease relationship.
  variants:
  - name: NM_006494.2:c.266A>G p.(Tyr89Cys)
    description: >-
      Recurrent ETS-domain missense variant found in every molecularly
      confirmed family; arises de novo or is inherited from an affected parent.
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:30569521
      reference_title: Molecular analysis provides further evidence that Chitayat syndrome is caused by the recurrent p.(Tyr89Cys) pathogenic variant in the ERF gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "in this patient provides further evidence that this condition is caused by a recurrent pathogenic variant in ERF."
      explanation: An independent family carrying the same variant confirms its recurrence.
    - reference: PMID:40763971
      reference_title: "[Chitayat syndrome due to variant of ERF gene: A case report and literature review]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant was therefore classified as pathogenic (PM1+PM2_Supporting+PM6+PS1+PP3)."
      explanation: ACMG classification of the recurrent variant as pathogenic.

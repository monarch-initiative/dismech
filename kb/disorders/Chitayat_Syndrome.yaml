name: Chitayat Syndrome
synonyms:
- CHYTS
- Hyperphalangism, facial anomalies, hallux valgus, and bronchomalacia
creation_date: '2026-10-26T00:00:00Z'
category: Mendelian
description: >
  Chitayat syndrome is an ultrarare autosomal dominant developmental disorder
  defined by a single recurrent heterozygous missense variant in ERF,
  NM_006494.2:c.266A>G p.(Tyr89Cys), which lies in the DNA-binding ETS domain
  of the ETS2 repressor factor. The core features are hand hyperphalangism, in
  which an accessory phalanx shortens the index finger and deviates it toward
  the ulna, hallux valgus, mild facial dysmorphism, and neonatal respiratory
  compromise, frequently from bronchomalacia or tracheobronchomalacia, that may
  require assisted ventilation. The respiratory phenotype ranges from fatal
  infantile disease to no obvious pulmonary involvement, and about half of
  reported individuals have developmental or growth delay. Chitayat syndrome
  is allelic to, but clinically distinct from, ERF-related craniosynostosis:
  truncating ERF variants that reduce gene dosage cause craniosynostosis and a
  Noonan-like phenotype, whereas no individual with p.(Tyr89Cys) has had
  craniosynostosis. How this one substitution produces a different disorder is
  not known.
disease_term:
  preferred_term: Chitayat syndrome
  term:
    id: MONDO:0014956
    label: Chitayat syndrome
parents:
- Skeletal Dysplasia
- Limb Development Disorders
notes: >-
  No GeneReviews chapter covers Chitayat syndrome (PubMed query
  "Chitayat syndrome[TI] AND genereviews[book]" and "ERF craniosynostosis AND
  genereviews[book]" both returned no records on 2026-10-26). The phenotype
  baseline is therefore the case literature: the original 1993 report, the
  2017 gene-discovery series, and later case series and reviews. The name
  "Chitayat syndrome" has also been used for unrelated conditions:
  Roifman-Chitayat syndrome (PIK3CD/KNSTRN combined immunodeficiency, PMID:29180244)
  and a distal contracture-intellectual disability syndrome revisited in 2007
  (PMID:17515308). Neither involves ERF or MONDO:0014956, and neither is cited
  as evidence here.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous p.(Tyr89Cys) arises de novo or is transmitted from an affected
    parent; father-to-child transmission is documented.
  evidence:
  - reference: PMID:27738187
    reference_title: "Chitayat syndrome: hyperphalangism, characteristic facies, hallux valgus and bronchomalacia results from a recurrent c.266A>G p.(Tyr89Cys) variant in the ERF gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A recurrent, novel variant NM_006494.2:c.266A>G p.(Tyr89Cys) in ERF was identified in five affected individuals: de novo (patient 1, 2 and 3) and inherited from an affected father (patient 4 and 5)."
    explanation: De novo occurrence plus transmission from an affected father establishes autosomal dominant inheritance.
  - reference: PMID:30569521
    reference_title: Molecular analysis provides further evidence that Chitayat syndrome is caused by the recurrent p.(Tyr89Cys) pathogenic variant in the ERF gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chitayat syndrome (CHYTS, MIM #617180) is a rare autosomal dominant clinical condition caused by a single missense pathogenic variant in the ERF gene (19q13.2, MIM*611888), which encodes the ETS2 Repressor Factor (ERF) protein."
    explanation: States the autosomal dominant mode and the single-variant basis of the disorder.
prevalence:
- population: Reported cases worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fifteen molecularly confirmed individuals were counted in the 2025
    literature review; no population-based estimate exists.
  evidence:
  - reference: PMID:40763971
    reference_title: "[Chitayat syndrome due to variant of ERF gene: A case report and literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Literature retrieval has collected 7 relevant articles, which involved 14 cases of Chitayat syndrome confirmed by genetic testing."
    explanation: Fourteen published molecularly confirmed cases plus the reported case give the literature count.
pathophysiology:
- name: ERF p.Tyr89Cys ETS-Domain Missense Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The disease-defining lesion is a single recurrent heterozygous missense
    change, c.266A>G p.(Tyr89Cys), at a highly conserved tyrosine inside the
    ETS DNA-binding domain of ERF, a transcriptional repressor that is directly
    bound and regulated by ERK1/2. The variant has occurred de novo in several
    families, which makes it a recurrent mutational event rather than a
    founder allele.
  gene:
    preferred_term: ERF
    term:
      id: hgnc:3444
      label: ERF
  genetic_context:
    allele_type: recurrent missense p.(Tyr89Cys)
    variant_type: single nucleotide variant
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: UNKNOWN
  molecular_functions:
  - preferred_term: DNA-binding transcription repressor activity, RNA polymerase II-specific
    term:
      id: GO:0001227
      label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  evidence:
  - reference: PMID:27738187
    reference_title: "Chitayat syndrome: hyperphalangism, characteristic facies, hallux valgus and bronchomalacia results from a recurrent c.266A>G p.(Tyr89Cys) variant in the ERF gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "p.Tyr89Cys is an aromatic polar neutral to polar neutral amino acid substitution, at a highly conserved position and lies within the functionally important ETS-domain of the protein."
    explanation: Places the recurrent substitution at a conserved residue inside the ETS DNA-binding domain.
  - reference: PMID:23354439
    reference_title: Reduced dosage of ERF causes complex craniosynostosis in humans and mice and links ERK1/2 signaling to regulation of osteogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "reduced dosage of ERF, which encodes an inhibitory ETS transcription factor directly bound by ERK1/2"
    explanation: Establishes ERF as an inhibitory ETS transcription factor under ERK1/2 control, the protein the variant alters.
  downstream:
  - target: Predicted Impairment of ERF DNA Binding
    causal_link_type: DIRECT
    description: >-
      The tyrosine side chain contributes to the protein-DNA interface, so its
      replacement by cysteine is expected to weaken DNA binding. This is a
      structural prediction, not a measured effect.
- name: Predicted Impairment of ERF DNA Binding
  biological_scale: MOLECULAR
  description: >-
    Structural modelling and the known crystal contacts of the ETS domain
    predict that p.(Tyr89Cys) reduces the affinity of ERF for its DNA targets.
    An equivalent substitution in the nematode orthologue LIN-1 impairs DNA
    binding and upregulates RAS-MAPK-dependent development. No experiment has
    measured DNA binding, transcriptional repression, or ERK interaction of the
    human Tyr89Cys protein, and why this change does not reproduce the
    craniosynostosis caused by ERF haploinsufficiency is unexplained.
  molecular_functions:
  - preferred_term: DNA-binding transcription repressor activity, RNA polymerase II-specific
    term:
      id: GO:0001227
      label: DNA-binding transcription repressor activity, RNA polymerase II-specific
    modifier: ABNORMAL
  evidence:
  - reference: PMID:40763971
    reference_title: "[Chitayat syndrome due to variant of ERF gene: A case report and literature review]."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Protein structure modeling suggested that the mutant protein has increased spatial distance between the side chain group and DNA, which may reduce its binding affinity to DNA."
    explanation: In silico modelling of the Tyr89Cys protein predicts weakened DNA contact.
  - reference: PMID:38824261
    reference_title: Loss-of-function variants in ERF are associated with a Noonan syndrome-like phenotype with or without craniosynostosis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The nonconservative substitution is expected to affect proper binding of ERF to DNA."
    explanation: >-
      The authors infer, from the residue's role in published ETS-DNA
      structures, that Tyr89Cys disturbs DNA binding; this is an expectation,
      not a measurement.
  - reference: PMID:32592542
    reference_title: "Variable pulmonary manifestations in Chitayat syndrome: Six additional affected individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathomechanism of Chitayat syndrome is unknown."
    explanation: Records that the downstream developmental mechanism has not been established.
  downstream:
  - target: Finger Hyperphalangy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The variant segregates with hand hyperphalangism; the developmental steps
      linking altered ERF activity to an accessory phalanx are not known.
    evidence:
    - reference: PMID:32592542
      reference_title: "Variable pulmonary manifestations in Chitayat syndrome: Six additional affected individuals."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hand hyperphalangism leading to shortened index fingers with ulnar deviation, hallux valgus, mild facial dysmorphism and respiratory compromise requiring assisted ventilation are the key features of Chitayat syndrome."
      explanation: Hyperphalangism is a key feature in carriers of the recurrent variant.
  - target: Hallux Valgus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hallux valgus is a consistent feature of p.(Tyr89Cys) carriers; the
      mechanism is not characterised.
  - target: Bronchomalacia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Airway malacia is the commonest documented basis of the respiratory
      phenotype; how the variant affects airway cartilage is unknown.
  - target: Neonatal Respiratory Distress
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Respiratory compromise from birth is present in most carriers, ranging
      from transient oxygen need to ventilator dependence.
  - target: Facial Dysmorphism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      All molecularly confirmed individuals have facial dysmorphism; the
      craniofacial mechanism is not characterised.
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      About half of reported individuals have neurodevelopmental delay; whether
      this is primary or secondary to respiratory illness is unresolved.

      explanation: >
        A substantial and progressive cutaneous burden places this partly in
        Harrison's dermatology Part.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Heterozygous activating variants, arising both de novo and by transmission.
    In the founding series three of four families comprised singleton adults
    with no parental samples available, while in the fourth a variant proven de
    novo in the mother was transmitted to two of her children - so the same
    allele is documented arising de novo and then segregating dominantly.
  evidence:
  - reference: PMID:30449416
    reference_title: "Recurrent, Activating Variants in the Receptor Tyrosine Kinase DDR2 Cause Warburg-Cinotti Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the fourth family, a mother and two of her children were affected, and the c.2219A>G missense variant was proven to be de novo in the mother."
    explanation: >
      Documents both the de novo origin and the subsequent dominant
      transmission of the same variant.

notes: >
  Ultra-rare: six individuals from four families at first description, still
  roughly six cases worldwide as of 2024, with individual reports since. No
  frequency values are set anywhere in this entry, and none should be - there
  is no denominator.

  Two entries in the wider DDR2 literature that are NOT curated as evidence
  here, and why:

  A 2026 study identified DDR2 as a candidate risk gene for nonsyndromic cleft
  palate, with zebrafish knockdown producing craniofacial abnormalities. That
  is a different disease and a different allelic mechanism (biallelic
  hypomorphic risk alleles, not dominant activating variants); it is cited once
  below only for the statement that the WCS phenotypic spectrum includes
  palatal abnormalities, not as mechanism evidence for this entry.

  Loss-of-function DDR2 variants are reported to cause a distinct recessive
  skeletal dysplasia, which would make DDR2 a clean gain-of-function /
  loss-of-function pair on one receptor. That contrast is deliberately left out
  of the entry body because none of the references cached for this curation
  states it, and it is not a claim to make from memory. It is a good target for
  a follow-up increment.

pathophysiology:
- name: Activating DDR2 Kinase-Domain Missense Variants
  biological_scale: MOLECULAR
  description: >
    Two recurrent variants account for the founding series - c.1829T>C
    (p.Leu610Pro) and c.2219A>G (p.Tyr740Cys) - both in the kinase domain. The
    structural basis is specific: Tyr-740 lies in the activation loop and forms
    autoinhibitory hydrogen bonds with key catalytic residues, and a cysteine
    substituted at that position cannot form them, releasing the A-loop from
    its autoinhibitory conformation.
  genes:
  - preferred_term: DDR2
    term:
      id: hgnc:2731
      label: DDR2
    modifier: GAIN_OF_FUNCTION
  genetic_context:
    description: >-
      Heterozygous germline missense variants in the DDR2 kinase domain,
      recurrent across unrelated families and arising both de novo and by
      dominant transmission. p.Tyr740Cys substitutes an activation-loop
      tyrosine whose autoinhibitory hydrogen bonds cannot form with cysteine.
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:30449416
    reference_title: "Recurrent, Activating Variants in the Receptor Tyrosine Kinase DDR2 Cause Warburg-Cinotti Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In six affected individuals from four families, we found one of two recurrent variants in discoidin domain receptor tyrosine kinase 2 (DDR2): c.1829T>C (p.Leu610Pro) or c.2219A>G (p.Tyr740Cys)."
    explanation: >
      Establishes the causal gene and the two recurrent disease alleles.
  - reference: PMID:41259339
    reference_title: "Warburg-Cinotti disease variant p.Tyr740Cys enhances catalytic activity of DDR2 kinase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Tyrosine-740 is a residue in the A-loop of DDR2 kinase that forms autoinhibitory hydrogen bonds with key catalytic residues. These hydrogen bonds cannot form in the cysteine-substituted variant, providing a structural explanation for the release of the A-loop from its autoinhibitory conformation."
    explanation: >
      Gives the residue-level structural mechanism by which this specific
      substitution disables autoinhibition.
  downstream:
  - target: Ligand-Independent Constitutive DDR2 Kinase Activation
    description: Loss of the autoinhibitory clamp permits activation without collagen.

- name: Ligand-Independent Constitutive DDR2 Kinase Activation
  biological_scale: MOLECULAR
  description: >
    The central node, and the claim is stronger than "more active". Both
    disease variants autophosphorylate constitutively when expressed as
    full-length proteins in mammalian cells, without ligand. Kinetically,
    unphosphorylated DDR2-Y740C has autophosphorylation and substrate
    phosphorylation rates similar to those of fully phosphorylated wild-type
    DDR2 - meaning the variant bypasses all autoinhibitory constraints and
    adopts the fully active kinase conformation - while ATP binding affinity is
    unchanged, so the gain is in catalysis and regulation rather than in
    substrate handling. Because the kinase is operating outside its normal
    regulatory constraints rather than merely running above its normal level,
    this node is tagged GAIN_OF_FUNCTION rather than INCREASED.
  molecular_functions:
  - preferred_term: DDR2 protein tyrosine kinase activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004713
      label: protein tyrosine kinase activity
  biological_processes:
  - preferred_term: cell surface receptor protein tyrosine kinase signaling pathway
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0007169
      label: cell surface receptor protein tyrosine kinase signaling pathway
  evidence:
  - reference: PMID:41259339
    reference_title: "Warburg-Cinotti disease variant p.Tyr740Cys enhances catalytic activity of DDR2 kinase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that both disease variants exhibit ligand-independent constitutive autophosphorylation when expressed as full-length proteins in mammalian cells."
    explanation: >
      Demonstrates constitutive, ligand-independent activation for both
      disease variants - the defining molecular event.
  - reference: PMID:41259339
    reference_title: "Warburg-Cinotti disease variant p.Tyr740Cys enhances catalytic activity of DDR2 kinase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The increased catalytic rates of unphosphorylated DDR2-Y740C kinase were similar to those of fully phosphorylated WT DDR2, indicating that the missense variant bypasses all autoinhibitory constraints and adopts the fully active kinase conformation."
    explanation: >
      The quantitative result behind the qualitative GAIN_OF_FUNCTION call:
      the unphosphorylated variant already behaves like the fully activated
      wild-type enzyme.
  - reference: PMID:30449416
    reference_title: "Recurrent, Activating Variants in the Receptor Tyrosine Kinase DDR2 Cause Warburg-Cinotti Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Phosphorylation of DDR2 was increased in fibroblasts from affected individuals, suggesting reduced receptor autoinhibition and ligand-independent kinase activation."
    explanation: >
      The original observation in patient-derived fibroblasts that the 2025
      enzymology later confirmed and quantified.
  downstream:
  - target: Dysregulated Fibroblast ECM Remodeling
    description: >
      Sustained DDR2 signalling in fibroblasts drives the matrix-remodelling
      program.

- name: Dysregulated Fibroblast ECM Remodeling
  biological_scale: CELLULAR
  description: >
    The fibroblast is the effector cell, and the output is a matrix program
    running without its normal input. DDR2's physiological role is to sense
    collagen and regulate connective-tissue formation, so a receptor locked on
    produces continuous remodelling signalling in a tissue that is not
    remodelling. This single node accounts for the clinically paradoxical
    combination of proliferative lesions (keloids, corneal pannus) and
    destructive ones (ulcers, subcutaneous wasting, acro-osteolysis): both are
    outputs of unregulated matrix turnover, not of two separate processes.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: extracellular matrix disassembly
    modifier: INCREASED
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
  - preferred_term: collagen catabolic process
    modifier: INCREASED
    term:
      id: GO:0030574
      label: collagen catabolic process
  evidence:
  - reference: PMID:30449416
    reference_title: "Recurrent, Activating Variants in the Receptor Tyrosine Kinase DDR2 Cause Warburg-Cinotti Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DDR2 encodes a collagen-responsive receptor tyrosine kinase that regulates connective-tissue formation."
    explanation: >
      Establishes the normal function whose constitutive activation produces a
      connective-tissue phenotype.
  - reference: PMID:41259339
    reference_title: "Warburg-Cinotti disease variant p.Tyr740Cys enhances catalytic activity of DDR2 kinase."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Warburg-Cinotti syndrome is a severe connective tissue disorder, characterised by a range of manifestations including joint contractures of the hand, corneal vascularisation and pannus, skin fusion and infection, keloid plaques and acro-osteolysis."
    explanation: >
      Lists the connective-tissue manifestations that constitute the clinical
      output of this node. Graded OTHER and INDIRECT because this is
      disease-background prose in an in vitro enzymology paper, not a clinical
      observation the paper made.
  downstream:
  - target: Progressive Corneal Neovascularization and Pannus
    description: Ocular surface manifestation of unregulated matrix remodelling.
  - target: Fibroproliferative and Ulcerative Skin Disease
    description: Cutaneous manifestation, both proliferative and destructive.
  - target: Acro-osteolysis and Flexion Contractures
    description: Skeletal and periarticular manifestation.

- name: Progressive Corneal Neovascularization and Pannus
  biological_scale: TISSUE
  description: >
    The most characteristic feature and the one that drives ophthalmic
    morbidity. Reported as progressive, and clinically important is its
    behaviour around intervention: in a 2024 paediatric case the vascularized
    mass arose after trauma, invaded the cornea, and recurred larger after each
    surgical intervention until it covered the whole cornea.
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  evidence:
  - reference: PMID:30449416
    reference_title: "Recurrent, Activating Variants in the Receptor Tyrosine Kinase DDR2 Cause Warburg-Cinotti Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have investigated a distinct disorder with progressive corneal neovascularization, keloid formation, chronic skin ulcers, wasting of subcutaneous tissue, flexion contractures of the fingers, and acro-osteolysis."
    explanation: >
      Establishes progressive corneal neovascularisation as a defining feature
      of the disorder.
  - reference: PMID:39095787
    reference_title: "Progressive conjunctival invasion of cornea in a child with Warburg-Cinotti Syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mass enlarged and gradually invaded the cornea. With each surgical intervention, the mass recurred and grew even larger rapidly. The patient ended up with the mass covering the entire cornea along with symblepharon formation."
    explanation: >
      The paediatric case this node's description refers to: progressive
      corneal invasion accelerated by each surgical intervention, ending in
      total corneal coverage with symblepharon.

- name: Fibroproliferative and Ulcerative Skin Disease
  biological_scale: TISSUE
  description: >
    Both directions at once, in the same skin. Keloid-like polymorphic plaques
    and hyperkeratotic and verrucoid lesions on the proliferative side; chronic
    ulceration, cicatricial alopecia and pseudosyndactyly of the toes on the
    destructive side. Documented as progressive in an adult.
  locations:
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:
  - reference: PMID:35036505
    reference_title: "Progression of skin lesions in Warburg-Cinotti syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The skin can be affected by chronic ulcerations, pseudosyndactyly of the toes, hyperkeratotic and verrucoid lesions, cicatricial alopecia, and spontaneous polymorphic plaques having features similar to keloids."
    explanation: >
      Enumerates the cutaneous manifestations, spanning both proliferative and
      destructive lesion types.
  - reference: PMID:35036505
    reference_title: "Progression of skin lesions in Warburg-Cinotti syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report demonstrates the progressive nature of skin lesions in an adult with WCS."
    explanation: >
      Establishes that the cutaneous disease progresses rather than stabilising
      in adulthood.

- name: Acro-osteolysis and Flexion Contractures
  biological_scale: TISSUE
  description: >
    Resorption of distal bone with progressive flexion contractures of the
    fingers. This is the clearest expression of the destructive arm of the
    mechanism: bone is being removed, not failing to form.
  evidence:
  - reference: PMID:30449416
    reference_title: "Recurrent, Activating Variants in the Receptor Tyrosine Kinase DDR2 Cause Warburg-Cinotti Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have investigated a distinct disorder with progressive corneal neovascularization, keloid formation, chronic skin ulcers, wasting of subcutaneous tissue, flexion contractures of the fingers, and acro-osteolysis."
    explanation: >
      Establishes acro-osteolysis and finger flexion contractures as defining
      features.

mechanistic_hypotheses:
- hypothesis_group_id: ddr2_constitutive_kinase
  hypothesis_label: A single constitutively active collagen receptor produces both the proliferative and the destructive lesions
  status: EMERGING
  description: >
    The claim is that keloids and corneal pannus on one hand, and ulcers,
    subcutaneous wasting and acro-osteolysis on the other, are not two diseases
    running in parallel but two faces of unregulated matrix turnover driven
    from one node. Support is the narrowness of the original signalling
    finding - increased DDR2 phosphorylation with no evidence for activation of
    other growth-regulatory pathways - which argues against a general
    growth-signalling excess and for a matrix-specific one. It predicts that
    inhibiting DDR2 kinase activity should attenuate both arms together.

discussions:
- discussion_id: wcs_n144s_mechanism_discordance
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Activating DDR2 Kinase-Domain Missense Variants
  - pathophysiology#Ligand-Independent Constitutive DDR2 Kinase Activation
  prompt: >-
    Is the neonatal p.Asn144Ser variant a Warburg-Cinotti allele at all, given
    that it lies outside the kinase domain and the reported functional result
    is a failure of pathway activation rather than a gain?
  rationale: >-
    Every mechanistically characterised WCS allele is a kinase-domain missense
    variant producing ligand-independent constitutive activation. A 2025
    neonatal case reports a maternally inherited DDR2 c.431A>G (p.Asn144Ser)
    variant - in the discoidin region, not the kinase domain - and in vitro the
    mutated DDR2 fails to activate the p38 MAPK pathway. A failure to activate
    is not obviously the same lesion as constitutive activation, and the
    reporting authors themselves hedge ("may contribute", "may expand the
    phenotypic spectrum"). Three readings are open: the allele is
    mechanistically distinct and expands the spectrum; the p38 readout is not
    the relevant output for this allele; or the variant is not causal. This
    entry curates the kinase-domain gain-of-function mechanism and records the
    discordance here rather than flattening the two into one node.
  evidence:
  - reference: PMID:41778429
    reference_title: "A Novel Mutation in DDR2 Associated with Warburg-Cinotti Syndrome in a Neonate."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "In-vitro experiments showed that the mutated DDR2 fails to activate the p38 MAPK pathway."
    explanation: >-
      Recorded as REFUTE against the claim that every reported WCS allele acts
      by constitutive kinase activation. The result is a loss of pathway
      activation, which is the opposite direction from the characterised
      kinase-domain alleles.
  - reference: PMID:41778429
    reference_title: "A Novel Mutation in DDR2 Associated with Warburg-Cinotti Syndrome in a Neonate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES revealed a maternally inherited heterozygous missense mutation in DDR2 (c.431A>G, p.Asn144Ser)."
    explanation: >-
      Documents the variant and its position outside the kinase domain, which
      is what makes the mechanistic question live.

- discussion_id: wcs_dasatinib_translational_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#DDR2 Kinase Inhibition (Dasatinib)
  - pathophysiology#Ligand-Independent Constitutive DDR2 Kinase Activation
  prompt: >-
    Does pharmacological DDR2 kinase inhibition, shown to abolish variant
    autophosphorylation in patient fibroblasts, alter the clinical course of
    Warburg-Cinotti syndrome?
  rationale: >-
    The founding report showed dasatinib prevents DDR2 autophosphorylation in
    patient fibroblasts and proposed it as an approach to treatment. Seven
    years on, no patient outcome data exist. The gap is worth stating because
    the mechanistic case here is unusually clean - a constitutively active
    kinase with an available inhibitor - and cleanliness of rationale is
    exactly what makes an untested therapy get cited as though it were a
    treatment. A relevant design question is also open: the ocular disease is
    described as accelerated by trauma and surgery, so the peri-operative
    window may be the natural place to test an inhibitor, rather than
    continuous therapy.
  evidence:
  - reference: PMID:30449416
    reference_title: "Recurrent, Activating Variants in the Receptor Tyrosine Kinase DDR2 Cause Warburg-Cinotti Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, we found that the protein kinase inhibitor dasatinib prevented DDR2 autophosphorylation in fibroblasts, suggesting an approach to treatment."
    explanation: >-
      The ex vivo result, and the authors' own framing of it as a suggested
      approach rather than a demonstrated therapy.


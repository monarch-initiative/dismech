environmental:
- name: Ocular and cutaneous trauma or surgery
  description: >
    The single most actionable finding in the clinical literature on this
    disease, and the one with a management consequence. Lesions are provoked by
    injury and accelerated by attempts to remove them: the original 2006
    patient's corneal vascularization arose after ocular surface surgery, and
    in the 2024 paediatric case the mass began after trauma and recurred larger
    after every surgical intervention until it covered the whole cornea.

    Read against the entry's mechanism, this is what a constitutively active
    collagen receptor should do. Wounding exposes fibrillar collagen and calls
    for exactly the matrix-remodelling program that DDR2 normally gates - but
    the gate is already open, so the response does not terminate.
  exposure_term:
    preferred_term: exposure to ocular surface surgery or trauma
    term:
      id: ECTO:2000054
      label: exposure to surgery
  influences_mechanisms:
  - target: Dysregulated Fibroblast ECM Remodeling
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >
      Tissue injury supplies the collagen exposure and wound-healing context in
      which the already-unregulated remodelling program runs, producing lesion
      onset at the site of injury and rapid regrowth after excision.
    evidence:
    - reference: PMID:39095787
      reference_title: "Progressive conjunctival invasion of cornea in a child with Warburg-Cinotti Syndrome: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "With each surgical intervention, the mass recurred and grew even larger rapidly."
      explanation: >
        Each surgical attempt made the lesion worse, which is the clearest
        evidence that intervention accelerates rather than controls the
        remodelling program.
  evidence:
  - reference: PMID:39095787
    reference_title: "Progressive conjunctival invasion of cornea in a child with Warburg-Cinotti Syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A seven-year-old boy developed a gelatinous vascularized conjunctiva-like mass secondary to trauma."
    explanation: >
      Documents trauma as the provoking event for lesion onset.
  - reference: PMID:39095787
    reference_title: "Progressive conjunctival invasion of cornea in a child with Warburg-Cinotti Syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Warburg et al. first described a 42-year-old white male with deafness, acro-osteolysis, wasting of subcutaneous tissue, and corneal vascularization secondary to ocular surface surgery in 2006"
    explanation: >
      The original patient description also attributes the corneal
      vascularization to preceding ocular surface surgery, so the pattern is
      not confined to one case.

genetic:
- name: DDR2
  gene_term:
    preferred_term: DDR2
    term:
      id: hgnc:2731
      label: DDR2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >
    DDR2 encodes a collagen-responsive receptor tyrosine kinase that regulates
    connective-tissue formation. Wild-type DDR2 kinase follows a two-step
    activation mechanism, previously characterised for DDR1, but with enhanced
    autophosphorylation and substrate phosphorylation rates. Disease alleles
    are heterozygous kinase-domain missense variants that disable
    autoinhibition; the recurrent p.Tyr740Cys removes activation-loop hydrogen
    bonds to catalytic residues.
  review_notes: >-
    No ClinGen gene-disease validity assertion exists for DDR2 in Warburg-Cinotti
    syndrome. CAUSATIVE is nonetheless well supported: two recurrent variants
    across four unrelated families, a proven de novo event with subsequent
    dominant transmission, patient-fibroblast functional data, and independent
    enzymology establishing the gain-of-function mechanism at residue level.
    Note that not all reported DDR2 variants fit this mechanism - see the
    discordance recorded for p.Asn144Ser.
  evidence:
  - reference: PMID:30449416
    reference_title: "Recurrent, Activating Variants in the Receptor Tyrosine Kinase DDR2 Cause Warburg-Cinotti Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In six affected individuals from four families, we found one of two recurrent variants in discoidin domain receptor tyrosine kinase 2 (DDR2): c.1829T>C (p.Leu610Pro) or c.2219A>G (p.Tyr740Cys)."
    explanation: >
      Recurrence of two specific variants across four unrelated families is
      the core human genetic argument.
  - reference: PMID:41259339
    reference_title: "Warburg-Cinotti disease variant p.Tyr740Cys enhances catalytic activity of DDR2 kinase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Compared with WT DDR2, DDR2-Y740C displayed further enhanced autophosphorylation and substrate phosphorylation rates, but no effect on ATP binding affinity."
    explanation: >
      Quantitative enzymology localising the gain of function to catalysis and
      regulation rather than to substrate or nucleotide binding.

variants:
- name: DDR2 c.2219A>G (p.Tyr740Cys)
  description: >-
    Recurrent activating kinase-domain variant and the best-characterised WCS
    allele. Tyrosine-740 lies in the activation loop and forms autoinhibitory
    hydrogen bonds with key catalytic residues that a cysteine cannot form.
    Kinetically the unphosphorylated variant matches fully phosphorylated
    wild-type enzyme.
  gene:
    preferred_term: DDR2
    term:
      id: hgnc:2731
      label: DDR2
  type: SNV
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:41259339
    reference_title: "Warburg-Cinotti disease variant p.Tyr740Cys enhances catalytic activity of DDR2 kinase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The increased catalytic rates of unphosphorylated DDR2-Y740C kinase were similar to those of fully phosphorylated WT DDR2, indicating that the missense variant bypasses all autoinhibitory constraints and adopts the fully active kinase conformation."
    explanation: >-
      Establishes the magnitude and nature of the gain of function for this
      specific allele.

- name: DDR2 c.1829T>C (p.Leu610Pro)
  description: >-
    The second recurrent activating kinase-domain variant. Shown to
    autophosphorylate constitutively without ligand, though the detailed
    enzymology reported to date is for p.Tyr740Cys.
  gene:
    preferred_term: DDR2
    term:
      id: hgnc:2731
      label: DDR2
  type: SNV
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:41259339
    reference_title: "Warburg-Cinotti disease variant p.Tyr740Cys enhances catalytic activity of DDR2 kinase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that both disease variants exhibit ligand-independent constitutive autophosphorylation when expressed as full-length proteins in mammalian cells."
    explanation: >-
      Covers both recurrent variants, establishing constitutive activation for
      p.Leu610Pro as well as p.Tyr740Cys.

diagnosis:
- name: Molecular Genetic Testing of DDR2
  description: >
    The diagnosis is molecular. Two recurrent kinase-domain variants account
    for the founding series, so they are the first things to look for, but
    novel alleles continue to be reported and not all of them have the same
    mechanism.
  evidence:
  - reference: PMID:30449416
    reference_title: "Recurrent, Activating Variants in the Receptor Tyrosine Kinase DDR2 Cause Warburg-Cinotti Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In six affected individuals from four families, we found one of two recurrent variants in discoidin domain receptor tyrosine kinase 2 (DDR2): c.1829T>C (p.Leu610Pro) or c.2219A>G (p.Tyr740Cys)."
    explanation: >
      Identifies the two recurrent alleles that molecular testing should
      prioritise.

- name: DDR2 Autophosphorylation Assay in Patient Fibroblasts
  description: >
    Functional confirmation where a variant of uncertain significance needs
    adjudicating. Increased DDR2 phosphorylation in patient fibroblasts was the
    original functional evidence, and the same assay reads out inhibitor
    response.
  evidence:
  - reference: PMID:30449416
    reference_title: "Recurrent, Activating Variants in the Receptor Tyrosine Kinase DDR2 Cause Warburg-Cinotti Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Phosphorylation of DDR2 was increased in fibroblasts from affected individuals, suggesting reduced receptor autoinhibition and ligand-independent kinase activation."
    explanation: >
      The patient-fibroblast assay that established functional consequence.

treatments:
- name: DDR2 Kinase Inhibition (Dasatinib)
  description: >
    Mechanism-directed and preclinical only. Dasatinib prevented DDR2
    autophosphorylation in patient fibroblasts, and the founding authors
    proposed it as an approach to treatment. No patient outcome data have been
    published in the seven years since. Curated because the rationale is
    specific and directly targets the disease's central node - and hedged with
    an attached knowledge gap for the same reason.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dasatinib
      term:
        id: NCIT:C38713
        label: Dasatinib
  target_mechanisms:
  - target: Ligand-Independent Constitutive DDR2 Kinase Activation
    description: >
      Directly inhibits the constitutively active kinase that is the causal
      node of the disease.
    evidence:
    - reference: PMID:30449416
      reference_title: "Recurrent, Activating Variants in the Receptor Tyrosine Kinase DDR2 Cause Warburg-Cinotti Syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Finally, we found that the protein kinase inhibitor dasatinib prevented DDR2 autophosphorylation in fibroblasts, suggesting an approach to treatment."
      explanation: >
        Shows the inhibitor acting on the specific molecular event this node
        describes, in patient-derived cells.
  evidence:
  - reference: PMID:30449416
    reference_title: "Recurrent, Activating Variants in the Receptor Tyrosine Kinase DDR2 Cause Warburg-Cinotti Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, we found that the protein kinase inhibitor dasatinib prevented DDR2 autophosphorylation in fibroblasts, suggesting an approach to treatment."
    explanation: >
      The entire published evidence base for this treatment, which is why it
      carries an attached knowledge gap rather than an efficacy claim.


name: Warburg-Cinotti Syndrome
creation_date: "2026-08-30T19:30:00Z"
category: Mendelian
disease_term:
  preferred_term: Warburg-Cinotti syndrome
  term:
    id: MONDO:0032579
    label: warburg-cinotti syndrome
description: >
  Warburg-Cinotti syndrome (WCS; OMIM 618175) is an ultra-rare autosomal
  dominant connective tissue disorder caused by activating missense variants in
  DDR2, the collagen-binding receptor tyrosine kinase that regulates
  connective-tissue formation. It was defined in 2018 in six affected
  individuals from four families, and by 2024 the literature still described
  only about six cases worldwide. The clinical picture is progressive and
  simultaneously proliferative and destructive: corneal neovascularisation and
  pannus, keloid plaques, chronic skin ulcers, wasting of subcutaneous tissue,
  flexion contractures of the fingers, and acro-osteolysis.

  The mechanism is unusually well resolved for a disease this rare, and it is
  worth stating precisely because the resolution came in two steps seven years
  apart. In 2018 the founding report observed increased DDR2 phosphorylation in
  patient fibroblasts and inferred reduced receptor autoinhibition with
  ligand-independent kinase activation - and, notably, found no evidence for
  activation of other growth-regulatory signalling pathways, so the lesion was
  narrow rather than a general growth-signalling excess. In 2025 the enzymology
  confirmed it and went further: both disease variants autophosphorylate
  constitutively without ligand, and unphosphorylated DDR2-Y740C has catalytic
  rates matching fully phosphorylated wild-type protein. That is not a partial
  release of a brake, it is the fully active conformation reached without any
  activating input. Tyrosine-740 sits in the activation loop and forms
  autoinhibitory hydrogen bonds with catalytic residues; a cysteine cannot form
  them.

  This is therefore a disease in which the qualitative claim - the kinase is
  outside its normal regulatory constraints - is directly measured rather than
  inferred, which is why the pathophysiology node carries
  `modifier: GAIN_OF_FUNCTION` rather than `INCREASED`.

synonyms:
  - WRCN
  - WCS
  - Warburg-Cinotti disease

parents:
  - Hereditary connective tissue disorder
  - RTK gain-of-function disorder

classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:

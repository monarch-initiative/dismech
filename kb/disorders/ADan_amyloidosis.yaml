name: ADan amyloidosis
creation_date: '2026-04-14T12:05:00Z'
category: Mendelian
synonyms:
- familial Danish dementia
- Danish dementia
- heredopathia ophthalmo-oto-encephalica
description: >-
  ADan amyloidosis is an autosomal dominant cerebral amyloidosis caused by
  the Danish ITM2B duplication, which extends the mutant precursor and generates
  the amyloidogenic ADan peptide. Familial Danish dementia is characterized by
  cataracts, progressive hearing loss, ataxia, and dementia together with
  widespread ADan-containing cerebral amyloid angiopathy and neurofibrillary
  degeneration. Human pathology establishes co-occurring ADan, Aβ, and tau
  lesions, but their causal ordering remains incompletely resolved.
disease_term:
  preferred_term: ADan amyloidosis
  term:
    id: MONDO:0007297
    label: ADan amyloidosis
parents:
- hereditary disease
- amyloidosis
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    ADan amyloidosis/familial Danish dementia segregates as an autosomal
    dominant ITM2B-related disorder.
  evidence:
  - reference: PMID:10781099
    reference_title: A decamer duplication in the 3' region of the BRI gene originates an amyloid peptide that is associated with dementia in a Danish kindred.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Familial Danish dementia (FDD), also known as heredopathia ophthalmo-oto-encephalica, is an autosomal dominant disorder characterized by cataracts, deafness, progressive ataxia, and dementia.
    explanation: >-
      This directly establishes autosomal dominant inheritance for familial
      Danish dementia/ADan amyloidosis.
progression:
- phase: Natural history
  age_range: third to sixth decade
  duration: Progressive over decades
  notes: >-
    The published Danish kindred shows staged progression from cataracts in the
    third decade to hearing impairment, cerebellar signs, dementia in later
    adulthood, and death in the fifth or sixth decade.
  evidence:
  - reference: PMID:19779737
    reference_title: Modeling familial British and Danish dementia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinically, FDD is characterized by the development and progression of cataracts during the third decade of life (Strömgren et al. 1970). Hearing impairment was reported to appear 10–20 years following the development of ocular problems. Severe to total perceptive hearing loss developed by the fifth decade of life, with vestibular reflex disturbances, slurred speech, and a swaying gait (Strömgren et al. 1970; Strömgren 1981). Patients with FDD developed cerebellar ataxia with intention tremor in their fourth decade of life, however, unlike FBD cases, did not develop spastic para-paresis. Progressive dementia probably begins in the sixth decade and may be associated with paranoid reactions and temporal disturbances of consciousness. The majority of patients succumb within the fifth or sixth decade of life.
    explanation: >-
      This review summarizes the staged natural history of the Danish kindred.
mechanistic_hypotheses:
- hypothesis_group_id: adan_amyloidogenesis_model
  hypothesis_label: ADan Amyloidogenesis and Cerebral Amyloid Angiopathy Model
  status: CANONICAL
  description: >-
    The Danish ITM2B duplication extends mutant BRI2, generates the 34-residue
    ADan peptide, and enables ADan self-assembly, extracellular deposition, and
    progressive vascular and parenchymal accumulation. The canonical branch is
    limited to ADan amyloidogenesis and ADan-containing cerebral amyloid
    angiopathy; it does not assume that ADan causes Aβ deposition or tauopathy.
  evidence:
  - reference: PMID:10781099
    reference_title: A decamer duplication in the 3' region of the BRI gene originates an amyloid peptide that is associated with dementia in a Danish kindred.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The decamer duplication mutation produces a frame-shift in the BRI sequence generating a larger-than-normal precursor protein, of which the amyloid subunit (designated ADan) comprises the last 34 C-terminal amino acids.
    explanation: >-
      Human genetics identifies the extended precursor and its ADan amyloid
      subunit.
  - reference: PMID:11895040
    reference_title: "Familial Danish dementia: a novel form of cerebral amyloidosis associated with deposition of both amyloid-Dan and amyloid-beta"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We showed that ADan is widely distributed in the central nervous system (CNS) in the leptomeninges, blood vessels, and parenchyma.
    explanation: Human neuropathology establishes progressive vascular and parenchymal ADan accumulation.
- hypothesis_group_id: adan_abeta_codeposition_model
  hypothesis_label: ADan and Aβ Co-deposition Model
  status: EMERGING
  description: >-
    Human postmortem tissue shows that Aβ can co-deposit and spatially
    co-localize with ADan. Whether either peptide seeds the other or whether
    their interaction accelerates human disease is not established.
  notes: >-
    The chemical-mapping study included one FDD case, so this branch is
    descriptive and emerging rather than a canonical causal cascade.
  evidence:
  - reference: PMID:36102248
    reference_title: Chemical traits of cerebral amyloid angiopathy in familial British-, Danish-, and non-Alzheimer's dementias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CAA in FDD is characterized by co-aggregation of ADan with Aβ, while in contrast no Aβ deposition is observed in FBD.
    explanation: >-
      Descriptive human postmortem mapping supports co-aggregation while not
      establishing direction or clinical effect.
- hypothesis_group_id: adan_tau_relationship_model
  hypothesis_label: ADan Amyloidosis and Tau Relationship Model
  status: EMERGING
  description: >-
    Severe human neurofibrillary degeneration is well established, but whether
    it is downstream of ADan or represents a parallel disease characteristic is
    unresolved. This grouping therefore captures the relationship without
    treating amyloid-to-tau causality as canonical.
  evidence:
  - reference: PMID:19779737
    reference_title: Modeling familial British and Danish dementia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, it remains to be determined whether abnormal tau phosphorylation is the consequence of cerebral amyloid deposition or a different disease characteristic, given that hyper-phosphorylated tau can lead to dementia in the absence of amyloid plaques (Goedert et al. 2000).
    explanation: >-
      The review explicitly preserves uncertainty about the causal order of
      amyloid and tau pathology.
- hypothesis_group_id: bri2_loss_app_metabolite_model
  hypothesis_label: Mature BRI2 Loss and APP-Derived Metabolite Model
  status: EMERGING
  description: >-
    FDD knock-in models support reduced mature BRI2, increased APP processing,
    and APP-dependent synaptic and memory dysfunction. The genetically
    implicated toxic APP product is unidentified and should not be assumed to
    be Aβ.
  evidence:
  - reference: PMID:21587206
    reference_title: APP heterozygosity averts memory deficit in knockin mice expressing the Danish dementia BRI2 mutant.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      APP haplodeficiency prevents memory and synaptic dysfunctions, consistent with a role for APP metabolites in the pathogenesis of memory and synaptic deficits.
    explanation: >-
      Mouse genetic suppression implicates APP-derived products without
      identifying a specific toxic metabolite or proving the human mechanism.
- hypothesis_group_id: bri2_loss_glutamatergic_model
  hypothesis_label: Mature BRI2 Loss and Glutamatergic Transmission Model
  status: EMERGING
  description: >-
    Danish-mutation mouse and rat models show reduced mature synaptic BRI2 and
    pre- and postsynaptic glutamatergic abnormalities. Human dementia relevance
    remains an explicit open translational question.
  evidence:
  - reference: PMID:34416235
    reference_title: A familial Danish dementia rat shows impaired presynaptic and postsynaptic glutamatergic transmission.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Collectively, the data show that the pathogenic Danish mutation alters the physiological function of BRI2 at glutamatergic synapses across species and early in life. Future studies will determine whether this phenomenon represents an early pathogenic event in human dementia.
    explanation: >-
      The rat study supports the model mechanism while explicitly withholding
      human causal interpretation.
- hypothesis_group_id: caa_vascular_leak_cerebellar_injury_model
  hypothesis_label: CAA, Vascular Leakage, and Cerebellar Injury Model
  status: EMERGING
  description: >-
    FDD knock-in rat findings support an observational constellation of
    ADan-containing CAA, fibrinogen leakage, reactive microglia/macrophages,
    cerebellar myelin and axonal injury, and motor impairment. Causal order is
    represented as unknown because the study does not establish it directly.
  evidence:
  - reference: PMID:41354963
    reference_title: "Pathological mechanisms of motor dysfunction in familial Danish dementia: insights from a knock-in rat model."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings suggest that CAA and fibrinogen leakage in FDD may drive neuroinflammation, demyelination, and axonal damage in the cerebellum, potentially contributing to the motor and gait impairments observed in FDD.
    explanation: >-
      The authors frame the ordered cascade as a suggestion, not demonstrated
      causation.
- hypothesis_group_id: synthetic_adan_cell_toxicity_model
  hypothesis_label: Synthetic ADan Oxidative-Toxicity Model
  status: EMERGING
  description: >-
    Acute challenge of differentiated SH-SY5Y cells with synthetic
    pyroglutamylated ADan produces oxidative mitochondrial apoptosis. This
    model-specific branch is kept separate from deposited human ADan pathology.
  evidence:
  - reference: PMID:26459115
    reference_title: Oxidative stress and mitochondria-mediated cell death mechanisms triggered by the familial Danish dementia ADan amyloid.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The data presented herein demonstrates that ADan neurotoxicity takes place through a mechanism involving many components of intrinsic apoptosis, including high levels of ROS generation, cyt c release into the cytoplasm, disruption of mitochondrial membrane potential, and final activation of terminal caspase-3.
    explanation: >-
      The cell-line experiment supports the bounded synthetic-peptide toxicity
      model only.
pathophysiology:
- name: ITM2B Danish Duplication and Mutant Precursor Extension
  description: >-
    The germline Danish 10-nucleotide duplication near the ITM2B stop codon
    causes a frameshift and C-terminal extension of mutant BRI2. It is the
    common upstream lesion for the ADan-gain and mature-BRI2-loss branches.
  genes:
  - preferred_term: ITM2B
    term:
      id: hgnc:6174
      label: ITM2B
  evidence:
  - reference: PMID:10781099
    reference_title: A decamer duplication in the 3' region of the BRI gene originates an amyloid peptide that is associated with dementia in a Danish kindred.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The decamer duplication mutation produces a frame-shift in the BRI sequence generating a larger-than-normal precursor protein, of which the amyloid subunit (designated ADan) comprises the last 34 C-terminal amino acids.
    explanation: >-
      Human genetics directly identifies the initiating duplication, extended
      precursor, and ADan sequence.
  downstream:
  - target: Amyloidogenic ADan Precursor Peptide
    description: Convertase processing of the extended mutant precursor releases the 34-residue ADan peptide.
    causal_link_type: DIRECT
    hypothesis_groups:
    - adan_amyloidogenesis_model
    evidence:
    - reference: PMID:10781099
      reference_title: A decamer duplication in the 3' region of the BRI gene originates an amyloid peptide that is associated with dementia in a Danish kindred.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The decamer duplication mutation produces a frame-shift in the BRI sequence generating a larger-than-normal precursor protein, of which the amyloid subunit (designated ADan) comprises the last 34 C-terminal amino acids.
      explanation: The human mutation directly generates the extended precursor containing ADan.
  - target: Reduced Mature BRI2 at Synapses
    description: >-
      Cellular and knock-in-model evidence indicates that the Danish mutant
      precursor is inefficiently matured, reducing functional mature BRI2.
    causal_link_type: DIRECT
    hypothesis_groups:
    - bri2_loss_app_metabolite_model
    - bri2_loss_glutamatergic_model
    evidence:
    - reference: PMID:33172889
      reference_title: Danish and British dementia ITM2b/BRI2 mutations reduce BRI2 protein stability and impair glutamatergic synaptic transmission.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In summary, these observations indicate that pathogenic mutation reduces maturation and plasma membrane localization of mBRI2.
      explanation: Transfected-cell experiments support mutant-protein maturation loss; human synaptic magnitude remains uncertain.
  - target: Cataract
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The ITM2B frameshift syndrome includes early ocular involvement with cataracts, but the tissue-level ocular mechanism is not yet separated in this pathograph.
    evidence:
    - reference: PMID:10781099
      reference_title: A decamer duplication in the 3' region of the BRI gene originates an amyloid peptide that is associated with dementia in a Danish kindred.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Familial Danish dementia (FDD), also known as heredopathia ophthalmo-oto-encephalica, is an autosomal dominant disorder characterized by cataracts, deafness, progressive ataxia, and dementia.
      explanation: The syndrome association is established, while the ocular intermediate is unknown.
  - target: Sensorineural hearing impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The same ITM2B frameshift syndrome includes progressive otologic involvement with perceptive hearing loss, although the cochlear mechanism remains unresolved here.
    evidence:
    - reference: PMID:10781099
      reference_title: A decamer duplication in the 3' region of the BRI gene originates an amyloid peptide that is associated with dementia in a Danish kindred.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Familial Danish dementia (FDD), also known as heredopathia ophthalmo-oto-encephalica, is an autosomal dominant disorder characterized by cataracts, deafness, progressive ataxia, and dementia.
      explanation: The syndrome association is established, while the auditory intermediate is unknown.
- name: Amyloidogenic ADan Precursor Peptide
  conforms_to: amyloidogenesis#Amyloidogenic Precursor Protein
  role: trigger
  description: >-
    Convertase cleavage of the extended mutant BRI2 precursor produces the
    34-residue ADan peptide, whose C-terminal extension completes an otherwise
    incomplete amyloid-forming motif.
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  evidence:
  - reference: PMID:40314981
    reference_title: Massive mutagenesis reveals an incomplete amyloid motif in Bri2 that turns amyloidogenic upon C-terminal extension.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Stop-loss in ITM2B/BRI2 results in C-terminal extension of the encoded protein and, upon furin cleavage, in the production of two 34 amino acid long peptides, ADan and ABri, that accumulate as amyloids in the brains of patients affected by familial Danish and British Dementia.
    explanation: >-
      The primary study states the processing consequence; its mechanistic
      assay is yeast-based and does not itself model human secretory processing.
  downstream:
  - target: ADan Misfolding and Beta-Sheet Oligomerization
    description: The extended ADan sequence contains an amyloid core that supports nucleation and self-assembly.
    causal_link_type: DIRECT
    hypothesis_groups:
    - adan_amyloidogenesis_model
    evidence:
    - reference: PMID:40314981
      reference_title: Massive mutagenesis reveals an incomplete amyloid motif in Bri2 that turns amyloidogenic upon C-terminal extension.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        To systematically explore the consequences of Bri2 C-terminal extension, here, we use a yeast-based massively parallel assay to measure amyloid formation for 676 ADan substitutions and identify the region that forms the putative amyloid core of ADan fibrils, located between positions 20 and 26, where stop-loss occurs.
      explanation: The yeast assay maps the putative ADan core; in-vivo kinetics are not established.

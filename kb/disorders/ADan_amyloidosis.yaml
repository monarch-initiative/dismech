discussions:
- discussion_id: interpretation_adan_abeta_tau_causal_order
  prompt: >-
    Do ADan accumulation, Aβ co-deposition, and tau degeneration form an ordered
    human causal cascade, or are Aβ and tau parallel or modifying pathologies in
    familial Danish dementia?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Cerebral ADan Amyloid Accumulation
  - pathophysiology#Aβ Co-deposition with ADan
  - pathophysiology#Neurofibrillary Degeneration
  rationale: >-
    Human postmortem studies establish that ADan, selected Aβ species, and
    severe tau pathology coexist, but neither their direction nor necessity is
    resolved. The graph therefore treats ADan amyloidogenesis as canonical,
    Aβ co-deposition as descriptive, and the amyloid–tau edge as unknown rather
    than converting co-occurrence into a linear cascade.
  evidence:
  - reference: PMID:11895040
    reference_title: "Familial Danish dementia: a novel form of cerebral amyloidosis associated with deposition of both amyloid-Dan and amyloid-beta"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The significance of concurrent ADan and Abeta deposition in FDD is under further investigation.
    explanation: The human pathology study explicitly leaves the significance of co-deposition unresolved.
  - reference: PMID:19779737
    reference_title: Modeling familial British and Danish dementia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, it remains to be determined whether abnormal tau phosphorylation is the consequence of cerebral amyloid deposition or a different disease characteristic, given that hyper-phosphorylated tau can lead to dementia in the absence of amyloid plaques (Goedert et al. 2000).
    explanation: The review explicitly preserves uncertainty about amyloid-to-tau direction.
- discussion_id: mismatch_fdd_ki_rat_vascular_cascade
  prompt: >-
    How faithfully does the homozygous Danish, humanized-APP FDD-KI rat model
    reproduce human vascular amyloid topology and the proposed sequence from
    CAA through leakage, inflammation, white-matter injury, and motor deficits?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#ADan-Containing Cerebral Amyloid Angiopathy
  - pathophysiology#Cerebrovascular Permeability and Fibrinogen Leakage
  - pathophysiology#Reactive Microglial and Macrophage Activation
  - pathophysiology#Cerebellar Myelin Disruption and Axonal Loss
  - pathophysiology#Motor and Gait Dysfunction in FDD-KI Rats
  rationale: >-
    The rat supports a useful vascular-injury constellation, but it carries a
    homozygous Danish allele and humanized App background rather than the human
    heterozygous genotype. Its Aβ-CAA is capillary-predominant, unlike the
    subpial-large-vessel predominance in FDD, and the proposed injury sequence
    is observational. Each causal edge is therefore typed UNKNOWN.
  evidence:
  - reference: PMID:41354963
    reference_title: "Pathological mechanisms of motor dysfunction in familial Danish dementia: insights from a knock-in rat model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Additionally, vascular Aβ deposits (Aβ-CAA) were present in FDD-KI rats, but Aβ-CAA patterns showed some differences between species: in FDD patients, Aβ-CAAs were more abundant in subpial large vessels, while in FDD-KI rats, Aβ-CAA was mostly observed in capillaries.
    explanation: This directly documents a cross-species difference in vascular Aβ topology.
  - reference: PMID:41354963
    reference_title: "Pathological mechanisms of motor dysfunction in familial Danish dementia: insights from a knock-in rat model."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings suggest that CAA and fibrinogen leakage in FDD may drive neuroinflammation, demyelination, and axonal damage in the cerebellum, potentially contributing to the motor and gait impairments observed in FDD.
    explanation: The authors present the ordered sequence as a suggestion rather than demonstrated mediation.
- discussion_id: mismatch_bri2_app_synaptic_models
  prompt: >-
    Do reduced mature BRI2, altered glutamatergic transmission, and increased
    APP-derived metabolites constitute an early human FDD mechanism, or are
    they model-specific effects of the mouse and humanized-APP rat systems?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Mature BRI2 at Synapses
  - pathophysiology#Impaired Glutamatergic Transmission in FDD Models
  - pathophysiology#Increased APP Processing and APP-Derived Metabolite Burden
  - pathophysiology#Synaptic and Memory Dysfunction in FDD Knock-In Models
  rationale: >-
    Genetic rescue in a heterozygous knock-in mouse and electrophysiology in a
    homozygous humanized-APP rat strongly support model-level branches. Human
    support is limited to ex-vivo measurements from one FDD and one control
    brain, and the APP-derived toxic species remains unidentified. These nodes
    are therefore emerging mechanisms rather than a direct route to human
    dementia.
  evidence:
  - reference: PMID:34416235
    reference_title: A familial Danish dementia rat shows impaired presynaptic and postsynaptic glutamatergic transmission.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Future studies will determine whether this phenomenon represents an early pathogenic event in human dementia.
    explanation: The rat study itself identifies human relevance as future work.
  - reference: PMID:21841249
    reference_title: Increased AbetaPP processing in familial Danish dementia patients.
    supports: PARTIAL

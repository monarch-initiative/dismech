differential_diagnoses:
- name: Alzheimer disease
  disease_term:
    preferred_term: Alzheimer disease
    term:
      id: MONDO:0004975
      label: Alzheimer disease
  description: >-
    ADan amyloidosis overlaps with Alzheimer disease through dementia,
    amyloid deposition, and neurofibrillary pathology, but the Danish ITM2B
    duplication, ADan peptide, and early cataract-hearing-ataxia sequence
    distinguish the inherited Danish syndrome.
  distinguishing_features:
  - Danish 10-nucleotide ITM2B duplication rather than an Alzheimer disease causal genotype
  - ADan peptide rather than primary Aβ amyloid
  - Cataract and progressive hearing impairment precede the neurologic syndrome
  evidence:
  - reference: PMID:10781099
    reference_title: A decamer duplication in the 3' region of the BRI gene originates an amyloid peptide that is associated with dementia in a Danish kindred.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neuropathological findings include severe widespread cerebral amyloid angiopathy, hippocampal plaques, and neurofibrillary tangles, similar to Alzheimer's disease.
    explanation: >-
      This directly supports Alzheimer disease as an important neuropathologic
      differential.
- name: Familial British dementia
  disease_term:
    preferred_term: ABri amyloidosis
    term:
      id: MONDO:0008306
      label: ABri amyloidosis
  description: >-
    Familial British dementia is another chromosome 13/ITM2B amyloidosis and
    may resemble ADan amyloidosis through progressive dementia, ataxia, cerebral
    amyloid angiopathy, and Alzheimer-like tau pathology, but it generates ABri
    rather than ADan and has prominent spastic tetraparesis.
  distinguishing_features:
  - ABri rather than ADan amyloid peptide
  - Prominent spastic tetraparesis or spastic paraparesis in FBD
  - FDD has earlier ocular and hearing manifestations and lacks the spastic paraparesis pattern emphasized for FBD
  evidence:
  - reference: PMID:19779737
    reference_title: Modeling familial British and Danish dementia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical symptoms in patients with FBD appear during the fifth decade of life and include progressive dementia, spastic tetraparesis, and cerebellar ataxia.
    explanation: >-
      This supports FBD as a clinically overlapping dementia/ataxia differential
      and identifies spastic tetraparesis as a distinguishing feature.
  - reference: PMID:19779737
    reference_title: Modeling familial British and Danish dementia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with FDD developed cerebellar ataxia with intention tremor in their fourth decade of life, however, unlike FBD cases, did not develop spastic para-paresis.
    explanation: >-
      This directly contrasts the absence of the emphasized spastic-paraparesis
      pattern in FDD with FBD.
  - reference: PMID:36102248
    reference_title: Chemical traits of cerebral amyloid angiopathy in familial British-, Danish-, and non-Alzheimer's dementias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CAA in FDD is characterized by co-aggregation of ADan with Aβ, while in contrast no Aβ deposition is observed in FBD.
    explanation: >-
      Postmortem chemical mapping adds a peptide-deposition distinction between
      the two ITM2B amyloidoses.
  - reference: PMID:19779737
    reference_title: Modeling familial British and Danish dementia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 34 amino acid carboxy-terminal (C-terminal) peptide of the mutant protein was isolated from amyloid deposits from FBD patients and was referred to as British amyloid (ABri) (Vidal et al. 1999, 2000b).
    explanation: >-
      ABri peptide generation distinguishes familial British dementia from the
      ADan peptide mechanism in familial Danish dementia.
animal_models:
- species: Rattus norvegicus
  genotype: Itm2bD/D; Apph/h (homozygous Danish knock-in with two humanized App alleles)
  description: >-
    The FDD-KI rat combines a homozygous endogenous Itm2b Danish allele with
    two humanized App alleles. Young animals model early glutamatergic
    abnormalities, whereas aged animals model vascular ADan/Aβ deposition,
    fibrinogen leakage, neuroinflammation, demyelination, axonal injury, and
    motor/gait deficits. Its Aβ vascular topology differs from human FDD.
  evidence:
  - reference: PMID:41354963
    reference_title: "Pathological mechanisms of motor dysfunction in familial Danish dementia: insights from a knock-in rat model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this study, we investigate the pathological mechanisms linking CAA, white matter damage, and motor dysfunction using a recently developed FDD knock-in (FDD-KI) rat model.
    explanation: >-
      This establishes the FDD knock-in rat model and its use for motor and
      white-matter pathophysiology.
  - reference: PMID:41354963
    reference_title: "Pathological mechanisms of motor dysfunction in familial Danish dementia: insights from a knock-in rat model."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Additionally, vascular Aβ deposits (Aβ-CAA) were present in FDD-KI rats, but Aβ-CAA patterns showed some differences between species: in FDD patients, Aβ-CAAs were more abundant in subpial large vessels, while in FDD-KI rats, Aβ-CAA was mostly observed in capillaries.
    explanation: >-
      The study directly documents a species-discordant vascular distribution,
      limiting translational interpretation of the rat CAA topology.
  - reference: PMID:41354963
    reference_title: "Pathological mechanisms of motor dysfunction in familial Danish dementia: insights from a knock-in rat model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Motor function assessments in FDD-KI rats demonstrated age-accelerated motor deficits and gait abnormalities, mirroring the clinical characteristics of FDD patients.
    explanation: >-
      The rat model recapitulates motor and gait abnormalities relevant to the
      human disorder.
  - reference: PMID:41354963
    reference_title: "Pathological mechanisms of motor dysfunction in familial Danish dementia: insights from a knock-in rat model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings suggest that CAA and fibrinogen leakage in FDD may drive neuroinflammation, demyelination, and axonal damage in the cerebellum, potentially contributing to the motor and gait impairments observed in FDD.
    explanation: >-
      This supports the model's vascular leakage, neuroinflammation, and white
      matter injury mechanism for motor dysfunction.
  - reference: PMID:34416235
    reference_title: A familial Danish dementia rat shows impaired presynaptic and postsynaptic glutamatergic transmission.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that periadolescent Itm2bD rats not only present subtle changes in human Aβ levels along with decreased spontaneous glutamate release and α-amino-3-hydroxy-5-methyl-4-isoxazolepropionic acid receptor-mediated responses but also had increased short-term synaptic facilitation in the hippocampal Schaeffer-collateral pathway.
    explanation: >-
      Periadolescent rats support an early pre- and postsynaptic model branch,
      separate from the aged vascular-injury findings.
- species: Mus musculus
  genotype: FDD(KI) Bri2/Itm2bD/+ knock-in; APP-dosage rescue cohort
  description: >-
    Genetically congruous heterozygous FDD knock-in mice carry one Danish and
    one wild-type Itm2b allele. They show reduced BRI2, synaptic-plasticity and
    memory impairments; APP haplodeficiency genetically suppresses those model
    endpoints without identifying the responsible APP-derived metabolite.
  evidence:
  - reference: PMID:21587206
    reference_title: APP heterozygosity averts memory deficit in knockin mice expressing the Danish dementia BRI2 mutant.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Analysis of FDD(KI) mice, a mouse model of FDD genetically congruous to the human disease since they carry one mutant and one wild-type Bri2/Itm2b allele, has shown that the Danish mutation causes loss of Bri2 protein, synaptic plasticity and memory impairments.
    explanation: >-
      This defines the genotype and measured endpoints of the heterozygous
      knock-in model.
  - reference: PMID:21587206
    reference_title: APP heterozygosity averts memory deficit in knockin mice expressing the Danish dementia BRI2 mutant.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      APP haplodeficiency prevents memory and synaptic dysfunctions, consistent with a role for APP metabolites in the pathogenesis of memory and synaptic deficits.
    explanation: >-
      Genetic rescue implicates an APP-derived product in this mouse model but
      does not identify it or establish the same causal route in humans.
- species: Mus musculus
  genotype: Tg-FDD/mTau-/- (vascular-amyloid transgene crossed to tau-null mice)
  description: >-
    A transgenic FDD vascular-amyloid model crossed to tau-null mice tests tau
    as a modifier of model CAA. Tau depletion improved model vascular, synaptic,
    motor, and inflammatory endpoints, but the transgenic context and unresolved
    human ADan–Aβ–tau ordering preclude a treatment claim for FDD.
  evidence:
  - reference: PMID:40346706
    reference_title: Tau depletion diminishes vascular amyloid-related deficits in a mouse model of cerebral amyloid angiopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We crossed the Familial Danish Dementia mouse model (Tg-FDD), which develops vascular amyloid, with tau-null (mTau-/-) mice to generate a CAA model lacking endogenous tau (Tg-FDD/mTau-/-).
    explanation: This defines the transgenic/tau-null model used to test tau as a modifier.
  - reference: PMID:40346706
    reference_title: Tau depletion diminishes vascular amyloid-related deficits in a mouse model of cerebral amyloid angiopathy.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Tau depletion ameliorated motor and synaptic impairments, reduced vascular amyloid deposition, and prevented vascular damage.
    explanation: >-
      Model rescue supports tau as an emerging modifier, not a validated human
      causal direction or therapy.
- species: Drosophila melanogaster
  genotype: UAS-ADan transgenic expression
  description: >-
    Site-directed Drosophila UAS lines expressing ADan model amyloid-peptide
    neurotoxicity, with ADan showing the strongest eye and CNS toxicity among
    the tested peptides and early age-dependent climbing impairment.
  evidence:
  - reference: DOI:10.1186/1750-1326-9-5
    reference_title: Amyloid peptides ABri and ADan show differential neurotoxicity in transgenic Drosophila models of familial British and Danish dementia
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The highest toxicity was seen for ADan, followed by Aβ42 and ABri.
    explanation: >-
      This supports ADan neurotoxicity in the Drosophila eye model.
  - reference: DOI:10.1186/1750-1326-9-5
    reference_title: Amyloid peptides ABri and ADan show differential neurotoxicity in transgenic Drosophila models of familial British and Danish dementia
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This effect was stronger for ADan, detected at 7 days post-eclosion, and followed by ABri and Aβ42, whose toxicity became evident after 15 and 21 days, respectively.
    explanation: >-
      This supports age-dependent ADan-associated motor dysfunction in the
      Drosophila CNS model.

      explanation: The type II case report documents reduced beta-galactosidase-1 activity.
  - target: Neuronal Lysosomal GM1 Ganglioside Accumulation
    description: Reduced beta-galactosidase activity allows GM1 ganglioside accumulation in neuronal lysosomes.

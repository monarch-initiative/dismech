pathophysiology:
- name: Partial Beta-Galactosidase Catalytic Deficiency
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  biological_scale: MOLECULAR
  description: >-
    Biallelic GLB1 variants reduce lysosomal beta-galactosidase catalytic
    activity while retaining low residual activity (often via compound
    heterozygosity with a hypomorphic missense allele), impairing cleavage of
    terminal beta-linked galactose from GM1 ganglioside, oligosaccharides, and
    keratan sulfate.
  genes:
  - preferred_term: GLB1
    term:
      id: hgnc:4298
      label: GLB1
  molecular_functions:

      label: glycosaminoglycan catabolic process
  evidence:
  - reference: PMID:33859490
    reference_title: "GM1 Gangliosidosis: Mechanisms and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mutation of the GLB1 gene, which codes for β-gal, prevents cleavage of the terminal β-1,4-linked galactose residue from GM1 ganglioside."
    explanation: "GLB1 deficiency blocks GM1 ganglioside degradation; partial activity gives the intermediate phenotype."
  - reference: PMID:31937438
    reference_title: "The natural history of Type 1 infantile GM1 gangliosidosis: A literature-based meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Disease severity is associated with the residual activity of the mutant βgal enzyme, with activity nearly absent in Type 1-associated mutations and a small amount of residual activity in Type 2 and 3 patients"
    explanation: Establishes that low residual beta-galactosidase activity distinguishes type II from near-null type I disease.
  downstream:
  - target: Decreased beta-galactosidase activity
    description: GLB1 variants reduce measured lysosomal beta-galactosidase enzymatic activity.
    causal_link_type: DIRECT
    evidence:

classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Late-infantile and juvenile GM1 gangliosidosis is an inborn error of
      lysosomal glycosphingolipid catabolism caused by partial beta-galactosidase
      deficiency.
    evidence:
    - reference: PMID:34539759
      reference_title: "GM1 Gangliosidosis-A Mini-Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "GM1 gangliosidosis is a progressive, neurosomatic, lysosomal storage disorder caused by mutations in the GLB1 gene encoding the enzyme β-galactosidase."
      explanation: Establishes GM1 gangliosidosis as an inherited metabolic lysosomal storage disorder.
  - classification_value: NEUROLOGIC
    notes: >-
      Progressive central nervous system neurodegeneration with cognitive, motor,
      and speech decline dominates the clinical phenotype.
    evidence:
    - reference: PMID:24156116
      reference_title: "GLB1-Related Disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Central nervous system dysfunction manifests as progressive cognitive, motor, and speech decline as measured by psychometric testing."
      explanation: GeneReviews characterizes type II GM1 gangliosidosis by progressive central nervous system dysfunction.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Autosomal recessive Mendelian disorder caused by biallelic pathogenic
      variants in GLB1.
    evidence:
    - reference: PMID:24156116
      reference_title: "GLB1-Related Disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "GLB1-related disorders are inherited in an autosomal recessive manner."
      explanation: Confirms autosomal recessive Mendelian inheritance of GLB1-related GM1 gangliosidosis.
  lysosomal_storage_category:
    classification_value: sphingolipidosis
    notes: >-
      Partial beta-galactosidase deficiency impairs cleavage of the terminal
      galactose from the glycosphingolipid GM1 ganglioside, causing lysosomal
      sphingolipid storage.
    evidence:
    - reference: PMID:34539759
      reference_title: "GM1 Gangliosidosis-A Mini-Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Absent or reduced β-galactosidase activity leads to the accumulation of β-linked galactose-containing glycoconjugates including the glycosphingolipid (GSL) GM1-ganglioside in neuronal tissue."
      explanation: Supports classification as a sphingolipidosis of GM1 ganglioside catabolism.

treatments:
- name: Supportive Care
  description: >-
    No FDA-approved disease-modifying therapy exists; multidisciplinary
    management across biochemical genetics, neurology, cardiology, orthopedics,
    nutrition, and rehabilitation is supportive. Recommended surveillance
    includes yearly neurologic, physiotherapy, nutritional, seizure-risk,
    cervical spine stability, and hip dislocation assessments, plus
    electrocardiogram, echocardiogram, and eye examination every 1 to 3 years.
    Agents and circumstances to avoid include unplanned anesthesia management
    (given skeletal and airway risks), psychotropic medications (risk of
    worsening neurologic disease), aspiration-prone feeding positions, seizure
    medication dosages that cause excessive sedation, and fall-risk situations.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Seizures
    treatment_effect: INHIBITS
    description: Neurologic surveillance and antiseizure management aim to control seizures while avoiding excessive sedation.
  - target: Skeletal disease (kyphosis)
    treatment_effect: MODULATES
    description: Orthopedic and physiotherapy management address progressive skeletal involvement and mobility decline.
  evidence:
  - reference: PMID:33859490
    reference_title: "GM1 Gangliosidosis: Mechanisms and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Beyond palliative and supportive care, no FDA-approved treatments exist for GM1 patients."
    explanation: "Care is supportive in the absence of approved disease-modifying therapy."
  - reference: PMID:24156116
    reference_title: "GLB1-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Best provided by specialists in biochemical genetics, cardiology, orthopedics, and neurology and therapists knowledgeable about GLB1-related disorders"
    explanation: GeneReviews recommends multidisciplinary supportive care across biochemical genetics, cardiology, orthopedics, neurology, and rehabilitation therapy.
  - reference: PMID:24156116
    reference_title: "GLB1-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Assess yearly: quality of life by neurologist, physiotherapist and nutritionist; \nseizure risk by a neurologist; cervical spine stability; and hip dislocation \nrisk. Perform every one to three years: electrocardiogram, echocardiogram, and \neye examination."
    explanation: GeneReviews establishes the annual neurologic/orthopedic/nutritional and 1-to-3-year cardiac and ophthalmologic surveillance schedule for GM1 gangliosidosis.
  - reference: PMID:24156116
    reference_title: "GLB1-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Unplanned anesthesia management due to increased \nrisk for complications; psychotropic medications because of the risk of \nworsening neurologic disease; positioning that increases aspiration risk during \nfeedings, seizure medication dosages that result in excessive sedation, and \ncircumstances that exacerbate fall risk for those with GM1 gangliosidosis"
    explanation: GeneReviews specifies agents and circumstances to avoid in GM1 gangliosidosis, including unplanned anesthesia, psychotropics, aspiration-prone feeding positions, overly sedating antiseizure dosages, and fall hazards.

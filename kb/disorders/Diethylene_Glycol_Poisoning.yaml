    term:
      id: NCIT:C15747
      label: Supportive Care
    therapeutic_agent:
    - preferred_term: sodium bicarbonate
      term:
        id: CHEBI:32139
        label: sodium hydrogencarbonate
  evidence:
  - reference: PMID:36939119
    reference_title: Variable sensitivity to diethylene glycol poisoning is related to differences in the uptake transporter for the toxic metabolite diglycolic acid.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Current therapy centers on supportive care such as bicarbonate to combat the acidosis and the use of extracorporeal measures to remove DEG and its metabolites (such removal is implied, although it has not really been shown experimentally) and to fix acid-base abnormalities"
    explanation: >-
      Describes current practice, and is carried with the authors' own
      parenthesis intact - they note that extracorporeal removal of the
      toxin is assumed rather than demonstrated, which qualifies the
      Hemodialysis entry as well as this one.
  - reference: PMID:37186212
    reference_title: "Renal toxicity caused by diethylene glycol: an overview."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The management includes supportive care, gastric decontamination, correction of acid-base disorders, and hemodialysis."
    explanation: >-
      The management list this treatment entry covers the first three
      elements of.
- name: Hemodialysis
  description: >-
    Clears the parent compound - measured across a dialysis session in a treated
    child - and becomes renal replacement once tubular necrosis is
    established. A human case series reports acidaemia and renal impairment
    responding to emergent haemodialysis. Its availability matters: the
    paediatric epidemics in resource-constrained settings record
    deterioration despite peritoneal dialysis, and their authors call for
    haemodialysis facilities to be provided. An earlier draft asserted that
    haemodialysis availability was the main determinant of survival in the
    outbreaks and that peritoneal dialysis clears these solutes far less
    efficiently; neither is stated by a cited source and both were removed.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Hemodialysis
    term:
      id: NCIT:C15248
      label: Hemodialysis
  target_mechanisms:
  - target: Systemic Diethylene Glycol Exposure
    treatment_effect: INHIBITS
    description: >-
      Removes the parent compound from the circulation, lowering the
      systemic burden that everything downstream depends on. This is the
      only treatment here that acts on the exposure node itself rather than
      on a metabolic step.
    evidence:
    - reference: PMID:10793034
      reference_title: Childhood diethylene glycol poisoning treated with alcohol dehydrogenase inhibitor fomepizole and hemodialysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Pre-HD and post-HD DEG levels support clearance of DEG with HD."
      explanation: >-
        Measured clearance of the parent compound across a dialysis session,
        which is exactly what this edge asserts. Note the qualification
        carried on the supportive-care entry: one cited source describes
        extracorporeal removal as implied rather than experimentally shown,
        and this case measures levels in a single patient.
  evidence:
  - reference: PMID:15902788
    reference_title: Delayed neurologic sequelae resulting from epidemic diethylene glycol poisoning.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report a series of seven patients presenting with epidemic DEG poisoning from a correctional facility with varying degrees of metabolic acidemia and acute renal impairment responding to emergent hemodialysis (HD)."
    explanation: >-
      The affirmative human evidence: acidaemia and renal impairment
      responding to emergent haemodialysis.
  - reference: PMID:10793034
    reference_title: Childhood diethylene glycol poisoning treated with alcohol dehydrogenase inhibitor fomepizole and hemodialysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Pre-HD and post-HD DEG levels support clearance of DEG with HD."
    explanation: >-
      Measured clearance of the parent compound across a dialysis session,
      which is the specific claim that haemodialysis removes the toxin rather
      than only replacing renal function.
  - reference: PMID:22246572
    reference_title: Diagnosing renal failure due to diethylene glycol in children in a resource-constrained setting.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "They developed increasing metabolic acidosis and multiorgan dysfunction despite peritoneal dialysis."
    explanation: >-
      INDIRECT, and kept for a different point than the two items above: the
      modality available in that outbreak did not arrest the syndrome, which
      is why haemodialysis rather than dialysis in general is named here.
  notes: >-
    `NCIT:C15248` Hemodialysis is used rather than a broader procedure term.
    The deep research report offered `NCIT:C15571` for hemodialysis; that
    identifier is Differentiation Therapy, and was not used. The query run
    was a search of the OLS `ncit` index for "Hemodialysis", which returns
    `NCIT:C15248` as the exact match.
diagnosis:
- name: Serum diethylene glycol and metabolite quantification
  description: >-
    The definitive test, and rarely available where the outbreaks happen.
    Chromatographic measurement of the parent compound and its acid
    metabolites is what confirmed the exposure route in the Panama
    investigation, working from patient samples back to the contaminated
    excipient.
  diagnosis_term:
    preferred_term: chromatographic quantification of serum diethylene glycol and its metabolites
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  notes: >-
    Bound to the generic procedure term because the specific one is out of
    range. `NCIT:C111203` Gas Chromatography Mass Spectrometry names the
    technique exactly but is not reachable from `NCIT:C25218` Clinical
    Intervention or Procedure, the root of the `TreatmentActionTerm` enum
    that `diagnosis_term` uses, so `just validate-terms` rejects it - the
    same class of failure as binding a device term in a clinical-action
    slot. `preferred_term` carries the technique and the analytes.
  evidence:
  - reference: PMID:18949211
    reference_title: "Outbreak of acute renal failure in Panama in 2006: a case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Laboratory analyses confirmed the presence of diethylene glycol (DEG) in biological samples from case patients, 8% DEG contamination in cough syrup samples and 22% contamination in the glycerin used to prepare the cough syrup."
    explanation: >-
      Laboratory confirmation in patient samples and in the product, which is
      what this test establishes.
- name: Clinical recognition without toxicological confirmation
  description: >-
    The diagnosis that is actually made in most of the world. Where assay is
    unavailable, the combination of a drug history, a worsening metabolic
    acidosis and multiorgan deterioration that does not respond to dialysis
    is what raises suspicion - and the authors who set out this approach are
    explicit that identifying the syndrome this way is difficult.
  evidence:
  - reference: PMID:22246572
    reference_title: Diagnosing renal failure due to diethylene glycol in children in a resource-constrained setting.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Detailed drug history, increasing metabolic acidosis, and multiorgan deterioration despite peritoneal dialysis should arouse suspicion."
    explanation: >-
      The clinical triad this diagnosis rests on, from a study designed
      around the absence of toxicology facilities.
  - reference: PMID:33475432
    reference_title: Neurotoxic effects of nephrotoxic compound diethylene glycol.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Blood work shows increased BUN and creatinine levels and osmolal gap along with a metabolic acidosis, but such results could allude to a spectrum of illnesses"
    explanation: >-
      Why routine bloods cannot make this diagnosis: the abnormalities are
      real but non-specific. INDIRECT and BACKGROUND because the citing
      paper is a rat study and this is its framing of the human diagnostic
      problem.
  - reference: PMID:10793034
    reference_title: Childhood diethylene glycol poisoning treated with alcohol dehydrogenase inhibitor fomepizole and hemodialysis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Patients presenting less than 12 hours after DEG ingestion may not show metabolic acidosis, whereas those presenting later may show florid metabolic acidosis."
    explanation: >-
      INDIRECT and a caution rather than a criterion: the acidosis that
      anchors clinical recognition is time-dependent, so an early
      presentation can look reassuring. Graded BACKGROUND because the
      sentence states the established kinetic picture the case report is
      framed against.
prevalence:
- population: Worldwide paediatric mass poisonings reported up to 2010
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A cumulative death toll across epidemics rather than a rate in a defined
    population at risk, which is the only form this disease's occurrence
    takes - there is no background incidence between outbreaks.
  evidence:
  - reference: PMID:21062849
    reference_title: Epidemics of acute renal failure in children (diethylene glycol toxicity).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "More than 300 children worldwide have died from DEG poisoning."
    explanation: >-
      The cumulative paediatric figure as of this review, carried with its
      date attached rather than as a current total.
- population: The Gambia, 2022 outbreak
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Included because the entry's other records stop in 2010 and this is not a
    historical disease: the 2022 wave, traced to syrup medications from a
    single manufacturer, reached The Gambia, Indonesia and Uzbekistan.
  evidence:
  - reference: PMID:36862590
    reference_title: "Acute Kidney Injury Among Children Likely Associated with Diethylene Glycol-Contaminated Medications - The Gambia, June-September 2022."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The preliminary investigation suggested that various contaminated syrup-based children's medications contributed to the AKI outbreak."
    explanation: >-
      The outbreak investigation's own finding, stated with the hedge its
      authors used - this was a preliminary attribution at publication.
- population: Panama, 2006 outbreak
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Adults rather than children, with a median age of 68 - unusual among
    these outbreaks and a consequence of the vehicle being a prescription
    cough syrup rather than a paediatric preparation.
  evidence:
  - reference: PMID:18949211
    reference_title: "Outbreak of acute renal failure in Panama in 2006: a case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Twelve (57%) of 21 patients had died of the illness."
    explanation: >-
      The case fatality among the initially identified patients that prompted
      the outbreak investigation.
animal_models:
- name: Diglycolic acid gavage in the rat
  species: Rat
  genotype: Wild-type Wistar
  publication: PMID:28074668
  description: >-
    The metabolite given directly, bypassing diethylene glycol entirely. This
    is the in vivo counterpart of the cell-culture result and is what makes
    diglycolic acid sufficient rather than merely correlated.
  modeled_mechanisms:
  - target: Proximal Tubular ATP Depletion and Necrosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the renal injury from the metabolite alone. Retargeted from
      the transporter node during review: what this study measures is tissue
      accumulation and organ injury, not transporter-mediated uptake.
    limitations: >-
      The rat requires a far larger diethylene glycol dose than a human to
      reach the same lesion, so the dose-response is not transferable, and
      this design administers the metabolite rather than testing whether
      ingestion produces it.
    evidence:
    - reference: PMID:28074668
      reference_title: In-vivo evidence of nephrotoxicity and altered hepatic function in rats following administration of diglycolic acid, a metabolite of diethylene glycol.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "DGA concentrations in the kidneys and liver correlated with renal and hepatic injury, respectively."
      explanation: >-
        Ties tissue accumulation of the metabolite to the organ injury, which
        is the claim this link makes.
- name: High-dose diethylene glycol gavage in the rat
  species: Rat
  genotype: Wild-type Wistar and Fischer-344
  publication: PMID:25545985
  description: >-
    A dose-response design across two strains that establishes a steep
    threshold: below it, neither metabolite accumulation nor toxicity occurs.
  modeled_mechanisms:
  - target: Diglycolic Acid Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      The threshold sits far above the human toxic dose, so the model
      establishes the necessity of metabolite accumulation without
      transferring the dose at which it happens.
    evidence:
    - reference: PMID:25545985
      reference_title: Diethylene glycol-induced toxicities show marked threshold dose response in rats.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Kidney diglycolic acid (DGA), the presumed nephrotoxic metabolite of DEG, was markedly elevated in both rat strains administered 10g/kg DEG, but no DGA was present at 2 or 5g/kg, asserting its necessary role in DEG-induced toxicity."
      explanation: >-
        Metabolite accumulation and toxicity appear together and are absent
        together, which is the necessity claim.
- name: Subacute diethylene glycol dosing with motor testing in the rat
  species: Rat
  genotype: Wild-type Wistar-Han
  publication: PMID:33475432
  description: >-
    The model behind the renal-dependence hypothesis. Only a minority of
    dosed animals developed kidney injury, and brain metabolite accumulation
    and motor deficits tracked that minority rather than the dose.
  modeled_mechanisms:
  - target: Neuronal Mitochondrial Complex II Inhibition
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Produces measurable motor impairment and brain metabolite accumulation,
      but not the cranial neuropathy that defines the human delayed syndrome.
    limitations: >-
      Grip strength and locomotor activity are not facial palsy or bulbar palsy,
      and the paper says so itself - its authors record that they had no
      animal test for the facial drooping seen in human cases. The model
      shows that nerve is affected without showing the syndrome.
    evidence:
    - reference: PMID:33475432
      reference_title: Neurotoxic effects of nephrotoxic compound diethylene glycol.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Renal and brain DGA accumulation was markedly increased in animals that developed AKI compared to animals without AKI."
      explanation: >-
        The observation the renal-dependence hypothesis rests on: brain
        exposure to the metabolite segregates with kidney injury.
experimental_models:
- name: Primary human proximal tubule cells
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:21856646
  description: >-
    Primary cultures from normal human renal cortex, exposed to the parent
    compound and each metabolite separately. The design is what identifies
    the toxicant, because it includes the negative arms.
  modeled_mechanisms:
  - target: Proximal Tubular ATP Depletion and Necrosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the cell death and its mode in the human target cell type.
    limitations: >-
      Cultured cells lack the filtration and concentration that deliver the
      metabolite to this cell in vivo, so the millimolar concentrations used
      are applied directly rather than reached physiologically.
    evidence:
    - reference: PMID:21856646
      reference_title: Diglycolic acid is the nephrotoxic metabolite in diethylene glycol poisoning inducing necrosis in human proximal tubule cells in vitro.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "These studies demonstrate that DGA is the toxic metabolite responsible for DEG-induced proximal tubular necrosis and suggest a possible transporter-mediated uptake of DGA leading to toxic accumulation and cellular dysfunction."
      explanation: >-
        The paper's own statement of what the model established, in the human
        cell type the disease destroys.
- name: SH-SY5Y neuroblastoma line
  experimental_model_type: CELL_LINE
  publication: PMID:36754214
  description: >-
    A neuronal line used to ask whether the renal mechanism also operates in
    nerve. It is the only direct evidence for the emerging neurotoxicity
    hypothesis.
  modeled_mechanisms:
  - target: Neuronal Mitochondrial Complex II Inhibition
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      Demonstrates complex II inhibition, depolarisation and ATP depletion in
      a neuronal context.
    limitations: >-
      A neuroblastoma line is not a cranial motor neuron, and the effective
      concentrations are millimolar. It shows the mechanism is available to
      neurons; it does not show it is what injures the facial nerve in
      poisoned people.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        SH-SY5Y is a neuroblastoma-derived line with an immature
        catecholaminergic phenotype. The human lesion is in cranial and
        peripheral motor and sensory nerve, which this line does not model.
    evidence:
    - reference: PMID:36754214
      reference_title: Diglycolic acid inhibits succinate dehydrogenase activity, depletes mitochondrial membrane potential, and induces inflammation in an SH-SY5Y neuroblastoma model of neurotoxicity in vitro.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "Complex II activity was significantly decreased at all DGA concentrations tested, with 12.5 mM DGA causing 80% inhibition and 25 and 50 mM DGA causing 97 and 100% inhibition, respectively."
      explanation: >-
        The dose-response for the inhibition, with the concentrations stated
        so a reader can judge the physiological distance.
discussions:
- kind: KNOWLEDGE_GAP
  discussion_id: delayed_neuropathy_mechanism
  prompt: >-
    Is the delayed cranial and peripheral neuropathy of diethylene glycol
    poisoning caused by diglycolic acid acting directly on nerve, by
    2-hydroxyethoxyacetic acid, or by retention of metabolite that only
    happens once the kidney has failed?
  attaches_to:
  - pathophysiology#Neuronal Mitochondrial Complex II Inhibition
  - phenotypes#Facial palsy
  rationale: >-
    Three accounts are live and this entry carries all three as hypothesis
    groups. The direct-toxicity account has the only positive mechanistic
    data, and it is an in vitro neuroblastoma result at millimolar
    concentrations. The 2-hydroxyethoxyacetic acid account comes from a
    review that states it as what is thought to be the case. The
    renal-dependence account has the most human support - a case series in
    which only the patients with established renal impairment went on to
    develop cranial neuropathy - and is echoed in two rat studies where brain
    metabolite accumulated only in animals with kidney injury. The three are
    not mutually exclusive: renal failure could supply the exposure that
    direct toxicity then acts on. What no source settles is why the facial
    nerve in particular.
  evidence:
  - reference: PMID:15902788
    reference_title: Delayed neurologic sequelae resulting from epidemic diethylene glycol poisoning.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Established renal impairment may predict subsequent delayed neurologic toxicity."
    explanation: >-
      The human observation behind the renal-dependence account, stated by
      its authors with "may" rather than as a settled relation.
  - reference: PMID:21192754
    reference_title: Delayed neurological sequelae from ethylene glycol, diethylene glycol and methanol poisonings.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "2-hydroxyethoxyacetic acid is thought to be the causal moiety in cranial neuropathies resulting from diethylene glycol toxicity."
    explanation: >-
      The competing attribution, carried with its hedge. Note it names the
      other metabolite - not the one this entry's renal arm blames.
  - reference: PMID:21192754
    reference_title: Delayed neurological sequelae from ethylene glycol, diethylene glycol and methanol poisonings.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Further research is required to explain why the facial nerve is the cranial nerve most commonly involved and why the basal ganglia are predisposed to injury."
    explanation: >-
      The gap stated by a source rather than inferred by this entry.
  - reference: PMID:25170933
    reference_title: "Neurological manifestation of recreational fatal and near-fatal diethylene glycol poisonings: case series and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The neurological course and toxicity is less well characterized than its renal counterpart."
    explanation: >-
      A second human series stating the asymmetry this discussion exists
      because of - the renal arm is settled and the neurological one is not.
- kind: KNOWLEDGE_GAP
  discussion_id: oxalate_in_human_deg_cases
  prompt: >-
    If diethylene glycol is not metabolised to oxalate, why do calcium
    oxalate crystals appear in the kidneys of some human cases?
  attaches_to:
  - pathophysiology#Proximal Tubular ATP Depletion and Necrosis
  rationale: >-
    The rat metabolic study found no urinary oxalate or glycolate and
    concluded that toxicity does not proceed through conversion to ethylene
    glycol. A human autopsy case nonetheless describes calcium oxalate
    crystals in both kidneys. Candidate explanations the cited sources do not distinguish between:
    ethylene glycol generated endogenously as a minor metabolite of
    diethylene glycol - the rat study detected small amounts of it in urine
    even while finding no oxalate - ethylene glycol present as a contaminant
    alongside diethylene glycol in the ingested product, a species
    difference in that minor route, or oxalate of dietary or endogenous
    origin deposited in already necrotic tubules. An earlier draft of this
    rationale offered only the product-impurity explanation, which misread
    the quoted sentence: the ethylene glycol it reports was measured in the
    urine of dosed rats, so it is a metabolite, not an impurity. The entry records the conflict because the tidy version of the
    claim - that this poisoning never produces oxalate - is contradicted by
    a source it cites, and because the diagnostic advice that follows from
    it matters at the bedside.
  evidence:
  - reference: PMID:20530232
    reference_title: Inhibition of metabolism of diethylene glycol prevents target organ toxicity in rats.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Small amounts of ethylene glycol (EG), but not oxalate or glycolate, were observed in the urine."
    explanation: >-
      The metabolic result: the oxalate route that drives ethylene glycol
      nephrotoxicity is not detectably engaged here.
  - reference: PMID:28085681
    reference_title: Basal Ganglion Hemorrhage as Delayed Complication of Diethylene Glycol Ingestion.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Both kidneys illustrate tubular necrosis with scattered tubular deposition of polarizable calcium oxalate crystals."
    explanation: >-
      REFUTE against the general claim that this poisoning does not deposit
      oxalate. It does not refute the diglycolic acid mechanism, which the
      same kidneys illustrate as tubular necrosis - the object is the oxalate
      claim alone.
  - reference: PMID:25170933
    reference_title: "Neurological manifestation of recreational fatal and near-fatal diethylene glycol poisonings: case series and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "However, the difference in metabolism and the absence of oxalate crystalluria or oxalate deposition in sections of tissue examined14,15 favor that toxicity may be through different mechanisms."
    explanation: >-
      A human series pointing the other way from the autopsy above - no
      oxalate crystalluria and none in the tissue examined - which is what
      makes this a genuine two-sided question rather than one anomalous
      report against a rat study. The inline "14,15" is the source's own
      citation markers, quoted as they appear.
references:
- reference: PMID:21856646
  title: "Diglycolic acid is the nephrotoxic metabolite in diethylene glycol poisoning inducing necrosis in human proximal tubule cells in vitro."
- reference: PMID:20530232
  title: Inhibition of metabolism of diethylene glycol prevents target organ toxicity in rats.

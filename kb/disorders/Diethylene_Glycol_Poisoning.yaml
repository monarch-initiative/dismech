environmental:
- name: Ingestion of a liquid medicine adulterated with diethylene glycol
  description: >-
    The dominant exposure route and the one behind every large outbreak.
    Diethylene glycol is substituted for pharmaceutical grade glycerin or
    propylene glycol in a syrup or elixir, usually as a cheaper adulterant
    introduced upstream in the excipient supply chain rather than by the
    finished-product manufacturer.
  exposure_term:
    preferred_term: exposure to diethylene glycol
    term:
      id: ECTO:9002156
      label: exposure to glycol
  influences_mechanisms:
  - target: Systemic Diethylene Glycol Exposure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The contaminated medicine is the entire source of the systemic burden;
      there is no endogenous diethylene glycol.
    evidence:
    - reference: PMID:18949211
      reference_title: "Outbreak of acute renal failure in Panama in 2006: a case-control study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Laboratory analyses confirmed the presence of diethylene glycol (DEG) in biological samples from case patients, 8% DEG contamination in cough syrup samples and 22% contamination in the glycerin used to prepare the cough syrup."
      explanation: >-
        Traces the exposure from patient tissue back through the finished
        syrup to the contaminated glycerin, which is exactly the route this
        edge asserts.
  evidence:
  - reference: PMID:18949211
    reference_title: "Outbreak of acute renal failure in Panama in 2006: a case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "After controlling for pre-existing hypertension and renal disease and the use of angiotensin-converting enzyme inhibitors, a significant association was found between ingestion of prescription cough syrup and illness onset (adjusted odds ratio: 31.0, 95% confidence interval: 6.93-138)."
    explanation: >-
      The epidemiological link between the medicine and the illness, adjusted
      for the obvious renal confounders.
  notes: >-
    ECTO has no exposure class for diethylene glycol, so the genus term is
    bound and `preferred_term` carries the specificity. The searches run
    through the OLS `ecto` index were "diethylene glycol", "exposure to
    diethylene glycol", "diethyleneglycol", "diethylene", "oxydiethanol" and
    "2-(2-hydroxyethoxy)ethanol". The only ECTO hit among them is
    `ECTO:9001432` exposure to diethylenetriamine, a different chemical;
    `CHEBI:46807` diethylene glycol exists but ECTO has not generated an
    exposure class from it.

    Two near-misses were rejected on positive grounds rather than
    overlooked. `ECTO:9001111` exposure to ethylene glycol is exact for the
    wrong toxin - binding it would assert the confusion this entry's top
    `notes` exists to prevent. `ECTO:9002161` exposure to glycol ether was rejected on narrower grounds
    than an earlier draft claimed. That draft said the term names the
    monoalkyl ethers of ethylene glycol, whose target organs are testis and
    bone marrow; that is industrial-hygiene usage, not the ontology's
    definition, and ChEBI defines a glycol ether structurally as a
    hydroxyether - which diethylene glycol is. The term is therefore
    arguably correct and simply less apt than the bound one: `exposure to
    glycol` is the reading a curator would expect for this compound, and
    `glycol ether` invites the industrial-hygiene reading and its wrong
    target organs.
treatments:
- name: Fomepizole
  description: >-
    The antidote, and unusually for a toxidrome its rationale is fully worked
    out: it inhibits alcohol dehydrogenase, so the parent compound is never
    converted to the acids that do the damage. In the rat model it prevents
    the metabolic acidosis and the renal and hepatic injury outright. Its
    value is therefore greatest before metabolism has occurred, and it cannot
    undo a lesion that diglycolic acid has already produced.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fomepizole
      term:
        id: CHEBI:5141
        label: fomepizole
  target_mechanisms:
  - target: Alcohol Dehydrogenase Oxidation of Diethylene Glycol
    treatment_effect: INHIBITS
    description: >-
      Blocks the first oxidation step specifically, which is why the
      bioactivation chain is modelled as two nodes rather than one - the
      antidote acts on the alcohol dehydrogenase step alone, and everything
      downstream of it is prevented as a consequence rather than as a second
      target.
    evidence:
    - reference: PMID:20530232
      reference_title: Inhibition of metabolism of diethylene glycol prevents target organ toxicity in rats.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Treatment with fomepizole blocked the formation of HEAA and DGA and the development of metabolic acidosis and the kidney and liver toxicity."
      explanation: >-
        Supports this edge precisely: the intervention is shown to act on
        metabolite formation, and the downstream toxicity is prevented.
  evidence:
  - reference: PMID:10793034
    reference_title: Childhood diethylene glycol poisoning treated with alcohol dehydrogenase inhibitor fomepizole and hemodialysis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report a case of DEG ingestion in a 17-month-old girl who was managed with activated charcoal, fomepizole (a recently available alcohol dehydrogenase inhibitor), and hemodialysis (HD)."
    explanation: >-
      The only human evidence in this entry for the antidote, and it is a
      single case in which three interventions were given together, so it is
      INDIRECT: it establishes that fomepizole has been used in this
      poisoning, not that it was what worked.
- name: Ethanol
  description: >-
    The alternative alcohol dehydrogenase inhibitor, and the one that matters
    most in practice: fomepizole is expensive and often unavailable in the
    settings where these outbreaks happen. It occupies the same enzyme as
    fomepizole and so blocks the same step, but the evidence for it in this
    poisoning is weaker - the source cited here says inhibition "should be"
    therapeutic rather than reporting that it was.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ethanol
      term:
        id: CHEBI:16236
        label: ethanol
  target_mechanisms:
  - target: Alcohol Dehydrogenase Oxidation of Diethylene Glycol
    treatment_effect: INHIBITS
    description: >-
      Competes for the same enzyme fomepizole inhibits, and so is drawn to
      the same node.
    evidence:
    - reference: PMID:36939119
      reference_title: Variable sensitivity to diethylene glycol poisoning is related to differences in the uptake transporter for the toxic metabolite diglycolic acid.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "It is also likely that inhibition of alcohol dehydrogenase, either with ethanol or fomepizole, should be therapeutic."
      explanation: >-
        INDIRECT and BACKGROUND, and deliberately so: this is the authors'
        framing sentence proposing that the mechanism implies a therapy, not
        a result. It is the strongest statement about ethanol in this
        entry's cached sources, and the treatment description says as much
        rather than implying a demonstrated benefit.
- name: Supportive correction of the metabolic acidosis
  description: >-
    Bicarbonate against the acidosis, alongside general supportive care and
    gastric decontamination. This is what most patients in the outbreaks
    actually received, since the antidote and reliable dialysis were absent.
  therapeutic_modality: OTHER
  treatment_term:

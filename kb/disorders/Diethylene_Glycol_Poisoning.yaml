name: Diethylene Glycol Poisoning
creation_date: "2026-09-19T14:00:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Pharmaceutical Contamination
- Toxic Alcohol Poisoning
synonyms:
- DEG poisoning
- diethylene glycol toxicity
- diethylene glycol intoxication
- diglycol poisoning
description: >-
  Diethylene glycol poisoning is an acute toxic nephropathy with delayed
  neurological sequelae, caused by ingestion of diethylene glycol - a sweet,
  viscous industrial solvent and humectant. Almost every large outbreak has
  been a pharmaceutical mass poisoning in which diethylene glycol was
  substituted, as a cheaper adulterant, for pharmaceutical grade glycerin or
  propylene glycol in a liquid medicine. Diethylene glycol itself is not the
  toxicant. It is oxidised by alcohol and aldehyde dehydrogenase to
  2-hydroxyethoxyacetic acid and then to diglycolic acid, and it is diglycolic
  acid - a close structural mimic of the citric acid cycle dicarboxylate
  succinate - that is carried into renal proximal tubular cells by the
  transporters that normally reclaim succinate, is poorly effluxed once
  inside, and inhibits mitochondrial complex II. The resulting ATP depletion
  produces proximal tubular necrosis rather than apoptosis, and the swollen
  necrotic epithelium obstructs the tubular lumen, giving the anuric acute
  kidney injury that defines the syndrome. Survivors of the renal phase may
  develop a distinct delayed neurological syndrome of cranial neuropathies -
  bilateral facial palsy is the classic finding - bulbar palsy, and a
  sensorimotor polyneuropathy. The cited sources do not agree on how
  delayed: one case series places the cranial neuropathies in the second
  week after ingestion, while a rat study's review of the human literature
  reports onset at two to seven days.
notes: >-
  **This is not ethylene glycol poisoning with a longer name, and the
  difference is mechanistic.** `kb/disorders/Ethylene_Glycol_Poisoning.yaml`
  models a chain that runs through glycolic acid to oxalic acid and calcium
  oxalate crystal deposition. Diethylene glycol does not run through that
  chain: in the rat model that established the metabolic route the urinary
  metabolites were 2-hydroxyethoxyacetic acid and diglycolic acid, with
  small amounts of ethylene glycol but no detectable oxalate or glycolate,
  and the authors concluded that toxicity does not proceed through
  conversion to ethylene glycol (`PMID:20530232`). The practical consequence is diagnostic: a clinician who looks for the
  calcium oxalate crystalluria that anchors ethylene glycol poisoning will
  not reliably find it. An earlier draft of this note added that the osmolal
  and anion gap behave differently, which was unsourced and half wrong -
  both poisonings produce a high anion gap acidosis, as this entry's own
  `Organic Acid Accumulation` node says.

  **That said, this entry does not claim diethylene glycol produces no
  oxalate at all, because one cited source contradicts it.** A fatal human
  case reports autopsy kidneys with "scattered tubular deposition of
  polarizable calcium oxalate crystals" (`PMID:28085681`). The
  `oxalate_in_human_deg_cases` discussion records the tension rather than
  resolving it in favour of the tidier statement.

  **No MONDO term exists for this disease.** `disease_term` is therefore
  omitted rather than bound to a neighbour. The searches run were
  `runoak -i ols:mondo search "diethylene glycol"`, which returns nothing,
  and `"glycol poisoning"`, which returns only `MONDO:0017861` ethylene
  glycol poisoning and `MONDO:1013081` ethylene glycol poisoning, non-human
  animal. Binding either would assert this entry is about the other toxin -
  precisely the confusion the first note exists to prevent. Thirty-four
  disorder entries already carry no `disease_term`, including
  `Aconitine_Poisoning` and `Arsenic_Poisoning`.

  **Mortality figures are reported with their outbreaks attached, not
  pooled.** The 1937 Elixir Sulfanilamide disaster killed 105
  (`PMID:7856995`); the 2006 Panama outbreak killed 12 of the first 21
  identified patients (`PMID:18949211`); the 2008 Nigerian teething syrup
  outbreak reports 96.6% mortality among exposed children against 71.2% in
  unexposed children with acute kidney injury (`PMID:22246572`); and a 2010
  review puts the cumulative paediatric toll at more than 300
  (`PMID:21062849`). These count different populations over different
  periods with different access to dialysis, and averaging them would
  produce a number that describes nothing.

  **Most phenotypes here are not wired into the pathograph.** The rule this
  entry follows is that an edge is drawn only where a cited source
  attributes the feature to the mechanism, not wherever a mechanism and a
  feature are both plausible. `just list-disconnected-phenotypes` reports
  the current state; a count written here would be wrong the moment a
  phenotype is added.
mechanistic_hypotheses:
- hypothesis_group_id: dga_proximal_tubular_necrosis
  hypothesis_label: Diglycolic acid is the proximate renal toxicant
  status: CANONICAL
  description: >-
    The renal lesion is produced by diglycolic acid rather than by diethylene
    glycol or by 2-hydroxyethoxyacetic acid. This is the best evidenced part
    of the mechanism: in human proximal tubule cells the parent compound and
    the first metabolite produce no cell death at all, and in rats the
    toxicity appears only at doses at which diglycolic acid accumulates in
    kidney tissue.
- hypothesis_group_id: dga_direct_neurotoxicity
  hypothesis_label: Diglycolic acid is directly neurotoxic
  status: EMERGING
  description: >-
    The delayed neuropathy reflects the same complex II inhibition acting on
    neurons, demonstrated in a neuroblastoma line. The evidence is in vitro
    and uses millimolar concentrations, and no human nerve tissue measurement
    supports it yet.
- hypothesis_group_id: heaa_neurotoxicity
  hypothesis_label: 2-hydroxyethoxyacetic acid is the neurotoxic moiety
  status: ALTERNATIVE
  description: >-
    A review of delayed neurological sequelae across the toxic alcohols
    attributes the cranial neuropathies of diethylene glycol to
    2-hydroxyethoxyacetic acid rather than to diglycolic acid. The source
    states this as what is "thought to be" the case rather than as a
    demonstrated result, and the entry carries it with that hedge intact.
- hypothesis_group_id: aki_dependent_metabolite_retention
  hypothesis_label: The neuropathy is conditional on renal failure
  status: ALTERNATIVE
  description: >-
    Delayed neurotoxicity appears only in those who sustain renal injury, in
    both a human case series and two rat studies, where brain diglycolic acid
    was markedly higher in animals that developed acute kidney injury than
    in those that did not. On this account
    the nerve injury is not an independent arm but a consequence of losing
    the clearance route for the metabolite. It is not exclusive of direct
    neurotoxicity - it supplies the exposure that direct toxicity would then
    act on.
pathophysiology:
- name: Systemic Diethylene Glycol Exposure
  biological_scale: ORGANISM
  description: >-
    Ingested diethylene glycol is absorbed rapidly and distributes to the
    kidney and brain ahead of other tissues, delivering the parent compound
    to the liver where it is bioactivated.
  chemical_entities:
  - preferred_term: diethylene glycol
    term:
      id: CHEBI:46807
      label: diethylene glycol
    modifier: INCREASED
  evidence:
  - reference: PMID:8135655
    reference_title: Toxicokinetics of diethylene glycol (DEG) in the rat.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "14C-DEG was rapidly distributed from the blood into the organs and tissues in the order kidneys > brain > spleen > liver > muscle > fat, i.e. the same order as the blood flow."
    explanation: >-
      Sources the distribution claim in this node's description, including
      the ordering and the reason for it. The two organs heading the list are
      the two this disease damages.
  downstream:
  - target: Alcohol Dehydrogenase Oxidation of Diethylene Glycol
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20530232
      reference_title: Inhibition of metabolism of diethylene glycol prevents target organ toxicity in rats.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "After low and high doses of DEG, 2-hydroxyethoxyacetic acid (HEAA) was the primary metabolite in the urine, with only minor amounts of urinary diglycolic acid (DGA)."
      explanation: >-
        Establishes that the ingested compound is metabolised rather than
        excreted unchanged, and names the two acids this edge produces.
- name: Alcohol Dehydrogenase Oxidation of Diethylene Glycol
  biological_scale: MOLECULAR
  description: >-
    Alcohol dehydrogenase oxidises diethylene glycol to
    2-hydroxyethoxyacetaldehyde. This is the single step the antidote blocks,
    and it is separated from the aldehyde dehydrogenase step below precisely
    so that the antidote's target can be named exactly.
  molecular_functions:
  - preferred_term: alcohol dehydrogenase (NAD+) activity
    term:
      id: GO:0004022
      label: alcohol dehydrogenase (NAD+) activity
  evidence:
  - reference: PMID:20530232
    reference_title: Inhibition of metabolism of diethylene glycol prevents target organ toxicity in rats.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "These results indicate that the mechanism for the target organ toxicity results from metabolites of DEG, and not DEG itself nor formation of EG from DEG, and that fomepizole may be a useful antidote for treating DEG poisoning."
    explanation: >-
      The causal keystone of this entry. It establishes that bioactivation is
      required, and rules out the alternative that diethylene glycol is
      toxic by conversion to ethylene glycol.
  downstream:
  - target: 2-Hydroxyethoxyacetic Acid Formation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20530232
      reference_title: Inhibition of metabolism of diethylene glycol prevents target organ toxicity in rats.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Treatment with fomepizole blocked the formation of HEAA and DGA and the development of metabolic acidosis and the kidney and liver toxicity."
      explanation: >-
        Supports this edge specifically: inhibiting the alcohol dehydrogenase
        step prevents both acid metabolites downstream of it from being
        formed at all.
- name: 2-Hydroxyethoxyacetic Acid Formation
  biological_scale: MOLECULAR
  description: >-
    Aldehyde dehydrogenase oxidises the aldehyde to 2-hydroxyethoxyacetic
    acid, the quantitatively dominant urinary metabolite. It is not the renal
    toxicant - it produces no death in human proximal tubule cells - but it
    is an organic acid and so contributes to the acidosis, and one review
    proposes it rather than diglycolic acid as the neurotoxic moiety.
  molecular_functions:
  - preferred_term: aldehyde dehydrogenase (NAD+) activity
    term:
      id: GO:0004029
      label: aldehyde dehydrogenase (NAD+) activity
  notes: >-
    No CHEBI term is bound. Searching the OLS `chebi` index for
    "2-hydroxyethoxyacetic acid" and for "hydroxyethoxyacetic acid" returns
    nothing, so there is no identifier to bind rather than a better one that
    was missed.
  evidence:
  - reference: PMID:20530232
    reference_title: Inhibition of metabolism of diethylene glycol prevents target organ toxicity in rats.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "After low and high doses of DEG, 2-hydroxyethoxyacetic acid (HEAA) was the primary metabolite in the urine, with only minor amounts of urinary diglycolic acid (DGA)."
    explanation: >-
      Establishes this metabolite as the dominant one by quantity, which is
      the asymmetry that makes the toxicity of the minor metabolite
      surprising and worth modelling separately.
  downstream:
  - target: Diglycolic Acid Formation
    causal_link_type: DIRECT
    hypothesis_groups:
    - dga_proximal_tubular_necrosis
  - target: Organic Acid Accumulation
    causal_link_type: DIRECT
  - target: Neuronal Mitochondrial Complex II Inhibition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - heaa_neurotoxicity
    description: >-
      The alternative account of the delayed neuropathy, drawn so the
      competing hypothesis has an edge to attach to rather than existing only
      as prose. A review names this metabolite as the causal moiety in the
      cranial neuropathies; no experimental result supports it.
- name: Diglycolic Acid Formation
  biological_scale: MOLECULAR
  description: >-
    Diglycolic acid is a four-carbon dicarboxylic acid with an ether oxygen,
    close enough in shape to succinate that the kidney handles it as though
    it were a citric acid cycle intermediate. That mistaken identity is the
    reason the lesion is renal and proximal.
  chemical_entities:
  - preferred_term: diglycolic acid
    term:
      id: CHEBI:169983
      label: Diglycolic acid
    modifier: INCREASED
  evidence:
  - reference: PMID:21856646
    reference_title: Diglycolic acid is the nephrotoxic metabolite in diethylene glycol poisoning inducing necrosis in human proximal tubule cells in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "DGA is structurally similar to citric acid cycle intermediates that are taken up by specific transporters in kidney cells."
    explanation: >-
      States the structural mimicry this node rests on, and does so in the
      paper that identified diglycolic acid as the toxic metabolite.
  downstream:
  - target: Dicarboxylate Transporter-Mediated Renal Uptake
    causal_link_type: DIRECT
    hypothesis_groups:
    - dga_proximal_tubular_necrosis
    evidence:
    - reference: PMID:28074668
      reference_title: In-vivo evidence of nephrotoxicity and altered hepatic function in rats following administration of diglycolic acid, a metabolite of diethylene glycol.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "DGA accumulated significantly in both kidney and liver tissue only at 300 mg DGA/kg."
      explanation: >-
        Diglycolic acid given directly to rats accumulates in kidney tissue,
        which is the step this edge asserts.
  - target: Neuronal Mitochondrial Complex II Inhibition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - dga_direct_neurotoxicity
    - aki_dependent_metabolite_retention
    description: >-
      The neuronal arm is drawn with unknown intermediates on purpose, and
      carries two hypothesis groups because two accounts share this edge and
      are not exclusive. What is demonstrated is that diglycolic acid
      inhibits complex II in a neuronal cell line, and that brain diglycolic
      acid is markedly higher in rats that develop kidney injury than in
      rats that do not; how it reaches human cranial nerve is not
      established.
    evidence:
    - reference: PMID:33475432
      reference_title: Neurotoxic effects of nephrotoxic compound diethylene glycol.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Renal and brain DGA accumulation was markedly increased in animals that developed AKI compared to animals without AKI."
      explanation: >-
        Supports the renal-dependence half of this edge: brain exposure to
        the metabolite segregates with kidney injury rather than with dose.
    - reference: PMID:34278906
      reference_title: Diethylene glycol produces nephrotoxic and neurotoxic effects in female rats.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Of 12 animals treated with DEG, 3 developed AKI as confirmed by increased BUN and creatinine concentrations."
      explanation: >-
        The second of the two rat studies this entry's hypothesis prose
        refers to, and the source of the striking observation that
        identically dosed animals diverge - only a quarter developed kidney
        injury, which is what the transporter-expression finding later
        explains.
- name: Dicarboxylate Transporter-Mediated Renal Uptake
  biological_scale: CELLULAR
  description: >-
    Sodium-dicarboxylate cotransporters on the proximal tubular cell, whose
    normal job is reclaiming filtered succinate, carry diglycolic acid into
    the cell.
  biological_processes:
  - preferred_term: dicarboxylic acid transport
    term:
      id: GO:0006835
      label: dicarboxylic acid transport
  cell_types:
  - preferred_term: renal proximal tubular epithelial cell
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  locations:
  - preferred_term: proximal tubule
    term:
      id: UBERON:0004134
      label: proximal tubule
  genes:
  - preferred_term: SLC13A2
    term:
      id: hgnc:10917
      label: SLC13A2
  evidence:
  - reference: PMID:36939119
    reference_title: Variable sensitivity to diethylene glycol poisoning is related to differences in the uptake transporter for the toxic metabolite diglycolic acid.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Significantly higher expression of sodium-dependent dicarboxylate transporter-1 mRNA was present in the kidneys of rats with acute kidney injury and diglycolic acid accumulation compared to those in rats that had no diglycolic acid in their kidneys and no acute kidney injury."
    explanation: >-
      Makes this node's transporter the locus of individual susceptibility,
      not merely the route of entry: identically dosed rats diverged, and the
      ones that were injured were the ones expressing more transporter. It is
      the best current explanation for why a given dose kills some people and
      not others.
  - reference: PMID:36087010
    reference_title: Role of Plasma Membrane Dicarboxylate Transporters in the Uptake and Toxicity of Diglycolic Acid, a Metabolite of Diethylene Glycol, in Human Proximal Tubule Cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Pretreatment with the NaDC-1 inhibitor N-(p-amylcinnamoyl)anthranilic acid (ACA) markedly reduced apical uptakes of both succinate and DGA."
    explanation: >-
      Inhibiting the succinate transporter reduces diglycolic acid uptake,
      which is what makes this a transporter-mediated step rather than
      passive entry.
  downstream:
  - target: Intracellular Diglycolic Acid Trapping
    causal_link_type: DIRECT
    hypothesis_groups:
    - dga_proximal_tubular_necrosis
- name: Intracellular Diglycolic Acid Trapping
  biological_scale: CELLULAR
  description: >-
    Once inside, diglycolic acid is not effluxed. The cell has a route in and
    effectively no route out, so concentration builds - in rats kidney
    concentrations reach far above blood levels - which is why a metabolite
    circulating at modest concentration produces a lesion confined to this
    one cell type.
  evidence:
  - reference: PMID:36958672
    reference_title: Lack of efflux of diglycolic acid from proximal tubule cells leads to its accumulation and to toxicity of diethylene glycol.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "This study concluded that DGA is poorly transported out of cells and that stimulation of OAT transporters is not a viable target for reducing DGA accumulation in cells."
    explanation: >-
      Establishes the one-way character of the step, and reports the negative
      result that the obvious efflux route cannot be recruited to reverse it.
  downstream:
  - target: Renal Mitochondrial Complex II Inhibition
    causal_link_type: DIRECT
    hypothesis_groups:
    - dga_proximal_tubular_necrosis
- name: Renal Mitochondrial Complex II Inhibition
  biological_scale: MOLECULAR
  description: >-
    Accumulated diglycolic acid inhibits succinate dehydrogenase, the complex
    II of the respiratory chain, and depolarises the mitochondrion. The
    selectivity is striking - complexes I, III and IV are untouched - and is
    what one would predict from a succinate mimic.
  molecular_functions:
  - preferred_term: succinate dehydrogenase activity
    term:
      id: GO:0000104
      label: succinate dehydrogenase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: mitochondrial depolarization
    term:
      id: GO:0051882
      label: mitochondrial depolarization
    modifier: INCREASED
  evidence:
  - reference: PMID:27002734
    reference_title: Diglycolic acid, the toxic metabolite of diethylene glycol, chelates calcium and produces renal mitochondrial dysfunction in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "DGA inhibited Complex II activity without altering Complex I, III or IV activities."
    explanation: >-
      The specificity claim this node makes, stated with the negative
      controls that give it force.
  - reference: PMID:27002734
    reference_title: Diglycolic acid, the toxic metabolite of diethylene glycol, chelates calcium and produces renal mitochondrial dysfunction in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "DGA decreased the mitochondrial membrane potential in HPT cells."
    explanation: >-
      The depolarisation half of the node, measured in human proximal tubule
      cells rather than isolated mitochondria.
  downstream:
  - target: Proximal Tubular ATP Depletion and Necrosis
    causal_link_type: DIRECT
    hypothesis_groups:
    - dga_proximal_tubular_necrosis
- name: Proximal Tubular ATP Depletion and Necrosis
  biological_scale: CELLULAR
  description: >-
    Loss of oxidative ATP production in a cell type that depends on it kills
    by necrosis rather than apoptosis - the caspase machinery is not engaged,
    and the cells simply run out of energy.
  biological_processes:
  - preferred_term: ATP biosynthetic process
    term:
      id: GO:0006754
      label: ATP biosynthetic process
    modifier: DECREASED
  cell_types:
  - preferred_term: renal proximal tubular epithelial cell
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  evidence:
  - reference: PMID:21856646
    reference_title: Diglycolic acid is the nephrotoxic metabolite in diethylene glycol poisoning inducing necrosis in human proximal tubule cells in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "DGA induced necrosis, not apoptosis, as corroborated by severe depletion of cellular adenosine triphosphate levels."
    explanation: >-
      Both halves of this node in one sentence: the mode of death and the
      energetic failure behind it.
  - reference: PMID:21856646
    reference_title: Diglycolic acid is the nephrotoxic metabolite in diethylene glycol poisoning inducing necrosis in human proximal tubule cells in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "DEG and 2-HEAA did not produce any cell death. DGA produced dose-dependent necrosis at concentrations above 25 mmol/l."
    explanation: >-
      The negative control that makes the whole canonical arm work - neither
      the parent compound nor the first metabolite kills these cells.
  downstream:
  - target: Tubular Luminal Obstruction
    causal_link_type: DIRECT
    hypothesis_groups:
    - dga_proximal_tubular_necrosis
- name: Tubular Luminal Obstruction
  biological_scale: TISSUE
  description: >-
    The swollen and vacuolated necrotic epithelium occludes the tubular
    lumen. Urine flow falls for a mechanical reason on top of the cellular
    one, which is why the renal failure of this poisoning is characteristically
    anuric rather than merely oliguric.
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:37186212
    reference_title: "Renal toxicity caused by diethylene glycol: an overview."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Marked vacuolization and edema of epithelial cells obstruct the lumen, reducing urine flow and, consequently, resulting in anuria and uremia."
    explanation: >-
      States the obstruction step and its clinical consequence directly.
      Graded OTHER and REVIEW_SYNTHESIS because the source is a narrative
      overview summarising renal biopsy morphology rather than reporting it.
  downstream:
  - target: Acute kidney injury
    causal_link_type: DIRECT
  - target: Anuria
    causal_link_type: DIRECT
- name: Organic Acid Accumulation
  biological_scale: ORGANISM
  description: >-
    2-hydroxyethoxyacetic acid and diglycolic acid are unmeasured anions, and
    their accumulation produces the high anion gap metabolic acidosis of the
    early phase. This arm is separable from the renal arm: the antidote
    prevents both, and the acidosis appears before renal failure is
    established.
  evidence:
  - reference: PMID:20530232
    reference_title: Inhibition of metabolism of diethylene glycol prevents target organ toxicity in rats.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Rats treated with high-dose DEG had metabolic acidosis, increased BUN and creatinine, and marked kidney necrosis, noted by histopathology."
    explanation: >-
      Reports the acidosis alongside the renal lesion in the same dosed
      animals, which is what this node and its position in the chain assert.
  downstream:
  - target: Metabolic acidosis
    causal_link_type: DIRECT
- name: Neuronal Mitochondrial Complex II Inhibition
  biological_scale: MOLECULAR
  description: >-
    The same complex II inhibition demonstrated in renal cells occurs in a
    neuronal cell line, with mitochondrial depolarisation, ATP depletion and
    inflammatory cytokine release. This is the proposed substrate of the
    delayed neurological syndrome, and it is an in vitro result rather than
    an observation in nerve.
  molecular_functions:
  - preferred_term: succinate dehydrogenase activity
    term:
      id: GO:0000104
      label: succinate dehydrogenase activity
    modifier: DECREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:36754214
    reference_title: Diglycolic acid inhibits succinate dehydrogenase activity, depletes mitochondrial membrane potential, and induces inflammation in an SH-SY5Y neuroblastoma model of neurotoxicity in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "These studies demonstrate that the DGA-induced mechanism of SH-SY5Y cell death involves complex II inhibition leading to mitochondrial depolarization, and subsequent ATP depletion with accompanying inflammatory cytokine release."
    explanation: >-
      The whole node in one sentence, and explicitly in a neuronal line
      rather than in the kidney cells where the mechanism was first shown.
  downstream:
  - target: Facial palsy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - dga_direct_neurotoxicity
  - target: Sensorimotor neuropathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - dga_direct_neurotoxicity
phenotypes:
- category: Gastrointestinal
  name: Gastrointestinal prodrome
  description: >-
    The first phase, within hours of ingestion: nausea, vomiting and abdominal
    pain, usually with an anion gap metabolic acidosis. Non-specific on its
    own, which is much of why the syndrome is recognised late.
  phenotype_term:
    preferred_term: nausea, vomiting and abdominal pain
    term:
      id: HP:0002017
      label: Nausea and vomiting
    temporality: ACUTE
  notes: >-
    Modelled as one phenotype rather than four because the cited sentence
    names the phase collectively ("gastrointestinal symptoms") and does not
    itemise nausea, vomiting, abdominal pain and diarrhoea separately.
    Splitting it into four would assert four findings where the source
    reports one. `HP:0002017` Nausea and vomiting is bound as the closest
    single term; `preferred_term` carries the fuller picture.
  evidence:
  - reference: PMID:37186212
    reference_title: "Renal toxicity caused by diethylene glycol: an overview."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients may present with gastrointestinal symptoms and anion gap metabolic acidosis, followed by renal failure, and, later, encephalopathy and neuropathy."
    explanation: >-
      Names the gastrointestinal presentation as the first of the three
      phases. The same sentence is cited on Metabolic acidosis for the other
      half of that phase.
- category: Renal
  name: Acute kidney injury
  description: >-
    The defining feature and the usual cause of death. Histologically an acute
    tubular necrosis centred on the proximal tubule.
  phenotype_term:
    preferred_term: Acute kidney injury

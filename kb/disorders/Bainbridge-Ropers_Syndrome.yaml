name: Bainbridge-Ropers syndrome
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
description: >-
  Bainbridge-Ropers syndrome (BRPS), increasingly called ASXL3-related
  disorder, is a rare autosomal dominant neurodevelopmental syndrome caused by
  heterozygous, predominantly de novo protein-truncating variants in ASXL3
  clustered in exons 11 and 12. It is a chromatinopathy: ASXL3 is the
  non-catalytic scaffolding subunit that partners the deubiquitinase BAP1 in
  the Polycomb repressive deubiquitinase (PR-DUB) complex, and its loss raises
  H2A lysine 119 monoubiquitination and broadly dysregulates transcription
  during neural development. The core clinical picture is moderate-to-severe
  intellectual disability with absent or profoundly limited speech, infantile
  hypotonia, severe feeding difficulties with failure to thrive,
  gastroesophageal reflux, autistic features, and a recognizable but
  nonspecific craniofacial gestalt. BRPS was originally described as a
  "Bohring-Opitz-like" phenotype, but it is now established as a clinically
  distinct entity from ASXL1-related Bohring-Opitz syndrome and
  ASXL2-related Shashi-Pena syndrome.
synonyms:
- Bainbridge-Ropers syndrome
- BRPS
- ASXL3-related disorder
- ASXL3 deficiency syndrome
- severe feeding difficulties-failure to thrive-microcephaly due to ASXL3 deficiency syndrome

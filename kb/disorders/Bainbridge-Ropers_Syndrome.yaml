- name: Behavioral intervention for self-injury
  description: >-
    Structured behaviour-analytic assessment and treatment, using functional
    analysis and differential reinforcement, is the best-evidenced
    non-pharmacological approach to self-injury in this disorder. Coexisting
    sleep disruption can confound assessment and should be addressed in
    parallel.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: behavioral intervention
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  target_phenotypes:

    term:
      id: HP:0100716
      label: Self-injurious behavior
  notes: >-
    Evidence is a single-case experimental design (n=1). Treat as a
    demonstration of feasibility, not as a population-level efficacy estimate.
  evidence:
  - reference: PMID:36249891
    reference_title: "Treatment of Self-Injury in Bainbridge-Ropers Syndrome: Replication and Extensions of Behavioral Assessments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We targeted self-injury in a child with BRPS using a functional analysis
      and differential reinforcement, with several extensions to common
      procedures. Results present the first example of behavioral reduction
      for self-injury in BRPS.
    explanation: >-
      The first published behavioural treatment demonstration in this
      disorder, supporting the approach while acknowledging n=1.
  - reference: PMID:36249891
    reference_title: "Treatment of Self-Injury in Bainbridge-Ropers Syndrome: Replication and Extensions of Behavioral Assessments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

- name: Neurodevelopmental and Multisystem Clinical Phenotype
  biological_scale: ORGANISM
  description: >-
    The terminal node: a static (non-degenerative) neurodevelopmental
    phenotype comprising moderate-to-severe intellectual disability, absent or
    profoundly limited speech, autistic features, central hypotonia evolving
    toward limb hypertonia, severe infantile feeding difficulty with failure
    to thrive, gastroesophageal reflux, and a nonspecific craniofacial
    gestalt, with generalized epilepsy in a minority.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:38420660
    reference_title: "ASXL3-related disorder: Molecular phenotyping and comprehensive review providing insights into disease mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common phenotypic features comprised global developmental delay or
      intellectual disability (97%), feeding problems (76%), hypotonia (88%)
      and characteristic facial features (93%).
    explanation: >-
      Quantifies the terminal clinical phenotype across the published
      literature.
  - reference: PMID:33151654
    reference_title: ASXL3-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ASXL3-related disorder is characterized by developmental delay or
      intellectual disability, typically in the moderate to severe range, with
      speech and language delay and/or absent speech.
    explanation: >-
      The GeneReviews clinical summary of the terminal phenotype.

- name: Absence of an ASXL3 DNA Methylation Episignature
  biological_scale: MOLECULAR
  description: >-
    A negative but mechanistically informative finding. Blood DNA methylation
    signatures are established for many chromatinopathies, and ASXL1-related
    Bohring-Opitz syndrome has a robust one. When that classifier was applied
    to ASXL3 patients their methylation profiles were control-like, and unlike
    ASXL1 and ASXL2 patients they showed no epigenetic age acceleration. This
    means (a) there is currently no validated episignature available to help
    classify ASXL3 variants of uncertain significance, and (b) ASXL3
    dysfunction diverges mechanistically from ASXL1 despite paralogy - which
    is a molecular argument for keeping BRPS and BOS as separate entities.
  mechanism_confidence: PROVISIONAL
  role: BIOMARKER
  notes: >-
    Based on only three ASXL3 individuals; an adequately powered BRPS-specific
    episignature study has not been done. Do not read the negative result as
    proof that no ASXL3 signature exists.
  evidence:
  - reference: PMID:35361921
    reference_title: "DNA methylation signature associated with Bohring-Opitz syndrome: a new tool for functional classification of variants in ASXL genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The DNAm profile of one individual with the ASXL2 variant was BOS-like,
      whereas the DNAm profiles of three individuals with ASXL3 variants were
      control-like.
    explanation: >-
      Directly reports that ASXL3 patients lack the ASXL1/BOS methylation
      signature.
  - reference: PMID:35361921
    reference_title: "DNA methylation signature associated with Bohring-Opitz syndrome: a new tool for functional classification of variants in ASXL genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      which showed acceleration in DNAm age in individuals with pathogenic
      ASXL1 variants, and the individual with the pathogenic ASXL2 variant,
      but not in individuals with ASXL3 variants.
    explanation: >-
      The absence of epigenetic age acceleration in ASXL3 further separates it
      from ASXL1 and ASXL2.


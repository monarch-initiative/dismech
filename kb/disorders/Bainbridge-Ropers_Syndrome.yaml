- name: Genetic counseling
  description: >-
    Counseling should cover the autosomal dominant, usually de novo, mode of
    inheritance; the low but non-zero sibling recurrence risk from parental
    germline or gonosomal mosaicism; the availability of prenatal and
    preimplantation genetic testing once a familial variant is known; and the
    option of ultra-deep parental sequencing to refine recurrence risk after
    an apparently de novo diagnosis.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33151654
    reference_title: ASXL3-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If the ASXL3 pathogenic variant identified in the proband is not
      identified in either parent, the risk to sibs is presumed to be low but
      greater than that of the general population because of the possibility
      of parental germline mosaicism.
    explanation: >-
      The GeneReviews recurrence-risk statement that counseling must convey.
  - reference: PMID:33151654
    reference_title: ASXL3-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Once the ASXL3 pathogenic variant has been identified in an affected
      family member, prenatal testing for a pregnancy at increased risk and
      preimplantation genetic testing are possible.
    explanation: >-
      Establishes the reproductive options to be discussed.
  - reference: PMID:39833101
    reference_title: Comprehensive Clinical and Genetic Characterization of a Spanish Cohort of 22 Patients With Bainbridge-Ropers Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We documented recurrence in nontwin siblings due to parental mosaicism.
    explanation: >-
      Provides the concrete observed basis for the mosaicism recurrence-risk
      counselling point.

discussions:
- discussion_id: brps_human_model_mismatch_neural_fate
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Disrupted Neural Cell Fate Specification
  status: OPEN
  prompt: >-
    Does the severe early neural cell-fate specification defect seen on ASXL3
    knockdown in Xenopus laevis embryos actually occur in human ASXL3
    haploinsufficiency, given that most affected individuals have structurally
    normal brain MRI?
  rationale: >-
    The strongest mechanistic link between the ASXL3 chromatin lesion and the
    neurodevelopmental phenotype comes from a morpholino knockdown in a frog
    embryo, which produces open neural plates and loss of hindbrain, primary
    neuron and neural crest markers - a far more dramatic patterning failure
    than anything seen in human patients, in whom GeneReviews notes that most
    individuals with seizures still have normal brain MRI. Two features of the
    model may explain the gap and limit translation: morpholino knockdown
    approaches a near-null state whereas human disease is heterozygous
    haploinsufficiency, and the human transcriptomic evidence comes from
    dermal fibroblasts rather than neural tissue. The translational validity of
    the cell-fate mechanism, not its existence in the model, is the open
    question.
  evidence:
  - reference: PMID:32132929
    reference_title: Modeling Bainbridge-Ropers Syndrome in Xenopus laevis Embryos.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this study, we utilize the frog, Xenopus laevis as a simpler and more
      accessible vertebrate neurodevelopmental model system to understand the
      embryological cause of Bainbridge-Ropers syndrome.
    explanation: >-
      Identifies the model system whose translational validity to human
      heterozygous ASXL3 disease is the subject of this mismatch item.
  proposed_experiments:
  - experiment_id: brps_exp_ipsc_cortical_patterning
    name: Cortical differentiation of ASXL3 heterozygous iPSC and organoid models
    description: >-
      Differentiate ASXL3 patient-derived and isogenic heterozygous-null iPSC
      lines into cortical neurons and cerebral organoids, then assay regional
      patterning, cortical layer identity, and genome-wide H2AK119Ub1
      distribution. This tests whether a human heterozygous gene dose is
      sufficient to produce a measurable neural cell-fate defect, which the
      near-null frog knockdown cannot address.
    decision_criterion: >-
      A reproducible shift in layer-marker proportions or regional identity in
      heterozygous versus isogenic control lines, accompanied by redistributed
      H2AK119Ub1 at developmental loci, would support translation of the frog
      cell-fate mechanism to human heterozygous dosage.
  - experiment_id: brps_exp_quantitative_mri
    name: Quantitative volumetric and cortical-thickness MRI in an ASXL3 cohort
    description: >-
      Perform quantitative volumetric and cortical-thickness MRI in a
      phenotyped ASXL3 cohort against matched controls, to test whether subtle
      structural differences exist below the threshold at which routine
      clinical radiology reports an abnormality.
    decision_criterion: >-
      Statistically significant reduction in cortical thickness or
      upper-layer-associated volume relative to matched controls would
      reconcile the model finding with the clinical observation of
      "normal" MRI.
  - experiment_id: brps_exp_heterozygous_vertebrate_model
    name: Dose-controlled heterozygous vertebrate model of Asxl3 loss
    description: >-
      Generate and phenotype a heterozygous (rather than morpholino
      knockdown-null) vertebrate model to test whether the early neural
      patterning defect is dose-dependent and whether it attenuates at a gene
      dosage comparable to human disease.
    decision_criterion: >-
      Persistence of a measurable patterning phenotype at heterozygous dosage
      would support translational relevance; complete rescue at heterozygous
      dosage would indicate the knockdown phenotype is a null-specific
      artefact.

- discussion_id: brps_missing_episignature
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Absence of an ASXL3 DNA Methylation Episignature
  status: OPEN
  prompt: >-
    Is there a genuine ASXL3-specific DNA methylation episignature that a
    dedicated, adequately powered study would detect, or does ASXL3
    haploinsufficiency truly leave no peripheral blood methylation footprint?
  rationale: >-
    The only relevant data come from applying an ASXL1/Bohring-Opitz classifier
    to three ASXL3 individuals, whose profiles were control-like. That is a
    negative result from a classifier built for a different gene on a very
    small sample, not evidence of absence. The question matters clinically
    because without an episignature there is no functional assay to
    reclassify ASXL3 variants of uncertain significance, which is precisely
    where the missense-variant question is unresolved.
  evidence:
  - reference: PMID:35361921
    reference_title: "DNA methylation signature associated with Bohring-Opitz syndrome: a new tool for functional classification of variants in ASXL genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the DNAm profiles of three individuals with ASXL3 variants were
      control-like
    explanation: >-
      The sole empirical basis for the current belief that ASXL3 has no
      episignature - three individuals tested with a classifier built for a
      different gene - which is why this remains an open gap rather than a
      settled negative.
  proposed_experiments:
  - experiment_id: brps_exp_dedicated_episignature
    name: Adequately powered ASXL3-specific blood DNA methylation study
    description: >-
      Profile genome-wide blood DNA methylation in a cohort of 25 or more
      individuals with confirmed pathogenic ASXL3 variants against
      sex- and age-matched controls, powered to derive a signature de novo
      rather than by cross-classification with an ASXL1-derived model.
    decision_criterion: >-
      Identification of a reproducible set of differentially methylated
      positions that classifies held-out ASXL3 cases would establish an
      ASXL3 episignature; failure at this sample size would substantially
      strengthen the negative result.
  - experiment_id: brps_exp_episignature_by_variant_class
    name: Episignature stratification by NMD class and mutational cluster region
    description: >-
      Stratify any candidate methylation signature by nonsense-mediated-decay
      versus no-NMD variant class and by MCR1 (exon 11) versus MCR2 (exon 12)
      location, to test whether the two proposed mechanistic classes leave
      different epigenomic footprints.
    decision_criterion: >-
      Divergent methylation profiles between the NMD and no-NMD groups would
      provide molecular support for two distinct disease mechanisms rather
      than a single haploinsufficiency mechanism.
  - experiment_id: brps_exp_episignature_vus_classification
    name: Clinical validation of an ASXL3 episignature for variant classification
    description: >-
      Test any derived signature against ASXL3 missense variants and variants
      of uncertain significance to establish whether it has clinical utility
      for reclassification.
    decision_criterion: >-
      Concordant classification of known pathogenic and known benign control
      variants would qualify the assay for clinical variant interpretation.

- discussion_id: brps_penetrance_expressivity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#ASXL3
  status: OPEN
  prompt: >-
    Is ASXL3-related disorder fully penetrant, and if not, is the apparent
    nonpenetrance in inherited-variant families genuine reduced penetrance or
    misclassification of variant pathogenicity?
  rationale: >-
    Almost the entire published cohort consists of de novo protein-truncating
    variants ascertained through severely affected probands, so penetrance has
    never been estimated against an unbiased denominator and a reader would
    reasonably but wrongly infer complete penetrance. The inherited-variant
    series reports substantial intrafamilial and possible interfamilial
    variability, with transmitting parents who are mildly affected or
    apparently unaffected. Critically, the authors decline to attribute this to
    reduced penetrance, offering instead the competing explanation that the
    inherited variants may not be pathogenic - an ambiguity that cannot be
    resolved without a functional assay, which is precisely what the absent
    episignature denies. Systematic review lists penetrance among the explicit
    unresolved gaps. This matters directly for counselling families in whom an
    ASXL3 variant is inherited rather than de novo.
  evidence:
  - reference: PMID:42494517
    reference_title: Broadening the inherited ASXL3 spectrum and unveiling molecular mechanisms through detailed genotypic-phenotypic analyses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      substantial intrafamilial phenotypic variability, as well as the
      possibility of interfamilial phenotypic variability
    explanation: >-
      Establishes variable expressivity across and within families carrying
      inherited ASXL3 variants.
  - reference: PMID:42494517
    reference_title: Broadening the inherited ASXL3 spectrum and unveiling molecular mechanisms through detailed genotypic-phenotypic analyses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The family reports emphasize the possibility of additional, yet
      currently unidentified, factors influencing phenotypic expression or,
      alternatively, may reflect uncertainty about the pathogenicity of
      inherited ASXL3 variants.
    explanation: >-
      The authors explicitly refuse to separate reduced penetrance or modifier
      effects from pathogenicity uncertainty, which is why this is curated as
      an open gap rather than as a penetrance estimate.
  - reference: PMID:38420660
    reference_title: "ASXL3-related disorder: Molecular phenotyping and comprehensive review providing insights into disease mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several gaps in our knowledge of this disorder were identified, namely,
      underlying pathophysiology and disease mechanism, disease contribution
      of missense variants, relevance of variant location, prevalence and
      penetrance data.
    explanation: >-
      A systematic review names penetrance data as an explicit, unresolved
      knowledge gap.
  proposed_experiments:
  - experiment_id: brps_exp_biobank_penetrance
    name: Unselected-cohort penetrance estimation for ASXL3 truncating variants
    description: >-
      Ascertain ASXL3 protein-truncating variants in large unselected
      population biobanks with linked phenotype data, rather than through
      clinically referred probands, and measure the proportion of carriers
      meeting neurodevelopmental diagnostic criteria.
    decision_criterion: >-
      A carrier frequency substantially exceeding the expected disease
      prevalence, with a meaningful fraction of carriers lacking a
      neurodevelopmental diagnosis, would establish reduced penetrance for at
      least some variant classes.
  - experiment_id: brps_exp_family_deep_phenotyping
    name: Deep phenotyping and mosaicism testing of transmitting parents
    description: >-
      Systematically deep-phenotype apparently unaffected transmitting parents
      in inherited ASXL3 families and apply ultra-deep sequencing of multiple
      tissues to distinguish true germline heterozygosity with reduced
      penetrance from low-level parental mosaicism.
    decision_criterion: >-
      Demonstration of constitutional heterozygosity in a rigorously
      phenotyped unaffected parent would establish genuine nonpenetrance;
      detection of mosaicism would instead explain the mild parental phenotype
      without invoking reduced penetrance.

- discussion_id: brps_missense_contribution
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#ASXL3
  status: OPEN
  prompt: >-
    Do ASXL3 missense variants contribute to disease, and if so to which
    phenotype - autism spectrum disorder without syndromic features, a
    recessive congenital heart phenotype, or nothing at all?
  rationale: >-
    Every established BRPS variant is protein-truncating. Missense ASXL3
    variants have been reported in autism cohorts without the severe syndromic
    features, and biallelic missense variants have been reported in a small
    number of individuals with congenital heart defects, but neither
    association is established. Systematic reviews list the disease
    contribution of missense variants as an explicit unresolved gap. Without
    an episignature or another functional assay there is currently no way to
    resolve individual missense variants of uncertain significance.
  evidence:
  - reference: PMID:38420660
    reference_title: "ASXL3-related disorder: Molecular phenotyping and comprehensive review providing insights into disease mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several gaps in our knowledge of this disorder were identified, namely,
      underlying pathophysiology and disease mechanism, disease contribution
      of missense variants, relevance of variant location, prevalence and
      penetrance data.
    explanation: >-
      A systematic review names the disease contribution of missense variants
      as an explicit, unresolved knowledge gap.
  proposed_experiments:
  - experiment_id: brps_exp_deubad_deep_mutational_scan
    name: Deep mutational scanning of the ASXL3 DEUBAD domain
    description: >-
      Perform saturation mutagenesis of the ASXL3 DEUBAD (BAP1-binding)
      domain and measure BAP1 binding and PR-DUB H2A deubiquitinase activity
      for each substitution, generating a functional score for every possible
      missense change in the domain.
    decision_criterion: >-
      A bimodal functional score distribution separating known pathogenic
      truncating-equivalent losses from tolerated substitutions would provide
      a calibrated assay for missense variant interpretation.
  - experiment_id: brps_exp_missense_burden
    name: Rare ASXL3 missense burden analysis in neurodevelopmental cohorts
    description: >-
      Conduct a case-control burden analysis of rare ASXL3 missense variants
      in large autism and neurodevelopmental-disorder cohorts against
      population reference data.
    decision_criterion: >-
      Significant excess of rare missense variants in cases after correction
      would support a genuine, phenotypically milder missense contribution
      distinct from the truncating BRPS phenotype.
  - experiment_id: brps_exp_biallelic_missense_chd
    name: Segregation and functional follow-up of biallelic missense congenital heart defect families
    description: >-
      Re-examine segregation and perform functional assays in the reported
      families with biallelic ASXL3 missense variants and congenital heart
      defects, to determine whether this represents a genuinely distinct
      recessive allelic disorder or an incidental finding.
    decision_criterion: >-
      Consistent biallelic segregation with a shared functional deficit
      across independent families would support a distinct recessive
      ASXL3-related cardiac phenotype.

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate exists. More than 200 individuals
    have been reported in the literature, and the largest single analyses
    aggregate 204 individuals from the literature and natural history study.
    The prevalence_class is assigned qualitatively on the basis of published
    case counts, not from a denominator-based epidemiological study; treat any
    numeric estimate for this disorder with suspicion.
  evidence:
  - reference: PMID:42494517
    reference_title: Broadening the inherited ASXL3 spectrum and unveiling molecular mechanisms through detailed genotypic-phenotypic analyses.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we conducted a detailed genotype-phenotype review of 204 individuals
      from the literature, including the International ASXL3 Natural History
      Study
    explanation: >-
      Establishes the order of magnitude of reported cases (about 200
      worldwide), which supports an ultra-rare qualitative classification but
      is not a prevalence measurement.
  - reference: PMID:38420660
    reference_title: "ASXL3-related disorder: Molecular phenotyping and comprehensive review providing insights into disease mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several gaps in our knowledge of this disorder were identified, namely,
      underlying pathophysiology and disease mechanism, disease contribution
      of missense variants, relevance of variant location, prevalence and
      penetrance data.
    explanation: >-
      A systematic review explicitly names prevalence data as a knowledge gap,
      supporting the decision not to assert a numeric rate.

notes: >-
  Deep research provenance: this entry was curated after a
  `just research-disorder claude_code Bainbridge-Ropers_Syndrome` run
  (report at research/Bainbridge-Ropers_Syndrome-deep-research-claude_code.md).
  The deep-research report was treated as a lead generator only; every PMID
  cited here was independently fetched with `just fetch-reference` and every
  snippet copied from the cached abstract.
  Deliberately NOT curated: (1) the 2026 bioRxiv preprint describing an
  ASXL3-DIO3-thyroid hormone-parvalbumin interneuron axis and an AAV
  split-intein gene replacement rescue in mice and non-human primates. This
  is the most interesting mechanistic and therapeutic development in the
  field, but it is an unrefereed preprint and could not be fetched into
  references_cache with the standard tooling, so it is omitted rather than
  cited weakly. It should be added once peer-reviewed. (2) Somatic ASXL3
  mutations in tumours, which have no established driver role and are not
  part of this constitutional disorder. (3) The provisional biallelic-missense
  congenital heart defect phenotype, which is captured as a knowledge gap
  rather than as an asserted allelic disorder.


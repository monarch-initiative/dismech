      infantile problem.
  - reference: PMID:40552904
    reference_title: "An International ASXL3 Natural History Study: Deep Phenotypic Analyses Including Detailed Reports of a Milder Phenotype, Novel Associations, and Clinical Recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

genetic:
- name: ASXL3
  gene_term:
    preferred_term: ASXL3
    term:
      id: hgnc:29357
      label: ASXL3
  association: >-
    Heterozygous protein-truncating (nonsense, frameshift, canonical
    splice-site) variants, clustered in the two large coding exons 11 and 12
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    ASXL3 (18q12.1) is the sole established cause of Bainbridge-Ropers
    syndrome and is severely constrained against loss of function. Two
    mutational cluster regions are recognized, MCR1 in exon 11 and MCR2 in
    exon 12, and they are associated with different phenotypic profiles.
    Missense variants are not established as a cause of the autosomal dominant
    disorder. PENETRANCE AND EXPRESSIVITY: penetrance is not established. The
    de novo truncating variants that define the classical phenotype are
    treated as fully penetrant in practice, but the inherited-variant series
    documents substantial intrafamilial and possible interfamilial variability
    and describes mildly affected or apparently unaffected transmitting
    parents. The authors themselves decline to separate genuinely reduced
    penetrance from uncertainty about the pathogenicity of those inherited
    variants, so no penetrance figure is asserted here; see the
    brps_penetrance_expressivity discussion. Systematic review lists
    penetrance data as an explicit knowledge gap. GENE-IDENTITY GUARD: this
    entry's causal gene is ASXL3 (hgnc:29357), NOT the paralogs ASXL1
    (Bohring-Opitz syndrome) or ASXL2 (Shashi-Pena syndrome); every citation
    below was checked to name ASXL3.
  evidence:
  - reference: PMID:23383720
    reference_title: De novo truncating mutations in ASXL3 are associated with a novel clinical phenotype with similarities to Bohring-Opitz syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using genome-wide sequencing, we identified heterozygous, de novo
      truncating mutations in ASXL3, a transcriptional repressor related to
      ASXL1, in four unrelated probands.
    explanation: >-
      The gene-discovery study establishing heterozygous de novo truncating
      ASXL3 variants as causal.
  - reference: PMID:38420660
    reference_title: "ASXL3-related disorder: Molecular phenotyping and comprehensive review providing insights into disease mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of genetic variants were de novo truncating variants in
      exon 11 or 12 of the ASXL3 gene.
    explanation: >-
      Confirms the variant class and exonic clustering across the published
      literature.
  - reference: PMID:42494517
    reference_title: Broadening the inherited ASXL3 spectrum and unveiling molecular mechanisms through detailed genotypic-phenotypic analyses.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phenotypes in 2 mutational clusters, mutational cluster region 1 (MCR1)
      (c.1095_2237, exon 11; n = 66) and mutational cluster region 2 (MCR2)
      (c.3043_4906, exon 12; n = 101), were also analyzed.
    explanation: >-
      Defines the two mutational cluster regions by coordinate and exon.
  - reference: PMID:39833101
    reference_title: Comprehensive Clinical and Genetic Characterization of a Spanish Cohort of 22 Patients With Bainbridge-Ropers Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with variants in the 3' mutational cluster region (MCR) of
      exon 12 exhibited more perinatal feeding problems, and those with
      variants in the 5' MCR of exon 11 displayed lower percentiles in height
      and occipitofrontal circumference, as well as higher frequency of arched
      eyebrows.
    explanation: >-
      Provides the genotype-phenotype correlation between mutational cluster
      region and clinical profile.
  - reference: PMID:32132929
    reference_title: Modeling Bainbridge-Ropers Syndrome in Xenopus laevis Embryos.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Human genomic studies also identified missense ASXL3 variants associated
      with autism spectrum disorder, but lacking more severe Bainbridge-Ropers
      syndromic features.
    explanation: >-
      Supports the statement that missense variants do not produce the full
      BRPS phenotype, though the disease contribution of missense variants
      remains an acknowledged open question.

diagnosis:
- name: ASXL3 molecular genetic testing
  description: >-
    The diagnosis is molecular. There are no consensus clinical diagnostic
    criteria, no biochemical marker, and no validated methylation
    episignature, so identification of a heterozygous pathogenic ASXL3 variant
    is required. In practice trio exome or genome sequencing is the workhorse;
    an intellectual disability multigene panel is an alternative, and
    chromosomal microarray remains standard first-line for undiagnosed
    developmental delay although it rarely identifies ASXL3 variants.
  presence: >-
    Identification of a heterozygous pathogenic or likely pathogenic ASXL3
    variant in a proband with suggestive clinical features establishes the
    diagnosis.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33151654
    reference_title: ASXL3-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of ASXL3-related disorder is established in a proband by
      identification of a heterozygous pathogenic variant in ASXL3 by
      molecular genetic testing.
    explanation: >-
      GeneReviews states the diagnostic criterion directly.
  - reference: PMID:28100473
    reference_title: "Delineating the phenotypic spectrum of Bainbridge-Ropers syndrome: 12 new patients with de novo, heterozygous, loss-of-function mutations in ASXL3 and review of published literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Trio-based exome sequencing was performed on all 12 patients included in
      this study, which found a de novo truncating mutation in ASXL3.
    explanation: >-
      Documents trio exome sequencing as the practical diagnostic route.

- name: Electroencephalography
  description: >-
    EEG is the most informative functional test when paroxysmal events occur.
    It distinguishes true generalized epilepsy from the non-epileptic
    breath-holding, hyperventilation and dystonic episodes that also occur in
    this disorder, and therefore prevents over-treatment with anti-seizure
    medication.
  presence: >-
    Generalized spike-wave, photoparoxysmal response, and occipital
    intermittent rhythmic epileptiform activity support a generalized epilepsy
    diagnosis; absence of an ictal correlate during a clinical episode
    indicates a non-epileptic event.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:29367179
    reference_title: Childhood-onset generalized epilepsy in Bainbridge-Ropers syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EEG typically showed features consistent with generalized epilepsy
      including generalized spike-wave, photoparoxysmal response, and
      occipital intermittent rhythmic epileptiform activity.
    explanation: >-
      Describes the characteristic EEG findings that support the diagnosis of
      the associated epilepsy syndrome.

differential_diagnoses:
- name: Bohring-Opitz syndrome
  description: >-
    THE critical differential and the origin of this entry's named-entity
    confusion risk. Bohring-Opitz syndrome is caused by de novo truncating
    variants in ASXL1, the closest paralog of ASXL3, and Bainbridge-Ropers
    syndrome was originally described in 2013 as a phenotype "with
    similarities to Bohring-Opitz syndrome". The two are now established as
    clinically and molecularly distinct entities and are curated separately in
    dismech. Any paper describing ASXL1 patients must not be used as evidence
    for ASXL3-related phenotypes.
  disease_term:
    preferred_term: Bohring-Opitz syndrome
    term:
      id: MONDO:0011510
      label: Bohring-Opitz syndrome
  distinguishing_features:
  - BOS is caused by ASXL1 (hgnc:18318); BRPS is caused by ASXL3 (hgnc:29357).
  - The BOS-defining features - characteristic arm posture, intrauterine growth retardation, microcephaly, trigonocephaly, facial nevus flammeus, exophthalmos - are largely absent in ASXL3 patients.
  - BOS has a validated blood DNA methylation episignature and epigenetic age acceleration; ASXL3 patients are control-like on both measures.
  - BRPS is dominated by profound speech impairment and severe muscular hypotonia with a long face and poor facial expressivity.
  evidence:
  - reference: PMID:27901041
    reference_title: "Bainbridge-Ropers syndrome caused by loss-of-function variants in ASXL3: a recognizable condition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of key features characteristic for Bohring-Opitz syndrome
      were absent in our patients (eg, the typical posture of arms,
      intrauterine growth retardation, microcephaly, trigonocephaly, typical
      facial gestalt with nevus flammeus of the forehead and exophthalmos).
      Therefore we emphasize that BRPS syndrome, caused by ASXL3
      loss-of-function variants, is a clinically distinct intellectual
      disability syndrome with a recognizable phenotype distinguishable from
      that of Bohring-Opitz syndrome.
    explanation: >-
      The definitive clinical statement that BRPS is distinguishable from
      Bohring-Opitz syndrome, and the enumeration of the discriminating
      features.
  - reference: PMID:23383720
    reference_title: De novo truncating mutations in ASXL3 are associated with a novel clinical phenotype with similarities to Bohring-Opitz syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further, they showed less phenotypic overlap with patients who had de
      novo truncating mutations in ASXL1.
    explanation: >-
      Even the founding paper, which framed BRPS as Bohring-Opitz-like, noted
      reduced phenotypic overlap with ASXL1 patients - an early signal of the
      eventual split.
  - reference: PMID:35361921
    reference_title: "DNA methylation signature associated with Bohring-Opitz syndrome: a new tool for functional classification of variants in ASXL genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the DNAm profiles of three individuals with ASXL3 variants were
      control-like
    explanation: >-
      Provides molecular (episignature) separation between the ASXL1 and ASXL3
      disorders.

- name: Shashi-Pena syndrome
  description: >-
    The third member of the ASXL disorder triad, caused by de novo truncating
    variants in ASXL2. It shares developmental delay, feeding difficulty,
    hypotonia and arched eyebrows with BRPS but is separated by macrocephaly
    and absence of growth retardation. Because all three ASXL disorders are
    routinely discussed together, papers on ASXL2 must not be cited as
    evidence for ASXL3 phenotypes.
  disease_term:
    preferred_term: Shashi-Pena syndrome
    term:
      id: MONDO:0014963
      label: Shashi-Pena syndrome
  distinguishing_features:
  - Shashi-Pena syndrome is caused by ASXL2; BRPS by ASXL3.
  - Macrocephaly and absence of growth retardation distinguish the ASXL2 condition from ASXL1- and ASXL3-related disorders.
  - ASXL2 truncating transcripts escape nonsense-mediated decay and are thought to act dominant-negatively, whereas ASXL3 NMD-class variants act by haploinsufficiency.
  - Glabellar nevus flammeus and prominent eyes are characteristic of Shashi-Pena syndrome and are not features of BRPS.
  evidence:
  - reference: PMID:27693232
    reference_title: De Novo Truncating Variants in ASXL2 Are Associated with a Unique and Recognizable Clinical Phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although overlapping features with Bohring-Opitz and Bainbridge-Ropers
      syndromes exist, features that distinguish the ASXL2-associated
      condition from ASXL1- and ASXL3-related disorders are macrocephaly,
      absence of growth retardation, and more variability in the degree of
      intellectual disabilities.
    explanation: >-
      States explicitly which features separate the ASXL2 disorder from the
      ASXL1 and ASXL3 disorders.
  - reference: PMID:33751773
    reference_title: "Understanding the phenotypic spectrum of ASXL-related disease: Ten cases and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Over the past decade, pathogenic variants in all members of the ASXL
      family of genes, ASXL1, ASXL2, and ASXL3, have been found to lead to
      clinically distinct but overlapping syndromes.
    explanation: >-
      A direct statement that the three ASXL syndromes are clinically distinct
      despite overlap, supporting the keep-split decision.

- name: Angelman syndrome
  description: >-
    ASXL3 variants are recovered in cohorts of individuals with an
    Angelman-like presentation, because absent speech, seizures, and a happy
    or excitable demeanour overlap. Molecular testing separates them.
  disease_term:
    preferred_term: Angelman syndrome
    term:
      id: MONDO:0007113
      label: Angelman syndrome
  distinguishing_features:
  - Angelman syndrome arises from loss of maternal UBE3A function (deletion, UPD, imprinting defect, or variant), not from ASXL3.
  - BRPS lacks the characteristic Angelman EEG pattern and the ataxic gait with jerky limb movements.
  - Angelman syndrome methylation and UBE3A testing are diagnostic and will be normal in BRPS.
  evidence:
  - reference: PMID:33751773
    reference_title: "Understanding the phenotypic spectrum of ASXL-related disease: Ten cases and a review of the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This will assist in diagnosis of these overlapping conditions and allow
      clinicians to more comprehensively counsel affected families.
    explanation: >-
      Supports the general point that the ASXL disorders present as
      overlapping neurodevelopmental conditions requiring careful diagnostic
      discrimination; it does not itself name Angelman syndrome, so this is
      marked PARTIAL.

- name: Other Mendelian chromatinopathies with syndromic intellectual disability
  description: >-
    Because the developmental delay and dysmorphism of BRPS are nonspecific,
    the practical differential is broad and includes the other Mendelian
    disorders of the epigenetic machinery presenting with intellectual
    disability, limited speech, and behavioural difficulty. Discrimination is
    molecular rather than clinical.
  disease_term:
    preferred_term: syndromic intellectual disability
    term:
      id: MONDO:0000508
      label: syndromic intellectual disability
  distinguishing_features:
  - Each chromatinopathy is separated by its causal gene; only ASXL3 variants establish BRPS.
  - Several other chromatinopathies have validated blood DNA methylation episignatures that can classify variants, whereas ASXL3 currently does not.
  evidence:
  - reference: PMID:35361921
    reference_title: "DNA methylation signature associated with Bohring-Opitz syndrome: a new tool for functional classification of variants in ASXL genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our previous work has shown that syndromic conditions caused by
      pathogenic variants in epigenetic regulatory genes show consistent
      patterns of genome-wide DNA methylation (DNAm) alterations, i.e., DNAm
      signatures in peripheral blood.
    explanation: >-
      Supports the framing of BRPS within the broader class of epigenetic
      regulatory gene disorders and the episignature-based approach to
      distinguishing them.

treatments:
- name: Feeding therapy and gastrostomy tube placement
  description: >-
    The highest-yield intervention in infancy. Clinical feeding evaluation
    with a low threshold for referral, feeding therapy, and nasogastric then
    gastrostomy feeding where oral intake is inadequate. Many children later
    wean off tube feeding as feeding skills improve with age.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: gastrostomy
    term:
      id: NCIT:C52006
      label: Gastrostomy
  target_phenotypes:

  - reference: PMID:33151654
    reference_title: ASXL3-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      standard treatment for epilepsy, joint contractures, sleep apnea, dental

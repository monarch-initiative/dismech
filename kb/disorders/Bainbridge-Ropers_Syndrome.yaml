review_notes: >-
  NAMED-ENTITY-CONFUSION / LUMP-VS-SPLIT REASONING. The ASXL family is a
  documented confusion class and this entry sits at its centre. ASXL1 causes
  Bohring-Opitz syndrome (BOS, MONDO:0011510, curated separately at
  kb/disorders/Bohring-Opitz_syndrome.yaml); ASXL2 causes Shashi-Pena syndrome
  (SHAPNS, MONDO:0014963); ASXL3 causes Bainbridge-Ropers syndrome (BRPS,
  MONDO:0014205, this entry). The three are paralogous PR-DUB scaffolds with
  overlapping core features (developmental delay, hypotonia, feeding
  difficulty, dysmorphism), and BRPS was literally introduced in 2013 as a
  phenotype "with similarities to Bohring-Opitz syndrome" (PMID:23383720), so
  the older literature and many secondary sources conflate them.
  DECISION: KEEP SPLIT. Three independent lines of evidence support treating
  BRPS as a distinct disease entity rather than lumping it with BOS or SHAPNS.
  (1) Gene/ontology anchor: MONDO:0014205 asserts RO:0004003 to HGNC:29357
  (ASXL3) and xrefs OMIM:615485, distinct from ASXL1/BOS (OMIM 605039) and
  ASXL2/SHAPNS (OMIM 617190). (2) Clinical discrimination: Kuechler et al.
  demonstrated that the defining BOS features (the characteristic arm posture,
  IUGR, microcephaly, trigonocephaly, nevus flammeus, exophthalmos) are
  largely absent in ASXL3 patients and concluded BRPS is "a clinically
  distinct intellectual disability syndrome with a recognizable phenotype
  distinguishable from that of Bohring-Opitz syndrome" (PMID:27901041);
  SHAPNS is separated by macrocephaly and absence of growth retardation
  (PMID:27693232). (3) Molecular discrimination: the ASXL1/BOS blood DNA
  methylation episignature does not classify ASXL3 patients, whose profiles
  are control-like, and ASXL3 patients show no epigenetic age acceleration
  (PMID:35361921) - a mechanistic dissociation despite paralogy.
  CURATION GUARDRAIL: every citation in this entry was checked for which ASXL
  paralog it reports. Papers cited here for BRPS-specific claims name ASXL3
  explicitly. ASXL1 and ASXL2 papers appear ONLY in the
  differential_diagnoses section and in explicitly comparative statements;
  no ASXL1/ASXL2 finding is used to support an ASXL3 phenotype or mechanism.

progression:
- phase: Prenatal and neonatal presentation
  age_range: Prenatal period to the neonatal period
  notes: >-
    Intrauterine growth restriction is the commonest prenatal finding, and
    antenatal/neonatal structural anomalies are more frequent than previously
    appreciated. Presentation at birth is usually with hypotonia and feeding
    difficulty rather than a recognizable dysmorphic gestalt.
  evidence:
  - reference: PMID:39833101
    reference_title: Comprehensive Clinical and Genetic Characterization of a Spanish Cohort of 22 Patients With Bainbridge-Ropers Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The predominant prenatal finding was intrauterine growth restriction
      (35%) followed, after birth, by feeding difficulties (90.5%), hypotonia
      (85.7%), and gastroesophageal reflux disease (82.4%).
    explanation: >-
      The largest single-country cohort documents the prenatal-to-neonatal
      sequence of IUGR followed by feeding difficulty and hypotonia.
  - reference: PMID:40552904
    reference_title: "An International ASXL3 Natural History Study: Deep Phenotypic Analyses Including Detailed Reports of a Milder Phenotype, Novel Associations, and Clinical Recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Findings include: an increased prevalence of antenatal and neonatal
      structural anomalies, an emerging renal phenotype, a tendency for poor
      post-natal growth (with novel reports of obesity later in childhood),
      and a lower-than-expected prevalence of seizures (compared to the
      existing literature).
    explanation: >-
      The international natural-history cohort documents increased antenatal
      and neonatal structural anomalies at this phase.
- phase: Infancy - feeding failure and hypotonia
  age_range: Birth through infancy
  notes: >-
    Severe feeding difficulty dominates infancy, frequently requiring
    nasogastric then gastrostomy feeding, with failure to thrive, marked
    central hypotonia, and gastroesophageal reflux. This is the phase that
    typically triggers referral and molecular testing.
  evidence:
  - reference: PMID:23383720
    reference_title: De novo truncating mutations in ASXL3 are associated with a novel clinical phenotype with similarities to Bohring-Opitz syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that these probands shared similar phenotypes, including severe
      feeding difficulties, failure to thrive, and neurologic abnormalities
      with significant developmental delay.
    explanation: >-
      The founding description establishes severe infantile feeding difficulty
      and failure to thrive as the presenting phenotype.
  - reference: PMID:33151654
    reference_title: ASXL3-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of manifestations: Feeding therapy; gastrostomy tube placement
      for those with persistent feeding issues
    explanation: >-
      GeneReviews indicates that feeding difficulty in this phase is often
      severe enough to require gastrostomy.
- phase: Childhood - neurodevelopmental and behavioral phase
  age_range: Early childhood through adolescence
  notes: >-
    Once feeding stabilizes, the picture is dominated by moderate-to-severe
    intellectual disability with absent or minimal speech, autistic features,
    sleep disturbance, self-injury and aggression, and in a minority
    childhood-onset generalized epilepsy. Tone may evolve from central
    hypotonia toward limb hypertonia and flexion contractures.
  evidence:
  - reference: PMID:33151654
    reference_title: ASXL3-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals may also have hypotonia that can transition to
      spasticity resulting in unusual posture with flexion contractions of the
      elbows, wrists, and fingers.
    explanation: >-
      GeneReviews documents the evolution of tone from hypotonia toward
      spasticity and contractures over childhood.
  - reference: PMID:29367179
    reference_title: Childhood-onset generalized epilepsy in Bainbridge-Ropers syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three had childhood-onset generalized epilepsy with generalized
      tonic-clonic seizures, with one also having atypical absence seizures.
    explanation: >-
      Where epilepsy occurs, its onset is in childhood with a generalized
      phenotype.
- phase: Later childhood and adulthood - gradual functional gains on a static substrate
  age_range: Later childhood through adulthood
  notes: >-
    The underlying developmental lesion is static, not degenerative. Deep
    phenotyping shows measurable improvement over time in feeding, tone,
    verbalisation and motor skills, and many children wean off tube feeding,
    though near-universal intellectual disability and communication impairment
    persist and most individuals require lifelong support. Poor postnatal
    growth may give way to obesity later in childhood.
  evidence:
  - reference: PMID:40552904
    reference_title: "An International ASXL3 Natural History Study: Deep Phenotypic Analyses Including Detailed Reports of a Milder Phenotype, Novel Associations, and Clinical Recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report significant phenotypic variability, but improvement trends in
      feeding, hypotonia, verbalisation, and motor skills over time.
    explanation: >-
      Longitudinal natural-history data support gradual functional gains
      rather than regression, an important counselling point.

clinical_burden:
  burden_level: HIGH
  rationale: >-
    Near-universal moderate-to-severe intellectual disability with absent or
    minimal speech, lifelong dependence for most activities of daily living,
    high rates of tube feeding in infancy, and a substantial neurobehavioral
    burden (self-injury, aggression, sleep disturbance) requiring
    multidisciplinary and often psychiatric care.
  evidence:
  - reference: PMID:28100473
    reference_title: "Delineating the phenotypic spectrum of Bainbridge-Ropers syndrome: 12 new patients with de novo, heterozygous, loss-of-function mutations in ASXL3 and review of published literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      common emerging features include severe intellectual disability (11/12),
      poor/ absent speech (12/12), autistic traits (9/12)
    explanation: >-
      Near-universal severe intellectual disability and absent speech in a
      systematically phenotyped cohort underpin the high burden rating.
  - reference: PMID:34086428
    reference_title: Comorbid Psychiatric Aspects of Bainbridge-Ropers Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 7 patients (100%) had multiple DSM-5 diagnoses.
    explanation: >-
      Every individual in this clinical series carried multiple psychiatric
      diagnoses, indicating substantial additional care burden.

inheritance:
- name: Autosomal dominant, typically de novo
  description: >-
    BRPS is inherited in an autosomal dominant manner and is typically caused
    by a de novo heterozygous protein-truncating ASXL3 variant. Transmission
    from a mildly affected or mosaic parent is documented but uncommon, and
    sibling recurrence attributable to parental gonadal or gonosomal mosaicism
    has been reported, so recurrence risk after an apparently de novo event is
    low but not negligible.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:33151654
    reference_title: ASXL3-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ASXL3-related disorder is an autosomal dominant disorder typically
      caused by a de novo pathogenic variant.
    explanation: >-
      GeneReviews states the mode of inheritance and the predominance of
      de novo variants.
  - reference: PMID:33151654
    reference_title: ASXL3-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rarely, individuals diagnosed with ASXL3-related disorder have the
      disorder as the result of a pathogenic variant inherited from a parent.
    explanation: >-
      Supports the documented but uncommon inherited route.
  - reference: PMID:39833101
    reference_title: Comprehensive Clinical and Genetic Characterization of a Spanish Cohort of 22 Patients With Bainbridge-Ropers Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We documented recurrence in nontwin siblings due to parental mosaicism.
    explanation: >-
      Directly documents sibling recurrence via parental mosaicism, the basis
      for the non-negligible recurrence-risk counselling point.

pathophysiology:
- name: ASXL3 Haploinsufficiency from Protein-Truncating Variants
  biological_scale: MOLECULAR
  description: >-
    A heterozygous nonsense, frameshift, or canonical splice-site variant,
    almost always falling in the two large coding exons 11 and 12, is the
    initiating lesion. For variants predicted to trigger nonsense-mediated
    decay the mutant transcript is degraded and total ASXL3 message and
    protein fall, producing true haploinsufficiency. A second class of
    truncating variants escapes decay and yields a truncated protein, and the
    two classes are associated with measurably different clinical severity,
    which argues that reduced dosage is the dominant but not the only
    mechanism.
  mechanism_confidence: ESTABLISHED
  gene:
    preferred_term: ASXL3
    term:
      id: hgnc:29357
      label: ASXL3
  biological_processes:
  - preferred_term: nonsense-mediated decay of the mutant ASXL3 transcript
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
    modifier: INCREASED
  cell_types:
  - preferred_term: patient dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Impaired PR-DUB Deubiquitinase Complex Function
    causal_link_type: DIRECT
    description: >-
      Reduced ASXL3 protein limits assembly of the ASXL3-BAP1 PR-DUB complex,
      of which ASXL3 is an obligate scaffolding subunit.
    evidence:
    - reference: PMID:26647312
      reference_title: De novo dominant ASXL3 mutations alter H2A deubiquitination and transcription in Bainbridge-Ropers syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We found that ASXL3 interacts with BAP1, a hydrolase that removes
        mono-ubiquitin from histone H2A lysine 119 (H2AK119Ub1) as a component
        of the Polycomb repressive deubiquitination (PR-DUB) complex.
      explanation: >-
        Establishes that ASXL3 is a constituent of PR-DUB, so that reduced
        ASXL3 dosage directly compromises the complex.
  evidence:
  - reference: PMID:23383720
    reference_title: De novo truncating mutations in ASXL3 are associated with a novel clinical phenotype with similarities to Bohring-Opitz syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using genome-wide sequencing, we identified heterozygous, de novo
      truncating mutations in ASXL3, a transcriptional repressor related to
      ASXL1, in four unrelated probands.
    explanation: >-
      Establishes heterozygous de novo truncating ASXL3 variants as the
      initiating molecular lesion.
  - reference: PMID:26647312
    reference_title: De novo dominant ASXL3 mutations alter H2A deubiquitination and transcription in Bainbridge-Ropers syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ASXL3 mRNA transcripts from the mutated allele are prone to
      nonsense-mediated decay, and expression of ASXL3 is reduced.
    explanation: >-
      Patient fibroblasts directly demonstrate NMD of the mutant allele and
      reduced ASXL3 expression, the molecular definition of
      haploinsufficiency.
  - reference: PMID:38420660
    reference_title: "ASXL3-related disorder: Molecular phenotyping and comprehensive review providing insights into disease mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of genetic variants were de novo truncating variants in
      exon 11 or 12 of the ASXL3 gene.
    explanation: >-
      A systematic review confirms the exon 11/12 clustering of the causal
      truncating variants.
  - reference: PMID:42494517
    reference_title: Broadening the inherited ASXL3 spectrum and unveiling molecular mechanisms through detailed genotypic-phenotypic analyses.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Statistical comparisons were made between individuals with variants
      leading to no protein product
    explanation: >-
      Establishes the two-class analysis dividing individuals into a
      nonsense-mediated-decay group (n = 87, no protein product) and a
      no-NMD protein-truncating group (n = 117). Marked PARTIAL because this
      shows the two classes are separable and were compared, but does not by
      itself prove that the no-NMD truncated protein acts by a distinct
      (e.g. dominant-negative) molecular mechanism.

- name: Impaired PR-DUB Deubiquitinase Complex Function
  biological_scale: MOLECULAR
  description: >-
    ASXL3 is a non-catalytic scaffolding subunit of the Polycomb repressive
    deubiquitinase (PR-DUB) complex, binding the ubiquitin C-terminal
    hydrolase BAP1 through its DEUBAD module. BAP1 has little activity on
    nucleosomes on its own and depends on an ASXL partner, so reduced ASXL3
    dosage limits assembly of functional ASXL3-BAP1 PR-DUB and blunts its
    catalytic output. The ASXL paralogs are epigenetic scaffolds more
    generally, also engaging EZH2, nuclear receptors and other partners.
  mechanism_confidence: ESTABLISHED
  protein_complexes:
  - preferred_term: ASXL3-BAP1 PR-DUB complex
    term:
      id: GO:0035517
      label: PR-DUB complex
  molecular_functions:
  - preferred_term: histone H2A deubiquitinase activity of the PR-DUB complex
    term:
      id: GO:0140950
      label: histone H2A deubiquitinase activity
    modifier: DECREASED
  downstream:
  - target: Elevated H2A Lysine 119 Monoubiquitination
    causal_link_type: DIRECT
    description: >-
      Loss of PR-DUB catalytic output leaves the repressive H2AK119
      monoubiquitin mark abnormally elevated.
    evidence:
    - reference: PMID:26647312
      reference_title: De novo dominant ASXL3 mutations alter H2A deubiquitination and transcription in Bainbridge-Ropers syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        A significant increase in H2AK119Ub1 was observed in ASXL3 patient
        fibroblasts, highlighting an important functional role for ASXL3 in
        PR-DUB mediated deubiquitination.
      explanation: >-
        Directly measures the increase in H2AK119Ub1 that follows loss of
        ASXL3-dependent PR-DUB activity.
  evidence:
  - reference: PMID:26647312
    reference_title: De novo dominant ASXL3 mutations alter H2A deubiquitination and transcription in Bainbridge-Ropers syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that ASXL3 interacts with BAP1, a hydrolase that removes
      mono-ubiquitin from histone H2A lysine 119 (H2AK119Ub1) as a component
      of the Polycomb repressive deubiquitination (PR-DUB) complex.
    explanation: >-
      Directly establishes the ASXL3-BAP1 PR-DUB interaction that this node
      describes.
  - reference: PMID:25835095
    reference_title: "Functional proteomics of the epigenetic regulators ASXL1, ASXL2 and ASXL3: a convergence of proteomics and epigenetics for translational medicine."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ASXL1, ASXL2 and ASXL3 are epigenetic scaffolds for BAP1, EZH2, NCOA1,
      nuclear receptors and WTIP.
    explanation: >-
      A functional-proteomics review supports the scaffolding role of ASXL3
      for BAP1 and additional chromatin and nuclear-receptor partners.
  - reference: PMID:32132929
    reference_title: Modeling Bainbridge-Ropers Syndrome in Xenopus laevis Embryos.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      ASXL3 protein is a component of the polycomb deubiquitinase complex that
      removes mono-ubiquitin from Histone H2A.
    explanation: >-
      Independently confirms ASXL3 membership in the H2A-directed Polycomb
      deubiquitinase complex.

- name: Elevated H2A Lysine 119 Monoubiquitination
  biological_scale: MOLECULAR
  description: >-
    Loss of PR-DUB output leaves H2AK119 monoubiquitination abnormally high.
    This mark is the repressive output of Polycomb repressive complex 1, and
    its dynamic removal by PR-DUB is required for normal derepression of
    developmental target genes. BRPS was the first single-gene disorder
    attributed to a defect in H2AK119Ub1 deubiquitination, making this the
    defining chromatin lesion of the syndrome.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: PR-DUB-mediated histone H2A deubiquitination
    term:
      id: GO:0016579
      label: protein deubiquitination
    modifier: DECREASED
  - preferred_term: chromatin organization at Polycomb target loci
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  cell_types:
  - preferred_term: patient dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Absence of an ASXL3 DNA Methylation Episignature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The chromatin lesion does not propagate into a detectable peripheral
      blood DNA methylation signature: ASXL3 patients profile as control-like
      on the ASXL1/Bohring-Opitz classifier. The steps that would connect an
      elevated H2AK119Ub1 mark to a blood DNAm readout are unknown, and this
      edge asserts the absence of a detectable downstream signature rather
      than a positive effect.
    evidence:
    - reference: PMID:35361921
      reference_title: "DNA methylation signature associated with Bohring-Opitz syndrome: a new tool for functional classification of variants in ASXL genes."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the DNAm profiles of three individuals with ASXL3 variants were
        control-like
      explanation: >-
        The only measurement linking the ASXL3 chromatin lesion to a blood
        methylation readout, and it is negative. Marked PARTIAL because it
        rests on three individuals tested with a classifier built for a
        different paralog, so absence of a detectable signature is not
        established as absence of a signature.
  - target: Genome-Wide Transcriptional Dysregulation
    causal_link_type: DIRECT
    description: >-
      The altered chromatin state produces widespread bidirectional changes in
      gene expression in patient-derived cells.
    evidence:
    - reference: PMID:26647312
      reference_title: De novo dominant ASXL3 mutations alter H2A deubiquitination and transcription in Bainbridge-Ropers syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Transcriptomes of ASXL3 patient and control fibroblasts were compared
        to investigate the impact of chromatin changes on transcriptional
        regulation.
      explanation: >-
        The study design explicitly tests, and the results establish, the
        chromatin-to-transcription link asserted by this edge.
  evidence:
  - reference: PMID:26647312
    reference_title: De novo dominant ASXL3 mutations alter H2A deubiquitination and transcription in Bainbridge-Ropers syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A significant increase in H2AK119Ub1 was observed in ASXL3 patient
      fibroblasts, highlighting an important functional role for ASXL3 in
      PR-DUB mediated deubiquitination.
    explanation: >-
      Directly measures the elevated H2AK119Ub1 mark in patient-derived cells.
  - reference: PMID:26647312
    reference_title: De novo dominant ASXL3 mutations alter H2A deubiquitination and transcription in Bainbridge-Ropers syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This is the first single gene disorder linked to defects in
      deubiquitination of H2AK119Ub1
    explanation: >-
      Establishes the H2AK119Ub1 deubiquitination defect as the defining
      molecular lesion of this disorder.

- name: Genome-Wide Transcriptional Dysregulation
  conforms_to: "epigenetic_alterations#Altered Epigenetic Regulation of Gene Expression"
  biological_scale: MOLECULAR
  description: >-
    The aberrant chromatin state translates into widespread transcriptional
    change. Patient fibroblast transcriptomes show hundreds of differentially
    expressed genes split almost evenly between up- and downregulated, which
    is more consistent with loss of a chromatin scaffold that tunes both
    repression and activation than with loss of a pure repressor. The affected
    genes are enriched for transcriptional regulation, development, and
    proliferation.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: dysregulated transcription of developmental target genes
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: ABNORMAL
  - preferred_term: epigenetic regulation of gene expression
    term:
      id: GO:0040029
      label: epigenetic regulation of gene expression
    modifier: ABNORMAL
  cell_types:
  - preferred_term: patient dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Disrupted Neural Cell Fate Specification
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Transcriptional dysregulation during early neural patterning is inferred
      to derail cell-fate specification. The specific intermediate target
      genes in human neural tissue are not known, and the direct evidence is
      model-organism only.
    intermediate_mechanisms:
    - Derepression of Polycomb target genes at neural patterning loci
    - Altered dosage of hindbrain, primary neuron, and neural crest fate determinants
    evidence:
    - reference: PMID:32132929
      reference_title: Modeling Bainbridge-Ropers Syndrome in Xenopus laevis Embryos.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Dynamic chromatin modifications play important roles in the
        specification of cell fates during early neural patterning and
        development.
      explanation: >-
        Supports the general chromatin-to-cell-fate link. Marked PARTIAL
        because the intermediates between the human transcriptional signature
        and a human neural cell-fate defect are not established.
  evidence:
  - reference: PMID:26647312
    reference_title: De novo dominant ASXL3 mutations alter H2A deubiquitination and transcription in Bainbridge-Ropers syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Out of 564 significantly differentially expressed genes (DEGs) in ASXL3
      patient fibroblasts, 52% were upregulated and 48% downregulated. DEGs
      were enriched in molecular processes impacting transcriptional
      regulation, development and proliferation, consistent with the features
      of BRS.
    explanation: >-
      Quantifies the transcriptional consequence and its near-symmetric
      up/down distribution in patient cells.

- name: Disrupted Neural Cell Fate Specification
  biological_scale: CELLULAR
  description: >-
    The developmental consequence of ASXL3 loss falls on early neural
    patterning. In a vertebrate embryo model, ASXL3 depletion severely
    perturbs specification of neural cell fates, with reduced expression of
    hindbrain, primary neuron, and neural crest markers, while spinal-cord
    identity is relatively spared. This positions ASXL3 as a chromatin
    regulator required during the earliest steps of nervous system induction
    and anteroposterior patterning, which is when the human phenotype is
    determined.
  mechanism_confidence: PROVISIONAL

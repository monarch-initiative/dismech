      vision) is seen in 20%– 90% of patients but is not pathognomonic of this syn- drome.
    explanation: >-
      The reported 20–90% range establishes variable FOS expression and explicitly excludes diagnostic
      specificity.
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      An ictal EEG is not required for diagnosis.
    explanation: >-
      The diagnostic criteria do not require capture of an ictal EEG.
- name: Brain Magnetic Resonance Imaging
  description: >-
    Brain MRI is required to exclude a causal structural lesion. A causal abnormality or occipital calcifications
    argues against the COVE syndrome even when visual seizure semiology is similar.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Neuroimaging is normal. Brain MRI is required to exclude a structural brain abnormality.
    explanation: >-
      MRI is required to exclude a structural cause in the COVE diagnostic pathway.
- name: Sleep EEG for Emerging Cognitive Regression
  description: >-
    New cognitive regression requires reassessment and a sleep EEG because rare evolution to epileptic
    encephalopathy with spike-and-wave activation in sleep has been reported. Regression should not
    be accepted as routine uncomplicated COVE.
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      COVE may rarely evolve to EE- SWAS; therefore, if cognitive regression oc- curs, a sleep EEG
      should be performed.
    explanation: >-
      The consensus specifically recommends sleep EEG if cognitive regression occurs.
- name: Genetic Testing Context
  description: >-
    Genetic testing is not required to establish a typical COVE diagnosis because no syndrome-specific
    causal gene is identified. This does not preclude a broader etiological evaluation when the presentation
    suggests another epilepsy syndrome.
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Genetic testing is not required, as there are no genes iden- tified for this epilepsy syndrome.
      It is presumed that the etiology is genetic, and likely complex/polygenic in inher- itance.
    explanation: >-
      The COVE-specific genetics section states that no syndrome gene is identified and describes
      a presumed complex genetic etiology.
differential_diagnoses:
- name: Migraine with Aura
  disease_term:
    preferred_term: migraine with aura
    term:
      id: MONDO:0005475
      label: migraine with aura
  description: >-
    Migraine with visual aura is a common diagnostic confusion, particularly when a visual seizure is
    followed by migraine-like headache.
  distinguishing_features:
  - Migraine aura usually develops more gradually and lasts longer than the abrupt, brief visual seizure.
  - Linear, zigzag or fortification patterns favor migraine aura; small colored circles or moving flashes favor occipital visual seizures.
  - Clinical timing, EEG and imaging are interpreted together; no isolated FOS result establishes the diagnosis.
  evidence:
  - reference: PMID:19955346
    reference_title: >-
      Idiopathic childhood occipital epilepsy of Gastaut: a review and
      differentiation from migraine and other epilepsies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Idiopathic childhood occipital epilepsy of Gastaut is frequently
      misdiagnosed as migraine with visual aura, acephalgic, or basilar
      migraine.
    explanation: >-
      Names migraine with visual aura explicitly as the differential that is
      most often confused with this syndrome.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Migraine with visual aura can be distinguished by the more gradual development and longer duration
      of the aura, and the character of the visual phenomena (linear, zig- zag, or fortification spectral
      phenomena as opposed to colored circles or light flashes that change in size or move horizontally).
    explanation: >-
      The consensus specifies onset, duration and visual pattern as distinguishing features.
- name: Self-Limited Epilepsy with Autonomic Seizures
  disease_term:
    preferred_term: self-limited epilepsy with autonomic seizures
    term:
      id: MONDO:0020307
      label: self-limited epilepsy with autonomic seizures
  description: >-
    Self-limited epilepsy with autonomic seizures can also show occipital EEG abnormalities, but prominent
    autonomic manifestations distinguish its clinical syndrome.
  distinguishing_features:
  - Autonomic symptoms, especially retching or vomiting at seizure onset, are prominent rather than an initial focal visual symptom.
  - Seizures often occur in sleep and may be prolonged.
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      SeLEAS is differentiated by prominent dry retching/ vomiting and other autonomic features that
      are seen at seizure onset.
    explanation: >-
      The consensus contrasts the prominent autonomic onset of SeLEAS with visual occipital seizures.
- name: Photosensitive Occipital Lobe Epilepsy
  disease_term:
    preferred_term: photosensitive occipital lobe epilepsy
    term:
      id: MONDO:0100021
      label: photosensitive occipital lobe epilepsy
  description: >-
    The fourth self-limited focal epilepsy, and the closest mimic in seizure
    content, since its seizures are also visual and occipital in origin. The
    separation is by trigger.
  distinguishing_features:
  - Photic-induced focal visual seizures, for example with flickering sunlight or video games, are required for POLE.
  - Eye closure and intermittent photic stimulation facilitate occipital EEG abnormalities; spontaneous visual seizures may also occur.
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Photic- induced, focal sensory visual seizures (induced for example by flickering sunlight)
      are mandatory for diagnosis and the main seizure type.
    explanation: >-
      The required photic trigger distinguishes POLE from COVE, rather than the visual content alone.
- name: Self-Limited Epilepsy with Centrotemporal Spikes
  disease_term:
    preferred_term: self-limited epilepsy with centrotemporal spikes
    term:
      id: MONDO:0007295
      label: self-limited epilepsy with centrotemporal spikes
  description: >-
    Self-limited epilepsy with centrotemporal spikes shares an age-limited course but usually has orofacial
    seizure manifestations. Centrotemporal spikes can coexist in COVE, so EEG topography alone does
    not settle the syndrome.
  distinguishing_features:
  - Focal clonic or tonic activity of the throat, tongue or one side of the lower face favors SeLECTS.
  - Centrotemporal sharp-and-slow-wave complexes are activated in drowsiness and sleep.
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Seizures are often brief, and typically involve focal clonic or tonic activity of the throat/tongue
      and one side of the lower face,
    explanation: >-
      The characteristic orofacial semiology distinguishes SeLECTS from an initial visual seizure.
- name: Structural Occipital Lobe Epilepsy
  description: >-
    A causal structural brain lesion can produce clinically similar occipital seizures. Imaging is necessary
    to distinguish this etiological category from COVE.
  distinguishing_features:
  - A causal lesion on MRI excludes the COVE syndrome.
  - Occipital calcifications suggest a different diagnosis; persistent visual field deficit or progressive neurological findings also require reassessment.
  evidence:
  - reference: PMID:19955346
    reference_title: >-
      Idiopathic childhood occipital epilepsy of Gastaut: a review and
      differentiation from migraine and other epilepsies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Differentiation from symptomatic occipital epilepsy, particularly when
      children are otherwise normal, can be difficult.
    explanation: >-
      States directly that separating the self-limited syndrome from lesional
      occipital epilepsy is difficult, which is why this differential is
      carried.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Neuroimaging is normal. Brain MRI is required to exclude a structural brain abnormality.
    explanation: >-
      MRI is required to exclude a structural cause in the COVE diagnostic pathway.
discussions:
- discussion_id: cove_fixation_off_causal_or_marker
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Under what conditions, if any, does fixation-off sensitivity facilitate habitual clinical seizures
    in COVE rather than only interictal EEG abnormalities?
  attaches_to:
  - "pathophysiology#Fixation-Dependent Gating of Occipital Discharges"
  rationale: >-
    FOS is variable and nonspecific. A 12-year video-EEG study outside idiopathic childhood occipital
    epilepsies documented only one directly induced clinical seizure, an absence, among its 14 fully
    characterized patients. That result limits extrapolation but does not measure seizure induction
    within COVE. An EEG marker and a seizure-facilitating influence are not mutually exclusive, and
    neither interpretation alone establishes therapeutic benefit from manipulating fixation.
  proposed_experiments:
  - experiment_id: cove_fos_seizure_induction_yield
    experiment_design: HUMAN_OBSERVATIONAL
    name: Prospective quantification of seizure induction by fixation-off within this syndrome
    description: >-
      In a prospectively characterized COVE cohort, compare standardized fixation-preserving and fixation-removing
      recording conditions within each participant. Separately count interictal EEG responses and
      electroclinically verified habitual visual seizures, accounting for sleep state, medication
      and baseline seizure burden.
    decision_criterion: >-
      A reproducible within-participant increase in habitual electroclinical seizures during fixation
      removal would support seizure facilitation under the tested conditions. Interictal activation
      alone would not. A low yield could reflect limited power or testing conditions and would not
      prove absence of a facilitating role.
  - experiment_id: cove_fos_habitual_seizure_correlation
    name: Correlation of habitual seizure timing with fixation-off conditions
    description: >-
      Seizure diaries paired with ambulatory recording, testing whether
      habitual spontaneous seizures cluster around real-world
      fixation-eliminating conditions such as darkness, eye closure, or
      waking, rather than being distributed across the day independently of
      visual engagement.
    decision_criterion: >-
      An adjusted temporal association would motivate controlled physiological testing but would not
      establish causation. Lack of association would constrain only the measured conditions, given
      diary error and unmeasured triggers.
    experiment_design: HUMAN_OBSERVATIONAL
  evidence:
  - reference: PMID:19258232
    reference_title: >-
      Fixation-off sensitivity in epilepsies other than the idiopathic
      epilepsies of childhood with occipital paroxysms: a 12-year
      clinical-video EEG study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven of these patterns were associated with habitual seizures in seven
      patients, but actual FOS-induced seizures (absences) were documented
      with video EEG in only one patient; three others had some historical
      evidence suggesting that, under some circumstances, their FOS EEG
      abnormalities might generate clinical seizures.
    explanation: >-
      The cohort explicitly excluded idiopathic childhood occipital epilepsies; its low directly observed
      seizure yield is indirect context for an unresolved COVE-specific question.
    directness: INDIRECT
  - reference: PMID:19258232
    reference_title: >-
      Fixation-off sensitivity in epilepsies other than the idiopathic
      epilepsies of childhood with occipital paroxysms: a 12-year
      clinical-video EEG study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although FOS appears to be of relatively low epileptogenicity, an
      electroclinical profile of pure FOS epilepsy may exist
    explanation: >-
      The authors cautiously discuss low epileptogenicity and a possible distinct FOS epilepsy phenotype;
      they do not establish the seizure-triggering role of FOS in COVE.
    directness: INDIRECT
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Fixation- off sensitivity (facilitation of epileptiform abnormalities with elimination of central
      vision) is seen in 20%– 90% of patients but is not pathognomonic of this syn- drome.
    explanation: >-
      The reported 20–90% range establishes variable FOS expression and explicitly excludes diagnostic
      specificity.
- discussion_id: cove_migraine_shared_substrate
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Which processes account for postictal headache and the family history of migraine reported in COVE?
  attaches_to:
  - pathophysiology#Postictal Headache Development
  rationale: >-
    Postictal migraine-like headache is common, and migraine family history is reported in a minority
    of cases. These clinical observations do not establish a shared genetic substrate or a specific
    trigeminovascular pathway. Seizure-triggered headache and independent migraine can coexist; medication
    effects and natural remission complicate comparisons after seizure control.
  proposed_experiments:
  - experiment_id: cove_headache_after_seizure_control
    name: Headache trajectory after seizure control
    description: >-
      Longitudinal follow-up of children whose visual seizures are fully
      controlled on medication, tracking headache frequency and phenotype
      before and after control, using standardized headache criteria rather
      than clinical impression.
    decision_criterion: >-
      A reduction in headaches temporally linked to seizure control would support an association with
      seizure burden. Persistent independently classified migraine would support coexistence. Neither
      outcome alone distinguishes a shared substrate from a seizure-triggered pathway, particularly
      when medication treats both conditions.
    experiment_design: HUMAN_OBSERVATIONAL
  - experiment_id: cove_migraine_family_history_enrichment
    name: Family history and comorbid migraine enrichment
    description: >-
      Systematic ascertainment of personal and family history of migraine in
      a cohort with this syndrome against matched children with a
      non-occipital self-limited focal epilepsy, testing whether migraine
      burden is specifically enriched in the occipital syndrome rather than
      in childhood epilepsy generally.
    decision_criterion: >-
      Adjusted enrichment would support an epidemiological association worth testing genetically or
      physiologically, not prove a shared occipital mechanism. A null result would require adequate
      power and comparable ascertainment.
    experiment_design: HUMAN_OBSERVATIONAL
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Postictal headache with migrainelike features is common (in 50% of patients) and may be associated
      with nausea and vomiting.
    explanation: >-
      The source directly reports postictal headache in approximately half of patients, sometimes
      with nausea and vomiting.
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      a family history of migraine is reported in 9%– 16% of cases.
    explanation: >-
      Migraine family history is reported in 9–16%, without establishing the mechanism of postictal
      headache.
- discussion_id: cove_why_some_do_not_remit
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What predicts delayed or absent remission in COVE, and how much of the outcome difference associated
    with other seizure types reflects broader epilepsy biology versus classification differences?
  attaches_to:
  - "pathophysiology#Age-Dependent Remission of the Epileptogenic State"
  rationale: >-
    Remission is common but not universal at a given follow-up age. Persistence at age 16 is not evidence
    of lifelong failure to remit. Historical referral cohorts associate additional epilepsy syndromes
    with poorer outcome, while the ILAE synthesis also associates bilateral tonic–clonic seizures with
    lower remission. These observations do not distinguish causal effects of a second syndrome from
    shared susceptibility, selection or misclassification.
  proposed_experiments:
  - experiment_id: cove_outcome_stratification_prospective
    experiment_design: HUMAN_OBSERVATIONAL
    name: Prospective stratification by isolated versus syndrome-associated status
    description: >-
      A prospective cohort recruited at diagnosis rather than at referral,
      classified as isolated or syndrome-associated by protocol at entry,
      with the second syndrome ascertained by prolonged
      electroencephalography rather than by history, followed to age eighteen
      for seizure freedom and electroencephalographic resolution.
    decision_criterion: >-
      A replicated outcome difference after standardized classification and adjustment would support
      prognostic value, not establish that the second syndrome causes persistence. Attenuation after
      reclassification would support a contribution from classification or selection differences.
  - experiment_id: cove_remission_predictors_electrographic
    name: Electrographic predictors of remission
    description: >-
      Serial electroencephalography through adolescence in a cohort with this
      syndrome, testing whether features of the occipital discharge at
      diagnosis, such as its spatial extent, whether it remains strictly
      unilateral, and the strength of fixation-off gating, predict which
      children remit and which do not.
    decision_criterion: >-
      A replicated EEG predictor would identify a prognostic marker requiring independent validation
      and mechanistic investigation. Failure to detect a predictor would not exclude relevant EEG
      biology or establish a distinct nonremitting subgroup.
    experiment_design: HUMAN_OBSERVATIONAL
  evidence:
  - reference: PMID:19955346
    reference_title: >-
      Idiopathic childhood occipital epilepsy of Gastaut: a review and
      differentiation from migraine and other epilepsies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients usually respond well to antiepileptic medication and about
      two-thirds remit by the age of 16 years.
    explanation: >-
      The older review supplies an age-specific remission estimate; the remaining patients cannot
      be classified as permanently nonremitting from this statement.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:26498733
    reference_title: >-
      Clinical dissection of childhood occipital epilepsy of Gastaut and
      prognostic implication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients were subdivided into two groups: group A with isolated COE-G;
      group B with other epileptic syndromes associated with COE-G.
    explanation: >-
      Defines the stratification along which the outcome difference is
      observed, which is the axis the proposed experiments test.
    directness: DIRECT
  - reference: PMID:26498733
    reference_title: >-
      Clinical dissection of childhood occipital epilepsy of Gastaut and
      prognostic implication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The association of typical COE-G symptoms with other types of seizure
      could be related to a poor epilepsy outcome.
    explanation: >-
      The authors' own cautious framing, which stops at association rather
      than asserting causation, matching the open status of this gap.
    directness: DIRECT
  - reference: PMID:26498733
    reference_title: >-
      Clinical dissection of childhood occipital epilepsy of Gastaut and
      prognostic implication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This was a retrospective analysis of the long-term outcome of epilepsy
      in 129 patients with COE-G who were referred to 23 Italian epilepsy
      centres and one in Austria between 1991 and 2004.
    explanation: >-
      The retrospective, referral-based design is exactly the limitation that
      makes the misclassification reading impossible to exclude, which is why
      the proposed experiment is prospective and protocol-classified.
    directness: DIRECT
- discussion_id: cove_absent_genetic_basis
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which genetic factors contribute to COVE susceptibility, and to what extent are they shared with
    other self-limited focal epilepsies?
  attaches_to:
  - "pathophysiology#Age-Dependent Hyperexcitability of the Occipital Cortex"
  rationale: >-
    The ILAE consensus presumes a complex genetic etiology but identifies no causal syndrome gene. Familial
    aggregation does not establish a Mendelian pattern. Genetic findings from adjacent syndromes cannot
    be assigned to COVE without syndrome-specific evidence, and age-dependent remission alone does not
    prove a particular developmental genetic program.
  proposed_experiments:
  - experiment_id: cove_multicentre_sequencing_cohort
    name: Multicentre sequencing cohort assembled on strict syndrome criteria
    description: >-
      Exome or genome sequencing of a multicentre cohort recruited strictly
      on current ILAE criteria for childhood occipital visual epilepsy, with
      parental samples where available, powered by aggregation across the
      centres that already contribute to the long-term outcome literature.
    decision_criterion: >-
      Replicated variant or locus enrichment with appropriate controls, segregation analysis where
      applicable and functional follow-up would support a genetic contribution. A null result would
      only constrain detectable effects at the achieved power; it would not prove polygenic inheritance
      or exclude rare monogenic subgroups.
    experiment_design: HUMAN_OBSERVATIONAL
  - experiment_id: cove_polygenic_score_transfer
    name: Transfer of self-limited focal epilepsy polygenic signal
    description: >-
      Testing whether polygenic scores derived from the better-powered
      self-limited epilepsy with centrotemporal spikes cohorts are elevated
      in children with the occipital syndrome, which would indicate shared
      susceptibility architecture across the family.
    decision_criterion: >-
      A replicated score association after ancestry and ascertainment control would support shared
      susceptibility. Lack of transfer could reflect low power, population differences or score performance
      and would not establish a distinct architecture.
    experiment_design: HUMAN_OBSERVATIONAL
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Genetic testing is not required, as there are no genes iden- tified for this epilepsy syndrome.
      It is presumed that the etiology is genetic, and likely complex/polygenic in inher- itance.
    explanation: >-
      The COVE-specific genetics section states that no syndrome gene is identified and describes
      a presumed complex genetic etiology.
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A family history of febrile seizures or epilepsy occurs in up to one third of cases,
    explanation: >-
      Familial aggregation supports the presumed genetic contribution without identifying a causal
      locus or transmission pattern.

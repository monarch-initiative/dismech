name: Childhood Occipital Visual Epilepsy
creation_date: "2026-08-05T00:00:00Z"
category: Complex
description: >-
  A self-limited focal epilepsy of childhood in which the seizures are made of
  vision. A child of school age suddenly sees small coloured circles drifting
  across one side of the visual field, or goes blind for a minute, and then it
  passes. The attacks are brief, they happen in daylight rather than in sleep,
  they come many times a week, and a headache often follows them closely enough
  to be mistaken for migraine. Between attacks the child is neurologically
  normal and the brain scan is normal; the only abnormal investigation is the
  electroencephalogram, which shows spikes over the occipital regions that
  characteristically appear the moment the eyes stop fixating on anything and
  disappear again as soon as fixation returns. That last property, called
  fixation-off sensitivity, is the mechanistic curiosity of the syndrome: the
  epileptic discharge is gated by whether the visual system is being used. Most
  children respond to a single antiseizure medication and about two-thirds have
  stopped having seizures by the age of sixteen, which is why the syndrome is
  classified as self-limited rather than as an encephalopathy.
parents:
  - Epilepsy
  - Neurological Disease
synonyms:
  - COVE
  - childhood occipital epilepsy (Gastaut type)
  - idiopathic childhood occipital epilepsy of Gastaut
  - late-onset benign childhood occipital epilepsy
  - COE-G
classifications:

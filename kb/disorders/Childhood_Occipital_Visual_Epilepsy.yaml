diagnosis:
- name: ILAE Electroclinical Criteria
  description: >-
    Diagnosis requires focal sensory visual seizures, predominantly or exclusively in wakefulness, and
    occipital spikes or spike-and-wave abnormalities on awake or sleep EEG. Table 4 lists onset before
    6 or after 14 years, prolonged seizures over 15 minutes, sustained focal slowing, intellectual disability
    and significant neurological examination abnormalities as alerts requiring caution. Onset before
    1 or after 19 years, neurocognitive regression, persistent visual field deficit, causal MRI lesion,
    occipital calcifications, progressive myoclonus and progressive ataxia or spasticity are among exclusions.
    Alerts should prompt reassessment rather than being treated as automatic exclusions.
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Focal sensory visual seizures during wakefulness are mandatory for diagnosis. They have abrupt
      onset, are brief (typically seconds, most lasting <3 min, rarely up to 20 min), and frequent
      without treatment.
    explanation: >-
      Visual seizures in wakefulness define the syndrome; individual attacks are generally brief and
      frequent without treatment.
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Occipital spikes or spikes- and- wave abnormalities (awake or sleep)
    explanation: >-
      Table 4 makes this EEG finding mandatory.
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Alert criteria are absent in the vast majority of cases, but rarely can be seen. Their presence
      should result in caution in diagnosing the syndrome and consideration of other conditions.
    explanation: >-
      The table distinguishes diagnostic alerts from exclusionary features.
- name: Wake and Sleep Electroencephalography
  description: >-
    Seek occipital sharp waves or spike-and-wave abnormalities during wakefulness and sleep. Some patients
    have abnormalities only in sleep; sleep deprivation can enhance detection. Test fixation-off activation
    when appropriate, but its absence does not exclude COVE and its presence is not specific. The background
    is normally preserved. An ictal recording is not required for diagnosis.
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The background activity is normal. Interictal occipital sharp waves or spike- and- wave complexes
      are typically seen but may only occur in sleep.
    explanation: >-
      Occipital interictal abnormalities can be confined to sleep despite a normal EEG background.
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-

      locus or transmission pattern.
pathophysiology:
- name: Age-Dependent Hyperexcitability of the Occipital Cortex
  biological_scale: TISSUE
  description: >-
    An age-dependent susceptibility to occipital epileptic activity is inferred from visual seizure
    semiology, occipital EEG abnormalities, absence of a causal MRI lesion and frequent remission during
    maturation. The responsible molecular and cellular changes are unresolved. Nonoccipital EEG abnormalities
    can coexist, so the susceptibility is not necessarily confined to the occipital lobe.
  locations:
  - preferred_term: occipital lobe
    term:
      id: UBERON:0002021
      label: occipital lobe
  downstream:
  - target: Fixation-Dependent Gating of Occipital Discharges
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      FOS is a variable expression of the inferred excitability state.
  - target: Occipital Interictal Epileptiform Discharges
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Occipital Ictal Discharge
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The background activity is normal. Interictal occipital sharp waves or spike- and- wave complexes
      are typically seen but may only occur in sleep.
    explanation: >-
      Occipital interictal abnormalities can be confined to sleep despite a normal EEG background.
      This is clinical support for the inferred excitability model, not a direct measurement of its
      cellular substrate.
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Focal sensory visual seizures during wakefulness are mandatory for diagnosis. They have abrupt
      onset, are brief (typically seconds, most lasting <3 min, rarely up to 20 min), and frequent
      without treatment.
    explanation: >-
      Visual seizures in wakefulness define the syndrome; individual attacks are generally brief and
      frequent without treatment. This is clinical support for the inferred excitability model, not
      a direct measurement of its cellular substrate.
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Remission occurs in 50%– 80% of patients by puberty with or without administration of ASM.
    explanation: >-
      The review reports remission by puberty in 50–80%, including treated and untreated patients;
      remission is not universal. This is clinical support for the inferred excitability model, not
      a direct measurement of its cellular substrate.
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Centrotemporal, fron- tal, or generalized abnormalities are also present in 20% of cases.
    explanation: >-
      Additional nonoccipital EEG abnormalities are reported collectively in 20%; this does not assign
      20% to each individual pattern.
- name: Fixation-Dependent Gating of Occipital Discharges
  biological_scale: TISSUE
  description: >-
    In patients with fixation-off sensitivity, removing central vision facilitates epileptiform discharges
    and restoring fixation suppresses them. This is principally a reflex EEG phenomenon. Its expression
    varies across patients and it occurs in other epilepsies; it is not established as the trigger of
    habitual COVE seizures. Proposed links to alpha-rhythm circuitry are physiological interpretations
    rather than a demonstrated COVE-specific cellular pathway.
  locations:
  - preferred_term: occipital lobe
    term:
      id: UBERON:0002021
      label: occipital lobe
  downstream:
  - target: Occipital Interictal Epileptiform Discharges
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Fixation removal facilitates interictal abnormalities in the FOS-positive subset; this edge
      does not assert seizure induction.
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Fixation- off sensitivity (facilitation of epileptiform abnormalities with elimination of central
      vision) is seen in 20%– 90% of patients but is not pathognomonic of this syn- drome.
    explanation: >-
      The reported 20–90% range establishes variable FOS expression and explicitly excludes diagnostic
      specificity.
  - reference: PMID:24810088
    reference_title: >-
      Fixation-off sensitivity in idiopathic childhood occipital epilepsy of
      Gastaut.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 7-year-old boy presented with episodic blindness for the last 2
      months with occipital paroxysms and fixation-off sensitivity on
      electroencephalography (EEG). The clinico-EEG features were suggestive
      of idiopathic childhood occipital epilepsy of Gastaut.
    explanation: >-
      A worked case in which fixation-off sensitivity and occipital paroxysms
      co-occur with the clinical syndrome, supporting the gating phenomenon
      as a real feature of this specific epilepsy.
    directness: DIRECT
  - reference: PMID:19258232
    reference_title: >-
      Fixation-off sensitivity in epilepsies other than the idiopathic
      epilepsies of childhood with occipital paroxysms: a 12-year
      clinical-video EEG study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the association of FOS with generalised and focal, symptomatic
      and cryptogenic and mild or pharmaco-resistant epilepsies, closer
      analysis of our data, and supportive evidence from functional imaging
      and physiological observations on alpha rhythm generation, disclose a
      prominent role of the occipital areas, even when FOS EEG abnormalities
      and seizures are ostensibly generalised.
    explanation: >-
      This study excluded idiopathic childhood occipital epilepsies. Its discussion provides indirect
      physiological context for FOS, not direct evidence of the COVE seizure mechanism.
    directness: INDIRECT
- name: Occipital Interictal Epileptiform Discharges
  biological_scale: TISSUE
  description: >-
    Occipital sharp waves or spike-and-wave complexes occur between seizures, sometimes only in sleep.
    Sleep and sleep deprivation enhance their detection; FOS can also facilitate them. These interictal
    abnormalities are distinguished from the evolving ictal rhythm and do not by themselves establish
    that a clinical seizure is occurring.
  locations:
  - preferred_term: occipital lobe
    term:
      id: UBERON:0002021
      label: occipital lobe
  downstream:
  - target: Occipital Epileptiform EEG Abnormalities
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Interictal occipital discharges generate the characteristic scalp EEG finding.
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The background activity is normal. Interictal occipital sharp waves or spike- and- wave complexes
      are typically seen but may only occur in sleep.
    explanation: >-
      Occipital interictal abnormalities can be confined to sleep despite a normal EEG background.
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER

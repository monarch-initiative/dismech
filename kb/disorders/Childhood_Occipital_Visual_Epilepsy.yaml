    explanation: >-
      Bilateral tonic–clonic seizures are associated with a lower remission rate.
treatments:
- name: Antiseizure Monotherapy
  description: >-
    Antiseizure medication is commonly used during the active phase because untreated seizures can be
    frequent. Many patients respond to monotherapy. Historical cohort response differs between isolated
    COVE and COVE associated with other epilepsy syndromes, but the available abstract does not provide
    denominators for comparing response percentages. These sources do not establish one drug as superior
    for COVE.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:

- name: Occipital Ictal Discharge
  biological_scale: TISSUE
  conforms_to: epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony
  description: >-
    At seizure onset, the usual interictal occipital spikes may diminish as unilateral occipital fast
    rhythms with low-amplitude spikes emerge. Slower ictal spike-and-wave activity can accompany blindness
    or oculoclonic seizures. This evolving ictal pattern is distinct from interictal FOS-related paroxysms.
  locations:
  - preferred_term: occipital lobe
    term:
      id: UBERON:0002021
      label: occipital lobe
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      At ictal onset, there is a decrease in the usual back- ground occipital spikes or spike- and-
      wave complexes with the sudden appearance of unilateral occipital fast rhythms
    explanation: >-
      The ictal EEG differs from the usual interictal pattern rather than representing every interictal
      spike becoming a seizure.
  downstream:
  - target: Visual Cortical Recruitment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Propagation Beyond the Occipital Lobe
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Visual Cortical Recruitment
  biological_scale: TISSUE
  description: >-
    Occipital seizure activity disrupts visual processing, producing positive visual phenomena or transient
    visual loss. Elementary colored circles are typical, but complex hallucinations and illusions can
    occur. Semiology supports involvement of visual networks without proving exclusive recruitment of
    striate cortex or a specific cellular activation-versus-suppression mechanism.
  locations:
  - preferred_term: occipital lobe
    term:
      id: UBERON:0002021
      label: occipital lobe
  downstream:
  - target: Recurrent Brief Diurnal Visual Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Elementary Visual Hallucinations
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Ictal Blindness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:19955346
    reference_title: >-
      Idiopathic childhood occipital epilepsy of Gastaut: a review and
      differentiation from migraine and other epilepsies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The typical clinical features are visual seizures that typically
      consist of brief elementary visual hallucinations, which are mainly
      multicolored and circular.
    explanation: >-
      Typical visual seizure semiology supports a visual-network interpretation, but does not directly
      localize activity to a particular visual cortical layer or area.
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:19955346
    reference_title: >-
      Idiopathic childhood occipital epilepsy of Gastaut: a review and
      differentiation from migraine and other epilepsies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ictal blindness and deviation of the eyes are also common symptoms.
    explanation: >-
      Transient ictal visual loss is another manifestation of occipital seizures; the cited symptoms
      do not prove a particular inhibitory cellular mechanism.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Other features consistent with occipital lobe onset may occur, including ictal blindness, complex
      visual hal- lucinations or illusions (such as palinopsia, micropsia, metamorphopsia), orbital
      pain, eyelid fluttering, or re- peated eye closure.
    explanation: >-
      The consensus allows complex visual phenomena as well as ictal blindness; formed imagery does
      not exclude the syndrome.
- name: Recurrent Brief Diurnal Visual Seizures
  biological_scale: ORGANISM
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  description: >-
    Repeated brief visual seizures occur predominantly during wakefulness, often frequently when untreated.
    In a 129-patient historical cohort, visual hallucinations were the first manifestation in 62% and
    the only manifestation in 38.8%; these figures describe seizure presentation rather than overall
    lifetime prevalence of visual symptoms.
  downstream:
  - target: Postictal Headache Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Headache can follow visual seizures; the intervening headache-generating mechanism is unresolved.
  evidence:
  - reference: PMID:19955346
    reference_title: >-
      Idiopathic childhood occipital epilepsy of Gastaut: a review and
      differentiation from migraine and other epilepsies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The seizures are usually frequent and diurnal.
    explanation: >-
      Establishes both the high frequency and the daytime preference that
      define the clinical course of the epilepsy.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:26498733
    reference_title: >-
      Clinical dissection of childhood occipital epilepsy of Gastaut and

notes: >-
  Naming. The entity is old but the label is new. It was described by Gastaut and
  carried his name for decades, as idiopathic childhood occipital epilepsy of
  Gastaut, or as late-onset benign childhood occipital epilepsy. The 2022 ILAE
  nosology renamed it childhood occipital visual epilepsy as part of a deliberate
  move to name syndromes after the seizure semiology rather than after people,
  and dropped the word benign from the self-limited epilepsies generally. All
  three names refer to the same syndrome and MONDO:0020308 is the entity for all
  of them.

  Scope. This entry models the self-limited, imaging-negative, occipital-onset
  visual epilepsy of childhood. It does not model structural occipital lobe
  epilepsy, which can look identical at the bedside and is separated by imaging
  rather than by mechanism, and it does not model photosensitive occipital lobe
  epilepsy, which is a separate ILAE syndrome with a different trigger and has
  its own MONDO identity. Both are carried as differential diagnoses.

  What is deliberately absent. There is no genetic section. The syndrome is
  presumed to have a genetic basis on the strength of family history and its
  membership in the self-limited focal epilepsies, but no gene has been
  established for it, and inventing a gene list from adjacent syndromes would
  fabricate exactly the kind of content this knowledge base exists to avoid. The
  absence is recorded as an open knowledge gap in the discussions rather than
  filled in.

  Sourcing note. Drafted from the primary literature, then cross-checked against
  a deep-research report generated with the falcon provider (Edison Scientific),
  committed as
  research/Childhood_Occipital_Visual_Epilepsy-deep-research-falcon.md. The
  report converged with this entry on the two claims that matter most: that the
  syndrome-level mechanism is best stated as focal occipital cortical
  hyperexcitability rather than anything molecularly resolved, and that
  inheritance is presumed complex rather than established monogenic. It
  contributed no snippets, both because it could not retrieve most of the
  relevant papers in full text and because every quotation here was verified
  against its own fetched cache. It did contribute one useful negative: it warns
  explicitly that GRIN2A evidence belongs to the epilepsy-aphasia syndromes and
  should not be treated as specific to this one, which is exactly the borrowing
  the genetic knowledge gap below declines to do.

  Module conformance note. Two nodes conform to
  epilepsy_excitation_inhibition_imbalance. The conformance is at the level of
  the generic hyperexcitability and recurrent-seizure nodes only. The module
  makes no claim about visual cortex specifically, and the occipital
  localization together with the fixation gating are the disease-specific
  substitutions this entry contributes.
inheritance:
  - name: Presumed genetic, no established locus
    description: >-
      The syndrome is grouped with the self-limited focal epilepsies of
      childhood, which as a family show familial clustering and are presumed to
      have a genetic contribution, but no causative gene or susceptibility locus
      has been established specifically for childhood occipital visual epilepsy.
      Family history of epilepsy is recorded as a clinical variable in outcome
      studies rather than as an established mechanism. No inheritance_term is
      bound because the mode of inheritance is not known, and binding a Mendelian
      mode here would assert more than the literature supports.
    evidence:
      - reference: PMID:26498733
        reference_title: >-
          Clinical dissection of childhood occipital epilepsy of Gastaut and
          prognostic implication.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The following clinical characteristics were evaluated: gender, patient
          age at seizure onset, history of febrile seizures and migraine, family
          history of epilepsy, duration and seizure manifestations, circadian
          distribution and frequency of seizures, history of medications
          including the number of drugs, therapeutic response and final outcome.
        explanation: >-
          Family history of epilepsy is treated as a clinical variable to be
          collected, which is the level at which heritability is currently
          discussed for this syndrome. It supports the presumption of a genetic
          contribution without establishing a locus.
pathophysiology:
  - name: Age-Dependent Hyperexcitability of the Occipital Cortex
    biological_scale: TISSUE
    description: >-
      The proximal state of the syndrome is a transient, age-restricted
      hyperexcitability confined to the occipital cortex. It is inferred rather
      than measured directly: the seizures are occipital in origin, the
      interictal discharges are occipital, the brain is structurally normal on
      imaging, and the whole state appears in childhood and disappears by
      mid-adolescence in most patients. Nothing about the substrate is known at
      the molecular level, which is why this node carries cellular and anatomical
      annotation but no gene and no named molecular lesion.
    locations:
      - preferred_term: occipital lobe
        term:
          id: UBERON:0002021
          label: occipital lobe
    cell_types:
      - preferred_term: cortical pyramidal neuron
        term:
          id: CL:0000598
          label: pyramidal neuron
    biological_processes:
      - preferred_term: neuronal action potential
        term:
          id: GO:0019228
          label: neuronal action potential
        modifier: INCREASED
    downstream:
      - target: Fixation-Dependent Gating of Occipital Discharges
      - target: Occipital Interictal and Ictal Paroxysmal Discharges
      - target: Age-Dependent Remission of the Epileptogenic State
    evidence:
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The electroencephalography is the only investigation with abnormal
          results, showing occipital spikes and often occipital paroxysms
          demonstrating fixation-off sensitivity.
        explanation: >-
          Establishes that the abnormality is electrical and occipital, and that
          no structural or other investigation is abnormal, which is the basis
          for modelling the substrate as a functional excitability state rather
          than a lesion.
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Brain magnetic resonance imaging is used to exclude symptomatic
          occipital epilepsy.
        explanation: >-
          Imaging is used to rule out a structural cause, confirming that in this
          syndrome the excitability state is not attributable to a visible
          lesion.
  - name: Fixation-Dependent Gating of Occipital Discharges
    biological_scale: TISSUE
    description: >-
      The most mechanistically interesting feature of the syndrome is that the
      epileptic discharge is switched on and off by whether the eyes are
      fixating. Eliminating central vision and fixation, by eye closure in the
      dark or with fixation-abolishing lenses, releases occipital paroxysms;
      restoring fixation suppresses them. This is called fixation-off
      sensitivity. The physiological reading is that the same occipital circuitry
      that generates the alpha rhythm and is normally suppressed by visual input
      is, in these children, released into paroxysmal activity when that input is
      removed. Whether this gating is part of the causal chain to seizures or is
      a marker of occipital excitability that rarely produces seizures by itself
      is genuinely unsettled, and is curated as a controversy rather than
      asserted here.
    locations:
      - preferred_term: primary visual cortex
        term:
          id: UBERON:0002436
          label: primary visual cortex
    biological_processes:
      - preferred_term: visual perception
        term:
          id: GO:0007601
          label: visual perception
        modifier: ABNORMAL
    downstream:
      - target: Occipital Interictal and Ictal Paroxysmal Discharges
    evidence:
      - reference: PMID:24810088
        reference_title: >-
          Fixation-off sensitivity in idiopathic childhood occipital epilepsy of
          Gastaut.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          A 7-year-old boy presented with episodic blindness for the last 2
          months with occipital paroxysms and fixation-off sensitivity on
          electroencephalography (EEG). The clinico-EEG features were suggestive
          of idiopathic childhood occipital epilepsy of Gastaut.
        explanation: >-
          A worked case in which fixation-off sensitivity and occipital paroxysms
          co-occur with the clinical syndrome, supporting the gating phenomenon
          as a real feature of this specific epilepsy.
      - reference: PMID:19258232
        reference_title: >-
          Fixation-off sensitivity in epilepsies other than the idiopathic
          epilepsies of childhood with occipital paroxysms: a 12-year
          clinical-video EEG study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Despite the association of FOS with generalised and focal, symptomatic
          and cryptogenic and mild or pharmaco-resistant epilepsies, closer
          analysis of our data, and supportive evidence from functional imaging
          and physiological observations on alpha rhythm generation, disclose a
          prominent role of the occipital areas, even when FOS EEG abnormalities
          and seizures are ostensibly generalised.
        explanation: >-
          Ties the phenomenon to occipital physiology and specifically to alpha
          rhythm generation, which is the mechanistic basis for modelling this as
          a gating relationship between visual input and occipital excitability.
  - name: Occipital Interictal and Ictal Paroxysmal Discharges
    biological_scale: TISSUE
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
    description: >-
      Synchronized paroxysmal discharge over the occipital regions, seen between
      seizures as occipital spikes and occipital paroxysms and, at seizure onset,
      as recruitment of the same territory. This is the node at which the
      syndrome joins the generic epilepsy mechanism, namely hypersynchronous
      discharge in a cortical population. What the module leaves generic and this
      entry fills in is the location, which is occipital and therefore visual.
    locations:
      - preferred_term: occipital lobe
        term:
          id: UBERON:0002021
          label: occipital lobe
    cell_types:
      - preferred_term: cortical neuron
        term:
          id: CL:0000540
          label: neuron
    biological_processes:
      - preferred_term: chemical synaptic transmission
        term:
          id: GO:0007268
          label: chemical synaptic transmission
        modifier: ABNORMAL
    downstream:
      - target: Ictal Recruitment of Striate and Extrastriate Visual Cortex
      - target: Propagation Beyond the Occipital Lobe
    evidence:
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The electroencephalography is the only investigation with abnormal
          results, showing occipital spikes and often occipital paroxysms
          demonstrating fixation-off sensitivity.
        explanation: >-
          Direct evidence for occipital spikes and occipital paroxysms as the
          electrographic signature of the syndrome.
  - name: Ictal Recruitment of Striate and Extrastriate Visual Cortex
    biological_scale: TISSUE
    description: >-
      When the discharge recruits visual cortex, the patient experiences what
      that cortex represents. Recruitment of striate and early extrastriate
      territory produces elementary rather than formed imagery, which is why the
      hallucinations are small coloured circles rather than faces or scenes;
      spread that suppresses rather than activates the same territory produces
      loss of vision. Both are positive evidence that the seizure is occupying
      visual cortex, and the elementary character of the imagery is the argument
      that onset is early in the visual hierarchy.
    locations:
      - preferred_term: primary visual cortex
        term:
          id: UBERON:0002436
          label: primary visual cortex
    downstream:
      - target: Recurrent Brief Diurnal Visual Seizures
    evidence:
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The typical clinical features are visual seizures that typically
          consist of brief elementary visual hallucinations, which are mainly
          multicolored and circular.
        explanation: >-
          The elementary, multicoloured, circular character of the hallucination
          is the clinical evidence that early visual cortex rather than
          association cortex is being recruited.
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Ictal blindness and deviation of the eyes are also common symptoms.
        explanation: >-
          Loss of vision during the seizure is the negative counterpart of the
          positive hallucination and supports recruitment of visual cortex in
          both directions.
  - name: Recurrent Brief Diurnal Visual Seizures
    biological_scale: ORGANISM
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
    description: >-
      The clinical epilepsy itself: repeated, short, daytime seizures whose
      content is visual. Frequency is high, often several a week or more, and the
      diurnal preference distinguishes the syndrome from the other self-limited
      focal epilepsies of childhood, which favour sleep. In a substantial
      minority the visual hallucination is the entire seizure and nothing else
      ever happens.
    downstream:
      - target: Post-Ictal Headache
      - target: Age-Dependent Remission of the Epileptogenic State
    evidence:
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The seizures are usually frequent and diurnal.
        explanation: >-
          Establishes both the high frequency and the daytime preference that
          define the clinical course of the epilepsy.
      - reference: PMID:26498733
        reference_title: >-
          Clinical dissection of childhood occipital epilepsy of Gastaut and
          prognostic implication.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Visual hallucinations were the first symptom in 62% and the only
          manifestation in 38.8% of patients.
        explanation: >-
          Quantifies both that the visual seizure usually opens the attack and
          that in nearly two in five patients it is the whole of it, in a cohort
          of 129 patients.
  - name: Propagation Beyond the Occipital Lobe
    biological_scale: TISSUE
    description: >-
      Discharge that does not stay in occipital cortex produces the non-visual
      elements of the syndrome. Forward spread to oculomotor territory gives eye
      deviation and oculoclonic movements; further spread gives the
      hemiconvulsive or, rarely, bilateral convulsive seizures that occur in a
      minority. Impairment of consciousness is characteristically rare, which is
      itself an argument that propagation is usually limited.
    locations:
      - preferred_term: occipital lobe
        term:
          id: UBERON:0002021
          label: occipital lobe
    downstream:
      - target: Recurrent Brief Diurnal Visual Seizures
    evidence:
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Ictal blindness and deviation of the eyes are also common symptoms.
        explanation: >-
          Eye deviation is the commonest non-visual ictal sign and evidences
          spread of the discharge out of purely visual cortex.
  - name: Post-Ictal Headache
    biological_scale: ORGANISM
    description: >-
      Headache follows the seizure often enough, and closely enough, that the
      whole syndrome is routinely mistaken for migraine with visual aura. The
      mechanism of the headache is not established. Two readings are available
      and are not mutually exclusive: the seizure may recruit trigeminovascular
      machinery in the way experimental cortical events do, or the two conditions
      may share a substrate of occipital cortical hyperexcitability and simply
      co-occur. This entry models the association and declines to assert the
      mechanism.
    evidence:
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Idiopathic childhood occipital epilepsy of Gastaut is frequently
          misdiagnosed as migraine with visual aura, acephalgic, or basilar
          migraine.
        explanation: >-
          The systematic misdiagnosis as migraine is the clinical evidence that
          the post-ictal headache is prominent enough to dominate the
          presentation.
  - name: Age-Dependent Remission of the Epileptogenic State
    biological_scale: ORGANISM
    description: >-
      The excitability state is not permanent. In most patients the seizures and
      the electroencephalographic abnormalities both resolve during adolescence,
      which is the property that puts the syndrome among the self-limited rather
      than the encephalopathic epilepsies. The resolution of the electrographic
      abnormality alongside the seizures is the strongest argument that what
      remits is the underlying substrate and not merely its clinical expression.
      What drives that resolution is unknown; the obvious candidate is normal
      maturation of the same occipital circuits, but nothing establishes it.
    evidence:
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Patients usually respond well to antiepileptic medication and about
          two-thirds remit by the age of 16 years.
        explanation: >-
          Quantifies the self-limited course, which is the defining prognostic
          property of the syndrome.
      - reference: PMID:26498733
        reference_title: >-
          Clinical dissection of childhood occipital epilepsy of Gastaut and
          prognostic implication.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Childhood occipital epilepsy of Gastaut has an overall favourable
          prognosis and a good response to antiepileptic therapy with resolution
          of seizures and of electroencephalogram abnormalities.
        explanation: >-
          Records that the electroencephalographic abnormality resolves along
          with the seizures, supporting remission of the substrate rather than
          suppression of its expression.

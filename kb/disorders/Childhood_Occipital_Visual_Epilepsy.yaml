name: Childhood Occipital Visual Epilepsy
creation_date: "2026-08-05T00:00:00Z"
category: Complex
description: >-
  A self-limited focal epilepsy beginning in childhood, characterized by abrupt, brief visual seizures
  arising predominantly during wakefulness. Elementary multicolored visual hallucinations are typical;
  ictal blindness, eye or head deviation, impaired awareness and motor spread can also occur. Occipital
  epileptiform abnormalities may be restricted to sleep, and fixation-off sensitivity is variable rather
  than diagnostic by itself. Brain MRI is required to exclude a causal lesion. Most patients respond to
  antiseizure medication and remit during childhood or adolescence, although persistent seizures occur.
  Etiology is presumed complex genetic; no causal gene has been established for the syndrome.
parents:
- Epilepsy
- Neurological Disease
synonyms:
- COVE
- childhood occipital epilepsy (Gastaut type)
- idiopathic childhood occipital epilepsy of Gastaut
- late-onset benign childhood occipital epilepsy
- COE-G
classifications:
  harrisons_chapter:

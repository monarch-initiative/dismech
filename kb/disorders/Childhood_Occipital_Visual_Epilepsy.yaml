notes: >-
  The entry covers the electroclinical syndrome formerly called idiopathic childhood occipital epilepsy
  of Gastaut. Photosensitive occipital lobe epilepsy and structural occipital epilepsy are distinct diagnoses.
  The mechanistic model is based on clinical semiology and EEG localization; it does not establish a molecular
  lesion or a specific neuronal subtype.
inheritance:
- name: Presumed complex genetic inheritance
  description: >-
    The ILAE consensus describes a presumed genetic etiology with likely complex/polygenic inheritance.
    No causative gene has been identified for COVE. A family history of febrile seizures or epilepsy
    is reported in up to one third of cases; this does not establish Mendelian transmission or a syndrome-specific
    recurrence risk.
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Genetic testing is not required, as there are no genes iden- tified for this epilepsy syndrome.
      It is presumed that the etiology is genetic, and likely complex/polygenic in inher- itance.
    explanation: >-
      The COVE-specific genetics section states that no syndrome gene is identified and describes
      a presumed complex genetic etiology.
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER

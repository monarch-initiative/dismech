prevalence:
- population: Children with newly diagnosed afebrile seizures
  measure_type: UNKNOWN
  notes: >-
    The ILAE consensus reports COVE in 0.3% of children with newly diagnosed afebrile seizures. This
    is a proportion within a seizure population, not general-population prevalence or annual incidence;
    no population occurrence band is assigned.
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      COVE has a prevalence of 0.3% of children with newly di- agnosed, afebrile seizures.
    explanation: >-
      The denominator is explicitly children with newly diagnosed afebrile seizures.
progression:
- phase: Active seizure phase
  age_range: Typically onset at 8–9 years; reported range 1–19 years
  notes: >-
    Onset is typically in mid-childhood, with frequent brief diurnal visual
    seizures. Most children require and respond to prophylactic medication
    during this phase.
  evidence:
  - reference: PMID:19955346
    reference_title: >-
      Idiopathic childhood occipital epilepsy of Gastaut: a review and
      differentiation from migraine and other epilepsies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most children need prophylactic antiepileptic medication.
    explanation: >-
      Establishes that the active phase generally requires treatment rather
      than observation alone.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Age at onset is typically at 8– 9 years, with a range from 1 year to 19 years.
    explanation: >-
      The typical onset and broader range are distinguished; ages outside 6–14 years are diagnostic
      alerts in Table 4.
- phase: Remission
  age_range: Commonly by puberty or during adolescence
  notes: >-
    Remission is common but not universal. The ILAE synthesis reports 50–80% by puberty; an older review
    reports about two thirds by age 16. These estimates use different time points. Bilateral tonic–clonic
    seizures and association with other epilepsy syndromes are linked to poorer outcomes, without proving
    a distinct causal mechanism.
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Remission occurs in 50%– 80% of patients by puberty with or without administration of ASM.
    explanation: >-
      The review reports remission by puberty in 50–80%, including treated and untreated patients;
      remission is not universal.
  - reference: PMID:19955346
    reference_title: >-
      Idiopathic childhood occipital epilepsy of Gastaut: a review and
      differentiation from migraine and other epilepsies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients usually respond well to antiepileptic medication and about
      two-thirds remit by the age of 16 years.
    explanation: >-
      Gives the quantitative remission figure and the age by which it is
      reached.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:26498733
    reference_title: >-
      Clinical dissection of childhood occipital epilepsy of Gastaut and
      prognostic implication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the end of follow-up, the percentage of seizure-free patients was
      significantly higher in group A than in group B.
    explanation: >-
      Establishes that remission is not uniform: patients with isolated
      occipital epilepsy do significantly better than those with an
      associated epileptic syndrome.
    directness: DIRECT
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-

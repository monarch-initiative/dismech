      manifestation in 38.8% of patients.
    explanation: >-
      The cohort quantifies first and sole manifestations, not the fraction of all patients who ever
      experience visual hallucinations.
    directness: DIRECT
- name: Propagation Beyond the Occipital Lobe
  biological_scale: TISSUE
  description: >-
    Occipital seizures can spread beyond visual networks, with impaired awareness, hemiclonic seizures
    or focal-to-bilateral tonic–clonic seizures. Eye or head deviation can accompany the seizure. The
    clinical sequence supports network propagation but does not establish a precise anatomical route
    to every motor sign.
  locations:
  - preferred_term: occipital lobe
    term:
      id: UBERON:0002021
      label: occipital lobe
  downstream:
  - target: Ictal Eye Deviation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Focal Impaired Awareness Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Focal Hemiclonic Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Focal to Bilateral Tonic-Clonic Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The seizure may spread outside the occipital lobe, resulting in hemiparesthesia, impaired awareness
      (14%), and hemiclonic (43%) or focal to bilat- eral tonic– clonic (13%) seizure.
    explanation: >-
      The consensus describes extra-occipital spread with impaired awareness, hemiclonic seizures
      and focal-to-bilateral tonic–clonic seizures.
- name: Postictal Headache Development
  biological_scale: ORGANISM
  description: >-
    Migraine-like headache commonly follows a visual seizure, sometimes with nausea and vomiting. The
    pathway connecting the seizure to headache is unresolved; a specific trigeminovascular mechanism
    or shared genetic substrate has not been established for COVE.
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf
    reference_title: "International League Against Epilepsy classification and definition of epilepsy syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions"
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Postictal headache with migrainelike features is common (in 50% of patients) and may be associated
      with nausea and vomiting.
    explanation: >-
      The source directly reports postictal headache in approximately half of patients, sometimes
      with nausea and vomiting.
  downstream:

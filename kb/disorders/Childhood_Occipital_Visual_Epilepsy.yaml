    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Age-Dependent Remission of the Epileptogenic State
  biological_scale: ORGANISM
  description: >-
    Seizures remit by puberty in many patients, and longitudinal cohorts also report resolution of EEG
    abnormalities. This supports an age-dependent course but does not directly establish a maturational
    molecular mechanism. Clinical remission and EEG normalization need not occur simultaneously, and
    persistence at age 16 does not imply permanent nonremission.
  evidence:
  - reference: url:https://www.ilae.org/files/dmfile/onset-in-childhood2.pdf

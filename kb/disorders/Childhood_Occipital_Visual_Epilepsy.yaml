  - reference: PMID:19955346
    reference_title: >-
      Idiopathic childhood occipital epilepsy of Gastaut: a review and
      differentiation from migraine and other epilepsies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients usually respond well to antiepileptic medication and about
      two-thirds remit by the age of 16 years.
    explanation: >-
      Quantifies the self-limited course, which is the defining prognostic
      property of the syndrome.
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:26498733
    reference_title: >-
      Clinical dissection of childhood occipital epilepsy of Gastaut and
      prognostic implication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Childhood occipital epilepsy of Gastaut has an overall favourable
      prognosis and a good response to antiepileptic therapy with resolution
      of seizures and of electroencephalogram abnormalities.
    explanation: >-
      The cohort reports favorable clinical and EEG outcomes; parallel resolution does not by itself
      demonstrate the biological process responsible for remission.
    directness: DIRECT

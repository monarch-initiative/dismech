prevalence:
  - population: Children with epilepsy
    measure_type: UNKNOWN
    prevalence_class: RARE
    notes: >-
      No population-based prevalence estimate is available for this syndrome
      specifically. It is described as the rarer of the two self-limited
      occipital-associated epilepsies of childhood, well behind self-limited
      epilepsy with autonomic seizures, and considerably rarer than self-limited
      epilepsy with centrotemporal spikes. The prevalence_class is set to the
      qualitative RARE tier rather than a numeric band because no numeric
      estimate exists to support one, and Orphanet classifies the entity as rare.
progression:
  - phase: Active seizure phase
    age_range: Mid-childhood to mid-adolescence
    notes: >-
      Onset is typically in mid-childhood, with frequent brief diurnal visual
      seizures. Most children require and respond to prophylactic medication
      during this phase.
    evidence:
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Most children need prophylactic antiepileptic medication.
        explanation: >-
          Establishes that the active phase generally requires treatment rather
          than observation alone.
  - phase: Remission
    age_range: By about sixteen years
    notes: >-
      Seizures and electroencephalographic abnormalities resolve in most
      patients, with about two-thirds seizure-free by age 16. Outcome is
      significantly worse in the subgroup whose occipital epilepsy is accompanied
      by other epileptic syndromes.
    evidence:
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Patients usually respond well to antiepileptic medication and about
          two-thirds remit by the age of 16 years.
        explanation: >-
          Gives the quantitative remission figure and the age by which it is
          reached.
      - reference: PMID:26498733
        reference_title: >-
          Clinical dissection of childhood occipital epilepsy of Gastaut and
          prognostic implication.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          At the end of follow-up, the percentage of seizure-free patients was
          significantly higher in group A than in group B.
        explanation: >-
          Establishes that remission is not uniform: patients with isolated
          occipital epilepsy do significantly better than those with an
          associated epileptic syndrome.
treatments:
  - name: Antiseizure Monotherapy
    description: >-
      Most children are treated with a single antiseizure medication, and most
      respond. Carbamazepine has been the traditional first choice for a focal
      epilepsy of this kind; lamotrigine and levetiracetam are also used. The
      response rate is high enough that failure of monotherapy should prompt
      reconsideration of the diagnosis or a search for an associated syndrome.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: carbamazepine
          term:
            id: CHEBI:3387
            label: carbamazepine
        - preferred_term: lamotrigine
          term:
            id: CHEBI:6367
            label: lamotrigine
        - preferred_term: levetiracetam
          term:
            id: CHEBI:6437
            label: levetiracetam
    target_mechanisms:
      - target: Occipital Interictal and Ictal Paroxysmal Discharges
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Patients usually respond well to antiepileptic medication and about
          two-thirds remit by the age of 16 years.
        explanation: >-
          Establishes good response to antiseizure medication as the expected
          outcome.
      - reference: PMID:26498733
        reference_title: >-
          Clinical dissection of childhood occipital epilepsy of Gastaut and
          prognostic implication.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The most significant (P < 0.05) difference concerned antiepileptic
          therapy: in group A, 45 children responded to monotherapy; in group B
          only 15 children responded to monotherapy.
        explanation: >-
          Quantifies monotherapy response and shows it is substantially better in
          patients whose occipital epilepsy is isolated.
  - name: Prophylactic Treatment During the Active Phase
    description: >-
      Because seizures are frequent, most children are treated prophylactically
      rather than expectantly, which distinguishes management from the more
      permissive approach sometimes taken in other self-limited focal epilepsies
      where seizures are rare and nocturnal.
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
    target_mechanisms:
      - target: Recurrent Brief Diurnal Visual Seizures
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Most children need prophylactic antiepileptic medication.
        explanation: >-
          Direct statement that prophylaxis rather than observation is the
          standard approach.
diagnosis:
  - name: Electroencephalography with Fixation-Off Manoeuvre
    description: >-
      The diagnostic investigation. Occipital spikes and occipital paroxysms are
      sought, and the recording is performed so that fixation can be eliminated
      and restored, because the paroxysms may only appear in the fixation-off
      state. A routine recording made with the eyes open and fixating can be
      normal.
    diagnosis_term:
      preferred_term: Electroencephalography
      term:
        id: NCIT:C38054
        label: Electroencephalography
    evidence:
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The electroencephalography is the only investigation with abnormal
          results, showing occipital spikes and often occipital paroxysms
          demonstrating fixation-off sensitivity.
        explanation: >-
          Names electroencephalography as the only investigation that is abnormal
          and specifies what is sought on it.
  - name: Brain Magnetic Resonance Imaging
    description: >-
      Imaging is performed to exclude a structural occipital lesion. In this
      syndrome it is normal, and a normal scan is part of the diagnosis rather
      than an incidental result.
    diagnosis_term:
      preferred_term: Magnetic Resonance Imaging
      term:
        id: NCIT:C16809
        label: Magnetic Resonance Imaging
    evidence:
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Brain magnetic resonance imaging is used to exclude symptomatic
          occipital epilepsy.
        explanation: >-
          States the purpose of imaging in the diagnostic pathway explicitly.
differential_diagnoses:
  - name: Migraine with Aura
    disease_term:
      preferred_term: migraine with aura
      term:
        id: MONDO:0005475
        label: migraine with aura
    description: >-
      The most common and most consequential misdiagnosis, because the visual
      symptom plus headache maps onto migraine so naturally that children are
      often treated for migraine for years. The two conditions may also genuinely
      coexist.
    distinguishing_features:
      - Seizure imagery is elementary, multicoloured and circular, whereas migraine aura is classically achromatic, linear and zigzag.
      - Seizure duration is seconds to a few minutes, whereas migraine aura typically builds over five to twenty minutes.
      - Occipital spikes with fixation-off sensitivity on the electroencephalogram.
      - Ictal blindness and eye deviation are seizure features rather than aura features.
    evidence:
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Idiopathic childhood occipital epilepsy of Gastaut is frequently
          misdiagnosed as migraine with visual aura, acephalgic, or basilar
          migraine.
        explanation: >-
          Names migraine with visual aura explicitly as the differential that is
          most often confused with this syndrome.
  - name: Self-Limited Epilepsy with Autonomic Seizures
    disease_term:
      preferred_term: self-limited epilepsy with autonomic seizures
      term:
        id: MONDO:0020307
        label: self-limited epilepsy with autonomic seizures
    description: >-
      The other occipital-associated self-limited epilepsy of childhood,
      historically called Panayiotopoulos syndrome. Both may show occipital
      spikes, but the syndromes are otherwise almost opposite in presentation.
    distinguishing_features:
      - Onset is earlier, typically in the preschool years rather than mid-childhood.
      - Seizures are autonomic, dominated by vomiting and pallor, rather than visual.
      - Seizures are infrequent, prolonged and often nocturnal, rather than brief, frequent and diurnal.
      - Consciousness is often impaired, whereas it is characteristically preserved in visual seizures.
    evidence:
      - reference: PMID:35503717
        reference_title: >-
          International League Against Epilepsy classification and definition of
          epilepsy syndromes with onset in childhood: Position paper by the ILAE
          Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Epilepsy syndromes beginning in childhood have been divided into three
          categories: (1) self-limited focal epilepsies, comprising four
          syndromes: self-limited epilepsy with centrotemporal spikes,
          self-limited epilepsy with autonomic seizures, childhood occipital
          visual epilepsy, and photosensitive occipital lobe epilepsy
        explanation: >-
          Establishes that these are recognized as separate syndromes within the
          same family rather than variants of one entity.
  - name: Photosensitive Occipital Lobe Epilepsy
    disease_term:
      preferred_term: photosensitive occipital lobe epilepsy
      term:
        id: MONDO:0100021
        label: photosensitive occipital lobe epilepsy
    description: >-
      The fourth self-limited focal epilepsy, and the closest mimic in seizure
      content, since its seizures are also visual and occipital in origin. The
      separation is by trigger.
    distinguishing_features:
      - Seizures are provoked by flickering light or patterns rather than occurring spontaneously.
      - Photoparoxysmal response on the electroencephalogram during intermittent photic stimulation.
      - Fixation-off sensitivity is not the characteristic electrographic gating feature.
    evidence:
      - reference: PMID:35503717
        reference_title: >-
          International League Against Epilepsy classification and definition of
          epilepsy syndromes with onset in childhood: Position paper by the ILAE
          Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Epilepsy syndromes beginning in childhood have been divided into three
          categories: (1) self-limited focal epilepsies, comprising four
          syndromes: self-limited epilepsy with centrotemporal spikes,
          self-limited epilepsy with autonomic seizures, childhood occipital
          visual epilepsy, and photosensitive occipital lobe epilepsy
        explanation: >-
          Lists both syndromes separately, confirming they are distinct entities
          in the current nosology.
  - name: Self-Limited Epilepsy with Centrotemporal Spikes
    disease_term:
      preferred_term: self-limited epilepsy with centrotemporal spikes
      term:
        id: MONDO:0007295
        label: self-limited epilepsy with centrotemporal spikes
    description: >-
      The commonest self-limited focal epilepsy of childhood, included here
      because occipital and centrotemporal spike populations sometimes coexist in
      the same child, and because the two syndromes share the self-limited
      trajectory.
    distinguishing_features:
      - Spikes are centrotemporal rather than occipital.
      - Seizures are orofacial and sleep-related rather than visual and diurnal.
      - Fixation-off sensitivity is not a feature.
    evidence:
      - reference: PMID:35503717
        reference_title: >-
          International League Against Epilepsy classification and definition of
          epilepsy syndromes with onset in childhood: Position paper by the ILAE
          Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Epilepsy syndromes beginning in childhood have been divided into three
          categories: (1) self-limited focal epilepsies, comprising four
          syndromes: self-limited epilepsy with centrotemporal spikes,
          self-limited epilepsy with autonomic seizures, childhood occipital
          visual epilepsy, and photosensitive occipital lobe epilepsy
        explanation: >-
          Places both syndromes in the same family while keeping them distinct.
  - name: Structural Occipital Lobe Epilepsy
    description: >-
      Focal epilepsy of occipital origin caused by a visible lesion such as a
      cortical malformation, gliosis, tumour or occipital calcification. The
      seizures can be clinically indistinguishable, which is precisely why
      imaging is mandatory. No MONDO disease_term is bound because this is a
      lesional category rather than a single named entity.
    distinguishing_features:
      - Abnormal brain magnetic resonance imaging showing an occipital lesion.
      - Seizures may be drug-resistant rather than responsive to monotherapy.
      - No age-dependent remission.
      - Neurological examination or visual field testing may be abnormal between seizures.
    evidence:
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Differentiation from symptomatic occipital epilepsy, particularly when
          children are otherwise normal, can be difficult.
        explanation: >-
          States directly that separating the self-limited syndrome from lesional
          occipital epilepsy is difficult, which is why this differential is
          carried.
discussions:
  - discussion_id: cove_fixation_off_causal_or_marker
    kind: CONTROVERSY
    status: UNDER_DISCUSSION
    prompt: >-
      Is fixation-off sensitivity part of the causal chain that produces seizures
      in childhood occipital visual epilepsy, or is it a low-epileptogenicity
      marker of occipital cortical excitability that happens to travel with the
      syndrome?
    attaches_to:
      - "pathophysiology#Fixation-Dependent Gating of Occipital Discharges"
    rationale: >-
      Fixation-off sensitivity is the most distinctive electrographic feature of
      this syndrome and it is tempting to read it mechanistically: removing
      visual input releases the occipital cortex, the cortex discharges, and the
      discharge becomes a seizure. The difficulty is that when the phenomenon is
      searched for systematically outside this syndrome, it turns up in a wide
      range of unrelated epilepsies, and in that setting it is remarkably poor at
      producing actual seizures. In a twelve-year video-electroencephalography
      series that deliberately excluded children with idiopathic occipital
      paroxysms, only one patient had a seizure documented as induced by the
      fixation-off state. If fixation-off sensitivity were straightforwardly
      seizure-generating, that number should be higher. The alternative reading
      is that fixation-off sensitivity reports on the state of occipital
      excitability without itself driving the transition to seizure, in which
      case it is a superb biomarker and a poor mechanism. The distinction matters
      practically, because a causal reading would predict that manipulating
      fixation could be therapeutic, and a marker reading predicts it would not.
    proposed_experiments:
      - experiment_id: cove_fos_seizure_induction_yield
        name: Prospective quantification of seizure induction by fixation-off within this syndrome
        description: >-
          Prolonged video-electroencephalography in a prospective cohort of
          children meeting current criteria for childhood occipital visual
          epilepsy, with repeated standardized fixation-off manoeuvres, recording
          how often the fixation-off state produces a clinical visual seizure
          rather than an electrographic paroxysm alone. The comparison of
          interest is the ratio of electrographic to clinical events under
          fixation-off within this syndrome, against the near-zero clinical yield
          reported in other epilepsies.
        decision_criterion: >-
          A substantially higher rate of fixation-off-induced clinical seizures
          in this syndrome than in the reported non-idiopathic populations would
          support a causal role. A comparably negligible clinical yield, with
          electrographic paroxysms alone, would support the marker reading.
      - experiment_id: cove_fos_habitual_seizure_correlation
        name: Correlation of habitual seizure timing with fixation-off conditions
        description: >-
          Seizure diaries paired with ambulatory recording, testing whether
          habitual spontaneous seizures cluster around real-world
          fixation-eliminating conditions such as darkness, eye closure, or
          waking, rather than being distributed across the day independently of
          visual engagement.
        decision_criterion: >-
          Clustering of habitual seizures around fixation-eliminating conditions
          would support a causal role for the gating mechanism. A diurnal
          distribution unrelated to visual engagement, in a syndrome whose
          seizures are already known to be diurnal, would argue against it.
    evidence:
      - reference: PMID:19258232
        reference_title: >-
          Fixation-off sensitivity in epilepsies other than the idiopathic
          epilepsies of childhood with occipital paroxysms: a 12-year
          clinical-video EEG study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Seven of these patterns were associated with habitual seizures in seven
          patients, but actual FOS-induced seizures (absences) were documented
          with video EEG in only one patient; three others had some historical
          evidence suggesting that, under some circumstances, their FOS EEG
          abnormalities might generate clinical seizures.
        explanation: >-
          The direct evidence for the marker reading: the fixation-off state was
          documented to induce a clinical seizure in only one patient across a
          twelve-year series.
      - reference: PMID:19258232
        reference_title: >-
          Fixation-off sensitivity in epilepsies other than the idiopathic
          epilepsies of childhood with occipital paroxysms: a 12-year
          clinical-video EEG study.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Although FOS appears to be of relatively low epileptogenicity, an
          electroclinical profile of pure FOS epilepsy may exist
        explanation: >-
          States both halves of the controversy in one sentence: low
          epileptogenicity overall, but the possibility that a genuinely
          fixation-off-driven epilepsy exists.
      - reference: PMID:19258232
        reference_title: >-
          Fixation-off sensitivity in epilepsies other than the idiopathic
          epilepsies of childhood with occipital paroxysms: a 12-year
          clinical-video EEG study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          From January 1995 to December 2006, 19 of about 8,500 patients had had
          one or more video-EEGs with FOS, yielding an approximate incidence of
          0.2%.
        explanation: >-
          Establishes how rare the phenomenon is overall, which is relevant to
          how much explanatory weight it can carry.
  - discussion_id: cove_migraine_shared_substrate
    kind: OPEN_QUESTION
    status: OPEN
    prompt: >-
      Does the post-ictal headache of childhood occipital visual epilepsy arise
      because the seizure recruits the same trigeminovascular machinery that
      produces migraine headache, or do the two conditions share an underlying
      occipital cortical hyperexcitability and simply co-occur?
    attaches_to:
      - "pathophysiology#Post-Ictal Headache"
    rationale: >-
      The syndrome is misdiagnosed as migraine often enough that the overlap
      cannot be dismissed as coincidence of symptom vocabulary. Two mechanistic
      accounts are available. On the first, the occipital seizure is an
      intracortical event that, like the cortical event thought to underlie
      migraine aura, is capable of activating trigeminovascular afferents and
      thereby generating a headache with migrainous character. On the second, an
      inherited tendency to occipital cortical hyperexcitability predisposes to
      both epileptic visual seizures and migraine aura in the same children, and
      the headache after a seizure is a genuinely migrainous attack that has been
      triggered rather than a post-ictal phenomenon. These have different
      consequences: the first predicts that suppressing seizures should abolish
      the headaches, the second predicts that headaches should persist at some
      rate after seizures are controlled. This entry models the association
      without asserting either.
    proposed_experiments:
      - experiment_id: cove_headache_after_seizure_control
        name: Headache trajectory after seizure control
        description: >-
          Longitudinal follow-up of children whose visual seizures are fully
          controlled on medication, tracking headache frequency and phenotype
          before and after control, using standardized headache criteria rather
          than clinical impression.
        decision_criterion: >-
          Near-complete resolution of headache alongside seizure control supports
          the seizure-triggered account. Persistence of migrainous headache at a
          rate above the population baseline after seizures stop supports the
          shared-substrate account.
      - experiment_id: cove_migraine_family_history_enrichment
        name: Family history and comorbid migraine enrichment
        description: >-
          Systematic ascertainment of personal and family history of migraine in
          a cohort with this syndrome against matched children with a
          non-occipital self-limited focal epilepsy, testing whether migraine
          burden is specifically enriched in the occipital syndrome rather than
          in childhood epilepsy generally.
        decision_criterion: >-
          Enrichment specific to the occipital syndrome would support a shared
          occipital substrate. Comparable migraine burden across focal epilepsy
          syndromes would argue that the association is with epilepsy in general
          rather than with occipital excitability.
    evidence:
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Idiopathic childhood occipital epilepsy of Gastaut is frequently
          misdiagnosed as migraine with visual aura, acephalgic, or basilar
          migraine.
        explanation: >-
          Establishes the clinical overlap that the question is about, and that
          it is systematic rather than occasional.
      - reference: PMID:26498733
        reference_title: >-
          Clinical dissection of childhood occipital epilepsy of Gastaut and
          prognostic implication.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The following clinical characteristics were evaluated: gender, patient
          age at seizure onset, history of febrile seizures and migraine, family
          history of epilepsy, duration and seizure manifestations, circadian
          distribution and frequency of seizures, history of medications
          including the number of drugs, therapeutic response and final outcome.
        explanation: >-
          History of migraine is collected as a variable in the largest outcome
          study of the syndrome, which shows the association is taken seriously
          clinically, but the abstract does not report the result, so this
          supports only the framing of the question.
  - discussion_id: cove_why_some_do_not_remit
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Why do about a third of children with childhood occipital visual epilepsy
      fail to remit, and is the coexistence of another epileptic syndrome the
      cause of the worse outcome or a marker of a different underlying condition
      that was misclassified as this syndrome?
    attaches_to:
      - "pathophysiology#Age-Dependent Remission of the Epileptogenic State"
    rationale: >-
      The syndrome is defined as self-limited, but the self-limitation is
      statistical rather than absolute, since roughly a third are still having
      seizures at sixteen. The largest long-term cohort found that the split runs
      along a specific line, namely whether the occipital epilepsy occurs in
      isolation or alongside another epileptic syndrome, with the latter group
      responding worse to monotherapy and being less often seizure-free at the
      end of follow-up. That finding admits two readings. It may be that having a
      second epileptic process genuinely worsens the trajectory of the occipital
      one, through a more widely excitable cortex. Or it may be that the presence
      of a second syndrome indicates the child never had the self-limited entity
      in the first place, and was carrying a broader epilepsy of which the
      occipital seizures were one expression. Nothing in the existing data
      separates these, because the classification was made at referral rather
      than by a mechanism test, and no molecular or physiological marker of the
      syndrome exists to adjudicate membership independently of the clinical
      picture.
    proposed_experiments:
      - experiment_id: cove_outcome_stratification_prospective
        name: Prospective stratification by isolated versus syndrome-associated status
        description: >-
          A prospective cohort recruited at diagnosis rather than at referral,
          classified as isolated or syndrome-associated by protocol at entry,
          with the second syndrome ascertained by prolonged
          electroencephalography rather than by history, followed to age eighteen
          for seizure freedom and electroencephalographic resolution.
        decision_criterion: >-
          If the outcome difference persists when the second syndrome is
          ascertained rigorously at entry, the coexistence is doing causal work.
          If the difference shrinks substantially when classification is made by
          protocol rather than at referral, the finding was largely a
          misclassification artefact.
      - experiment_id: cove_remission_predictors_electrographic
        name: Electrographic predictors of remission
        description: >-
          Serial electroencephalography through adolescence in a cohort with this
          syndrome, testing whether features of the occipital discharge at
          diagnosis, such as its spatial extent, whether it remains strictly
          unilateral, and the strength of fixation-off gating, predict which
          children remit and which do not.
        decision_criterion: >-
          An electrographic feature at diagnosis that predicts non-remission
          would identify a mechanistically distinct subgroup within the current
          syndrome definition. Absence of any predictive feature would suggest
          the non-remitting third differ by something not visible on scalp
          recording.
    evidence:
      - reference: PMID:19955346
        reference_title: >-
          Idiopathic childhood occipital epilepsy of Gastaut: a review and
          differentiation from migraine and other epilepsies.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Patients usually respond well to antiepileptic medication and about
          two-thirds remit by the age of 16 years.
        explanation: >-
          Establishes the size of the non-remitting group, which is what the gap
          is about: a third of children do not follow the self-limited course the
          syndrome name implies.
      - reference: PMID:26498733
        reference_title: >-
          Clinical dissection of childhood occipital epilepsy of Gastaut and
          prognostic implication.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Patients were subdivided into two groups: group A with isolated COE-G;
          group B with other epileptic syndromes associated with COE-G.
        explanation: >-
          Defines the stratification along which the outcome difference is
          observed, which is the axis the proposed experiments test.
      - reference: PMID:26498733
        reference_title: >-
          Clinical dissection of childhood occipital epilepsy of Gastaut and
          prognostic implication.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The association of typical COE-G symptoms with other types of seizure
          could be related to a poor epilepsy outcome.
        explanation: >-
          The authors' own cautious framing, which stops at association rather
          than asserting causation, matching the open status of this gap.
      - reference: PMID:26498733
        reference_title: >-
          Clinical dissection of childhood occipital epilepsy of Gastaut and
          prognostic implication.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          This was a retrospective analysis of the long-term outcome of epilepsy
          in 129 patients with COE-G who were referred to 23 Italian epilepsy
          centres and one in Austria between 1991 and 2004.
        explanation: >-
          The retrospective, referral-based design is exactly the limitation that
          makes the misclassification reading impossible to exclude, which is why
          the proposed experiment is prospective and protocol-classified.
  - discussion_id: cove_absent_genetic_basis
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      What is the genetic basis of childhood occipital visual epilepsy, and why
      has no locus been established for it when neighbouring self-limited focal
      epilepsies have yielded candidate genes?
    attaches_to:
      - "pathophysiology#Age-Dependent Hyperexcitability of the Occipital Cortex"
    rationale: >-
      This entry carries no genetic section, and the absence is deliberate. The
      syndrome sits inside a family of epilepsies that is presumed genetic and
      shows familial clustering, and its age-dependent onset and remission look
      like a developmental genetic programme rather than an acquired state. Yet
      no gene has been established for it. Part of the reason is likely
      practical, since the syndrome is the rarest of the four self-limited focal
      epilepsies, so cohorts large enough for gene discovery are hard to
      assemble. Part may be substantive, if the susceptibility is polygenic and
      the occipital localization is determined by something other than the
      variants themselves. Filling this section by borrowing candidate genes from
      the centrotemporal syndrome would be fabrication, so the gap is recorded
      here instead.
    proposed_experiments:
      - experiment_id: cove_multicentre_sequencing_cohort
        name: Multicentre sequencing cohort assembled on strict syndrome criteria
        description: >-
          Exome or genome sequencing of a multicentre cohort recruited strictly
          on current ILAE criteria for childhood occipital visual epilepsy, with
          parental samples where available, powered by aggregation across the
          centres that already contribute to the long-term outcome literature.
        decision_criterion: >-
          Identification of a gene or locus enriched in cases against ancestry
          matched controls would establish a genetic basis. A null result at
          adequate power would support a polygenic architecture and argue against
          a monogenic model.
      - experiment_id: cove_polygenic_score_transfer
        name: Transfer of self-limited focal epilepsy polygenic signal
        description: >-
          Testing whether polygenic scores derived from the better-powered
          self-limited epilepsy with centrotemporal spikes cohorts are elevated
          in children with the occipital syndrome, which would indicate shared
          susceptibility architecture across the family.
        decision_criterion: >-
          An elevated transferred polygenic score supports shared susceptibility
          with syndrome-specific localization determined elsewhere. No transfer
          would indicate the occipital syndrome has a distinct genetic
          architecture despite its nosological grouping.
    evidence:
      - reference: PMID:35503717
        reference_title: >-
          International League Against Epilepsy classification and definition of
          epilepsy syndromes with onset in childhood: Position paper by the ILAE
          Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Epilepsy syndromes beginning in childhood have been divided into three
          categories: (1) self-limited focal epilepsies, comprising four
          syndromes: self-limited epilepsy with centrotemporal spikes,
          self-limited epilepsy with autonomic seizures, childhood occipital
          visual epilepsy, and photosensitive occipital lobe epilepsy
        explanation: >-
          Places the syndrome inside the self-limited focal epilepsy family,
          which is the basis for the presumption of a genetic contribution and
          for the proposed polygenic transfer experiment.
      - reference: PMID:26498733
        reference_title: >-
          Clinical dissection of childhood occipital epilepsy of Gastaut and
          prognostic implication.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The following clinical characteristics were evaluated: gender, patient
          age at seizure onset, history of febrile seizures and migraine, family
          history of epilepsy, duration and seizure manifestations, circadian
          distribution and frequency of seizures, history of medications
          including the number of drugs, therapeutic response and final outcome.
        explanation: >-
          Family history of epilepsy is collected as a clinical variable rather
          than analysed as a genetic exposure, which illustrates the level at
          which heritability is currently addressed for this syndrome.

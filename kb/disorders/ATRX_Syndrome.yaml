diagnosis:
- name: Molecular Confirmation of ATRX-Related Disease
  description: >-
    In a patient with suggestive findings and a 46,XY karyotype, identification
    of a hemizygous pathogenic ATRX variant establishes the molecular diagnosis.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: A hemizygous pathogenic ATRX variant confirms ATR-X-related syndrome in the appropriate clinical context.
  evidence:
  - reference: PMID:20301622
    reference_title: Alpha-Thalassemia X-Linked Intellectual Disability Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ATR-X syndrome is established in a proband with suggestive findings, a 46,XY karyotype, and a hemizygous pathogenic variant in ATRX identified by molecular genetic testing."
    explanation: GeneReviews states the molecular diagnostic criterion.
- name: Peripheral-Blood DNA Methylation Episignature
  description: >-
    A highly specific blood DNA methylation episignature can support diagnosis
    in phenotypically complex cases or help interpret an ATRX variant of
    uncertain significance. It is supportive rather than a standalone
    replacement for clinical and sequence interpretation.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: A matching ATR-X methylation episignature provides supportive molecular evidence.
  evidence:
  - reference: PMID:28293299
    reference_title: Identification of epigenetic signature associated with alpha thalassemia/mental retardation X-linked syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most significant methylation changes in the 14 genomic loci provide a unique epigenetic signature for this syndrome that may be used as a highly sensitive and specific diagnostic biomarker to support the diagnosis of ATR-X, particularly in patients with phenotypic complexity and in patients with ATRX gene sequence variants of unknown significance."
    explanation: >-
      The study supports the episignature specifically as an adjunct in complex
      cases and for uncertain variants.

genetic:
- name: ATRX Pathogenic Germline Variants
  gene_term:
    preferred_term: ATRX
    term:
      id: hgnc:886
      label: ATRX
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Pathogenic hemizygous ATRX variants impair chromatin-remodeling function.
    Constitutional alleles are often described as hypomorphic. A literature
    review of 63 patients reported epilepsy and urogenital, acoustic, and
    optical defects more often with frameshift than missense variants, but the
    small, heterogeneous retrospective sample is descriptive and not suitable
    for individual prognosis. Broad domain-specific genotype-phenotype
    correlations remain insufficient for routine prognostic use.

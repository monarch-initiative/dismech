mechanistic_hypotheses:
- hypothesis_group_id: atrx_chromatin_dysregulation
  hypothesis_label: ATRX Chromatin and Transcriptional Dysregulation
  status: CANONICAL
  description: >-
    Impaired ATRX chromatin-remodeling activity disrupts ATRX-DAXX-dependent
    heterochromatin regulation and tandem-repeat-associated gene expression,
    producing a multisystem developmental disorder.
  evidence:
  - reference: PMID:7697714
    reference_title: Mutations in a putative global transcriptional regulator cause X-linked mental retardation with alpha-thalassemia (ATR-X syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The complex ATR-X phenotype suggests that XH2, when mutated, down-regulates expression of several genes, including the alpha-globin genes, indicating that it could be a global transcriptional regulator."
    explanation: >-
      The foundational report supports broad transcriptional dysregulation as
      the canonical disease model.
  - reference: PMID:12953102
    reference_title: The ATRX syndrome protein forms a chromatin-remodeling complex with Daxx and localizes in promyelocytic leukemia nuclear bodies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ATRX and Daxx are components of an ATP-dependent chromatin-remodeling"
    explanation: >-
      Biochemical evidence supports the ATRX-DAXX chromatin-remodeling arm of
      the canonical model.
  - reference: PMID:21029860
    reference_title: ATR-X syndrome protein targets tandem repeats and influences allele-specific expression in a size-dependent manner.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Genes associated with these TRs can be dysregulated when ATRX is"
    explanation: >-
      The study supports tandem-repeat-associated transcriptional
      dysregulation in the canonical model.
- hypothesis_group_id: atrx_sertoli_androgen_model
  hypothesis_label: Sertoli Cell and Androgen-Signaling Model
  status: EMERGING
  description: >-
    Mouse Sertoli-cell loss of Atrx causes proliferative arrest and apoptosis
    and perturbs androgen-receptor-dependent transcription. This is a candidate
    explanation for human genital anomalies, not an established direct human
    causal chain.
  evidence:
  - reference: PMID:21427128
    reference_title: Defective survival of proliferating Sertoli cells and androgen receptor function in a mouse model of the ATR-X syndrome.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "ScAtrxKO mice developed small testes and discontinuous tubules, due to prolonged G2/M phase and apoptosis of proliferating Sertoli cells during fetal life."
    explanation: The conditional mouse model supports this emerging hypothesis.
- hypothesis_group_id: atrx_glial_myelination_model
  hypothesis_label: Oligodendrocyte and Myelination Model
  status: EMERGING
  description: >-
    Mouse ATRX loss impairs oligodendrocyte-progenitor differentiation and
    myelination. The extent to which this model explains human white-matter
    abnormalities remains unresolved.
  evidence:
  - reference: PMID:37925436
    reference_title: Systemic and intrinsic functions of ATRX in glial cell fate and CNS myelination in male mice.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "These functions of ATRX identified in mice could explain white matter pathogenesis observed in ATR-X syndrome patients."
    explanation: The authors explicitly frame the mouse-to-human link as provisional.

pathophysiology:
- name: ATRX Chromatin-Remodeling Dysfunction
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component Haploinsufficiency"
  description: >-
    Pathogenic constitutional ATRX variants impair an ATP-dependent chromatin
    remodeler of the SWI/SNF family. Clinically observed alleles are often
    described as hypomorphic; this node therefore models impaired ATRX function
    without asserting that every patient allele is a complete null. The defect
    alters chromatin targeting or remodeling and dysregulates transcription
    across multiple genomic contexts.
  role: trigger
  gene:
    preferred_term: ATRX
    term:
      id: hgnc:886
      label: ATRX
  biological_processes:

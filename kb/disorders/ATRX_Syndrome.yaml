      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The complex ATR-X phenotype suggests that XH2, when mutated, down-regulates expression of several genes, including the alpha-globin genes, indicating that it could be a global transcriptional regulator."
      explanation: >-
        The foundational report supports a multisystem consequence of broad
        gene dysregulation while not resolving each downstream intermediate.

- name: ATRX-DAXX Heterochromatin Remodeling Impairment
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin State Imbalance"
  description: >-
    ATRX cooperates with DAXX in a chromatin-remodeling and histone-chaperone
    complex. The prevailing model places H3.3 at heterochromatin to help
    maintain H3K9me3-associated silencing. ATR-X blood samples also show a
    specific methylation signature enriched near pericentromeric and telomeric
    regions, consistent with disturbed heterochromatin regulation.
  biological_processes:
  - preferred_term: heterochromatin organization
    term:
      id: GO:0070828
      label: heterochromatin organization
    modifier: ABNORMAL
  - preferred_term: nucleosome assembly
    term:
      id: GO:0006334
      label: nucleosome assembly
    modifier: ABNORMAL
  evidence:
  - reference: PMID:12953102
    reference_title: The ATRX syndrome protein forms a chromatin-remodeling complex with Daxx and localizes in promyelocytic leukemia nuclear bodies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Taken together, the results suggest that ATRX functions in conjunction with Daxx in a novel chromatin-remodeling complex. The defects in ATRX syndrome may result from inappropriate expression of genes controlled by this complex."
    explanation: >-
      The study establishes the ATRX-DAXX complex and its proposed disease
      relevance.
  - reference: PMID:26773061
    reference_title: "New players in heterochromatin silencing: histone variant H3.3 and the ATRX/DAXX chaperone."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We provide an overview of the individual components (ATRX, DAXX and/or H3.3) tested in each study and propose a model where the ATRX/DAXX chaperone complex deposits H3.3 to maintain the H3K9me3 modification at heterochromatin throughout the genome."
    explanation: >-
      This mechanistic review supports the H3.3-deposition and H3K9me3
      maintenance model.
  - reference: PMID:28293299
    reference_title: Identification of epigenetic signature associated with alpha thalassemia/mental retardation X-linked syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "differentially methylated regions showed evidence of preferential clustering in pericentromeric and telometric chromosomal regions, areas where ATRX has multiple functions related to maintenance of heterochromatin and genomic integrity"
    explanation: >-
      The human blood methylation signature is consistent with disturbance at
      ATRX-associated heterochromatic regions.

- name: Tandem-Repeat-Associated Gene Dysregulation
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Dysregulated Neurodevelopmental Transcriptional Program"
  description: >-
    ATRX binds G-rich tandem-repeat sequences in telomeres and euchromatin,
    including sequences capable of forming non-B DNA structures. ATRX mutation
    can produce repeat-size-dependent dysregulation and skewed allelic
    expression at associated genes, including downregulation of alpha-globin.
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: ABNORMAL
  evidence:

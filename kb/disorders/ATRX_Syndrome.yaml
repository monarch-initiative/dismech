name: ATR-X-Related Syndrome
creation_date: "2026-06-03T00:00:00Z"
description: >-
  ATR-X-related syndrome is an X-linked neurodevelopmental spectrum caused by
  pathogenic germline variants that impair the ATRX chromatin remodeler.
  Affected individuals can have developmental delay or intellectual
  disability, hypotonia, a characteristic facial appearance, genital
  anomalies, gastrointestinal and skeletal manifestations, seizures, and
  variably alpha-thalassemia. The historical alpha-thalassemia X-linked
  intellectual disability and intellectual disability-hypotonic facies labels
  overlap clinically and mechanistically; they are represented here as
  nosologic subtypes rather than independent mechanism records.
category: Mendelian
parents:
- Genetic Disease
- Nervous System Disease
disease_term:
  preferred_term: ATR-X-related syndrome
  term:
    id: MONDO:0016980
    label: ATR-X-related syndrome
notes: >-
  This umbrella record consolidates the two prior ATRX-associated records under
  their shared MONDO parent. MONDO:0010519 and MONDO:0010663 are retained as
  overlapping historical or nosologic children; the current evidence does not
  establish substantially independent mechanisms that would justify separate
  disease-mechanism files.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATR-X syndrome is a rare X-linked congenital disorder caused by hypomorphic mutations in the ATRX gene."
    explanation: >-
      The clinical cohort supports pathogenic hypomorphic ATRX impairment as
      the initiating lesion.
  - reference: PMID:7697714
    reference_title: Mutations in a putative global transcriptional regulator cause X-linked mental retardation with alpha-thalassemia (ATR-X syndrome).
    supports: SUPPORT

genetic:
- name: KMT2B
  gene_term:
    preferred_term: KMT2B
    term:
      id: hgnc:15840
      label: KMT2B
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  presence: PRESENT
  notes: >-
    variant_origin records the majority case only; the slot is single-valued and
    inherited alleles are well documented, including a nonsense variant
    co-segregating through a three-generation kindred.
    Heterozygous loss-of-function variants involving KMT2B account for
    approximately 88% of affected individuals; a heterozygous 19q13.11-19q13.12
    deletion encompassing KMT2B accounts for approximately 12%. Variant class
    carries prognostic information for onset and systemic burden: deletions and
    protein-truncating variants give earlier dystonia onset and more systemic
    disease than missense variants. Whether it predicts deep brain stimulation
    response is not settled by anything cited here — the pooled analysis in this
    entry identifies sex and baseline severity as predictors and does not test
    genotype.
    A recurrent missense hotspot at Arg2565 produces a strikingly wide range of
    severity, from childhood-onset dystonia to unrecognized behavioral symptoms
    in adulthood, with a correspondingly attenuated methylation signature.
  evidence:
  - reference: PMID:29697234
    reference_title: KMT2B-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a heterozygous pathogenic variant involving KMT2B (~88% of affected
      individuals) or a heterozygous deletion of 19q13.11-19q13.12 involving
      KMT2B (~12% of affected individuals)
    explanation: Quantifies the two causal lesion classes at the KMT2B locus.
  - reference: PMID:33150406
    reference_title: "KMT2B-related disorders: expansion of the phenotypic spectrum and long-term efficacy of deep brain stimulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of this study cohort (n = 53) in tandem with published cases (n =
      80) revealed that patients with chromosomal deletions and protein
      truncating variants had a significantly higher burden of systemic disease
      (with earlier onset of dystonia) than those with missense variants.
    explanation: >-
      Supports the genotype-phenotype correlation between lesion class, onset age
      and systemic burden.
  - reference: PMID:39933316
    reference_title: Variable expressivity of KMT2B variants at codon 2565 in patients with dystonia and developmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We established the existence of a KMT2B missense-mutation hotspot associated
      with varying degrees of disease severity and expression, providing
      information for patient counseling and elucidation of pathomechanisms.
    explanation: Establishes the Arg2565 missense hotspot and its variable expressivity.
  - reference: PMID:39933316
    reference_title: Variable expressivity of KMT2B variants at codon 2565 in patients with dystonia and developmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The observed phenotypic spectrum ranged from childhood-onset dystonia (N =
      2) over unspecific intellectual disability syndromes (N = 2) to undiagnosed
      behavioral symptoms in adulthood (N = 1).
    explanation: Quantifies how wide the expressivity range is at a single recurrent codon.
  - reference: PMID:31216378
    reference_title: "Frequency and phenotypic spectrum of KMT2B dystonia in childhood: A single-center cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 14 patients (21.5%) carrying KMT2B variants, of which 1 was
      classified as a variant of unknown significance.
    explanation: >-
      Diagnostic yield in a childhood-onset dystonia cohort already negative for
      other dystonia genes, supporting KMT2B as a common monogenic cause.
diagnosis:
- name: Molecular genetic testing for a KMT2B variant or 19q13 deletion
  description: >-
    The confirmatory test. Either a heterozygous pathogenic KMT2B sequence
    variant or a heterozygous 19q13.11-19q13.12 deletion encompassing the gene
    establishes the diagnosis in a proband with suggestive findings. The two
    lesion classes need different assays, which is why sequencing alone is not
    sufficient: a deletion carrier is missed by a test that only reads sequence.
  presence: PRESENT
  evidence:
  - reference: PMID:29697234
    reference_title: KMT2B-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of a KMT2B-related disorder is established in a proband with
      suggestive findings and either of the following identified by molecular
      genetic testing: a heterozygous pathogenic variant involving KMT2B (~88% of
      affected individuals) or a heterozygous deletion of 19q13.11-19q13.12
      involving KMT2B (~12% of affected individuals).
    explanation: The GeneReviews diagnostic criterion, with the yield of each lesion class.
- name: KMT2B DNA methylation episignature
  description: >-
    Genome-wide peripheral-blood DNA methylation profiling resolves a
    disorder-specific episignature for KMT2B haploinsufficiency. Its practical
    value is variant reclassification: it distinguishes carriers from controls
    and from other dystonic and neurodevelopmental disorders, so a KMT2B variant
    of uncertain significance can be resolved functionally rather than left open.
    The signature is attenuated in Arg2565 missense carriers relative to
    loss-of-function carriers, so a weak result does not exclude the diagnosis.
  presence: PRESENT
  evidence:
  - reference: PMID:34380541
    reference_title: Childhood-onset dystonia-causing KMT2B variants result in a distinctive genomic hypermethylation profile.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate a distinctive DNA hypermethylation pattern associated with
      DYT28, provide an epigenetic signature for this disorder enabling accurate
      diagnosis and reclassification of ambiguous genetic findings and suggest
      potential therapeutic approaches.
    explanation: Establishes the episignature as a diagnostic and variant-reclassification tool.
  - reference: PMID:39933316
    reference_title: Variable expressivity of KMT2B variants at codon 2565 in patients with dystonia and developmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Samples bearing p.Arg2565Gly had a KMT2B-typical episignature, although the
      effect on methylation was less pronounced than in carriers of
      loss-of-function KMT2B variants.
    explanation: >-
      Supports the caveat that signature strength varies with allele class, so a
      muted signature is not a negative result.
  - reference: PMID:38425714
    reference_title: "Diagnostic utility of DNA methylation episignature analysis for early diagnosis of KMT2B-related disorders: case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Episignature screening in this pre-symptomatic patient enabled accurate
      genetic diagnosis and timely and actionable intervention earlier in the
      natural history of Childhood-onset Dystonia-28.
    explanation: >-
      Demonstrates the episignature diagnosing a carrier before dystonia onset,
      which is the case conventional phenotype-led testing cannot reach.
- name: Misdiagnosis as dyskinetic cerebral palsy
  description: >-
    A progressive childhood movement disorder with developmental delay is
    routinely labelled dyskinetic cerebral palsy, and KMT2B carriers are found on
    genetic re-evaluation of that diagnosis. This matters more than a
    nomenclature point: the cerebral palsy label closes the diagnostic pathway
    and, with it, access to the pallidal stimulation that works here.
  presence: PRESENT
  evidence:
  - reference: PMID:41738007
    reference_title: "KMT2B-related disorders in Austria: clinical features and long-term outcome after deep brain stimulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, KMT2B variants were identified upon genetic re-evaluation in two
      patients previously diagnosed with dyskinetic cerebral palsy.
    explanation: >-
      Documents KMT2B disease presenting under a cerebral palsy label until
      genetic re-evaluation.
treatments:
- name: Antimuscarinic (Anticholinergic) Therapy
  description: >-
    Oral antimuscarinic agents, principally trihexyphenidyl, are the recommended
    first-line pharmacologic treatment and significantly improve motor
    manifestations in roughly half of individuals.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: trihexyphenidyl
      term:
        id: CHEBI:9720
        label: Trihexyphenidyl
  target_mechanisms:
  - target: Pallidal Motor Circuit Dysfunction
  evidence:
  - reference: PMID:29697234
    reference_title: KMT2B-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antimuscarinic (anticholinergic) agents have significantly improved motor
      manifestations in about 50% of individuals and should be considered a
      first-line pharmacologic treatment in individuals with a KMT2B-related
      disorder.
    explanation: GeneReviews recommends antimuscarinic agents as first-line therapy.
- name: Bilateral Globus Pallidus Internus Deep Brain Stimulation
  description: >-
    Bilateral deep brain stimulation of the globus pallidus pars interna is the
    most effective intervention reported and produces a dramatic, long-lasting
    reduction in dystonia severity, in some cases restoring independent
    ambulation. Its benefit is regionally uneven: trunk and cervical dystonia
    improve most, laryngeal dystonia responds poorly, and gait improvement decays
    over years, with no patient in the longest-followed cohort maintaining a fully
    independent gait. Male sex and greater preoperative severity predict better
    response. Mild parkinsonism is a recognized post-operative complication.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: bilateral globus pallidus internus deep brain stimulation
    term:
      id: NCIT:C21024
      label: Deep Brain Stimulation
  target_mechanisms:
  - target: Pallidal Motor Circuit Dysfunction
  - target: Ascending Generalization of Dystonic Posturing
  target_phenotypes:
  - preferred_term: Generalized dystonia
    term:
      id: HP:0007325
      label: Generalized dystonia
  evidence:
  - reference: PMID:29697234
    reference_title: KMT2B-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bilateral globus pallidus pars interna deep brain stimulation, performed in
      about 80 individuals to date, has resulted in substantial clinical and
      functional improvement.
    explanation: GeneReviews reports substantial benefit from bilateral GPi DBS.
  - reference: PMID:35005062
    reference_title: "GPi-DBS for KMT2B-Associated Dystonia: Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GPi-DBS resulted in median BFMDRS-M improvement of 42.7% (range: -103.5% to
      95.9%) postoperatively.
    explanation: Pooled effect size for pallidal stimulation across ten studies.
  - reference: PMID:35005062
    reference_title: "GPi-DBS for KMT2B-Associated Dystonia: Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KMT2B-associated dystonia responds effectively to pallidal stimulation. The
      outcome is better in males and those with more severe dystonia at baseline.
    explanation: Identifies male sex and baseline severity as predictors of response.
  - reference: PMID:33150406
    reference_title: "KMT2B-related disorders: expansion of the phenotypic spectrum and long-term efficacy of deep brain stimulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The greatest BFMDRS-M improvements were observed for trunk (53.2%) and
      cervical (50.5%) dystonia, with less clinical impact on laryngeal dystonia.
    explanation: Documents the regional unevenness of benefit, including poor laryngeal response.
  - reference: PMID:33150406
    reference_title: "KMT2B-related disorders: expansion of the phenotypic spectrum and long-term efficacy of deep brain stimulation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Improvements in gait dystonia decreased from 20.9% at 1 year to 16.2% at
      last assessment; no patient maintained a fully independent gait.
    explanation: >-
      Refutes any claim that pallidal stimulation restores durable independent
      ambulation, the outcome families most often expect from it.
  - reference: PMID:33150406
    reference_title: "KMT2B-related disorders: expansion of the phenotypic spectrum and long-term efficacy of deep brain stimulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five patients developed mild parkinsonism following deep brain stimulation.
    explanation: Records a treatment-emergent adverse movement disorder.
  - reference: PMID:41738007
    reference_title: "KMT2B-related disorders in Austria: clinical features and long-term outcome after deep brain stimulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Freezing of gait as a side effect of the DBS was seen in two patients in
      our cohort (4I and 2V).
    explanation: >-
      A second treatment-emergent gait complication, and one that compounds the
      poor gait response already recorded above.
  - reference: PMID:31216378
    reference_title: "Frequency and phenotypic spectrum of KMT2B dystonia in childhood: A single-center cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight patients underwent pallidal DBS with a median decrease of
      Burke-Fahn-Marsden Dystonia Rating Scale-Motor score of 38.5% in the long
      term.
    explanation: Independent cohort reporting sustained long-term motor benefit.
  - reference: PMID:41738007
    reference_title: "KMT2B-related disorders in Austria: clinical features and long-term outcome after deep brain stimulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite secondary symptom worsening during long-term follow-up, GPi DBS
      preserved ambulation in three patients and enabled sustained recovery of
      walking ability in two, maintaining functional independence.
    explanation: >-
      Qualifies the gait result above: stimulation did not restore a fully
      independent gait in the Cif cohort, but in this cohort it preserved or
      recovered ambulation, so the honest reading is that gait benefit is real
      and unreliable rather than absent.
  - reference: PMID:41738007
    reference_title: "KMT2B-related disorders in Austria: clinical features and long-term outcome after deep brain stimulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GPi DBS offers durable clinical benefits, particularly when initiated
      before loss of ambulation.
    explanation: >-
      Supports timing of surgery, before ambulation is lost, as a determinant of
      long-term benefit.
- name: Botulinum Toxin Injection
  description: >-
    Focal chemodenervation of the affected muscle group. It does nothing to the
    underlying epigenetic lesion and acts at the neuromuscular junction, far
    downstream of everything this entry models, but it is the practical option
    for the focal and segmental presentations — blepharospasm, cervical dystonia,
    spasmodic dysphonia — where generalized measures are disproportionate.
    Reported benefit in the adult-onset series is partial and, in one subject,
    short-lived.
  notes: >-
    therapeutic_agent is left unbound. The cited report says "botulinum toxin"
    without a serotype; CHEBI codes only type A, and NCIT's generic
    NCIT:C163032 Botulinum Toxin is not reachable from the ChemicalEntityTerm
    roots (CHEBI:24431, NCIT:C1909), so the only bindable options would assert a
    serotype the source does not give.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: botulinum toxin
  evidence:
  - reference: PMID:36483457
    reference_title: Adult-onset KMT2B-related dystonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anticholinergics did not bring any benefit. Botulinum toxin injections led
      to moderate improvement of dystonia.
    explanation: >-
      Records partial benefit from chemodenervation in an adult-onset carrier in
      whom the first-line antimuscarinic failed.
- name: Levodopa Trial
  description: >-
    A trial of levodopa and other anti-dystonic agents is reasonable, chiefly to
    exclude a dopa-responsive dystonia, but long-term benefit is not obtained in
    most individuals. This is a diagnostically important negative: unlike
    GCH1-related dopa-responsive dystonia, KMT2B-related dystonia does not show a
    sustained levodopa response.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levodopa
      term:
        id: CHEBI:15765
        label: L-dopa
  evidence:
  - reference: PMID:29697234
    reference_title: KMT2B-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although use of anti-dystonic agents (levodopa and other agents) has not
      resulted in long-term benefit for most individuals, a trial of these agents
      would be considered reasonable.
    explanation: Supports the recommendation to trial levodopa.
  - reference: PMID:29697234
    reference_title: KMT2B-Related Disorders.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although use of anti-dystonic agents (levodopa and other agents) has not
      resulted in long-term benefit for most individuals, a trial of these agents
      would be considered reasonable.
    explanation: >-
      The same sentence refutes sustained levodopa efficacy, which is the claim a
      reader coming from dopa-responsive dystonia would otherwise assume.
discussions:
- discussion_id: kmt2b_effector_genes
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which KMT2B target genes, in which neurons, translate genome-wide promoter
    hypermethylation into dystonia rather than into a purely neurodevelopmental
    phenotype?
  attaches_to:
  - pathophysiology#Transcriptional Dysregulation at KMT2B Target Loci
  rationale: >-
    The chain from KMT2B haploinsufficiency to broad transcriptional
    dysregulation is measured directly in patients, and the circuit endpoint is
    inferred from deep brain stimulation response and from the pallidal imaging
    sign, but nothing connects the two. No patient-derived,
    cell-type-resolved transcriptomic dataset for striatal neurons was identified,
    so the step from a genome-wide epigenetic lesion to a motor-specific
    phenotype is currently an unknown-intermediates edge. This is what would have
    to be closed before any disease-modifying therapy could be targeted upstream
    of the pallidum.
- discussion_id: kmt2b_dystonic_vs_ndd_branch
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    What determines whether a KMT2B variant carrier develops dystonia, an
    isolated neurodevelopmental or growth phenotype, or nothing at all?
  attaches_to:
  - pathophysiology#Pallidal Motor Circuit Dysfunction
  - inheritance#Autosomal dominant
  rationale: >-
    Relatives carrying the identical variant diverge between generalized
    dystonia, isolated short stature or intellectual disability, and clinically
    asymptomatic carriage, and the Arg2565 hotspot spans that whole range on one
    codon. Variant class predicts onset age and systemic burden but not this
    branch, so the determinant is neither the allele alone nor a described
    modifier locus. Until it is identified, predictive testing in a family cannot
    say what an at-risk carrier will actually develop.
progression:
- phase: Long-term survival
  age_range: Adulthood
  notes: >-
    Formal survival statistics have not been published. What is documented is
    that the disorder is not classically fatal and that affected individuals have
    been reported living into the seventh decade, against a background of
    progressive motor and bulbar disability rather than early mortality.
  evidence:
  - reference: PMID:29697234
    reference_title: KMT2B-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Life expectancy is not known; however, individuals in the seventh decade of
      life have been reported.
    explanation: >-
      The only life-expectancy statement available, and it is explicitly an
      absence of data rather than an estimate.
notes: >-
  OMIM codes the two KMT2B phenotypes separately: 617284 for childhood-onset
  dystonia 28, the entity this file curates, and 619934 for intellectual
  developmental disorder, autosomal dominant 68, the non-dystonic
  neurodevelopmental presentation, which is out of scope here. They are recorded
  in prose because the mappings slot admits only ICD10CM, ICD11F, MONDO and
  NCIT. Note also that the MONDO label anchoring this entry says
  "childhood-onset" while the entry's scope is gene-wide and includes an
  adult-onset subtype; MONDO has no gene-level KMT2B term to anchor to instead.

  evidence:
  - reference: PMID:27839873
    reference_title: Haploinsufficiency of KMT2B, Encoding the Lysine-Specific Histone Methyltransferase 2B, Results in Early-Onset Generalized Dystonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, we provide evidence for a causative role of disordered histone
      modification, chromatin states, and transcriptional deregulation in dystonia
      pathogenesis.
    explanation: >-
      Supports transcriptional deregulation, rather than a signalling defect, as
      the mechanism linking the chromatin lesion to dystonia.
- name: Pallidal Motor Circuit Dysfunction
  description: >-
    Transcriptional dysregulation disturbs basal-ganglia motor output at the
    level of pallidal outflow. The circuit-level location of the lesion is
    inferred clinically rather than molecularly: no cell-type-resolved patient
    data localize it. Two independent lines of clinical evidence point at the
    pallidum — the substantial and sustained response to bilateral globus
    pallidus internus deep brain stimulation, and the symmetrical hypointense
    streaks reported on MRI in about a quarter of published cases. Neither is
    decisive alone, and they do not agree on segment: the imaging sign is in the
    external pallidum while stimulation targets the internal.
  notes: >-
    Named for the pallidum alone, and left without a cell-type binding, because
    that is as far as the evidence reaches. Striatal medium spiny neurons are the
    usual candidate by circuit logic and by the choice of DBS target, but nothing
    cited here reports striatal or cell-type-resolved data in KMT2B variant
    carriers, so binding CL:1001474 would assert a localization no source makes.
    The imaging corroboration is real but weak: the sign is absent in roughly
    three quarters of published cases and was absent throughout the one cohort
    that looked for it prospectively.
  biological_scale: TISSUE
  downstream:
  - target: Ascending Generalization of Dystonic Posturing
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:27992417
    reference_title: Mutations in the histone methyltransferase gene KMT2B cause complex early-onset dystonia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings highlight a clinically recognizable and potentially treatable
      form of genetic dystonia, demonstrating the crucial role of KMT2B in the
      physiological control of voluntary movement.
    explanation: >-
      Supports KMT2B loss acting on motor-control circuitry. The sentence names
      no anatomy, so its bearing on a specifically pallidal node is inferential.
  - reference: PMID:27992417
    reference_title: Mutations in the histone methyltransferase gene KMT2B cause complex early-onset dystonia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Marked clinical benefit, including the restoration of independent
      ambulation in some cases, was observed following deep brain stimulation
      (DBS).
    explanation: >-
      Response to pallidal stimulation localizes an actionable node to this
      circuit; the inference from therapeutic response to lesion site is why this
      is graded INDIRECT.
- name: Ascending Generalization of Dystonic Posturing
  description: >-
    Abnormal basal-ganglia output produces sustained co-contraction of agonist
    and antagonist muscles. The disorder characteristically starts focally in a
    lower limb during early childhood, then spreads caudocranially to trunk,
    upper limbs, neck, oromandibular musculature and larynx. This rostral
    progression is the clinical signature of the disease and generates the bulbar
    and speech burden that dominates long-term disability.
  biological_scale: ORGANISM
  downstream:
  - target: Generalized dystonia
    causal_link_type: DIRECT
  - target: Cervical dystonia
    causal_link_type: DIRECT
  - target: Oromandibular dystonia
    causal_link_type: DIRECT

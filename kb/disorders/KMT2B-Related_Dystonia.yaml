    reference_title: "KMT2B-related disorders: expansion of the phenotypic spectrum and long-term efficacy of deep brain stimulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key characteristics of typical disease include focal motor features at
      disease presentation, evolving through a caudocranial pattern into
      generalized dystonia, with prominent oromandibular, laryngeal and cervical
      involvement.
    explanation: Describes the caudocranial ascent this node represents.
  - reference: PMID:31216378
    reference_title: "Frequency and phenotypic spectrum of KMT2B dystonia in childhood: A single-center cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 78.5% of cases, dystonia involved the lower limbs at onset, with later
      caudocranial generalization.
    explanation: Quantifies lower-limb onset followed by caudocranial generalization.
imaging_findings:
- name: Symmetrical hypointense lateral streaks in the external globus pallidus
  modality: MRI
  imaging_finding_term:
    preferred_term: Abnormal globus pallidus morphology
    term:
      id: HP:0002453
      label: Abnormal globus pallidus morphology
  located_in:
    preferred_term: external globus pallidus
    term:
      id: UBERON:0002476
      label: lateral globus pallidus
  laterality: BILATERAL
  diagnostic: false
  description: >-
    Subtle, symmetrical hypointense lateral streaks in the external globus
    pallidus on T2-weighted and susceptibility-sensitive sequences, reported in
    roughly a quarter of published cases and treated as a feature of the disease.
    It is the one structural correlate described for KMT2B-related dystonia, and
    it is anatomically independent of the therapeutic evidence, which is what
    makes it worth recording even though it is neither sensitive nor required for
    diagnosis.
  notes: >-
    Recorded with its negative alongside it. The same cohort that reports the
    ~27% literature figure saw no indicative MRI abnormality in any of its own
    nine patients, and attributes that to the sign being age-dependent and often
    absent in adults. A normal MRI therefore argues nothing. Note also that the
    streaks are in the external segment while deep brain stimulation targets the
    internal segment, so this corroborates pallidal involvement without
    confirming that the internal segment is where the lesion sits.
  evidence:
  - reference: PMID:41738007
    reference_title: "KMT2B-related disorders in Austria: clinical features and long-term outcome after deep brain stimulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain MRI in ~27% of the patients with DYT-KMT2B in the literature showed
      abnormalities considered features of the disease (subtle and symmetrical
      hypointense lateral streaks in the external globus pallidus).
    explanation: >-
      Names the imaging sign and its published frequency, and treats it as a
      feature of the disease rather than an incidental finding.
  - reference: PMID:41738007
    reference_title: "KMT2B-related disorders in Austria: clinical features and long-term outcome after deep brain stimulation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We did not see any indicative MRI-abnormalities in our cohort. This may be
      explained by the observed age-dependency of these MRI changes which may
      become less prominent over time and are often not evident in adults.
    explanation: >-
      The same paper reports the sign absent throughout its own cohort, which

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population-based prevalence or incidence estimate exists. What is
    available is a diagnostic yield in selected cohorts — KMT2B variants in
    21.5% of childhood-onset dystonia patients already negative for other
    dystonia genes — which is a testing statistic, not an occurrence rate, and is
    recorded on the genetic entry rather than converted into a rate here.
  evidence:
  - reference: PMID:41738007
    reference_title: "KMT2B-related disorders in Austria: clinical features and long-term outcome after deep brain stimulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since its initial description in 2016, DYT-KMT2B has emerged as one of the
      most common genetic causes of early-onset dystonia.
    explanation: >-
      Establishes relative importance among monogenic early-onset dystonias
      without supplying a population rate, which is the state of the evidence.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    KMT2B-related dystonia is autosomal dominant with incomplete penetrance and
    variable expressivity: relatives carrying the same variant may present with
    generalized dystonia, with short stature or intellectual disability alone, or
    remain asymptomatic. Most probands carry a de novo
    variant, but inherited variants occur and a transmitting parent may be mildly
    affected or clinically asymptomatic, so reduced penetrance and variable
    expressivity must be assumed when counselling families.
  evidence:
  - reference: PMID:29697234
    reference_title: KMT2B-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DYT-KMT2B and KMT2B-related NDD are autosomal dominant disorders.
    explanation: GeneReviews states the mode of inheritance for KMT2B-related dystonia.
  - reference: PMID:29697234
    reference_title: KMT2B-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of individuals reported to date with a KMT2B-related disorder
      whose parents have undergone molecular genetic testing have the disorder as
      a result of a de novo genetic alteration.
    explanation: Supports the predominantly de novo origin of the causal variant.
  - reference: PMID:31216378
    reference_title: "Frequency and phenotypic spectrum of KMT2B dystonia in childhood: A single-center cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also report on 4 asymptomatic carriers, suggesting that some KMT2B
      mutations may be associated with incomplete disease penetrance.
    explanation: >-
      Directly evidences incomplete penetrance, which is why an apparently
      unaffected parent cannot be assumed to be a non-carrier.
  - reference: PMID:31216378
    reference_title: "Frequency and phenotypic spectrum of KMT2B dystonia in childhood: A single-center cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed a spectrum of clinical manifestations in KMT2B variant carriers,
      ranging from generalized dystonia to short stature or intellectual
      disability alone, even within the same family.
    explanation: Documents the intrafamilial variable expressivity recorded above.
  - reference: PMID:29697234
    reference_title: KMT2B-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each child of an individual with a KMT2B-related disorder has a 50% chance
      of inheriting the genetic alteration. Once the KMT2B pathogenic variant or
      deletion of 19q13.12 involving KMT2B has been identified in an affected
      family member, prenatal and preimplantation genetic testing are possible.
    explanation: >-
      The transmission risk and the availability of prenatal and preimplantation
      testing once the familial variant is known — the two facts a counselling
      conversation turns on.
has_subtypes:
- name: Adult-onset
  display_name: Adult-onset focal or segmental DYT-KMT2B
  review_notes: >-
    Left without a subtype_term deliberately. MONDO has no term for adult-onset
    KMT2B-related dystonia; the nearest candidate, MONDO:0100015 adult-onset
    segmental dystonia, is a clinical category rather than a KMT2B entity, so
    binding it would drop the gene identity and admit unrelated cases. Bind a
    term here if MONDO later mints one.
  description: >-
    A milder, later-onset form presenting in adulthood as focal or segmental
    dystonia — blepharospasm, cervical dystonia, writer's cramp or spasmodic
    dysphonia — usually without the developmental delay of the classic
    childhood-onset disease. It is not simply a late presentation of the same
    process: on genome-wide methylation profiling the adult-onset cases cluster
    with controls rather than with early-onset DYT-KMT2B, and the probes that do
    distinguish them do not overlap the early-onset episignature, which the
    authors read as a different molecular mechanism. This entry's
    pathophysiology chain is therefore not asserted to apply to the subtype.
    Two of the four missense alleles involved (p.S640T, p.R2339Q) are described
    by the reporting authors as lacking segregation proof, so the subtype rests
    on a smaller evidence base than the childhood-onset disease.
  evidence:
  - reference: PMID:36483457
    reference_title: Adult-onset KMT2B-related dystonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven affected subjects presented with adult-onset focal or segmental
      dystonia, three developed isolated progressive hearing loss, and one
      displayed intellectual disability and short stature.
    explanation: Establishes the adult-onset focal/segmental presentation as a distinct subtype.
  - reference: PMID:36483457
    reference_title: Adult-onset KMT2B-related dystonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genome-wide DNA methylation profiling allowed to discriminate these
      adult-onset dystonia cases from controls and early-onset DYT-KMT2B patients.
    explanation: >-
      Supports treating adult-onset disease as separable from the classic form
      rather than as the same entity presenting late.
  - reference: PMID:36483457
    reference_title: Adult-onset KMT2B-related dystonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These specific probes did not overlap with early-onset DYT-KMT2B
      episignature, suggesting a different molecular mechanism underlying this
      late-onset phenotype.
    explanation: >-
      States directly that the adult-onset signature does not overlap the
      early-onset one and implies a different mechanism, which is why this entry
      does not extend its causal chain to the subtype.
  - reference: PMID:36483457
    reference_title: Adult-onset KMT2B-related dystonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in particular, at the current time, the p.S640T and p.R2339Q lack proof of
      disease segregation and need additional evidence to support their
      pathogenicity
    explanation: >-
      The reporting authors' own caveat on two of the four alleles underpinning
      this subtype.
pathophysiology:
- name: KMT2B Haploinsufficiency
  description: >-
    Heterozygous loss-of-function variants in KMT2B, or heterozygous deletions of
    19q13.11-19q13.12 that remove one copy of the gene, halve the dose of the
    KMT2B histone methyltransferase. Truncating alleles introduce a premature
    termination codon and reduce KMT2B transcript in patient fibroblasts;
    microdeletion carriers show the same dystonic presentation, which is the
    independent argument that gene dosage rather than a mutant protein product is
    the lesion. Missense alleles are presumed to act by the same route, but for
    those the haploinsufficiency claim is inferred rather than measured.
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component Haploinsufficiency"
  biological_scale: MOLECULAR
  genes:
  - preferred_term: KMT2B
    term:
      id: hgnc:15840
      label: KMT2B
  molecular_functions:
  - preferred_term: histone H3K4 methyltransferase activity
    term:
      id: GO:0042800
      label: histone H3K4 methyltransferase activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Promoter DNA Hypermethylation
    causal_link_type: DIRECT
    description: >-
      Drawn from the haploinsufficiency node rather than from the reduced-mark
      node because the barrier function KMT2B provides against repressive
      machinery is reported to be independent of its methyltransferase
      catalysis: what is lost is protein occupancy, not the mark.
  - target: Reduced H3K4 Methylation at Target Promoters
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27839873
      reference_title: Haploinsufficiency of KMT2B, Encoding the Lysine-Specific Histone Methyltransferase 2B, Results in Early-Onset Generalized Dystonia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        Our findings thus establish generalized dystonia as the human phenotype
        associated with haploinsufficiency of KMT2B.
      explanation: >-
        Establishes haploinsufficiency as the disease-initiating lesion. The step
        to a reduced H3K4 mark follows from KMT2B's enzyme identity rather than
        from this genotype-phenotype statement, hence INDIRECT.
  evidence:
  - reference: PMID:27839873
    reference_title: Haploinsufficiency of KMT2B, Encoding the Lysine-Specific Histone Methyltransferase 2B, Results in Early-Onset Generalized Dystonia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Suggestive of haploinsufficiency, we found significantly decreased total
      mRNA levels of KMT2B in mutant fibroblasts.
    explanation: >-
      Patient-derived fibroblasts show the reduced KMT2B transcript dose that this
      node asserts.
  - reference: PMID:27839873
    reference_title: Haploinsufficiency of KMT2B, Encoding the Lysine-Specific Histone Methyltransferase 2B, Results in Early-Onset Generalized Dystonia.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Each of the four mutations was predicted to mediate a loss-of-function
      effect by introducing a premature termination codon.
    explanation: >-
      In-silico consequence prediction for the founding alleles; graded
      COMPUTATIONAL because the sentence reports a prediction, not a measurement.
      The measured half of the claim is the fibroblast transcript result above.
  - reference: PMID:27839873
    reference_title: Haploinsufficiency of KMT2B, Encoding the Lysine-Specific Histone Methyltransferase 2B, Results in Early-Onset Generalized Dystonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Independent support for pathogenicity of the mutations comes from the
      observation of high rates of dystonic presentations in KMT2B-involving
      microdeletion syndromes.
    explanation: >-
      Whole-gene deletions producing the same phenotype is the dosage argument
      that distinguishes haploinsufficiency from a dominant-negative mechanism.
  - reference: PMID:29697234
    reference_title: KMT2B-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of a KMT2B-related disorder is established in a proband with
      suggestive findings and either of the following identified by molecular
      genetic testing: a heterozygous pathogenic variant involving KMT2B (~88% of
      affected individuals) or a heterozygous deletion of 19q13.11-19q13.12
      involving KMT2B (~12% of affected individuals).
    explanation: Quantifies the two lesion classes that converge on reduced KMT2B dose.
- name: Reduced H3K4 Methylation at Target Promoters
  description: >-
    KMT2B is one of the SET1/MLL-family enzymes that deposit methyl marks on
    histone H3 lysine 4 at promoters and enhancers. Reduced enzyme dose lowers
    H3K4 methylation across the loci KMT2B normally licenses, changing chromatin
    state rather than deleting any single downstream gene. Note that the loss of
    the activating mark is only half the lesion: the same loss of KMT2B occupancy
    also removes a barrier to repressive machinery, and that arm is drawn as a
    parallel branch from the haploinsufficiency node rather than from here.
  notes: >-
    The reduction in H3K4 methylation is inferred from enzyme identity and gene
    dosage, not measured in patients or patient tissue. No cited reference
    quantifies the mark in KMT2B variant carriers, which is why the incoming
    edge is graded INDIRECT and why the adjacent hypermethylation node — which
    is measured — carries the weight of the chain.
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin State Imbalance"
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: DECREASED
  downstream:
  - target: Transcriptional Dysregulation at KMT2B Target Loci
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34380541
    reference_title: Childhood-onset dystonia-causing KMT2B variants result in a distinctive genomic hypermethylation profile.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous variants in lysine methyltransferase 2B (KMT2B), encoding a
      histone H3 methyltransferase, have been associated with a childhood-onset,
      progressive and complex form of dystonia (dystonia 28, DYT28).
    explanation: Establishes KMT2B as the histone H3 methyltransferase whose activity this node describes.
- name: Promoter DNA Hypermethylation
  description: >-
    KMT2B haploinsufficiency produces non-random genome-wide DNA
    hypermethylation that is selectively enriched at promoters and other
    positively acting regulatory elements. This is the one step in the chain
    measured directly in patients rather than inferred: the pattern is
    reproducible enough in peripheral blood to serve as a diagnostic
    episignature, which is also why it can reclassify variants of uncertain
    significance.
  notes: >-
    The mechanism usually offered for this step — that loss of KMT2B occupancy
    lets DNA methyltransferases and Polycomb machinery act at loci they would
    normally be excluded from — comes from mouse embryonic stem cell work and
    has not been shown in human neurons or patient tissue. It is therefore left
    out of the description rather than asserted as human mechanism; what is
    curated here is the measured hypermethylation, not its proposed cause. No
    current GO biological-process term fits: GO has obsoleted histone H3-K4
    methylation, histone lysine methylation and DNA methylation alike, so the
    node is left without a process annotation rather than reusing the generic
    chromatin-organization term already carried by the adjacent node.
  biological_scale: MOLECULAR
  downstream:
  - target: Transcriptional Dysregulation at KMT2B Target Loci
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34380541
    reference_title: Childhood-onset dystonia-causing KMT2B variants result in a distinctive genomic hypermethylation profile.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, defective KMT2B function in DYT28 causes a non-random DNA
      hypermethylation across the genome, selectively involving promoters and
      other regulatory regions positively controlling gene expression.
    explanation: >-
      Directly supports promoter-enriched DNA hypermethylation as a measured
      consequence of KMT2B dysfunction in patients.
- name: Transcriptional Dysregulation at KMT2B Target Loci
  description: >-
    Loss of the activating H3K4 mark together with gain of promoter DNA
    methylation disturbs transcription at a broad set of KMT2B target loci,
    including neurodevelopmental and neuronal-identity programs. Which of those
    targets actually drives the dystonic phenotype is not established, and this
    is the weakest link in the chain — the epigenetic lesion is well
    characterized while its motor-specific effectors are not.
  notes: >-
    The node deliberately claims dysregulation rather than repression. The
    chromatin changes are individually repressive, and repression is the usual
    reading, but no patient transcriptomic data were found for this disorder and
    the cited sources say "transcriptional deregulation" without a direction, so
    the modifier is ABNORMAL rather than DECREASED.
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Dysregulated Neurodevelopmental Transcriptional Program"
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
  downstream:
  - target: Pallidal Motor Circuit Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

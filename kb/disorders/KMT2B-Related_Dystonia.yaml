name: KMT2B-Related Dystonia
creation_date: "2026-09-04T04:30:00Z"
category: Mendelian
description: >-
  KMT2B-related dystonia (DYT-KMT2B, dystonia 28) is a childhood-onset,
  progressive, generalized dystonia caused by heterozygous loss-of-function
  variants in KMT2B or by heterozygous 19q13.11-19q13.12 deletions encompassing
  the gene. KMT2B encodes a histone H3 lysine 4 (H3K4) methyltransferase, so
  haploinsufficiency both removes an activating chromatin mark and permits
  aberrant, non-random DNA hypermethylation at promoters and other positive
  regulatory elements. The result is broad transcriptional dysregulation at
  KMT2B target loci rather than failure of any single effector pathway; no
  patient transcriptomic data establish the direction of that change, so the
  entry does not claim one. Dystonia characteristically begins as a
  focal lower-limb disorder in early childhood and ascends in a caudocranial
  pattern to a generalized form with prominent cervical, oromandibular and
  laryngeal involvement, producing dysarthria, hypophonia and bulbar dysfunction.
  Most affected individuals also have developmental delay or intellectual
  disability, short stature, additional movement disorders, and neurobehavioral
  features; a milder adult-onset focal or segmental form and a non-dystonic
  neurodevelopmental presentation are both recognized. Oral antimuscarinic agents
  help about half of individuals, and bilateral deep brain stimulation of the
  globus pallidus internus produces substantial, long-lasting motor improvement,
  making this one of the more treatable monogenic dystonias — though laryngeal
  dystonia and gait respond poorly and are the residual burden.
synonyms:
- DYT-KMT2B
- DYT28
- dystonia 28, childhood-onset
- KMT2B dystonic disorder
- complex childhood-onset dystonia due to KMT2B mutation

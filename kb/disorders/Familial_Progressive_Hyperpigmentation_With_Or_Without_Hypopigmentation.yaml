    reference_title: Identification of a novel mutation in the KITLG gene
      in a Chinese family with familial progressive hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: hyperpigmented lesions that are intermixed with multiple café-au-lait spots, hypopigmented
      maculae and lentigines that are located on the face, neck, trunk and limbs and frequently
      on the palms, soles and oral mucosa
    explanation: The anatomical distribution, including acral and mucosal involvement.
- name: Somatic Reversion of the KITLG Locus in Skin
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    A candidate explanation for the hypopigmented component, and one that would make the
    "hypo" in the disease name a misnomer. In a patient with hypopigmented macules and striae
    distributed along the lines of Blaschko, digital PCR found copy-neutral loss of
    heterozygosity at the KITLG locus in DNA from the pale lesion but not in blood -
    consistent with clones that lost the mutant allele, reverted to ordinary KITLG-KIT
    signalling, and appear pale only by contrast with the surrounding hyperpigmented skin.
    Blaschko-linear distribution is the expected pattern for a clonal somatic event in
    keratinocyte or melanocyte lineages, which is what makes the observation more than a
    coincidence.

    Graded HYPOTHETICAL: this is a single patient carrying a single allele, and the
    cafe-au-lait macules in the same individual did not follow Blaschko lines and superimposed
    on the hypopigmented striae, so they require a separate mechanism this one does not
    supply. The general question is explicitly open in the literature.
  cell_types:
  - preferred_term: epidermal melanocyte
    term:
      id: CL:2000000
      label: epidermal melanocyte
  downstream:
  - target: Hypopigmented Macules and Streaks
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:39269165
    reference_title: A case of familial progressive hyperpigmentation with or without hypopigmentation
      presenting with hypopigmented striae along the lines of Blaschko.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Digital polymerase chain reaction analysis of the DNA from skin and blood tissues
      indicated a copy-neutral loss of heterozygosity at the KITLG locus, only in the hypopigmented
      macule. These findings suggest that the hypopigmented macules might result from revertant
      mosaicism.
    explanation: The lesion-restricted copy-neutral LOH and the revertant-mosaicism interpretation
      drawn from it.
  - reference: PMID:39269165
    reference_title: A case of familial progressive hyperpigmentation with or without hypopigmentation
      presenting with hypopigmented striae along the lines of Blaschko.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Conversely, café-au-lait spots do not follow the lines of Blaschko and can superimpose
      on the hypopigmented striae, indicating a distinct pathogenesis.
    explanation: The authors' own limitation - reversion explains the pale macules but not the
      cafe-au-lait macules, so it is not a unified account of the dyspigmentation.
  - reference: PMID:39269165
    reference_title: A case of familial progressive hyperpigmentation with or without hypopigmentation
      presenting with hypopigmented striae along the lines of Blaschko.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: However, the mechanisms behind hypopigmented macule formation remain unclear.
    explanation: States that the hypopigmentation mechanism is unresolved, which is why this
      node is graded HYPOTHETICAL rather than LIKELY.
phenotypes:

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous KITLG variants segregate with the phenotype through multi-generation
    pedigrees; the founding report followed a six-generation Chinese family. Penetrance has
    been described as reduced, and de novo cases occur - one exon-4 variant was shown to be
    de novo, and a sporadic patient with unaffected parents has been reported carrying the
    recurrent p.Thr34Ile allele.
  evidence:
  - reference: PMID:19375057
    reference_title: Gain-of-function mutation of KIT ligand on melanin synthesis causes familial
      progressive hyperpigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This mutant "G" allele cosegregated perfectly with affected, but not with unaffected,
      members of the FPH family.
    explanation: Cosegregation of the heterozygous KITLG allele with affected status across
      a six-generation pedigree, which is the dominant-inheritance evidence.
  - reference: PMID:21368769
    reference_title: KITLG mutations cause familial progressive hyper- and hypopigmentation.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Familial progressive hyper- and hypopigmentation (FPHH) is thought to be an autosomal
      dominant disorder with reduced penetrance.
    explanation: States the dominant mode and flags reduced penetrance; graded PARTIAL because
      the sentence reports the prevailing view rather than a penetrance measurement.
pathophysiology:
- name: KITLG Gain-of-Function Variant in the Receptor-Binding Motif
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    A heterozygous missense substitution in KITLG, almost always within the conserved VTNNV
    motif spanning amino acids 33-37 in exon 2. The motif lies on a conserved beta-strand
    that forms the interface with the KIT receptor, so a substitution there alters the
    ligand-receptor contact rather than destabilising the protein. Reported alleles include
    p.Val33Ala, p.Thr34Pro, p.Thr34Ile, p.Asn35Ile, p.Asn35Lys, and p.Asn36Ser. Alleles
    outside the motif are also reported: p.Glu113Lys (c.337G>A, exon 4), described as lying at
    a different ligand-receptor interaction site; p.Ser78Leu, reported as novel with no stated
    structural interpretation; and a pair of exon-4 substitutions at c.329A.
  genetic_context:
    gene:
      preferred_term: KITLG
      term:
        id: hgnc:6343
        label: KITLG
    functional_impact_category: GAIN_OF_FUNCTION
    allele_type: missense
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  molecular_functions:

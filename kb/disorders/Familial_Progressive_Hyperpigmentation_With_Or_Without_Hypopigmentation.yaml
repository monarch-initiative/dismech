    causal_link_type: DIRECT
  - target: Somatic Reversion of the KITLG Locus in Skin
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reversion is loss of this germline allele in a somatic clone, so the variant is what
      the reversion event acts on. The intermediates - what triggers mitotic recombination
      at this locus, and why it appears to happen often enough to be visible - are unknown.
  evidence:
  - reference: PMID:19375057
    reference_title: Gain-of-function mutation of KIT ligand on melanin synthesis causes familial
      progressive hyperpigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutation profiling of positional candidate genes detected a heterozygous transversion
      (c. 107A-->G) in exon 2 of the KIT ligand (KITLG) gene, predicted to result in the substitution
      of a serine residue for an asparagine residue at codon 36 (p.N-->S).
    explanation: The founding variant, identified by positional cloning after linkage to 12q21.31-q23.1.
  - reference: PMID:33407466
    reference_title: Identification of a novel mutation in the KITLG gene
      in a Chinese family with familial progressive hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most of the FPHH-causing mutations in KITLG are clustered within the conserved
      VTNNV motif (amino acids 33–37) in exon 2, and a mutated VTNNV domain may increase the
      affinity of KITLG to the c-Kit receptor, suggesting that the mutation causes a downstream
      gain-of-function effect.
    explanation: Locates the mutational hotspot. Note the source's own hedging - the affinity
      increase is offered as what a mutated motif "may" do, on the basis of homology modelling,
      not as a measured binding result.
  - reference: PMID:21368769
    reference_title: KITLG mutations cause familial progressive hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All three mutations were located in a conserved β-strand in KITLG, suggesting
      its important role in the activation of the KITLG receptor c-Kit.
    explanation: Independent confirmation that the FPHH alleles cluster on the conserved receptor-contact
      beta-strand.
  - reference: PMID:32189379
    reference_title: Novel mutation in the KITLG gene in familial progressive hyperpigmentation
      with or without hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We have now identified a novel KITLG mutation, c.337G>A (p.Glu113Lys), in FPHH
      which is located within another ligand-receptor interaction site.
    explanation: Establishes that pathogenic alleles are not confined to the VTNNV motif but
      do remain at ligand-receptor contact surfaces.
- name: Enhanced KITLG-KIT Signaling in Epidermal Melanocytes
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Keratinocyte-derived KITLG binds KIT on neighbouring epidermal melanocytes, dimerising
    the receptor and activating its tyrosine kinase. That this axis is rate-limiting for
    epidermal pigment is well supported: adding soluble KITLG to grafted human skin darkens it,
    and blocking either KITLG or KIT depletes melanocytes.

    What is not established is the step this node names. The proposal is that the mutant ligand
    engages KIT more effectively than wild type, and the sources state it as a possibility
    rather than a finding - the affinity increase is inferred from homology modelling of the
    substituted residues, and no binding assay, receptor phosphorylation measurement, or
    dose-response comparison of mutant against wild-type ligand has been published. Every
    functional experiment in this literature reads out melanin or transcription downstream, not
    receptor engagement itself. The node is graded PROVISIONAL for that reason, and the evidence
    attached below characterises the wild-type axis rather than the mutant's behaviour on it.
  biological_processes:
  - preferred_term: Kit signaling pathway
    modifier: INCREASED
    term:
      id: GO:0038109
      label: Kit signaling pathway
  cell_types:
  - preferred_term: epidermal melanocyte
    term:
      id: CL:2000000
      label: epidermal melanocyte
  downstream:
  - target: Upregulated MITF-Driven Melanogenic Transcription
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39269165
    reference_title: A case of familial progressive hyperpigmentation with or without hypopigmentation
      presenting with hypopigmented striae along the lines of Blaschko.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: KITLG, expressed by keratinocytes, binds to KIT on melanocytes, stimulating melanogenesis.
      Disturbances in the KITLG-KIT interaction result in diffuse hyperpigmentation in FPHH.
    explanation: States the cell-to-cell signalling axis and attributes the diffuse hyperpigmentation
      to its disturbance.
  - reference: PMID:33407466
    reference_title: Identification of a novel mutation in the KITLG gene
      in a Chinese family with familial progressive hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: By KITLG binding, KIT dimerizes and initiates diverse cellular responses and plays
      a crucial role in the development and maintenance of the melanocyte lineage in adult
      skin.
    explanation: The receptor-activation step and its role in maintaining the adult epidermal
      melanocyte lineage.
  - reference: PMID:33407466
    reference_title: Identification of a novel mutation in the KITLG gene
      in a Chinese family with familial progressive hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Injection of the soluble form of sKITLG resulted in hyperpigmentation of the grafted
      skin tissue, while injection of the KIT- or KITLG-blocking antibodies into the explanted
      human skin led to a loss of melanocytes
    explanation: Reciprocal gain and loss experiments showing the axis is rate-limiting for
      epidermal pigmentation. Two caveats - the review is summarising work it cites rather than
      reporting its own data, and the gain-of-pigment arm used human skin grafted onto a host
      animal, which is why this is graded MODEL_ORGANISM rather than IN_VITRO.
- name: Upregulated MITF-Driven Melanogenic Transcription
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Downstream of the strengthened KIT signal the melanocyte's melanogenic transcriptional
    program is upregulated, with MITF - the master regulator of the melanocyte lineage and of
    the pigment-synthesis genes it controls - the most prominently affected node. This step
    is graded LIKELY rather than ESTABLISHED because the transcriptomic evidence comes from
    one base-edited cell model of one exon-4 allele, not from patient melanocytes or from the
    common VTNNV-motif alleles.
  biological_processes:
  - preferred_term: positive regulation of melanin biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0048023
      label: positive regulation of melanin biosynthetic process
  cell_types:
  - preferred_term: epidermal melanocyte
    term:
      id: CL:2000000
      label: epidermal melanocyte
  downstream:
  - target: Increased Tyrosinase Activity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41779177
    reference_title: New variant in KITLG shapes the pathogenesis of familial progressive hyper-
      and hypo-pigmentation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: For de novo c.329 A > G mutation, results showed that the mutation broadly affected
      the transcription and translation of genes responsible for melanin synthesis, especially
      the melanin gene MITF.
    explanation: RNA-sequencing of a base-edited cell model showing the mutant allele reshapes
      melanin-synthesis gene expression with MITF most affected.
- name: Increased Tyrosinase Activity
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    The rate-limiting enzyme of melanogenesis runs faster. Tyrosinase activity was
    significantly higher in cells exposed to the mutant soluble ligand than in cells exposed
    to wild type. Graded PROVISIONAL rather than ESTABLISHED: this is one 2009 experiment on
    one allele, and it was done by adding recombinant soluble ligand to A375 melanoma cells
    rather than in melanocytes expressing the variant from its own locus, so the measurement
    stands but has not been independently reproduced or shown in a physiological cell context.
  molecular_functions:
  - preferred_term: tyrosinase activity
    modifier: INCREASED
    term:
      id: GO:0004503
      label: tyrosinase activity
  cell_types:
  - preferred_term: epidermal melanocyte
    term:
      id: CL:2000000
      label: epidermal melanocyte
  downstream:
  - target: Increased Melanocyte Melanin Content
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:19375057
    reference_title: Gain-of-function mutation of KIT ligand on melanin synthesis causes familial
      progressive hyperpigmentation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Consistent with this result, the tyrosinase activity was significantly increased
      by mutant sKITLGN36S compared to wild-type control.
    explanation: The enzymatic measurement - tyrosinase is the rate-limiting step the increased
      melanin flux passes through.
- name: Increased Melanocyte Melanin Content
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    The melanocyte accumulates more pigment. Melanin content roughly doubled in cells exposed
    to the mutant ligand relative to wild type, which is the closest thing in this literature
    to a direct functional demonstration that the variant is a gain of function on melanin
    synthesis rather than a rare allele that merely segregates. It carries the same caveat as
    the tyrosinase measurement above - one paper, one allele, exogenous ligand on a melanoma
    line - which is why it is PROVISIONAL.
  biological_processes:
  - preferred_term: melanin biosynthetic process
    modifier: INCREASED
    term:

    snippet: the patient showed multiple hypopigmented macules and striae along the lines of
      Blaschko
    explanation: Documents both the discrete macules and the Blaschko-linear striae.
- category: Dermatologic
  name: Cafe-au-lait Macules
  description: >-
    Multiple cafe-au-lait macules superimposed on the hyperpigmented background. Their
    presence is the main reason FPHH is confused with neurofibromatosis type 1 and with
    Legius syndrome, and in the one patient studied for it they did not share the
    Blaschko-linear distribution of the pale lesions, implying a separate pathogenesis.
  phenotype_term:
    preferred_term: Cafe-au-lait spot
    term:
      id: HP:0000957
      label: Cafe-au-lait spot
  evidence:
  - reference: PMID:21368769
    reference_title: KITLG mutations cause familial progressive hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: multiple café-au-lait spots, intermingled with scattered hypopigmented-appearing
      maculae, and lentigines
    explanation: Cafe-au-lait macules as a described component of the FPHH phenotype.
  - reference: PMID:39152874
    reference_title: A novel KITLG mutation causes familial progressive hyperpigmentation and
      hypopigmentation with multiple café-au-lait macules.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: On examination, multiple diffuse lentigines were observed on his face, trunk, and
      extremities, accompanied by multiple CALMs and scattered hypopigmented macules of varying
      sizes
    explanation: A single-patient examination finding recording cafe-au-lait macules alongside
      lentigines and hypopigmented macules, and their appearance after the initial hyperpigmentation.
- category: Dermatologic
  name: Lentigines
  description: >-
    Small, sharply demarcated dark macules scattered among the other lesions. The one source
    that ranks the lesions puts lentigines ahead of cafe-au-lait macules, which it calls only
    sometimes present; neither is quantified, so no frequency band is asserted here.
  phenotype_term:
    preferred_term: Multiple lentigines
    term:
      id: HP:0001003
      label: Multiple lentigines
  evidence:
  - reference: PMID:33407466
    reference_title: Identification of a novel mutation in the KITLG gene
      in a Chinese family with familial progressive hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: hypopigmented spots, lentigines and sometimes Cafe-au-lait spots (CALs)
    explanation: Lentigines listed among the characteristic lesions, with cafe-au-lait macules
      noted as only sometimes present.
- category: Dermatologic
  name: Oral Mucosal Pigmentation
  description: >-
    Pigmentation of the oral mucosa alongside the cutaneous lesions. It is the feature most
    likely to bring a patient to a dentist rather than a dermatologist, and its presence is
    part of why Peutz-Jeghers syndrome and Addison disease sit in the differential. No
    frequency band is given: the KITLG series describe mucosal involvement as frequent while
    the same paper reports a pedigree with no mucosal disease, and there is no denominator
    anywhere in this literature to adjudicate between them.
  phenotype_term:
    preferred_term: Intra-oral hyperpigmentation
    term:
      id: HP:0010284
      label: Intra-oral hyperpigmentation
  evidence:
  - reference: PMID:33407466
    reference_title: Identification of a novel mutation in the KITLG gene
      in a Chinese family with familial progressive hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: located on the face, neck, trunk and limbs and frequently on the palms, soles and
      oral mucosa
    explanation: Oral mucosal involvement in a molecularly confirmed KITLG series - the primary
      support, since the case report below was never sequenced.
  - reference: PMID:22577587
    reference_title: 'Familial progressive hyperpigmentation: a case report.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: hyperpigmented patches in the skin and mucous membranes, present in early infancy,
      and increase in size and number with age
    explanation: Records mucous-membrane involvement as part of the characteristic distribution.
      Graded PARTIAL because this 2012 case report predates molecular testing in the patient and
      carries no KITLG genotype, so it cannot be tied to this entry's entity with certainty.
  - reference: PMID:22577587
    reference_title: 'Familial progressive hyperpigmentation: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: who presented with a peculiar progressive oral pigmentation disorder
    explanation: A worked case in which oral pigmentation was the presenting complaint. Same
      caveat - clinically diagnosed "FPH", not genotyped.
histopathology:
- name: Increased epidermal melanin, maximal in the basal layer
  description: >-
    Biopsy of hyperpigmented skin shows a striking increase in melanin throughout the
    epidermis, most marked in the basal cell layer, with hypopigmented-area biopsies showing
    lower epidermal melanin. Histology is supportive rather than diagnostic.

    Two cautions on how far this can be pushed. First, the family in which it was documented
    was screened for KITLG and had no mutation, so this describes the FPHH clinical phenotype
    rather than the KITLG mechanism specifically - it is quoted here for the tissue-level
    finding, and separately as evidence of locus heterogeneity. Second, the observation is
    about melanin quantity and does not settle whether the excess pigment reflects more
    melanocytes or harder-working ones; this entry's pathograph models per-melanocyte
    hyperfunction, and that question is recorded as an open one rather than treated as closed.
  evidence:
  - reference: PMID:29186243
    reference_title: Clinical and genetic features of a Chinese family with familial progressive
      hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: skin biopsy specimens from the hyperpigmented areas showed a striking increase in
      melanin throughout the epidermis, especially in the basal cell layer, and staining of hypopigmented
      area specimens displayed lower levels of melanin in the epidermis
    explanation: The histological correlate of both lesion types in one patient.
genetic:
- name: KITLG
  gene_term:
    preferred_term: KITLG
    term:
      id: hgnc:6343
      label: KITLG
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Two things about this gene make the entry's scope decisions turn on it.

    First, direction of effect determines which KITLG disease a patient has. The FPHH alleles
    are heterozygous gain-of-function substitutions at the receptor-binding surface, and they
    cause too much pigment. Biallelic KITLG variants do the opposite: loss-of-function pairs
    have been proposed to cause generalized hypomelanosis, and residual-function pairs a
    variable auditory-pigmentary disorder resembling Waardenburg syndrome type 2 or
    piebaldism. That recessive disorder is a separate entity, not a severity band of this one,
    and it is kept out of this entry.

    Second, the same gene and in one case the same allele underlie concepts that are carried as
    distinct terms. p.Asn36Ser was reported first in a family labelled FPH - hyperpigmentation
    only - and then found segregating in two FPHH families, and the FPHH locus overlaps that of
    dyschromatosis universalis hereditaria 2. This entry therefore treats the hyper-only and
    hyper-plus-hypo presentations as one KITLG disease with a variable hypopigmented component.
    This argument is confined to KITLG and does not extend to FPH1 (OMIM:614233), which is a
    separate 19p13.1-pter locus with no identified gene.

    Locus heterogeneity is real and unresolved: FPHH families without any KITLG mutation have
    been reported, so a negative KITLG result does not exclude the clinical diagnosis.
  evidence:
  - reference: PMID:21368769
    reference_title: KITLG mutations cause familial progressive hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In aggregate, mutations in a single gene cause various pigmentation disorders:
      FPH, FPHH, and likely DUH2.'
    explanation: The single-gene basis spanning the historically separate FPH, FPHH, and DUH2
      concepts - the evidence for treating FPH and FPHH as one entry.
  - reference: PMID:21368769
    reference_title: KITLG mutations cause familial progressive hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A reported FPH substitution was observed in two FPHH families, and two, to our
      knowledge, previously unreported substitutions, p.Val33Ala and p.Thr34Pro, cosegregated
      with FPHH in two separate families.
    explanation: The same allele in both phenotypes, which is the specific observation that
      undermines an FPH/FPHH split.
  - reference: PMID:21566575
    reference_title: 'The genetic determination of skin pigmentation: KITLG and the KITLG/c-Kit
      pathway as key players in the onset of human familial pigmentary diseases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Amyere et al. suggest that different pigmentary diseases can result from the same
      mutation or different mutations in the same gene
    explanation: An independent commentary drawing the same conclusion - that phenotypic labels
      here do not track distinct genetic lesions.
  - reference: PMID:33407466
    reference_title: Identification of a novel mutation in the KITLG gene
      in a Chinese family with familial progressive hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, many FPHH families without KITLG mutations have been identified, indicating
      additional locus heterogeneity for this disorder
    explanation: Documents that KITLG does not account for all clinically diagnosed FPHH.
  - reference: PMID:29186243
    reference_title: Clinical and genetic features of a Chinese family with familial progressive
      hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Analysis revealed that its members did not have any mutations of the KITLG gene,
      which provided evidence for genetic heterogeneity of this genodermatosis.
    explanation: A worked KITLG-negative FPHH family - the concrete instance behind the locus
      heterogeneity claim, and the reason a negative KITLG result cannot exclude the diagnosis.
  - reference: PMID:35543077
    reference_title: Biallelic KITLG variants lead to a distinct spectrum of hypomelanosis and
      sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We provide consolidating evidence that biallelic KITLG variants cause a distinct
      auditory-pigmentary disorder.
    explanation: Establishes the biallelic disorder as a separate entity, supporting its exclusion
      from this entry.
  - reference: PMID:35543077
    reference_title: Biallelic KITLG variants lead to a distinct spectrum of hypomelanosis and
      sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pathogenic variants in KITLG, a crucial protein involved in pigmentation and neural
      crest cell migration, cause non-syndromic hearing loss, Waardenburg syndrome type 2, familial
      progressive hyperpigmentation and familial progressive hyper- and hypopigmentation, all
      of which are inherited in an autosomal dominant manner.
    explanation: The full allelic series at KITLG, which is what the differential for this entry
      has to be drawn against.
differential_diagnoses:
- name: Dyschromatosis universalis hereditaria 2
  description: >-
    The nearest neighbour and the hardest to separate. DUH2 maps to the same 12q interval as
    FPHH, is phenotypically and histologically close to FPH, and Amyere and colleagues judged
    it likely to be KITLG-related as well. The distinction may not survive further genetics.
  distinguishing_features:
  - Maps to the same 12q interval as FPHH
  - Separation currently rests on clinical and histological description rather than on a molecular criterion
  evidence:
  - reference: PMID:21368769
    reference_title: KITLG mutations cause familial progressive hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We performed a genome-wide linkage analysis in seven families with FPHH, and identified
      linkage on 12q21.12-q22, which overlaps with the DUH2 locus.
    explanation: The shared locus that makes DUH2 the primary differential.
- name: Legius syndrome
  description: >-
    Presents with familial cafe-au-lait macules and skin-fold freckling and is caused by
    SPRED1 variants. It is raised in the differential because the cafe-au-lait component of
    FPHH looks similar; the progressive diffuse brown background of FPHH is not part of
    Legius syndrome.
  distinguishing_features:
  - Caused by SPRED1 variants rather than KITLG
  - Skin-fold freckling rather than a progressive diffuse hyperpigmented background
  evidence:
  - reference: PMID:21368769
    reference_title: KITLG mutations cause familial progressive hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It also differs from the Legius syndrome, characterized by familial café-au-lait
      spots and skin fold freckling, caused by mutations in SPRED1.
    explanation: The authors' own differential, naming the distinguishing gene and features.
- name: Familial progressive hyperpigmentation 1 (FPH1)
  description: >-
    The name collision that matters most for this entry. FPH1 is a dominantly inherited
    hyperpigmentation-only phenotype mapped by genome screening to 19p13.1-pter in a
    three-generation Chinese family. Its causal gene has never been identified, and the
    interval is unrelated to KITLG at 12q. Clinically the two are close - patches present at
    birth or in early infancy that enlarge and multiply with age - so the separation rests on
    the locus rather than on the skin.
  distinguishing_features:
  - Maps to 19p13.1-pter, not to the KITLG interval at 12q
  - Causal gene unidentified, so it cannot be confirmed by KITLG sequencing
  - No hypopigmented component reported
  evidence:
  - reference: PMID:16709486
    reference_title: Linkage of a locus determining familial progressive hyperpigmentation (FPH)
      to chromosome 19p13.1-pter in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we identified a locus linked to chromosome 19p13.1-pter responsible for FPH, spanning
      45.48 cM between D19S593 and 19pter
    explanation: The linkage result establishing FPH1 as a locus distinct from KITLG at 12q.
  - reference: PMID:16709486
    reference_title: Linkage of a locus determining familial progressive hyperpigmentation (FPH)
      to chromosome 19p13.1-pter in a Chinese family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although previous studies showed that FPH is a monogenic trait, the genetic basis
      for this disease is unknown.
    explanation: Confirms the FPH1 gene was unidentified, which is why the entity cannot be resolved
      by molecular testing.
- name: Cafe-au-lait macule and lentigines syndromes
  description: >-
    When the cafe-au-lait and lentigine component is prominent, FPHH is confused with the
    RASopathy and neurocutaneous disorders that present with multiple cafe-au-lait macules -
    neurofibromatosis type 1, LEOPARD syndrome, and tuberous sclerosis complex. Legius
    syndrome belongs to this group too and is listed separately above, because the FPHH
    literature raises it by name. All of these have extracutaneous features that the
    genotyped FPHH pedigrees do not report.
  distinguishing_features:
  - Progressive diffuse hyperpigmented background, which none of these disorders produces
  - No extracutaneous involvement in FPHH, whereas each of these is a systemic disorder
  - Different causal genes (NF1, SPRED1, PTPN11, TSC1/TSC2) rather than KITLG
  evidence:
  - reference: PMID:39152874
    reference_title: A novel KITLG mutation causes familial progressive hyperpigmentation and
      hypopigmentation with multiple café-au-lait macules.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: our patient exhibited a relatively large number of CALMs and lentigines which require
      differentiation from pigmentary diseases that also manifest with multiple CALMs and lentigines,
      such as neurofibromatosis type 1, legius syndrome, LEOPARD syndrome, and tuberous sclerosis
      complex
    explanation: The authors' stated differential for an FPHH patient in whom the cafe-au-lait
      and lentigine component dominated.
- name: Biallelic KITLG auditory-pigmentary disorder
  description: >-
    The recessive counterpart at the same gene. Where FPHH is heterozygous gain of function
    causing excess pigment, biallelic variants cause hypomelanosis - including a
    sock-and-glove-like symmetric distribution and generalized hypomelanosis - together with
    sensorineural hearing loss.
  distinguishing_features:
  - Biallelic rather than heterozygous KITLG variants
  - Hypomelanosis rather than progressive hyperpigmentation
  - Sensorineural hearing loss, which FPHH does not cause
  evidence:
  - reference: PMID:35543077
    reference_title: Biallelic KITLG variants lead to a distinct spectrum of hypomelanosis and
      sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we expand the known hypomelanosis spectrum to include a 'sock-and-glove-like',
      symmetric distribution, progressive repigmentation and generalized hypomelanosis
    explanation: The biallelic phenotype, which is hypomelanotic and so the mirror image of FPHH.
diagnosis:
- name: KITLG sequencing
  description: >-
    Targeted sequencing of the KITLG coding region, concentrated on exon 2 where the VTNNV
    hotspot lies, confirms the clinical diagnosis in most families. Because locus
    heterogeneity is documented, a negative result does not exclude FPHH.
  evidence:
  - reference: PMID:36453959
    reference_title: '[Clinical phenotype and genetic analysis of a Chinese pedigree affected
      with familial progressive hyperpigmentation and hypopigmentation].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: High-throughput sequencing revealed that he has harbored a heterozygous c.105T>A
      (p.Asn35Lys) variant of the KITLG gene, which was unreported previously. Sanger sequencing
      confirmed that the variant has co-segregated with the disease phenotype in his pedigree.
    explanation: A worked diagnostic sequence - high-throughput screen followed by Sanger confirmation
      and cosegregation testing.
- name: Clinical recognition in infancy
  description: >-
    The combination of progressive skin pigmentation with hypopigmented spots in an infant is
    itself the diagnostic trigger, since the lesions are present at or shortly after birth.
  evidence:
  - reference: PMID:36453959
    reference_title: '[Clinical phenotype and genetic analysis of a Chinese pedigree affected
      with familial progressive hyperpigmentation and hypopigmentation].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For infants with progressive skin pigmentation and hypopigmentation spots, FPHH
      should be suspected.
    explanation: The authors' explicit diagnostic recommendation.
treatments:
- name: Genetic Counseling
  description: >-
    The intervention with the clearest indication, and effectively the only one specific to the
    disease rather than borrowed from general dyschromia management. Autosomal dominant
    transmission carries a 50% recurrence risk to offspring, penetrance has been described as
    reduced, and de novo cases occur - including a demonstrated de novo exon-4 allele - so
    unaffected parents do not exclude transmissible disease in the proband's own children.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:41779177
    reference_title: New variant in KITLG shapes the pathogenesis of familial progressive hyper-
      and hypo-pigmentation.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: it would extend the mutation spectrum of KITLG gene. It would improve the disease
      knowledge base and offer a reliable reference for the clinical diagnosis and prevention
      of FPHH
    explanation: Frames molecular diagnosis as the basis for counselling and prevention. Graded
      PARTIAL because it argues for the use of genetic information generally rather than reporting
      a counselling intervention or its outcome.
  notes: >-
    No trial, series, or outcome data exist for any intervention in this disease. This entry
    records genetic counselling because it follows directly from the established inheritance
    pattern, and deliberately does not curate the cosmetic and depigmenting measures
    (photoprotection, topical lightening agents, Q-switched laser) that appear in the general
    hyperpigmentation literature: none has been reported in FPHH, and extrapolating them here
    would manufacture a treatment section out of inference.

    KIT inhibition is the mechanistically obvious idea and is deliberately not curated as a
    treatment. Imatinib does suppress melanogenesis and does cause depigmentation in treated
    patients, but no one has given it for this indication, systemic KIT inhibition for a benign
    cosmetic condition is not a defensible trade, and no topical or intralesional agent exists.
    It belongs in a hypothesis, not in this list.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    No population prevalence estimate exists. The disorder is known from a small number of
    pedigrees and sporadic cases; as of the 2021 review only eight KITLG mutations had been
    reported in association with it. No Orphanet epidemiology class is available to cite, so
    prevalence_class is UNKNOWN rather than a numeric band.
  evidence:
  - reference: PMID:33407466
    reference_title: Identification of a novel mutation in the KITLG gene
      in a Chinese family with familial progressive hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To date, only eight KITLG mutations have been reported to be associated with FPHH,
      and no clear genotype-phenotype correlations have been established.
    explanation: The size of the reported literature, which is the only occurrence figure available.
discussions:
- discussion_id: fphh_hypopigmentation_reversion
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do the hypopigmented macules of FPHH represent a pigmentary defect, or are they revertant
    clones that have lost the mutant KITLG allele and simply look pale against hyperpigmented
    skin?
  attaches_to:
  - pathophysiology#Somatic Reversion of the KITLG Locus in Skin
  - phenotypes#Hypopigmented Macules and Streaks
  rationale: >-
    The answer changes what the disease is. If the pale lesions are revertant clones, the
    "with or without hypopigmentation" in the disease name describes a secondary somatic
    phenomenon rather than a second primary lesion, and the FPH/FPHH split collapses further -
    FPHH would be FPH plus reversion events. The single supporting observation is
    lesion-restricted copy-neutral loss of heterozygosity in Blaschko-linear striae in one
    patient, and the same paper notes that the cafe-au-lait macules do not follow Blaschko
    lines, so reversion cannot be the whole account of the dyspigmentation.
  proposed_experiments:
  - experiment_id: fphh_lesional_allele_ratio
    name: Lesion-restricted allele-ratio testing across an FPHH cohort
    description: >-
      Digital PCR or deep amplicon sequencing of the causal KITLG allele in matched
      hypopigmented lesional skin, adjacent hyperpigmented skin, and blood from multiple
      unrelated FPHH patients carrying different alleles, to establish whether copy-neutral
      LOH in pale lesions is general or was a single-patient finding.
    would_support:
    - pathophysiology#Somatic Reversion of the KITLG Locus in Skin
    supporting_outcome:
    - Loss of the mutant allele restricted to hypopigmented lesional skin in a substantial
      fraction of patients, absent from adjacent hyperpigmented skin and from blood.
    would_refute:
    - pathophysiology#Somatic Reversion of the KITLG Locus in Skin
    refuting_outcome:
    - Mutant allele retained at germline ratio in hypopigmented lesions across the cohort,
      indicating the pale macules arise by a mechanism other than reversion.
- discussion_id: fphh_kitlg_negative_locus_heterogeneity
  kind: KNOWLEDGE_GAP
  prompt: >-
    What accounts for FPHH in the families in which no KITLG variant is found?
  attaches_to:
  - genetic#KITLG
  rationale: >-
    Locus heterogeneity is documented but no second gene has been identified. Since KITLG acts
    through KIT and the melanogenic transcriptional program it drives, variants elsewhere on
    that axis are the obvious candidates, but this has not been shown. Practically, it means a
    negative KITLG test cannot exclude the diagnosis.
  proposed_experiments:
  - experiment_id: fphh_kitlg_negative_exome
    name: Exome or genome sequencing of KITLG-negative FPHH pedigrees
    description: >-
      Unbiased sequencing of multiplex families meeting FPHH clinical criteria in whom KITLG
      coding sequence is normal, with attention to KIT and to MITF-pathway melanogenic
      regulators.
    would_support:
    - pathophysiology#Enhanced KITLG-KIT Signaling in Epidermal Melanocytes
    supporting_outcome:
    - Identification of segregating variants in a second gene on the KITLG-KIT-MITF axis,
      which would confirm the pathway while establishing the disorder as genetically
      heterogeneous.
- discussion_id: fphh_extracutaneous_involvement
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is FPHH strictly skin-limited, or do the extracutaneous features reported in some pedigrees
    belong to the KITLG disease?
  attaches_to:
  - phenotypes#Progressive Diffuse Hyperpigmentation
  - genetic#KITLG
  rationale: >-
    This entry curates no systemic phenotype, and that is a decision rather than a finding.
    On one side, an affected pedigree was explicitly reported to have no other skin, nail,
    hair, teeth, mucosal, or systemic disease. On the other, the same review's survey of
    reported families records sparse lateral eyebrows and malignancy in two families and short
    sutures in one, and older pre-molecular reports under the "melanosis universalis
    hereditaria" label describe growth and developmental abnormalities. The negative comes from
    a single pedigree and cannot carry a disease-level claim; the positives are mostly from
    families that were never genotyped, in an era when the label was applied loosely and when
    what is now known to be a separate 19p disease was not distinguishable. Until genotyped
    series report systematically on extracutaneous findings, neither "skin-limited" nor
    "syndromic" is supportable, so the entry asserts neither.
  evidence:
  - reference: PMID:33407466
    reference_title: Identification of a novel mutation in the KITLG gene
      in a Chinese family with familial progressive hyper- and hypopigmentation.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: All the affected individuals in this family had similar lesions, and none of them
      showed any other skin, nail, hair, teeth, mucosal or systemic diseases.
    explanation: The skin-limited observation. Graded PARTIAL because it is scoped to one family
      by its own wording and cannot establish a disease-level negative.
  - reference: PMID:33407466
    reference_title: Identification of a novel mutation in the KITLG gene
      in a Chinese family with familial progressive hyper- and hypopigmentation.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Sparse lateral eyebrows and malignancy (pharyngeal cancer, papillary thyroid cancer
      and melanoma) were found in two families. Short sutures were found in only one family, and
      mental retardation was not present in these FPHH patients
    explanation: The contrary observations from the same survey, including its own negative on
      intellectual disability - which is what the older syndromic reports had claimed.
- discussion_id: fphh_malignancy_risk
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do KITLG gain-of-function alleles carry any increased risk of melanoma or other malignancy,
    or is the reported cancer an artefact of small numbers?
  attaches_to:
  - genetic#KITLG
  - clinical_burden#
  rationale: >-
    Malignancy - pharyngeal cancer, papillary thyroid cancer, and melanoma - was noted in two of
    the reported FPHH families, while the six-generation index family had none. Gain-of-function
    mutations in KIT, the receptor this ligand activates, cause gastrointestinal stromal tumour,
    so a neoplastic effect of chronic pathway activation is not implausible on its face. But the
    total reported literature is a few dozen patients, cancers of these types occur in unselected
    families, and no age-adjusted comparison has been made. This is recorded as an open question
    specifically so that it is not curated as an established complication, which would put
    surveillance recommendations on a single uncontrolled observation.
  evidence:
  - reference: PMID:33407466
    reference_title: Identification of a novel mutation in the KITLG gene
      in a Chinese family with familial progressive hyper- and hypopigmentation.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Sparse lateral eyebrows and malignancy (pharyngeal cancer, papillary thyroid cancer
      and melanoma) were found in two families.
    explanation: The observation that raises the question. Graded PARTIAL because it is an
      uncontrolled tally across two reported families with no denominator or population comparison,
      so it supports opening the question rather than an association.
  proposed_experiments:
  - experiment_id: fphh_cancer_incidence_cohort
    name: Age-adjusted cancer incidence in an assembled KITLG-variant cohort
    description: >-
      Pool molecularly confirmed KITLG gain-of-function carriers across reporting centres and
      compare observed cancer incidence, melanoma in particular, against population rates matched
      for age, sex, and ancestry.
    supporting_outcome:
    - Cancer incidence significantly above matched population rates in variant carriers, which
      would make surveillance a live question.
    refuting_outcome:
    - Incidence indistinguishable from population rates, establishing the reported cancers as
      coincidental and closing the question.
notes: >-
  Scope and lump/split decision. Three MONDO terms sit close together here and they do not all
  mean the same thing, so the identifiers rather than the labels have to drive the call.

  MONDO:0007771 (this entry) carries OMIM:145250 - the KITLG entity. MONDO:0017239, placed as
  its child, carries Orphanet:280628 and no OMIM id; it is the Orphanet view of that same
  KITLG disease rather than a distinct concept, so it is not curated separately.
  MONDO:0013648, by contrast, carries OMIM:614233 and Orphanet:79146, and OMIM:614233 is FPH1
  - the phenotype mapped to 19p13.1-pter in a Chinese family whose causal gene has never been
  found. That is a genetically distinct disease and is recorded here as a differential, not
  folded in.

  Worth flagging for someone with the standing to judge it: MONDO currently asserts
  MONDO:0013648 (the 19p, gene-unknown FPH1) as a parent of MONDO:0007771 (the KITLG entity).
  That is recorded as an observation only - this entry takes no position on the ontology
  modelling.

  One synonym needs a caveat. "Melanosis universalis hereditaria" is used in the FPHH
  literature for this KITLG entity, and is kept here for that reason, but MONDO assigns it as
  an exact synonym of MONDO:0013648 - the FPH1 term this entry treats as a different disease.
  It is therefore not a safe search key for either concept on its own. "Hyperpigmentation,
  familial progressive, 2" (FPH2) is the label that disambiguates cleanly.

  Within the KITLG entity the hyper-only and hyper-plus-hypo presentations are handled as
  phenotype variability rather than as subtypes, on the strength of the shared p.Asn36Ser
  allele and the single mutational hotspot. DUH2 is kept as a differential rather than merged,
  because the KITLG link there is stated as likely rather than demonstrated.

  The recessive, biallelic KITLG auditory-pigmentary disorder is deliberately excluded: it is
  a different direction of effect on the same gene, produces hypomelanosis and sensorineural
  hearing loss, and is a separate entity.

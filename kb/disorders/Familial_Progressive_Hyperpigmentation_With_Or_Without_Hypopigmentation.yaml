  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    The defining and universal feature. Diffuse, partly blotchy hyperpigmented patches
    present at birth or in early infancy, enlarging and increasing in number with age across
    face, neck, trunk, and limbs, and frequently involving palms, soles, and oral mucosa.
  phenotype_term:
    preferred_term: Progressive hyperpigmentation
    term:
      id: HP:0007505
      label: Progressive hyperpigmentation
    clinical_course: PROGRESSIVE
    onset:
      onset_category: CONGENITAL
  evidence:
  - reference: PMID:19375057
    reference_title: Gain-of-function mutation of KIT ligand on melanin synthesis causes familial
      progressive hyperpigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: characterized by hyperpigmented patches in the skin, present in early infancy
      and increasing in size and number with age
    explanation: The onset and progression that the phenotype name asserts.
  - reference: PMID:33407466
    reference_title: Identification of a novel mutation in the KITLG gene
      in a Chinese family with familial progressive hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Generalized hyper- and hypopigmentation with irregular patches was found at birth,
      and the patches (0.2–0.8 cm) progressed successively over her face, neck, trunk and limbs
      with age.
    explanation: A worked pedigree description of congenital onset and progressive spread, with
      lesion sizes and distribution.
- category: Dermatologic
  name: Mixed Hypo- and Hyperpigmentation
  description: >-
    The feature the disease name qualifies as optional. Scattered pale macules on the
    progressive brown background, ranging from well-isolated patches on normal-appearing skin
    to a confetti-like or mottled pattern. Families in which no hypopigmented feature is
    present were historically separated as FPH; the same KITLG alleles are found in both, so
    this is presentation variability within one entity rather than a second disease.
  phenotype_term:
    preferred_term: Mixed hypo- and hyperpigmentation of the skin
    term:
      id: HP:0009123
      label: Mixed hypo- and hyperpigmentation of the skin
  evidence:
  - reference: PMID:21368769
    reference_title: KITLG mutations cause familial progressive hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical signs consist of progressive diffuse, partly blotchy hyperpigmented lesions,
      multiple café-au-lait spots, intermingled with scattered hypopigmented-appearing maculae,
      and lentigines.
    explanation: The full dyspigmentation picture, including the hypopigmented component.
  - reference: PMID:33407466
    reference_title: Identification of a novel mutation in the KITLG gene
      in a Chinese family with familial progressive hyper- and hypopigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Dispigmentation patterns can range from well-isolated café-au-lait/hypopigmented
      patches on a background of normal-appearing skin to a confetti-like or mottled appearance
    explanation: The morphological range of the mixed pattern.
- category: Dermatologic
  name: Hypopigmented Macules and Streaks
  description: >-
    Discrete pale macules, and in at least one reported patient hypopigmented striae
    following the lines of Blaschko. The Blaschko-linear form is the observation that raised
    revertant mosaicism as the underlying mechanism.
  phenotype_term:
    preferred_term: Hypopigmented macule
    term:
      id: HP:0020073
      label: Hypopigmented macule
  evidence:

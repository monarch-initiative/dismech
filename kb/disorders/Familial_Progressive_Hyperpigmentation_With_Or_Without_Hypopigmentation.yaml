name: Familial Progressive Hyperpigmentation With Or Without Hypopigmentation
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
description: >-
  KITLG is the ligand for KIT, and keratinocytes secrete it at melanocytes sitting in the
  same epidermis. The disease-causing variants do not break that signal; they strengthen it.
  Almost all of them fall in a five-residue stretch of exon 2 - the conserved VTNNV motif at
  amino acids 33-37 - which is the surface KITLG presents to its receptor, and substituting a
  Exactly how a substitution there strengthens the signal is inferred rather than measured:
  homology modelling suggests it raises the ligand's affinity for KIT, and no binding or
  receptor-activation assay on a mutant ligand has been published. What has been measured is
  the output. Adding the mutant soluble ligand to cells raises tyrosinase activity and roughly
  doubles melanin content, and a base-edited model shows the melanogenic transcriptional
  program, MITF included, shifting with it. Clinically that is diffuse hyperpigmentation
  present at or shortly after birth and spreading with age.

  The name carries the disease's central awkwardness. Some families have hyperpigmentation
  and nothing else; others have the same progressive brown background scattered with
  cafe-au-lait macules, lentigines, and pale macules. These were described under separate
  labels - FPH and FPHH - and within KITLG the labels do not track distinct lesions: Amyere
  and colleagues found the p.Asn36Ser allele originally reported in an FPH family segregating
  in two FPHH families, and mapped the whole set to the same 12q interval that dyschromatosis
  universalis hereditaria 2 maps to. Presence or absence of the hypopigmented component is
  therefore treated here as variability within one entity.

  What that argument does not cover is FPH1, which is a different disease with a confusingly
  similar name. A three-generation Chinese family with hyperpigmentation only was mapped to
  19p13.1-pter, nowhere near KITLG, and its gene is still unidentified. So "familial
  progressive hyperpigmentation" names two things: a phenotype label used loosely across the
  KITLG literature, and a specific unsolved 19p locus. Only the first is folded into this
  entry.

  The pale macules are the part that is genuinely not understood, and the most interesting
  recent finding is that they may not be a pigmentary defect at all. In a patient whose
  hypopigmented macules and streaks followed the lines of Blaschko, digital PCR on lesional
  skin found copy-neutral loss of heterozygosity at the KITLG locus present in the pale skin
  and absent from blood - that is, clones that had lost the mutant allele and reverted to
  normal pigmentation, looking pale only against an abnormally dark background. If that
  generalises, "hypopigmentation" in this disease is a misnomer for patches of unaffected
  skin. It is a single patient, and the cafe-au-lait macules in the same person did not
  follow Blaschko lines and so need a different explanation.

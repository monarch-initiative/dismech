- name: Progressive Epidermal Melanin Accumulation
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Sustained overproduction of melanin across the epidermis produces the clinical lesion: a
    diffuse, partly blotchy brown background present at or shortly after birth that enlarges
    and multiplies with age rather than remitting. The distribution is generalised - face,
    neck, trunk, and limbs, and frequently the palms, soles, and oral mucosa - and adnexal
    structures are spared.
  biological_processes:
  - preferred_term: pigmentation
    modifier: INCREASED
    term:
      id: GO:0043473
      label: pigmentation
  downstream:
  - target: Progressive Diffuse Hyperpigmentation
    causal_link_type: DIRECT
  - target: Lentigines
    causal_link_type: DIRECT
  - target: Oral Mucosal Pigmentation
    causal_link_type: DIRECT
  - target: Somatic Reversion of the KITLG Locus in Skin
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The hyperpigmented background is what makes a reverted clone visible at all - a patch of
      normally pigmented skin only reads as hypopigmented against it. This edge records that
      dependency rather than a causal push toward reversion.
  evidence:
  - reference: PMID:19375057
    reference_title: Gain-of-function mutation of KIT ligand on melanin synthesis causes familial
      progressive hyperpigmentation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Familial progressive hyperpigmentation (FPH) is an autosomal-dominantly inherited
      disorder characterized by hyperpigmented patches in the skin, present in early infancy
      and increasing in size and number with age.
    explanation: The defining clinical course - congenital or early-infantile onset with progression
      rather than stability.

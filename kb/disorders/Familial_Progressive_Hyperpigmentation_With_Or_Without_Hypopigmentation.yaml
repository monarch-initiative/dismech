      label: melanin biosynthetic process
  cell_types:
  - preferred_term: epidermal melanocyte
    term:
      id: CL:2000000
      label: epidermal melanocyte
  downstream:
  - target: Progressive Epidermal Melanin Accumulation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:19375057
    reference_title: Gain-of-function mutation of KIT ligand on melanin synthesis causes familial

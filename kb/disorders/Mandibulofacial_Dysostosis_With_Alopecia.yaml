- category: Integument
  name: Alopecia
  description: >
    Scalp alopecia is the feature that names the syndrome and distinguishes it
    clinically from the other endothelin-pathway craniofacial disorders. It is
    also the feature with no mechanistic account: it is not a pharyngeal arch
    derivative, it is not part of the serial-homology pattern, and the Ednra
    Y129F mouse does not reproduce it.
  phenotype_term:
    preferred_term: Alopecia
    term:
      id: HP:0001596
      label: Alopecia
  evidence:
  - reference: PMID:36637912
    reference_title: "Mandibulofacial dysostosis with alopecia results from ETAR gain-of-function mutations via allosteric effects on ligand binding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sparse scalp hair with persistent frontal balding"
    explanation: >-
      Direct human observation of the scalp phenotype in a molecularly confirmed
      MFDA patient (8%-11% mosaic EDNRA p.E303K), so the phenotype no longer
      rests on model-organism evidence alone.
  - reference: PMID:27671791
    reference_title: "Viable Ednra (Y129F) mice feature human mandibulofacial dysostosis with alopecia (MFDA) syndrome due to the homologue mutation."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "without showing any cleft palates, eyelid defects, or alopecia"
    explanation: >-
      Secondary, and deliberately not the primary support: this records the
      absence of alopecia in the otherwise faithful mouse, so it evidences the
      human/mouse discordance rather than the human phenotype itself.
- category: Integument
  name: Generalized Hypopigmentation
  description: >
    Skin hypopigmentation generalized relative to first-degree relatives, reported
    in the EDNRA p.Glu303Lys mosaic patient.

    Curated deliberately alongside the alopecia rather than as an incidental
    finding: follicular melanocytes are neural-crest derivatives and the endothelin
    axis is a known melanocyte-lineage signal, so a pigmentary phenotype in the
    same patient is the one available observation that speaks to whether the
    alopecia runs through a follicular neural-crest arm. It is a single patient and
    is not asserted as a recurrent MFDA feature; see
    gap_mfda_alopecia_mechanism.
  phenotype_term:
    preferred_term: Generalized hypopigmentation
    term:
      id: HP:0007513
      label: Generalized hypopigmentation
  evidence:
  - reference: PMID:36637912
    reference_title: "Mandibulofacial dysostosis with alopecia results from ETAR gain-of-function mutations via allosteric effects on ligand binding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "generalized hypopigmentation compared with first degree relatives"
    explanation: >-
      Direct human observation of the pigmentary phenotype, with first-degree
      relatives as the stated comparator.
- category: Ophthalmologic
  name: Lower Eyelid Coloboma
  description: >
    Asymmetric lower eyelid coloboma severe enough to require surgical repair.
    Together with the ocular adnexal findings in the knock-in mice this is the
    eyelid component of the syndrome, and it is what makes the blanket claim that
    the mouse shows no eyelid defects unsupportable.
  phenotype_term:
    preferred_term: Lower eyelid coloboma
    term:
      id: HP:0000652
      label: Lower eyelid coloboma
  evidence:
  - reference: PMID:36637912
    reference_title: "Mandibulofacial dysostosis with alopecia results from ETAR gain-of-function mutations via allosteric effects on ligand binding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "asymmetric lower eyelid coloboma that required surgery on the right side"
    explanation: >-
      Direct human observation of the eyelid defect in a molecularly confirmed MFDA
      patient.
- category: Craniofacial
  name: Cleft Palate
  description: >
    Cleft palate is part of the human MFDA phenotype and is among the features
    the Ednra Y129F mouse does not reproduce.

    Evidence caveat, stated rather than papered over: the human source is the
    pre-molecular clinical delineation of the syndrome, which reports cleft
    palate in a patient described before EDNRA was implicated. That patient was
    karyotypically normal and TCOF1-negative but was never tested for EDNRA, so
    the report establishes cleft palate as a feature of the clinically defined
    entity rather than of a molecularly confirmed EDNRA case. The only other
    quotable sentence in this entry's references is the mouse-negative one,
    which supports "the mouse lacks it", not "patients have it".
  phenotype_term:
    preferred_term: Cleft palate
    term:
      id: HP:0000175
      label: Cleft palate
  evidence:
  - reference: PMID:20583178
    reference_title: "Mandibulofacial dysostosis, severe lower eyelid coloboma, cleft palate, and alopecia: A new distinct form of mandibulofacial dysostosis or a severe form of Johnson-McMillin syndrome?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a patient with a phenotype characterized by mandibulofacial dysostosis with severe lower eyelid coloboma, cleft palate, abnormal ears, alopecia, delayed eruption and crowded teeth, and sensorioneural hearing loss."
    explanation: >-
      Human observation of cleft palate in a patient with the MFDA phenotype,
      replacing the mouse-negative snippet this phenotype previously had no
      valid support for. PARTIAL because the 2010 report predates the
      identification of EDNRA as the MFDA gene: it is a clinical delineation of
      the tetrad in a TCOF1-negative patient, not a molecularly confirmed EDNRA
      case.
genetic:
- name: EDNRA
  gene_term:
    preferred_term: EDNRA
    term:
      id: hgnc:3179
      label: EDNRA
  association: Causative
  notes: >
    EDNRA encodes the endothelin receptor type A (ETAR), a class A GPCR that binds
    endothelin 1 and endothelin 2 with much higher affinity than endothelin 3.
    Two recurrent de novo missense variants cause MFDA: p.Tyr129Phe (three of the
    four individuals in the founding report) and p.Glu303Lys (one somatic mosaic
    case, plus a later fully characterized patient). Allelic series note: the same
    gene produces three distinct clinical entities depending on the direction and
    magnitude of the signalling change. Gain of function gives MFDA; biallelic
    loss of function gives oro-oto-cardiac syndrome, with severe mandibular
    hypoplasia, anotia and cardiac defects; and loss of function in the downstream
    partners EDN1, PLCB4 and GNAI3 gives auriculocondylar syndrome. Interpreting a
    novel EDNRA variant therefore requires a functional assay establishing the
    direction of effect, not merely a pathogenicity prediction.
  evidence:
  - reference: PMID:25772936
    reference_title: "Mutations in the endothelin receptor type A cause mandibulofacial dysostosis with alopecia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of the four individuals have the same substitution, p.Tyr129Phe."
    explanation: >-
      Establishes p.Tyr129Phe as the recurrent MFDA allele in the founding
      cohort.
  - reference: PMID:36637912
    reference_title: "Mandibulofacial dysostosis with alopecia results from ETAR gain-of-function mutations via allosteric effects on ligand binding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we establish p.E303K in the gene encoding the endothelin receptor type A (ETAR/EDNRA) as a recurrent mutation causing mandibulofacial dysostosis with alopecia (MFDA), with craniofacial changes similar to those caused by p.Y129F"
    explanation: >-
      Establishes p.Glu303Lys as the second recurrent MFDA allele with a
      concordant craniofacial phenotype.
  - reference: PMID:32133772
    reference_title: "Loss-of-function of Endothelin receptor type A results in Oro-Oto-Cardiac syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This homozygous variant is thus the first reported loss-of-function EDNRA allele, resulting in a syndrome we have named Oro-Oto-Cardiac Syndrome."
    explanation: >-
      Documents the opposite-direction EDNRA allele and its distinct disease,
      supporting the allelic-series caveat in these notes.
animal_models:
- name: Ednra Y129F knock-in mouse
  species: Mouse
  genotype: Ednra c.386A>T (p.Tyr129Phe), heterozygous and homozygous
  publication: PMID:27671791
  description: >
    A viable dominant mouse carrying the exact human MFDA substitution, recovered
    from an ENU mutagenesis programme and phenotyped through the German Mouse
    Clinic pipeline. Its viability is itself informative: Ednra-null mice die
    neonatally from mechanical asphyxia, so a viable point-mutant supports the
    inference that MFDA retains substantial EDNRA signalling.
  modeled_mechanisms:
  - target: Multi-Element First and Second Arch Malformation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >
      The mouse reproduces the full skeletal arch-derivative phenotype — jaw
      dysplasia, micrognathia, dysplastic temporomandibular joints, auricular
      dysmorphism, absent squamosal zygomatic process, ossicular abnormality with
      hearing impairment — but none of the non-skeletal features.
    limitations: >-
      Neither heterozygous nor homozygous mutants of this ENU line show cleft
      palate, eyelid defects or alopecia, so the model cannot be used to
      investigate the syndrome's named feature. Scope the eyelid half of that
      negative to this line: the separately generated CRISPR knock-ins reported in
      PMID:36637912 do show ocular adnexal abnormalities, so "the mouse has no
      eyelid phenotype" is not a claim this entry makes. Expressivity also varies
      between individual mice, as it does between patients, which limits its use
      for quantitative genotype-phenotype work.
    readouts:
    - name: Craniofacial skeletal phenotype
      target: Multi-Element First and Second Arch Malformation
      direction: ALTERED
      interpretation: >-
        Standardized craniofacial phenotyping reproduces the human arch-derivative
        malformation set.
      evidence:
      - reference: PMID:27671791
        reference_title: "Viable Ednra (Y129F) mice feature human mandibulofacial dysostosis with alopecia (MFDA) syndrome due to the homologue mutation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mutant mice mimic the craniofacial phenotypes of jaw dysplasia, micrognathia, dysplastic temporomandibular joints, auricular dysmorphism, and missing of the squamosal zygomatic process as described for MFDA-affected individuals."
        explanation: Reports the craniofacial features scored in the model.
    evidence:
    - reference: PMID:27671791
      reference_title: "Viable Ednra (Y129F) mice feature human mandibulofacial dysostosis with alopecia (MFDA) syndrome due to the homologue mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mutant Ednra Y129F mice represent a valuable viable model for complex human syndromes of the first and second pharyngeal arches"
      explanation: >-
        Supports the model as informative for the first- and second-arch
        malformation node specifically.
  - target: Multi-Element First and Second Arch Malformation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >
      This ENU line does not reproduce the alopecia, cleft palate or eyelid defects
      that are part of the human syndrome. Recorded as an explicit negative claim
      rather than left as a caveat in prose.

      Alopecia is the durable part of that negative: it is absent from both
      independently generated mouse models and the authors state the species
      difference directly. The eyelid half does not generalize beyond this line,
      because the CRISPR knock-ins do show ocular adnexal abnormalities.
    limitations: >-
      The failure may reflect a genuine species difference in an
      endothelin-dependent process outside the arch skeleton, or simply that the
      relevant tissue is not sensitised in the mouse; the study does not
      discriminate. Either way the model must not be used as evidence that
      alopecia is not part of MFDA.
    evidence:
    - reference: PMID:27671791
      reference_title: "Viable Ednra (Y129F) mice feature human mandibulofacial dysostosis with alopecia (MFDA) syndrome due to the homologue mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "without showing any cleft palates, eyelid defects, or alopecia"
      explanation: >-
        Direct statement of the features this ENU line fails to reproduce.
    - reference: PMID:36637912
      reference_title: "Mandibulofacial dysostosis with alopecia results from ETAR gain-of-function mutations via allosteric effects on ligand binding."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The most significant difference is alopecia in patients with MFDA but not in mouse models."
      explanation: >-
        Independent confirmation that alopecia is absent across both mouse models,
        which is what licenses the alopecia arm of this negative claim as a species
        difference rather than a single-line result.
- name: Ednra E303K knock-in mouse
  species: Mouse
  genotype: Ednra p.Glu303Lys knock-in
  publication: PMID:36637912
  description: >
    Knock-in mouse for the second MFDA allele, used together with the Y129F model
    and an Edn3 cross to establish ligand dependence.
  modeled_mechanisms:
  - target: Ectopic ETAR Activation in the Maxillary Prominence
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >
      Both knock-in alleles produce a partial maxillary-to-mandibular
      transformation, and crossing onto an Edn3-null background rescues it. This
      is the genetic epistasis experiment that identifies ectopic
      endothelin-3-driven ETAR activation as the operative mechanism rather than
      an inferred one.
    limitations: >-
      The rescue establishes ligand dependence in the mouse; the endothelin 3
      expression domain in the human maxillary prominence has not been mapped
      directly, so the spatial premise is transferred from mouse rather than
      demonstrated in human tissue.
    readouts:
    - name: Maxillary-to-mandibular transformation, Edn3-dependent
      target: Ectopic ETAR Activation in the Maxillary Prominence
      direction: ABOLISHED
      interpretation: >-
        The transformation is abolished when Edn3 is deleted, establishing that
        the phenotype requires the non-preferred ligand.
      evidence:
      - reference: PMID:36637912
        reference_title: "Mandibulofacial dysostosis with alopecia results from ETAR gain-of-function mutations via allosteric effects on ligand binding."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "which was rescued by deleting the ligand endothelin 3 (ET3/EDN3)"
        explanation: Reports the Edn3-deletion rescue result.
    evidence:
    - reference: PMID:36637912
      reference_title: "Mandibulofacial dysostosis with alopecia results from ETAR gain-of-function mutations via allosteric effects on ligand binding."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mouse models carrying either of these missense mutations exhibited a partial maxillary-to-mandibular transformation"
      explanation: >-
        Establishes that both MFDA alleles produce the transformation in vivo.
discussions:
- discussion_id: mismatch_mfda_mouse_nonskeletal_features
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does a mouse carrying the exact homologous Ednra Y129F substitution
    reproduce the entire craniofacial and ossicular phenotype but not the
    scalp-patterned alopecia that names the human syndrome?
  attaches_to:
  - phenotypes#Alopecia
  - phenotypes#Cleft Palate
  - pathophysiology#Multi-Element First and Second Arch Malformation
  rationale: >
    This is a model-fidelity question rather than an absence of evidence: the
    knock-in carries the identical residue change, was phenotyped through a
    standardized pipeline, and positively reproduces the skeletal arm — so the
    negative result on alopecia is informative rather than uninformative. It is
    also the one non-skeletal negative that holds across both independently
    generated models, which is why the mismatch is framed on alopecia alone.
    Two readings are open. Either endothelin signalling has a role in human hair
    follicle development that the mouse does not share, in which case the model is
    simply silent on the human syndrome's most diagnostic feature; or the relevant
    murine tissue is not sensitised under standard husbandry — murine hair cycling
    is synchronised and stage-dependent, so a follicular defect could be masked by
    the sampling stage. The distinction determines whether this mouse can be used
    at all for preclinical work on the alopecia, which is the feature patients
    present with.

    Deliberately excluded from the mismatch: eyelid defects. The ENU Y129F line was
    reported free of them, but the CRISPR knock-ins of both MFDA alleles show open
    eyelids at birth and periocular skin erosion, so there is no cross-model murine
    negative to set against the human lower eyelid coloboma. The two reports may
    genuinely disagree, or the lines may differ in background or construction;
    either way a blanket "the mouse has no eyelid phenotype" is not supportable and
    is not asserted here. Cleft palate is retained in attaches_to on its own
    footing: the human phenotype now has a primary clinical source, and the ENU
    Y129F line is explicitly reported free of cleft palate, so this is a genuine
    cross-species negative rather than a placeholder for a missing citation. It
    is not folded into the framing above because it rests on the single ENU
    report, whereas the alopecia negative holds across both models.
  proposed_experiments:
  - experiment_id: exp_mfda_mouse_hair_cycle_staged_phenotyping
    name: Hair-cycle-staged and tissue-conditional phenotyping of Ednra Y129F mice
    description: >
      Re-phenotype the Ednra Y129F mouse for follicular morphology across defined
      anagen/catagen/telogen stages rather than at a single timepoint, and in
      parallel generate a skin-restricted conditional allele to test whether local
      expression is sufficient. Map Edn3 availability in murine versus human scalp
      dermis at the corresponding stage. A staged defect would rescue the model
      for preclinical use; a flat negative across all stages with confirmed local
      expression would establish a genuine species difference and redirect work to
      human follicle systems.
- discussion_id: gap_mfda_alopecia_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what mechanism does an EDNRA gain-of-function variant cause scalp alopecia,
    a phenotype outside the pharyngeal arch skeleton and absent from the knock-in
    mouse?
  attaches_to:
  - phenotypes#Alopecia
  - phenotypes#Generalized Hypopigmentation
  - pathophysiology#Multi-Element First and Second Arch Malformation
  rationale: >
    Alopecia is the feature that names the syndrome and distinguishes it from
    auriculocondylar syndrome and oro-oto-cardiac syndrome, yet it has no
    mechanistic account. Hair follicles are not pharyngeal arch derivatives, so
    the serial-homology module that explains the craniofacial phenotype does not
    reach it. The Ednra Y129F mouse reproduces the entire skeletal phenotype but
    shows no alopecia, and neither does the E303K knock-in, so the models offer no
    route in. Two possibilities are open: the endothelin axis has a direct role in
    human hair follicle or follicular neural-crest-derived melanocyte biology that
    the mouse does not share, or the alopecia is secondary to a shared upstream
    neural crest defect that the skeletal readout happens to capture more
    sensitively. Nothing in the current literature distinguishes them, but the
    generalized hypopigmentation curated in the p.Glu303Lys patient is the one
    observation that bears on the choice: a pigmentary phenotype in the same
    patient is what the melanocyte-lineage reading predicts, and it is a reason to
    look at follicular melanocytes rather than at receptor pharmacology alone.
  proposed_experiments:
  - experiment_id: exp_mfda_ednra_scalp_follicle_expression_and_signalling
    name: EDNRA/EDN3 expression and signalling in human scalp follicle at the relevant developmental stage
    description: >
      Map EDNRA and EDN3 expression across human embryonic and fetal scalp,
      distinguishing follicular epithelium, dermal papilla and
      neural-crest-derived follicular melanocytes, and test whether the MFDA
      variants alter endothelin-3-driven signalling in follicle-derived cells
      using the same BRET and pharmacological assays already applied to the
      craniofacial phenotype. A positive result would place alopecia on a direct
      EDNRA arm; a negative result would redirect attention to a shared upstream
      neural crest defect and would specifically motivate lineage tracing rather
      than further receptor pharmacology.
notes: >
  Scope and boundary caveats a curator should preserve:

  Direction of effect is the whole point. MFDA is EDNRA GAIN of function; the
  clinically adjacent auriculocondylar syndrome arises from LOSS of signalling in
  the same axis (EDN1 loss of function, or dominant negative PLCB4/GNAI3), and
  biallelic EDNRA loss of function gives a third entity, oro-oto-cardiac
  syndrome. The homeotic transformations run in opposite directions —
  maxillary-to-mandibular in MFDA, mandibular-to-maxillary in the loss-of-function
  disorders. This is why MFDA is curated as a separate Disease rather than as a
  has_subtypes entry on Auriculocondylar_Syndrome, and why the two entries'
  conforms_to edges attach to the same module nodes without the entries being
  redundant: the module is about the arch-patterning axis, and these are its two
  poles. Do not merge them, and do not describe MFDA as an
  "EDNRA-related craniofacial disorder" without stating the direction.

  Not a pure gain of function in every territory. The functional consequences are
  complex and context-dependent: the upper jaw shows aberrant ETAR signalling
  while the lower jaw appears to show disrupted signalling, which is why patients
  have micrognathia rather than a duplicated mandible. The in vitro and in vivo
  assays in the founding report were explicit that the effects were complex and
  context-dependent, and that qualification should not be dropped when
  summarizing the entry as "gain of function".

  Cardiovascular development is spared. Unlike Ednra-null mice, MFDA patients
  have no cardiovascular malformations. This is evidence that substantial EDNRA
  signalling is retained, and it is a real constraint on any model of the
  disorder — a proposed mechanism that abolishes EDNRA signalling would predict
  cardiac defects that patients do not have.

  Alopecia is unexplained and is recorded as an open KNOWLEDGE_GAP above rather
  than being given a plausible-sounding mechanism in the pathograph.

  Johnson-McMillin syndrome. The somatic mosaic p.Glu303Lys individual had
  previously been described under that diagnosis. Whether Johnson-McMillin
  syndrome as a whole is subsumed by MFDA is not established by that single case
  and is deliberately not asserted here.

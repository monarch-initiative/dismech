inheritance:
- name: Autosomal dominant (de novo)
  description: >-
    Reported cases arise from de novo heterozygous missense variants and the
    condition appears to be inherited in an autosomal dominant fashion. One
    reported individual carried the p.Glu303Lys substitution in somatic mosaic
    form and had previously been diagnosed as Johnson-McMillin syndrome, so
    mosaicism should be considered when the phenotype is atypical or asymmetric.

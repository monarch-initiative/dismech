    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with the p.Y129F mutation have no temporomandibular joints, flattened condyles, and a thickened malar bone"
    explanation: >-
      Directly describes the temporomandibular joint and condylar phenotype in
      p.Tyr129Phe patients.
- category: Craniofacial
  name: Malar and Zygomatic Anomaly
  description: >
    A thickened malar bone with absence of the squamosal zygomatic process. The
    abnormal shape of the zygomatic arch is the specific radiographic feature that
    matched MFDA to the ectopic-activation mouse and thereby identified the
    direction of the transformation.
  phenotype_term:
    preferred_term: Malar bone anomaly
    term:
      id: HP:0010668
      label: Abnormal zygomatic bone morphology
  evidence:
  - reference: PMID:36637912
    reference_title: "Mandibulofacial dysostosis with alopecia results from ETAR gain-of-function mutations via allosteric effects on ligand binding."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "flattened condyles, and a thickened malar bone, highly reminiscent of mice with ectopic ETAR activation in the upper jaw"
    explanation: >-
      Documents the malar bone abnormality in patients. The bound HP term is
      direction-neutral, so it accommodates the reported thickening; PARTIAL
      because this quote covers the thickened malar bone but not the absent
      squamosal zygomatic process also asserted in the description.

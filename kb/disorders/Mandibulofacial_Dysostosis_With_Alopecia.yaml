      mechanism, in the same patient.
  - reference: PMID:27671791
    reference_title: "Viable Ednra (Y129F) mice feature human mandibulofacial dysostosis with alopecia (MFDA) syndrome due to the homologue mutation."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "As observed in MFDA-affected individuals, mutant Ednra Y129F mice exhibit hearing impairment in line with strong abnormalities of the ossicles"
    explanation: >-
      Corroborates the ossicular basis of the hearing impairment in the model.
      PARTIAL because the mouse data do not themselves classify the loss as

name: Mandibulofacial Dysostosis with Alopecia
creation_date: "2026-08-20T00:00:00Z"
category: Mendelian
description: >-
  Mandibulofacial dysostosis with alopecia (MFDA) is a rare craniofacial
  neurocristopathy caused by de novo heterozygous missense variants in EDNRA,
  which encodes the endothelin receptor type A (ETAR), a class A G
  protein-coupled receptor expressed on migrating cranial neural crest cells.
  Affected individuals have malar and mandibular hypoplasia, absent or dysplastic
  temporomandibular joints with flattened condyles, a thickened malar bone with
  loss of the squamosal zygomatic process, external-ear anomalies with conductive
  hearing loss, cleft palate, eyelid defects, and a distinctive scalp alopecia.
  Two recurrent variants account for the reported cases, p.Tyr129Phe and
  p.Glu303Lys; both act allosterically to increase receptor affinity for
  endothelin 3, its normally non-preferred ligand, and both behave
  pharmacologically as gain of function.
  The mechanistic signature of MFDA is a partial maxillary-to-mandibular homeotic
  transformation: ectopic ETAR activation in the maxillary prominence imposes a
  lower-jaw identity on upper-jaw skeletal elements. This is the exact inverse of
  auriculocondylar syndrome, in which loss of EDN1-EDNRA signalling transforms the
  mandible toward a maxillary identity. MFDA and auriculocondylar syndrome are
  therefore opposite-direction lesions of one arch-patterning axis, and are
  modelled here as separate diseases rather than as variants of a common entry.
  Unlike Ednra-null mice, MFDA patients have no cardiovascular malformations,
  which indicates that substantial EDNRA signalling is retained.

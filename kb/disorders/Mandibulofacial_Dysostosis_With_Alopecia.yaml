    reference_title: "Mandibulofacial dysostosis with alopecia results from ETAR gain-of-function mutations via allosteric effects on ligand binding."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "E303 is located at the intracellular end of transmembrane domain 6, and its replacement by a lysine increased flexibility of this portion of the helix, thus favoring G protein binding and leading to G protein-mediated enhancement of agonist affinity."
    explanation: >-
      Molecular dynamics simulation providing the structural mechanism for the
      p.Glu303Lys allosteric gain of function.
- name: Ectopic ETAR Activation in the Maxillary Prominence
  biological_scale: CELLULAR
  description: >
    In normal craniofacial development endothelin 1 is secreted by the epithelium
    and core mesoderm of the ventral pharyngeal arch and acts on ETAR-expressing
    cranial neural crest cells, establishing mandibular identity ventrally while
    the dorsal (maxillary) territory remains ETAR-unstimulated. A receptor that
    now responds to endothelin 3 is activated in the maxillary prominence, where
    endothelin 3 is available but endothelin 1 is not. Genetic rescue makes the
    dependency explicit: deleting Edn3 in the knock-in mice abolishes the
    craniofacial transformation.
  biological_processes:
  - preferred_term: G protein-coupled receptor signaling pathway
    term:
      id: GO:0007186
      label: G protein-coupled receptor signaling pathway
    modifier: INCREASED
  cell_types:
  - preferred_term: cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  downstream:
  - target: Maxillary-to-Mandibular Homeotic Transformation
    description: >
      Imposing the ETAR-dependent ventral identity program on maxillary neural
      crest respecifies upper-jaw skeletal elements toward lower-jaw identity.
  evidence:
  - reference: PMID:36637912
    reference_title: "Mandibulofacial dysostosis with alopecia results from ETAR gain-of-function mutations via allosteric effects on ligand binding."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mouse models carrying either of these missense mutations exhibited a partial maxillary-to-mandibular transformation, which was rescued by deleting the ligand endothelin 3 (ET3/EDN3)."
    explanation: >-
      The Edn3 deletion rescue is the decisive experiment showing that the
      pathology depends on ectopic endothelin-3-driven ETAR activation.
  - reference: PMID:36637912
    reference_title: "Mandibulofacial dysostosis with alopecia results from ETAR gain-of-function mutations via allosteric effects on ligand binding."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In craniofacial development, ET1 is secreted from the epithelium and core mesoderm in the ventral domain of the pharyngeal arches (PAs) to act on ETAR-expressing migrating cranial NCCs"
    explanation: >-
      Establishes the normal spatial restriction of endothelin-1-to-ETAR
      signalling that the MFDA variants violate.
- name: Maxillary-to-Mandibular Homeotic Transformation
  biological_scale: TISSUE
  conforms_to: "pharyngeal_arch_patterning_serial_homology#Disrupted Pharyngeal-Arch Patterning and Neural-Crest Skeletogenesis"
  description: >
    ETAR signalling in cranial neural crest acts through the Dlx5/Dlx6 code that
    assigns ventral (mandibular) identity within the first arch. Ectopic
    activation in the dorsal territory drives upper-jaw skeletal elements toward a
    lower-jaw program, giving the partial maxillary-to-mandibular transformation
    seen in the knock-in mice. The human radiographic correlate is a zygomatic
    arch that resembles that of mice with experimentally induced ectopic
    maxillary ETAR activation, together with absent temporomandibular joints,
    flattened condyles and a thickened malar bone.

    Note that MFDA is not a pure gain: the reported functional consequences are
    complex and territory-dependent, with the upper jaw showing aberrant ETAR
    signalling while the lower jaw appears to show disrupted signalling. That
    dual character is what makes the phenotype a dysostosis with micrognathia
    rather than a straightforward duplication of the mandible.
  biological_processes:
  - preferred_term: regionalization
    term:
      id: GO:0003002
      label: regionalization
    modifier: ABNORMAL
  - preferred_term: embryonic skeletal system morphogenesis
    term:
      id: GO:0048704
      label: embryonic skeletal system morphogenesis
    modifier: ABNORMAL
  downstream:
  - target: Multi-Element First and Second Arch Malformation
    description: >
      The respecified arch program produces a coordinated malformation across the
      serially related skeletal derivatives of the first and second arches.
  evidence:
  - reference: PMID:25772936
    reference_title: "Mutations in the endothelin receptor type A cause mandibulofacial dysostosis with alopecia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The zygomatic arch of individuals with MFDA resembles that of mice in which EDNRA is ectopically activated in the maxillary prominence, resulting in a maxillary to mandibular transformation"
    explanation: >-
      Anchors the human skeletal phenotype to the experimental ectopic-activation
      model and names the direction of the transformation.
  - reference: PMID:36637912
    reference_title: "Mandibulofacial dysostosis with alopecia results from ETAR gain-of-function mutations via allosteric effects on ligand binding."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the expression of Dlx5 and Dlx6, homeobox transcription factors that act downstream of ET1-ETAR signaling to determine ventral identity in PA1, extended dorsally in mutant embryos (Figure 2M). These results suggest that the Ednra mutations had an ectopic gain-of-function effect in the dorsal PA1"
    explanation: >-
      Direct, same-direction evidence for this node: in embryos carrying the
      MFDA alleles themselves (Ednra Y129F and E303K), the Dlx5/Dlx6
      ventral-identity code expands dorsally, which the authors read as an
      ectopic gain of function in dorsal PA1. This is the dorsal respecification
      the node asserts, measured in the MFDA genotype rather than inferred from
      the reciprocal knockout.
  - reference: PMID:15110048
    reference_title: "Endothelin-1 regulates the dorsoventral branchial arch patterning in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the expression of Dlx5 and Dlx6, Distalless-related homeobox genes determining the ventral identity of the anterior branchial arches, and of the mandibular marker gene Pitx1 is significantly downregulated in the ET-1(-/-) mutant"
    explanation: >-
      Establishes that Dlx5/Dlx6 ventral identity is endothelin-dependent at
      all, via the reciprocal loss-of-function experiment. Retained as
      axis-defining background only; the direction-matched claim for MFDA rests
      on the PMID:36637912 item above.
  - reference: PMID:32133772
    reference_title: "Loss-of-function of Endothelin receptor type A results in Oro-Oto-Cardiac syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "in the upper jaw, there is likely aberrant EDNRA signaling, while in the lower jaw, there appears to be disruption of EDNRA signaling"
    explanation: >-
      Supports the territory-dependent, dual character of the MFDA signalling
      defect that this node records; it is a stated interpretation rather than a
      direct measurement, hence PARTIAL.
- name: Multi-Element First and Second Arch Malformation
  biological_scale: ORGANISM
  conforms_to: "pharyngeal_arch_patterning_serial_homology#Serially Homologous Craniofacial Malformation Across Arch Derivatives"
  description: >
    The clinical phenotype is a coordinated malformation across serially related
    arch derivatives rather than an isolated defect: mandible, maxilla, malar and
    zygomatic bone, temporomandibular joint, external ear and middle-ear ossicles
    are all involved. This is the serial-homology signature the module encodes.
    Alopecia and the eyelid and palatal defects sit outside that skeletal pattern
    and are not explained by it.
  downstream: []
  evidence:
  - reference: PMID:27671791
    reference_title: "Viable Ednra (Y129F) mice feature human mandibulofacial dysostosis with alopecia (MFDA) syndrome due to the homologue mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutant mice mimic the craniofacial phenotypes of jaw dysplasia, micrognathia, dysplastic temporomandibular joints, auricular dysmorphism, and missing of the squamosal zygomatic process as described for MFDA-affected individuals."
    explanation: >-
      Enumerates the multi-element arch-derivative phenotype shared by the mouse
      model and MFDA patients.
  - reference: PMID:27671791
    reference_title: "Viable Ednra (Y129F) mice feature human mandibulofacial dysostosis with alopecia (MFDA) syndrome due to the homologue mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mutant Ednra Y129F mice exhibit hearing impairment in line with strong abnormalities of the ossicles"
    explanation: >-
      Extends the malformation to the middle-ear ossicles, second-arch
      derivatives, and links them to the hearing phenotype.
phenotypes:
- category: Craniofacial
  name: Mandibular Hypoplasia
  description: >
    Micrognathia with jaw dysplasia is a cardinal feature. It coexists with the
    maxillary-to-mandibular transformation rather than contradicting it, because
    the MFDA receptor behaves differently in the two territories. No frequency
    band is asserted anywhere in this entry: with roughly four to six reported
    probands worldwide, and with the available quotable statements coming from
    the mouse model rather than a human case series, no band is supportable.
  phenotype_term:
    preferred_term: Micrognathia
    term:
      id: HP:0000347
      label: Micrognathia
  evidence:
  - reference: PMID:36637912
    reference_title: "Mandibulofacial dysostosis with alopecia results from ETAR gain-of-function mutations via allosteric effects on ligand binding."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the mandible (especially the proximal region) is more dysplastic in patients with MFDA than the mutant mice"
    explanation: >-
      Human primary support for mandibular dysplasia, and for it being more severe
      in patients than in the model. PARTIAL rather than SUPPORT because the
      sentence establishes mandibular dysplasia without itself naming micrognathia,
      which is the bound HP term.
  - reference: PMID:27671791
    reference_title: "Viable Ednra (Y129F) mice feature human mandibulofacial dysostosis with alopecia (MFDA) syndrome due to the homologue mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutant mice mimic the craniofacial phenotypes of jaw dysplasia, micrognathia, dysplastic temporomandibular joints"
    explanation: >-
      The mouse model reproduces micrognathia as described for MFDA-affected
      individuals. Corroborating rather than sole support, since the human
      statement above now carries the phenotype.
- category: Craniofacial
  name: Temporomandibular Joint Dysplasia
  description: >
    Patients with the p.Tyr129Phe variant lack temporomandibular joints
    altogether and have flattened mandibular condyles — a defect closely
    reminiscent of mice with ectopic ETAR activation in the upper jaw.
  phenotype_term:
    preferred_term: Absent or dysplastic temporomandibular joint
    term:

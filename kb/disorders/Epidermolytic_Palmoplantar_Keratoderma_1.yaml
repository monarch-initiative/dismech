- name: Oral Retinoids
  description: >-
    Systemic aromatic retinoids shed the hyperkeratotic layer within two weeks
    but leave the underlying keratinocyte defect unchanged, so the thinned
    palms and soles become tender and fragile. This limits their use: in the
    first treated family therapy had to be stopped for that reason.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: oral retinoid therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

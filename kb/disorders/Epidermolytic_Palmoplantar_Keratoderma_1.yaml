  pdb_structures:
  - pdb_id: 6UUI
    method: X-ray diffraction
    resolution_angstrom: 2.07
    target_protein: Human keratin 1 / keratin 10 coil 2B heterodimer
    description: >-
      Closest experimental template for the end of the keratin 9 rod. Keratin 10
      is the type I keratin most similar to keratin 9, and keratin 10 residues
      337 to 455 align without gaps to keratin 9 residues 342 to 460. No
      experimental structure of keratin 9 exists, and no keratin heterodimer
      structure covers coil 1A, where most disease variants lie.
  - pdb_id: 3TNU
    method: X-ray diffraction
    resolution_angstrom: 3.0
    target_protein: Human keratin 5 / keratin 14 coil 2B heterodimer
    description: >-
      Second type I / type II heterodimer template for the helix termination
      segment.
  notes: >-
    Residue numbers follow UniProt P35527 (623 residues). Papers from 1994 to
    about 2006 number the protein one lower, so their R162W, N160K, M156V,
    L159V, Q171P and L457F are Arg163Trp, Asn161Lys, Met157Val, Leu160Val,
    Gln172Pro and Leu458Phe here. Each reference residue was checked against the
    canonical sequence.

    Placement of the variants on the protein was computed for this entry on
    2026-11-26 from UniProt P35527 features, an alignment of the 28 reviewed
    human type I keratins, the AlphaFold model AF-P35527-F1 (version 6) and the
    crystal structures named above. A heptad register fitted to the hydrophobic
    periodicity of coil 1A puts Met157, Val171 at position a and Leu160, Tyr167
    at position d, the positions that pack against the partner chain in a
    coiled coil; Asn161 and Leu168 are at e and Arg163 at g, the positions that
    flank that seam; Gln172 is at b, on the outer face, and its only disease
    substitution is proline, which breaks the helix. Met157, Leu160, Asn161,
    Arg163, Tyr167, Leu168, Val171 and Tyr454 are identical in all 28 type I
    keratins; Leu458 is leucine in 25 and isoleucine in 3. AlphaFold models the
    rod with high confidence (mean pLDDT 86 for coil 1A, 94 for coil 1B, 93 for
    coil 2) and the head and tail with low confidence (35 and 38). The helix termination residues were checked against the
    type I chains of the keratin heterodimer crystal structures. The
    counterpart of Tyr454 has its side chain within 4 angstroms of the type II
    partner in the keratin 5 / keratin 14 structure 3TNU and the keratin 1 /
    keratin 10 structure 4ZRY, and the counterpart of Leu458 does so in the
    same two; in the higher-resolution keratin 1 / keratin 10 structure 6UUI
    both are more than 5 angstroms from the partner although core positions up
    to keratin 10 Ile446 (keratin 9 Ile451) are in contact. The last turn of
    the rod is therefore frayed in some crystals and packed in others, which
    fits a segment whose role is the end-to-end overlap of molecules during
    filament elongation more than dimer stability. The same analysis was done
    independently, with scripts and result tables, in the KRT9 review in the
    ai4curation/ai-gene-review repository (genes/human/KRT9/KRT9-bioinformatics),
    and the two agree on domain boundaries, register and conservation.

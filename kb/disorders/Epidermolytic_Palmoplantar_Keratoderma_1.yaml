    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "In 1901, Hans Vörner observed a family with a diffuse non-transgredient palmoplantar keratoderma of autosomal dominant inheritance."
    explanation: The keratoderma is non-transgredient, that is, it does not spread beyond the palm and sole onto the dorsal skin.

- name: Loss of Palmoplantar Keratinocyte Mechanical Resilience
  conforms_to: "keratin_intermediate_filament_fragility#Loss of Keratinocyte Mechanical Resilience"
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Palm and sole epidermis carries the highest mechanical load of any skin, and
    keratin 9 is the keratin that this skin adds to the usual suprabasal set.
    Without a working keratin 9 network the suprabasal keratinocyte cannot
    withstand pressure and friction. Complete absence of keratin 9 in the mouse
    has the same consequence, confined to the stress-bearing footpads.

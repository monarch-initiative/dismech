  role: effector
  biological_scale: TISSUE
  description: >-
    The palmoplantar epidermis thickens (acanthosis) through increased
    keratinocyte proliferation, and the differentiation programme of the upper
    layers is disturbed, producing an excessive, retained stratum corneum.

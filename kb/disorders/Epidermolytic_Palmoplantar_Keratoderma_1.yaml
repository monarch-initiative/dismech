    explanation: Variants at the other end of the rod produce the same disease, so the two rod ends are the functionally critical regions.
  - reference: PMID:7507869
    reference_title: "Molecular characterization of the body site-specific human epidermal cytokeratin 9: cDNA cloning, amino acid sequence, and tissue specificity of gene expression."
    supports: SUPPORT

    term:
      id: HP:0007447
      label: Diffuse palmoplantar hyperkeratosis
  evidence:
  - reference: PMID:152116
    reference_title: "Epidermolytic hereditary palmoplantar keratoderma. Report of a family and treatment with an oral aromatic retinoid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "10-14 days after the onset of therapy, the hyperkeratotic horny layer was sequestered in large sheets resulting in normal appearing skin and restoration of normal surface sensitivity."
    explanation: Four patients responded with shedding of the hyperkeratosis.
  - reference: PMID:152116
    reference_title: "Epidermolytic hereditary palmoplantar keratoderma. Report of a family and treatment with an oral aromatic retinoid."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL

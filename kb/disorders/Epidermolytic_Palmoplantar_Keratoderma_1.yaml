    snippet: "Clinically, affected family members showed the typical diffuse keratoses over the entire surface of the palms and soles sharply bordered by red margins."
    explanation: Clinical description from the family in which the disease was first described, with a KRT9 variant confirmed.
  - reference: PMID:12192490

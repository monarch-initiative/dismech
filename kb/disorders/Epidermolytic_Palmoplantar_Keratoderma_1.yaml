    evidence:
    - reference: PMID:27003758
      reference_title: "A Small Indel Mutant Mouse Model of Epidermolytic Palmoplantar Keratoderma and Its Application to Mutant-specific shRNA Therapy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "shRNA-mediated knockdown of mutant protein resulted in almost normal morphology and functions of the skin, whereas the same shRNA had a negligible effect in wild-type K9 mice."
      explanation: Knocking down only the mutant allele rescues the knock-in mouse.
  evidence:
  - reference: PMID:22402445
    reference_title: "Generic and personalized RNAi-based therapeutics for a dominant-negative epidermal fragility disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The allele-specific inhibitors displayed similar potencies and, importantly, exhibited strong specificities for their target dominant-negative alleles with little or no effect on wild-type K9."
    explanation: Allele-specific siRNAs discriminate mutant from wild-type keratin 9.
  - reference: PMID:27003758
    reference_title: "A Small Indel Mutant Mouse Model of Epidermolytic Palmoplantar Keratoderma and Its Application to Mutant-specific shRNA Therapy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "shRNA-mediated knockdown of mutant protein resulted in almost normal morphology and functions of the skin, whereas the same shRNA had a negligible effect in wild-type K9 mice."
    explanation: In vivo efficacy in the knock-in mouse.
- name: Mutant Allele CRISPR-Cas9 Disruption

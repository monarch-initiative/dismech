name: Epidermolytic Palmoplantar Keratoderma 1
creation_date: "2026-11-26T19:00:00Z"
category: Mendelian
description: >-
  Epidermolytic palmoplantar keratoderma 1 is the autosomal dominant diffuse
  palmoplantar keratoderma caused by heterozygous variants in KRT9. Keratin 9 is
  a type I keratin made only by the suprabasal keratinocytes of palm and sole
  epidermis, where it pairs with a type II keratin to form the intermediate
  filament network that lets this skin bear load. Nearly all disease alleles are
  missense or small in-frame changes at the two ends of the central rod domain,
  most of them in the first twenty residues of coil 1A. The mutant chain is
  made, enters the filament network and disrupts it, so one mutant allele is
  enough: the network collapses into tonofilament clumps, suprabasal
  keratinocytes lyse under mechanical load, and the epidermis responds with
  stress-keratin induction, hyperproliferation and a thick stratum corneum.
  The result is an even, yellowish thickening of the whole palm and sole with a
  sharp red border, appearing in the first weeks or months of life and limited
  to the body sites where keratin 9 is expressed.

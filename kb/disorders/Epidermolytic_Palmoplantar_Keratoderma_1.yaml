mechanistic_hypotheses:
- hypothesis_group_id: dominant_negative_filament_disruption
  hypothesis_label: Mutant keratin 9 disrupts the keratin filament network in trans
  status: CANONICAL
  description: >-
    A keratin 9 chain carrying a rod-end substitution is incorporated into
    heterodimers and filaments together with wild-type keratins and prevents
    normal filament assembly, so the network of the suprabasal palmoplantar
    keratinocyte collapses and the cell loses its mechanical resilience. Three
    lines of evidence separate this from haploinsufficiency. Mice heterozygous
    for a Krt9 null allele are normal, while mice heterozygous for a knock-in of
    a patient allele are affected. Silencing only the mutant allele in the
    knock-in mouse restores near-normal skin. And predicted loss-of-function
    KRT9 alleles are tolerated in the general population (gnomAD v4.1 gene
    constraint read on 2026-11-26: pLI 5.5e-8, observed/expected
    loss-of-function 0.66 with 90% interval 0.50 to 0.88), with no frameshift or
    canonical splice allele classified pathogenic in ClinVar.
  evidence:
  - reference: PMID:27003758
    reference_title: "A Small Indel Mutant Mouse Model of Epidermolytic Palmoplantar Keratoderma and Its Application to Mutant-specific shRNA Therapy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The phenotype confirmed that EPPK is a dominant-negative condition, such that mice heterozygotic for the K9-mutant allele (Krt9(+/mut)) showed a clear EPPK-like phenotype."
    explanation: A heterozygous knock-in of a patient allele is sufficient for disease in the mouse.
  - reference: PMID:23962810
    reference_title: "Keratin 9 is required for the structural integrity and terminal differentiation of the palmoplantar epidermis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Importantly, mice heterozygous for the K9-null allele (Krt9(+/-)) show neither an overt nor histological phenotype, demonstrating that one Krt9 allele is sufficient for the developing normal palmoplantar epidermis."
    explanation: Half the normal amount of keratin 9 is enough in the mouse, which argues against haploinsufficiency as the human mechanism.
  - reference: PMID:8647270
    reference_title: "Keratin 9 point mutation in the pedigree of epidermolytic hereditary palmoplantar keratoderma perturbs keratin intermediate filament network formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results indicate that the point mutation seen in our patients had a dominant-negative effect on keratin network formation."
    explanation: Mutant keratin 9 expressed in cells that also make wild-type keratins disrupts the network.
- hypothesis_group_id: k9_yap1_cytoplasmic_retention
  hypothesis_label: Loss of keratin 9-dependent cytoplasmic retention of YAP1 drives the hyperkeratosis
  status: EMERGING
  description: >-
    Keratin 9 is proposed to hold the transcriptional co-activator YAP1 in the
    cytoplasm of differentiating palmoplantar keratinocytes through the YAP1
    binding protein 14-3-3 sigma. Disease variants are reported to lose this
    property, YAP1 becomes nuclear in suprabasal cells, keratin 16 rises, and
    inhibiting YAP1 improves the keratoderma of Krt9 null mice. This would make
    part of the hyperkeratosis a signalling consequence of losing keratin 9
    function and not only a repair response to cell lysis. The model rests on
    one research group's work, and the in vivo rescue was done in null mice,
    not in a heterozygous knock-in that matches the human genotype. Causal
    edges that belong to this model carry
    hypothesis_groups: [k9_yap1_cytoplasmic_retention].
  evidence:
  - reference: PMID:42918816
    reference_title: "Keratin 9 regulates mechanosensitive YAP1 signalling in palmoplantar epidermis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mechanistically, K9 interacts with the YAP1 binding protein 14-3-3σ and sequesters YAP1 in the cytoplasm, inhibiting its transcriptional activity; these functions are disrupted by KRT9-pEDD-causing variants in K9."
    explanation: States the proposed function of keratin 9 and its loss with disease variants.
  - reference: PMID:42918816
    reference_title: "Keratin 9 regulates mechanosensitive YAP1 signalling in palmoplantar epidermis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Finally, we show that genetic or pharmacological inhibition of YAP1 ameliorates palmoplantar keratoderma in Krt9 null mice."
    explanation: In vivo evidence that YAP1 activity contributes to the keratoderma when keratin 9 is absent.
pathophysiology:
- name: KRT9 Dominant-Negative Rod-End Variant
  conforms_to: "keratin_intermediate_filament_fragility#Dominant-Negative Keratin Variant in a Filament Assembly Domain"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Keratin 9 is a structural protein. Its central rod domain (residues 153 to
    465 of the 623-residue chain) forms a parallel coiled coil with a type II
    keratin, and these heterodimers assemble into the keratin filaments of the
    suprabasal palmoplantar keratinocyte. Disease variants are heterozygous
    missense or small in-frame changes at the two ends of the rod: the helix
    initiation segment at the start of coil 1A (Met157, Leu160, Asn161, Arg163,
    Tyr167, Leu168, Val171, Gln172) and the helix termination segment at the end
    of coil 2 (Tyr454, Leu458, and a histidine insertion beside His455). Arg163,
    the counterpart of keratin 14 Arg125 and keratin 10 Arg156, accounts for
    about half of reported families. The mutant chain is stable and is built
    into filaments alongside the wild-type chain, where it interferes with
    assembly. The effect on the gene's function is therefore a loss of normal
    keratin 9 filament function produced by a dominant-negative protein, not a
    reduction in the amount of protein and not a new activity.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    gene:
      preferred_term: KRT9
      term:
        id: hgnc:6447
        label: KRT9
    description: >-
      Germline heterozygous missense variants and small in-frame insertions or
      deletions at the helix initiation and helix termination segments of the
      keratin 9 rod domain.

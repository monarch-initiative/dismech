- name: Mutant Allele-Specific RNA Interference
  description: >-
    Preclinical. Because the mutant protein is the cause and one normal allele
    is sufficient, silencing only the mutant transcript should restore the
    filament network. Allele-specific siRNAs exist for four common alleles, and
    a mutant-specific short hairpin RNA restored near-normal skin in the
    knock-in mouse. No human trial has been reported.

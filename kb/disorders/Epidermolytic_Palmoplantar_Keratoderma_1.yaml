    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most cases of EPPK are caused by mutations in the gene encoding the palm- and sole-specific keratin 9 (K9), and this provides an option for molecular diagnosis of this condition."
    explanation: Supports molecular testing of KRT9 as a diagnostic route.
  - reference: PMID:23397986
    reference_title: "Epidermolytic palmoplantar keratoderma caused by activation of a cryptic splice site in KRT9."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present data indicate the need to screen keratin genes in their entirety, as mutations altering domains of lesser functional importance may exert their deleterious effect at the transcriptional level."
    explanation: Reason to sequence the whole gene and not only exon 1.
animal_models:
- name: Krt9 Tyr144delinsTrpLeu knock-in mouse
  species: Mouse
  genotype: Krt9 c.434delAinsGGCT (p.Tyr144delinsTrpLeu), heterozygous or homozygous
  genes:
  - preferred_term: Krt9
    term:
      id: MGI:96696
      label: Krt9
  publication: PMID:27003758
  description: >-
    Knock-in of the mouse counterpart of human p.Tyr167delinsTrpLeu at the
    endogenous locus. Heterozygotes develop hyperpigmented calluses on the
    weight-bearing footpads; homozygotes do so earlier. Mouse Krt9 is the
    ortholog of human KRT9.
  evidence:
  - reference: PMID:27003758
    reference_title: "A Small Indel Mutant Mouse Model of Epidermolytic Palmoplantar Keratoderma and Its Application to Mutant-specific shRNA Therapy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The phenotype confirmed that EPPK is a dominant-negative condition, such that mice heterozygotic for the K9-mutant allele (Krt9(+/mut)) showed a clear EPPK-like phenotype."
    explanation: Describes the model and its heterozygous phenotype.
  modeled_mechanisms:
  - target: Keratin Filament Network Collapse and Tonofilament Aggregation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      A patient allele at the endogenous locus, in the heterozygous state,
      reproduces tonofilament aggregation and suprabasal cytolysis.
    limitations: >-
      Lesions are limited to footpads, which are a small part of the mouse paw,
      and appear after weeks of weight bearing, whereas human disease covers the
      whole palm and sole from infancy.
    evidence:
    - reference: PMID:27003758
      reference_title: "A Small Indel Mutant Mouse Model of Epidermolytic Palmoplantar Keratoderma and Its Application to Mutant-specific shRNA Therapy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Ultrastructural examination showed cytolysis of keratinocytes and abnormal aggregation of tonofilaments in the suprabasal layers of the epidermis"
      explanation: The model shows the ultrastructural lesion of the human disease.
- name: Krt9 null mouse
  species: Mouse
  genotype: Krt9 -/- (and Krt9 +/-)
  genes:
  - preferred_term: Krt9
    term:
      id: MGI:96696
      label: Krt9
  publication: PMID:23962810
  description: >-
    Complete absence of keratin 9. Homozygotes develop footpad calluses with
    hyperproliferation, impaired terminal differentiation and stress-keratin
    induction; heterozygotes are normal.
  evidence:
  - reference: PMID:23962810
    reference_title: "Keratin 9 is required for the structural integrity and terminal differentiation of the palmoplantar epidermis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Importantly, mice heterozygous for the K9-null allele (Krt9(+/-)) show neither an overt nor histological phenotype, demonstrating that one Krt9 allele is sufficient for the developing normal palmoplantar epidermis."
    explanation: Describes the model and the absence of a heterozygous phenotype.
  modeled_mechanisms:
  - target: Loss of Palmoplantar Keratinocyte Mechanical Resilience
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Shows what total loss of keratin 9 function does to load-bearing
      epidermis, and that half dosage is harmless.
    limitations: >-
      The genotype differs from the human one. Patients are heterozygous for an
      interfering protein and have no reduction in keratin 9 amount, so this
      model has no mutant protein and no tonofilament aggregates; it reports on
      the consequence of losing keratin 9 function, not on how the human allele
      removes it.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The mutant keratin 9 chain and the filament aggregates it produces are
        absent from this model, so it cannot report on the dominant-negative
        step itself.
    evidence:
    - reference: PMID:23962810
      reference_title: "Keratin 9 is required for the structural integrity and terminal differentiation of the palmoplantar epidermis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Together, our data demonstrate that complete ablation of K9 is not tolerable in vivo and that K9 is required for terminal differentiation and maintaining the mechanical integrity of palmoplantar epidermis."
      explanation: The null mouse establishes the requirement for keratin 9 in palmoplantar mechanical integrity.
discussions:
- discussion_id: eppk1_hyperkeratosis_driver
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: "dismech curation (issue #19046)"
  posed_date: "2026-11-26T00:00:00Z"
  prompt: >-
    In patients, who are heterozygous for a dominant-negative KRT9 allele, how
    much of the hyperkeratosis is a repair response to keratinocyte lysis and
    how much is a direct signalling consequence of losing keratin 9 function,
    for example through nuclear YAP1?
  attaches_to:
  - pathophysiology#Loss of Keratin 9-Dependent Cytoplasmic YAP1 Retention
  - pathophysiology#Stress Keratin K6 and K16 Induction
  - pathophysiology#Epidermal Hyperproliferation and Impaired Terminal Differentiation
  rationale: >-
    The filament-fragility chain is well supported from variant to cytolysis.
    The step from cytolysis to hyperproliferation is described but not
    explained. The YAP1 model offers a mechanism, but its in vivo rescue was
    shown in Krt9 null mice, which have no mutant protein and no tonofilament
    aggregates. The answer matters for treatment: if signalling dominates, a
    YAP1 inhibitor could help patients; if lysis dominates, only removing the
    mutant protein will.
  evidence:
  - reference: PMID:42918816
    reference_title: "Keratin 9 regulates mechanosensitive YAP1 signalling in palmoplantar epidermis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Finally, we show that genetic or pharmacological inhibition of YAP1 ameliorates palmoplantar keratoderma in Krt9 null mice."
    explanation: The rescue that motivates the question was shown in null mice, not in a heterozygous knock-in.
  proposed_experiments:
  - experiment_id: eppk1_yap1_inhibition_in_knockin
    name: YAP1 inhibition in the heterozygous Krt9 knock-in mouse
    description: >-
      Repeat the genetic and pharmacological YAP1 inhibition experiments in mice
      heterozygous for the Krt9 Tyr144delinsTrpLeu allele, and score footpad
      thickness, proliferation, keratin 16 and suprabasal cytolysis separately.
    would_support:
    - pathophysiology#Loss of Keratin 9-Dependent Cytoplasmic YAP1 Retention
    supporting_outcome:
    - >-
      Hyperkeratosis and proliferation fall with YAP1 inhibition while
      tonofilament aggregation and cytolysis persist.
    refuting_outcome:
    - >-
      YAP1 inhibition leaves footpad thickness unchanged in the knock-in mouse
      although it works in the null mouse.
- discussion_id: eppk1_type_ii_partner
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: "dismech curation (issue #19046)"
  posed_date: "2026-11-26T00:00:00Z"
  prompt: >-
    Which type II keratin does keratin 9 pair with in human palmoplantar
    epidermis?
  attaches_to:
  - pathophysiology#KRT9 Dominant-Negative Rod-End Variant
  rationale: >-
    Keratins are obligate type I / type II heterodimers, so the dominant-negative
    effect of mutant keratin 9 is exerted through its partner. Keratin 1 is the
    usual assumption because KRT1 variants cause a clinically similar
    epidermolytic keratoderma, but keratin 1 and keratin 10 levels are unchanged
    in Krt9 null footpads, and a proteomic study proposed keratin 6C. The
    structural templates used to place the coil 2 variants are keratin 1 /
    keratin 10 and keratin 5 / keratin 14 heterodimers; if the true partner
    differs, the interface contacts at the end of the rod may differ too.
  evidence:
  - reference: PMID:37467889
    reference_title: "Proteomic profiling reveals KRT6C as a probable hereterodimer partner for KRT9: New insights into re-classifying epidermolytic palmoplantar keratoderma (EPPK) and a milder form of pachyonychia congenita (PC-K6c) as a group of genetic cutaneous disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "In this study, we proved that keratin 6C (KRT6C) is a probable hereterodimer partner for KRT9."
    explanation: The competing proposal for the partner.
notes: >-
  Name. The entry keeps the MONDO and OMIM series name. A 2025 consensus
  classification renamed the palmoplantar keratodermas as palmoplantar
  epidermal differentiation disorders (PMID:40106577), under which this disease
  is KRT9-pEDD; recent primary papers use that name (PMID:42918816,
  PMID:40993822), and it is kept as a synonym. No "KRT9-related" name is in use.

  Relation to other entries. MONDO splits epidermolytic palmoplantar
  keratoderma by gene: this term is the KRT9 disease, and MONDO:0957303
  (palmoplantar keratoderma, epidermolytic, 2) is the KRT1 disease, curated as a
  subtype of the KRT1_Keratinopathies entry. The two cannot be told apart
  reliably at the bedside.

  No GeneReviews chapter covers this disease or KRT9 (checked with
  `just check-genereviews`). The phenotype list was taken from the 22-family
  German series, the family originally described by Vörner, later pedigree
  reports, and two literature tallies of KRT9 cases (100 families in
  PMID:30666268; 22 cases with features beyond the keratoderma in
  PMID:31525823). Digital mutilation and palmar constriction bands have each been
  reported in single families (PMID:21410681, PMID:31525823) and are not
  curated as phenotypes. Mycotic superinfection of the keratoderma was found in
  two members of the Vörner family (PMID:12192490); it is not curated as a
  phenotype because every HPO fungal skin infection term describes recurrent
  or unusual infection, which that report does not claim. Leads seen only in
  secondary citations, whose primary reports are not cached: nail lesions
  (Küster 2002, Liang 2014), parchment-like scaling with Arg163Trp (Warmuth
  2000), and cosegregation with breast and ovarian cancer in one Asn161Tyr
  family (Torchard 1994), all as listed in PMID:31525823. A review of inherited
  keratodermas lists secondary dermatophyte infection and pitted keratolysis
  with malodour (PMID:31334055), but it describes the epidermolytic and
  non-epidermolytic diffuse keratodermas together, so those features are not
  attributed to this disease here.

  Keratin 9 expression itself responds to epidermal state: in Krt16 null mouse
  paw skin Krt9 is strongly reduced before lesions appear (PMID:31220272). That
  observation belongs to pachyonychia congenita and is not part of the causal
  chain here, but it shows that loss of keratin 9 can be a downstream event in
  other keratodermas.

- name: Loss of Keratin 9-Dependent Cytoplasmic YAP1 Retention
  role: modifier
  biological_scale: CELLULAR
  description: >-
    In healthy suprabasal palmoplantar keratinocytes YAP1 is weak and
    cytoplasmic. In lesional skin from patients with KRT9 variants, and in Krt9
    null mouse footpads from postnatal day 3, YAP1 is nuclear in the
    differentiating layers. Keratin 9 is reported to bind 14-3-3 sigma and
    retain YAP1 in the cytoplasm, a property that disease variants lose.
  cell_types:
  - preferred_term: suprabasal keratinocyte of palm and sole epidermis
    term:
      id: CL:4033013
      label: suprabasal keratinocyte
  biological_processes:
  - preferred_term: YAP1-dependent Hippo pathway output
    term:
      id: GO:0035329
      label: hippo signaling
    modifier: ABNORMAL
  evidence:
  - reference: PMID:42918816
    reference_title: "Keratin 9 regulates mechanosensitive YAP1 signalling in palmoplantar epidermis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By contrast, lesional skin from patients with KRT9-pEDD exhibited strong nuclear YAP1 signal in the suprabasal epidermis"
    explanation: Patient biopsies show the abnormal nuclear YAP1 that the model predicts.
  - reference: PMID:42918816
    reference_title: "Keratin 9 regulates mechanosensitive YAP1 signalling in palmoplantar epidermis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that loss of K9 function in humans through dominant-negative missense alleles disrupts YAP1 subcellular partitioning and induces upregulation of K16."
    explanation: The authors attribute the YAP1 change in patients to loss of keratin 9 function through dominant-negative alleles.
  downstream:
  - target: Stress Keratin K6 and K16 Induction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - k9_yap1_cytoplasmic_retention
    description: Nuclear YAP1 is proposed to raise keratin 16 expression.
    evidence:
    - reference: PMID:42918816
      reference_title: "Keratin 9 regulates mechanosensitive YAP1 signalling in palmoplantar epidermis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "K9 loss-of-function variants driving KRT9-pEDD, a palmoplantar epidermal differentiation disorder, result in aberrant YAP1 subcellular partitioning and elevated levels of the stress-induced keratin 16 (KRT16/K16)."
      explanation: Associates the YAP1 change with raised keratin 16 in patient skin.
  - target: Epidermal Hyperproliferation and Impaired Terminal Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:

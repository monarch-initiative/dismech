    snippet: "R162W was detected in five unrelated families and affects the corresponding residue in the keratin 14 and keratin 10 genes that is also altered in cases of epidermolysis bullosa simplex and generalised epidermolytic hyperkeratosis, respectively."
    explanation: The recurrent arginine (Arg163 in current numbering) is the same rod position that is mutated in keratin 14 and keratin 10 disease.
  - reference: PMID:10233272
    reference_title: "Epidermolytic palmoplantar keratoderma due to a novel type of keratin mutation, a 3-bp insertion in the keratin 9 helix termination motif."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

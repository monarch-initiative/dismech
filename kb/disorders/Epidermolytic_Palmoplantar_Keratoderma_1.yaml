genetic:
- name: KRT9 heterozygous dominant-negative variants
  gene_term:
    preferred_term: KRT9
    term:
      id: hgnc:6447
      label: KRT9
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal Dominant
    evidence:
    - reference: PMID:7512862
      reference_title: "Keratin 9 gene mutations in epidermolytic palmoplantar keratoderma (EPPK)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients with epidermolytic palmoplantar keratoderma (EPPK), an autosomal dominant skin disease, were investigated."
      explanation: KRT9 variants were found in families with autosomal dominant disease.
  variants:
  - name: p.Arg163Trp
    synonyms:
    - R162W
    - c.487C>T
    description: >-
      Coil 1A helix initiation segment, heptad position g. Arg163 is identical
      in all 28 human type I keratins and aligns with keratin 14 Arg125 and
      keratin 10 Arg156, the hotspots of epidermolysis bullosa simplex and
      epidermolytic ichthyosis. The codon is a CpG site, which explains its
      recurrence. Substitutions at codon 163 account for 48 of 100 published
      families. Replacing the charged, flexible arginine with a bulky aromatic
      side chain at a position that flanks the hydrophobic seam of the coiled
      coil is expected to disturb the first turns of the dimer, where filament
      elongation contacts form.
    identifiers:
    - ClinVar:VCV000002997
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:30666268
      reference_title: "Genetic Analysis of KRT9 Gene Revealed Previously Known Mutations and Genotype-Phenotype Correlations in Epidermolytic Palmoplantar Keratoderma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This study confirms that codon 163 (48 of 100 cases) is a hot spot mutation site for KRT9."
      explanation: Codon 163 is the mutational hotspot across published families.
  - name: p.Arg163Gln
    synonyms:
    - R162Q
    - c.488G>A
    description: >-
      Same residue as Arg163Trp. The glutamine substitution removes the charge
      while keeping a polar side chain. It disrupts keratin network formation in
      transfected cells, and it is the allele against which an allele-specific
      siRNA was validated in vivo. It is present at very low count in gnomAD
      v4.1 (5 alleles), consistent with a fully penetrant but non-lethal
      dominant allele.
    identifiers:
    - ClinVar:VCV000003001
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:8647270
      reference_title: "Keratin 9 point mutation in the pedigree of epidermolytic hereditary palmoplantar keratoderma perturbs keratin intermediate filament network formation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We found a G to A transition in keratin 9 (K9) cDNA, resulting in the substitution of glutamine for arginine at 162, in all patients of a pedigree of EHPPK."
      explanation: Segregation of the allele (Arg163Gln in current numbering) with disease in a pedigree.
  - name: p.Asn161 substitutions
    synonyms:
    - N160K
    - N160S
    - N160I
    - N160Y
    - N160H
    description: >-
      Asn161Lys, Ser, Ile, Tyr and His. Coil 1A, heptad position e, identical in
      all 28 human type I keratins. Five different substitutions of this one
      asparagine cause disease, which indicates that the asparagine itself is
      required and not merely a small or polar residue at this site.
    evidence:
    - reference: PMID:7512862
      reference_title: "Keratin 9 gene mutations in epidermolytic palmoplantar keratoderma (EPPK)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Three KRT9 mutations, N160K, R162Q, and R162W, were identified."
      explanation: Asn161Lys (N160K in the paper's numbering) was among the first three KRT9 disease variants.
    - reference: PMID:12192490
      reference_title: "Epidermolytic palmoplantar keratoderma of Vörner: re-evaluation of Vörner's original family and identification of a novel keratin 9 mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Molecular studies revealed a novel mutation in keratin 9, N160I, in patients from the family."
      explanation: Asn161Ile (N160I) is the variant in the family Vörner described in 1901.
  - name: p.Met157 substitutions
    synonyms:
    - M156V
    - M156T
    description: >-
      Met157Val, Thr, Lys and Arg. Coil 1A, heptad position a, the first
      hydrophobic core residue of the rod and identical in all 28 type I
      keratins. Lys and Arg place a charge in the core; Val and Thr shorten the
      side chain.
    evidence:
    - reference: PMID:9856842
      reference_title: "Mutations in keratin K9 in kindreds with epidermolytic palmoplantar keratoderma and epidemiology in Northern Ireland."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These included a novel mutation M156T; as well as M156V in two kindreds; and R162Q in the remaining family."
      explanation: Met157Thr and Met157Val (M156T, M156V) in Northern Irish kindreds.
    - reference: PMID:19874353
      reference_title: "Mutations in the keratin 9 gene in Pakistani families with epidermolytic palmoplantar keratoderma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The analysis resulted in the identification of two novel (p.M157K and p.Y454H) and two recurrent (p.M157T and p.R163Q) mutations in the KRT9 of all five families."
      explanation: Met157Lys and Met157Thr in Pakistani families.
  - name: p.Tyr167delinsTrpLeu
    synonyms:
    - Y166delinsWL
    - c.500delAinsGGCT
    description: >-
      In-frame replacement of Tyr167 (coil 1A, heptad position d, identical in
      all type I keratins) by two residues. Besides removing a core tyrosine,
      the extra residue shifts the heptad register of everything that follows.
      This is the allele engineered into the knock-in mouse.
    variant_type: insertion
    evidence:
    - reference: PMID:15099359
      reference_title: "A novel mutation of keratin 9 in a large Chinese family with epidermolytic palmoplantar keratoderma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "DNA sequencing revealed a novel insertion-deletion mutation in the exon 1 of KRT9, 497delAinsGGCT, resulting in the change of tyrosine(166) to tryptophan and leucine (Y166delinsWL)."
      explanation: Original report of the allele, in the older numbering.
    - reference: PMID:27003758
      reference_title: "A Small Indel Mutant Mouse Model of Epidermolytic Palmoplantar Keratoderma and Its Application to Mutant-specific shRNA Therapy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we report a knock-in transgenic mouse model that carried a small insertion-deletion (indel) mutant of Krt9, c.434delAinsGGCT (p.Tyr144delinsTrpLeu), corresponding to the human mutation KRT9/c.500delAinsGGCT (p.Tyr167delinsTrpLeu), which resulted in a human EPPK-like phenotype"
      explanation: The mouse counterpart of this allele reproduces the disease.
  - name: Other coil 1A helix initiation variants
    description: >-
      Leu160Val, Phe and Pro (position d), Leu164Pro (position a), Leu168Ser
      (position e), Val171Met and Gly (position a) and Gln172Pro (position b).
      All lie within residues 157 to 172. The leucine and valine positions are
      hydrophobic core or core-flanking residues; the Gln172 and Leu164
      substitutions are prolines, which cannot be accommodated in an alpha
      helix.
    evidence:
    - reference: PMID:31525823
      reference_title: "Keratin 9 L164P mutation in a Chinese pedigree with epidermolytic palmoplantar keratoderma, cytokeratin analysis, and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A heterozygous mutation of c.T491C (p.L164P) of KRT9 was found within the helix initiation motif."
      explanation: Leu164Pro in a five-generation family.
    - reference: PMID:12072061
      reference_title: "Diagnosis and confirmation of epidermolytic palmoplantar keratoderma by the identification of mutations in keratin 9 using denaturing high-performance liquid chromatography."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A novel mutation was identified in a fourth family that changed valine170 to methionine."
      explanation: Val171Met (valine 170 in the paper's numbering).
  - name: Coil 2 helix termination variants
    synonyms:
    - L457F
    - 1362ins3
    description: >-
      Tyr454His (heptad position d), Leu458Phe and Leu458Pro (position a) and an
      in-frame insertion of a histidine in the same segment. These lie in the
      last eight residues of coil 2 (Thr453 to Gly460). In homologous
      keratin heterodimer crystal structures the counterpart of Tyr454 contacts
      the type II partner in most chains, while the last turn carrying Leu458
      is packed in some structures and frayed in others; the segment's role is
      thought to be the end-to-end overlap of molecules during filament
      elongation. Leu458Pro
      gave more severe disease than Leu458Phe in the reporting families.
    evidence:
    - reference: PMID:10233272
      reference_title: "Epidermolytic palmoplantar keratoderma due to a novel type of keratin mutation, a 3-bp insertion in the keratin 9 helix termination motif."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we report the first mutation in the 2B domain of KRT9, 1362ins3, leading to an insertion of histidine in the helix termination motif of the K9 polypeptide."
      explanation: First disease variant at the end of the rod.
    - reference: PMID:21715251
      reference_title: "A novel mutation within the 2B rod domain of keratin 9 in a Chinese pedigree with epidermolytic palmoplantar keratoderma combined with knuckle pads and camptodactyly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Then a novel c.T1373C (p.L458P) mutation within the sixth exon of KRT9 was validated, and this mutation presented a more severe pathogenicity than the previously reported p.L458F."
      explanation: Leu458Pro, with the authors' comparison to Leu458Phe.
    - reference: PMID:19874353
      reference_title: "Mutations in the keratin 9 gene in Pakistani families with epidermolytic palmoplantar keratoderma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All mutations occurred within the highly conserved helix initiation or termination motif of K9."
      explanation: Places Tyr454His, reported in this paper, in the helix termination segment.
  - name: c.31C>G cryptic splice donor activation
    synonyms:
    - p.Leu11Val
    description: >-
      Reads as a missense change of a poorly conserved head-domain residue but
      acts on splicing. It creates a donor site in exon 1 and removes 162 amino
      acids in frame. Counted from residue 11 this removes most of the head and
      the start of coil 1A, including the helix initiation segment, so the
      product is again a rod-end-defective chain and not a null allele.
    evidence:
    - reference: PMID:23397986
      reference_title: "Epidermolytic palmoplantar keratoderma caused by activation of a cryptic splice site in KRT9."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Despite its unusual location, the mutation was shown to be pathogenic through activation of a cryptic donor splice site, resulting in the deletion of 162 amino acids."
      explanation: The apparent missense variant causes an in-frame deletion through aberrant splicing.
  notes: >-
    A 2018 tally of 100 published families found 33 variants, 23 in coil 1A and
    7 in coil 2B. The share of all inherited palmoplantar keratoderma that KRT9
    explains depends on the population: 4 of 31 genetically solved patients in a
    Finnish series and 2 of 76 families in a Danish series in which punctate
    keratoderma predominated.

    Variants deliberately not listed as causal. p.Cys406Arg carries a UniProt
    disease annotation from one family (PMID:20964665, no abstract in PubMed),
    but it has conflicting classifications in ClinVar, lies at a poorly
    conserved surface position of coil 2 (cysteine in 10 of 28 type I keratins)
    and is too common for a penetrant dominant allele (835 alleles and 5
    homozygotes in gnomAD v4.1, read on 2026-11-26). ClinVar also
    holds one single-submitter pathogenic assertion for the tail nonsense
    variant p.Tyr558Ter (VCV000915270); no published family supports it, the
    tail is outside every region where disease variants cluster, and gnomAD
    carries frameshift alleles nearby in the tail. Both are recorded here so
    that they are not re-nominated without new evidence. An in-frame 18 bp
    deletion in linker L1 has been reported in one Japanese patient
    (PMID:37401035); PubMed holds no abstract for it, so it is noted and not
    curated.

    The type II partner of keratin 9 in vivo has not been established. Keratin 1
    is usually assumed; keratin 6C has been proposed from co-immunoprecipitation.
    No ClinGen gene-disease validity classification for KRT9 was found in the
    committed ClinGen export.
  evidence:
  - reference: PMID:7512862
    reference_title: "Keratin 9 gene mutations in epidermolytic palmoplantar keratoderma (EPPK)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three KRT9 mutations, N160K, R162Q, and R162W, were identified."
    explanation: Discovery of KRT9 variants in affected families.
  - reference: PMID:30666268
    reference_title: "Genetic Analysis of KRT9 Gene Revealed Previously Known Mutations and Genotype-Phenotype Correlations in Epidermolytic Palmoplantar Keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among these, 23 mutations are located in the 1A region (a mutation hot spot region), 7 are located in the 2B region, and the remaining 3 are synonymous mutations."
    explanation: Distribution of published variants across the rod domain.
  - reference: PMID:33914963
    reference_title: "Hereditary palmoplantar keratoderma - phenotypes and mutations in 64 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of them, 11 had a mutation in AQP5, five in SERPINB7, four in KRT9 and two in SLURP1."
    explanation: Share of KRT9 among solved cases in a Finnish cohort.
  - reference: PMID:37467889
    reference_title: "Proteomic profiling reveals KRT6C as a probable hereterodimer partner for KRT9: New insights into re-classifying epidermolytic palmoplantar keratoderma (EPPK) and a milder form of pachyonychia congenita (PC-K6c) as a group of genetic cutaneous disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "In this study, we proved that keratin 6C (KRT6C) is a probable hereterodimer partner for KRT9."
    explanation: Source of the keratin 6C partner proposal mentioned in the notes; it is a proposal, not an established pairing.

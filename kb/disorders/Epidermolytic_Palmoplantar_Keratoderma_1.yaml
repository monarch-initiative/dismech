histopathology:
- name: Epidermolytic Hyperkeratosis on Light Microscopy
  finding_term:
    preferred_term: hyperkeratosis with vacuolar degeneration of suprabasal keratinocytes
    term:
      id: NCIT:C35541
      label: Hyperkeratosis
  description: >-
    Thick compact horny layer over spinous and granular layers whose cells show
    vacuolar change and lysis. It is the finding that separates this disease
    from the non-epidermolytic diffuse keratodermas, although sampling can miss
    it.
  diagnostic: true
  evidence:
  - reference: PMID:18360110
    reference_title: "A unique pattern of dyskeratosis characterizes epidermolytic hyperkeratosis and epidermolytic palmoplantar keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 6 cases displayed the characteristic histological epidermolytic changes."
    explanation: Four patients with KRT9 variants and two with KRT1 variants all showed epidermolytic change on palm biopsy.
- name: Eosinophilic Keratin Inclusions
  finding_term:
    preferred_term: dyskeratosis with eosinophilic cytoplasmic inclusions
    term:
      id: NCIT:C62570
      label: Dyskeratosis
  description: >-
    Perinuclear eosinophilic homogenisation and round to oval eosinophilic
    inclusions in suprabasal keratinocytes, the light-microscopic counterpart of
    the tonofilament clumps seen by electron microscopy.
  evidence:
  - reference: PMID:18360110
    reference_title: "A unique pattern of dyskeratosis characterizes epidermolytic hyperkeratosis and epidermolytic palmoplantar keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, intracytoplasmic and perinuclear eosinophilic homogenizations and round to oval eosinophilic inclusions were identified with varying frequencies in the involved epidermis of all 6 cases."
    explanation: Describes the inclusions and their frequency in the biopsies.
diagnosis:
- name: Skin Biopsy of Palm or Sole
  description: >-
    Light microscopy shows epidermolytic hyperkeratosis; electron microscopy
    shows tonofilament clumping in suprabasal keratinocytes.
  diagnosis_term:
    preferred_term: skin biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  evidence:
  - reference: PMID:10233272
    reference_title: "Epidermolytic palmoplantar keratoderma due to a novel type of keratin mutation, a 3-bp insertion in the keratin 9 helix termination motif."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Histologically, palmoplantar epidermis shows suprabasal cytolysis and ultrastructurally, tonofilament aggregation with overlying epidermolytic hyperkeratosis."
    explanation: The biopsy findings that define the diagnosis.
- name: KRT9 Sequencing
  description: >-
    Sequencing of KRT9 confirms the diagnosis and separates this disease from
    the KRT1 form and from other diffuse keratodermas that need surveillance for
    associated disease. Exon 1, which encodes the start of the rod, holds most
    variants, but the whole gene should be read because variants occur at the
    end of coil 2 and one acts through splicing.
  diagnosis_term:
    preferred_term: molecular genetic testing of KRT9
    term:
      id: NCIT:C15709
      label: Genetic Testing

    evidence_source: HUMAN_CLINICAL
    snippet: "All the affected members have well-demarcated diffuse skin thickening over palms and soles with an erythematous border (Fig. 2), which is a characteristic feature of EPPK."
    explanation: Every affected member of five Pakistani families with KRT9 variants had the diffuse keratoderma.

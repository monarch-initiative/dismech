biochemical:
- name: Mixed type I and type II serum transferrin isoform pattern
  presence: ABNORMAL
  context: >-
    The diagnostic biochemical signature. Intact-transferrin mass spectrometry
    (MALDI-TOF, ESI-MS/QTOF or LC-MS) shows both loss of complete N-glycans (the
    type I component) and truncated glycans lacking galactose and terminal sialic
    acid (the type II component). Transferrin isoelectric focusing, HPLC or
    capillary electrophoresis can screen for carbohydrate-deficient transferrin
    but resolve the mixed structural signature less well. Transferrin
    glycosylation normalizes substantially on D-galactose and is used as a
    treatment-response readout.
  biomarker_term:
    preferred_term: carbohydrate-deficient transferrin measurement
    term:
      id: NCIT:C101016
      label: Carbohydrate-Deficient Transferrin Measurement
  evidence:
  - reference: PMID:24499211
    reference_title: "Multiple phenotypes in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mass spectrometry revealed the presence of a variety of transferrin
      glycoforms, including forms lacking one or both glycans as well as forms
      with truncated glycans
    explanation: >-
      Describes the coexistence of missing and truncated glycoforms that defines
      the mixed pattern.
- name: Creatine kinase
  presence: INCREASED
  context: >-
    Creatine kinase is elevated during and between rhabdomyolysis episodes and is
    part of the recommended monitoring panel; it improved on D-galactose in a
    subset of treated patients.
  biomarker_term:
    preferred_term: creatine kinase measurement
    term:
      id: NCIT:C64489
      label: Creatine Kinase Measurement
  evidence:
  - reference: PMID:37181075
    reference_title: "Novel insights into the phenotype and long-term D-gal treatment in PGM1-CDG: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there was a significant improvement or normalization in transferrin
      glycosylation, liver transaminases and coagulation factors in three
      patients, creatine kinase (CK) levels in two
    explanation: >-
      Confirms CK as an abnormal, treatment-responsive analyte in PGM1-CDG.
- name: PGM1 enzyme activity in fibroblasts or leukocytes
  presence: DECREASED
  context: >-
    Direct enzymatic assay in cultured fibroblasts or leukocytes shows severely
    reduced activity (the 2021 consensus guideline, PMID:32681750, reports a
    range from undetectable to 20% of controls; red blood cells cannot be used
    because PGM1 is absent there). It is supportive but not independently
    definitive, and residual activity does not correlate reliably with clinical
    severity, so the final diagnosis rests on molecular testing.
  evidence:
  - reference: PMID:27206562
    reference_title: "Defining the Phenotype and Assessing Severity in Phosphoglucomutase-1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Regression analysis showed that there is no significant correlation between
      genotype, enzyme activity, and TPCRS score.
    explanation: >-
      Establishes the important caveat that residual enzyme activity does not
      predict disease severity.
genetic:
- name: PGM1
  notes: >-
    PGM1 (1p31.3) encodes cytosolic phosphoglucomutase-1. Disease results from
    biallelic loss-of-function alleles, predominantly missense; the consensus
    synthesis catalogued 41 variants, of which c.112A>T recurred in nine patients
    and c.988G>C in five. Missense alleles impair catalysis and can destabilize
    local enzyme structure. Genotype does not reliably predict phenotype.
  gene_term:
    preferred_term: PGM1
    term:
      id: hgnc:8905
      label: PGM1
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:24499211
    reference_title: "Multiple phenotypes in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 21 different mutations in PGM1 in 19 patients.
    explanation: >-
      Establishes PGM1 as the causal gene and documents substantial allelic
      heterogeneity.
  - reference: PMID:27206562
    reference_title: "Defining the Phenotype and Assessing Severity in Phosphoglucomutase-1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Regression analysis showed that there is no significant correlation between
      genotype, enzyme activity, and TPCRS score.
    explanation: >-
      Supports the absence of a usable genotype-phenotype correlation in
      PGM1-CDG.

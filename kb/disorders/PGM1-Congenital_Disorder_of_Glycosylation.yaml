name: PGM1-congenital disorder of glycosylation
creation_date: "2026-08-01T17:30:00Z"
description: >-
  PGM1-congenital disorder of glycosylation (PGM1-CDG, phosphoglucomutase-1
  deficiency; formerly glycogen storage disease type XIV / GSD XIV) is a rare
  autosomal recessive multisystem disorder caused by biallelic pathogenic
  variants in PGM1. Because phosphoglucomutase-1 sits at the junction of
  glycogen metabolism, glycolysis and nucleotide-sugar supply, its deficiency
  simultaneously blocks glycogen synthesis/mobilization and depletes the
  UDP-glucose and UDP-galactose pools required for protein N-glycosylation. The
  result is the archetypal mixed type I plus type II congenital disorder of
  glycosylation: serum transferrin shows both loss of complete N-glycans (type
  I) and truncated, galactose-deficient glycans (type II). Clinically, patients
  present at birth with bifid uvula and/or cleft palate and later develop
  hepatopathy, fasting hypoglycemia, exercise intolerance and rhabdomyolysis,
  coagulation abnormalities (notably antithrombin deficiency), endocrine
  dysfunction, and, most dangerously, dilated cardiomyopathy. Unlike most CDG,
  PGM1-CDG is treatable: oral D-galactose supplementation bypasses the enzymatic
  block, replenishes UDP-galactose, and corrects glycosylation, liver and
  coagulation abnormalities - but it does not rescue the cardiomyopathy.
category: Mendelian
parents:
- hereditary disease
synonyms:
- PGM1-CDG
- PGM1 deficiency
- phosphoglucomutase-1 deficiency
- congenital disorder of glycosylation type It
- CDG-It
- CDG1T
- glycogen storage disease XIV
- GSD XIV

- name: Z-Disk Destabilization via Loss of PGM1-LDB3 Interaction
  biological_scale: CELLULAR
  description: >-
    Arm (c) of the galactose-resistant cardiomyopathy hypothesis, and the only
    arm evidenced in human patient-derived cardiomyocytes rather than in mouse
    or in skeletal-muscle surrogate cells. Untargeted proteomics of iPSC-derived
    cardiomyocytes from PGM1-deficient patients shows depletion of Z-disk
    components, LDB3 (ZASP/Cypher) among them, and AlphaFold3 modelling predicts
    a direct PGM1-LDB3 interaction that was then confirmed in vitro. This places
    a structural, sarcomeric role for PGM1 alongside its enzymatic one: the
    protein is not only a metabolic enzyme whose loss starves the myocyte, it is
    a binding partner whose loss destabilizes the Z-disk. Because the claim is
    about a protein-protein interaction rather than a nucleotide-sugar pool, no
    amount of oral galactose addresses it - which is the point of curating it as
    a separate arm.

has_subtypes:
- name: Multisystem
  display_name: Multisystem form
  description: >-
    The classic infantile-onset presentation, comprising congenital malformations
    (bifid uvula, cleft palate, Pierre Robin sequence) together with
    hypoglycemia, hepatopathy, coagulation and endocrine abnormalities, myopathy
    and cardiomyopathy. Liver involvement is essentially universal in this form.
  evidence:
  - reference: PMID:32681750
    reference_title: "International consensus guidelines for phosphoglucomutase 1 deficiency (PGM1-CDG): Diagnosis, follow-up, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients present as infants with cleft palate, liver function
      abnormalities and hypoglycemia, but some patients present in adulthood with
      isolated muscle involvement.
    explanation: >-
      The consensus guideline contrasts the infantile multisystem presentation
      with the adult isolated-muscle presentation, the two forms modeled here.
- name: Myopathic
  display_name: Primary myopathic form
  description: >-
    A predominantly muscular presentation that may not become apparent until
    adolescence or adulthood, with exercise intolerance, fatigability, muscle
    weakness and recurrent exercise-induced rhabdomyolysis. Hepatic involvement
    is characteristically absent, which is a practical discriminator from the
    multisystem form.
  evidence:
  - reference: PMID:32681750
    reference_title: "International consensus guidelines for phosphoglucomutase 1 deficiency (PGM1-CDG): Diagnosis, follow-up, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      some patients present in adulthood with isolated muscle involvement
    explanation: >-
      Establishes the adult-onset, isolated-muscle presentation as a recognized
      distinct form.
  - reference: PMID:28882528
    reference_title: "Impaired glycogen breakdown and synthesis in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We investigated metabolism and physiological responses to exercise in an
      18-year-old woman with multiple congenital abnormalities and exertional
      muscle fatigue, tightness, and rhabdomyolysis.
    explanation: >-
      A worked example of the muscle-dominant presentation studied by exercise
      physiology in an adolescent/young adult.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    PGM1-CDG results from biallelic pathogenic PGM1 variants. Reported families
    include homozygous variants segregating in consanguineous kindreds as well as
    compound heterozygotes; heterozygous parents are unaffected carriers.
  evidence:
  - reference: PMID:37181075
    reference_title: "Novel insights into the phenotype and long-term D-gal treatment in PGM1-CDG: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phosphoglucomutase-1-congenital disorder of glycosylation (PGM1-CDG) (OMIM:
      614921) is a rare autosomal recessive inherited metabolic disease caused by
      the deficiency of the PGM1 enzyme.
    explanation: >-
      States the autosomal recessive mode of inheritance and anchors the entry to
      OMIM 614921, the phenotype MIM matched by the MONDO:0013968 xref.
  - reference: PMID:31563034
    reference_title: "The congenital disorder of glycosylation in PGM1 (PGM1-CDG) can cause severe cardiomyopathy and unexpected sudden cardiac death in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both parents and three other siblings were found to be heterozygous gene
      carriers without risk for the disease.
    explanation: >-
      Family segregation in this kindred (three homozygous affected sibs,
      heterozygous unaffected parents) directly demonstrates recessive
      transmission.
pathophysiology:
- name: Biallelic PGM1 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Biallelic pathogenic variants in PGM1 (1p31.3) abolish or severely reduce
    phosphoglucomutase-1 activity. PGM1 supplies the large majority of
    phosphoglucomutase activity in most tissues, and residual activity in patient
    fibroblasts or leukocytes is severely reduced (the 2021 consensus guideline,
    PMID:32681750, reports a range from undetectable to 20% of controls). Most
    reported alleles are missense and act by loss of function, often through
    catalytic impairment or local structural destabilization of the enzyme.
  genes:
  - preferred_term: PGM1
    term:
      id: hgnc:8905
      label: PGM1
  molecular_functions:
  - preferred_term: phosphoglucomutase activity
    modifier: DECREASED
    term:
      id: GO:0004614
      label: phosphoglucomutase activity
  evidence:
  - reference: PMID:24499211
    reference_title: "Multiple phenotypes in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phosphoglucomutase 1 enzyme activity was markedly diminished in all
      patients.
    explanation: >-
      The landmark cohort establishes that PGM1 variants cause a measurable
      enzymatic loss of function in affected individuals.
  - reference: PMID:28882528
    reference_title: "Impaired glycogen breakdown and synthesis in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phosphoglucomutase type 1 (PGM1) activity in muscle and fibroblasts was
      severely deficient and PGM1 in muscle was undetectable by Western blot.
    explanation: >-
      Confirms loss of PGM1 protein and activity in patient muscle and
      fibroblasts, supporting a loss-of-function mechanism.
  downstream:
  - target: Impaired Glucose-1-Phosphate and Glucose-6-Phosphate Interconversion
    causal_link_type: DIRECT
    description: >-
      Loss of enzyme activity directly removes the catalytic step that
      interconverts the two hexose phosphates.
- name: Impaired Glucose-1-Phosphate and Glucose-6-Phosphate Interconversion
  biological_scale: MOLECULAR
  description: >-
    Phosphoglucomutase-1 reversibly interconverts glucose-1-phosphate and
    glucose-6-phosphate, the metabolic node that connects glycogen (via
    glucose-1-phosphate) to glycolysis and to the hexose-phosphate pool used for
    nucleotide-sugar synthesis. When this step is blocked, flux is disrupted in
    both directions: glucose-6-phosphate generated from a dietary glucose load
    cannot be routed into glycogen, and glucose-1-phosphate released from
    glycogen cannot enter glycolysis or gluconeogenic output.
  chemical_entities:
  - preferred_term: glucose-1-phosphate
    modifier: ABNORMAL
    term:
      id: CHEBI:29042
      label: alpha-D-glucose 1-phosphate
  - preferred_term: glucose-6-phosphate
    modifier: ABNORMAL
    term:
      id: CHEBI:4170
      label: D-glucopyranose 6-phosphate
  biological_processes:
  - preferred_term: glucose metabolic process
    modifier: ABNORMAL
    term:
      id: GO:0006006
      label: glucose metabolic process
  evidence:
  - reference: PMID:37175952
    reference_title: "In Vitro Skeletal Muscle Model of PGM1 Deficiency Reveals Altered Energy Homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Phosphoglucomutase 1 (PGM1) is a key enzyme for the regulation of energy
      metabolism from glycogen and glycolysis, as it catalyzes the
      interconversion of glucose 1-phosphate and glucose 6-phosphate.
    explanation: >-
      Defines the enzymatic reaction that is lost and places it at the glycogen /
      glycolysis junction.
  - reference: PMID:24499211
    reference_title: "Multiple phenotypes in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analyses of sugar metabolites in fibroblasts from patients revealed
      increased concentrations of galactose-1-phosphate and glucose-1 phosphate,
      as compared with fibroblasts from controls.
    explanation: >-
      Direct metabolite measurement in patient fibroblasts showing accumulation
      upstream of the enzymatic block.
  downstream:
  - target: Impaired Glycogen Synthesis and Glycogenolysis
    causal_link_type: DIRECT
    description: >-
      Glycogen can neither be built from glucose-6-phosphate nor mobilized into
      glycolysis, because both routes require the PGM1 step.
  - target: UDP-Glucose Depletion and Impaired Lipid-Linked Oligosaccharide Assembly
    causal_link_type: DIRECT
    description: >-
      Reduced glucose-1-phosphate availability limits UDP-glucose synthesis, the
      donor pool feeding endoplasmic-reticulum glycan assembly.
  - target: UDP-Galactose Depletion and Impaired Golgi Galactosylation
    causal_link_type: DIRECT
    description: >-
      The Leloir pathway is functionally stalled, lowering the UDP-galactose pool
      needed for Golgi galactosylation.
- name: Impaired Glycogen Synthesis and Glycogenolysis
  biological_scale: CELLULAR
  description: >-
    Loss of the PGM1 step blocks both arms of glycogen handling. In liver, stored
    glycogen cannot be converted to glucose during fasting; in skeletal muscle,
    glycogen cannot be rapidly mobilized for anaerobic glycolysis during
    exertion. The muscle physiology closely mimics McArdle disease, including a
    flat lactate response to ischemic forearm exercise and a second-wind
    phenomenon.
  cell_types:

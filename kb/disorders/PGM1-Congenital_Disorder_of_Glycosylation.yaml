      three patients were listed for heart transplantation.
    explanation: >-
      6/19 patients (about 32%) had dilated cardiomyopathy and/or cardiac arrest;
      the dilated cardiomyopathy subset alone is below that, supporting a
      conservative OCCASIONAL band.

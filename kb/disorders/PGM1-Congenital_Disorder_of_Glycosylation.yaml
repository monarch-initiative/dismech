    snippet: >-
      Although all the patients had multisystem disease at the time of the study,
      the only apparent clinical feature at birth was a bifid uvula (in 16 of the
      19 patients).
    explanation: >-
      Establishes bifid uvula as the sole congenital sign in this cohort. The
      band is deliberately set to FREQUENT rather than to the 16/19 (84%) figure
      this snippet supports, because that cohort was ascertained partly through
      the craniofacial finding; the later 57-patient consensus review reports
      bifid uvula in a lower proportion.

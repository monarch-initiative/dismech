mechanistic_hypotheses:
- hypothesis_group_id: galactose_resistant_cardiomyopathy
  hypothesis_label: Cardiomyopathy is driven by energetic failure rather than by hypoglycosylation alone
  status: EMERGING
  description: >-
    D-galactose reliably corrects transferrin glycosylation, liver enzymes and
    coagulation factors, yet consistently fails to improve cardiac function. Two
    non-exclusive explanations are under active investigation: (a) the
    cardiomyopathy is driven principally by a mitochondrial/energetic defect that
    nucleotide-sugar repletion cannot address, paralleling the
    galactose-resistant respiratory deficit demonstrated in PGM1-null muscle
    cells; or (b) it is driven by hypoglycosylation of sarcolemmal and
    extracellular-matrix glycoproteins (laminin-211) in a compartment that oral
    galactose does not adequately reach or reverse once structural remodeling is
    established. A third arm (c) was added in 2026: PGM1 binds the Z-disk
    protein LDB3 (ZASP/Cypher), and patient-derived iPSC-cardiomyocytes lose
    Z-disk components together with mitochondrial proteins, implying a
    structural role for PGM1 that is independent of its enzymatic output
    altogether. Arm (c) is not a competitor to arm (a) so much as a candidate
    cause of it - the proposal is that Z-disk destabilization uncouples the
    sarcomere from mitochondrial metabolism. The distinction matters because it
    determines whether cardiac-directed therapy should target energetics,
    sarcomeric integrity, or PGM1 protein restoration (e.g. AAV9-PGM1 gene
    replacement); only the last addresses all three arms, and it is the only
    one of the three arms so far evidenced in human patient cardiomyocytes
    rather than mouse heart or skeletal-muscle surrogates.
  evidence:
  - reference: PMID:37175952
    reference_title: "In Vitro Skeletal Muscle Model of PGM1 Deficiency Reveals Altered Energy Homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In conclusion, an in vitro mouse muscle cell model has been established to
      study the muscle-specific metabolic mechanisms in PGM1 deficiency, which
      suggested that galactose was unable to restore the reduced energy
      production capacity.
    explanation: >-
      Supports arm (a): a galactose-resistant energetic deficit exists in
      PGM1-deficient striated muscle cells.
  - reference: PMID:36709920
    reference_title: "AAV-based gene therapy prevents and halts the progression of dilated cardiomyopathy in a mouse model of phosphoglucomutase 1 deficiency (PGM1-CDG)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      a glycoproteomic analysis unveiled broad glycosylation changes with
      significant alterations in sarcolemmal proteins including different
      subunits of laminin-211, which was confirmed by immunoblot analyses
    explanation: >-
      Supports arm (b): a specific sarcolemmal glycosylation lesion in the
      PGM1-deficient myocardium.
  - reference: PMID:41723528
    reference_title: "PGM1 deficiency is linked to sarcomeric and mitochondrial dysfunction in patient-derived iPSC-cardiomyocytes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although galactose therapy corrects glycosylation defects, cardiac
      dysfunction typically persists, suggesting a glycosylation-independent
      mechanism.
    explanation: >-
      States the premise the whole hypothesis group rests on, and motivates
      arm (c) specifically as a glycosylation-independent route.
  - reference: PMID:41723528
    reference_title: "PGM1 deficiency is linked to sarcomeric and mitochondrial dysfunction in patient-derived iPSC-cardiomyocytes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional validation confirmed extensive metabolic rewiring, energy
      depletion, and severely impaired mitochondrial respiration.
    explanation: >-
      Extends arm (a) from mouse heart and skeletal-muscle cells to human
      patient-derived cardiomyocytes.
discussions:
- discussion_id: pgm1_craniofacial_mechanism_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what mechanism does PGM1 deficiency cause bifid uvula, cleft palate and
    Pierre Robin sequence, and why is this the only manifestation present at
    birth?
  attaches_to:
  - pathophysiology#Multisystem Glycoprotein Dysfunction
  rationale: >-
    Midline palatal malformation is the earliest and one of the most consistent
    features of PGM1-CDG, and is the clinical clue that most often triggers
    diagnosis, yet no specific glycoprotein client or developmental pathway has
    been linked to it. Palatal shelf fusion depends on glycosylated extracellular
    matrix and adhesion molecules, but this remains an inference rather than a
    demonstrated mechanism in PGM1-CDG.
  evidence:
  - reference: PMID:24499211
    reference_title: "Multiple phenotypes in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We did not attempt to show experimentally the mechanisms that account for
      the clinical phenotypes of phosphoglucomutase 1 deficiency.
    explanation: >-
      The landmark study explicitly declines to establish phenotype-specific
      mechanisms, and its three proposed mechanisms cover glucose metabolism,
      glycosylation and cardiomyopathy but not the craniofacial malformation.
  proposed_experiments:
  - experiment_id: exp_pgm1_conditional_neural_crest_knockout
    name: Tissue-restricted Pgm2 knockout in cranial neural crest or palatal shelf mesenchyme
    description: >-
      Because the constitutive knockout is embryonic lethal before E9.5 and
      yields no live homozygotes, palatal development must be studied with a
      conditional allele restricted to cranial neural crest or palatal shelf
      mesenchyme, assessing shelf elevation and fusion together with matrix
      glycoprotein glycosylation.
  - experiment_id: exp_pgm1_palatal_glycoproteomics
    name: Glycoproteomic profiling of palatal tissue and craniofacial organoids
    description: >-
      Profile palatal shelf tissue or patient-derived craniofacial organoids to
      identify which adhesion and extracellular-matrix client glycoproteins are
      hypoglycosylated, in order to nominate a specific developmental mechanism.
- discussion_id: pgm1_aav_cardiac_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the AAV9-PGM1 rescue of dilated cardiomyopathy in the
    cardiomyocyte-specific Pgm2 knockout mouse predict benefit in human PGM1-CDG
    cardiomyopathy?
  attaches_to:
  - pathophysiology#Cardiomyocyte Energetic and Mitochondrial Failure
  - pathophysiology#Cardiomyocyte Sarcolemmal Glycoprotein Hypoglycosylation
  - pathophysiology#Dilated Cardiomyopathy and Progressive Heart Failure
  rationale: >-
    The constitutive Pgm2 knockout is embryonic lethal before E9.5 and produces
    no live homozygotes, so the only tractable in vivo cardiac model is a
    tamoxifen-inducible cardiomyocyte-restricted knockout in an otherwise
    PGM1-sufficient animal. That model necessarily lacks the systemic
    hypoglycemia, hepatic, endocrine and craniofacial disease of human PGM1-CDG,
    and the acute post-natal onset of the lesion differs from the lifelong
    hypomorphic state of human patients, most of whom carry missense alleles with
    residual activity rather than a null. Whether the striking AAV9 rescue
    translates to human hearts that have remodeled over years is therefore an
    open translational question, not an established result.
  evidence:
  - reference: PMID:31077402
    reference_title: "A novel phosphoglucomutase-deficient mouse model reveals aberrant glycosylation and early embryonic lethality."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this study, we demonstrated that homozygosity for Pgm2-KO mutations
      leads to embryonic lethality in mice
    explanation: >-
      Establishes why no constitutive null mouse exists and why cardiac
      conclusions rest on a conditional, tissue-restricted model.
  - reference: PMID:36709920
    reference_title: "AAV-based gene therapy prevents and halts the progression of dilated cardiomyopathy in a mouse model of phosphoglucomutase 1 deficiency (PGM1-CDG)."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To study the pathobiology of the cardiac disease observed in PGM1-CDG, we
      constructed a novel cardiomyocyte-specific conditional Pgm2 gene (mouse
      ortholog of human PGM1) knockout (Pgm2 cKO) mouse model.
    explanation: >-
      Confirms the model is cardiomyocyte-restricted and conditional, which is
      the source of the translational mismatch. Marked PARTIAL because the paper
      supports the rescue result but not its human generalizability.
  proposed_experiments:
  - experiment_id: exp_pgm1_cardiac_natural_history
    name: Genotype-stratified longitudinal cardiac natural history study
    description: >-
      Track cardiac structure and function longitudinally in genotype-stratified
      human PGM1-CDG cohorts to define the window before ventricular remodeling
      becomes irreversible, which determines whether a gene-replacement approach
      could plausibly benefit already-affected hearts.
  - experiment_id: exp_pgm1_hypomorphic_aav_trial
    name: AAV9-PGM1 in a hypomorphic knock-in mouse with established cardiomyopathy
    description: >-
      Test AAV9-PGM1 in a missense knock-in (hypomorphic) rather than null model,
      and after cardiomyopathy is already established rather than preemptively,
      to better match the human therapeutic setting.

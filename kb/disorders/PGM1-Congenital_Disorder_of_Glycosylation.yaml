    testing where indicated) are the practical implementation, and screening of
    at-risk first-degree relatives is warranted once a proband is identified.
  action_category: MONITORING
  treatment_term:
    preferred_term: cardiac surveillance
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:35562242
    reference_title: "Nutrition interventions in congenital disorders of glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, it does not treat the cardiomyopathy observed in some patients
    explanation: >-
      Establishes the rationale for cardiac management independent of
      D-galactose. Tagged OTHER because this is an expert review.
  - reference: PMID:31563034
    reference_title: "The congenital disorder of glycosylation in PGM1 (PGM1-CDG) can cause severe cardiomyopathy and unexpected sudden cardiac death in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All first-degree relatives underwent clinical examination including cardiac
      ultrasound, Holter-ECG, exercise stress test and biochemistry panel.
    explanation: >-
      Documents the concrete cardiac screening protocol applied to a PGM1-CDG

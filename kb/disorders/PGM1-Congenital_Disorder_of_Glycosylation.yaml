    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:28617415
    reference_title: "Oral D-galactose supplementation in PGM1-CDG."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro studies before treatment showed N-glycan hyposialylation, altered
      O-linked glycans, abnormal lipid-linked oligosaccharide profile, and
      abnormal nucleotide sugars in patient fibroblasts.
    explanation: >-
      Demonstrates the ER lipid-linked oligosaccharide abnormality and the
      underlying nucleotide-sugar disturbance in PGM1-CDG fibroblasts, the
      disorder-specific substitution for the module's type I trigger.
  - reference: PMID:28617415
    reference_title: "Oral D-galactose supplementation in PGM1-CDG."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      D-gal increased both UDP-Glc and UDP-Gal levels and improved lipid-linked
      oligosaccharide fractions in concert with improved glycosylation in
      PGM1-CDG.
    explanation: >-
      Rescue of the lipid-linked oligosaccharide profile by restoring nucleotide
      sugars confirms that donor depletion, not a transferase defect, drives the
      ER arm.
  downstream:
  - target: Mixed Type I and Type II Protein Hypoglycosylation
    causal_link_type: DIRECT
    description: >-
      Incompletely assembled precursors produce whole missing N-glycans, the
      type I component of the transferrin pattern.
- name: UDP-Galactose Depletion and Impaired Golgi Galactosylation
  biological_scale: MOLECULAR
  conforms_to: "congenital_disorder_of_glycosylation#Golgi N-Glycan Processing and Trafficking Defect"
  description: >-
    This is the type II (Golgi) arm. PGM1 deficiency stalls the Leloir pathway
    and lowers the UDP-galactose available to Golgi galactosyltransferases, so
    N-glycans that are transferred to protein cannot be completed: they lack
    terminal galactose and, consequently, the sialic acid that caps it. The
    UDP-galactose to UDP-glucose ratio is reduced in patient cells, and the
    resulting glycans are truncated rather than absent. This is the arm that oral
    D-galactose therapy targets directly.
  chemical_entities:
  - preferred_term: UDP-galactose
    modifier: DECREASED
    term:
      id: CHEBI:18307
      label: UDP-D-galactose
  biological_processes:
  - preferred_term: N-glycan processing
    modifier: DECREASED
    term:
      id: GO:0006491
      label: N-glycan processing
  - preferred_term: galactose metabolic process
    modifier: ABNORMAL
    term:
      id: GO:0006012
      label: galactose metabolic process
  locations:

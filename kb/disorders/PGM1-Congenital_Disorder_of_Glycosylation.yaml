- name: Cleft Palate Repair and Craniofacial Care
  description: >-
    Surgical repair of cleft palate with multidisciplinary craniofacial, airway,
    feeding, dental and speech support. Bifid uvula alone generally requires no
    surgical intervention but is the diagnostic clue that should prompt
    biochemical testing.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cleft palate repair
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:31077402
    reference_title: "A novel phosphoglucomutase-deficient mouse model reveals aberrant glycosylation and early embryonic lethality."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      At birth, affected patients have frequent malformations in the spectrum of
      bifid uvula, cleft palate, and Pierre-Robin sequence.
    explanation: >-
      Establishes the craniofacial malformations that require repair and
      multidisciplinary care. Marked PARTIAL because it documents the indication
      rather than the intervention; there is no PGM1-specific craniofacial
      surgical protocol, and management follows standard cleft/Pierre Robin care.
- name: AAV9-PGM1 Gene Replacement Therapy
  description: >-
    Experimental, preclinical only. AAV9-delivered PGM1 gene replacement both
    prevented and halted progression of dilated cardiomyopathy in the
    cardiomyocyte-specific Pgm2 knockout mouse. This is the most promising
    candidate for the galactose-resistant cardiac phenotype, but no human safety
    or efficacy data exist.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic PGM1 Loss of Function
    treatment_effect: INHIBITS
    description: >-
      Gene replacement restores PGM1 protein and enzymatic activity at the level
      of the primary lesion rather than downstream of it.
  evidence:
  - reference: PMID:36709920
    reference_title: "AAV-based gene therapy prevents and halts the progression of dilated cardiomyopathy in a mouse model of phosphoglucomutase 1 deficiency (PGM1-CDG)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Finally, augmentation of PGM1 in KO mice via AAV9-PGM1 gene replacement
      therapy prevented and halted the progression of the DCM phenotype.
    explanation: >-
      Preclinical proof of concept in the cardiac conditional knockout mouse.
      This is model-organism evidence only; no human data exist.
- name: Genetic Counseling and Family Testing
  description: >-
    Autosomal recessive counseling with a 25% recurrence risk per pregnancy for
    carrier couples, and cascade testing of siblings, who may have mild or
    late-onset disease and in reported families have been identified only after
    an index event. Prenatal and preimplantation genetic testing are available
    once the familial variants are known.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31563034
    reference_title: "The congenital disorder of glycosylation in PGM1 (PGM1-CDG) can cause severe cardiomyopathy and unexpected sudden cardiac death in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings suggest that there is a need of multidisciplinary discussion
      and genetic testing after unexpected cardiac death in the young.
    explanation: >-
      Supports family-level genetic testing, which in this kindred identified two
      additional affected siblings after the index sudden death.
  - reference: PMID:31563034
    reference_title: "The congenital disorder of glycosylation in PGM1 (PGM1-CDG) can cause severe cardiomyopathy and unexpected sudden cardiac death in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both parents and three other siblings were found to be heterozygous gene
      carriers without risk for the disease.
    explanation: >-
      Demonstrates the carrier-testing outcome that recessive counseling
      delivers: unaffected heterozygous relatives can be reassured while affected
      homozygotes are identified.
differential_diagnoses:
- name: McArdle disease
  description: >-
    Myophosphorylase (PYGM) deficiency produces an almost identical muscle
    physiology, including a flat lactate response to ischemic forearm exercise
    and the second-wind phenomenon, which was long considered pathognomonic for
    McArdle disease. PGM1-CDG is distinguished by the multisystem features
    (palatal malformation, hepatopathy, coagulopathy, cardiomyopathy) and the
    abnormal transferrin glycosylation.
  evidence:
  - reference: PMID:28882528
    reference_title: "Impaired glycogen breakdown and synthesis in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The second wind phenomenon has been considered to be pathognomonic for
      McArdle disease, but we demonstrate that it can also be present in PGM1
      deficiency.
    explanation: >-
      Explicitly establishes the diagnostic overlap that makes McArdle disease a
      key differential.
- name: Glycogen storage disease type I
  description: >-
    Glucose-6-phosphatase deficiency shares fasting hypoglycemia, lactic
    acidosis, hepatomegaly and exercise intolerance with PGM1-CDG because both
    disorders obstruct hepatic glucose output at adjacent steps, but GSD I lacks
    the glycosylation abnormality and the craniofacial and cardiac features.
  evidence:
  - reference: PMID:24499211
    reference_title: "Multiple phenotypes in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These characteristics are also seen with glycogen storage disease Ia, in
      which there is a defect in hepatic glucose-6-phosphatase.
    explanation: >-
      The landmark paper itself draws the comparison with GSD Ia for the
      hypoglycemia and exercise-intolerance phenotype.
- name: MPI-congenital disorder of glycosylation
  description: >-
    MPI-CDG is the other classically treatable CDG (with oral D-mannose) and
    likewise presents with hypoglycemia, hyperinsulinism and hepatopathy, but it
    causes protein-losing enteropathy and hepatic fibrosis rather than
    craniofacial malformation, myopathy or cardiomyopathy, and it produces a pure
    type I transferrin pattern.
  evidence:
  - reference: PMID:35562242
    reference_title: "Nutrition interventions in congenital disorders of glycosylation."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      This is especially true for MPI-CDG; which almost always presents with
      hypoglycemia and hyperinsulinism
    explanation: >-
      Documents the shared hypoglycemia/hyperinsulinism presentation that makes
      MPI-CDG a differential. Marked PARTIAL because it supports the shared
      feature rather than the full discriminating comparison.
experimental_models:
- name: PGM1-deficient patient-derived iPSC-cardiomyocytes
  description: >-
    Induced pluripotent stem cell-derived cardiomyocytes reprogrammed from
    PGM1-deficient patient fibroblasts, characterized by multielectrode-array
    recording, untargeted (glyco)proteomics, tracer metabolomics, and
    mitochondrial respiration assays. This is the first human cardiomyocyte
    model of PGM1-CDG; the cardiac arm of the disease had previously been
    studied in cardiomyocyte-specific Pgm2 knockout mice and in PGM1-null
    skeletal-muscle cells, neither of which is a human cardiomyocyte.
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Fibroblasts from PGM1-deficient patients, reprogrammed to iPSC
  culture_system: iPSC-derived cardiomyocyte monolayer on multielectrode arrays
  publication: PMID:41723528
  modeled_mechanisms:
  - target: Z-Disk Destabilization via Loss of PGM1-LDB3 Interaction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model is where the Z-disk lesion was discovered, so it recapitulates
      it by construction.
    limitations: >-
      iPSC-derived cardiomyocytes are immature relative to adult myocardium,
      with fetal-like sarcomere organization and a glycolytic rather than
      oxidative metabolic profile - both of which are the very properties this
      model is used to measure. The PGM1-LDB3 interaction rests on an
      AlphaFold3 prediction confirmed in vitro, not on structural data from
      cardiac tissue.
    readouts:
    - name: Z-disk component abundance, LDB3 included
      target: Z-Disk Destabilization via Loss of PGM1-LDB3 Interaction
      direction: DECREASED
      interpretation: >-
        Proteomic depletion of Z-disk proteins is the primary measurement
        behind this node.
      evidence:
      - reference: PMID:41723528
        reference_title: "PGM1 deficiency is linked to sarcomeric and mitochondrial dysfunction in patient-derived iPSC-cardiomyocytes."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Proteomic analyses revealed depletion of Z-disk components, including
          LDB3.
        explanation: Reports the measurement and its direction.
    - name: Contractile function by multielectrode array
      target: Z-Disk Destabilization via Loss of PGM1-LDB3 Interaction
      direction: DECREASED
      interpretation: >-
        Reduced beating frequency and impaired contractility are the functional
        consequence of the sarcomeric lesion in this model.
      evidence:
      - reference: PMID:41723528
        reference_title: "PGM1 deficiency is linked to sarcomeric and mitochondrial dysfunction in patient-derived iPSC-cardiomyocytes."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          PGM1-deficient iCMs exhibited reduced beating frequency, impaired
          contractility, and prolonged contraction kinetics.
        explanation: Reports the contractile measurements directly.
    evidence:
    - reference: PMID:41723528
      reference_title: "PGM1 deficiency is linked to sarcomeric and mitochondrial dysfunction in patient-derived iPSC-cardiomyocytes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Induced pluripotent stem cell-derived cardiomyocytes (iCMs) were
        generated from PGM1-deficient patient fibroblasts.
      explanation: >-
        Establishes that the model is patient-derived and therefore informative
        for the human cardiac node.
  - target: Cardiomyocyte Energetic and Mitochondrial Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Extends the mitochondrial arm from mouse heart and PGM1-null skeletal
      muscle cells into human cardiomyocytes.
    limitations: >-
      iPSC-cardiomyocyte metabolism is fetal-like and predominantly glycolytic,
      so a measured respiration deficit may understate or overstate what an
      adult myocardium would show. No galactose-rescue arm was reported in this
      model, so it does not itself test the treatment-resistance claim.
    readouts:
    - name: Mitochondrial respiration
      target: Cardiomyocyte Energetic and Mitochondrial Failure
      direction: DECREASED
      interpretation: >-
        Respirometry is the direct functional measurement of the energetic
        failure node.
      evidence:
      - reference: PMID:41723528
        reference_title: "PGM1 deficiency is linked to sarcomeric and mitochondrial dysfunction in patient-derived iPSC-cardiomyocytes."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Functional validation confirmed extensive metabolic rewiring, energy
          depletion, and severely impaired mitochondrial respiration.
        explanation: Reports the respiration and energy measurements.
    evidence:
    - reference: PMID:41723528
      reference_title: "PGM1 deficiency is linked to sarcomeric and mitochondrial dysfunction in patient-derived iPSC-cardiomyocytes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Recent evidence of mitochondrial abnormalities in PGM1-deficient human
        and murine heart
      explanation: >-
        Places the model's mitochondrial finding in the context of prior human
        and mouse cardiac evidence.
  evidence:
  - reference: PMID:41723528
    reference_title: "PGM1 deficiency is linked to sarcomeric and mitochondrial dysfunction in patient-derived iPSC-cardiomyocytes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Multielectrode array (MEA) recordings, untargeted (glyco)proteomics, and
      pathway analysis were performed to assess functional and molecular
      changes.
    explanation: Describes the model's readout platform.

  - reference: PMID:36873091
    reference_title: "Successful heart transplantation in an infant with phosphoglucomutase 1 deficiency (PGM1-CDG)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The latter therapy improves several systemic symptoms and biochemical
      abnormalities in PGM1-CDG but does not correct the heart failure related to
      cardiomyopathy.
    explanation: >-
      States the division of labour between D-galactose and transplantation.
- name: Perioperative and Anesthetic Precautions
  description: >-
    PGM1-CDG carries two distinct perioperative hazards that should be planned
    for before any surgery. Malignant hyperthermia with severe rhabdomyolysis has
    occurred after general anesthesia, and the coagulation abnormalities (notably
    antithrombin deficiency, but also reduced procoagulant factors) create both
    thrombotic and hemorrhagic risk, so a hemostasis panel should be reviewed
    preoperatively.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: perioperative supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:24499211
    reference_title: "Multiple phenotypes in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Malignant hyperthermia with severe rhabdomyolysis occurred in two patients
      after the administration of general anesthesia.
    explanation: >-
      Documents the anesthetic hazard that motivates pre-anesthetic evaluation.
  - reference: PMID:38968673
    reference_title: "Coagulation abnormalities and vascular complications are common in PGM1-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We recommend coagulation parameters should be routinely checked in
      individuals with PGM1-CDG or suspected of having PGM1-CDG.
    explanation: >-
      Supports routine coagulation assessment, which in the perioperative setting
      is the actionable form of that recommendation.
- name: Hydrocortisone Replacement for Secondary Adrenal Insufficiency
  description: >-
    Patients with documented ACTH/cortisol deficiency benefit from hydrocortisone
    replacement, which reduces but does not entirely eliminate hypoglycemic
    episodes. Morning cortisol and ACTH should be checked at least annually in
    patients with hypoglycemia.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986

- name: UDP-Glucose Depletion and Impaired Lipid-Linked Oligosaccharide Assembly
  biological_scale: MOLECULAR
  conforms_to: "congenital_disorder_of_glycosylation#ER Lipid-Linked Oligosaccharide Assembly Defect"
  description: >-
    This is the type I (endoplasmic-reticulum) arm of the mixed glycosylation
    defect. Reduced glucose-1-phosphate limits UDP-glucose, the donor used for
    glucosylation of the dolichol-linked oligosaccharide precursor and for
    calnexin/calreticulin quality control. Patient fibroblasts show an abnormal
    lipid-linked oligosaccharide profile, and truncated or incompletely
    transferred precursors leave N-glycosylation sequons unoccupied - detected in
    serum as whole missing transferrin glycans. Unlike the canonical type I CDG,
    the deficient element is not a glycosyltransferase of the assembly line but
    the nucleotide-sugar donor supply upstream of it.
  chemical_entities:
  - preferred_term: UDP-glucose
    modifier: DECREASED
    term:
      id: CHEBI:46229
      label: UDP-alpha-D-glucose
  biological_processes:
  - preferred_term: dolichol-linked oligosaccharide biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006488
      label: dolichol-linked oligosaccharide biosynthetic process
  locations:

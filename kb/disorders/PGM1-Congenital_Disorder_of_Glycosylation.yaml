    term:
      id: GO:0005794
      label: Golgi apparatus
  evidence:
  - reference: PMID:24499211
    reference_title: "Multiple phenotypes in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The ratio of UDP-galactose to UDP-glucose was decreased, suggesting that
      UDP-galactose is limiting for N-glycan biosynthesis
    explanation: >-
      Establishes UDP-galactose as the limiting nucleotide sugar, the mechanistic
      basis of the galactose-deficient truncated glycans.
  - reference: PMID:30982613
    reference_title: "The Metabolic Map into the Pathomechanism and Treatment of PGM1-CDG."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      replenishes the depleted levels of galactose-1-P, as well as the levels of
      UDP-glucose and UDP-galactose, the nucleotide sugars that are required for
      ER- and GA-linked glycosylation, respectively
    explanation: >-
      Tracer metabolomics assigns UDP-glucose to the ER arm and UDP-galactose to
      the Golgi arm, the two-arm split modeled by this node and its ER sibling.
  downstream:
  - target: Mixed Type I and Type II Protein Hypoglycosylation
    causal_link_type: DIRECT
    description: >-
      Incomplete Golgi galactosylation yields truncated, galactose-deficient
      glycans, the type II component of the transferrin pattern.
- name: Mixed Type I and Type II Protein Hypoglycosylation
  biological_scale: MOLECULAR
  conforms_to: "congenital_disorder_of_glycosylation#Protein Hypoglycosylation"
  role: central_effector
  description: >-
    The two arms converge on the diagnostic hallmark of PGM1-CDG: a mixed
    glycosylation defect in which serum transferrin simultaneously shows loss of
    complete N-glycans (type I, reduced site occupancy) and truncated glycans
    lacking galactose and terminal sialic acid (type II, incomplete processing).
    Very few CDG produce both patterns in one patient, and this combined
    signature on intact-transferrin mass spectrometry is the single most useful
    biochemical clue to the diagnosis. Because glycosylation modifies a large
    fraction of secreted and membrane proteins, the lesion degrades many
    unrelated client glycoproteins at once.
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  - preferred_term: Fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
  - preferred_term: protein O-linked glycosylation
    modifier: DECREASED
    term:
      id: GO:0006493
      label: protein O-linked glycosylation
  evidence:
  - reference: PMID:24499211
    reference_title: "Multiple phenotypes in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mass spectrometry of transferrin showed a loss of complete N-glycans and
      the presence of truncated glycans lacking galactose.
    explanation: >-
      The defining mixed pattern: missing whole glycans (type I) together with
      galactose-deficient truncated glycans (type II).
  - reference: PMID:31077402
    reference_title: "A novel phosphoglucomutase-deficient mouse model reveals aberrant glycosylation and early embryonic lethality."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PGM1 deficiency is increasingly recognized as a congenital disorder of
      glycosylation (CDG), where reduced N-linked glycosylation in the
      endoplasmic reticulum (ER) and Golgi is observed, resulting in both missing
      and truncated glycans (mixed type I and type II glycosylation defects)
    explanation: >-
      Explicitly names the mixed type I plus type II classification and localizes
      the two arms to ER and Golgi. Tagged OTHER because this is the review
      framing in the paper's introduction rather than its own experimental
      result.
  downstream:
  - target: Multisystem Glycoprotein Dysfunction
    causal_link_type: DIRECT
  - target: Coagulation Factor Hypoglycosylation and Antithrombin Deficiency
    causal_link_type: DIRECT
  - target: Cardiomyocyte Sarcolemmal Glycoprotein Hypoglycosylation
    causal_link_type: DIRECT
    hypothesis_groups:
    - galactose_resistant_cardiomyopathy
    description: >-
      Sarcolemmal and extracellular-matrix glycoproteins, notably laminin
      subunits, are hypoglycosylated in the myocardium. This is arm (b) of the
      galactose-resistant-cardiomyopathy hypothesis.
- name: Multisystem Glycoprotein Dysfunction
  biological_scale: ORGANISM
  conforms_to: "congenital_disorder_of_glycosylation#Multisystem Glycoprotein Dysfunction"
  role: consequence
  description: >-
    Simultaneous hypoglycosylation of many secreted and membrane glycoproteins
    produces the characteristic multisystem outflow: hepatic dysfunction with
    transaminase elevation, endocrine deficits (hypogonadotropic hypogonadism,
    secondary adrenal insufficiency, growth failure), craniofacial malformation,
    and variable neurologic involvement, in addition to the coagulation and
    cardiac arms modeled separately.
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    modifier: ABNORMAL
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
  evidence:
  - reference: PMID:35562242
    reference_title: "Nutrition interventions in congenital disorders of glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Symptoms typically start in infancy and most frequently include
      hypoglycemia (possibly leading to seizures), cleft palate/bifid uvula
      (which can lead to feeding difficulties), elevated liver enzymes,
      coagulopathy, muscle weakness and exercise intolerance (often with
      rhabdomyolysis), and, in some cases, cardiomyopathy
    explanation: >-
      Enumerates the multisystem consequence set downstream of hypoglycosylation.
      Tagged OTHER because this is an expert review summarizing the phenotype
      rather than reporting primary data.
  - reference: PMID:26768186
    reference_title: "Phosphoglucomutase-1 deficiency: Intrafamilial clinical variability and common secondary adrenal insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four out of seven patients have deteriorating adrenal function with
      abnormally low cortisol and ACTH levels during hypoglycemia and subnormal

    treatment_effect: INHIBITS
    description: >-
      Transplantation replaces the failing PGM1-deficient myocardium; it does not
      address the systemic disorder, which still requires D-galactose.
  evidence:
  - reference: PMID:36873091
    reference_title: "Successful heart transplantation in an infant with phosphoglucomutase 1 deficiency (PGM1-CDG)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac function was stable in the first 18 months of follow-up, and
      hematologic, hepatic, and endocrine laboratory findings improved during

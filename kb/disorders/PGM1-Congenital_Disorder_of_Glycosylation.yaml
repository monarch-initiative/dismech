references:
- reference: PMID:20301507
  title: "Congenital Disorders of N-Linked Glycosylation and Multiple Pathway Overview - RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
  tags:
  - GeneReviews
notes: >-
  GeneReviews baseline: no dedicated PGM1-CDG GeneReviews chapter exists. The
  only GeneReviews record retrievable for this disorder is the multi-gene
  overview "Congenital Disorders of N-Linked Glycosylation and Multiple Pathway
  Overview" (PMID:20301507), which is a RETIRED chapter kept for historical
  reference and whose PubMed abstract contains no PGM1-specific clinical
  characteristics. The phenotype baseline for this entry was therefore taken from
  the 2021 international consensus guidelines (PMID:32681750) and the landmark
  19-patient NEJM cohort (PMID:24499211), which together play the equivalent
  role.

  Deliberately out of scope for this first pass. (a) Orphanet-sourced prevalence
  evidence, because the pinned Orphadata snapshot in data/orphadata/MANIFEST.yaml
  no longer matches the upstream file checksum and refreshing it would churn all
  8,823 ORPHA cache files; the reported-case count from PMID:37181075 is used
  instead. (b) Membership of the Congenital_Disorders_of_Glycosylation grouping,
  which is maintained separately (several existing CDG entries, for example
  ALG1-CDG, are also not yet listed there). (c) Creatine supplementation
  (PMID:40242152) and the hexose-phosphate LC-MS pathophysiology work
  (PMID:41018607), which are recent single reports not yet reflected in consensus
  guidance.
  Dataset coverage (searched 2026-08-20): no relevant public dataset was found,
  and none was added. `just discover-datasets` returned only GENE_ONLY matches
  driven by the gene symbol - yeast and Candida deletion-mutant expression
  compendia in which PGM1 is a deleted yeast gene. Direct GEO DataSets searches
  for "PGM1-CDG" and "PGM1 deficiency" both return zero series. Adding any of
  the gene-name hits would be Named Entity Confusion reached through dataset
  search, which is exactly the failure mode the dataset-curation SOP warns
  about, so the datasets block is deliberately left empty rather than filled.
  The 2026 patient iPSC-cardiomyocyte study (PMID:41723528) reports proteomics
  and metabolomics but its cached text carries no repository accession.

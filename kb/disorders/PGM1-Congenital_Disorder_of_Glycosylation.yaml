    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416) category 18, "Congenital
      disorders of glycosylation", group "Disorders of N-linked protein
      glycosylation". PGM1-CDG produces a mixed type I / type II N-glycosylation

  evidence:
  - reference: PMID:28882528
    reference_title: "Impaired glycogen breakdown and synthesis in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that severe loss of PGM1 activity causes blocked muscle
      glycogenolysis that mimics McArdle disease, but may also limit glycogen
      synthesis, which broadens the phenotypic spectrum of this disorder.
    explanation: >-
      Direct in vivo exercise physiology in a patient demonstrating a blocked
      muscle glycogenolysis. Note the authors hedge the synthesis arm ("may also
      limit glycogen synthesis"), so the biosynthetic half of this node is the
      weaker of the two claims.
  - reference: PMID:24499211
    reference_title: "Multiple phenotypes in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During fasting, liver glycogen cannot be converted into glucose via
      glucose-6-phosphate, and hypoglycemia may occur.
    explanation: >-
      States the hepatic arm of the glycogen block and its link to fasting
      hypoglycemia.
  downstream:

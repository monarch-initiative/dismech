    explanation: >-
      Documents the endocrine (ACTH/cortisol axis) component of the multisystem
      glycoprotein dysfunction.
- name: Coagulation Factor Hypoglycosylation and Antithrombin Deficiency
  biological_scale: ORGANISM
  description: >-
    Coagulation and anticoagulation proteins are heavily glycosylated and are
    among the most sensitive readouts of hypoglycosylation in CDG. In PGM1-CDG
    antithrombin is the most commonly and most severely affected factor, with
    prolonged aPTT and reductions in factors XI, IX and VII also reported; a
    minority of patients suffer major thrombotic events. These abnormalities
    improve on D-galactose, making antithrombin activity a candidate treatment
    biomarker and trial endpoint.
  biological_processes:
  - preferred_term: blood coagulation
    modifier: ABNORMAL
    term:
      id: GO:0007596
      label: blood coagulation
  evidence:
  - reference: PMID:38968673
    reference_title: "Coagulation abnormalities and vascular complications are common in PGM1-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequently observed abnormality was AT (mean: 30.8% R:80-120 %)
      deficiency. Four individuals had major thrombotic events.
    explanation: >-
      Identifies antithrombin as the dominant coagulation abnormality and
      documents clinically significant thrombosis.
- name: Fasting Hypoglycemia and Hepatic Metabolic Stress
  biological_scale: ORGANISM
  description: >-
    Because hepatic glycogen cannot be released as glucose through the PGM1 step,
    fasting, intercurrent illness, or vomiting precipitate ketotic hypoglycemia,
    frequently the presenting problem in infancy. Conversely, after a glucose
    load, accumulating glucose-6-phosphate that cannot be stored as glycogen is
    diverted toward lactate and lipogenesis, contributing to transaminase
    elevation and hepatic steatosis. In young patients, hypoglycemia is primarily
    hyperinsulinemic, whereas starvation- or febrile-illness-associated ketotic
    hypoglycemia is also reported and becomes more relevant at other ages.
    Secondary ACTH/cortisol deficiency can further compound the hypoglycemia.
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: glucose homeostasis
    modifier: ABNORMAL
    term:
      id: GO:0042593
      label: glucose homeostasis
  evidence:
  - reference: PMID:24499211
    reference_title: "Multiple phenotypes in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After a dietary glucose load, large amounts of glucose-6-phosphate are
      generated, which cannot be converted into glycogen.
    explanation: >-
      Explains the postprandial diversion of hexose phosphate that accompanies
      the fasting-intolerance phenotype.
  - reference: PMID:26768186

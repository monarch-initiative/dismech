- name: Cardiomyocyte Energetic and Mitochondrial Failure
  biological_scale: CELLULAR
  description: >-
    Arm (a) of the galactose-resistant cardiomyopathy hypothesis. In the
    cardiomyocyte-specific Pgm2 (mouse PGM1 ortholog) knockout heart, glycogen
    accumulates in excess while mitochondria are swollen and fragmented and
    mitochondrial function falls, indicating that the failing myocardium has an
    energy-supply problem and not only a glycosylation problem. The parallel
    finding in PGM1-null skeletal muscle cells, where D-galactose does not
    restore respiration or ATP production, is what makes this arm the leading
    explanation for the treatment resistance of the cardiac phenotype.

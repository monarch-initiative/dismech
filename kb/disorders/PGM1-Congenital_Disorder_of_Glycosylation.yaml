- name: Dilated Cardiomyopathy
  category: Cardiovascular
  description: >-
    Dilated cardiomyopathy is the most severe and most treatment-resistant
    manifestation. Onset ranges from infancy to adulthood; it may progress
    rapidly to heart failure, cardiac arrest, transplantation, or sudden death,
    and it is the leading cause of mortality in PGM1-CDG. Crucially, it does not
    improve on D-galactose, so lifelong cardiac surveillance is required even in
    biochemically well-controlled patients.
  phenotype_term:
    preferred_term: Dilated cardiomyopathy

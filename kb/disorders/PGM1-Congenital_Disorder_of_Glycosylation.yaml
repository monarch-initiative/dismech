    reference_title: "A novel phosphoglucomutase-deficient mouse model reveals aberrant glycosylation and early embryonic lethality."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      At birth, affected patients have frequent malformations in the spectrum of
      bifid uvula, cleft palate, and Pierre-Robin sequence.
    explanation: >-
      Independent framing of the congenital craniofacial spectrum as "frequent",
      consistent with the FREQUENT band. Tagged OTHER because this is the review
      background of a mouse-model paper, not its own experimental result.

  evidence:
  - reference: PMID:26768186
    reference_title: "Phosphoglucomutase-1 deficiency: Intrafamilial clinical variability and common secondary adrenal insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hydrocortisone replacement therapy improved, but not entirely eliminated
      hypoglycemic episodes.
    explanation: >-
      Directly reports the effect of hydrocortisone replacement on hypoglycemia
      in PGM1-deficient patients.
- name: L-Thyroxine for Clinical Hypothyroidism
  description: >-
    Treat clinical hypothyroidism with L-thyroxine. Thyroid-axis surveillance is
    warranted because elevated TSH and reduced thyroxine-binding globulin are
    reported in PGM1-CDG.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

diagnosis:
- name: Intact Transferrin Mass Spectrometry
  description: >-
    First-line biochemical screen and the test that best resolves the
    characteristic mixed type I / type II signature. Transferrin isoelectric
    focusing, HPLC or capillary electrophoresis may be used as an initial
    carbohydrate-deficient-transferrin screen but resolve the structural pattern
    less well.
  evidence:
  - reference: PMID:24499211
    reference_title: "Multiple phenotypes in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of serum transferrin by means of isoelectric focusing was
      performed to screen for congenital disorders of glycosylation.
    explanation: >-
      Documents transferrin analysis as the screening entry point that first
      identified the disorder.
- name: PGM1 Molecular Genetic Testing
  description: >-
    Confirmatory testing identifies two pathogenic or likely pathogenic PGM1
    variants, with phase established where possible. Targeted PGM1 sequencing
    plus deletion/duplication analysis, CDG or metabolic-myopathy gene panels
    including PGM1, or exome/genome sequencing are all appropriate routes
    depending on the presentation.
  evidence:
  - reference: PMID:24499211
    reference_title: "Multiple phenotypes in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygosity mapping followed by whole-exome sequencing was used to
      identify a mutation in the gene for phosphoglucomutase 1 (PGM1) in two
      siblings.
    explanation: >-
      Illustrates the genomic route to molecular confirmation.
- name: Tulane PGM1-CDG Rating Scale
  description: >-
    A clinical severity scoring system (TPCRS) that stratifies patients into
    phenotypic groups from clinical history and examination. Five variables
    predict severity: congenital malformation, cardiac involvement, endocrine
    deficiency, myopathy, and growth; two of these can be assessed on physical
    examination alone, allowing rapid triage.
  evidence:
  - reference: PMID:27206562
    reference_title: "Defining the Phenotype and Assessing Severity in Phosphoglucomutase-1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Principal component analysis identified 5 variables that contributed to 54%
      variance in the cohort and are predictive of disease severity: congenital
      malformation, cardiac involvement, endocrine deficiency, myopathy, and
      growth.
    explanation: >-
      Defines the severity predictors underlying the TPCRS scoring instrument.
treatments:
- name: Oral D-Galactose Supplementation
  description: >-
    The disease-directed therapy and the feature that makes PGM1-CDG unusual
    among the CDG. Oral D-galactose enters the Leloir pathway downstream of the
    PGM1 block and directly replenishes UDP-galactose and UDP-glucose, restoring
    the nucleotide-sugar donors required for both ER and Golgi glycosylation.
    Recommended dosing is approximately 1.0 to 1.5 g/kg/day (younger patients may
    require up to 3.0 g/kg/day), maximum 50 g/day, given in divided doses with
    gradual titration to avoid gastrointestinal effects. Transferrin
    glycosylation, transaminases, antithrombin III and hypoglycemia improve;
    exercise intolerance and rhabdomyolysis improve in some. Cardiomyopathy does
    NOT improve, so galactose therapy must not create false reassurance about
    cardiac risk and lifelong cardiac surveillance remains mandatory. Monitoring
    should include ALT/AST, CK, coagulation factors including antithrombin III,
    intact transferrin or N-glycan analysis, serum galactose-1-phosphate and
    urine galactitol.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: oral monosaccharide (D-galactose) supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: D-galactose
      term:
        id: CHEBI:12936
        label: D-galactose
  target_mechanisms:
  - target: UDP-Galactose Depletion and Impaired Golgi Galactosylation
    treatment_effect: INHIBITS
    description: >-
      D-galactose bypasses the PGM1 block via the Leloir pathway and replenishes
      the depleted UDP-galactose pool, reversing the Golgi galactosylation defect
      that produces the truncated type II glycans.
  - target: UDP-Glucose Depletion and Impaired Lipid-Linked Oligosaccharide Assembly
    treatment_effect: INHIBITS
    description: >-
      Galactose loading also raises UDP-glucose and improves the lipid-linked
      oligosaccharide profile, partially correcting the ER (type I) arm.
  evidence:
  - reference: PMID:28617415
    reference_title: "Oral D-galactose supplementation in PGM1-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormal baseline results (alanine transaminase, aspartate transaminase,
      activated partial thromboplastin time) improved or normalized already using
      1 g/kg/day D-gal. Antithrombin-III levels and transferrin-glycosylation
      showed significant improvement, and increase in galactosylation and whole
      glycan content.
    explanation: >-
      Prospective nine-patient pilot trial establishing efficacy on liver,
      coagulation and glycosylation endpoints.
  - reference: PMID:28617415
    reference_title: "Oral D-galactose supplementation in PGM1-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oral D-gal supplementation is a safe and effective treatment for PGM1-CDG
      in this pilot study.
    explanation: >-
      Safety and efficacy conclusion of the prospective pilot study.
  - reference: PMID:35562242
    reference_title: "Nutrition interventions in congenital disorders of glycosylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The maximum safe dose that has been well tolerated without adverse effects
      is 50 g/day
    explanation: >-
      Source for the maximum tolerated daily dose in the dosing recommendation.
      Tagged OTHER because this is an expert review synthesizing dosing practice.
  - reference: PMID:37181075
    reference_title: "Novel insights into the phenotype and long-term D-gal treatment in PGM1-CDG: a case series."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      D-gal also failed to improve the cardiac function, which was initially
      abnormal in three patients, and remains the biggest challenge in treating
      PGM1-CDG.
    explanation: >-
      Documents the key limitation: the cardiac phenotype is not corrected.
      Marked PARTIAL because it refutes efficacy for the cardiac arm while the
      same series supports efficacy elsewhere.
  - reference: PMID:30982613
    reference_title: "The Metabolic Map into the Pathomechanism and Treatment of PGM1-CDG."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      galactose treatment of PGM1-CDG fibroblasts metabolically re-wires their
      sugar metabolism
    explanation: >-
      Tracer-metabolomic mechanism of action underpinning the treatment.
- name: Fasting Avoidance and Complex Carbohydrate Feeding
  description: >-
    Prevention of hypoglycemia by frequent complex-carbohydrate meals and snacks,
    overnight enteral feeding where needed, and a written emergency plan for
    intercurrent illness. Uncooked cornstarch before bedtime can be introduced
    after six months of age, and modified cornstarch (Glycosade) can be used after
    three years. Stabilizing glucose homeostasis by dietary means remains
    standard care alongside D-galactose.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Fasting Hypoglycemia and Hepatic Metabolic Stress
    treatment_effect: INHIBITS
    description: >-
      Continuous exogenous carbohydrate supply substitutes for the unavailable
      hepatic glycogen output.
  evidence:
  - reference: PMID:24499211
    reference_title: "Multiple phenotypes in phosphoglucomutase 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      supplementation with complex carbohydrates stabilizes blood glucose
    explanation: >-
      The landmark study's own conclusion supporting complex-carbohydrate
      management of the hypoglycemia.
  - reference: PMID:32681750
    reference_title: "International consensus guidelines for phosphoglucomutase 1 deficiency (PGM1-CDG): Diagnosis, follow-up, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The oral administration of uncooked corn starch before bedtime can be
      initiated over the age of 6 months. Modified cornstarch (Glycosade) can be
      used in children over 3 years.
    explanation: >-
      Provides guideline-backed age thresholds for uncooked and modified
      cornstarch rather than leaving complex-carbohydrate feeding as prose only.

name: RP1-Related Retinopathy
creation_date: "2026-08-13T21:00:00Z"
category: Mendelian
description: >-
  RP1-related retinopathy is an inherited retinal dystrophy caused by pathogenic
  variants in RP1, encoding a 2,156-amino-acid microtubule-associated protein
  (MAP) localized to the connecting cilium and axoneme of photoreceptors. RP1
  contains an N-terminal doublecortin (DCX) domain and a bifocal (BIF) domain
  and is required for correct orientation and higher-order stacking of the
  photoreceptor outer segment discs. RP1 has four exons, with the protein-coding
  region in the last three; exon 4 alone encodes more than 85% of the protein and
  harbors most known pathogenic variants. Nearly all known pathogenic variants are
  nonsense or frameshift changes (truncating variants account for roughly 80% of
  reported pathogenic RP1 alleles), predicted to truncate the protein by roughly
  50-70%. RP1 is unusual among retinal dystrophy genes in causing disease
  through two distinct genetic mechanisms from the same locus: heterozygous
  truncating variants clustered in the middle of exon 4 act as dominant-negative
  alleles, causing autosomal dominant retinitis pigmentosa (adRP); biallelic
  truncating variants located toward the N- or C-terminal ends of exon 4 cause a
  distinct, generally more severe autosomal recessive retinitis pigmentosa
  (arRP) through loss of function, though a subset of biallelic exon-2 missense
  variants can instead cause a considerably later-onset phenotype. Studies
  excluding haploinsufficiency as the causative mechanism support a
  dominant-negative model for the heterozygous middle-exon-4 variants instead.
  No RP1-specific gene therapy is in clinical trials as of 2026; management is
  supportive.
disease_term:
  preferred_term: RP1-related dominant retinopathy
  term:
    id: MONDO:0800400
    label: RP1-related dominant retinopathy
synonyms:
- Retinitis pigmentosa 1
- RP1
- autosomal dominant retinitis pigmentosa due to RP1
- RP1-associated retinal dystrophy
parents:
- Retinitis pigmentosa
- Inherited Retinal Dystrophy
notes: >-
  MONDO's own free-text definitions for the two gene-series terms used here
  (MONDO:0800399 "RP1-related recessive retinopathy" and MONDO:0800400
  "RP1-related dominant retinopathy") appear to have their `def:` fields swapped
  relative to their labels (the "recessive" term's definition text describes
  dominant inheritance and vice versa) - the `is_a` axioms (autosomal recessive
  disease vs. autosomal dominant disease) are internally consistent with the
  labels and were used as the source of truth here, not the free-text defs. The
  older, more general MONDO:0008377 "retinitis pigmentosa 1" (xref OMIM:180100)
  predates the split into dominant/recessive gene-series terms and was not used
  as the primary anchor. One Chinese cohort attributed roughly 2% of RP cases to
  RP1 (a single-gene share broadly comparable to other major RP genes across
  ethnicities). Disease severity generally differs by inheritance: a US
  multicenter cohort of biallelic (recessive) patients had symptom onset
  ranging 4-30 years of age (mean 14.9, median 13) with macular atrophy common
  across the cohort, and a separate Brazilian biallelic cohort reported
  diagnosis within the first decade of life with severe visual acuity loss at a
  young age; within the US cohort, patients carrying at least one exon-2
  missense variant had a considerably later onset than the biallelic-RP1
  average. Dominant RP1-RP is generally considered comparatively milder and
  later in onset than the recessive form, though a precisely quantified age
  range for the dominant form specifically was not found in the sources used
  here.
has_subtypes:
- name: Recessive
  display_name: RP1-Related Recessive Retinopathy
  subtype_term:
    preferred_term: RP1-related recessive retinopathy
    term:
      id: MONDO:0800399
      label: RP1-related recessive retinopathy
  description: >-
    Autosomal recessive RP1-related retinitis pigmentosa caused by biallelic
    truncating variants located toward the N- or C-terminal ends of RP1 exon 4,
    producing complete loss of functional RP1 protein. This form is generally
    more severe than the dominant form: a US multicenter cohort had symptom
    onset ranging 4-30 years of age (mean 14.9, median 13) with macular atrophy
    common across the cohort, and a separate Brazilian cohort reported
    diagnosis within the first decade of life with severely affected visual
    acuity at a young age. Patients carrying at least one exon-2 missense
    variant can have a considerably later onset than this average.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous truncating variants clustered in the middle portion of RP1
    exon 4 act through a dominant-negative mechanism rather than
    haploinsufficiency. RP1 accounts for a substantial fraction of autosomal
    dominant retinitis pigmentosa. Each child of an affected parent has a 50%
    chance of inheriting the pathogenic variant.
  evidence:
  - reference: PMID:33681214
    reference_title: "Dominant RP in the Middle While Recessive in Both the N- and C-Terminals Due to RP1 Truncations: Confirmation, Refinement, and Questions"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "some studies have excluded haploinsufficiency and gain-of-function as the causative mechanism of RP1 variants"
    explanation: >-
      Establishes that dominant RP1 disease is not caused by simple
      haploinsufficiency, supporting a dominant-negative mechanism for
      heterozygous truncating variants.
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic truncating variants toward the N- or C-terminal ends of RP1 exon 4
    cause a distinct, more severe autosomal recessive retinitis pigmentosa
    through loss of function. Both parents of an affected child are obligate
    heterozygous carriers; each sibling has a 25% chance of being affected.
  evidence:
  - reference: PMID:32565670
    reference_title: "Biallelic RP1-associated retinal dystrophies: Expanding the mutational and clinical spectrum"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic RP1 mutations cause a broad spectrum of retinal disease."
    explanation: >-
      Reports as a finding that biallelic (not simply heterozygous) RP1
      variants cause retinal disease, directly evidencing the autosomal
      recessive inheritance modeled by this node.

pathophysiology:
- name: Heterozygous RP1 Dominant-Negative Truncation
  description: >-
    Heterozygous truncating (nonsense/frameshift) variants clustered in the
    middle portion of RP1 exon 4 - which alone encodes more than 85% of the
    protein despite RP1 having four exons total - produce a stable, partially
    functional truncated protein that retains the N-terminal doublecortin (DCX)
    domain but loses distal sequence needed for normal regulation. This
    truncated product co-assembles with wild-type RP1 at the photoreceptor
    axoneme and interferes with normal microtubule/axoneme organization, a
    dominant-negative mechanism rather than simple haploinsufficiency. This is
    the more common RP1 disease mechanism and underlies the majority of
    RP1-related autosomal dominant RP.
  gene:
    preferred_term: RP1
    modifier: ABNORMAL
    term:
      id: hgnc:10263
      label: RP1
  genetic_context:
    gene:
      preferred_term: RP1
      term:
        id: hgnc:10263
        label: RP1
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      Heterozygous middle-exon-4 truncating variants retain the BIF domain and
      produce an interfering truncated product rather than simply
      haploinsufficient loss of RP1 protein.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  evidence:
  - reference: PMID:33681214
    reference_title: "Dominant RP in the Middle While Recessive in Both the N- and C-Terminals Due to RP1 Truncations: Confirmation, Refinement, and Questions"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the heterozygous variants will cause retinal degeneration with preserved BIF domain but loss of the unrecognized domain"
    explanation: >-
      Directly supports the dominant-negative model: heterozygous truncations
      that retain the BIF domain but lose additional distal sequence cause
      retinal degeneration despite the presence of one normal allele,
      consistent with an interfering truncated product rather than simple
      haploinsufficiency.
  - reference: PMID:33681214
    reference_title: "Dominant RP in the Middle While Recessive in Both the N- and C-Terminals Due to RP1 Truncations: Confirmation, Refinement, and Questions"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the variants associated with adRP, the truncated production will preserve the BIF domain and may cause disease via a dominant-negative effect"
    explanation: >-
      Directly supports the dominant-negative (rather than haploinsufficient)
      mechanism for heterozygous RP1 truncating variants preserving the BIF
      domain.
  - reference: PMID:33681214
    reference_title: "Dominant RP in the Middle While Recessive in Both the N- and C-Terminals Due to RP1 Truncations: Confirmation, Refinement, and Questions"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the middle portion from c.1981 (p.661) to c.2749 (p.917)"
    explanation: >-
      Provides the precise coding-sequence/protein coordinates defining the
      middle-exon-4 region where heterozygous truncations act as
      dominant-negative alleles, refining the "middle portion" claim made by
      this node.
  downstream:
  - target: Photoreceptor Axoneme Disorganization
    description: >-
      The dominant-negative truncated protein disrupts normal RP1 function at
      the axoneme regardless of the co-expressed wild-type allele.

- name: Biallelic RP1 Loss
  description: >-
    Biallelic truncating variants located toward the N- or C-terminal ends of
    RP1 exon 4 (distinct from the middle-clustered dominant variants) produce
    complete loss of functional RP1 protein when present on both alleles.
    Heterozygous carriers of these same terminal variants are clinically
    unaffected, confirming that a single functional RP1 allele is sufficient
    for normal photoreceptor structure and that recessive disease requires
    complete loss rather than a dominant-negative product.
  gene:
    preferred_term: RP1
    modifier: ABSENT
    term:
      id: hgnc:10263
      label: RP1
  genetic_context:
    gene:
      preferred_term: RP1
      term:
        id: hgnc:10263
        label: RP1
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic N-/C-terminal truncating variants produce complete loss of
      functional RP1 protein; a single functional allele is sufficient for
      normal photoreceptor structure, so disease requires loss of both alleles.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  evidence:

    reference_title: "Retinitis Pigmentosa Due to Rp1 Biallelic Variants"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They had classic retinitis pigmentosa with diagnosis at the first decade of life. The visual acuities were severely affected at a young age."
    explanation: >-
      Documents the severe, early-onset phenotype resulting from biallelic RP1
      loss-of-function variants, consistent with complete loss of RP1 function.
  - reference: PMID:33681214
    reference_title: "Dominant RP in the Middle While Recessive in Both the N- and C-Terminals Due to RP1 Truncations: Confirmation, Refinement, and Questions"

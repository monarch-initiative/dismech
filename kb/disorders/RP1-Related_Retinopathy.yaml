genetic:
- name: RP1 pathogenic variants
  gene_term:
    preferred_term: RP1
    term:
      id: hgnc:10263
      label: RP1
  association: Causative
  features: >-
    Nearly all known pathogenic variants are nonsense or frameshift changes
    clustered in RP1's coding exons, predominantly exon 4 (which alone encodes
    more than 85% of the 2,156-amino-acid protein despite RP1 having four exons
    total), predicted to truncate the protein by approximately 50-70%. Variants
    located in the middle portion of exon 4 act as heterozygous dominant-negative alleles
    causing autosomal dominant RP; variants toward the N- or C-terminal ends of
    exon 4 require biallelic inheritance to cause the generally more severe
    autosomal recessive form (with exon-2 missense variants forming a
    later-onset exception). Studies have excluded simple haploinsufficiency as
    the causative mechanism for the dominant form.
  inheritance:
  - name: Autosomal dominant
    evidence:
    - reference: PMID:33681214
      reference_title: "Dominant RP in the Middle While Recessive in Both the N- and C-Terminals Due to RP1 Truncations: Confirmation, Refinement, and Questions"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "truncations in the middle portion are associated with adRP, while those in the N- and C- terminals are responsible for arRP, which was supported by most truncation variants (91.9%, 147/160)"
      explanation: >-
        Confirms that RP1 truncating-variant position (middle exon 4 vs.
        N-/C-terminal) predicts inheritance pattern (dominant vs. recessive)
        in 91.9% (147/160) of reported truncations, the positional rule
        underlying this entry's dominant-negative-versus-loss-of-function
        model.
  - name: Autosomal recessive
    evidence:
    - reference: PMID:32005865
      reference_title: "Retinitis Pigmentosa Due to Rp1 Biallelic Variants"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "They had classic retinitis pigmentosa with diagnosis at the first decade of life. The visual acuities were severely affected at a young age."
      explanation: >-
        Documents a cohort of patients with biallelic RP1 variants presenting
        with early-onset autosomal recessive RP.
  evidence:
  - reference: PMID:15269252
    reference_title: "The Retinitis Pigmentosa 1 Protein Is a Photoreceptor Microtubule-Associated Protein"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RP1 is a MAP. Given the specific expression of RP1 in photoreceptors, RP1 is thus the first photoreceptor-specific MAP to be identified."
    explanation: >-
      Establishes RP1 as a photoreceptor-specific microtubule-associated
      protein, the functional basis for its role in RP.

diagnosis:
- name: Full-Field Electroretinography (ERG)
  description: >-
    Full-field ERG is the diagnostic cornerstone for RP1-related RP, showing a
    rod-cone pattern of dysfunction that is milder and later-onset in dominant
    disease than in recessive disease.
  diagnosis_term:
    preferred_term: electroretinogram procedure
    term:
      id: NCIT:C101217
      label: Retinal Examination
  evidence:
  - reference: "ORPHA:791"
    reference_title: "Retinitis pigmentosa"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HP:0000512 | Abnormal electroretinogram | Very frequent (99-80%)"
    explanation: >-
      The very high frequency of abnormal ERG in RP supports ffERG as a core
      diagnostic investigation for RP1-RP.

- name: Molecular Genetic Testing
  description: >-
    Sequencing of RP1's coding exons - particularly exon 4, which alone encodes
    more than 85% of the protein and harbors most known pathogenic variants -
    identifies the truncating variants responsible for both dominant and
    recessive disease. Variant position within exon 4 (middle vs. terminal) and
    zygosity together determine expected inheritance pattern and prognosis,
    informing genetic counseling.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33681214
    reference_title: "Dominant RP in the Middle While Recessive in Both the N- and C-Terminals Due to RP1 Truncations: Confirmation, Refinement, and Questions"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RP1 is listed as the top seventh of the most frequently implicated genes in inherited retinal disease based on a large cohort."
    explanation: >-
      Supports the clinical value of including RP1 in molecular genetic
      testing panels for inherited retinal disease given its high frequency.
  - reference: PMID:20301590
    reference_title: "Nonsyndromic Retinitis Pigmentosa Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Provide an evaluation strategy to identify the genetic cause of
      nonsyndromic retinitis pigmentosa in a proband
    explanation: >-
      GeneReviews frames molecular genetic testing as the evaluation strategy
      for identifying the genetic cause of nonsyndromic RP, including RP1.

treatments:
- name: Low Vision Rehabilitation
  therapeutic_modality: OTHER
  description: >-
    Low vision aids, orientation and mobility training, and adaptive technology
    are the mainstay of management for RP1-related RP, particularly important
    for the early and severe visual loss of recessive disease.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Progressive visual loss
    term:
      id: HP:0000529
      label: Progressive visual loss
  evidence:
  - reference: "ORPHA:791"
    reference_title: "Retinitis pigmentosa"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Retinitis pigmentosa (RP) is an inherited retinal dystrophy leading to progressive loss of the photoreceptors and retinal pigment epithelium and resulting in blindness usually after several decades."
    explanation: >-
      Progressive visual impairment in RP justifies ongoing low-vision
      rehabilitation as the primary symptomatic management strategy.
  - reference: PMID:20301590
    reference_title: "Nonsyndromic Retinitis Pigmentosa Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Provide a brief summary of management of nonsyndromic retinitis
      pigmentosa
    explanation: >-
      GeneReviews includes a management summary for nonsyndromic RP,
      including RP1-related forms, of which low vision rehabilitation is a
      core component.

- name: Genetic Counseling
  therapeutic_modality: OTHER
  description: >-
    Essential given RP1's unusual dual inheritance pattern: counseling must
    distinguish the 50% recurrence risk and generally milder course of
    dominant disease from the 25% recurrence risk and generally more severe
    course of recessive disease, which depend on where in exon 4 (and, for
    biallelic variants, whether an exon-2 missense allele is involved) the
    family's variant(s) fall.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:22317909
    reference_title: "RP1 and retinitis pigmentosa: report of novel mutations and insight into mutational mechanism"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RP1 is one of the earliest identified disease genes in RP with mutations in this gene known to act both recessively and dominantly although the mutational mechanism remains unclear."
    explanation: >-
      RP1's dual inheritance pattern, with mechanism-dependent recurrence risk,
      underscores the need for genotype-specific genetic counseling.
  - reference: PMID:20301590
    reference_title: "Nonsyndromic Retinitis Pigmentosa Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inform genetic risk assessment of family members of a proband with
      nonsyndromic retinitis pigmentosa
    explanation: >-
      GeneReviews explicitly scopes this overview to inform genetic risk
      assessment of family members, the core purpose of genetic counseling
      modeled by this node.


    reference_title: "The Retinitis Pigmentosa 1 Protein Is a Photoreceptor Microtubule-Associated Protein"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Disruption of the Rp1 gene in mice causes misorientation of outer segment discs, suggesting a role for RP1 in outer segment organization."
    explanation: >-
      Establishes RP1's structural role in outer segment disc organization
      using the Rp1 knockout mouse model; loss of RP1 causes disc
      misorientation, the direct structural consequence modeled by this node.
  - reference: PMID:15269252
    reference_title: "The Retinitis Pigmentosa 1 Protein Is a Photoreceptor Microtubule-Associated Protein"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we show that the RP1 protein is part of the photoreceptor axoneme"
    explanation: >-
      Establishes the subcellular localization of RP1 to the connecting
      cilium/axoneme, the structure disrupted in this node.
  downstream:
  - target: Rod Photoreceptor Apoptosis
    description: >-
      Disorganized, misoriented outer segment discs impair photoreceptor
      function and structural integrity over time, driving progressive rod
      photoreceptor degeneration.

- name: Rod Photoreceptor Apoptosis
  conforms_to: "photoreceptor_degeneration#Rod Photoreceptor Apoptosis"
  description: >-
    Progressive structural disorganization of the outer segment from
    dysfunctional RP1 ultimately drives rod photoreceptor apoptosis, the
    hallmark rod-predominant degeneration of retinitis pigmentosa producing
    nyctalopia and progressive peripheral visual field loss. Secondary cone
    degeneration follows as rods are lost. The recessive form progresses far
    more rapidly and with earlier macular involvement than the dominant form.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: neuron apoptotic process
    modifier: INCREASED
    term:
      id: GO:0051402
      label: neuron apoptotic process

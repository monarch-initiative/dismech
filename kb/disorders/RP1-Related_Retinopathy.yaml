  downstream:
  - target: Photoreceptor Axoneme Disorganization
    description: >-
      Complete absence of functional RP1 protein disrupts axoneme organization
      more severely and from an earlier age than the dominant-negative
      mechanism.

- name: Photoreceptor Axoneme Disorganization
  description: >-
    RP1 is a photoreceptor-specific microtubule-associated protein located in
    the connecting cilium and axoneme, where it controls the length and
    stability of the axoneme and is required for correct orientation and
    higher-order stacking of outer segment discs. Loss of functional RP1 (via
    either the dominant-negative or recessive loss-of-function mechanism)
    disrupts this scaffolding role, producing misoriented, disorganized outer
    segment discs.
  cellular_components:
  - preferred_term: ciliary transition zone
    term:
      id: GO:0035869
      label: ciliary transition zone
  cell_types:
  - preferred_term: retinal rod cell
    term:

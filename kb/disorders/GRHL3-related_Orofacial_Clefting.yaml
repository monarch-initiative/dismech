name: GRHL3-related Orofacial Clefting
creation_date: "2026-10-26T00:00:00Z"
category: Mendelian
synonyms:
- Van der Woude syndrome 2
- GRHL3-related cleft palate
- VWS2
disease_term:
  preferred_term: GRHL3-related orofacial clefting
  term:
    id: MONDO:0100579
    label: GRHL3-related orofacial clefting
notes: >-
  GRHL3-related orofacial clefting is a gene-defined allelic spectrum rather
  than a single clinical syndrome: dominant GRHL3 variants cause both the
  syndromic Van der Woude syndrome type 2 (orofacial cleft with lower lip pits)
  and, more commonly, nonsyndromic cleft palate only. Both presentations are
  modelled here as one entry because they share the same conserved mechanism -
  loss of GRHL3-dependent oral periderm differentiation during palatogenesis.
  Curated as a single kb/disorders Disease (entry_type DISEASE) per issue #15690
  and the Disease Groupings rule in CLAUDE.md (one reasonably conserved
  pathograph). No GeneReviews chapter titled for this disease, Van der Woude
  syndrome, or GRHL3 was found (offline Bookshelf index and live PubMed
  genereviews[book] search, 2026-10-26).

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    Dominant GRHL3 variants segregate with orofacial clefting but penetrance is
    incomplete: obligate carriers without a cleft are observed within affected
    families.
  evidence:
  - reference: PMID:34459660
    reference_title: "Novel GRHL3 Variants in a South African Cohort With Cleft Lip and Palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the father did not have a CP, implying that the phenotype was not completely penetrant in him"
    explanation: An obligate carrier (father) of a segregating GRHL3 missense variant had no cleft palate, documenting incomplete penetrance.

has_subtypes:
- name: VWS Type 2
  display_name: Van der Woude syndrome type 2 (syndromic)
  description: >-
    The syndromic presentation: orofacial cleft (cleft lip and/or palate)
    accompanied by the Van der Woude hallmark of lower lip pits. GRHL3 accounts
    for a minority of Van der Woude syndrome, with IRF6 causing the majority.
  subtype_term:
    preferred_term: van der Woude syndrome 2
    term:
      id: MONDO:0011712
      label: van der Woude syndrome 2
- name: Nonsyndromic Cleft Palate
  display_name: Nonsyndromic cleft palate only (nsCPO)
  description: >-
    The more common presentation of dominant GRHL3 variants: isolated cleft
    palate without lip pits or other syndromic features. A common coding
    susceptibility variant (p.Thr454Met) and rare truncating variants are
    specifically associated with cleft palate only, not with cleft lip. Note the
    bound term MONDO:0007336 (isolated cleft palate) is the broad multifactorial
    class, broader than this GRHL3-defined stratum.
  subtype_term:
    preferred_term: isolated cleft palate
    term:
      id: MONDO:0007336
      label: isolated cleft palate

pathophysiology:
- name: GRHL3 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    GRHL3 encodes the grainyhead-like 3 transcription factor, which governs
    differentiation of stratified epithelia. Dominant disease-associated
    variants reduce or abolish its transcriptional activity; missense variants
    identified in Van der Woude syndrome acted as dominant negatives in a
    zebrafish periderm assay, while truncating variants cause loss of function.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  genes:
  - preferred_term: GRHL3
    term:
      id: hgnc:25839
      label: GRHL3
  downstream:
  - target: Oral Periderm Dysfunction
    causal_link_type: DIRECT
    description: >-
      Reduced GRHL3 transcriptional output disrupts formation and
      differentiation of the embryonic oral periderm.
    evidence:
    - reference: PMID:24360809
      reference_title: "Dominant mutations in GRHL3 cause Van der Woude Syndrome and disrupt oral periderm development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the disease-associated GRHL3 mutations abrogated periderm development and were consistent with a dominant-negative effect"
      explanation: A zebrafish assay showed GRHL3 disease variants abrogate periderm development, linking the molecular lesion to periderm dysfunction.
  evidence:
  - reference: PMID:34459660
    reference_title: "Novel GRHL3 Variants in a South African Cohort With Cleft Lip and Palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "GRHL3 is a transcription factor that plays an important role in primary neurulation and in the differentiation of stratified epithelia of ectodermal or endodermal origin"
    explanation: Establishes the molecular identity and function of GRHL3 as an epithelial-differentiation transcription factor.

- name: Oral Periderm Dysfunction
  biological_scale: CELLULAR
  description: >-
    The oral periderm is a transient, single-cell-layered epithelium that forms
    early in embryogenesis and expresses polarised adhesion complexes. GRHL3
    (together with IRF6, under p63 control) is required for its formation; loss
    of GRHL3 produces an abnormal oral periderm.
  cell_types:
  - preferred_term: oral periderm cell
    term:
      id: CL:0000078
      label: peridermal cell
  biological_processes:
  - preferred_term: epithelial cell differentiation
    modifier: DECREASED
    term:
      id: GO:0030855
      label: epithelial cell differentiation
  downstream:
  - target: Pathological Inter-epithelial Adhesion
    causal_link_type: DIRECT
    description: >-
      A functional periderm prevents the apposed oral epithelia from adhering
      to one another; a dysfunctional periderm permits pathological adhesions.
  evidence:
  - reference: PMID:24360809
    reference_title: "Dominant mutations in GRHL3 cause Van der Woude Syndrome and disrupt oral periderm development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mouse, all embryos lacking Grhl3 exhibited abnormal oral periderm and 17% developed a cleft palate."
    explanation: Grhl3-null mouse embryos uniformly show abnormal oral periderm, directly tying GRHL3 loss to periderm dysfunction and cleft palate.

- name: Pathological Inter-epithelial Adhesion
  biological_scale: TISSUE
  description: >-
    Without an intact periderm barrier, intimately apposed and
    adhesion-competent oral epithelia fuse pathologically, obstructing the
    orderly elevation and midline fusion of the palatal shelves.
  biological_processes:
  - preferred_term: pathological inter-epithelial (cell-cell) adhesion
    modifier: INCREASED
    term:
      id: GO:0098609
      label: cell-cell adhesion
  downstream:
  - target: Failure of Secondary Palatal Shelf Fusion
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28803895
    reference_title: "Periderm: Life-cycle and function during orofacial and epidermal development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "periderm plays a transient but fundamental role during embryogenesis in preventing pathological adhesion between intimately apposed, adhesion-competent epithelia"
    explanation: The periderm's role is to prevent pathological adhesion between apposed epithelia; its disruption underlies the adhesion defect.
  - reference: PMID:28803895
    reference_title: "Periderm: Life-cycle and function during orofacial and epidermal development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "IRF6, IKKA, SFN, RIPK4 and GRHL3, all of which are under the transcriptional control of p63, play a key role in periderm formation"
    explanation: Places GRHL3 within the p63-controlled periderm program whose disruption causes inter-epithelial adhesion defects.

- name: Failure of Secondary Palatal Shelf Fusion
  biological_scale: TISSUE
  description: >-
    Disrupted periderm and consequent adhesion defects cause failure of medial
    edge epithelial fusion of the secondary palatal shelves, producing cleft
    palate.
  biological_processes:
  - preferred_term: roof of mouth development
    modifier: DECREASED
    term:
      id: GO:0060021
      label: roof of mouth development
  downstream:
  - target: Cleft palate
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24360809
    reference_title: "Dominant mutations in GRHL3 cause Van der Woude Syndrome and disrupt oral periderm development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "both genes are essential for the presence of a functional oral periderm and that failure of this process contributes to VWS"
    explanation: The conclusion that periderm failure causes the orofacial cleft rests on the paper's zebrafish and mouse work, so it is model-organism evidence applied to the human disease.

phenotypes:
- category: Craniofacial
  name: Cleft palate
  description: >-
    Failure of fusion of the secondary palate, the predominant clinical
    presentation of GRHL3-related orofacial clefting and the specific phenotype
    associated with the common p.Thr454Met susceptibility variant.
  phenotype_term:
    preferred_term: Cleft palate
    term:
      id: HP:0000175
      label: Cleft palate
  evidence:
  - reference: PMID:27018475
    reference_title: "Sequencing the GRHL3 Coding Region Reveals Rare Truncating Mutations and a Common Susceptibility Variant for Nonsyndromic Cleft Palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "four novel truncating GRHL3 mutations including two that were de novo in four families, where all nine individuals harboring mutations had nsCPO"
    explanation: All carriers of rare truncating GRHL3 mutations in this study had nonsyndromic cleft palate only.
  - reference: PMID:24360809
    reference_title: "Dominant mutations in GRHL3 cause Van der Woude Syndrome and disrupt oral periderm development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mouse, all embryos lacking Grhl3 exhibited abnormal oral periderm and 17% developed a cleft palate."
    explanation: Grhl3-null mice develop cleft palate, the model-organism correlate of the human phenotype.

- category: Craniofacial
  name: Cleft lip
  description: >-
    Cleft lip (with or without cleft palate) occurs within the syndromic Van der
    Woude presentation, but cleft lip in GRHL3 carriers is not well documented
    and is much less common than cleft palate. The common p.Thr454Met variant is
    specific to cleft palate and is not associated with cleft lip. This
    phenotype is deliberately left unconnected in the pathograph: cleft lip
    arises from failed fusion of the lip and primary palate (weeks before the
    secondary palatal shelves fuse), and no source here establishes a
    GRHL3-specific lip/primary-palate mechanism.
  subtype: VWS Type 2
  phenotype_term:
    preferred_term: Cleft lip
    term:
      id: HP:0410030
      label: Cleft lip
  evidence:
  - reference: PMID:27018475
    reference_title: "Sequencing the GRHL3 Coding Region Reveals Rare Truncating Mutations and a Common Susceptibility Variant for Nonsyndromic Cleft Palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "individuals have CL/P or CPO, often but not always associated with lower lip pits"
    explanation: Van der Woude syndrome (a minority of which is GRHL3-related) can present with cleft lip with or without palate; this is a background statement about VWS overall, not a GRHL3-specific observation.
  - reference: PMID:34459660
    reference_title: "Novel GRHL3 Variants in a South African Cohort With Cleft Lip and Palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "The known missense variant (p.Arg16Gln) was identified in an individual with a cleft lip and alveolus."
    explanation: A GRHL3 missense variant was found in an individual with cleft lip and alveolus; the paper annotates p.Arg16Gln as benign/tolerated, so this is weak, indirect support for a GRHL3-associated cleft lip.

- category: Craniofacial
  name: Lower lip pit
  description: >-
    Paramedian depressions of the lower lip, the diagnostic hallmark of Van der
    Woude syndrome and the feature distinguishing the syndromic (VWS type 2)
    presentation from nonsyndromic cleft palate.
  subtype: VWS Type 2
  phenotype_term:
    preferred_term: Lower lip pit
    term:
      id: HP:0000196
      label: Lower lip pit
  evidence:
  - reference: PMID:27018475
    reference_title: "Sequencing the GRHL3 Coding Region Reveals Rare Truncating Mutations and a Common Susceptibility Variant for Nonsyndromic Cleft Palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "A common syndromic form of orofacial clefting is Van der Woude syndrome (VWS) where individuals have CL/P or CPO, often but not always associated with lower lip pits"
    explanation: Lower lip pits are the characteristic syndromic feature of Van der Woude syndrome, which GRHL3 variants can cause.

treatments:
- name: Multidisciplinary cleft care with surgical repair
  description: >-
    Management is surgical repair of the cleft within a multidisciplinary
    orofacial-cleft team addressing appearance, speech and hearing; good
    outcomes are reported from multidisciplinary centres.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cleft surgical repair
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:34459660
    reference_title: "Novel GRHL3 Variants in a South African Cohort With Cleft Lip and Palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "treatment aims should address the appearance, speech and hearing of an affected individual"
    explanation: States the goals of orofacial-cleft management.
  - reference: PMID:34459660
    reference_title: "Novel GRHL3 Variants in a South African Cohort With Cleft Lip and Palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "good treatment outcomes are possible, especially in centres where a multidisciplinary OFC team approach is utilised"
    explanation: Supports multidisciplinary team care as the management approach.

diagnosis:
- name: Molecular genetic testing (GRHL3)
  diagnosis_term:
    preferred_term: GRHL3 sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    In Van der Woude syndrome families without an IRF6 mutation, sequencing
    GRHL3 identifies the causal coding variant; GRHL3 is a second-tier test
    after IRF6.
  evidence:
  - reference: PMID:24360809
    reference_title: "Dominant mutations in GRHL3 cause Van der Woude Syndrome and disrupt oral periderm development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 8 of 45 VWS-affected families lacking a mutation in IRF6, we found coding mutations in grainyhead-like 3 (GRHL3)."
    explanation: GRHL3 sequencing identifies the cause in IRF6-negative VWS families, defining its diagnostic role.

genetic:
- name: GRHL3
  gene_term:
    preferred_term: GRHL3
    term:
      id: hgnc:25839
      label: GRHL3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Dominant GRHL3 variants cause orofacial clefting. Missense variants in Van
    der Woude syndrome acted as dominant negatives; rare truncating
    loss-of-function variants and a common coding susceptibility variant
    (p.Thr454Met, rs41268753) are associated with nonsyndromic cleft palate. The
    node-level genetic_context records DOMINANT_NEGATIVE for the VWS missense
    alleles; the truncating nsCPO alleles are loss-of-function.
  variants:
  - name: p.Thr454Met (rs41268753)
    description: >-
      A common conserved coding variant that is a genome-wide significant
      susceptibility allele for nonsyndromic cleft palate only, concluded to be
      an etiologic variant for nonsyndromic cleft palate.
    evidence:
    - reference: PMID:27018475
      reference_title: "Sequencing the GRHL3 Coding Region Reveals Rare Truncating Mutations and a Common Susceptibility Variant for Nonsyndromic Cleft Palate."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "rs41268753 encodes the highly conserved p.Thr454Met (c.1361C>T)"
      explanation: Identifies the common coding susceptibility variant p.Thr454Met.
    - reference: PMID:34459660
      reference_title: "Novel GRHL3 Variants in a South African Cohort With Cleft Lip and Palate."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the p.Thr454Met variant is an etiologic variant for nonsyndromic CP"
      explanation: Two independent studies concluded p.Thr454Met is an etiologic variant for nonsyndromic cleft palate.
    - reference: PMID:27018475
      reference_title: "Sequencing the GRHL3 Coding Region Reveals Rare Truncating Mutations and a Common Susceptibility Variant for Nonsyndromic Cleft Palate."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Notably, rs41268753 is not associated with nsCL/P (p = 0.45)."
      explanation: The common variant is specific to cleft palate and is not associated with cleft lip, supporting its cleft-palate-only phenotype.
  evidence:
  - reference: PMID:24360809
    reference_title: "Dominant mutations in GRHL3 cause Van der Woude Syndrome and disrupt oral periderm development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 8 of 45 VWS-affected families lacking a mutation in IRF6, we found coding mutations in grainyhead-like 3 (GRHL3)."
    explanation: Coding GRHL3 mutations were identified in Van der Woude syndrome families without IRF6 mutations, establishing GRHL3 as causative.
  case_fractions:
  - population: Van der Woude syndrome-affected individuals
    case_fraction_percent: 5.0
    notes: >-
      Approximately 5% of Van der Woude syndrome is attributable to GRHL3; IRF6
      accounts for the majority.
    evidence:
    - reference: PMID:27018475
      reference_title: "Sequencing the GRHL3 Coding Region Reveals Rare Truncating Mutations and a Common Susceptibility Variant for Nonsyndromic Cleft Palate."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Recently, ∼5% of VWS-affected individuals were identified with mutations in the grainy head-like 3 gene (GRHL3)."
      explanation: Quantifies the GRHL3 share of Van der Woude syndrome at about 5%.


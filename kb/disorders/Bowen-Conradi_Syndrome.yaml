diagnosis:
- name: Molecular Testing for the EMG1 Founder Variant
  description: >-
    The phenotype overlaps trisomy 18, cerebro-oculo-facial-skeletal syndrome
    and other conditions, so a normal karyotype and confirmation of homozygous
    EMG1 p.Asp86Gly are needed. Molecular testing has shown that clinically
    similar Hutterite infants can lack the variant.
  evidence:
  - reference: PMID:22856010
    reference_title: "Bowen-Conradi: a common Hutterite condition that mimics trisomy 18."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe two infant patients who were initially thought to have
      trisomy 18, but for whom chromosome studies were normal.
    explanation: Clinical overlap with trisomy 18.
  - reference: PMID:25906497
    reference_title: "A Hutterite condition that mimics Bowen-Conradi syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although clinically both babies in the 2012 report appeared to have the
      same condition, this current infant was found to have a normal EMG1 gene
      sequence, and thus, lacks the Hutterite mutation for BCS.
    explanation: >-
      A clinically similar Hutterite infant without the variant shows that
      molecular confirmation is needed.
  - reference: PMID:15578624
    reference_title: "A locus for Bowen-Conradi syndrome maps to chromosome region 12p13.3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study also demonstrates that BCS and cerebro-oculo-facial-skeletal
      syndrome (COFS) are genetically distinct.
    explanation: Separates Bowen-Conradi syndrome from COFS genetically.
  - reference: PMID:25799636
    reference_title: "Bowen-Conradi Syndrome: a trisomy 18-like autosomal recessive disorder common in Hutterites."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We believe this is the first case of BCS clinically confirmed by
      molecular testing for mutation in the EMG1 gene.
    explanation: Clinical use of EMG1 molecular testing to confirm the diagnosis.

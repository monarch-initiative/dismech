animal_models:
- name: Emg1 null mouse
  species: Mouse
  genotype: Emg1(-/-)
  publication: PMID:20858271
  description: >-
    Constitutive Emg1 knockout. Homozygous null embryos arrest at the morula
    stage, fail to form a blastocyst, show defective nucleologenesis and early
    lineage specification and degenerate before implantation; no homozygotes
    are found from E8.5 onwards. Loss of p53 does not rescue the arrest.
  modeled_mechanisms:
  - target: Reduced Proliferation of Rapidly Dividing Cells
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Shows that EMG1 is essential for early embryonic cell growth in a
      mammal, and that the requirement is p53-independent.
    limitations: >-
      Complete loss of Emg1 is far more severe than the human hypomorphic
      genotype, so the model shows essentiality rather than the
      disease-relevant partial deficiency.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Embryos die before implantation, so brain growth, postnatal growth and
        the limb and facial features of the human disease cannot be observed.
    evidence:
    - reference: PMID:20858271
      reference_title: "EMG1 is essential for mouse pre-implantation embryo development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Loss of EMG1 function in mice arrested embryonic development prior to
        the blastocyst stage.
      explanation: Pre-implantation arrest of Emg1-null embryos.
- name: Emg1 D86G knock-in mouse
  species: Mouse
  genotype: Emg1 D86G homozygous knock-in
  publication: PMID:25708872
  description: >-
    Knock-in of the human founder substitution. Homozygous embryos are small
    for gestational age, have neural tube defects and die between E8.5 and
    E12.5, so the allele is more severe in mouse than in human.
  modeled_mechanisms:
  - target: Reduced Proliferation of Rapidly Dividing Cells
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Homozygous embryos show markedly reduced proliferation, also seen in
      patient autopsy brain and bone marrow, and embryo fibroblasts show a
      mitotic defect.
    limitations: >-
      Embryonic lethality means the model cannot show the postnatal course of
      the human disease, and the same substitution is more severe in mouse.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The same D86G substitution is lethal by mid-gestation in mouse while
        human homozygotes survive to birth and usually into the first year.
    evidence:
    - reference: PMID:25708872
      reference_title: "Growth arrest in the ribosomopathy, Bowen-Conradi syndrome, is due to dramatically reduced cell proliferation and a defect in mitotic progression."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Embryos homozygous for the mutation in Emg1 were small for gestational
        age with neural tube defects, and died between embryonic days 8.5 and
        12.5.
      explanation: Phenotype of the knock-in embryos.
  - target: Global Prenatal and Postnatal Growth Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Knock-in embryos are small for gestational age.
    limitations: >-
      Only the prenatal part is observable before the embryos die; postnatal
      growth failure cannot be assessed.
    evidence:
    - reference: PMID:25708872
      reference_title: "Growth arrest in the ribosomopathy, Bowen-Conradi syndrome, is due to dramatically reduced cell proliferation and a defect in mitotic progression."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Embryos homozygous for the mutation in Emg1 were small for gestational
        age with neural tube defects, and died between embryonic days 8.5 and
        12.5.
      explanation: Small-for-gestational-age knock-in embryos.
- name: Surface-ectoderm conditional Emg1 knockout mouse
  species: Mouse
  genotype: Emg1 conditional knockout in GRHL3-positive surface ectoderm
  publication: PMID:40761126
  description: >-
    Conditional deletion of Emg1 in the GRHL3-positive surface ectoderm causes
    spina bifida, and Emg1 and Grhl3 interact genetically in neurulation and
    palate development. EMG1 forms a complex with GRHL3 and is needed for its
    nuclear localization and for canonical Wnt signalling. This is a function
    outside ribosome biogenesis whose relevance to the human disease, in which
    neural tube defects are not a recognized feature, is not established, so
    the model is not linked to the pathograph.
  evidence:
  - reference: PMID:40761126
    reference_title: "EMG1 cooperates with GRHL3 in β-catenin-mediated surface ectoderm differentiation to regulate neural tube closure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Conditional knockout mutation of Emg1 in the GRHL3-positive surface
      ectoderm causes neural tube defects at the level of the spinal cord, i.e.
      spina bifida.
    explanation: Neural tube phenotype of the conditional knockout.
discussions:
- discussion_id: d86g_mouse_human_severity
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Reduced Proliferation of Rapidly Dividing Cells
  prompt: >-
    Why is the EMG1 D86G substitution lethal by mid-gestation in mouse
    embryos, with neural tube defects, when human homozygotes survive to birth
    and neural tube defects are not a recognized feature?
  rationale: >-
    The knock-in mouse is the only in vivo model of the patient allele, and its
    proliferation defect is the main support for the growth-failure mechanism.
    If the mouse allele is more destabilizing, or mouse embryos depend more on
    EMG1 at a given stage, the model may overstate how much proliferation is
    lost in human tissues; patient lymphoblasts and fibroblasts show only a
    modest 18S rRNA processing delay without loss of 40S subunits.
  evidence:
  - reference: PMID:25708872
    reference_title: "Growth arrest in the ribosomopathy, Bowen-Conradi syndrome, is due to dramatically reduced cell proliferation and a defect in mitotic progression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Embryos homozygous for the mutation in Emg1 were small for gestational
      age with neural tube defects, and died between embryonic days 8.5 and
      12.5.
    explanation: The mouse allele is embryonic lethal.
  - reference: PMID:26676230

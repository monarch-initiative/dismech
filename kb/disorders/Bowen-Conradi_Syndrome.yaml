    explanation: Yeast genetics establishing EMG1 as a 40S biogenesis factor.
  - reference: PMID:20972225
    reference_title: "The Bowen-Conradi syndrome protein Nep1 (Emg1) has a dual role in eukaryotic ribosome biogenesis, as an essential assembly factor and in the methylation of Ψ1191 in yeast 18S rRNA."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM

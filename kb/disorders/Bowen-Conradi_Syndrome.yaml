- discussion_id: bcs_outside_hutterites
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#EMG1
  prompt: >-
    Does Bowen-Conradi syndrome occur outside the Hutterite population, and
    are there disease-causing EMG1 variants other than p.Asp86Gly?
  rationale: >-
    Several non-Hutterite infants, including an Indian boy, were reported as
    Bowen-Conradi syndrome on clinical grounds before the gene was known, but
    none was tested for EMG1, and the phenotype overlaps trisomy 18 and
    cerebro-oculo-facial-skeletal syndrome. The genotype-phenotype picture,
    the ClinGen classification and the protein-instability mechanism all rest
    on one founder allele, so a second EMG1 allele would test whether the
    disease is a general EMG1 deficiency or specific to the D86G protein.
  evidence:
  - reference: PMID:11310999
    reference_title: "Bowen-Conradi syndrome in an Indian infant: first non Hutterite case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first case in the literature who is not from the Hutterite
      population.
    explanation: Clinically diagnosed non-Hutterite case, without molecular testing.
  - reference: PMID:12002150
    reference_title: "Bowen-Conradi syndrome in non Hutterite infant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They point out that there have been three previously published reports of
      possible Bowen-Conradi syndrome in non Hutterite children.
    explanation: Earlier possible non-Hutterite cases, all clinically diagnosed.
  - reference: PMID:26676230
    reference_title: "Mutation of EMG1 causing Bowen-Conradi syndrome results in reduced cell proliferation rates concomitant with G2/M arrest and 18S rRNA processing delay."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "but has not yet been found outside this population"
    explanation: >-
      As of the molecular studies, no molecularly confirmed case outside the
      Hutterites had been found.

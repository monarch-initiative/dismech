    modifier: INCREASED
  evidence:
  - reference: PMID:19463982
    reference_title: "Mutation of a gene essential for ribosome biogenesis, EMG1, causes Bowen-Conradi syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These findings suggested that the D-to-G mutation caused aggregation of
      EMG1, thereby reducing the level of the protein and causing BCS.
    explanation: >-
      Patient-cell, overexpression and two-hybrid data indicate that the
      variant destabilizes and aggregates EMG1.
  - reference: PMID:27798105
    reference_title: "Effects of the Bowen-Conradi syndrome mutation in EMG1 on its nuclear import, stability and nucleolar recruitment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The BCS mutation in EMG1 leads to reduced nucleolar localisation,
      accumulation of EMG1D86G in nuclear foci and its proteasome-dependent
      degradation.
    explanation: Proteasome-dependent degradation of the mutant protein in cultured cells.
  - reference: PMID:20972225
    reference_title: "The Bowen-Conradi syndrome protein Nep1 (Emg1) has a dual role in eukaryotic ribosome biogenesis, as an essential assembly factor and in the methylation of Ψ1191 in yeast 18S rRNA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Interestingly, the Nep1 methyltransferase activity is not affected upon
      introduction of the BCS mutation. Instead, the mutated protein shows
      enhanced dimerization propensity and increased affinity for its
      RNA-target in vitro.
    explanation: >-
      The variant spares catalytic activity and instead alters dimerization and
      RNA binding.
  downstream:
  - target: Reduced Nucleolar Recruitment of EMG1
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27798105
      reference_title: "Effects of the Bowen-Conradi syndrome mutation in EMG1 on its nuclear import, stability and nucleolar recruitment."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Our findings further indicate that in BCS, nuclear disassembly of the
        import complex and release of EMG1D86G lead to its nuclear aggregation
        and degradation, resulting in the reduced nucleolar recruitment of the
        RNA methyltransferase and defects in the biogenesis of the small
        ribosomal subunit.
      explanation: >-
        Places aggregation and degradation upstream of reduced nucleolar
        recruitment.
- name: Reduced Nucleolar Recruitment of EMG1
  biological_scale: MOLECULAR
  description: >-
    EMG1 is imported into the nucleus by importins, which also act as
    chaperones, and is recruited to nucleoli as part of a subcomplex with
    NOP14, NOC4L and UTP14A. The mutant protein is released from the import
    complex, aggregates in the nucleus and reaches the nucleolus less
    efficiently, so less EMG1 is available to the small subunit processome.
    One study in patient fibroblasts did not detect a change in nucleolar
    localization, so the extent of this step in patient cells is uncertain.
  genes:

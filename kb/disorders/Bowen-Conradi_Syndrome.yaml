    reference_title: "Mutation of EMG1 causing Bowen-Conradi syndrome results in reduced cell proliferation rates concomitant with G2/M arrest and 18S rRNA processing delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The rate of 18S rRNA processing was consistently delayed in patient
      cells, although this did not lead to a difference in the levels of 40S
      ribosomes, or a change in protein synthesis rates.
    explanation: >-
      Direct measurement of delayed 18S rRNA processing in patient cells, with
      the caveat that 40S levels were not reduced.
  - reference: PMID:11694595
    reference_title: "Novel stress-responsive genes EMG1 and NOP14 encode conserved, interacting proteins required for 40S ribosome biogenesis."

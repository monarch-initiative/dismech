      explanation: ClinGen gene-disease validity record classifying this pair as Strong.
  variants:
  - name: p.Asp86Gly (D86G)
    description: >-
      The Hutterite founder missense variant, reported as NM_006331.6:c.400A>G
      in the gene discovery paper and as c.257A>G in later work from the same
      group, which uses a different reference transcript. It segregated with
      disease, was absent from 414 non-Hutterite alleles and replaces a highly
      conserved aspartate predicted to form a salt bridge with Arg84. EMG1
      mRNA is normal in patient fibroblasts but EMG1 protein is dramatically
      reduced.
    type: MISSENSE
    evidence:
    - reference: PMID:19463982
      reference_title: "Mutation of a gene essential for ribosome biogenesis, EMG1, causes Bowen-Conradi syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified variant NM_006331.6:c.400A-->G, p.D86G in the 18S
        ribosome assembly protein EMG1 as the probable cause of BCS. This
        mutation segregated with disease, was not found in 414 non-Hutterite
        alleles, and altered a highly conserved aspartic acid (D) residue.
      explanation: Identification and segregation of the founder variant.
    - reference: PMID:25708872
      reference_title: "Growth arrest in the ribosomopathy, Bowen-Conradi syndrome, is due to dramatically reduced cell proliferation and a defect in mitotic progression."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It is caused by a c.257A>G, p.D86G substitution in the ribosomal
        biogenesis protein, Essential for Mitotic Growth 1 (EMG1).
      explanation: >-
        The same human variant under the c.257A>G cDNA numbering used in later
        papers, stated in the background of a mouse study.
  evidence:
  - reference: PMID:15578624
    reference_title: "A locus for Bowen-Conradi syndrome maps to chromosome region 12p13.3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By linkage and haplotype analysis the BCS locus was mapped to a 3.5 cM
      segment (1.9 Mbp) in chromosome region 12p13.3 bounded by F8VWF and
      D12S397.
    explanation: Linkage mapping of the locus in Hutterite families.
  - reference: PMID:19463982
    reference_title: "Mutation of a gene essential for ribosome biogenesis, EMG1, causes Bowen-Conradi syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In BCS patient fibroblasts, EMG1 mRNA levels did not differ from those of
      normal cells, but EMG1 protein was dramatically reduced in comparison to
      that of normal controls.
    explanation: >-
      Reduced EMG1 protein in patient cells supports EMG1 as the causal gene.
  notes: >-
    Biallelic EMG1 p.Asp86Gly is the only known cause; ClinGen rates the
    gene-disease relationship Strong (autosomal recessive), noting that only
    this one founder variant has been scored. The ClinGen summary states that
    the mechanism appears to be gain of function, whereas the primary studies
    describe an unstable, aggregation-prone protein whose levels are severely
    reduced; functional_impact_category is left unset because the two readings
    have not been reconciled. A complete loss of Emg1 in mice is lethal before
    implantation, so p.Asp86Gly is at most a strongly hypomorphic allele in
    humans.
pathophysiology:
- name: EMG1 D86G Protein Instability and Degradation
  biological_scale: MOLECULAR
  description: >-
    The Asp86Gly substitution does not reduce EMG1 mRNA but sharply reduces
    EMG1 protein. The mutant protein shows increased self-association and
    RNA binding, accumulates in nuclear foci and is degraded by the
    proteasome. Its catalytic activity, the N1-methylation of the 18S rRNA
    pseudouridine, is preserved in vitro.

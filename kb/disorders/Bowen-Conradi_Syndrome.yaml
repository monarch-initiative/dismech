        fibroblasts, to rapidly proliferating embryonic cells and the
        developmental delay of the disease. Graded IN_VITRO because the
        inference rests on their cultured-cell data; the step to the
        developing brain is not measured, hence INDIRECT.
  - target: Global Prenatal and Postnatal Growth Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:25708872
      reference_title: "Growth arrest in the ribosomopathy, Bowen-Conradi syndrome, is due to dramatically reduced cell proliferation and a defect in mitotic progression."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In fibroblasts derived from the BCS mouse embryos, we detected a high
        proportion of binucleated cells, indicating that a mitotic defect
        underlies the growth arrest in BCS.
      explanation: >-
        The study attributes the growth arrest of the disease to the mitotic
        defect it measured in model cells; the extension to whole-body growth
        is the authors' interpretation.

progression:
- phase: Prenatal onset
  notes: >-
    Growth restriction begins before birth, and affected infants are born
    small with microcephaly, micrognathia, joint limitation and rocker-bottom
    feet.
  evidence:
  - reference: ORPHA:1270
    reference_title: "Bowen-Conradi syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: Antenatal"
    explanation: Orphanet records antenatal onset.
- phase: Death in infancy
  notes: >-
    Death usually occurs within the first year or in early childhood, at an
    average age of about 13 months. The cause is not well defined and appears
    to follow severe failure to thrive.
  evidence:
  - reference: PMID:484596
    reference_title: "The Bowen-Conradi syndrome -- a highly lethal autosomal recessive syndrome of microcephaly, micrognathia, low birth weight, and joint deformities."

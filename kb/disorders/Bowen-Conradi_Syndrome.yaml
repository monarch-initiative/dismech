    causal_link_type: DIRECT
- name: Delayed 18S rRNA Maturation and Small Ribosomal Subunit Biogenesis
  biological_scale: MOLECULAR
  description: >-
    EMG1 is a small subunit processome factor required for 18S rRNA maturation
    and 40S subunit production, in addition to catalysing N1-methylation of
    the pseudouridine at the m1acp3-pseudouridine site of 18S rRNA. In yeast
    the assembly-factor role and the methyltransferase role are separable. In
    patient lymphoblasts and fibroblasts, 18S rRNA processing is slightly but
    consistently delayed, although steady-state 40S levels and global protein
    synthesis are not detectably reduced in these cells.

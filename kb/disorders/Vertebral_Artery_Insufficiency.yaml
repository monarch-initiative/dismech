    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      VAI in cervical spine trauma has an approximate posterior circulation stroke risk of 9%.
    explanation: This meta-analysis quantifies posterior-circulation stroke risk after traumatic vertebral artery injury.

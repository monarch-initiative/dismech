- name: Extrinsic bony compression of the vertebral artery
  description: >-
    Mechanical compression of the vertebral artery by adjacent bone is a
    non-atherosclerotic, structural route to vertebral artery stenosis. Because
    the vessel traverses the cervical transverse foramina, osteophytes and other
    bony encroachment can narrow the lumen. The cited review establishes bony
    compression as one of several
    non-atherosclerotic stenosis etiologies; it does not characterize
    position-dependent or rotational compression, so no dynamic-compression
    claim is asserted here.
  biological_scale: TISSUE
  locations:
  - preferred_term: vertebral artery
    term:
      id: UBERON:0001535
      label: vertebral artery

- name: Atherosclerotic vertebral artery occlusion
  description: >-
    Atherosclerotic vertebral artery occlusion is modeled separately from
    stenosis so interventions supported only for stenotic lesions do not export
    to chronic total occlusion. Occlusion can cause posterior-circulation
    ischemia, while its hemodynamic impact depends on the opposite vertebral
    artery and collateral circulation.
  biological_scale: TISSUE

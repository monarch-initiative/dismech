environmental:
- name: Atherosclerotic vascular risk factor burden
  description: >-
    Symptomatic vertebrobasilar disease cohorts have a high prevalence of
    conventional vascular risk factors, especially hypertension and
    hyperlipidemia; smoking, diabetes, coronary disease, obesity, and other
    vascular risk factors are tracked and treated as part of risk-factor
    management.
  influences_mechanisms:
  - target: Atherosclerotic vertebral artery stenosis
    environmental_effect: PREDISPOSES
    causal_link_type: UNKNOWN
    description: Conventional vascular risk-factor burden predisposes to atherosclerotic vertebral artery disease, but this aggregate clinical evidence does not establish a uniform directness or intermediate sequence.
    evidence:
    - reference: PMID:35301953
      reference_title: "Vertebral Artery Interventions: A Comprehensive Updated Review."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In addition, therapies are targeted at reducing atherosclerotic risk factors, such as hypertension, hyperlipidaemia, smoking, diabetes mellitus, and other lifestyle modifications are recommended for all patients with V.A. disease.
      explanation: Identifies modifiable atherosclerotic risk factors in vertebral artery disease but does not directly observe the omitted plaque-development sequence.
  - target: Atherosclerotic basilar artery stenosis or occlusion
    environmental_effect: PREDISPOSES
    causal_link_type: UNKNOWN
    description: Conventional vascular risk-factor burden is associated with atherosclerotic basilar artery disease, but the mixed-cohort evidence does not establish site-specific causal directness.
    evidence:
    - reference: PMID:25977279
      reference_title: Hemodynamic Features of Symptomatic Vertebrobasilar Disease.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The cohort (n=72; 44% women) had a mean age of 65.6 years; 72% presented with ischemic stroke. Hypertension (93%) and hyperlipidemia (81%) were the most prevalent vascular risk factors.
      explanation: The selected mixed vertebral/basilar cohort documents high risk-factor prevalence but has no comparator and does not isolate a basilar causal effect.

    term:
      id: CL:0000192
      label: smooth muscle cell
  evidence:
  - reference: PMID:21050408
    reference_title: "Vertebrobasilar Flow Evaluation and Risk of Transient Ischaemic Attack and Stroke study (VERiTAS): rationale and design."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Over one-third of ischaemic strokes occur in the posterior circulation, and a leading cause is atherosclerotic vertebrobasilar disease.
    explanation: This identifies atherosclerotic disease encompassing vertebral lesions as a leading posterior-circulation ischemic stroke cause.
  - reference: PMID:25977279
    reference_title: Hemodynamic Features of Symptomatic Vertebrobasilar Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with recent vertebrobasilar transient ischemic attack or stroke and ≥50% atherosclerotic stenosis or occlusion in vertebral or basilar arteries (BA) were enrolled.
    explanation: The VERiTAS cohort explicitly included symptomatic atherosclerotic vertebral stenosis.
  - reference: PMID:25977279
    reference_title: Hemodynamic Features of Symptomatic Vertebrobasilar Disease.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The correlation between flow and the residual diameter at the site of stenosis was more robust and evident both in the BA (rho=0.65, p<0.01 for BA) and VA (rho=0.62, p<0.01) (Figure 1).
    explanation: Residual vertebral lumen, rather than percentage stenosis alone, is associated with local vertebral flow; this only partially supports the broader disease node.
  downstream:
  - target: Posterior circulation hypoperfusion
    description: Severe vertebral stenosis can contribute to distal hypoperfusion when residual lumen and compensatory inflow or collateral capacity are inadequate.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced residual vertebral artery lumen
    - Bilateral or tandem vertebrobasilar disease
    - Contralateral occlusion or hypoplasia
    - Limited collateral reserve
    evidence:
    - reference: PMID:25977279
      reference_title: Hemodynamic Features of Symptomatic Vertebrobasilar Disease.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Tandem disease also had a significant impact on downstream flow: 43 ml/min in multifocal disease (concomitant BA and VA) compared to 71 ml/min in the patients with only BA or only VA disease (p=0.01).
      explanation: Supports reduced downstream flow in tandem disease but does not establish an unqualified vertebral-stenosis effect, so the link is indirect and partial.
    - reference: PMID:28680502
      reference_title: "Pathophysiology and Diagnosis of Vertebrobasilar Insufficiency: A Review of the Literature."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most frequent cause of the hemodynamic changes leading to VBI is atherosclerosis.
      explanation: Names atherosclerosis as a cause of hemodynamic compromise but does not isolate vertebral percentage stenosis or the omitted compensatory factors.
  - target: Vertebrobasilar thromboembolism
    description: Atherosclerotic stenosis can produce a low-flow state that promotes local thrombus formation.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:

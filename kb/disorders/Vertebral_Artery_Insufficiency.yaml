- name: Traumatic vertebral artery injury
  description: >-
    Blunt or penetrating cervical trauma can injure the vertebral artery and is
    associated with posterior-circulation stroke. The available meta-analysis
    quantifies that outcome but does not establish a direct transition, so
    vascular luminal compromise and thromboembolism remain known omitted
    intermediates.
  biological_scale: TISSUE

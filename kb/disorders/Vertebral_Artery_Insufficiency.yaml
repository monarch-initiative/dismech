- name: Vertebral artery dissection
  description: >-
    Vertebral artery dissection begins with a wall tear and mural blood entry
    and can compromise the lumen through stenosis, occlusion, or thrombosis.
    It is modeled separately from other traumatic vertebral injuries because
    the headache and neck-pain evidence is specific to dissection.

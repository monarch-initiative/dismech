pathophysiology:
- name: Atherosclerotic vertebral artery stenosis
  description: >-
    Atherosclerotic narrowing of extracranial or intracranial vertebral arteries
    is a major substrate for symptomatic vertebrobasilar disease. Percentage
    stenosis alone does not predict vertebral flow loss; severe bilateral or
    tandem disease, a small residual lumen, contralateral occlusion or
    hypoplasia, and limited collateral reserve can create hemodynamic compromise.
  biological_scale: TISSUE
  locations:

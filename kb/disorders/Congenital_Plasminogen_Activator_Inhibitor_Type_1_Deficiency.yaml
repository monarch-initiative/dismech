pathophysiology:
- name: Biallelic SERPINE1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic null variants in SERPINE1 abolish PAI-1, a serine protease inhibitor (serpin) that is the primary inhibitor
    of tissue-type and urokinase-type plasminogen activators. In the first characterised kindred a frameshift in exon 4
    left homozygotes with undetectable PAI-1 antigen. The DECREASED modifier records the loss of the inhibitor protein,
    not a measured change in its specific activity.
  molecular_functions:
  - preferred_term: plasminogen activator inhibitor activity
    modifier: DECREASED
    term:
      id: GO:0004867
      label: serine-type endopeptidase inhibitor activity
  genes:
  - preferred_term: SERPINE1
    term:
      id: hgnc:8583
      label: SERPINE1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION

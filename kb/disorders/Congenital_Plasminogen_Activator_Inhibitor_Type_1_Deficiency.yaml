      snippet: Heterozygous PAI-1 deficiency was not associated with abnormal bleeding, even after trauma or surgery.
      explanation: Carriers do not bleed.
    - reference: PMID:29152572
      reference_title: A null mutation in SERPINE1 protects against biological aging in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Heterozygosity was associated with significantly longer leukocyte telomere length, lower fasting insulin levels,

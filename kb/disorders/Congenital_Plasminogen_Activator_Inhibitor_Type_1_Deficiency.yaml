name: Congenital Plasminogen Activator Inhibitor Type 1 Deficiency
description: >-
  Autosomal recessive bleeding disorder caused by biallelic loss-of-function variants in SERPINE1, which encodes
  plasminogen activator inhibitor 1 (PAI-1), the main physiological inhibitor of tissue-type and urokinase-type
  plasminogen activators. Without PAI-1, clots form normally but plasminogen activation is unopposed, so plasmin lyses
  them early. The bleeding is mild to moderate and characteristically delayed: it follows injury, trauma or surgery,
  and spontaneous bleeding does not occur, although intracranial and joint bleeding after mild trauma have been
  reported. Women often present earlier, with heavy menstrual bleeding and postpartum haemorrhage. Heterozygous carriers
  do not bleed. Most known patients come from an Old Order Amish kindred in Indiana carrying a founder frameshift
  (c.699_700dupTA). In that kindred, homozygous young adults also develop myocardial fibrosis. In mice, cardiac fibrosis
  follows loss of PAI-1's restraint on cardiomyocyte TGF-beta signalling. Antifibrinolytics (tranexamic acid,
  epsilon-aminocaproic acid) treat and prevent bleeding.

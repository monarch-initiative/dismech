- name: Derepressed Cardiomyocyte TGF-beta Signaling
  biological_scale: CELLULAR
  description: >-
    PAI-1 deficiency paradoxically causes cardiac-selective fibrosis. In PAI-1-null mice, ventricular myocytes are a
    source of TGF-beta, and loss of PAI-1 increases cardiomyocyte TGF-beta production and Smad signalling, with
    endothelial-to-mesenchymal transition contributing in aged hearts. iPSC-derived cardiomyocytes from homozygous Amish
    patients released more TGF-beta1 after angiotensin II. The human evidence is the imaging and iPSC data; the signalling
    detail comes from mice.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  evidence:
  - reference: PMID:20823384
    reference_title: "Genetic deficiency of plasminogen activator inhibitor-1 promotes cardiac fibrosis in aged mice: involvement of constitutive transforming growth factor-beta signaling and endothelial-to-mesenchymal transition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The numbers of phosphorylated Smad2-, phosphorylated Smad3-, and phosphorylated ERK1/2 MAPK-, but not pAkt/PKB-,
      positive cells were significantly increased in PAI-1-deficient myocardial tissues.
    explanation: Constitutive TGF-beta pathway activation in PAI-1-null mouse hearts.
  - reference: PMID:33439236
    reference_title: Identification of Cardiac Fibrosis in Young Adults With a Homozygous Frameshift Variant in SERPINE1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Induced pluripotent stem cell-derived cardiomyocytes from participants homozygous for the SERPINE1 c.699_700dupTA
      variant exhibited susceptibility to cardiomyocyte injury in response to angiotensin II (increased transforming
      growth factor β1 secretion and release of lactate dehydrogenase)
    explanation: Patient-derived cardiomyocytes secrete more TGF-beta1 under stress.
  downstream:
  - target: Myocardial fibrosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Excess TGF-beta signalling drives collagen deposition in the myocardium.
    evidence:
    - reference: PMID:20823384
      reference_title: "Genetic deficiency of plasminogen activator inhibitor-1 promotes cardiac fibrosis in aged mice: involvement of constitutive transforming growth factor-beta signaling and endothelial-to-mesenchymal transition."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Histological evaluation of myocardial tissues derived from aged PAI-1-deficient mice revealed myocardial
        fibrosis resulting from excessive accumulation of collagen.
      explanation: Fibrosis follows the signalling change in mice.

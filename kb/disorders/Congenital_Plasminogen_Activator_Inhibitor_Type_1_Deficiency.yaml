    reference_title: Plasminogen activator inhibitor with very long half-life (VLHL PAI-1) can reduce bleeding in PAI-1-deficient patients.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: PAI-1 deficiency is characterized by hyperfibrinolysis that results in frequent bleeding episodes.
    explanation: Hyperfibrinolysis as the defining state.
  - reference: PMID:8254029
    reference_title: "Plasminogen activator inhibitor-1 gene-deficient mice. II. Effects on hemostasis, thrombosis, and thrombolysis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      disruption of the PAI-1 gene in mice appears to induce a mild hyperfibrinolytic state and a greater resistance to
      venous thrombosis but not to impair hemostasis.
    explanation: Knockout mice show increased clot lysis.

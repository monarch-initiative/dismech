- name: PAI-1 Antigen and Activity with SERPINE1 Testing
  description: >-
    Undetectable PAI-1 antigen with activity below 1 IU/mL, and/or biallelic SERPINE1 variants. Routine coagulation
    tests are normal, and because the normal range of the activity assay starts at zero, low activity alone cannot
    separate deficiency from normal; antigen measurement and genetic testing are needed.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:28771291
    reference_title: Complete Plasminogen Activator Inhibitor 1 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of complete PAI-1 deficiency is established in a proband when PAI-1 antigen is undetectable and PAI-1
      activity is lower than 1 IU/mL and/or biallelic SERPINE1 pathogenic variants are identified on molecular genetic
      testing.
    explanation: GeneReviews diagnostic criteria.
  - reference: PMID:19141166
    reference_title: Plasminogen activator inhibitor type 1 deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A major issue that contributes to difficulty in establishing an accurate diagnosis of PAI-1 deficiency is that the
      activity assay is accurate in detection of elevated levels but not at the lowest range.
    explanation: Limitation of the activity assay.
treatments:
- name: Antifibrinolytic Therapy
  description: >-
    Tranexamic acid or epsilon-aminocaproic acid treats bleeding episodes, including intracranial haemorrhage given
    intravenously, and is given prophylactically before surgery, dental procedures and childbirth. In pregnancy, oral
    antifibrinolytics are used for bleeding in the first two trimesters and continuously from 26 weeks through two weeks
    postpartum.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tranexamic acid
      term:
        id: CHEBI:48669
        label: tranexamic acid
    - preferred_term: epsilon-aminocaproic acid
      term:
        id: CHEBI:16586
        label: 6-aminohexanoic acid
  target_mechanisms:
  - target: Unopposed Plasminogen Activation and Hyperfibrinolysis
  evidence:
  - reference: PMID:9207454
    reference_title: "Human plasminogen activator inhibitor-1 (PAI-1) deficiency: characterization of a large kindred with a null mutation in the PAI-1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fibrinolysis inhibitors, including epsilon-aminocaproic acid and tranexamic acid, were effective in treating and
      preventing bleeding episodes.
    explanation: Efficacy in the Amish kindred.
  - reference: PMID:28771291
    reference_title: Complete Plasminogen Activator Inhibitor 1 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      continuous administration from 26 weeks' gestation through delivery to prevent preterm labor, and for at least two
      weeks postpartum to prevent postpartum bleeding.
    explanation: GeneReviews pregnancy recommendations, based on two pregnancies.
- name: Fresh Frozen Plasma
  description: Infusion of fresh-frozen plasma to raise PAI-1 activity before antifibrinolytics reach steady state.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: fresh frozen plasma transfusion
    term:
      id: NCIT:C116475
      label: Fresh Frozen Plasma Transfusion
  target_mechanisms:
  - target: Unopposed Plasminogen Activation and Hyperfibrinolysis
  evidence:
  - reference: PMID:28771291
    reference_title: Complete Plasminogen Activator Inhibitor 1 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Infusion of fresh-frozen plasma can be used as needed to increase PAI-1 activity prior to achieving therapeutic
      steady-state levels of antifibrinolytics.
    explanation: GeneReviews management.
- name: Hormonal Suppression for Heavy Menstrual Bleeding
  description: Hormonal suppression, or oral antifibrinolytics, for heavy menstrual bleeding.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: hormone therapy
    term:
      id: NCIT:C15445
      label: Hormone Therapy
  target_mechanisms:
  - target: Menorrhagia
  evidence:
  - reference: PMID:28771291
    reference_title: Complete Plasminogen Activator Inhibitor 1 Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Heavy menstrual bleeding can often be managed with oral antifibrinolytics or hormonal suppression therapy.
    explanation: GeneReviews management.
animal_models:
- name: Serpine1 null mouse
  species: Mouse
  genotype: Serpine1(-/-)
  publication: PMID:8254029
  description: >-
    PAI-1 knockout mice are viable and fertile. They lyse clots faster and resist endotoxin-induced venous thrombosis,
    but they do not bleed spontaneously or rebleed after tail or caecum amputation. Aged knockouts develop
    cardiac-selective fibrosis.
  modeled_mechanisms:
  - target: Unopposed Plasminogen Activation and Hyperfibrinolysis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      The mice show increased clot lysis but no spontaneous or delayed rebleeding after injury, so the bleeding
      phenotype that defines the human disease is not reproduced.
    evidence:
    - reference: PMID:8254029
      reference_title: "Plasminogen activator inhibitor-1 gene-deficient mice. II. Effects on hemostasis, thrombosis, and thrombolysis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Spontaneous bleeding or delayed rebleeding could not be documented in PAI-1-/- mice after partial amputation of
        the tail or of the caecum.
      explanation: The hyperfibrinolytic state is present but bleeding is not.
  - target: Derepressed Cardiomyocyte TGF-beta Signaling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Fibrosis appears in aged mice, while human homozygotes show it as young adults; the mouse mechanism data have not
      been confirmed in human myocardium.
    evidence:
    - reference: PMID:20823384
      reference_title: "Genetic deficiency of plasminogen activator inhibitor-1 promotes cardiac fibrosis in aged mice: involvement of constitutive transforming growth factor-beta signaling and endothelial-to-mesenchymal transition."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Histological evaluation of myocardial tissues derived from aged PAI-1-deficient mice revealed myocardial
        fibrosis resulting from excessive accumulation of collagen.
      explanation: Reproduces the cardiac phenotype.

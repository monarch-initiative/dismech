    snippet: >-
      We previously reported a child with abnormal bleeding and complete PAI-1 deficiency caused by a frame-shift
      mutation in exon 4 of the PAI-1 gene.
    explanation: A SERPINE1 frameshift causes complete PAI-1 deficiency.
  - reference: PMID:9207454
    reference_title: "Human plasminogen activator inhibitor-1 (PAI-1) deficiency: characterization of a large kindred with a null mutation in the PAI-1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Plasminogen activator inhibitor-1 (PAI-1), the primary inhibitor of tissue- and urokinase-type plasminogen
      activators, is considered a critical regulator of the fibrinolytic system.
    explanation: States the inhibitor function lost in the disease.
  downstream:
  - target: Unopposed Plasminogen Activation and Hyperfibrinolysis
    causal_link_type: DIRECT
    description: Without PAI-1, tissue plasminogen activator converts plasminogen to plasmin unchecked.
    evidence:
    - reference: PMID:23988002
      reference_title: Plasminogen activator inhibitor with very long half-life (VLHL PAI-1) can reduce bleeding in PAI-1-deficient patients.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: Patients with this condition form normal blood clots that are quickly lysed by unopposed tPA-activated plasmin.
      explanation: Review account of the mechanism of bleeding.
  - target: Derepressed Cardiomyocyte TGF-beta Signaling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: PAI-1 also restrains TGF-beta production in cardiomyocytes; its loss releases that restraint.
    evidence:
    - reference: PMID:28588076
      reference_title: Plasminogen Activator Inhibitor Type I Controls Cardiomyocyte Transforming Growth Factor-β and Cardiac Fibrosis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We have identified a novel PAI-1-dependent mechanism that regulates cardiomyocyte-derived fibrogenic signals and
        cardiac transcriptional pathways during injury.
      explanation: Mouse and primary cardiomyocyte study linking PAI-1 loss to cardiomyocyte fibrogenic signalling.
- name: Unopposed Plasminogen Activation and Hyperfibrinolysis
  biological_scale: ORGANISM
  description: >-
    Haemostatic clots form normally but are lysed prematurely by plasmin generated by unopposed tPA. In PAI-1-null mice
    the effect is a mild hyperfibrinolytic state without spontaneous bleeding; in patients it gives delayed bleeding after
    a haemostatic challenge, which is why spontaneous bleeding is absent.
  biological_processes:
  - preferred_term: negative regulation of fibrinolysis
    modifier: DECREASED
    term:
      id: GO:0051918
      label: negative regulation of fibrinolysis
  - preferred_term: fibrinolysis

biochemical:
- name: N-terminal pro-B-type natriuretic peptide
  presence: INCREASED
  biomarker_term:
    preferred_term: NT-proBNP
    term:
      id: NCIT:C88524
      label: N-Terminal Fragment Brain Natriuretic Protein
  notes: >-
    Baseline NT-proBNP was higher in the patients who went on to develop cancer
    therapy-related cardiac dysfunction in the one prospective cohort that
    measured it. It is not the only baseline measure with a reported signal: the
    same cohort found an association with atrial fibrillation history and a
    significant difference in baseline global longitudinal strain, and a second
    cohort found larger baseline left ventricular internal diameters in those
    who developed moderate dysfunction. Its on-treatment behaviour is different
    and weaker: in the
    trametinib monotherapy trial NT-proBNP stayed normal in six of the seven
    patients who developed dysfunction, rising only in the single severe case.
    So it has some value as a baseline stratifier and little as a rule-out
    monitor during treatment, and those two uses should not be conflated. The
    baseline separation was median 109 pg/mL (Q1-Q3 51-380) in those who
    developed dysfunction against 54 pg/mL (Q1-Q3 29-149) in those who did not,
    P = 0.047 - overlapping interquartile ranges, so this is a group difference
    rather than a usable individual threshold. No loinc_term is bound; see
    review_notes for the reason.
  evidence:
  - reference: PMID:41065626
    reference_title: Prospective Evaluation of the Cardiovascular Effects of BRAF
      and MEK Inhibitors in Patients With Melanoma.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Patients with CTRCD had higher median baseline N-terminal
      pro-B-type natriuretic peptide compared with those without
    explanation: The baseline association from the cohort that reported it -
      median 109 pg/mL against 54 pg/mL, P = 0.047.
  - reference: PMID:41864169
    reference_title: 'Cardiotoxicity of trametinib monotherapy in adults with
      neurofibromatosis type 1: Results from the TRAIN study.'
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: NT-proBNP remained normal in most cases but may help identify
      patients needing echocardiography.
    explanation: Refutes on-treatment NT-proBNP as a sensitive marker of incident
      dysfunction, which is the claim a reader would otherwise carry over from
      the baseline result above.
progression:
- phase: Early exposure, first weeks to months
  notes: >-
    Contractile dysfunction appears early. In the prospective
    combination-therapy cohort every moderate or severe event was evident by
    four weeks; on trametinib monotherapy median onset was five months with a
    range of one to twelve. Most events are mild and asymptomatic, so detection
    depends on scheduled imaging rather than symptoms.
  evidence:
  - reference: PMID:41065626
    reference_title: Prospective Evaluation of the Cardiovascular Effects of BRAF
      and MEK Inhibitors in Patients With Melanoma.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: All moderate or severe CTRCD was evident by 4 weeks and at least
      partially reversible.
    explanation: Establishes the early-onset phase for combination therapy.
- phase: Recovery after interruption or discontinuation
  notes: >-
    Function recovers after the drug is interrupted or stopped, including in
    severe cases that required permanent discontinuation. Most patients in whom
    therapy was held for mild dysfunction were successfully re-established on
    treatment without recurrence of systolic impairment, so dysfunction is
    usually not a reason to abandon an effective cancer therapy permanently.
  evidence:
  - reference: PMID:37969652
    reference_title: 'Cardiotoxicity of BRAF/MEK Inhibitors: A Longitudinal Study
      Incorporating Contemporary Definitions and Risk Scores.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: the majority of patients were successfully re-established on
      BRAF/MEK inhibitor therapies with no recurrence of left ventricular
      systolic impairment
    explanation: The rechallenge outcome that shapes management.
- phase: Recurrence on re-challenge
  notes: >-
    Dysfunction can recur when the drug is restarted. This was documented
    explicitly in a paediatric and young-adult cohort, where abnormalities
    resolved off therapy and returned on re-initiation. It coexists with the
    adult finding above that most rechallenged patients do not recur, and the
    two have not been reconciled in a single cohort.
  evidence:
  - reference: PMID:35233653
    reference_title: 'Cardiac Function in Children and Young Adults Treated with
      MEK Inhibitors: A Retrospective Cohort Study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: MEKi therapy was interrupted in one patient for borderline cardiac
      dysfunction that subsequently resolved; this patient again developed
      borderline cardiac dysfunction upon re-initiation of therapy
    explanation: A documented within-patient recurrence on rechallenge.
treatments:
- name: MEK inhibitor interruption or discontinuation
  description: >-
    Holding or stopping the drug is the intervention with the clearest evidence
    behind it, since the deficit is exposure-coupled and recovers on withdrawal.
    Most patients held for mild dysfunction are successfully re-established on
    therapy. Note what this trades: the drug is often the effective cancer
    treatment, so interrupting it for an asymptomatic mild ejection-fraction
    fall is not a free action, and in the prospective cohort mild dysfunction
    alone did not prompt dose alteration in any participant.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: cancer therapy interruption for cardiac dysfunction
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: MEK1/2 Inhibition and Loss of Cardioprotective ERK1/2 Signaling
    treatment_effect: INHIBITS
    description: >-
      Withdrawal removes the trigger itself rather than acting on a downstream
      node, which is why recovery is the expected outcome.
    evidence:
    - reference: PMID:41864169
      reference_title: 'Cardiotoxicity of trametinib monotherapy in adults with
        neurofibromatosis type 1: Results from the TRAIN study.'
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: One severe case required permanent discontinuation, after which
        LVEF recovered.
      explanation: Removal of the trigger reverses the phenotype.
  evidence:
  - reference: PMID:41065626
    reference_title: Prospective Evaluation of the Cardiovascular Effects of BRAF
      and MEK Inhibitors in Patients With Melanoma.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: No participants were commenced on potentially cardioprotective
      medications or had BRAFi or MEKi dose alterations on the basis of mild
      CTRCD alone.
    explanation: Records what was actually done for mild dysfunction in practice,
      and is the reason this entry does not claim a cardioprotective drug
      strategy.
discussions:
- discussion_id: mekicm_baseline_risk_prediction_failure
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Reduced left ventricular ejection fraction
  - biochemical#N-terminal pro-B-type natriuretic peptide
  - pathophysiology#Cardiomyocyte Mitochondrial Respiratory Impairment
  prompt: >-
    Which patients starting a MEK inhibitor will develop cancer therapy-related
    cardiac dysfunction?
  rationale: >-
    Partly answerable at the group level, not at the individual level, and
    untested against the mechanism. State the positives first, because they are
    easy to lose. The prospective melanoma cohort concluded that its results
    reinforce the utility of baseline risk stratification; no patient it rated
    low risk developed moderate or severe dysfunction, and everyone who did
    reach moderate or worse was at least medium risk at baseline. That cohort
    also found three baseline differences between affected and unaffected
    patients: higher NT-proBNP, a history of atrial fibrillation, and lower
    global longitudinal strain. A second cohort found larger baseline left
    ventricular internal diameters in those who developed moderate dysfunction.
    So it is not true that no baseline parameter discriminates.

    What is true is weaker and more specific. The discrimination is coarse: the
    tool is useful mainly for identifying a low-risk group to monitor less, and
    the same cohort's authors recommend it for baseline stratification rather
    than ongoing monitoring. Most events occur in patients rated low or medium
    risk, and the retrospective cohort's authors say outright that the tool's
    utility here is limited and better ones are needed. The individual signals
    do not cohere into a mechanism: strain was *better* in those who went on to
    develop dysfunction, not worse, which is the opposite of what a
    cardiac-reserve model predicts, and the trametinib monotherapy trial and the
    paediatric cohort each found no baseline parameter that predicted the
    outcome in their populations. The null result for hypertension and for
    cardiovascular magnetic resonance myocardial and perfusion characteristics
    is real but narrow, and should not be read as a general negative.

    The common feature of the tools that do only coarsely is that they measure
    cardiac reserve - prior cardiovascular disease, baseline function, cumulative
    anthracycline dose - which is the right variable for anthracycline
    cardiotoxicity, where injury accumulates with dose. This disease is not like
    that: it is exposure-coupled, early, reversible and recurs on rechallenge,
    so what should determine susceptibility is how much mitochondrial oxidative
    reserve a given heart has and how briskly it mounts an innate immune
    response to mitochondrial damage. Neither has been measured at baseline
    against outcome in this setting, and that is the part of this gap that is
    squarely open rather than merely imprecise. The candidates the mechanism implies are
    circulating cell-free mitochondrial DNA, which rises in patients on drug; an
    interferon or inflammatory tone measure, since the cGAS-STING arm makes
    susceptibility time-varying rather than fixed; the neutrophil-to-lymphocyte
    ratio, which predicts cardiotoxicity for anthracyclines, trastuzumab and
    immune checkpoint inhibitors and has not been tested here; and cardiac
    high-energy phosphate reserve by phosphorus magnetic resonance spectroscopy.
    The mechanism-side version of this gap, with proposed experiments, is on the
    mek_inhibition_cardiac_mitochondrial_injury module.
  evidence:
  - reference: PMID:41065626
    reference_title: Prospective Evaluation of the Cardiovascular Effects of BRAF
      and MEK Inhibitors in Patients With Melanoma.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The present results reinforce the utility of baseline cardiotoxicity
      risk stratification, including assessment of N-terminal pro-B-type
      natriuretic peptide.
    explanation: Supports the rationale's opening claim that baseline
      stratification does have group-level value here, which is why this gap is
      framed around coarse discrimination and untested mechanism-derived markers
      rather than around an absence of any signal.
  - reference: PMID:41065626
    reference_title: Prospective Evaluation of the Cardiovascular Effects of BRAF
      and MEK Inhibitors in Patients With Melanoma.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: No patient at low baseline risk developed moderate or severe CTRCD.
    explanation: Supports the rationale's claim that the tool's value is
      concentrated at the low-risk end. The single most useful positive result in
      the literature, and a genuine stratification success.
  - reference: PMID:41065626
    reference_title: Prospective Evaluation of the Cardiovascular Effects of BRAF
      and MEK Inhibitors in Patients With Melanoma.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: A history of AF was associated with the development of any severity
      of CTRCD
    explanation: Supports the rationale's claim that individual baseline
      parameters do discriminate. This one points the direction a
      cardiac-reserve model expects, unlike the strain result below.
  - reference: PMID:41065626
    reference_title: Prospective Evaluation of the Cardiovascular Effects of BRAF
      and MEK Inhibitors in Patients With Melanoma.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: those who developed CTRCD had lower baseline GLS compared with those
      who did not
    explanation: A significant baseline difference whose direction contradicts a
      cardiac-reserve model, since global longitudinal strain is negative and a
      lower value is therefore better function. Supports the gap's claim that
      the individual signals do not cohere, while refuting any claim that no
      baseline parameter differs at all.
  - reference: PMID:37969652
    reference_title: 'Cardiotoxicity of BRAF/MEK Inhibitors: A Longitudinal Study
      Incorporating Contemporary Definitions and Risk Scores.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Left ventricular internal diameters in diastole and systole were
      larger in patients who developed moderate CTRCD compared with those who
      did not
    explanation: Supports the rationale's claim that a baseline echo parameter
      discriminated in this cohort too. It is the continuation of the same
      RESULTS sentence the entry quotes for the ejection-fraction and strain
      null, which is why that null must not be read as a general negative.
  - reference: PMID:37969652
    reference_title: 'Cardiotoxicity of BRAF/MEK Inhibitors: A Longitudinal Study
      Incorporating Contemporary Definitions and Risk Scores.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The utility of the Heart Failure Association/ICOS risk
      stratification tool appears limited in this group, and better risk
      prediction tools are needed.
    explanation: The guideline tool's own validation failure in this population,
      stated by the authors.
  - reference: PMID:37969652
    reference_title: 'Cardiotoxicity of BRAF/MEK Inhibitors: A Longitudinal Study
      Incorporating Contemporary Definitions and Risk Scores.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The baseline left ventricular ejection fraction and global
      longitudinal strain were not different in patients who developed moderate
      CTRCD vs those who did not.
    explanation: Baseline function, the core of every cardiac-reserve tool, does
      not discriminate.
  - reference: PMID:41864169
    reference_title: 'Cardiotoxicity of trametinib monotherapy in adults with
      neurofibromatosis type 1: Results from the TRAIN study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: No baseline clinical or cardiovascular parameters could predict
      CTRCD.
    explanation: The same negative result under monotherapy, where attribution to
      the MEK inhibitor is unambiguous.
  - reference: PMID:35233653
    reference_title: 'Cardiac Function in Children and Young Adults Treated with
      MEK Inhibitors: A Retrospective Cohort Study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: No clinical or demographic differences were detected between those
      who maintained normal cardiac function and those who developed borderline
      or overt cardiac dysfunction.
    explanation: The same negative result in children and young adults.
  - reference: PMID:39936506
    reference_title: Multifaceted roles of neutrophils in cardiac disease.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: As noted with other mechanisms of cardiac toxicity, human studies
      have shown that an increased NLR ratio predisposes patients to higher risks
      of developing cardiac toxicity.
    explanation: Establishes the neutrophil-to-lymphocyte ratio as a validated
      risk marker in other cancer-therapy cardiotoxicities, which is the basis
      for proposing it here. It has not been tested for MEK inhibitors.
- discussion_id: mekicm_paediatric_developmental_window
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - phenotypes#Reduced left ventricular ejection fraction
  - progression#Recovery after interruption or discontinuation
  prompt: >-
    Is the reversibility seen in children evidence of no lasting harm, or only
    evidence that function recovers during the treatment period?
  rationale: >-
    The mismatch is between what the mammalian developmental models say is at
    stake and what the paediatric clinical data can see. MEK inhibitors are
    given to children for years, principally selumetinib for neurofibromatosis
    type 1 plexiform neurofibroma and trametinib for paediatric glioma. MEK-ERK
    signalling is not merely supportive in the developing heart: it actively
    reinforces ventricular cardiomyocyte identity even after differentiation,
    and in the mouse, reduced upstream MAPK input across the
    proliferation-to-maturation window shifts that switch and produces dilated
    cardiomyopathy in adulthood, with the earliest echocardiographic signs
    appearing only at three months of age. That is a non-reversing structural
    phenotype on a long latency, which is categorically different from the
    mild reversible deficit this entry describes.

    The paediatric clinical evidence is reassuring and does not reach that
    question. The one cohort had a median twelve months of follow-up, found
    dysfunction that resolved off therapy and recurred on re-initiation, and
    reported no evidence of permanent cardiac dysfunction - which is a finding
    about the exposure period, not about adult outcomes in someone treated as a
    child. No paediatric MEK-inhibitor cohort has been followed into adulthood,
    and no chamber-identity or maturation-marker readout exists for any
    mammalian heart exposed to a clinical MEK inhibitor. The mechanism-side
    version of this gap is the mekcard_paediatric_developmental_window
    discussion on the mek_inhibition_cardiac_mitochondrial_injury module, where
    the identity and maturation arm is carried as an EMERGING hypothesis rather
    than an asserted mechanism.
  evidence:
  - reference: PMID:35233653
    reference_title: 'Cardiac Function in Children and Young Adults Treated with
      MEK Inhibitors: A Retrospective Cohort Study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: There was no evidence of permanent cardiac dysfunction.
    explanation: The reassuring paediatric result, over a median twelve months
      of follow-up, which bounds rather than answers the adult-outcome question.
  - reference: PMID:38293792
    reference_title: The MEK-ERK signaling pathway promotes maintenance of
      cardiac chamber identity.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: The maintenance of chamber-specific features requires active
      reinforcement, even in differentiated cardiomyocytes.
    explanation: Establishes that MEK-ERK input is continuously required to hold
      cardiomyocyte identity, which is the basis for expecting a
      differentiation-state effect alongside the energetic one.
  - reference: PMID:42053511
    reference_title: B-Raf is required for normal murine cardiac development and
      function.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: The earliest signs of altered myocardium via echocardiographs were
      detected by 3 mo.
    explanation: The latency between a developmental MAPK insult and its
      detectable cardiac consequence in the mouse, which is why a twelve-month
      paediatric cohort cannot exclude it.
- discussion_id: mekicm_mild_ctrcd_significance
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Reduced left ventricular ejection fraction
  - diagnosis#Surveillance echocardiography
  prompt: >-
    Does mild cancer therapy-related cardiac dysfunction on a MEK inhibitor
    matter?
  rationale: >-
    Mild dysfunction is the overwhelming majority of what surveillance finds -
    24 of 28 events in the prospective cohort - and its long-term consequences
    are unknown; the authors of the longitudinal study say so explicitly. The
    question has real consequences in both directions. If mild dysfunction is
    benign, then intensive surveillance of a population where nearly half will
    cross the threshold generates interruptions of effective cancer therapy for
    no benefit, and the measured incidence is largely an artefact of how hard
    the study looked. If it is not benign, then a large number of cancer
    survivors carry an unrecognised cardiac legacy from a drug class whose
    indications are expanding rapidly. Resolving it needs long-term follow-up of
    patients with mild dysfunction against hard cardiac outcomes, which no
    published cohort has.
  evidence:
  - reference: PMID:37969652
    reference_title: 'Cardiotoxicity of BRAF/MEK Inhibitors: A Longitudinal Study
      Incorporating Contemporary Definitions and Risk Scores.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The long-term consequences of CTRCD, particularly mild CTRCD,
      warrant evaluation in larger prospective studies.
    explanation: The gap stated by the authors of the longitudinal cohort.

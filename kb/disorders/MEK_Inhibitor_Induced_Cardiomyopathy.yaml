name: MEK Inhibitor-Induced Cardiomyopathy
creation_date: '2026-10-23T00:00:00Z'
category: Complex
categories:
- Treatment Toxicity
- Cardiovascular Disorder
parents:
- Cardiomyopathy
synonyms:
- MEK inhibitor cardiotoxicity
- trametinib-induced cardiomyopathy
- MEKi-associated cancer therapy-related cardiac dysfunction
description: >-
  Cardiac dysfunction associated with pharmacological MEK1/2 inhibition
  (trametinib, selumetinib, cobimetinib, binimetinib), used in BRAF V600-mutant
  melanoma and other BRAF- or RAS-pathway-driven cancers and, increasingly, in
  neurofibromatosis type 1 and the RASopathies. The characteristic presentation
  is an asymptomatic fall in left ventricular ejection fraction appearing within
  weeks to months of starting the drug, usually mild, usually reversible on
  interruption or discontinuation, and recurring on re-challenge. Arterial
  hypertension is about as common as the contractile deficit; pulmonary embolism
  is also reported at increased risk in combination regimens. The mechanism is
  on-target rather than idiosyncratic: the MEK-ERK axis is cardioprotective, and
  its inhibition produces a cardiomyocyte mitochondrial respiratory lesion with
  a secondary innate immune response, curated as the
  mek_inhibition_cardiac_mitochondrial_injury module. Where combination
  BRAF-MEK inhibition is used, the cardiac effect appears to be driven by the
  MEK inhibitor component. The defining open problem is prediction. The
  guideline risk tool imported from anthracycline cardio-oncology stratifies
  only coarsely here: it does appear to identify a low-risk group, in that no
  patient rated low risk at baseline developed moderate or severe dysfunction
  in the one prospective cohort, but most events occur in patients it rates low
  or medium, and its authors call its utility limited in this setting. Several
  individual baseline parameters differ significantly between affected and
  unaffected patients - NT-proBNP, atrial fibrillation history, left
  ventricular internal diameters, global longitudinal strain - but they do not
  agree on a direction: strain was better, not worse, in those who went on to
  develop dysfunction. So baseline cardiac reserve gives coarse stratification
  and no reliable individual prediction, and no marker derived from the
  mechanism has been tested at all.
review_notes: >-
  Deliberately carries no prevalence block. Every published figure is a
  cumulative incidence among patients receiving the drug over a defined
  follow-up - 45.9%, 27% and 23% in three cohorts, 50% for borderline function
  in a paediatric series - which is a property of a treated cohort and its
  surveillance intensity, not a population frequency for this entry. Those
  figures are carried as evidence on the clinical features and the case
  definition instead, each with its cohort named, following the same reasoning
  recorded in Anthracycline_Induced_Cardiomyopathy. The three adult cohort
  figures are not interchangeable: they used different definitions, follow-up
  schedules and drug combinations, and the highest came from the most intensive
  prospective imaging protocol, so the spread partly measures how hard each
  study looked.

  No disease_term is bound because MONDO has no class for this disease.
  Searched ols:mondo for "l~cardiomyopathy due to" (returns MONDO:0022653
  cardiomyopathy due to anthracyclines, MONDO:0016332 hypertrophic
  cardiomyopathy due to intensive athletic training and six genetic or
  mitochondrial entries, none drug-class generic), "l~induced cardiomyopathy"
  (returns only MONDO:0023006 doxorubicin induced cardiomyopathy and
  MONDO:1016239 cardiomyopathy-induced heart failure, non-human animal),
  "l~drug-induced cardiomyopathy", "l~toxic cardiomyopathy", "l~cardiotoxicity",
  "l~cardiomyopathy due to drug", "l~MEK", "l~trametinib" and "l~kinase
  inhibitor", all of which return nothing. So MONDO codes anthracycline and
  doxorubicin cardiomyopathy specifically, has no term for MEK-inhibitor or
  kinase-inhibitor cardiomyopathy, and offers no generic drug-induced
  cardiomyopathy parent to narrow from. MONDO:0004994 cardiomyopathy is recorded
  as a broadMatch, which is a cross-reference and deliberately does not retire
  this concept from the curation queue. A MONDO term request is the right
  follow-up.

  The NT-proBNP record binds NCIT:C88524, the analyte itself, confirmed
  admissible by running linkml-term-validator against the binding. The nearby
  NCIT:C96610 N-Terminal ProB-type Natriuretic Peptide Measurement also
  validates and is used that way elsewhere in kb/, but biomarker_term is
  documented in the schema as taking the biomarker entity (proteins, genes,
  fusion products) and dismech has a separate loinc_term slot for the
  measurement, so the analyte term is the better fit here; it is also the
  majority binding for this analyte in kb/.

  Do not use an inferred-ancestor walk to decide whether a term is in its
  dynamic enum. runoak -i ols:ncit ancestors -p i reports no NCIT:C25218
  ancestor for NCIT:C15302 Physical Therapy and none for NCIT:C49236
  Therapeutic Procedure, both of which are admissible TreatmentTerms and the
  second of which this entry uses, so through the ols adapter that walk returns
  nothing for anything and its empty result is silence rather than a negative
  answer. The authoritative check is to bind the term and run
  just validate-terms, which expands the enum from the ontology.

  No LOINC code is bound: cache/loinc/terms.csv holds no natriuretic-peptide
  row and LOINC is not yet routed in conf/oak_config.yaml, so a label here
  could not be read from a lookup.

  Scope. This entry covers myocardial dysfunction. MEK inhibitors also cause
  retinopathy, rash, diarrhoea and ocular toxicity, and QTc effects have been
  studied separately; none of those is treated here. The hypertension and
  pulmonary embolism features are retained because they come from the same
  cardiovascular safety analyses and bear on the same monitoring decision, not
  because they are cardiomyopathy. Trametinib use to treat cardiomyopathy in
  the RASopathies is the opposite indication and is modelled in those entries,
  not here.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0004994
      label: cardiomyopathy
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      Broad cross-reference only. MONDO has no class for MEK-inhibitor or
      kinase-inhibitor cardiomyopathy and no generic drug-induced cardiomyopathy
      parent, so neither exactMatch nor narrowMatch is available and this entry
      stays unanchored to a specific MONDO concept. See review_notes for the
      searches run.
definitions:
- name: Cancer therapy-related cardiac dysfunction on a MEK inhibitor
  definition_type: CASE_DEFINITION
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Graded cancer therapy-related cardiac dysfunction (CTRCD) as defined by the
    International Cardio-Oncology Society and the 2022 European Society of
    Cardiology cardio-oncology guidelines, applied to a patient receiving a MEK
    inhibitor. The grading admits asymptomatic disease, which is what makes the
    measured incidence depend so strongly on the surveillance schedule: the
    overwhelming majority of events in prospective cohorts are mild and
    asymptomatic and would not be found without scheduled echocardiography.
  scope: Patients receiving a MEK inhibitor alone or with a BRAF inhibitor
  evidence:
  - reference: PMID:41065626
    reference_title: Prospective Evaluation of the Cardiovascular Effects of BRAF
      and MEK Inhibitors in Patients With Melanoma.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: CTRCD was defined using International Cardio-Oncology Society
      definitions.
    explanation: Names the definition this entry's clinical features are graded
      against.
  - reference: PMID:41065626
    reference_title: Prospective Evaluation of the Cardiovascular Effects of BRAF
      and MEK Inhibitors in Patients With Melanoma.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'Twenty-eight participants (45.9%) developed hypertension and 45.9%
      developed CTRCD: 24 (85.7%) mild, 3 (10.7%) moderate, and 1 (3.6%) severe.'
    explanation: The severity distribution that makes the case definition's
      inclusion of asymptomatic disease consequential.
diagnosis:
- name: Surveillance echocardiography
  description: >-
    Scheduled echocardiography is how this disease is found, because most cases
    are asymptomatic and would not present clinically. Its intensity partly
    determines the measured incidence, which is why the cohort figures in this
    entry are reported with their surveillance schedules rather than pooled. The
    prospective cohort concluded that guidelines should consider early
    surveillance echocardiography for higher-risk patients; the trametinib
    monotherapy trial recommended continuing it through the first year with less
    frequent monitoring thereafter.
  diagnosis_term:
    preferred_term: surveillance echocardiography during MEK inhibitor therapy
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  notes: >-
    No LOINC measurement is bound for the ejection-fraction readout. LOINC is
    not yet routed in conf/oak_config.yaml and cache/loinc/terms.csv has no
    row for it, so a code and label here could not be read from a lookup; per
    CLAUDE.md a LOINC label must never be typed from memory or copied from a
    web page. Seeding the cache with just loinc-seed-cache is the follow-up.
  evidence:
  - reference: PMID:41864169
    reference_title: 'Cardiotoxicity of trametinib monotherapy in adults with
      neurofibromatosis type 1: Results from the TRAIN study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We recommend continuing echocardiography during the first year, with
      consideration for less frequent monitoring thereafter based on clinical
      findings.
    explanation: The monitoring schedule recommended from the monotherapy trial.
  - reference: PMID:41065626
    reference_title: Prospective Evaluation of the Cardiovascular Effects of BRAF
      and MEK Inhibitors in Patients With Melanoma.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Future guidelines should consider recommending early surveillance
      echocardiography for higher risk patients.
    explanation: The surveillance recommendation from the prospective cohort.
pathophysiology:
- name: MEK1/2 Inhibition and Loss of Cardioprotective ERK1/2 Signaling
  description: >-
    An allosteric MEK1/2 inhibitor abrogates ERK1/2 phosphorylation in
    cardiomyocytes. This is on-target action on a pathway the heart depends on,
    not an off-target or idiosyncratic effect, which is why the toxicity tracks
    the drug class rather than a particular molecule and why it cannot be
    engineered away by improving selectivity. In combination BRAF-MEK regimens
    the cardiac effect is attributed to the MEK inhibitor component.
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: mek_inhibition_cardiac_mitochondrial_injury#MEK1/2 Allosteric
    Inhibition and ERK1/2 Abrogation
  cell_types: &cardiomyocyte
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  genes:
  - preferred_term: MAP2K1
    term:
      id: hgnc:6840
      label: MAP2K1
  - preferred_term: MAP2K2
    term:
      id: hgnc:6842
      label: MAP2K2
  biological_processes:
  - preferred_term: ERK1/2 signaling in cardiomyocytes
    modifier: DECREASED
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  evidence:
  - reference: PMID:28861837
    reference_title: 'Cardiovascular Effects of the MEK Inhibitor, Trametinib: A
      Case Report, Literature Review, and Consideration of Mechanism.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: This important adverse effect likely arises from inhibition of the
      cardioprotective effects of the MEK-ERK signaling axis.
    explanation: States the on-target reading of the trigger that this entry
      adopts.
  - reference: PMID:31397860
    reference_title: 'Cardiovascular Adverse Events Associated With BRAF and MEK
      Inhibitors: A Systematic Review and Meta-analysis.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: Experimental evidence suggests that the MAPK pathway has a
      cardioprotective role in the heart.
    explanation: Independent statement of the cardioprotective premise, from the
      meta-analysis that quantified the clinical risk.
  downstream:
  - target: Cardiomyocyte Mitochondrial Respiratory Impairment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Through loss of ERK-dependent STAT3 serine-727 phosphorylation and the
      mitochondrial STAT3 pool that supports electron transport complex I and II
      activity. The intermediate steps are curated in the module.
    evidence:
    - reference: PMID:42430470
      reference_title: The MEK inhibitor trametinib incurs mitochondrial injury
        and induces innate immune responses in the mouse heart.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Here, we found that MEK inhibition abrogated the phosphorylation
        of STAT3 at S727 and prevented the translocation of STAT3 to mitochondria
        in cardiomyocytes.
      explanation: Establishes the first intermediate between the trigger and the
        respiratory lesion.
- name: Cardiomyocyte Mitochondrial Respiratory Impairment
  description: >-
    Oxidative phosphorylation falls in cardiomyocytes, with the lesion at the
    respiratory complexes themselves. Demonstrated in isolated murine cardiac
    mitochondria, in primary rodent cardiomyocytes at nanomolar drug
    concentrations, and in human iPSC-derived cardiomyocytes. No human
    myocardial measurement exists, so the human limb of this node rests on
    iPSC-derived cardiomyocytes and on circulating mitochondrial DNA in treated
    patients rather than on cardiac tissue.
  role: central_effector
  biological_scale: CELLULAR
  conforms_to: mek_inhibition_cardiac_mitochondrial_injury#Cardiac Mitochondrial
    Respiratory Chain Failure
  cell_types: *cardiomyocyte
  cellular_components:
  - preferred_term: cardiac mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  biological_processes:
  - preferred_term: cardiomyocyte oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  evidence:
  - reference: PMID:42430470
    reference_title: The MEK inhibitor trametinib incurs mitochondrial injury and
      induces innate immune responses in the mouse heart.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Collectively, these findings demonstrated that Trm compromises
      cardiac mitochondrial oxidative function in vivo and that this bioenergetic
      injury occurs at least, in part, due to intrinsic defects in respiratory
      flux through the ETS.
    explanation: The primary in vivo demonstration of this node.
  - reference: PMID:42430470
    reference_title: The MEK inhibitor trametinib incurs mitochondrial injury and
      induces innate immune responses in the mouse heart.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In multiple rodent and human cardiomyocyte platforms, Trm diminished
      mitochondrial respiratory capacity at nanomolar concentrations
    explanation: Establishes that the lesion occurs in human cardiomyocytes and
      at concentrations in the clinical range.
  downstream:
  - target: Cardiac Innate Immune Activation
    causal_link_type: DIRECT
    description: >-
      Injured mitochondria release mitochondrial DNA, which activates cGAS-STING
      in the heart. Circulating mitochondrial DNA rises in patients on drug.
    evidence:
    - reference: PMID:42430470
      reference_title: The MEK inhibitor trametinib incurs mitochondrial injury
        and induces innate immune responses in the mouse heart.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: Trm-mediated mitochondrial injury led to the release of
        mitochondrial damage-associated molecular patterns including
        mitochondrial DNA in both mice and humans, triggering activation of
        canonical innate immune pathways including cGAS-STING.
      explanation: States the link and notes that the mitochondrial DNA signal
        was seen in humans as well as mice.
  - target: Reduced left ventricular ejection fraction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Impaired oxidative capacity reduces contractile performance. The innate
      immune arm carries part of this effect but not all of it, so a direct
      bioenergetic contribution remains.
    evidence:
    - reference: PMID:42430470
      reference_title: The MEK inhibitor trametinib incurs mitochondrial injury
        and induces innate immune responses in the mouse heart.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: STING activation contributes to, but does not entirely account
        for, Trm-induced cardiac injury.
      explanation: The incomplete immune rescue is what leaves a bioenergetic
        route to the contractile deficit.
- name: Cardiac Innate Immune Activation
  description: >-
    Released mitochondrial DNA activates cGAS-STING and its STAT1, STAT3 and
    NF-kB effectors in the myocardium, raising interferon and chemokine
    transcripts and IL-1beta, IL-6 and TNF-alpha, with NLRP3 inflammasome
    assembly in the left ventricle. The arm appears later than the mitochondrial
    lesion, is coupled to continuing exposure, and resolves on withdrawal, which
    matches the clinical reversibility. It is demonstrated in the mouse only;
    the cellular source of the cytokines is unidentified even there, and whether
    it operates in patients is untested.
  role: amplifier
  biological_scale: TISSUE
  conforms_to: mek_inhibition_cardiac_mitochondrial_injury#cGAS-STING Innate
    Immune Activation
  cell_types: *cardiomyocyte
  biological_processes:
  - preferred_term: cGAS-STING signaling in the myocardium
    modifier: INCREASED
    term:
      id: GO:0140896
      label: cGAS/STING signaling pathway
  - preferred_term: cardiac innate immune activation
    modifier: INCREASED
    term:
      id: GO:0045087
      label: innate immune response
  genes:
  - preferred_term: CGAS
    term:
      id: hgnc:21367
      label: CGAS
  - preferred_term: STING1
    term:
      id: hgnc:27962
      label: STING1
  evidence:
  - reference: PMID:42430470
    reference_title: The MEK inhibitor trametinib incurs mitochondrial injury and
      induces innate immune responses in the mouse heart.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: We found that Trm (3 mg/kg) for 14 days led to up-regulation of
      TBK1, cGAS, and pSTING in whole heart lysates compared to vehicle-treated
      mice
    explanation: Direct demonstration of pathway activation in cardiac tissue.
  - reference: PMID:42430470
    reference_title: The MEK inhibitor trametinib incurs mitochondrial injury and
      induces innate immune responses in the mouse heart.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: These changes were not evident on day 3 of treatment and had
      completely resolved after a 14-day washout period in which mice did not
      receive Trm
    explanation: The exposure-coupling and reversal of the immune arm, which is
      what makes it a plausible substrate for the reversible clinical phenotype.
  downstream:
  - target: Reduced left ventricular ejection fraction
    causal_link_type: DIRECT
    description: >-
      STING antagonism partially preserves contractile function in drug-exposed
      mice, making the immune arm causal for part of the deficit.
    evidence:
    - reference: PMID:42430470
      reference_title: The MEK inhibitor trametinib incurs mitochondrial injury
        and induces innate immune responses in the mouse heart.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: To test whether STING activation is critical for the
        hypocontractile phenotype of Trm cardiotoxicity, we gavaged mice with
        vehicle or Trm (3 mg/kg per day), administered intraperitoneal injections
        of either vehicle or the STING antagonist H-151
      explanation: Describes the interventional test behind this edge. Graded
        INDIRECT for a human cardiomyopathy entry because the rescue is murine.
phenotypes:
- category: Cardiovascular
  name: Reduced left ventricular ejection fraction
  description: >-
    An asymptomatic or minimally symptomatic fall in left ventricular ejection
    fraction is the defining feature. It is usually mild, appears early - all
    moderate and severe events in one prospective cohort were evident by four
    weeks, and median onset was five months on trametinib monotherapy - and is
    at least partially reversible on interruption or discontinuation. It recurs
    when the drug is restarted, which is the clearest clinical evidence that the
    deficit is exposure-coupled rather than cumulative injury.
  phenotype_term:
    preferred_term: Reduced left ventricular ejection fraction
    term:
      id: HP:0012664
      label: Reduced left ventricular ejection fraction
    temporality: TRANSIENT
  evidence:
  - reference: PMID:31397860
    reference_title: 'Cardiovascular Adverse Events Associated With BRAF and MEK
      Inhibitors: A Systematic Review and Meta-analysis.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: A higher risk of a decrease in left ventricular ejection fraction
      was associated with patients with a mean age younger than 55 years
    explanation: Meta-analytic evidence for the feature, and for an age gradient
      that runs opposite to conventional cardiovascular risk.
  - reference: PMID:41864169
    reference_title: 'Cardiotoxicity of trametinib monotherapy in adults with
      neurofibromatosis type 1: Results from the TRAIN study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'Of 30 patients, 7 (23%) developed CTRCD: 1 severe, 4 moderate and 2
      mild.'
    explanation: Incidence and severity distribution under trametinib
      monotherapy, without a BRAF inhibitor to confound attribution.
  - reference: PMID:41864169
    reference_title: 'Cardiotoxicity of trametinib monotherapy in adults with
      neurofibromatosis type 1: Results from the TRAIN study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Median onset time was 5 months (range 1-12 months).
    explanation: Timing of onset on monotherapy, slower than the four-week
      pattern reported for combination therapy.
  - reference: PMID:35233653
    reference_title: 'Cardiac Function in Children and Young Adults Treated with
      MEK Inhibitors: A Retrospective Cohort Study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: EF abnormalities typically fluctuated during therapy, resolved off
      therapy, and recurred with MEKi re-initiation.
    explanation: The withdrawal-and-rechallenge pattern, which is the strongest
      clinical evidence that the deficit tracks exposure.
  - reference: PMID:41065626
    reference_title: Prospective Evaluation of the Cardiovascular Effects of BRAF
      and MEK Inhibitors in Patients With Melanoma.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: All moderate or severe CTRCD was evident by 4 weeks and at least
      partially reversible.
    explanation: Onset timing and reversibility in the prospective combination
      therapy cohort.
  sequelae:
  - target: Congestive heart failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Symptomatic heart failure is the uncommon severe end of the spectrum.
      Several cohorts recorded none at all, so this is a possible rather than an
      expected course.
    evidence:
    - reference: PMID:28861837
      reference_title: 'Cardiovascular Effects of the MEK Inhibitor, Trametinib:
        A Case Report, Literature Review, and Consideration of Mechanism.'
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: Two months after initiating trametinib, he developed dyspnea and
        fatigue.
      explanation: The index case progressing from an asymptomatic ejection
        fraction fall to symptomatic heart failure.
- category: Cardiovascular
  name: Congestive heart failure
  description: >-
    Symptomatic heart failure is the uncommon severe presentation. It is
    described in case reports and accounts for a small minority of graded events
    in cohorts; two cohorts reported no symptomatic heart failure at all, and in
    the trametinib monotherapy trial every case was asymptomatic. Recovery after
    drug discontinuation is the rule even in the severe cases.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:41864169
    reference_title: 'Cardiotoxicity of trametinib monotherapy in adults with
      neurofibromatosis type 1: Results from the TRAIN study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: One severe case required permanent discontinuation, after which LVEF
      recovered.
    explanation: The severe end of the spectrum and its recovery on
      discontinuation.
  - reference: PMID:35233653
    reference_title: 'Cardiac Function in Children and Young Adults Treated with
      MEK Inhibitors: A Retrospective Cohort Study.'
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Symptomatic heart failure did not occur.
    explanation: Refutes symptomatic heart failure as an expected feature in this
      paediatric and young-adult cohort, which is why the phenotype is recorded
      as the uncommon severe end rather than a typical course.
- category: Cardiovascular
  name: Arterial hypertension
  description: >-
    New or worsened arterial hypertension is about as common as the contractile
    deficit, and is a distinct adverse effect rather than a cause of the
    cardiomyopathy: in the prospective cohort that measured both, there was no
    robust association between hypertension and incident cardiac dysfunction.
  notes: >-
    Deliberately has no causal inlink and renders as an island beside the
    pathograph. That is not a missing edge: this is a parallel effect of the
    same drug with no modelled route to the contractile deficit, and the cohort
    that measured both found no association between the two. Do not wire it to
    the mechanism nodes to make the graph look connected.
  phenotype_term:
    preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  evidence:
  - reference: PMID:31397860
    reference_title: 'Cardiovascular Adverse Events Associated With BRAF and MEK
      Inhibitors: A Systematic Review and Meta-analysis.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: and arterial hypertension (RR, 1.49; 95% CI, 1.12-1.97; P = .005)
      compared with BRAF inhibitor monotherapy
    explanation: Quantifies the excess hypertension risk attributable to adding a
      MEK inhibitor.
  - reference: PMID:41065626
    reference_title: Prospective Evaluation of the Cardiovascular Effects of BRAF
      and MEK Inhibitors in Patients With Melanoma.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: There were no robust associations between hypertension nor
      cardiovascular magnetic resonance imaging-derived myocardial or perfusion
      characteristics and incident CTRCD.
    explanation: Establishes hypertension as a parallel adverse effect rather
      than the route to the cardiac dysfunction.
- category: Cardiovascular
  name: Pulmonary embolism
  description: >-
    Pulmonary embolism risk is increased in combination BRAF-MEK regimens
    relative to BRAF inhibitor monotherapy, and the excess was associated with
    longer follow-up. The high-grade risk was not separately raised. This is a
    vascular rather than myocardial effect and is recorded here because it comes
    from the same cardiovascular safety analyses that inform monitoring.
  notes: >-
    Deliberately has no causal inlink, for the same reason as the hypertension
    phenotype: it is a parallel vascular effect of the drug with no modelled
    route to the myocardial lesion this entry curates. Its time course differs
    too - the pulmonary embolism signal rises with longer follow-up, whereas the
    contractile deficit appears early.
  phenotype_term:

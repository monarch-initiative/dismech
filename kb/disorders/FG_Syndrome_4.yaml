discussions:
- discussion_id: fgs4_nosological_boundary
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    FGS4 is defined jointly by a molecular criterion (a hypomorphic CASK variant) and
    membership in the historical, genetically heterogeneous "FG syndrome" clinical
    label. With only two reported FGS4-causing CASK variants and a broad, overlapping
    CASK phenotypic continuum, is "FG syndrome 4" a discrete clinical entity or simply
    the mild, syndromic end of the CASK spectrum labelled with a legacy FGS name?
  attaches_to:
  - pathophysiology#CASK Hypomorphic Altered-Function Variant
  rationale: >-
    Only two families define FGS4 in the literature (Piluso 2009; Dunn 2017), and both
    reports frame the phenotype as one end of a CASK continuum rather than a separable
    entity. GeneReviews collapses the FGS4 presentation into "XLID with or without
    nystagmus" caused by hypomorphic CASK variants. The nosological status therefore
    remains open: FGS4 may be better modeled as a labelled region of the CASK spectrum
    than as an independent disorder, which affects how phenotype frequencies and
    boundaries should be curated as more cases accrue.
  proposed_experiments:
  - experiment_id: fgs4_cask_genotype_phenotype_cohort
    name: CASK genotype-phenotype cohort delineating the FGS4 region of the spectrum
    description: >-
      Assemble a cohort of hemizygous males with hypomorphic CASK variants and
      systematically phenotype them for the FGS-associated features (intellectual
      disability, nystagmus/ocular anomalies, gastrointestinal hypomotility, feeding
      difficulties) alongside quantitative CASK protein levels, to test whether an
      "FGS4" cluster is distinguishable from the broader hypomorphic CASK phenotype.
    decision_criterion: >-
      A statistically distinct clustering of features and protein levels would support
      FGS4 as a discrete entity; a smooth continuum would support modeling it as a
      labelled region of the CASK spectrum.
  evidence:
  - reference: PMID:25886057
    reference_title: "Phenotypic and molecular insights into CASK-related disorders in males."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      three phenotypic groups can be distinguished that represent a clinical continuum
    explanation: >-
      Frames the CASK-related phenotypes in males as a continuum, which is the basis
      for questioning whether FGS4 is a discrete entity or a region of that continuum.
notes: >-
  FGS4 is one of five historically defined X-linked FG syndrome loci (FGS1-5). Among
  these, only MED12 (FGS1), FLNA (FGS2), and CASK (FGS4) have identified causative
  genes; the FGS3 and FGS5 loci remain gene-unidentified. UPF3B and BRWD3 are additional
  X-linked intellectual disability genes that have been implicated in families
  historically labelled with FG-like phenotypes, but they are not assigned standard
  FGS locus numbers in the FGS1-5 series. This entry is scoped strictly to the CASK-defined
  molecular entity MONDO:0010318 and should not be conflated with the historical,
  genetically heterogeneous clinical "FG syndrome" umbrella (MONDO:0002010). Because
  only two FGS4-causing CASK variants have been reported, phenotype frequencies are
  deliberately omitted rather than estimated from n=2. Seizures/epileptic encephalopathy
  are likewise deliberately not curated as FGS4 phenotypes: in the Moog (2015) males
  series they mark the severe hemizygous loss-of-function MICPCH end of the CASK spectrum
  (modeled here only as the MICPCH differential), not the hypomorphic FGS4 region, which
  is characterized by mild-to-severe ID with or without nystagmus.

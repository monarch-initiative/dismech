pathophysiology:
- name: CASK Missense Altered Function
  description: >-
    A hemizygous missense variant in CASK produces a partial-function
    (hypomorphic) rather than complete loss-of-function defect, consistent with
    the comparatively mild FGS4 phenotype relative to CASK-null MICPCH. CASK is
    a MAGUK scaffolding protein with an N-terminal CaMK domain, PDZ, SH3, and
    guanylate kinase domains.
  biological_scale: MOLECULAR
- name: Impaired Synaptic Scaffolding
  description: >-
    CASK organizes presynaptic and postsynaptic protein complexes, interacting
    with neurexins, Mint1/APBA1, and Veli/LIN7. Reduced CASK function perturbs
    assembly of these tripartite complexes and synaptic protein trafficking.
  biological_scale: CELLULAR
- name: Impaired CASK-TBR1 Transcriptional Coactivation
  description: >-
    In the nucleus CASK complexes with the T-box transcription factor TBR1 and
    the nucleosome-assembly protein CINAP to regulate expression of
    TBR1-target genes including RELN (reelin), influencing cortical neuronal
    migration and differentiation.
  biological_scale: MOLECULAR
- name: Abnormal Corticogenesis and Neurodevelopment
  description: >-
    Disrupted synaptic scaffolding and TBR1-dependent transcription impair
    cortical neuronal migration, differentiation, and connectivity, producing
    intellectual disability and structural brain anomalies such as corpus
    callosum hypoplasia.
  biological_scale: TISSUE

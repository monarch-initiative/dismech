    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we observed a partial skipping of the exon 2 of CASK, presumably a consequence of
      improper recognition of exonic splicing enhancers (ESEs) induced by the c.83G-->T
      transversion.
    explanation: >-
      Describes the c.83G>T (p.Arg28Leu) variant and its hypomorphic altered-splicing
      mechanism.
- name: CASK c.2521-2A>G (exon 26 skipping)
  description: >-
    The second reported FGS4 variant: a de novo carboxyl-terminus splice-site change
    (c.2521-2A>G) causing skipping of exon 26 and a cryptic-splice-site 9-bp deletion,
    yielding in-frame deletions (p.Ala841_Lys843del and p.Ala841_Glu868del) and an
    aberrant guanylate kinase domain in the predominant mutant transcripts.

      term:
        id: HP:0001419
        label: X-linked recessive inheritance
  evidence:
  - reference: PMID:19200522
    reference_title: "A missense mutation in CASK causes FG syndrome in an Italian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here that a p.R28L (c.83G-->T) missense mutation in CASK causes FGS
      phenotype in an Italian family previously mapped to Xp11.4-p11.3 (FGS4).
    explanation: >-
      Establishes CASK as the causative gene for FGS4 and localizes it to Xp11.4.
  - reference: PMID:28139025
    reference_title: "A de novo splice site mutation in CASK causes FG syndrome-4 and congenital nystagmus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the second CASK mutation known to us as cause of FGS4.
    explanation: >-
      Confirms a second, independent CASK variant causing FGS4, supporting CASK as the
      FGS4 gene.
variants:
- name: CASK p.Arg28Leu (c.83G>T)
  description: >-
    The first reported FGS4 variant: a familial missense change (c.83G>T, p.Arg28Leu)
    that cosegregates with the phenotype in an Italian family mapped to Xp11.4.
    Functionally it acts as a hypomorph by causing partial skipping of CASK exon 2
    through disrupted recognition of an exonic splicing enhancer, rather than by
    altering protein structure per se.

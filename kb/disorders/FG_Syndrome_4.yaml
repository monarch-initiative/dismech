    causal_link_type: DIRECT
    description: >-
      Perturbed CASK scaffolding of presynaptic signaling complexes impairs synapse
      formation and neurotransmission during brain development and differentiation.
  - target: Impaired CASK-FRMD7 Ocular-Motor Scaffolding
    causal_link_type: DIRECT
    description: >-
      Damage to the CASK guanylate kinase domain degrades its interaction with FRMD7,

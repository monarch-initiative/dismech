prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence or incidence has been established for FGS4 specifically.
    The molecular entity is known from only two published families/variants (Piluso
    et al. 2009, PMID:19200522; Dunn et al. 2017, PMID:28139025), so occurrence is
    recorded as not-yet-documented rather than estimated. Any broader CASK-disorder
    frequency figures pertain to the loss-of-function MICPCH end of the spectrum and
    must not be assigned to FGS4 (see notes and the fgs4_nosological_boundary
    discussion).
differential_diagnoses:
- name: CASK-related microcephaly with pontine and cerebellar hypoplasia (MICPCH)
  description: >-
    The severe end of the CASK allelic spectrum, caused by hemizygous CASK
    loss-of-function variants, presenting with progressive microcephaly, pontine and
    cerebellar hypoplasia, and severe intellectual disability, and in males frequently
    with epileptic encephalopathy. It is distinguished from FGS4 by its severity and by
    loss (rather than retention) of CASK protein.
  distinguishing_features:
  - Loss-of-function CASK variant with no detectable CASK protein, versus retained
    protein in hypomorphic FGS4 variants
  - Progressive microcephaly with pontine and cerebellar hypoplasia
  - Severe-to-profound intellectual disability and, in males, epileptic encephalopathy
  evidence:
  - reference: PMID:25886057
    reference_title: "Phenotypic and molecular insights into CASK-related disorders in males."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MICPCH with severe epileptic encephalopathy caused by hemizygous
      loss-of-function mutations
    explanation: >-
      In this males-focused CASK cohort, hemizygous loss-of-function variants define
      the severe MICPCH-with-epileptic-encephalopathy end of the spectrum, contrasting
      with the hypomorphic FGS4 end.
  - reference: PMID:25886057
    reference_title: "Phenotypic and molecular insights into CASK-related disorders in males."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In fibroblasts from patients with a CASK loss-of-function mutation, no CASK
      protein could be detected
    explanation: >-
      Supports the loss (rather than retention) of CASK protein that distinguishes
      MICPCH loss-of-function variants from hypomorphic FGS4 variants. Immunoblot of
      cultured patient-derived fibroblasts (an ex vivo cellular assay), hence IN_VITRO.
  - reference: PMID:25886057
    reference_title: "Phenotypic and molecular insights into CASK-related disorders in males."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Individuals who are mosaic for a severe CASK mutation or carry a hypomorphic
      mutation still showed detectable amount of protein
    explanation: >-
      Backs the FGS4 side of the retained-versus-absent-protein distinction: hypomorphic
      variants leave detectable CASK protein, unlike loss-of-function MICPCH.
- name: FG syndrome 1 (Opitz-Kaveggia syndrome, MED12)
  description: >-
    The prototypical, molecularly defined FG syndrome caused by the recurrent MED12
    p.Arg961Trp variant at Xq13. It shares the historical "FG syndrome" clinical label
    and X-linked intellectual disability but is a distinct gene and locus; the older
    clinical "FG syndrome" umbrella is genetically heterogeneous across FGS1-5.
  distinguishing_features:
  - Caused by MED12 (Xq13), not CASK (Xp11.4)
  - Distinctive Opitz-Kaveggia facial gestalt with relative macrocephaly, anal
    anomalies, and broad thumbs/halluces
  evidence:
  - reference: PMID:19200522
    reference_title: "A missense mutation in CASK causes FG syndrome in an Italian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five loci (FGS1-5) have so far been linked to this phenotype on the X chromosome,
      but only one gene, MED12, has been identified to date.
    explanation: >-
      Establishes that FG syndrome is genetically heterogeneous across five X-linked
      loci and distinguishes the MED12 (FGS1) entity from the CASK (FGS4) entity.

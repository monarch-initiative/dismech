name: FG Syndrome 4
creation_date: "2026-08-05T00:00:00Z"
category: Mendelian
description: >-
  FG syndrome 4 (FGS4) is a rare X-linked recessive multiple congenital
  anomaly-intellectual disability syndrome caused by a hemizygous missense
  variant in CASK (Xp11.4). It is one of the loci of the genetically
  heterogeneous FG syndrome spectrum and was defined molecularly in a single
  large Italian family in which affected males show intellectual disability,
  congenital hypotonia, relative macrocephaly, a characteristic facial gestalt,
  partial agenesis of the corpus callosum, chronic constipation, and broad
  thumbs and halluces. CASK encodes a calcium/calmodulin-dependent serine
  protein kinase of the membrane-associated guanylate kinase (MAGUK) family
  that acts as a synaptic scaffolding protein and, in the nucleus, as a
  transcriptional coactivator with the T-box transcription factor TBR1.
  Allelic CASK loss-of-function variants cause the more severe microcephaly
  with pontine and cerebellar hypoplasia (MICPCH) and X-linked intellectual
  disability with nystagmus.

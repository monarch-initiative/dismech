genetic:
- name: CASK
  notes: >-
    CASK (Xp11.4) encodes a calcium/calmodulin-dependent serine protein kinase of the
    MAGUK scaffold family. FGS4 is caused by hypomorphic CASK variants at the mild end
    of the allelic spectrum; only two have been reported: the familial missense
    p.R28L (c.83G>T), which causes partial skipping of exon 2, and the de novo
    splice-site variant c.2521-2A>G, which causes skipping of exon 26 and an aberrant
    guanylate kinase domain. Loss-of-function CASK variants instead cause MICPCH and
    should not be labelled FGS4.
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: CASK
    term:
      id: hgnc:1497
      label: CASK
  inheritance:

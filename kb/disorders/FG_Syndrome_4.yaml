pathophysiology:
- name: CASK Hypomorphic Altered-Function Variant
  biological_scale: MOLECULAR
  description: >-
    FGS4 is caused by CASK variants that lie at the mild, hypomorphic end of the CASK
    allelic spectrum. Rather than abolishing CASK, these missense and splice variants
    leave CASK protein detectable while reducing its amount or altering its function.
    This distinguishes FGS4 from the hemizygous loss-of-function CASK variants that
    cause the far more severe MICPCH phenotype with severe intellectual disability and,
    in males, epileptic encephalopathy. The first reported FGS4 variant, p.R28L
    (c.83G>T), causes partial skipping of CASK exon 2 through disrupted recognition of
    an exonic splicing enhancer; the second, the de novo splice-site variant
    c.2521-2A>G, causes skipping of exon 26 and yields an aberrant guanylate kinase
    domain.
  mechanism_confidence: ESTABLISHED
  gene:
    preferred_term: CASK
    term:
      id: hgnc:1497
      label: CASK
  molecular_functions:
  - preferred_term: protein serine/threonine kinase activity
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
  evidence:
  - reference: PMID:19200522
    reference_title: "A missense mutation in CASK causes FG syndrome in an Italian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here that a p.R28L (c.83G-->T) missense mutation in CASK causes FGS
      phenotype in an Italian family previously mapped to Xp11.4-p11.3 (FGS4).
    explanation: >-
      Identifies the first causative CASK variant for FGS4 and localizes it to the
      FGS4 locus at Xp11.4.
  - reference: PMID:19200522
    reference_title: "A missense mutation in CASK causes FG syndrome in an Italian family."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we observed a partial skipping of the exon 2 of CASK, presumably a consequence of
      improper recognition of exonic splicing enhancers (ESEs) induced by the c.83G-->T
      transversion.
    explanation: >-
      Establishes the altered-splicing / hypomorphic molecular consequence of the FGS4
      p.R28L variant rather than a simple missense change.
  - reference: PMID:25886057
    reference_title: "Phenotypic and molecular insights into CASK-related disorders in males."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      syndromic/nonsyndromic mild to severe ID with or without nystagmus caused by CASK
      missense and splice mutations that leave the CASK protein intact but likely alter
      its function or reduce the amount of normal protein
    explanation: >-
      Places FGS4 within the mildest of three CASK phenotypic groups in males, defined
      by hypomorphic missense/splice variants that retain CASK protein.
  - reference: PMID:25886057
    reference_title: "Phenotypic and molecular insights into CASK-related disorders in males."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Individuals who are mosaic for a severe CASK mutation or carry a hypomorphic
      mutation still showed detectable amount of protein.
    explanation: >-
      Confirms that hypomorphic CASK variants (the FGS4 class) retain detectable CASK
      protein, in contrast to the loss-of-function variants causing MICPCH.
  downstream:
  - target: Disrupted CASK Synaptic Scaffolding Complex
    causal_link_type: DIRECT
    description: >-
      Reduced or altered CASK protein impairs assembly of the CASK-organized presynaptic
      scaffolding complexes, particularly where the variant damages a protein-interaction
      domain such as the guanylate kinase domain.
- name: Disrupted CASK Synaptic Scaffolding Complex
  biological_scale: MOLECULAR
  description: >-
    CASK is a multidomain MAGUK (membrane-associated guanylate kinase) scaffolding
    protein highly expressed in the central nervous system and localized to synapses. It
    forms competing tripartite CASK/Mint1/Velis and CASK/Caskin1/Velis complexes that
    physically associate with the cytoplasmic tail of neurexin at presynaptic sites,
    assembling large signaling complexes that regulate neurotransmission. FGS4 variants
    reduce or alter CASK so that these scaffolding interactions are perturbed; the
    exon-26-skipping variant specifically yields an aberrant guanylate kinase domain
    predicted to degrade CASK binding to neuronal and ocular development partners.
  mechanism_confidence: ESTABLISHED

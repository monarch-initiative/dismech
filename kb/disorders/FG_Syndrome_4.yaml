- name: Impaired Neurodevelopment and Synaptic Function
  biological_scale: CELLULAR
  description: >-
    CASK is a conserved scaffolding protein involved in brain development, synapse
    formation, and establishment of cell polarity. FGS4 variants alter the CASK
    expression profile during embryogenesis, brain development, and differentiation,
    impairing synaptic assembly and neurotransmission and producing the
    neurodevelopmental phenotype (developmental delay, intellectual disability, and
    associated behavioral and neurological features).

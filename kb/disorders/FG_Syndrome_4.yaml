name: FG Syndrome 4
creation_date: "2026-08-05T00:00:00Z"
category: Mendelian
description: >-
  FG syndrome 4 (FGS4) is a rare X-linked intellectual disability / multiple congenital
  anomaly disorder caused by hypomorphic, altered-function variants in CASK
  (calcium/calmodulin-dependent serine protein kinase) at Xp11.4. It is the mildest end
  of the CASK allelic spectrum in males: whereas hemizygous loss-of-function CASK
  variants cause severe microcephaly with pontine and cerebellar hypoplasia (MICPCH),
  the missense and splice variants underlying FGS4 leave CASK protein detectable but
  reduce its amount or alter its function. Affected hemizygous males present with
  developmental delay and mild-to-severe intellectual disability, with or without
  congenital nystagmus and other ocular features, together with feeding difficulties and
  gastrointestinal hypomotility, in the historical clinical tradition of "FG syndrome"
  (an X-linked multiple congenital anomaly / intellectual disability phenotype first
  described in 1974 and later shown to be genetically heterogeneous across five X-linked
  loci, FGS1-5). CASK is a multidomain MAGUK scaffolding protein highly expressed in the
  central nervous system that organizes presynaptic signaling complexes on the
  cytoplasmic tail of neurexin; FGS4 variants perturb this scaffolding role during brain
  development and differentiation. Only two FGS4-causing CASK variants have been reported
  to date.

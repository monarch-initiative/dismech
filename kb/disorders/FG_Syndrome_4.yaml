diagnosis:
- name: CASK molecular genetic testing
  description: >-
    Diagnosis of FGS4 requires a compatible X-linked intellectual disability phenotype
    (with or without nystagmus) plus identification of a hemizygous hypomorphic CASK
    pathogenic variant in a male. Because the CASK phenotypic spectrum is broad and
    overlaps other X-linked intellectual disability disorders, testing is typically via
    a multigene intellectual disability panel containing CASK or exome/genome
    sequencing.
  evidence:
  - reference: PMID:24278995

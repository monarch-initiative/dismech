  evidence:
  - reference: PMID:19200522
    reference_title: "A missense mutation in CASK causes FG syndrome in an Italian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CASK is a multidomain scaffold protein highly expressed in the central nervous
      system (CNS) with specific localization to the synapses, where it forms large
      signaling complexes regulating neurotransmission.
    explanation: >-
      Describes the synaptic scaffolding role of CASK whose disruption underlies the
      FGS4 neurodevelopmental phenotype.
  - reference: PMID:21763699
    reference_title: "The molecular basis of the Caskin1 and Mint1 interaction with CASK."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CASK forms competing CASK/Mint1/Velis and CASK/Caskin1/Velis tripartite complexes
      that physically associate with the cytoplasmic tail of neurexin, a transmembrane
      protein enriched at presynaptic sites.
    explanation: >-
      Defines the specific tripartite CASK scaffolding complexes at the presynaptic
      neurexin tail that the FGS4 variants perturb.
  - reference: PMID:28139025
    reference_title: "A de novo splice site mutation in CASK causes FG syndrome-4 and congenital nystagmus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The predominant mutant transcripts contain an aberrant guanylate kinase domain
      and thus are predicted to degrade CASK's ability to interact with important
      neuronal and ocular development proteins, including FRMD7.
    explanation: >-
      Links the FGS4 exon-26-skipping variant to a damaged CASK protein-interaction
      (guanylate kinase) domain, impairing scaffolding of neuronal and ocular partners.
  - reference: PMID:33090494
    reference_title: "Missense mutations in CASK, coding for the calcium-/calmodulin-dependent serine protein kinase, interfere with neurexin binding and neurexin-induced oligomerization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A total of five mutations in GK as well as PSD-95/discs large/ZO-1 (PDZ) domains
      affect binding of CASK to the pre-synaptic cell adhesion molecule Neurexin.
    explanation: >-
      Provides direct experimental evidence that CASK guanylate-kinase-domain mutations
      (the domain disrupted by the FGS4 exon-26-skipping variant) impair binding to the
      presynaptic scaffolding partner neurexin.
  downstream:

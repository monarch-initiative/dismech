definitions:
  - name: Molecular diagnosis of IRF2BPL-related disorder
    definition_type: DIAGNOSTIC_CRITERIA
    derivation_basis: ESTABLISHED_CRITERIA
    description: >-
      Diagnosis rests on characteristic clinical findings together with a
      heterozygous pathogenic IRF2BPL variant on molecular genetic testing. There
      is no biochemical or imaging finding specific enough to stand in for the
      genetic result.
    evidence:
      - reference: PMID:39571061
        reference_title: "IRF2BPL-Related Disorder."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The diagnosis of IRF2BPL-related disorder is established in a proband
          with characteristic clinical findings and a heterozygous pathogenic
          variant in IRF2BPL identified by molecular genetic testing.
        explanation: >-
          States the diagnostic requirement directly.
discussions:
  - discussion_id: irf2bpl_lof_models_vs_dominant_negative
    kind: HUMAN_MODEL_MISMATCH
    status: OPEN
    prompt: >-
      Every in vivo model of this disorder is a loss-of-function model, but the
      human mechanism is dominant-negative sequestration by an expressed
      truncated protein. Do the fly and zebrafish results actually speak to the
      human lesion?
    attaches_to:
      - pathophysiology#Cytoplasmic Sequestration of Wild-Type IRF2BPL
      - pathophysiology#Excess Wnt Signaling
    rationale: >-
      The Wnt arm of this pathograph rests almost entirely on pits knockdown in
      Drosophila and irf2bpl loss in zebrafish - both of which remove gene
      function. The human variants do something different: because IRF2BPL is
      intronless, the mutant transcript escapes NMD, and the resulting truncated
      protein actively drags wild-type IRF2BPL into cytoplasmic aggregates. A
      pure loss-of-function model reproduces the *consequence* of nuclear IRF2BPL
      being absent, but not the sequestration that produces it, and so cannot
      report on whether aggregate toxicity contributes independently of lost
      transcriptional repression.

      Two observations narrow the gap without closing it. Flies co-expressing
      full-length and truncated IRF2BPL do show cytoplasmic accumulation of the
      full-length protein, and heterozygous Pits-truncation flies show a
      progressive motor phenotype - so the allele class has been modelled, even
      if the Wnt measurements were not made in it. WNT1 is also raised in
      patient-derived astrocytes, which is human material carrying the real
      allele.

      What is missing is the Wnt measurement in a system that has both: the human
      truncating allele and an intact nervous system.
    proposed_experiments:
      - experiment_id: exp_irf2bpl_knockin_wnt_readout
        name: Wnt pathway readout in a knock-in truncating allele model
        description: >-
          Measure Wnt ligand and downstream signalling in a vertebrate model
          carrying a heterozygous knock-in of a human IRF2BPL truncating variant,
          rather than a null, and test whether Wnt inhibition is neuroprotective
          in that background.
        would_support:
          - pathophysiology#Excess Wnt Signaling
        supporting_outcome:
        - >-
          Wnt ligand and downstream signalling are elevated in the knock-in
          heterozygote to a degree comparable with the null, and Wnt inhibition
          slows the progressive phenotype.
        would_refute:
          - pathophysiology#Excess Wnt Signaling
        refuting_outcome:
        - >-
          Wnt signalling is unchanged in the knock-in heterozygote despite
          cytoplasmic sequestration and progressive degeneration, which would
          make the Wnt arm an artifact of complete gene loss and point to
          aggregate toxicity as the operative mechanism.
  - discussion_id: irf2bpl_polyq_inclusion_causality
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Do the polyglutamine inclusions seen at autopsy contribute to
      neurodegeneration in NEDAMSS, or are they a downstream marker?
    attaches_to:
      - pathophysiology#Intracellular Protein Aggregate Formation
    rationale: >-
      The single detailed neuropathological study of this disorder found polyQ
      inclusions and a picture consistent with DRPLA, in a patient with no repeat
      expansion and a variant lying distal to IRF2BPL's own polyQ tract. The
      authors raise, but explicitly do not establish, the possibility that the
      unexpanded polyQ tract participates in inclusion formation - which they
      note would be a novel mechanism for polyQ repeats.

      This rests on one autopsy. Whether inclusions are present across NEDAMSS
      generally, whether they precede or follow neuronal loss, and whether they
      are toxic or protective are all open. The node is curated because the
      observation is real and mechanistically striking, not because the causal
      role is settled.
    proposed_experiments:
      - experiment_id: exp_irf2bpl_systematic_neuropathology
        name: Systematic neuropathology across NEDAMSS variant classes
        description: >-
          Examine additional NEDAMSS brains, spanning proximal and distal
          truncating variants and missense alleles, for polyQ inclusions and
          their regional distribution relative to neuronal loss.
        would_support:
          - pathophysiology#Intracellular Protein Aggregate Formation
        supporting_outcome:
        - >-
          PolyQ inclusions are found consistently across cases and their regional
          distribution matches the pattern of neuronal loss.
        would_refute:
          - pathophysiology#Intracellular Protein Aggregate Formation
        refuting_outcome:
        - >-
          Inclusions are absent in other cases with comparable degeneration, or
          are confined to regions without neuronal loss, indicating they are
          incidental rather than on the causal path.
  - discussion_id: irf2bpl_onset_age_range
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      What determines the extraordinary range of onset age, from the first year
      of life to the sixth decade?
    attaches_to:
      - pathophysiology#Loss of Previously Acquired Developmental Milestones
    rationale: >-
      Onset spans five decades, and the systematic review found no significant
      correlation between the number of affected clinical domains and either age
      at onset or variant type. A separate series found protein-truncating
      variants clustered around the coiled-coil domain in three adults presenting
      as progressive myoclonus epilepsy, hinting at a positional effect, but the
      correlational analysis does not support variant type as the explanation.
      Modifiers, mosaicism and the degree of NMD escape are all untested
      candidates, and none can be assigned from the published data.
    proposed_experiments:
      - experiment_id: exp_irf2bpl_genotype_onset_cohort
        name: Genotype-onset correlation in an adequately powered cohort
        description: >-
          Assemble a cohort large enough to test variant position, predicted
          escape of nonsense-mediated decay, and measured residual full-length
          IRF2BPL protein against age at onset and rate of regression.
        would_support:
          - pathophysiology#Nonsense-Mediated Decay Escape and Truncated Protein Expression
        supporting_outcome:
        - >-
          Residual full-length nuclear IRF2BPL protein predicts age at onset,
          making the degree of sequestration the dose variable that sets timing.
        would_refute:
          - pathophysiology#Nonsense-Mediated Decay Escape and Truncated Protein Expression
        refuting_outcome:
        - >-
          Onset age is unrelated to residual protein or variant position across
          an adequately powered cohort, pointing to modifiers outside the locus.

        reference_title: "De novo truncating variants in the intronless IRF2BPL are responsible for developmental epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          dysarthria (2/11 cases), and nystagmus (2/11 cases). Other
          abnormalities included hypotonia (5/11 cases)
        explanation: >-
          The published denominator behind the OCCASIONAL band: 2/11 is 18%.
  - name: Mild dysmorphic features
    category: Other
    frequency: OCCASIONAL
    description: >-
      Non-neurological findings were uncommon, but 5 of 28 reviewed patients
      (17.9%) had mild dysmorphic features - facial weakness, a wider
      inter-nipple distance, joint laxity. Left without an ontology binding on
      purpose: the reported findings span the face, the chest wall and the
      joints, so no single HP term covers what the source counted, and the
      obvious candidates (facial dysmorphism terms) would assert a facial-only
      finding the source does not.
    phenotype_term:
      preferred_term: Mild dysmorphic features
    evidence:
      - reference: PMID:35525099
        reference_title: "Neurological phenomenology of the IRF2BPL mutation syndrome: Analysis of a new case and systematic review of the literature."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          included mild dysmorphic features (facial weakness, wider inter-nipple
          distance, joint laxity, etc.) in 5/28 patients (17.9%)
        explanation: >-
          Both the finding and its denominator, and the enumeration that
          explains why no single HP term is bound.
  - name: Delayed puberty
    category: Endocrine
    description: >-
      Pubertal delay is tracked and treated in this disorder, which is notable
      because IRF2BPL is EAP1 - enhanced at puberty protein 1 - a
      hypothalamic transcriptional regulator of the onset of puberty. No
      denominator is published, so no frequency band is recorded; what is
      published is that GeneReviews directs assessment of pubertal development
      at every visit through adolescence and endocrine treatment when it is
      delayed.
    phenotype_term:
      preferred_term: Delayed puberty
      term:
        id: HP:0000823
        label: Delayed puberty
    evidence:
      - reference: PMID:39571061
        reference_title: "IRF2BPL-Related Disorder."
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          assessment of pubertal development at each visit through adolescence
        explanation: >-
          A surveillance recommendation rather than a reported frequency, so
          the inference is one step removed: puberty is monitored at every visit
          because pubertal delay occurs in this disorder often enough to look
          for.
      - reference: PMID:39571061
        reference_title: "IRF2BPL-Related Disorder."
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          treatment of pubertal delay per endocrinologist
        explanation: >-
          Pubertal delay is a manifestation the disorder's own management
          guidance expects to have to treat.
prevalence:
  - population: Cases reported in the literature to 2022
    measure_type: CASES_IN_LITERATURE
    prevalence_class: NOT_YET_DOCUMENTED
    notes: >-
      A published case count, not a population rate. No study has estimated how
      common NEDAMSS is, so the class is NOT_YET_DOCUMENTED rather than a band
      back-derived from the count - the reported total measures how many people
      have been described, which is bounded by ascertainment through exome
      sequencing, not by how many people have the disorder.
    evidence:
      - reference: PMID:35525099
        reference_title: "Neurological phenomenology of the IRF2BPL mutation syndrome: Analysis of a new case and systematic review of the literature."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We reported on 28 patients carrying the IRF2BPL mutation who were
          identified in 10 papers
        explanation: >-
          The literature case count assembled by the systematic review.
  - population: Cases reported in the literature to 2023
    measure_type: CASES_IN_LITERATURE
    prevalence_class: NOT_YET_DOCUMENTED
    notes: >-
      A later count from a different group, on a slightly wider inclusion, and
      the reason the 2022 figure is not treated as the total.
    evidence:
      - reference: PMID:37114479
        reference_title: "IRF2BPL as a novel causative gene for progressive myoclonus epilepsy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          review the features of the 31 subjects with IRF2BPL-related disorders
          previously reported
        explanation: >-
          The count of previously reported subjects at the time of the 2023
          series.
progression:
  - phase: Initial acquisition of milestones
    notes: >-
      Early psychomotor development is mostly normal, or delayed but
      progressing, before anything is lost. This phase is what makes the
      disorder regressive rather than a static encephalopathy, and it is why the
      pathograph terminates in "Loss of Previously Acquired Developmental
      Milestones" rather than in a failure to acquire them.
    evidence:
      - reference: PMID:30166628
        reference_title: "De novo truncating variants in the intronless IRF2BPL are responsible for developmental epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          mostly normal initial psychomotor development followed by severe
          global neurological regression and epilepsy with nonspecific
          electroencephalogram (EEG) abnormalities and variable central nervous
          system (CNS) anomalies
        explanation: >-
          States the acquire-then-lose sequence, with the normal phase first.
  - phase: Regression
    age_range: First year of life to the sixth decade; most reported onsets before age 10
    notes: >-
      Onset of regression is spread across the whole of life rather than
      concentrated in infancy. In the 28-patient review, onset was at one year
      or less in 6 patients, 1-3 years in 5, 4-5 years in 9, 6-10 years in 3,
      and 10-23 years in 5; GeneReviews puts the full span from the first year
      to the sixth decade. Severity does not track onset age - the review found
      no correlation between the two - which is the observation the
      `irf2bpl_onset_age_range` discussion is about.
    evidence:
      - reference: PMID:35525099
        reference_title: "Neurological phenomenology of the IRF2BPL mutation syndrome: Analysis of a new case and systematic review of the literature."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          the available information pointed to a disease onset of one year of
          age or less in 6 cases, between 1 and 3 years of age in 5 cases,
          between 4 and 5 years of age in 9 cases, between 6 and 10 years of age
          in 3 cases, and more 10 to 23 years of age (median, 11) in 5 cases.
        explanation: >-
          The full onset distribution across the reviewed cohort.
      - reference: PMID:39571061
        reference_title: "IRF2BPL-Related Disorder."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Onset is highly variable and can be in the first year of life through
          the sixth decade. In some individuals the course of the disorder is
          progressive or debilitating.
        explanation: >-
          The outer bounds of the onset range, and the qualification that the
          progressive course is not universal.
animal_models:
  - name: Drosophila pits neuronal RNAi knockdown
    species: Drosophila melanogaster
    genotype: RNAi knockdown of pits (Drosophila IRF2BPL ortholog) in neurons
    publication: PMID:30057031
    description: >-
      Partial neuronal depletion of the fly ortholog pits. Complete loss is
      early-lethal, so the partial knockdown is what exposes the maintenance
      requirement.
    modeled_mechanisms:
      - target: Progressive Neuronal and Axonal Loss
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: >-
          Neuronal knockdown produces frank neurodegeneration, demonstrating
          that the gene is required for neuronal maintenance and not only for
          neuronal development.
        limitations: >-
          An invertebrate nervous system, and a knockdown rather than the human
          allele - so it models loss of gene function, not the dominant-negative
          sequestration by a truncated product that the human variants cause.
        evidence:
          - reference: PMID:30057031
            reference_title: "IRF2BPL Is Associated with Neurological Phenotypes."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              partial knockdown with RNA interference in neurons leads to
              neurodegeneration, revealing a requirement for this gene in proper
              neuronal function and maintenance
            explanation: >-
              Supports treating the fly knockdown as informative for the human
              neuronal-maintenance defect.
      - target: Excess Wnt Signaling
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: >-
          Depleting pits raises wingless in the brain, and the resulting axonal
          loss is suppressed by inhibiting Wg - establishing the Wnt step as
          causal rather than correlative.
        limitations: >-
          Wingless is the fly orthologue of a Wnt family that is considerably
          expanded in vertebrates, so which human WNT ligand matters is not
          settled by this model.
        readouts:
          - name: Brain wingless (wg) level
            target: Excess Wnt Signaling
            direction: INCREASED
            interpretation: >-
              Elevated Wnt ligand is the measured consequence of losing the
              IRF2BPL ortholog.
            evidence:
              - reference: PMID:35044823
                reference_title: "Loss of IRF2BPL impairs neuronal maintenance through excess Wnt signaling."
                supports: SUPPORT
                evidence_source: MODEL_ORGANISM
                snippet: >-
                  neuronal depletion of Pits leads to increased wingless (wg)
                  levels in the brain and is associated with axonal loss
                explanation: >-
                  Reports the direction of the wingless measurement in the
                  knockdown brain.
        evidence:
          - reference: PMID:35044823
            reference_title: "Loss of IRF2BPL impairs neuronal maintenance through excess Wnt signaling."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              whereas inhibition of Wg signaling is neuroprotective
            explanation: >-
              The rescue arm, which is what makes the Wnt elevation causal for
              the degeneration rather than a bystander change.
  - name: Drosophila heterozygous Pits truncation with CuATSM rescue
    species: Drosophila melanogaster
    genotype: heterozygous truncation of Pits (Drosophila IRF2BPL ortholog)
    publication: PMID:36476864
    description: >-
      A heterozygous truncation matching the human allele class, with progressive
      motor decline that responds to the copper compound CuATSM.
    modeled_mechanisms:
      - target: Progressive Neuronal and Axonal Loss
        relationship: RESCUES
        fidelity: MODERATE
        description: >-
          Progressive motor defects in heterozygous-truncation flies are
          ameliorated by CuATSM, the same compound that restores mitochondrial
          function and neuronal survival in patient-derived cells.
        limitations: >-
          A behavioural motor readout in an invertebrate, and a pharmacological
          rescue only. No human trial of CuATSM in this disorder exists, which is
          why it is recorded here rather than as a treatment.
        evidence:
          - reference: PMID:36476864
            reference_title: "Mechanisms of IRF2BPL-related disorders and identification of a potential therapeutic strategy."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              flies harboring heterozygous truncations of the IRF2BPL ortholog
              (Pits) display progressive motor defects that are ameliorated by
              CuATSM treatment
            explanation: >-
              Both the progressive phenotype in the matching allele class and
              the pharmacological rescue.
  - name: Zebrafish irf2bpl loss of function
    species: Danio rerio
    genotype: loss of irf2bpl
    publication: PMID:35044823
    description: >-
      A vertebrate test of the Wnt mechanism, showing the same directional change
      in wnt1 as the fly model.
    modeled_mechanisms:
      - target: Excess Wnt Signaling
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: >-
          Loss of irf2bpl causes neurological defects with increased wnt1
          transcription and downstream signalling, reproducing the fly result in
          a vertebrate.
        limitations: >-
          Loss of function rather than the human truncating allele, so like the
          fly knockdown it does not model the dominant-negative sequestration
          step.
        readouts:
          - name: wnt1 transcription
            target: Excess Wnt Signaling
            direction: INCREASED
            interpretation: >-
              Vertebrate confirmation of the direction of the Wnt change.
            evidence:
              - reference: PMID:35044823
                reference_title: "Loss of IRF2BPL impairs neuronal maintenance through excess Wnt signaling."
                supports: SUPPORT
                evidence_source: MODEL_ORGANISM
                snippet: >-
                  Loss of irf2bpl in zebrafish also causes neurological defects
                  with an associated increase in wnt1 transcription and
                  downstream signaling.
                explanation: >-
                  Reports the wnt1 measurement and its direction.
        evidence:
          - reference: PMID:35044823
            reference_title: "Loss of IRF2BPL impairs neuronal maintenance through excess Wnt signaling."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              Loss of irf2bpl in zebrafish also causes neurological defects
            explanation: >-
              Supports treating the zebrafish as informative for the human
              neurological phenotype.
experimental_models:
  - name: Patient fibroblast-derived astrocytes and neurons
    experimental_model_type: PRIMARY_CELL_CULTURE
    description: >-
      Skin fibroblasts from NEDAMSS patients reprogrammed directly to astrocytes
      and neurons. The system that established the sequestration mechanism and
      the glial contribution, in human cells carrying the actual patient alleles.
    modeled_mechanisms:
      - target: Astrocyte Mitochondrial Respiratory Dysfunction
        relationship: RECAPITULATES
        fidelity: HIGH
        description: >-
          Patient astrocytes show structurally aberrant mitochondria and
          respiratory dysfunction, and CuATSM restores mitochondrial function -
          the rescue acts on this step specifically.
        limitations: >-
          Reprogrammed rather than developmentally derived astrocytes, cultured
          without microglia, vasculature or myelin, so the metabolic
          measurements are made outside the tissue context in which the human
          lesion plays out.
        readouts:
          - name: Mitochondrial morphology and respiratory function
            target: Astrocyte Mitochondrial Respiratory Dysfunction
            direction: DECREASED
            interpretation: >-
              The metabolic defect measured in the astrocytes themselves.
            evidence:
              - reference: PMID:36476864
                reference_title: "Mechanisms of IRF2BPL-related disorders and identification of a potential therapeutic strategy."
                supports: SUPPORT
                evidence_source: IN_VITRO
                snippet: >-
                  exhibit aberrant mitochondria and respiratory dysfunction
                explanation: >-
                  Reports the mitochondrial measurement and its direction.
          - name: Mitochondrial function after CuATSM
            target: Astrocyte Mitochondrial Respiratory Dysfunction
            direction: RESTORED
            interpretation: >-
              Pharmacological reversal of the astrocyte metabolic defect. This
              is the readout that places the mitochondrial step on the causal
              path rather than treating it as a marker of sick cells, which is
              why it is attached here rather than to the downstream support
              failure.
            evidence:
              - reference: PMID:36476864
                reference_title: "Mechanisms of IRF2BPL-related disorders and identification of a potential therapeutic strategy."
                supports: SUPPORT
                evidence_source: IN_VITRO
                snippet: >-
                  Treatment with the small molecule copper ATSM (CuATSM) rescues
                  neuronal survival and restores mitochondrial function.
                explanation: >-
                  States the rescue and what was restored. The same sentence
                  also reports the neuronal-survival arm, which is recorded on
                  the trophic-support link below.
        evidence:
          - reference: PMID:36476864
            reference_title: "Mechanisms of IRF2BPL-related disorders and identification of a potential therapeutic strategy."
            supports: SUPPORT
            evidence_source: IN_VITRO
            snippet: >-
              we reprogram patient skin fibroblasts to astrocytes and neurons to
              study mechanisms of this newly described disease
            explanation: >-
              Establishes that the model carries patient alleles in human cells,
              which is why it is treated as high fidelity for this node.
      - target: Loss of Astrocytic Trophic Support for Neurons
        relationship: RECAPITULATES
        fidelity: HIGH
        description: >-
          The coculture in which patient astrocytes were shown to fail to keep
          neurons alive, and in which CuATSM rescued neuronal survival.
        limitations: >-
          A two-cell-type coculture without microglia, vasculature or myelin,
          and reprogrammed rather than developmentally derived - so it cannot
          report on circuit-level or age-dependent aspects of the human course.
        readouts:
          - name: Neuronal survival in astrocyte coculture
            target: Loss of Astrocytic Trophic Support for Neurons
            direction: DECREASED
            interpretation: >-
              The functional consequence of the astrocyte defect, measured on
              the neurons rather than on the astrocytes.
            evidence:
              - reference: PMID:36476864
                reference_title: "Mechanisms of IRF2BPL-related disorders and identification of a potential therapeutic strategy."
                supports: SUPPORT
                evidence_source: IN_VITRO
                snippet: >-
                  patient astrocytes fail to support neuronal survival in
                  coculture
                explanation: >-
                  Reports the survival readout and its direction.
        evidence:
          - reference: PMID:36476864
            reference_title: "Mechanisms of IRF2BPL-related disorders and identification of a potential therapeutic strategy."
            supports: SUPPORT
            evidence_source: IN_VITRO
            snippet: >-
              Moreover, patient astrocytes fail to support neuronal survival in
              coculture and exhibit aberrant mitochondria and respiratory
              dysfunction.
            explanation: >-
              Supports treating this coculture as informative for the glial
              support step: it is the system in which the failure was observed.
      - target: Cytoplasmic Sequestration of Wild-Type IRF2BPL
        relationship: RECAPITULATES
        fidelity: HIGH
        description: >-
          The system in which the mislocalisation and aggregation of wild-type
          IRF2BPL by truncated patient variants was demonstrated.
        limitations: >-
          Localisation and aggregation were assayed in reprogrammed cells; the
          corresponding human brain finding (polyQ inclusions) comes from a
          single autopsy in a different patient.
        evidence:
          - reference: PMID:36476864
            reference_title: "Mechanisms of IRF2BPL-related disorders and identification of a potential therapeutic strategy."
            supports: SUPPORT
            evidence_source: IN_VITRO
            snippet: >-
              truncated patient variants sequester the wild-type protein to the
              cytoplasm and cause aggregation
            explanation: >-
              The observation itself, in patient-derived human cells.
treatments:
  - name: Antiseizure Medication
    description: >-
      Standard management of the epilepsy by an experienced neurologist. No
      IRF2BPL-specific antiseizure regimen is established; the seizure types are
      varied and treatment is chosen accordingly.
    treatment_term:
      preferred_term: anticonvulsant therapy
      term:
        id: NCIT:C64172
        label: Anticonvulsant Therapy
    therapeutic_modality: SMALL_MOLECULE
    target_mechanisms:
      - target: Seizure
        description: >-
          Symptomatic seizure suppression. It does not act on the underlying
          IRF2BPL lesion or alter the regression.
    evidence:
      - reference: PMID:39571061
        reference_title: "IRF2BPL-Related Disorder."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          standard treatment of epilepsy and movement disorder by an experienced
          neurologist
        explanation: >-
          The management recommendation, and its framing as standard rather than
          disease-specific.
  - name: Developmental and Educational Support
    description: >-
      Developmental and educational support, reassessed at every visit. In a
      regressive disorder this is directed at maintaining and re-acquiring
      function as much as at acquiring it.

      Bound to Educational Intervention rather than a speech- or
      therapy-specific term deliberately: the source recommends "developmental
      and educational support" and names physical and occupational therapists
      under spasticity management, but does not mention speech therapy anywhere.
      Binding a speech-therapy term here would assert a recommendation the
      cited source does not make.
    treatment_term:
      preferred_term: developmental and educational support
      term:
        id: NCIT:C17874
        label: Educational Intervention
    therapeutic_modality: BEHAVIORAL
    target_mechanisms:
      - target: Global developmental delay
        description: >-
          Educational and developmental support for the delay and its
          regression. No cited source claims it reverses the regression.
    evidence:
      - reference: PMID:39571061
        reference_title: "IRF2BPL-Related Disorder."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Treatment of manifestations: Developmental and educational support;
          standard treatment of epilepsy and movement disorder by an experienced
          neurologist
        explanation: >-
          The management recommendation, with developmental and educational
          support listed first among the interventions.
      - reference: PMID:39571061
        reference_title: "IRF2BPL-Related Disorder."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          At each visit, assess developmental progress, educational needs,
          cognitive function, seizures, movement disorder, spasticity,
          contractures, behavioral issues, growth, nutritional status,
          gastrointestinal dysmotility, and family needs
        explanation: >-
          Establishes that developmental and educational needs are reassessed at
          every visit, which is what makes this ongoing support rather than a
          one-off referral.
  - name: Spasticity Management and Rehabilitation
    description: >-
      Multidisciplinary management of spasticity and contractures across
      orthopedics, neurology, physical medicine, physiotherapy and occupational
      therapy.
    treatment_term:
      preferred_term: physical therapy
      term:
        id: NCIT:C15302
        label: Physical Therapy
    therapeutic_modality: BEHAVIORAL
    target_mechanisms:
      - target: Spasticity
        description: >-
          Symptomatic management of tone and prevention of secondary
          contractures.
    evidence:
      - reference: PMID:39571061
        reference_title: "IRF2BPL-Related Disorder."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          standard treatment of spasticity per orthopedist, neurologist,
          physical medicine and rehabilitation specialist, physical therapist,
          and occupational therapist
        explanation: >-
          Names the disciplines involved in spasticity management.
  - name: Feeding and Nutritional Support
    description: >-
      Feeding support for poor weight gain and standard treatment for gastric
      dysmotility.
    treatment_term:
      preferred_term: supportive care
      term:
        id: NCIT:C15747
        label: Supportive Care
    therapeutic_modality: OTHER
    target_mechanisms:
      - target: Feeding difficulties
        description: >-
          Symptomatic support for the feeding and gastrointestinal component.
      - target: Gastrointestinal dysmotility
        description: >-
          Standard treatment of gastric dysmotility. GeneReviews names no
          IRF2BPL-specific approach, and also asks for nutritional status and
          dysmotility to be reassessed at every visit.
      - target: Dysphagia
        description: >-
          Swallowing difficulty is part of what feeding support addresses in a
          regressive disorder. The cited guidance covers feeding and weight gain
          rather than dysphagia by name, so this link is the general feeding
          recommendation applied to the specific phenotype.
    evidence:
      - reference: PMID:39571061
        reference_title: "IRF2BPL-Related Disorder."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          feeding support for poor weight gain
        explanation: >-
          The management recommendation for feeding difficulty.
      - reference: PMID:39571061
        reference_title: "IRF2BPL-Related Disorder."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          standard treatment for gastric dysmotility
        explanation: >-
          The management recommendation for the gastrointestinal component.
  - name: Ophthalmologic Management
    description: >-
      Treatment of vision deficits by the treating ophthalmologist, with more
      complex findings referred to an ophthalmic subspecialist, plus a dilated
      eye exam on the ophthalmologist's schedule. Ocular disturbance is one of
      the five recurring domains in this disorder, so this is a routine rather
      than exceptional referral.
    treatment_term:
      preferred_term: ophthalmologic care
      term:
        id: NCIT:C49236
        label: Therapeutic Procedure
    therapeutic_modality: OTHER
    target_mechanisms:
      - target: Ocular involvement
        description: >-
          Symptomatic treatment of the ocular component. Nothing in the cited
          guidance claims it alters the neurodegeneration.
      - target: Nystagmus
        description: >-
          Nystagmus falls within the ophthalmologic findings this referral
          covers, though the cited guidance addresses vision deficits generally
          rather than nystagmus by name.
    evidence:
      - reference: PMID:39571061
        reference_title: "IRF2BPL-Related Disorder."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          treatment of vision deficits per ophthalmologist with treatment of
          more complex findings per ophthalmic subspecialist
        explanation: >-
          The ophthalmologic management recommendation and its escalation path.
      - reference: PMID:39571061
        reference_title: "IRF2BPL-Related Disorder."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          dilated eye exam per treating ophthalmologist
        explanation: >-
          The surveillance half of the same recommendation.
  - name: Endocrine Management of Pubertal Delay
    description: >-
      Assessment of pubertal development at every visit through adolescence,
      with endocrine treatment when puberty is delayed. Worth curating
      separately from general supportive care because IRF2BPL is EAP1, a
      hypothalamic regulator of pubertal onset, so the endocrine surveillance is
      mechanistically motivated rather than generic.
    treatment_term:
      preferred_term: endocrine management of delayed puberty
      term:
        id: NCIT:C49236
        label: Therapeutic Procedure
    therapeutic_modality: OTHER
    target_mechanisms:
      - target: Delayed puberty
        description: >-
          Endocrine treatment of the pubertal delay itself. The cited guidance
          gives no specific regimen, and no cited source connects this to the
          neurological course.
    evidence:
      - reference: PMID:39571061
        reference_title: "IRF2BPL-Related Disorder."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          treatment of pubertal delay per endocrinologist
        explanation: >-
          The management recommendation for pubertal delay.
  - name: Family and Social Work Support
    description: >-
      Family and social work support, with family needs reassessed at each
      visit. In a disorder where children lose skills they had already acquired,
      this is a named part of management rather than an afterthought.
    treatment_term:
      preferred_term: family and social work support
      term:
        id: NCIT:C15747
        label: Supportive Care
    therapeutic_modality: OTHER
    target_mechanisms:
      - target: Loss of Previously Acquired Developmental Milestones
        description: >-
          Support directed at the family carrying the consequences of the
          regression, not at the mechanism itself.
    evidence:
      - reference: PMID:39571061
        reference_title: "IRF2BPL-Related Disorder."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          family and social work support
        explanation: >-
          Names family and social work support among the treatments of
          manifestations.
  - name: Genetic Counseling
    description: >-
      Autosomal dominant counseling. Most cases are de novo, but about 9% have an
      affected parent, and each child of an affected individual has a 50% risk.
    treatment_term:
      preferred_term: genetic counseling

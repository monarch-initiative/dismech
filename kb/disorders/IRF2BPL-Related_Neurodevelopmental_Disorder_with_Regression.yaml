notes: >-
  Lump/split. Curated as a standalone DISEASE. Its two MONDO parents
  (MONDO:0002254 syndromic disease, MONDO:0100500 Mendelian neurodevelopmental
  disorder) are broad groupings with no corresponding curated dismech entry, so
  there is no parent disease for this to be a has_subtypes entry on. It has one
  causal gene, one reasonably conserved pathograph, and a mechanism
  (NMD-escaping truncation acting dominant-negatively through cytoplasmic
  sequestration of the wild-type protein) that is specific to it rather than
  shared with the encephalopathies it is grouped with.

  No deep-research provider report backs this entry. `just research-disorder
  falcon` returned HTTP 402 (provider account out of credits) and two attempts at
  the documented `claude_code` fallback - one plain, one with `--fallback` -
  failed identically with `agentapi not found in PATH` and `exited with code 1`.
  The entry was therefore curated from literature retrieved directly from PubMed,
  with every reference fetched through `just fetch-reference`. No file was left
  under `research/`, because no report was produced.

  Phenotype frequencies come from the two cohort papers whose full text is
  cached, and every band below is a denominator someone published rather than a
  reading of a qualitative phrase. The 28-patient systematic review gives
  developmental delay/regression in all 28 (OBLIGATE), then epilepsy 21/28,
  spasticity 14/28, dystonia 12/28, ocular disturbances 12/28 and ataxia 10/28 -
  36% to 75%, so FREQUENT for all five - plus dysmorphic features in 5/28
  (17.9%, OCCASIONAL). The earlier 11-patient cohort adds dysphagia 3/11 and
  dysarthria and nystagmus at 2/11 each, all OCCASIONAL.

  Where a feature is named only in a GeneReviews list or a narrative sentence -
  tremor, parkinsonism, psychosis, autistic behaviour, the psychiatric and
  gastrointestinal manifestations, delayed puberty - no `frequency` is recorded
  at all. Those sources do give the feature, but not a denominator, and a band
  read off "many individuals" or "are also reported" would be invented rather
  than cited. The two denominators are also not interchangeable: the 11-patient
  series is a developmental-epileptic-encephalopathy ascertainment and the
  28-patient review is a literature aggregate, so a feature counted in one is
  not silently rescaled to the other.

  Two of those denominators are stated in the review's descriptive prose rather
  than quoted below, and the reason is mechanical, not evidential. The sentence
  that lists them runs the fractions together with inline numeric citation
  markers, which the snippet validator strips out of a quote before matching, so
  no verbatim span can cross one; and the ocular fraction sits inside a word the
  PDF extraction wrapped across a hyphen. Where a second, uninterrupted sentence
  carries the same numbers - the epilepsy table caption, the sex breakdown of
  spasticity, the dystonia distribution sub-counts - that sentence is cited
  instead. Where none does, as for ocular disturbance, the band rests on the
  authors' own "relatively high frequency" characterization of the domain set,
  and the fraction is recorded in the phenotype description with this caveat
  attached rather than being quoted in a form that no longer reads as the
  source.

  Keratoconus is not curated as a phenotype. It is reported in the IRF2BPL
  literature and there is a specific paper on the question, but PMID:32291157
  returned no retrievable content through the reference fetcher, so no exact
  snippet can be quoted for it. The systematic review's more general "ocular
  disturbances" is curated instead, bound to a correspondingly general HP term.

  CuATSM is not curated as a treatment. It rescues neuronal survival and
  mitochondrial function in patient-derived cells and ameliorates motor defects
  in flies, but there is no human trial in this disease. It is recorded where the
  evidence actually sits - as a RESCUES link on the model systems that
  demonstrated it - rather than in `treatments`, which would imply a clinical
  option that does not exist.
inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      Dominant, and overwhelmingly de novo - roughly 9% of reported individuals
      have an affected parent. The dominance is not by dose: the truncated
      product is expressed and interferes with the wild-type protein.
    evidence:
      - reference: PMID:39571061
        reference_title: "IRF2BPL-Related Disorder."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          IRF2BPL-related disorder is inherited in an autosomal dominant manner.
          The majority of individuals diagnosed with IRF2BPL-related disorder
          have the disorder as the result of a de novo pathogenic variant;
          approximately 9% of individuals reported to date have an affected
          parent.
        explanation: >-
          States both the mode of inheritance and the de novo predominance, with
          the parental-transmission fraction.
genetic:
  - name: IRF2BPL
    relationship_type: CAUSATIVE
    variant_origin: DE_NOVO
    gene_term:
      preferred_term: IRF2BPL
      term:
        id: hgnc:14282
        label: IRF2BPL
    notes: >-
      Nonsense and frameshift variants predominate and remove the C-terminal
      RING-finger domain required for IRF2BPL's transcriptional repressive and
      transactivating properties. Missense variants are reported and give a
      milder phenotype than nonsense alleles.

      The `genetic_context.functional_impact_category: DOMINANT_NEGATIVE` on the
      initiating pathophysiology node, rather than LOSS_OF_FUNCTION, is a
      deliberate call, and it is the point of the entry.
      The gene is intronless, the premature-stop transcript escapes
      nonsense-mediated decay and is expressed roughly 1:1 with the wild-type
      allele, and the resulting truncated protein sequesters full-length IRF2BPL
      into cytoplasmic aggregates. That is interference with the remaining
      wild-type product, which is what DOMINANT_NEGATIVE means here, not a
      halved dose.

      Variant position may matter, though it is not established. The three
      adults who presented as progressive myoclonus epilepsy all carried
      protein-truncating variants clustered in a proximal, highly conserved
      region around the coiled-coil domain, which hints at a positional effect
      on presentation and onset age. Set against that, the 28-patient
      systematic review found no significant correlation between the number of
      affected clinical domains and variant type, so the clustering is a lead
      rather than a genotype-phenotype rule. See the `irf2bpl_onset_age_range`
      discussion.
    inheritance:
      - name: Autosomal dominant inheritance
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
    evidence:
      - reference: PMID:30166628
        reference_title: "De novo truncating variants in the intronless IRF2BPL are responsible for developmental epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We identified 11 unrelated individuals with DEE and de novo
          heterozygous truncating variants in the interferon regulatory factor
          2-binding protein-like gene (IRF2BPL).
        explanation: >-
          Establishes the gene-disease relationship, the variant class, and that
          the variants are de novo and heterozygous.
      - reference: PMID:30166628
        reference_title: "De novo truncating variants in the intronless IRF2BPL are responsible for developmental epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          IRF2BPL, also known as enhanced at puberty protein 1 (EAP1), encodes a
          transcriptional regulator containing a C-terminal RING-finger domain
          common to E3 ubiquitin ligases. This domain is required for its
          repressive and transactivating transcriptional properties. The
          variants identified are expected to encode a protein lacking the
          C-terminal RING-finger domain.
        explanation: >-
          Identifies the gene product as a transcriptional regulator and names
          the domain the disease variants delete, which is what links variant
          class to the transcriptional lesion modelled below.
      - reference: PMID:30057031
        reference_title: "IRF2BPL Is Associated with Neurological Phenotypes."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Two additional individuals, both with missense variants, display
          global developmental delay and seizures and a relatively milder
          phenotype than those with nonsense alleles.
        explanation: >-
          Supports an allelic series in which missense variants are milder than
          truncating ones, consistent with the truncated product rather than
          simple loss of the gene driving severity.
      - reference: PMID:30057031
        reference_title: "IRF2BPL Is Associated with Neurological Phenotypes."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          The IRF2BPL bioinformatics signature based on population genomics is
          consistent with a gene that is intolerant to variation.
        explanation: >-
          Population-genomic constraint supporting pathogenicity of the observed
          variants. Graded COMPUTATIONAL because the claim is a bioinformatic
          signature, not a patient observation.
      - reference: PMID:37114479
        reference_title: "IRF2BPL as a novel causative gene for progressive myoclonus epilepsy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          all three patients harbored protein-truncating variants clustered in
          a proximal, highly conserved gene region around the "coiled-coil"
          domain
        explanation: >-
          The positional clustering behind the note above. Three patients with a
          shared presentation is a lead about variant position, not an
          established genotype-phenotype correlation.
pathophysiology:
  - name: De Novo Heterozygous IRF2BPL Truncating Variant
    biological_scale: MOLECULAR
    description: >-
      A de novo nonsense or frameshift variant in the single-exon IRF2BPL gene,
      predicted to remove the C-terminal RING-finger domain that carries the
      protein's transcriptional repressive and transactivating activity.
    genes:
      - preferred_term: IRF2BPL
        term:
          id: hgnc:14282
          label: IRF2BPL
    genetic_context:
      variant_origin: DE_NOVO
      zygosity: HETEROZYGOUS
      functional_impact_category: DOMINANT_NEGATIVE
      description: >-
        Heterozygous de novo nonsense or frameshift alleles removing the
        C-terminal RING-finger domain. Classified DOMINANT_NEGATIVE rather than
        LOSS_OF_FUNCTION because the truncated product is expressed - the
        intronless transcript escapes nonsense-mediated decay - and sequesters
        the wild-type protein, rather than the allele simply being absent.
        Missense alleles are also reported and are milder.
    downstream:
      - target: Nonsense-Mediated Decay Escape and Truncated Protein Expression
    evidence:
      - reference: PMID:30166628
        reference_title: "De novo truncating variants in the intronless IRF2BPL are responsible for developmental epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The variants identified are expected to encode a protein lacking the
          C-terminal RING-finger domain.
        explanation: >-
          States the predicted protein-level consequence of the disease variants
          that initiates this chain.
  - name: Nonsense-Mediated Decay Escape and Truncated Protein Expression
    biological_scale: MOLECULAR
    description: >-
      IRF2BPL is intronless, so a transcript carrying a premature termination
      codon is not cleared by nonsense-mediated decay. In patient fibroblasts the
      mutant allele is expressed at a ratio of at least 1:1 with the wild-type
      allele, so a truncated protein is translated rather than the allele simply
      being lost.
    biological_processes:
      - preferred_term: nonsense-mediated decay of the IRF2BPL premature-stop transcript
        term:
          id: GO:0000184
          label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
        modifier: DECREASED
    downstream:
      - target: Cytoplasmic Sequestration of Wild-Type IRF2BPL
    evidence:
      - reference: PMID:30166628
        reference_title: "De novo truncating variants in the intronless IRF2BPL are responsible for developmental epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          in favor of nonsense-mediated decay (NMD) escape because the mutated
          allele is expressed with a ratio of at least 1:1 with the wild-type
          (WT) allele, suggesting that the shorter protein might be translated
        explanation: >-
          Direct measurement in patient-derived fibroblasts showing the mutant
          transcript is not degraded, which is the observation that makes a
          truncated product available to act dominant-negatively.
      - reference: PMID:30166628
        reference_title: "De novo truncating variants in the intronless IRF2BPL are responsible for developmental epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          It belongs to a group of human intronless genes that are known to
          possibly escape nonsense-mediated decay (NMD), despite presence of a
          premature stop codon.
        explanation: >-
          Gives the structural reason for NMD escape - the absence of introns -
          rather than treating it as an unexplained observation. Graded
          COMPUTATIONAL because this is a statement about gene architecture
          drawn from genome annotation, not an observation made in a patient.
  - name: Cytoplasmic Sequestration of Wild-Type IRF2BPL
    biological_scale: MOLECULAR
    description: >-
      Full-length IRF2BPL is normally nuclear. The truncated patient protein
      instead accumulates in the cytoplasm and pulls wild-type IRF2BPL out of the
      nucleus with it, forming aggregates. This is the dominant-negative step,
      and it is why the disorder does not behave as haploinsufficiency.
    biological_processes:
      - preferred_term: nuclear import of full-length IRF2BPL
        term:
          id: GO:0034504
          label: protein localization to nucleus
        modifier: DECREASED
    downstream:
      - target: Loss of IRF2BPL Transcriptional Repression
      - target: Intracellular Protein Aggregate Formation
    evidence:
      - reference: PMID:36476864
        reference_title: "Mechanisms of IRF2BPL-related disorders and identification of a potential therapeutic strategy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          While full-length IRF2BPL primarily localizes to the nucleus,
          truncated patient variants sequester the wild-type protein to the
          cytoplasm and cause aggregation.
        explanation: >-
          States the sequestration mechanism directly, in patient-derived
          reprogrammed cells.
      - reference: PMID:36476864
        reference_title: "Mechanisms of IRF2BPL-related disorders and identification of a potential therapeutic strategy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          co-expression of full-length and truncated IRF2BPL in Drosophila
          results in cytoplasmic accumulation of full-length IRF2BPL
        explanation: >-
          In vivo confirmation that the truncated product is sufficient to
          mislocalise the wild-type protein.
  - name: Loss of IRF2BPL Transcriptional Repression
    biological_scale: MOLECULAR
    description: >-
      With full-length IRF2BPL depleted from the nucleus, its repressive
      transcriptional activity is lost. Overexpressing IRF2BPL or its Drosophila
      ortholog Pits represses Wnt transcription, so removing it releases that
      repression.
    biological_processes:
      - preferred_term: IRF2BPL-mediated transcriptional repression
        term:
          id: GO:0000122
          label: negative regulation of transcription by RNA polymerase II
        modifier: DECREASED
    downstream:
      - target: Excess Wnt Signaling
    evidence:
      - reference: PMID:35044823
        reference_title: "Loss of IRF2BPL impairs neuronal maintenance through excess Wnt signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Overexpression of either IRF2BPL or Pits, the Drosophila ortholog,
          represses Wnt transcription in flies.
        explanation: >-
          Establishes that IRF2BPL's normal role at this node is repression of
          Wnt transcription, which is what its loss releases.
  - name: Excess Wnt Signaling
    biological_scale: CELLULAR
    description: >-
      Loss of IRF2BPL repression raises Wnt ligand levels and downstream
      signalling. This is not merely correlative: increasing neuronal wingless in
      flies is by itself sufficient to cause age-dependent axonal loss, and
      inhibiting Wnt is neuroprotective. WNT1 is likewise elevated in
      patient-derived astrocytes.
    biological_processes:
      - preferred_term: Wnt signaling pathway
        term:
          id: GO:0016055
          label: Wnt signaling pathway
        modifier: INCREASED
    downstream:
      - target: Progressive Neuronal and Axonal Loss
    evidence:
      - reference: PMID:35044823
        reference_title: "Loss of IRF2BPL impairs neuronal maintenance through excess Wnt signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In contrast, neuronal depletion of Pits leads to increased wingless
          (wg) levels in the brain and is associated with axonal loss, whereas
          inhibition of Wg signaling is neuroprotective.
        explanation: >-
          Links loss of the ortholog to raised Wnt ligand and to axonal loss, and
          shows the loss is Wnt-dependent because blocking Wnt protects.
      - reference: PMID:35044823
        reference_title: "Loss of IRF2BPL impairs neuronal maintenance through excess Wnt signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Moreover, increased neuronal expression of wg in flies is sufficient
          to cause age-dependent axonal loss, similar to reduction of Pits.
        explanation: >-
          Sufficiency, and the age dependence that makes this a progressive
          rather than a developmental lesion.
      - reference: PMID:35044823
        reference_title: "Loss of IRF2BPL impairs neuronal maintenance through excess Wnt signaling."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          WNT1 is also increased in patient-derived astrocytes, and
          pharmacological inhibition of Wnt suppresses the neurological
          phenotypes.
        explanation: >-
          Shows the Wnt elevation is present in human patient-derived cells and
          not only in the invertebrate model.
  - name: Astrocyte Mitochondrial Respiratory Dysfunction
    biological_scale: CELLULAR
    description: >-
      Astrocytes reprogrammed from patient fibroblasts carry structurally
      aberrant mitochondria and measurable respiratory dysfunction. The same
      direction of change is visible in patient muscle, where biopsies show
      cytochrome-c-oxidase-negative and ragged-red-like fibres and electron
      transport chain assay in one patient found generalized deficiencies - so
      the mitochondrial arm is not an artefact of reprogrammed glia alone.
    cell_types:
      - preferred_term: patient-derived astrocyte
        term:
          id: CL:0000127
          label: astrocyte
    biological_processes:
      - preferred_term: astrocyte mitochondrial respiration
        term:
          id: GO:0045333
          label: cellular respiration
        modifier: DECREASED
    downstream:
      - target: Loss of Astrocytic Trophic Support for Neurons
    evidence:
      - reference: PMID:36476864
        reference_title: "Mechanisms of IRF2BPL-related disorders and identification of a potential therapeutic strategy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          exhibit aberrant mitochondria and respiratory dysfunction
        explanation: >-
          The mitochondrial half of the astrocyte observation, quoted on its own
          because it is a separate claim from the coculture survival result.
      - reference: PMID:30166628
        reference_title: "De novo truncating variants in the intronless IRF2BPL are responsible for developmental epileptic encephalopathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Muscle electron transport chain studies performed in patient 1 showed
          mild generalized deficiencies that could indicate primary or secondary
          mitochondrial defects.
        explanation: >-
          Patient tissue pointing the same way as the reprogrammed astrocytes.
          The authors' own hedge - primary or secondary - is why this node is
          not curated as a primary mitochondrial disease.
  - name: Loss of Astrocytic Trophic Support for Neurons
    biological_scale: CELLULAR
    description: >-
      Patient astrocytes fail to keep neurons alive in coculture. Neuronal loss
      in NEDAMSS is therefore not purely cell-autonomous - a failing glial
      compartment contributes, downstream of the astrocyte's own metabolic
      failure.
    cell_types:
      - preferred_term: patient-derived astrocyte
        term:
          id: CL:0000127
          label: astrocyte
    downstream:
      - target: Progressive Neuronal and Axonal Loss
    evidence:
      - reference: PMID:36476864
        reference_title: "Mechanisms of IRF2BPL-related disorders and identification of a potential therapeutic strategy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          patient astrocytes fail to support neuronal survival in coculture
        explanation: >-
          The glial-support half of the astrocyte observation: the measurement
          is made on the neurons, and it is what makes this a distinct step from
          the astrocyte's mitochondrial defect.
  - name: Intracellular Protein Aggregate Formation
    biological_scale: CELLULAR
    description: >-
      Sequestration of wild-type IRF2BPL by the truncated product produces
      cytoplasmic aggregates in cells. At autopsy the corresponding human finding
      is polyglutamine inclusions, in a distribution consistent with DRPLA -
      despite these patients carrying no repeat expansion, since the variants sit
      distal to IRF2BPL's own polyQ tract.
    biological_processes:
      - preferred_term: inclusion body assembly
        term:
          id: GO:0070841
          label: inclusion body assembly
        modifier: INCREASED
    downstream:
      - target: Progressive Neuronal and Axonal Loss
    evidence:
      - reference: PMID:39224955
        reference_title: "IRF2BPL-Related Disorder, Causing Neurodevelopmental Disorder with Regression, Abnormal Movements, Loss of Speech and Seizures (NEDAMSS) Is Characterized by Pathology Consistent with DRPLA."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Detailed postmortem gross and histological examination was conducted,
          and findings consistent with dentatorubral-pallidoluysian atrophy
          (DRPLA) and included polyglutamine (polyQ) inclusions.
        explanation: >-
          The only detailed human neuropathology for this disorder, and the
          direct observation of inclusions in patient brain.
      - reference: PMID:39224955
        reference_title: "IRF2BPL-Related Disorder, Causing Neurodevelopmental Disorder with Regression, Abnormal Movements, Loss of Speech and Seizures (NEDAMSS) Is Characterized by Pathology Consistent with DRPLA."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Although the individuals with NEDAMSS do not carry an expansion, the
          polyQ repeat tract may play a role in the pathological inclusions that
          would represent a novel disease mechanism for polyQ repeats.
        explanation: >-
          Records the authors' own hedging - that the polyQ involvement is a
          proposed mechanism, not an established one - so this node is not read
          as a settled repeat-expansion disease.
      - reference: PMID:37114479
        reference_title: "IRF2BPL as a novel causative gene for progressive myoclonus epilepsy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The skin biopsy revealed massive intracellular glycogen inclusions in
          one proband, suggesting a similar pathogenic pathway to other storage
          disorders.
        explanation: >-
          A second, independent inclusion finding in patient tissue, from a
          different group and a different organ than the autopsy polyQ result.
          It is glycogen rather than protein, so it does not corroborate the
          polyQ observation directly; what it supports is that intracellular
          accumulation is a real feature of this disorder outside the brain.
  - name: Progressive Neuronal and Axonal Loss
    biological_scale: TISSUE
    description: >-
      The convergence point of the excess-Wnt, glial-failure and aggregation
      arms. Partial neuronal knockdown of the IRF2BPL ortholog in flies causes
      frank neurodegeneration, establishing a requirement for this gene in
      neuronal maintenance rather than only in neuronal development.
    cell_types:
      - preferred_term: neuron
        term:
          id: CL:0000540
          label: neuron
    biological_processes:
      - preferred_term: neuron projection maintenance
        term:
          id: GO:1990535
          label: neuron projection maintenance
        modifier: DECREASED
    downstream:
      - target: Loss of Previously Acquired Developmental Milestones
      - target: Cerebral and Cerebellar Atrophy
    evidence:
      - reference: PMID:30057031
        reference_title: "IRF2BPL Is Associated with Neurological Phenotypes."

name: Idiopathic Interstitial Pneumonia
creation_date: "2026-08-20T00:00:00Z"
category: Respiratory Disease
parents:
- Respiratory Disease
- Lung Disease
disease_term:
  preferred_term: idiopathic interstitial pneumonia
  term:
    id: MONDO:0002429
    label: idiopathic interstitial pneumonia
description: >-
  A classification family of diffuse parenchymal lung diseases of unknown cause,
  defined by the ATS/ERS international multidisciplinary classification. Injury
  to the alveolar-interstitial compartment in the absence of an identified cause
  is resolved into one of a small number of stereotyped histopathologic patterns
  — usual interstitial pneumonia, nonspecific interstitial pneumonia, organizing
  pneumonia, diffuse alveolar damage, respiratory bronchiolitis, desquamative
  interstitial pneumonia, lymphoid interstitial pneumonia — and it is the pattern,
  reached by multidisciplinary discussion rather than histology alone, that
  assigns the clinicopathologic entity, its prognosis, and its treatment. This
  entry models what the entities share (the injury-response pivot and the
  progressive-fibrosis outcome common to their fibrosing members) and delegates
  entity-specific mechanism to the individual subtype entries; the full
  pathograph of idiopathic pulmonary fibrosis is curated separately in
  `Idiopathic_Pulmonary_Fibrosis.yaml` and is deliberately not duplicated here.
synonyms:
- IIP
- idiopathic interstitial pneumonitis
notes: >-
  Scoping decision. This is curated as a root Disease entry with `has_subtypes`
  rather than as a `kb/groupings/` Grouping because a dismech Grouping is a
  curated union over already-distinct Disease entries, and only one of the eight
  ATS/ERS entities (idiopathic pulmonary fibrosis) currently exists as its own
  entry — a one-member union would carry no auditable boundary. The root graph
  is deliberately restricted to the shared injury-response pivot and the shared
  progressive-fibrosis outcome, with each entity's distinctive pattern kept as a
  separate parallel node, so this is not a blended umbrella pathograph. Once
  three or more of the remaining entities have standalone entries, converting
  this family to a Grouping (retaining this entry as the umbrella Disease, as was
  done for diabetes mellitus) becomes the right structure.

has_subtypes:
- name: IPF
  display_name: Idiopathic Pulmonary Fibrosis (UIP pattern)
  classification: histological
  subtype_term:
    preferred_term: idiopathic pulmonary fibrosis
    term:
      id: MONDO:0800504
      label: idiopathic pulmonary fibrosis
  description: >-
    Chronic fibrosing IIP defined by the usual interstitial pneumonia (UIP)
    pattern — patchy subpleural fibrosis with fibroblast foci and honeycombing —
    and the worst prognosis of the group. Curated in full as its own dismech
    entry (`Idiopathic_Pulmonary_Fibrosis.yaml`); it is referenced here rather
    than duplicated.
  evidence:
  - reference: PMID:39761948
    reference_title: "Korean Guidelines for Diagnosis and Management of Idiopathic Nonspecific Interstitial Pneumonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prognosis is generally more favorable for iNSIP than for idiopathic
      pulmonary fibrosis, with many studies reporting a 5-year survival rate
      above 70%.
    explanation: >-
      Establishes that IPF is the worse-prognosis member of the family relative
      to its nearest chronic fibrosing sibling, which is why the two are kept as
      separate entities rather than lumped.

- name: iNSIP
  display_name: Idiopathic Nonspecific Interstitial Pneumonia
  classification: histological
  subtype_term:
    preferred_term: non-specific interstitial pneumonia
    term:
      id: MONDO:0019622
      label: non-specific interstitial pneumonia
  description: >-
    Chronic fibrosing IIP defined by the temporally uniform NSIP pattern
    (cellular or fibrotic), diagnosed only once connective tissue disease,
    hypersensitivity pneumonitis, drug toxicity, and other secondary causes are
    excluded. Prognosis is better than IPF, and a subset nonetheless behaves as
    progressive pulmonary fibrosis.
  evidence:
  - reference: PMID:39761948
    reference_title: "Korean Guidelines for Diagnosis and Management of Idiopathic Nonspecific Interstitial Pneumonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is identified histologically by the nonspecific interstitial pneumonia
      pattern. A diagnosis of iNSIP is feasible once secondary causes or
      underlying diseases are ruled out.
    explanation: >-
      States both defining features of the entity — the histologic pattern and
      the exclusion of secondary causes that makes it idiopathic.
  - reference: PMID:24032382
    reference_title: "An official American Thoracic Society/European Respiratory Society statement: Update of the international multidisciplinary classification of the idiopathic interstitial pneumonias."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nonspecific interstitial pneumonia is now better defined.
    explanation: >-
      The 2013 ATS/ERS update records that iNSIP was consolidated as a defined
      entity rather than a provisional diagnosis.

- name: COP
  display_name: Cryptogenic Organizing Pneumonia
  classification: histological
  subtype_frequency: "approximately 5% to 10% of IIPs"
  subtype_term:
    preferred_term: cryptogenic organizing pneumonia
    term:
      id: MONDO:0015264
      label: cryptogenic organizing pneumonia
  description: >-
    Acute/subacute IIP defined by the organizing pneumonia pattern — polypoid
    intra-alveolar granulation tissue (Masson bodies) with preserved lung
    architecture. Formerly called idiopathic bronchiolitis obliterans organizing
    pneumonia (BOOP). Characteristically steroid-responsive, which sets it apart
    from the chronic fibrosing entities.
  evidence:
  - reference: PMID:40078018
    reference_title: "Korean Guidelines for Diagnosis and Management of Interstitial Lung Disease: Cryptogenic Organizing Pneumonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      COP accounts for approximately 5% to 10% of IIPs, with the average age of
      diagnosis ranging from 50 to 60 years.
    explanation: >-
      Source for the subtype frequency within the IIP family and the typical age
      at diagnosis.

- name: AIP
  display_name: Acute Interstitial Pneumonia (Hamman-Rich syndrome)
  classification: histological
  subtype_term:
    preferred_term: acute interstitial pneumonia
    term:
      id: MONDO:0019203
      label: acute interstitial pneumonia
  description: >-
    Fulminant IIP defined by diffuse alveolar damage occurring without an
    identified cause. Clinically indistinguishable from ARDS, so the diagnosis
    requires histologic DAD plus exclusion of known ARDS triggers.
  evidence:
  - reference: PMID:23001802
    reference_title: "Acute interstitial pneumonia (AIP): relationship to Hamman-Rich syndrome, diffuse alveolar damage (DAD), and acute respiratory distress syndrome (ARDS)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The main differences between AIP and ARDS are that AIP requires a
      histologic diagnosis of DAD and exclusion of known etiologies.
    explanation: >-
      States the two criteria that make AIP an idiopathic interstitial pneumonia
      rather than ARDS.

- name: RB-ILD
  display_name: Respiratory Bronchiolitis-Interstitial Lung Disease
  classification: histological
  subtype_term:
    preferred_term: respiratory bronchiolitis-interstitial lung disease syndrome
    term:
      id: MONDO:0019204
      label: respiratory bronchiolitis-interstitial lung disease syndrome
  description: >-
    Smoking-related IIP in which pigmented macrophages accumulate in and around
    respiratory bronchioles. Distinguished from the other entities by having an
    identified and removable driver — tobacco smoke — so smoking cessation is
    first-line therapy.
  evidence:
  - reference: PMID:40081337
    reference_title: "Korean Guidelines for the Diagnosis and Management of Interstitial Lung Disease: Other Forms of Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Respiratory bronchiolitis-associated ILD mainly affects smokers, showing
      ground-glass opacities on chest computed tomography (CT) scans and
      pigmented macrophages in the bronchoalveolar lavage fluid.
    explanation: >-
      Establishes the smoking association and the macrophage-centred lesion that
      define this entity.

- name: DIP
  display_name: Desquamative Interstitial Pneumonia
  classification: histological
  subtype_term:
    preferred_term: desquamative interstitial pneumonia
    term:
      id: MONDO:0009887
      label: desquamative interstitial pneumonia
  description: >-
    The second smoking-related IIP, in which the same pigmented-macrophage
    accumulation becomes diffuse and fills the alveolar spaces rather than
    remaining bronchiolocentric, producing restrictive physiology and widespread
    ground-glass opacity.
  evidence:
  - reference: PMID:40081337
    reference_title: "Korean Guidelines for the Diagnosis and Management of Interstitial Lung Disease: Other Forms of Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Desquamative interstitial pneumonia, also related to smoking, is
      characterized by exertional dyspnea, dry cough, restrictive lung function,
      and ground-glass opacities on high-resolution CT.
    explanation: >-
      Establishes the smoking association and the clinical-physiologic profile
      that distinguish DIP from its bronchiolocentric sibling RB-ILD.

- name: LIP
  display_name: Lymphoid Interstitial Pneumonia
  classification: histological
  subtype_term:
    preferred_term: lymphoid interstitial pneumonia
    term:
      id: MONDO:0009537
      label: lymphoid interstitial pneumonia
  description: >-
    Rare IIP in which diffuse lymphocytic infiltration expands the interstitium.
    Genuinely idiopathic LIP is uncommon; most cases are associated with an
    autoimmune disease (notably Sjogren syndrome) or an infection, which must be
    sought before the idiopathic label is applied.
  evidence:
  - reference: PMID:40081337
    reference_title: "Korean Guidelines for the Diagnosis and Management of Interstitial Lung Disease: Other Forms of Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymphoid interstitial pneumonia involves lymphocytic proliferation and is
      associated with autoimmune diseases or infections, treated with
      corticosteroids.
    explanation: >-
      States the lymphoproliferative lesion, the secondary associations that must
      be excluded, and the treatment that follows from the lesion.

- name: IPPFE
  display_name: Idiopathic Pleuroparenchymal Fibroelastosis
  classification: histological
  subtype_term:
    preferred_term: idiopathic pleuroparenchymal fibroelastosis
    term:
      id: MONDO:0044633
      label: idiopathic pleuroparenchymal fibroelastosis
  description: >-
    Rare IIP added to the family in the 2013 ATS/ERS update, characterized by
    upper-lobe pleural and subpleural fibroelastosis in predominantly
    non-smokers. Included here because the 2013 classification explicitly widened
    the family beyond the six major entities.
  evidence:
  - reference: PMID:24032382
    reference_title: "An official American Thoracic Society/European Respiratory Society statement: Update of the international multidisciplinary classification of the idiopathic interstitial pneumonias."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A group of rare entities, including pleuroparenchymal fibroelastosis and
      rare histologic patterns, is introduced.
    explanation: >-
      The 2013 ATS/ERS update is the document that admits IPPFE to the IIP
      classification as a rare entity.
  - reference: PMID:40081337
    reference_title: "Korean Guidelines for the Diagnosis and Management of Interstitial Lung Disease: Other Forms of Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Idiopathic pleuroparenchymal fibroelastosis results in fibrosis in the
      upper lobes, primarily in nonsmokers, and is diagnosed through clinical and
      imaging findings, with no effective treatment to improve survival.
    explanation: >-
      Gives the distribution, the smoking profile, and the absence of effective
      therapy that differentiate IPPFE from the other fibrosing entities.

pathophysiology:
- name: Injury to the alveolar-interstitial compartment of unknown cause
  biological_scale: TISSUE
  role: trigger
  conforms_to: "fibrotic_response#Tissue Injury"
  description: >-
    The shared initiating step of the family. Injury reaches the alveolar
    epithelium and the surrounding interstitium, and the search for a cause —
    connective tissue disease, inhaled antigen, drug, infection, occupational
    exposure — returns nothing. What makes an interstitial pneumonia idiopathic
    is therefore not a distinct kind of injury but the exhaustion of the
    differential, which is why every entity in this family is defined partly by
    exclusion.
  cell_types:
  - preferred_term: alveolar type II pneumocyte
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  - preferred_term: pulmonary alveolus
    term:
      id: UBERON:0002299
      label: alveolus of lung
  biological_processes:
  - preferred_term: wound healing
    term:
      id: GO:0042060
      label: wound healing
    modifier: DYSREGULATED
  downstream:
  - target: Resolution of injury into a stereotyped histopathologic pattern
  evidence:
  - reference: PMID:41513514
    reference_title: "Organizing Pneumonia Phenotype."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Organizing pneumonia (OP) is a nonspecific lung parenchymal response to any
      form of injury, with its idiopathic variant coined as cryptogenic
      organizing pneumonia (COP).
    explanation: >-
      Directly states the logic this node encodes for one member of the family —
      the lesion is a stereotyped, cause-agnostic parenchymal response to injury,
      and the idiopathic entity is what remains once a cause cannot be found.
      Recorded as PARTIAL because the source argues it for organizing pneumonia
      rather than for the whole IIP family.
  - reference: PMID:40967604
    reference_title: "Cryptogenic Organizing Pneumonia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic evaluation relies on excluding secondary causes of organizing
      pneumonia and includes a thorough history including medications, exposures,
      and signs or symptoms of underlying rheumatologic disease.
    explanation: >-
      Documents the diagnosis-by-exclusion step this node asserts, naming the
      specific alternative causes that must be ruled out before an interstitial
      pneumonia is called idiopathic.

- name: Resolution of injury into a stereotyped histopathologic pattern
  biological_scale: TISSUE
  role: central_effector
  description: >-
    The pivot of the whole family, and the reason it is a classification rather
    than a single disease. The injured lung has only a small repertoire of
    histopathologic responses — usual interstitial pneumonia, nonspecific
    interstitial pneumonia, organizing pneumonia, diffuse alveolar damage,
    respiratory bronchiolitis, desquamative interstitial pneumonia, lymphoid
    interstitial pneumonia — and which one it adopts, not the (absent) cause,
    assigns the clinicopathologic entity together with its natural history and
    its treatment. Since 2002 that assignment has been made by multidisciplinary
    discussion integrating clinical, radiologic, and pathologic data rather than
    by histology alone.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Organizing pneumonia pattern with intra-alveolar granulation tissue
  - target: Diffuse alveolar damage
  - target: Bronchiolocentric pigmented macrophage accumulation
  - target: Lymphocytic expansion of the interstitium
  - target: Myofibroblast activation in the fibrosing entities
    description: >-
      The chronic fibrosing arm of the classification (UIP in IPF, and the
      fibrotic NSIP pattern) enters the fibrotic response directly rather than
      through an intervening acute or inflammatory lesion.
  evidence:
  - reference: PMID:24032382
    reference_title: "An official American Thoracic Society/European Respiratory Society statement: Update of the international multidisciplinary classification of the idiopathic interstitial pneumonias."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In 2002 the American Thoracic Society/European Respiratory Society
      (ATS/ERS) classification of idiopathic interstitial pneumonias (IIPs)
      defined seven specific entities, and provided standardized terminology and
      diagnostic criteria. In addition, the historical "gold standard" of
      histologic diagnosis was replaced by a multidisciplinary approach.
    explanation: >-
      Both halves of this node come from one sentence pair — that the family
      resolves into a fixed, small set of defined entities, and that the entity
      is assigned by multidisciplinary discussion rather than by histology alone.
  - reference: PMID:39761948
    reference_title: "Korean Guidelines for Diagnosis and Management of Idiopathic Nonspecific Interstitial Pneumonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is identified histologically by the nonspecific interstitial pneumonia
      pattern.
    explanation: >-
      A worked instance of the pattern-assigns-entity rule this node states, for
      the idiopathic NSIP member of the family.

- name: Organizing pneumonia pattern with intra-alveolar granulation tissue
  biological_scale: TISSUE
  role: effector
  description: >-
    The lesion of cryptogenic organizing pneumonia. Polypoid plugs of
    fibroblastic granulation tissue (Masson bodies) fill alveolar spaces,
    alveolar ducts, and distal bronchioles while the underlying alveolar
    architecture is preserved. Because the scaffold survives, the lesion is
    reversible — this is the mechanistic basis for the steroid responsiveness
    that separates COP from the chronic fibrosing entities.
  locations:
  - preferred_term: pulmonary alveolus
    term:
      id: UBERON:0002299
      label: alveolus of lung
  biological_processes:
  - preferred_term: wound healing
    term:
      id: GO:0042060
      label: wound healing
    modifier: INCREASED
  evidence:
  - reference: PMID:41513514
    reference_title: "Organizing Pneumonia Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hallmark pathological features are presence of polypoid granulation
      tissue, or Masson bodies, in the alveolar spaces, with lung architecture
      preserved in most patients with good clinical outcomes poststeroid
      treatment.
    explanation: >-
      Supplies the lesion, its location, the preservation of architecture, and
      the good steroid-treated outcome that follows from it.

- name: Diffuse alveolar damage
  biological_scale: TISSUE
  role: effector
  description: >-
    The lesion of acute interstitial pneumonia. Alveolar-capillary barrier
    disruption with hyaline membrane formation produces fulminant respiratory
    failure clinically indistinguishable from ARDS; survivors pass into an
    organizing phase that can leave fibrosis. AIP is the idiopathic form, so its
    diagnosis requires DAD on histology plus exclusion of every recognised ARDS
    trigger.
  locations:
  - preferred_term: pulmonary alveolus
    term:
      id: UBERON:0002299
      label: alveolus of lung
  downstream:
  - target: Myofibroblast activation in the fibrosing entities
    description: >-
      The organizing phase that follows acute diffuse alveolar damage feeds the
      same fibroblast-driven remodelling as the chronic fibrosing entities.
  evidence:
  - reference: PMID:23001802
    reference_title: "Acute interstitial pneumonia (AIP): relationship to Hamman-Rich syndrome, diffuse alveolar damage (DAD), and acute respiratory distress syndrome (ARDS)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute interstitial pneumonia (AIP) is a term used for an idiopathic form of
      acute lung injury characterized clinically by acute respiratory failure
      with bilateral lung infiltrates and histologically by diffuse alveolar
      damage (DAD), a combination of findings previously known as the Hamman-Rich
      syndrome.
    explanation: >-
      States the lesion, its clinical expression, and that the entity is the
      idiopathic member of the acute lung injury family.

- name: Bronchiolocentric pigmented macrophage accumulation
  biological_scale: CELLULAR
  role: effector
  description: >-
    The lesion shared by the two smoking-related IIPs. Pigmented ("smoker's")
    macrophages accumulate in respiratory bronchioles and the surrounding
    alveoli. Confined to the bronchiolar region the lesion is respiratory
    bronchiolitis-interstitial lung disease; when the same accumulation becomes
    diffuse and fills alveolar spaces it is desquamative interstitial pneumonia.
    This is the one arm of the classification with an identified and removable
    driver, which is why its first-line therapy is an exposure intervention
    rather than a drug.
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  locations:
  - preferred_term: respiratory bronchiole
    term:
      id: UBERON:0002188
      label: respiratory bronchiole
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:40081337
    reference_title: "Korean Guidelines for the Diagnosis and Management of Interstitial Lung Disease: Other Forms of Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Respiratory bronchiolitis-associated ILD mainly affects smokers, showing
      ground-glass opacities on chest computed tomography (CT) scans and
      pigmented macrophages in the bronchoalveolar lavage fluid.
    explanation: >-
      Names the cell, the pigment, and the smoking association that together
      define this arm of the classification.
  - reference: PMID:40081337
    reference_title: "Korean Guidelines for the Diagnosis and Management of Interstitial Lung Disease: Other Forms of Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Desquamative interstitial pneumonia, also related to smoking, is
      characterized by exertional dyspnea, dry cough, restrictive lung function,
      and ground-glass opacities on high-resolution CT.
    explanation: >-
      Establishes that the second smoking-related entity shares the same driver,
      supporting their treatment as one lesion at two extents.

- name: Lymphocytic expansion of the interstitium
  biological_scale: CELLULAR
  role: effector
  description: >-
    The lesion of lymphoid interstitial pneumonia. Polyclonal lymphocytes and
    plasma cells diffusely infiltrate and widen the alveolar septa. Truly
    idiopathic LIP is rare; most cases sit downstream of an autoimmune disease
    (classically Sjogren syndrome) or an infection, so the same caveat that
    governs the whole family — idiopathic means the search failed — is at its
    most demanding here.
  cell_types:
  - preferred_term: lymphocyte
    term:
      id: CL:0000542
      label: lymphocyte
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  biological_processes:
  - preferred_term: lymphocyte proliferation
    term:
      id: GO:0046651
      label: lymphocyte proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:40081337
    reference_title: "Korean Guidelines for the Diagnosis and Management of Interstitial Lung Disease: Other Forms of Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymphoid interstitial pneumonia involves lymphocytic proliferation and is
      associated with autoimmune diseases or infections, treated with
      corticosteroids.
    explanation: >-
      Gives the cellular lesion, the secondary associations that must be excluded
      before calling it idiopathic, and the therapy that follows from it.

- name: Myofibroblast activation in the fibrosing entities
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  description: >-
    Where the fibrosing members of the family converge on the conserved fibrotic
    response. Injured alveolar epithelium fails to re-epithelialise and instead
    releases profibrotic signals that drive fibroblasts into collagen-secreting
    myofibroblasts. This node is deliberately generic: the disease-specific
    upstream biology that feeds it in idiopathic pulmonary fibrosis — telomere
    attrition, AT2 senescence, aberrant basaloid cells, MUC5B — is curated on the
    IPF entry and is not re-derived here.
  cell_types:
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  - preferred_term: alveolar type II pneumocyte
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  biological_processes:
  - preferred_term: fibroblast proliferation
    term:
      id: GO:0048144
      label: fibroblast proliferation
    modifier: INCREASED
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  downstream:
  - target: Progressive pulmonary fibrosis
  evidence:
  - reference: PMID:34084786
    reference_title: "Telomere shortening and DNA damage in culprit cells of different types of progressive fibrosing interstitial lung disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key cells in the pathogenesis involve alveolar type 2 (AT2) cells, club
      cells and myofibroblasts; however, to what extent these cells are affected
      by telomere shortening and DNA damage is not yet known.
    explanation: >-
      Identifies the epithelial and myofibroblast cell types this node asserts as
      the effectors of fibrogenesis across different types of progressive
      fibrosing interstitial lung disease, not only in IPF. Recorded as PARTIAL
      because the study measures telomere and DNA-damage biology in those cells
      rather than testing the activation step itself.

- name: Progressive pulmonary fibrosis
  biological_scale: ORGANISM
  role: consequence
  conforms_to: "fibrotic_response#Architectural Distortion and Organ Dysfunction"
  description: >-
    The shared adverse outcome of the family and the reason its members are
    managed together despite their different lesions. Accumulating matrix
    destroys alveolar architecture, and a subset of every fibrosing entity —
    including entities with an otherwise favourable prognosis — declines on
    symptoms, physiology, and imaging in the way IPF does. The 2022
    ATS/ERS/JRS/ALAT guideline made this a defined, treatable behaviour rather
    than a descriptive impression, and it is behaviour, not the original
    histopathologic label, that then governs antifibrotic therapy.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:35486072
    reference_title: "Idiopathic Pulmonary Fibrosis (an Update) and Progressive Pulmonary Fibrosis in Adults: An Official ATS/ERS/JRS/ALAT Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PPF was defined as at least two of three criteria (worsening symptoms,
      radiological progression, and physiological progression) occurring within
      the past year with no alternative explanation in a patient with an ILD
      other than IPF.
    explanation: >-
      The operational definition of the shared progressive behaviour this node
      models, and the explicit statement that it is recognised in interstitial
      lung diseases other than IPF.
  - reference: PMID:39761948
    reference_title: "Korean Guidelines for Diagnosis and Management of Idiopathic Nonspecific Interstitial Pneumonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antifibrotic agents should be considered in a condition, termed progressive
      pulmonary fibrosis, where pulmonary fibrosis progressively worsens.
    explanation: >-
      Shows the behaviour-based rule being applied to a non-IPF member of the
      family, which is the practical consequence of modelling this outcome at the
      root rather than per entity.
  - reference: PMID:35431170
    reference_title: "Current perspective of progressive-fibrosing interstitial lung disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The definition of PF-ILD includes symptom progression, PFT decline, and
      extension of chest high-resolution computed tomography (HRCT) findings.
    explanation: >-
      Independently states the three-domain composite that operationalises
      progression, corroborating the guideline definition.

phenotypes:
- category: Clinical
  name: Exertional dyspnea
  description: >-
    Breathlessness on exertion is the presenting symptom across the family,
    whether the course is acute (AIP), subacute (COP), or chronic (iNSIP, IPF,
    DIP).
  phenotype_term:
    preferred_term: Dyspnea
    term:
      id: HP:0002094
      label: Dyspnea
  evidence:
  - reference: PMID:39761948
    reference_title: "Korean Guidelines for Diagnosis and Management of Idiopathic Nonspecific Interstitial Pneumonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Usually presenting with respiratory symptoms such as shortness of breath
      and cough, iNSIP has a subacute or chronic course.
    explanation: >-
      Documents dyspnea as the presenting symptom of the chronic fibrosing arm of
      the family.
  - reference: PMID:40078018
    reference_title: "Korean Guidelines for Diagnosis and Management of Interstitial Lung Disease: Cryptogenic Organizing Pneumonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients primarily present with dry cough and dyspnea.
    explanation: >-
      Shows the same presenting symptom in the acute/subacute arm, supporting
      dyspnea as a family-level rather than entity-level phenotype.

- category: Clinical
  name: Chronic dry cough
  description: >-
    A persistent nonproductive cough accompanies the dyspnea in most entities and
    is a major contributor to symptom burden.
  phenotype_term:
    preferred_term: Nonproductive cough
    term:
      id: HP:0031246
      label: Nonproductive cough
  evidence:
  - reference: PMID:40078018
    reference_title: "Korean Guidelines for Diagnosis and Management of Interstitial Lung Disease: Cryptogenic Organizing Pneumonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients primarily present with dry cough and dyspnea.
    explanation: >-
      Names the cough as nonproductive and as one of the two dominant presenting
      symptoms.

- category: Physiological
  name: Restrictive ventilatory defect
  description: >-
    Loss of compliant, ventilated parenchyma produces restrictive physiology with
    reduced lung volumes, the shared functional signature of the family and the
    basis of the FVC endpoint used to define progression.
  phenotype_term:
    preferred_term: Restrictive ventilatory defect
    term:
      id: HP:0002091
      label: Restrictive ventilatory defect
  evidence:
  - reference: PMID:40081337
    reference_title: "Korean Guidelines for the Diagnosis and Management of Interstitial Lung Disease: Other Forms of Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Desquamative interstitial pneumonia, also related to smoking, is
      characterized by exertional dyspnea, dry cough, restrictive lung function,
      and ground-glass opacities on high-resolution CT.
    explanation: >-
      Records restrictive physiology as a defining functional feature, here for
      the desquamative entity.

- category: Radiological
  name: Ground-glass opacification on HRCT
  description: >-
    Hazy increased attenuation that does not obscure the underlying vasculature.
    Prominent in the cellular and smoking-related entities and in iNSIP; in the
    fibrosing entities it is accompanied by reticulation and traction
    bronchiectasis.
  phenotype_term:
    preferred_term: Ground-glass opacification
    term:
      id: HP:0025179
      label: Ground-glass opacification
  evidence:
  - reference: PMID:39761948
    reference_title: "Korean Guidelines for Diagnosis and Management of Idiopathic Nonspecific Interstitial Pneumonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key imaging findings on chest high-resolution computed tomography include
      bilateral reticular opacities in lower lungs, traction bronchiectasis,
      reduced lung volumes and, ground-glass opacities.
    explanation: >-
      Lists the HRCT findings, including ground-glass opacity, that carry the
      radiologic half of the multidisciplinary diagnosis.

- category: Radiological
  name: Interstitial pneumonitis
  description: >-
    Diffuse abnormality of the pulmonary interstitium on imaging and histology —
    the finding that places a patient in this family before the specific pattern
    is assigned.
  phenotype_term:
    preferred_term: Interstitial pneumonitis
    term:
      id: HP:0006515
      label: Interstitial pneumonitis
  evidence:
  - reference: PMID:24032382
    reference_title: "An official American Thoracic Society/European Respiratory Society statement: Update of the international multidisciplinary classification of the idiopathic interstitial pneumonias."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In 2002 the American Thoracic Society/European Respiratory Society
      (ATS/ERS) classification of idiopathic interstitial pneumonias (IIPs)
      defined seven specific entities, and provided standardized terminology and
      diagnostic criteria.
    explanation: >-
      Establishes that these are interstitial pneumonias defined as a bounded set
      of entities under standardized criteria.

- category: Structural
  name: Pulmonary fibrosis
  description: >-
    Irreversible scarring of the lung parenchyma. Universal in the chronic
    fibrosing entities, reached by a subset of the others, and the outcome that
    antifibrotic therapy is directed at.
  phenotype_term:
    preferred_term: Pulmonary fibrosis
    term:
      id: HP:0002206
      label: Pulmonary fibrosis
  evidence:
  - reference: PMID:39761948
    reference_title: "Korean Guidelines for Diagnosis and Management of Idiopathic Nonspecific Interstitial Pneumonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antifibrotic agents should be considered in a condition, termed progressive
      pulmonary fibrosis, where pulmonary fibrosis progressively worsens.
    explanation: >-
      Documents pulmonary fibrosis as an outcome of a non-IPF member of the
      family and as the target of therapy.

- category: Clinical
  name: Acute respiratory failure
  description: >-
    The presentation of acute interstitial pneumonia, and the endpoint of the
    chronic fibrosing entities. Distinguishing new respiratory failure that
    represents AIP from an acute exacerbation of an established fibrotic IIP is a
    routine clinical problem.
  phenotype_term:
    preferred_term: Respiratory failure
    term:
      id: HP:0002878
      label: Respiratory failure
  evidence:
  - reference: PMID:23001802
    reference_title: "Acute interstitial pneumonia (AIP): relationship to Hamman-Rich syndrome, diffuse alveolar damage (DAD), and acute respiratory distress syndrome (ARDS)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute interstitial pneumonia (AIP) is a term used for an idiopathic form of
      acute lung injury characterized clinically by acute respiratory failure
      with bilateral lung infiltrates and histologically by diffuse alveolar
      damage (DAD), a combination of findings previously known as the Hamman-Rich
      syndrome.
    explanation: >-
      States acute respiratory failure as the defining clinical presentation of
      the acute member of the family.

- category: Physiological
  name: Reduced diffusing capacity for carbon monoxide
  description: >-
    Impaired gas transfer across the thickened, remodelled alveolar-capillary
    membrane. The most sensitive physiologic abnormality in the family and
    typically the earliest to fall; a DLCO decline is one of the physiological
    criteria by which progressive pulmonary fibrosis is recognised, so the
    entry's own progression definition is keyed to it.
  phenotype_term:
    preferred_term: Decreased DLCO
    term:
      id: HP:0045051
      label: Decreased DLCO
  evidence:
  - reference: PMID:29367408
    reference_title: "Physiology of the lung in idiopathic pulmonary fibrosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this article we review the profound alterations in lung mechanics
      (reduced lung compliance and lung volumes), pulmonary gas exchange (reduced
      diffusing capacity, increased dead space ventilation, chronic arterial
      hypoxaemia) and airway physiology (increased cough reflex and increased
      airway volume), as well as pulmonary haemodynamics related to IPF.
    explanation: >-
      Places reduced diffusing capacity among the characteristic gas-exchange
      alterations, alongside the reduced lung volumes already curated as
      restrictive physiology. Recorded as PARTIAL because the source characterises
      IPF specifically rather than the whole family, and because it is a narrative
      physiology review rather than a cohort measurement.

- category: Clinical
  name: Bibasilar fine inspiratory crackles
  description: >-
    Fine end-inspiratory crackles at the lung bases, classically likened to
    Velcro. The cardinal auscultatory sign of fibrotic interstitial lung disease
    and often the finding that prompts the first HRCT.
  phenotype_term:
    preferred_term: Crackles
    term:
      id: HP:0030830
      label: Crackles
  evidence:
  - reference: PMID:30853366
    reference_title: "Evaluation and management of Idiopathic Pulmonary Fibrosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Crucial physical findings are scalene muscle hypertrophy, bibasilar fine
      crackles, and finger clubbing.
    explanation: >-
      Names bibasilar fine crackles as a crucial physical finding. Recorded as
      PARTIAL because the source describes idiopathic pulmonary fibrosis rather
      than every member of the family; the sign is far less prominent in the
      acute and organizing entities.

- category: Clinical
  name: Digital clubbing
  description: >-
    Bulbous enlargement of the distal phalanges with increased nail-bed
    fluctuance. Common in the chronic fibrosing entities and largely absent from
    the acute and organizing ones, so its presence is a weak pointer towards a
    fibrosing pattern rather than a family-wide sign.
  phenotype_term:
    preferred_term: Clubbing of fingers
    term:
      id: HP:0100759
      label: Clubbing of fingers
  evidence:
  - reference: PMID:30853366
    reference_title: "Evaluation and management of Idiopathic Pulmonary Fibrosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Crucial physical findings are scalene muscle hypertrophy, bibasilar fine
      crackles, and finger clubbing.
    explanation: >-
      Names finger clubbing as a crucial physical finding, which is why the more
      specific "Clubbing of fingers" term is used rather than the general
      Clubbing term. Recorded as PARTIAL because the source characterises
      idiopathic pulmonary fibrosis rather than the whole family. No frequency is
      asserted: the commonly quoted 25-50% figure does not appear in any source
      cached for this entry, and a frequency band needs its own evidence.

environmental:
- name: Cigarette smoking
  description: >-
    The one exposure that is an accepted driver of specific members of this
    family rather than an exclusion criterion. RB-ILD and DIP occur almost
    exclusively in smokers, which is why they retain the "idiopathic" label only
    by historical convention and are managed with an exposure intervention.
  exposure_term:
    preferred_term: exposure to cigarette smoking
    term:
      id: ECTO:0100003
      label: exposure to cigarette smoking
  evidence:
  - reference: PMID:40081337
    reference_title: "Korean Guidelines for the Diagnosis and Management of Interstitial Lung Disease: Other Forms of Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Desquamative interstitial pneumonia, also related to smoking, is
      characterized by exertional dyspnea, dry cough, restrictive lung function,
      and ground-glass opacities on high-resolution CT.
    explanation: >-
      Confirms that the exposure drives a second member of the family, not only
      respiratory bronchiolitis-interstitial lung disease.
  influences_mechanisms:
  - target: Bronchiolocentric pigmented macrophage accumulation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Tobacco smoke is the proximate cause of the pigmented-macrophage lesion
      that defines the smoking-related arm of the classification.
    evidence:
    - reference: PMID:40081337
      reference_title: "Korean Guidelines for the Diagnosis and Management of Interstitial Lung Disease: Other Forms of Interstitial Lung Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Respiratory bronchiolitis-associated ILD mainly affects smokers, showing
        ground-glass opacities on chest computed tomography (CT) scans and
        pigmented macrophages in the bronchoalveolar lavage fluid.
      explanation: >-
        Links the exposure directly to the macrophage lesion this edge targets.

diagnosis:
- name: Multidisciplinary discussion
  description: >-
    The diagnostic standard for the family since 2002. Pulmonology, radiology,
    and pathology (with rheumatology where autoimmunity is in question) integrate
    clinical history, HRCT, and — when obtained — tissue, and it is this
    integrated assignment, not histology alone, that names the entity.
  evidence:
  - reference: PMID:24032382
    reference_title: "An official American Thoracic Society/European Respiratory Society statement: Update of the international multidisciplinary classification of the idiopathic interstitial pneumonias."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition, the historical "gold standard" of histologic diagnosis was
      replaced by a multidisciplinary approach.
    explanation: >-
      The statement that displaced histology as the sole arbiter in favour of
      multidisciplinary diagnosis.
  notes: >-
    NEEDS TERM (NTR candidate). NCIT has no clinical-action term for
    multidisciplinary discussion as a diagnostic procedure; the nearest concepts
    are organizational (multidisciplinary team, tumor board) rather than the
    diagnostic act itself. The free-text preferred_term is therefore deliberate,
    not an omission. The other two diagnosis entries here are bound
    (NCIT:C20644, NCIT:C51748).

- name: High-resolution computed tomography of the chest
  diagnosis_term:
    preferred_term: High-resolution computed tomography of the chest
    term:
      id: NCIT:C20644
      label: High Resolution Computed Tomography
  description: >-
    Carries the radiologic half of the diagnosis and, in the fibrosing entities,
    can establish a definite or probable UIP pattern without biopsy. Also
    supplies one of the three domains of the progressive-pulmonary-fibrosis
    definition.
  evidence:
  - reference: PMID:39761948
    reference_title: "Korean Guidelines for Diagnosis and Management of Idiopathic Nonspecific Interstitial Pneumonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key imaging findings on chest high-resolution computed tomography include
      bilateral reticular opacities in lower lungs, traction bronchiectasis,
      reduced lung volumes and, ground-glass opacities.
    explanation: >-
      Documents HRCT as the modality that supplies the pattern-defining findings.

- name: Lung tissue sampling
  diagnosis_term:
    preferred_term: Lung biopsy
    term:
      id: NCIT:C51748
      label: Lung Biopsy
  description: >-
    Reserved for cases the clinical and radiologic picture leaves indeterminate.
    Surgical lung biopsy was the traditional route; transbronchial lung
    cryobiopsy is now an accepted alternative where the expertise exists.
  evidence:
  - reference: PMID:35486072
    reference_title: "Idiopathic Pulmonary Fibrosis (an Update) and Progressive Pulmonary Fibrosis in Adults: An Official ATS/ERS/JRS/ALAT Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A conditional recommendation was made to regard transbronchial lung
      cryobiopsy as an acceptable alternative to surgical lung biopsy in centers
      with appropriate expertise.
    explanation: >-
      The current guideline position on how tissue is obtained when it is needed.

treatments:
- name: Systemic corticosteroid therapy
  description: >-
    First-line for the inflammatory and organizing entities — COP above all, and
    LIP — where the lesion is cellular and the alveolar scaffold is intact.
    Deliberately not a family-wide recommendation: the same therapy does not
    benefit the chronic fibrosing entities, which is one practical reason the IIP
    root cannot be treated as a single disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
  target_mechanisms:
  - target: Organizing pneumonia pattern with intra-alveolar granulation tissue
    treatment_effect: INHIBITS
    description: >-
      Corticosteroids suppress the fibroblastic organizing lesion while the
      alveolar architecture is still intact, allowing it to resolve.
    evidence:
    - reference: PMID:41513514
      reference_title: "Organizing Pneumonia Phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The hallmark pathological features are presence of polypoid granulation
        tissue, or Masson bodies, in the alveolar spaces, with lung architecture
        preserved in most patients with good clinical outcomes poststeroid
        treatment.
      explanation: >-
        Ties the good post-steroid outcome directly to the intra-alveolar
        granulation-tissue lesion this treatment targets.
  evidence:
  - reference: PMID:40967604
    reference_title: "Cryptogenic Organizing Pneumonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A defining feature of COP is steroid-responsiveness, and most experts
      recommend prolonged corticosteroid courses (6-12 months).
    explanation: >-
      Establishes steroid responsiveness as definitional for the organizing
      entity and gives the treatment duration.
  - reference: PMID:40081337
    reference_title: "Korean Guidelines for the Diagnosis and Management of Interstitial Lung Disease: Other Forms of Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymphoid interstitial pneumonia involves lymphocytic proliferation and is
      associated with autoimmune diseases or infections, treated with
      corticosteroids.
    explanation: >-
      Extends the same therapy to the lymphoid entity, the other cellular member
      of the family.

- name: Smoking cessation
  description: >-
    First-line and potentially disease-modifying for RB-ILD and DIP. The only
    intervention in the family that removes a driver rather than modulating a
    response, and the reason the smoking-related entities are separated out.
    NCIT has no clinical-intervention term for smoking cessation — NCIT:C17427 is
    classified under Behavior, not under Clinical Intervention or Procedure — so
    the action is left as free text rather than bound to an unreachable term.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: smoking cessation
  target_mechanisms:
  - target: Bronchiolocentric pigmented macrophage accumulation
    treatment_effect: INHIBITS
    description: >-
      Removing the exposure removes the stimulus for the pigmented-macrophage
      accumulation that constitutes the lesion.
    evidence:
    - reference: PMID:40081337
      reference_title: "Korean Guidelines for the Diagnosis and Management of Interstitial Lung Disease: Other Forms of Interstitial Lung Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Respiratory bronchiolitis-associated ILD mainly affects smokers, showing
        ground-glass opacities on chest computed tomography (CT) scans and
        pigmented macrophages in the bronchoalveolar lavage fluid.
      explanation: >-
        Establishes the smoking-to-macrophage-lesion link that makes removing the
        exposure a mechanism-directed intervention on this node.
  evidence:
  - reference: PMID:40081337
    reference_title: "Korean Guidelines for the Diagnosis and Management of Interstitial Lung Disease: Other Forms of Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Smoking cessation is essential for treatment, with corticosteroids used for
      severe cases.
    explanation: >-
      States smoking cessation as the essential treatment for the smoking-related
      arm, with steroids reserved for severe disease.

- name: Nintedanib for progressive pulmonary fibrosis
  description: >-
    Antifibrotic tyrosine kinase inhibitor. Recommended for interstitial lung
    disease other than IPF that meets the progressive-pulmonary-fibrosis
    criteria, so the indication is keyed to observed disease behaviour rather
    than to the original histopathologic label.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: nintedanib
      term:
        id: CHEBI:85164
        label: nintedanib
  target_mechanisms:
  - target: Progressive pulmonary fibrosis
    treatment_effect: INHIBITS
    description: >-
      Nintedanib slows the fibrotic progression that defines the PPF behaviour,
      without reversing established fibrosis.
    evidence:
    - reference: PMID:35486072
      reference_title: "Idiopathic Pulmonary Fibrosis (an Update) and Progressive Pulmonary Fibrosis in Adults: An Official ATS/ERS/JRS/ALAT Clinical Practice Guideline."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A conditional recommendation was made for nintedanib, and additional
        research into pirfenidone was recommended.
      explanation: >-
        The recommendation is made for the progressive-pulmonary-fibrosis
        behaviour that this target node models.
  evidence:
  - reference: PMID:35486072
    reference_title: "Idiopathic Pulmonary Fibrosis (an Update) and Progressive Pulmonary Fibrosis in Adults: An Official ATS/ERS/JRS/ALAT Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A conditional recommendation was made for nintedanib, and additional
      research into pirfenidone was recommended.
    explanation: >-
      The guideline recommendation that attaches antifibrotic therapy to the
      progressive-fibrosis behaviour rather than to a single entity.

- name: Supportive care
  description: >-
    The mainstay for acute interstitial pneumonia, where no therapy has been
    shown to alter the course, and a component of care across the family
    (supplemental oxygen when hypoxemic, symptom-directed and palliative
    measures). Pulmonary rehabilitation, previously named only inside this
    description, is now curated as its own treatment.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:40081337
    reference_title: "Korean Guidelines for the Diagnosis and Management of Interstitial Lung Disease: Other Forms of Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute interstitial pneumonia resembles acute respiratory distress syndrome
      but occurs without a clear cause and is managed with supportive care.
    explanation: >-
      States supportive care as the management of the acute entity, in the
      absence of a disease-modifying option.

- name: Pulmonary rehabilitation
  description: >-
    Structured supervised exercise training and education. Applies across the
    family rather than to one entity, and is also the standard preparation for
    transplant candidates. The functional and quality-of-life benefit is
    established; a survival benefit is suggested at five years but is not
    settled, and the entry does not claim one.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:39805518
    reference_title: "Impact of Pulmonary Rehabilitation on Survival in People With Interstitial Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pulmonary rehabilitation (PR) is a beneficial intervention for people with
      interstitial lung disease (ILD); however, the effect of PR on survival is
      unclear.
    explanation: >-
      States both the established benefit and the explicit limit of the evidence,
      which is why this entry claims function and quality of life but not
      survival.
  - reference: PMID:39805518
    reference_title: "Impact of Pulmonary Rehabilitation on Survival in People With Interstitial Lung Disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Participation in PR among people with ILD may impact survival at 5 years.
    explanation: >-
      The hedged survival signal from a pooled analysis of two randomized trials.
      Recorded as PARTIAL because the unadjusted comparison was not significant
      and no difference remained at ten years.

- name: Lung transplantation
  description: >-
    The only intervention that replaces the fibrotic lung rather than slowing its
    remodelling, and the definitive therapy for advanced fibrotic disease across
    this family rather than for one entity. Curated here rather than delegated to
    the IPF entry for exactly that reason. Access is limited by donor supply and
    by late referral, so timing of referral is itself a management decision.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Progressive pulmonary fibrosis
    treatment_effect: BYPASSES
    description: >-
      Transplantation does not act on the fibrotic mechanism at all; it removes
      the diseased organ, so the causal chain modelled here is bypassed rather
      than inhibited. BYPASSES is used deliberately in preference to INHIBITS,
      which would misstate the mechanism.
    evidence:
    - reference: PMID:40365094
      reference_title: "Lung transplantation for interstitial lung disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Interstitial lung diseases (ILDs) are now the most common indication for
        lung transplant internationally.
      explanation: >-
        Establishes that transplantation is directed at this disease family as a
        whole, which is what justifies attaching it to the shared
        progressive-fibrosis node rather than to a single entity.
  evidence:
  - reference: PMID:40365094
    reference_title: "Lung transplantation for interstitial lung disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite this increase many patients with ILD who would potentially benefit
      from lung transplant are either not referred or referred too late.
    explanation: >-
      Documents late referral as the practical limiting factor, supporting the
      description's emphasis on referral timing as a management decision.
  - reference: PMID:40365094
    reference_title: "Lung transplantation for interstitial lung disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unfortunately, the number of potential lung transplant recipients exceeds
      available donor organs and some patients will die without transplant.
    explanation: >-
      Documents the donor-supply constraint that bounds this therapy's reach.

discussions:
- discussion_id: disc_iip_unclassifiable_mixed_patterns
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    A substantial minority of patients cannot be assigned to any of the defined
    IIP entities because their lungs show mixed patterns of injury. Are these
    genuinely distinct disease processes awaiting definition, or does the
    pattern-based classification impose discrete boundaries on what is really a
    continuum of injury responses?
  attaches_to:
  - pathophysiology#Resolution of injury into a stereotyped histopathologic pattern
  rationale: >-
    The entire classification rests on the premise that the injured lung adopts
    one of a small number of discrete patterns. The 2013 ATS/ERS update records
    that a substantial percentage of patients defeat that premise, usually
    because more than one pattern is present in the same lung. This matters for
    a knowledge base: if the mixed cases are a continuum rather than a set of
    undiscovered entities, then the pattern nodes modelled here are convenient
    landmarks on a spectrum rather than mutually exclusive states, and a curated
    entry should not imply that a patient occupies exactly one of them.
  evidence:
  - reference: PMID:24032382
    reference_title: "An official American Thoracic Society/European Respiratory Society statement: Update of the international multidisciplinary classification of the idiopathic interstitial pneumonias."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A substantial percentage of patients with IIP are difficult to classify,
      often due to mixed patterns of lung injury.
    explanation: >-
      The classification's own authors record the limitation this gap is about.

- discussion_id: disc_iip_behaviour_vs_pattern_classification
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Should an idiopathic interstitial pneumonia be classified by its
    histopathologic pattern or by its observed disease behaviour? The two axes
    disagree for the entities whose clinical course is heterogeneous, and
    antifibrotic therapy is now indicated on the behaviour axis while the entity
    name still comes from the pattern axis.
  attaches_to:
  - pathophysiology#Progressive pulmonary fibrosis
  - pathophysiology#Resolution of injury into a stereotyped histopathologic pattern
  rationale: >-
    The 2013 update proposed a behaviour-based classification precisely for the
    patients and entities the pattern-based scheme handles badly, and the 2022
    guideline then defined progressive pulmonary fibrosis as a behaviour that
    cuts across entities and carries its own treatment recommendation. The result
    is a family whose members are named on one axis and treated on another. Which
    axis a mechanism knowledge base should treat as primary is unresolved, and
    the answer determines whether progressive pulmonary fibrosis is modelled as a

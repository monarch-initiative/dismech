- accession: geo:GSE227835
  title: Single-cell RNA-seq data of human PBMC from Myasthenia Gravis patients
  description: Myasthenia Gravis (MG) is a chronic autoimmune disorder characterized by severe muscle weakness. However, the seronegative MG patient subgroup, which accounts for about 15% of MG patients, remains challenging diagnosis, and the immunopathology is understudied. Therefore, we performed single-cell RNA-sequencing analysis by peripheral blood and plasma proteome analysis for the seronegative MG patients. Numerical abnormalities were observed in multiple immune cells including B-cells compared to healthy controls (HC) and correlated with disease activities.

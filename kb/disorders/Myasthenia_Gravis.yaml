name: Myasthenia Gravis
creation_date: '2025-12-19T01:12:52Z'
description: >-
  Myasthenia gravis is an autoimmune disorder in which autoantibodies, most commonly against the acetylcholine receptor, target the postsynaptic neuromuscular junction.
  Antibody binding triggers receptor internalization and classical complement activation with membrane attack complex formation, destroying postsynaptic membrane and impairing neuromuscular transmission.
  The result is fatigable skeletal muscle weakness, and thymic hyperplasia or thymoma is frequently implicated as a site of autoimmunization.
category: Autoimmune
parents:
- Neuromuscular Disease
- Autoimmune Disease

- accession: geo:GSE182038
  title: Elevated N-linked glycosylation of IgG variable regions in myasthenia gravis disease subtypes
  description: Elevated N-linked glycosylation of immunoglobulin G variable regions (IgG-VN-Glyc) is an emerging molecular phenotype associated with autoimmune disorders. To test the broader specificity of elevated IgG-VN-Glyc, we studied patients with distinct subtypes of myasthenia gravis (MG), a B cell-mediated autoimmune disease. Our experimental design included adaptive immune receptor repertoire sequencing to quantify and characterize N-glycosylation sites in the global B cell receptor repertoire, proteomics to examine glycosylation patterns of the circulating IgG, and production of human-derived recombinant autoantibodies, which were studied with mass spectrometry and antigen binding assays to confi...

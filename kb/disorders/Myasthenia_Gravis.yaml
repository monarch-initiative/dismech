- accession: ega:EGAS00001003462
  title: Whole genome sequencing of 25 South African individuals with myasthenia gravis
  description: This study investigated the genetic basis of an ophthalmoplegic subphenotype of MG (OP-MG) which occurs in a proportion of myasthenics with juvenile symptom onset and African genetic ancestry. This OP-MG subphenotype is characterised by treatment resistant weakness of the extraocular muscles (EOMs) and the pathogenetic mechanism(s) underlying its development is unknown. The aim of this study was to use a hypothesis-generating genome-wide case-control analysis to identify candidate OP-MG susceptibility genes and pathways.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:30881381
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Myasthenia Gravis"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: dbgap:phs000726
  title: Genome-wide Association Study of Myasthenia Gravis
  description:  The purpose of this project was to conduct a genome-wide associate study to search for the genetic factors that predispose to myasthenia gravis. The rationale for this study lies in the fact that, although the immunological and physiological processes affecting the neuromuscular junctions of myasthenia gravis patients are well understood, the spectrum of genetic factors that predispose to myasthenia gravis and influence its disease manifestations are not well known.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from dbgap. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Myasthenia Gravis"). Retrieved 2026-08-02.

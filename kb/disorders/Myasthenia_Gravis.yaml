environmental:
- name: Infections
  exposure_term:
    preferred_term: Infectious agent exposure
    term:
      id: ECTO:3000000
      label: exposure to organism
  notes: May trigger or exacerbate disease, and is the single most common identified
    precipitant of myasthenic crisis. No specific pathogen has been established.
  evidence:
  - reference: PMID:9153452
    reference_title: "Myasthenic crisis: clinical features, mortality, complications, and risk factors for prolonged intubation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infection (usually pneumonia or upper respiratory infection) was the most common precipitating factor (38%), followed by no obvious cause (30%) and aspiration (10%)"
    explanation: "Retrospective review of 73 myasthenic crisis episodes over twelve years. Quantifies infection as the leading identified precipitant."
  - reference: PMID:29372387
    reference_title: "Myasthenia gravis and infectious disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MG can be triggered and worsened by infections. No virus or other pathogen has been proven to have a specific link to MG"
    explanation: "Review supporting both halves of the note: infection as trigger and as exacerbant, together with the negative finding that no specific organism is established. The second sentence is the reason this entry is not narrowed to a named pathogen."
- name: Medications
  exposure_term:
    preferred_term: medication exposure
    term:
      id: ECTO:0000509
      label: exposure to drug
  notes: Drugs that interfere with neuromuscular transmission may worsen disease.
    Fluoroquinolones are the best-evidenced example, including positive rechallenge.
  review_notes: The prior note named aminoglycosides and beta-blockers. Both are
    long-standing clinical convention and appear on avoid-lists, but no source was
    found whose abstract states either association directly, so the note now leads
    with the agent class that is evidenced rather than asserting an unsourced drug
    list. Aminoglycosides and beta-blockers should be reinstated by name if and when
    a citable source is found; their omission here is an evidence gap, not a
    judgement that the association is wrong.
  evidence:
  - reference: PMID:21879778
    reference_title: "Fluoroquinolone-associated myasthenia gravis exacerbation: evaluation of postmarketing reports from the US FDA adverse event reporting system and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six patients (16%) experienced a positive rechallenge, with recurrent myasthenia gravis exacerbation after fluoroquinolone reintroduction"
    explanation: "Analysis of 37 cases from the US FDA adverse event reporting system and the literature. Rechallenge is quoted in preference to the raw case count because recurrence on reintroduction is what distinguishes a drug effect from coincident deterioration in a relapsing disease."
  - reference: PMID:29372387
    reference_title: "Myasthenia gravis and infectious disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infections should be actively treated, but a few antibiotics are avoided due to potential interference with neuromuscular transmission"
    explanation: "Supports the general mechanism named in the note - interference with neuromuscular transmission - and the clinical practice of avoiding particular antibiotics. It does not name which agents, which is why the note does not either."
- name: Stress
  exposure_term:
    preferred_term: psychological stress
    term:
      id: XCO:0001265
      label: stress
  notes: Physical or emotional stress can trigger exacerbations
  review_notes: Left deliberately uncited. Targeted PubMed searches (stress
    precipitating myasthenic exacerbation; psychological stress and myasthenia
    gravis onset; patient-reported trigger factors) returned no study whose
    abstract states this claim directly. Note that the largest crisis-precipitant
    series cited on the Infections entry records no obvious cause in 30 percent of
    episodes rather than attributing them to stress. Per the evidence SOP the claim
    is kept as a note rather than attached to an approximately-relevant citation.
- name: Pregnancy
  notes: Variable effects on disease course, with the risk concentrated after
    delivery rather than during gestation.
  review_notes: Left without an exposure_term. ECTO was searched and carries no
    pregnancy exposure class; the near matches are CHEBI chemical terms, which would
    not validate against the exposure-term enum. Per the term-curation rule that no
    term beats a bad one, this stays unbound rather than being forced onto an
    approximate class.
  evidence:
  - reference: PMID:42127347
    reference_title: "Risk of Myasthenia Gravis Exacerbation During Pregnancy and Postpartum: A Nationwide Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During pregnancy, women were not more likely to be hospitalized for MG than in the prepregnancy year"
    explanation: "Population study of 112 women and 176 singleton pregnancies. The same abstract reports a roughly fivefold increase in prolonged MG admissions in the first three months postpartum, sustained across the first twelve months, so the variability the note describes is directional rather than random: gestation itself was not associated with more hospitalization, the postpartum period was."
treatments:
- name: Acetylcholinesterase Inhibitors
  description: First-line symptomatic treatment (pyridostigmine).
  treatment_term:
    preferred_term: acetylcholinesterase inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acetylcholinesterase inhibitor
      term:
        id: NCIT:C47792
        label: Acetylcholinesterase Inhibitor
  evidence:
  - reference: PMID:36184373
    reference_title: "The effectiveness and side effects of pyridostigmine in the treatment of myasthenia gravis: a cross-sectional study."
    supports: SUPPORT
    snippet: "Patients reported a median effectiveness of 60, IQR 28-78 and net benefit of 65, IQR 45-84."
    explanation: Large cross-sectional study demonstrates patient-reported effectiveness of pyridostigmine.
  - reference: PMID:36184373
    reference_title: "The effectiveness and side effects of pyridostigmine in the treatment of myasthenia gravis: a cross-sectional study."
    supports: SUPPORT
    snippet: "Of all patients currently using pyridostigmine, 91% reported side effects (vs. 55% in the control group)."
    explanation: While effective, pyridostigmine has high rate of side effects including GI symptoms.
  target_mechanisms:
  - target: Autoantibody-Mediated NMJ Dysfunction
    treatment_effect: MODULATES
    description: >-
      Pyridostigmine inhibits acetylcholinesterase at the neuromuscular junction,
      prolonging ACh availability and partially compensating for the reduced AChR
      density caused by autoantibody-mediated receptor internalization and complement
      destruction.
- name: Corticosteroids
  description: Prednisone for immunosuppression, mainstay of therapy.
  treatment_term:
    preferred_term: corticosteroid agent therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
  target_mechanisms:
  - target: Autoantibody-Mediated NMJ Dysfunction
    treatment_effect: INHIBITS
    description: >-
      Corticosteroids suppress the autoimmune B and T cell responses that drive
      AChR autoantibody production, progressively reducing the antibody burden
      at the neuromuscular junction.
  - target: Thymic Abnormalities
    treatment_effect: INHIBITS
    description: >-
      Corticosteroids suppress thymic inflammation and lymphoproliferation,
      dampening the autoreactive T cell activation that originates in the thymus.
- name: Thymectomy
  description: Surgical removal of thymus, improves outcomes in appropriate patients.
  treatment_term:
    preferred_term: thymectomy
    term:
      id: NCIT:C29894
      label: Thymectomy
  evidence:
  - reference: PMID:27509100
    reference_title: "Randomized Trial of Thymectomy in Myasthenia Gravis."
    supports: SUPPORT
    snippet: "Patients who underwent thymectomy had a lower time-weighted average Quantitative Myasthenia Gravis score over a 3-year period than those who received prednisone alone (6.15 vs. 8.99, P<0.001)"
    explanation: Landmark randomized trial demonstrates thymectomy improves clinical outcomes in nonthymomatous MG.
  - reference: PMID:27509100
    reference_title: "Randomized Trial of Thymectomy in Myasthenia Gravis."
    supports: SUPPORT
    snippet: "Fewer patients in the thymectomy group than in the prednisone-only group required immunosuppression with azathioprine (17% vs. 48%, P<0.001) or were hospitalized for exacerbations (9% vs. 37%, P<0.001)."
    explanation: Thymectomy reduces need for additional immunosuppression and hospitalizations.
  target_mechanisms:
  - target: Thymic Abnormalities
    treatment_effect: INHIBITS
    description: >-
      Thymectomy removes the hyperplastic or thymomatous thymus that harbors
      the autoreactive T cells and AChR-expressing myoid cells that initiate and
      sustain the AChR autoimmune response.
- name: Azathioprine
  description: Steroid-sparing immunosuppressant.
  treatment_term:
    preferred_term: immune suppressant agent therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
  target_mechanisms:
  - target: Autoantibody-Mediated NMJ Dysfunction
    treatment_effect: INHIBITS
    description: >-
      Azathioprine, a purine antimetabolite, suppresses lymphocyte proliferation,
      reducing autoreactive B and T cell populations and thereby lowering AChR
      autoantibody production at the neuromuscular junction.
- name: Mycophenolate Mofetil
  description: Alternative immunosuppressant.
  treatment_term:
    preferred_term: immune suppressant agent therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
  target_mechanisms:
  - target: Autoantibody-Mediated NMJ Dysfunction
    treatment_effect: INHIBITS
    description: >-
      Mycophenolate mofetil inhibits inosine monophosphate dehydrogenase,
      selectively suppressing lymphocyte proliferation and reducing AChR
      autoantibody production.
- name: Rituximab
  description: Anti-CD20 antibody, effective in refractory cases.
  treatment_term:
    preferred_term: immune suppressant agent therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
  target_mechanisms:
  - target: Autoantibody-Mediated NMJ Dysfunction
    treatment_effect: INHIBITS
    description: >-
      Rituximab depletes CD20+ B cells and plasmablasts, reducing the pool of
      antibody-secreting cells and lowering AChR (or MuSK) autoantibody titers
      that mediate NMJ dysfunction.
- name: Eculizumab
  description: Complement inhibitor (anti-C5), approved for refractory AChR+ MG.
  treatment_term:
    preferred_term: complement 5 inhibitor agent therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: complement inhibitor
      term:
        id: NCIT:C199456
        label: Complement Inhibitor
  evidence:
  - reference: PMID:29066163
    reference_title: "Safety and efficacy of eculizumab in anti-acetylcholine receptor antibody-positive refractory generalised myasthenia gravis (REGAIN): a phase 3, randomised, double-blind, placebo-controlled, multicentre study."
    supports: SUPPORT
    snippet: "Results from a phase 2 study suggested that eculizumab, a terminal complement inhibitor, produced clinically meaningful improvements in patients with anti-acetylcholine receptor antibody-positive refractory generalised myasthenia gravis."
    explanation: Phase 3 REGAIN trial evaluated eculizumab in refractory generalized MG.
  - reference: PMID:29066163
    reference_title: "Safety and efficacy of eculizumab in anti-acetylcholine receptor antibody-positive refractory generalised myasthenia gravis (REGAIN): a phase 3, randomised, double-blind, placebo-controlled, multicentre study."
    supports: SUPPORT
    snippet: "Myasthenia gravis exacerbations were reported by six (10%) patients in the eculizumab group and 15 (24%) in the placebo group."
    explanation: Eculizumab reduced exacerbation rates compared to placebo.
  target_mechanisms:
  - target: Complement Activation
    treatment_effect: INHIBITS
    description: >-
      Eculizumab is a monoclonal antibody that binds complement component C5,
      blocking cleavage to C5a and C5b and preventing membrane attack complex
      formation at the neuromuscular junction.
- name: Plasma Exchange
  description: Rapid removal of antibodies, used for myasthenic crisis.
  evidence:
  - reference: PMID:21674519
    reference_title: "Anti-MuSK antibody myasthenia gravis: clinical findings and response to treatment in two large cohorts."
    supports: SUPPORT
    snippet: "Plasma exchange (PLEX) produced improvement in 93%, whereas only 61% improved after intravenous immunoglobulin."
    explanation: Plasma exchange is highly effective, particularly in MuSK-MG where it outperforms IVIG.
  target_mechanisms:
  - target: Autoantibody-Mediated NMJ Dysfunction
    treatment_effect: INHIBITS
    description: >-
      Plasma exchange physically removes circulating AChR and MuSK autoantibodies
      from the bloodstream, rapidly reducing the antibody burden at the
      neuromuscular junction.
- name: Intravenous Immunoglobulin
  description: Immunomodulation, used for exacerbations and crisis.
  target_mechanisms:
  - target: Autoantibody-Mediated NMJ Dysfunction
    treatment_effect: INHIBITS
    description: >-
      IVIG modulates autoantibody activity via Fc receptor saturation and
      complement inhibition, reducing the effective titer of pathogenic AChR
      autoantibodies at the neuromuscular junction.
- name: Efgartigimod
  description: FcRn antagonist approved for generalized AChR-positive MG; reduces pathogenic IgG levels by blocking neonatal Fc receptor recycling.
  treatment_term:
    preferred_term: FcRn antagonist therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:37602255
    reference_title: "FcRN receptor antagonists in the management of myasthenia gravis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Efgartigimod is already approved for the treatment of generalized MG"
    explanation: Review confirms FDA approval of efgartigimod for generalized MG.
  - reference: PMID:37602255
    reference_title: "FcRN receptor antagonists in the management of myasthenia gravis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      FcRn receptors prevent the catabolism of IgG by impeding their lysosomal
      degradation and facilitating their extracellular release at physiological
      pH, consequently extending the IgG half-life.
    explanation: >
      The research synthesis emphasized FcRn biology; this evidence links the
      treatment assertion to its mechanism of lowering pathogenic IgG.
  target_mechanisms:
  - target: Autoantibody-Mediated NMJ Dysfunction
    treatment_effect: INHIBITS
    description: >-
      Efgartigimod blocks the neonatal Fc receptor (FcRn), preventing IgG
      recycling and accelerating catabolism of pathogenic AChR autoantibodies,
      thereby reducing the antibody burden at the neuromuscular junction.
- name: Rozanolixizumab
  description: >-
    Subcutaneous FcRn antagonist for generalized myasthenia gravis in adults
    who are anti-AChR or anti-MuSK antibody positive; reduces pathogenic IgG
    via neonatal Fc receptor blockade.
  treatment_term:
    preferred_term: FcRn antagonist therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:37059507
    reference_title: "Safety and efficacy of rozanolixizumab in patients with generalised myasthenia gravis (MycarinG): a randomised, double-blind, placebo-controlled, adaptive phase 3 study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We enrolled patients (aged ≥18 years) with acetylcholine receptor (AChR) or muscle-specific kinase (MuSK) autoantibody-positive generalised myasthenia gravis"
    explanation: The registrational phase 3 trial enrolled both anti-AChR and anti-MuSK antibody-positive generalized MG, which is the population the treatment is indicated for.
  - reference: PMID:37059507
    reference_title: "Safety and efficacy of rozanolixizumab in patients with generalised myasthenia gravis (MycarinG): a randomised, double-blind, placebo-controlled, adaptive phase 3 study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rozanolixizumab showed clinically meaningful improvements in patient-reported and investigator-assessed outcomes in patients with generalised myasthenia gravis, for both 7 mg/kg and 10 mg/kg doses."
    explanation: Phase 3 efficacy result supporting rozanolixizumab as an active treatment for generalized MG.
  - reference: PMID:37602255
    reference_title: "FcRN receptor antagonists in the management of myasthenia gravis"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "rozanolixizumab is under review by health authorities"
    explanation: Historical regulatory context only - this 2023 review predates approval; the drug has since been approved for generalized MG, so this quote no longer describes current status.
  target_mechanisms:
  - target: Autoantibody-Mediated NMJ Dysfunction
    treatment_effect: INHIBITS
    description: >-
      Rozanolixizumab blocks FcRn to accelerate IgG catabolism, reducing
      circulating AChR autoantibody levels and lessening antibody-mediated
      disruption of neuromuscular transmission.

    frequently mutated gene in hypertrophic cardiomyopathy and the defining gene of
    this MONDO entity. ClinGen's Hereditary Cardiovascular Disease Gene Curation
    Expert Panel rates the gene-disease relationship Definitive with autosomal
    dominant inheritance; biallelic loss additionally produces the severe neonatal
    form.

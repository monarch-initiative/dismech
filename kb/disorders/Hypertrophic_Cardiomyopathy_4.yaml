phenotypes:
- name: Hypertrophic Cardiomyopathy
  category: Cardiovascular
  description: >-
    Unexplained ventricular hypertrophy is the defining feature. In heterozygous
    carriers hypertrophy is typically discrete (mean maximal wall thickness
    ~17.5 mm in probands, ~14.6 mm in affected relatives); in biallelic neonates
    it is severe from the outset.
  phenotype_term:
    preferred_term: Hypertrophic cardiomyopathy
    term:
      id: HP:0001639
      label: Hypertrophic cardiomyopathy
  frequency: OBLIGATE
  evidence:
  - reference: PMID:39581692
    reference_title: "Hypertrophic cardiomyopathy due to truncating variants in myosin binding protein C: a Spanish cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypertrophy was discrete with a significative difference between probands
      and relatives (17.5±4 mm vs 14.6±5 mm; p<0.0001).
    explanation: >-
      Documents the hypertrophy magnitude in a molecularly homogeneous truncating
      MYBPC3 cohort.
  - reference: PMID:36162733
    reference_title: "The «Amish» NM_000256.3:c.3330+2T>G splice variant in MYBPC3 associated with hypertrophic cardiomyopathy is an ancient Swiss mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MYBPC3 is the most frequently mutated gene in hypertrophic cardiomyopathy
      (HCM).
    explanation: >-
      Confirms the gene-disease association that defines this entity.
- name: Asymmetric Septal Hypertrophy
  category: Cardiovascular
  description: >-
    Asymmetric septal thickening is the most common hypertrophy pattern, but MYBPC3
    carriers show substantial heterogeneity of pattern even within a single family
    carrying one variant - concentric, apical and eccentric patterns all occur, and
    some carriers have no hypertrophy at all.
  phenotype_term:
    preferred_term: Asymmetric septal hypertrophy
    term:
      id: HP:0001670
      label: Asymmetric septal hypertrophy
  subtype: Monoallelic CMH4
  evidence:
  - reference: PMID:22267749
    reference_title: "Cardiac myosin binding protein-C mutations in families with hypertrophic cardiomyopathy: disease expression in relation to age, gender, and long term outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pattern of hypertrophy (11 none, 9 asymmetrical, 3 concentric, 1 apical, 1
      eccentric)
    explanation: >-
      Enumerates the hypertrophy patterns observed among R502W MYBPC3 carriers,
      with asymmetrical the most frequent among those with hypertrophy.
- name: Left Ventricular Outflow Tract Obstruction
  category: Cardiovascular
  description: >-
    Hypercontractility with septal hypertrophy generates a dynamic pressure
    gradient across the left ventricular outflow tract in a subset of patients,
    driving exertional symptoms and defining the obstructive phenotype targeted by
    myosin inhibitors and septal reduction therapy.
  phenotype_term:
    preferred_term: Left ventricular outflow tract obstruction
    term:
      id: HP:0032092
      label: Left ventricular outflow tract obstruction
  evidence:
  - reference: PMID:32871100
    reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac muscle hypercontractility is a key pathophysiological abnormality in
      hypertrophic cardiomyopathy, and a major determinant of dynamic left
      ventricular outflow tract (LVOT) obstruction.
    explanation: >-
      Links hypercontractility - the direct consequence of cMyBP-C loss - to
      dynamic LVOT obstruction; PARTIAL because the cited trial enrolled HCM
      broadly rather than genotyped MYBPC3 carriers.
- name: Left Ventricular Diastolic Dysfunction
  category: Cardiovascular
  description: >-
    Impaired relaxation is an early and characteristic consequence of losing the
    cMyBP-C brake, preceding overt systolic impairment; in the absence of cMyBP-C
    it is accompanied by severe systolic dysfunction.
  phenotype_term:
    preferred_term: Left ventricular diastolic dysfunction
    term:
      id: HP:0025168
      label: Left ventricular diastolic dysfunction
  evidence:
  - reference: PMID:37844837
    reference_title: "Characterization of heterozygous and homozygous mouse models with the most common hypertrophic cardiomyopathy mutation MYBPC3(c.2373InsG) in the Netherlands."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      our 18-28 week old homozygous Mybpc3c.2373InsG model developed cardiac
      hypertrophy and severe left ventricular systolic and diastolic dysfunction
    explanation: >-
      Demonstrates diastolic (and systolic) dysfunction on loss of cMyBP-C in a
      knock-in mouse model of the Dutch founder variant.
  - reference: PMID:36893011
    reference_title: "cMyBP-C ablation in human engineered cardiac tissue causes progressive Ca2+-handling abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      progresses to hypocontractility with impaired relaxation
    explanation: >-
      Human isogenic engineered cardiac tissue shows impaired relaxation as a
      direct consequence of reduced or absent cMyBP-C.
- name: Congestive Heart Failure
  category: Cardiovascular
  description: >-
    Heart failure is the commonest clinical event in heterozygous carriers but

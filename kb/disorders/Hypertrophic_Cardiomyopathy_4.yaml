  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population-based prevalence estimate exists for the MYBPC3-specific entity.
    MYBPC3 is nonetheless the largest single genetic contributor to hypertrophic
    cardiomyopathy overall, accounting for roughly half of identified HCM
    mutations, so CMH4 is the most common gene-specific HCM subtype.
  evidence:
  - reference: PMID:22057632
    reference_title: "How do MYBPC3 mutations cause hypertrophic cardiomyopathy?"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      It is well established that MYBPC3 mutations are the most common cause of
      hypertrophic cardiomyopathy, accounting for about half of identified
      mutations.
    explanation: >-
      Supports MYBPC3's share of HCM mutations but does not provide a
      population-level prevalence for the MYBPC3-specific entity, hence PARTIAL.
      Evidence source is OTHER because this is a mechanistic review.

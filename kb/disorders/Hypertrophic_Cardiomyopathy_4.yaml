    modifier: ABNORMAL
  - preferred_term: Calcium-Dependent Regulation of Cardiac Contraction
    term:
      id: GO:0010882
      label: regulation of cardiac muscle contraction by calcium ion signaling
    modifier: ABNORMAL
  cellular_components:

  description: >-
    The remodelled, stiff, disarrayed and fibrotic ventricle produces the clinical
    endpoints of CMH4. In heterozygotes this is usually a slowly progressive
    picture of diastolic dysfunction with preserved ejection fraction, dynamic
    outflow obstruction in a subset, and a low but real annual risk of malignant
    ventricular arrhythmia and sudden death. In the biallelic neonatal form,
    systolic and diastolic function fail together and death from cardiac failure
    follows within weeks to months.

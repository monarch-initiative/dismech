- name: MYBPC3 c.2373dup (p.Trp792fs) - Dutch founder variant
  gene:
    preferred_term: MYBPC3
    term:
      id: hgnc:7551
      label: MYBPC3
  description: >-
    A frameshift founder allele carried by approximately 25% of Dutch HCM patients.
    Heterozygotes have variable adult-onset HCM; homozygotes and compound
    heterozygotes with a second truncating allele have lethal neonatal
    cardiomyopathy.
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients were compound heterozygotes for the pathogenic c.2373dup
      p.(Trp792fs) and c.2827C>T p.(Arg943*) mutations, and two were homozygous for
      the c.2373dup and c.2827C>T mutations.
    explanation: >-
      Documents c.2373dup in both homozygous and compound heterozygous state in
      lethal neonatal cardiomyopathy.
  - reference: PMID:37844837
    reference_title: "Characterization of heterozygous and homozygous mouse models with the most common hypertrophic cardiomyopathy mutation MYBPC3(c.2373InsG) in the Netherlands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients are heterozygous (MYBPC3+/InsG) and have highly variable
      phenotypic expression, whereas homozygous (MYBPC3InsG/InsG) patients have
      severe HCM at a young age.
    explanation: >-
      States the human dose-dependent phenotype of this specific founder allele.
- name: MYBPC3 c.3330+2T>G - Amish/Swiss founder splice variant
  gene:
    preferred_term: MYBPC3
    term:
      id: hgnc:7551
      label: MYBPC3
  description: >-
    An ancient splice-donor founder variant first described in the homozygous state
    in Amish newborns with severe recessive HCM, later recognised as a cause of
    adult-onset dominant HCM in heterozygotes, and now shown to be the most
    prevalent cardiomyopathy variant in western Switzerland. It is a compact
    illustration of the same allele producing both poles of the CMH4 dose
    spectrum.
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:36162733
    reference_title: "The «Amish» NM_000256.3:c.3330+2T>G splice variant in MYBPC3 associated with hypertrophic cardiomyopathy is an ancient Swiss mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One of them, a MYBPC3 splice variant, NM_000256.3:c.3330+2T > G, was first
      described in homozygous state in newborns presenting with a severe, recessive
      form of HCM among the Amish population and was later associated with
      adult-onset dominant HCM in heterozygous carriers.
    explanation: >-
      Single-variant demonstration of the mono- versus bi-allelic dose contrast
      that defines this entity.
  - reference: PMID:36162733
    reference_title: "The «Amish» NM_000256.3:c.3330+2T>G splice variant in MYBPC3 associated with hypertrophic cardiomyopathy is an ancient Swiss mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We here report this splice variant in heterozygous state in eight unrelated
      Swiss families with HCM, making it the most prevalent cardiomyopathy variant
      in western Switzerland.
    explanation: >-
      Establishes the Swiss founder origin and local prevalence of this allele.
- name: MYBPC3 25-bp deletion - South Asian risk allele
  gene:
    preferred_term: MYBPC3
    term:
      id: hgnc:7551
      label: MYBPC3
  description: >-
    A 25-bp intronic deletion carried by approximately 4% of people of Indian
    subcontinental ancestry, associated with heritable cardiomyopathy and increased
    heart-failure risk (combined OR ~7). Unlike the classic truncating founder
    alleles it behaves as a common, incompletely penetrant risk factor rather than
    a fully penetrant Mendelian variant.
  clinical_significance: UNCERTAIN_SIGNIFICANCE
  evidence:
  - reference: PMID:19151713
    reference_title: "A common MYBPC3 (cardiac myosin binding protein C) variant associated with cardiomyopathies in South Asia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a deletion of 25 bp in the gene encoding cardiac myosin
      binding protein C (MYBPC3) that is associated with heritable cardiomyopathies
      and an increased risk of heart failure in Indian populations
    explanation: >-
      Defines the variant and its association with cardiomyopathy and heart failure
      risk in South Asian populations.
diagnosis:
- name: Genetic Testing for MYBPC3 Variants
  description: >-
    Molecular confirmation is what distinguishes CMH4 from other causes of
    unexplained left ventricular hypertrophy, and - critically for this entity -
    determines allelic dose. Trio or family-based testing is required to establish
    whether two variants are in trans, since the biallelic genotype carries an
    entirely different prognosis and reproductive-counselling implication than the
    heterozygous state.
  evidence:
  - reference: PMID:41488457
    reference_title: "Case Report: Lethal neonatal hypertrophic cardiomyopathy from compound heterozygous MYBPC3 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed a full forensic autopsy with detailed histological examination
      and conducted trio-based whole-exome sequencing (WES) on the proband and
      parents to identify the genetic etiology.
    explanation: >-
      Illustrates trio-based sequencing as the method that establishes biparental
      (compound heterozygous) inheritance.
  - reference: PMID:41488457
    reference_title: "Case Report: Lethal neonatal hypertrophic cardiomyopathy from compound heterozygous MYBPC3 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Crucially, the diagnosis guided the clinical management of the asymptomatic
      carrier parents, prompting long-term cardiac surveillance and enabling
      preimplantation genetic testing (PGT) for future family planning.
    explanation: >-
      Documents the downstream family-management value of establishing the
      molecular diagnosis.
- name: Longitudinal Cardiac Surveillance of Genotype-Positive Relatives
  description: >-
    Because penetrance in heterozygous MYBPC3 carriers is incomplete and rises with
    age, a single normal evaluation does not exclude future disease. Serial
    echocardiographic and ECG surveillance of genotype-positive, phenotype-negative
    relatives is the corollary of the age-dependent penetrance data.
  evidence:
  - reference: PMID:22267749
    reference_title: "Cardiac myosin binding protein-C mutations in families with hypertrophic cardiomyopathy: disease expression in relation to age, gender, and long term outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease penetrance was, therefore, incomplete (56.9% in all mutation
      carriers, 34.5% in relatives), related to age (38.4% <40 versus 68.6% ≥40
      years, P<0.001)
    explanation: >-
      The near-doubling of penetrance after age 40 is the direct rationale for
      lifelong rather than one-off screening of carriers.
  - reference: PMID:22267749
    reference_title: "Cardiac myosin binding protein-C mutations in families with hypertrophic cardiomyopathy: disease expression in relation to age, gender, and long term outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Importantly, complex genetic status is observed and should be considered when
      mutation analysis and cascade screening is used in the evaluation of at risk
      family members.
    explanation: >-
      Explicitly warns that multiple variants in one individual must be considered
      during cascade screening - the practical expression of the dose principle.
differential_diagnoses:
- name: Hypertrophic Cardiomyopathy due to other sarcomere genes
  description: >-
    MYH7, TNNT2, TNNI3, TPM1, ACTC1, MYL2 and MYL3 also carry definitive HCM
    gene-disease validity. Distinguishing CMH4 from these requires genetic testing;
    MYBPC3-related disease tends to present later than MYH7-related disease and
    does not have a biallelic neonatal counterpart in most of the other genes.
  disease_term:
    preferred_term: hypertrophic cardiomyopathy
    term:
      id: MONDO:0005045
      label: hypertrophic cardiomyopathy
  evidence:
  - reference: PMID:38406555
    reference_title: "Hypertrophic cardiomyopathy in MYBPC3 carriers in aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This inherited disease is predominantly caused by mutations in sarcomeric
      genes, among which those in the cardiac myosin binding protein-C3 (MYBPC3)
      gene are major contributors.
    explanation: >-
      Places MYBPC3 within the broader sarcomeric HCM differential. Evidence source
      is OTHER because this is a narrative review.
- name: Left Ventricular Noncompaction Cardiomyopathy
  description: >-
    Biallelic MYBPC3 neonatal disease frequently shows hypertrabeculation and can
    be mistaken for primary left ventricular noncompaction cardiomyopathy; the
    accompanying severe hypertrophy, septal defects and the MYBPC3 genotype
    distinguish it.
  evidence:
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Features of left ventricular noncompaction were diagnosed in three patients.
      In the fourth, hypertrabeculation was not a clear feature, but could not be
      excluded.
    explanation: >-
      Documents the noncompaction overlap that creates this differential in
      biallelic neonates.
treatments:
- name: Mavacamten (Cardiac Myosin Inhibitor)
  description: >-
    Mavacamten is a first-in-class allosteric cardiac myosin inhibitor that reduces
    the number of force-generating actin-myosin cross-bridges. Because CMH4 is
    mechanistically a loss of the cMyBP-C brake on cross-bridge cycling,
    pharmacological myosin inhibition is a direct mechanistic counterweight. In
    EXPLORER-HCM it improved exercise capacity, symptoms and outflow gradient in
    symptomatic obstructive HCM. Note the trial enrolled obstructive HCM broadly,
    not a genotyped MYBPC3 cohort.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mavacamten
  target_mechanisms:
  - target: Loss of the cMyBP-C Brake on Actin-Myosin Cross-Bridge Cycling
    treatment_effect: INHIBITS
  target_phenotypes:
  - preferred_term: Left ventricular outflow tract obstruction
    term:
      id: HP:0032092
      label: Left ventricular outflow tract obstruction
  evidence:
  - reference: PMID:32871100
    reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      45 (37%) of 123 patients on mavacamten versus 22 (17%) of 128 on placebo met
      the primary endpoint (difference +19·4%, 95% CI 8·7 to 30·1; p=0·0005).
    explanation: >-
      Phase 3 randomised placebo-controlled evidence of benefit on the composite
      functional primary endpoint in symptomatic obstructive HCM.
  - reference: PMID:32871100
    reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients on mavacamten had greater reductions than those on placebo in
      post-exercise LVOT gradient (-36 mm Hg, 95% CI -43·2 to -28·1; p<0·0001)
    explanation: >-
      Demonstrates the mechanistically expected reduction in dynamic outflow
      gradient from inhibiting cross-bridge formation.
- name: Aficamten (Next-Generation Cardiac Myosin Inhibitor)
  description: >-
    Aficamten is a second, oral selective cardiac myosin inhibitor acting on the
    same hypercontractility node as mavacamten. In the phase 3 SEQUOIA-HCM trial
    it improved peak oxygen uptake and met all ten prespecified secondary
    endpoints in symptomatic obstructive HCM. As with mavacamten, the trial
    population was obstructive HCM generally rather than a genotyped MYBPC3
    cohort.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aficamten
  target_mechanisms:
  - target: Loss of the cMyBP-C Brake on Actin-Myosin Cross-Bridge Cycling
    treatment_effect: INHIBITS
  target_phenotypes:
  - preferred_term: Left ventricular outflow tract obstruction
    term:
      id: HP:0032092
      label: Left ventricular outflow tract obstruction
  evidence:
  - reference: PMID:38739079
    reference_title: "Aficamten for Symptomatic Obstructive Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aficamten is an oral selective cardiac myosin inhibitor that reduces left
      ventricular outflow tract gradients by mitigating cardiac hypercontractility.
    explanation: >-
      States the mechanism of action, which targets the same hypercontractility
      that cMyBP-C loss produces in CMH4.
  - reference: PMID:38739079
    reference_title: "Aficamten for Symptomatic Obstructive Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results for all 10 secondary end points were significantly improved with
      aficamten as compared with placebo.
    explanation: >-
      Phase 3 randomised evidence of consistent benefit across the prespecified
      secondary endpoint hierarchy in symptomatic obstructive HCM.
- name: Septal Reduction Therapy
  description: >-
    Surgical septal myectomy or alcohol septal ablation relieves drug-refractory
    dynamic left ventricular outflow tract obstruction. Septal reduction therapy is
    counted among the major cardiomyopathy-related events in MYBPC3 founder-variant
    cohorts, which is an index of how often obstruction becomes clinically
    significant in this genotype.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Myectomy
    term:
      id: NCIT:C51591
      label: Myectomy
  target_phenotypes:
  - preferred_term: Left ventricular outflow tract obstruction
    term:
      id: HP:0032092
      label: Left ventricular outflow tract obstruction
  evidence:
  - reference: PMID:39689185
    reference_title: "Recreational and Occupational Physical Activity and Risk of Adverse Events in Truncating MYBPC3 Founder Variant Carriers."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MCE was defined as a composite of malignant ventricular arrhythmia
      (sustained ventricular tachycardia/fibrillation), heart failure (heart
      failure hospitalizations or transplantation), and septal reduction therapy.
    explanation: >-
      Documents that septal reduction therapy is used and tracked as a clinical
      event in truncating MYBPC3 carriers; PARTIAL because the paper reports it as
      an endpoint rather than evaluating its efficacy.
- name: Implantable Cardioverter-Defibrillator
  description: >-
    ICD implantation for primary or secondary prevention of sudden cardiac death in
    carriers judged to be at high arrhythmic risk. Risk stratification is
    particularly important in CMH4 because the baseline event rate in heterozygous
    carriers is low and conventional risk calculators performed poorly in a
    molecularly homogeneous truncating-MYBPC3 cohort.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Implantable Cardioverter-Defibrillator Placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_phenotypes:
  - preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  evidence:
  - reference: PMID:39581692
    reference_title: "Hypertrophic cardiomyopathy due to truncating variants in myosin binding protein C: a Spanish cohort."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ESC-HCM risk calculator and modifier factors did not correlate with the risk
      of major events predicting events, which were low (1.51 per 100
      patients/year) and associated with the severity of HCM, abnormal QRS in the
      ECG and age.
    explanation: >-
      Supports the risk-stratification caveat for this genotype rather than ICD
      efficacy itself, hence PARTIAL.
- name: Genetic Counseling and Cascade Screening
  description: >-
    Counseling covers autosomal dominant transmission for heterozygous probands and
    the recurrence risk for couples who are both carriers, since two carrier parents
    face a 25% risk of a biallelic, usually lethal neonatal pregnancy.
    Preimplantation genetic testing is an option once the molecular diagnosis is
    established, and asymptomatic carrier parents identified through a proband
    warrant their own long-term cardiac surveillance.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:41488457
    reference_title: "Case Report: Lethal neonatal hypertrophic cardiomyopathy from compound heterozygous MYBPC3 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Crucially, the diagnosis guided the clinical management of the asymptomatic
      carrier parents, prompting long-term cardiac surveillance and enabling
      preimplantation genetic testing (PGT) for future family planning.
    explanation: >-
      Directly documents both counselling outcomes - parental surveillance and
      preimplantation genetic testing - following a biallelic MYBPC3 diagnosis.
  - reference: PMID:33849460
    reference_title: "A rare cause of sudden unexpected death syndrome (SUDS) in the first year of life: endomyocardial fibroelastosis (EFE) due to two compound heterozygous MYBPC3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, the molecular autoptic findings also had consequences for the relatives
      of the deceased child and impact on further family planning.
    explanation: >-
      Documents the cascade-screening and family-planning consequences of a
      molecular diagnosis in biallelic MYBPC3 disease.
- name: Exercise Counseling
  description: >-
    Overall exercise participation does not increase adverse-event risk in MYBPC3
    founder-variant carriers, so blanket exercise restriction is not supported.
    However, the highest quartile of high-dynamic sport was associated with a
    threefold increase in malignant ventricular arrhythmia, so high-intensity
    high-dynamic activity warrants individualised caution.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39689185
    reference_title: "Recreational and Occupational Physical Activity and Risk of Adverse Events in Truncating MYBPC3 Founder Variant Carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall exercise participation does not generally increase the risk of
      adverse events among MYBPC3 founder variant carriers. Nonetheless, an
      increased risk of malignant ventricular arrhythmia was observed among those
      engaged in the highest quartile of high-dynamic sports, suggesting that
      high-level high-intensity exercise activities should be entertained with
      caution.
    explanation: >-
      The genotype-specific evidence base for exercise advice in truncating MYBPC3
      carriers.
- name: AAV9-Mediated MYBPC3 Gene Replacement (Investigational)
  description: >-
    Because CMH4 is a protein-dose disease, restoring wild-type cMyBP-C is a
    causally targeted strategy rather than symptom control. An AAV9 vector carrying
    an optimised MYBPC3 expression cassette (TN-201) reversed hypertrophy and
    systolic dysfunction, improved diastolic function and prolonged survival in a
    symptomatic MYBPC3-deficient mouse model. This is preclinical/early clinical and
    is not established therapy.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: cMyBP-C Depletion by Nonsense-Mediated Decay and Proteasomal Degradation
    treatment_effect: BYPASSES
  evidence:
  - reference: PMID:40038304
    reference_title: "AAV9-mediated MYBPC3 gene therapy with optimized expression cassette enhances cardiac function and survival in MYBPC3 cardiomyopathy models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rather than simply preventing cardiac dysfunction preclinically, we
      demonstrate in a symptomatic MYBPC3-deficient murine model the ability of AAV
      gene therapy to reverse cardiac hypertrophy and systolic dysfunction, improve
      diastolic dysfunction, and prolong survival.
    explanation: >-
      Preclinical demonstration that restoring MYBPC3 dose reverses the established
      phenotype, the therapeutic corollary of the haploinsufficiency mechanism.
  - reference: PMID:40038304
    reference_title: "AAV9-mediated MYBPC3 gene therapy with optimized expression cassette enhances cardiac function and survival in MYBPC3 cardiomyopathy models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Dose-ranging efficacy studies exhibit restoration of wild-type MYBPC3 protein
      levels and saturation of cardiac improvement at the clinically relevant dose
      of 3E13 vg/kg, outperforming a previously published construct.
    explanation: >-
      Shows the intervention works by restoring wild-type protein level, closing
      the mechanistic loop with the haploinsufficiency node.
experimental_models:
- name: Isogenic MYBPC3 +/- and -/- human iPSC engineered cardiac tissue
  description: >-
    CRISPR-Cas9 heterozygous and homozygous MYBPC3 frameshifts introduced into a
    human iPSC line, differentiated to cardiomyocytes and assembled into engineered
    cardiac tissue constructs. This is the cleanest available human model of the
    CMH4 allelic-dose question because the two genotypes and the wild-type control
    share an identical genetic background.
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:36893011
  modeled_mechanisms:
  - target: Gene-Dosage-Dependent Severity Gradient
  - target: Loss of the cMyBP-C Brake on Actin-Myosin Cross-Bridge Cycling
  evidence:
  - reference: PMID:36893011
    reference_title: "cMyBP-C ablation in human engineered cardiac tissue causes progressive Ca2+-handling abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We used CRISPR-Cas9 to introduce heterozygous (cMyBP-C+/-) and homozygous
      (cMyBP-C-/-) frame-shift mutations into MYBPC3 in human iPSCs.
    explanation: >-
      Describes the isogenic allelic series that makes this model suited to the
      dose question.
- name: Mybpc3 c.2373InsG knock-in mouse allelic series
  description: >-
    CRISPR/Cas9 knock-in mice heterozygous and homozygous for the Dutch MYBPC3
    c.2373InsG founder variant, characterised by echocardiography, histology and
    cardiomyocyte contractility. Homozygotes lack cMyBP-C and develop severe HCM;
    heterozygotes did not show HCM at the ages studied, mirroring the low and
    age-dependent penetrance of the human heterozygous state.
  experimental_model_type: OTHER
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  publication: PMID:37844837
  modeled_mechanisms:
  - target: Gene-Dosage-Dependent Severity Gradient
  - target: Ventricular Hypertrophy, Disarray and Fibrosis
  evidence:
  - reference: PMID:37844837
    reference_title: "Characterization of heterozygous and homozygous mouse models with the most common hypertrophic cardiomyopathy mutation MYBPC3(c.2373InsG) in the Netherlands."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To improve understanding of disease progression and genotype-phenotype
      relationship based on the hallmarks of human HCM, we characterized mice with
      CRISPR/Cas9-induced heterozygous and homozygous mutations.
    explanation: >-
      Describes the mouse allelic series used to model the human dose-phenotype
      relationship for the Dutch founder variant.

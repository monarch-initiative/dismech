- name: Heart Transplantation
  description: >-
    Transplantation is the treatment that matters most at the biallelic pole
    this entry models. Biallelic truncating disease is a lethal neonatal
    cardiomyopathy - the reported infants died of cardiac failure before 13 weeks
    - and no pharmacological therapy alters that course: myosin inhibition
    presupposes hypercontractility to inhibit, and gene replacement remains
    investigational and adult-only. Transplantation is also the endpoint for the
    minority of heterozygous carriers who progress to end-stage disease, where it
    is counted among the adverse composite outcomes in MYBPC3 cohort studies.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Heart Transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  evidence:
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All four children presented with feeding difficulties, failure to thrive,
      and dyspnea. They died from cardiac failure before age 13 weeks.
    explanation: >-
      Establishes the untreated natural history that makes transplantation the
      only survival-altering option at the biallelic pole. PARTIAL because the
      source documents the fatal course rather than transplantation outcomes -

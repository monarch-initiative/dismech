discussions:
- discussion_id: mybpc3_haploinsufficiency_sufficiency
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is reduced cMyBP-C protein level sufficient to explain the disease caused by
    MYBPC3 truncating alleles, or do parallel mechanisms contribute before, or
    independently of, any measurable fall in protein?
  attaches_to:
  - pathophysiology#cMyBP-C Depletion by Nonsense-Mediated Decay and Proteasomal Degradation
  - genetic#MYBPC3
  rationale: >-
    This entry curates haploinsufficiency as the operative mechanism, and the
    human evidence for it is strong: myectomy tissue shows reduced full-length
    cMyBP-C with no detectable truncated peptide, a promoter deletion that can
    produce no peptide at all still causes the disease, and outcome is
    independent of where in the gene the truncation falls. The challenge is not
    to that evidence but to its sufficiency. Heterozygous MYBPC3-null iPSC
    cardiomyocytes maintain normal cMyBP-C protein despite allelic loss of
    function - compensating through reduced degradation - yet still show
    contractile and calcium-handling defects; haploinsufficiency becomes
    measurable only when protein demand rises, as in three-dimensional
    engineered tissue or under hypertrophic stress. If dysfunction can precede
    the protein deficit, protein level is not the whole mechanism. This matters
    therapeutically: the gene-replacement strategy curated in this entry is
    predicated on dose restoration being sufficient to reverse disease.
  evidence:
  - reference: PMID:36946992
    reference_title: "Is haploinsufficiency a sufficient mechanism for MYBPC3 truncating mutations?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While haploinsufficiency of cMyBP-C has been previously demonstrated
      (Helms et al., 2014; Barefield et al., 2015; Glazier et al., 2019), the
      necessity and sufficiency of simply reducing protein levels to cause all
      the observed phenotypic changes remains unclear.
    explanation: >-
      States the open question directly. Evidence source is OTHER because this
      is a commentary rather than primary data.
  - reference: PMID:36946992
    reference_title: "Is haploinsufficiency a sufficient mechanism for MYBPC3 truncating mutations?"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      These data from mouse models are in-line with the results from De Lange et
      al. (2023) and suggest that there is more going on here than a pure
      haploinsufficiency mechanism
    explanation: >-
      Summarises the case that a pure dose model is incomplete. PARTIAL because
      it is an interpretive claim in a commentary, not a measurement.
  - reference: PMID:31877118
    reference_title: "Effects of MYBPC3 loss-of-function mutations preceding hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Despite a reduction in wild-type mRNA in all heterozygous iPSCMs, no
      reduction in MyBP-C protein was observed, indicating protein-level
      compensation through what we believe is a previously uncharacterized
      mechanism.
    explanation: >-
      The primary observation behind the challenge: allelic loss of function at
      the mRNA level without a protein deficit, in heterozygous human iPSC
      cardiomyocytes.
  - reference: PMID:31877118
    reference_title: "Effects of MYBPC3 loss-of-function mutations preceding hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These findings indicate that cardiomyocytes have an innate capacity to
      attain normal MyBP-C stoichiometry despite MYBPC3 allelic loss of function
      due to truncating mutations.
    explanation: >-
      States the compensation capacity explicitly, which is what makes the
      timing of the protein deficit - and therefore its sufficiency - an open
      question.
  proposed_experiments:
  - experiment_id: exp_mybpc3_preclinical_carrier_myofibrillar_protein
    name: Quantify myofibrillar cMyBP-C in genotype-positive, phenotype-negative human myocardium
    description: >-
      The decisive missing measurement is whether cMyBP-C is already reduced in
      carriers before hypertrophy appears. Myectomy tissue comes only from
      symptomatic patients, so protein content in asymptomatic carriers is
      essentially unmeasured. An explant-bank or imaging-guided biopsy study
      stratified by phenotype status would establish whether the deficit
      precedes or follows remodeling, and therefore whether dose restoration
      alone is a sufficient therapeutic target.
- discussion_id: mybpc3_penetrance_ascertainment_discrepancy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why is MYBPC3 penetrance far lower in unselected population cohorts than in
    clinically ascertained families, and how much of the gap is ascertainment
    bias versus genuine modifier burden or environmental exposure?
  attaches_to:
  - pathophysiology#Gene-Dosage-Dependent Severity Gradient
  rationale: >-
    The penetrance figure quoted to a family decides whether a genotype-positive
    relative is told they have a substantial chance of developing disease or a
    small one, so this discrepancy is not academic. Family cohorts give
    incomplete but substantial penetrance that roughly doubles after age 40,
    whereas unselected population cohorts give far lower estimates. The two
    populations differ in ascertainment - families are ascertained through an
    affected proband and are therefore enriched for whatever made that proband
    affected - but they may also differ in modifier burden, comorbidity and
    physical-activity exposure. Until those sources are separated, neither
    number is straightforwardly the right one to counsel with, which is why this
    entry records the family-cohort figures with their ascertainment context
    rather than presenting a single penetrance value.
  evidence:
  - reference: PMID:22267749
    reference_title: "Cardiac myosin binding protein-C mutations in families with hypertrophic cardiomyopathy: disease expression in relation to age, gender, and long term outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease penetrance was, therefore, incomplete (56.9% in all mutation
      carriers, 34.5% in relatives), related to age (38.4% <40 versus 68.6% ≥40
      years, P<0.001)
    explanation: >-
      The clinical-family pole of the discrepancy. Note that penetrance already
      differs substantially between probands and relatives within this single
      study - an ascertainment gradient visible inside one cohort.
- discussion_id: mybpc3_heterozygous_mouse_phenotype_negative
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Heterozygous Mybpc3 mice remain phenotype-negative while human heterozygotes
    develop disease at substantial rates - which human population, if any, does
    the heterozygous mouse actually model?
  attaches_to:
  - pathophysiology#Gene-Dosage-Dependent Severity Gradient
  - pathophysiology#Myosin Shift from the Super-Relaxed to the Disordered-Relaxed State
  rationale: >-
    This entry curates a mouse allelic series as experimental confirmation of the
    dose gradient, and for the homozygous pole that is exactly what it provides.
    The heterozygous pole is where model and disease part company: knock-in
    heterozygotes for the Dutch founder variant did not develop HCM at the ages
    studied, and the same negative result appears independently in the
    super-relaxed-state measurements, where heterozygous cMyBP-C knockout mice
    were indistinguishable from wild type while homozygotes showed a clear
    deficit. Human heterozygotes are the common form of this disease. The
    divergence is mechanistically informative rather than merely technical - it
    is consistent with the compensation capacity documented in heterozygous
    human iPSC cardiomyocytes, and it suggests murine heterozygotes may model the
    genotype-positive, phenotype-negative carrier rather than the patient. It
    also constrains what the models can be used for: a heterozygous mouse cannot
    demonstrate that a therapy prevents phenotype conversion if it never
    converts.
  evidence:
  - reference: PMID:37844837
    reference_title: "Characterization of heterozygous and homozygous mouse models with the most common hypertrophic cardiomyopathy mutation MYBPC3(c.2373InsG) in the Netherlands."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Expectedly, knock-in of Mybpc3c.2373InsG resulted in the absence of cMyBP-C
      and our 18-28 week old homozygous Mybpc3c.2373InsG model developed cardiac
      hypertrophy and severe left ventricular systolic and diastolic dysfunction,
      whereas HCM was not evident in Mybpc3+/InsG mice.
    explanation: >-
      Documents the phenotype-negative heterozygote alongside the severely
      affected homozygote in the same allelic series.
  - reference: PMID:27021517
    reference_title: "Ablation of cardiac myosin binding protein-C disrupts the super-relaxed state of myosin in murine cardiomyocytes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We report a significant decrease in the proportion of myosin heads in the
      SRX state in homozygous cMyBP-C knockout mice, however heterozygous
      cMyBP-C knockout mice do not significantly differ from the wild type.
    explanation: >-
      Independent replication of the heterozygous-negative result at the
      molecular level, in a different mouse line with a different assay.
  proposed_experiments:
  - experiment_id: exp_mybpc3_heterozygous_mouse_stress_challenge
    name: Stress-challenge and aged-cohort phenotyping of heterozygous Mybpc3 knock-in mice
    description: >-
      Test whether the heterozygous mouse is truly phenotype-negative or merely
      unstressed and studied too young, by phenotyping aged cohorts and cohorts
      challenged with pressure overload, exercise, or dietary stress. A
      heterozygote that converts under challenge would model the human carrier
      whose penetrance rises after age 40; one that never converts marks a
      genuine species difference in compensation capacity, and would mean
      preventive-therapy trials cannot use this model as their test bed.
- discussion_id: mybpc3_disarray_and_obstruction_not_modeled
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the curated MYBPC3 model systems reproduce myocyte disarray and dynamic
    outflow obstruction - the pathognomonic human lesion and the dominant human
    clinical problem - or are both unavailable in every model this entry relies
    on?
  attaches_to:
  - pathophysiology#Ventricular Hypertrophy, Disarray and Fibrosis
  rationale: >-
    Two features that define this disease clinically are absent from the models
    used to study it. Myocyte disarray is the pathognomonic human histological
    lesion and is documented in human MYBPC3 hearts; the mouse allelic series
    curated in this entry reports echocardiography, histology and cardiomyocyte
    contractility without reporting disarray, and engineered cardiac tissue has
    no ventricular architecture within which disarray could even be defined.
    Dynamic left ventricular outflow tract obstruction with systolic anterior
    motion - the target of both approved drugs and the endpoint of every trial
    cited here - depends on ventricular geometry and mitral-apparatus anatomy
    that small-animal and engineered-tissue systems do not reproduce. The
    practical consequence is a division of evidential labour that this entry
    makes explicit: the models carry the molecular and dose arguments, while
    every claim about relief of obstruction rests entirely on human trial data.
  proposed_experiments:
  - experiment_id: exp_mybpc3_large_animal_disarray_and_lvot
    name: Large-animal MYBPC3 model phenotyped for disarray and outflow-tract dynamics
    description: >-
      A large-animal model with human-like ventricular geometry - the
      base-edited MYBPC3 pig is the obvious starting point - phenotyped
      specifically for myofibre disarray on histology and for provoked
      outflow-tract gradients on imaging would establish whether these features
      are reproducible outside humans, and would give the drug mechanism a
      non-clinical test bed it currently lacks.
experimental_models:
- name: Isogenic MYBPC3 +/- and -/- human iPSC engineered cardiac tissue
  description: >-
    CRISPR-Cas9 heterozygous and homozygous MYBPC3 frameshifts introduced into a
    human iPSC line, differentiated to cardiomyocytes and assembled into engineered
    cardiac tissue constructs. This is the cleanest available human model of the
    CMH4 allelic-dose question because the two genotypes and the wild-type control
    share an identical genetic background.
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:36893011
  modeled_mechanisms:
  - target: Gene-Dosage-Dependent Severity Gradient
  - target: Loss of the cMyBP-C Brake on Actin-Myosin Cross-Bridge Cycling
  evidence:
  - reference: PMID:36893011
    reference_title: "cMyBP-C ablation in human engineered cardiac tissue causes progressive Ca2+-handling abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We used CRISPR-Cas9 to introduce heterozygous (cMyBP-C+/-) and homozygous
      (cMyBP-C-/-) frame-shift mutations into MYBPC3 in human iPSCs.
    explanation: >-
      Describes the isogenic allelic series that makes this model suited to the
      dose question.
animal_models:
- name: Mybpc3 c.2373InsG knock-in mouse allelic series
  species: Mouse
  genotype: Mybpc3 c.2373InsG heterozygous and homozygous knock-in (CRISPR/Cas9)
  description: >-
    CRISPR/Cas9 knock-in mice heterozygous and homozygous for the Dutch MYBPC3
    c.2373InsG founder variant, characterised by echocardiography, histology and
    cardiomyocyte contractility. Homozygotes lack cMyBP-C and develop severe HCM;
    heterozygotes did not show HCM at the ages studied, mirroring the low and
    age-dependent penetrance of the human heterozygous state.
  publication: PMID:37844837
  modeled_mechanisms:
  - target: Gene-Dosage-Dependent Severity Gradient
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The allelic series reproduces the dose-severity relationship that defines
      this disease: absent cMyBP-C gives severe disease, half-dose gives none at
      the ages studied.
    limitations: >-
      Fidelity is MODERATE rather than HIGH because only the homozygous pole
      matches its human counterpart. Human heterozygotes develop disease at
      substantial rates, whereas these heterozygous mice do not - so the model
      reproduces the shape of the gradient while misplacing the human
      heterozygote on it.
    evidence:
    - reference: PMID:37844837
      reference_title: "Characterization of heterozygous and homozygous mouse models with the most common hypertrophic cardiomyopathy mutation MYBPC3(c.2373InsG) in the Netherlands."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Expectedly, knock-in of Mybpc3c.2373InsG resulted in the absence of
        cMyBP-C and our 18-28 week old homozygous Mybpc3c.2373InsG model
        developed cardiac hypertrophy and severe left ventricular systolic and
        diastolic dysfunction, whereas HCM was not evident in Mybpc3+/InsG mice.
      explanation: >-
        Gives both poles of the gradient in one experiment, including the
        negative heterozygous result.
  - target: Ventricular Hypertrophy, Disarray and Fibrosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Homozygotes develop the hypertrophic structural phenotype with progressive
      worsening.
    limitations: >-
      PARTIALLY_RECAPITULATES rather than RECAPITULATES because the node
      includes myocyte disarray, the pathognomonic human lesion, and the cited
      characterisation reports echocardiography, histology and contractility
      without reporting disarray. Recorded as an open model-mismatch discussion
      rather than assumed either way.
    evidence:
    - reference: PMID:37844837
      reference_title: "Characterization of heterozygous and homozygous mouse models with the most common hypertrophic cardiomyopathy mutation MYBPC3(c.2373InsG) in the Netherlands."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Both the 3-4 week old and 18-28 week old Mybpc3InsG/InsG models
        recapitulate HCM, with a severe phenotype present in the 18-28 week old
        model.
      explanation: >-
        Confirms the structural phenotype and its progression in the homozygous
        model.
  evidence:
  - reference: PMID:37844837
    reference_title: "Characterization of heterozygous and homozygous mouse models with the most common hypertrophic cardiomyopathy mutation MYBPC3(c.2373InsG) in the Netherlands."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To improve understanding of disease progression and genotype-phenotype
      relationship based on the hallmarks of human HCM, we characterized mice with
      CRISPR/Cas9-induced heterozygous and homozygous mutations.
    explanation: >-
      Describes the mouse allelic series used to model the human dose-phenotype

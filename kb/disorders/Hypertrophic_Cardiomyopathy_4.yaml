    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MCE was defined as a composite of malignant ventricular arrhythmia
      (sustained ventricular tachycardia/fibrillation), heart failure (heart
      failure hospitalizations or transplantation), and septal reduction therapy.
    explanation: >-
      Documents that septal reduction therapy is used and tracked as a clinical
      event in truncating MYBPC3 carriers; PARTIAL because the paper reports it as
      an endpoint rather than evaluating its efficacy.
- name: Implantable Cardioverter-Defibrillator
  description: >-
    ICD implantation for primary or secondary prevention of sudden cardiac death in
    carriers judged to be at high arrhythmic risk. Risk stratification is
    particularly important in CMH4 because the baseline event rate in heterozygous
    carriers is low and conventional risk calculators performed poorly in a
    molecularly homogeneous truncating-MYBPC3 cohort.
  therapeutic_modality: DEVICE
  treatment_term:

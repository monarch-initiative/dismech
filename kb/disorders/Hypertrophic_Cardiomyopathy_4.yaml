pathophysiology:
- name: MYBPC3 Truncating Variant and Premature Termination Codon Generation
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The initiating lesion in CMH4 is a MYBPC3 allele carrying a frameshift,
    nonsense, or splice-disrupting change that introduces a premature termination
    codon. A distinctive feature of MYBPC3 relative to other sarcomere disease
    genes is how many of its pathogenic variants sit in introns and act by
    aberrant splicing. Despite the frameshift, the predicted truncated cMyBP-C
    peptide has never been detected in human heart tissue from carriers, arguing
    against a dominant-negative poison-peptide mechanism at the protein level.
  genes:
  - preferred_term: MYBPC3
    term:
      id: hgnc:7551
      label: MYBPC3
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Sarcomere Organization
    term:
      id: GO:0045214
      label: sarcomere organization
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: Sarcomeric A band
    term:
      id: GO:0031672
      label: A band
  evidence:
  - reference: PMID:22057632
    reference_title: "How do MYBPC3 mutations cause hypertrophic cardiomyopathy?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most striking characteristic of HCM mutations in MYBPC3 is that many are
      within introns and are predicted to cause aberrant splicing leading to a
      frameshift and a premature chain termination, yet the truncated peptides
      have never been identified in human heart tissue carrying these mutations.
    explanation: >-
      Establishes the variant class (intronic/splice-disrupting, frameshift,
      premature termination) and the absence of detectable truncated peptide in
      patient myocardium. Evidence source is OTHER because this is a mechanistic
      review.
  downstream:
  - target: cMyBP-C Depletion by Nonsense-Mediated Decay and Proteasomal Degradation
    causal_link_type: DIRECT
    description: >-
      Premature termination codons trigger surveillance pathways that destroy the
      mutant transcript and protein rather than producing a stable truncated
      product.
- name: cMyBP-C Depletion by Nonsense-Mediated Decay and Proteasomal Degradation
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    Because the truncated peptide is not stably expressed, the operative
    consequence of a MYBPC3 truncating allele is a reduction in the amount of
    functional cMyBP-C in the sarcomere. Nonsense-mediated mRNA decay removes the
    PTC-containing transcript - measurably starting at the mRNA level in patient
    myocardium despite hypertrophy-driven upregulation of transcription - and the
    ubiquitin-proteasome system clears residual mutant protein. UPF3B, an NMD
    regulator upregulated specifically in MYBPC3-truncating hearts and localised
    to the sarcomeric Z-disc, has been implicated in establishing this
    haploinsufficiency during the first round of sarcomeric protein translation.
    The severity of the resulting phenotype scales with the residual cMyBP-C dose,
    which is what makes CMH4 a gene-dosage disease.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Nonsense-Mediated mRNA Decay
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
    modifier: INCREASED
  - preferred_term: Proteasomal Degradation of Mutant cMyBP-C
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:22057632
    reference_title: "How do MYBPC3 mutations cause hypertrophic cardiomyopathy?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Instead of expression of a poison peptide we consistently observe
      haploinsufficiency of MyBP-C in MYBPC3 mutant human heart muscle.
    explanation: >-
      States the core mechanistic claim - haploinsufficiency rather than a
      dominant-negative poison peptide - directly in human myocardium. Evidence
      source is OTHER because this is a mechanistic review.
  - reference: PMID:37797718
    reference_title: "Nonsense mediated decay factor UPF3B is associated with cMyBP-C haploinsufficiency in hypertrophic cardiomyopathy patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that cMyBP-C haploinsufficiency starts at the mRNA level, despite
      hypertrophy-induced increased transcriptional activity.
    explanation: >-
      Localises the origin of haploinsufficiency to transcript destruction in
      patient myocardium, evidence obtained from human HCM cardiac tissue with
      MYBPC3 truncating variants.
  - reference: PMID:37797718
    reference_title: "Nonsense mediated decay factor UPF3B is associated with cMyBP-C haploinsufficiency in hypertrophic cardiomyopathy patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data suggest that cMyBP-C haploinsufficiency in HCM-patients is
      established by UPF3B-dependent NMD during the initial translation round at
      the Z-disc.
    explanation: >-
      Identifies UPF3B-dependent nonsense-mediated decay as the specific
      surveillance route producing cMyBP-C haploinsufficiency.
  - reference: PMID:38406555
    reference_title: "Hypertrophic cardiomyopathy in MYBPC3 carriers in aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathogenesis related to MYBPC3 mutations includes nonsense-mediated decay,
      alternative splicing, and ubiquitin-proteasome system events, leading to
      allelic imbalance and haploinsufficiency.
    explanation: >-
      Names all three degradation/surveillance routes converging on allelic
      imbalance and haploinsufficiency. Evidence source is OTHER because this is a
      narrative review.
  downstream:
  - target: Loss of the cMyBP-C Brake on Actin-Myosin Cross-Bridge Cycling
    causal_link_type: DIRECT
    description: >-
      Reduced cMyBP-C in the A band removes its restraint on cross-bridge
      formation and kinetics.
- name: Loss of the cMyBP-C Brake on Actin-Myosin Cross-Bridge Cycling
  biological_scale: MOLECULAR
  role: effector
  description: >-
    cMyBP-C normally tethers and restrains myosin heads in the thick-filament C-zone,
    limiting the number of cross-bridges available for force generation and slowing
    cross-bridge kinetics. When cMyBP-C is reduced or absent, this brake is released:
    myofilament calcium sensitivity rises and the contraction-relaxation cycle is
    disturbed, producing hypercontractility with impaired relaxation. Direct
    calcium-handling consequences follow, with progressively slowed calcium release
    as cMyBP-C content falls.
  cell_types:
  - preferred_term: Ventricular cardiomyocyte
    term:
      id: CL:0002131
      label: regular ventricular cardiac myocyte
  biological_processes:

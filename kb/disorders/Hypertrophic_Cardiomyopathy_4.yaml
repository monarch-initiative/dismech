has_subtypes:
- name: Monoallelic CMH4
  display_name: Monoallelic (heterozygous) MYBPC3 hypertrophic cardiomyopathy
  description: >-
    The classic autosomal dominant form. A single truncating (or, less often,
    missense) MYBPC3 allele produces cMyBP-C haploinsufficiency. Penetrance is
    incomplete, age-related and higher in males; hypertrophy is typically discrete,
    ejection fraction is usually preserved, and the annual event rate is low.
  evidence:
  - reference: PMID:22267749
    reference_title: "Cardiac myosin binding protein-C mutations in families with hypertrophic cardiomyopathy: disease expression in relation to age, gender, and long term outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease penetrance was, therefore, incomplete (56.9% in all mutation
      carriers, 34.5% in relatives), related to age (38.4% <40 versus 68.6% ≥40
      years, P<0.001), and was greater in males than females (65.1% versus 48.1%,
      P=0.03).
    explanation: >-
      Quantifies the defining features of the heterozygous subtype - incomplete,
      age-related and male-biased penetrance - in a large family series of MYBPC3
      mutation carriers.
  - reference: PMID:39581692
    reference_title: "Hypertrophic cardiomyopathy due to truncating variants in myosin binding protein C: a Spanish cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypertrophy was discrete with a significative difference between probands
      and relatives (17.5±4 mm vs 14.6±5 mm; p<0.0001). Ejection fraction was
      predominantly preserved (65%±10%).
    explanation: >-
      A molecularly homogeneous truncating-MYBPC3 cohort documents the discrete
      hypertrophy and preserved systolic function that characterise the monoallelic
      subtype.
- name: Biallelic CMH4
  display_name: Biallelic (homozygous/compound heterozygous) MYBPC3 neonatal cardiomyopathy
  description: >-
    The severe neonatal form named in the MONDO definition of hypertrophic
    cardiomyopathy 4. Two truncating MYBPC3 alleles abolish cMyBP-C, producing
    severe cardiomyopathy presenting in the first days to weeks of life, commonly
    with left ventricular noncompaction features and septal defects, and death
    from cardiac failure within the first months. Parents, as obligate
    heterozygotes, are typically asymptomatic or have mild adult-onset disease.
  evidence:
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to heterozygous pathogenic mutations, homozygous or compound
      heterozygous truncating pathogenic MYBPC3 mutations cause severe neonatal
      cardiomyopathy with features of left ventricular noncompaction and septal
      defects in approximately 60% of patients.
    explanation: >-
      States the mono- versus bi-allelic contrast explicitly and defines the
      biallelic subtype as severe neonatal cardiomyopathy with noncompaction and
      septal defects.
  - reference: PMID:41488457
    reference_title: "Case Report: Lethal neonatal hypertrophic cardiomyopathy from compound heterozygous MYBPC3 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bi-allelic pathogenic variants in MYBPC3 cause a rare and lethal neonatal
      form of hypertrophic cardiomyopathy (HCM) that often evades detection during
      routine prenatal screening.
    explanation: >-
      Independently characterises the biallelic MYBPC3 entity as a rare, lethal
      neonatal form of HCM, corroborating the subtype definition.
inheritance:
- name: Autosomal dominant (monoallelic truncating variants)
  description: >-
    The classic CMH4 presentation is autosomal dominant, with a single truncating
    MYBPC3 allele acting through cMyBP-C haploinsufficiency. Penetrance is
    incomplete and strongly age-dependent, and is higher in male than in female
    carriers, so cascade screening must be longitudinal rather than a single
    evaluation.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  penetrance_percentage: "56.9%"
  evidence:
  - reference: CGGV:assertion_7e65896e-33f5-439d-8749-aba08a539dd0-2021-10-07T160000.000Z
    reference_title: "MYBPC3 / hypertrophic cardiomyopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MYBPC3 | HGNC:7551 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Definitive"
    explanation: >-
      ClinGen's Hereditary Cardiovascular Disease Gene Curation Expert Panel
      classifies the MYBPC3-hypertrophic cardiomyopathy relationship as Definitive
      with autosomal dominant inheritance.
  - reference: PMID:22267749
    reference_title: "Cardiac myosin binding protein-C mutations in families with hypertrophic cardiomyopathy: disease expression in relation to age, gender, and long term outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease penetrance was, therefore, incomplete (56.9% in all mutation
      carriers, 34.5% in relatives), related to age (38.4% <40 versus 68.6% ≥40
      years, P<0.001), and was greater in males than females (65.1% versus 48.1%,
      P=0.03).
    explanation: >-
      Source of the 56.9% overall penetrance figure and of the age- and
      sex-dependence of expression in heterozygous MYBPC3 carriers.
  - reference: PMID:37929589
    reference_title: "Meta-Analysis of Penetrance and Systematic Review on Transition to Disease in Genetic Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Penetrance varied from ≈32% for MYL3 (myosin light chain 3) to ≈55% for
      MYBPC3 (myosin-binding protein C3)
    explanation: >-
      Meta-analytic, MYBPC3-specific penetrance estimate of about 55% among
      relatives carrying a P/LP variant, consistent with the family-series figure.
  - reference: PMID:37929589
    reference_title: "Meta-Analysis of Penetrance and Systematic Review on Transition to Disease in Genetic Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The penetrance of HCM in incidentally identified P/LP variant carriers was
      also substantially lower at ≈11%, ranging from 0% in Atherosclerosis Risk in
      Communities to 18% in UK Biobank.
    explanation: >-
      Critical ascertainment caveat: penetrance measured in clinically ascertained
      families (~55-57%) is roughly fivefold higher than in incidentally
      identified population carriers (~11%), so family-based penetrance figures
      must not be quoted to an incidentally genotyped individual.
- name: Autosomal recessive (biallelic truncating variants)
  description: >-
    When two truncating MYBPC3 alleles are inherited - homozygously (typically in
    founder populations or consanguineous families) or as compound heterozygotes -
    cMyBP-C is effectively absent and the phenotype is a severe, usually lethal
    neonatal cardiomyopathy. The heterozygous parents are asymptomatic or mildly
    affected, so the dose effect behaves recessively at the neonatal-severity
    threshold even though the heterozygous state is itself a dominant disease
    allele.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients with biallelic truncating pathogenic mutations in MYBPC3
      reported so far (n=21) were diagnosed with severe cardiomyopathy and/or died
      within the first few months of life.
    explanation: >-
      Establishes that the biallelic genotype is uniformly severe across all
      reported cases, defining the recessive-severity arm of this entity.
  - reference: PMID:41488457
    reference_title: "Case Report: Lethal neonatal hypertrophic cardiomyopathy from compound heterozygous MYBPC3 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES identified compound heterozygous pathogenic variants in MYBPC3: a known
      paternal splice-site variant (c.2905+1G>A) and a novel maternal truncating
      frameshift variant (c.836del; p.Gly279Valfs*21).
    explanation: >-
      Documents biparental inheritance of two loss-of-function MYBPC3 alleles in a
      lethal neonatal case, the compound-heterozygous route to the biallelic
      phenotype.
prevalence:

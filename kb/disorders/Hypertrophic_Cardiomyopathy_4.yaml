notes: >-
  Scope note: this entry is the MYBPC3 gene-specific entity (MONDO:0007268), not
  the HCM umbrella. The umbrella entry Hypertrophic_Cardiomyopathy
  (MONDO:0005045) carries the cross-gene phenotype and treatment picture; content
  here is deliberately restricted to what is specific to MYBPC3 dose biology and
  to the two clinical poles it produces.

  Terminology note: the MONDO definition frames MONDO:0007268 as "an autosomal
  dominant condition ... characterized by severe neonatal hypertrophic
  cardiomyopathy". That phrasing conflates the two poles of a single dose
  spectrum: the autosomal dominant statement describes the common heterozygous
  disease, while severe neonatal HCM is specifically the biallelic
  (homozygous/compound heterozygous) presentation. This entry models both
  explicitly as subtypes rather than reproducing the conflation, and records
  separate inheritance blocks for each.

  Unsourced/limited-evidence items intentionally omitted: no
  population-based prevalence for the MYBPC3-specific entity exists, so
  prevalence is recorded as NOT_YET_DOCUMENTED rather than estimated; frequency
  bands were omitted for phenotypes with no quantitative denominator in the cited
  abstracts. Beta-blocker, verapamil and disopyramide therapy, and the fetal /
  prenatal detection question, are HCM-general or under-evidenced at the MYBPC3
  genotype level and are left to the umbrella entry.


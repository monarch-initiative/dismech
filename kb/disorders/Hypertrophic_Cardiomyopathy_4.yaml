  - reference: PMID:32841044
    reference_title: "Spatial and Functional Distribution of MYBPC3 Pathogenic Variants and Clinical Outcomes in Patients With Hypertrophic Cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      time-event analysis was performed (composite clinical outcome of sudden
      death, class III/IV heart failure, left ventricular assist
      device/transplant, atrial fibrillation)
    explanation: >-
      Shows transplantation and mechanical support tracked as clinical endpoints
      in a large genotyped MYBPC3 cohort. PARTIAL because it establishes that
      these events occur and are counted, not a transplantation rate or outcome.
  notes: >-
    Applies chiefly to the Biallelic CMH4 subtype, and to the minority of
    monoallelic carriers reaching end-stage disease. No published series reports
    transplantation outcomes in biallelic MYBPC3 disease specifically; the
    reasoning here is from the documented natural history and the absence of any
    disease-modifying alternative at that pole, not from a MYBPC3 transplant
    cohort.
- name: Anticoagulation for Atrial Fibrillation
  description: >-
    Anticoagulation in hypertrophic cardiomyopathy with atrial fibrillation is
    not gated on the conventional risk scores used in non-HCM atrial
    fibrillation - the thromboembolic risk conferred by the HCM substrate itself
    is high enough that anticoagulation is indicated on the arrhythmia alone.
    Included here because it is the management consequence of the atrial
    fibrillation phenotype curated in this entry, and because applying the
    ordinary risk-score gate is a common and consequential error.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

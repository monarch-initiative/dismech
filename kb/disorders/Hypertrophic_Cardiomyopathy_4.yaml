pathophysiology:
- name: MYBPC3 Truncating Variant and Premature Termination Codon Generation
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The initiating lesion in CMH4 is a MYBPC3 allele carrying a frameshift,
    nonsense, or splice-disrupting change that introduces a premature termination
    codon. A distinctive feature of MYBPC3 relative to other sarcomere disease
    genes is how many of its pathogenic variants sit in introns and act by
    aberrant splicing. Despite the frameshift, the predicted truncated cMyBP-C
    peptide has never been detected in human heart tissue from carriers, arguing
    against a dominant-negative poison-peptide mechanism at the protein level.
  genes:
  - preferred_term: MYBPC3
    term:
      id: hgnc:7551
      label: MYBPC3
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Sarcomere Organization
    term:
      id: GO:0045214
      label: sarcomere organization
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: Sarcomeric A band
    term:
      id: GO:0031672
      label: A band
  evidence:
  - reference: PMID:22057632
    reference_title: "How do MYBPC3 mutations cause hypertrophic cardiomyopathy?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most striking characteristic of HCM mutations in MYBPC3 is that many are
      within introns and are predicted to cause aberrant splicing leading to a
      frameshift and a premature chain termination, yet the truncated peptides
      have never been identified in human heart tissue carrying these mutations.
    explanation: >-
      Establishes the variant class (intronic/splice-disrupting, frameshift,
      premature termination) and the absence of detectable truncated peptide in
      patient myocardium. Evidence source is OTHER because this is a mechanistic
      review.
  downstream:
  - target: cMyBP-C Depletion by Nonsense-Mediated Decay and Proteasomal Degradation
    causal_link_type: DIRECT
    description: >-
      Premature termination codons trigger surveillance pathways that destroy the
      mutant transcript and protein rather than producing a stable truncated
      product.
- name: cMyBP-C Depletion by Nonsense-Mediated Decay and Proteasomal Degradation
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    Because the truncated peptide is not stably expressed, the operative
    consequence of a MYBPC3 truncating allele is a reduction in the amount of
    functional cMyBP-C in the sarcomere. Nonsense-mediated mRNA decay removes the
    PTC-containing transcript - measurably starting at the mRNA level in patient
    myocardium despite hypertrophy-driven upregulation of transcription - and the
    ubiquitin-proteasome system clears residual mutant protein. UPF3B, an NMD
    regulator upregulated specifically in MYBPC3-truncating hearts and localised
    to the sarcomeric Z-disc, has been implicated in establishing this
    haploinsufficiency during the first round of sarcomeric protein translation.
    The severity of the resulting phenotype scales with the residual cMyBP-C dose,
    which is what makes CMH4 a gene-dosage disease.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Nonsense-Mediated mRNA Decay
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
    modifier: INCREASED
  - preferred_term: Proteasomal Degradation of Mutant cMyBP-C
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:22057632
    reference_title: "How do MYBPC3 mutations cause hypertrophic cardiomyopathy?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Instead of expression of a poison peptide we consistently observe
      haploinsufficiency of MyBP-C in MYBPC3 mutant human heart muscle.
    explanation: >-
      States the core mechanistic claim - haploinsufficiency rather than a
      dominant-negative poison peptide - directly in human myocardium. Evidence
      source is OTHER because this is a mechanistic review.
  - reference: PMID:19574547
    reference_title: "Evidence from human myectomy samples that MYBPC3 mutations cause hypertrophic cardiomyopathy through haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence of any detectable truncated MyBP-C argues against its
      incorporation in the myofiber and any dominant negative effect. In
      contrast, the lowered relative level of full length protein in both
      truncation and missense MYBPC3 mutations argues strongly that
      haploinsufficiency is sufficient to cause the disease.
    explanation: >-
      Primary human data, not review: quantified myofibrillar MyBP-C in
      genotyped myectomy specimens against donor hearts and found reduced
      full-length protein with no detectable truncated peptide. This is the
      direct measurement the haploinsufficiency claim rests on.
  - reference: PMID:19574547
    reference_title: "Evidence from human myectomy samples that MYBPC3 mutations cause hypertrophic cardiomyopathy through haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the overall level of MyBP-C in myofibrils was significantly
      reduced (P<0.0005) in tissue containing either a truncation or missense
      MYBPC3 mutation
    explanation: >-
      Gives the quantitative reduction in myofibrillar cMyBP-C in patient
      tissue, and notes it holds for missense as well as truncating alleles.
  - reference: PMID:37797718
    reference_title: "Nonsense mediated decay factor UPF3B is associated with cMyBP-C haploinsufficiency in hypertrophic cardiomyopathy patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that cMyBP-C haploinsufficiency starts at the mRNA level, despite
      hypertrophy-induced increased transcriptional activity.
    explanation: >-
      Localises the origin of haploinsufficiency to transcript destruction in
      patient myocardium, evidence obtained from human HCM cardiac tissue with
      MYBPC3 truncating variants.
  - reference: PMID:37797718
    reference_title: "Nonsense mediated decay factor UPF3B is associated with cMyBP-C haploinsufficiency in hypertrophic cardiomyopathy patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data suggest that cMyBP-C haploinsufficiency in HCM-patients is
      established by UPF3B-dependent NMD during the initial translation round at
      the Z-disc.
    explanation: >-
      Identifies UPF3B-dependent nonsense-mediated decay as the specific
      surveillance route producing cMyBP-C haploinsufficiency.
  - reference: PMID:38406555
    reference_title: "Hypertrophic cardiomyopathy in MYBPC3 carriers in aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathogenesis related to MYBPC3 mutations includes nonsense-mediated decay,
      alternative splicing, and ubiquitin-proteasome system events, leading to
      allelic imbalance and haploinsufficiency.
    explanation: >-
      Names all three degradation/surveillance routes converging on allelic
      imbalance and haploinsufficiency. Evidence source is OTHER because this is a
      narrative review.
  downstream:
  - target: Myosin Shift from the Super-Relaxed to the Disordered-Relaxed State
    causal_link_type: DIRECT
    description: >-
      Reduced cMyBP-C in the A band leaves myosin heads untethered from the
      thick filament core, depopulating the energy-conserving super-relaxed
      reserve.
- name: Myosin Shift from the Super-Relaxed to the Disordered-Relaxed State
  biological_scale: MOLECULAR
  role: effector
  description: >-
    In the resting sarcomere a substantial fraction of myosin heads sit in the
    super-relaxed (SRX) state - folded back against the thick filament core with
    a very low ATPase rate - forming an energy-conserving reserve of motors that
    are unavailable for force generation. cMyBP-C is what holds them there.
    Losing cMyBP-C untethers those heads and shifts the population toward the
    disordered-relaxed (DRX) state, which can hydrolyse ATP and engage the thin
    filament. This is the step that converts a protein-dose deficit into
    hypercontractility with raised energetic cost, and it is the step the
    approved cardiac myosin inhibitors act on: the same work that defines the
    SRX loss shows that MYK-461 (mavacamten) rescues the relaxation defect and
    restores normal contractility in MYBPC3-mutant cardiomyocytes. The shift is
    demonstrated in three independent systems - homozygous cMyBP-C knockout
    mouse cardiomyocytes, human MYBPC3-mutant myectomy tissue, and stepwise
    cMyBP-C depletion in vitro - and, importantly for the dose model, the human
    myectomy data show a positive correlation between residual cMyBP-C
    expression and the proportion of heads remaining in SRX.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: ATP Hydrolysis by Myosin
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: INCREASED
  cellular_components:
  - preferred_term: Myosin thick filament
    term:
      id: GO:0032982
      label: myosin filament
  evidence:
  - reference: PMID:28658286
    reference_title: "MYBPC3 mutations are associated with a reduced super-relaxed state in patients with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to donors, only MYBPC3mut samples display a significantly
      diminished SRX, characterised by a decrease in both the number of myosin
      heads in the SRX and the lifetime of ATP turnover.
    explanation: >-
      Demonstrates SRX loss in human myectomy tissue and, critically, shows it
      is specific to MYBPC3-mutation-positive hearts rather than a generic
      consequence of hypertrophy - sarcomere-mutation-negative HCM samples did
      not show it.
  - reference: PMID:28658286
    reference_title: "MYBPC3 mutations are associated with a reduced super-relaxed state in patients with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was a positive correlation (p < 0.01) between the expression of
      cMyBP-C and the proportion of myosin heads in the SRX state, suggesting
      cMyBP-C modulates and maintains the SRX.
    explanation: >-
      Ties the size of the SRX reserve quantitatively to residual cMyBP-C
      protein level, which is the molecular expression of the gene-dosage
      gradient this entry models.
  - reference: PMID:27021517
    reference_title: "Ablation of cardiac myosin binding protein-C disrupts the super-relaxed state of myosin in murine cardiomyocytes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We report a significant decrease in the proportion of myosin heads in the
      SRX state in homozygous cMyBP-C knockout mice, however heterozygous
      cMyBP-C knockout mice do not significantly differ from the wild type.
    explanation: >-
      Independent in vivo confirmation in the complete-null state. Note the
      heterozygous result is negative, which is consistent with the
      phenotype-negative heterozygous mouse recorded in the model-mismatch
      discussion rather than with the human heterozygous disease.
  - reference: PMID:30674652
    reference_title: "Hypertrophic cardiomyopathy mutations in MYBPC3 dysregulate myosin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Depletion of cMyBPC also altered dynamic myosin conformations during
      relaxation, enhancing the myosin state that enables ATP hydrolysis and
      thin filament interactions while reducing the super relaxed conformation
      associated with energy conservation.

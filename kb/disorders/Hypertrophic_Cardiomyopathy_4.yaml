references:
- reference: PMID:20301725
  title: "Nonsyndromic Hypertrophic Cardiomyopathy Overview"
  tags:
  - GeneReviews
- reference: PMID:38718139
  title: "2024 AHA/ACC/AMSSM/HRS/PACES/SCMR Guideline for the Management of Hypertrophic Cardiomyopathy: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
- reference: PMID:38258577
  title: "A Promoter Deletion Confirms That MYBPC3 Haploinsufficiency Is Sufficient to Cause Hypertrophic Cardiomyopathy in Humans."
notes: >-
  Scope note: this entry is the MYBPC3 gene-specific entity (MONDO:0007268), not
  the HCM umbrella. The umbrella entry Hypertrophic_Cardiomyopathy
  (MONDO:0005045) carries the cross-gene phenotype and treatment picture; content
  here is deliberately restricted to what is specific to MYBPC3 dose biology and
  to the two clinical poles it produces.

  Terminology note: the MONDO definition frames MONDO:0007268 as "an autosomal
  dominant condition ... characterized by severe neonatal hypertrophic
  cardiomyopathy". That phrasing conflates the two poles of a single dose
  spectrum: the autosomal dominant statement describes the common heterozygous
  disease, while severe neonatal HCM is specifically the biallelic
  (homozygous/compound heterozygous) presentation. This entry models both
  explicitly as subtypes rather than reproducing the conflation, and records
  separate inheritance blocks for each.

  Two references are carried for provenance and are deliberately not mined for
  evidence items, because their PubMed records contain no quotable clinical
  text: the GeneReviews overview (PMID:20301725) is a six-point purpose
  statement, and the 2024 AHA/ACC guideline (PMID:38718139) carries only
  AIM/METHODS/STRUCTURE sections. Several guideline-derived management points in
  this entry - anticoagulation gating in atrial fibrillation, the agents-to-avoid
  list - therefore carry explanatory notes instead of snippets, which is stated
  on each rather than papered over with a citation that does not support the
  claim. A third, PMID:38258577, is the promoter-deletion report that provides
  the cleanest human proof of the haploinsufficiency mechanism; it is a research
  letter with no abstract in the cached record, so the same claim is evidenced
  from PMID:19574547, whose abstract states it directly from myectomy tissue.

  Unsourced/limited-evidence items intentionally omitted: no
  population-based prevalence for the MYBPC3-specific entity exists, so
  prevalence is recorded as NOT_YET_DOCUMENTED rather than estimated; frequency
  bands were omitted for phenotypes with no quantitative denominator in the cited
  abstracts. Beta-blocker, verapamil and disopyramide therapy, and the fetal /
  prenatal detection question, are HCM-general or under-evidenced at the MYBPC3
  genotype level and are left to the umbrella entry.

  Deep-research provenance: the falcon (Edison) provider was requested but is not
  registered in this environment (no EDISON_API_KEY/FUTUREHOUSE_API_KEY; `just
  research-providers` reports only claude_code available), so the deep-research
  step was run with the claude_code provider. All PMIDs were independently
  fetched with `just fetch-reference` and every snippet verified against the
  cached abstract with `just validate-references`.

    term:
      id: GO:0032982
      label: myosin filament
  evidence:
  - reference: PMID:36893011
    reference_title: "cMyBP-C ablation in human engineered cardiac tissue causes progressive Ca2+-handling abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data suggest a progressive phenotype caused by cMyBP-C
      haploinsufficiency and ablation that initially is hypercontractile, but
      progresses to hypocontractility with impaired relaxation.
    explanation: >-
      Isogenic human iPSC-derived engineered cardiac tissue shows that removing
      cMyBP-C produces initial hypercontractility that decays to hypocontractility
      with impaired relaxation, the functional signature of losing the cMyBP-C
      brake.
  - reference: PMID:36893011
    reference_title: "cMyBP-C ablation in human engineered cardiac tissue causes progressive Ca2+-handling abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      After 2 wk of culture in ECT, contractile function was similar between the
      three genotypes; however, Ca2+-release was slower in the setting of reduced
      or absent cMyBP-C.
    explanation: >-
      Links reduced or absent cMyBP-C directly to slowed calcium release in an
      isogenic human model.
  - reference: PMID:32871100
    reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac muscle hypercontractility is a key pathophysiological abnormality in
      hypertrophic cardiomyopathy, and a major determinant of dynamic left
      ventricular outflow tract (LVOT) obstruction.
    explanation: >-
      Confirms hypercontractility as the central pathophysiological abnormality in
      HCM generally and links it to outflow obstruction; PARTIAL because the trial
      population is HCM at large rather than genotyped MYBPC3 carriers.
  downstream:
  - target: Gene-Dosage-Dependent Severity Gradient
    causal_link_type: DIRECT
    description: >-
      The magnitude of the contractile derangement tracks the residual cMyBP-C
      dose, which is set by whether one or both MYBPC3 alleles are truncating.
- name: Gene-Dosage-Dependent Severity Gradient
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    CMH4 severity is a graded function of residual cMyBP-C, and this is the axis
    that separates the two clinical entities within the same MONDO term. One
    truncating allele leaves roughly half-normal cMyBP-C and yields the classic
    late-onset dominant disease with incomplete penetrance. Two truncating alleles
    leave essentially none and yield severe cardiomyopathy in the neonatal period.
    Isogenic human engineered cardiac tissue and heterozygous/homozygous knock-in
    mouse models both reproduce this dose-severity relationship, providing
    experimental confirmation of the human genotype-phenotype pattern.
  cell_types:
  - preferred_term: Cardiomyocyte

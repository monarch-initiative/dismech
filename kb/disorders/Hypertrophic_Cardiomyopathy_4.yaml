name: Hypertrophic Cardiomyopathy 4
creation_date: "2026-08-01T00:00:00Z"
synonyms:
- CMH4
- MYBPC3 hypertrophic cardiomyopathy
- cardiomyopathy, familial hypertrophic, 4
- familial hypertrophic cardiomyopathy type 4
- hypertrophic cardiomyopathy caused by mutation in MYBPC3
description: >-
  Hypertrophic cardiomyopathy 4 (CMH4) is the MYBPC3-related form of familial
  hypertrophic cardiomyopathy. MYBPC3 encodes cardiac myosin-binding protein C
  (cMyBP-C), a thick-filament accessory protein of the sarcomeric A band that
  restrains actin-myosin cross-bridge cycling and tunes the contraction-relaxation
  cycle. MYBPC3 is the single most frequently mutated gene in hypertrophic
  cardiomyopathy, and most disease alleles are truncating (frameshift, nonsense,
  or splice variants generating a premature termination codon). Truncated peptide
  is not detectable in patient myocardium; instead nonsense-mediated mRNA decay
  and ubiquitin-proteasome degradation lower functional cMyBP-C, so the operative
  mechanism is a protein dose problem rather than a poison peptide.
  CMH4 is therefore best understood as a gene-dosage disease with two distinct
  clinical entities at the two ends of the allelic dose range. Monoallelic
  (heterozygous) truncating variants cause cMyBP-C haploinsufficiency and the
  classic autosomal dominant adult-onset phenotype: incomplete, age-related and
  sex-biased penetrance, discrete left ventricular hypertrophy, largely preserved
  ejection fraction, and a comparatively low event rate. Biallelic (homozygous or
  compound heterozygous) truncating variants abolish cMyBP-C and cause the severe
  neonatal hypertrophic cardiomyopathy highlighted in the MONDO definition of this
  entity — presenting in the first days-to-weeks of life with feeding difficulty,
  failure to thrive and dyspnea, frequently accompanied by left ventricular
  noncompaction features and septal defects, and usually fatal within the first
  few months. Founder truncating alleles (the Dutch c.2373dup, the Amish/Swiss
  c.3330+2T>G splice variant, and the South Asian 25-bp deletion) concentrate both
  the dominant and the recessive presentations in specific populations.
category: Genetic

    term:
      id: HP:0005110
      label: Atrial fibrillation
  notes: >-
    Deliberately unsourced at the MYBPC3 level, and flagged as such rather than
    given a borrowed citation. This is guideline-directed management for
    hypertrophic cardiomyopathy with atrial fibrillation (2024 AHA/ACC
    guideline, PMID:38718139, carried in the top-level references), whose PubMed
    record holds only AIM/METHODS/STRUCTURE text with no quotable recommendation.
    No MYBPC3-specific anticoagulation study exists. The agent is bound at class
    level because the choice between a direct oral anticoagulant and a vitamin K
    antagonist is not genotype-determined.
- name: Agents to Avoid in Obstructive Physiology
  description: >-
    A negative treatment recommendation, recorded because in obstructive
    hypertrophic cardiomyopathy the wrong drug actively worsens the
    haemodynamics. Vasodilators, nitrates, dihydropyridine calcium channel
    blockers, digoxin and aggressive diuresis all increase the dynamic outflow
    gradient - the first four by reducing afterload or raising contractility,
    diuresis by reducing preload and ventricular cavity size. The mechanism is
    the mirror image of the one that makes negative inotropes useful here, so the
    contraindication follows from the same physiology this entry models.
  therapeutic_modality: OTHER
  notes: >-
    Deliberately carries no treatment_term and no evidence item. There is no
    NCIT clinical-action term for a class of agents to avoid, and the underlying
    recommendation comes from the 2024 AHA/ACC guideline (PMID:38718139), whose
    cached PubMed record contains only AIM/METHODS/STRUCTURE sections with no
    quotable recommendation text. It is recorded as prose rather than omitted
    because a knowledge base that lists what to give without listing what
    actively harms is misleading by omission - but it is marked here as
    guideline-derived and unsourceable at snippet level rather than dressed up
    with a citation that does not support it.
- name: Genetic Counseling and Cascade Screening
  description: >-

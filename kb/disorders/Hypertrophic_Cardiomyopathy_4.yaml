- name: Atrial Fibrillation
  category: Cardiovascular
  description: >-
    Atrial fibrillation is a major morbidity of this disease and the route to its
    leading non-sudden complication, cardioembolic stroke. It matters
    disproportionately here because its presence mandates anticoagulation
    irrespective of conventional risk scoring, so it changes management rather
    than merely describing severity. In the MYBPC3-specific registry analysis it
    is counted as a component of the adverse composite outcome alongside sudden
    death, class III/IV heart failure and transplant.
  phenotype_term:
    preferred_term: Atrial fibrillation
    term:
      id: HP:0005110
      label: Atrial fibrillation
  subtype: Monoallelic CMH4
  notes: >-
    Frequency band deliberately omitted. The commonly cited HCM figures (about
    20% overall, rising with age) come from the GeneReviews overview, whose
    PubMed record is a purpose statement with no quotable clinical text, and no
    MYBPC3-specific denominator for atrial fibrillation appears in any cached
    source. The association is evidenced here; the rate is not.
  evidence:
  - reference: PMID:32841044
    reference_title: "Spatial and Functional Distribution of MYBPC3 Pathogenic Variants and Clinical Outcomes in Patients With Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      time-event analysis was performed (composite clinical outcome of sudden
      death, class III/IV heart failure, left ventricular assist
      device/transplant, atrial fibrillation)
    explanation: >-
      Establishes atrial fibrillation as one of the adverse clinical outcomes
      tracked in a genotyped MYBPC3 cohort of 1316 patients.
  - reference: PMID:38406555
    reference_title: "Hypertrophic cardiomyopathy in MYBPC3 carriers in aging."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      pathogenic sarcomere variants exacerbate existing conditions, such as
      ventricular arrhythmia, HF, atrial fibrillation (AF), stroke, or even
      death in HCM individuals
    explanation: >-
      Places atrial fibrillation and its stroke sequel among the conditions
      aggravated by sarcomere variants. PARTIAL because it is a narrative review
      statement about sarcomeric HCM broadly rather than a MYBPC3 measurement.
- name: Syncope
  category: Cardiovascular
  description: >-
    Syncope is part of the clinical spectrum of this disease and carries weight
    beyond symptom burden: unexplained syncope is a risk marker in both the
    AHA/ACC and HCM Risk-SCD approaches to sudden-death stratification, so it
    feeds directly into the ICD decision this entry curates.
  phenotype_term:
    preferred_term: Syncope
    term:
      id: HP:0001279
      label: Syncope
  subtype: Monoallelic CMH4
  notes: >-
    Frequency deliberately omitted - no cached MYBPC3 source reports a syncope
    rate. Its inclusion here is justified by its role in risk stratification, not
    by a quantified prevalence.
  evidence:
  - reference: PMID:38406555
    reference_title: "Hypertrophic cardiomyopathy in MYBPC3 carriers in aging."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Diverse phenotypic expression and naturally variable progression of HCM
      are reflections of a range of clinical manifestations from dyspnea and/or
      syncope to sudden cardiac death.
    explanation: >-
      Places syncope within the clinical manifestation range of hypertrophic
      cardiomyopathy in a MYBPC3-focused review. PARTIAL because the statement
      is about HCM generally rather than a MYBPC3-specific frequency.
- name: Feeding Difficulties in Infancy
  category: Gastrointestinal
  description: >-
    Feeding difficulty is one of the presenting features of the biallelic neonatal

- name: Cell-Autonomous Cardiac Fibroblast Activation by MYBPC3 Deficiency
  biological_scale: CELLULAR
  role: amplifier
  mechanism_confidence: PROVISIONAL
  description: >-
    A parallel, non-cardiomyocyte route to the fibrosis in this disease. MYBPC3
    has been treated as cardiomyocyte-specific, and fibrosis in HCM as a
    secondary response to myocyte stress. Work in a base-edited R495Q pig model
    found early-onset myocardial fibrosis shortly after birth and, unexpectedly,
    that MYBPC3 is transcribed and translated in cardiac fibroblasts themselves;
    disrupting Mybpc3 in fibroblasts activated NF-kB signalling, raised
    TGF-beta1 and pro-inflammatory gene expression, and drove a HIF-1-alpha
    glycolytic shift that accelerated fibroblast activation. If this holds in
    human disease, part of the fibrotic burden is cell-autonomous to the
    fibroblast rather than a downstream reaction to myocyte dysfunction - which
    would make it a separate therapeutic target from myosin inhibition.

histopathology:
- name: Myocyte Disarray
  description: >-
    Myofibre disarray - the loss of the normal parallel alignment of
    cardiomyocytes, with hypertrophied fibres running obliquely and in whorls
    amid disordered connective tissue - is the pathognomonic histological lesion
    of hypertrophic cardiomyopathy and the tissue-level substrate for both the
    arrhythmic risk and the diastolic dysfunction modeled in this entry. It is
    documented directly in MYBPC3 disease in septal myocardium from an adult
    homozygous for the Indian 25-bp deletion, described as swirling of
    hypertrophied myofibres amid connective tissue disarray, and in the same
    family's series as hypertrophied myofibres separated by increased connective
    tissue.
  finding_term:
    preferred_term: myofibre disarray
    term:
      id: NCIT:C35867
      label: Morphologic Finding
  evidence:
  - reference: PMID:19151713
    reference_title: "A common MYBPC3 (cardiac myosin binding protein C) variant associated with cardiomyopathies in South Asia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histopathological section of the septal myocardium of the same individual
      showing 'swirling' of hypertrophied myofibers amid connective tissue
      disarray
    explanation: >-
      Direct histological documentation of disarray in the septum of a genotyped
      MYBPC3 homozygote.
  - reference: PMID:19151713
    reference_title: "A common MYBPC3 (cardiac myosin binding protein C) variant associated with cardiomyopathies in South Asia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histopathological section of the same subject showing hypertrophied
      myofibers separated from each other by increased connective tissue
    explanation: >-
      Companion documentation of hypertrophied fibres separated by expanded
      interstitial connective tissue in a MYBPC3 deletion carrier.
  notes: >-
    The finding_term is bound only to the generic NCIT Morphologic Finding
    parent. NCIT has no myofibre-disarray term, and HP:0031318 Myofiber disarray
    - the precise term - is not reachable from the HistopathologyFindingTerm
    enum roots, since its ancestors run through HP:0001637 Abnormal myocardium
    morphology rather than HP:0025461 Abnormal cell morphology. The specific
    meaning is therefore carried by preferred_term. This is a genuine ontology
    gap and a candidate NTR rather than a curation shortcut. See also the
    model-mismatch discussion: this lesion is documented in humans but is not
    reported in the mouse models this entry curates.
- name: Myocardial Fibrosis
  description: >-
    Extensive myocardial necrosis and interstitial/replacement fibrosis are found
    at autopsy in biallelic MYBPC3 neonatal cardiomyopathy.
  finding_term:
    preferred_term: Myocardial fibrosis
    term:
      id: NCIT:C178564
      label: Cardiac Fibrosis
  subtype: Biallelic CMH4
  evidence:
  - reference: PMID:41488457
    reference_title: "Case Report: Lethal neonatal hypertrophic cardiomyopathy from compound heterozygous MYBPC3 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Postmortem examination revealed severe HCM, an atrial septal defect (ASD),
      and extensive myocardial necrosis and fibrosis.
    explanation: >-
      Direct histopathological documentation of necrosis and fibrosis in biallelic
      MYBPC3 disease.
- name: Endomyocardial Fibroelastosis
  description: >-
    Endomyocardial fibroelastosis with a massively enlarged heart has been
    documented at autopsy as the histopathological substrate of sudden unexpected
    infant death caused by two biparental MYBPC3 mutations.
  finding_term:
    preferred_term: Endomyocardial fibroelastosis
  subtype: Biallelic CMH4
  notes: >-
    term: deliberately omitted. This finding previously carried NCIT:C178564
    Cardiac Fibrosis, the same term as the Myocardial Fibrosis entry above, but
    endomyocardial fibroelastosis is a distinct entity - a thickened,
    fibroelastic endocardial layer - and not a subtype of myocardial fibrosis,
    so binding both findings to one term collapsed a real distinction and made
    two different lesions look identical to any downstream consumer. NCIT has no
    endomyocardial fibroelastosis term reachable from the
    HistopathologyFindingTerm roots. An unbound preferred_term is the honest
    representation and this is a candidate NTR.
  evidence:
  - reference: PMID:33849460
    reference_title: "A rare cause of sudden unexpected death syndrome (SUDS) in the first year of life: endomyocardial fibroelastosis (EFE) due to two compound heterozygous MYBPC3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autopsy and thorough postmortem cardiac examinations revealed a massively
      enlarged heart with endomyocardial fibroelastosis.
    explanation: >-
      Endomyocardial fibroelastosis is the reported autopsy finding in this
      biallelic MYBPC3 infant death.
biochemical:
- name: NT-proBNP
  presence: Elevated
  context: >-
    Heart-failure severity marker, and the pharmacodynamic readout of cardiac
    myosin inhibition. N-terminal pro-B-type natriuretic peptide tracks
    heart-failure severity and falls steeply under cardiac myosin inhibition -
    in SEQUOIA-HCM the geometric mean proportional change to week 24 was 0.20 on
    aficamten against 1.00 on placebo, an approximately fivefold reduction
    against no change. That makes it the practical objective marker of response
    to the drug class this entry wires to the super-relaxed-state node.
  biomarker_term:
    preferred_term: N-terminal pro-B-type natriuretic peptide
    term:
      id: HP:0031185
      label: Elevated circulating NT-proBNP concentration
  evidence:
  - reference: PMID:38739079
    reference_title: "Aficamten for Symptomatic Obstructive Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the geometric mean proportional change from baseline to week 24 in the
      serum NT-proBNP level
    explanation: >-
      Identifies NT-proBNP as a measured endpoint in the phase 3 aficamten
      trial; the accompanying reported values are 0.20 on aficamten versus 1.00
      on placebo.
  notes: >-
    Deliberately scoped to the treatment-response and heart-failure-severity
    role, which is what the cited trial evidence supports. This entry does NOT
    claim that NT-proBNP or high-sensitivity troponin are elevated in
    genotype-positive, phenotype-negative MYBPC3 carriers. That claim was
    proposed during review citing PMID:31877118, but that paper is an iPSC
    cardiomyocyte study of protein-level compensation and reports no patient
    biomarker data at all - it is cited in this entry where it does belong, in
    the haploinsufficiency-sufficiency discussion. A preclinical-biomarker claim
    would need a carrier cohort with measured analytes, which no cached source
    here provides.
genetic:
- name: MYBPC3
  gene_term:
    preferred_term: MYBPC3
    term:
      id: hgnc:7551
      label: MYBPC3
  relationship_type: CAUSATIVE
  notes: >-
    MYBPC3 encodes cardiac myosin-binding protein C. It is the single most
    frequently mutated gene in hypertrophic cardiomyopathy and the defining gene of
    this MONDO entity. ClinGen's Hereditary Cardiovascular Disease Gene Curation
    Expert Panel rates the gene-disease relationship Definitive with autosomal
    dominant inheritance; biallelic loss additionally produces the severe neonatal
    form.
  frequency: >-
    About half of identified HCM mutations lie in MYBPC3; within MYBPC3 itself,
    truncating variants account for 91% of pathogenic variants.
  evidence:
  - reference: PMID:32841044
    reference_title: "Spatial and Functional Distribution of MYBPC3 Pathogenic Variants and Clinical Outcomes in Patients With Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Truncating variants account for 91% of MYBPC3 pathogenic variants and
      cause similar clinical severity and outcomes regardless of location,
      consistent with locus-independent loss-of-function.
    explanation: >-
      Quantifies the truncating share within MYBPC3 in 1316 genotyped patients
      from the Sarcomeric Human Cardiomyopathy Registry, and supplies the
      strongest genetic argument for the loss-of-function model curated here:
      if severity were driven by a truncated peptide, outcome would depend on
      where in the gene the truncation falls. It does not.
  - reference: PMID:32841044
    reference_title: "Spatial and Functional Distribution of MYBPC3 Pathogenic Variants and Clinical Outcomes in Patients With Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      C10 mutant MyBP-C failed to incorporate into myofilaments and degradation
      rates were accelerated by ≈90%, while C3 and C6 mutant MyBP-C incorporated
      normally with degradation rate similar to wild-type.
    explanation: >-
      Shows that a subset of the minority non-truncating variants also converge
      on loss of function, by failing to incorporate into the myofilament and
      being degraded - extending the dose model beyond the truncating class
      without claiming it covers all missense alleles.
  - reference: CGGV:assertion_7e65896e-33f5-439d-8749-aba08a539dd0-2021-10-07T160000.000Z
    reference_title: "MYBPC3 / hypertrophic cardiomyopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MYBPC3 | HGNC:7551 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Definitive"
    explanation: >-
      ClinGen gene-disease validity assertion for MYBPC3 and hypertrophic
      cardiomyopathy.
  - reference: PMID:22057632
    reference_title: "How do MYBPC3 mutations cause hypertrophic cardiomyopathy?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is well established that MYBPC3 mutations are the most common cause of
      hypertrophic cardiomyopathy, accounting for about half of identified
      mutations.
    explanation: >-
      Source for the "about half of identified mutations" case-share statement.
      Evidence source is OTHER because this is a mechanistic review.
  - reference: PMID:40038304
    reference_title: "AAV9-mediated MYBPC3 gene therapy with optimized expression cassette enhances cardiac function and survival in MYBPC3 cardiomyopathy models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss-of-function mutations in Myosin Binding Protein C3, MYBPC3, are the most
      common genetic cause of HCM, with the majority of mutations resulting in
      haploinsufficiency.
    explanation: >-
      Confirms the loss-of-function/haploinsufficiency variant class as the
      dominant mechanism. Evidence source is MODEL_ORGANISM because the paper's
      primary data are murine gene-therapy experiments.
variants:
- name: MYBPC3 c.2373dup (p.Trp792fs) - Dutch founder variant
  gene:
    preferred_term: MYBPC3
    term:
      id: hgnc:7551
      label: MYBPC3
  description: >-
    A frameshift founder allele carried by approximately 25% of Dutch HCM patients.
    Heterozygotes have variable adult-onset HCM; homozygotes and compound
    heterozygotes with a second truncating allele have lethal neonatal
    cardiomyopathy.
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients were compound heterozygotes for the pathogenic c.2373dup
      p.(Trp792fs) and c.2827C>T p.(Arg943*) mutations, and two were homozygous for
      the c.2373dup and c.2827C>T mutations.
    explanation: >-
      Documents c.2373dup in both homozygous and compound heterozygous state in
      lethal neonatal cardiomyopathy.
  - reference: PMID:37844837
    reference_title: "Characterization of heterozygous and homozygous mouse models with the most common hypertrophic cardiomyopathy mutation MYBPC3(c.2373InsG) in the Netherlands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients are heterozygous (MYBPC3+/InsG) and have highly variable
      phenotypic expression, whereas homozygous (MYBPC3InsG/InsG) patients have
      severe HCM at a young age.
    explanation: >-
      States the human dose-dependent phenotype of this specific founder allele.
- name: MYBPC3 c.3330+2T>G - Amish/Swiss founder splice variant
  gene:
    preferred_term: MYBPC3
    term:
      id: hgnc:7551
      label: MYBPC3
  description: >-
    An ancient splice-donor founder variant first described in the homozygous state
    in Amish newborns with severe recessive HCM, later recognised as a cause of
    adult-onset dominant HCM in heterozygotes, and now shown to be the most
    prevalent cardiomyopathy variant in western Switzerland. It is a compact
    illustration of the same allele producing both poles of the CMH4 dose
    spectrum.
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:36162733
    reference_title: "The «Amish» NM_000256.3:c.3330+2T>G splice variant in MYBPC3 associated with hypertrophic cardiomyopathy is an ancient Swiss mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One of them, a MYBPC3 splice variant, NM_000256.3:c.3330+2T > G, was first
      described in homozygous state in newborns presenting with a severe, recessive
      form of HCM among the Amish population and was later associated with
      adult-onset dominant HCM in heterozygous carriers.
    explanation: >-
      Single-variant demonstration of the mono- versus bi-allelic dose contrast
      that defines this entity.
  - reference: PMID:36162733
    reference_title: "The «Amish» NM_000256.3:c.3330+2T>G splice variant in MYBPC3 associated with hypertrophic cardiomyopathy is an ancient Swiss mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We here report this splice variant in heterozygous state in eight unrelated
      Swiss families with HCM, making it the most prevalent cardiomyopathy variant
      in western Switzerland.
    explanation: >-
      Establishes the Swiss founder origin and local prevalence of this allele.
- name: MYBPC3 25-bp deletion - South Asian risk allele
  gene:
    preferred_term: MYBPC3
    term:
      id: hgnc:7551
      label: MYBPC3
  description: >-
    A 25-bp intronic deletion carried by approximately 4% of people of Indian
    subcontinental ancestry, associated with heritable cardiomyopathy and increased
    heart-failure risk (combined OR ~7). Unlike the classic truncating founder
    alleles it behaves as a common, incompletely penetrant risk factor rather than
    a fully penetrant Mendelian variant.
  clinical_significance: UNCERTAIN_SIGNIFICANCE
  evidence:
  - reference: PMID:19151713
    reference_title: "A common MYBPC3 (cardiac myosin binding protein C) variant associated with cardiomyopathies in South Asia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a deletion of 25 bp in the gene encoding cardiac myosin
      binding protein C (MYBPC3) that is associated with heritable cardiomyopathies
      and an increased risk of heart failure in Indian populations
    explanation: >-
      Defines the variant and its association with cardiomyopathy and heart failure
      risk in South Asian populations.
diagnosis:
- name: Genetic Testing for MYBPC3 Variants
  description: >-
    Molecular confirmation is what distinguishes CMH4 from other causes of
    unexplained left ventricular hypertrophy, and - critically for this entity -
    determines allelic dose. Trio or family-based testing is required to establish
    whether two variants are in trans, since the biallelic genotype carries an
    entirely different prognosis and reproductive-counselling implication than the
    heterozygous state.
  evidence:
  - reference: PMID:41488457
    reference_title: "Case Report: Lethal neonatal hypertrophic cardiomyopathy from compound heterozygous MYBPC3 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed a full forensic autopsy with detailed histological examination
      and conducted trio-based whole-exome sequencing (WES) on the proband and
      parents to identify the genetic etiology.
    explanation: >-
      Illustrates trio-based sequencing as the method that establishes biparental
      (compound heterozygous) inheritance.
  - reference: PMID:41488457
    reference_title: "Case Report: Lethal neonatal hypertrophic cardiomyopathy from compound heterozygous MYBPC3 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Crucially, the diagnosis guided the clinical management of the asymptomatic
      carrier parents, prompting long-term cardiac surveillance and enabling
      preimplantation genetic testing (PGT) for future family planning.
    explanation: >-
      Documents the downstream family-management value of establishing the
      molecular diagnosis.
- name: Longitudinal Cardiac Surveillance of Genotype-Positive Relatives
  description: >-
    Because penetrance in heterozygous MYBPC3 carriers is incomplete and rises with
    age, a single normal evaluation does not exclude future disease. Serial
    echocardiographic and ECG surveillance of genotype-positive, phenotype-negative
    relatives is the corollary of the age-dependent penetrance data.
  evidence:
  - reference: PMID:22267749
    reference_title: "Cardiac myosin binding protein-C mutations in families with hypertrophic cardiomyopathy: disease expression in relation to age, gender, and long term outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease penetrance was, therefore, incomplete (56.9% in all mutation
      carriers, 34.5% in relatives), related to age (38.4% <40 versus 68.6% ≥40
      years, P<0.001)
    explanation: >-
      The near-doubling of penetrance after age 40 is the direct rationale for
      lifelong rather than one-off screening of carriers.
  - reference: PMID:22267749
    reference_title: "Cardiac myosin binding protein-C mutations in families with hypertrophic cardiomyopathy: disease expression in relation to age, gender, and long term outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Importantly, complex genetic status is observed and should be considered when
      mutation analysis and cascade screening is used in the evaluation of at risk
      family members.
    explanation: >-
      Explicitly warns that multiple variants in one individual must be considered
      during cascade screening - the practical expression of the dose principle.
differential_diagnoses:
- name: Hypertrophic Cardiomyopathy due to other sarcomere genes
  description: >-
    MYH7, TNNT2, TNNI3, TPM1, ACTC1, MYL2 and MYL3 also carry definitive HCM
    gene-disease validity. Distinguishing CMH4 from these requires genetic testing;
    MYBPC3-related disease tends to present later than MYH7-related disease and
    does not have a biallelic neonatal counterpart in most of the other genes.
  disease_term:
    preferred_term: hypertrophic cardiomyopathy
    term:
      id: MONDO:0005045
      label: hypertrophic cardiomyopathy
  evidence:
  - reference: PMID:38406555
    reference_title: "Hypertrophic cardiomyopathy in MYBPC3 carriers in aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This inherited disease is predominantly caused by mutations in sarcomeric
      genes, among which those in the cardiac myosin binding protein-C3 (MYBPC3)
      gene are major contributors.
    explanation: >-
      Places MYBPC3 within the broader sarcomeric HCM differential. Evidence source
      is OTHER because this is a narrative review.
- name: Left Ventricular Noncompaction Cardiomyopathy
  description: >-
    Biallelic MYBPC3 neonatal disease frequently shows hypertrabeculation and can
    be mistaken for primary left ventricular noncompaction cardiomyopathy; the
    accompanying severe hypertrophy, septal defects and the MYBPC3 genotype
    distinguish it.
  evidence:
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Features of left ventricular noncompaction were diagnosed in three patients.
      In the fourth, hypertrabeculation was not a clear feature, but could not be
      excluded.
    explanation: >-
      Documents the noncompaction overlap that creates this differential in
      biallelic neonates.
treatments:
- name: Mavacamten (Cardiac Myosin Inhibitor)
  description: >-
    Mavacamten is a first-in-class allosteric cardiac myosin inhibitor that reduces
    the number of force-generating actin-myosin cross-bridges. Because CMH4 is
    mechanistically a loss of the cMyBP-C brake on cross-bridge cycling,
    pharmacological myosin inhibition is a direct mechanistic counterweight. In
    EXPLORER-HCM it improved exercise capacity, symptoms and outflow gradient in
    symptomatic obstructive HCM. Note the trial enrolled obstructive HCM broadly,
    not a genotyped MYBPC3 cohort.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mavacamten
  notes: >-
    mavacamten deliberately carries no ontology term. NCIT:C174901 Mavacamten
    exists, but its ancestors run through Inotropic Support / Agent /
    Conceptual Entity - it is not reachable from NCIT:C1909 Pharmacologic
    Substance, so it fails the ChemicalEntityTerm enum - and CHEBI has no
    mavacamten term. This was re-checked with OAK during review rather than
    assumed; aficamten, by contrast, is reachable and now carries CHEBI:747213.
    Do not "fix" this by substituting a poorly fitting term.
  target_mechanisms:
  - target: Myosin Shift from the Super-Relaxed to the Disordered-Relaxed State
    treatment_effect: INHIBITS
    description: >-
      Cardiac myosin inhibitors act on the SRX/DRX equilibrium itself, pushing
      myosin heads back into the super-relaxed reserve, rather than on the
      downstream cross-bridge population.
  target_phenotypes:
  - preferred_term: Left ventricular outflow tract obstruction
    term:
      id: HP:0032092
      label: Left ventricular outflow tract obstruction
  evidence:
  - reference: PMID:32871100
    reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      45 (37%) of 123 patients on mavacamten versus 22 (17%) of 128 on placebo met
      the primary endpoint (difference +19·4%, 95% CI 8·7 to 30·1; p=0·0005).
    explanation: >-
      Phase 3 randomised placebo-controlled evidence of benefit on the composite
      functional primary endpoint in symptomatic obstructive HCM.
  - reference: PMID:32871100
    reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients on mavacamten had greater reductions than those on placebo in
      post-exercise LVOT gradient (-36 mm Hg, 95% CI -43·2 to -28·1; p<0·0001)
    explanation: >-
      Demonstrates the mechanistically expected reduction in dynamic outflow
      gradient from inhibiting cross-bridge formation.
- name: Aficamten (Next-Generation Cardiac Myosin Inhibitor)
  description: >-
    Aficamten is a second, oral selective cardiac myosin inhibitor acting on the
    same hypercontractility node as mavacamten. In the phase 3 SEQUOIA-HCM trial
    it improved peak oxygen uptake and met all ten prespecified secondary
    endpoints in symptomatic obstructive HCM. As with mavacamten, the trial
    population was obstructive HCM generally rather than a genotyped MYBPC3
    cohort.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy

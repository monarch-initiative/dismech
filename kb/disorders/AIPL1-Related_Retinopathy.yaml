name: AIPL1-Related Retinopathy
creation_date: "2026-07-22T16:30:00Z"
category: Mendelian
description: >-
  AIPL1-related retinopathy is an autosomal recessive inherited retinal disease
  caused by biallelic pathogenic variants in AIPL1, encoding aryl-hydrocarbon
  receptor interacting protein-like 1, a photoreceptor-specific molecular
  co-chaperone. Unlike the visual-cycle genes RDH5 and RLBP1, AIPL1 has no role in
  chromophore regeneration: its N-terminal FKBP-like domain binds the farnesylated
  PDE6 alpha subunit while its C-terminal tetratricopeptide repeat (TPR) domain
  mediates interaction with the chaperones HSP90 and HSP70, together enabling
  correct folding and assembly of the rod and cone phosphodiesterase-6 (PDE6)
  holoenzyme, the effector that hydrolyzes cGMP during phototransduction. Loss of
  AIPL1 function causes PDE6 misassembly and degradation, with divergent
  downstream consequences in rods (cGMP accumulation driving rapid degeneration)
  versus cones (reduced cGMP synthesis via RetGC1 loss). Biallelic null alleles
  cause classic Leber congenital amaurosis (LCA4), among the most severe forms of
  congenital blindness, while missense or hypomorphic alleles that retain partial
  chaperone function can cause a milder, later-onset early-onset severe retinal
  dystrophy (EOSRD), juvenile retinitis pigmentosa, or dominant cone-rod dystrophy
  phenotype. A first-in-human AAV gene therapy trial in young children with
  classic AIPL1-LCA has reported substantial visual improvement.
disease_term:
  preferred_term: AIPL1-related retinopathy
  term:
    id: MONDO:0100438
    label: AIPL1-related retinopathy
synonyms:
- Leber congenital amaurosis 4
- LCA4
- AIPL1-related cone-rod dystrophy
- AIPL1-related juvenile retinitis pigmentosa
- AIPL1 retinopathy
parents:
- Ophthalmological Disease
- Retinal Dystrophy
- Inherited retinal dystrophy
notes: >-
  AIPL1 mechanistically diverges from RDH5-Related_Retinopathy and
  RLBP1-Related_Retinopathy (both visual-cycle/chromophore-regeneration genes):
  AIPL1 is a phototransduction-effector chaperone, not a visual-cycle protein, so
  vitamin A/retinoid supplementation strategies used or investigated for those
  diseases have no mechanistic rationale here and are not recommended for LCA as a
  class. Two AIPL1 gene-therapy papers from 2009 share superficially similar
  titles; PMID:19299492 (AAV2/2 and AAV2/8 rescue of Aipl1-deficient mice) carries
  three published corrections (2010, 2023, 2024) but is not retracted and remains
  citable, while a separate 2009 Gene Therapy paper on a dual rod/cone promoter
  was formally retracted in 2024 for image-duplication concerns and is
  deliberately not cited in this entry. Reported
  AIPL1 contribution to LCA varies widely by cohort era (from ~20% in an early,
  small, non-representative screen to ~7% in a later 512-proband worldwide
  screen), so no single percentage is treated as definitive.
has_subtypes:
- name: Classic LCA
  display_name: Classic Leber Congenital Amaurosis (Null Alleles)
  description: >-
    Biallelic null (nonsense, frameshift, or splice-disrupting) AIPL1 variants,
    including the recurrent c.421C>T (historically termed W278X) allele, abolish
    AIPL1 chaperone function and cause the classic severe LCA phenotype: severe
    visual impairment or blindness from birth, an extinguished electroretinogram,
    and frequent maculopathy, keratoconus, and cataract.
  evidence:
  - reference: PMID:38880373
    reference_title: Clinical and Molecular Characterization of AIPL1-Associated Leber Congenital Amaurosis/Early-Onset Severe Retinal Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-six patients with LCA harbored two null AIPL1 variants, while 18 were homozygous for c.421C>T and 6 were heterozygous for c.421C>T with another loss-of-function variant."
    explanation: >-
      This 51-patient cohort study establishes biallelic null variants,
      dominated by the recurrent c.421C>T allele, as the genotype underlying
      the classic LCA phenotype.
  - reference: PMID:15249368
    reference_title: The phenotype of Leber congenital amaurosis in patients with AIPL1 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype of LCA in patients with AIPL1 mutations is relatively severe, with a maculopathy in most patients and keratoconus and cataract in a large subset."
    explanation: >-
      This 26-proband phenotype study characterizes the classic severe LCA
      presentation and its frequent ocular comorbidities.
- name: Milder EOSRD
  display_name: Early-Onset Severe Retinal Dystrophy / Juvenile RP (Missense Alleles)
  description: >-
    Patients carrying at least one missense or hypomorphic AIPL1 allele (e.g.,
    c.152A>G, c.572T>C, or the rare hypomorphic p.Gly122Arg) that retains partial
    chaperone function present with a later-onset, milder disease course: a
    severe cone-rod (rather than fully extinguished) electroretinogram pattern,
    slower visual acuity decline, and in some families a juvenile retinitis
    pigmentosa or dominant cone-rod dystrophy phenotype rather than classic LCA.
  evidence:
  - reference: PMID:38880373
    reference_title: Clinical and Molecular Characterization of AIPL1-Associated Leber Congenital Amaurosis/Early-Onset Severe Retinal Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients harboring at least one nonnull mutation, especially c.152A>G and c.572T>C, were significantly more likely to have a milder EOSRD phenotype than those with two null mutations."
    explanation: >-
      This directly establishes the genotype-phenotype correlation between
      missense allele burden and the milder EOSRD course.
  - reference: PMID:33067476
    reference_title: Clinical and functional analyses of AIPL1 variants reveal mechanisms of pathogenicity linked to different forms of retinal degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the p.G122R variant is a rare hypomorphic allele with a later disease onset, amenable to therapeutic intervention"
    explanation: >-
      This functional/clinical study confirms a specific hypomorphic missense
      allele associated with the milder end of the disease spectrum.
  - reference: PMID:10873396
    reference_title: Prevalence of AIPL1 mutations in inherited retinal degenerative disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also identified affected individuals in two apparently dominant families, diagnosed with juvenile retinitis pigmentosa or dominant cone-rod dystrophy, respectively, who are heterozygous for a 12-bp AIPL1 deletion."
    explanation: >-
      This establishes that a subset of AIPL1 variants can cause a dominant,
      milder juvenile RP or cone-rod dystrophy phenotype distinct from
      classic recessive LCA.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The great majority of AIPL1-related retinopathy is caused by biallelic
    (homozygous or compound heterozygous) pathogenic variants.
  evidence:
  - reference: PMID:10873396
    reference_title: Prevalence of AIPL1 mutations in inherited retinal degenerative disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LCA is usually inherited in an autosomal recessive fashion, although rare dominant cases have been reported."
    explanation: >-
      Confirms autosomal recessive inheritance as the predominant mode, with
      rare dominant-acting variants also documented.
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A minority of heterozygous AIPL1 variants, most notably the 12-bp
    (c.1053_1064del) in-frame deletion, cause dominant-acting cone-rod
    dystrophy or juvenile RP rather than the classic recessive LCA/EOSRD
    phenotype.
  evidence:
  - reference: PMID:10873396
    reference_title: Prevalence of AIPL1 mutations in inherited retinal degenerative disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also identified affected individuals in two apparently dominant families, diagnosed with juvenile retinitis pigmentosa or dominant cone-rod dystrophy, respectively, who are heterozygous for a 12-bp AIPL1 deletion."
    explanation: >-
      Establishes the founding dominant-family evidence for the heterozygous
      12-bp AIPL1 deletion.
  - reference: PMID:33067476
    reference_title: Clinical and functional analyses of AIPL1 variants reveal mechanisms of pathogenicity linked to different forms of retinal degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "p.A352_P355del associated with autosomal dominant cone-rod dystrophy."
    explanation: >-
      Independently confirms the same in-frame deletion as a cause of
      autosomal dominant cone-rod dystrophy in a separate cohort.
pathophysiology:
- name: AIPL1 Chaperone Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic pathogenic AIPL1 variants disrupt the photoreceptor-specific
    co-chaperone function of AIPL1. Its N-terminal FKBP-like domain binds the
    farnesylated PDE6 alpha subunit, and its C-terminal TPR domain mediates
    interaction with the molecular chaperones HSP90 and HSP70; both domains and
    their relative organization are required together for AIPL1 to function.
  gene:
    preferred_term: AIPL1
    modifier: DECREASED
    term:
      id: hgnc:359
      label: AIPL1
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  molecular_functions:
  - preferred_term: protein-folding chaperone binding
    modifier: DECREASED
    term:
      id: GO:0051087
      label: protein-folding chaperone binding
  downstream:
  - target: Impaired PDE6 Holoenzyme Folding and Assembly
    description: >-
      Loss of AIPL1's co-chaperone activity prevents correct folding and
      assembly of the PDE6 holoenzyme, the phototransduction effector enzyme.
    evidence:
    - reference: PMID:18408180
      reference_title: The Leber congenital amaurosis protein AIPL1 functions as part of a chaperone heterocomplex.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "AIPL1 interacts with the molecular chaperones Hsp90 and Hsp70."
      explanation: >-
        This establishes AIPL1's direct interaction with both major
        chaperones, the structural basis for its co-chaperone role.
  evidence:
  - reference: PMID:28973376
    reference_title: The integrity and organization of the human AIPL1 functional domains is critical for its role as a HSP90-dependent co-chaperone for rod PDE6.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data revealed that both the FK506 binding protein (FKBP)-like domain and the tetratricopeptide repeat (TPR) domain of AIPL1 are required for interaction with HSP90."
    explanation: >-
      This functional domain-mapping study establishes that both AIPL1
      domains are jointly required for HSP90 co-chaperone activity.
  - reference: PMID:18408180
    reference_title: The Leber congenital amaurosis protein AIPL1 functions as part of a chaperone heterocomplex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "LCA-causing mutations in AIPL1 also compromised these interactions, suggesting that the essential function of AIPL1 in photoreceptors may involve the interaction with Hsp90 and Hsp70."
    explanation: >-
      This directly links disease-causing AIPL1 mutations to loss of
      chaperone interaction, supporting the causal mechanism.
- name: Impaired PDE6 Holoenzyme Folding and Assembly
  biological_scale: MOLECULAR
  description: >-
    Without functional AIPL1 co-chaperone activity, the PDE6 holoenzyme
    (catalytic alpha/beta and regulatory gamma subunits) fails to fold and
    assemble correctly and is targeted for degradation, abolishing cGMP
    hydrolysis capacity in photoreceptor outer segments. AIPL1 variants that
    disrupt either the FKBP-like or TPR domain impair both HSP90 interaction and
    PDE6 activity together.
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  molecular_functions:
  - preferred_term: 3',5'-cyclic-GMP phosphodiesterase activity
    modifier: DECREASED
    term:
      id: GO:0047555
      label: 3',5'-cyclic-GMP phosphodiesterase activity
  downstream:
  - target: Rod PDE6 Loss and cGMP Accumulation
    description: >-
      In rods, loss of PDE6 activity removes the enzyme responsible for cGMP
      hydrolysis, causing cGMP to accumulate.
    evidence:
    - reference: PMID:15365178
      reference_title: "Leber congenital amaurosis linked to AIPL1: a mouse model reveals destabilization of cGMP phosphodiesterase."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "rod cGMP phosphodiesterase, a farnesylated protein, is absent and cGMP levels are elevated in AIPL1(-/-) retinas before the onset of degeneration"
      explanation: >-
        This Aipl1-knockout mouse study directly demonstrates PDE6 loss and
        antecedent cGMP elevation as the proximate rod mechanism.
  - target: Cone PDE6 and RetGC1 Destabilization with Reduced cGMP Synthesis
    description: >-
      In cones, loss of AIPL1 destabilizes cone PDE6 assembly and also reduces
      RetGC1 (a cGMP-synthesizing guanylate cyclase), producing a mechanistically
      distinct outcome of reduced (not elevated) cGMP.
    evidence:
    - reference: PMID:24108108
      reference_title: "AIPL1, A protein linked to blindness, is essential for the stability of enzymes mediating cGMP metabolism in cone photoreceptor cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings are in contrast to the role of Aipl1 in rods, where destabilization of rod PDE6 results in an increase in cGMP levels, which drives rapid rod degeneration. Our results illustrate mechanistic differences behind the death of rods and cones in retinal degenerative disease caused by deficiencies in AIPL1."
      explanation: >-
        This all-cone mouse model study establishes that the rod and cone
        degeneration mechanisms downstream of AIPL1 loss are biochemically
        distinct.
  evidence:
  - reference: PMID:33067476
    reference_title: Clinical and functional analyses of AIPL1 variants reveal mechanisms of pathogenicity linked to different forms of retinal degeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We confirm that missense and nonsense variants in the FKBP-like and tetratricopeptide repeat domains of AIPL1 lead to the loss of both HSP90 interaction and PDE6 activity, confirming these variants cause LCA."
    explanation: >-
      This functional study of patient-derived AIPL1 variants confirms that
      disruption of either domain jointly impairs HSP90 interaction and PDE6
      activity.
- name: Rod PDE6 Loss and cGMP Accumulation
  biological_scale: CELLULAR
  description: >-
    Elevated cGMP in rods keeps cyclic-nucleotide-gated channels open,
    producing sustained depolarization and calcium influx that drives rapid
    rod photoreceptor cell death, confirmed directly in human iPSC-derived
    photoreceptors as well as mouse models.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  downstream:
  - target: Rapid Photoreceptor Apoptosis and Congenital Retinal Dystrophy
    description: >-
      Sustained cGMP-driven depolarization and calcium influx in rods
      converges on rapid photoreceptor apoptosis.
    evidence:
    - reference: PMID:15365178
      reference_title: "Leber congenital amaurosis linked to AIPL1: a mouse model reveals destabilization of cGMP phosphodiesterase."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Aipl1(-/-) retinas, the outer nuclear layer develops normally, but rods and cones then quickly degenerate."
      explanation: >-
        Confirms rapid rod (and cone) degeneration follows the initial
        molecular lesion in the Aipl1-null mouse model.
  evidence:
  - reference: PMID:36084639
    reference_title: Investigation of PTC124-mediated translational readthrough in a retinal organoid model of AIPL1-associated Leber congenital amaurosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "iPSC-derived photoreceptors exhibited the molecular hallmarks of LCA4, including undetectable AIPL1 and rod cyclic guanosine monophosphate (cGMP) phosphodiesterase (PDE6) compared with control or CRISPR-corrected organoids. Increased levels of cGMP were detected."
    explanation: >-
      This patient-derived retinal organoid model confirms the PDE6-loss and
      cGMP-elevation mechanism directly in human photoreceptor cells.
- name: Cone PDE6 and RetGC1 Destabilization with Reduced cGMP Synthesis
  biological_scale: CELLULAR
  description: >-
    In cones, AIPL1 loss impairs stability, assembly, and membrane association
    of cone PDE6 and reduces RetGC1, causing a light-independent cone death
    that proceeds via reduced cGMP synthesis rather than the excitotoxic
    cGMP-accumulation mechanism seen in rods.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  downstream:
  - target: Rapid Photoreceptor Apoptosis and Congenital Retinal Dystrophy
    description: >-
      Cone PDE6/RetGC1 destabilization and reduced cGMP synthesis converges,
      alongside the rod branch, on rapid photoreceptor apoptosis.
    evidence:
    - reference: PMID:24108108
      reference_title: "AIPL1, A protein linked to blindness, is essential for the stability of enzymes mediating cGMP metabolism in cone photoreceptor cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Aipl1 is needed for stability, assembly and membrane association of cone PDE6, an enzyme crucial for photoreceptor function and survival."
      explanation: >-
        Establishes that loss of cone PDE6/RetGC1 stability is the proximate
        cause of cone photoreceptor loss in the all-cone Aipl1-null model.
  evidence:
  - reference: PMID:24108108
    reference_title: "AIPL1, A protein linked to blindness, is essential for the stability of enzymes mediating cGMP metabolism in cone photoreceptor cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Aipl1 is needed for stability, assembly and membrane association of cone PDE6, an enzyme crucial for photoreceptor function and survival. Furthermore, RetGC1, a protein linked to LCA that is needed for cGMP synthesis, was dramatically reduced in cones lacking Aipl1."
    explanation: >-
      This all-cone mouse model directly demonstrates the dual PDE6/RetGC1
      destabilization mechanism specific to cones.
- name: Rapid Photoreceptor Apoptosis and Congenital Retinal Dystrophy
  biological_scale: TISSUE
  description: >-
    Both the rod (cGMP-accumulation) and cone (reduced cGMP-synthesis) branches
    converge on rapid, light-independent photoreceptor apoptosis and
    disorganization of photoreceptor outer segments. In biallelic null alleles
    this produces the classic severe congenital LCA phenotype from birth;
    missense or hypomorphic alleles that retain partial chaperone function slow
    this process, producing the milder, later-onset EOSRD/juvenile RP end of
    the spectrum. Unlike the photoreceptor_degeneration module's rod-first
    apoptosis followed by non-cell-autonomous secondary cone loss, AIPL1 cone
    death is primary and cell-autonomous (PMID:24108108), arising from the
    same direct chaperone-loss mechanism as the rod branch rather than as a
    bystander effect of rod death, so this node does not declare conforms_to
    the module.
  cell_types:
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: phototransduction
    modifier: DECREASED
    term:
      id: GO:0007602
      label: phototransduction
  evidence:
  - reference: PMID:15365178
    reference_title: "Leber congenital amaurosis linked to AIPL1: a mouse model reveals destabilization of cGMP phosphodiesterase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In Aipl1(-/-) retinas, the outer nuclear layer develops normally, but rods and cones then quickly degenerate. Aipl1(-/-) mice have highly disorganized, short, fragmented photoreceptor outer segments and lack both rod and cone electroretinogram responses."
    explanation: >-
      This establishes that photoreceptor development is initially normal,
      with rapid postnatal degeneration of both rods and cones once AIPL1 is
      lost -- the mechanistic basis for the severe congenital phenotype.

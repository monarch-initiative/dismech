    snippet: "The patient presented with nyctalopia since early childhood with a VA at 34 years old of 20/50 in the right eye and 20/100 in the left eye."
    explanation: >-
      This case (homozygous for the hypomorphic p.G122R variant) documents
      childhood-onset night blindness with only mildly reduced adult visual
      acuity, illustrating the milder end of the AIPL1 disease spectrum.
genetic:
- name: AIPL1 pathogenic variants
  gene_term:
    preferred_term: AIPL1
    term:
      id: hgnc:359
      label: AIPL1
  association: Causative
  features: >-
    Biallelic AIPL1 variants form an allelic severity gradient. Null alleles
    (nonsense, frameshift, or splice-disrupting), including the recurrent
    c.421C>T (historically W278X) variant, abolish AIPL1 function and cause
    classic LCA. Nonnull (missense) alleles, especially c.152A>G and c.572T>C,
    predict a significantly milder EOSRD phenotype. A rare hypomorphic missense
    variant, p.Gly122Arg, retains HSP90 binding but has impaired PDE6/cGMP
    modulation, producing a later-onset, milder retinitis pigmentosa phenotype.
    Rare heterozygous variants have also been reported in dominant families
    with juvenile retinitis pigmentosa or dominant cone-rod dystrophy.
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:10873396
      reference_title: Prevalence of AIPL1 mutations in inherited retinal degenerative disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "LCA is usually inherited in an autosomal recessive fashion, although rare dominant cases have been reported."
      explanation: >-
        Confirms the predominant autosomal recessive inheritance mode with
        rare dominant exceptions.
  evidence:
  - reference: PMID:38880373
    reference_title: Clinical and Molecular Characterization of AIPL1-Associated Leber Congenital Amaurosis/Early-Onset Severe Retinal Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common mutation was the nonsense variants of c.421C>T, with an allele frequency of 53.9%."
    explanation: >-
      This establishes c.421C>T as the most prevalent AIPL1 disease allele in
      this modern 51-patient cohort.
  - reference: PMID:33067476
    reference_title: Clinical and functional analyses of AIPL1 variants reveal mechanisms of pathogenicity linked to different forms of retinal degeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the p.G122R variant is a rare hypomorphic allele with a later disease onset, amenable to therapeutic intervention"
    explanation: >-
      This functional study confirms the hypomorphic mechanism of a specific
      rare missense allele at the mild end of the AIPL1 allelic spectrum.
treatments:
- name: rAAV8.hRKp.AIPL1 Gene Therapy
  therapeutic_modality: GENE_THERAPY
  description: >-
    A recombinant AAV8 vector delivering the human AIPL1 coding sequence under
    a human rhodopsin-kinase promoter (rAAV8.hRKp.AIPL1), administered by
    subretinal injection. In a first-in-human, open-label study, four children
    (ages 1.0-2.8 years) with biallelic AIPL1 disease-causing variants and
    baseline binocular visual acuity limited to light perception showed
    substantial improvement in visual acuity and functional vision after
    treatment, with some structural preservation of the outer retina, and no
    serious adverse effects other than cystoid macular oedema in one treated
    eye.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:39986747
    reference_title: "Gene therapy in children with AIPL1-associated severe retinal dystrophy: an open-label, first-in-human interventional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Before intervention, the children's binocular visual acuities were limited to perception of light."
    explanation: >-
      This establishes the severe baseline visual function of the treated
      cohort prior to gene therapy.
  - reference: PMID:39986747
    reference_title: "Gene therapy in children with AIPL1-associated severe retinal dystrophy: an open-label, first-in-human interventional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings indicate that young children with AIPL1-related retinal dystrophy benefited substantially from subretinal administration of rAAV8.hRKp.AIPL1, with improved visual acuity and functional vision and evidence of some protection against progressive retinal degeneration, without serious adverse effects."
    explanation: >-
      This is the trial's primary efficacy and safety conclusion.
  - reference: PMID:39986747
    reference_title: "Gene therapy in children with AIPL1-associated severe retinal dystrophy: an open-label, first-in-human interventional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The treated eye of one child developed cystoid macular oedema. No other safety concerns were identified."
    explanation: >-
      This documents the single reported adverse event in the trial.
  - reference: PMID:19299492
    reference_title: "Gene therapy for retinitis pigmentosa and Leber congenital amaurosis caused by defects in AIPL1: effective rescue of mouse models of partial and complete Aipl1 deficiency using AAV2/2 and AAV2/8 vectors."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This is the first gene replacement study to report long-term rescue of a photoreceptor-specific defect and to demonstrate effective rescue of a rapid photoreceptor degeneration."
    explanation: >-
      This earlier mouse-model study established proof-of-concept for AAV
      gene replacement therapy across both partial and complete Aipl1
      deficiency, preceding the human trial.
- name: PTC124 Translational Readthrough (Investigational)
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    An investigational translational readthrough-inducing drug studied in
    patient-derived iPSC retinal organoids carrying AIPL1 nonsense mutations.
    PTC124 partially restored full-length AIPL1 protein, but this was
    insufficient to fully restore PDE6 expression or normalize cGMP levels,
    indicating this approach alone is not yet an effective therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:36084639
    reference_title: Investigation of PTC124-mediated translational readthrough in a retinal organoid model of AIPL1-associated Leber congenital amaurosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "LCA4 retinal organoids exhibited low levels of rescue of full-length AIPL1. However, this was insufficient to fully restore PDE6 in photoreceptors and reduce cGMP."
    explanation: >-
      This patient-derived organoid study directly tested and quantified
      the limited efficacy of PTC124 readthrough therapy for AIPL1 nonsense
      alleles.
- name: Supportive care and monitoring
  therapeutic_modality: OTHER
  description: >-
    In the absence of an approved disease-modifying therapy, management
    consists of low-vision support, early referral for gene-therapy
    consideration if biallelic AIPL1 variants are confirmed, and routine
    ophthalmological monitoring. Because AIPL1 is a phototransduction chaperone
    rather than a visual-cycle protein, vitamin A/retinoid supplementation
    strategies used for visual-cycle diseases have no mechanistic rationale
    here, consistent with the general lack of demonstrated benefit of such
    supplementation across LCA/EOSRD.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33712480
    reference_title: "Leber congenital amaurosis/early-onset severe retinal dystrophy: current management and clinical trials."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "amino acids supplementation have failed to show"
    explanation: >-
      This management review states that vitamin A, mineral, and amino acid
      supplementation have failed to demonstrate clear benefit and are not
      recommended for LCA/EOSRD as a class, which includes AIPL1-related
      disease.
- name: Genetic counseling
  therapeutic_modality: OTHER
  description: >-
    Genetic counseling is indicated given the predominantly autosomal
    recessive inheritance pattern, and molecular allele classification (null
    versus missense/hypomorphic) is prognostically important and increasingly
    relevant to gene-therapy eligibility.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:10873396
    reference_title: Prevalence of AIPL1 mutations in inherited retinal degenerative disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LCA is usually inherited in an autosomal recessive fashion, although rare dominant cases have been reported."
    explanation: >-
      Confirms the inheritance pattern underlying genetic counseling
      recommendations for affected families.

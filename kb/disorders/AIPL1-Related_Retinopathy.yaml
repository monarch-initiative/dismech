diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Sequencing of AIPL1 confirms the diagnosis and classifies the allele
    burden as null, missense/nonnull, or hypomorphic -- a classification
    directly correlated with clinical severity and gene-therapy eligibility.
  results: >-
    Two null alleles predict classic, severe congenital LCA. At least one
    nonnull (missense) allele, particularly c.152A>G or c.572T>C, predicts a
    significantly milder EOSRD phenotype. The rare hypomorphic p.Gly122Arg
    allele predicts the mildest, latest-onset retinitis pigmentosa phenotype.
  evidence:
  - reference: PMID:38880373
    reference_title: Clinical and Molecular Characterization of AIPL1-Associated Leber Congenital Amaurosis/Early-Onset Severe Retinal Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study reveals distinct clinical features and variation spectrum between AIPL1-associated LCA and EOSRD."
    explanation: >-
      This cohort study establishes molecular genotyping as the basis for
      distinguishing the LCA and EOSRD clinical subtypes.
- name: Electroretinography
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Full-field ERG distinguishes the classic LCA subtype (fully extinguished
    responses) from the milder EOSRD subtype (severe but not fully
    extinguished cone-rod pattern).
  results: >-
    A classical extinguished pattern is seen in essentially all classic LCA
    patients, while a severe cone-rod pattern (rather than full extinction) is
    seen in most EOSRD patients.
  evidence:
  - reference: PMID:38880373
    reference_title: Clinical and Molecular Characterization of AIPL1-Associated Leber Congenital Amaurosis/Early-Onset Severe Retinal Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electroretinography showed severe cone-rod patterns in 78.6% (11/14) of patients with EOSRD, while classical extinguished pattern was documented in all patients with LCA available for the examination."
    explanation: >-
      This directly establishes the ERG pattern as a key diagnostic
      differentiator between the two clinical subtypes.
- name: Multimodal retinal imaging
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Optical coherence tomography (OCT) assesses residual foveal ellipsoid-zone
    structure, which is preserved only in the youngest patients and is
    important for identifying an early therapeutic window for gene therapy.
  results: >-
    Foveal ellipsoid zone preservation is documented in the youngest EOSRD and
    LCA children; patients with a damaging AIPL1 variant generally lack
    residual outer retinal structure beyond about age 4 years.
  evidence:
  - reference: PMID:38880373
    reference_title: Clinical and Molecular Characterization of AIPL1-Associated Leber Congenital Amaurosis/Early-Onset Severe Retinal Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Optical coherence tomography imaging demonstrated preservation of foveal ellipsoid zone in the 5 youngest EOSRD patients and 9 LCA children."
    explanation: >-
      This documents the age-dependent window of residual foveal structure
      relevant to gene-therapy candidacy.
  - reference: PMID:33712480
    reference_title: "Leber congenital amaurosis/early-onset severe retinal dystrophy: current management and clinical trials."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "AIPL1 generally do not have residual outer retinal structure"
    explanation: >-
      This management review states that patients with damaging AIPL1
      variants generally lose residual outer retinal structure beyond
      approximately age 4 years.
epidemiology:
- name: Contribution to Leber congenital amaurosis
  description: >-
    Estimates of the AIPL1 contribution to LCA vary substantially by cohort
    era and size: an early, small, non-representative screen suggested
    approximately 20%, while a later worldwide screen of 512 probands found
    approximately 7%. No single figure is treated as definitive across the
    literature.
  evidence:
  - reference: PMID:10873396
    reference_title: Prevalence of AIPL1 mutations in inherited retinal degenerative disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that AIPL1 mutations cause approximately 7% of LCA worldwide and may cause dominant retinopathy."
    explanation: >-
      This larger, 512-proband worldwide screen is the most commonly cited
      prevalence estimate for AIPL1 among LCA cases.
  - reference: PMID:10615133
    reference_title: Mutations in a new photoreceptor-pineal gene on 17p cause Leber congenital amaurosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AIPL1 mutations may cause approximately 20% of recessive LCA, as disease-causing mutations were identified in 3 of 14 LCA families not tested previously for linkage."
    explanation: >-
      This original gene-discovery paper's estimate came from a small,
      non-representative sub-cohort and is higher than later, larger
      screens.
progression:
- phase: Congenital severe visual impairment (classic LCA, null alleles)
  age_range: Birth to early infancy
  notes: >-
    Severe visual impairment or blindness, nystagmus, and an extinguished ERG
    are present from birth or the first few months of life in patients with
    biallelic null AIPL1 variants.
  evidence:
  - reference: PMID:10615133
    reference_title: Mutations in a new photoreceptor-pineal gene on 17p cause Leber congenital amaurosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals affected with LCA are diagnosed at birth or in the first few months of life with severely impaired vision or blindness, nystagmus and an abnormal or flat electroretinogram (ERG)."
    explanation: >-
      This establishes the congenital onset and severity of the classic LCA
      presentation.
- phase: Slower progressive decline (milder EOSRD/RP, missense alleles)
  age_range: Childhood through adulthood
  notes: >-
    Patients with at least one nonnull allele show a measurable but gradual
    annual decline in visual acuity rather than congenital near-total vision
    loss, with foveal structure preserved longer than in classic LCA.
  evidence:
  - reference: PMID:38880373
    reference_title: Clinical and Molecular Characterization of AIPL1-Associated Leber Congenital Amaurosis/Early-Onset Severe Retinal Dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with an average annual decline of 0.03 logMAR"
    explanation: >-
      This quantifies the gradual, measurable rate of visual acuity decline
      in the milder EOSRD subtype, in contrast to the congenital severe loss
      of the classic LCA subtype.

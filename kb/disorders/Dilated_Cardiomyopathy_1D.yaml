    reference_title: "Cardiac troponin T mutation R141W found in dilated cardiomyopathy stabilizes the troponin T-tropomyosin interaction and causes a Ca2+ desensitization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A missense mutation R141W in the strong tropomyosin-binding region of cardiac
      troponin T (cTnT) has recently been reported to cause dilated cardiomyopathy
      (DCM), following the first report of a DCM-causing deletion mutation
      DeltaK210.
    explanation: >-
      Names both founding TNNT2 dilated cardiomyopathy alleles - DeltaK210 and
      R141W - and their location relative to the tropomyosin-binding region.
  - reference: PMID:11106718
    reference_title: "Mutations in sarcomere protein genes as a cause of dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac beta-myosin heavy-chain missense mutations (Ser532Pro and Phe764Leu)
      and a deletion in cardiac troponin T (deltaLys210) caused early-onset
      ventricular dilatation (average age at diagnosis, 24 years) and diminished
      contractile function and frequently resulted in heart failure.
    explanation: >-
      Documents the founding TNNT2 DeltaLys210 deletion and its clinical
      consequence - early-onset dilatation with diminished contractile function.
  downstream:
  - target: Decreased Myofilament Calcium Sensitivity
    causal_link_type: DIRECT
    description: >-
      The mutant troponin T shifts the thin-filament calcium response downward,
      desensitizing force generation.
- name: Decreased Myofilament Calcium Sensitivity
  biological_scale: MOLECULAR
  role: effector
  description: >-
    The defining functional lesion of CMD1D, and the axis on which dilated and
    hypertrophic TNNT2 disease separate. Dilated cardiomyopathy alleles decrease the
    calcium sensitivity of force generation: the R141W mutation does so by
    stabilizing the troponin T-tropomyosin interaction, and DeltaK210 produces the
    same desensitization from outside the strong tropomyosin-binding region, so the
    functional direction rather than the structural location is what tracks with the
    phenotype. Hypertrophic TNNT2 alleles such as R94L do the opposite, increasing
    calcium sensitivity. A myofilament that requires more calcium to generate the
    same force is hypocontractile, which is why the ventricle dilates.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Regulation of Cardiac Muscle Contraction by Calcium
    term:
      id: GO:0010882
      label: regulation of cardiac muscle contraction by calcium ion signaling
    modifier: DECREASED
  - preferred_term: Muscle Contraction
    term:
      id: GO:0006936
      label: muscle contraction
    modifier: DECREASED
  evidence:
  - reference: PMID:14654368
    reference_title: "Cardiac troponin T mutation R141W found in dilated cardiomyopathy stabilizes the troponin T-tropomyosin interaction and causes a Ca2+ desensitization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      R141W mutation resulted in a decrease in the Ca(2+) sensitivity of force
      generation, as in the case of DeltaK210 mutation lying outside the strong
      tropomyosin-binding region.
    explanation: >-
      Demonstrates calcium desensitization for both founding dilated alleles, and
      that it does not depend on location within the tropomyosin-binding region.
  - reference: PMID:14654368
    reference_title: "Cardiac troponin T mutation R141W found in dilated cardiomyopathy stabilizes the troponin T-tropomyosin interaction and causes a Ca2+ desensitization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, a missense mutation R94L in the vicinity of the strong
      tropomyosin-binding region associated with hypertrophic cardiomyopathy (HCM)
      resulted in an increase in the Ca(2+) sensitivity of force generation, as in
      the case of the other HCM-causing mutations in cTnT reported previously.
    explanation: >-
      The direct experimental contrast that this entry rests on: hypertrophic TNNT2
      alleles increase calcium sensitivity where the dilated alleles decrease it,
      measured in the same system.
  downstream:
  - target: Ventricular Dilation and Systolic Dysfunction
    causal_link_type: DIRECT
    description: >-
      A calcium-desensitized, hypocontractile myofilament drives chamber dilation
      and falling systolic performance.
- name: Ventricular Dilation and Systolic Dysfunction
  biological_scale: TISSUE
  role: central_effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    Sustained hypocontractility produces the defining structural remodeling of
    dilated cardiomyopathy: left ventricular chamber enlargement with wall thinning,
    myocyte loss and interstitial fibrosis, with falling ejection fraction. In CMD1D
    this occurs early and without the antecedent hypertrophy or hypertrophic
    histopathology of the TNNT2 hypertrophic phenotype.

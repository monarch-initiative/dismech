notes: >-
  CMD1D is the TNNT2 member of the numbered dilated cardiomyopathy series and
  carries ClinGen Definitive gene-disease validity. It conforms to the shared
  cardiomyopathy_maladaptive_remodeling module.

  Like CMD1S (MYH7), this entry exists partly to record an allelic contrast, and
  here the contrast is measured rather than inferred: in one experimental system,
  the dilated alleles (R141W, DeltaK210) decreased the calcium sensitivity of force
  generation while the hypertrophic allele R94L increased it. That is the
  functional axis separating CMD1D from Hypertrophic Cardiomyopathy 2, the TNNT2
  hypertrophic entry, and both sides of it are curated as evidence on the effector
  node.

  A second point the evidence makes and the entry preserves: the two dilated
  alleles sit in different parts of the molecule - R141W inside the strong
  tropomyosin-binding region, DeltaK210 outside it - yet produce the same
  desensitization. The direction of the calcium-sensitivity shift, not the
  structural location of the variant, is what tracks with the phenotype, so the
  entry does not assert a domain-based rule.

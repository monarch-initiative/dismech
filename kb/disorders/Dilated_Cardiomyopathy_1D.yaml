name: Dilated Cardiomyopathy 1D
creation_date: "2026-08-23T00:00:00Z"
synonyms:
- CMD1D
- TNNT2 familial isolated dilated cardiomyopathy
- dilated cardiomyopathy type 1D
- cardiomyopathy, dilated, 1D
- cardiac troponin T dilated cardiomyopathy
description: >-
  Dilated cardiomyopathy 1D (CMD1D) is the TNNT2-related form of familial isolated
  dilated cardiomyopathy. TNNT2 encodes cardiac troponin T, the tropomyosin-binding
  subunit that anchors the troponin complex to the thin filament and transmits the
  calcium signal to the actin-tropomyosin regulatory unit. CMD1D is the sharpest
  functional illustration in the knowledge base of how one thin-filament protein
  produces two opposite diseases: dilated cardiomyopathy alleles *decrease* the
  calcium sensitivity of force generation, while hypertrophic alleles in the same
  protein (curated as CMH2) *increase* it. The founding dilated allele was the
  in-frame deletion DeltaLys210, identified by Kamisago and colleagues in 2000
  alongside the MYH7 dilated alleles; the later missense allele Arg141Trp, in the
  strong tropomyosin-binding region, was shown to produce the same calcium
  desensitization despite lying in a different part of the molecule. ClinGen
  classifies the TNNT2-dilated cardiomyopathy relationship as Definitive with
  autosomal dominant inheritance, and disease is characteristically early-onset.

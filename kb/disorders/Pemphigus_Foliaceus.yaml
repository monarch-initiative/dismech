name: Pemphigus Foliaceus
creation_date: "2026-09-29T03:00:00Z"
category: Autoimmune
description: >-
  Pemphigus foliaceus is an autoimmune blistering disease in which IgG
  autoantibodies against desmoglein 1 cause loss of keratinocyte adhesion in
  the superficial epidermis, producing crusted, scaly erosions without mucosal
  involvement.
disease_term:
  preferred_term: pemphigus foliaceus
  term:
    id: MONDO:0019324
    label: pemphigus foliaceus
synonyms:
- PF
notes: >-
  This entry models the sporadic and endemic forms together, since both are
  IgG anti-Dsg1 diseases with the same effector mechanism; the endemic-specific
  epidemiology (arthropod exposure, fogo selvagem) is carried on the
  environmental entry and the fogo-selvagem-derived evidence. Pemphigus
  erythematosus (Senear-Usher) is curated separately (Pemphigus_Erythematosus).
  DSG1 is the autoantigen, not a susceptibility gene; germline DSG1
  loss-of-function causes a distinct keratoderma phenotype and is not modelled
  here. No GeneReviews chapter exists (PF is a complex autoimmune, non-Mendelian
  disease). Age of onset differs sharply by form (see progression): sporadic PF
  onsets at 40-60 years, endemic fogo selvagem earlier, in the second-to-third
  decade — the clearest clinical difference between the two forms this entry lumps.
prevalence:
- population: Tunisia
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.67
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    6.7 new cases per million per year, among the highest reported incidences of
    the sporadic/endemic form outside Brazil. Incidence is female-predominant
    (~4:1).
  evidence:
  - reference: PMID:21605805
    reference_title: Diagnosis and clinical features of pemphigus foliaceus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the incidence of PF in Tunisia has been found to be as high as 6.7 new
      cases per million per year
    explanation: >-
      Gives the Tunisian incidence figure for the normalized rate.
  - reference: PMID:21605805
    reference_title: Diagnosis and clinical features of pemphigus foliaceus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      female-to-male ratio of incidence rates to be approximately 4 to 1
    explanation: >-
      Female predominance of PF incidence in the endemic Tunisian setting.
- population: Limao Verde, Mato Grosso do Sul, Brazil (endemic fogo selvagem focus)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 3000.0
  notes: >-
    Approximately 3% of the population in an endemic Brazilian focus, far above
    the sporadic worldwide rate.
  evidence:
  - reference: PMID:21605805
    reference_title: Diagnosis and clinical features of pemphigus foliaceus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      there is a region located in the state of Maso Grosso do Sul that has a
      prevalence equal to approximately 3% of its population
    explanation: >-
      Endemic-focus prevalence (the review reproduces the source's "Maso Grosso"
      spelling).
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    PF is generally milder than pemphigus vulgaris because mucosal involvement
    is absent and blistering is superficial, but widespread or erythrodermic
    disease causes barrier failure and secondary infection, and long-term
    immunosuppression carries its own morbidity. Rituximab now induces high
    rates of complete remission.
  evidence:
  - reference: PMID:21605805
    reference_title: Diagnosis and clinical features of pemphigus foliaceus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In its most severe form, PF can produce an exfoliative erythroderma
      characterized by generalized erythema and diffuse scaling of the
      cutaneous surface
    explanation: >-
      Identifies erythroderma as the severe end of the burden spectrum.
inheritance:
- name: HLA-linked polygenic susceptibility
  inheritance_term:
    preferred_term: polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    PF is a complex autoimmune trait, not Mendelian. Susceptibility is linked to
    HLA-DRB1 class II alleles sharing a common peptide-binding-groove sequence;
    familial clustering occurs in endemic foci.
  evidence:
  - reference: PMID:9027963
    reference_title: An epitope in the third hypervariable region of the DRB1 gene is involved in the susceptibility to endemic pemphigus foliaceus (fogo selvagem) in three different Brazilian populations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      particular HLA alleles confer increased risk for the disease
    explanation: >-
      States the HLA-linked genetic susceptibility underlying the polygenic
      inheritance.
progression:
- phase: Onset (sporadic PF)
  age_range: 40-60 years
  notes: The non-endemic (sporadic) form typically presents in mid-to-late adulthood.
  evidence:
  - reference: PMID:21605805
    reference_title: Diagnosis and clinical features of pemphigus foliaceus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The average age of non-endemic PF symptom onset ranges from 40 to 60 years
      of age
    explanation: >-
      Age-of-onset range for sporadic PF.
- phase: Onset (endemic fogo selvagem)
  age_range: second to third decade
  notes: Endemic PF affects more children and young adults than the sporadic form.
  evidence:
  - reference: PMID:21605805
    reference_title: Diagnosis and clinical features of pemphigus foliaceus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      symptoms usually begin during the second or third decade of life
    explanation: >-
      Earlier age of onset for endemic fogo selvagem.
classifications:
  harrisons_chapter:
  - classification_value: DERMATOLOGY
  - classification_value: IMMUNE_RHEUMATOLOGIC
  mechanistic_category:
  - classification_value: desmosomopathy
    notes: >-
      Acquired autoimmune desmosomopathy: desmosome dysfunction arises from IgG
      autoantibodies against the desmosomal cadherin desmoglein 1, not from a
      germline desmosomal-gene variant. Tagged because the category denotes
      desmosome dysfunction of any etiology.
differential_diagnoses:
- name: Pemphigus vulgaris
  description: The other major pemphigus, with anti-Dsg3 (with or without anti-Dsg1) autoantibodies.
  distinguishing_features:
  - PV causes mucosal erosions and deep suprabasal blistering; PF spares mucosa and blisters superficially (subcorneal).
- name: Staphylococcal scalded skin syndrome / bullous impetigo
  description: Superficial blistering from staphylococcal exfoliative toxin.
  distinguishing_features:
  - Toxin-mediated Dsg1 cleavage rather than autoantibody; no intercellular IgG on DIF and an infectious course.
- name: Subcorneal pustular dermatosis
  description: A neutrophilic subcorneal pustular eruption.
  distinguishing_features:
  - Sterile pustules with negative pemphigus serology and DIF.
- name: IgA pemphigus
  description: Intraepidermal blistering with IgG-negative, IgA intercellular deposits.
  distinguishing_features:
  - IgA (not IgG) intercellular deposits, often anti-desmocollin, and dapsone responsiveness.
pathophysiology:
- name: HLA-DRB1-Restricted Susceptibility
  biological_scale: MOLECULAR
  description: >-
    Permissive HLA-DRB1 class II alleles (DRB1*0102, *0404, *1402, *1406 across
    endemic populations) share the amino-acid sequence LLEQRRAA at positions
    67-74 of the third hypervariable region, which presents Dsg1 peptides to
    CD4+ T cells and sets genetic risk.
  genes:
  - preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  molecular_functions:
  - preferred_term: MHC class II peptide antigen binding
    term:
      id: GO:0042605
      label: peptide antigen binding
  downstream:
  - target: Anti-Desmoglein 1 IgG Autoantibody Production
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Presentation of Dsg1 peptides on the permissive allele licenses the
      autoreactive T-cell help that drives anti-Dsg1 antibody production.
    evidence:
    - reference: PMID:10642599
      reference_title: Desmoglein-1-specific T lymphocytes from patients with endemic pemphigus foliaceus (fogo selvagem).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These Dsg1-reactive FS T cells exhibited a CD4-positive memory T-cell
        phenotype and produced a T helper 2-like cytokine profile.
      explanation: >-
        Dsg1-specific CD4+ Th2 T cells provide the help linking HLA presentation
        to antibody production.
  evidence:
  - reference: PMID:9027963
    reference_title: An epitope in the third hypervariable region of the DRB1 gene is involved in the susceptibility to endemic pemphigus foliaceus (fogo selvagem) in three different Brazilian populations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All these alleles involved in predisposition to the disease in different
      populations shared the same amino acid sequence at position 67-74 on the
      third hypervariable region of the DRB1 gene: LLEQRRAA
    explanation: >-
      Identifies the shared HLA-DRB1 epitope conferring susceptibility.
- name: Anti-Desmoglein 1 IgG Autoantibody Production
  biological_scale: CELLULAR
  description: >-
    Loss of B-cell tolerance to Dsg1 produces circulating IgG autoantibodies. In
    endemic fogo selvagem the response precedes clinical disease and is
    initially IgG1; a Dsg1-reactive Th2 response provides the CD4+ help.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: immunoglobulin production
    term:
      id: GO:0002377
      label: immunoglobulin production
    modifier: INCREASED
  downstream:
  - target: IgG4 Subclass Switch and Epitope Maturation
    causal_link_type: DIRECT
    description: >-
      The preclinical antibody response matures toward pathogenic IgG4 as
      clinical disease appears.
    evidence:
    - reference: PMID:12535205
      reference_title: The role of subclass switching in the pathogenesis of endemic pemphigus foliaceus.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Acquisition of an IgG4 response is a key step in the development of
        clinical disease.
      explanation: >-
        Links the maturing autoantibody response to disease onset.
  evidence:
  - reference: PMID:10882765
    reference_title: The prevalence of antibodies against desmoglein 1 in endemic pemphigus foliaceus in Brazil. Cooperative Group on Fogo Selvagem Research.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the onset of the disease is preceded by a sustained antibody response
    explanation: >-
      Anti-Dsg1 antibodies are present and rising before clinical fogo selvagem.
- name: IgG4 Subclass Switch and Epitope Maturation
  biological_scale: MOLECULAR
  description: >-
    Pathogenic autoantibodies are predominantly IgG4 and recognize conformational
    epitopes in the N-terminal EC1-EC2 adhesive domains of Dsg1. Active disease
    is marked by a large excess of IgG4 over IgG1 and convergence onto these
    pathogenic epitopes.
  downstream:
  - target: Loss of Desmoglein 1 Adhesion
    causal_link_type: DIRECT
    description: >-
      IgG4 directed at the EC1 adhesive interface directly blocks Dsg1
      trans-adhesion.
    evidence:
    - reference: PMID:19340014
      reference_title: Pathogenic epitopes of autoantibodies in pemphigus reside in the amino-terminal adhesive region of desmogleins which are unmasked by proteolytic processing of prosequence.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        these findings support the idea that at least some pathogenic pemphigus
        autoantibodies induce the loss of cell adhesion by directly binding the
        trans-interaction site of Dsgs
      explanation: >-
        Pathogenic anti-Dsg1 binds the adhesive trans-interaction site.
  evidence:
  - reference: PMID:12535205
    reference_title: The role of subclass switching in the pathogenesis of endemic pemphigus foliaceus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients have similar levels of IgG1 but a mean 19.3-fold higher IgG4
      response
    explanation: >-
      Quantifies the IgG4 dominance that characterizes active disease.
  - reference: PMID:29307589
    reference_title: Pathogenic IgG4 autoantibodies from endemic pemphigus foliaceus recognize a desmoglein-1 conformational epitope.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IgG4 from 95% of FS donor sera (19/20) recognized a 16-residue peptide
    explanation: >-
      Maps the pathogenic IgG4 response to a defined EC1 epitope.
- name: Loss of Desmoglein 1 Adhesion
  conforms_to: "desmosomal_adhesion_failure#Desmosomal Component Loss or Blockade"
  biological_scale: MOLECULAR
  description: >-
    Autoantibody binding to Dsg1 blocks its adhesive trans-interaction with
    desmocollin 1, disabling the desmosomal cadherin without any host mutation.
    Fab fragments alone abolish native Dsg1-Dsc1 binding, showing steric
    blockade is sufficient.
  genes:
  - preferred_term: DSG1
    term:
      id: hgnc:3048
      label: DSG1
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: cell-cell adhesion
    term:
      id: GO:0098609
      label: cell-cell adhesion
    modifier: DECREASED
  downstream:
  - target: p38 MAPK Signaling and Desmosome Disassembly
    causal_link_type: DIRECT
    description: >-
      Antibody binding triggers intracellular signaling that actively
      disassembles desmosomes.
    evidence:
    - reference: PMID:21605805
      reference_title: Diagnosis and clinical features of pemphigus foliaceus.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The binding of pathogenic IgG to dsg-1 triggers the phosphorylation of
        p38 mitogen-activated protein kinase (MAPK)
      explanation: >-
        Connects antibody binding to the p38 signaling step.
  - target: Desmoglein Compensation and Mucosal Sparing
    causal_link_type: DIRECT
    description: >-
      Whether Dsg1 loss produces a lesion depends on whether Dsg3 is co-expressed
      to compensate, so the adhesion defect feeds the compensation gate.
  evidence:
  - reference: PMID:29307589
    reference_title: Pathogenic IgG4 autoantibodies from endemic pemphigus foliaceus recognize a desmoglein-1 conformational epitope.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      native binding interactions between Dsg1 and desmocollin 1 (Dsc1), which
      underlie desmosome structure, were abolished by Fab fragments of FS IgG4
    explanation: >-
      Monovalent Fab abolishes Dsg1-Dsc1 adhesion, establishing direct steric
      blockade.
- name: p38 MAPK Signaling and Desmosome Disassembly
  conforms_to: "desmosomal_adhesion_failure#Loss of Desmosomal Intercellular Adhesion"
  biological_scale: CELLULAR
  description: >-
    Anti-Dsg1 binding activates p38 MAPK signaling in keratinocytes, promoting
    desmosome disassembly and Dsg1 depletion in addition to direct steric
    blockade.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: desmosome disassembly
    term:
      id: GO:0035921
      label: desmosome disassembly
    modifier: INCREASED
  downstream:
  - target: Superficial Acantholysis and Blister Formation
    causal_link_type: DIRECT
    description: >-
      Combined adhesion loss and desmosome disassembly detach superficial
      keratinocytes.
  evidence:
  - reference: PMID:21605805
    reference_title: Diagnosis and clinical features of pemphigus foliaceus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The binding of pathogenic IgG to dsg-1 triggers the phosphorylation of
      p38 mitogen-activated protein kinase (MAPK) which is thought to induce
      apoptosis of the affected keratinocyte
    explanation: >-
      Describes the p38 MAPK signaling response to antibody binding.
- name: Superficial Acantholysis and Blister Formation
  conforms_to: "desmosomal_adhesion_failure#Acantholysis and Mechanical Failure of Desmosome-Dependent Tissues"
  biological_scale: TISSUE
  description: >-
    Loss of Dsg1-mediated adhesion in the granular layer detaches keratinocytes
    from one another (acantholysis), producing subcorneal blisters that rupture
    easily into scaly, crusted erosions.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  locations:
  - preferred_term: stratum granulosum of epidermis
    term:
      id: UBERON:0002069
      label: stratum granulosum of epidermis
  downstream:
  - target: Superficial crusted erosions
    causal_link_type: DIRECT
  - target: Flaccid blisters
    causal_link_type: DIRECT
  - target: Granular-layer acantholysis
    causal_link_type: DIRECT
    description: Histopathologic readout of the acantholysis at the granular layer.
  - target: Scaling skin
    causal_link_type: DIRECT
    description: Ruptured superficial blisters leave the scaly surface.
  - target: Exfoliative erythroderma
    causal_link_type: DIRECT
    description: The generalized, confluent form of the superficial erosive disease.
  evidence:
  - reference: PMID:21605805
    reference_title: Diagnosis and clinical features of pemphigus foliaceus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the loss of intercellular connections between keratinocytes (acantholysis)
      and the formation of subcorneal blisters within the epidermis
    explanation: >-
      States the acantholysis-to-subcorneal-blister step in the granular layer.
- name: Desmoglein Compensation and Mucosal Sparing
  biological_scale: TISSUE
  description: >-
    In mucosa and deep epidermis, Dsg3 is co-expressed with Dsg1 and compensates
    when Dsg1 is disabled, so anti-Dsg1 alone (as in PF) causes no lesions there.
    In the superficial epidermis, where Dsg1 is expressed without Dsg3,
    anti-Dsg1 is sufficient to blister. This explains the superficial, non-mucosal
    topography that distinguishes PF from pemphigus vulgaris.
  downstream:
  - target: Superficial Acantholysis and Blister Formation
    causal_link_type: DIRECT
    description: >-
      Where Dsg3 does not compensate (superficial epidermis), the adhesion loss
      proceeds to acantholysis; this gates the site at which blisters form.
  evidence:
  - reference: PMID:10021453
    reference_title: Explanations for the clinical and microscopic localization of lesions in pemphigus foliaceus and vulgaris.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In areas (such as superficial epidermis of normal mice) where Dsg1 without
      Dsg3 is expressed, anti-Dsg1 antibodies alone can cause blisters.
    explanation: >-
      Desmoglein compensation theory explaining the superficial-only topography.
  - reference: PMID:10021453
    reference_title: Explanations for the clinical and microscopic localization of lesions in pemphigus foliaceus and vulgaris.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      either Dsg1 or Dsg3 alone is sufficient to maintain keratinocyte adhesion
    explanation: >-
      Co-expression of Dsg3 protects mucosa and deep epidermis in PF.

genetic:
- name: HLA-DRB1
  gene_term:
    preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  relationship_type: SUSCEPTIBILITY
  association: >-
    Class II alleles DRB1*0102, *0404, *1402 and *1406 confer risk across
    endemic populations, sharing the LLEQRRAA sequence at positions 67-74 of the
    DRB1 third hypervariable region.
  evidence:
  - reference: PMID:9027963
    reference_title: An epitope in the third hypervariable region of the DRB1 gene is involved in the susceptibility to endemic pemphigus foliaceus (fogo selvagem) in three different Brazilian populations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      particular HLA alleles confer increased risk for the disease
    explanation: >-
      HLA-DRB1 alleles are the established susceptibility loci.
environmental:
- name: Arthropod (sand fly) salivary antigen exposure
  description: >-
    In endemic fogo selvagem, epidemiology implicates hematophagous insect
    bites. Anti-Dsg1 autoantibodies cross-react with the sand fly salivary
    protein LJM11, and immunizing mice with LJM11 generates anti-Dsg1 antibodies,
    supporting molecular mimicry as the trigger in genetically susceptible people.
  effect: Proposed environmental trigger of endemic PF via molecular mimicry
  influences_mechanisms:
  - target: Anti-Desmoglein 1 IgG Autoantibody Production
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Salivary antigen exposure elicits antibodies that cross-react with Dsg1.
    evidence:
    - reference: PMID:22798673
      reference_title: 'Cutting Edge: Brazilian pemphigus foliaceus anti-desmoglein 1 autoantibodies cross-react with sand fly salivary LJM11 antigen.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Anti-Dsg1 monoclonal autoantibodies derived from FS patients also
        cross-react with LJM11.
      explanation: >-
        Patient-derived anti-Dsg1 monoclonals cross-react with the sand fly
        salivary antigen in vitro.
    - reference: PMID:22798673
      reference_title: 'Cutting Edge: Brazilian pemphigus foliaceus anti-desmoglein 1 autoantibodies cross-react with sand fly salivary LJM11 antigen.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice immunized with LJM11 generate anti-Dsg1 Abs.
      explanation: >-
        Immunizing mice with the salivary antigen raises anti-Dsg1 antibodies,
        the in-vivo half of the mimicry argument.
  notes: >-
    No ECTO exposure_term is bound: ECTO was searched for a sand fly / arthropod
    salivary-antigen exposure class (l~sand fly, l~insect bite, l~arthropod) and
    no term matching salivary-antigen exposure was found. The concept is a
    proposed molecular-mimicry trigger rather than a chemical or organism
    exposure with an existing ECTO class. The entry and its mechanism link carry
    their own literature evidence.
  evidence:
  - reference: PMID:10882765
    reference_title: The prevalence of antibodies against desmoglein 1 in endemic pemphigus foliaceus in Brazil. Cooperative Group on Fogo Selvagem Research.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the production of antibodies against desmoglein 1 is initiated by exposure
      to an unknown environmental agent
    explanation: >-
      Supports an environmental trigger for endemic PF.
- name: Drug exposure (thiol and other trigger drugs)
  description: >-
    Drugs can trigger PF, most classically the thiol drug penicillamine; a
    pharmacovigilance analysis confirmed elevated pemphigus reporting for several
    trigger drugs.
  effect: Recognized environmental trigger of drug-induced PF
  exposure_term:
    preferred_term: exposure to penicillamine
    term:
      id: ECTO:0000509
      label: exposure to drug
  chemicals:
  - penicillamine
  notes: >-
    Bound to the generic ECTO:0000509 (exposure to drug) with a
    penicillamine-specific preferred_term: ECTO was searched (l~penicillamine,
    l~thiol, and the exposure-to-drug subtree) and has no penicillamine-specific
    exposure class. The first guessed id (ECTO:9000561) proved to be exposure to
    propachlor and was rejected.
  influences_mechanisms:
  - target: Anti-Desmoglein 1 IgG Autoantibody Production
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Thiol and other trigger drugs can precipitate anti-Dsg1 autoimmunity.
    evidence:
    - reference: PMID:39906745
      reference_title: A comprehensive, population level evaluation of previously reported drug triggers of pemphigus highlights immunomodulatory capacity as a common characteristic.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the odds of reporting the adverse event pemphigus were significantly
        elevated among individuals exposed to 11/36 previously reported trigger
        drugs
      explanation: >-
        Population-level confirmation of drug triggers of pemphigus.
  evidence:
  - reference: PMID:21605805
    reference_title: Diagnosis and clinical features of pemphigus foliaceus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most commonly implicated drug is penicillamine
    explanation: >-
      Penicillamine is the classic drug trigger.
treatments:
- name: Rituximab
  description: >-
    Anti-CD20 B-cell-depleting monoclonal antibody, first-line for
    moderate-to-severe pemphigus in European and international guidelines. The
    RITUX 3 trial (newly diagnosed PV and PF) showed rituximab plus short-term
    prednisone far exceeded prednisone alone; a PF-specific meta-analysis found a
    pooled 75% complete remission rate.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Anti-Desmoglein 1 IgG Autoantibody Production
    treatment_effect: INHIBITS
    description: >-
      B-cell depletion reduces anti-Dsg1 autoantibody production.
  evidence:
  - reference: PMID:42390708
    reference_title: 'Efficacy and Safety of Rituximab in Pemphigus Foliaceus: A Systematic Review and Meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pooled complete remission (CR) rate was 75.0% (95% confidence interval
      (CI) 64.0-83.0; I2 = 35.5%)
    explanation: >-
      PF-specific meta-analysis of rituximab efficacy.
  - reference: PMID:28342637
    reference_title: 'First-line rituximab combined with short-term prednisone versus prednisone alone for the treatment of pemphigus (Ritux 3): a prospective, multicentre, parallel-group, open-label randomised trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At month 24, 41 (89%) of 46 patients assigned to rituximab plus short-term
      prednisone were in complete remission off-therapy versus 15 (34%) of 44
      assigned to prednisone alone
    explanation: >-
      RITUX 3 randomized trial (enrolling PV and PF) establishing first-line
      rituximab benefit.
- name: Systemic corticosteroids
  description: >-
    Oral prednisone (about 0.5-1 mg/kg/day, then tapered) is the mainstay for
    inducing control, used with a steroid-sparing agent or rituximab.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
  target_mechanisms:
  - target: Superficial Acantholysis and Blister Formation
    treatment_effect: INHIBITS
    description: >-
      Immunosuppression reduces autoantibody-driven blistering.
  evidence:
  - reference: PMID:28342637
    reference_title: 'First-line rituximab combined with short-term prednisone versus prednisone alone for the treatment of pemphigus (Ritux 3): a prospective, multicentre, parallel-group, open-label randomised trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      High doses of corticosteroids are considered the standard treatment for
      pemphigus.
    explanation: >-
      Corticosteroids are the standard induction therapy (stated in the RCT's
      background).
- name: Dapsone
  description: >-
    Useful in milder PF, sometimes as a steroid-sparing agent; PF can respond
    dramatically to dapsone.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dapsone
      term:
        id: CHEBI:4325
        label: dapsone
  target_mechanisms:
  - target: Superficial Acantholysis and Blister Formation
    treatment_effect: INHIBITS
    description: >-
      Anti-inflammatory/steroid-sparing control of milder disease.
  evidence:
  - reference: PMID:23248372
    reference_title: Pemphigus foliaceus masquerading as IgA pemphigus and responding to dapsone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      he was started on dapsone, to which he responded dramatically in four
      weeks
    explanation: >-
      Case of PF responding to dapsone.
diagnosis:
- name: Direct immunofluorescence of perilesional skin
  description: >-
    DIF of perilesional skin shows intercellular IgG (with or without C3) in a
    chicken-wire pattern; it is the diagnostic gold standard.
  evidence:
  - reference: PMID:21605805
    reference_title: Diagnosis and clinical features of pemphigus foliaceus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      PF shows a DIF pattern characterized by fluorescent staining around
      keratinocytes, which is known as the intercellular space (ICS) staining
      pattern
    explanation: >-
      Describes the intercellular (chicken-wire) DIF staining pattern that
      confirms PF.
- name: Nikolsky sign
  description: >-
    Lateral pressure on perilesional skin shears the epidermis; a common,
    highly specific bedside sign in pemphigus.
  evidence:
  - reference: PMID:21605805
    reference_title: Diagnosis and clinical features of pemphigus foliaceus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A common clinical finding in PF is a positive Nikolsky's sign
    explanation: >-
      Nikolsky sign is a characteristic bedside finding in PF.
- name: Anti-desmoglein 1 ELISA
  description: >-
    Serum anti-Dsg1 IgG is detected by ELISA; antibody levels rise with disease
    onset, and pure PF is anti-Dsg3 negative.
  evidence:
  - reference: PMID:10882765
    reference_title: The prevalence of antibodies against desmoglein 1 in endemic pemphigus foliaceus in Brazil. Cooperative Group on Fogo Selvagem Research.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We used an enzyme-linked immunosorbent assay to detect antibodies against
      desmoglein 1 in serum samples from 60 patients with endemic pemphigus
      foliaceus
    explanation: >-
      Anti-Dsg1 ELISA is the serologic test used in PF patients.
  - reference: PMID:10882765
    reference_title: The prevalence of antibodies against desmoglein 1 in endemic pemphigus foliaceus in Brazil. Cooperative Group on Fogo Selvagem Research.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the onset of disease was associated with a marked increase in antibody
      values
    explanation: >-
      Anti-Dsg1 antibody levels track the transition to clinical disease.
animal_models:
- name: Naturally occurring canine and feline pemphigus foliaceus
  species: Dog
  description: >-
    PF is one of the most common autoimmune skin diseases of dogs and cats, with
    IgG autoantibodies against the keratinocyte cell surface and pustules,
    crusts, erosions, scales and alopecia. A naturally occurring companion-animal
    counterpart of human PF.
  publication: PMID:39725576
  modeled_mechanisms:
  - target: Anti-Desmoglein 1 IgG Autoantibody Production
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Spontaneous IgG-mediated anti-keratinocyte-surface autoimmunity with a PF
      phenotype.
    limitations: >-
      The dominant autoantigen in canine PF is debated and may differ from Dsg1;
      pustular/neutrophilic features are more prominent than in most human PF.
    evidence:
    - reference: PMID:39725576
      reference_title: Canine and Feline Pemphigus Foliaceus-an Update on Pathogenesis and Treatment.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the pathophysiology of canine and feline PF appears to involve immune
        dysregulation and immunoglobulin G autoantibodies that are directed
        against the keratinocyte cell surface
      explanation: >-
        Establishes the shared IgG anti-keratinocyte-surface mechanism.
- name: Passive-transfer neonatal mouse model
  species: Mouse
  genotype: BALB/c neonatal
  description: >-
    Purified IgG from PF (fogo selvagem) patients transferred to neonatal mice
    reproduces the clinical, histologic and immunologic disease, proving the
    autoantibodies are pathogenic.
  publication: PMID:3905977
  modeled_mechanisms:
  - target: Superficial Acantholysis and Blister Formation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Passive transfer of patient IgG produces PF-identical lesions.
    limitations: >-
      Neonatal skin and a short observation window; models the effector arm, not
      the initiation of autoimmunity.
    evidence:
    - reference: PMID:3905977
      reference_title: Brazilian pemphigus foliaceus autoantibodies are pathogenic to BALB/c mice by passive transfer.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thirty-four of 46 mice (74%) receiving parenteral IgG fractions from
        these patients developed cutaneous lesions that were identical to the
        human disease
      explanation: >-
        Passive transfer reproduces the disease, establishing antibody
        pathogenicity.

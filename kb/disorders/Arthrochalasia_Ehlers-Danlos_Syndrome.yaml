    snippet: The advice to management of the skin, cardiovascular, and ophthalmological features is similar to that for patients with classical EDS
    explanation: Broader-EDS extrapolation is explicit.
- name: Genetic counseling and family evaluation
  description: Counsel on dominant transmission in classic disease, testing of a known family variant, variable functional severity and reproductive options. Both inherited and sporadic cases occur. Do not assign the lethal-OI parental-mosaicism percentage to aEDS or infer a confirmed carrier from mild features alone.
  evidence:
  - reference: PMID:1990839
    reference_title: 'A mutation in the pro alpha 2(I) gene (COL1A2) for type I procollagen in Ehlers-Danlos syndrome type VII: evidence suggesting that skipping of exon 6 in RNA splicing may be a common cause of the phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Allele-specific oligonucleotide hybridizations demonstrated that the proband's mother, father, and brother did not have the mutation. Therefore, the mutation was a sporadic one.
    explanation: One family with an apparent de novo variant.
  - reference: PMID:1556139
    reference_title: A base substitution at the splice acceptor site of intron 5 of the COL1A2 gene activates a cryptic splice site within exon 6 and generates abnormal type I procollagen in a patient with Ehlers-Danlos syndrome type VII.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The proband and her son were heterozygous for the mutation.
    explanation: Direct inherited variant.
  - reference: PMID:21801164
    reference_title: 'Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Somatic mosaicism for this IVS6+1G>T mutation was not demonstrated.
    explanation: Negative testing is not proof of an aEDS mosaic parent.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
- name: Cardiovascular assessment and individualized follow-up
  description: Consider cardiology assessment and echocardiographic follow-up according to examination and detected abnormalities. One molecularly confirmed child developed mitral, aortic and tricuspid regurgitation during annual follow-up. The case report supports vigilance but cannot establish universal annual imaging or preventive cardiovascular medication for all aEDS patients.
  evidence:
  - reference: PMID:23158907
    reference_title: 'Cardiac valve disease: an unreported feature in Ehlers Danlos syndrome arthrocalasia type?'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Transthoracic echocardiograms using semiquantitative grading of valve regurgitation, were performed once a year. After two-year follow-up, combined valvulopathy, resulting in mitral, tricuspidal and aortic regurgitation, were detected.
    explanation: Observed follow-up and progression in one child.
  - reference: PMID:23158907
    reference_title: 'Cardiac valve disease: an unreported feature in Ehlers Danlos syndrome arthrocalasia type?'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Since we demonstrated a progressive valvular involvement a careful cardiac follow-up is warranted for EDS type VII patients
    explanation: Case-report recommendation, not a consensus surveillance interval.

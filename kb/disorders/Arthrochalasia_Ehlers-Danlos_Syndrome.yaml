genetic:
- name: COL1A1
  gene_term:
    preferred_term: COL1A1
    term:
      id: hgnc:2197
      label: COL1A1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: Classic disease involves heterozygous variants affecting all or part of exon 6. Other variants in the same gene can cause osteogenesis imperfecta or COL1-related overlap phenotypes; gene identity alone is insufficient. Genotype–severity comparisons remain limited by selected cohorts and family overlap.
  evidence:
  - reference: PMID:39629471
    reference_title: Genetic diagnosis of the Ehlers-Danlos syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: aEDS is caused by complete or partial loss of exon 6 of either COL1A2 or COL1A1 that precludes trimming by procollagen N-proteinase and leads to retention of the N-propeptide in the collagen type I triple helix.
    explanation: Contemporary molecular diagnostic synthesis.

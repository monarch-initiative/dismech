    term:
      id: hgnc:2198
      label: COL1A2
  description: The COL1A2-related form, historically EDS VIIB, affects proalpha2(I). Variants remove all or part of exon 6, including the N-proteinase cleavage site; both splice donor and cryptic splice acceptor mechanisms are documented.
  evidence:
  - reference: PMID:10073586
    reference_title: 'Ehlers-Danlos syndrome type VII: clinical features and molecular defects.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: both of our patients had type-VIIB Ehlers-Danlos syndrome, which is caused by heterozygous new mutations of the COL1A2 gene that encodes the proalpha2(I) chain of type-I procollagen. The obligatory GT dinucleotide at the splice donor site of intron 6 was altered in both of our patients
    explanation: Documents heterozygous COL1A2 splice-donor mutations at the intron 6 boundary as the molecular cause of type VIIB arthrochalasia.
    quote_role: PRIMARY_RESULT
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: Classic exon-6-related disease may be inherited or arise de novo. An affected heterozygous parent has a one-in-two transmission probability per pregnancy. A negative parental blood result does not exclude gonadal mosaicism, but the reviewed aEDS reports do not establish a numeric mosaic recurrence risk. Familial transmission and affected adults with children contradict a presumed universal reproductive limitation.
  evidence:
  - reference: PMID:32091183
    reference_title: Clinical features, molecular results, and management of 12 individuals with the rare arthrochalasia Ehlers-Danlos syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Arthrochalasia Ehlers-Danlos syndrome (aEDS) is a rare autosomal dominant connective tissue disorder
    explanation: Disease inheritance context.
  - reference: PMID:1990839
    reference_title: 'A mutation in the pro alpha 2(I) gene (COL1A2) for type I procollagen in Ehlers-Danlos syndrome type VII: evidence suggesting that skipping of exon 6 in RNA splicing may be a common cause of the phenotype.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Allele-specific oligonucleotide hybridizations demonstrated that the proband's mother, father, and brother did not have the mutation. Therefore, the mutation was a sporadic one.
    explanation: Family testing in one case, not an estimate of the de novo proportion.
  - reference: PMID:1556139
    reference_title: A base substitution at the splice acceptor site of intron 5 of the COL1A2 gene activates a cryptic splice site within exon 6 and generates abnormal type I procollagen in a patient with Ehlers-Danlos syndrome type VII.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The proband and her son were heterozygous for the mutation.
    explanation: Direct familial transmission.
  - reference: PMID:32091183
    reference_title: Clinical features, molecular results, and management of 12 individuals with the rare arthrochalasia Ehlers-Danlos syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: One patient gave birth to two affected children and went through preterm labor requiring medication but had no additional complications.
    explanation: One observed pregnancy history; not universal pregnancy safety.
pathophysiology:
- name: COL1A1 Exon 6-Affecting Variants
  description: Heterozygous splice-region variants or genomic deletions affect exon 6 of COL1A1. This is a structural collagen-processing disorder, not a general loss of enzyme production.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:39629471
    reference_title: Genetic diagnosis of the Ehlers-Danlos syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Genetic investigations in individuals with suspected aEDS should focus on pathogenic COL1A2 or COL1A1 variants affecting exon 6 splicing and should include exon (5 and) 6 deletion analysis.
    explanation: Variant classes in a contemporary diagnostic review.
  role: trigger
  gene:
    preferred_term: COL1A1
    term:
      id: hgnc:2197
      label: COL1A1
  downstream:
  - target: Loss of Exon 6 Sequence from Collagen Transcripts
    description: Splice-region or genomic changes remove the corresponding coding sequence from the transcript.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39629471
      reference_title: Genetic diagnosis of the Ehlers-Danlos syndromes.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: aEDS is caused by complete or partial loss of exon 6 of either COL1A2 or COL1A1 that precludes trimming by procollagen N-proteinase and leads to retention of the N-propeptide in the collagen type I triple helix.
      explanation: Molecular diagnostic synthesis.

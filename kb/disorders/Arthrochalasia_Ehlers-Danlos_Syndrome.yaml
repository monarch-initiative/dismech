- name: Skin protection and wound planning
  description: Minimize skin trauma from devices and procedures. Plan tension-free closure and follow-up with awareness of delayed healing; the review recommends longer suture retention, but timing should reflect the wound and specialist assessment. This guidance does not imply that every patient has extreme skin fragility.
  evidence:
  - reference: PMID:35162892
    reference_title: 'Ehlers-Danlos Syndrome Type Arthrochalasia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Certain guidelines should be taken into account to avoid complications such as leaving sutures twice as long as normal before suture removal and that wounds should be closed without tension
    explanation: Expert guidance summarized by a review, not comparative outcome evidence.
  treatment_term:
    preferred_term: Wound Care Management
    term:
      id: NCIT:C116681
      label: Wound Care Management
  target_mechanisms:
  - target: Poor Wound Healing
    treatment_effect: MODULATES
    description: Careful closure and reduced tension compensate for fragile healing tissues; the underlying matrix defect persists.
    evidence:
    - reference: PMID:35162892
      reference_title: 'Ehlers-Danlos Syndrome Type Arthrochalasia: A Systematic Review.'
      supports: SUPPORT
      evidence_source: OTHER

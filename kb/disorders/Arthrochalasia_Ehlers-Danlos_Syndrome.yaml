    label: Ehlers-Danlos syndrome, arthrochalasia type
synonyms:
- aEDS
- EDS VII
- EDS type VII
- Ehlers-Danlos syndrome type 7
- Ehlers-Danlos syndrome, type VII
- arthrochalasis multiplex congenita
- arthrochalasia EDS
parents:
- Ehlers-Danlos Syndrome
- Connective Tissue Disorder
description: Arthrochalasia Ehlers–Danlos syndrome is a rare type I collagen disorder usually presenting at birth with congenital hip dislocation, severe generalized joint hypermobility and recurrent dislocations. Classic disease is caused by heterozygous COL1A1 or COL1A2 variants that remove all or part of exon 6 from the collagen transcript, disrupting N-propeptide cleavage. Skin abnormalities, hypotonia, motor delay and skeletal complications vary. The clinical diagnosis requires molecular interpretation; other COL1-related overlap phenotypes, including an emerging recessive arthrochalasia-like presentation, should not be assumed to share this exon-6 mechanism.

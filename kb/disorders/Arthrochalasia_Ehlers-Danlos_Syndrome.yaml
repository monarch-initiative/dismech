- name: Individualized scoliosis bracing
  description: A genetically diagnosed COL1A2 case improved from a 43.6-degree lumbar curve to 8 degrees after 3.5 years of a Wood-Rigo-Cheneau brace plus weekly physical therapy; at age 6 the curve measured 14 degrees after six months out of brace. Ongoing growth surveillance was required. This uncontrolled combination cannot prove brace superiority or permanent avoidance of surgery.
  evidence:
  - reference: PMID:39343458
    reference_title: Syndromic scoliosis in a patient with arthrochalasia Ehlers-Danlos syndrome corrected with a Wood-Rigo-Cheneau derotational brace.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Through shared decision making with their EDS specialist, the family elected to proceed with conservative management using the WRC brace, in conjunction with weekly physical therapy.
    explanation: Combined exposure in one child.
  - reference: PMID:39343458
    reference_title: Syndromic scoliosis in a patient with arthrochalasia Ehlers-Danlos syndrome corrected with a Wood-Rigo-Cheneau derotational brace.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: After 3.5 years, the patient’s Cobb angle decreased to 8°. His Cobb angle was stable under 15° on brace for 12 months. At the age of 6, after being out of brace for 6 months, his curve measured 14°
    explanation: Actual follow-up; not a controlled treatment comparison.
  target_mechanisms:
  - target: Kyphoscoliosis
    treatment_effect: MODULATES
    description: External corrective forces can modify spinal alignment in selected patients while growth and skin tolerance are monitored.

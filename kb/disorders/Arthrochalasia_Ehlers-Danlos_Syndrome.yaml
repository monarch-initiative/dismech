- name: Joint orthoses and activity adaptation
  description: Select orthoses and footwear for joint stability and tolerance. Skin abrasions or hematomas may require modification or discontinuation. Avoid activities with high dislocation risk; prescribed rehabilitation should remain individualized.
  evidence:
  - reference: PMID:21801164
    reference_title: 'Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: If skin problems are mild, the use of orthoses to stabilize knee, ankle and of foot joints can improve motor development.
    explanation: Clinical series recommendation, not a randomized effect.
  - reference: PMID:21801164
    reference_title: 'Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT

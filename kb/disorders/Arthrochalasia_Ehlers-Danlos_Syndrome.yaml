has_subtypes:
- name: Arthrochalasia Type 1
  display_name: Arthrochalasia Type 1 (EDS VIIA, COL1A1-related)
  subtype_term:
    preferred_term: COL1A1-related arthrochalasia Ehlers-Danlos syndrome
    term:

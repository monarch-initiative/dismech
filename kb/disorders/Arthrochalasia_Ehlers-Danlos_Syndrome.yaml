- name: Bone-health assessment and selected bisphosphonate use
  description: Assess fractures and radiographic findings in context; DXA may be normal despite radiographic osteopenia. One of twelve participants received a bisphosphonate, but the available cohort abstract gives no agent, dose, response or comparative benefit. This is documented use, not an aEDS-specific routine-treatment recommendation.
  evidence:
  - reference: PMID:32091183
    reference_title: Clinical features, molecular results, and management of 12 individuals with the rare arthrochalasia Ehlers-Danlos syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Fractures were present in 9/12 individuals with 1 patient requiring bisphosphonate treatment.
    explanation: Exposure only; no BMD or fracture response reported.
  - reference: PMID:21801164
    reference_title: 'Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Radiographic evaluation of the skeleton revealed presence of Wormian bones, thoracic scoliosis and generalized osteopenia. Bone densitometry however yielded normal values for DEXA Z-scores at the level of the femur and the lumbar spine.
    explanation: Radiographic and DXA discordance supports careful assessment.
  treatment_term:

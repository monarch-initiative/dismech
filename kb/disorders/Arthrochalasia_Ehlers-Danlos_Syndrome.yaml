- name: Loss of Procollagen N-Proteinase Cleavage Site
  description: The shortened collagen substrate lacks its normal N-proteinase cleavage site. Some complete deletions also remove a crosslinking lysine, but the five-residue COL1A2 deletion preserves that lysine; lysine loss is not required in every case.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:3082886
    reference_title: Deletion of 24 amino acids from the pro-alpha 1(I) chain of type I procollagen in a patient with the Ehlers-Danlos syndrome type VII.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Loss of the procollagen N-proteinase cleavage site from the mutant pro-alpha 1(I) chain accounted for the persistence of its NH2-propeptide despite normal production of the N-proteinase by cultured mutant fibroblasts.
    explanation: Structural substrate defect despite normal enzyme production.
  - reference: PMID:1556139
    reference_title: A base substitution at the splice acceptor site of intron 5 of the COL1A2 gene activates a cryptic splice site within exon 6 and generates abnormal type I procollagen in a patient with Ehlers-Danlos syndrome type VII.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In contrast to previously reported cases of EDS-VIIB, Lys5 of the N-telopeptide was not deleted and appeared to take part in the formation of intramolecular cross-linkages.
    explanation: Counterexample to universal crosslink-lysine deletion.
  downstream:
  - target: Retained Procollagen N-Propeptide
    description: The structurally altered substrate is poorly cleaved despite normal protease production.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:3082886
      reference_title: Deletion of 24 amino acids from the pro-alpha 1(I) chain of type I procollagen in a patient with the Ehlers-Danlos syndrome type VII.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Loss of the procollagen N-proteinase cleavage site from the mutant pro-alpha 1(I) chain accounted for the persistence of its NH2-propeptide despite normal production of the N-proteinase by cultured mutant fibroblasts.
      explanation: Direct patient-derived fibroblast biochemical evidence.
- name: Retained Procollagen N-Propeptide
  description: Impaired cleavage leaves pN collagen chains with the amino-terminal propeptide attached. Patient fibroblast assays demonstrate delayed processing; they do not establish a systemic deficiency of procollagen N-proteinase.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:3082886
    reference_title: Deletion of 24 amino acids from the pro-alpha 1(I) chain of type I procollagen in a patient with the Ehlers-Danlos syndrome type VII.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Loss of the procollagen N-proteinase cleavage site from the mutant pro-alpha 1(I) chain accounted for the persistence of its NH2-propeptide despite normal production of the N-proteinase by cultured mutant fibroblasts.
    explanation: Normal enzyme output distinguishes this from ADAMTS2-related dermatosparaxis.
  - reference: PMID:21801164
    reference_title: 'Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In comparison with processing of procollagen from control cell cultures, amino propeptide processing was substantially delayed in this proband.
    explanation: Pulse-labeling comparison with control cultures over five days.

  subtype: Arthrochalasia Type 2
  notes: >
    Encodes proalpha2(I), the single alpha-2 chain in the type I procollagen
    heterotrimer. This is the more commonly reported molecular subtype,
    usually caused by splice-donor mutations at the intron 6 boundary.
  evidence:
  - reference: PMID:10073586
    reference_title: "Ehlers-Danlos syndrome type VII: clinical features and molecular defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "type-VIIB Ehlers-Danlos syndrome, which is caused by heterozygous new mutations of the COL1A2 gene that encodes the proalpha2(I) chain of type-I procollagen"
    explanation: Establishes heterozygous COL1A2 mutations as the molecular cause of type VIIB aEDS.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Reported variants are typically heterozygous de novo events rather than
    inherited from an affected parent, consistent with the severity of the
    musculoskeletal phenotype and its likely effect on reproductive fitness.
  evidence:
  - reference: PMID:32091183
    reference_title: "Clinical features, molecular results, and management of 12 individuals with the rare arthrochalasia Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Arthrochalasia Ehlers-Danlos syndrome (aEDS) is a rare autosomal dominant connective tissue disorder"
    explanation: States the autosomal dominant inheritance pattern of aEDS.
  - reference: PMID:1990839
    reference_title: "A mutation in the pro alpha 2(I) gene (COL1A2) for type I procollagen in Ehlers-Danlos syndrome type VII: evidence suggesting that skipping of exon 6 in RNA splicing may be a common cause of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Allele-specific oligonucleotide hybridizations demonstrated that the proband's mother, father, and brother did not have the mutation. Therefore, the mutation was a sporadic one."
    explanation: Documents a de novo (sporadic) exon-6-skipping mutation, consistent with the reproductively limiting nature of the dominant phenotype.
diagnosis:
- name: Differentiation from Dermatosparaxis EDS and Other Multiple-Dislocation Syndromes
  description: >
    Diagnosis relies on the characteristic combination of congenital bilateral
    hip dislocation, severe generalized joint hypermobility, and skin
    hyperextensibility, confirmed by identification of a COL1A1 or COL1A2
    exon-6-skipping variant. Neonatal presentation overlaps with other
    multiple-joint-dislocation syndromes such as Larsen syndrome; the
    distinction from dermatosparaxis EDS (ADAMTS2-related) is that
    dermatosparaxis is dominated by extreme skin fragility and bruising
    rather than joint dislocation.
  evidence:
  - reference: PMID:21801164
    reference_title: "Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis of arthrochalasia type of EDS is further complicated by the neonatal phenotypic overlap with other skeletal dysplasias such as Larsen syndrome, pseudodiastrophic dysplasia, Desbuquois dysplasia, and other less-well delineated multiple joint dislocation or arthrogryposis syndromes and neuromuscular disorders."
    explanation: Documents the differential diagnostic challenge of neonatal arthrochalasia EDS.
  - reference: PMID:21801164
    reference_title: "Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the clinical phenotype of the arthrochalasia EDS is considerably different from that of dermatosparaxis type (VIIC), caused by mutations in the procollagen I N-proteinase, ADAMTS2, that prevent proper processing of the type I procollagen and in which extreme skin fragility and easy bruising are the predominant clinical features"
    explanation: States the key clinical distinction from dermatosparaxis EDS.
treatments:
- name: Hip Surgical Management
  description: >
    Because closed reduction of the congenital hip dislocation is essentially
    never successful, open reduction combined with capsulorrhaphy and iliac
    or femoral osteotomy is used, though outcomes remain imperfect and
    surgery may be deferred in some patients over concern for poor wound
    healing and post-surgical redislocation.
  treatment_term:
    preferred_term: Orthopedic Surgical Procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:10073586
    reference_title: "Ehlers-Danlos syndrome type VII: clinical features and molecular defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results of open reduction were improved when capsulorrhaphy was combined with iliac or femoral osteotomy, or both."
    explanation: Documents the surgical approach and outcome for congenital hip dislocation in aEDS.
  - reference: PMID:32091183
    reference_title: "Clinical features, molecular results, and management of 12 individuals with the rare arthrochalasia Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hip surgery was performed in 5/12 patients and 3/12 patients underwent spinal surgery."
    explanation: Quantifies the frequency of surgical intervention in a dedicated aEDS cohort.
- name: Bisphosphonate Therapy for Skeletal Fragility
  description: >
    Used in at least one reported patient with recurrent fractures.
  treatment_term:
    preferred_term: Bisphosphonate Therapy
    term:
      id: NCIT:C198585
      label: Bisphosphonate Therapy
  evidence:
  - reference: PMID:32091183
    reference_title: "Clinical features, molecular results, and management of 12 individuals with the rare arthrochalasia Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fractures were present in 9/12 individuals with 1 patient requiring bisphosphonate treatment."
    explanation: Documents bisphosphonate treatment use for skeletal fragility in aEDS.
- name: Genetic Counseling
  description: >
    Genetic counseling regarding autosomal dominant inheritance, typically
    de novo occurrence, and recurrence risk.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:1990839
    reference_title: "A mutation in the pro alpha 2(I) gene (COL1A2) for type I procollagen in Ehlers-Danlos syndrome type VII: evidence suggesting that skipping of exon 6 in RNA splicing may be a common cause of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Allele-specific oligonucleotide hybridizations demonstrated that the proband's mother, father, and brother did not have the mutation. Therefore, the mutation was a sporadic one."
    explanation: Establishes the typically sporadic (de novo) origin relevant to genetic counseling and recurrence-risk discussion.
prevalence:
- population: Published cases (cumulative literature)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    A 2020 cohort study reported that 42 patients with aEDS had been
    published in total prior to their own 12-patient addition, making this
    one of the rarest EDS subtypes.
  evidence:
  - reference: PMID:32091183
    reference_title: "Clinical features, molecular results, and management of 12 individuals with the rare arthrochalasia Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 42 patients with aEDS have been published."
    explanation: Establishes the cumulative published case count as of this cohort study, supporting the ultra-rare classification.
  - reference: PMID:35162892
    reference_title: "Ehlers-Danlos Syndrome Type Arthrochalasia: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, about 42 patients have been reported worldwide"
    explanation: A 2022 systematic review corroborates the same cumulative published case count.

    explanation: Distinguishes new participants from repeat follow-up.
diagnosis:
- name: Clinical suspicion and molecular confirmation
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: Congenital hip dislocation, severe generalized hypermobility and skin hyperextensibility prompt testing. The 2017 minimum clinical criteria are suggestive, not independently confirmatory. Sequence and copy-number evaluation should include COL1A1/COL1A2 exon 6 and neighboring exon 5 deletions where appropriate; variant interpretation must distinguish classic aEDS from other COL1-related disorders.
  evidence:
  - reference: url:https://www.ehlers-danlos.com/wp-content/uploads/2022/12/Malfait_et_al-2017-American_Journal_of_Medical_Genetics_Part_C__Seminars_in_Medical_Genetics.pdf
    reference_title: https://www.ehlers-danlos.com/wp-content/uploads/2022/12/Malfait_et_al-2017-American_Journal_of_Medical_Genetics_Part_C__Seminars_in_Medical_Genetics.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Confirmatory molecular testing is obligatory to reach a final diagnosis.
    explanation: International classification recommendation.
  - reference: PMID:39629471
    reference_title: Genetic diagnosis of the Ehlers-Danlos syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Genetic investigations in individuals with suspected aEDS should focus on pathogenic COL1A2 or COL1A1 variants affecting exon 6 splicing and should include exon (5 and) 6 deletion analysis.
    explanation: Updated diagnostic review.
- name: RNA and collagen-processing studies
  description: Transcript analysis can establish complete exon skipping or cryptic splice-site use. Fibroblast collagen electrophoresis may show retained pN chains and delayed processing. These assays characterize uncertain molecular effects and were diagnostic in historical cases; current diagnosis is not established by an arbitrary collagen-gene VUS alone.
  evidence:
  - reference: PMID:21801164
    reference_title: 'Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In cells from the proband direct sequencing of the RT-PCR product revealed heterozygous skipping of the entire sequence of exon 6 of COL1A2.
    explanation: Patient-cell transcript assay.
  - reference: PMID:21801164
    reference_title: 'Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In comparison with processing of procollagen from control cell cultures, amino propeptide processing was substantially delayed in this proband.
    explanation: Patient-cell processing assay.
- name: Dermal ultrastructure as an adjunct
  description: Transmission electron microscopy may show disorganized small irregular fibrils, but it cannot independently confirm aEDS or reliably replace molecular testing.
  evidence:
  - reference: url:https://www.ehlers-danlos.com/wp-content/uploads/2022/12/Malfait_et_al-2017-American_Journal_of_Medical_Genetics_Part_C__Seminars_in_Medical_Genetics.pdf
    reference_title: https://www.ehlers-danlos.com/wp-content/uploads/2022/12/Malfait_et_al-2017-American_Journal_of_Medical_Genetics_Part_C__Seminars_in_Medical_Genetics.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: These findings may support the diagnosis, but cannot confirm it.
    explanation: Classification qualification immediately after its aEDS TEM description.
  - reference: PMID:21801164
    reference_title: 'Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Fibril density was lower in the dermis than in control, and occasional cauliflower deformations of the fibrils were seen. Collagen fibrils were irregular in contour and had distinctly smaller diameters than in control samples (43.82 +/- 6.09 nm).
    explanation: Positive biopsy finding in one molecularly investigated adult.
differential_diagnoses:
- name: Other COL1-related disorders including osteogenesis imperfecta
  description: COL1A1/COL1A2 variants can cause bone-fragility phenotypes and EDS/OI overlap. Blue sclerae, dental changes or fractures alone do not distinguish these conditions. Classic aEDS is associated specifically with the exon 6 processing defect.
  evidence:
  - reference: PMID:39629471
    reference_title: Genetic diagnosis of the Ehlers-Danlos syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Some individuals carry pathogenic variants previously reported as causative for osteogenesis imperfecta
    explanation: Overlap and variable expressivity in the COL1-related-disorder section.
- name: ADAMTS2-related dermatosparaxis EDS
  description: Both conditions can retain procollagen N-propeptides, but dermatosparaxis results from enzyme deficiency whereas aEDS alters its collagen substrate; severe skin fragility can overlap.
  evidence:
  - reference: PMID:21801164
    reference_title: 'Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: dermatosparaxis type (VIIC), caused by mutations in the procollagen I N-proteinase, ADAMTS2, that prevent proper processing of the type I procollagen and in which extreme skin fragility and easy bruising are the predominant clinical features.
    explanation: Allelic and mechanistic differential.
- name: Larsen syndrome and congenital neuromuscular disorders
  description: Congenital joint dislocations and hypotonia can mimic skeletal or neuromuscular disease. Skin findings and properly interpreted molecular studies guide the differential rather than hypotonia alone.
  evidence:
  - reference: PMID:21801164
    reference_title: 'Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Many children with arthrochalasia type EDS are suspected of having another connective tissue disorder (particularly Larsen syndrome), a neurological disorder or some type of skeletal dysplasia.
    explanation: Clinical diagnostic overlap.
treatments:
- name: Physical and occupational therapy
  description: Early individualized rehabilitation supports motor development, safe mobility and daily activities. Recommendations come mainly from expert review and case experience, not controlled aEDS trials.
  evidence:
  - reference: url:https://www.ehlers-danlos.com/wp-content/uploads/2022/03/Brady_et_al-2017-American_Journal_of_Medical_Genetics_Part_C-_Seminars_in_Medical_Genetics.pdf

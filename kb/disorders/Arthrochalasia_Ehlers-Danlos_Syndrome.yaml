progression:
- phase: Congenital and infantile presentation
  notes: Hip dislocation and generalized hypermobility can be evident at birth; hypotonia and recurrent instability delay motor milestones. Cognitive and motor development must be assessed separately.
  evidence:
  - reference: PMID:21801164
    reference_title: 'Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Motor development is significantly delayed in the neonatal and postnatal period due to muscular hypotonia and recurrent joint luxations, but cognitive development is usually normal.
    explanation: Case-series trajectory; not a population prognosis.
- phase: Childhood and adulthood
  notes: Hypotonia may improve while instability, pain, scoliosis, fractures or mobility restrictions persist. The 2020 selected series included 4/12 participants unable to walk unaided or using wheelchairs, while most of eight adults entered a career. These are neither independent population estimates nor an inevitable course.
  evidence:
  - reference: PMID:32091183
    reference_title: Clinical features, molecular results, and management of 12 individuals with the rare arthrochalasia Ehlers-Danlos syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: As much as 4/12 patients were wheelchair-bound or unable to walk unaided.
    explanation: Selected cohort including six previously reported adults.
  - reference: PMID:32091183
    reference_title: Clinical features, molecular results, and management of 12 individuals with the rare arthrochalasia Ehlers-Danlos syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Of the eight adults in our cohort, the majority entered a career.
    explanation: Adult participation outcome in a selected cohort.
clinical_burden:
  burden_level: HIGH
  rationale: Severe congenital instability, repeated orthopedic care, fractures and impaired mobility can produce substantial disability. Four of twelve selected participants used wheelchairs or could not walk unaided, while other affected individuals remained ambulatory; the cohort does not establish the population distribution.
  evidence:
  - reference: PMID:32091183
    reference_title: Clinical features, molecular results, and management of 12 individuals with the rare arthrochalasia Ehlers-Danlos syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As much as 4/12 patients were wheelchair-bound or unable to walk unaided.
    explanation: Quantifies the loss of independent ambulation in a dedicated arthrochalasia EDS cohort, the clearest single figure for the disease's functional burden.
    quote_role: PRIMARY_RESULT
prevalence:
- population: Published arthrochalasia EDS literature
  measure_type: CASES_IN_LITERATURE
  notes: 'True population prevalence is unknown. Published totals differ with date and case inclusion: the 2017 rare-types review counted 49 individuals from 36 families, whereas the 2020 cohort cited42 earlier reports and comprised six new participants plus six follow-ups. These overlapping totals should not be added or converted to a numeric prevalence band.'
  evidence:
  - reference: url:https://www.ehlers-danlos.com/wp-content/uploads/2022/03/Brady_et_al-2017-American_Journal_of_Medical_Genetics_Part_C-_Seminars_in_Medical_Genetics.pdf

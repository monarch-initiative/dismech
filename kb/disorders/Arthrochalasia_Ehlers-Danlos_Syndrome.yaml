  genes:
  - preferred_term: COL1A1
    term:
      id: hgnc:2197
      label: COL1A1
  description: The COL1A1-related form, historically EDS VIIA, affects proalpha1(I). A more severe musculoskeletal phenotype has been suggested, but small selected cohorts and related participants limit comparison with COL1A2 disease.
  evidence:
  - reference: PMID:32091183
    reference_title: Clinical features, molecular results, and management of 12 individuals with the rare arthrochalasia Ehlers-Danlos syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our data point toward a genotype-phenotype relationship with individuals with aEDS due to pathogenic COL1A1 variants causing complete or partial loss of exon 6 being more severely affected regarding musculoskeletal features.
    explanation: A 12-patient cohort reports COL1A1 exon 6 loss variants associate with more severe musculoskeletal disease.
    quote_role: PRIMARY_RESULT
  - reference: PMID:21801164
    reference_title: 'Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: However, according to our series of patients, the phenotype seems to be similar in patients with COL1A1 (patients 5-7) and COL1A2 mutations (patients 1-4), at least in the neonatal and postnatal periods.
    explanation: The three COL1A1 participants belong to one family; this is not a powered comparison.

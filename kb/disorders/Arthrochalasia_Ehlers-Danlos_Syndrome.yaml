- name: Pain and psychological support
  description: Individualize pain management and support coping with chronic instability and disability. The literature recommends anti-inflammatory medication and psychological or behavioral support, but does not establish a preferred regimen or aEDS-specific trial benefit.
  evidence:
  - reference: PMID:35162892
    reference_title: 'Ehlers-Danlos Syndrome Type Arthrochalasia: A Systematic Review.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Anti-inflammatory drugs can help patients with joint pain. In patients with muscle hypotonia and joint instability with chronic pain, emotional support and behavioral and psychological therapy to aid in accepting and offering coping strategies to manage disability is advised.
    explanation: Review recommendations, with no disease-specific comparative effect estimate.

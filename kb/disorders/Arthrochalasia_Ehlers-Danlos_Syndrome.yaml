- name: Hip surgical management
  description: Closed reduction often fails in published selected cases. A specialist team weighs mobility goals, recurrence and wound risk when considering open reduction with pelvic or femoral osteotomy. Case-series experience does not establish a universal operation or inevitable failure of every conservative attempt.
  evidence:
  - reference: PMID:10073586
    reference_title: 'Ehlers-Danlos syndrome type VII: clinical features and molecular defects.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The results of open reduction were improved when capsulorrhaphy was combined with iliac or femoral osteotomy, or both.
    explanation: Historical selected-case comparison.
  - reference: PMID:32091183
    reference_title: Clinical features, molecular results, and management of 12 individuals with the rare arthrochalasia Ehlers-Danlos syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Hip surgery was performed in 5/12 patients and 3/12 patients underwent spinal surgery.
    explanation: Treatment exposure, not comparative efficacy.
  - reference: PMID:21801164
    reference_title: 'Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: She underwent a bilateral open hip reduction surgery at age 18 months but the right hip immediately redislocated.
    explanation: Observed recurrence despite surgery.

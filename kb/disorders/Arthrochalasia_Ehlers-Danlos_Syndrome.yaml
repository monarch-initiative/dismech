- name: Specialist surgery for severe spinal deformity
  description: 'A 2025 report followed one clinically diagnosed patient for 17 years: traditional rods at age 5 were later replaced by magnetically lengthened rods at age 10. Kyphosis improved and sitting balance was good, but the scoliosis Cobb angle remained 100 degrees and wheelchair use persisted because of hip dislocation. The exchange procedure involved 1000 cc blood loss. No genotype, control group or general efficacy advantage was established.'
  evidence:
  - reference: PMID:40227332
    reference_title: Seventeen-year outcome of surgical management of severe early onset kyphoscoliosis in a patient with arthrochalasia-type Ehlers-Danlos.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The procedure was complicated by 1000 cc of blood loss, attributed to the vascular fragility of this patient due to their aEDS.
    explanation: Major blood loss during rod exchange qualifies the favorable abstract.
  - reference: PMID:40227332
    reference_title: Seventeen-year outcome of surgical management of severe early onset kyphoscoliosis in a patient with arthrochalasia-type Ehlers-Danlos.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: His Cobb angle has remained stable 100 degrees with good correction of kyphosis. He still ambulates in a wheelchair (due to a chronic hip dislocation since aged 9) with good sitting balance.
    explanation: Long-term outcome distinguishes stability, kyphosis and mobility.

      label: Ehlers-Danlos syndrome type 7A
  genes:
  - preferred_term: COL1A1
    term:
      id: hgnc:2197
      label: COL1A1
  description: >
    Caused by heterozygous variants causing partial or complete loss of exon
    6 of COL1A1, encoding proalpha1(I). Because type I procollagen contains
    two proalpha1(I) chains per heterotrimer, COL1A1 exon 6 loss variants
    have been reported to produce more severe musculoskeletal disease than
    the COL1A2 form, though this genotype-phenotype relationship is not
    consistently observed across all reported cohorts.
  evidence:
  - reference: PMID:32091183
    reference_title: "Clinical features, molecular results, and management of 12 individuals with the rare arthrochalasia Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data point toward a genotype-phenotype relationship with individuals with aEDS due to pathogenic COL1A1 variants causing complete or partial loss of exon 6 being more severely affected regarding musculoskeletal features."
    explanation: A 12-patient cohort reports COL1A1 exon 6 loss variants associate with more severe musculoskeletal disease.
  - reference: PMID:21801164
    reference_title: "Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A previous report suggests that COL1A1 mutations lead to a more severe phenotype than COL1A2 mutations (4) based on procollagen molecular structure that contains two pro alpha 1(I) chains and only one pro alpha 2(I) chain.(5) However, according to our series of patients, the phenotype seems to be similar in patients with COL1A1"
    explanation: Notes that while COL1A1 variants have been proposed as more severe due to procollagen stoichiometry, a subsequent case series found similar severity between the two genes, so this genotype-phenotype claim is not fully settled.
- name: Arthrochalasia Type 2
  display_name: Arthrochalasia Type 2 (EDS VIIB, COL1A2-related)
  subtype_term:
    preferred_term: COL1A2-related arthrochalasia Ehlers-Danlos syndrome
    term:
      id: MONDO:0040501
      label: Ehlers-Danlos syndrome, arthrochalasia type, 2
  genes:
  - preferred_term: COL1A2
    term:
      id: hgnc:2198
      label: COL1A2
  description: >
    Caused by heterozygous variants causing partial or complete loss of exon
    6 of COL1A2, encoding proalpha2(I), most often through mutation of the
    consensus GT splice-donor dinucleotide at the intron 6 boundary. This is
    the more commonly reported molecular subtype.
  evidence:
  - reference: PMID:10073586
    reference_title: "Ehlers-Danlos syndrome type VII: clinical features and molecular defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both of our patients had type-VIIB Ehlers-Danlos syndrome, which is caused by heterozygous new mutations of the COL1A2 gene that encodes the proalpha2(I) chain of type-I procollagen. The obligatory GT dinucleotide at the splice donor site of intron 6 was altered in both of our patients"
    explanation: Documents heterozygous COL1A2 splice-donor mutations at the intron 6 boundary as the molecular cause of type VIIB arthrochalasia.
pathophysiology:
- name: COL1A1 Exon 6 Skipping Variant
  biological_scale: MOLECULAR
  subtypes:
  - Arthrochalasia Type 1
  description: >
    A heterozygous splice-site or intragenic variant causes partial or
    complete skipping of exon 6 in COL1A1 transcripts, deleting the
    N-telopeptide-encoding sequence from a fraction of proalpha1(I) chains.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
    zygosity: HETEROZYGOUS
  genes:
  - preferred_term: COL1A1
    term:
      id: hgnc:2197
      label: COL1A1
  evidence:
  - reference: PMID:3082886
    reference_title: "Deletion of 24 amino acids from the pro-alpha 1(I) chain of type I procollagen in a patient with the Ehlers-Danlos syndrome type VII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an expected sequence of 24 amino acids (positions 136-159 of the normal pN-alpha 1(I) CB0,1 peptide) was deleted. The segment deleted from the mutant pro-alpha 1(I) chain contains the small globular region of the NH2-propeptide, the procollagen N-proteinase cleavage site, the NH2-telopeptide, and first triplet of the helix"
    explanation: Direct amino-acid sequencing of a patient's COL1A1-encoded proalpha1(I) chain demonstrates an in-frame deletion removing the N-proteinase cleavage site, consistent with the exon-skipping mechanism.
  downstream:
  - target: Loss of Procollagen N-Proteinase Cleavage Site
    causal_link_type: DIRECT
- name: COL1A2 Exon 6 Skipping Variant
  biological_scale: MOLECULAR
  subtypes:
  - Arthrochalasia Type 2
  description: >
    A heterozygous single-base substitution at the consensus GT splice-donor
    dinucleotide of intron 6, or a nearby splice-disrupting variant, causes
    exon 6 to be skipped during COL1A2 pre-mRNA splicing, deleting the
    N-telopeptide-encoding sequence from a fraction of proalpha2(I) chains.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
    zygosity: HETEROZYGOUS
  genes:
  - preferred_term: COL1A2
    term:
      id: hgnc:2198
      label: COL1A2
  evidence:
  - reference: PMID:1990839
    reference_title: "A mutation in the pro alpha 2(I) gene (COL1A2) for type I procollagen in Ehlers-Danlos syndrome type VII: evidence suggesting that skipping of exon 6 in RNA splicing may be a common cause of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of genomic clones revealed a single-base mutation that converted the first nucleotide of intron 6 from G to A. Therefore, the mutation was a change, in the -GT-consensus splice site, that produced efficient exon skipping."
    explanation: Identifies the causal splice-donor mutation producing COL1A2 exon 6 skipping.
  - reference: PMID:1556139
    reference_title: "A base substitution at the splice acceptor site of intron 5 of the COL1A2 gene activates a cryptic splice site within exon 6 and generates abnormal type I procollagen in a patient with Ehlers-Danlos syndrome type VII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "inactivation of the 3' splice site of intron 5 by an AG to AC mutation and the activation of a cryptic AG splice acceptor site corresponding to positions +14 and +15 of exon 6"
    explanation: Documents a distinct splice-acceptor mutation causing partial exon 6 loss via a cryptic splice site in COL1A2.
  downstream:
  - target: Loss of Procollagen N-Proteinase Cleavage Site
    causal_link_type: DIRECT
- name: Loss of Procollagen N-Proteinase Cleavage Site
  biological_scale: MOLECULAR
  description: >
    Exon 6 encodes 18 amino acids of the N-telopeptide that carry both the
    procollagen N-proteinase cleavage site and a collagen cross-linking
    lysine residue. Chains lacking this exon cannot be cleaved by procollagen
    N-proteinase (ADAMTS2) at their normal site, converging on the same
    molecular defect that biallelic ADAMTS2 loss causes in dermatosparaxis
    EDS, but here arising from the substrate rather than the enzyme.
  biological_processes:
  - preferred_term: protein processing
    modifier: DECREASED
    term:
      id: GO:0016485
      label: protein processing
  downstream:
  - target: Retained Procollagen N-Propeptide
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:8081389
    reference_title: "Further evidence that the failure to cleave the aminopropeptide of type I procollagen is the cause of Ehlers-Danlos syndrome type VII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exon 6 encodes 18 amino acids of the N-telopeptide which contains the procollagen N-proteinase cleavage site and a cross-link precursor lysine. Loss of these sequences would result in failure to cleave the amino-propeptide of pro-alpha 2(I)"
    explanation: Establishes that exon 6 loss removes the N-proteinase cleavage site itself, directly causing the processing failure.
- name: Retained Procollagen N-Propeptide
  biological_scale: MOLECULAR
  description: >
    Because only one COL1A2 (or COL1A1) allele carries the exon-6-skipping
    variant, dermal fibroblasts synthesize a mixture of normal and mutant
    proalpha chains in roughly equal amounts; the mutant chains retain their
    N-propeptide (pN-collagen) since the cleavage site needed to remove it is
    absent.
  biological_processes:
  - preferred_term: collagen biosynthetic process
    modifier: ABNORMAL
    term:
      id: GO:0032964
      label: collagen biosynthetic process
  downstream:
  - target: Aberrant Collagen Fibril Assembly
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:8081389
    reference_title: "Further evidence that the failure to cleave the aminopropeptide of type I procollagen is the cause of Ehlers-Danlos syndrome type VII."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Dermal fibroblasts from a Chinese Ehlers-Danlos syndrome type VII patient synthesized approximately equal amounts of normal pro-alpha 2(I) chains of type I procollagen and abnormal ones with electrophoretic mobility of pN alpha 2(I) chains, in which the amino-propeptide (N-propeptide) was retained."
    explanation: Direct biochemical demonstration that the heterozygous mutant allele produces a substantial fraction of N-propeptide-retaining pN-collagen chains.
- name: Aberrant Collagen Fibril Assembly
  biological_scale: TISSUE
  description: >
    Incorporation of pN-collagen chains into assembling type I collagen
    fibrils produces fibrils of irregular contour and reduced diameter, with
    lower fibril density in the dermis than normal. This differs from the
    flattened "hieroglyphic" ribbon morphology of dermatosparaxis EDS, in
    which essentially all secreted collagen retains its N-propeptide; here
    only a fraction of chains are affected, since the unaffected allele
    continues to produce normally processed chains.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: DECREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  downstream:
  - target: Loss of Connective Tissue Tensile Strength
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21801164
    reference_title: "Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fibril density was lower in the dermis than in control, and occasional cauliflower deformations of the fibrils were seen. Collagen fibrils were irregular in contour and had distinctly smaller diameters than in control samples"
    explanation: Electron microscopy of patient dermis directly demonstrates the abnormal fibril morphology and reduced fibril density.
- name: Loss of Connective Tissue Tensile Strength
  biological_scale: TISSUE
  description: >
    Structurally abnormal collagen fibrils reduce the tensile strength of
    connective tissue throughout the body, most consequentially in joint
    capsule/ligament, skin, and bone, where type I collagen is the dominant
    structural collagen.
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  downstream:
  - target: Joint Capsule and Ligament Laxity
    causal_link_type: DIRECT
  - target: Skin Fragility and Abnormal Texture
    causal_link_type: DIRECT
  - target: Skeletal Fragility
    causal_link_type: DIRECT
- name: Joint Capsule and Ligament Laxity
  biological_scale: TISSUE
  description: >
    Weakened periarticular connective tissue produces severe generalized
    joint instability, most severely affecting the hips, which are
    congenitally dislocated because the joint capsule cannot maintain normal
    femoral head containment in utero.
  downstream:
  - target: Congenital Hip Dislocation
  - target: Generalized Joint Hypermobility
  - target: Recurrent Joint Dislocation
  - target: Congenital or Early-Onset Hypotonia
  - target: Kyphoscoliosis
- name: Skin Fragility and Abnormal Texture
  biological_scale: TISSUE
  description: >
    Weakened dermal collagen produces hyperextensible, doughy-textured skin
    with a tendency to bruise easily.
  downstream:
  - target: Hyperextensible Skin
  - target: Bruising Susceptibility
- name: Skeletal Fragility
  biological_scale: TISSUE
  description: >
    Abnormal type I collagen in bone matrix, compounded by recurrent joint
    trauma from dislocation, predisposes to fracture and mild reduction in
    bone mineral density.
  downstream:
  - target: Recurrent Fractures
  - target: Osteopenia

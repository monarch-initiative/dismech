- name: Loss of Exon 6 Sequence from Collagen Transcripts
  description: Complete exon skipping or cryptic splice-site use removes different lengths of coding sequence. Whole-exon losses affect 24 residues in proalpha1(I) or 18 in proalpha2(I); a COL1A2 partial deletion can remove only five residues.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:21801164
    reference_title: 'Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In cells from the proband direct sequencing of the RT-PCR product revealed heterozygous skipping of the entire sequence of exon 6 of COL1A2.
    explanation: Direct patient-cell RNA result.
  - reference: PMID:8081389
    reference_title: Further evidence that the failure to cleave the aminopropeptide of type I procollagen is the cause of Ehlers-Danlos syndrome type VII.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: Exon 6 encodes 18 amino acids of the N-telopeptide which contains the procollagen N-proteinase cleavage site and a cross-link precursor lysine.
    explanation: COL1A2 exon-encoded segment; this length is not generalized to COL1A1.
  - reference: PMID:1556139
    reference_title: A base substitution at the splice acceptor site of intron 5 of the COL1A2 gene activates a cryptic splice site within exon 6 and generates abnormal type I procollagen in a patient with Ehlers-Danlos syndrome type VII.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: These 15 nucleotides were deleted in the splicing of alpha 2(I) pre-mRNA to mRNA as a result of inactivation of the 3' splice site of intron 5 by an AG to AC mutation and the activation of a cryptic AG splice acceptor site corresponding to positions +14 and +15 of exon 6.
    explanation: Allele-specific cryptic splicing; not whole-exon loss.
  downstream:
  - target: Loss of Procollagen N-Proteinase Cleavage Site
    description: Loss of exon-encoded residues removes the substrate cleavage site.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:3082886
      reference_title: Deletion of 24 amino acids from the pro-alpha 1(I) chain of type I procollagen in a patient with the Ehlers-Danlos syndrome type VII.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: The segment deleted from the mutant pro-alpha 1(I) chain contains the small globular region of the NH2-propeptide, the procollagen N-proteinase cleavage site, the NH2-telopeptide, and first triplet of the helix of the alpha I(I) collagen chain
      explanation: Direct peptide characterization of the COL1A1 deletion.

name: Arthrochalasia Ehlers-Danlos Syndrome
category: Mendelian
creation_date: "2026-09-15T22:22:27Z"
description: >
  Arthrochalasia Ehlers-Danlos syndrome (aEDS, formerly EDS type VII A/B) is a
  rare autosomal dominant connective-tissue disorder caused by heterozygous
  variants in COL1A1 (aEDS type 1) or COL1A2 (aEDS type 2) that cause partial
  or complete skipping of exon 6, the exon encoding the N-telopeptide of
  proalpha1(I) or proalpha2(I). Exon 6 carries the cleavage site for
  procollagen N-proteinase, so its loss prevents removal of the N-propeptide
  from mutant chains: pN-collagen accumulates and, because a proportion of
  assembling type I procollagen heterotrimers incorporate a mutant chain
  alongside normal ones, the resulting collagen fibrils are structurally
  abnormal even though only one allele is affected. The disease is defined
  clinically by severe generalized joint hypermobility with congenital
  bilateral hip dislocation and skin hyperextensibility. This shares its
  terminal defect (retained N-propeptide, defective fibril assembly) with
  dermatosparaxis EDS, which arises instead from biallelic loss of the
  N-proteinase enzyme itself (ADAMTS2); the two conditions are nonetheless
  clinically distinct, with joint dislocation dominating arthrochalasia and
  extreme skin fragility/bruising dominating dermatosparaxis.

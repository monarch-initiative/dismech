- name: Pregnancy and delivery planning
  description: Offer specialist follow-up through pregnancy and plan delivery where maternal and neonatal complications can be managed. Published affected mothers had live births, including affected children; possible perineal or pelvic-floor risks extrapolated from classical EDS should not be represented as measured aEDS event rates. Postpartum hemorrhage has been reported in one published affected mother; the selected literature denominator is not a prospective risk estimate.
  evidence:
  - reference: url:https://www.ehlers-danlos.com/wp-content/uploads/2022/03/Brady_et_al-2017-American_Journal_of_Medical_Genetics_Part_C-_Seminars_in_Medical_Genetics.pdf
    reference_title: https://www.ehlers-danlos.com/wp-content/uploads/2022/03/Brady_et_al-2017-American_Journal_of_Medical_Genetics_Part_C-_Seminars_in_Medical_Genetics.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Delivery should be performed in a medical center where intensive treat- ment could be given to an affected pregnant woman and an affected neonate  # codespell:ignore-line
    explanation: Expert aEDS delivery recommendation.
  - reference: PMID:28981071
    reference_title: 'Vascular phenotypes in nonvascular subtypes of the Ehlers-Danlos syndrome: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: postpartum hemorrhaging was reported in one patient with aEDS (1/12 females, 8%) after the birth of each of her children
    explanation: One selected literature case, not an estimated pregnancy risk.
- name: Multidisciplinary clinical surveillance
  description: Monitor mobility, spinal alignment, skin/device tolerance, bone health and relevant dental or ocular findings. The 2017 review refers skin, cardiovascular and ophthalmic management to classical-EDS guidance; this does not establish a vascular-EDS-like rupture risk or universal intensive cardiac surveillance schedule.
  evidence:
  - reference: url:https://www.ehlers-danlos.com/wp-content/uploads/2022/03/Brady_et_al-2017-American_Journal_of_Medical_Genetics_Part_C-_Seminars_in_Medical_Genetics.pdf

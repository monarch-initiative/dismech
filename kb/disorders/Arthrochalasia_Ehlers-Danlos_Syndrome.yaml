genetic:
- name: COL1A1
  gene_term:
    preferred_term: COL1A1
    term:
      id: hgnc:2197
      label: COL1A1
  relationship_type: CAUSATIVE
  subtype: Arthrochalasia Type 1
  notes: >
    Encodes proalpha1(I), one of the two alpha-1 chains in the type I
    procollagen heterotrimer [alpha1(I)]2[alpha2(I)]1. Exon-6-skipping
    variants are heterozygous and reported to associate with more severe
    musculoskeletal disease than the COL1A2 form in some but not all cohorts.
  evidence:
  - reference: PMID:32091183
    reference_title: "Clinical features, molecular results, and management of 12 individuals with the rare arthrochalasia Ehlers-Danlos syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most (n = 10) patients had variants leading to (partial) loss of exon 6 of the COL1A1 or COL1A2 genes."
    explanation: Establishes COL1A1 exon 6 loss variants as a molecular cause of aEDS in this cohort.

  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Patient-derived cultured dermal fibroblasts
  description: Cultured fibroblasts and collagen peptide/cDNA analysis from a heterozygous family showed loss of fifteen nucleotides and five residues, with persistent pNalpha2 chains. The crosslink lysine remained; dermal solubility/extraction suggested altered crosslinking but did not map every crosslink. The available cache is abstract-only.
  evidence:

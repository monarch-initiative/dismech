discussions:
- discussion_id: aeds_recessive_overlap_boundary
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How should biallelic non-exon-6 COL1A1 arthrochalasia-like disease be classified?
  attaches_to:
  - genetic#COL1A1
  rationale: A 2026 report describes one ten-month-old child homozygous for exon 31 p.Glu684Lys with healthy heterozygous parents. The authors call the variant likely pathogenic using PM1/PM2/PP3/PP5, including a prior assertion whose underlying evidence was unavailable. They explicitly distinguish an arthrochalasia-like or COL1-related overlap phenotype from the currently recognized dominant form. No RNA, N-propeptide processing, helix stability, integrin binding or rescue assay was performed. Proposed charge and GFOGER-binding effects remain hypotheses; long-term cognition, course and founder origin are unresolved. These observations should not change classic aEDS inheritance or its exon 6 mechanism by assumption.
  evidence:
  - reference: PMID:42353838
    reference_title: 'A Homozygous Missense COL1A1 Variant (p.Glu684Lys) Associated with an Arthrochalasia-like Ehlers-Danlos Syndrome Phenotype: A Case Report.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: The molecular mechanism of the missense variant c.2050G>A (p.Glu684Lys) has not been definitively established.
    explanation: Explicit absence of an established variant mechanism.
  - reference: PMID:42353838
    reference_title: 'A Homozygous Missense COL1A1 Variant (p.Glu684Lys) Associated with an Arthrochalasia-like Ehlers-Danlos Syndrome Phenotype: A Case Report.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: Although the p.Glu684Lys substitution is predicted to disrupt integrin–collagen interaction, in vivo impairment of this interaction has not been experimentally confirmed for this particular variant. Consequently, the functional consequences remain hypothetical.
    explanation: No direct binding or organismal validation.
  - reference: PMID:42353838
    reference_title: 'A Homozygous Missense COL1A1 Variant (p.Glu684Lys) Associated with an Arthrochalasia-like Ehlers-Danlos Syndrome Phenotype: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Haplotype analysis was not performed in the current study; therefore, it remains unknown whether this variant represents a shared founder haplotype or arose as an independent mutational event.
    explanation: Founder origin is untested.
- discussion_id: aeds_fracture_risk_and_source_conflicts
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What is the age-specific fracture burden in molecularly confirmed aEDS?
  attaches_to:
  - phenotypes#Bone Fractures
  - phenotypes#Osteopenia
  rationale: 'The 2020 selected cohort reports 9/12 with fractures; the 2019 mixed-EDS study contains only one probable, non-molecularly confirmed aEDS case without fractures. Its pooled odds ratio and infant findings should not become aEDS-specific risk estimates. The 2012 article contains incompatible fracture statements: patient 4 had slowly healing fractures and a positive table cell, but the table total is 0/7 and discussion says none. The 2022 review also misrepresents the 2020 bone review, whose abstract explicitly includes aEDS among rare types with frequent fractures/low BMD. A deduplicated, genetically defined longitudinal cohort is needed; source contradictions should not be resolved by inventing a numerator.'
  evidence:
  - reference: PMID:32091183
    reference_title: Clinical features, molecular results, and management of 12 individuals with the rare arthrochalasia Ehlers-Danlos syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Fractures were present in 9/12 individuals with 1 patient requiring bisphosphonate treatment.
    explanation: Selected cohort observation.
  - reference: PMID:30856599
    reference_title: Fracture incidence in Ehlers-Danlos syndrome - A population-based case-control study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The subject with arthrochalasia EDS had no fractures.
    explanation: One negative observation.
  - reference: PMID:32162201
    reference_title: Bone Disease in Patients with Ehlers-Danlos Syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Low bone mineral density and fractures seem to be frequent in some of the rare EDS types (kyphoscoliotic, arthrochalasia, spondylodysplastic, and classic-like EDS).
    explanation: Actual bone-review statement contradicts its later secondary characterization.
- discussion_id: aeds_genotype_severity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Does COL1A1 exon6 disruption consistently cause more severe disease than COL1A2 disruption?
  attaches_to:
  - genetic#COL1A1
  - genetic#COL1A2
  rationale: Type I collagen contains two alpha1 chains and one alpha2 chain, motivating a mutant-molecule stoichiometry hypothesis. Clinical comparisons remain small and overlapping. The 2020 series suggested more severe COL1A1 musculoskeletal involvement; the 2012 series reported similar early phenotypes, but its three COL1A1 participants came from one family. Neither establishes a deterministic prognosis or a universally measured fraction of defective molecules.
  evidence:
  - reference: PMID:32091183
    reference_title: Clinical features, molecular results, and management of 12 individuals with the rare arthrochalasia Ehlers-Danlos syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Our data point toward a genotype-phenotype relationship with individuals with aEDS due to pathogenic COL1A1 variants causing complete or partial loss of exon 6 being more severely affected regarding musculoskeletal features.
    explanation: Selected cohort inference.
  - reference: PMID:21801164
    reference_title: 'Ehlers-Danlos arthrochalasia type (VIIA-B)--expanding the phenotype: from prenatal life through adulthood.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Part of this similarity can be attributed to the fact that patients 5-7 all come from the same family
    explanation: Non-independence limits genotype comparison.
- discussion_id: aeds_cardiovascular_scope
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What cardiovascular surveillance is justified in molecularly confirmed aEDS?
  attaches_to:
  - phenotypes#Mitral Regurgitation
  - treatments#Cardiovascular assessment and individualized follow-up
  rationale: One confirmed COL1A2 exon-6 case developed valve regurgitation while systolic function and aortic-root dimensions remained normal. This differs genetically from recessive cardiac-valvular EDS due to biallelic COL1A2 null variants. A systematic review of nonvascular EDS included 17 selected aEDS patients and identified one perioperative hemorrhage, plus a separate report of postpartum bleeding; its surgical paragraph inconsistently gives a denominator of 18. These case-based data do not establish population risks or a vascular-EDS-like arterial phenotype. The review did not report arterial aneurysm or dissection in its aEDS subset. This is absence from selected literature, not proof that such an event is impossible. Routine preventive vascular drugs or intensive arterial screening cannot be inferred from the reviewed reports.
  evidence:
  - reference: PMID:23158907
    reference_title: 'Cardiac valve disease: an unreported feature in Ehlers Danlos syndrome arthrocalasia type?'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Left ventricular ejection fraction was within normal reference (65%).
    explanation: Normal systolic function in the valve case.
  - reference: PMID:28981071
    reference_title: 'Vascular phenotypes in nonvascular subtypes of the Ehlers-Danlos syndrome: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: in one patient with aEDS (1/18, 6%) who bled excessively at surgery (unspecified)
    explanation: Positive surgical-bleeding report; denominator conflicts with Table3 and is not used as a risk estimate.
  - reference: PMID:28981071
    reference_title: 'Vascular phenotypes in nonvascular subtypes of the Ehlers-Danlos syndrome: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: the data summarized here are derived mostly from either case reports (n = 51) or case series (n = 59), which are prone to publication and selection bias
    explanation: Explicit source ascertainment limit.
notes: No disease-specific GeneReviews or StatPearls chapter was identified by the repository baseline checks. The 2017 international classification and rare-types review, updated2024 diagnostic review and primary case reports provide the clinical baseline. Care is supportive and individualized; no controlled disease-modifying intervention or faithful aEDS whole-animal efficacy model was established in the reviewed evidence.
review_notes: Reviewed the entire original entry, its matching deep-research narrative/citation inventory, all nine cited available abstracts and actual full scientific bodies. Read the complete 2012 case-series and 2022 review bodies/tables; recovered 2017 classification and rare-types PDFs and read their general framework and complete aEDS sections rather than treating unrelated EDS chapters as aEDS evidence. New full 2019 fracture study and 2024/2025 spine cases were read completely, including the parent narrative and long-term limitations. The 2024 genetic diagnostic review was read for relevant collagen/neuromuscular differential and testing scope. The2026 recessive arthrochalasia-like report was read completely and independently audited; it is kept as an unresolved boundary rather than merged into the classic mechanism. The 2020 cohort remains abstract-only after unsuccessful publisher/repository recovery; unavailable 2008 correspondence and an image-heavy 2021 teaching deck are not used as positive evidence. Published-case totals overlap and differ by inclusion rules; no population frequency or prevalence band is inferred. The 2012 table has inconsistent totals for hips, fractures,
  criss-cross skin, fontanelles and some other signs; narrative findings and identified patient scope are preferred without reconstructing unsupported denominators. A micrognathia surgery quotation from the mutation-negative mother was removed from the affected-infant phenotype. The 2012 imported lethal-OI mosaic risk is not an aEDS recurrence estimate. The 2025 surgical abstract understates its 1000 cc bleeding and does not state that scoliosis remained 100 degrees. The entire 2012 valve case and 2018 nonvascular-EDS vascular review bodies/tables were also read; individual valvulopathy and bleeding were kept separate from arterial risk in vascular EDS. The neonatal skull-fracture abstract supports a perinatal fracture, not the neonatal death asserted by the 2022 review. Historical exon 46 nomenclature in the 1986 source was not reproduced as modern exon numbering. Generated caches were not hand-edited.

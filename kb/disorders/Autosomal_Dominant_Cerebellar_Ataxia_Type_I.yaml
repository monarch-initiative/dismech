name: Autosomal Dominant Cerebellar Ataxia Type I
creation_date: "2026-05-16T00:00:00Z"
category: Mendelian
synonyms:
- ADCA-I
- Type I autosomal dominant cerebellar ataxia
- Autosomal dominant cerebellar ataxia with extracerebellar signs
description: >-
  Autosomal dominant cerebellar ataxia type I (ADCA-I) is Harding's historical
  phenotype class for dominantly inherited progressive cerebellar ataxia with
  additional neurologic manifestations. Depending on the molecular subtype,
  these can include oculomotor, pyramidal, extrapyramidal, bulbar, spinal,
  peripheral-nerve, cognitive, psychiatric, or seizure features. ADCA-I is an
  umbrella rather than a single molecular disease: it includes coding
  polyglutamine expansions such as SCA1, SCA2, SCA3, and SCA17; other coding
  or noncoding repeat disorders; and disorders caused by conventional sequence
  variants or deletions. Consequently, repeat instability, anticipation,
  protein aggregation, and RNA toxicity apply to particular branches but are
  not universal properties of the class. Molecular testing is required to
  resolve the specific genotype. No disease-modifying therapy is established
  for ADCA-I as a class; management remains subtype-aware, symptomatic, and
  rehabilitative.

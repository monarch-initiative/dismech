discussions:
- discussion_id: adca_i_historical_classification_boundaries
  prompt: >-
    How should the historical Harding ADCA-I phenotype class be maintained as
    molecular diagnoses and repeat-detection technologies continue to redefine
    SCA subtype boundaries?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - definitions#Harding type I clinical definition
  - pathophysiology#Molecularly heterogeneous dominant lesions
  rationale: >-
    ADCA-I remains clinically useful for an ataxia-plus presentation, but it is
    not a molecularly uniform disease. The 2011 three-subclass scheme predates
    resolution of SCA4 as a coding polyglycine expansion and other newer repeat
    discoveries. Future curation should retain the clinical umbrella while
    preventing obsolete subtype lists or one-branch mechanisms from becoming
    universal assertions.
  evidence:
  - reference: PMID:21619691
    reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ADCA Type I. Further progress in molecular genetic studies will clarify
      future classifications
    explanation: The foundational review explicitly anticipated revision of the classification.
  - reference: PMID:38684900
    reference_title: A GGC-repeat expansion in ZFHX3 encoding polyglycine causes spinocerebellar ataxia type 4 and impairs autophagy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite linkage to chromosome 16q in 1996, the mutation causing
      spinocerebellar ataxia type 4 (SCA4), a late-onset sensory and cerebellar
      ataxia, remained unknown.
    explanation: Illustrates how later molecular resolution changes an older subtype model.
notes: >-
  ADCA-I is curated here as a historical clinical umbrella, not as a single
  repeat-expansion disorder. The genetic records are representative and
  intentionally non-exhaustive; molecular subtype entries remain the proper
  place for allele thresholds, penetrance, subtype-specific surveillance, and
  therapeutic detail. In particular, the existing standalone SCA17 entry should
  not be collapsed merely because SCA17 belongs to this phenotype class.

definitions:
- name: Harding type I clinical definition
  definition_type: CASE_DEFINITION
  description: >-
    A dominantly inherited cerebellar ataxia in which ataxia occurs with one
    or more additional neurologic signs. The class is defined clinically and
    spans multiple molecularly distinct spinocerebellar ataxias.
  evidence:
  - reference: PMID:21619691
    reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Type I autosomal dominant cerebellar ataxia (ADCA) is a type of
      spinocerebellar ataxia (SCA) characterized by ataxia with other
      neurological signs, including oculomotor disturbances, cognitive
      deficits, pyramidal and extrapyramidal dysfunction, bulbar, spinal and
      peripheral nervous system involvement.
    explanation: >-
      Defines ADCA-I by cerebellar ataxia accompanied by extracerebellar
      neurologic involvement rather than by one causal gene or lesion.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant transmission defines this class. The underlying variant
    may be a coding or noncoding repeat expansion, a missense or nonsense
    variant, or a deletion. Anticipation and repeat-length-dependent onset are
    therefore relevant to unstable-repeat subtypes, not to every ADCA-I family.
  evidence:
  - reference: PMID:21619691
    reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the autosomal dominant pattern of inheritance, genetic counseling
      is essential and best performed in specialized genetic clinics.
    explanation: >-
      Supports autosomal dominant inheritance as the organizing feature of
      the ADCA-I class.
  - reference: PMID:21619691
    reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      of anticipation that results from trinucleotide repeat
    explanation: >-
      Supports anticipation specifically in the repeat-expansion branch and
      avoids extending it to conventional-variant subtypes.
prevalence:
- population: Worldwide
  prevalence_class: UNKNOWN
  percentage: Unknown
  notes: >-
    The global prevalence of the historical ADCA-I class is not known.
    Frequencies vary substantially by founder effects and molecular subtype;
    the 2011 review identified SCA3 as the most common ADCA-I subtype, followed
    by SCA2, SCA1, and SCA8.
  evidence:
  - reference: PMID:21619691
    reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The global prevalence of this disease is not known. The most common type
      I ADCA is SCA3 followed by SCA2, SCA1, and SCA8, in descending order.
    explanation: >-
      Directly supports unknown class-level prevalence and the relative ordering
      reported for common ADCA-I subtypes.
has_subtypes:
- name: Coding repeat-expansion ADCA-I
  display_name: Coding repeat-expansion forms
  description: >-
    Includes the polyglutamine disorders SCA1, SCA2, SCA3, and SCA17 and
    DRPLA, as well as newly resolved coding-repeat mechanisms such as the
    ZFHX3 polyglycine expansion in SCA4. Protein species and pathogenic
    cascades differ within this branch.
  evidence:
  - reference: PMID:21619691
    reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      subclass 1 includes type I ADCA caused by CAG repeat expansions such as
      SCA1-SCA3, SCA17, and DRPLA
    explanation: Supports the historical coding CAG/polyglutamine subclass.
- name: Noncoding repeat-expansion ADCA-I
  display_name: Noncoding repeat-expansion forms
  description: >-
    Includes repeat expansions outside conventional protein-coding sequence,
    historically exemplified by SCA8, SCA10, and SCA12 and now also including
    additional noncoding-repeat ataxias such as SCA36. RNA gain-of-function,
    repeat-associated translation, or locus-specific effects can contribute.
  evidence:
  - reference: PMID:21619691
    reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      subclass 2 includes trinucleotide repeat expansions that fall outside of
      the protein-coding regions of the disease gene including SCA8, SCA10 and
      SCA12.
    explanation: Supports a distinct noncoding-repeat subclass.
- name: Conventional-variant ADCA-I
  display_name: Sequence-variant and copy-number forms
  description: >-
    Includes disorders caused by missense, nonsense, and deletion variants,
    historically including SCA13, SCA14, SCA15/16, SCA27, and SCA28. These
    forms can disrupt ion-channel, calcium-signaling, synaptic, or other
    Purkinje-cell functions without a repeat-instability mechanism.
  evidence:
  - reference: PMID:21619691
    reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Subclass 3 contains disorders caused by specific gene deletions, missense
      mutation, and nonsense mutation and includes SCA13, SCA14, SCA15/16,
      SCA27 and SCA28.
    explanation: Supports the repeat-independent conventional-variant subclass.
progression:
- phase: Onset
  age_range: Usually adulthood; childhood onset can occur
  notes: >-
    The onset range and initial extracerebellar manifestations vary by subtype.
    Earlier onset can accompany longer expansions in several unstable-repeat
    diseases, while conventional-variant forms have their own genotype-specific
    natural histories.
  evidence:
  - reference: PMID:21619691
    reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Onset is usually in adulthood but cases of presentation in childhood
      have been reported.
    explanation: Supports the broad onset interval of the parent phenotype class.
- phase: Progressive manifest disease
  age_range: Years to decades after onset
  notes: >-
    Gait, limb, speech, and oculomotor impairment generally worsen, while the
    rate and burden of non-ataxia signs remain subtype-dependent. EUROSCA
    quantified different annual progression rates across SCA1, SCA2, and SCA3.
  evidence:
  - reference: PMID:21832228
    reference_title: "The natural history of spinocerebellar ataxia type 1, 2, 3, and 6: a 2-year follow-up study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The annual increase of the SARA score was greatest in SCA1 (2.18 ±
      0.17, mean ± SE) followed by SCA3 (1.61 ± 0.12) and SCA2 (1.40 ± 0.11).
    explanation: >-
      Provides comparative longitudinal progression estimates for three major
      ADCA-I molecular subtypes rather than assuming one class-wide rate.
phenotypes:
- category: Neurologic
  name: Progressive Cerebellar Ataxia
  diagnostic: true
  description: >-
    Progressive gait and limb ataxia from cerebellar Purkinje-cell
    degeneration is the core, defining clinical feature shared by all
    ADCA-I subtypes. Subtype-level frequency and severity detail is
    deferred to the individual subtype entries (scaffold stage).
  phenotype_term:
    preferred_term: progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
  evidence:
  - reference: PMID:15895552
    reference_title: The wide spectrum of spinocerebellar ataxias (SCAs).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients exhibit usually a slowly progressive cerebellar syndrome with
      various combinations of oculomotor disorders, dysarthria, dysmetria/kinetic
      tremor, and/or ataxic gait.
    explanation: >-
      The SCA clinical spectrum review documents the progressive cerebellar
      syndrome with ataxic gait that defines the ADCA-I parent class.
- category: Neurologic
  name: Dysarthria
  description: >-
    Scanning/cerebellar dysarthria accompanies the ataxic syndrome across
    ADCA-I subtypes as part of the progressive cerebellar degeneration.
  phenotype_term:
    preferred_term: dysarthria
    term:
      id: HP:0001260
      label: Dysarthria
  evidence:
  - reference: PMID:15895552
    reference_title: The wide spectrum of spinocerebellar ataxias (SCAs).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients exhibit usually a slowly progressive cerebellar syndrome with
      various combinations of oculomotor disorders, dysarthria, dysmetria/kinetic
      tremor, and/or ataxic gait.
    explanation: >-
      Dysarthria is explicitly included among the clinical manifestations of the
      progressive cerebellar syndrome in SCAs that make up ADCA-I.
- category: Neurologic
  name: Abnormal pyramidal sign
  description: >-
    Pyramidal tract signs are extracerebellar features that distinguish ADCA-I
    from the predominantly pure-cerebellar ADCA-III class.
  phenotype_term:
    preferred_term: Abnormal pyramidal sign
    term:
      id: HP:0007256
      label: Abnormal pyramidal sign
  evidence:
  - reference: PMID:15895552
    reference_title: The wide spectrum of spinocerebellar ataxias (SCAs).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They can present also with pigmentary retinopathy, extrapyramidal movement
      disorders (parkinsonism, dyskinesias, dystonia, chorea), pyramidal signs,
      cortical symptoms (seizures, cognitive impairment/behavioral symptoms),
      peripheral neuropathy.
    explanation: >-
      The review lists pyramidal signs among extracerebellar manifestations in

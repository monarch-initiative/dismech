- name: Non-polyglutamine Repeat Toxicity
  description: >-
    This branch includes noncoding repeat expansions with RNA-mediated or
    repeat-associated mechanisms and coding repeats that yield non-polyglutamine
    proteins. SCA4 is now known to arise from a coding GGC expansion in ZFHX3;

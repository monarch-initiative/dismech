diagnosis:
- name: Clinical and family-history assessment
  presence: Positive
  description: >-
    Establish the progressive ataxia-plus phenotype, document a three-generation
    pedigree where possible, and characterize oculomotor, pyramidal,
    extrapyramidal, bulbar, cognitive, seizure, and peripheral-nerve findings.
    Phenotype can prioritize testing but cannot reliably determine the genotype.
  evidence:
  - reference: PMID:21619691
    reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis is based on clinical history, physical examination, genetic
      molecular testing, and exclusion of other diseases.
    explanation: Supports a combined clinical, pedigree, molecular, and exclusionary evaluation.
- name: Parallel repeat-expansion and sequence-variant testing
  presence: Positive
  description: >-
    Testing must cover variant classes that conventional exome-only analysis can
    miss. A practical workup combines targeted repeat-expansion assays with a
    sequence/CNV panel, exome, or genome approach and escalates to long-read
    methods when the phenotype remains unexplained.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:38760634
    reference_title: "An Update on the Adult-Onset Hereditary Cerebellar Ataxias: Novel Genetic Causes and New Diagnostic Approaches."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Testing methods include targeted evaluation of STR expansions (e.g. SCAs,
      Friedreich ataxia, fragile X-associated tremor/ataxia syndrome,
      dentatorubral-pallidoluysian atrophy), next generation sequencing for
      conventional variants, which may include targeted gene panels, whole
      exome, or whole genome sequencing, followed by various potential
      additional tests.
    explanation: Supports combined repeat-expansion and conventional-variant testing.
  - reference: PMID:38684900
    reference_title: A GGC-repeat expansion in ZFHX3 encoding polyglycine causes spinocerebellar ataxia type 4 and impairs autophagy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The coding GGC-repeat expansion in an extremely G+C-rich region was not
      detectable by short-read whole-exome sequencing, which demonstrates the
      power of LR-GS for variant discovery.
    explanation: Shows why a negative short-read exome cannot exclude all ADCA-I repeat lesions.
- name: Brain MRI for pattern assessment and exclusion
  presence: May show cerebellar with or without brainstem or cortical atrophy
  description: >-
    MRI supports neuroanatomic assessment and excludes structural mimics, but
    atrophy patterns alone generally do not establish a particular ADCA-I
    genotype.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:21619691
    reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      no pattern of atrophy on MRI is specific for a particular genotype of
      ADCA Type I
    explanation: Supports MRI as supportive/exclusionary rather than genotype-defining.
differential_diagnoses:
- name: Toxic, nutritional, endocrine, infectious, and post-infectious ataxias
  description: >-
    Potentially acquired and treatable causes must be assessed before a
    progressive ataxia is assigned to a hereditary ADCA-I subtype.
  distinguishing_features:
  - Exposure, nutritional, endocrine, or infectious context
  - Non-Mendelian course or reversibility with cause-directed treatment
  evidence:
  - reference: PMID:21619691
    reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Differential diagnosis is broad and includes secondary ataxias caused by
      drug or toxic effects, nutritional deficiencies, endocrinopathies,
      infections and post-infection states, structural abnormalities,
      paraneoplastic conditions and certain neurodegenerative disorders.
    explanation: Directly identifies these acquired differential categories.
- name: Structural, paraneoplastic, and other neurodegenerative ataxias
  description: >-
    Imaging, tempo, systemic context, and appropriate immune or cancer workup
    distinguish structural and paraneoplastic syndromes; multiple-system atrophy
    and other neurodegenerative disorders can mimic an ataxia-plus phenotype.
  distinguishing_features:
  - Structural lesion or cancer/autoimmune context
  - Sporadic course or autonomic and extrapyramidal pattern inconsistent with the pedigree
  evidence:
  - reference: PMID:21619691
    reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Differential diagnosis is broad and includes secondary ataxias caused by
      drug or toxic effects, nutritional deficiencies, endocrinopathies,
      infections and post-infection states, structural abnormalities,
      paraneoplastic conditions and certain neurodegenerative disorders.
    explanation: Directly supports structural, paraneoplastic, and neurodegenerative mimics.
treatments:
- name: Multidisciplinary supportive care
  description: >-
    Subtype-aware supportive management addresses gait and falls, speech and
    swallowing, mobility and activities of daily living, nutrition,
    extrapyramidal manifestations, seizures, mood, cognition, and family needs.
    No intervention is established as disease-modifying across the entire class.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
  - preferred_term: dysarthria
    term:
      id: HP:0001260
      label: Dysarthria
  evidence:
  - reference: PMID:21619691
    reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There are currently no known effective treatments to modify disease
      progression. Care is therefore supportive.
    explanation: Establishes supportive care as the class-level management foundation.
- name: Physical therapy and intensive neurorehabilitation
  description: >-
    Balance, coordination, strengthening, gait, fall-prevention, and adaptive
    exercise programs are individualized. A 24-week randomized SCA2 study
    improved motor cerebellar scores, supporting rehabilitation as palliative
    care without implying molecular disease modification.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
  evidence:
  - reference: PMID:30132999
    reference_title: "Neurorehabilitation therapy in spinocerebellar ataxia type 2: A 24-week, rater-blinded, randomized, controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A comprehensive 24-week rehabilitation program significantly improves
      the motor cerebellar symptoms of spinocerebellar ataxia type 2 patients
      as assessed by the ataxia rating score likely as result of the partial
      preservation of motor learning and neural plasticity mechanisms.
    explanation: Provides randomized subtype-specific support for intensive rehabilitation.
- name: Speech and communication therapy
  description: >-
    Speech-language therapy addresses cerebellar dysarthria and communication;
    swallowing assessment and compensatory strategies are added when bulbar
    involvement is present.
  treatment_term:
    preferred_term: speech therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_phenotypes:
  - preferred_term: dysarthria
    term:
      id: HP:0001260
      label: Dysarthria
  evidence:
  - reference: PMID:21619691
    reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Occupational and physical therapy for gait dysfunction and speech
      therapy for dysarthria is essential.
    explanation: Directly supports rehabilitation and speech therapy for core impairments.

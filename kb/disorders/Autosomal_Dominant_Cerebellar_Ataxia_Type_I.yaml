    term:
      id: UBERON:0002129
      label: cerebellar cortex
  downstream:
  - target: Purkinje Cell Degeneration and Cerebellar Cortical Atrophy
    causal_link_type: DIRECT
    description: >-
      Chronic proteostatic stress and aggregate burden drive progressive
      Purkinje cell dysfunction and loss.
    evidence:
    - reference: PMID:24462098
      reference_title: "Age-dependent decrease in chaperone activity impairs MANF expression, leading to Purkinje cell degeneration in inducible SCA17 mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        age-related decrease in chaperone function could cause the accumulation
        of mutant TBP and reduce its normal function on MANF transcription,
        contributing to the selective neurodegeneration in SCA17.
      explanation: Links chaperone/proteostasis failure to selective SCA17 neurodegeneration.
  - target: Extracerebellar Neurodegeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same misfolded-protein toxicity acts in parallel on brainstem,
      pyramidal-tract, and peripheral neuron populations, producing
      extracerebellar degeneration independently of (rather than secondary
      to) Purkinje-cell loss.
    evidence:
    - reference: PMID:31374463
      reference_title: Antisense oligonucleotide therapy rescues aggresome formation in a novel spinocerebellar ataxia type 3 human embryonic stem cell line.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        polyQ-expanded ATXN3 inflicts neuronal dysfunction and loss in discrete
        brain nuclei spanning the brainstem, cerebellum, spinal cord, substantia
        nigra, diencephalon, and striatum through a presumed dominant toxic
        gain-of-function mechanism
      explanation: Supports parallel extracerebellar vulnerability in SCA3 while leaving intermediates unresolved.
  evidence:

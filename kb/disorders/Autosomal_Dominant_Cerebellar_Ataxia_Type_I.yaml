      label: spinocerebellar ataxia type 4
  description: >-
    Spinocerebellar ataxia type 4 is a late-onset sensory and cerebellar ataxia
    caused by a heterozygous GGC-repeat expansion in ZFHX3 that encodes a
    polyglycine tract. The causal variant was unknown when the 2011
    ADCA-I review cited on this entry was written, and SCA4 therefore belongs to
    the coding repeat-expansion branch but is a polyglycine rather than a
    polyglutamine disease.
  genes:
  - preferred_term: ZFHX3
    term:
      id: hgnc:777
      label: ZFHX3
  evidence:
  - reference: PMID:38684900
    reference_title: "A GGC-repeat expansion in ZFHX3 encoding polyglycine causes spinocerebellar ataxia type 4 and impairs autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a heterozygous GGC-repeat expansion in a large Utah
      pedigree encoding polyglycine (polyG) in zinc finger homeobox protein 3
      (ZFHX3), also known as AT-binding transcription factor 1 (ATBF1).
    explanation: >-
      Establishes the heterozygous ZFHX3 GGC expansion as the SCA4 lesion.
  - reference: PMID:38684900
    reference_title: A GGC-repeat expansion in ZFHX3 encoding polyglycine causes spinocerebellar ataxia type 4 and impairs autophagy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Despite linkage to chromosome 16q in 1996, the mutation causing
      spinocerebellar ataxia type 4 (SCA4), a late-onset sensory and cerebellar
      ataxia, remained unknown.
    explanation: >-
      Sources the late-onset sensory and cerebellar phenotype stated in this row.

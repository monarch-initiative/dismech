    supporting_text: >-
      Finally, antisense oligonucleotide-mediated reduction of ATXN3 markedly
      suppressed aggresome formation.
    evidence:
    - reference: PMID:31374463
      reference_title: Antisense oligonucleotide therapy rescues aggresome formation in a novel spinocerebellar ataxia type 3 human embryonic stem cell line.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Finally, antisense oligonucleotide-mediated reduction of ATXN3 markedly
        suppressed aggresome formation.
      explanation: Demonstrates target-dependent rescue of a disease-relevant cellular phenotype.
  evidence:
  - reference: PMID:31374463
    reference_title: Antisense oligonucleotide therapy rescues aggresome formation in a novel spinocerebellar ataxia type 3 human embryonic stem cell line.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The SCA3-hESC line offers a unique and highly relevant human disease model

    reference_title: "Mice harbouring a SCA28 patient mutation in AFG3L2 develop late-onset ataxia associated with enhanced mitochondrial proteotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Spinocerebellar ataxia 28 is an autosomal dominant neurodegenerative
      disorder caused by missense mutations affecting the proteolytic domain
      of AFG3L2, a major component of the mitochondrial m-AAA protease.
    explanation: >-
      Establishes AFG3L2 proteolytic-domain missense variants as the SCA28
      lesion.
  - reference: PMID:31111429

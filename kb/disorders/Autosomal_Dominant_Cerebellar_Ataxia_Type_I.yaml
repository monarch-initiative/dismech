    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      While heterozygous mutations in the AFG3L2 gene have been linked to
      spinocerebellar ataxia 28 (SCA28), homozygous mutations in the same gene
      can cause spastic ataxia 5 (SPAX5).
    explanation: >-
      Sources the allele-dose split between SCA28 and SPAX5 stated here.


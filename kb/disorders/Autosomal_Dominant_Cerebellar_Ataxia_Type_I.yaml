- name: TGM6
  gene_term:
    preferred_term: TGM6
    term:
      id: hgnc:16255
      label: TGM6
  association: SCA35 TGM6 variants (gene-disease relationship disputed)
  presence: Positive
  subtype: SCA35
  notes: >-
    Two independent population-genetic studies argue against TGM6 causation of
    SCA35, and the ClinGen gene-disease validity download (read 2026-09-23)
    contains no TGM6 record at all. The gene is bound here because MONDO and
    OMIM record it, and the refuting evidence is carried alongside rather than
    the row being omitted.
  evidence:
  - reference: PMID:25253745
    reference_title: "Spinocerebellar ataxia 35: novel mutations in TGM6 with clinical and genetic characterization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      To elucidate the clinical and cellular characteristics of
      spinocerebellar ataxia type 35 (SCA35), which is caused by mutations in
      the TGM6 gene encoding transglutaminase 6 (TG6), in a Taiwanese cohort.
    explanation: >-
      States the original TGM6-SCA35 assignment that MONDO records.
  - reference: PMID:30670339
    reference_title: "A significant inflation in TGM6 genetic risk casts doubt in its causation in spinocerebellar ataxia type 35."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By performing inflation analysis, it demonstrated that the cumulative
      frequency of TGM6 reported pathogenic variants is at least 111-fold
      inflated over disease prevalence of all autosomal dominant SCAs,
      indicating a high chance of misdiagnosis or low penetrance.
    explanation: >-
      Argues that reported TGM6 pathogenic variants are far too common to
      explain SCA35.
  - reference: PMID:33588035
    reference_title: "TGM6 might not be a specific causative gene for spinocerebellar ataxia resulting from genetic analysis and functional study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two TGM6 detrimental variants were identified in one SCA patient, 14 in
      non-SCA patients and 43 in normal controls, the allele frequencies of
      TGM6 variants did not differ among the SCA and other controls.
    explanation: >-
      Case-control allele frequencies give no support for TGM6 as an SCA gene.


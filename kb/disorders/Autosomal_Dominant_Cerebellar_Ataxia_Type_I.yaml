animal_models:
- species: Mus musculus
  genotype: Tamoxifen-inducible TBP105Q SCA17 knock-in mouse
  description: >-
    Inducible expression of expanded TBP at different ages models a
    polyglutamine ADCA-I subtype and reveals age-dependent chaperone decline,
    MANF loss, and Purkinje-cell degeneration. It represents SCA17 rather than
    every molecular branch of ADCA-I.
  associated_phenotypes:
  - Progressive motor impairment
  - Purkinje cell degeneration
  - Age-dependent acceleration
  evidence:
  - reference: PMID:24462098
    reference_title: "Age-dependent decrease in chaperone activity impairs MANF expression, leading to Purkinje cell degeneration in inducible SCA17 mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using our SCA17 knockin (KI) mouse model, we induced mutant TBP expression
      in mice at different ages. We found that SCA17 disease phenotypes in older
      mice progress much faster, along with decreases in chaperone activity and
      Hsc70 level.
    explanation: Supports age-dependent disease acceleration in the inducible SCA17 model.
  - reference: PMID:24462098
    reference_title: "Age-dependent decrease in chaperone activity impairs MANF expression, leading to Purkinje cell degeneration in inducible SCA17 mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Overexpression of MANF by lentiviral vector infection and transgenic mouse
      approach ameliorates toxicity caused by mutant TBP in Purkinje cells in
      SCA17 mice.
    explanation: Provides mechanistic rescue evidence for the TBP-chaperone-MANF branch.

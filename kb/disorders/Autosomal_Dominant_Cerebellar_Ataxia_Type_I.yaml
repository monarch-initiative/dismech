pathophysiology:
- name: Molecularly heterogeneous dominant lesions
  description: >-
    ADCA-I is unified by a dominant ataxia-plus phenotype, not by one proximal
    lesion. Coding polyglutamine expansions, other coding or noncoding repeat
    expansions, and conventional sequence or copy-number variants initiate
    distinct molecular cascades that converge on cerebellar and variably
    extracerebellar neurodegeneration.
  downstream:
  - target: Polyglutamine Proteotoxicity
    causal_link_type: DIRECT
    description: >-
      CAG expansions in SCA1, SCA2, SCA3, SCA17, and DRPLA encode toxic
      expanded polyglutamine tracts.
    evidence:
    - reference: PMID:21619691
      reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        subclass 1 includes type I ADCA caused by CAG repeat expansions such as
        SCA1-SCA3, SCA17, and DRPLA
      explanation: Directly assigns the coding CAG disorders to the first mechanistic subclass.
  - target: Non-polyglutamine Repeat Toxicity
    causal_link_type: DIRECT
    description: >-
      Coding polyglycine and noncoding repeat expansions act through
      protein-, RNA-, and locus-specific toxic mechanisms.
    evidence:
    - reference: PMID:21619691
      reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        subclass 2 includes trinucleotide repeat expansions that fall outside
        of the protein-coding regions of the disease gene including SCA8, SCA10
        and SCA12.
      explanation: Directly assigns noncoding repeat disorders to a separate mechanistic subclass.
  - target: Conventional Variant Signaling and Synaptic Dysfunction
    causal_link_type: DIRECT
    description: >-
      Missense, nonsense, and deletion variants perturb ion-channel,
      calcium-signaling, synaptic, or other neuronal functions.
    evidence:
    - reference: PMID:21619691
      reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Subclass 3 contains disorders caused by specific gene deletions,
        missense mutation, and nonsense mutation and includes SCA13, SCA14,
        SCA15/16, SCA27 and SCA28.
      explanation: Directly assigns conventional sequence and deletion variants to the third subclass.
  evidence:
  - reference: PMID:21619691
    reference_title: "Autosomal dominant cerebellar ataxia type I: a review of the phenotypic and genotypic characteristics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Type I ADCA can be further divided based on the proposed pathogenetic
      mechanism into 3 subclasses: subclass 1 includes type I ADCA caused by
      CAG repeat expansions such as SCA1-SCA3, SCA17, and DRPLA, subclass 2
      includes trinucleotide repeat expansions that fall outside of the
      protein-coding regions of the disease gene including SCA8, SCA10 and
      SCA12. Subclass 3 contains disorders caused by specific gene deletions,
      missense mutation, and nonsense mutation and includes SCA13, SCA14,
      SCA15/16, SCA27 and SCA28.
    explanation: >-
      Establishes three mechanistically different branches within the
      historical ADCA-I phenotype class.
- name: Polyglutamine Proteotoxicity
  description: >-
    In SCA1, SCA2, SCA3, SCA17, and DRPLA, coding CAG expansions lengthen a
    polyglutamine tract. The expanded proteins alter native interactions,
    protein quality control, transcription, and calcium homeostasis. Repeat
    instability can also produce anticipation and repeat-length-dependent age
    at onset in these subtypes.

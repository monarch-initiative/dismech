inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic loss-of-function RNASET2 variants. Reported genotypes include
    homozygous nonsense alleles and a nonsense variant in trans with a 6q27
    microdeletion spanning the gene, so copy-number analysis belongs in the
    workup alongside sequencing.
  evidence:
  - reference: PMID:19525954
    reference_title: RNASET2-deficient cystic leukoencephalopathy resembles congenital cytomegalovirus brain infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show that loss-of-function mutations in the gene encoding the RNASET2 glycoprotein lead to cystic leukoencephalopathy, an autosomal recessive disorder with an indistinguishable clinical and neuroradiological phenotype.
    explanation: >-
      The gene-disease assignment and the inheritance mode, from the paper that
      established both.
  - reference: PMID:29336640
    reference_title: Novel RNASET2 Pathogenic Variants in an East Asian Child with Delayed Psychomotor Development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a novel nonsense variant c.128G>A (p. W43*) and a 430 Kb 6q27 microdeletion encompassing RNASET2.
    explanation: >-
      A compound genotype in which one allele is a deletion, which is why the
      description above asks for copy-number analysis.

genetic:
- name: RNASET2
  association: Causal biallelic variant
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: RNASET2
    term:
      id: hgnc:21686
      label: RNASET2
  notes: >-
    Single-copy gene on chromosome 6q27, encoding a 256 amino acid secreted and
    lysosomal glycoprotein. It is the only acidic ribonuclease in the human
    genome, which is why loss of it is not buffered.

    Two points for a diagnostic laboratory. Reported alleles include a 430 kb
    6q27 microdeletion spanning the gene, so sequencing alone can leave a case
    apparently heterozygous; copy-number analysis is needed. And the reported
    phenotype is not uniform even within the cystic-leukoencephalopathy label -
    one reported patient had neither the anterior temporal cysts nor the hearing
    loss usually described, so their absence does not exclude the gene.

    RNASET2 has also been associated by common-variant studies with inflammatory
    bowel disease, autoimmune thyroid disease, vitiligo and rheumatoid arthritis.
    Those are population associations at the locus and are not the Mendelian
    disease modelled here; this entry makes no claim that patients develop them.
  evidence:
  - reference: PMID:29336640
    reference_title: Novel RNASET2 Pathogenic Variants in an East Asian Child with Delayed Psychomotor Development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patient did not show anterior temporal lobe subcortical cysts, hearing loss, dystonia or extra-neurological features.
    explanation: >-
      A genetically confirmed patient lacking the features usually treated as
      characteristic, which is the basis for the caution above.
  - reference: PMID:27091087
    reference_title: "Clinical, radiological and possible pathological overlap of cystic leukoencephalopathy without megalencephaly and Aicardi-Goutières syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients were found to carry biallelic mutations of RNASET2.
    explanation: >-
      Five patients presenting as Aicardi-Goutieres syndrome who all turned out
      to carry biallelic RNASET2 variants, which is the strongest statement in
      the cited literature that this gene reaches the AGS-like end of the
      spectrum.
treatments:
- name: Supportive and antiepileptic care
  description: >-
    No disease-modifying treatment exists. Management is seizure control,
    spasticity management, and developmental and feeding support. The disease's
    own natural history sets the ceiling on what postnatal treatment could
    achieve: the active phase appears to be fetal and the clinical course
    afterwards is described as apparently non-progressive.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Epilepsy
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:32212285
    reference_title: The failure of microglia to digest developmental apoptotic cells contributes to the pathology of RNASET2-deficient leukoencephalopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There are no treatments available for this disease as our understanding of the cellular drivers of the pathology are still unknown.
    explanation: >-
      States the absence of treatment and ties it to the mechanistic gap. Graded
      OTHER rather than HUMAN_CLINICAL or MODEL_ORGANISM because it is a
      statement about the treatment landscape in a zebrafish paper's
      introduction, not a result of any study.
- name: Microglial replacement
  description: >-
    Not an available treatment. It is recorded because the preclinical result is
    unusually direct: transplanting macrophages into rnaset2 mutant zebrafish
    embryos produced cells that engrafted in the brain, expressed microglial
    markers, cleared apoptotic cells, reduced the antiviral response, and
    restored motor activity to wild-type levels. Hematopoietic stem cell
    transplantation is already established in several other leukodystrophies and
    is thought to act by replacing microglia, which is what makes this a
    plausible route rather than only a model finding. What is missing is any
    human data in this disease, and the fetal onset raises a real question about
    whether postnatal replacement could arrive in time.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Microglial Failure to Digest Apoptotic Cells
    description: >-
      Replacing the deficient microglial population with competent
      transplant-derived cells restores clearance at this node, which the
      zebrafish work then shows resolves the downstream interferon response.
  evidence:
  - reference: PMID:38753517
    reference_title: Macrophage transplantation rescues RNASET2-deficient leukodystrophy by replacing deficient microglia in a zebrafish model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Crucially, this reduction in neuroinflammation resulted in behavioral rescue-restoring rnaset2 mutant motor activity to wild-type (WT) levels in embryonic and juvenile stages.
    explanation: >-
      The functional rescue endpoint. Graded model-organism, and the treatment
      description says explicitly that no human data exist.
  - reference: PMID:38753517
    reference_title: Macrophage transplantation rescues RNASET2-deficient leukodystrophy by replacing deficient microglia in a zebrafish model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, hematopoietic stem cell (HSC) transplantation—which may act to replace microglia—is a clinically established therapy in several leukodystrophies
    explanation: >-
      The clinical precedent in other leukodystrophies that makes this a
      translatable route rather than only a zebrafish result.
- name: JAK inhibition
  description: >-
    Untried in this disease and recorded as a mechanistically rational
    candidate, not as practice. The entry models an IFNAR1-dependent type I
    interferon response, and JAK inhibitors act on exactly that axis: in the
    monogenic type I interferonopathies where they have been used, they improved
    clinical and laboratory parameters and reduced interferon-stimulated gene
    expression. No trial, case series or case report exists in RNASET2
    deficiency, and the fetal onset of this disorder raises the same
    window problem recorded for microglial replacement. It is listed for the
    same reason that candidate is: the pathograph already names the target.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Type I Interferon-Driven Neuroinflammation
    description: >-
      JAK inhibition acts downstream of the type I interferon receptor, so it
      targets this node rather than the upstream RNA-sensing step that produces
      the interferon.
  evidence:
  - reference: PMID:33856640
    reference_title: "Efficacy and Safety of Janus Kinase Inhibitors in Type I Interferon-Mediated Monogenic Autoinflammatory Disorders: A Scoping Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      JAK inhibitors improved clinical and analytical parameters and decreased flare numbers, plasma inflammatory markers, and expression of IFN-stimulated genes.
    explanation: >-
      Efficacy in other type I interferon-mediated monogenic disorders. Recorded
      as INDIRECT because none of the reviewed disorders is RNASET2 deficiency;
      the claim reaches this disease only through the shared interferon
      mechanism the entry models.
diagnosis:
- name: RNASET2 sequencing after negative CMV testing
  description: >-
    The diagnosis is made by not stopping at the obvious answer. An infant with
    anterior temporal cysts, multifocal white matter lesions and intracranial
    calcification will be worked up for congenital CMV; when serum and urine CMV
    PCR are negative and metabolic screening is normal, RNASET2 is the gene to
    sequence, with copy-number analysis alongside it because one reported allele
    is a 430 kb deletion. RMND1 is the other Mendelian mimic worth including on
    the same panel.
  evidence:
  - reference: PMID:31349848
    reference_title: "RNASET2-deficient leukoencephalopathy mimicking congenital CMV infection and Aicardi-Goutieres syndrome: a case report with a novel pathogenic variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Basic metabolic tests were normal and CMV PCR was negative.
    explanation: >-
      The negative results that redirect the workup from acquired infection to
      the genetic diagnosis.
  - reference: PMID:31349848
    reference_title: "RNASET2-deficient leukoencephalopathy mimicking congenital CMV infection and Aicardi-Goutieres syndrome: a case report with a novel pathogenic variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to clinical and imaging findings, screening of RNASET2 and RMND1 genes were performed.
    explanation: >-
      The two-gene panel this diagnostic advice recommends, as actually used in
      a reported case.
differential_diagnoses:
- name: Congenital cytomegalovirus brain infection
  disease_term:
    preferred_term: fetal cytomegalovirus syndrome
    term:
      id: MONDO:0017409
      label: fetal cytomegalovirus syndrome
  description: >-
    The acquired disease this disorder is indistinguishable from. Congenital CMV
    without symptoms at birth produces a static encephalopathy with the same
    brain abnormality patterns, and it is the diagnosis these children usually
    receive first.
  distinguishing_features:
  - Serum and urine CMV PCR are negative in RNASET2 deficiency.
  - Biallelic RNASET2 variants are present in the genetic disease.
  - There is no maternal infection history or neonatal CMV detection.
  evidence:
  - reference: PMID:19525954
    reference_title: RNASET2-deficient cystic leukoencephalopathy resembles congenital cytomegalovirus brain infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital cytomegalovirus brain infection without symptoms at birth can cause a static encephalopathy with characteristic patterns of brain abnormalities.
    explanation: >-
      Describes the acquired disorder whose pattern this genetic disease
      reproduces.
- name: Aicardi-Goutieres syndrome
  disease_term:
    preferred_term: Aicardi-Goutieres syndrome
    term:
      id: MONDO:0018866
      label: Aicardi-Goutieres syndrome
  description: >-
    The other Mendelian mimic of congenital infection, and the closer one
    mechanistically: both are type I interferonopathies driven by mishandled
    nucleic acid. Five patients presenting as AGS turned out to carry biallelic
    RNASET2 variants, so this is not a theoretical overlap.
  distinguishing_features:
  - AGS is caused by variants in nucleic acid metabolism and sensing genes rather than RNASET2.
  - The RNASET2 disorder has bilateral anterior temporal subcortical cysts with sparing of central white matter, which is not the AGS pattern.
  - The clinical course in RNASET2 deficiency is characteristically non-progressive after the neonatal period.
  evidence:
  - reference: PMID:27091087
    reference_title: "Clinical, radiological and possible pathological overlap of cystic leukoencephalopathy without megalencephaly and Aicardi-Goutières syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe the clinical, biochemical and radiological findings of five patients demonstrating a phenotype reminiscent of AGS.
    explanation: >-
      The cohort recruited as AGS-like, which the next quoted finding then
      reassigns to RNASET2.
animal_models:
- name: rnaset2 mutant zebrafish
  species: Zebrafish
  genotype: rnaset2 loss-of-function mutant
  publication: PMID:21199949
  description: >-
    The model that carries most of the mechanistic weight in this disease. Its
    optical transparency and ex utero development allow the embryonic phase - the
    phase that matters in the human disease and is inaccessible in a human fetus
    - to be watched directly.
  modeled_mechanisms:
  - target: Lysosomal Accumulation of Undegraded RNA
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Undigested rRNA accumulates within brain lysosomes, with white matter
      lesions on MR microimaging comparable to those in RNASET2-deficient
      infants.
    limitations: >-
      The lesion comparison is a resemblance on imaging rather than a
      histopathological match to human tissue, and zebrafish white matter is not
      organised as human white matter is.
    evidence:
    - reference: PMID:21199949
      reference_title: rnaset2 mutant zebrafish model familial cystic leukoencephalopathy and reveal a role for RNase T2 in degrading ribosomal RNA.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Further, by using high field intensity magnetic resonance microimaging, we reveal white matter lesions in these animals comparable to those observed in RNASET2-deficient infants.
      explanation: >-
        The imaging correspondence on which the model's fidelity for this node
        rests.
  - target: Microglial Failure to Digest Apoptotic Cells
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Microglia-specific depletion and rescue experiments identify microglia as
      the drivers of the embryonic phenotype, which is a causal test rather than
      an observation of correlation.
    limitations: >-
      The causal attribution is established in zebrafish only. No human tissue
      study has shown that microglia are the initiating cell type in patients,
      and the disease's fetal timing makes such a study difficult to obtain.
    readouts:
    - name: Larval motor activity
      target: Microglial Failure to Digest Apoptotic Cells
      direction: DECREASED
      interpretation: >-
        Reduced locomotor activity in mutants, restored to wild-type levels by
        macrophage transplantation, is the functional endpoint linking the
        microglial defect to whole-animal impairment.
      evidence:
      - reference: PMID:32212285
        reference_title: The failure of microglia to digest developmental apoptotic cells contributes to the pathology of RNASET2-deficient leukoencephalopathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Our zebrafish model also presented with reduced survival and locomotor defects, therefore recapitulating many aspects of the human disease.
        explanation: >-
          The behavioural readout and the authors' own claim about what it
          recapitulates.
    evidence:
    - reference: PMID:32212285
      reference_title: The failure of microglia to digest developmental apoptotic cells contributes to the pathology of RNASET2-deficient leukoencephalopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Using microglia-specific depletion and rescue experiments, we identified microglia as drivers of this embryonic phenotype and potential key cellular player in the pathology of RNAseT2-deficient leukoencephalopathy.
      explanation: >-
        The causal manipulation that makes this model informative for the node
        rather than merely consistent with it.
- name: Rnaset2 knockout mouse
  species: Mouse
  genotype: Rnaset2-/- (CRISPR/Cas9)
  publication: PMID:34764281
  description: >-
    Generated to supply the neuroinflammatory encephalopathy that earlier mouse
    work had failed to produce. It is the model that establishes the interferon
    dependence genetically.
  modeled_mechanisms:
  - target: Type I Interferon-Driven Neuroinflammation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Interferon-stimulated gene upregulation with IFNAR1-dependent
      neuroinflammation and T cell and monocyte infiltration of grey and white
      matter, matching the interferon signature found in patients.
    limitations: >-
      The mouse shows hippocampal-accentuated atrophy and cognitive impairment
      rather than the cystic anterior temporal lesions that define the human
      disease, so the regional distribution of damage differs even though the
      immunological mechanism matches.
    evidence:
    - reference: PMID:34764281
      reference_title: Interferon-driven brain phenotype in a mouse model of RNaseT2 deficient leukoencephalopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Single nuclei RNA sequencing reveals homeostatic dysfunctions in glial cells and neurons and provide important insights into the mechanisms of hippocampal-accentuated brain atrophy and cognitive impairment.
      explanation: >-
        The regional pattern the model actually produces, which is the basis for
        the limitation recorded above.
- name: RNaseT2 knockout rat
  species: Rat
  genotype: RNaseT2 knockout
  publication: PMID:29752287
  description: >-
    A rodent model with hippocampal neuroinflammation, altered lysosomal
    function and object-recognition memory deficits, but no cystic lesions.
  modeled_mechanisms:
  - target: Multifocal White Matter Lesions and Cystic Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      T1- and T2-weighted imaging showed no cystic lesions. The prefrontal
      cortex and hippocampal complex were enlarged rather than atrophic, which is
      the opposite direction from the human cerebral atrophy.
    limitations: >-
      The rat does not develop the defining lesion of the human disease, and the
      authors say directly that patients show a more severe neurodegenerative
      phenotype. It remains informative for lysosomal function and hippocampal
      neuroinflammation and should not be used to model the white matter
      pathology.
    evidence:
    - reference: PMID:29752287
      reference_title: RNaseT2 knockout rats exhibit hippocampal neuropathology and deficits in memory.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        While T1- and T2-weighted images of RNaseT2 knockout rats exhibited no evidence of cystic lesions, the prefrontal cortex and hippocampal complex were enlarged in knockout animals.
      explanation: >-
        The negative imaging result. Graded REFUTE because it contradicts the
        claim that this model reproduces the cystic white matter lesion.
    - reference: PMID:29752287
      reference_title: RNaseT2 knockout rats exhibit hippocampal neuropathology and deficits in memory.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Overall, patients with RNASET2 deficiency exhibited a more severe neurodegeneration phenotype than was observed in the RNaseT2 knockout rats.
      explanation: >-
        The authors' own assessment of the gap between their model and the human
        disease, which supports recording this link as a failure to recapitulate.
discussions:
- discussion_id: rnaset2_storage_versus_immune
  kind: INTERPRETATION
  prompt: >-
    Is this a lysosomal storage disorder or a microglial interferonopathy?
  attaches_to:
  - pathophysiology#Lysosomal Accumulation of Undegraded RNA
  - pathophysiology#Endolysosomal TLR Sensing of Accumulated Ribosomal RNA
  - pathophysiology#Microglial Failure to Digest Apoptotic Cells
  rationale: >-
    The question was live for a decade and the 2025 work has largely answered
    it: both, consecutively. The 2011 zebrafish study concluded the disease is a
    lysosomal storage disorder with rRNA as the storage material. The 2020 and
    2024 zebrafish work located the earliest abnormality in microglia, tested it
    causally by depletion and rescue, and showed microglial replacement rescues
    behaviour. The missing link was how stored RNA becomes inflammation, and
    TLR13 supplies it - the accumulated RNA is a ligand for an endolysosomal
    RNA-sensing receptor sitting in the same compartment, and deleting that
    receptor reverses the whole inflammatory phenotype.

    The entry models the chain as storage, then sensing, then interferon, then
    microglial pyroptosis, then tissue damage. What remains genuinely unresolved
    is the relative weight of the two microglial routes - failed phagocytic
    clearance of apoptotic cells, established in zebrafish, versus
    TLR-driven autoinflammation, established in mouse - and whether they are the
    same defect seen through two model systems. Both are drawn from the same
    upstream node for that reason.
- discussion_id: rnaset2_tlr13_has_no_human_counterpart
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    The receptor that drives the mouse phenotype does not exist in humans. Which
    sensor carries this mechanism in patients?
  attaches_to:
  - pathophysiology#Endolysosomal TLR Sensing of Accumulated Ribosomal RNA
  rationale: >-
    TLR13 is the receptor whose deletion reverses the Rnaset2-/- inflammatory
    phenotype, and the two 2025 studies that established it are both murine.
    Humans have no functional TLR13; TLR8 is its usual functional counterpart in
    the endolysosomal single-stranded-RNA-sensing role, and it is the inferred
    human sensor here. That inference is not a small step. It is a different
    receptor with a different ligand preference, expressed on a different set of
    human myeloid cells, and no patient study has shown that TLR8 carries this
    mechanism. Until it does, the interferon signature measurable in patients is
    the human evidence and the receptor identity is not.

    This matters therapeutically as well as descriptively: an inflammasome or
    TLR-directed intervention derived from the mouse would be aimed at a target
    the human disease may not use.
  proposed_experiments:
  - experiment_id: rnaset2_tlr8_dependence_in_patient_cells
    name: Test TLR8 dependence of the interferon response in RNASET2-deficient patient cells
    description: >-
      Derive macrophages or microglia-like cells from RNASET2-deficient patient
      induced pluripotent stem cells, and test whether TLR8 knockout or TLR8
      antagonism abolishes the interferon-stimulated gene response that these
      cells show relative to isogenic controls.
    readouts:
    - name: Interferon-stimulated gene expression
      target: pathophysiology#Type I Interferon-Driven Neuroinflammation
      direction: ABOLISHED
      interpretation: >-
        Loss of the ISG response on TLR8 disruption would establish TLR8 as the
        human counterpart of the murine TLR13 mechanism.
- discussion_id: rnaset2_fetal_window
  kind: KNOWLEDGE_GAP
  prompt: >-
    If the active phase of the disease is fetal, can any postnatal intervention
    including microglial replacement change the outcome?
  attaches_to:
  - treatments#Microglial replacement
  rationale: >-
    The zebrafish rescue was performed by transplanting into embryonic hosts,
    and the human disease is described as already established at birth in severe
    cases with an apparently non-progressive course afterwards. Those two facts
    together are the central translational problem: the preclinical success
    happened inside a window that human treatment cannot currently reach.
    Whether a postnatal interferon-directed or cell-replacement therapy could
    still prevent accrued damage, or whether the damage is complete before
    diagnosis is possible, is unresolved and determines whether this disease has
    a treatable phase at all.
  proposed_experiments:
  - experiment_id: rnaset2_postnatal_transplant_window
    name: Post-hatching macrophage transplantation in rnaset2 mutant zebrafish
    description: >-
      Repeat the macrophage transplantation at successively later developmental
      stages, after the embryonic window in which the published rescue was
      performed, and test whether motor rescue and suppression of the antiviral
      transcriptional response are still obtained.
    readouts:
    - name: Brain antiviral response transcript signature
      target: pathophysiology#Type I Interferon-Driven Neuroinflammation
      direction: DECREASED
      interpretation: >-
        Suppression of the antiviral signature after late transplantation would
        indicate the therapeutic window extends beyond the embryonic period.
notes: >-
  Where the human evidence stops and the model evidence starts. Almost
  everything mechanistic in this entry comes from zebrafish, mouse and rat. The
  human contribution is the gene assignment, the imaging and clinical phenotype,
  and the interferon findings in CSF and blood. Every mechanistic node carries
  MODEL_ORGANISM-graded evidence for that reason, and the two nodes with human
  corroboration (the interferon response and the lesion distribution) carry a
  human-graded item alongside. A reader should not take the microglial account as
  established in patients; it is established in zebrafish and consistent with
  what is measurable in patients.

  The rat model is recorded as FAILS_TO_RECAPITULATE against the white matter
  node, with a REFUTE-graded evidence item. That is deliberate rather than
  incidental: a negative model result is the kind of thing that otherwise
  survives only as prose, and the rat is still a useful model for lysosomal
  function and hippocampal neuroinflammation, so deleting it would lose more than
  it saved.

  A correction worth recording, because the reasoning that produced it is a
  trap. The molecular-function binding was first made to GO:0004523, RNA-DNA
  hybrid ribonuclease activity, on the stated grounds that GO had no RNase
  T2-family term. That was wrong on both counts: GO:0004523 is RNase H, which
  cleaves the RNA strand of an RNA:DNA hybrid and is a different enzyme class
  with a different substrate, and GO:0033897 ribonuclease T2 activity exists and
  is exact. The mistake came from searching the committed cache/go/terms.csv
  rather than the ontology; those CSVs are stale snapshots, and a term absent
  from them is not a term absent from GO. The binding is now GO:0033897.

  RNASET2 has a second identity that this entry does not model. Outside the
  lysosome it is a secreted, evolutionarily conserved extracellular RNase with
  described roles as an alarmin and as a tumour suppressor, and it carries
  common-variant associations with inflammatory bowel disease, autoimmune
  thyroid disease, vitiligo and rheumatoid arthritis. None of that is part of
  the Mendelian disease curated here, no patient has been reported to develop
  those conditions, and the entry makes no claim either way. It is scoped out
  explicitly so a reader meeting that literature is not left to infer a
  connection.

  Two identifiers the schema has no home for. OMIM #612951 and ORPHA:210141 both
  name this disease, and DiseaseMappings carries slots only for ICD-10-CM,
  ICD-11, MONDO and NCIT, so neither could be fielded. They are recorded here
  instead.

  No disease-specific GeneReviews chapter exists. PubMed was searched for
  "RNASET2 GeneReviews[All Fields]", which returned one result: the retired
  Leukodystrophy Overview chapter, not a chapter for this disease. The phenotype
  baseline is therefore the primary case series and the 2016 AGS-overlap cohort.

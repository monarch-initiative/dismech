  prevalence_class: ULTRA_RARE
  notes: >-
    No population estimate exists. Eight families had been reported by 2018 and
    the literature has grown by single cases and small series since. The count
    is likely an underestimate for a specific reason: the phenotype is
    indistinguishable from congenital CMV infection, so undiagnosed cases sit
    under that label.
  evidence:
  - reference: PMID:29336640
    reference_title: Novel RNASET2 Pathogenic Variants in an East Asian Child with Delayed Psychomotor Development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only eight families with RNASET2 mutation have been previously reported.
    explanation: >-
      The published family count, standing in for a prevalence estimate that has
      never been made.

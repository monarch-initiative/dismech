- name: Loss of Lysosomal Acidic Ribonuclease Activity
  biological_scale: MOLECULAR
  description: >-
    RNASET2 is the only known acidic ribonuclease in humans. It is optimally
    active at pH 4 to 5, which places its activity inside the lysosome, where it
    degrades RNA arriving by autophagy and endocytosis. There is no redundant
    human enzyme for that compartment, which is why complete loss has a
    phenotype at all.
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  molecular_functions:
  - preferred_term: lysosomal acidic ribonuclease activity
    modifier: DECREASED
    term:
      id: GO:0033897
      label: ribonuclease T2 activity
  downstream:
  - target: Lysosomal Accumulation of Undegraded RNA
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32295832
    reference_title: Zebrafish disease model of human RNASET2-deficient cystic leukoencephalopathy displays abnormalities in early microglia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      RNASET2 is a single copy gene encoding the RNASET2 protein, the only known acidic ribonuclease in humans.
    explanation: >-
      Establishes that there is no human paralogue for this activity, which the
      node's non-redundancy claim rests on. Graded by the publication, which is
      a zebrafish study, even though the biochemical fact quoted is general.
  - reference: PMID:29752287
    reference_title: RNaseT2 knockout rats exhibit hippocampal neuropathology and deficits in memory.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unlike other ribonuclease families, RNASET2 is optimally active in an acidic environment of pH4 to 5, which is consistent with its localization in lysosomes and vacuoles
    explanation: >-
      The pH optimum that localises the activity to the lysosome. Cited from a
      rodent-model paper's introduction, which is why it is graded as
      model-organism evidence even though the biochemistry is general.
- name: Lysosomal Accumulation of Undegraded RNA
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Undigested ribosomal RNA builds up inside lysosomes. This was demonstrated
    in rnaset2 mutant zebrafish and is the observation behind reading the
    disorder as a lysosomal storage disease with rRNA as the storage material.
    Whether the load itself is toxic, or matters mainly because it disables the
    lysosome for its other jobs, is the open question - and the microglial
    evidence points at the second.
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  biological_processes:
  - preferred_term: lysosomal ribosomal RNA degradation
    modifier: DECREASED
    term:
      id: GO:0016075
      label: rRNA catabolic process
  downstream:

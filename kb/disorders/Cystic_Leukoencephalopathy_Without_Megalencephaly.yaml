name: Cystic Leukoencephalopathy Without Megalencephaly
creation_date: "2026-09-09T14:10:00Z"
category: Mendelian
synonyms:
- RNASET2-deficient cystic leukoencephalopathy
- RNASET2-deficient leukodystrophy
- RNase T2-deficient leukoencephalopathy
- leukoencephalopathy, cystic, without megalencephaly
- CLWM
description: >-
  Cystic leukoencephalopathy without megalencephaly is an autosomal recessive
  infantile white matter disorder caused by biallelic RNASET2 variants. RNASET2
  is the only known acidic ribonuclease in humans; it sits in the lysosome and
  degrades RNA delivered there, ribosomal RNA in particular.

  Its defining clinical property is that it is not clinically distinguishable
  from something acquired. Anterior temporal subcortical cysts, multifocal lobar
  white matter lesions, cerebral atrophy and intracranial calcification, in an
  infant with psychomotor delay, spasticity and seizures, is the picture of in
  utero cytomegalovirus infection. A negative CMV PCR and a normal metabolic
  screen in a child with that MRI is the point at which RNASET2 should be
  sequenced. It also overlaps substantially with Aicardi-Goutieres syndrome,
  including CSF pleocytosis, raised CSF neopterin and an interferon signature in
  blood.

  Two accounts of the mechanism were offered separately and have now been joined
  up. Undegraded rRNA accumulates in lysosomes, which made the first case for
  reading this as a lysosomal storage disorder. The cell in which that matters
  is the microglion rather than the neuron: mutant microglia are engorged with
  undigested apoptotic cells during development, and replacing them rescues the
  phenotype in zebrafish. What connects the storage to the inflammation is an
  RNA-sensing Toll-like receptor sitting in the same endolysosomal compartment.
  In mice that receptor is TLR13, and deleting it reverses the whole inflammatory
  phenotype; a type I interferon response and early microglial pyroptosis follow,
  ahead of T cell infiltration and atrophy. Humans have no functional TLR13, so
  the human sensor is inferred rather than shown.

  The clinical course is characteristically non-progressive after the neonatal
  period. The active phase is fetal, which is why the disease sits with the
  congenital infections it mimics and why postnatal intervention has so far had
  nothing to modify.

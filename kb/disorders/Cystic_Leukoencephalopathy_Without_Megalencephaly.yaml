    causal_link_type: DIRECT
  - target: Endolysosomal TLR Sensing of Accumulated Ribosomal RNA
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39853306
      reference_title: RNase T2 restricts TLR13-mediated autoinflammation in vivo.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we report that the inflammatory phenotype found in Rnaset2-/- mice is completely reversed in the absence of TLR13, suggesting aberrant accumulation of an RNA ligand for this receptor.
      explanation: >-
        The genetic epistasis result that makes this edge causal rather than
        correlative: removing the receptor abolishes the phenotype, so the
        accumulated RNA is acting through it.
  evidence:
  - reference: PMID:21199949
    reference_title: rnaset2 mutant zebrafish model familial cystic leukoencephalopathy and reveal a role for RNase T2 in degrading ribosomal RNA.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Further, we demonstrate that loss of rnaset2 in mutant zebrafish results in accumulation of undigested rRNA within lysosomes within neurons of the brain.
    explanation: >-
      The primary demonstration of the accumulation, in the model that
      established it.
  - reference: PMID:21199949
    reference_title: rnaset2 mutant zebrafish model familial cystic leukoencephalopathy and reveal a role for RNase T2 in degrading ribosomal RNA.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus we conclude that familial cystic leukoencephalopathy is a lysosomal storage disorder in which rRNA is the best candidate for the noxious storage material.
    explanation: >-
      The lysosomal-storage reading, quoted with the authors' own "best
      candidate" so the hedge is preserved.
- name: Microglial Failure to Digest Apoptotic Cells
  biological_scale: CELLULAR
  description: >-
    During normal brain development microglia clear the excess neurons produced
    by developmental apoptosis. In rnaset2 mutants they cannot: mutant microglia
    are increased in number, abnormal in morphology, engorged, and filled with
    undigested apoptotic cells and undigested substrate, while neurons and
    oligodendrocyte precursors are unaffected at the same stage. That
    cell-type-restricted early abnormality is the reason microglia are read as
    the driver rather than as a reactive population.
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: microglial clearance of developmental apoptotic cells
    modifier: DECREASED
    term:
      id: GO:0043277
      label: apoptotic cell clearance
  downstream:
  - target: Type I Interferon-Driven Neuroinflammation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32212285
    reference_title: The failure of microglia to digest developmental apoptotic cells contributes to the pathology of RNASET2-deficient leukoencephalopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Live imaging and electron microscopy identified that mutant microglia displayed an engorged morphology and were filled with undigested apoptotic cells and undigested substrate.
    explanation: >-
      The direct observation of the failed clearance this node asserts.
  - reference: PMID:32295832
    reference_title: Zebrafish disease model of human RNASET2-deficient cystic leukoencephalopathy displays abnormalities in early microglia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast to wild-type brains, RNASET2-deficient larvae displayed increased numbers of microglia with altered morphology, often containing inclusions of neurons. Furthermore, lysosomes within distinct populations of the myeloid cell lineage including microglia showed increased lysosomal staining. Neurons and oligodendrocyte precursor cells remained unaffected.
    explanation: >-
      An independent group's confirmation, with the crucial control that neurons
      and OPCs are spared at this stage.
- name: Endolysosomal TLR Sensing of Accumulated Ribosomal RNA
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    RNA-sensing Toll-like receptors sit in the endolysosome, the same compartment
    RNASET2 works in, and their normal job is to detect non-self RNA. RNASET2
    processes long structured RNA into the short oligoribonucleotides those
    receptors read, and it also restricts recognition; without it, an RNA ligand
    accumulates and drives the receptor.

    In mice the receptor is TLR13, and the identification is genetic rather than
    inferential: the whole inflammatory phenotype of Rnaset2-/- mice is reversed
    when TLR13 is removed. The ligand is endogenous rather than microbial in the
    neuroinflammatory arm, because the phenotype persists in germ-free animals.
    This node is what connects the lysosomal storage account of the disease to
    the interferonopathy account - they are consecutive steps, not competing
    explanations.
  cellular_components:
  - preferred_term: endolysosome
    term:
      id: GO:0036019
      label: endolysosome
  biological_processes:
  - preferred_term: endolysosomal RNA-sensing toll-like receptor activation
    modifier: INCREASED
    term:
      id: GO:0002224
      label: toll-like receptor signaling pathway
  downstream:
  - target: Type I Interferon-Driven Neuroinflammation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39853306
    reference_title: RNase T2 restricts TLR13-mediated autoinflammation in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      RNA-sensing TLRs are strategically positioned in the endolysosome to detect incoming nonself RNA. RNase T2 plays a critical role in processing long, structured RNA into short oligoribonucleotides that engage TLR7 or TLR8.
    explanation: >-
      Establishes the compartment and the enzyme's normal relationship to these
      receptors, which is what makes its loss a sensing problem.
  - reference: PMID:39853306
    reference_title: RNase T2 restricts TLR13-mediated autoinflammation in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Interestingly, this TLR13-driven inflammatory phenotype is also fully present in germ-free mice, suggesting a role for RNase T2 in limiting erroneous TLR13 activation by an as yet unidentified endogenous ligand.
    explanation: >-
      The germ-free control that makes the ligand endogenous, which matters
      because the companion paper's liver phenotype runs on a microbiota-derived
      ligand instead.
  - reference: PMID:39853307
    reference_title: RNase T2 deficiency promotes TLR13-dependent replenishment of tissue-protective Kupffer cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we show that lysosomal RNA stress, caused by the lack of RNase T2, induces macrophage accumulation in multiple organs such as the spleen and liver through TLR13 activation by microbiota-derived ribosomal RNAs.
    explanation: >-
      A second group reaching the same receptor by a different route. Note the
      ligand source differs from the neuroinflammatory arm above, which is why
      both are quoted rather than merged.
- name: Microglial Pyroptosis
  biological_scale: CELLULAR
  description: >-
    Inflammasome-mediated lytic cell death in microglia, and it arrives early.
    In Rnaset2-/- mice the pyroptosis markers ASC, caspase-1 and gasdermin D
    rise at three to six weeks and fall thereafter, while apoptotic markers stay
    flat throughout - so this is pyroptosis specifically, not general cell death.
    ASC co-localises with the microglial marker IBA-1, and T cell and TNF markers
    peak much later, which orders pyroptosis upstream of the adaptive infiltrate
    rather than alongside it.
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: microglial pyroptosis
    modifier: INCREASED
    term:
      id: GO:0070269
      label: pyroptotic inflammatory response
  downstream:
  - target: Multifocal White Matter Lesions and Cystic Degeneration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41453865
    reference_title: "Unlocking microglia pyroptosis in a model of type I interferon-driven neuroinflammation: lessons from Rnaset2(-/-) mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pyroptosis-related markers (ASC, CASP1, GSDMD) were significantly increased already at three to 6 weeks of age and decreased thereafter, whereas apoptotic markers such as Bax, Bad, Bid, CASP3, CASP8, and PARP were not differentially expressed compared to controls.
    explanation: >-
      The timing and the apoptosis controls together, which is what makes this a
      pyroptosis claim rather than a cell-death claim.
  - reference: PMID:41453865
    reference_title: "Unlocking microglia pyroptosis in a model of type I interferon-driven neuroinflammation: lessons from Rnaset2(-/-) mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Taken together, these findings support the notion that pyroptosis is an early, disease-associated event restricted to microglia that likely contributes to establishing a proinflammatory milieu prior to T cell infiltration and brain atrophy.
    explanation: >-
      The authors' ordering of pyroptosis relative to the adaptive infiltrate,
      quoted with their own "likely contributes" hedge.
- name: Type I Interferon-Driven Neuroinflammation
  biological_scale: TISSUE
  description: >-
    An antiviral-pattern immune response follows in the brain: interferon-stimulated
    genes are upregulated, and in the mouse the resulting neuroinflammation is
    IFNAR1-dependent, with CD8+ effector memory T cells and inflammatory
    monocytes infiltrating grey and white matter. This is what places the disease
    among the type I interferonopathies and explains the biochemical overlap with
    Aicardi-Goutieres syndrome - raised CSF neopterin, CSF pleocytosis, a blood
    interferon signature.
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: type I interferon-mediated signaling in brain
    modifier: INCREASED
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
  downstream:
  - target: Microglial Pyroptosis
    causal_link_type: DIRECT
  - target: Multifocal White Matter Lesions and Cystic Degeneration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34764281
    reference_title: Interferon-driven brain phenotype in a mouse model of RNaseT2 deficient leukoencephalopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rnaset2-/- mice demonstrate upregulation of interferon-stimulated genes and concurrent IFNAR1-dependent neuroinflammation, with infiltration of CD8+ effector memory T cells and inflammatory monocytes into the grey and white matter.
    explanation: >-
      The interferon dependence, established genetically through IFNAR1, and the
      cellular infiltrate it drives.
  - reference: PMID:27091087
    reference_title: "Clinical, radiological and possible pathological overlap of cystic leukoencephalopathy without megalencephaly and Aicardi-Goutières syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe the clinical, biochemical and radiological findings of five patients demonstrating a phenotype reminiscent of AGS.
    explanation: >-
      Five patients recruited on an Aicardi-Goutieres phenotype who all proved
      to carry biallelic RNASET2 variants. This is the human corroboration for
      placing the disease among the type I interferonopathies, and it comes from
      a human cohort rather than from a mouse paper's background section.
- name: Multifocal White Matter Lesions and Cystic Degeneration
  biological_scale: TISSUE
  description: >-
    White matter lesions with neurodegeneration at their margins, accumulation
    of amyloid precursor protein and astrocytes at those sites, and anterior
    temporal subcortical cysts. Central white matter structures are
    characteristically spared, which is part of what makes the MRI pattern
    recognisable.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  downstream:
  - target: Leukoencephalopathy
    causal_link_type: DIRECT
  - target: Global developmental delay
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21199949
    reference_title: rnaset2 mutant zebrafish model familial cystic leukoencephalopathy and reveal a role for RNase T2 in degrading ribosomal RNA.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Further, by using high field intensity magnetic resonance microimaging, we reveal white matter lesions in these animals comparable to those observed in RNASET2-deficient infants. This correlates with accumulation of Amyloid precursor protein and astrocytes at sites of neurodegeneration.
    explanation: >-
      The lesion pathology and its cellular correlates, with the model's own
      comparison to the human imaging.
  - reference: PMID:27091087
    reference_title: "Clinical, radiological and possible pathological overlap of cystic leukoencephalopathy without megalencephaly and Aicardi-Goutières syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cystic leukoencephalopathy without megalencephaly is a disorder related in some cases to RNASET2 mutations and characterized by bilateral anterior temporal subcortical cysts and multifocal lobar white matter lesions with sparing of central white matter structures.
    explanation: >-
      The human lesion distribution, including the central sparing that makes
      the pattern distinctive.

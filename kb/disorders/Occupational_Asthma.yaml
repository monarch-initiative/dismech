prevalence:
- population: Adults
  measure_type: UNKNOWN
  notes: >-
    Reported as a population attributable fraction — 16% of incident adult
    asthma is attributable to occupational exposure, pooled across nine
    longitudinal studies — and not as a population rate, so `rate_per_100000`
    is deliberately left empty and `measure_type` is `UNKNOWN`. A PAF and a
    prevalence have different denominators and must not be conflated, and
    `PrevalenceMeasureEnum` has no attributable-fraction value to record this
    properly. `prevalence_class` is left empty for the same reason: the
    Orphanet-aligned bands are magnitudes against a population denominator, so
    assigning one to a fraction of incident cases would state a rate this
    record does not carry, and the qualitative tiers are defined by prevalence
    thresholds this record likewise does not have. An earlier version of this
    record carried a 5% figure from a general allergy review; the pooled
    longitudinal estimate cited here supersedes it.
  evidence:
  - reference: PMID:33141780
    reference_title: Novel approaches in occupational asthma diagnosis and management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Data from nine longitudinal studies showed a population attributable
      fraction for the occupational contribution to incident asthma of 16%
    explanation: >-
      Gives the pooled population attributable fraction this record carries,
      from longitudinal rather than cross-sectional data.
progression:
- phase: Latency before onset
  subtype: Sensitizer-induced
  notes: >-
    The sensitizer stratum has a symptom-free interval between first exposure
    and first symptoms, during which sensitization is established. Its length
    is not fixed and is not recorded here as a number, because the cited
    sources give it qualitatively. Its presence is what distinguishes this
    stratum from the irritant one, where onset follows exposure within minutes
    to hours.
  evidence:
  - reference: PMID:31690384
    reference_title: Occupational immunologic lung disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      RADS is defined as an asthma-like syndrome that persists for >3 months
      and occurs within minutes to hours after a single exposure to a high
      concentration of a respiratory irritant
    explanation: >-
      Supports this phase by contrast: it states the irritant stratum's
      immediate onset, which is the absence of the latency this phase
      describes.
- phase: Persistence after exposure ends
  notes: >-
    Removal from exposure does not end the disease in most workers. Airway
    hyperresponsiveness persists in around three quarters and symptomatic
    recovery occurs in under a third, and lung function continues to fall in a
    followed diisocyanate cohort even after cessation. This is the phase that
    makes the consequence node a persistent state rather than a response to
    current exposure.
  evidence:
  - reference: PMID:18394133
    reference_title: Inflammation and functional outcome in diisocyanate-induced asthma after cessation of exposure.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      forced expiratory volume in 1 s (FEV1) and forced vital capacity (FVC)
      values decreased, with a median yearly reduction of FEV1 of 79 ml
    explanation: >-
      Measures continuing loss of lung function after exposure has stopped,
      which is the functional content of this phase. Hyperresponsiveness
      improved in the same cohort, so the phase is not uniform decline across
      every measure.
  - reference: PMID:17040933
    reference_title: "Outcome of occupational asthma after cessation of exposure: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The pooled prevalence of persistent NSBHR at follow-up was 73% (95% CI
      66% to 79%)
    explanation: >-
      Quantifies persistence of the physiological hallmark across 39 studies,
      which is this phase's central claim.
genetic:
- name: Host susceptibility loci for diisocyanate asthma
  relationship_type: SUSCEPTIBILITY
  subtype: Isocyanate-induced
  notes: >-
    Susceptibility to diisocyanate asthma is modified by host genotype at
    several loci: HLA class II alleles and haplotypes, glutathione
    S-transferase and N-acetyltransferase genotypes governing conjugation of
    the reactive agent, and IL-4 receptor-alpha with CD14 polymorphisms. The
    detoxification genotypes are mechanistically coherent with the chemistry of
    the trigger node — a worker who conjugates the electrophile less
    efficiently presents more of it to airway protein. No gene is causative;
    these are modifiers of risk in exposed workers.

    No external body has classified any of these gene-disease pairs, so
    `gene_disease_validity` is deliberately absent rather than being assigned
    here. This record states the shared mechanism; the per-gene records below
    carry each locus with its own binding and its own measured association.
  evidence:
  - reference: PMID:21325943
    reference_title: Genetics of occupational asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Genotype combinations of IL-4 receptor-α and CD14 single nucleotide
      polymorphisms (SNPs) were significantly associated with diisocyanate
      asthma, but only in workers exposed to hexamethylene diisocyanate
    explanation: >-
      Reports a host genotype association specific to diisocyanate asthma, and
      specific to one agent within it, which is the susceptibility claim this
      record makes.
  - reference: PMID:21325943
    reference_title: Genetics of occupational asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      certain glutathione S-transferase genotypes (e.g. the GSTM1 null
      genotype) and N-acetyltransferase genotypes associated with slow
      acetylation phenotypes have been reported to be associated with
      diisocyanate asthma
    explanation: >-
      Supports the detoxification arm of this record: genotypes governing
      conjugation of the reactive agent modify risk, which connects host
      genetics to the haptenation trigger.
- name: HLA class II association with protein allergen sensitization
  relationship_type: SUSCEPTIBILITY
  subtype: HMW-protein

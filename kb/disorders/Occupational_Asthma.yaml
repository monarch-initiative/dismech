prevalence:
- population: Adults
  measure_type: UNKNOWN
  notes: >-
    Reported as a population attributable fraction — 16% of incident adult
    asthma is attributable to occupational exposure, pooled across nine
    longitudinal studies — and not as a population rate, so `rate_per_100000`
    is deliberately left empty and `measure_type` is `UNKNOWN`. A PAF and a
    prevalence have different denominators and must not be conflated, and
    `PrevalenceMeasureEnum` has no attributable-fraction value to record this
    properly. An earlier version of this record carried a 5% figure from a
    general allergy review; the pooled longitudinal estimate cited here
    supersedes it.
  evidence:
  - reference: PMID:33141780
    reference_title: Novel approaches in occupational asthma diagnosis and management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Data from nine longitudinal studies showed a population attributable
      fraction for the occupational contribution to incident asthma of 16%
    explanation: >-
      Gives the pooled population attributable fraction this record carries,
      from longitudinal rather than cross-sectional data.
genetic:
- name: Host susceptibility loci for diisocyanate asthma
  relationship_type: SUSCEPTIBILITY
  subtype: Isocyanate-induced
  notes: >-
    Susceptibility to diisocyanate asthma is modified by host genotype at
    several loci: HLA class II alleles and haplotypes, glutathione
    S-transferase and N-acetyltransferase genotypes governing conjugation of
    the reactive agent, and IL-4 receptor-alpha with CD14 polymorphisms. The
    detoxification genotypes are mechanistically coherent with the chemistry of
    the trigger node — a worker who conjugates the electrophile less
    efficiently presents more of it to airway protein. No gene is causative;
    these are modifiers of risk in exposed workers.

    No external body has classified any of these gene-disease pairs, so
    `gene_disease_validity` is deliberately absent rather than being assigned
    here. Specific genes are named in this description rather than bound as
    `gene_term` descriptors, because the cited review reports them as
    genotype associations in exposed cohorts and this entry does not curate
    per-gene records for them.
  evidence:
  - reference: PMID:21325943
    reference_title: Genetics of occupational asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Genotype combinations of IL-4 receptor-α and CD14 single nucleotide
      polymorphisms (SNPs) were significantly associated with diisocyanate
      asthma, but only in workers exposed to hexamethylene diisocyanate
    explanation: >-
      Reports a host genotype association specific to diisocyanate asthma, and
      specific to one agent within it, which is the susceptibility claim this
      record makes.
  - reference: PMID:21325943
    reference_title: Genetics of occupational asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      certain glutathione S-transferase genotypes (e.g. the GSTM1 null
      genotype) and N-acetyltransferase genotypes associated with slow
      acetylation phenotypes have been reported to be associated with
      diisocyanate asthma
    explanation: >-
      Supports the detoxification arm of this record: genotypes governing
      conjugation of the reactive agent modify risk, which connects host
      genetics to the haptenation trigger.
- name: HLA class II association with protein allergen sensitization
  relationship_type: SUSCEPTIBILITY
  subtype: HMW-protein
  notes: >-
    In the high molecular weight arm, HLA class II type modifies the risk of
    becoming sensitized at all. HLA-DR7 was associated with sensitization to
    rat urinary proteins among laboratory animal workers and more strongly with
    sensitization accompanied by symptoms, while HLA-DR3 was protective. This
    is consistent with class II molecules controlling presentation of the
    allergen to T cells.
  evidence:
  - reference: PMID:12704360
    reference_title: "HLA associations with occupational sensitization to rat lipocalin allergens: a model for other animal allergies?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      HLA-DR7 was associated with sensitization (odds ratio [OR], 1.82; CI,
      1.12-2.97), respiratory symptoms at work (OR, 2.96; CI, 1.64-5.37) and,
      most strongly, sensitization with symptoms (OR, 3.81; CI, 1.90-7.65)
    explanation: >-
      Measures the HLA class II association with occupational sensitization in
      a cross-sectional cohort of exposed workers, which is this record's
      claim.
environmental:
- name: Occupational exposure to chlorine
  description: >-
    Inhalation of chlorine gas, in water treatment, cleaning, pulp bleaching
    and after accidental release. A representative irritant exposure for the
    irritant-induced stratum: it injures the airway epithelium directly, with
    no latency and no agent-specific immune memory.
  exposure_term:
    preferred_term: exposure to chlorine
    term:
      id: ECTO:9000077
      label: exposure to chlorine
  influences_mechanisms:
  - target: Irritant Injury of the Airway Epithelial Barrier
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      High-concentration irritant inhalation injures the epithelium directly,
      which is the initiating event of this stratum.
  evidence:
  - reference: PMID:33063819
    reference_title: Updated review of reported cases of reactive airways dysfunction syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A variety of agents were implicated, with chlorine or chlorine-releasing
      molecules most frequently reported
    explanation: >-
      Establishes chlorine as the most frequently reported cause of reactive
      airways dysfunction syndrome across reported cases, which is why it is
      the representative exposure for this stratum.
- name: Occupational exposure to diisocyanates
  description: >-
    Inhalation of toluene, methylene diphenyl or hexamethylene diisocyanate in
    polyurethane manufacture, spray painting, foam production and related
    trades. The leading single cause of sensitizer-induced occupational asthma.
  exposure_term:
    preferred_term: exposure to isocyanates
    term:
      id: ECTO:9002153
      label: exposure to isocyanates
  influences_mechanisms:
  - target: Workplace Sensitizer Haptenation of Airway Proteins
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Workplace inhalation is the route by which the reactive chemical reaches
      airway proteins and haptenates them.
    evidence:
    - reference: PMID:21573916
      reference_title: Occupational asthma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Low molecular weight isocyanates are the most common compounds that
        cause occupational asthma
      explanation: >-
        Establishes this exposure as the leading cause of the disease, and so
        as a trigger of the haptenation step it is linked to.
  evidence:
  - reference: PMID:21573916
    reference_title: Occupational asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Low molecular weight isocyanates are the most common compounds that cause
      occupational asthma
    explanation: >-
      Supports recording diisocyanate exposure as the principal causative
      exposure for this disease.
diagnosis:
- name: Spirometry with serial peak flow monitoring
  description: >-
    Spirometry, with serial peak expiratory flow records kept at and away from
    work, is how the work-related pattern of airflow limitation is documented
    in practice. It establishes that airflow limitation varies with exposure;
    it does not identify the causative agent.
  diagnosis_term:
    preferred_term: Spirometry
    term:
      id: NCIT:C85397
      label: Spirometry
- name: Specific inhalation challenge
  description: >-
    Controlled exposure of the patient to the suspected workplace agent, with
    spirometry before and after. The only test that identifies the causative
    agent, and so the gold standard, but rarely performed — which is why most
    diagnoses rest on the clinical and temporal pattern instead.
  notes: >-
    No NCIT term is bound. Searched OLS (`ontology=ncit`) for
    `inhalation challenge`, which returns nothing; `provocation`, which returns
    only dosage-form classes for provocation-test preparations; and
    `challenge test`, which returns `NCIT:C99490 Proficiency Testing
    Challenge` and `NCIT:C78164 Histamine Challenge Test`. The last is a
    non-specific bronchial provocation test with histamine, a different
    procedure from challenge with the patient's own workplace agent, so
    binding it would assert the wrong test.
  evidence:
  - reference: PMID:21573916
    reference_title: Occupational asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The gold standard test, specific inhalation challenge, is rarely used.
    explanation: >-
      Supports that specific inhalation challenge is seldom used in practice.
  - reference: PMID:33652998
    reference_title: "Pulmonary Function Testing in Work-Related Asthma: An Overview from Spirometry to Specific Inhalation Challenge."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      specific inhalation challenge (SIC) is considered as the reference
      standard
    explanation: >-
      Establishes this procedure as the reference standard for confirming the
      causative agent, which is the claim this row makes.
treatments:
- name: Removal from exposure
  description: >-
    Ending exposure to the causative agent is the definitive intervention, and
    the earlier it happens the better the outcome. It is not reliably curative:
    a substantial proportion of workers have persistent asthma and persistent
    airway hyperresponsiveness years after leaving the exposure, which is why
    the consequence node is modelled as a persistent state.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Work-Related Airway Hyperresponsiveness and Variable Airflow Limitation
    treatment_effect: INHIBITS
    description: >-
      Removing the causative exposure withdraws the driver of the airway
      response, though it does not reverse established disease in every worker.
  evidence:
  - reference: PMID:21573916
    reference_title: Occupational asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Not all patients with occupational asthma will improve after removal from
      the workplace
    explanation: >-
      Supports that removal is not reliably curative. The two items below
      carry the controlled comparison and the quantified persistence.
  - reference: PMID:23407122
    reference_title: "Management of sensitizer-induced occupational asthma: avoidance or reduction of exposure?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      complete removal from exposure resulted in the best outcome in terms of
      symptoms, lung function, and airway hyper-responsiveness
    explanation: >-
      Supports removal as the most effective intervention on clinical
      outcomes, against reduction of exposure as the comparator.
  - reference: PMID:17040933
    reference_title: "Outcome of occupational asthma after cessation of exposure: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The pooled prevalence of persistent NSBHR at follow-up was 73%
    explanation: >-
      Quantifies how often airway hyperresponsiveness persists after exposure
      ends, which is why this treatment is described as definitive but not
      reliably curative.
- name: Anti-inflammatory asthma pharmacotherapy
  description: >-
    Management of the airway inflammation alongside removal from exposure,
    with inhaled corticosteroid and bronchodilator therapy as in asthma
    generally. It treats the established airway disease and does nothing about
    the sensitization or the exposure, so it is adjunctive to removal rather
    than an alternative to it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Work-Related Airway Hyperresponsiveness and Variable Airflow Limitation
    treatment_effect: INHIBITS
    description: >-
      Anti-inflammatory therapy reduces the airway inflammation that sustains
      hyperresponsiveness and airflow limitation.
  evidence:
  - reference: PMID:15579371
    reference_title: Occupational exposures as triggers of asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Early diagnosis, adequate management of inflammation, and prevention of
      further exposure are essential to occupational asthma management.
    explanation: >-
      Names management of inflammation as an essential component of treatment,
      alongside the prevention of further exposure that the other row covers.
  notes: >-
    No specific agent is bound in `therapeutic_agent`. The cited review states
    that inflammation must be managed but names no drug or class, and this
    entry does not assert a particular agent on its authority.
notes: >-
  Scope and the lump decision. This entry covers occupational asthma as the
  field defines it, both the sensitizer-induced and the irritant-induced
  stratum, because the name covers both and an entry named for the whole
  concept must model both. The two strata have genuinely different
  mechanisms — one immunological with latency, one not — so the pathophysiology
  nodes are scoped with `subtypes` and conform to different modules:
  the sensitizer chain to `chemical_respiratory_allergy`, the irritant node to
  `inhaled_irritant_airway_injury`. They converge at the shared consequence
  node. This entry is therefore the place in the KB where those two modules
  meet, which is the clinical reality: the same workplace chemical can irritate
  and sensitize.

  Work-aggravated asthma is excluded, and the entry is therefore narrower than
  the term it binds. MONDO:0022742 is defined, from MeSH, as "Asthma attacks
  caused, triggered, or exacerbated by OCCUPATIONAL EXPOSURE", so exacerbation
  of pre-existing asthma falls inside the bound concept. This entry
  deliberately covers only the caused forms, on the ground that exacerbation of
  existing disease is severity modification rather than a disease with an
  occupational cause, and its mechanism is the pre-existing asthma's. The
  field supports the distinction even though the bound term does not:
  PMID:26024347 defines work-exacerbated asthma as "asthma that is made worse,
  but was not initially caused, by workplace conditions", and places it beside
  occupational asthma under the wider umbrella of work-related asthma rather
  than inside occupational asthma. Note that PMID:21573916, cited elsewhere in
  this entry, groups the two together as "two forms of asthma causally related
  to the workplace" and applies "separate entity" to reactive airways
  dysfunction syndrome, which this entry *includes* — so that review is not
  the authority for this exclusion, and an earlier version of this note
  wrongly said it was.

  One recognised phenotype is not modelled at all: the occupational
  asthma–COPD overlap. PMID:33141780 lists it alongside the HMW, LMW and
  irritant-induced phenotypes, and it has neither a subtype row nor a
  pathophysiology node here. Adding it would need a decision about where
  fixed airflow obstruction sits relative to this entry and to COPD, which is
  not taken here.

  High molecular weight protein allergens are in scope as a cause but are not
  modelled mechanistically. Flour, enzymes, latex and animal proteins cause
  sensitizer-induced occupational asthma through conventional IgE-mediated
  sensitization with no haptenation step, so they do not conform to
  `chemical_respiratory_allergy`, whose trigger node requires a reactive
  chemical. Curating that arm needs its own nodes and is not done here. It has
  its own `has_subtypes` row (`HMW-protein`) carrying what this entry does
  say about it, and the haptenation chain is scoped to `LMW-chemical` rather
  than to the whole sensitizer stratum, so that nothing in the pathograph
  asserts haptenation for a flour or enzyme worker.

  The irritant stratum is declared and only thinly curated. It has one
  pathophysiology node, one exposure, and one piece of evidence — a smoke
  inhalation injury study whose agents are thermal stress and acrolein, graded
  INDIRECT because the step from an airway monolayer to asthma in a worker is
  an inference. There is no source here about irritant-induced asthma itself,
  no phenotype or treatment row scoped to the stratum, and the chlorine
  exposure carries a `review_notes` waiver rather than entry-level evidence.
  The sensitizer arm is much better served. Closing that asymmetry is the
  main outstanding work on this entry.

  No GeneReviews baseline applies. This is an acquired environmental disease,
  not a Mendelian one, so the GeneReviews step of the curation workflow does
  not apply; `just check-genereviews` is the verification.

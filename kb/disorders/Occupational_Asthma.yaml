    FeNO record.
  readouts:
  - target: Hapten-Specific T Cell Memory
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A rise across challenge reports the eosinophilia this node names
      directly. Discordance with FeNO in a substantial minority of positive
      challenges is why both are measured rather than either.
    evidence:
    - reference: PMID:39726396
      reference_title: Exhaled Nitric Oxide and Sputum Eosinophils Are Complementary Tools for Diagnosing Occupational Asthma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Combining either a rise in FeNO ≥ 13 ppb or an increase in sputum

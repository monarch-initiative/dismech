treatments:
- name: Removal from exposure
  description: >-
    Ending exposure to the causative agent is the definitive intervention, and
    the earlier it happens the better the outcome. It is not reliably curative:
    a substantial proportion of workers have persistent asthma and persistent
    airway hyperresponsiveness years after leaving the exposure, which is why
    the consequence node is modelled as a persistent state.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Work-Related Airway Hyperresponsiveness and Variable Airflow Limitation
    treatment_effect: INHIBITS
    description: >-
      Removing the causative exposure withdraws the driver of the airway
      response, though it does not reverse established disease in every worker.
  evidence:
  - reference: PMID:21573916
    reference_title: Occupational asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Not all patients with occupational asthma will improve after removal from
      the workplace
    explanation: >-
      Supports that removal is not reliably curative. The two items below
      carry the controlled comparison and the quantified persistence.
  - reference: PMID:23407122
    reference_title: "Management of sensitizer-induced occupational asthma: avoidance or reduction of exposure?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      complete removal from exposure resulted in the best outcome in terms of
      symptoms, lung function, and airway hyper-responsiveness. Reduction of
      exposure appeared to be less effective in terms of improving asthma but
      was also less likely to result in loss of income or unemployment
    explanation: >-
      Supports removal as the most effective intervention on clinical
      outcomes, against reduction of exposure as the comparator, and carries
      the trade-off in the same sentence: the clinically better option is the
      one more likely to cost the worker their job.
  - reference: PMID:17040933
    reference_title: "Outcome of occupational asthma after cessation of exposure: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The pooled prevalence of persistent NSBHR at follow-up was 73%
    explanation: >-
      Quantifies how often airway hyperresponsiveness persists after exposure
      ends, which is why this treatment is described as definitive but not
      reliably curative. Graded PRIMARY_RESULT because the pooled estimate is
      this review's own computation over 39 studies, not a figure it is
      restating.
  - reference: PMID:17040933
    reference_title: "Outcome of occupational asthma after cessation of exposure: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Reported rates of symptomatic recovery varied from 0% to 100%, with a
      pooled estimate of 32%
    explanation: >-
      Gives the complement of the persistence figure above: fewer than a third
      of workers recover symptomatically even after exposure ends, which is
      the measured basis for calling removal definitive but not curative.
- name: Workplace exposure elimination as primary prevention
  description: >-
    Removing or substituting the sensitizer in the workplace so that workers
    are never exposed. This is a different intervention from the removal row
    above, which withdraws an already-affected worker: this one prevents the
    disease arising at all, and the evidence for it is the strongest in the
    field. Powder-free low-protein natural rubber latex gloves are the worked
    case, where substitution was followed by a sharp fall in new
    sensitization.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  notes: >-
    No NCIT term for a workplace engineering or substitution control was
    found. Searched OLS (`ontology=ncit`) for `exposure elimination`, which
    returns nothing, and `substitution`, which returns chemical and genetic
    substitution classes rather than a clinical action, so the generic
    therapeutic procedure term is bound and the specificity is carried in
    `preferred_term` on this row's name and description. The row is a
    population-level intervention rather than a patient-level one, which the
    schema has no separate slot for.
  target_mechanisms:
  - target: Workplace Sensitizer Haptenation of Airway Proteins
    treatment_effect: INHIBITS
    description: >-
      Eliminating the agent from the workplace removes the reactive chemical
      that haptenates airway protein, so the chain never starts. This is why
      the intervention is preventive rather than therapeutic.
  evidence:
  - reference: PMID:22654083
    reference_title: "Primary prevention: exposure reduction, skin exposure and respiratory protection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Exposure elimination is the strongest and preferred primary preventive
      approach to reduce the burden of occupational asthma
    explanation: >-
      States the conclusion of a systematic review of 29 studies, and is the
      basis for recording this as a distinct intervention rather than folding
      it into removal from exposure.
  - reference: PMID:22654083
    reference_title: "Primary prevention: exposure reduction, skin exposure and respiratory protection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      There is strong evidence to recommend not using powdered allergen-rich
      natural rubber latex gloves
    explanation: >-
      Gives the one agent-specific recommendation the review grades as strong,
      which is the substitution the next item measures.
  - reference: PMID:21775898
    reference_title: Prevention of IgE Sensitization to Latex in Health Care Workers After Reduction of Antigen Exposures.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      After the intervention, new latex sensitization rates declined 16-fold,
      and 25% of previously sensitized employees reverted to negative skin
      tests
    explanation: >-
      Measures the effect of the substitution in a health care worker cohort,
      which turns the recommendation above into an interventional result. Note
      it measures sensitization, not asthma, so the step to disease prevention
      is an inference.
- name: Anti-inflammatory asthma pharmacotherapy
  description: >-
    Management of the airway inflammation alongside removal from exposure,
    with inhaled corticosteroid and bronchodilator therapy as in asthma
    generally. It treats the established airway disease and does nothing about
    the sensitization or the exposure, so it is adjunctive to removal rather
    than an alternative to it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Work-Related Airway Hyperresponsiveness and Variable Airflow Limitation
    treatment_effect: INHIBITS
    description: >-
      Anti-inflammatory therapy reduces the airway inflammation that sustains
      hyperresponsiveness and airflow limitation.
  evidence:
  - reference: PMID:15579371
    reference_title: Occupational exposures as triggers of asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Early diagnosis, adequate management of inflammation, and prevention of
      further exposure are essential to occupational asthma management.
    explanation: >-
      Names management of inflammation as an essential component of treatment,
      alongside the prevention of further exposure that the other row covers.
  notes: >-
    No specific agent is bound in `therapeutic_agent`. The cited review states
    that inflammation must be managed but names no drug or class, and this
    entry does not assert a particular agent on its authority.
notes: >-
  Scope and the lump decision. This entry covers occupational asthma as the
  field defines it, both the sensitizer-induced and the irritant-induced
  stratum, because the name covers both and an entry named for the whole
  concept must model both. The two strata have genuinely different
  mechanisms — one immunological with latency, one not — so the pathophysiology
  nodes are scoped with `subtypes` and conform to different modules:
  the sensitizer chain to `chemical_respiratory_allergy`, the irritant node to
  `inhaled_irritant_airway_injury`. They converge at the shared consequence
  node. This entry is therefore the place in the KB where those two modules
  meet, which is the clinical reality: the same workplace chemical can irritate
  and sensitize.

  Work-aggravated asthma is excluded, and the entry is therefore narrower than
  the term it binds. MONDO:0022742 is defined, from MeSH, as "Asthma attacks
  caused, triggered, or exacerbated by OCCUPATIONAL EXPOSURE", so exacerbation
  of pre-existing asthma falls inside the bound concept. This entry
  deliberately covers only the caused forms, on the ground that exacerbation of
  existing disease is severity modification rather than a disease with an
  occupational cause, and its mechanism is the pre-existing asthma's. The
  field supports the distinction even though the bound term does not:
  PMID:26024347 defines work-exacerbated asthma as "asthma that is made worse,
  but was not initially caused, by workplace conditions", and places it beside
  occupational asthma under the wider umbrella of work-related asthma rather
  than inside occupational asthma. Note that PMID:21573916, cited elsewhere in
  this entry, groups the two together as "two forms of asthma causally related
  to the workplace" and applies "separate entity" to reactive airways
  dysfunction syndrome, which this entry *includes* — so that review is not
  the authority for this exclusion, and an earlier version of this note
  wrongly said it was.

  One recognised phenotype is not modelled at all: the occupational
  asthma–COPD overlap. PMID:33141780 lists it alongside the HMW, LMW and
  irritant-induced phenotypes, and it has neither a subtype row nor a
  pathophysiology node here. Adding it would need a decision about where
  fixed airflow obstruction sits relative to this entry and to COPD, which is
  not taken here.

  High molecular weight protein allergens are in scope as a cause but are not
  modelled mechanistically. Flour, enzymes, latex and animal proteins cause
  sensitizer-induced occupational asthma through conventional IgE-mediated
  sensitization with no haptenation step, so they do not conform to
  `chemical_respiratory_allergy`, whose trigger node requires a reactive
  chemical. Curating that arm needs its own nodes and is not done here. It has
  its own `has_subtypes` row (`HMW-protein`) carrying what this entry does
  say about it, and the haptenation chain is scoped to `LMW-chemical` rather
  than to the whole sensitizer stratum, so that nothing in the pathograph
  asserts haptenation for a flour or enzyme worker.

  The irritant stratum is declared and curated more thinly than the sensitizer
  one. It has one pathophysiology node against the sensitizer arm's four, one
  exposure (chlorine) against that arm's diisocyanates, and no phenotype,
  treatment or biomarker row scoped to it — every phenotype and treatment row
  here is either stratum-neutral or carries the sensitizer arm's evidence, the
  two inflammatory biomarkers read out a sensitizer-arm node, and of the two
  progression phases only the latency one is stratum-scoped, to the sensitizer
  side. Every bound susceptibility locus is likewise a sensitizer-arm record;
  no host-genotype modifier of irritant-induced disease is recorded, which may
  be a real absence in the literature rather than a gap in this entry. The stratum itself
  is sourced: the `Irritant-induced` subtype row carries the reactive airways
  dysfunction syndrome definition from PMID:31690384 and the subtype claim from
  PMID:21573916, and the chlorine exposure carries PMID:33063819, the RADS case
  review that makes chlorine its most frequently reported cause. What the
  mechanism node lacks is a human source of its own: its evidence is a smoke
  inhalation injury study whose agents are thermal stress and acrolein, graded
  INDIRECT because the step from an airway monolayer to asthma in a worker is
  an inference. Closing that asymmetry — a stratum-scoped phenotype row, a
  human irritant-injury source on the node — is the main outstanding work on
  this entry.

  No GeneReviews baseline applies. This is an acquired environmental disease,
  not a Mendelian one, so the GeneReviews step of the curation workflow does
  not apply; `just check-genereviews` is the verification.

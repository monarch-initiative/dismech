diagnosis:
- name: Spirometry with serial peak flow monitoring
  description: >-
    Spirometry, with serial peak expiratory flow records kept at and away from
    work, is how the work-related pattern of airflow limitation is documented
    in practice. It establishes that airflow limitation varies with exposure;
    it does not identify the causative agent.
  diagnosis_term:
    preferred_term: Spirometry
    term:
      id: NCIT:C85397
      label: Spirometry
- name: Specific inhalation challenge
  description: >-
    Controlled exposure of the patient to the suspected workplace agent, with
    spirometry before and after. The only test that identifies the causative
    agent, and so the gold standard, but rarely performed — which is why most
    diagnoses rest on the clinical and temporal pattern instead.
  notes: >-
    No NCIT term is bound. Searched OLS (`ontology=ncit`) for
    `inhalation challenge`, which returns nothing; `provocation`, which returns
    only dosage-form classes for provocation-test preparations; and
    `challenge test`, which returns `NCIT:C99490 Proficiency Testing
    Challenge` and `NCIT:C78164 Histamine Challenge Test`. The last is a
    non-specific bronchial provocation test with histamine, a different
    procedure from challenge with the patient's own workplace agent, so
    binding it would assert the wrong test.
  evidence:
  - reference: PMID:21573916
    reference_title: Occupational asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The gold standard test, specific inhalation challenge, is rarely used.
    explanation: >-
      Supports that specific inhalation challenge is seldom used in practice.
  - reference: PMID:33652998
    reference_title: "Pulmonary Function Testing in Work-Related Asthma: An Overview from Spirometry to Specific Inhalation Challenge."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      specific inhalation challenge (SIC) is considered as the reference
      standard
    explanation: >-
      Establishes this procedure as the reference standard for confirming the
      causative agent, which is the claim this row makes.
- name: Airway inflammation measurement during specific inhalation challenge
  description: >-
    Fractional exhaled nitric oxide and induced sputum eosinophil count,
    measured before and after a specific inhalation challenge. Neither
    identifies the agent; both raise the yield of the challenge, because a
    positive challenge can show a rise in one without the other.
  diagnosis_term:
    preferred_term: Nitric Oxide Measurement
    term:
      id: NCIT:C112360
      label: Nitric Oxide Measurement
  notes: >-
    The bound term covers only the nitric oxide half of this row; NCIT has no
    single term for the paired measurement, and the sputum eosinophil count is
    carried in the `biochemical` section instead. Thresholds are quoted rather
    than recorded as `reference_ranges`, because they are challenge-response
    cut-offs for a change from baseline, not clinical normal intervals for a
    single value.
  evidence:
  - reference: PMID:39726396
    reference_title: Exhaled Nitric Oxide and Sputum Eosinophils Are Complementary Tools for Diagnosing Occupational Asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Increases in FeNO level ≥ 13 ppb and sputum eosinophils ≥ 1.25% were
      identified as the optimal threshold values for differentiating positive
      from negative SICs
    explanation: >-
      Gives both cut-offs, derived in 321 workers undergoing challenge, which
      is what makes this a usable diagnostic adjunct rather than a descriptive
      measurement.
  - reference: PMID:39726396
    reference_title: Exhaled Nitric Oxide and Sputum Eosinophils Are Complementary Tools for Diagnosing Occupational Asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Combining either a rise in FeNO ≥ 13 ppb or an increase in sputum
      eosinophils ≥ 1.25% increased the sensitivity to 77%
    explanation: >-
      Supports the complementarity this row asserts: the two measurements
      together detect more positive challenges than either alone.
biochemical:

name: Occupational Asthma
creation_date: "2026-11-09T01:00:00Z"
category: Complex
disease_term:
  preferred_term: occupational asthma
  term:
    id: MONDO:0022742
    label: occupational asthma
synonyms:
- Asthma, Occupational
- Asthmas, Occupational
- Industrial asthma
- Occupational Asthmas
parents:
- Asthma
has_subtypes:
- name: Sensitizer-induced
  display_name: Sensitizer-induced occupational asthma
  description: >-
    Asthma caused by immunological sensitization to an agent encountered at
    work, after a latency period, and reproduced on re-exposure to that agent.
    The causative agents split into high molecular weight protein allergens
    (flour, enzymes, latex, animal proteins), which sensitize through
    conventional IgE-mediated routes, and low molecular weight chemicals
    (diisocyanates, acid anhydrides, persulfate salts, reactive dyes), which
    must first haptenate a carrier protein. Only the chemical arm conforms to
    the `chemical_respiratory_allergy` module, so the two arms are separate
    rows below rather than being collapsed into this one.
  children:
  - LMW-chemical
  - HMW-protein
- name: LMW-chemical
  display_name: Low molecular weight chemical sensitizer-induced
  description: >-
    Sensitization to a reactive low molecular weight chemical, which must
    haptenate a carrier protein before the immune system can recognize it.
    This is the arm the `chemical_respiratory_allergy` module models, and the
    haptenation chain in this entry is scoped to it.
  evidence:
  - reference: PMID:31690384
    reference_title: Occupational immunologic lung disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      OA can be triggered by high-molecular-weight (HMW) proteins that act as
      complete allergens or by low-molecular-weight (LMW) sensitizers that act
      as haptens
    explanation: >-
      States the hapten-versus-complete-allergen division this row and the
      HMW-protein row are built on, and so why only this arm needs a
      haptenation step.
  children:
  - Isocyanate-induced
- name: HMW-protein
  display_name: High molecular weight protein allergen-induced
  description: >-
    Sensitization to an inhaled protein allergen — flour, enzymes, latex, or
    laboratory animal proteins — which is immunogenic as supplied and needs no
    haptenation step. Conventional IgE-mediated sensitization, with specific
    IgE usually detectable, unlike the chemical arm. Its mechanism is not
    curated here and it does not conform to
    `chemical_respiratory_allergy`, whose trigger node requires a reactive
    chemical; see `notes`.
  evidence:
  - reference: PMID:12704360
    reference_title: "HLA associations with occupational sensitization to rat lipocalin allergens: a model for other animal allergies?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Laboratory animal allergy is a common occupational health problem
      affecting between 11% and 44% of exposed researchers.
    explanation: >-
      Establishes this arm as a real and common cause of occupational
      sensitization, distinct from the chemical sensitizers.
- name: Isocyanate-induced
  display_name: Isocyanate-induced occupational asthma
  description: >-
    The single largest cause of sensitizer-induced occupational asthma, from
    toluene, methylene diphenyl and hexamethylene diisocyanate used in
    polyurethane manufacture, spray painting and foam production. Specific IgE
    is detectable in only a minority of affected workers, so diagnosis rests on
    the work-related pattern and specific inhalation challenge rather than on
    serology.
  subtype_term:
    preferred_term: isocyanate induced asthma
    term:
      id: MONDO:0025556
      label: isocyanate induced asthma
- name: Irritant-induced
  display_name: Irritant-induced occupational asthma
  description: >-
    Asthma caused by a non-immunological irritant injury to the airway, with no
    latency and no agent-specific immune memory. Includes reactive airways
    dysfunction syndrome after a single high-dose exposure, and the
    lower-intensity repeated-exposure form. Conforms to the
    `inhaled_irritant_airway_injury` module rather than to
    `chemical_respiratory_allergy`. No MONDO term covers this stratum: OLS
    returns only `MONDO:0004979` asthma for `irritant induced asthma` and
    nothing at all for `reactive airways dysfunction syndrome`, and
    `MONDO:0022742` has no children, so the row carries no `subtype_term`.
  evidence:
  - reference: PMID:21573916
    reference_title: Occupational asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      reactive airways dysfunction syndrome is a separate entity and a subtype
      of occupational asthma
    explanation: >-
      Supports treating the irritant-induced form as a stratum of this disease
      rather than a separate one, and names reactive airways dysfunction
      syndrome as belonging to it.
  - reference: PMID:31690384
    reference_title: Occupational immunologic lung disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      RADS is defined as an asthma-like syndrome that persists for >3 months
      and occurs within minutes to hours after a single exposure to a high
      concentration of a respiratory irritant
    explanation: >-
      Gives the definition of reactive airways dysfunction syndrome, including
      the absence of latency that distinguishes this stratum from the
      sensitizer one.
pathophysiology:
- name: Workplace Sensitizer Haptenation of Airway Proteins
  description: >-
    A reactive low molecular weight chemical inhaled at the workplace binds
    nucleophilic residues on airway and serum proteins, generating the
    hapten-protein adduct that the immune system subsequently recognizes. This
    is the step that requires the agent to be chemically reactive, and it is
    why the low molecular weight agents behave differently from the protein
    allergens that sensitize directly.
  role: trigger
  biological_scale: MOLECULAR
  subtypes:
  - LMW-chemical
  - Isocyanate-induced
  conforms_to: "chemical_respiratory_allergy#Covalent Protein Haptenation by a Low Molecular Weight Sensitizer"
  locations:
  - preferred_term: respiratory airway
    term:
      id: UBERON:0001005
      label: respiratory airway
  evidence:
  - reference: PMID:23743149
    reference_title: Characterization of methylene diphenyl diisocyanate-haptenated human serum albumin and hemoglobin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      demonstrating increases in both number and complexity of conjugates
      formed with increasing MDI concentrations
    explanation: >-
      Measures covalent adduct formation between the commonest causative agent
      class and human protein, which is the haptenation step this node asserts.
  downstream:
  - target: Airway Epithelial Danger Signal Release on Workplace Exposure
    description: >-
      The haptenated epithelium and the reactive chemistry that produced it
      elicit an innate epithelial response.
  - target: Dendritic Cell Activation and Th2 Polarization
    description: >-
      The hapten-protein adduct is the antigen airway dendritic cells take up,
      so haptenation also feeds the dendritic cell step directly.
- name: Airway Epithelial Danger Signal Release on Workplace Exposure
  description: >-
    The bronchial epithelium, lung fibroblasts and endothelium exposed to the
    sensitizer release IL-8, IL-6 and IL-1beta, generate reactive oxygen
    species, lose MUC1, and upregulate endothelial adhesion molecules. This
    innate response licenses dendritic cell maturation but is not by itself
    specific to a sensitizer, which is why an irritant exposure can produce a
    similar picture without sensitization following.
  role: amplifier
  biological_scale: CELLULAR
  subtypes:
  - LMW-chemical
  - Isocyanate-induced
  conforms_to: "chemical_respiratory_allergy#Airway Epithelial Danger Signal Release"
  cell_types:
  - preferred_term: bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  - preferred_term: lung fibroblast
    term:
      id: CL:0002553
      label: fibroblast of lung
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: cytokine production involved in inflammatory response
    term:
      id: GO:0002534
      label: cytokine production involved in inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:38360295
    reference_title: "Identification of toxicity-induced biomarkers in human non-immune airway cells exposed to respiratory sensitizers: A mechanistic approach."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      sensitizers promoted an increase in IL-8, IL-6, and IL-1β production in
      the evaluated cell types
    explanation: >-
      Measures the danger-signal cytokines of this node in the human airway
      cell types it binds, after exposure to respiratory sensitizers.
  downstream:
  - target: Dendritic Cell Activation and Th2 Polarization
    description: >-
      Epithelial danger signals supply the maturation context that makes
      antigen presentation sensitizing rather than tolerogenic.
- name: Dendritic Cell Activation and Th2 Polarization
  description: >-
    Airway dendritic cells take up the hapten-protein adduct, mature, and
    present it in a Th2-polarizing context. This is the step that distinguishes
    a workplace sensitizer from a workplace irritant, and therefore the step
    that separates this entry's two main subtypes: the irritant-induced
    stratum never reaches it.
  role: central_effector
  biological_scale: CELLULAR
  subtypes:
  - LMW-chemical
  - Isocyanate-induced
  conforms_to: "chemical_respiratory_allergy#Dendritic Cell Activation and Th2-Polarizing Antigen Presentation"
  cell_types:
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  biological_processes:
  - preferred_term: antigen processing and presentation
    term:
      id: GO:0019882
      label: antigen processing and presentation
    modifier: INCREASED
  evidence:
  - reference: PMID:28824649
    reference_title: Prediction of Chemical Respiratory and Contact Sensitizers by OX40L Expression in Dendritic Cells Using a Novel 3D Coculture System.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      OX40L expression in DCs was most consistently and significantly enhanced
      by respiratory sensitizers as compared to that by skin sensitizers
    explanation: >-
      Supports the Th2-polarizing character of this step, and that it
      discriminates respiratory sensitizers specifically.
  downstream:
  - target: Hapten-Specific T Cell Memory
    description: >-
      Presentation of the adduct by matured dendritic cells expands
      hapten-specific T cells and establishes memory.
- name: Hapten-Specific T Cell Memory
  description: >-
    Hapten-specific T cells expand and polarize toward a type 2 profile, with
    IL-4, IL-5 and IL-13 and airway eosinophilia. This establishes the
    immunological memory that gives sensitizer-induced occupational asthma its
    defining clinical features: a latency period before onset, and reproducible
    symptoms on re-exposure to that agent and not to others. Specific IgE may
    accompany it but frequently does not with low molecular weight agents.
  role: effector
  biological_scale: CELLULAR
  subtypes:
  - LMW-chemical
  - Isocyanate-induced
  conforms_to: "chemical_respiratory_allergy#Hapten-Specific T Cell Activation and Th2 Polarization"
  cell_types:
  - preferred_term: T-helper 2 cell
    term:
      id: CL:0000546
      label: T-helper 2 cell
  biological_processes:
  - preferred_term: T-helper 2 cell differentiation
    term:
      id: GO:0045064
      label: T-helper 2 cell differentiation
    modifier: INCREASED
  evidence:
  - reference: PMID:21573916
    reference_title: Occupational asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Workers with occupational asthma secondary to low molecular weight agents
      may not have elevated specific IgE levels
    explanation: >-
      Supports only the last sentence of this node, that specific IgE is
      frequently absent in this agent class. It does not evidence the T cell
      expansion or the type 2 polarization, which the two items below carry.
  - reference: PMID:16271432
    reference_title: TDI can induce respiratory allergy with Th2-dominated response in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      skin application followed by tracheal instillations of TDI led to local
      and systemic Th2-dominated immune responses
    explanation: >-
      Evidences the type 2 polarization this node asserts, for the agent class
      that causes most of this disease.
  - reference: PMID:12419703
    reference_title: "Cytokine fingerprinting of chemical allergens: species comparisons and statistical analyses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      TMA-activated LNC isolated from BALB/c mice or BN rats elaborated high
      levels of the Th2-type cytokines interleukin (IL)-10 and IL-13, but
      relatively little of the Th1-type cytokines IL-12 or interferon gamma
    explanation: >-
      Evidences the type 2 cytokine profile of this node against a contact
      allergen comparator, so the polarization is a measured contrast and not
      an assumption.
  downstream:
  - target: Work-Related Airway Hyperresponsiveness and Variable Airflow Limitation
    description: >-
      Re-exposure at work drives the established hapten-specific response into
      airway inflammation and bronchoconstriction.
- name: Irritant Injury of the Airway Epithelial Barrier
  description: >-
    In the irritant-induced stratum there is no haptenation and no
    agent-specific memory. A reactive inhaled irritant injures the epithelium
    directly, disrupting tight junctions and raising paracellular permeability,
    and the resulting inflammation produces asthma without a latency period.
    This is why irritant-induced occupational asthma begins within hours of a
    high-dose exposure rather than after months of low-level exposure.
  role: trigger
  biological_scale: CELLULAR
  subtypes:
  - Irritant-induced
  conforms_to: "inhaled_irritant_airway_injury#Airway Epithelial Junctional Barrier Failure"
  cell_types:
  - preferred_term: bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  biological_processes:
  - preferred_term: bicellular tight junction assembly
    term:
      id: GO:0070830
      label: bicellular tight junction assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:32588239
    reference_title: Ion transport mechanisms for smoke inhalation-injured airway epithelial barrier.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Thermal stress or acrolein disrupted zonula occludens-1 tight junctions,
      increased fluorescein isothiocyanate-dextran permeability but did not
      cause cell death or detachment
    explanation: >-
      Shows a reactive inhaled aldehyde producing junctional barrier failure
      without cell death, which is the non-immune injury route of this stratum.
      Graded INDIRECT because the study is of smoke inhalation injury in
      airway monolayers, so the inference to irritant-induced asthma in a
      worker is a step beyond what it measures.
  downstream:
  - target: Work-Related Airway Hyperresponsiveness and Variable Airflow Limitation
    description: >-
      Direct epithelial injury and the inflammation it provokes produce airway
      hyperresponsiveness without an immunological sensitization step.
- name: Work-Related Airway Hyperresponsiveness and Variable Airflow Limitation
  description: >-
    The convergence point of both strata and the clinical disease. Airway
    smooth muscle contraction, airway hyperresponsiveness and variable airflow
    limitation, with the temporal pattern that defines the diagnosis: symptoms
    worse at work and improving away from it. Removal from exposure does not
    reliably resolve it, so this node represents a persistent state rather than
    a transient response to exposure. Both strata converge here by different
    routes: the sensitizer arm through hapten-specific memory, the irritant arm
    through direct epithelial injury. The `conforms_to` link is true of the
    sensitizer route; the irritant module's own consequence is mucociliary
    clearance failure rather than asthma, so it is deliberately not named as a
    second target.
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "chemical_respiratory_allergy#Airway Hyperresponsiveness and Variable Airflow Limitation"
  biological_processes:
  - preferred_term: smooth muscle contraction
    term:
      id: GO:0006939
      label: smooth muscle contraction
    modifier: INCREASED
  locations:
  - preferred_term: bronchus
    term:
      id: UBERON:0002185
      label: bronchus
  evidence:
  - reference: PMID:21573916
    reference_title: Occupational asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Not all patients with occupational asthma will improve after removal from
      the workplace
    explanation: >-
      Supports treating this node as a persistent state: the disease does not
      reliably remit when the exposure stops.
  downstream:
  - target: Asthma symptoms with a work-related pattern
    description: >-
      Airflow limitation and hyperresponsiveness present clinically as
      work-related asthma symptoms.
  - target: Airway hyperresponsiveness
    description: >-
      This node is the state the methacholine or histamine challenge measures,
      so the measured phenotype is its direct expression.
  - target: Variable airflow limitation
    description: >-
      The variable component of the airflow limitation this node describes is
      what serial peak flow monitoring at and away from work records.
phenotypes:
- name: Asthma symptoms with a work-related pattern
  category: Clinical
  description: >-
    Wheeze, cough, chest tightness and breathlessness that worsen on working
    days and improve away from work. The temporal relationship to work, rather
    than any feature of the symptoms themselves, is what identifies the disease.
  phenotype_term:
    preferred_term: Asthma
    term:
      id: HP:0002099
      label: Asthma
  evidence:
  - reference: PMID:21573916
    reference_title: Occupational asthma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Work-aggravated asthma and occupational asthma are two forms of asthma
      causally related to the workplace
    explanation: >-
      Establishes that the disease is causally related to the workplace. Note
      it does not evidence the temporal pattern itself, which the item below
      carries.
  - reference: PMID:12704360
    reference_title: "HLA associations with occupational sensitization to rat lipocalin allergens: a model for other animal allergies?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      respiratory symptoms at work (OR, 2.96; CI, 1.64-5.37)
    explanation: >-
      Measures respiratory symptoms occurring at work in sensitized workers,
      which is the work-related symptom pattern this phenotype describes.
- name: Airway hyperresponsiveness
  category: Clinical
  description: >-
    Exaggerated bronchoconstrictor response to inhaled stimuli, demonstrable by
    methacholine or histamine challenge, and the physiological hallmark shared
    by both strata.
  phenotype_term:
    preferred_term: Airway hyperresponsiveness
    term:
      id: HP:0032933
      label: Airway hyperresponsiveness
  evidence:
  - reference: PMID:17040933
    reference_title: "Outcome of occupational asthma after cessation of exposure: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The pooled prevalence of persistent NSBHR at follow-up was 73% (95% CI
      66% to 79%)
    explanation: >-
      Quantifies how often this phenotype persists after exposure ceases,
      across 39 studies, which is why the entry treats hyperresponsiveness as
      a persistent state rather than a response to current exposure.

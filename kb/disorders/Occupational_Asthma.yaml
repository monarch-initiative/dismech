  biomarker_term:
    preferred_term: fractional exhaled nitric oxide (FeNO)
    term:
      id: NCIT:C695
      label: Nitric Oxide
  notes: >-
    Nitric oxide in exhaled breath, raised in type 2 airway inflammation. In
    this disease it is read as a change across a specific inhalation challenge
    rather than as an absolute level.

    The bound term is the analyte, not the measurement; NCIT has no term for
    the fractional exhaled fraction itself, and `NCIT:C112360 Nitric Oxide
    Measurement` is a procedure rather than a biomarker, so it is bound on the
    `diagnosis` row instead. No LOINC code is bound: this entry has not been
    through the LOINC cache-seeding step, and a label typed from memory is
    what that step exists to prevent.
  readouts:
  - target: Hapten-Specific T Cell Memory
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A rise across challenge reports the type 2 response this node
      describes. It does not identify the sensitizer, and it is specific but
      insensitive, so a flat FeNO does not exclude a positive challenge.
    evidence:
    - reference: PMID:39726396
      reference_title: Exhaled Nitric Oxide and Sputum Eosinophils Are Complementary Tools for Diagnosing Occupational Asthma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Increases in FeNO level ≥ 13 ppb and sputum eosinophils ≥ 1.25% were
        identified as the optimal threshold values for differentiating positive
        from negative SICs
      explanation: >-
        Establishes the measured link between a rise in this marker and a
        positive challenge, which is what this readout claims.

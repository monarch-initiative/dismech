  evidence:
  - reference: PMID:31914175
    reference_title: "Absence of GP130 cytokine receptor signaling causes extended Stüve-Wiedemann syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe three unrelated families with at least five affected individuals who presented with lethal Stüve-Wiedemann-like syndrome characterized by skeletal dysplasia and neonatal lung dysfunction with additional features such as congenital thrombocytopenia, eczematoid dermatitis, renal abnormalities, and defective acute-phase response."
    explanation: >-
      Establishes neonatal lung dysfunction as a defining feature of the
      delineating series.
  - reference: PMID:40835206
    reference_title: "A fetal case of Stüve-Wiedemann syndrome due to a novel homozygous truncating variant in IL6ST."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stüve-Wiedemann syndrome is a rare skeletal dysplasia characterized by severe shortening and bowing of the long bones and by immunological and autonomous dysfunction, usually resulting in early death."
    explanation: >-
      Places autonomic ("autonomous") dysfunction in the defining description of
      the syndrome, for which both genes are causative.
  downstream:
  - target: Neonatal Respiratory Distress
  - target: Abnormal Autonomic Nervous System Physiology
- name: Loss of IL-6 and IL-11 Dependent Hematopoietic, Epithelial and Hepatic Responses
  biological_scale: ORGANISM
  description: >-
    This node is what "extended" Stuve-Wiedemann syndrome means. IL-11 is
    required for megakaryocytopoiesis and IL-6 for the hepatic acute-phase
    response; both are intact in STWS1 and both are lost in STWS2. The resulting
    congenital thrombocytopenia, eczematoid dermatitis, renal abnormalities and
    absent acute-phase response are the features that distinguish the IL6ST
    disorder clinically from the LIFR one, and they are the mechanistic
    signature of losing the shared transducer rather than one ligand chain.
  biological_processes:
  - preferred_term: acute-phase response

synonyms:
- STWS2
- Stuve-Wiedemann Syndrome 2
- Stuve-Wiedemann syndrome, IL6ST-related
- extended Stuve-Wiedemann syndrome
- extended Stüve-Wiedemann syndrome
- Stüve-Wiedemann syndrome 2
- IL6ST-related Stuve-Wiedemann syndrome
- GP130 deficiency, complete
notes: >-
  NAMING: gene-anchored because "Stuve-Wiedemann syndrome" alone is locus-ambiguous.
  The OMIM/MONDO numbering (STWS2) is kept as a synonym and as the `disease_term`
  label; the entry name carries the gene. Same rule as its LIFR counterpart and as the
  two kyphomelic dysplasia entries in the same ISDS group.

  LUMP/SPLIT: this entry models only IL6ST-related Stuve-Wiedemann syndrome 2
  (MONDO:0030756; OMIM:619751) and is deliberately separate from
  kb/disorders/LIFR-Related_Stuve-Wiedemann_Syndrome.yaml (LIFR; MONDO:0800043;
  OMIM:601559). Three independent authorities split them and dismech follows:
  OMIM assigns distinct phenotype numbers, MONDO mints distinct classes under
  the parent grouping MONDO:0031280, and the ISDS 2023 nosology lists them as
  two rows in group 20 (NOS 20-0020 LIFR, NOS 20-0030 IL6ST). The mechanistic
  reason is that the two are not the same lesion at different severities: LIFR
  loss is ligand-chain-selective, whereas GP130 loss removes the shared
  transducer of ten IL-6-family cytokines, and the clinical difference —
  thrombocytopenia, dermatitis, renal anomalies, absent acute-phase response —
  tracks that difference. Folding them together would present a
  pan-IL-6-family signaling failure and a LIF-selective one as one pathograph.

  The split is NOT made on severity. Both disorders are usually lethal in the
  perinatal period, and the published IL6ST series is too small (six
  individuals) to support a claim that one is uniformly more severe.

  IL6ST is also the gene of autosomal recessive and autosomal dominant hyper-IgE
  syndrome and of an IL-11-selective craniosynostosis phenotype. Those are
  cytokine-selective partial defects and are separate diseases, not subtypes of
  this one; see differential_diagnoses. dismech does not curate them here.

  Orphanet has no structured record keyed to the IL6ST form specifically
  (ORPHA:3206 is Stuve-Wiedemann syndrome undifferentiated), so prevalence is
  recorded from the published case literature rather than an Orphanet
  epidemiology class.

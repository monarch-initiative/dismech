name: IL6ST-Related Stuve-Wiedemann Syndrome
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Stuve-Wiedemann syndrome 2 (STWS2), also called extended Stuve-Wiedemann
  syndrome, is an ultra-rare autosomal recessive bent-bone dysplasia caused by
  biallelic essential loss-of-function variants in IL6ST, which encodes GP130 —
  the shared signal transducer of the entire IL-6 cytokine family. Affected
  fetuses and neonates have severe shortening and bowing of the long bones, a
  narrow thorax, neonatal lung dysfunction and dysautonomia, and death is
  usually prenatal or perinatal.

  STWS2 is the phenocopy that makes the mechanism of Stuve-Wiedemann syndrome
  legible. STWS1 removes LIFR, the ligand-binding chain that pairs with GP130 to
  receive LIF; STWS2 removes GP130 itself, and so abolishes signaling by IL-6,
  IL-11, IL-27, oncostatin M and LIF together. The skeletal and autonomic core
  of the two disorders is nevertheless the same, which is the argument that LIF
  signaling specifically is what the developing skeleton and autonomic nervous
  system depend on: the extra cytokines lost in STWS2 add features rather than
  changing the ones LIFR loss already produces.

  Those extra features are what "extended" names — congenital thrombocytopenia,
  eczematoid dermatitis, renal abnormalities and a defective acute-phase
  response, none of which belong to LIFR-related STWS1. IL6ST is also a striking
  allelic series: the same gene yields recessive and dominant hyper-IgE syndrome
  when a variant spares LIF signaling, and isolated craniosynostosis when it
  spares everything except IL-11. STWS2 is the floor of that series, the class
  in which nothing is spared.

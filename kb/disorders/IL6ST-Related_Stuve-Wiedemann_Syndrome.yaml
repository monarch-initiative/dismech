- name: Autonomic and Respiratory Dysfunction
  biological_scale: TISSUE
  description: >-
    As in LIFR-related STWS1, loss of LIF-family signaling in autonomic and
    sensory neurons produces neonatal dysautonomia, and the neonate presents
    with lung dysfunction that, combined with the narrow thorax, is the usual
    proximate cause of perinatal death.
  biological_processes:

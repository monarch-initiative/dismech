  description: >-
    Dysautonomia of the Stuve-Wiedemann type — the autonomic instability shared
    with the LIFR form.
  phenotype_term:
    preferred_term: Abnormal autonomic nervous system physiology
    term:
      id: HP:0012332
      label: Abnormal autonomic nervous system physiology
  evidence:
  - reference: PMID:40835206
    reference_title: "A fetal case of Stüve-Wiedemann syndrome due to a novel homozygous truncating variant in IL6ST."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stüve-Wiedemann syndrome is a rare skeletal dysplasia characterized by severe shortening and bowing of the long bones and by immunological and autonomous dysfunction, usually resulting in early death."
    explanation: >-
      "Autonomous dysfunction" (dysautonomia) is given as a defining feature of
      the syndrome for which IL6ST is one of the two causative genes.

    evidence_source: HUMAN_CLINICAL
    snippet: "with additional features such as congenital thrombocytopenia, eczematoid dermatitis, renal abnormalities, and defective acute-phase response"
    explanation: >-
      Enumerates exactly the extra-skeletal features this node accounts for.
  - reference: PMID:31914175
    reference_title: "Absence of GP130 cytokine receptor signaling causes extended Stüve-Wiedemann syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Previous studies have identified cytokine-selective IL6ST defects that preserve LIF signaling."
    explanation: >-
      Frames the complete-loss genotype against the selective ones, which is why
      these additional features appear only here.

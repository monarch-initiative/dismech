classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Mendelian recessive skeletal dysplasia (ISDS bent-bone group). The
      immunologic features — defective acute-phase response, eczematoid
      dermatitis, congenital thrombocytopenia — are curated as mechanism and
      phenotype of the single IL6ST disorder rather than as an additional
      Harrison's Part, because they arise from the same loss of GP130 that
      produces the skeletal phenotype.
  isds_skeletal_category:
  - classification_value: bent_bone_dysplasia
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (11th edition;
      Unger et al., PMID:36779427), group 20 "Bent bones dysplasia group",
      entry NOS 20-0030, listed there as "Stuve-Wiedemann syndrome,
      IL6ST-related" (AR, IL6ST, MIM 619751). The IL6ST form is new in the 2023
      revision; it has no counterpart row in the 2019 revision
      (PMID:31633310), which predates the 2020 gene discovery. The committee
      listing it as its own row rather than as a note on the LIFR row is the
      nosological basis for curating it as a separate dismech entry.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Autosomal recessive. All reported individuals carry biallelic IL6ST
    loss-of-function alleles — homozygous in every published case — segregating
    in three unrelated families in the delineating series and in one further
    consanguineous pregnancy.
  evidence:
  - reference: PMID:31914175
    reference_title: "Absence of GP130 cytokine receptor signaling causes extended Stüve-Wiedemann syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified essential loss-of-function variants in IL6ST (a homozygous nonsense variant and a homozygous intronic splice variant with exon skipping)."
    explanation: >-
      Establishes biallelic (homozygous) IL6ST loss of function as the genetic
      basis across the delineating families.
  - reference: PMID:40835206
    reference_title: "A fetal case of Stüve-Wiedemann syndrome due to a novel homozygous truncating variant in IL6ST."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bi-allelic loss-of-function variants in either the leukemia inhibitory factor receptor encoding LIFR or the interleukin-6 cytokine family signal transducer encoding IL6ST are causative."
    explanation: >-
      Independent restatement of biallelic inheritance for the IL6ST form,
      alongside the LIFR form.

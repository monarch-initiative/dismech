pathophysiology:
- name: Biallelic IL6ST Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic essential loss-of-function IL6ST alleles — nonsense
    (c.841C>T, p.Arg281*), an intronic splice variant causing exon 13 skipping
    (c.1699+4A>G), and a further truncating allele (p.Ser375*) — abolish
    functional cell-surface GP130. The truncating alleles lie in the
    extracellular domains, so the predicted products are soluble rather than
    membrane-anchored receptor fragments; the exon-13 skipping allele instead
    misfolds the membrane-proximal D6 domain, which is where the receptor
    transmits signal across the membrane.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    allelic_hit_role: BIALLELIC_INACTIVATION
    zygosity: HOMOZYGOUS
    description: >-
      Homozygous germline null alleles of IL6ST (nonsense or essential splice).
      No compound-heterozygous STWS2 genotype has been reported; every published
      case arose in a consanguineous or homozygous-by-descent setting.
  genes:
  - preferred_term: IL6ST
    term:
      id: hgnc:6021
      label: IL6ST
  molecular_functions:
  - preferred_term: cytokine receptor activity
    term:
      id: GO:0004896
      label: cytokine receptor activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:31914175
    reference_title: "Absence of GP130 cytokine receptor signaling causes extended Stüve-Wiedemann syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified essential loss-of-function variants in IL6ST (a homozygous nonsense variant and a homozygous intronic splice variant with exon skipping)."
    explanation: >-
      Names the two allele classes in the delineating series and calls them
      essential (as opposed to cytokine-selective) loss of function.
  - reference: PMID:38133879
    reference_title: "The Human GP130 Cytokine Receptor and Its Expression-an Atlas and Functional Taxonomy of Genetic Variants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Loss of exon 13 in the c.1699+4A>G splice variant abrogates folding of GP130 membrane-proximal domain D6 impairing transmembrane signal transmission"
    explanation: >-
      Gives the structural reason the splice allele is a null rather than a
      hypomorph, which is what places it in the complete-loss class.
  - reference: PMID:38133879
    reference_title: "The Human GP130 Cytokine Receptor and Its Expression-an Atlas and Functional Taxonomy of Genetic Variants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These variants affect the extracellular domains of GP130 likely leading to the expression of truncated soluble GP130 variants"
    explanation: >-
      Establishes that the truncating STWS2 alleles remove the receptor from the
      membrane rather than producing a signaling-competent stump.
  downstream:
  - target: Pan-IL-6-Family GP130 Signaling Failure
- name: Pan-IL-6-Family GP130 Signaling Failure
  biological_scale: CELLULAR
  description: >-
    GP130 is the shared transducer of the whole IL-6 cytokine family, so its
    complete loss silences every member at once — IL-6, IL-11, IL-27, oncostatin
    M and LIF have all been shown unresponsive in patient cells. This is the
    node that separates STWS2 from STWS1: LIFR loss removes only the
    LIF-receiving chain, leaving IL-6, IL-11 and IL-27 signaling intact. It also
    separates STWS2 from the IL6ST hyper-IgE and craniosynostosis phenotypes,
    which are cytokine-selective defects that spare LIF. Lentiviral
    reconstitution of GP130 in patient cells restores signaling, which is the
    strongest available evidence that the failure is the direct consequence of
    the genotype.
  biological_processes:
  - preferred_term: interleukin-6-mediated signaling pathway
    term:
      id: GO:0070102
      label: interleukin-6-mediated signaling pathway
    modifier: LOSS_OF_FUNCTION
  - preferred_term: interleukin-11-mediated signaling pathway
    term:

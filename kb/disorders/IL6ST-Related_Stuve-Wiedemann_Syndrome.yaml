    modifier: LOSS_OF_FUNCTION
  - preferred_term: oncostatin-M-mediated signaling pathway
    term:
      id: GO:0038165
      label: oncostatin-M-mediated signaling pathway
    modifier: LOSS_OF_FUNCTION
  - preferred_term: leukemia inhibitory factor signaling pathway
    term:
      id: GO:0048861
      label: leukemia inhibitory factor signaling pathway
    modifier: LOSS_OF_FUNCTION
  - preferred_term: JAK-STAT cascade
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: DECREASED
  evidence:
  - reference: PMID:31914175
    reference_title: "Absence of GP130 cytokine receptor signaling causes extended Stüve-Wiedemann syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional tests showed absent cellular responses to GP130-dependent cytokines including IL-6, IL-11, IL-27, oncostatin M (OSM), and leukemia inhibitory factor (LIF)."
    explanation: >-
      Direct patient-cell readout that all five tested GP130-dependent cytokines
      fail, which is the defining property of this node.
  - reference: PMID:31914175
    reference_title: "Absence of GP130 cytokine receptor signaling causes extended Stüve-Wiedemann syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Genetic reconstitution of GP130 by lentiviral transduction in patient-derived cells reversed the signaling defect."
    explanation: >-
      Rescue experiment establishing that the signaling failure is caused by the
      IL6ST genotype rather than by a co-segregating factor.
  - reference: PMID:31914175
    reference_title: "Absence of GP130 cytokine receptor signaling causes extended Stüve-Wiedemann syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The gene IL6ST encodes GP130, the common signal transducer of the IL-6 cytokine family consisting of 10 cytokines."
    explanation: >-
      States why one receptor loss silences a whole cytokine family, which is
      the premise of this node.
  - reference: PMID:33771552
    reference_title: "Functional and structural analysis of cytokine-selective IL6ST defects that cause recessive hyper-IgE syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Deletion of this membrane-proximal interaction site in GP130 consequently caused additional defective LIF signaling and Stüve-Wiedemann syndrome."
    explanation: >-
      Structural work showing that losing LIF signaling on top of the IL-6/IL-11
      defect is what converts an IL6ST hyper-IgE genotype into a
      Stuve-Wiedemann one — the boundary this node draws.
  downstream:
  - target: Failed LIF-Dependent Skeletal Development
  - target: Autonomic and Respiratory Dysfunction
  - target: Loss of IL-6 and IL-11 Dependent Hematopoietic, Epithelial and Hepatic Responses
- name: Failed LIF-Dependent Skeletal Development
  biological_scale: TISSUE
  description: >-
    Absent LIF-family signaling in the developing skeleton produces the bent-bone
    phenotype. That this arm is LIF-driven rather than IL-6- or IL-11-driven is
    inferred from the near-identity of the STWS2 and STWS1 skeletal phenotypes:
    LIFR loss removes only LIF-family input, and reproduces the same bowing,
    shortening and defective mineralization.

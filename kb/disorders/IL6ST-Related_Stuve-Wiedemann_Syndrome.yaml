genetic:
- name: IL6ST
  gene_term:
    preferred_term: IL6ST
    term:
      id: hgnc:6021
      label: IL6ST
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    IL6ST encodes GP130. Biallelic essential loss-of-function alleles cause
    STWS2. The published STWS2 alleles are c.841C>T (p.Arg281*), the essential
    splice variant c.1699+4A>G causing exon 13 skipping, and p.Ser375*. Note
    that a different substitution at the same codon as the nonsense allele,
    p.Arg281Gln, causes an IL-11-selective craniosynostosis phenotype rather
    than STWS2 — the residue is not what matters, the completeness of the loss
    is.
  evidence:
  - reference: PMID:31914175
    reference_title: "Absence of GP130 cytokine receptor signaling causes extended Stüve-Wiedemann syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified essential loss-of-function variants in IL6ST (a homozygous nonsense variant and a homozygous intronic splice variant with exon skipping)."
    explanation: >-
      Establishes IL6ST as the causal gene for this disorder.
  - reference: PMID:40835206
    reference_title: "A fetal case of Stüve-Wiedemann syndrome due to a novel homozygous truncating variant in IL6ST."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatal trio exome sequencing revealed the homozygous novel variant p.(Ser375∗) in IL6ST in the fetus."
    explanation: >-
      Adds an independent truncating allele in an independent family.
  - reference: PMID:38133879
    reference_title: "The Human GP130 Cytokine Receptor and Its Expression-an Atlas and Functional Taxonomy of Genetic Variants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A patient with craniosynostosis and dental anomalies but no immune dysregulation carried a homozygous missense variant p.R281Q"
    explanation: >-
      Documents the same-codon contrast: a missense at Arg281 gives an
      IL-11-selective phenotype, whereas the nonsense allele at that codon gives
      STWS2.
treatments:
- name: Neonatal Intensive and Supportive Care
  description: >-
    There is no disease-modifying therapy. Management is intensive neonatal and
    supportive care directed at the respiratory failure, the autonomic
    instability and the feeding difficulties.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38133879
    reference_title: "The Human GP130 Cytokine Receptor and Its Expression-an Atlas and Functional Taxonomy of Genetic Variants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The therapeutic implication for patients with pathogenic IL6ST variants depends on the underlying condition ranging from intensive neonatal and supportive care in patients with Stuve-Wiedemann syndrome"
    explanation: >-
      States intensive neonatal and supportive care as the management for the
      Stuve-Wiedemann end of the IL6ST spectrum.
- name: Genetic Counseling
  description: >-
    Autosomal recessive recurrence risk of 25% for the parents of an affected
    child. All reported cases have been homozygous, so carrier testing of both
    parents and prenatal or preimplantation testing are the relevant options.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:40835206
    reference_title: "A fetal case of Stüve-Wiedemann syndrome due to a novel homozygous truncating variant in IL6ST."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatal trio exome sequencing revealed the homozygous novel variant p.(Ser375∗) in IL6ST in the fetus."
    explanation: >-
      Demonstrates that prenatal molecular diagnosis of this disorder is
      achievable, which is what genetic counseling is offering.
progression:
- phase: Prenatal onset
  age_range: Second trimester onward
  notes: >-
    Short and bowed long bones are detectable on ultrasound from the second
    trimester, and prenatal exome sequencing has established the diagnosis in
    utero. Intrauterine fetal death has been reported.
  evidence:
  - reference: PMID:40835206
    reference_title: "A fetal case of Stüve-Wiedemann syndrome due to a novel homozygous truncating variant in IL6ST."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We here report on a sixth case that came to attention at 21 weeks of gestation with short and bowed long bones."
    explanation: >-
      Documents prenatal detectability at 21 weeks of gestation.
  - reference: PMID:40835206
    reference_title: "A fetal case of Stüve-Wiedemann syndrome due to a novel homozygous truncating variant in IL6ST."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fetus died in utero in gestational week 34 and was born with dolichocephalus, severe bowing and shortening of limb bones, a narrow upper thorax, joint dislocations and abnormal bone mineralization."
    explanation: >-
      Records intrauterine fetal death as one outcome of this disorder.
- phase: Perinatal lethality
  age_range: Birth to early infancy
  notes: >-
    Death is usually prenatal or perinatal, driven by the neonatal lung
    dysfunction and dysautonomia. Survival beyond early childhood has been
    recorded but is exceptional. Curated here rather than as a `phenotypes`
    entry because the HPO death terms (HP:0003811 Neonatal death, HP:0001522
    Death in infancy) sit in the Mortality/Aging branch rather than under
    HP:0000118 phenotypic abnormality, so they are outside the PhenotypeTerm
    dynamic enum.
  evidence:
  - reference: PMID:38133879
    reference_title: "The Human GP130 Cytokine Receptor and Its Expression-an Atlas and Functional Taxonomy of Genetic Variants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Despite this prediction, complete loss of GP130 has been described in patients with pathognomonic features of Stüve-Wiedemann Syndrome, a lethal neonatal condition characterized by severe skeletal dysplasia and dysautonomia originally associated with loss-of-function mutations in LIFR"
    explanation: >-
      Characterizes the complete-GP130-loss phenotype as a lethal neonatal
      condition.
  - reference: PMID:38133879
    reference_title: "The Human GP130 Cytokine Receptor and Its Expression-an Atlas and Functional Taxonomy of Genetic Variants."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "In exceptional instances, patients can survive early childhood"
    explanation: >-
      Qualifies the lethality: survival occurs but is exceptional, so this is
      recorded as the usual rather than the invariable outcome.
differential_diagnoses:
- name: LIFR-Related Stuve-Wiedemann Syndrome
  disease_term:
    preferred_term: Stuve-Wiedemann syndrome 1
    term:
      id: MONDO:0800043
      label: Stüve-Wiedemann syndrome 1
  description: >-
    The other Stuve-Wiedemann gene, and clinically the closest mimic — the
    skeletal and autonomic phenotypes are largely indistinguishable. What
    separates them is the extra-skeletal panel: congenital thrombocytopenia,
    eczematoid dermatitis, renal anomalies and an absent acute-phase response
    point to IL6ST, because LIFR loss spares IL-6, IL-11 and IL-27. Molecular
    testing settles it.
  evidence:
  - reference: PMID:40835206
    reference_title: "A fetal case of Stüve-Wiedemann syndrome due to a novel homozygous truncating variant in IL6ST."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bi-allelic loss-of-function variants in either the leukemia inhibitory factor receptor encoding LIFR or the interleukin-6 cytokine family signal transducer encoding IL6ST are causative."
    explanation: >-
      Establishes that the same clinical syndrome has two causative genes, which
      is what makes this a differential rather than a separate presentation.
- name: IL6ST-related autosomal recessive hyper-IgE syndrome
  description: >-
    The same gene with a cytokine-selective rather than complete defect. These
    variants impair IL-6 and IL-11 signaling while sparing LIF, and the result
    is hyper-IgE syndrome with skeletal abnormalities and craniosynostosis, not
    a bent-bone dysplasia. The distinguishing question is whether LIF signaling
    survives.
  evidence:
  - reference: PMID:33771552
    reference_title: "Functional and structural analysis of cytokine-selective IL6ST defects that cause recessive hyper-IgE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic variants in IL6ST, encoding GP130, cause a recessive form of hyper-IgE syndrome (HIES) characterized by high IgE level, eosinophilia, defective acute phase response, susceptibility to bacterial infections, and skeletal abnormalities due to cytokine-selective loss of function in GP130, with defective IL-6 and IL-11 and variable oncostatin M (OSM) and IL-27 levels but sparing leukemia inhibitory factor (LIF) signaling."
    explanation: >-
      Defines the selective IL6ST phenotype and names LIF sparing as what makes
      it a different disease from STWS2.
- name: Campomelic dysplasia (SOX9)
  disease_term:
    preferred_term: campomelic dysplasia
    term:
      id: MONDO:0007251
      label: campomelic dysplasia
  description: >-
    The other perinatally lethal bent-bone dysplasia with a narrow thorax and
    respiratory failure, and the main non-Stuve-Wiedemann differential on a
    prenatal scan showing bowed femora. Campomelic dysplasia is dominant and de
    novo, adds Pierre-Robin sequence and 46,XY sex reversal, and lacks the
    dysautonomia and the hematologic and acute-phase findings.
  notes: >-
    Both disorders sit in ISDS 2023 group 20 (NOS 20-0030 and NOS 20-0010), so
    the shared radiographic sign this differential turns on is recorded in the
    two entries' isds_skeletal_category assignments. That placement comes from
    the nosology's disorder table, which is not part of the cached abstract or
    body text, so it carries no evidence snippet here.
discussions:
- discussion_id: stws2_lif_versus_pan_family_skeletal_attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Failed LIF-Dependent Skeletal Development
  prompt: >-
    Is the bent-bone phenotype of STWS2 driven by loss of LIF signaling alone,
    or do the concurrently lost IL-6, IL-11, IL-27 and OSM arms contribute to
    the skeletal phenotype in a way that the LIFR-null comparison cannot detect?
  rationale: >-
    The attribution of the skeletal arm to LIF rests entirely on a phenotype
    comparison: STWS1 loses only LIF-family input and looks the same. That is
    an argument from similarity across two tiny case series, and it cannot
    exclude a contribution from IL-11, which has an established role in bone.
    Distinguishing them matters because it decides whether a
    signaling-restoration strategy would need to restore GP130 or could target
    the LIF axis alone. No IL6ST-null animal model of the skeletal phenotype has
    been reported alongside a LIFR-null comparison in the same study.
  evidence:
  - reference: PMID:38133879
    reference_title: "The Human GP130 Cytokine Receptor and Its Expression-an Atlas and Functional Taxonomy of Genetic Variants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Similarities of patients with loss of LIFR signaling and patients that had complete absence of GP130 suggest that LIF is essential during embryonic development."
    explanation: >-
      The word "suggest" is the authors' own hedge, and marks this as an
      inference from phenotypic similarity rather than a demonstrated
      attribution.
- discussion_id: stws2_gp130_reconstitution_delivery_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  prompt: >-
    Is there any tractable therapeutic strategy for complete GP130 loss, given
    that hematopoietic-restricted correction cannot reach the skeletal and
    autonomic compartments?
  rationale: >-
    Lentiviral reconstitution of GP130 rescues signaling in patient-derived
    cells, so the defect is correctable in principle. But the disorder is
    prenatal and multi-organ, and allogeneic bone marrow transplantation — the
    approach borrowed from STAT3 hyper-IgE — corrects only the hematopoietic
    compartment. Whether any delivery route could reach chondrocytes and
    autonomic neurons early enough is unaddressed in the literature.
  evidence:
  - reference: PMID:38133879
    reference_title: "The Human GP130 Cytokine Receptor and Its Expression-an Atlas and Functional Taxonomy of Genetic Variants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "this will not be effective in treating the multi-organ manifestations of severe Stüve-Wiedemann syndrome."
    explanation: >-
      States that hematopoietic correction cannot address the multi-organ
      phenotype, which is the gap this discussion records.

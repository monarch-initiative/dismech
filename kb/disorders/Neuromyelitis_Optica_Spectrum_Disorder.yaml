    reference_title: "Eculizumab: A Review in Neuromyelitis Optica Spectrum Disorder."
    supports: SUPPORT
    snippet: >-
      The terminal complement protein (C5) inhibitor eculizumab (Soliris) is the
      first agent to be specifically approved in the EU, USA, Canada and Japan for
      the
      treatment of neuromyelitis optica spectrum disorder (NMOSD) in adults who are
      aquaporin-4 water channel autoantibody (AQP4-IgG) seropositive
    explanation: >-
      Review confirms eculizumab as first approved targeted therapy for NMOSD.
  - reference: PMID:33741809
    reference_title: "Recent advances in the treatment of neuromyelitis optica spectrum disorders."
    supports: SUPPORT
    snippet: "Eculizumab, inebilizumab, and satralizumab are effective maintenance therapies approved for the treatment of AQP-4 seropositive NMOSD."
    explanation: The abstract lists eculizumab as an approved maintenance therapy for NMOSD.
  target_mechanisms:
  - target: Complement Bystander Injury to Oligodendrocytes and Neurons
    treatment_effect: INHIBITS
    description: >-
      Eculizumab binds complement C5 and blocks cleavage to C5a and C5b,

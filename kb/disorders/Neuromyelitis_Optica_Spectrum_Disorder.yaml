datasets:
- accession: geo:GSE150598
  title: ATP mediates neuropathic pain of neuromyelitis optica spectrum disorder via microglial activation
  description: Intractable neuropathic pain is recognized as a common symptom of neuromyelitis optica spectrum disorder (NMOSD). However, the underlying mechanism of NMOSD pain remains to be elucidated. Here, we established NMOSD pain model by injecting anti-AQP4 recombinant autoantibodies (AQP4-Ab) generated from NMOSD patient’s plasmablasts into rat spinal cords and confirmed the development of mechanical allodynia. AQP4-Ab mediated extracellular ATP release from astrocytes and pharmacological inhibition of ATP receptor reversed mechanical allodynia in NMOSD pain model. Furthermore, transcriptome analysis revealed microglia activation and IL-1β elevation in NMOSD spinal cord.
  organism:

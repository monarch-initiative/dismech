- accession: geo:GSE291954
  title: 'Inflammatory transcriptomic signatures in a human cellular NMOSD model reveal upregulation of NF-κB and IL6 pathways '
  description: Neuromyelitis optica spectrum disorder (NMOSD) is a rare neurological autoimmune disease caused autoantibodies targeting the astrocytic water channel aquaporin-4 (AQP4). Binding to AQP4 initiates the activation of innate immune components, especially the complement system. Both in-vivo and in-vitro models have been developed to study the molecular pathophysiology of NMOSD. The aim of our study was to characterize the molecular response of four human cell lines (AQP4-ECFP expressing U-87MG glioblastoma cells, U-87MG expressing only ECFP, HEK293 cells expressing AQP4-EmGFP and human primary astrocytes) to a treatment with AQP4 antibody E5415A and human complement.

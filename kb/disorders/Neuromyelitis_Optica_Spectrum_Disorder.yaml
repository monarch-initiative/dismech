- accession: geo:GSE242232
  title: Autoantigen-specific CD4+ T cells acquire an exhausted phenotype and persist in human antigen-specific autoimmune diseases
  description: Pro-inflammatory autoantigen-specific CD4+ T helper (auto-Th) cells are central orchestrators of autoimmune diseases (AIDs). We aimed to characterize these cells in human AIDs with defined autoantigens by combining human leukocyte antigen (HLA)-tetramer-based and activation-based multidimensional ex vivo analyses. In aquaporin4-antibody-positive neuromyelitis optica spectrum disorder (AQP4-NMOSD) patients, auto-Th cells expressed CD154, but proliferative capacity and pro-inflammatory cytokines were strongly reduced. Instead, exhaustion-associated co-inhibitory receptors were expressed together with FOXP3, the canonical regulatory T cell (Treg) transcription factor.

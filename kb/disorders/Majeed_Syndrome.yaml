genetic:
- name: LPIN2
  gene_term:
    preferred_term: LPIN2
    term:
      id: hgnc:14450
      label: LPIN2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Biallelic Loss of Function
  notes: >-
    Identified by homozygosity mapping in consanguineous families and confirmed
    by an independent splice-site allele in a third family. Reported alleles
    include missense, frameshift, splice-site and a 17.8 kb deletion, and
    compound heterozygosity occurs, so the disease is not restricted to
    consanguineous populations. Two alleles recur across families,
    c.2201C>T (p.Ser734Leu) and c.540_541delAT.
  evidence:
  - reference: PMID:15994876
    reference_title: Homozygous mutations in LPIN2 are responsible for the syndrome of chronic recurrent multifocal
      osteomyelitis and congenital dyserythropoietic anaemia (Majeed syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The gene was mapped to a 5.5 cM interval (1.8 Mb) on chromosome 18p.'
    explanation: The positional mapping that localised the gene before it was identified.
  - reference: PMID:17330256
    reference_title: A splice site mutation confirms the role of LPIN2 in Majeed syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A homozygous single-basepair change was detected in the donor splice site of exon
      17 (c.2327+1G>C) in the patient; her mother was heterozygous at this site.'
    explanation: Independent confirmation in a third family with a different class of allele.
  - reference: PMID:33314777
    reference_title: Novel Majeed Syndrome-Causing LPIN2 Mutations Link Bone Inflammation to Inflammatory M2
      Macrophages and Accelerated Osteoclastogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'She had a 17.8-kb deletion on the maternal LPIN2 allele and a splice site mutation,
      p.R517H, that variably spliced out exons 10 and 11 on the paternal LPIN2 allele.'
    explanation: Documents compound heterozygosity including a large deletion, which widens the
      allelic spectrum beyond homozygous point mutations.
  - reference: PMID:41113563
    reference_title: Clinical and genetic analysis of Majeed syndrome caused by LPIN2 complex heterozygous
      mutation and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Several recurrent hotspots, such as c.2201C>T (p.Ser734Leu) and c.540_541delAT, were
      noted, but novel variants continue to expand the mutational spectrum.'
    explanation: Names the two recurrent alleles across the 35 reported patients.
inheritance:
- name: Autosomal recessive
  description: >-

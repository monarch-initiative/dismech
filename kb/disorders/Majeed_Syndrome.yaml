name: Majeed Syndrome
creation_date: '2026-09-09T09:00:00Z'
description: >-
  An autosomal recessive autoinflammatory disorder caused by biallelic LPIN2
  mutations, presenting as the triad of chronic sterile multifocal osteomyelitis,
  congenital dyserythropoietic anaemia and, in many patients, a neutrophilic
  dermatosis. Lipin-2 is a phosphatidic acid phosphatase that normally restrains
  the NLRP3 inflammasome; losing it lets IL-1 beta production run unchecked. The
  cleanest evidence for that mechanism is therapeutic rather than biochemical.
  These children have raised TNF-alpha in serum, yet TNF blockade did nothing,
  while IL-1 blockade produced dramatic improvement. The inflammasome account
  does not by itself explain the bone lesions, and a second arm through
  macrophage polarisation and accelerated osteoclastogenesis has been proposed to
  fill that gap.
categories:
- Autoinflammatory Disease
- Autoinflammatory Bone Disease
- Inborn Error of Immunity
parents:
- autoinflammatory syndrome
synonyms:
- LPIN2-related Majeed syndrome
- chronic recurrent multifocal osteomyelitis with congenital dyserythropoietic anemia
epidemiology:
- name: Reported case count
  description: >-
    Exceedingly rare. At the time of the most recent review, 24 genetically
    confirmed individuals from 10 families had been reported, which is the
    constraint behind every frequency statement in this entry.
  evidence:
  - reference: PMID:33670882
    reference_title: 'Majeed Syndrome: A Review of the Clinical, Genetic and Immunologic Features.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'It is exceedingly rare. There are only 24 individuals from 10 families with genetically
      confirmed Majeed syndrome reported in the literature.'
    explanation: The 2021 figure. Small enough that phenotype frequencies here should be read
      cautiously.
  - reference: PMID:37865862
    reference_title: 'LPIN2 -related Majeed syndrome: report of two Indian patients with novel variants in
      LPIN2 and review of literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'To date, only 31 individuals from 18 families have been reported with this rare
      condition.'
    explanation: The updated count two years later. Both are recorded because the growth from 10
      to 18 families is itself the reason milder phenotypes are now recognised.
- name: Widening phenotypic spectrum
  description: >-
    Early reports described severely affected children. As more families have been
    found, milder presentations have been recognised, so the original description
    is probably an ascertainment-biased extreme rather than the typical case.
  evidence:
  - reference: PMID:33670882
    reference_title: 'Majeed Syndrome: A Review of the Clinical, Genetic and Immunologic Features.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The early descriptions of Majeed syndrome reported severely affected children with
      recurrent fevers, severe multifocal osteomyelitis, failure to thrive, and marked elevations
      of blood inflammatory markers. As more affected families have been identified, it has become
      clear that there is significant phenotypic variability.'
    explanation: Documents both the original severe phenotype and the later recognition of
      variability.
pathophysiology:
- name: Biallelic LPIN2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Homozygous or compound heterozygous LPIN2 mutations
    remove lipin-2, a phosphatidic acid phosphatase. The disease was mapped and
    the gene identified by homozygosity mapping in consanguineous families, and
    splice-site, frameshift and deletion alleles have all been reported since.
  genes:
  - preferred_term: LPIN2
    term:
      id: hgnc:14450
      label: LPIN2
  molecular_functions:
  - preferred_term: phosphatidate phosphatase activity
    modifier: DECREASED
    term:
      id: GO:0008195
      label: phosphatidate phosphatase activity
  evidence:
  - reference: PMID:15994876
    reference_title: Homozygous mutations in LPIN2 are responsible for the syndrome of chronic recurrent multifocal
      osteomyelitis and congenital dyserythropoietic anaemia (Majeed syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Examination of genes in this interval led to the identification of homozygous mutations
      in LPIN2 in affected individuals from the two families.'
    explanation: The original gene identification by positional mapping in two unrelated families.
  - reference: PMID:33670882
    reference_title: 'Majeed Syndrome: A Review of the Clinical, Genetic and Immunologic Features.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The disease is an autosomal recessive disorder caused by mutations in LPIN2, the gene
      encoding the phosphatidic acid phosphatase LIPIN2.'
    explanation: States the inheritance pattern and names the enzyme activity lost.
  downstream:
  - target: Inflammatory Macrophage Polarisation and Accelerated Osteoclastogenesis
    causal_link_type: DIRECT
    description: A second, inflammasome-independent consequence of losing lipin-2, acting on
      macrophage polarisation and osteoclast formation at the growth plate.
    evidence:
    - reference: PMID:33670882
      reference_title: 'Majeed Syndrome: A Review of the Clinical, Genetic and Immunologic Features.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Recent studies demonstrate that LPIN2 deficiency drives pro-inflammatory M2-macrophages
        and enhances osteoclastogenesis which suggest a critical role of lipin-2 in controlling
        homeostasis at the growth plate in an inflammasome-independent manner.'
      explanation: States that LPIN2 deficiency drives this arm directly and independently of the
        inflammasome, which is why it branches from the genetic lesion rather than from IL-1 beta.
  - target: Loss of Lipin-2 Restraint on the NLRP3 Inflammasome
    causal_link_type: DIRECT
    description: Lipin-2 normally acts as a negative regulator of the inflammasome, so its loss
      releases that restraint.
    evidence:
    - reference: PMID:28031477
      reference_title: Lipin-2 regulates NLRP3 inflammasome by affecting P2X7 receptor activation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'Collectively, our results unveil lipin-2 as a critical player in the negative
        regulation of NLRP3 inflammasome.'
      explanation: States the negative-regulator role whose loss this edge describes.
- name: Loss of Lipin-2 Restraint on the NLRP3 Inflammasome
  biological_scale: CELLULAR
  description: >-
    Lipin-2 restrains the inflammasome at more than one point. It limits MAPK
    activation during priming, which controls pro-IL-1 beta synthesis, and it
    inhibits activation and sensitisation of the P2X7 receptor together with the
    potassium efflux, ASC oligomerisation and caspase-1 processing that follow.
    The P2X7 arm is cholesterol-dependent, which is how a lipid phosphatase ends
    up controlling an ion channel.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  genes:
  - preferred_term: NLRP3
    term:
      id: hgnc:16400
      label: NLRP3
  - preferred_term: P2RX7
    term:
      id: hgnc:8537
      label: P2RX7
  biological_processes:
  - preferred_term: NLRP3 inflammasome complex assembly
    modifier: INCREASED
    term:
      id: GO:0044546
      label: NLRP3 inflammasome complex assembly
  evidence:
  - reference: PMID:28031477
    reference_title: Lipin-2 regulates NLRP3 inflammasome by affecting P2X7 receptor activation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Lipin-2 also inhibits the activation and sensitization of the purinergic receptor
      P2X7 and K+ efflux, apoptosis-associated speck-like protein with a CARD domain oligomerization,
      and caspase-1 processing, key events during inflammasome activation.'
    explanation: Enumerates the specific inflammasome steps lipin-2 restrains.
  - reference: PMID:28031477
    reference_title: Lipin-2 regulates NLRP3 inflammasome by affecting P2X7 receptor activation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Reduced levels of lipin-2 in macrophages lead to a decrease in cellular cholesterol
      levels. In fact, restoration of cholesterol concentrations in cells lacking lipin-2 decreases
      ion currents through the P2X7 receptor, and downstream events that drive IL-1β production.'
    explanation: A rescue experiment. Restoring cholesterol reverses the P2X7 currents and the
      downstream IL-1 beta production, which is what ties the lipid function to the ion channel.
  - reference: PMID:37865862
    reference_title: 'LPIN2 -related Majeed syndrome: report of two Indian patients with novel variants in
      LPIN2 and review of literature.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'LPIN2 -related Majeed syndrome (MIM# 609628) is a rare non-inflammasome autoinflammatory
      disease, caused due to biallelic variants in LPIN2 (MIM* 605519).'
    explanation: A direct disagreement in the literature, recorded rather than resolved. This paper
      classifies the disease as non-inflammasome, while the mechanistic work above and other
      reviews place it among the NLRP3 inflammasomopathies. The therapeutic response to IL-1
      blockade is compatible with either, since IL-1 beta can be produced by inflammasome-independent
      routes.
  downstream:
  - target: Excess IL-1 beta Production
    causal_link_type: DIRECT
    description: Unrestrained priming and activation together drive excessive IL-1 beta from
      macrophages.
    evidence:
    - reference: PMID:28031477
      reference_title: Lipin-2 regulates NLRP3 inflammasome by affecting P2X7 receptor activation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'We show here that lipin-2 controls excessive IL-1β formation in primary human and
        mouse macrophages by several mechanisms, including activation of the inflammasome NLRP3.'
      explanation: States the output this edge terminates in, demonstrated in both human and mouse
        primary macrophages.
- name: Excess IL-1 beta Production
  biological_scale: CELLULAR
  description: >-
    The operative cytokine. Its primacy rests on a therapeutic dissociation rather
    than on biochemistry alone: TNF-alpha is also raised in these patients, but
    blocking it does nothing while blocking IL-1 works.
  biological_processes:
  - preferred_term: interleukin-1 beta production
    modifier: INCREASED
    term:
      id: GO:0032611
      label: interleukin-1 beta production
  genes:
  - preferred_term: IL1B
    term:
      id: hgnc:5992
      label: IL1B
  evidence:
  - reference: PMID:23087183
    reference_title: Efficacy of anti-IL-1 treatment in Majeed syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Both siblings had elevated proinflammatory cytokines in their serum, including tumour
      necrosis factor α (TNF-α), however a trial of the TNF inhibitor etanercept resulted in no
      improvement.'
    explanation: The negative half of the dissociation. A cytokine can be elevated and still not
      be the driver, which is why this node names IL-1 beta specifically rather than
      "proinflammatory cytokines".
  downstream:
  - target: Sterile Multifocal Bone Inflammation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: IL-1 driven inflammation localises to bone. The intermediates are partly known
      through the macrophage and osteoclast arm below, and the inflammasome account alone does not
      explain why bone is targeted.
    evidence:
    - reference: PMID:33670882
      reference_title: 'Majeed Syndrome: A Review of the Clinical, Genetic and Immunologic Features.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Data supports that disruption of the phosphatidic acid phosphatase activity in LIPIN2
        results in immune dysregulation due to aberrant activation of the NLRP3 inflammasome and
        overproduction of proinflammatory cytokines including IL-1β, however, these findings did
        not explain the bone phenotype.'
      explanation: The authors state plainly that the inflammasome account does not explain the
        bone phenotype, which is why this edge is graded as having known but insufficient
        intermediates.
  - target: Recurrent Fever
    causal_link_type: DIRECT
    description: IL-1 beta is pyrogenic, and recurrent fever accompanies the systemic inflammatory
      burden.
    evidence:
    - reference: PMID:33670882
      reference_title: 'Majeed Syndrome: A Review of the Clinical, Genetic and Immunologic Features.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'The early descriptions of Majeed syndrome reported severely affected children with
        recurrent fevers, severe multifocal osteomyelitis, failure to thrive, and marked elevations
        of blood inflammatory markers.'
      explanation: Groups recurrent fever with the raised inflammatory markers that reflect this
        node.
  - target: Failure to Thrive
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Chronic systemic inflammation accompanies poor growth. The intervening route is
      not established in these sources.
    evidence:
    - reference: PMID:33670882
      reference_title: 'Majeed Syndrome: A Review of the Clinical, Genetic and Immunologic Features.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'The early descriptions of Majeed syndrome reported severely affected children with
        recurrent fevers, severe multifocal osteomyelitis, failure to thrive, and marked elevations
        of blood inflammatory markers.'
      explanation: Places failure to thrive alongside the systemic inflammatory features, without
        establishing the mechanism.
  - target: Hepatosplenomegaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Organomegaly accompanies the systemic inflammatory and haematological disease,
      and can be present from the neonatal period.
    evidence:
    - reference: PMID:17330256
      reference_title: A splice site mutation confirms the role of LPIN2 in Majeed syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'The patient, a 3-year-old Arabic girl, had hepatosplenomegaly and anemia as a
        neonate.'
      explanation: Documents hepatosplenomegaly together with the anaemia in the neonatal period;
        the mechanism is not addressed.
  - target: Dyserythropoiesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The anaemia responds to IL-1 blockade alongside the bone disease, but the route
      from inflammasome activation to ineffective erythropoiesis is not established in these
      sources.
    evidence:
    - reference: PMID:23087183
      reference_title: Efficacy of anti-IL-1 treatment in Majeed syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Their bone disease and anaemia were refractory to treatment with corticosteroids.'
      explanation: Treats bone disease and anaemia as a single therapeutic problem, which is the
        clinical basis for placing both downstream of the same node; the mechanism is not shown.
- name: Inflammatory Macrophage Polarisation and Accelerated Osteoclastogenesis
  biological_scale: CELLULAR
  description: >-
    The proposed second arm, offered specifically because the inflammasome account
    left the bone phenotype unexplained. LPIN2 deficiency drives pro-inflammatory
    M2 macrophages and enhances osteoclastogenesis, which would give bone a
    lineage-specific route to damage that generic cytokine excess does not.
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: osteoclast differentiation
    modifier: INCREASED
    term:
      id: GO:0030316
      label: osteoclast differentiation
  - preferred_term: macrophage differentiation
    modifier: ABNORMAL
    term:
      id: GO:0030225
      label: macrophage differentiation
  evidence:
  - reference: PMID:33670882
    reference_title: 'Majeed Syndrome: A Review of the Clinical, Genetic and Immunologic Features.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Recent studies demonstrate that LPIN2 deficiency drives pro-inflammatory M2-macrophages
      and enhances osteoclastogenesis which suggest a critical role of lipin-2 in controlling
      homeostasis at the growth plate in an inflammasome-independent manner.'
    explanation: States the macrophage and osteoclast arm and, crucially, that it operates in an
      inflammasome-independent manner. That is what makes this a genuinely separate arm rather
      than a downstream elaboration of the inflammasome node.
  - reference: PMID:33314777
    reference_title: Novel Majeed Syndrome-Causing LPIN2 Mutations Link Bone Inflammation to Inflammatory M2
      Macrophages and Accelerated Osteoclastogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Targeted genetic analysis and functional studies assessing monocyte responses, macrophage
      differentiation, and osteoclastogenesis were conducted to compare the pathogenesis of Majeed
      syndrome to interleukin-1 (IL-1)-mediated diseases including neonatal-onset multisystem
      inflammatory disease (NOMID) and deficiency of the IL-1 receptor antagonist (DIRA).'
    explanation: Describes the functional work behind this arm, benchmarked alongside two other
      IL-1-mediated bone diseases, NOMID and DIRA.
  downstream:
  - target: Sterile Multifocal Bone Inflammation
    causal_link_type: DIRECT
    description: Enhanced osteoclastogenesis provides the bone-specific effector arm that the
      inflammasome account lacks.
    evidence:
    - reference: PMID:33314777
      reference_title: Novel Majeed Syndrome-Causing LPIN2 Mutations Link Bone Inflammation to Inflammatory
        M2 Macrophages and Accelerated Osteoclastogenesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'To identify novel heterozygous LPIN2 mutations in a patient with Majeed syndrome and
        characterize the pathomechanisms that lead to the development of sterile osteomyelitis.'
      explanation: States the stated aim of linking these cellular findings to sterile
        osteomyelitis, which is the endpoint of this edge.
- name: Sterile Multifocal Bone Inflammation
  biological_scale: TISSUE
  description: >-
    Culture-negative, multifocal osteomyelitis with no demonstrable organism. The
    sterility is the defining feature and separates this from infectious
    osteomyelitis, which matters because the treatment is immunosuppression rather
    than antibiotics.
  biological_processes:
  - preferred_term: osteoclast differentiation
    modifier: INCREASED
    term:
      id: GO:0030316
      label: osteoclast differentiation
  evidence:
  - reference: PMID:39757386
    reference_title: Autoinflammatory Bone Diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Inflammatory bone lesions associated with AIBDs exhibit chronic inflammation, are
      typically culture-negative, and do not exhibit discernible microorganisms on histopathological
      examination.'
    explanation: Defines the sterile character of the bone lesion in this disease family.
  downstream:
  - target: Osteomyelitis
    causal_link_type: DIRECT
    description: The bone lesion as observed clinically and radiologically.
    evidence:
    - reference: PMID:36877799
      reference_title: LPIN2-Related Majeed Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Individuals with LPIN2-related Majeed syndrome typically experience multisystem
        inflammatory symptoms, including chronic sterile multifocal osteomyelitis, recurrent bone
        pain, recurrent fever, failure to thrive, dyserythropoietic anemia, and neutrophilic
        dermatosis.'
      explanation: Names sterile multifocal osteomyelitis among the typical manifestations.
  - target: Bone Pain
    causal_link_type: DIRECT
    description: Recurrent bone pain, characteristically near the joints of the long bones of the
      lower limbs.
    evidence:
    - reference: PMID:36877799
      reference_title: LPIN2-Related Majeed Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Recurrent bone pain is frequently localized near the joints, often of the long bones
        of the lower extremities.'
      explanation: Gives the characteristic distribution of the pain.
  - target: Flexion Contracture
    causal_link_type: DIRECT
    description: Repeated joint swelling accompanying the osteomyelitis leads to fixed contracture.
    evidence:
    - reference: PMID:36877799
      reference_title: LPIN2-Related Majeed Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Recurrent osteomyelitis with joint swelling can lead to subsequent joint
        contractures.'
      explanation: States the progression from recurrent joint swelling to contracture.
- name: Dyserythropoiesis
  biological_scale: CELLULAR
  description: >-
    Ineffective erythropoiesis producing a congenital microcytic anaemia of
    variable severity. It is present from the neonatal period in some patients and
    is what distinguishes this syndrome from non-syndromic chronic recurrent
    multifocal osteomyelitis.
  evidence:
  - reference: PMID:36877799
    reference_title: LPIN2-Related Majeed Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Congenital dyserythropoietic, microcytic anemia can range from mild to severe and
      sometimes requires blood transfusion.'
    explanation: Characterises the anaemia, its microcytic nature and its range of severity.
  downstream:
  - target: Microcytic Anemia
    causal_link_type: DIRECT
    description: The haematological phenotype as measured.
    evidence:

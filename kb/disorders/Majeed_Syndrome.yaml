      reference_title: LPIN2-Related Majeed Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Congenital dyserythropoietic, microcytic anemia can range from mild to severe and
        sometimes requires blood transfusion.'
      explanation: Names the microcytic anaemia and its transfusion requirement at the severe end.

diagnosis:
- name: LPIN2 molecular genetic testing
  presence: PRESENT
  description: >-
    Diagnosis is molecular, established by biallelic pathogenic LPIN2 variants in
    a proband with suggestive findings. This matters because the bone lesions are
    culture-negative and will otherwise be pursued as infection.
  evidence:
  - reference: PMID:36877799
    reference_title: LPIN2-Related Majeed Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The diagnosis of LPIN2-related Majeed syndrome is established in a proband with
      suggestive findings and biallelic pathogenic variants in LPIN2 identified by molecular genetic
      testing.'
    explanation: States the molecular diagnostic criterion.
- name: Differentiation from juvenile idiopathic arthritis
  presence: PRESENT
  description: >-
    The practical diagnostic problem. Overlap with juvenile idiopathic arthritis
    leads to delayed or incorrect diagnosis, and patients are treated as JIA with
    partial response before the genetic diagnosis is made. That partial response
    is itself misleading, because it looks like treatment failure rather than
    wrong diagnosis.
  evidence:
  - reference: PMID:41113563
    reference_title: Clinical and genetic analysis of Majeed syndrome caused by LPIN2 complex heterozygous
      mutation and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Its rarity and overlap with juvenile idiopathic arthritis (JIA) often lead to delayed
      or incorrect diagnoses.'
    explanation: States the differential that causes the delay.
  - reference: PMID:41113563
    reference_title: Clinical and genetic analysis of Majeed syndrome caused by LPIN2 complex heterozygous
      mutation and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Initially diagnosed and treated as JIA with NSAIDs, methotrexate, and adalimumab,
      she experienced only partial improvement.'
    explanation: An individual instance, and note that adalimumab is a TNF inhibitor - a second
      case of TNF blockade giving only partial benefit, consistent with the etanercept failure
      recorded under treatments.

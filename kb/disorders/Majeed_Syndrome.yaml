diagnosis:
- name: LPIN2 molecular genetic testing
  presence: PRESENT
  description: >-
    Diagnosis is molecular, established by biallelic pathogenic LPIN2 variants in
    a proband with suggestive findings. This matters because the bone lesions are
    culture-negative and will otherwise be pursued as infection.
  evidence:
  - reference: PMID:36877799
    reference_title: LPIN2-Related Majeed Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The diagnosis of LPIN2-related Majeed syndrome is established in a proband with
      suggestive findings and biallelic pathogenic variants in LPIN2 identified by molecular genetic
      testing.'
    explanation: States the molecular diagnostic criterion.
- name: Differentiation from juvenile idiopathic arthritis
  presence: PRESENT
  description: >-
    The practical diagnostic problem. Overlap with juvenile idiopathic arthritis
    leads to delayed or incorrect diagnosis, and patients are treated as JIA with
    partial response before the genetic diagnosis is made. That partial response
    is itself misleading, because it looks like treatment failure rather than
    wrong diagnosis.
  evidence:
  - reference: PMID:41113563
    reference_title: Clinical and genetic analysis of Majeed syndrome caused by LPIN2 complex heterozygous
      mutation and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Its rarity and overlap with juvenile idiopathic arthritis (JIA) often lead to delayed
      or incorrect diagnoses.'
    explanation: States the differential that causes the delay.
  - reference: PMID:41113563
    reference_title: Clinical and genetic analysis of Majeed syndrome caused by LPIN2 complex heterozygous
      mutation and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Initially diagnosed and treated as JIA with NSAIDs, methotrexate, and adalimumab,
      she experienced only partial improvement.'
    explanation: An individual instance, and note that adalimumab is a TNF inhibitor - a second
      case of TNF blockade giving only partial benefit, consistent with the etanercept failure
      recorded under treatments.
- name: MRI of bone marrow oedema
  presence: PRESENT
  description: >-
    Whole-body or regional MRI shows multifocal bone marrow oedema at the
    osteomyelitic sites. In the reported case it was the MRI, together with the
    microcytic anaemia, that moved the working diagnosis from juvenile
    idiopathic arthritis toward a monogenic autoinflammatory disease.
  evidence:
  - reference: PMID:41113563
    reference_title: Clinical and genetic analysis of Majeed syndrome caused by LPIN2 complex heterozygous
      mutation and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'MRI revealed multifocal bone marrow edema consistent with CRMO, and laboratory results
      demonstrated mild microcytic anemia.'
    explanation: The imaging finding and the laboratory finding that together prompted genetic
      testing.
treatments:
- name: Interleukin-1 Blockade
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    The effective treatment, and the one that establishes the mechanism.
    Recombinant IL-1 receptor antagonist or an anti-IL-1 beta antibody produced
    dramatic clinical and laboratory improvement in disease refractory to
    corticosteroids, and long-lasting remission in a later case. GeneReviews
    names anti-IL-1 therapy the drug of choice (anakinra 1.5 mg/kg/day titrated
    as needed, or canakinumab 2 mg/kg every 4 or 8 weeks) and notes that it is
    not available everywhere. Patients on biologic or immunosuppressive
    treatment should avoid live-attenuated vaccines where possible.
  treatment_term:
    preferred_term: biological therapy
    term:
      id: NCIT:C15187
      label: Biological Therapy
    therapeutic_agent:
    - preferred_term: anakinra
      term:
        id: NCIT:C38717
        label: Anakinra
    - preferred_term: canakinumab
      term:
        id: NCIT:C80971
        label: Canakinumab
  target_mechanisms:
  - target: Excess IL-1 beta Production
    treatment_effect: INHIBITS
    description: Blocks either IL-1 beta itself or its receptor, neutralising the output of the
      unrestrained inflammasome.
    evidence:
    - reference: PMID:23087183
      reference_title: Efficacy of anti-IL-1 treatment in Majeed syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'IL-1 inhibition with either a recombinant IL-1 receptor antagonist (anakinra) or
        an anti-IL-1β antibody (canakinumab) resulted in dramatic clinical and laboratory
        improvement.'
      explanation: Two independent means of blocking the same axis both work, which is stronger
        evidence for the target than either alone.
  evidence:
  - reference: PMID:23087183
    reference_title: Efficacy of anti-IL-1 treatment in Majeed syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'This is the first report detailing the treatment of Majeed syndrome with biological
      agents and demonstrates clinical improvement with IL-1blockade.'
    explanation: The first report of biological treatment in this disease.
  - reference: PMID:41113563
    reference_title: Clinical and genetic analysis of Majeed syndrome caused by LPIN2 complex heterozygous
      mutation and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Treatments included NSAIDs, corticosteroids, bisphosphonates, methotrexate, and, more
      recently, biologics such as anakinra and canakinumab, with IL-1 blockade providing the most
      consistent benefit.'
    explanation: A literature-wide comparison across treatment classes, which places IL-1 blockade
      above the conventional agents rather than resting the claim on the two-sibling report alone.
  - reference: PMID:36877799
    reference_title: LPIN2-Related Majeed Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'While one of the anti-IL-1 therapies is the drug of choice, these drugs may not be
      universally available.'
    explanation: GeneReviews management guidance ranks anti-IL-1 therapy first, and explains why
      the conventional agents below remain in use.
  - reference: PMID:36877799
    reference_title: LPIN2-Related Majeed Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'For affected individuals managed with biologic or immunosuppressive medications,
      live-attenuated vaccines should be avoided, when possible.'
    explanation: The precaution that accompanies this treatment. The schema has no slot for agents
      to avoid, so it is attached to the therapy that creates the need for it.
- name: Tumour Necrosis Factor Blockade
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Recorded mainly because it failed. TNF-alpha was elevated in serum and
    etanercept produced no improvement in two siblings whose disease then
    responded to IL-1 blockade, which is what makes the IL-1 response
    mechanistically informative. The record is not uniformly negative. A child
    treated as juvenile idiopathic arthritis with adalimumab alongside an NSAID
    and methotrexate had fewer flares but incomplete control, and a 2025
    review lists anti-TNF agents among the medications reported effective. The
    fair reading is little or partial benefit, well short of the IL-1 response.
  treatment_term:
    preferred_term: biological therapy
    term:
      id: NCIT:C15187
      label: Biological Therapy
    therapeutic_agent:
    - preferred_term: etanercept
      term:
        id: NCIT:C2381
        label: Etanercept
    - preferred_term: adalimumab
      term:
        id: NCIT:C65216
        label: Adalimumab
  evidence:
  - reference: PMID:23087183
    reference_title: Efficacy of anti-IL-1 treatment in Majeed syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'Both siblings had elevated proinflammatory cytokines in their serum, including tumour
      necrosis factor α (TNF-α), however a trial of the TNF inhibitor etanercept resulted in no
      improvement.'
    explanation: Direct evidence against TNF as a therapeutic target here, despite the cytokine
      being measurably raised.
  - reference: PMID:41113563
    reference_title: Clinical and genetic analysis of Majeed syndrome caused by LPIN2 complex heterozygous
      mutation and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'These therapies reduced the frequency of flares but did not completely control joint
      pain, raising doubts about the initial diagnosis and prompting further evaluation.'
    explanation: Partial benefit from a regimen that included adalimumab. The adalimumab was given
      with naproxen and methotrexate, so the benefit cannot be assigned to TNF blockade alone.
  - reference: PMID:39757386
    reference_title: Autoinflammatory Bone Diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: 'Various medications, including NSAIDs, corticosteroids, bisphosphonates, anti-TNF agents,
      and anti-IL-1 medications, have been effective in the treatment of Majeed syndrome.'
    explanation: A review's summary that includes anti-TNF agents among effective treatments. It
      does not rank them, and it is recorded so the etanercept failure is not read as the whole

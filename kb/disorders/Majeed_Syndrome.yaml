    evidence_source: HUMAN_CLINICAL
    snippet: 'The gene was mapped to a 5.5 cM interval (1.8 Mb) on chromosome 18p.'
    explanation: The positional mapping that localised the gene before it was identified.
  - reference: PMID:17330256
    reference_title: A splice site mutation confirms the role of LPIN2 in Majeed syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A homozygous single-basepair change was detected in the donor splice site of exon
      17 (c.2327+1G>C) in the patient; her mother was heterozygous at this site.'
    explanation: Independent confirmation in a third family with a different class of allele.
  - reference: PMID:33314777
    reference_title: Novel Majeed Syndrome-Causing LPIN2 Mutations Link Bone Inflammation to Inflammatory M2
      Macrophages and Accelerated Osteoclastogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'She had a 17.8-kb deletion on the maternal LPIN2 allele and a splice site mutation,
      p.R517H, that variably spliced out exons 10 and 11 on the paternal LPIN2 allele.'
    explanation: Documents compound heterozygosity including a large deletion, which widens the
      allelic spectrum beyond homozygous point mutations.

genetic:
- name: LPIN2
  gene_term:
    preferred_term: LPIN2
    term:
      id: hgnc:14450
      label: LPIN2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Biallelic Loss of Function
  notes: >-
    Identified by homozygosity mapping in consanguineous families and confirmed
    by an independent splice-site allele in a third family. Reported alleles
    include missense, frameshift, splice-site and a 17.8 kb deletion, and
    compound heterozygosity occurs, so the disease is not restricted to
    consanguineous populations.

disease_term:
  preferred_term: Majeed syndrome
  term:
    id: MONDO:0012316
    label: Majeed syndrome
notes: >-
  The therapeutic dissociation is the load-bearing evidence. These patients have
  measurably elevated TNF-alpha, and TNF blockade did nothing; IL-1 blockade by
  two independent means produced dramatic improvement in corticosteroid-refractory
  disease. That pattern is stronger evidence for IL-1 as the operative cytokine
  than any cytokine measurement, and it is why the failed TNF treatment is
  recorded as its own entry with REFUTE evidence rather than omitted. An elevated
  biomarker is not a demonstrated driver.

  Where the mechanism is incomplete, stated by its own authors. The review that
  establishes the inflammasome account says in the same sentence that these
  findings did not explain the bone phenotype. That admission is quoted directly
  on the edge from IL-1 beta to bone inflammation, and it is why the macrophage
  and osteoclast arm is modelled as a separate branch from the genetic lesion,
  graded PROVISIONAL. A reader should be able to see that the bone-specific step
  is the weak link, not infer it. The bone arm still reaches bone inflammation,
  so the two arms converge there even though they diverge at the top.

  Relationship to chronic recurrent multifocal osteomyelitis. Majeed syndrome is
  a monogenic, syndromic form of CRMO, which is curated separately here. The
  distinguishing features are the congenital dyserythropoietic anaemia and the
  neutrophilic dermatosis, neither of which belongs to non-syndromic CRMO, plus a
  defined recessive gene. The two entries should be read together; this one does
  not restate the CRMO mechanism.

  A phenotype mapping compromise. HPO has no term for congenital dyserythropoietic
  anaemia of the microcytic type. The only dyserythropoietic term available,
  HP:0005532, is macrocytic and therefore wrong here. The haematological phenotype
  is bound to HP:0001935 Microcytic anemia, with the dyserythropoietic character
  carried in the description and in the pathophysiology node rather than forced
  into an inaccurate term.

  Is this an inflammasomopathy? The apparent disagreement largely dissolves, and
  the way it dissolves is why the pathograph branches at the genetic lesion. One
  2023 report calls the disease "a rare non-inflammasome autoinflammatory
  disease", while the mechanistic work and the major review place it among the
  NLRP3 inflammasomopathies. The IUIS 2022 classification files it under
  "Non-Inflammasome Related Conditions" with the mechanism column reading
  "Undefined", which matches the 2023 wording; this entry records that
  placement under classifications without treating it as a finding against
  the lipin-2 and NLRP3 work. The reconciliation is in the review's own sentence:
  the macrophage and osteoclast arm controls growth-plate homeostasis "in an
  inflammasome-independent manner". So the systemic inflammation is inflammasome
  driven and the bone arm is not. Both arms therefore branch directly from LPIN2
  loss rather than one sitting downstream of the other, and the dissenting
  characterisation is retained as REFUTE evidence on the inflammasome node so a
  reader meeting that claim can find what it does and does not contradict.

  Scale of the evidence. Twenty-four genetically confirmed individuals from ten
  families in 2021, and 31 from 18 families by 2023. Both counts are recorded,
  because the growth is what explains the widening phenotype: as more families
  are found, milder cases appear and the original severe descriptions look
  ascertainment-biased. Frequency values in this entry should be read against
  numbers this small. Phenotype bands follow Table 2 of the 2025 literature
  review of 35 patients (osteomyelitis 94.3%, dyserythropoietic anaemia 85.3%,
  joint swelling 86.4%, recurrent fever 76.7%, failure to thrive 74.1%), each
  over the patients with data rather than all 35. No feature reaches 100%, so
  none is recorded as obligate.

  CURIEs the deep-research report got wrong. The report gave HGNC:14100 for
  LPIN2. That identifier does not resolve; the correct one is hgnc:14450, which
  is what this entry uses. Three of its eleven HPO CURIEs name a different
  concept from the one claimed: HP:0025573 is Mild myopia (offered for
  neutrophilic dermatosis), HP:0040211 is Abnormal skin morphology of the palm
  (offered for recurrent osteomyelitis), and HP:0001939 is Abnormality of
  metabolism/homeostasis (offered for dyserythropoietic anaemia). Four wrong
  identifiers in one report is the reason every identifier here was resolved
  against the local ontology database rather than copied.

  Neutrophilic dermatosis is bound to HP:0031234 Neutrophilic infiltration of
  the skin, which names the histological feature GeneReviews describes. In the
  local HPO build, search "l~Sweet" returns only HP:0030221 Sweet craving, and
  "l~dermatosis" returns HP:0032178 Flaky paint dermatosis and HP:0033167
  Neutrophilic urticarial dermatosis. The last is an urticarial eruption, which
  is not the plaque, pustule and nodule picture described here.

  Known extension points: gastrointestinal features including recurrent
  abdominal pain and diarrhoea; and long-term outcome, described as poor before
  IL-1 blockade but without quotable quantitative follow-up in these sources.
  The dietary and microbiome work on sterile osteomyelitis is in the Pstpip2
  cmo mouse, a different gene and a model of non-syndromic chronic
  osteomyelitis. It may bear on the bone arm by analogy, and it is not evidence
  about LPIN2 disease.

  Provenance. Curated from PubMed with a five-iteration OpenScientist
  deep-research job as a cross-check. Seven of the eleven cached references are
  full text rather than abstracts, and content_type was checked before writing.

- name: Harlequin Ichthyosis
  display_name: Harlequin Ichthyosis
  subtype_term:
    preferred_term: harlequin ichthyosis
    term:
      id: MONDO:0009443
      label: autosomal recessive congenital ichthyosis 4B
  description: >-
    Severe ARCI phenotype, most often linked to ABCA12 loss-of-function, with
    profound neonatal hyperkeratosis and barrier compromise. The neonate is
    encased in thick plate-like armour separated by deep fissures, with
    ectropion, eclabium and flattened ears. It is no longer invariably fatal:
    with modern neonatal care, reported survival is around half, and deaths
    concentrate in the first three months from sepsis and respiratory failure -
    the direct consequences of a stratum corneum that cannot function as a
    barrier. Survivors carry a chronic severe scaling erythroderma. Genotype
    tracks outcome, with homozygous loss-of-function alleles reported in all
    deaths in the largest series and compound heterozygosity over-represented
    among survivors. The reported association between early oral retinoid
    treatment and survival in that series is deliberately not curated here as a
    treatment effect: it is a retrospective, questionnaire-based comparison with
    no randomisation and obvious scope for confounding by indication and by era
    of neonatal care, and the source itself claims only that early retinoids may
    improve survival.
  subtype_frequency: 2.7% in a 74-patient Italian ARCI cohort
  evidence:
  - reference: PMID:36980989
    reference_title: "Mutational Spectrum of the ABCA12 Gene and Genotype-Phenotype Correlation in a Cohort of 64 Patients with Autosomal Recessive Congenital Ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most severe form of ARCI, harlequin ichthyosis, is caused by mutations in ABCA12."
    explanation: Supports harlequin ichthyosis as the severe ABCA12-associated ARCI phenotype.
  - reference: PMID:21339420
    reference_title: "Harlequin ichthyosis: a review of clinical and molecular findings in 45 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 45 cases, the ages of the survivors ranged from 10 months to 25 years, with an overall survival rate of 56%. Death usually occurred in the first 3 months and was attributed to sepsis and/or respiratory failure in 75% of cases.
    explanation: >-
      Quantifies survival and the timing and cause of death in the largest
      reported harlequin ichthyosis series, establishing that the disorder is
      severe but not invariably fatal.
  - reference: PMID:21339420
    reference_title: "Harlequin ichthyosis: a review of clinical and molecular findings in 45 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis revealed that 52% of survivors had compound heterozygous mutations, whereas all deaths were associated with homozygous mutations.
    explanation: >-
      Documents the genotype-outcome relationship. Note this is an observed
      association in a retrospective questionnaire-based series, not a
      demonstrated dose-response, and is curated as such.
  - reference: PMID:21413658
    reference_title: "Harlequin ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He had firm plaques covering his body, with fissures especially in flexural areas. Other remarkable findings included edematous hands and feet, ectropion, eclabium, and contractures (Figure).
    explanation: >-
      Documents the characteristic neonatal presentation - armour-plate scale
      with fissuring, ectropion and eclabium.

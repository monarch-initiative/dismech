    reference_title: "Autosomal recessive congenital ichthyosis: Genomic landscape and phenotypic spectrum in a cohort of 125 consanguineous families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence data analysis identified biallelic mutations in 106 families out of a total of 125 (85%), most of them (102, 96.2%) being homozygous, reflecting consanguinity in these families."
    explanation: >-
      Gives the diagnostic yield of a targeted ichthyosis panel in a large

- name: Defective Filaggrin Catabolism and Natural Moisturizing Factor Generation
  conforms_to: "epidermal_cornification_failure#Defective Cornified Envelope Assembly and Lamellar Lipid Delivery"
  biological_scale: CELLULAR
  description: >-
    A third branch of the ARCI cornification lesion, distinct from
    transglutaminase cross-linking and from epidermal lipid handling. Caspase-14
    is expressed in the suprabasal epidermis and activated during keratinocyte
    cornification, where it performs the terminal proteolytic step that breaks
    filaggrin down into the free amino acids and derivatives that make up the
    natural moisturizing factors of the stratum corneum. Where this step fails,
    filaggrin fragments accumulate and natural moisturizing factors are
    depleted. CASP14 is the ARCI gene assigned to this branch.

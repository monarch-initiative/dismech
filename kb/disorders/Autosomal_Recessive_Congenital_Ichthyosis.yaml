- reference: PMID:35887135
  title: Deep Phenotyping of Superficial Epidermolytic Ichthyosis due to a Recurrent Mutation in KRT2.
  findings:
  - statement: >-
      Superficial epidermolytic ichthyosis, the KRT2 disease that MONDO files
      beneath this entry's anchor, is autosomal dominant, which is why it is not
      curated as a subtype of an autosomal recessive entry.
    supporting_text: >-
      Superficial epidermolytic ichthyosis (SEI) is an autosomal dominant
      inherited ichthyosis. SEI is caused by mutations in KRT2 and frequently
      shows erythroderma and widespread blistering at birth.
- reference: PMID:18843291
  title: "Ichthyosis, follicular atrophoderma, and hypotrichosis caused by mutations in ST14 is associated with impaired profilaggrin processing."
  findings:
  - statement: >-
      The ST14 phenotype numbered ARCI11 is syndromic - congenital ichthyosis
      with follicular atrophoderma, hypotrichosis, hypohidrosis and woolly hair
      - which is the basis on which it is recorded but not curated as a subtype
      of this non-syndromic entry.
    supporting_text: >-
      Congenital ichthyosis encompasses a heterogeneous group of disorders of
      cornification. Isolated forms and syndromic ichthyosis can be
      differentiated. We have analyzed two consanguineous families from the
      United Arab Emirates and Turkey with an autosomal recessive syndrome of
      diffuse congenital ichthyosis, patchy follicular atrophoderma, generalized
      and diffuse nonscarring hypotrichosis, marked hypohidrosis, and woolly
      hair (OMIM 602400).

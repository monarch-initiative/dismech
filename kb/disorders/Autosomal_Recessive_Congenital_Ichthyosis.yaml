datasets:
- accession: massive:MSV000082828
  title: Proteomic Manifestations of Genetic Defects in Autosomal Recessive Congenital Ichthyosis
  description: 'Numerous genetic conditions give rise to a scaly skin phenotype as a result of impaired barrier function. Differences in appearance suggest the response of epidermal cells depends upon the basic defect. The present work characterizes the departure of afflicted corneocytes from normal as judged by their proteomic profiles in three types of autosomal recessive congenital ichthyosis arising from defects in the genes PNPLA1, SDR9C7 and TGM1. The results show that the profiles were distinctive, each displaying a set of altered protein levels, but with a subset of common alterations.'
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Autosomal Recessive Congenital Ichthyosis"). Retrieved 2026-08-02.
notes: >-
  Two subtype axes are carried in the same has_subtypes list, and they
  cross-cut rather than nest. The first three rows are the clinical
  presentations (lamellar ichthyosis, congenital ichthyosiform erythroderma,
  harlequin ichthyosis); the rows named ARCIn are the numbered gene-defined
  arms. One gene can present as either clinical form - the 125-family
  consanguineous cohort reports that mutations in several genes can give an
  overlapping phenotype consistent with either lamellar ichthyosis or
  congenital ichthyosiform erythroderma - so a patient occupies one row on each
  axis, not one row overall.
  The gene-level share of cases sits in genetic[].case_fractions rather than on
  the gene rows, because the shares are cohort-specific and two cohorts are
  cited.

  Genes named in the numbered series but deliberately not curated here. ST14 is
  the gene of the entity OMIM and MONDO number as ARCI11 (MONDO:0011218). Its
  reported phenotype is syndromic - diffuse congenital ichthyosis together with
  patchy follicular atrophoderma, generalised non-scarring hypotrichosis,
  marked hypohidrosis and woolly hair - and MONDO's own exact synonyms for the
  term are IFAH syndrome, ichthyosis-follicular atrophoderma-hypotrichosis
  syndrome and ichthyosis-hypotrichosis syndrome. This entry is scoped to
  non-syndromic ARCI, and the thirteen-gene panel that contemporary
  non-syndromic ARCI sequencing uses does not include ST14. The MONDO
  hierarchy is faithful to the OMIM series numbering; the disagreement is
  between that numbering and the non-syndromic scoping used in the clinical
  genetics literature, so ST14 is recorded here rather than curated as a
  subtype.

  KRT2 and superficial epidermolytic ichthyosis (MONDO:0007813) are likewise
  not curated here. That disease is an autosomal dominant inherited ichthyosis
  caused by KRT2 mutations, so it cannot be a subtype of an autosomal recessive
  entry, and MONDO's own direct parents for it are keratinopathic ichthyosis
  and exfoliative ichthyosis. It reaches this entry's MONDO subtree only
  through the chain MONDO:0007813 is_a MONDO:0017339 exfoliative ichthyosis
  is_a MONDO:0017265, which places a dominant keratin disease under an
  autosomal recessive parent.

  ARCI7 (MONDO:0014009) has no curated arm because no causative gene is
  recorded for it. MONDO carries no RO:0004003 causal-gene relation on that
  term, and the SDR9C7 report states that the causative gene for ARCI7 alone
  had not been identified and that its own mapping interval fell outside the
  ARCI7 locus, so SDR9C7 does not close it.

  The thirteen-gene non-syndromic ARCI panel quoted on the pathophysiology
  trigger node names one further gene, SLC27A4, that is not curated here.
  MONDO files the SLC27A4 disease as ichthyosis prematurity syndrome
  (MONDO:0012089), a syndromic disease with no is_a path to MONDO:0017265, so
  it is a neighbouring entity rather than an arm of this one.

  No ARCI gene has a ClinGen Gene-Disease Validity assertion. Each of TGM1,
  ABCA12, ALOX12B, ALOXE3, CERS3, CYP4F22, LIPN, NIPAL4, PNPLA1, SDR9C7,
  SULT2B1, CASP14, ST14 and KRT2 was searched by symbol in the ClinGen
  Gene-Disease Validity download whose own header records FILE CREATED:
  2026-09-24, and none returned a row. Gene attribution here therefore rests on
  primary reports and cohort series, not on an expert-panel classification.

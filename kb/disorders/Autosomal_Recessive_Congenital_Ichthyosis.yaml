      consanguinity.
  - reference: PMID:30578701
    reference_title: "Autosomal recessive congenital ichthyosis: Genomic landscape and phenotypic spectrum in a cohort of 125 consanguineous families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotype-genotype correlations allowed assignment of specific genes in the majority of the families to a specific subtype of ARCI, lamellar ichthyosis (LI) versus congenital ichthyosiform erythroderma (CIE). Interestingly, mutations in several genes could give rise to an overlapping phenotype consistent with either LI or CIE."

  description: >-
    Biallelic POR variants are required; each sib of an affected individual has
    a 25% risk. Expressivity is wide and allele-dependent: homozygosity for
    p.Ala287Pro was invariably associated with 46,XX disorder of sex development
    but normal genitalia in 46,XY individuals, so the same genotype produces
    opposite genital phenotypes depending on karyotype.

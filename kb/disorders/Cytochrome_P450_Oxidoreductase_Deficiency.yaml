- name: Imperforate anus
  category: Clinical
  description: >-
    Imperforate anus occurred in about 11% of a systematic Japanese series,
    with no significant difference in frequency between the milder and more
    severe mutation groups. The authors attribute it, and the urinary
    anomalies, to aberrant retinoic acid metabolism from CYP26 deficiency
    rather than to the steroid defect - which is why this entry wires it to
    the retinoic acid node rather than to the steroidogenic branches.
  frequency: 10.8% (4 of 37 patients)
  phenotype_term:
    preferred_term: Anal atresia
    term:
      id: HP:0002023
      label: Anal atresia
  evidence:
  - reference: PMID:20409737
    reference_title: "Anorectal and urinary anomalies and aberrant retinoic acid metabolism in cytochrome P450 oxidoreductase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Imperforate anus was observed in four patients (10.8%) and
      vesicoureteral reflux was found in three patients (8.1%), with no
      significant difference in the frequencies of such anomalies between
      groups A and B.
    explanation: >-
      The frequency this row records, alongside the vesicoureteral reflux
      figure, and the observation that genotype severity did not predict them.
  - reference: PMID:20409737
    reference_title: "Anorectal and urinary anomalies and aberrant retinoic acid metabolism in cytochrome P450 oxidoreductase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results imply that aberrant atRA metabolism due to CYP26 deficiency
      underlies various anorectal and urinary anomalies in patients with PORD.
    explanation: >-
      The authors' attribution of these anomalies to retinoic acid rather than
      to the steroid defect, which is the basis for the causal edge from the
      retinoic acid node.

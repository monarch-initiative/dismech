    treatment_effect: BYPASSES
    description: >-
      Exogenous glucocorticoid replaces the hormone the impaired pathway cannot
      make under stress; it does not restore P450 activity.
- name: Sex steroid replacement
  description: >-
    Testosterone replacement in males whose levels remain low after puberty
    begins, dihydrotestosterone for micropenis in some males, and oestrogen
    replacement in females with absent pubertal development. Oestradiol is also
    used to reduce the size of ovarian cysts, which both treats them and
    supports the gonadotropin-driven account of how they form.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

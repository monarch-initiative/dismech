name: Cytochrome P450 Oxidoreductase Deficiency
creation_date: "2026-11-19T16:24:19Z"
category: Mendelian
synonyms:
- PORD
- P450 oxidoreductase deficiency
- POR deficiency
- Antley-Bixler syndrome with genital anomalies and disordered steroidogenesis
- Antley-Bixler syndrome with genital anomaly and disorder of steroidogenesis
- ABS1
- Ambiguous genitalia-disordered steroidogenesis Antley-Bixler syndrome
description: >-
  Cytochrome P450 oxidoreductase deficiency (PORD) is an autosomal recessive
  disorder of steroidogenesis caused by biallelic variants in POR, which
  encodes NADPH-cytochrome P450 reductase, the obligate electron donor for
  every microsomal cytochrome P450 enzyme. Because one reductase serves many
  P450s, a single defect produces simultaneous partial loss of function across
  several unrelated pathways at once - steroid synthesis, sterol synthesis,
  retinoic acid catabolism and drug metabolism - and how much each partner
  loses is allele-specific rather than uniform. The clinical result is a
  disorder that looks like several diseases combined: partial cortisol
  deficiency with adrenal hyperplasia, a disorder of sex development that
  virilizes 46,XX fetuses while undervirilizing 46,XY fetuses, mineralocorticoid
  excess hypertension presenting in young adulthood, large ovarian cysts, and
  the skeletal malformations of the Antley-Bixler phenotype - craniosynostosis,
  radiohumeral synostosis, bowed long bones and joint contractures. Cortisol
  deficiency is usually partial, so basal cortisol is often normal and the risk
  of adrenal crisis is unmasked only by stress or by ACTH stimulation.
notes: >-
  Naming. The entry is named Cytochrome P450 Oxidoreductase Deficiency, the
  title of the GeneReviews chapter (PMID:20301592) and the name the field now
  uses, with the MONDO label kept as a synonym. MONDO:0008726 is the
  Antley-Bixler-titled term, but its OMIM cross-reference is 201750, which
  GeneReviews treats as PORD across the whole spectrum - including patients
  with no craniosynostosis - and the founding paper is titled "Mutant P450
  oxidoreductase causes disordered steroidogenesis with and without
  Antley-Bixler syndrome". Naming the entry after the skeletal phenotype would
  therefore have been narrower than what the entry covers.

  Relation to the FGFR2 entry. kb/disorders/Antley-Bixler_Syndrome_FGFR2-Related.yaml
  curates the other arm of the Antley-Bixler phenotype: autosomal dominant,
  FGFR2, skeletal only, with no disorder of steroidogenesis. The two share a
  skeletal appearance and nothing else - different gene, different inheritance,
  different mechanism - and distinguishing them is the practical reason the
  steroid profile matters diagnostically.

  Two mechanism branches are genuinely contested, and both are recorded rather
  than resolved. First, the cause of 46,XX fetal virilization: Reisch et al.
  (PMID:31611378) demonstrated an active alternative ("backdoor") androgen
  pathway in human fetal explants during the sexual-differentiation window,
  while Fluck et al. (PMID:32576700) argue for inhibition of placental CYP19A1
  aromatase instead, and the Reisch reply (PMID:32576683) answers that
  alternative-pathway intermediates are 5-alpha-reduced and therefore cannot be
  aromatized. Second, the cause of the skeletal phenotype: a sterol-deficiency
  model, in which reduced CYP51A1 activity lowers chondrocyte cholesterol and
  Indian hedgehog signalling, competes with a retinoic-acid model in which
  reduced CYP26 activity allows local all-trans retinoic acid to accumulate.
  The two are not mutually exclusive. The retinoic-acid model's strongest
  genetic evidence comes from CYP26B1 mutations rather than from POR itself,
  so the link to POR is an inference from POR being CYP26B1's electron donor
  plus the raised patient retinoic acid levels, and it is labelled as such.

  Scope note on drug metabolism. POR also serves the drug-metabolising P450s,
  and reduced activity is demonstrated in vitro for several variants, but no
  human pharmacokinetic study in PORD patients exists. It is therefore left out
  of the pathograph rather than modelled as a predicted phenotype.

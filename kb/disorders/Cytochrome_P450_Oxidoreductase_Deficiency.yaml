- name: Maternal virilization during pregnancy
  category: Clinical
  description: >-
    The mother of an affected fetus may virilize during the pregnancy, and the
    virilization resolves after delivery. It is a feature of the pregnancy
    rather than of the mother, who is an unaffected carrier, and it is one of
    the presentations that leads to the diagnosis before birth.
  phenotype_term:
    preferred_term: Maternal virilization in pregnancy
  notes: >-
    Left ontology-unbound, and the reason matters because an earlier revision
    of this entry got it wrong twice over. That revision bound HP:0000078
    Abnormality of the genital system and justified it with a note claiming no
    specific HPO term existed, on the strength of searching
    cache/hp/terms.csv. The claim was false. HP:0008072 Maternal virilization
    in pregnancy does exist, and a missing row in that cache means only that
    nothing in kb/ has bound the term yet, never that HPO lacks it.

    HP:0008072 is nonetheless not bindable here. Its ancestors are HP:0002686
    Pregnancy history and HP:0032443 Past medical history, so it sits outside
    HP:0000118 Phenotypic abnormality and `just validate-terms` rejects it as
    outside the PhenotypeTerm dynamic enum - the same reason HP:0200067
    Recurrent spontaneous abortion is left unbound in
    kb/disorders/Uterine_Leiomyoma.yaml and
    kb/disorders/Ventriculomegaly_and_Arthrogryposis.yaml. An over-broad
    binding is worse than none here, so the finding is carried in
    `preferred_term` and the description instead.
  evidence:
  - reference: PMID:20301592
    reference_title: "Cytochrome P450 Oxidoreductase Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      ambiguous genitalia/DSD in both males and females, large ovarian cysts in
      females, poor masculinization and delayed puberty in males, and maternal
      virilization during pregnancy with an affected fetus
    explanation: >-
      Names maternal virilization alongside the other consequences of altered
      sex steroid synthesis.

pathophysiology:
- name: Biallelic POR Loss-of-Function Variants
  description: >-
    Biallelic hypomorphic or loss-of-function POR variants reduce the amount,
    stability or flavin binding of NADPH-cytochrome P450 reductase. Reported
    mechanisms at the protein level include impaired FMN and FAD binding and
    reduced protein stability; a complete knockout is embryonically lethal in
    mice, so surviving human disease is caused by partial rather than total
    loss.
  role: trigger
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  molecular_functions:
  - preferred_term: NADPH-hemoprotein reductase activity
    modifier: DECREASED
    term:
      id: GO:0003958
      label: NADPH-hemoprotein reductase activity
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    gene:
      preferred_term: POR
      term:
        id: hgnc:9208
        label: POR
    description: >-
      Germline biallelic POR variants, typically hypomorphic rather than null.
  evidence:
  - reference: PMID:14758361
    reference_title: "Mutant P450 oxidoreductase causes disordered steroidogenesis with and without Antley-Bixler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified mutations in POR, encoding P450 oxidoreductase, the
      obligate electron donor for these enzymes, in a woman with amenorrhea and
      three children with ABS, even though knock-out of POR is embryonically
      lethal in mice.
    explanation: >-
      The founding gene-disease observation, which also records that complete
      loss is lethal and so human disease is hypomorphic.
  downstream:
  - target: Simultaneous Partial Loss of Multiple Microsomal P450 Activities
    causal_link_type: DIRECT
    description: >-
      One reductase serves many P450s, so a single defect degrades several
      pathways at once.
- name: Simultaneous Partial Loss of Multiple Microsomal P450 Activities
  description: >-
    Reduced electron transfer from NADPH through FAD and FMN to the partner
    P450 heme impairs every microsomal cytochrome P450 at once - the
    steroidogenic enzymes CYP17A1, CYP21A2 and CYP19A1, the sterol-synthesis
    enzyme CYP51A1, the retinoic-acid-catabolising CYP26 family, and the
    drug-metabolising P450s. The degree of loss is partner-specific for each
    allele rather than uniform, which is why one variant can cripple CYP17A1
    while sparing CYP19A1. That allele-dependent differential is what makes the
    chain branch, and it is why PORD presents as several apparently unrelated
    diseases at once.
  role: intermediate
  biological_scale: MOLECULAR
  node_class: CATALYTIC_ACTIVITY
  molecular_functions:
  - preferred_term: FMN binding
    modifier: DECREASED
    term:
      id: GO:0010181
      label: FMN binding
  - preferred_term: flavin adenine dinucleotide binding
    modifier: DECREASED
    term:
      id: GO:0050660
      label: flavin adenine dinucleotide binding
  evidence:
  - reference: PMID:32576683
    reference_title: "Reply to Flück et al.: Alternative androgen pathway biosynthesis drives fetal female virilization in P450 oxidoreductase deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The electron donor enzyme P450 oxidoreductase (POR) supports the
      activities of CYP21A2 21-hydroxylase (yellow), CYP17A1 17α-hydroxylase
      (white), CYP17A1 17,20-lyase (blue), and CYP19A1 aromatase (pink) in a
      mutation-dependent, differential manner.
    explanation: >-
      States both the multi-partner dependency and that the impairment is
      mutation-dependent and differential, which is the branching rule.
  - reference: PMID:20409737
    reference_title: "Anorectal and urinary anomalies and aberrant retinoic acid metabolism in cytochrome P450 oxidoreductase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Cytochrome P450 oxidoreductase (POR) is an electron donor for all
      microsomal P450 enzymes including CYP26 involved in inactivation of
      all-trans retinoic acid (atRA).
    explanation: >-
      Extends the partner list beyond steroidogenesis to retinoic acid
      catabolism. Quoted from the paper's introduction, hence BACKGROUND.
  downstream:
  - target: Partial Cortisol Deficiency with Compensatory ACTH Drive
    causal_link_type: DIRECT
    description: >-
      Reduced CYP17A1 and CYP21A2 activity impairs the classic cortisol pathway.
  - target: Alternative Pathway Androgen Synthesis in the 46,XX Fetus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Accumulated 17-hydroxyprogesterone proximal to the enzymatic blocks feeds
      an alternative androgen route.
  - target: Impaired Fetal Testicular Androgen Synthesis
    causal_link_type: DIRECT
    description: >-
      Reduced CYP17A1 17,20-lyase activity lowers testosterone in the 46,XY
      fetus.
  - target: Reduced Chondrocyte Sterol Synthesis and Hedgehog Signalling
    causal_link_type: DIRECT
    description: >-
      Reduced CYP51A1 activity lowers de novo cholesterol synthesis in
      chondrocytes.
  - target: Local All-Trans Retinoic Acid Excess
    causal_link_type: DIRECT
    description: >-
      Reduced CYP26 activity impairs localized degradation of retinoic acid.
  - target: Deoxycorticosterone Accumulation and Mineralocorticoid Excess
    causal_link_type: DIRECT
    description: >-
      Where CYP17A1 is inhibited more than CYP21A2, flux is shunted into the
      mineralocorticoid pathway.
  - target: Gonadotropin-Driven Ovarian Follicular Arrest
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired ovarian steroidogenesis raises gonadotropin drive, and reduced
      CYP51A1 activity lowers a sterol required for oocyte maturation.
- name: Deoxycorticosterone Accumulation and Mineralocorticoid Excess
  description: >-
    Alleles that inhibit CYP17A1 preferentially over CYP21A2 shunt steroid flux
    into the mineralocorticoid pathway, so deoxycorticosterone accumulates and
    activates the mineralocorticoid receptor, causing sodium retention and
    volume expansion with suppressed renin. This mirrors isolated
    17-alpha-hydroxylase deficiency, but it is milder because the inhibition
    here is partial rather than complete.
  role: intermediate
  biological_scale: ORGANISM
  node_class: ENDOCRINE_HOMEOSTATIC_DERANGEMENT
  notes: >-
    Inferred from the biochemistry rather than directly measured in this
    entry's sources. Patients homozygous for p.Ala287Pro show a higher
    corticosterone-to-cortisol metabolite ratio than other PORD patients, which
    is consistent with the shunt; no study retrieved for this entry measured
    deoxycorticosterone and renin alongside blood pressure in a PORD cohort, so
    the node carries no evidence item of its own rather than borrowing one that
    does not make the claim.
  downstream:
  - target: Hypertension
    causal_link_type: DIRECT
    description: >-
      Mineralocorticoid receptor activation raises blood pressure, typically
      from young adulthood.
- name: Gonadotropin-Driven Ovarian Follicular Arrest
  description: >-
    The proposed mechanism of the ovarian macrocysts is a double hit: impaired
    ovarian steroidogenesis removes negative feedback and raises gonadotropins,
    while reduced CYP51A1 activity lowers follicular-fluid meiosis-activating
    sterol, a CYP51A1 product needed for oocyte maturation. Follicles enlarge
    without ovulating.
  role: intermediate
  biological_scale: TISSUE
  node_class: FUNCTIONAL_DISTURBANCE
  notes: >-
    A hypothesis, and recorded as one. It is proposed in an expert review
    rather than demonstrated, and no study retrieved for this entry measures
    meiosis-activating sterol in PORD. The clinical observation that supports
    it indirectly is therapeutic: hormone replacement that suppresses
    gonadotropins shrinks or resolves the cysts, which is what the oestradiol
    treatment row records.
  downstream:
  - target: Ovarian cyst
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Arrested follicles enlarge into the macrocysts that are characteristic of
      the disorder, with a tendency to rupture.
- name: Partial Cortisol Deficiency with Compensatory ACTH Drive
  description: >-
    Impaired flux along the classic cortisol pathway produces partial cortisol
    deficiency, loss of negative feedback, raised ACTH and adrenal hyperplasia -
    which is why the disorder is classified among the congenital adrenal
    hyperplasias. Because the block is partial, basal cortisol is frequently
    normal and the deficiency is revealed only by ACTH stimulation testing or by
    physiological stress. That gap between a normal basal value and an
    inadequate stress response is the clinically dangerous feature.
  role: intermediate
  biological_scale: ORGANISM
  node_class: ENDOCRINE_HOMEOSTATIC_DERANGEMENT
  locations:
  - preferred_term: adrenal gland
    term:
      id: UBERON:0002369
      label: adrenal gland
  evidence:
  - reference: PMID:22162478
    reference_title: "Genotype-phenotype analysis in congenital adrenal hyperplasia due to P450 oxidoreductase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Short cosyntropin testing revealed adrenal insufficiency in 89%.
    explanation: >-
      Quantifies how often stimulation testing uncovers adrenal insufficiency,
      and is the basis for treating a normal basal cortisol as uninformative.
  downstream:
  - target: Adrenal insufficiency
    causal_link_type: DIRECT
    description: >-
      Partial glucocorticoid deficiency that becomes clinically manifest under
      stress.
- name: Alternative Pathway Androgen Synthesis in the 46,XX Fetus
  description: >-
    17-hydroxyprogesterone accumulating proximal to the enzymatic blocks enters
    an alternative "backdoor" androgen pathway that reaches
    dihydrotestosterone without passing through DHEA or testosterone. Reisch et
    al. demonstrated that this pathway is active in explants of human fetal
    adrenal, gonad and genital skin during the sexual-differentiation window,
    and that androgen receptor is present in genital skin of both sexes. Because
    the intermediates are 5-alpha-reduced on entry they cannot be aromatized.
    The pathway ceases shortly after birth, which is why virilization does not
    progress postnatally.
  role: intermediate
  biological_scale: ORGANISM
  node_class: ENDOCRINE_HOMEOSTATIC_DERANGEMENT
  notes: >-
    Contested. Fluck et al. (PMID:32576700) propose inhibition of placental
    CYP19A1 aromatase as the alternative explanation for 46,XX virilization.
    Both positions are published and neither is settled; see the entry notes.
  evidence:
  - reference: PMID:31611378
    reference_title: "Alternative pathway androgen biosynthesis and human fetal female virilization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we employ explant cultures of human fetal organs (adrenals, gonads,
      genital skin) from the major period of sexual differentiation and show
      that alternative pathway androgen biosynthesis is active in the fetus, as
      assessed by liquid chromatography-tandem mass spectrometry.
    explanation: >-
      Demonstrates the pathway is active in human fetal tissue during the window
      in which genital virilization occurs.
  - reference: PMID:32576683
    reference_title: "Reply to Flück et al.: Alternative androgen pathway biosynthesis drives fetal female virilization in P450 oxidoreductase deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Alternative pathway steroids are 5α-reduced upon pathway entry and
      therefore cannot be aromatized.
    explanation: >-
      The authors' central counter-argument against the competing placental
      aromatase hypothesis, recorded so both positions are visible.
  downstream:
  - target: Ambiguous genitalia
    causal_link_type: DIRECT
    description: >-
      Dihydrotestosterone made in the fetal adrenal and locally in genital skin
      virilizes 46,XX external genitalia.
- name: Impaired Fetal Testicular Androgen Synthesis
  description: >-
    Reduced CYP17A1 17,20-lyase activity in the fetal testis lowers
    androstenedione, testosterone and consequently dihydrotestosterone by the
    classic route, so the 46,XY fetus is undervirilized during the
    masculinization window. This branch runs in the opposite direction to the
    46,XX branch, and which one dominates is set by the allele - which is how a
    single disorder undervirilizes one karyotype while virilizing the other.
  role: intermediate
  biological_scale: ORGANISM
  node_class: ENDOCRINE_HOMEOSTATIC_DERANGEMENT
  evidence:
  - reference: PMID:22162478
    reference_title: "Genotype-phenotype analysis in congenital adrenal hyperplasia due to P450 oxidoreductase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DSD was present in 15 of 18 46,XX and seven of 12 46,XY individuals.
    explanation: >-
      Documents that a disorder of sex development occurs in both karyotypes,
      the observation the two opposing branches explain.
  downstream:
  - target: Ambiguous genitalia
    causal_link_type: DIRECT
    description: >-
      Reduced fetal androgen gives hypospadias, micropenis and cryptorchidism
      in 46,XY individuals.
- name: Reduced Chondrocyte Sterol Synthesis and Hedgehog Signalling
  description: >-
    Reduced CYP51A1 lanosterol 14-alpha-demethylase activity lowers de novo
    cholesterol synthesis in chondrocytes. Cholesterol is required for hedgehog
    ligand modification and signalling, so Indian hedgehog signalling falls,
    chondrocyte proliferation and differentiation are impaired and apoptosis
    rises - effects rescued in vitro by cholesterol supplementation and by
    recombinant Indian hedgehog. Disordered endochondral ossification and suture
    biology follow.
  role: intermediate
  biological_scale: CELLULAR
  node_class: SIGNALLING_REDUCED_FAILED
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:19264869
    reference_title: "P450 oxidoreductase expressed in rat chondrocytes modulates chondrogenesis via cholesterol- and Indian Hedgehog-dependent mechanisms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      POR siRNA-transfected chondrocytes exhibited reduced Ihh expression, with
      such effect being neutralized by cholesterol.
    explanation: >-
      Demonstrates the sterol-to-hedgehog link directly in chondrocytes:
      knocking down POR lowers Indian hedgehog expression, and cholesterol
      restores it.
  - reference: PMID:19264869
    reference_title: "P450 oxidoreductase expressed in rat chondrocytes modulates chondrogenesis via cholesterol- and Indian Hedgehog-dependent mechanisms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Lastly, recombinant human/mouse Ihh prevented the POR siRNA-mediated
      effects on chondrocyte proliferation, differentiation, and apoptosis.
    explanation: >-
      The rescue arm. Supplying Indian hedgehog downstream of the sterol defect
      prevents the cellular consequences, which places hedgehog signalling on
      the causal path rather than merely alongside it.
  - reference: PMID:14758361
    reference_title: "Mutant P450 oxidoreductase causes disordered steroidogenesis with and without Antley-Bixler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Mutations of POR also affect drug-metabolizing P450 enzymes, explaining
      the association of ABS with maternal fluconazole ingestion.
    explanation: >-
      A pharmacological parallel rather than direct evidence for this node:
      fluconazole inhibits CYP51A1 and maternal exposure reproduces the
      skeletal features, which is consistent with the sterol route but does not
      demonstrate it. Marked INDIRECT for that reason.
  downstream:
  - target: Craniosynostosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Disordered suture biology produces premature cranial suture fusion.
  - target: Humeroradial synostosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Disordered endochondral ossification and joint formation produce bony
      fusion at the elbow.
- name: Local All-Trans Retinoic Acid Excess
  description: >-
    Reduced CYP26 activity impairs the localized degradation of all-trans
    retinoic acid, and plasma retinoic acid is raised in most PORD patients
    tested. Local retinoic acid excess is an established cause of
    craniosynostosis and skeletal fusions through CYP26B1, and is also the
    proposed explanation for the anorectal and urinary anomalies reported in
    PORD. The link from POR to this mechanism is inferred from POR being the
    electron donor for CYP26 plus the raised patient levels; the direct genetic
    evidence comes from CYP26B1 rather than from POR.
  role: intermediate
  biological_scale: TISSUE
  node_class: METABOLITE_ACCUMULATION
  evidence:
  - reference: PMID:22019272
    reference_title: "Craniosynostosis and multiple skeletal anomalies in humans and zebrafish result from a defect in the localized degradation of retinoic acid."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      We have identified human null and hypomorphic mutations in the gene
      encoding the RA-degrading enzyme CYP26B1 that lead to skeletal and
      craniofacial anomalies, including fusions of long bones, calvarial bone
      hypoplasia, and craniosynostosis.
    explanation: >-
      Establishes that failure to degrade retinoic acid locally causes
      craniosynostosis and skeletal fusions. The evidence is for CYP26B1, not
      POR, so the application to PORD is an inference and directness is
      INDIRECT.
  downstream:
  - target: Craniosynostosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Retinoic acid excess in suture connective tissue is the competing
      explanation for premature suture fusion.
  - target: Imperforate anus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Caudal and hindgut developmental disruption from retinoic acid excess is
      the proposed basis of the anorectal anomalies, which genotype severity
      does not predict.
phenotypes:
- name: Adrenal insufficiency
  category: Clinical
  description: >-
    Partial glucocorticoid deficiency. Basal cortisol is frequently normal, so
    the deficiency is detected by ACTH stimulation testing and becomes
    clinically manifest under intercurrent illness, surgery or other stress.
    Unrecognised, it is the principal preventable cause of death in this
    disorder, which is why stress-dose cover is the central management point.
  phenotype_term:
    preferred_term: Adrenal insufficiency
    term:
      id: HP:0000846
      label: Adrenal insufficiency
  evidence:
  - reference: PMID:22162478
    reference_title: "Genotype-phenotype analysis in congenital adrenal hyperplasia due to P450 oxidoreductase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Short cosyntropin testing revealed adrenal insufficiency in 89%.
    explanation: >-
      Frequency on stimulation testing in the largest genotype-phenotype series.
- name: Ambiguous genitalia
  category: Clinical
  description: >-
    A disorder of sex development occurs in both karyotypes and in opposite
    directions: 46,XX individuals are virilized with clitoral hypertrophy and
    labial fusion, while 46,XY individuals are undervirilized with hypospadias,
    micropenis and cryptorchidism. Virilization in 46,XX individuals does not
    progress after birth.
  phenotype_term:
    preferred_term: Ambiguous genitalia
    term:
      id: HP:0000062
      label: Ambiguous genitalia
  evidence:
  - reference: PMID:22162478
    reference_title: "Genotype-phenotype analysis in congenital adrenal hyperplasia due to P450 oxidoreductase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DSD was present in 15 of 18 46,XX and seven of 12 46,XY individuals.
    explanation: >-
      Documents the frequency of disorder of sex development in both
      karyotypes.
- name: Craniosynostosis
  category: Clinical
  description: >-
    Premature fusion of the cranial sutures, most often coronal and lambdoid,
    producing turricephaly and accompanied by midface retrusion with proptosis
    and choanal stenosis or atresia. This is the lead feature of the
    Antley-Bixler phenotype.
  phenotype_term:
    preferred_term: Craniosynostosis
    term:
      id: HP:0001363
      label: Craniosynostosis
  evidence:
  - reference: PMID:20301592
    reference_title: "Cytochrome P450 Oxidoreductase Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Skeletal malformations can manifest as craniosynostosis, mid-face
      retrusion with proptosis and choanal stenosis or atresia
    explanation: >-
      The GeneReviews statement of the cranial component of the skeletal
      phenotype.
- name: Humeroradial synostosis
  category: Clinical
  description: >-
    Bony fusion at the elbow, the limb counterpart of the cranial fusion, with
    neonatal fractures, congenital bowing of the long bones, joint contractures,
    arachnodactyly and clubfeet reported alongside it.
  phenotype_term:

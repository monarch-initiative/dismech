notes: >-
  Lump/split. The entry covers TGDS-related Catel-Manzke syndrome only.
  Patients with a Catel-Manzke-like phenotype who carry biallelic KYNU variants
  (PMID:31923704) or IMPAD1/BPNT2 variants (PMID:22887726) have diseases with
  their own MONDO terms and their own knowledge-base entries, so they are
  differential diagnoses here rather than subtypes or additional causal genes.
  UXS1, the second most-mentioned gene in the deep-research report, is the
  enzyme TGDS keeps active (PMID:40836090), not a cause of this syndrome in any
  cached source. A DNAH10 candidate proposed for one Catel-Manzke-like patient
  (PMID:26420031) was not carried, because the authors present it only as a
  possible candidate.

  Orphanet ORPHA:1388 annotates Clinodactyly of the 5th finger (HP:0004209) as
  very frequent and Radial deviation of the 2nd finger as occasional, which
  reverses the emphasis of the primary literature, where the index-finger
  deviation is cardinal. The fifth-finger row is not carried. Orphanet rows of
  occasional frequency for hypertelorism, ventriculomegaly, oral synechia,
  metatarsus valgus and camptodactyly, and the very frequent "Abnormality of
  epiphysis morphology" and frequent "Abnormal cardiovascular system
  morphology", are also not carried; the last is represented by the specific
  septal defects.

  Gaps. Glossoptosis, the heart defects and the non-skeletal features have no
  causal edge, because no cached source states their mechanism. No reference
  in this entry describes management, so no treatment block is recorded; the
  deep-research report describes supportive care (airway management for the
  Robin sequence, cleft palate repair, cardiac surgery, hand surgery) without
  a citation. No GeneReviews chapter was found. The ClinGen curation lists
  three further proband papers (PMID:29431110, PMID:34930662, PMID:37010288).
  Neither TGDS nor Catel-Manzke syndrome appears in the full text retrieved
  for them (the cases may be in supplementary tables), so they were not
  cited.

  evidence:
  - reference: PMID:25480037
    reference_title: Homozygous and compound-heterozygous mutations in TGDS cause Catel-Manzke syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to the spectrum of the amino acid changes, we suggest that loss of
      function in TGDS is the underlying mechanism of Catel-Manzke syndrome.
    explanation: Establishes TGDS as the causal gene and loss of function as the mechanism.
  - reference: PMID:25480037
    reference_title: Homozygous and compound-heterozygous mutations in TGDS cause Catel-Manzke syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By using haplotype reconstruction we showed that the mutation c.298G>T is
      probably a founder mutation.
    explanation: Supports the founder status of p.Ala100Ser.
  - reference: PMID:26366375
    reference_title: "Catel-Manzke Syndrome: Further Delineation of the Phenotype Associated with Pathogenic Variants in TGDS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our finding of a homozygous p.Ala100Ser pathogenic variant in our patient
      supports that it is a common mutation in Catel-Manzke syndrome
    explanation: An independent patient homozygous for the recurrent allele.
  notes: >-
    Reported alleles are mostly missense, with one frameshift
    (c.270_271del, p.Lys91Asnfs*22) in the gene-discovery cohort. c.298G>T
    (p.Ala100Ser) recurs and was shown by haplotype reconstruction to be
    probably a founder allele. TGDS is not found in every patient given a
    clinical diagnosis of Catel-Manzke syndrome (PMID:31923704). Patients with
    a Catel-Manzke-like phenotype and variants in KYNU or IMPAD1 (now BPNT2)
    are curated under their own diseases and listed here as differential
    diagnoses, not as additional causal genes; see the entry-level notes. UXS1
    appears in this entry only as the downstream enzyme in the mechanism.
pathophysiology:
- name: Biallelic TGDS Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic TGDS variants reduce the activity of TDP-glucose
    4,6-dehydratase, an enzyme of the short-chain dehydrogenase/reductase (SDR)
    family. In the zebrafish ortholog, Catel-Manzke-associated substitutions at
    conserved residues impair both catalytic activity and protein stability.
  genes:
  - preferred_term: TGDS
    term:
      id: hgnc:20324
      label: TGDS
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: UDP-glucose 4,6-dehydratase activity
    term:
      id: GO:0050377
      label: UDP-glucose 4,6-dehydratase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:25480037
    reference_title: Homozygous and compound-heterozygous mutations in TGDS cause Catel-Manzke syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TGDS (dTDP-D-glucose 4,6-dehydrogenase) is a conserved protein belonging
      to the SDR family and probably plays a role in nucleotide sugar
      metabolism.
    explanation: Identifies the protein family and metabolic role of the gene product.
  - reference: PMID:41159851
    reference_title: Zebrafish as a model for Catel-Manzke syndrome-identification and characterization of the zebrafish TGDS ortholog.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      CMS-associated mutations in conserved residues significantly impair
      enzyme activity and stability.
    explanation: >-
      Recombinant enzyme assays show that disease substitutions reduce
      dehydratase activity and stability. The assays used the zebrafish
      ortholog, so the inference to human TGDS is one step removed.
  downstream:
  - target: Deficient UDP-4-keto-6-deoxyglucose Production
    description: Loss of TGDS activity removes the source of its reaction product.
    causal_link_type: DIRECT
- name: Deficient UDP-4-keto-6-deoxyglucose Production
  biological_scale: MOLECULAR
  description: >-
    TGDS converts UDP-glucose to UDP-4-keto-6-deoxyglucose. This product
    resembles the reaction intermediate of UXS1 and acts as an
    "enzyme-rescue metabolite": it lets UXS1 regenerate its bound NAD+ cofactor
    in a compartment where free NAD+ is scarce. With TGDS deficient, too little
    of the metabolite is made.
  chemical_entities:
  - preferred_term: UDP-4-keto-6-deoxyglucose
    term:
      id: CHEBI:16553
      label: UDP-4-dehydro-6-deoxy-D-glucose
    modifier: DECREASED
  evidence:
  - reference: PMID:40836090
    reference_title: A missing enzyme-rescue metabolite as cause of a rare skeletal dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that the enzyme TGDS produces UDP-4-keto-6-deoxyglucose, a mimic
      of the reaction intermediate of the enzyme UXS1, which regenerates the
      essential cofactor NAD+ within the catalytic pocket of UXS1 by completing
      its catalytic cycle.
    explanation: Defines the TGDS product and its role at UXS1.
  downstream:
  - target: UXS1 Inactivation from Failed NAD+ Regeneration
    description: >-
      Without the rescue metabolite, UXS1 cannot complete its catalytic cycle
      and becomes inactive.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40836090
      reference_title: A missing enzyme-rescue metabolite as cause of a rare skeletal dysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the inability to produce sufficient amounts of this enzyme-rescue
        metabolite leads to the inactivation of UXS1
      explanation: States the causal step from metabolite deficiency to UXS1 inactivation.
- name: UXS1 Inactivation from Failed NAD+ Regeneration
  biological_scale: MOLECULAR
  description: >-
    UXS1 (UDP-glucuronate decarboxylase, UDP-xylose synthase) loses activity
    when its NAD+ cofactor is not regenerated. UXS1 makes UDP-xylose, the sugar
    donor that starts glycosaminoglycan chains on proteoglycan core proteins;
    that link is the defining reaction of the enzyme rather than a measurement
    reported in the cited abstract.
  genes:
  - preferred_term: UXS1
    term:
      id: hgnc:17729
      label: UXS1
  molecular_functions:
  - preferred_term: UDP-glucuronate decarboxylase activity
    term:
      id: GO:0048040
      label: UDP-glucuronate decarboxylase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:40836090
    reference_title: A missing enzyme-rescue metabolite as cause of a rare skeletal dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the inability to produce sufficient amounts of this enzyme-rescue
      metabolite leads to the inactivation of UXS1, impairing the synthesis of
      specific glycans that are crucial for skeletal development
    explanation: Places UXS1 inactivation between TGDS deficiency and the glycan defect.
  downstream:
  - target: Impaired Skeletal Glycosaminoglycan Synthesis
    description: >-
      Inactive UXS1 impairs synthesis of glycans needed for skeletal
      development.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40836090
      reference_title: A missing enzyme-rescue metabolite as cause of a rare skeletal dysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        leads to the inactivation of UXS1, impairing the synthesis of specific
        glycans that are crucial for skeletal development
      explanation: States the step from UXS1 inactivation to the glycan defect.
- name: Impaired Skeletal Glycosaminoglycan Synthesis
  biological_scale: CELLULAR
  description: >-
    Synthesis of the glycans needed for skeletal development falls. The Nature
    abstract does not name the glycan classes; in the zebrafish tgds knockout
    the measured change is a decrease in sulfated glycosaminoglycan content in
    craniofacial cartilage, which is why the node is bound to
    glycosaminoglycan biosynthesis.
  biological_processes:
  - preferred_term: glycosaminoglycan biosynthetic process
    term:
      id: GO:0006024
      label: glycosaminoglycan biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:40836090
    reference_title: A missing enzyme-rescue metabolite as cause of a rare skeletal dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      impairing the synthesis of specific glycans that are crucial for skeletal
      development
    explanation: States the glycan synthesis defect.
  - reference: PMID:41159851
    reference_title: Zebrafish as a model for Catel-Manzke syndrome-identification and characterization of the zebrafish TGDS ortholog.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      craniofacial cartilage alterations, associated with a decrease in sulfate

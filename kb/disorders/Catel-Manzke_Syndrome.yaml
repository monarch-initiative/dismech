diagnosis:
- name: Hand radiography
  description: >-
    Radiographs of the hands show the accessory ossification centre between
    the second metacarpal and the proximal phalanx (Manzke dysostosis). The
    finding can be absent in TGDS-confirmed patients, so a normal radiograph
    does not exclude the diagnosis.
  diagnosis_term:
    preferred_term: hand radiography
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:31769200
    reference_title: TGDS pathogenic variants cause Catel-Manzke syndrome without hyperphalangy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      presented with mild radial deviation and ulnar clinodactyly of the index
      fingers but without radiologic signs of hyperphalangy
    explanation: The hallmark is radiological, and can be absent.
- name: TGDS molecular testing
  description: >-
    Exome sequencing or targeted testing for biallelic TGDS variants confirms
    the diagnosis; the authors of the hyperphalangy-negative report argue for
    testing patients without both hallmarks.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:31769200
    reference_title: TGDS pathogenic variants cause Catel-Manzke syndrome without hyperphalangy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data broaden the phenotypic spectrum of TGDS-associated Catel-Manzke
      syndrome and expand the indication for diagnostic testing.
    explanation: Supports TGDS testing beyond the classical presentation.
- name: Urine organic acid analysis
  description: >-
    Recommended in suspected Catel-Manzke syndrome to detect xanthurenic
    aciduria from KYNU deficiency, especially with cardiac or vertebral
    defects or when no TGDS variants are found.
  evidence:
  - reference: PMID:31923704
    reference_title: Biallelic variants in KYNU cause a multisystemic syndrome with hand hyperphalangism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest performance of urine organic acid analysis in patients with
      suspected Catel-Manzke syndrome, particularly in those with cardiac or
      vertebral defects or without mutations in TGDS.
    explanation: Direct diagnostic recommendation.
differential_diagnoses:
- name: Congenital Vertebral-Cardiac-Renal Anomalies Syndrome (KYNU)
  disease_term:
    preferred_term: congenital vertebral-cardiac-renal anomalies syndrome
    term:
      id: MONDO:0020831
      label: congenital vertebral-cardiac-renal anomalies syndrome
  description: >-
    Biallelic KYNU variants cause kynureninase deficiency, an NAD deficiency
    disorder, and have been found in patients first given a clinical diagnosis
    of Catel-Manzke syndrome because of hand hyperphalangism. Curated in this
    knowledge base as Congenital_Vertebral-Cardiac-Renal_Anomalies_Syndrome.
  distinguishing_features:
  - >-
    Xanthurenic aciduria and a block in tryptophan catabolism on plasma and
    urine metabolomics.
  - Developmental delay.
  evidence:
  - reference: PMID:31923704
    reference_title: Biallelic variants in KYNU cause a multisystemic syndrome with hand hyperphalangism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in TGDS have been identified as one cause of Catel-Manzke
      syndrome, but cannot be found as causative in every patient with the
      clinical diagnosis.
    explanation: States that the clinical diagnosis is genetically heterogeneous.
  - reference: PMID:31923704
    reference_title: Biallelic variants in KYNU cause a multisystemic syndrome with hand hyperphalangism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we present unrelated patients identified with biallelic variants in KYNU
      leading to kynureninase deficiency and xanthurenic aciduria as a very
      likely cause of their hyperphalangism, heart defect, short stature, and
      developmental delay
    explanation: KYNU deficiency reproduces the hand finding, with a metabolic marker.

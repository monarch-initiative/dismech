inheritance:
- name: Autosomal Recessive
  description: >-
    Affected individuals carry homozygous or compound heterozygous TGDS
    variants. Before the gene was found, consanguinity and a possibly affected
    sib in one family had already suggested recessive inheritance; most earlier
    cases were thought to be sporadic. MONDO cross-references two OMIM entries,
    302380 and 616145; Orphanet maps ORPHA:1388 to OMIM:616145 as an exact
    match. No reference cached for this entry supports any mode of inheritance
    other than autosomal recessive.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:25480037
    reference_title: Homozygous and compound-heterozygous mutations in TGDS cause Catel-Manzke syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe the identification of homozygous and compound heterozygous
      mutations in TGDS in seven unrelated individuals with typical
      Catel-Manzke syndrome by exome sequencing.
    explanation: >-
      Biallelic variants in every solved proband is the genetic signature of
      autosomal recessive inheritance.
  - reference: PMID:31769200
    reference_title: TGDS pathogenic variants cause Catel-Manzke syndrome without hyperphalangy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Catel-Manzke syndrome, also known as micrognathia-digital-syndrome, is a
      rare autosomal recessive disorder
    explanation: States the mode of inheritance directly.
  - reference: PMID:21834032
    reference_title: "Catel-Manzke syndrome: a clinical report suggesting autosomal recessive inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the present patient with consanguinity between the parents and a possibly
      affected sib provide support for autosomal recessive inheritance
    explanation: Pre-gene-discovery family evidence for recessive inheritance.

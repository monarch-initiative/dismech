- name: Abnormal Craniofacial and Digital Cartilage Development
  biological_scale: TISSUE
  description: >-
    Cartilage of the developing jaw and of the hand skeleton develops
    abnormally. The craniofacial part is shown in zebrafish and mouse Tgds
    mutants. That the same glycan defect produces the accessory ossification
    centre of the index finger is an inference from the shared cartilage
    defect; no study cached for this entry has examined the hand in a model.
  biological_processes:
  - preferred_term: cartilage development
    term:
      id: GO:0051216
      label: cartilage development
    modifier: ABNORMAL
  evidence:

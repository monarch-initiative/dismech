    explanation: Measures reduced sulfated glycosaminoglycans in the tgds knockout.
  downstream:
  - target: Abnormal Craniofacial and Digital Cartilage Development
    description: Glycosaminoglycan-deficient cartilage develops abnormally.
    causal_link_type: DIRECT
    evidence:

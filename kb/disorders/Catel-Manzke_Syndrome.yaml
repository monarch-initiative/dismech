animal_models:
- name: Zebrafish tgds F0 knockout
  species: Zebrafish
  genotype: tgds CRISPR/Cas9 F0 knockout
  publication: PMID:41159851
  description: >-
    F0 knockout of the zebrafish TGDS ortholog gives a range of developmental
    defects, including craniofacial cartilage alterations with reduced
    sulfated glycosaminoglycan content.
  modeled_mechanisms:
  - target: Abnormal Craniofacial and Digital Cartilage Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      F0 knockouts are mosaic. The authors find that zebrafish Tgds acts as the
      first step of an L-rhamnose-type pathway, a different enzymatic context
      from the human UXS1 rescue mechanism, and the hand phenotype has no
      zebrafish counterpart.
    evidence:
    - reference: PMID:41159851
      reference_title: Zebrafish as a model for Catel-Manzke syndrome-identification and characterization of the zebrafish TGDS ortholog.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        craniofacial cartilage alterations, associated with a decrease in
        sulfate glycosaminoglycan content, mirrored some skeletal features
        observed in humans with CMS
      explanation: The knockout reproduces some craniofacial skeletal features.
  - target: Impaired Skeletal Glycosaminoglycan Synthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Sulfated glycosaminoglycan content was reported for cartilage as a
      whole, not per glycan class.
    evidence:
    - reference: PMID:41159851
      reference_title: Zebrafish as a model for Catel-Manzke syndrome-identification and characterization of the zebrafish TGDS ortholog.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: associated with a decrease in sulfate glycosaminoglycan content
      explanation: Measured glycosaminoglycan deficit.

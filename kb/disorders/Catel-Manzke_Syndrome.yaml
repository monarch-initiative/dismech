name: Catel-Manzke Syndrome
creation_date: "2026-11-06T21:00:00Z"
category: Mendelian
description: >-
  Catel-Manzke syndrome is a rare autosomal recessive congenital malformation
  syndrome caused by biallelic loss-of-function variants in TGDS, which encodes
  the nucleotide-sugar enzyme TDP-glucose 4,6-dehydratase. It combines Pierre
  Robin sequence (micrognathia, glossoptosis and cleft palate) with a
  characteristic hand malformation, Manzke dysostosis: an accessory bone between
  the second metacarpal and the proximal phalanx of the index finger that
  produces radial deviation and ulnar clinodactyly of the index fingers.
  Congenital heart defects, joint laxity, short stature and facial features
  complete the picture. The features are present at birth or prenatally, and in
  infancy the airway and feeding consequences of the Robin sequence dominate.
  TGDS loss is now understood to act through a second enzyme: TGDS makes
  UDP-4-keto-6-deoxyglucose, which keeps UDP-xylose synthase (UXS1)
  catalytically active, and without it the glycans needed for skeletal
  development are not made in sufficient amounts. About 40 patients have been
  reported.
synonyms:
- CATMANS
- Catel Manzke syndrome
- Palatodigital syndrome, Catel-Manzke type
- Pierre Robin sequence-hyperphalangy-clinodactyly syndrome
- Pierre Robin syndrome-hyperphalangy-clinodactyly syndrome
- hyperphalangy-clinodactyly of index finger with Pierre Robin syndrome
- index finger anomaly-Pierre Robin syndrome
- micrognathia digital syndrome
- Pierre-Robin sequence-Manzke dysostosis-clinodactyly of the index finger syndrome

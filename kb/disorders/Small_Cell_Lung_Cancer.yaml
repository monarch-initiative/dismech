datasets:
- accession: ega:EGAS00000000051
  title: A small cell lung cancer genome reports complex tobacco exposure signatures
  description: Cancer is driven by mutation. Worldwide, tobacco smoking is the major lifestyle exposure that causes cancer, exerting carcinogenicity through 60 chemicals that bind and mutate DNA. Using massively parallel sequencing technology, we sequenced a small cell lung cancer cell line, NCI-H209, to explore the mutational burden associated with tobacco smoking. 22,910 somatic substitutions were identified, including 132 in coding exons. Multiple mutation signatures testify to the cocktail of carcinogens in tobacco smoke and their proclivities for particular bases and surrounding sequence context.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: WGS
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Small Cell Lung Cancer"); description-level mentions were not accepted. EGA study_type: Whole Genome Sequencing. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001000299
  title: Integrative analysis of small cell lung cancer
  description: Small-cell lung cancer (SCLC) is an aggressive lung tumor subtype. We conducted integrated analysis of genome sequencing, transcriptome, and copy number analysis and found an extremely high mutation rate of 7.4±1 protein-changing mutations per million basepairs. Evidence for inactivation of TP53 and RB1 was found in all sequenced cases. Furthermore, we identified recurrent mutations in CREBBP, EP300, and MLL, observed mutations in PTEN, in SLIT2, and EPHA7, as well as focal amplifications of the FGFR1 locus.

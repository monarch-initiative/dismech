- name: MYC
  gene_term:
    preferred_term: MYC
    term:
      id: hgnc:7553
      label: MYC
  association: Amplification
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  inheritance:
  - name: Somatic
  notes: >-
    MYC family amplification (MYC, MYCL, MYCN) occurs in ~20% of SCLC and promotes

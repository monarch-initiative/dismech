    snippet: "The mean Ki67 labeling index was 1.4%, 6.6%, and 65.6% in typical, atypical carcinoid, and small cell carcinomas, respectively."
    explanation: Quantifies the markedly elevated Ki-67 labeling index in SCLC compared with pulmonary carcinoids.

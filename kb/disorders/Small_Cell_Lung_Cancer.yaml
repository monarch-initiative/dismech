    snippet: "Historically considered a homogeneous disease, recent multi-omic studies have revealed distinct molecular subtypes driven by lineage-defining transcription factors, including ASCL1, NEUROD1, POU2F3, and YAP1, as well as an inflamed subtype (SCLC-I)."
    explanation: Establishes the POU2F3-driven transcriptional subtype of SCLC.
- name: SCLC-Y
  display_name: SCLC-Y (YAP1-high)
  description: >-
    Low-neuroendocrine SCLC transcriptional subtype characterized by YAP1

- name: Loss of Cell Cycle Checkpoints
  biological_scale: CELLULAR
  conforms_to: "evading_growth_suppressors#Loss of Cell-Cycle Checkpoint Control"
  description: >-
    Combined TP53 and RB1 loss eliminates major G1/S and DNA-damage cell cycle
    checkpoints. Tumor cells proliferate rapidly without normal restraints on
    replication, explaining the rapid doubling time, bulky central airway tumor
    growth, and high initial sensitivity to DNA-damaging chemotherapy and
    radiotherapy.
  cell_types:
  - preferred_term: pulmonary neuroendocrine cell
    term:
      id: CL:1000223
      label: pulmonary neuroendocrine cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:38473726
    reference_title: "P53 and Rb Aberrations in Small Cell Lung Cancer (SCLC): From Molecular Mechanisms to Therapeutic Modulation."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "their broad tumor suppressive functions are eliminated and a normal cell is able to proliferate indefinitely, escape entering into cellular senescence, and evade death"
    explanation: "Mechanistic review of p53/RB aberrations in SCLC states that combined TP53/RB1 loss removes tumor-suppressive checkpoints, allowing indefinite proliferation and senescence/death escape."
  downstream:
  - target: Genomic Instability
    causal_link_type: DIRECT
    description: Unrestrained replication across damaged templates drives chromosomal rearrangements and genomic instability.
  - target: Early Hematogenous Metastatic Dissemination
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Rapid proliferation and survival of circulating tumor cell clusters fuel early systemic metastasis.
  - target: Lung Neoplasm
    causal_link_type: DIRECT
    description: Rapidly dividing neuroendocrine tumor cells form a bulky central airway lung mass.
    evidence:
    - reference: PMID:33446664
      reference_title: "Small-cell lung cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Small-cell lung cancer (SCLC) represents about 15% of all lung cancers and is marked by an exceptionally high proliferative rate, strong predilection for early metastasis and poor prognosis."
      explanation: Links the exceptionally high proliferative rate of SCLC directly to primary lung tumor progression and early metastasis.
  - target: Superior Vena Cava Obstruction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Bulky central airway and mediastinal lymph node tumor growth compressing the superior vena cava
    description: Rapid intrathoracic and mediastinal tumor growth compresses the superior vena cava, causing upper-body venous congestion and edema.
    evidence:
    - reference: PMID:33446664
      reference_title: "Small-cell lung cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Intrathoracic local growth explains frequent symptoms at presentation, including cough, wheeze, dyspnoea, haemoptysis, superior vena cava compression resulting in upper body oedema and flushing, oesophageal compression with dysphagia, and recurrent laryngeal nerve compression with left vocal cord paralysis."
      explanation: Connects rapid intrathoracic SCLC tumor growth to superior vena cava compression and upper-body edema.
- name: Genomic Instability
  biological_scale: CELLULAR
  conforms_to: "genome_instability_mutation#Mutator Phenotype and Chromosomal Instability"
  description: >-
    Loss of TP53 and RB1 leads to widespread genomic instability with extensive
    chromosomal rearrangements and a high somatic mutation burden. Amplification
    of MYC family genes (MYC, MYCL, MYCN) occurs in ~20% of SCLC and promotes
    rapid proliferation and lineage plasticity.
  biological_processes:
  - preferred_term: DNA repair
    modifier: ABNORMAL
    term:
      id: GO:0006281
      label: DNA repair
  evidence:
  - reference: PMID:37329269
    reference_title: "Clinical insights into small cell lung cancer: Tumor heterogeneity, diagnosis, therapy, and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Genomic profiling of SCLC reveals genetic instability, almost universal inactivation of the tumor suppressor genes TP53 and RB1, and a high mutation burden."
    explanation: "Comprehensive clinical review reports that genomic profiling of SCLC tumors demonstrates genetic instability alongside near-universal TP53/RB1 loss and high mutation burden."
- name: Histological Transformation from Oncogene-Driven Lung Adenocarcinoma
  biological_scale: CELLULAR
  description: >-
    A subset of SCLC cases—particularly in never-smokers—arises via lineage
    transdifferentiation of EGFR-mutant or ALK-rearranged lung adenocarcinoma
    under tyrosine kinase inhibitor selective pressure, universally accompanied
    by functional TP53 and RB1 loss and acquisition of a high-grade
    neuroendocrine phenotype.
  cell_types:
  - preferred_term: pulmonary neuroendocrine cell
    term:
      id: CL:1000223
      label: pulmonary neuroendocrine cell
  biological_processes:
  - preferred_term: neuroendocrine cell differentiation
    modifier: ABNORMAL
    term:
      id: GO:0061101
      label: neuroendocrine cell differentiation
  evidence:
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A growing number of reports have characterized the histological transformation of lung adenocarcinoma to an aggressive neuroendocrine phenotype resembling SCLC, which is associated with acquired resistance to inhibitors of EGFR or other tyrosine kinase receptors"
    explanation: Establishes histological transformation from EGFR- or TKI-treated lung adenocarcinoma to an SCLC neuroendocrine phenotype as a recognized route to SCLC.
  - reference: PMID:33687006
    reference_title: "Clinicopathological and immunohistochemical study of pulmonary neuroendocrine tumors - A single-institute experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The absence of resistant clones T790M on EGFR analysis pointed histological transformation to SCLC as the underlying mechanism of EGFR resistance in this case."
    explanation: Clinical biopsy series documents repeat-biopsy histological transformation from lung adenocarcinoma to SCLC as an acquired EGFR-TKI resistance mechanism.
  downstream:
  - target: Neuroendocrine Differentiation
    causal_link_type: DIRECT
    description: Lineage transdifferentiation under TKI pressure establishes a high-grade neuroendocrine SCLC transcriptional program.
    evidence:
    - reference: PMID:33446664
      reference_title: "Small-cell lung cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "some cases of SCLC in never-smokers arise through histological transformation of EGFR-driven or ALK-driven lung adenocarcinoma to SCLC"
      explanation: Links histological transformation of EGFR- or ALK-driven lung adenocarcinoma directly to emergence of the SCLC neuroendocrine phenotype.
- name: Neuroendocrine Differentiation
  biological_scale: CELLULAR
  description: >-
    SCLC cells maintain a high-grade neuroendocrine differentiation program
    expressing synaptophysin, chromogranin A, CD56 (NCAM), TTF-1, and INSM1
    under the control of lineage transcription factors ASCL1 and NEUROD1.
    Ectopic peptide hormone secretion (such as arginine vasopressin/ADH or ACTH)
    and cross-reactive anti-neural autoantibodies produce classic endocrine and
    neurologic paraneoplastic syndromes.
  cell_types:
  - preferred_term: pulmonary neuroendocrine cell
    term:
      id: CL:1000223
      label: pulmonary neuroendocrine cell
  biological_processes:
  - preferred_term: neuroendocrine cell differentiation
    modifier: ABNORMAL
    term:
      id: GO:0061101
      label: neuroendocrine cell differentiation
  evidence:
  - reference: PMID:33687006
    reference_title: "Clinicopathological and immunohistochemical study of pulmonary neuroendocrine tumors - A single-institute experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Synaptophysin was more sensitive than chromogranin in atypical carcinoid and SCLC (100% vs. 80% and 95.83% vs. 76%)."
    explanation: Quantifies immunohistochemical positivity for canonical neuroendocrine markers synaptophysin (95.83%) and chromogranin (76%) in human SCLC specimens.
  - reference: PMID:33687006
    reference_title: "Clinicopathological and immunohistochemical study of pulmonary neuroendocrine tumors - A single-institute experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sensitivity of TTF-1 in small cell carcinoma was 85.19%."
    explanation: Documents frequent nuclear TTF-1 expression (85.19%) in human SCLC tumors.
  downstream:
  - target: DLL3 Surface Expression
    causal_link_type: DIRECT
    description: The ASCL1-driven neuroendocrine lineage program upregulates the inhibitory NOTCH ligand DLL3 on the SCLC cell surface.
    evidence:
    - reference: PMID:39080761
      reference_title: "SMARCA4 controls state plasticity in small cell lung cancer through regulation of neuroendocrine transcription factors and REST splicing."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "SMARCA4 expression was positively correlated with multiple NE genes including SYP, CHGA, INSM1, DLL3 and NCAM1"
      explanation: Places DLL3 within the core neuroendocrine gene expression module co-regulated alongside SYP, CHGA, INSM1, and NCAM1 in SCLC.
  - target: Functional Neuron-SCLC Synapses
    description: >-
      The neuroendocrine/neuronal-like differentiation program enables SCLC
      cells to form functional synapses with neurons.
  - target: Hyponatremia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Ectopic secretion of antidiuretic hormone (SIADH) by neuroendocrine SCLC cells
    description: Ectopic antidiuretic hormone production by neuroendocrine tumor cells causes syndrome of inappropriate antidiuretic hormone secretion (SIADH) and hyponatremia.
    evidence:
    - reference: PMID:33446664
      reference_title: "Small-cell lung cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Common SCLC paraneoplastic endocrinopathies include syndrome of inappropriate anti-diuretic hormone and Cushing syndrome; paraneoplastic neurologic syndromes caused by autoantibodies include Lambert–Eaton syndrome, encephalomyelitis and sensory neuropathy syndromes."
      explanation: Establishes SIADH as a classic neuroendocrine paraneoplastic endocrinopathy in SCLC.
  - target: Ectopic ACTH Cushing Syndrome
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Ectopic adrenocorticotropic hormone (ACTH) secretion by neuroendocrine SCLC cells stimulating adrenal cortisol production
    description: Ectopic ACTH secretion by neuroendocrine SCLC cells drives ACTH-dependent secondary hypercortisolism (ectopic Cushing syndrome).
    evidence:
    - reference: PMID:33446664
      reference_title: "Small-cell lung cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Common SCLC paraneoplastic endocrinopathies include syndrome of inappropriate anti-diuretic hormone and Cushing syndrome; paraneoplastic neurologic syndromes caused by autoantibodies include Lambert–Eaton syndrome, encephalomyelitis and sensory neuropathy syndromes."
      explanation: Identifies Cushing syndrome alongside SIADH as a major paraneoplastic endocrinopathy of SCLC.
  - target: Lambert-Eaton Myasthenic Syndrome

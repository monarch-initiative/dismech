phenotypes:
- category: Neoplastic
  name: Lung Neoplasm
  frequency: OBLIGATE
  description: >-
    SCLC typically presents as a central/hilar mass with extensive mediastinal
    lymphadenopathy. Peripheral nodules are rare.
  phenotype_term:
    preferred_term: Neoplasm of the lung
    term:
      id: HP:0100526
      label: Neoplasm of the lung
  evidence:
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Distinct clinical characteristics of SCLC include the predominantly central location of the primary tumour in the major airways and the often extensive extrapulmonary metastatic spread at presentation."
    explanation: "Supports SCLC presenting as a centrally located primary lung mass with extensive intrathoracic/mediastinal spread; peripheral nodules are rare."
- category: Clinical
  name: Smoking Association
  frequency: VERY_FREQUENT
  description: >-
    SCLC is strongly associated with tobacco smoking, with >95% of patients
    having smoking history. SCLC rarely occurs in never-smokers.
  phenotype_term:
    preferred_term: Neoplasm of the lung
    term:
      id: HP:0100526
      label: Neoplasm of the lung
  evidence:
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCLC is strongly associated with smoking, with 98% of cases arising in current or former smokers"
    explanation: "Supports the dominant tobacco-smoking risk-factor association for SCLC, with the vast majority of cases occurring in current or former smokers."
- category: Clinical
  name: Brain Metastases
  frequency: VERY_FREQUENT
  description: >-
    Brain metastases are extremely common in SCLC, occurring in up to 50-80%
    of patients during disease course. Prophylactic cranial irradiation (PCI)
    may reduce this risk in responders.
  phenotype_term:
    preferred_term: Neoplasm of the nervous system
    term:
      id: HP:0004375
      label: Neoplasm of the nervous system
  evidence:
  - reference: PMID:17699816
    reference_title: "Prophylactic cranial irradiation in extensive small-cell lung cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cumulative risk of brain metastases within 1 year was 14.6% in the irradiation group (95% CI, 8.3 to 20.9) and 40.4% in the control group"
    explanation: "Randomized trial quantifies the high incidence of brain metastases in extensive SCLC and shows prophylactic cranial irradiation substantially reduces this risk in responders."
- category: Clinical
  name: Paraneoplastic Syndromes
  frequency: OCCASIONAL
  description: >-
    SCLC commonly produces paraneoplastic syndromes including SIADH (hyponatremia),
    Cushing syndrome (ectopic ACTH), Lambert-Eaton myasthenic syndrome (anti-VGCC
    antibodies), and limbic encephalitis (anti-Hu antibodies).
  phenotype_term:
    preferred_term: Neoplasm of the lung
    term:
      id: HP:0100526
      label: Neoplasm of the lung
  evidence:
  - reference: PMID:33209464
    reference_title: "Paraneoplastic syndromes in small cell lung cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Paraneoplastic syndromes can commonly occur due to lung cancer, especially small cell lung cancer."
    explanation: "Review establishes SCLC as the classic cause of paraneoplastic syndromes (endocrine syndromes such as SIADH/ectopic ACTH and antibody-mediated neurologic syndromes such as Lambert-Eaton)."
biochemical:
- name: Neuroendocrine Markers
  notes: >-
    SCLC expresses neuroendocrine markers: synaptophysin, chromogranin A, and
    CD56 (NCAM). At least one marker is typically positive. TTF-1 is also
    frequently positive. Ki-67 proliferation index is typically very high (>50%).
  evidence:
  - reference: PMID:33687006
    reference_title: "Clinicopathological and immunohistochemical study of pulmonary neuroendocrine tumors - A single-institute experience."
    supports: PARTIAL
    snippet: "markers which included synaptophysin, chromogranin, CD56"
    explanation: "Pulmonary neuroendocrine tumor study notes diagnostic IHC panel includes classic neuroendocrine markers used for SCLC."

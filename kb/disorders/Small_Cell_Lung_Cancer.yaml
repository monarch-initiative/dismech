  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  description: >-
    TP53 is somatically inactivated in >90% of SCLC through mutations, deletions,
    or both. Loss of p53 function eliminates the DNA-damage checkpoint and
    apoptotic response, enabling survival of pulmonary neuroendocrine cells
    despite severe genomic instability.
  evidence:
  - reference: PMID:36399634
    reference_title: "Retinoblastoma Expression and Targeting by CDK4/6 Inhibitors in Small Cell Lung Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: 'The canonical model of "small cell lung cancer" (SCLC) depicts tumors arising from dual inactivation of TP53 and RB1.'
    explanation: "Establishes somatic TP53 inactivation as half of the canonical dual tumor-suppressor initiating lesion in SCLC."
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Genomic profiling of SCLC reveals extensive chromosomal rearrangements and a high mutation burden, almost always including functional inactivation of the tumour suppressor genes TP53 and RB1."
    explanation: Confirms near-universal functional inactivation of TP53 in SCLC tumors.
  cell_types:
  - preferred_term: pulmonary neuroendocrine cell
    term:
      id: CL:1000223
      label: pulmonary neuroendocrine cell
  locations:
  - preferred_term: bronchus
    term:
      id: UBERON:0002185
      label: bronchus
  biological_processes:
  - preferred_term: DNA damage response, signal transduction by p53 class mediator
    modifier: ABSENT
    term:
      id: GO:0030330
      label: DNA damage response, signal transduction by p53 class mediator
  downstream:
  - target: Loss of Cell Cycle Checkpoints
    causal_link_type: DIRECT
    description: Loss of p53 abrogates DNA-damage-induced cell-cycle arrest and apoptosis.
    evidence:
    - reference: PMID:33446664
      reference_title: "Small-cell lung cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Both RB and p53 play key roles in regulating cell cycle progression: RB is a major inhibitor of S phase entry, whereas p53 is integral to multiple cell cycle checkpoints, triggering cell cycle arrest or inducing apoptosis in response to various cellular stresses, for example, aberrant replication."
      explanation: Explains how p53 loss eliminates cell-cycle checkpoint arrest and stress-induced apoptosis.

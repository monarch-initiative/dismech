    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In patients with disease confined to the chest, standard therapy includes thoracic radiotherapy and concurrent platinum-etoposide chemotherapy."
    explanation: Establishes concurrent thoracic radiotherapy plus platinum-etoposide as standard therapy for limited-stage SCLC.
- name: Prophylactic Cranial Irradiation
  action_category: THERAPEUTIC
  description: >-
    Prophylactic cranial irradiation (PCI) reduces symptomatic brain metastases
    and improves survival in limited-stage SCLC responders; in extensive-stage
    disease, brain MRI surveillance is an established alternative due to
    neurocognitive toxicity concerns.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  target_mechanisms:
  - target: Brain Metastases
    treatment_effect: INHIBITS
    description: Cranial irradiation eradicates occult central nervous system micrometastases before symptomatic progression.
    evidence:
    - reference: PMID:17699816
      reference_title: "Prophylactic cranial irradiation in extensive small-cell lung cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The cumulative risk of brain metastases within 1 year was 14.6% in the irradiation group (95% CI, 8.3 to 20.9) and 40.4% in the control group"
      explanation: Randomized trial demonstrates significant reduction of brain metastases with prophylactic cranial irradiation.
  evidence:
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Prophylactic cranial irradiation (PCI) is also part of the standard management in most patients with non-metastatic SCLC who respond to initial treatment, as it significantly reduces the risk of brain metastases and improves survival"
    explanation: Confirms PCI as standard management in responding non-metastatic SCLC patients.

    snippet: "The genes coding for the tumor suppressors p53 and retinoblastoma (Rb) are inactivated in the vast majority of small cell lung cancer (SCLC) tumors."
    explanation: Documents near-universal TP53 (p53) inactivation in SCLC.
- name: RB1
  gene_term:

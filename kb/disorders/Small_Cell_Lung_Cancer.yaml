    snippet: "Historically considered a homogeneous disease, recent multi-omic studies have revealed distinct molecular subtypes driven by lineage-defining transcription factors, including ASCL1, NEUROD1, POU2F3, and YAP1, as well as an inflamed subtype (SCLC-I)."
    explanation: Establishes the YAP1-defined transcriptional subtype in the four-subtype SCLC classification.
environmental:
- name: Tobacco Smoking
  description: >-
    Cigarette smoking is the dominant etiologic exposure for SCLC, with 98% of
    cases arising in current or former smokers. Tobacco carcinogens produce a
    characteristic mutational signature and drive initiating somatic inactivation
    of TP53 and RB1.
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  influences_mechanisms:
  - target: TP53 Inactivation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Tobacco smoke carcinogens produce C:G>A:T transversion mutational signatures and drive biallelic somatic TP53 inactivation in SCLC initiation.
    evidence:
    - reference: PMID:33446664
      reference_title: "Small-cell lung cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "SCLC tumour mutational profiling reveals a clear smoking signature, providing direct evidence that tobacco carcinogens are responsible for the initiation of SCLC"
      explanation: Mutational profiling directly links tobacco-carcinogen DNA damage to SCLC initiation, where concomitant TP53 and RB1 inactivation is nearly universal.
      directness: INDIRECT
    - reference: PMID:26168399
      reference_title: "Comprehensive genomic profiles of small cell lung cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "C:G>A:T transversions were found in 28% of all mutations on average, a pattern indicative of heavy smoking"
      explanation: Whole-genome sequencing of 110 human SCLC tumors with near-universal biallelic TP53/RB1 loss demonstrates the characteristic tobacco smoking C:G>A:T transversion signature.
      directness: INDIRECT
  - target: RB1 Inactivation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Tobacco smoke carcinogen mutagenesis drives SCLC initiation with concomitant somatic RB1 tumor-suppressor inactivation.
    evidence:
    - reference: PMID:33446664
      reference_title: "Small-cell lung cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "SCLC tumour mutational profiling reveals a clear smoking signature, providing direct evidence that tobacco carcinogens are responsible for the initiation of SCLC"
      explanation: Mutational profiling links the tobacco smoking mutational signature to SCLC initiation alongside concomitant RB1 and TP53 inactivation.
      directness: INDIRECT
    - reference: PMID:26168399
      reference_title: "Comprehensive genomic profiles of small cell lung cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "C:G>A:T transversions were found in 28% of all mutations on average, a pattern indicative of heavy smoking"
      explanation: Whole-genome sequencing of 110 SCLC tumors with near-universal biallelic TP53 and RB1 inactivation documents the heavy-smoking C:G>A:T mutational signature.
      directness: INDIRECT
  evidence:
  - reference: PMID:8166467
    reference_title: "Overview on small cell lung cancer in the world: industrialized countries, Third World, eastern Europe."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cigarette smoking and occupational risk factors are more strongly associated with squamous and small cell lung cancers than with adenocarcinoma."
    explanation: "Supports the strong association between SCLC and cigarette smoking."
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "SCLC is strongly associated with exposure to tobacco carcinogens."
    explanation: Primer confirms tobacco carcinogen exposure as the primary etiologic risk factor for SCLC.
pathophysiology:
- name: TP53 Inactivation
  biological_scale: MOLECULAR

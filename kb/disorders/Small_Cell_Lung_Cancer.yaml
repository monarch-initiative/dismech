  association: Somatic Inactivating Mutation
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  inheritance:
  - name: Somatic
  notes: >-
    RB1 (13q14.2) is somatically inactivated in >90% of SCLC through biallelic

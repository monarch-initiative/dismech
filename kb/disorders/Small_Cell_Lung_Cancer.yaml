    intermediate_mechanisms:
    - Cross-reactive autoantibodies against presynaptic P/Q-type voltage-gated calcium channels induced by tumor neuroendocrine antigens
    description: Humoral immune response against neuroendocrine SCLC antigens generates autoantibodies that impair presynaptic neuromuscular junction transmission, causing Lambert-Eaton myasthenic syndrome.
    evidence:
    - reference: PMID:33446664
      reference_title: "Small-cell lung cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Common SCLC paraneoplastic endocrinopathies include syndrome of inappropriate anti-diuretic hormone and Cushing syndrome; paraneoplastic neurologic syndromes caused by autoantibodies include Lambert–Eaton syndrome, encephalomyelitis and sensory neuropathy syndromes."
      explanation: Establishes autoantibody-mediated Lambert-Eaton syndrome as the hallmark paraneoplastic neurologic disorder associated with SCLC.
- name: DLL3 Surface Expression
  biological_scale: MOLECULAR
  description: >-

    explanation: Establishes recurrent amplification of MYC family genes as a somatic driver of SCLC proliferation and survival.
- name: NOTCH1
  gene_term:
    preferred_term: NOTCH1
    term:
      id: hgnc:7881
      label: NOTCH1
  association: Somatic Inactivating Mutation
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  inheritance:
  - name: Somatic
  notes: >-
    Inactivating somatic mutations across NOTCH family receptor genes occur in
    25% of human SCLC, with NOTCH1 significantly recurrently mutated; active
    NOTCH signaling abrogates neuroendocrine gene expression and suppresses
    SCLC tumor growth, so NOTCH receptor inactivation sustains the
    high-neuroendocrine tumor state.
  evidence:
  - reference: PMID:26168399
    reference_title: "Comprehensive genomic profiles of small cell lung cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, we observed inactivating mutations in NOTCH family genes in 25% of human SCLC."
    explanation: Whole-genome sequencing of 110 SCLC tumors establishes the 25% frequency of inactivating mutations across NOTCH family genes.
  - reference: PMID:26168399
    reference_title: "Comprehensive genomic profiles of small cell lung cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional inactivating mutations occurred in FMN2 and NOTCH1 (P < 0.01). NOTCH family genes were recurrently mutated with a pattern of frequent inactivation."
    explanation: Confirms statistically significant recurrent somatic inactivating mutations specifically in NOTCH1 in human SCLC.
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Among the few that have been functionally validated in mouse models or cell culture assays are loss-of-function events in RB family members p107 and p130 (encoded by RBL1 and RBL2, respectively)34–36, the tumour suppressor PTEN37,38, NOTCH receptors24,39,40 and the chromatin regulator CREBBP41."
    explanation: Documents functionally validated somatic loss-of-function alterations in NOTCH family receptors in SCLC.
diagnosis:
- name: Lung Biopsy with Histopathology and Immunohistochemistry
  description: >-
    Definitive diagnosis requires histopathological and cytological examination
    of bronchoscopic, endobronchial ultrasound-guided, CT-guided, or metastatic-site
    biopsy tissue, supported by immunohistochemical staining for neuroendocrine
    markers (CD56, synaptophysin, chromogranin A), TTF-1, and Ki-67.
  diagnosis_term:
    preferred_term: Lung biopsy
    term:
      id: NCIT:C51748
      label: Lung Biopsy
  evidence:
  - reference: PMID:33687006
    reference_title: "Clinicopathological and immunohistochemical study of pulmonary neuroendocrine tumors - A single-institute experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the total 53 cases, the diagnosis was made on biopsy in 40 patients and resection specimen in 13 patients."
    explanation: Confirms tissue biopsy with histopathology/IHC as the primary diagnostic modality for pulmonary neuroendocrine/SCLC tumors.
- name: Contrast-Enhanced CT and 18F-FDG PET/CT Staging
  description: >-
    Contrast-enhanced CT or whole-body 18F-FDG PET/CT of the chest, abdomen, and
    pelvis defines primary intrathoracic nodal involvement and systemic
    extrapulmonary metastases to distinguish limited-stage from extensive-stage
    SCLC.
  diagnosis_term:
    preferred_term: FDG-PET/CT staging scan
    term:
      id: NCIT:C137817
      label: FDG-Positron Emission Tomography and Computed Tomography Scan
  evidence:
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In addition to medical history and physical examination, this assessment includes imaging (typically contrast-enhanced CT or 18F-FDG PET/CT of the chest, abdomen and pelvis, and brain MRI with contrast) to define the extent of disease, blood tests, including cell counts, liver and kidney function and lactate dehydrogenase, and electrocardiography to ensure safety prior to the administration of cytotoxic drugs"
    explanation: Establishes contrast CT or 18F-FDG PET/CT as standard staging imaging in SCLC.
- name: Contrast-Enhanced Brain Magnetic Resonance Imaging
  description: >-
    Brain MRI with contrast is part of baseline staging in SCLC because ~10-15%

- accession: massive:MSV000090746
  title: The NFIB/CARM1 Partnership is a Therapeutic Target for Small Cell Lung Cancer
  description: This project identified NFI family members as CARM1 substrates. NFIB was previously reported to play a critical role in the development of small cell lung cancer. We provided evidence that the arginine methylation of NFIB is required for its oncogenic function in small cell lung cancer.

- name: Thoracic Radiation
  action_category: THERAPEUTIC
  description: >-
    Concurrent thoracic radiation with cisplatin-etoposide chemotherapy is the
    curative-intent standard of care for limited-stage SCLC; consolidative
    thoracic radiotherapy may also be considered in select extensive-stage
    patients with residual intrathoracic disease.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  target_mechanisms:
  - target: Loss of Cell Cycle Checkpoints
    treatment_effect: INHIBITS
    description: Ionizing radiation induces lethal DNA double-strand breaks in rapidly proliferating checkpoint-deficient SCLC cells.
    evidence:
    - reference: PMID:33446664
      reference_title: "Small-cell lung cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Most therapeutic agents commonly used in patients with SCLC, including DNA cross-linkers (such as cisplatin), topoisomerase inhibitors (such as etoposide or topotecan) or γ-radiation, directly or indirectly target DNA synthesis, replication and repair."
      explanation: Explains how radiation targets DNA synthesis/repair vulnerabilities in SCLC.
  evidence:
  - reference: PMID:37329269

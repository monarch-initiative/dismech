    quote_role: REVIEW_SYNTHESIS
    snippet: "In addition to medical history and physical examination, this assessment includes imaging (typically contrast-enhanced CT or 18F-FDG PET/CT of the chest, abdomen and pelvis, and brain MRI with contrast) to define the extent of disease, blood tests, including cell counts, liver and kidney function and lactate dehydrogenase, and electrocardiography to ensure safety prior to the administration of cytotoxic drugs"
    explanation: Establishes contrast-enhanced brain MRI as standard baseline diagnostic staging for SCLC.
treatments:
- name: Platinum-Etoposide Chemotherapy
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Carboplatin or cisplatin plus etoposide is the cytotoxic backbone of SCLC
    treatment, achieving 60-80% initial response rates by targeting rapidly
    dividing checkpoint-deficient cells; administered concurrently with thoracic
    radiotherapy in limited-stage disease and with PD-L1 blockade in
    extensive-stage disease.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
    - preferred_term: carboplatin
      term:
        id: CHEBI:31355
        label: carboplatin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
  target_mechanisms:
  - target: Loss of Cell Cycle Checkpoints
    treatment_effect: INHIBITS
    description: DNA cross-linking platinum agents and topoisomerase II inhibition selectively kill rapidly cycling checkpoint-deficient SCLC cells.
    evidence:
    - reference: PMID:33446664
      reference_title: "Small-cell lung cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Most therapeutic agents commonly used in patients with SCLC, including DNA cross-linkers (such as cisplatin), topoisomerase inhibitors (such as etoposide or topotecan) or γ-radiation, directly or indirectly target DNA synthesis, replication and repair."
      explanation: Explains how cisplatin and etoposide exploit the rapid replication and DNA-repair vulnerability of SCLC cells.
  evidence:
  - reference: PMID:40843764
    reference_title: Current and Emerging Therapeutic Strategies for Limited- and Extensive-Stage Small-Cell Lung Cancer.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "For ES-SCLC, the treatment paradigm has been fundamentally transformed by the integration of immune checkpoint inhibitors (ICIs) with platinum-etoposide chemotherapy, establishing a new standard of care"
    explanation: Integration of immune checkpoint inhibitors with platinum-etoposide chemotherapy is the standard-of-care backbone for extensive-stage SCLC.
- name: Atezolizumab (with Chemotherapy)
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Anti-PD-L1 monoclonal antibody added to first-line carboplatin-etoposide
    followed by maintenance immunotherapy for extensive-stage SCLC (IMpower133),
    improving progression-free and overall survival.
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: atezolizumab
      term:
        id: NCIT:C106250
        label: Atezolizumab
  target_mechanisms:
  - target: Immune Evasion
    treatment_effect: INHIBITS
    description: PD-L1 blockade relieves adaptive T-cell checkpoint inhibition in SCLC.
    evidence:
    - reference: PMID:33446664
      reference_title: "Small-cell lung cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The addition of either of two anti-PDL1 monoclonal antibodies (atezolizumab or durvalumab) to a standard platinum–etoposide backbone, with continuation of immunotherapy as maintenance, improved both progression-free survival and overall survival"
      explanation: Confirms anti-PD-L1 checkpoint blockade with atezolizumab improves survival when added to platinum-etoposide.
  evidence:
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The addition of either of two anti-PDL1 monoclonal antibodies (atezolizumab or durvalumab) to a standard platinum–etoposide backbone, with continuation of immunotherapy as maintenance, improved both progression-free survival and overall survival"
    explanation: Establishes first-line atezolizumab plus platinum-etoposide and maintenance in extensive-stage SCLC.

genetic:
- name: TP53
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  association: Somatic Inactivating Mutation
  inheritance:
  - name: Somatic
  notes: >-
    TP53 (17p13.1) is inactivated in >90% of SCLC through biallelic mutations
    or deletions. Loss of p53 is considered a defining feature of SCLC.
    Combined with RB1 loss, this creates the aggressive phenotype.
  evidence:
  - reference: PMID:38473726
    reference_title: "P53 and Rb Aberrations in Small Cell Lung Cancer (SCLC): From Molecular Mechanisms to Therapeutic Modulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The genes coding for the tumor suppressors p53 and retinoblastoma (Rb) are inactivated in the vast majority of small cell lung cancer (SCLC) tumors."
    explanation: Documents near-universal TP53 (p53) inactivation in SCLC.
- name: RB1
  gene_term:
    preferred_term: RB1
    term:
      id: hgnc:9884
      label: RB1
  association: Somatic Inactivating Mutation
  inheritance:
  - name: Somatic
  notes: >-
    RB1 (13q14.2) is inactivated in >90% of SCLC through biallelic mutations
    or deletions. Combined TP53/RB1 loss is essentially universal in SCLC
    and serves as a molecular definition of the disease.
  evidence:
  - reference: PMID:38473726
    reference_title: "P53 and Rb Aberrations in Small Cell Lung Cancer (SCLC): From Molecular Mechanisms to Therapeutic Modulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Data support the notion that these two deleterious genetic events represent the initial steps in the development of SCLC"
    explanation: Documents RB1 (Rb) loss, alongside TP53, as an initiating genetic event essentially universal in SCLC.
- name: MYC
  gene_term:
    preferred_term: MYC
    term:
      id: hgnc:7553
      label: MYC
  association: Amplification
  inheritance:
  - name: Somatic
  notes: >-
    MYC family amplification (MYC, MYCL, MYCN) occurs in ~20% of SCLC.
    MYC amplification is associated with variant histology and worse prognosis.
    May predict response to certain therapeutic approaches (Aurora kinase
    inhibitors, chemotherapy timing).
- name: NOTCH
  association: Somatic Inactivating Mutation
  inheritance:
  - name: Somatic
  notes: >-
    NOTCH family members (especially NOTCH1) are inactivated in ~25% of SCLC.
    NOTCH normally suppresses neuroendocrine differentiation; its loss promotes
    the neuroendocrine phenotype.
treatments:
- name: Platinum-Etoposide Chemotherapy
  description: >-
    Carboplatin or cisplatin plus etoposide is the backbone of SCLC treatment.
    High initial response rates (60-80%) but nearly universal relapse. Four
    cycles is standard for extensive-stage; concurrent with radiation for
    limited-stage.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:40843764
    reference_title: Current and Emerging Therapeutic Strategies for Limited- and Extensive-Stage Small-Cell Lung Cancer.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For ES-SCLC, the treatment paradigm has been fundamentally transformed by the integration of immune checkpoint inhibitors (ICIs) with platinum-etoposide chemotherapy, establishing a new standard of care"
    explanation: Integration of immune checkpoint inhibitors with platinum-etoposide chemotherapy is the standard-of-care backbone for extensive-stage SCLC.
- name: Atezolizumab (with Chemotherapy)
  description: >-
    PD-L1 checkpoint inhibitor added to carboplatin-etoposide for extensive-stage
    SCLC. IMpower133 trial showed modest overall survival benefit. Now standard
    first-line for extensive-stage.
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: atezolizumab
      term:
        id: NCIT:C106250
        label: Atezolizumab
- name: Durvalumab (with Chemotherapy)
  description: >-
    PD-L1 checkpoint inhibitor added to platinum-etoposide for extensive-stage
    SCLC. CASPIAN trial showed overall survival benefit. Alternative to
    atezolizumab-based regimen.
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: durvalumab
      term:
        id: NCIT:C103194
        label: Durvalumab
- name: Thoracic Radiation
  description: >-
    Concurrent thoracic radiation with chemotherapy for limited-stage SCLC.
    Essential component of potentially curative therapy. Consolidative thoracic
    radiation may also benefit select extensive-stage patients.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
- name: Prophylactic Cranial Irradiation
  description: >-
    Whole-brain radiation to prevent brain metastases in responding patients.
    Reduces brain metastasis incidence but controversial due to neurocognitive
    effects. Alternative is surveillance with MRI.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
- name: Lurbinectedin
  description: >-
    Transcription inhibitor approved for relapsed SCLC. Alternative to topotecan
    for second-line treatment. Works by inhibiting oncogenic transcription
    factors.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lurbinectedin
      term:
        id: CHEBI:746908
        label: lurbinectedin
- name: Topotecan
  description: >-
    Topoisomerase I inhibitor used for relapsed SCLC. Standard second-line
    option, though responses are generally modest and short-lived.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: topotecan
      term:
        id: CHEBI:63632
        label: topotecan
- name: Tarlatamab
  description: >-
    DLL3-directed bispecific T-cell engager (DLL3 x CD3 BiTE) that redirects
    T cells against the neuroendocrine-lineage surface antigen DLL3, which is
    highly expressed in SCLC. FDA-approved in 2024 for relapsed/refractory
    extensive-stage SCLC. Represents the most clinically advanced DLL3-targeted
    immunotherapy.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: tarlatamab
      term:
        id: NCIT:C175858
        label: Tarlatamab
  evidence:
  - reference: PMID:38630789
    reference_title: "Facts and Hopes on Cancer Immunotherapy for Small Cell Lung Cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "delta-like ligand 3-targeted bispecific T-cell engagers have shown the most compelling preliminary evidence of clinical efficacy"
    explanation: "Immunotherapy review highlights DLL3-targeted bispecific T-cell engagers (tarlatamab) as the most clinically promising emerging immunotherapy for SCLC."
  - reference: PMID:37627044
    reference_title: "Small Cell Lung Cancer: Emerging Targets and Strategies for Precision Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The potential of targeting DLL3, a NOTCH ligand, through antibody-drug conjugates, bispecific T-cell engagers, and CAR T-cell therapy"
    explanation: "Precision-therapy review identifies DLL3 as a key SCLC surface target for bispecific T-cell engagers, ADCs, and CAR-T approaches."
- name: Benmelstobart plus Anlotinib with Chemotherapy
  description: >-
    First-line extensive-stage SCLC regimen adding the PD-L1 inhibitor
    benmelstobart and the multi-target anti-angiogenic small molecule anlotinib
    to etoposide/carboplatin (ETER701 trial). This immunochemotherapy plus
    anti-angiogenesis combination achieved a median overall survival of 19.3
    months, greater than in prior randomized ES-SCLC studies.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

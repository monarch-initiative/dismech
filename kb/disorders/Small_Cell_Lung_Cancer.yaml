name: Small Cell Lung Cancer
creation_date: '2026-01-26T02:55:13Z'
description: >-
  Small cell lung cancer (SCLC) is a highly aggressive neuroendocrine lung malignancy
  characterized by rapid growth, early metastasis, and initial chemosensitivity followed
  by near-universal relapse. SCLC accounts for approximately 13-15% of lung cancers and
  is strongly associated with tobacco smoking. Molecularly, SCLC is defined by near-universal
  inactivation of both TP53 and RB1 tumor suppressors, leading to loss of cell cycle
  checkpoints and genomic instability. Unlike NSCLC, SCLC lacks actionable driver mutations
  and is treated primarily with chemotherapy plus immunotherapy. Despite high initial
  response rates, long-term survival remains poor.
categories:
- Neuroendocrine Neoplasm
- Lung Cancer Subtype
- Solid Tumor
parents:
- lung neoplasm
has_subtypes:
- name: Limited-Stage SCLC
  description: >-
    Disease confined to one hemithorax that can be encompassed within a tolerable
    radiation field. Approximately 30% of SCLC presents as limited-stage. Treatment
    includes concurrent chemoradiation with potential for cure.
- name: Extensive-Stage SCLC
  description: >-
    Disease beyond a single hemithorax or with distant metastases. Approximately
    70% of SCLC presents as extensive-stage. Treated with chemotherapy plus
    immunotherapy; not curable but can achieve meaningful responses.
- name: SCLC-A (ASCL1-high)
  description: >-
    SCLC subtype defined by high ASCL1 expression. Associated with classic
    neuroendocrine phenotype and may respond differently to therapy.
- name: SCLC-N (NEUROD1-high)
  description: >-
    SCLC subtype defined by high NEUROD1 expression. Variant neuroendocrine
    phenotype.
- name: SCLC-P (POU2F3-high)
  description: >-
    SCLC subtype defined by high POU2F3 expression. Tuft cell-like phenotype,
    may lack classic neuroendocrine markers.
- name: SCLC-Y (YAP1-high)
  description: >-
    SCLC subtype with YAP1 activation. Non-neuroendocrine phenotype, may arise
    from epithelial-mesenchymal transition.
environmental:
- name: Tobacco Smoking
  description: >-
    Cigarette smoking is the dominant risk factor for SCLC, with a much stronger
    association than for lung adenocarcinoma. Tobacco carcinogens drive widespread
    genomic damage and contribute to TP53 and RB1 inactivation.
  evidence:
  - reference: PMID:8166467
    reference_title: "Overview on small cell lung cancer in the world: industrialized countries, Third World, eastern Europe."
    supports: SUPPORT
    snippet: "Cigarette smoking and occupational risk factors are more strongly associated with squamous and small cell lung cancers than with adenocarcinoma."
    explanation: "Supports the strong association between SCLC and cigarette smoking."
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
pathophysiology:
- name: TP53 Inactivation
  description: >-
    TP53 is inactivated in >90% of SCLC through mutations, deletions, or both.
    Loss of p53 function eliminates the G1/S checkpoint and apoptotic response
    to DNA damage, enabling survival despite genomic instability.
  evidence:
  - reference: PMID:36399634
    reference_title: "Retinoblastoma Expression and Targeting by CDK4/6 Inhibitors in Small Cell Lung Cancer."
    supports: PARTIAL
    snippet: 'The canonical model of "small cell lung cancer" (SCLC) depicts tumors arising from dual inactivation of TP53 and RB1.'
    explanation: "Abstract states the canonical model involves TP53 and RB1 inactivation."
  cell_types:
  - preferred_term: type II pneumocyte
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  biological_processes:
  - preferred_term: DNA damage response, signal transduction by p53 class mediator
    modifier: ABSENT
    term:
      id: GO:0030330
      label: DNA damage response, signal transduction by p53 class mediator
  downstream:
  - target: Loss of Cell Cycle Checkpoints
    description: Cells proliferate despite DNA damage
- name: RB1 Inactivation
  description: >-
    RB1 is inactivated in >90% of SCLC through mutations, deletions, or both.
    Loss of Rb function eliminates the G1/S checkpoint by releasing E2F
    transcription factors, enabling uncontrolled S-phase entry.
  evidence:
  - reference: PMID:36399634
    reference_title: "Retinoblastoma Expression and Targeting by CDK4/6 Inhibitors in Small Cell Lung Cancer."
    supports: PARTIAL
    snippet: 'The canonical model of "small cell lung cancer" (SCLC) depicts tumors arising from dual inactivation of TP53 and RB1.'
    explanation: "Abstract states the canonical model involves TP53 and RB1 inactivation."
  biological_processes:
  - preferred_term: negative regulation of G1/S transition of mitotic cell cycle
    modifier: ABSENT
    term:
      id: GO:2000134
      label: negative regulation of G1/S transition of mitotic cell cycle
  downstream:
  - target: Loss of Cell Cycle Checkpoints
    description: Uncontrolled cell cycle progression
- name: Loss of Cell Cycle Checkpoints
  conforms_to: "evading_growth_suppressors#Loss of Cell-Cycle Checkpoint Control"
  description: >-
    Combined TP53 and RB1 loss eliminates major cell cycle checkpoints. Cells
    proliferate rapidly without the normal restraints on replication. This
    explains the rapid doubling time and initial chemosensitivity (dividing
    cells are vulnerable to chemotherapy).
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:38473726
    reference_title: "P53 and Rb Aberrations in Small Cell Lung Cancer (SCLC): From Molecular Mechanisms to Therapeutic Modulation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "their broad tumor suppressive functions are eliminated and a normal cell is able to proliferate indefinitely, escape entering into cellular senescence, and evade death"
    explanation: "Mechanistic review of p53/RB aberrations in SCLC states that combined TP53/RB1 loss removes tumor-suppressive checkpoints, allowing indefinite proliferation and senescence/death escape."
  downstream:
  - target: Genomic Instability
    description: Accumulation of mutations and chromosomal alterations
- name: Genomic Instability
  conforms_to: "genome_instability_mutation#Mutator Phenotype and Chromosomal Instability"
  description: >-
    Loss of TP53 and RB1 leads to widespread genomic instability with frequent
    chromosomal gains and losses. Amplification of MYC family genes (MYC, MYCL,
    MYCN) occurs in ~20% of SCLC and is associated with worse prognosis.
  biological_processes:
  - preferred_term: DNA repair
    modifier: ABNORMAL
    term:
      id: GO:0006281
      label: DNA repair
  evidence:
  - reference: PMID:37329269
    reference_title: "Clinical insights into small cell lung cancer: Tumor heterogeneity, diagnosis, therapy, and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Genomic profiling of SCLC reveals genetic instability"
    explanation: "Comprehensive clinical review reports that genomic profiling of SCLC tumors demonstrates genetic instability (alongside near-universal TP53/RB1 loss and high mutation burden)."
- name: Neuroendocrine Differentiation
  description: >-
    SCLC cells exhibit neuroendocrine differentiation, expressing markers such
    as synaptophysin, chromogranin A, and CD56 (NCAM). Neuroendocrine phenotype
    is regulated by lineage transcription factors (ASCL1, NEUROD1). Some SCLC
    produces paraneoplastic hormones (ACTH, ADH).
  biological_processes:
  - preferred_term: neuron differentiation
    modifier: ABNORMAL
    term:
      id: GO:0030182
      label: neuron differentiation
  downstream:
  - target: Functional Neuron-SCLC Synapses
    description: >-
      The neuroendocrine/neuronal-like differentiation program enables SCLC
      cells to form functional synapses with neurons.
- name: Lineage Transcription Factor Subtypes and State Plasticity
  description: >-
    SCLC is a transcriptionally heterogeneous disease that is subclassified by
    lineage-defining transcription factors (ASCL1/SCLC-A, NEUROD1/SCLC-N,
    POU2F3/SCLC-P, YAP1/SCLC-Y) plus an inflamed subtype (SCLC-I). Subtype
    identity is largely epigenetically rather than mutationally determined:
    the SWI/SNF ATPase SMARCA4 binds ASCL1 and NEUROD1 loci to maintain the
    neuroendocrine program, and tumors show plasticity toward low-neuroendocrine
    states during progression or acquired chemoresistance.
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: ABNORMAL
    term:
      id: GO:0006338
      label: chromatin remodeling
  - preferred_term: neuron differentiation
    modifier: ABNORMAL
    term:
      id: GO:0030182
      label: neuron differentiation
  evidence:
  - reference: PMID:40333678
    reference_title: "Molecular Subtypes and Targeted Therapeutic Strategies in Small Cell Lung Cancer: Advances, Challenges, and Future Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "distinct molecular subtypes driven by lineage-defining transcription factors, including ASCL1, NEUROD1, POU2F3, and YAP1, as well as an inflamed subtype (SCLC-I)"
    explanation: "Multi-omic review establishes the transcription-factor-defined molecular subtypes of SCLC (ASCL1, NEUROD1, POU2F3, YAP1, and inflamed SCLC-I)."
  - reference: PMID:39080761
    reference_title: "SMARCA4 controls state plasticity in small cell lung cancer through regulation of neuroendocrine transcription factors and REST splicing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SMARCA4 binds to gene loci encoding NE-lineage transcription factors ASCL1 and NEUROD1 and alters chromatin accessibility, enhancing NE programs"
    explanation: "ChIPseq/ATACseq study in SCLC cell lines and PDXs shows SMARCA4 regulates chromatin accessibility at ASCL1/NEUROD1 loci, controlling neuroendocrine-state plasticity."
- name: Immune Evasion
  conforms_to: "immune_checkpoint_blockade#Adaptive Immune Resistance"
  description: >-
    SCLC employs multiple immune-evasive mechanisms that blunt the benefit of
    PD-1/PD-L1 checkpoint blockade, including T-cell exclusion (the "immune
    desert" phenotype of neuroendocrine-high tumors), downregulation of the
    MHC class I antigen processing and presentation machinery, and upregulation
    of macrophage inhibitory checkpoints.
  biological_processes:
  - preferred_term: antigen processing and presentation via MHC class I
    modifier: DECREASED
    term:
      id: GO:0002474
      label: antigen processing and presentation of peptide antigen via MHC class I
  - preferred_term: negative regulation of T cell mediated immunity
    modifier: INCREASED
    term:
      id: GO:0002710
      label: negative regulation of T cell mediated immunity
  evidence:
  - reference: PMID:38630789
    reference_title: "Facts and Hopes on Cancer Immunotherapy for Small Cell Lung Cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Several immune evasive mechanisms have been shown to be prominently altered in human SCLC, including T-cell exclusion, downregulation of components of the MHC class I antigen processing and presentation machinery"
    explanation: "Review of human SCLC immunobiology documents T-cell exclusion, MHC class I downregulation, and macrophage checkpoint upregulation as dominant immune-evasion mechanisms."
- name: Functional Neuron-SCLC Synapses
  description: >-
    SCLC cells can form functional synapses with neurons and receive synaptic
    transmission.
  biological_processes:
  - preferred_term: synapse assembly
    modifier: ABNORMAL
    term:
      id: GO:0007416
      label: synapse assembly
  - preferred_term: chemical synaptic transmission
    modifier: ABNORMAL
    term:
      id: GO:0007268
      label: chemical synaptic transmission
  evidence:
  - reference: PMID:40931078
    reference_title: "Functional synapses between neurons and small cell lung cancer."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that SCLC cells can form functional synapses and receive synaptic transmission."
    explanation: "In vitro neuron-SCLC co-culture reports functional synapses and synaptic transmission between neurons and SCLC cells."
  downstream:
  - target: Neuron-Driven Proliferation
    description: >-
      Synaptic input from neurons drives the pro-proliferative response of
      SCLC cells.
  - target: Glutamate Signaling Dependency
    description: >-
      Neuronal synaptic transmission engages glutamatergic signaling that the
      tumor becomes dependent on.
- name: Neuron-Driven Proliferation
  description: >-
    SCLC cells gain a proliferation advantage when co-cultured with neurons.
  biological_processes:
  - preferred_term: positive regulation of cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008284
      label: positive regulation of cell population proliferation
  evidence:
  - reference: PMID:40931078
    reference_title: "Functional synapses between neurons and small cell lung cancer."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we showed that SCLC cells derive a proliferation advantage when co-cultured with vagal sensory or cortical neurons."
    explanation: "In vitro co-culture with vagal sensory or cortical neurons provides a proliferation advantage to SCLC cells."
  downstream: []
- name: Glutamate Signaling Dependency
  description: >-
    Inhibition of glutamate signaling has therapeutic efficacy in SCLC models,
    implicating glutamatergic signaling in tumor growth.
  biological_processes:

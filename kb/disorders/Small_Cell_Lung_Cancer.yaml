name: Small Cell Lung Cancer
creation_date: '2026-01-26T02:55:13Z'
category: Complex
synonyms:
- SCLC
- small-cell lung cancer
- small cell lung carcinoma
- oat cell carcinoma
description: >-
  Small cell lung cancer (SCLC) is a highly aggressive neuroendocrine lung malignancy
  characterized by rapid growth, early metastasis, and initial chemosensitivity followed
  by near-universal relapse. SCLC accounts for approximately 13-15% of lung cancers and
  is strongly associated with tobacco smoking. Molecularly, SCLC is defined by near-universal
  inactivation of both TP53 and RB1 tumor suppressors, leading to loss of cell cycle
  checkpoints and genomic instability. Unlike NSCLC, SCLC lacks actionable driver mutations
  and is treated primarily with chemotherapy plus immunotherapy. Despite high initial
  response rates, long-term survival remains poor.
categories:
- Neuroendocrine Neoplasm
- Lung Cancer Subtype
- Solid Tumor
parents:
- lung neoplasm
stages:
- name: Limited-Stage SCLC
  description: >-
    Disease confined to one hemithorax that can be encompassed within a tolerable
    radiation field without malignant pleural or pericardial effusion. Approximately
    one-third of SCLC presents as limited-stage and is treated with concurrent
    thoracic chemoradiotherapy with curative intent.
  evidence:
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most patients have metastatic disease at diagnosis, with only one-third having earlier-stage disease that is amenable to potentially curative multimodality therapy."
    explanation: About one-third of patients present with earlier/limited-stage disease amenable to curative-intent multimodality therapy.
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Nonetheless, the VALSG staging system is still widely used in both designing clinical trials and presenting data from them, as it effectively distinguishes patients treated primarily with CRT (limited-stage disease) from those treated with systemic chemotherapy or chemo-immunotherapy (extensive-stage disease)."
    explanation: Defines limited-stage disease in the clinical VALSG staging system as disease treated primarily with concurrent chemoradiotherapy.
- name: Extensive-Stage SCLC
  description: >-
    Disease extending beyond a single hemithorax or radiation port, or presenting
    with distant metastases. Approximately two-thirds of SCLC presents as
    extensive-stage and is treated with systemic platinum-etoposide chemotherapy
    plus PD-L1 immune checkpoint blockade.
  evidence:
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Nonetheless, the VALSG staging system is still widely used in both designing clinical trials and presenting data from them, as it effectively distinguishes patients treated primarily with CRT (limited-stage disease) from those treated with systemic chemotherapy or chemo-immunotherapy (extensive-stage disease)."
    explanation: Defines extensive-stage disease as advanced/metastatic SCLC managed with systemic chemo-immunotherapy.
has_subtypes:
- name: SCLC-A
  display_name: SCLC-A (ASCL1-high)
  description: >-
    SCLC transcriptional subtype defined by high ASCL1 expression and classic
    neuroendocrine differentiation.
  evidence:
  - reference: PMID:40333678
    reference_title: "Molecular Subtypes and Targeted Therapeutic Strategies in Small Cell Lung Cancer: Advances, Challenges, and Future Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Historically considered a homogeneous disease, recent multi-omic studies have revealed distinct molecular subtypes driven by lineage-defining transcription factors, including ASCL1, NEUROD1, POU2F3, and YAP1, as well as an inflamed subtype (SCLC-I)."
    explanation: Establishes the ASCL1-driven transcriptional subtype of SCLC.
- name: SCLC-N
  display_name: SCLC-N (NEUROD1-high)
  description: >-
    SCLC transcriptional subtype defined by high NEUROD1 expression with a
    variant neuroendocrine phenotype.
  evidence:
  - reference: PMID:40333678
    reference_title: "Molecular Subtypes and Targeted Therapeutic Strategies in Small Cell Lung Cancer: Advances, Challenges, and Future Perspectives."

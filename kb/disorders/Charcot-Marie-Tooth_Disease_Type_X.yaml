name: Charcot-Marie-Tooth Disease Type X
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: "Charcot-Marie-Tooth disease type X (CMTX) comprises the X-linked inherited motor and sensory neuropathies. The predominant subtype, CMTX1, is caused by pathogenic GJB1 variants affecting connexin-32 in myelinating Schwann cells. Most peripheral neuropathy alleles impair normal Cx32 function through defective expression, trafficking, or channel properties. The downstream glial and axonal injury mechanisms are incompletely resolved: radial diffusion of small dyes persists in Gjb1-null mouse myelin, and early axonal abnormalities need not follow overt demyelination. Typical manifestations include distal weakness and wasting, sensory loss, depressed reflexes and foot deformity. Males generally have earlier, more severe disease; heterozygous females vary widely and can progress. CMTX1 can also involve the CNS, including fixed signs and self-limited stroke-like episodes. The molecular basis of CNS involvement may differ from the peripheral loss-of-function mechanism.\n\nThe rarer subtypes have distinct initiating lesions: a noncoding interchromosomal insertion in CMTX3, altered AIFM1 redox and apoptotic function in CMTX4, deficient PRPS1 enzyme activity in CMTX5, and hyperactive\
  \ PDK3 in CMTX6. CMTX2 remains a linkage-defined entity without an established causal gene. AIFM1-associated deafness and intellectual disability and PRPS1-associated prelingual hearing loss and optic neuropathy distinguish syndromic forms; hearing impairment can also occur in CMTX1. Subtype-specific findings should not be generalized to all CMTX."
disease_term:
  preferred_term: X-linked Charcot-Marie-Tooth disease (CMTX)
  term:
    id: MONDO:0018994
    label: Charcot-Marie-Tooth disease type X
parents:
- Charcot-Marie-Tooth disease
synonyms:
- X-linked hereditary motor and sensory neuropathy
- CMTX
- X-linked Charcot-Marie-Tooth disease
notes: "Scope note. This entry is the X-linked compartment of CMT, curated in parallel with the existing kb/disorders/Charcot-Marie-Tooth_Disease_Type_1.yaml, _Type_2.yaml and _Type_4.yaml entries, each of which is likewise a multi-gene compartment carried as one Disease with per-locus has_subtypes. Two CMTX loci already have their own dedicated entries and are cross-referenced rather than duplicated here: CMTX4 / Cowchock syndrome (kb/disorders/Charcot-Marie-Tooth_Disease_X-linked_Recessive_4.yaml) and CMTX5, which is covered by kb/disorders/PRPS1_Deficiency_Spectrum.yaml as part of the wider PRPS1 allelic series. The subtype entries below carry the CMTX-relevant claim and its citation only.\nCMTX2 (MONDO:0010550) and CMTX3 (MONDO:0010551) are retained as subtypes for MONDO completeness, but their evidence base is thin and asymmetric: CMTX3 has a molecularly defined lesion, while CMTX2 rests on old linkage reports with no confirmed gene. That asymmetry is recorded in each subtype's description rather than smoothed over.\n\nClinical quantitative estimates in this entry are subtype- and cohort-specific. A general CMT prevalence of 1 in 2,500 is not used as a population prevalence for\
  \ CMTX. The compartment includes several distinct molecular diseases; dedicated AIFM1 and PRPS1 entries contain fuller allelic-spectrum detail."
has_subtypes:
- name: CMTX1
  display_name: CMTX1 (GJB1 / connexin-32-related)
  subtype_term:
    preferred_term: Charcot-Marie-Tooth disease X-linked dominant 1
    term:
      id: MONDO:0010549
      label: Charcot-Marie-Tooth disease X-linked dominant 1
  description: >-
    GJB1-related intermediate motor and sensory neuropathy, usually more severe in males than females.
    Pathogenic coding and noncoding variants impair Cx32 expression, trafficking or channel function.
    Loss of normal function explains much of the peripheral phenotype, but some CNS-associated alleles
    may have additional toxic effects. Females can have progressive disease. This subtype is the principal
    clinical focus of the entry.
  evidence:
  - reference: PMID:8266101
    reference_title: "Connexin mutations in X-linked Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing of the connexin32 gene showed seven different mutations in affected persons from eight CMTX families."
    explanation: Establishes GJB1 / connexin-32 variants as the molecular cause of CMTX1.
  - reference: PMID:17353473
    reference_title: "CMT1X phenotypes represent loss of GJB1 gene function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, these data suggest that most GJB1 mutations cause neuropathy by a loss of normal connexin 32 function."
    explanation: >-
      Supports loss of function, rather than a gain-of-function mechanism, as the
      basis of the CMTX1 phenotype across 28 different GJB1 variants.
  genes: &id001
  - preferred_term: GJB1
    term:
      id: hgnc:4283
      label: GJB1
- name: CMTX2
  display_name: CMTX2 (X-linked recessive, gene unconfirmed)
  description: >-
    An X-linked recessive CMT locus mapped by linkage to Xp22.2 in a single
    family with infantile onset and intellectual disability in two of five
    affected individuals. No causal gene has been confirmed, and the entity is
    defined by linkage rather than by a molecular lesion. Retained here for MONDO
    completeness; it should not be treated as having an established mechanism.
  evidence:
  - reference: PMID:1557086
    reference_title: >-
      X-linked recessive Charcot-Marie-Tooth neuropathy: clinical and genetic
      study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A maximum lod score of +3.48 was obtained by multipoint linkage analysis
      for the DXS16 locus mapped at Xp22.2 in family 1.
    explanation: >-
      The linkage result that places this locus at Xp22.2, and the source of the
      band given in the description.
  - reference: PMID:1674639
    reference_title: >-
      Heterogeneity in X-linked recessive Charcot-Marie-Tooth neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease phenotype in family 1 was typical of CMT type 1, except for an
      infantile onset; two of five affected individuals were mentally retarded,
      and obligate-carrier females were unaffected.
    explanation: >-
      The clinical description of the mapped family, which is the source of the
      early-onset and intellectual-disability features given in this row.
  subtype_term:
    preferred_term: Charcot-Marie-Tooth disease X-linked recessive 2
    term:
      id: MONDO:0010550
      label: Charcot-Marie-Tooth disease X-linked recessive 2
- name: CMTX3
  display_name: CMTX3 (Xq27.1 interchromosomal insertion)
  description: >-
    A founder 77,856-bp insertion from chromosome 8q24.3 into intergenic Xq27.1 segregated with neuropathy
    in related families. It contains ARHGAP39 exons 1-7, but neuronal studies did not find a disease-specific
    fusion transcript or ARHGAP39 overexpression. A 2026 patient-derived iPSC study prioritizes SOX3:
    RNA and protein were reduced during early neural differentiation, while FGF13 changes previously observed
    in lymphoblasts were not consistently reproduced. SOX3 causality remains unproven without functional
    perturbation or rescue. Males had childhood-onset intermediate neuropathy; carrier females could have
    subtle signs. Earlier linkage-defined families are not all molecularly equivalent: one was subsequently
    found to carry a BSCL2 variant.
  evidence:
  - reference: PMID:27438001
    reference_title: "Whole Genome Sequencing Identifies a 78 kb Insertion from Chromosome 8 as the Cause of Charcot-Marie-Tooth Neuropathy CMTX3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 78 kb insertion originates from chromosome 8q24.3, segregates fully with the disease in the two families, and is absent from the general population"
    explanation: Establishes a non-coding interchromosomal insertion as the CMTX3 lesion.
  - reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC13563502/
    reference_title: The Charcot–Marie–Tooth Neuropathy (CMTX3) Complex Structural Variation Causes Differential SOX3 Spatiotemporal Expression
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Collectively, these findings prioritize SOX3 as the leading candidate gene underlying CMTX3 neuropathy.
    explanation: >-
      SOX3 is prioritized by patient-derived cell experiments; this is a candidate attribution, not a
      proven gene-level cause.
  subtype_term:
    preferred_term: Charcot-Marie-Tooth disease X-linked recessive 3
    term:
      id: MONDO:0010551
      label: Charcot-Marie-Tooth disease X-linked recessive 3

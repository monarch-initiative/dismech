    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Increased FGF13 RNA in CMTX3 Lymphoblasts
  biological_scale: CELLULAR
  description: >-
    One CMTX3 patient lymphoblast line showed approximately threefold increased FGF13 RNA relative to
    controls. ARHGAP39 expression was unchanged and SOX3 was undetectable in patient and control lymphoblasts.
    FGF13 dysregulation could be a bystander effect; neither neuronal replication nor a causal FGF13-neuropathy
    link was established. No ectopic-expression category or causal-gene assignment is inferred. A 2026
    study found no consistent FGF13 expression differences across patient-derived iPSC-to-spinal-motor-neuron
    differentiation, weakening extrapolation of the lymphoblast finding to the neural mechanism.
  evidence:
  - reference: PMID:27438001
    reference_title: Whole Genome Sequencing Identifies a 78 kb Insertion from Chromosome 8 as the Cause of Charcot-Marie-Tooth Neuropathy CMTX3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We observed a 3-fold increase in expression in lymphoblast cells from the CMTX3 patient
    explanation: >-

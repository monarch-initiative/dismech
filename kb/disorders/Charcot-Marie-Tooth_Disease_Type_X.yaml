progression:
- phase: Typical CMTX1 onset in males
  age_range: 5-25 years
  notes: >-
    GJB1-related neuropathy typically manifests in males between five and 25 years, with earlier and later
    exceptions. Females have variable onset and may remain minimally symptomatic or develop progressive
    disease. This interval is not assigned to every CMTX subtype.
  evidence:
  - reference: PMID:20301548
    reference_title: "GJB1 Disorders: Charcot-Marie-Tooth Neuropathy (CMT1X) and Central Nervous System Phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Peripheral neuropathy typically manifests in affected males between ages five and 25 years."
    explanation: Establishes the typical window of clinical onset in hemizygous males.
- phase: Slow progression in both sexes with CMTX1
  notes: >-
    The prospective 2023 GJB1 cohort showed increasing CMTES over follow-up in both sexes. Rates did not
    differ significantly between males and females over eight years, although cross-sectional age associations
    suggested slower lifetime progression in females. At three years the mean CMTES change was 1.3 ± 2.6;
    mildly affected patients had greater responsiveness of the score. These are cohort outcome-measure
    results, not fixed individual trajectories. Earlier cross-sectional absence of a female age correlation
    did not establish nonprogression.
  evidence:
  - reference: PMID:37284795
    reference_title: Genetic analysis and natural history of Charcot-Marie-Tooth disease CMTX1 due to GJB1 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Males and females progressed similarly up to 8 years, but baseline regression analysis suggested that over a longer period, females progress more slowly.
    explanation: >-
      Longitudinal results correct the inference of no female progression.
  - reference: PMID:37284795
    reference_title: Genetic analysis and natural history of Charcot-Marie-Tooth disease CMTX1 due to GJB1 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Progression was most pronounced for mild phenotypes (CMTES = 0-7; 3-year ΔCMTES = 2.3 ± 2.5, P = 0.001, SRM = 0.90).
    explanation: >-
      Responsiveness varies with baseline severity; CMTES is not equally sensitive across all patients.
diagnosis:
- name: Intermediate Conduction Velocity with Absent Male-to-Male Transmission
  description: >-
    Intermediate upper-limb motor conduction velocities, a compatible neuropathy phenotype and an X-linked
    pedigree can prompt GJB1 testing. Absence of male-to-male transmission alone does not prove X-linked
    inheritance, and a negative family history does not exclude CMTX1. Molecular testing confirms the
    diagnosis.
  evidence:
  - reference: PMID:15468313
    reference_title: "X-linked Charcot-Marie-Tooth disease: phenotypic expression of a novel mutation Ile127Ser in the GJB1 (connexin 32) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients having the CMT phenotype and intermediate conduction velocities who are negative for CMT1A duplication/hereditary neuropathy with liability to pressure palsies (HNPP) deletion, and whose family shows a dominant trait without male-to-male transmission, should be screened for CMTX1."
    explanation: States the electrophysiological and pedigree criteria that should prompt GJB1 testing.
- name: Molecular Confirmation of GJB1-related Disease
  description: >-
    A hemizygous pathogenic or likely pathogenic GJB1 variant in a male or heterozygous pathogenic or
    likely pathogenic variant in a female establishes the molecular diagnosis in the appropriate clinical
    setting. A VUS alone does not establish or exclude the diagnosis. Interpret variants using segregation,
    phenotype, population and functional evidence rather than resemblance to a cohort alone.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1374/
    reference_title: "GJB1 Disorders: Charcot-Marie-Tooth Neuropathy (CMT1X) and Central Nervous System Phenotypes"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of CMT1X is established in a male by identification of a hemizygous GJB1 pathogenic variant on molecular genetic testing and in a female by identification of a heterozygous GJB1 pathogenic variant.
    explanation: >-
      Primary molecular confirmation criteria.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1374/
    reference_title: "GJB1 Disorders: Charcot-Marie-Tooth Neuropathy (CMT1X) and Central Nervous System Phenotypes"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Identification of a hemizygous or heterozygous GJB1 variant of uncertain significance does not establish or rule out the diagnosis.
    explanation: >-
      Preserves the limit of a VUS result.
- name: Noncoding and Copy-number Coverage in Genetic Testing
  description: >-
    GJB1 analysis should include its relevant upstream regulatory region, 5-prime UTR, noncoding exons
    and splice sites, and 3-prime UTR. Consider deletion/duplication analysis after unrevealing sequence
    analysis and a neuropathy panel or broader genomic testing where appropriate. Exome sequencing alone
    can miss noncoding lesions; the CMTX3 interchromosomal insertion was identified using whole-genome
    sequencing after coding variants were excluded.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1374/
    reference_title: "GJB1 Disorders: Charcot-Marie-Tooth Neuropathy (CMT1X) and Central Nervous System Phenotypes"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Disease-causing variants have been reported in the upstream regulatory region, 5'UTR, noncoding exons and splice sites, and 3'UTR
    explanation: >-
      Identifies regions that coding-only testing may miss.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1374/
    reference_title: "GJB1 Disorders: Charcot-Marie-Tooth Neuropathy (CMT1X) and Central Nervous System Phenotypes"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If no pathogenic variant is found, gene-targeted deletion/duplication analysis is performed to detect intragenic deletions or duplications.
    explanation: >-
      Documents copy-number testing after unrevealing sequencing.
  - reference: PMID:27438001
    reference_title: Whole Genome Sequencing Identifies a 78 kb Insertion from Chromosome 8 as the Cause of Charcot-Marie-Tooth Neuropathy CMTX3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using whole genome sequencing we found a large DNA interchromosomal insertion within the CMTX3 locus.
    explanation: >-
      Concrete example of structural-variant diagnosis beyond coding sequence.
animal_models:
- name: Gjb1-null mouse
  species: Mouse
  genotype: 'Gjb1-null: hemizygous males or homozygous females'
  description: >-
    Gjb1-null mice model loss of Cx32 and develop predominantly motor demyelinating neuropathy with axonal
    abnormalities. They are informative for peripheral loss of function but do not reproduce every human
    variant, female mosaic pattern or CNS phenotype. Early axonal dysfunction can occur before overt demyelination;
    this is not a direct demonstration of the sequence in patients.
  publication: PMID:20720503
  modeled_mechanisms:
  - target: Impaired Axonal Transport in Gjb1-null Mice
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Early axonal changes are directly measured in the knockout mouse.
    limitations: The temporal ordering and glia-to-axon intermediates remain unestablished in humans.
    readouts:
    - name: Fast axonal transport
      target: Impaired Axonal Transport in Gjb1-null Mice
      direction: DECREASED
      interpretation: Reduced distal accumulation of transported proteins after sciatic-nerve ligation; an experimental transport readout.
      evidence:
      - reference: PMID:20720503
        reference_title: Axonal pathology precedes demyelination in a mouse model of X-linked demyelinating/type I Charcot-Marie Tooth neuropathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: fast axonal transport, assayed by sciatic nerve ligation experiments, was slower in distal axons of Gjb1-null versus wild-type animals
        explanation: >-
          Functional transport measurement in the knockout model.
  - target: Cx32 Loss of Function in Schwann Cells
    relationship: RECAPITULATES
    fidelity: HIGH
    description: The null allele models absence of Cx32, a subset of the human molecular spectrum.
    limitations: Does not model all mutant-channel behavior or variant-specific CNS effects.
  - target: Peripheral Myelin Abnormalities in CMTX1
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Models abnormal peripheral myelination and responsiveness to Schwann-cell GJB1 replacement.
    readouts:
    - name: Sciatic motor nerve conduction velocity
      target: Peripheral Myelin Abnormalities in CMTX1
      direction: DECREASED
      interpretation: Conduction slowing accompanies the knockout peripheral neuropathy.
      evidence:
      - reference: PMID:33692503
        reference_title: AAV9-mediated Schwann cell-targeted gene therapy rescues a model of demyelinating neuropathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Gjb1-null mice with deletion of the Gjb1/Cx32 gene develop a progressive, predominantly motor demyelinating peripheral neuropathy beginning at about three months of age with reduced sciatic motor nerve conduction velocity (MNCV) and motor amplitude
        explanation: >-
          Model characteristics summarized in the preclinical therapy paper.
  - target: Peripheral Axonal Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Peripheral axonal injury can be monitored with experimental blood biomarkers.
    limitations: Treatment-responsive biomarkers in mice are not validated human efficacy surrogates.
    readouts:
    - name: Plasma neurofilament light after GJB1 replacement
      target: Peripheral Axonal Degeneration
      direction: DECREASED
      interpretation: Lower plasma NF-L in treated versus mock-treated knockout mice; not a human diagnostic threshold.
      evidence:
      - reference: PMID:33692503
        reference_title: AAV9-mediated Schwann cell-targeted gene therapy rescues a model of demyelinating neuropathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: NF-L levels were significantly ameliorated in Gjb1-null mice treated post-onset at the age of 6 months
        explanation: >-
          Preclinical biomarker response in the post-onset treatment experiment.
  - target: Reduced Axon Caliber in Gjb1-null Mice
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Models early changes in axon caliber, not early axonal loss.
    readouts:
    - name: Large myelinated axon diameter
      target: Reduced Axon Caliber in Gjb1-null Mice
      direction: DECREASED
      interpretation: Caliber reduction at early ages, without a significant reduction in total axon number.
      evidence:
      - reference: PMID:20720503
        reference_title: Axonal pathology precedes demyelination in a mouse model of X-linked demyelinating/type I Charcot-Marie Tooth neuropathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: The diameters of large myelinated axons were progressively reduced in Gjb1-null mice compared with those in wild-type littermates.
        explanation: >-
          Morphological readout distinct from axonal loss.
discussions:
- discussion_id: cmtx1_axon_vs_myelin_ordering
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Peripheral Myelin Abnormalities in CMTX1
  - pathophysiology#Impaired Axonal Transport in Gjb1-null Mice
  prompt: >-
    How does Schwann-cell Cx32 dysfunction injure axons, and what is the temporal relationship to myelin
    injury in human CMTX1?
  rationale: >-
    Gjb1-null mice show early axonal transport and cytoskeletal changes with little demyelination. A human
    family study interpreted electrophysiology as primary demyelination with secondary axonal loss. Different
    measurements and sampling stages do not establish opposing causal mechanisms or a proven species mismatch.
    The mouse result does not show that axonal injury causes demyelination, nor that clinical conduction
    slowing identifies the first biological event in patients.
  evidence:
  - reference: PMID:20720503
    reference_title: "Axonal pathology precedes demyelination in a mouse model of X-linked demyelinating/type I Charcot-Marie Tooth neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we studied Gjb1-null mice at early stages (i.e. 2-4 months old) of the neuropathy, when there is minimal or no demyelination"
    explanation: Establishes that the mouse axonal findings were made before demyelination was detectable.
  - reference: PMID:15468313
    reference_title: "X-linked Charcot-Marie-Tooth disease: phenotypic expression of a novel mutation Ile127Ser in the GJB1 (connexin 32) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The electrophysiological findings were consistent with a primary demyelinating neuropathy with secondary axonal loss and support this model of disease progression."
    explanation: >-
      A human electrophysiological interpretation that does not directly establish the sequence of microscopic
      injury.
- discussion_id: cmtx_cns_inflammatory_demyelination
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cx32 Dysfunction in Oligodendrocytes
  prompt: >-
    Does GJB1 loss predispose to inflammatory CNS demyelination (multiple
    sclerosis), and if so by what mechanism?
  rationale: >-
    Three MS cases occurred in a single-centre cohort of 70 GJB1 patients followed over 20 years. The
    reported incidence comparison with historical background rates is an association signal with small
    numbers, not proof that GJB1 causes inflammatory demyelination. Ascertainment, comparator and diagnostic
    overlap limit causal interpretation; replication and a mechanism remain lacking.
  evidence:
  - reference: PMID:30196252
    reference_title: "X linked Charcot-Marie-Tooth disease and multiple sclerosis: emerging evidence for an association."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The resulting 20-year MS incidence (4.3%) differed significantly from the highest background 20-year MS incidence ever reported from Greece (p=0.00039)"
    explanation: >-
      A single-center incidence comparison showing statistical difference from
      background MS rates. Support is indirect: the finding is consistent with
      an association hypothesis but does not establish causality or exclude
      confounding factors specific to the study population.
- discussion_id: cmtx1_radial_diffusion
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cx32 Loss of Function in Schwann Cells
  prompt: Which Cx32-specific functions are necessary for peripheral nerve maintenance despite preserved radial dye diffusion in knockout myelin?
  rationale: >-
    In teased mouse nerves, small dyes reached the adaxonal Schwann-cell cytoplasm even without Cx32,
    with no significant difference in the estimated diffusion rate. This argues against abolition of all
    radial communication. Cx32-specific permeability or signaling remains possible. The millionfold radial
    advantage discussed in the paper is a geometric diffusion-time estimate, not a measured dye-transport
    ratio.
  evidence:
  - reference: PMID:9722620
    reference_title: Functional gap junctions in the schwann cell myelin sheath.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The radial diffusion of low molecular weight dyes across the myelin sheath was not interrupted in myelinating Schwann cells from cx32-null mice, indicating that other connexins participate in forming gap junctions in these cells.
    explanation: >-
      Ex vivo teased-nerve dye transfer limits the complete-radial-blockade account; it does not identify
      the compensating connexin.

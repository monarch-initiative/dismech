    reference_title: Genetic analysis and natural history of Charcot-Marie-Tooth disease CMTX1 due to GJB1 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We classified 109 (70.8%) variants as pathogenic from 244 (82.7%) families, 42 (27.3%) as VUS from 48 (16.3%) families, and three (1.9%) variants as benign from three (1.0%) families in our cohort.

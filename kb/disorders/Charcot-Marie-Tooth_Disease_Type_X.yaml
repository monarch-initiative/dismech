    term:
      id: GO:0003954
      label: NADH dehydrogenase activity
- name: Increased Caspase-independent Apoptotic Susceptibility
  biological_scale: CELLULAR
  description: >-
    In the founding CMTX4 study, patient muscle contained increased TUNEL-positive nuclei and nuclear
    AIF. Cultured patient fibroblasts retained substantial staurosporine-induced nuclear abnormalities
    despite caspase inhibition. These findings support enhanced caspase-independent apoptotic susceptibility,
    but neuronal cell death was not directly assayed.
  evidence:
  - reference: PMID:23217327
    reference_title: Cowchock syndrome is associated with a mutation in apoptosis-inducing factor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Numerous apoptotic cells were present in the sample from the affected individual, whereas little to no staining was detected in healthy control muscle
    explanation: >-
      Patient muscle TUNEL staining supplies tissue-level evidence.
  - reference: PMID:23217327
    reference_title: Cowchock syndrome is associated with a mutation in apoptosis-inducing factor.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the staurosporine-induced nuclear abnormalities dropped to less than 10% in control fibroblasts, but remained as high as 50% in p.Glu493Val AIF mutant cells
    explanation: >-
      Cultured fibroblast stress assay after caspase inhibition; distinct from the muscle biopsy.
  subtypes:
  - CMTX4
  biological_processes:

environmental:
- name: Systemic stressors preceding transient CNS episodes in CMTX1
  notes: >-
    Fever, infection, exertion and altitude-related changes have preceded some CMTX1 CNS episodes. Pollen
    exposure preceded one reported episode; an allergic mechanism was unproven because acute allergy biomarkers
    were unavailable. These are possible precipitants of a genetic disorder, not causes of CMTX. No single
    exposure ontology term is used for this heterogeneous set.
  influences_mechanisms:
  - target: Transient Stroke-like CNS Episodes
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported stressors temporally precede some CNS episodes; the link is indirect and the cellular intermediates
      remain unknown. The pollen observation does not establish an allergic causal mechanism.
    evidence:
    - reference: PMID:42477620
      reference_title: "Pediatric stroke-like episodes temporally associated with pollen exposure in GJB1-related CMTX1: an expanded family case report with serial MRI and DTI follow-up."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Triggers such as fever, infection and exercise have been reported, but allergy-related exposure has rarely been discussed and causal mechanisms remain uncertain."
      explanation: >-
        Names fever, infection and exercise as reported precipitants of the CNS
        episodes while stating that allergy-related exposure has rarely been
        discussed and causal mechanisms remain uncertain. Support is indirect: a
        reported temporal association, not established causation.
  evidence:
  - reference: PMID:42477620
    reference_title: "Pediatric stroke-like episodes temporally associated with pollen exposure in GJB1-related CMTX1: an expanded family case report with serial MRI and DTI follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pollen exposure was temporally associated with the episode in this patient, but an allergic mechanism remains unproven"
    explanation: >-
      A single paediatric case with an explicit statement that the mechanism is
      unproven - recorded as a temporal association, not an established cause.
  - reference: PMID:30952033
    reference_title: "Novel gap junction protein beta-1 gene mutation associated with a stroke-like syndrome and central nervous system involvement in patients with X-linked Charcot-Marie-Tooth Type 1: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our patient had a transient stroke-like clinical manifestations and magnetic resonance imaging (MRI) changes."
    explanation: Corroborating case of transient stroke-like episodes with imaging change in CMTX1.

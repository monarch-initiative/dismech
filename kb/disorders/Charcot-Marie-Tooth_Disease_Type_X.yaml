      interpretation: Functional consequence of Cx32 loss in Schwann cells.
      evidence:
      - reference: PMID:33692503
        reference_title: "AAV9-mediated Schwann cell-targeted gene therapy rescues a model of demyelinating neuropathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Gjb1-null mice with deletion of the Gjb1/Cx32 gene develop a progressive, predominantly motor demyelinating peripheral neuropathy beginning at about three months of age with reduced sciatic motor nerve conduction velocity (MNCV) and motor amplitude"
        explanation: Reports the conduction-velocity phenotype of the null model.
discussions:
- discussion_id: cmtx1_axon_vs_myelin_ordering
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Demyelination with Secondary Axonal Loss
  prompt: >-
    Does axonal pathology in CMTX1 precede demyelination in humans, as it does
    in the Gjb1-null mouse, or is the human disease genuinely primary
    demyelination with secondary axonal loss?
  rationale: >-
    The two evidence streams point opposite ways, and the difference is
    mechanistically load-bearing rather than semantic. In Gjb1-null mice at 2-4
    months, when there is minimal or no demyelination, axon diameters are already
    reduced, neurofilaments are dephosphorylated and densely packed, beta-amyloid
    precursor protein is elevated, and fast axonal transport is slowed - so the
    axon is affected first, and the authors conclude Cx32 loss affects axons
    independently of demyelination. Human nerve conduction studies in CMTX1
    families are instead read as primary demyelination with secondary axonal
    loss. Both readings cannot be the mechanism. The discrepancy may be real
    species divergence, or it may be a detection-sensitivity artefact: mouse
    histology and axonal-transport assays interrogate the axon far more
    sensitively than clinical nerve conduction studies can, so human axonal
    involvement could simply be invisible at the stage where conduction slowing
    is first measured. Resolving it matters for therapy timing - if axonal injury
    is upstream, a myelin-directed intervention delivered after conduction
    slowing appears is already late. Note the two are not fully independent
    claims: human electrophysiology in CMTX1 is itself described as showing less
    demyelination and more axonal loss than other CMT1 subtypes, which leans
    toward the mouse.
  evidence:
  - reference: PMID:20720503
    reference_title: "Axonal pathology precedes demyelination in a mouse model of X-linked demyelinating/type I Charcot-Marie-Tooth neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we studied Gjb1-null mice at early stages (i.e. 2-4 months old) of the neuropathy, when there is minimal or no demyelination"
    explanation: Establishes that the mouse axonal findings were made before demyelination was detectable.
  - reference: PMID:15468313
    reference_title: "X-linked Charcot-Marie-Tooth disease: phenotypic expression of a novel mutation Ile127Ser in the GJB1 (connexin 32) gene."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The electrophysiological findings were consistent with a primary demyelinating neuropathy with secondary axonal loss and support this model of disease progression."
    explanation: >-
      The human electrophysiological reading that the mouse result sits against,
      and the basis for this entry's node naming.
- discussion_id: cmtx_cns_inflammatory_demyelination
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Oligodendrocyte Connexin-32 Loss and Transient CNS Dysfunction
  prompt: >-
    Does GJB1 loss predispose to inflammatory CNS demyelination (multiple
    sclerosis), and if so by what mechanism?
  rationale: >-
    A single-centre cohort of 70 GJB1 patients followed over 20 years found a
    20-year MS incidence of 4.3%, significantly above the highest background
    incidence reported for the same country, together with an excess of
    corpus-callosum splenium hyperintensity on brain MRI in CMTX patients
    without CNS symptoms. No CNS-reactive humoral factor was identified, so a
    mechanism linking oligodendrocyte Cx32 loss to inflammatory demyelination is
    not established. The finding is single-centre and the absolute numbers are
    small (three patients), so it is recorded as an open question rather than as
    a comorbidity claim. The alternative reading - that Cx32-deficient white
    matter is simply more likely to produce lesions that meet MS imaging
    criteria - has not been excluded.
  evidence:
  - reference: PMID:30196252
    reference_title: "X linked Charcot-Marie-Tooth disease and multiple sclerosis: emerging evidence for an association."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The resulting 20-year MS incidence (4.3%) differed significantly from the highest background 20-year MS incidence ever reported from Greece (p=0.00039)"
    explanation: >-
      The incidence comparison behind the proposed association. Graded PARTIAL
      because three cases in one centre supports an association hypothesis
      without establishing it.

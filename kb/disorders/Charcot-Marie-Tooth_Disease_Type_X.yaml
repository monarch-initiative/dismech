    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  downstream:
  - target: Peripheral Axonal Degeneration
    description: >-
      Increased apoptotic susceptibility is proposed to contribute to the axonal neuropathy; extrapolation
      from muscle and fibroblasts to nerve is indirect.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intellectual Disability
    description: >-
      Cognitive impairment accompanies the AIFM1 syndrome, but the mechanism is inferred from non-neural

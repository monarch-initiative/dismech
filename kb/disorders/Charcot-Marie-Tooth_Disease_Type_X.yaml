animal_models:
- name: Gjb1-null mouse
  species: Mouse
  genotype: Gjb1 (Cx32) knockout, homozygous null
  description: >-
    The principal CMTX1 model. Gjb1-null mice develop a progressive,
    predominantly motor demyelinating peripheral neuropathy from about three
    months of age, with reduced sciatic motor nerve conduction velocity. Because
    loss of function is the human mechanism, a null allele is the mechanistically
    appropriate model rather than an approximation.
  publication: PMID:20720503
  modeled_mechanisms:
  - target: Demyelination with Secondary Axonal Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the demyelinating neuropathy, but on a different internal
      ordering than the human electrophysiological picture implies: axonal
      abnormalities appear before demyelination is detectable.
    limitations: >-
      The temporal sequence differs from the conventional human model of the
      disease. Human electrophysiology is read as primary demyelination with
      secondary axonal loss, whereas in this mouse the axonal changes come
      first. Whether that reflects a real species difference, or a sensitivity
      difference between mouse histology and human nerve conduction studies, is
      unresolved - see the HUMAN_MODEL_MISMATCH discussion.
    readouts:
    - name: Large myelinated axon diameter
      target: Demyelination with Secondary Axonal Loss
      direction: DECREASED
      interpretation: Structural axonal correlate, present before demyelination.
      evidence:
      - reference: PMID:20720503
        reference_title: "Axonal pathology precedes demyelination in a mouse model of X-linked demyelinating/type I Charcot-Marie-Tooth neuropathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The diameters of large myelinated axons were progressively reduced in Gjb1-null mice compared with those in wild-type littermates."
        explanation: Reports the axon-diameter measurement behind this readout.
    - name: Fast axonal transport rate
      target: Demyelination with Secondary Axonal Loss
      direction: DECREASED
      interpretation: >-
        Functional axonal deficit at an age with minimal demyelination, linking
        Schwann-cell Cx32 loss to axonal dysfunction directly.
      evidence:
      - reference: PMID:20720503
        reference_title: "Axonal pathology precedes demyelination in a mouse model of X-linked demyelinating/type I Charcot-Marie-Tooth neuropathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "fast axonal transport, assayed by sciatic nerve ligation experiments, was slower in distal axons of Gjb1-null versus wild-type animals"
        explanation: Reports the axonal transport measurement behind this readout.
    evidence:
    - reference: PMID:20720503
      reference_title: "Axonal pathology precedes demyelination in a mouse model of X-linked demyelinating/type I Charcot-Marie-Tooth neuropathy."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "These findings demonstrate that axonal abnormalities including impaired cytoskeletal organization and defects in axonal transport precede demyelination in this mouse model of CMT1X."
      explanation: >-
        Supports the model as informative for this node while establishing the

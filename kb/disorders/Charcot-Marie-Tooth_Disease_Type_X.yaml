  biological_scale: ORGANISM
  description: >-
    Distal motor and sensory nerve dysfunction produces progressive weakness and wasting, sensory loss
    and reduced reflexes. Foot drop and foot deformity impair gait. In CMTX1, upper-limb involvement may
    be disproportionately prominent in median-innervated muscles, so length dependence does not explain
    every feature. Onset and severity vary by subtype and sex.

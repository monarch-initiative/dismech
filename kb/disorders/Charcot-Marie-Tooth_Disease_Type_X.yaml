genetic:
- name: GJB1
  notes: >-
    GJB1 encodes connexin-32. Pathogenic alleles include missense, nonsense, frameshift, splice and regulatory
    variants and whole-coding-region deletions. The 2023 study analyzed 387 patients with 154 GJB1 variants:
    319 patients (82.4%) carried variants classified as pathogenic or likely pathogenic, whereas 109 of
    the 154 distinct variants (70.8%) received those classifications. The c.-17G>A 5-prime UTR variant
    had the most severe phenotype among the five most common variants studied; some intracellular-domain
    missense variants were milder. These findings do not imply that all missense alleles have the same
    channel defect or that clinical resemblance alone establishes pathogenicity of a VUS. The P2-promoted
    NM_000166 transcript and its regulatory regions are relevant to Schwann-cell expression.
  case_fractions:
  - population: Hungarian CMT cohort (genetic epidemiology series)
    case_fraction_percent: 9.2
    notes: >-
      GJB1 variants accounted for 9.2% of all affected individuals in the studied Hungarian cohort (409
      CMT1 and 122 CMT2 patients). This is a study-cohort fraction, not population prevalence or a fraction
      restricted to genetically solved cases.
    evidence:
    - reference: PMID:29174527
      reference_title: "Genotypic and phenotypic spectrum of the most common causative genes of Charcot-Marie-Tooth disease in Hungarian patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "alterations were most frequently found in PMP22 (40.5%), followed by GJB1 (9.2%)"
      explanation: >-
        Reports the GJB1 share among all affected individuals in the study cohort.
  gene_term:
    preferred_term: GJB1
    term:
      id: hgnc:4283
      label: GJB1
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:8266101
    reference_title: "Connexin mutations in X-linked Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing of the connexin32 gene showed seven different mutations in affected persons from eight CMTX families."
    explanation: Original identification of GJB1 as the CMTX1 gene.
  - reference: PMID:37284795
    reference_title: "Genetic analysis and natural history of Charcot-Marie-Tooth disease CMTX1 due to GJB1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present 387 patients from 295 families harbouring 154 variants in GJB1."
    explanation: Establishes the scale of the classified GJB1 variant series behind the figures above.
  - reference: PMID:37284795
    reference_title: "Genetic analysis and natural history of Charcot-Marie-Tooth disease CMTX1 due to GJB1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "319 patients (82.4%) were deemed to have P/LP variants, 65 had VUS (16.8%) and three benign variants"
    explanation: >-
      These percentages describe patients, not the proportion of distinct variants.
  - reference: PMID:37284795
    reference_title: "Genetic analysis and natural history of Charcot-Marie-Tooth disease CMTX1 due to GJB1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype analysis suggested c.-17G>A produces the most severe phenotype of the five most common variants"
    explanation: The one allele-specific genotype-phenotype signal reported in the series.
  - reference: PMID:28768847
    reference_title: "Cross-sectional analysis of a large cohort with X-linked Charcot-Marie-Tooth disease (CMTX1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the absence of a phenotypic correlation with specific GJB1 mutations, sex-specific distinctions and clinically relevant attributes need to be incorporated into the measurements for clinical trials"
    explanation: >-
      Reports no general genotype-phenotype correlation across 89 variants,

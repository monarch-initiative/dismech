- name: Reduced SOX3 Expression During Early Neural Differentiation
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  subtypes:
  - CMTX3
  genes:
  - preferred_term: SOX3
    term:
      id: hgnc:11199
      label: SOX3
  description: >-
    Patient-derived CMTX3 iPSCs and caudal neuroepithelial progenitors show reduced SOX3 abundance. NanoString
    detected an approximately 5.7-fold iPSC RNA reduction. In progenitors from two patients and three
    controls, DESeq2 detected approximately 3.89-fold lower RNA; edgeR narrowly missed its significance
    threshold (FDR 0.0506). Proteomics in three patient and three control progenitor lines independently
    detected reduced SOX3 protein. Later differentiation stages did not show significant NanoString differences.
    SOX3 is a leading candidate regulatory target, not an established causal CMT gene: the study lacked
    isogenic controls and functional rescue, patient lines were related, and neuronal or glial dysfunction
    from altered SOX3 was not demonstrated. The specific regulatory interaction and expression outside
    the assayed developmental stages remain unresolved.
  evidence:
  - reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC13563502/
    reference_title: The Charcot–Marie–Tooth Neuropathy (CMTX3) Complex Structural Variation Causes Differential SOX3 Spatiotemporal Expression
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: At the iPSC stage, 12 of 21 candidate genes showed no detectable expression. Among the remaining genes, SOX3 was the only transcript significantly differentially expressed between CMTX3 and control iPSC lines (p = 0.0012), exhibiting an approximately 5.7‐fold reduction in patient‐derived iPSCs (log2(Ratio) = ‐2.51) (Figure 4A).
    explanation: >-
      NanoString RNA measurement in cultured patient-derived cells.
  - reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC13563502/
    reference_title: The Charcot–Marie–Tooth Neuropathy (CMTX3) Complex Structural Variation Causes Differential SOX3 Spatiotemporal Expression
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: CMTX3 NEPs exhibited a ~3.89‐fold (log2(FC) = −1.96) reduction in SOX3 expression relative to controls (adj. p = 0.0015), consistent with the trend observed in the NanoString nCounter analysis.
    explanation: >-
      DESeq2 supported the progenitor RNA change; the text separately reports edgeR FDR 0.0506.
  - reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC13563502/
    reference_title: The Charcot–Marie–Tooth Neuropathy (CMTX3) Complex Structural Variation Causes Differential SOX3 Spatiotemporal Expression
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Consistent with the transcriptomic analyses, SOX3 protein abundance was significantly reduced in CMTX3 NEPs relative to controls (Log2FC = −0.442, Figure 6B).
    explanation: >-
      Quantitative proteomics corroborates reduced protein abundance in cultured progenitors.
  - reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC13563502/
    reference_title: The Charcot–Marie–Tooth Neuropathy (CMTX3) Complex Structural Variation Causes Differential SOX3 Spatiotemporal Expression
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Although SOX3 emerges as a strong candidate based on its spatially and temporally restricted dysregulation, the current data do not demonstrate that altering SOX3 levels drives neuronal or glial phenotypes relevant to CMTX3 (e.g., axonal outgrowth, survival, myelination, and electrophysiology).
    explanation: >-
      The authors explicitly distinguish the expression result from a demonstrated disease mechanism.
- name: Peripheral Axonal Degeneration
  biological_scale: TISSUE
  description: >-
    Axonal degeneration contributes to motor and sensory impairment across molecular CMTX subtypes. In
    CMTX1, motor-unit loss correlates with disability and nerve biopsies show axonal loss with regeneration.
    CMTX4 and CMTX6 are predominantly axonal, while CMTX5 can have mixed axonal and demyelinating pathology.
    These subtypes do not share a demonstrated obligate demyelination-first sequence.
  evidence:
  - reference: PMID:17353473
    reference_title: CMT1X phenotypes represent loss of GJB1 gene function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Disability correlated with a loss of motor units as assessed by motor unit number estimates.
    explanation: >-
      Human CMTX1 data relate disability to motor-unit loss.
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1374/
    reference_title: "GJB1 Disorders: Charcot-Marie-Tooth Neuropathy (CMT1X) and Central Nervous System Phenotypes"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Light microscopy typically reveals axonal loss with evidence of regeneration.
    explanation: >-
      CMTX1 biopsy findings support actual axonal loss.
  - reference: PMID:17701900
    reference_title: "Mutations in PRPS1, which encodes the phosphoribosyl pyrophosphate synthetase enzyme critical for nucleotide biosynthesis, cause hereditary peripheral neuropathy with hearing loss and optic neuropathy (cmtx5)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pathologic examination of the sural nerve biopsy sample from the eldest living patient (CMTX5:III-18) showed loss of both large and small myelinated nerve fibers and an increase of endoneurial collagen
    explanation: >-
      Direct nerve pathology from a PRPS1-associated CMTX5 patient.
  downstream:

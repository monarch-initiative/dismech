- name: AAV9-Mediated Schwann-Cell-Targeted GJB1 Gene Replacement
  description: >-
    Investigational, preclinical only. An AAV9 vector delivering GJB1/Cx32 under
    the Schwann-cell-specific Mpz promoter, given by lumbar intrathecal
    injection. Gene replacement is a rational strategy here precisely because the
    human mechanism is loss of function, so restoring wild-type Cx32 to
    myelinating Schwann cells addresses the primary lesion rather than a
    downstream consequence. Treatment both before and after neuropathy onset
    improved motor performance, conduction velocity, myelination and blood
    biomarkers in Gjb1-null mice. No human trial has been reported, and
    symptomatic management remains the only clinical option.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Connexin-32 Reflexive Gap Junction Loss in Schwann Cells
    description: >-
      Restores Cx32 expression in myelinating Schwann cells, acting directly on
      the initiating molecular lesion rather than on its consequences.

      intervention is applied clinically. Support is indirect because the source
      explicitly hedges on effectiveness, limiting the claim to feasibility rather
      than proven efficacy.
  - reference: PMID:41557339
    reference_title: "Evaluating Cochlear Implantation Outcomes in Charcot-Marie-Tooth Disease: A Case Series Analysis of Genetic Profiles and Intervention Timing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Case 4: A 32-year-old man with PRPS1 -associated CMTX5 and profound prelingual SNHL showed improved sound awareness (20-30 dB HL) post-CI but had no speech perception gains due to prolonged auditory deprivation."
    explanation: >-
      A CMTX5 case specifically, and the one that grounds the timing argument:

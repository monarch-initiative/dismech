    evidence_source: HUMAN_CLINICAL
    snippet: "Cochlear implants (CIs) have been used to rehabilitate hearing loss in CMT, but their effectiveness remains poorly understood due to the central and peripheral neurological complexities of the disease."
    explanation: >-

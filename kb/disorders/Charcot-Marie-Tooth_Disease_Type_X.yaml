pathophysiology:
- name: Cx32 Loss of Function in Schwann Cells
  biological_scale: MOLECULAR
  description: >-
    In CMTX1, pathogenic GJB1 variants reduce normal Cx32 function in myelinating Schwann cells. Some
    variants prevent protein expression or membrane trafficking; others form channels with altered gating
    or permeability. Cx32 normally contributes to reflexive junctions between cytoplasmic layers of the
    same Schwann cell. Loss of Cx32 does not establish loss of every radial diffusion route or direct
    axon-to-glial metabolite transfer.
  evidence:
  - reference: PMID:17353473
    reference_title: CMT1X phenotypes represent loss of GJB1 gene function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Taken together, these data suggest that most GJB1 mutations cause neuropathy by a loss of normal connexin 32 function.
    explanation: >-
      Human genotype-phenotype findings support loss of normal function in the peripheral neuropathy.
  - reference: PMID:37284795
    reference_title: Genetic analysis and natural history of Charcot-Marie-Tooth disease CMTX1 due to GJB1 variants.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Both p.Arg15Gln and p.Glu102Gly form channels at the cell membrane but with altered gating properties.
    explanation: >-
      The clinical paper summarizes prior functional studies; channel dysfunction does not require absent
      plaques.
  subtypes:
  - CMTX1
  cell_types:
  - &id002
    preferred_term: myelinating Schwann cell
    term:
      id: CL:0000218
      label: myelinating Schwann cell
  genes: *id001
  conforms_to: "schwann_cell_myelin_maintenance#Myelin Gene Dosage or Structural Lesion in Schwann Cells"
  downstream:
  - target: Peripheral Myelin Abnormalities in CMTX1
    description: >-
      Schwann-cell Cx32 dysfunction compromises myelin maintenance through incompletely resolved intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Impaired Axonal Transport in Gjb1-null Mice
    description: >-
      Gjb1 loss is associated with early axonal dysfunction in the knockout mouse; the glia-to-axon intermediates
      have not been established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Reduced Axon Caliber in Gjb1-null Mice
    description: >-
      Gjb1 loss is associated with reduced axon caliber in the mouse; the intervening glial signal is
      unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Neurofilament Dephosphorylation in Gjb1-null Mice
    description: >-
      Gjb1 loss is associated with altered axonal neurofilament phosphorylation; the intervening glial
      signal is unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Peripheral Myelin Abnormalities in CMTX1
  biological_scale: TISSUE
  description: >-
    Human CMTX1 nerves can show thin myelin and scattered onion bulbs along with axonal loss and regeneration.
    These findings support disordered myelin maintenance, but do not establish that demyelination necessarily
    precedes all axonal injury. Intermediate conduction slowing is typical in males, whereas females can
    have velocities in the axonal range.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1374/
    reference_title: "GJB1 Disorders: Charcot-Marie-Tooth Neuropathy (CMT1X) and Central Nervous System Phenotypes"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Scattered onion bulbs as well as thinly myelinated fibers, resulting from either regeneration and associated remyelination or segmental demyelination and remyelination, are also seen.
    explanation: >-
      Describes CMTX1 nerve histopathology without imposing one temporal sequence.
  subtypes:
  - CMTX1
  cell_types:
  - *id002
  biological_processes:
  - preferred_term: peripheral nervous system myelin maintenance
    term:
      id: GO:0032287
      label: peripheral nervous system myelin maintenance
    modifier: DECREASED
  downstream:
  - target: Decreased Motor Nerve Conduction Velocity
    description: >-
      Abnormal myelin contributes to conduction slowing.
  - target: Peripheral Axonal Degeneration
    description: >-
      Myelin injury may contribute to axonal degeneration, alongside routes that do not require prior
      overt demyelination.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Impaired Axonal Transport in Gjb1-null Mice
  biological_scale: CELLULAR
  description: >-
    Sciatic-nerve ligation experiments in Gjb1-null mice showed reduced accumulation of transported proteins
    at an age with minimal demyelination. This establishes impaired axonal transport in the model, without
    proving that it causes later demyelination or the human clinical trajectory.
  evidence:
  - reference: PMID:20720503
    reference_title: Axonal pathology precedes demyelination in a mouse model of X-linked demyelinating/type I Charcot-Marie Tooth neuropathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: fast axonal transport, assayed by sciatic nerve ligation experiments, was slower in distal axons of Gjb1-null versus wild-type animals
    explanation: >-
      Direct functional transport measurement in the knockout mouse.
  subtypes:
  - CMTX1
  downstream:
  - target: Peripheral Axonal Degeneration
    description: >-
      Early axonal dysfunction may contribute to later degeneration, but this experiment did not isolate
      the intervening causal steps.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: PDK3 Kinase Hyperactivity
  biological_scale: MOLECULAR
  description: >-
    The CMTX6 p.Arg158His variant increases recombinant PDK3 kinase activity approximately fivefold with
    E1p as substrate and increases affinity for the E2p inner lipoyl domain. This is a measured gain of
    kinase activity, not a direct measurement of energy failure in patient axons.
  evidence:
  - reference: PMID:23297365
    reference_title: A new locus for X-linked dominant Charcot-Marie-Tooth disease (CMTX6) is caused by mutations in the pyruvate dehydrogenase kinase isoenzyme 3 (PDK3) gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We found that the R158H mutation confers enzyme hyperactivity and binds with stronger affinity than the wild-type to the inner-lipoyl (L2) domain of the E2p chain of PDC.
    explanation: >-
      Recombinant biochemical assays establish kinase hyperactivity and altered binding.
  subtypes:
  - CMTX6
  genes: *id003
  genetic_context:
    gene:
      preferred_term: PDK3
      term:
        id: hgnc:8811
        label: PDK3
    functional_impact_category: GAIN_OF_FUNCTION
    description: p.Arg158His in the founding CMTX6 family.
  downstream:
  - target: Proposed Reduction of Pyruvate Oxidation in CMTX6
    description: >-
      Excess phosphorylation could inhibit PDC and restrict pyruvate oxidation in relevant neural cells;
      the founding study explicitly proposed this downstream mechanism.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Proposed Reduction of Pyruvate Oxidation in CMTX6
  biological_scale: CELLULAR
  description: >-
    Hyperactive PDK3 is proposed to maintain pyruvate dehydrogenase complex in a phosphorylated inactive
    state, limiting pyruvate oxidation. Impaired ATP production or lactate accumulation are possible consequences.
    The founding study measured recombinant kinase activity and binding, and called for neural-cell studies
    to establish the downstream metabolic consequences.
  evidence:
  - reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC3596851/
    reference_title: A new locus for X-linked dominant Charcot–Marie–Tooth disease (CMTX6) is caused by mutations in the pyruvate dehydrogenase kinase isoenzyme 3 (PDK3) gene
    supports: SUPPORT
    evidence_source: OTHER
    snippet: We postulate these combined effects of R158H PDK3 are likely to lock PDC in a predominantly phosphorylated inactive state leading to impaired ATP production and or lactate accumulation.
    explanation: >-
      The authors identify this metabolic consequence as a postulate, not a measured patient-neuron result.
    directness: INDIRECT
  subtypes:
  - CMTX6
  mechanism_confidence: HYPOTHETICAL
  downstream:
  - target: Peripheral Axonal Degeneration
    description: >-
      Metabolic impairment is a proposed explanation for the clinical axonal neuropathy; selective nerve
      vulnerability remains unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Altered AIF Redox Activity
  biological_scale: MOLECULAR
  description: >-
    The CMTX4-associated AIFM1 p.Glu493Val protein has altered redox kinetics: the recombinant protein
    is reduced by NADH more rapidly and forms a less stable reduced charge-transfer complex. This differs
    from AIFM1 alleles causing respiratory-chain deficiency; respiratory-chain activity was preserved
    in the studied Cowchock fibroblasts and muscle.
  evidence:
  - reference: PMID:23217327
    reference_title: Cowchock syndrome is associated with a mutation in apoptosis-inducing factor.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: p.Glu493Val AIF has lower KM for NADH (by 20%) than does wild-type AIF and becomes reduced by NADH 4-fold faster
    explanation: >-
      Recombinant protein measurements define the redox defect.
  - reference: PMID:23217327
    reference_title: Cowchock syndrome is associated with a mutation in apoptosis-inducing factor.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The activity of respiratory chain complexes in fibroblasts derived from an affected individual was not reduced compared to carrier and controls
    explanation: >-
      Cultured patient fibroblasts did not show respiratory-chain deficiency.
  - reference: PMID:23217327
    reference_title: Cowchock syndrome is associated with a mutation in apoptosis-inducing factor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Likewise, no impairment in the respiratory chain activities was detected in a muscle biopsy from subject III-9
    explanation: >-
      The biopsy result independently limits a generalized bioenergetic-failure account.
  subtypes:
  - CMTX4
  genes: *id004
  downstream:
  - target: Increased Caspase-independent Apoptotic Susceptibility
    description: >-
      Altered redox behavior may favor release and nuclear translocation of apoptogenic AIF; the complete
      causal sequence was not directly isolated.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  molecular_functions:

- name: Cx32 Dysfunction in Oligodendrocytes
  biological_scale: MOLECULAR
  description: >-
    Cx32 is expressed in oligodendrocytes as well as Schwann cells. In transfected HeLa cells, several
    CNS-associated Cx32 mutants were retained in the endoplasmic reticulum or Golgi, with rare plaques
    for some mutants, and did not alter Cx45 expression. These experiments support abnormal mutant handling
    but do not establish that simple Cx32 absence explains all CNS episodes. Toxic effects and disrupted
    glial coupling remain candidate mechanisms.
  evidence:
  - reference: PMID:12111842
    reference_title: Cellular mechanisms of connexin32 mutations associated with CNS manifestations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In communication-incompetent cells, the mutants associated with CNS phenotypes failed to reach the cell membrane and were instead retained in the endoplasmic reticulum (A39V, T55I) or Golgi apparatus (M93V, R164Q, R183H)
    explanation: >-
      Transfected HeLa-cell result; the description preserves the reported rare-plaque exceptions.
  - reference: PMID:12111842
    reference_title: Cellular mechanisms of connexin32 mutations associated with CNS manifestations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These results indicate that Cx32 mutants that are associated with a CNS phenotype do not interact with Cx45, but may instead have other toxic effects in oligodendrocytes.
    explanation: >-
      The proposed CNS mechanism remains unresolved by this cell experiment.
    directness: INDIRECT
  subtypes:
  - CMTX1
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  genes: *id001

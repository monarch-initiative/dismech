name: Charcot-Marie-Tooth Disease Type X
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Charcot-Marie-Tooth disease type X (CMTX) is the X-linked compartment of
  Charcot-Marie-Tooth disease, sitting alongside the dominant demyelinating
  (CMT1), dominant axonal (CMT2) and autosomal-recessive (CMT4) compartments.
  It is overwhelmingly dominated by CMTX1, caused by loss-of-function variants
  in GJB1 encoding connexin-32 — the second most common cause of CMT overall
  after the PMP22 duplication of CMT1A. Connexin-32 forms the reflexive gap
  junctions that connect the abaxonal and adaxonal cytoplasm of a myelinating
  Schwann cell across its own non-compact myelin, providing a short radial
  diffusion path for ions and small metabolites that would otherwise have to
  travel the full spiral length of the sheath. Losing that path degrades
  Schwann-cell support of the axon it myelinates, producing an intermediate
  electrophysiology — conduction velocities slowed beyond pure axonal disease
  but not into the uniformly demyelinating range — and progressive
  length-dependent distal weakness, wasting, sensory loss and foot deformity.
  Because GJB1 is X-linked and the mechanism is loss of function, hemizygous
  males are consistently and more severely affected while heterozygous females
  are affected later, more mildly, and more variably. The mechanism of that
  female variability is unsettled: skewed X-inactivation in Schwann cells is the
  long-standing hypothesis, but the only study to measure it directly in
  affected nerve found random X-inactivation, so this entry does not assert it. Connexin-32 is also expressed by
  oligodendrocytes, which is why CMTX1 — alone among the CMT compartments —
  carries a recognized central nervous system phenotype, including stereotyped
  episodes of transient, reversible CNS white-matter dysfunction.

  The remaining loci are individually rare and mechanistically unrelated to
  connexin biology, each converging on the same peripheral-nerve endpoint by a
  different route: AIFM1 (CMTX4 / Cowchock syndrome) and PDK3 (CMTX6) through
  mitochondrial bioenergetic failure, PRPS1 (CMTX5) through impaired purine
  nucleotide biosynthesis, and CMTX3 through a non-coding interchromosomal
  insertion at Xq27.1 whose transcriptional consequence is still unresolved.
  Several of these carry syndromic features — sensorineural hearing loss and
  optic atrophy in CMTX5, deafness and cognitive impairment in CMTX4 — that a
  pure CMTX1 picture does not.
disease_term:
  preferred_term: X-linked Charcot-Marie-Tooth disease (CMTX)
  term:
    id: MONDO:0018994
    label: Charcot-Marie-Tooth disease type X
parents:
- Charcot-Marie-Tooth disease
synonyms:
- X-linked hereditary motor and sensory neuropathy
- CMTX
- X-linked Charcot-Marie-Tooth disease
notes: >-
  Scope note. This entry is the X-linked compartment of CMT, curated in parallel
  with the existing kb/disorders/Charcot-Marie-Tooth_Disease_Type_1.yaml,
  _Type_2.yaml and _Type_4.yaml entries, each of which is likewise a
  multi-gene compartment carried as one Disease with per-locus has_subtypes.
  Two CMTX loci already have their own dedicated entries and are cross-referenced
  rather than duplicated here: CMTX4 / Cowchock syndrome
  (kb/disorders/Charcot-Marie-Tooth_Disease_X-linked_Recessive_4.yaml) and CMTX5,
  which is covered by kb/disorders/PRPS1_Deficiency_Spectrum.yaml as part of the
  wider PRPS1 allelic series. The subtype entries below carry the CMTX-relevant
  claim and its citation only.

  CMTX2 (MONDO:0010550) and CMTX3 (MONDO:0010551) are retained as subtypes for
  MONDO completeness, but their evidence base is thin and asymmetric: CMTX3 has a
  molecularly defined lesion, while CMTX2 rests on old linkage reports with no
  confirmed gene. That asymmetry is recorded in each subtype's description rather
  than smoothed over.
has_subtypes:
- name: CMTX1
  display_name: CMTX1 (GJB1 / connexin-32-related)
  description: >-
    X-linked dominant intermediate CMT caused by loss-of-function variants in
    GJB1 encoding the gap junction protein connexin-32, which forms reflexive
    gap junctions in the non-compact myelin of myelinating Schwann cells. CMTX1
    accounts for the large majority of CMTX and is the second most common cause
    of CMT overall. Over 260 distinct GJB1 variants have been reported across
    nearly all protein domains, and the weight of genotype-phenotype evidence
    is that they converge on simple loss of connexin-32 function rather than a
    toxic gain of function. Hemizygous males are more severely and more
    uniformly affected than heterozygous females.
  evidence:
  - reference: PMID:8266101
    reference_title: "Connexin mutations in X-linked Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing of the connexin32 gene showed seven different mutations in affected persons from eight CMTX families."
    explanation: Establishes GJB1 / connexin-32 variants as the molecular cause of CMTX1.
  - reference: PMID:17353473
    reference_title: "CMT1X phenotypes represent loss of GJB1 gene function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, these data suggest that most GJB1 mutations cause neuropathy by a loss of normal connexin 32 function."
    explanation: >-
      Supports loss of function, rather than a gain-of-function mechanism, as the
      basis of the CMTX1 phenotype across 28 different GJB1 variants.
- name: CMTX2
  display_name: CMTX2 (X-linked recessive, gene unconfirmed)
  description: >-
    An X-linked recessive CMT locus mapped historically to Xp22.2 and reported
    with early onset and intellectual disability. No causal gene has been
    confirmed, and the entity is defined by linkage rather than by a molecular
    lesion. Retained here for MONDO completeness; it should not be treated as
    having an established mechanism.
- name: CMTX3
  display_name: CMTX3 (Xq27.1 interchromosomal insertion)
  description: >-
    X-linked recessive CMT caused not by a coding variant but by a 78 kb
    interchromosomal insertion originating from chromosome 8q24.3 into the
    CMTX3 locus at Xq26.3-q27.3. Coding mutations were excluded by exome
    sequencing in the two mapped families, and the lesion was found only by
    whole genome sequencing. How the insertion produces neuropathy — presumably
    by perturbing regulation of a neighbouring gene — is not established.
  evidence:
  - reference: PMID:27438001
    reference_title: "Whole Genome Sequencing Identifies a 78 kb Insertion from Chromosome 8 as the Cause of Charcot-Marie-Tooth Neuropathy CMTX3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 78 kb insertion originates from chromosome 8q24.3, segregates fully with the disease in the two families, and is absent from the general population"
    explanation: Establishes a non-coding interchromosomal insertion as the CMTX3 lesion.
- name: CMTX4
  display_name: CMTX4 / Cowchock syndrome (AIFM1-related)
  description: >-
    Slowly progressive X-linked recessive axonal neuropathy with deafness and
    cognitive impairment, caused by missense variants in AIFM1 encoding
    apoptosis-inducing factor, an FAD-dependent mitochondrial NADH oxidase.
    Curated in full in kb/disorders/Charcot-Marie-Tooth_Disease_X-linked_Recessive_4.yaml;
    represented here only as the CMTX4 member of the X-linked compartment.
  evidence:
  - reference: PMID:23217327
    reference_title: "Cowchock syndrome is associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cowchock syndrome (CMTX4) is a slowly progressive X-linked recessive disorder with axonal neuropathy, deafness, and cognitive impairment."
    explanation: Defines CMTX4 as an X-linked recessive axonal neuropathy with deafness and cognitive impairment.
- name: CMTX5
  display_name: CMTX5 / Rosenberg-Chutorian syndrome (PRPS1-related)
  description: >-
    X-linked recessive peripheral neuropathy with prelingual sensorineural
    hearing loss and optic neuropathy, caused by missense variants in PRPS1
    encoding phosphoribosyl pyrophosphate synthetase 1. PRPS1 was the first CMT
    gene encoding a metabolic enzyme. Curated within the wider allelic series in
    kb/disorders/PRPS1_Deficiency_Spectrum.yaml; represented here only as the
    CMTX5 member of the X-linked compartment.
  evidence:
  - reference: PMID:17701900
    reference_title: "Mutations in PRPS1, which encodes the phosphoribosyl pyrophosphate synthetase enzyme critical for nucleotide biosynthesis, cause hereditary peripheral neuropathy with hearing loss and optic neuropathy (cmtx5)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the affected male patients invariably develop sensorineural hearing loss of prelingual type followed by gating disturbance and visual loss"
    explanation: Defines the CMTX5 symptom triad of neuropathy, prelingual hearing loss and visual loss.
- name: CMTX6
  display_name: CMTX6 (PDK3-related)
  description: >-
    X-linked dominant CMT caused by a missense variant (p.R158H) in PDK3, one of
    four kinases that inhibit the pyruvate dehydrogenase complex by reversible
    phosphorylation. Unusually among CMT mechanisms the variant is
    hyperactivating rather than inactivating: mutant PDK3 binds the E2p
    inner-lipoyl domain more tightly than wild type and hyper-phosphorylates
    the complex, reducing pyruvate flux into the Krebs cycle.
  evidence:
  - reference: PMID:23297365
    reference_title: "A new locus for X-linked dominant Charcot-Marie-Tooth disease (CMTX6) is caused by mutations in the pyruvate dehydrogenase kinase isoenzyme 3 (PDK3) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing identified a missense mutation c.G473A (p.R158H) in the pyruvate dehydrogenase kinase isoenzyme 3 (PDK3) gene."
    explanation: Establishes the PDK3 p.R158H variant as the cause of X-linked dominant CMTX6.
pathophysiology:
- name: Connexin-32 Reflexive Gap Junction Loss in Schwann Cells
  conforms_to: "schwann_cell_myelin_maintenance#Myelin Gene Dosage or Structural Lesion in Schwann Cells"
  biological_scale: MOLECULAR
  description: >-
    Loss-of-function variants in GJB1 remove connexin-32 from the non-compact
    myelin of myelinating Schwann cells, where it assembles the reflexive gap
    junctions that connect the cell's own abaxonal and adaxonal cytoplasmic
    compartments across the myelin spiral. Those junctions provide a short
    radial diffusion path — on the order of micrometres — for ions and small
    metabolites that would otherwise have to travel the entire spiral length of
    the sheath. Connexin-32 is normally expressed in myelinated peripheral
    nerve, and the reported variants span nearly all protein domains yet
    converge on loss of function rather than a toxic gain, which is why
    whole-gene deletions are no more severe than missense alleles.
  cell_types:
  - preferred_term: Myelinating Schwann cell
    term:
      id: CL:0000218
      label: myelinating Schwann cell
  biological_processes:
  - preferred_term: Gap junction assembly in non-compact myelin
    term:
      id: GO:0016264
      label: gap junction assembly
    modifier: LOSS_OF_FUNCTION
  genes:
  - preferred_term: GJB1
    term:
      id: hgnc:4283
      label: GJB1
  downstream:
  - target: Impaired Radial Metabolic Support of the Axon
    description: >-
      Removing the reflexive radial diffusion path degrades the Schwann cell's
      ability to exchange ions and small metabolites with the periaxonal space
      it supports.
  evidence:
  - reference: PMID:8266101
    reference_title: "Connexin mutations in X-linked Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it was found that connexin32 is normally expressed in myelinated peripheral nerve"
    explanation: Localizes connexin-32 to myelinated peripheral nerve, the compartment the lesion acts in.
  - reference: PMID:17353473
    reference_title: "CMT1X phenotypes represent loss of GJB1 gene function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the degree of disability was comparable with that observed in patients with a documented GJB1 deletion"
    explanation: >-
      Equivalence of missense and whole-gene-deletion disability is the
      observation that identifies the mechanism as loss of function.
  - reference: PMID:9722620
    reference_title: "Functional gap junctions in the schwann cell myelin sheath."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "this radial pathway is approximately one million times faster than the circumferential pathway"
    explanation: >-
      Quantifies why the reflexive route matters: dye-injection measurements in
      teased myelinating Schwann cells show the radial path across the sheath is
      about a million-fold faster than travelling the spiral circumferentially,
      which is what makes its loss consequential.
- name: Impaired Radial Metabolic Support of the Axon
  conforms_to: "schwann_cell_myelin_maintenance#Schwann Cell Proteostatic Stress and Myelin Protein Mistrafficking"
  biological_scale: CELLULAR
  description: >-
    Without the reflexive gap-junction shortcut, exchange of potassium, cyclic
    nucleotides and other small solutes between the Schwann cell body and the
    periaxonal compartment is confined to the long circumferential route through
    the myelin spiral. Schwann-cell support of the axon it ensheathes becomes
    inadequate, most acutely in the longest fibres where the metabolic load per
    supporting cell is greatest. This is the step at which a molecular lesion in
    a glial junction protein becomes an axon-level deficit.
  cell_types:
  - preferred_term: Myelinating Schwann cell
    term:
      id: CL:0000218
      label: myelinating Schwann cell
  - preferred_term: Peripheral sensory and motor neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Peripheral nervous system myelin maintenance
    term:
      id: GO:0032287
      label: peripheral nervous system myelin maintenance
    modifier: DECREASED
  downstream:
  - target: Demyelination with Secondary Axonal Loss
    description: >-
      Chronic failure of Schwann-cell metabolic support destabilizes the myelin
      sheath and the axon it invests.
- name: Mitochondrial Bioenergetic Failure in Peripheral Nerve
  biological_scale: MOLECULAR
  description: >-
    The rare non-connexin CMTX loci reach the same endpoint through energy
    metabolism rather than through junctional coupling. In CMTX4 the AIFM1
    p.Glu493Val variant alters the redox properties of apoptosis-inducing
    factor, an FAD-dependent mitochondrial NADH oxidase, and increases cell
    death. In CMTX6 the PDK3 p.R158H variant is hyperactivating: it binds the
    inner-lipoyl domain of the E2p chain more tightly than wild-type PDK3 and
    hyper-phosphorylates the pyruvate dehydrogenase complex, throttling pyruvate
    entry into the Krebs cycle. Both leave the long peripheral axon — the cell
    compartment least able to tolerate an ATP shortfall — energetically
    unsupported.
  cell_types:
  - preferred_term: Peripheral sensory and motor neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Pyruvate metabolic process
    term:
      id: GO:0006090
      label: pyruvate metabolic process
    modifier: DECREASED
  genes:
  - preferred_term: AIFM1
    term:
      id: hgnc:8768
      label: AIFM1
  - preferred_term: PDK3
    term:
      id: hgnc:8811
      label: PDK3
  downstream:
  - target: Demyelination with Secondary Axonal Loss
    description: >-
      Bioenergetic failure in the longest fibres produces the same
      length-dependent axonal degeneration the connexin route arrives at.
  evidence:
  - reference: PMID:23297365
    reference_title: "A new locus for X-linked dominant Charcot-Marie-Tooth disease (CMTX6) is caused by mutations in the pyruvate dehydrogenase kinase isoenzyme 3 (PDK3) gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that the R158H mutation confers enzyme hyperactivity and binds with stronger affinity than the wild-type to the inner-lipoyl (L2) domain of the E2p chain of PDC."
    explanation: >-
      Biochemical characterization establishing PDK3 hyperactivity, and so
      reduced pyruvate flux, as the CMTX6 mechanism.
  - reference: PMID:23217327
    reference_title: "Cowchock syndrome is associated with a mutation in apoptosis-inducing factor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AIF is an FAD-dependent NADH oxidase that is imported into mitochondria."
    explanation: Identifies the mitochondrial oxidoreductase function disrupted in CMTX4.
- name: Purine Nucleotide Biosynthesis Deficiency
  biological_scale: MOLECULAR
  description: >-
    In CMTX5, missense variants in PRPS1 reduce phosphoribosyl pyrophosphate
    synthetase 1 activity, the committed step supplying PRPP for purine and
    pyrimidine nucleotide biosynthesis. PRPS1 was the first CMT gene found to
    encode a metabolic enzyme. Because the enzyme is ubiquitously expressed —
    including in cochlea — the deficit is not confined to peripheral nerve,
    which is why CMTX5 is syndromic, adding prelingual sensorineural hearing
    loss and optic neuropathy to the neuropathy.
  cell_types:
  - preferred_term: Peripheral sensory and motor neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Purine nucleotide biosynthetic process
    term:
      id: GO:0006164
      label: purine nucleotide biosynthetic process
    modifier: DECREASED
  genes:
  - preferred_term: PRPS1
    term:
      id: hgnc:9462
      label: PRPS1
  downstream:
  - target: Demyelination with Secondary Axonal Loss
    description: >-
      Reduced nucleotide supply in long-projection neurons converges on the same
      length-dependent degeneration.
  evidence:
  - reference: PMID:17701900
    reference_title: "Mutations in PRPS1, which encodes the phosphoribosyl pyrophosphate synthetase enzyme critical for nucleotide biosynthesis, cause hereditary peripheral neuropathy with hearing loss and optic neuropathy (cmtx5)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also showed decreased enzyme activity in patients with M115T."
    explanation: Demonstrates reduced PRPS1 enzyme activity in CMTX5 patients, establishing loss of function.
- name: Demyelination with Secondary Axonal Loss
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  biological_scale: TISSUE
  description: >-
    The shared terminal node of the X-linked compartment, and the same one the
    CMT1, CMT2 and CMT4 entries converge on. In CMTX1 the electrophysiological
    signature is characteristically intermediate: motor conduction velocities
    are slowed below the axonal range but not into the uniformly demyelinating
    range that defines CMT1, consistent with a primary glial lesion that
    degrades rather than abolishes myelin. Clinical disability tracks the
    secondary axonal loss rather than the conduction slowing — in CMTX1 it
    increases with age and correlates with loss of motor units on motor unit
    number estimation.
  cell_types:
  - preferred_term: Myelinating Schwann cell
    term:
      id: CL:0000218
      label: myelinating Schwann cell
  - preferred_term: Peripheral sensory and motor neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Myelination
    term:
      id: GO:0042552
      label: myelination
    modifier: DECREASED
  downstream:
  - target: Length-Dependent Distal Neuropathy
    description: >-
      Axonal loss in the longest fibres produces the length-dependent distal
      motor and sensory deficit.
  evidence:
  - reference: PMID:17353473
    reference_title: "CMT1X phenotypes represent loss of GJB1 gene function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disability correlated with a loss of motor units as assessed by motor unit number estimates."
    explanation: >-
      Ties clinical disability to axonal (motor unit) loss rather than to
      demyelination per se, which is why this node and not the myelin node is
      the proximate driver of the phenotype.
- name: Length-Dependent Distal Neuropathy
  conforms_to: "peripheral_axonal_degeneration#Length-Dependent Nerve Fiber Dysfunction"
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint: symmetrical, length-dependent distal weakness and
    wasting beginning in the intrinsic foot and peroneal muscles, distal sensory
    loss, depressed or absent reflexes, and the secondary skeletal deformities
    (pes cavus, hammertoes) that follow chronic imbalance between weakened and
    spared muscle groups. In CMTX1 this typically becomes manifest in affected
    males between ages five and 25.
  evidence:
  - reference: PMID:20301548
    reference_title: "GJB1 Disorders: Charcot-Marie-Tooth Neuropathy (CMT1X) and Central Nervous System Phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Peripheral neuropathy typically manifests in affected males between ages five and 25 years."
    explanation: Establishes the typical age at onset of the peripheral phenotype in hemizygous males.
- name: Oligodendrocyte Connexin-32 Loss and Transient CNS Dysfunction
  biological_scale: TISSUE
  description: >-
    Connexin-32 is expressed by oligodendrocytes as well as Schwann cells, and
    CMTX1 is consequently the one CMT compartment with a recognized central
    nervous system phenotype. This takes two forms: fixed white-matter
    abnormalities, and stereotyped acute, self-limited, fully reversible
    episodes of CNS dysfunction — typically weakness and dysarthria, sometimes
    presenting as stroke-like episodes and mimicking cerebral ischaemia. The
    episodes are self-limited and treatment is supportive. Their trigger and
    mechanism are not established; that they resolve completely argues for
    reversible metabolic or ionic decompensation of oligodendrocyte-supported
    white matter rather than for infarction.
  cell_types:
  - preferred_term: Oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  genes:
  - preferred_term: GJB1
    term:
      id: hgnc:4283
      label: GJB1
  evidence:
  - reference: PMID:20301548
    reference_title: "GJB1 Disorders: Charcot-Marie-Tooth Neuropathy (CMT1X) and Central Nervous System Phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "acute, self-limited episodes of transient neurologic dysfunction (especially weakness and dysarthria)"
    explanation: Establishes the transient, reversible CNS episodes characteristic of GJB1 disorders.
  - reference: PMID:12111842
    reference_title: "Cellular mechanisms of connexin32 mutations associated with CNS manifestations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the mutants associated with CNS phenotypes failed to reach the cell membrane and were instead retained"
    explanation: >-
      Distinguishes the CNS-associated GJB1 alleles cellularly: those reported to
      cause clinical CNS dysfunction are retained intracellularly rather than
      trafficking to the membrane, suggesting the CNS phenotype tracks a
      trafficking-defective subgroup rather than all loss-of-function alleles.
phenotypes:
- category: Neurological
  name: Distal Muscle Weakness
  description: >-
    Symmetrical length-dependent weakness beginning in foot dorsiflexors and
    intrinsic foot muscles, later involving the hands.
  phenotype_term:
    preferred_term: Distal muscle weakness
    term:
      id: HP:0002460
      label: Distal muscle weakness
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:20301548
    reference_title: "GJB1 Disorders: Charcot-Marie-Tooth Neuropathy (CMT1X) and Central Nervous System Phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "GJB1 disorders are typically characterized by peripheral motor and sensory neuropathy"
    explanation: Establishes motor involvement as a defining feature of the GJB1 phenotype.
- category: Neurological
  name: Distal Amyotrophy
  description: Wasting of intrinsic foot, peroneal and later intrinsic hand muscles.
  phenotype_term:
    preferred_term: Distal amyotrophy
    term:
      id: HP:0003693
      label: Distal amyotrophy
    clinical_course: PROGRESSIVE
- category: Neurological
  name: Distal Sensory Impairment
  description: Length-dependent loss of large- and small-fibre sensory modalities.
  phenotype_term:
    preferred_term: Distal sensory impairment
    term:
      id: HP:0002936
      label: Distal sensory impairment
  evidence:
  - reference: PMID:20301548
    reference_title: "GJB1 Disorders: Charcot-Marie-Tooth Neuropathy (CMT1X) and Central Nervous System Phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "peripheral motor and sensory neuropathy with or without fixed CNS abnormalities"
    explanation: Establishes sensory as well as motor involvement in GJB1 disorders.
- category: Neurological
  name: Hyporeflexia
  description: Depressed or absent tendon reflexes, earliest and most consistently at the ankles.
  phenotype_term:
    preferred_term: Hyporeflexia
    term:
      id: HP:0001265
      label: Hyporeflexia
- category: Neurological
  name: Decreased Motor Nerve Conduction Velocity
  description: >-
    Intermediate slowing of motor conduction velocity — below the axonal range
    but not into the uniformly demyelinating range that characterizes CMT1.
  phenotype_term:
    preferred_term: Decreased motor nerve conduction velocity
    term:
      id: HP:0003431
      label: Decreased motor nerve conduction velocity
- category: Musculoskeletal
  name: Pes Cavus
  description: >-
    High-arched foot with clawed toes, the classic secondary skeletal deformity
    of chronic length-dependent denervation.
  phenotype_term:
    preferred_term: Pes cavus
    term:
      id: HP:0001761
      label: Pes cavus
- category: Neurological
  name: Steppage Gait
  description: Compensatory high-stepping gait secondary to foot drop.
  phenotype_term:
    preferred_term: Steppage gait
    term:
      id: HP:0003376
      label: Steppage gait
- category: Neurological
  name: Transient CNS Dysfunction Episodes
  description: >-
    Acute, self-limited, fully reversible episodes of central nervous system
    dysfunction — most often weakness and dysarthria, occasionally presenting as
    stroke-like episodes. Distinctive to CMTX1 among the CMT compartments and
    attributable to oligodendrocyte connexin-32 loss.
  phenotype_term:
    preferred_term: Transient neurological dysfunction with dysarthria
    term:
      id: HP:0001260
      label: Dysarthria
    temporality: TRANSIENT
  evidence:
  - reference: PMID:20301548
    reference_title: "GJB1 Disorders: Charcot-Marie-Tooth Neuropathy (CMT1X) and Central Nervous System Phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Less commonly, initial manifestations in some affected individuals are stroke-like episodes (acute fulminant episodes of reversible CNS dysfunction)."
    explanation: Establishes reversible stroke-like CNS episodes as a recognized GJB1 presentation.
- category: Neurological
  name: Central White Matter Abnormality
  description: >-
    Fixed CNS white-matter abnormality on imaging, distinct from the transient
    episodes and likewise attributable to oligodendrocyte connexin-32 loss.
  phenotype_term:
    preferred_term: Abnormal CNS myelination
    term:
      id: HP:0011400
      label: Abnormal CNS myelination
  evidence:
  - reference: PMID:20301548
    reference_title: "GJB1 Disorders: Charcot-Marie-Tooth Neuropathy (CMT1X) and Central Nervous System Phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "peripheral motor and sensory neuropathy with or without fixed CNS abnormalities"

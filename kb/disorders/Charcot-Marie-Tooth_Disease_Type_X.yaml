inheritance:
- name: X-linked dominant (CMTX1, CMTX6)
  description: >-
    CMTX1 and CMTX6 are transmitted in an X-linked dominant manner. Affected
    males transmit the variant to all daughters and no sons; heterozygous
    females have a 50% transmission risk to each child. Hemizygous males are
    consistently affected, whereas heterozygous females range from asymptomatic
    to mild-to-moderate and progressive. Skewed X-inactivation across the Schwann
    cell population is the traditional explanation for that variability, but it
    is not supported by the only direct measurement in affected nerve (see the
    refuting evidence below), and no alternative mechanism is established.
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  evidence:
  - reference: PMID:20301548
    reference_title: "GJB1 Disorders: Charcot-Marie-Tooth Neuropathy (CMT1X) and Central Nervous System Phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Affected males transmit the GJB1 pathogenic variant to all of their daughters and none of their sons."
    explanation: States the X-linked transmission pattern for GJB1 disorders.
  - reference: PMID:20301548
    reference_title: "GJB1 Disorders: Charcot-Marie-Tooth Neuropathy (CMT1X) and Central Nervous System Phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although both men and women are affected, manifestations tend to be less severe in women, some of whom may remain asymptomatic."
    explanation: Documents the milder and more variable female phenotype in GJB1 disorders.
  - reference: PMID:40759929
    reference_title: "Random X chromosome inactivation in female Charcot-Marie-Tooth disease type X1: insights from archived sural nerve biopsies."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "our findings suggest that XCI does not contribute to phenotypic variability in female CMTX1 patients"
    explanation: >-
      Directly refutes skewed X-inactivation as the explanation for female
      phenotypic variability. A HUMARA assay on archived sural nerve from two
      female CMTX1 patients found a random inactivation pattern no different
      from controls. This is a two-patient pilot, so it weakens rather than
      settles the hypothesis, but it is the only measurement made in the
      affected tissue, which is why this entry declines to assert mosaicism.
- name: X-linked recessive (CMTX2, CMTX3, CMTX4, CMTX5)
  description: >-

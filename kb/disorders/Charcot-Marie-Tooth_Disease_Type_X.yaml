    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Reduced PRPS1 Enzyme Activity
  biological_scale: MOLECULAR
  description: >-
    CMTX5-associated PRPS1 variants impair the enzyme supplying phosphoribosyl pyrophosphate for nucleotide
    biosynthesis. Reduced activity was demonstrated in cultured skin fibroblasts from three p.Met115Thr
    patients. The study did not directly measure nucleotide depletion in neurons. The clinical phenotype
    includes neuropathy, prelingual hearing loss and optic neuropathy, with both axonal and segmental
    myelin changes reported.
  evidence:
  - reference: PMID:17701900
    reference_title: "Mutations in PRPS1, which encodes the phosphoribosyl pyrophosphate synthetase enzyme critical for nucleotide biosynthesis, cause hereditary peripheral neuropathy with hearing loss and optic neuropathy (cmtx5)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: PRPS enzyme activity, determined by measuring the degree of generation of AMP, the end product of PRPS enzyme, in cultured fibroblasts.
    explanation: >-
      Specifies the experimental system underlying the enzyme-activity result.
  - reference: PMID:17701900
    reference_title: "Mutations in PRPS1, which encodes the phosphoribosyl pyrophosphate synthetase enzyme critical for nucleotide biosynthesis, cause hereditary peripheral neuropathy with hearing loss and optic neuropathy (cmtx5)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The activity was decreased in patients with CMTX5 (CMTX5:IV-1, IV-11, and III-18) compared with unaffected family members and unrelated control individuals
    explanation: >-
      Reduced activity was measured in cultured fibroblasts, not directly in peripheral neurons.
  subtypes:
  - CMTX5
  genes: *id005
  downstream:
  - target: Peripheral Axonal Degeneration
    description: >-
      PRPS1 deficiency is associated with neuropathy, but the steps linking the fibroblast enzyme defect
      to nerve degeneration remain unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Sensorineural Hearing Impairment
    description: >-
      The PRPS1 loss-of-function syndrome includes early hearing loss; tissue-selective intermediates
      are unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Optic Neuropathy
    description: >-
      Optic neuropathy is part of the PRPS1-associated syndrome; selective optic-nerve injury remains

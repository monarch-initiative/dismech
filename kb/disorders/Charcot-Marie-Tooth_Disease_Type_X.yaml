    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: CMTX3 Interchromosomal Insertion
  biological_scale: MOLECULAR
  description: >-
    A 77,856-bp segment from 8q24.3 is inserted at intergenic Xq27.1 in two related CMTX3 families. The
    inserted segment includes part of ARHGAP39; physical overlap does not establish ARHGAP39 as the causal
    gene. The insertion segregated in 25 affected males and 30 carrier females and was absent from tested
    unaffected relatives and controls.
  evidence:
  - reference: PMID:27438001
    reference_title: Whole Genome Sequencing Identifies a 78 kb Insertion from Chromosome 8 as the Cause of Charcot-Marie-Tooth Neuropathy CMTX3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The 78 kb insertion originates from chromosome 8q24.3, segregates fully with the disease in the two families, and is absent from the general population
    explanation: >-
      Establishes the segregating structural lesion, without assigning a causal target gene.
  subtypes:
  - CMTX3
  genetic_context:
    variant_type: insertion
    affected_regions:
    - name: CMTX3 insertion site
      chromosomal_region: Xq27.1
      description: Intergenic insertion site of the chromosome 8q24.3 segment.

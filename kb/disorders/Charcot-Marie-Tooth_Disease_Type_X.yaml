      label: PRPS1
- name: CMTX6
  display_name: CMTX6 (PDK3-related)
  subtype_term:
    preferred_term: Charcot-Marie-Tooth disease X-linked dominant 6
    term:
      id: MONDO:0010479
      label: Charcot-Marie-Tooth disease X-linked dominant 6
  description: >-
    PDK3-related predominantly axonal motor and sensory neuropathy with variable mild conduction slowing.
    In the founding family, males had childhood onset and greater severity; females were asymptomatic
    or mildly affected. Recombinant p.Arg158His PDK3 showed increased kinase activity and affinity for
    the E2p lipoyl domain. Reduced neuronal pyruvate oxidation was proposed, rather than directly measured
    in that study.
  evidence:
  - reference: PMID:23297365
    reference_title: "A new locus for X-linked dominant Charcot-Marie-Tooth disease (CMTX6) is caused by mutations in the pyruvate dehydrogenase kinase isoenzyme 3 (PDK3) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing identified a missense mutation c.G473A (p.R158H) in the pyruvate dehydrogenase kinase isoenzyme 3 (PDK3) gene."
    explanation: Establishes the PDK3 p.R158H variant as the cause of X-linked dominant CMTX6.
  - reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC3596851/
    reference_title: A new locus for X-linked dominant Charcot–Marie–Tooth disease (CMTX6) is caused by mutations in the pyruvate dehydrogenase kinase isoenzyme 3 (PDK3) gene
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The neurophysiologic phenotype is a predominantly axonal motor and sensory polyneuropathy with variable mild conduction slowing.
    explanation: >-
      Defines the founding CMTX6 family neurophysiology.
  genes: &id003
  - preferred_term: PDK3
    term:
      id: hgnc:8811
      label: PDK3

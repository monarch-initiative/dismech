- name: AAV9-Mediated Schwann-Cell-Targeted GJB1 Gene Replacement
  description: >-
    Investigational AAV9-Mpz-GJB1 gene replacement was tested in Gjb1-null mice, using lumbar intrathecal
    administration before onset at two months and after onset at six months. Compared with mock-vector
    controls, treatment improved grip strength, conduction velocity, myelin pathology and selected blood
    biomarkers. Correction was partial; CMAP amplitudes did not improve significantly and late-treatment
    conduction velocities remained below wild-type values. Schwann-cell-specific expression does not establish
    treatment of CNS episodes. These experiments provide no human efficacy or safety result.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Cx32 Loss of Function in Schwann Cells
    treatment_effect: RESTORES
    description: Restores Cx32 expression in a subset of myelinating Schwann cells in the knockout model.
  evidence:
  - reference: PMID:33692503
    reference_title: "AAV9-mediated Schwann cell-targeted gene therapy rescues a model of demyelinating neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "demonstrated improved motor performance and sciatic nerve conduction velocities along with improved myelination and reduced inflammation in peripheral nerve tissues"
    explanation: >-
      Preclinical efficacy in the Gjb1-null mouse, pre- and post-onset. Model
      organism evidence only - this is not a human treatment claim.
  - reference: PMID:33692503
    reference_title: AAV9-mediated Schwann cell-targeted gene therapy rescues a model of demyelinating neuropathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: However, morphological improvement in treated mice was only partial, as demonstrated by the comparison to WT tissues
    explanation: >-
      Retains the limitation of the mouse rescue.
- name: Cochlear Implantation
  description: >-
    Cochlear implantation can be considered for severe hearing impairment or auditory neuropathy after
    individual audiological assessment. A four-case series included GJB1-associated disease, AIFM1-related
    auditory neuropathy, PRPS1-associated CMTX5 and one indeterminate CMT subtype with multiple sclerosis.
    The AIFM1 case does not by itself establish the Cowchock subtype. Outcomes ranged from improved speech
    perception to sound awareness without speech gains. Age, genotype and auditory deprivation differed
    between cases, so the series does not isolate an effect of early implantation.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:

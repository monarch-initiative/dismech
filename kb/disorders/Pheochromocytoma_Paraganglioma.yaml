- name: Noradrenergic and Dopaminergic Secretory Phenotype
  biological_scale: CELLULAR
  role: effector
  description: >-
    SDHx-related and other Cluster 1 tumors, and parasympathetic head-and-neck
    paragangliomas, lack or downregulate phenylethanolamine N-methyltransferase
    (PNMT), the cortisol-dependent enzyme that converts norepinephrine to
    epinephrine and which requires the adrenal cortical microenvironment. They
    therefore secrete norepinephrine (measured as normetanephrine) and sometimes
    dopamine (measured as 3-methoxytyramine) rather than epinephrine. Many
    head-and-neck parasympathetic paragangliomas are biochemically silent
    altogether and present as a painless neck mass or with cranial-nerve palsy,
    not with catecholamine symptoms - which is precisely why a normal metanephrine
    panel cannot exclude them.
  biological_processes:
  - preferred_term: catecholamine biosynthetic process
    modifier: ABNORMAL
    term:
      id: GO:0042423
      label: catecholamine biosynthetic process
  evidence:
  - reference: PMID:32617052
    reference_title: "Pheochromocytoma and Paraganglioma: From Epidemiology to Clinical Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Almost all tumors with mutations in cluster 1 are tumors with a
      noradrenergic biochemical phenotype. These produce norepinephrine and
      dopamine, not epinephrine.
    explanation: >-
      Establishes the Cluster 1 noradrenergic/dopaminergic secretory phenotype
      that defines this node.
  - reference: PMID:32617052
    reference_title: "Pheochromocytoma and Paraganglioma: From Epidemiology to Clinical Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PGLs, on the other hand, are not able to synthesize epinephrine since they
      do not contain the PNMT enzyme. They only secrete norepinephrine.
    explanation: >-
      Gives the PNMT-absence mechanism underlying the noradrenergic profile of
      extra-adrenal paraganglioma.
  - reference: PMID:32617052
    reference_title: "Pheochromocytoma and Paraganglioma: From Epidemiology to Clinical Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, approximately 2/3 of PGLs of parasympathetic origin in the head
      and neck region are not endocrine active.
    explanation: >-
      Supports the biochemically silent head-and-neck presentation and hence the
      statement that a normal metanephrine panel cannot exclude these tumors.
  downstream:
  - target: Catecholamine Hypersecretion
    description: >-
      Where the tumor is secretory, the released amine is predominantly
      norepinephrine and/or dopamine.
- name: Adrenergic Secretory Phenotype
  biological_scale: CELLULAR
  role: effector
  description: >-
    Cluster 2 (RET/NF1/TMEM127) and other adrenal tumors retain PNMT expression
    and secrete epinephrine, measured as metanephrine. The adrenergic versus
    noradrenergic split is the basis on which a fractionated metanephrine panel
    becomes genotype-informative rather than merely diagnostic: a
    metanephrine-predominant pattern points toward RET/NF1, a
    normetanephrine-predominant pattern toward VHL/SDHx, and a
    3-methoxytyramine elevation toward SDHx and dopaminergic, often metastatic,
    disease.
  biological_processes:
  - preferred_term: catecholamine biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0042423
      label: catecholamine biosynthetic process
  evidence:

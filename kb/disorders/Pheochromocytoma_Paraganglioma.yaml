      explanation: >-
        Source of the ascertainment-adjusted SDHB penetrance estimates; markedly
        lower than the historical clinically ascertained figures.
    - reference: PMID:29386252
      reference_title: Tumour risks and genotype-phenotype correlations associated with germline variants in succinate dehydrogenase subunit genes SDHB, SDHC and SDHD.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Risk of malignant disease at age 60 years in non-proband SDHB mutation
        carriers was 4.2%(95% CI 1.1% to 7.2%).
      explanation: >-
        Quantifies the absolute metastatic risk that drives the intensive SDHB

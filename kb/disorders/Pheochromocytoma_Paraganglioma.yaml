discussions:
- discussion_id: sdhb_penetrance_ascertainment_bias
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the true age-related penetrance of SDHB pathogenic variants in
    carriers ascertained without a personal or family history of tumor?
  attaches_to:
  - pathophysiology#Metastatic Progression
  rationale: >-
    Early penetrance and metastatic-risk estimates for SDHB were derived from
    clinically ascertained index cases and affected families, which
    systematically overestimates risk. Later cascade-testing and population
    series have revised penetrance substantially downward. This matters
    practically rather than academically: surveillance intensity, the age at
    which imaging starts, and the counselling given to an unaffected relative who
    tests positive all depend on which estimate is used. The gap is widening as
    incidental identification of SDHB variants on broad panels becomes common.
  proposed_experiments:
  - experiment_id: exp_sdhb_unbiased_population_penetrance_cohort
    name: Unbiased population-ascertained SDHB carrier penetrance cohort
    description: >-
      Prospective follow-up of unselected SDHB carriers identified through
      population-scale biobank sequencing rather than clinical referral, with
      standardized imaging, reporting age-specific cumulative incidence
      separately for carriers with and without a family history.
- discussion_id: cluster_prediction_of_belzutifan_response
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does molecular cluster assignment (Cluster 1A SDHx/FH versus Cluster 1B
    VHL/EPAS1 versus Cluster 2 kinase-signaling) predict response to HIF-2alpha
    inhibition with belzutifan?
  attaches_to:
  - pathophysiology#Pseudohypoxia and HIF Activation
  rationale: >-
    The mechanistic rationale for belzutifan is that Cluster 1 tumors are driven
    by HIF-2alpha, which predicts that Cluster 1 disease should respond
    preferentially and that Cluster 2 disease should not. The registrational
    phase 2 trial was not stratified or powered to test this, reporting a 26%
    objective response rate across an unselected advanced-PPGL population. If the
    prediction holds, cluster assignment becomes a treatment-selection biomarker;
    if responses are distributed evenly across clusters, the assumed mechanism of
    benefit in PPGL is incomplete. This is an explicitly open question in the
    current literature.
  proposed_experiments:
  - experiment_id: exp_belzutifan_response_by_molecular_cluster
    name: Belzutifan response stratified by molecular cluster
    description: >-
      Prespecified biomarker analysis of response by germline and somatic driver
      and by transcriptional cluster within belzutifan-treated cohorts, ideally
      pooled across trials to reach adequate numbers in the smaller genotype
      groups.
notes: >-
  Scope and boundary notes. (1) This entry covers the hereditary
  predisposition-syndrome axis (MONDO:0017366) alongside the tumor entity
  (MONDO:0035540) following the curation decision recorded on issue #7475, rather
  than as a separate Disease entry. (2) VHL, MEN2/RET, NF1 and Carney-Stratakis
  are each curated as their own entries; only their PPGL axis is modeled here and
  they are cross-referenced from differential_diagnoses and genetic. (3) No
  icdo_morphology classification is asserted because the closed
  ICDOMorphologyEnum offers only Carcinoma, Adenocarcinoma, Squamous Cell
  Carcinoma, Sarcoma, Leukemia, Lymphoma, Multiple Myeloma, Melanoma, Glioma and
  Embryonal Neoplasm - none of which is a correct parent for paraganglioma
  (ICD-O 8680/1) or pheochromocytoma (8700/0). This is a noted enum gap rather
  than an omission. (4) PGL6 (SLC25A11) and PGL7 (DLST) exist as MONDO/OMIM
  entities but are not modeled as subtypes here; the MONDO records carry no
  definition text, so the locus-to-gene assignment could not be verified to the
  standard applied to PGL1-PGL5 and was deliberately left out rather than
  asserted on recall. (5) Cluster 3 (Wnt-altered) PPGL - somatic MAML3 fusions
  and CSDE1 alterations, roughly 5-7% of tumors and enriched for aggressive
  behavior - is deliberately absent from pathophysiology. Cluster 3 is a
  somatic-only molecular class with no germline predisposition gene, so it falls
  outside the hereditary axis this entry models; it belongs in a future somatic
  molecular-classification pass. The somatic ATRX/TERT aggressive-disease
  markers are, by contrast, recorded - as a modifier of the Metastatic
  Progression node rather than as their own nodes - because ATRX loss is
  specifically enriched in germline-SDHB tumors and therefore bears directly on
  the hereditary axis. (6) Penetrance figures are recorded
  from the ascertainment-adjusted analysis of Andrews et al. 2018
  (PMID:29386252) rather than the higher, widely quoted estimates from
  clinically ascertained pedigrees; see the inheritance section and the
  sdhb_penetrance_ascertainment_bias discussion for why. Per-gene penetrance for
  the non-SDHx loci (VHL, RET, NF1, SDHA, MAX, TMEM127) is not asserted because
  no comparably ascertainment-corrected source was verified for them.

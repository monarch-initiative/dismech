- name: Kinase Signaling Activation
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The Cluster 2 arm, mechanistically distinct from pseudohypoxia. RET
    gain-of-function (MEN2), NF1 loss (neurofibromin is a RAS GTPase-activating
    protein), TMEM127 loss (a negative regulator of mTOR) and MAX loss (the
    obligate MYC dimerization partner) converge on RAS-MAPK and PI3K-AKT-mTOR
    signaling. Cluster 2 tumors are typically adrenal, well-differentiated, and
    adrenergic-secreting, with a low metastatic rate - the clinical mirror image
    of SDHB disease.

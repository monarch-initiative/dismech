pathophysiology:
- name: Succinate Dehydrogenase Complex Dysfunction
  conforms_to: "oncometabolite_dioxygenase_inhibition#Metabolic Enzyme Lesion (TCA Tumor Suppressor Loss or IDH Neomorphic Gain)"
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Mutations in SDHx genes (SDHA, SDHB, SDHC, SDHD, SDHAF2) impair mitochondrial
    complex II function, leading to succinate accumulation. Succinate acts as an
    oncometabolite, inhibiting alpha-ketoglutarate-dependent dioxygenases and
    causing pseudohypoxia and epigenetic dysregulation.
  evidence:
  - reference: PMID:33112834
    reference_title: "Epigenetic and metabolic reprogramming of SDH-deficient paragangliomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SDHx mutations lead to the accumulation of succinate, which acts as an oncometabolite by inhibiting iron(II) and alpha-ketoglutarate-dependent dioxygenases thereby regulating the cell's hypoxic response and epigenetic processes."
    explanation: This abstract connects SDHx mutations to succinate accumulation and dioxygenase inhibition, matching the described mechanism.
  cell_types:
  - preferred_term: chromaffin cell
    term:
      id: CL:0000166
      label: chromaffin cell
  molecular_functions:
  - preferred_term: succinate dehydrogenase activity
    modifier: DECREASED
    term:
      id: GO:0000104
      label: succinate dehydrogenase activity
  locations:
  - preferred_term: adrenal gland
    term:
      id: UBERON:0002369
      label: adrenal gland
  downstream:
  - target: Succinate Accumulation and Oncometabolite Signaling
    description: >-
      Loss of complex II catalytic activity blocks oxidation of succinate to
      fumarate, so succinate accumulates to millimolar concentrations.
- name: Succinate Accumulation and Oncometabolite Signaling
  conforms_to: "oncometabolite_dioxygenase_inhibition#Competitive Inhibition of 2-Oxoglutarate-Dependent Dioxygenases"
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    Succinate accumulating behind the complex II block acts as an oncometabolite.
    Because succinate is a structural analog of 2-oxoglutarate (alpha-ketoglutarate),
    it competitively inhibits the large family of 2-oxoglutarate-dependent
    dioxygenases. This single biochemical event is the branch point from which both
    arms of Cluster 1A pathology derive: inhibition of the TET DNA
    5-methylcytosine dioxygenases and JmjC histone demethylases produces the
    hypermethylator phenotype, while inhibition of the HIF prolyl hydroxylases
    (PHDs) produces pseudohypoxia. The same logic applies to fumarate in
    FH-mutant tumors, which display an 'SDH-like' epigenetic phenotype.
  molecular_functions:
  - preferred_term: 2-oxoglutarate-dependent dioxygenase activity
    modifier: DECREASED
    term:
      id: GO:0016706
      label: 2-oxoglutarate-dependent dioxygenase activity
  cell_types:
  - preferred_term: chromaffin cell
    term:
      id: CL:0000166
      label: chromaffin cell
  evidence:
  - reference: PMID:33112834
    reference_title: "Epigenetic and metabolic reprogramming of SDH-deficient paragangliomas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SDHx mutations lead to the accumulation of succinate, which acts as an oncometabolite by inhibiting iron(II) and alpha-ketoglutarate-dependent dioxygenases thereby regulating the cell's hypoxic response and epigenetic processes."
    explanation: >-
      States the competitive-inhibition mechanism and that it drives both the
      hypoxic-response and epigenetic arms.
  downstream:
  - target: DNA and Histone Hypermethylator Phenotype
    description: >-
      Inhibition of TET dioxygenases and JmjC histone demethylases blocks
      demethylation, producing genome-wide hypermethylation.
  - target: Pseudohypoxia and HIF Activation
    description: >-
      Inhibition of HIF prolyl hydroxylases prevents HIF-alpha hydroxylation and
      VHL-mediated degradation.
- name: DNA and Histone Hypermethylator Phenotype
  conforms_to: "oncometabolite_dioxygenase_inhibition#Impaired Demethylation and Genome-Wide Hypermethylation"
  biological_scale: MOLECULAR
  role: effector
  description: >-
    SDHx-mutant paragangliomas form a distinct methylome cluster characterized by
    genome-wide DNA and histone hypermethylation (a CpG island methylator
    phenotype). Succinate-driven inhibition of 2-oxoglutarate-dependent TET and
    JmjC demethylases silences genes governing neuroendocrine differentiation and
    establishes a migratory phenotype. Epigenetic silencing is most severe in
    SDHB-mutant tumors, which provides the leading mechanistic explanation for why
    SDHB carries the highest metastatic risk. The phenotype is pharmacologically
    reversible with a demethylating agent in model systems.
  biological_processes:
  - preferred_term: epigenetic regulation of gene expression
    modifier: ABNORMAL
    term:
      id: GO:0040029
      label: epigenetic regulation of gene expression
  molecular_functions:
  - preferred_term: DNA 5-methylcytosine dioxygenase activity
    modifier: DECREASED
    term:
      id: GO:0070579
      label: DNA 5-methylcytosine dioxygenase activity
  - preferred_term: histone demethylase activity
    modifier: DECREASED
    term:
      id: GO:0032452
      label: histone demethylase activity
  evidence:
  - reference: PMID:23707781
    reference_title: "SDH mutations establish a hypermethylator phenotype in paraganglioma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Succinate accumulation in SDH-deficient mouse chromaffin cells led to DNA
      hypermethylation by inhibition of 2-OG-dependent histone and DNA
      demethylases and established a migratory phenotype reversed by decitabine
      treatment.
    explanation: >-
      Direct experimental demonstration that succinate inhibits 2-OG-dependent
      demethylases and produces the hypermethylator/migratory phenotype.
  - reference: PMID:23707781
    reference_title: "SDH mutations establish a hypermethylator phenotype in paraganglioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epigenetic silencing was particularly severe in SDHB-mutated tumors,
      potentially explaining their malignancy.
    explanation: >-
      Links severity of the hypermethylator phenotype specifically to SDHB and to
      metastatic behavior.
  downstream:
  - target: Metastatic Progression
    description: >-
      Hypermethylation-driven silencing of differentiation genes and acquisition
      of a migratory phenotype, most marked in SDHB-mutant tumors.
  - target: Noradrenergic and Dopaminergic Secretory Phenotype
    description: >-
      Downregulation of neuroendocrine differentiation genes, including the
      PNMT-dependent maturation required for epinephrine synthesis.
- name: Pseudohypoxia and HIF Activation
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: "oncometabolite_dioxygenase_inhibition#Pseudohypoxic HIF Stabilization"
  description: >-
    Constitutive stabilization of hypoxia-inducible factors (chiefly HIF-2alpha)
    under normoxic conditions - a 'pseudohypoxic' state. Cluster 1A reaches it by
    oncometabolite inhibition of the prolyl hydroxylases; Cluster 1B reaches the
    same node directly, either by loss of the VHL E3 ligase that recognizes
    hydroxylated HIF-alpha, or by gain-of-function EPAS1/HIF2A variants that
    escape hydroxylation. The convergence of these distinct lesions on one node is
    what makes HIF-2alpha a shared druggable target across Cluster 1.
  biological_processes:
  - preferred_term: response to hypoxia
    modifier: INCREASED
    term:
      id: GO:0001666
      label: response to hypoxia
  - preferred_term: peptidyl-proline hydroxylation to 4-hydroxy-L-proline
    modifier: DECREASED
    term:
      id: GO:0018401
      label: peptidyl-proline hydroxylation to 4-hydroxy-L-proline
  evidence:
  - reference: PMID:15652751
    reference_title: "Succinate links TCA cycle dysfunction to oncogenesis by inhibiting HIF-alpha prolyl hydroxylase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      succinate, which accumulates as a result of SDH inhibition, inhibits
      HIF-alpha prolyl hydroxylases in the cytosol, leading to stabilization and
      activation of HIF-1alpha.
    explanation: >-
      The foundational demonstration that succinate inhibits the PHDs, defining
      the pseudohypoxia mechanism.
  - reference: PMID:22931260
    reference_title: "Somatic HIF2A gain-of-function mutations in paraganglioma with polycythemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report two novel somatic gain-of-function mutations in the gene
      encoding hypoxia-inducible factor 2α (HIF2A) in two patients, one presenting
      with paraganglioma and the other with paraganglioma and somatostatinoma,
      both of whom had polycythemia.
    explanation: >-
      Establishes the Cluster 1B EPAS1/HIF2A route to the same pseudohypoxic node,
      with the polycythemia that distinguishes it clinically.
  downstream:
  - target: Angiogenic and Glycolytic Tumor Program
    description: >-
      Stabilized HIF drives transcription of VEGF and glycolytic enzyme genes.
- name: Angiogenic and Glycolytic Tumor Program
  biological_scale: CELLULAR
  role: effector
  conforms_to: "tumor_angiogenesis#Angiogenic Switch and VEGF-Driven Neovascularization"
  description: >-
    HIF-driven transcription of VEGF, PDGF, EPO and glycolytic enzymes produces the
    characteristically hypervascular PPGL and a glycolytic metabolic shift. This
    node is the rationale for both anti-angiogenic multikinase inhibitors and for
    18F-FDG PET avidity, which is highest in SDHx-related disease.
  biological_processes:
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
  - preferred_term: glycolytic process
    modifier: INCREASED
    term:
      id: GO:0006096
      label: glycolytic process
  evidence:
  - reference: PMID:39735644
    reference_title: 'Pheochromocytoma: an updated scoping review from clinical presentation to management and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the pseudohypoxic tumor environment stimulates VEGF synthesis, promoting

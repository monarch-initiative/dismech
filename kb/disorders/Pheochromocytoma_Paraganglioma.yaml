- name: Somatic Loss of Maternal Chromosome 11
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  biological_scale: CELLULAR
  role: mediator
  description: >-
    The mechanistic explanation for the SDHD/SDHAF2 parent-of-origin effect. Both
    genes lie on chromosome 11 (SDHD at 11q23, SDHAF2 at 11q13). Tumorigenesis
    requires loss of the wild-type maternal allele, and in SDHD-linked tumors the
    event is loss of the entire maternal chromosome 11 rather than a focal second
    hit. Because that single event must remove the wild-type copy, a mutation
    inherited from the mother is not usually unmasked, and disease is expressed
    almost exclusively after paternal transmission. Note that this is not simple
    classical imprinting: SDHD shows biallelic expression in several normal
    tissues, and the loss of the co-deleted imprinted 11p15 region is thought to
    contribute.
  locations:
  - preferred_term: adrenal medulla
    term:
      id: UBERON:0001236
      label: adrenal medulla
  evidence:
  - reference: PMID:15064708
    reference_title: "Somatic loss of maternal chromosome 11 causes parent-of-origin-dependent inheritance in SDHD-linked paraganglioma and phaeochromocytoma families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we demonstrate exclusive loss of the entire maternal chromosome 11 in
      SDHD-linked paragangliomas and phaeochromocytomas
    explanation: >-
      Direct demonstration of the somatic event underlying the parent-of-origin
      pattern in SDHD-linked disease.
  downstream:
  - target: Succinate Dehydrogenase Complex Dysfunction
    description: >-
      Loss of the wild-type maternal allele completes biallelic SDHD inactivation
      in the tumor precursor cell.
- name: Chromaffin Cell Tumorigenesis
  biological_scale: TISSUE
  role: consequence
  description: >-
    Clonal expansion of neoplastic chromaffin or glomus cells to form a
    pheochromocytoma (adrenal medulla) or paraganglioma (extra-adrenal sympathetic
    chain, or parasympathetic head-and-neck paraganglia). Genotype largely
    predicts site: SDHB favors extra-adrenal abdominal/thoracic sympathetic
    tumors, SDHD and SDHAF2 favor multifocal head-and-neck parasympathetic tumors,
    and Cluster 2 genes favor bilateral adrenal pheochromocytoma.

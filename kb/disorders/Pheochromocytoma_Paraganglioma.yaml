      label: SDHB
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    penetrance: INCOMPLETE
    penetrance_percentage: 23.9% by age 60 and 30.6% by age 80 (ascertainment-adjusted)
    evidence:
    - reference: PMID:29386252
      reference_title: Tumour risks and genotype-phenotype correlations associated with germline variants in succinate dehydrogenase subunit genes SDHB, SDHC and SDHD.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        With retrospective cohort analysis to adjust for ascertainment, cumulative
        tumour risks for SDHB mutation carriers at ages 60 years and 80 years were

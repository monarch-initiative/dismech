- accession: ega:EGAS50000000988
  title: Transcriptome analysis of 32 pheochromocytoma and paraganglioma samples
  description: Pheochromocytomas and sympathetic paragangliomas (PPGL) are rare neuroendocrine tumors derived from chromaffin tissue of the adrenal medulla and sympathetic paraganglia, respectively. There is at the moment a lack of accurate biomarkers to predict the biologic behavior of a PPGL. The aim of this study was to investigate the biological behavior of localized and metastatic PPGL by comparing the genomic and transcriptomic landscapes of localized and metastatic PPGL, including PPGL samples with a non-metastatic phenotype at initial diagnosis that developed metachronous metastases during follow-up.

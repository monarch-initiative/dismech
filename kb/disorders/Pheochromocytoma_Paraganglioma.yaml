- name: Catecholamine Hypersecretion
  biological_scale: ORGANISM
  role: outcome
  description: >-
    Secreting PPGLs produce excess catecholamines (norepinephrine, epinephrine,
    dopamine), causing characteristic symptoms. The catecholamine profile provides
    clues to underlying genetics: norepinephrine-predominant suggests SDHx/VHL,
    epinephrine-predominant suggests RET/NF1.
  evidence:
  - reference: PMID:32617052
    reference_title: "Pheochromocytoma and Paraganglioma: From Epidemiology to Clinical Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of PCC and sympathetic PGL are endocrine active tumors causing clinical symptoms by secreting excess catecholamines (norepinephrine, epinephrine, dopamine) and their metabolites."
    explanation: "Abstract notes catecholamine-secreting tumors causing clinical symptoms."
  biological_processes:
  - preferred_term: catecholamine biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0042423
      label: catecholamine biosynthetic process
- name: Metastatic Progression
  biological_scale: ORGANISM
  role: outcome
  description: >-
    Metastatic PPGL is defined by the presence of tumor at sites where chromaffin
    tissue is not normally found (bone, liver, lung, lymph node) - the WHO 2022
    endocrine classification retired the benign/malignant dichotomy because all
    PPGL carry some metastatic potential. Risk is dominated by genotype: SDHB is
    the strongest predictor, with FH close behind, and both share the severe
    hypermethylator phenotype. Extra-adrenal primary site, larger tumor size and
    a dopaminergic (3-methoxytyramine-producing) biochemical profile add further
    risk. This node is the reason SDHB carriers receive the most intensive
    lifelong imaging surveillance. Germline risk is compounded by acquired
    somatic events: loss-of-function ATRX mutations recur specifically in
    SDHB-mutant tumors and are an independent outcome marker, and the resulting
    alternative lengthening of telomeres is a candidate therapeutic
    vulnerability. Somatic ATRX/TERT lesions are modeled here as a modifier of
    this node rather than as separate pathophysiology nodes, because they are
    acquired and not part of the germline predisposition axis this entry scopes.
  evidence:
  - reference: PMID:28162975
    reference_title: Comprehensive Molecular Characterization of Pheochromocytoma and Paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our analysis confirmed SDHB germline mutations, ATRX somatic mutations and
      Ki-67 expression as clinical outcome markers
    explanation: >-
      TCGA confirmation that somatic ATRX mutation, alongside germline SDHB, marks
      aggressive clinical behavior.
  - reference: PMID:28162975
    reference_title: Comprehensive Molecular Characterization of Pheochromocytoma and Paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      three tumors had both SDHB germline and ATRX somatic mutations, a
      previously reported association
    explanation: >-
      Documents the co-occurrence of germline SDHB and somatic ATRX that concentrates
      metastatic risk in the SDHB subgroup.
  - reference: PMID:24334767
    reference_title: "Germline mutations in FH confer predisposition to malignant pheochromocytomas and paragangliomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Remarkably, FH-deficient PCC/PGLs display the same pattern of epigenetic
      deregulation as SDHB-mutated malignant PCC/PGL.
    explanation: >-
      Ties the shared hypermethylator phenotype of FH- and SDHB-deficient tumors
      to their shared metastatic tendency.

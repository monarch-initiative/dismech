        label: Autosomal dominant inheritance
- name: PGL4
  display_name: PGL4 - SDHB-related hereditary paraganglioma-pheochromocytoma
  description: >-
    SDHB (1p36) germline loss of function. The clinically most consequential
    locus: extra-adrenal sympathetic (abdominal/thoracic) paraganglioma
    predominates, and SDHB carries by far the highest risk of metastatic disease
    of any PPGL susceptibility gene, which is why it drives the most intensive
    lifelong surveillance. Epigenetic silencing is most severe in SDHB-mutated
    tumors, offering a mechanistic explanation for that malignancy. Standard
    (non-imprinted) autosomal dominant transmission. Also confers risk of renal
    cell carcinoma and gastrointestinal stromal tumor.
  subtype_term:
    preferred_term: pheochromocytoma/paraganglioma syndrome 4
    term:
      id: MONDO:0007273
      label: pheochromocytoma/paraganglioma syndrome 4

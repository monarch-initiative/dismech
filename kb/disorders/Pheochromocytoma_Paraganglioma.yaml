- accession: ega:EGAS00001005861
  title: Single-nuclei gene-expression analysis of pheochromocytoma and paraganglioma links tumor subtypes with tumor microenvironment
  description: Pheochromocytomas and paragangliomas (PCPG) are rare neuroendocrine tumors associated with autonomic nerves. We used single nuclei-RNA-seq (snRNA-seq) for analysis of 30 PCPG representing 13 known driver genes, plus two normal adrenal medullas to dissect cell composition, refine PCPG subtypes and compare PCPG and normal tissue expression. Incorporating bulk-tissue and snRNA-seq data we identified seven PCPG gene-expression subtypes with genotype and cell type associations.

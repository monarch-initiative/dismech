- name: Loss of SDHB Immunohistochemical Staining
  finding_term:
    preferred_term: Loss of SDHB immunohistochemical expression
    term:
      id: NCIT:C156463
      label: Loss of Immunohistochemical Expression of Succinate Dehydrogenase (SDH) B
  diagnostic: true
  description: >-
    SDHB immunohistochemistry is the standard triage tool that decides who needs
    SDHx germline sequencing. Loss of any single SDH subunit destabilizes the
    whole complex II heterotetramer, so SDHB protein is lost from the tumor
    regardless of which SDH subunit gene is mutated - SDHB staining is therefore a
    readout for the entire SDHx group, not just for SDHB. Granular cytoplasmic
    staining is retained in normal cells of the intratumoral fibrovascular network,
    which serves as the internal positive control. Importantly, tumors from
    Cluster 2 and Cluster 1B syndromes (RET/MEN2, VHL, NF1) retain SDHB staining,
    so the stain also discriminates SDHx disease from the other hereditary
    syndromes.
  evidence:
  - reference: PMID:19576851
    reference_title: "An immunohistochemical procedure to detect patients with paraganglioma and phaeochromocytoma with germline SDHB, SDHC, or SDHD gene mutations: a retrospective and prospective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SDHB protein expression was absent in all 102 phaeochromocytomas and
      paragangliomas with an SDHB, SDHC, or SDHD mutation, but was present in all
      65 paraganglionic tumours related to multiple endocrine neoplasia type 2,
      von Hippel-Lindau disease, and neurofibromatosis type 1.
    explanation: >-
      Demonstrates that SDHB IHC loss marks the SDHx group as a whole and is
      retained in MEN2/VHL/NF1 tumors, supporting its use as a discriminating
      triage test.
  - reference: PMID:19576851
    reference_title: "An immunohistochemical procedure to detect patients with paraganglioma and phaeochromocytoma with germline SDHB, SDHC, or SDHD gene mutations: a retrospective and prospective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The sensitivity and specificity of the SDHB immunohistochemistry to detect
      the presence of an SDH mutation in the prospective series were 100% (95% CI
      87-100) and 84% (60-97), respectively.
    explanation: >-
      Quantifies the test performance underpinning the recommendation to sequence
      only SDHB-negative tumors.


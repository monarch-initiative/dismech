has_subtypes:
- name: Pheochromocytoma
  description: >-
    Tumors arising from the adrenal medulla chromaffin cells. Most common site
    of catecholamine-producing paraganglioma. Usually unilateral but bilateral
    in hereditary syndromes.
- name: Sympathetic Paraganglioma
  description: >-
    Extra-adrenal tumors arising from sympathetic ganglia along the paravertebral
    axis (thorax, abdomen, pelvis). Often catecholamine-secreting. SDHB mutations
    associated with high malignancy risk.
- name: Parasympathetic Paraganglioma
  description: >-
    Head and neck paragangliomas arising from parasympathetic ganglia (carotid
    body, jugulotympanic, vagal). Usually non-secreting. SDHD mutations common.
- name: PGL1
  display_name: PGL1 - SDHD-related hereditary paraganglioma-pheochromocytoma
  description: >-
    SDHD (11q23) germline loss of function. The most penetrant head-and-neck
    paraganglioma locus, typically multifocal and frequently non-secretory.
    Disease is expressed almost exclusively after paternal transmission (see the
    inheritance section); the operative somatic event is loss of the entire
    maternal chromosome 11 rather than classical two-hit loss of the SDHD locus
    alone. Metastatic risk is substantially lower than for SDHB/PGL4.
  subtype_term:
    preferred_term: pheochromocytoma/paraganglioma syndrome 1
    term:
      id: MONDO:0008192
      label: pheochromocytoma/paraganglioma syndrome 1
  genes:
  - preferred_term: SDHD
    term:
      id: hgnc:10683
      label: SDHD
  inheritance:
  - name: Autosomal dominant with maternal imprinting
    inheritance_term:
      preferred_term: Autosomal dominant inheritance with maternal imprinting
      term:
        id: HP:0012275
        label: Autosomal dominant inheritance with maternal imprinting
    penetrance: INCOMPLETE
    penetrance_percentage: 43.2% by age 60 (paternally inherited, non-probands)
    parent_of_origin_effect: Paternal transmission required for expression
    evidence:
    - reference: PMID:29386252
      reference_title: Tumour risks and genotype-phenotype correlations associated with germline variants in succinate dehydrogenase subunit genes SDHB, SDHC and SDHD.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        By Kaplan-Meier analysis, the penetrance (cumulative risk of clinically
        apparent tumours) in SDHB and (paternally inherited) SDHD
        mutation-positive non-probands (n=371/67 with detailed clinical
        information) by age 60 years was 21.8% (95% CI 15.2% to 27.9%) and 43.2%
        (95% CI 25.4% to 56.7%), respectively.
      explanation: >-
        Source of the 43.2%-by-60 paternally inherited SDHD penetrance estimate,
        computed in non-probands to limit ascertainment bias.
  evidence:
  - reference: PMID:15064708
    reference_title: "Somatic loss of maternal chromosome 11 causes parent-of-origin-dependent inheritance in SDHD-linked paraganglioma and phaeochromocytoma families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In SDHD (11q23)-linked families, the disease phenotype is expressed only
      upon paternal transmission of the mutation, consistent with maternal
      imprinting.
    explanation: >-
      Establishes the SDHD locus assignment (11q23) and the parent-of-origin
      expression pattern that defines PGL1.
- name: PGL2
  display_name: PGL2 - SDHAF2-related hereditary paraganglioma
  description: >-
    SDHAF2 (also called SDH5, 11q13) germline loss of function. SDHAF2 is an
    assembly factor required for flavination of the SDHA catalytic subunit, so
    its loss disables the SDH complex without mutating a structural subunit. The
    rarest of the PGL loci; presents essentially as multifocal head-and-neck
    paraganglioma, and like PGL1 shows parent-of-origin (paternal transmission)
    expression. Pheochromocytoma is uncommon in this subtype.
  subtype_term:
    preferred_term: pheochromocytoma/paraganglioma syndrome 2
    term:
      id: MONDO:0011121
      label: pheochromocytoma/paraganglioma syndrome 2
  genes:
  - preferred_term: SDHAF2
    term:
      id: hgnc:26034
      label: SDHAF2
  inheritance:
  - name: Autosomal dominant with maternal imprinting
    inheritance_term:
      preferred_term: Autosomal dominant inheritance with maternal imprinting
      term:
        id: HP:0012275
        label: Autosomal dominant inheritance with maternal imprinting
  evidence:
  - reference: PMID:19628817
    reference_title: "SDH5, a gene required for flavination of succinate dehydrogenase, is mutated in paraganglioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Germline loss-of-function mutations in the human SDH5 gene, located on
      chromosome 11q13.1, segregate with disease in a family with hereditary
      paraganglioma, a neuroendocrine tumor previously linked to mutations in
      genes encoding SDH subunits.
    explanation: >-
      Original identification of SDHAF2/SDH5 as the PGL2 gene, including the
      11q13.1 locus assignment.
- name: PGL3
  display_name: PGL3 - SDHC-related hereditary paraganglioma-pheochromocytoma
  description: >-
    SDHC (1q23) germline loss of function. Predominantly head-and-neck
    paraganglioma, usually unifocal, with comparatively low metastatic risk.
    Standard (non-imprinted) autosomal dominant transmission. SDHC promoter
    hypermethylation - rather than germline mutation - is the usual lesion in
    Carney triad, which is a distinct entity.
  subtype_term:
    preferred_term: pheochromocytoma/paraganglioma syndrome 3
    term:
      id: MONDO:0011544
      label: pheochromocytoma/paraganglioma syndrome 3
  genes:

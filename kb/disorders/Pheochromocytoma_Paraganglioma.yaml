biochemical:
- name: Plasma Free Normetanephrine
  notes: >-
    Normetanephrine is the O-methylated metabolite of norepinephrine and is the
    single most informative analyte in hereditary PPGL, because SDHx and VHL
    (Cluster 1) tumors and extra-adrenal sympathetic paragangliomas are
    predominantly noradrenergic. Metabolism to metanephrines occurs continuously
    within the tumor rather than only on episodic catecholamine release, which is
    why fractionated metanephrines outperform measurement of the parent
    catecholamines. Samples should be drawn supine after at least 20-30 minutes of
    rest and interpreted against supine reference intervals; seated sampling is a
    common cause of false positives.
  reference_ranges:
  - loinc_term:
      id: LOINC:57462-4
      label: Normetanephrine Free [Mass/volume] in Serum or Plasma
    upper_bound: 0.9
    unit: nmol/L
    population: adults, supine sampling
    notes: >-
      Widely used adult supine upper reference limit; exact cutoffs are
      assay-, age- and posture-specific and must be taken from the reporting
      laboratory. Recorded here as an interpretive aid, not as a citable
      published interval - no primary citation is attached because the value is a
      laboratory convention rather than a single-study result.
    interpretation_bands:
    - name: Normal
      upper_bound: 0.9
      unit: nmol/L
      abnormal_flag: NORMAL
    - name: Equivocal elevation
      lower_bound: 0.9
      upper_bound: 2.7
      unit: nmol/L
      abnormal_flag: HIGH
      severity: MILD
      interpretation: >-
        Below roughly three times the upper reference limit. This is the band in
        which false positives dominate: confirm by repeating supine and drug-free,
        and consider clonidine suppression before imaging.
    - name: Diagnostic elevation
      lower_bound: 2.7
      unit: nmol/L
      abnormal_flag: CRITICAL_HIGH
      severity: SEVERE
      interpretation: >-
        At or above roughly three to four times the upper reference limit, the
        probability of a PPGL approaches certainty and the workflow moves directly
        to anatomical and functional localization.
- name: Plasma Free Metanephrine
  notes: >-
    Metanephrine is the O-methylated metabolite of epinephrine. Because
    epinephrine synthesis requires PNMT, which depends on the high local cortisol
    of the adrenal cortex, a metanephrine-predominant pattern implies an adrenal
    tumor and points toward the Cluster 2 genes (RET/MEN2, NF1, TMEM127) rather
    than toward SDHx. An isolated normetanephrine rise with a normal metanephrine
    is the expected SDHx/VHL pattern.
  reference_ranges:
  - loinc_term:
      id: LOINC:38494-1
      label: Metanephrine Free [Mass/volume] in Serum or Plasma
    upper_bound: 0.5
    unit: nmol/L
    population: adults, supine sampling
    notes: >-
      Conventional adult supine upper reference limit; assay-specific. Recorded as
      an interpretive aid rather than a citable published interval.
- name: Plasma Free 3-Methoxytyramine
  notes: >-
    The O-methylated metabolite of dopamine, and the reason a modern metanephrine
    panel is run as three analytes rather than two. An isolated or disproportionate
    3-methoxytyramine elevation identifies dopaminergic tumors, which are strongly
    enriched among SDHx-related, extra-adrenal, head-and-neck and metastatic
    disease - the very tumors most likely to be missed by a two-analyte panel,
    since dopamine-only secretors do not raise metanephrine or normetanephrine and
    do not produce the classic hypertensive paroxysms.
  reference_ranges:
  - loinc_term:
      id: LOINC:50140-3
      label: 3-Methoxytyramine [Moles/volume] in Serum or Plasma
    upper_bound: 0.1
    unit: nmol/L
    population: adults, supine sampling
    notes: >-
      Assay-specific upper reference limit, recorded as an interpretive aid.
      3-methoxytyramine is particularly sensitive to dietary interference and
      requires appropriate pre-analytical restriction.
- name: Urinary Catecholamines and Metanephrines
  notes: >-
    24-hour urine collection for catecholamines and metanephrines is an
    alternative biochemical test with high sensitivity.
genetic:
- name: SDHB
  association: Germline Loss-of-Function Mutations
  gene_term:
    preferred_term: SDHB
    term:
      id: hgnc:10681
      label: SDHB
  inheritance:
  - name: Autosomal Dominant
  notes: >-
    SDHB (1p36) mutations are associated with extra-adrenal sympathetic
    paraganglioma and the highest metastatic risk of any PPGL susceptibility
    gene. Lifelong surveillance required. Note that early estimates of both
    penetrance and metastatic rate were derived from clinically ascertained
    index cases and have been revised substantially downward in later
    population- and cascade-testing cohorts; see the discussions section.
  evidence:
  - reference: PMID:15328326
    reference_title: "Distinct clinical features of paraganglioma syndromes associated with SDHB and SDHD gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SDHB mutation carriers have an increased frequency of malignant disease (11/32 vs 0/34, P<.001)."
    explanation: JAMA study demonstrating significantly increased malignancy risk in SDHB mutation carriers compared to SDHD.
- name: SDHD
  association: Germline Loss-of-Function Mutations
  gene_term:
    preferred_term: SDHD
    term:
      id: hgnc:10683
      label: SDHD
  inheritance:
  - name: Autosomal Dominant
  notes: >-
    SDHD (11q23) mutations cause hereditary paraganglioma syndrome with
    predisposition to multifocal head and neck paragangliomas. Disease is
    expressed almost exclusively after paternal transmission; rare exceptions
    with maternal transmission are documented, so this is a strong parent-of-origin
    bias rather than an absolute rule.
  evidence:
  - reference: PMID:15328326
    reference_title: "Distinct clinical features of paraganglioma syndromes associated with SDHB and SDHD gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Head and neck paragangliomas (10/32 vs 27/34, respectively, P<.001) and multifocal (9/32 vs 25/34, respectively, P<.001) tumors were more frequent in carriers of SDHD mutations."
    explanation: JAMA study demonstrating SDHD mutations predispose to head and neck and multifocal paragangliomas.
- name: SDHC
  association: Germline Loss-of-Function Mutations
  gene_term:
    preferred_term: SDHC
    term:
      id: hgnc:10682
      label: SDHC
  inheritance:
  - name: Autosomal Dominant
  notes: >-
    SDHC (1q23) is an uncommon cause of predominantly head-and-neck
    paraganglioma with comparatively low metastatic risk and no parent-of-origin
    effect. Somatic SDHC promoter hypermethylation, rather than germline
    mutation, underlies Carney triad.
- name: SDHA
  association: Germline Loss-of-Function Mutations
  gene_term:
    preferred_term: SDHA
    term:
      id: hgnc:10680
      label: SDHA
  inheritance:
  - name: Autosomal Dominant
  notes: >-
    SDHA (5p15) encodes the catalytic flavoprotein subunit. Monoallelic germline
    loss confers low-penetrance PPGL and GIST predisposition. Biallelic SDHA loss
    causes mitochondrial complex II deficiency with Leigh syndrome, a
    non-neoplastic recessive disease curated separately - the same gene therefore
    supports two mechanistically distinct diseases depending on zygosity.
- name: SDHAF2
  association: Germline Loss-of-Function Mutations
  gene_term:
    preferred_term: SDHAF2
    term:
      id: hgnc:26034
      label: SDHAF2
  inheritance:
  - name: Autosomal Dominant
  notes: >-
    SDHAF2 (11q13) encodes an assembly factor required for flavination of the
    SDHA subunit; its loss disables complex II without mutating a structural
    subunit. The rarest PGL locus, presenting as multifocal head-and-neck
    paraganglioma, and, like SDHD, showing paternal-transmission-dependent
    expression.
  evidence:
  - reference: PMID:19628817
    reference_title: "SDH5, a gene required for flavination of succinate dehydrogenase, is mutated in paraganglioma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Sdh5 is required for SDH-dependent respiration and for Sdh1 flavination
      (incorporation of the flavin adenine dinucleotide cofactor).
    explanation: >-
      Defines the molecular function of SDHAF2/SDH5 that explains how its loss
      phenocopies loss of a structural SDH subunit.
- name: MAX
  association: Germline Loss-of-Function Mutations
  gene_term:
    preferred_term: MAX
    term:
      id: hgnc:6913
      label: MAX
  inheritance:
  - name: Autosomal Dominant
  notes: >-
    MAX (14q23) encodes the obligate dimerization partner of MYC. Loss
    deregulates the MYC-MAX-MXD1 network, placing MAX in the Cluster 2 group.
    Typically bilateral adrenal pheochromocytoma with an appreciable metastatic
    rate; preferential paternal transmission has been suggested but is less well
    established than for SDHD.
  evidence:
  - reference: PMID:21685915
    reference_title: "Exome sequencing identifies MAX mutations as a cause of hereditary pheochromocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sequenced the exomes of three unrelated individuals with hereditary PCC
      (cases) and identified mutations in MAX, the MYC associated factor X gene.
    explanation: Original identification of MAX as a hereditary pheochromocytoma gene.
- name: TMEM127
  association: Germline Loss-of-Function Mutations
  gene_term:
    preferred_term: TMEM127
    term:
      id: hgnc:26038
      label: TMEM127
  inheritance:
  - name: Autosomal Dominant
  notes: >-
    TMEM127 (2q11) is a negative regulator of mTOR; loss produces
    NF1-like kinase-signaling tumors. Usually adrenal, frequently bilateral, low
    metastatic risk. Two-hit inactivation with consistent loss of the wild-type
    allele in tumor DNA.
  evidence:
  - reference: PMID:20154675
    reference_title: "Germline mutations in TMEM127 confer susceptibility to pheochromocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a cohort of 103 samples, we detected truncating germline TMEM127
      mutations in approximately 30% of familial tumors and about 3% of
      sporadic-appearing pheochromocytomas without a known genetic cause.
    explanation: >-
      Quantifies the contribution of TMEM127 to familial and apparently sporadic
      pheochromocytoma.
- name: FH
  association: Germline Loss-of-Function Mutations
  gene_term:
    preferred_term: FH
    term:
      id: hgnc:3700
      label: FH
  inheritance:
  - name: Autosomal Dominant
  notes: >-
    Fumarate hydratase loss produces fumarate accumulation - a second
    oncometabolite acting on the same 2-oxoglutarate-dependent dioxygenases as
    succinate - and therefore an 'SDH-like' hypermethylated, 5-hmC-low,
    2SC-positive tumor. FH belongs mechanistically with Cluster 1A and shares
    SDHB's enrichment for metastatic and multiple tumors. Germline FH also causes
    hereditary leiomyomatosis and renal cell cancer.
  evidence:
  - reference: PMID:24334767
    reference_title: "Germline mutations in FH confer predisposition to malignant pheochromocytomas and paragangliomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinically, metastatic phenotype (P = 0.007) and multiple tumors (P = 0.02)
      were significantly more frequent in patients with FH mutations than those
      without such mutations.
    explanation: >-
      Establishes the metastatic and multifocal enrichment that justifies
      including FH in PPGL genetic testing panels.
- name: EPAS1
  association: Gain-of-Function Variants, Frequently Postzygotic Mosaic
  gene_term:
    preferred_term: EPAS1
    term:
      id: hgnc:3374
      label: EPAS1
  notes: >-
    EPAS1 encodes HIF-2alpha. Gain-of-function variants escape prolyl
    hydroxylation and VHL-mediated degradation, giving Cluster 1B pseudohypoxia
    directly. Characteristically presents as multiple paragangliomas with
    polycythemia, with or without somatostatinoma (Pacak-Zhuang syndrome).
    Frequently postzygotic mosaic rather than germline, so a negative
    blood-derived panel does not exclude it - tumor tissue testing may be needed.
  evidence:
  - reference: PMID:22931260
    reference_title: "Somatic HIF2A gain-of-function mutations in paraganglioma with polycythemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two mutations were associated with increased HIF-2α activity and
      increased protein half-life.
    explanation: >-
      Demonstrates the gain-of-function mechanism placing EPAS1 in Cluster 1B.
- name: VHL
  association: Germline Loss-of-Function Mutations
  gene_term:
    preferred_term: VHL
    term:
      id: hgnc:12687
      label: VHL
  inheritance:
  - name: Autosomal Dominant
  notes: >-
    VHL mutations cause von Hippel-Lindau syndrome with pheochromocytoma risk
    of 10-20%. Associated with clear cell renal cell carcinoma and other tumors.
    Cluster 1B. The full syndrome is curated in the Von Hippel-Lindau Disease
    entry; only the PPGL axis is modeled here.
  evidence:
  - reference: PMID:32617052
    reference_title: "Pheochromocytoma and Paraganglioma: From Epidemiology to Clinical Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 20% of the patients with VHL, PCC usually occurs and is seen at a young age."
    explanation: Documents VHL syndrome as a hereditary cause of pheochromocytoma with ~20% penetrance.
- name: RET
  association: Germline Activating Mutations
  gene_term:
    preferred_term: RET
    term:
      id: hgnc:9967
      label: RET
  inheritance:
  - name: Autosomal Dominant
  notes: >-
    RET mutations in MEN2 syndrome cause pheochromocytoma in approximately
    50% of MEN2A and most MEN2B patients. Typically bilateral and benign.
    Cluster 2, adrenergic secretory profile. The full MEN2 syndrome, including
    medullary thyroid carcinoma and the codon-specific risk stratification that
    drives prophylactic thyroidectomy timing, is curated in the Multiple
    Endocrine Neoplasia Type 2 entry; only the PPGL axis is modeled here.
  evidence:
  - reference: PMID:32388798
    reference_title: "MEN2-related pheochromocytoma: current state of knowledge, specific characteristics in MEN2B, and perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple endocrine neoplasia type 2 (MEN2) is a rare hereditary syndrome due to mutations of the proto-oncogene REarranged during Transfection (RET), defined by the association of medullary thyroid carcinoma (MTC) in almost 100% cases, and pheochromocytoma in roughly 50%"
    explanation: Review establishing RET mutations in MEN2 cause pheochromocytoma in approximately 50% of patients.
- name: NF1
  association: Germline Loss-of-Function Mutations
  gene_term:
    preferred_term: NF1
    term:
      id: hgnc:7765
      label: NF1
  inheritance:
  - name: Autosomal Dominant
  notes: >-
    Neurofibromatosis type 1 is associated with pheochromocytoma in approximately
    1-5% of patients. Usually unilateral and benign. Cluster 2: neurofibromin is
    a RAS GTPase-activating protein, so its loss releases RAS-MAPK signaling.
    Because NF1 is usually diagnosed clinically from its cutaneous and neural
    features, NF1 is often omitted from PPGL gene panels. The full syndrome is
    curated in the Neurofibromatosis Type 1 entry; only the PPGL axis is modeled
    here.
  evidence:
  - reference: PMID:32617052
    reference_title: "Pheochromocytoma and Paraganglioma: From Epidemiology to Clinical Findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PPGL develops in 1-5% of patients with NF-1. Almost all of these tumors are PCC, and PGL occurs rarely."
    explanation: Documents NF1 (neurofibromatosis type 1) as a hereditary cause of PPGL, predominantly pheochromocytoma.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  penetrance_percentage: >-
    SDHB carriers 23.9% by age 60 and 30.6% by age 80 (ascertainment-adjusted
    retrospective cohort analysis); 21.8% by age 60 by Kaplan-Meier analysis of
    non-probands only
  description: >-
    All the established hereditary PPGL susceptibility genes are transmitted in
    an autosomal dominant fashion with respect to the predisposition allele,
    although tumor formation itself requires a somatic second hit. Penetrance is
    incomplete, age-dependent and strongly gene-specific, and estimates from
    clinically ascertained families are systematically higher than those from
    unbiased cascade or population testing. The figures recorded here are the
    ascertainment-adjusted SDHB estimates of Andrews et al. (2018), which are
    deliberately preferred over the widely quoted older values (for example ~50%
    or ~75% by age 50) precisely because those earlier estimates were derived
    from clinically ascertained probands. Recording the corrected numbers rather
    than omitting them is the point of the accompanying
    sdhb_penetrance_ascertainment_bias knowledge-gap discussion, which remains
    open because even the adjusted figures come from tertiary genetics referrals
    rather than a population cohort.
  evidence:
  - reference: PMID:29386252
    reference_title: Tumour risks and genotype-phenotype correlations associated with germline variants in succinate dehydrogenase subunit genes SDHB, SDHC and SDHD.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With retrospective cohort analysis to adjust for ascertainment, cumulative
      tumour risks for SDHB mutation carriers at ages 60 years and 80 years were
      23.9% (95% CI 20.9% to 27.4%) and 30.6% (95% CI 26.8% to 34.7%).
    explanation: >-
      Source of the ascertainment-adjusted SDHB penetrance figures recorded in
      penetrance_percentage.
  - reference: PMID:29386252
    reference_title: Tumour risks and genotype-phenotype correlations associated with germline variants in succinate dehydrogenase subunit genes SDHB, SDHC and SDHD.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall risks of clinically apparent tumours for SDHB mutation carriers are
      substantially lower than initially estimated and will improve counselling
      of affected families.
    explanation: >-
      Supports the statement that clinically ascertained penetrance estimates are
      systematically inflated, which is why the older figures are not recorded here.
  - reference: PMID:16317055
    reference_title: Clinical presentation and penetrance of pheochromocytoma/paraganglioma syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, when all mutation carriers were included (n = 112), the estimated
      age-related penetrance was different for SDHB vs. SDHD mutation carriers (P
      = 0.008).
    explanation: >-
      International SDH Consortium result establishing that penetrance is
      age-dependent and gene-specific, which is why penetrance is recorded
      per-locus on the subtype inheritance blocks rather than as a single
      disease-level figure.
  - reference: PMID:20301715
    reference_title: Hereditary Paraganglioma-Pheochromocytoma Syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each child of an individual with a hereditary PGL/PCC syndrome-causing
      pathogenic variant has a 50% chance of inheriting the pathogenic variant.
    explanation: >-
      GeneReviews statement of the autosomal dominant transmission risk used in
      genetic counselling.
  - reference: PMID:15064708
    reference_title: Somatic loss of maternal chromosome 11 causes parent-of-origin-dependent inheritance in SDHD-linked paraganglioma and phaeochromocytoma families.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In SDHB (1p36)- and SDHC (1q21)-linked families, disease inheritance is
      autosomal dominant.
    explanation: >-
      Establishes standard autosomal dominant transmission for the non-imprinted
      SDHx loci, in contrast to the SDHD parent-of-origin pattern.
- name: Autosomal dominant with maternal imprinting (SDHD, SDHAF2)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance with maternal imprinting
    term:
      id: HP:0012275
      label: Autosomal dominant inheritance with maternal imprinting
  penetrance: INCOMPLETE
  penetrance_percentage: >-
    Paternally inherited SDHD: 43.2% by age 60 (Kaplan-Meier analysis of
    non-probands). Maternally inherited SDHD carriers have a tumour risk
    approaching that of the general population.
  parent_of_origin_effect: >-
    Paternal transmission required for expression in SDHD and SDHAF2 (and
    possibly MAX); a strong bias rather than an absolute rule, since exceptions
    after maternal transmission are documented.
  description: >-
    SDHD- and SDHAF2-related disease shows a striking parent-of-origin effect:
    carriers who inherit the variant from their father are at high risk, while
    those who inherit the same variant from their mother very rarely develop
    tumors. Stated precisely, this is a strong bias and not an absolute law -
    rare, well-documented cases of disease after maternal transmission exist, so
    maternally inheriting carriers should still be counselled and offered
    surveillance rather than discharged. The HPO term 'maternal imprinting'
    denotes silencing of the maternally inherited copy, which is the correct
    orientation here; the underlying somatic event is loss of the entire maternal
    chromosome 11, so the phenomenon is not classical imprinting alone.
  evidence:
  - reference: PMID:15064708
    reference_title: "Somatic loss of maternal chromosome 11 causes parent-of-origin-dependent inheritance in SDHD-linked paraganglioma and phaeochromocytoma families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In SDHD (11q23)-linked families, the disease phenotype is expressed only
      upon paternal transmission of the mutation, consistent with maternal
      imprinting.
    explanation: >-
      States the parent-of-origin pattern and its interpretation as maternal
      imprinting, matching the bound HPO term.
  - reference: PMID:15064708
    reference_title: "Somatic loss of maternal chromosome 11 causes parent-of-origin-dependent inheritance in SDHD-linked paraganglioma and phaeochromocytoma families."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, SDHD shows biallelic expression in brain, kidney and lymphoid
      tissues (Baysal et al., 2000).
    explanation: >-
      Qualifies the imprinting interpretation - SDHD is not uniformly silenced on
      the maternal allele, which is why the mechanism is better explained by
      somatic loss of maternal chromosome 11 than by classical imprinting.
  - reference: PMID:20301715
    reference_title: Hereditary Paraganglioma-Pheochromocytoma Syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathogenic variants in SDHD, SDHAF2, and possibly MAX demonstrate
      parent-of-origin effects and cause disease almost exclusively when they are
      paternally inherited
    explanation: >-
      GeneReviews statement of the parent-of-origin rule, whose wording ('almost
      exclusively') is the basis for stating this as a strong bias rather than an
      absolute law.
  - reference: PMID:20301715
    reference_title: Hereditary Paraganglioma-Pheochromocytoma Syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      an individual who inherits an SDHD or SDHAF2 pathogenic variant from the
      individual's mother is usually not at risk of developing disease
    explanation: >-
      Directly supports counselling maternally inheriting carriers as low-risk but
      not risk-free; GeneReviews immediately qualifies this with 'however,
      exceptions occur'.
treatments:
- name: Surgical Resection
  description: >-
    Complete surgical resection is the primary treatment for localized PPGL.
    Requires careful preoperative alpha-blockade followed by beta-blockade to
    prevent perioperative hypertensive crisis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
  target_mechanisms:
  - target: Chromaffin Cell Tumorigenesis
    treatment_effect: INHIBITS
    description: >-
      Physical removal of the transformed chromaffin-cell mass. This is the only
      curative intervention in the entry and the only one that acts on the tumor
      itself rather than on a downstream signalling or secretory consequence.
  - target: Catecholamine Hypersecretion
    treatment_effect: INHIBITS
    description: >-
      Resection of a functional tumor abolishes the source of catecholamine
      excess, which is why cure of hypertension is the usual postoperative
      endpoint.
  evidence:
  - reference: PMID:24893135
    reference_title: "Pheochromocytoma and paraganglioma: an endocrine society clinical practice guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We recommend minimally invasive adrenalectomy for most pheochromocytomas with open resection for most paragangliomas."
    explanation: Endocrine Society clinical practice guideline recommending surgical resection as primary treatment.
- name: Alpha-Adrenergic Blockade
  description: >-
    Preoperative alpha-blockade with phenoxybenzamine or doxazosin is essential
    to control hypertension and allow volume expansion before surgery. Beta-blockade
    must never be started first: unopposed alpha-adrenergic stimulation after
    beta-blockade can precipitate a hypertensive crisis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phenoxybenzamine
      term:
        id: NCIT:C62065
        label: Phenoxybenzamine
    - preferred_term: doxazosin
      term:
        id: CHEBI:4708
        label: doxazosin
  target_mechanisms:
  - target: Catecholamine Hypersecretion
    treatment_effect: INHIBITS
    description: >-
      Blocks the alpha-adrenergic receptor endpoint of tumor-derived
      catecholamine excess. This is symptomatic control of the secretory
      consequence, not antitumor therapy.
  evidence:
  - reference: PMID:24893135
    reference_title: "Pheochromocytoma and paraganglioma: an endocrine society clinical practice guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "All patients with functional PPGLs should undergo preoperative blockade to prevent perioperative complications."
    explanation: Endocrine Society guideline recommending preoperative alpha blockade for all functional PPGLs.
- name: MIBG Therapy
  description: >-
    131I-MIBG (metaiodobenzylguanidine) is a targeted radiotherapy for MIBG-avid
    metastatic PPGL. MIBG is a guanethidine analogue taken up by the
    noradrenaline transporter, which is what makes it selective for chromaffin
    tumors; roughly half of metastatic PPGLs are avid enough to be treatable.
    High-specific-activity 131I-MIBG (iobenguane I-131) is FDA-approved on the
    strength of a single-arm phase 2 trial in 68 patients whose primary endpoint
    was a durable halving of antihypertensive requirement - an unusual endpoint
    chosen because it measures the secretory burden rather than tumor bulk,
    which is why this treatment is modeled as acting on both the metastatic and
    the secretory nodes.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiopharmaceutical therapy
    term:
      id: NCIT:C192439
      label: Radiopharmaceutical Therapy
    therapeutic_agent:
    - preferred_term: iobenguane I-131
      term:
        id: NCIT:C970
        label: Iobenguane I-131
  target_mechanisms:
  - target: Metastatic Progression
    treatment_effect: INHIBITS
    description: >-
      Delivers targeted beta radiation to noradrenaline-transporter-expressing
      metastatic deposits.
  - target: Catecholamine Hypersecretion
    treatment_effect: INHIBITS
    description: >-
      Reduction of secretory tumor mass lowers circulating catecholamines, which
      was operationalized as the trial's primary endpoint (durable reduction in
      antihypertensive medication requirement).
  evidence:
  - reference: PMID:30291194
    reference_title: Efficacy and Safety of High-Specific-Activity (131)I-MIBG Therapy in Patients with Advanced Pheochromocytoma or Paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 68 patients who received at least 1 therapeutic dose of HSA
      131I-MIBG, 17 (25%; 95% confidence interval, 16%-37%) had a durable
      reduction in baseline antihypertensive medication use.
    explanation: >-
      Primary endpoint of the registrational phase 2 trial, supporting the
      secretory-burden target mechanism.
  - reference: PMID:30291194
    reference_title: Efficacy and Safety of High-Specific-Activity (131)I-MIBG Therapy in Patients with Advanced Pheochromocytoma or Paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 64 patients with evaluable disease, 59 (92%) had a partial response
      or stable disease as the best objective response within 12 mo.
    explanation: >-
      Radiographic disease-control result supporting the antitumor target mechanism.
  - reference: PMID:30291194
    reference_title: Efficacy and Safety of High-Specific-Activity (131)I-MIBG Therapy in Patients with Advanced Pheochromocytoma or Paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The median overall survival was 36.7 mo
    explanation: Survival outcome in the treated advanced-PPGL population.
- name: Temozolomide
  description: >-
    Alkylating chemotherapy showing activity in metastatic PPGL, particularly
    SDHB-mutated tumors with MGMT promoter methylation. The SDHB association is
    mechanistically coherent: the hypermethylator phenotype that makes SDHB
    tumors aggressive also silences the MGMT repair gene, which is what sensitizes
    them to an alkylating agent.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: temozolomide
      term:
        id: CHEBI:72564
        label: temozolomide
  target_mechanisms:
  - target: Metastatic Progression
    treatment_effect: INHIBITS
    description: >-
      Cytotoxic control of metastatic disease, with enhanced activity in the
      MGMT-silenced, hypermethylated SDHB subgroup. Note that the
      hypermethylator node is a predictive biomarker here rather than a drug
      target: SDHB-driven MGMT promoter hypermethylation silences the repair
      enzyme that would otherwise reverse temozolomide's O6-methylguanine
      lesions, so no separate target_mechanisms edge is asserted against it.
  evidence:
  - reference: PMID:24752622
    reference_title: SDHB mutations are associated with response to temozolomide in patients with metastatic pheochromocytoma or paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median PFS was 13.3 months after a median follow-up of 35 months. There
      were five partial responses (33%), seven stable (47%) and three
      progressive diseases (20%).
    explanation: >-
      Efficacy data from the retrospective series of 15 patients with progressive
      metastatic PPGL treated with temozolomide.
  - reference: PMID:24752622
    reference_title: SDHB mutations are associated with response to temozolomide in patients with metastatic pheochromocytoma or paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Partial responses were observed only in patients with mutation in SDHB.
    explanation: >-
      Establishes the SDHB genotype restriction of response that ties this
      treatment to the hypermethylator node.
  - reference: PMID:24752622
    reference_title: SDHB mutations are associated with response to temozolomide in patients with metastatic pheochromocytoma or paraganglioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SDHB germline mutation was associated with hypermethylation of the MGMT
      promoter and low expression of MGMT in 190 samples of the French
      nation-wide independent cohort.
    explanation: >-
      Provides the mechanistic link - MGMT silencing by the SDHB hypermethylator
      phenotype - underpinning the SDHB-restricted response.
- name: Cyclophosphamide-Vincristine-Dacarbazine (CVD) Chemotherapy
  description: >-
    The conventional cytotoxic backbone for rapidly progressive or high-burden
    metastatic PPGL, and the comparator against which every newer systemic
    option is judged. A meta-analysis of four studies (50 patients) found a
    partial tumor-volume response in about 37% and a partial catecholamine
    response in about 40%. The authors are explicit that the studies did not
    define when treatment should start, so part of the apparent benefit may
    reflect the indolent natural history of PPGL - which is precisely why CVD is
    reserved for documented progression rather than used on diagnosis of
    metastatic disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4027
        label: cyclophosphamide
    - preferred_term: vincristine
      term:
        id: CHEBI:28445
        label: vincristine
    - preferred_term: dacarbazine
      term:
        id: CHEBI:4305
        label: dacarbazine
  target_mechanisms:
  - target: Metastatic Progression
    treatment_effect: INHIBITS
    description: >-
      Non-targeted cytotoxic control of metastatic tumor burden.
  - target: Catecholamine Hypersecretion
    treatment_effect: INHIBITS
    description: >-
      Tumor-burden reduction translates into a measurable hormonal response,
      reported separately from the radiographic response in the meta-analysis.
  evidence:
  - reference: PMID:25041164
    reference_title: 'Chemotherapy with cyclophosphamide, vincristine and dacarbazine for malignant paraganglioma and pheochromocytoma: systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Data on the effects of a combination of CVD chemotherapy on malignant
      paraganglioma/pheochromocytoma suggest that a partial response concerning
      tumour volume can be achieved in about 37% of patients and a partial
      response on catecholamine excess in about 40% of patients.
    explanation: >-
      Pooled efficacy estimate supporting both the antitumor and the
      antisecretory target mechanisms.
  - reference: PMID:25041164
    reference_title: 'Chemotherapy with cyclophosphamide, vincristine and dacarbazine for malignant paraganglioma and pheochromocytoma: systematic review and meta-analysis.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, it cannot be excluded that the reported effect of chemotherapy
      on tumour volume reflects the natural course of the disease, at least
      partially.
    explanation: >-
      The authors' own caveat; recorded as PARTIAL because it qualifies rather
      than establishes the efficacy claim.
- name: Cabozantinib
  description: >-
    An antiangiogenic multi-tyrosine-kinase inhibitor (VEGFR2, MET, AXL) with the
    strongest prospective response data of any systemic agent in metastatic PPGL
    outside belzutifan. In the single-arm phase 2 Natalie Trial (NCT02302833,
    17 patients) the overall response rate was 25%. The rationale is the same
    pseudohypoxia-driven angiogenic program that motivates sunitinib, and the
    trial rationale explicitly invokes the SDHB-associated, angiogenesis-high
    phenotype that dominates hereditary metastatic disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: cabozantinib
      term:
        id: CHEBI:72317
        label: cabozantinib
  target_mechanisms:
  - target: Angiogenic and Glycolytic Tumor Program
    treatment_effect: INHIBITS
    description: >-
      Blocks VEGFR2-driven neovascularization downstream of the pseudohypoxic HIF
      program, the same node targeted by sunitinib.
  evidence:
  - reference: PMID:38608693
    reference_title: 'Cabozantinib in patients with unresectable and progressive metastatic phaeochromocytoma or paraganglioma (the Natalie Trial): a single-arm, phase 2 trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall response rate was 25·0% (95% CI 7·3-52·4; four of 16 patients).
    explanation: >-
      Primary efficacy endpoint of the phase 2 Natalie Trial.
  - reference: PMID:38608693
    reference_title: 'Cabozantinib in patients with unresectable and progressive metastatic phaeochromocytoma or paraganglioma (the Natalie Trial): a single-arm, phase 2 trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Up to 50% of MPPGs are associated with germline pathogenic variants of the
      SDHB gene. These tumours and many non-familial MPPGs exhibit a phenotype
      that is characterised by abnormal angiogenesis.
    explanation: >-
      States the hereditary-SDHB and angiogenesis rationale that links this drug
      to the angiogenic-program node.
- name: Sunitinib
  description: >-
    Multi-kinase inhibitor (VEGFR1-3, PDGFR-alpha/beta, KIT, FLT3, RET) with
    antiangiogenic activity in progressive metastatic PPGL. No longer
    prospective-data-poor: FIRSTMAPP, a randomized placebo-controlled phase 2
    trial, met its primary endpoint with a 12-month progression-free survival of
    36% versus 19% on placebo. Sunitinib also hits RET, so it has a second
    rationale in the Cluster 2 kinase arm on top of the Cluster 1 antiangiogenic
    one, though FIRSTMAPP was not powered for a genotype split.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: sunitinib
      term:
        id: CHEBI:38940
        label: sunitinib
  target_mechanisms:
  - target: Angiogenic and Glycolytic Tumor Program
    treatment_effect: INHIBITS
    description: >-
      Inhibits VEGFR/PDGFR signaling downstream of the pseudohypoxic HIF program,
      which is the rationale for anti-angiogenic activity being greatest in
      Cluster 1 tumors.
  - target: Kinase Signaling Activation
    treatment_effect: INHIBITS
    description: >-
      Sunitinib additionally inhibits RET, giving it a secondary rationale
      against the Cluster 2 kinase arm; this is a mechanistic inference from the
      drug's target profile rather than a genotype-stratified trial result.
  evidence:
  - reference: PMID:39735644
    reference_title: 'Pheochromocytoma: an updated scoping review from clinical presentation to management and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      recently reported that Sunitinib achieved the primary endpoint of 12-month
      progression-free survival in 36% of patients with progressive metastatic
      PPGL (90% CI, 23 –50%), compared to 19% in the placebo group (90% CI, 11
      –31%).
    explanation: >-
      FIRSTMAPP, a phase II randomized placebo-controlled trial, is the source of
      this result; it establishes sunitinib efficacy in progressive metastatic
      PPGL. The quote begins at 'recently reported' because the preceding words
      'placebo- controlled' carry a PDF line-break artifact in the cache, and the
      en-dashes in the confidence intervals are the cache's own U+2013
      characters, reproduced verbatim.
  - reference: PMID:39735644
    reference_title: 'Pheochromocytoma: an updated scoping review from clinical presentation to management and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sunitinib, which inhibits VEGF1, VEGF2, VEGF3, PDGF-alpha, PDGF-beta, c- kit, fms-related tyrosine kinase 3, and RET proto-oncogene receptors, has demonstrated potential in reducing angiogenesis and tumor cell growth."
    explanation: >-
      Target profile supporting both the antiangiogenic and the RET/Cluster 2
      target mechanisms. (The space inside 'c- kit' is a PDF line-break artifact
      of the cached full text, reproduced verbatim so the snippet matches; kept
      on a single quoted line because a folded scalar cannot end a line in a
      hyphen.)
- name: Belzutifan
  description: >-
    A HIF-2alpha inhibitor that disrupts the HIF-2alpha/HIF-1beta heterodimer,
    directly antagonizing the pseudohypoxic node on which every Cluster 1 lesion
    converges. In the phase 2 LITESPARK-015 trial in advanced PPGL it produced a
    26% confirmed objective response rate with 85% disease control and a median
    progression-free survival of 22.3 months. Notably, a third of participants on
    antihypertensives were able to halve at least one agent, indicating the drug
    also reduces the secretory burden and not only tumor bulk. Grade 3 anemia
    (an on-target consequence of HIF-2-driven erythropoietin suppression) occurred
    in 22%.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: belzutifan
      term:
        id: NCIT:C135627
        label: Belzutifan
  target_mechanisms:
  - target: Pseudohypoxia and HIF Activation
    treatment_effect: INHIBITS
    description: >-
      Directly inhibits HIF-2alpha, the shared convergence point of Cluster 1A
      (oncometabolite-mediated PHD inhibition) and Cluster 1B (VHL/EPAS1)
      lesions. This is the drug-target pattern that makes the pseudohypoxia node
      clinically actionable.
  evidence:
  - reference: PMID:41124218
    reference_title: "Belzutifan for Advanced Pheochromocytoma or Paraganglioma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most cases of metastatic pheochromocytoma and paraganglioma are driven by
      dysregulation of the hypoxia-inducible factor 2α (HIF-2α) pathway.
    explanation: >-
      States the mechanistic rationale linking the treatment to the pseudohypoxia
      pathophysiology node.

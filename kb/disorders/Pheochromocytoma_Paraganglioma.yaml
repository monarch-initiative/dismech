- name: MAX-related
  display_name: MAX-related tumor predisposition
  description: >-
    MAX (14q23) germline loss of function. A Cluster 2 (kinase-signaling/MYC
    network) rather than pseudohypoxic subtype: MAX is the obligate dimerization
    partner of MYC, and its loss deregulates the MYC-MAX-MXD1 network. Typically
    bilateral adrenal pheochromocytoma with a noradrenergic secretory profile,
    and an appreciable metastatic rate. Preferential paternal transmission has
    been reported, though this is a weaker and less well-established effect than
    the SDHD/SDHAF2 parent-of-origin phenomenon.
  subtype_term:
    preferred_term: MAX-related tumor predisposition
    term:
      id: MONDO:0700346
      label: MAX-related tumor predisposition
  genes:
  - preferred_term: MAX
    term:
      id: hgnc:6913
      label: MAX
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:21685915
    reference_title: "Exome sequencing identifies MAX mutations as a cause of hereditary pheochromocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A follow-up study of a selected series of 59 cases with PCC identified
      five additional MAX mutations and suggested an association with malignant
      outcome and preferential paternal transmission of MAX mutations.
    explanation: >-
      Identifies MAX as a hereditary pheochromocytoma gene and reports both the
      malignant-outcome association and the preferential paternal transmission
      (stated by the authors as a suggestion, not an established rule).
- name: TMEM127-related
  display_name: TMEM127-related tumor predisposition
  description: >-
    TMEM127 (2q11) germline loss of function. A Cluster 2 kinase-signaling
    subtype: TMEM127 is a negative regulator of mTOR, and TMEM127-mutant tumors
    are transcriptionally akin to NF1-mutant tumors and show hyperphosphorylation
    of mTOR effectors. Usually adrenal, frequently bilateral pheochromocytoma
    with an adrenergic secretory profile and a low metastatic rate. Also confers
    renal cell carcinoma risk.
  subtype_term:
    preferred_term: TMEM127-related tumor predisposition
    term:
      id: MONDO:0700345
      label: TMEM127-related tumor predisposition
  genes:
  - preferred_term: TMEM127
    term:
      id: hgnc:26038
      label: TMEM127
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20154675
    reference_title: "Germline mutations in TMEM127 confer susceptibility to pheochromocytoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pheochromocytomas with mutations in TMEM127 are transcriptionally related
      to tumors bearing NF1 mutations and, similarly, show hyperphosphorylation
      of mammalian target of rapamycin (mTOR) effector proteins.
    explanation: >-
      Establishes TMEM127 as a PPGL susceptibility gene acting through mTOR,
      placing it in the kinase-signaling (Cluster 2) group alongside NF1.

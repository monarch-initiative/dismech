differential_diagnoses:
- name: Von Hippel-Lindau disease
  description: >-
    VHL is itself one of the hereditary PPGL genes (Cluster 1B), so the question
    is rarely 'PPGL or VHL' but rather whether a PPGL is the presenting feature of
    VHL disease. VHL-related pheochromocytoma is usually adrenal, often bilateral,
    noradrenergic, and has low metastatic potential.
  distinguishing_features:
  - >-
    Presence of the wider VHL tumor spectrum - retinal and CNS hemangioblastoma,
    clear cell renal cell carcinoma, pancreatic neuroendocrine tumor,
    endolymphatic sac tumor.
  - >-
    SDHB immunohistochemistry is retained (positive) in VHL tumors and lost in
    SDHx tumors, which resolves the distinction on the resection specimen.
  disease_term:
    preferred_term: von Hippel-Lindau disease
    term:
      id: MONDO:0008667
      label: von Hippel-Lindau disease
  notes: Curated in full as a separate entry (Von_Hippel-Lindau_Disease).
  evidence:
  - reference: PMID:19576851
    reference_title: "An immunohistochemical procedure to detect patients with paraganglioma and phaeochromocytoma with germline SDHB, SDHC, or SDHD gene mutations: a retrospective and prospective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SDHB protein expression was absent in all 102 phaeochromocytomas and
      paragangliomas with an SDHB, SDHC, or SDHD mutation, but was present in all
      65 paraganglionic tumours related to multiple endocrine neoplasia type 2,
      von Hippel-Lindau disease, and neurofibromatosis type 1.
    explanation: >-
      Supports SDHB immunohistochemistry as the discriminator between SDHx disease
      and the VHL/MEN2/NF1 syndromes.
- name: Multiple endocrine neoplasia type 2
  description: >-
    RET-driven MEN2 accounts for a substantial share of hereditary
    pheochromocytoma. Pheochromocytoma occurs in roughly half of MEN2A patients
    and most MEN2B patients, and is typically bilateral, adrenal, adrenergic and
    rarely metastatic.
  distinguishing_features:
  - >-
    Medullary thyroid carcinoma (near-universal in MEN2 and usually the
    presenting tumor), hyperparathyroidism in MEN2A, and the mucosal
    neuroma/marfanoid habitus of MEN2B.
  - >-
    Biochemically metanephrine-predominant (adrenergic), whereas SDHx disease is
    normetanephrine-predominant. SDHB staining is retained.
  disease_term:
    preferred_term: multiple endocrine neoplasia type 2
    term:
      id: MONDO:0019003
      label: multiple endocrine neoplasia type 2
  notes: Curated in full as a separate entry (Multiple_Endocrine_Neoplasia_Type_2).
- name: Neurofibromatosis type 1
  description: >-
    NF1 confers a small (roughly 1-5%) lifetime pheochromocytoma risk. Because
    NF1 is diagnosed clinically it is frequently absent from PPGL gene panels, so
    the diagnosis rests on recognizing the syndrome rather than on sequencing.
  distinguishing_features:
  - >-
    Cafe-au-lait macules, skinfold freckling, cutaneous and plexiform
    neurofibromas, Lisch nodules, optic pathway glioma.
  - NF1-related tumors are adrenal and adrenergic, and retain SDHB staining.
  disease_term:
    preferred_term: neurofibromatosis type 1
    term:
      id: MONDO:0018975
      label: neurofibromatosis type 1
  notes: Curated in full as a separate entry (Neurofibromatosis_Type_1).
- name: Carney-Stratakis syndrome
  description: >-
    The dyad of paraganglioma and gastrointestinal stromal tumor caused by
    germline SDHB, SDHC or SDHD variants. This is not a separate mechanism from
    hereditary PPGL but a phenotypic presentation of the same SDHx lesion, and
    the boundary is defined by the presence of GIST.
  distinguishing_features:
  - >-
    Co-occurrence of SDH-deficient (KIT/PDGFRA-wildtype, gastric, epithelioid)
    GIST with paraganglioma in a germline SDHx carrier.
  - >-
    Distinguished from Carney triad, which adds pulmonary chondroma, shows strong
    female predominance, is usually caused by somatic SDHC promoter
    hypermethylation rather than a germline variant, and is typically not
    inherited.
  disease_term:
    preferred_term: Carney-Stratakis syndrome
    term:
      id: MONDO:0011740
      label: Carney-Stratakis syndrome
  notes: Curated in full as a separate entry (Carney-Stratakis_Syndrome).
- name: Essential hypertension
  description: >-
    By far the most common alternative explanation for the presenting complaint.
    PPGL accounts for well under 1% of hypertension in outpatient practice, so
    the pre-test probability is low and false-positive biochemistry is a real
    clinical hazard.
  distinguishing_features:
  - >-
    Absence of paroxysmal symptoms, normal fractionated metanephrines, and no
    adrenal or extra-adrenal mass on imaging.
  - >-
    Metanephrine elevations below about three times the upper reference limit are
    more often explained by posture, stress, or interfering medication (tricyclics,
    MAO inhibitors, sympathomimetics) than by a tumor.
- name: Panic disorder and anxiety disorders
  description: >-
    Episodic palpitations, sweating, tremor and a sense of impending doom overlap
    closely with catecholamine paroxysms, and this overlap is a frequent cause of
    diagnostic delay in both directions.
  distinguishing_features:
  - >-
    Panic attacks are typically not accompanied by the marked objective
    hypertension and pallor of a catecholamine paroxysm; flushing is more typical
    of anxiety.
  - Fractionated metanephrines are normal.
- name: Carcinoid syndrome and other neuroendocrine tumors
  description: >-
    Other neuroendocrine tumors can produce episodic vasoactive symptoms and,
    like PPGL, are somatostatin-receptor-positive on 68Ga-DOTATATE PET, so
    functional imaging alone does not separate them.
  distinguishing_features:
  - >-
    Carcinoid syndrome causes flushing and secretory diarrhea rather than pallor
    and hypertension.
  - >-
    Associated with elevated urinary 5-HIAA and chromogranin A rather than
    fractionated metanephrines.
- name: Adrenocortical adenoma or carcinoma
  description: >-
    The commonest competing diagnosis for an incidentally discovered adrenal
    mass. Distinguishing these before surgery matters, because operating on an
    unrecognized pheochromocytoma without alpha-blockade risks intraoperative
    hypertensive crisis.
  distinguishing_features:
  - >-
    Adrenocortical lesions are lipid-rich with low unenhanced CT attenuation
    (10 Hounsfield units or less) and rapid contrast washout, whereas
    pheochromocytomas are lipid-poor and markedly T2-hyperintense on MRI.
  - >-
    Every adrenal incidentaloma should have metanephrines measured before any
    planned resection or biopsy.

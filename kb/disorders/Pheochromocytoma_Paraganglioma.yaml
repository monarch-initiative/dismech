    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many of the cluster 2 mutations have adrenergic biochemical phenotype and
      are associated with increased epinephrine production as a result of high
      PNMT expression.
    explanation: >-
      Establishes the Cluster 2 adrenergic secretory phenotype and its PNMT
      basis, the mirror image of the Cluster 1 node.
  downstream:

- name: Peptide Receptor Radionuclide Therapy (177Lu-DOTATATE)
  description: >-
    Somatostatin-receptor-targeted radionuclide therapy for progressive
    metastatic PPGL, exploiting the high SSTR2 expression of these tumors that
    also underlies 68Ga-DOTATATE PET imaging. A phase 2 trial showed a 6-month
    progression-free survival rate of 0.861 overall, but with a clinically
    important genotype split: SDHx-mutated patients did significantly worse than
    apparently sporadic patients. A distinctive hazard is catecholamine release
    syndrome from radiation-induced tumor lysis, seen at grade 3 or above in 17%,
    which is why pretreatment alpha-blockade and sometimes planned intensive-care
    monitoring are used.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: peptide receptor radionuclide therapy
    term:
      id: NCIT:C192439
      label: Radiopharmaceutical Therapy
    therapeutic_agent:
    - preferred_term: Lutetium Lu 177 dotatate
      term:
        id: NCIT:C95020
        label: Lutetium Lu 177 Dotatate
  target_mechanisms:
  - target: Metastatic Progression
    treatment_effect: INHIBITS
    description: >-
      Delivers targeted beta radiation to SSTR-expressing metastatic deposits.
  evidence:
  - reference: PMID:40829092
    reference_title: "Phase II Study of (177)Lu-DOTATATE for Progressive Metastatic Pheochromocytomas and Paragangliomas: Interim Analysis of Efficacy, Safety, and Biomarkers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six-month PFS rate for all patients was 0.861 (95% CI, 0.755 to 0.982),
      which was significantly lower (P = .009) for SDHx at 0.72 (95% CI, 0.542 to
      0.962) versus sporadic at 1.00 (95% CI, 1.0 to 1.0).
    explanation: >-
      Documents both the overall efficacy and the genotype-dependent difference in
      benefit that is directly relevant to hereditary SDHx disease.
  - reference: PMID:40829092
    reference_title: "Phase II Study of (177)Lu-DOTATATE for Progressive Metastatic Pheochromocytomas and Paragangliomas: Interim Analysis of Efficacy, Safety, and Biomarkers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 17% incidence of grade 3+ catecholamine release syndrome (CRS) was noted,
      which may benefit from preemptive ICU admission.
    explanation: >-
      Documents the catecholamine release syndrome hazard specific to treating
      secretory PPGL with radionuclide therapy.
- name: Genetic Testing and Cascade Screening
  description: >-
    Germline testing is recommended for all patients with PPGL, not only those
    with a family history, because roughly 40% carry a germline variant and
    a substantial minority of apparently sporadic presentations are hereditary. A
    positive result changes surveillance intensity, informs the site and
    biochemical phenotype to expect, predicts metastatic risk (SDHB highest), and
    enables cascade testing of relatives. SDHB immunohistochemistry on resected
    tumor is a cost-effective way to triage which patients need SDHx sequencing.
    For SDHD and SDHAF2, the parent-of-origin effect must be explained carefully
    during counselling.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301715
    reference_title: Hereditary Paraganglioma-Pheochromocytoma Syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis is established in a proband with a personal or family history
      of paraganglioma or pheochromocytoma and a germline heterozygous pathogenic
      variant in MAX, SDHA, SDHAF2, SDHB, SDHC, SDHD, or TMEM127 identified by
      molecular genetic testing.
    explanation: >-
      GeneReviews statement of the molecular diagnostic strategy and the gene
      panel that defines a hereditary PGL/PCC syndrome.
  - reference: PMID:20301715
    reference_title: Hereditary Paraganglioma-Pheochromocytoma Syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      First-degree relatives of an individual with a hereditary PGL/PCC syndrome
      and a known MAX, SDHA, SDHAF2, SDHB, SDHC, SDHD, or TMEM127 pathogenic
      variant should be offered molecular genetic testing to clarify their
      genetic status
    explanation: >-
      GeneReviews recommendation underpinning the cascade-testing component of
      this action.
- name: Lifelong Surveillance for Carriers
  description: >-
    Asymptomatic pathogenic-variant carriers enter risk-adapted lifelong
    surveillance, typically combining periodic plasma free metanephrines with
    whole-body MRI at intervals set by genotype. SDHB carriers receive the most
    intensive imaging because of their metastatic risk, while SDHD carriers need
    dedicated head-and-neck coverage for multifocal parasympathetic tumors that
    may be biochemically silent and therefore invisible to metanephrine testing
    alone.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: surveillance for hereditary PPGL
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:20301715
    reference_title: Hereditary Paraganglioma-Pheochromocytoma Syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Individuals at risk for hereditary PGL/PCC syndromes should have annual
      clinical assessment for manifestations of PGL/PCCs and GISTs, plasma-free
      fractionated metanephrines or 24-hour urine fractionated metanephrines
      every two years in childhood and then annually in adults, and whole-body
      MRI every two to three years.
    explanation: >-
      GeneReviews surveillance schedule, the source of the biochemical-plus-MRI
      protocol described here.
  - reference: PMID:20301715
    reference_title: Hereditary Paraganglioma-Pheochromocytoma Syndromes.
    supports: SUPPORT

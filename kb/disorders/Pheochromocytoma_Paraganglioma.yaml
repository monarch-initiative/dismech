name: Pheochromocytoma and Paraganglioma
creation_date: '2026-01-26T02:55:13Z'
description: >-
  Pheochromocytoma and paraganglioma (PPGL) are rare neuroendocrine tumors arising
  from chromaffin cells of the adrenal medulla (pheochromocytoma) or extra-adrenal
  sympathetic and parasympathetic ganglia (paraganglioma). Approximately 40% of PPGLs
  are hereditary, caused by germline mutations in over 20 susceptibility genes including
  SDHx subunits (SDHA, SDHB, SDHC, SDHD), VHL, RET, NF1, MAX, and TMEM127. PPGLs may
  be catecholamine-secreting, causing paroxysmal hypertension, headaches, sweating,
  and palpitations. Understanding the genetic basis has enabled surveillance, early
  detection, and emerging targeted therapies for this heterogeneous tumor group.

  This entry covers both the sporadic tumor entity (MONDO:0035540) and the hereditary
  pheochromocytoma-paraganglioma predisposition syndrome (MONDO:0017366), which is
  modeled here as the genetic-locus axis of `has_subtypes` (PGL1-PGL5 plus the MAX-
  and TMEM127-related forms) rather than as a separate Disease entry. Hereditary PPGL
  is mechanistically split into two transcriptional clusters: Cluster 1 (pseudohypoxic)
  comprising Cluster 1A (SDHx, FH - oncometabolite-driven) and Cluster 1B (VHL, EPAS1
  - direct HIF-axis lesions), and Cluster 2 (kinase-signaling; RET, NF1, TMEM127, MAX).
  This cluster assignment predicts the secretory phenotype, the tumor location, and the
  metastatic risk that drive clinical surveillance.
categories:
- Neuroendocrine Tumor
- Hereditary Cancer Syndrome
- Adrenal Tumor
parents:
- neuroendocrine tumor

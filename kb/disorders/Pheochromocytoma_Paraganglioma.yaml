    explanation: >-
      Supports the genotype-adapted framing of the surveillance schedule rather
      than a single protocol for all carriers.
  - reference: PMID:20301715
    reference_title: Hereditary Paraganglioma-Pheochromocytoma Syndromes.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      approximately 95% of such tumors are nonsecretory
    explanation: >-

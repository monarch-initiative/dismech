- name: PGL5
  display_name: PGL5 - SDHA-related hereditary paraganglioma-pheochromocytoma
  description: >-
    SDHA (5p15) germline loss of function. SDHA encodes the flavoprotein
    catalytic subunit of complex II. Low-penetrance PPGL predisposition with a
    broad tumor spectrum including gastrointestinal stromal tumor. Biallelic
    (recessive) SDHA loss causes a mechanistically distinct, non-neoplastic
    disease - mitochondrial complex II deficiency with Leigh syndrome - which is
    curated separately and is not part of this tumor-predisposition subtype.
  subtype_term:
    preferred_term: pheochromocytoma/paraganglioma syndrome 5
    term:

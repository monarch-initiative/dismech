animal_models:
- name: Arfgef2-null mouse
  species: Mouse
  genotype: Arfgef2 null (constitutive knockout)
  publication: PMID:22956851
  description: >-
    Arfgef2-null mice develop periventricular heterotopia with impaired neuronal
    migration, acting through increased FlnA phosphorylation; they recapitulate
    the migration/heterotopia arm but microcephaly is not reported.
  modeled_mechanisms:
  - target: Failure of Neuronal Migration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces periventricular heterotopia and impaired neuronal migration via
      the Big2-FlnA axis.
    limitations: >-
      Recapitulates the migration/heterotopia arm but not the microcephaly that
      is a defining human feature, so it models only part of the disorder.
    evidence:
    - reference: PMID:22956851
      reference_title: "Brefeldin A-inhibited guanine exchange factor 2 regulates filamin A phosphorylation and neuronal migration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we show that Arfgef2 null mice develop PH and exhibit impaired neural migration with increased protein expression for both FlnA and phosphoFlnA at Ser2152
      explanation: Demonstrates periventricular heterotopia and impaired neuronal migration in Arfgef2-null mice.
    readouts:
    - name: Periventricular heterotopia and neuronal migration in Arfgef2-null mice
      target: Failure of Neuronal Migration
      interpretation: The null mouse develops heterotopia with impaired migration.
      evidence:
      - reference: PMID:22956851
        reference_title: "Brefeldin A-inhibited guanine exchange factor 2 regulates filamin A phosphorylation and neuronal migration."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Here, we show that Arfgef2 null mice develop PH and exhibit impaired neural migration with increased protein expression for both FlnA and phosphoFlnA at Ser2152
        explanation: Reports heterotopia and impaired migration in the null mouse.
  evidence:
  - reference: PMID:22956851
    reference_title: "Brefeldin A-inhibited guanine exchange factor 2 regulates filamin A phosphorylation and neuronal migration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we show that Arfgef2 null mice develop PH and exhibit impaired neural migration with increased protein expression for both FlnA and phosphoFlnA at Ser2152
    explanation: Establishes the Arfgef2-null mouse as an informative model for the migration/heterotopia mechanism.
- name: Arfgef2 gene-trap mouse (embryonic lethal)
  species: Mouse
  genotype: Arfgef2 gene-trap (functional disruption)
  publication: PMID:20857375
  description: >-
    A gene-trap line with functional disruption of Arfgef2 is embryonic lethal,
    so constitutive total loss of BIG2 in the mouse cannot model the postnatal
    neurodevelopmental disease.
  modeled_mechanisms:
  - target: Failure of Neuronal Migration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Complete constitutive disruption of BIG2 is lethal in utero, so the mouse
      dies before cortical neuronal migration and cannot reproduce the
      migration-failure / heterotopia phenotype.
    limitations: >-
      Embryonic lethality precludes modelling the postnatal cortical malformation;
      the human disease results from LoF variants compatible with survival.
    evidence:
    - reference: PMID:20857375
      reference_title: "Early embryonic lethality in gene trap mice with disruption of the Arfgef2 gene."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, no homozygous embryos were obtained from breeding heterozygous females and males.
      explanation: >-
        Shows the gene-trap homozygotes die as embryos, so the model cannot
        reach the postnatal migration-failure phenotype.
  evidence:
  - reference: PMID:20857375
    reference_title: "Early embryonic lethality in gene trap mice with disruption of the Arfgef2 gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results indicate that murine BIG2 is essential for early embryonic development.
    explanation: >-
      Establishes that total constitutive BIG2 loss is embryonic-lethal in the
      mouse, the reason this model fails to recapitulate the human disorder.

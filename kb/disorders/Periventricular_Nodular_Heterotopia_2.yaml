name: Periventricular Nodular Heterotopia 2
creation_date: "2026-11-04T00:00:00Z"
category: Mendelian
description: >-
  Periventricular nodular heterotopia 2 (PVNH2) is an autosomal recessive
  malformation of cortical development caused by biallelic loss-of-function
  variants in ARFGEF2. ARFGEF2 encodes BIG2 (brefeldin-A-inhibited guanine
  nucleotide-exchange factor 2), which activates ADP-ribosylation factor (ARF)
  GTPases to drive vesicle budding and membrane trafficking through the Golgi.
  Loss of BIG2 impairs the vesicular trafficking that neural progenitors in the
  ventricular zone need both to proliferate and to migrate, so affected
  individuals have reduced cortical neuron production (microcephaly) together
  with neurons that fail to migrate away from the periventricular region and
  instead form nodular heterotopia lining the lateral ventricles. The
  combination presents as congenital or progressive microcephaly, periventricular
  nodular heterotopia, developmental delay or intellectual disability, and
  seizures. It is distinguished from the common X-linked dominant FLNA form of
  periventricular nodular heterotopia by its recessive inheritance, its
  microcephaly, and its trafficking mechanism.

diagnosis:
- name: MRI and ARFGEF2 genetic testing
  description: >-
    Diagnosis is suspected from the brain MRI gestalt — bilateral periventricular
    nodular heterotopia with progressive microcephaly (often with callosal
    hypoplasia and basal-ganglia signal change) — and confirmed by ARFGEF2
    sequencing. Echocardiographic screening for cardiomyopathy is advised once
    an ARFGEF2 diagnosis is made.
  presence: Bilateral PVNH with progressive microcephaly on MRI; biallelic ARFGEF2 variant
  evidence:
  - reference: PMID:42200925
    reference_title: "ARFGEF2-Related Periventricular Nodular Heterotopia: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      ARFGEF2-related disorder is a rare genetically determined condition that should be suspected in patients with PVNH and progressive microcephaly
    explanation: States the diagnostic gestalt (PVNH plus progressive microcephaly) that prompts ARFGEF2 testing.
  - reference: PMID:26126837
    reference_title: "The expanding phenotypic spectrum of ARFGEF2 gene mutation: Cardiomyopathy and movement disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In case of ARFGEF2 gene mutation, screening for cardiomyopathy may be indicated.
    explanation: Supports echocardiographic cardiomyopathy screening after an ARFGEF2 diagnosis.
treatments:
- name: Antiseizure pharmacotherapy
  description: >-
    Epilepsy (including infantile spasms) is treated with antiseizure
    medication, though it is frequently drug-resistant; vigabatrin has been used
    for spasms with partial benefit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vigabatrin
      term:
        id: CHEBI:63638
        label: vigabatrin
  evidence:
  - reference: PMID:42200925
    reference_title: "ARFGEF2-Related Periventricular Nodular Heterotopia: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      vigabatrin was introduced up to a dose of 100 mg/kg, with a slight improvement in seizure frequency
    explanation: Documents vigabatrin use for seizures with partial benefit in a described case.
- name: Supportive and rehabilitative care
  description: >-
    There is no disease-specific therapy. Management is supportive: developmental,
    educational and rehabilitative support; nutritional support with gastrostomy
    for progressive dysphagia; and respiratory care for aspiration-related
    infections.
  treatment_term:
    preferred_term: Supportive Care

genetic:
- name: ARFGEF2
  gene_term:
    preferred_term: ARFGEF2
    term:
      id: hgnc:15853
      label: ARFGEF2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic (homozygous or compound heterozygous) loss-of-function variants
    in ARFGEF2 cause PVNH2. ARFGEF2 encodes BIG2, a large brefeldin-A-inhibited
    guanine nucleotide-exchange factor that activates ARF GTPases to regulate
    Golgi vesicle trafficking.
  evidence:
  - reference: PMID:14647276
    reference_title: "Mutations in ARFGEF2 implicate vesicle trafficking in neural progenitor proliferation and migration in the human cerebral cortex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show that an autosomal recessive condition characterized by microcephaly and periventricular heterotopia maps to chromosome 20 and is caused by mutations in the gene ADP-ribosylation factor guanine nucleotide-exchange factor-2 (ARFGEF2)
    explanation: >-
      Supports ARFGEF2 as the causative gene identified by linkage in affected
      consanguineous families.
  - reference: PMID:42200925
    reference_title: "ARFGEF2-Related Periventricular Nodular Heterotopia: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Reported pathogenic variants include nonsense, frameshift, and splice-site mutations distributed throughout the gene, supporting a LoF mechanism as the primary disease mechanism
    explanation: >-
      Documents the truncating/splice variant spectrum across the gene,
      supporting loss of function as the mechanism.
  - reference: PMID:42200925
    reference_title: "ARFGEF2-Related Periventricular Nodular Heterotopia: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      homozygosity documented in 20/21 cases
    explanation: >-
      Documents that nearly all reported cases are homozygous, consistent with
      recessive inheritance in largely consanguineous families.
  variants:
  - name: ARFGEF2 c.5126G>A (p.Trp1709*)
    description: >-
      Homozygous nonsense variant reported in an affected child, consistent with
      the loss-of-function mechanism; this case also carried left ventricular
      non-compaction cardiomyopathy, widening the phenotype.
    evidence:
    - reference: PMID:26126837

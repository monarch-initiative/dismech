- name: ARFGEF2/BIG2 Loss of Function
  description: >-
    Biallelic loss-of-function variants in ARFGEF2 abolish or reduce the
    guanine nucleotide-exchange activity of BIG2 toward ARF GTPases, the first
    step that normally licenses vesicle budding from the trans-Golgi.
  biological_scale: MOLECULAR
  conforms_to: apical_neuroependyma_integrity_failure#Apical Junction, Ciliary, and Vesicle-Trafficking Perturbation

    reference_title: "ARFGEF2-Related Periventricular Nodular Heterotopia: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      heterotopic nodules are known to develop abnormal structural and functional connections with both overlying and distant cortical regions
    explanation: >-
      Supports the heterotopic nodules forming an abnormal cortical network, the

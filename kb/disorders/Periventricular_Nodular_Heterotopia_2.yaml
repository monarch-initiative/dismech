inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    PVNH2 is inherited in an autosomal recessive manner; affected individuals
    carry biallelic loss-of-function variants in ARFGEF2.
genetic:
- name: ARFGEF2
  gene_term:
    preferred_term: ARFGEF2
    term:
      id: hgnc:15853
      label: ARFGEF2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic (homozygous or compound heterozygous) loss-of-function variants
    in ARFGEF2 cause PVNH2. ARFGEF2 encodes BIG2, a large brefeldin-A-inhibited
    guanine nucleotide-exchange factor that activates ARF GTPases to regulate
    Golgi vesicle trafficking.
  evidence:
  - reference: PMID:14647276
    reference_title: "Mutations in ARFGEF2 implicate vesicle trafficking in neural progenitor proliferation and migration in the human cerebral cortex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show that an autosomal recessive condition characterized by microcephaly and periventricular heterotopia maps to chromosome 20 and is caused by mutations in the gene ADP-ribosylation factor guanine nucleotide-exchange factor-2 (ARFGEF2)
    explanation: >-
      Supports ARFGEF2 as the causative gene identified by linkage in affected
      consanguineous families.
  variants:
  - name: ARFGEF2 c.5126G>A (p.Trp1709*)
    description: >-
      Homozygous nonsense variant reported in an affected child, consistent with
      the loss-of-function mechanism; this case also carried left ventricular
      non-compaction cardiomyopathy, widening the phenotype.
    evidence:
    - reference: PMID:26126837
      reference_title: "The expanding phenotypic spectrum of ARFGEF2 gene mutation: Cardiomyopathy and movement disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sequence analysis of ARFGEF2 gene demonstrated a homozygous c.5126G>A, p.Trp1709(∗) mutation
      explanation: Reports a representative homozygous loss-of-function (nonsense) ARFGEF2 variant.
pathophysiology:
- name: ARFGEF2/BIG2 Loss of Function
  description: >-
    Biallelic loss-of-function variants in ARFGEF2 abolish or reduce the
    guanine nucleotide-exchange activity of BIG2 toward ARF GTPases, the first
    step that normally licenses vesicle budding from the trans-Golgi.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: guanyl-nucleotide exchange factor activity
    modifier: DECREASED
    term:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
  downstream:
  - target: Impaired Golgi Vesicle Trafficking
    causal_link_type: DIRECT
- name: Impaired Golgi Vesicle Trafficking
  description: >-
    Without BIG2-mediated ARF activation, vesicle budding and membrane
    trafficking through the Golgi are impaired in neural progenitor cells,
    disrupting the delivery of membrane and cargo those cells need for division
    and for movement.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: Golgi vesicle transport
    modifier: DECREASED
    term:
      id: GO:0048193
      label: Golgi vesicle transport
  downstream:
  - target: Reduced Neural Progenitor Proliferation
    causal_link_type: DIRECT
  - target: Failure of Neuronal Migration
    causal_link_type: DIRECT
- name: Reduced Neural Progenitor Proliferation
  description: >-
    Impaired trafficking reduces the proliferation of neural progenitors in the
    ventricular zone, lowering the total output of cortical neurons and
    producing microcephaly.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: neural precursor cell proliferation
    modifier: DECREASED
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
  evidence:
  - reference: PMID:14647276
    reference_title: "Mutations in ARFGEF2 implicate vesicle trafficking in neural progenitor proliferation and migration in the human cerebral cortex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disruption of human neural precursor proliferation can give rise to a small brain (microcephaly)
    explanation: >-
      Supports reduced neural precursor proliferation as the mechanism producing
      microcephaly.
  downstream:
  - target: Progressive microcephaly
    causal_link_type: DIRECT
- name: Failure of Neuronal Migration
  description: >-
    Newly generated neurons fail to migrate away from the periventricular
    germinal zone to the cortical plate, instead arresting and forming nodular
    masses of grey matter along the lateral ventricles.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuron migration
    modifier: ABNORMAL
    term:
      id: GO:0001764
      label: neuron migration
  evidence:
  - reference: PMID:14647276
    reference_title: "Mutations in ARFGEF2 implicate vesicle trafficking in neural progenitor proliferation and migration in the human cerebral cortex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      failure of neurons to migrate properly can lead to an abnormal arrest of cerebral cortical neurons in proliferative zones near the lateral ventricles (periventricular heterotopia)
    explanation: >-
      Supports failed neuronal migration as the mechanism producing
      periventricular nodular heterotopia.
  downstream:
  - target: Periventricular nodular heterotopia
    causal_link_type: DIRECT
  - target: Cortical Malformation and Hyperexcitability
    causal_link_type: DIRECT
- name: Cortical Malformation and Hyperexcitability
  description: >-
    The heterotopic grey matter and disrupted cortical architecture form an
    abnormal network that is prone to epileptogenesis and underlies the
    developmental, cognitive and motor impairment.
  biological_scale: ORGANISM
  downstream:
  - target: Seizures
    causal_link_type: DIRECT
  - target: Global developmental delay
    causal_link_type: DIRECT
  - target: Intellectual disability
    causal_link_type: DIRECT
  - target: Hypotonia
    causal_link_type: DIRECT
  - target: Spastic tetraparesis
    causal_link_type: DIRECT
  - target: Feeding difficulties

        Sequence analysis of ARFGEF2 gene demonstrated a homozygous c.5126G>A, p.Trp1709(∗) mutation
      explanation: Reports a representative homozygous loss-of-function (nonsense) ARFGEF2 variant.
pathophysiology:
- name: ARFGEF2/BIG2 Loss of Function
  description: >-
    Biallelic loss-of-function variants in ARFGEF2 abolish or reduce the
    guanine nucleotide-exchange activity of BIG2 toward ARF GTPases, the first
    step that normally licenses vesicle budding from the trans-Golgi.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: guanyl-nucleotide exchange factor activity
    modifier: DECREASED
    term:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
  evidence:
  - reference: PMID:14647276
    reference_title: "Mutations in ARFGEF2 implicate vesicle trafficking in neural progenitor proliferation and migration in the human cerebral cortex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ARFGEF2 encodes the large (>200 kDa) brefeldin A (BFA)-inhibited GEF2 protein (BIG2), which is required for vesicle and membrane trafficking from the trans-Golgi network (TGN)
    explanation: >-
      Identifies BIG2 as the brefeldin-A-inhibited GEF required for trans-Golgi
      vesicle trafficking, the function lost in PVNH2.
  downstream:
  - target: Impaired Golgi Vesicle Trafficking
    causal_link_type: DIRECT
- name: Impaired Golgi Vesicle Trafficking
  description: >-
    Without BIG2-mediated ARF activation, vesicle budding and membrane
    trafficking through the Golgi are impaired in neural progenitor cells,
    disrupting the delivery of membrane and cargo those cells need for division
    and for movement.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: Golgi vesicle transport
    modifier: DECREASED
    term:
      id: GO:0048193
      label: Golgi vesicle transport
  evidence:
  - reference: PMID:14647276
    reference_title: "Mutations in ARFGEF2 implicate vesicle trafficking in neural progenitor proliferation and migration in the human cerebral cortex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ARFGEF2 encodes the large (>200 kDa) brefeldin A (BFA)-inhibited GEF2 protein (BIG2), which is required for vesicle and membrane trafficking from the trans-Golgi network (TGN)
    explanation: >-
      Supports loss of BIG2 impairing trans-Golgi vesicle and membrane
      trafficking.
  downstream:
  - target: Reduced Neural Progenitor Proliferation
    causal_link_type: DIRECT
  - target: Mislocalization of Adhesion Molecules
    causal_link_type: DIRECT
- name: Mislocalization of Adhesion Molecules
  description: >-
    Impaired trans-Golgi trafficking blocks delivery of adhesion molecules such
    as E-cadherin and beta-catenin to the cell surface, disrupting the
    cell-cell and cell-scaffold adhesion that neurons and the neuroependymal
    lining need for migration.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: protein localization to plasma membrane
    modifier: DECREASED
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
  evidence:
  - reference: PMID:14647276
    reference_title: "Mutations in ARFGEF2 implicate vesicle trafficking in neural progenitor proliferation and migration in the human cerebral cortex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Inhibition of BIG2 also disturbed the intracellular localization of such molecules as E-cadherin and beta-catenin by preventing their transport from the Golgi apparatus to the cell surface
    explanation: >-
      Supports mislocalization of E-cadherin and beta-catenin from failed
      Golgi-to-surface transport as the adhesion defect linking trafficking to
      migration failure.
  downstream:
  - target: Failure of Neuronal Migration
    causal_link_type: DIRECT
- name: Reduced Neural Progenitor Proliferation
  description: >-
    Impaired trafficking reduces the proliferation of neural progenitors in the
    ventricular zone, lowering the total output of cortical neurons and
    producing microcephaly.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: neural precursor cell proliferation
    modifier: DECREASED
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
  evidence:
  - reference: PMID:14647276
    reference_title: "Mutations in ARFGEF2 implicate vesicle trafficking in neural progenitor proliferation and migration in the human cerebral cortex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Inhibition of BIG2 by BFA, or by a dominant negative ARFGEF2 cDNA, decreases cell proliferation in vitro, suggesting a cell-autonomous regulation of neural expansion
    explanation: >-
      Direct in-vitro result showing BIG2 inhibition reduces cell proliferation,
      the mechanism producing microcephaly.
  - reference: PMID:14647276
    reference_title: "Mutations in ARFGEF2 implicate vesicle trafficking in neural progenitor proliferation and migration in the human cerebral cortex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Disruption of human neural precursor proliferation can give rise to a small brain (microcephaly)
    explanation: >-
      General neurodevelopmental principle (paper's framing) that failed
      precursor proliferation produces microcephaly.
  downstream:
  - target: Progressive microcephaly
    causal_link_type: DIRECT
  - target: Cerebral atrophy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42200925
      reference_title: "ARFGEF2-Related Periventricular Nodular Heterotopia: A Case Report and Literature Review."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        BIG2 inhibition impairs neural progenitor proliferation and disrupts β-catenin transport, likely contributing to reduced brain growth
      explanation: >-
        Ties the reduced-proliferation mechanism to reduced brain growth, the
        developmental deficit whose structural correlate is the
        cortico-subcortical atrophy reported in 11/21 cases.
- name: Failure of Neuronal Migration
  description: >-
    Newly generated neurons fail to migrate away from the periventricular
    germinal zone to the cortical plate, instead arresting and forming nodular
    masses of grey matter along the lateral ventricles.
  biological_scale: CELLULAR

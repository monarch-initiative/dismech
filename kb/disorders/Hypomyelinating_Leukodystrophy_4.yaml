diagnosis:
- name: Brain MRI and MR spectroscopy
  description: >-
    Brain MRI shows diffuse hypomyelination of cerebral and cerebellar white
    matter and corticospinal tracts with thin corpus callosum and brainstem;
    MR spectroscopy with normal Cho/Cr and raised mI/Cr supports
    hypomyelination rather than demyelination.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  markers: T2 white-matter hyperintensity; thin corpus callosum and brainstem
  results: Absent normal myelination at every age imaged.
  evidence:
  - reference: PMID:18571143
    reference_title: "Mitochondrial hsp60 chaperonopathy causes an autosomal-recessive neurodegenerative disorder linked to brain hypomyelination and leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no evidence of normal myelination, regardless of the age of the patient."
    explanation: MRI is the tool that establishes the hypomyelination phenotype.
- name: HSPD1 molecular genetic testing
  description: >-
    Diagnosis is confirmed by identifying biallelic (recessive form) or de novo
    heterozygous (de novo subtype) pathogenic HSPD1 variants, usually by exome
    sequencing after PLP1 and GJC2 (GJA12) causes of Pelizaeus-Merzbacher-like
    disease are excluded. Urine organic acids showing ethylmalonic aciduria can
    support the diagnosis but are not specific.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  markers: HSPD1 pathogenic variants
  evidence:
  - reference: PMID:32532876
    reference_title: "A recurrent de novo HSPD1 variant is associated with hypomyelinating leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio whole-exome sequencing revealed a de novo heterozygous variant (c.139T > G, p.Leu47Val) in the HSPD1 gene."
    explanation: Trio exome sequencing established the molecular diagnosis in the de novo form.
  - reference: PMID:27405012
    reference_title: "Hypomyelinating Leukodystrophy due to HSPD1 Mutations: A New Patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the MitCHAP-60 disease should be considered as a rare differential diagnosis in HML."
    explanation: HSPD1 belongs in the genetic work-up of hypomyelinating leukodystrophy.
differential_diagnoses:
- name: Hereditary spastic paraplegia 13 (SPG13)
  disease_term:
    preferred_term: hereditary spastic paraplegia 13
    term:
      id: MONDO:0011532
      label: hereditary spastic paraplegia 13
  description: >-
    The allelic autosomal dominant HSPD1 disorder: a late-onset, pure spastic
    paraplegia of adults without hypomyelination or cerebral involvement.
  distinguishing_features:
  - Autosomal dominant transmission with adult onset favors SPG13.
  - Infantile onset, nystagmus, profound cerebral involvement and early death favor HLD4.
  evidence:
  - reference: PMID:18571143
    reference_title: "Mitochondrial hsp60 chaperonopathy causes an autosomal-recessive neurodegenerative disorder linked to brain hypomyelination and leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "can be distinguished from spastic paraplegia 13 (SPG13), another Hsp60-associated autosomal-dominant neurodegenerative disorder, by its autosomal-recessive inheritance pattern, as well as by its early-onset, profound cerebral involvement and lethality"
    explanation: States the features separating HLD4 from SPG13.
- name: Pelizaeus-Merzbacher disease and GJC2 Pelizaeus-Merzbacher-like disease
  disease_term:
    preferred_term: Pelizaeus-Merzbacher spectrum disorder
    term:
      id: MONDO:0010714
      label: Pelizaeus-Merzbacher spectrum disorder
  description: >-
    X-linked PLP1-related Pelizaeus-Merzbacher disease and recessive
    GJC2-related Pelizaeus-Merzbacher-like disease share infantile nystagmus,
    hypotonia evolving to spasticity and diffuse hypomyelination; they are
    separated by molecular testing.
  distinguishing_features:
  - X-linked inheritance and a PLP1 duplication or variant favor Pelizaeus-Merzbacher disease.
  - Biallelic GJC2 variants favor GJC2 Pelizaeus-Merzbacher-like disease.
  - Ethylmalonic aciduria and biallelic HSPD1 variants favor HLD4.
  evidence:
  - reference: PMID:18571143
    reference_title: "Mitochondrial hsp60 chaperonopathy causes an autosomal-recessive neurodegenerative disorder linked to brain hypomyelination and leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a consanguineous Israeli Bedouin kindred with clinical and radiological findings compatible with PMLD, in which linkage to PLP1 and GJA12 was excluded."
    explanation: HLD4 presents as Pelizaeus-Merzbacher-like disease and is separated from PLP1 and GJC2 disease genetically.
treatments:
- name: Supportive and symptomatic care
  description: >-
    No disease-specific or disease-modifying therapy has been reported. Care
    is supportive: nutritional support for feeding problems and malnutrition,
    management of spasticity and contractures, antiseizure treatment, and
    prompt management of febrile illness, which precipitated apneic episodes
    and death in severely affected infants.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Feeding difficulties
    term:
      id: HP:0011968
      label: Feeding difficulties
  - preferred_term: Spastic paraplegia
    term:
      id: HP:0001258
      label: Spastic paraplegia
  - preferred_term: Seizure

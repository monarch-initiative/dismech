- name: HSPD1
  gene_term:
    preferred_term: HSPD1
    term:
      id: hgnc:5261
      label: HSPD1
  association: Disease-causing
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Recessive disease is known only from homozygous c.86A>G (p.Asp29Gly), a
    founder allele in an Israeli Bedouin kindred, absent from 678 ethnically
    matched control chromosomes. Heterozygous de novo p.Leu47Val (two unrelated
    patients) and p.Ala536Val/p.Ala536Pro cause the milder de novo subtype.
    No ClinGen gene-disease validity record for HSPD1 and this disease is
    cached in this repository, so no validity tier is recorded.
  evidence:
  - reference: PMID:18571143
    reference_title: "Mitochondrial hsp60 chaperonopathy causes an autosomal-recessive neurodegenerative disorder linked to brain hypomyelination and leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have identified a homozygous missense mutation (D29G) not previously described in HSPD1, encoding the mitochondrial heat-shock protein 60 (Hsp60) in all affected individuals"
    explanation: Homozygosity mapping and sequencing identify HSPD1 as the disease gene.
  - reference: PMID:18571143

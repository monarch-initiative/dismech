notes: >-
  No GeneReviews chapter covers HSPD1-related disease. Hereditary spastic
  paraplegia 13 (SPG13), the late-onset autosomal dominant HSPD1 disorder, is a
  separate allelic disease and is treated here only as a differential
  diagnosis. All HSP60 residue numbers in this entry use the precursor
  numbering (Asp29); biochemical papers that number the mature protein call the
  same residue Asp3 (D3G).

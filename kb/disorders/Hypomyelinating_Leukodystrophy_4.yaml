has_subtypes:
- name: Recessive MitCHAP-60
  display_name: Autosomal recessive MitCHAP-60 disease (biallelic HSPD1)
  description: >-
    The originally described and defining form, caused by homozygous HSPD1
    p.Asp29Gly in an Israeli Bedouin kindred and in a second, probably related
    family. Infantile onset, profound cerebral involvement and death in the
    first two decades. Heterozygous carriers are asymptomatic.
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:

animal_models:
- name: MBP-promoter HSPD1 D29G transgenic mouse
  species: Mouse
  genotype: Transgenic human HSPD1 c.86A>G (p.Asp29Gly) under the myelin basic protein promoter, on a wild-type Hspd1 background
  publication: PMID:28377887
  description: >-
    Transgenic mice overexpressing FLAG-tagged human D29G HSP60 in myelinating
    cells show reduced MBP immunostaining of the neonatal corpus callosum and
    other brain regions.
  modeled_mechanisms:
  - target: Diffuse CNS Hypomyelination
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Reproduces reduced CNS myelin formation from the HLD4 allele expressed in myelinating cells.
    limitations: >-
      An overexpressed transgene (about 15 copies) on a wild-type background,
      not a homozygous knock-in, so it models a dominant effect of the variant
      rather than the recessive genotype. Only neonatal MBP staining from a
      single propagated line is reported; neurological phenotype, survival and
      oligodendrocyte numbers are not described.
    evidence:
    - reference: PMID:28377887
      reference_title: "Defective myelination in mice harboring hypomyelinating leukodystrophy-associated HSPD1 mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Transgenic mice exhibit decreased myelin formation in corpus callosum (line 1 in panels A and B of the Fig. 1) as well as other brain regions, comparing with littermate controls."
      explanation: The model shows the hypomyelination node in brain tissue.
- name: hspd1 knockout zebrafish
  species: Zebrafish
  genotype: hspd1 -/- (null)
  publication: PMID:39147275
  description: >-
    hspd1 knockout larvae show reduced mitochondrial matrix and inner-membrane
    proteins, activation of the mitochondrial integrated stress response,
    dysregulated cholesterol biosynthesis with lipid accumulation, fewer mature
    oligodendrocytes, and early developmental abnormalities.
  modeled_mechanisms:
  - target: Depletion of the Mitochondrial Matrix Proteome
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Proteomics shows broad reduction of matrix and inner-membrane proteins.
    limitations: >-
      A complete null; human HLD4 alleles retain residual chaperonin function,
      and patient fibroblasts show a much weaker proteome effect.
    evidence:
    - reference: PMID:39147275
      reference_title: "HSP60 chaperone deficiency disrupts the mitochondrial matrix proteome and dysregulates cholesterol synthesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In conclusion, as in the HEK D423A-HSP60 cell system, there was a clear reduction in amounts of many mitochondrial matrix and inner membrane proteins in the zebrafish HSP60 knockout larvae."
      explanation: The model directly measures the matrix proteome node.
  - target: Reduced Mature Oligodendrocytes
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Fewer mature oligodendrocytes in knockout larvae.
    limitations: >-
      Null larvae with global developmental abnormalities in the first days of
      life, so the oligodendrocyte deficit may be secondary to general
      developmental failure rather than a lineage-specific effect of
      hypomorphic HSP60.
    evidence:
    - reference: PMID:39147275
      reference_title: "HSP60 chaperone deficiency disrupts the mitochondrial matrix proteome and dysregulates cholesterol synthesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we observed a significantly decreased number of mature oligodendrocytes in the hspd1−/− larvae compared to hspd1+/+ at 4 and 7 dpf"
      explanation: The model shows the oligodendrocyte node.
discussions:
- discussion_id: gap_hld4_fever_temperature_sensitive_hsp60
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does fever push the temperature-sensitive D29G HSP60 below a functional
    threshold and cause the acute decompensations of HLD4, and would fever
    control change the course?
  attaches_to:
  - pathophysiology#HSPD1 Pathogenic Missense Variant
  - phenotypes#Apnea
  - phenotypes#Increased circulating lactate concentration
  - treatments#Supportive and symptomatic care
  rationale: >-
    The D29G chaperonin is markedly worse at 37-38.5 degrees C than at 30
    degrees C in bacterial complementation, and the most severely affected
    infants had apneic spells and died during acute febrile illnesses, with
    mild lactate rises during encephalopathic exacerbations. The two
    observations fit a temperature-threshold model, but nobody has measured
    HSP60 function or the matrix proteome in patient cells at febrile
    temperature, and no clinical series has examined whether aggressive
    antipyresis alters outcome.
  evidence:
  - reference: PMID:18571143
    reference_title: "Mitochondrial hsp60 chaperonopathy causes an autosomal-recessive neurodegenerative disorder linked to brain hypomyelination and leukodystrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "bacteria expressing the D29G variant grow considerably more slowly than WT cells under most conditions tested, and especially at elevated temperatures"
    explanation: Establishes the temperature sensitivity on which the hypothesis rests.
  proposed_experiments:
  - experiment_id: exp_hld4_patient_fibroblast_febrile_shift
    name: Febrile-temperature shift of D29G patient fibroblasts
    description: >-
      Culture homozygous D29G patient fibroblasts and controls at 37 and 39-40
      degrees C and measure HSP60 oligomer state, matrix proteome, membrane
      potential and lactate production.
    would_support:
    - pathophysiology#Impaired Mitochondrial Matrix Protein Folding
    supporting_outcome:
    - Patient but not control cells lose oligomeric HSP60 and matrix proteins at febrile temperature.
    refuting_outcome:
    - No temperature-dependent difference between patient and control cells.
- discussion_id: gap_hld4_de_novo_form_same_disease
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the de novo heterozygous HSPD1 hypomyelinating leukodystrophy the same
    disease as recessive HLD4, or a separate dominant-negative entity that
    should have its own identifier?
  attaches_to:
  - has_subtypes#De novo heterozygous HSPD1 HLD
  - pathophysiology#HSP60 Chaperonin Oligomer Destabilization
  rationale: >-
    Both forms are HSPD1-caused hypomyelination with nystagmus and hypotonia
    progressing to spasticity, and both impair HSP60 oligomer assembly, which
    is why they are lumped here. But heterozygous D29G carriers are
    asymptomatic, so the de novo alleles must act differently (a proposed
    dominant-negative effect on ring assembly), the course is generally
    milder and non-lethal, and the de novo patients described so far have
    ataxia and tremor that were not features of the recessive kindred. With
    about five de novo patients reported, it is unknown whether the two forms
    differ in mechanism enough to warrant separate entries, and MONDO and
    OMIM have not yet assigned the de novo form an identifier.
  evidence:
  - reference: PMID:39500555
    reference_title: "Heterozygous de novo variants in HSPD1 cause hypomyelinating leukodystrophy through impaired HSP60 oligomerisation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We provide evidence that impaired oligomerisation of the chaperonin complex might underlie this HSPD1-related phenotype, possibly through exerting a dominant negative effect."
    explanation: The proposed dominant-negative mechanism is stated as a possibility, not a demonstration.

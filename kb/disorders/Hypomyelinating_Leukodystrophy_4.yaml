- name: Progressive Neurodegeneration and Brain Atrophy
  description: >-
    Beyond the static failure of myelination, the course is degenerative:
    developmental arrest and regression, deceleration of head growth, sulcal
    and ventricular enlargement, and cerebellar and vermian atrophy that

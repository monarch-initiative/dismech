- name: HSP60 Chaperonin Oligomer Destabilization
  description: >-
    The variant HSP60 forms rings that disassemble at low protein
    concentration (recessive D29G), or fails to assemble the chaperonin
    complex correctly (de novo Ala536 and Leu47 variants), so less functional
    HSP60/HSP10 folding chamber is available in the matrix.

name: Hypomyelinating Leukodystrophy 4
category: Mendelian
creation_date: "2026-10-03T21:57:00Z"
synonyms:
- HLD4
- MitCHAP-60 disease
- MitCHAP60 disease
- mitochondrial HSP60 chaperonopathy
- HSPD1 leukodystrophy
- Pelizaeus-Merzbacher-like disease due to HSPD1 mutation
- hypomyelinating leukodystrophy type 4
- leukodystrophy, hypomyelinating, type 4
- leukodystrophy caused by mutation in HSPD1
description: >-
  Hypomyelinating leukodystrophy 4 (HLD4, MitCHAP-60 disease) is an autosomal
  recessive, infantile-onset hypomyelinating leukodystrophy caused by
  pathogenic variants in HSPD1, which encodes HSP60, the large subunit of the
  mitochondrial HSP60/HSP10 chaperonin that folds proteins imported into the
  mitochondrial matrix. It was delineated in a large consanguineous Israeli
  Bedouin kindred homozygous for HSPD1 c.86A>G (p.Asp29Gly), which destabilizes
  the HSP60 oligomer and leaves a temperature-sensitive chaperonin with reduced
  folding and ATPase activity. Affected children present in the first months of
  life with rotatory nystagmus, hypotonia and psychomotor delay, then develop
  progressive spastic paraplegia, severe motor impairment without head control,
  profound intellectual disability, deceleration of head growth, seizures in
  many, and regression; death usually occurs in the first two decades. Brain
  MRI shows absent myelination of the cerebral and cerebellar white matter with
  a thin corpus callosum and brainstem, and a subset of patients has
  intermittent ethylmalonic aciduria. Heterozygous de novo HSPD1 variants
  (p.Leu47Val, p.Ala536Val/Pro) cause an overlapping, generally milder
  hypomyelinating phenotype, recorded here as a subtype. Treatment is
  supportive.

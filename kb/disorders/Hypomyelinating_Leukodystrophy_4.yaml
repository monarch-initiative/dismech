    reference_title: "Mitochondrial hsp60 chaperonopathy causes an autosomal-recessive neurodegenerative disorder linked to brain hypomyelination and leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have identified a homozygous missense mutation (D29G) not previously described in HSPD1, encoding the mitochondrial heat-shock protein 60 (Hsp60) in all affected individuals"
    explanation: Defines the recessive form by homozygous HSPD1 D29G in all affected members of the founding kindred.
  - reference: PMID:27405012
    reference_title: "Hypomyelinating Leukodystrophy due to HSPD1 Mutations: A New Patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the fact that the families carried the same mutation our patient probably belongs to the same extended family as the Israeli family."
    explanation: The only further recessive patient reported carries the same allele and probably shares the founder haplotype.
- name: De novo heterozygous HSPD1 HLD
  display_name: Hypomyelinating leukodystrophy due to heterozygous de novo HSPD1 variants
  description: >-
    A sporadic hypomyelinating leukodystrophy caused by heterozygous de novo
    HSPD1 missense variants (recurrent p.Leu47Val; p.Ala536Val and p.Ala536Pro),
    with early-onset nystagmus, tremor and hypotonia evolving into spasticity
    and ataxia, usually without the lethality of the recessive form. The
    variants cluster spatially in HSP60 and impair chaperonin complex assembly,
    consistent with a dominant-negative mechanism. Some authors label it HLD4
    and others call it an additional HSPD1 phenotype; it has no separate MONDO
    or OMIM disease identifier.
  inheritance:
  - name: Autosomal dominant inheritance (de novo)
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:30083362
    reference_title: "Independent occurrence of de novo HSPD1 and HIP1 variants in brothers with different neurological disorders - leukodystrophy and autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report on a de novo heterozygous HSPD1 variant in a sporadic patient with HLD4 but not SPG13"
    explanation: First report of a de novo heterozygous HSPD1 variant (p.Leu47Val) with a hypomyelinating phenotype, which the authors classify as HLD4.
  - reference: PMID:32532876
    reference_title: "A recurrent de novo HSPD1 variant is associated with hypomyelinating leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio whole-exome sequencing revealed a de novo heterozygous variant (c.139T > G, p.Leu47Val) in the HSPD1 gene."
    explanation: A second, unrelated patient with the same de novo p.Leu47Val variant and hypomyelination establishes recurrence.
  - reference: PMID:39500555
    reference_title: "Heterozygous de novo variants in HSPD1 cause hypomyelinating leukodystrophy through impaired HSP60 oligomerisation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequently, an additional phenotype of hypomyelinating leukodystrophy has been reported due to de novo heterozygous HSPD1 variants."
    explanation: Describes the de novo heterozygous form as an additional HSPD1 hypomyelinating phenotype alongside recessive HLD4, the basis for keeping it as a subtype rather than the defining form.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  description: >-
    The defining form is autosomal recessive with complete penetrance in the
    reported homozygotes. In the founding kindred the homozygous D29G variant
    segregated completely with disease, all parents were heterozygous, and
    carriers remained asymptomatic into old age. A second, de novo heterozygous
    route to a similar phenotype is recorded on the subtype.
  evidence:
  - reference: PMID:18571143
    reference_title: "Mitochondrial hsp60 chaperonopathy causes an autosomal-recessive neurodegenerative disorder linked to brain hypomyelination and leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all ten affected children were homozygous for the mutation and all parents were heterozygous"
    explanation: Complete segregation of homozygosity with disease and obligate heterozygosity of parents establish recessive inheritance.
  - reference: PMID:18571143
    reference_title: "Mitochondrial hsp60 chaperonopathy causes an autosomal-recessive neurodegenerative disorder linked to brain hypomyelination and leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all heterozygous carriers of the D29G mutation in our study are completely asymptomatic, with some of the carriers reaching their ninth decade of life"
    explanation: A single D29G allele produces no phenotype, consistent with recessive inheritance and distinguishing HLD4 carriers from SPG13.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The recessive form is known from one large consanguineous Israeli Bedouin
    kindred (23 affected children diagnosed over a decade, ten studied in
    detail) and one further patient who probably belongs to the same extended
    family. The de novo heterozygous form is known from a handful of sporadic
    patients. No population prevalence estimate exists.
  evidence:
  - reference: PMID:18571143
    reference_title: "Mitochondrial hsp60 chaperonopathy causes an autosomal-recessive neurodegenerative disorder linked to brain hypomyelination and leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over the past decade, 23 children of the family investigated in the current study have been diagnosed as suffering from an autosomal-recessive fatal neurodegenerative disorder of early onset, associated with hypomyelinating leukodystrophy"
    explanation: Gives the case count of the founding kindred, which is most of the recessive cases known.
  - reference: PMID:27405012
    reference_title: "Hypomyelinating Leukodystrophy due to HSPD1 Mutations: A New Patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We here report the first case of this severe neurodegenerative disease since it was first described."
    explanation: Only one further recessive case was reported in the eight years after the original description.
pathophysiology:
- name: HSPD1 Pathogenic Missense Variant
  description: >-
    The initiating lesion is a germline missense variant in HSPD1, which
    encodes HSP60. In the recessive form both alleles carry p.Asp29Gly, a
    residue conserved from bacteria to human that sits in the equatorial domain
    facing the chaperonin cavity. The variant protein is expressed at normal
    levels but supports chaperonin function poorly, especially at higher
    temperature.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION

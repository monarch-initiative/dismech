- name: Mitochondrial Dynamics and Membrane Potential Defect
  description: >-
    Expression of the HLD4 HSP60 variant in cultured cells shortens mitochondria
    through excess fission, lowers mitochondrial membrane potential and causes
    perinuclear clustering. Patient muscle showed giant mitochondria with
    abnormal cristae in one case but no ragged-red or COX-deficient fibres,
    so a classical respiratory-chain defect is not evident in tissue.

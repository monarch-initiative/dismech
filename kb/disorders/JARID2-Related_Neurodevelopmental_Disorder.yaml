- name: Abnormal Jarid2-Dependent Cardiac Morphogenesis
  biological_scale: TISSUE
  description: >-
    In mice homozygous for a jumonji (Jarid2) gene-trap allele on a C3H/HeJ background, the bulbus cordis (future
    outflow tract and right ventricle) is malformed and ventricular trabecular myocytes are hyperplastic, alongside
    neural tube defects. Penetrance depends on genetic background. This is a biallelic loss in mice and is offered only
    as a possible basis for the heart defects seen in a subset of heterozygous patients.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: outflow tract morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0003151
      label: outflow tract morphogenesis
  - preferred_term: cardiac muscle cell proliferation
    modifier: INCREASED
    term:
      id: GO:0060038
      label: cardiac muscle cell proliferation
  evidence:
  - reference: PMID:10446263
    reference_title: jumonji gene is essential for the neurulation and cardiac development of mouse embryos with a
      C3H/He background.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: We found morphogenetic abnormalities in the bulbus cordis (future outflow tract and the right ventricle) of
      homozygous embryo hearts. Moreover, myocytes in the ventricular trabeculae show hyperplasia with cells filling the
      ventricles.
    explanation: Homozygous mouse mutants show outflow tract and trabecular defects; indirect for heterozygous humans.
  downstream:
  - target: Abnormal Heart Morphology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

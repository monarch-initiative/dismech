    reference_title: The Role of Polycomb Proteins in Cell Lineage Commitment and Embryonic Development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: MTF2 and JARID2 have been discovered to have crucial roles in directing and recruiting PRC2 to target genes
      for repression in embryonic stem cells (ESCs).
    explanation: Review of the role of JARID2 in recruiting PRC2 in embryonic stem cells.
  - reference: PMID:35979655
    reference_title: A novel partial de novo duplication of JARID2 gene causing a neurodevelopmental phenotype.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: Unlike in the other Jumonji family proteins, the JmjC domain of JARID2 lacks its histone demethylase activity
    explanation: JARID2 acts through PRC2 rather than as a demethylase.
  - reference: PMID:41785858
    reference_title: Accessory subunits of PRC2 mimic H3K27me3 to restrict the spread of Polycomb domains.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Collectively, we show that H3K27me3 mimicry evolved to compete against the PRC2-H3K27me3 read-write loop in
      a process that restrains PRC2 and restricts the spread of Polycomb domains.
    explanation: >-
      Mouse and stem-cell work showing that JARID2 and PALI1 H3K27me3 mimicry restrains PRC2 spreading; cited for the
      caveat that JARID2 loss is not simply a loss of H3K27me3.

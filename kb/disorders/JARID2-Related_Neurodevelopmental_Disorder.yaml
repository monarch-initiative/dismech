biochemical:
- name: Peripheral Blood DNA Methylation Episignature
  presence: Present
  notes: >-
    Genome-wide DNA methylation profiling of peripheral blood separates individuals with pathogenic JARID2 variants or
    deletions from controls, and is used as an EpiSign diagnostic test to classify variants of uncertain significance.
    In 6p22-p24 microdeletions the episignature is driven by JARID2.
  evidence:
  - reference: PMID:35887345
    reference_title: DNA Methylation Signature for JARID2-Neurodevelopmental Syndrome.

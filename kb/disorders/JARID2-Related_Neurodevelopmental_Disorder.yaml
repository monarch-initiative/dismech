name: JARID2-Related Neurodevelopmental Disorder
description: >-
  Autosomal dominant neurodevelopmental disorder caused by heterozygous loss of function of JARID2, an accessory subunit
  of the PRC2.2 form of Polycomb repressive complex 2. Causal alleles are nonsense, frameshift and splice variants,
  intragenic deletions, and whole-gene deletions within 6p22-p24 microdeletions. Most arise de novo; inheritance from
  mildly affected parents shows variable expressivity. The core features are developmental delay and intellectual
  disability of variable severity, speech delay, autistic features and other behavioral abnormalities, hypotonia, and a
  recognizable facial appearance with prominent supraorbital ridges, deeply set eyes and dark infraorbital circles.
  Palatal abnormalities and heart defects occur in a subset. Affected individuals share a peripheral-blood DNA
  methylation episignature that is used diagnostically. ClinGen classifies the gene-disease relationship as Definitive.
category: Mendelian
disease_term:
  preferred_term: developmental delay with variable intellectual disability and dysmorphic facies
  term:
    id: MONDO:0859306
    label: developmental delay with variable intellectual disability and dysmorphic facies

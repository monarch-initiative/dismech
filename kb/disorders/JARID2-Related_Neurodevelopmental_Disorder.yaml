- name: Disordered Polycomb-Regulated Gene Expression
  biological_scale: CELLULAR
  description: >-
    Altered JARID2 dosage changes the expression of PRC2 target genes and leaves a genome-wide DNA methylation
    signature, mostly hypomethylation, in peripheral blood. Two hypomethylated regions lie in CpG-island promoters,
    one at HOXA5. JARID2 is expressed in human neurons; which target genes in the developing brain account for the
    neurodevelopmental features is not known.

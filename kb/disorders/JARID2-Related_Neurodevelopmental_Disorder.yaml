notes: >-
  Naming: the MONDO and OMIM (620098) label describes a phenotype that many genes can cause, so it fails the scope test
  for a single-gene entry and is kept as a synonym. The gene-related name follows recurring use in the primary
  literature: "JARID2-related intellectual disability" (PMID:35533077), "JARID2-Neurodevelopmental Syndrome"
  (PMID:35887345) and "JARID2-Neurodevelopmental Disorder" (PMID:37762546). Scope: the entry covers intragenic JARID2
  variants and deletions; larger 6p22-p24 deletions also remove neighbouring genes such as ATXN1, which is thought to
  add intellectual disability and behavioral features of its own (PMID:23294540), and findings from those deletions are
  cited only where the authors attribute them to JARID2. One de novo partial tandem duplication of JARID2 exons 1-7 with
  increased expression of those exons has been reported in a patient with similar features (PMID:35979655); whether
  increased dosage acts through the same mechanism is unresolved. A homozygous JARID2 missense variant reported with a
  female reproductive phenotype (PMID:40886009) is a different condition and is not part of this entry.

- name: Impaired PRC2.2 Recruitment to Target Genes
  biological_scale: MOLECULAR
  description: >-
    JARID2 is an accessory subunit of the PRC2.2 form of Polycomb repressive complex 2, together with AEBP2. It lacks
    demethylase activity and instead helps recruit PRC2 to chromatin and stimulates its H3K27 methyltransferase
    activity, so that developmental genes are kept silent. In mouse cells, the region of JARID2 that mimics H3K27me3
    also restrains the spread of H3K27me3 beyond Polycomb domains, so the net effect of JARID2 loss on H3K27me3 at a
    given locus is not a simple decrease. No study has measured PRC2 occupancy or H3K27me3 in cells from patients.
  cellular_components:
  - preferred_term: PRC2 (ESC/E(Z)) complex
    term:
      id: GO:0035098
      label: ESC/E(Z) complex
  biological_processes:
  - preferred_term: facultative heterochromatin formation
    modifier: DYSREGULATED

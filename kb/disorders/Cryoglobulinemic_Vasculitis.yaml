name: Cryoglobulinemic Vasculitis
creation_date: "2026-05-05T11:41:54Z"
description: >-
  Cryoglobulinemic vasculitis is an immune-complex mediated small-vessel
  vasculitis characterized by circulating cryoglobulins. Pathogenic
  cryoglobulins and B-cell clones form immune complexes that deposit on vascular
  endothelium, activate inflammatory pathways, and produce purpura, arthralgia,
  arthritis, peripheral neuropathy, glomerulonephritis, and other systemic
  manifestations.
category: Complex
disease_term:
  preferred_term: Cryoglobulinemic vasculitis
  term:
    id: MONDO:0007407
    label: Cryoglobulinemic vasculitis
parents:
- Vascular disorder
synonyms:
- Mixed cryoglobulinemia
- Essential mixed cryoglobulinemia
- Meltzer syndrome
- CryoVas
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    evidence:
    - reference: PMID:37916482
      reference_title: "Cryoglobulinemic vasculitis: a 2023 update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Cryoglobulinemic vasculitis (CV) is an immune complex mediated small
        vessel vasculitis characterized by the presence of cryoglobulins in
        serum, often associated with hepatitis C infection, systemic autoimmune
        diseases or hematological conditions.
      explanation: >-
        Systemic immune-complex small-vessel vasculitis falls under immune-mediated
        rheumatologic and vasculitic disorders.
  - classification_value: CARDIOVASCULAR
    evidence:
    - reference: PMID:33186245
      reference_title: "Cryoglobulinemic vasculitis: pathophysiological mechanisms and diagnosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        In vivo, in cold exposed tissues and organs, they can induce vasculitis
        and occlusive vasculopathy after deposition on vascular endothelium
        under low temperature and high concentration conditions.
      explanation: >-
        Endothelial immune-complex deposition, small-vessel wall inflammation,
        and occlusive vasculopathy place CV in vascular pathology.
  - classification_value: KIDNEY_URINARY_TRACT
    evidence:
    - reference: PMID:33186245
      reference_title: "Cryoglobulinemic vasculitis: pathophysiological mechanisms and diagnosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        In profound organs such as the kidneys, CG deposition is less
        temperature-dependent, favored by local protein and anion
        concentrations, and can lead to glomerulonephritis.
      explanation: >-
        Renal cryoglobulin deposition causing membranoproliferative
        glomerulonephritis is a major visceral manifestation of CV.
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:35348938
      reference_title: The wide spectrum of cryoglobulinemic vasculitis and an overview of therapeutic advancements.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The majority of CV patients are infected with hepatitis C virus (HCV),
        whereas lymphoproliferative disorders or connective tissue diseases
        (CTD) are commonly diagnosed among patients with CV of non-infectious
        origin.
      explanation: >-
        Chronic hepatitis C virus infection is the predominant etiologic driver
        of mixed cryoglobulinemic vasculitis.
prevalence:
- population: Not specified (essential mixed cryoglobulinemia)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.0
  rate_denominator: POPULATION
  notes: >-
    PMID:18796155 reports an approximate prevalence of 1 per 100,000 (with a
    3:1 female-to-male ratio) specifically for 'essential' mixed
    cryoglobulinemia, noting that this term now refers only to a minority of
    mixed cryoglobulinemia patients rather than cryoglobulinemic vasculitis
    overall.
  evidence:
  - reference: PMID:18796155
    reference_title: Mixed cryoglobulinemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The prevalence of 'essential' MC is reported as approximately 1:100,000
      (with a female-to-male ratio 3:1), but this term is now used to refer to
      a minority of MC patients only.
    explanation: >-
      Reports the point prevalence estimate of approximately 1 per 100,000 for
      essential mixed cryoglobulinemia and the 3:1 female predominance.
environmental:
- name: Chronic hepatitis C virus infection
  exposure_term:
    preferred_term: hepatitis C virus exposure
    term:
      id: ECTO:3000284
      label: exposure to Hepacivirus hominis
  notes: >-
    ECTO models species-level hepatitis C virus exposure under its ICTV species
    name, exposure to Hepacivirus hominis (ECTO:3000284), parent of the
    strain-specific term ECTO:3000095 (exposure to Hepatitis C virus HCV-476).
  description: >-
    Chronic hepatitis C virus infection is the predominant etiologic trigger of
    type II and type III mixed cryoglobulinemic vasculitis, driving sustained
    viral antigenic stimulation and clonal B-cell expansion with production of
    rheumatoid-factor IgM-anti-IgG immune complexes.
  influences_mechanisms:
  - target: B-cell clonal immune-complex production
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Chronic HCV infection provides sustained viral stimulation of B cells,
      promoting expansion of pathogenic cryoglobulin-producing B-cell clones.
    evidence:
    - reference: PMID:37916482
      reference_title: "Cryoglobulinemic vasculitis: a 2023 update."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Removing viral stimulation on B-cells through direct-acting antivirals and blocking B-cells proliferation and differentiation with rituximab are the goals of treatment of CV.
      explanation: >-
        Therapeutic eradication of HCV removes viral stimulation on B cells,
        establishing viral stimulation of B-cell clones as the upstream driver
        of HCV-associated cryoglobulinemic vasculitis.
  evidence:
  - reference: PMID:35348938
    reference_title: The wide spectrum of cryoglobulinemic vasculitis and an overview of therapeutic advancements.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The majority of CV patients are infected with hepatitis C virus (HCV),
      whereas lymphoproliferative disorders or connective tissue diseases (CTD)
      are commonly diagnosed among patients with CV of non-infectious origin.
    explanation: >-
      Establishes chronic HCV infection as the predominant infectious trigger in
      patients with cryoglobulinemic vasculitis.
  - reference: PMID:32310505
    reference_title: Cryoglobulinemic Vasculitis (Archived).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      CryoVas is famously associated with Hepatitis C (Hep-C) as well as some
      B-cell related blood dyscrasias.
    explanation: >-
      StatPearls chapter confirming chronic Hepatitis C infection and B-cell
      dyscrasias as the principal etiologic associations of cryoglobulinemic
      vasculitis.

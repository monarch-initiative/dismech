      immune complexes composed of rheumatoid factor (RF) monoclonal or polyclonal against polyclonal IgG (type II or type III cryoglobulins, respectively)
    explanation: This defines type II and type III mixed cryoglobulins as RF-containing immune complexes against polyclonal IgG.
pathophysiology:
- name: B-cell clonal immune-complex production
  biological_scale: CELLULAR
  description: >-
    In infectious and noninfectious type II or type III disease, pathogenic
    B-cell clones produce rheumatoid-factor-containing immune complexes that
    drive small-vessel vasculitis; this explains the therapeutic rationale for
    antiviral removal of B-cell stimulation and anti-CD20 B-cell depletion.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: B cell proliferation
    modifier: INCREASED
    term:
      id: GO:0042100
      label: B cell proliferation
  - preferred_term: immunoglobulin production
    modifier: INCREASED
    term:
      id: GO:0002377
      label: immunoglobulin production
  downstream:
  - target: Cryoglobulin immune-complex vascular deposition
    description: Pathogenic B-cell clones provide the cryoprecipitable immune-complex substrate for vascular deposition.
  evidence:
  - reference: PMID:37916482
    reference_title: "Cryoglobulinemic vasculitis: a 2023 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specific B-cell clones are involved in the production of pathogenic immune complexes that leads to small-vessel vasculitis.
    explanation: This supports pathogenic B-cell immune-complex production as a disease mechanism.
- name: Cryoglobulin immune-complex vascular deposition
  conforms_to: "necrotizing_vasculitis#Vessel Wall Immune Stimulus Deposition and Endothelial Activation"
  biological_scale: TISSUE
  description: >-
    Circulating cryoglobulins form pathogenic immune complexes that deposit on
    small-vessel endothelium and can trigger vasculitis or occlusive
    vasculopathy, especially in susceptible tissues and organs.
  locations:
  - preferred_term: wall of blood vessel
    term:
      id: UBERON:0035965
      label: wall of blood vessel
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  downstream:
  - target: Classical complement activation and neutrophil recruitment
    description: Vessel-wall cryoglobulin immune-complex deposits engage classical complement activation and recruit neutrophils.
  - target: Intramural neutrophil Fc-receptor activation and cytotoxic degranulation
    description: Vessel-wall IgG/IgM cryoglobulin lattices crosslink neutrophil Fc-gamma receptors during margination and transmigration.
  - target: Cryoprotein occlusive vasculopathy and hyperviscosity
    description: Cold-precipitable cryoproteins deposited on vascular endothelium promote intraluminal gelation and occlusive vasculopathy.
  evidence:
  - reference: PMID:37916482
    reference_title: "Cryoglobulinemic vasculitis: a 2023 update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cryoglobulinemic vasculitis (CV) is an immune complex mediated small vessel vasculitis characterized by the presence of cryoglobulins in serum, often associated with hepatitis C infection, systemic autoimmune diseases or hematological conditions.
    explanation: This review directly defines CV as an immune-complex small-vessel vasculitis with circulating cryoglobulins.
  - reference: PMID:33186245
    reference_title: "Cryoglobulinemic vasculitis: pathophysiological mechanisms and diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In vivo, in cold exposed tissues and organs, they can induce vasculitis and occlusive vasculopathy after deposition on vascular endothelium under low temperature and high concentration conditions.
    explanation: This supports endothelial deposition of cryoglobulins as a vascular lesion mechanism.
- name: Classical complement activation and neutrophil recruitment
  conforms_to: "necrotizing_vasculitis#Complement C5a Amplification and Neutrophil Recruitment"
  biological_scale: CELLULAR
  description: >-
    Deposited cryoglobulin immune complexes activate the classical complement
    cascade in small and medium vessel walls, consuming C4 and recruiting
    polymorphonuclear neutrophils to the affected vascular segment.
  locations:
  - preferred_term: wall of blood vessel
    term:
      id: UBERON:0035965
      label: wall of blood vessel
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: complement activation, classical pathway
    modifier: INCREASED
    term:
      id: GO:0006958
      label: complement activation, classical pathway
  downstream:
  - target: Intramural neutrophil Fc-receptor activation and cytotoxic degranulation
    description: Complement activation at the vessel wall amplifies neutrophil recruitment and local leukocyte activation.
  evidence:
  - reference: PMID:32310505
    reference_title: Cryoglobulinemic Vasculitis (Archived).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cryoglobulinemic vasculitis (CryoVas) is an immune complex-mediated inflammation of the small and medium-sized blood vessels, involving complement activation.
    explanation: Directly supports complement-mediated small- and medium-vessel inflammation in cryoglobulinemic vasculitis.
  - reference: PMID:18796155
    reference_title: Mixed cryoglobulinemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Low complement activity is almost invariably detectable in MC, with the typical pattern of low or undetectable C4 and normal or relatively normal C3 serum levels, regardless the disease activity (Table 2).
    explanation: Selective C4 consumption establishes classical-pathway complement activation in mixed cryoglobulinemic vasculitis.
- name: Intramural neutrophil Fc-receptor activation and cytotoxic degranulation
  conforms_to: "necrotizing_vasculitis#Intramural Leukocyte Degranulation and Oxidative Burst"
  biological_scale: CELLULAR
  description: >-
    Adherent polymorphonuclear neutrophils bind perivascular IgG/IgM immune
    complexes through Fc-gamma receptors during endothelial transmigration,
    undergoing vigorous activation and releasing cytotoxic products directly
    at the vessel wall.
  locations:
  - preferred_term: wall of blood vessel
    term:
      id: UBERON:0035965
      label: wall of blood vessel
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: Fc-gamma receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0038094
      label: Fc-gamma receptor signaling pathway
  - preferred_term: neutrophil degranulation
    modifier: INCREASED
    term:
      id: GO:0043312
      label: neutrophil degranulation
  downstream:
  - target: Immune-complex small-vessel vascular injury
    description: Release of cytotoxic neutrophil products during transmigration damages the small-vessel wall and produces leukocytoclastic fibrinoid necrosis.
  evidence:
  - reference: DOI:10.3389/fmed.2023.1103065
    reference_title: Pathophysiology and clinical manifestations of immune complex vasculitides
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Marginating PMNs, which are in the process of adhering to endothelial cells and of transmigration, will also bind to the IgG/IgM complexes via their FcyR. Once PMNs are adherent, they become more easily and more vigorously activated after their FcyR are crosslinked by IgG/IgM complexes
    explanation: Directly supports Fc-gamma-receptor crosslinking and activation of marginating neutrophils by perivascular IgG/IgM immune complexes.
  - reference: DOI:10.3389/fmed.2023.1103065
    reference_title: Pathophysiology and clinical manifestations of immune complex vasculitides
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ensuing release of cytotoxic products would subsequently occur close to the vessel wall, perhaps during the diapedesis of PMNs, thus damaging the vessel
    explanation: Directly links intramural release of cytotoxic neutrophil products during diapedesis to vessel-wall damage.
- name: Immune-complex small-vessel vascular injury
  conforms_to: "necrotizing_vasculitis#Fibrinoid Necrosis of the Vessel Wall"
  biological_scale: TISSUE
  description: >-
    Immune-complex deposition, complement consumption, and polymorphonuclear
    neutrophil activation produce leukocytoclastic necrotizing vessel-wall
    inflammation with fibrinoid necrosis, manifesting clinically as purpura,
    skin ulceration, arthralgia/arthritis, constitutional fatigue, peripheral
    neuropathy, and glomerulonephritis.
  locations:
  - preferred_term: wall of blood vessel
    term:
      id: UBERON:0035965
      label: wall of blood vessel
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: complement activation, classical pathway
    modifier: INCREASED
    term:
      id: GO:0006958
      label: complement activation, classical pathway
  downstream:
  - target: Necrotizing vasculitis
    description: Neutrophilic infiltration and vessel-wall destruction manifest histologically as leukocytoclastic necrotizing vasculitis with fibrinoid necrosis.
  - target: Palpable purpura
    description: Dermal postcapillary venule leukocytoclastic vasculitis causes erythrocyte extravasation and palpable purpura.
  - target: Skin ulcer
    description: Severe cutaneous small- and medium-vessel vasculitis leads to ischemic tissue breakdown and skin ulceration.
  - target: Livedo reticularis
    description: Cutaneous small-vessel inflammation and partial microvascular obstruction produce livedo reticularis.
  - target: Fatigue
    description: Systemic immune-complex vascular inflammation drives constitutional asthenia and fatigue as part of Meltzer triad.
  - target: Arthralgia
    description: Immune-complex synovial and microvascular inflammation produces arthralgia.
  - target: Arthritis
    description: Immune-complex articular inflammation manifests clinically as non-erosive arthritis.
  - target: Peripheral neuropathy
    description: Vasa nervorum small-vessel vasculitis causes ischemic axonal injury and peripheral neuropathy.
  - target: Glomerulonephritis
    description: Renal glomerular cryoglobulin deposition and inflammatory injury cause membranoproliferative glomerulonephritis.
  evidence:
  - reference: DOI:10.3389/fmed.2023.1103065
    reference_title: Pathophysiology and clinical manifestations of immune complex vasculitides
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum sickness and CV fulfill the criteria of a type III hypersensitivity immune reaction as large lattices of the IC precipitate at vessel walls and activate polymorphonuclear neutrophils (PMNs).
    explanation: This directly supports immune-complex precipitation at vessel walls with neutrophil activation in CV.
  - reference: PMID:18796155
    reference_title: Mixed cryoglobulinemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Circulating mixed cryoglobulins, low C4 levels and orthostatic skin purpura are the hallmarks of the disease. Leukocytoclastic vasculitis involving medium- and, more often, small-sized blood vessels is the typical pathological finding, easily detectable by means of skin biopsy of recent vasculitic lesions.
    explanation: Low C4 supports complement consumption, while leukocytoclastic small-vessel vasculitis supports the downstream vascular-injury phenotype.
- name: Cryoprotein occlusive vasculopathy and hyperviscosity
  conforms_to: "necrotizing_vasculitis#Luminal Compromise and Downstream Tissue Infarction"
  biological_scale: TISSUE
  subtypes:
  - Type I
  description: >-
    Type I cryoglobulinemic vasculitis can include a cryoprotein-dominant
    intraluminal gelling, occlusive vasculopathy, and hyperviscosity
    presentation in cold-exposed vasculature in addition to inflammatory
    small-vessel vasculitis.
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  downstream:
  - target: Hyperviscosity syndrome
    description: Intravascular cryoprotein gelation increases plasma viscosity and manifests clinically as hyperviscosity syndrome.
  - target: Raynaud phenomenon
    description: Cold-induced cryoprotein precipitation and microvascular vasospasm/occlusion in acral vessels produce Raynaud phenomenon.
  - target: Skin ulcer
    description: Cold-induced cutaneous microvascular occlusion causes ischemic necrosis and acral skin ulceration.
  - target: Livedo reticularis
    description: Partial obstruction of cutaneous microvascular blood flow by cryoprecipitates produces livedo reticularis.
  evidence:
  - reference: PMID:33186245
    reference_title: "Cryoglobulinemic vasculitis: pathophysiological mechanisms and diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In vivo, in cold exposed tissues and organs, they can induce vasculitis and occlusive vasculopathy after deposition on vascular endothelium under low temperature and high concentration conditions.
    explanation: This supports cryoglobulin deposition causing occlusive vasculopathy at vascular endothelium.
  - reference: DOI:10.3389/fmed.2023.1103065
    reference_title: Pathophysiology and clinical manifestations of immune complex vasculitides
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In type I cryoglobulinemia, the monoclonal cryoglobulins gel directly in cold and in the presence of one of the above factors, causing hyperviscosity and subsequently vascular occlusion and ischemic necrosis.
    explanation: Directly supports cold-induced monoclonal cryoglobulin gelling causing hyperviscosity, vascular occlusion, and ischemic necrosis.
  - reference: PMID:21571735
    reference_title: Preliminary classification criteria for the cryoglobulinaemic vasculitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      vascular involvement (purpura, skin ulcers, necrotic skin lesions or necrotising vasculitis biopsy-proven, Raynaud's phenomenon, or hyperviscosity syndrome according to clinical features and plasma viscosity test)
    explanation: This supports hyperviscosity syndrome and Raynaud phenomenon among vascular manifestations in CV classification.

phenotypes:
- category: Histopathologic
  name: Necrotizing vasculitis
  description: >-
    The cutaneous and visceral lesion is a leukocytoclastic vasculitis, whose
    defining histology is neutrophilic infiltration of small vessel walls with
    fibrinoid necrosis and leukocytoclasia — i.e. the necrotizing pattern of
    vessel-wall injury, here driven by immune-complex deposition rather than
    by ANCA. Cryoglobulinaemic vasculitis is one of the systemic diseases most
    frequently underlying a leukocytoclastic vasculitis biopsy.
  phenotype_term:
    preferred_term: Necrotizing vasculitis
    term:
      id: HP:6000253
      label: Necrotizing vasculitis
  diagnostic: true
  evidence:
  - reference: PMID:33713282
    reference_title: "Diagnosis and management of leukocytoclastic vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the inflammatory infiltrate is composed of neutrophils with fibrinoid necrosis
      and disintegration of nuclei into fragments
    explanation: >-
      Defines the leukocytoclastic vasculitis lesion as neutrophilic infiltration
      with fibrinoid necrosis of the vessel wall.
  - reference: PMID:33713282
    reference_title: "Diagnosis and management of leukocytoclastic vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among systemic diseases, the most frequently associated with LCV are
      ANCA-associated vasculitides, connective tissue diseases, cryoglobulinemic
      vasculitis, IgA vasculitis (formerly known as Henoch-Schonlein purpura) and
      hypocomplementemic urticarial vasculitis (HUV).
    explanation: >-
      Names cryoglobulinemic vasculitis among the systemic diseases that present
      with this leukocytoclastic, fibrinoid-necrotic lesion.
- category: Dermatologic
  name: Palpable purpura

name: MYO6_Hearing_Loss
creation_date: '2026-04-04T00:00:00Z'
category: Mendelian
description: >
  MYO6-related hearing loss encompasses autosomal dominant nonsyndromic hearing loss 22
  (DFNA22) and autosomal recessive nonsyndromic hearing loss 37 (DFNB37), both caused
  by pathogenic variants in MYO6 encoding the unconventional myosin VI motor protein.
  Myosin VI is unique among myosins in moving toward the minus end of actin filaments
  and is essential for stereocilia maintenance in cochlear hair cells. Dominant (DFNA22)
  mutations typically cause progressive postlingual sensorineural hearing loss with
  juvenile onset that accelerates after age 40, while recessive (DFNB37) mutations
  cause congenital profound deafness. A subset of families with dominant MYO6 mutations
  also present with hypertrophic cardiomyopathy featuring left ventricular hypertrophy,
  reflecting the role of myosin VI in cardiac tissue. MYO6 accounts for approximately
  2.4% of autosomal dominant sensorineural hearing loss families in Japan and 6.2%
  in a Korean series. Truncating, splice-site, missense and overexpression alleles
  are reported, so hair cells appear sensitive to myosin VI dosage as well as
  motor function. Mouse models show the chain from defective myosin VI to
  stereocilia fusion, hair cell degeneration and reduced inner hair cell ribbon
  synapse release. There is no disease-modifying therapy; allele-selective Cas9
  editing has rescued hearing in a semi-dominant mouse model, while neonatal gene
  replacement failed in the null mouse.
disease_term:
  preferred_term: MYO6-related hearing loss
parents:
- Nonsyndromic Hearing Loss
- Inner Ear Disorder
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0019497
      label: nonsyndromic genetic hearing loss
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0019497 is the disease concept ClinGen's Hearing Loss Gene Curation
      Expert Panel files its MYO6 gene-disease validity assertion against. It is
      recorded here as a broad match rather than as this entry's `disease_term`,
      because binding it would assert identity between a MYO6-specific entry and
      the class covering every nonsyndromic genetic hearing loss, making every
      MONDO descendant of that class - the other gene-defined DFNA and DFNB
      diseases among them - attributable to this entry as a subtype. Searching MONDO with
      synonyms included (`runoak -i ols:mondo search "MYO6"`) returns exactly
      two disease classes, MONDO:0011660 autosomal dominant nonsyndromic hearing
      loss 22 and MONDO:0011912 autosomal recessive nonsyndromic hearing loss
      37, both of which this entry now carries as `has_subtypes` rows with bound
      `subtype_term` values; `search "myosin VI"` returns none. No MONDO class
      denotes the MYO6-related spectrum as a whole, so `disease_term` carries a
      free-text preferred term with no binding and the relationship to the
      broader class is recorded here as a broad match. That also leaves
      MONDO:0019497 itself in the curation queue rather than retiring it
      through this entry.
inheritance:
- name: Autosomal dominant (DFNA22)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Autosomal dominant nonsyndromic hearing loss 22 (DFNA22) is caused by heterozygous
    pathogenic variants in MYO6. Progressive postlingual sensorineural hearing loss
    typically begins in childhood or adolescence and worsens with age.
  evidence:
  - reference: PMID:11468689
    reference_title: "MYO6, the human homologue of the gene responsible for deafness in Snell's waltzer mice, is mutated in autosomal dominant nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe the mapping of a new deafness locus, DFNA22, on chromosome 6q13 in a family affected by a nonsyndromic dominant form of deafness (NSAD), and the subsequent identification of a missense mutation in the MYO6 gene in all members of the family with hearing loss."
    explanation: Original identification of DFNA22 locus with autosomal dominant inheritance linked to MYO6 mutation.
- name: Autosomal recessive (DFNB37)
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Autosomal recessive nonsyndromic hearing loss 37 (DFNB37) is caused by biallelic
    pathogenic variants in MYO6, resulting in congenital profound deafness.
  evidence:
  - reference: PMID:12687499
    reference_title: "Mutations of MYO6 are associated with recessive deafness, DFNB37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cosegregation of profound, congenital deafness with markers on chromosome 6q13 in three Pakistani families defines a new recessive deafness locus, DFNB37."
    explanation: Establishes DFNB37 as an autosomal recessive deafness locus mapping to MYO6 on chromosome 6q13.
pathophysiology:
- name: Myosin VI Motor and Dosage Dysfunction
  biological_scale: MOLECULAR
  description: >
    Pathogenic MYO6 variants alter the minus-end-directed myosin VI motor or its
    dosage. Truncating, splice-site and missense alleles are reported, and a
    motor-domain missense allele in the Tailchaser mouse lowers actin-activated
    ATPase activity and destroys coordination between the two heads of the dimer,
    which myosin VI needs to walk processively along, or anchor to, actin. A
    Belgian DFNA22 family with only a 1.5-1.8-fold overexpression of MYO6 shows
    that hair cells are sensitive to too much as well as too little myosin VI, so
    the dominant disease is not explained by haploinsufficiency alone.
  genes:
  - preferred_term: MYO6
    term:
      id: hgnc:7605
      label: MYO6
  molecular_functions:
  - preferred_term: microfilament motor activity
    modifier: ABNORMAL
    term:
      id: GO:0000146
      label: microfilament motor activity
  evidence:
  - reference: PMID:18833301
    reference_title: "A Myo6 mutation destroys coordination between the myosin heads, revealing new functions of myosin VI in the stereocilia of mammalian inner ear hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The actin-activated ATPase rates measured for the D179Y mutation are decreased, and indicate loss of coordination of the myosin VI heads or 'gating' in the dimer form."
    explanation: >-
      Biochemical analysis of the Tailchaser (D179Y) motor-domain allele shows a
      missense variant directly impairs myosin VI motor function.
  - reference: PMID:18212818
    reference_title: "A splice-site mutation and overexpression of MYO6 cause a similar phenotype in two families with autosomal dominant hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study indicates that the inner ear hair cells are sensitive to changes in expression levels of MYO6."
    explanation: >-
      A splice-site allele and a 1.5-1.8-fold overexpression produce a similar
      DFNA22 phenotype, supporting dosage sensitivity as part of the molecular
      lesion.
  downstream:
  - target: Stereocilia Dysfunction in Cochlear Hair Cells
    causal_link_type: DIRECT
    description: >-
      Loss of normal motor or anchoring function leaves stereocilia without the
      membrane-to-actin tethering and cargo transport myosin VI supplies.
    evidence:
    - reference: PMID:18833301
      reference_title: "A Myo6 mutation destroys coordination between the myosin heads, revealing new functions of myosin VI in the stereocilia of mammalian inner ear hair cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This loss of myosin VI function may not allow myosin VI to transport its cargoes appropriately at the base and within the stereocilia, or to anchor the membrane of stereocilia to actin filaments via its cargos, both of which lead to structural changes in the stereocilia of myosin VI-impaired hair cells, and ultimately leading to deafness."
      explanation: >-
        States the causal step from impaired myosin VI motor function to
        structural stereocilia change in the Tailchaser model.
  - target: Inner Hair Cell Ribbon Synapse Exocytosis Defect
    description: >-
      Myosin VI loss or the deafness-inducing C442Y mutation reduces inner hair
      cell ribbon synapse vesicle release.
- name: Stereocilia Dysfunction in Cochlear Hair Cells
  conforms_to: "sensorineural_hair_cell_loss#Hair Cell Mechanotransduction Failure and Death"
  biological_scale: CELLULAR
  description: >
    MYO6 encodes myosin VI, the only known minus-end-directed actin-based motor
    protein. In cochlear hair cells, myosin VI is essential for anchoring the
    stereocilia plasma membrane to the actin core and for maintaining stereocilia
    structural integrity. Loss-of-function mutations lead to disorganized and
    malformed stereocilia, impairing mechanotransduction and causing sensorineural
    hearing loss. In the Myo6-null Snell's waltzer mouse, bundles look normal at
    birth but stereocilia progressively fuse over the first postnatal week and
    giant stereocilia form by day 20, consistent with myosin VI anchoring the
    apical membrane to the cuticular plate. Patient-derived dominant variants
    shorten espin1-induced microvilli in cultured epithelial cells.
  genes:
  - preferred_term: MYO6
    term:
      id: hgnc:7605
      label: MYO6
  molecular_functions:
  - preferred_term: microfilament motor activity
    term:
      id: GO:0000146
      label: microfilament motor activity
  cell_types:
  - preferred_term: Auditory hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  biological_processes:
  - preferred_term: Stereocilium maintenance
    modifier: DECREASED
    term:
      id: GO:0120045
      label: stereocilium maintenance
  - preferred_term: Actin cytoskeleton organization
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
  - preferred_term: Endocytosis
    modifier: ABNORMAL
    term:
      id: GO:0006897
      label: endocytosis
  evidence:
  - reference: PMID:32143290
    reference_title: "Clinical Characteristics and In Vitro Analysis of MYO6 Variants Causing Late-Onset Progressive Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, the present data clearly showed that MYO6 is one of the genes to keep in mind with regard to ADSNHL, and the molecular characteristics of the identified gene variants suggest that a possible pathology seems to result from malformed stereocilia of the cochlear hair cells."
    explanation: Links MYO6 variants to stereocilia malformation as the mechanism underlying hearing loss.
  - reference: PMID:32143290
    reference_title: "Clinical Characteristics and In Vitro Analysis of MYO6 Variants Causing Late-Onset Progressive Hearing Loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cells with wildtype myosin 6 and espin1 co-expressed created long microvilli, while co-expression with mutant constructs resulted in severely shortened microvilli."
    explanation: >-
      Patient-derived MYO6 variants fail to support espin1-induced microvillus
      elongation in epithelial cells, a cell-culture proxy for stereocilia
      structure.
  - reference: PMID:31103816
    reference_title: "A humanized mouse model, demonstrating progressive hearing loss caused by MYO6 p.C442Y, is inherited in a semi-dominant pattern."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We also observed disorganized stereocilia with irregular morphological features by immunohistochemistry and scanning electron microscopy."
    explanation: Mouse model confirms that MYO6 mutation causes stereocilia disorganization in vivo.
  - reference: PMID:10525338
    reference_title: "Role of myosin VI in the differentiation of cochlear hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Practically all hair cells show fused stereocilia by 3 days after birth, and there is extensive stereocilia fusion by 7 days."
    explanation: Snell's waltzer (Myo6-null) hair cells develop progressive stereocilia fusion after birth.
  - reference: PMID:10525338
    reference_title: "Role of myosin VI in the differentiation of cochlear hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "One possible model for the fusion is that myosin VI may be involved in anchoring the apical hair cell membrane to the underlying actin-rich cuticular plate, and in the absence of normal myosin VI this apical membrane will tend to pull up between stereocilia, leading to fusion."
    explanation: Proposes the membrane-anchoring mechanism by which myosin VI loss produces stereocilia fusion.
  - reference: PMID:7493015
    reference_title: "The mouse Snell's waltzer deafness gene encodes an unconventional myosin required for structural integrity of inner ear hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that sv encodes an unconventional myosin heavy chain, myosin VI, which is expressed within the sensory hair cells of the inner ear, and appears to be required for maintaining their structural integrity."
    explanation: Positional cloning of Snell's waltzer establishes myosin VI as a hair-cell protein required for structural integrity.
  - reference: PMID:38562617
    reference_title: "Pathophysiology of human hearing loss associated with variants in myosins."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "MYO6 is thought to connect the plasma membrane to the F-actin core at stereocilia tapered base and also function in the cuticular plate."
    explanation: Review synthesis locating the myosin VI anchoring function at the stereocilia base and cuticular plate.
  downstream:
  - target: Hair Cell Degeneration
    description: >-
      Disorganized, fused stereocilia bundles precede loss of the hair cells
      themselves in Myo6 mutant mice.
    evidence:
    - reference: PMID:42665733
      reference_title: "Assessment of auditory and vestibular function and gene therapy in the Snell's waltzer mouse model of human deafness and balance dysfunction."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These mice exhibit profound hearing loss, with cochlear hair cell stereocilia beginning to fuse soon after birth, ultimately leading to disorganization of hair bundles and degeneration of hair cells."
      explanation: Describes the sequence from stereocilia fusion to hair bundle disorganization to hair cell degeneration in Myo6sv/sv mice.
  - target: Progressive Sensorineural Hearing Loss
- name: Hair Cell Degeneration
  biological_scale: CELLULAR
  description: >
    Cochlear hair cells carrying defective myosin VI degenerate after their
    stereocilia become disorganized. In the humanized Myo6-C442Y knock-in mouse,
    the progressive hearing loss tracks hair cell degeneration in the organ of
    Corti, and allele-selective editing of the mutant allele increases hair cell
    survival.
  cell_types:
  - preferred_term: Auditory hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  biological_processes:
  - preferred_term: Cell death
    modifier: INCREASED
    term:
      id: GO:0008219
      label: cell death
  evidence:
  - reference: PMID:31103816
    reference_title: "A humanized mouse model, demonstrating progressive hearing loss caused by MYO6 p.C442Y, is inherited in a semi-dominant pattern."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The hearing loss corresponded to the degeneration of hair cells in the organ of Corti."
    explanation: Links the progressive hearing loss of the DFNA22 knock-in model to hair cell degeneration.
  downstream:
  - target: Progressive Sensorineural Hearing Loss
    description: >-
      Loss of hair cells removes the sensory receptors, so threshold loss
      accumulates as hair cells degenerate.
    evidence:
    - reference: PMID:31103816
      reference_title: "A humanized mouse model, demonstrating progressive hearing loss caused by MYO6 p.C442Y, is inherited in a semi-dominant pattern."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The hearing loss corresponded to the degeneration of hair cells in the organ of Corti."
      explanation: The hearing loss in the knock-in model corresponds to the hair cell degeneration.
- name: Inner Hair Cell Ribbon Synapse Exocytosis Defect
  biological_scale: CELLULAR
  description: >
    MYO6 knockout and deafness-inducing MYO6 point mutation impair exocytosis at
    inner hair cell ribbon synapses, reducing readily releasable vesicle pool
    function and sustained synaptic release.
  cell_types:
  - preferred_term: Cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  biological_processes:
  - preferred_term: Exocytosis
    modifier: DECREASED
    term:
      id: GO:0006887
      label: exocytosis
  evidence:
  - reference: PMID:37258513
    reference_title: "Functional and developmental changes in the inner hair cell ribbon synapses caused by Myosin VI knockout and deafness-inducing point mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In Myo6-/- cochleae of both before (P8-10) and after hearing onset (P18-20), exocytosis from IHCs, measured in whole-cell capacitance change (ΔCm), was significantly reduced"
    explanation: Mouse knockout evidence directly supports reduced inner hair cell exocytosis at ribbon synapses downstream of MYO6 loss.
  - reference: PMID:37258513
    reference_title: "Functional and developmental changes in the inner hair cell ribbon synapses caused by Myosin VI knockout and deafness-inducing point mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "it was likely due to smaller RRP and slower SRR in mature IHCs of both animal models."
    explanation: Mouse knockout and p.C442Y models support impaired readily releasable vesicle pool and sustained release rate as synaptic mechanisms.
  downstream:
  - target: Progressive Sensorineural Hearing Loss
- name: Progressive Sensorineural Hearing Loss
  biological_scale: TISSUE
  description: >
    In DFNA22, heterozygous MYO6 mutations cause progressive sensorineural hearing
    loss typically beginning in childhood and accelerating after age 40. The progressive
    nature resembles presbyacusis. In DFNB37, biallelic MYO6 mutations cause congenital
    profound deafness.
  evidence:
  - reference: PMID:32143290
    reference_title: "Clinical Characteristics and In Vitro Analysis of MYO6 Variants Causing Late-Onset Progressive Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present study clarified that most cases showed juvenile-onset progressive hearing loss and their hearing deteriorated markedly after 40 years of age."
    explanation: Characterizes the progressive nature and age-dependent acceleration of MYO6-related hearing loss.
  - reference: PMID:23340379
    reference_title: "Progressive hereditary hearing impairment caused by a MYO6 mutation resembles presbyacusis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This missense mutation results in a flat configured audiogram with a mild hearing loss, which becomes severe to profound and gently to steeply downsloping later in life."
    explanation: Further characterization of progressive hearing loss pattern in a DFNA22 family showing presbyacusis-like progression.
  - reference: PMID:12687499
    reference_title: "Mutations of MYO6 are associated with recessive deafness, DFNB37."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In families with recessively inherited deafness, DFNB37, our sequence analyses of MYO6 reveal a frameshift mutation (36-37insT), a nonsense mutation (R1166X), and a missense mutation (E216V)."
    explanation: Documents the allelic spectrum in recessive DFNB37 including truncating and missense variants causing congenital deafness.
  downstream:
  - target: Sensorineural hearing impairment
    description: >-
      The cochlear lesion is the mechanism behind the clinically observed
      sensorineural hearing impairment, in both the dominant and the recessive
      form.
  - target: Progressive hearing impairment
    description: >-
      In the dominant form the loss is not static, so the same cochlear lesion
      also accounts for the age-dependent threshold deterioration recorded on
      that phenotype.
  - target: Postlingual sensorineural hearing impairment
    description: >-
      In the dominant form the cochlear lesion becomes clinically apparent only
      after speech acquisition, from childhood to adulthood.
  - target: Congenital profound sensorineural hearing impairment
    description: >-
      In the recessive form, with no functional myosin VI, the lesion is
      already present at birth.
  - target: Profound sensorineural hearing impairment
    description: >-
      The end point of the recessive form, and of the dominant form late in
      life.
- name: Cardiac Involvement
  biological_scale: TISSUE
  description: >
    A subset of individuals with dominant MYO6 mutations develop hypertrophic
    cardiomyopathy with left ventricular hypertrophy. Myosin VI is expressed in
    cardiac tissue, predominantly in vascular endothelial cells, and loss of function
    leads to left ventricular hypertrophy with interstitial and perivascular fibrosis.
  evidence:
  - reference: PMID:26265212
    reference_title: "Myosin VI and cardiomyopathy: Left ventricular hypertrophy, fibrosis, and both cardiac and pulmonary vascular endothelial cell defects in the Snell's waltzer mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sv/sv heart mass is significantly greater than that of sv/+ littermates, a result of left ventricle hypertrophy. The left ventricle of the sv/sv exhibits extensive fibrosis, both interstitial and perivascular"
    explanation: Snell's waltzer mouse model demonstrates that MYO6 loss of function causes left ventricular hypertrophy and cardiac fibrosis.
  - reference: PMID:26265212
    reference_title: "Myosin VI and cardiomyopathy: Left ventricular hypertrophy, fibrosis, and both cardiac and pulmonary vascular endothelial cell defects in the Snell's waltzer mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice and humans, loss of myosin VI (Myo6) function results in deafness, and certain Myo6 mutations also result in cardiomyopathies in humans."
    explanation: Establishes the dual phenotype of deafness and cardiomyopathy associated with myosin VI dysfunction.
  - reference: PMID:26265212
    reference_title: "Myosin VI and cardiomyopathy: Left ventricular hypertrophy, fibrosis, and both cardiac and pulmonary vascular endothelial cell defects in the Snell's waltzer mouse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to deafness, a kindred of patients has been identified with an autosomal dominant mutation in the motor domain of Myo6 who also present with familial hypertrophic cardiomyopathy"
    explanation: The full-text introduction summarizes the previously reported human MYO6 kindred with deafness and familial hypertrophic cardiomyopathy, restoring direct human support for the cardiac claim when the primary PMID cache lacks abstract text.
  downstream:
  - target: Hypertrophic cardiomyopathy
    description: >-
      Loss of myosin VI function produces the hypertrophic cardiomyopathy
      reported in the dominant MYO6 kindred.
  - target: Left ventricular hypertrophy
    description: >-
      Left ventricular hypertrophy is the chamber-level expression of the
      cardiac involvement. The measurement behind it is in the MYO6-null mouse;
      the human kindred is reported as hypertrophic cardiomyopathy rather than
      as left ventricular hypertrophy specifically.
phenotypes:
- category: Clinical
  name: Sensorineural hearing impairment
  description: >
    Progressive sensorineural hearing loss is the hallmark feature. In DFNA22,
    onset is typically juvenile with accelerating deterioration after age 40.
    In DFNB37, hearing loss is congenital and profound.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:

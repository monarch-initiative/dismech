    reference_title: "In silico and in vivo analyses of a novel variant in MYO6 identified in a family with postlingual non-syndromic hearing loss from Argentina."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's mother (III-5) and three aunts (III-1, III-3 and III-6) presented mild-moderate to severe and profound postlingual hearing impairment with onset in their thirties."
    explanation: Documents adult-onset postlingual hearing impairment of variable severity in a MYO6 p.Arg925Ser family.
  - reference: PMID:29607572
    reference_title: "A clinical guidance to DFNA22 drawn from a Korean cohort study with an autosomal dominant deaf population: A retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five DFNA22 families demonstrated extremely diverse audiogram configurations and age of onset with even intrafamilial variations, whereas the severity of hearing loss mostly ranged within moderate."
    explanation: Korean DFNA22 cohort shows variable onset and audiogram shape with mostly moderate severity.
- category: Clinical
  name: Congenital profound sensorineural hearing impairment
  subtype: DFNB37
  description: >
    Biallelic MYO6 variants cause profound deafness that is present from birth,
    in contrast to the postlingual progressive course of the dominant form.

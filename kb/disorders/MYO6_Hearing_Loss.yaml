  relationship_type: CAUSATIVE
  features: 'MYO6 encodes unconventional myosin VI, the only known minus-end-directed actin-based motor. Heterozygous missense variants cause dominant progressive postlingual sensorineural hearing loss (DFNA22). The H246R allele has been associated with both hearing loss and hypertrophic cardiomyopathy.'
  inheritance:

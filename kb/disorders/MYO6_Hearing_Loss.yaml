      label: Hearing threshold Ear - left --4000 Hz
  - preferred_term: hearing threshold, right ear, 4000 Hz
    term:
      id: LOINC:89023-6
      label: Hearing threshold Ear - right --4000 Hz
  reference_ranges:
  - unit: dB
    population: >-
      Grades recommended by the Global Burden of Disease Expert Group on Hearing Loss, better-ear average
      of 500, 1000, 2000 and 4000 Hz, as tabulated by Olusanya, Davis and Hoffman (WHO Bulletin)
    interpretation_bands:
    - name: Normal hearing
      upper_bound: 20
      unit: dB
      abnormal_flag: NORMAL
    - name: Mild hearing loss
      lower_bound: 20
      upper_bound: 35
      unit: dB
      abnormal_flag: HIGH
      severity: MILD
    - name: Moderate hearing loss
      lower_bound: 35
      upper_bound: 50
      unit: dB
      abnormal_flag: HIGH
      severity: MODERATE
    - name: Moderately severe hearing loss
      lower_bound: 50
      upper_bound: 65
      unit: dB
      abnormal_flag: HIGH
    - name: Severe hearing loss
      lower_bound: 65
      upper_bound: 80
      unit: dB
      abnormal_flag: HIGH
      severity: SEVERE
    - name: Profound hearing loss
      lower_bound: 80
      upper_bound: 95
      unit: dB
      abnormal_flag: HIGH
    - name: Complete or total hearing loss
      lower_bound: 95
      unit: dB
      abnormal_flag: HIGH
    notes: >-
      Values are dB hearing level (HL). The source gives each grade as a closed range to one decimal place
      (Mild hearing loss 20.0 to 34.9 dB hearing level, and so on up to Complete or total hearing loss 95.0
      dB hearing level or greater); the half-open bands here are the same partition. The source splits
      normal hearing into -10.0 to 4.9 and 5.0 to 19.9 dB hearing level; both are folded into one Normal
      hearing band. Its Unilateral category (below 20.0 dB in the better ear, 35.0 dB or greater in the
      worse ear) needs both ears and is not representable as a band. Severity is set only where the grade
      name is mild, moderate or severe. DFNB37's congenital loss is described as profound, which falls in
      this scheme's Profound or Complete bands; DFNA22's progressive loss can occupy any band depending on
      age and time since onset, which is what the quantified progression rate above describes rather than a
      single severity. The grading itself is generic to hearing loss of any cause, not specific to MYO6.
    evidence:
    - reference: PMID:31656340
      reference_title: 'Hearing loss grades and the International classification of functioning, disability and health.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Mild hearing loss | 20.0 to 34.9 dB hearing level"
      explanation: >-
        Table 2 row giving the lower boundary of hearing loss and the mild grade in the Global Burden of
        Disease Expert Group scheme.
    - reference: PMID:31656340
      reference_title: 'Hearing loss grades and the International classification of functioning, disability and health.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Complete or total hearing loss | 95.0 dB hearing level or greater"
      explanation: Table 2 row giving the top, open-ended grade, the band DFNB37's profound congenital loss falls in.
  evidence:
  - reference: PMID:32143290
    reference_title: "Clinical Characteristics and In Vitro Analysis of MYO6 Variants Causing Late-Onset Progressive Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "most cases showed juvenile-onset progressive hearing loss and their hearing deteriorated markedly after 40 years of age"
    explanation: Establishes the progressive DFNA22 pattern audiometry documents over time.
  - reference: PMID:32143290
    reference_title: "Clinical Characteristics and In Vitro Analysis of MYO6 Variants Causing Late-Onset Progressive Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The estimated hearing deterioration was found to be 0.57 dB per year; when restricted to change after 40 years of age, the deterioration speed was accelerated to 1.07 dB per year."
    explanation: Quantifies the DFNA22 progression rate the panel and per-frequency codes would track across serial audiograms.
- name: Molecular genetic testing
  description: >-
    Diagnosis is confirmed by finding a MYO6 variant on a hearing-loss gene
    panel or exome, with segregation checked in the family. Because onset age
    and audiogram shape vary widely, the audiological phenotype alone does not
    point to MYO6.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:39664812
    reference_title: "In silico and in vivo analyses of a novel variant in MYO6 identified in a family with postlingual non-syndromic hearing loss from Argentina."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After Whole Exome Sequencing analysis, the variant c.2775G>C p.Arg925Ser in MYO6 was detected in a family with postlingual non-syndromic hearing loss."
    explanation: Exome sequencing identified the causal MYO6 variant.
  - reference: PMID:29607572
    reference_title: "A clinical guidance to DFNA22 drawn from a Korean cohort study with an autosomal dominant deaf population: A retrospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Extremely diverse audiological configurations of DFNA22 suggest that MYO6 should be considered in future genetic studies of patients with AD NSHL."
    explanation: Phenotypic variability means MYO6 should be included in genetic testing of dominant nonsyndromic hearing loss.
notes: >-
  GENEREVIEWS BASELINE. No GeneReviews chapter covers MYO6-related hearing loss.
  `just check-genereviews kb/disorders/MYO6_Hearing_Loss.yaml` reports
  GeneReviews NO_CHAPTER against the committed Bookshelf index snapshot of
  2026-09-10 (958 GeneReviews chapters indexed). The closest indexed chapter is
  the family-level "Genetic Hearing Loss Overview"; its cached record holds only
  the chapter's statement of purpose and contains no sentence mentioning MYO6,
  DFNA22 or DFNB37, so it carries no quotable evidence for this entry and is not
  cited. That chapter is named by title only: the GeneReviews checker treats a
  chapter identifier appearing anywhere in the file as a citation, so naming it
  by identifier here would turn this note's own subject into a reported gap.

  ORPHANET NOT CONSULTED. None of the 361 ORPHA records committed to
  `references_cache/` mentions MYO6, DFNA22 or DFNB37 (searched with `grep -l
  "DFNA22\|DFNB37\|MYO6" references_cache/ORPHA_*.md`), so Orphanet contributes
  nothing to this entry.

  LOCUS NOTATION. The quoted snippets from PMID:11468689 and PMID:12687499 place
  MYO6 on chromosome 6q13, which is what those papers say. HGNC's current record
  for hgnc:7605 gives the location as 6q14.1. Both are correct for their source;
  do not "correct" the quoted sentences against the current band.

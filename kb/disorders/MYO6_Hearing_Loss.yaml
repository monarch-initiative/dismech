genetic:
- name: MYO6 heterozygous variants (DFNA22)
  subtype: DFNA22
  gene_term:
    preferred_term: MYO6
    term:
      id: hgnc:7605
      label: MYO6
  association: Causative
  relationship_type: CAUSATIVE
  features: 'MYO6 encodes unconventional myosin VI, the only known minus-end-directed actin-based motor. Heterozygous missense variants cause dominant progressive postlingual sensorineural hearing loss (DFNA22). The H246R allele has been associated with both hearing loss and hypertrophic cardiomyopathy.'
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  case_fractions:
  - population: Japanese autosomal dominant sensorineural hearing loss families
    case_fraction_percent: 2.4
    cohort_size: 1336
    notes: >-
      Recorded as a per-gene case fraction rather than under `prevalence:`: the
      figure is the share of a disease cohort explained by MYO6, not the
      occurrence of MYO6-related hearing loss in a population.
    evidence:
    - reference: PMID:32143290
      reference_title: Clinical Characteristics and In Vitro Analysis of MYO6 Variants Causing Late-Onset Progressive Hearing Loss.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In total, 2.40% of autosomal dominant sensorineural hearing loss (ADSNHL) in families in this study (32 out of 1336) was found to be caused by MYO6 mutations."
      explanation: Quantifies the share of autosomal dominant sensorineural hearing loss families attributable to MYO6 in a Japanese screening cohort.
  - population: Korean autosomal dominant nonsyndromic hearing loss families (two hospitals)
    case_fraction_percent: 6.2
    cohort_size: 81
    notes: Five of 81 families segregated a MYO6 variant.
    evidence:
    - reference: PMID:29607572
      reference_title: "A clinical guidance to DFNA22 drawn from a Korean cohort study with an autosomal dominant deaf population: A retrospective cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The overall frequency of DFNA22 among such cases was 6.2%."
      explanation: Share of Korean autosomal dominant nonsyndromic hearing loss families explained by MYO6.
  variants:
  - name: p.Cys442Tyr (C442Y)
    description: >-
      Motor-domain missense variant in the original Italian DFNA22 family. A
      humanized knock-in mouse carrying it reproduces progressive postlingual
      deafness in a semi-dominant pattern.
    evidence:
    - reference: PMID:31103816
      reference_title: "A humanized mouse model, demonstrating progressive hearing loss caused by MYO6 p.C442Y, is inherited in a semi-dominant pattern."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "We established a humanized knock-in mouse model, Myo6-C442Y, to mimic the p.C442Y missense variant identified in human patients with autosomal dominant nonsyndromic hearing loss designated as DFNA22."
      explanation: Identifies p.C442Y as a human DFNA22 variant and the basis of the knock-in model.
  - name: p.Arg205Ter (p.R205X)
    description: >-
      Recurrent heterozygous truncating variant, found in three of five Korean
      DFNA22 families.
    evidence:
    - reference: PMID:29607572
      reference_title: "A clinical guidance to DFNA22 drawn from a Korean cohort study with an autosomal dominant deaf population: A retrospective cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Specifically, we found p.R205X from three of five DFNA22 families (60%)."
      explanation: Establishes p.R205X as the predominant Korean DFNA22 allele.
  - name: p.Gly223Arg and p.Thr158Arg
    description: Novel missense variants in two Korean DFNA22 families.
    evidence:
    - reference: PMID:29607572
      reference_title: "A clinical guidance to DFNA22 drawn from a Korean cohort study with an autosomal dominant deaf population: A retrospective cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified two novel missense variants of MYO6: p.G223R (SB290) and p.T158R (SB305)."
      explanation: Reports two missense DFNA22 variants.
  - name: c.IVS23+2321T>G (deep intronic splice-site)
    description: >-
      Deep intronic variant that inserts 108 bp of intron 23 into the mRNA and
      creates a premature stop, yet only 15-20% of the transcript is removed by
      nonsense-mediated decay, so an aberrant protein may be made.
    evidence:
    - reference: PMID:18212818
      reference_title: "A splice-site mutation and overexpression of MYO6 cause a similar phenotype in two families with autosomal dominant hearing loss."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation causes a frameshift and a premature termination codon, but real-time PCR revealed that only 15-20% of the mRNA is degraded by nonsense-mediated decay, while the other part may give rise to an aberrant protein."
      explanation: Characterizes the splice consequence of the Belgian DFNA22 variant.
  - name: c.2775G>C (p.Arg925Ser)
    description: >-
      Likely pathogenic missense variant in the single alpha helix region, found
      in an Argentine family with postlingual hearing loss. Human mutant RNA
      fails to fully rescue a zebrafish myo6b knockdown.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:39664812
      reference_title: "In silico and in vivo analyses of a novel variant in MYO6 identified in a family with postlingual non-syndromic hearing loss from Argentina."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "After Whole Exome Sequencing analysis, the variant c.2775G>C p.Arg925Ser in MYO6 was detected in a family with postlingual non-syndromic hearing loss."
      explanation: Identifies the variant in an affected family.
    - reference: PMID:39664812
      reference_title: "In silico and in vivo analyses of a novel variant in MYO6 identified in a family with postlingual non-syndromic hearing loss from Argentina."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our results revealed a reduced functionality of the mutated protein, strongly suggesting the pathogenicity of the MYO6 variant."
      explanation: Zebrafish rescue assay supports reduced function of the variant protein.
  - name: c.[2377T>G;2382G>T] (p.[Trp793Gly;Lys794Asn]) in cis
    description: >-
      Two missense changes on one allele, segregating with early-onset severe
      progressive hearing loss in a Chinese family.
    evidence:
    - reference: PMID:38274113
      reference_title: "Novel cis compound heterozygous variants in MYO6 causes early onset of non-syndromic hearing loss in a Chinese family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "positioned in a cis pattern, as plausible pathogenic contributors to early-onset hearing loss characterized by a severe and progressive course."
      explanation: >-
        Reports that the two novel MYO6 variants lie in cis and are plausible
        causes of the family's early-onset severe progressive loss.
  - name: c.737A>G (p.His246Arg)
    description: Missense mutation associated with both sensorineural hearing loss and hypertrophic cardiomyopathy in a large kindred.
    evidence:
    - reference: PMID:26265212
      reference_title: "Myosin VI and cardiomyopathy: Left ventricular hypertrophy, fibrosis, and both cardiac and pulmonary vascular endothelial cell defects in the Snell's waltzer mouse."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a kindred of patients has been identified with an autosomal dominant mutation in the motor domain of Myo6 who also present with familial hypertrophic cardiomyopathy"
      explanation: The cited full text summarizes the human MYO6 motor-domain kindred with familial hypertrophic cardiomyopathy; it supports the variant-associated phenotype claim, though the exact cDNA/protein notation is not present in this cached passage.
  evidence:
  - reference: PMID:32451864
    reference_title: "Myosins and Hearing."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The evidence that pathogenic variants of human MYO3A, MYO6, MYO7A, MYO15A, MYH14 and MYH9 are associated with deafness ranges from moderate to definitive."
    explanation: Review confirms definitive evidence for MYO6 as a deafness gene.
  - reference: PMID:11468689
    reference_title: "MYO6, the human homologue of the gene responsible for deafness in Snell's waltzer mice, is mutated in autosomal dominant nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the unconventional myosin VI gene, Myo6, are associated with deafness and vestibular dysfunction in the Snell's waltzer (sv) mouse. The corresponding human gene, MYO6, is located on chromosome 6q13."
    explanation: First identification of MYO6 as the causative gene for DFNA22.
  - reference: CGGV:assertion_50d408fe-e298-4683-985c-57a37b30e273-2018-02-20T170000.000Z
    reference_title: "MYO6 / nonsyndromic genetic hearing loss (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MYO6 | HGNC:7605 | nonsyndromic genetic hearing loss | MONDO:0019497 | AD | Definitive"
    explanation: ClinGen classifies the MYO6-nonsyndromic genetic hearing loss gene-disease relationship as definitive with autosomal dominant inheritance. ClinGen's Hearing Loss Gene Curation Expert Panel files the assertion against the broad nonsyndromic class, which is why this entry records that class as a broad match rather than as its disease_term.

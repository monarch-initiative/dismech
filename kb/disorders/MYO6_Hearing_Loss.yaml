  association: Causative
  relationship_type: CAUSATIVE
  features: 'Biallelic MYO6 variants cause congenital profound deafness (DFNB37). Reported alleles include a frameshift (36-37insT), a nonsense variant (R1166X) and a missense variant (E216V), so both truncating and missense mechanisms are represented on the recessive side.'
  inheritance:

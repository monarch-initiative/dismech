  description: >
    Dominant MYO6 hearing loss is postlingual. Onset varies widely, from
    childhood (around 8-10 years in a Chinese family) to the thirties in an
    Argentine family, and audiogram configuration varies even within a family,
    while severity in the Korean series mostly stays moderate.
  phenotype_term:
    preferred_term: Postlingual sensorineural hearing impairment
    term:
      id: HP:0008596
      label: Postlingual sensorineural hearing impairment
  evidence:

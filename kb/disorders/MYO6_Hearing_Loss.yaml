    explanation: ClinGen classifies the MYO6-nonsyndromic genetic hearing loss gene-disease relationship as definitive with autosomal dominant inheritance. ClinGen's Hearing Loss Gene Curation Expert Panel files the assertion against the broad nonsyndromic class, which is why this entry records that class as a broad match rather than as its disease_term.

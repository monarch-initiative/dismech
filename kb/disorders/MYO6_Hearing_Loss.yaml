treatments:
- name: Hearing aids
  description: >
    Conventional amplification is considered for DFNA22 patients with progressive
    hearing loss when speech audiometry remains favorable.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid usage
  evidence:
  - reference: DOI:10.1002/jgm.3019
    reference_title: "A clinical guidance to DFNA22 drawn from a Korean cohort study with an autosomal dominant deaf population: A retrospective cohort study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gradual progression with a good speech audiometry score could provide physicians with clinical insight with respect to advising patients to use hearing aids or consider middle ear implants"
    explanation: DFNA22 cohort guidance explicitly supports hearing-aid use in appropriately selected MYO6-related hearing loss patients.
- name: Cochlear implantation
  description: >
    Cochlear implantation may be considered in selected exceptional circumstances
    when MYO6-related hearing loss is severe enough that conventional amplification
    is inadequate.
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: DOI:10.1002/jgm.3019
    reference_title: "A clinical guidance to DFNA22 drawn from a Korean cohort study with an autosomal dominant deaf population: A retrospective cohort study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in the case of certain exceptional circumstances, physicians could provide patients with the option to consider a cochlear implant."
    explanation: DFNA22 clinical guidance supports cochlear implant consideration for selected MYO6-related hearing loss patients.
- name: Allele-selective Cas9 editing of the mutant Myo6 allele (preclinical)
  description: >
    Experimental, preclinical only. Inner-ear delivery of AAV-PHP.eB carrying
    SaCas9-KKH and a guide RNA that preferentially cuts the dominant Myo6 C442Y
    allele rescued auditory function for up to 5 months in heterozygous
    Myo6WT/C442Y mice, with more regular hair bundles and better hair cell
    survival. It targets the dominant (DFNA22-type) mechanism and has not been
    tested in humans.
  therapeutic_modality: GENE_EDITING
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Myosin VI Motor and Dosage Dysfunction
    treatment_effect: INHIBITS
    description: >-
      Disrupting the mutant allele removes the dominant-acting mutant myosin VI
      while leaving the wild-type allele largely intact.
  evidence:
  - reference: PMID:34174443
    reference_title: "Gene editing in a Myo6 semi-dominant mouse model rescues auditory function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The in vivo editing efficiency of the AAV-SaCas9-KKH-Myo6-g2 system on Myo6C442Y is 4.05% on average in Myo6WT/C442Y mice, which was ∼17-fold greater than editing efficiency of Myo6WT alleles."
    explanation: Shows allele-selective editing of the mutant allele in vivo.
  - reference: PMID:34174443
    reference_title: "Gene editing in a Myo6 semi-dominant mouse model rescues auditory function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Rescue of auditory function was observed up to 5 months post AAV-SaCas9-KKH-Myo6-g2 injection in Myo6WT/C442Y mice."
    explanation: Shows durable auditory rescue in the semi-dominant mouse model.
- name: AAV Myo6 gene replacement (preclinical)
  description: >
    Experimental, preclinical only. In Myo6-null Snell's waltzer mice, AAV
    delivery of Myo6 on the day of birth or the day after did not restore
    hearing or balance. The authors suggest that the recessive, null form may
    need prenatal treatment, because stereocilia start to fuse soon after birth.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:42665733
    reference_title: "Assessment of auditory and vestibular function and gene therapy in the Snell's waltzer mouse model of human deafness and balance dysfunction."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Adeno-associated virus (AAV) gene replacement therapy, delivered on the day of birth or one day after, failed to restore auditory or vestibular function."
    explanation: Neonatal gene replacement did not rescue the null mouse, which argues against postnatal gene replacement for loss-of-function MYO6 disease.
animal_models:
- name: Snell's waltzer (Myo6 sv/sv) mouse
  species: Mouse
  genotype: Snell's waltzer (sv/sv) - Myo6 functional null
  description: >
    The Snell's waltzer mouse carries a spontaneous null mutation in Myo6 and exhibits
    deafness, vestibular dysfunction, and cardiac defects including left ventricular
    hypertrophy with extensive fibrosis.
  modeled_mechanisms:
  - target: Stereocilia Dysfunction in Cochlear Hair Cells
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Stereocilia fuse after birth and hair bundles become disorganized.
    limitations: >-
      A complete null with congenital profound deafness and severe vestibular
      dysfunction; it models the recessive DFNB37 form rather than the
      progressive dominant form. Vestibular function in human MYO6 patients
      has been studied little, so how well the mouse vestibular phenotype
      transfers is unknown.
    evidence:
    - reference: PMID:42665733
      reference_title: "Assessment of auditory and vestibular function and gene therapy in the Snell's waltzer mouse model of human deafness and balance dysfunction."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These mice exhibit profound hearing loss, with cochlear hair cell stereocilia beginning to fuse soon after birth, ultimately leading to disorganization of hair bundles and degeneration of hair cells."
      explanation: Supports the model reproducing stereocilia failure.
  evidence:
  - reference: PMID:42665733
    reference_title: "Assessment of auditory and vestibular function and gene therapy in the Snell's waltzer mouse model of human deafness and balance dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice also exhibit behavioral phenotypes characterized by severe imbalance, hyperactivity with bouts of circling, and delayed spatial learning of a novel environment, but preserved normal behavioral circadian rhythms."
    explanation: Characterizes the vestibular phenotype of the null mouse.
  - reference: PMID:26265212
    reference_title: "Myosin VI and cardiomyopathy: Left ventricular hypertrophy, fibrosis, and both cardiac and pulmonary vascular endothelial cell defects in the Snell's waltzer mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The current studies have utilized the Snell's waltzer (sv) mouse (a functional null mutation for Myo6) to determine if this mouse also exhibits cardiac defects"
    explanation: Characterization of the Snell's waltzer mouse as a model for MYO6-related cardiac and hearing phenotypes.
- name: Myo6-C442Y humanized knock-in mouse
  species: Mouse
  genotype: Myo6-C442Y knock-in
  description: >
    Humanized knock-in mouse model mimicking the p.C442Y DFNA22 variant. Both
    homozygous and heterozygous mice exhibit progressive hearing loss from three
    weeks after birth, with semi-dominant inheritance pattern.
  evidence:
  - reference: PMID:31103816
    reference_title: "A humanized mouse model, demonstrating progressive hearing loss caused by MYO6 p.C442Y, is inherited in a semi-dominant pattern."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterozygous Myo6-C442Y mice recapitulated the progressive postlingual sensorineural deafness in human, thus providing a useful model for elucidating the role myosin VI plays in the mammalian auditory system."
    explanation: Humanized mouse model recapitulates the progressive hearing loss seen in human DFNA22 patients.
  modeled_mechanisms:
  - target: Hair Cell Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Progressive hearing loss in the knock-in tracks hair cell loss in the organ of Corti.
    limitations: >-
      Mouse hearing loss starts at three weeks and is profound by six to nine
      weeks, far faster than the decades-long human DFNA22 course.
    evidence:
    - reference: PMID:31103816
      reference_title: "A humanized mouse model, demonstrating progressive hearing loss caused by MYO6 p.C442Y, is inherited in a semi-dominant pattern."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The hearing loss corresponded to the degeneration of hair cells in the organ of Corti."
      explanation: Supports the model reproducing hair cell degeneration.
  - target: Inner Hair Cell Ribbon Synapse Exocytosis Defect
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Mature homozygous C442Y inner hair cells show reduced exocytosis and calcium current.
    limitations: >-
      The synaptic deficit was measured in homozygous C442Y mice, whereas
      human DFNA22 patients are heterozygous.
    evidence:
    - reference: PMID:37258513
      reference_title: "Functional and developmental changes in the inner hair cell ribbon synapses caused by Myosin VI knockout and deafness-inducing point mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In immature IHCs of Myo6C442Y/C442Y cochleae, neither ΔCm nor ICa was altered, but both were reduced in mature IHCs of the same animal model"
      explanation: Patch-clamp evidence of the synaptic defect in the C442Y model.
- name: Tailchaser (Myo6 D179Y) mouse
  species: Mouse
  genotype: Myo6 Tlc (p.D179Y) ENU-induced dominant missense
  description: >
    ENU-induced dominant motor-domain missense allele causing deafness and
    circling with gradual loss of hearing and balance, with mislocalized
    kinocilia and branched stereocilia.
  modeled_mechanisms:
  - target: Myosin VI Motor and Dosage Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: The D179Y motor shows decreased actin-activated ATPase and loss of head-to-head gating.
    limitations: >-
      D179Y is a mouse allele, not a reported human variant; biochemical
      measurements were made on recombinant protein.
    evidence:
    - reference: PMID:18833301
      reference_title: "A Myo6 mutation destroys coordination between the myosin heads, revealing new functions of myosin VI in the stereocilia of mammalian inner ear hair cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The actin-activated ATPase rates measured for the D179Y mutation are decreased, and indicate loss of coordination of the myosin VI heads or 'gating' in the dimer form."
      explanation: Supports the model reproducing a motor-domain functional defect.
  evidence:
  - reference: PMID:18833301
    reference_title: "A Myo6 mutation destroys coordination between the myosin heads, revealing new functions of myosin VI in the stereocilia of mammalian inner ear hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Structural changes in the Tailchaser hair bundles include mislocalization of the kinocilia and branching of stereocilia."
    explanation: Hair bundle defects in the dominant Tailchaser allele.
- name: Zebrafish myo6b morphant
  species: Zebrafish
  genotype: myo6b morpholino knockdown, rescued with human MYO6 RNA
  description: >
    Variant-testing assay. myo6b knockdown reduces mechanotransduction-dependent
    dye uptake in lateral line hair cells; co-injection of wild-type human MYO6
    RNA rescues it, and a patient variant (p.Arg925Ser) rescues it less well.
  evidence:
  - reference: PMID:39664812
    reference_title: "In silico and in vivo analyses of a novel variant in MYO6 identified in a family with postlingual non-syndromic hearing loss from Argentina."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Through a knockdown phenotype rescue assay in zebrafish, the detrimental effects of the identified variant on the auditory system was determined."
    explanation: Establishes the zebrafish knockdown-rescue assay for MYO6 variant interpretation.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The estimated hearing deterioration was found to be 0.57 dB per year; when restricted to change after 40 years of age, the deterioration speed was accelerated to 1.07 dB per year."
    explanation: Quantifies the progressive nature of MYO6-related hearing loss with age-dependent acceleration.
  - reference: PMID:38274113
    reference_title: "Novel cis compound heterozygous variants in MYO6 causes early onset of non-syndromic hearing loss in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical investigation revealed the family members were affected by progressive and sensorineural hearing loss with an onset around 8-10 years old."
    explanation: A further dominant MYO6 family with childhood-onset progressive sensorineural hearing loss.
- category: Clinical

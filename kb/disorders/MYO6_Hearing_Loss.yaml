diagnosis:
- name: Pure-Tone Audiometry
  description: >-
    Audiometric assessment documents the sensorineural hearing loss MYO6
    variants cause, and tracks the DFNA22 progression rate (0.57 dB per year
    overall, accelerating to 1.07 dB per year after age 40) that distinguishes
    it from DFNB37's congenital profound course.
  diagnosis_term:
    preferred_term: audiometric test
    term:
      id: NCIT:C38036
      label: Audiometric Test
  measurements:
  - preferred_term: pure-tone threshold audiometry
    term:
      id: LOINC:89015-2
      label: Pure tone threshold audiometry panel
  - preferred_term: hearing threshold, left ear, 500 Hz
    term:
      id: LOINC:89024-4
      label: Hearing threshold Ear - left --500 Hz
  - preferred_term: hearing threshold, right ear, 500 Hz

datasets: []
discussions:
- discussion_id: mondo_anchor_places_gene_defined_dees_under_an_undetermined_class
  prompt: >-
    Should a class whose Orphanet definition is "undetermined" carry sixteen
    gene-defined disease classes as its children?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - disease#Undetermined Early-Onset Epileptic Encephalopathy
  - has_subtypes#DEE21
  rationale: >-
    Two things about the MONDO anchor of this entry are worth recording, both
    re-runnable with `runoak -i sqlite:obo:mondo info MONDO:0018614 -O obo` and
    `runoak -i sqlite:obo:mondo descendants -p i MONDO:0018614`, and both
    reproduced against the live EBI OLS4 parents endpoint for MONDO:0018614 on
    2026-09-19.
    First, MONDO:0018614 takes its definition from Orphanet:442835, which
    describes cases where no specific gene-defined subtype has been assigned,
    yet it has sixteen numbered developmental and epileptic encephalopathy
    classes as is_a children, and all sixteen name a causal gene in their own
    definition under MONDO's disease_series_by_gene pattern. Thirteen of them
    carry that gene as an asserted RO:0004003 relation; DEE29 (MONDO:0014593)
    and DEE42 (MONDO:0014917) carry it only in the equivalence axiom, and
    DEE31A (MONDO:0014598) only in the text definition, so an extraction that
    reads asserted relations alone sees thirteen. A residual class and a set of
    gene-defined classes cannot both be right about the same concept, and the
    tension is what this entry has to curate around: the gene records here are
    scoped to individual child rows rather than asserted of the anchor.
    Second, MONDO:0018614 is asserted is_a MONDO:0019216 "inborn disorder of
    amino acid transport" (Orphanet:79166). That inference propagates to all
    sixteen children, so SCN8A-, HCN1-, KCNB1- and NECAP1-related
    encephalopathy all come out as inborn errors of amino acid metabolism. This
    looks like an upstream classification error rather than a curation choice
    dismech should mirror, and it is the reason this entry does not inherit any
    metabolic framing from its anchor.
    Only five of the sixteen children are declared here as has_subtypes rows;
    the remaining eleven are neither declared nor dispositioned, which is a
    separate open question about how much of a MONDO subtree an umbrella entry
    should enumerate.
notes: >
  Scope rule for genetics in this entry: a gene is recorded here only when the
  gene-defined MONDO class it causes is a child of this entry's anchor,
  MONDO:0018614, and it is then scoped to that child's has_subtypes row rather
  than asserted of the anchor itself. The anchor is Orphanet's residual class
  for early-onset epileptic encephalopathy with no assigned gene-defined
  subtype, so a flat list of causal genes on the anchor would contradict what
  the entry is for.
  Four genes previously carried in the genetic section - SCN1A, KCNQ2, STXBP1
  and CDKL5 - fail that rule. None of the MONDO classes they cause (Dravet
  syndrome MONDO:0100135, DEE7 MONDO:0013387, DEE4 MONDO:0012812, CDKL5
  disorder MONDO:0100039) is a descendant of MONDO:0018614, each already has a
  dedicated dismech entry, and the evidence attached to each supported the gene
  as a cause of developmental and epileptic encephalopathy in general rather
  than of the undetermined class specifically. They are now recorded as
  differential diagnoses, which is the role they play for a residual category:
  entities to exclude before "undetermined" applies. No citation was dropped in
  the move.
  DEE21 (NECAP1) is the one child class of the anchor with no dedicated dismech
  entry, so it is the only one whose gene-specific mechanism is modelled in this
  entry's pathophysiology. A standalone NECAP1-related DEE entry anchored on
  MONDO:0014360 would match how the other four children are handled and is
  recorded here as a follow-up rather than done in this pass.

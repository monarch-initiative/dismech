name: Undetermined Early-Onset Epileptic Encephalopathy
creation_date: "2026-05-07T15:54:42Z"
description: >
  Undetermined early-onset epileptic encephalopathy is a rare hereditary
  neonatal-to-infantile epilepsy syndrome grouping disorders with early seizures
  of variable type and severity, developmental impairment, and heterogeneous
  neurological features before a more specific gene-defined subtype is assigned.
category: Mendelian
parents:
- Epilepsy
- Neurodevelopmental Disorder
- Neurological Disease
synonyms:
- Non-specific early-onset epileptic encephalopathy
- Undetermined EOEE
disease_term:
  preferred_term: undetermined early-onset epileptic encephalopathy
  term:
    id: MONDO:0018614
    label: undetermined early-onset epileptic encephalopathy
has_subtypes:
- name: DEE13
  display_name: Developmental and epileptic encephalopathy 13 (SCN8A-related)
  subtype_term:
    preferred_term: developmental and epileptic encephalopathy, 13
    term:
      id: MONDO:0013801
      label: developmental and epileptic encephalopathy, 13
  description: >
    MONDO defines this child of the anchor by SCN8A (RO:0004003), which encodes
    the voltage-gated sodium channel Nav1.6. dismech curates it in full as its
    own entry, kb/disorders/SCN8A-Related_Developmental_and_Epileptic_Encephalopathy.yaml,
    anchored on this same MONDO class; the gene is bound here so the row is
    self-describing, and the mechanism is not duplicated.
  genes:
  - preferred_term: SCN8A
    term:
      id: hgnc:10596
      label: SCN8A
  evidence:
  - reference: PMID:31904124
    reference_title: "Phenotypic and genetic spectrum of SCN8A-related disorders, treatment options, and outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The familial SCN8A-related epilepsies show an autosomal dominant pattern
      of inheritance, whereas the vast majority of SCN8A-DEEs occur de novo.
    explanation: >-
      Establishes SCN8A-related developmental and epileptic encephalopathy as a
      recognised gene-defined entity and gives its predominantly de novo origin.
- name: DEE21
  display_name: Developmental and epileptic encephalopathy 21 (NECAP1-related)
  subtype_term:
    preferred_term: developmental and epileptic encephalopathy, 21
    term:
      id: MONDO:0014360
      label: developmental and epileptic encephalopathy, 21
  description: >
    MONDO defines this child of the anchor by NECAP1 (RO:0004003), which encodes
    a clathrin-accessory protein that regulates clathrin-mediated endocytosis at
    synapses. Unlike the other four rows, DEE21 has no dedicated dismech entry,
    so this row is the only place NECAP1 is curated; the gene's mechanism is
    modelled in the pathophysiology section of this entry. Reported disease is
    autosomal recessive: a homozygous truncating allele in a multiplex Saudi
    family, the same allele in an unrelated second Saudi family, and a
    homozygous missense allele in a Lebanese proband.
  genes:
  - preferred_term: NECAP1
    term:
      id: hgnc:24539
      label: NECAP1
  evidence:
  - reference: PMID:24399846
    reference_title: "NECAP1 loss of function leads to a severe infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the only deleterious novel exomic variant was a homozygous truncating
      mutation in NECAP1, encoding a clathrin-accessory protein
    explanation: >-
      The founding report identifying NECAP1 as the causal gene of this
      gene-defined subtype, in a multiplex consanguineous family.
  - reference: PMID:30525121
    reference_title: "Confirming the pathogenicity of NECAP1 in early onset epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report another family with the same variant confirming the
      pathogenicity of this variant as a Saudi founder mutation
    explanation: >-
      An independent second family carrying the same allele, which is what moves
      the gene-disease relationship beyond a single-family report.
  - reference: PMID:35638367
    reference_title: "Early infantile epileptic encephalopathy related to NECAP1: Clinical delineation of the disease and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES enabled the detection of a homozygous missense mutation in the NECAP1
      gene (NM_015509.3: p.Glu8Lys) in the proband.
    explanation: >-
      A third, unrelated family with a different homozygous allele, extending the
      variant spectrum beyond the founder truncating variant.

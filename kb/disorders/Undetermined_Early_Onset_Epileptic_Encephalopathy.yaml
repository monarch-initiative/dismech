pathophysiology:
- name: NECAP1 loss of function in clathrin-mediated synaptic endocytosis
  biological_scale: MOLECULAR
  description: >
    NECAP1 encodes a clathrin-accessory protein that acts on the AP-2 adaptor in
    clathrin-mediated endocytosis at synapses. The founding family's homozygous
    truncating allele triggers nonsense-mediated decay, which is consistent with
    loss of the gene product rather than a dominant-negative mechanism, and the
    same study reports NECAP1 as highly enriched in the central nervous system. This is the only gene-specific
    mechanism curated in this entry, because DEE21 is the one child class of the
    anchor without a dedicated dismech entry of its own.
  genes:
  - preferred_term: NECAP1
    term:
      id: hgnc:24539
      label: NECAP1
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: clathrin-dependent synaptic vesicle endocytosis
    term:
      id: GO:0150007
      label: clathrin-dependent synaptic vesicle endocytosis
    modifier: DECREASED
  evidence:
  - reference: PMID:24399846
    reference_title: "NECAP1 loss of function leads to a severe infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation was confirmed to trigger nonsense-mediated decay."
    explanation: >-
      Establishes that the founding allele acts by loss of transcript rather
      than by producing an altered protein.
  - reference: PMID:24399846
    reference_title: "NECAP1 loss of function leads to a severe infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we show that NECAP1 is highly enriched in the central nervous system"
    explanation: >-
      Expression analysis in the same study supports the central nervous system
      as the tissue where loss of the gene product matters.
  - reference: PMID:30525121
    reference_title: "Confirming the pathogenicity of NECAP1 in early onset epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      It was previously shown that NECAP1 through its WxxF motif at its
      C‐terminus interacts with adaptor protein 2 (AP‐2) and works as a
      negative regulator of AP‐2 to control the vesicle number, size, and
      content.
    explanation: >-
      The cell-biological role of the gene product, which is the pathway this
      node names. Graded IN_VITRO for the cell-based work the sentence describes,
      with quote_role BACKGROUND because the citing paper is a clinical family
      report restating that prior work rather than performing it.
  downstream:
  - target: Early developmental brain network dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of NECAP1 places a synaptic-vesicle trafficking defect upstream of the
      shared network dysfunction of this anchor. The authors frame the link as
      newly connecting this trafficking pathway to early infantile epileptic
      encephalopathy, and the intermediate steps between reduced clathrin-mediated
      synaptic endocytosis and network hyperexcitability are not established.
    evidence:
    - reference: PMID:24399846
      reference_title: "NECAP1 loss of function leads to a severe infantile epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation we report here links for the first time this trafficking pathway in early infantile epileptic encephalopathy."
      explanation: >-
        The paper's own conclusion connecting the trafficking defect to the
        epileptic encephalopathy phenotype.
- name: Early developmental brain network dysfunction
  description: >
    Heterogeneous genetic etiologies disrupt neuronal development and synaptic
    signaling in the developing brain, producing early epileptic network
    hyperexcitability. It is the shared convergence point of this anchor's
    gene-defined child classes; the gene-specific molecular mechanisms of DEE13,
    DEE24, DEE25 and DEE26 are curated in their own dismech entries rather than
    duplicated here.
  genes:
  - preferred_term: SCN8A
    description: >-
      Bound here as an etiology converging on this node, not as a claim about
      Nav1.6 biology; that mechanism is curated in the SCN8A entry.
    term:
      id: hgnc:10596
      label: SCN8A
  - preferred_term: HCN1
    description: >-
      Bound here as an etiology converging on this node, not as a claim about
      HCN channel biology; that mechanism is curated in the HCN1 entry.
    term:
      id: hgnc:4845
      label: HCN1
  - preferred_term: SLC13A5
    description: >-
      Bound here as an etiology converging on this node, not as a claim about
      neuronal citrate handling; that mechanism is curated in the SLC13A5 entry.
    term:
      id: hgnc:23089
      label: SLC13A5
  - preferred_term: KCNB1
    description: >-
      Bound here as an etiology converging on this node, not as a claim about
      Kv2.1 biology; that mechanism is curated in the KCNB1 entry.
    term:
      id: hgnc:6231
      label: KCNB1

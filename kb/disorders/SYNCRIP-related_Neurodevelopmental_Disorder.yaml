  evidence:
  - reference: PMID:39776340
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    reference_title: Posttranscriptional Control of Neural Progenitors Temporal Dynamics During Neocortical Development by Syncrip.
    snippet: "the knockout of Syncrip disrupts the late-stage neurogenesis, stalling transcriptional progression in RGCs"
    explanation: Syncrip knockout stalls the radial glial temporal program and late neurogenesis.
  downstream:
  - target: Cortical Layering Defect
    causal_link_type: DIRECT
- name: Cortical Layering Defect
  biological_scale: TISSUE
  description: >-
    Disrupted radial glial differentiation and neuronal localization produce
    superficial cortical layer defects, the structural basis of the cognitive and
    neurodevelopmental phenotype.
  biological_processes:
  - preferred_term: cerebral cortex neuron differentiation
    term:
      id: GO:0021895
      label: cerebral cortex neuron differentiation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:39776340
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    reference_title: Posttranscriptional Control of Neural Progenitors Temporal Dynamics During Neocortical Development by Syncrip.
    snippet: "Syncrip knockout in RGCs disrupts differentiation and abnormal neuronal localization, ultimately resulting in superficial cortical layer defects as well as learning and memory impairments in mice."
    explanation: RGC-specific Syncrip knockout causes superficial cortical layer defects in mice.
  downstream:
  - target: Impaired Neurodevelopment
    causal_link_type: DIRECT
- name: Dysregulated Neuronal mRNA Localization
  biological_scale: CELLULAR
  description: >-
    Reduced hnRNP-Q disturbs the intracellular localization of its target mRNAs
    in neurons -- hnRNP-Q normally positions mRNAs (including Cdc42-pathway
    transcripts) in neurites -- altering where those transcripts and their
    encoded proteins are available during neuronal morphogenesis.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: intracellular mRNA localization
    term:
      id: GO:0008298
      label: intracellular mRNA localization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:22493061
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    reference_title: hnRNP Q regulates Cdc42-mediated neuronal morphogenesis.
    snippet: "The RNA-binding protein hnRNP Q has been implicated in neuronal mRNA metabolism."
    explanation: Frames hnRNP-Q's established role in neuronal mRNA handling.
  - reference: PMID:22493061
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    reference_title: hnRNP Q regulates Cdc42-mediated neuronal morphogenesis.
    snippet: "knockdown of hnRNP Q reduced the level of some of those mRNAs in neurites"
    explanation: hnRNP-Q knockdown reduces the neuritic localization of its target mRNAs.
  downstream:
  - target: Impaired Neurodevelopment
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22493061
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      reference_title: hnRNP Q regulates Cdc42-mediated neuronal morphogenesis.
      snippet: "knockdown of hnRNP Q increased neurite complexity in cultured rat cortical neurons and induced filopodium formation in mouse neuroblastoma cells"
      explanation: Loss of hnRNP-Q alters neuronal morphogenesis in a model system, linking dysregulated neuronal mRNA localization to abnormal neurodevelopment.
- name: Impaired Neurodevelopment
  biological_scale: ORGANISM
  description: >-
    Disturbed neuronal mRNA regulation during brain development yields abnormal
    cortical and synaptic maturation, manifesting as the developmental, cognitive,
    and neurobehavioral phenotype.

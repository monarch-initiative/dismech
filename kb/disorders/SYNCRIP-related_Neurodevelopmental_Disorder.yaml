animal_models:
- name: Radial-glia-specific Syncrip knockout mouse
  species: Mouse
  genotype: Conditional Syncrip knockout in neocortical radial glial cells
  category: Animal
  description: >-
    Radial-glia-specific deletion of Syncrip in the developing mouse neocortex,
    used to establish the gene's role in the temporal neurogenic program.
  publication: PMID:39776340
  modeled_mechanisms:
  - target: Cortical Layering Defect
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      RGC-specific Syncrip knockout reproduces the superficial cortical layer
      defect and causes learning and memory impairment.
    limitations: >-
      The model is a complete conditional knockout, whereas human SYNCRIP-NDD
      results from heterozygous haploinsufficiency; mouse cortical neurogenesis
      also lacks human-specific outer radial glia / OSVZ biology.
    evidence:
    - reference: PMID:39776340
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      reference_title: Posttranscriptional Control of Neural Progenitors Temporal Dynamics During Neocortical Development by Syncrip.
      snippet: "Syncrip knockout in RGCs disrupts differentiation and abnormal neuronal localization, ultimately resulting in superficial cortical layer defects as well as learning and memory impairments in mice."
      explanation: Supports treating the RGC-knockout mouse as informative for the cortical layering defect.


inheritance:
- name: Autosomal dominant (de novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    SYNCRIP-NDD is autosomal dominant. Most reported probands have a de novo
    pathogenic variant; transmission from an affected parent has been reported in
    one family.
  evidence:
  - reference: PMID:42160654
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    reference_title: SYNCRIP-Related Neurodevelopmental Disorder.
    snippet: "Most probands reported to date with SYNCRIP-NDD whose parents have undergone molecular genetic testing have the disorder as the result of a de novo pathogenic variant."
    explanation: GeneReviews states the disorder is autosomal dominant and usually de novo.
  - reference: PMID:42160654
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    reference_title: SYNCRIP-Related Neurodevelopmental Disorder.
    snippet: "Transmission of a SYNCRIP pathogenic variant from an affected parent to an affected child has been reported in one family."
    explanation: GeneReviews documents inherited (non-de-novo) transmission in one family.

genetic:
- name: SYNCRIP
  gene_term:
    preferred_term: SYNCRIP
    term:
      id: hgnc:16918
      label: SYNCRIP
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    Heterozygous de novo variants in SYNCRIP cause the disorder by two routes
    that converge on reduced hnRNP-Q function: loss-of-function (nonsense,
    frameshift, splice) variants reduce protein dosage (haploinsufficiency),
    while a missense variant in the RRM2 domain yields a mutant protein with
    impaired RNA binding and condensate formation.
  evidence:
  - reference: PMID:27479843
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    reference_title: Meta-analysis of 2,104 trios provides support for 10 new genes for intellectual disability.
    snippet: "Statistical analyses identified 10 new candidate ID genes: DLG4, PPM1D, RAC1, SMAD6, SON, SOX5, SYNCRIP, TCF20, TLK2 and TRIP12."
    explanation: Trio meta-analysis identified SYNCRIP as a new intellectual-disability gene from de novo mutations.
  - reference: PMID:34157790
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    reference_title: Further evidence for de novo variants in SYNCRIP as the cause of a neurodevelopmental disorder.
    snippet: "Our study provides further evidence for a SYNCRIP-associated NDD characterized by ID and ASD sporadically accompanied by malformations of cortical development and myoclonic-atonic epilepsy."
    explanation: Clinical cohort of de novo SYNCRIP variants delineating the associated neurodevelopmental disorder.
  variants:
  - name: Truncating (frameshift/nonsense) variants
    description: >-
      Frameshift and nonsense variants, seen in the more severely affected
      individuals, are predicted to cause haploinsufficiency.
    evidence:
    - reference: PMID:34157790
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      reference_title: Further evidence for de novo variants in SYNCRIP as the cause of a neurodevelopmental disorder.
      snippet: "Two frameshift variants in the more severely affected individuals, likely result in haploinsufficiency."
      explanation: Truncating variants cause haploinsufficiency and associate with a more severe phenotype.
  - name: RRM2 missense variant
    description: >-
      A missense variant in the conserved RNA recognition motif (RRM) 2 domain is
      predicted to impair RNA binding rather than reduce protein dosage.
    evidence:
    - reference: PMID:34157790
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      reference_title: Further evidence for de novo variants in SYNCRIP as the cause of a neurodevelopmental disorder.
      snippet: "The third missense variant lies in the conserved RNA recognition motif (RRM) 2 domain likely affecting RNA-binding."
      explanation: An RRM2 missense variant acts by impairing RNA binding.

diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis is established in a proband with suggestive findings and a
    heterozygous pathogenic SYNCRIP variant on molecular genetic testing. Brain
    MRI may show malformations of cortical development (periventricular nodular
    heterotopia, widened subarachnoid spaces) and EEG is used where seizures occur.
  evidence:
  - reference: PMID:42160654
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    reference_title: SYNCRIP-Related Neurodevelopmental Disorder.
    snippet: "The diagnosis of SYNCRIP-NDD is established in a proband with suggestive findings and a heterozygous pathogenic variant in SYNCRIP identified by molecular genetic testing."
    explanation: GeneReviews states the molecular diagnostic criterion for SYNCRIP-NDD.

pathophysiology:
- name: SYNCRIP Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Heterozygous loss-of-function (frameshift, nonsense, splice) variants reduce
    the dose of functional SYNCRIP (hnRNP-Q) below what developing neurons
    require.
  genetic_context:
    variant_origin: DE_NOVO
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: RNA binding
    term:
      id: GO:0003723
      label: RNA binding
  evidence:
  - reference: PMID:34157790
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    reference_title: Further evidence for de novo variants in SYNCRIP as the cause of a neurodevelopmental disorder.
    snippet: "Two frameshift variants in the more severely affected individuals, likely result in haploinsufficiency."
    explanation: Frameshift variants in affected individuals implicate haploinsufficiency as the mechanism.
  downstream:
  - target: Dysregulated Neuronal mRNA Localization
    causal_link_type: DIRECT
- name: SYNCRIP RRM2 Missense Impairing RNA Binding
  biological_scale: MOLECULAR
  description: >-
    A de novo missense variant in the conserved RRM2 domain yields a mutant
    hnRNP-Q with impaired RNA binding, the molecular lesion of the non-dosage
    branch of the disorder.
  genetic_context:
    variant_origin: DE_NOVO
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: RNA binding
    term:
      id: GO:0003723
      label: RNA binding
    modifier: DECREASED
  evidence:
  - reference: PMID:34157790
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    reference_title: Further evidence for de novo variants in SYNCRIP as the cause of a neurodevelopmental disorder.
    snippet: "The third missense variant lies in the conserved RNA recognition motif (RRM) 2 domain likely affecting RNA-binding."
    explanation: An RRM2 missense variant impairs the RNA-binding function of the mutant protein.
  downstream:
  - target: Impaired SYNCRIP Phase Separation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39776340
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      reference_title: Posttranscriptional Control of Neural Progenitors Temporal Dynamics During Neocortical Development by Syncrip.
      snippet: "pathogenic human mutations in Syncrip weaken its phase-separation capability, failing to form stable complexes normally."
      explanation: Pathogenic (mutant) SYNCRIP protein weakens phase separation.
- name: Impaired SYNCRIP Phase Separation
  biological_scale: MOLECULAR
  description: >-
    The mutant SYNCRIP protein undergoes weakened liquid-liquid phase separation
    and fails to form the stabilization complexes (biomolecular condensates)
    through which SYNCRIP normally maintains temporal transcription-factor
    programs. This is a property of the mutant protein, shown for pathogenic
    human variants.
  molecular_functions:
  - preferred_term: molecular condensate scaffold activity
    term:
      id: GO:0140693
      label: molecular condensate scaffold activity
    modifier: DECREASED
  evidence:
  - reference: PMID:39776340
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    reference_title: Posttranscriptional Control of Neural Progenitors Temporal Dynamics During Neocortical Development by Syncrip.
    snippet: "pathogenic human mutations in Syncrip weaken its phase-separation capability, failing to form stable complexes normally."
    explanation: Human pathogenic mutations impair SYNCRIP phase separation and complex formation.
  downstream:
  - target: Dysregulated Notch Signaling in Radial Glial Cells
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39776340
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      reference_title: Posttranscriptional Control of Neural Progenitors Temporal Dynamics During Neocortical Development by Syncrip.
      snippet: "Syncrip maintains the transcription of temporal process-related transcription factors by recruiting stabilization complexes through phase separation, crucially regulating the Notch signaling pathway that determines the fate of RGCs."
      explanation: Phase-separation-dependent stabilization complexes regulate Notch signaling that sets radial glial cell fate.
- name: Dysregulated Notch Signaling in Radial Glial Cells
  biological_scale: CELLULAR
  description: >-
    Loss of condensate-mediated stabilization dysregulates the Notch signaling
    pathway that governs the fate of cortical radial glial cells.
  cell_types:

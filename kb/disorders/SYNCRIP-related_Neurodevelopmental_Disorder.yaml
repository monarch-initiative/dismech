name: SYNCRIP-related Neurodevelopmental Disorder
creation_date: "2026-10-24T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: SYNCRIP-related neurodevelopmental disorder
  term:
    id: MONDO:0800456
    label: SYNCRIP-related neurodevelopmental disorder
synonyms:
- SYNCRIP-NDD
- SYNCRIP-related intellectual disability
- hnRNP-Q-related neurodevelopmental disorder
description: >-
  SYNCRIP-related neurodevelopmental disorder (SYNCRIP-NDD) is a Mendelian
  neurodevelopmental disorder caused by heterozygous, usually de novo,
  loss-of-function or deleterious missense variants in SYNCRIP, which encodes the
  RNA-binding protein synaptotagmin-binding cytoplasmic RNA-interacting protein
  (hnRNP-Q/NSAP1). SYNCRIP is a member of the heterogeneous nuclear
  ribonucleoprotein family and regulates mRNA splicing, nucleocytoplasmic
  transport, dendritic mRNA localization, and local translation in neurons.
  Haploinsufficiency is the proposed disease mechanism, placing the disorder
  within the broader hnRNPopathy spectrum. The phenotype is dominated by
  borderline-to-moderate developmental delay and intellectual disability, with
  variable neurobehavioral and psychiatric features (autism spectrum disorder,
  ADHD, sleep disturbance), ocular/vision anomalies, seizures, hypotonia, and
  movement disorders; hand and foot anomalies, kidney anomalies, and growth delay
  occur in a subset.


name: SYNCRIP-related Neurodevelopmental Disorder
creation_date: "2026-10-24T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: SYNCRIP-related neurodevelopmental disorder
  term:
    id: MONDO:0800456
    label: SYNCRIP-related neurodevelopmental disorder
synonyms:
- SYNCRIP-NDD
- SYNCRIP-related intellectual disability
- hnRNP-Q-related neurodevelopmental disorder
description: >-
  SYNCRIP-related neurodevelopmental disorder (SYNCRIP-NDD) is a Mendelian
  neurodevelopmental disorder caused by heterozygous, usually de novo,
  loss-of-function or deleterious missense variants in SYNCRIP, which encodes the
  RNA-binding protein synaptotagmin-binding cytoplasmic RNA-interacting protein
  (hnRNP-Q/NSAP1). SYNCRIP is a member of the heterogeneous nuclear
  ribonucleoprotein family and regulates mRNA splicing, nucleocytoplasmic
  transport, dendritic mRNA localization, and local translation in neurons.
  Haploinsufficiency is the proposed disease mechanism, placing the disorder
  within the broader hnRNPopathy spectrum. The phenotype is dominated by
  borderline-to-moderate developmental delay and intellectual disability, with
  variable neurobehavioral and psychiatric features (autism spectrum disorder,
  ADHD, sleep disturbance), ocular/vision anomalies, seizures, hypotonia, and
  movement disorders; hand and foot anomalies, kidney anomalies, and growth delay
  occur in a subset.

references:
- reference: PMID:42160654
  title: SYNCRIP-Related Neurodevelopmental Disorder.
  tags:
  - GeneReviews

inheritance:
- name: Autosomal dominant (de novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    SYNCRIP-NDD is autosomal dominant. Most reported probands have a de novo
    pathogenic variant; transmission from an affected parent has been reported in
    one family.
  evidence:
  - reference: PMID:42160654
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    reference_title: SYNCRIP-Related Neurodevelopmental Disorder.
    snippet: "Most probands reported to date with SYNCRIP-NDD whose parents have undergone molecular genetic testing have the disorder as the result of a de novo pathogenic variant."
    explanation: GeneReviews states the disorder is autosomal dominant and usually de novo.

genetic:
- name: SYNCRIP
  gene_term:
    preferred_term: SYNCRIP
    term:
      id: hgnc:16918
      label: SYNCRIP
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    Heterozygous de novo loss-of-function (nonsense, frameshift, splice) and
    deleterious missense variants in SYNCRIP cause the disorder through
    haploinsufficiency of the hnRNP-Q RNA-binding protein.
  evidence:
  - reference: PMID:27479843
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    reference_title: Meta-analysis of 2,104 trios provides support for 10 new genes for intellectual disability.
    snippet: "Statistical analyses identified 10 new candidate ID genes: DLG4, PPM1D, RAC1, SMAD6, SON, SOX5, SYNCRIP, TCF20, TLK2 and TRIP12."
    explanation: Trio meta-analysis identified SYNCRIP as a new intellectual-disability gene from de novo mutations.
  - reference: PMID:34157790
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    reference_title: Further evidence for de novo variants in SYNCRIP as the cause of a neurodevelopmental disorder.
    snippet: "Our study provides further evidence for a SYNCRIP-associated NDD characterized by ID and ASD sporadically accompanied by malformations of cortical development and myoclonic-atonic epilepsy."
    explanation: Clinical cohort of de novo SYNCRIP variants delineating the associated neurodevelopmental disorder.
  variants:
  - name: Truncating (frameshift/nonsense) variants
    description: >-
      Frameshift and nonsense variants, seen in the more severely affected
      individuals, are predicted to cause haploinsufficiency.
    evidence:
    - reference: PMID:34157790
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      reference_title: Further evidence for de novo variants in SYNCRIP as the cause of a neurodevelopmental disorder.
      snippet: "Two frameshift variants in the more severely affected individuals, likely result in haploinsufficiency."
      explanation: Truncating variants cause haploinsufficiency and associate with a more severe phenotype.
  - name: RRM2 missense variant
    description: >-
      A missense variant in the conserved RNA recognition motif (RRM) 2 domain is
      predicted to impair RNA binding rather than reduce protein dosage.
    evidence:
    - reference: PMID:34157790
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      reference_title: Further evidence for de novo variants in SYNCRIP as the cause of a neurodevelopmental disorder.
      snippet: "The third missense variant lies in the conserved RNA recognition motif (RRM) 2 domain likely affecting RNA-binding."
      explanation: An RRM2 missense variant acts by impairing RNA binding.

diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis is established in a proband with suggestive findings and a
    heterozygous pathogenic SYNCRIP variant on molecular genetic testing. Brain
    MRI may show malformations of cortical development (periventricular nodular
    heterotopia, widened subarachnoid spaces) and EEG is used where seizures occur.
  evidence:
  - reference: PMID:42160654
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    reference_title: SYNCRIP-Related Neurodevelopmental Disorder.
    snippet: "The diagnosis of SYNCRIP-NDD is established in a proband with suggestive findings and a heterozygous pathogenic variant in SYNCRIP identified by molecular genetic testing."
    explanation: GeneReviews states the molecular diagnostic criterion for SYNCRIP-NDD.

pathophysiology:
- name: SYNCRIP Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    A heterozygous loss-of-function or deleterious missense variant reduces
    functional SYNCRIP (hnRNP-Q) below the dose required in developing neurons.
  genetic_context:
    variant_origin: DE_NOVO
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: RNA binding
    term:
      id: GO:0003723
      label: RNA binding
  evidence:
  - reference: PMID:34157790
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    reference_title: Further evidence for de novo variants in SYNCRIP as the cause of a neurodevelopmental disorder.
    snippet: "Two frameshift variants in the more severely affected individuals, likely result in haploinsufficiency."
    explanation: Frameshift variants in affected individuals implicate haploinsufficiency as the mechanism.
  downstream:
  - target: Impaired SYNCRIP Phase Separation
    causal_link_type: DIRECT
  - target: Dysregulated Neuronal mRNA Metabolism
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22493061
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      reference_title: hnRNP Q regulates Cdc42-mediated neuronal morphogenesis.
      snippet: "The RNA-binding protein hnRNP Q has been implicated in neuronal mRNA metabolism."
      explanation: Reduced hnRNP-Q dosage acts on the neuronal mRNA-metabolism programs it normally controls.
- name: Impaired SYNCRIP Phase Separation
  biological_scale: MOLECULAR
  description: >-
    Pathogenic SYNCRIP mutations weaken the protein's liquid-liquid phase
    separation, so it fails to form the stabilization complexes (biomolecular
    condensates) through which it normally maintains temporal transcription-factor
    programs.
  molecular_functions:
  - preferred_term: molecular condensate scaffold activity
    term:
      id: GO:0140693
      label: molecular condensate scaffold activity
    modifier: DECREASED
  evidence:
  - reference: PMID:39776340
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    reference_title: Posttranscriptional Control of Neural Progenitors Temporal Dynamics During Neocortical Development by Syncrip.
    snippet: "pathogenic human mutations in Syncrip weaken its phase-separation capability, failing to form stable complexes normally."
    explanation: Human pathogenic mutations impair SYNCRIP phase separation and complex formation.
  downstream:
  - target: Dysregulated Notch Signaling in Radial Glial Cells
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39776340
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      reference_title: Posttranscriptional Control of Neural Progenitors Temporal Dynamics During Neocortical Development by Syncrip.
      snippet: "Syncrip maintains the transcription of temporal process-related transcription factors by recruiting stabilization complexes through phase separation, crucially regulating the Notch signaling pathway that determines the fate of RGCs."
      explanation: Phase-separation-dependent stabilization complexes regulate Notch signaling that sets radial glial cell fate.
- name: Dysregulated Notch Signaling in Radial Glial Cells
  biological_scale: CELLULAR
  description: >-
    Loss of condensate-mediated stabilization dysregulates the Notch signaling
    pathway that governs the fate of cortical radial glial cells.
  cell_types:
  - preferred_term: forebrain radial glial cell
    term:
      id: CL:0013000
      label: forebrain radial glial cell
  biological_processes:
  - preferred_term: Notch signaling pathway
    term:
      id: GO:0007219
      label: Notch signaling pathway
    modifier: DYSREGULATED
  downstream:
  - target: Impaired Radial Glial Temporal Fate Progression
    causal_link_type: DIRECT
- name: Impaired Radial Glial Temporal Fate Progression
  biological_scale: CELLULAR
  description: >-
    The radial glial temporal transcription program stalls, disrupting late-stage
    neurogenesis and the ordered deep-to-superficial generation of cortical
    neurons.
  cell_types:
  - preferred_term: forebrain radial glial cell
    term:
      id: CL:0013000
      label: forebrain radial glial cell
  biological_processes:
  - preferred_term: forebrain radial glial cell differentiation
    term:
      id: GO:0021861
      label: forebrain radial glial cell differentiation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:39776340
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    reference_title: Posttranscriptional Control of Neural Progenitors Temporal Dynamics During Neocortical Development by Syncrip.
    snippet: "the knockout of Syncrip disrupts the late-stage neurogenesis, stalling transcriptional progression in RGCs"
    explanation: Syncrip knockout stalls the radial glial temporal program and late neurogenesis.
  downstream:
  - target: Cortical Layering Defect
    causal_link_type: DIRECT
- name: Cortical Layering Defect
  biological_scale: TISSUE
  description: >-
    Disrupted radial glial differentiation and neuronal localization produce
    superficial cortical layer defects, the structural basis of the cognitive and
    neurodevelopmental phenotype.
  biological_processes:
  - preferred_term: cerebral cortex neuron differentiation
    term:
      id: GO:0021895
      label: cerebral cortex neuron differentiation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:39776340
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    reference_title: Posttranscriptional Control of Neural Progenitors Temporal Dynamics During Neocortical Development by Syncrip.
    snippet: "Syncrip knockout in RGCs disrupts differentiation and abnormal neuronal localization, ultimately resulting in superficial cortical layer defects as well as learning and memory impairments in mice."
    explanation: RGC-specific Syncrip knockout causes superficial cortical layer defects in mice.
  downstream:
  - target: Impaired Neurodevelopment
    causal_link_type: DIRECT
- name: Dysregulated Neuronal mRNA Metabolism
  biological_scale: CELLULAR
  description: >-
    Loss of hnRNP-Q dosage disturbs the mRNA processing, dendritic transport, and
    local-translation programs it normally controls in neurons, altering the
    repertoire and timing of neuronal protein synthesis.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of translation
    term:
      id: GO:0006417
      label: regulation of translation
    modifier: ABNORMAL
  downstream:
  - target: Impaired Neurodevelopment
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22493061
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      reference_title: hnRNP Q regulates Cdc42-mediated neuronal morphogenesis.
      snippet: "knockdown of hnRNP Q increased neurite complexity in cultured rat cortical neurons and induced filopodium formation in mouse neuroblastoma cells"
      explanation: Loss of hnRNP-Q alters neuronal morphogenesis in a model system, linking dysregulated neuronal mRNA metabolism to abnormal neurodevelopment.
- name: Impaired Neurodevelopment
  biological_scale: ORGANISM
  description: >-
    Disturbed neuronal mRNA regulation during brain development yields abnormal
    cortical and synaptic maturation, manifesting as the developmental, cognitive,
    and neurobehavioral phenotype.
  downstream:

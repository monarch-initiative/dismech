- name: Supportive and rehabilitative care
  description: >-
    Management is symptomatic: developmental and educational support, standard
    treatment of neurobehavioral issues, antiseizure medication and movement-disorder
    management per neurologist, ophthalmologic management of refractive errors and
    strabismus, physical and occupational therapy for orthopedic manifestations, and
    nephrology input for kidney anomalies.

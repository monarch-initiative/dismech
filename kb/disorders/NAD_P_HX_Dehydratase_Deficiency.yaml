  - reference: PMID:30576410
    reference_title: "NAD(P)HX dehydratase (NAXD) deficiency: a novel neurodegenerative disorder exacerbated by febrile illnesses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results show that NAXD deficiency can be classified as a metabolite repair disorder in which accumulation of damaged metabolites likely triggers devastating effects in tissues such as the brain and the heart, eventually leading to early childhood death."
    explanation: >-
      Places the neurodegeneration within the metabolite-repair framework and

- name: Progressive Neurodegeneration
  biological_scale: ORGANISM
  description: >-
    Progressive neurological deterioration with brain oedema and
    leukoencephalopathy on imaging. Deterioration is stepwise, tied to crises,
    rather than smoothly progressive.
  evidence:
  - reference: PMID:34161859
    reference_title: "NAD(P)HX dehydratase (NAXD) deficiency due to a novel biallelic missense variant and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is characterized by progressive neurological deterioration usually associated with a febrile illness."
    explanation: >-

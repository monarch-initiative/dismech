has_subtypes:
- name: Combined isoform
  display_name: Combined cytosolic and mitochondrial isoform deficiency (neurological presentation)
  description: >-
    Variants affecting both the cytosolic and the mitochondrial NAXD isoform.
    These patients present with neurological deterioration, seizures and skin
    lesions. This is the presentation the disease was first described from.
  evidence:
  - reference: PMID:35866541
    reference_title: "Clinical and biochemical distinctions for a metabolite repair disorder caused by NAXD or NAXE deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NAXD deficiency patients with variants that affect both the cytosolic and mitochondrial isoforms present with neurological defects, seizures and skin lesions."
    explanation: >-
      Defines this subtype by isoform involvement and names its clinical
      signature.
- name: Mitochondrial isoform
  display_name: Mitochondrial-isoform-restricted deficiency (myopathic and cardiac presentation)
  description: >-
    Variants that spare the cytosolic isoform, because the cytosolic isoform is
    initiated from an alternative start codon in exon 2 while exon 1 encodes
    the mitochondrial propeptide. These patients present with myopathy,
    moderate neuropathy and cardiac disease, and characteristically lack the
    skin lesions, seizures and neurological degeneration of the combined form.
  evidence:
  - reference: PMID:35866541
    reference_title: "Clinical and biochemical distinctions for a metabolite repair disorder caused by NAXD or NAXE deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, patients with NAXD variants exclusively affecting the mitochondrial isoform present with myopathy, moderate neuropathy and a cardiac presentation, without the characteristic skin lesions, seizures or neurological degeneration."
    explanation: >-
      Defines this subtype and, importantly, states the negative findings that
      separate it from the combined form.
pathophysiology:
- name: Biallelic NAXD Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic NAXD variants reduce or abolish ATP-dependent NAD(P)HX
    dehydratase activity. Two characterised missense substitutions produce a
    thermolabile enzyme with reduced Vmax and increased KM, which is a
    mechanistically satisfying fit to a disease whose crises are precipitated
    by fever: the residual enzyme is least able to work exactly when demand for
    repair is highest.
  genetic_context:
    gene:
      preferred_term: NAXD
      term:
        id: hgnc:25576
        label: NAXD
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:30576410
    reference_title: "NAD(P)HX dehydratase (NAXD) deficiency: a novel neurodegenerative disorder exacerbated by febrile illnesses."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Recombinant NAXD protein harbouring two missense variants leading to the amino acid changes p.(Gly63Ser) and p.(Arg608Cys) were thermolabile and showed a decrease in Vmax and increase in KM for the ATP-dependent NADHX dehydratase activity."
    explanation: >-
      Direct enzymological demonstration of loss of function, including the
      thermolability that links the molecular defect to the febrile trigger.
  downstream:
  - target: Failure of NAD(P)HX Repair
    description: >-
      Reduced dehydratase activity leaves hydrated cofactor derivatives
      unrepaired.
- name: Failure of NAD(P)HX Repair
  biological_scale: MOLECULAR
  description: >-
    NAD(P)H is spontaneously hydrated into redox-inactive NAD(P)HX, and heat
    accelerates the reaction. NAXD is the enzyme that reverses it. Without
    NAXD, the repair cycle does not close.
  molecular_functions:
  - preferred_term: ATP-dependent NAD(P)H-hydrate dehydratase activity
    term:
      id: GO:0047453
      label: ATP-dependent NAD(P)H-hydrate dehydratase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: NAD+ metabolic process
    term:
      id: GO:0019674
      label: NAD+ metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:30576410
    reference_title: "NAD(P)HX dehydratase (NAXD) deficiency: a novel neurodegenerative disorder exacerbated by febrile illnesses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Physical stress, including high temperatures, may damage the central metabolic nicotinamide nucleotide cofactors"
    explanation: >-
      States that physical stress, and specifically high temperature, damages
      the nicotinamide nucleotide cofactors. Quoted to stop short of the
      bracketed formulae, which the reference validator strips before matching.
  - reference: PMID:35866541
    reference_title: "Clinical and biochemical distinctions for a metabolite repair disorder caused by NAXD or NAXE deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The central cofactors NAD(P)H are prone to damage by hydration, resulting in formation of redox-inactive derivatives designated NAD(P)HX."
    explanation: >-
      Names the damage reaction (hydration) and the product, completing the
      chemistry the previous item begins.
  - reference: PMID:30576410
    reference_title: "NAD(P)HX dehydratase (NAXD) deficiency: a novel neurodegenerative disorder exacerbated by febrile illnesses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The highly conserved enzyme NAD(P)HX dehydratase (NAXD) is essential for intracellular repair of NAD(P)HX."
    explanation: >-
      States NAXD's role as the repair enzyme, which is what is lost.
  downstream:
  - target: Accumulation of Damaged NAD(P)HX Cofactors
    description: >-
      Unrepaired derivatives accumulate in the cell.
- name: Accumulation of Damaged NAD(P)HX Cofactors
  biological_scale: MOLECULAR
  description: >-
    Patient fibroblasts contain highly elevated S-NADHX, R-NADHX and cyclic
    NADHX. That lentiviral transduction with wild-type NAXD abolishes the
    accumulation is the step that makes this causal rather than correlative.
  evidence:
  - reference: PMID:30576410
    reference_title: "NAD(P)HX dehydratase (NAXD) deficiency: a novel neurodegenerative disorder exacerbated by febrile illnesses."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Subject fibroblasts showed highly elevated concentrations of the damaged cofactors S-NADHX, R-NADHX and cyclic NADHX."
    explanation: >-
      The direct measurement of accumulated damaged cofactors in patient cells.
  - reference: PMID:30576410
    reference_title: "NAD(P)HX dehydratase (NAXD) deficiency: a novel neurodegenerative disorder exacerbated by febrile illnesses."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "NADHX accumulation was abrogated by lentiviral transduction of subject cells with wild-type NAXD."
    explanation: >-
      Genetic complementation establishes that the accumulation is caused by
      the NAXD defect rather than accompanying it.
  downstream:
  - target: Mitochondrial Respiratory Chain Dysfunction
    description: >-
      Damaged cofactors impair mitochondrial energy metabolism.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Inhibition of De Novo Serine Synthesis
    description: >-
      The second, non-mitochondrial consequence of the same accumulation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Inhibition of De Novo Serine Synthesis
  biological_scale: CELLULAR
  description: >-
    A branch that does not run through the mitochondrion. In NAXD knockout
    cells grown on galactose the mitochondrial signs were only subtle, while
    metabolomics showed strong inhibition of the cytosolic de novo serine
    synthesis pathway, and the same inhibition was present in NAXD patient
    fibroblasts. This matters for how the disease is read: it means the
    mitochondrial arm is not the whole account of what damaged cofactor does
    to a cell.
  biological_processes:
  - preferred_term: L-serine biosynthetic process
    term:
      id: GO:0006564
      label: L-serine biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:39789421
    reference_title: "Failure to repair damaged NAD(P)H blocks de novo serine synthesis in human cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Surprisingly, the galactose-grown NAXDko cells displayed only subtle signs of mitochondrial impairment, whereas metabolomic analyses revealed a strong inhibition of the cytosolic, de novo serine synthesis pathway in those cells as well as in NAXD patient-derived fibroblasts."
    explanation: >-
      Establishes the serine-synthesis branch in both NAXD knockout cells and
      NAXD patient fibroblasts, and records that the mitochondrial signs were
      subtle in the same experiment.
- name: Mitochondrial Respiratory Chain Dysfunction
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts and muscle show impaired mitochondrial function and are
    selectively vulnerable to metabolic stress: they fail in galactose and
    azide media, which force oxidative phosphorylation, but not in glucose,
    which permits glycolysis. Proteomics in both paediatric and adult cases
    shows reduced respiratory complexes I and IV and reduced mitoribosome, with
    mitochondrial apoptotic pathways upregulated.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  evidence:
  - reference: PMID:30576410
    reference_title: "NAD(P)HX dehydratase (NAXD) deficiency: a novel neurodegenerative disorder exacerbated by febrile illnesses."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Subject fibroblasts and muscle biopsies showed impaired mitochondrial function, higher sensitivity to metabolic stress in media containing galactose and azide, but not glucose, and decreased mitochondrial reactive oxygen species production."
    explanation: >-
      Reports the mitochondrial dysfunction and the substrate-conditional
      vulnerability that localises it to oxidative phosphorylation.
  - reference: PMID:36834994
    reference_title: "Severe NAD(P)HX Dehydratase (NAXD) Neurometabolic Syndrome May Present in Adulthood after Mild Head Trauma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present study extends our understanding of NAXD deficiency by uncovering shared mitochondrial proteomic signatures between the adult and our previously reported paediatric NAXD cases, with reduced levels of respiratory complexes I and IV as well as the mitoribosome, and the upregulation of mitochondrial apoptotic pathways."
    explanation: >-
      Names the specific complexes affected, and shows the signature is shared
      between the adult and paediatric presentations.
  downstream:
  - target: Increased circulating lactate concentration
    description: >-
      Impaired oxidative phosphorylation shifts metabolism toward lactate.
  - target: Increased CSF lactate
    description: >-
      The same shift measured in cerebrospinal fluid.
  - target: Cardiomyopathy
    description: >-
      Cardiac muscle is one of the two organs the founding series identifies as
      vulnerable, the other being brain.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Trigger-Precipitated Neurometabolic Crisis
    description: >-
      A compromised oxidative capacity fails when demand rises.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Trigger-Precipitated Neurometabolic Crisis
  biological_scale: ORGANISM
  description: >-
    The defining clinical event. A trivial fever, infection or illness, or in
    one adult a mild head trauma, precipitates rapid deterioration. This is the
    node the whole entry turns on, because it is where a chronic biochemical
    vulnerability becomes an acute, often fatal, event.
  evidence:
  - reference: PMID:35866541
    reference_title: "Clinical and biochemical distinctions for a metabolite repair disorder caused by NAXD or NAXE deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, pathogenic variants in both the NAXD and NAXE genes were associated with rapid deterioration and death after an otherwise trivial fever, infection, or illness in young patients."
    explanation: >-
      States the trigger-and-crisis pattern and its outcome.
  - reference: PMID:30576410
    reference_title: "NAD(P)HX dehydratase (NAXD) deficiency: a novel neurodegenerative disorder exacerbated by febrile illnesses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present a series of infants and children who suffered episodes of febrile illness-induced neurodegeneration or cardiac failure and early death."
    explanation: >-
      The founding case series, establishing both the febrile trigger and the
      two organ outcomes.
  downstream:

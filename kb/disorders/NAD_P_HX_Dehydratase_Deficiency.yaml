  - reference: PMID:36834994
    reference_title: "Severe NAD(P)HX Dehydratase (NAXD) Neurometabolic Syndrome May Present in Adulthood after Mild Head Trauma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the oldest known individual succumbing to NAXD-related neurometabolic crisis, at 32 years of age."
    explanation: >-
      The outlier that sets the upper bound of the age range in this record.
treatments:
- name: Niacin-Based Supplementation
  description: >-
    Niacin supplementation aims to raise flux through NAD biosynthesis and
    outrun the accumulation of damaged cofactor. Reported benefit is partial
    and symptomatic, in anecdotal paediatric reports and in the adult case; no
    controlled data exist, and the reviewers describe the approach as promising
    rather than established.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nicotinic acid
      term:
        id: CHEBI:15940
        label: nicotinic acid
  target_mechanisms:
  - target: Accumulation of Damaged NAD(P)HX Cofactors
    description: >-
      The rationale is to shift the balance of the cofactor pool, not to
      restore repair capacity, which niacin cannot do.
  evidence:
  - reference: PMID:38974613
    reference_title: "Transient response to high-dose niacin therapy in a patient with NAXE deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Therefore, niacin administration has been shown to pause clinical deterioration of patients with PEBEL‐1 and PEBEL‐2 and provide protection against the fatal outcome of these disorders."
    explanation: >-
      States the shared rationale across both repair disorders, naming
      PEBEL-2 explicitly. Graded INDIRECT because the paper reports a
      PEBEL-1 patient and the sentence summarises the prior literature
      for the pair rather than reporting a NAXD outcome.
  - reference: PMID:38974613
    reference_title: "Transient response to high-dose niacin therapy in a patient with NAXE deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Despite previous positive results for niacin supplementation in patients with PEBEL-1 and PEBEL-2, this is the first report of a patient with PEBEL-1 who deteriorated to fatal outcome despite being started on the highest dose of niacin therapy reported to date."
    explanation: >-
      The cautionary counterweight: a patient who died despite the highest
      niacin dose reported. REFUTE against the claim that niacin protects
      against the fatal outcome, and INDIRECT because that patient had
      PEBEL-1 (NAXE) rather than the NAXD deficiency this entry describes.
  - reference: PMID:36834994
    reference_title: "Severe NAD(P)HX Dehydratase (NAXD) Neurometabolic Syndrome May Present in Adulthood after Mild Head Trauma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In agreement with prior anecdotal reports in paediatric patients, niacin-based treatment also partly alleviated some clinical symptoms in this adult patient."
    explanation: >-
      Reports partial symptomatic benefit, and the authors' own framing that
      the prior evidence is anecdotal.
  - reference: PMID:35866541
    reference_title: "Clinical and biochemical distinctions for a metabolite repair disorder caused by NAXD or NAXE deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Niacin-based therapies are promising, but advances in disease modelling for both NAXD and NAXE deficiency may identify more specific compounds as targeted treatments."
    explanation: >-
      The review's assessment: promising but not established, and explicitly
      awaiting better compounds.
  - reference: PMID:39887790
    reference_title: "Cutaneous Manifestations of NAXD or NAXE Deficiency: A Literature Review for the Dermatologist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Niacin/nicotinamide supplementation resulted in improvements in skin lesions and survival rates."
    explanation: >-
      The strongest outcome claim available for this therapy. Graded INDIRECT
      because it is a retrospective literature review of a combined NAXD and
      NAXE cohort with no control group, so the survival claim is not an
      NAXD-specific controlled result.
experimental_models:
- name: NAXD patient dermal fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary skin fibroblasts from NAXD-deficient patients. This is the system
    in which the accumulation of damaged cofactors, the mitochondrial
    dysfunction and the genetic rescue were all demonstrated.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:30576410
  modeled_mechanisms:
  - target: Accumulation of Damaged NAD(P)HX Cofactors
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      The fibroblasts carry the patient genotype and show the accumulated
      cofactors directly; wild-type NAXD transduction abolishes it.
    limitations: >-
      Fibroblasts are not an affected tissue. They can report the biochemical
      lesion but not the tissue selectivity, and the febrile trigger is not
      reproduced in culture except as a surrogate metabolic stress.
    readouts:
    - name: S-NADHX, R-NADHX and cyclic NADHX concentration
      target: Accumulation of Damaged NAD(P)HX Cofactors
      direction: INCREASED
      interpretation: >-
        Direct quantification of the damaged cofactors that define the disorder.
      evidence:
      - reference: PMID:30576410
        reference_title: "NAD(P)HX dehydratase (NAXD) deficiency: a novel neurodegenerative disorder exacerbated by febrile illnesses."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Subject fibroblasts showed highly elevated concentrations of the damaged cofactors S-NADHX, R-NADHX and cyclic NADHX."
        explanation: >-
          The measurement itself, with its direction.
    - name: NADHX concentration after wild-type NAXD transduction
      target: Accumulation of Damaged NAD(P)HX Cofactors
      direction: RESTORED
      interpretation: >-
        Genetic complementation returns the cofactor pool to normal, which is
        what makes the model causal rather than descriptive.
      evidence:
      - reference: PMID:30576410
        reference_title: "NAD(P)HX dehydratase (NAXD) deficiency: a novel neurodegenerative disorder exacerbated by febrile illnesses."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "NADHX accumulation was abrogated by lentiviral transduction of subject cells with wild-type NAXD."
        explanation: >-
          The rescue experiment behind this readout.
    evidence:
    - reference: PMID:30576410
      reference_title: "NAD(P)HX dehydratase (NAXD) deficiency: a novel neurodegenerative disorder exacerbated by febrile illnesses."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "NADHX accumulation was abrogated by lentiviral transduction of subject cells with wild-type NAXD."
      explanation: >-
        The complementation result is what licenses treating these fibroblasts
        as informative for the human mechanism.
diagnosis:
- name: Biallelic NAXD variants with fibroblast NAD(P)HX quantification
  description: >-
    Molecular diagnosis by exome or genome sequencing, supported where
    available by measurement of damaged cofactors in patient fibroblasts. The
    clinical trigger is worth recognising ahead of the genetics: an
    otherwise-well young child deteriorating catastrophically during a trivial
    febrile illness, with lactate raised and brain oedema on imaging.
  evidence:
  - reference: PMID:30576410
    reference_title: "NAD(P)HX dehydratase (NAXD) deficiency: a novel neurodegenerative disorder exacerbated by febrile illnesses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome or whole-genome sequencing identified recessive NAXD variants in each case."
    explanation: >-
      States the diagnostic modality used in every case of the founding series.
differential_diagnoses:
- name: NAXE deficiency (PEBEL1)
  description: >-
    The allelic-pathway sibling. NAXE encodes NAD(P)HX epimerase, the other
    enzyme of the same two-step repair system, and its deficiency produces the
    same trigger-and-crisis pattern. The two are curated together in the
    literature reviews and are separated by gene, not by presentation.
  evidence:
  - reference: PMID:35866541
    reference_title: "Clinical and biochemical distinctions for a metabolite repair disorder caused by NAXD or NAXE deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The highly conserved enzymes NAD(P)HX dehydratase (NAXD) and NAD(P)HX epimerase (NAXE) function to repair intracellular NAD(P)HX."
    explanation: >-
      States that the two enzymes serve the same repair system, which is why
      NAXE deficiency is the first differential.
- name: Leigh syndrome and other mitochondrial encephalopathies
  description: >-
    Share the febrile decompensation, lactate elevation and symmetrical
    neuroimaging change. The distinguishing feature is biochemical: damaged
    NAD(P)HX derivatives accumulate in NAXD deficiency and not in primary
    respiratory chain disease.
discussions:
- discussion_id: naxd_trigger_set_beyond_fever
  kind: KNOWLEDGE_GAP
  attaches_to:
  - environmental#Mild head trauma
  - pathophysiology#Trigger-Precipitated Neurometabolic Crisis
  prompt: >-
    Is the precipitant of a NAXD crisis specifically hyperthermia, or any
    metabolic stress?
  rationale: >-
    The mechanism as usually stated is temperature-driven: heat accelerates
    NAD(P)H hydration, and the characterised mutant enzymes are thermolabile.
    That explanation predicts fever and nothing else. But the one adult case
    was precipitated by mild head trauma, with no fever reported as the
    trigger. If the real precipitant is any acute rise in metabolic demand,
    then surveillance advice built around antipyresis is incomplete, and the
    thermolability finding is a partial explanation rather than the mechanism.
    A single case cannot settle this, which is why it is recorded as a gap.
  proposed_experiments:
  - experiment_id: naxd_nonthermal_stress_fibroblasts
    name: Non-thermal metabolic stress in NAXD patient fibroblasts
    description: >-
      Compare NAD(P)HX accumulation in patient and control fibroblasts under
      thermal stress against non-thermal stresses at matched metabolic demand,
      to test whether temperature is necessary or merely sufficient.
    readouts:
    - name: NAD(P)HX accumulation under non-thermal stress
      target: pathophysiology#Accumulation of Damaged NAD(P)HX Cofactors
      direction: INCREASED
      interpretation: >-
        Accumulation without hyperthermia would show the trigger set is broader
        than heat.
- discussion_id: naxd_isoform_phenotype_split
  kind: KNOWLEDGE_GAP
  attaches_to:
  - has_subtypes#Mitochondrial isoform
  - has_subtypes#Combined isoform
  prompt: >-
    Does cytosolic NAD(P)HX repair specifically protect the brain, and
    mitochondrial repair specifically protect muscle?
  rationale: >-
    The subtype split in this entry is drawn from a review's cataloguing of
    published cases by variant position, not from an experiment. The proposed
    interpretation, that cytosolic repair protects from neurological damage
    while muscle is more sensitive to mitochondrial damage, is the reviewers'
    own inference from that catalogue and is offered as a suggestion. With
    roughly a dozen published patients the split rests on small numbers, and no
    isoform-specific knockout or rescue experiment has tested it.
  evidence:
  - reference: PMID:35866541
    reference_title: "Clinical and biochemical distinctions for a metabolite repair disorder caused by NAXD or NAXE deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "This suggests that cytosolic NAD(P)HX repair may protect from neurological damage, whereas muscle fibres may be more sensitive to mitochondrial NAD(P)HX damage."
    explanation: >-
      The hypothesis itself, quoted with the hedges the authors used. Indirect
      because it is an inference from a case catalogue rather than a measured
      result.
- discussion_id: naxd_phenotypic_diversity_incomplete_triad
  kind: CONTROVERSY
  attaches_to:
  - phenotypes#Cutaneous necrosis
  - pathophysiology#Trigger-Precipitated Neurometabolic Crisis
  prompt: >-
    How much of the NAXD phenotype is obligate, given patients who lack both
    the febrile trigger and the skin eruption?
  rationale: >-
    The clinical picture is usually stated as a triad: fever trigger, skin
    eruption, neurological crisis. Two published cases break it. One 7-month-old
    with a novel homozygous NAXD variant had neither a preceding fever nor any
    skin lesion, and his authors concluded the cases show phenotypic diversity.
    Another patient had prominent skin findings after immunization with no
    fever at all. Meanwhile the largest cohort puts skin manifestations at 31%,
    so the eruption is a minority finding rather than a defining one. This
    matters practically: a diagnostic heuristic built on the triad will miss
    patients, and the entry curates the skin phenotypes without asserting that
    they are obligate.
  evidence:
  - reference: PMID:36158054
    reference_title: "A Case with NAD(P)HX Dehydratase (NAXD) Deficiency: A Newly Defined Mutation in a Novel Neurodegenerative Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike the cases reported in the literature, our patient had neither preceding fever nor skin lesion during follow-up."
    explanation: >-
      The case that breaks both halves of the triad at once.
  - reference: PMID:39887790
    reference_title: "Cutaneous Manifestations of NAXD or NAXE Deficiency: A Literature Review for the Dermatologist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Skin manifestations were observed in 31% of patients with whole cell NAXD and NAXE deficiencies."
    explanation: >-
      Quantifies the skin eruption as a minority finding. Graded INDIRECT
      because the denominator pools NAXD with NAXE, so the figure is not an
      NAXD-specific frequency.
notes: >-
  On the isoform subtypes. The `has_subtypes` split here is a
  genotype-to-compartment claim from a single review's catalogue of published
  cases, not a nosological division anyone has ratified. It is curated because
  it is mechanistically specific and clinically actionable in a way a
  free-text note would lose, but the KNOWLEDGE_GAP discussion above records
  that it rests on roughly a dozen patients.

  On early death, and where it is recorded. `HP:0003819` "Death in childhood"
  was tried first and rejected by term validation: it descends from
  `HP:0040006` Mortality/Aging, which is a sibling of Phenotypic abnormality
  and so outside the schema's `PhenotypeTerm` closure. The gate is right, and
  dismech#9496 documents the same collision for `HP:0001522` and proposes
  `progression:` as the home for survival and age-at-death facts. This entry
  follows that, in the `progression:` record above. The convention is not yet
  ratified, so a reviewer who prefers `clinical_burden:` should say so.

  On a CURIE the deep-research report got wrong. The openscientist report for
  this disease proposed HP:0100697 for "Necrosis of the skin". HP:0100697 is
  *Malignant peripheral nerve sheath tumor*. The correct term, HP:0033126
  *Cutaneous necrosis*, was found by searching HPO directly and is what this
  entry binds. The report's other proposed CURIEs that were used here
  (HP:0002181, HP:0002352, HP:0001250, HP:0002376, HP:0008936, HP:0002490,
  HP:0001638, HP:0200041) all resolved to the labels the report gave them.

  On evidence taken from the sister disorder, and not taken. PMID:35637064 is a
  review of NAXE deficiency that describes the shared NAD(P)HX repair system.
  Its statements about the repair system and about decompensation under stress
  cover both enzymes explicitly and are usable here. Its clinical-findings
  sentence (muscle weakness, ataxia, ophthalmoplegia, motor and cognitive
  regression) summarises 30 NAXE cases, so ataxia and ophthalmoplegia are
  deliberately NOT curated as NAXD phenotypes even though the deep-research
  report listed them: no NAXD-specific source for either was found.

  On mortality. The largest published cohort reports 78% mortality, but pools
  NAXD with NAXE, so the figure is recorded in this note rather than as an
  outcome claim about NAXD.

  On a reference that was fetched and then not cited. PMID:31755961, a 2020
  Brain correspondence reporting further Chinese cases, has no abstract in its
  PubMed record, so the cached file has an empty body and nothing in it is
  quotable. It is deliberately absent from `references:` rather than cited
  hollowly.

  Not curated, and why. No `datasets:` and no `clinical_trials:` - no verified
  accession or trial registration exists. No `biochemical:` reference ranges -
  NAD(P)HX quantification is a research assay with no published clinical
  reference interval, and lactate is carried as a phenotype. An iPSC line from
  a PEBEL2 patient exists (PMID:38387170) but is a resource report with no
  mechanistic result, so linking it to a pathophysiology node would assert more
  than the paper shows; the patient fibroblasts, which do carry results, are
  curated instead. `directness` is set only where it was actually assessed; no count is
  given here, because a count in prose goes stale the moment an evidence item
  is added, which is how the previous one came to be wrong.

  On two management steps the review asked for and this entry does not carry.
  Acute trigger control with prompt antipyresis, and genetic counselling with
  its 25 percent recurrence risk and prenatal options, are both real clinical
  practice and both were proposed by the deep-research report. Neither is
  curated, because no reference committed here *recommends* either of them. The
  distinction matters and an earlier version of this note got it wrong: it
  claimed a grep of the cached sources returns no fever-management sentence at
  all, and review showed that is false. PMID:34161859 describes a NAXD patient
  "managed on antibiotics, antipyretics, and antiepileptics". That sentence
  reports what one child received before she died; it does not recommend
  antipyresis, so it cannot support a treatment entry, but the claim as
  originally worded was wrong and is corrected here. The counselling half
  stands: nothing cached mentions counselling, recurrence risk, prenatal
  testing or carrier testing. They are the kind of claim that is easy to assert from general
  practice and hard to source for a specific ultra-rare disease, which is
  exactly when a citation matters most. A guideline or review that states them
  of NAXD deficiency would close this in one pass.

  On the niacin caution and whose disease it is. PMID:38974613 reports a
  patient who died despite the highest niacin dose published. That patient had
  PEBEL-1 (NAXE), not the NAXD deficiency this entry describes, so the item is
  graded REFUTE with `directness: INDIRECT` and its explanation names the
  disease. It is carried rather than dropped because a treatments section whose
  only entry is niacin should not omit the one published failure of niacin in
  the sister disorder; it is graded INDIRECT rather than DIRECT because the
  denominator is the other half of the pair. This is the same pooled-entity
  problem recorded in the prevalence notes and filed as dismech#11268.


progression:
- phase: Crisis-punctuated course to early death
  age_range: Typically infancy to early childhood; one reported case survived to 32
  notes: >-
    The course is stepwise rather than smoothly progressive: long compensated
    intervals punctuated by trigger-precipitated crises, each of which can be
    fatal or leave fixed deficit. Death commonly follows the first or an early
    crisis. Early death is recorded here rather than as a phenotype because
    HPO's Mortality/Aging branch sits outside the schema's PhenotypeTerm
    closure; see dismech#9496, which names `progression:` as the intended home
    for survival and age-at-death facts.
  evidence:
  - reference: PMID:30576410
    reference_title: "NAD(P)HX dehydratase (NAXD) deficiency: a novel neurodegenerative disorder exacerbated by febrile illnesses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present a series of infants and children who suffered episodes of febrile illness-induced neurodegeneration or cardiac failure and early death."
    explanation: >-
      Establishes the episodic course and early death in the founding series.
  - reference: PMID:30576410
    reference_title: "NAD(P)HX dehydratase (NAXD) deficiency: a novel neurodegenerative disorder exacerbated by febrile illnesses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results show that NAXD deficiency can be classified as a metabolite repair disorder in which accumulation of damaged metabolites likely triggers devastating effects in tissues such as the brain and the heart, eventually leading to early childhood death."
    explanation: >-

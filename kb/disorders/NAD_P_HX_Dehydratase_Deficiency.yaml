    snippet: "Interestingly, patients with NAXD variants exclusively affecting the mitochondrial isoform present with myopathy, moderate neuropathy and a cardiac presentation, without the characteristic skin lesions, seizures or neurological degeneration."
    explanation: >-
      Reports myopathy and restricts it to the mitochondrial-isoform genotype.
- category: Hair

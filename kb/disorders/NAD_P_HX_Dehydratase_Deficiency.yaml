- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Eight unrelated individuals reported as of the 2021 NAXD review, with
    further cases since including one adult. A 2025 dermatology review counted
    45 patients, but that count pools NAXD with its sister disorder NAXE and so
    is not an NAXD case count. No population prevalence estimate exists.
  evidence:
  - reference: PMID:34161859
    reference_title: "NAD(P)HX dehydratase (NAXD) deficiency due to a novel biallelic missense variant and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, variants in NAXD have been reported in eight unrelated individuals including six truncating and six missense variants."
    explanation: >-
      Gives the reported NAXD case count this band is based on.
  - reference: PMID:39887790
    reference_title: "Cutaneous Manifestations of NAXD or NAXE Deficiency: A Literature Review for the Dermatologist."

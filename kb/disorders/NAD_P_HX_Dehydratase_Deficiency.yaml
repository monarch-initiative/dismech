genetic:
- name: NAXD
  gene_term:
    preferred_term: NAXD
    term:
      id: hgnc:25576
      label: NAXD
  relationship_type: CAUSATIVE
  notes: >-
    Both truncating and missense variants are reported. Which NAXD isoform a
    variant affects, rather than its class, appears to determine the clinical
    presentation: exon 1 encodes the mitochondrial propeptide and the cytosolic
    isoform starts from an alternative codon in exon 2, so a variant in exon 1
    spares the cytosolic enzyme.
  evidence:
  - reference: PMID:34161859
    reference_title: "NAD(P)HX dehydratase (NAXD) deficiency due to a novel biallelic missense variant and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, variants in NAXD have been reported in eight unrelated individuals including six truncating and six missense variants."
    explanation: >-
      Gives the reported variant spectrum and its size as of 2021.
  - reference: PMID:35866541
    reference_title: "Clinical and biochemical distinctions for a metabolite repair disorder caused by NAXD or NAXE deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exon 1 of NAXD contains a mitochondrial propeptide, and a unique cytosolic isoform is initiated from an alternative start codon in exon 2."
    explanation: >-
      The gene-structure fact that makes isoform-selective variants possible,
      and so underpins the subtype split.
environmental:
- name: Febrile illness or intercurrent infection
  description: >-
    Fever, infection or other trivial illness is the principal precipitant of a
    neurometabolic crisis. The mechanistic link is not speculative: heat
    accelerates the spontaneous hydration that generates NAD(P)HX, and the two
    characterised mutant enzymes are thermolabile, so the repair capacity falls
    as the substrate load rises.
  exposure_term:
    preferred_term: febrile illness
  review_notes: >-
    Left unbound. ECTO was searched for a suitable exposure term; the closest
    candidate, ECTO:1000007 "exposure to high temperature environment",
    describes ambient heat and not endogenous fever, and binding it would
    misstate the exposure. No ECTO or ExO term for febrile illness, infection
    or endogenous hyperthermia was found. Recorded as free text rather than
    bound to a wrong term.
  influences_mechanisms:
  - target: Trigger-Precipitated Neurometabolic Crisis
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Fever is the reported precipitant of the crises in the founding series
      and in the review literature.
    evidence:
    - reference: PMID:35866541
      reference_title: "Clinical and biochemical distinctions for a metabolite repair disorder caused by NAXD or NAXE deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Recently, pathogenic variants in both the NAXD and NAXE genes were associated with rapid deterioration and death after an otherwise trivial fever, infection, or illness in young patients."
      explanation: >-
        Establishes fever and intercurrent illness as the precipitants of the
        deterioration this edge asserts.
  evidence:
  - reference: PMID:30576410
    reference_title: "NAD(P)HX dehydratase (NAXD) deficiency: a novel neurodegenerative disorder exacerbated by febrile illnesses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present a series of infants and children who suffered episodes of febrile illness-induced neurodegeneration or cardiac failure and early death."
    explanation: >-
      The founding series describes the neurodegeneration as febrile-illness
      induced.
- name: Mild head trauma
  description: >-
    In the single reported adult case, a mild head trauma rather than a fever
    precipitated the fatal crisis. This matters for surveillance: if the
    trigger set is "metabolic stress" rather than "hyperthermia", then advice
    limited to fever management is incomplete.
  exposure_term:
    preferred_term: mild head trauma
  review_notes: >-
    Left unbound. ECTO and ExO were searched for a mechanical-injury exposure
    term; nothing matching head trauma was found, and the physical-object
    quality branch (ECTO:0010003) is far too broad to carry the claim.
  influences_mechanisms:
  - target: Trigger-Precipitated Neurometabolic Crisis
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The adult case's deterioration followed a mild head trauma, extending the
      trigger set beyond febrile illness.
    evidence:
    - reference: PMID:36834994
      reference_title: "Severe NAD(P)HX Dehydratase (NAXD) Neurometabolic Syndrome May Present in Adulthood after Mild Head Trauma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The clinical deterioration and demise of this individual were likely triggered by mild head trauma."
      explanation: >-
        The single observation supporting this edge. The authors write "likely
        triggered", which is the strength of the claim.
  evidence:
  - reference: PMID:36834994
    reference_title: "Severe NAD(P)HX Dehydratase (NAXD) Neurometabolic Syndrome May Present in Adulthood after Mild Head Trauma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the oldest known individual succumbing to NAXD-related neurometabolic crisis, at 32 years of age."
    explanation: >-
      Establishes the case this exposure is drawn from, and that it is a single
      adult patient.
- name: Routine childhood immunization
  description: >-
    One patient deteriorated after routine 4-month immunizations, with
    prominent skin findings and no fever. This is the observation that most
    strains the thermal explanation of the disease, because the trigger
    operated without the hyperthermia the mechanism invokes.
  exposure_term:
    preferred_term: routine childhood immunization
  review_notes: >-
    Left unbound. ECTO was searched for a vaccination or immunization exposure
    term and none was found; ECTO:2000005 "exposure to hormone replacement
    therapy" and the drug-exposure branch do not describe vaccination.
  influences_mechanisms:
  - target: Trigger-Precipitated Neurometabolic Crisis
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Immunization preceded the crisis in this case, in the absence of fever.
    evidence:
    - reference: PMID:38214124
      reference_title: "Progressive encephalopathy after routine 4-month immunizations in a patient with NAXD genetic variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "In this report, we describe a case of probable PEBEL2 in a patient with a variant of unknown significance (c.362C>T, p.121L) in the NAXD gene who presented after routine immunizations with significant skin findings and in the absence of fevers."
      explanation: >-
        The single observation behind this edge. Graded INDIRECT because the
        authors themselves call the case "probable PEBEL2" carrying a variant
        of unknown significance, so the genotype attribution is not secure.
  evidence:
  - reference: PMID:38214124
    reference_title: "Progressive encephalopathy after routine 4-month immunizations in a patient with NAXD genetic variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "In this report, we describe a case of probable PEBEL2 in a patient with a variant of unknown significance (c.362C>T, p.121L) in the NAXD gene who presented after routine immunizations with significant skin findings and in the absence of fevers."
    explanation: >-
      Establishes the exposure and, in the same sentence, the two reasons to
      treat it cautiously: a variant of unknown significance and a "probable"
      diagnosis.

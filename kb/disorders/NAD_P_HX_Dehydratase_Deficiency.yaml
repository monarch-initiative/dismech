name: NAD(P)HX Dehydratase Deficiency
creation_date: "2026-09-06T19:15:00Z"
category: Mendelian
description: >-
  NAD(P)HX dehydratase (NAXD) deficiency, also catalogued as PEBEL2, is an
  autosomal recessive metabolite repair disorder. NAD(P)H is chemically fragile:
  spontaneous hydration, accelerated by heat, converts it into redox-inactive
  NAD(P)HX derivatives that inhibit dehydrogenases. NAXD is the ATP-dependent
  enzyme that reverses this damage. When it fails, the damaged cofactors
  accumulate and mitochondrial function degrades.

  The clinically distinctive feature is that the disease is largely silent
  until a trigger arrives. A trivial febrile illness precipitates rapid,
  often irreversible neurological deterioration with brain oedema,
  leukoencephalopathy, seizures, lactic acidosis and characteristic skin
  lesions, and children commonly die during or shortly after the first crisis.
  A single adult case was precipitated at 32 by mild head trauma rather than
  fever, which widens the trigger set beyond hyperthermia. Which tissues fail
  depends on which NAXD isoform the variants hit: variants affecting both the
  cytosolic and mitochondrial isoforms give the neurological picture, while
  variants restricted to the mitochondrial isoform give myopathy, neuropathy
  and cardiac disease without seizures or skin lesions. Niacin-based treatment
  has partly relieved symptoms but is not curative.

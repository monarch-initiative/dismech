    In a cardiac pathology registry of 650 sudden cardiac deaths in adults aged
    40 or under, prolapse was the only identified cause in 7% overall and 13% of
    women.
  evidence:
  - reference: PMID:26160859
    reference_title: "Arrhythmic Mitral Valve Prolapse and Sudden Cardiac Death."
    supports: SUPPORT

discussions:
- discussion_id: mvp_arrhythmic_risk_stratification
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Regional Left Ventricular Fibrosis"
  - "pathophysiology#Ventricular Electrical Instability and Sudden Cardiac Death"
  prompt: >
    Which patients with mitral valve prolapse should be investigated for
    arrhythmic risk, and what should be done for those found to be at risk?
  rationale: >
    The mechanism is now well enough characterized to name the features that
    travel with arrhythmic prolapse - bileaflet involvement, annular disjunction,
    systolic curling, inferobasal and papillary late gadolinium enhancement,
    inverted inferior T waves, a midsystolic click. What is missing is anything
    that turns those features into a decision. The absolute risk conferred by
    each is unknown because the denominators come from autopsy series and
    referral cohorts rather than from a population followed prospectively, and
    prolapse is far too common - 2.4% of the population - for a feature with a
    small positive predictive value to be actionable. Nor is it known whether
    valve surgery, catheter ablation, or a defibrillator modifies the outcome.
    The consequence is a mechanism understood well enough to worry patients and
    not well enough to guide them.
  proposed_experiments:
  - experiment_id: exp_mvp_prospective_cmr_cohort
    name: Prospective population-based cohort with cardiac magnetic resonance phenotyping
    description: >-
      Enrol an unselected population-based cohort with echocardiographic prolapse
      and characterize annular disjunction, curling, leaflet involvement, and
      late gadolinium enhancement at baseline, then follow prospectively for
      arrhythmic events. This supplies the denominator that autopsy registries
      and referral cohorts structurally cannot, and is the only design that can
      convert the identified features into absolute risks.
  - experiment_id: exp_mvp_intervention_on_traction
    name: Test whether abolishing leaflet traction halts progression of the arrhythmic substrate
    description: >-
      In patients with arrhythmic prolapse undergoing mitral valve surgery for an
      independent indication, measure late gadolinium enhancement burden and
      arrhythmia before and serially after operation. If the traction hypothesis
      is correct, correcting annular and leaflet mechanics should arrest
      progression of the fibrotic substrate; no change would indicate the scar,
      once established, is autonomous.
- discussion_id: mvp_two_diseases_one_finding
  kind: OPEN_QUESTION
  attaches_to:
  - "pathophysiology#Systolic Leaflet Prolapse"
  prompt: >
    Are haemodynamic and arrhythmic mitral valve prolapse one disease with two
    outcomes, or two diseases sharing an echocardiographic finding?
  rationale: >
    They differ in almost everything measurable. The arrhythmic phenotype is
    female-predominant, presents in the third and fourth decades, and occurs with
    no or trivial regurgitation; the haemodynamic phenotype in the quantified
    surgical cohorts is male-predominant, presents decades later, and is graded
    entirely by regurgitant orifice area. The structural correlates differ too -
    annular disjunction and curling versus leaflet flail and coaptation failure.
    Whether a single myxomatous process yields both depending on where the
    remodeling falls, or whether annular disjunction is a distinct developmental
    abnormality that merely co-occurs with prolapse, is unsettled, and it
    determines whether an entry like this one should eventually be split.

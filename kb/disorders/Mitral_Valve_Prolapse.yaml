  - reference: PMID:26160859
    reference_title: "Arrhythmic Mitral Valve Prolapse and Sudden Cardiac Death."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fibrosis of the papillary muscles and inferobasal left ventricular wall,

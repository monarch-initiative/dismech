  downstream:
  - target: Heart Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Sustained volume overload eventually exceeds ventricular compensation.
- name: Heart Failure
  biological_scale: ORGANISM
  description: >
    Decompensation of the volume-loaded ventricle. Notably absent from the
    community phenotype: no subject with prolapse in the Framingham offspring
    cohort had a history of heart failure, which is the clearest single statement
    of how rarely uncomplicated prolapse progresses this far.
  locations:

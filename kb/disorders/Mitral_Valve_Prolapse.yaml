- name: Ventricular Electrical Instability and Sudden Cardiac Death
  biological_scale: ORGANISM
  description: >
    Malignant ventricular arrhythmia in prolapse appears to need both halves of
    the classical substrate-plus-trigger pair. The substrate is the regional
    hypertrophy and fibrosis together with surviving Purkinje tissue; the trigger
    is mechanical stretch eliciting premature ventricular beats, documented
    arising from Purkinje tissue in patients with aborted sudden death. Prolapse
    accounts for 7% of sudden cardiac deaths in adults aged 40 or under and 13%
    of those in young women, and the electrocardiographic signature points back
    at the anatomy: inverted inferior T waves in 83% of cases with an available
    tracing, and right bundle-branch block morphology arrhythmias in all of them,
    consistent with a left ventricular inferobasal origin.
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  cell_types:
  - preferred_term: Purkinje myocyte
    term:
      id: CL:0002068
      label: Purkinje myocyte
  evidence:
  - reference: PMID:26160859
    reference_title: "Arrhythmic Mitral Valve Prolapse and Sudden Cardiac Death."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Forty-three patients with MVP (26 females; age range, 19-40 years; median,
      32 years) were identified (7% of all SCD, 13% of women).
    explanation: >-
      Quantifies the contribution of prolapse to sudden cardiac death in a young
      autopsy registry, and its striking female predominance.
  - reference: PMID:26160859
    reference_title: "Arrhythmic Mitral Valve Prolapse and Sudden Cardiac Death."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 12 cases with available ECG, 10 (83%) had inverted T waves on
      inferior leads, and all had right bundle-branch block ventricular
      arrhythmias.
    explanation: >-
      The electrocardiographic signature localizing the arrhythmia to the same
      inferobasal territory as the fibrosis.
  - reference: PMID:31498700
    reference_title: "Mitral Valve Prolapse, Ventricular Arrhythmias, and Sudden Death."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The genesis of malignant ventricular arrhythmias in MVP probably recognizes
      the combination of the substrate (regional myocardial hypertrophy and
      fibrosis, Purkinje fibers) and the trigger (mechanical stretch) eliciting
      premature ventricular beats because of a primary morphofunctional
      abnormality of the mitral valve annulus.
    explanation: >-
      States the substrate-plus-trigger model this node encodes. Evidence source
      is OTHER because this is a review.
- name: Mitral Regurgitation and Left Ventricular Volume Overload
  biological_scale: ORGANISM
  description: >
    The haemodynamic route, and the one that dominates the surgical literature.
    Failure of coaptation regurgitates a fraction of stroke volume into the left
    atrium; the ventricle compensates by dilating. Outcome is graded by the
    effective regurgitant orifice area rather than by symptoms: in asymptomatic
    patients followed for a median of 26 years, five-year survival under medical
    management fell from 88% with an orifice below 20 mm2 to 55% at 40 mm2 or
    above, with risk rising continuously rather than at a threshold. This is a
    different disease from the arrhythmic one, in a different population, and it
    is measured differently.
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  evidence:
  - reference: PMID:42525396
    reference_title: "Twenty-Five-Year Follow-Up of Quantified Mitral Regurgitation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Survival of medically treated patients declined progressively with
      increasing ERO category (5-year rate: 88%
    explanation: >-
      Establishes regurgitant orifice area as the graded determinant of survival
      under medical management.
  - reference: PMID:42525396
    reference_title: "Twenty-Five-Year Follow-Up of Quantified Mitral Regurgitation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      increasing ERO was associated with an increase in risk of mortality under

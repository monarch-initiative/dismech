name: Mitral Valve Prolapse
creation_date: "2026-08-11T00:00:00Z"
category: Acquired
disease_term:
  preferred_term: mitral valve prolapse
  term:
    id: MONDO:0004910
    label: mitral valve prolapse
description: >
  Systolic displacement of one or both mitral leaflets into the left atrium,
  arising from myxomatous remodeling of the leaflet extracellular matrix. It is
  common - 2.4% of an unselected community population - and in the great majority
  of those people it is benign, with trace or mild regurgitation and no excess of
  heart failure, stroke, or arrhythmia. It is also responsible for 7% of sudden
  cardiac deaths in adults under 40, and 13% of those in young women.
  Both statements are true, and reconciling them is what this entry is for. There
  are two distinct diseases inside one echocardiographic finding, and they injure
  the heart by different routes. The familiar route is haemodynamic: severe
  regurgitation volume-loads the left ventricle, and outcome tracks the
  regurgitant orifice area. The other route is mechanical and does not require
  significant regurgitation at all. Where the leaflet hinge is detached from the
  ventricular myocardium - mitral annular disjunction - the annulus curls in
  systole and the prolapsing leaflet drags on the inferobasal wall and papillary
  muscles. That repeated traction produces regional hypertrophy and fibrosis, and
  the fibrosis is the arrhythmic substrate. The valve kills through the
  myocardium, not through the regurgitation, and it does so in patients whose
  valve lesion would otherwise be called mild.
  The practical consequence is that the two diseases need different
  measurements. Grading regurgitation severity is the right question for one and
  the wrong question for the other.
synonyms:
- Barlow's syndrome
- floppy mitral valve
- myxomatous mitral valve disease
notes: >
  Scope. This entry covers non-syndromic mitral valve prolapse (MONDO:0004910).
  It is deliberately not merged with the numbered familial myxomatous forms
  (MONDO:0011915 MMVP2, MONDO:0012569 MMVP3) or with prolapse occurring as a
  feature of Marfan syndrome, Ehlers-Danlos syndrome, or other connective-tissue
  disorders already curated in this knowledge base. FLNA and DCHS1 are curated
  here because both were identified in isolated non-syndromic families, which is
  precisely what makes them informative about the common disease.

  Deliberate non-conformance to `cardiac_ion_channel_repolarization`. Arrhythmic
  mitral valve prolapse superficially fits: ventricular arrhythmia, syncope,
  sudden death in young people. But that module is explicitly scoped to
  "inherited arrhythmia syndromes in structurally normal hearts", and the whole
  point of the arrhythmic MVP literature is that these hearts are not
  structurally normal - the substrate is regional myocardial fibrosis
  demonstrable at histology and by late gadolinium enhancement. Declaring
  conformance would assert a channelopathy mechanism the evidence contradicts.

  `fibrotic_response` conformance is declared at the myocardial fibrosis node
  only. The module's `Tissue Injury` trigger is instantiated here by repetitive
  mechanical traction rather than by chemical or inflammatory injury, which is an
  unusual but legitimate substitution; the ECM-deposition effector node is
  conserved. It is not declared on the leaflet myxomatous remodeling node, which
  is a developmental/degenerative matrix disorder rather than a reparative
  fibrotic response - the leaflet accumulates proteoglycan and becomes more
  compliant, the opposite of the stiff collagenous scar the module describes.

  The 2.4% Framingham prevalence and the 7%/13% sudden-death fractions are not
  in tension once the denominators are read: the first is a prevalence in a
  community population, the second a proportion of an autopsy series of sudden
  deaths in the young. Neither licenses a statement about absolute arrhythmic
  risk for an individual with prolapse, and none is made here.
pathophysiology:
- name: Myxomatous Leaflet Remodeling
  biological_scale: TISSUE
  role: trigger
  description: >
    The primary lesion. Mitral valve interstitial cells remodel the leaflet
    extracellular matrix, producing thickened, redundant, abnormally compliant
    leaflets - the myxomatous or "floppy" valve. Leaflet thickness of 5 mm or
    more distinguishes classic from non-classic prolapse echocardiographically
    and is not a cosmetic distinction: it marks the more substantially remodeled
    valve. Myxomatous valve disease is among the commonest indications for
    valvular surgery.
  locations:
  - preferred_term: mitral valve
    term:
      id: UBERON:0002135
      label: mitral valve
  cell_types:
  - preferred_term: mitral valve interstitial cell
    term:
      id: CL:4030032
      label: valve interstitial cell
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:17190868
    reference_title: "Mutations in the gene encoding filamin A as a cause for familial cardiac valvular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Myxomatous dystrophy of the cardiac valves affects approximately 3% of the
      population and remains one of the most common indications for valvular
      surgery.
    explanation: >-
      Establishes myxomatous valve dystrophy as the underlying lesion and its
      population and surgical burden.
  - reference: PMID:10387935
    reference_title: "Prevalence and clinical outcome of mitral-valve prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic mitral-valve prolapse was defined as superior displacement of the
      mitral leaflets of more than 2 mm during systole and as a maximal leaflet
      thickness of at least 5 mm during diastasis
    explanation: >-
      Supplies the leaflet-thickness criterion that operationalizes myxomatous
      remodeling in the classic phenotype.
  downstream:
  - target: Systolic Leaflet Prolapse
    causal_link_type: DIRECT
    description: >-
      Redundant, abnormally compliant leaflets billow into the left atrium under
      systolic pressure.
- name: Valve Developmental and Cytoskeletal Gene Lesion
  biological_scale: MOLECULAR
  role: trigger
  description: >
    Non-syndromic prolapse has a clear heritable component, and two genes
    identified in isolated families implicate different layers of valve biology.
    FLNA, encoding the actin-crosslinking protein filamin A, causes X-linked
    myxomatous valvular dystrophy with complete penetrance in men and incomplete
    penetrance in women - a cytoskeletal, mechanotransductive lesion. DCHS1,
    the human homologue of the Drosophila planar-cell-polarity gene dachsous,
    causes autosomal prolapse through impaired valve interstitial cell migration
    and patterning, and the mouse heterozygote traces adult prolapse back to
    developmental errors in valve morphogenesis. Together they suggest the adult
    valve lesion is in part a developmental one.
  genes:
  - preferred_term: FLNA
    term:
      id: hgnc:3754
      label: FLNA
  - preferred_term: DCHS1
    term:
      id: hgnc:13681
      label: DCHS1
  evidence:
  - reference: PMID:17190868
    reference_title: "Mutations in the gene encoding filamin A as a cause for familial cardiac valvular dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data demonstrate that FLNA is the first gene known to cause isolated
      nonsyndromic MVD.
    explanation: >-
      Establishes FLNA as causal for isolated, non-syndromic myxomatous valve
      disease - the point that makes it relevant to the common disease rather
      than to a syndrome.
  - reference: PMID:26258302
    reference_title: "Mutations in DCHS1 cause mitral valve prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a missense mutation in the DCHS1 gene, the human homologue of the
      Drosophila cell polarity gene dachsous (ds), that segregates with MVP in the
      family.
    explanation: >-
      Establishes DCHS1 segregation with non-syndromic prolapse in a
      multigenerational family.
  - reference: PMID:26258302
    reference_title: "Mutations in DCHS1 cause mitral valve prolapse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Dchs1(+/-) mice had prolapse of thickened mitral leaflets, which could be
      traced back to developmental errors in valve morphogenesis.
    explanation: >-
      Supports a developmental origin for the adult leaflet lesion. Evidence
      source is MODEL_ORGANISM because the tracing was done in mice.
  downstream:
  - target: Myxomatous Leaflet Remodeling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Impaired interstitial cell patterning, migration, and mechanotransduction
      yield an abnormally remodeled leaflet matrix.
- name: Systolic Leaflet Prolapse
  biological_scale: TISSUE
  description: >
    Superior displacement of one or both leaflets more than 2 mm past the annular
    plane during systole - the defining finding, and the audible midsystolic
    click. In the community the prolapsing valve is usually competent or nearly
    so: Framingham subjects with prolapse had more regurgitation than those
    without, but on average only trace or mild. Bileaflet involvement is
    disproportionately represented in the arrhythmic phenotype, being present in
    70% of both sudden-death cases and living patients with complex ventricular
    arrhythmia.
  locations:
  - preferred_term: mitral valve
    term:
      id: UBERON:0002135
      label: mitral valve
  evidence:
  - reference: PMID:10387935
    reference_title: "Prevalence and clinical outcome of mitral-valve prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The subjects with prolapse were leaner (P<0.001) and had a greater degree
      of mitral regurgitation than those without prolapse, but on average the
      regurgitation was classified as trace or mild.
    explanation: >-
      Establishes that prolapse in the community is usually associated with only
      trivial regurgitation, which is what separates the anatomic finding from
      the haemodynamic disease.
  - reference: PMID:26160859
    reference_title: "Arrhythmic Mitral Valve Prolapse and Sudden Cardiac Death."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A bileaflet involvement was found in 70%.
    explanation: >-
      Quantifies bileaflet involvement in sudden-death cases with prolapse as the
      only identified cause.
  downstream:
  - target: Mitral Regurgitation and Left Ventricular Volume Overload
    causal_link_type: DIRECT
    description: >-
      Failure of leaflet coaptation permits systolic regurgitation into the left
      atrium. This branch dominates in a minority of patients.
  - target: Mechanical Traction on Papillary Muscles and Inferobasal Wall
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Excessive leaflet excursion transmits repetitive tension to the subvalvular
      apparatus and adjacent myocardium. This branch does not require
      haemodynamically significant regurgitation.
    hypothesis_groups:
    - mechanical_traction_arrhythmogenesis
- name: Mitral Annular Disjunction and Systolic Curling
  biological_scale: TISSUE
  description: >
    A structural abnormality of the valve hinge rather than of the leaflet: the
    atrial wall-mitral valve junction is displaced away from the ventricular
    myocardium, so the annulus is not anchored where it should be. In systole the
    disjointed posterior annulus curls toward the atrium instead of descending
    with the ventricle. Disjunction is a constant feature of arrhythmic prolapse
    with ventricular fibrosis - median 4.8 mm versus 1.8 mm in prolapse without
    fibrosis - and the degree of disjunction correlates tightly with the degree
    of curling. It is what converts leaflet excursion into myocardial traction,
    and it can be measured directly.
  locations:
  - preferred_term: mitral valve
    term:
      id: UBERON:0002135
      label: mitral valve
  evidence:
  - reference: PMID:27516479
    reference_title: "Morphofunctional Abnormalities of Mitral Annulus and Arrhythmic Mitral Valve Prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mitral annulus disjunction is a constant feature of arrhythmic MVP with LV
      fibrosis.
    explanation: >-
      States the central claim of this node in the authors' own terms.
  - reference: PMID:27516479
    reference_title: "Morphofunctional Abnormalities of Mitral Annulus and Arrhythmic Mitral Valve Prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mitral annulus disjunction (median: 4.8 versus 1.8 mm; P<0.001)
    explanation: >-
      Quantifies the difference in disjunction between prolapse with and without
      ventricular fibrosis.
  - reference: PMID:27516479
    reference_title: "Morphofunctional Abnormalities of Mitral Annulus and Arrhythmic Mitral Valve Prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A linear correlation was found between mitral annulus disjunction and
      curling (R=0.85).
    explanation: >-
      Links the anatomic abnormality to the abnormal systolic motion through
      which it acts, which is what makes this a mechanism rather than an
      association.
  downstream:
  - target: Mechanical Traction on Papillary Muscles and Inferobasal Wall
    causal_link_type: DIRECT
    description: >-
      Curling of the unanchored annulus transmits leaflet excursion to the
      inferobasal wall as repetitive stretch.
    hypothesis_groups:
    - mechanical_traction_arrhythmogenesis
- name: Mechanical Traction on Papillary Muscles and Inferobasal Wall
  biological_scale: TISSUE
  description: >
    The mechanistic pivot of the arrhythmic phenotype. Excessive leaflet mobility
    combined with an unanchored, curling annulus applies repetitive systolic
    stretch to the inferobasal left ventricular wall and the papillary muscles.
    The regional distribution of the resulting injury is the signature: fibrosis
    appears exactly where the traction is applied, not diffusely, and not where
    ischaemia or a cardiomyopathy would put it. Crucially, this operates in
    patients with no or trivial mitral regurgitation, so it is not a consequence
    of volume loading.
  locations:
  - preferred_term: papillary muscle of heart
    term:
      id: UBERON:0002494
      label: papillary muscle of heart
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: cellular response to mechanical stimulus
    term:
      id: GO:0071260
      label: cellular response to mechanical stimulus
    modifier: INCREASED
  evidence:
  - reference: PMID:27516479
    reference_title: "Morphofunctional Abnormalities of Mitral Annulus and Arrhythmic Mitral Valve Prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The excessive mobility of the leaflets caused by posterior systolic curling
      accounts for a mechanical stretch of the inferobasal wall and papillary
      muscles, eventually leading to myocardial hypertrophy and scarring.
    explanation: >-
      States the traction-to-scarring mechanism this node encodes.
  - reference: PMID:27516479
    reference_title: "Morphofunctional Abnormalities of Mitral Annulus and Arrhythmic Mitral Valve Prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      arrhythmic MVP patients with LV late gadolinium enhancement on cardiac
      magnetic resonance and no or trivial mitral regurgitation
    explanation: >-
      The decisive control: the cohort in which this mechanism was demonstrated
      had no haemodynamically significant regurgitation, so the myocardial injury
      cannot be attributed to volume overload.
  downstream:
  - target: Regional Left Ventricular Fibrosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Repetitive mechanical stretch drives regional myocardial hypertrophy and
      replacement fibrosis.
    hypothesis_groups:
    - mechanical_traction_arrhythmogenesis
- name: Regional Left Ventricular Fibrosis
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  description: >
    Fibrosis of the papillary muscles and the inferobasal left ventricular wall -
    found at histology in every one of the sudden-death cases in which prolapse
    was the only identified cause, and at the papillary muscles in all of them.
    In living patients with complex ventricular arrhythmia the same distribution
    appears as late gadolinium enhancement in 93%, against 14% of prolapse
    controls. The correspondence between the autopsy and imaging distributions is
    what makes this a substrate rather than an epiphenomenon, and what makes it
    detectable before the arrhythmia rather than after it.
    This node conforms to the extracellular-matrix-deposition effector of the
    `fibrotic_response` module with mechanical traction substituted for the
    module's usual chemical or inflammatory tissue injury.
  locations:
  - preferred_term: papillary muscle of heart
    term:
      id: UBERON:0002494
      label: papillary muscle of heart
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  cell_types:
  - preferred_term: cardiac fibroblast
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:26160859
    reference_title: "Arrhythmic Mitral Valve Prolapse and Sudden Cardiac Death."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Left ventricular fibrosis was detected at histology at the level of
      papillary muscles in all patients, and inferobasal wall in 88%.
    explanation: >-
      Establishes the fibrosis and its regional distribution at autopsy in
      sudden-death cases where prolapse was the only cause found.
  - reference: PMID:26160859
    reference_title: "Arrhythmic Mitral Valve Prolapse and Sudden Cardiac Death."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Left ventricular late enhancement was identified by contrast-enhanced
      cardiac magnetic resonance in 93% of patients versus 14% of control
      subjects (P<0.001), with a regional distribution overlapping the
      histopathology findings in SCD cases.
    explanation: >-
      The in vivo counterpart with the same regional distribution, which is what

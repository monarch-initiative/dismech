mechanistic_hypotheses:
- hypothesis_group_id: mechanical_traction_arrhythmogenesis
  hypothesis_label: Leaflet traction-induced myocardial fibrosis
  status: CANONICAL
  description: >
    Arrhythmic risk in mitral valve prolapse is generated by mechanical traction
    rather than by regurgitation. An unanchored, curling annulus converts
    excessive leaflet excursion into repetitive stretch of the papillary muscles
    and inferobasal wall, which scars; the scar plus surviving Purkinje tissue is
    the substrate, and stretch-elicited premature beats are the trigger.
    The hypothesis makes three predictions, all of which have been met: the
    fibrosis should be regional and confined to the traction territory, it should
    be present in patients with no significant regurgitation, and annular
    disjunction should be measurable and should correlate with curling. Its most
    important untested prediction is therapeutic - that abolishing the traction
    should abolish the substrate's progression.
  evidence:
  - reference: PMID:27516479
    reference_title: "Morphofunctional Abnormalities of Mitral Annulus and Arrhythmic Mitral Valve Prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The excessive mobility of the leaflets caused by posterior systolic curling
      accounts for a mechanical stretch of the inferobasal wall and papillary
      muscles, eventually leading to myocardial hypertrophy and scarring.
    explanation: >-
      States the hypothesis in the terms curated here.
  - reference: PMID:26160859
    reference_title: "Arrhythmic Mitral Valve Prolapse and Sudden Cardiac Death."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MVP may present with ventricular arrhythmias and sudden cardiac death (SCD)
      even in the absence of hemodynamic impairment.
    explanation: >-
      The observation the hypothesis exists to explain, and the reason a
      regurgitation-based account cannot be sufficient.
treatments:
- name: Mitral Valve Repair
  description: >
    Surgical reconstruction of the mitral valve and its annulus, the preferred
    intervention for severe degenerative regurgitation and the operation the
    surgical literature is built on. Whether it also abolishes arrhythmic risk in
    prolapse without significant regurgitation is a separate and unresolved
    question.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: mitral valve repair
    term:
      id: NCIT:C80449
      label: Mitral Valve Repair
  target_mechanisms:
  - target: Mitral Regurgitation and Left Ventricular Volume Overload
    treatment_effect: INHIBITS
    description: >-
      Restoring leaflet coaptation abolishes the regurgitant volume and the
      ventricular volume load.
  evidence:
  - reference: PMID:42525396
    reference_title: "Twenty-Five-Year Follow-Up of Quantified Mitral Regurgitation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with upper-moderate MR (ERO 30-39 mm2) at baseline demonstrated a
      significant association between surgical treatment and improved long-term
      survival.
    explanation: >-
      Supports a survival benefit of surgery, and locates the severity threshold
      at which it becomes demonstrable.
- name: Transcatheter Edge-to-Edge Repair
  description: >
    Catheter-delivered leaflet approximation, avoiding sternotomy and
    cardiopulmonary bypass. In degenerative disease it achieves less complete
    abolition of regurgitation than surgery and is associated with worse
    long-term survival, so current evidence does not support it as a substitute
    where surgery is feasible.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: transcatheter mitral valve repair
    term:
      id: NCIT:C158019
      label: Transcatheter Mitral Valve Repair
  target_mechanisms:
  - target: Mitral Regurgitation and Left Ventricular Volume Overload
    treatment_effect: INHIBITS
    description: >-
      Leaflet approximation reduces the regurgitant orifice, though less
      completely than surgical repair.
  evidence:
  - reference: PMID:42008639
    reference_title: "Comparative Outcomes of Transcatheter Edge-to-Edge Repair and Surgical Mitral Valve Repair or Replacement for Degenerative Mitral Regurgitation: A Systematic Review, Meta-Analysis, and Trial Sequential Analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although TEER is associated with a lower risk of septicemia and may reduce
      the risk of new-onset AF, hospital stay, and ICU stay, current evidence
      doesn't support the use of TEER as a substitute for surgery
    explanation: >-
      Supports procedural advantages while explicitly declining to support
      substitution for surgery, which is why this is graded PARTIAL rather than
      SUPPORT.
  - reference: PMID:42008639
    reference_title: "Comparative Outcomes of Transcatheter Edge-to-Edge Repair and Surgical Mitral Valve Repair or Replacement for Degenerative Mitral Regurgitation: A Systematic Review, Meta-Analysis, and Trial Sequential Analysis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TEER was associated with a significantly lower rate of postoperative MR

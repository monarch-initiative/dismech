    explanation: >-
      States the continuous relationship between regurgitation severity and
      mortality.
  - reference: PMID:26258302
    reference_title: "Mutations in DCHS1 cause mitral valve prolapse."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It can manifest as mitral regurgitation and is the leading indication for

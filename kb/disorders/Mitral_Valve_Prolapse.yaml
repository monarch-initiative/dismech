  downstream:
  - target: Ventricular Electrical Instability and Sudden Cardiac Death
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Regional scar and hypertrophy provide the reentrant substrate on which
      triggered beats degenerate into malignant ventricular arrhythmia.
    hypothesis_groups:

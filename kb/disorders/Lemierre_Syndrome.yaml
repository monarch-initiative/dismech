  evidence:
  - reference: PMID:20570017
    reference_title: "[Lemierre syndrome: several clinical features of \"a forgotten disease\"]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RESULTS: We had 6 patients with LS. 5 males. Median age: 25 years old. All
      with sore throat and pulmonary embolisms.
    explanation: >-
      A six-patient clinical series illustrates the sore-throat and pulmonary
      embolism pairing that follows internal jugular septic thrombosis.
  - reference: PMID:42127655
    reference_title: "Pediatric Lemierre's syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Computed tomography (CT) imaging was utilized in 89.5% of cases, and was
      most useful for detecting thrombosis of the internal jugular vein and
      septic emboli.
    explanation: >-
      In pediatric Lemierre syndrome, CT commonly identifies the co-occurring
      vascular thrombosis and septic emboli.
  downstream:
  - target: Systemic sepsis and shock
    description: >-
      Bacteremia and metastatic emboli can progress to sepsis, thrombocytopenia,
      intensive-care-level illness, and septic shock.
    evidence:
    - reference: PMID:31843654
      reference_title: >-
        Invasive infections with Fusobacterium necrophorum including Lemierre's
        syndrome: an 8-year Swedish nationwide retrospective study.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Among patients with LS 72/96 (75%) had thrombocytopenia on admission,
        86/104 (83%) had sepsis, 19/104 (18%) developed septic shock and 45/104
        (43%) needed intensive care.
      explanation: >-
        Quantifies the major systemic complications among 104 Swedish Lemierre
        syndrome patients.

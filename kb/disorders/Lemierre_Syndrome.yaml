  - reference: PMID:41517763
    reference_title: >-
      Early diagnosis of Lemierre syndrome using targeted next-generation
      sequencing combined with metagenomics capture: A case report and literature
      review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lemierre syndrome (LS) is a rare but life-threatening complication of acute
      oropharyngeal infections.
    explanation: >-
      Places the usual initiating lesion in an acute oropharyngeal infection.
  - reference: PMID:42517948
    reference_title: >-
      Excision of the internal jugular vein in uncontrolled Lemierre's syndrome:
      a case report and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the classic form is usually associated with oropharyngeal
      infection and Fusobacterium necrophorum, odontogenic and non-Fusobacterium
      cases have also been reported.
    explanation: >-
      Supports the classic F. necrophorum/oropharyngeal source and acknowledges
      the odontogenic and non-Fusobacterium etiologic edge cases.
  downstream:
  - target: Internal jugular septic thrombophlebitis
    description: >-
      Deep neck spread from the oropharyngeal focus seeds the lateral pharyngeal
      and carotid-sheath region, where the hallmark internal-jugular septic
      thrombus forms.
    evidence:
    - reference: PMID:39840169
      reference_title: Early Radiographic Warning Signs of Impending Lemierre's Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It is characterized by the extension of infection into the lateral
        pharyngeal spaces, leading to subsequent septic thrombophlebitis of the
        internal jugular vein(s).
      explanation: >-
        Describes the anatomic progression from head and neck infection to
        internal jugular septic thrombophlebitis.
- name: Fusobacterial leukotoxin immune evasion
  description: >-
    F. necrophorum virulence is dominated by leukotoxin, with endotoxin and
    other secreted products also implicated. Bovine leukocyte experiments show
    that purified leukotoxin activates polymorphonuclear leukocytes at low
    concentrations, induces apoptotic/programmed death at higher concentrations,
    and produces necrotic death at very high concentrations; this mechanism is
    strong model support for immune evasion but the human internal-jugular
    thrombus-initiation step remains inferred.

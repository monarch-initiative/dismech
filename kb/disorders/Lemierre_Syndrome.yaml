      label: internal jugular vein
  evidence:
  - reference: PMID:39840169
    reference_title: Early Radiographic Warning Signs of Impending Lemierre's Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of Lemierre's syndrome is typically confirmed through the
      identification of thrombophlebitis of the internal jugular vein on
      radiographic imaging and the isolation of anaerobic bacteria in blood
      cultures.
    explanation: >-
      Defines internal jugular thrombophlebitis as the diagnostic vascular
      lesion in Lemierre syndrome.
  - reference: PMID:16701574
    reference_title: "Fusobacterium necrophorum infections in animals: pathogenesis and pathogenic mechanisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Several toxins or secreted products, such as leukotoxin, endotoxin,
      hemolysin, hemagglutinin, proteases, and adhesin, etc., have been
      implicated as virulence factors.
    explanation: >-
      Supports the set of F. necrophorum virulence factors that may contribute
      to the human septic-thrombophlebitis step, which remains partly inferred.
  downstream:
  - target: Pulmonary septic embolization
    description: >-
      Fragments and bacteria from the infected jugular thrombus embolize
      hematogenously, most often to the lungs.
    evidence:
    - reference: PMID:40224244
      reference_title: >-
        Lemierre's syndrome secondary to fusobacterium necrophorum in an
        immunocompetent patient: A rare case.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Lemierre syndrome is a rare and life-threatening condition that typically
        arises secondary to an oropharyngeal infection, progressing to thrombosis
        of the internal jugular vein and dissemination of septic emboli, most
        commonly to the lungs.
      explanation: >-
        Connects the oropharyngeal infection, internal-jugular thrombosis, and
        dominant lung septic-embolus destination.
- name: Pulmonary septic embolization
  description: >-
    Septic emboli seeded from the internal jugular thrombus disseminate to the
    lungs, producing the typical respiratory branch of Lemierre syndrome with
    septic pulmonary emboli, pleuritic pain, hemoptysis, and severe pleural or
    parenchymal complications in some patients.

    reference_title: >-
      Fusobacterium necrophorum infections: virulence factors, pathogenic
      mechanism and control measures.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Among these, leukotoxin and endotoxin are believed to be more important
      than other toxins in overcoming the host's defence mechanisms to establish
      the infection.
    explanation: >-
      A veterinary review identifies leukotoxin and endotoxin as the major
      F. necrophorum virulence factors that overcome host defense.
  - reference: PMID:12117974
    reference_title: >-
      Fusobacterium necrophorum leukotoxin induces activation and apoptosis of
      bovine leukocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The ability of F. necrophorum leukotoxin to modulate the host immune system
      by its toxicity, including cellular activation of PMNs and
      apoptosis-mediated killing of phagocytes and immune effector cells,
      represents a potentially important mechanism of its pathogenesis.
    explanation: >-
      Purified leukotoxin work in bovine leukocytes provides direct experimental
      support for leukotoxin-mediated phagocyte activation and killing.
- name: Internal jugular septic thrombophlebitis
  description: >-
    Infection reaching the deep neck spaces triggers a septic thrombus in the
    internal jugular vein. F. necrophorum hemagglutinin, hemolysin, proteases,
    adhesin, and endothelial injury are plausible contributors to coagulation,
    but direct human proof of platelet-driven thrombus initiation is limited.
  cell_types:

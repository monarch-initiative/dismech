name: Lemierre Syndrome
creation_date: "2026-09-25T18:58:41Z"
updated_date: "2026-09-25T18:58:41Z"
category: Infectious Disease
description: >-
  Lemierre syndrome is an acquired, life-threatening complication of head and
  neck infection in which Fusobacterium necrophorum or another oropharyngeal
  bacterial pathogen invades from the tonsillopharyngeal or odontogenic source
  to cause internal jugular vein septic thrombophlebitis, bacteremia, and
  metastatic septic emboli, most often in the lungs. It primarily affects
  adolescents and young adults and presents with fever, sore throat, septic
  pulmonary emboli, thrombocytopenia, sepsis, and sometimes septic shock.
disease_term:
  term:
    id: MONDO:0015306
    label: Lemierre syndrome
  preferred_term: Lemierre Syndrome
parents:
- bacterial infectious disease with sepsis
- commensal bacterial infectious disease
synonyms:
- Necrobacillosis
- Lemierre postanginal sepsis
- Postanginal sepsis
- Septic phlebitis of the internal jugular vein
infectious_agent:
- name: Fusobacterium necrophorum
  description: >-
    Fusobacterium necrophorum is the dominant anaerobic bacterial cause of
    Lemierre syndrome; a 143-case pediatric systematic review identified it in
    78.3% of reported patients.
  infectious_agent_term:
    preferred_term: Fusobacterium necrophorum
    term:
      id: NCBITaxon:859
      label: Fusobacterium necrophorum
  evidence:
  - reference: PMID:42127655
    reference_title: "Pediatric Lemierre's syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fever was the most common presenting symptom in 92% of patients, and F.
      necrophorum was the predominantly identified organism in 78.3% of patients.
    explanation: >-
      A pediatric systematic review identifies F. necrophorum as the predominant
      organism among 143 Lemierre syndrome cases.
pathophysiology:
- name: Oropharyngeal Fusobacterium infection
  description: >-
    Acute pharyngotonsillar infection is the usual initiating focus. F.
    necrophorum, and less often odontogenic streptococci or other anaerobes,
    invade from the upper aerodigestive tract into adjacent deep neck spaces.

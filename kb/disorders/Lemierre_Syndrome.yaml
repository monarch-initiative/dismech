treatments:
- name: Prolonged anaerobe-active antibiotic therapy
  description: >-
    Empiric and targeted treatment uses prolonged broad-spectrum antibacterial
    therapy that covers anaerobes, commonly a beta-lactam/beta-lactamase
    inhibitor or a third-generation cephalosporin combined with metronidazole;
    carbapenems are an alternative broad-spectrum regimen.
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: metronidazole
      term:
        id: CHEBI:6909
        label: metronidazole
  target_mechanisms:
  - target: Oropharyngeal Fusobacterium infection
    description: >-
      Anaerobe-active antibiotics kill or suppress the causative oropharyngeal
      F. necrophorum population and other susceptible bacterial pathogens.
  - target: Pulmonary septic embolization
    description: >-
      Systemic therapy treats bacteria disseminated in septic emboli after they
      seed the lungs.
  evidence:
  - reference: PMID:40224244
    reference_title: >-
      Lemierre's syndrome secondary to fusobacterium necrophorum in an
      immunocompetent patient: A rare case.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immediate treatment involves broad-spectrum antibiotic therapy, often
      utilizing a third-generation cephalosporin or a beta-lactam in combination
      with metronidazole.
    explanation: >-
      Describes the common broad-spectrum plus metronidazole antibiotic
      strategy for Lemierre syndrome.
  - reference: PMID:20570017
    reference_title: "[Lemierre syndrome: several clinical features of \"a forgotten disease\"]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the patients were managed with antibiotics against anaerobes,
      carbapenems in 3 cases.
    explanation: >-
      Supports anaerobe-active antibiotic coverage and includes carbapenems as
      a used broad-spectrum option.
- name: Source control drainage and salvage internal jugular surgery
  description: >-
    Drainage of abscesses supplies local source control. Internal jugular vein
    ligation or excision is a rare salvage option for persistent septicemia or
    progressive embolization despite antimicrobial therapy and source control.
  treatment_term:
    preferred_term: Incision and Drainage
    term:
      id: NCIT:C38067
      label: Incision and Drainage
  target_mechanisms:
  - target: Oropharyngeal Fusobacterium infection
    description: >-
      Drainage reduces the local bacterial burden in drainable tonsillar,
      odontogenic, or deep-neck abscesses.
  - target: Internal jugular septic thrombophlebitis
    description: >-
      Internal jugular surgery is a rare salvage maneuver that removes the
      uncontrolled infected thrombus when medical therapy and source control
      fail.
  evidence:
  - reference: PMID:39257960
    reference_title: "Lemierre Syndrome with Extensive Thrombosis: A Unique Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical treatment includes abscess drainage, while IJV ligation and
      excision are reserved for nonresponders to medical treatment.
    explanation: >-
      Describes abscess drainage as surgical source control and internal
      jugular surgery as a non-routine option after medical nonresponse.
  - reference: PMID:42517948
    reference_title: >-
      Excision of the internal jugular vein in uncontrolled Lemierre's syndrome:
      a case report and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IJV excision remains controversial and should not be considered routine
      treatment for Lemierre's syndrome.
    explanation: >-
      Clarifies that internal jugular excision is a salvage treatment rather
      than routine management.
- name: Selected adjunctive anticoagulation
  description: >-
    Anticoagulation is considered only as an adjunct for selected thrombus
    patterns or high-risk cases because its indications in Lemierre syndrome
    remain controversial.
  treatment_term:
    preferred_term: Anticoagulation Therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
  target_mechanisms:
  - target: Internal jugular septic thrombophlebitis
    description: >-
      Adjunctive anticoagulation targets thrombus propagation and is considered
      for selected extensive or high-risk thrombosis.
  evidence:
  - reference: PMID:32909436
    reference_title: >-
      Anticoagulation Strategies in the Management of Lemierre Syndrome: A
      Systematic Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anticoagulation in LS is a clinical controversy because the thromboembolic
      events have rarely led to significant complications; thrombi typically
      resolve independently, and concerns for bleeding risks are well founded;
      however, this review indicates both the efficacy and safety of
      anticoagulation.
    explanation: >-
      Supports modeling anticoagulation as a selected, debated adjunct rather
      than universal treatment.

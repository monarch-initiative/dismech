genetic:
- name: ARF3
  gene_term:
    preferred_term: ARF3
    term:
      id: hgnc:654
      label: ARF3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    ARF3 (12q13.12) encodes ADP-ribosylation factor 3, a class I ARF small
    GTPase that shares 96% amino-acid identity with ARF1. All reported
    disease variants are de novo heterozygous missense changes. Variants
    reported to date include p.Leu12Val with p.Asp67Val in cis, p.Thr32Asn,
    p.Pro47Ser, p.Asp67Val, p.Asp93Asn, p.Arg99Leu and p.Lys127Glu (on
    NM_001659), with further variants in the 2026 follow-up series. Variant
    records below cover the alleles with a published per-allele clinical or
    functional description that can be quoted; p.Thr32Asn, p.Pro47Ser and the
    p.Leu12Val/p.Asp67Val haplotype are characterised in the pathophysiology
    node's genetic_context instead. ARF1, its closest paralog, causes a
    clinically similar disorder. A heterozygous ARF3 nonsense allele
    (p.Arg99*) inherited from a clinically unaffected parent has been reported
    as a secondary finding in a child with Bosch-Boonstra-Schaaf optic atrophy
    syndrome (PMID:42606787); a single carrier does not establish whether ARF3
    haploinsufficiency is tolerated.
  evidence:
  - reference: PMID:36369169
    reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report that de novo missense variants in ARF3, encoding a small GTPase regulating Golgi dynamics, cause a developmental disease in humans impairing nervous system and skeletal formation."
    explanation: Gene-disease report with five individuals and functional validation.
  - reference: PMID:34346499
    reference_title: "De novo ARF3 variants cause neurodevelopmental disorder with brain abnormality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We here report the clinical and genetic evaluations of two unrelated children with de novo pathogenic variants in the ARF3 gene: c.200A > T (p.Asp67Val) and c.296G > T (p.Arg99Leu)."
    explanation: Independent gene-disease report.
  - reference: PMID:41507605
    reference_title: "Newly identified ARF3 variants strengthen the causal link between Golgi fragmentation and brain malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report clinical features of five additional patients and the functional characterization of three novel ARF3 variants."
    explanation: Five further patients extend the cohort.
  variants:
  - name: p.Asp67Val
    description: >-
      NM_001659.2:c.200A>T, p.Asp67Val. Reported de novo in a child with
      severe microcephaly, diffuse brain atrophy and epilepsy, again in a
      patient with acquired microcephaly, drug-resistant epilepsy and a
      Z-shaped brainstem, and in cis with p.Leu12Val in a further severely
      affected child. Shows a dispersed cytosolic and Golgi pattern like the
      dominant-negative p.Thr31Asn mutant, is lethal when expressed in flies,
      and has reduced GTP-bound levels.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:38712921
      reference_title: "Neurodevelopmental disorder associated with gene ARF3: A case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole-exome sequencing uncovered a pathogenic variant in the ARF3 gene c.200A>T, p.(Asp67Val)."
      explanation: Recurrence of the allele in an independent patient, classified pathogenic.
    - reference: PMID:34346499
      reference_title: "De novo ARF3 variants cause neurodevelopmental disorder with brain abnormality."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Pull-down assays revealed that the p.Asp67Val had a loss-of-function effect and the p.Arg99Leu variant had increased binding of the adaptor protein, Golgi-localized, γ-adaptin ear-containing, ARF-binding protein 1 (GGA1), supporting the gain of function."
      explanation: Functional evidence of a loss-of-function effect.
  - name: p.Arg99Leu
    description: >-
      NM_001659:c.296G>T, p.Arg99Leu. Reported de novo in a child with
      developmental delay, epilepsy and cerebellar hypoplasia. Localises
      normally to the Golgi but binds GGA1 more strongly and produces a rough
      eye in flies like the activating p.Gln71Leu mutant, consistent with gain
      of function.
    evidence:
    - reference: PMID:34346499
      reference_title: "De novo ARF3 variants cause neurodevelopmental disorder with brain abnormality."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, flies expressing p.Arg99Leu had abnormal rough eye, as observed in the gain-of-function variant p.Gln71Leu."
      explanation: In vivo fly evidence of gain-of-function behaviour.
  - name: p.Lys127Glu
    description: >-
      NM_001659.2:c.379A>G, p.Lys127Glu, in the NKXD guanine-nucleotide binding
      motif. Reported de novo in a girl with the most severe phenotype
      (growth restriction, severe microcephaly, progressive cortical atrophy,
      pontine hypoplasia, seizures, profound developmental delay, eleven rib
      pairs, severe scoliosis, inguinal hernia and congenital heart defects).
      The corresponding Lys127Glu substitution has been reported in ARF1 in a
      patient with a similar disorder.
    evidence:
    - reference: PMID:36369169
      reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "trio-based exome sequencing allowed us to identify a previously unreported de novo ARF3 variant, c.379A>G (p.Lys127Glu; NM_001659.2), as the putative disease-causing event in a girl (Subject 1) with a severe syndromic neurodevelopmental disorder"
      explanation: Identification of the allele in the most severely affected individual.
    - reference: PMID:36369169
      reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "Among these, the same Lys-to-Glu substitution at codon 127 in Subject 1 was recently reported to affect the corresponding residue in ARF1 in a patient with DD, microcephaly, periventricular heterotopia, progressive cerebral atrophy, and epilepsy"
      explanation: Sources the ARF1 parallel for this allele.
  - name: p.Asp93Asn
    description: >-
      p.Asp93Asn. Reported de novo in a child with hypotonia, severe
      developmental delay, postnatal microcephaly, thin corpus callosum and
      milder skeletal defects. Stabilises the GTP-bound conformation
      (activating behaviour) and produces late-onset microcephaly in zebrafish.
    evidence:
    - reference: PMID:36369169
      reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Altogether, these data suggest a stabilized GTP-bound conformation and an overall hyperactive behavior for ARF3D93N and, to a minor extent, ARF3P47S, while a DN behavior could be established for the ARF3T32N variant."
      explanation: Classifies p.Asp93Asn as activating.
diagnosis:
- name: Exome sequencing
  description: >-
    Diagnosis rests on identifying a de novo heterozygous ARF3 missense
    variant, in practice by trio exome sequencing, in a child with
    developmental delay, microcephaly and brain anomalies. A Z-shaped
    brainstem on MRI has been proposed as a clue that should bring ARF3 into
    the differential diagnosis.
  diagnosis_term:
    preferred_term: trio exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:38712921
    reference_title: "Neurodevelopmental disorder associated with gene ARF3: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In cases where a Z-shaped morphology of the brainstem is observed, ARF3-associated disorder should be included in the list of differential diagnoses."
    explanation: Imaging clue for the diagnosis.
  - reference: PMID:38712921
    reference_title: "Neurodevelopmental disorder associated with gene ARF3: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing uncovered a pathogenic variant in the ARF3 gene c.200A>T, p.(Asp67Val)."
    explanation: Molecular diagnosis by exome sequencing.
animal_models:
- name: Zebrafish expressing human ARF3 disease variants
  species: Zebrafish
  genotype: Injection of mRNA encoding human ARF3 missense variants (p.Lys127Glu, p.Leu12Val/p.Asp67Val, p.Pro47Ser, p.Asp93Asn, p.Thr32Asn)
  description: >-
    Transient overexpression of patient alleles in one-cell zebrafish embryos.
    The model reproduces microcephaly, Golgi fragmentation and axial
    malformations with an allele-dependent severity matching the patients,
    while morpholino knockdown of arf3a/arf3b produces a much milder
    phenotype, supporting a dominant mechanism.
  publication: PMID:36369169
  modeled_mechanisms:
  - target: Increased Neural Precursor Cell Death
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Forebrain cell death and reduced head size in embryos expressing the severe alleles.
    limitations: >-
      Transient mRNA overexpression in embryos, not a germline knock-in at
      physiological dosage; zebrafish has two arf3 paralogs and lacks the
      human cortical progenitor compartments.
    evidence:
    - reference: PMID:36369169
      reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Strikingly, similar to patients, overexpression of ARF3K127E and ARF3L12V/D67V produce early-onset severe microcephaly in fish, while fish expressing ARF3D93N show late-onset microcephaly."
      explanation: The model reproduces the allele-specific microcephaly of the patients.
  - target: Defective Planar Cell Polarity-dependent Convergent Extension
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Notochord curvatures and convergence-extension defects.
    limitations: >-
      Notochord bending in embryos is a developmental correlate of, not the
      same lesion as, human scoliosis.
    evidence:
    - reference: PMID:36369169
      reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Overall, all mutants except ARF3P47S showed a significantly higher number of notochord curvatures"
      explanation: Axial defects in the model.
  - target: Golgi Fragmentation and COPI Vesicle Dysregulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Golgi integrity is disrupted in embryos expressing the variants.
    limitations: >-
      Overexpression on top of endogenous arf3a/arf3b rather than a
      heterozygous germline allele.
    evidence:
    - reference: PMID:41507605
      reference_title: "Newly identified ARF3 variants strengthen the causal link between Golgi fragmentation and brain malformations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "ARF3 mutants significantly affected Golgi integrity in vivo as well as brain size, recapitulating patients' microcephaly."
      explanation: In vivo Golgi disruption in the model.
  - target: Aberrant Mitotic Spindle and Reduced Neural Precursor Proliferation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Reduced mitotic precursors and abnormal spindles in the forebrain proliferative zone.
    limitations: >-
      Zebrafish forebrain lacks the human outer subventricular zone progenitor
      populations, so the proliferative defect may differ in human cortex.
    evidence:
    - reference: PMID:36369169
      reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The number of pH3+ cells within this region was significantly reduced in embryos expressing ARF3K127E; a similar trend was observed for ARF3L12V/D67V and ARF3D93N expressing fish"
      explanation: Reduced precursor proliferation in the model.
- name: Drosophila expressing human ARF3 variants
  species: Fruit fly
  genotype: Transgenic expression of human ARF3 p.Asp67Val or p.Arg99Leu
  description: >-
    In vivo expression of the two variants from the first report. p.Asp67Val
    is lethal, like a loss-of-function allele, while p.Arg99Leu produces a
    rough eye like the activating p.Gln71Leu mutant, supporting opposite
    functional classes for the two alleles.
  publication: PMID:34346499
  modeled_mechanisms:
  - target: Dysregulated ARF3 GTP/GDP Cycling
    relationship: PERTURBS
    fidelity: LOW
    model_scale: ORGANISM
    description: Organism-level readouts (lethality, eye morphology) that classify each allele's functional direction.
    limitations: >-
      Overexpression in flies reports allele behaviour through lethality and
      eye roughness, not through any neurodevelopmental or Golgi readout
      comparable to the human disease.
    evidence:
    - reference: PMID:34346499
      reference_title: "De novo ARF3 variants cause neurodevelopmental disorder with brain abnormality."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, in vivo studies revealed that p.Asp67Val transfection led to lethality in flies."
      explanation: Lethality in flies for the putative loss-of-function allele.
    - reference: PMID:34346499
      reference_title: "De novo ARF3 variants cause neurodevelopmental disorder with brain abnormality."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, flies expressing p.Arg99Leu had abnormal rough eye, as observed in the gain-of-function variant p.Gln71Leu."
      explanation: Gain-of-function-like phenotype for p.Arg99Leu.

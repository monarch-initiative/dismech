name: ARF3-related Neurodevelopmental Disorder
creation_date: "2026-10-15T20:00:00Z"
category: Mendelian
description: >-
  ARF3-related neurodevelopmental disorder is a rare Golgipathy caused by
  heterozygous de novo missense variants in ARF3, which encodes a class I
  ADP-ribosylation factor small GTPase that works mainly at the trans-Golgi
  network, where it recruits coat and adaptor proteins to budding carrier
  vesicles and supports endosomal recycling. Affected children show
  developmental delay or intellectual disability of variable severity together
  with brain anomalies; microcephaly (congenital or postnatal) and progressive
  cerebral atrophy occur in most, and epilepsy, thin or hypoplastic corpus
  callosum, white matter reduction, pontocerebellar and brainstem hypoplasia and
  skeletal defects (scoliosis, rib anomalies) occur variably. Most variants sit
  in or near the guanine nucleotide binding pocket and act dominantly, either
  as dominant-negative (GDP-locked-like) or as activating (GTP-locked-like)
  alleles, and both classes fragment the Golgi; the dominant-negative class is
  associated with the most severe disease. Around a dozen affected individuals
  have been reported.
synonyms:
- ARF3-related Golgipathy
- ARF3-associated neurodevelopmental disorder
disease_term:
  preferred_term: ARF3-related neurodevelopmental disorder
  term:
    id: MONDO:0700366
    label: ARF3-related neurodevelopmental disorder
parents:
- Mendelian neurodevelopmental disorder
- Golgipathy
notes: >-
  No GeneReviews or StatPearls chapter exists for this disorder. ClinGen has
  not published a gene-disease validity classification for ARF3, so
  gene_disease_validity is absent. Phenotype frequencies are omitted because the
  reported series are too small to support the frequency bands: two children
  in the first report, five in the second, one further case report, and five
  more patients whose individual features are given only in the full text of
  the 2026 follow-up. No disease-specific treatment has been reported, so the
  treatments section is absent.
inheritance:
- name: Autosomal dominant, de novo
  description: >-
    All reported variants arose de novo in heterozygous individuals. Expression
    of the variants in zebrafish reproduces the human phenotype while knockdown
    of the endogenous arf3 paralogs produces only a milder, dose-dependent
    phenotype with no severely affected embryos, which points to a dominant
    (dominant-negative or activating) mechanism rather than haploinsufficiency.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:36369169
    reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report that de novo missense variants in ARF3, encoding a small GTPase regulating Golgi dynamics, cause a developmental disease in humans impairing nervous system and skeletal formation."
    explanation: Establishes de novo heterozygous missense variants as the cause.
  - reference: PMID:34346499
    reference_title: "De novo ARF3 variants cause neurodevelopmental disorder with brain abnormality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We here report the clinical and genetic evaluations of two unrelated children with de novo pathogenic variants in the ARF3 gene: c.200A > T (p.Asp67Val) and c.296G > T (p.Arg99Leu)."
    explanation: Independent report of de novo ARF3 variants in two unrelated children.
  - reference: PMID:36369169
    reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Disease modeling in zebrafish validates further the dominant behavior of the mutants and their differential impact on brain and body plan formation, recapitulating the variable disease expression."
    explanation: Zebrafish expression of the patient alleles supports a dominant mode of action.
pathophysiology:
- name: ARF3 Missense Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous de novo missense variants in ARF3. With the exception of
    Leu12, the affected residues (Thr32, Pro47, Asp67, Asp93, Arg99, Lys127)
    cluster in or near the guanine nucleotide binding pocket, including the
    switch 1 region and the NKXD motif, at positions whose equivalents in other
    RAS-superfamily GTPases are mutated in human disease.
  genes:
  - preferred_term: ARF3
    term:
      id: hgnc:654
      label: ARF3
  molecular_functions:
  - preferred_term: GTPase activity
    term:
      id: GO:0003924
      label: GTPase activity
    modifier: DYSREGULATED
  - preferred_term: GTP binding
    term:
      id: GO:0005525
      label: GTP binding
    modifier: DYSREGULATED
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      De novo heterozygous missense alleles. The functional class differs by
      allele, so no single functional_impact_category applies: p.Thr32Asn,
      p.Lys127Glu and p.Leu12Val/p.Asp67Val behave as dominant-negative or
      destabilised alleles with reduced GTP-bound protein, while p.Asp93Asn,
      p.Pro47Ser and p.Arg99Leu behave as activating alleles.
  evidence:
  - reference: PMID:36369169
    reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Microcephaly-associated ARF3 variants affect residues within the guanine nucleotide binding pocket and variably perturb protein stability and GTP/GDP binding."
    explanation: Locates the disease variants in the nucleotide-binding pocket.
  downstream:
  - target: Dysregulated ARF3 GTP/GDP Cycling
    causal_link_type: DIRECT
    description: Pocket-region substitutions alter nucleotide binding and protein stability.
    evidence:
    - reference: PMID:41507605
      reference_title: "Newly identified ARF3 variants strengthen the causal link between Golgi fragmentation and brain malformations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cell-based assays corroborate a deleterious, variant-specific effect on protein stability, GTP binding and Golgi morphology."
      explanation: Direct cell-based evidence that the variants change protein stability and GTP binding.
- name: Dysregulated ARF3 GTP/GDP Cycling
  biological_scale: MOLECULAR
  description: >-
    ARF3 cycles between an inactive GDP-bound and an active, membrane-bound
    GTP-bound form under the control of ARF guanine nucleotide exchange factors
    and GTPase-activating proteins. The disease variants push this switch in
    one of two directions: some lower the GTP-bound fraction and destabilise the
    protein (dominant-negative behaviour), while others stabilise the GTP-bound
    conformation or increase effector binding (activating behaviour), as shown
    for increased GGA1 adaptor binding by p.Arg99Leu.
  molecular_functions:
  - preferred_term: GTPase activity
    term:
      id: GO:0003924
      label: GTPase activity
    modifier: DYSREGULATED
  - preferred_term: GTP binding
    term:
      id: GO:0005525
      label: GTP binding
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:36456556
    reference_title: "Golgipathies reveal the critical role of the sorting machinery in brain and skeletal development."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: IN_VITRO
    snippet: "Interestingly, most variants target the GDP/GTP binding pocket of ARF3 by which ARF Guanine Nucleotide Exchange Factors (ARFGEFs) and ARF GTPase Activating Proteins (ARFGAPs) control its activation state, and these de novo variants appear to induce either blockage or maintenance of ARF3 activation."
    explanation: Summarises the two opposite effects of the variants on the ARF3 activation switch.
  - reference: PMID:20357002
    reference_title: "Arf3 is activated uniquely at the trans-Golgi network by brefeldin A-inhibited guanine nucleotide exchange factors."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Unlike other Golgi-localized Arfs, Arf3 associates selectively with membranes of the trans-Golgi network (TGN) in a manner that is both temperature-sensitive and uniquely dependent on guanine nucleotide exchange factors of the BIGs family."
    explanation: Background on the normal GEF-dependent recruitment of ARF3 to the TGN, the activation step the disease variants disturb.
  - reference: PMID:36369169
    reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Altogether, these data suggest a stabilized GTP-bound conformation and an overall hyperactive behavior for ARF3D93N and, to a minor extent, ARF3P47S, while a DN behavior could be established for the ARF3T32N variant."
    explanation: Biochemical classification of individual alleles as activating or dominant-negative.
  - reference: PMID:34346499
    reference_title: "De novo ARF3 variants cause neurodevelopmental disorder with brain abnormality."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Pull-down assays revealed that the p.Asp67Val had a loss-of-function effect and the p.Arg99Leu variant had increased binding of the adaptor protein, Golgi-localized, γ-adaptin ear-containing, ARF-binding protein 1 (GGA1), supporting the gain of function."
    explanation: Independent biochemical evidence for opposite functional classes among the variants.
  downstream:
  - target: Golgi Fragmentation and COPI Vesicle Dysregulation
    causal_link_type: DIRECT
    description: >-
      Both dominant-negative and activating alleles disrupt Golgi morphology,
      producing distinct fragmentation patterns that resemble those of the
      classical GDP-locked and GTP-locked ARF mutants.
    evidence:
    - reference: PMID:36369169
      reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The Golgi morphotype analysis established the presence of different functional classes of disease-causing ARF3 mutants, broadly ascribing to a DN or CA mechanism."
      explanation: Ties each functional class of variant to a characteristic Golgi morphology.
    - reference: PMID:34346499
      reference_title: "De novo ARF3 variants cause neurodevelopmental disorder with brain abnormality."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These data indicate that two ARF3 variants, the possibly loss-of-function p.Asp67Val and the gain-of-function p.Arg99Leu, both impair the Golgi transport system."
      explanation: Shows that alleles of opposite functional class converge on impaired Golgi transport.
- name: Golgi Fragmentation and COPI Vesicle Dysregulation
  biological_scale: CELLULAR
  description: >-
    Cells expressing the variants lose normal trans-Golgi integrity. Strongly
    dominant-negative alleles (p.Lys127Glu, p.Leu12Val/p.Asp67Val) disassemble
    COPI vesicles, whereas activating alleles (p.Pro47Ser, p.Asp93Asn) expand
    the COPI compartment. Golgi fragmentation is also seen in zebrafish embryos
    expressing the variants.
  biological_processes:
  - preferred_term: Golgi organization
    term:
      id: GO:0007030
      label: Golgi organization
    modifier: ABNORMAL
  - preferred_term: Golgi vesicle transport
    term:
      id: GO:0048193
      label: Golgi vesicle transport
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:36369169
    reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analysis demonstrates variably disruptive consequences of ARF3 variants on Golgi morphology, vesicles assembly and trafficking."
    explanation: Direct evidence of disrupted Golgi morphology and vesicle assembly in cells expressing the variants.
  - reference: PMID:36369169
    reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Differently, a large number of cells expressing ARF3P47S and ARF3D93N showed an expanded β-COP signal, which is indicative of an enlarged COP-I compartment."
    explanation: Shows the expanded COPI compartment produced by the activating alleles.
  - reference: PMID:41507605
    reference_title: "Newly identified ARF3 variants strengthen the causal link between Golgi fragmentation and brain malformations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ARF3 mutants significantly affected Golgi integrity in vivo as well as brain size, recapitulating patients' microcephaly."
    explanation: Confirms Golgi disruption in vivo in zebrafish for newly identified variants.
  downstream:
  - target: Impaired Endocytic Cargo Recycling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Alongside the structural effect on the Golgi, the variants impair the
      post-Golgi role of ARF3 in recycling cargo through endosomes. The source
      presents the two as parallel consequences of the variants, so a causal
      dependence of the recycling defect on Golgi fragmentation is inferred.
    evidence:
    - reference: PMID:36456556
      reference_title: "Golgipathies reveal the critical role of the sorting machinery in brain and skeletal development."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: IN_VITRO
      snippet: "The expression of the variants disorganizes the structural morphology of the GC and the formation of COP-I vesicles at the cis face of the Golgi, but also impacts the post-Golgi function of ARF3 in cargo recycling through the endosomal compartments, judging by significant delays in transferrin recycling and accumulation of unrecycled transferrin in lysosomes."
      explanation: Links the Golgi disorganisation to the downstream endosomal recycling defect.
  - target: Aberrant Mitotic Spindle and Reduced Neural Precursor Proliferation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The Golgi contributes to spindle formation and cell-cycle progression;
      altered spindle morphology was seen in the forebrain of zebrafish
      expressing microcephaly-causing variants. Which Golgi function links the
      two has not been established.
    evidence:
    - reference: PMID:36369169
      reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "On the other hand, our live imaging of the developing fish forebrain determined the occurrence of altered spindle morphology in microcephaly-causing ARF3 mutants, which might ultimately underlie mitotic arrest and cell death."
      explanation: The authors propose the spindle defect as the route from mutant ARF3 to precursor loss; the intermediate step is not shown.
    - reference: PMID:36369169
      reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: IN_VITRO
      snippet: "Last, given the importance of Golgi for the establishment and the dynamics of mitotic spindles in dividing precursors"
      explanation: The rationale linking Golgi integrity to spindle formation, as stated by the authors.
  - target: Defective Planar Cell Polarity-dependent Convergent Extension
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Golgi trafficking of polarity factors is needed for planar cell polarity;
      the earliest axial effect of the variants in zebrafish is impaired
      PCP-dependent cell motility.
    evidence:
    - reference: PMID:36369169
      reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Morphometric and live imaging analysis in early embryonic stages traced back the first assessable effect to defective PCP-mediated cell motility."
      explanation: Places the PCP defect as the earliest consequence of the variants in vivo; the Golgi-to-PCP link is inferred.
  - target: Cerebral white matter atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Zebrafish expressing the variants show reduced telencephalic white
      matter, which the authors read as the model counterpart of the white
      matter loss in patients.
    evidence:
    - reference: PMID:36369169
      reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Altogether, the morphometric parameters measured in vivo are consistent with the variable degree of impaired brain development as a distinctive feature of the disease and support the occurrence of telencephalic white matter defects as a common trait of this new Golgipathy."
      explanation: Fish morphometry links the variants to white matter defects; the cellular route from Golgi disruption is not resolved.
- name: Impaired Endocytic Cargo Recycling
  biological_scale: CELLULAR
  description: >-
    ARF3 preferentially localises to the trans-Golgi network and is
    specifically involved in endosomal recycling. Cells expressing the variants
    associated with early-onset microcephaly and severe skeletal disease show
    accumulation and delayed recycling of transferrin, and most variants (not
    p.Pro47Ser) increase transferrin delivery to lysosomes. The contribution of this recycling defect
    to the brain phenotype in vivo has not been tested.
  biological_processes:
  - preferred_term: endocytic recycling
    term:
      id: GO:0032456
      label: endocytic recycling
    modifier: DECREASED
  evidence:
  - reference: PMID:36369169
    reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Of note, our experiments with fluorescently labeled Tfn in combination with staining for EE, RE, and lysosomes unravel a cargo accumulation and delayed recycling in cells expressing ARF3 mutants specifically leading to early-onset microcephaly and severe skeletal defects."
    explanation: Direct cell-based evidence of delayed transferrin recycling with the severe alleles.
  - reference: PMID:36456556
    reference_title: "Golgipathies reveal the critical role of the sorting machinery in brain and skeletal development."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: IN_VITRO
    snippet: "ARF1 share 96% aminoacid identity with ARF3 and it is assumed that their functions are partially interchangeable throughout the GC although studies have shown that ARF3 preferentially localizes to the TGN and is more specifically involved in the endosomal recycling pathway while ARF1 functions to both the cis and trans sides of the GC"
    explanation: Background on the normal TGN and recycling role of ARF3 that the variants disturb.
- name: Aberrant Mitotic Spindle and Reduced Neural Precursor Proliferation
  biological_scale: CELLULAR
  description: >-
    In the forebrain proliferative zone of zebrafish expressing the variants,
    mitotic precursors are reduced and accumulate in early mitosis, spindles
    are abnormally elongated, and proliferating cells are mispositioned.
    Impaired neural precursor proliferation is the earliest brain effect
    detected.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: neural precursor cell proliferation
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
    modifier: DECREASED
  - preferred_term: mitotic spindle organization
    term:
      id: GO:0007052
      label: mitotic spindle organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:36369169
    reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In-depth in vivo analyses traces back impaired neural precursors' proliferation and planar cell polarity-dependent cell movements as the earliest detectable effects."
    explanation: Identifies impaired neural precursor proliferation as an earliest in vivo effect.
  - reference: PMID:36369169
    reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The number of pH3+ cells within this region was significantly reduced in embryos expressing ARF3K127E; a similar trend was observed for ARF3L12V/D67V and ARF3D93N expressing fish"
    explanation: Quantitative reduction of mitotic precursors in the forebrain proliferative zone.
  downstream:
  - target: Increased Neural Precursor Cell Death
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Precursors that fail to progress through mitosis are proposed to be
      removed by mitotic surveillance, depleting the progenitor pool.
    evidence:
    - reference: PMID:36369169
      reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "On the other hand, our live imaging of the developing fish forebrain determined the occurrence of altered spindle morphology in microcephaly-causing ARF3 mutants, which might ultimately underlie mitotic arrest and cell death."
      explanation: The authors' proposed causal step from spindle defect to cell death; stated as a possibility.
- name: Increased Neural Precursor Cell Death
  biological_scale: CELLULAR
  description: >-
    Cell death is increased in the developing forebrain of zebrafish
    expressing the most severe alleles (p.Lys127Glu, p.Leu12Val/p.Asp67Val),
    and over a wider forebrain area for p.Pro47Ser and p.Asp93Asn, depleting
    the precursor pool available for brain growth.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: cell death
    term:
      id: GO:0008219
      label: cell death
    modifier: INCREASED
  evidence:
  - reference: PMID:36369169
    reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The analysis showed a significant increase of AO+ spots (i.e., dying cells and/or apoptotic bodies) in ARF3K127E and ARF3L12V/D67V expressing fish"
    explanation: Direct measurement of increased forebrain cell death in fish expressing the severe alleles.
  downstream:
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of neural precursors reduces brain growth; the severity of the fish
      head-size defect tracks the severity of microcephaly in the patients
      carrying the same alleles.
    evidence:
    - reference: PMID:36369169
      reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Strikingly, similar to patients, overexpression of ARF3K127E and ARF3L12V/D67V produce early-onset severe microcephaly in fish, while fish expressing ARF3D93N show late-onset microcephaly."
      explanation: The alleles that cause precursor death produce microcephaly in fish that matches the patients; the step from cell death to head size is inferred.
  - target: Secondary microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The activating p.Asp93Asn allele produces late-onset microcephaly in
      fish, matching the postnatal microcephaly of the patient carrying it.
    evidence:
    - reference: PMID:36369169
      reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Strikingly, similar to patients, overexpression of ARF3K127E and ARF3L12V/D67V produce early-onset severe microcephaly in fish, while fish expressing ARF3D93N show late-onset microcephaly."
      explanation: Allele-specific late-onset microcephaly in fish mirrors the patient; the intermediate steps are inferred.
- name: Defective Planar Cell Polarity-dependent Convergent Extension
  biological_scale: TISSUE
  description: >-
    Zebrafish embryos expressing the variants show shortened
    anterior-posterior axes, abnormal convergence-extension indices and
    notochord curvatures, which the authors trace to defective planar cell
    polarity-dependent cell movements. This axial defect is the model
    correlate of the scoliosis and rib anomalies seen in patients, and its
    severity tracks the severity of the patients' skeletal involvement.
  biological_processes:
  - preferred_term: convergent extension
    term:
      id: GO:0060026
      label: convergent extension
    modifier: ABNORMAL
  evidence:
  - reference: PMID:36369169
    reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overall, all mutants except ARF3P47S showed a significantly higher number of notochord curvatures"
    explanation: Quantified axial (notochord) defects in fish expressing the variants.
  downstream:
  - target: Scoliosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The axial defects in fish are proposed as the counterpart of the human
      skeletal phenotype, with the same alleles most severe in both.
    evidence:
    - reference: PMID:36369169
      reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Likewise in patients, similar defects are associated with DN and CA mutations, with p.K127E and p.L12V/D67V producing the most severe effects."
      explanation: Correlates allele severity of fish axial defects with patients' skeletal severity; the developmental route to human scoliosis is inferred.
  - target: 11 pairs of ribs
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The rib anomaly belongs to the same skeletal involvement that the fish
      axial defects are proposed to model.
    evidence:
    - reference: PMID:36369169
      reference_title: "Dominant ARF3 variants disrupt Golgi integrity and cause a neurodevelopmental disorder recapitulated in zebrafish."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Lastly, strengthening the causal association of the described ARF3 mutations to the observed skeletal traits, variable degrees of axial malformations have been highlighted in the generated fish models recapitulating the severity of the disease in humans."
      explanation: Fish axial malformations are presented as the model of the human skeletal traits, including the rib anomaly; the specific route is inferred.

- name: Nocardia Tetrahydrofolate Synthesis (TMP-SMX Target)
  description: >-
    Trimethoprim-sulfamethoxazole inhibits two sequential Nocardia folate-pathway
    steps, bacterial dihydropteroate synthase and dihydrofolate reductase,
    thereby blocking tetrahydrofolate synthesis and supporting the standard
    co-trimoxazole backbone used for treatment and prophylaxis.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_folate_synthesis_inhibition#Bacterial Tetrahydrofolate Synthesis (Antifolate Target)"
  biological_processes:
  - preferred_term: tetrahydrofolate biosynthetic process
    term:
      id: GO:0046654
      label: tetrahydrofolate biosynthetic process
  evidence:
  - reference: PMID:23627736
    reference_title: "Sulfa and trimethoprim-like drugs - antimetabolites acting as carbonic anhydrase, dihydropteroate synthase and dihydrofolate reductase inhibitors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The other two enzyme families are involved in the synthesis of
      tetrahydrofolate (THF), i.e. dihydropteroate synthase (DHPS) and
      dihydrofolate reductase.
    explanation: Review support for the bacterial DHPS and DHFR folate-synthesis steps targeted by TMP-SMX.
  - reference: PMID:37527397
    reference_title: "Phenotypic and genotypic analysis of antimicrobial resistance in Nocardia species."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Linezolid was active against all isolates, followed by
      trimethoprim/sulfamethoxazole (93%) and amikacin (91%).
    explanation: Clinical isolate susceptibility supports TMP-SMX as an active Nocardia-directed agent.
- name: Nocardia Ribosomal Translation (Linezolid and Amikacin Target)
  description: >-
    Nocardia require bacterial 70S ribosomal translation; linezolid and amikacin
    target that conserved ribosome through the 50S and 30S subunits,
    respectively, providing highly active severe-disease or resistant-disease
    options when susceptibility testing supports their use.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: "Ribosome-targeting antibiotics and mechanisms of bacterial resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The ribosome is one of the main antibiotic targets in the bacterial cell."
    explanation: Review support for the conserved bacterial ribosomal target of linezolid and amikacin.
  - reference: PMID:37527397
    reference_title: "Phenotypic and genotypic analysis of antimicrobial resistance in Nocardia species."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Linezolid was active against all isolates, followed by
      trimethoprim/sulfamethoxazole (93%) and amikacin (91%).
    explanation: Clinical isolate susceptibility supports linezolid and amikacin as highly active Nocardia-directed agents.

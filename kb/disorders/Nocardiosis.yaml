name: Nocardiosis
creation_date: '2026-09-25T00:00:00Z'
category: Infectious Disease
description: >-
  Nocardiosis is an opportunistic bacterial infection caused by environmental
  Nocardia species acquired through inhalation or traumatic skin inoculation.
  Disease most often begins in the lung, where weakly acid-fast actinomycetes
  survive as intracellular pathogens in phagocytes, but can disseminate
  hematogenously to the brain, skin, and other organs. Impaired cell-mediated
  immunity - most often iatrogenic, from corticosteroids and other
  immunosuppression - is the pivotal host factor separating containment from
  dissemination. Clinical disease ranges from cutaneous actinomycetoma to
  pulmonary nodular, consolidative, or cavitary infection and central nervous
  system abscesses. Management is species- and susceptibility-guided and
  typically relies on prolonged trimethoprim-sulfamethoxazole-based therapy,
  with linezolid, amikacin, carbapenems, and surgical drainage used in severe or
  central nervous system disease.

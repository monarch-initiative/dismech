environmental:
- name: Iatrogenic immunosuppression
  description: >-
    Corticosteroids, calcineurin inhibitors, and other immunosuppression impair
    the cell-mediated immunity that contains Nocardia, and are the most common
    predisposing context for nocardiosis, especially in solid-organ transplant
    recipients.
  influences_mechanisms:
  - target: Impaired Cell-Mediated Immunity
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Corticosteroid and other immunosuppressive therapy blunts cell-mediated
      immunity, the pivotal host defense against Nocardia.
    evidence:
    - reference: PMID:35700710
      reference_title: "Clinical Characteristics and Treatment Outcome of Central Nervous System Nocardiosis: A Systematic Review of Reported Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Corticosteroid use was the most common predisposing factor (55.8%)."
      explanation: Corticosteroid use is the most common predisposing factor in CNS nocardiosis.
  evidence:
  - reference: PMID:39254072
    reference_title: "Pulmonary Nocardiosis in Renal Transplant Recipients From Pakistan: Risk Factors, Clinical Presentation, and Mortality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High-dose methylprednisolone and presence of cytomegalovirus infection
      within 90 days of disease development were independent risk factors for
      Nocardia infection.
    explanation: Identifies high-dose corticosteroid and CMV as independent risk factors in transplant recipients.

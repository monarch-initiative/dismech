  title: "Triple-drug antibiotic therapy for disseminated nocardial abscess in the mediastinum and brain of an immunocompetent patient: a case report."
  found_in:
  - Nocardiosis-deep-research-openscientist.md
  findings:
  - statement: >-
      Environmental Nocardia can enter through the respiratory tract or broken
      skin and then spread hematogenously.
    supporting_text: >-
      Nocardia are widely present in nature and considered opportunistic
      pathogens. They can result in hematogenous spread infection through the
      ruptured skin or respiratory tract when the host's immune system is
      compromised.
- reference: PMID:41319540
  title: "Clinical characteristics and outcomes of nocardiosis: A retrospective analysis of 44 cases."
  found_in:
  - Nocardiosis-deep-research-openscientist.md
  findings:
  - statement: >-
      In a 44-case retrospective series, pulmonary nocardiosis was the dominant
      presentation and about one third of cases disseminated.
    supporting_text: >-
      Of the 44 cases, pulmonary infection was identified in 28 cases,
      disseminated infection in 13 cases, and extrapulmonary single-organ
      infection in 3 cases.
- reference: PMID:35700710
  title: "Clinical Characteristics and Treatment Outcome of Central Nervous System Nocardiosis: A Systematic Review of Reported Cases."
  found_in:
  - Nocardiosis-deep-research-openscientist.md
  findings:
  - statement: >-
      CNS nocardiosis usually presents as brain abscess and carries substantial
      fatality despite combined antimicrobial and surgical treatment.
    supporting_text: >-
      Among neuroimaging findings, brain abscess was most common (86.9%),
      followed by leptomeningeal enhancement (12.1%).
- reference: PMID:33956121
  title: "Nitric oxide determines the development of actinomycetoma by Nocardia brasiliensis in eNOS knockout C57BL/6 mice."
  found_in:
  - Nocardiosis-deep-research-openscientist.md
  findings:
  - statement: >-
      Nocardia brasiliensis actinomycetoma models link Nocardia proteases and
      immunosuppressive metabolites to tissue damage and local immune evasion.
    supporting_text: >-
      Nocardia brasiliensis produces proteases that may play a role in tissue
      damage, as well as immunosuppressive molecules, such as brasilicardin A.
- reference: PMID:37527397
  title: "Phenotypic and genotypic analysis of antimicrobial resistance in Nocardia species."
  found_in:
  - Nocardiosis-deep-research-openscientist.md
  findings:
  - statement: >-
      Linezolid, trimethoprim-sulfamethoxazole, and amikacin retained high in
      vitro activity across 138 clinical Nocardia isolates, with other
      resistance patterns tracking species-specific genes and mutations.
    supporting_text: >-
      Linezolid was active against all isolates, followed by
      trimethoprim/sulfamethoxazole (93%) and amikacin (91%).
- reference: PMID:37865337
  title: "Trimethoprim-sulfamethoxazole significantly reduces the risk of nocardiosis in solid organ transplant recipients: systematic review and individual patient data meta-analysis."
  found_in:
  - Nocardiosis-deep-research-openscientist.md
  findings:
  - statement: >-
      TMP-SMX prophylaxis significantly reduces the risk of nocardiosis in solid
      organ transplant recipients.
    supporting_text: >-
      TMP-SMX prophylaxis was independently associated with a significantly
      decreased risk of nocardiosis (adjusted OR = 0.3, 95% CI 0.18-0.52,
      moderate certainty of evidence).

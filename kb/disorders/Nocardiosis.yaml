has_subtypes:
- name: Pulmonary Nocardiosis
  display_name: Pulmonary nocardiosis
  description: >-
    The dominant inhalational form; it can produce cough, sputum, fever,
    nodular or mass-like lung opacities, consolidation, cavitation, and
    dissemination to extrapulmonary sites.
  evidence:
  - reference: PMID:41319540
    reference_title: "Clinical characteristics and outcomes of nocardiosis: A retrospective analysis of 44 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 44 cases, pulmonary infection was identified in 28 cases,
      disseminated infection in 13 cases, and extrapulmonary single-organ
      infection in 3 cases.
    explanation: The 44-case series identifies pulmonary infection as the largest clinical presentation group.
- name: Cutaneous Nocardiosis
  display_name: Cutaneous nocardiosis and actinomycetoma
  description: >-
    Skin or subcutaneous disease follows traumatic inoculation and can present
    as actinomycetoma with swelling, abscesses, ulcers, scars, and draining
    sinuses containing Nocardia microcolonies.
  evidence:
  - reference: PMID:33956121
    reference_title: "Nitric oxide determines the development of actinomycetoma by Nocardia brasiliensis in eNOS knockout C57BL/6 mice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical appearance includes swelling, abscesses, ulcers, scars and
      sinuses that drain purulent material with microbe microcolonies.
    explanation: The actinomycetoma model paper summarizes the characteristic human cutaneous syndrome.
- name: Disseminated or CNS Nocardiosis
  display_name: Disseminated and central nervous system nocardiosis
  description: >-
    Hematogenous dissemination, particularly in immunosuppressed hosts, can
    seed the central nervous system; adult CNS cases usually show brain
    abscesses and have high mortality.
  evidence:
  - reference: PMID:35700710
    reference_title: "Clinical Characteristics and Treatment Outcome of Central Nervous System Nocardiosis: A Systematic Review of Reported Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      brain abscess was most common (86.9%), followed by leptomeningeal
      enhancement (12.1%).
    explanation: The adult systematic review identifies brain abscess as the dominant CNS presentation.

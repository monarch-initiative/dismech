treatments:
- name: Trimethoprim-Sulfamethoxazole Therapy or Prophylaxis
  description: >-
    Co-trimoxazole is the antifolate backbone for treatment and, at sufficient
    dosing, prophylaxis in high-risk solid-organ transplant recipients; therapy
    is prolonged and should be adjusted to species identification and isolate
    susceptibility.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: co-trimoxazole
      term:
        id: CHEBI:3770
        label: co-trimoxazole
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Nocardia Tetrahydrofolate Synthesis (TMP-SMX Target)
    description: TMP-SMX blocks sequential bacterial tetrahydrofolate-synthesis steps in susceptible Nocardia.
  evidence:
  - reference: PMID:37527397
    reference_title: "Phenotypic and genotypic analysis of antimicrobial resistance in Nocardia species."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Linezolid was active against all isolates, followed by
      trimethoprim/sulfamethoxazole (93%) and amikacin (91%).
    explanation: Broth-microdilution testing found high TMP-SMX activity across Nocardia species.
  - reference: PMID:37865337
    reference_title: "Trimethoprim-sulfamethoxazole significantly reduces the risk of nocardiosis in solid organ transplant recipients: systematic review and individual patient data meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TMP-SMX prophylaxis was independently associated with a significantly
      decreased risk of nocardiosis (adjusted OR = 0.3, 95% CI 0.18-0.52,
      moderate certainty of evidence).
    explanation: Meta-analysis support for co-trimoxazole as risk-reducing prophylaxis in solid organ transplant recipients.
- name: Linezolid and Amikacin-Containing Therapy
  description: >-
    Severe, disseminated, central nervous system, or resistant nocardiosis can
    require combination therapy that includes ribosome-active agents such as
    linezolid or amikacin while susceptibility testing is pending or when an
    isolate is susceptible.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: linezolid
      term:
        id: CHEBI:63607
        label: linezolid
    - preferred_term: amikacin
      term:
        id: CHEBI:2637
        label: amikacin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Nocardia Ribosomal Translation (Linezolid and Amikacin Target)
    description: Linezolid and amikacin inhibit Nocardia protein synthesis through bacterial ribosomal targets.
  evidence:
  - reference: PMID:37527397
    reference_title: "Phenotypic and genotypic analysis of antimicrobial resistance in Nocardia species."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Linezolid was active against all isolates, followed by
      trimethoprim/sulfamethoxazole (93%) and amikacin (91%).
    explanation: Broth-microdilution testing found linezolid and amikacin among the most active agents across Nocardia species.
- name: Abscess Drainage or Resection
  description: >-
    Surgical drainage or resection can be added for nocardial brain abscesses or
    other bulky abscesses to obtain source control and microbiologic diagnosis.
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: CNS Abscess Formation
    description: Surgery removes or drains nocardial brain abscess burden.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:35700710
    reference_title: "Clinical Characteristics and Treatment Outcome of Central Nervous System Nocardiosis: A Systematic Review of Reported Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients who underwent surgery (OR 2.4, 95% CI 0.99-4.11, p value 0.046)
      had better survival than those treated with antimicrobial therapy alone.
    explanation: The CNS systematic review found improved survival with surgery plus antimicrobials.
notes: >-
  OLS MONDO searches did not find pulmonary, cutaneous, disseminated, or central
  nervous system nocardiosis subtype terms. Those anatomical forms are
  represented as ungrounded subtypes until suitable MONDO classes exist. The
  `Intraphagocytic Nocardia Survival` node deliberately carries no `conforms_to`
  to `intracellular_pathogen_persistence`: both nodes of that module assert
  beta-lactam / cell-wall-active exclusion, whereas Nocardia is treated with
  carbapenems and ceftriaxone in severe or CNS disease, so conforming would
  assert a therapeutic exclusion this disease contradicts.

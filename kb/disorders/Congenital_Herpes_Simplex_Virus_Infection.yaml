name: Congenital Herpes Simplex Virus Infection
creation_date: "2026-09-30T00:00:00Z"
category: Infectious Disease
disease_term:
  preferred_term: congenital herpes simplex virus infection
  term:
    id: MONDO:0017381
    label: congenital herpes simplex virus infection
parents:
- congenital herpes virus infection
- herpes simplex infectious disease
synonyms:
- neonatal herpes simplex virus infection
- neonatal HSV infection
- congenital herpes simplex
- mother-to-child transmission of herpes simplex virus infection
- Simplexvirus infectious embryofetopathy
notes: >-
  Scope. MONDO:0017381 lumps three transmission routes that differ in timing,
  presentation and frequency, and this entry covers all three as one disease with
  the routes recorded in has_subtypes. The MONDO definition describes intrauterine
  infection, while the synonym list includes neonatal herpes simplex virus
  infection; the literature resolves the ambiguity with a split rather than a
  boundary - intrauterine 5%, perinatal 85%, postnatal 10% of cases. They share
  the maternal reservoir, the virus, the diagnostic approach and aciclovir
  treatment, and MONDO offers no separate identifier for any of them, so splitting
  them into separate entries would create concepts with no terms to bind.
  Intrauterine infection is the one that produces fetal malformation, and that
  difference is carried on the subtype rather than asserted of the whole entry.

  Relationship to Viral_Encephalitis.yaml. That entry carries an "HSV
  Encephalitis" has_subtypes entry, but it scopes sporadic HSV-1 frontotemporal
  encephalitis of older children and adults and binds no MONDO identifier, so
  there is no competing claim on MONDO:0017381. Neonatal CNS disease appears
  there only as a single clause. The overlap is real but partial: CNS disease is
  one of the three neonatal presentations curated here, not the whole of it.
description: >-
  Congenital herpes simplex virus infection is vertically transmitted HSV-1 or
  HSV-2 disease of the fetus or newborn. The dominant route is not transplacental
  but intrapartum: roughly 85% of cases are acquired through contact with
  infected maternal genital secretions during delivery, against 5% acquired in
  utero and 10% postnatally. Intrauterine infection is the route that produces
  fetal damage - placental inflammation, skin erosion, malformation and fetal
  loss - while perinatally acquired disease presents days to weeks after birth in
  one of three forms: localised skin, eye and mouth disease, central nervous
  system disease, or disseminated multi-organ infection. Maternal infection is
  frequently silent, so the absence of a maternal history does not exclude the
  diagnosis. Aciclovir transformed outcome and long-term suppressive therapy
  reduces morbidity. The CNS and disseminated forms are the severe presentations;
  this entry carries no sourced mortality or neurodevelopmental-outcome figures and
  so makes no quantitative claim about either. Pooled global incidence
  is about 8.2 per 100,000 live births and rising, with HSV-1 displacing HSV-2 as
  the commoner agent.
infectious_agent:
- name: Human alphaherpesvirus 2
  infectious_agent_term:
    preferred_term: herpes simplex virus type 2
    term:
      id: NCBITaxon:10310
      label: Human alphaherpesvirus 2
  description: >-
    Historically the predominant agent of neonatal herpes, and still the commoner
    one in the Americas.
  evidence:
  - reference: PMID:41860333
    reference_title: "Global epidemiology of neonatal herpes: systematic review, meta-analyses, and meta-regressions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Globally, nHSV-1 and nHSV-2 accounted for pooled and weighted means of 47.3% (95% CI = 39.5-55.0) and 52.8% (95% CI = 45.2-60.5) of cases, respectively."
    explanation: >-
      Quantifies the share of cases attributable to each virus type in a global
      meta-analysis.
- name: Human alphaherpesvirus 1
  infectious_agent_term:
    preferred_term: herpes simplex virus type 1
    term:
      id: NCBITaxon:10298
      label: Human alphaherpesvirus 1
  description: >-
    An increasing share of neonatal herpes, reflecting a shift in the
    epidemiology of genital HSV-1 in the maternal population.
  evidence:
  - reference: PMID:41860333
    reference_title: "Global epidemiology of neonatal herpes: systematic review, meta-analyses, and meta-regressions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The increasing dominance of nHSV-1 over nHSV-2 reflects shifting HSV epidemiology."
    explanation: >-
      States the direction of the change in which agent predominates.
transmission:
- name: Intrapartum transmission from infected maternal genital secretions
  description: >-
    The dominant route. The neonate is infected during passage through an
    infected birth canal, which is why this is a perinatal rather than a
    transplacental disease in most cases, and why maternal shedding at delivery
    rather than maternal viraemia is the operative exposure.
  evidence:
  - reference: PMID:37592873
    reference_title: "Neonatal herpes simplex virus infection: From the maternal infection to the child outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering when the transmission of the infection from the mother to the fetus/newborn occurs, three types of neonatal infection can be distinguished: intrauterine infection (5% of cases), postnatal infection (10% of cases), and perinatal infections (85% of cases)."
    explanation: >-
      Gives the quantitative split across the three routes, establishing
      perinatal transmission as dominant.
- name: Transplacental transmission after maternal primary infection
  description: >-
    The minority route, and the one that damages the fetus. Primary maternal
    infection in early pregnancy can seed the placenta, where viral persistence
    produces inflammation and haemorrhage, with transmission to fetal tissues and
    fetal loss at higher viral doses.
  evidence:
  - reference: PMID:34696359
    reference_title: Primary HSV-2 Infection in Early Pregnancy Results in Transplacental Viral Transmission and Dose-Dependent Adverse Pregnancy Outcomes in a Novel Mouse Model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Eight days post-inoculation (gd12.5), HSV-2 DNA persisted in placental tissues, resulting in inflammation and hemorrhage."
    explanation: >-
      Mouse model evidence for the placental mechanism of in utero transmission.
  - reference: PMID:34696359
    reference_title: Primary HSV-2 Infection in Early Pregnancy Results in Transplacental Viral Transmission and Dose-Dependent Adverse Pregnancy Outcomes in a Novel Mouse Model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "HSV-2 DNA and increased expression of pro-inflammatory mediators were detected in fetal tissues at gd12.5, signifying viral transmission and fetal infection, even with low viral doses."
    explanation: >-
      Demonstrates that transmission to fetal tissue occurs, not merely placental
      infection.
has_subtypes:
- name: Intrauterine
  display_name: Intrauterine (congenital) infection
  subtype_frequency: about 5% of cases
  description: >-
    Acquired in utero and present at birth. The route that produces fetal
    malformation and skin erosion, and the one MONDO's own definition
    describes. Maternal infection may be entirely silent.
- name: Perinatal
  display_name: Perinatal (intrapartum) infection
  subtype_frequency: about 85% of cases
  description: >-
    Acquired during delivery and presenting days to weeks later. This is the
    dominant form, and the one the clinical SEM / CNS / disseminated classification
    describes; those three are carried as children below because they set aciclovir
    duration and differ sharply in mortality, so they are a clinically operative
    axis rather than a restatement of the transmission route.
  children:
  - SEM
  - CNS
  - Disseminated
- name: SEM
  display_name: Skin, eye and mouth (SEM) disease
  classification: clinical
  description: >-
    Perinatally acquired disease localised to the portal of entry, the least severe
    of the three presentations.
- name: CNS
  display_name: Central nervous system disease
  classification: clinical
  description: >-
    Perinatally acquired disease with spread to the central nervous system, the
    presentation carrying neurodevelopmental sequelae.
- name: Disseminated
  display_name: Disseminated multi-organ disease
  classification: clinical
  description: >-
    Perinatally acquired disease with bloodborne multi-organ involvement, the
    presentation with the highest mortality.
- name: Postnatal
  display_name: Postnatal infection
  subtype_frequency: about 10% of cases
  description: >-
    Acquired after birth from a contact shedding virus, most often oral HSV-1.
pathophysiology:
- name: Maternal Genital HSV Infection and Shedding
  biological_scale: ORGANISM
  description: >-
    The reservoir. Maternal infection is categorised as primary first episode,
    non-primary first episode, or recurrent, and these differ in transmission
    risk because they differ in viral load and in transplacental antibody
    available to the neonate. Shedding is frequently asymptomatic, so the
    exposure can occur without any maternal history.
  downstream:
  - target: Vertical Transmission to Fetus or Neonate
    causal_link_type: DIRECT
    description: >-
      Maternal shedding is the proximate source of virus reaching the infant.
  evidence:
  - reference: PMID:37592873
    reference_title: "Neonatal herpes simplex virus infection: From the maternal infection to the child outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We summarized the three clinical categories of maternal HSV infection during pregnancy (primary first episode, nonprimary first episode, or recurrent episode) and the mechanisms of fetal damage."
    explanation: >-
      Establishes the three maternal infection categories that structure risk in
      this disease.
  - reference: PMID:38044450
    reference_title: "Congenital herpes simplex with ophthalmic and multisystem features: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "risk factors for mother-to-child transmission include vaginal delivery, primary maternal infection, and prolonged rupture of membranes."
    explanation: >-
      Names primary maternal infection as a transmission risk factor. An earlier
      draft asserted that the three categories differ in risk because of viral load
      and transplacental antibody; no source cited here supports that mechanism, so
      the claim is now limited to what this sentence states.
- name: Vertical Transmission to Fetus or Neonate
  biological_scale: ORGANISM
  description: >-
    Virus reaches the infant by one of three routes, dominated by intrapartum
    contact. Which route operates determines the presentation: in utero
    transmission damages the developing fetus, intrapartum transmission produces
    neonatal disease after a latent interval.
  downstream:
  - target: Local Mucocutaneous Replication at the Portal of Entry
    causal_link_type: DIRECT
  - target: Placental Inflammation and Fetal Injury
    causal_link_type: DIRECT
    description: Operative only on the intrauterine route.
  evidence:
  - reference: PMID:37592873
    reference_title: "Neonatal herpes simplex virus infection: From the maternal infection to the child outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering when the transmission of the infection from the mother to the fetus/newborn occurs, three types of neonatal infection can be distinguished: intrauterine infection (5% of cases), postnatal infection (10% of cases), and perinatal infections (85% of cases)."
    explanation: Enumerates and quantifies the routes this node branches into.
- name: Placental Inflammation and Fetal Injury
  biological_scale: TISSUE
  description: >-
    On the intrauterine route, viral persistence in placental tissue produces
    inflammation and haemorrhage, reduced placental and fetal weight, and fetal
    loss at higher viral doses. This is the step that distinguishes congenital
    from perinatal disease, and it is why the intrauterine form presents with
    malformation rather than with postnatal illness.
  downstream:
  - target: Abnormal brain morphology
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34696359
    reference_title: Primary HSV-2 Infection in Early Pregnancy Results in Transplacental Viral Transmission and Dose-Dependent Adverse Pregnancy Outcomes in a Novel Mouse Model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Fetal and placental weights were reduced and fetal loss was observed with high viral doses."
    explanation: >-
      Dose-dependent fetal injury downstream of placental infection, in the model
      system where the mechanism has been dissected.
  - reference: PMID:33520322
    reference_title: Diagnosis of Neonatal Herpes Simplex Infection from the Placenta.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathological examination of the placenta had revealed subacute necrotizing inflammation with stromal cell necrosis suggestive of intrauterine infection, possibly ascending due to prolonged rupture of membranes."
    explanation: >-
      Necrotizing placental inflammation in a human case of intrauterine HSV-2,
      the human counterpart of the mouse placental finding above. One case, and
      the authors hedge the intrauterine attribution as "suggestive of".
- name: Local Mucocutaneous Replication at the Portal of Entry
  biological_scale: CELLULAR
  description: >-
    After intrapartum acquisition the virus replicates at the site of inoculation -
    skin, eye or oropharyngeal mucosa. Disease that stays here is the skin, eye and
    mouth (SEM) form, the least severe of the three presentations.
  downstream:
  - target: Vesicular skin eruption
    causal_link_type: DIRECT
  - target: Panuveitis
    causal_link_type: DIRECT
  - target: Neuroinvasion and Central Nervous System Spread
    causal_link_type: DIRECT
  - target: Haematogenous Multi-Organ Dissemination
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38044450
    reference_title: "Congenital herpes simplex with ophthalmic and multisystem features: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Neonatal HSV can manifest with isolated mucocutaneous lesions, neurological involvement, or disseminated disease."
    explanation: >-
      Names disease confined to mucocutaneous lesions as a distinct presentation,
      separate from neurological and disseminated disease, which is the localised
      form this node models.
- name: Neuroinvasion and Central Nervous System Spread
  biological_scale: ORGANISM
  description: >-
    Spread to the central nervous system produces the CNS form, which may present
    with overt neurological signs or with nonspecific illness. This is one of the
    two severe presentations and the one that carries neurodevelopmental sequelae.
  downstream:
  - target: Seizure
    causal_link_type: DIRECT
  - target: Retinopathy
    causal_link_type: DIRECT
  - target: Fever
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37559852
    reference_title: The Many Faces of Neurological Neonatal Herpes Simplex Virus Infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The wide range of clinical presentations of CNS manifestations in neonatal HSV infection, ranging from nonspecific to evident neurological symptoms, underscores the need for a high index of suspicion"
    explanation: >-
      Describes CNS involvement in neonatal HSV presenting with symptoms that
      range from nonspecific to overtly neurological, as the node states.
- name: Haematogenous Multi-Organ Dissemination
  biological_scale: ORGANISM
  description: >-
    Bloodborne spread to multiple organs produces the disseminated form, the
    presentation with the highest mortality. Which of the three forms develops is
    the principal determinant of outcome and sets the duration of aciclovir therapy.
  downstream:
  - target: Elevated circulating aspartate aminotransferase concentration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:11483781
    reference_title: Natural history of neonatal herpes simplex virus infections in the acyclovir era.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among patients with disseminated HSV disease treated with acyclovir at 30 mg/kg/d, mortality was associated with aspartate transaminase elevations of >/=10 times the upper limit of normal at the time of initiation of acyclovir therapy."
    explanation: >-
      Ties hepatic involvement in disseminated disease to mortality in a 186-patient
      natural-history series, which is the organ involvement this node asserts.
  - reference: PMID:41185580
    reference_title: A Multicenter Study on Symptomatic Neonatal Herpes Simplex Virus Infection in Korea From 2008 to 2017.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two (12.5%) patients with disseminated disease died within 30 days from the diagnosis, and one of them had a maternal history of previous genital herpetic lesions."
    explanation: >-
      Both deaths in this multicentre cohort were in the disseminated group, which is
      the basis for calling this the highest-mortality presentation.
  - reference: PMID:11483781
    reference_title: Natural history of neonatal herpes simplex virus infections in the acyclovir era.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients' morbidity status was associated with the extent of disease (skin, eye, and/or mouth disease vs CNS vs disseminated)."
    explanation: >-
      Sources the claim that which of the three forms develops determines outcome,
      which is why SEM/CNS/disseminated is carried as a subtype axis.
phenotypes:
- category: Dermatologic
  name: Vesicular skin eruption
  subtype: SEM
  description: >-
    Grouped vesicles of skin, and lesions of eye and mouth, define the localised
    presentation. They are not a reliable sign of the disease as a whole: a large
    minority of infants never have skin vesicles at presentation or during the acute
    illness, and that proportion is highest in disseminated disease.
  phenotype_term:
    preferred_term: Vesicular eruption
    term:
      id: HP:0033697
      label: Vesicular eruption
  evidence:
  - reference: PMID:40027069
    reference_title: "Intrauterine Herpes Simplex Virus Infection: Insights Into a Silent Threat."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On the fourth day of life, grouped vesicles emerged, leading to the initiation of intravenous acyclovir therapy."
    explanation: >-
      Documents the vesicular eruption as the sign that triggered diagnosis and
      treatment in a confirmed case.
  - reference: PMID:11483781
    reference_title: Natural history of neonatal herpes simplex virus infections in the acyclovir era.
    supports: REFUTE
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "A significant minority of patients did not have skin vesicles at the time of their presentation and did not develop them during the acute HSV disease (39% of patients with disseminated disease; 32% of patients with central nervous system [CNS] disease; and 17% of patients with skin, eye, and/or mouth disease)."
    explanation: >-
      Recorded as REFUTE against reading this phenotype as a reliable marker of the
      disease: 39% of disseminated cases never had vesicles at all. Graded INDIRECT
      because the series reports absence rates rather than addressing the phenotype
      claim directly. This is why the description no longer calls vesicles the first
      visible sign.
- category: Dermatologic
  name: Skin erosion
  description: >-
    Extensive skin erosion is part of the intrauterine presentation, present at
    birth rather than developing afterwards.
  phenotype_term:
    preferred_term: Skin erosion
    term:
      id: HP:0200041
      label: Skin erosion
  subtype: Intrauterine
  evidence:
  - reference: PMID:40027069
    reference_title: "Intrauterine Herpes Simplex Virus Infection: Insights Into a Silent Threat."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "extensive skin erosions and severe neurological impairment."
    explanation: >-
      Documents extensive skin erosion at delivery in confirmed intrauterine HSV-2.
- category: Ophthalmologic
  name: Retinopathy
  subtype: CNS
  description: >-
    Infectious retinopathy is reported on funduscopy in neonatal HSV-2 central
    nervous system disease.
  phenotype_term:
    preferred_term: infectious retinopathy
    term:
      id: HP:0000488
      label: Retinopathy
  evidence:
  - reference: PMID:42620976
    reference_title: A case of neonatal herpes simplex virus type 2 encephalitis with TLR3 gene mutation and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cranial MRI showed meningoencephalitis, and funduscopy revealed infectious retinopathy."
    explanation: >-
      Direct funduscopic finding in confirmed neonatal HSV-2 CNS disease.
- category: Hepatic
  name: Elevated circulating aspartate aminotransferase concentration
  description: >-
    Marked transaminase elevation reflects hepatic involvement in disseminated
    disease, and at ten times the upper limit of normal at the start of therapy it
    is associated with mortality.
  phenotype_term:
    preferred_term: aspartate transaminase elevation at initiation of therapy
    term:
      id: HP:0031956
      label: Elevated circulating aspartate aminotransferase concentration
  subtype: Disseminated
  evidence:
  - reference: PMID:11483781
    reference_title: Natural history of neonatal herpes simplex virus infections in the acyclovir era.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among patients with disseminated HSV disease treated with acyclovir at 30 mg/kg/d, mortality was associated with aspartate transaminase elevations of >/=10 times the upper limit of normal at the time of initiation of acyclovir therapy."
    explanation: >-
      The specific laboratory finding and its prognostic association, in disseminated
      disease. Bound to the transaminase term rather than to HSV hepatitis
      (HP:5210394), because the source reports the enzyme elevation and does not
      diagnose hepatitis.
- category: Neurologic
  name: Seizure
  subtype: CNS
  description: >-
    Seizures accompany central nervous system disease, which may present with
    overt neurological signs or with nonspecific illness.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:11483781
    reference_title: Natural history of neonatal herpes simplex virus infections in the acyclovir era.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For those patients with CNS disease, morbidity was also associated with seizures at initiation of antiviral therapy."
    explanation: >-
      Seizures at the start of therapy in CNS disease in the 186-patient
      natural-history series, where they are also associated with morbidity.
  - reference: PMID:42620976
    reference_title: A case of neonatal herpes simplex virus type 2 encephalitis with TLR3 gene mutation and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 17-day-old female presented with fever and frequent convulsions 15 days after birth."
    explanation: >-
      Direct documentation of convulsions in a confirmed case of neonatal
      HSV-2 CNS disease.
- category: Ophthalmologic
  name: Panuveitis
  description: >-
    Ocular involvement is a presenting feature that can lead to the diagnosis.
    Reported manifestations include blepharoconjunctivitis, keratitis and
    panuveitis, and ocular assessment has been argued to be decisive in the
    diagnostic workup.
  phenotype_term:
    preferred_term: Panuveitis
    term:
      id: HP:0012121
      label: Panuveitis
  evidence:
  - reference: PMID:38044450
    reference_title: "Congenital herpes simplex with ophthalmic and multisystem features: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Later, a new ocular examination was suggestive of panuveitis."
    explanation: >-
      The ocular finding in a case of neonatal HSV confirmed by serum IgM. The
      source hedges it as "suggestive of", and this item claims no more.
  review_notes: >-
    Chorioretinitis (HP:0012424) was considered and rejected: this source reports
    panuveitis, blepharoconjunctivitis and keratitis, so binding Chorioretinitis
    would assert a finding none of the cited sources make. No subtype is asserted
    either - the case is a 32-week preterm with presumed neonatal infection
    diagnosed on serum IgM, which does not establish in utero acquisition, so this
    phenotype hangs off neonatal replication rather than the intrauterine-only
    placental node.
- category: Neurologic
  name: Abnormal brain morphology
  description: >-
    Structural brain abnormality is reported in intrauterine infection, where the
    insult falls during fetal brain development rather than after birth.
  phenotype_term:
    preferred_term: fetal brain abnormality on antenatal ultrasound
    term:
      id: HP:0012443
      label: Abnormal brain morphology
  subtype: Intrauterine
  review_notes: >-
    Hydranencephaly (HP:0002324) was considered and rejected. The only cited source
    reports "brain abnormalities" on antenatal ultrasound, and substituting a
    specific destructive lesion for a non-specific finding is not an inference step
    that directness INDIRECT can cover. Bind the specific lesion only when a source
    names it. Organomegaly, in the same quoted sentence, is also not yet curated.
  evidence:
  - reference: PMID:40027069
    reference_title: "Intrauterine Herpes Simplex Virus Infection: Insights Into a Silent Threat."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "An ultrasound at that time revealed severe fetal malformations, including brain abnormalities and organomegaly."
    explanation: >-
      Documents severe fetal brain malformation in confirmed intrauterine HSV-2.
      Graded INDIRECT because the report describes brain abnormalities on
      ultrasound rather than naming hydranencephaly specifically.
- category: Constitutional
  name: Fever
  subtype: CNS
  description: >-
    Fever with convulsions in the first weeks of life is the presentation that
    should raise suspicion, particularly when empirical antibacterial treatment
    fails.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:42620976
    reference_title: A case of neonatal herpes simplex virus type 2 encephalitis with TLR3 gene mutation and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 17-day-old female presented with fever and frequent convulsions 15 days after birth."
    explanation: >-
      Documents fever as a presenting feature in confirmed neonatal HSV-2 CNS
      disease.
  review_notes: >-
    Disseminated intravascular coagulation was considered for a phenotype slot and
    dropped: it is a real feature of disseminated neonatal HSV, but no reference
    cited in this entry reports it. Left for a later round with a source that does.
prevalence:
- population: Global, pooled across three WHO regions
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 8.2
  rate_low: 5.9
  rate_high: 10.7
  rate_denominator: LIVE_BIRTHS
  notes: >-
    Pooled and population-weighted mean incidence, 8.2 per 100,000 live births
    (95% CI 5.9-10.7), from 140 incidence measures in 143 publications. Recorded
    as ANNUAL_INCIDENCE with a LIVE_BIRTHS denominator, matching the source's own
    wording and the precedent set by neonatal listeriosis in Listeriosis.yaml. Not
    BIRTH_PREVALENCE: about 95% of the cases this entry covers are acquired at or
    after delivery and are not present at birth.
  evidence:
  - reference: PMID:41860333
    reference_title: "Global epidemiology of neonatal herpes: systematic review, meta-analyses, and meta-regressions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The global pooled and regional population-weighted mean incidence rate was 8.2 (95% confidence interval (CI) = 5.9-10.7) per 100 000 live births."
    explanation: Source for the pooled global figure and its confidence interval.
- population: WHO Region of the Americas
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 13.3
  rate_low: 9.9
  rate_high: 17.2
  rate_denominator: LIVE_BIRTHS
  notes: >-
    The highest regional estimate, against 5.2 in Europe and 2.9 in the Western
    Pacific. Recorded because the regional spread is wide enough that a single
    global figure misleads.
  evidence:
  - reference: PMID:41860333
    reference_title: "Global epidemiology of neonatal herpes: systematic review, meta-analyses, and meta-regressions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Incidence rate was highest in the Americas (13.3 cases per 100 000 live births; 95% CI = 9.9-17.2), followed by the European Region (5.2 cases per 100 000 live births; 95% CI = 3.4-7.3) and the Western Pacific Region (2.9 cases per 100 000 live births; 95% CI = 2.2-3.6)."
    explanation: Gives all three regional estimates in one sentence.
progression:
- phase: Trend in incidence
  notes: >-
    Incidence is rising, and the agent mix is shifting from HSV-2 toward HSV-1.
    Both trends are measured rather than impressionistic.
  evidence:
  - reference: PMID:41860333
    reference_title: "Global epidemiology of neonatal herpes: systematic review, meta-analyses, and meta-regressions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meta-regression analyses showed an annual increase of 3.5% (95% CI = 1.5-5.6) in nHSV incidence rate, alongside a yearly 1.4% (95% CI = 0.9-1.9) increase in the proportion of nHSV-1 cases and a 1.1% (95% CI = 0.6-1.6) decrease in the proportion of nHSV-2 cases."
    explanation: Quantifies both trends with confidence intervals.
treatments:
- name: Intravenous Aciclovir
  description: >-
    Intravenous aciclovir is the treatment, with intensity and duration tailored
    to which of the three presentations is present. Availability of safe,
    effective antiviral therapy together with PCR diagnosis is described as having
    transformed management of this disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: intravenous antiviral therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
    therapeutic_agent:
    - preferred_term: aciclovir
      term:
        id: CHEBI:2453
        label: acyclovir
  target_mechanisms:
  - target: Local Mucocutaneous Replication at the Portal of Entry
    description: >-
      Aciclovir inhibits viral DNA replication, acting on the node that determines
      which of the three presentations develops.
    evidence:
    - reference: PMID:23481105
      reference_title: Neonatal herpes simplex virus infections.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The use of polymerase chain reaction for diagnosis of central nervous system infections and the development of safe and effective antiviral therapy has revolutionized the diagnosis and management of these infants."
      explanation: >-
        Attributes the change in outcome to antiviral therapy acting on the
        infection itself.
  evidence:
  - reference: PMID:37592873
    reference_title: "Neonatal herpes simplex virus infection: From the maternal infection to the child outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the treatment with acyclovir should be tailored according to symptoms and signs of infection, and virological tests"
    explanation: Establishes aciclovir as the treatment and that dosing is tailored.
- name: Maternal Third-Trimester Antiviral Prophylaxis
  description: >-
    Antiviral prophylaxis given to the mother in late pregnancy reduces genital HSV
    recurrence and viral shedding at delivery, which is the exposure that transmits
    the infection. Whether it reduces neonatal herpes itself is not established -
    the disease is rare enough that the trials are underpowered for that endpoint.
    Recorded here because prevention is the principal clinical lever in this disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiviral prophylaxis in the third trimester
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
    therapeutic_agent:
    - preferred_term: aciclovir
      term:
        id: CHEBI:2453
        label: acyclovir
  target_mechanisms:
  - target: Maternal Genital HSV Infection and Shedding
    description: >-
      Suppresses the maternal reservoir and shedding, acting upstream of
      transmission rather than on neonatal infection.
  evidence:
  - reference: PMID:18254066
    reference_title: Third trimester antiviral prophylaxis for preventing maternal genital herpes simplex virus (HSV) recurrences and neonatal infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Women who received antiviral prophylaxis were significantly less likely to have a recurrence of genital herpes at delivery (relative risk (RR) 0.28, 95% confidence interval (CI) 0.18 to 0.43"
    explanation: >-
      Systematic-review effect estimate for the outcome this treatment acts on,
      maternal recurrence at delivery.
  - reference: PMID:18254066
    reference_title: Third trimester antiviral prophylaxis for preventing maternal genital herpes simplex virus (HSV) recurrences and neonatal infection.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "There is insufficient evidence to determine if antiviral prophylaxis reduces the incidence of neonatal herpes."
    explanation: >-
      Recorded as NO_EVIDENCE against the stronger claim that prophylaxis prevents
      neonatal herpes. The review establishes the surrogate outcome and explicitly
      declines the clinical one, and this entry should not assert more than that.
- name: Oral Aciclovir Suppression After Acute Treatment
  description: >-
    Long-term oral suppressive therapy after the acute course reduces morbidity.
    The cited source states the benefit without specifying the domain, so no
    neurodevelopmental-specific claim is made.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: oral antiviral suppressive therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
    therapeutic_agent:
    - preferred_term: aciclovir
      term:
        id: CHEBI:2453
        label: acyclovir
  evidence:
  - reference: PMID:23481105
    reference_title: Neonatal herpes simplex virus infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initiation of long-term antiviral suppressive therapy in these infants has led to significant improvement in morbidity."
    explanation: >-
      States the morbidity benefit of suppressive therapy following acute
      treatment.
diagnosis:
- name: HSV Polymerase Chain Reaction
  description: >-
    PCR detection of HSV DNA, including in cerebrospinal fluid for central
    nervous system disease. PCR diagnosis, together with antiviral therapy, is
    credited with transforming the diagnosis and management of these infants.
  diagnosis_term:
    preferred_term: HSV PCR
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:23481105
    reference_title: Neonatal herpes simplex virus infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The use of polymerase chain reaction for diagnosis of central nervous system infections and the development of safe and effective antiviral therapy has revolutionized the diagnosis and management of these infants."
    explanation: >-
      Names PCR as the diagnostic method for CNS infection in neonatal HSV.
- name: Placental Histopathology
  description: >-
    Pathological examination of the placenta can reveal intrauterine infection
    before the infant shows signs, which matters most in premature infants
    because intrauterine HSV presents variably.
  diagnosis_term:
    preferred_term: placental histopathological examination
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:33520322
    reference_title: Diagnosis of Neonatal Herpes Simplex Infection from the Placenta.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to the variability of presentation of intrauterine HSV infection, pathological examination of the placenta in the first 2-5 days of life in premature infants can provide clues to the diagnosis of neonatal HSV which may significantly impact the outcome."
    explanation: >-
      The case report's conclusion that placental pathology can prompt the
      diagnosis, drawn from one case in which it did.
- name: Ophthalmological Assessment
  description: >-
    Eye examination can raise the suspicion of HSV and is argued to be decisive
    in the diagnostic workup, particularly in neonatal conjunctivitis that does
    not respond to antibiotics.
  diagnosis_term:
    preferred_term: ophthalmological assessment
    term:
      id: NCIT:C38060
      label: Eye Examination
  evidence:
  - reference: PMID:38044450
    reference_title: "Congenital herpes simplex with ophthalmic and multisystem features: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our report highlights that ocular assessment can be crucial in the correct diagnostic investigation of this condition."
    explanation: >-
      The case report's conclusion on the diagnostic role of ocular assessment.
animal_models:
- name: Intravaginal primary HSV-2 infection in early-pregnant C57BL/6 mice
  species: Mouse
  genotype: wild type
  background: C57BL/6
  publication: PMID:34696359
  description: >-
    Pregnant mice infected intravaginally with HSV-2 on gestation day 4.5. Viral
    DNA persists in placental tissue, with placental inflammation and
    haemorrhage, transmission to fetal tissue, and dose-dependent reduction in
    fetal and placental weight and fetal loss.
  evidence:
  - reference: PMID:34696359
    reference_title: Primary HSV-2 Infection in Early Pregnancy Results in Transplacental Viral Transmission and Dose-Dependent Adverse Pregnancy Outcomes in a Novel Mouse Model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This mouse model shows a dose-dependent effect of primary HSV-2 infection on pregnancy outcomes and suggests that fetal loss may occur due to placental inflammation, thus providing valuable insight into in utero transmission of HSV-2."
    explanation: >-
      The authors' summary of what the model shows about in utero transmission.
  modeled_mechanisms:
  - target: Placental Inflammation and Fetal Injury
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces placental viral persistence with inflammation and haemorrhage,
      fetal infection, and dose-dependent fetal injury and loss after primary
      maternal infection in early pregnancy.
    limitations: >-
      Mouse placentation differs from human placentation, infection is by
      intravaginal inoculation of a set viral dose at gestation day 4.5, and the
      model addresses the intrauterine route only, not the intrapartum route
      that accounts for most human cases.
    evidence:
    - reference: PMID:34696359
      reference_title: Primary HSV-2 Infection in Early Pregnancy Results in Transplacental Viral Transmission and Dose-Dependent Adverse Pregnancy Outcomes in a Novel Mouse Model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Eight days post-inoculation (gd12.5), HSV-2 DNA persisted in placental tissues, resulting in inflammation and hemorrhage."
      explanation: >-
        The placental finding that makes this model informative for the node.

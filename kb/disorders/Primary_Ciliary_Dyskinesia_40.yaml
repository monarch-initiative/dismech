name: Primary Ciliary Dyskinesia 40
creation_date: "2026-10-14T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: ciliary dyskinesia, primary, 40
  term:
    id: MONDO:0032664
    label: ciliary dyskinesia, primary, 40
description: >-
  Primary ciliary dyskinesia 40 (CILD40) is the form of primary ciliary
  dyskinesia (PCD) caused by biallelic variants in DNAH9. DNAH9 encodes a
  beta-type heavy chain of the axonemal outer dynein arm. In human
  respiratory cilia it is found only in the distal part of the axoneme,
  where it pairs with DNAH5 to form the distal (type 2) outer dynein arm;
  the proximal arms use its paralogue DNAH11 instead.

  Loss of DNAH9 removes DNAH9 and the other type 2 arm components (DNAH5,
  DNAI1, DNAI2) from the distal cilium only. Standard electron microscopy
  shows a partial loss of outer dynein arms, and high-speed video
  microscopy shows reduced bending of the distal cilium and a modestly
  reduced beat frequency. Because the proximal arms are intact, some
  mucociliary clearance is kept.

  The clinical picture is milder than typical PCD and is dominated by
  laterality defects, present in about two thirds of reported patients
  and often with complex congenital heart disease. Respiratory disease is
  mild, limited to the upper airway, or absent, and nasal nitric oxide is
  usually normal or high, so the standard PCD screen can miss it.
  Asthenozoospermia has been reported in a few men.
parents:
- Primary Ciliary Dyskinesia
- Ciliopathy
synonyms:
- CILD40
- ciliary dyskinesia, primary, 40
- DNAH9-related primary ciliary dyskinesia
notes: >-
  MONDO cross-references this disease as OMIM 618300. ClinGen classifies the
  DNAH9 relationship with this disease as Definitive (autosomal recessive,
  2026). ClinGen notes that DNAH9 was not detected in sperm flagella by
  immunofluorescence, yet asthenozoospermia was reported in four men; this
  has not been reconciled, so the sperm phenotype is recorded without a
  mechanistic edge.

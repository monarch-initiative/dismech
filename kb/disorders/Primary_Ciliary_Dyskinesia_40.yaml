treatments:
- name: Airway Clearance and Chronic Infection Management
  description: >-
    There is no treatment that restores ciliary function. For patients with
    respiratory symptoms, management is the supportive care used across
    primary ciliary dyskinesia: airway clearance and prompt treatment of
    respiratory infections. Nothing in it is specific to DNAH9.

    In DNAH9 disease, respiratory signs are mild or absent in most reported
    patients, and the clinical picture is dominated by laterality defects and
    complex congenital heart disease. Airway care therefore applies to a
    minority of patients. The cardiac and laterality problems are managed as
    in other causes of heterotaxy and congenital heart disease, and that
    management is not curated here.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Partially Impaired Mucociliary Clearance
    description: >-
      Airway clearance techniques supplement the partial mucociliary transport
      the distally defective cilia still provide. They do not restore ciliary
      function.
  evidence:
  - reference: PMID:38891105
    reference_title: "Primary Ciliary Dyskinesia: A Clinical Review."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Though there are no PCD-specific approved therapies that restore ciliary function, routine airway clearance and aggressive management of infections are important to preserve lung health and minimize complications"
    explanation: >-
      The supportive management used across PCD. Applied to DNAH9 disease by
      inference, since no genotype-stratified treatment evidence exists.
  - reference: CGGV:assertion_7d4c2324-1f4e-48d6-b7e9-cc66f7a9dda3-2026-06-11T100000.000Z
    reference_title: "DNAH9 / ciliary dyskinesia, primary, 40 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While most of the patients with DNAH9 defects had laterality defects and mild or no respiratory signs"
    explanation: >-
      Why airway care applies to only a minority of DNAH9 patients and the
      clinical burden is laterality and cardiac disease.
differential_diagnoses:
- name: Primary Ciliary Dyskinesia 3
  description: >-
    DNAH5 disease removes outer dynein arms along the whole cilium, giving
    immotile cilia, low nasal nitric oxide and typical PCD lung disease.
- name: Primary Ciliary Dyskinesia 7
  description: >-
    DNAH11 disease affects the proximal outer arms, with normal standard
    ultrastructure and stiff, hyperkinetic cilia.

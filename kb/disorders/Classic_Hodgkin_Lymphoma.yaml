name: Classic Hodgkin Lymphoma
creation_date: "2026-04-12T03:59:32Z"
category: Cancer
categories:
- Hematologic Malignancy
- B-cell Neoplasm
- Hodgkin Lymphoma
synonyms:
- classical Hodgkin lymphoma
- classical Hodgkin's lymphoma
- classic Hodgkin disease
- CHL
disease_term:
  preferred_term: classic Hodgkin lymphoma
  term:
    id: MONDO:0009348
    label: classic Hodgkin lymphoma
parents:
- Lymphoma
description: >-
  Classic Hodgkin lymphoma is a B-cell lymphoma characterized histologically by
  the presence of Hodgkin cells and multinucleated Reed-Sternberg cells.
definitions:
- name: Pathologic definition of classic Hodgkin lymphoma
  definition_type: CASE_DEFINITION
  description: >-
    Classic Hodgkin lymphoma is defined by neoplastic Hodgkin/Reed-Sternberg
    cells in a dense inflammatory background and is now understood to arise from
    germinal center B cells despite loss of many canonical B-cell markers.
  scope: General pathologic and molecular definition of classic Hodgkin lymphoma
  evidence:
  - reference: PMID:34075767
    reference_title: "Classic Hodgkin Lymphoma - Old Disease, New Directions: An Update on Pathology, Molecular Features and Biological Prognostic Markers."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The hallmark of this disease is the neoplastic Hodgkin/Reed-Sternberg (HRS) cell, which is favored to be derived from germinal center B-cells but has lost many of the B-cell markers."
    explanation: This review provides a concise disease definition centered on the hallmark HRS cell and its germinal center B-cell derivation.
prevalence:
- population: All lymphomas in the Western world
  percentage: "15-25"
  evidence:
  - reference: PMID:34075767
    reference_title: "Classic Hodgkin Lymphoma - Old Disease, New Directions: An Update on Pathology, Molecular Features and Biological Prognostic Markers."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Classic Hodgkin lymphoma (CHL) accounts for 15-25% of all lymphomas in the Western world."
    explanation: This review quantifies the proportion of all lymphomas represented by classic Hodgkin lymphoma in Western populations.
infectious_agent:
- name: Epstein-Barr Virus
  infectious_agent_term:
    preferred_term: Human gammaherpesvirus 4
    term:
      id: NCBITaxon:10376
      label: Human gammaherpesvirus 4
  description: >-
    Epstein-Barr virus is associated with a subset of classic Hodgkin lymphoma
    cases, with heterogeneity in association linked to the host immune context.
  evidence:
  - reference: PMID:29799516
    reference_title: "Epstein Barr Virus-Associated Hodgkin Lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The variable association of cHL with EBV infection is probably related to the different levels of patient immunosuppression, both locally in the tumour tissue and at the systemic level."
    explanation: This review supports EBV as a relevant but non-universal infectious cofactor in classic Hodgkin lymphoma.
pathophysiology:
- name: Germinal Center B-Cell Origin of HRS Cells
  description: >-
    The malignant Hodgkin/Reed-Sternberg cell is derived from germinal center B
    cells but loses many typical B-cell features during transformation.
  cell_types:
  - preferred_term: germinal center B cell
    term:
      id: CL:0000844
      label: germinal center B cell
  evidence:
  - reference: PMID:34075767
    reference_title: "Classic Hodgkin Lymphoma - Old Disease, New Directions: An Update on Pathology, Molecular Features and Biological Prognostic Markers."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The hallmark of this disease is the neoplastic Hodgkin/Reed-Sternberg (HRS) cell, which is favored to be derived from germinal center B-cells but has lost many of the B-cell markers."
    explanation: This directly supports the germinal center B-cell origin of the malignant HRS cell.
  downstream:
  - target: Cytokine and Chemokine-Mediated Microenvironment Remodeling
    description: Transformed HRS cells remodel a supportive inflammatory niche.
- name: Mutation-Driven JAK/STAT Activation
  genetic_context:
    variant_origin: SOMATIC
  cell_types:
  - preferred_term: germinal center B cell
    term:
      id: CL:0000844
      label: germinal center B cell
  description: >-
    Recurrent mutations in classic Hodgkin lymphoma activate JAK/STAT signaling
    programs that support tumor-cell survival and cytokine-responsive growth.
  genes:
  - preferred_term: JAK2
    term:
      id: hgnc:6192
      label: JAK2
  - preferred_term: STAT6
    term:
      id: hgnc:11368
      label: STAT6
  biological_processes:
  - preferred_term: cell surface receptor signaling pathway via JAK-STAT
    modifier: INCREASED
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
  evidence:
  - reference: PMID:29340061
    reference_title: "Analysis of the mutational landscape of classic Hodgkin lymphoma identifies disease heterogeneity and potential therapeutic targets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, several variants were consistently detected in genes related to relevant signaling pathways, such as GM-CSF/IL-3, CBP/EP300, JAK/STAT, NF-kappaB, and numerous variants of genes affecting the B-cell receptor (BCR) pathway, such as BTK, CARD11, BCL10, among others."
    explanation: This genomic study directly supports recurrent genetic lesions affecting JAK/STAT signaling in classic Hodgkin lymphoma.
  downstream:
  - target: Cytokine and Chemokine-Mediated Microenvironment Remodeling
    description: JAK/STAT signaling supports inflammatory niche formation.
- name: Mutation-Driven NF-kappaB Activation
  genetic_context:
    variant_origin: SOMATIC
  cell_types:
  - preferred_term: germinal center B cell
    term:
      id: CL:0000844
      label: germinal center B cell
  description: >-
    Recurrent lesions affecting negative regulators and upstream activators of
    NF-kappaB signaling drive constitutive survival signaling in Hodgkin/Reed-Sternberg cells.
    The lesions are of two opposite kinds and both are bound here: destructive
    mutations in the negative regulators TNFAIP3 and NFKBIA, and copy-number
    gains of the positive regulators REL and MAP3K14.
  genes:
  - preferred_term: TNFAIP3
    term:
      id: hgnc:11896
      label: TNFAIP3
  - preferred_term: NFKBIA
    term:
      id: hgnc:7797
      label: NFKBIA
  - preferred_term: REL
    term:
      id: hgnc:9954
      label: REL
  - preferred_term: MAP3K14
    term:
      id: hgnc:6853
      label: MAP3K14
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    modifier: INCREASED
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  evidence:
  - reference: PMID:27221964
    reference_title: "NF-κB deregulation in Hodgkin lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This includes interaction with other cells in the lymphoma microenvironment through CD30, CD40, BCMA and other receptors, but also recurrent somatic genetic lesions in various factors of the NF-κB pathway, including destructive mutations in negative regulators of NF-κB signaling (e.g. TNFAIP3, NFKBIA), and copy number gains of genes encoding positive regulators (e.g. REL, MAP3K14)."
    explanation: This review directly supports recurrent somatic lesions in NF-kappaB pathway regulators, including TNFAIP3 and NFKBIA, as core mechanisms in Hodgkin lymphoma.
  downstream:
  - target: Cytokine and Chemokine-Mediated Microenvironment Remodeling
    description: NF-kappaB signaling sustains the inflammatory tumor niche.
  - target: PD-1 Ligand-Mediated Immune Evasion
    description: Constitutive NF-kappaB signaling cooperates with checkpoint-ligand upregulation to promote immune escape.
- name: EBV LMP1-Mediated NF-kappaB Activation
  conforms_to: "viral_oncogenesis#Host Tumor Suppressor Inactivation and Signaling Hijack"
  description: >-
    In Epstein-Barr virus-positive classic Hodgkin lymphoma, viral latent
    membrane protein 1 mimics active CD40 signaling and drives NF-kappaB
    activation in Hodgkin/Reed-Sternberg cells.
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    modifier: INCREASED
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  evidence:
  - reference: PMID:27221964
    reference_title: "NF-κB deregulation in Hodgkin lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In Epstein-Barr virus-positive cases of classical HL, the virus-encoded latent membrane protein 1 causes NF-κB activation by mimicking an active CD40 receptor."
    explanation: This directly supports EBV LMP1 as a mechanism of NF-kappaB activation in EBV-positive classical Hodgkin lymphoma.
  downstream:
  - target: Cytokine and Chemokine-Mediated Microenvironment Remodeling
    description: EBV-driven NF-kappaB activation reinforces the inflammatory tumor niche.
- name: Cytokine and Chemokine-Mediated Microenvironment Remodeling
  conforms_to: "tumor_promoting_inflammation#Pro-Tumorigenic Inflammatory Microenvironment"
  description: >-
    HRS cells persist within a dense inflammatory infiltrate that they actively
    recruit and shape through cytokine and chemokine signaling.
  biological_processes:
  - preferred_term: chemokine production
    modifier: INCREASED
    term:
      id: GO:0032602
      label: chemokine production
  evidence:
  - reference: PMID:34075767
    reference_title: "Classic Hodgkin Lymphoma - Old Disease, New Directions: An Update on Pathology, Molecular Features and Biological Prognostic Markers."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "HRS cells are scattered within a dense inflammatory infiltrate, and through a network of cytokines and chemokines they shape their microenvironment, evade immune response, survive, and grow."
    explanation: This review directly supports the dependence of classic Hodgkin lymphoma on cytokine and chemokine-mediated microenvironmental remodeling.
  downstream:
  - target: PD-1 Ligand-Mediated Immune Evasion
    description: The inflammatory niche is coupled to ineffective anti-tumor immunity.
  - target: Lymphadenopathy
    description: The HRS-supported inflammatory niche contributes to bulky nodal enlargement.
  - target: Fever
    description: Cytokine-rich tumor inflammation contributes to B symptoms including fever.
  - target: Night Sweats
    description: Cytokine-rich tumor inflammation contributes to B symptoms including night sweats.
  - target: Weight Loss
    description: Cytokine-rich tumor inflammation contributes to systemic B symptoms including weight loss.
- name: PD-1 Ligand-Mediated Immune Evasion
  conforms_to: "immune_checkpoint_blockade#Adaptive Immune Resistance"
  description: >-
    Near-universal 9p24.1 copy gain increases PD-1 ligand expression on HRS
    cells and contributes to immune escape in classic Hodgkin lymphoma. The
    two genes in the amplicon that carry the effect are CD274 (PD-L1) and
    PDCD1LG2 (PD-L2); they are altered concordantly rather than one at a time.
  genes:
  - preferred_term: CD274
    term:
      id: hgnc:17635
      label: CD274
  - preferred_term: PDCD1LG2
    term:
      id: hgnc:18731
      label: PDCD1LG2
  biological_processes:
  - preferred_term: Negative Regulation of T Cell Mediated Immunity
    term:
      id: GO:0002710
      label: negative regulation of T cell mediated immunity
    modifier: INCREASED
  evidence:
  - reference: PMID:31816062
    reference_title: "Genomic analyses of flow-sorted Hodgkin Reed-Sternberg cells reveal complementary mechanisms of immune evasion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HRS cells exhibit near-universal somatic copy gains of chromosome 9p/9p24.1, which increase expression of the programmed cell death protein 1 (PD-1) ligands."
    explanation: This study directly links recurrent 9p24.1 gains in HRS cells to elevated PD-1 ligand expression and immune evasion.
  - reference: PMID:27069084
    reference_title: PD-L1 and PD-L2 Genetic Alterations Define Classical Hodgkin Lymphoma and Predict Outcome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ninety-seven percent of all evaluated cHLs had concordant alterations of the PD-L1 and PD-L2 loci"
    explanation: >-
      Names the two 9p24.1 genes bound on this node and establishes that they are
      altered concordantly, which is why both are recorded rather than CD274 alone.
- name: Mutation-Driven MHC Class I Loss
  genetic_context:
    variant_origin: SOMATIC
  description: >-
    One of two genetically separate antigen-presentation arms, split from its
    class II sibling because the two reach the same immune-evasion endpoint by
    different immunological routes. Recurrent somatic B2M lesions disrupt
    beta-2-microglobulin, the invariant light chain every class I molecule needs
    to reach the cell surface, so HRS cells lose surface MHC class I and with it
    direct CD8 cytotoxic T-cell recognition. This is not the same mechanism as
    checkpoint-ligand-mediated inhibition of the T cells that do still recognise
    the tumour.
  genes:
  - preferred_term: B2M
    term:
      id: hgnc:914
      label: B2M
  cell_types:
  - preferred_term: germinal center B cell
    term:
      id: CL:0000844
      label: germinal center B cell
  biological_processes:
  - preferred_term: antigen processing and presentation of peptide antigen via MHC class I
    modifier: DECREASED
    term:
      id: GO:0002474
      label: antigen processing and presentation of peptide antigen via MHC class I
  evidence:
  - reference: PMID:29394125
    reference_title: Major Histocompatibility Complex Class II and Programmed Death Ligand 1 Expression Predict Outcome After Programmed Death 1 Blockade in Classic Hodgkin Lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hodgkin Reed-Sternberg (HRS) cells evade antitumor immunity by multiple means, including gains of 9p24.1/ CD274(PD-L1)/ PDCD1LG2(PD-L2) and perturbed antigen presentation."
    explanation: >-
      Establishes perturbed antigen presentation as an immune-evasion mechanism in
      cHL separate from the 9p24.1 checkpoint-ligand gains.
  - reference: PMID:29394125
    reference_title: Major Histocompatibility Complex Class II and Programmed Death Ligand 1 Expression Predict Outcome After Programmed Death 1 Blockade in Classic Hodgkin Lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PD-1 receptor blockade is active in classic Hodgkin lymphoma (cHL) despite reported deficiencies of major histocompatibility complex (MHC) class I expression on HRS cells."
    explanation: >-
      Supports loss of MHC class I expression on HRS cells as a reported feature,
      and is the source this node's description is graded against - the paper
      reports deficiencies of class I expression rather than its abolition.
  - reference: PMID:31816062
    reference_title: "Genomic analyses of flow-sorted Hodgkin Reed-Sternberg cells reveal complementary mechanisms of immune evasion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recurrent cHL alterations, including B2M, TNFAIP3, STAT6, GNA13, and XPO1"
    explanation: Places B2M among the recurrent somatic alterations of flow-sorted HRS cells.
  downstream:
  - target: PD-1 Ligand-Mediated Immune Evasion
    description: >-
      Loss of surface class I removes the CD8 cytotoxic recognition arm, so the
      residual anti-tumour response that the checkpoint axis acts on is the
      MHC-class-II-dependent one.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Loss of CD8 cytotoxic T-cell recognition of HRS cells
- name: Mutation-Driven MHC Class II Loss
  genetic_context:
    variant_origin: SOMATIC
  description: >-
    The class II counterpart. CIITA, the MHC class II transactivator, is
    recurrently broken or fused in a subset of classic Hodgkin lymphoma, so class
    II expression is lost and with it CD4 T-cell recognition. This arm is the one
    that bears on treatment: it is HRS-cell MHC class II expression, not class I,
    that predicts complete remission on PD-1 blockade, which is why the two arms
    are curated as separate nodes rather than as one antigen-presentation node.
  genes:
  - preferred_term: CIITA
    term:
      id: hgnc:7067
      label: CIITA
  cell_types:
  - preferred_term: germinal center B cell
    term:
      id: CL:0000844
      label: germinal center B cell
  biological_processes:
  - preferred_term: antigen processing and presentation of peptide antigen via MHC class II
    modifier: DECREASED
    term:
      id: GO:0002495
      label: antigen processing and presentation of peptide antigen via MHC class II
  evidence:
  - reference: PMID:21368758
    reference_title: "MHC class II transactivator CIITA is a recurrent gene fusion partner in lymphoid cancers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "genomic CIITA breaks are highly recurrent in primary mediastinal B-cell lymphoma (38%) and classical Hodgkin lymphoma (cHL) (15%)"
    explanation: Supports recurrent CIITA disruption in classic Hodgkin lymphoma as the lesion behind this node.
  - reference: PMID:21368758
    reference_title: "MHC class II transactivator CIITA is a recurrent gene fusion partner in lymphoid cancers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CIITA is an essential transactivator of MHC class II expression"
    explanation: >-
      Establishes CIITA's role as the transactivator MHC class II expression
      depends on, which is what makes its disruption a class II rather than a
      class I lesion.
  downstream:
  - target: PD-1 Ligand-Mediated Immune Evasion
    description: >-
      Class II status governs what blocking the PD-1 axis can achieve: HRS-cell
      MHC class II expression is what predicts complete remission on PD-1
      blockade, while class I expression is not.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Loss of CD4 T-cell recognition of HRS cells
    evidence:
    - reference: PMID:29394125
      reference_title: Major Histocompatibility Complex Class II and Programmed Death Ligand 1 Expression Predict Outcome After Programmed Death 1 Blockade in Classic Hodgkin Lymphoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In contrast, HRS cell expression of MHC class II was predictive for complete remission."
      explanation: >-
        Supports the directed relation recorded on this edge: class II
        antigen-presentation status, specifically, governs the outcome of blocking
        the PD-1 axis.
    - reference: PMID:29394125
      reference_title: Major Histocompatibility Complex Class II and Programmed Death Ligand 1 Expression Predict Outcome After Programmed Death 1 Blockade in Classic Hodgkin Lymphoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "HRS cell expression of \u03b22-microglobulin/MHC class I was not predictive for complete remission or PFS after nivolumab therapy."
      explanation: >-
        The contrast that motivates splitting the two arms: class I status does
        not predict the outcome that class II status does.

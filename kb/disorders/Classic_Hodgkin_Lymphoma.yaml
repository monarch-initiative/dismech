- name: KLHDC8B
  gene_term:
    preferred_term: KLHDC8B
    term:
      id: hgnc:28557
      label: KLHDC8B
  association: Germline predisposition in familial classic Hodgkin lymphoma
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    The only germline record in this otherwise somatic entry, and the only one
    graded below SOMATIC_DRIVER. KLHDC8B is a midbody kelch protein required for
    cytokinesis, and its loss produces binucleate cells - the morphology that
    defines the Reed-Sternberg cell - so the mechanistic story is unusually
    specific for a predisposition gene. The human genetic evidence is a
    segregating translocation in one pedigree, a 5'-UTR variant associated with
    and segregating in further pedigrees, and LOH in sorted RS cells from one of
    three informative sporadic cases; a 2023 whole-genome study of 36 HL pedigrees
    independently recovered the same 5'-UTR variant among its top four recurrent
    risk variants.

    It is graded SUSCEPTIBILITY rather than CAUSATIVE on three grounds. The
    evidence is a familial risk allele of incomplete penetrance rather than a
    Mendelian lesion; a five-member nodular-sclerosis pedigree with linkage at
    3p21 was sequenced in 2018 and carried no KLHDC8B variant at all, with
    KLHDC8B expression indistinguishable between carriers and non-carriers; and
    the ClinGen gene-validity CSV committed in this repository has no KLHDC8B row
    (`grep '"KLHDC8B",' cache/clingen/gene_validity.csv` returns nothing), so
    there is no expert-panel classification to defer to. The refuting study is
    recorded below as its own evidence item rather than being left out.

    The grading is deliberate and is expected to be flattened by the current KGX
    exporter, which hardcodes `biolink:contributes_to` and never reads
    `relationship_type` (dismech#12320) - so this will export looking like the
    somatic drivers beside it until that is fixed.
  evidence:
  - reference: PMID:19706467
    reference_title: "Mutations in a gene encoding a midbody kelch protein in familial and sporadic classical Hodgkin lymphoma lead to binucleated cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We tested KLHDC8B as a candidate gene for cHL and found that a 5'-UTR polymorphism responsible for decreasing its translational expression is associated with cHL in probands from other families with cHL and segregates with disease in those pedigrees"
    explanation: >-
      The primary human genetic evidence: a KLHDC8B regulatory variant associated
      with and segregating in multiple classic Hodgkin lymphoma pedigrees.
  - reference: PMID:19706467
    reference_title: "Mutations in a gene encoding a midbody kelch protein in familial and sporadic classical Hodgkin lymphoma lead to binucleated cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Depletion of KLHDC8B through RNA interference leads to an increase in binucleated cells, implicating its reduced expression in the formation of cHL's signature RS cell."
    explanation: >-
      Supplies the mechanistic link from reduced KLHDC8B to the binucleate
      Reed-Sternberg morphology.
  - reference: PMID:22988245
    reference_title: The kelch protein KLHDC8B guards against mitotic errors, centrosomal amplification, and chromosomal instability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We recapitulated the major pathologic features of the Reed-Sternberg cell and concluded that KLHDC8B is essential for mitotic integrity and maintenance of chromosomal stability."
    explanation: >-
      Independent functional replication across three cell types, and the reason
      the mechanistic story for this predisposition gene is unusually specific
      for the disease it predisposes to.
  - reference: PMID:35977101
    reference_title: Discovery of novel predisposing coding and noncoding variants in familial Hodgkin lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The top 4 recurrent risk variants are a coding variant in KDR (rs56302315), a 5' untranslated region variant in KLHDC8B (rs387906223)"
    explanation: >-
      Independent whole-genome replication of the KLHDC8B 5'-UTR risk variant
      across 36 Hodgkin lymphoma pedigrees, and the basis for grading the
      relationship as a recurrent risk allele.
  - reference: PMID:29755658
    reference_title: Combined linkage and association analysis of classical Hodgkin lymphoma.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No sequence variants were detected in KLHDC8B, a gene previously suggested as a cause of familial cHL linked to 3p21."
    explanation: >-
      Counter-evidence in a five-member nodular-sclerosis cHL family with linkage
      at 3p21: no KLHDC8B variant was found, and the authors proposed FAM107A and
      SLC26A6 instead. This is why the record is graded SUSCEPTIBILITY and not
      CAUSATIVE.

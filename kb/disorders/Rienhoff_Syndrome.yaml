definitions:
- name: Molecular and clinical diagnosis
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    The diagnosis is established clinically and/or by identification of a
    heterozygous pathogenic variant in a Loeys-Dietz gene; TGFB3 is the causal
    gene for Rienhoff syndrome (Loeys-Dietz syndrome type 5). Because the
    non-vascular presentation lacks aortic findings entirely, molecular testing
    rather than the clinical aortic criteria is what establishes the diagnosis
    at that pole of the spectrum.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of LDS is established in (1) a proband with characteristic
      clinical findings or (2) by the identification of a heterozygous
      pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1, or TGFBR2
    explanation: >-
      GeneReviews specifies the molecular and clinical basis for establishing
      the diagnosis, naming TGFB3 among the causal genes.
references:
- reference: PMID:20301312
  title: "Loeys-Dietz Syndrome."
  tags:
  - GeneReviews
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Rienhoff syndrome is inherited in an autosomal dominant manner. The index
    case arose from a de novo TGFB3 variant, while subsequent reports describe
    multigenerational families with variants segregating with the phenotype.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LDS caused by a pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1,
      or TGFBR2 is inherited in an autosomal dominant manner.
    explanation: >-
      GeneReviews states that TGFB3-related Loeys-Dietz syndrome (Rienhoff
      syndrome / LDS type 5) follows autosomal dominant inheritance.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non‐penetrance seems more common in TGFB2/3 families.
    explanation: >-
      Qualifies the autosomal dominant inheritance: penetrance is reduced in
      TGFB3 families relative to the TGFBR1/2 Loeys-Dietz subtypes, so an
      obligate carrier may be clinically unaffected. This matters for cascade
      testing and for interpreting apparently sporadic presentations.
  - reference: PMID:31898322
    reference_title: "Phenotypic spectrum of TGFB3 disease-causing variants in a Dutch-French cohort and first report of a homozygous patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In familial cases, incomplete penetrance and variable clinical
      expressivity were noted.
    explanation: >-
      Cohort-level confirmation of incomplete penetrance and variable
      expressivity within TGFB3 families.
- name: Gene dosage effect (homozygous state)
  inheritance_term:
    preferred_term: Semidominant inheritance
    term:
      id: HP:0032113
      label: Semidominant inheritance
  description: >-
    Although the disorder is autosomal dominant, a single reported homozygous
    patient had a more severe phenotype than her heterozygous relatives,
    indicating a gene-dosage effect rather than a strictly dominant all-or-none
    mechanism. A separate homozygous exon 2-7 deletion patient likewise
    presented with severe disease including cleft palate. Both are single
    observations and should not be treated as an established recessive form.
  evidence:
  - reference: PMID:31898322
    reference_title: "Phenotypic spectrum of TGFB3 disease-causing variants in a Dutch-French cohort and first report of a homozygous patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our cohort included the first described homozygous patient, who presented
      with a more severe phenotype compared to her heterozygous relatives.
    explanation: >-
      Directly documents the within-family dosage comparison supporting a gene
      dosage effect.
  - reference: PMID:32022420
    reference_title: "Homozygous deletion of exons 2-7 within TGFB3 gene in a child with severe Loeys-Dietz syndrome and Marfan-like features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the first case of a homozygous TGFB3 variant associated
      with a severe LDS5 and Marfan-like presentation.
    explanation: >-
      A second, independent homozygous case with severe disease, consistent
      with a dosage effect.
pathophysiology:
- name: TGFB3 Ligand Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous variants in TGFB3 alter the transforming growth factor beta 3
    ligand. The index p.Cys409Tyr substitution removes the penultimate cysteine
    of the mature ligand, a residue conserved across the whole TGF-beta family
    that forms the cysteine knot required for ligand activity. Other reported
    alleles cluster in the latency-associated peptide domain (p.Arg300Gln,
    p.Arg300Gly). This is the conserved genetic trigger for the syndrome.
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A de novo mutation in TGFB3 was identified by exome sequencing.
    explanation: >-
      Identifies a de novo TGFB3 variant as the causal lesion in the index
      patient.
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This penultimate cysteine is conserved in all TGFB family member ligands
      including orthologues in Caenorhabditis elegans and Drosophila
      melanogaster defining a structure called the “cysteine knot”, a
      conformation essential for normal ligand activity
    explanation: >-
      Explains why loss of Cys409 abolishes ligand function: it destroys the
      cysteine knot required for TGF-beta ligand activity. Tagged OTHER because
      within this publication the statement is a structural/literature
      assertion citing prior crystallographic work (Daopin 1992, Mittl 1996),
      not an experiment reported in this paper.
  downstream:
  - target: Altered TGF-beta Signal Transduction
    description: >-
      The variant ligand changes the amount of TGF-beta signal delivered to
      target tissues.
- name: Altered TGF-beta Signal Transduction
  biological_scale: MOLECULAR
  conforms_to: "aortopathy_tgfbeta_dysregulation#TGF-beta Signaling Dysregulation"
  description: >-
    TGFB3 variants perturb canonical (SMAD2/3) and non-canonical (ERK1/2)
    TGF-beta signal transduction. The direction of the perturbation is
    allele- and tissue-dependent and is the central unresolved issue of the
    syndrome. In the index case the mutant ligand was signalling-dead and
    behaved as a dominant negative, reducing SMAD2 and ERK1/2 phosphorylation
    to roughly 40% and 60% of wild-type levels. In contrast, aortic wall tissue
    from patients with TGFB3-related aortic aneurysm shows paradoxical
    up-regulation of both canonical and non-canonical TGF-beta signalling,
    exactly as seen for variants in TGFBR1/2, SMAD3 and TGFB2.
  biological_processes:
  - preferred_term: SMAD protein signal transduction
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A 1:1 ratio of mutant-to-wild-type TGFB3 RNA diminished the pSMAD2 and
      pERK1/2 signals to approximately 40% and 60%, respectively, of that
      generated by the w-t TGFB3 RNA alone.
    explanation: >-
      Quantifies the dominant negative reduction of canonical (pSMAD2) and
      non-canonical (pERK1/2) TGF-beta signalling by the index allele in
      Xenopus embryos.
  - reference: PMID:25835445
    reference_title: "Mutations in a TGF-β ligand, TGFB3, cause syndromic aortic aneurysms and dissections."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we confirm a paradoxical up-regulation of both canonical and noncanonical
      TGF-β signaling in association with up-regulation of the expression of
      TGF-β ligands.
    explanation: >-
      Documents the opposite direction of effect in aortic tissue from
      TGFB3-variant patients, supporting the node as "altered" signalling while
      leaving the direction allele- and tissue-dependent.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      increased pSMAD2 and CTGF expression was observed in the aortic media of
      patients with either loss‐of‐function TGFB2 or TGFB3 mutations, further
      confirming the paradoxical observation of increased TGF‐β signaling in
      vivo
    explanation: >-
      Key reconciling observation: the very same loss-of-function TGFB3 alleles
      produce increased pSMAD2 and CTGF in the aortic media. This argues the
      apparent contradiction between the reduced-signalling and
      increased-signalling models is tissue-compartment-specific rather than a
      simple allele-direction difference.
  downstream:
  - target: Impaired Mesenchymal Development
    description: >-
      Reduced TGF-beta 3 signalling during early mesenchymal development impairs
      myogenesis and palatogenesis.
    hypothesis_groups:
    - reduced_tgfb3_signaling
  - target: Aortic Medial Degeneration and Wall Weakening
    description: >-
      Dysregulated TGF-beta signalling in the aortic wall drives medial
      degeneration in the vascular presentation of the syndrome.
    hypothesis_groups:
    - paradoxical_aortic_tgfb_upregulation
    evidence:
    - reference: PMID:29392890
      reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        increased pSMAD2 and CTGF expression was observed in the aortic media of
        patients with either loss‐of‐function TGFB2 or TGFB3 mutations
      explanation: >-
        Localises the increased TGF-beta signalling specifically to the aortic
        media of TGFB3-variant patients, supporting this causal edge.
- name: Impaired Mesenchymal Development
  biological_scale: CELLULAR
  description: >-
    TGF-beta 3 is the most abundant TGF-beta isoform in developing skeletal
    muscle and is required for the epithelial-to-mesenchymal transition of the
    dermomyotome that generates myogenic precursors, and for confluence of the
    palatal shelves. Insufficient TGFB3 signalling at these stages is proposed
    to reduce the pool of embryonic muscle precursor cells - producing
    hypomyoplasia with normal muscle architecture rather than a myopathy - and
    to prevent complete palatal fusion.
  biological_processes:
  - preferred_term: epithelial to mesenchymal transition
    term:
      id: GO:0001837
      label: epithelial to mesenchymal transition
    modifier: DECREASED
  evidence:
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Partial or incomplete EMT may diminish the number of embryonic muscle
      precursor cells, ultimately reducing post-natal myofibril mass but not
      affecting muscle architecture.
    explanation: >-
      States the proposed cellular mechanism linking reduced TGFB3 signalling
      to hypomyoplasia with preserved muscle architecture. Downgraded to
      PARTIAL/OTHER because the authors frame this as a hypothesis ("may
      diminish") built on developmental-biology literature rather than an
      observation in their patient; the preserved muscle architecture it
      predicts is separately evidenced by the muscle biopsy.
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TGFB3 is essential for both human palatogenesis and normal muscle growth.
    explanation: >-
      Establishes the two mesenchymal developmental programs that require
      TGFB3.
  downstream:
  - target: Hypomyoplasia and Growth Failure
    description: >-
      A reduced embryonic muscle precursor pool yields low post-natal muscle
      mass and impaired somatic growth.
    evidence:
    - reference: PMID:23824657
      reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Thus, a deficiency of TGFB3 during early myogenesis could result in
        hypomyoplasia throughout development that clinically mimics, but is
        etiologically and histologically distinct from, the myopathy caused by
        excess TGF-β signaling found in MFS.
      explanation: >-
        States the proposed causal link from a developmental TGFB3 deficiency to
        hypomyoplasia, and distinguishes it from Marfan myopathy. Downgraded to
        PARTIAL/OTHER because the authors present this as a candidate mechanism
        ("could result in") reasoned from developmental literature rather than
        demonstrated in the patient.
  - target: Palatal and Craniofacial Malformation
    description: >-
      Failure of palatal shelf confluence produces bifid uvula and cleft palate.
    evidence:
    - reference: PMID:23824657
      reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        TGFB3 is essential for palatal confluence
      explanation: >-
        States the causal requirement for TGFB3 in palatal confluence. Tagged
        OTHER because within this publication the sentence is a literature
        assertion citing mouse developmental work (Nawshad and Hay 2003,
        Proetzel 1995); the primary mouse evidence is cited separately on this
        same edge as PMID:7493021.
    - reference: PMID:7493021
      reference_title: "Transforming growth factor-beta 3 is required for secondary palate fusion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This result demonstrates that TGF-beta 3 affects palatal shelf fusion by
        an intrinsic, primary mechanism rather than by effects secondary to
        craniofacial defects.
      explanation: >-
        Model-organism confirmation that the palatal defect is a direct
        consequence of TGF-beta 3 loss.
- name: Hypomyoplasia and Growth Failure
  biological_scale: ORGANISM
  description: >-
    The muscular phenotype is a developmental deficiency of muscle mass
    (hypomyoplasia) rather than a degenerative myopathy. Muscle biopsy in the
    index patient showed essentially normal fibre size and architecture with no
    dystrophic, inflammatory or fibrotic change, sharply distinguishing it from
    the myopathy of Marfan syndrome. Reduced fetal movement from this deficit is
    the proposed origin of the distal arthrogryposis present at birth.
  evidence:
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distal arthrogryposis indicative of reduced fetal movement suggested an
      inborn error of development affecting muscle mass and other developing
      mesenchymal tissues, including the soft palate.
    explanation: >-
      Links the arthrogryposis to reduced fetal movement caused by the
      developmental muscle deficit.
- name: Palatal and Craniofacial Malformation
  biological_scale: TISSUE
  description: >-
    Failure of complete palatal fusion produces the bifid uvula and cleft palate
    that are among the most consistent findings across the TGFB3 phenotypic
    spectrum, together with hypertelorism and other craniofacial features shared
    with Loeys-Dietz and Shprintzen-Goldberg syndromes.
  evidence:
  - reference: PMID:25835445
    reference_title: "Mutations in a TGF-β ligand, TGFB3, cause syndromic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other systemic features overlap clinically with Loeys-Dietz,
      Shprintzen-Goldberg, and Marfan syndromes, including cleft palate, bifid
      uvula, skeletal overgrowth, cervical spine instability and clubfoot
      deformity.
    explanation: >-
      Documents the craniofacial and skeletal feature set in the TGFB3 cohort.
- name: Aortic Medial Degeneration and Wall Weakening
  biological_scale: TISSUE
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Medial Degeneration and Wall Weakening"
  description: >-
    In the vascular presentation, dysregulated TGF-beta signalling in the aortic
    wall drives medial degeneration and loss of wall integrity, the shared
    tissue-level lesion of the TGF-beta vasculopathies. Notably, and unlike
    other Loeys-Dietz subtypes, striking aortic or arterial tortuosity is not
    part of the TGFB3 phenotype.
  evidence:
  - reference: PMID:25835445
    reference_title: "Mutations in a TGF-β ligand, TGFB3, cause syndromic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In line with previous observations in aortic wall tissues of patients
      with mutations in effectors of TGF-β signaling (TGFBR1/2, SMAD3, and
      TGFB2), we confirm a paradoxical up-regulation of both canonical and
      noncanonical TGF-β signaling
    explanation: >-
      Places TGFB3-related aortic disease in the same aortic-wall TGF-beta
      dysregulation family as the other Loeys-Dietz genes.
  downstream:
  - target: Progressive Aortic Dilation and Aneurysm
    description: >-
      A weakened media dilates progressively under haemodynamic load.
- name: Progressive Aortic Dilation and Aneurysm
  biological_scale: ORGANISM
  conforms_to: "aortopathy_tgfbeta_dysregulation#Progressive Aortic Dilation and Aneurysm"
  description: >-
    Aneurysmal dilation affects the thoracic and/or abdominal aorta and carries
    a risk of dissection and rupture, making early recognition of TGFB3 carriers
    clinically important.
  evidence:
  - reference: PMID:25835445
    reference_title: "Mutations in a TGF-β ligand, TGFB3, cause syndromic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that TGFB3 mutations are associated with significant
      cardiovascular involvement, including thoracic/abdominal aortic aneurysm
      and dissection, and mitral valve disease.
    explanation: >-
      Establishes thoracic and abdominal aortic aneurysm as a core feature of
      TGFB3-related disease.
  downstream:
  - target: Aortic Dissection and Rupture
    description: >-
      Progressive dilation culminates in dissection or rupture.
- name: Aortic Dissection and Rupture
  biological_scale: ORGANISM
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Dissection and Rupture"
  description: >-
    Dissection or rupture of the dilated aorta is the principal cause of
    mortality in the vascular presentation of the syndrome, and the reason
    early molecular diagnosis and surveillance matter.
  evidence:
  - reference: PMID:25835445
    reference_title: "Mutations in a TGF-β ligand, TGFB3, cause syndromic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings emphasize the broad clinical variability associated with
      TGFB3 mutations and highlight the importance of early recognition of the
      disease because of high cardiovascular risk.
    explanation: >-
      States the high cardiovascular risk that motivates early recognition.
mechanistic_hypotheses:
- hypothesis_group_id: paradoxical_aortic_tgfb_upregulation
  hypothesis_label: Paradoxical aortic TGF-beta up-regulation (vasculopathy model)
  status: CANONICAL
  description: >-
    In patients with TGFB3-related aortic aneurysm, aortic wall tissue shows
    paradoxical up-regulation of canonical and non-canonical TGF-beta signalling
    together with increased TGF-beta ligand expression, mirroring the pattern in
    TGFBR1/2-, SMAD3- and TGFB2-related disease. Under this model the aortopathy
    arises from excess, not deficient, aortic TGF-beta signalling. This is the
    canonical model for the vascular presentation and is the mechanism shared
    with the `aortopathy_tgfbeta_dysregulation` module.
  evidence:
  - reference: PMID:25835445
    reference_title: "Mutations in a TGF-β ligand, TGFB3, cause syndromic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we confirm a paradoxical up-regulation of both canonical and noncanonical
      TGF-β signaling in association with up-regulation of the expression of
      TGF-β ligands.
    explanation: >-
      Directly documents increased aortic TGF-beta signalling in TGFB3-variant
      patients.
- hypothesis_group_id: reduced_tgfb3_signaling
  hypothesis_label: Reduced TGF-beta 3 signalling (hypomorphic / dominant negative model)
  status: ALTERNATIVE
  description: >-
    In the index patient the TGFB3 p.Cys409Tyr allele encoded a signalling-dead
    ligand that acted as a dominant negative, reducing canonical and
    non-canonical TGF-beta signalling. Under this model the phenotype
    (hypomyoplasia, growth retardation, distal arthrogryposis, bifid uvula, no
    vascular disease) follows from insufficient TGFB3 activity during
    mesenchymal development. Recorded as ALTERNATIVE relative to the aortopathy
    model not because the evidence is weaker - it is direct functional evidence
    - but because it is the minority explanatory model within the Loeys-Dietz
    framing and applies to a different allele class and tissue compartment.
  evidence:
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Several lines of evidence indicate the mutation is hypomorphic,
      suggesting that decreased TGFB signaling from a loss of TGFB3 activity is
      likely responsible for the clinical phenotype.
    explanation: >-
      States the reduced-signalling conclusion for the index phenotype - the
      inference neither arm-specific sentence makes on its own. Tagged OTHER
      because it is the authors' synthesis pooling both functional arms rather
      than the report of a single experiment; the two items below cite each arm
      separately so that every experimental item carries one evidence_source.
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We conclude that the mutant allele encodes a TGFB3 ligand that is not
      functional.
    explanation: >-
      The cell-based arm: HEK293T-expressed, immunoprecipitated mutant ligand
      applied to a p3TP-Lux TGF-beta reporter generated no transcriptional
      signal, establishing that the p.Cys409Tyr ligand is signalling-dead.
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We conclude that in the frog system the mutant TGFB3G1226A allele, when
      co-expressed with w-t TGFB3, has a dominant negative effect on TGF-β
      signaling measured by pSMAD2 and pERK1/2, but does not affect signaling by
      BMP2/4/7 ligands measured by pSMAD1.
    explanation: >-
      The whole-organism arm, and the direct evidence for the dominant-negative
      claim in this hypothesis description: co-expression with wild-type TGFB3
      in Xenopus embryos reduced canonical (pSMAD2) and non-canonical (pERK1/2)
      signalling while leaving BMP/pSMAD1 signalling intact, showing the effect
      is specific to the TGF-beta arm rather than general toxicity.
discussions:
- discussion_id: tgfb3_signaling_direction
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    How can a single gene, TGFB3, produce both a reduced-signalling phenotype
    with no vascular disease and an aortopathy characterised by paradoxically
    increased TGF-beta signalling - is the difference allele-specific,
    tissue-specific, or both?
  attaches_to:
  - pathophysiology#Altered TGF-beta Signal Transduction
  rationale: >-
    The two anchor papers for this syndrome reach opposite conclusions about the
    direction of the signalling defect. Rienhoff et al. showed a signalling-dead,
    dominant negative p.Cys409Tyr ligand that reduced pSMAD2 and pERK1/2, in a
    patient with normal echocardiograms through age 8 and no aortic disease.
    Bertoli-Avella et al. found paradoxical up-regulation of canonical and
    non-canonical TGF-beta signalling in aortic tissue of TGFB3-variant patients
    with aneurysms and dissections. A third report notes that the codon 300
    (latency-associated peptide domain) variants presumably lead to increased
    TGF-beta signalling and are associated with tall stature, whereas the
    Cys409Tyr loss-of-function allele produced growth retardation - suggesting
    that stature itself may read out the direction of the signalling change.
    Whether allele class, tissue context, or the well-described paradoxical
    aortic response to upstream TGF-beta pathway loss reconciles these findings
    is unresolved, and it directly determines whether TGF-beta-directed therapy
    would be expected to help or harm a given patient. The strongest reconciling
    datum so far is that loss-of-function TGFB3 alleles are themselves
    associated with increased pSMAD2 and CTGF in the aortic media, which points
    to a tissue-compartment-specific rather than an allele-direction
    explanation - but that observation has not been paired with matched
    skeletal-muscle data from the same patients, so it does not close the
    question.
  evidence:
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      increased pSMAD2 and CTGF expression was observed in the aortic media of
      patients with either loss‐of‐function TGFB2 or TGFB3 mutations, further
      confirming the paradoxical observation of increased TGF‐β signaling in
      vivo
    explanation: >-
      Shows that loss-of-function TGFB3 alleles nonetheless raise aortic
      TGF-beta signalling, favouring a tissue-specific over an allele-direction
      resolution of the controversy.
  - reference: PMID:26184463
    reference_title: "Exome sequencing identifies a novel heterozygous TGFB3 mutation in a disorder overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutations at codon Arg300 presumably lead to increased TGF-beta
      signalling, suggesting that the short or tall stature seen in patients
      with TGFB3 mutations may result from opposing effects of mutations on
      TGF-beta signalling.
    explanation: >-
      Proposes that opposing directions of signalling change explain the
      opposite growth phenotypes across TGFB3 alleles, framing the controversy.
  proposed_experiments:
  - experiment_id: exp_tgfb3_allele_class_signalling_panel
    name: Allele-class by cell-type signalling panel for TGFB3 variants
    description: >-
      Assay canonical (pSMAD2/3) and non-canonical (pERK1/2) signalling output
      for a panel of TGFB3 alleles - cysteine-knot (p.Cys409Tyr), LAP-domain
      (p.Arg300Gln, p.Arg300Gly) and haploinsufficiency - in matched primary
      aortic smooth muscle cells and skeletal myoblasts derived from patient
      induced pluripotent stem cells, to test whether the direction of effect
      tracks with allele class, with cell type, or with both.
  - experiment_id: exp_tgfb3_genotype_phenotype_stratification
    name: Allele-stratified genotype-phenotype survey of the TGFB3 cohort
    description: >-
      Systematically collect aortic imaging and stature data across the reported
      TGFB3 cohort stratified by allele class, to test the prediction that
      LAP-domain variants associate with tall stature and aortopathy while
      cysteine-knot loss-of-function alleles associate with growth retardation
      and spared vasculature.
- discussion_id: tgfb3_vascular_risk_in_nonvascular_presentation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the lifetime aortic risk for an individual carrying a
    loss-of-function TGFB3 allele who presents with the muscular and skeletal
    phenotype and has normal aortic imaging in childhood?
  attaches_to:
  - pathophysiology#Progressive Aortic Dilation and Aneurysm
  rationale: >-
    The index patient had yearly echocardiograms from 18 months with normal
    aortic root dimensions at 6.5 years, and uncertainty about her vascular risk
    was explicitly named as a principal clinical concern. Because the same gene
    causes aneurysms and dissections in other families, it is not known whether
    childhood-normal imaging in a loss-of-function carrier predicts lifelong
    freedom from aortopathy or merely later onset. This gap has direct
    surveillance consequences for a rare disorder in which no natural-history
    cohort spanning both presentations exists.
  evidence:
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The principal clinical concerns for this patient have been growth
      retardation, weakness related to decreased muscle mass and uncertainty
      about her risk for vascular disease.
    explanation: >-
      Names the unresolved vascular risk in the non-vascular presentation as an
      explicit clinical concern.
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The full phenotypic spectrum and natural history of TGFB3 mutations must
      await other cases
    explanation: >-
      The authors state explicitly that the natural history is unknown.
  proposed_experiments:
  - experiment_id: exp_tgfb3_natural_history_registry
    name: International TGFB3 natural-history registry with protocolised imaging
    description: >-
      Establish an international TGFB3 registry with protocolised aortic imaging
      (echocardiography plus whole-arterial-tree magnetic resonance or computed
      tomography angiography) and longitudinal follow-up, stratified by allele
      class, to derive age-specific cumulative aortic-event risk for carriers
      who are imaging-normal in childhood.
- discussion_id: lds_wide_features_not_confirmed_for_tgfb3
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which of the Loeys-Dietz syndrome features catalogued gene-agnostically by
    GeneReviews - cerebral aneurysm, craniosynostosis, strabismus, the cutaneous
    triad of velvety translucent skin, easy bruising and dystrophic scars, and
    the allergic/inflammatory and gastrointestinal predisposition - actually
    occur in TGFB3-related disease?
  attaches_to:
  - pathophysiology#Palatal and Craniofacial Malformation
  rationale: >-
    The only GeneReviews chapter covering this disorder is the gene-agnostic
    Loeys-Dietz syndrome chapter, which pools findings across SMAD2, SMAD3,
    TGFB2, TGFB3, TGFBR1, TGFBR2 and IPO8. The two TGFB3-specific primary
    sources do not report cerebral aneurysm, craniosynostosis or the
    allergic/inflammatory phenotype, and the index patient is explicitly
    described as having skin of normal texture, tension and wound healing -
    a direct contrast with the LDS cutaneous triad. Arterial tortuosity, a
    hallmark of other LDS subtypes, is likewise absent from the TGFB3
    phenotype. This entry therefore curates only features with TGFB3-specific
    evidence and does not import the remaining LDS-wide features, but whether
    their absence reflects genuine gene-specific sparing or merely the small
    published cohort is unresolved. It matters because gene-agnostic LDS
    surveillance protocols (for example cerebrovascular imaging) may be either
    over- or under-inclusive for TGFB3 carriers.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Wide variation in the distribution and severity of clinical features can
      be seen in individuals with LDS, even among affected individuals within a
      family who have the same pathogenic variant.
    explanation: >-
      GeneReviews itself flags that feature distribution varies widely, which is
      why LDS-wide features cannot be assumed to apply to TGFB3 carriers.
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Her skin had normal texture, tension, and wound healing.
    explanation: >-
      The index patient explicitly lacked the LDS cutaneous findings, supporting
      the decision not to import them into this entry.
  proposed_experiments:
  - experiment_id: exp_tgfb3_gene_specific_feature_audit
    name: Gene-stratified feature audit across the Loeys-Dietz gene panel
    description: >-
      Re-analyse existing multicentre Loeys-Dietz cohorts with per-gene
      stratification and protocolised ascertainment of cerebrovascular imaging,
      dermatological examination, and allergic/gastrointestinal history, to
      determine which LDS features are genuinely shared across all causal genes
      and which are gene-specific. Report TGFB3 carriers separately rather than
      pooled.
- discussion_id: tgfb3_mouse_null_vs_human_heterozygote
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the homozygous Tgfb3-null mouse, the only well-characterised model for
    this disease, faithfully model a human disorder in which essentially every
    patient is heterozygous and many alleles are hypomorphic or motif-specific
    rather than complete nulls?
  attaches_to:
  - pathophysiology#Impaired Mesenchymal Development
  - pathophysiology#Palatal and Craniofacial Malformation
  rationale: >-
    The dose mismatch is the core issue: the mouse evidence for the palatal
    mechanism comes from biallelic nulls, whereas human Rienhoff syndrome is
    autosomal dominant and heterozygous. Human alleles are also mechanistically
    varied (cysteine-knot disruption, RKKR furin-cleavage-motif disruption,
    latency-associated peptide domain substitutions), so a complete null is not
    an obvious surrogate for any of them. The direction of effect diverges too:
    the mouse null is a pure loss of ligand, while human loss-of-function
    alleles are associated with increased pSMAD2 in the aortic media. The mouse
    is nonetheless the strongest available support for the palatogenesis
    mechanism, and the congenic-background series offers a real mechanistic
    parallel to human reduced penetrance - so this is a translational-validity
    caveat on an otherwise well-evidenced node, not an absence of evidence.
  evidence:
  - reference: PMID:7493021
    reference_title: "Transforming growth factor-beta 3 is required for secondary palate fusion."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice lacking TGF-beta 3 exhibit an incompletely penetrant failure of the
      palatal shelves to fuse leading to cleft palate.
    explanation: >-
      The supporting palatal evidence comes from complete-null mice, not from a
      heterozygous model matching the human genotype.
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A second de novo mutation was found in TGFB3 (c.1226G>A; pC409Y).
    explanation: >-
      Confirms the human disease genotype is a heterozygous missense allele, not
      the biallelic null modelled in mouse.
  proposed_experiments:
  - experiment_id: exp_tgfb3_heterozygous_knockin_mouse
    name: Allele-matched heterozygous Tgfb3 knock-in mouse series
    description: >-
      Generate heterozygous mouse lines carrying the orthologous human alleles
      (cysteine-knot p.Cys409Tyr, an RKKR-motif variant, and a
      latency-associated peptide domain variant) rather than a null, and
      phenotype palate, skeletal muscle mass and aortic wall in parallel.
      Compare each line's SMAD2 phosphorylation in palate, muscle and aorta to
      test whether one genotype can reproduce both the muscular and the
      vascular arms of the human disease.
differential_diagnoses:
- name: Marfan syndrome
  disease_term:
    preferred_term: Marfan syndrome
    term:
      id: MONDO:0007947
      label: Marfan syndrome
  description: >-
    Shares aortic aneurysm, arachnodactyly, pectus deformity, pes planus, joint
    hyperextensibility and low muscle mass. The index Rienhoff patient was
    explicitly evaluated against and did not meet Marfan diagnostic criteria.
  distinguishing_features:
  - >-
    Marfan syndrome is caused by FBN1 variants and features ectopia lentis,
    which is not part of the TGFB3 phenotype.
  - >-
    Bifid uvula and cleft palate point away from Marfan and toward the
    Loeys-Dietz spectrum.
  - >-
    The muscle histopathology differs decisively: Marfan myopathy shows
    endomysial thickening, fat deposition, split fibres and fibrosis, whereas
    TGFB3-related hypomyoplasia shows essentially normal fibre size and
    architecture.
  evidence:
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proposita did not meet the diagnostic criteria established for MFS,
      BHS or LDS.
    explanation: >-
      Documents that the index patient was assessed against, and failed to meet,
      Marfan, Beals-Hecht and Loeys-Dietz criteria.
- name: Loeys-Dietz syndrome (other genetic subtypes)
  disease_term:
    preferred_term: Loeys-Dietz syndrome
    term:
      id: MONDO:0018954
      label: Loeys-Dietz syndrome
  description: >-
    The TGFBR1-, TGFBR2-, SMAD2-, SMAD3-, TGFB2- and IPO8-related subtypes share
    hypertelorism, bifid uvula/cleft palate, skeletal features and aortic
    aneurysm, and are distinguished only by molecular testing.
  distinguishing_features:
  - >-
    Striking aortic and arterial tortuosity, characteristic of the other
    Loeys-Dietz subtypes, is not present in TGFB3-related disease.
  - >-
    TGFB3-related disease uniquely encompasses a non-vascular pole with
    hypomyoplasia and distal arthrogryposis.
  - >-
    Definitive discrimination requires identification of the causal gene.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

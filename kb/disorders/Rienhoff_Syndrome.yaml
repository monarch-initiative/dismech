histopathology:
- name: Hypomyoplasia with Preserved Muscle Architecture
  description: >-
    Quadriceps muscle biopsy in the index patient showed a normal checkerboard
    pattern with type 1 fibre predominance and only mild, focal type 1 fibre
    disproportion consistent with disuse. Critically, there was no endomysial
    thickening, fat deposition, fibre splitting or fibrosis - the changes that
    characterise the myopathy of Marfan syndrome - establishing the muscle
    lesion as a developmental deficiency of muscle mass rather than a
    degenerative myopathy.
  evidence:
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A muscle biopsy showed essentially normal fiber size and architecture.
      There was no evidence of chronic dystrophic or inflammatory changes
      presenting a strikingly different histologic picture compared to the
      myopathic findings in congenital or classical MFS
    explanation: >-
      Direct human muscle histology distinguishing TGFB3-related hypomyoplasia
      from Marfan myopathy.
  notes: >-
    No finding_term is bound because the HistopathologyFindingTerm dynamic enum
    is reachable only from selected NCIT branches plus HP:0025461, and neither
    NCIT nor that HPO branch offers a term for developmental hypomyoplasia with
    preserved architecture.
genetic:
- name: TGFB3
  gene_term:
    preferred_term: TGFB3
    term:
      id: hgnc:11769
      label: TGFB3
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous variants in TGFB3, encoding the transforming growth factor beta
    3 ligand, cause Rienhoff syndrome (Loeys-Dietz syndrome type 5). Reported
    alleles fall into at least two mechanistic classes. The index de novo
    c.1226G>A (p.Cys409Tyr) variant lies in the last exon and destroys the
    cysteine knot of the mature ligand, producing a signalling-dead protein that
    acts as a dominant negative. A second class of variants affects codon 300 of
    the latency-associated peptide domain (p.Arg300Gln, p.Arg300Gly) and is
    proposed to increase TGF-beta signalling; these have been associated with
    overgrowth and tall stature rather than growth retardation. Additional
    variants were identified across 11 families with syndromic aortic aneurysms.
  evidence:
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A second de novo mutation was found in TGFB3 (c.1226G>A; pC409Y).
      Validation by Sanger sequencing confirmed that this mutation was de novo
      in the proband.
    explanation: >-
      Identifies and validates the causal de novo TGFB3 variant in the index
      patient.
  - reference: PMID:25835445
    reference_title: "Mutations in a TGF-β ligand, TGFB3, cause syndromic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on 43 patients from 11 families with syndromic
      presentations of aortic aneurysms caused by TGFB3 mutations.
    explanation: >-
      Establishes TGFB3 as a cause of syndromic aortic aneurysm across multiple
      independent families.
  - reference: PMID:26184463
    reference_title: "Exome sequencing identifies a novel heterozygous TGFB3 mutation in a disorder overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We detected a novel heterozygous mutation in TGFB3, c.898C>G, predicting
      the missense substitution p.Arg300Gly. Sanger sequencing confirmed the
      mutation and its segregation with the phenotype.
    explanation: >-
      Documents a second allele class with familial segregation, supporting
      autosomal dominant TGFB3-related disease.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of the TGFB3 mutations consist of missense mutations (60%),
      whereas 20% are frameshift mutations, 13% are nonsense mutations, and 7%
      of mutations affect a splice site.
    explanation: >-
      Quantifies the TGFB3 variant-class distribution across the reported
      mutation set.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For TGFB3, 35% of mutations affect the RKKR‐motif.
    explanation: >-
      Identifies the RKKR furin-cleavage motif - required to release the mature
      ligand from the latency-associated peptide - as the principal mutational
      hotspot in TGFB3.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Remarkably, of the 23 currently known TGFB3 mutations, three substitute
      histidine for aspartic acid at amino acid position 263.
    explanation: >-
      Documents a recurrent p.Asp263His substitution accounting for three of 23
      reported TGFB3 mutations, raising a possible founder effect.
  - reference: ORPHA:60030
    reference_title: "Loeys-Dietz syndrome (Orphanet)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TGFB3 | transforming growth factor beta 3 | hgnc:11769 | Disease-causing germline mutation(s) in"
    explanation: >-
      Orphanet curates TGFB3 as a disease-causing gene within the Loeys-Dietz
      syndrome group.
animal_models:
- species: Mouse (Mus musculus)
  genotype: Homozygous Tgfb3 null (Tgfb3-/-)
  category: Knockout
  genes:
  - preferred_term: Tgfb3
    term:
      id: hgnc:11769
      label: TGFB3
  associated_phenotypes:
  - Cleft palate
  - Failure of palatal shelf fusion
  description: >-
    The Tgfb3-null mouse is the primary model for the palatal arm of the
    syndrome. It shows an incompletely penetrant failure of palatal shelf
    fusion producing cleft palate, caused by impaired adhesion of the apposing
    medial edge epithelia and failure to eliminate the mid-line epithelial
    seam. Critically, no other craniofacial abnormalities accompany it,
    establishing that TGF-beta 3 acts on palatal fusion by an intrinsic,
    primary mechanism rather than secondarily to a craniofacial malformation -
    the model-organism support for the "Palatal and Craniofacial Malformation"
    node. Note the model is a complete biallelic null, whereas human patients
    are heterozygous; see discussion `tgfb3_mouse_null_vs_human_heterozygote`.
  evidence:
  - reference: PMID:7493021
    reference_title: "Transforming growth factor-beta 3 is required for secondary palate fusion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice lacking TGF-beta 3 exhibit an incompletely penetrant failure of the
      palatal shelves to fuse leading to cleft palate. The defect appears to
      result from impaired adhesion of the apposing medial edge epithelia of
      the palatal shelves and subsequent elimination of the mid-line epithelial
      seam.
    explanation: >-
      Establishes the cellular mechanism by which TGF-beta 3 loss causes failed
      palatal fusion.
  - reference: PMID:7493021
    reference_title: "Transforming growth factor-beta 3 is required for secondary palate fusion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      No craniofacial abnormalities were observed. This result demonstrates
      that TGF-beta 3 affects palatal shelf fusion by an intrinsic, primary
      mechanism rather than by effects secondary to craniofacial defects.
    explanation: >-
      Shows the palatal defect is primary rather than a downstream consequence
      of craniofacial malformation.
- species: Mouse (Mus musculus)
  genotype: Tgfb3 knockout congenic strains on five genetic backgrounds
  category: Knockout
  background: Five different congenic genetic backgrounds
  genes:
  - preferred_term: Tgfb3
    term:
      id: hgnc:11769
      label: TGFB3
  associated_phenotypes:
  - Cleft palate
  description: >-
    Congenic Tgfb3-knockout strains carrying the identical defective Tgfb3
    allele on five different genetic backgrounds show different cleft palate
    phenotypes, tracking with each strain's capacity to disintegrate the medial
    edge epithelium and basement membrane. This is a mechanistic model-organism
    parallel for the reduced and variable penetrance observed in human TGFB3
    families, though it does not by itself identify a human modifier locus.
  evidence:
  - reference: PMID:32603777
    reference_title: "Genetic background influences the capacity for medial edge epithelium disintegration and phenotype of cleft palate in TGFβ3 knockout mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although the five congenic strains carried the same defective Tgfb3
      gene, the fetal palate phenotypes differed among strains.
    explanation: >-
      Demonstrates genetic-background modulation of the Tgfb3-null phenotype,
      a candidate explanation for variable expressivity in human carriers.

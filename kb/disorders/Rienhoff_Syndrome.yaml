name: Rienhoff Syndrome
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
description: >
  Rienhoff syndrome, also designated Loeys-Dietz syndrome type 5 (LDS5), is a
  rare autosomal dominant connective tissue disorder caused by heterozygous
  variants in TGFB3, the gene encoding the transforming growth factor beta 3
  ligand. It occupies an unusual position within the heritable thoracic aortic
  disease spectrum because the reported phenotype is strikingly bimodal. The
  index patient (Rienhoff et al., 2013) presented at birth with distal
  arthrogryposis, hypotonia, bifid uvula, marked growth retardation and a
  failure of normal post-natal muscle development, but with no vascular disease;
  the causal p.Cys409Tyr allele was shown to be a signalling-dead, dominant
  negative ligand that reduces TGF-beta signalling. Two years later a large
  multicentre study (Bertoli-Avella et al., 2015) described 43 patients from 11
  families in whom TGFB3 variants caused syndromic thoracic and abdominal aortic
  aneurysms and dissections with mitral valve disease, alongside craniofacial
  and skeletal features overlapping Loeys-Dietz, Shprintzen-Goldberg and Marfan
  syndromes (cleft palate, bifid uvula, skeletal overgrowth, cervical spine
  instability and clubfoot). Unlike other Loeys-Dietz subtypes, striking aortic
  or arterial tortuosity is not a feature. The syndrome therefore spans a
  muscular and skeletal presentation without vascular disease at one pole and a
  high-cardiovascular-risk aortopathy at the other, and the reconciliation of
  the reduced-signalling and paradoxically-increased-signalling models remains
  an open mechanistic question.

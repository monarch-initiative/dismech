- name: Arrhythmogenic right ventricular cardiomyopathy type 1 (ARVD1)
  disease_term:
    preferred_term: arrhythmogenic right ventricular dysplasia 1
    term:
      id: MONDO:0007152
      label: arrhythmogenic right ventricular dysplasia 1
  description: >-
    A mechanistically and clinically distinct disease caused by variants in the
    same gene. ARVD1 arises from TGFB3 *regulatory* variants in the untranslated
    regions that increase TGFB3 expression, and manifests as fibrofatty
    replacement of right ventricular myocardium with arrhythmia and sudden-death
    risk - not as a connective tissue or aortic disorder. Included here as a
    curation guard: TGFB3 gene-disease assertions must be attributed to the
    correct entity, since a coding-region variant implies Rienhoff syndrome
    while a regulatory-region variant implies ARVD1.
  distinguishing_features:
  - >-
    ARVD1 is caused by regulatory (untranslated-region) TGFB3 variants that
    increase promoter/UTR activity, whereas Rienhoff syndrome is caused by
    coding-region variants altering the ligand itself.
  - >-
    ARVD1 presents with right ventricular fibrofatty replacement, ventricular
    arrhythmia and sudden death, without the craniofacial, skeletal or
    aortic-aneurysm features of Rienhoff syndrome.
  evidence:
  - reference: PMID:15639475
    reference_title: "Regulatory mutations in transforming growth factor-beta3 gene cause arrhythmogenic right ventricular cardiomyopathy type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified TGFbeta3 as the disease gene involved in ARVD1.
    explanation: >-
      Establishes TGFB3 as the ARVD1 gene, a separate disease entity from
      Rienhoff syndrome despite the shared locus.
  - reference: PMID:15639475
    reference_title: "Regulatory mutations in transforming growth factor-beta3 gene cause arrhythmogenic right ventricular cardiomyopathy type 1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro expression assays with constructs containing the mutations
      showed that mutated UTRs were twofold more active than wild-types.
    explanation: >-
      Shows the ARVD1 mechanism is increased expression driven by regulatory
      variants, distinct from the coding-variant ligand defect of Rienhoff
      syndrome.

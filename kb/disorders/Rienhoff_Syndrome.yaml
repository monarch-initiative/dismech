  evidence:
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a syndrome presenting at birth with distal arthrogryposis,
      hypotonia, bifid uvula
    explanation: >-
      Establishes presentation at birth in the muscular phenotype.
- phase: Infancy and childhood
  age_range: Infancy to childhood
  notes: >-
    Growth failure and gross motor delay dominate childhood in the muscular
    presentation. In the index patient, yearly echocardiograms from 18 months
    and aortic measurements at 6.5 years remained normal, and digit contractures
    persisted but hand function was good by age 9.
  evidence:
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Yearly echocardiograms beginning at 18 months showed no cardiac defect or
      dysfunction.
    explanation: >-
      Documents the absence of cardiac involvement through childhood in the
      index patient.
- phase: Adulthood
  age_range: Adulthood
  notes: >-
    In the vascular presentation, aortic aneurysms progress with age and carry a
    high risk of dissection, motivating early molecular recognition and lifelong
    arterial surveillance.
  evidence:
  - reference: PMID:25835445
    reference_title: "Mutations in a TGF-β ligand, TGFB3, cause syndromic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      highlight the importance of early recognition of the disease because of
      high cardiovascular risk
    explanation: >-
      Supports progressive, high-risk cardiovascular disease as the adult course
      of the vascular presentation.
  - reference: PMID:29392890
    reference_title: "A mutation update on the LDS-associated genes TGFB2/3 and SMAD2/3."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The aortic phenotype in patients with SMAD3 mutations is very similar to
      TGFBR1/2 patients, whereas TGFB2 and TGFB3 cardiovascular features tend
      to be milder, although severe aortic presentation at young age has also
      been observed.
    explanation: >-
      Qualifies the adult vascular course: TGFB3 cardiovascular disease tends to
      be milder than TGFBR1/2- or SMAD3-related Loeys-Dietz syndrome, but the
      milder average does not exclude severe early presentations, so
      surveillance is not relaxed on genotype alone.
  - reference: PMID:31898322
    reference_title: "Phenotypic spectrum of TGFB3 disease-causing variants in a Dutch-French cohort and first report of a homozygous patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dissection involving distal aortic segments occurred in two patients at
      age 50 and 52 years.
    explanation: >-
      Dates the observed dissections to the sixth decade and localises them to
      distal aortic segments - later and more distal than the classic
      Loeys-Dietz pattern of early proximal dissection, and the reason
      surveillance must cover the whole aorta rather than the root alone.
treatments:
- name: Arterial-Tree Imaging Surveillance
  description: >-
    Serial echocardiography of the aortic root and ascending aorta together with
    magnetic resonance or computed tomography angiography of the entire arterial
    tree. Because TGFB3-related disease involves the abdominal as well as the
    thoracic aorta, surveillance cannot be confined to the aortic root.
  action_category: MONITORING
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Echocardiography to monitor the status of the aortic root and ascending
      aorta (at least annually) and magnetic resonance angiography or
      computerized tomography angiography to assess the entire arterial tree
    explanation: >-
      GeneReviews specifies the whole-arterial-tree surveillance regimen for
      Loeys-Dietz syndrome, which includes TGFB3-related LDS type 5.
- name: Beta-Adrenergic Blocker Therapy
  description: >-
    Beta-adrenergic receptor blockers reduce haemodynamic stress on the aortic
    wall with the aim of slowing aneurysm progression.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      angiotensin receptor blockers, beta-adrenergic receptor blockers, or
      other medications are used to reduce hemodynamic stress
    explanation: >-
      GeneReviews documents beta-adrenergic receptor blockade to reduce
      haemodynamic stress in Loeys-Dietz syndrome.
- name: Angiotensin Receptor Blocker Therapy
  description: >-
    Angiotensin receptor blockers such as losartan are used to reduce
    haemodynamic stress in Loeys-Dietz syndrome. Their role in Rienhoff syndrome
    is uncertain and direction-dependent: a three-year trial of losartan in the
    index patient produced no change in muscle strength or mass, consistent with
    a pathophysiology of reduced rather than excess TGF-beta signalling in that
    allele class.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: losartan
      term:
        id: CHEBI:6541
        label: losartan
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      angiotensin receptor blockers, beta-adrenergic receptor blockers, or
      other medications are used to reduce hemodynamic stress
    explanation: >-
      GeneReviews documents angiotensin receptor blockade for haemodynamic
      stress reduction in Loeys-Dietz syndrome.
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At age 3 years, a 3-year trial of losartan at a dose of up to 2.0
      mg/kg/day produced no change in muscle strength or mass
    explanation: >-
      A prolonged losartan trial failed to improve the muscular phenotype in the
      index patient, arguing against TGF-beta blockade for the
      reduced-signalling presentation.
  notes: >-
    The muscular phenotype and the aortopathy may require opposite therapeutic
    logic; see discussion `tgfb3_signaling_direction`. Angiotensin receptor
    blockers are contraindicated in pregnancy.
- name: Prophylactic Aortic Surgery
  description: >-
    Aneurysms are amenable to early and aggressive surgical repair; prophylactic
    intervention at appropriate thresholds prevents dissection and rupture.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      aneurysms are amenable to early and aggressive surgical intervention
    explanation: >-
      GeneReviews documents early aggressive surgical repair of aneurysms in
      Loeys-Dietz syndrome.
- name: Physical and Occupational Therapy
  description: >-
    Physical and occupational therapy with orthotic support addresses the
    contractures, hypotonia and motor delay of the muscular presentation. The
    index patient received both from six months of age and wore foot orthoses
    from age two, retaining functional hand use despite persistent digit
    contractures.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:23824657
    reference_title: "A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation, distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband had physical and occupational therapy since the age 6 months,
      and has worn orthotic foot appliances since age 2. Although digit
      contractures persist, at age 9 she has very functional hands.
    explanation: >-
      Documents the rehabilitative management and its functional outcome in the
      index patient.
- name: Activity Restriction and Avoidance of Cardiovascular Stimulants
  description: >-
    Individuals with Loeys-Dietz syndrome are advised to avoid contact and
    competitive sports and isometric exercise, and agents that stimulate the
    cardiovascular system including routine decongestants and triptans for
    migraine. This is the LDS-wide "agents/circumstances to avoid" guidance;
    it applies to TGFB3 carriers with demonstrated aortic involvement, and its
    applicability to the non-vascular presentation with normal serial imaging
    has not been separately studied.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Contact sports, competitive sports, and
      isometric exercise; agents that stimulate the cardiovascular system
      including routine use of decongestants or triptan medications for the
      management of migraine headache
    explanation: >-
      GeneReviews lists the activities and agents to avoid in Loeys-Dietz
      syndrome, which includes TGFB3-related LDS type 5.
- name: Pregnancy and Peripartum Aortic Surveillance
  description: >-
    Pregnancy and the postpartum period are high-risk intervals in Loeys-Dietz
    syndrome, with increased risk of aortic dissection or rupture and of uterine
    rupture, so aortic imaging is intensified during gestation and in the weeks
    after delivery and medical therapy is reviewed for fetal safety.
  action_category: MONITORING
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Curated as management rather than as a phenotype. The evidence is
    Loeys-Dietz-syndrome-wide GeneReviews guidance covering TGFB3-related LDS
    type 5, not TGFB3-specific data. Angiotensin receptor blockers are
    contraindicated in pregnancy and must be withdrawn before or at conception;
    see the notes on "Angiotensin Receptor Blocker Therapy".
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pregnancy and the postpartum period can be dangerous for women with LDS
      because of increased risk of aortic dissection/rupture and uterine
      rupture. Increased frequency of aortic imaging is recommended, both
      during pregnancy and in the weeks following delivery.
    explanation: >-
      GeneReviews documents the peripartum aortic-catastrophe and
      uterine-rupture risk in Loeys-Dietz syndrome and the intensified imaging
      schedule it warrants.
- name: Genetic Counseling
  description: >-
    Autosomal dominant inheritance with a 50% recurrence risk for offspring, and
    a high de novo rate among Loeys-Dietz probands, make genetic counseling and
    cascade testing of at-risk relatives central to management.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome (GeneReviews)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each child of an individual with LDS has a 50% chance of inheriting the
      pathogenic variant and the disorder.
    explanation: >-
      GeneReviews states the recurrence risk that underpins genetic counseling.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Rienhoff syndrome is ultra-rare and no population prevalence has been
    established. Two multi-family series anchor the case count: 43 patients from
    11 families ascertained from a cohort of 470 index cases with thoracic
    aortic aneurysm, and a separate Dutch-French cohort of 32 patients from 17
    families carrying 11 disease-causing variants. Additional isolated families
    and the index case have been reported separately. Because the disorder shows
    reduced penetrance, ascertained case counts almost certainly understate the
    number of variant carriers.
  evidence:
  - reference: PMID:31898322
    reference_title: "Phenotypic spectrum of TGFB3 disease-causing variants in a Dutch-French cohort and first report of a homozygous patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eleven (eight novel) TGFB3 disease-causing variants were identified in 32
      patients (17 families).
    explanation: >-
      Provides the second sizeable case count for TGFB3-related disease;
      population prevalence remains undetermined.
  - reference: PMID:25835445
    reference_title: "Mutations in a TGF-β ligand, TGFB3, cause syndromic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on 43 patients from 11 families with syndromic
      presentations of aortic aneurysms caused by TGFB3 mutations.
    explanation: >-
      Provides the only sizeable case count available for TGFB3-related disease;
      population prevalence remains undetermined.

  - reference: PMID:3485517
    reference_title: "The electroretinographic characteristics of congenital tritan defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with the response of normal subjects, a marked reduction or a lack
      of the blue cone responses was clearly shown in the spectral response
      patterns of tritanopes.
    explanation: >-
      Spectral ERG shows reduced or absent blue cone responses.
    quote_role: PRIMARY_RESULT
  - reference: PMID:3485517
    reference_title: "The electroretinographic characteristics of congenital tritan defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electroretinograms elicited by strong white stimulation or xenon flashes

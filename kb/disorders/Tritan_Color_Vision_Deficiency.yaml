name: Tritan Color Vision Deficiency
creation_date: "2026-10-14T20:49:40Z"
category: Mendelian
parents:
- Color vision disorder
- Inherited retinal disease
description: >-
  Autosomal dominant blue-yellow (tritan) colour vision deficiency caused by
  heterozygous variants in OPN1SW, the chromosome 7 gene encoding the
  short-wavelength-sensitive (S, "blue") cone opsin. Unlike the X-linked
  red-green defects, it affects males and females equally. Six missense
  substitutions (L56P, G79R, T190I, S214P, P264S, R283Q) and an intron 3 splice
  donor deletion have been reported in affected families. Penetrance is
  incomplete and expressivity is variable: relatives sharing a variant range from
  apparently normal colour vision to tritanopia, and error scores rise with age.
  Adaptive optics imaging of an R283Q family showed absence of S cones in the
  older, tritanopic carrier but a normal S-cone mosaic in his mildly affected
  daughter, so in heterozygotes the defect is thought to be a slowly progressive
  S-cone dystrophy, attributed to dominant-negative effects of the mutant opsin,
  rather than a stationary congenital trait. A splice allele that halves S-opsin
  dosage gives a milder defect, consistent with haploinsufficiency. Visual
  acuity and the ophthalmic examination are normal, Ishihara plates do not detect
  the defect, and no disease-specific treatment has been reported.
disease_term:
  preferred_term: blue color blindness

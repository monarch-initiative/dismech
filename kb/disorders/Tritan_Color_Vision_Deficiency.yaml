genetic:
- name: OPN1SW
  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: OPN1SW
    term:
      id: hgnc:1012
      label: OPN1SW
  inheritance:
  - name: Autosomal dominant
  notes: >-
    Heterozygous missense variants and one intron 3 splice-donor deletion. The
    authors of the T190I report state that every amino acid substitution in OPN1SW
    observed to date has been disease causing. Family C of the original P264S
    study segregated both P264S and the intron 3 deletion; the deletion was first
    judged not to cause tritanopia and was later shown to disrupt splicing and to
    segregate with a mild tritan defect in another family. No ClinGen
    gene-disease validity assertion is recorded here; none was looked up.
  evidence:
  - reference: PMID:1531728
    reference_title: "Human tritanopia associated with two amino acid substitutions in the blue-sensitive opsin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      to detect in four of nine unrelated tritanopic subjects two different point
      mutations in the gene encoding the blue-sensitive opsin, each leading to an
      amino acid substitution
    explanation: >-
      OPN1SW missense variants found in tritanopic probands.
    quote_role: PRIMARY_RESULT
  - reference: PMID:23022137
    reference_title: "Substitution of isoleucine for threonine at position 190 of S-opsin causes S-cone-function abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All mutations in the OPN1SW gene that result in an amino acid substitution
      that have been observed to date are disease causing
    explanation: >-
      Authors' summary that all reported OPN1SW substitutions cause tritan
      defects.
    quote_role: PRIMARY_RESULT
  variants:
  - name: p.Leu56Pro (L56P)
    type: missense
    description: >-
      Found heterozygous in a 30-year-old man with a mild tritan defect; absent
      from 564 control OPN1SW genes.
    evidence:
    - reference: PMID:16961973
      reference_title: "A novel mutation in the short-wavelength-sensitive cone pigment gene associated with a tritan color vision defect."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        He was found to be heterozygous for a mutation that caused the amino acid
        proline to be substituted in place of a highly conserved leucine at amino
        acid position 56 in the S cone opsin.
      explanation: >-
        Identifies L56P in a tritan proband.
      quote_role: PRIMARY_RESULT
  - name: p.Gly79Arg (G79R)
    type: missense
    description: >-
      One of the two substitutions found in the founding genotype study of
      tritanopia. Also found in a sister and father in a Japanese family
      segregating homozygous PDE6C achromatopsia, where the authors suggested it
      might explain the sister's complete rather than incomplete achromatopsia.
    evidence:
    - reference: PMID:25605338
      reference_title: "Congenital Achromatopsia and Macular Atrophy Caused by a Novel Recessive PDE6C Mutation (p.E591K)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We also identified an OPN1SW mutation (p.G79R), which is associated with
        congenital tritan deficiencies, in the sister and the father but not in
        the brother.
      explanation: >-
        G79R observed in a second, unrelated family; the possible modifier effect
        on achromatopsia severity is the authors' suggestion only.
      quote_role: PRIMARY_RESULT
    - reference: PMID:23022137
      reference_title: "Substitution of isoleucine for threonine at position 190 of S-opsin causes S-cone-function abnormalities."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Five mutations in the S-cone-opsin gene (OPN1SW) that give rise to
        different single amino-acid substitutions (L56P, G79R, S214P, P264S,
        R283Q) are known to be associated with tritan color-vision deficiency.
      explanation: >-
        Lists G79R among the tritan-associated OPN1SW substitutions.
      quote_role: BACKGROUND
  - name: p.Thr190Ile (T190I)
    type: missense
    description: >-
      Segregates with tritan errors in one family (nine heterozygous relatives);
      the only reported variant in extracellular loop II rather than a
      transmembrane helix.
    evidence:
    - reference: PMID:23022137
      reference_title: "Substitution of isoleucine for threonine at position 190 of S-opsin causes S-cone-function abnormalities."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Affected family members were heterozygous for a nucleotide change that
        substituted the amino acid isoleucine (I) in place of threonine (T) that is
        normally present at position 190 of the S-opsin.
      explanation: >-
        Identifies T190I in affected relatives.
      quote_role: PRIMARY_RESULT
  - name: p.Ser214Pro (S214P)
    type: missense
    description: >-
      The second substitution found in the founding genotype study of tritanopia.
    evidence:
    - reference: PMID:23022137
      reference_title: "Substitution of isoleucine for threonine at position 190 of S-opsin causes S-cone-function abnormalities."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Five mutations in the S-cone-opsin gene (OPN1SW) that give rise to
        different single amino-acid substitutions (L56P, G79R, S214P, P264S,
        R283Q) are known to be associated with tritan color-vision deficiency.
      explanation: >-
        Lists S214P among the tritan-associated OPN1SW substitutions.
      quote_role: BACKGROUND
  - name: p.Pro264Ser (P264S)
    type: missense
    description: >-
      Associated with tritanopia in heterozygotes; reported separately as a third
      tritan substitution.
    evidence:
    - reference: PMID:32400513
      reference_title: "Tritan color vision deficiency may be associated with an OPN1SW splicing defect and haploinsufficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Members of family C who had the P264S and a normal allele had tritanopia
      explanation: >-
        P264S heterozygotes had tritanopia.
      quote_role: BACKGROUND
  - name: p.Arg283Gln (R283Q)
    type: missense
    description: >-
      Heterozygous in a father with tritanopia and in his two children, who had a
      mild defect or none detected on standard tests; adaptive optics showed absent
      S cones in the father.
    evidence:
    - reference: PMID:17429491
      reference_title: "Adaptive optics retinal imaging reveals S-cone dystrophy in tritan color-vision deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All 29 control subjects were homozygous for arginine.
      explanation: >-
        R283Q was absent from the 29 controls sequenced alongside the family.
      quote_role: PRIMARY_RESULT
  - name: OPN1SW intron 3 +5G deletion (exon 3 splice donor)
    type: splice donor variant
    description: >-
      Deletion of the G five nucleotides into intron 3, disrupting the exon 3
      splice donor; in vitro it yields only a transcript lacking exons 2 and 3,
      with a frameshift and premature stop. Heterozygotes in one family had a mild
      tritan defect.
    evidence:
    - reference: PMID:32400513
      reference_title: "Tritan color vision deficiency may be associated with an OPN1SW splicing defect and haploinsufficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Direct sequencing of this product revealed that it represents a single
        isoform that lacks exons 2 and 3, and contains exon 1, 4 and 5 spliced
        together
      explanation: >-
        Splicing assay shows the allele yields only an exon 2-3 skipped transcript.
      quote_role: PRIMARY_RESULT
diagnosis:
- name: Tritan-sensitive colour vision testing
  description: >-
    Tests with a tritan axis (Hardy-Rand-Rittler tritan plates, Farnsworth-Munsell
    100-Hue, Lanthony desaturated D15, Cambridge Colour Test, Moreland
    anomaloscope) detect the defect. Ishihara plates test only red-green
    discrimination and are passed. Mild defects in young carriers can be missed
    under standard photopic conditions and become evident at low luminance.
  diagnosis_term:
    preferred_term: colour vision testing
    term:
      id: NCIT:C156778
      label: Vision Assessment
  evidence:
  - reference: PMID:17429491
    reference_title: "Adaptive optics retinal imaging reveals S-cone dystrophy in tritan color-vision deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He made no errors on the Ishihara pseudoisochromatic plates, nor on the
      Medmont C100
    explanation: >-
      A tritanope passed the Ishihara plates, which do not test the tritan axis.
    quote_role: PRIMARY_RESULT
  - reference: PMID:23022137
    reference_title: "Substitution of isoleucine for threonine at position 190 of S-opsin causes S-cone-function abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the tritan color-vision deficiency associated with the T190I mutation may
      indeed go unnoticed if younger subjects only are tested with the FM100-Hue
      test
    explanation: >-
      Standard photopic testing can miss mild defects in young carriers.
    quote_role: PRIMARY_RESULT
- name: S-cone electroretinography
  description: >-
    The blue cone ERG is reduced or unrecordable in tritanopes and separates
    congenital tritan defects from dominant optic atrophy.
  diagnosis_term:
    preferred_term: S-cone electroretinography
    term:
      id: NCIT:C101217
      label: Retinal Examination
  evidence:
  - reference: PMID:3876823
    reference_title: "Differential diagnosis of congenital tritanopia and dominantly inherited juvenile optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We believe that congenital tritanopia and DIJOA are distinct disease
      entities and that the blue cone ERG is a key factor in the differential
      diagnosis.
    explanation: >-
      Recommends the blue cone ERG for differential diagnosis.
    quote_role: PRIMARY_RESULT
- name: OPN1SW sequencing
  description: >-
    Sequencing the coding exons and flanking intron sequence of OPN1SW identifies
    the causal variant and allows testing of relatives, who may be mildly
    affected or unaware of a defect.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:16961973
    reference_title: "A novel mutation in the short-wavelength-sensitive cone pigment gene associated with a tritan color vision defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We tested the hypothesis that his color vision impairment was due to a
      mutation in the S cone photopigment gene.
    explanation: >-
      OPN1SW sequencing was used to identify the cause of a tritan defect.
    quote_role: PRIMARY_RESULT
differential_diagnoses:
- name: Autosomal dominant optic atrophy
  description: >-
    Dominantly inherited juvenile optic atrophy also produces tritan errors and was
    once thought to be the same entity as congenital tritanopia.
  disease_term:
    preferred_term: autosomal dominant optic atrophy
    term:
      id: MONDO:0008134
      label: autosomal dominant optic atrophy, classic form
  distinguishing_features:
  - Blue cone ERG within the normal range.
  - Optic atrophy, which can be ruled out in tritan pedigrees.
  evidence:
  - reference: PMID:3876823
    reference_title: "Differential diagnosis of congenital tritanopia and dominantly inherited juvenile optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The blue cone ERG confirmed a difference between the two groups; it was
      unrecordable in the patients with congenital tritanopia but within the
      normal range in those with DIJOA.
    explanation: >-
      The blue cone ERG distinguishes the two conditions.
    quote_role: PRIMARY_RESULT
  - reference: PMID:6606981
    reference_title: "Tritan pedigree without optic-nerve atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report describes the results of testing 34 members of a pedigree
      (including four tritans) for whom optic atrophy can be ruled out
    explanation: >-
      A tritan pedigree without optic atrophy shows the two are separable.
    quote_role: PRIMARY_RESULT
- name: Blue cone monochromacy
  description: >-
    X-linked loss of L- and M-cone function in which S cones remain; the reverse
    of the tritan defect despite the similar name.
  disease_term:
    preferred_term: blue cone monochromacy
    term:
      id: MONDO:0010563
      label: blue cone monochromacy
  distinguishing_features:
  - X-linked inheritance.
  - L- and M-cone function absent while S-cone function is retained.
  evidence:
  - reference: PMID:15312026
    reference_title: "Molecular genetics of colour vision deficiencies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Blue cone monochromacy is a rare form of colour vision deficiency that
      results from mutations that abolish function of both the L and M pigment
      genes.
    explanation: >-
      Defines blue cone monochromacy as loss of L and M pigment function.
    quote_role: REVIEW_SYNTHESIS
- name: Autosomal dominant cone dystrophy with early tritanopia (16q12 IRXB duplication)
  description: >-
    Tandem duplications of the IRXB gene cluster (IRX5, IRX6) on chromosome 16q12
    cause an autosomal dominant progressive cone dystrophy whose earliest sign is
    a tritan colour vision defect, so the inheritance pattern and the first
    colour vision finding mimic the OPN1SW disorder. No specific MONDO term was
    found, so the general cone dystrophy term is bound.
  disease_term:
    preferred_term: autosomal dominant cone dystrophy with early tritanopia
    term:
      id: MONDO:0000455
      label: cone dystrophy
  distinguishing_features:
  - Progressive cone dystrophy with declining visual acuity and central vision loss.
  - Copy-number gain at 16q12 rather than an OPN1SW sequence variant.
  evidence:
  - reference: PMID:33891002
    reference_title: "A duplication on chromosome 16q12 affecting the IRXB gene cluster is associated with autosomal dominant cone dystrophy with early tritanopic color vision defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients presented with a unique progressive cone dystrophy phenotype
      hallmarked by early tritanopic color vision defects.
    explanation: >-
      A dominant cone dystrophy that begins with tritan defects is a genetic
      phenocopy of the early OPN1SW phenotype.
    quote_role: PRIMARY_RESULT
animal_models:
- name: Opn1sw Neo/Neo S-opsin-null mouse
  species: Mouse (Mus musculus)
  genotype: Opn1sw(Neo/Neo), neomycin cassette inserted between exons 3 and 4 of Opn1sw
  publication: PMID:21219924
  description: >-
    Mouse lacking S-opsin expression. It is not a model of a human tritan allele:
    it carries no missense or splice variant and is homozygous null, and most
    mouse cones co-express M and S opsin. It is recorded because its cones survive
    without S-opsin, which bears on the mechanism of S-cone loss.
  modeled_mechanisms:
  - target: Progressive S-Cone Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Cones lacking S-opsin remain viable for at least 1.5 years, so loss of
      S-opsin alone does not reproduce S-cone death.
    limitations: >-
      A null allele cannot test the proposed dominant-negative toxicity of a
      mutant human S-opsin, and mouse cones that co-express M opsin are not
      equivalent to human S cones, which express S opsin alone.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The human lesion is a heterozygous missense or splice allele; the mouse
        has no S-opsin at all, so a toxic mutant protein, the proposed cause of
        S-cone death, is absent.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Most mouse cones co-express M and S opsin in dorso-ventral gradients,
        whereas the human S cone expresses only S opsin, so a mouse cone losing
        S-opsin keeps a photopigment and the human S cone would not.
    evidence:
    - reference: PMID:21219924
      reference_title: "A mouse M-opsin monochromat: retinal cone photoreceptors have increased M-opsin expression when S-opsin is knocked out."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        cones of the Opn1sw(Neo/Neo) mouse remain viable for at least 1.5 yrs,
        even though many ventral cones do not form outer segments
      explanation: >-
        S-opsin-null cones survive long term.
      quote_role: PRIMARY_RESULT
    - reference: PMID:21219924
      reference_title: "A mouse M-opsin monochromat: retinal cone photoreceptors have increased M-opsin expression when S-opsin is knocked out."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Most C57Bl/6 mouse cones co-express both opsins, but in dorso-ventral
        counter-gradients, with M-opsin dominant in the dorsal retina and S-opsin
        in the ventral retina, and S-opsin 4-fold greater overall.
      explanation: >-
        Documents the opsin co-expression that limits the model.
      quote_role: BACKGROUND

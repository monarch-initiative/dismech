- name: Loss of S-Cone Opponent (Blue-Yellow) Signal
  description: >-
    Blue-yellow (tritan) colour discrimination depends on comparing S-cone signals
    with combined L- and M-cone signals. When the S-cone signal is weak, colours
    along the tritan confusion axis are confused; when it is absent, vision along
    that axis is dichromatic. Red-green discrimination is unaffected. Left
    unbound to GO: the nearest process term, GO:0007601 visual perception, is
    broader than S-cone opponent comparison.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:23022137
    reference_title: "Substitution of isoleucine for threonine at position 190 of S-opsin causes S-cone-function abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The performance of subjects with the T190I mutation was significantly
      different from that of normal trichromats along the tritan vector under all
      conditions tested (Mann-Whitney U: p<0.05), but not along the protan or
      deutan vectors.
    explanation: >-
      The discrimination deficit is confined to the tritan axis.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Tritan Color Vision Defect
    causal_link_type: DIRECT
    description: >-
      A weakened S-cone opponent signal produces tritan colour confusions.
  - target: Tritanopia
    causal_link_type: DIRECT
    description: >-
      An absent S-cone signal leaves dichromatic vision along the tritan axis.
  - target: Abnormal Hardy-Rand-Rittler Tritan Plates
    causal_link_type: DIRECT
    description: >-
      The tritan screening plates detect failures of S-cone opponent
      discrimination.
phenotypes:
- name: Tritan Color Vision Defect
  category: Ophthalmologic
  description: >-
    Impaired discrimination of colours along the blue-yellow (tritan) axis with
    normal red-green discrimination, of variable severity among carriers. Error
    scores on the Farnsworth-Munsell 100-Hue test increase with age, and an
    affected adult reported confusing orange-yellow with pink. A dichromatic
    versus anomalous-trichromatic subdivision is not useful for tritan defects;
    anomalous tritan colour matches have been attributed to rod intrusion.
  notes: >-
    HP:0000552 Tritanomaly is bound for the tritan defect as a whole because HPO
    lists blue-yellow color blindness and blue-yellow dyschromatopsia as its
    exact synonyms; HPO places it under anomalous trichromacy, and the
    dichromatic form is recorded separately below.
  phenotype_term:
    preferred_term: Tritan color vision defect
    term:
      id: HP:0000552
      label: Tritanomaly
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:16961973
    reference_title: "A novel mutation in the short-wavelength-sensitive cone pigment gene associated with a tritan color vision defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      made errors on standard color vision tests consistent with the presence of a
      mild tritan color vision deficiency
    explanation: >-
      Mild tritan defect in an L56P heterozygote.
    quote_role: PRIMARY_RESULT
  - reference: PMID:23022137
    reference_title: "Substitution of isoleucine for threonine at position 190 of S-opsin causes S-cone-function abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FM100-Hue error scores increase with increasing age
    explanation: >-
      Within the T190I family, severity rises with age.
    quote_role: PRIMARY_RESULT
  - reference: PMID:17429491
    reference_title: "Adaptive optics retinal imaging reveals S-cone dystrophy in tritan color-vision deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He reported that he could not remember having any problems with color vision
      when he was younger, and it was only in recent years that he has experienced
      difficulties with discriminating between some colors such as orange-yellow
      and pink.
    explanation: >-
      Late-recognised, progressive colour confusion reported by a tritanopic
      carrier.
    quote_role: PRIMARY_RESULT
  - reference: PMID:32400513
    reference_title: "Tritan color vision deficiency may be associated with an OPN1SW splicing defect and haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the mutant is associated with tritan color vision deficiency that is mild
      compared to the P264S mutation
    explanation: >-
      The splice allele gives a milder tritan defect than the P264S missense
      allele.
    quote_role: PRIMARY_RESULT
  - reference: PMID:3872255
    reference_title: "The genetics of tritan disturbances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Evidence is presented that it is--in contradistinction to the
      X-chromosomally inherited red-green defects--incorrect to make a subdivision
      between dichromasia (tritanopia) and anomalous trichromasia (tritanomaly).
    explanation: >-
      Family data argue against splitting tritanopia from tritanomaly.
    quote_role: PRIMARY_RESULT
  - reference: PMID:17429491
    reference_title: "Adaptive optics retinal imaging reveals S-cone dystrophy in tritan color-vision deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the anomalous trichromatic tritan phenotype has instead been attributed to
      the involvement of rods in the color match made by tritan subjects
    explanation: >-
      Anomalous tritan matches reflect rod intrusion rather than a shifted S
      pigment.
    quote_role: REVIEW_SYNTHESIS
- name: Tritanopia
  category: Ophthalmologic
  description: >-
    Tritan dichromacy: colour matching and discrimination as if no S-cone class
    were present. Seen in homozygotes and in older or more severely affected
    heterozygotes; many tritans who are dichromatic with a small (1 degree) field
    are not dichromatic with a larger field. HPO has no tritanopia term, so the
    general dichromacy term is bound.
  phenotype_term:
    preferred_term: Tritanopia
    term:
      id: HP:0011518
      label: Dichromacy
  evidence:
  - reference: PMID:17429491
    reference_title: "Adaptive optics retinal imaging reveals S-cone dystrophy in tritan color-vision deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The father's behavior on all color-vision tests was that of a tritanope.
    explanation: >-

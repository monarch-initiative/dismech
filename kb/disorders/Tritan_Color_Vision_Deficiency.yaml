- name: Misfolded Mutant S-Opsin
  description: >-
    Mutant S-opsin is predicted to misfold or be unstable. Because each S cone
    expresses both OPN1SW alleles, whereas each L or M cone expresses a single
    X-linked opsin gene, mutant and normal S-opsin are made in the same cell,
    which allows a dominant-negative interaction of the kind seen with dominant
    rhodopsin mutations. No folding or trafficking assay of a tritan allele has
    been reported in the sources cited here.

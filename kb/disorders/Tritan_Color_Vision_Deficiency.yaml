mechanistic_hypotheses:
- hypothesis_group_id: dominant_negative_s_cone_degeneration
  hypothesis_label: Dominant-negative mutant S-opsin causing progressive S-cone degeneration
  status: EMERGING
  description: >-
    Each S cone expresses both autosomal OPN1SW alleles. Missense substitutions in
    the transmembrane helices are predicted to disturb folding, processing or
    stability of the opsin, and by analogy with dominant rhodopsin mutations in
    retinitis pigmentosa the mutant opsin is proposed to interfere with the
    normal one and reduce S-cone viability. S cones are then lost over years, so
    severity depends on disease stage, and heterozygotes need not be dichromatic
    until enough S cones have died. Supported by adaptive optics imaging of one
    R283Q family and by error scores that rise with age in several families.
  evidence:
  - reference: PMID:17429491
    reference_title: "Adaptive optics retinal imaging reveals S-cone dystrophy in tritan color-vision deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S-opsin mutations that cause autosomal dominant tritan color-vision
      deficiencies are analogous to rhodopsin mutations that cause autosomal
      dominant retinitis pigmentosa in which dominant negative interactions
      between normal and mutant pigments expressed in the same photoreceptor lead
      to the death of the affected photoreceptor.
    explanation: >-
      States the dominant-negative degeneration model proposed from the imaging
      results.
    quote_role: PRIMARY_RESULT
  - reference: PMID:17429491
    reference_title: "Adaptive optics retinal imaging reveals S-cone dystrophy in tritan color-vision deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most individuals with inherited tritan deficiencies are heterozygous and,
      according to the hypothesis supported by the experimental data presented
      here, they need not exhibit complete dichromacy until the disorder has
      progressed to a stage when a critical number of S cones have lost viability.
    explanation: >-
      Links the variable, age-dependent phenotype to progressive S-cone loss.
    quote_role: PRIMARY_RESULT
- hypothesis_group_id: opn1sw_haploinsufficiency
  hypothesis_label: OPN1SW haploinsufficiency reducing S-cone photopigment
  status: EMERGING
  description: >-
    For the intron 3 splice-donor deletion, the mutant allele produces a
    transcript skipping exons 2 and 3 that cannot encode functional opsin, so
    heterozygous S cones are expected to contain about half the normal opsin.
    Because S cones already receive few photons after lens and macular pigment
    absorption, halving photopigment is proposed to reduce S-cone signals enough
    to give a mild tritan defect. Supported by an in vitro splicing assay and one
    three-person family.
  evidence:
  - reference: PMID:32400513
    reference_title: "Tritan color vision deficiency may be associated with an OPN1SW splicing defect and haploinsufficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Due to the splicing defect in the exon 3 +5G deletion OPN1SW allele,
      affected subjects are expected to have S cones with half the normal amount
      of S opsin, and the mechanism of tritan color vision deficiency caused by
      this mutation must be haploinsufficiency.
    explanation: >-
      Haploinsufficiency inferred from the splicing assay result.
    quote_role: PRIMARY_RESULT
pathophysiology:
- name: Heterozygous Germline OPN1SW Variant
  description: >-
    The initiating lesion is a heterozygous germline variant in OPN1SW
    (chromosome 7), the gene for the S-cone opsin. Reported alleles are missense
    substitutions (L56P, G79R, T190I, S214P, P264S, R283Q), all except T190I in
    transmembrane helices, and an intron 3 splice-donor deletion. The alleles
    were found in tritan probands or families; where controls were screened, the
    variants were absent from them.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: OPN1SW
    term:
      id: hgnc:1012
      label: OPN1SW
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    allele_type: missense or splice-site
  evidence:
  - reference: PMID:1531728
    reference_title: "Human tritanopia associated with two amino acid substitutions in the blue-sensitive opsin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Segregation analysis within pedigrees and hybridization of oligonucleotides
      specific for each allele to DNA samples from control subjects support the
      hypothesis that these mutations cause tritanopia.
    explanation: >-
      Segregation and control screening support OPN1SW missense variants as the
      cause of tritanopia.
    quote_role: PRIMARY_RESULT
  - reference: PMID:16961973
    reference_title: "A novel mutation in the short-wavelength-sensitive cone pigment gene associated with a tritan color vision defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation was absent in 564 S cone photopigment genes from 282 subjects
      who did not make tritan errors.
    explanation: >-
      The L56P allele is absent from a large control series.
    quote_role: PRIMARY_RESULT
  - reference: PMID:23022137
    reference_title: "Substitution of isoleucine for threonine at position 190 of S-opsin causes S-cone-function abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five mutations in the S-cone-opsin gene (OPN1SW) that give rise to different
      single amino-acid substitutions (L56P, G79R, S214P, P264S, R283Q) are known
      to be associated with tritan color-vision deficiency.
    explanation: >-
      Lists the missense alleles reported before T190I.
    quote_role: BACKGROUND
  - reference: PMID:15312026
    reference_title: "Molecular genetics of colour vision deficiencies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Tritanopia is also a rare autosomal dominant colour vision defect caused by
      mutations in the S pigment gene located on chromosome 7.
    explanation: >-

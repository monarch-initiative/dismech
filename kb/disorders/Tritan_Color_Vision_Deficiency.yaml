notes: >-
  Scope and naming. The MONDO term (OMIM:190900, Orphanet:88629) is labelled blue
  color blindness and its definition and synonyms describe tritanopia, but this
  entry covers the whole inherited tritan series (tritanopia and milder tritan
  defects) caused by OPN1SW variants. Acquired tritan defects (for example from
  lens yellowing, glaucoma, diabetic retinopathy, drug toxicity or dominant optic
  atrophy) are out of scope; they are not OPN1SW disorders. Lump/split:
  tritanopia and tritanomaly are not split into subtypes, because a six-family
  study found a continuum of test results within families and judged a
  dichromatic versus anomalous-trichromatic subdivision incorrect for tritan
  defects, and because anomalous tritan colour matches have been attributed to
  rod intrusion rather than to a spectrally shifted S pigment (both cited on the
  phenotypes below). Relation to blue cone monochromacy: the names are easily
  confused but the disorders are opposites. Blue cone monochromacy (its own
  entry, Blue_Cone_Monochromacy, MONDO:0010563) is an X-linked loss of L- and
  M-cone function in which S cones remain, whereas the tritan defect is an
  autosomal dominant loss of S-cone function with normal L and M cones.
  Relation to the red-green defects: the protan and deutan defects
  (Protan_Color_Vision_Deficiency and the deutan stub) arise from the X-linked
  OPN1LW/OPN1MW array and are separate diseases. Mechanism status: OPN1SW
  causation rests on segregation in a small number of families plus absence of
  the variants in controls; the dominant-negative S-cone degeneration model
  rests on adaptive optics imaging of one R283Q family, and haploinsufficiency
  on an in vitro splicing assay of one allele, so both are recorded as emerging
  hypotheses. The T190I family's loss of S-cone sensitivity at low retinal
  illuminance was tentatively attributed by its authors to constitutive
  activation of cone transducin; that suggestion has no direct test and is not
  modelled as a node. Not cited, and why: the original P264S report
  (PMID:1386496) and the early pedigree papers PMID:13249225, PMID:14128207,
  PMID:4542649, PMID:4540298, PMID:4546850 and PMID:310059 returned no abstract
  or full text on the fetches made, so nothing in them could be quoted; P264S is
  cited through the later papers that describe it. No GeneReviews chapter exists
  for tritan colour vision deficiency (just check-genereviews against the
  Bookshelf index plus a live PubMed genereviews[book] title search). Animal
  models: a PubMed search for (OPN1SW OR "S-opsin" OR "blue opsin" OR
  "blue-sensitive opsin" OR "short-wavelength-sensitive opsin" OR "blue cone
  pigment") AND (mutation OR variant OR tritan OR misfold* OR dominant), run on
  2026-10-14, returned no animal carrying a human tritan OPN1SW allele; the
  S-opsin-null mouse is recorded under animal_models only for what it shows
  about S-cone survival. Course: some secondary sources describe the disorder as
  congenital and stationary, partly on the strength of S-opsin-null mouse cones
  surviving. The human adaptive optics and family age data cited here point to
  slow progression in heterozygotes, and a null allele does not test the
  dominant-negative model, so the entry records the course as progressive.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    OPN1SW lies on chromosome 7, so the defect affects males and females equally
    and is transmitted as an autosomal dominant trait. Penetrance is incomplete and
    expressivity variable: heterozygous relatives with the same variant differ in
    severity, from passing standard tests to tritanopia, and severity tends to
    increase with age. Rare homozygotes have been reported within two pedigrees.
  evidence:
  - reference: PMID:1531728
    reference_title: "Human tritanopia associated with two amino acid substitutions in the blue-sensitive opsin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tritanopia is an autosomal dominant genetic disorder of human vision
      characterize by a selective deficiency of blue spectral sensitivity.
    explanation: >-
      States the autosomal dominant inheritance of tritanopia in the founding
      genotype study.
    quote_role: BACKGROUND
  - reference: PMID:3872255
    reference_title: "The genetics of tritan disturbances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tritan (blue-green) colour vision disturbances have been found in 79
      individuals in six families, revealing an autosomal dominant mode of
      inheritance with a wide variability of test results within families.
    explanation: >-
      Six-family pedigree study establishing autosomal dominant transmission and
      variable expressivity within families.
    quote_role: PRIMARY_RESULT
  - reference: PMID:23022137
    reference_title: "Substitution of isoleucine for threonine at position 190 of S-opsin causes S-cone-function abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The deficiency affects males and females equally and shows an autosomal
      dominant inheritance pattern.
    explanation: >-
      Equal sex distribution and dominant transmission, as expected for an
      autosomal gene.
    quote_role: BACKGROUND
  - reference: PMID:17429491
    reference_title: "Adaptive optics retinal imaging reveals S-cone dystrophy in tritan color-vision deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disorder exhibits incomplete penetrance, meaning that individuals with
      the same underlying mutation manifest different degrees of color-vision
      impairment, even within a sibship.
    explanation: >-
      Incomplete penetrance and variable expressivity among carriers of the same
      variant.
    quote_role: BACKGROUND
  - reference: PMID:42346125
    reference_title: "Cone Opsins and Inherited Retinal Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Missense mutations in Opn1sw lead to tritanopia color vision deficiencies
      (Figure 3B) that are inherited in an autosomal dominant pattern with
      incomplete penetrance, affecting both males and females equally
    explanation: >-
      Recent review summarising dominant inheritance with incomplete penetrance.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:17429491
    reference_title: "Adaptive optics retinal imaging reveals S-cone dystrophy in tritan color-vision deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      tritan individuals from two of the five pedigrees that have been studied in
      detail contain individuals who are homozygous for an S-opsin mutation, but
      there are also individuals within these two pedigrees who are heterozygous.
    explanation: >-
      Homozygotes occur but are rare; most affected individuals are heterozygous.
    quote_role: REVIEW_SYNTHESIS

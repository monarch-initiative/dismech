name: FGF12-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-20T00:20:00Z"
category: Mendelian
synonyms:
- Developmental and epileptic encephalopathy 47
- DEE47
- EIEE47
- FHF1-related epileptic encephalopathy
- FGF12-related epilepsy
description: >-
  FGF12-related developmental and epileptic encephalopathy (DEE47) is caused by
  heterozygous de novo gain-of-function variants in FGF12, most often the recurrent
  p.Arg52His change, and also by whole-gene duplication. Despite its name FGF12 is not a
  secreted growth factor: it encodes fibroblast growth factor homologous factor 1 (FHF1),
  an intracellular protein that binds the cytoplasmic C-terminal tail of voltage-gated
  sodium channels Nav1.6 and Nav1.2 and tunes their inactivation. The disorder is
  therefore a sodium channelopathy acting through a channel-binding partner rather than
  through the channel itself, which places it alongside the SCN2A and SCN8A entries in
  this knowledge base while remaining mechanistically distinct from them. Seizures begin
  in the neonatal or early infantile period. The phenotype has broadened considerably:
  what was described as a lethal encephalopathy now spans that severe form and a
  drug-responsive epilepsy with favourable cognitive outcome.
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 47
  term:
    id: MONDO:0014949
    label: developmental and epileptic encephalopathy, 47
parents:
- Epilepsy
- Neurological Disease
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous and usually de novo for the gain-of-function missense variants and
    duplications.
  evidence:
  - reference: PMID:27164707
    reference_title: "Gain-of-function FHF1 mutation causes early-onset epileptic encephalopathy with cerebellar atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A de novo heterozygous missense mutation was identified in the FHF1 gene
      (FHF1AR114H, FHF1BR52H) in the 2 affected siblings"
    explanation: >-
      Establishes the de novo heterozygous mechanism. Note the variant was de novo yet
      present in two siblings, which implies parental germline mosaicism and is relevant
      to recurrence-risk counselling.

- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    A separate, later-recognised biallelic loss-of-function route to the same clinical
    syndrome, established by long-read sequencing in an exome-negative patient. This is
    not a variant of the dominant mechanism but its inverse.
  evidence:
  - reference: PMID:37286232
    reference_title: "Biallelic structural variations within FGF12 detected by long-read sequencing in epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FGF12 heterozygous recurrent missense variants with gain-of-function or
      heterozygous entire duplication of FGF12 are known causes of epilepsy, but biallelic
      SNVs/SVs have never been described"
    explanation: >-
      States both the established dominant mechanisms and the novelty of the biallelic
      route at the time of report.

pathophysiology:

- name: FGF12 Gain-of-Function Missense Variant
  biological_scale: MOLECULAR
  description: >-
    The dominant lesion, most often p.Arg52His in the FHF1B isoform (equivalently
    p.Arg114His in FHF1A). Whole-gene duplication is an alternative dominant route acting
    through increased dosage rather than altered protein. FHFs were candidate epilepsy
    genes precisely because they bind Nav channels, which is how the gene was found.
  evidence:
  - reference: PMID:27164707
    reference_title: "Gain-of-function FHF1 mutation causes early-onset epileptic encephalopathy with cerebellar atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A de novo heterozygous missense mutation was identified in the FHF1 gene
      (FHF1AR114H, FHF1BR52H) in the 2 affected siblings"
    explanation: >-
      Identifies the recurrent variant in both isoform numbering systems.
  - reference: PMID:27164707
    reference_title: "Gain-of-function FHF1 mutation causes early-onset epileptic encephalopathy with cerebellar atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data demonstrate that gain-of-function FHF mutations can cause
      neurologic disorder, and expand the repertoire of genetic causes (FHF1) and
      mechanisms (altered Nav gating) underlying EOEE and cerebellar atrophy"
    explanation: >-
      The founding study's own statement of the gain-of-function mechanism and of altered
      Nav gating as the mechanistic class.
  downstream:
  - target: Weakened FHF1 Binding to the Nav Cytoplasmic Tail
    causal_link_type: DIRECT
    description: >-
      The variant's first measured consequence is on the protein-protein interaction.

- name: Weakened FHF1 Binding to the Nav Cytoplasmic Tail
  biological_scale: MOLECULAR
  description: >-
    The counterintuitive step, and the reason it is curated as its own node. The
    gain-of-function effect is predicted to arise from a *weaker* interaction between
    mutant FHF1 and the sodium channel cytoplasmic tail - a loss of binding producing a
    gain of channel function. Collapsing this into the downstream channel node would hide
    the fact that the direction of the binding change is opposite to the direction of the
    functional change.
  molecular_functions:
  - preferred_term: sodium channel regulator activity
    modifier: ABNORMAL
    term:
      id: GO:0017080
      label: sodium channel regulator activity
  evidence:
  - reference: PMID:27164707
    reference_title: "Gain-of-function FHF1 mutation causes early-onset epileptic encephalopathy with cerebellar atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Surprisingly, the gain-of-function effect is predicted to result from weaker
      interaction of mutant FHF1 with the Nav cytoplasmic tail"
    explanation: >-
      States the inverted relationship between binding strength and functional outcome,
      including the authors' own note that it is surprising.
  downstream:
  - target: Depolarizing Shift in Nav1.6 Fast Inactivation
    causal_link_type: DIRECT
    description: >-
      Altered binding changes the channel's inactivation behaviour.

- name: Depolarizing Shift in Nav1.6 Fast Inactivation
  biological_scale: MOLECULAR
  description: >-
    The channel-level readout: mutant FHF1 enhances the depolarizing shift in the
    voltage-dependence of Nav1.6 fast inactivation, so channels remain available at
    potentials where they would normally be inactivated.
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    modifier: INCREASED
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
  biological_processes:
  - preferred_term: regulation of sodium ion transmembrane transport
    modifier: DYSREGULATED
    term:
      id: GO:1902305
      label: regulation of sodium ion transmembrane transport
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  evidence:
  - reference: PMID:27164707
    reference_title: "Gain-of-function FHF1 mutation causes early-onset epileptic encephalopathy with cerebellar atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutant FHF1 proteins had a strong gain-of-function phenotype in
      transfected Neuro2A cells, enhancing the depolarizing shifts in Nav1.6
      voltage-dependent fast inactivation, predicting increased neuronal excitability"
    explanation: >-
      The direct biophysical measurement, together with the excitability consequence the
      authors predict from it.
  downstream:
  - target: Increased Intrinsic Neuronal Excitability
    causal_link_type: DIRECT
    description: >-
      Greater sodium channel availability raises the excitability of the neuron.

- name: Increased Intrinsic Neuronal Excitability
  biological_scale: CELLULAR
  description: >-
    Neurons carrying the variant are expected to fire more readily. Kept separate from the
    channel biophysics node because excitability is a cell-level property rather than a
    channel property. The status of this node is weaker than the nodes on either side of
    it: the founding study measured channel gating in Neuro2A cells and *predicted*
    increased excitability rather than recording it, so this is curated as a predicted
    step. No cell type is bound, because the supporting measurement was made in a
    neuroblastoma line rather than in an identified neuronal population.
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  evidence:
  - reference: PMID:27164707
    reference_title: "Gain-of-function FHF1 mutation causes early-onset epileptic encephalopathy with cerebellar atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "enhancing the depolarizing shifts in Nav1.6 voltage-dependent fast
      inactivation, predicting increased neuronal excitability"
    explanation: >-
      The excitability claim as stated by the founding study. Curated as predicted rather
      than directly measured at this point in the literature.
  downstream:
  - target: Epileptiform Network Activity
    causal_link_type: DIRECT
    description: >-
      Hyperexcitable neurons generate epileptiform network discharge.

- name: Epileptiform Network Activity
  biological_scale: CELLULAR
  description: >-
    Spontaneous epileptiform discharge at the network level, demonstrated by cortical EEG
    in the genotype-matched knock-in mouse.
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Seizure Generation and Epileptogenesis"
  evidence:
  - reference: PMID:33982289
    reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Spontaneous epileptiform events in Fhf1R52H/+ mice were assessed by cortical
      electroencephalography (EEG) and video monitoring"
    explanation: >-
      Establishes that spontaneous epileptiform activity is the measured endpoint in the
      knock-in mouse.
  downstream:
  - target: Early-Onset Refractory Seizures
    causal_link_type: DIRECT
    description: >-
      Network discharge manifests as the clinical seizure disorder.
  - target: Cardiac Arrhythmia
    causal_link_type: DIRECT
    description: >-
      The demonstrated route. Heart rate falls abruptly within seconds of seizure onset,
      attributed to a parasympathetic surge - so the arrhythmia in this model is
      seizure-triggered rather than a standing consequence of the cardiac channel defect.

- name: Altered Cardiac Sodium Channel Function
  biological_scale: MOLECULAR
  description: >-
    FHF1 binds Nav1.5 in cardiomyocytes by the same mechanism it uses on neuronal
    channels, so the variant has a direct cardiac substrate independent of seizures. This
    node is drawn from the variant rather than from the neuronal chain, because the two
    organs are affected in parallel by one molecular lesion.
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity involved in cardiac muscle cell action potential
    modifier: ABNORMAL
    term:
      id: GO:0086006
      label: voltage-gated sodium channel activity involved in cardiac muscle cell action potential
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:33982289
    reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although ectopic overexpression of FHF1BR52H in cardiomyocytes induced a
      15-mV depolarizing shift in voltage of steady-state sodium channel inactivation and
      slowed the rate of channel inactivation, heart rhythm was normal in Fhf1R52H/+ mice
      prior to seizure"
    explanation: >-
      Establishes the cardiac channel effect and, in the same sentence, its limit: the
      channel change is real but does not by itself produce a resting rhythm disturbance.
      Classified IN_VITRO because the channel measurement is ectopic adenoviral
      overexpression in cardiomyocytes, not an intact-animal observation.
  downstream:
  - target: Cardiac Arrhythmia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Downgraded from a direct edge. The cardiac channel defect is demonstrable, but the
      same paper reports that heart rhythm is normal in these animals before a seizure, so
      the channel change is not sufficient on its own to produce arrhythmia. It is curated
      as a permissive substrate rather than a direct cause.

- name: Cardiac Arrhythmia
  biological_scale: ORGANISM
  description: >-
    Arrhythmia and bradycardia in the knock-in mouse, contributing to sudden death. The
    cardiac arm is what distinguishes this disorder's risk profile from most other
    developmental and epileptic encephalopathies, because the same lesion acts on the
    heart and the brain.
  evidence:
  - reference: PMID:33982289
    reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Within 2-53 s after lethal seizure onset, heart rate abruptly declined from
      572 +/- 16 bpm to 108 +/- 15 bpm, suggesting a parasympathetic surge accompanying
      seizures that may have contributed to SUDEP"
    explanation: >-
      The actual arrhythmia result and its proposed mechanism, with the timing that
      establishes it as seizure-triggered. This replaces an earlier citation of the
      paper's methods sentence, which described what was measured rather than what was
      found.
  - reference: PMID:33982289
    reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "All Fhf1R52H/+ mice experienced seizure or seizurelike episodes with lethal
      ending between 12 and 26 days of age"
    explanation: >-
      Records the uniform lethal outcome in the model within a narrow age window.

- name: Early-Onset Refractory Seizures
  biological_scale: ORGANISM
  description: >-
    Seizures beginning in the neonatal or early infantile period. In the severe DEE47
    phenotype they are refractory and accompanied by developmental impairment; at the
    milder end of the spectrum they respond to medication.
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  evidence:
  - reference: PMID:40488543
    reference_title: "Broadening the phenotype associated with pathogenic variants in the FGF12 gene: From developmental and epileptic encephalopathy to drug-responsive epilepsy with favorable cognitive outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All developed epilepsy before 5 months, with 70% achieving seizure remission
      by 6 months with antiseizure medication (ASM), leading to good neurodevelopmental
      outcomes"
    explanation: >-
      Establishes the early onset shared across the spectrum, and simultaneously documents
      the drug-responsive pole with a remission figure.

- name: Biallelic FGF12 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    A separate, recessive route to the same clinical syndrome. Biallelic intragenic
    structural variants, and a biallelic single-nucleotide variant, reduce or remove FHF1
    function - the opposite direction of effect to the dominant missense variants. Curated
    as its own trigger node rather than folded into the gain-of-function chain, because
    both increased and decreased FHF1-mediated channel modulation destabilise network
    excitability and the entry should not imply they act through the same intermediate
    states.
  evidence:
  - reference: PMID:37286232
    reference_title: "Biallelic structural variations within FGF12 detected by long-read sequencing in epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We discovered biallelic intragenic structural variations (SVs) in FGF12 by
      applying long-read whole genome sequencing to an exome-negative patient with
      developmental and epileptic encephalopathy (DEE)"
    explanation: >-
      Establishes the biallelic structural-variant route and the sequencing technology
      that was required to see it.
  - reference: PMID:37286232
    reference_title: "Biallelic structural variations within FGF12 detected by long-read sequencing in epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "highly sensitive gene expression analyses using lymphoblastoid cells from
      the patient with biallelic SVs, structural considerations, and Drosophila in vivo
      functional analysis of the SNV were performed, confirming loss-of-function"
    explanation: >-
      Confirms the direction of effect as loss of function across three independent lines
      of evidence.
  downstream:
  - target: Early-Onset Refractory Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reaches the same clinical endpoint by an opposite-direction molecular route. Marked
      indirect with unknown intermediates because no source establishes the intervening
      steps for the recessive arm.

phenotypes:

- category: Neurological
  name: Early-Onset Seizures
  description: >-
    Seizures begin in the neonatal period or early infancy - before five months in every
    patient of the broadened cohort. Types reported include tonic, focal, migrating focal
    and spasms.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:40488543
    reference_title: "Broadening the phenotype associated with pathogenic variants in the FGF12 gene: From developmental and epileptic encephalopathy to drug-responsive epilepsy with favorable cognitive outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All developed epilepsy before 5 months"
    explanation: >-
      Establishes the upper bound on age at onset across the cohort.
  - reference: PMID:40488543
    reference_title: "Broadening the phenotype associated with pathogenic variants in the FGF12 gene: From developmental and epileptic encephalopathy to drug-responsive epilepsy with favorable cognitive outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We aim to refine the electroclinical phenotype and outcomes of 10
      unpublished patients (2-38 years old) with these recurrent pathogenic variants in
      the FGF12 gene without DEE"
    explanation: >-
      Establishes that patients carrying the same recurrent variants can reach adulthood
      without developmental and epileptic encephalopathy, which is what broadens the
      phenotype beyond the original lethal description.

- category: Neurological
  name: Developmental and Epileptic Encephalopathy
  description: >-
    The severe pole of the spectrum: refractory epilepsy with developmental impairment and
    poor outcome, which is the presentation the disorder was originally defined by.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:40488543
    reference_title: "Broadening the phenotype associated with pathogenic variants in the FGF12 gene: From developmental and epileptic encephalopathy to drug-responsive epilepsy with favorable cognitive outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "have repeatedly been associated with developmental and epileptic
      encephalopathy-47 (DEE47; Mendelian Inheritance in Man #617166) with poor outcome"
    explanation: >-
      Records the severe, poor-outcome phenotype the recurrent variants were originally
      associated with.

- category: Neurological
  name: Intellectual Disability
  description: >-
    Moderate to severe intellectual disability in the large majority of patients across
    the pooled literature, though the broadened phenotype now includes patients with
    favourable cognitive outcome.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:42057324
    reference_title: "FGF12-Related Early-Onset Epileptic Encephalopathies: Therapeutic Response to Sodium Channel Blockers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "79.1% of patients exhibited moderate to severe intellectual disability"
    explanation: >-
      Quantifies moderate-to-severe intellectual disability across a 27-patient pooled
      cohort. 79.1% sits at the top of the 30-79% FREQUENT band rather than in
      VERY_FREQUENT, so the band is assigned conservatively.

- category: Neuroimaging
  name: Cerebellar Atrophy
  description: >-
    Cerebellar atrophy was part of the original phenotype definition. Notably it tracks
    severity rather than genotype: patients at the favourable-outcome end of the spectrum
    showed none, which makes it a potential imaging correlate of prognosis rather than a
    constant feature of the disorder.
  phenotype_term:
    preferred_term: Cerebellar atrophy
    term:
      id: HP:0001272
      label: Cerebellar atrophy
  evidence:
  - reference: PMID:27164707
    reference_title: "Gain-of-function FHF1 mutation causes early-onset epileptic encephalopathy with cerebellar atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we performed whole-exome sequencing in a family quintet with 2 siblings with
      a lethal disease characterized by EOEE and cerebellar atrophy"
    explanation: >-
      Records cerebellar atrophy as part of the phenotype in the founding family, quoted
      from the abstract body rather than from the paper's title.
  - reference: PMID:40488543
    reference_title: "Broadening the phenotype associated with pathogenic variants in the FGF12 gene: From developmental and epileptic encephalopathy to drug-responsive epilepsy with favorable cognitive outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with favorable neurodevelopmental outcomes and FGF12 pathogenic
      variants showed no signs of cerebellar atrophy"
    explanation: >-
      Establishes that cerebellar atrophy is absent at the favourable-outcome pole, making
      it severity-associated rather than universal.
  - reference: PMID:42057324
    reference_title: "FGF12-Related Early-Onset Epileptic Encephalopathies: Therapeutic Response to Sodium Channel Blockers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI showed mild cerebral and/or cerebellar atrophy in 41.6% of cases"
    explanation: >-
      Supplies the pooled frequency across 27 patients, consistent with a
      severity-associated rather than universal finding.

- category: Cardiovascular
  name: Cardiac Arrhythmia
  description: >-
    Arrhythmia is established in the knock-in mouse, where it accompanies seizures and
    contributes to sudden death, and a human case of peri-ictal asystole requiring a
    pacemaker is now on record. The human frequency is not established - one case report
    shows the cardiac arm occurs in patients, not how commonly - so no frequency band is
    curated here.
  phenotype_term:
    preferred_term: Arrhythmia
    term:
      id: HP:0011675
      label: Arrhythmia
  evidence:
  - reference: PMID:40897676
    reference_title: "Ictal Asystole in a Patient With DEE due to an FGF12 Pathogenic Variant: A Reminder to Monitor Cardiac Function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the first known case of a 9-year-old male with early-onset
      epilepsy, syncope, and ictal asystole-requiring pacemaker implantation at the age of
      seven-associated with a pathogenic variant in FGF12"
    explanation: >-
      A human cardiac event in a genotype-confirmed patient, severe enough to require a
      pacemaker. This is a single case report, so it establishes that the cardiac arm
      occurs in humans without establishing how often.
  - reference: PMID:40897676
    reference_title: "Ictal Asystole in a Patient With DEE due to an FGF12 Pathogenic Variant: A Reminder to Monitor Cardiac Function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A holter ECG confirmed a 25-s peri-ictal asystole in an ambulatory record"
    explanation: >-
      Documents the asystole objectively and shows it is peri-ictal, matching the
      seizure-triggered mechanism described in the mouse.

genetic:
- name: FGF12
  gene_term:
    preferred_term: FGF12
    term:
      id: hgnc:3668
      label: FGF12
  relationship_type: CAUSATIVE
  association: >-
    FGF12 encodes fibroblast growth factor homologous factor 1 (FHF1), an intracellular,
    non-secreted FGF that modulates voltage-gated sodium channel inactivation. Three
    variant classes cause disease: recurrent heterozygous gain-of-function missense
    variants (p.Arg52His, p.Gly50Ser), whole-gene duplication, and - separately -
    biallelic loss-of-function structural or single-nucleotide variants.
  evidence:
  - reference: PMID:37286232
    reference_title: "Biallelic structural variations within FGF12 detected by long-read sequencing in epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FGF12 heterozygous recurrent missense variants with gain-of-function or
      heterozygous entire duplication of FGF12 are known causes of epilepsy, but biallelic
      SNVs/SVs have never been described"
    explanation: >-
      Enumerates the dominant variant classes and marks the biallelic route as newly
      described.
  notes: >-
    The recurrent p.Arg52His variant is numbered in the FHF1B isoform; the same change is
    p.Arg114His in FHF1A, and both numberings appear in the literature for one variant.
    In the founding family the variant was de novo yet shared by two affected siblings,
    which implies parental germline mosaicism - relevant to recurrence-risk counselling
    even though a de novo finding would ordinarily suggest low recurrence risk.
    Scope note: FGF12 also appears in the cardiac arrhythmia literature as a minor Brugada
    syndrome gene, and the GeneReviews chapter that mentions FGF12 is the Brugada Syndrome
    chapter, not a chapter about this disorder. That cardiac-channelopathy literature is a
    separate disease context and is deliberately not curated into this entry; the cardiac
    content here comes only from DEE47-genotype sources.

diagnosis:
- name: Long-Read Genome Sequencing
  description: >-
    Standard exome sequencing does not resolve every FGF12 case. The biallelic structural
    variants were found only by applying long-read whole genome sequencing to a patient
    whose exome was negative, so a negative exome does not exclude the gene.
  diagnosis_term:
    preferred_term: Whole Genome Sequencing
    term:
      id: NCIT:C101294
      label: Whole Genome Sequencing
  evidence:
  - reference: PMID:37286232
    reference_title: "Biallelic structural variations within FGF12 detected by long-read sequencing in epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We discovered biallelic intragenic structural variations (SVs) in FGF12 by
      applying long-read whole genome sequencing to an exome-negative patient with
      developmental and epileptic encephalopathy (DEE)"
    explanation: >-
      Directly supports the claim that a negative exome does not exclude FGF12 and that
      long-read sequencing has additional diagnostic yield here.

treatments:
- name: Sodium Channel Blocker Therapy
  description: >-
    Because the dominant mechanism is a sodium channel gain of function, sodium channel
    blockers are the mechanistically indicated treatment, and this is one of relatively
    few developmental and epileptic encephalopathies with a candidate precision therapy.
    Whether prompt treatment actually improves developmental outcome is disputed between
    two recent cohorts - see the controversy discussion, which this treatment entry should
    be read alongside.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carbamazepine
      term:
        id: CHEBI:3387
        label: carbamazepine
    - preferred_term: phenytoin
      term:
        id: CHEBI:8107
        label: phenytoin
    - preferred_term: lamotrigine
      term:
        id: CHEBI:6367
        label: lamotrigine
    - preferred_term: oxcarbazepine
      term:
        id: CHEBI:7824
        label: oxcarbazepine
  target_mechanisms:
  - target: Depolarizing Shift in Nav1.6 Fast Inactivation
    treatment_effect: INHIBITS
    description: >-
      Sodium channel blockers act on the channel whose inactivation the variant shifts.
  evidence:
  - reference: PMID:42185328
    reference_title: "Expanding the phenotypic spectrum of FGF12-epilepsy-does prompt precision therapy affect outcomes?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "8 patients promptly started on sodium channel blockers became seizure-free
      with good developmental outcomes while 4 developed DEE"
    explanation: >-
      The cohort supporting a benefit from prompt sodium-channel-blocker therapy.
  - reference: PMID:40488543
    reference_title: "Broadening the phenotype associated with pathogenic variants in the FGF12 gene: From developmental and epileptic encephalopathy to drug-responsive epilepsy with favorable cognitive outcome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "we did not find a clear correlation between treatment with sodium channel
      blockers, its timing, and neurodevelopmental outcome"
    explanation: >-
      The cohort that looked for the same association and did not find it. Curated as
      REFUTE against the precision-therapy claim so that the disagreement is visible on
      the treatment itself rather than only in prose.
  - reference: PMID:42057324
    reference_title: "FGF12-Related Early-Onset Epileptic Encephalopathies: Therapeutic Response to Sodium Channel Blockers."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "While treatment responses were heterogeneous, sodium channel blockers were
      commonly associated with clinical improvement"
    explanation: >-
      A third cohort, curated PARTIAL rather than SUPPORT because it reports an
      association with seizure improvement while explicitly describing responses as
      heterogeneous - and because association with clinical improvement is a weaker claim
      than the developmental-outcome benefit the other two cohorts disagree about.
  - reference: PMID:42057324
    reference_title: "FGF12-Related Early-Onset Epileptic Encephalopathies: Therapeutic Response to Sodium Channel Blockers."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings support cautious consideration of sodium channel targeting
      therapies in FGF12-DEE and underscore the need for systematic studies to better
      define genotype treatment relationships"
    explanation: >-
      The same cohort's own hedge. Quoted because the word "cautious" and the call for
      systematic studies are the authors positioning their result as suggestive rather
      than as settling the question.

animal_models:
- name: Fhf1 p.Arg52His knock-in mouse
  species: Mouse
  genotype: Fhf1R52H/+
  publication: PMID:33982289
  description: >-
    CRISPR knock-in carrying the recurrent human variant. The model that establishes the
    cardiac arm of the disorder, and the reason sudden death is treated as mechanistically
    linked rather than incidental.
  modeled_mechanisms:
  - target: Epileptiform Network Activity
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Spontaneous epileptiform events on cortical EEG in a genotype-matched animal.
    readouts:
    - name: Cortical EEG epileptiform events
      target: Epileptiform Network Activity
      direction: INCREASED
      interpretation: >-
        Spontaneous epileptiform activity assessed by EEG with video monitoring.
      evidence:
      - reference: PMID:33982289
        reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Spontaneous epileptiform events in Fhf1R52H/+ mice were assessed by
          cortical electroencephalography (EEG) and video monitoring"
        explanation: >-
          The electrophysiological measurement behind this readout.
    evidence:
    - reference: PMID:33982289
      reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The Arg52His mutation was introduced into fertilized eggs by CRISPR
        (clustered regularly interspaced short palindromic repeats) editing to generate
        Fhf1R52H/F+ mice"
      explanation: >-
        Establishes that the model carries the actual human variant rather than a
        surrogate lesion.
  - target: Cardiac Arrhythmia
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The mouse phenotype is uniformly lethal between 12 and 26 days of age, whereas the
      human disorder spans a lethal encephalopathy through to drug-responsive epilepsy
      with favourable cognitive outcome. The model therefore represents the severe pole
      only and cannot speak to the milder end of the spectrum, which is where the
      treatment question now sits.
    description: >-
      Ictal bradyarrhythmia. Basal rhythm is explicitly normal, so the model shows a
      seizure-triggered cardiac event rather than a standing cardiac phenotype - the two
      readouts below record that contrast directly.
    readouts:
    - name: Basal heart rhythm prior to seizure
      target: Cardiac Arrhythmia
      direction: UNCHANGED
      interpretation: >-
        No intrinsic cardiac phenotype between seizures. This is a real negative result and
        is what makes the downgrade of the channel-to-arrhythmia edge correct: the cardiac
        sodium channel defect is demonstrable in vitro yet produces no measurable resting
        rhythm abnormality in the intact animal.
      evidence:
      - reference: PMID:33982289
        reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "heart rhythm was normal in Fhf1R52H/+ mice prior to seizure"
        explanation: >-
          States the negative basal result directly.
      - reference: PMID:33982289
        reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "average basal heart rates recorded over a 6-hour period were not
          significantly different"
        explanation: >-
          The quantitative form of the same negative result, over a six-hour recording
          rather than a spot measurement.
    - name: Ictal heart rate
      target: Cardiac Arrhythmia
      direction: DECREASED
      interpretation: >-
        An abrupt fall in heart rate within seconds of seizure onset, attributed to a
        parasympathetic surge.
      evidence:
      - reference: PMID:33982289
        reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Within 2-53 s after lethal seizure onset, heart rate abruptly declined
          from 572 +/- 16 bpm to 108 +/- 15 bpm, suggesting a parasympathetic surge
          accompanying seizures that may have contributed to SUDEP"
        explanation: >-
          The ictal measurement, with the timing that establishes it as following seizure
          onset rather than preceding it.
    evidence:
    - reference: PMID:33982289
      reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "All Fhf1R52H/+ mice experienced seizure or seizurelike episodes with lethal
        ending between 12 and 26 days of age"
      explanation: >-
        Supports the model as informative for sudden death, and records the narrow age
        window that also defines its limitation.

discussions:

- discussion_id: controversy_does_prompt_sodium_channel_blockade_change_outcome
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Depolarizing Shift in Nav1.6 Fast Inactivation
  - pathophysiology#Early-Onset Refractory Seizures
  prompt: >-
    Does promptly starting a sodium channel blocker improve neurodevelopmental outcome in
    FGF12-related epilepsy, or does outcome track the variant and phenotype regardless of
    when treatment starts?
  rationale: >-
    Three cohorts now speak to this question and they do not agree. Two published within a
    year of each other reach opposite conclusions. One reports that eight patients promptly started on sodium channel
    blockers became seizure-free with good developmental outcomes while four developed
    encephalopathy, and frames early precision therapy as consequential. The other looked
    for exactly this association and states that it did not find a clear correlation
    between sodium-channel-blocker treatment, its timing, and neurodevelopmental outcome.
    The mechanistic rationale is strong and undisputed - the dominant lesion is a sodium
    channel gain of function, so blocking the channel is the rational target - which makes
    it easy to assume the clinical benefit follows. It may not. The competing explanation
    is confounding by severity: milder variants produce both better outcomes and easier
    seizure control, so treatment responsiveness could be a marker of a mild phenotype
    rather than a cause of a good outcome. A third cohort of 27 patients reports
    sodium channel blockers commonly associated with clinical improvement, but it declines
    to overclaim - responses are described as heterogeneous and the authors call for
    systematic studies - and it speaks to seizure improvement rather than to the
    developmental outcome the other two dispute, so it does not break the tie. All three
    cohorts are small and none is randomised. This matters more than a typical unresolved question because it bears
    directly on what clinicians do at diagnosis, and because a precision-therapy claim
    that turns out to be confounded is harder to retract than one never made. The entry
    therefore curates the supporting cohort as SUPPORT and the null cohort as REFUTE on
    the same treatment, so the disagreement is visible in the structured data rather than
    only in prose. Note that the deep-research report used to build this entry asserted
    the optimistic version as a quote attributed to both papers; its own validator flagged
    that quote as unsupported, and inspection showed one of the two papers states the
    opposite.
  proposed_experiments:
  - experiment_id: exp_severity_stratified_treatment_timing
    name: Severity-stratified analysis of treatment timing
    description: >-
      Pool the published FGF12 cohorts and stratify outcome by variant and by
      pre-treatment seizure burden before testing the effect of sodium-channel-blocker
      timing. If the timing effect survives stratification by baseline severity, the
      precision-therapy claim is supported; if it disappears, the association was
      confounding by severity and the claim should be withdrawn.

- discussion_id: gap_opposite_direction_variants_converge_on_one_syndrome
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#FGF12 Gain-of-Function Missense Variant
  - pathophysiology#Biallelic FGF12 Loss of Function
  prompt: >-
    How do gain-of-function and loss-of-function FGF12 variants produce the same clinical
    syndrome?
  rationale: >-
    Heterozygous missense variants increase FHF1-mediated modulation of sodium channel
    inactivation; biallelic structural and single-nucleotide variants reduce or remove it,
    confirmed by expression analysis, structural reasoning and a Drosophila assay. Both
    cause developmental and epileptic encephalopathy. The entry keeps them as separate
    trigger nodes converging on the clinical endpoint rather than routing the recessive
    arm through the dominant chain, because nothing establishes that they pass through the
    same intermediate states - and if they did, the direction of the channel change would
    have to be the same, which it is not. The practical stake is therapeutic: a sodium
    channel blocker is mechanistically indicated for the gain-of-function arm and
    potentially harmful for the loss-of-function arm, so treating the two as one disease
    for management purposes could be actively wrong.
  proposed_experiments:
  - experiment_id: exp_loss_versus_gain_channel_phenotype
    name: Channel-level comparison of loss- and gain-of-function FGF12 alleles
    description: >-
      Measure Nav1.6 and Nav1.2 inactivation kinetics and neuronal excitability in the
      same preparation for a gain-of-function missense allele and for FHF1 depletion, and
      determine whether excitability rises in both cases or whether the loss-of-function
      arm reaches seizures through a different excitability change. The answer directly
      determines whether sodium channel blockade is rational for biallelic patients.

- discussion_id: mismatch_uniformly_lethal_mouse_versus_a_broad_human_spectrum
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Cardiac Arrhythmia
  prompt: >-
    Can a model in which every animal dies within a month inform a disorder that includes
    drug-responsive epilepsy with normal cognition?
  rationale: >-
    Every Fhf1R52H/+ mouse experiences seizures or seizure-like episodes ending lethally
    between 12 and 26 days of age. The human spectrum carrying the same recurrent variant
    class now extends to patients aged up to 38 years with favourable cognitive outcomes.
    The model is a faithful and valuable representation of the severe pole - it is the
    source of the cardiac and sudden-death findings, which would be hard to establish any
    other way - but it cannot be used to reason about the milder end, and that is
    precisely where the open clinical question about treatment timing now lies. The
    mismatch also has a specific consequence for the cardiac arm: because the model dies
    young and uniformly, it cannot tell us the lifetime arrhythmia risk for a patient who
    survives infancy, which is the number a cardiologist would want.
  proposed_experiments:
  - experiment_id: exp_cardiac_screening_in_surviving_patients
    name: Cardiac screening in older FGF12 patients
    description: >-
      Systematically screen the surviving FGF12 cohort, including the adults at the
      favourable-outcome pole, with ECG and ambulatory rhythm monitoring, to establish
      whether the cardiac arm demonstrated in the mouse is present in humans who live
      beyond infancy and whether it warrants surveillance.

notes: >-
  Module conformance deliberately skips the epilepsy module's Excitation-Inhibition
  Imbalance node. The chain here runs from a channel-gating change to network epileptiform
  activity without an evidenced excitatory-inhibitory balance measurement, and the
  intervening excitability node is itself curated as predicted rather than measured, so
  attaching there would assert a balance claim no source makes. This is a decision, not an
  oversight.
  Items raised in review and deliberately deferred, with the reasoning recorded so they
  are not re-litigated: the zebrafish model and the patient iPSC line are both real and
  relevant but neither carries a measurement this entry currently makes a node for, so
  adding them would produce disconnected list entries rather than pathograph links; the
  reported association of FGF12 duplication with West syndrome is described in secondary
  sources but no primary source available here states it quotably; and seizure semiology
  is curated at the level of HP:0001250 Seizure rather than split into tonic, focal and
  migrating-focal subtypes, because the pooled cohort reports semiology counts without a
  per-patient denominator that would support frequency bands on the subtypes.
  Scope: this entry curates DEE47 and the broader FGF12-related epilepsy spectrum that the
  same recurrent variants produce. FGF12 also appears as a minor gene in the Brugada
  syndrome literature; that is a separate disease context and is not curated here. The
  only GeneReviews chapter returned by a search for FGF12 is the Brugada Syndrome chapter,
  in which FGF12 is a mentioned gene rather than the subject, so it is not the
  GeneReviews baseline for this disorder and is deliberately not tagged as one.

    Seizures begin in the neonatal period or early infancy - before five months in every
    patient of the broadened cohort, and in the neonatal period in over half of DEE cases.
    Tonic seizures are the most common seizure type.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:40488543
    reference_title: "Broadening the phenotype associated with pathogenic variants in the FGF12 gene: From developmental and epileptic encephalopathy to drug-responsive epilepsy with favorable cognitive outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All developed epilepsy before 5 months"
    explanation: >-
      Establishes infant-onset epilepsy across all 10 patients in the broadened
      cohort.
  - reference: PMID:40488543
    reference_title: "Broadening the phenotype associated with pathogenic variants in the FGF12 gene: From developmental and epileptic encephalopathy to drug-responsive epilepsy with favorable cognitive outcome."
    supports: SUPPORT

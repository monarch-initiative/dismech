  downstream:
  - target: Seizure-Triggered Cardiac Bradyarrhythmia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Downgraded from a direct edge. The cardiac channel defect is demonstrable, but the
      same paper reports that heart rhythm is normal in these animals before a seizure, so
      the channel change is not sufficient on its own to produce arrhythmia. It is curated
      as a permissive substrate rather than a direct cause.
    evidence:
    - reference: PMID:33982289
      reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
      supports: SUPPORT

- category: Neuroimaging
  name: Cerebellar Atrophy
  description: >-
    Cerebellar atrophy was part of the original phenotype definition. Notably it tracks
    severity rather than genotype: patients at the favourable-outcome end of the spectrum
    showed none, which makes it a potential imaging correlate of prognosis rather than a
    constant feature of the disorder.

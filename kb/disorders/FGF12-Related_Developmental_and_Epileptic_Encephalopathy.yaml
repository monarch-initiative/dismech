- name: Biallelic FGF12 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    A separate, recessive route to the same clinical syndrome. Biallelic intragenic
    structural variants, and a biallelic single-nucleotide variant, reduce or remove FHF1
    function - the opposite direction of effect to the dominant missense variants. Curated
    as its own trigger node rather than folded into the gain-of-function chain, because
    both increased and decreased FHF1-mediated channel modulation destabilise network
    excitability and the entry should not imply they act through the same intermediate
    states.
  genes:
  - preferred_term: FGF12
    term:
      id: hgnc:3668
      label: FGF12
  genetic_context:
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS

- category: Cardiovascular
  name: Cardiac Arrhythmia
  description: >-
    Arrhythmia is established in the knock-in mouse, where it accompanies seizures and
    contributes to sudden death, and a human case of peri-ictal asystole requiring a
    pacemaker is now on record. The human frequency is not established - one case report
    shows the cardiac arm occurs in patients, not how commonly - so no frequency band is
    curated here.
  phenotype_term:
    preferred_term: Arrhythmia
    term:
      id: HP:0011675
      label: Arrhythmia
  evidence:
  - reference: PMID:40897676
    reference_title: "Ictal Asystole in a Patient With DEE due to an FGF12 Pathogenic Variant: A Reminder to Monitor Cardiac Function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the first known case of a 9-year-old male with early-onset epilepsy, syncope, and ictal asystole-requiring pacemaker implantation at the age of seven-associated with a pathogenic variant in FGF12"
    explanation: >-
      A human cardiac event in a genotype-confirmed patient, severe enough to require a
      pacemaker. This is a single case report, so it establishes that the cardiac arm
      occurs in humans without establishing how often.
  - reference: PMID:40897676
    reference_title: "Ictal Asystole in a Patient With DEE due to an FGF12 Pathogenic Variant: A Reminder to Monitor Cardiac Function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A holter ECG confirmed a 25-s peri-ictal asystole in an ambulatory record"
    explanation: >-
      Documents the asystole objectively and shows it is peri-ictal, matching the
      seizure-triggered mechanism described in the mouse.

genetic:
- name: FGF12
  gene_term:
    preferred_term: FGF12
    term:
      id: hgnc:3668
      label: FGF12
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    FGF12 encodes fibroblast growth factor homologous factor 1 (FHF1), an intracellular,
    non-secreted FGF that modulates voltage-gated sodium channel inactivation. Three
    variant classes cause disease: recurrent heterozygous gain-of-function missense
    variants (p.Arg52His, p.Gly50Ser), whole-gene duplication, and - separately -
    biallelic loss-of-function structural or single-nucleotide variants.
  variants:
  - name: p.Arg52His (FHF1B) / p.Arg114His (FHF1A)
    description: >-
      Recurrent de novo heterozygous gain-of-function missense variant in the
      Nav-binding domain of FHF1, accounting for the majority of reported
      missense cases.
    evidence:
    - reference: PMID:42057324
      reference_title: "FGF12-Related Early-Onset Epileptic Encephalopathies: Therapeutic Response to Sodium Channel Blockers."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Eighteen patients carried FGF12 missense variants, including the recurrent pathogenic p.Arg114His variant (n = 14), p.Gly112Ser (n = 2), p.Glu87Lys (n = 1), and one exon 4 missense variant (chr3:g.192335434C>T)."
      explanation: >-
        Documents p.Arg114His (FHF1A; p.Arg52His in FHF1B) as the predominant
        recurrent pathogenic missense variant across reported DEE cases.
  - name: p.Gly50Ser (FHF1B) / p.Gly112Ser (FHF1A)
    description: >-
      Second recurrent heterozygous gain-of-function missense variant in FGF12,
      associated with both DEE47 and drug-responsive infantile epilepsy.
    evidence:
    - reference: PMID:40488543
      reference_title: "Broadening the phenotype associated with pathogenic variants in the FGF12 gene: From developmental and epileptic encephalopathy to drug-responsive epilepsy with favorable cognitive outcome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patients with p.(Gly50Ser) showed later and more explosive epilepsy onset, whereas p.(Arg52His) cases had gradual onset."
      explanation: >-
        Characterizes the clinical presentation of the recurrent p.Gly50Ser
        missense variant.
  - name: Exons 1-4 / whole-gene FGF12 duplication
    description: >-
      Heterozygous copy-number duplications encompassing FGF12 at 3q28-q29,
      causing autosomal dominant FGF12-related DEE through increased gene
      dosage.
    evidence:
    - reference: PMID:42057324
      reference_title: "FGF12-Related Early-Onset Epileptic Encephalopathies: Therapeutic Response to Sodium Channel Blockers."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Nine patients had copy number duplications involving FGF12."
      explanation: >-
        Quantifies copy-number duplications involving FGF12 in 9 of 27 DEE
        patients.
  evidence:
  - reference: PMID:37286232
    reference_title: "Biallelic structural variations within FGF12 detected by long-read sequencing in epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FGF12 heterozygous recurrent missense variants with gain-of-function or heterozygous entire duplication of FGF12 are known causes of epilepsy, but biallelic SNVs/SVs have never been described"
    explanation: >-
      Enumerates the dominant variant classes and marks the biallelic route as newly
      described.
  notes: >-
    The recurrent p.Arg52His variant is numbered in the FHF1B isoform; the same change is
    p.Arg114His in FHF1A, and both numberings appear in the literature for one variant.
    In the founding family the variant was de novo yet shared by two affected siblings,
    which implies parental germline mosaicism - relevant to recurrence-risk counselling
    even though a de novo finding would ordinarily suggest low recurrence risk.
    ClinGen's Epilepsy Gene Curation Expert Panel classifies FGF12 as Definitive on the
    lumped umbrella developmental and epileptic encephalopathy (MONDO:0100062,
    CGGV:assertion_54324da6-e7c7-4ad2-a669-d8ccd1a6b71a-2023-11-01T160000.000Z) rather
    than on MONDO:0014949, so no gene_disease_validity assertion is bound here.
    Scope note: FGF12 also appears in the cardiac arrhythmia literature as a minor Brugada
    syndrome gene, and the GeneReviews chapter that mentions FGF12 is the Brugada Syndrome
    chapter, not a chapter about this disorder.


        lethal seizure onset.

- name: Altered Cardiac Sodium Channel Function
  biological_scale: MOLECULAR
  description: >-
    FHF1 binds Nav1.5 in cardiomyocytes by the same mechanism it uses on neuronal
    channels, so the variant has a direct cardiac substrate independent of seizures. This
    node is drawn from the variant rather than from the neuronal chain, because the two
    organs are affected in parallel by one molecular lesion.
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity involved in cardiac muscle cell action potential
    modifier: ABNORMAL

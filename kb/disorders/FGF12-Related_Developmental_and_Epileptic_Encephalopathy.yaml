- name: Multigene Epilepsy Panel or Exome Sequencing with CNV Analysis
  description: >-
    Targeted epilepsy multigene panel or exome sequencing with copy-number
    analysis detects heterozygous missense variants (such as p.Arg52His and
    p.Gly50Ser) and exon/whole-gene duplications in FGF12, which together
    account for the majority of diagnoses.
  diagnosis_term:
    preferred_term: Multi-gene Panel Sequencing
    term:
      id: NCIT:C198412
      label: Multi-gene Panel Sequencing
  results: >-
    Heterozygous pathogenic gain-of-function missense variant or copy-number
    duplication involving FGF12.
  evidence:
  - reference: PMID:42057324
    reference_title: "FGF12-Related Early-Onset Epileptic Encephalopathies: Therapeutic Response to Sodium Channel Blockers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighteen patients carried FGF12 missense variants, including the recurrent pathogenic p.Arg114His variant (n = 14), p.Gly112Ser (n = 2), p.Glu87Lys (n = 1), and one exon 4 missense variant (chr3:g.192335434C>T)."
    explanation: >-
      Demonstrates molecular detection of recurrent and private FGF12 missense
      variants across reported cases.
  - reference: PMID:42057324
    reference_title: "FGF12-Related Early-Onset Epileptic Encephalopathies: Therapeutic Response to Sodium Channel Blockers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine patients had copy number duplications involving FGF12."
    explanation: >-
      Supports including copy-number duplication detection in molecular testing
      for FGF12-related DEE.
- name: Long-Read Genome Sequencing
  description: >-
    Standard exome sequencing does not resolve every FGF12 case. The biallelic structural
    variants were found only by applying long-read whole genome sequencing to a patient
    whose exome was negative, so a negative exome does not exclude the gene.
  diagnosis_term:
    preferred_term: Whole Genome Sequencing
    term:
      id: NCIT:C101294
      label: Whole Genome Sequencing
  results: >-
    Biallelic intragenic structural variations in FGF12 missed by short-read
    exome sequencing.
  evidence:
  - reference: PMID:37286232
    reference_title: "Biallelic structural variations within FGF12 detected by long-read sequencing in epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We discovered biallelic intragenic structural variations (SVs) in FGF12 by applying long-read whole genome sequencing to an exome-negative patient with developmental and epileptic encephalopathy (DEE)"
    explanation: >-
      Directly supports the claim that a negative exome does not exclude FGF12 and that
      long-read sequencing has additional diagnostic yield here.
- name: Electroencephalography and Ambulatory Cardiac Rhythm Monitoring
  description: >-
    Electroencephalography characterizes neonatal/infantile seizure semiology
    and background encephalopathy, while ambulatory Holter ECG monitoring can
    detect life-threatening peri-ictal bradyarrhythmia or asystole.
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  results: >-
    Epileptiform discharges and tonic/focal ictal patterns on EEG; potential
    peri-ictal sinus pause or asystole on concurrent ECG/Holter monitoring.
  evidence:
  - reference: PMID:40897676
    reference_title: "Ictal Asystole in a Patient With DEE due to an FGF12 Pathogenic Variant: A Reminder to Monitor Cardiac Function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A holter ECG confirmed a 25-s peri-ictal asystole in an ambulatory record"
    explanation: >-
      Demonstrates diagnostic utility of ambulatory cardiac rhythm monitoring
      alongside epilepsy evaluation in FGF12-DEE.

treatments:
- name: Sodium Channel Blocker Therapy
  description: >-
    Because the dominant mechanism is a sodium channel gain of function, sodium channel
    blockers are the mechanistically indicated treatment, and this is one of relatively
    few developmental and epileptic encephalopathies with a candidate precision therapy.
    Whether prompt treatment actually improves developmental outcome is disputed between
    two recent cohorts - see the controversy discussion, which this treatment entry should
    be read alongside.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carbamazepine
      term:
        id: CHEBI:3387
        label: carbamazepine
    - preferred_term: phenytoin
      term:
        id: CHEBI:8107
        label: phenytoin
    - preferred_term: lamotrigine
      term:
        id: CHEBI:6367
        label: lamotrigine
    - preferred_term: oxcarbazepine
      term:
        id: CHEBI:7824
        label: oxcarbazepine
  target_mechanisms:
  - target: Depolarizing Shift in Nav1.6 Fast Inactivation
    treatment_effect: INHIBITS
    description: >-
      Sodium channel blockers act on the channel whose inactivation the variant shifts.
    evidence:
    - reference: PMID:42057324
      reference_title: "FGF12-Related Early-Onset Epileptic Encephalopathies: Therapeutic Response to Sodium Channel Blockers."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Across reported cases, variable responsiveness to ASMs was observed, with sodium channel blockers including carbamazepine and phenytoin frequently associated with seizure reduction."
      explanation: >-
        Supports sodium channel blockade as the mechanistically targeted
        antiseizure intervention in FGF12 gain-of-function epilepsy.
  evidence:
  - reference: PMID:42185328
    reference_title: "Expanding the phenotypic spectrum of FGF12-epilepsy-does prompt precision therapy affect outcomes?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "8 patients promptly started on sodium channel blockers became seizure-free with good developmental outcomes while 4 developed DEE"
    explanation: >-
      The cohort supporting a benefit from prompt sodium-channel-blocker therapy.
  - reference: PMID:40488543
    reference_title: "Broadening the phenotype associated with pathogenic variants in the FGF12 gene: From developmental and epileptic encephalopathy to drug-responsive epilepsy with favorable cognitive outcome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "we did not find a clear correlation between treatment with sodium channel blockers, its timing, and neurodevelopmental outcome"
    explanation: >-
      The cohort that looked for the same association and did not find it. Curated as
      REFUTE against the precision-therapy claim so that the disagreement is visible on
      the treatment itself rather than only in prose.
  - reference: PMID:42057324
    reference_title: "FGF12-Related Early-Onset Epileptic Encephalopathies: Therapeutic Response to Sodium Channel Blockers."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "While treatment responses were heterogeneous, sodium channel blockers were commonly associated with clinical improvement"
    explanation: >-
      A third 27-patient cohort reporting an association between sodium channel
      blockers and clinical seizure improvement despite heterogeneous
      individual responses, marked indirect relative to long-term
      neurodevelopmental outcome.
  - reference: PMID:42057324
    reference_title: "FGF12-Related Early-Onset Epileptic Encephalopathies: Therapeutic Response to Sodium Channel Blockers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings support cautious consideration of sodium channel targeting therapies in FGF12-DEE and underscore the need for systematic studies to better define genotype treatment relationships"
    explanation: >-
      The same cohort's own hedge. Quoted because the word "cautious" and the call for
      systematic studies are the authors positioning their result as suggestive rather
      than as settling the question.

animal_models:
- name: Fhf1 p.Arg52His knock-in mouse
  species: Mouse
  genotype: Fhf1R52H/+
  publication: PMID:33982289
  description: >-
    CRISPR knock-in carrying the recurrent human variant. The model that establishes the
    cardiac arm of the disorder, and the reason sudden death is treated as mechanistically
    linked rather than incidental.
  evidence:
  - reference: PMID:33982289
    reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The Fhf1 missense mutation p.Arg52His induces epileptic encephalopathy with full penetrance in mice."
    explanation: >-
      Establishes full-penetrance epileptic encephalopathy in the heterozygous
      Fhf1 p.Arg52His knock-in mouse model.
  modeled_mechanisms:
  - target: Epileptiform Network Activity
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Spontaneous epileptiform events on cortical EEG in a genotype-matched animal.
    readouts:
    - name: Cortical EEG epileptiform events
      target: Epileptiform Network Activity
      direction: INCREASED
      interpretation: >-
        Electrographic tonic seizures preceding loss of brain activity on cortical EEG.
      evidence:
      - reference: PMID:33982289
        reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "EEG recordings in 19-20-day-old mice confirmed sudden unexpected death in epilepsy (SUDEP) as severe tonic seizures immediately preceding loss of brain activity and death."
        explanation: >-
          Cortical EEG demonstration of severe tonic seizures in Fhf1R52H/+
          mice.
    evidence:
    - reference: PMID:33982289
      reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The Fhf1 missense mutation p.Arg52His induces epileptic encephalopathy with full penetrance in mice."
      explanation: >-
        Confirms full-penetrance recapitulation of epileptic network dysfunction
        in Fhf1R52H/+ knock-in mice.
  - target: Seizure-Triggered Cardiac Bradyarrhythmia
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The mouse phenotype is uniformly lethal between 12 and 26 days of age, whereas the
      human disorder spans a lethal encephalopathy through to drug-responsive epilepsy
      with favourable cognitive outcome. The model therefore represents the severe pole
      only and cannot speak to the milder end of the spectrum, which is where the
      treatment question now sits.
    description: >-
      Ictal bradyarrhythmia. Basal rhythm is explicitly normal, so the model shows a
      seizure-triggered cardiac event rather than a standing cardiac phenotype - the two
      readouts below record that contrast directly.
    readouts:
    - name: Basal heart rhythm prior to seizure
      target: Seizure-Triggered Cardiac Bradyarrhythmia
      direction: UNCHANGED
      interpretation: >-
        No intrinsic cardiac phenotype between seizures. This is a real negative result and
        is what makes the downgrade of the channel-to-arrhythmia edge correct: the cardiac
        sodium channel defect is demonstrable in vitro yet produces no measurable resting
        rhythm abnormality in the intact animal.
      evidence:
      - reference: PMID:33982289
        reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "heart rhythm was normal in Fhf1R52H/+ mice prior to seizure"
        explanation: >-
          States the negative basal result directly.
      - reference: PMID:33982289
        reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "average basal heart rates recorded over a 6-hour period were not significantly different"
        explanation: >-
          The quantitative form of the same negative result, over a six-hour recording
          rather than a spot measurement.
    - name: Ictal heart rate
      target: Seizure-Triggered Cardiac Bradyarrhythmia
      direction: DECREASED
      interpretation: >-
        An abrupt fall in heart rate within seconds of seizure onset, attributed to a
        parasympathetic surge.
      evidence:
      - reference: PMID:33982289
        reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Within 2-53 s after lethal seizure onset, heart rate abruptly declined from 572 +/- 16 bpm to 108 +/- 15 bpm, suggesting a parasympathetic surge accompanying seizures that may have contributed to SUDEP"
        explanation: >-
          The ictal measurement, with the timing that establishes it as following seizure
          onset rather than preceding it.
    evidence:
    - reference: PMID:33982289
      reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "All Fhf1R52H/+ mice experienced seizure or seizurelike episodes with lethal ending between 12 and 26 days of age"
      explanation: >-
        Supports the model as informative for sudden death, and records the narrow age
        window that also defines its limitation.

discussions:
- discussion_id: controversy_does_prompt_sodium_channel_blockade_change_outcome
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Depolarizing Shift in Nav1.6 Fast Inactivation
  - pathophysiology#Early-Onset Refractory Seizures
  prompt: >-
    Does promptly starting a sodium channel blocker improve neurodevelopmental outcome in
    FGF12-related epilepsy, or does outcome track the variant and phenotype regardless of
    when treatment starts?
  rationale: >-
    Three cohorts now speak to this question and they do not agree. One reports that eight
    patients promptly started on sodium channel blockers became seizure-free with good
    developmental outcomes while four developed encephalopathy, framing early precision
    therapy as consequential. Another looked for this association and found no clear
    correlation between sodium-channel-blocker treatment, its timing, and
    neurodevelopmental outcome. A third cohort of 27 patients reports sodium channel
    blockers commonly associated with clinical seizure improvement, while noting
    heterogeneous responses and calling for systematic studies. All three cohorts are
    small and non-randomised, leaving confounding by baseline allele/phenotype severity
    unresolved.
  evidence:
  - reference: PMID:42185328
    reference_title: "Expanding the phenotypic spectrum of FGF12-epilepsy-does prompt precision therapy affect outcomes?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "8 patients promptly started on sodium channel blockers became seizure-free with good developmental outcomes while 4 developed DEE"
    explanation: >-
      Cohort reporting seizure freedom and favourable developmental outcomes
      with prompt sodium channel blockade.
  - reference: PMID:40488543
    reference_title: "Broadening the phenotype associated with pathogenic variants in the FGF12 gene: From developmental and epileptic encephalopathy to drug-responsive epilepsy with favorable cognitive outcome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "we did not find a clear correlation between treatment with sodium channel blockers, its timing, and neurodevelopmental outcome"
    explanation: >-
      Cohort reporting no clear correlation between sodium channel blocker
      timing and neurodevelopmental outcome.
  proposed_experiments:
  - experiment_id: exp_severity_stratified_treatment_timing
    name: Severity-stratified analysis of treatment timing
    description: >-
      Pool the published FGF12 cohorts and stratify outcome by variant and by
      pre-treatment seizure burden before testing the effect of sodium-channel-blocker
      timing. If the timing effect survives stratification by baseline severity, the
      precision-therapy claim is supported; if it disappears, the association was
      confounding by severity and the claim should be withdrawn.

- discussion_id: gap_opposite_direction_variants_converge_on_one_syndrome
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#FGF12 Gain-of-Function Missense Variant
  - pathophysiology#Biallelic FGF12 Loss of Function
  prompt: >-
    How do gain-of-function and loss-of-function FGF12 variants produce the same clinical
    syndrome?
  rationale: >-
    Heterozygous missense variants increase FHF1-mediated modulation of sodium channel
    inactivation; biallelic structural and single-nucleotide variants reduce or remove it,
    confirmed by expression analysis, structural reasoning and a Drosophila assay. Both
    cause developmental and epileptic encephalopathy. Keeping them as separate trigger
    nodes avoids implying shared intermediate gating states, which matters clinically
    because sodium channel blockade is mechanistically rational for the gain-of-function
    arm and potentially harmful for the loss-of-function arm.
  evidence:
  - reference: PMID:37286232
    reference_title: "Biallelic structural variations within FGF12 detected by long-read sequencing in epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FGF12 heterozygous recurrent missense variants with gain-of-function or heterozygous entire duplication of FGF12 are known causes of epilepsy, but biallelic SNVs/SVs have never been described"
    explanation: >-
      Documents convergence of opposite-direction FGF12 allele classes on
      clinical epilepsy/DEE.
  proposed_experiments:
  - experiment_id: exp_loss_versus_gain_channel_phenotype
    name: Channel-level comparison of loss- and gain-of-function FGF12 alleles
    description: >-
      Measure Nav1.6 and Nav1.2 inactivation kinetics and neuronal excitability in the
      same preparation for a gain-of-function missense allele and for FHF1 depletion, and
      determine whether excitability rises in both cases or whether the loss-of-function
      arm reaches seizures through a different excitability change. The answer directly
      determines whether sodium channel blockade is rational for biallelic patients.

- discussion_id: mismatch_uniformly_lethal_mouse_versus_a_broad_human_spectrum
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Seizure-Triggered Cardiac Bradyarrhythmia
  prompt: >-
    Can a model in which every animal dies within a month inform a disorder that includes
    drug-responsive epilepsy with normal cognition?
  rationale: >-
    Every Fhf1R52H/+ mouse experiences seizures or seizure-like episodes ending lethally
    between 12 and 26 days of age. The human spectrum carrying the same recurrent variant
    class now extends to patients aged up to 38 years with favourable cognitive outcomes.
    The model faithfully captures the severe pole and peri-ictal bradycardia/SUDEP, but
    cannot estimate lifetime arrhythmia risk in patients who survive infancy.
  evidence:
  - reference: PMID:33982289
    reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "All Fhf1R52H/+ mice experienced seizure or seizurelike episodes with lethal ending between 12 and 26 days of age"
    explanation: >-
      Demonstrates uniform juvenile lethality in Fhf1R52H/+ mice, contrasting
      with human survival into adulthood.
  proposed_experiments:
  - experiment_id: exp_cardiac_screening_in_surviving_patients
    experiment_design: HUMAN_OBSERVATIONAL
    name: Cardiac screening in older FGF12 patients
    description: >-
      Systematically screen the surviving FGF12 cohort, including the adults at the
      favourable-outcome pole, with ECG and ambulatory rhythm monitoring, to establish
      whether the cardiac arm demonstrated in the mouse is present in humans who live
      beyond infancy and whether it warrants surveillance.

notes: >-
  Module conformance skips the epilepsy module's Excitation-Inhibition Imbalance
  node because the published chain runs from Nav1.6 channel-gating shifts to
  network epileptiform activity without an excitatory-inhibitory synaptic
  balance measurement. Seizure semiology is curated at HP:0001250 Seizure rather
  than split into tonic, focal, and migrating-focal subtypes because pooled
  series report semiology counts without per-patient denominators across all
  subtypes. Scope: this entry curates DEE47 and the broader FGF12-related
  epilepsy spectrum produced by the same recurrent variants. FGF12 also appears
  as a minor candidate gene in the Brugada syndrome literature; the only
  GeneReviews chapter returned by a live title/gene check (Bookshelf index plus
  PubMed) is the Brugada Syndrome chapter, where FGF12 is a mentioned cardiac
  gene rather than the subject of an epilepsy chapter.

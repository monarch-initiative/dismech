name: FGF12-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-20T00:20:00Z"
category: Mendelian
synonyms:
- Developmental and epileptic encephalopathy 47
- DEE47
- EIEE47
- FHF1-related epileptic encephalopathy
- FGF12-related epilepsy
description: >-
  FGF12-related developmental and epileptic encephalopathy (DEE47) is caused by
  heterozygous de novo gain-of-function variants in FGF12, most often the recurrent
  p.Arg52His change, and also by whole-gene duplication. Despite its name FGF12 is not a
  secreted growth factor: it encodes fibroblast growth factor homologous factor 1 (FHF1),
  an intracellular protein that binds the cytoplasmic C-terminal tail of voltage-gated
  sodium channels Nav1.6 and Nav1.2 and tunes their inactivation. The disorder is
  therefore a sodium channelopathy acting through a channel-binding partner rather than
  through the channel itself, which places it alongside the SCN2A and SCN8A entries in
  this knowledge base while remaining mechanistically distinct from them. Seizures begin
  in the neonatal or early infantile period. The phenotype has broadened considerably:
  what was described as a lethal encephalopathy now spans that severe form and a
  drug-responsive epilepsy with favourable cognitive outcome.
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 47
  term:
    id: MONDO:0014949
    label: developmental and epileptic encephalopathy, 47
parents:
- Epilepsy
- Neurological Disease
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Early-infantile developmental and epileptic encephalopathy and
      drug-responsive neonatal/infantile epilepsy driven by dysregulated
      neuronal voltage-gated sodium channel inactivation.
    evidence:
    - reference: PMID:42057324
      reference_title: "FGF12-Related Early-Onset Epileptic Encephalopathies: Therapeutic Response to Sodium Channel Blockers."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Variants in FGF12 have recently been associated with autosomal dominant DEEs characterized by early-onset epilepsy and neurodevelopmental impairment."
      explanation: >-
        Establishes FGF12-related DEE as a severe neurological epilepsy and
        neurodevelopmental disorder.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Monogenic disorder caused by germline gain-of-function missense variants,
      duplications, or biallelic loss-of-function structural/single-nucleotide
      variants in FGF12.
    evidence:
    - reference: PMID:37286232
      reference_title: "Biallelic structural variations within FGF12 detected by long-read sequencing in epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "FGF12 heterozygous recurrent missense variants with gain-of-function or heterozygous entire duplication of FGF12 are known causes of epilepsy, but biallelic SNVs/SVs have never been described"
      explanation: >-
        Summarizes both dominant and newly identified recessive monogenic
        routes in FGF12.
prevalence:
- population: Worldwide (published literature cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate is established; a 2025 systematic
    review compiled 27 patients with FGF12-related DEE (24 published plus 3 new
    duplication cases), alongside an additional 10-patient series without DEE
    and rare biallelic cases.
  evidence:
  - reference: PMID:42057324
    reference_title: "FGF12-Related Early-Onset Epileptic Encephalopathies: Therapeutic Response to Sodium Channel Blockers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report three patients with a duplication involving exons 1-4 of FGF12 on chromosome 3q28-q29 and systematically review 24 previously published cases of FGF12-related DEE."
    explanation: >-
      Systematic review identifying 27 reported cases of FGF12-related DEE in
      the literature.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous and usually de novo for the gain-of-function missense variants and
    duplications.
  evidence:
  - reference: PMID:27164707
    reference_title: "Gain-of-function FHF1 mutation causes early-onset epileptic encephalopathy with cerebellar atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A de novo heterozygous missense mutation was identified in the FHF1 gene (FHF1AR114H, FHF1BR52H) in the 2 affected siblings"
    explanation: >-
      Establishes the de novo heterozygous mechanism. Note the variant was de novo yet
      present in two siblings, which implies parental germline mosaicism and is relevant
      to recurrence-risk counselling.

- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    A separate, later-recognised biallelic loss-of-function route to the same clinical
    syndrome, established by long-read sequencing in an exome-negative patient. This is
    not a variant of the dominant mechanism but its inverse.
  evidence:
  - reference: PMID:37286232
    reference_title: "Biallelic structural variations within FGF12 detected by long-read sequencing in epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FGF12 heterozygous recurrent missense variants with gain-of-function or heterozygous entire duplication of FGF12 are known causes of epilepsy, but biallelic SNVs/SVs have never been described"
    explanation: >-
      States both the established dominant mechanisms and the novelty of the biallelic
      route at the time of report.

pathophysiology:
- name: FGF12 Gain-of-Function Missense Variant
  biological_scale: MOLECULAR
  description: >-
    The dominant lesion, most often p.Arg52His in the FHF1B isoform (equivalently
    p.Arg114His in FHF1A). Whole-gene duplication is an alternative dominant route acting
    through increased dosage rather than altered protein. FHFs were candidate epilepsy
    genes precisely because they bind Nav channels, which is how the gene was found.
  genes:
  - preferred_term: FGF12
    term:
      id: hgnc:3668
      label: FGF12
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Heterozygous germline gain-of-function missense variant (most commonly
      p.Arg52His / p.Arg114His or p.Gly50Ser / p.Gly112Ser) or whole-gene
      duplication.
  molecular_functions:
  - preferred_term: sodium channel regulator activity
    modifier: INCREASED
    term:
      id: GO:0017080
      label: sodium channel regulator activity
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:27164707
    reference_title: "Gain-of-function FHF1 mutation causes early-onset epileptic encephalopathy with cerebellar atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A de novo heterozygous missense mutation was identified in the FHF1 gene (FHF1AR114H, FHF1BR52H) in the 2 affected siblings"
    explanation: >-
      Identifies the recurrent variant in both isoform numbering systems.
  - reference: PMID:27164707
    reference_title: "Gain-of-function FHF1 mutation causes early-onset epileptic encephalopathy with cerebellar atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data demonstrate that gain-of-function FHF mutations can cause neurologic disorder, and expand the repertoire of genetic causes (FHF1) and mechanisms (altered Nav gating) underlying EOEE and cerebellar atrophy"
    explanation: >-
      The founding study's own statement of the gain-of-function mechanism and of altered
      Nav gating as the mechanistic class.
  downstream:
  - target: Weakened FHF1 Binding to the Nav Cytoplasmic Tail
    causal_link_type: DIRECT
    description: >-
      The variant's first measured consequence is on the protein-protein interaction.
    evidence:
    - reference: PMID:27164707
      reference_title: "Gain-of-function FHF1 mutation causes early-onset epileptic encephalopathy with cerebellar atrophy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Surprisingly, the gain-of-function effect is predicted to result from weaker interaction of mutant FHF1 with the Nav cytoplasmic tail"
      explanation: >-
        Links the mutant FHF1 missense substitution directly to weakened
        interaction with the Nav cytoplasmic tail.
  - target: Altered Cardiac Sodium Channel Function
    causal_link_type: DIRECT
    description: >-
      Mutant FHF1B directly alters steady-state and kinetic inactivation of
      cardiomyocyte sodium channels in parallel with its neuronal Nav1.6 effect.
    evidence:
    - reference: PMID:33982289
      reference_title: "Early onset epilepsy and sudden unexpected death in epilepsy with cardiac arrhythmia in mice carrying the early infantile epileptic encephalopathy 47 gain-of-function FHF1(FGF12) missense mutation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "ectopic overexpression of FHF1BR52H in cardiomyocytes induced a 15-mV depolarizing shift in voltage of steady-state sodium channel inactivation and slowed the rate of channel inactivation"
      explanation: >-
        Demonstrates direct modulation of cardiomyocyte sodium channel
        inactivation by FHF1B p.Arg52His.

- name: Weakened FHF1 Binding to the Nav Cytoplasmic Tail
  biological_scale: MOLECULAR
  description: >-
    The counterintuitive step, and the reason it is curated as its own node. The
    gain-of-function effect is predicted to arise from a *weaker* interaction between
    mutant FHF1 and the sodium channel cytoplasmic tail - a loss of binding producing a
    gain of channel function. Collapsing this into the downstream channel node would hide
    the fact that the direction of the binding change is opposite to the direction of the
    functional change.
  molecular_functions:
  - preferred_term: sodium channel regulator activity
    modifier: ABNORMAL
    term:
      id: GO:0017080
      label: sodium channel regulator activity
  evidence:
  - reference: PMID:27164707
    reference_title: "Gain-of-function FHF1 mutation causes early-onset epileptic encephalopathy with cerebellar atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Surprisingly, the gain-of-function effect is predicted to result from weaker interaction of mutant FHF1 with the Nav cytoplasmic tail"
    explanation: >-
      States the inverted relationship between binding strength and functional outcome,
      including the authors' own note that it is surprising.
  downstream:
  - target: Depolarizing Shift in Nav1.6 Fast Inactivation
    causal_link_type: DIRECT
    description: >-
      Altered binding changes the channel's inactivation behaviour.
    evidence:
    - reference: PMID:27164707
      reference_title: "Gain-of-function FHF1 mutation causes early-onset epileptic encephalopathy with cerebellar atrophy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mutant FHF1 proteins had a strong gain-of-function phenotype in transfected Neuro2A cells, enhancing the depolarizing shifts in Nav1.6 voltage-dependent fast inactivation, predicting increased neuronal excitability"
      explanation: >-
        Shows mutant FHF1 directly enhances the depolarizing shift in Nav1.6
        fast inactivation.


    snippet: "callosal agenesis and pontine hypoplasia, delayed myelination"
    explanation: Consistent neuroradiological features on brain MRI.
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

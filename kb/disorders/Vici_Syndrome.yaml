prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Incidence and population prevalence are unknown. A 2016 review counted around 50
    genetically confirmed cases and judged the condition rare but probably
    underdiagnosed; this case count is not a population-rate denominator.
  evidence:
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of Vici syndrome is unknown."
    explanation: The review explicitly states that incidence is unknown, so no numeric prevalence band is asserted.
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "around 50 genetically confirmed cases published to date"
    explanation: Supports the historical cases-in-literature count without converting it to a population prevalence.

diagnosis:
- name: EPG5 molecular genetic testing
  description: >-
    Diagnosis is established by identifying biallelic pathogenic EPG5 variants on
    molecular testing in a proband with suggestive clinical findings; Vici syndrome
    should be considered once mitochondrial, glycogen, and lysosomal storage
    disorders have been excluded.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:36228046
    reference_title: "EPG5-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "confirmed by identification of biallelic pathogenic (or likely pathogenic) variants in EPG5 on molecular testing"
    explanation: GeneReviews diagnostic criterion for EPG5-related disorder.
- name: Baseline multisystem assessment and surveillance
  description: >-
    Initial evaluation should include brain MRI, ophthalmology, cardiac ultrasound,
    immune-function testing, and renal, thyroid, and liver assessment. Surveillance
    is manifestation-directed, with continued cataract, cardiomyopathy, and immune
    monitoring emphasized because these features may evolve after presentation.
  evidence:
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Other useful diagnostic investigations to document the extent of multisystem involvement (summarized in Table 2) include an MRI of the brain (in particular to document the callosal agenesis, one of the key diagnostic features), EEG, ophthalmology assesment including slit lamp examination and VEPs, chest x-ray, cardiac assess- ment including cardiac ultrasound, an abdominal ultra- sound to document the extent of organ involvement, laboratory investigations assessing immune, thyroid, liver and renal function" # codespell:ignore-line
    explanation: The review lists baseline neurologic, ocular, cardiac, abdominal, immune, thyroid, liver, and renal assessment.
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "some of these features (in particular cata- racts, cardiomyopathy and immunodeficiency) may only evolve over time and are not necessarily present from birth."
    explanation: Supports continued surveillance because cataract, cardiac, and immune manifestations can evolve after birth.

progression:
- notes: >-
    Classic Vici syndrome is a progressive, life-limiting disorder: median survival
    is about 24 months with only ~10% of children surviving beyond five years. The
    most common causes of death are respiratory infections from the primary
    immunodeficiency and cardiac failure from the progressive cardiomyopathy.
  evidence:
  - reference: PMID:26917586
    reference_title: "EPG5-related Vici syndrome: a paradigm of neurodevelopmental disorders with defective autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "median survival time of 24 months (95% confidence interval 0-49 months), with only a 10th of patients surviving to 5 years of age"
    explanation: Natural-history survival data from the largest cohort.
  - reference: PMID:36228046
    reference_title: "EPG5-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the most common causes of death are respiratory infections as a result of primary immunodeficiency and/or cardiac insufficiency resulting from progressive cardiac failure"
    explanation: GeneReviews states the leading causes of death.
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The degree of cardiac involvement and/or the extent of the associated immunodeficiency are the most important prognostic indicators."
    explanation: The review identifies cardiac disease and immunodeficiency severity as the principal prognostic indicators.

histopathology:
- name: Autophagic vacuolar myopathy
  description: >-
    Skeletal muscle biopsy shows accumulation of autophagy substrates, abnormal
    glycogen storage, autophagic vacuoles, and secondary mitochondrial abnormalities,
    the histopathological signature of the autophagic-clearance defect.
  evidence:
  - reference: PMID:26917586
    reference_title: "EPG5-related Vici syndrome: a paradigm of neurodevelopmental disorders with defective autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "abnormal glycogen storage, presence of autophagic vacuoles and secondary mitochondrial abnormalities"
    explanation: Muscle histopathology in Vici syndrome.

treatments:
- name: Multidisciplinary supportive care
  description: >-
    No curative therapy exists. Management is multidisciplinary, supportive, and
    directed at the manifestations and complications present in each child.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36228046
    reference_title: "EPG5-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There is no cure for EPG5-related disorder."
    explanation: GeneReviews states that no curative treatment is available.
  - reference: PMID:36228046
    reference_title: "EPG5-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Supportive multidisciplinary care to improve quality of life, optimize function, and reduce complications"
    explanation: GeneReviews establishes multidisciplinary supportive care as the mainstay of management.
- name: Immunoglobulin replacement and infection prophylaxis
  description: >-
    Combined immunodeficiency may require regular intravenous immunoglobulin infusions
    and antimicrobial prophylaxis. Active chest infections require early, aggressive
    antibacterial and antifungal treatment because they can progress to life-threatening
    sepsis.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "may require regular intraven- ous immunoglobulin infusions and antimicrobial prophylaxis"
    explanation: The Vici review directly supports IV immunoglobulin and antimicrobial prophylaxis for the immunodeficiency.
  - reference: PMID:36228046
    reference_title: "EPG5-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "rigorous and early antibacterial and antifungal treatment (potentially in an intensive care unit setting) should be considered for chest infections to prevent episodes of life-threatening sepsis"
    explanation: GeneReviews recommends aggressive early anti-infective treatment given the primary immunodeficiency.
- name: Antiseizure medication
  description: >-
    Seizures should be treated with appropriate antiseizure medication. Responses to
    drugs with potential autophagy-modulating properties, including carbamazepine,
    should be monitored closely after treatment starts.
  treatment_term:
    preferred_term: anticonvulsant therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:

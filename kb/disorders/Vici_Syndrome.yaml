name: Vici Syndrome
creation_date: "2026-07-27T12:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Vici syndrome
  term:
    id: MONDO:0009452
    label: Vici syndrome
synonyms:
- EPG5-related disorder
- absent corpus callosum-cataract-immunodeficiency syndrome
- immunodeficiency with cleft lip/palate, cataract, hypopigmentation and absent corpus callosum
references:
- reference: PMID:36228046
  title: "EPG5-Related Disorder"
  tags:
  - GeneReviews
description: >-
  Vici syndrome is a severe, autosomal recessive, progressive multisystem
  neurodevelopmental disorder caused by loss-of-function variants in EPG5, a key
  regulator of the late (autophagosome-lysosome fusion) step of macroautophagy. It
  is one of the most extensive congenital disorders of autophagy. The classic
  phenotype is defined by a cardinal pentad - agenesis of the corpus callosum,
  cataracts, oculocutaneous hypopigmentation, cardiomyopathy, and combined
  immunodeficiency - together with profound developmental delay, acquired
  microcephaly, and failure to thrive. Because autophagic flux is most critical in
  long-lived, terminally differentiated cells, the disease preferentially injures
  neurons, cardiomyocytes, skeletal muscle, and immune cells.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  description: >-
    Vici syndrome is inherited in an autosomal recessive manner; most EPG5 variants
    are truncating (loss-of-function). EPG5-related disorder is a continuum, with
    classic Vici syndrome at the most severe end.
  evidence:
  - reference: PMID:23222957
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified recessive mutations in EPG5 (previously KIAA1632), indicating a causative role in Vici syndrome."
    explanation: Establishes recessive EPG5 loss-of-function as the cause of Vici syndrome.

genetic:
- name: EPG5
  gene_term:
    preferred_term: EPG5
    term:
      id: hgnc:29331
      label: EPG5
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    EPG5 (18q12.3) is the human homolog of the metazoan-specific autophagy gene
    epg-5. Most reported variants are truncating loss-of-function alleles.
  evidence:
  - reference: PMID:26917586
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 39 different EPG5 mutations, most of them truncating"
    explanation: The largest cohort confirms EPG5 loss-of-function as causative, most variants truncating.
  variants:
  - name: EPG5 truncating loss-of-function variants
    description: >-
      Most EPG5 variants are private and truncating, predicted to reduce EPG5
      protein; three recurrent mutations (p.Met2242Cysfs*5, p.Arg417*, p.Gln336Arg)
      suggest possible founder effects. Genotype correlates with outcome: survival is
      significantly better in individuals with compound heterozygous genotypes.
    evidence:
    - reference: PMID:26917586
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "most of them truncating and predicted to result in reduced EPG5 protein"
      explanation: Most variants are truncating, reducing EPG5 protein.
    - reference: PMID:26917586
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Most mutations were private, but three recurrent mutations"
      explanation: Most variants are private; three recurrent mutations suggest founder effects.
    - reference: PMID:26917586
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Survival outcomes were significantly better in patients with compound heterozygous mutations"
      explanation: Compound heterozygous genotypes carry a survival advantage - a genotype-outcome correlation.

has_subtypes:
- name: Classic Vici
  display_name: Classic Vici syndrome
  description: >-
    The most severe end of the EPG5-related disorder continuum: the full cardinal
    combination of agenesis of the corpus callosum, cataracts, hypopigmentation,
    cardiomyopathy, combined immunodeficiency, microcephaly, and failure to thrive.
  evidence:
  - reference: PMID:36228046
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "agenesis of the corpus callosum, cataracts, hypopigmentation, cardiomyopathy, combined immunodeficiency, microcephaly, and failure to thrive"
    explanation: GeneReviews defines classic Vici syndrome at the severe end of the EPG5-related disorder spectrum.
- name: Attenuated EPG5-related disorder
  display_name: Attenuated EPG5-related neurodevelopmental disorder
  description: >-
    The milder end of the continuum: attenuated neurodevelopmental phenotypes with
    variable, less complete multisystem involvement.
  evidence:
  - reference: PMID:36228046
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "milder end of the spectrum are attenuated neurodevelopmental phenotypes with variable multisystem involvement"
    explanation: GeneReviews frames the attenuated end of the EPG5-related disorder continuum.

pathophysiology:
- name: EPG5 Loss of Function
  description: >-
    Biallelic truncating (or other loss-of-function) EPG5 variants eliminate or
    severely reduce functional EPG5 protein, the metazoan-specific late-autophagy
    regulator.
  biological_processes:
  - preferred_term: macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
    modifier: DECREASED
  downstream:
  - target: Impaired Autophagosome-Lysosome Fusion
  evidence:
  - reference: PMID:23222957
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "EPG5 is the human homolog of the metazoan-specific autophagy gene epg-5, encoding a key autophagy regulator"
    explanation: Identifies EPG5 as the causative autophagy-regulator gene.
- name: Impaired Autophagosome-Lysosome Fusion
  description: >-
    EPG5 acts specifically at the late step of autophagy - the fusion of the
    autophagosome with a lysosome to form the degradative autolysosome. Its loss
    impairs this fusion/maturation step rather than autophagosome formation.
  biological_processes:
  - preferred_term: autophagosome-lysosome fusion
    term:
      id: GO:0061909
      label: autophagosome-lysosome fusion
    modifier: DECREASED
  cellular_components:
  - preferred_term: autolysosome
    term:
      id: GO:0044754
      label: autolysosome
  downstream:
  - target: Block in Autophagic Flux with Accumulation of Autophagic Cargo
  evidence:
  - reference: PMID:23222957
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the fusion of LC3-positive puncta with lysosomes, as indicated by the colocalisation of LC3 with lysosome-associated membrane proteins (LAMP1), is reduced in Vici patient fibroblasts"
    explanation: Direct experimental demonstration that autophagosome-lysosome fusion is reduced in Vici patient cells.
  - reference: PMID:23222957
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Untreated patient-derived cells showed increased levels of p62/SQSTM1, Nbr1 and LC3, particularly of processed, lipidated LC3-II"
    explanation: Patient cells accumulate LC3-II and autophagy receptors, the biochemical signature of a fusion/clearance block.
- name: Block in Autophagic Flux with Accumulation of Autophagic Cargo
  description: >-
    Failed fusion produces a severe block in autophagosomal clearance, so
    non-degradative autophagosomes/autolysosomes and their undegraded cargo
    (including p62/SQSTM1 and protein aggregates) accumulate. Degradative autophagy
    flux is lost even though upstream autophagosome formation proceeds.
  cellular_components:
  - preferred_term: autolysosome
    term:
      id: GO:0044754
      label: autolysosome
  downstream:
  - target: Neurodevelopmental CNS Defect
  - target: Progressive Neurodegeneration
  - target: Cardiomyocyte Autophagic Dysfunction
  - target: Combined Immunodeficiency
  - target: Skeletal Myopathy
  - target: Melanocyte Dysfunction
  - target: Lens Fiber Cell Dysfunction
  evidence:
  - reference: PMID:23222957
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "severe block in autophagosomal clearance"
    explanation: Patient/cell studies show a severe block in autophagosomal clearance.
  - reference: PMID:23222957
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "accumulation of autophagic cargo in autophagosomes"
    explanation: Undegraded autophagic cargo accumulates because clearance is blocked.
- name: Neurodevelopmental CNS Defect
  description: >-
    Autophagy has a role in early neurodevelopment, so the flux block produces a
    structural neurodevelopmental defect - most characteristically agenesis of the
    corpus callosum, with pontine hypoplasia and delayed myelination - and profound
    developmental delay with acquired microcephaly.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: corpus callosum
    term:
      id: UBERON:0002336
      label: corpus callosum
  evidence:
  - reference: PMID:26917586
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "callosal agenesis and pontine hypoplasia, delayed myelination"
    explanation: Consistent structural neurodevelopmental CNS features in the 50-patient series.
- name: Progressive Neurodegeneration
  description: >-
    Distinct from the congenital neurodevelopmental defect, long-lived neurons
    accumulate undegraded autophagic cargo over time, producing a progressive
    neurodegenerative course superimposed on the developmental phenotype.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:26917586
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acquired microcephaly and regression of skills in long-term survivors suggests a neurodegenerative component superimposed on the principal neurodevelopmental defect"
    explanation: Acquired microcephaly and skill regression in survivors indicate a neurodegenerative process distinct from the congenital neurodevelopmental defect.
- name: Cardiomyocyte Autophagic Dysfunction
  description: >-
    Autophagy is a key regulator of cardiac homeostasis; impaired autophagic
    clearance in cardiomyocytes drives the cardiomyopathy that is a leading cause of
    death.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:23222957
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "autophagy plays an important role in the constant renewal of the post-mitotic cardiomyocyte"
    explanation: Autophagy is required for post-mitotic cardiomyocyte renewal, linking the clearance defect to cardiomyopathy.
- name: Combined Immunodeficiency
  description: >-
    Impaired autophagy in lymphocytes causes a combined (humoral and cellular)
    immunodeficiency with recurrent, often fatal infections.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  evidence:
  - reference: PMID:23222957
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "autophagy is also directly important for T-cell survival and proliferation"
    explanation: The T-cell-specific atg5 knockout mouse shows autophagy is required for T-cell survival/proliferation, supporting the immunodeficiency arm.
- name: Skeletal Myopathy
  description: >-
    Skeletal muscle shows a myopathy with accumulation of autophagy substrates and
    abnormal glycogen storage plus autophagic vacuoles - consistent with a primary
    autophagic-clearance defect in muscle.
  cell_types:
  - preferred_term: cell of skeletal muscle
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  evidence:
  - reference: PMID:26917586
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "abnormal glycogen storage, presence of autophagic vacuoles and secondary mitochondrial abnormalities"
    explanation: Muscle histopathology shows autophagic vacuoles and abnormal glycogen, consistent with the clearance defect.
- name: Melanocyte Dysfunction
  description: >-
    Autophagy contributes to melanosome biogenesis and handling in melanocytes;
    impaired clearance produces the oculocutaneous hypopigmentation of the cardinal
    pentad.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  evidence:
  - reference: PMID:23222957
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The finding of generalized hypopigmentation in Vici syndrome supports a functional relationship between melanogenesis and the autophagic machinery"
    explanation: The hypopigmentation of Vici syndrome links melanogenesis to the autophagic machinery.
- name: Lens Fiber Cell Dysfunction
  description: >-
    Autophagy mediates the programmed organelle clearance required for lens fiber
    cell maturation and transparency; its failure produces cataracts.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell


definitions:
- name: Vici syndrome eight-feature diagnostic rule
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    Manifestation of all eight cardinal features (agenesis of the corpus callosum,
    cataracts, hypopigmentation, cardiomyopathy, combined immunodeficiency, profound
    developmental delay, progressive microcephaly, and failure to thrive) is a
    clinical rule for prioritizing EPG5 testing.
  scope: Clinical rule for prioritizing molecular EPG5 testing
  evidence:
  - reference: PMID:26917586
    reference_title: "EPG5-related Vici syndrome: a paradigm of neurodevelopmental disorders with defective autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The manifestation of all eight of these features has a specificity of 97%, and a sensitivity of 89% for the presence of an EPG5 mutation"
    explanation: The eight-feature combination has 97% specificity and 89% sensitivity for an EPG5 mutation.

differential_diagnoses:
- name: Marinesco-Sjogren syndrome and related disorders
  description: >-
    Marinesco-Sjogren syndrome is a close syndromic mimic because cataracts and
    skeletal myopathy can occur with sensorineural hearing loss. Failure to thrive and
    acquired microcephaly are uncommon and developmental delay is usually less severe
    in Marinesco-Sjogren syndrome.
  distinguishing_features:
  - Shared cataract and skeletal myopathy make Marinesco-Sjogren syndrome a close clinical mimic.
  evidence:
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Marinesco-Sjoegren syndrome (MSS) and related disorders share cataracts and a skel- etal muscle myopathy with or without sensorineural"
    explanation: The review specifically names Marinesco-Sjogren syndrome among syndromic Vici mimics and identifies the overlapping features.
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "failure to thrive and acquired micro- cephaly are uncommon and the degree of deve- lopmental delay is also usually less severe"
    explanation: These differences help distinguish Marinesco-Sjogren syndrome from classic Vici syndrome.
- name: Mitochondrial, glycogen storage, and lysosomal storage disorders
  description: >-
    Multisystem neurodevelopmental disorders with overlapping features that should be
    excluded before diagnosing Vici syndrome; the cardinal pentad and EPG5 genotype
    distinguish it.
  distinguishing_features:
  - Vici syndrome is considered once mitochondrial, glycogen, and lysosomal storage disorders have been excluded.
  evidence:
  - reference: PMID:26917586
    reference_title: "EPG5-related Vici syndrome: a paradigm of neurodevelopmental disorders with defective autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "should be considered in patients with suggestive features in whom mitochondrial, glycogen, or lysosomal storage disorders have been excluded"
    explanation: Byrne frames these as the differential diagnoses to exclude.


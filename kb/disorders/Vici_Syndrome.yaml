    reference_title: "Vici syndrome: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More than half of patients with Vici syndrome have seizures that ought to be managed with appropriate anti- convulsant therapy."
    explanation: The review recommends appropriate anticonvulsant therapy for the common seizure disorder.
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "responses to anticonvulsants (or, indeed, other drugs) with potentially autophagy-modulating properties such as carbamazepine should perhaps be monitored closely following initiation of treatment."
    explanation: The review recommends close monitoring when starting potentially autophagy-modulating drugs such as carbamazepine.

animal_models:
- name: Epg5-null knockout mouse
  species: Mus musculus
  category: Epg5 knockout model
  description: >-
    Epg5-null mice reproduce the autophagy defect and skeletal-muscle myopathy and
    develop progressive motor and neurodegenerative abnormalities. The model supports
    the muscle and neuronal arms but does not establish fidelity to the full human
    cardinal phenotype.
  associated_phenotypes:
  - Autophagy defect
  - Skeletal muscle myopathy
  - Progressive motor deficit and neurodegeneration
  evidence:
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The phenotype of epg5-/-KO mice recapitulates the autophagy defect and the skeletal muscle myopathy seen in humans with Vici syndrome"
    explanation: The established knockout mouse reproduces the core autophagy and myopathy phenotypes.
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "in addition exhibits clinical and pathological neurodegenerative features, in particular progressive motor deficit, muscle atrophy and damage of cortical 5 layer and spinal motor neurones"
    explanation: Supports the progressive motor and neurodegenerative abnormalities described for the knockout mouse.
- name: epg5 (CG14299) RNAi knockdown Drosophila
  species: Drosophila melanogaster
  category: Autophagy-gene knockdown model
  description: >-
    RNAi downregulation of the EPG5 ortholog epg5 (CG14299) in Drosophila produces
    autophagic abnormalities and progressive neurodegeneration, supporting the
    neurodevelopment-neurodegeneration link but capturing only the neuronal arm of
    the human multisystem phenotype.
  associated_phenotypes:
  - Autophagic abnormalities
  - Progressive neurodegeneration
  evidence:
  - reference: PMID:26917586
    reference_title: "EPG5-related Vici syndrome: a paradigm of neurodevelopmental disorders with defective autophagy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "downregulation of epg5 (CG14299) in Drosophila resulted in autophagic abnormalities and progressive neurodegeneration"
    explanation: The Drosophila epg5-knockdown model recapitulates the neurodegenerative arm.

discussions:
- discussion_id: gap_vici_autophagy_therapeutics
  prompt: >-
    Because Vici syndrome is caused by a block at the late autophagosome-lysosome
    fusion step (not autophagosome formation), can autophagy-modulating or
    lysosome-directed therapies restore degradative flux, and in which tissues and
    developmental window would they need to act?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Block in Autophagic Flux with Accumulation of Autophagic Cargo
  rationale: >-
    EPG5 acts specifically at the fusion/maturation step, so classical
    autophagy-inducing agents (e.g. mTOR inhibitors) that increase autophagosome
    formation could worsen rather than relieve the downstream clearance block. No
    disease-modifying or autophagy-directed therapy has been evaluated clinically,
    and the congenital (agenesis of the corpus callosum) versus progressive
    (neurodegeneration, cardiomyopathy) components likely have different therapeutic
    windows. Defining a flux-restoring strategy and its timing is the central open
    question.
  proposed_experiments:
  - experiment_id: exp_vici_flux_restoration
    name: Screen for autolysosomal-flux restoration in EPG5-null cells
    description: >-
      Use EPG5-null patient iPSC-derived neurons and cardiomyocytes to screen
      lysosome-/fusion-directed compounds for restoration of degradative autophagic
      flux (p62/SQSTM1 turnover, LC3-II clearance), distinguishing agents that help
      from autophagy inducers that may aggravate cargo accumulation.
- discussion_id: hmm_vici_drosophila_model
  prompt: >-
    How faithfully do existing Drosophila and Epg5-null mouse models reproduce the
    human multisystem Vici phenotype beyond their neuronal and skeletal-muscle arms?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Neurodegeneration
  rationale: >-
    Drosophila EPG5 knock-down supports the neuronal arm, while an established
    Epg5-null mouse reproduces the autophagy defect, skeletal myopathy, and progressive
    neurodegeneration. Neither evidence base demonstrates reproduction of the full
    human combination of callosal agenesis, cardiomyopathy, cataracts, pigmentation,
    and combined immunodeficiency, so multisystem translational fidelity remains
    uncertain.
  proposed_experiments:
  - experiment_id: exp_vici_model_fidelity
    name: Cross-model comparison of EPG5 loss against the human cardinal pentad
    description: >-
      Systematically compare existing Drosophila and mouse models with zebrafish and
      human iPSC-derived systems for reproduction of each cardinal feature to identify
      which combination best captures the multisystem phenotype.
  evidence:
  - reference: PMID:26917586
    reference_title: "EPG5-related Vici syndrome: a paradigm of neurodevelopmental disorders with defective autophagy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the neuronal phenotype of EPG5 knock-down in Drosophila melanogaster"
    explanation: The Drosophila model captures the neuronal phenotype but not the full multisystem pentad.
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The phenotype of epg5-/-KO mice recapitulates the autophagy defect and the skeletal muscle myopathy seen in humans with Vici syndrome"
    explanation: The mouse model improves on Drosophila for muscle involvement but still leaves full multisystem fidelity unresolved.
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "in addition exhibits clinical and pathological neurodegenerative features, in particular progressive motor deficit, muscle atrophy and damage of cortical 5 layer and spinal motor neurones"
    explanation: The mouse also reproduces progressive motor and neurodegenerative features, while other cardinal systems remain untested.
review_notes: >-
  The 2026-07-27 Claude Code deep-research artifact predates this review and its
  serialized Output section contains only a trailing terminology addendum rather
  than the full narrative. It should be regenerated in a separate research pass;
  this PR does not treat that degraded artifact as evidence. The present review
  instead uses exact cached excerpts from the primary cohort, GeneReviews, and the
  full-text clinical review. Phenotype-to-mechanism edges remain intentionally
  absent where those sources establish occurrence but not a causal route.

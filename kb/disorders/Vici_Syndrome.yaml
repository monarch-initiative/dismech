name: Vici Syndrome
creation_date: "2026-07-27T12:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Vici syndrome
  term:
    id: MONDO:0009452
    label: Vici syndrome
synonyms:
- absent corpus callosum-cataract-immunodeficiency syndrome
- immunodeficiency with cleft lip/palate, cataract, hypopigmentation and absent corpus callosum
references:
- reference: PMID:36228046
  title: "EPG5-Related Disorder"
  tags:
  - GeneReviews
- reference: PMID:26927810
  title: "Vici syndrome: a review"
description: >-
  Vici syndrome is a severe, autosomal recessive, progressive multisystem
  neurodevelopmental disorder caused by loss-of-function variants in EPG5, a key
  regulator of the late (autophagosome-lysosome fusion) step of macroautophagy. It
  is one of the most extensive congenital disorders of autophagy. The classic
  phenotype is defined by a cardinal pentad - agenesis of the corpus callosum,
  cataracts, oculocutaneous hypopigmentation, cardiomyopathy, and combined
  immunodeficiency - together with profound developmental delay, acquired
  microcephaly, and failure to thrive. Defective autophagic clearance is especially
  consequential in long-lived neurons, cardiomyocytes, and skeletal muscle, while
  autophagy's distinct roles in lymphocyte homeostasis contribute to immune-system
  involvement.

classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Primary clinical home: a severe neurodevelopmental-then-neurodegenerative
      multisystem disorder with agenesis of the corpus callosum, epilepsy, and
      progressive brain atrophy.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: Autosomal recessive Mendelian disorder caused by biallelic EPG5 variants.
  mechanistic_category:
  - classification_value: proteotoxic disease
    notes: >-
      One of the congenital disorders of autophagy: EPG5 loss blocks
      autophagosome-lysosome fusion, so undegraded autophagic cargo (p62/SQSTM1,
      lipidated LC3-II) and protein aggregates accumulate - a proteostasis /
      proteotoxic mechanism.
  icimd_category:
  - classification_value: autophagy
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of autophagy"
      under category "Disorders of the metabolism of complex molecules
      (degradation)". Vici syndrome is the prototype congenital disorder of autophagy.
  iuis_category:
    classification_value: combined immunodeficiency with syndromic features
    notes: >-
      IUIS Table 2 (CID with syndromic features): the combined (T- and B-cell)
      immunodeficiency of Vici syndrome occurs within a syndromic multisystem
      disorder (the cardinal pentad). The immunodeficiency is one of the five
      cardinal diagnostic features rather than an incidental finding, and it is
      inseparable from the neurodevelopmental, ocular, cardiac and pigmentary
      manifestations caused by the same EPG5 autophagy defect — the defining
      Table 2 pattern.
    evidence:
    - reference: PMID:23222957
      reference_title: "Vici syndrome: a review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        a rare multisystem disorder characterized by callosal agenesis,
        cataracts, cardiomyopathy, combined immunodeficiency and hypopigmentation
      explanation: >-
        States both halves of the Table 2 criterion in one sentence: a combined
        immunodeficiency, carried within a defined multisystem syndrome.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  description: >-
    Vici syndrome is inherited in an autosomal recessive manner; most EPG5 variants
    are truncating and predicted to reduce EPG5 protein. Clinical severity varies
    among affected individuals.
  evidence:
  - reference: PMID:23222957
    reference_title: "Recessive mutations in EPG5 cause Vici syndrome, a multisystem disorder with defective autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified recessive mutations in EPG5 (previously KIAA1632), indicating a causative role in Vici syndrome."
    explanation: Establishes recessive EPG5 loss-of-function as the cause of Vici syndrome.
  - reference: PMID:26917586
    reference_title: "EPG5-related Vici syndrome: a paradigm of neurodevelopmental disorders with defective autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 39 different EPG5 mutations, most of them truncating and predicted to result in reduced EPG5 protein."
    explanation: Supports the predominance of truncating variants predicted to reduce EPG5 protein.
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "additional variable multisystem involvement that may affect virtually any organ system"
    explanation: Supports variable expressivity of multisystem involvement among affected individuals.
  - reference: PMID:36228046
    reference_title: "EPG5-Related Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Many individuals with EPG5-related disorder are born to consanguineous couples."
    explanation: GeneReviews documents consanguinity in many affected families, consistent with autosomal recessive inheritance.

genetic:
- name: EPG5
  gene_term:
    preferred_term: EPG5
    term:
      id: hgnc:29331
      label: EPG5
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    EPG5 (18q12.3) is the human homolog of the metazoan-specific autophagy gene
    epg-5. Most reported variants are truncating loss-of-function alleles.
  evidence:
  - reference: PMID:23222957
    reference_title: "Recessive mutations in EPG5 cause Vici syndrome, a multisystem disorder with defective autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified recessive mutations in EPG5 (previously KIAA1632), indicating a causative role in Vici syndrome."
    explanation: The human gene-discovery study establishes recessive EPG5 variants as causative.
  variants:
  - name: EPG5 pathogenic variants
    description: >-
      Most EPG5 variants are private and truncating, predicted to reduce EPG5
      protein. Three recurrent variants include two truncating alleles
      (p.Met2242Cysfs*5 and p.Arg417*) and the missense allele p.Gln336Arg and suggest
      possible founder effects. Compound heterozygosity was associated with longer
      survival in the reported cohort.
    evidence:
    - reference: PMID:26917586
      reference_title: "EPG5-related Vici syndrome: a paradigm of neurodevelopmental disorders with defective autophagy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "most of them truncating and predicted to result in reduced EPG5 protein"
      explanation: Most variants are truncating, reducing EPG5 protein.
    - reference: PMID:26917586
      reference_title: "EPG5-related Vici syndrome: a paradigm of neurodevelopmental disorders with defective autophagy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Most mutations were private, but three recurrent mutations (p.Met2242Cysfs*5, p.Arg417*, and p.Gln336Arg)"
      explanation: Most variants are private; the three recurrent variants suggest possible founder effects.
    - reference: PMID:26917586
      reference_title: "EPG5-related Vici syndrome: a paradigm of neurodevelopmental disorders with defective autophagy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Survival outcomes were significantly better in patients with compound heterozygous mutations"
      explanation: Compound heterozygosity was associated with longer survival in the reported cohort.

mechanistic_hypotheses:
- hypothesis_group_id: tissue_selective_autophagy_injury
  hypothesis_label: Tissue-Selective Injury from Defective Autophagy
  status: EMERGING
  description: >-
    The primary fusion and cargo-clearance defect is established, but whether each
    organ manifestation follows directly from impaired autophagy or from secondary
    consequences such as altered mitochondrial quality control and protein
    accumulation remains unresolved.
  evidence:
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "it remains unresolved if all manifestations of EPG5 deficiency are a direct conse- quence of the primary autophagy defect, or of the second- ary effects of defective autophagy"
    explanation: The review explicitly identifies uncertainty in the route from the primary defect to organ manifestations.
- hypothesis_group_id: autophagy_lens_link
  hypothesis_label: Autophagy-Lens Fiber Maturation Link
  status: EMERGING
  description: >-
    Failed autophagic organelle clearance may impair lens fiber-cell maturation and
    contribute to cataract formation, but this mechanism has not been demonstrated
    directly in Vici lens tissue.

pathophysiology:
- name: EPG5 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic truncating (or other loss-of-function) EPG5 variants eliminate or
    severely reduce functional EPG5 protein, the metazoan-specific late-autophagy
    regulator.
  genes:
  - preferred_term: EPG5
    term:
      id: hgnc:29331
      label: EPG5
  downstream:
  - target: Impaired Autophagosome-Lysosome Fusion
    causal_link_type: DIRECT
    description: EPG5 deficiency directly reduces autophagosome-lysosome fusion.
    evidence:
    - reference: PMID:23222957
      reference_title: "Recessive mutations in EPG5 cause Vici syndrome, a multisystem disorder with defective autophagy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the fusion of LC3-positive puncta with lysosomes, as indicated by the colocalisation of LC3 with lysosome-associated membrane proteins (LAMP1), is reduced in Vici patient fibroblasts"
      explanation: Patient fibroblasts directly demonstrate reduced fusion downstream of EPG5 deficiency.
  evidence:
  - reference: PMID:23222957
    reference_title: "Recessive mutations in EPG5 cause Vici syndrome, a multisystem disorder with defective autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EPG5 is the human homolog of the metazoan-specific autophagy gene epg-5, encoding a key autophagy regulator"
    explanation: Identifies EPG5 as the causative autophagy-regulator gene.
- name: Impaired Autophagosome-Lysosome Fusion
  biological_scale: CELLULAR
  description: >-
    EPG5 acts specifically at the late step of autophagy - the fusion of the
    autophagosome with a lysosome to form the degradative autolysosome. Its loss
    impairs this fusion/maturation step rather than autophagosome formation.
  biological_processes:
  - preferred_term: autophagosome-lysosome fusion
    term:
      id: GO:0061909
      label: autophagosome-lysosome fusion
    modifier: DECREASED
  cellular_components:
  - preferred_term: autolysosome
    term:
      id: GO:0044754
      label: autolysosome
  downstream:
  - target: Block in Autophagic Flux with Accumulation of Autophagic Cargo
    causal_link_type: DIRECT
    description: Reduced fusion prevents autophagosomal clearance and causes cargo accumulation.
    evidence:
    - reference: PMID:23222957
      reference_title: "Recessive mutations in EPG5 cause Vici syndrome, a multisystem disorder with defective autophagy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "resulting in the accumulation of autophagic cargo in autophagosomes"
      explanation: Patient cells directly connect EPG5-associated clearance failure with accumulated cargo.
  evidence:
  - reference: PMID:23222957
    reference_title: "Recessive mutations in EPG5 cause Vici syndrome, a multisystem disorder with defective autophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the fusion of LC3-positive puncta with lysosomes, as indicated by the colocalisation of LC3 with lysosome-associated membrane proteins (LAMP1), is reduced in Vici patient fibroblasts"
    explanation: Direct experimental demonstration that autophagosome-lysosome fusion is reduced in Vici patient cells.
  - reference: PMID:23222957
    reference_title: "Recessive mutations in EPG5 cause Vici syndrome, a multisystem disorder with defective autophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Untreated patient-derived cells showed increased levels of p62/SQSTM1, Nbr1 and LC3, particularly of processed, lipidated LC3-II"
    explanation: Patient cells accumulate LC3-II and autophagy receptors, the biochemical signature of a fusion/clearance block.
- name: Block in Autophagic Flux with Accumulation of Autophagic Cargo
  biological_scale: CELLULAR
  description: >-
    Failed fusion produces a severe block in autophagosomal clearance, so
    non-degradative autophagosomes/autolysosomes and their undegraded cargo
    (including p62/SQSTM1 and protein aggregates) accumulate. Degradative autophagy
    flux is lost even though upstream autophagosome formation proceeds.
  cellular_components:
  - preferred_term: autolysosome
    term:
      id: GO:0044754
      label: autolysosome
  downstream:
  - target: Neurodevelopmental CNS Defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - tissue_selective_autophagy_injury
    description: The developmental CNS phenotype is associated with the primary autophagy defect, but intervening tissue mechanisms remain unresolved.
  - target: Progressive Neurodegeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - tissue_selective_autophagy_injury
    description: Cargo-clearance failure is linked to progressive neurodegeneration through incompletely resolved neuronal intermediates.
  - target: Cardiomyocyte Autophagic Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - tissue_selective_autophagy_injury
    description: Impaired clearance plausibly disrupts cardiomyocyte homeostasis, but direct Vici cardiac-cell causation is limited.
  - target: Lymphocyte Autophagic Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - tissue_selective_autophagy_injury
    description: Autophagy supports lymphocyte homeostasis, but EPG5-specific immune intermediates are incompletely defined.
  - target: Skeletal Myopathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Autophagic vacuoles and stored cargo in patient muscle connect the clearance defect to myopathy.
  - target: Melanocyte Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - tissue_selective_autophagy_injury
    description: Clinical hypopigmentation supports a relationship with autophagy, but the melanocyte-specific chain remains unresolved.
  - target: Lens Fiber Cell Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - autophagy_lens_link
    description: This proposed lens-fiber mechanism lacks direct confirmation in Vici lens tissue.
  evidence:
  - reference: PMID:23222957
    reference_title: "Recessive mutations in EPG5 cause Vici syndrome, a multisystem disorder with defective autophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "severe block in autophagosomal clearance"
    explanation: Patient/cell studies show a severe block in autophagosomal clearance.
  - reference: PMID:23222957
    reference_title: "Recessive mutations in EPG5 cause Vici syndrome, a multisystem disorder with defective autophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "accumulation of autophagic cargo in autophagosomes"
    explanation: Undegraded autophagic cargo accumulates because clearance is blocked.
- name: Neurodevelopmental CNS Defect
  biological_scale: TISSUE
  description: >-
    Autophagy has a role in early neurodevelopment, so the flux block produces a
    structural neurodevelopmental defect - most characteristically agenesis of the
    corpus callosum, with pontine hypoplasia and delayed myelination - and profound
    developmental delay with acquired microcephaly.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: corpus callosum
    term:
      id: UBERON:0002336
      label: corpus callosum
  downstream:
  - target: Agenesis of the corpus callosum
    causal_link_type: DIRECT
    description: The structural CNS defect manifests directly as callosal agenesis.
  - target: Profound global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Widespread neurodevelopmental abnormalities contribute to profound developmental delay.
  - target: Pontine hypoplasia
    causal_link_type: DIRECT
    description: Pontine hypoplasia is a structural component of the neurodevelopmental phenotype.
  - target: Delayed myelination
    causal_link_type: DIRECT
    description: Delayed myelination is a recurrent structural-developmental imaging feature.
  evidence:
  - reference: PMID:26917586
    reference_title: "EPG5-related Vici syndrome: a paradigm of neurodevelopmental disorders with defective autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "callosal agenesis and pontine hypoplasia, delayed myelination"
    explanation: Consistent structural neurodevelopmental CNS features in the 50-patient series.
- name: Progressive Neurodegeneration
  biological_scale: TISSUE
  description: >-
    Distinct from the congenital neurodevelopmental defect, long-lived neurons
    accumulate undegraded autophagic cargo over time, producing a progressive
    neurodegenerative course superimposed on the developmental phenotype.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  downstream:
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Acquired microcephaly and skill regression mark the progressive neurodegenerative component.
  evidence:
  - reference: PMID:26917586
    reference_title: "EPG5-related Vici syndrome: a paradigm of neurodevelopmental disorders with defective autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acquired microcephaly and regression of skills in long-term survivors suggests a neurodegenerative component superimposed on the principal neurodevelopmental defect"
    explanation: Acquired microcephaly and skill regression in survivors indicate a neurodegenerative process distinct from the congenital neurodevelopmental defect.
- name: Cardiomyocyte Autophagic Dysfunction
  biological_scale: CELLULAR
  description: >-
    Autophagy is a key regulator of cardiac homeostasis. Impaired autophagic
    clearance therefore provides a plausible link to Vici cardiomyopathy, but the
    cited evidence establishes background cardiomyocyte biology rather than direct
    tissue-specific causation.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  downstream:
  - target: Cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Cardiomyocyte homeostatic failure is the proposed cellular route to the clinical cardiomyopathy.
  evidence:
  - reference: PMID:23222957
    reference_title: "Recessive mutations in EPG5 cause Vici syndrome, a multisystem disorder with defective autophagy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "autophagy plays an important role in the constant renewal of the post-mitotic cardiomyocyte"
    explanation: Autophagy is required for post-mitotic cardiomyocyte renewal, linking the clearance defect to cardiomyopathy.
- name: Lymphocyte Autophagic Dysfunction
  biological_scale: CELLULAR
  description: >-
    Autophagy is required for lymphocyte survival and homeostasis, providing a
    plausible route from EPG5 dysfunction to combined immunodeficiency. Human findings
    indicate prominent humoral impairment with a milder T-cell defect; the cited mouse
    result directly supports only the T-cell autophagy arm.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: Combined immunodeficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Lymphocyte autophagy dysfunction plausibly contributes to combined immunodeficiency, while EPG5-specific B- and T-cell intermediates remain incomplete.
  - target: Recurrent infections
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Combined immune dysfunction increases susceptibility to recurrent and severe infections.
  evidence:
  - reference: PMID:23222957
    reference_title: "Recessive mutations in EPG5 cause Vici syndrome, a multisystem disorder with defective autophagy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "autophagy is also directly important for T-cell survival and proliferation"
    explanation: The T-cell-specific atg5 knockout mouse shows autophagy is required for T-cell survival/proliferation, supporting the immunodeficiency arm.
  - reference: PMID:36228046
    reference_title: "EPG5-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cardiomyopathy, combined immunodeficiency, microcephaly, and failure to thrive"
    explanation: GeneReviews establishes combined immunodeficiency as part of classic Vici syndrome, without by itself proving the cellular mechanism.
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, these findings suggest prominent impairment of the humoral immune response with a milder defect of the T cell compartment"
    explanation: Human immune findings establish that humoral dysfunction is more prominent than the T-cell defect.
- name: Skeletal Myopathy
  biological_scale: TISSUE
  description: >-
    Skeletal muscle shows a myopathy with accumulation of autophagy substrates and
    abnormal glycogen storage plus autophagic vacuoles - consistent with a primary
    autophagic-clearance defect in muscle.
  cell_types:
  - preferred_term: cell of skeletal muscle
    term:
      id: CL:0000188
      label: cell of skeletal muscle
  downstream:
  - target: Myopathy
    causal_link_type: DIRECT
    description: Autophagic-vacuolar muscle pathology manifests clinically as myopathy.
  - target: Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Myopathic and neurologic involvement both contribute to marked hypotonia.
  evidence:
  - reference: PMID:26917586
    reference_title: "EPG5-related Vici syndrome: a paradigm of neurodevelopmental disorders with defective autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "abnormal glycogen storage, presence of autophagic vacuoles and secondary mitochondrial abnormalities"
    explanation: Muscle histopathology shows autophagic vacuoles and abnormal glycogen, consistent with the clearance defect.
- name: Melanocyte Dysfunction
  biological_scale: CELLULAR
  description: >-
    Generalized hypopigmentation supports a functional relationship between
    melanogenesis and autophagy, but the melanocyte-specific route from EPG5 loss to
    reduced pigmentation remains incompletely resolved.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  downstream:
  - target: Hypopigmentation of the skin
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The proposed melanocyte-autophagy defect manifests as relative cutaneous hypopigmentation.
  evidence:
  - reference: PMID:23222957
    reference_title: "Recessive mutations in EPG5 cause Vici syndrome, a multisystem disorder with defective autophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The finding of generalized hypopigmentation in Vici syndrome supports a functional relationship between melanogenesis and the autophagic machinery"
    explanation: The hypopigmentation of Vici syndrome links melanogenesis to the autophagic machinery.
- name: Lens Fiber Cell Dysfunction
  biological_scale: CELLULAR
  description: >-
    Cataracts are a cardinal feature of Vici syndrome; autophagy has been proposed to
    mediate the programmed organelle clearance required for lens fiber cell maturation
    and transparency, providing a plausible link between the clearance defect and
    cataract, though direct experimental confirmation in Vici lens tissue is lacking.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  downstream:
  - target: Cataract
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - autophagy_lens_link
    description: The proposed lens-fiber maturation defect may contribute to cataract, but direct Vici lens evidence is lacking.
  evidence:
  - reference: PMID:26927810
    reference_title: "Vici syndrome: a review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Bilateral cataracts are one of the “classical ” diagnostic features of Vici syndrome"
    explanation: The review supports the cataract association, but not the proposed lens-fiber autophagy mechanism.


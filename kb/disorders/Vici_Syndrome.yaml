treatments:
- name: Multidisciplinary supportive care
  description: >-
    No disease-modifying therapy exists. Management is supportive and
    complication-directed: nutritional support/gastrostomy for failure to thrive,
    heart-failure management for cardiomyopathy, and antimicrobial prophylaxis and
    immunoglobulin replacement for the combined immunodeficiency.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
- name: Immunoglobulin replacement and infection prophylaxis
  description: >-
    Immunoglobulin replacement and antimicrobial prophylaxis to reduce the burden of
    recurrent infection from the combined immunodeficiency, a leading cause of death.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
- name: Genetic counseling
  description: >-
    Autosomal recessive recurrence-risk counseling (25% per pregnancy), carrier
    testing, and reproductive options including prenatal/preimplantation testing.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: MAXO:0000079
      label: genetic counseling

discussions:
- discussion_id: gap_vici_autophagy_therapeutics
  prompt: >-
    Because Vici syndrome is caused by a block at the late autophagosome-lysosome
    fusion step (not autophagosome formation), can autophagy-modulating or
    lysosome-directed therapies restore degradative flux, and in which tissues and
    developmental window would they need to act?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Block in Autophagic Flux with Accumulation of Autophagic Cargo
  rationale: >-
    EPG5 acts specifically at the fusion/maturation step, so classical
    autophagy-inducing agents (e.g. mTOR inhibitors) that increase autophagosome
    formation could worsen rather than relieve the downstream clearance block. No
    disease-modifying or autophagy-directed therapy has been evaluated clinically,
    and the congenital (agenesis of the corpus callosum) versus progressive
    (neurodegeneration, cardiomyopathy) components likely have different therapeutic
    windows. Defining a flux-restoring strategy and its timing is the central open
    question.
  proposed_experiments:
  - experiment_id: exp_vici_flux_restoration
    name: Screen for autolysosomal-flux restoration in EPG5-null cells
    description: >-
      Use EPG5-null patient iPSC-derived neurons and cardiomyocytes to screen
      lysosome-/fusion-directed compounds for restoration of degradative autophagic
      flux (p62/SQSTM1 turnover, LC3-II clearance), distinguishing agents that help
      from autophagy inducers that may aggravate cargo accumulation.
- discussion_id: hmm_vici_drosophila_model
  prompt: >-
    Does EPG5 knock-down in Drosophila reproduce the human multisystem Vici
    phenotype, or only its neuronal component, and how well do invertebrate/rodent
    models capture the cardinal pentad?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Neurodevelopmental and Neurodegenerative CNS Injury
  rationale: >-
    The largest human series paired its clinical data with an EPG5 knock-down
    neuronal phenotype in Drosophila melanogaster, but an invertebrate model cannot
    reproduce agenesis of the corpus callosum, cardiomyopathy, cataracts, or combined
    immunodeficiency, so it validates only the neuronal arm of the mechanism. The
    translational fidelity of available models to the full human multisystem
    phenotype is uncertain.
  proposed_experiments:
  - experiment_id: exp_vici_model_fidelity
    name: Cross-model comparison of EPG5 loss against the human cardinal pentad
    description: >-
      Systematically compare Drosophila, zebrafish, mouse, and human iPSC-derived
      models of EPG5 loss for reproduction of each cardinal feature to identify which
      model best captures the multisystem phenotype.
  evidence:
  - reference: PMID:26917586
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the neuronal phenotype of EPG5 knock-down in Drosophila melanogaster"
    explanation: The Drosophila model captures the neuronal phenotype but not the full multisystem pentad.

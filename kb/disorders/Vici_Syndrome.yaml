treatments:
- name: Multidisciplinary supportive care
  description: >-
    No disease-modifying therapy exists. Management is supportive and
    complication-directed: nutritional support/gastrostomy for failure to thrive,
    heart-failure management for cardiomyopathy, and antimicrobial prophylaxis and
    immunoglobulin replacement for the combined immunodeficiency.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  evidence:
  - reference: PMID:36228046
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supportive multidisciplinary care to improve quality of life, optimize function, and reduce complications"
    explanation: GeneReviews establishes multidisciplinary supportive care as the mainstay of management.
- name: Immunoglobulin replacement and infection prophylaxis
  description: >-
    Immunoglobulin replacement and antimicrobial prophylaxis to reduce the burden of
    recurrent infection from the combined immunodeficiency, a leading cause of death.
    GeneReviews emphasizes early aggressive antibacterial/antifungal treatment of chest
    infections to prevent life-threatening sepsis.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  evidence:
  - reference: PMID:36228046
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rigorous and early antibacterial and antifungal treatment (potentially in an intensive care unit setting) should be considered for chest infections to prevent episodes of life-threatening sepsis"
    explanation: GeneReviews recommends aggressive early anti-infective treatment given the primary immunodeficiency.
- name: Genetic counseling
  description: >-
    Autosomal recessive recurrence-risk counseling (25% per pregnancy), carrier

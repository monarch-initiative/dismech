diagnosis:
- name: EPG5 molecular genetic testing
  description: >-
    Diagnosis is established by identifying biallelic pathogenic EPG5 variants on
    molecular testing in a proband with suggestive clinical findings; Vici syndrome
    should be considered once mitochondrial, glycogen, and lysosomal storage
    disorders have been excluded.
  diagnosis_term:
    preferred_term: clinical whole-exome sequencing
    term:
      id: MAXO:0009004
      label: clinical whole-exome sequencing
  evidence:
  - reference: PMID:36228046
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "confirmed by identification of biallelic pathogenic (or likely pathogenic) variants in EPG5 on molecular testing"
    explanation: GeneReviews diagnostic criterion for EPG5-related disorder.

progression:
- notes: >-
    Classic Vici syndrome is a progressive, life-limiting disorder: median survival
    is about 24 months with only ~10% of children surviving beyond five years. The
    most common causes of death are respiratory infections from the primary
    immunodeficiency and cardiac failure from the progressive cardiomyopathy.
  evidence:
  - reference: PMID:26917586
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "median survival time of 24 months (95% confidence interval 0-49 months), with only a 10th of patients surviving to 5 years of age"
    explanation: Natural-history survival data from the largest cohort.
  - reference: PMID:36228046
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the most common causes of death are respiratory infections as a result of primary immunodeficiency and/or cardiac insufficiency resulting from progressive cardiac failure"
    explanation: GeneReviews states the leading causes of death.


name: CD16 Deficiency
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: CD16 deficiency
  term:
    id: MONDO:0014313
    label: autosomal recessive primary immunodeficiency with defective spontaneous
      natural killer cell cytotoxicity
synonyms:
- immunodeficiency 20
- IMD20
- CD16 deficiency
- FCGR3A deficiency
- autosomal recessive primary immunodeficiency with defective spontaneous NK cell
  cytotoxicity
description: >-
  CD16 deficiency (immunodeficiency 20, IMD20) is an autosomal recessive inborn
  error of immunity caused by a homozygous FCGR3A missense variant, c.230T>A,
  which substitutes histidine for leucine at residue 66 (L66H) in the first
  extracellular immunoglobulin domain of CD16 (Fc-gamma receptor IIIA). Affected
  individuals present with unusually severe and persistent herpesvirus and human
  papillomavirus disease against an otherwise unremarkable immunological
  workup.

  The reason this entity is worth curating separately from the broader natural
  killer cell deficiencies is that it is a dissociated functional defect rather
  than an absence of cells or of a receptor. CD16 is expressed on the NK cell
  surface and still binds IgG Fc, so antibody-dependent cellular cytotoxicity is
  intact. What the substitution destroys is a conformational epitope on the
  membrane-distal face of the receptor - the same surface recognised by the
  monoclonal antibody B73.1 - and with it CD16's ability to associate with CD2.
  Spontaneous (antibody-independent) killing, which depends on that CD16-CD2
  partnership at the lytic immunological synapse, fails while ADCC continues.

  This makes CD16 a costimulatory partner in natural cytotoxicity rather than
  only an Fc receptor, and it means the two NK effector functions must be
  modelled as separate nodes: collapsing them into a single "NK dysfunction"
  step would erase the finding the disease exists to demonstrate.

  Whether the L66H allele is by itself sufficient to cause disease is
  genuinely unsettled, and the entry is written around that rather than past
  it. Four homozygotes have been described. Two had deficient spontaneous
  cytotoxicity with severe herpesvirus and papillomavirus disease. A third had
  recurrent viral infection and a difficult course after BCG, Epstein-Barr and
  varicella zoster, but normal spontaneous cytotoxicity and normal ADCC on
  formal testing, and that report closed by asking whether the genotype is
  causally related to NK deficiency at all. A fourth was ascertained
  incidentally on newborn screening, is clinically well, and has normal NK
  lytic function; her lymphopenia was traced to a 22q11.2 deletion rather than
  to FCGR3A. Population data compound the problem: L66H sits at roughly 5%
  allele frequency overall with about a hundred homozygotes in gnomAD, which is
  far too common for a fully penetrant recessive immunodeficiency.

  The gene-disease relationship is therefore recorded as DISPUTED and the
  allele as of uncertain significance, not as causative and pathogenic. The
  mechanism nodes below describe what was measured in the patients who were
  affected, and are not claims that every homozygote has them.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Symptomatic individuals reported to date carry the FCGR3A L66H substitution
    in the homozygous state, and heterozygous relatives have not been described
    as affected, so inheritance is recorded as autosomal recessive. That
    recording should be read with the penetrance caveat: homozygosity is common
    in the general population and at least one homozygote is clinically well,
    so homozygosity is not by itself sufficient for disease. The common FCGR3A
    V158F polymorphism that modulates ADCC is a separate allele with a
    different functional consequence and should not be conflated with L66H.
  evidence:
  - reference: PMID:8608639
    reference_title: "Natural Killer (NK) cell deficiency associated with an epitope-deficient
      Fc receptor type IIIA (CD16-II)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "homozygous for a T to A substitution at position 230 of CD16-II cDNA,
      predicting a Leu(66) to His(66) change in the first immunoglobulin domain"
    explanation: Establishes the homozygous state of the FCGR3A allele in the index
      patient.
  - reference: PMID:34448085
    reference_title: "Undetectable NK Cells due to the FCGR3A Variant, L66H, Which
      May Not Be Directly Disease-Causing."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The higher frequency in some populations suggests that the L66H variant
      alone is not sufficient to cause disease directly but instead may act as a risk
      factor with low disease penetrance."
    explanation: Qualifies the recessive model, proposing low-penetrance risk rather
      than simple recessive causation.
genetic:
- name: FCGR3A
  gene_term:
    preferred_term: FCGR3A
    term:
      id: hgnc:3619
      label: FCGR3A
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  association: >-
    FCGR3A encodes CD16a (Fc-gamma receptor IIIA), the low-affinity IgG Fc
    receptor expressed on CD56-dim natural killer cells, where it is the
    triggering receptor for antibody-dependent cellular cytotoxicity. The
    candidate allele is a single germline missense substitution in the
    membrane-distal immunoglobulin domain, carried homozygously. Because the
    receptor is still expressed and still binds Fc, it is a function-specific
    partial loss rather than a null.

    The relationship is recorded as DISPUTED rather than CAUSATIVE. Two
    homozygotes have a measured spontaneous-cytotoxicity defect, but a third
    had normal cytotoxicity and normal ADCC, a fourth is asymptomatic with
    normal NK lytic function, and the allele reaches roughly 5% frequency with
    about a hundred homozygotes in gnomAD. The most recent report concludes the
    variant is unlikely to be a direct genetic cause and proposes it as a
    low-penetrance risk factor instead. Curators should not treat an L66H
    homozygous genotype as diagnostic on its own.
  variants:
  - name: "FCGR3A L66H (reported as c.230T>A, c.197T>A, or p.L48H)"
    description: >-
      The single allele reported in every described case. It disrupts the B73.1
      monoclonal antibody epitope while leaving the 3G8 epitope and Fc binding
      intact. Recorded as of uncertain significance rather than pathogenic:
      about a hundred homozygotes appear in gnomAD, which is incompatible with
      a fully penetrant recessive immunodeficiency allele.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:8608639
      reference_title: "Natural Killer (NK) cell deficiency associated with an epitope-deficient
        Fc receptor type IIIA (CD16-II)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "homozygous for a T to A substitution at position 230 of CD16-II cDNA,
        predicting a Leu(66) to His(66) change in the first immunoglobulin domain"
      explanation: Defines the variant at nucleotide and amino-acid level in the index
        patient.
    - reference: PMID:34448085
      reference_title: "Undetectable NK Cells due to the FCGR3A Variant, L66H, Which
        May Not Be Directly Disease-Causing."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "it is observed in 7.1% of alleles of European ancestry including 68
        homozygotes, and a population frequency of about 5.0% including 100 homozygotes
        in overall populations"
      explanation: Population frequency incompatible with a fully penetrant pathogenic
        recessive allele; the basis for grading this variant uncertain rather than
        pathogenic.
  evidence:
  - reference: PMID:23006327
    reference_title: "Human immunodeficiency-causing mutation defines CD16 in spontaneous
      NK cell cytotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous missense mutation in CD16 (encoding a L66H substitution)
      is associated with severe herpesvirus infections in rare patients."
    explanation: Associates the homozygous FCGR3A L66H allele with the clinical immunodeficiency
      in the affected patients.
  - reference: PMID:34448085
    reference_title: "Undetectable NK Cells due to the FCGR3A Variant, L66H, Which
      May Not Be Directly Disease-Causing."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "this case report highlights that the L66H variant is unlikely a direct
      genetic cause of NK cell dysfunction."
    explanation: The most recent assessment of the allele, and the reason this gene-disease
      relationship is recorded as disputed.
  - reference: PMID:8874200
    reference_title: "Identification of an unusual Fc gamma receptor IIIa (CD16) on
      natural killer cells in a patient with recurrent infections."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Further analysis of the NK cell function in vitro and follow-up of the
      clinical course of Fc gamma RIIIA-48H/H homozygotes is required to ascertain
      whether this genotype is causally related to an NK cell immunodeficiency."
    explanation: The original pathogenicity caveat, raised in 1996 and not since resolved.
pathophysiology:
- name: FCGR3A L66H Substitution
  biological_scale: MOLECULAR
  description: >-
    A homozygous T-to-A transversion at position 230 of the FCGR3A coding
    sequence replaces leucine 66 with histidine in the first (membrane-distal)
    immunoglobulin-like domain of CD16. The receptor is still made and still
    reaches the NK cell surface; the lesion is confined to the local
    conformation of one surface loop.
  genetic_context:
    genes:
    - preferred_term: FCGR3A
      term:
        id: hgnc:3619
        label: FCGR3A
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      c.230T>A, p.Leu66His. Structural modelling of the mutant against the
      solved wild-type CD16 ectodomain predicts a shift in the B73.1 epitope
      loop with the overall fold otherwise preserved, consistent with selective
      loss of one function (spontaneous cytotoxicity) while Fc binding and ADCC
      are retained. It is therefore recorded as a partial, function-specific
      loss rather than a null allele.
  cell_types:
  - preferred_term: CD16-positive, CD56-dim natural killer cell
    term:
      id: CL:0000939
      label: "CD16-positive, CD56-dim natural killer cell, human"
  evidence:
  - reference: PMID:8608639
    reference_title: "Natural Killer (NK) cell deficiency associated with an epitope-deficient
      Fc receptor type IIIA (CD16-II)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "homozygous for a T to A substitution at position 230 of CD16-II cDNA,
      predicting a Leu(66) to His(66) change in the first immunoglobulin domain"
    explanation: Defines the causal variant at nucleotide and amino-acid level and
      localises it to the membrane-distal immunoglobulin domain.
  downstream:
  - target: Loss of the CD16 B73.1 Conformational Epitope
    causal_link_type: DIRECT
    description: >-
      The substitution sits within the B73.1 recognition site, so the epitope is
      lost as a direct structural consequence of the amino-acid change.

- name: Loss of the CD16 B73.1 Conformational Epitope
  biological_scale: MOLECULAR
  description: >-
    Patient NK cells are stained normally by the anti-CD16 antibody 3G8, which
    binds elsewhere on the receptor, but are not recognised by B73.1. CD16 is
    therefore present on the surface with a locally altered membrane-distal
    face. This is the structural pivot of the disease: it is what separates the
    arm of CD16 function that fails from the arm that does not.
  cell_types:
  - preferred_term: CD16-positive, CD56-dim natural killer cell
    term:
      id: CL:0000939
      label: "CD16-positive, CD56-dim natural killer cell, human"
  evidence:
  - reference: PMID:8608639
    reference_title: "Natural Killer (NK) cell deficiency associated with an epitope-deficient
      Fc receptor type IIIA (CD16-II)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which was not reactive with the anti-CD16-II MoAb B73.1"
    explanation: Documents loss of the B73.1 epitope on patient NK cells while the
      receptor itself remains detectable.
  downstream:
  - target: Failure of CD16-CD2 Association
    causal_link_type: DIRECT
    description: >-
      The altered face is the surface through which CD16 partners with CD2, so
      losing it abolishes the association.

- name: Failure of CD16-CD2 Association
  biological_scale: MOLECULAR
  description: >-
    In healthy NK cells CD16 associates biochemically with CD2, a coactivation
    receptor, and the two co-cluster at the lytic immunological synapse, so that
    engaging CD2 elicits CD16 signalling. The L66H receptor does not enter this
    association, and CD2 ligation no longer triggers CD16 signalling. Note that
    the synapse still forms; what fails is the CD16-CD2 partnership within it.
  cell_types:
  - preferred_term: CD16-positive, CD56-dim natural killer cell
    term:
      id: CL:0000939
      label: "CD16-positive, CD56-dim natural killer cell, human"
  molecular_functions:
  - preferred_term: cell adhesion molecule binding
    term:
      id: GO:0050839
      label: cell adhesion molecule binding
    modifier: DECREASED
  evidence:
  - reference: PMID:23006327
    reference_title: "Human immunodeficiency-causing mutation defines CD16 in spontaneous
      NK cell cytotoxicity."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "An association between CD16 and CD2 was identified biochemically and
      at the immunological synapse, which elicited CD16 signaling after CD2 engagement."
    explanation: Establishes the wild-type CD16-CD2 partnership. Graded partial because
      it documents the normal association rather than its failure; the item below
      carries the failure.
  - reference: PMID:23006327
    reference_title: "Human immunodeficiency-causing mutation defines CD16 in spontaneous
      NK cell cytotoxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Stable expression of CD16 L66H in NK-92 cells recapitulated the patient
      phenotype, abrogating association of CD16 with CD2 as well as CD16 signaling
      after CD2 ligation."
    explanation: Shows that introducing the patient allele alone is sufficient to
      abolish the association, which is what makes this step causal rather than correlative.
  downstream:
  - target: Reduced CD2 Surface Expression on CD56-dim NK Cells
    causal_link_type: DIRECT
  - target: Deficient Spontaneous NK Cell Cytotoxicity
    causal_link_type: DIRECT
    description: >-
      Loss of CD16-dependent costimulation through CD2 is the proximate cause of
      the natural-cytotoxicity defect.

- name: Reduced CD2 Surface Expression on CD56-dim NK Cells
  biological_scale: CELLULAR
  description: >-
    Patient NK cells carry less surface CD2 than controls, and the reduction is
    restricted to the CD56-dim, CD16-positive subset - CD2 levels on the
    CD16-negative CD56-bright subset are unaffected. The compartment-restricted
    pattern is the argument that the CD2 loss is downstream of mutant CD16
    rather than an independent trait, since it appears only where the mutant
    receptor is expressed.
  cell_types:
  - preferred_term: CD16-positive, CD56-dim natural killer cell
    term:
      id: CL:0000939
      label: "CD16-positive, CD56-dim natural killer cell, human"
  - preferred_term: CD16-negative, CD56-bright natural killer cell
    term:
      id: CL:0000938
      label: "CD16-negative, CD56-bright natural killer cell, human"
  evidence:
  - reference: PMID:23006327
    reference_title: "Human immunodeficiency-causing mutation defines CD16 in spontaneous
      NK cell cytotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with the L66H mutation had intact ADCC, but deficient spontaneous
      NK cell cytotoxicity and decreased surface expression of CD2, a coactivation
      receptor."
    explanation: Documents the reduced CD2 surface expression in both reported patients
      alongside the dissociated cytotoxicity phenotype.

- name: Preserved IgG Fc Binding and ADCC
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Antibody-dependent cellular cytotoxicity is intact in patient cells,
    measured against antibody-coated targets. The Fc-binding surface is not
    part of the loop altered by L66H, which is why this arm of CD16 function
    survives while the CD2 partnership does not.

    A deliberate negative node. It records a function that is retained, which
    is unusual for a pathophysiology graph but necessary here: the selectivity
    of the defect is the mechanistic claim, and a graph showing only the
    failing arm would misrepresent the disease as a general NK deficiency.
    Nothing points downstream into it, because preservation is the absence of
    an effect rather than something the epitope loss causes, and the available
    causal link types would export such an edge as a causal arrow.
  cell_types:
  - preferred_term: CD16-positive, CD56-dim natural killer cell
    term:
      id: CL:0000939
      label: "CD16-positive, CD56-dim natural killer cell, human"
  biological_processes:
  - preferred_term: antibody-dependent cellular cytotoxicity
    term:
      id: GO:0001788
      label: antibody-dependent cellular cytotoxicity
  molecular_functions:
  - preferred_term: IgG binding
    term:
      id: GO:0019864
      label: IgG binding
  evidence:
  - reference: PMID:8608639
    reference_title: "Natural Killer (NK) cell deficiency associated with an epitope-deficient
      Fc receptor type IIIA (CD16-II)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spontaneous NK cell activity of the patient's peripheral blood mononuclear
      cells (PBMC) was markedly decreased, while antibody-dependent cellular cytotoxicity
      (ADCC) was unaffected."
    explanation: Reports preserved ADCC in the index patient in the same assay series
      that showed loss of spontaneous killing.

- name: Deficient Spontaneous NK Cell Cytotoxicity
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Antibody-independent killing of susceptible target cells is markedly
    reduced in patient peripheral blood mononuclear cells. Because ADCC is
    preserved in the same cells, the defect is specific to the
    natural-cytotoxicity programme rather than to the lytic machinery as a
    whole - granule content and degranulation capacity are not the failing
    step.
  cell_types:
  - preferred_term: CD16-positive, CD56-dim natural killer cell
    term:
      id: CL:0000939
      label: "CD16-positive, CD56-dim natural killer cell, human"
  biological_processes:
  - preferred_term: natural killer cell mediated cytotoxicity
    term:
      id: GO:0042267
      label: natural killer cell mediated cytotoxicity
    modifier: DECREASED
  evidence:
  - reference: PMID:8608639
    reference_title: "Natural Killer (NK) cell deficiency associated with an epitope-deficient
      Fc receptor type IIIA (CD16-II)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spontaneous NK cell activity of the patient's peripheral blood mononuclear
      cells (PBMC) was markedly decreased, while antibody-dependent cellular cytotoxicity
      (ADCC) was unaffected."
    explanation: Direct measurement of the reduced spontaneous cytotoxicity that defines
      the disease.
  - reference: PMID:23006327
    reference_title: "Human immunodeficiency-causing mutation defines CD16 in spontaneous
      NK cell cytotoxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, CD16 serves a role in NK cell-mediated spontaneous cytotoxicity
      through a specific association with CD2 and represents a potential mechanism
      underlying a human congenital immunodeficiency."
    explanation: States the mechanistic conclusion linking the CD16-CD2 association
      to spontaneous cytotoxicity and to this immunodeficiency.
  - reference: PMID:8874200
    reference_title: "Identification of an unusual Fc gamma receptor IIIa (CD16) on
      natural killer cells in a patient with recurrent infections."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "NK cell function, analyzed in vitro by direct cytotoxicity on K562 target
      cells and ADCC-activity on P815 target cells, was normal compared with an age-matched
      healthy control."
    explanation: A homozygote in whom spontaneous cytotoxicity was normal. The defect
      is therefore not universal among carriers of the genotype, which is why this
      node is graded provisional.
  - reference: PMID:34448085
    reference_title: "Undetectable NK Cells due to the FCGR3A Variant, L66H, Which
      May Not Be Directly Disease-Causing."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "normal NK cell lytic function by killing assay compared to controls"
    explanation: A second homozygote with normal NK lytic function, ascertained incidentally
      rather than through infection.
  downstream:
  - target: Impaired Control of Herpesvirus and Papillomavirus Infection
    causal_link_type: DIRECT
    description: >-
      Natural cytotoxicity is a principal early defence against virus-infected
      cells, so its selective loss maps onto the observed infection spectrum.
      This step is inferred from the known role of NK cells rather than
      measured, and two homozygotes with normal cytotoxicity show it is not
      deterministic in either direction.
  - target: phenotypes#Decreased NK cell-induced killing of target cells
    causal_link_type: DIRECT
    description: >-
      The node's clinical measurement, tying the mechanism to the phenotype it
      is observed as.

- name: Impaired Control of Herpesvirus and Papillomavirus Infection
  biological_scale: ORGANISM
  description: >-
    In affected individuals the clinical consequence is unusually severe,
    persistent or recurrent disease with herpesviruses - herpes simplex virus
    in the index patient, Epstein-Barr virus and varicella zoster virus in
    others - and with human papillomavirus, against an otherwise normal
    immunological assessment. One homozygote also had a difficult course after
    BCG vaccination. The narrowness of the infection
    spectrum - viral rather than pyogenic or opportunistic-fungal - is
    consistent with a lesion confined to NK natural cytotoxicity rather than a
    combined immunodeficiency.
  evidence:
  - reference: PMID:23006327
    reference_title: "Human immunodeficiency-causing mutation defines CD16 in spontaneous
      NK cell cytotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous missense mutation in CD16 (encoding a L66H substitution)
      is associated with severe herpesvirus infections in rare patients."
    explanation: Links the genotype to the severe herpesvirus phenotype at the level
      of the clinical syndrome.
  - reference: PMID:8608639
    reference_title: "Natural Killer (NK) cell deficiency associated with an epitope-deficient
      Fc receptor type IIIA (CD16-II)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified a child with recurrent infections, especially with
      herpes simplex virus, who had a decreased number of CD56(+)CD3(-) NK cells in
      circulation."
    explanation: Reports the herpes simplex-predominant infection history of the index
      patient.

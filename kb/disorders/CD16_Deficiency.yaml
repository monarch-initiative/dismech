      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Mechanistic studies in a human NK cell line, NK-92, demonstrated that
        CD16 expression correlated with CD2 surface levels and enabled killing of a
        melanoma cell line typically resistant to CD16-deficient NK-92 cells."
      explanation: Supports a CD16 role in antibody-independent killing, but via the
        reconstitution arm rather than a matched L66H cytotoxicity comparison, which
        is why the relationship is recorded as partial recapitulation.
diagnosis:
- name: Flow cytometry with paired anti-CD16 clones
  description: >-
    The diagnostic signature is a discordance between two anti-CD16 antibodies
    on the same cells: NK cells stain normally with clone 3G8 but are not
    recognised by clone B73.1. A panel using only one anti-CD16 clone will
    report CD16 as normally expressed and miss the disease entirely, which is
    the practical reason this entity is under-recognised.
  evidence:
  - reference: PMID:8608639
    reference_title: "Natural Killer (NK) cell deficiency associated with an epitope-deficient
      Fc receptor type IIIA (CD16-II)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which was not reactive with the anti-CD16-II MoAb B73.1"
    explanation: Establishes the selective loss of B73.1 reactivity that the paired-clone
      approach detects.
- name: Paired spontaneous cytotoxicity and ADCC assays
  description: >-
    Measuring natural cytotoxicity against a susceptible target and ADCC against
    an antibody-coated target in the same sample demonstrates the dissociation
    that defines the disease. Either assay alone is uninformative: a normal ADCC
    result does not exclude the diagnosis, and a low natural-cytotoxicity result
    alone does not distinguish it from other NK functional defects.
  evidence:
  - reference: PMID:23006327
    reference_title: "Human immunodeficiency-causing mutation defines CD16 in spontaneous
      NK cell cytotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with the L66H mutation had intact ADCC, but deficient spontaneous
      NK cell cytotoxicity and decreased surface expression of CD2, a coactivation
      receptor."
    explanation: Reports the paired assay result in both patients that the diagnostic
      approach depends on.
- name: FCGR3A sequencing
  description: >-
    Confirmation rests on demonstrating the homozygous c.230T>A (p.Leu66His)
    substitution. Interpretation must keep this allele distinct from the common
    FCGR3A V158F functional polymorphism and from FCGR3B copy-number variation,
    neither of which causes this syndrome.
  evidence:
  - reference: PMID:8608639
    reference_title: "Natural Killer (NK) cell deficiency associated with an epitope-deficient
      Fc receptor type IIIA (CD16-II)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "homozygous for a T to A substitution at position 230 of CD16-II cDNA,
      predicting a Leu(66) to His(66) change in the first immunoglobulin domain"
    explanation: Identifies the confirmatory sequencing finding.
discussions:
- discussion_id: l66h_pathogenicity_disputed
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is homozygous FCGR3A L66H sufficient to cause immunodeficiency, or is it a
    low-penetrance risk factor that has been over-attributed?
  attaches_to:
  - genetic#FCGR3A
  - pathophysiology#Deficient Spontaneous NK Cell Cytotoxicity
  rationale: >-
    The four published homozygotes do not agree. Two had reduced spontaneous
    cytotoxicity with severe viral disease. A third had recurrent viral
    infection and a difficult course after BCG, Epstein-Barr and varicella
    zoster, yet formal testing showed normal spontaneous cytotoxicity and
    normal ADCC, and that report explicitly asked whether the genotype is
    causally related to NK deficiency. A fourth, found on newborn screening, is
    clinically well with normal NK lytic function and normal CD56-bright /
    CD56-dim distribution; her lymphopenia was traced to a 22q11.2 deletion.

    Population data are the strongest argument against simple causation: the
    allele sits near 5% frequency overall, with roughly a hundred homozygotes
    in gnomAD. A fully penetrant recessive immunodeficiency allele cannot be
    that common. The 2021 report concludes the variant is unlikely to be a
    direct genetic cause and proposes low-penetrance risk instead.

    Ascertainment is the obvious confounder in both directions: the affected
    patients were found because they were ill, and the well homozygote was
    found because of an unrelated screen. What would settle it is a systematic
    NK-function study of unselected homozygotes, which nobody has published.
    Until then this entry records the mechanism that was measured in affected
    patients without asserting that the genotype produces it in everyone.
- discussion_id: nk_cytopenia_inconsistent
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is reduced circulating NK cell number a feature of CD16 deficiency, a flow
    cytometry artifact, or neither?
  attaches_to:
  - phenotypes#Reduced total natural killer cell count
  rationale: >-
    Three mechanisms are in play and they should not be collapsed.

    First, a genuine artifact. Because L66H abolishes the B73.1 epitope, a
    panel that gates NK cells as CD3-negative, CD56-positive AND CD16-positive
    scores an L66H homozygote as having almost no NK cells, while the same
    blood gated on CD3-negative, CD56-positive gives a normal count. That is
    exactly what happened in the newborn-screening case: under one gate NK
    cells were absent, under another they were 26%. The 1996 report predicted
    this, warning that combining CD16 and CD56 antibodies on the same
    fluorochrome would leave these homozygotes undiagnosed.

    Second, and importantly, this does not explain the index patient. Jawahar
    gated on CD56-positive, CD3-negative cells without CD16, so the reduced
    count reported there is not the artifact and remains unexplained. Treating
    the artifact as a blanket dismissal would be wrong.

    Third, the second and fourth patients had normal NK numbers outright.

    The practical consequence is that NK lymphopenia is not usable as a
    screening criterion for this entity, and that any reported NK count for an
    L66H homozygote has to be read together with the gating strategy that
    produced it.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Four homozygotes have been described in the literature: the 1996 index
    patient, a second 1996 patient with normal cytotoxicity, the 2012 patient,
    and a 2021 asymptomatic newborn-screening case. The band applies to the
    clinical syndrome, not to the genotype - homozygosity for L66H is common,
    with roughly a hundred homozygotes recorded in gnomAD, so the rarity here
    is the rarity of being reported as affected rather than the rarity of
    carrying the allele.
  evidence:
  - reference: PMID:34448085
    reference_title: "Undetectable NK Cells due to the FCGR3A Variant, L66H, Which
      May Not Be Directly Disease-Causing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is observed in 7.1% of alleles of European ancestry including 68
      homozygotes, and a population frequency of about 5.0% including 100 homozygotes
      in overall populations"
    explanation: Gives the population frequency that separates genotype frequency from
      the rarity of the reported syndrome.
notes: >-
  Scope. This entry covers the syndrome reported in association with homozygous
  FCGR3A L66H. It deliberately does not cover the common FCGR3A V158F
  (rs396991) polymorphism, which modulates IgG affinity and ADCC efficacy and is
  studied as a pharmacogenomic modifier of therapeutic antibody response; that
  is a different allele making a different claim, and FCGR3A appears elsewhere
  in this knowledge base only in that polymorphic sense.

  One substitution, three numbering conventions. The same change is written
  c.230T>A / p.Leu66His in the 1996 index report and the 2012 study, c.197T>A
  (p.L66H) in the 2021 report, and p.L48H in the 1996 Blood report, which
  numbered from the mature protein rather than including the signal peptide.
  These are not three alleles. Note also that the c. positions above are the
  sources' own cDNA-position phrasing rather than transcript-validated HGVS
  designations, and should not be treated as canonical HGVS.

  Causality. The gene-disease relationship is recorded as DISPUTED and the
  allele as UNCERTAIN_SIGNIFICANCE. See the l66h_pathogenicity_disputed
  discussion for the argument; briefly, two of four published homozygotes have
  the cytotoxicity defect, the allele is far too common for a fully penetrant
  recessive immunodeficiency, and the most recent report concludes it is
  unlikely to be a direct genetic cause.

  Treatments. No treatment section is curated because no disease-directed
  therapy has been reported for this entity. Management in the published cases
  was directed at the individual infections. Rather than record a generic
  supportive-care entry with no citable evidence behind it, the section is left
  absent.

  Evidence base. Four papers describing four homozygotes between them, with the
  cellular mechanism established in a reconstituted cell line rather than in
  primary patient cells. The entry is written to make that thinness and the
  disagreement visible rather than to smooth them over - hence the explicit
  preserved-function node, the partial-recapitulation grading on the
  cytotoxicity model link, the REFUTE-graded evidence on the cytotoxicity node,
  and the two controversy entries.

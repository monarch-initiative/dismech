name: CD16 Deficiency
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: CD16 deficiency
  term:
    id: MONDO:0014313
    label: autosomal recessive primary immunodeficiency with defective spontaneous
      natural killer cell cytotoxicity
synonyms:
- immunodeficiency 20
- IMD20
- CD16 deficiency
- FCGR3A deficiency
- autosomal recessive primary immunodeficiency with defective spontaneous NK cell
  cytotoxicity
description: >-
  CD16 deficiency (immunodeficiency 20, IMD20) is an autosomal recessive inborn
  error of immunity caused by a homozygous FCGR3A missense variant, c.230T>A,
  which substitutes histidine for leucine at residue 66 (L66H) in the first
  extracellular immunoglobulin domain of CD16 (Fc-gamma receptor IIIA). Affected
  individuals present with unusually severe and persistent herpesvirus and human
  papillomavirus disease against an otherwise unremarkable immunological
  workup.

  The reason this entity is worth curating separately from the broader natural
  killer cell deficiencies is that it is a dissociated functional defect rather
  than an absence of cells or of a receptor. CD16 is expressed on the NK cell
  surface and still binds IgG Fc, so antibody-dependent cellular cytotoxicity is
  intact. What the substitution destroys is a conformational epitope on the
  membrane-distal face of the receptor - the same surface recognised by the
  monoclonal antibody B73.1 - and with it CD16's ability to associate with CD2.
  Spontaneous (antibody-independent) killing, which depends on that CD16-CD2
  partnership at the lytic immunological synapse, fails while ADCC continues.

  This makes CD16 a costimulatory partner in natural cytotoxicity rather than
  only an Fc receptor, and it means the two NK effector functions must be
  modelled as separate nodes: collapsing them into a single "NK dysfunction"
  step would erase the finding the disease exists to demonstrate. Very few
  patients have been reported, and the described cases carry the same L66H
  allele, so the genotype-phenotype picture rests on a small number of
  individuals.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Both reported kindreds carry the FCGR3A c.230T>A substitution in the
    homozygous state. Heterozygous relatives have not been described as
    affected. The common FCGR3A V158F polymorphism that modulates ADCC in the
    general population is a separate allele with a different functional
    consequence and should not be conflated with the disease-causing L66H
    substitution.
  evidence:
  - reference: PMID:8608639
    reference_title: "Natural Killer (NK) cell deficiency associated with an epitope-deficient
      Fc receptor type IIIA (CD16-II)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "homozygous for a T to A substitution at position 230 of CD16-II cDNA,
      predicting a Leu(66) to His(66) change in the first immunoglobulin domain"
    explanation: Establishes the homozygous state of the causal FCGR3A allele in the
      index patient.
genetic:
- name: FCGR3A
  gene_term:
    preferred_term: FCGR3A
    term:
      id: hgnc:3619
      label: FCGR3A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    FCGR3A encodes CD16a (Fc-gamma receptor IIIA), the low-affinity IgG Fc
    receptor expressed on CD56-dim natural killer cells, where it is the
    triggering receptor for antibody-dependent cellular cytotoxicity. The
    disease allele is a single germline missense substitution in the
    membrane-distal immunoglobulin domain, carried homozygously. Because the
    receptor is still expressed and still binds Fc, this is a function-specific
    partial loss rather than a null: the gene-disease relationship is defined by
    which arm of CD16 function is lost, not by how much CD16 protein remains.
  variants:
  - name: "FCGR3A c.230T>A (p.Leu66His)"
    description: >-
      The single reported disease-causing allele, found in the homozygous state
      in both described patients. It disrupts the B73.1 monoclonal antibody
      epitope while leaving the 3G8 epitope and Fc binding intact.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:8608639
      reference_title: "Natural Killer (NK) cell deficiency associated with an epitope-deficient
        Fc receptor type IIIA (CD16-II)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "homozygous for a T to A substitution at position 230 of CD16-II cDNA,
        predicting a Leu(66) to His(66) change in the first immunoglobulin domain"
      explanation: Defines the variant at nucleotide and amino-acid level in the index
        patient.
  evidence:
  - reference: PMID:23006327
    reference_title: "Human immunodeficiency-causing mutation defines CD16 in spontaneous
      NK cell cytotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous missense mutation in CD16 (encoding a L66H substitution)
      is associated with severe herpesvirus infections in rare patients."
    explanation: Attributes the clinical immunodeficiency to the homozygous FCGR3A
      L66H missense allele.
pathophysiology:
- name: FCGR3A L66H Substitution
  biological_scale: MOLECULAR
  description: >-
    A homozygous T-to-A transversion at position 230 of the FCGR3A coding
    sequence replaces leucine 66 with histidine in the first (membrane-distal)
    immunoglobulin-like domain of CD16. The receptor is still made and still
    reaches the NK cell surface; the lesion is confined to the local
    conformation of one surface loop.
  genetic_context:
    genes:
    - preferred_term: FCGR3A
      term:
        id: hgnc:3619
        label: FCGR3A
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      c.230T>A, p.Leu66His. Structural modelling of the mutant against the
      solved wild-type CD16 ectodomain predicts a shift in the B73.1 epitope
      loop with the overall fold otherwise preserved, consistent with selective
      loss of one function (spontaneous cytotoxicity) while Fc binding and ADCC
      are retained. It is therefore recorded as a partial, function-specific
      loss rather than a null allele.
  cell_types:
  - preferred_term: CD16-positive, CD56-dim natural killer cell
    term:
      id: CL:0000939
      label: "CD16-positive, CD56-dim natural killer cell, human"
  evidence:
  - reference: PMID:8608639
    reference_title: "Natural Killer (NK) cell deficiency associated with an epitope-deficient
      Fc receptor type IIIA (CD16-II)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "homozygous for a T to A substitution at position 230 of CD16-II cDNA,
      predicting a Leu(66) to His(66) change in the first immunoglobulin domain"
    explanation: Defines the causal variant at nucleotide and amino-acid level and
      localises it to the membrane-distal immunoglobulin domain.
  downstream:
  - target: Loss of the CD16 B73.1 Conformational Epitope
    causal_link_type: DIRECT
    description: >-
      The substitution sits within the B73.1 recognition site, so the epitope is
      lost as a direct structural consequence of the amino-acid change.

- name: Loss of the CD16 B73.1 Conformational Epitope
  biological_scale: MOLECULAR
  description: >-
    Patient NK cells are stained normally by the anti-CD16 antibody 3G8, which
    binds elsewhere on the receptor, but are not recognised by B73.1. CD16 is
    therefore present on the surface with a locally altered membrane-distal
    face. This is the structural pivot of the disease: it is what separates the
    arm of CD16 function that fails from the arm that does not.
  cell_types:
  - preferred_term: CD16-positive, CD56-dim natural killer cell
    term:
      id: CL:0000939
      label: "CD16-positive, CD56-dim natural killer cell, human"
  evidence:
  - reference: PMID:8608639
    reference_title: "Natural Killer (NK) cell deficiency associated with an epitope-deficient
      Fc receptor type IIIA (CD16-II)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which was not reactive with the anti-CD16-II MoAb B73.1"
    explanation: Documents loss of the B73.1 epitope on patient NK cells while the
      receptor itself remains detectable.
  downstream:
  - target: Failure of CD16-CD2 Association
    causal_link_type: DIRECT
    description: >-
      The altered face is the surface through which CD16 partners with CD2, so
      losing it abolishes the association.
  - target: Preserved IgG Fc Binding and ADCC
    causal_link_type: DIRECT
    description: >-
      The Fc-binding surface is not part of the altered loop, so this arm of
      CD16 function is left intact. Modelled as an explicit preserved-function
      edge because the preservation is a positive finding, not an absence of
      data.

- name: Failure of CD16-CD2 Association
  biological_scale: MOLECULAR
  description: >-
    In healthy NK cells CD16 associates biochemically with CD2, a coactivation
    receptor, and the two co-cluster at the lytic immunological synapse, so that
    engaging CD2 elicits CD16 signalling. The L66H receptor does not enter this
    association, and CD2 ligation no longer triggers CD16 signalling. Note that
    the synapse still forms; what fails is the CD16-CD2 partnership within it.
  cell_types:
  - preferred_term: CD16-positive, CD56-dim natural killer cell
    term:
      id: CL:0000939
      label: "CD16-positive, CD56-dim natural killer cell, human"
  molecular_functions:
  - preferred_term: cell adhesion molecule binding
    term:
      id: GO:0050839
      label: cell adhesion molecule binding
    modifier: DECREASED
  evidence:
  - reference: PMID:23006327
    reference_title: "Human immunodeficiency-causing mutation defines CD16 in spontaneous
      NK cell cytotoxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "An association between CD16 and CD2 was identified biochemically and
      at the immunological synapse, which elicited CD16 signaling after CD2 engagement."
    explanation: Establishes the wild-type CD16-CD2 partnership that the L66H substitution
      disrupts.
  - reference: PMID:23006327
    reference_title: "Human immunodeficiency-causing mutation defines CD16 in spontaneous
      NK cell cytotoxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Stable expression of CD16 L66H in NK-92 cells recapitulated the patient
      phenotype, abrogating association of CD16 with CD2 as well as CD16 signaling
      after CD2 ligation."
    explanation: Shows that introducing the patient allele alone is sufficient to
      abolish the association, which is what makes this step causal rather than correlative.
  downstream:
  - target: Reduced CD2 Surface Expression on CD56-dim NK Cells
    causal_link_type: DIRECT
  - target: Deficient Spontaneous NK Cell Cytotoxicity
    causal_link_type: DIRECT
    description: >-
      Loss of CD16-dependent costimulation through CD2 is the proximate cause of
      the natural-cytotoxicity defect.

- name: Reduced CD2 Surface Expression on CD56-dim NK Cells
  biological_scale: CELLULAR
  description: >-
    Patient NK cells carry less surface CD2 than controls, and the reduction is
    restricted to the CD56-dim, CD16-positive subset - CD2 levels on the
    CD16-negative CD56-bright subset are unaffected. The compartment-restricted
    pattern is the argument that the CD2 loss is downstream of mutant CD16
    rather than an independent trait, since it appears only where the mutant
    receptor is expressed.
  cell_types:
  - preferred_term: CD16-positive, CD56-dim natural killer cell
    term:
      id: CL:0000939
      label: "CD16-positive, CD56-dim natural killer cell, human"
  - preferred_term: CD16-negative, CD56-bright natural killer cell
    term:
      id: CL:0000938
      label: "CD16-negative, CD56-bright natural killer cell, human"
  evidence:
  - reference: PMID:23006327
    reference_title: "Human immunodeficiency-causing mutation defines CD16 in spontaneous
      NK cell cytotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with the L66H mutation had intact ADCC, but deficient spontaneous
      NK cell cytotoxicity and decreased surface expression of CD2, a coactivation
      receptor."
    explanation: Documents the reduced CD2 surface expression in both reported patients
      alongside the dissociated cytotoxicity phenotype.

- name: Preserved IgG Fc Binding and ADCC
  biological_scale: CELLULAR
  description: >-
    Antibody-dependent cellular cytotoxicity is intact in patient cells,
    measured against antibody-coated targets. This node records a function that
    is retained, which is unusual for a pathophysiology graph but necessary
    here: the selectivity of the defect is the mechanistic claim, and a graph
    that showed only the failing arm would misrepresent the disease as a
    general NK deficiency.
  cell_types:
  - preferred_term: CD16-positive, CD56-dim natural killer cell
    term:
      id: CL:0000939
      label: "CD16-positive, CD56-dim natural killer cell, human"
  biological_processes:
  - preferred_term: antibody-dependent cellular cytotoxicity
    term:
      id: GO:0001788

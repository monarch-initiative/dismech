experimental_models:
- name: NK-92 cells stably expressing CD16 L66H
  experimental_model_type: CELL_LINE
  description: >-
    The immortalised human NK cell line NK-92, which lacks endogenous CD16, was
    reconstituted with either wild-type CD16 or the patient L66H allele. This is
    the experiment that converts the patient observation into a mechanism: it
    isolates the single substitution from the rest of the patients' genetic
    background.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  publication: PMID:23006327
  modeled_mechanisms:
  - target: Failure of CD16-CD2 Association
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Expressing the patient allele in a CD16-null human NK line reproduced the
      loss of CD16-CD2 association and the loss of CD16 signalling after CD2
      ligation.
    limitations: >-
      NK-92 is a transformed, IL-2-dependent NK lymphoma line rather than a
      primary NK cell, and the reconstituted receptor is expressed from a
      transgene rather than at endogenous locus and copy number. It also cannot
      report on NK development, so it speaks to receptor function and not to the
      NK cytopenia seen in the index patient.
    readouts:
    - name: CD16-CD2 biochemical association
      target: Failure of CD16-CD2 Association
      direction: ABOLISHED
      interpretation: >-
        The association present with wild-type CD16 is not formed by the L66H
        receptor, placing the substitution upstream of the partnership.
      evidence:
      - reference: PMID:23006327
        reference_title: "Human immunodeficiency-causing mutation defines CD16 in spontaneous
          NK cell cytotoxicity."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Stable expression of CD16 L66H in NK-92 cells recapitulated the
          patient phenotype, abrogating association of CD16 with CD2 as well as CD16
          signaling after CD2 ligation."
        explanation: Reports the abolished association and abolished CD2-triggered
          CD16 signalling in the reconstituted line.
    evidence:
    - reference: PMID:23006327
      reference_title: "Human immunodeficiency-causing mutation defines CD16 in spontaneous
        NK cell cytotoxicity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Stable expression of CD16 L66H in NK-92 cells recapitulated the patient
        phenotype, abrogating association of CD16 with CD2 as well as CD16 signaling
        after CD2 ligation."
      explanation: Supports treating this reconstituted line as informative for the
        CD16-CD2 association node.
  - target: Deficient Spontaneous NK Cell Cytotoxicity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Wild-type CD16 expression raised CD2 surface levels and conferred killing
      of a melanoma target that CD16-deficient NK-92 cells do not lyse,
      establishing a CD16 contribution to antibody-independent killing. The
      complementary loss with the L66H allele is shown for the association and
      signalling steps rather than as a matched cytotoxicity measurement against
      the same target, so the link to the cytotoxicity node is one step less
      direct than for the association node.
    limitations: >-
      The gain-of-function direction (adding CD16 to a CD16-null line) is the
      arm demonstrated against the melanoma target; NK-92 also differs from
      primary NK cells in receptor repertoire, so the size of the CD16
      contribution to natural cytotoxicity in vivo is not established by this
      model.
    readouts:
    - name: Killing of a CD16-dependent melanoma target
      target: Deficient Spontaneous NK Cell Cytotoxicity
      direction: INCREASED
      interpretation: >-
        Restoring wild-type CD16 restores antibody-independent lysis of a target
        that CD16-negative NK-92 cells resist, which is the positive control for
        the mechanism failing in patients.
      evidence:
      - reference: PMID:23006327
        reference_title: "Human immunodeficiency-causing mutation defines CD16 in spontaneous
          NK cell cytotoxicity."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Mechanistic studies in a human NK cell line, NK-92, demonstrated
          that CD16 expression correlated with CD2 surface levels and enabled killing
          of a melanoma cell line typically resistant to CD16-deficient NK-92 cells."
        explanation: Reports the CD16-dependent killing of the melanoma target and
          the correlation with CD2 surface levels.
    evidence:
    - reference: PMID:23006327
      reference_title: "Human immunodeficiency-causing mutation defines CD16 in spontaneous
        NK cell cytotoxicity."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Mechanistic studies in a human NK cell line, NK-92, demonstrated that
        CD16 expression correlated with CD2 surface levels and enabled killing of a
        melanoma cell line typically resistant to CD16-deficient NK-92 cells."
      explanation: Supports a CD16 role in antibody-independent killing, but via the
        reconstitution arm rather than a matched L66H cytotoxicity comparison, which
        is why the relationship is recorded as partial recapitulation.
diagnosis:
- name: Flow cytometry with paired anti-CD16 clones
  description: >-
    The diagnostic signature is a discordance between two anti-CD16 antibodies
    on the same cells: NK cells stain normally with clone 3G8 but are not
    recognised by clone B73.1. A panel using only one anti-CD16 clone will
    report CD16 as normally expressed and miss the disease entirely, which is
    the practical reason this entity is under-recognised.
  evidence:
  - reference: PMID:8608639
    reference_title: "Natural Killer (NK) cell deficiency associated with an epitope-deficient
      Fc receptor type IIIA (CD16-II)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which was not reactive with the anti-CD16-II MoAb B73.1"
    explanation: Establishes the selective loss of B73.1 reactivity that the paired-clone
      approach detects.
- name: Paired spontaneous cytotoxicity and ADCC assays
  description: >-
    Measuring natural cytotoxicity against a susceptible target and ADCC against
    an antibody-coated target in the same sample demonstrates the dissociation
    that defines the disease. Either assay alone is uninformative: a normal ADCC
    result does not exclude the diagnosis, and a low natural-cytotoxicity result
    alone does not distinguish it from other NK functional defects.
  evidence:
  - reference: PMID:23006327
    reference_title: "Human immunodeficiency-causing mutation defines CD16 in spontaneous
      NK cell cytotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with the L66H mutation had intact ADCC, but deficient spontaneous
      NK cell cytotoxicity and decreased surface expression of CD2, a coactivation
      receptor."
    explanation: Reports the paired assay result in both patients that the diagnostic
      approach depends on.
- name: FCGR3A sequencing
  description: >-
    Confirmation rests on demonstrating the homozygous c.230T>A (p.Leu66His)
    substitution. Interpretation must keep this allele distinct from the common
    FCGR3A V158F functional polymorphism and from FCGR3B copy-number variation,
    neither of which causes this syndrome.
  evidence:
  - reference: PMID:8608639
    reference_title: "Natural Killer (NK) cell deficiency associated with an epitope-deficient
      Fc receptor type IIIA (CD16-II)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "homozygous for a T to A substitution at position 230 of CD16-II cDNA,
      predicting a Leu(66) to His(66) change in the first immunoglobulin domain"
    explanation: Identifies the confirmatory sequencing finding.
discussions:
- discussion_id: nk_cytopenia_inconsistent
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is reduced circulating NK cell number a feature of CD16 deficiency, or an
    incidental finding in the index patient?
  attaches_to:
  - phenotypes#Reduced total natural killer cell count
  rationale: >-
    The two reported patients disagree on this point. The index patient was
    described as having a decreased number of circulating CD56+CD3- NK cells,
    and the original report framed the condition as a defect affecting NK cell
    development as well as function. The second patient's NK percentage was
    within normal age-specific ranges, and the mechanism established
    subsequently - loss of a CD16-CD2 costimulatory partnership - is a
    functional lesion that gives no obvious account of a developmental one.
    With two patients, the question cannot be settled by counting. It matters
    because a clinician using NK lymphopenia as a screening criterion would not
    have identified the second patient.
- discussion_id: cytotoxicity_to_viral_susceptibility_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the CD16-CD2 partnership account for the full severity of the viral
    susceptibility, or is spontaneous cytotoxicity only one contributor?
  attaches_to:
  - pathophysiology#Impaired Control of Herpesvirus and Papillomavirus Infection
  rationale: >-
    The step from a measurable in vitro cytotoxicity deficit to severe,
    persistent EBV and HPV disease in vivo is asserted on plausibility and on
    the known role of NK cells in herpesvirus control, not demonstrated. No
    reported patient has had NK-specific reconstitution, and there is no animal
    model of the L66H allele, so the quantitative contribution of this pathway
    to viral control in humans is unmeasured. The reported patients are also few
    enough that unrecognised modifying variants cannot be excluded.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Two unrelated patients homozygous for FCGR3A L66H had been reported in the
    literature at the time of the 2012 mechanistic study, which described a
    newly identified patient and re-examined the originally reported one. No
    population frequency estimate for the disease-causing allele in the
    homozygous state has been published.
  evidence:
  - reference: PMID:23006327
    reference_title: "Human immunodeficiency-causing mutation defines CD16 in spontaneous
      NK cell cytotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous missense mutation in CD16 (encoding a L66H substitution)
      is associated with severe herpesvirus infections in rare patients."
    explanation: Characterises the genotype as occurring in rare patients; the study
      itself reports the second such individual.
notes: >-
  Scope. This entry covers the monogenic syndrome caused by the homozygous
  FCGR3A L66H substitution. It deliberately does not cover the common FCGR3A
  V158F (rs396991) polymorphism, which modulates IgG affinity and ADCC efficacy
  and is studied as a pharmacogenomic modifier of therapeutic antibody response;
  that is a different allele making a different claim, and FCGR3A appears
  elsewhere in this knowledge base only in that polymorphic sense.

  Treatments. No treatment section is curated because no disease-directed
  therapy has been reported for this entity. Management in the published cases
  was directed at the individual infections. Rather than record a generic
  supportive-care entry with no citable evidence behind it, the section is left
  absent.

  Evidence base. Every mechanistic claim here rests on two papers describing two
  patients between them, with the cellular mechanism established in a
  reconstituted cell line rather than in primary patient cells. That is thin,
  and the entry is written to make the thinness visible rather than to smooth it
  over - hence the explicit preserved-function node, the partial-recapitulation
  grading on the cytotoxicity model link, and the two discussion entries.

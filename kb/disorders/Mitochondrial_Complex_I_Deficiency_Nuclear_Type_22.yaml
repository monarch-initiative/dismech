- name: Impaired Complex I Assembly and Stability
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Complex I assembly is disturbed in the patient's own fibroblasts. This is
    the step that distinguishes an accessory-subunit disease from a
    core-subunit one: a defective core subunit would be expected to leave a
    normal or near-normal amount of assembled enzyme with reduced turnover,
    whereas losing the scaffolding subunit costs the enzyme itself.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  evidence:
  - reference: PMID:21150889
    reference_title: NDUFA10 mutations cause complex I deficiency in a patient with Leigh disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      The fibroblasts of the patient displayed decreased amount and activity,
      and a disturbed assembly of complex I.
    explanation: >-
      The assembly defect measured directly in patient-derived cells.
  downstream:
  - target: Reduced Complex I Amount and Activity
    causal_link_type: DIRECT
- name: Loss of the NDUFA10 dGTP Reservoir
  biological_scale: MOLECULAR
  role: modulator
  mechanism_confidence: HYPOTHETICAL
  description: >-
    A second property of NDUFA10 that has no counterpart in most complex I
    accessory subunits, and whose relevance to this disease is unknown. NDUFA10
    retains a deoxyribonucleoside-kinase fold, and the large majority of the
    dGTP inside mitochondria is bound to it - tightly enough to survive
    mitochondrial isolation and methanol treatment. Engineering the dNK domain
    in HEK-293T cells, while deliberately preserving complex I assembly and
    activity, halves mitochondrial dGTP content. The authors propose the
    interaction as a link between oxidative metabolism and mitochondrial DNA
    maintenance.

    Marked HYPOTHETICAL, and it is worth being precise about what is
    hypothetical. That NDUFA10 holds most mitochondrial dGTP is measured, not
    conjectured. What is conjectural is that this matters in MC1DN22: no patient
    allele has been tested for dGTP binding, no mitochondrial DNA depletion or
    deletion phenotype has been reported in an NDUFA10 patient, and the
    experiment that isolates the dGTP function used a mutant chosen precisely
    because it does *not* destabilise the complex - the opposite of what the
    disease alleles do. The node is curated because it is a testable prediction
    unique to this gene, not because there is evidence for it.
  evidence:
  - reference: PMID:35739187
    reference_title: Most mitochondrial dGTP is tightly bound to respiratory complex I through the NDUFA10 subunit.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      a vast majority of mitochondrial dGTP is tightly bound to NDUFA10, an
      accessory subunit of complex I of the mitochondrial respiratory chain
    explanation: >-
      The measurement that makes NDUFA10 the mitochondrial dGTP reservoir.
  - reference: PMID:35739187
    reference_title: Most mitochondrial dGTP is tightly bound to respiratory complex I through the NDUFA10 subunit.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      This interaction may represent a hitherto unknown mechanism regulating
      mitochondrial dNTP availability and linking oxidative metabolism to DNA
      maintenance.
    explanation: >-
      The authors' own framing of the consequence. Indirect, and hedged in the
      source itself - "may represent" - which is why this node is hypothetical.
- name: Loss of Serine-250 Control of Ubiquinone Reduction
  biological_scale: MOLECULAR
  role: modulator
  mechanism_confidence: HYPOTHETICAL
  description: >-
    A regulatory function of NDUFA10 discovered from the other end - not by
    studying NDUFA10 disease, but by asking why PINK1 loss reduces complex I
    activity. Phosphoproteomics of complex I in Pink1-null mouse liver and brain
    found a specific loss of phosphorylation at NdufA10 serine-250, and that
    phosphorylation turned out to be required for ubiquinone reduction by the
    complex.

    The claim is contested, and the contradiction is curated below rather than
    smoothed over. An independent Drosophila study reached the opposite
    conclusion about the site itself: overexpressing ND42, the fly NDUFA10
    homologue, did restore complex I activity and partially rescue locomotion in
    pink1 mutants, but that rescue showed no specific requirement for
    phosphorylation at Ser-250. So the two studies agree that NDUFA10 abundance
    governs complex I activity downstream of PINK1, and disagree about whether
    the serine-250 phospho-switch is the mechanism.

    Whether any of this bears on MC1DN22 is a separate and unexamined question.
    No phosphorylation measurement has been made in an NDUFA10 patient's cells,
    and none of the alleles quotable here is described as affecting serine-250.
    The node is curated as a hypothesis about a second, potentially separable arm
    of the lesion, and its edge to the measured endpoint is typed as having
    unknown intermediates for that reason.
  evidence:
  - reference: PMID:24652937
    reference_title: PINK1 loss-of-function mutations affect mitochondrial complex I activity via NdufA10 ubiquinone uncoupling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      we found specific loss of phosphorylation of serine-250 in complex I
      subunit NdufA10
    explanation: >-
      Identifies the regulated site. Indirect for this disease: the lesion under
      study is Pink1 loss in mouse, not an NDUFA10 variant in a patient.
  - reference: PMID:24652937
    reference_title: PINK1 loss-of-function mutations affect mitochondrial complex I activity via NdufA10 ubiquinone uncoupling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Phosphorylation of serine-250 was needed for ubiquinone reduction by
      complex I.
    explanation: >-
      Establishes that the site gates quinone reduction, which is what would
      make its loss a functional rather than a structural deficit.
  - reference: PMID:25412178
    reference_title: The complex I subunit NDUFA10 selectively rescues Drosophila pink1 mutants through a mechanism independent of mitophagy.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Here, the restoration of CI activity and partial rescue of locomotion does
      not appear to have a specific requirement for phosphorylation of ND42 at
      Ser-250.
    explanation: >-
      Directly contradicts the serine-250 requirement in an independent fly
      system. It refutes the phospho-switch as the mechanism, not the broader
      finding that NDUFA10 abundance sets complex I activity - which the same
      study supports.
  - reference: PMID:25412178
    reference_title: The complex I subunit NDUFA10 selectively rescues Drosophila pink1 mutants through a mechanism independent of mitophagy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      In Drosophila pink1 mutants, transgenic overexpression of ND42 or its
      co-chaperone sicily was sufficient to restore CI activity and partially
      rescue several phenotypes including flight and climbing deficits and
      mitochondrial disruption in flight muscles.
    explanation: >-
      Supports the part both studies agree on: the amount of functional NDUFA10
      is what sets complex I activity here. Split from the item above because
      one sentence supports the abundance claim while the other refutes the
      phospho-site claim.
  downstream:
  - target: Reduced Complex I Amount and Activity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Reduced Complex I Amount and Activity
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    The measured endpoint, and the best-evidenced claim in this entry. Both the

  description: >-
    Every reported patient carries two NDUFA10 alleles - compound heterozygous
    in the index case, homozygous in the 2017 case and in the 2026 optic-atrophy
    families. NDUFA10 is nuclear-encoded and autosomal, so this is a nuclear
    recessive mitochondrial disease, carrying a 25 percent sibling recurrence
    risk and no maternal transmission - the counselling distinction from the
    mitochondrial-genome forms of complex I deficiency.
  evidence:
  - reference: PMID:21150889
    reference_title: NDUFA10 mutations cause complex I deficiency in a patient with Leigh disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We identified compound-heterozygous mutations in the NDUFA10 gene,
      encoding an accessory subunit of complex I.
    explanation: >-
      Two variant alleles in the index patient, which is the biallelic
      configuration this block records.
  - reference: PMID:28247337
    reference_title: "Widening the Heterogeneity of Leigh Syndrome: Clinical, Biochemical, and Neuroradiologic Features in a Patient Harboring a NDUFA10 Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Here, we present an additional description of a child with Leigh syndrome
      harboring a homozygous mutation in NDUFA10, providing insights in clinical,
      biochemical, and neuroradiologic features for future earlier recognition.
    explanation: >-
      Homozygosity in the second reported patient.
  - reference: PMID:41234160
    reference_title: Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Ten patients from eight families (Families H–O) carried hemizygous variants
      in NDUFA1 or NDUFB11 or biallelic variants in NDUFA10 or NDUFA12, encoding
      accessory subunits of CI.
    explanation: >-
      Biallelic NDUFA10 genotypes in the second, phenotypically distinct cohort.
      Note the sentence spans four genes; the hemizygous half of it belongs to
      the X-linked NDUFA1 and NDUFB11 families, not to NDUFA10.
pathophysiology:
- name: Biallelic NDUFA10 Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion. Reported alleles span the mutational spectrum a
    loss-of-function gene would be expected to show: a start-codon-destroying
    variant paired with a missense in the index patient, a homozygous missense
    in the second, and a homozygous in-frame single-residue deletion p.(A78del)
    plus a homozygous missense p.(R337C) in the optic-atrophy families.

    Structural modelling in the 2026 series places two of these residues in the
    subunit's protein-protein interfaces rather than in any catalytic site,
    which is what an accessory-subunit lesion should look like: the variant
    degrades the subunit's ability to hold on to its neighbours, not its ability
    to turn over substrate.

genetic:
- name: NDUFA10
  gene_term:
    preferred_term: NDUFA10
    term:
      id: hgnc:7684
      label: NDUFA10
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    NDUFA10 encodes the NADH:ubiquinone oxidoreductase subunit A10, an accessory
    subunit of the complex I membrane arm. Reading the literature on this gene
    needs one caution: most NDUFA10 papers are not about this disease. The gene
    appears constantly as a member of expression signatures in cancer
    transcriptomics, in Parkinson-disease models through its PINK1 connection,
    and in cardiac ischaemia-reperfusion work. The disease literature is four
    reports.

    A second caution concerns the alleles themselves. Both a start-codon variant
    and single-residue missense and in-frame-deletion changes have been
    reported, and there is no evident hotspot - the residues modelled in the 2026
    series sit at interfaces with NDUFC1, NDUFC2 and ND2 rather than in a single
    domain. Three specific alleles are quotable and are cited on the evidence
    items here: the compound-heterozygous pair in the index case, described only
    as a start-codon disruption plus a substitution; the homozygous in-frame
    deletion c.233_235del p.(A78del) in two optic-atrophy families; and the
    homozygous c.1009C>T p.(R337C) in a third, which had already been reported
    in a patient with a much broader phenotype.

    Uncited leads, from the deep-research report committed with this entry,
    which had full-text access to the two paywalled case reports. The index
    patient's alleles are given there as c.1A>G (start-loss, p.Met1?) inherited
    from the father and c.425A>G (p.Gln142Arg) from the mother, both absent from
    108 controls and from 21 further patients with isolated complex I
    deficiency. The 2017 patient is given as homozygous c.296G>A (p.Gly99Glu),
    with heterozygous third-degree-cousin parents. Neither is curated as
    evidence: the cached record for both papers is abstract-only, and neither
    abstract names an allele.

    One discrepancy for the next curator to resolve rather than inherit. The
    2026 series states that p.(A78del) had previously been reported *in trans*
    with p.(G99E) in a case of Leigh syndrome, while the deep-research report
    gives the 2017 patient as a p.(G99E) homozygote. Those cannot both describe
    the same patient. Either a third G99E case exists, or one of the two
    descriptions is wrong; nothing quotable here settles it, and no phase claim
    is made in this entry as a result.
  evidence:
  - reference: PMID:21150889
    reference_title: NDUFA10 mutations cause complex I deficiency in a patient with Leigh disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      We identified compound-heterozygous mutations in the NDUFA10 gene,
      encoding an accessory subunit of complex I.
    explanation: >-
      The gene-disease assignment that defines the entity.
  - reference: PMID:41234160
    reference_title: Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The proband from Families K and L carried the homozygous in-frame deletion
      c.233_235del p.(A78del).
    explanation: >-
      A recurrent NDUFA10 allele across two families in the optic-atrophy cohort.
biochemical:
- name: Complex I Enzyme Activity, Assembled Amount and Assembly Pattern
  notes: >-
    Three measurements, and the informative point is that they move together.
    Reduced activity alone is the entry criterion for complex I deficiency; what
    an NDUFA10 defect adds is a fall in the assembled amount and a disturbed
    assembly pattern, which is the signature of a stability lesion and is
    consistent with NDUFA10 being an accessory rather than a core subunit. A
    laboratory that measures activity alone will not see that distinction.

    Note what appears not to be available for this entity. Neither the accessible
    literature nor the deep-research report committed with this entry - which
    read both paywalled case reports in full - records a functional
    complementation of an NDUFA10 patient's fibroblasts with wild-type cDNA. On
    that reading the causal assignment rests on parental segregation, on the
    null nature of the start-codon allele, on absence from controls, and on the
    biochemistry, rather than on a rescue experiment. That is a weaker footing
    than several sibling entities in this series have, and it is the reason this
    entry carries no `experimental_models` block. It is stated as what two
    searches found, not as a proven absence.

    Quantities, as uncited leads from that report: complex I activity in the
    index patient was about 29 percent of the lower reference limit in
    fibroblasts and about 7 percent of it in muscle, with mildly reduced complex
    III in muscle and complex IV within range - the profile of an isolated
    complex I defect with a minor secondary effect, which is worth knowing when
    interpreting a similar assay. Blood lactate was 8.6 mmol/L and CSF lactate
    4.9 mmol/L at ten months. None of this is in either abstract.
  evidence:
  - reference: PMID:21150889
    reference_title: NDUFA10 mutations cause complex I deficiency in a patient with Leigh disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      The fibroblasts of the patient displayed decreased amount and activity,
      and a disturbed assembly of complex I.
    explanation: >-
      The three measurements this block names, all in patient-derived cells.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than ten patients have been published in fifteen years: one in 2011,
    one in 2017, one in a 2022 letter with no accessible text, an unstated number
    within a 219-patient Russian Leigh cohort in 2023, and four patients from
    three families in the 2026 optic-atrophy series. No population estimate
    exists and none should be inferred from these numbers - each ascertainment
    starts from a different clinical entry point.

    For the denominator rather than for this entity: complex I deficiency is the
    most frequent childhood mitochondrial disorder, accounting for up to 30
    percent of cases, and its causes are spread across seven mitochondrial and
    38 nuclear subunits plus a growing list of assembly factors. NDUFA10 is one
    gene in that set, and the 2026 series is explicit that nuclear complex I
    genes are under-represented in the molecular diagnosis of optic neuropathy -
    so the published count is a floor, not an estimate.
  evidence:
  - reference: PMID:22972949
    reference_title: "Complex I deficiency: clinical features, biochemistry and molecular genetics."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      Complex I deficiency is the most frequent mitochondrial disorder
      presenting in childhood, accounting for up to 30% of cases.
    explanation: >-
      Frequency of the disease class, which is the denominator - not of this
      entity.
  - reference: PMID:41234160
    reference_title: Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Overall, we highlight the possibly underestimated prevalence of CI nuclear
      subunits in the molecular diagnosis of ION, prompting the inclusion of all
      CI-related genes in the standard diagnostic screening.
    explanation: >-
      The authors' own argument that this class of diagnosis is under-counted,
      which is why the published case count should be read as a floor.
diagnosis:
- name: Complex I Enzyme Assay with Assembly Analysis, Followed by Sequencing
  description: >-
    The route that found every reported case. Biochemical demonstration of an
    isolated complex I deficiency comes first, in fibroblasts and where possible
    in muscle; measuring assembled complex amount alongside activity is what
    points at an accessory-subunit or assembly defect rather than a core-subunit
    one. Molecular confirmation then follows by sequencing, and the practical
    lesson of the 2011 report is that NDUFA10 belongs on the list of genes to
    look at - it was not on it before.
  evidence:
  - reference: PMID:21150889
    reference_title: NDUFA10 mutations cause complex I deficiency in a patient with Leigh disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      These results indicate that NDUFA10 is a novel candidate gene to screen for
      disease-causing mutations in patients with complex I deficiency.
    explanation: >-
      The authors' own diagnostic recommendation on the strength of the index
      case.
- name: Nuclear Complex I Gene Screening in Unexplained Optic Atrophy
  description: >-
    A second, quite different diagnostic route, and the one that will find the
    mild pole. A patient with childhood-onset optic atrophy, no OPA1 variant and
    no mitochondrial-DNA LHON variant is a candidate for biallelic nuclear
    complex I gene variants including NDUFA10 - a group the 2026 series argues is
    routinely missed because these genes are not on inherited-optic-neuropathy
    panels.
  evidence:
  - reference: PMID:41234160
    reference_title: Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Overall, we highlight the possibly underestimated prevalence of CI nuclear
      subunits in the molecular diagnosis of ION, prompting the inclusion of all
      CI-related genes in the standard diagnostic screening.
    explanation: >-
      The recommendation to screen nuclear complex I genes in inherited optic
      neuropathy, which is the pathway to an NDUFA10 diagnosis at the mild pole.
differential_diagnoses:
- name: Other nuclear-encoded complex I subunit and assembly factor deficiencies
  description: >-
    MC1DN22 cannot be separated from its siblings clinically or biochemically -
    only by genotype. The class spans 38 nuclear-encoded subunits and a growing
    list of assembly factors, and this knowledge base already carries several
    members. One structural distinction may eventually matter at the bench: a
    core-subunit defect would be expected to reduce activity with the enzyme
    still assembled, whereas an accessory-subunit defect such as this one
    reduces the assembled amount too. That is visible on a combined
    amount-and-activity assay; it has no demonstrated clinical correlate.
  evidence:
  - reference: PMID:22972949
    reference_title: "Complex I deficiency: clinical features, biochemistry and molecular genetics."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Causative genetic defects may involve the seven mitochondrial-encoded or 38
      nuclear-encoded subunits of the enzyme, or any of an increasing number of
      assembly factors implicated in the correct biosynthesis of complex I within
      the inner mitochondrial membrane.
    explanation: >-
      Establishes the size of the differential.
- name: Mitochondrial-DNA-encoded complex I deficiency, including LHON
  description: >-
    About a quarter of complex I deficiency is caused by mitochondrial DNA
    mutations, with maternal inheritance, heteroplasmy and recurrence-risk
    implications entirely unlike a nuclear recessive disorder. This differential
    is unusually live for MC1DN22 because of the optic-atrophy pole: Leber
    hereditary optic neuropathy is caused by mitochondrial-DNA complex I
    variants and presents as subacute vision loss, and the 2026 series was
    written precisely to argue that some such patients instead carry biallelic
    nuclear complex I variants. Distinguishing them changes the counselling
    completely.
  evidence:
  - reference: PMID:22972949
    reference_title: "Complex I deficiency: clinical features, biochemistry and molecular genetics."
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Approximately 25% of cases have mitochondrial DNA mutations, while a
      further ∼25% have mutations in a nuclear subunit or in one of nine known
      assembly factors.
    explanation: >-
      Quantifies the mitochondrial-genome arm of the differential.
  - reference: PMID:41234160
    reference_title: Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In 12 cases, the subacute onset of vision loss enabled us to associate or
      confirm novel genes (NDUFS7, NDUFV1, NDUFAF2, NDUFAF4, NDUFAF8) with the
      autosomal recessive Leber hereditary optic neuropathy (arLHON) phenotype.
    explanation: >-
      Shows that a LHON-like subacute presentation can have a nuclear recessive
      cause. Note the five genes named are not NDUFA10; the point this supports
      is the existence of the recessive-LHON differential, not an NDUFA10
      arLHON claim.
- name: Mitochondrial complex IV deficiency, nuclear type 22
  description: >-
    A pure naming collision, recorded here because it has already caused
    confusion. The nuclear-type numbering restarts in each respiratory-chain
    complex series, so "nuclear type 22" exists in both the complex I and the
    complex IV nosology and names two unrelated diseases with different genes.
    This entry is complex I, gene NDUFA10. A search on the phrase alone, without
    the complex number, will conflate them.
  notes: >-
    No evidence item is attached because the claim is about nomenclature, not
    biology: there is nothing in a paper to quote. The check is done against the
    ontologies and against this repository - MONDO:0032626 is the complex I term
    bound at the top of this entry, and the complex IV counterpart is a separate
    MONDO term curated elsewhere in this knowledge base.
discussions:
- discussion_id: mc1dn22_intra_allelic_discordance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does NDUFA10 p.(R337C), in homozygous form, produce isolated optic
    atrophy in two siblings and multisystem disease with ataxia, hypotonia and
    developmental regression in another patient?
  attaches_to:
  - "pathophysiology#Optic Nerve Degeneration"
  - "pathophysiology#Brainstem and Basal Ganglia Neurodegeneration"
  rationale: >-
    This is the sharpest open question in the entity, and it is sharper than the
    usual mitochondrial-disease variability complaint because the genotype is
    held constant: the same amino-acid change, homozygous, on both sides of the
    comparison. Whatever separates the two poles of MC1DN22 is therefore not the
    allele.

    The 2026 authors offer the standard candidates - nuclear and mitochondrial
    modifiers, environmental exposure - and note that some of their patients
    carried mitochondrial-DNA variants of uncertain effect that might act
    synergistically or antagonistically with the nuclear lesion. None of this is
    demonstrated for NDUFA10.

    Closing the gap needs residual complex I amount and activity measured in
    both kinds of patient with the same assay, which has not been done: the
    biochemical work in this entity is fifteen years old and comes from the
    severe pole only.
  proposed_experiments:
  - experiment_id: exp_mc1dn22_residual_activity_across_poles
    name: Compare residual complex I assembly and activity across NDUFA10 phenotypic poles
    description: >-
      Measure assembled complex I amount, activity and assembly intermediates by
      blue-native electrophoresis and complexome profiling in fibroblasts from
      NDUFA10 patients at both poles, ideally including two p.(R337C) homozygotes
      with discordant phenotypes, to test whether residual enzyme predicts
      severity or whether the difference lies outside the complex.
- discussion_id: mc1dn22_ndufa10_moonlighting_functions
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the two non-structural functions of NDUFA10 - the dGTP-binding
    deoxyribonucleoside-kinase domain and the serine-250 phospho-switch on
    ubiquinone reduction - contribute anything to human NDUFA10 disease?
  attaches_to:
  - "pathophysiology#Loss of the NDUFA10 dGTP Reservoir"
  - "pathophysiology#Loss of Serine-250 Control of Ubiquinone Reduction"
  rationale: >-
    Curated as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the
    evidence is not missing. Both functions are well demonstrated - the dGTP
    reservoir in mouse tissue and human HEK-293T cells, the serine-250 switch in
    Pink1-null mouse liver and brain, in Drosophila and in cells from PINK1
    patients. What is untested is their relationship to a patient carrying an
    NDUFA10 variant.

    The mismatch has a specific shape in each case, and the shapes are
    different. For dGTP, the experiment that isolated the function used an
    engineered dNK-domain mutant chosen because it preserves complex I assembly
    and activity - the opposite of the disease alleles, which destabilise the
    complex. So the cleanest demonstration of the dGTP function is also the one
    least like the disease. For serine-250, the lesion studied was Pink1 loss,
    not an NDUFA10 variant; NDUFA10 appears there as the substrate through which
    a different disease acts.

    The practical consequence is a prediction nobody has checked: if the dGTP
    reservoir matters, NDUFA10 patients might show mitochondrial DNA copy-number
    or integrity abnormalities that other complex I subunit deficiencies do not.
    No such measurement has been reported.
  proposed_experiments:
  - experiment_id: exp_mc1dn22_mtdna_maintenance
    name: Test mitochondrial DNA maintenance in NDUFA10 patient cells
    description: >-
      Quantify mitochondrial DNA copy number, deletion load and the mitochondrial
      dNTP pool in fibroblasts from NDUFA10 patients against fibroblasts from
      patients with core-subunit complex I deficiencies matched for residual
      enzyme activity. A dGTP-pool or mtDNA-maintenance abnormality specific to
      the NDUFA10 group would convert this hypothesis into a mechanism.
  - experiment_id: exp_mc1dn22_serine250_in_patient_cells
    name: Measure NDUFA10 serine-250 phosphorylation in patient cells
    description: >-
      Determine whether patient NDUFA10 alleles alter phosphorylation at the
      residue corresponding to mouse serine-250, and whether a phosphomimetic
      allele rescues ubiquinone reduction in NDUFA10-deficient human cells as it
      does in the Pink1-null systems.
notes: >-
  What this entry deliberately does not contain, and why.

  No `treatments:` block. Nothing has been published on treating MC1DN22
  specifically, and the general supportive management of mitochondrial disease
  is not this entity's evidence. Importing a cocktail of vitamins and cofactors
  from the mitochondrial-disease literature would put treatments in the exported
  graph that no NDUFA10 patient has been reported to receive or respond to.

  No `progression:` block and no frequency bands on any phenotype. The reported
  patients number fewer than ten, were ascertained through three unrelated
  clinical routes - Leigh syndrome, a national Leigh cohort, and a targeted
  optic-atrophy screen - and no denominator exists in which a proportion would
  mean anything. A band computed over that mixture would look like disease
  knowledge and would only be reporting how the patients were found.

  No `experimental_models:` block. Unusually for this series, no complementation
  or knockdown experiment in NDUFA10 patient cells has been published. The
  causal assignment rests on biallelic segregation, a start-codon-abolishing
  allele, and the biochemical triad of reduced amount, reduced activity and
  disturbed assembly.

  PMID:36270260 is listed under `references:` and cited nowhere else. It is a
  2022 letter reporting a third patient - juvenile-onset dystonia with
  spasticity in Leigh syndrome, a novel NDUFA10 variant - and both its PubMed
  record and its DOI return no body text at all, so its cached record is a
  header with an empty content section. It is listed because a reader should
  know the case exists and where to find it; nothing from it is curated,
  because the only accessible statement about it is its title. Dystonia and
  spasticity are consequently absent from the phenotypes block. This is a gap
  that a curator with journal access could close in minutes.

  On the deep-research report. A falcon report was run for this entity with a
  disambiguating query naming the gene, the OMIM number and the complex, because
  the plain disease label "nuclear type 22" collides with the complex IV series.
  It returned the right disease - `just preflight-dr` PASSed, with NDUFA10
  mentioned 58 times and the report's OMIM number matching MONDO's - and it had
  full-text access to both paywalled case reports, so it carries per-patient
  clinical, allelic and biochemical detail that no cached abstract does. That
  detail is recorded in this entry as explicitly uncited leads, in the genetic
  and biochemical notes and here: the index patient was born at 32 weeks, had
  hypotonia in early infancy, never sat, had hypertrophic cardiomyopathy, and
  died of cardiorespiratory arrest at 23 months; the 2017 patient had nystagmus
  from one month, deteriorated acutely at two years eight months after a fever
  with later febrile relapses, and had a partial neurological improvement on
  empirical thiamine and biotin followed by continued decline. None of it is
  curated as a phenotype, a progression stage or a treatment, because a
  deep-research report is a lead and nothing in it is snippet-verifiable against
  the cached abstracts. It is recorded so that the next curator - who may have
  journal access - knows exactly which table to transcribe rather than
  concluding the information does not exist.

  Two things in this entry that the report did NOT supply, so that the division
  of labour is clear: the 2026 optic-atrophy series, which the report did not
  retrieve and which is the source of the mild pole and of every phenotype
  attributed to p.(R337C); and the contradiction over serine-250, which the
  report mentions but which is curated here as a paired REFUTE/SUPPORT split on
  the primary Drosophila paper.

  The fever trigger is a lead, not a curated mechanism. Intercurrent illness
  precipitating decompensation is a general feature of mitochondrial disease and
  is reported for the 2017 patient in the deep-research report, but no cached
  abstract states it, so there is no `environmental:` block. An
  environmental entry asserting a fever trigger with no citable evidence would
  be exactly the unverifiable claim the evidence policy exists to prevent.

  On GeneReviews. PMID:26425749 ("Nuclear Gene-Encoded Leigh Syndrome Spectrum
  Overview") is the applicable GeneReviews chapter and is tagged in the top-level
  `references:` block. It is deliberately NOT cited as evidence anywhere: the
  cached PubMed record contains only the chapter's statement of purpose and no
  clinical content, so any snippet from it would attest to the chapter's aims
  rather than to a fact about this disease. The phenotypes here are anchored on
  primary reports instead. This matches how the sibling entries in this series
  handle the same chapter.

  The naming collision is real and is curated as a differential diagnosis rather
  than left in prose. "Nuclear type 22" exists in both the complex I and complex
  IV nosologies. This entry is complex I / NDUFA10.

  Search discipline for the next curator: NDUFA10 returns a large literature that
  is almost entirely not about this disease - cancer expression signatures,
  Parkinson-disease models reached through PINK1, cardiac
  ischaemia-reperfusion. Adding "Leigh", "complex I deficiency" or "optic
  atrophy" to the query is what separates the four disease reports from the rest.

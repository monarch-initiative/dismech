    Curated as a clinical diagnosis rather than decomposed into HPO signs,
    because that is the granularity at which the sources report it. HPO has no
    term for Leigh syndrome - it is a disease concept, held in MONDO and OMIM -
    so `phenotype_term` carries a free-text `preferred_term` with no binding,
    rather than a substituted approximation such as an abnormal-basal-ganglia
    term, which would assert an imaging finding not reported per patient here.

    Two patients carry the diagnosis in the primary reports, and NDUFA10 also
    appears among the nuclear genes solved in a 219-patient Russian Leigh
    cohort - a third, unquantified ascertainment.

    A published third case exists and is not curated as evidence. PMID:36270260
    is a letter titled "Juvenile-onset dystonia with spasticity in Leigh
    syndrome caused by a novel NDUFA10 variant"; it has no abstract, and neither
    PubMed nor its DOI returns any body text, so its cached record is empty.
    Its title is the only accessible statement about it, and a title is not a
    finding. Dystonia and spasticity are therefore NOT curated as phenotypes of
    this entity, and the juvenile onset it reports is not curated either.

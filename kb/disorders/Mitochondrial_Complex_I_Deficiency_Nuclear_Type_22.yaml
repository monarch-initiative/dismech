    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: >-
      NDUFA10 shares a deoxyribonucleoside kinase (dNK) domain with
      deoxyribonucleoside kinases in the nucleotide salvage pathway, though no
      specific function beyond stabilizing the complex I holoenzyme has been
      described for this subunit.
    explanation: >-
      States the only established role of the subunit, which is what makes its
      loss a stability rather than a catalytic lesion.
  - reference: PMID:41234160

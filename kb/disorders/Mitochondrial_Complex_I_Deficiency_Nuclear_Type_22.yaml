- name: Loss of the NDUFA10 Accessory Subunit
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The functional consequence common to every reported allele: complex I is
    built without a working copy of NDUFA10. What follows depends on what the
    subunit is for, and here the literature is unusually blunt - beyond
    stabilising the complex I holoenzyme, no specific function has been
    described for it. That is the ordinary reading of the disease, and the two
    hypothetical nodes below are the two candidate exceptions to it.

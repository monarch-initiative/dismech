name: Mitochondrial Complex I Deficiency, Nuclear Type 22
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Mitochondrial complex I deficiency, nuclear type 22
  term:
    id: MONDO:0032626
    label: mitochondrial complex I deficiency, nuclear type 22
description: >-
  Mitochondrial complex I deficiency nuclear type 22 (MC1DN22, OMIM 618243) is
  the isolated complex I deficiency caused by biallelic variants in NDUFA10.
  NDUFA10 is an accessory - "supernumerary" - subunit of the complex I membrane
  arm rather than one of the fourteen catalytic core subunits, and the only
  function described for it is stabilising the assembled holoenzyme. A patient
  with two defective NDUFA10 alleles therefore loses assembled complex I rather
  than losing catalysis by an otherwise intact enzyme, which is what was
  measured in the index case: decreased amount, decreased activity, and a
  disturbed assembly of the complex in fibroblasts.

  The entity was defined in 2011 in one child with Leigh syndrome carrying
  compound-heterozygous NDUFA10 variants, one of which destroyed the start
  codon. A second child, homozygous, was reported in 2017, and the entity has
  since appeared in a Russian Leigh-syndrome cohort. In 2026 a targeted screen
  of complex I genes in patients with optic atrophy added three further NDUFA10
  families - and with them a second, far milder pole of the phenotype: two
  siblings homozygous for p.(R337C) had *isolated* optic atrophy, while a
  previously published patient with the same amino-acid change had multisystem
  disease. That contrast, within one allele, is the most informative
  genotype-phenotype observation available for this gene, and it is a
  discordance rather than a gradient.

  This entry curates one gene-defined disease whose reported range runs from
  infantile Leigh syndrome to isolated childhood optic atrophy. It does not
  treat the optic-atrophy families as a separate disorder: the pathology of
  Leigh syndrome includes the optic nerves, and the same subunit is lost in both
  poles.

  Two further properties of NDUFA10 have been characterised in non-disease
  systems and are curated here as explicitly hypothetical rather than omitted,
  because they are the features that distinguish this subunit from other
  complex I accessory subunits. NDUFA10 carries a deoxyribonucleoside-kinase
  domain that binds the large majority of the mitochondrial dGTP pool, making it
  a candidate link between respiration and mitochondrial DNA maintenance; and in
  Pink1-null mouse tissue the loss of phosphorylation at NdufA10 serine-250 is
  what uncouples ubiquinone reduction from the rest of the complex. Neither has
  been examined in a patient with an NDUFA10 variant, and neither is asserted
  here as part of the disease mechanism.

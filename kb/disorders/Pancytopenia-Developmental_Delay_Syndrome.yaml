differential_diagnoses:
- name: Acquired aplastic anaemia
  description: >-
    The commonest misdiagnosis, and a consequential one: immunosuppressive
    therapy does not address a germline repair defect and delays transplant in a
    disease whose survival collapses after transformation. Two adolescents with
    unremarkable histories and normal examinations were diagnosed only on
    genomic testing.
  evidence:
  - reference: PMID:39906419
    reference_title: "ERCC6L2-Associated Inherited Bone Marrow Failure Syndrome: A Croatian Experience."
    supports: SUPPORT

      lately diagnosed despite thorough medical assessment.
    explanation: >-
      The misdiagnosis problem is the stated motivation of the report.
- name: Other inherited bone marrow failure syndromes
  description: >-
    Fanconi anaemia and dyskeratosis congenita share marrow failure with a DNA
    repair or telomere lesion and a malignancy predisposition. ERCC6L2 disease is
    distinguished by the TP53-mutant, erythroid-predominant transformation
    pattern rather than by its cytopenia.

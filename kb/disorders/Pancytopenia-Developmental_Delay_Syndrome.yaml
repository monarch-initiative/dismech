treatments:
- name: Allogeneic haematopoietic stem cell transplantation
  description: >-
    The only potentially curative option. Timing is the whole question: 1-year
    and 3-year overall survival are 79% and 54%, but a previous history of
    excess blasts predicts markedly inferior survival with a hazard ratio of 6.8
    and a median survival of 12 months. Transplanting before transformation is
    therefore the intervention, not transplanting at all.
  treatment_term:
    preferred_term: allogeneic haematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  target_mechanisms:
  - target: ERCC6L2 Loss of Function
    description: >-
      Replaces the haematopoietic compartment with cells that carry a functional
      copy of the gene. It does not correct the repair defect in any other
      tissue.
  evidence:
  - reference: PMID:41628318
    reference_title: "Allogeneic hematopoietic stem cell transplantation in ERCC6L2 disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 1-year and 3-year OS were 79% (95% confidence interval [CI], 66-91) and
      54% (95% CI, 35-73), respectively.
    explanation: >-
      Survival after transplant, from the first systematic analysis of HSCT in
      this disease.
  - reference: PMID:41628318
    reference_title: "Allogeneic hematopoietic stem cell transplantation in ERCC6L2 disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previous history of excess blasts significantly predicted inferior survival
      (hazard ratio [HR], 6.8; 95% CI, 2.2-20.3; P< .001), with a median survival
      of 12 months (95% CI, 0-24).
    explanation: >-
      The prognostic effect of transplanting after transformation quantifies why
      timing dominates the treatment decision.
  - reference: PMID:41628318
    reference_title: "Allogeneic hematopoietic stem cell transplantation in ERCC6L2 disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The use of nontreosulfan-based myeloablative conditioning (MAC) regimens
      increased the risk of endothelial complications compared with
      reduced-intensity conditioning (RIC; HR, 4.9; 95% CI, 1.1-22.0; P = .040),
      whereas outcomes with treosulfan-based MAC were comparable to RIC.
    explanation: >-
      Supports the conditioning guidance recorded in the notes, with effect sizes
      for each comparison.
  notes: >-
    Conditioning choice is part of this treatment rather than a separate one, and
    it is mechanism-driven: the underlying DNA repair defect is why intensity
    matters. Grade 3 to 5 endothelial toxicities occurred in 27% of patients and
    were associated with higher non-relapse mortality; non-treosulfan-based
    myeloablative conditioning raised that risk relative to reduced-intensity
    conditioning, while treosulfan-based myeloablative conditioning was
    comparable to RIC.

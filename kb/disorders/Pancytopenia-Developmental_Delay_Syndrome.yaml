inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic, usually homozygous truncating variants, historically found in
    consanguineous families; a Finnish founder allele c.1424delT is now
    recognised.
  evidence:
  - reference: PMID:29633571
    reference_title: "ERCC6L2-associated inherited bone marrow failure syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All six cases had homozygous truncating mutations either at or upstream of
      the helicase domain of ERCC6L2.
    explanation: >-
      Homozygous truncating variants across all reported cases in this series
      support a recessive loss-of-function mechanism.
prevalence:
- population: Global ERCC6L2 disease cohort
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The largest assembled series holds 52 subjects from 35 families across 11
    centres, with 1165 person-years of follow-up. That is the denominator behind
    almost every quantitative statement in this entry.
  evidence:
  - reference: PMID:36952636
    reference_title: "The clinical picture of ERCC6L2 disease: from bone marrow failure to acute leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a series of 52 subjects (35 families) with ERCC6L2 biallelic
      germ line variants collected retrospectively from 11 centers globally, with
      a follow-up of 1165 person-years.
    explanation: >-
      The cohort size and follow-up are stated directly.
- population: Finland
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    A founder variant, c.1424delT, was identified in Finnish patients. No carrier
    frequency has been published, so no rate is recorded here.
  evidence:
  - reference: PMID:36952636
    reference_title: "The clinical picture of ERCC6L2 disease: from bone marrow failure to acute leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The subjects presented with 19 different variants of ERCC6L2, and we
      identified a founder mutation, c.1424delT, in Finnish patients.
    explanation: >-
      The founder allele and the breadth of the allelic series are both stated.
progression:
- phase: Bone marrow failure
  notes: >-
    Median age at first investigation is 18 years, with a range from 2 to 65.
    Blood counts are only mildly changed despite severe marrow hypoplasia, which
    is the single most misleading feature of the disease: a nearly normal full
    blood count sits on top of an almost empty marrow.
  evidence:
  - reference: PMID:36952636
    reference_title: "The clinical picture of ERCC6L2 disease: from bone marrow failure to acute leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Changes in the complete blood count were mild despite severe bone marrow
      (BM) hypoplasia and somatic TP53 mutations, with no significant difference
      between subjects with or without HMs.
    explanation: >-
      The dissociation between peripheral counts and marrow cellularity is
      measured across the cohort.
- phase: Progression to haematological malignancy
  notes: >-
    Median age at onset of a haematological malignancy is 37 years. Three-year
    overall survival falls from 95% for those still in the marrow-failure phase
    to 19% once malignancy has developed.
  evidence:
  - reference: PMID:36952636
    reference_title: "The clinical picture of ERCC6L2 disease: from bone marrow failure to acute leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median age at the onset of HM was 37.0 years (95% CI, 31.5-42.5; range,
      12-65 years).
    explanation: >-
      The age at transformation is given with its confidence interval.
  - reference: PMID:36952636
    reference_title: "The clinical picture of ERCC6L2 disease: from bone marrow failure to acute leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      overall survival (OS) at 3 years was 95% (95% CI, 85-100) and 19% (95% CI,
      0-39) for patients with BMF and HM, respectively.
    explanation: >-
      The survival difference between the two phases quantifies why the
      transformation, not the cytopenia, is the clinical problem.
pathophysiology:
- name: ERCC6L2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic truncating variants at or upstream of the helicase domain remove
    the protein's function and, for the originally described alleles, its
    subcellular localisation and stability.
  genes:
  - preferred_term: ERCC6L2
    term:
      id: hgnc:26922
      label: ERCC6L2
  genetic_context:
    gene:
      preferred_term: ERCC6L2
      term:
        id: hgnc:26922
        label: ERCC6L2
    allele_type: FRAMESHIFT
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:24507776
    reference_title: "ERCC6L2 mutations link a distinct bone-marrow-failure syndrome to DNA repair and mitochondrial function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous truncating mutations were identified in ERCC6L2 in two of the
      individuals. Both of these mutations affect the subcellular localization and
      stability of ERCC6L2.
    explanation: >-
      The discovery paper shows that the variants destabilise and mislocalise the
      protein, so the mechanism is loss of function rather than a dominant effect.
  downstream:
  - target: Failed Transcription-Coupled Repair and R-Loop Accumulation
    causal_link_type: DIRECT
    description: >-
      ERCC6L2 occupies gene bodies with RNA Pol II and DNA-PK; without it,
      transcript elongation is not terminated correctly after DNA damage and
      DNA-RNA hybrids accumulate.
    evidence:
    - reference: PMID:29987015
      reference_title: "Genome instability is a consequence of transcription deficiency in patients with bone marrow failure harboring biallelic ERCC6L2 variants."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Patients' LCLs fail to terminate transcript elongation accurately upon DNA
        damage and display a significant increase in nuclear DNA-RNA hybrids (R
        loops).
      explanation: >-
        Both halves of the mechanism are measured in patient-derived cells.
- name: Failed Transcription-Coupled Repair and R-Loop Accumulation
  biological_scale: MOLECULAR
  description: >-
    Patient cells are hypersensitive to agents that specifically activate
    transcription-coupled nucleotide excision repair, and also to transcription
    inhibitors that interfere with RNA Pol II, with an abnormally delayed
    transcription recovery. ERCC6L2 interacts with DNA-PK, a regulatory component
    of the RNA Pol II transcription complex.
  biological_processes:
  - preferred_term: transcription-coupled nucleotide-excision repair
    modifier: DECREASED
    term:
      id: GO:0006283
      label: transcription-coupled nucleotide-excision repair
  - preferred_term: transcription elongation by RNA polymerase II
    modifier: ABNORMAL
    term:
      id: GO:0006368
      label: transcription elongation by RNA polymerase II
  evidence:
  - reference: PMID:29987015
    reference_title: "Genome instability is a consequence of transcription deficiency in patients with bone marrow failure harboring biallelic ERCC6L2 variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We confirm that ERCC6L2 patients' lymphoblastoid cell lines (LCLs) are
      hypersensitive to DNA-damaging agents that specifically activate the
      transcription coupled nucleotide excision repair (TCNER) pathway.
    explanation: >-
      The pathway specificity of the sensitivity is what localises the defect to
      transcription-coupled repair rather than to repair in general.
  - reference: PMID:29987015
    reference_title: "Genome instability is a consequence of transcription deficiency in patients with bone marrow failure harboring biallelic ERCC6L2 variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using affinity-based mass spectrometry we found that ERCC6L2 interacts with
      DNA-dependent protein kinase (DNA-PK), a regulatory component of the RNA Pol
      II transcription complex.
    explanation: >-
      The physical interaction supplies the molecular route from the gene to the
      transcription machinery.
  downstream:
  - target: Replication Stress and DNA Damage in Haematopoietic Stem and Progenitor Cells
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41490322
      reference_title: "Bone marrow failure, somatic rescue by p53 inactivation, and enhanced leukemogenesis in germ line ERCC6L2 disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we demonstrate that Ercc6l2 maintains the competitive fitness of
        hematopoietic stem and progenitor cells (HSPCs) by mitigating replication
        stress.
      explanation: >-
        The model attributes the HSPC fitness defect specifically to unmitigated
        replication stress.
- name: Replication Stress and DNA Damage in Haematopoietic Stem and Progenitor Cells
  biological_scale: CELLULAR
  description: >-
    Sustained replication stress and DNA damage in haematopoietic stem and
    progenitor cells. The haematopoietic restriction of a ubiquitously expressed
    repair gene is not fully explained.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: DNA damage response
    modifier: INCREASED
    term:
      id: GO:0006974
      label: DNA damage response
  evidence:
  - reference: PMID:41490322
    reference_title: "Bone marrow failure, somatic rescue by p53 inactivation, and enhanced leukemogenesis in germ line ERCC6L2 disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Sustained replication stress and DNA damage in Ercc6l2-deficient HSPCs cause
      p53 pathway activation followed by cell cycle arrest and apoptosis.
    explanation: >-
      The step from replication stress to p53 activation is stated as the measured
      causal sequence.
  downstream:
  - target: p53 Pathway Activation and HSPC Attrition
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41490322
      reference_title: "Bone marrow failure, somatic rescue by p53 inactivation, and enhanced leukemogenesis in germ line ERCC6L2 disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Sustained replication stress and DNA damage in Ercc6l2-deficient HSPCs cause
        p53 pathway activation followed by cell cycle arrest and apoptosis.
      explanation: >-
        Same measured sequence, cited on the edge it establishes.
- name: p53 Pathway Activation and HSPC Attrition
  biological_scale: CELLULAR
  description: >-
    p53 activation drives cell cycle arrest and apoptosis, and Ercc6l2 deficiency
    also lowers expression of the master haematopoietic regulators Runx1 and
    Gata1. The result is fewer stem and progenitor cells.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: signal transduction by p53 class mediator
    modifier: INCREASED
    term:
      id: GO:0072331
      label: signal transduction by p53 class mediator
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:41490322
    reference_title: "Bone marrow failure, somatic rescue by p53 inactivation, and enhanced leukemogenesis in germ line ERCC6L2 disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Moreover, Ercc6l2 deficiency results in decreased expression of master
      hematopoietic regulators Runx1 and Gata1 in HSPCs.
    explanation: >-
      A second, p53-independent contribution to the haematopoietic failure.
  downstream:
  - target: Bone Marrow Hypoplasia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41490322
      reference_title: "Bone marrow failure, somatic rescue by p53 inactivation, and enhanced leukemogenesis in germ line ERCC6L2 disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Altogether, loss of Ercc6l2 leads to reduced HSPC numbers, bone marrow
        hypocellularity, and cytopenias.
      explanation: >-
        The chain from stem cell loss to marrow hypocellularity to cytopenia is
        stated as one sequence.
  - target: Impaired Erythroid Differentiation
    causal_link_type: DIRECT
    description: >-
      Erythroid commitment is disproportionately affected, which is the cellular
      basis of the erythroid predominance seen later in the marrow and in the
      leukaemias.
    evidence:
    - reference: PMID:36156210
      reference_title: "Germline ERCC excision repair 6 like 2 (ERCC6L2) mutations lead to impaired erythropoiesis and reshaping of the bone marrow microenvironment."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we show for the first time that ERCC6L2-deficiency in HSPCs
        significantly impedes their clonogenic potential and leads to delayed
        erythroid differentiation.
      explanation: >-
        The erythroid-specific delay is measured in human primary HSPCs.
- name: Impaired Erythroid Differentiation
  biological_scale: CELLULAR
  description: >-
    Delayed erythroid differentiation with a shift toward polychromatic and away
    from orthochromatic erythroblasts. The stromal compartment is also affected:
    patient-derived mesenchymal stromal cells show enhanced osteogenesis and
    suppressed adipogenesis, so the niche is remodelled as well as the stem cell.
  cell_types:
  - preferred_term: erythroblast
    term:
      id: CL:0000765
      label: erythroblast
  - preferred_term: mesenchymal stem cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  biological_processes:
  - preferred_term: erythrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0030218
      label: erythrocyte differentiation
  evidence:
  - reference: PMID:36156210
    reference_title: "Germline ERCC excision repair 6 like 2 (ERCC6L2) mutations lead to impaired erythropoiesis and reshaping of the bone marrow microenvironment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This observation was confirmed by CIBERSORTx RNA-sequencing deconvolution
      performed on ERCC6L2-silenced erythroid-committed cells, which demonstrated
      higher proportions of polychromatic erythroblasts and reduced orthochromatic
      erythroblasts versus controls.
    explanation: >-
      The maturation block is localised to a specific step in erythroid
      differentiation.
  - reference: PMID:36156210
    reference_title: "Germline ERCC excision repair 6 like 2 (ERCC6L2) mutations lead to impaired erythropoiesis and reshaping of the bone marrow microenvironment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we demonstrate that the consequences of ERCC6L2-deficiency are not limited
      to HSPCs, as we observe a striking phenotype in patient-derived and
      ERCC6L2-silenced MSCs, which exhibit enhanced osteogenesis and suppressed
      adipogenesis
    explanation: >-
      The niche phenotype is measured in patient-derived stromal cells, so the
      disease is not purely stem-cell intrinsic.
- name: Bone Marrow Hypoplasia
  biological_scale: TISSUE
  description: >-
    Severe marrow hypoplasia. Peripheral counts understate it, which is why the
    diagnosis is often delayed and why active surveillance rather than count
    monitoring is what the literature recommends.
  evidence:
  - reference: PMID:36952636
    reference_title: "The clinical picture of ERCC6L2 disease: from bone marrow failure to acute leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Changes in the complete blood count were mild despite severe bone marrow
      (BM) hypoplasia and somatic TP53 mutations, with no significant difference
      between subjects with or without HMs.
    explanation: >-
      Severe hypoplasia with mild count changes is measured across the cohort.
  downstream:
  - target: Somatic TP53 Clonal Rescue
    causal_link_type: DIRECT
    description: >-
      Because p53 activation is what removes the mutant stem cells, inactivating
      p53 restores their fitness. The selection pressure created by the disease
      selects for the clone that will kill the patient.
    evidence:
    - reference: PMID:41490322
      reference_title: "Bone marrow failure, somatic rescue by p53 inactivation, and enhanced leukemogenesis in germ line ERCC6L2 disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Notably, somatic Trp53 mutations restore cellular fitness of
        Ercc6l2-deficient HSPCs by abrogating p53 pathway activation and restoring
        Runx1 and Gata1 expression, thereby correcting the BMF phenotype.
      explanation: >-
        The rescue is demonstrated experimentally, and it explains why TP53 clones
        are selected rather than merely observed.
- name: Somatic TP53 Clonal Rescue
  biological_scale: CELLULAR
  description: >-
    Somatic TP53 mutation restores the fitness of the ERCC6L2-deficient stem
    cell and corrects the marrow failure. It does not correct the replication
    stress, so DNA damage keeps accumulating in a clone that can no longer arrest
    or die. This is the pivot of the whole disease.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  genes:
  - preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  evidence:
  - reference: PMID:41490322
    reference_title: "Bone marrow failure, somatic rescue by p53 inactivation, and enhanced leukemogenesis in germ line ERCC6L2 disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, p53 loss fails to normalize replication stress, allowing for the
      accumulation of DNA damage over time, which increases the likelihood for
      leukemic transformation.
    explanation: >-
      The rescue is partial in exactly the way that matters: fitness is restored,
      the underlying lesion is not.
  downstream:
  - target: TP53-Mutated Erythroid-Predominant Myeloid Malignancy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41490322
      reference_title: "Bone marrow failure, somatic rescue by p53 inactivation, and enhanced leukemogenesis in germ line ERCC6L2 disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, p53 loss fails to normalize replication stress, allowing for the
        accumulation of DNA damage over time, which increases the likelihood for
        leukemic transformation.
      explanation: >-
        The same sentence names the transformation as the consequence.
- name: TP53-Mutated Erythroid-Predominant Myeloid Malignancy
  biological_scale: ORGANISM
  description: >-
    Myelodysplastic syndrome or acute myeloid leukaemia with somatic TP53
    mutations and erythroid predominance. Three-year overall survival falls to
    19% once this develops.
  evidence:
  - reference: PMID:36952636
    reference_title: "The clinical picture of ERCC6L2 disease: from bone marrow failure to acute leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic germ line excision repair cross-complementing 6 like 2 (ERCC6L2)
      variants strongly predispose to bone marrow failure (BMF) and myeloid
      malignancies, characterized by somatic TP53-mutated clones and erythroid
      predominance.
    explanation: >-
      The malignancy's defining molecular and morphological features are stated
      for the whole cohort.
  - reference: PMID:36790458
    reference_title: "ERCC6L2-related disease: a novel entity of bone marrow failure disorder with high risk of clonal evolution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Monosomy 7 was also described in 7/10 patients with MDS/AML.
    explanation: >-
      A second recurrent cytogenetic lesion in the transformed clone, present in
      the same proportion as the TP53 mutations.

    explanation: >-
      Names the morphological features that mark progression, alongside the
      molecular one.
diagnosis:
- name: Bone marrow examination with TP53 clonal surveillance
  description: >-
    A full blood count is not sufficient: counts are mild while the marrow is
    severely hypoplastic. Progression is tracked by rising TP53 variant allele
    frequency, megakaryocytic or erythroid dysplasia, and erythroid predominance
    in marrow morphology, so surveillance has to be marrow-based and molecular.
  evidence:

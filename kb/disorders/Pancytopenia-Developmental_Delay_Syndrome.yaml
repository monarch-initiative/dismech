  - reference: PMID:36790458
    reference_title: "ERCC6L2-related disease: a novel entity of bone marrow failure disorder with high risk of clonal evolution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

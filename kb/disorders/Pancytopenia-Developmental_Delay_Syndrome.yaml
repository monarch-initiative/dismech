      while 6 presented dysplasia at the time of presentation.
    explanation: >-
      Gives both marrow pictures with their denominators, which is what separates
      the presenting appearance from the progression appearance.
- name: Megakaryocytic and erythroid dysplasia with erythroid predominance
  description: >-
    The marrow picture of progression rather than of presentation. Six of the
    twenty-six patients with reported morphology already had dysplasia when
    first seen; in the rest its appearance, together with erythroid
    predominance, is one of the recognised markers that the disease is moving.
  evidence:
  - reference: PMID:36952636
    reference_title: "The clinical picture of ERCC6L2 disease: from bone marrow failure to acute leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Signs of progressive disease included increasing TP53 variant allele
      frequency, dysplasia in megakaryocytes and/or erythroid lineage, and

name: Pancytopenia-Developmental Delay Syndrome
creation_date: "2026-08-31T15:10:00Z"
description: >-
  Pancytopenia-developmental delay syndrome, also bone marrow failure syndrome 2
  (BMFS2) and increasingly just "ERCC6L2 disease", is an autosomal recessive
  inherited bone marrow failure syndrome caused by biallelic ERCC6L2 variants.
  ERCC6L2 works with DNA-PK to keep RNA polymerase II transcription from
  generating genome instability; without it, haematopoietic stem and progenitor
  cells accumulate replication stress, activate p53, and are lost. The defining
  clinical problem is not the cytopenia, which is often mild, but what follows
  it: somatic TP53 mutations restore the fitness of the mutant stem cells,
  correcting the marrow failure at the cost of a highly penetrant progression to
  erythroid-predominant, TP53-mutated myeloid malignancy.
category: Mendelian
disease_term:
  preferred_term: pancytopenia-developmental delay syndrome
  term:
    id: MONDO:0014317
    label: pancytopenia-developmental delay syndrome
synonyms:

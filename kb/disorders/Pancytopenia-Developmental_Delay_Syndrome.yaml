discussions:
- discussion_id: ercc6l2_haematopoietic_restriction
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does loss of a ubiquitously expressed transcription-coupled repair factor
    produce a phenotype dominated by haematopoiesis?
  attaches_to:
  - pathophysiology#Replication Stress and DNA Damage in Haematopoietic Stem and Progenitor Cells
  rationale: >-
    The molecular lesion is a general transcription-coupled repair defect
    demonstrated in lymphoblastoid cell lines, but the clinical disease is a
    marrow failure syndrome. The candidate explanations -- high HSPC replication
    demand, particular sensitivity of erythroid commitment, a remodelled stromal
    niche -- are each supported by one experiment and none has been tested against
    the others.
  status: OPEN
  evidence:
  - reference: PMID:36156210
    reference_title: "Germline ERCC excision repair 6 like 2 (ERCC6L2) mutations lead to impaired erythropoiesis and reshaping of the bone marrow microenvironment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      While germline mutations in the DNA repair factor ERCC excision repair 6
      like 2 (ERCC6L2) give rise to bone marrow failure and acute myeloid
      leukaemia, their consequences on normal haematopoiesis remain unclear.
    explanation: >-
      The authors state that the consequences for normal haematopoiesis remain
      unclear, which is the gap recorded here.
- discussion_id: ercc6l2_name_understates_disease
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is "pancytopenia-developmental delay syndrome" the right name for a disease
    whose cytopenias are mild, whose developmental delay is inconstant, and whose
    defining feature is TP53-mutant leukaemic transformation?
  attaches_to:
  - disease#Pancytopenia-Developmental Delay Syndrome
  - phenotypes#Developmental delay
  rationale: >-
    Both features in the MONDO label are the weaker ones. Counts are mild
    relative to marrow hypoplasia, and patients have been reported with
    unremarkable histories and normal physical findings. The literature has
    largely moved to "ERCC6L2 disease". This matters practically, not just
    terminologically: a clinician who expects pancytopenia and developmental
    delay will not think of the diagnosis in an otherwise well adolescent with
    bicytopenia, which is the presentation the Croatian report was written to
    highlight.
  status: OPEN
  evidence:
  - reference: PMID:39906419
    reference_title: "ERCC6L2-Associated Inherited Bone Marrow Failure Syndrome: A Croatian Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present two unrelated adolescent females with unexplained prolonged
      bicytopenia, unremarkable medical history and normal physical findings who
      were diagnosed with a rare non-classical ERCC6L2-associatedIBMFS.
    explanation: >-
      A presentation with neither pancytopenia nor developmental delay is the
      concrete case against the name.
notes: >-
  The counterintuitive core of this disease is that the somatic event which
  corrects the marrow failure is the same one that causes the leukaemia. Somatic
  TP53 mutation is selected for because it reverses the p53-dependent attrition
  of ERCC6L2-deficient stem cells, but it does not touch the replication stress,
  so the rescued clone keeps accumulating damage without being able to arrest or
  die. A patient whose counts improve is not necessarily getting better.

  The MONDO label understates the disease on both counts; see the open discussion.

  A note on the 19% microcephaly/developmental-delay figure used here. The
  deep-research report attributed it to "De Vitis et al."; no such paper exists
  in PubMed. The figure itself is real and is now cited to its actual source,
  Baccelli et al. 2023 (PMID:36790458), which reports 6/31. The number was right
  and the attribution was invented, which is a failure mode worth knowing about:
  checking that a cited claim is true is not the same as checking that the named
  author wrote it.
  PMID:42415356, a 2026 Br J Haematol paper on advanced fibrosis and TP53 variants
  as diagnostic harbingers, is relevant but was not cited: its PubMed record
  carries no abstract, so there is no quotable text and a title is not a finding.

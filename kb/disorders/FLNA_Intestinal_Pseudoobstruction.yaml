name: FLNA Intestinal Pseudoobstruction
creation_date: "2026-04-04T00:00:00Z"
description: >-
  FLNA-related X-linked chronic idiopathic intestinal pseudo-obstruction (CIIPX) is a
  severe congenital visceral dysmotility disorder predominantly affecting hemizygous
  males carrying loss-of-function variants or intragenic duplications in FLNA on Xq28.
  In classic isolated intestinal disease, 5-prime frameshift variants between the ATG+1
  and ATG+82 translation initiation codons selectively abolish the long FLNA isoform that
  predominates in developing intestinal smooth muscle while preserving the shorter
  ATG+82 isoform required for embryonic survival, producing diffuse abnormal layering of
  the small intestinal muscularis propria, enteric neuromuscular dysfunction, congenital
  short bowel or malrotation, and chronic intestinal pseudo-obstruction. Variants that
  reduce both isoforms cause compound phenotypes combining intestinal dysmotility with
  periventricular nodular heterotopia, congenital heart defects such as patent ductus
  arteriosus, and bladder dysfunction.
synonyms:
- congenital short bowel syndrome, X-linked recessive
- intestinal pseudoobstruction, neuronal, X-linked recessive
- intestinal pseudoobstruction, neuronal, chronic idiopathic, X-linked
- CIIPX
- X-linked chronic idiopathic intestinal pseudo-obstruction
category: Mendelian
parents:

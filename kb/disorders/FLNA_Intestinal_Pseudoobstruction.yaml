    explanation: National 20-year cohort establishes ultra-rare annual incidence of pediatric intestinal pseudo-obstruction, placing an upper bound on FLNA-related disease incidence.
inheritance:
- name: X-linked Recessive
  description: >-
    Hemizygous males with isoform-selective 5-prime truncating variants or intragenic
    FLNA duplications manifest severe intestinal pseudo-obstruction, whereas heterozygous
    carrier females are typically asymptomatic or show periventricular nodular
    heterotopia when overall FLNA dosage is reduced.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:17357080
    reference_title: "Filamin A is mutated in X-linked chronic idiopathic intestinal pseudo-obstruction with central nervous system involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We selected and sequenced seven genes and found that one affected male from a large CIIPX-affected kindred bears a 2-bp deletion in exon 2 of the FLNA gene that is present at the heterozygous state in the carrier females of the family."
    explanation: Demonstrates X-linked recessive transmission with affected hemizygous males and heterozygous carrier females.
pathophysiology:
- name: FLNA Long-Isoform Loss-of-Function and Cytoskeletal Disorganization
  biological_scale: MOLECULAR
  description: >-
    5-prime frameshift variants located between the ATG+1 and ATG+82 translation start
    codons of FLNA (or intragenic FLNA duplications) eliminate expression of the full-length
    ATG+1 filamin A isoform that predominates in intestinal smooth muscle while preserving
    translation of the shorter ATG+82 isoform, disrupting actin cytoskeleton crosslinking.
  genes:
  - preferred_term: FLNA
    term:
      id: hgnc:3754
      label: FLNA
  molecular_functions:
  - preferred_term: actin filament binding
    term:
      id: GO:0051015
      label: actin filament binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29024177
    reference_title: "Differential regulation of two FLNA transcripts explains some of the phenotypic heterogeneity in the loss-of-function filaminopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A male with CIPO (c.18_19del) exclusively expressed FLNA ATG+82 , implicating the longer protein isoform (ATG+1 ) in smooth muscle development. In contrast, mutations leading to reduction of both isoforms are associated with compound phenotypes affecting the brain, heart, and intestine."
    explanation: Establishes selective loss of the long ATG+1 FLNA isoform as the molecular mechanism underlying isolated X-linked intestinal pseudo-obstruction in surviving males.
  - reference: PMID:17357080
    reference_title: "Filamin A is mutated in X-linked chronic idiopathic intestinal pseudo-obstruction with central nervous system involvement."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We confirmed this, demonstrating that the filamin protein is present in the patient's lymphoblastoid cell line that shows abnormal cytoskeletal actin organization compared with normal lymphoblasts."
    explanation: Demonstrates abnormal actin cytoskeleton organization in patient-derived cells expressing only the N-terminally truncated filamin A isoform.
  downstream:
  - target: Diffuse Abnormal Layering of Small Intestinal Muscularis Propria
    description: Selective loss of the smooth-muscle-predominant ATG+1 FLNA isoform disrupts lamination of the developing small-intestinal muscularis propria and enteric neuromuscular architecture.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29024177
      reference_title: "Differential regulation of two FLNA transcripts explains some of the phenotypic heterogeneity in the loss-of-function filaminopathies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Transcripts sponsoring translational initiation at ATG+1 predominate in intestinal smooth muscle, and are more abundant compared with the level measured in fibroblasts."
      explanation: Explains why loss of the ATG+1 isoform selectively impairs intestinal smooth muscle development.
  - target: Impaired Cerebral Neuronal Migration
    description: Variants that reduce total FLNA dosage across both isoforms impair actin-dependent radial neuronal migration from the cerebral ventricular zone.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29024177
      reference_title: "Differential regulation of two FLNA transcripts explains some of the phenotypic heterogeneity in the loss-of-function filaminopathies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In contrast, mutations leading to reduction of both isoforms are associated with compound phenotypes affecting the brain, heart, and intestine."
      explanation: Shows that reduction of both FLNA isoforms produces brain and cardiac involvement alongside intestinal disease.
  - target: Patent Ductus Arteriosus
    description: FLNA loss-of-function variants affecting cardiovascular development predispose to congenital cardiac outflow and ductal anomalies including patent ductus arteriosus.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:20301392
      reference_title: FLNA Deficiency.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "CLINICAL CHARACTERISTICS: FLNA deficiency is associated with a phenotypic spectrum that includes FLNA-related periventricular nodular heterotopia (Huttenlocher syndrome), congenital heart disease (patent ductus arteriosus, atrial and ventricular septal defects), valvular dystrophy, dilatation and rupture of the thoracic aorta, pulmonary disease (pulmonary hypertension, alveolar hypoplasia, emphysema, asthma, chronic bronchitis), gastrointestinal dysmotility and obstruction, joint hypermobility, and macrothrombocytopenia."
      explanation: GeneReviews documents patent ductus arteriosus within the FLNA loss-of-function clinical spectrum.

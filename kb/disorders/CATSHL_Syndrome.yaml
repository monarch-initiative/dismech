notes: >-
  FGFR3-CATSHL gene-disease validity is Moderate in the August 2026 ClinGen reevaluation. Classic families, candidate tall-stature variants and the average-stature Asn540Asp hearing-loss case have different levels of phenotypic and variant support. Human frequencies derive from small ascertained pedigrees.

  Neurodevelopmental findings, digital contractures, chest-wall deformity and the additional renal, dental and minor dysmorphic observations do not yet have experimentally established causal routes; their presence is recorded without assigning them to the cartilage or cochlear pathway by default. Relative microcephaly in the Italian proband is not coded as absolute microcephaly.

  Experimental Hedgehog and Wnt interventions are model-system results, not demonstrated CATSHL therapies. Achondroplasia-directed FGFR3/MAPK inhibition cannot be assumed appropriate for an impaired-signaling disorder. The activating Y367C mouse informs the bidirectional cochlear discussion and is not a CATSHL model. The Cannova full-text PDF cache retains its fetcher-generated URL title; the article identity is PMID:37990933, DOI:10.1111/cge.14455.

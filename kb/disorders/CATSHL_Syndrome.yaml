genetic:
- name: FGFR3
  gene_term:
    preferred_term: FGFR3
    term:
      id: hgnc:3690
      label: FGFR3
  relationship_type: CAUSATIVE
  notes: >-
    All three reported CATSHL alleles are missense substitutions in the FGFR3
    tyrosine kinase domain. Two affect Arg621 in the catalytic loop and act
    dominantly; the third affects Thr546 and has been seen only in the homozygous
    state.
  evidence:
  - reference: PMID:17033969
    reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We mapped the locus causing a novel disorder characterized by camptodactyly, tall stature, scoliosis, and hearing loss (CATSHL syndrome) to chromosome 4p."
    explanation: Establishes the 4p locus that contains FGFR3 and led to the gene assignment.
  variants:
  - name: c.1862G>A (p.Arg621His)
    description: >-
      The founding allele, heterozygous in all 20 genotyped members of the Utah
      pedigree and absent from 500 ancestry-matched control chromosomes.
    evidence:
    - reference: PMID:17033969
      reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we screened FGFR3 and subsequently identified a heterozygous missense mutation that is predicted to cause a p.R621H substitution in the tyrosine kinase domain and partial loss of FGFR3 function."
      explanation: Names the allele and its predicted functional consequence.
  - name: c.1861C>T (p.Arg621Cys)
    description: >-
      A second substitution at the same residue, reported in an Italian father
      and daughter.
    evidence:
    - reference: PMID:37990933
      reference_title: "CATSHL syndrome, a new family and phenotypic expansion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "molecular analysis revealed a hitherto unreported, monoallelic variant c.1861C>T (p.Arg621Cys) in FGFR3."
      explanation: Names the second dominant allele at Arg621.
  - name: c.1637C>A (p.Thr546Lys)
    description: >-
      A homozygous allele in two brothers of consanguineous parents, producing a
      more severe phenotype than either heterozygous Arg621 allele.
    evidence:
    - reference: PMID:24864036
      reference_title: "A novel homozygous mutation in FGFR3 causes tall stature, severe lateral tibial deviation, scoliosis, hearing impairment, camptodactyly, and arachnodactyly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole exome sequencing revealed a homozygous novel missense mutation in the FGFR3 gene in exon 12 (NM_000142.4:c.1637C>A: p.(Thr546Lys))."
      explanation: Names the biallelic allele with its transcript-level description.
animal_models:
- name: Fgfr3-null mouse
  species: Mouse
  genotype: Fgfr3 homozygous targeted disruption
  publication: PMID:8630492
  description: >-
    The model that named the mechanism. Its phenotype was published a decade
    before the first human family, and the human gene was found precisely because
    the pedigree recapitulated the mouse.
  modeled_mechanisms:
  - target: Endochondral Bone and Vertebral Overgrowth
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Skeletal overgrowth of long bones and vertebrae with kyphosis and scoliosis,
      matching the human radiographic pattern.
    limitations: >-
      The mouse is a complete null while the common human genotype is a
      heterozygous missense allele on a wild-type background, so the mouse
      represents a more severe loss of receptor function than the dominant human
      disease.
    readouts:
    - name: Long bone and vertebral length
      target: Endochondral Bone and Vertebral Overgrowth
      direction: INCREASED
      interpretation: Structural correlate of the overgrowth node.
      evidence:
      - reference: PMID:8630492
        reference_title: "Skeletal overgrowth and deafness in mice lacking fibroblast growth factor receptor 3."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Skeletal defects include kyphosis, scoliosis, crooked tails and curvature and overgrowth of long bones and vertebrae."
        explanation: Reports the skeletal measurements behind this readout.
    evidence:
    - reference: PMID:8630492
      reference_title: "Skeletal overgrowth and deafness in mice lacking fibroblast growth factor receptor 3."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our results demonstrate that Fgfr3 is essential for normal endochondral ossification and inner ear development."
      explanation: Supports treating the null mouse as informative for the endochondral overgrowth node.
  - target: Failure of Cochlear Pillar Cell Differentiation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Pillar cells fail to differentiate and the tunnel of Corti does not form,
      producing profound deafness - the cellular lesion the human sensorineural
      hearing loss is attributed to.
    limitations: >-
      The mouse deafness is static while the human hearing loss is progressive.
      The original authors read that difference as evidence that residual
      wild-type FGFR3 in heterozygotes delays rather than prevents the defect,
      and as a hint that pillar cells need FGFR3 for maintenance as well as
      formation - neither of which the null mouse can test.
    readouts:
    - name: Pillar cell differentiation and tunnel of Corti formation
      target: Failure of Cochlear Pillar Cell Differentiation
      direction: ABOLISHED
      interpretation: Histological correlate of the cochlear node.
      evidence:
      - reference: PMID:8630492
        reference_title: "Skeletal overgrowth and deafness in mice lacking fibroblast growth factor receptor 3."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Inner ear defects include failure of pillar cell differentiation and tunnel of Corti formation and result in profound deafness."
        explanation: Reports the cochlear histology and the resulting deafness.
    evidence:
    - reference: PMID:8630492
      reference_title: "Skeletal overgrowth and deafness in mice lacking fibroblast growth factor receptor 3."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Fibroblast growth factor receptor 3 (Fgfr3) is a tyrosine kinase receptor expressed in developing bone, cochlea, brain and spinal cord."
      explanation: Establishes cochlear expression, which is why the null mouse is informative for this node.
- name: Chondrocyte-specific postnatal Fgfr3 knockout mouse
  species: Mouse
  genotype: Postnatal chondrocyte-specific Fgfr3 conditional deletion
  publication: PMID:26091072
  description: >-
    A conditional model that isolates the cartilage compartment and shows what
    the loss does after birth rather than during development.
  modeled_mechanisms:
  - target: Chondroma-like Lesion Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Multiple enchondroma- and osteochondroma-like lesions adjacent to
      disordered growth plates, with reduced ERK and raised IHH, and fewer

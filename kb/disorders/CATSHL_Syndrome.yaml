name: CATSHL Syndrome
category: Mendelian
creation_date: "2026-08-29T19:15:00Z"
synonyms:
- camptodactyly-tall stature-scoliosis-hearing loss syndrome
- camptodactyly, tall stature, and hearing loss syndrome
- CATSHLS
description: >-
  CATSHL syndrome is a rare FGFR3-related skeletal overgrowth disorder characterized by camptodactyly, tall stature, scoliosis and sensorineural hearing loss. Heterozygous Arg621 substitutions and a homozygous Thr546Lys substitution have been reported in classic families. Developmental delay, intellectual disability, microcephaly, chest deformity and osteochondroma are variable; an Arg621Cys family expands the reported phenotype to dental and renal anomalies. Hearing loss can begin in infancy or childhood. Reduced FGFR3 signaling is the proposed disease mechanism, supported by loss-of-function animal models, but direct functional characterization of the human alleles remains limited. ClinGen retained a Moderate gene-disease validity classification in its August 2026 reevaluation.
disease_term:
  preferred_term: CATSHL syndrome
  term:
    id: MONDO:0012504
    label: camptodactyly-tall stature-scoliosis-hearing loss syndrome
parents:
- FGFR3-related skeletal dysplasia
classifications:
  isds_skeletal_category:
  - classification_value: fgfr3_chondrodysplasia
    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, group 1
      "FGFR3 chondrodysplasia group"; CATSHL is the loss-of-function member of
      the group, which the Nosology lists alongside the gain-of-function
      disorders.
inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous p.Arg621His segregated in the founding Utah pedigree and was subsequently reported in an independent family; p.Arg621Cys was identified in an Italian father and daughter. The full penetrance reported in small ascertained families and assumed for the original linkage analysis is not a population penetrance estimate.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:17033969
    reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we screened FGFR3 and subsequently identified a heterozygous missense mutation that is predicted to cause a p.R621H substitution in the tyrosine kinase domain and partial loss of FGFR3 function."
    explanation: A heterozygous allele segregating through a multigeneration pedigree establishes dominant transmission.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:27139183
    reference_title: 'A second family with CATSHL syndrome: Confirmatory report of another unique FGFR3 syndrome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Our family confirms the consistent and unique phenotype of this condition, and the specificity of the mutation in FGFR3.
    explanation: Independent 2016 family confirming the dominant phenotype; the small pedigree does not quantify population penetrance.
- name: Autosomal recessive
  description: >-
    Homozygous p.Thr546Lys was reported in two brothers of first-cousin parents with severe skeletal deformity. ClinGen describes subtle tall stature, relative microcephaly and long lower limbs in their parents and curates the broader gene-disease relationship as semidominant. Thus, the recessive presentation does not establish complete absence of effects in heterozygotes, nor does comparison with Arg621 families isolate an allele-dose effect.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24864036
    reference_title: "A novel homozygous mutation in FGFR3 causes tall stature, severe lateral tibial deviation, scoliosis, hearing impairment, camptodactyly, and arachnodactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the phenotype and underlying molecular abnormality in two brothers, born to first cousin parents."
    explanation: Affected sibs of consanguineous parents carrying the variant homozygously indicate recessive inheritance for this allele.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: url:https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_90130560-3e24-46a9-beaa-c67792773d3d
    reference_title: curation results for Gene-Disease Validity
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Mother and father are mildly affected with slight tall stature, relative microcephaly, and long lower limbs.
    explanation: ClinGen expert abstraction of the 2014 family qualifies the baseline claim that heterozygous parents were entirely unaffected.
prevalence:
- population: Founding Utah pedigree reported in 2006
  measure_type: CASES_IN_LITERATURE
  notes: The pedigree contained 35 historically affected individuals over seven generations, of whom 27 were living and 20 had clinical information and DNA available. This is a family count, not a population prevalence estimate. Later independent families and candidate spectrum cases preclude using this count as the worldwide total.
  evidence:
  - reference: PMID:17033969
    reference_title: A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: from a total of 35 affected individuals in seven generations
    explanation: Historical affected count in the founding pedigree; 27 were living and 20 studied.
pathophysiology:
- name: FGFR3 Coding Missense Variation
  description: Germline single-nucleotide substitutions alter the FGFR3 kinase-domain coding sequence. Classic pedigrees carry heterozygous Arg621His or Arg621Cys, or homozygous Thr546Lys. Additional missense variants in tall-stature or hearing-loss cohorts require individual interpretation.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:37990933
    reference_title: CATSHL syndrome, a new family and phenotypic expansion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: molecular analysis revealed a hitherto unreported, monoallelic variant c.1861C>T (p.Arg621Cys) in FGFR3.
    explanation: Direct identification of a coding substitution.
  - reference: PMID:24864036
    reference_title: A novel homozygous mutation in FGFR3 causes tall stature, severe lateral tibial deviation, scoliosis, hearing impairment, camptodactyly, and arachnodactyly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 'Whole exome sequencing revealed a homozygous novel missense mutation in the FGFR3 gene in exon 12 (NM_000142.4:c.1637C>A: p.(Thr546Lys)).'
    explanation: Distinct homozygous coding substitution in the severe skeletal family.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "was present in 18 (90%) of 20 individuals, and 17 (85%) of 20 had hearing loss"
    explanation: 90% of genotyped individuals had camptodactyly, supporting VERY_FREQUENT.
- category: Musculoskeletal
  name: Camptodactyly of Toe

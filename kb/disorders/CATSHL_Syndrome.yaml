- name: FGFR3 Kinase-Domain Loss of Function
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Reduced FGFR3 receptor signaling is inferred from the kinase-domain substitutions, structural modeling, segregation and the overlap with null-animal phenotypes. The Arg621His substitution may impair phosphate transfer, and a dominant-negative interaction with the wild-type receptor is proposed. Neither kinase inhibition by the human alleles nor mutant/wild-type heterodimer suppression was directly measured in the founding report. The direction of effect is supported by model systems and expert curation, while allele-specific biochemical mechanisms remain unresolved.

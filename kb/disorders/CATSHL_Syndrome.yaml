review_notes: >-
  Two uncited files in references_cache come from the deep-research report's own
  citation-validation pass, not from this entry:
  DOI_10.1371_journal.pgen.1005214.md, which is the same paper as the cited
  PMID:26091072 and is kept because the report cites it in DOI form, and
  DOI_10.1002_dvdy.21026.md, a Dev Dyn paper on excess hair cell development in
  Fgfr3-null mice that the report cites without an abstract in the cache, so
  nothing in it was quotable. Every other cached reference in this PR is cited.
notes: >-
  Scope and modelling decisions recorded so they do not read as omissions.

  No conforms_to against fgfr_gain_of_function_skeletal_dysplasia. That module is
  explicitly genotype-driven and scoped to activating FGFR alleles - its entry
  node is a constitutively active receptor driving sustained MAPK/STAT output.
  CATSHL runs the same axis in the opposite direction, so declaring conformance
  would assert the reverse of what the module's nodes say. The two belong
  together as a contrast, not as a conformance relationship.

  No clinical_trials and no disease-modifying treatment. Nothing is registered
  for CATSHL. The FGFR3-directed therapies in development - vosoritide and the
  FGFR inhibitors - all aim to reduce FGFR3 pathway output and are therefore
  pointed the wrong way for this disease. The hedgehog and Wnt inhibitors that
  rescue the animal models have not been given to a patient.

  No environmental section. The disease is monogenic with no reported
  environmental modifier.

  The Fgfr3 Y367C mouse is deliberately not curated under animal_models. It
  carries an activating allele and models thanatophoric dysplasia, not this
  disease; it appears only as evidence in the discussion about bidirectional
  cochlear failure, which is the only claim it supports here.

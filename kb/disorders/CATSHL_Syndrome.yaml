    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  downstream:
  - target: Sensorineural Hearing Loss
    description: Abnormal epithelial patterning accompanies deafness in Fgfr3-null mice; its independent contribution is unresolved.
    causal_link_type: UNKNOWN

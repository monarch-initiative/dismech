      label: Marfan syndrome
  description: >-
    The obvious alternative for tall stature with arachnodactyly and scoliosis,
    and the one the original investigators formally excluded.
  distinguishing_features:
  - Severe myopia, lens dislocation and aortic root dilatation are absent in CATSHL.
  - Sensorineural hearing loss is not a feature of Marfan syndrome.
  evidence:
  - reference: PMID:17033969
    reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
    supports: SUPPORT

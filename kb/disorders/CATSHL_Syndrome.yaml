name: CATSHL Syndrome
category: Mendelian
creation_date: "2026-08-29T19:15:00Z"
synonyms:
- camptodactyly-tall stature-scoliosis-hearing loss syndrome
- camptodactyly, tall stature, and hearing loss syndrome
- CATSHLS
description: >-
  CATSHL syndrome is an ultra-rare skeletal dysplasia caused by germline loss of
  FGFR3 function. FGFR3 normally restrains chondrocyte proliferation and
  hypertrophy in the growth plate, so losing that restraint produces the mirror
  image of the FGFR3 gain-of-function chondrodysplasias: tall stature and
  overgrown long bones and vertebrae rather than short-limbed dwarfism. The
  named features are camptodactyly, tall stature, scoliosis and congenital or
  early-onset sensorineural hearing loss; developmental delay, microcephaly,
  pectus deformity and solitary osteochondromas occur in a subset. The hearing
  loss is not a secondary consequence of the skeletal disease but a separate
  requirement for FGFR3 in the cochlea, where it is needed for pillar cells of
  the organ of Corti to differentiate. Fewer than about 35 individuals have been
  reported, in three families.
disease_term:
  preferred_term: CATSHL syndrome
  term:
    id: MONDO:0012504
    label: camptodactyly-tall stature-scoliosis-hearing loss syndrome
parents:
- FGFR3-related skeletal dysplasia
classifications:
  isds_skeletal_category:
  - classification_value: fgfr3_chondrodysplasia
    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, group 1
      "FGFR3 chondrodysplasia group"; CATSHL is the loss-of-function member of
      the group, which the Nosology lists alongside the gain-of-function
      disorders.
inheritance:
- name: Autosomal dominant
  description: >-
    The two heterozygous alleles reported to date, p.Arg621His and p.Arg621Cys,
    both segregate as autosomal dominant traits - across four generations of a
    Utah pedigree and between a father and his daughter in an Italian family.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:17033969
    reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we screened FGFR3 and subsequently identified a heterozygous missense mutation that is predicted to cause a p.R621H substitution in the tyrosine kinase domain and partial loss of FGFR3 function."
    explanation: A heterozygous allele segregating through a multigeneration pedigree establishes dominant transmission.
- name: Autosomal recessive
  description: >-
    One consanguineous Egyptian family carries a different allele, p.Thr546Lys,
    in the homozygous state, with unaffected heterozygous relatives. So CATSHL is
    not a single inheritance mode: the two reported Arg621 substitutions act
    dominantly, and this one does not act at all in the heterozygous state.
    Whether that difference is a property of the residue or of the substitution
    has not been tested.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24864036
    reference_title: "A novel homozygous mutation in FGFR3 causes tall stature, severe lateral tibial deviation, scoliosis, hearing impairment, camptodactyly, and arachnodactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the phenotype and underlying molecular abnormality in two brothers, born to first cousin parents."
    explanation: Affected sibs of consanguineous parents carrying the variant homozygously indicate recessive inheritance for this allele.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Three families have been reported: the Utah pedigree (35 affected across
    seven generations, 27 living and 20 genotyped), two Egyptian brothers, and
    an Italian father and daughter. No population-based prevalence estimate
    exists, and none should be inferred from a case count - the count reflects
    ascertainment of individual pedigrees, not disease frequency.
  evidence:
  - reference: PMID:17033969
    reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We evaluated a large Utah pedigree in which 27 living affected family members spanning four generations"
    explanation: Gives the size of the founding pedigree, which is the bulk of the reported case count.
pathophysiology:
- name: FGFR3 Kinase-Domain Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    A germline missense substitution in the FGFR3 tyrosine kinase domain reduces
    receptor kinase activity. The recurrent dominant allele replaces Arg621 in
    the catalytic loop, the residue that positions the transferred phosphate and
    is invariant across the tyrosine kinase superfamily; the recessive allele
    replaces Thr546 elsewhere in the same domain. The dominant alleles are
    unlikely to act by haploinsufficiency - the original authors give three
    reasons, of which the strongest is that heterozygous Fgfr3-null mice are
    normal - and a dominant-negative heterodimer with the wild-type receptor is
    the proposed alternative. That proposal has not been tested biochemically in
    a CATSHL allele, so the entry treats the direction of effect as established
    and the dominant-negative mechanism as the working model rather than a
    finding.
  gene:
    preferred_term: FGFR3
    description: >-
      Fibroblast growth factor receptor 3, carrying a kinase-domain missense
      variant that reduces receptor activity.
    modifier: LOSS_OF_FUNCTION
    term:
      id: hgnc:3690
      label: FGFR3
  molecular_functions:
  - preferred_term: fibroblast growth factor receptor activity
    term:
      id: GO:0005007
      label: fibroblast growth factor receptor activity
    modifier: DECREASED
  genetic_context:
    gene:
      preferred_term: FGFR3
      term:
        id: hgnc:3690
        label: FGFR3
    allele_type: MISSENSE
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
    notes: >-
      Describes the two dominant Arg621 alleles, which is the common genotype.
      PARTIAL_LOSS_OF_FUNCTION rather than LOSS_OF_FUNCTION because the founding
      report describes the substitution as causing partial loss of FGFR3
      function, and DOMINANT_NEGATIVE is deliberately not used even though it is
      the proposed mechanism - it has never been demonstrated, which is what the
      catshl_dominant_negative_untested discussion is about. The p.Thr546Lys
      allele is homozygous and is not covered by this block; its zygosity is
      recorded on the variant and in the inheritance section.
  evidence:
  - reference: PMID:17033969
    reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "R621 is located in the catalytic loop of the tyrosine kinase domain of FGFR3, and it is invariant in the tyrosine kinase superfamily"
    explanation: Locates the recurrent dominant substitution in the catalytic machinery of the kinase, which is why it reduces activity.
  - reference: PMID:17033969
    reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "These observations suggest that p.R621H might, instead, cause loss of FGFR3 function by a dominant negative mechanism."
    explanation: >-
      The authors' own proposal for how a heterozygous allele produces loss of
      function. Graded INDIRECT because the sentence is an inference from the
      arguments against haploinsufficiency, not a demonstration of heterodimer
      inhibition.
  - reference: PMID:24864036
    reference_title: "A novel homozygous mutation in FGFR3 causes tall stature, severe lateral tibial deviation, scoliosis, hearing impairment, camptodactyly, and arachnodactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "This is the first report of a homozygous loss-of-function mutation in FGFR3 in human that results in a skeletal overgrowth syndrome."
    explanation: Independent confirmation that FGFR3 loss of function, not gain, produces the overgrowth phenotype.
  downstream:
  - target: Reduced MAPK/ERK Output in Growth Plate Chondrocytes
    causal_link_type: DIRECT
    description: >-
      Reduced receptor kinase activity lowers the inhibitory signal FGFR3
      normally sends into the growth plate.
  - target: Failure of Cochlear Pillar Cell Differentiation
    causal_link_type: DIRECT
    description: >-
      The same receptor is required in cochlear supporting cells, so the cochlear
      arm branches at the receptor rather than downstream of the skeletal
      pathway.

- name: Reduced MAPK/ERK Output in Growth Plate Chondrocytes
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    In the proliferative and prehypertrophic growth plate, ligand-activated
    FGFR3 signals through MAPK/ERK to inhibit chondrocyte proliferation and
    hypertrophic differentiation. This is the step that makes FGFR3 a negative
    regulator of bone growth, and it is what a loss-of-function allele removes.
    The direction is the point: every other FGFR3 skeletal disorder in this
    knowledge base sits at the opposite end of the same axis.
  cell_types:
  - preferred_term: Growth plate chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  biological_processes:
  - preferred_term: fibroblast growth factor receptor signaling pathway
    term:
      id: GO:0008543
      label: fibroblast growth factor receptor signaling pathway
    modifier: DECREASED
  - preferred_term: ERK1 and ERK2 cascade
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
    modifier: DECREASED
  evidence:
  - reference: PMID:8601314
    reference_title: "Fibroblast growth factor receptor 3 is a negative regulator of bone growth."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "Thus, FGFR-3 appears to regulate endochondral ossification by an essentially negative mechanism, limiting rather than promoting osteogenesis."
    explanation: States the negative-regulator role whose removal is this node.
  - reference: PMID:26091072
    reference_title: "FGFR3 Deficiency Causes Multiple Chondroma-like Lesions by Upregulating Hedgehog Signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "The lesions showed decreased extracellular signal-regulated kinase (ERK) activity and increased Indian hedgehog (IHH) expression."
    explanation: Measures the fall in ERK activity in cartilage lacking Fgfr3, which is the specific effector claim of this node.
  downstream:
  - target: Disinhibited Chondrocyte Proliferation and Hypertrophy
    causal_link_type: DIRECT
  - target: Derepressed Indian Hedgehog Signaling
    causal_link_type: DIRECT
    description: >-
      MEK inhibition alone raises Ihh expression in Fgfr3-deficient chondrocytes,
      placing the hedgehog arm downstream of the drop in MAPK output.

- name: Derepressed Indian Hedgehog Signaling
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Loss of FGFR3 raises Indian hedgehog expression in growth-plate cartilage,
    and inhibiting hedgehog signaling reduces the resulting lesions. The
    confidence is PROVISIONAL rather than established because the whole of this
    arm rests on mouse and zebrafish work; no CATSHL patient tissue has been
    examined for hedgehog pathway activity, and the human disease has not been
    shown to run through this step.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:26091072
    reference_title: "FGFR3 Deficiency Causes Multiple Chondroma-like Lesions by Upregulating Hedgehog Signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "Importantly, treatment with an inhibitor of IHH signaling reduced the occurrence of chondroma-like lesions in Fgfr3-deficient mice."
    explanation: >-
      A rescue experiment, which is stronger than the correlation - blocking the
      pathway reduces the phenotype it is proposed to cause.
  - reference: PMID:32641982
    reference_title: "Fgfr3 mutation disrupts chondrogenesis and bone ossification in zebrafish model mimicking CATSHL syndrome partially via enhanced Wnt/β-catenin signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "we revealed that deficiency of fgfr3 leads to enhanced IHH signaling and up-regulated canonical Wnt/β-catenin signaling, and pharmacological inhibition of Wnt/β-catenin could partially alleviate the phenotypes of fgfr3 mutants."
    explanation: >-
      A second species reaching the same hedgehog result, and adding canonical
      Wnt as a parallel derepressed pathway.
  downstream:
  - target: Chondroma-like Lesion Formation
    causal_link_type: DIRECT

- name: Disinhibited Chondrocyte Proliferation and Hypertrophy
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Without the FGFR3 brake, the proliferative and hypertrophic zones of the
    growth plate expand and chondrocytes continue to divide and enlarge for
    longer than they should. This is the cellular event that converts a receptor
    defect into extra bone length.
  cell_types:
  - preferred_term: Proliferating growth plate chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  - preferred_term: Hypertrophic chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  biological_processes:
  - preferred_term: growth plate cartilage chondrocyte proliferation
    term:
      id: GO:0003419
      label: growth plate cartilage chondrocyte proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:8601314
    reference_title: "Fibroblast growth factor receptor 3 is a negative regulator of bone growth."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "This growth is accompanied by expansion of proliferating and hypertrophic chondrocytes within the cartilaginous growth plate."
    explanation: Directly reports the cellular expansion this node asserts.
  downstream:
  - target: Endochondral Bone and Vertebral Overgrowth
    causal_link_type: DIRECT

- name: Endochondral Bone and Vertebral Overgrowth
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Extra growth-plate output lengthens the long bones and the vertebral bodies.
    Only bones formed by endochondral ossification are affected, which is why the
    radiographic signature is tall vertebral bodies and long tubular shafts
    rather than a generalized bone abnormality. Overlong vertebral bodies are
    also the mechanical origin of the scoliosis, so the spinal deformity is a
    consequence of the overgrowth rather than an independent feature.
  locations:
  - preferred_term: growth plate cartilage
    term:
      id: UBERON:0004129
      label: growth plate cartilage
  biological_processes:
  - preferred_term: endochondral bone growth
    term:
      id: GO:0003416
      label: endochondral bone growth
    modifier: INCREASED
  evidence:
  - reference: PMID:8601314
    reference_title: "Fibroblast growth factor receptor 3 is a negative regulator of bone growth."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "We have identified a role for fibroblast growth factor receptor 3 (FGFR-3) in this process by disrupting the murine Fgfr-3 gene to produce severe and progressive bone dysplasia with enhanced and prolonged endochondral bone growth."
    explanation: Establishes enhanced and prolonged endochondral growth as the tissue-level result of losing the receptor.
  - reference: PMID:17033969
    reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Radiographic findings included tall vertebral bodies with irregular borders and broad femoral metaphyses with long tubular shafts"
    explanation: The human radiographic counterpart of the mouse overgrowth phenotype.
  - reference: PMID:17033969
    reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "These findings indicate that abnormal FGFR3 signaling can cause human anomalies by promoting as well as inhibiting endochondral bone growth."
    explanation: States the bidirectional axis that makes this entry the counterpart of the achondroplasia group.

- name: Chondroma-like Lesion Formation
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: PROVISIONAL
  description: >-
    Disordered growth plates lacking FGFR3 generate enchondroma- and
    osteochondroma-like cartilage lesions in mice. Several members of the Utah
    pedigree had a solitary osteochondroma of the femur, tibia or a phalanx,
    which is the human observation this node is anchored to. The link between the
    two is not established: the human lesions are solitary and were not examined
    for hedgehog activity, while the mouse lesions are multiple and mechanistically
    dissected, so the node records a plausible correspondence rather than a
    demonstrated one.
  evidence:
  - reference: PMID:26091072
    reference_title: "FGFR3 Deficiency Causes Multiple Chondroma-like Lesions by Upregulating Hedgehog Signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "we found that postnatal chondrocyte-specific Fgfr3 deletion induced multiple chondroma-like lesions, including enchondromas and osteochondromas, adjacent to disordered growth plates."
    explanation: The model-system observation of cartilage lesions arising from Fgfr3 loss.
  - reference: PMID:17033969
    reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Several affected individuals had a single osteochondroma of the femur, the tibia, or a phalanx"
    explanation: >-
      The human counterpart. Graded INDIRECT because the report records the
      lesions without linking them to FGFR3 signaling in those individuals.

- name: Failure of Cochlear Pillar Cell Differentiation
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    FGFR3 is expressed in the cochlear supporting cells that become pillar cells,
    and losing it prevents pillar cell differentiation and tunnel of Corti
    formation, producing sensorineural deafness with a structurally normal middle
    and inner ear on imaging. This explains an otherwise puzzling feature of the
    clinical picture: the hearing loss is sensorineural and profound while CT and
    MRI are normal, because the defect is at the level of cell identity within the
    organ of Corti rather than of gross morphogenesis.
  locations:
  - preferred_term: organ of Corti
    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  cell_types:
  - preferred_term: Cochlear pillar cell
    term:
      id: CL:1000191
      label: pillar cell
  biological_processes:
  - preferred_term: inner ear morphogenesis
    term:
      id: GO:0042472
      label: inner ear morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:8630492
    reference_title: "Skeletal overgrowth and deafness in mice lacking fibroblast growth factor receptor 3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "Inner ear defects include failure of pillar cell differentiation and tunnel of Corti formation and result in profound deafness."
    explanation: The cellular lesion behind the hearing loss, demonstrated in the null mouse.
  - reference: PMID:17033969
    reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Computed tomography and magnetic resonance imaging revealed that the brain, middle ear, and inner ear were structurally normal."
    explanation: >-
      Normal imaging alongside sensorineural loss is consistent with a
      cellular-differentiation defect rather than a structural malformation.
      Graded INDIRECT because normal imaging excludes alternatives rather than
      demonstrating the pillar cell defect in patients.
phenotypes:
- category: Growth
  name: Tall Stature
  description: >-
    Postnatal overgrowth is the cardinal and most consistent feature. In the Utah
    pedigree every measured adult exceeded the 75th centile and nearly all
    exceeded the 97th.
  phenotype_term:
    preferred_term: Tall stature
    term:
      id: HP:0000098
      label: Tall stature
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:17033969
    reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adult height in males was >97th percentile in 5 of 5 men, with a mean height of 77 inches, and adult height in females was >75th percentile in 9 of 9 and >97th percentile in 8 of 9 women, with a mean height of 70 inches."
    explanation: Gives per-sex counts above the 97th and 75th centiles, supporting a VERY_FREQUENT band.
- category: Musculoskeletal
  name: Camptodactyly
  description: >-
    Fixed flexion contracture of the digits. Bound to the pooled term because the
    published count is of hands and/or feet together, so a finger-specific term
    would carry a denominator that is not finger-specific.
  phenotype_term:
    preferred_term: Camptodactyly
    term:
      id: HP:0012385
      label: Camptodactyly
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:17033969

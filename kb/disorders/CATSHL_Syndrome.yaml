        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Importantly, treatment with an inhibitor of IHH signaling reduced the occurrence of chondroma-like lesions in Fgfr3-deficient mice."
        explanation: Reports the lesion count responding to pathway inhibition.
    evidence:
    - reference: PMID:26091072
      reference_title: "FGFR3 Deficiency Causes Multiple Chondroma-like Lesions by Upregulating Hedgehog Signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This is the first study reporting that the loss of Fgfr3 function leads to the formation of chondroma-like lesions via downregulation of MEK/ERK signaling and upregulation of IHH, suggesting that FGFR3 has a tumor suppressor-like function in chondrogenesis."
      explanation: Supports treating this model as informative for the lesion node and names the proposed mechanism.
  - target: Derepressed Indian Hedgehog Signaling
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      The model is where the raised IHH and lowered ERK were actually measured.
    limitations: >-
      Measured in mouse cartilage only; the equivalent measurement has never been

    snippet: "Marfan syndrome was considered a possible diagnosis, but no affected individuals who were examined had severe myopia, lens dislocation, or aortic-root abnormalities."
    explanation: Records the exclusion and the features used to make it.
- name: Hunter-MacDonald syndrome
  description: >-
    Shares camptodactyly, scoliosis and reduced hearing acuity, so it overlaps
    CATSHL on three of its four named features. Stature is the discriminator and
    it runs the opposite way.
  distinguishing_features:
  - Short stature rather than tall stature.
  - Epiphyseal dysplasia with early osteoarthritis, and a predisposition to meningioma.
  evidence:
  - reference: PMID:17972300
    reference_title: "The Hunter-MacDonald syndrome with expanded phenotype including risk of meningioma: an update and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The skeletal manifestations of HMS include short stature, scoliosis, epiphyseal dysplasia with early osteoarthritis leading to joint replacement, prominent humeral insertions for the deltoids, camptodactyly, subluxation of the thumbs, and malformed feet."
    explanation: Lists the overlapping features together with the short stature that separates it from CATSHL.
- name: LADD syndrome
  description: >-
    Another FGFR3-related condition. Relevant because peg-shaped incisors, a
    LADD feature, turned up in one CATSHL proband, so the dental finding does not
    separate the two as cleanly as it appears to.
  distinguishing_features:
  - Lacrimal, auricular and digital anomalies are the defining LADD features and are not part of CATSHL.
  evidence:
  - reference: PMID:37990933
    reference_title: "CATSHL syndrome, a new family and phenotypic expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The FGFR3 p.Arg621Cys variant seems to be a newly identified cause of CATSHL syndrome with some phenotypic overlap with the LADD syndrome."
    explanation: States the overlap the authors themselves drew between the two FGFR3 conditions.

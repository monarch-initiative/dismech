diagnosis:
- name: FGFR3 sequencing
  description: >-
    Phenotype-directed FGFR3 sequencing or broader sequencing can identify relevant kinase-domain variants, followed by segregation and variant interpretation. The founding family used linkage plus direct sequencing, the Thr546Lys brothers exome sequencing, and the Arg621Cys family targeted exon sequencing. A candidate case in a hearing-loss cohort was missed by a panel that omitted FGFR3 and detected by exome sequencing; a molecular finding alone does not establish pathogenicity.
  evidence:
  - reference: PMID:24864036
    reference_title: "A novel homozygous mutation in FGFR3 causes tall stature, severe lateral tibial deviation, scoliosis, hearing impairment, camptodactyly, and arachnodactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing revealed a homozygous novel missense mutation in the FGFR3 gene in exon 12"
    explanation: Documents molecular confirmation as the diagnostic route.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: url:https://air.unimi.it/retrieve/627c309a-8b19-4de3-aaee-33b598f0e8c2/Clinical%20Genetics%20-%202023%20-%20Cannova%20-%20CATSHL%20syndrome%20a%20new%20family%20and%20phenotypic%20expansion.pdf
    reference_title: https://air.unimi.it/retrieve/627c309a-8b19-4de3-aaee-33b598f0e8c2/Clinical%20Genetics%20-%202023%20-%20Cannova%20-%20CATSHL%20syndrome%20a%20new%20family%20and%20phenotypic%20expansion.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: exon 14 and flanking exons of FGFR3 gene sequencing was performed.
    explanation: Cannova et al. document targeted sequencing rather than a linkage study in the Italian family.
- name: Audiometry with otoacoustic emissions
  description: >-
    Audiometry and otoacoustic emissions characterize the hearing phenotype. The Utah family had bilateral sensorineural loss and absent emissions in tested individuals. Follow-up is relevant because childhood onset and variable progression occur; normal CT/MRI does not exclude a cochlear cellular lesion.
  evidence:
  - reference: PMID:17033969
    reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On audiological exam, each tested individual had bilateral sensorineural hearing loss and absent otoacoustic emissions"
    explanation: Describes the audiological findings that define the test result.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
differential_diagnoses:
- name: Marfan syndrome
  disease_term:
    preferred_term: Marfan syndrome
    term:
      id: MONDO:0007947
      label: Marfan syndrome
  description: >-
    The obvious alternative for tall stature with arachnodactyly and scoliosis,
    and the one the original investigators formally excluded.
  distinguishing_features:
  - The examined Utah relatives lacked severe myopia, lens dislocation and aortic-root abnormalities, which argued against Marfan syndrome in that pedigree.
  - The combination of digital contractures and sensorineural hearing loss supports consideration of CATSHL; cardiac or ocular findings in an individual still require independent assessment.
  evidence:
  - reference: PMID:17033969
    reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Marfan syndrome was considered a possible diagnosis, but no affected individuals who were examined had severe myopia, lens dislocation, or aortic-root abnormalities."
    explanation: Records the exclusion and the features used to make it.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Hunter-MacDonald syndrome
  description: >-
    Shares camptodactyly, scoliosis and reduced hearing acuity, so it overlaps
    CATSHL on three of its four named features. Stature is the discriminator and
    it runs the opposite way.
  distinguishing_features:
  - Short stature rather than tall stature.
  - Epiphyseal dysplasia with early osteoarthritis, and a predisposition to meningioma.
  evidence:
  - reference: PMID:17972300
    reference_title: "The Hunter-MacDonald syndrome with expanded phenotype including risk of meningioma: an update and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The skeletal manifestations of HMS include short stature, scoliosis, epiphyseal dysplasia with early osteoarthritis leading to joint replacement, prominent humeral insertions for the deltoids, camptodactyly, subluxation of the thumbs, and malformed feet."
    explanation: Lists the overlapping features together with the short stature that separates it from CATSHL.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: LADD syndrome
  description: >-
    Another FGFR3-related condition. Relevant because peg-shaped incisors, a
    LADD feature, turned up in one CATSHL proband, so the dental finding does not
    separate the two as cleanly as it appears to.
  distinguishing_features:
  - Lacrimal and salivary duct aplasia, hypoplasia or atresia are characteristic of LADD. Hearing, digital, dental and renal findings can overlap.
  - Tall stature and scoliosis favor the reported CATSHL pattern, but peg-shaped incisors and renal dysplasia in the Arg621Cys proband blur the clinical boundary.
  evidence:
  - reference: PMID:37990933
    reference_title: "CATSHL syndrome, a new family and phenotypic expansion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The FGFR3 p.Arg621Cys variant seems to be a newly identified cause of CATSHL syndrome with some phenotypic overlap with the LADD syndrome."
    explanation: States the overlap the authors themselves drew between the two FGFR3 conditions.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: url:https://air.unimi.it/retrieve/627c309a-8b19-4de3-aaee-33b598f0e8c2/Clinical%20Genetics%20-%202023%20-%20Cannova%20-%20CATSHL%20syndrome%20a%20new%20family%20and%20phenotypic%20expansion.pdf

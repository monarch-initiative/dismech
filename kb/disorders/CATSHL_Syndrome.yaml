      direction: INCREASED
      interpretation: The molecular readout defining this node.
      evidence:
      - reference: PMID:26091072
        reference_title: "FGFR3 Deficiency Causes Multiple Chondroma-like Lesions by Upregulating Hedgehog Signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The lesions showed decreased extracellular signal-regulated kinase (ERK) activity and increased Indian hedgehog (IHH) expression."
        explanation: The direct measurement of both pathway changes.
- name: fgfr3 knockout zebrafish
  species: Zebrafish
  genotype: CRISPR/Cas9 fgfr3 frameshift, homozygous
  publication: PMID:32641982
  description: >-
    Built explicitly as a CATSHL model, and the only model that reproduces the
    craniofacial and microcephaly features the mouse does not.
  modeled_mechanisms:
  - target: Derepressed Indian Hedgehog Signaling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Confirms raised IHH in a second species and adds canonical Wnt/beta-catenin
      as a parallel derepressed pathway, with partial phenotypic rescue by a Wnt
      inhibitor.
    limitations: >-
      Zebrafish skeletal architecture and auditory end organs differ substantially
      from human, and the rescue was partial. The Wnt arm has not been examined in

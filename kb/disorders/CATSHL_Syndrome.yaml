- name: Spider lamb syndrome sheep
  species: Sheep
  genotype: Fgfr3 p.Val700Glu, naturally occurring
  publication: PMID:17033969
  description: >-
    Ovine hereditary chondrodysplasia, a naturally occurring sheep disease rather
    than an engineered model. It is the only spontaneous animal counterpart of
    CATSHL known, and it arose from a different FGFR3 kinase-domain substitution
    reached independently of the human alleles.
  modeled_mechanisms:
  - target: Endochondral Bone and Vertebral Overgrowth
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Heterozygous animals have modestly increased long-bone length; homozygotes

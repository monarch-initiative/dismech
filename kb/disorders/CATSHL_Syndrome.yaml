discussions:
- discussion_id: catshl_craniofacial_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why do CATSHL patients have craniofacial abnormalities and microcephaly when
    Fgfr3-deficient mice have no craniofacial phenotype at all?
  rationale: >-
    The mouse reproduces the two features that made it the candidate model -
    skeletal overgrowth and deafness - and reproduces them well. It does not
    reproduce microcephaly, high palate or wormian bones, which are recorded in
    the human families. This is not a gap in evidence but a discordance between
    species: the measurement has been made in the mouse and the answer is
    negative. The zebrafish does show microcephaly and delayed suture closure,
    which makes the mouse the outlier rather than the human, but zebrafish
    craniofacial development is far enough from human that it cannot settle the
    mechanism. Until it is resolved, the craniofacial and neurodevelopmental
    features of CATSHL have no model system that both shows them and is close
    enough to human to interpret.
  attaches_to:
  - phenotypes#Microcephaly
  - phenotypes#High Palate
  - phenotypes#Wormian Bones
  - phenotypes#Developmental Delay and Intellectual Disability
  evidence:
  - reference: PMID:32641982
    reference_title: "Fgfr3 mutation disrupts chondrogenesis and bone ossification in zebrafish model mimicking CATSHL syndrome partially via enhanced Wnt/β-catenin signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The reason for the discrepant in the craniofacial phenotypes between mouse model and patients remains to be studied."
    explanation: >-
      The authors state the mismatch explicitly and record it as unresolved.
      Quoted as written, including the grammatical slip in the original.
  - reference: PMID:32641982
    reference_title: "Fgfr3 mutation disrupts chondrogenesis and bone ossification in zebrafish model mimicking CATSHL syndrome partially via enhanced Wnt/β-catenin signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "craniofacial bone malformation with microcephaly and delayed closure of cranial sutures"
    explanation: Establishes that the zebrafish, unlike the mouse, does show the craniofacial phenotype.
- discussion_id: catshl_dominant_negative_untested
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do the Arg621 alleles act as dominant negatives, and if so does the mutant
    receptor actually inhibit its wild-type partner?
  rationale: >-
    The dominant-negative model is the only explanation on offer, and the
    arguments against haploinsufficiency are good ones. But the positive claim
    has never been tested: nobody has shown that mutant FGFR3 heterodimerises
    with the wild-type receptor and suppresses its kinase activity. The evidence
    offered is that mutant and wild-type transcripts are expressed at comparable
    levels and both proteins reach the membrane, which is consistent with a
    dominant negative and equally consistent with a simple hypomorph whose
    threshold effects differ between tissues. The distinction matters for whether
    the two Arg621 substitutions and the Thr546Lys allele share one mechanism.
  attaches_to:
  - pathophysiology#FGFR3 Kinase-Domain Loss of Function
  evidence:
  - reference: PMID:17033969
    reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For several reasons, it is unlikely that the loss of function caused by p.R621H results from haploinsufficiency."
    explanation: The authors' own framing of the mechanism as an inference from exclusion rather than a demonstration.
- discussion_id: catshl_bidirectional_cochlear_failure
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does either too little or too much FGFR3 signaling cause deafness?
  rationale: >-
    Loss of Fgfr3 abolishes pillar cell differentiation; the activating Y367C
    allele produces fully penetrant deafness with an increased number of pillar
    or modified supporting cells. The organ of Corti therefore fails in both
    directions from an intermediate optimum, which is unusual and is not
    explained by a simple dose-response model of the receptor. Whether the two
    deafnesses share a final common lesion or are distinct failures of the same
    patterning step is unknown, and the answer would constrain how the human
    hearing loss is expected to progress.
  attaches_to:
  - pathophysiology#Failure of Cochlear Pillar Cell Differentiation
  evidence:
  - reference: PMID:19073250
    reference_title: "Activating Fgfr3 Y367C mutation causes hearing loss and inner ear defect in a mouse model of chondrodysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The inner ear defect is mainly associated with an increased number of pillar cells or modified supporting cells in the organ of Corti."
    explanation: >-
      Shows the gain-of-function receptor producing the opposite cellular change
      in the same structure, which is what makes the bidirectional failure a real
      question rather than a rhetorical one.
  - reference: PMID:19073250
    reference_title: "Activating Fgfr3 Y367C mutation causes hearing loss and inner ear defect in a mouse model of chondrodysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mutant Fgfr3(Y367C/+) mice exhibit fully penetrant deafness with a significantly elevated auditory brainstem response threshold for all frequencies tested."
    explanation: Establishes that the activating allele also causes deafness, not merely a cellular change.

    readouts:
    - name: IHH and canonical Wnt/beta-catenin pathway activity
      target: Derepressed Indian Hedgehog Signaling
      direction: INCREASED
      interpretation: Cross-species confirmation of the derepression node.
      evidence:
      - reference: PMID:32641982
        reference_title: "Fgfr3 mutation disrupts chondrogenesis and bone ossification in zebrafish model mimicking CATSHL syndrome partially via enhanced Wnt/β-catenin signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we revealed that deficiency of fgfr3 leads to enhanced IHH signaling and up-regulated canonical Wnt/β-catenin signaling, and pharmacological inhibition of Wnt/β-catenin could partially alleviate the phenotypes of fgfr3 mutants."
        explanation: Reports both pathway measurements and the rescue.
    evidence:
    - reference: PMID:32641982
      reference_title: "Fgfr3 mutation disrupts chondrogenesis and bone ossification in zebrafish model mimicking CATSHL syndrome partially via enhanced Wnt/β-catenin signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that fgfr3 mutant zebrafish, staring from early development stage, showed craniofacial bone malformation with microcephaly and delayed closure of cranial sutures, chondroma-like lesion and abnormal development of auditory sensory organs, partially resembling the clinical manifestations of patients with CATSHL syndrome."
      explanation: >-

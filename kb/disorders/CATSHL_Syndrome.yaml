genetic:
- name: FGFR3
  gene_term:
    preferred_term: FGFR3
    term:
      id: hgnc:3690
      label: FGFR3
  relationship_type: UNKNOWN
  notes: >-
    ClinGen classifies the semidominant FGFR3-CATSHL relationship as Moderate (reevaluation 24 August 2026). Classic pedigrees involve Arg621His, Arg621Cys and homozygous Thr546Lys. Additional missense observations from tall-stature and hearing-loss cohorts broaden the candidate spectrum but do not establish equal clinical or mechanistic certainty for every allele. The evidence supports a reported relationship whose definitive validity has not yet been established.
  evidence:
  - reference: PMID:17033969
    reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We mapped the locus causing a novel disorder characterized by camptodactyly, tall stature, scoliosis, and hearing loss (CATSHL syndrome) to chromosome 4p."
    explanation: Establishes the 4p locus that contains FGFR3 and led to the gene assignment.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  variants:
  - name: c.1862G>A (p.Arg621His)
    description: >-
      Heterozygous c.1862G>A (p.Arg621His), the founding Utah allele, was identified in all 20 tested affected relatives and subsequently reported in an independent family. The original paper contains a reversed amino-acid wording in one sentence; the consistent HGVS identity is Arg621His.
    evidence:
    - reference: PMID:17033969
      reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we screened FGFR3 and subsequently identified a heterozygous missense mutation that is predicted to cause a p.R621H substitution in the tyrosine kinase domain and partial loss of FGFR3 function."
      explanation: Names the allele and its predicted functional consequence.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
    - reference: url:https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_90130560-3e24-46a9-beaa-c67792773d3d
      reference_title: curation results for Gene-Disease Validity
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: '(p.Arg621His) ... ClinGen Allele Registry: ... CA126386 ... Monoallelic heterozygous'
      explanation: ClinGen records the recurrent allele in both Toydemir and Escobar probands.
  - name: c.1861C>T (p.Arg621Cys)
    description: >-
      Heterozygous c.1861C>T (p.Arg621Cys), reported using NM_000142.5 in an Italian father and daughter; classified likely pathogenic by the report. Clinical overlap with LADD remains a phenotype-boundary question.
    evidence:
    - reference: PMID:37990933
      reference_title: "CATSHL syndrome, a new family and phenotypic expansion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "molecular analysis revealed a hitherto unreported, monoallelic variant c.1861C>T (p.Arg621Cys) in FGFR3."
      explanation: Names the second dominant allele at Arg621.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  - name: c.1637C>A (p.Thr546Lys)
    description: >-
      Homozygous NM_000142.4:c.1637C>A (p.Thr546Lys) in two Egyptian brothers with severe lower-limb deformity. Subtle parental skeletal features are described in ClinGen; the report does not provide a controlled dosage comparison with the Arg621 alleles.
    evidence:
    - reference: PMID:24864036
      reference_title: "A novel homozygous mutation in FGFR3 causes tall stature, severe lateral tibial deviation, scoliosis, hearing impairment, camptodactyly, and arachnodactyly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole exome sequencing revealed a homozygous novel missense mutation in the FGFR3 gene in exon 12 (NM_000142.4:c.1637C>A: p.(Thr546Lys))."
      explanation: Names the biallelic allele with its transcript-level description.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  - name: c.1618A>G (p.Asn540Asp)
    description: Homozygous candidate spectrum variant in Brazilian proband RC-26 with prelingual mild-to-moderate hearing loss, camptodactyly and microcephaly but average stature. The authors considered it likely pathogenic/causative, while their table records VUS or LP/VUS database assessments. No functional assay was reported; this observation does not establish classic CATSHL or a universal loss-of-function effect for substitutions at residue 540.
    evidence:
    - reference: PMID:39498320
      reference_title: 'Genetic heterogeneity in autosomal recessive hearing loss: a survey of Brazilian families.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Proband RC-26 had a likely pathogenic variant in homozygosis in FGFR3
      explanation: Authors report a candidate homozygous FGFR3 finding; pathogenicity and the syndrome boundary remain uncertain.
    - reference: PMID:39498320
      reference_title: 'Genetic heterogeneity in autosomal recessive hearing loss: a survey of Brazilian families.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Height was average and flexion restriction of the third digit was observed in both hands.
      explanation: The case lacks the characteristic tall stature of classic CATSHL.
  - name: c.1541C>A (p.Ala514Asp)
    description: A heterozygous finding in the 2024 familial-tall-stature study, included with low case-level weight in the 2026 ClinGen reevaluation. These broader growth-phenotype cases do not establish the complete CATSHL triad or an experimentally measured receptor loss-of-function effect.

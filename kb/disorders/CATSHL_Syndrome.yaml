- name: Chondroma-like Lesion Formation
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: PROVISIONAL
  description: >-
    Disordered growth plates lacking FGFR3 generate enchondroma- and
    osteochondroma-like cartilage lesions in mice. Several members of the Utah
    pedigree had a solitary osteochondroma of the femur, tibia or a phalanx,
    which is the human observation this node is anchored to. The link between the
    two is not established: the human lesions are solitary and were not examined
    for hedgehog activity, while the mouse lesions are multiple and mechanistically
    dissected, so the node records a plausible correspondence rather than a
    demonstrated one.
  evidence:
  - reference: PMID:26091072
    reference_title: "FGFR3 Deficiency Causes Multiple Chondroma-like Lesions by Upregulating Hedgehog Signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "we found that postnatal chondrocyte-specific Fgfr3 deletion induced multiple chondroma-like lesions, including enchondromas and osteochondromas, adjacent to disordered growth plates."
    explanation: The model-system observation of cartilage lesions arising from Fgfr3 loss.
    quote_role: PRIMARY_RESULT
  - reference: PMID:17033969
    reference_title: "A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss (CATSHL) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Several affected individuals had a single osteochondroma of the femur, the tibia, or a phalanx"
    explanation: >-
      The human counterpart. Graded INDIRECT because the report records the
      lesions without linking them to FGFR3 signaling in those individuals.

    quote_role: PRIMARY_RESULT
  downstream:
  - target: Osteochondroma
    description: Mouse cartilage lesions partly resemble the solitary human lesions; pathway identity has not been tested in patients.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Failure of Cochlear Pillar Cell Differentiation
  biological_scale: CELLULAR
  role: consequence
  mechanism_confidence: PROVISIONAL
  description: >-
    Fgfr3-null mice fail to develop inner pillar cells, while outer pillar-cell differentiation stalls and the tunnel of Corti fails to form. This provides a model-based explanation for human sensorineural hearing loss, but normal clinical CT/MRI does not demonstrate a pillar-cell defect in patients. Human hearing severity ranges from mild to severe and is not invariably profound.
  locations:
  - preferred_term: organ of Corti
    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  cell_types:
  - preferred_term: Cochlear pillar cell
    term:
      id: CL:1000191
      label: pillar cell
  biological_processes:
  - preferred_term: inner ear morphogenesis
    term:
      id: GO:0042472
      label: inner ear morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:8630492
    reference_title: "Skeletal overgrowth and deafness in mice lacking fibroblast growth factor receptor 3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: DIRECT
    snippet: "Inner ear defects include failure of pillar cell differentiation and tunnel of Corti formation and result in profound deafness."
    explanation: The cellular lesion behind the hearing loss, demonstrated in the null mouse.
    quote_role: PRIMARY_RESULT
  - reference: PMID:17117437
    reference_title: Loss of Fgfr3 leads to excess hair cell development in the mouse organ of Corti.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the inner pillar cell never develops, while the outer pillar cell is stalled in its differentiation
    explanation: Distinguishes the two pillar-cell developmental abnormalities in null mice.
  downstream:
  - target: Sensorineural Hearing Loss
    description: Pillar/tunnel disruption causes mouse deafness and is a proposed substrate of human hearing loss.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Altered Cochlear Sensory Epithelial Patterning
  description: Fgfr3-null mice develop an additional row of outer hair cells and accompanying Deiters cells in the apical two thirds of the organ of Corti. FGFR3 therefore regulates sensory/supporting-cell patterning as well as pillar-cell differentiation. The relative contribution of each lesion to hearing loss has not been separated in human CATSHL.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  evidence:

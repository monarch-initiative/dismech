    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: we found an extra row of outer hair cells, and accompanying Deiters' cells, in the apical two thirds of the organ of Corti in the Fgfr3 mutant.
    explanation: Direct mouse cochlear patterning result.
  locations:

    fidelity: MODERATE
- name: Chondrocyte-specific postnatal Fgfr3 knockout mouse
  species: Mouse
  genotype: Fgfr3 floxed alleles with tamoxifen-inducible Col2a1-CreERT2
  publication: PMID:26091072
  description: >-
    Deletion induced after four weeks of age yields disorganized growth plates and multiple osteochondroma-/enchondroma-like lesions. Mosaic lesions contain mutant and unrecombined cells. Vismodegib suppresses lesion formation but also causes premature growth-plate fusion and shortened long bones.
  modeled_mechanisms:
  - target: Chondroma-like Lesion Formation
    relationship: PARTIALLY_RECAPITULATES

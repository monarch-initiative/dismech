- name: Slit Diaphragm Loss and Foot Process Effacement
  biological_scale: CELLULAR
  description: >-
    Podocin-null mice show extensive fusion of podocyte foot processes and no slit diaphragm in the remaining
    foot-process junctions, with downregulated nephrin expression. Knock-in mice carrying the mouse equivalent of
    p.Arg138Gln mislocate podocin and part of the nephrin pool to the cytoplasm and develop widespread foot-process
    effacement.

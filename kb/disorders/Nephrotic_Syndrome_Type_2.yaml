name: Nephrotic Syndrome Type 2
description: >-
  Autosomal recessive steroid-resistant nephrotic syndrome caused by biallelic pathogenic variants in NPHS2, which
  encodes podocin, a stomatin-family hairpin membrane protein of the podocyte slit diaphragm. Podocin oligomerizes in
  slit-diaphragm lipid rafts and recruits nephrin and CD2AP there; most missense alleles, including the common European
  p.Arg138Gln, misfold and are retained in the endoplasmic reticulum, so nephrin is not recruited into rafts. The
  slit diaphragm is lost, foot processes efface and the glomerular filtration barrier fails, giving nephrotic-range
  proteinuria with focal segmental glomerulosclerosis on biopsy. Onset is typically in early childhood, the nephrotic
  syndrome does not remit with glucocorticoids or second-line immunosuppression, and most patients progress to kidney
  failure. Because the defect is intrinsic to the podocyte, recurrence after kidney transplantation is very rare. The
  common p.Arg229Gln allele is pathogenic only in trans to particular 3' NPHS2 variants.
category: Mendelian

    reference_title: Patients with mutations in NPHS2 (podocin) do not respond to standard steroid treatment of nephrotic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous or compound heterozygous mutations in NPHS2 were detected for 43 of 165 SRNS families (26%).
      Conversely, no homozygous or compound heterozygous mutations in NPHS2 were observed for the 120 steroid-sensitive
      NS families.
    explanation: Biallelic NPHS2 variants occur in steroid-resistant and not in steroid-sensitive nephrotic syndrome.

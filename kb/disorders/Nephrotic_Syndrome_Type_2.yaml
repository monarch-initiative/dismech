  relationship_type: CAUSATIVE
  notes: >-
    Biallelic germline NPHS2 variants are the cause. Mutation detection was 43% in familial autosomal recessive SRNS
    and 10.5% in sporadic SRNS in a French series of 272 families.
  evidence:
  - reference: PMID:10742096
    reference_title: NPHS2, encoding the glomerular protein podocin, is mutated in autosomal recessive steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A causative gene for this disease, NPHS2, was mapped to 1q25-31 and we report here its identification by
      positional cloning.
    explanation: Identification of NPHS2 as the disease gene.
  - reference: PMID:15253708
    reference_title: NPHS2 mutation analysis shows genetic heterogeneity of steroid-resistant nephrotic syndrome and low post-transplant recurrence.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mutation detection rate was 43% for familial AR and 10.5% for sporadic SRNS, confirming genetic heterogeneity.
    explanation: NPHS2 diagnostic yield in familial and sporadic SRNS.
  variants:
  - name: c.413G>A p.Arg138Gln
    description: >-
      The most frequent podocin variant in European children. The protein misfolds and is retained in the ER through
      binding to keratin 8; it is associated with early onset.
    evidence:
    - reference: PMID:37995908
      reference_title: A small molecule chaperone rescues keratin-8 mediated trafficking of misfolded podocin to correct genetic Nephrotic Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        The most frequent podocin gene mutation in European children is R138Q, causing retention of the misfolded
        protein in the endoplasmic reticulum.
      explanation: Frequency of p.Arg138Gln in European children, stated as background in a laboratory study.
  - name: c.686G>A p.Arg229Gln
    description: >-
      A common allele that is pathogenic only in trans to particular 3' NPHS2 variants, which exert a dominant-negative
      effect on it through altered heterodimerization and mislocalization; with other alleles, or homozygous, it does not
      cause the disease. Transmission ratios in carrier couples therefore depart from plain recessive expectations.
    evidence:
    - reference: PMID:24509478
      reference_title: Mutation-dependent recessive inheritance of NPHS2-associated steroid-resistant nephrotic syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        this allele leads to a disease phenotype only when it is associated specifically with certain 3' NPHS2 mutations
        because of an altered heterodimerization and mislocalization of the encoded p.Arg229Gln podocin.
      explanation: Defines the mutation-dependent pathogenicity of p.Arg229Gln.
    - reference: PMID:23800802
      reference_title: "NPHS2 homozygous p.R229Q variant: potential modifier instead of causal effect in focal segmental glomerulosclerosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: This family provides further evidence that homozygous p.R229Q in itself may not cause FSGS.
      explanation: A family with two unaffected p.Arg229Gln homozygotes; homozygosity alone is not considered causal.
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK573219/
      reference_title: Genetic Steroid-Resistant Nephrotic Syndrome Overview - GeneReviews® - NCBI Bookshelf
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        the p.Arg229Gln ... variant, which has a ... frequency of 3% in the general multiethnic population, and
        carrier frequencies of 7% and 0.01% in Finnish and East Asian populations respectively.
      explanation: >-
        Population carrier frequency of p.Arg229Gln; the italicized gene symbol and a linked glossary word in the HTML
        are elided.
inheritance:
- name: Autosomal Recessive
  description: >-
    Autosomal recessive, with the exception of p.Arg229Gln, whose pathogenicity depends on the allele in trans.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:10742096
    reference_title: NPHS2, encoding the glomerular protein podocin, is mutated in autosomal recessive steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found ten different NPHS2 mutations, comprising nonsense, frameshift and missense mutations, to segregate with
      the disease, demonstrating a crucial role for podocin in the function of the glomerular filtration barrier.
    explanation: Recessive segregation in the families in which the gene was identified.
  - reference: PMID:24509478
    reference_title: Mutation-dependent recessive inheritance of NPHS2-associated steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we present an autosomal-recessive disorder, nephrotic syndrome type 2 (MIM 600995), in which the pathogenicity
      of an NPHS2 allele encoding p.Arg229Gln depends on the trans-associated mutation.
    explanation: Recessive inheritance with a mutation-dependent exception.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK573219/
    reference_title: Genetic Steroid-Resistant Nephrotic Syndrome Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an
      asymptomatic ... and a 25% chance of being unaffected and not a carrier.
    explanation: >-
      GeneReviews recurrence risk for autosomal recessive genetic SRNS; the linked glossary word in the HTML is elided.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Biallelic NPHS2 variants are identified with a multigene SRNS panel or exome sequencing; single-gene NPHS2 testing
    is reasonable when ancestry or a known familial variant points to it. Testing is advised at the start of the first
    steroid course, because a genetic diagnosis predicts steroid resistance and low post-transplant recurrence. A
    p.Arg229Gln finding is interpreted only together with the allele in trans.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK573219/
    reference_title: Genetic Steroid-Resistant Nephrotic Syndrome Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Molecular genetic testing ... can include a combination of ... targeted testing (single-gene testing or ... ) and
      comprehensive ... testing
    explanation: >-
      GeneReviews describes gene-targeted and comprehensive genomic testing for genetic SRNS; the linked terms in the
      HTML are elided.
  - reference: PMID:14978175
    reference_title: Patients with mutations in NPHS2 (podocin) do not respond to standard steroid treatment of nephrotic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it might be advisable to perform mutational analysis of NPHS2, if the patient consents, in parallel with the start
      of the first course of standard steroid therapy.
    explanation: Recommends NPHS2 testing at the first steroid course, from the cohort showing primary steroid resistance.
treatments:
- name: Kidney Transplantation
  description: >-
    Definitive treatment for kidney failure. Because the defect is intrinsic to the recipient's podocytes, nephrotic
    syndrome very rarely recurs in the graft: one recurrence among 117 transplanted patients with biallelic NPHS2
    variants, against 7 of 44 without an identified variant.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: kidney transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  evidence:
  - reference: PMID:38765578
    reference_title: Steroid-Resistant Nephrotic Syndrome due to NPHS2 Variants Is Not Associated With Posttransplant Recurrence.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only 1 patient with NPHS2-related SRNS experienced posttransplant recurrence (median follow-up of cohort 8.5 years
      [2.5-15]).
    explanation: Largest transplant cohort of biallelic NPHS2 patients.
  - reference: PMID:15253708
    reference_title: NPHS2 mutation analysis shows genetic heterogeneity of steroid-resistant nephrotic syndrome and low post-transplant recurrence.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 32 patients with two NPHS2 mutations who underwent kidney transplantation, only one developed late
      recurrence of focal segmental glomerulosclerosis (FSGS).
    explanation: Independent earlier series with the same finding.
- name: Renin-Angiotensin-Aldosterone System Inhibition
  description: >-
    Recommended in genetic SRNS to reduce proteinuria, in place of continued immunosuppression. The recommendation covers
    genetic SRNS as a whole and is not based on an NPHS2-specific trial.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: renin-angiotensin-aldosterone system inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: angiotensin-converting enzyme inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: angiotensin receptor blocker
      term:
        id: NCIT:C66930
        label: Angiotensin II Receptor Antagonist
  target_mechanisms:
  - target: Glomerular Filtration Barrier Failure
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK573219/
    reference_title: Genetic Steroid-Resistant Nephrotic Syndrome Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Instead affected individuals should be treated with renin-angiotensin-aldosterone system inhibitors (RAASi) to
      reduce proteinuria.
    explanation: GeneReviews management recommendation for genetic SRNS.
- name: Glucocorticoid and Second-Line Immunosuppression
  description: >-
    Not effective. Patients with biallelic NPHS2 variants show primary steroid resistance and no complete remission on
    cyclosporine A or cyclophosphamide, so a genetic diagnosis is used to stop ineffective immunosuppression.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: systemic corticosteroid therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
    - preferred_term: cyclosporine A
      term:
        id: CHEBI:4031
        label: cyclosporin A
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4027
        label: cyclophosphamide
  evidence:
  - reference: PMID:14978175
    reference_title: Patients with mutations in NPHS2 (podocin) do not respond to standard steroid treatment of nephrotic syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It was concluded that patients with SRNS with homozygous or compound heterozygous mutations in NPHS2 do not
      respond to standard steroid treatment and have a reduced risk for recurrence of FSGS in a renal transplant.
    explanation: Refutes efficacy of glucocorticoids in biallelic NPHS2 disease.
  - reference: PMID:14978175
    reference_title: Patients with mutations in NPHS2 (podocin) do not respond to standard steroid treatment of nephrotic syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of 29 patients with homozygous or compound heterozygous mutations in NPHS2 who were treated with
      cyclosporine A or cyclophosphamide demonstrated complete remission of NS.
    explanation: Refutes efficacy of second-line immunosuppression.
- name: AAV Podocin Gene Replacement (preclinical)
  description: >-
    Experimental. AAV2/9 delivery of wild-type podocin ameliorated kidney disease in inducible knockout and knock-in
    mice, including when given two weeks after disease induction; AAV-LK03 rescued patient podocytes in vitro. No human
    data.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic NPHS2 Loss of Function
  evidence:
  - reference: PMID:37556557
    reference_title: Adeno-associated virus gene therapy prevents progression of kidney disease in genetic models of nephrotic syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: AAV-LK03-mediated transduction of podocin in mutant human podocytes resulted in functional rescue in vitro
    explanation: Rescue of mutant human podocytes in culture.
  - reference: PMID:37556557
    reference_title: Adeno-associated virus gene therapy prevents progression of kidney disease in genetic models of nephrotic syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      AAV 2/9-mediated gene transfer in both the inducible podocin knockout and knock-in mouse models resulted in
      successful amelioration of kidney disease.
    explanation: Rescue in inducible knockout and knock-in mouse models.
- name: Keratin-8 Disrupting Chaperone c407 (preclinical)
  description: >-
    Experimental. The small molecule c407 disrupts the keratin 8-podocin p.Arg138Gln complex, restores podocin to the
    plasma membrane in patient podocytes and rescued proteinuria in an inducible knock-in mouse. Specific to misfolded
    alleles; no human data.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Podocin Misfolding and Endoplasmic Reticulum Retention
  evidence:
  - reference: PMID:37995908
    reference_title: A small molecule chaperone rescues keratin-8 mediated trafficking of misfolded podocin to correct genetic Nephrotic Syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      complete rescue of proteinuria and histological changes was seen when c407 was administered both via osmotic
      minipumps or delivered orally prior to induction of disease or crucially via osmotic minipump two weeks after
      disease induction.
    explanation: Preclinical rescue in the p.Arg138Gln knock-in mouse.
animal_models:
- name: Nphs2 null mouse
  species: Mouse
  genotype: Nphs2(-/-)
  publication: PMID:14701729
  description: >-
    Constitutive podocin knockout. Antenatal proteinuria, loss of the slit diaphragm and death a few days after birth
    from renal failure with massive mesangial sclerosis; severity depends on genetic background.
  modeled_mechanisms:
  - target: Slit Diaphragm Loss and Foot Process Effacement
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Complete null with perinatal death; the histology is mesangial sclerosis rather than the FSGS typical of patients,
      and the course is far faster than in most patients.
    evidence:
    - reference: PMID:14701729
      reference_title: Early glomerular filtration defect and severe renal disease in podocin-deficient mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Electron microscopy revealed the extensive fusion of podocyte foot processes and the lack of a slit diaphragm in
        the remaining foot process junctions.
      explanation: Reproduces slit-diaphragm loss and effacement.
- name: Nphs2 p.Arg140Gln knock-in mouse
  species: Mouse
  genotype: Nphs2 R140Q/R140Q (equivalent of human p.Arg138Gln)
  publication: PMID:18288100
  description: >-
    Mislocalized mutant podocin and nephrin, early albuminuria, widespread foot-process effacement and death within the
    first month; survival depends on genetic background.
  modeled_mechanisms:
  - target: Podocin Misfolding and Endoplasmic Reticulum Retention
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    limitations: >-
      The disease is earlier and more severe than in most p.Arg138Gln patients, and depends on mouse strain.
    evidence:
    - reference: PMID:18288100
      reference_title: A missense mutation in podocin leads to early and severe renal disease in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Homozygous mice express the mutant protein, which is mislocated to the cytoplasm, along with a portion of the
        nephrin pool.
      explanation: The knock-in reproduces mislocalization of the mutant protein and nephrin.
- name: Adult inducible podocyte-specific Nphs2 knockout mouse
  species: Mouse
  genotype: Podocyte-specific Cre-loxP Nphs2 deletion in the mature kidney
  publication: PMID:19713307
  description: >-
    Progressive podocin loss after kidney maturation produces albuminuria, hypercholesterolemia, hypertension, renal
    failure and FSGS at four weeks, followed by diffuse glomerulosclerosis.
  modeled_mechanisms:
  - target: Progressive Glomerulosclerosis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    limitations: >-
      Induced near-complete loss of podocin in an adult kidney, not a patient allele present from development.
    evidence:
    - reference: PMID:19713307
      reference_title: Podocin inactivation in mature kidneys causes focal segmental glomerulosclerosis and nephrotic syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Lesions of FSGS appeared after 4 wk, with subsequent development of diffuse glomerulosclerosis and
        tubulointerstitial damage.
      explanation: Reproduces the FSGS lesion and its progression.
experimental_models:
- name: NPHS2 allelic-series iPSC kidney organoids
  experimental_model_type: ORGANOID
  description: >-
    Human iPSC lines carrying p.Gly92Cys, p.Pro118Leu, p.Arg138Gln, p.Arg168His or p.Arg291Trp at the endogenous locus,
    plus a patient-derived p.Arg168His homozygous line, differentiated into kidney organoids.
  publication: PMID:36167728
  modeled_mechanisms:
  - target: Podocin Misfolding and Endoplasmic Reticulum Retention
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    limitations: >-
      Organoid podocytes are immature and the organoids are not perfused, so the filtration barrier and the progression
      to sclerosis cannot be studied.
    evidence:
    - reference: PMID:36167728
      reference_title: Kidney Organoids Generated Using an Allelic Series of NPHS2 Point Variants Reveal Distinct Intracellular Podocin Mistrafficking.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        P118L and R138Q were preferentially retained in the endoplasmic reticulum (ER); R168H and R291W accumulated in
        the Golgi.
      explanation: Allele-specific mistrafficking in human podocytes at endogenous expression.

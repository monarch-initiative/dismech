      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        disease-causing mutations of podocin (R138Q and R138X) failed to recruit nephrin into rafts either because these
        mutants were retained in the endoplasmic reticulum (R138Q), or because they failed to associate with rafts (R138X)
        despite their presence in the plasma membrane.
      explanation: Shows the ER-retained mutant cannot recruit nephrin; the truncating allele fails at the raft step instead.
- name: Failure of Nephrin Recruitment to Slit Diaphragm Lipid Rafts
  biological_scale: CELLULAR
  description: >-
    Wild-type podocin sits at the insertion of the slit diaphragm in the foot-process membrane, forms high-order
    oligomers in lipid rafts and binds CD2AP and nephrin through its C-terminal domain. Raft association of podocin is a
    prerequisite for recruiting nephrin into rafts, which facilitates nephrin signalling. Mutant podocin fails to do
    this, either by not reaching the membrane or by failing to associate with rafts.
  cell_types:

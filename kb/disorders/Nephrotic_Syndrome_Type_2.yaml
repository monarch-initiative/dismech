- name: Podocin Misfolding and Endoplasmic Reticulum Retention
  biological_scale: CELLULAR
  description: >-
    Mutant podocin is retained in the endoplasmic reticulum (p.Arg138Gln, p.Pro118Leu) or Golgi (p.Arg168His,
    p.Arg291Trp) and is present at reduced protein levels without reduced transcription. In iPSC-derived kidney
    organoids this mistrafficking is allele-specific, and all tested variants caused podocyte apoptosis that was not
    linked to ER stress. Earlier-onset disease is associated with alleles retained in the ER. Misfolded p.Arg138Gln
    podocin is held back by binding keratin 8.
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  biological_processes:
  - preferred_term: protein localization to plasma membrane
    modifier: DECREASED
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
  evidence:
  - reference: PMID:14675423
    reference_title: "Plasma membrane targeting of podocin through the classical exocytic pathway: effect of NPHS2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we found that podocin mutants retained in the endoplasmic reticulum are associated with earlier onset of the
      disease than those correctly targeted to the cell membrane.
    explanation: Patient-database genotype-phenotype correlation linking ER retention to earlier onset.
  - reference: PMID:36167728
    reference_title: Kidney Organoids Generated Using an Allelic Series of NPHS2 Point Variants Reveal Distinct Intracellular Podocin Mistrafficking.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      P118L and R138Q were preferentially retained in the endoplasmic reticulum (ER); R168H and R291W accumulated in the
      Golgi.
    explanation: Endogenous-locus variants in human iPSC kidney organoid podocytes show allele-specific mislocalization.
  - reference: PMID:36167728
    reference_title: Kidney Organoids Generated Using an Allelic Series of NPHS2 Point Variants Reveal Distinct Intracellular Podocin Mistrafficking.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: All variants displayed podocyte-specific apoptosis, which was not linked to ER stress.
    explanation: Organoid podocytes carrying every tested variant underwent apoptosis without ER stress.
  - reference: PMID:37995908
    reference_title: A small molecule chaperone rescues keratin-8 mediated trafficking of misfolded podocin to correct genetic Nephrotic Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      podocin R138Q (but not wild-type podocin) complexes with the intermediate filament protein keratin 8 (K8) thereby
      preventing its correct trafficking to the plasma membrane.
    explanation: Identifies keratin 8 binding as the mechanism holding misfolded p.Arg138Gln podocin back.

    explanation: Localizes podocin to slit-diaphragm lipid rafts in rodent glomeruli.
  - reference: PMID:14570703
    reference_title: "Molecular basis of the functional podocin-nephrin complex: mutations in the NPHS2 gene disrupt nephrin targeting to lipid raft microdomains."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-

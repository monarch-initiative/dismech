    explanation: Positional-cloning study establishing biallelic NPHS2 variants as the cause.
  - reference: PMID:10742096
    reference_title: NPHS2, encoding the glomerular protein podocin, is mutated in autosomal recessive steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NPHS2 is almost exclusively expressed in the podocytes of fetal and mature kidney glomeruli, and encodes a new
      integral membrane protein, podocin, belonging to the stomatin protein family.
    explanation: Podocyte-restricted expression places the primary lesion in the podocyte.
  - reference: PMID:17079490
    reference_title: Podocin and MEC-2 bind cholesterol to regulate the activity of associated ion channels.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      By binding to MEC-2 and Podocin, cholesterol associates with ion-channel complexes to which these proteins bind:
      DEG/ENaC channels for MEC-2 and TRPC channels for Podocin.
    explanation: Establishes cholesterol binding as podocin's molecular function and links it to TRPC channel complexes.

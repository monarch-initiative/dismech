notes: >-
  No NPHS2-specific incidence or prevalence has been published. In cohorts of steroid-resistant nephrotic syndrome,
  biallelic NPHS2 variants were found in 43 of 165 families (26%) in one series, and in 43% of familial and 10.5% of
  sporadic cases in another; those are shares of a genetically heterogeneous referral population, not population
  frequencies, so no prevalence record is given. There is no NPHS2-specific GeneReviews chapter; the genetic SRNS
  overview (PMID:34436835) covers it.
pathophysiology:
- name: Biallelic NPHS2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous NPHS2 variants (nonsense, frameshift and missense) segregate with the disease.
    NPHS2 is expressed almost exclusively in glomerular podocytes. The p.Arg229Gln allele is an exception to plain
    recessive behaviour and is described under genetic. Podocin is a PHB-domain protein that binds cholesterol at the
    inner leaflet of the plasma membrane and, through it, regulates associated TRPC channel complexes; loss of
    functional podocin at the membrane removes that activity. Whether individual missense alleles abolish cholesterol
    binding itself has not been tested; the DECREASED modifier is inferred from the absence of functional podocin at
    the membrane, not measured.
  molecular_functions:

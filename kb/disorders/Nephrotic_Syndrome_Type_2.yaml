  name: Steroid-Resistant Nephrotic Syndrome
  description: >-
    Nephrotic syndrome that does not remit with standard glucocorticoid treatment. In one series no patient with
    biallelic NPHS2 variants treated with cyclosporine A or cyclophosphamide reached complete remission. Its components
    are proteinuria, hypoalbuminemia, edema and hyperlipidemia.

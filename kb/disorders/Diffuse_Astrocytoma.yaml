    term:
      id: UBERON:0000955
      label: brain
  downstream:
  - target: Seizures
    description: Diffuse cortical and subcortical infiltration can irritate neuronal circuits and cause seizures.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - cortical circuit irritation
  - target: Headache
    description: Tumor infiltration and mass effect can raise intracranial pressure and cause headache.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:

    explanation: >-
      Summarizes the T2-FLAIR mismatch sign and 1H-MR spectroscopy for
      2-hydroxyglutarate in imaging differentiation of IDH-mutant astrocytoma.
- name: IDH1 R132H, ATRX, and Histone H3 Immunohistochemistry
  description: >-

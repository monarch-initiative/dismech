    quote_role: REVIEW_SYNTHESIS
    snippet: "In the CATNON trial 89 , the combination of maintenance temozolomide with radiotherapy prolonged survival only in patients with IDH-mutant gliomas of WHO grade 3 and not in those with tumours diagnosed as IDH-wild-type anaplastic gliomas."
    explanation: >-
      EANO guidelines summarize phase 3 CATNON evidence that adjuvant
      temozolomide prolongs survival in WHO grade 3 IDH-mutant astrocytomas.
  - reference: PMID:15758010
    reference_title: "MGMT gene silencing and benefit from temozolomide in glioblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with glioblastoma containing a methylated MGMT promoter benefited from temozolomide, whereas those who did not have a methylated MGMT promoter did not have such a benefit."
    explanation: >-
      Supports MGMT promoter methylation as a predictive biomarker for
      temozolomide benefit in astrocytic gliomas.
- name: Vorasidenib (Mutant-IDH Inhibitor)
  description: >-
    Brain-penetrant dual mutant IDH1/IDH2 inhibitor approved for residual or
    recurrent grade 2 IDH-mutant gliomas after the INDIGO trial demonstrated
    significant progression-free survival improvement. Targets the IDH-mutant
    subtype specifically.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

- name: Malignant Progression via CDKN2A/B Deletion
  biological_scale: MOLECULAR
  conforms_to: evading_growth_suppressors#Loss of Cell-Cycle Checkpoint Control
  genetic_context:
    variant_origin: SOMATIC
  description: >-
    Acquired homozygous deletion of CDKN2A/CDKN2B at 9p21 abolishes
    cyclin-dependent kinase inhibitor (p16INK4A/p15INK4B) and p14ARF
    cell-cycle checkpoint restraint along the RB1 and TP53 pathways, bypassing
    cellular senescence and driving malignant progression to high-grade (WHO
    grade 4) IDH-mutant diffuse astrocytoma.

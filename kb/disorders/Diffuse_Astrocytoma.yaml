treatments:
- name: Maximal Safe Resection
  description: >-
    Surgical resection maximising extent of resection while preserving
    neurological function. Greater extent of resection is associated with
    improved progression-free and overall survival across diffuse astrocytoma
    subtypes; however, complete resection is rarely achievable because of the
    infiltrative growth pattern.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Gross Total Resection
    term:
      id: NCIT:C131672
      label: Gross Total Resection
  target_mechanisms:
  - target: Diffuse Parenchymal Infiltration
    treatment_effect: INHIBITS
    description: >-
      Maximal safe neurosurgical cytoreduction removes accessible infiltrative
      tumour bulk while preserving eloquent brain function.
    evidence:
    - reference: PMID:42430039
      reference_title: "Current Treatment Options for Adult Grade 2 IDH-mutant Diffuse Gliomas in the Vorasidenib Era: Patient Selection, Sequencing, and Practical Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "We believe treatment should begin with maximal safe resection, integrated molecular diagnosis, and a careful assessment of residual non-enhancing disease, growth kinetics, symptoms, seizure burden, neurocognitive priorities, fertility goals, and patient preference."
      explanation: >-
        Establishes maximal safe surgical resection as initial cytoreductive
        management for diffuse astrocytoma.
  evidence:
  - reference: PMID:42430039
    reference_title: "Current Treatment Options for Adult Grade 2 IDH-mutant Diffuse Gliomas in the Vorasidenib Era: Patient Selection, Sequencing, and Practical Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "We believe treatment should begin with maximal safe resection, integrated molecular diagnosis, and a careful assessment of residual non-enhancing disease, growth kinetics, symptoms, seizure burden, neurocognitive priorities, fertility goals, and patient preference."
    explanation: >-
      Supports maximal safe surgical resection as upfront therapy and tissue
      acquisition in diffuse astrocytoma.
- name: Radiation Therapy
  description: >-
    External beam radiation therapy is standard adjuvant treatment for higher
    grade or high-risk diffuse astrocytomas. In paediatric DMG H3 K27-altered,
    radiation provides only transient palliative benefit.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  target_mechanisms:
  - target: Diffuse Parenchymal Infiltration
    treatment_effect: INHIBITS
    description: >-
      External-beam radiotherapy induces DNA double-strand breaks in residual
      infiltrative astrocytoma cells that cannot be surgically resected.
    evidence:
    - reference: PMID:42430039
      reference_title: "Current Treatment Options for Adult Grade 2 IDH-mutant Diffuse Gliomas in the Vorasidenib Era: Patient Selection, Sequencing, and Practical Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Radiotherapy followed by PCV, or selected temozolomide-based approaches when PCV is not feasible, remains appropriate for rapid growth, symptomatic mass effect, new or nodular enhancement, neurological decline, uncontrolled seizures, high-risk molecular pathology such as CDKN2A/B homozygous deletion, or suspected grade transformation."
      explanation: >-
        Supports adjuvant radiotherapy (with alkylating chemotherapy) for
        high-risk or progressive infiltrative diffuse astrocytoma.
  evidence:
  - reference: PMID:42430039
    reference_title: "Current Treatment Options for Adult Grade 2 IDH-mutant Diffuse Gliomas in the Vorasidenib Era: Patient Selection, Sequencing, and Practical Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Radiotherapy followed by PCV, or selected temozolomide-based approaches when PCV is not feasible, remains appropriate for rapid growth, symptomatic mass effect, new or nodular enhancement, neurological decline, uncontrolled seizures, high-risk molecular pathology such as CDKN2A/B homozygous deletion, or suspected grade transformation."
    explanation: >-
      Confirms radiotherapy followed by alkylating chemotherapy as standard
      treatment for high-risk or transforming diffuse astrocytomas.
- name: Temozolomide Chemotherapy
  description: >-
    Oral alkylating chemotherapy used adjuvantly and at recurrence. MGMT
    promoter methylation predicts response and is enriched in IDH-mutant
    astrocytomas via the G-CIMP background.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632

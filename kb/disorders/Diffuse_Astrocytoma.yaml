      quote_role: BACKGROUND
      snippet: "In a peri-operative trial, vorasidenib showed >90% reduction in the concentration of the oncometabolite, 2-hydroxyglutarate, in resected tumor, which was associated with reversed gene expression and epigenetic changes typically associated with IDH mutation in glioma."
      explanation: >-
        Demonstrates direct on-target suppression of mutant-IDH 2-HG production
        in human glioma tissue.
  evidence:

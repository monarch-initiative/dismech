    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Brain MRI, including T2-weighted, T2-weighted fluid-attenuated inversion recovery (FLAIR) sequences and 3D T1-weighted sequences before and after application of a gadolinium-based contrast agent, is the diagnostic gold standard to detect a brain tumour"

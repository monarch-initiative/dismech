phenotypes:
- category: Hematological
  name: Microcytic Hypochromic Anemia
  description: >
    Severe anemia with reduced MCV and MCH due to deficient hemoglobin
    synthesis. Hemoglobin levels can fall to 3-7 g/dL in untreated
    beta-thalassemia major.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: hypochromic microcytic anemia
    term:
      id: HP:0004840
      label: Hypochromic microcytic anemia
  evidence:
  - reference: PMID:20492708
    reference_title: "Beta-thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with thalassemia major usually present within the first two years of life with severe anemia, requiring regular red blood cell (RBC) transfusions."
    explanation: Confirms severe anemia as the defining presentation of thalassemia major.
- category: Hematological
  name: Decreased Mean Corpuscular Volume
  description: >
    MCV typically 55-75 fL in beta-thalassemia trait and even lower
    in thalassemia major.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: decreased mean corpuscular volume
    term:
      id: HP:0025066
      label: Decreased mean corpuscular volume
  evidence:
  - reference: PMID:20301599
    reference_title: "Beta-Thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of β-thalassemia is established in a proband older than age 12 months by identification of microcytic hypochromic anemia, absence of iron deficiency, anisopoikilocytosis with nucleated red blood cells on peripheral blood smear, and decreased or complete absence of hemoglobin A (HbA) and increased hemoglobin A2 (HbA2) and often hemoglobin F (HbF) on hemoglobin analysis."
    explanation: Microcytic hypochromic anemia reflects decreased mean corpuscular volume on red blood cell indices.
- category: Hematological
  name: Reticulocytosis
  description: >
    Elevated reticulocyte count reflecting compensatory erythropoietic
    drive, though inappropriately low relative to degree of anemia
    due to ineffective erythropoiesis.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: reticulocytosis
    term:
      id: HP:0001923
      label: Reticulocytosis
  notes: >-
    Left without evidence. The cached references this entry cites were searched
    for "reticulocytosis" and "reticulocyte count"; the only hits describe
    Hbbth3/+ and Hbbth1/th1 mouse models (DOI:10.1182/bloodadvances.2023012010,
    PMID:22631035), not patients. PMID:15163316 measured HbF in reticulocytes
    but does not report a raised count. As the description says, ineffective
    erythropoiesis keeps reticulocyte output low relative to the anemia, so a
    human source stating the count should be found before this phenotype is
    evidenced.
- category: Hematological
  name: Erythroid Hyperplasia
  description: >
    Massively expanded erythroid compartment in bone marrow (erythroid
    to myeloid ratio may exceed 1:1) as a compensatory response.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: erythroid hyperplasia
    term:
      id: HP:0012132
      label: Erythroid hyperplasia
  evidence:
  - reference: PMID:20492708
    reference_title: "Beta-thalassemia."

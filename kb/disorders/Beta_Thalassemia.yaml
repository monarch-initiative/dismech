genetic:
- name: HBB
  gene_term:
    preferred_term: HBB
    term:
      id: hgnc:4827
      label: HBB
  association: Causative
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:20492708
      reference_title: "Beta-thalassemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Transmission is autosomal recessive; however, dominant mutations have also been reported."
      explanation: Confirms autosomal recessive inheritance of HBB-related beta-thalassemia.
  notes: >
    Over 300 mutations in the HBB gene cause beta-thalassemia.
    Beta-zero mutations (e.g., codon 39 C>T, IVS-I-1 G>A) abolish
    beta-globin production. Beta-plus mutations (e.g., IVS-I-110 G>A,
    -28 A>G) reduce production.
  evidence:
  - reference: PMID:20492708
    reference_title: "Beta-thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Beta-thalassemias are caused by point mutations or, more rarely, deletions in the beta globin gene on chromosome 11, leading to reduced (beta+) or absent (beta0) synthesis of the beta chains of hemoglobin (Hb). Transmission is autosomal recessive"
    explanation: Confirms HBB mutations cause beta-thalassemia with autosomal recessive inheritance.
- name: BCL11A
  gene_term:
    preferred_term: BCL11A
    term:
      id: hgnc:13221
      label: BCL11A
  association: Modifier
  relationship_type: MODIFIER
  notes: >
    Genetic variants in BCL11A modulate HbF levels and disease severity.
    BCL11A is the major silencer of gamma-globin expression in adult
    erythroid cells.
  evidence:
  - reference: PMID:18691915
    reference_title: "BCL11A is a major HbF quantitative trait locus in three different populations with beta-hemoglobinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we showed that SNPs in BCL11A were associated with F-cell numbers in Chinese with beta-thalassemia trait, and with HbF levels in Thais with either beta-thalassemia or HbE trait and in African Americans with sickle cell anemia."
    explanation: Supports BCL11A as an HbF modifier in beta-thalassemia populations.
- name: KLF1
  gene_term:
    preferred_term: KLF1
    term:
      id: hgnc:6345
      label: KLF1
  association: Modifier
  relationship_type: MODIFIER
  notes: >
    KLF1 (EKLF) mutations can increase HbF levels by reducing BCL11A
    expression. KLF1 haploinsufficiency ameliorates beta-thalassemia
    severity.
  evidence:
  - reference: PMID:28651846
    reference_title: "Molecular basis of β thalassemia and potential therapeutic targets."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Linkage studies identified a locus on chromosome 19p13 which encompassed KLF1 and expression profiling of erythroid progenitor cells confirmed KLF1 as the γ-globin gene modifier in this family."
    explanation: In a Maltese family with beta-thalassemia and HPFH, KLF1 was identified as the gamma-globin (HbF) modifier, supporting KLF1 as a beta-thalassemia modifier gene.
- name: HBS1L-MYB
  gene_term:
    preferred_term: MYB
    term:
      id: hgnc:7545
      label: MYB
  association: Modifier
  relationship_type: MODIFIER
  notes: >
    Variants in the HBS1L-MYB intergenic region on chromosome 6q23
    are the second major GWAS locus for HbF levels.
  evidence:
  - reference: PMID:18667698
    reference_title: "DNA polymorphisms at the BCL11A, HBS1L-MYB, and beta-globin loci associate with fetal hemoglobin levels and pain crises in sickle cell disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common single nucleotide polymorphisms (SNPs) at the BCL11A and HBS1L-MYB loci have been implicated previously in HbF level variation in nonanemic European populations."
    explanation: Supports the HBS1L-MYB locus as a major genetic modifier of HbF levels.
treatments:
- name: Regular Red Blood Cell Transfusions
  description: >
    Mainstay of treatment for beta-thalassemia major. Regular
    transfusions maintain hemoglobin above 9-10 g/dL, suppressing
    ineffective erythropoiesis, preventing skeletal deformities,
    and allowing normal growth.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: blood transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  target_mechanisms:
  - target: Ineffective Erythropoiesis
    treatment_effect: INHIBITS
    description: Maintaining hemoglobin by transfusion suppresses erythropoietic drive.
  evidence:
  - reference: PMID:20301599
    reference_title: "Beta-Thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with regular red blood cell transfusions and iron chelation therapy allows for normal growth and development and improves prognosis."
    explanation: Confirms regular red blood cell transfusions as core supportive management for beta-thalassemia major.
  - reference: DOI:10.3390/thalassrep14040010
    reference_title: "Thalassemia: Pathophysiology, Diagnosis, and Advances in Treatment"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Current management strategies encompass regular blood transfusions, the use of hydroxyurea to improve hemoglobin levels, and iron chelation therapy to prevent iron-related organ damage."
    explanation: Review lists regular transfusion as a core management strategy; the suppression of erythropoietic drive is the entry's own mechanistic reading.
- name: Iron Chelation Therapy
  description: >
    Essential to prevent iron overload from chronic transfusions.
    Agents include deferoxamine (subcutaneous/IV), deferasirox (oral),
    and deferiprone (oral). Cardiac T2* MRI guides chelation intensity.
    GeneReviews lists iron-containing preparations, and alcohol where there
    is a history of liver damage, among the agents to avoid.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: iron chelation therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Iron Overload
    treatment_effect: INHIBITS
    description: Chelators remove excess iron accumulated from transfusion and increased absorption.
  evidence:
  - reference: PMID:20301599
    reference_title: "Beta-Thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supportive care: For β-thalassemia major, regular red blood cell transfusions with iron chelation therapy (e.g., deferoxamine B, deferiprone, deferasirox)."
    explanation: Confirms iron chelation with deferoxamine, deferiprone, or deferasirox as standard management for iron overload.
  - reference: DOI:10.3390/thalassrep13030017
    reference_title: "Understanding the Intricacies of Iron Overload Associated with β-Thalassemia: A Comprehensive Review"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Addressing the diverse complications that arise due to iron overload in β-thalassemic patients, the utilization of iron chelators has gained a lot of significance."
    explanation: Review frames iron chelators as the response to iron overload complications in beta-thalassemia.
  - reference: PMID:20301599
    reference_title: "Beta-Thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Alcohol consumption if there is history of liver damage, iron-containing preparations, and exposure to infection."
    explanation: GeneReviews advises avoiding iron-containing preparations, which would add to the iron load that chelation removes, and alcohol where the liver is damaged.
- name: Hydroxyurea
  description: >
    Induces fetal hemoglobin production, beneficial in beta-thalassemia
    intermedia and as adjunct in thalassemia major to reduce transfusion
    requirements.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxyurea
      term:
        id: CHEBI:44423
        label: hydroxyurea
  target_mechanisms:
  - target: Fetal Hemoglobin Modulation
    treatment_effect: ACTIVATES
    description: Hydroxyurea induces fetal hemoglobin production.
    evidence:
    - reference: PMID:20301599
      reference_title: Beta-Thalassemia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Some individuals can benefit from HbF induction with hydroxyurea."
      explanation: GeneReviews states that HbF induction with hydroxyurea benefits some individuals, which is the mechanism this link asserts.
- name: Splenectomy
  description: >
    Considered when hypersplenism increases transfusion requirements.
    Carries risk of post-splenectomy sepsis and thrombosis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Chronic Hemolysis
    treatment_effect: INHIBITS
    description: Reduces splenic sequestration and destruction of abnormal erythrocytes.
  evidence:
  - reference: PMID:20492708
    reference_title: "Beta-thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with thalassemia intermedia may require splenectomy, folic acid supplementation, treatment of extramedullary erythropoietic masses and leg ulcers, prevention and therapy of thromboembolic events."
    explanation: Confirms splenectomy as a surgical intervention in beta-thalassemia.
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >
    Only established curative therapy. Best outcomes in young patients
    with HLA-matched sibling donors. Pesaro classification guides
    risk stratification.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Defective Beta-Globin Synthesis
    treatment_effect: RESTORES
    description: Replaces defective erythroid progenitors with donor hematopoietic stem cells producing normal beta-globin.
  evidence:
  - reference: PMID:20301599
    reference_title: "Beta-Thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted therapies: For β-thalassemia major, hematopoietic stem cell transplantation (HSCT), cord blood transplantation from a related donor, or autologous HSCT with gene therapy."
    explanation: Confirms allogeneic hematopoietic stem cell transplantation as a curative targeted therapy for beta-thalassemia major.
- name: Luspatercept
  description: >
    Recombinant fusion protein that promotes late-stage erythropoiesis
    by trapping TGF-beta superfamily ligands. Reduces transfusion
    burden in transfusion-dependent beta-thalassemia.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: luspatercept
      term:
        id: NCIT:C104012
        label: Luspatercept
  target_mechanisms:
  - target: Ineffective Erythropoiesis
    treatment_effect: INHIBITS
    description: Trapping TGF-beta superfamily ligands promotes late-stage erythroid maturation.
  evidence:
  - reference: PMID:32212518
    reference_title: "A Phase 3 Trial of Luspatercept in Patients with Transfusion-Dependent β-Thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The percentage of patients who had a reduction in the transfusion burden of at least 33% from baseline during weeks 13 through 24 plus a reduction of at least 2 red-cell units over this 12-week interval was significantly greater in the luspatercept group than in the placebo group (21.4% vs. 4.5%, P<0.001)."
    explanation: BELIEVE trial demonstrates luspatercept significantly reduces transfusion burden in transfusion-dependent beta-thalassemia.
- name: Mitapivat
  description: >
    Oral small-molecule activator of red-cell pyruvate kinase. GeneReviews
    lists it, with luspatercept, as a way to reduce transfusion requirements
    in beta-thalassemia major and to ameliorate anemia in beta-thalassemia
    intermedia, with variable efficacy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mitapivat
      term:
        id: NCIT:C157039
        label: Mitapivat
  evidence:
  - reference: PMID:20301599
    reference_title: "Beta-Thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transfusion requirements may be reduced with the use of luspatercept or mitapivat."
    explanation: GeneReviews names mitapivat as a transfusion-reducing therapy in beta-thalassemia major.
  - reference: PMID:20301599
    reference_title: "Beta-Thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitapivat or luspatercept may also be used to ameliorate anemia with variable efficacy."
    explanation: GeneReviews names mitapivat for anemia in beta-thalassemia intermedia, with variable efficacy.
- name: Gene Therapy (Betibeglogene Autotemcel)
  description: >
    Approved lentiviral gene therapy that adds functional copies of
    modified beta-globin gene to autologous hematopoietic stem cells.
    Can achieve transfusion independence in most patients.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Defective Beta-Globin Synthesis
    treatment_effect: BYPASSES
    description: Adds a functional beta-globin transgene to autologous stem cells; it does not correct the endogenous HBB lesion.
  evidence:
  - reference: PMID:34891223
    reference_title: "Betibeglogene Autotemcel Gene Therapy for Non-β(0)/β(0) Genotype β-Thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transfusion independence occurred in 20 of 22 patients who could be evaluated (91%), including 6 of 7 patients (86%) who were younger than 12 years of age."
    explanation: Northstar-2 phase 3 trial demonstrates betibeglogene autotemcel achieves transfusion independence in 91% of evaluable patients.
- name: Genetic Counseling
  description: >
    Carrier screening and genetic counseling for at-risk populations.
    Prenatal diagnosis available via chorionic villus sampling.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20492708
    reference_title: "Beta-thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic counseling is recommended and prenatal diagnosis may be offered."
    explanation: Confirms genetic counseling and prenatal diagnosis as standard management for at-risk individuals and families.
  - reference: PMID:20301599
    reference_title: "Beta-Thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If both parents are known to be heterozygous for an HBB pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being a (typically) asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: The recurrence risks that genetic counseling conveys to carrier parents.

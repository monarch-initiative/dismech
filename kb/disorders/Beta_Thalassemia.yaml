diagnosis:
- name: Hematologic and Hemoglobin Analysis
  description: >-
    Complete blood count, peripheral blood smear, and quantitative hemoglobin
    analysis (HPLC or electrophoresis) demonstrating microcytic hypochromic
    anemia, anisopoikilocytosis with nucleated red blood cells, reduced or
    absent HbA, and elevated HbA2 and HbF.
  diagnosis_term:
    preferred_term: hematology test
    term:
      id: NCIT:C49286
      label: Hematology Test
  evidence:
  - reference: PMID:20301599
    reference_title: "Beta-Thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of β-thalassemia is established in a proband older than age 12 months by identification of microcytic hypochromic anemia, absence of iron deficiency, anisopoikilocytosis with nucleated red blood cells on peripheral blood smear, and decreased or complete absence of hemoglobin A (HbA) and increased hemoglobin A2 (HbA2) and often hemoglobin F (HbF) on hemoglobin analysis."
    explanation: Establishes hematologic indices, peripheral smear, and hemoglobin analysis as the primary diagnostic workup.
- name: HBB Molecular Genetic Testing
  description: >-
    Targeted variant analysis or sequence and deletion/duplication analysis of
    HBB to identify biallelic (or rarely dominant) pathogenic variants.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301599
    reference_title: "Beta-Thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of biallelic pathogenic variants in HBB on molecular genetic testing can establish the diagnosis in individuals younger than age 12 months who have a positive or suggestive newborn screening result and/or unexplained microcytic hypochromic anemia with anisopoikilocytosis and nucleated red blood cells on peripheral blood smear."
    explanation: Confirms molecular genetic testing of HBB for definitive diagnosis.
biochemical:
- name: Hemoglobin
  presence: Decreased
  context: Hemoglobin 3-7 g/dL in untreated thalassemia major
  readouts:
  - target: Ineffective Erythropoiesis
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: MONITORING
    interpretation: >-
      Lower hemoglobin reflects the net anemia produced by ineffective
      erythropoiesis and hemolysis.

name: Beta Thalassemia
creation_date: "2026-01-15T00:00:00Z"
description: >-
  Mutations in HBB reduce (beta-plus) or abolish (beta-zero) beta-globin chain synthesis.
  Unpaired alpha-globin chains precipitate in erythroid precursors, causing apoptosis and massively ineffective erythropoiesis together with peripheral hemolysis of the abnormal red cells.
  The resulting anemia drives erythroid expansion, splenomegaly, and hepcidin-suppressed iron overload, while genetic modifiers that raise fetal hemoglobin ameliorate severity.
category: Mendelian
synonyms:
- Beta-thalassemia
- Cooley anemia
- Mediterranean anemia
parents:
- Hematological Disease
- Genetic Disease
disease_term:
  preferred_term: beta thalassemia
  term:
    id: MONDO:0019402
    label: beta thalassemia
classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    notes: Inherited hemoglobinopathy characterized by reduced or absent beta-globin chain synthesis, ineffective erythropoiesis, and chronic hemolytic anemia.
    evidence:
    - reference: PMID:20492708
      reference_title: "Beta-thalassemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Beta-thalassemias are a group of hereditary blood disorders characterized by anomalies in the synthesis of the beta chains of hemoglobin resulting in variable phenotypes ranging from severe anemia to clinically asymptomatic individuals."
      explanation: Establishes beta-thalassemia as a primary hereditary hematologic disorder of hemoglobin synthesis.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: Monogenic hemoglobinopathy caused by pathogenic variants in HBB on chromosome 11p15.4.
    evidence:
    - reference: PMID:20492708
      reference_title: "Beta-thalassemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Beta-thalassemias are caused by point mutations or, more rarely, deletions in the beta globin gene on chromosome 11, leading to reduced (beta+) or absent (beta0) synthesis of the beta chains of hemoglobin (Hb)."
      explanation: Establishes the monogenic HBB etiology of beta-thalassemia.
has_subtypes:
- name: Beta Thalassemia Minor (Trait)
  description: >
    Heterozygous carriers with one normal and one affected HBB allele.
    Usually asymptomatic or mild microcytic anemia. Identified by elevated HbA2.
  evidence:
  - reference: PMID:20492708
    reference_title: "Beta-thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thalassemia minor is clinically asymptomatic but some subjects may have moderate anemia."
    explanation: Characterizes beta-thalassemia minor as typically asymptomatic or associated with mild/moderate anemia.
- name: Beta Thalassemia Intermedia
  description: >
    Moderate disease severity, typically homozygous or compound heterozygous
    for mild HBB mutations. Patients may require intermittent transfusions.
  evidence:
  - reference: PMID:20492708
    reference_title: "Beta-thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with thalassemia intermedia present later in life with moderate anemia and do not require regular transfusions."
    explanation: Characterizes beta-thalassemia intermedia as presenting later with moderate, non-transfusion-dependent anemia.
- name: Beta Thalassemia Major (Cooley Anemia)
  description: >
    Severe transfusion-dependent anemia due to homozygous or compound
    heterozygous severe HBB mutations. Presents in first 1-2 years of life.
  evidence:
  - reference: PMID:20492708
    reference_title: "Beta-thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with thalassemia major usually present within the first two years of life with severe anemia, requiring regular red blood cell (RBC) transfusions."
    explanation: Characterizes beta-thalassemia major as severe transfusion-dependent anemia presenting in the first two years of life.
prevalence:
- population: Global carriers
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1500.0
  notes: >
    Estimated 1.5% of the global population are heterozygous carriers.
    Highest prevalence occurs in the Mediterranean basin, Middle East,
    Indian subcontinent, Southeast Asia, and Melanesia.
  evidence:
  - reference: PMID:28293406
    reference_title: "β-Thalassemia Distribution in the Old World: an Ancient Disease Seen from a Historical Standpoint."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 1.5% of the global population are heterozygotes (carriers) of the β-thalassemias; there is a high incidence in populations from the Mediterranean basin, throughout the Middle East, the Indian subcontinent, Southeast Asia, and Melanesia to the Pacific Islands."
    explanation: Supports the stated global carrier prevalence and its geographic concentration.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:20492708
    reference_title: "Beta-thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transmission is autosomal recessive; however, dominant mutations have also been reported."
    explanation: Confirms autosomal recessive inheritance as the primary mode of transmission.
  - reference: PMID:20301599
    reference_title: "Beta-Thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If both parents are known to be heterozygous for an HBB pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being a (typically) asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: GeneReviews genetic counseling section gives the autosomal recessive transmission risks for sibs of an affected individual.
pathophysiology:
- name: Defective Beta-Globin Synthesis
  description: >
    Mutations in the HBB gene reduce or abolish beta-globin chain production.
    Beta-zero (beta0) mutations produce no beta-globin; beta-plus (beta+)
    mutations produce reduced amounts. Over 300 mutations have been identified,
    including point mutations, small deletions, and rarely large deletions.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: HBB
    term:
      id: hgnc:4827
      label: HBB
  molecular_functions:
  - preferred_term: oxygen carrier activity
    modifier: DECREASED
    term:
      id: GO:0005344
      label: oxygen carrier activity
  biological_processes:
  - preferred_term: hemoglobin biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0042541
      label: hemoglobin biosynthetic process
  cell_types:
  - preferred_term: erythroblast
    term:
      id: CL:0000765
      label: erythroblast
  downstream:
  - target: Alpha-Globin Chain Excess
    description: >
      Reduced beta-globin leads to unpaired alpha-globin chains that
      precipitate and damage erythroid precursors.
  evidence:
  - reference: PMID:20492708
    reference_title: "Beta-thalassemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Beta-thalassemias are caused by point mutations or, more rarely, deletions in the beta globin gene on chromosome 11, leading to reduced (beta+) or absent (beta0) synthesis of the beta chains of hemoglobin (Hb)."
    explanation: Confirms that HBB mutations lead to reduced or absent beta-globin chain synthesis.
- name: Alpha-Globin Chain Excess
  description: >
    Excess unpaired alpha-globin chains precipitate as insoluble aggregates
    in erythroid precursors, causing oxidative membrane damage, apoptosis
    of erythroblasts (ineffective erythropoiesis), and shortened survival
    of mature red blood cells (hemolysis). This is the central pathogenic
    mechanism distinguishing beta-thalassemia from alpha-thalassemia.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: HBA1
    term:
      id: hgnc:4823
      label: HBA1
  - preferred_term: HBA2
    term:
      id: hgnc:4824
      label: HBA2
  molecular_functions:
  - preferred_term: protein heterodimerization activity
    modifier: DECREASED
    term:
      id: GO:0046982
      label: protein heterodimerization activity
  cell_types:
  - preferred_term: erythroblast
    term:
      id: CL:0000765
      label: erythroblast
  downstream:
  - target: Ineffective Erythropoiesis
    description: >
      Apoptosis of alpha-chain-laden erythroid precursors in the bone marrow.
    evidence:
    - reference: PMID:21705976
      reference_title: "Pathophysiology of beta thalassaemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "unbalanced alpha globin chain synthesis results in severely rheologically compromised erythrocytes with premature destruction in the peripheral circulation and ineffective erythropoiesis within the bone marrow and in extramedullary sites"
      explanation: Directly links unbalanced alpha-globin chain excess to ineffective erythropoiesis in the bone marrow.
  - target: Chronic Hemolysis
    description: >
      Surviving erythrocytes with membrane damage are cleared prematurely.
    evidence:
    - reference: PMID:21705976
      reference_title: "Pathophysiology of beta thalassaemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "unbalanced alpha globin chain synthesis results in severely rheologically compromised erythrocytes with premature destruction in the peripheral circulation"
      explanation: Links unbalanced alpha-globin chain excess to premature peripheral erythrocyte destruction (chronic hemolysis).
  evidence:

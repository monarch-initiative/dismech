      snippet: >-
        These experiments indicated that GlialCAM containing an MLC2A mutation (p.R92Q) did not influence the
        localization at cell–cell junctions of the flag-tagged WT GlialCAM
      explanation: Functional test of the recessive allele.
  - name: p.Gln56Ter and p.Arg73Trp (compound heterozygous)
    description: >-

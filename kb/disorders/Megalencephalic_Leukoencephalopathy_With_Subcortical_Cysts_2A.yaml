notes: >-
  The GeneReviews chapter covers all forms of MLC together. Clinical figures specific to MLC2A come from the 2018
  international cross-sectional cohort (PMID:29661901), which included 17 MLC2A patients alongside 187 with MLC1 and
  found no clinical or MRI difference between the two; frequencies below are therefore partly pooled MLC1 and MLC2A
  figures, and each evidence item says which. No brain tissue from a patient with HEPACAM-related MLC has been studied,
  so every tissue-level mechanism node rests on Glialcam-null and knock-in mice, and on cultured cells.
pathophysiology:
- name: Biallelic HEPACAM Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous HEPACAM variants cause the disease: missense variants in the first
    immunoglobulin (IgV) domain such as p.Arg92Gln and p.Arg98Cys, nonsense and frameshift alleles, and an intragenic
    duplication of exons 3 and 4. The recessive missense alleles lose function without disturbing the wild-type
    protein, which is why carriers are unaffected; dominant alleles that do disturb it cause MLC2B instead.

    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      each sib of an affected individual has at conception a 25% chance of inheriting biallelic pathogenic variants and
      being affected, a 50% chance of being heterozygous, and a 25% chance of inheriting neither of the familial
      pathogenic variants.
    explanation: GeneReviews recurrence risk for sibs when both parents carry a HEPACAM (or MLC1) variant.
prevalence:
- population: Genetically confirmed MLC patients in the Amsterdam leukoencephalopathy database, 1991-2017
  measure_type: CASES_IN_LITERATURE
  notes: >-
    17 of 242 genetically confirmed MLC patients had MLC2A. No population prevalence or incidence of MLC2A has been
    published.
  evidence:
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In total, 242 patients with MLC, of whom 187 had MLC1, 17 had MLC2A, and 38 had MLC2B, were included.
    explanation: Size of the largest MLC2A series relative to other MLC variants.
diagnosis:
- name: Brain MRI
  description: >-
    Brain MRI with the clinical picture establishes classic MLC: diffusely abnormal, swollen cerebral hemispheric white
    matter with anterior temporal and often frontoparietal subcortical cysts. No MRI feature separates MLC2A from MLC1;
    early normal signal of the posterior limb of the internal capsule and cerebellar white matter points instead to
    remitting MLC2B.
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Systematic MRI review revealed no MRI features that distinguish between MLC1 and MLC2A.
    explanation: MRI cannot assign the gene.
  - reference: PMID:20301707
    reference_title: Megalencephalic Leukoencephalopathy with Subcortical Cysts.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      abnormal and swollen cerebral hemispheric white matter and subcortical cysts in the anterior temporal and often
      frontoparietal regions
    explanation: GeneReviews diagnostic MRI criteria for classic MLC.
- name: Molecular Genetic Testing
  description: >-
    Diagnosis of MLC2A requires biallelic pathogenic HEPACAM variants. Because MLC1 is far more often responsible for a
    classic presentation, MLC1 is tested first or together with HEPACAM on a panel; copy number analysis can find
    intragenic HEPACAM duplications that sequencing misses.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Considering the much higher prevalence of MLC1 gene defects, in cases of a classic presentation of MLC, this gene
      should be tested first.
    explanation: Cohort-based recommendation on test order.
  - reference: PMID:20301707
    reference_title: Megalencephalic Leukoencephalopathy with Subcortical Cysts.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      biallelic loss-of-function variants in MLC1 or HEPACAM or a heterozygous pathogenic variant in GPRC5B identified
      by molecular genetic testing
    explanation: GeneReviews molecular criterion for classic MLC.
  - reference: PMID:38280046
    reference_title: Intragenic homozygous duplication in HEPACAM is associated with megalencephalic leukoencephalopathy with subcortical cysts type 2A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, copy number variation analysis from the WES data of the proband revealed a copy number of 4 for exons 3
      and 4 of HEPACAM.
    explanation: Exome copy number analysis found the allele that sequence analysis missed.
differential_diagnoses:
- name: Megalencephalic leukoencephalopathy with subcortical cysts 1
  disease_term:
    preferred_term: megalencephalic leukoencephalopathy with subcortical cysts 1
    term:
      id: MONDO:0024555
      label: megalencephalic leukoencephalopathy with subcortical cysts 1
  description: >-
    Recessive MLC1-related disease is clinically and radiologically identical and, in the largest cohort, about ten
    times as common (187 against 17 patients); only molecular testing separates them.
  distinguishing_features:
  - Biallelic MLC1 rather than HEPACAM variants.
  evidence:
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No clinical differences could be identified between patients with MLC1 and MLC2A.
    explanation: Cohort comparison of the two recessive forms.
- name: Megalencephalic leukoencephalopathy with subcortical cysts 2B
  disease_term:
    preferred_term: megalencephalic leukoencephalopathy with subcortical cysts 2B, remitting, with or without intellectual disability
    term:
      id: MONDO:0013491
      label: megalencephalic leukoencephalopathy with subcortical cysts 2B, remitting, with or without intellectual disability
  description: >-
    Allelic disorder caused by a single dominant HEPACAM variant, often inherited from a parent with macrocephaly. It
    starts like classic MLC but motor function is preserved and the MRI improves or normalizes; intellectual disability
    and autism are relatively frequent.
  distinguishing_features:
  - A single heterozygous HEPACAM variant, frequently shared with a macrocephalic parent.
  - No motor decline and improving or normalizing MRI.
  - Early normal signal of the posterior limb of the internal capsule and cerebellar white matter, and rarefaction rather than true cysts.
  evidence:
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with MLC2B invariably had a milder phenotype with preservation of motor function, while intellectual
      disability and autism were relatively frequent.
    explanation: Clinical contrast between the remitting dominant form and classic MLC.
  - reference: PMID:31372844
    reference_title: Identification in Chinese patients with GLIALCAM mutations of megalencephalic leukoencephalopathy with subcortical cysts and brain pathological study on Glialcam knock-in mouse models.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical manifestations of the patient with MLC2A (Pt6) progressed with regression, whereas the course of the five
      MLC2B patients remained stable or improved.
    explanation: The two HEPACAM forms diverge in course within one series.
environmental:
- name: Minor head trauma
  description: >-
    Minor head trauma does not cause the disease but can provoke deterioration with seizures and motor decline in
    classic MLC, including MLC2A; contact sports are discouraged.
  notes: >-
    No exposure_term is bound; ECTO has no exposure term for physical injury (see the environmental notes of the MLC1
    entry for the searches run).
  evidence:
  - reference: PMID:29466841
    reference_title: Seizures and disturbed brain potassium dynamics in the leukodystrophy megalencephalic leukoencephalopathy with subcortical cysts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mild head trauma is an important provoking factor and status epilepticus occurs relatively frequently and early
      in the disease.
    explanation: Patient inventory including recessive GLIALCAM patients.
  - reference: PMID:20301707
    reference_title: Megalencephalic Leukoencephalopathy with Subcortical Cysts.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Contact sports and other activities associated with a high risk of head trauma should be avoided.
    explanation: GeneReviews management recommendation.
  influences_mechanisms:
  - target: Status Epilepticus
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Head trauma is reported as a provoking factor for seizures and status epilepticus in MLC.
    evidence:
    - reference: PMID:29466841
      reference_title: Seizures and disturbed brain potassium dynamics in the leukodystrophy megalencephalic leukoencephalopathy with subcortical cysts.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mild head trauma is an important provoking factor and status epilepticus occurs relatively frequently and early
        in the disease.
      explanation: Clinical observation from the patient inventory.
  - target: Progressive Cerebellar Ataxia
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Motor regression after head trauma has been reported in an MLC2A patient.
    evidence:
    - reference: PMID:31372844
      reference_title: Identification in Chinese patients with GLIALCAM mutations of megalencephalic leukoencephalopathy with subcortical cysts and brain pathological study on Glialcam knock-in mouse models.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Motor retrogress after head trauma was found in Pt6.
      explanation: Pt6 is the compound heterozygous MLC2A patient of this series.

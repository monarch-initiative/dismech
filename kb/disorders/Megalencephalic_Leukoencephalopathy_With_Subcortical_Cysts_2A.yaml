- name: Impaired Astrocyte Gap Junction Coupling
  biological_scale: CELLULAR
  description: >-
    A function of GlialCAM outside the MLC1 complex. Conditional deletion of Hepacam from developing mouse astrocytes
    reduces astrocyte territory and morphological complexity, impairs gap junction coupling between astrocytes and
    shifts the balance between synaptic excitation and inhibition. In the germline Glialcam-null mouse, astrocyte gap
    junction coupling is only modestly reduced and the syncytium stays electrically isopotential. Whether the recessive
    patient alleles impair coupling has not been tested.
  cell_types:

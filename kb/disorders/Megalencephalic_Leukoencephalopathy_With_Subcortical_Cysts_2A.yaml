    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Reduction in GlialCAM expression resulted in defective activation of VRAC and augmented vacuolation,
      phenocopying MLC1 mutations.
    explanation: Grounds the decreased volume-sensitive anion channel activity after GlialCAM loss.
  - reference: PMID:40443195
    reference_title: Impaired Volume Regulation and Electrophysiology of Astrocytes In Situ in a Mouse Model for Megalencephalic Leukoencephalopathy With Subcortical Cysts.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cortical Glialcam-null astrocytes showed normal intracellular chloride dynamics but reduced volume recovery upon
      potassium-induced cell swelling.
    explanation: Grounds the decreased cell volume homeostasis in intact astrocytes of the knockout.
  - reference: PMID:30076890
    reference_title: "GlialCAM/MLC1 modulates LRRC8/VRAC currents in an indirect manner: Implications for megalencephalic leukoencephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Previous work indicated that chloride currents mediated by the volume-regulated anion channel (VRAC) and ClC-2
      channels were affected in astrocytes deficient in either Mlc1 or Glialcam.
    explanation: States that Glialcam-deficient astrocytes, like Mlc1-deficient ones, have altered VRAC currents.
  - reference: PMID:30076890
    reference_title: "GlialCAM/MLC1 modulates LRRC8/VRAC currents in an indirect manner: Implications for megalencephalic leukoencephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We determine that LRRC8A and MLC1 do not co-localize or interact and, in Xenopus oocytes, MLC1 does not
      potentiate LRRC8-mediated VRAC currents, indicating that VRAC modulation in astrocytes by MLC1 may be indirect.
    explanation: The complex modulates VRAC without binding its pore subunit.

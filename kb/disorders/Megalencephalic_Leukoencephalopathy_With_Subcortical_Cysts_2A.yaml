- name: Failure of GlialCAM Trafficking to Astrocyte Junctions
  biological_scale: CELLULAR
  description: >-
    Most disease-causing GlialCAM missense variants, recessive and dominant alike, sit in the IgV domain, reduce
    GlialCAM homo-oligomerization and abolish targeting of GlialCAM to cell-cell junctions. Not every recessive allele
    behaves this way: p.Arg73Trp, found in trans with a nonsense allele, showed no trafficking defect in vitro.
    Recessive variants tested so far do not reduce binding to MLC1 or ClC-2, so the defect is one of location rather
    than of partner binding.

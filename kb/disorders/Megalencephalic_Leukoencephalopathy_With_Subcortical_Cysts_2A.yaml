- name: Intramyelinic Edema and Myelin Vacuolation
  biological_scale: TISSUE
  description: >-
    Glialcam-null mice develop progressive white matter vacuolization from intramyelinic edema, with increased brain
    water and megalencephaly, replicating the early human disease; vacuoles are most prominent in the cerebellar white
    matter. Compound heterozygous knock-in mice carrying the p.Lys68Met and p.Thr132Asn alleles of an MLC2A patient also
    develop white matter vacuolation, heavier by 9 months than in knock-in mice with a dominant MLC2B allele. In patients
    the edema is seen on MRI as diffusely abnormal, swollen cerebral white matter.

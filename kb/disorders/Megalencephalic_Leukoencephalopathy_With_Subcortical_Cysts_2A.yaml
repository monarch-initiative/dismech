animal_models:
- name: Glialcam-null mouse
  species: Mouse
  genotype: Glialcam(-/-)
  publication: PMID:28695146
  description: >-
    Glialcam replaced by a lacZ cassette. Early megalencephaly, increased brain water, swollen astrocyte processes at
    blood vessels from 3 weeks and progressive intramyelinic vacuolation; astrocytes lack MLC1 and have reduced ClC-2.
    Also used in seizure studies, where it shows a lowered seizure threshold and abnormal potassium dynamics.
  modeled_mechanisms:
  - target: Impaired Astrocyte Regulatory Volume Decrease
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    evidence:
    - reference: PMID:40443195
      reference_title: Impaired Volume Regulation and Electrophysiology of Astrocytes In Situ in a Mouse Model for Megalencephalic Leukoencephalopathy With Subcortical Cysts.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cortical Glialcam-null astrocytes showed normal intracellular chloride dynamics but reduced volume recovery
        upon potassium-induced cell swelling.
      explanation: Volume-regulation defect measured in acute slices from the knockout.
  - target: Disrupted MLC1-GlialCAM-ClC-2 Junctional Complex
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    evidence:
    - reference: PMID:28695146
      reference_title: "Megalencephalic leukoencephalopathy with cysts: the Glialcam-null mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Glialcam-null astrocytes showed abolished expression of MLC1, reduced expression of the chloride channel ClC-2
        and increased expression and redistribution of the water channel aquaporin4.
      explanation: Loss of the complex partners in knockout astrocytes.
  - target: Intramyelinic Edema and Myelin Vacuolation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      A null allele rather than the missense alleles most patients carry. Replicates the early stages of the human
      disease, and vacuolation is most marked in the cerebellum rather than in the cerebral hemispheric white matter
      that dominates in patients; subcortical cysts are not described.
    evidence:
    - reference: PMID:28695146
      reference_title: "Megalencephalic leukoencephalopathy with cysts: the Glialcam-null mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Glialcam-null mice replicate the early stages of the human disease with early-onset intramyelinic edema.
      explanation: Authors' assessment of how far the model reproduces the human lesion.
  - target: Disturbed Extracellular Potassium Dynamics and Network Hyperexcitability
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    evidence:
    - reference: PMID:29466841
      reference_title: Seizures and disturbed brain potassium dynamics in the leukodystrophy megalencephalic leukoencephalopathy with subcortical cysts.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        in MLC mice, we uncovered spontaneous epileptiform brain activity and a lowered threshold for induced seizures.
      explanation: The study's MLC mice are the Mlc1-null and Glialcam-null lines.
- name: Glialcam p.Lys68Met/p.Thr132Asn knock-in mouse
  species: Mouse
  genotype: Glialcam(Lys68Met/Thr132Asn)
  publication: PMID:31372844
  description: >-
    CRISPR knock-in carrying the two alleles of a Chinese MLC2A patient in compound heterozygous form; the first mouse
    model with recessive patient alleles. Develops white matter vacuolation in the anterior commissure and cerebellum.
  modeled_mechanisms:
  - target: Intramyelinic Edema and Myelin Vacuolation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Only histology was reported; vacuolation was assessed in the anterior commissure and cerebellum, not in the
      cerebral hemispheric white matter that dominates in patients, and no behavioural or MRI data were given.
    evidence:
    - reference: PMID:31372844
      reference_title: Identification in Chinese patients with GLIALCAM mutations of megalencephalic leukoencephalopathy with subcortical cysts and brain pathological study on Glialcam knock-in mouse models.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The GlialcamArg92Trp/+ and GlialcamLys68Met/ Thr132Asn mouse models showed vacuolization in the anterior
        commissural WM at 1 month of age and vacuolization in the cerebellar WM at 3 and 6 months, respectively.
      explanation: Vacuolation in mice carrying the patient's recessive alleles.
- name: glialcama-null zebrafish
  species: Zebrafish
  genotype: glialcama(-/-)
  publication: PMID:31752924
  description: >-
    TALEN knockout of the zebrafish GLIALCAM orthologue with megalencephaly and increased fluid accumulation, not
    aggravated by also removing mlc1. Unlike in mice, mlc1 protein expression and localization are preserved.
  modeled_mechanisms:
  - target: Intramyelinic Edema and Myelin Vacuolation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      In this model mlc1 stays at the membrane, apparently through upregulation of mlc1 mRNA, so it does not reproduce
      the loss of MLC1 that the mouse and the proposed human mechanism share; fluid accumulation rather than myelin
      vacuolation was the readout.
    evidence:
    - reference: PMID:31752924
      reference_title: Comparison of zebrafish and mice knockouts for Megalencephalic Leukoencephalopathy proteins indicates that GlialCAM/MLC1 forms a functional unit.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: glialcama-/- shows megalencephaly and increased fluid accumulation.
      explanation: Zebrafish knockout phenotype.
experimental_models:
- name: GlialCAM knock-down and over-expression in HeLa cells and primary astrocytes
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:23793458
  description: >-
    Gain- and loss-of-function of GlialCAM with wild-type or MLC-mutant MLC1, measuring MLC1 surface expression, VRAC
    currents and vacuolation.
  modeled_mechanisms:
  - target: Impaired Astrocyte Regulatory Volume Decrease
    relationship: MEASURES
    fidelity: MODERATE
    limitations: >-
      Knock-down of GlialCAM rather than patient HEPACAM alleles; cultured astrocytes lack the endfoot specialization.
    evidence:
    - reference: PMID:23793458
      reference_title: "Insights into MLC pathogenesis: GlialCAM is an MLC1 chaperone required for proper activation of volume-regulated anion currents."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Importantly, over-expression of GlialCAM together with MLC1 containing MLC-related mutations was able to
        reactivate VRAC currents and to reverse the vacuolation caused in the presence of mutant MLC1.
      explanation: Rescue arm linking GlialCAM to VRAC activation.
discussions:
- discussion_id: mlc2a_no_human_tissue
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the white matter of patients with recessive HEPACAM variants show the same astrocyte endfoot swelling,
    intramyelinic vacuolation and loss of junctional MLC1 and ClC-2 that the Glialcam-null mouse shows?
  attaches_to:
  - pathophysiology#Disrupted MLC1-GlialCAM-ClC-2 Junctional Complex
  - pathophysiology#Intramyelinic Edema and Myelin Vacuolation
  rationale: >-
    Brain tissue from patients with GLIALCAM-related MLC has not been available, so every tissue-level node in this
    entry is inferred from MLC1-related human pathology and from mouse models. The one MLC1 patient brain studied kept
    GlialCAM at junctions, which shows that the two genes' human tissue phenotypes need not mirror each other.
  evidence:
  - reference: PMID:28695146
    reference_title: "Megalencephalic leukoencephalopathy with cysts: the Glialcam-null mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: Brain tissue of MLC patients is extremely scarce for MLC1 mutations and unavailable for GLIALCAM mutations.
    explanation: States the absence of human tissue for this form.
  - reference: PMID:21624973
    reference_title: Molecular mechanisms of MLC1 and GLIALCAM mutations in megalencephalic leukoencephalopathy with subcortical cysts.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the amount of GlialCAM and its localization were nearly unaffected, indicating that MLC1 is not
      necessary for GlialCAM expression or targeting.
    explanation: Post-mortem MLC1 brain in which GlialCAM was preserved, illustrating that mouse findings may not transfer.
mechanistic_hypotheses:
- hypothesis_group_id: gap_junction_coupling_potassium_buffering
  hypothesis_label: >-
    Reduced astrocyte gap junction coupling contributes to the disturbed potassium dynamics
  status: EMERGING
  description: >-
    A candidate second route from GlialCAM loss to the seizures, running outside the MLC1 complex. Conditional deletion
    of Hepacam from developing mouse astrocytes impairs gap junction coupling and shifts the balance between synaptic
    excitation and inhibition, and gap junction coupling carries part of astrocyte potassium buffering. Three things
    keep it a hypothesis: the coupling defect was produced by a conditional knockout in otherwise wild-type mice rather
    than by a patient allele, coupling is only modestly reduced in the germline Glialcam-null mouse where the syncytium
    stays electrically isopotential, and no study has connected reduced coupling to the seizures of MLC2A.
  evidence:
  - reference: PMID:34171291
    reference_title: HepaCAM controls astrocyte self-organization and coupling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      conditional deletion of Hepacam from developing astrocytes significantly impairs gap junction coupling between
      astrocytes and disrupts the balance between synaptic excitation and inhibition.
    explanation: The coupling and excitation-inhibition findings this hypothesis rests on, from a conditional knockout.
  - reference: PMID:40443195
    reference_title: Impaired Volume Regulation and Electrophysiology of Astrocytes In Situ in a Mouse Model for Megalencephalic Leukoencephalopathy With Subcortical Cysts.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Gap junction coupling of the astrocyte syncytium was modestly reduced, but it remained sufficient to preserve
      functional electrical isopotentiality.
    explanation: The disease model limits how much the coupling defect can contribute, which is why the status is EMERGING.

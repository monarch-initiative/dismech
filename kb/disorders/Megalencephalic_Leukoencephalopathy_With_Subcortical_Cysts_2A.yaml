name: Megalencephalic Leukoencephalopathy With Subcortical Cysts 2A
creation_date: "2026-10-20T19:17:31Z"
category: Mendelian
description: >-
  Autosomal recessive leukodystrophy caused by biallelic loss-of-function variants in HEPACAM, which encodes GlialCAM,
  an immunoglobulin-superfamily adhesion molecule of astrocytes and oligodendrocytes. GlialCAM binds MLC1 and is
  required for MLC1 to leave the endoplasmic reticulum and reach astrocyte-astrocyte junctions at perivascular and
  subpial endfeet; it is also an auxiliary subunit of the ClC-2 chloride channel, which it targets to the same
  junctions. Recessive GlialCAM missense variants mostly fail to form GlialCAM homo-complexes and are not trafficked to
  junctions, taking MLC1 and ClC-2 with them, so the disease converges on the same loss of junctional MLC1 function as
  MLC1-related disease (MLC1). The downstream cascade, reconstructed largely in Glialcam-null mice because no patient
  brain tissue has been studied, runs from defective volume-regulated anion current activation and slowed astrocyte
  regulatory volume decrease to swelling of astrocyte endfeet and intramyelinic edema with myelin vacuolation. The
  clinical and MRI picture is classic MLC and cannot be told apart from MLC1: macrocephaly in the first year of life,
  diffusely swollen cerebral white matter with anterior temporal subcortical cysts, onset of motor deterioration with
  ataxia and spasticity at a median age of about 5 years, seizures in about three quarters of patients, later mild
  cognitive decline, and deterioration after minor head trauma. HEPACAM-related disease with a single dominant variant
  (MLC2B) follows a remitting course and is a separate disorder.

genetic:
- name: HEPACAM
  gene_term:
    preferred_term: HEPACAM
    term:
      id: hgnc:26361
      label: HEPACAM
  relationship_type: CAUSATIVE
  notes: >-
    The literature calls the protein GlialCAM and often the gene GLIALCAM; the HGNC symbol is HEPACAM. A 2024 variant
    update listed 29 GLIALCAM variants in MLC patients, 11 of them dominant (MLC2B). The same residue can carry a
    recessive and a dominant variant (p.Arg92Gln recessive, p.Arg92Trp dominant).
  gene_disease_validity:

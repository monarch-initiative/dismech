- name: Disrupted MLC1-GlialCAM-ClC-2 Junctional Complex
  biological_scale: MOLECULAR
  description: >-
    GlialCAM is the obligatory subunit that brings MLC1 out of the endoplasmic reticulum to astrocyte-astrocyte
    junctions and stabilizes it, and it also targets the ClC-2 chloride channel to junctions and changes its gating.
    Without GlialCAM, MLC1 accumulates intracellularly and is lost from the plasma membrane; in Glialcam-null mouse
    astrocytes MLC1 expression is abolished and ClC-2 reduced. Patient missense GlialCAM variants still modify ClC-2
    currents in vitro but no longer place the channel at junctions. Knockout of either gene, or of both, gives the
    same phenotype in mice and zebrafish, so GlialCAM and MLC1 act as one functional unit.

biochemical:
- name: Total Homocysteine
  notes: >-
    Markedly elevated plasma total homocysteine with homocystinuria. With a normal
    methylmalonic acid, this is the pattern that localises the defect to the remethylation
    limb and points at cblE or cblG rather than the combined disorders.
  presence: INCREASED
  biomarker_term:
    preferred_term: Hyperhomocystinemia
    term:
      id: HP:0002160
      label: Hyperhomocystinemia
  evidence:
  - reference: PMID:34625984
    reference_title: "Methionine synthase deficiency: Variable clinical presentation and benefit of early diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It leads to a biochemical phenotype of hyperhomocysteinemia and hypomethioninemia."
    explanation: cblG-specific statement of the biochemical phenotype.
- name: Plasma Methionine
  notes: >-
    Low plasma methionine. The direction matters diagnostically: classical homocystinuria from
    cystathionine beta-synthase deficiency raises methionine, whereas the remethylation defects
    lower it, so methionine separates the two groups of homocystinuria.
  presence: DECREASED
  biomarker_term:
    preferred_term: Hypomethioninemia
    term:
      id: HP:0003658
      label: Hypomethioninemia
  evidence:
  - reference: PMID:34625984
    reference_title: "Methionine synthase deficiency: Variable clinical presentation and benefit of early diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It leads to a biochemical phenotype of hyperhomocysteinemia and hypomethioninemia."
    explanation: cblG-specific statement of the low methionine.
- name: Methylmalonic Acid
  notes: >-
    Normal. cblE and cblG affect only methylcobalamin synthesis, leaving the
    adenosylcobalamin-dependent mutase intact, so these are isolated homocystinurias. A raised
    methylmalonic acid points to cblC, cblD, cblF or cblJ instead.

    Bound to the CHEBI analyte rather than to an HP abnormality term, because the finding is a
    normal value: an HP term names an abnormality, so pairing one with presence NORMAL would
    machine-readably assert the opposite of what this record says.
  presence: NORMAL
  biomarker_term:
    preferred_term: methylmalonic acid
    term:
      id: CHEBI:30860
      label: methylmalonic acid
  evidence:
  - reference: PMID:35337626
    reference_title: "Inherited defects of cobalamin metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "inborn errors affecting synthesis of the methylcobalamin coenzyme required by methionine synthase (cblE and cblG) result in isolated homocystinuria"
    explanation: States the isolated-homocystinuria signature that distinguishes cblG from the combined disorders.
genetic:
- name: MTR
  notes: >-
    Encodes methionine synthase. Roughly 50 patients and 54 candidate causal variants had been
    published before the largest sequencing series added 24 further novel variants. Variants
    are largely private; the most common is c.3518C>T p.P1173L, and two deep intronic variants
    recur, which matters because an exome-only strategy can miss them.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: MTR
    term:
      id: hgnc:7468
      label: MTR
  evidence:
  - reference: PMID:41202372
    reference_title: "Identification of variants of the MTR gene in patients with the cblG inborn error of cobalamin metabolism diagnosed by somatic cell complementation analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common identified causal variant was c.3518C > T, p.P1173L (8 alleles). The previously identified deep intronic variants c.340-166 A > T and c.609 + 1088G > A were also seen frequently (6 alleles each)."
    explanation: Gives the recurrent alleles, including the deep intronic ones that sequencing strategy has to account for.
  - reference: PMID:25526710
    reference_title: "Clinical onset and course, response to treatment and outcome in 24 patients with the cblE or cblG remethylation defect complemented by genetic and in vitro enzyme study data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Predominantly private mutations were detected and no genotype- phenotype correlations evident."
    explanation: Establishes the absence of a usable genotype-phenotype correlation.
prevalence:
- population: Worldwide (published cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Approximately 50 patients reported in the literature as of the 2025 sequencing series.
    No population rate has been estimated.
  evidence:
  - reference: PMID:41202372
    reference_title: "Identification of variants of the MTR gene in patients with the cblG inborn error of cobalamin metabolism diagnosed by somatic cell complementation analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 50 patients with the disorder have been reported, and 54 potentially causal MTR variants published."
    explanation: Source of the published case count.
diagnosis:
- name: Plasma Total Homocysteine and Methylmalonic Acid
  description: >-
    The mainstay biochemical pair. Raised total homocysteine with normal methylmalonic acid
    localises the defect to the remethylation limb; measuring only one of the two cannot
    separate cblG from the combined disorders.
  evidence:
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evaluation of the methylmalonic acid (MMA) level in urine and blood and plasma total homocysteine (tHcy) level are the mainstays of biochemical testing."
    explanation: GeneReviews states the first-line biochemical tests.
- name: MTR Molecular Genetic Testing
  description: >-
    Diagnosis is confirmed by biallelic pathogenic MTR variants. Two recurrent deep intronic
    variants mean a coding-only strategy can leave a patient with one or no identified allele.
  evidence:
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is confirmed by identification of biallelic pathogenic variants in one of the following genes (associated complementation groups indicated in parentheses): MMACHC (cblC), MMADHC (cblD-combined and cblD-homocystinuria), MTRR (cblE), LMBRD1 (cblF), MTR (cblG), ABCD4 (cblJ)"
    explanation: GeneReviews names MTR as the gene whose biallelic variants confirm cblG.
- name: Somatic Cell Complementation Analysis
  description: >-
    Historically the method that defined the cblG group and still the way the sequenced
    patients were ascertained. Worth recording as declining rather than obsolete: the authors
    of the largest variant series note that variant interpretation was *enhanced* by knowing
    complementation status, and that this testing is becoming less available - so the
    diagnostic yield of sequencing alone may be lower than the series suggests.
  evidence:
  - reference: PMID:41202372
    reference_title: "Identification of variants of the MTR gene in patients with the cblG inborn error of cobalamin metabolism diagnosed by somatic cell complementation analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of pathogenic or likely pathogenic variants was enhanced by knowledge of complementation status which has become less frequent as somatic cell testing becomes less readily available."
    explanation: States both the value of complementation analysis and its declining availability.
definitions:
- name: Isolated remethylation defect biochemical signature
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The triad that localises a patient to cblE or cblG rather than to the combined disorders
    or to classical homocystinuria: total homocysteine high, methionine low, methylmalonic
    acid normal. Each of the three carries information the other two do not - homocysteine
    says there is a remethylation problem, normal MMA excludes the combined defects, and low
    methionine distinguishes a remethylation defect from cystathionine beta-synthase
    deficiency, where methionine is high. Separating cblE from cblG then requires MTR/MTRR
    sequencing or complementation analysis; the biochemistry cannot do it.
  evidence:
  - reference: PMID:35337626
    reference_title: "Inherited defects of cobalamin metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "inborn errors affecting synthesis of the methylcobalamin coenzyme required by methionine synthase (cblE and cblG) result in isolated homocystinuria"
    explanation: Establishes the isolated-homocystinuria half of the signature.
  - reference: PMID:34625984
    reference_title: "Methionine synthase deficiency: Variable clinical presentation and benefit of early diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It leads to a biochemical phenotype of hyperhomocysteinemia and hypomethioninemia."
    explanation: Establishes the high-homocysteine, low-methionine half of the signature.
treatments:
- name: Parenteral Hydroxocobalamin
  description: >-
    The primary therapy. Parenteral hydroxocobalamin drives residual methionine synthase
    activity and is the intervention that reverses the haematological picture.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxocobalamin
      term:
        id: CHEBI:27786
        label: hydroxocobalamin
  evidence:
  - reference: PMID:34625984
    reference_title: "Methionine synthase deficiency: Variable clinical presentation and benefit of early diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Medical management of cblG includes the use of hydroxocobalamin, betaine, folinic acid, and in some cases methionine supplementation."
    explanation: cblG-specific statement of the treatment regimen.
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early institution of injectable hydroxocobalamin improves survival and may reduce but not completely prevent primary manifestations."
    explanation: >-
      GeneReviews on the benefit and its limit - survival improves, but the manifestations are
      not fully prevented, which is the careful version of the claim.
  target_mechanisms:
  - target: Methionine Synthase Loss of Function
    description: >-
      Pharmacologic cobalamin drives whatever residual methionine synthase activity a given
      genotype retains, so the target is the defective enzyme itself rather than a downstream
      metabolite.
- name: Betaine
  description: >-
    Betaine supplies an alternative remethylation route through betaine-homocysteine
    methyltransferase, bypassing the defective enzyme entirely. It lowers homocysteine and
    raises methionine without requiring any residual methionine synthase activity, which is
    why it is used alongside rather than instead of cobalamin.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: betaine
      term:
        id: CHEBI:17750
        label: glycine betaine
  evidence:
  - reference: PMID:25526710
    reference_title: "Clinical onset and course, response to treatment and outcome in 24 patients with the cblE or cblG remethylation defect complemented by genetic and in vitro enzyme study data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical response to treatment with variable combinations of betaine, cobalamin, folate was significant."
    explanation: Documents the biochemical response to the betaine-containing regimen in the reported cohort.
  target_mechanisms:
  - target: Homocysteine Remethylation Block
    description: >-
      Betaine supplies a parallel remethylation route via betaine-homocysteine
      methyltransferase, so it bypasses the block rather than relieving it - which is why it
      works regardless of residual methionine synthase activity.
- name: Folinic Acid
  description: >-
    Folinic acid enters the tetrahydrofolate pool downstream of the methylfolate trap,
    restoring one-carbon units for nucleotide synthesis without requiring methionine synthase.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folinic acid
      term:
        id: CHEBI:15640
        label: 5-formyltetrahydrofolic acid
  evidence:
  - reference: PMID:34625984
    reference_title: "Methionine synthase deficiency: Variable clinical presentation and benefit of early diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hydroxocobalamin, betaine, folinic acid, and in some cases methionine supplementation"
    explanation: Names folinic acid in the cblG regimen.
  target_mechanisms:
  - target: Methylfolate Trap
    description: >-
      Folinic acid enters the tetrahydrofolate pool downstream of the trap, restoring
      one-carbon units for nucleotide synthesis without requiring methionine synthase.
- name: Methionine Supplementation
  description: >-
    Used in some patients to correct the hypomethioninemia directly, on the reasoning that low
    methionine rather than high homocysteine may drive the neurological phenotype. Explicitly
    qualified as "in some cases" in the source, so it is not part of the standard regimen.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: methionine
      term:
        id: CHEBI:16643
        label: L-methionine
  evidence:
  - reference: PMID:34625984
    reference_title: "Methionine synthase deficiency: Variable clinical presentation and benefit of early diagnosis and treatment."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "and in some cases methionine supplementation"
    explanation: >-
      Graded PARTIAL because the source qualifies this as used only in some cases, so it
      supports methionine supplementation as an option rather than as standard therapy.
  target_mechanisms:
  - target: Methionine and S-Adenosylmethionine Depletion
    description: >-
      Replaces the product the blocked reaction cannot make, targeting the depletion arm
      directly rather than the homocysteine accumulation arm.
- name: Avoidance of Nitrous Oxide Anaesthesia
  description: >-
    GeneReviews lists nitrous oxide among the agents to avoid, and for cblG this is the most
    mechanistically pointed item on the list rather than a generic precaution: nitrous oxide
    irreversibly oxidises the cobalamin cofactor of methionine synthase - the exact enzyme
    this disease has already lost - so an anaesthetic exposure removes whatever residual
    activity treatment is working to sustain. It is also the hazard most likely to be met by
    a clinician who does not know the diagnosis.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Methionine Synthase Loss of Function
    description: >-
      Protects residual methionine synthase activity from a further, irreversible
      pharmacological hit.
  evidence:
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Prolonged fasting (longer than overnight without dextrose-containing intravenous fluids); dietary protein intake below the recommended dietary allowance for age or more than that prescribed by a metabolic specialist; methionine restriction including use of medical foods that do not contain methionine; and the anesthetic nitrous oxide."
    explanation: >-
      GeneReviews agents-to-avoid list. Note it also rules out methionine restriction, which
      is the intuitive but wrong move in a disorder whose name contains "homocystinuria".
- name: Avoidance of Catabolic States
  description: >-
    Prolonged fasting and dehydration precipitate metabolic decompensation and are to be
    avoided, alongside maintaining a weight-appropriate hydroxocobalamin dose. In practice this
    is the instruction that matters during intercurrent illness and before procedures.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Homocysteine Remethylation Block
    description: >-
      Limits the substrate flux through a pathway that cannot handle a catabolic load.
  evidence:
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To prevent metabolic decompensations, affected persons are advised to avoid situations that result in catabolism, such as prolonged fasting and dehydration, and always remain on a weight-appropriate dose of hydroxocobalamin."
    explanation: GeneReviews prevention-of-primary-manifestations advice.
- name: Long-Term Biochemical Monitoring and Dose Adjustment
  description: >-
    Long-term management targets three numbers rather than symptoms: lower plasma total
    homocysteine, lower methylmalonic acid, and plasma methionine kept within the normal range.
    The third is the one specific to the remethylation disorders - in cblG methionine is low,
    so the goal is to raise it, the opposite of management in classical homocystinuria.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Methionine and S-Adenosylmethionine Depletion
    description: >-
      Keeping plasma methionine in range is a direct target on the depletion arm of the
      biochemical phenotype.
  evidence:
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term management focuses on improving the metabolic derangement by lowering plasma tHcy and MMA concentrations and maintaining plasma methionine concentrations within the normal range."
    explanation: GeneReviews long-term management goals.
discussions:
- discussion_id: cblg_treatment_alters_natural_history
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does treatment of cblG with hydroxocobalamin, betaine and folinic acid change the natural
    history of the neurological disease, or only the biochemistry?
  attaches_to:
  - treatments#Parenteral Hydroxocobalamin
  - pathophysiology#Cerebral White Matter Injury
  - phenotypes#Global Developmental Delay
  rationale: >-
    The two most relevant papers disagree, and the disagreement is substantive rather than a
    matter of emphasis.

    The larger cohort (24 patients, cblE and cblG pooled) found the biochemical response
    significant and the overall course improving or stable in 96% of patients - and in the same
    breath reported that the average number of CNS symptoms per patient rose significantly over
    time and that 16 of 23 were developmentally delayed or severely handicapped at follow-up.
    Its conclusion is that these patients "show limited clinical response to treatment and have
    neurocognitive impairment."

    The cblG-specific case series argues the opposite for its own five patients, reporting
    objective neurological improvement and better outcomes in those treated early, especially
    before neurological symptoms appeared, and uses that to argue cblG belongs in newborn
    screening.

    The two are not straightforwardly comparable. Timing of treatment relative to symptom onset
    is the obvious candidate explanation - the favourable series emphasises presymptomatic
    treatment, and the larger cohort found that diagnostic delay correlated significantly with
    impaired communication at follow-up. But the smaller series is five selected patients
    reported by authors making a screening argument, and the larger is retrospective and
    survey-based with pooled cblE and cblG data. Neither design can settle it, and this entry
    does not.

    This is recorded as a KNOWLEDGE_GAP rather than a HUMAN_MODEL_MISMATCH because the
    uncertainty is in human clinical evidence, not in translation from a model system.
  evidence:
  - reference: PMID:25526710
    reference_title: "Clinical onset and course, response to treatment and outcome in 24 patients with the cblE or cblG remethylation defect complemented by genetic and in vitro enzyme study data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of patients with the cblE and cblG defect show limited clinical response to treatment and have neurocognitive impairment."
    explanation: The pessimistic side of the disagreement, from the larger pooled cohort.
  - reference: PMID:34625984
    reference_title: "Methionine synthase deficiency: Variable clinical presentation and benefit of early diagnosis and treatment."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "we present five patients with cblG who have shown substantial clinical benefit from treatment with objective improvement in their neurologic outcomes"
    explanation: >-
      Refutes the proposition that treatment cannot alter neurological outcome, in five
      cblG-specific patients. Graded REFUTE against the pessimistic claim, which is the
      substance of the disagreement this discussion records.
  - reference: PMID:34625984
    reference_title: "Methionine synthase deficiency: Variable clinical presentation and benefit of early diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given improved outcomes from treatment of presymptomatic patients, cblG warrants inclusion in newborn screening."
    explanation: >-
      The policy conclusion the favourable series draws, which is what makes resolving this
      question consequential rather than academic.
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Early institution of injectable hydroxocobalamin improves survival and may reduce but not completely prevent primary manifestations."
    explanation: >-
      A third position, and the most careful one: GeneReviews claims a survival benefit while
      explicitly declining to claim full prevention of manifestations.
  - reference: PMID:34625984
    reference_title: "Methionine synthase deficiency: Variable clinical presentation and benefit of early diagnosis and treatment."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the published literature contains differing conclusions on whether treatment is effective in changing the natural history of the disease."
    explanation: >-
      The authors state the disagreement themselves, which is the reason this is curated as an
      open question rather than as a settled position.
  proposed_experiments:
  - experiment_id: exp_cblg_presymptomatic_treatment_cohort
    name: Prospective outcome comparison by treatment timing in a cblG-only cohort
    description: >-
      Assemble a cblG-only (not pooled with cblE) cohort stratified by whether treatment began
      before or after the first neurological symptom, with prospective standardised
      neurocognitive assessment, to test whether the apparent benefit tracks presymptomatic
      initiation rather than differing between the two published series for other reasons.
    would_support:
    - phenotypes#Global Developmental Delay
    supporting_outcome:
    - >-
      Presymptomatically treated cblG patients show materially better neurocognitive outcomes
      than symptomatically treated ones, supporting newborn screening and explaining the
      discrepancy as a timing effect.
    refuting_outcome:
    - >-
      Outcomes are comparable regardless of treatment timing, indicating the neurological
      phenotype is largely determined before or independently of the correctable biochemistry.

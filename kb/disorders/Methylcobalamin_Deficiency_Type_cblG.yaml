notes: >-
  GeneReviews mining (PMID:20301503): Diagnosis/Testing, Management, Prevention of primary
  manifestations, Agents/circumstances to avoid, and Genetic Counseling are mined into this
  entry. The CLINICAL CHARACTERISTICS section was deliberately NOT mined, because that
  paragraph names cblC as "the prototype and best understood phenotype" and its age-of-onset
  and manifestation lists are cblC-specific. Attributing them to cblG would be a Named Entity
  Confusion error. This follows the same curation decision recorded in the cblE entry.

  A second, distinct entity-attribution hazard applies to this disease specifically. The main
  clinical cohort (PMID:25526710) reports 11 cblE and 13 cblG patients and gives its symptom
  frequencies, imaging findings and outcome figures for the pooled group, not per defect.
  Those numbers are used here where they are the best available evidence, but each such
  evidence item says in its explanation that the figure is pooled. They should not be read as
  cblG-specific rates.
inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic MTR variants. The largest sequencing series identified two potential causal
    variants in each of 29 patients diagnosed by somatic cell complementation. Variants are
    predominantly private, and no genotype-phenotype correlation has been demonstrated.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:41202372
    reference_title: "Identification of variants of the MTR gene in patients with the cblG inborn error of cobalamin metabolism diagnosed by somatic cell complementation analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified two potential causal variants in each of the patients analyzed, although parental phasing was not done."
    explanation: >-
      Biallelic variants in every sequenced patient, consistent with recessive inheritance.
      The absence of parental phasing is stated by the authors and is worth carrying, since
      it is the one qualification on the biallelic claim.
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: GeneReviews recurrence risk, the figure needed for counselling an affected family.
pathophysiology:
- name: Methionine Synthase Loss of Function
  description: >-
    Biallelic pathogenic MTR variants remove or inactivate methionine synthase, the
    cobalamin-dependent enzyme of the remethylation limb. Unlike cblE, where the enzyme is
    present but cannot be reactivated, here the catalytic machinery itself is defective, so
    in vitro assay under strongly reducing conditions does not rescue activity the way it can
    in cblE - which is the biochemical basis on which the two complementation groups were
    originally separated.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MTR
    term:
      id: hgnc:7468
      label: MTR
  molecular_functions:
  - preferred_term: methionine synthase activity
    modifier: DECREASED
    term:
      id: GO:0008705
      label: methionine synthase activity
  downstream:
  - target: Homocysteine Remethylation Block
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41202372
    reference_title: "Identification of variants of the MTR gene in patients with the cblG inborn error of cobalamin metabolism diagnosed by somatic cell complementation analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cblG inborn error of vitamin B12 metabolism is associated with pathogenic variants in the MTR gene, which encodes methionine synthase."
    explanation: Establishes MTR as the causal gene and methionine synthase as the affected enzyme.
- name: Homocysteine Remethylation Block
  description: >-
    Without methionine synthase, homocysteine cannot be remethylated to methionine using
    5-methyltetrahydrofolate as methyl donor. Homocysteine accumulates and methionine falls.
    Because the reaction is confined to the remethylation limb, methylmalonyl-CoA mutase and
    therefore methylmalonic acid handling are unaffected - the discriminating feature at the
    bedside.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: homocysteine metabolic process
    modifier: DECREASED
    term:
      id: GO:0050667
      label: homocysteine metabolic process
  downstream:
  - target: Hyperhomocysteinemia
    causal_link_type: DIRECT
  - target: Methionine and S-Adenosylmethionine Depletion
    causal_link_type: DIRECT
  - target: Methylfolate Trap
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25526710
    reference_title: "Clinical onset and course, response to treatment and outcome in 24 patients with the cblE or cblG remethylation defect complemented by genetic and in vitro enzyme study data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rare inborn errors of cobalamin metabolism leading to impairment of the remethylation of homocysteine to methionine"
    explanation: States the metabolic block this node encodes.
  - reference: PMID:34625984
    reference_title: "Methionine synthase deficiency: Variable clinical presentation and benefit of early diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It leads to a biochemical phenotype of hyperhomocysteinemia and hypomethioninemia."
    explanation: Confirms the two-directional biochemical consequence of the block.
- name: Methionine and S-Adenosylmethionine Depletion
  description: >-
    Methionine is the precursor of S-adenosylmethionine, the universal methyl donor. Falling
    methionine constrains SAM supply and therefore cellular methylation capacity, which is the
    most plausible route from this enzyme defect to the predominantly neurological phenotype -
    myelin maintenance being heavily methylation-dependent. This entry treats the SAM link as
    the mechanistic rationale for methionine supplementation rather than as a directly
    measured step in patients.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: methionine biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0071265
      label: L-methionine biosynthetic process
  chemical_entities:
  - preferred_term: methionine
    term:
      id: CHEBI:16643
      label: L-methionine
  downstream:
  - target: Cerebral White Matter Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: phenotypes#Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: phenotypes#Muscular Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:34625984
    reference_title: "Methionine synthase deficiency: Variable clinical presentation and benefit of early diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Medical management of cblG includes the use of hydroxocobalamin, betaine, folinic acid, and in some cases methionine supplementation."
    explanation: >-
      Methionine supplementation as an accepted therapy is the clinical expression of this
      node - the deficiency is treated as a real and correctable one.
- name: Methylfolate Trap
  description: >-
    Methionine synthase is the only reaction that consumes 5-methyltetrahydrofolate. When it
    fails, folate becomes metabolically stranded in the 5-methyl form and cannot re-enter the
    tetrahydrofolate pool that supplies one-carbon units for purine and thymidylate synthesis.
    The cell is therefore functionally folate-deficient despite adequate total folate, which
    is why the haematological picture is megaloblastic and why folinic acid - which bypasses
    the trap - is part of treatment.
  biological_scale: MOLECULAR
  downstream:
  - target: Megaloblastic Erythropoiesis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22108709
    reference_title: "Update and new concepts in vitamin responsive disorders of folate transport and metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Derivatives of folic acid are involved in transfer of one-carbon units in cellular metabolism, playing a role in synthesis of purines and thymidylate and in the remethylation of homocysteine to form methionine."
    explanation: >-
      Establishes the premise the trap rests on - one folate pool serves both homocysteine
      remethylation and purine/thymidylate synthesis, so blocking the first strands folate
      away from the second. The trap itself has not been measured directly in cblG patients,
      which is why this node carries mechanistic rather than patient-level evidence.
- name: Hyperhomocysteinemia
  description: >-
    Circulating total homocysteine rises markedly, with homocystinuria. Beyond being the
    diagnostic marker, homocysteine is itself injurious to endothelium, which is the accepted
    route to the thrombotic complications seen in the remethylation disorders.
  biological_scale: ORGANISM
  downstream:
  - target: Thrombotic Microangiopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:34625984
    reference_title: "Methionine synthase deficiency: Variable clinical presentation and benefit of early diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It leads to a biochemical phenotype of hyperhomocysteinemia and hypomethioninemia."
    explanation: Establishes hyperhomocysteinemia as a defining biochemical consequence.
- name: Megaloblastic Erythropoiesis
  description: >-
    Impaired thymidylate and purine synthesis in erythroid precursors produces
    nuclear-cytoplasmic asynchrony and a macrocytic, megaloblastic anaemia. This is typically
    the finding that first raises the possibility of a cobalamin disorder, and it responds
    well to treatment even where the neurological outcome does not.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  downstream:
  - target: phenotypes#Macrocytic Anemia
    causal_link_type: DIRECT
  - target: phenotypes#Failure to Thrive
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:25526710
    reference_title: "Clinical onset and course, response to treatment and outcome in 24 patients with the cblE or cblG remethylation defect complemented by genetic and in vitro enzyme study data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "failure to thrive, feeding problems, delayed milestones, muscular hypotonia, cognitive impairment and macrocytic anaemia were the most frequent symptoms"
    explanation: >-
      Macrocytic anaemia among the most frequent symptoms. Note this frequency is for the
      pooled cblE+cblG cohort, not cblG alone.
- name: Cerebral White Matter Injury
  description: >-
    Brain atrophy and white matter disease are near-universal on imaging in the reported
    cohort, and cblG appears in reviews of the leukoencephalopathies of cobalamin and folate
    metabolism. The mechanistic link runs through impaired methylation capacity rather than
    through a directly demonstrated myelin lesion in patients, so the upstream edge is
    modelled with unknown intermediates.
  biological_scale: TISSUE
  locations:
  - preferred_term: brain white matter
    term:
      id: UBERON:0003544
      label: brain white matter
  downstream:
  - target: phenotypes#Cerebral Atrophy and White Matter Disease
    causal_link_type: DIRECT
  - target: phenotypes#Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: phenotypes#Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: phenotypes#Psychiatric Manifestations of Later Onset
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:25526710
    reference_title: "Clinical onset and course, response to treatment and outcome in 24 patients with the cblE or cblG remethylation defect complemented by genetic and in vitro enzyme study data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighteen/22 patients presented with brain atrophy or white matter disease."
    explanation: >-
      The imaging finding in the largest cohort. 18/22 is a pooled cblE+cblG figure, not a
      cblG-specific rate.
  - reference: PMID:22422209
    reference_title: "Leukoencephalopathies associated with disorders of cobalamin and folate metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disorders of cobalamin and folate intracellular metabolism that result in defective remethylation of homocysteine to methionine are associated with leukodystrophy, whereas disorders of cobalamin transport generally are not."
    explanation: >-
      Ties the white matter lesion specifically to the remethylation defects rather than to
      cobalamin deficiency in general, which is the contrast that makes this node a
      consequence of the enzymatic block rather than of low cobalamin.
- name: Thrombotic Microangiopathy
  description: >-
    A rare but important complication, and the one with the sharpest diagnostic trap. In cblC
    it is a well-known presentation; in cblG only two cases are reported. The published case
    was misdiagnosed as atypical haemolytic uraemic syndrome, treated with eculizumab without
    response, and only resolved once exome sequencing found MTR variants and hydroxocobalamin
    was started - so the practical point is that a poor eculizumab response in a child with
    TMA and any developmental concern should prompt homocysteine measurement.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:28210839
    reference_title: "Thrombotic microangiopathy caused by methionine synthase deficiency: diagnosis and treatment pitfalls."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the second case of MSD associated to TMA previously diagnosed as aHUS in which the patient had a poor response to eculizumab."
    explanation: >-
      Documents both the complication and the diagnostic pitfall. A single case report, so
      this node is deliberately not given a frequency.

name: Methylcobalamin Deficiency Type cblG
category: Mendelian
creation_date: "2026-08-28T11:30:00Z"
synonyms:
- cblG
- cblG deficiency
- Cobalamin G disease
- Methionine synthase deficiency
- MTR deficiency
- Homocystinuria-megaloblastic anemia, cblG type
- HMAG
description: >-
  Methylcobalamin deficiency type cblG is an autosomal recessive disorder of intracellular
  cobalamin metabolism caused by biallelic pathogenic variants in MTR, which encodes
  methionine synthase. Methionine synthase carries out one reaction: it transfers a methyl
  group from 5-methyltetrahydrofolate to homocysteine, using methylcobalamin as the
  intermediate carrier, regenerating methionine. Losing it blocks the remethylation limb of
  cobalamin metabolism while leaving the adenosylcobalamin-dependent methylmalonyl-CoA
  mutase limb intact, which is why patients have hyperhomocysteinemia, homocystinuria and
  hypomethioninemia with normal methylmalonic acid - the biochemical signature separating
  cblG and cblE from the combined disorders cblC, cblD, cblF and cblJ.

  The distinction from cblE is worth stating precisely, because the two are often reported
  together and are the closest thing dismech has to a matched pair. cblE is a defect of
  MTRR, the flavoprotein that reductively reactivates methionine synthase after its cobalamin
  cofactor oxidises; the enzyme is present but stranded inactive, so cblE is a *functional*
  methionine synthase deficiency. cblG is loss of the enzyme itself. They converge on one
  biochemical phenotype from opposite sides of the same reaction.

  Clinically the presentation is broad and non-specific, which is the practical problem:
  neonatal seizures, encephalopathy, macrocytic anaemia, hypotonia and feeding difficulty at
  one end, psychiatric symptoms or acute neurological change in adolescence or adulthood at
  the other, with diagnosis often delayed as a result. Treatment with hydroxocobalamin,
  betaine and folinic acid reliably improves the biochemistry. Whether it changes the natural
  history is genuinely contested in the literature, and this entry records that disagreement
  rather than resolving it - see the discussions section.

  A caution about the evidence base: most cohort-level phenotype and outcome figures for
  cblG come from series that pool cblE and cblG patients. Where a number in this entry is
  pooled, the evidence explanation says so.

biochemical:
- name: NEFL-C1QL2 Projection Neuron Plasma Proteomic Age Gap
  biomarker_term:
    preferred_term: NEFL-C1QL2 projection neuron plasma proteomic aging clock (age gap)
    term:
      id: NCIT:C97139
      label: Proteomic Profile
  presence: Elevated
  context: >-
    Blood-based cell-type-specific aging clock. Plasma proteins are mapped to
    their putative cell of origin using Human Protein Atlas single-cell
    transcriptomic data, and a machine-learning model estimates that cell type's
    biological age; the age gap is the difference between that estimate and
    chronological age. "Extreme" agers are those in the upper tail of the age-gap
    distribution.
  cell_types:
  - preferred_term: NEFL-C1QL2 projection neuron
    term:
      id: CL:0000540
      label: neuron
  notes: >-
    Read the cell-type label carefully. The Human Protein Atlas catalogues this
    population as "horizontal cell", a retinal interneuron type; the authors
    renamed it NEFL-C1QL2 projection neuron because the two defining transcripts
    point at a projection-neuron identity rather than a retinal one. Curated
    under the authors' relabelling, with CL:0000540 neuron as the only defensible
    binding - there is no CL term for this population, and binding it to the
    retinal horizontal cell would import an assignment the authors explicitly
    rejected. This makes the entry a worked example of the probabilistic
    protein-to-cell-type mapping being the weakest link in these clocks. It was
    the strongest cellular-aging predictor of incident frontotemporal dementia
    (HR 3.03, 95% CI 2.47-3.72), followed by microglia (HR 2.84, 95% CI
    2.33-3.47), and also the strongest cross-sectional association with
    prevalent FTD in the GNPC cohort (n = 199 FTD cases).
  evidence:
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: extreme aging in NEFL-C1QL2 projection neurons demonstrated the strongest prognostic value
    explanation: >-
      Establishes this signature as the leading cellular-aging predictor of
      incident frontotemporal dementia among the cell types tested.
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: NEFL is a widely recognized biomarker of axonal injury, often markedly raised in FTD, while C1QL2 is a synaptic organizer known to be prominent in temporo-limbic structures vulnerable to frontotemporal lobar degeneration
    explanation: >-
      The authors' justification for both the relabelling and the disease
      relevance: one marker of axonal injury already established in FTD, one
      synaptic gene enriched in the regions FTLD targets.
  readouts:
  - target: Neuronal Death
    relationship: PREDICTS
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      An elevated NEFL-C1QL2 projection neuron age gap predicts incident
      frontotemporal dementia. The NEFL component is an established axonal-injury
      marker in FTD, which is what anchors the readout to the neurodegeneration
      arm rather than leaving it an unanchored risk score.
    evidence:
    - reference: PMID:42297981
      reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: extreme aging in NEFL-C1QL2 projection neurons demonstrated the strongest prognostic value
      explanation: >-
        Supports treating the age gap as a prognostic readout anticipating
        clinical frontotemporal dementia.
  - target: Frontal and Temporal Lobe Atrophy
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      C1QL2 is enriched in the temporo-limbic structures that frontotemporal
      lobar degeneration targets, which is the authors' basis for reading this
      signature against the regional atrophy arm. This is a regional-expression
      argument, not a measured correlation with imaged atrophy.
    evidence:
    - reference: PMID:42297981
      reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: C1QL2 is a synaptic organizer known to be prominent in temporo-limbic structures vulnerable to frontotemporal lobar degeneration
      explanation: >-
        Gives the regional-vulnerability rationale connecting the signature to
        the frontal and temporal atrophy node.
genetic:
- name: MAPT
  gene_term:
    preferred_term: MAPT
    term:
      id: hgnc:6893
      label: MAPT
  association: Mutations cause autosomal dominant FTD with tau pathology
  notes: Microtubule-associated protein tau gene on chromosome 17q21. Mutations lead to FTLD-tau pathology. Patients show earlier onset, prominent behavioral disinhibition, stereotyped behaviors, and temporal lobe predominance of atrophy. On digital cognitive assessment, MAPT carriers show a semantic-knowledge and social-cognition predominant profile.
  evidence:
  - reference: PMID:26473392
    reference_title: "Distinct clinical and pathological phenotypes in frontotemporal dementia associated with MAPT, PGRN and C9orf72 mutations."
    supports: SUPPORT
    snippet: MAPT patients were younger than other groups, and showed more frequent behavioural disinhibition, repetitive and stereotyped behaviours, semantic impairment and temporal predominance of atrophy.
    explanation: This confirms the distinct clinical and anatomical phenotype associated with MAPT mutations in frontotemporal dementia.
  - reference: PPR:PPR1289994
    reference_title: "The Ignite app detects early cognitive impairment and tracks disease severity in genetic frontotemporal dementia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "carriers exhibited pronounced impairments in semantic knowledge and social cognition"
    explanation: Digital cognitive assessment of 569 Genetic FTD Initiative participants shows MAPT carriers have a semantic-knowledge and social-cognition predominant cognitive profile.
- name: GRN
  gene_term:
    preferred_term: GRN
    term:
      id: hgnc:4601
      label: GRN
  association: Mutations cause autosomal dominant FTD with TDP-43 pathology
  notes: Progranulin gene on chromosome 17q21. Haploinsufficiency leads to FTLD-TDP pathology. Patients more likely to present with non-fluent aphasia and are older at symptom onset. GRN and C9orf72 are the most frequent genetic causes. On digital cognitive assessment, GRN carriers show an executive-function and processing-speed predominant profile, most marked at symptomatic stages.
  evidence:
  - reference: PMID:26473392
    reference_title: "Distinct clinical and pathological phenotypes in frontotemporal dementia associated with MAPT, PGRN and C9orf72 mutations."
    supports: SUPPORT
    snippet: GRN patients were older at death and more likely to present with non-fluent aphasia.
    explanation: This demonstrates the characteristic clinical presentation of GRN-related FTD with language deficits.
  - reference: PMID:30711676
    reference_title: "Clinical and biomarker changes in presymptomatic genetic frontotemporal dementia."
    supports: SUPPORT
    snippet: Presymptomatic carriers of GRN and C9orf72 mutations, the most frequent genetic causes of frontotemporal lobar degeneration, represent the optimal target population for the development of disease-modifying drugs.
    explanation: This confirms GRN as one of the two most common genetic causes of FTD.
  - reference: PPR:PPR1289994
    reference_title: "The Ignite app detects early cognitive impairment and tracks disease severity in genetic frontotemporal dementia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "carriers demonstrated marked deficits in executive function and processing speed, particularly at symptomatic stages"
    explanation: Digital cognitive assessment of 569 Genetic FTD Initiative participants shows GRN carriers have an executive-function and processing-speed predominant cognitive profile.
- name: C9orf72
  gene_term:
    preferred_term: C9orf72
    term:
      id: hgnc:28337
      label: C9orf72
  association: Hexanucleotide repeat expansion causes autosomal dominant FTD, often with ALS
  notes: Hexanucleotide (GGGGCC) repeat expansion on chromosome 9p21. Most common genetic cause of FTD. Causes FTLD-TDP pathology. Unique features include co-occurrence with ALS, psychotic symptoms, and paradoxically preserved social warmth. On digital cognitive assessment, C9orf72 carriers show the earliest and broadest deficits of the three genetic groups, spanning all six cognitive domains.
  evidence:
  - reference: PMID:26473392
    reference_title: "Distinct clinical and pathological phenotypes in frontotemporal dementia associated with MAPT, PGRN and C9orf72 mutations."
    supports: SUPPORT
    snippet: C9orf72 patients alone showed a co-occurrence of ALS. They showed more psychotic symptoms and irrational behaviour, yet were more often reported clinically as socially appropriate and warm.
    explanation: This highlights the distinctive clinical features of C9orf72-related FTD including the frequent association with ALS and unique behavioral profile.
  - reference: PMID:30711676
    reference_title: "Clinical and biomarker changes in presymptomatic genetic frontotemporal dementia."
    supports: SUPPORT
    snippet: Presymptomatic carriers of GRN and C9orf72 mutations, the most frequent genetic causes of frontotemporal lobar degeneration, represent the optimal target population for the development of disease-modifying drugs.
    explanation: This confirms C9orf72 as one of the most common genetic causes of FTD.
  - reference: PPR:PPR1289994
    reference_title: "The Ignite app detects early cognitive impairment and tracks disease severity in genetic frontotemporal dementia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutation carriers showed the earliest and broadest deficits across all cognitive domains"
    explanation: Digital cognitive assessment of 569 Genetic FTD Initiative participants shows C9orf72 carriers have the earliest and broadest cognitive impairment of the three genetic groups.
- name: CHMP2B
  gene_term:
    preferred_term: CHMP2B (charged multivesicular body protein 2B, ESCRT-III subunit)
    term:
      id: hgnc:24537
      label: CHMP2B
  association: Heterozygous C-truncating variants cause autosomal dominant FTD-3
  notes: >-
    The gene behind the chromosome 3-linked pedigree. Its pathology is FTLD-UPS
    rather than FTLD-tau or FTLD-TDP, and the two alleles shown to produce the
    aberrant endosomal phenotype both truncate the CHMP2B C-terminus.
  evidence:
  - reference: PMID:16041373
    reference_title: "Mutations in the endosomal ESCRTIII-complex subunit CHMP2B in frontotemporal dementia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we identify a mutation in CHMP2B, encoding a component of the
      endosomal ESCRTIII complex, and show that it results in aberrant mRNA
      splicing in tissue samples from affected members of this family.
    explanation: >-
      Establishes the gene-disease assertion for CHMP2B in the chromosome
      3-linked FTD family, and the splicing consequence of the founding allele.
  - reference: PMID:20301378
    reference_title: "CHMP2B-Related Frontotemporal Dementia-Amyotrophic Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHMP2B-FTD-ALS is inherited in an autosomal dominant manner. Penetrance is
      age dependent and appears to be nearly complete.
    explanation: >-
      GeneReviews gives the inheritance and penetrance for the CHMP2B form,
      which is what this genetic record asserts.
diagnosis:
- name: Montreal Cognitive Assessment
  description: >-
    Brief cognitive screening instrument. A validation study in
    behavioral-variant frontotemporal dementia found it more accurate than the
    MMSE for that syndrome, and in genetic frontotemporal dementia cohorts it
    distinguished presymptomatic pathogenic variant carriers from controls where
    the MMSE did not.
  notes: >-
    Copyright © Tina Brosseau for Center for Diagnosis & Research on Alzheimer's disease (CEDRA). Used with permission.
    The instrument is bound at its LOINC panel code and the cut-off at its
    total-score code. The instrument's items are not reproduced in this entry;
    only published thresholds are recorded. The genetic frontotemporal dementia
    study (PMID:39951678) reports group medians and discriminative accuracy but
    no cut-off, so it carries no range.
  measurements:
  - preferred_term: MoCA
    term:
      id: LOINC:72133-2
      label: Montreal Cognitive Assessment [MoCA]
  reference_ranges:
  - loinc_term:
      id: LOINC:72172-0
      label: Total score [MoCA]
    unit: '{score}'
    population: >-
      MoCA validation study for behavioral-variant frontotemporal dementia, three
      matched subgroups of 50 (bv-FTD, Alzheimer disease, healthy adults)
    notes: >-
      The abstract states the cut-off as "With a cutoff below 17 points"; a
      score below 17 falls in the positive band, which the half-open bands
      reproduce exactly. The cut-off was derived in the behavioral variant only.
    evidence:
    - reference: PMID:22859702
      reference_title: "Montreal Cognitive Assessment (MoCA): validation study for frontotemporal dementia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "With a cutoff below 17 points, the MoCA results for sensitivity, specificity, positive predictive value, negative predictive value, and classification accuracy were significantly superior to those of the MMSE."
      explanation: States the MoCA cut-off for behavioral-variant frontotemporal dementia.
    interpretation_bands:
    - name: Below 17 (screen positive for bv-FTD)
      upper_bound: 17
      unit: '{score}'
      abnormal_flag: LOW
    - name: 17 or above
      lower_bound: 17
      unit: '{score}'
      abnormal_flag: NORMAL
  evidence:
  - reference: PMID:22859702
    reference_title: "Montreal Cognitive Assessment (MoCA): validation study for frontotemporal dementia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The MoCA is a sensitive and accurate instrument for screening the patients with bv-FTD and represents a better option than the MMSE."
    explanation: Supports the MoCA as a screening instrument for behavioral-variant frontotemporal dementia.
  - reference: PMID:39951678
    reference_title: "Montreal Cognitive Assessment vs the Mini-Mental State Examination as a Screening Tool for Patients With Genetic Frontotemporal Dementia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "MoCA demonstrated superior discriminative ability compared with MMSE (MoCA area under the curve [AUC] = 0.87, 95% CI 0.81-0.94; MMSE AUC = 0.80, 95% CI 0.72-0.89)."
    explanation: Supports the MoCA as the better screening instrument in genetic frontotemporal dementia.
- name: Mini-Mental State Examination
  description: >-
    Widely used cognitive screening instrument, recorded here because the
    frontotemporal dementia literature compares the MoCA against it and uses it
    to track severity. It is less sensitive in frontotemporal dementia than the
    MoCA, and in primary progressive aphasia its dependence on language
    overestimates dementia severity.
  notes: >-
    Copyright © Vicki King for Psychological Assessment Resources. Used with permission.
    No reference range is recorded: no cited source states a frontotemporal
    dementia cut-off or severity scheme for the MMSE. A PubMed search for
    mini-mental[ti] frontotemporal[ti] returned comparisons with the MoCA and
    studies of MMSE change over time, none stating a cut-off, and
    MMSE[ti] frontotemporal[ti] cut-off returned no records. The instrument's
    items are not reproduced in this entry.
  measurements:
  - preferred_term: MMSE
    term:
      id: LOINC:72107-6
      label: Mini-Mental State Examination [MMSE]
  evidence:
  - reference: PMID:39951678
    reference_title: "Montreal Cognitive Assessment vs the Mini-Mental State Examination as a Screening Tool for Patients With Genetic Frontotemporal Dementia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "MoCA distinguished between presymptomatic carriers and controls (median MoCA 28, 95% CI 27.0-29.0), but MMSE did not."
    explanation: Records the MMSE's insensitivity to the earliest stage of genetic frontotemporal dementia.
  - reference: PMID:18166606
    reference_title: "The mini-mental state examination in behavioral variant frontotemporal dementia and primary progressive aphasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Results suggest that the MMSE score, heavily dependent on language skill, overestimates dementia severity in PPA patients. However, the score may be a more accurate measure of functional impairment in bvFTD due to the influence of their executive function and attentional deficits on MMSE performance."
    explanation: Describes how MMSE severity readings differ between the behavioral and aphasic variants.
- name: Clinical Dementia Rating
  description: >-
    Global dementia staging instrument developed for Alzheimer's disease. In
    frontotemporal dementia it is used with two added domains for behaviour and
    language, as the CDR plus National Alzheimer's Coordinating Centre Behaviour
    and Language Domains (CDR plus NACC FTLD), whose global score grades disease
    stage in genetic frontotemporal dementia cohorts.
  notes: >-
    Copyright © Washington University Charles F. and Joanne Knight Alzheimer's Disease Research Center (Knight ADRC). Used with permission.
    The binding is the original CDR panel, the only CDR code LOINC carries. A
    search of the LOINC 2.83 table (the Tuva Project extract pinned in
    data/loinc/MANIFEST.yaml) for "CDR", "dementia rating", "FTLD" and
    "frontotemporal", and of the Monarch KG for "FTLD" and "frontotemporal
    dementia rating", found no code for the CDR plus NACC FTLD or its global or
    sum-of-boxes scores, so no stage bands are recorded. The instrument's items
    are not reproduced in this entry.
  measurements:
  - preferred_term: CDR
    term:
      id: LOINC:72088-8
      label: Clinical Dementia Rating scale [CDR]
  evidence:
  - reference: PMID:38152057
    reference_title: "Utility of the Japanese version of the Clinical Dementia Rating® plus National Alzheimer's Coordinating Centre Behaviour and Language Domains for sporadic cases of frontotemporal dementia in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "This study validated the Japanese version of the CDR® plus NACC FTLD with good reliability, validity, and responsiveness."
    explanation: The CDR extended with the NACC behaviour and language domains is a validated staging instrument in frontotemporal dementia.
  - reference: PMID:39951678
    reference_title: "Montreal Cognitive Assessment vs the Mini-Mental State Examination as a Screening Tool for Patients With Genetic Frontotemporal Dementia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Grouping was based on the global CDR-plus-NACC-FTLD score."
    explanation: The global CDR plus NACC FTLD score is used to stage genetic frontotemporal dementia carriers.

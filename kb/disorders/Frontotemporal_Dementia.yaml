name: Frontotemporal Dementia
creation_date: '2025-12-23T16:19:20Z'
description: >
  Frontotemporal Dementia (FTD) is a group of neurodegenerative disorders characterized
  by progressive deterioration of the frontal and temporal lobes of the brain. It
  presents
  with prominent changes in personality, behavior, and/or language, typically with
  onset
  before age 65. FTD is associated with abnormal accumulation of tau, TDP-43, or (less commonly) FUS proteins.
category: Complex
disease_term:
  preferred_term: frontotemporal dementia
  term:
    id: MONDO:0017276
    label: frontotemporal dementia
parents:
- Dementia
- Neurodegenerative Disease
has_subtypes:
- name: Behavioral Variant FTD
  display_name: Behavioral Variant Frontotemporal Dementia (bvFTD)
  subtype_term:
    preferred_term: behavioral variant of frontotemporal dementia
    term:
      id: MONDO:0017160
      label: behavioral variant of frontotemporal dementia
  description: >
    The most common clinical presentation of FTD, characterized by progressive
    behavioral and personality change with frontal-lobe-predominant atrophy.
    Preferentially associated with MAPT mutations, which show earlier onset,
    prominent disinhibition, stereotyped behaviors, and temporal-predominant
    atrophy; also a common presentation in C9orf72 carriers, who additionally
    show psychotic symptoms and paradoxical social warmth.
  genes:
  - preferred_term: MAPT
    term:
      id: hgnc:6893
      label: MAPT
  - preferred_term: C9orf72
    term:
      id: hgnc:28337
      label: C9orf72
  evidence:
  - reference: PMID:26473392
    reference_title: "Distinct clinical and pathological phenotypes in frontotemporal dementia associated with MAPT, PGRN and C9orf72 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MAPT patients were younger than other groups, and showed more frequent behavioural disinhibition, repetitive and stereotyped behaviours, semantic impairment and temporal predominance of atrophy.
    explanation: Confirms MAPT mutations preferentially produce the behavioral-variant clinical phenotype with early disinhibition and temporal-predominant atrophy.
- name: Semantic Variant PPA
  display_name: Semantic Variant Primary Progressive Aphasia (svPPA / Semantic Dementia)
  subtype_term:
    preferred_term: semantic dementia
    term:
      id: MONDO:0010857
      label: semantic dementia
  description: >
    A language-predominant FTD syndrome characterized by progressive loss of
    semantic knowledge (anomia, impaired word comprehension, surface dyslexia)
    with anterior temporal lobe degeneration. One of the three canonical PPA
    variants (with nonfluent/agrammatic and logopenic) defined by international
    consensus criteria. Typically sporadic with underlying TDP-43 type C
    pathology, showing weaker association with the three major FTD genes than
    the behavioral or nonfluent variants.
  evidence:
  - reference: PMID:21325651
    reference_title: "Classification of primary progressive aphasia and its variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Criteria for the 3 variants of PPA--nonfluent/agrammatic, semantic, and logopenic--were developed by an international group of PPA investigators who convened on 3 occasions to operationalize earlier published clinical descriptions for PPA subtypes.
    explanation: Establishes semantic variant PPA as one of the three internationally standardized clinical PPA subtypes within the FTD spectrum.
- name: Nonfluent Variant PPA
  display_name: Nonfluent/Agrammatic Variant Primary Progressive Aphasia (nfvPPA)
  subtype_term:
    preferred_term: progressive non-fluent aphasia
    term:
      id: MONDO:0015059
      label: progressive non-fluent aphasia
  description: >
    A language-predominant FTD syndrome characterized by agrammatism, laborious
    non-fluent speech, and apraxia of speech, with relatively preserved
    comprehension. Preferentially associated with GRN mutations (older age at
    death, TDP-43 type A pathology) and also seen with C9orf72 expansions;
    non-fluent aphasia links to TDP-43 type A pathology in both groups.
  genes:
  - preferred_term: GRN
    term:
      id: hgnc:4601
      label: GRN
  evidence:
  - reference: PMID:26473392
    reference_title: "Distinct clinical and pathological phenotypes in frontotemporal dementia associated with MAPT, PGRN and C9orf72 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: GRN patients were older at death and more likely to present with non-fluent aphasia.
    explanation: Confirms GRN mutations preferentially produce the nonfluent/agrammatic-aphasia clinical phenotype.
  - reference: PMID:26473392
    reference_title: "Distinct clinical and pathological phenotypes in frontotemporal dementia associated with MAPT, PGRN and C9orf72 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Non-fluent aphasia was linked to TDP subtype A in both GRN and C9orf72 cases and ALS with subtype B.
    explanation: Links the nonfluent-aphasia phenotype to TDP-43 type A pathology across both GRN- and C9orf72-associated FTD.
- name: FTD with Motor Neuron Disease
  display_name: Frontotemporal Dementia with Motor Neuron Disease (FTD-MND / FTD-ALS)
  subtype_term:
    preferred_term: frontotemporal dementia with motor neuron disease
    term:
      id: MONDO:0017161
      label: frontotemporal dementia with motor neuron disease
  description: >
    FTD co-occurring with clinical motor neuron disease/ALS, almost exclusively
    linked to the C9orf72 hexanucleotide repeat expansion. C9orf72-associated
    ALS-FTD cases show more psychotic symptoms and paradoxical social warmth
    than MAPT- or GRN-associated FTD, and ALS co-occurrence links to TDP-43
    type B pathology.
  genes:
  - preferred_term: C9orf72
    term:
      id: hgnc:28337
      label: C9orf72
  evidence:
  - reference: PMID:26473392
    reference_title: "Distinct clinical and pathological phenotypes in frontotemporal dementia associated with MAPT, PGRN and C9orf72 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: C9orf72 patients alone showed a co-occurrence of ALS.
    explanation: Confirms that ALS co-occurrence in this FTD cohort was exclusive to C9orf72 mutation carriers.
  - reference: PMID:26473392
    reference_title: "Distinct clinical and pathological phenotypes in frontotemporal dementia associated with MAPT, PGRN and C9orf72 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Non-fluent aphasia was linked to TDP subtype A in both GRN and C9orf72 cases and ALS with subtype B.
    explanation: Links ALS co-occurrence in C9orf72-associated FTD to TDP-43 type B pathology.
- name: FTD3
  display_name: FTD3 (CHMP2B-related frontotemporal dementia-amyotrophic lateral sclerosis)
  subtype_term:
    preferred_term: CHMP2B-related frontotemporal dementia-amyotrophic lateral sclerosis
    term:
      id: MONDO:0010936
      label: frontotemporal dementia and/or amyotrophic lateral sclerosis 7
  description: >
    The chromosome 3-linked form, defined by heterozygous CHMP2B variants and
    originally delineated in a large Danish pedigree. It is a molecular subtype
    rather than a clinical one, and it is the reason this entry's molecular
    classification is not exhausted by tau, TDP-43 and FUS: its inclusions are
    ubiquitin- and p62-positive but TDP-43-negative, which is the FTLD-UPS class
    named in the FUS Proteinopathy node's description. Presentation is usually
    FTD, with ALS features in a subset, and MONDO files the class under both
    behavioral variant FTD and familial ALS; it is kept here rather than at
    the ALS entry because the dementia phenotype is the usual one.
  genes:
  - preferred_term: CHMP2B
    term:
      id: hgnc:24537
      label: CHMP2B
  evidence:
  - reference: PMID:20301378
    reference_title: "CHMP2B-Related Frontotemporal Dementia-Amyotrophic Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHMP2B-related frontotemporal dementia (FTD)-amyotrophic lateral sclerosis
      (ALS) is characterized most frequently by FTD with subtle personality
      changes and slowly progressive behavioral changes, dysexecutive syndrome,
      and language disturbances.
    explanation: >-
      GeneReviews establishes that the CHMP2B entity presents most frequently as
      frontotemporal dementia, which is what places this subtype on this entry
      rather than on the ALS entry.
  - reference: PMID:16041373
    reference_title: "Mutations in the endosomal ESCRTIII-complex subunit CHMP2B in frontotemporal dementia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have previously reported a large Danish pedigree with autosomal
      dominant frontotemporal dementia (FTD) linked to chromosome 3 (FTD3). Here
      we identify a mutation in CHMP2B, encoding a component of the endosomal
      ESCRTIII complex, and show that it results in aberrant mRNA splicing in
      tissue samples from affected members of this family.
    explanation: >-
      The founding gene-disease report: it ties the chromosome 3-linked FTD3
      locus to a CHMP2B splicing mutation, which is this subtype's defining
      genotype.
- name: GRN-FTLD-TDP
  display_name: GRN-related frontotemporal lobar degeneration with TDP-43 inclusions
  subtype_term:
    preferred_term: GRN-related frontotemporal lobar degeneration with Tdp43 inclusions
    term:
      id: MONDO:0011842
      label: GRN-related frontotemporal lobar degeneration with Tdp43 inclusions
  description: >
    The GRN-defined molecular subtype, and like FTD3 a molecular rather than a
    clinical one: it is defined by progranulin haploinsufficiency and TDP-43
    inclusions, not by a presenting syndrome. Its presentation is variable -
    behavioural, language or a mix - which is why it sits beside this entry's
    clinical rows rather than replacing one of them. The nonfluent/agrammatic
    row above is where the language presentation of this genotype is recorded
    and it binds the same gene; the two rows cut the same patients along
    different axes, the genotype and the syndrome, and neither is a parent of
    the other. Mechanistically the lesion is loss of one functional GRN allele:
    patient-derived microglia carrying pathogenic or likely pathogenic GRN
    variants lose their
    homeostatic signature, show impaired phagocytosis, and accumulate
    cytoplasmic TDP-43 with lysosomal abnormalities, which places this genotype
    on this entry's TDP-43 Proteinopathy node where GRN is already wired.
  genes:
  - preferred_term: GRN
    term:
      id: hgnc:4601
      label: GRN
  evidence:
  - reference: PMID:38347588
    reference_title: "Progranulin haploinsufficiency mediates cytoplasmic TDP-43 aggregation with lysosomal abnormalities in human microglia."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Progranulin (PGRN) haploinsufficiency due to progranulin gene (GRN) variants can cause frontotemporal dementia (FTD) with aberrant TAR DNA-binding protein 43 (TDP-43) accumulation."
    explanation: >-
      Establishes the two features that define this subtype - GRN
      haploinsufficiency and TDP-43 accumulation - and that the resulting
      disease is a frontotemporal dementia, which is what places the row on this
      entry. The quoted sentence is the BACKGROUND paragraph of the structured
      abstract and states the human genetic picture, hence HUMAN_CLINICAL with
      quote_role BACKGROUND rather than the publication's own in-vitro grading.
  - reference: PMID:38347588
    reference_title: "Progranulin haploinsufficiency mediates cytoplasmic TDP-43 aggregation with lysosomal abnormalities in human microglia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In FTD-GRN patients-derived iMGs, significant cytoplasmic TDP-43 aggregation and accumulation of lipid droplets with profound lysosomal abnormalities were observed."
    explanation: >-
      The publication's own result, in monocyte-derived microglia from patients
      carrying pathogenic GRN variants: it is the direct observation behind this
      row's placement on the TDP-43 Proteinopathy node.
  - reference: PMID:38347588
    reference_title: "Progranulin haploinsufficiency mediates cytoplasmic TDP-43 aggregation with lysosomal abnormalities in human microglia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "iMGs from FTD-GRN patients with PGRN deficiency exhibited severe neuroinflammation phenotype and failure to maintain their homeostatic molecular signatures, along with impaired phagocytosis."
    explanation: >-
      Source for the microglial part of this row's description - loss of
      homeostatic signature and impaired phagocytosis in progranulin-deficient
      patient cells.
  - reference: PMID:26473392
    reference_title: "Distinct clinical and pathological phenotypes in frontotemporal dementia associated with MAPT, PGRN and C9orf72 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Non-fluent aphasia was linked to TDP subtype A in both GRN and C9orf72 cases and ALS with subtype B.
    explanation: >-
      Ties this genotype to TDP-43 pathology in a clinicopathological cohort,
      corroborating the "with TDP-43 inclusions" half of the subtype definition
      and the overlap with the nonfluent/agrammatic clinical row.
  review_notes: >-
    Curated here rather than on kb/disorders/Primary_Progressive_Aphasia.yaml,
    which is the other entry MONDO's placement of this term points at.
    MONDO gives the term two parents, this entry's MONDO:0017276 and
    MONDO:0019806 primary progressive aphasia, so either placement is
    MONDO-sanctioned; the term's own definition opens "A frontotemporal dementia
    characterized by variable phenotypic expression typically including social,
    behavioral, or language deterioration", which makes frontotemporal dementia
    the correct parent and progressive aphasia one presentation among several.
    GRN is already a wired causal gene on this entry and reaches no mechanism
    node on the aphasia entry, so this is also where the row's gene binding
    means something. The same reasoning is recorded in that entry's notes.
pathophysiology:
- name: TDP-43 Proteinopathy
  description: >
    TAR DNA-binding protein of 43 kDa (TDP-43) is the main ubiquitinated protein
    in tau-negative frontotemporal lobar degeneration (FTLD-TDP), accounting for
    over 50% of FTD cases. TDP-43 is typically a nuclear protein, and its aggregation
    and cytoplasmic translocation are thought to represent major pathogenic steps.
    The abnormal accumulation leads to neuronal dysfunction and death.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  genes:
  - preferred_term: GRN
    term:
      id: hgnc:4601
      label: GRN
  - preferred_term: C9orf72
    term:
      id: hgnc:28337
      label: C9orf72
  downstream:
  - target: Neuronal Death
  - target: Behavioral Changes
  - target: Aphasia
  evidence:
  - reference: PMID:26473392
    reference_title: "Distinct clinical and pathological phenotypes in frontotemporal dementia associated with MAPT, PGRN and C9orf72 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: MAPT cases had tau and GRN and C9orf72, with one exception, TDP-43 pathology.
    explanation: >-
      Clinico-pathological correlation in a gene-positive cohort assigns GRN and
      C9orf72 carriers to TDP-43 pathology and MAPT carriers to tau, which is
      what places these two genes on this node and MAPT on the tau node.
  - reference: PMID:19664364
    reference_title: "TDP-43 and frontotemporal dementia."
    supports: SUPPORT
    snippet: TDP-43 is typically a nuclear protein, and its aggregation and cytoplasmic translocation are thought to represent major steps in the pathogenesis of FTLD due to TDP-43 proteinopathy (FTLD-TDP).
    explanation: This confirms that TDP-43 aggregation and mislocalization are central to the pathogenesis of FTLD-TDP, a major subtype of frontotemporal dementia.
- name: Tau Proteinopathy
  description: >
    FTLD-tau is characterized by accumulation of hyperphosphorylated tau protein,
    accounting for approximately 45% of FTD cases. This includes Pick's disease
    with characteristic Pick bodies. The tau pathology disrupts microtubule function
    and causes neuronal degeneration primarily in frontal and temporal regions.
  genes:
  - preferred_term: MAPT
    term:
      id: hgnc:6893
      label: MAPT
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Neuronal Death
  - target: Behavioral Changes
  - target: Aphasia
  evidence:
  - reference: PMID:21720721
    reference_title: "Neuropathology of frontotemporal lobar degeneration-tau (FTLD-tau)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PiD is the least common FTLD-tau characterized by neuronal Pick bodies in a stereotypic neuroanatomical distribution.
    explanation: This confirms Pick's disease (PiD), with its characteristic Pick bodies, as one of the FTLD-tau subtypes underlying the tau proteinopathy arm of FTD.
- name: FUS Proteinopathy
  description: >
    A minority of FTD cases are tau- and TDP-43-negative. Within that
    heterogeneous group (which also includes CHMP2B-associated FTLD-UPS), the
    cases whose inclusions are immunoreactive for FUS (fused in sarcoma)
    constitute FTLD-FUS, completing the TDP-43 / tau / FUS molecular triad
    underlying FTD.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Neuronal Death
  - target: Behavioral Changes
  - target: Aphasia
  evidence:
  - reference: PMID:21603977
    reference_title: "Novel types of frontotemporal lobar degeneration: beyond tau and TDP-43."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the discovery that the pathological changes in atypical FTLD with ubiquitinated inclusions, neuronal intermediate filament inclusion disease, and basophilic inclusion body disease are immunoreactive for the fused in sarcoma (FUS) protein, resulting in the creation of a new molecular subgroup (FTLD-FUS)
    explanation: Establishes FTLD-FUS as a distinct, tau/TDP-43-negative molecular subgroup of frontotemporal lobar degeneration.
- name: CHMP2B C-Truncation and Aberrant Endosome Formation
  description: >
    The CHMP2B lesion acts on a different compartment from the three
    proteinopathies above. The chromosome 3 splice-acceptor mutation and an
    analogous nonsense mutation both predict a C-truncated CHMP2B, and expressing
    either in neuroblastoma cells produces large aberrant endosomal structures,
    so the proposed mechanism is disturbed endosome function in an ESCRT-III
    subunit rather than aggregation of a cytoplasmic protein. The pathology that
    follows is ubiquitin- and p62-positive and TDP-43-negative, which is why
    FTD-3 was reclassified as FTLD with ubiquitin-positive inclusions.
  biological_scale: CELLULAR
  genes:
  - preferred_term: CHMP2B
    term:
      id: hgnc:24537
      label: CHMP2B
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: endosome organization
    term:
      id: GO:0007032
      label: endosome organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:17956895
    reference_title: "CHMP2B C-truncating mutations in frontotemporal lobar degeneration are associated with an aberrant endosomal phenotype in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Overexpression of Belgian p.Gln165X in human neuroblastoma SK-N-SH cells
      showed the formation of large, aberrant endosomal structures that were
      highly similar to those observed for Danish p.Met178ValfsX2.
    explanation: >-
      The cell-based measurement behind this node: two independently arising
      C-truncating CHMP2B alleles both produce the same aberrant endosomal
      morphology.
  - reference: PMID:17917582
    reference_title: "A reassessment of the neuropathology of frontotemporal dementia linked to chromosome 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The finding of ubiquitin- and p62-positive, TDP-43-negative cytoplasmic
      inclusions in the hippocampus and neocortex suggests reclassification of
      the neuropathology of FTD-3 as a unique subtype of frontotemporal lobar
      degeneration with ubiquitin-positive inclusions that are TDP-43-negative.
    explanation: >-
      Human postmortem material from the chromosome 3 family places this node's
      pathology outside the tau, TDP-43 and FUS classes, which is the reason it
      is modeled as a separate node.
  downstream:
  - target: Neuronal Death
    description: >-
      Cortical neuron loss is what the postmortem material from the affected
      family shows, alongside microvacuolation of layer II and mild gliosis.
    evidence:
    - reference: PMID:17917582
      reference_title: "A reassessment of the neuropathology of frontotemporal dementia linked to chromosome 3."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Microscopy showed loss of cortical neurons, microvacuolation of layer II,
        mild gliosis, and demyelination of the deep white matter.
      explanation: >-
        Reports the cortical neuron loss this edge asserts, in the same four
        autopsied family members that carry the inclusion pathology.
  - target: Personality Changes
    description: >-
      The clinical picture the CHMP2B lesion produces opens with subtle
      personality change and slowly progressive behavioral change, with
      disinhibition or loss of initiative the commonest presenting symptom.
    evidence:
    - reference: PMID:20301378
      reference_title: "CHMP2B-Related Frontotemporal Dementia-Amyotrophic Lateral Sclerosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CHMP2B-related frontotemporal dementia (FTD)-amyotrophic lateral
        sclerosis (ALS) is characterized most frequently by FTD with subtle
        personality changes and slowly progressive behavioral changes,
        dysexecutive syndrome, and language disturbances.
      explanation: >-
        GeneReviews names the personality change as a leading feature of the
        CHMP2B entity, which is the edge from this node to that phenotype.
    - reference: PMID:20301378
      reference_title: "CHMP2B-Related Frontotemporal Dementia-Amyotrophic Lateral Sclerosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Disinhibition or loss of initiative is the most common presenting symptom.
      explanation: >-
        Supports the ranking this edge's description makes. The preceding item
        establishes personality and behavioral change as the leading features but
        ranks nothing within them, so this sentence is what carries the claim that
        disinhibition or loss of initiative is the commonest presenting symptom.
- name: Frontal and Temporal Lobe Atrophy
  description: >
    Progressive neuronal loss and atrophy predominantly affecting the frontal and
    temporal lobes, with patterns varying by genetic subtype. MAPT mutations show
    temporal predominance, while GRN and C9orf72 mutations may show more variable
    patterns. This structural degeneration underlies the behavioral and language deficits.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Behavioral Changes
  - target: Aphasia
  evidence:
  - reference: PMID:26473392
    reference_title: "Distinct clinical and pathological phenotypes in frontotemporal dementia associated with MAPT, PGRN and C9orf72 mutations."
    supports: SUPPORT
    snippet: MAPT patients were younger than other groups, and showed more frequent behavioural disinhibition, repetitive and stereotyped behaviours, semantic impairment and temporal predominance of atrophy.
    explanation: This demonstrates the genotype-specific patterns of brain atrophy and their relationship to clinical phenotypes in frontotemporal dementia.
  - reference: PMID:42390534
    reference_title: "Visual rating scales of atrophy differentiate sporadic behavioral variant frontotemporal dementia from primary psychiatric disorder: DIPPA study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All VRS yielded higher atrophy in bvFTD than in PPD patients. The Orbitofrontal, the Anterior-Temporal, and the Fronto-Insula scales were the strongest discriminators.
    explanation: Multicenter study identifying specific atrophy patterns (orbitofrontal, anterior-temporal, fronto-insular regions) as diagnostic biomarkers for distinguishing bvFTD from primary psychiatric disorder using visual rating scales.
- name: Neuronal Death
  description: >
    Progressive loss of neurons in frontal and temporal cortices due to protein
    aggregation toxicity, leading to brain atrophy and functional decline. The
    neurodegeneration progresses over years to decades, with biomarker changes
    detectable up to 30 years before symptom onset in genetic cases.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:30711676
    reference_title: "Clinical and biomarker changes in presymptomatic genetic frontotemporal dementia."
    supports: SUPPORT
    snippet: We observed that biological changes and intracortical facilitation transmission abnormalities significantly antecede the emergence of clinical symptoms of at least 3 decades.
    explanation: Supports long presymptomatic neurobiological change in genetic FTD, but does not directly quantify neuronal death in the quoted text.
  downstream:
  - target: Frontal and Temporal Lobe Atrophy
    description: >-
      Accumulated neuron loss is what the macroscopic atrophy is made of, which
      is why the atrophy node sits downstream of this one rather than beside it.
    evidence:
    - reference: PMID:17917582
      reference_title: "A reassessment of the neuropathology of frontotemporal dementia linked to chromosome 3."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Gross examination revealed generalized cortical atrophy that was most
        severe in frontal and temporal cortices.
      explanation: >-
        Pairs the gross frontotemporal atrophy with the microscopic cortical
        neuron loss reported in the same autopsy series, which is the direction
        of this edge.
  - target: Dementia
    description: >-
      Whatever the initiating proteinopathy, the accumulating neuron loss ends in
      a global dementia; the trajectory is measured in years to decades rather
      than months.
    evidence:
    - reference: PMID:20301678
      reference_title: "MAPT-Related Frontotemporal Dementia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        MAPT-FTD is a progressive disorder that commonly ends with a relatively
        global dementia in which some affected individuals become mute.
      explanation: >-
        GeneReviews states the endpoint of the progressive degeneration for the
        MAPT form; the quote is about one genetic subtype, so the edge to a
        disease-level dementia phenotype takes one generalizing step.
      directness: INDIRECT
phenotypes:
- category: Neurological
  name: Behavioral Changes
  phenotype_term:
    preferred_term: Behavioral Changes
    term:
      id: HP:0000708
      label: Atypical behavior
  frequency: VERY_FREQUENT
  diagnostic: true
  notes: Prominent behavioral changes including disinhibition, apathy, loss of empathy, compulsive behaviors, and dietary changes. Particularly characteristic of behavioral variant FTD.
  evidence:
  - reference: PMID:26473392
    reference_title: "Distinct clinical and pathological phenotypes in frontotemporal dementia associated with MAPT, PGRN and C9orf72 mutations."
    supports: SUPPORT
    snippet: MAPT patients were younger than other groups, and showed more frequent behavioural disinhibition, repetitive and stereotyped behaviours, semantic impairment and temporal predominance of atrophy.
    explanation: This confirms that behavioral disinhibition and repetitive stereotyped behaviors are core clinical features of genetic FTD, particularly in MAPT mutations.
- category: Neurological
  name: Aphasia
  frequency: VERY_FREQUENT
  diagnostic: true
  notes: Progressive language impairment, particularly non-fluent aphasia in GRN mutations and semantic variant primary progressive aphasia. Language deficits may be the presenting feature.
  evidence:
  - reference: PMID:26473392
    reference_title: "Distinct clinical and pathological phenotypes in frontotemporal dementia associated with MAPT, PGRN and C9orf72 mutations."
    supports: SUPPORT
    snippet: GRN patients were older at death and more likely to present with non-fluent aphasia.
    explanation: This demonstrates that non-fluent aphasia is a characteristic presenting feature in patients with GRN mutations causing frontotemporal dementia.
  phenotype_term:

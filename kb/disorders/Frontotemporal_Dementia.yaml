    term:
      id: NCIT:C170740
      label: Symptomatic Therapy
- name: Speech and Language Therapy
  description: Speech therapy interventions for patients with language-variant FTD to maintain communication abilities and quality of life for as long as possible.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care

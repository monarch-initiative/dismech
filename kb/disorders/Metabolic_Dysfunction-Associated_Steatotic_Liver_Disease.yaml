    term:
      id: HP:0001395
      label: Hepatic fibrosis
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:25935633
    reference_title: Liver Fibrosis, but No Other Histologic Features, Is Associated With Long-term Outcomes of Patients With Nonalcoholic Fatty Liver Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      stage 2 (HR, 2.89; 95% CI, 1.93-4.33), stage 3 (HR, 3.76; 95% CI,
      2.40-5.89), and stage 4 (HR, 10.9; 95% CI, 6.06-19.62) compared with stage
      0
    explanation: >-
      Documents fibrosis across histologic stages in a MASLD cohort together with
      its prognostic gradient.
- category: Gastrointestinal
  name: Cirrhosis
  description: >-
    Advanced, architecture-distorting fibrosis reached by a minority of people
    with MASLD, carrying the risk of decompensation and hepatocellular carcinoma.
  phenotype_term:
    preferred_term: Cirrhosis
    term:
      id: HP:0001394
      label: Cirrhosis
  evidence:
  - reference: PMID:25935633
    reference_title: Liver Fibrosis, but No Other Histologic Features, Is Associated With Long-term Outcomes of Patients With Nonalcoholic Fatty Liver Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-six patients (4.2%) developed liver-related events; fibrosis stage 3
      (HR, 14.2; 95% CI, 3.38-59.68) and stage 4 (HR, 51.5; 95% CI, 9.87-269.2)
      compared with stage 0, were associated significantly with the events.
    explanation: >-
      Stage 4 fibrosis is cirrhosis; in a 619-patient longitudinal MASLD cohort it
      carried by far the highest hazard of liver-related events, establishing
      cirrhosis as a human clinical endpoint of the disease.
- category: Gastrointestinal
  name: Hepatocellular carcinoma

name: Metabolic Dysfunction-Associated Steatotic Liver Disease
creation_date: '2026-08-01T00:00:00Z'
description: >-
  Metabolic dysfunction-associated steatotic liver disease (MASLD) is hepatic
  steatosis occurring in the presence of at least one cardiometabolic risk
  factor and in the absence of another identified cause of steatosis. It is the
  most prevalent chronic liver disease worldwide. Adipose-tissue insulin
  resistance and overnutrition deliver free fatty acids to the liver and drive
  de novo lipogenesis, so that hepatocyte lipid inflow exceeds the capacity for
  fatty acid oxidation and very-low-density lipoprotein export. Accumulating
  toxic lipid species, together with impaired mitochondrial quality control
  (mitophagy), provoke endoplasmic reticulum and oxidative stress, hepatocyte
  death, Kupffer-cell and macrophage inflammatory activation
  (metabolic dysfunction-associated steatohepatitis, MASH), hepatic stellate
  cell activation, and progressive fibrosis that can culminate in cirrhosis and
  hepatocellular carcinoma. Fibrosis stage, not steatosis or inflammation grade,
  is the histologic feature that tracks long-term outcome. Management centres on
  weight loss and cardiometabolic risk reduction, with resmetirom the first
  agent approved specifically for MASH with fibrosis.
synonyms:
- MASLD
- Nonalcoholic fatty liver disease
- NAFLD
- Non-alcoholic fatty liver disease
- Metabolic dysfunction-associated fatty liver disease
category: Complex
parents:
- Hepatic Disease
disease_term:
  preferred_term: metabolic dysfunction-associated steatotic liver disease
  term:
    id: MONDO:0013209
    label: metabolic dysfunction-associated steatotic liver disease
has_subtypes:
- name: MASL
  display_name: Metabolic dysfunction-associated steatotic liver (isolated steatosis)
  description: >-
    Hepatic steatosis with a cardiometabolic risk factor but without the
    necessary histologic features of steatohepatitis. Progression risk is lower
    than in MASH, but this is a stage of the same disease rather than a distinct
    entity.
  evidence:
  - reference: PMID:37363821
    reference_title: A multisociety Delphi consensus statement on new fatty liver disease nomenclature.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Steatotic liver disease was chosen as an overarching term to encompass the
      various aetiologies of steatosis.
    explanation: >-
      The consensus statement establishes steatotic liver disease as the
      overarching term under which the bland-steatosis stage sits.
- name: MASH
  display_name: Metabolic dysfunction-associated steatohepatitis (MASH/NASH)
  description: >-
    The inflammatory subtype, defined histologically by steatosis with lobular
    inflammation and hepatocellular ballooning. MASH is the stage from which
    progressive fibrosis, cirrhosis, and hepatocellular carcinoma most often
    arise, and is the target population of the current approved and
    investigational drug therapies.
  subtype_term:
    preferred_term: metabolic dysfunction-associated steatohepatitis
    term:
      id: MONDO:0007027
      label: metabolic dysfunction-associated steatohepatitis
  evidence:
  - reference: PMID:37363821
    reference_title: A multisociety Delphi consensus statement on new fatty liver disease nomenclature.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The term steatohepatitis was felt to be an important pathophysiological
      concept that should be retained.
    explanation: >-
      The nomenclature consensus retains steatohepatitis as a distinct
      pathophysiological stage within steatotic liver disease.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_lipotoxic_multihit_masld
  hypothesis_label: Canonical lipid-overload and lipotoxicity model
  status: CANONICAL
  description: >-
    Insulin resistance and overnutrition drive hepatocyte lipid overload from
    adipose-derived free fatty acids and de novo lipogenesis. Toxic lipid
    species then produce organelle stress, hepatocyte death, macrophage
    inflammation, stellate-cell activation, and fibrosis. This is the
    established backbone of the MASLD pathograph and is shared with the
    hepatic_steatosis_lipotoxicity module.
  evidence:
  - reference: PMID:15864352
    reference_title: Sources of fatty acids stored in liver and secreted via lipoproteins in patients with nonalcoholic fatty liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These quantitative metabolic data document that both elevated peripheral
      fatty acids and DNL contribute to the accumulation of hepatic and
      lipoprotein fat in NAFLD.
    explanation: >-
      Stable-isotope quantification in patients establishes the two lipid inflow
      routes that begin the canonical chain.
- hypothesis_group_id: impaired_mitophagy_amplifier
  hypothesis_label: Impaired mitophagy as an amplifier of MASLD progression
  status: EMERGING
  description: >-
    Failure of selective autophagic clearance of damaged mitochondria
    (mitophagy) is proposed to amplify the transition from bland steatosis to
    steatohepatitis by allowing dysfunctional, reactive-oxygen-species-producing
    mitochondria to persist and by licensing inflammasome activation. The human
    evidence is largely correlative; the causal experiments are in cultured
    hepatocytes and rodent models, so this is modeled as an emerging amplifier
    rather than an established requirement for human disease progression.
  evidence:
  - reference: PMID:42412329
    reference_title: 'Mitophagy in Metabolic Dysfunction-Associated Fatty Liver Disease: Mechanisms, Regulatory Networks, and Therapeutic Perspectives.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We then discuss how impaired mitophagy drives the disease progression of
      MASLD from the perspective of different hepatic cell types.
    explanation: >-
      The review frames impaired mitophagy as a driver of MASLD progression
      while presenting it as a synthesis of mechanistic rather than clinical
      outcome data.
  - reference: PMID:34674097
    reference_title: Deoxycholic Acid Promotes Pyroptosis in Free Fatty Acid-Induced Steatotic Hepatocytes by Inhibiting PINK1-Mediated Mitophagy.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      our data showed that DCA-induced pyroptosis involves the inhibition of
      PINK1-mediated mitophagy and the activation of the NLRP3 inflammasome.
    explanation: >-
      A cell-culture model supports the mitophagy-to-inflammation link but does
      not establish it in human liver, bounding the hypothesis as emerging.
- hypothesis_group_id: sinusoidal_endothelial_dysfunction_masld
  hypothesis_label: Liver sinusoidal endothelial dysfunction as an early driver
  status: EMERGING
  description: >-
    An endothelium-first model in which loss of the liver sinusoidal endothelial
    cell (LSEC) phenotype — capillarization (loss of fenestrae) and loss of
    shear-responsive vasodilator production — occurs early, before overt
    steatohepatitis, and then licenses inflammatory-cell recruitment and hepatic
    stellate cell activation rather than merely following hepatocyte injury.
    This is deliberately modeled as a parallel arm of the pathograph, not a
    replacement for the canonical lipotoxic backbone: the human data are
    cross-sectional histology, and the causal experiments are
    endothelium-specific mouse models. The same endothelial lesion has been
    proposed as the axis shared with atherosclerosis, where vascular endothelial
    dysfunction initiates lipoprotein retention and leukocyte recruitment;
    whether dismech should represent that shared axis as a cross-disease module
    or a comorbidity entry is an open scope question (issue #6352), so no
    cross-disease structure is asserted here.
  evidence:
  - reference: PMID:30797053
    reference_title: Role of liver sinusoidal endothelial cells in non-alcoholic fatty liver disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Capillarization, namely the loss of LSEC fenestrae, and LSEC dysfunction,
      namely the loss of the ability of LSECs to generate vasodilator agents in
      response to increased shear stress both occur early in NAFLD.
    explanation: >-
      States the temporal claim the hypothesis rests on — that the endothelial
      lesion is early rather than a downstream consequence of steatohepatitis.
  - reference: PMID:31726115
    reference_title: A defect in endothelial autophagy occurs in patients with non-alcoholic steatohepatitis and promotes inflammation and fibrosis.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In mice fed a high-fat diet, deficiency in endothelial autophagy induced
      liver expression of inflammatory markers (Ccl2, Ccl5, Cd68, Vcam-1), liver
      cell apoptosis (cleaved caspase-3) and perisinusoidal fibrosis.
    explanation: >-
      An endothelium-specific mouse model supplies the causal direction, but the
      corresponding human data are observational, which is why this is modeled
      as emerging rather than canonical.
- hypothesis_group_id: osa_intermittent_hypoxia_masld
  hypothesis_label: Obstructive sleep apnea-associated chronic intermittent hypoxia
    as a progression driver
  status: EMERGING
  description: >-
    Chronic intermittent hypoxia (CIH) — the cyclical desaturation-reoxygenation
    of obstructive sleep apnea — is proposed to act on the liver as a second hit
    that is separable from adiposity, upregulating SREBP-1/SCD-1-dependent
    hepatic lipogenesis and generating hepatic lipid peroxidation, and thereby
    accelerating the transition from steatosis to steatohepatitis and fibrosis.
    This is deliberately modeled as a parallel arm of the pathograph rather than
    a replacement for the canonical lipotoxic backbone, and as EMERGING rather
    than CANONICAL, for three reasons that the curated evidence states directly.
    (1) The human data are observational, and they do not agree with each other
    endpoint by endpoint: the largest individual-participant meta-analysis
    attributes the fibrosis association mainly to body mass index by causal
    mediation analysis while finding apnea severity an independent risk factor
    for steatosis, whereas the one cohort scored on liver biopsy inverts that
    pattern, finding an obesity-adjusted fibrosis association but no association
    with steatosis or steatohepatitis. Each edge therefore carries both the
    supporting and the refuting human result. (2) The causal, dose-controlled
    experiments — including the
    HIF-1 dependence of the triglyceride response — are five-day murine
    intermittent-hypoxia exposures in lean mice, a model that produced no
    additional effect in already-obese mice. (3) Correcting the exposure does
    not correct the liver: randomized trials of CPAP monotherapy show no change
    in steatosis, fibrosis or aminotransferases. A curator extending this arm
    should preserve that asymmetry rather than resolving it, and should not
    curate CPAP as a MASLD therapy.
  evidence:
  - reference: PMID:32843301
    reference_title: 'Obstructive sleep apnea, chronic obstructive pulmonary disease
      and NAFLD: an individual participant data meta-analysis.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This meta-analysis confirms the strong association between steatosis and
      the severity of OSA. The relation between OSA and fibrosis is mainly due to
      BMI as shown by causal mediation analysis.
    explanation: >-
      PARTIAL, and it is the sentence that bounds the hypothesis: 2120-patient
      individual-participant data support the steatosis limb while assigning the
      fibrosis limb to adiposity rather than to the hypoxic exposure.
  - reference: PMID:16507783
    reference_title: Altered metabolic responses to intermittent hypoxia in mice with
      partial deficiency of hypoxia-inducible factor-1alpha.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We conclude that 1) the effect of IH on serum TG levels is mediated through
      HIF-1, 2) HIF-1 may impact on posttranscriptional regulation of SREBP-1
    explanation: >-
      Supplies the causal molecular direction the observational human data cannot
      — a HIF-1alpha heterozygous-null comparison showing the triglyceride
      response to intermittent hypoxia is HIF-1-dependent. Murine, which is why
      the hypothesis stays EMERGING.

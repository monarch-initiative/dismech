pathophysiology:
- name: Cardiometabolic Dysfunction and Adipose Insulin Resistance
  biological_scale: ORGANISM
  role: trigger
  description: >-
    MASLD is defined by hepatic steatosis in the presence of at least one
    cardiometabolic risk factor (overweight/obesity, dysglycaemia or type 2
    diabetes, hypertension, hypertriglyceridaemia, or low HDL cholesterol).
    Adipose-tissue insulin resistance fails to restrain lipolysis, so
    non-esterified fatty acids flood the portal circulation, while
    hyperinsulinaemia and carbohydrate surplus drive hepatic de novo
    lipogenesis. This cardiometabolic state is the initiating context that
    distinguishes MASLD from other steatotic liver diseases.
  cell_types:
  - preferred_term: adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: cellular response to insulin stimulus
    term:
      id: GO:0032869
      label: cellular response to insulin stimulus
    modifier: DECREASED
  evidence:
  - reference: PMID:37363821
    reference_title: A multisociety Delphi consensus statement on new fatty liver disease nomenclature.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There was consensus to change the definition to include the presence of at
      least 1 of 5 cardiometabolic risk factors.
    explanation: >-
      The nomenclature consensus makes cardiometabolic dysfunction a definitional
      requirement of MASLD, establishing it as the entry point of the pathograph.
  - reference: PMID:42412329
    reference_title: 'Mitophagy in Metabolic Dysfunction-Associated Fatty Liver Disease: Mechanisms, Regulatory Networks, and Therapeutic Perspectives.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Metabolic dysfunction-associated fatty liver disease (MASLD) represents the
      most prevalent chronic liver disorder globally, with pathogenesis closely
      linked to insulin resistance, obesity, and gut microbiota dysbiosis.
    explanation: >-
      Ties MASLD pathogenesis to insulin resistance and obesity, the substrate of
      this trigger node.
  downstream:
  - target: Hepatocyte Lipid Overload
    description: >-
      Adipose insulin resistance and overnutrition supply the fatty acid inflow
      and lipogenic drive that produce hepatocyte lipid accumulation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15864352
      reference_title: Sources of fatty acids stored in liver and secreted via lipoproteins in patients with nonalcoholic fatty liver disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Of the TAG accounted for in liver, 59.0% +/- 9.9% of TAG arose from
        NEFAs; 26.1% +/- 6.7%, from DNL; and 14.9% +/- 7.0%, from the diet.
      explanation: >-
        Directly quantifies adipose-derived non-esterified fatty acids and de novo
        lipogenesis as the dominant sources of stored hepatic triglyceride.
  - target: Liver Sinusoidal Endothelial Cell Dysfunction and Capillarization
    description: >-
      The same cardiometabolic state that drives hepatocyte lipid loading also
      acts on the sinusoidal endothelium: insulin resistance and dyslipidaemia
      exacerbate endothelial activation and lipid handling across vascular and
      hepatic beds. This edge is what makes the endothelial arm a branch of the
      shared cardiometabolic trigger rather than a second, unexplained
      initiating step.
    causal_link_type: DIRECT
    hypothesis_groups:
    - sinusoidal_endothelial_dysfunction_masld
    evidence:
    - reference: PMID:42430855
      reference_title: 'Endothelial Cells at the Crossroad of Atherosclerosis and Metabolic Dysfunction-Associated Steatotic Liver Disease: A Unifying Target for Dual Treatment.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        We further discuss how metabolic disturbances including insulin
        resistance and dyslipidemia exacerbate endothelial activation, lipid
        accumulation, and immune cell responses across vascular and hepatic
        beds.
      explanation: >-
        Names insulin resistance and dyslipidaemia — the content of this trigger
        node — as what exacerbates endothelial activation in the hepatic bed.

- name: Hepatocyte Lipid Overload
  conforms_to: 'hepatic_steatosis_lipotoxicity#Hepatocyte Lipid Overload'
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    Hepatocyte triglyceride accumulates when fatty acid inflow from adipose
    lipolysis and diet, plus de novo lipogenesis, exceeds fatty acid oxidation
    and very-low-density lipoprotein export. In MASLD the disorder-specific
    inflow is metabolic (adipose insulin resistance and carbohydrate surplus)
    rather than ethanol-driven, but the resulting lipid-droplet overload is the
    conserved module state.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: triglyceride biosynthetic process
    term:
      id: GO:0019432
      label: triglyceride biosynthetic process
    modifier: INCREASED
  - preferred_term: lipid storage
    term:
      id: GO:0019915
      label: lipid storage
    modifier: INCREASED
  - preferred_term: fatty acid beta-oxidation
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
    modifier: DECREASED
  evidence:
  - reference: PMID:15864352
    reference_title: Sources of fatty acids stored in liver and secreted via lipoproteins in patients with nonalcoholic fatty liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nonalcoholic fatty liver disease (NAFLD) is characterized by the
      accumulation of excess liver triacylglycerol (TAG), inflammation, and liver
      damage.
    explanation: >-
      Defines the hepatocyte triglyceride-overload state that this node
      represents.
  downstream:
  - target: Impaired Hepatocyte Mitophagy
    description: >-
      Lipid overload and the associated mitochondrial workload are proposed to
      overwhelm and then suppress mitochondrial quality control.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - impaired_mitophagy_amplifier
    evidence:
    - reference: PMID:42412329
      reference_title: 'Mitophagy in Metabolic Dysfunction-Associated Fatty Liver Disease: Mechanisms, Regulatory Networks, and Therapeutic Perspectives.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Mitochondrial dysfunction is central to MASLD progression
      explanation: >-
        Supports an edge from the lipid-overloaded hepatocyte state to
        mitochondrial quality-control failure while leaving the intermediate
        steps unresolved.
  - target: Lipotoxic Stress and Organelle Dysfunction
    description: >-
      Continued lipid loading generates toxic non-triglyceride lipid species that
      stress the endoplasmic reticulum and mitochondria.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42412329
      reference_title: 'Mitophagy in Metabolic Dysfunction-Associated Fatty Liver Disease: Mechanisms, Regulatory Networks, and Therapeutic Perspectives.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Mitochondrial dysfunction is central to MASLD progression
      explanation: >-
        Places organelle dysfunction downstream of the lipid-overloaded hepatocyte
        in MASLD progression.

- name: Impaired Hepatocyte Mitophagy
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    Mitophagy is the selective autophagic clearance of damaged mitochondria,
    executed through ubiquitin-dependent (PINK1/Parkin) and
    ubiquitin-independent receptor pathways. In steatotic hepatocytes this
    quality-control step is suppressed, so depolarized,
    reactive-oxygen-species-producing mitochondria persist and NLRP3 inflammasome
    activation and
    pyroptotic hepatocyte death are licensed. This node carries the emerging
    mitophagy hypothesis and is not asserted as a required step in every case.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: mitophagy
    term:
      id: GO:0000423
      label: mitophagy
    modifier: DECREASED
  evidence:
  - reference: PMID:42412329
    reference_title: 'Mitophagy in Metabolic Dysfunction-Associated Fatty Liver Disease: Mechanisms, Regulatory Networks, and Therapeutic Perspectives.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mitochondrial dysfunction is central to MASLD progression, and mitophagy
    explanation: >-
      The review establishes mitochondrial dysfunction and mitophagy as central
      to MASLD progression, the substrate of this node.
  - reference: PMID:34674097
    reference_title: Deoxycholic Acid Promotes Pyroptosis in Free Fatty Acid-Induced Steatotic Hepatocytes by Inhibiting PINK1-Mediated Mitophagy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression levels of the mitophagy markers PTEN-induced kinase 1 (PINK1)
      and E3 ubiquitin ligase Parkin were significantly diminished by DCA
    explanation: >-
      In free-fatty-acid-loaded HepG2 cells, a bile acid relevant to
      steatohepatitis suppresses the PINK1/Parkin mitophagy machinery.
  downstream:
  - target: Lipotoxic Stress and Organelle Dysfunction
    description: >-
      Failure to clear damaged mitochondria sustains reactive oxygen species
      production and organelle stress in the steatotic hepatocyte.
    causal_link_type: DIRECT
    hypothesis_groups:
    - impaired_mitophagy_amplifier
    evidence:
    - reference: PMID:42412329
      reference_title: 'Mitophagy in Metabolic Dysfunction-Associated Fatty Liver Disease: Mechanisms, Regulatory Networks, and Therapeutic Perspectives.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        a selective form of autophagy that clears damaged mitochondria
      explanation: >-
        Defines the clearance function whose loss leaves damaged mitochondria in
        place as a source of organelle stress.
  - target: Hepatocyte Injury and Inflammatory Activation
    description: >-
      Suppressed PINK1-mediated mitophagy permits NLRP3 inflammasome activation
      and pyroptotic hepatocyte death, an inflammatory route that bypasses the
      generic lipotoxic-stress step.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - impaired_mitophagy_amplifier
    intermediate_mechanisms:
    - NLRP3 inflammasome activation
    evidence:
    - reference: PMID:34674097
      reference_title: Deoxycholic Acid Promotes Pyroptosis in Free Fatty Acid-Induced Steatotic Hepatocytes by Inhibiting PINK1-Mediated Mitophagy.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        induction of mitophagy by CCCP prevented DCA-induced inflammatory response
      explanation: >-
        Restoring mitophagy pharmacologically blocks the inflammatory response in
        steatotic hepatocytes, supporting the edge in a cell model only.

- name: Lipotoxic Stress and Organelle Dysfunction
  conforms_to: 'hepatic_steatosis_lipotoxicity#Lipotoxic Stress and Organelle Dysfunction'
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    Toxic non-triglyceride lipid species (diacylglycerols, ceramides, free fatty
    acid metabolites) accumulate alongside stored triglyceride and induce
    endoplasmic reticulum stress, mitochondrial dysfunction, and reactive oxygen
    species accumulation. This is the amplification step that converts bland
    steatosis (MASL) toward steatohepatitis (MASH).
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
    modifier: INCREASED
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:42412329
    reference_title: 'Mitophagy in Metabolic Dysfunction-Associated Fatty Liver Disease: Mechanisms, Regulatory Networks, and Therapeutic Perspectives.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mitochondrial dysfunction is central to MASLD progression
    explanation: >-
      Establishes organelle (mitochondrial) dysfunction as a central step in
      MASLD progression.
  - reference: PMID:20427778
    reference_title: Pioglitazone, vitamin E, or placebo for nonalcoholic steatohepatitis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vitamin E therapy, as compared with placebo, was associated with a
      significantly higher rate of improvement in nonalcoholic steatohepatitis
      (43% vs. 19%, P=0.001)
    explanation: >-
      Benefit from an antioxidant in a randomized trial is indirect human support
      for oxidative stress as a modifiable amplifier, not proof of the mechanism.
  downstream:
  - target: Hepatocyte Injury and Inflammatory Activation
    description: >-
      Organelle stress sensitizes the hepatocyte to lipoapoptosis and other
      regulated cell death, which releases damage signals to resident macrophages.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28585211
      reference_title: Non-Alcoholic Fatty Liver Disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Furthermore, hepatocyte lipoapoptosis is a critical feature of NASH.
      explanation: >-
        Places lipoapoptosis, the cell-death output of lipotoxic organelle
        stress, at the core of the steatohepatitis stage.


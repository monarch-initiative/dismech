  evidence:
  - reference: PMID:20427778
    reference_title: Pioglitazone, vitamin E, or placebo for nonalcoholic steatohepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vitamin E was superior to placebo for the treatment of nonalcoholic
      steatohepatitis in adults without diabetes.
    explanation: >-
      The trial conclusion, including its restriction to adults without diabetes.
- name: Pioglitazone
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    A PPAR-gamma agonist insulin sensitizer. In PIVENS it reduced steatosis,
    inflammation, and aminotransferases but did not meet the primary histologic
    endpoint in adults without diabetes, and caused weight gain. Modeled as
    acting on the cardiometabolic trigger.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pioglitazone
      term:
        id: CHEBI:8228
        label: pioglitazone
  target_mechanisms:
  - target: Cardiometabolic Dysfunction and Adipose Insulin Resistance
    treatment_effect: INHIBITS
    description: >-
      Insulin sensitization restrains adipose lipolysis and reduces fatty acid
      delivery to the liver.
    evidence:
    - reference: PMID:20427778
      reference_title: Pioglitazone, vitamin E, or placebo for nonalcoholic steatohepatitis.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Serum alanine and aspartate aminotransferase levels were reduced with
        vitamin E and with pioglitazone, as compared with placebo (P<0.001 for
        both comparisons)
      explanation: >-
        Documents a biochemical treatment effect for the insulin sensitizer
        without asserting a histologic primary-endpoint benefit.
  evidence:
  - reference: PMID:20427778
    reference_title: Pioglitazone, vitamin E, or placebo for nonalcoholic steatohepatitis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the difference in the rate of improvement with pioglitazone as compared
      with placebo was not significant (34% and 19%, respectively; P=0.04)
    explanation: >-
      The primary histologic comparison for pioglitazone did not reach the
      prespecified significance threshold, bounding the claim.
- name: Bariatric surgery
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    Metabolic (bariatric) surgery in people with severe obesity and biopsy-proven
    MASH produced resolution of steatohepatitis in most patients at five years,
    with progressive fibrosis regression. Evidence is from a prospective cohort
    with paired biopsies rather than a randomized trial.
  treatment_term:
    preferred_term: bariatric surgery
    term:
      id: NCIT:C84399
      label: Bariatric Surgery
  target_mechanisms:
  - target: Hepatic Stellate Cell Activation and Fibrosis
    treatment_effect: INHIBITS
    description: >-
      Sustained large-magnitude weight loss removes the upstream metabolic drive
      and permits regression of established fibrosis.
    evidence:
    - reference: PMID:32553765
      reference_title: Bariatric Surgery Provides Long-term Resolution of Nonalcoholic Steatohepatitis and Regression of Fibrosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Fibrosis began to decrease by 1 year after surgery and continued to
        decrease until 5 years
      explanation: >-
        Documents progressive regression of the fibrotic effector lesion after
        surgery.
  evidence:
  - reference: PMID:32553765
    reference_title: Bariatric Surgery Provides Long-term Resolution of Nonalcoholic Steatohepatitis and Regression of Fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 5 years after bariatric surgery, NASH was resolved, without worsening
      fibrosis, in samples from 84% of patients
    explanation: >-
      Gives the five-year steatohepatitis-resolution rate from the paired-biopsy
      cohort.
diagnosis:
- name: Positive cardiometabolic criteria alongside hepatic steatosis
  description: >-
    MASLD is diagnosed positively rather than by exclusion: hepatic steatosis on
    imaging or histology plus at least one of five cardiometabolic risk factors
    (overweight/obesity, dysglycaemia or type 2 diabetes, hypertension,
    hypertriglyceridaemia, low HDL cholesterol). This replaces the old NAFLD
    definition, which required excluding other causes of steatosis. Steatosis with
    no cardiometabolic parameter and no identified cause is classified instead as
    cryptogenic steatotic liver disease.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    Hepatic steatosis plus at least one of five cardiometabolic risk factors
    establishes MASLD; steatosis with no metabolic parameter and no known cause is
    cryptogenic SLD.
  evidence:
  - reference: PMID:37363821
    reference_title: A multisociety Delphi consensus statement on new fatty liver disease nomenclature.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There was consensus to change the definition to include the presence of at
      least 1 of 5 cardiometabolic risk factors.
    explanation: >-
      The multisociety Delphi consensus establishes the cardiometabolic-criteria
      basis of the current positive case definition.
  - reference: PMID:37363821
    reference_title: A multisociety Delphi consensus statement on new fatty liver disease nomenclature.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Those with no metabolic parameters and no known cause were deemed to have
      cryptogenic steatotic liver disease.
    explanation: >-
      Defines the residual category that the cardiometabolic criteria separate
      MASLD from.
- name: Alcohol-intake assessment to separate MASLD from MetALD
  description: >-
    Weekly alcohol intake must be quantified, because metabolic dysfunction and
    greater alcohol consumption together define MetALD, a category outside pure
    MASLD with different management. The consensus thresholds are 140-350 g/week
    for females and 210-420 g/week for males.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    Intake above the sex-specific weekly threshold reclassifies the patient as
    MetALD rather than MASLD.
  evidence:
  - reference: PMID:37363821
    reference_title: A multisociety Delphi consensus statement on new fatty liver disease nomenclature.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      termed metabolic and alcohol related/associated liver disease (MetALD), was
      selected to describe those with metabolic dysfunction-associated steatotic
      liver disease, who consume greater amounts of alcohol per week (140-350 g/wk
      and 210-420 g/wk for females and males, respectively).
    explanation: >-
      Gives the sex-specific weekly alcohol thresholds that bound the MASLD
      category.
- name: Ultrasound with controlled attenuation parameter for steatosis detection
  description: >-
    Ultrasound-based controlled attenuation parameter (CAP), measured on the same
    device as transient elastography, non-invasively detects and grades hepatic
    steatosis by the increased attenuation of ultrasound in fat-laden liver. Used
    in the resmetirom phase 3 trial with a threshold of more than 280 dB/m.
  diagnosis_term:
    preferred_term: ultrasound imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  results: >-
    A controlled attenuation parameter above roughly 280 dB/m supports significant
    hepatic steatosis.
  evidence:
  - reference: PMID:38324483
    reference_title: A Phase 3, Randomized, Controlled Trial of Resmetirom in NASH with Liver Fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Controlled attenuation parameter is a method for the noninvasive assessment
      of steatosis
    explanation: >-
      Establishes CAP as the non-invasive steatosis measure used for trial
      eligibility.
- name: Vibration-controlled transient elastography for fibrosis risk stratification
  description: >-
    Liver stiffness measured by vibration-controlled transient elastography is the
    principal non-invasive test for identifying clinically significant fibrosis and
    is the gateway to specialist referral in MASLD care pathways.
  diagnosis_term:
    preferred_term: elastography
    term:
      id: NCIT:C106517
      label: Elastography
  results: >-
    Liver stiffness above 8.5 kPa indicates fibrosis stage F2 or higher.
  evidence:
  - reference: PMID:38324483
    reference_title: A Phase 3, Randomized, Controlled Trial of Resmetirom in NASH with Liver Fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Liver stiffness was measured by means of vibration-controlled transient
      elastography. Values of more than 8.5 are considered to be indicative of
      fibrosis of stage F2 or higher.
    explanation: >-
      Gives the liver-stiffness threshold used to identify clinically significant
      fibrosis.
- name: MRI proton density fat fraction for liver fat quantification
  description: >-
    MRI-PDFF is the quantitative reference standard for non-invasive liver fat
    measurement and is the standard steatosis endpoint in MASH trials.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    An MRI-PDFF above 5% indicates hepatic steatosis.
  evidence:
  - reference: PMID:38324483
    reference_title: A Phase 3, Randomized, Controlled Trial of Resmetirom in NASH with Liver Fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      quantitative biomarker to assess liver fat content. A reading of more than 5%
      is considered to be high.
    explanation: >-
      Gives the MRI-PDFF threshold for high liver fat content.
- name: FIB-4 index for advanced fibrosis triage
  description: >-
    The Fibrosis-4 index is a serum-based score derived from platelet count, AST,
    ALT and age. It is the recommended first-line triage test in primary care
    because it uses routinely available results and identifies people who need
    elastography or specialist referral.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    A FIB-4 score above 2.67 indicates advanced fibrosis and an elevated risk of
    liver-related events.
  evidence:
  - reference: PMID:38324483
    reference_title: A Phase 3, Randomized, Controlled Trial of Resmetirom in NASH with Liver Fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Scores of more than 2.67 are considered to be indicative of advanced fibrosis
      and an elevated risk of liver-related events.
    explanation: >-
      Gives the FIB-4 threshold for advanced fibrosis and its prognostic
      significance.
- name: Liver biopsy for steatohepatitis activity grading and fibrosis staging
  description: >-
    Percutaneous liver biopsy remains the only test that separates MASH from bland
    steatosis and stages fibrosis directly. It grades the three NAFLD activity score
    components and assigns a fibrosis stage F0-F4, and remains the required endpoint
    measure in registrational MASH trials despite its sampling variability and
    procedural risk.
  diagnosis_term:
    preferred_term: liver biopsy
    term:
      id: NCIT:C51677
      label: Liver Biopsy
  results: >-
    An activity score of 4 or more with at least 1 point for each component
    indicates at-risk MASH; fibrosis is staged F0-F4.
  evidence:
  - reference: PMID:38324483
    reference_title: A Phase 3, Randomized, Controlled Trial of Resmetirom in NASH with Liver Fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NAFLD activity scores of 4 or more are considered to indicate at-risk
      nonalcoholic steatohepatitis (NASH).
    explanation: >-
      Gives the biopsy-derived activity threshold defining at-risk steatohepatitis.
  - reference: PMID:38324483
    reference_title: A Phase 3, Randomized, Controlled Trial of Resmetirom in NASH with Liver Fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fibrosis stages range from F0 (no fibrosis) to F4 (cirrhosis). A stage of F1B
      indicates moderate fibrosis, pericentral area only.
    explanation: >-
      Gives the biopsy fibrosis staging scale that determines prognosis and
      treatment eligibility.
discussions:
- discussion_id: kgap_masld_osa_cpap_hepatic_benefit
  prompt: >-
    If chronic intermittent hypoxia is a genuine driver of MASLD progression, why
    does correcting it with CPAP not improve the liver — and is the hypoxic
    exposure therefore a causal driver, a marker of adiposity, or a driver whose
    damage is not reversible on trial timescales?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Obstructive Sleep Apnea-Associated Chronic Intermittent Hypoxia
  - pathophysiology#Hypoxia-Driven Hepatic Lipogenesis and Oxidative Stress
  rationale: >-
    The observational and mechanistic arms of this hypothesis point one way and
    the interventional arm points the other, and the disagreement is the gap.
    Observationally, hypoxia metrics track hepatic severity after adjustment for
    obesity in biopsy-based cohorts; mechanistically, controlled murine
    intermittent hypoxia raises hepatic SREBP-1/SCD-1 and liver triglyceride, and
    the triglyceride response is HIF-1-dependent. Yet randomized trials of CPAP
    monotherapy show no change in steatosis, fibrosis or aminotransferases, and a
    2026 scoping review of 74 studies reports that what hepatic improvement does
    occur in CPAP trials tracks weight change rather than correction of
    sleep-disordered breathing. At least four readings remain open and the
    curated evidence does not discriminate between them: the association is
    residual confounding by adiposity that adjustment did not remove; CPAP
    adherence in the trials was too low or the follow-up too short to register a
    histological change; hypoxia contributes to establishing steatosis but not to
    sustaining it once the metabolic state exists; or the hepatic lesion is real
    but not reversible without concurrent weight loss. Until one of these is
    settled, CPAP must not be curated as a MASLD treatment, and the hypoxia arm
    must not be promoted out of EMERGING.
  evidence:
  - reference: PMID:29151428
    reference_title: 'Continuous Positive Airway Pressure in Patients With Obstructive
      Sleep Apnea and Non-Alcoholic Steatohepatitis: A Systematic Review and Meta-Analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After CPAP treatment, no changes in liver steatosis, liver fibrosis, and
      aminotransferase levels (alanine aminotransferase and aspartate
      aminotransferase) were found.
    explanation: >-
      Five randomized controlled trials pooled; the null interventional result
      that creates the gap. The authors grade the evidence low to very low, which
      is itself part of why the question stays open rather than being answered
      negatively.
  - reference: PPR:PPR1293874
    reference_title: 'The Association and Treatment of Metabolic
      Dysfunction-Associated Steatotic Liver Disease in Obstructive Sleep Apnoea:
      A Scoping Review'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      RCTs demonstrated limited hepatic benefit from CPAP monotherapy, with
      improvements more closely related to weight change than correction of OSA
      alone.
    explanation: >-
      A 74-study scoping review that states the weight-versus-airway attribution
      explicitly. Cited as a non-peer-reviewed preprint and deliberately not the
      sole support for any claim here — the same null result is carried by the
      peer-reviewed randomized-trial meta-analysis above.
  proposed_experiments:
  - experiment_id: exp_masld_cpap_adherence_stratified_pdff
    name: Adherence-stratified CPAP trial with MRI-PDFF and hypoxic-burden endpoints
    description: >-
      Randomize CPAP-naive patients with biopsy- or MRI-confirmed MASLD and
      moderate-to-severe OSA to CPAP versus sham, with telemonitored objective
      adherence, weight held as a prespecified covariate rather than an outcome,
      and MRI proton density fat fraction plus liver stiffness at 12 months. Test
      whether a hepatic effect emerges above an adherence threshold and above a
      hypoxic-burden threshold, both of which prior trials averaged below.
    experiment_type:
      preferred_term: adherence-stratified randomized sham-controlled trial
    decision_criterion: >-
      A dose-response between nightly CPAP hours (or reduction in time below 90%
      saturation) and fall in MRI-PDFF, independent of weight change, supports the
      hypoxia arm as causal and reversible; a flat response across the adherence
      range with weight change explaining the variance supports adiposity as the
      operative variable.
    would_support:
    - pathophysiology#Obstructive Sleep Apnea-Associated Chronic Intermittent Hypoxia
    would_refute:
    - pathophysiology#Hypoxia-Driven Hepatic Lipogenesis and Oxidative Stress
  - experiment_id: exp_masld_ih_weight_clamped_rodent
    name: Weight-clamped intermittent hypoxia exposure in diet-induced steatohepatitis
    description: >-
      Expose mice with established diet-induced steatohepatitis to intermittent
      hypoxia versus normoxia under pair-feeding so body weight and adiposity are
      matched between arms, then measure hepatic SREBP-1/SCD-1, 4-hydroxynonenal
      adducts, NAFLD activity score and fibrosis stage, with a
      hepatocyte-specific Hif1a deletion arm. This separates the hypoxic signal
      from the adiposity it is confounded with in every human cohort, and tests
      whether the effect exists on an already-steatotic background rather than
      only in the lean state where it was first shown.
    experiment_type:
      preferred_term: pair-fed intermittent-hypoxia exposure with conditional knockout
    decision_criterion: >-
      Higher activity score or fibrosis stage in the hypoxia arm at matched body
      weight, abolished by hepatocyte Hif1a deletion, establishes a
      weight-independent hepatic effect of intermittent hypoxia; no difference at
      matched weight argues the human association is adiposity-mediated.
    would_support:
    - pathophysiology#Hypoxia-Driven Hepatic Lipogenesis and Oxidative Stress
notes: >-
  Naming follows the 2023 multisociety Delphi consensus: MASLD replaces NAFLD and
  MASH replaces NASH, with steatotic liver disease as the overarching term.
  Because MetALD (metabolic dysfunction plus greater alcohol intake) is defined by
  that consensus as a category outside pure MASLD, it is deliberately not modeled
  here as a subtype; the alcohol arm lives in the Alcohol-Associated Liver Disease
  entry. Most cited evidence predates the nomenclature change and therefore uses
  NAFLD/NASH terminology and the exclusion-based case definition; snippets are
  quoted verbatim in the original terminology. The mitophagy node is deliberately
  marked as an emerging amplifier: the causal experiments are in cultured
  hepatocytes and rodent models, and no human trial has yet shown that restoring
  mitophagy changes MASLD outcomes. Fibrosis stage, not steatohepatitis activity,
  is the outcome-determining lesion, which is why the fibrosis node carries the
  prognostic evidence. Prevalence figures are imaging-based NAFLD estimates and
  approximate rather than exactly measure MASLD. The histopathology section models
  the three NAFLD activity score components plus fibrosis staging; hepatocellular
  ballooning is left without a bound ontology term because NCIT codes only the
  grading assessment (NCIT:C181484), not the morphologic finding, and no HP term
  under Abnormal cell morphology covers it either. The obstructive sleep apnea
  arm is curated with three deliberate omissions a later curator should not
  silently reverse. CPAP is not curated as a treatment: the pooled randomized
  evidence is null for steatosis, fibrosis and aminotransferases, so a
  target_mechanisms edge into the hypoxia node would assert an efficacy the
  evidence refuses. Sleep fragmentation is not modeled as a separate MASLD node
  even though it is a real consequence of apnea, because the studies that
  separate the two components attribute the hepatic signal to the hypoxic one;
  the fragmentation arm belongs to Obstructive_Sleep_Apnea, whose own
  kgap_osa_multiorgan_fibrosis discussion already names the liver. And no
  comorbidity entry is created for the pair: the interventional evidence is
  null and both the steatosis and the fibrosis limbs are contested, so a com_
  entry would have to assert
  a shared-mechanism direction the sources do not yet license — revisit if a
  weight-independent effect is demonstrated.

phenotypes:
- category: Gastrointestinal
  name: Hepatic steatosis
  description: >-
    Excess triglyceride stored in hepatocyte lipid droplets is the defining
    lesion of MASLD and is detected by imaging or histology.
  phenotype_term:
    preferred_term: Hepatic steatosis
    term:
      id: HP:0001397
      label: Hepatic steatosis
  evidence:
  - reference: PMID:15864352
    reference_title: Sources of fatty acids stored in liver and secreted via lipoproteins in patients with nonalcoholic fatty liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nonalcoholic fatty liver disease (NAFLD) is characterized by the
      accumulation of excess liver triacylglycerol (TAG), inflammation, and liver
      damage.
    explanation: >-
      Identifies hepatic triacylglycerol accumulation as the characteristic
      lesion.
- category: Laboratory
  name: Elevated serum alanine aminotransferase
  description: >-
    Aminotransferase elevation is a common but insensitive marker of hepatocyte
    injury in MASLD; normal values do not exclude steatohepatitis or fibrosis.
  phenotype_term:

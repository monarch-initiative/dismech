    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      higher circulating levels of alanine transaminase, a marker of liver injury
    explanation: >-
      Links raised circulating alanine transaminase to liver injury in fatty
      liver disease cohorts.
- category: Endocrine
  name: Insulin resistance
  description: >-
    Impaired insulin action in adipose tissue, muscle, and liver is a
    definitional cardiometabolic feature of MASLD.
  phenotype_term:
    preferred_term: Insulin resistance
    term:
      id: HP:0000855
      label: Insulin resistance

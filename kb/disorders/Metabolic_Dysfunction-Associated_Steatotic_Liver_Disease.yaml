    reference_title: Deoxycholic Acid Promotes Pyroptosis in Free Fatty Acid-Induced Steatotic Hepatocytes by Inhibiting PINK1-Mediated Mitophagy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Nonalcoholic steatohepatitis (NASH) is the inflammatory subtype of
      nonalcoholic fatty liver disease (NAFLD), which can lead to liver fibrosis
      and cirrhosis.
    explanation: >-
      Defines steatohepatitis as the inflammatory stage that connects hepatocyte
      injury to downstream fibrosis.
  downstream:
  - target: Hepatic Stellate Cell Activation and Fibrosis
    description: >-
      Sustained hepatocyte death and macrophage activation provide the cytokine
      and damage-signal milieu that activates hepatic stellate cells.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33989548
      reference_title: Mechanisms and disease consequences of nonalcoholic fatty liver disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        bile acid toxicity, macrophage dysfunction, and hepatic stellate cell
        activation, and consider the role of genetic, epigenetic, and
        environmental factors that promote fibrosis progression
      explanation: >-
        Couples macrophage dysfunction to hepatic stellate cell activation as the
        pathogenetic route to fibrosis progression.

- name: Liver Sinusoidal Endothelial Cell Dysfunction and Capillarization
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    Liver sinusoidal endothelial cells (LSECs) are the fenestrated gatekeepers
    between portal blood and the hepatocyte, and in health they hold Kupffer
    cells and hepatic stellate cells quiescent. In MASLD they capillarize —
    losing their fenestrae and their shear-responsive vasodilator output — and
    lose autophagic capacity, converting them from a restraining influence into
    a source of inflammatory and fibrogenic mediators. This node is the hepatic
    limb of the endothelial arm; it is not on the canonical lipotoxic backbone
    and is grouped under the emerging
    sinusoidal_endothelial_dysfunction_masld hypothesis.
  cell_types:
  - preferred_term: liver sinusoidal endothelial cell
    term:
      id: CL:1000398
      label: endothelial cell of hepatic sinusoid
  biological_processes:
  - preferred_term: macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
    modifier: DECREASED
  - preferred_term: leukocyte migration
    term:
      id: GO:0050900
      label: leukocyte migration
    modifier: INCREASED
  - preferred_term: nitric oxide biosynthetic process
    term:
      id: GO:0006809
      label: nitric oxide biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:31726115
    reference_title: A defect in endothelial autophagy occurs in patients with non-alcoholic steatohepatitis and promotes inflammation and fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with NASH had half as many LSECs containing autophagic vacuoles
      as patients without liver histological abnormalities, or with simple
      steatosis.
    explanation: >-
      Transmission electron microscopy in patient liver establishes the
      autophagy defect in LSECs as a human, not merely a model-system, finding.
  - reference: PMID:42430855
    reference_title: 'Endothelial Cells at the Crossroad of Atherosclerosis and Metabolic Dysfunction-Associated Steatotic Liver Disease: A Unifying Target for Dual Treatment.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Similarly, in MASLD, liver sinusoidal endothelial cells lose their
      capacity to regulate lipid trafficking, immune tolerance, and hepatic
      homeostasis, thereby promoting steatosis, inflammation, and fibrosis.
    explanation: >-
      Names the three functions this node loses and the downstream states they
      permit — steatosis, inflammation, and fibrosis — which are the three edges
      below.
  downstream:
  - target: Hepatocyte Lipid Overload
    description: >-
      The defining endothelium-first claim of this arm: capillarization and loss
      of shear-responsive vasodilator output occur early in the disease and
      themselves favour steatosis, rather than arising as a consequence of
      established hepatocyte injury. This is the edge that orders the endothelial
      lesion ahead of, not alongside, the steatohepatitis events below.
    causal_link_type: DIRECT
    hypothesis_groups:
    - sinusoidal_endothelial_dysfunction_masld
    evidence:
    - reference: PMID:30797053
      reference_title: Role of liver sinusoidal endothelial cells in non-alcoholic fatty liver disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        These LSEC changes favour steatosis development and set the stage for
        NAFLD progression.
      explanation: >-
        States the steatosis-promoting direction of the edge, and follows
        immediately on the review's statement that both LSEC changes occur early
        in NAFLD, which is what licenses the endothelium-first ordering.
  - target: Hepatocyte Injury and Inflammatory Activation
    description: >-
      Capillarized LSECs switch from restraining to recruiting: they release
      inflammatory mediators and support leukocyte adhesion and transmigration,
      adding an endothelial source to the macrophage-driven inflammation of
      MASH.
    causal_link_type: DIRECT
    hypothesis_groups:
    - sinusoidal_endothelial_dysfunction_masld
    evidence:
    - reference: PMID:30797053
      reference_title: Role of liver sinusoidal endothelial cells in non-alcoholic fatty liver disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        At the stage of non-alcoholic steatohepatitis, altered LSECs release
        inflammatory mediators and contribute to the recruitment of inflammatory
        cells, thus promoting liver injury and inflammation.
      explanation: >-
        States the edge directly, and locates it at the steatohepatitis stage
        rather than in bland steatosis.
  - target: Hepatic Stellate Cell Activation and Fibrosis
    description: >-
      Healthy LSECs actively maintain stellate-cell quiescence; the capillarized
      endothelium withdraws that restraint and adds fibrogenic signals, giving a
      route to fibrosis that does not require hepatocyte death as the
      intermediate.
    causal_link_type: DIRECT
    hypothesis_groups:
    - sinusoidal_endothelial_dysfunction_masld
    evidence:
    - reference: PMID:30797053
      reference_title: Role of liver sinusoidal endothelial cells in non-alcoholic fatty liver disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Altered LSECs also fail to maintain hepatic stellate cell quiescence and
        release fibrogenic mediators, including Hedgehog signalling molecules,
        promoting liver fibrosis.
      explanation: >-
        Supplies both halves of the edge — loss of the quiescence-maintaining
        function and positive release of fibrogenic mediators.

- name: Hepatic Stellate Cell Activation and Fibrosis
  conforms_to: 'hepatic_steatosis_lipotoxicity#Hepatic Stellate Cell Activation and Fibrosis'
  biological_scale: TISSUE
  role: effector
  description: >-
    Hepatic stellate cells transdifferentiate into myofibroblast-like cells and
    deposit excessive extracellular matrix. Fibrosis stage is the histologic
    feature that determines long-term outcome in MASLD, independent of
    steatohepatitis activity, which makes this node the principal prognostic and
    therapeutic target.
  cell_types:
  - preferred_term: hepatic stellate cell
    term:
      id: CL:0000632
      label: hepatic stellate cell
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:25935633
    reference_title: Liver Fibrosis, but No Other Histologic Features, Is Associated With Long-term Outcomes of Patients With Nonalcoholic Fatty Liver Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with fibrosis, regardless of steatohepatitis or NAFLD activity
      score, had shorter survival times than patients without fibrosis.
    explanation: >-
      A 619-patient longitudinal cohort establishes fibrosis, and not
      inflammatory activity, as the outcome-determining lesion.
  downstream:
  - target: Hepatic Steatosis Progressing to Steatohepatitis and Fibrosis
    description: >-
      Progressive matrix deposition distorts hepatic architecture and yields
      cirrhosis, portal hypertension, hepatic decompensation, and hepatocellular
      carcinoma.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25935633
      reference_title: Liver Fibrosis, but No Other Histologic Features, Is Associated With Long-term Outcomes of Patients With Nonalcoholic Fatty Liver Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Twenty-six patients (4.2%) developed liver-related events; fibrosis stage
        3 (HR, 14.2; 95% CI, 3.38-59.68) and stage 4 (HR, 51.5; 95% CI,
        9.87-269.2) compared with stage 0, were associated significantly with the
        events.
      explanation: >-
        Quantifies the stage-dependent escalation from fibrosis to
        liver-related clinical events.

- name: Hepatic Steatosis Progressing to Steatohepatitis and Fibrosis
  conforms_to: 'hepatic_steatosis_lipotoxicity#Hepatic Steatosis Progressing to Steatohepatitis and Fibrosis'
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The convergent clinical outcome: bland steatosis advancing through
    steatohepatitis to bridging fibrosis, cirrhosis, hepatic decompensation, and
    hepatocellular carcinoma. Most people with MASLD never reach this end of the
    spectrum, but fibrosis stage stratifies who will.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:25935633
    reference_title: Liver Fibrosis, but No Other Histologic Features, Is Associated With Long-term Outcomes of Patients With Nonalcoholic Fatty Liver Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a longitudinal study of patients with NAFLD, fibrosis stage, but no
      other histologic features of steatohepatitis, were associated independently
      with long-term overall mortality, liver transplantation, and liver-related
      events.
    explanation: >-
      Defines the clinical consequence set (mortality, transplantation,
      liver-related events) and its histologic determinant.

- name: PNPLA3 rs738409 Genetic Susceptibility
  biological_scale: MOLECULAR
  role: susceptibility
  description: >-
    The PNPLA3 rs738409 (I148M) allele increases hepatic triglyceride content and
    hepatic inflammation, and accounts for much of the ancestry-related variation
    in susceptibility to fatty liver. It is a susceptibility modifier of lipid
    retention rather than a necessary or sufficient cause of MASLD.
  genes:
  - preferred_term: PNPLA3
    term:
      id: hgnc:18590
      label: PNPLA3
  evidence:
  - reference: PMID:18820647
    reference_title: Genetic variation in PNPLA3 confers susceptibility to nonalcoholic fatty liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      strongly associated with increased hepatic fat levels (P = 5.9 x 10(-10))
      and with hepatic inflammation (P = 3.7 x 10(-4)).
    explanation: >-
      The genome-wide association scan establishes the rs738409 allele as
      associated with both hepatic fat and inflammation.
  downstream:
  - target: Hepatocyte Lipid Overload
    description: >-
      Carriage of the 148M allele raises steady-state hepatic triglyceride
      content, shifting the lipid-overload node toward disease.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18820647
      reference_title: Genetic variation in PNPLA3 confers susceptibility to nonalcoholic fatty liver disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        variation in PNPLA3 contributes to ancestry-related and inter-individual
        differences in hepatic fat content and susceptibility to NAFLD.
      explanation: >-
        Links the locus to hepatic fat content while leaving the molecular
        intermediates unresolved.

- name: TM6SF2 p.Glu167Lys Genetic Susceptibility
  biological_scale: MOLECULAR
  role: susceptibility
  description: >-
    The TM6SF2 p.Glu167Lys variant reduces TM6SF2 protein levels and impairs
    hepatic very-low-density lipoprotein export, raising liver triglyceride while
    lowering circulating LDL cholesterol and triglycerides. It is the
    prototypical example of the discordance between hepatic fat accumulation and
    cardiovascular lipid risk in MASLD.
  genes:
  - preferred_term: TM6SF2
    term:
      id: hgnc:11861
      label: TM6SF2
  evidence:
  - reference: PMID:24531328
    reference_title: Exome-wide association study identifies a TM6SF2 variant that confers susceptibility to nonalcoholic fatty liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The TM6SF2 variant encoding p.Glu167Lys was also associated with higher
      circulating levels of alanine transaminase, a marker of liver injury, and
      with lower levels of low-density lipoprotein-cholesterol (LDL-C),
      triglycerides and alkaline phosphatase in 3 independent populations
    explanation: >-
      Establishes the variant's paired hepatic-injury and lipid-lowering
      signature across three independent cohorts.
  downstream:
  - target: Hepatocyte Lipid Overload
    description: >-
      Reduced TM6SF2 protein impairs very-low-density lipoprotein export, so
      triglyceride is retained in the hepatocyte.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced TM6SF2 protein abundance
    - Impaired hepatic VLDL secretion
    evidence:
    - reference: PMID:24531328
      reference_title: Exome-wide association study identifies a TM6SF2 variant that confers susceptibility to nonalcoholic fatty liver disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        When recombinant protein was expressed in cultured hepatocytes, 50% less
        Glu167Lys TM6SF2 protein was produced relative to wild-type TM6SF2.
      explanation: >-
        Identifies reduced protein abundance as the intermediate between genotype
        and hepatic lipid retention.

- name: Obstructive Sleep Apnea-Associated Chronic Intermittent Hypoxia
  biological_scale: ORGANISM
  role: trigger
  description: >-
    Obstructive sleep apnea imposes repeated nocturnal
    desaturation-reoxygenation cycles on the liver. The exposure is quantified
    clinically by the apnea-hypopnea index, the oxygen desaturation index, and
    the proportion of sleep time spent below 90% saturation, and it is these
    hypoxia metrics rather than the arousal burden that track hepatic severity.
    The node is curated as a comorbid, potentially modifiable initiating context
    that sits alongside — not inside — the cardiometabolic trigger, because the
    two are strongly correlated through obesity and the curated evidence
    disagrees about how much survives adjustment for it. Sleep fragmentation is
    deliberately not modeled here: the studies that separate the two attribute
    the hepatic signal to the hypoxic component.
  biological_processes:
  - preferred_term: response to hypoxia
    term:
      id: GO:0001666
      label: response to hypoxia
    modifier: INCREASED
    temporality: RECURRENT
  evidence:
  - reference: PMID:21703181
    reference_title: Chronic intermittent hypoxia is a major trigger for non-alcoholic
      fatty liver disease in morbid obese.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In multivariate analysis, after adjustment for age, obesity, and insulin
      resistance status, CIH remained independently associated with hepatic
      fibrosis, fibroinflammation, and NAS.
    explanation: >-
      101 prospectively recruited morbidly obese patients with intraoperative
      liver biopsy and desaturation-index-graded hypoxia. This is the strongest
      curated statement that the hypoxic exposure carries hepatic signal after
      adjustment for the adiposity it travels with.
  - reference: PMID:40884485
    reference_title: Association between obstructive sleep apnea and liver fibrosis
      in patients with suspected nonalcoholic fatty liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similar association was found with nocturnal hypoxia markers (oxygen
      desaturation index and the time spent under 90% of saturation).
    explanation: >-
      Biopsy-proven cohort with in-lab polysomnography; establishes that the
      hypoxia metrics, not merely the OSA label, are what carry the association,
      which is why this node is named for the hypoxic exposure.
  downstream:
  - target: Hypoxia-Driven Hepatic Lipogenesis and Oxidative Stress
    description: >-
      Cyclical desaturation-reoxygenation is the upstream exposure that drives
      the hepatic lipogenic and oxidative response.
    causal_link_type: DIRECT
    hypothesis_groups:
    - osa_intermittent_hypoxia_masld
    evidence:
    - reference: PMID:16123334
      reference_title: Intermittent hypoxia induces hyperlipidemia in lean mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In lean mice, IH increased sterol regulatory element binding protein 1
        (SREBP-1) levels in the liver, increased mRNA and protein levels of
        stearoyl-coenzyme A desaturase 1 (SCD-1), an important gene of TG and PL
        biosynthesis controlled by SREBP-1
      explanation: >-
        A controlled five-day intermittent-hypoxia exposure, which is what makes
        this an edge rather than a correlation. Murine, and the same study found
        no additional effect in already-obese mice.

- name: Hypoxia-Driven Hepatic Lipogenesis and Oxidative Stress
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    Intermittent hypoxia raises hepatic SREBP-1 and its target stearoyl-CoA
    desaturase 1, increasing triglyceride and phospholipid biosynthesis, and the
    reoxygenation half of each cycle generates reactive oxygen species so that
    the hepatocyte experiences a repeated ischemia-reperfusion-like insult. The
    lipogenic limb is HIF-1-dependent in mice; the oxidative limb is the one
    measured directly in human liver, as in-situ 4-hydroxynonenal staining and
    urinary F2-isoprostanes that scale with the nocturnal hypoxia metrics. The
    node therefore feeds both the lipid-overload state and the injury state of
    the canonical backbone rather than substituting for either.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: cellular response to hypoxia
    term:
      id: GO:0071456
      label: cellular response to hypoxia
    modifier: INCREASED
  - preferred_term: triglyceride biosynthetic process
    term:
      id: GO:0019432
      label: triglyceride biosynthetic process
    modifier: INCREASED
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:27501738
    reference_title: Nocturnal hypoxia-induced oxidative stress promotes progression
      of pediatric non-alcoholic fatty liver disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data support the role of nocturnal hypoxia as a trigger for localized
      hepatic oxidative stress, an important factor associated with the
      progression of NASH and hepatic fibrosis in obese pediatric patients.
    explanation: >-
      The human measurement behind the oxidative limb — urinary F2-isoprostanes
      and hepatic 4-hydroxynonenal immunostaining in biopsy-proven NAFLD, both
      correlating with the polysomnographic hypoxia metrics. Paediatric, so the
      age generalization is not asserted.
  - reference: PMID:16123334
    reference_title: Intermittent hypoxia induces hyperlipidemia in lean mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In lean mice, exposure to IH increased fasting serum levels of total
      cholesterol, high-density lipoprotein (HDL) cholesterol, phospholipids
      (PLs), and triglycerides (TGs), as well as liver TG content.
    explanation: >-
      Supplies the lipogenic limb, including the liver triglyceride readout, in
      an exposure-controlled model.
  downstream:
  - target: Hepatocyte Lipid Overload
    description: >-
      SREBP-1/SCD-1 upregulation adds a hypoxia-driven de novo lipogenesis inflow
      on top of the adipose-derived and dietary inflows of the canonical model.
      As on the fibrosis edge, the human results are curated in disagreement
      rather than chosen between, but the disagreement runs the opposite way
      here: the largest individual-participant dataset finds apnea severity an
      independent risk factor for steatosis after adjustment, while the small
      biopsy-scored cohort finds no association with histological steatosis. The
      two measure steatosis differently (a noninvasive hepatic steatosis index
      in 2120 patients versus liver histology in 97), which is the most likely
      source of the discrepancy and is itself unresolved.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Hepatic SREBP-1 induction
    - Stearoyl-CoA desaturase 1 upregulation
    hypothesis_groups:
    - osa_intermittent_hypoxia_masld
    evidence:
    - reference: PMID:16123334
      reference_title: Intermittent hypoxia induces hyperlipidemia in lean mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We conclude that exposure to IH for five days increases serum cholesterol
        and PL levels, upregulates pathways of TG and PL biosynthesis, and
        inhibits pathways of cholesterol uptake in the liver in the lean state
      explanation: >-
        Names the biosynthetic pathways and the hepatic compartment, supporting
        the edge into the lipid-overload node.
    - reference: PMID:32843301
      reference_title: 'Obstructive sleep apnea, chronic obstructive pulmonary disease
        and NAFLD: an individual participant data meta-analysis.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In multivariable analysis, risk factors for steatosis were an
        apnea-hypopnea index (AHI) > 5/h, body mass index (BMI) > 26 kg/m2, age,
        type 2 diabetes (all p-values <0.01) and male gender (p = 0.02).
      explanation: >-
        The strongest human result on this edge, and the reason the steatosis
        limb is the one that survives in this hypothesis: in 2120 patients apnea
        severity remains an independent risk factor for steatosis alongside BMI
        rather than being displaced by it. Steatosis was scored by the
        noninvasive Hepatic Steatosis Index, not by biopsy.
    - reference: PMID:40884485
      reference_title: Association between obstructive sleep apnea and liver fibrosis
        in patients with suspected nonalcoholic fatty liver disease.
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        No association was observed between moderate to severe OSA and steatosis
        or nonalcoholic steatohepatitis.
      explanation: >-
        The counter-result on this edge, from the same cohort whose fibrosis
        finding is curated as SUPPORT above. In 97 patients with percutaneous
        liver biopsy the hypoxic exposure tracked fibrosis but not histological
        steatosis, so the study that most directly measures the lipid-overload
        endpoint does not see the effect.
  - target: Hepatocyte Injury and Inflammatory Activation
    description: >-
      Cyclical reoxygenation generates hepatic lipid peroxidation, which is
      associated with lobular inflammation and steatohepatitis severity. The
      association is with the oxidative readout rather than with the OSA
      diagnosis: the biopsy-scored cohort that graded steatohepatitis directly
      found no association between moderate to severe apnea and NASH, so this
      edge rests on the measured peroxidation rather than on the exposure label.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - osa_intermittent_hypoxia_masld
    evidence:
    - reference: PMID:27501738
      reference_title: Nocturnal hypoxia-induced oxidative stress promotes progression
        of pediatric non-alcoholic fatty liver disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Greater oxidative stress occurred in subjects with definite NASH as
        measured by F(2)-isoprostanes (p=0.06) and hepatic 4HNE (p=0.03) compared
        to those with borderline/not NASH.
      explanation: >-
        Ties the oxidative readout to steatohepatitis rather than to steatosis
        alone. Cross-sectional, hence the unknown-intermediates link type.
    - reference: PMID:40884485
      reference_title: Association between obstructive sleep apnea and liver fibrosis
        in patients with suspected nonalcoholic fatty liver disease.
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        No association was observed between moderate to severe OSA and steatosis
        or nonalcoholic steatohepatitis.
      explanation: >-
        Graded by the NASH-CRN scoring system on percutaneous liver biopsy, so
        this is a direct negative measurement of the endpoint this edge asserts.
        Kept on the edge rather than in prose so the disagreement with the
        paediatric oxidative-stress result is visible in the graph.
  - target: Hepatic Stellate Cell Activation and Fibrosis
    description: >-
      Whether the hypoxic exposure drives fibrosis independently of adiposity is
      contested: biopsy-based cohorts report an association surviving adjustment
      for obesity, while individual-participant meta-analysis assigns it to body
      mass index. The edge is curated with both results attached rather than
      chosen between.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - osa_intermittent_hypoxia_masld
    evidence:
    - reference: PMID:40884485
      reference_title: Association between obstructive sleep apnea and liver fibrosis
        in patients with suspected nonalcoholic fatty liver disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The association between moderate to severe OSA and advanced fibrosis
        remained significant after adjustment for sex, age, diabetes and obesity
      explanation: >-
        97 patients with percutaneous liver biopsy and in-lab polysomnography;
        the adjustment for obesity is what makes this evidence for the edge
        rather than for confounding.
    - reference: PMID:32843301
      reference_title: 'Obstructive sleep apnea, chronic obstructive pulmonary disease
        and NAFLD: an individual participant data meta-analysis.'
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        AHI severity was not associated with fibrosis.
      explanation: >-
        The counter-result, kept on the edge so the disagreement is visible in
        the graph rather than only in prose: in 2218 patients the fibrosis risk
        factors were BMI, age, male gender and type 2 diabetes, not apnea
        severity.

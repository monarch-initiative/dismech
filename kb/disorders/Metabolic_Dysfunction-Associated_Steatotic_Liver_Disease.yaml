    explanation: The review identifies hepatocellular carcinoma as a distal outcome of progressive steatohepatitis.
histopathology:
- name: Macrovesicular Steatosis
  finding_term:
    preferred_term: Macrovesicular steatosis
    term:
      id: NCIT:C82990
      label: Macrovesicular Steatosis
  description: >-
    Large-droplet triglyceride accumulation displacing the hepatocyte nucleus, the
    defining lesion of the disease and the entry criterion for any steatotic liver
    disease diagnosis. Graded 0-3 as the first component of the NAFLD activity
    score.
  diagnostic: true
  evidence:
  - reference: PMID:28585211
    reference_title: Non-Alcoholic Fatty Liver Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      NAFLD is characterized by excess accumulation of triglyceride in the
      hepatocyte due to both increased inflow of free fatty acids and de novo
      hepatic lipogenesis.
    explanation: >-
      Identifies intrahepatocellular triglyceride accumulation as the defining
      histologic lesion.
  - reference: PMID:38324483
    reference_title: A Phase 3, Randomized, Controlled Trial of Resmetirom in NASH with Liver Fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the components of this measure are steatosis (assessed on a scale of 0 to
      3), lobular inflammation (assessed on a scale of 0 to 3), and hepatocellular
      ballooning (assessed on a scale of 0 to 2).
    explanation: >-
      Steatosis is the first of the three graded histologic components of the
      NAFLD activity score used in the registrational trial.
- name: Lobular Inflammation
  finding_term:
    preferred_term: Lobular inflammation
    term:
      id: NCIT:C35978
      label: Inflammatory Infiltrate
  description: >-
    Mixed inflammatory cell infiltration of the hepatic lobule, the inflammatory
    component that distinguishes steatohepatitis (MASH) from bland steatosis
    (MASL). Graded 0-3 within the NAFLD activity score.
  evidence:
  - reference: PMID:38324483
    reference_title: A Phase 3, Randomized, Controlled Trial of Resmetirom in NASH with Liver Fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the components of this measure are steatosis (assessed on a scale of 0 to
      3), lobular inflammation (assessed on a scale of 0 to 3), and hepatocellular
      ballooning (assessed on a scale of 0 to 2).
    explanation: >-
      Establishes lobular inflammation as a separately graded histologic component
      of the activity score.
- name: Hepatocellular Ballooning
  finding_term:
    preferred_term: Hepatocellular ballooning degeneration
  description: >-
    Swollen hepatocytes with rarefied, wispy cytoplasm and loss of the normal
    polygonal outline - the morphologic signature of lipotoxic hepatocyte injury
    and the feature whose disappearance defines histologic MASH resolution in
    trials. Graded 0-2 within the NAFLD activity score. No NCIT morphologic-finding
    term exists for this lesion (NCIT:C181484 codes the grading assessment, not the
    finding), so this descriptor is deliberately left unbound.
  diagnostic: true
  evidence:
  - reference: PMID:38324483
    reference_title: A Phase 3, Randomized, Controlled Trial of Resmetirom in NASH with Liver Fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the components of this measure are steatosis (assessed on a scale of 0 to
      3), lobular inflammation (assessed on a scale of 0 to 3), and hepatocellular
      ballooning (assessed on a scale of 0 to 2).
    explanation: >-
      Establishes ballooning as the third separately graded histologic component
      of the activity score.
  - reference: PMID:38324483
    reference_title: A Phase 3, Randomized, Controlled Trial of Resmetirom in NASH with Liver Fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NAFLD activity scores of 4 or more are considered to indicate at-risk
      nonalcoholic steatohepatitis (NASH).
    explanation: >-
      Ties the composite activity score, of which ballooning is a required
      component, to the at-risk steatohepatitis designation.
- name: Perisinusoidal Fibrosis Progressing to Bridging Fibrosis and Cirrhosis
  finding_term:
    preferred_term: Perisinusoidal (pericellular) fibrosis
    term:
      id: NCIT:C3044
      label: Fibrosis
  description: >-
    Collagen deposition beginning in the perisinusoidal space of zone 3 and
    progressing through periportal and bridging fibrosis to cirrhosis. Staged F0-F4;
    this is the histologic feature that determines outcome, and unlike the activity
    components it is not captured by the NAFLD activity score.
  evidence:
  - reference: PMID:38324483
    reference_title: A Phase 3, Randomized, Controlled Trial of Resmetirom in NASH with Liver Fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fibrosis stages range from F0 (no fibrosis) to F4 (cirrhosis). A stage of F1B
      indicates moderate fibrosis, pericentral area only.
    explanation: >-
      Defines the fibrosis staging scale, including the pericentral
      (perisinusoidal, zone 3) pattern characteristic of early MASH.
  - reference: PMID:25935633
    reference_title: Liver Fibrosis, but No Other Histologic Features, Is Associated With Long-term Outcomes of Patients With Nonalcoholic Fatty Liver Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with fibrosis, regardless of steatohepatitis or NAFLD activity
      score, had shorter survival times than patients without fibrosis.
    explanation: >-
      Establishes fibrosis - not the activity components - as the
      outcome-determining histologic feature.
treatments:
- name: Weight loss through lifestyle modification
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Hypocaloric diet and increased physical activity, targeting sustained weight
    loss. The histologic benefit is dose-dependent: 7-10% loss improves
    steatohepatitis and 10% or more is associated with the highest rates of MASH
    resolution and fibrosis regression. This remains the foundational
    intervention for all disease stages.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Hepatocyte Lipid Overload
    treatment_effect: INHIBITS
    description: >-
      Negative energy balance reduces adipose lipolytic flux and de novo
      lipogenesis, lowering hepatocyte lipid loading.
    evidence:
    - reference: PMID:25865049
      reference_title: Weight Loss Through Lifestyle Modification Significantly Reduces Features of Nonalcoholic Steatohepatitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Degree of weight loss was independently associated with improvements in
        all NASH-related histologic parameters
      explanation: >-
        Shows a dose-response between weight loss and improvement of the
        histologic features driven by hepatic lipid loading.
  evidence:
  - reference: PMID:25865049
    reference_title: Weight Loss Through Lifestyle Modification Significantly Reduces Features of Nonalcoholic Steatohepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A greater extent of weight loss, induced by lifestyle changes, is
      associated with the level of improvement in histologic features of NASH.
    explanation: >-
      The trial conclusion establishing the dose-dependent histologic benefit of
      lifestyle-induced weight loss.
- name: Resmetirom
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    An oral, liver-directed, thyroid hormone receptor beta-selective agonist that
    increases hepatic fatty acid oxidation. In the MAESTRO-NASH phase 3 trial it
    was superior to placebo for both MASH resolution and fibrosis improvement in
    patients with F1B-F3 fibrosis, and it is the first agent approved
    specifically for this indication.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: resmetirom
      term:
        id: NCIT:C170368
        label: Resmetirom
  target_mechanisms:
  - target: Hepatocyte Lipid Overload
    treatment_effect: INHIBITS
    description: >-
      Hepatic thyroid hormone receptor beta agonism increases fatty acid
      oxidation and lowers hepatic lipid content.
    evidence:
    - reference: PMID:38324483
      reference_title: A Phase 3, Randomized, Controlled Trial of Resmetirom in NASH with Liver Fibrosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Resmetirom is an oral, liver-directed, thyroid hormone receptor
        beta-selective agonist in development for the treatment of NASH with
        liver fibrosis.
      explanation: >-
        Identifies the liver-directed receptor target through which the drug acts
        on hepatic lipid handling.
  evidence:
  - reference: PMID:38324483
    reference_title: A Phase 3, Randomized, Controlled Trial of Resmetirom in NASH with Liver Fibrosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both the 80-mg dose and the 100-mg dose of resmetirom were superior to
      placebo with respect to NASH resolution and improvement in liver fibrosis
      by at least one stage.
    explanation: >-
      The phase 3 primary-endpoint result supporting the indication in MASH with
      fibrosis.
- name: Semaglutide
  action_category: THERAPEUTIC
  therapeutic_modality: PEPTIDE
  description: >-
    A glucagon-like peptide-1 receptor agonist that produces substantial weight
    loss and improves glycaemia. A 72-week phase 2 trial increased MASH resolution
    relative to placebo but found no significant fibrosis-stage benefit; that null
    result has since been superseded by the phase 3 ESSENCE trial, whose week-72
    interim analysis in 800 patients with MASH and F2-F3 fibrosis met both primary
    endpoints, including reduction in liver fibrosis. Its modeled effect therefore
    runs through both the upstream cardiometabolic driver and the fibrogenic arm.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: semaglutide
      term:
        id: NCIT:C152328
        label: Semaglutide
  target_mechanisms:
  - target: Cardiometabolic Dysfunction and Adipose Insulin Resistance
    treatment_effect: INHIBITS
    description: >-
      Weight loss and improved insulin sensitivity reduce the adipose lipolytic
      and lipogenic drive that initiates the pathograph.
    evidence:
    - reference: PMID:33185364
      reference_title: A Placebo-Controlled Trial of Subcutaneous Semaglutide in Nonalcoholic Steatohepatitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The mean percent weight loss was 13% in the 0.4-mg group and 1% in the
        placebo group.
      explanation: >-
        Documents the weight-loss magnitude that underlies the effect on the
        cardiometabolic trigger node.
  - target: Hepatic Stellate Cell Activation and Fibrosis
    treatment_effect: INHIBITS
    description: >-
      The phase 3 ESSENCE interim analysis showed a significant reduction in
      fibrosis stage without worsening of steatohepatitis, so the drug acts on the
      fibrogenic arm and not only on the upstream metabolic trigger.
    evidence:
    - reference: PMID:40305708
      reference_title: Phase 3 Trial of Semaglutide in Metabolic Dysfunction-Associated Steatohepatitis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A reduction in liver fibrosis without worsening of steatohepatitis was
        reported in 36.8% of the patients in the semaglutide group and in 22.4% of
        those in the placebo group
      explanation: >-
        Quantifies the fibrosis-stage benefit that justifies modeling an effect on
        the fibrogenic node.
  evidence:
  - reference: PMID:40305708
    reference_title: Phase 3 Trial of Semaglutide in Metabolic Dysfunction-Associated Steatohepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Resolution of steatohepatitis without worsening of fibrosis occurred in 62.9%
      of the 534 patients in the semaglutide group and in 34.3% of the 266 patients
      in the placebo group
    explanation: >-
      The phase 3 primary endpoint for steatohepatitis resolution, superseding the
      phase 2 estimate.
  - reference: PMID:40305708
    reference_title: Phase 3 Trial of Semaglutide in Metabolic Dysfunction-Associated Steatohepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with MASH and moderate or advanced liver fibrosis, once-weekly
      semaglutide at a dose of 2.4 mg improved liver histologic results.
    explanation: >-
      The trial's own conclusion, covering both histologic endpoints in F2-F3
      disease.
  - reference: PMID:33185364
    reference_title: A Placebo-Controlled Trial of Subcutaneous Semaglutide in Nonalcoholic Steatohepatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This phase 2 trial involving patients with NASH showed that treatment with
      semaglutide resulted in a significantly higher percentage of patients with
      NASH resolution than placebo.
    explanation: >-
      The earlier phase 2 trial that first established the steatohepatitis
      resolution benefit later confirmed in phase 3.
  - reference: PMID:33185364
    reference_title: A Placebo-Controlled Trial of Subcutaneous Semaglutide in Nonalcoholic Steatohepatitis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the trial did not show a significant between-group difference in
      the percentage of patients with an improvement in fibrosis stage.
    explanation: >-
      Retained for provenance: this phase 2 null result on fibrosis was the
      standing claim until the larger phase 3 trial (PMID:40305708) demonstrated a
      significant fibrosis benefit, and it is superseded by that result.
- name: Vitamin E
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    High-dose alpha-tocopherol improved steatohepatitis histology relative to
    placebo in the PIVENS trial in adults with MASH without diabetes, but did not
    improve fibrosis scores. Its modeled action is on the oxidative-stress
    amplifier node.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vitamin E
      term:
        id: CHEBI:33234
        label: vitamin E
  target_mechanisms:
  - target: Lipotoxic Stress and Organelle Dysfunction
    treatment_effect: INHIBITS
    description: >-
      Antioxidant activity is proposed to blunt the reactive-oxygen-species arm

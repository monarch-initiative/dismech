- name: Hormone Replacement Therapy
  description: >-
    The streak gonad produces no sex steroids, so replacement is needed to induce
    and maintain secondary sexual characteristics, both after prophylactic
    gonadectomy and in those presenting with gonadal insufficiency.
  treatment_term:
    preferred_term: Hormone Replacement Therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
  target_mechanisms:

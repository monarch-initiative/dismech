- name: Gonadal dysgenesis
  description: Complete gonadal dysgenesis, as distinct from the partial dysgenesis more typical of Denys-Drash syndrome.
  phenotype_term:
    preferred_term: Gonadal dysgenesis
    term:
      id: HP:0000133
      label: Gonadal dysgenesis
  evidence:
  - reference: PMID:9499425

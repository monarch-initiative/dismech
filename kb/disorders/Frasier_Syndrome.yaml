    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All progressed to end-stage kidney disease (ESKD) and received a kidney transplant at a median age of 5 years (1.5–15 years)."
    explanation: Documents transplantation as the endpoint of management in this cohort.
  - reference: DOI:10.3389/fped.2022.847295
    reference_title: "Spectrum of Clinical Manifestations in Children With WT1 Mutation: Case Series and Literature Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

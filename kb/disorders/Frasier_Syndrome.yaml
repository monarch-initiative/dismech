    explanation: >-
      Long follow-up without recurrent disease driving graft loss, consistent
      with a defect confined to the native kidney.
- name: Dialysis
  description: >-
    Kidney replacement therapy once end stage disease is reached and before or
    instead of transplantation. GeneReviews notes one procedural caveat specific
    to this spectrum, that diaphragmatic hernia should be repaired before
    peritoneal dialysis is started.

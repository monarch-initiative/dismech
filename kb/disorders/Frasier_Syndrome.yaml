progression:
- phase: Recognition
  age_range: Adolescence
  notes: >-
    The classic 46,XY female-phenotype form is typically recognised in
    adolescence, when primary amenorrhea prompts investigation, by which point
    nephropathy is often already established.
  evidence:
  - reference: PMID:25623218
    reference_title: "Gonadal tumor in Frasier syndrome: a review and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although type 1 is noticed at the mean age of 16 due to mainly primary amenorrhea"
    explanation: Gives the mean age and usual trigger of recognition for the classic presentation.
genetic:
- name: WT1 intron 9 donor splice site variants
  association: Causative heterozygous splice variant
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: WT1
    term:
      id: hgnc:12796
      label: WT1
  features: >-
    Heterozygous point variants at the intron 9 donor splice site, preferentially
    at a CpG dinucleotide, abolish +KTS isoform production from the mutant allele
    without generating an abnormal protein.
  evidence:
  - reference: PMID:9499425
    reference_title: "Frasier syndrome is caused by defective alternative splicing of WT1 leading to an altered ratio of WT1 +/-KTS splice isoforms."

    snippet: "Patients present with normal female external genitalia, streak gonads and XY karyotype"
    explanation: Documents female external genitalia with an XY karyotype.
- name: Streak gonad
  description: Bilateral streak gonads replace differentiated testicular tissue.
  phenotype_term:
    preferred_term: Streak gonad
    term:

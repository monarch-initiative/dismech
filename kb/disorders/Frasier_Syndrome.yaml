treatments:
- name: RAAS Inhibition for Proteinuria
  description: >-
    Renin angiotensin aldosterone system blockade is used to reduce proteinuria.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Podocyte Dysfunction and Segmental Glomerular Scarring
  evidence:
  - reference: PMID:32352694
    reference_title: "WT1 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SRNS: avoid immunosuppressants; consider renin-angiotensin-aldosterone system (RAAS) inhibition."
    explanation: GeneReviews management recommendation for the glomerulopathy.
- name: Avoidance of Immunosuppressive Therapy
  description: >-
    An explicit agents to avoid recommendation. Immunosuppressants given
    empirically for steroid resistant nephrotic syndrome are ineffective here and
    carry toxicity, which is a practical reason to establish the WT1 genotype
    early.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:32352694
    reference_title: "WT1 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Avoid treating glomerulopathy with immunosuppressants, as they are not effective and potentially toxic."
    explanation: The GeneReviews agents to avoid recommendation, quoted directly.
- name: Prophylactic Gonadectomy
  description: >-
    Removal of the dysgenetic gonads prevents gonadoblastoma. The indication is
    karyotype dependent: gonadal tumor risk is concentrated in 46,XY individuals,
    and a review of 88 cases found no gonadal tumor in the 46,XX group, in whom
    preventive gonadectomy is therefore not indicated.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Failure of Testis Determination
  evidence:
  - reference: PMID:32352694
    reference_title: "WT1 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prevent whenever possible gonadoblastoma by prophylactic gonadectomy in those with a disorder of testicular development."
    explanation: GeneReviews recommends prophylactic gonadectomy for gonadoblastoma prevention.
  - reference: PMID:25623218
    reference_title: "Gonadal tumor in Frasier syndrome: a review and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which emphasize that preventive gonadectomy is unnecessary in type 3"
    explanation: >-
      Bounds the recommendation. Type 3 is the 46,XX female-phenotype group, in
      which no gonadal tumor was observed, so the prophylactic indication does
      not extend to it.
differential_diagnoses:
- name: Denys-Drash syndrome
  disease_term:
    preferred_term: Denys-Drash syndrome
    term:
      id: MONDO:0008682
      label: Denys-Drash syndrome
  description: >-
    The other pole of the WT1 continuum. Denys-Drash syndrome arises from
    dominant negative zinc finger missense variants and presents with diffuse
    mesangial sclerosis, early kidney failure and a high risk of Wilms tumor.
  distinguishing_features:
  - Focal segmental glomerulosclerosis with kidney failure in adolescence or early adulthood favors Frasier syndrome.
  - Diffuse mesangial sclerosis with early kidney failure favors Denys-Drash syndrome.
  - An intron 9 donor splice site variant favors Frasier syndrome; a zinc finger missense variant favors Denys-Drash syndrome.
  - Absence of Wilms tumor on extended follow-up favors Frasier syndrome.
  evidence:
  - reference: PMID:9398852
    reference_title: "Donor splice-site mutations in WT1 are responsible for Frasier syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No case of Wilms' tumour has been reported, even in patients with extended follow-up."
    explanation: >-
      Supports absence of Wilms tumor as a discriminator. This is also why the
      Wilms tumor frequency of the broader WT1 disorder spectrum must not be
      carried onto this entry.
  - reference: PMID:9398852
    reference_title: "Donor splice-site mutations in WT1 are responsible for Frasier syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Renal symptoms are characterized by diffuse mesangial sclerosis, usually before the age of one year, and patients frequently develop Wilms' tumour."
    explanation: Describes the contrasting Denys-Drash renal lesion and tumor risk.
notes: >-
  Frequency bands are deliberately omitted. The GeneReviews chapter that covers
  this disease is scoped to WT1 disorder as a whole, so its frequency language
  ("common findings can include ... Wilms tumor") describes the whole spectrum
  and not Frasier syndrome, where Wilms tumor is characteristically absent.
  Carrying those bands across the scope boundary is the defect tracked in #6951.
  Frasier-specific frequencies should be added from a Frasier cohort rather than
  inherited from the spectrum.

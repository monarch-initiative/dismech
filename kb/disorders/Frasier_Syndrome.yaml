    snippet: "Although type 1 is noticed at the mean age of 16 due to mainly primary amenorrhea, type 2 and 3 do not present delayed secondary sex characteristics, making diagnosis difficult."
    explanation: >-
      Identifies primary amenorrhea as the presenting feature of the classic

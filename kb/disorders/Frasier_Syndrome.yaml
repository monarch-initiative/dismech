      label: Streak gonad
  evidence:
  - reference: PMID:9398852
    reference_title: "Donor splice-site mutations in WT1 are responsible for Frasier syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients present with normal female external genitalia, streak gonads and XY karyotype"

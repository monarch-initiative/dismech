    reference_title: "Gonadal tumor in Frasier syndrome: a review and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of gonadal tumor is high in type 1 (67%)"
    explanation: >-
      Gives a Frasier-specific gonadal tumor rate of 67% in the classic 46,XY
      female-phenotype group, from a review of 88 cases. 67% falls in the
      FREQUENT band, and the figure is scoped to Frasier syndrome rather than to
      the wider WT1 spectrum.
  - reference: PMID:9398852
    reference_title: "Donor splice-site mutations in WT1 are responsible for Frasier syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients present with normal female external genitalia, streak gonads and XY karyotype and frequently develop gonadoblastoma."
    explanation: Documents gonadoblastoma as a frequent complication.

    reference_title: "WT1 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In adulthood, most individuals are affected by early gonadal insufficiency of variable severity with potential impact on puberty and fertility."
    explanation: >-
      Establishes the gonadal insufficiency that replacement therapy addresses.
      GeneReviews assigns the management itself to a multidisciplinary team
      including an endocrinologist rather than naming a regimen.
animal_models:
- name: WT1 +KTS isoform dosage series
  species: Mouse
  genotype: Wt1 +KTS heterozygous and homozygous null
  publication: PMID:35894442
  description: >-
    A dosage series in which only the amount of the +KTS isoform is varied. This
    is the experiment human genetics cannot perform: patients all carry one
    splice allele, so isoform dose cannot be separated from the variant itself.
    The mice separate them, and the two branches of the human phenotype appear at
    different doses.
  modeled_mechanisms:
  - target: Podocyte Dysfunction and Segmental Glomerular Scarring
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Heterozygous reduction of +KTS, the dose closest to the human
      heterozygous state, produces glomerulosclerosis.
    limitations: >-
      Reproduces the glomerular lesion but not the human renal time course, and
      the model speaks to isoform dose rather than to the intron 9 splice
      variant itself.
    evidence:
    - reference: PMID:35894442
      reference_title: "Monogenic focal segmental glomerulosclerosis: A conceptual framework for identification and management of a heterogeneous disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "heterozygous mice with reduced expression of the +KTS isoform develop glomerulosclerosis while homozygous mice lacking +KTS have complete XY sex reversal"
      explanation: The heterozygous arm of the dosage series gives the renal phenotype.
  - target: Failure of Testis Determination
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Homozygous loss of +KTS produces complete XY sex reversal, the gonadal
      branch of the human phenotype.
    limitations: >-
      Requires homozygous loss, whereas patients are heterozygous, so the
      gonadal branch is recapitulated only at a more extreme dose than the human
      genotype. Says nothing about gonadoblastoma risk or tumor histology.
    evidence:
    - reference: PMID:35894442
      reference_title: "Monogenic focal segmental glomerulosclerosis: A conceptual framework for identification and management of a heterogeneous disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "heterozygous mice with reduced expression of the +KTS isoform develop glomerulosclerosis while homozygous mice lacking +KTS have complete XY sex reversal"
      explanation: The homozygous arm of the dosage series gives the gonadal phenotype.
diagnosis:
- name: WT1 Molecular Genetic Testing
  presence: Heterozygous WT1 intron 9 donor splice site variant
  description: >-
    The diagnosis rests on identifying the WT1 variant. This matters practically
    because establishing the genotype early is what justifies withholding
    immunosuppression for the steroid-resistant nephrotic syndrome.
  evidence:
  - reference: PMID:32352694
    reference_title: "WT1 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of WT1 disorder is established in a proband with suggestive clinical findings and a heterozygous pathogenic variant in WT1 identified by molecular genetic testing."
    explanation: The GeneReviews diagnostic criterion for the WT1 disorder spectrum.
- name: Karyotype
  presence: 46,XY in the classic form; 46,XX in type 3
  description: >-
    Karyotype is needed because it determines the gonadal tumor risk and so
    whether prophylactic gonadectomy is indicated.
  evidence:
  - reference: PMID:25623218
    reference_title: "Gonadal tumor in Frasier syndrome: a review and classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type 1 Frasier syndrome is characterized by female external genitalia with 46,XY (n = 72); type 2 by male external genitalia with 46,XY (n = 8); and type 3 by female external genitalia with 46,XX (n = 8)."
    explanation: The subtype partition, and hence the tumor risk stratification, is defined by karyotype.
- name: Proteinuria Surveillance
  presence: New or rising proteinuria
  description: >-
    Scheduled monitoring for the first appearance of glomerular disease.
    Surveillance is life-long rather than paediatric, because kidney disease in
    intron 9 splice variants has a later median onset than in the missense
    genotypes.
  evidence:
  - reference: PMID:32352694
    reference_title: "WT1 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "proteinuria every six months until age ten years, yearly thereafter"
    explanation: The GeneReviews surveillance interval for glomerular disease.
  - reference: PMID:39698353
    reference_title: "Clinical Characterization of a National Cohort of Patients With Germline WT1 Variants Including Late-Onset Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, life-long surveillance of kidney function is recommended."
    explanation: >-
      Extends surveillance beyond childhood, on the basis that CKD in this
      cohort could begin well into adult life.
- name: Gonadal Insufficiency Surveillance
  presence: Rising gonadotropins or absent pubertal progression
  description: >-
    Monitoring for the endocrine failure of the dysgenetic gonad, beginning
    after puberty.
  evidence:
  - reference: PMID:32352694
    reference_title: "WT1 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "early gonadal insufficiency yearly after puberty"
    explanation: The GeneReviews surveillance interval for gonadal insufficiency.
differential_diagnoses:
- name: Denys-Drash syndrome
  disease_term:
    preferred_term: Denys-Drash syndrome
    term:
      id: MONDO:0008682
      label: Denys-Drash syndrome
  description: >-
    The other pole of the WT1 continuum. Denys-Drash syndrome arises from
    dominant negative zinc finger missense variants and presents with diffuse
    mesangial sclerosis, early kidney failure and a high risk of Wilms tumor.
  distinguishing_features:
  - Focal segmental glomerulosclerosis with kidney failure in adolescence or early adulthood favors Frasier syndrome.
  - Diffuse mesangial sclerosis with early kidney failure favors Denys-Drash syndrome.
  - An intron 9 donor splice site variant favors Frasier syndrome; a zinc finger missense variant favors Denys-Drash syndrome.
  - Absence of Wilms tumor on extended follow-up favors Frasier syndrome.
  evidence:
  - reference: PMID:9398852
    reference_title: "Donor splice-site mutations in WT1 are responsible for Frasier syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No case of Wilms' tumour has been reported, even in patients with extended follow-up."
    explanation: >-
      Supports absence of Wilms tumor as a discriminator. This is also why the
      Wilms tumor frequency of the broader WT1 disorder spectrum must not be
      carried onto this entry.
  - reference: PMID:9398852
    reference_title: "Donor splice-site mutations in WT1 are responsible for Frasier syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Renal symptoms are characterized by diffuse mesangial sclerosis, usually before the age of one year, and patients frequently develop Wilms' tumour."
    explanation: Describes the contrasting Denys-Drash renal lesion and tumor risk.
  - reference: PMID:39698353
    reference_title: "Clinical Characterization of a National Cohort of Patients With Germline WT1 Variants Including Late-Onset Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Wilms tumor was reported in 18 of 19 patients with truncating variants, all with deletions, 2 of 13 with missense variants, and 2 of 7 with splice-site variants (not in patients with intron 9 variants)."
    explanation: >-
      Modern genotype-stratified corroboration in a national cohort. No Wilms
      tumor occurred in any intron 9 patient, against 18 of 19 with truncating
      variants, so the discriminator is measured directly rather than inferred
      from the absence of case reports.
  - reference: PMID:39698353
    reference_title: "Clinical Characterization of a National Cohort of Patients With Germline WT1 Variants Including Late-Onset Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with intron 9 splice-site variants developed CKD, at a median age of 15 years, and 2 of 3 patients with other splice-site variants developed CKD, at a median age of 6 months."
    explanation: >-
      Quantifies the intron 9 renal course and separates it from other
      splice-site variants, whose kidney disease begins in infancy. Supports
      adolescent-onset kidney failure as the discriminating feature.
discussions:
- discussion_id: nosology_frasier_denys_drash_continuum
  prompt: >-
    Should Frasier syndrome be curated as a disease at all, given that the
    current GeneReviews chapter has retired it as a clinical designation in
    favour of a single WT1 disorder continuum?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#WT1 Intron 9 Donor Splice Site Variants
  - differential_diagnoses#Denys-Drash syndrome
  rationale: >-
    The entry is curated because MONDO carries the term, the historical
    literature is indexed under it, and the intron 9 splice mechanism is
    genuinely distinct in kind from the dominant negative zinc finger missense
    lesion at the other pole. The counter-argument is that the two poles differ
    quantitatively along one axis rather than being separate diseases, and that
    a continuum is the better model. Both readings are represented in the
    literature and the question is not settled here.
  evidence:
  - reference: PMID:10762296
    reference_title: "Frasier syndrome, part of the Denys Drash continuum or simply a WT1 gene associated disorder of intersex and nephropathy?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The case provides a focus for the discussion of recent evidence that Denys Drash and Frasier syndrome form two ends of a spectrum of disorders."
    explanation: >-
      States the continuum position directly, and is the source the entry's
      nosological framing argues from alongside GeneReviews.
  - reference: PMID:32352694
    reference_title: "WT1 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "those designations are now recognized to be part of a phenotypic continuum and are no longer clinically helpful"
    explanation: The current GeneReviews position, which retires the eponym.
- discussion_id: curation_gap_wt1_counterpart_entries
  prompt: >-
    The Denys-Drash counterpart entry and a WT1 disorder grouping do not exist
    in this knowledge base. Should they be curated so the continuum can be
    represented explicitly rather than described in prose?
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - differential_diagnoses#Denys-Drash syndrome
  rationale: >-
    Much of this entry's framing is comparative, and the comparison currently
    points at an entry that is not there. MONDO:0008682 appears only as a
    differential-diagnosis reference. Until the counterpart is curated, a reader
    cannot follow the contrast, and the continuum has no machine-readable
    representation.
notes: >-
  Frequency bands are deliberately omitted. The GeneReviews chapter that covers
  this disease is scoped to WT1 disorder as a whole, so its frequency language
  ("common findings can include ... Wilms tumor") describes the whole spectrum
  and not Frasier syndrome, where Wilms tumor is characteristically absent.
  Carrying those bands across the scope boundary is the defect tracked in #6951.
  Frasier-specific frequencies should be added from a Frasier cohort rather than
  inherited from the spectrum.

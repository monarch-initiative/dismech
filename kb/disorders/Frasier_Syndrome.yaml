  phenotype_term:
    preferred_term: Gonadal dysgenesis
    term:
      id: HP:0000133
      label: Gonadal dysgenesis
  evidence:
  - reference: PMID:9499425
    reference_title: "Frasier syndrome is caused by defective alternative splicing of WT1 leading to an altered ratio of WT1 +/-KTS splice isoforms."

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which emphasize that preventive gonadectomy is unnecessary in type 3"
    explanation: >-
      Bounds the recommendation. Type 3 is the 46,XX female-phenotype group, in
      which no gonadal tumor was observed, so the prophylactic indication does
      not extend to it.
- name: Kidney Transplantation
  description: >-
    Definitive treatment for the end stage kidney disease. The mechanism makes
    this unusually favourable: the lesion is intrinsic to the native podocyte, so
    a graft does not carry the defect and recurrent disease is not expected,
    unlike in primary FSGS where recurrence is a major concern.
  treatment_term:
    preferred_term: Kidney Transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  target_mechanisms:
  - target: Podocyte Dysfunction and Segmental Glomerular Scarring

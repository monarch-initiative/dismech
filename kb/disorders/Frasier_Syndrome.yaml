name: Frasier Syndrome
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
categories:
- Disorder of Sex Development
- Glomerular Disease
- Cancer Predisposition Syndrome
parents:
- 46,XY disorder of sex development
disease_term:
  preferred_term: Frasier syndrome
  term:
    id: MONDO:0007635
    label: Frasier syndrome
synonyms:
- FS
- Frasier syndrome, autosomal dominant, somatic mutation
description: >-
  Frasier syndrome is a constitutional WT1 disorder caused by heterozygous point
  variants at the intron 9 donor splice site. The variant allele cannot use the
  alternative donor that inserts the three amino acids lysine, threonine and
  serine between the third and fourth zinc fingers, so it produces only the -KTS
  isoform and the normal excess of +KTS over -KTS is lost. No abnormal protein is
  made, which separates the mechanism from the dominant negative zinc finger
  missense variants of Denys-Drash syndrome.
  The classic presentation is a 46,XY individual with normal female external
  genitalia and streak gonads, childhood proteinuria progressing through focal
  segmental glomerulosclerosis to end stage kidney disease in adolescence or
  early adulthood, and a high risk of gonadoblastoma. Wilms tumor is
  characteristically absent, in contrast to the rest of the WT1 spectrum.
  A nosological caveat belongs at the top of this entry. The GeneReviews WT1
  Disorder chapter has retired Denys-Drash and Frasier syndrome as clinical
  designations and describes one phenotypic continuum instead. This entry is
  curated because MONDO carries the term, the historical literature is indexed
  under it, and the intron 9 splice mechanism it names is genuinely distinct from
  the dominant negative zinc finger missense mechanism at the other pole. It
  should be read as one pole of the WT1 continuum rather than as a separate
  disease.
inheritance:
- name: Autosomal dominant, usually de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous intron 9 splice donor variants act dominantly. Most probands
    carry a de novo variant.
  evidence:
  - reference: PMID:32352694
    reference_title: "WT1 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WT1 disorder is inherited in an autosomal dominant manner."
    explanation: GeneReviews states the mode of inheritance for the WT1 disorder spectrum, of which Frasier syndrome is one pole.
  - reference: PMID:32352694
    reference_title: "WT1 Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most individuals diagnosed with WT1 disorder have the disorder as the result of an apparent de novo WT1 pathogenic variant"
    explanation: Supports the predominantly de novo origin.
pathophysiology:
- name: WT1 Intron 9 Donor Splice Site Variants
  biological_scale: MOLECULAR
  description: >-
    Heterozygous point variants in the intron 9 donor splice site, preferentially
    affecting a CpG dinucleotide, disrupt the alternative splice donor that adds
    the KTS tripeptide between zinc fingers three and four.
  downstream:
  - target: Loss of the +KTS Isoform from the Mutant Allele
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9499425
      reference_title: "Frasier syndrome is caused by defective alternative splicing of WT1 leading to an altered ratio of WT1 +/-KTS splice isoforms."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Disruption of alternative splicing at the exon 9 splice donor site prevents synthesis of the usually more abundant WT1 +KTS isoform from the mutant allele."
      explanation: States that the splice disruption is what prevents +KTS synthesis, which is the edge itself.
  evidence:
  - reference: PMID:9398852
    reference_title: "Donor splice-site mutations in WT1 are responsible for Frasier syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we demonstrate that FS is caused by mutations in the donor splice site in intron 9 of WT1, with the predicted loss of the +KTS isoform."
    explanation: Establishes the causal lesion.
  - reference: PMID:9398852
    reference_title: "Donor splice-site mutations in WT1 are responsible for Frasier syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an alternative splice site in intron 9 allows the addition of three amino acids (KTS) between the third and fourth zinc fingers of WT1"
    explanation: Describes the normal splicing event the variant disrupts.
- name: Loss of the +KTS Isoform from the Mutant Allele
  biological_scale: MOLECULAR
  description: >-
    The mutant allele produces only -KTS transcript. Because no altered protein is
    translated, the lesion is a quantitative isoform imbalance rather than
    dominant negative interference.
  downstream:
  - target: WT1 +KTS to -KTS Isoform Imbalance
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9499425
      reference_title: "Frasier syndrome is caused by defective alternative splicing of WT1 leading to an altered ratio of WT1 +/-KTS splice isoforms."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Disruption of alternative splicing at the exon 9 splice donor site prevents synthesis of the usually more abundant WT1 +KTS isoform from the mutant allele."
      explanation: >-
        States the edge itself: the splice lesion removes +KTS output from the
        mutant allele, which is what leaves the remaining pool imbalanced.
    - reference: PMID:9398852
      reference_title: "Donor splice-site mutations in WT1 are responsible for Frasier syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Examination of WT1 transcripts indeed showed a diminution of the +KTS/-KTS isoform ratio in patients with FS."
      explanation: >-
        Confirms in patient transcripts that the allele-level loss actually
        shifts the measured isoform ratio, rather than being only predicted.
  evidence:
  - reference: PMID:9499425
    reference_title: "Frasier syndrome is caused by defective alternative splicing of WT1 leading to an altered ratio of WT1 +/-KTS splice isoforms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to Denys-Drash syndrome, no mutant protein is produced."
    explanation: Distinguishes this mechanism from the dominant negative lesion of Denys-Drash syndrome.
- name: WT1 +KTS to -KTS Isoform Imbalance
  biological_scale: MOLECULAR
  description: >-
    The physiological excess of +KTS over -KTS is reduced. The imbalance has been
    demonstrated directly in patient tissue.
  downstream:
  - target: Failure of Testis Determination
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9499425
      reference_title: "Frasier syndrome is caused by defective alternative splicing of WT1 leading to an altered ratio of WT1 +/-KTS splice isoforms."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "gonadal development may be particularly sensitive to imbalance or relative underrepresentation of the WT1 +KTS isoform"
      explanation: Attributes the gonadal phenotype specifically to the isoform imbalance.
    - reference: PMID:35894442
      reference_title: "Monogenic focal segmental glomerulosclerosis: A conceptual framework for identification and management of a heterogeneous disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "heterozygous mice with reduced expression of the +KTS isoform develop glomerulosclerosis while homozygous mice lacking +KTS have complete XY sex reversal"
      explanation: >-
        Mouse models separate the dose of the +KTS isoform from any other WT1
        defect and reproduce the gonadal branch: homozygous loss of +KTS gives complete XY sex reversal, which is direct support for this edge
        rather than for either node alone.
  - target: Podocyte Dysfunction and Segmental Glomerular Scarring
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35894442
      reference_title: "Monogenic focal segmental glomerulosclerosis: A conceptual framework for identification and management of a heterogeneous disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "heterozygous mice with reduced expression of the +KTS isoform develop glomerulosclerosis while homozygous mice lacking +KTS have complete XY sex reversal"
      explanation: >-
        Mouse models separate the dose of the +KTS isoform from any other WT1
        defect and reproduce the renal branch: heterozygous reduction of +KTS produces glomerulosclerosis, which is direct support for this edge
        rather than for either node alone.
  evidence:
  - reference: PMID:9398852
    reference_title: "Donor splice-site mutations in WT1 are responsible for Frasier syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Examination of WT1 transcripts indeed showed a diminution of the +KTS/-KTS isoform ratio in patients with FS."
    explanation: Demonstrates the isoform ratio shift in patients.
  - reference: PMID:9499425
    reference_title: "Frasier syndrome is caused by defective alternative splicing of WT1 leading to an altered ratio of WT1 +/-KTS splice isoforms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The splice mutation leads to an imbalance of WT1 isoforms in vivo"
    explanation: Confirms the imbalance in patient tissue rather than only in prediction.
- name: Failure of Testis Determination
  biological_scale: TISSUE
  description: >-
    The 46,XY gonad does not undergo testicular differentiation, leaving bilateral
    streak gonads and, in the absence of androgen and anti-Mullerian hormone,
    female external genitalia.
  downstream:
  - target: Streak gonad
  - target: Sex reversal
  - target: Gonadal dysgenesis
  - target: Gonadoblastoma
  evidence:
  - reference: PMID:9398852
    reference_title: "Donor splice-site mutations in WT1 are responsible for Frasier syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients present with normal female external genitalia, streak gonads and XY karyotype and frequently develop gonadoblastoma."
    explanation: Describes the gonadal and genital consequences of failed testis determination.
- name: Podocyte Dysfunction and Segmental Glomerular Scarring
  biological_scale: CELLULAR
  description: >-
    WT1 is required for podocyte maintenance. Isoform imbalance produces a
    non-immune glomerulopathy that appears as focal and segmental sclerosis and
    is therefore unresponsive to steroids.
  downstream:
  - target: Proteinuria
  - target: Focal segmental glomerulosclerosis
  - target: Steroid-resistant nephrotic syndrome
  - target: Stage 5 chronic kidney disease
  evidence:
  - reference: PMID:9398852
    reference_title: "Donor splice-site mutations in WT1 are responsible for Frasier syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glomerular symptoms consist of childhood proteinuria and nephrotic syndrome, characterized by unspecific focal and segmental glomerular sclerosis, progressing to end-stage renal failure in adolescence or early adulthood."
    explanation: Establishes the renal course from proteinuria through segmental sclerosis to end stage disease.

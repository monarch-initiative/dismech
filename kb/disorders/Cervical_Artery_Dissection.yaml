treatments:
- name: Antithrombotic Therapy
  description: >-
    Antiplatelet or anticoagulant therapy is used to reduce recurrent
    thromboembolic events in appropriate patients.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aspirin
      term:
        id: CHEBI:15365
        label: acetylsalicylic acid
    - preferred_term: warfarin
      term:
        id: CHEBI:10033
        label: warfarin
  target_mechanisms:
  - target: Thromboembolism and Cerebral Ischemia
    description: >-
      Antiplatelet and anticoagulant agents inhibit mural thrombus propagation
      and thromboembolism from the dissected cervical artery.
    evidence:
    - reference: PMID:25684164
      reference_title: >-
        Antiplatelet treatment compared with anticoagulation treatment for
        cervical artery dissection (CADISS): a randomised trial.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both antiplatelet drugs and anticoagulant drugs are used to reduce risk
        of stroke but whether one treatment strategy is more effective than the
        other is unknown.
      explanation: >-
        Both antiplatelet and anticoagulant medications target thromboembolic
        stroke risk in cervical artery dissection.
  evidence:
  - reference: PMID:25684164
    reference_title: >-
      Antiplatelet treatment compared with anticoagulation treatment for
      cervical artery dissection (CADISS): a randomised trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found no difference in efficacy of antiplatelet and anticoagulant drugs
      at preventing stroke and death in patients with symptomatic carotid and
      vertebral artery dissection but stroke was rare in both groups, and much
      rarer than reported in some observational studies.
    explanation: >-
      The randomized CADISS trial supports antiplatelet or anticoagulant
      antithrombotic management, without evidence that one strategy is superior.
  - reference: PMID:34746432
    reference_title: >-
      ESO guideline for the management of extracranial and intracranial artery
      dissection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on evidence from two phase 2 RCTs that have shown no difference
      between the benefits and risks of anticoagulants versus antiplatelets in
      the acute phase of symptomatic EAD, we strongly recommend that clinicians
      can prescribe either option.
    explanation: >-
      The ESO guideline supports either anticoagulant or antiplatelet therapy in
      acute symptomatic extracranial artery dissection.
- name: Aspirin Therapy
  description: >-
    Aspirin is one antiplatelet option for cervical artery dissection, but
    TREAT-CAD did not prove aspirin non-inferior to vitamin K antagonist
    anticoagulation.
  treatment_term:
    preferred_term: aspirin pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aspirin
      term:
        id: CHEBI:15365
        label: acetylsalicylic acid
  target_mechanisms:
  - target: Thromboembolism and Cerebral Ischemia
    description: >-
      Aspirin inhibits platelet aggregation to reduce thromboembolic stroke
      risk in cervical artery dissection.
    evidence:
    - reference: PMID:33765420
      reference_title: >-
        Aspirin versus anticoagulation in cervical artery dissection (TREAT-CAD):
        an open-label, randomised, non-inferiority trial.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our findings did not show that aspirin was non-inferior to vitamin K
        antagonists in the treatment of cervical artery dissection.
      explanation: >-
        TREAT-CAD evaluated aspirin against vitamin K antagonists for preventing
        ischemic events in cervical artery dissection.
  evidence:
  - reference: PMID:33765420
    reference_title: >-
      Aspirin versus anticoagulation in cervical artery dissection (TREAT-CAD):
      an open-label, randomised, non-inferiority trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings did not show that aspirin was non-inferior to vitamin K
      antagonists in the treatment of cervical artery dissection.
    explanation: >-
      TREAT-CAD directly evaluates aspirin in cervical artery dissection but
      qualifies its role because non-inferiority to vitamin K antagonists was
      not shown.
  - reference: PMID:33765420
    reference_title: >-
      Aspirin versus anticoagulation in cervical artery dissection (TREAT-CAD):
      an open-label, randomised, non-inferiority trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven patients (8%) in the aspirin group and none in the vitamin K
      antagonist group had ischaemic strokes.
    explanation: >-
      In TREAT-CAD, ischaemic strokes occurred only in the aspirin group,
      which contextualizes why aspirin's role in cervical artery dissection is
      qualified rather than established as equivalent to anticoagulation.

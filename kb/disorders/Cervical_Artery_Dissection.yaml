- name: PHACTR1
  gene_term:
    preferred_term: PHACTR1
    term:
      id: hgnc:20990
      label: PHACTR1
  association: Common intronic regulatory susceptibility variant rs9349379 at 6p24
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    Genome-wide association studies implicate common variation at the PHACTR1
    locus (6p24, fine-mapped to intronic SNP rs9349379, a distal regulator of
    EDN1 expression) as the principal common genetic susceptibility locus for
    sporadic cervical artery dissection and fibromuscular dysplasia.
  evidence:
  - reference: PMID:28753427
    reference_title: >-
      A Genetic Variant Associated with Five Vascular Diseases Is a Distal
      Regulator of Endothelin-1 Gene Expression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genome-wide association studies (GWASs) implicate the PHACTR1 locus (6p24)
      in risk for five vascular diseases, including coronary artery disease,
      migraine headache, cervical artery dissection, fibromuscular dysplasia,
      and hypertension.
    explanation: >-
      Establishes the PHACTR1 locus (6p24) as a genome-wide significant common
      genetic susceptibility locus for cervical artery dissection.
  - reference: PMID:28753427
    reference_title: >-
      A Genetic Variant Associated with Five Vascular Diseases Is a Distal
      Regulator of Endothelin-1 Gene Expression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through genetic fine mapping, we prioritized rs9349379, a common SNP in
      the third intron of the PHACTR1 gene, as the putative causal variant.
    explanation: >-
      Identifies rs9349379 in intron 3 of PHACTR1 as the prioritized causal
      susceptibility variant at this vascular disease locus.
environmental:
- name: Cervical Trauma and Mechanical Neck Strain
  exposure_term:
    preferred_term: mechanical neck trauma or strain
  presence: PRESENT
  notes: >-
    Both major blunt or penetrating cervical trauma (accounting for traumatic
    CeAD) and minor mechanical neck strain or manipulation preceding symptom
    onset act as mechanical triggers that precipitate intimal tear or intramural
    hematoma, particularly in susceptible arterial walls.
  influences_mechanisms:
  - target: Arterial Wall Tear and Intramural Hematoma
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Mechanical neck trauma or cervical strain applies shear and torsional
      stress to the extracranial carotid or vertebral arterial wall, triggering
      intimal tearing and intramural hematoma formation.
    evidence:
    - reference: PMID:22507869
      reference_title: >-
        Familial occurrence of cervical artery dissection--coincidence or sign
        of familial predisposition?
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mild cervical trauma preceding the dissection event is a common finding,
        but many CeAD occur spontaneously.
      explanation: >-
        Documents preceding mild cervical trauma as a common mechanical trigger
        for cervical artery dissection.
  evidence:
  - reference: PMID:22507869
    reference_title: >-
      Familial occurrence of cervical artery dissection--coincidence or sign of
      familial predisposition?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mild cervical trauma preceding the dissection event is a common finding,
      but many CeAD occur spontaneously.
    explanation: >-
      Establishes preceding mild cervical trauma as a frequent environmental and
      mechanical precipitant of cervical artery dissection.
  - reference: PMID:36918105
    reference_title: >-
      Long-term outcome of cervical artery dissection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirty-four patients (87.1%) had spontaneous CAD, and five patients
      (12.8%) had traumatic CAD.
    explanation: >-
      Quantifies overtly traumatic cervical artery dissection as accounting for
      12.8% of cases in a clinical cohort.

name: Cervical Artery Dissection
creation_date: "2026-05-06T11:59:10Z"
category: Complex
description: >-
  Cervical artery dissection is a cervicocephalic arterial wall injury in the
  carotid or vertebral arteries that produces an intramural hematoma, luminal
  stenosis or pseudoaneurysm, and risk of thromboembolic ischemic stroke.
disease_term:
  preferred_term: cervical artery dissection
  term:
    id: MONDO:0006061
    label: cervical artery dissection
parents:
- Vascular Disorder
- Cerebrovascular Disease
synonyms:
- Cervicocephalic artery dissection
- CeAD
- Carotid or vertebral artery dissection
- Extracranial carotid and vertebral artery dissection
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    evidence:
    - reference: PMID:25684164
      reference_title: >-
        Antiplatelet treatment compared with anticoagulation treatment for
        cervical artery dissection (CADISS): a randomised trial.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Extracranial carotid and vertebral artery dissection is an important cause
        of stroke, especially in young people.
      explanation: >-
        Cervical artery dissection is a primary arterial wall disorder of the
        extracranial carotid and vertebral arteries, placing it within the
        cardiovascular and vascular disease domain.
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:38791244
      reference_title: >-
        Peripheral Blood Gene Expression Profiling Reveals Molecular Pathways
        Associated with Cervical Artery Dissection.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cervical artery dissection (CeAD) is the primary cause of ischemic stroke
        in young adults.
      explanation: >-
        Cervical artery dissection is a primary cause of ischemic stroke and
        transient ischemic attack in young adults.
has_subtypes:
- name: Carotid Artery Dissection
  description: >-
    Cervical artery dissection involving the extracranial carotid artery.
  evidence:
  - reference: PMID:25684164
    reference_title: >-
      Antiplatelet treatment compared with anticoagulation treatment for
      cervical artery dissection (CADISS): a randomised trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We enrolled 250 participants (118 carotid, 132 vertebral).
    explanation: >-
      Extracranial carotid artery dissection is one of the two major anatomic
      subtypes of cervical artery dissection in the CADISS trial cohort.
- name: Vertebral Artery Dissection
  description: >-
    Cervical artery dissection involving the extracranial vertebral artery.
  evidence:
  - reference: PMID:25684164
    reference_title: >-
      Antiplatelet treatment compared with anticoagulation treatment for
      cervical artery dissection (CADISS): a randomised trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We enrolled 250 participants (118 carotid, 132 vertebral).
    explanation: >-
      Extracranial vertebral artery dissection is one of the two major anatomic
      subtypes of cervical artery dissection in the CADISS trial cohort.
- name: Spontaneous Cervical Artery Dissection
  description: >-
    Dissection without major trauma, often occurring in the setting of
    multifactorial arterial-wall susceptibility and minor mechanical triggers.
  evidence:
  - reference: PMID:38791244
    reference_title: >-
      Peripheral Blood Gene Expression Profiling Reveals Molecular Pathways
      Associated with Cervical Artery Dissection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Monogenic heritable connective tissue diseases account for fewer than 5%
      of cases of CeAD. The remaining sporadic cases have known risk factors.
      The clinical, radiological, and histological characteristics of systemic
      vasculopathy and undifferentiated connective tissue dysplasia are present
      in up to 70% of individuals with sporadic CeAD.
    explanation: >-
      Sporadic/spontaneous cervical artery dissection accounts for the majority
      of cases and frequently occurs on a background of systemic vasculopathy
      and undifferentiated connective-tissue dysplasia.
- name: Traumatic Cervical Artery Dissection
  description: >-
    Dissection temporally associated with clinically significant neck or head
    trauma, distinguished etiologically from spontaneous cervical artery
    dissection.
  evidence:
  - reference: PMID:36918105
    reference_title: >-
      Long-term outcome of cervical artery dissection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirty-four patients (87.1%) had spontaneous CAD, and five patients
      (12.8%) had traumatic CAD.
    explanation: >-
      Explicitly distinguishes traumatic cervical artery dissection from
      spontaneous cervical artery dissection as a primary clinical subtype in a
      long-term outcome cohort.
  - reference: PMID:25355826
    reference_title: >-
      Connective tissue anomalies in patients with spontaneous cervical artery
      dissection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Signs suggesting connective tissue abnormality were also more frequently
      represented in patients with sCeAD than in patients with traumatic CeAD
      (28.6%, p < 0.001; mean number of pathologic findings, 1.7 ± 3.7, p =
      0.045).
    explanation: >-
      Compares spontaneous and traumatic cervical artery dissection subtypes,
      showing lower prevalence of underlying connective-tissue signs in
      traumatic CeAD.
prevalence:
- population: General population
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Extracranial and intracranial artery dissections are uncommon in the
    general population, though cervical artery dissection is the primary cause
    of ischemic stroke in young adults under 50 years of age.
  evidence:
  - reference: PMID:34746432
    reference_title: >-
      ESO guideline for the management of extracranial and intracranial artery
      dissection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EAD and IAD represent leading causes of stroke in the young, but are
      uncommon in the general population, thus making it challenging to conduct
      clinical trials and large observational studies.
    explanation: >-
      The European Stroke Organisation guideline characterizes extracranial
      artery dissection as uncommon in the general population while being a
      leading cause of stroke in young adults.
  - reference: PMID:38791244
    reference_title: >-
      Peripheral Blood Gene Expression Profiling Reveals Molecular Pathways
      Associated with Cervical Artery Dissection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cervical artery dissection (CeAD) is the primary cause of ischemic stroke
      in young adults.
    explanation: >-
      Confirms that cervical artery dissection is the primary cause of ischemic
      stroke in young adults.
progression:
- phase: Onset
  age_range: Young and middle-aged adults (commonly <50 years)
  notes: >-
    Cervical artery dissection is a major cause of stroke in young adults aged
    under 50 years.
  evidence:
  - reference: PMID:33765420
    reference_title: >-
      Aspirin versus anticoagulation in cervical artery dissection (TREAT-CAD):
      an open-label, randomised, non-inferiority trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cervical artery dissection is a major cause of stroke in young people
      (aged <50 years).
    explanation: >-
      Establishes young adulthood (<50 years) as the characteristic age range of
      clinical presentation for cervical artery dissection.
- phase: Resolution
  notes: >-
    Intramural hematoma resolves on vessel-wall imaging by 3 months after
    symptom onset in approximately 80% of patients and is absorbed by 6 months
    in nearly all patients.
  evidence:
  - reference: PMID:37957581
    reference_title: >-
      Imaging investigation of cervicocranial artery dissection by using high
      resolution magnetic resonance VWI and MRA: qualitative and quantitative
      analysis at different stages.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In approximately 80% of the patients, IMH are no longer detectable three
      months after disease onset. Nearly IMH are absorbed by six months after
      disease onset in nearly all patients.
    explanation: >-
      Documents the natural timeline of intramural hematoma absorption over 3 to
      6 months after dissection onset.
pathophysiology:
- name: Arterial Wall Susceptibility
  description: >-
    Multifactorial arterial-wall susceptibility, including connective-tissue
    dysplasia, systemic vasculopathy, and rare monogenic connective-tissue
    disease, lowers the threshold for cervical arterial wall injury.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38791244
    reference_title: >-
      Peripheral Blood Gene Expression Profiling Reveals Molecular Pathways
      Associated with Cervical Artery Dissection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical, radiological, and histological characteristics of systemic
      vasculopathy and undifferentiated connective tissue dysplasia are present
      in up to 70% of individuals with sporadic CeAD.
    explanation: >-
      This supports connective-tissue and systemic-vasculopathy susceptibility
      as common background biology for sporadic cervical artery dissection.
  - reference: PMID:38791244
    reference_title: >-
      Peripheral Blood Gene Expression Profiling Reveals Molecular Pathways
      Associated with Cervical Artery Dissection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Monogenic heritable connective tissue diseases account for fewer than 5%
      of cases of CeAD.
    explanation: >-
      This supports rare monogenic connective-tissue disease as a recognized but
      minority cause of cervical artery dissection susceptibility.
  downstream:
  - target: Arterial Wall Tear and Intramural Hematoma
    description: >-
      A susceptible cervical arterial wall is more likely to dissect after
      mechanical stress or spontaneous mural injury.
    evidence:
    - reference: PMID:38791244
      reference_title: >-
        Peripheral Blood Gene Expression Profiling Reveals Molecular Pathways
        Associated with Cervical Artery Dissection.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The clinical, radiological, and histological characteristics of systemic
        vasculopathy and undifferentiated connective tissue dysplasia are present
        in up to 70% of individuals with sporadic CeAD.
      explanation: >-
        Systemic vasculopathy and undifferentiated connective-tissue dysplasia
        provide the underlying arterial-wall vulnerability for cervical artery
        dissection.
- name: Arterial Wall Tear and Intramural Hematoma
  description: >-
    A tear in the intima or bleeding within the arterial wall separates vessel
    wall layers, creating an intramural hematoma that narrows the lumen or forms
    a pseudoaneurysm.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: response to wounding
    term:
      id: GO:0009611
      label: response to wounding
    modifier: INCREASED
  evidence:
  - reference: PMID:25684164
    reference_title: >-
      Antiplatelet treatment compared with anticoagulation treatment for
      cervical artery dissection (CADISS): a randomised trial.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We included patients with extracranial carotid and vertebral dissection
      with onset of symptoms within the past 7 days.
    explanation: >-
      The CADISS trial population confirms acute extracranial carotid and
      vertebral dissection as the clinical substrate for this disorder, while
      the detailed mural hematoma imaging features are provided by the
      accompanying vessel-wall MRI reference.
  - reference: PMID:37957581
    reference_title: >-
      Imaging investigation of cervicocranial artery dissection by using high
      resolution magnetic resonance VWI and MRA: qualitative and quantitative
      analysis at different stages.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the acute and subacute stage, the typical sign detection of intramural
      hematoma and Grade II enhancement revealed by HR-MRI was higher than the
      observations in the chronic stage (P = 0.000/0.000/0.016), while there
      was no significant difference by MRA (P = 0.902).
    explanation: >-
      Vessel-wall imaging directly supports intramural hematoma as an acute and
      subacute imaging sign of cervicocranial artery dissection.
  downstream:
  - target: Thromboembolism and Cerebral Ischemia
    description: >-
      The dissected arterial wall and altered lumen promote local thrombosis,
      stenosis, occlusion, and cerebral ischemia.
    evidence:
    - reference: PMID:37957581
      reference_title: >-
        Imaging investigation of cervicocranial artery dissection by using high
        resolution magnetic resonance VWI and MRA: qualitative and quantitative
        analysis at different stages.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cerebral infarction accounted for 40–60% in ECAD, while transient
        ischemic attack (TIA) accounted for 20–30%.
      explanation: >-
        Extracranial artery dissection frequently leads to downstream cerebral
        infarction and transient ischemic attack.
  - target: Headache
    description: >-
      Mural distension and local arterial wall dissection produce ipsilateral or
      cervicocephalic headache.
    evidence:
    - reference: PMID:25684164
      reference_title: >-
        Antiplatelet treatment compared with anticoagulation treatment for
        cervical artery dissection (CADISS): a randomised trial.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The major presenting symptoms were stroke or transient ischaemic attack
        (n=224) and local symptoms (headache, neck pain, or Horner's syndrome;
        n=26).
      explanation: >-
        Headache is a primary local symptom directly caused by the cervical
        arterial dissection.
  - target: Neck Pain
    description: >-
      Dissection and intramural hematoma of the cervical carotid or vertebral
      artery produce local neck pain.
    evidence:
    - reference: PMID:25684164
      reference_title: >-
        Antiplatelet treatment compared with anticoagulation treatment for
        cervical artery dissection (CADISS): a randomised trial.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The major presenting symptoms were stroke or transient ischaemic attack
        (n=224) and local symptoms (headache, neck pain, or Horner's syndrome;
        n=26).
      explanation: >-
        Neck pain is a classic local symptom directly resulting from the
        cervical arterial wall dissection.
  - target: Horner Syndrome
    description: >-
      Expansion of the dissected carotid arterial wall compresses adjacent
      pericarotid sympathetic fibers, producing ipsilateral Horner syndrome.
    evidence:
    - reference: PMID:25684164
      reference_title: >-
        Antiplatelet treatment compared with anticoagulation treatment for
        cervical artery dissection (CADISS): a randomised trial.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The major presenting symptoms were stroke or transient ischaemic attack
        (n=224) and local symptoms (headache, neck pain, or Horner's syndrome;
        n=26).
      explanation: >-
        Horner syndrome is a local presenting manifestation of cervical artery
        dissection.
- name: Molecular Stress and Vascular Remodeling Signatures
  description: >-
    Peripheral-blood transcriptomic changes in CeAD implicate molecular stress,
    senescence-associated signaling, mitochondrial dysfunction, and
    epithelial-mesenchymal plasticity as candidate mechanisms that may accompany
    arterial-wall vulnerability and remodeling.
  biological_processes:
  - preferred_term: cellular senescence
    term:
      id: GO:0090398
      label: cellular senescence
    modifier: INCREASED
  - preferred_term: mitochondrial organization
    term:
      id: GO:0007005
      label: mitochondrion organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38791244
    reference_title: >-
      Peripheral Blood Gene Expression Profiling Reveals Molecular Pathways
      Associated with Cervical Artery Dissection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found potential correlations between CeAD and the dysregulation of
      genes linked to nucleolar stress, senescence-associated secretory
      phenotype, mitochondrial malfunction, and epithelial-mesenchymal
      plasticity.
    explanation: >-
      This transcriptomic study supports candidate molecular stress and vascular
      remodeling pathways associated with CeAD.
  downstream:
  - target: Arterial Wall Tear and Intramural Hematoma
    description: >-
      Molecular stress and remodeling signatures may contribute to arterial-wall
      vulnerability and impaired repair.
    evidence:
    - reference: PMID:38791244
      reference_title: >-
        Peripheral Blood Gene Expression Profiling Reveals Molecular Pathways
        Associated with Cervical Artery Dissection.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We found potential correlations between CeAD and the dysregulation of
        genes linked to nucleolar stress, senescence-associated secretory
        phenotype, mitochondrial malfunction, and epithelial-mesenchymal
        plasticity.
      explanation: >-
        Peripheral blood transcriptomic correlations implicate dysregulated
        cellular stress, senescence, and remodeling pathways as candidate
        contributors to cervical arterial wall dissection.
- name: Thromboembolism and Cerebral Ischemia
  description: >-
    Damaged arterial endothelium and disturbed flow promote local thrombosis and
    embolization to cerebral arteries.

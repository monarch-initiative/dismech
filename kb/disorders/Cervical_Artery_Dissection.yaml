  evidence:
  - reference: PMID:25684164
    reference_title: >-
      Antiplatelet treatment compared with anticoagulation treatment for
      cervical artery dissection (CADISS): a randomised trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extracranial carotid and vertebral artery dissection is an important cause
      of stroke, especially in young people.
    explanation: >-
      This directly supports cervical artery dissection as a cause of ischemic
      cerebrovascular events.
  - reference: PMID:38791244
    reference_title: >-
      Peripheral Blood Gene Expression Profiling Reveals Molecular Pathways
      Associated with Cervical Artery Dissection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cervical artery dissection (CeAD) is the primary cause of ischemic stroke
      in young adults.
    explanation: >-
      An independent transcriptomic study corroborates cervical artery
      dissection as a leading cause of ischemic stroke in young adults,
      reinforcing the clinical importance of the thromboembolic pathway.

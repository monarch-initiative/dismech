  downstream:
  - target: Ischemic Stroke
    description: >-
      Artery-to-artery thromboembolism or hemodynamic occlusion from the
      dissected cervical vessel causes acute cerebral infarction.
    evidence:
    - reference: PMID:25684164
      reference_title: >-
        Antiplatelet treatment compared with anticoagulation treatment for
        cervical artery dissection (CADISS): a randomised trial.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The major presenting symptoms were stroke or transient ischaemic attack
        (n=224) and local symptoms (headache, neck pain, or Horner's syndrome;
        n=26).
      explanation: >-
        Stroke is the major ischemic presenting manifestation of cervical artery
        dissection.
  - target: Transient Ischemic Attack
    description: >-
      Transient thromboembolic occlusion or hypoperfusion distal to the
      dissected cervical artery produces transient ischemic attacks.
    evidence:
    - reference: PMID:25684164

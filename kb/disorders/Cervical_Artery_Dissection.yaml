      label: COL3A1
  association: Heritable connective-tissue disease variants (vascular Ehlers-Danlos spectrum) in familial and minority sporadic CeAD
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    Monogenic heritable connective-tissue disorders (including COL3A1-related
    vascular Ehlers-Danlos syndrome) account for fewer than 5% of overall CeAD
    cases but are enriched in familial CeAD pedigrees, where they confer
    arterial-wall extracellular-matrix susceptibility.
  evidence:
  - reference: PMID:31903434
    reference_title: "Rare genetic variants in patients with cervical artery dissection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among f-CeAD-patients, 5/17 pedigrees carried CeAD-causing variants in
      COL3A1, COL4A1, COL4A3, COL4A4, COL5A1, COL5A2 and FBN1.
    explanation: >-
      Clinical exome sequencing identified disease-causing germline COL3A1
      variants in familial cervical artery dissection pedigrees.
  - reference: PMID:38791244
    reference_title: >-
      Peripheral Blood Gene Expression Profiling Reveals Molecular Pathways
      Associated with Cervical Artery Dissection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

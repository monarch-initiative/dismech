diagnosis:
- name: High-Resolution Magnetic Resonance Vessel-Wall Imaging (HRMR-VWI)
  description: >-
    High-resolution magnetic resonance vessel-wall imaging (HRMR-VWI) directly
    visualizes the arterial wall and detects characteristic signs of dissection
    including intramural hematoma, intimal flap/double lumen, and vessel-wall
    enhancement across acute and subacute stages.
  diagnosis_term:
    preferred_term: high-resolution magnetic resonance vessel-wall imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:37957581
    reference_title: >-
      Imaging investigation of cervicocranial artery dissection by using high
      resolution magnetic resonance VWI and MRA: qualitative and quantitative
      analysis at different stages.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HRMR-VWI revealed typical sign detection of artery dissection in all
      patients in the acute and subacute stage. Among them, the intimal
      flap/double lumen sign ditection were more common than the MRA, there was
      significant difference (P = 0.012).
    explanation: >-
      Demonstrates that HRMR-VWI detects typical dissection signs in all acute
      and subacute patients and is more sensitive than MRA for intimal
      flap/double lumen detection.
- name: Magnetic Resonance Angiography (MRA)
  description: >-
    Non-invasive magnetic resonance angiography (MRA) evaluates luminal
    stenosis, occlusion, pseudoaneurysm, and double-lumen signs in suspected
    cervicocranial artery dissection and is a first-choice modality for routine
    examination, especially at the chronic stage.
  diagnosis_term:
    preferred_term: magnetic resonance angiography
    term:
      id: NCIT:C190557
      label: Magnetic Resonance Angiography
  evidence:
  - reference: PMID:37957581
    reference_title: >-
      Imaging investigation of cervicocranial artery dissection by using high
      resolution magnetic resonance VWI and MRA: qualitative and quantitative
      analysis at different stages.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the diagnostic efficacy of MRA was not as good as HRMR-VWI, it
      should be the first choice of method for routine examination in evaluating
      CCAD, especially at the chronic stage of CCAD.
    explanation: >-
      Supports MRA as a first-choice routine non-invasive imaging modality for
      evaluating cervicocranial artery dissection.
- name: Digital Subtraction Angiography (DSA)
  description: >-
    Catheter digital subtraction angiography (DSA) characterizes luminal
    pathology (flame-like occlusion, string sign, pseudoaneurysm, intimal flap)
    and was historically considered the diagnostic reference standard, though it
    does not directly image the outer arterial wall.
  notes: >-
    Bound to NCIT:C20080 (X-ray Angiography), the specific fluoroscopic/catheter
    angiography child of NCIT:C190556 (Angiography) present in the validated
    NCIT term and TreatmentActionTerm dynamic-enum caches (NCIT:C16291 is not
    present in the repository NCIT cache).
  diagnosis_term:
    preferred_term: digital subtraction angiography
    term:
      id: NCIT:C20080
      label: X-ray Angiography
  evidence:
  - reference: PMID:37957581
    reference_title: >-
      Imaging investigation of cervicocranial artery dissection by using high
      resolution magnetic resonance VWI and MRA: qualitative and quantitative
      analysis at different stages.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Digital subtraction angiography (DSA) was previously considered the gold
      standard for CCAD diagnosis.
    explanation: >-
      Identifies digital subtraction angiography as the historical reference
      standard for diagnosing cervicocranial artery dissection.

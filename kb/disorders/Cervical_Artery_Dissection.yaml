datasets:
- accession: geo:GSE320504
  title: Convergent Transcriptomic Signatures in Blood Link Lumbar Disc Herniation and Cervical Artery Dissection in Young Adults
  description: Recurrent lumbar disc herniation (rLDH) and cervical artery dissection (CeAD) are significant neurological manifestations of undifferentiated connective tissue dysplasia (UCTD) in young adults. Molecular and histopathological evidence points to impaired cellular differentiation and aberrant extracellular matrix organization in these patients. Nevertheless, the pathogenic mechanisms of UCTD and the basis for its clinical heterogeneity remain largely unknown. Here, we conducted the first comparative transcriptome-wide analysis of peripheral blood mRNA in two UCTD cohorts—19 patients with CeAD and 12 with rLDH—alongside 18 healthy volunteers.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 49
  notes: Identified by GEO DataSets index search for Cervical Artery Dissection (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE244467
  title: Altered expression of circular RNA in patients with cervical artery dissection
  description: Cervical artery dissection (CeAD), a special cerebrovascular disease and the main cause of stroke in young people, can present with ischemic stroke, headache, subarachnoid hemorrhage, and other symptoms, increasing the possibility of misdiagnosis. As a special class of non-coding RNAs, circRNAs are commonly found in organisms and can play regulatory roles in transcription and post-transcription processes, affecting gene expression.CircRNAs have reported to be associated with neurological diseases; however, their role in CeAD has not been discerned. In this study, we aimed to elucidate the pathophysiological changes in patients with CeAD and identify biomarkers.

prevalence:
- population: European Roma communities (carrier frequency of the UFM1 founder deletion)
  measure_type: CARRIER_FREQUENCY
  rate_low: 3000.0
  rate_high: 25000.0
  notes: >-
    Carrier rate of 3%-25% for c.-273_-271delTCA across 1,000 Roma controls
    from different European panels; the upper value comes from a single
    Eastern Slovak community (14 of 57 individuals), which was sampled because
    an affected child came from it and is endogamous, so it is
    ascertainment-biased. The pan-European figure from 670 Roma controls was
    4.5%. This is an allele-carrier figure in a founder population, not a
    disease prevalence.
  evidence:
  - reference: PMID:28931644
    reference_title: "UFM1 founder mutation in the Roma population causes recessive variant of H-ABC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

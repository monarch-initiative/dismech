genetic:
- name: UFM1
  gene_term:
    preferred_term: UFM1
    term:
      id: hgnc:20597
      label: UFM1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Biallelic hypomorphic UFM1 variants cause HLD14. Most patients are
    homozygous for a Roma founder promoter deletion on a shared haplotype; the
    homozygous p.Arg81Cys missense variant causes a related early-onset
    encephalopathy with progressive microcephaly, in which none of four
    patients had basal ganglia abnormalities.
  evidence:
  - reference: PMID:28931644
    reference_title: "UFM1 founder mutation in the Roma population causes recessive variant of H-ABC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study, focused on identifying the mutated gene in patients with H-ABC without TUBB4A mutations, revealed a homozygous 3-bp deletion in the UFM1 promoter area, which perfectly segregates with the disease."
    explanation: >-
      Gene discovery by homozygosity mapping and exome sequencing, with
      segregation.
  - reference: PMID:28931644
    reference_title: "UFM1 founder mutation in the Roma population causes recessive variant of H-ABC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

    and cerebellar atrophy) in a child without a TUBB4A variant, or severe
    infantile encephalopathy with stridor and hypomyelination in a child of
    Roma descent, should prompt targeted testing for the UFM1 promoter
    deletion. Because the variant lies in the promoter, analysis must include
    that region; exome capture that covers only coding exons can miss it.

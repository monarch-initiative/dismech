discussions:
- discussion_id: hld14_ufmylation_to_hypomyelination
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Deficient CNS Myelination
  prompt: >-
    How does reduced UFMylation cause hypomyelination: through a defect in
    oligodendrocytes themselves, or secondarily to neuronal loss and failed
    brain growth?
  rationale: >-
    Hypomyelination defines the disease, but every mechanistic study of UFM1
    loss so far has looked at neurons or non-neural cells. The founder promoter
    deletion lowered reporter expression in neuroblastoma and astroglioma cells
    but not in an oligodendroglioma-derived line, which, if it holds in real
    oligodendrocytes, would argue for a secondary rather than a
    cell-autonomous myelin defect. Oligodendrocyte-specific Ufm1 loss in mice,
    or patient-derived oligodendrocytes, would settle it.
- discussion_id: hld14_missense_not_simple_loss
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#ER Stress and Unfolded Protein Response Activation
  prompt: >-
    Is UFM1 p.Arg81Cys a partial loss-of-function allele, or does it have
    additional effects that make it behave differently from reduced UFM1
    supply?
  rationale: >-
    The Arg81Cys protein is hypomorphic in thioester assays, yet
    UFM1-R81C neurons respond to ER stress differently from UFM1-null neurons,
    and the UPR inhibitor trazodone restored translation only in R81C neurons.
    If the two allele classes act differently, a treatment that helps one may
    not help the other.
- discussion_id: hld14_no_disease_modifying_treatment
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  prompt: >-
    Is there any disease-modifying treatment for HLD14?
  rationale: >-
    Only supportive care and genetic counselling are curated. Trazodone
    increased synapse numbers in cultured UFM1-deficient mouse neurons, but
    that is a cell-culture result, not a clinical treatment, and it is not
    curated as a treatment here.
notes: >-
  The entry name follows the dismech convention used for the other
  Hypomyelinating_Leukodystrophy_N entries rather than the MONDO label
  ordering ("leukodystrophy, hypomyelinating, 14"); the MONDO label is used
  verbatim in disease_term and kept as a synonym.

  No GeneReviews chapter covers HLD14 or UFM1; a PubMed search for UFM1 and
  for hypomyelinating leukodystrophy restricted to genereviews[book] returned
  no chapter.

  The founder deletion is reported under two numberings, c.-273_-271delTCA and
  c.-155_-153delTCA, which refer to the same 3-bp deletion described against
  different transcripts; the variants section keeps one record.

  PMID:39846712 describes a UFC1 missense variant (p.Arg23Gln) as
  "HLD14-related" in oligodendroglial FBD-102b cells. UFC1 is not an HLD14
  gene in MONDO or OMIM, so that paper is not used as evidence for this entry.

  Many clinical frequencies come from small single-centre series of children
  homozygous for the founder deletion (16 in PMID:28931644, 9 in
  PMID:35189806). The four p.Arg81Cys patients in PMID:29868776
  differ from the founder-deletion series on MRI: Table 2 of that paper reports
  basal ganglia abnormality in 0/4, delayed CNS myelination in 3/4 and
  cerebellar hypoplasia in 3/4, against 16/16, 16/16 and 13/16 for the
  founder deletion. They are kept in this entry because MONDO and OMIM name
  UFM1 as the HLD14 gene, but whether OMIM 617899 lists p.Arg81Cys was not
  confirmed during curation (ClinVar lists the variant as likely pathogenic
  with no named condition). If it does not, a subtype split would fit better.
  Frequencies here are drawn from the founder-deletion series.

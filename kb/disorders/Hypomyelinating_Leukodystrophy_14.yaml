name: Hypomyelinating Leukodystrophy 14
creation_date: "2026-09-25T20:45:00Z"
category: Mendelian
description: >-
  Hypomyelinating leukodystrophy 14 (HLD14) is an autosomal recessive
  leukodystrophy caused by biallelic variants in UFM1, which encodes ubiquitin
  fold modifier 1, the small ubiquitin-like protein conjugated to target
  proteins by the UBA5 (E1), UFC1 (E2) and UFL1-UFBP1 (E3) UFMylation cascade.
  Almost all reported patients are homozygous for a Roma founder 3-bp deletion
  in the UFM1 promoter (c.-273_-271delTCA; also written c.-155_-153delTCA
  against a different transcript), which lowers UFM1 transcription in neural
  cell lines. These children present in the first months of life with
  inspiratory stridor, feeding and swallowing failure, absent visual and
  auditory development, axial hypotonia with limb hypertonia, dystonia and
  opisthotonus, and later drug-resistant epilepsy and progressive
  microcephaly; most die in infancy or early childhood, often of respiratory
  insufficiency. MRI shows hypomyelination with a very small or absent putamen,
  small caudate and evolving cerebellar atrophy, the pattern of hypomyelination
  with atrophy of the basal ganglia and cerebellum (H-ABC) that is otherwise
  associated with dominant TUBB4A variants. A homozygous missense variant,
  p.Arg81Cys, found in two Sudanese families, causes a related early-onset
  encephalopathy with progressive microcephaly, delayed myelination and
  cerebellar hypoplasia but without the basal ganglia involvement of H-ABC.
  Mechanistically, UFMylation acts mainly at the
  endoplasmic reticulum, where modification of the ribosomal protein RPL26
  supports ER-associated ribosome quality control and ER-phagy; UFM1 loss in
  neurons induces ER stress and the unfolded protein response and reduces
  protein translation. How these neuronal defects relate to the failure of
  myelination is not established.

    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation may be more common in the Roma population than previously estimated, and the targeted testing of the UFM1:c.-155_-153delTCA mutation may have an indication in cases of hypomyelination and neurodegenerative clinical course in pediatric patients of Roma descent."
    explanation: >-
      Recommends targeted founder testing.
  - reference: PMID:34573312

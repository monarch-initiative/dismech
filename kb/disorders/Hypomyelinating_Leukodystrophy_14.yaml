    explanation: >-
      Population screening of Roma controls gives the founder-allele carrier
      rate.
  - reference: PMID:28931644
    reference_title: "UFM1 founder mutation in the Roma population causes recessive variant of H-ABC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent investigation of the carrier rate in the specific community where the homozygous individual came from revealed a carrier rate of approximately 25% (14 out of 57 individuals)."
    explanation: >-
      Identifies the single community behind the 25% upper bound.
  - reference: PMID:28931644
    reference_title: "UFM1 founder mutation in the Roma population causes recessive variant of H-ABC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening of 670 Roma controls revealed 30 carriers with an overall carrier rate of 4.5% among different Roma communities across Europe"
    explanation: >-
      Representative pan-European carrier rate.
pathophysiology:
- name: Biallelic UFM1 Variants
  biological_scale: MOLECULAR
  description: >-
    Biallelic hypomorphic UFM1 variants. The predominant allele is a Roma
    founder 3-bp promoter deletion that lowers transcription; a rarer
    homozygous missense variant, p.Arg81Cys, alters the UFM1 C-terminal tail
    that binds UBA5. Complete loss is not observed: biallelic null alleles in
    UFMylation genes are depleted from human population databases, and
    knockout of the pathway is embryonic lethal in mice.
  genetic_context:
    gene:
      preferred_term: UFM1
      term:
        id: hgnc:20597
        label: UFM1
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  downstream:
  - target: Reduced UFM1 Expression in Neural Cells
    causal_link_type: DIRECT
    description: >-
      Route taken by the Roma founder promoter deletion.
    evidence:
    - reference: PMID:28931644
      reference_title: "UFM1 founder mutation in the Roma population causes recessive variant of H-ABC."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The deletion significantly reduced promoter activity in SY-5Y and U373 but not in HeLa and HOG-F2 cell lines"
      explanation: >-
        Reporter assays show the promoter deletion reduces UFM1 transcription
        in neuroblastoma and astroglioma cells.
  - target: Impaired UFM1 Thioester Formation with UBA5 and UFC1
    causal_link_type: DIRECT
    description: >-
      Route taken by the p.Arg81Cys missense variant.
    evidence:
    - reference: PMID:29868776
      reference_title: "Biallelic UFM1 and UFC1 mutations expand the essential role of ufmylation in brain development."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Accordingly, an in vitro pull-down assay revealed that the mutant has a lower binding affinity to UBA5 than wild-type UFM1"
      explanation: >-
        Pull-down assay showing the missense variant weakens UFM1 binding to
        UBA5.
  evidence:
  - reference: PMID:28931644
    reference_title: "UFM1 founder mutation in the Roma population causes recessive variant of H-ABC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES in 2 patients revealed a homozygous deletion in the promoter region of UFM1."
    explanation: >-
      Identifies the founder promoter deletion as the disease allele.
  - reference: PMID:29868776
    reference_title: "Biallelic UFM1 and UFC1 mutations expand the essential role of ufmylation in brain development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the conspicuous depletion of biallelic null mutations in the components of this pathway in human genome databases suggest that it is necessary for embryonic survival, which is consistent with the embryonic lethal nature of knockout models for the orthologous genes"
    explanation: >-
      Population-database depletion of null alleles and embryonic lethality
      of knockout models support describing disease alleles as hypomorphic
      rather than null.
  - reference: PMID:29868776
    reference_title: "Biallelic UFM1 and UFC1 mutations expand the essential role of ufmylation in brain development."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results show a reduction rather than abrogation of ufmylation with the activity of UFM1 and UFC1 mutants at 60-75% of their wild-type counterparts."
    explanation: >-
      Quantifies residual activity of the mutant proteins.
- name: Reduced UFM1 Expression in Neural Cells
  biological_scale: MOLECULAR
  description: >-
    The founder promoter deletion reduces UFM1 promoter activity in
    neuroblastoma (SH-SY5Y) and astroglioma (U373) cells but not in HeLa or
    oligodendroglioma-derived HOG cells, suggesting a cell-type-selective fall
    in UFM1 supply. That the oligodendroglial line was spared is notable given
    the hypomyelinating phenotype, although a single reporter assay in
    transformed cell lines is a weak guide to oligodendrocytes in vivo.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Impaired Protein UFMylation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28931644
    reference_title: "UFM1 founder mutation in the Roma population causes recessive variant of H-ABC."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transfection assays showed that the deletion significantly reduced expression in specific CNS cell lines."
    explanation: >-
      Reporter-level evidence that the deletion lowers UFM1 expression in a
      CNS-cell-selective way.
- name: Impaired UFM1 Thioester Formation with UBA5 and UFC1
  biological_scale: MOLECULAR
  description: >-
    UFM1 p.Arg81Cys forms thioester intermediates with the E1 UBA5 and the E2
    UFC1 less efficiently than wild-type UFM1, reducing the amount of
    activated UFM1 available for conjugation. The molecular function below is
    UBA5's; the defect lies in the UFM1 substrate, so the annotation stands
    for reduced flux through the E1 step rather than a defective enzyme.
  molecular_functions:
  - preferred_term: UFM1 activating enzyme activity
    term:
      id: GO:0071566
      label: UFM1 activating enzyme activity
    modifier: DECREASED
  downstream:
  - target: Impaired Protein UFMylation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29868776
      reference_title: "Biallelic UFM1 and UFC1 mutations expand the essential role of ufmylation in brain development."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This mutation has a significantly diminished capacity to form thioester intermediates with UBA5 and with UFC1 (the E2-like enzyme for ufmylation), with resulting impaired ufmylation of cellular proteins."
      explanation: >-
        States both the thioester defect and its consequence for cellular
        UFMylation.
  evidence:
  - reference: PMID:29868776
    reference_title: "Biallelic UFM1 and UFC1 mutations expand the essential role of ufmylation in brain development."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Taken together, our data show that UFM1R81C has a hypomorphic effect on the UFM1-system and provide a plausible mechanistic explanation."
    explanation: >-
      Characterizes the missense variant as hypomorphic.
- name: Impaired Protein UFMylation
  biological_scale: MOLECULAR
  description: >-
    Reduced covalent conjugation of UFM1 to cellular substrates. Two
    substrates tie UFMylation to the endoplasmic reticulum: the 60S ribosomal
    protein RPL26, the principal UFMylation target, and the ER membrane
    reductase CYB5R3, whose UFMylation triggers ER-phagy.
  biological_processes:
  - preferred_term: protein ufmylation
    term:
      id: GO:0071569
      label: protein ufmylation
    modifier: DECREASED
  downstream:
  - target: Defective ER-Associated Ribosome Quality Control
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40315331
      reference_title: "UFMylation orchestrates spatiotemporal coordination of RQC at the ER."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Degradation of arrest peptides from endoplasmic reticulum (ER) translocon-bound 60S ribosomal subunits via the ribosome-associated quality control (ER-RQC) pathway requires covalent modification of RPL26/uL24 on 60S ribosomal subunits with UFM1."
      explanation: >-
        Establishes that ER-RQC requires RPL26 UFMylation. Indirect for HLD14
        because it is shown in cell-free and cell systems, not in patient
        cells.
  - target: Impaired ER-Phagy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36543799
      reference_title: "The UFM1 system regulates ER-phagy through the ufmylation of CYB5R3."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Our results indicate that CYB5R3 ufmylation induces ER-phagy, which is indispensable for brain development."
      explanation: >-
        Identifies CYB5R3 UFMylation as a trigger for ER-phagy. Indirect
        because it is not shown in HLD14 patient cells.
  evidence:
  - reference: PMID:30626644
    reference_title: "Ribosomal protein RPL26 is the principal target of UFMylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that a largely uncharacterized ribosomal protein, RPL26, is the principal target of UFM1 conjugation."
    explanation: >-
      Identifies the dominant substrate of the process the disease impairs.
  - reference: PMID:29868776
    reference_title: "Biallelic UFM1 and UFC1 mutations expand the essential role of ufmylation in brain development."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also found that the level of two UFM1-conjugates with cellular proteins in patient-derived lymphoblasts was significantly reduced compared to control lymphoblasts"
    explanation: >-
      Reduced UFM1 conjugates measured in lymphoblasts from a patient
      homozygous for UFM1 p.Arg81Cys.
- name: Defective ER-Associated Ribosome Quality Control
  biological_scale: CELLULAR
  description: >-
    UFMylated RPL26 is enriched on ER membrane-bound ribosomes near the SEC61
    translocon, and its modification is needed to release and degrade arrested
    nascent chains on translocon-bound 60S subunits. Loss of this step is
    expected to compromise cotranslational protein biogenesis at the ER.
  biological_processes:
  - preferred_term: ribosome-associated quality control at the ER
    term:
      id: GO:0072344
      label: rescue of stalled cytosolic ribosome
    modifier: DECREASED
  downstream:
  - target: ER Stress and Unfolded Protein Response Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed link: ER protein-biogenesis failure is the natural source of the
      ER stress seen in UFM1-deficient neurons, but no study has shown the
      ribosome-quality-control defect itself drives the stress response in a
      disease model.
  evidence:
  - reference: PMID:30626644
    reference_title: "Ribosomal protein RPL26 is the principal target of UFMylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data suggest that UFMylation is a ribosomal modification specialized to facilitate metazoan-specific protein biogenesis at the ER."
    explanation: >-
      Places RPL26 UFMylation in ER-coupled protein biogenesis.
- name: Impaired ER-Phagy
  biological_scale: CELLULAR
  description: >-
    UFMylation of CYB5R3 on the ER membrane marks it for lysosomal turnover
    through ER-phagy. Mice carrying a UFMylation-resistant Cyb5r3 develop
    microcephaly, linking this branch to brain growth.
  biological_processes:
  - preferred_term: reticulophagy
    term:
      id: GO:0061709
      label: reticulophagy
    modifier: DECREASED
  downstream:
  - target: Neuronal Death and Impaired Brain Growth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:36543799
      reference_title: "The UFM1 system regulates ER-phagy through the ufmylation of CYB5R3."

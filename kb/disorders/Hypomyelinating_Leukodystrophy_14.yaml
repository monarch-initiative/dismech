- name: UBA5-Related Developmental and Epileptic Encephalopathy
  description: >-
    Biallelic variants in UBA5, the UFM1 E1 enzyme, cause an overlapping
    infantile encephalopathy with epilepsy, dystonia and microcephaly; some
    UBA5 patients also have hypomyelination. Curated separately as
    UBA5-Related_Developmental_and_Epileptic_Encephalopathy.
- name: UFC1-related neurodevelopmental disorder
  description: >-
    Biallelic UFC1 variants, affecting the UFM1 E2 enzyme, cause a severe
    early-onset encephalopathy with progressive microcephaly that is
    clinically and biochemically very similar to the UFM1 p.Arg81Cys disorder.
  evidence:
  - reference: PMID:29868776
    reference_title: "Biallelic UFM1 and UFC1 mutations expand the essential role of ufmylation in brain development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Remarkably, in four additional families where eight children have severe early-onset encephalopathy with progressive microcephaly, we identified two biallelic UFC1 mutations, which impair UFM1-UFC1 intermediate formation with resulting widespread reduction of cellular ufmylation, a pattern similar to that observed with UFM1 mutation."
    explanation: >-
      Shows the UFC1 disorder converges on the same biochemical defect.

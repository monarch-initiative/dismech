differential_diagnoses:
- name: TUBB4A-related H-ABC (Hypomyelinating Leukodystrophy 6)
  description: >-
    The classic cause of the H-ABC MRI pattern, due to dominant de novo TUBB4A
    variants. UFM1 was found by studying H-ABC patients without TUBB4A
    variants, and HLD14 is its recessive, more severe counterpart. Abnormal
    T2 signal in the lateral head of the caudate nucleus has been seen in
    UFM1-related but not TUBB4A-related H-ABC.
  evidence:
  - reference: PMID:28931644
    reference_title: "UFM1 founder mutation in the Roma population causes recessive variant of H-ABC."
    supports: SUPPORT

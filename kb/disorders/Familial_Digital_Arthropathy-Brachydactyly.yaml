    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show in three unrelated families that FDAB is caused by mutations encoding p.Gly270Val, p.Arg271Pro and p.Phe273Leu substitutions in the intracellular ankyrin-repeat domain of the cation channel TRPV4."
    explanation: >-
      Establishes both the causal gene and the localization of all three FDAB
      alleles to the intracellular ankyrin-repeat domain.
  downstream:
  - target: Impaired TRPV4 Cell-Surface Trafficking
    causal_link_type: DIRECT
    description: >-
      The mutant channel proteins are poorly delivered to the plasma membrane in
      a heterologous expression system.
    evidence:
    - reference: PMID:21964574
      reference_title: "Mutations in TRPV4 cause an inherited arthropathy of hands and feet."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional testing of mutant TRPV4 in HEK-293 cells showed that the mutant proteins have poor cell-surface localization."
      explanation: >-
        Attributes the trafficking defect to the FDAB mutant proteins, which is
        the step from variant to mislocalization.
- name: Impaired TRPV4 Cell-Surface Trafficking
  description: >-
    In HEK-293 cells the three FDAB mutant proteins reach the cell surface
    poorly, so less functional channel is available at the plasma membrane where
    TRPV4 does its osmo- and mechanosensory work.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: protein localization to plasma membrane
    term:

      label: protein localization to plasma membrane
    modifier: DECREASED
  evidence:
  - reference: PMID:21964574
    reference_title: "Mutations in TRPV4 cause an inherited arthropathy of hands and feet."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional testing of mutant TRPV4 in HEK-293 cells showed that the mutant proteins have poor cell-surface localization."
    explanation: >-
      States the mislocalization finding that this node represents.
  downstream:
  - target: Reduced TRPV4 Channel Responsiveness
    causal_link_type: DIRECT
    description: >-
      Less channel at the membrane is the proposed reason the mutant channels
      pass less calcium and fail to respond to osmotic challenge.
    evidence:
    - reference: PMID:21964574
      reference_title: "Mutations in TRPV4 cause an inherited arthropathy of hands and feet."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Calcium influx in response to the synthetic TRPV4 agonists GSK1016790A and 4αPDD was significantly reduced, and mutant channels did not respond to hypotonic stress."
      explanation: >-
        Reports the reduced calcium influx and absent hypotonic response
        measured in the same cells that showed the trafficking defect.
- name: Reduced TRPV4 Channel Responsiveness
  description: >-
    Agonist-evoked calcium influx through the FDAB mutant channels is
    significantly reduced and the channels do not respond to hypotonic stress,
    so the osmomechanical calcium signal TRPV4 normally supplies is blunted.
    TRPV4 is the principal osmo- and mechanosensitive calcium channel of the
    chondrocyte, which is why cartilage is the tissue that fails.

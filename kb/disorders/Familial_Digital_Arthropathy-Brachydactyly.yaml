diagnosis:
- name: Radiographic Assessment of the Hands and Feet
  description: >-
    Plain radiographs of the hands and feet show destructive change centred on
    the heads of the phalanges, metacarpals, and metatarsals, with the distal
    joints of the hand involved first. Serial films across ages are what
    established the subchondral lesion as the primary event, and the same
    pattern distinguishes FDAB from Thiemann disease, in which the proximal
    interphalangeal joints and the middle phalangeal bases are involved.
  diagnosis_term:
    preferred_term: radiographic imaging of the hands and feet
    term:
      id: NCIT:C17369
      label: Imaging Procedure
  evidence:
  - reference: PMID:31248428
    reference_title: "Thiemann disease and familial digital arthropathy - brachydactyly: two sides of the same coin?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In FDAB, the distal phalangeal joints are first affected with the middle phalangeal heads being the primary site of changes."
    explanation: >-
      Gives the radiographic pattern that supports the diagnosis.
  - reference: PMID:11891693
    reference_title: "Familial digital arthropathy-brachydactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is hypothesized from the radiological appearance of patients at different ages that FDAB might result from subchondral pathology primarily affecting the heads of the phalanges, metacarpals, and metatarsals, with the arthropathy and brachydactyly being secondary effects."
    explanation: >-
      Describes the radiological appearance across ages on which the diagnostic
      pattern rests.
- name: Molecular Confirmation of a TRPV4 Variant
  description: >-
    Diagnosis is confirmed by identifying a heterozygous TRPV4 pathogenic
    variant. In FDAB the expected finding is a missense substitution in the
    intracellular ankyrin-repeat domain, a different part of the protein from
    the recurrent skeletal-dysplasia hotspots, so the variant position itself
    carries phenotypic information.
  diagnosis_term:
    preferred_term: TRPV4 molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:24830047
    reference_title: "Autosomal Dominant TRPV4-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of an autosomal dominant TRPV4-related disorder is established in a proband who has characteristic clinical and neurophysiologic findings, radiographic findings in the skeletal dysplasias, and a heterozygous TRPV4 pathogenic variant identified by molecular genetic testing."
    explanation: >-
      GeneReviews states that molecular identification of a heterozygous TRPV4
      pathogenic variant establishes the diagnosis in this disease group.
  - reference: PMID:21964574
    reference_title: "Mutations in TRPV4 cause an inherited arthropathy of hands and feet."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show in three unrelated families that FDAB is caused by mutations encoding p.Gly270Val, p.Arg271Pro and p.Phe273Leu substitutions in the intracellular ankyrin-repeat domain of the cation channel TRPV4."
    explanation: >-
      Names the specific alleles and the protein domain a diagnostic test should
      expect to find in FDAB.
differential_diagnoses:
- name: Thiemann disease
  description: >-
    A non-inflammatory digital arthropathy of adolescence with substantial
    clinical and radiological overlap with FDAB and no causative gene
    identified. It begins at the proximal interphalangeal joints and the middle
    phalangeal bases, whereas FDAB begins distally with the middle phalangeal
    heads as the primary site; radial deviation and brachydactyly favour FDAB.
    One reported father-and-son pair referred as Thiemann disease carried a
    TRPV4 variant previously reported in FDAB, raising the possibility that the
    two labels describe one entity.
  distinguishing_features:
  - Thiemann disease starts at the proximal interphalangeal joints and the middle phalangeal bases; FDAB starts at the distal joints with the middle phalangeal heads as the primary site of change
  - Radial deviation of the fingers has been described only in FDAB
  - More extensive joint involvement and brachydactyly are expected in FDAB
  - No causative gene has been identified for Thiemann disease, so a TRPV4 pathogenic variant favours FDAB
  evidence:
  - reference: PMID:31248428
    reference_title: "Thiemann disease and familial digital arthropathy - brachydactyly: two sides of the same coin?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although more extensive joint involvement, a distal hand joint preponderance and brachydactyly are expected in FDAB, there are striking clinical and radiological similarities between the two entities."
    explanation: >-
      States both the overlap that makes Thiemann disease the key differential
      and the features that separate the two.
  - reference: PMID:31248428
    reference_title: "Thiemann disease and familial digital arthropathy - brachydactyly: two sides of the same coin?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-three cases of Thiemann disease have been described so far (Mangat et al, Ann Rheum Dis 64:11-2, 2005; Ha et al, Thiemann's disease: a case Report, 2017) but no gene variants have been identified as causative to date."
    explanation: >-
      Establishes that Thiemann disease has no identified causative gene, which
      is why molecular testing discriminates the two.
treatments:

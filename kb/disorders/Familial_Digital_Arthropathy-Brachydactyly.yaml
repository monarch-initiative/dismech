genetic:
- name: TRPV4
  association: Causative
  gene_term:
    preferred_term: TRPV4
    term:
      id: hgnc:18083
      label: TRPV4
  notes: >-
    All reported FDAB alleles are heterozygous missense substitutions in the
    intracellular ankyrin-repeat domain at residues 270-273. A later report
    identified a heterozygous TRPV4 variant (c.809G>T) in a father and son
    referred with a diagnosis of Thiemann disease, and states the identical
    variant had previously been reported to cause FDAB. TRPV4 variants outside
    this domain cause the skeletal dysplasias (the recurrent R594 and P799
    hotspots) and the TRPV4 peripheral neuropathies, so the ankyrin-repeat-domain
    cluster is the genotypic signature that separates FDAB within the allelic
    series.
  evidence:
  - reference: PMID:21964574
    reference_title: "Mutations in TRPV4 cause an inherited arthropathy of hands and feet."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show in three unrelated families that FDAB is caused by mutations encoding p.Gly270Val, p.Arg271Pro and p.Phe273Leu substitutions in the intracellular ankyrin-repeat domain of the cation channel TRPV4."
    explanation: >-
      Establishes TRPV4 as the causative gene and names all three alleles and
      their protein domain.
  - reference: PMID:22791502
    reference_title: "TRPV4-associated skeletal dysplasias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The known variant phenotypes are spondyloepiphyseal dysplasia Maroteaux type (Pseudo-Morquio type 2), parastremmatic dysplasia, and familial digital arthropathy with brachydactyly."
    explanation: >-
      Places FDAB within the TRPV4 allelic series as one of the phenotypes that
      deviates from the main skeletal dysplasia pattern.
  - reference: PMID:22791502
    reference_title: "TRPV4-associated skeletal dysplasias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over 50 different TRPV4 mutations have been reported, with two codons appearing to be mutational hot spots: P799 in exon 15, mostly associated with MD, and R594 in exon 11, associated with SMDK."
    explanation: >-
      Names the recurrent dysplasia hotspots that the FDAB ankyrin-repeat-domain
      cluster is distinct from.

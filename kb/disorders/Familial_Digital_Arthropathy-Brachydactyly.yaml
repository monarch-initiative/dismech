        Makes the causal claim for this edge explicitly, running from altered
        channel activity to failure of articular cartilage homeostasis.
- name: Loss of Articular Cartilage Homeostasis
  description: >-
    Articular cartilage of the digital joints fails to maintain itself. This is
    where FDAB diverges mechanistically from the TRPV4 skeletal dysplasias:
    those act on growth-plate chondrocytes through calcium-dependent follistatin
    upregulation and inhibition of endochondral ossification, whereas an FDAB
    (arthropathy) allele tested in the same chondrocyte assay left follistatin
    unchanged.

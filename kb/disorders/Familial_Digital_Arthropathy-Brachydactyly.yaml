  description: >-
    There is no disease-modifying therapy. Management is directed at the
    symptoms of the digital arthropathy - joint pain, stiffness, and deformity -
    and is typically delivered by a multidisciplinary team. GeneReviews also
    advises avoiding activities that place undue stress on affected joints,
    though its avoidance guidance is written for the TRPV4 skeletal dysplasias
    as a group and includes spinal precautions that do not apply to FDAB, in
    which the axial skeleton is spared.

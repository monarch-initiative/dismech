discussions:
- discussion_id: disc_fdab_channel_direction
  prompt: >-
    Do the FDAB ankyrin-repeat-domain variants reduce or increase TRPV4 channel
    activity, and how should the pathophysiology node be graded while the two
    published accounts disagree?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#TRPV4 Ankyrin Repeat Domain Missense Variants
  - pathophysiology#Reduced TRPV4 Channel Responsiveness
  rationale: >-
    The gene-discovery study measured poor cell-surface localization, reduced
    agonist-evoked calcium influx, and no response to hypotonic stress for all
    three FDAB alleles, and framed FDAB as the phenotype produced by TRPV4
    mutations that reduce channel activity, in contrast to the gain-of-function
    skeletal dysplasias and neuropathies. A later structure-function survey
    instead treats pathogenic TRPV4 mutations as a class that gains channel
    function and is cytotoxic, and reports that gain-of-function
    ankyrin-repeat-domain mutations sit at charged residues in the RhoA
    interface while other residues of that domain have normal or reduced
    activity. That last finding cuts both ways for FDAB, whose alleles include
    the charged Arg271 alongside the uncharged Gly270 and Phe273. This entry
    grades the variant consequence as loss of function, following the only study
    that assayed the FDAB alleles themselves. Resolving the question needs those
    three alleles re-assayed in the newer framework rather than inference from
    the class-level claim.
  evidence:
  - reference: PMID:21964574
    reference_title: "Mutations in TRPV4 cause an inherited arthropathy of hands and feet."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data indicate that TRPV4 mutations that reduce channel activity cause a third phenotype, inherited osteoarthropathy, and show the importance of TRPV4 activity in articular cartilage homeostasis."
    explanation: >-
      The reduced-activity position, stated by the only study that assayed the
      FDAB alleles.
  - reference: PMID:39021275
    reference_title: "Combined clinical, structural and cellular studies discriminate pathogenic and benign TRPV4 variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Pathogenic TRPV4 mutations cause gain of ion channel function and toxicity that can be rescued by small molecule TRPV4 antagonists in cellular and animal models, suggesting that TRPV4 antagonism could be therapeutic for patients."
    explanation: >-
      The competing class-level position, which treats gain of function and
      cytotoxicity as the shared mechanism across TRPV4 channelopathies
      including arthropathy.
  - reference: PMID:39021275
    reference_title: "Combined clinical, structural and cellular studies discriminate pathogenic and benign TRPV4 variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We find that gain-of-function mutations within the TRPV4 intracellular ankyrin repeat domain target charged amino acid residues important for RhoA interaction, whereas ankyrin repeat domain residues outside of the RhoA interface have normal or reduced ion channel activity."
    explanation: >-
      Narrows the disagreement to the ankyrin repeat domain specifically, and
      shows reduced activity is an expected outcome for some residues of that
      domain, which is where the FDAB alleles sit.
  - reference: PMID:22791502
    reference_title: "TRPV4-associated skeletal dysplasias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While most pathogenic mutations tested so far result in activation of the calcium channel in vitro, the mechanisms through which TRPV4 activation results in skeletal dysplasia and/or peripheral neuropathy remain unclear and the genotype-phenotype correlations in this group of disorders remains somewhat mysterious."
    explanation: >-
      Records that channel activation was already the majority finding across
      TRPV4 alleles while the genotype-phenotype logic remained unresolved,
      which is the background against which the FDAB result is an outlier.
- discussion_id: disc_fdab_follistatin_divergence
  prompt: >-
    Why does FDAB produce a joint-restricted osteoarthropathy rather than the
    growth-plate dysplasia other TRPV4 alleles cause?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Articular Cartilage Homeostasis
  - pathophysiology#Subchondral Destruction of the Phalangeal, Metacarpal and Metatarsal Heads
  rationale: >-
    The TRPV4 skeletal dysplasias act on growth-plate chondrocytes through
    calcium-dependent upregulation of follistatin, which inhibits BMP signaling
    and slows endochondral ossification. When an FDAB (arthropathy) allele was
    put through the same chondrocyte assay it left follistatin essentially
    unchanged, while three dysplasia alleles raised it two- to 2.3-fold. That
    single negative result is the clearest published evidence that FDAB reaches
    cartilage failure by a different route, and it fits the clinical picture:
    articular rather than growth-plate cartilage, normal stature, and a skeleton
    otherwise spared. The route FDAB does take is not established - the entry
    models it as failure of articular cartilage homeostasis on the strength of
    the gene-discovery paper's own interpretation, not on a demonstrated
    downstream pathway.
  evidence:
  - reference: PMID:24577120
    reference_title: "Follistatin in chondrocytes: the link between TRPV4 channelopathies and skeletal malformations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "FST was significantly up-regulated in primary chondrocytes transfected with 3 different dysplasia-causing TRPV4 mutations (2- to 2.3-fold), but was not affected by an arthropathy mutation (1.1-fold)."
    explanation: >-
      The negative result for the arthropathy allele set against positive
      results for three dysplasia alleles in the same assay.
  - reference: PMID:11891693
    reference_title: "Familial digital arthropathy-brachydactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The remainder of the skeleton is not affected."
    explanation: >-
      The clinical counterpart of the assay result: no generalized skeletal
      dysplasia accompanies the digital arthropathy.
- discussion_id: disc_fdab_thiemann_identity
  prompt: >-
    Are familial digital arthropathy-brachydactyly and Thiemann disease one
    entity or two?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - phenotypes#Non-Inflammatory Digital Arthropathy
  - differential_diagnoses#Thiemann disease
  rationale: >-
    A father and son referred with a diagnosis of Thiemann disease carried a
    heterozygous TRPV4 variant previously reported to cause FDAB, and a review of
    nineteen published Thiemann cases found five whose clinical and radiological
    findings also fit FDAB. The authors propose the two labels may be phenotypic
    variability of one entity. It remains unresolved because no DNA could be
    obtained from any historical Thiemann case, so the hypothesis has not been
    tested against the population it would reclassify.
  evidence:
  - reference: PMID:31248428
    reference_title: "Thiemann disease and familial digital arthropathy - brachydactyly: two sides of the same coin?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our analysis suggests that these two phenotypes may represent phenotypic variability of the same entity."
    explanation: >-
      States the proposed single-entity interpretation.
  - reference: PMID:31248428
    reference_title: "Thiemann disease and familial digital arthropathy - brachydactyly: two sides of the same coin?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite many attempts to identify other reported patients affected by Thiemann disease, we were not able to procure DNA from any of the cases to verify our findings."
    explanation: >-
      States why the question remains open: the historical Thiemann cases could
      not be genotyped.
notes: >-
  FDAB is the mildest and most anatomically restricted member of the TRPV4
  allelic series, and the only one in which digital shortening is a downstream
  consequence of joint destruction rather than a primary growth-plate dysplasia.
  Two things about this entry are worth flagging to a reader. First, the
  functional direction of the FDAB alleles is contested, and the
  functional_impact_category of LOSS_OF_FUNCTION follows only the study that
  assayed those alleles; see disc_fdab_channel_direction. Second, the pathway
  between the channel defect and cartilage failure is not established - what is
  published is a negative result excluding the follistatin route the dysplasias
  use, not a positive account of the route FDAB takes; see
  disc_fdab_follistatin_divergence. No animal model of the FDAB alleles has been
  reported, so animal_models is intentionally empty.

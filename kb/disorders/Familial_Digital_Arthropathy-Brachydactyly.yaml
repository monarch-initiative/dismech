inheritance:
- name: Autosomal Dominant
  description: >-
    Autosomal dominant transmission of a heterozygous TRPV4 missense variant.
    The founding kindred was a large multigenerational family, and a later
    report identified a TRPV4 variant in an affected father and son.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:24830047
    reference_title: "Autosomal Dominant TRPV4-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By definition, autosomal dominant TRPV4-related disorders are inherited in an autosomal dominant manner."
    explanation: >-
      GeneReviews states the mode of inheritance for the autosomal dominant
      TRPV4-related disorders, of which FDAB is the mildest skeletal phenotype.
  - reference: PMID:11891693
    reference_title: "Familial digital arthropathy-brachydactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a large family with a previously undescribed, dominantly inherited condition comprising arthropathy of the hands and feet and progressive shortening of the middle and distal phalanges."
    explanation: >-
      The founding clinical description reports dominant transmission in a large
      multigenerational family.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate exists. The published experience is three
    unrelated families in the gene-discovery report plus scattered later case
    reports, one of which was originally diagnosed as Thiemann disease.
  evidence:
  - reference: PMID:31248428
    reference_title: "Thiemann disease and familial digital arthropathy - brachydactyly: two sides of the same coin?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FDAB is reported in only a few patients and has been associated with three heterozygous missense variants in the Transient receptor potential vanilloid 4 (TRPV4) gene."
    explanation: >-
      States directly that the reported patient count is very small, which is
      the basis for the ultra-rare band and the cases-in-literature measure.
  - reference: PMID:21964574
    reference_title: "Mutations in TRPV4 cause an inherited arthropathy of hands and feet."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show in three unrelated families that FDAB is caused by mutations encoding p.Gly270Val, p.Arg271Pro and p.Phe273Leu substitutions in the intracellular ankyrin-repeat domain of the cation channel TRPV4."
    explanation: >-
      Quantifies the gene-discovery cohort as three unrelated families.
progression:
- phase: Childhood onset with progression to adult deformity
  age_range: First decade of life through adulthood
  notes: >-
    Joint changes begin in the first decade; the arthropathy is progressive and
    the resulting deformity and pain accumulate into adult life, with digital
    shortening becoming more evident with age.
  evidence:
  - reference: PMID:11891693
    reference_title: "Familial digital arthropathy-brachydactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Onset of FDAB is in the first decade and the arthropathy is progressive, resulting in deformity and pain in adult life."
    explanation: >-
      Gives both the age at onset and the progressive course that define the
      natural history of FDAB.
pathophysiology:
- name: TRPV4 Ankyrin Repeat Domain Missense Variants
  description: >-
    FDAB is caused by heterozygous missense substitutions clustered in the
    intracellular ankyrin-repeat domain of TRPV4 at residues 270-273
    (p.Gly270Val, p.Arg271Pro, p.Phe273Leu). This is a different part of the
    protein from the pore-region and C-terminal residues carrying the recurrent
    skeletal-dysplasia hotspots, and the restriction of FDAB to the digital
    joints tracks with that positional difference.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: TRPV4
      term:
        id: hgnc:18083
        label: TRPV4
    allele_type: missense
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Graded as loss of function on the strength of the only study that assayed
      the FDAB alleles themselves, which reported poor cell-surface localization
      and reduced agonist-evoked calcium influx for all three. This grading is
      contested: later structure-function work treats pathogenic TRPV4 variants
      as a class that gains channel function and is cytotoxic. See the
      discussion disc_fdab_channel_direction.

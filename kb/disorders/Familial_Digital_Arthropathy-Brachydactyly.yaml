name: Familial Digital Arthropathy-Brachydactyly
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
description: >-
  Familial digital arthropathy-brachydactyly (FDAB) is an autosomal dominant,
  non-inflammatory osteoarthropathy confined to the joints of the hands and
  feet. Onset is in the first decade, and the arthropathy is aggressive and
  progressive, producing deformity and pain by adult life. It is caused by
  heterozygous missense substitutions (p.Gly270Val, p.Arg271Pro, p.Phe273Leu)
  in the intracellular ankyrin-repeat domain of TRPV4, the same
  calcium-permeable cation channel whose variants elsewhere in the protein
  cause the TRPV4 skeletal dysplasias and the TRPV4 peripheral neuropathies.
  FDAB is the odd member of that allelic series in two ways. Clinically it is
  the mildest and most restricted of the TRPV4 skeletal phenotypes: the rest of
  the skeleton is spared and stature is normal. Mechanistically the
  brachydactyly is not a primary growth-plate dysplasia - the shortening of the
  middle and distal phalanges is a secondary consequence of subchondral
  destruction of the phalangeal, metacarpal, and metatarsal heads, so digital
  shortening sits downstream of joint destruction rather than beside it. The
  functional consequence of the ankyrin-repeat-domain variants is not settled:
  the primary report found reduced channel activity and poor cell-surface
  localization, while later structure-function work frames pathogenic TRPV4
  variants as gain-of-function and cytotoxic (see discussions).

  downstream:
  - target: Loss of Articular Cartilage Homeostasis
    causal_link_type: DIRECT
    description: >-
      The authors read the arthropathy phenotype as evidence that TRPV4 channel
      activity is required to maintain articular cartilage.
    evidence:
    - reference: PMID:21964574
      reference_title: "Mutations in TRPV4 cause an inherited arthropathy of hands and feet."

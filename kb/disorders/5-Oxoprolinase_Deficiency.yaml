diagnosis:
- name: Persistent urinary 5-oxoproline by organic acid analysis
  diagnosis_term:
    preferred_term: urine chemistry measurement
    term:
      id: NCIT:C61044
      label: Urine Chemistry Measurement
  description: >
    Detect and quantify 5-oxoproline in urine, typically by GC-MS. Persistence
    supports an inherited biochemical defect but is not specific for OPLAH
    deficiency, so etiologic confirmation and exclusion of secondary causes are
    required.
  results: >
    Markedly elevated or repeatedly elevated urinary 5-oxoproline
    (L-pyroglutamic acid).
  evidence:
  - reference: PMID:17397529
    reference_title: Inborn errors in the metabolism of glutathione.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The level of 5-oxoproline in urine can be determined by gas chromatography-mass spectrometry"
    explanation: The review identifies urinary GC-MS as the biochemical test.
  - reference: PMID:39129838
    reference_title: Is 5-Oxoprolinase Deficiency More than Just a Benign Condition?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "quantitation of 5-oxoproline by stable isotope dilution gave a value of 177.9 mmol/mol creatinine"
    explanation: A recent case demonstrates quantitative confirmation of the urinary marker.
- name: Biallelic OPLAH molecular confirmation
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >
    Confirm biallelic OPLAH variants in trans that are consistent with the
    biochemical phenotype. Persistent 5-oxoprolinuria with only one OPLAH
    variant is insufficient to establish recessive OPLAH deficiency; variant
    interpretation should incorporate segregation, enzyme activity, and
    allele-specific functional evidence.
  results: >
    Homozygous or compound-heterozygous OPLAH variants in trans, with evidence
    linking them to deficient enzyme activity or persistent 5-oxoprolinuria.
  evidence:
  - reference: PMID:27477828
    reference_title: "Unravelling 5-oxoprolinuria (pyroglutamic aciduria) due to bi-allelic OPLAH mutations: 20 new mutations in 14 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all patients with 5-oxoprolinuria studied, bi-allelic mutations in OPLAH were indicated."
    explanation: The largest series supports biallelic molecular confirmation.
  - reference: PMID:25129617
    reference_title: New insights into the genetics of 5-oxoprolinase deficiency and further evidence that it is a benign biochemical condition.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A yeast in vivo growth assay revealed that only p.S323R, p.G860R and p.D1241V affected the activity of the enzyme."
    explanation: >
      Functional discrimination among reported missense variants supports
      cautious variant interpretation rather than accepting any rare change.
- name: 5-oxoprolinase activity assay
  diagnosis_term:
    preferred_term: clinical laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  description: >
    When available, measure 5-oxoprolinase activity in leukocytes or cultured
    skin fibroblasts. Do not use erythrocytes, which normally lack the enzyme.
  results: Markedly reduced 5-oxoprolinase activity in an appropriate nucleated-cell specimen.
  evidence:
  - reference: PMID:17397529
    reference_title: Inborn errors in the metabolism of glutathione.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "leukocytes or cultured skin fibroblasts (5-oxoprolinase is not present in erythrocytes)."
    explanation: The review defines the appropriate and inappropriate assay tissues.
  - reference: PMID:6113726
    reference_title: 5-oxoprolinuria due to hereditary 5-oxoprolinase deficiency in two brothers--a new inborn error of the gamma-glutamyl cycle.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the activity of which was 2-4% of that of control subjects."
    explanation: The original patients had a severe measurable enzyme deficiency.
- name: Clinical attribution and alternative-diagnosis assessment
  description: >
    In a symptomatic person, do not treat an OPLAH result or 5-oxoprolinuria as
    a sufficient explanation for neurologic or systemic findings. Review
    acid-base status, complete blood count and hemolysis markers, medication and
    nutrition history, renal function, intercurrent illness, and consider broad
    genomic testing for an independent diagnosis.
  evidence:
  - reference: PMID:21651516
    reference_title: "5-Oxoprolinase deficiency: report of the first human OPLAH mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "establishing a molecular diagnosis in the few cases with abnormal neurological outcome to exclude potentially overlapping biochemical defects"
    explanation: >
      The first molecular report explicitly recommends excluding overlapping
      biochemical diagnoses in neurologically abnormal cases.
  - reference: PMID:27477828
    reference_title: "Unravelling 5-oxoprolinuria (pyroglutamic aciduria) due to bi-allelic OPLAH mutations: 20 new mutations in 14 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although a pathogenic role of 5-oxoprolinase deficiency remains possible, this is not supported by our findings."
    explanation: >
      The largest family series cautions against default clinical attribution
      to OPLAH deficiency.
differential_diagnoses:
- name: Glutathione synthetase deficiency
  disease_term:
    preferred_term: inherited glutathione synthetase deficiency
    term:
      id: MONDO:0017909
      label: inherited glutathione synthetase deficiency
  description: >
    Biallelic GSS deficiency is the principal inherited differential because
    its systemic forms also produce 5-oxoprolinuria. Unlike isolated OPLAH
    deficiency, it characteristically causes glutathione depletion, hemolytic
    anemia, high-anion-gap metabolic acidosis, and in severe disease recurrent
    infection and progressive neurologic involvement.
  distinguishing_features:
  - Hemolytic anemia and reduced erythrocyte glutathione
  - Persistent metabolic acidosis or high anion gap
  - Reduced glutathione synthetase activity and biallelic GSS variants
  - Recurrent bacterial infections or progressive neurologic disease in severe cases
  evidence:
  - reference: PMID:17397529
    reference_title: Inborn errors in the metabolism of glutathione.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Glutathione synthetase deficiency is the most frequently recognized
      disorder and, in its severe form, it is associated with hemolytic anemia,
      metabolic acidosis, 5-oxoprolinuria, central nervous system (CNS) damage
      and recurrent bacterial infections.
    explanation: The review identifies the distinguishing systemic GSS-deficiency phenotype.
  - reference: PMID:17397529
    reference_title: Inborn errors in the metabolism of glutathione.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "acid-base balance is usually normal."
    explanation: >
      Usually normal acid-base balance in OPLAH deficiency makes persistent
      acidosis an important discriminator.
- name: Acquired drug-related pyroglutamic acidosis
  description: >
    Acquired 5-oxoproline accumulation usually presents as severe
    high-anion-gap metabolic acidosis in an adult exposed to paracetamol,
    sometimes with a beta-lactamase-resistant penicillin or vigabatrin.
    Undernutrition, alcohol-use disorder, kidney disease, and infection are
    common predisposing contexts.
  distinguishing_features:
  - Recent or prolonged paracetamol exposure
  - Flucloxacillin or another beta-lactamase-resistant penicillin, or vigabatrin exposure
  - Adult onset with severe high-anion-gap metabolic acidosis
  - Undernutrition, alcohol-use disorder, kidney disease, or active infection
  - Improvement after removal of the acquired trigger rather than recessive OPLAH segregation
  evidence:
  - reference: PMID:39407841
    reference_title: "Drug-Related Pyroglutamic Acidosis: Systematic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At least 92% of patients were on paracetamol therapy for >10 days at an
      appropriate dose, 32% on a β-lactamase-resistant penicillin, and 2.3% on
      vigabatrin.
    explanation: The systematic review quantifies the principal medication exposures.
  - reference: PMID:39407841
    reference_title: "Drug-Related Pyroglutamic Acidosis: Systematic Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This condition predominantly affects adults, especially women with
      factors like undernutrition, alcohol-use disorder, or kidney disease,
      often during infection.
    explanation: The systematic review identifies the characteristic acquired context.
- name: Other secondary or transient 5-oxoprolinuria
  description: >
    Urinary 5-oxoproline can rise without an inherited gamma-glutamyl-cycle
    defect. Reported settings include dietary sources, severe burns or
    Stevens-Johnson syndrome, ATP depletion in critical illness or other inborn
    errors, homocystinuria, prematurity, malnutrition or pregnancy, and
    nephropathic cystinosis.
  distinguishing_features:
  - Often transient or context-dependent biochemical abnormality
  - Prematurity, pregnancy, malnutrition, severe burns, or critical illness
  - A separate metabolic diagnosis such as homocystinuria, urea-cycle disease, tyrosinemia, or cystinosis
  - No convincing biallelic OPLAH genotype or deficient nucleated-cell enzyme activity
  evidence:
  - reference: PMID:17397529
    reference_title: Inborn errors in the metabolism of glutathione.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Causes of 5-oxoprolinuria beside glutathione synthetase deficiency and 5-oxoprolinase deficiency."
    explanation: The review explicitly tabulates non-OPLAH causes.
- name: Independent neurologic, developmental, renal, or gastrointestinal disorder
  description: >
    Because clinical features have failed to segregate with 5-oxoprolinuria in
    multiple families, a symptomatic individual may have an unrelated genetic
    or acquired disorder while OPLAH deficiency explains only the biochemical
    marker. Phenotype-driven exome or genome analysis and organ-specific
    evaluation should remain open.
  distinguishing_features:
  - Phenotype absent in relatives with the same OPLAH biochemical trait
  - Phenotype present in relatives without 5-oxoprolinuria
  - A second molecular diagnosis or a better-fitting acquired explanation
  - Clinical course not correlated with the urinary biochemical abnormality
  evidence:
  - reference: PMID:27477828
    reference_title: "Unravelling 5-oxoprolinuria (pyroglutamic aciduria) due to bi-allelic OPLAH mutations: 20 new mutations in 14 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical features were highly variable and in several sib pairs, did not segregate with 5-oxoprolinuria."
    explanation: >
      Within-family nonsegregation directly supports an active search for an
      alternative cause of symptoms.
treatments:
- name: Manifestation-directed supportive care
  action_category: THERAPEUTIC
  description: >
    No OPLAH-directed or disease-modifying treatment is established. Do not
    treat an isolated urinary metabolite elevation. Provide ordinary
    symptom-directed care, such as antiseizure therapy or developmental
    services, only for independently assessed clinical indications.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:17397529
    reference_title: Inborn errors in the metabolism of glutathione.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "No specific treatment has been proposed or tried."
    explanation: The disease review reports no specific OPLAH-deficiency treatment.
  - reference: PMID:39129838
    reference_title: Is 5-Oxoprolinase Deficiency More than Just a Benign Condition?
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "well-controlled epilepsy with levetiracetam."
    explanation: >
      A case illustrates standard manifestation-directed seizure treatment, not
      an OPLAH-directed therapy.
- name: Genetic counseling
  action_category: COUNSELING_INFORMATIONAL
  description: >
    Counseling should address autosomal recessive inheritance of the
    biochemical phenotype, recurrence risk, carrier testing, and the important
    uncertainty about whether any clinical manifestations are caused by OPLAH
    deficiency.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:27477828
    reference_title: "Unravelling 5-oxoprolinuria (pyroglutamic aciduria) due to bi-allelic OPLAH mutations: 20 new mutations in 14 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "autosomal recessive mode of inheritance for 5-oxoprolinase deficiency"
    explanation: Family segregation supports recessive recurrence-risk counseling.
  - reference: PMID:17397529
    reference_title: Inborn errors in the metabolism of glutathione.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "They should be referred for genetic counseling."
    explanation: The disease review explicitly recommends genetic counseling.
genetic:
- name: Biallelic OPLAH variants
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: OPLAH
    term:
      id: hgnc:8149
      label: OPLAH
  variants:
  - name: Biallelic OPLAH variants associated with persistent 5-oxoprolinuria
    description: >
      Molecularly confirmed individuals carry homozygous or compound
      heterozygous OPLAH variants. Reported alleles include truncating and
      missense variants, many private to individual families. Functional or
      segregation evidence is particularly important for missense variants.
    evidence:
    - reference: PMID:21651516
      reference_title: "5-Oxoprolinase deficiency: report of the first human OPLAH mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "first molecularly characterized patients with 5-oxoprolinase deficiency due to a mutation in OPLAH"
      explanation: The report first established the molecular OPLAH association.
    - reference: PMID:27477828
      reference_title: "Unravelling 5-oxoprolinuria (pyroglutamic aciduria) due to bi-allelic OPLAH mutations: 20 new mutations in 14 families."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "all 20 mutations identified were novel and private to the respective families."
      explanation: The largest series documents extensive family-specific allelic heterogeneity.
    - reference: PMID:25129617
      reference_title: New insights into the genetics of 5-oxoprolinase deficiency and further evidence that it is a benign biochemical condition.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "only p.S323R, p.G860R and p.D1241V affected the activity of the enzyme."
      explanation: Functional testing distinguishes damaging from non-damaging reported missense alleles.
  features: >
    Biallelic OPLAH dysfunction causes the recessive biochemical phenotype of
    deficient 5-oxoprolinase activity and persistent 5-oxoprolinuria. Current
    evidence does not establish that the same genotype causes a predictable
    neurologic or multisystem phenotype.
  evidence:
  - reference: PMID:27477828
    reference_title: "Unravelling 5-oxoprolinuria (pyroglutamic aciduria) due to bi-allelic OPLAH mutations: 20 new mutations in 14 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all patients with 5-oxoprolinuria studied, bi-allelic mutations in OPLAH were indicated."
    explanation: Biallelic OPLAH variants explain the urinary biochemical phenotype.
  - reference: PMID:27477828
    reference_title: "Unravelling 5-oxoprolinuria (pyroglutamic aciduria) due to bi-allelic OPLAH mutations: 20 new mutations in 14 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although a pathogenic role of 5-oxoprolinase deficiency remains possible, this is not supported by our findings."
    explanation: The same study does not support extension of the molecular association to a clinical syndrome.
discussions:
- discussion_id: gap_oplah_clinical_pathogenicity
  prompt: >
    Does biallelic OPLAH deficiency cause a reproducible clinical syndrome, or
    is it primarily a biochemical trait that can be incidental to neurologic
    and systemic disease?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#5-oxo-L-proline accumulation and urinary excretion
  - phenotype#Delayed speech and language development
  - phenotype#Seizure
  rationale: >
    The enzyme defect, recessive segregation, and persistent 5-oxoprolinuria
    are established. Earlier molecular reports describe benign courses, and the
    largest family series found nonsegregation of clinical findings. Recent
    case reports argue for epilepsy, developmental abnormalities, growth
    retardation, and neuroimaging changes, but remain vulnerable to
    ascertainment bias, circular phenotype-based variant interpretation, and
    alternative diagnoses. Until this is resolved, the causal graph stops at
    the biochemical phenotype and clinical observations are marked PARTIAL
    without frequency assignments.
  proposed_experiments:
  - experiment_id: exp_oplah_genotype_first_natural_history
    name: Prospective genotype-first OPLAH natural-history cohort
    description: >
      Ascertain biallelic OPLAH carriers without selecting for neurologic
      disease, quantify urinary and plasma 5-oxoproline longitudinally, and use
      standardized developmental, neurologic, renal, hematologic, and
      gastrointestinal assessments against matched controls.
  - experiment_id: exp_oplah_intrafamilial_segregation
    name: Intrafamilial genotype-metabolite-phenotype segregation
    description: >
      Study symptomatic and asymptomatic relatives with the same OPLAH
      genotypes, using quantitative metabolomics and genome-wide testing for
      second diagnoses or modifiers.
  - experiment_id: exp_oplah_neuronal_causality
    name: Human neuronal OPLAH loss-and-rescue model
    description: >
      Compare OPLAH-deficient and isogenic rescued human neuronal cells or
      organoids for 5-oxoproline accumulation, electrophysiology,
      myelination-related readouts, cell stress, and dose-response to exogenous
      5-oxoproline.
  evidence:
  - reference: PMID:21651516
    reference_title: "5-Oxoprolinase deficiency: report of the first human OPLAH mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Debate continues as to whether this is a benign biochemical defect"
    explanation: The first molecular report explicitly identifies the controversy.
  - reference: PMID:27477828
    reference_title: "Unravelling 5-oxoprolinuria (pyroglutamic aciduria) due to bi-allelic OPLAH mutations: 20 new mutations in 14 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical features were highly variable and in several sib pairs, did not segregate with 5-oxoprolinuria."
    explanation: The largest family series supplies the strongest nonsegregation evidence.
  - reference: PMID:9453376
    reference_title: "Growth failure, encephalopathy, and endocrine dysfunctions in two siblings, one with 5-oxoprolinase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present findings give evidence that 5-oxoprolinase deficiency is not
      associated with a distinct morbid phenotype.
    explanation: >
      Discordant enzyme deficiency in two sisters with the same severe syndrome
      supplies direct evidence for the benign-biochemical interpretation.
  - reference: PMID:39129838
    reference_title: Is 5-Oxoprolinase Deficiency More than Just a Benign Condition?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that inherited 5-oxoprolinase deficiency is not a benign biochemical condition"
    explanation: A recent case report represents the opposing clinical-pathogenicity interpretation.
  - reference: PMID:41675684
    reference_title: "5-Oxoprolinase Deficiency and Epilepsy: A Report of Four Cases with New Clinical Findings and Clinical Diversity Even in the Same Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical picture is not well defined due to the limited number of cases."
    explanation: The newest series acknowledges that the clinical phenotype remains unresolved.
  notes: >
    Expert review is tracked in
    https://github.com/monarch-initiative/dismech/issues/6615.

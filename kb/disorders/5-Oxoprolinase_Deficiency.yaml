name: 5-Oxoprolinase Deficiency
category: Mendelian
creation_date: '2026-05-03T00:00:00Z'
synonyms:
- Oxoprolinuria due to oxoprolinase deficiency
- OPLAH deficiency
- OPLAHD
- Pyroglutamic aciduria due to OPLAH deficiency
description: >
  5-oxoprolinase deficiency is an ultra-rare autosomal recessive biochemical
  disorder caused by biallelic variants in OPLAH. Deficient ATP-dependent
  5-oxoprolinase activity reduces conversion of 5-oxo-L-proline to L-glutamate
  and produces persistent 5-oxoprolinuria. This biochemical gene-disease
  relationship is well supported, but a reproducible clinical syndrome is not.
  Neurologic, developmental, renal, gastrointestinal, and growth
  findings have been reported in selected patients, while the largest family
  series found that clinical features were highly variable and did not
  segregate with 5-oxoprolinuria in several sibling pairs. Acid-base balance is
  usually normal; high-anion-gap metabolic acidosis or hemolysis should prompt
  evaluation for glutathione synthetase deficiency or an acquired or secondary
  cause of 5-oxoprolinuria.
disease_term:
  preferred_term: 5-oxoprolinase deficiency
  term:
    id: MONDO:0009825
    label: 5-oxoprolinase deficiency
parents:
- Inherited Glutathione Metabolism Disease
- Inborn Error of Metabolism
inheritance:
- name: Autosomal recessive inheritance of the biochemical phenotype
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: UNKNOWN
  expressivity: UNKNOWN
  description: >
    Persistent 5-oxoprolinuria tracks with biallelic OPLAH variants in the
    largest family series, while tested heterozygotes lacked the biochemical
    phenotype. This recessive segregation establishes the biochemical trait;
    it does not establish penetrance of the heterogeneous clinical findings.
  evidence:
  - reference: PMID:27477828
    reference_title: "Unravelling 5-oxoprolinuria (pyroglutamic aciduria) due to bi-allelic OPLAH mutations: 20 new mutations in 14 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all patients with 5-oxoprolinuria studied, bi-allelic mutations in
      OPLAH were indicated.
    explanation: >
      The largest segregation series links the persistent urinary biochemical
      phenotype to biallelic OPLAH variants.
  - reference: PMID:27477828
    reference_title: "Unravelling 5-oxoprolinuria (pyroglutamic aciduria) due to bi-allelic OPLAH mutations: 20 new mutations in 14 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the absence of 5-oxoprolinuria in all tested heterozygotes."
    explanation: >
      Absence of the urinary phenotype in tested carriers supports recessive
      biochemical expression.
  - reference: PMID:25129617
    reference_title: New insights into the genetics of 5-oxoprolinase deficiency and further evidence that it is a benign biochemical condition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hereditary 5-oxoprolinase deficiency is a benign biochemical condition
      caused by mutations in the OPLAH gene, which are transmitted in an
      autosomal recessive manner
    explanation: >
      This molecular and functional report explicitly supports autosomal
      recessive inheritance while separating the biochemical trait from an
      assumed clinical syndrome.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_high: 0.1
  notes: >
    This is an Orphanet rarity category rather than a population-derived
    prevalence estimate. Published evidence consists of case reports and small
    family series.
  evidence:
  - reference: ORPHA:33572
    reference_title: "5-oxoprolinase deficiency"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "<1 / 1 000 000 | Worldwide | Point prevalence | ORPHANET"
    explanation: Orphanet classifies worldwide point prevalence below one per million.
progression:
- phase: Persistent biochemical phenotype
  notes: >
    Urinary 5-oxoproline can be detected from infancy onward and may remain
    persistently elevated despite a largely benign clinical course. There is no
    established sequence of clinical progression attributable to OPLAH
    deficiency.
  evidence:
  - reference: PMID:21651516
    reference_title: "5-Oxoprolinase deficiency: report of the first human OPLAH mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "largely benign clinical course of the patients described herein despite persistent 5-oxoprolinuria"
    explanation: >
      The first molecular report documents persistence of the biochemical
      phenotype without a corresponding progressive clinical course.
pathophysiology:
- name: OPLAH molecular function deficiency
  mechanism_confidence: ESTABLISHED
  description: >
    Biallelic OPLAH variants reduce ATP-dependent 5-oxoprolinase activity.
    5-oxoprolinase normally opens the ring of 5-oxo-L-proline and converts it
    to L-glutamate in the gamma-glutamyl cycle.
  genes:
  - preferred_term: OPLAH
    term:
      id: hgnc:8149
      label: OPLAH
  molecular_functions:
  - preferred_term: 5-oxoprolinase (ATP-hydrolyzing) activity
    term:
      id: GO:0017168
      label: 5-oxoprolinase (ATP-hydrolyzing) activity
    modifier: DECREASED
  chemical_entities:
  - preferred_term: 5-oxo-L-proline
    term:
      id: CHEBI:18183
      label: 5-oxo-L-proline
  - preferred_term: L-glutamate
    term:
      id: CHEBI:29985
      label: L-glutamate(1-)
  evidence:
  - reference: PMID:21651516
    reference_title: "5-Oxoprolinase deficiency: report of the first human OPLAH mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutation in OPLAH (which encodes 5-oxoprolinase)."
    explanation: The first molecular report identifies OPLAH as the encoding gene.
  - reference: PMID:6113726
    reference_title: 5-oxoprolinuria due to hereditary 5-oxoprolinase deficiency in two brothers--a new inborn error of the gamma-glutamyl cycle.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients had a specific deficiency of 5-oxoprolinase, the activity of which was 2-4% of that of control subjects."
    explanation: >
      Direct enzyme assays establish severe loss of 5-oxoprolinase activity in
      affected individuals.
  - reference: PMID:25129617
    reference_title: New insights into the genetics of 5-oxoprolinase deficiency and further evidence that it is a benign biochemical condition.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A yeast in vivo growth assay revealed that only p.S323R, p.G860R and p.D1241V affected the activity of the enzyme."
    explanation: >
      Functional testing supports activity loss for selected missense alleles
      and cautions against assuming that every reported OPLAH change is
      functionally damaging.
  downstream:
  - target: 5-oxo-L-proline accumulation and urinary excretion
    causal_link_type: DIRECT
    description: >
      Reduced enzyme activity decreases conversion of 5-oxo-L-proline to
      glutamate, causing the substrate to accumulate in body fluids and be
      excreted in urine.
    evidence:
    - reference: PMID:17397529
      reference_title: Inborn errors in the metabolism of glutathione.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        decreased activity of 5-oxoprolinase leads to decreased conversion of
        5-oxoproline to glutamate.
      explanation: >
        The biochemical review directly describes the substrate-accumulation
        mechanism.
- name: 5-oxo-L-proline accumulation and urinary excretion
  mechanism_confidence: ESTABLISHED
  description: >
    Failure to clear 5-oxo-L-proline, also called pyroglutamic acid, causes its
    accumulation in body fluids and persistent urinary excretion. This is the
    defining and reproducible biochemical phenotype. No causal edge is drawn
    from this node to the reported clinical findings because that relationship
    has not been established.
  chemical_entities:
  - preferred_term: 5-oxo-L-proline
    term:
      id: CHEBI:18183
      label: 5-oxo-L-proline
    modifier: INCREASED
  evidence:
  - reference: PMID:17397529
    reference_title: Inborn errors in the metabolism of glutathione.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "5-Oxoprolinase deficiency is associated with 5-oxoprolinuria"
    explanation: The review identifies 5-oxoprolinuria as the consistent biochemical association.
  - reference: PMID:6113726
    reference_title: 5-oxoprolinuria due to hereditary 5-oxoprolinase deficiency in two brothers--a new inborn error of the gamma-glutamyl cycle.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gas chromatography of urine from both brothers revealed massive excretion of L-5-oxoproline (pyroglutamic acid)."
    explanation: The original cases directly demonstrate marked urinary excretion.
  downstream:
  - target: Increased urinary L-pyroglutamic acid
    causal_link_type: DIRECT
    description: >
      Accumulated 5-oxo-L-proline is excreted as urinary L-pyroglutamic acid.
    evidence:
    - reference: PMID:6113726
      reference_title: 5-oxoprolinuria due to hereditary 5-oxoprolinase deficiency in two brothers--a new inborn error of the gamma-glutamyl cycle.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Gas chromatography of urine from both brothers revealed massive excretion of L-5-oxoproline (pyroglutamic acid)."
      explanation: The original biochemical study directly supports this edge.
phenotypes:
- name: Increased urinary L-pyroglutamic acid
  frequency: VERY_FREQUENT
  description: >
    Persistent urinary 5-oxoproline elevation is the defining biochemical
    phenotype of molecularly confirmed OPLAH deficiency.
  phenotype_term:
    preferred_term: Increased level of L-pyroglutamic acid in urine
    term:
      id: HP:0410132
      label: Increased level of L-pyroglutamic acid in urine
  evidence:
  - reference: ORPHA:33572
    reference_title: "5-oxoprolinase deficiency"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HP:0410132 | Increased level of L-pyroglutamic acid in urine | Very frequent (99-80%)"
    explanation: Orphanet identifies this as the dominant biochemical phenotype.
  - reference: PMID:27477828
    reference_title: "Unravelling 5-oxoprolinuria (pyroglutamic aciduria) due to bi-allelic OPLAH mutations: 20 new mutations in 14 families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all patients with 5-oxoprolinuria studied, bi-allelic mutations in OPLAH were indicated."
    explanation: >
      The largest series establishes the link between persistent
      5-oxoprolinuria and biallelic OPLAH variants.
- name: Delayed speech and language development
  description: >
    Speech difficulty has been reported in symptomatic ascertainment, but
    causality and frequency are unresolved. It should not be attributed to
    OPLAH deficiency without evaluation for an alternative diagnosis.
  phenotype_term:
    preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  evidence:
  - reference: PMID:39129838
    reference_title: Is 5-Oxoprolinase Deficiency More than Just a Benign Condition?
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He did not speak fluently. He was using 5-10 words with decreased
      language fluency.
    explanation: >
      A single molecularly investigated three-year-old had markedly limited
      expressive language. This supports co-occurrence of delayed speech and
      language development but not causality.
  - reference: PMID:27477828
    reference_title: "Unravelling 5-oxoprolinuria (pyroglutamic aciduria) due to bi-allelic OPLAH mutations: 20 new mutations in 14 families."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical features were highly variable and in several sib pairs, did not segregate with 5-oxoprolinuria."
    explanation: >
      Nonsegregation in the largest family series argues against treating
      developmental findings as an established OPLAH phenotype.
  - reference: PMID:9453376
    reference_title: "Growth failure, encephalopathy, and endocrine dysfunctions in two siblings, one with 5-oxoprolinase deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present findings give evidence that 5-oxoprolinase deficiency is not
      associated with a distinct morbid phenotype.
    explanation: >
      Two sisters shared the same severe syndrome although only one had the
      enzyme deficiency, directly arguing against attribution of their
      developmental phenotype to OPLAH deficiency.
- name: Seizure
  description: >
    Epilepsy, including drug-resistant epilepsy, has been reported in recent
    cases. The observations remain case-level and are counterbalanced by
    within-family clinical diversity and earlier nonsegregation.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:39129838
    reference_title: Is 5-Oxoprolinase Deficiency More than Just a Benign Condition?
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "presented with epilepsy at the age of 2 years."
    explanation: A single case establishes co-occurrence of epilepsy and an OPLAH variant.
  - reference: PMID:41675684
    reference_title: "5-Oxoprolinase Deficiency and Epilepsy: A Report of Four Cases with New Clinical Findings and Clinical Diversity Even in the Same Family."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients had unreported clinical symptoms such as growth retardation and drug-resistant epilepsy."
    explanation: >
      The newest case series adds drug-resistant epilepsy as an observation;
      this is case-level association evidence only.
  - reference: PMID:41675684
    reference_title: "5-Oxoprolinase Deficiency and Epilepsy: A Report of Four Cases with New Clinical Findings and Clinical Diversity Even in the Same Family."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "There were different clinical findings in the same family."
    explanation: >
      The full family report describes a severely affected girl and two
      neurologically healthy brothers, aged 13 and 15 years, with the same
      compound-heterozygous OPLAH genotype. This nonsegregation argues against
      a deterministic OPLAH-associated epilepsy syndrome.
  - reference: PMID:27477828
    reference_title: "Unravelling 5-oxoprolinuria (pyroglutamic aciduria) due to bi-allelic OPLAH mutations: 20 new mutations in 14 families."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Although a pathogenic role of 5-oxoprolinase deficiency remains possible, this is not supported by our findings."
    explanation: >
      The largest family series does not support a general clinical pathogenic
      role for the biochemical defect.
- name: Growth delay
  description: >
    Growth retardation was reported in the 2026 case series, but no
    disease-level frequency or causal relationship has been established.
  phenotype_term:
    preferred_term: Growth delay
    term:
      id: HP:0001510
      label: Growth delay
  evidence:
  - reference: PMID:41675684
    reference_title: "5-Oxoprolinase Deficiency and Epilepsy: A Report of Four Cases with New Clinical Findings and Clinical Diversity Even in the Same Family."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients had unreported clinical symptoms such as growth retardation and drug-resistant epilepsy."
    explanation: >
      The report supports case-level co-occurrence only; it does not establish
      growth retardation as an OPLAH-caused feature.
  - reference: PMID:9453376
    reference_title: "Growth failure, encephalopathy, and endocrine dysfunctions in two siblings, one with 5-oxoprolinase deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these patients suffer from a hitherto undescribed autosomal recessive
      disorder, unrelated to the 5-oxoprolinase deficiency of the elder sib.
    explanation: >
      Severe growth failure affected both sisters while OPLAH enzyme deficiency
      was confined to one, refuting OPLAH deficiency as the cause in that family.
- name: Nephrolithiasis
  description: >
    Kidney stones occurred in the two brothers from the original biochemical
    report, but stones also occurred in paternal relatives and a causal
    connection to OPLAH deficiency was not established.
  phenotype_term:
    preferred_term: Nephrolithiasis
    term:
      id: HP:0000787
      label: Nephrolithiasis
  evidence:
  - reference: PMID:6113726
    reference_title: 5-oxoprolinuria due to hereditary 5-oxoprolinase deficiency in two brothers--a new inborn error of the gamma-glutamyl cycle.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Their father and several paternal relatives have had kidney stones. Both boys developed urolithiasis"
    explanation: >
      The original family establishes co-occurrence but also provides a familial
      confounder independent of the recessive biochemical trait.
- name: Enterocolitis
  description: >
    Recurrent gastrointestinal episodes were part of the original brothers'
    presentation, but extensive investigation did not establish a cause and the
    symptoms did not recur after treatment was stopped.
  phenotype_term:
    preferred_term: Enterocolitis
    term:
      id: HP:0004387
      label: Enterocolitis
  evidence:
  - reference: PMID:6113726
    reference_title: 5-oxoprolinuria due to hereditary 5-oxoprolinase deficiency in two brothers--a new inborn error of the gamma-glutamyl cycle.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In spite of extensive investigations no cause of their enterocolitis could be established."
    explanation: >
      The source documents the phenotype while explicitly acknowledging that
      its cause was unresolved.

    because they normally lack 5-oxoprolinase.
  readouts:
  - target: OPLAH molecular function deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >
      Reduced activity is the direct functional readout of deficient OPLAH
      molecular function.
  evidence:
  - reference: PMID:17397529
    reference_title: Inborn errors in the metabolism of glutathione.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Activity of 5-oxoprolinase in leukocytes and/or cultured fibroblasts can be measured"

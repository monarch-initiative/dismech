notes: >-
  Curation distinguishes the established recessive biochemical phenotype from
  the unresolved clinical phenotype. Nonspecific Orphanet clinical-frequency
  bands and causal edges from 5-oxoproline accumulation to clinical findings
  are intentionally omitted because published families show ascertainment bias
  and nonsegregation. Duplicate DOI records and unused prokaryotic, mouse
  protein-interaction, and acquired-acidosis background references were removed;
  the retained acquired-acidosis systematic review is used specifically for
  differential diagnosis.

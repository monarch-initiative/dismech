    Persistent urinary 5-oxoproline, also called L-pyroglutamic acid, is the
    defining biochemical marker. Quantification is performed by urinary organic
    acid analysis, commonly gas chromatography-mass spectrometry.
  biomarker_term:
    preferred_term: 5-oxo-L-proline
    term:
      id: CHEBI:18183
      label: 5-oxo-L-proline
  readouts:
  - target: 5-oxo-L-proline accumulation and urinary excretion
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >
      Increased urinary 5-oxoproline reports failure of substrate clearance by
      deficient 5-oxoprolinase.
  - target: Increased urinary L-pyroglutamic acid
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >
      The biochemical measurement corresponds to the urinary
      L-pyroglutamic-acid HPO phenotype.
  evidence:
  - reference: PMID:17397529
    reference_title: Inborn errors in the metabolism of glutathione.
    supports: SUPPORT
    evidence_source: OTHER

name: Dominant Deafness-Onychodystrophy Syndrome
category: Mendelian
creation_date: "2026-08-21T00:00:00Z"
synonyms:
- DDOD
- DDOD syndrome
- autosomal dominant deafness-onychodystrophy syndrome
- deafness, congenital, with onychodystrophy, autosomal dominant
- Robinson-Miller-Bensimon syndrome
description: >
  Dominant deafness-onychodystrophy (DDOD) syndrome is a rare autosomal dominant
  disorder that pairs congenital severe-to-profound sensorineural hearing loss
  with onychodystrophy (hypoplastic or absent finger- and toenails) and
  characteristic distal digital anomalies, most notably triphalangeal or
  finger-like thumbs, bulbous fingertips, and hypoplasia of the terminal or
  middle phalanges. Development and cognition are characteristically normal,
  which is the main clinical feature separating DDOD from the neighbouring
  ATP6V1B2 phenotypes. Almost every molecularly solved case carries the same
  recurrent heterozygous truncating variant in ATP6V1B2,
  NM_001693.4:c.1516C>T (p.Arg506*), usually arising de novo but also
  transmitted through multi-generation families. ATP6V1B2 encodes the B2 subunit
  of the V1 domain of the vacuolar H+-ATPase, so the mechanistic spine of the
  disorder runs through defective endolysosomal acidification, blocked
  autophagic flux, and apoptotic degeneration of cochlear spiral ganglion
  neurons and hair cells. DDOD sits at one end of a dominant ATP6V1B2 clinical
  continuum whose other poles are Zimmermann-Laband syndrome type 2 and the
  ATP6V1B2-related form of DOORS syndrome; the same p.Arg506* allele causes both
  DDOD and DOORS, with intellectual disability and seizures showing incomplete
  penetrance and variable expressivity.

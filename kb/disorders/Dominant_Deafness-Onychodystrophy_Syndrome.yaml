    explanation: Supports occasional seizures among p.Arg506* carriers with incomplete penetrance; PARTIAL because the statement spans the DDOD and DOORS labels rather than DDOD alone.
  - reference: PMID:21998865
    reference_title: Report of a further family with dominant deafness-onychodystrophy (DDOD) syndrome.
    supports: SUPPORT

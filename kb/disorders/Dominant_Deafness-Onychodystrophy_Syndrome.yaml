notes: >-
  Nosological scope. DDOD, Zimmermann-Laband syndrome type 2 (ZLS2) and the
  ATP6V1B2-related form of DOORS syndrome are increasingly described as a single
  dominant V-ATPase phenotypic continuum rather than three separate diseases,
  and the recurrent p.Arg506* allele is shared between DDOD and DOORS. dismech
  nevertheless keeps DDOD as its own Disease entry, consistent with the existing
  separate Zimmermann_Laband_Syndrome and DOORS_Syndrome entries and with
  MONDO:0007420 being a distinct leaf term with its own OMIM identity
  (MIM 124480). The continuum is modelled explicitly rather than left implicit.
  See the `differential_diagnoses` block, which curates the axes that separate
  the poles, and the `discussions` block, which records what is genuinely
  unresolved about the shared mechanism. Curators extending this entry should
  not silently import ZLS2 or DOORS findings as DDOD findings, because the
  functional data behind the two poles were generated on different alleles and
  point in opposite directions.

  Normal development and cognition are deliberately NOT curated as a
  `phenotypes` entry. The only available HPO binding would be HP:0001249
  Intellectual disability carrying REFUTE evidence, which renders as though the
  disease had intellectual disability. The claim is instead carried in the
  description above and in the DOORS and ZLS2 differential blocks, where it is
  the discriminating axis rather than a feature of the disease.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    DDOD is transmitted as an autosomal dominant trait. Most molecularly solved
    probands carry a de novo heterozygous ATP6V1B2 p.Arg506* variant with
    unaffected parents, but vertical transmission through three generations has
    been documented in two independent families, confirming dominant
    inheritance rather than exclusively sporadic de novo occurrence.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:24421866
    reference_title: A Danish family with dominant deafness-onychodystrophy syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present here three male family members in three generations with sensori-neural deafness, onychodystrophy and brachydactyly inherited via autosomal dominant transmission."
    explanation: Documents vertical autosomal dominant transmission across three generations.
  - reference: PMID:24913193
    reference_title: De novo mutation in ATP6V1B2 impairs lysosome acidification and causes dominant deafness-onychodystrophy syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An identical heterozygous de novo c.1516 C>T (p.Arg506X) mutation in ATP6V1B2 was verified in two probands"
    explanation: Establishes the heterozygous de novo origin in simplex probands.
genetic:
- name: ATP6V1B2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: ATP6V1B2
    term:
      id: hgnc:854
      label: ATP6V1B2
  notes: >-
    ATP6V1B2 encodes the B2 subunit of the cytosolic V1 domain of the vacuolar
    H+-ATPase. Essentially all molecularly confirmed DDOD probands reported to
    date carry the same recurrent nonsense variant NM_001693.4:c.1516C>T
    (p.Arg506*), which removes the last six highly conserved residues. The
    mutant transcript escapes nonsense-mediated decay, so the truncated subunit
    is expressed rather than absent, which is why the mechanism is described as
    loss of function without the route (dominant negative versus
    haploinsufficiency) being settled. The variant's structured allele and
    functional-impact annotation is carried by the `genetic_context` block on
    the ATP6V1B2 truncation pathophysiology node. The very same allele is also
    reported in ATP6V1B2-related DOORS syndrome; different missense alleles in
    the same gene cause Zimmermann-Laband syndrome type 2.
  variants:
  - name: ATP6V1B2 p.Arg506*
    description: "NM_001693.4:c.1516C>T; p.Arg506* recurrent de novo truncating variant removing the C-terminal six residues."
  evidence:
  - reference: PMID:24913193
    reference_title: De novo mutation in ATP6V1B2 impairs lysosome acidification and causes dominant deafness-onychodystrophy syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of ATP6V1B2 c.1516 C>T mutation in three independently identified DDOD patients provides evidence that defect in ATP6V1B2 is the genetic etiology for DDOD syndrome."
    explanation: Establishes ATP6V1B2 as the DDOD disease gene.
  - reference: PMID:24913193
    reference_title: De novo mutation in ATP6V1B2 impairs lysosome acidification and causes dominant deafness-onychodystrophy syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The p.Arg506X mutation in ATP6V1B2 inserts a premature stop codon and results in a truncated protein."
    explanation: Describes the molecular consequence of the recurrent allele.
  - reference: PMID:24913193
    reference_title: De novo mutation in ATP6V1B2 impairs lysosome acidification and causes dominant deafness-onychodystrophy syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression analysis performed by quantitative real-time PCR on total RNA isolated from leukocytes in pedigree 3 showed that the average expression level of ATP6V1B2 in case 3 was comparable to that in her parent controls, indicating that the mutant ATP6V1B2 mRNA is stable."
    explanation: The transcript escapes nonsense-mediated decay, so a truncated protein is expressed rather than simply lost.
  - reference: PMID:34746137
    reference_title: Syndromic Deafness Gene ATP6V1B2 Controls Degeneration of Spiral Ganglion Neurons Through Modulating Proton Flux.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATP6V1B2 c.1516 C > T, p.Arg506∗, was identified in all families with DDOD syndrome"
    explanation: Establishes the recurrent allele as essentially the sole reported DDOD genotype.
pathophysiology:
- name: ATP6V1B2 C-Terminal Truncation and Impaired V-ATPase Assembly
  biological_scale: MOLECULAR
  description: >
    The recurrent heterozygous c.1516C>T (p.Arg506*) variant inserts a premature
    stop codon that removes the last six, highly conserved residues of the
    ATP6V1B2 B2 subunit. Because the transcript is stable and escapes
    nonsense-mediated decay, the truncated subunit is produced and incorporated
    into the pump rather than being absent. The truncation weakens the
    interaction between the V1B2 and V1E subunits, so assembly of the V1 domain
    of the vacuolar H+-ATPase is impaired and ATP hydrolysis by the complex
    falls.
  genetic_context:
    allele_type: nonsense single-nucleotide variant
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    genes:
    - preferred_term: ATP6V1B2
      term:
        id: hgnc:854
        label: ATP6V1B2
    description: >-
      Heterozygous germline NM_001693.4:c.1516C>T (p.Arg506*), recurrent and
      usually de novo, removing the C-terminal six residues of the B2 subunit.
    notes: >-
      LOSS_OF_FUNCTION is chosen deliberately as the superordinate call the
      literature actually supports, not as a default. Yuan et al. measured
      reduced ATPase hydrolysis activity and reduced lysosomal acidification for
      the p.Arg506* allele and called it haploinsufficient; a later review of
      the same allele concluded only that it acts by loss of function, and
      explicitly left dominant-negative versus haploinsufficiency open, which is
      recorded as a KNOWLEDGE_GAP discussion on this entry. The finer
      FunctionalImpactEnum values DOMINANT_NEGATIVE and
      PARTIAL_LOSS_OF_FUNCTION are therefore deliberately NOT used here.
  molecular_functions:
  - preferred_term: V-ATPase proton transmembrane transporter activity
    term:
      id: GO:0015078
      label: proton transmembrane transporter activity
    modifier: DECREASED
  evidence:
  - reference: PMID:24913193
    reference_title: De novo mutation in ATP6V1B2 impairs lysosome acidification and causes dominant deafness-onychodystrophy syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that the ATPase hydrolysis activity significantly decreased in the transfected cells when the ratio of the mutant/WT increased."
    explanation: Directly measures reduced ATPase hydrolysis activity attributable to the DDOD allele.
  - reference: PMID:34746137
    reference_title: Syndromic Deafness Gene ATP6V1B2 Controls Degeneration of Spiral Ganglion Neurons Through Modulating Proton Flux.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The interaction between the V1B2 and V1E subunits was found to be weaker in Atp6v1b2Arg506*/Arg506*mice than in wild-type (WT) mice, indicating that the assembly of V-ATPase was affected by the mutation"
    explanation: Provides the assembly defect that links the truncation to reduced pump function.
  downstream:
  - target: Impaired Endolysosomal Acidification
    causal_link_type: DIRECT
    description: >-
      Reduced V1 domain assembly and ATP hydrolysis lower proton pumping into
      the lysosomal lumen.
    evidence:
    - reference: PMID:24913193
      reference_title: De novo mutation in ATP6V1B2 impairs lysosome acidification and causes dominant deafness-onychodystrophy syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro pathogenic evaluation showed that the ATP6V1B2 p.Arg506X is a haploinsufficient mutation and resulted in abnormal acidification in lysosomes."
      explanation: Links the variant's effect on the pump to the acidification defect.
- name: Impaired Endolysosomal Acidification
  biological_scale: CELLULAR
  description: >
    Reduced V-ATPase proton pumping raises lysosomal luminal pH. In cells
    expressing the DDOD allele, and in cochlear tissue from the corresponding
    mouse models, lysosomal acidification is reduced, cathepsin-D activity falls
    and lysosomal membrane and ion-channel proteins are upregulated, consistent
    with failure of the acidic compartment to support hydrolase activity. This
    node is the disease's rate-limiting molecular lesion.
  cell_types:
  - preferred_term: Spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  - preferred_term: Cochlear hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  biological_processes:
  - preferred_term: Lysosomal lumen acidification
    term:
      id: GO:0007042
      label: lysosomal lumen acidification
    modifier: DECREASED
  - preferred_term: Vacuolar acidification
    term:
      id: GO:0007035
      label: vacuolar acidification
    modifier: DECREASED
  evidence:
  - reference: PMID:24913193
    reference_title: De novo mutation in ATP6V1B2 impairs lysosome acidification and causes dominant deafness-onychodystrophy syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A statistically significant difference in lysosomal pH was detected between ATP6V1B2 WT- and c.1516 C>T mutant-transfected cells (LSD test, p = 0.02, Supplementary information, Figure S1E), indicating the reduced acidification caused by c.1516 C>T mutation."
    explanation: Measures the raised lysosomal pH produced by the DDOD allele.
  - reference: PMID:41995948
    reference_title: ATP6V1B2 Regulating Autophagy Flux To Affect Abnormal Auditory Development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanistically, cochlear V-ATPase and Cath-D activities were significantly reduced, while lysosomal membrane proteins (LAMP1, LAMP2) and ion channel proteins (TPC1, TPC2) were upregulated, suggesting lysosomal acidification dysfunction."
    explanation: Confirms the acidification defect in cochlear tissue of a DDOD model rather than only in transfected cells.
  downstream:
  - target: Autophagic Flux Blockade
    causal_link_type: DIRECT
    description: >-
      Lysosomes that cannot acidify cannot complete degradation of
      autophagosomal cargo, so autophagic flux stalls.
    evidence:
    - reference: PMID:41995948
      reference_title: ATP6V1B2 Regulating Autophagy Flux To Affect Abnormal Auditory Development.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In HEI-OC1 cells, ATP6V1B2 knockdown led to autophagosome accumulation, increased expression of pro-apoptotic proteins (Bax, Caspase-3), decreased anti-apoptotic Bcl-2, elevated early apoptosis rates, and altered ROS levels."
      explanation: Connects reduced ATP6V1B2 to autophagosome accumulation in a cochlear cell line.
- name: Autophagic Flux Blockade
  biological_scale: CELLULAR
  description: >
    Undegraded autophagosomes accumulate because fusion-competent, acidified
    lysosomes are not available to complete cargo breakdown. In cochlear tissue
    this manifests as accumulation of large autophagosomes together with the
    lysosomal morphological abnormalities seen in the mouse models.
  biological_processes:
  - preferred_term: Autophagosome maturation
    term:
      id: GO:0097352
      label: autophagosome maturation
    modifier: DECREASED
  - preferred_term: Autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  evidence:
  - reference: PMID:34746137
    reference_title: Syndromic Deafness Gene ATP6V1B2 Controls Degeneration of Spiral Ganglion Neurons Through Modulating Proton Flux.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Apoptosis activated by lysosomal dysfunction and the subsequent blockade of autophagic flux induced the degeneration of spiral ganglion neurons and further impaired the hearing."
    explanation: States the lysosomal dysfunction to autophagic blockade to neurodegeneration sequence in the p.Arg506* mouse.
  downstream:
  - target: Apoptotic Degeneration of Spiral Ganglion Neurons and Hair Cells
    causal_link_type: DIRECT
    description: >-
      Persistent autophagic blockade activates the intrinsic apoptotic program
      in cochlear neurons and sensory cells.
    evidence:
    - reference: PMID:41995948
      reference_title: ATP6V1B2 Regulating Autophagy Flux To Affect Abnormal Auditory Development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "ATP6V1B2 downregulation impairs cochlear lysosomal acidification by reducing V-ATPase activity, leading to autophagic flux blockade, apoptosis activation, and mitochondrial dysfunction, ultimately contributing to SGN degeneration and progressive hearing loss."
      explanation: States the full chain from acidification failure through autophagic blockade to apoptosis and SGN degeneration.
- name: Apoptotic Degeneration of Spiral Ganglion Neurons and Hair Cells
  biological_scale: TISSUE
  conforms_to: "sensorineural_hair_cell_loss#Cochlear Amplification Loss and Spiral Ganglion Neuron Degeneration"
  description: >
    Bax- and caspase-3-dependent apoptosis is activated in the cochlea,
    producing loss of spiral ganglion neurons and, in the hair-cell-specific
    knockout model, hair cell degeneration. Atp6v1b2 is expressed in exactly
    these compartments, which is what makes the cochlea the tissue that fails
    first. This node is the DDOD-specific instance of the conserved
    spiral-ganglion arm of the sensorineural hearing loss module. It attaches at
    the spiral ganglion node rather than the module's upstream
    `#Hair Cell Mechanotransduction Failure and Death` node because the
    p.Arg506* evidence describes apoptotic neurodegeneration downstream of
    lysosomal failure, not a primary mechanotransduction defect.
  cell_types:
  - preferred_term: Spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  - preferred_term: Cochlear hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  biological_processes:
  - preferred_term: Neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  - preferred_term: Apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:24913193
    reference_title: De novo mutation in ATP6V1B2 impairs lysosome acidification and causes dominant deafness-onychodystrophy syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Immunostaining of mouse cochlear sections and cultured cochlear tissues showed Atp6v1b2 expression mainly in the organ of Corti and spiral ganglion neurons"
    explanation: Establishes that the affected compartments express the gene, grounding cochlear tissue selectivity.
  - reference: PMID:41995948
    reference_title: ATP6V1B2 Regulating Autophagy Flux To Affect Abnormal Auditory Development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In DDOD model mice, ATP6V1B2 mRNA and protein levels were significantly reduced in the inner ear, with decreased localization in key auditory regions such as cochlear hair cells and spiral ganglion neurons (SGNs), which was accompanied by SGN loss."
    explanation: Directly reports spiral ganglion neuron loss in a DDOD model.
  - reference: PMID:40068100
    reference_title: Single Administration of AAV-mAtp6v1b2 Gene Therapy Rescues Hearing and Vestibular Disorders Caused by Atp6v1b2-Induced Lysosomal Dysfunction in Hair Cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The study generates a hair cell-specific knockout mouse (Atp6v1b2fl/fl;Atoh1Cre/+) recapitulating the human phenotypes, with pathological features including hair cell loss and abnormal lysosomal morphology and function."
    explanation: Adds the hair-cell arm of cochlear degeneration alongside spiral ganglion loss.
  downstream:
  - target: Congenital Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: >-
      Loss of cochlear sensory cells and their afferent neurons abolishes
      auditory transduction and transmission.
    evidence:
    - reference: PMID:34746137
      reference_title: Syndromic Deafness Gene ATP6V1B2 Controls Degeneration of Spiral Ganglion Neurons Through Modulating Proton Flux.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Apoptosis activated by lysosomal dysfunction and the subsequent blockade of autophagic flux induced the degeneration of spiral ganglion neurons and further impaired the hearing."
      explanation: Links the cochlear degeneration node to the hearing phenotype.
- name: Impaired Nail Matrix and Distal Digit Development
  biological_scale: TISSUE
  description: >
    The second obligate arm of DDOD is failure of nail-plate formation with
    associated hypoplasia of the terminal and middle phalanges, giving absent or
    hypoplastic nails, bulbous fingertips and triphalangeal or finger-like
    thumbs. Nail-matrix keratinocytes are a highly differentiating,
    keratinisation-dependent lineage in which endolysosomal proteolysis is
    required, which is the plausible route from the same V-ATPase lesion to the
    integumentary and distal skeletal phenotype. This node is deliberately
    curated without a mechanistic evidence item for the acidification-to-nail
    step. The observation that DDOD patients have onychodystrophy is
    well-evidenced, but no study has yet demonstrated the lysosomal mechanism in
    nail matrix or developing digit, which is recorded as a KNOWLEDGE_GAP.
  cell_types:
  - preferred_term: Nail matrix keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  evidence:
  - reference: PMID:24913193
    reference_title: De novo mutation in ATP6V1B2 impairs lysosome acidification and causes dominant deafness-onychodystrophy syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The probands displayed identical phenotypes including severe congenital sensorineural hearing loss, absence of nails and aplasia of the middle phalanx in the fifth fingers"
    explanation: Establishes the paired nail and terminal-phalanx involvement in DDOD probands.
  downstream:
  - target: Onychodystrophy
    causal_link_type: DIRECT
    description: >-
      Failure of nail-matrix differentiation produces the absent or hypoplastic
      nails that define the disorder's second arm.
    evidence:
    - reference: PMID:21998865
      reference_title: Report of a further family with dominant deafness-onychodystrophy (DDOD) syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In the hands, the first and fifth digits had absent nails and bulbous swelling of the distal phalanx."
      explanation: Describes the nail and distal phalanx findings that constitute the phenotype.
phenotypes:
- category: Auditory
  name: Congenital Sensorineural Hearing Loss
  description: >
    Bilateral severe-to-profound sensorineural hearing loss present from birth
    and detected on auditory brainstem response testing in infancy. It is the
    single most consistent feature of DDOD and is present in essentially all
    reported individuals with the p.Arg506* allele.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Congenital sensorineural hearing impairment
    term:
      id: HP:0008527
      label: Congenital sensorineural hearing impairment
    severity: SEVERE
  evidence:
  - reference: PMID:39210597
    reference_title: Dominantly acting variants in ATP6V1C1 and ATP6V1B2 cause a multisystem phenotypic spectrum by altering lysosomal and/or autophagosome function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sensorineural hearing loss and onychodystrophy appear to invariably occur in individuals carrying the recurrent truncating variant (p.Arg506∗) in ATP6V1B2, with or without neurodevelopmental involvement"
    explanation: States that hearing loss occurs invariably in p.Arg506* carriers, supporting the VERY_FREQUENT band.
  - reference: PMID:28396750
    reference_title: Dominant deafness-onychodystrophy syndrome caused by an ATP6V1B2 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Audiological examination by auditory brainstem responses (ABR) at 1 year of age indicated profound bilateral sensorineural hearing impairment."
    explanation: Documents congenital profound bilateral sensorineural hearing loss in a molecularly confirmed DDOD proband.
- category: Integumentary
  name: Onychodystrophy
  description: >
    Absent or hypoplastic finger- and toenails. Involvement is characteristically
    patterned rather than uniform. The thumb and fifth finger are most severely
    affected in the hands, with relative sparing of the second to fourth digits,
    while in the feet the great toenail is hypoplastic and the second to fifth
    toenails are typically absent.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Nail dystrophy
    term:
      id: HP:0008404
      label: Nail dystrophy
  evidence:
  - reference: PMID:39210597
    reference_title: Dominantly acting variants in ATP6V1C1 and ATP6V1B2 cause a multisystem phenotypic spectrum by altering lysosomal and/or autophagosome function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sensorineural hearing loss and onychodystrophy appear to invariably occur in individuals carrying the recurrent truncating variant (p.Arg506∗) in ATP6V1B2, with or without neurodevelopmental involvement"
    explanation: States that onychodystrophy occurs invariably in p.Arg506* carriers, supporting the VERY_FREQUENT band.
  - reference: PMID:21998865
    reference_title: Report of a further family with dominant deafness-onychodystrophy (DDOD) syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the feet,there were hypoplastic great toenails and absent nails on second to fifth toes."
    explanation: Documents the characteristic digit-selective pattern of nail involvement.
- category: Integumentary
  name: Absent Fingernails
  description: >
    Complete absence of nails on affected digits, most consistently the thumb
    and fifth finger, is the severe end of the onychodystrophy spectrum and was
    present in all three probands of the original gene-discovery cohort.
  phenotype_term:
    preferred_term: Absent fingernail
    term:
      id: HP:0001817
      label: Absent fingernail
  evidence:
  - reference: PMID:21998865
    reference_title: Report of a further family with dominant deafness-onychodystrophy (DDOD) syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on a three-generation family with three affected members with absent finger and toenails, finger-like thumbs, and severe sensorineural deafness."
    explanation: Documents absent fingernails in affected family members.
- category: Integumentary

    explanation: Documents epilepsy in one member of a family otherwise fitting classic DDOD.
differential_diagnoses:
- name: Zimmermann-Laband syndrome type 2
  description: >
    ZLS2 is caused by dominant ATP6V1B2 missense variants, most characteristically
    p.Arg485Pro, and is an allelic differential within the same dominant
    V-ATPase clinical continuum rather than an unrelated disorder. The practical
    discriminators are gingival hypertrophy and hypertrichosis, which are
    characteristic of ZLS2 and only very rarely reported in DDOD, and
    intellectual disability, which is usual in ZLS2 and atypical in DDOD.
    Conversely, the DDOD pole is marked by the constancy of congenital
    sensorineural deafness plus onychodystrophy with bulbous fingertips and
    triphalangeal thumbs.
  disease_term:
    preferred_term: Zimmermann-Laband syndrome 2
    term:
      id: MONDO:0014646
      label: Zimmermann-Laband syndrome 2
  distinguishing_features:
  - Gingival hypertrophy and hypertrichosis favor ZLS2; they are not usually reported in DDOD.
  - Intellectual disability is usual in ZLS2 and atypical in DDOD.
  - Predominant congenital sensorineural deafness with onychodystrophy, bulbous fingertips, and triphalangeal thumbs favors DDOD.
  - The allele class differs, in that DDOD is essentially always the truncating p.Arg506* whereas ZLS2 arises from missense substitutions such as p.Arg485Pro.
  - Genotype and phenotype should be read as a continuum rather than an absolute boundary.
  evidence:
  - reference: PMID:39210597
    reference_title: Dominantly acting variants in ATP6V1C1 and ATP6V1B2 cause a multisystem phenotypic spectrum by altering lysosomal and/or autophagosome function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Facial features of DOORS syndrome have a significant overlap with ZLS, a condition also associated with organomegaly, gingival hypertrophy, and hypertrichosis, which are not usually reported in DDOD and DOORS syndromes."
    explanation: Supports gingival hypertrophy and hypertrichosis as ZLS-favoring discriminators against DDOD.
  - reference: PMID:39210597
    reference_title: Dominantly acting variants in ATP6V1C1 and ATP6V1B2 cause a multisystem phenotypic spectrum by altering lysosomal and/or autophagosome function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present findings further support these observations, documenting the presence of a phenotypic continuum among these disorders."
    explanation: Supports reading DDOD and ZLS2 as poles of a continuum rather than as absolutely separate entities.
  - reference: PMID:28396750
    reference_title: Dominant deafness-onychodystrophy syndrome caused by an ATP6V1B2 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He does not have gingival hyperplasia, hypertrichosis, organomegaly, or joint hyperextensibility."
    explanation: A molecularly confirmed DDOD proband explicitly lacks the ZLS-defining features.
- name: DOORS syndrome
  description: >
    DOORS syndrome shares congenital sensorineural deafness, onychodystrophy and
    triphalangeal thumbs with DDOD, and the ATP6V1B2-related form of DOORS is
    caused by the very same recurrent p.Arg506* allele. The discriminators are
    therefore not molecular but clinical. Osteodystrophy beyond the digits,
    intellectual disability and seizures define the DOORS pole and are absent or
    exceptional in DDOD. The larger share of DOORS cases is caused by biallelic
    TBC1D24 variants, which is a genuinely different genotype and mode of
    inheritance.
  disease_term:
    preferred_term: DOORS syndrome
    term:
      id: MONDO:0009079
      label: DOORS syndrome
  distinguishing_features:
  - Osteodystrophy, intellectual disability, and seizures define DOORS and are absent or exceptional in DDOD.
  - The recurrent ATP6V1B2 p.Arg506* allele is shared, so molecular testing alone cannot separate ATP6V1B2-related DOORS from DDOD.
  - Biallelic TBC1D24 variants cause the majority of DOORS and are recessive, unlike the dominant ATP6V1B2 mechanism.
  evidence:
  - reference: PMID:37628590
    reference_title: The ATP6V1B2 DDOD/DOORS-Associated p.Arg506* Variant Causes Hyperactivity and Seizures in Mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The autosomal dominant ATP6V1B2 p.Arg506* variant can cause both congenital deafness with onychodystrophy, autosomal dominant (DDOD) and deafness, onychodystrophy, osteodystrophy, mental retardation, and seizures syndromes (DOORS)."
    explanation: Establishes that the same allele underlies both labels, so the differential rests on clinical features.
  - reference: PMID:39210597
    reference_title: Dominantly acting variants in ATP6V1C1 and ATP6V1B2 cause a multisystem phenotypic spectrum by altering lysosomal and/or autophagosome function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with DDOD syndrome usually show normal development and cognitive function, while those with DOORS syndrome and ZLS present with intellectual disability (ID), with or without seizures."
    explanation: States the cognitive and seizure axis that separates DDOD from DOORS.
treatments:
- name: Cochlear Implantation
  description: >
    Cochlear implantation is the principal intervention for the congenital
    severe-to-profound sensorineural hearing loss of DDOD, and reported outcomes
    are good. Successful oral-language rehabilitation was achieved in the
    original probands implanted between 2 and 18 years of age, and a child
    receiving bilateral sequential implants showed continued gains in auditory
    and communication performance. Because DDOD carries no intellectual
    disability, molecular diagnosis is itself prognostically useful when
    counselling families about expected implant outcomes in syndromic congenital
    hearing loss.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear implantation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  notes: >-
    The treatment term is deliberately the generic Rehabilitation action.
    NCIT:C157820 `Cochlear Implant` exists but denotes the device, not a
    clinical action, and is not reachable from NCIT:C25218, so it fails the
    TreatmentActionTerm dynamic enum. The specificity is carried by
    `preferred_term`, following the pattern already used in
    Jervell_and_Lange-Nielsen_Syndrome_1 and CAPOS_Syndrome.
  target_mechanisms:
  - target: Congenital Sensorineural Hearing Loss
    treatment_effect: RESTORES
    description: >-
      The implant bypasses the degenerated cochlear sensory apparatus and
      stimulates surviving auditory neurons directly, restoring auditory input
      without correcting the underlying lysosomal defect.
    evidence:
    - reference: PMID:40164508
      reference_title: "Clinical Insights into Bilateral Cochlear Implantation for a Child with Dominant Deafness-Onychodystrophy Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Children with DDOD syndrome (ATP6V1B2 c.1516C > T) receiving bilateral CIs can enhance aural and communication skills."
      explanation: Reports auditory and communication benefit from bilateral implantation in genetically confirmed DDOD.
  evidence:
  - reference: PMID:24913193
    reference_title: De novo mutation in ATP6V1B2 impairs lysosome acidification and causes dominant deafness-onychodystrophy syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three individuals had unilateral cochlea implantation at the ages of 2.5, 2 and 18 years, respectively."
    explanation: Documents cochlear implantation as the intervention received by the original DDOD cohort.
  - reference: PMID:42361897
    reference_title: "Hearing outcomes after cochlear implantation in two patients with ATP6V1B2-related deafness and onychodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two clinical cases of the deafness and onychodystrophy (DOD) spectrum and the benefit of molecular diagnosis to underline the importance of genetic testing when evaluating potential CI outcomes in syndromic congenital SNHL."
    explanation: Supports molecular diagnosis as prognostically informative for cochlear implant outcome in this spectrum.
- name: Genetic Counseling
  description: >
    Counselling addresses the autosomal dominant recurrence risk. Most probands
    carry a de novo p.Arg506* variant with a correspondingly low sibling
    recurrence risk, but documented three-generation transmission means an
    affected individual carries a 50 percent transmission risk, and the variable
    penetrance of intellectual disability and seizures within the same allele
    must be conveyed as genuine uncertainty rather than as a predictable
    outcome.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37628590
    reference_title: The ATP6V1B2 DDOD/DOORS-Associated p.Arg506* Variant Causes Hyperactivity and Seizures in Mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some but not all individuals with this truncating variant have intellectual disability and/or epilepsy, suggesting incomplete penetrance and/or variable expressivity."
    explanation: Establishes the penetrance uncertainty that must be communicated during counselling.
  - reference: PMID:24421866
    reference_title: A Danish family with dominant deafness-onychodystrophy syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present here three male family members in three generations with sensori-neural deafness, onychodystrophy and brachydactyly inherited via autosomal dominant transmission."
    explanation: Documents dominant transmission, which sets the recurrence risk for an affected individual's offspring.
animal_models:
- name: Atp6v1b2 p.Arg506* knock-in mouse
  species: Mouse
  genotype: Atp6v1b2 c.1516C>T (p.Arg506*) knock-in, heterozygous and homozygous
  publication: PMID:34746137
  description: >
    CRISPR-generated knock-in of the human DDOD allele. Two independent lines
    exist, one characterised for cochlear pathology and one phenotyped through
    the IMPC pipeline with EEG. Together they establish the lysosomal to
    autophagic to apoptotic chain in spiral ganglion neurons, and they also
    demonstrate the model's key limitation, namely that the hearing loss is
    late-onset rather than congenital.
  modeled_mechanisms:
  - target: Apoptotic Degeneration of Spiral Ganglion Neurons and Hair Cells
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The knock-in reproduces apoptotic spiral ganglion neuron degeneration
      downstream of lysosomal dysfunction and autophagic blockade, which is the
      human mechanism, but on a delayed timescale.
    limitations: >-
      Hearing loss in the mouse is late-onset and preceded by hidden hearing
      loss, whereas human DDOD deafness is congenital and severe to profound.
      Compensatory upregulation of the paralogue Atp6v1b1 in hair cells blunts
      the murine phenotype, and much of the characterisation used homozygotes
      rather than the heterozygous state that models patients.
    readouts:
    - name: Spiral ganglion neuron degeneration
      target: Apoptotic Degeneration of Spiral Ganglion Neurons and Hair Cells
      direction: INCREASED
      interpretation: Histological correlate of the cochlear degeneration node.
      evidence:
      - reference: PMID:34746137
        reference_title: Syndromic Deafness Gene ATP6V1B2 Controls Degeneration of Spiral Ganglion Neurons Through Modulating Proton Flux.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Apoptosis activated by lysosomal dysfunction and the subsequent blockade of autophagic flux induced the degeneration of spiral ganglion neurons and further impaired the hearing."
        explanation: Reports the apoptotic spiral ganglion degeneration measured in this model.
    evidence:
    - reference: PMID:34746137
      reference_title: Syndromic Deafness Gene ATP6V1B2 Controls Degeneration of Spiral Ganglion Neurons Through Modulating Proton Flux.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The Atp6v1b2Arg506*/Arg506* mice showed hidden hearing loss (HHL) at early stages and developed late-onset hearing loss."
      explanation: Establishes the model as informative for the cochlear node while naming its temporal mismatch.
  - target: Congenital Sensorineural Hearing Loss
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Neither knock-in line reproduces the congenital severe-to-profound
      deafness that defines human DDOD.
    limitations: >-
      In the IMPC-phenotyped line, auditory brainstem responses were normal at
      14 weeks of age. In the cochlear-pathology line, hearing loss appeared
      only late and was attributed to compensatory Atp6v1b1 upregulation in hair
      cells. Any therapeutic inference drawn from restored hearing in these mice
      therefore starts from a milder baseline than the human disease.
    evidence:
    - reference: PMID:37628590
      reference_title: The ATP6V1B2 DDOD/DOORS-Associated p.Arg506* Variant Causes Hyperactivity and Seizures in Mice.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "The auditory brainstem response (ABR) confirmed proper auditory function at 14 weeks of age"
      explanation: A negative result, in that the knock-in mouse has normal hearing at an age by which human DDOD is profoundly deaf.
    - reference: PMID:34746137
      reference_title: Syndromic Deafness Gene ATP6V1B2 Controls Degeneration of Spiral Ganglion Neurons Through Modulating Proton Flux.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "We observed increased transcription of Atp6v1b1 in hair cells of Atp6v1b2Arg506*/Arg506* mice and inferred that Atp6v1b1 compensated for the Atp6v1b2 dysfunction by increasing its own transcription level. Genetic compensation in hair cells explains the milder hearing impairment in Atp6v1b2Arg506*/Arg506* mice."
      explanation: Gives the species-specific mechanism, paralogue compensation, behind the failure to recapitulate.
  evidence:
  - reference: PMID:37628590
    reference_title: The ATP6V1B2 DDOD/DOORS-Associated p.Arg506* Variant Causes Hyperactivity and Seizures in Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "EEG analyses indicate that Atp6v1b2emR506* mutant mice have interictal epileptic activity and that both heterozygous (like patients) and homozygous mice have reduced seizure thresholds to pentylenetetrazol."
    explanation: Establishes the knock-in as a model of the seizure-susceptibility arm of the p.Arg506* spectrum.
- name: Cochlea-specific Atp6v1b2 morpholino knockdown mouse
  species: Mouse
  genotype: Wild-type mouse with intracochlear Atp6v1b2 splice-blocking morpholino
  publication: PMID:24913193
  description: >
    Acute knockdown of Atp6v1b2 in the cochlea by microinjection of a
    splice-blocking morpholino into the scala media before postnatal day 3. This
    was the original demonstration that Atp6v1b2 deficiency alone is sufficient
    to cause sensorineural hearing loss, and the same approach was later used to
    profile the lysosomal and autophagic changes in cochlear tissue.
  modeled_mechanisms:
  - target: Impaired Endolysosomal Acidification
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cochlear knockdown reproduces the reduction in V-ATPase activity and
      lysosomal acidification that underlies the human disease, measured in
      cochlear tissue rather than in a heterologous cell line.
    limitations: >-
      Morpholino knockdown reduces wild-type transcript rather than expressing
      the truncated p.Arg506* subunit, so it models a pure dose reduction and
      cannot distinguish haploinsufficiency from a dominant-negative effect of
      the truncated protein. The effect is also acute and postnatal rather than
      developmental.
    readouts:
    - name: Cochlear V-ATPase and cathepsin-D activity
      target: Impaired Endolysosomal Acidification
      direction: DECREASED
      interpretation: Biochemical correlate of the acidification node in cochlear tissue.
      evidence:
      - reference: PMID:41995948
        reference_title: ATP6V1B2 Regulating Autophagy Flux To Affect Abnormal Auditory Development.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mechanistically, cochlear V-ATPase and Cath-D activities were significantly reduced, while lysosomal membrane proteins (LAMP1, LAMP2) and ion channel proteins (TPC1, TPC2) were upregulated, suggesting lysosomal acidification dysfunction."
        explanation: Reports the enzyme-activity measurements behind this readout.
    evidence:
    - reference: PMID:41995948
      reference_title: ATP6V1B2 Regulating Autophagy Flux To Affect Abnormal Auditory Development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A DDOD syndrome mouse model was established via cochlear microinjection of ATP6V1B2-specific morpholino, while control mice injected with a scramble morpholino."
      explanation: Establishes the model and its use for the cochlear acidification question.
  evidence:
  - reference: PMID:24913193
    reference_title: De novo mutation in ATP6V1B2 impairs lysosome acidification and causes dominant deafness-onychodystrophy syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We generated a cochlea-specific Atp6v1b2-knockdown mouse model and found that Atp6v1b2 deficiency leads to severe sensorineural hearing loss."
    explanation: Establishes that cochlear Atp6v1b2 deficiency is sufficient for sensorineural hearing loss.
- name: Hair-cell-specific Atp6v1b2 conditional knockout mouse
  species: Mouse
  genotype: "Atp6v1b2 fl/fl; Atoh1-Cre/+ conditional knockout"
  publication: PMID:40068100
  description: >
    Conditional deletion of Atp6v1b2 in cochlear hair cells, generated to
    provide a tractable platform for inner-ear gene therapy. It reproduces hair
    cell loss and abnormal lysosomal morphology, and a single intracochlear dose
    of an AAV vector carrying wild-type Atp6v1b2 rescued both.
  modeled_mechanisms:
  - target: Apoptotic Degeneration of Spiral Ganglion Neurons and Hair Cells
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      A single postnatal administration of AAV-ie-Eh3-mAtp6v1b2 into the scala
      media prevented hair cell degeneration and restored lysosome morphology
      and auditory and vestibular function, providing the strongest available
      causal test that the cochlear degeneration node is Atp6v1b2-dependent and
      in principle reversible.
    limitations: >-
      The model is a hair-cell-restricted complete knockout, not the
      heterozygous truncating genotype of human DDOD, and it does not address
      the spiral ganglion neuron compartment. Rescue was delivered at postnatal
      days 0 to 2, a developmental window with no direct human equivalent given
      that DDOD deafness is already present at birth. This is a preclinical
      result, not an available therapy.
    readouts:
    - name: Auditory and vestibular function after AAV gene transfer
      target: Apoptotic Degeneration of Spiral Ganglion Neurons and Hair Cells
      direction: RESTORED
      interpretation: Functional rescue confirming the node is Atp6v1b2-dependent.
      evidence:
      - reference: PMID:40068100
        reference_title: Single Administration of AAV-mAtp6v1b2 Gene Therapy Rescues Hearing and Vestibular Disorders Caused by Atp6v1b2-Induced Lysosomal Dysfunction in Hair Cells.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "A single administration of AAV-ie-Eh3-mAtp6v1b2 into the scala media at postnatal days 0-2, prevented hair cell degeneration, restored lysosome morphology, and robustly rescued auditory and vestibular function for at least 24 weeks."
        explanation: Reports the functional and histological rescue measured in this model.
    evidence:
    - reference: PMID:40068100
      reference_title: Single Administration of AAV-mAtp6v1b2 Gene Therapy Rescues Hearing and Vestibular Disorders Caused by Atp6v1b2-Induced Lysosomal Dysfunction in Hair Cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The study generates a hair cell-specific knockout mouse (Atp6v1b2fl/fl;Atoh1Cre/+) recapitulating the human phenotypes, with pathological features including hair cell loss and abnormal lysosomal morphology and function."
      explanation: Establishes the model as informative for the cochlear degeneration node.
experimental_models:
- name: DDOD patient-derived iPSC line CPGHi002-A
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >
    Induced pluripotent stem cell line reprogrammed from a 10-month-old female
    DDOD patient heterozygous for the recurrent ATP6V1B2 c.1516C>T variant, with
    an isogenic gene-corrected counterpart, CPGHi002-A-1, generated from it.
    Together they provide a patient-genotype, isogenic-control platform for
    studying the DDOD allele in human cells, which is the gap the mouse models
    leave open.
  evidence:
  - reference: PMID:32961450
    reference_title: "Establishment of human induced pluripotent stem cell line (CPGHi002-A) from a 10-month-old female patient with DDOD syndrome carrying a heterozygous c.1516C>T mutation in ATP6V1B2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The induced pluripotent stem cell (iPSC) line was generated using the non-integrating episomal vector method from peripheral blood mononuclear cells (PBMCs) of a 10-month-old female DDOD patient with heterozygous ATP6V1B2 c.1516 C > T variant."
    explanation: Establishes the provenance and genotype of the patient-derived iPSC line.
  - reference: PMID:33714068
    reference_title: "Generation of a gene corrected human isogenic iPSC line (CPGHi002-A-1) from a DDOD patient with heterozygous c.1516 C>T mutation in the ATP6V1B2 gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we genetically corrected the c.1516 C>T mutation in the ATP6V1B2 gene using CRISPR/Cas9 technology to generate an isogenic control, CPGHi002-A-1."
    explanation: Establishes the availability of an isogenic gene-corrected control line, which is what makes the pair usable for the proposed experiments.
discussions:
- discussion_id: ddod_haploinsufficiency_vs_dominant_negative
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#ATP6V1B2 C-Terminal Truncation and Impaired V-ATPase Assembly"
  prompt: >-
    Does the DDOD p.Arg506* allele act by haploinsufficiency or by a
    dominant-negative effect of the expressed truncated B2 subunit?
  rationale: >-
    The distinction is not cosmetic. The mutant transcript escapes
    nonsense-mediated decay, so a truncated subunit is expressed and can be
    incorporated into V-ATPase complexes; the observed weakening of the V1B2 to
    V1E interaction is consistent with a poisoned complex rather than with
    simple dosage reduction. Yuan et al. concluded haploinsufficiency from a
    transfection dose-response, but a later review of the same allele stated
    only that it causes loss of function and left the route open. The answer
    determines whether allele-specific knockdown would be therapeutic, or
    whether gene augmentation of the kind demonstrated in the hair-cell knockout
    mouse is the right strategy for patients. It is also why this entry records
    `functional_impact_category: LOSS_OF_FUNCTION` rather than the more specific
    DOMINANT_NEGATIVE.
  proposed_experiments:
  - experiment_id: ddod_exp_allele_dosage_vs_poisoning
    name: Allele-specific dosage versus poisoning test in patient iPSC-derived cells
    description: >-
      Compare endolysosomal pH, V-ATPase assembly and autophagic flux across the
      patient iPSC line, its isogenic corrected control, and a heterozygous null
      created in the corrected background. If the patient line is worse than the
      heterozygous null, the truncated subunit is dominant negative; if the two
      are equivalent, the mechanism is haploinsufficiency.
  evidence:
  - reference: PMID:37628590
    reference_title: The ATP6V1B2 DDOD/DOORS-Associated p.Arg506* Variant Causes Hyperactivity and Seizures in Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Altogether, these results indicates that the p.R506* variant causes a loss of function either as a result of a dominant negative effect or haploinsufficiency."
    explanation: States the unresolved alternative directly.
  - reference: PMID:24913193
    reference_title: De novo mutation in ATP6V1B2 impairs lysosome acidification and causes dominant deafness-onychodystrophy syndrome.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Taken together, these results suggest that ATP6V1B2 c.1516 C>T mutation is a haploinsufficient mutation."
    explanation: The competing haploinsufficiency reading, offered as a suggestion from transfection data rather than as a settled result.
- discussion_id: ddod_bidirectional_lysosomal_ph
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Impaired Endolysosomal Acidification"
  prompt: >-
    Why do the DDOD truncating allele and the ZLS2 missense alleles move
    lysosomal pH in opposite directions while producing an overlapping clinical
    continuum?
  rationale: >-
    This is the central unresolved problem of the dominant ATP6V1B2 spectrum,
    and it is easy to curate away by mistake. For the DDOD p.Arg506* allele,
    lysosomal acidification is reduced, with transfected cells showing raised
    lysosomal pH and cochlear tissue showing reduced V-ATPase and cathepsin-D
    activity. For the ZLS2-associated missense alleles, patient fibroblasts show
    the reverse, a hyperactive pump and significantly more acidic lysosomes, and
    the authors proposed increased acidification as the driver of the whole
    spectrum. Critically, p.Arg506* was not among the alleles tested in that
    hyperactivity series, so the two results do not directly contradict each
    other; they were simply never measured side by side. Until they are, a
    unifying claim that the spectrum is driven by V-ATPase upregulation should
    not be imported into this entry, and conformance to
    `lysosomal_substrate_accumulation` is deliberately not declared here because
    the cholesterol and ceramide storage data come from the missense lines, not
    from DDOD cells.
  proposed_experiments:
  - experiment_id: ddod_exp_allelic_series_ph_panel
    name: Side-by-side lysosomal pH panel across the ATP6V1B2 allelic series
    description: >-
      Measure intraorganellar pH, substrate storage and autophagic flux in one
      laboratory, using one protocol, across patient-derived fibroblasts or
      isogenic iPSC lines carrying p.Arg506*, p.Arg485Pro and the ADP/ATP-site
      missense cluster, with shared controls. This is the experiment that would
      establish whether the continuum is one mechanism with a bidirectional
      readout or two distinct mechanisms converging on overlapping phenotypes.
  evidence:
  - reference: PMID:24913193
    reference_title: De novo mutation in ATP6V1B2 impairs lysosome acidification and causes dominant deafness-onychodystrophy syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A statistically significant difference in lysosomal pH was detected between ATP6V1B2 WT- and c.1516 C>T mutant-transfected cells (LSD test, p = 0.02, Supplementary information, Figure S1E), indicating the reduced acidification caused by c.1516 C>T mutation."
    explanation: The DDOD-allele result showing reduced acidification.
  - reference: PMID:39210597
    reference_title: Dominantly acting variants in ATP6V1C1 and ATP6V1B2 cause a multisystem phenotypic spectrum by altering lysosomal and/or autophagosome function.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "We observed a significant higher acidity of lysosomes in all patients’ cell lines compared with control cells, indicating a hyperactive behavior of the proton pumps assembling the mutant B2/C1 subunits."
    explanation: The opposing result from the missense alleles of the same gene; REFUTE because it contradicts the reduced-acidification direction, though it was measured on different alleles.
- discussion_id: ddod_nail_matrix_mechanism_unmeasured
  kind: KNOWLEDGE_GAP
  attaches_to:
  - "pathophysiology#Impaired Nail Matrix and Distal Digit Development"
  prompt: >-
    By what route does impaired V-ATPase function in nail-matrix keratinocytes
    and developing digits produce onychodystrophy and terminal phalangeal
    hypoplasia?
  rationale: >-
    Onychodystrophy is one of the two obligate features of DDOD, yet every
    mechanistic study of the gene to date has been done in the cochlea or in
    fibroblasts. There is no published measurement of lysosomal pH, autophagic
    flux or apoptosis in nail matrix or in the developing autopod for any
    ATP6V1B2 allele, so the nail arm of this entry rests on clinical observation
    alone. The digit-selective pattern, with the thumb and fifth finger most
    affected and the second to fourth digits relatively spared, is itself
    unexplained and suggests an interaction with limb patterning rather than a
    uniform keratinocyte defect.
  proposed_experiments:
  - experiment_id: ddod_exp_nail_autopod_endolysosomal_profiling
    name: Endolysosomal profiling of DDOD nail-matrix and autopod tissue
    description: >-
      Differentiate the patient iPSC line and its isogenic control towards
      keratinocyte and limb-bud mesenchymal fates, and assay lysosomal pH,
      cathepsin activity and autophagic flux. Complement with conditional
      Atp6v1b2 deletion in nail-matrix and autopod lineages in mouse to test
      whether the digit-selective pattern is reproduced.
  evidence:
  - reference: PMID:39210597
    reference_title: Dominantly acting variants in ATP6V1C1 and ATP6V1B2 cause a multisystem phenotypic spectrum by altering lysosomal and/or autophagosome function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Specifically, individuals with DDOD syndrome primarily share sensorineural deafness and onychodystrophy with digital anomalies characterized by bulbous fingertips of digits, and finger-like thumbs/triphalangeal thumb."
    explanation: Establishes the nail and digit phenotype whose mechanism is unmeasured.
- discussion_id: ddod_mouse_hearing_onset_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - "pathophysiology#Apoptotic Degeneration of Spiral Ganglion Neurons and Hair Cells"
  prompt: >-
    Do the Atp6v1b2 p.Arg506* knock-in mice model human DDOD deafness, given
    that their hearing loss is late-onset while the human phenotype is
    congenital and profound?
  rationale: >-
    Both published knock-in lines have essentially normal early hearing.
    Auditory brainstem responses were normal at 14 weeks in the IMPC-phenotyped
    line, and the cochlear-pathology line showed only hidden hearing loss early
    with late-onset threshold shifts. The proposed explanation is compensatory
    upregulation of the paralogue Atp6v1b1 in hair cells, a species-level rescue
    with no evidence of a human counterpart. The mismatch matters for
    interpretation in both directions. Mechanistic findings about spiral
    ganglion apoptosis are drawn from a system where the insult is milder than
    in patients, and any therapeutic rescue demonstrated in these mice starts
    from a less severe baseline and within a postnatal window that has no human
    equivalent, because human DDOD deafness is already established at birth.
  proposed_experiments:
  - experiment_id: ddod_exp_human_atp6v1b1_compensation
    name: Test whether ATP6V1B1 compensation occurs in human cochlear cells
    description: >-
      Quantify ATP6V1B1 transcript and protein in human iPSC-derived otic and
      hair-cell-like cells carrying p.Arg506* against the isogenic corrected
      control. Absence of compensation would confirm the paralogue rescue as the
      species difference and would explain the severity gap directly.
  - experiment_id: ddod_exp_adult_onset_rescue_window
    name: Adult-onset rescue window test
    description: >-
      Deliver AAV-mediated Atp6v1b2 augmentation to knock-in mice after hearing
      loss is established, rather than at postnatal days 0 to 2, to determine
      whether rescue is possible outside a developmental window that human
      patients have already passed at diagnosis.
  evidence:
  - reference: PMID:37628590
    reference_title: The ATP6V1B2 DDOD/DOORS-Associated p.Arg506* Variant Causes Hyperactivity and Seizures in Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The auditory brainstem response (ABR) confirmed proper auditory function at 14 weeks of age"
    explanation: Documents preserved hearing in the knock-in mouse, the core of the mismatch.
  - reference: PMID:34746137
    reference_title: Syndromic Deafness Gene ATP6V1B2 Controls Degeneration of Spiral Ganglion Neurons Through Modulating Proton Flux.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We observed increased transcription of Atp6v1b1 in hair cells of Atp6v1b2Arg506*/Arg506* mice and inferred that Atp6v1b1 compensated for the Atp6v1b2 dysfunction by increasing its own transcription level. Genetic compensation in hair cells explains the milder hearing impairment in Atp6v1b2Arg506*/Arg506* mice."
    explanation: Gives the proposed species-specific compensation mechanism behind the mismatch.

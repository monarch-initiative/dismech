    explanation: This reference confirms that Rieger syndrome, also known as Axenfeld-Rieger Syndrome Type 1 (RIEG1), involves ocular and extra-ocular abnormalities.
- name: Axenfeld-Rieger Syndrome Type 2 (RIEG2)
  subtype_term:

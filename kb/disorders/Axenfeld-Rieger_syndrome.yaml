      mapping_source: OMIM:601499
      mapping_justification: MONDO:0011097 (RIEG2) cross-references OMIM:601499, the second Rieger syndrome locus mapped to 13q14; the specific causative gene has not been definitively identified.
  description: >-
    A second, genetically distinct ARS locus mapped to chromosome 13q14 (OMIM
    601499). Unlike RIEG1 (PITX2) and RIEG3 (FOXC1), the specific causative gene
    at this locus has not been definitively identified. Inherited as an autosomal
    dominant trait with variable expressivity; presents with the typical Rieger
    constellation of ocular anterior segment, dental, and umbilical anomalies.
  evidence:
  - reference: PMID:8751862
    reference_title: "A second locus for Rieger syndrome maps to chromosome 13q14."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One locus associated with this disorder has been mapped to 4q25. Using a large four-generation pedigree, we have identified a second locus for Rieger syndrome located on chromosome 13q14."
    explanation: Establishes RIEG2 as a distinct ARS/Rieger syndrome locus on 13q14, separate from the 4q25 (PITX2) locus.
- name: Axenfeld-Rieger Syndrome Type 3 (RIEG3)
  subtype_term:
    preferred_term: Axenfeld-Rieger syndrome type 3
    term:
      id: MONDO:0011233
      label: Axenfeld-Rieger syndrome type 3
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0011233

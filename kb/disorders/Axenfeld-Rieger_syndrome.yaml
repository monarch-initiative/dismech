name: Axenfeld-Rieger_syndrome
creation_date: '2025-12-04T16:57:31Z'
description: >-
  Axenfeld-Rieger syndrome is an autosomal dominant disorder of anterior segment
  dysgenesis caused most often by pathogenic variants in the developmental
  transcription factor genes PITX2 or FOXC1. These genes regulate development of
  the neural-crest-derived anterior eye, so their disruption produces
  maldevelopment of the iris, cornea, and iridocorneal drainage angle, with
  features such as posterior embryotoxon, iris hypoplasia, corectopia, and
  polycoria. Impaired aqueous outflow through the dysgenetic angle confers a high
  lifetime risk of glaucoma, and because the same transcription factors act
  outside the eye, affected individuals also show dental, craniofacial, and
  umbilical anomalies.
category: Genetic
parents:
- Congenital Eye Disorder
- Craniofacial Disorder
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Mendelian (autosomal dominant) developmental disorder of the ocular
      anterior segment and neural-crest derivatives, caused by haploinsufficiency
      or dysregulation of the transcription factors PITX2 or FOXC1.

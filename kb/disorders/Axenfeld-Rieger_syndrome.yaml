- name: Digenic inheritance
  inheritance_term:
    preferred_term: Digenic inheritance
    term:
      id: HP:0010984
      label: Digenic inheritance
  description: >-
    A rare digenic mode of inheritance has been documented, in which pathogenic
    variants in both PITX2 and FOXC1 co-segregate. Double heterozygotes present
    with a markedly more severe, atypical phenotype than the mild disease caused
    by either single heterozygous variant, consistent with the compensatory
    cross-regulation of the two transcription factors. Contributing genes: PITX2
    and FOXC1.
  evidence:
  - reference: PMID:21837767
    reference_title: "Digenic inheritance of mutations in FOXC1 and PITX2 : correlating transcription factor function and Axenfeld-Rieger disease severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a family who segregate novel mutations in both PITX2 (p.Ser233Leu) and FOXC1 (c.609delC). The most severely affected individual, who presented with an atypical phenotype of corneal opacification, lens extrusion, persistent hyperplastic primary vitreous (PHPV), and subsequent bilateral retinal detachment, inherited mutations in both genes, whereas the single heterozygous mutations caused mild AR phenotypes. This is the first report of such digenic inheritance."
    explanation: Reports the first documented digenic PITX2/FOXC1 co-inheritance in ARS, with double heterozygotes showing markedly increased disease severity relative to single heterozygotes.

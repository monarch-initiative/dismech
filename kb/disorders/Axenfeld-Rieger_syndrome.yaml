      mapping_predicate: skos:exactMatch
      mapping_source: OMIM:602482
      mapping_justification: MONDO:0011233 (RIEG3) cross-references OMIM:602482, the FOXC1-related ARS type 3 locus at 6p25.
  description: >-
    Caused by mutations in the FOXC1 gene (6p25). Shares the core anterior
    segment ocular phenotype with RIEG1 but is not phenotypically identical: it
    shows earlier-onset, more severe glaucoma and a distinct, expanded systemic
    spectrum (hearing loss, congenital heart defects, skeletal/joint anomalies,
    and CNS involvement) — an expanded "FOXC1opathy" overlapping De Hauwere
    syndrome.
  genes:
  - preferred_term: FOXC1
    term:

      snippet: >-
        The wide range of responses to TTX could be accounted for by a single
        model but with different parameters
      explanation: >-
        Supports the parameter-heterogeneity result independently of the
        oscillation result.
    - reference: PMID:24391482
      reference_title: Mathematical modeling of heterogeneous electrophysiological responses in human beta-cells.
      supports: SUPPORT

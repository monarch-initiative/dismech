- name: Neuroglycopenic Brain Injury
  biological_scale: TISSUE
  role: consequence
  description: >
    Recurrent or prolonged dual-fuel deprivation causes permanent injury to the
    developing brain, with a predilection for the parieto-occipital cortex and
    white matter. This is the outcome that defines the clinical stakes of the
    disorder and it is substantially preventable: the international consensus
    guideline states its own purpose as reducing the prevalence of
    hypoglycemia-caused brain injury through earlier recognition and treatment.
    Neurological sequelae were reported in about half of probands in a nationwide
    cohort, which is a direct measure of how often recognition currently comes
    too late.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:37454648
    reference_title: "International Guidelines for the Diagnosis and Management of Hyperinsulinism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in order to assist specialists, general pediatricians, and neonatologists in early recognition and treatment of HI with the ultimate aim of reducing the prevalence of brain injury caused by hypoglycemia."
    explanation: >-
      Frames hypoglycemic brain injury in hyperinsulinism as a preventable
      outcome addressable by earlier recognition — the central clinical claim of
      this entry.
  - reference: PMID:38963811
    reference_title: "Clinical and Genetic Characteristics of Congenital Hyperinsulinism in Norway: A Nationwide Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurologic sequelae were reported in 53% of the CHI probands."
    explanation: Quantifies the burden of permanent neurological injury in a population-based cohort.
  - reference: PMID:38792494
    reference_title: "Proposed Screening for Congenital Hyperinsulinism in Newborns: Perspective from a Neonatal-Perinatal Medicine Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "adverse neurodevelopmental sequelae and brain injury due to missing or delaying the CHI diagnosis"
    explanation: Attributes the neurodevelopmental injury specifically to missed or delayed diagnosis.
  downstream:

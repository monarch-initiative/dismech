inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic recessive ABCC8 or KCNJ11 variants cause severe, usually
    diazoxide-unresponsive diffuse hyperinsulinism; recessive HADH deficiency is
    also inherited this way.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
- name: Autosomal dominant
  description: >-
    Monoallelic dominant ABCC8/KCNJ11 variants cause milder, often
    diazoxide-responsive disease; dominant activating GLUD1 and GCK variants and
    heterozygous HNF4A/HNF1A and SLC16A1 promoter variants are also dominant.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
- name: Somatic mosaicism with parent-of-origin effect
  description: >-
    Focal hyperinsulinism is a two-hit, parent-of-origin disorder: a paternally
    inherited recessive ABCC8/KCNJ11 variant is unmasked within a pancreatic
    clone by post-zygotic loss of heterozygosity for the maternal 11p15 allele
    with reduplication of the paternal allele (segmental paternal isodisomy).
    The germline variant alone is insufficient; the lesion is defined by the
    somatic second hit. Atypical/mosaic (LINE) disease similarly arises from somatic
    ABCC8 or GCK variants.
  parent_of_origin_effect: >-
    Paternal origin of the germline K-ATP variant is required: the causal somatic
    second hit is loss of the maternal 11p15 allele with paternal isodisomy, so
    only a paternally inherited variant can be rendered homozygous within the
    lesion.
  inheritance_term:
    preferred_term: Somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  evidence:
  - reference: PMID:25765446
    reference_title: "Three novel pathogenic mutations in KATP channel genes and somatic imprinting alterations of the 11p15 region in pancreatic tissue in patients with congenital hyperinsulinism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The epigenetic alteration at the 11p15 region plays a central role in developing focal CHI by paternally derived mutations of the KATP channel and maternal allelic loss at this region."
    explanation: >-
      Establishes the two-hit, parent-of-origin mechanism (paternal K-ATP
      variant plus somatic maternal 11p15 loss) that defines focal disease.
has_subtypes:
- name: Diffuse HI
  display_name: Diffuse Hyperinsulinism
  subtype_term:
    preferred_term: diazoxide-resistant diffuse hyperinsulinism
    term:
      id: MONDO:0015625
      label: diazoxide-resistant diffuse hyperinsulinism
  description: >-
    Whole-pancreas involvement in which every islet is abnormal, typically from
    biallelic recessive (or some dominant) ABCC8/KCNJ11 variants. Diffuse
    disease accounts for roughly 60% of congenital hyperinsulinism, is
    disproportionately diazoxide-unresponsive, and — critically — is NOT
    surgically curable: near-total (90-98%) pancreatectomy controls but does not
    cure hypoglycemia and imposes a very high later burden of diabetes and
    exocrine insufficiency.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diffuse disease accounts for about 60% of all CHI cases and affects all the b-cells of the pancreas."
    explanation: Quantifies diffuse disease as the majority histological form and defines its whole-pancreas extent.
  - reference: PMID:39741883
    reference_title: "Congenital hyperinsulinism in the Ukraine: a 10-year national study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After surgery, complete recovery was observed in all 14 with focal disease, while relapse occurred in three patients with diffuse or atypical histology."
    explanation: Contrasts the non-curative outcome of surgery in diffuse/atypical disease with cure in focal disease.
- name: Focal HI
  display_name: Focal Hyperinsulinism (paternal K-ATP variant + somatic maternal 11p15 LOH)
  subtype_term:
    preferred_term: diazoxide-resistant focal hyperinsulinism
    term:
      id: MONDO:0019265
      label: diazoxide-resistant focal hyperinsulinism
  description: >-
    A discrete (typically 2-10 mm) region of adenomatous islet-cell hyperplasia
    in an otherwise normal pancreas. Focal disease is a two-hit lesion: a
    paternally inherited recessive ABCC8 or KCNJ11 variant becomes homozygous
    within the lesion because of post-zygotic loss of heterozygosity for the
    maternal 11p15 allele with paternal isodisomy, which simultaneously unmasks
    the K-ATP defect and — because the imprinted 11p15 domain is now
    paternal-only (IGF2 up, H19/CDKN1C down) — drives clonal beta-cell
    proliferation. This is the single most management-relevant subtype
    distinction in the disorder: the lesion is localizable by 18F-DOPA PET/CT and
    a limited lesionectomy is curative, sparing the child a near-total
    pancreatectomy and its diabetes risk.
  evidence:
  - reference: PMID:25765446
    reference_title: "Three novel pathogenic mutations in KATP channel genes and somatic imprinting alterations of the 11p15 region in pancreatic tissue in patients with congenital hyperinsulinism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MS-MLPA and microsatellite analyses demonstrated abnormal imprinting patterns and focal loss of maternal 11p13-15 within the lesions. In contrast, parental heterozygosity was preserved in the normal tissue."
    explanation: >-
      Demonstrates directly that the maternal 11p15 loss is somatic and confined
      to the lesion, with normal pancreas retaining heterozygosity.
  - reference: PMID:39741883
    reference_title: "Congenital hyperinsulinism in the Ukraine: a 10-year national study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After surgery, complete recovery was observed in all 14 with focal disease, while relapse occurred in three patients with diffuse or atypical histology."
    explanation: Confirms that focal disease, unlike diffuse disease, is surgically curable.
- name: Atypical HI
  display_name: Atypical / Mosaic Hyperinsulinism (LINE)
  description: >-
    A third histological category, intermediate between focal and diffuse, in
    which abnormal beta cells occupy regional or mosaic territories (localized
    islet nuclear enlargement, LINE). It can arise from somatic ABCC8 or GCK
    variants or from inappropriate beta-cell HK1 expression. Surgical outcome is
    less predictable than in focal disease.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histologically, CHI is classified into three subgroups: diffuse, focal and atypical forms"
    explanation: Establishes atypical disease as a recognised third histological subgroup alongside diffuse and focal.
- name: HI/HA Syndrome
  display_name: Hyperinsulinism-Hyperammonemia Syndrome (GLUD1)
  subtype_term:
    preferred_term: hyperinsulinism-hyperammonemia syndrome
    term:
      id: MONDO:0011717
      label: hyperinsulinism-hyperammonemia syndrome
  description: >-
    Dominant activating GLUD1 variants that escape GTP inhibition of glutamate
    dehydrogenase, giving leucine/protein-sensitive hyperinsulinism together with
    a persistent mild hyperammonemia that is close to specific for this subtype.
    Usually diazoxide-responsive, and managed additionally by protein/leucine
    restriction.
  evidence:
  - reference: PMID:21130127
    reference_title: "Two genetic forms of hyperinsulinemic hypoglycemia caused by dysregulation of glutamate dehydrogenase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the hyperinsulinism/hyperammonemia syndrome caused by dominant activating mutations of GLUD1 which interfere with inhibitory regulation by GTP"
    explanation: Defines the GLUD1 activating-variant basis of the HI/HA subtype.
  - reference: PMID:21130127
    reference_title: "Two genetic forms of hyperinsulinemic hypoglycemia caused by dysregulation of glutamate dehydrogenase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The other distinctive feature of the HI/HA Syndrome is a persistent elevation of plasma ammonia concentrations."
    explanation: Establishes persistent hyperammonemia as the subtype-defining biochemical feature.
- name: Diazoxide-Responsive HI
  display_name: Diazoxide-Responsive Hyperinsulinism
  description: >-
    Hyperinsulinism that is controlled by diazoxide. Because diazoxide acts by
    binding SUR1 and holding the K-ATP channel open, responsiveness requires a
    structurally and functionally intact channel. Diazoxide-responsive disease
    therefore concentrates the non-K-ATP etiologies (GLUD1, HADH, HNF4A/HNF1A,
    SLC16A1, UCP2) and the perinatal-stress/transient forms.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diazoxide functions by binding to the SUR1 subunit of KATPchannel. Thus, it requires a functionally intact KATPchannel."
    explanation: >-
      Explains mechanistically why diazoxide responsiveness partitions the
      disorder along the K-ATP-intact versus K-ATP-defective axis.
- name: Diazoxide-Unresponsive HI
  display_name: Diazoxide-Unresponsive Hyperinsulinism
  subtype_term:
    preferred_term: diazoxide-resistant hyperinsulinism
    term:
      id: MONDO:0017186
      label: diazoxide-resistant hyperinsulinism
  description: >-
    Hyperinsulinism that fails maximal diazoxide therapy. This is the
    pharmacologically predictable consequence of the drug's target being broken:
    recessive (and some dominant) ABCC8/KCNJ11 loss-of-function variants leave no
    functional channel for diazoxide to open. Diazoxide unresponsiveness is
    therefore the clinical trigger for urgent ABCC8/KCNJ11 sequencing and, when a
    single paternal variant is found, 18F-DOPA PET to look for a curable focal
    lesion.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In diazoxide unresponsive CHI cases, urgent genetic analysis forABCC8/KCNJ11and18F-DOPA-PET/CT scan are indicated to identify those patients who could have the focal form of CHI."
    explanation: Confirms diazoxide unresponsiveness as the decision point that triggers focal-lesion workup.
  - reference: PMID:37056678
    reference_title: "K(ATP) channel mutations in congenital hyperinsulinism: Progress and challenges towards mechanism-based therapies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "treatment remains challenging, in particular for patients with diffuse disease who do not respond to the KATP channel activator diazoxide."
    explanation: Confirms that diffuse K-ATP disease is characteristically diazoxide-unresponsive.
- name: Perinatal Stress-Induced HI
  display_name: Perinatal Stress-Induced and Transient Hyperinsulinism (including infant of a diabetic mother)
  description: >-
    Acquired, usually transient hyperinsulinism of the newborn precipitated by
    maternal diabetes mellitus, perinatal asphyxia, intrauterine growth
    restriction, or intrapartum maternal dextrose. It presents within the first
    day of life and most cases resolve within days to two weeks, but a protracted
    form persists for weeks and requires diazoxide. It is far more common than
    genetic congenital hyperinsulinism and is the main reason that a first
    critical sample drawn during the physiological transitional period must be
    repeated after 72 hours before a persistent diagnosis is made.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transient HH typically develops in newborns with certain risk factors"
    explanation: Establishes the transient/stress-induced subtype as risk-factor driven in newborns.
  - reference: PMID:31465295
    reference_title: "Characterization of the duration of treatment with diazoxide in infants with prolonged hyperinsulinism (PHI)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prolonged neonatal hyperinsulinism (PHI) causes hypoglycemia in the neonatal period and is associated with perinatal stress."
    explanation: Documents the protracted, diazoxide-requiring form of perinatal-stress-associated hyperinsulinism.
- name: Syndromic HI
  display_name: Syndromic Hyperinsulinism (Beckwith-Wiedemann spectrum, Kabuki syndrome and others)
  description: >-
    Hyperinsulinism occurring as one feature of a broader syndrome — most
    characteristically the Beckwith-Wiedemann spectrum (11p15 imprinting defect
    or paternal uniparental disomy, mechanistically overlapping the focal-lesion
    11p15 event and occasionally combined with a paternally inherited
    ABCC8/KCNJ11 variant to give severe disease), Kabuki syndrome (KMT2D/KDM6A),
    Turner, Sotos, Costello and Simpson-Golabi-Behmel syndromes, and the
    congenital disorders of glycosylation. Recognising the syndromic context
    redirects testing (11p15 methylation, chromosomal microarray) and changes
    surgical planning, because endocrine overgrowth may be far more extensive
    than a classic focal lesion.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "or associated with various overgrowth syndromes like Beckwith-Wiedemann syndrome or metabolic conditions such as congenital disorders of glycosylation"
    explanation: Establishes syndromic overgrowth (Beckwith-Wiedemann) and CDG as recognised syndromic causes of HH.
- name: Adult-Onset HI
  display_name: Adult-Onset Hyperinsulinemic Hypoglycemia (acquired and late-declaring genetic causes)
  description: >-
    Endogenous hyperinsulinemic hypoglycemia presenting after infancy. Most of
    this group is genuinely acquired — insulinoma, post-bariatric
    (post-gastric-bypass) hypoglycemia, insulin autoimmune syndrome, sulfonylurea
    or exogenous insulin exposure — but the axis here is age of declaration, not
    acquisition, and it also collects late-declaring germline disease such as
    adult nesidioblastosis from a GCK dosage lesion. Hyperinsulinism first appearing after about age two should
    prompt an insulinoma evaluation rather than a congenital-hyperinsulinism
    workup.
  evidence:
  - reference: PMID:39720245
    reference_title: "Case report: Duplication of the GCK gene is a novel cause of nesidioblastosis: evidence from a case with Silver-Russell syndrome-like phenotype related to chromosome 7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe the clinical course of 25-year-old man with hypoglycemia. We diagnosed him with hyperinsulinemic hypoglycemia (HH) and treated him with laparoscopic distal pancreatectomy. Histological examination led to a diagnosis of nesidioblastosis."
    explanation: Documents adult-onset hyperinsulinemic hypoglycemia due to nesidioblastosis, an acquired-presentation form of the umbrella disorder.
prevalence:
- population: Norway live births
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 5.154639
  notes: >-
    Minimum birth prevalence of the persistent (congenital) form, from a
    nationwide Norwegian cohort (1 in 19,400 live births). Reported incidence of
    persistent hyperinsulinism elsewhere ranges from roughly 1:25,000 to 1:50,000
    in outbred Western populations, rising sharply in populations with high
    consanguinity. The acquired perinatal-stress form is far more common than
    this figure and is not captured by it.
  evidence:
  - reference: PMID:38963811
    reference_title: "Clinical and Genetic Characteristics of Congenital Hyperinsulinism in Norway: A Nationwide Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The minimum birth prevalence of CHI in Norway is 1:19,400 live births."
    explanation: Provides a nationwide population-based birth-prevalence estimate for the persistent congenital form.
progression:
- phase: Neonatal presentation
  age_range: first hours to days of life
  notes: >-
    Severe K-ATP hyperinsulinism typically presents within hours to days of
    birth, often with macrosomia, and with hypoglycemia refractory to routine
    intravenous dextrose. Perinatal-stress-induced hyperinsulinism presents
    within the first 24 hours.
  evidence:
  - reference: PMID:40904956
    reference_title: "Neonatal Congenital Hyperinsulinism: A Case-Based Contribution to the Understanding of a Rare Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the case of a male macrosomic newborn admitted on the second day of life for respiratory distress, generalized seizures, and severe hypoglycemia (1.4 mmol/L) unresponsive to intravenous glucose therapy."
    explanation: Illustrates the classic neonatal presentation within the first days of life.
- phase: Resolution versus persistence
  age_range: 10 days to 2 years
  notes: >-
    Perinatal-stress-induced disease usually resolves within 10-14 days, though a
    protracted form can require weeks of diazoxide. Genetic disease persists;
    some ABCC8, KCNJ11, HNF1A and HNF4A forms attenuate with age, allowing
    medication reduction, while diffuse K-ATP disease generally does not.
  evidence:
  - reference: PMID:31465295
    reference_title: "Characterization of the duration of treatment with diazoxide in infants with prolonged hyperinsulinism (PHI)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "duration of treatment was 44.9 ± 27.9 days"
    explanation: Quantifies the weeks-long diazoxide course of the protracted perinatal-stress form before resolution.
- phase: Late-onset presentation
  age_range: after 2 years
  notes: >-
    Hyperinsulinemic hypoglycemia first appearing after about age two shifts the
    differential toward insulinoma and other acquired causes rather than
    congenital hyperinsulinism; mild genetic forms (GCK, SLC16A1, HNF) may
    nevertheless first declare themselves in later childhood or adulthood.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HH most commonly presents during the neonatal period, but can also present during infancy, childhood and even adulthood"
    explanation: Confirms the full age range of presentation, including adult onset.
pathophysiology:
- name: K-ATP Channel Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  description: >
    Inactivating variants in ABCC8 (SUR1) or KCNJ11 (Kir6.2), the two subunits of
    the beta-cell ATP-sensitive potassium channel, remove the channel that
    normally holds the beta-cell membrane hyperpolarized when glucose is low.
    Because the channel is the switch that couples fuel metabolism to secretion,
    its loss uncouples insulin release from the glucose signal entirely. This is
    the single most common molecular cause of hyperinsulinemic hypoglycemia and
    underlies both diffuse and focal histological disease. It is also why the
    first-line drug fails in this group: diazoxide works by holding a functional
    channel open, so a broken channel is pharmacologically unreachable.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: potassium ion transmembrane transport
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
    modifier: DECREASED
  - preferred_term: regulation of insulin secretion
    term:
      id: GO:0050796
      label: regulation of insulin secretion
    modifier: DYSREGULATED
  locations:
  - preferred_term: islet of Langerhans
    term:
      id: UBERON:0000006
      label: islet of Langerhans
  genes:
  - preferred_term: ABCC8
    term:
      id: hgnc:59
      label: ABCC8
  - preferred_term: KCNJ11
    term:
      id: hgnc:6257
      label: KCNJ11
  evidence:
  - reference: PMID:37056678
    reference_title: "K(ATP) channel mutations in congenital hyperinsulinism: Progress and challenges towards mechanism-based therapies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic defects that lead to loss of expression or function of KATP channels are the most common cause of HI (KATP-HI)."
    explanation: Establishes K-ATP loss of function as the leading molecular cause.
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A change in the ratio of ATP to ADP causes closure of the KATPchannel and triggers depolarisation of the cell membrane, activating the voltage-gated calcium channels"
    explanation: >-
      Describes the normal K-ATP-to-calcium coupling whose constitutive
      activation follows channel loss of function; this is islet
      electrophysiology restated in a review, so tagged IN_VITRO.
  downstream:
  - target: Dysregulated Beta-Cell Insulin Secretion
    causal_link_type: DIRECT
    description: >-
      With no functional K-ATP channel the beta-cell membrane stays depolarized
      despite low glucose, voltage-gated calcium channels remain open, cytosolic
      calcium stays high, and insulin granules are exocytosed continuously.
    evidence:
    - reference: PMID:29280746
      reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Calcium enters into b-cells through these voltage-gated calcium channels and an increase in intracellular calcium triggers secretory granule exocytosis and insulin release"
      explanation: >-
        Establishes the depolarization-calcium-exocytosis step that becomes
        constitutive when the channel cannot open; canonical islet
        stimulus-secretion coupling restated in a review, so tagged IN_VITRO.
- name: Glutamate Dehydrogenase Amino-Acid Amplifier Activation
  biological_scale: MOLECULAR
  role: trigger
  description: >
    The protein/leucine-sensitive arm. Dominant activating GLUD1 variants escape
    GTP inhibition of glutamate dehydrogenase, and recessive HADH (SCHAD)
    deficiency removes an inhibitory SCHAD-GDH protein-protein interaction; both
    leave glutamate dehydrogenase inappropriately active, so leucine-driven
    glutamate oxidation feeds the TCA cycle, raises the beta-cell ATP/ADP ratio
    and closes a structurally intact K-ATP channel. This is the only arm that
    also produces hyperammonemia, because the same unrestrained GDH activity in
    liver and kidney generates ammonia — which is why an elevated plasma ammonia
    in hyperinsulinemic hypoglycemia is close to specific for the GLUD1 (HI/HA)
    subtype and not a general feature of the disorder.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: regulation of insulin secretion
    term:
      id: GO:0050796
      label: regulation of insulin secretion
    modifier: DYSREGULATED
  genes:
  - preferred_term: GLUD1
    term:
      id: hgnc:4335
      label: GLUD1
  - preferred_term: HADH
    term:
      id: hgnc:4799
      label: HADH
  evidence:
  - reference: PMID:25733449
    reference_title: "Molecular mechanisms of congenital hyperinsulinism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in GLUD1 and HADH lead to leucine-induced HH, and these two genes encode the key enzymes glutamate dehydrogenase and short chain 3-hydroxyacyl-CoA dehydrogenase which play a key role in amino acid and fatty acid regulation of insulin secretion respectively."
    explanation: Establishes GLUD1 and HADH as the leucine/amino-acid-driven amplifier arm.
  - reference: PMID:21130127
    reference_title: "Two genetic forms of hyperinsulinemic hypoglycemia caused by dysregulation of glutamate dehydrogenase."
    supports: SUPPORT
    evidence_source: IN_VITRO

  - statement: >-
      Parameter variation within a single model accounted for the wide range of
      TTX responses, and adding a glycolytic oscillator generated slow oscillations.
    evidence:
    - reference: PMID:24391482
      reference_title: Mathematical modeling of heterogeneous electrophysiological responses in human beta-cells.

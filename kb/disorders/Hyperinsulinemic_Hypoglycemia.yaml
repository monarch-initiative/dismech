name: Hyperinsulinemic Hypoglycemia
creation_date: "2026-08-01T05:30:00Z"
description: >-
  Hyperinsulinemic hypoglycemia (HH) is the etiology-spanning umbrella disorder
  of inappropriate insulin secretion in the presence of a low plasma glucose. It
  is the most common and most severe cause of persistent hypoglycemia in infants
  and children, and — because insulin simultaneously drives glucose into
  insulin-sensitive tissues, blocks hepatic glucose production, and suppresses
  lipolysis and ketogenesis — the brain is deprived of BOTH glucose and its
  principal alternative ketone fuel. That dual substrate deprivation is why
  neuroglycopenic injury in HH is more profound than in other hypoglycemias and
  why HH is a major preventable cause of permanent brain injury: recognition
  speed, not therapeutic novelty, is the dominant determinant of outcome.
  Mechanistically the disorder converges on unregulated beta-cell insulin
  release, most often from loss-of-function ABCC8/KCNJ11 (SUR1/Kir6.2) K-ATP
  channel defects that leave the beta-cell membrane depolarized, with distinct
  routes via activating GLUD1 (hyperinsulinism-hyperammonemia), activating GCK
  (a lowered glucose set-point), HADH, HNF4A/HNF1A, SLC16A1 (exercise-induced),
  UCP2 and HK1. Beyond the congenital genetic forms the umbrella also spans
  perinatal-stress-induced and maternal-diabetes-associated transient HH,
  syndromic HH (Beckwith-Wiedemann spectrum, Kabuki syndrome), and acquired
  adult disease (insulinoma, post-bariatric hypoglycemia). The clinically
  decisive axis is histological: focal disease — a paternally inherited
  ABCC8/KCNJ11 variant unmasked by somatic loss of the maternal 11p15 allele
  within a discrete lesion — is localizable by 18F-DOPA PET and surgically
  curable, whereas diffuse disease is not.
category: Genetic
disease_term:
  preferred_term: hyperinsulinemic hypoglycemia
  term:
    id: MONDO:0005803
    label: hyperinsulinemic hypoglycemia
parents:
- Endocrine Disease
- Inborn Error of Metabolism
synonyms:
- hyperinsulinism
- hyperinsulinaemic hypoglycaemia
- persistent hyperinsulinemic hypoglycemia of infancy
- congenital hyperinsulinism
notes: >-
  SCOPE / RELATIONSHIP TO Congenital_Isolated_Hyperinsulinism. This entry is the
  deliberately broader umbrella for MONDO:0005803 (a MONDO `disease_grouping`
  term whose xrefs include HP:0000825, OMIMPS:256450 and Orphanet:443095). The
  existing dismech entry `Congenital Isolated Hyperinsulinism` (MONDO:0019010,
  Orphanet:657) is a distinct, narrower MONDO entity restricted to the
  nonsyndromic congenital genetic forms and carries the per-gene subtype detail
  (HHF1/HHF2, HI/HA, SCHAD-HI, HNF4A/HNF1A-HI). To avoid duplicating that graph,
  this umbrella entry deliberately (a) models the etiology-agnostic final common
  pathway — unregulated insulin secretion, the dual glucose-plus-ketone
  substrate deprivation, and neuroglycopenic injury; (b) covers the etiologies
  the congenital-isolated entry excludes by definition (perinatal-stress-induced
  and maternal-diabetes-associated transient HH, syndromic HH, acquired adult
  HH); and (c) adds the umbrella-level clinical artifacts absent there — the
  critical-sample biochemical criteria, structured differential diagnoses, and
  histopathology of the focal/diffuse/atypical split. The `genetic:` block here
  is deliberately the full etiologic gene spectrum of the umbrella (adding GCK,
  SLC16A1, UCP2 and HK1, which the narrower entry does not carry) at one
  paragraph per gene; the per-subtype HHF-numbered molecular detail, variant-level
  curation and subtype-specific evidence stay in
  `Congenital_Isolated_Hyperinsulinism`. Both MONDO:0005803 and MONDO:0019010 are
  MONDO `disease_grouping` terms, so whether this pair is better expressed as a
  `kb/groupings/` Grouping plus a shared `kb/modules/` module for the
  final-common-pathway chain is a genuine lump-versus-split question flagged for
  human adjudication rather than settled here.

- name: Alternative Secretagogue Import and Loss of Mitochondrial Uncoupling
  biological_scale: MOLECULAR
  role: trigger
  description: >
    Two lesions that let fuels which should be invisible to the beta cell drive
    secretion. SLC16A1 (MCT1) is normally silenced in beta cells precisely so
    that pyruvate and lactate cannot act as secretagogues; dominant promoter
    variants de-silence it, so monocarboxylates generated during anaerobic
    exercise enter the cell and trigger insulin release — giving hypoglycemia
    specifically after strenuous exercise. UCP2 normally leaks protons across the

- name: Perinatal Stress Lowering of the Beta-Cell Glucose Threshold
  biological_scale: CELLULAR
  role: trigger
  description: >
    In acquired perinatal-stress hyperinsulinism there is no germline lesion.
    Instead, maternal diabetes, birth asphyxia/hypoxia, intrauterine growth
    restriction or intrapartum maternal dextrose appear to reset the beta-cell
    glucose threshold for suppressing insulin downward, so that secretion
    continues at plasma glucose values that would normally silence it. In the
    infant of a diabetic mother the fetal islet has additionally been
    chronically over-stimulated in utero by transplacental maternal glucose. The
    same downstream chain follows as in genetic disease, but the trigger is
    self-limited: most cases remit within days to two weeks as the stress
    resolves.

- name: Suppression of Lipolysis and Ketogenesis
  biological_scale: ORGANISM
  role: effector
  description: >
    This is the arm that makes hyperinsulinemic hypoglycemia different from every
    other hypoglycemia. Insulin is anabolic on adipose tissue: it stimulates
    lipogenesis, blocks hormone-sensitive-lipase-mediated free fatty acid release,
    and therefore removes the substrate for hepatic beta-oxidation and ketone body
    synthesis. In any other fasting hypoglycemia the falling glucose would
    unleash lipolysis and ketogenesis, and the resulting beta-hydroxybutyrate
    would partially rescue the brain. Here that rescue is disabled by the same
    hormone that caused the hypoglycemia. The biochemical signature — low glucose
    with simultaneously LOW beta-hydroxybutyrate AND LOW free fatty acids — is
    both the diagnostic fingerprint of the disorder and the reason its
    neurological toll is so high.
  cell_types:
  - preferred_term: adipocyte
    term:
      id: CL:0000136
      label: adipocyte

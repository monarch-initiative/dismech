    b12b4f78df67b693129e1d4e743b28eb16eb2f49432fe597f212330633f82caa.
    Static curator inspection confirmed equations, parameters, initial
    conditions, and solver directives, but XPPAUT was unavailable locally and
    the files were not executed. This is a reusable cellular complement, not a
    disease-specific or patient-specific congenital-hyperinsulinism model.
treatments:
- name: Diazoxide
  description: >-
    First-line and the only drug approved for hyperinsulinism, designated a WHO
    essential medicine. Diazoxide binds SUR1 and holds the K-ATP channel open,
    hyperpolarizing the beta cell and switching insulin secretion off — which
    means it can only work when a functional channel exists, and characteristically
    fails in recessive ABCC8/KCNJ11 disease. Dosing is 5-15 (up to 20) mg/kg/day
    orally, usually with chlorothiazide to counter fluid retention. Safety
    monitoring matters: fluid retention and cardiac failure are the dose-limiting
    toxicities, and hypertrichosis, neutropenia, thrombocytopenia, hyperuricemia
    and pulmonary hypertension are recognised adverse effects — an echocardiogram
    about a week after starting and periodic blood counts are advised. Response is
    confirmed by a safety fast, not by impression.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diazoxide
      term:
        id: CHEBI:4495
        label: diazoxide
  target_mechanisms:
  - target: K-ATP Channel Loss of Function
    treatment_effect: ACTIVATES
    description: >-
      Diazoxide activates (opens) residual functional K-ATP channels, restoring
      the hyperpolarizing brake on insulin secretion — hence its failure when the
      channel is absent.
    evidence:
    - reference: PMID:29280746
      reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Diazoxide functions by binding to the SUR1 subunit of KATPchannel. Thus, it requires a functionally intact KATPchannel."
      explanation: Establishes that diazoxide acts on the K-ATP channel and requires it to be intact.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diazoxide, a KATPchannel opener, is invaluable for managing many patients with CHI"
    explanation: Establishes diazoxide as the mainstay first-line therapy and a K-ATP channel opener.
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most severe side effect that limits and requires treatment withdrawal is fluid retention, cardiac failure and the associated electrolyte imbalance."
    explanation: Documents the dose-limiting fluid-retention and cardiac-failure toxicity.
  - reference: PMID:37454648
    reference_title: "International Guidelines for the Diagnosis and Management of Hyperinsulinism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diazoxide, the only drug currently approved for treating HI, was recently designated as an \"essential medicine\" by the World Health Organization"
    explanation: Establishes diazoxide as the sole approved therapy and a WHO essential medicine.
- name: Octreotide and Long-Acting Somatostatin Analogs
  description: >-
    Second-line, off-label therapy for diazoxide-unresponsive disease. Octreotide
    acts through SSTR2/SSTR5 to suppress insulin gene promoter activity, inhibit
    calcium mobilisation and act on the beta-cell K-ATP channel, all of which
    reduce insulin secretion. Started at about 5 µg/kg/day
    subcutaneously and titrated; tachyphylaxis after about 48 hours is expected and
    requires dose adjustment. Patients are often transitioned to monthly lanreotide.
    Necrotizing enterocolitis in unstable premature infants and biliary sludge are
    the safety concerns that shape monitoring.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: octreotide
      term:
        id: CHEBI:7726
        label: octreotide
  target_mechanisms:
  - target: Dysregulated Beta-Cell Insulin Secretion
    treatment_effect: INHIBITS
    description: Somatostatin-receptor agonism directly suppresses beta-cell insulin release.
    evidence:
    - reference: PMID:29280746
      reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Somatostatin also inhibits the KATPchannel which results in reduced insulin secretion"
      explanation: Documents the direct suppression of insulin secretion by somatostatin-receptor agonism.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The recommended initial dose of octreotide is 5 µg/kg/day given by subcutaneous injections (or as a continuous infusion) at 6-8h intervals with a maximum dose of 30-35 µg/kg/day."
    explanation: Provides the dosing regimen for second-line octreotide.
  - reference: PMID:38993725
    reference_title: "Clinical management of diazoxide-unresponsive congenital hyperinsulinism: A single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our cases suggest a safe method of switching from octreotide to lanreotide, elucidate the efficacy of home-based CGM monitoring"
    explanation: Supports the transition to long-acting lanreotide with home CGM.
- name: Exendin-(9-39) (avexitide; investigational)
  description: >-
    Intravenous GLP-1 receptor antagonist studied as a peptide therapy for
    K-ATP-associated congenital hyperinsulinism. In a randomized open-label
    crossover study, exendin-(9-39) increased fasting glucose and reduced the
    likelihood of fasting and protein-induced hypoglycemia. The challenge data
    indicate that its glycemic effects are not explained solely by suppression
    of insulin secretion.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Hyperinsulinemic hypoglycemia
    term:
      id: HP:0000825
      label: Hyperinsulinemic hypoglycemia
  target_mechanisms:
  - target: Dysregulated Beta-Cell Insulin Secretion
    treatment_effect: INHIBITS
    description: >-
      GLP-1 receptor antagonism can reduce beta-cell insulin secretion in the
      fasting state, although modeled secretion during meal and protein
      challenges was not significantly different from vehicle.
    evidence:
    - reference: PMID:35416981
      reference_title: Exendin-(9-39) Effects on Glucose and Insulin in Children With Congenital Hyperinsulinism During Fasting and During a Meal and a Protein Challenge.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the observed increase in AUC of plasma glucose was due to decreased
        insulin secretion secondary to exendin-(9-39) administration
      explanation: >-
        Supports inhibition of fasting-state insulin secretion while the model
        entry separately records the null challenge-level secretion result.
  evidence:
  - reference: PMID:35416981
    reference_title: Exendin-(9-39) Effects on Glucose and Insulin in Children With Congenital Hyperinsulinism During Fasting and During a Meal and a Protein Challenge.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results support a therapeutic potential of exendin-(9-39) to prevent
      fasting and protein-induced hypoglycemia in children with HI.
    explanation: >-
      States the therapeutic conclusion of the pediatric crossover study.
  - reference: PMID:35416981
    reference_title: Exendin-(9-39) Effects on Glucose and Insulin in Children With Congenital Hyperinsulinism During Fasting and During a Meal and a Protein Challenge.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Administration of exendin-(9-39) during the OPTT resulted in 82% (P =
      0.007) reduction in the likelihood of hypoglycemia.
    explanation: >-
      Quantifies the reduction in protein-challenge hypoglycemia versus vehicle.
  notes: >-
    This was a short-duration investigational infusion study, not evidence of
    chronic outpatient efficacy, dose selection, or long-term safety. Sixteen
    children entered the published fasting analysis and eight completed the
    meal/protein crossover.
- name: Glucagon Rescue and Continuous Glucagon Infusion
  description: >-
    Glucagon is the counter-regulatory hormone whose action insulin is blocking,
    so giving it exogenously (0.5-1 mg IM/SC) raises glucose within minutes and is
    the first-line rescue when intravenous access is unavailable. Continuous
    subcutaneous infusion is used to reduce dextrose and fluid requirements. Doses
    above 1 mg can cause rebound hypoglycemia through paradoxical insulin release.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: glucagon
      term:
        id: CHEBI:5391
        label: glucagon
  target_mechanisms:
  - target: Insulin-Driven Glucose Disposal and Suppressed Hepatic Glucose Output
    treatment_effect: INHIBITS
    description: >-
      Glucagon reverses the insulin-imposed block on hepatic glycogenolysis and
      gluconeogenesis, restoring hepatic glucose output.
    evidence:
    - reference: PMID:29280746
      reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Glucagon, in the short-term, induces glycogenolysis, gluconeogenesis and lipolysis and causes a rapid increase in plasma glucose within a few minutes after administration."
      explanation: Documents the reversal of the insulin-imposed block on hepatic glucose output.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glucagon is a key counter-regulatory hormone and is used as a first line therapy for managing CHI patients, particularly in emergency situations where patients are unable to take oral feed and/or intravenous access is difficult to obtain"
    explanation: Establishes glucagon as first-line emergency rescue therapy.
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glucagon, in high doses (over 1 mg), can cause rebound hypoglycemia due to a paradoxical increase in insulin secretion"
    explanation: Documents the rebound-hypoglycemia hazard of high-dose glucagon.
- name: Intravenous Dextrose and High-Rate Carbohydrate Support
  description: >-
    The immediate treatment: continuous intravenous dextrose starting at 6-8
    mg/kg/min and escalated as required — patients may need more than 25 mg/kg/min
    — to hold plasma glucose in the normal range. Chronically this becomes frequent
    high-calorie carbohydrate feeds, continuous gastric dextrose, and often a
    gastrostomy because diazoxide-treated children develop food aversion.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: glucose (dextrose)
      term:
        id: CHEBI:17234
        label: glucose
  target_mechanisms:
  - target: Dual Glucose and Ketone Substrate Deprivation of the Brain
    treatment_effect: INHIBITS
    description: >-
      Exogenous glucose substitutes for the fuel the brain cannot obtain, and is
      the only intervention that acts on the deprivation node itself rather than
      on its upstream cause.
    evidence:
    - reference: PMID:29280746
      reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Patients with HH may require >25 mg/kg/min of intravenous glucose infusion to maintain normoglycaemia."
      explanation: Establishes intravenous glucose as the intervention that maintains cerebral substrate supply.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with HH may require >25 mg/kg/min of intravenous glucose infusion to maintain normoglycaemia."
    explanation: Quantifies the extreme glucose requirement in severe disease.
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Frequent feeding with high calorie carbohydrate feeds may reduce the frequency and severity of hypoglycaemic episodes."
    explanation: Supports the frequent-feeding component of chronic management.
- name: 18F-DOPA PET-Guided Focal Lesionectomy
  description: >-
    The one curative intervention in the disorder. When genetics indicate a single
    paternally inherited K-ATP variant and 18F-DOPA PET/CT localizes a discrete
    lesion, a limited resection with intraoperative frozen-section confirmation
    removes the entire disease. This is why the focal/diffuse distinction is worth
    the diagnostic effort: the same clinical picture leads either to cure or to a
    near-total pancreatectomy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: focal lesionectomy (limited partial pancreatectomy)
    term:
      id: NCIT:C51666
      label: Partial Pancreatectomy
  target_mechanisms:
  - target: Focal Lesion Formation by Paternal K-ATP Variant and Somatic 11p15 Maternal Loss
    treatment_effect: INHIBITS
    description: >-
      Resection physically removes the clone in which the K-ATP variant is
      homozygous, eliminating the source of unregulated secretion.
    evidence:
    - reference: PMID:35018160
      reference_title: "Early diagnosis of focal congenital hyperinsulinism: A fluorine-18-labeled l-dihydroxyphenylalanine positron emission tomography/computed tomography study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In these patients, the lesion can be surgically removed allowing complete resolution of clinical alterations."
      explanation: Confirms that removing the focal lesion resolves the disease.
  evidence:
  - reference: PMID:39741883
    reference_title: "Congenital hyperinsulinism in the Ukraine: a 10-year national study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After surgery, complete recovery was observed in all 14 with focal disease, while relapse occurred in three patients with diffuse or atypical histology."
    explanation: Demonstrates cure in every focal case versus relapse in diffuse/atypical disease.
  - reference: PMID:35018160
    reference_title: "Early diagnosis of focal congenital hyperinsulinism: A fluorine-18-labeled l-dihydroxyphenylalanine positron emission tomography/computed tomography study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "18F-DOPA PET/CT imaging differentiates focal from diffuse disease and is 100% accurate in localizing the focal lesion."
    explanation: Supports the imaging basis for lesion-directed surgery.
- name: Near-Total Pancreatectomy
  description: >-
    Reserved for medically uncontrollable diffuse disease. Removing 90-98% of the
    pancreas trades one disease for another: hypoglycemia frequently persists,
    diabetes mellitus becomes highly likely with time, and exocrine insufficiency
    follows resection above about half the gland. It is a control measure, not a
    cure, and lifelong HbA1c, fecal elastase and fat-soluble vitamin monitoring
    follow.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: pancreatectomy
    term:
      id: NCIT:C15294
      label: Pancreatectomy
  target_mechanisms:
  - target: Dysregulated Beta-Cell Insulin Secretion
    treatment_effect: INHIBITS
    description: >-
      Removing 90-98% of the pancreas removes most of the secreting beta-cell
      mass; because the defect is present in every islet this reduces rather than
      abolishes unregulated secretion, and it trades hypoglycemia for diabetes.
    evidence:
    - reference: PMID:24840042
      reference_title: "Pancreatic endocrine and exocrine function in children following near-total pancreatectomy for diffuse congenital hyperinsulinism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Post-pancreatectomy, in addition to persistent hypoglycaemia, there is a very high risk of diabetes mellitus and pancreatic exocrine insufficiency."
      explanation: >-
        Shows that removing beta-cell mass only partly controls secretion
        (hypoglycemia persists) while producing endocrine and exocrine failure.
  evidence:
  - reference: PMID:24840042
    reference_title: "Pancreatic endocrine and exocrine function in children following near-total pancreatectomy for diffuse congenital hyperinsulinism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Post-pancreatectomy, in addition to persistent hypoglycaemia, there is a very high risk of diabetes mellitus and pancreatic exocrine insufficiency."
    explanation: Documents persistent hypoglycemia plus diabetes and exocrine insufficiency after near-total pancreatectomy.
- name: Nifedipine (not recommended for routine use)
  description: >-
    An L-type calcium-channel blocker used off-label on the rationale that
    voltage-gated calcium entry is the final step of insulin exocytosis. The
    rationale does not survive contact with K-ATP disease: if the channel is
    broken the membrane is already depolarized, and the largest dedicated study
    (11 ABCC8-mutated cases on long-term nifedipine) found no improvement in
    glycemic control in any patient. The 2023 international consensus recommends
    against routine use. Curated deliberately as a negative recommendation,
    because nifedipine is still reached for off-label.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nifedipine
      term:
        id: CHEBI:7565
        label: nifedipine
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "none of patients showed any improvement in glycemic control and patients continued to have hypoglycemic episodes"
    explanation: >-
      In the largest dedicated study of long-term nifedipine in K-ATP
      hyperinsulinism no patient improved, refuting routine efficacy.
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This suggests that mutations in the KATPchannel genes might render the L-type calcium channel ineffective to therapy with nifedipine"
    explanation: Gives the mechanistic reason nifedipine fails specifically in K-ATP disease.
- name: Sirolimus (not recommended outside research protocols)
  description: >-
    An mTOR inhibitor trialled in severe diazoxide-unresponsive diffuse disease
    after early favourable reports. Subsequent evaluation was much less
    encouraging — effective in only 3 of 10 patients, with no reduction in
    beta-cell proliferation in resected tissue from non-responders — while the
    immunosuppressive toxicity profile (stomatitis, infection, renal dysfunction,
    pneumonitis, transaminase and lipid elevation) is substantial. The 2023
    international consensus recommends against routine use outside approved
    research protocols.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "mTOR inhibition has shown to be effective in only three patients (30%) with certain side effects"
    explanation: Reports a low response rate with side effects, refuting sirolimus as routine therapy.
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most commonly reported adverse effects are stomatitis, increased risk of infection, immunosuppression, renal dysfunction, fatigue, pneumonitis and increased serum aminotransferase or lipid levels"
    explanation: Documents the immunosuppressive toxicity profile that weighs against routine use.
- name: Genotype-Specific Trigger Avoidance and Dietary Management
  description: >-
    Because several subtypes have a specific precipitant, management is partly
    behavioural and genotype-directed: protein/leucine restriction in GLUD1 and
    HADH disease, avoidance of anaerobic/strenuous exercise in SLC16A1 disease,
    and — universally — avoidance of prolonged fasting, with a written emergency
    regimen for intercurrent illness.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Glutamate Dehydrogenase Amino-Acid Amplifier Activation
    treatment_effect: INHIBITS
    description: >-
      Protein and leucine restriction withdraws the substrate that allosterically
      activates glutamate dehydrogenase, removing the trigger in GLUD1 and HADH
      disease.
    evidence:
    - reference: PMID:29280746
      reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "protein/leucine loading precipitates hypoglycaemia"
      explanation: >-
        Establishes protein/leucine as the amplifier trigger whose dietary
        withdrawal is the genotype-specific intervention.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "protein/leucine loading precipitates hypoglycaemia"
    explanation: Establishes protein/leucine as the specific precipitant in GLUD1 and HADH disease.
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A pyruvate load or excercise test may precipitate HH and may be used for diagnostic purposes"
    explanation: Supports exercise as the specific precipitant in the SLC16A1 subtype.
diagnosis:
- name: Critical Sample During Documented Hypoglycemia
  description: >-
    Blood drawn at the moment of documented hypoglycemia, before glucose is given,
    for glucose, insulin, C-peptide, beta-hydroxybutyrate, free fatty acids,
    cortisol, growth hormone, lactate, ammonia, acylcarnitines and urine organic
    acids — followed by a glucagon stimulation test. Missing the critical sample is
    a common reason a diagnosis is delayed, because once dextrose is running the
    biochemical signature is gone.
  notes: >-
    No `diagnosis_term` is bound: the "critical sample" is a timed multi-analyte
    panel drawn during spontaneous hypoglycemia, and neither NCIT nor MAXO
    provides a term for that composite procedure. The individual analytes are
    modelled in `biochemical:` and the decision rule in `definitions:`. This is a
    candidate for an ontology new-term request rather than a false match.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In any patient with recurrent or persistent hypoglycaemia, HH should be suspected and critical samples at the time of hypoglycaemic episodes should be collected."
    explanation: Establishes the critical-sample protocol as the diagnostic foundation.
- name: 18F-DOPA PET/CT Localization
  description: >-
    Beta cells take up L-DOPA and decarboxylate it to dopamine, and uptake scales
    with insulin synthesis, so an 18F-DOPA tracer concentrates in hyperfunctional
    tissue. This is the only imaging able to distinguish focal from diffuse disease
    and to localize a focal lesion preoperatively; conventional ultrasound, CT and
    MRI do not reliably detect these lesions.
  diagnosis_term:
    preferred_term: positron emission tomography procedure
    term:
      id: NCIT:C17007
      label: Positron Emission Tomography
  evidence:
  - reference: PMID:35018160
    reference_title: "Early diagnosis of focal congenital hyperinsulinism: A fluorine-18-labeled l-dihydroxyphenylalanine positron emission tomography/computed tomography study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "18F-DOPA PET/CT imaging differentiates focal from diffuse disease and is 100% accurate in localizing the focal lesion."
    explanation: >-
      Supports the role of 18F-DOPA PET/CT in separating focal from diffuse
      disease; recorded as partial because the source is a short case report
      restating a review claim rather than a measured accuracy series, and 100%
      is not the pooled real-world localization accuracy.
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The uptake of the positron emitting tracer18F-DOPA-PET is increased in b-cells with a high rate of insulin synthesis and secretion compared to unaffected areas"
    explanation: Explains the tracer mechanism that makes focal lesions visible.
- name: Rapid ABCC8/KCNJ11 Sequencing with Parental Testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    In diazoxide-unresponsive disease, urgent K-ATP gene sequencing with parental
    samples is the decisive test — not to name the disease, but to determine
    parent of origin. A single paternally inherited recessive variant predicts a
    focal, curable lesion and sends the child to PET rather than to a near-total
    pancreatectomy.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In diazoxide unresponsive CHI cases, urgent genetic analysis forABCC8/KCNJ11and18F-DOPA-PET/CT scan are indicated to identify those patients who could have the focal form of CHI."
    explanation: Establishes urgent K-ATP sequencing plus PET as the focal-lesion identification pathway.
  - reference: PMID:37454648
    reference_title: "International Guidelines for the Diagnosis and Management of Hyperinsulinism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rapid turnaround of genetic test results combined with advanced radiologic imaging can permit identification and localization of surgically-curable focal lesions in a large proportion of children with congenital forms of HI"
    explanation: Confirms that rapid genetics plus imaging identifies surgically curable focal lesions.
differential_diagnoses:
- name: Fatty acid oxidation disorders
  disease_term:
    preferred_term: medium chain acyl-CoA dehydrogenase deficiency
    term:
      id: MONDO:0008721
      label: medium chain acyl-CoA dehydrogenase deficiency
  description: >-
    The closest biochemical mimic, because both present with hypoketotic
    hypoglycemia. MCAD and related defects share the low-ketone finding but the
    lesion is in beta-oxidation, not in insulin.
  distinguishing_features:
  - Free fatty acids are HIGH in fatty acid oxidation defects (lipolysis is intact, oxidation fails) and LOW in hyperinsulinism (lipolysis is blocked) — the single most efficient discriminator on the critical sample.
  - Plasma acylcarnitines are abnormal in fatty acid oxidation defects and normal in hyperinsulinism, with the single exception of HADH/SCHAD deficiency, which itself raises 3-hydroxybutyrylcarnitine.
  - Insulin and C-peptide are appropriately suppressed in fatty acid oxidation defects.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the biochemical profiles of insulin action (low b-hydroxybutyrate and fatty acid concentrations)"
    explanation: >-
      Establishes that low fatty acids alongside low ketones is the profile of
      insulin action, which is what separates hyperinsulinism from a fatty acid
      oxidation defect.
- name: Glycogen storage disease
  disease_term:
    preferred_term: glycogen storage disease I
    term:
      id: MONDO:0002413
      label: glycogen storage disease I
  description: >-
    Hepatic glycogen storage disease presents with fasting hypoglycemia and
    hepatomegaly, both of which also occur in hyperinsulinism.
  distinguishing_features:
  - Glycogen storage disease type I gives a KETOTIC hypoglycemia, the inverse of the hyperinsulinism profile.
  - Lactic acidosis, hyperuricemia and hyperlipidemia accompany the hypoglycemia; lactate is normal in hyperinsulinism.
  - The glucagon stimulation test fails to raise glucose because glucose-6-phosphatase deficiency blocks release of free glucose (lactate rises instead), whereas in hyperinsulinism the response is brisk and positive.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "a positive glycaemic response (rise in the plasma glucose concentration of >1.5 mmol/L from baseline) following an intramuscular/intravenous injection of glucagon at the time of hypoglycaemia provides supportive evidence"
    explanation: >-
      Supports the glucagon-response criterion that separates hyperinsulinism
      (positive response) from glycogen storage disease; the cited source
      describes the hyperinsulinism side of that contrast only.
- name: Insulinoma
  disease_term:
    preferred_term: pancreatic insulinoma
    term:
      id: MONDO:0024677
      label: pancreatic insulinoma
  description: >-
    An insulin-secreting pancreatic neuroendocrine tumour produces biochemically
    identical endogenous hyperinsulinemic hypoglycemia.
  distinguishing_features:
  - Age is the key discriminator — hyperinsulinemic hypoglycemia first appearing after about two years of age should prompt an insulinoma evaluation.
  - Insulinoma is typically a solitary, cross-sectionally visible tumour arising against previously normal glucose regulation.
  - Insulinoma may occur within multiple endocrine neoplasia type 1.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "HH most commonly presents during the neonatal period, but can also present during infancy, childhood and even adulthood"
    explanation: >-
      Supports the age-based framing of the differential; the source establishes
      the age range of congenital HH rather than the insulinoma comparison
      directly, so support is partial.
- name: Exogenous insulin administration (factitious or accidental)
  description: >-
    Administered insulin — accidental, iatrogenic, or in factitious disorder or
    medical child abuse — reproduces the entire clinical and biochemical picture
    of endogenous hyperinsulinism and must be actively excluded, particularly in
    an atypical age group or an unwitnessed setting.
  distinguishing_features:
  - C-peptide is the discriminator — endogenous hyperinsulinism raises insulin and C-peptide together because they are secreted in equimolar amounts from proinsulin.
  - Injected insulin raises insulin while SUPPRESSING C-peptide, giving an elevated insulin-to-C-peptide ratio.
  - Sulfonylurea ingestion raises both insulin and C-peptide and requires a drug screen to detect.
  notes: >-
    MONDO does not provide a distinct disease term for exogenous or factitious
    insulin-induced hypoglycemia. Binding this differential to MONDO:0005803
    would make the disease its own differential, so no `disease_term` is
    asserted; the discriminating HP:0034384 phenotype is bound instead.
  phenotypes:
  - name: Elevated insulin-to-C-peptide ratio
    phenotype_term:
      preferred_term: Elevated circulating insulin:C-peptide ratio
      term:
        id: HP:0034384
        label: Elevated circulating insulin:C-peptide ratio
  evidence:
  - reference: PMID:40904956
    reference_title: "Neonatal Congenital Hyperinsulinism: A Case-Based Contribution to the Understanding of a Rare Disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory investigations revealed elevated insulin and C-peptide levels"
    explanation: >-
      Documents the concordant insulin-and-C-peptide elevation of endogenous
      disease, which is precisely the pattern that exogenous insulin breaks;
      recorded as partial because the source does not itself address exogenous
      insulin.
- name: Adrenal insufficiency
  disease_term:
    preferred_term: adrenocortical insufficiency
    term:
      id: MONDO:0000004
      label: adrenocortical insufficiency
  description: >-
    Cortisol deficiency impairs gluconeogenesis and produces fasting hypoglycemia
    in infants, and can co-present with the same non-specific neonatal symptoms.
  distinguishing_features:
  - Cortisol is inappropriately low on the critical sample, whereas counter-regulatory hormones are intact in hyperinsulinism.
  - Adrenal insufficiency gives a ketotic hypoglycemia.
  - Associated hyponatremia, hyperkalemia, hyperpigmentation or ambiguous genitalia point to the adrenal.
  notes: >-
    Adrenal insufficiency is listed in the differential-diagnosis section of the
    GeneReviews chapter body (PMID:20301549, NBK1375) and cortisol is measured on
    the same critical sample for exactly this reason. That chapter section is not
    reproduced in the cached PubMed abstract, so the attribution is recorded here
    as provenance rather than as a quoted evidence snippet.
- name: Growth hormone deficiency and hypopituitarism
  disease_term:
    preferred_term: hypopituitarism
    term:
      id: MONDO:0005152
      label: hypopituitarism
  description: >-
    Congenital hypopituitarism causes neonatal hypoglycemia through combined
    growth hormone and cortisol deficiency, and can itself present with a partly
    hypoketotic picture.
  distinguishing_features:
  - Growth hormone and cortisol are inappropriately low on the critical sample.
  - Midline defects, micropenis, prolonged jaundice or septo-optic dysplasia point to the pituitary.
  - Insulin and C-peptide are appropriately suppressed, unlike in hyperinsulinism.
  notes: >-
    Counter-regulatory hormone deficiency is listed in the differential-diagnosis
    section of the GeneReviews chapter body (PMID:20301549, NBK1375), and growth
    hormone and cortisol are drawn on the same critical sample for exactly this
    reason. That chapter section is not reproduced in the cached PubMed abstract,
    so the attribution is recorded here as provenance rather than as a quoted
    evidence snippet.
- name: Idiopathic ketotic hypoglycemia
  description: >-
    A common cause of hypoglycemia in toddlers and young children, presenting with
    fasting hypoglycemia during intercurrent illness.
  distinguishing_features:
  - Ketotic by definition — beta-hydroxybutyrate is appropriately elevated at the time of hypoglycemia, the exact inverse of the hyperinsulinism profile.
  - Insulin is appropriately suppressed.
  - The intravenous glucose infusion requirement is normal rather than above 8 mg/kg/min.
  notes: >-
    MONDO does not provide a term for idiopathic ketotic hypoglycemia at the time
    of curation, so this differential is recorded without a bound disease_term;
    the contrasting phenotype is bound instead.
  phenotypes:
  - name: Ketotic hypoglycemia
    phenotype_term:
      preferred_term: Ketotic hypoglycemia
      term:
        id: HP:0012734
        label: Ketotic hypoglycemia
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is the most common cause of persistent hypoketotic hypoglycaemia in neonates and infants"
    explanation: >-
      Establishes hyperinsulinism as a HYPOketotic hypoglycemia, the defining
      contrast with ketotic hypoglycemia.
clinical_trials:
- name: NCT00897676
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Completed randomized, open-label phase 1/2 crossover study of intravenous
    exendin-(9-39) versus vehicle during fasting and nutrient challenges in
    congenital hyperinsulinism. The published analysis included 16 children;
    eight completed the mixed-meal and oral-protein crossover.
  target_phenotypes:
  - preferred_term: Hyperinsulinemic hypoglycemia
    term:
      id: HP:0000825
      label: Hyperinsulinemic hypoglycemia
  evidence:
  - reference: clinicaltrials:NCT00897676
    reference_title: "Role of GLP-1 in Congenital Hyperinsulinism:Effect of Exendin-(9-39) on Fasting Adaptation and Protein Sensitivity"
    supports: SUPPORT
    snippet: >-
      The purpose of this study is to examine the effects of exendin-(9-39) on
      fasting blood glucose and protein induced hypoglycemia on subjects with
      Congenital Hyperinsulinism.
    explanation: >-
      Establishes the registered intervention, population, and fasting/protein
      challenge objectives.
  - reference: PMID:35416981
    reference_title: Exendin-(9-39) Effects on Glucose and Insulin in Children With Congenital Hyperinsulinism During Fasting and During a Meal and a Protein Challenge.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This was an open-label, four-period crossover study.
    explanation: Confirms the published crossover design.
- name: NCT06208215
  phase: PHASE_III
  status: ACTIVE_NOT_RECRUITING
  description: >-
    Phase 3 randomized, double-blind, placebo-controlled study of RZ358
    (ersodetug), an allosteric anti-insulin-receptor antibody that acts distal to
    the beta cell by blunting insulin action at the receptor rather than trying to
    suppress a broken secretory apparatus — a mechanistically distinct approach
    that should work irrespective of the underlying genotype.
  target_phenotypes:
  - preferred_term: Hyperinsulinemic hypoglycemia
    term:
      id: HP:0000825
      label: Hyperinsulinemic hypoglycemia
  evidence:
  - reference: clinicaltrials:NCT06208215
    reference_title: "A Phase 3, Randomized, Double-Blind, Placebo-Controlled, Parallel-Arm Study to Evaluate the Efficacy and Safety of RZ358 in Patients With Congenital Hyperinsulinism"
    supports: SUPPORT
    snippet: "The Phase 3 pivotal study is designed to evaluate the efficacy and safety of RZ358 for the treatment of congenital hyperinsulinism (HI) as add-on to standard-of-care (SOC) therapy compared to SOC alone over 24 weeks"
    explanation: Confirms the phase 3 evaluation of RZ358 as add-on therapy for hyperinsulinism.
- name: NCT04538989
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Open-label multiple-dose phase 2 study of RZ358 (ersodetug), the predecessor
    to the phase 3 programme; results were first posted in May 2025.
  target_phenotypes:
  - preferred_term: Hyperinsulinemic hypoglycemia
    term:
      id: HP:0000825
      label: Hyperinsulinemic hypoglycemia
  evidence:
  - reference: clinicaltrials:NCT04538989
    reference_title: "An Open-Label Multiple-Dose Study of RZ358 in Patients With Congenital Hyperinsulinism"
    supports: SUPPORT
    snippet: "The objective of this trial is to evaluate the safety, tolerability and glucose-raising effects of RZ358 in patients with Congenital Hyperinsulinism (HI)."
    explanation: Documents the phase 2 evaluation of RZ358 that preceded the phase 3 study.
- name: NCT04732416
  phase: PHASE_II
  status: ACTIVE_NOT_RECRUITING
  description: >-
    Phase 2 multiple-ascending-dose proof-of-concept study of HM15136
    (efpegerglucagon), a long-acting glucagon analogue given once weekly as
    add-on therapy — the same counter-regulatory strategy as dasiglucagon but on
    a weekly rather than continuous-infusion schedule.
  target_phenotypes:
  - preferred_term: Hypoglycemia
    term:
      id: HP:0001943
      label: Hypoglycemia
  evidence:
  - reference: clinicaltrials:NCT04732416
    reference_title: "A Phase 2, Multiple Ascending Dose, Open-label, Proof-of-concept Study to Evaluate the Safety, Tolerability, Pharmacokinetics, and Efficacy of HM15136 (Efpegerglucagon) Treatment for 8 Weeks in Subjects Aged ≥2 Years With Congenital Hyperinsulinism (CHI)"
    supports: SUPPORT
    snippet: "This study is designed to evaluate the safety, tolerability, pharmacokinetics (PK), and efficacy of HM15136 when used as add-on therapy in subjects with CHI with persistent hypoglycemia while on standard of care treatment (SoC)."
    explanation: Documents weekly efpegerglucagon as an investigational add-on therapy for persistent hypoglycemia in hyperinsulinism.
- name: NCT03777176
  phase: PHASE_III
  status: COMPLETED
  description: >-
    Two-period open-label phase 3 trial of dasiglucagon, a soluble glucagon
    analogue delivered by continuous subcutaneous infusion, exploiting the
    counter-regulatory arm that insulin is suppressing.
  target_phenotypes:
  - preferred_term: Hypoglycemia
    term:
      id: HP:0001943
      label: Hypoglycemia
  evidence:
  - reference: clinicaltrials:NCT03777176
    reference_title: "A Two-Period, Open-label Trial Evaluating the Efficacy and Safety of Dasiglucagon for the Treatment of Children With Congenital Hyperinsulinism"
    supports: SUPPORT
    snippet: "The objective of the trial is to evaluate the efficacy and safety of dasiglucagon administered as a subcutaneous (SC) infusion in reducing hypoglycemia in children with CHI."
    explanation: Confirms the phase 3 evaluation of continuous subcutaneous dasiglucagon in hyperinsulinism.

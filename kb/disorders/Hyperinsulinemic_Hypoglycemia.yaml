- name: Insulin-Driven Glucose Disposal and Suppressed Hepatic Glucose Output
  biological_scale: ORGANISM
  role: effector
  description: >
    Insulin acts on the two arms of glucose homeostasis at once: it accelerates
    glucose uptake into muscle, liver and adipose tissue and it shuts down the
    liver's ability to release glucose by inhibiting glycogenolysis and
    gluconeogenesis while stimulating glycogen synthesis. The result is
    hypoglycemia that cannot be defended endogenously, and that clinically
    requires glucose infusion rates far above normal — a requirement above about
    8 mg/kg/min in a neonate is itself close to diagnostic. Hepatic glycogen
    accumulation from this same signal contributes to the hepatomegaly seen in
    some patients.

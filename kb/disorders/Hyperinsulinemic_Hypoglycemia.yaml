- name: Dysregulated Beta-Cell Insulin Secretion
  biological_scale: CELLULAR
  role: central_effector
  description: >
    The convergent core of the disorder, reached from every etiology above:
    insulin is secreted at plasma glucose concentrations at which secretion
    should be fully suppressed. In health serum insulin becomes undetectable once
    plasma glucose falls below about 3 mmol/L; in hyperinsulinemic hypoglycemia
    it remains detectable, and it is this failure of suppression — rather than an
    absolute insulin concentration — that defines the disease. Everything
    clinically distinctive about hyperinsulinemic hypoglycemia flows from this
    single node, because insulin is not merely a glucose-lowering hormone but a
    simultaneous suppressor of every counter-regulatory fuel pathway.

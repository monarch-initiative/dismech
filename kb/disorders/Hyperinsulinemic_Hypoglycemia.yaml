- name: Lowered Beta-Cell Glucose Set-Point
  biological_scale: MOLECULAR
  role: trigger
  description: >
    The glucose-sensing arm. Glucokinase is the beta cell's glucose sensor, the
    step that sets the plasma glucose concentration at which secretion begins.
    Activating GCK variants (and, rarely, GCK duplication) shift that threshold
    downward, so the whole homeostatic system defends an inappropriately low
    glucose rather than failing to switch off. A non-coding HK1 variant that
    fails to silence hexokinase 1 in the beta cell does the same thing by a
    different route, installing a low-Km hexokinase that phosphorylates glucose
    at concentrations far below the normal threshold. Because a reset set-point
    is not the same as an absent brake, GCK disease can uniquely show a ketotic
    response on prolonged fasting.

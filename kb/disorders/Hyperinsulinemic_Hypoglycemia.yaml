    prospective dose-selection tool.
- name: Human Beta-Cell Electrophysiology and Calcium ODE
  description: >-
    Conductance-based model of normal human beta-cell electrical activity with
    membrane voltage, explicit K-ATP current, voltage-gated ion channels,
    submembrane and cytosolic calcium, and an optional glycolytic oscillator. It
    was used alongside human donor-cell recordings to explain heterogeneous
    blocker responses and to interpret previously reported insulin-secretion
    measurements.
  model_type: KINETIC
  repository_url: https://doi.org/10.1371/journal.pcbi.1003536
  model_id: "10.1371/journal.pcbi.1003536.s001; 10.1371/journal.pcbi.1003536.s002"
  base_model: Pedersen 2010 human beta-cell electrophysiology model
  model_software: XPPAUT with CVODE
  model_format: XPPAUT .ode files
  publication: PMID:24391482
  modeled_mechanisms:
  - target: K-ATP Channel Loss of Function
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      The explicit K-ATP conductance parameter can be lowered to test how reduced
      K-ATP current changes human beta-cell firing and calcium dynamics.
    limitations: >-
      Reduced conductance is a generic perturbation of a normal-donor beta-cell
      model, not an ABCC8 or KCNJ11 congenital-hyperinsulinism calibration. It
      omits channel trafficking, MgADP/nucleotide gating, focal mosaicism,
      diazoxide response, insulin output, and whole-body glucose regulation.
    readouts:
    - name: Membrane electrical activity after reduced K-ATP conductance
      target: K-ATP Channel Loss of Function
      direction: ALTERED
      interpretation: >-
        Voltage firing after lowering gKATP is a direct electrophysiologic
        consequence of the in-silico conductance perturbation.
      evidence:
      - reference: PMID:24391482
        reference_title: Mathematical modeling of heterogeneous electrophysiological responses in human beta-cells.
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          When gKATP~0:002 nS/pF, the model shows continued firing
        explanation: >-
          Gives a reported change in simulated firing under reduced K-ATP
          conductance.
    evidence:
    - reference: PMID:24391482
      reference_title: Mathematical modeling of heterogeneous electrophysiological responses in human beta-cells.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        With default K(ATP)-channel conductance gKATP~0:010 nS/pF, the simulation
        reproduces the data in panel C
      explanation: >-
        Establishes the explicit K-ATP conductance and its use in a simulation
        compared with donor-cell electrophysiology.
  - target: Dysregulated Beta-Cell Insulin Secretion
    relationship: MEASURES
    fidelity: LOW
    description: >-
      Simulated voltage and calcium provide proximal electrophysiologic
      surrogates for stimulus-secretion coupling and were used to interpret
      human insulin-secretion experiments.
    limitations: >-
      The model has no insulin-secretion state or granule-exocytosis output, and
      calcium is only a surrogate. Cells came from normal donors, with no
      congenital-hyperinsulinism genotype, disease calibration, or pediatric
      validation.
    readouts:
    - name: Submembrane and cytosolic calcium dynamics
      target: Dysregulated Beta-Cell Insulin Secretion
      interpretation: >-
        Calcium dynamics are modeled as a proximal secretion surrogate; an
        insulin amount or secretion rate is not calculated.
      evidence:
      - reference: PMID:24391482
        reference_title: Mathematical modeling of heterogeneous electrophysiological responses in human beta-cells.
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          By including SK-channels and Ca2+ dynamics in a previous mathematical
          model of electrical activity in human beta-cells
        explanation: >-
          Identifies calcium dynamics as an explicit component of the human
          beta-cell electrophysiology model.
    evidence:
    - reference: PMID:24391482
      reference_title: Mathematical modeling of heterogeneous electrophysiological responses in human beta-cells.
      supports: PARTIAL
      evidence_source: COMPUTATIONAL
      snippet: >-
        use our findings to obtain insight in previously published insulin
        secretion measurements.
      explanation: >-
        Supports use of electrophysiology and calcium as a secretion surrogate,
        while stopping short of an explicit insulin-output model.

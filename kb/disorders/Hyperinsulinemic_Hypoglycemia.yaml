biochemical:
- name: Plasma beta-hydroxybutyrate at the time of hypoglycemia
  presence: DECREASED
  notes: >-
    The single most informative analyte in the critical sample. In any normal
    fasting response a plasma glucose below about 50 mg/dL should be accompanied
    by a brisk ketotic response; in hyperinsulinemic hypoglycemia
    beta-hydroxybutyrate is inappropriately suppressed. Because insulin's
    anti-ketogenic action is a more sensitive readout than the measured insulin
    concentration, a suppressed beta-hydroxybutyrate is a more reliable indicator
    of excessive insulin action than the insulin level itself.
  reference_ranges:
  - unit: mmol/L
    population: neonates and infants during documented hypoglycemia (plasma glucose <50 mg/dL)
    notes: >-
      Interpretive threshold rather than a population reference interval: a
      plasma beta-hydroxybutyrate below 1.8 mmol/L at a plasma glucose under
      50 mg/dL indicates excessive insulin action. The 1.8 mmol/L cut-point is
      taken from the 2023 international consensus guideline (PMID:37454648),
      whose PubMed abstract does not reproduce the numeric criterion, so it is
      recorded here as provenance rather than as a quoted snippet.
    interpretation_bands:
    - name: Inappropriately suppressed (consistent with excessive insulin action)
      upper_bound: 1.8
      unit: mmol/L
      abnormal_flag: LOW
      phenotype_term:
        preferred_term: Hypoketotic hypoglycemia
        term:
          id: HP:0001985
          label: Hypoketotic hypoglycemia
      interpretation: >-
        Beta-hydroxybutyrate below 1.8 mmol/L while plasma glucose is below
        50 mg/dL indicates a failure of the normal ketotic response and supports
        excessive insulin action.
    - name: Appropriate ketotic response (argues against hyperinsulinism)
      lower_bound: 1.8
      unit: mmol/L
      abnormal_flag: NORMAL
      interpretation: >-
        A beta-hydroxybutyrate at or above 1.8 mmol/L before glucose falls below
        50-60 mg/dL is the criterion used to confirm diazoxide responsiveness on
        a safety fast, and in an untreated patient argues against hyperinsulinism.
  evidence:
  - reference: PMID:38944478
    reference_title: "Etiology of the Neonatal Hypoglycemias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the authors propose that routine measurement of B-hydroxybutyrate should be considered an essential part of glucose monitoring in newborn infants."
    explanation: >-
      Establishes beta-hydroxybutyrate as the key discriminating analyte, to the
      point of being proposed for routine newborn monitoring.
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the diagnosis of HH should not be based on an isolated serum insulin/c-peptide concentration but on the clinical presentation and the biochemical profiles of insulin action (low b-hydroxybutyrate and fatty acid concentrations)"
    explanation: >-
      States explicitly that suppressed beta-hydroxybutyrate and fatty acids are
      more diagnostically reliable than the insulin concentration alone.
- name: Plasma free fatty acids at the time of hypoglycemia
  presence: DECREASED
  notes: >-
    Suppressed free fatty acids during hypoglycemia reflect insulin's block on
    lipolysis. The result carries specific discriminating information: in a fatty
    acid oxidation defect the ketones are also low, but free fatty acids are HIGH
    because lipolysis is intact and it is the oxidation step that fails. Low
    ketones with low free fatty acids points to hyperinsulinism; low ketones with
    high free fatty acids points to a fatty acid oxidation disorder.
  reference_ranges:
  - unit: mmol/L
    population: infants during documented hypoglycemia (plasma glucose <50 mg/dL)
    notes: >-
      In a prolonged-hyperinsulinism cohort, free fatty acids measured during
      documented hypoglycemia averaged 0.3 mmol/L against a stated expectation of
      more than 1.5 mmol/L. The 2023 international consensus guideline uses a
      cut-point of 1.7 mmol/L as evidence of excessive insulin action; that
      numeric criterion is not reproduced in the guideline's PubMed abstract and
      is recorded here as provenance rather than as a quoted snippet.
    interpretation_bands:
    - name: Inappropriately suppressed (consistent with excessive insulin action)
      upper_bound: 1.7
      unit: mmol/L
      abnormal_flag: LOW
      phenotype_term:
        preferred_term: Decreased circulating free fatty acid level
        term:
          id: HP:0040299
          label: Decreased circulating free fatty acid level
      interpretation: >-
        Free fatty acids below 1.7 mmol/L during hypoglycemia indicate suppressed
        lipolysis and support excessive insulin action.
    - name: Appropriate lipolytic response (argues against hyperinsulinism)
      lower_bound: 1.7
      unit: mmol/L
      abnormal_flag: NORMAL
      interpretation: >-
        Free fatty acids at or above 1.7 mmol/L during hypoglycemia represent the
        expected lipolytic response and argue against excessive insulin action.
        It is the conjunction of this appropriate free-fatty-acid rise with
        inappropriately low ketones that redirects the workup toward a fatty acid
        oxidation disorder.
    evidence:
    - reference: PMID:31465295
      reference_title: "Characterization of the duration of treatment with diazoxide in infants with prolonged hyperinsulinism (PHI)."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "levels were measured during hypoglycemia (plasma glucose <50 mg/dL)"
      explanation: >-
        Establishes only the sampling condition this interval applies to
        (documented hypoglycemia below 50 mg/dL), not the 1.7 mmol/L cut-point
        itself, which comes from the guideline body and is recorded in `notes:`.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the biochemical profiles of insulin action (low b-hydroxybutyrate and fatty acid concentrations)"
    explanation: Establishes suppressed fatty acids as part of the biochemical profile of insulin action.
- name: Plasma insulin and C-peptide at the time of hypoglycemia
  presence: INCREASED
  notes: >-
    Detectable insulin with a concordantly detectable C-peptide during documented
    hypoglycemia indicates endogenous insulin secretion. The C-peptide is what
    separates endogenous hyperinsulinism from exogenous insulin administration:
    injected insulin raises insulin while suppressing C-peptide, giving a high
    insulin-to-C-peptide ratio. A single insulin value is not sufficient to make
    or exclude the diagnosis.
  evidence:
  - reference: PMID:40904956
    reference_title: "Neonatal Congenital Hyperinsulinism: A Case-Based Contribution to the Understanding of a Rare Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory investigations revealed elevated insulin and C-peptide levels, absence of ketone bodies, and a positive response to the glucagon stimulation test."
    explanation: Documents the concordant insulin and C-peptide elevation of endogenous hyperinsulinism.
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In some difficult cases, the diagnosis of HH should not be based on an isolated serum insulin/c-peptide concentration"
    explanation: Cautions that an isolated insulin/C-peptide value is insufficient for diagnosis.
- name: Plasma ammonia
  presence: INCREASED
  subtype: HI/HA Syndrome
  notes: >-
    Persistently, mildly elevated plasma ammonia in a patient with
    hyperinsulinemic hypoglycemia is close to specific for the GLUD1
    hyperinsulinism-hyperammonemia subtype.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An elevated serum ammonia concentration in a patient with HH is suggestive of the hyperinsulinism and hyperammonaemia (HI/HA) syndrome"
    explanation: Establishes ammonia as the subtype-discriminating analyte for HI/HA.
- name: Glycemic response to glucagon during hypoglycemia
  presence: PRESENT
  notes: >-
    A brisk rise in plasma glucose after intramuscular or intravenous glucagon
    given at the time of hypoglycemia demonstrates that hepatic glycogen stores
    are intact and are being held back by insulin — a paradoxical finding at a
    glucose level that should already have exhausted them, and therefore strong
    functional evidence of excessive insulin action.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In some patients, a positive glycaemic response (rise in the plasma glucose concentration of >1.5 mmol/L from baseline) following an intramuscular/intravenous injection of glucagon at the time of hypoglycaemia provides supportive evidence"
    explanation: Provides the quantitative glucagon-response criterion used in the critical-sample workup.
definitions:
- name: Critical-Sample Biochemical Criteria for Hyperinsulinemic Hypoglycemia
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The diagnosis is made from a critical sample — blood drawn at the moment of
    documented hypoglycemia (plasma glucose below about 50 mg/dL / 2.8 mmol/L),
    before glucose is given. The logic is not whether the insulin is high, but
    whether insulin action is detectable when it should be zero, which is why the
    suppressed-fuel markers carry more weight than the insulin assay.
  scope: >-
    Applies to neonates, infants and children with recurrent or persistent
    hypoglycemia. A sample drawn within the first 72 hours of life may reflect
    physiological transitional hypoglycemia and should be repeated after 72 hours
    if hypoglycemia persists.
  inclusion_criteria:
  - preferred_term: Documented hypoglycemia at the time of sampling
    description: Plasma glucose below 50 mg/dL (2.8 mmol/L) when the sample is drawn.
  - preferred_term: Inappropriately detectable insulin and C-peptide
    description: Measurable plasma insulin with a concordant C-peptide at that plasma glucose.
  - preferred_term: Suppressed beta-hydroxybutyrate
    term:
      id: HP:0001985
      label: Hypoketotic hypoglycemia
    description: Plasma beta-hydroxybutyrate below approximately 1.8 mmol/L.
  - preferred_term: Suppressed free fatty acids
    term:
      id: HP:0040299
      label: Decreased circulating free fatty acid level
    description: Plasma free fatty acids below approximately 1.7 mmol/L.
  - preferred_term: Excessive glucose infusion requirement
    description: >-
      Intravenous glucose infusion above 8 mg/kg/min needed to maintain
      normoglycemia (normal requirement is 4-6 mg/kg/min).
  - preferred_term: Positive glycemic response to glucagon
    description: >-
      Rise in plasma glucose of more than 1.5 mmol/L (roughly 30 mg/dL) from
      baseline after intramuscular or intravenous glucagon given during
      hypoglycemia.
  exclusion_criteria:
  - preferred_term: Elevated free fatty acids with low ketones
    description: Redirects the diagnosis to a fatty acid oxidation disorder.
  - preferred_term: Elevated insulin with suppressed C-peptide
    term:
      id: HP:0034384
      label: Elevated circulating insulin:C-peptide ratio
    description: Indicates exogenous (administered) insulin rather than endogenous hyperinsulinism.
  - preferred_term: Lactic acidosis with hepatomegaly and a ketotic response
    description: Suggests a hepatic glycogen storage disorder.
  - preferred_term: Cortisol or growth hormone deficiency
    description: >-
      Counter-regulatory hormone deficiency must be excluded on the same critical
      sample.
  notes: >-
    The numeric beta-hydroxybutyrate (1.8 mmol/L) and free fatty acid
    (1.7 mmol/L) cut-points are those of the 2023 international consensus
    guideline (PMID:37454648); they appear in the guideline body rather than in
    its PubMed abstract, so they are recorded here as provenance and are not
    quoted as evidence snippets.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In any patient with recurrent or persistent hypoglycaemia, HH should be suspected and critical samples at the time of hypoglycaemic episodes should be collected."
    explanation: Establishes the critical-sample approach as the basis of biochemical diagnosis.
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An intravenous glucose infusion rate requirement of >8 mg/kg/min (normally is 4-6 mg/kg/min) is virtually diagnostic of HH"
    explanation: Provides the glucose-infusion-rate inclusion criterion.
histopathology:
- name: Diffuse beta-cell nuclear enlargement
  description: >-
    In diffuse disease all islets throughout the pancreas are involved, with beta
    cells showing abnormally large nuclei. There is no resectable target, which is
    why surgery in diffuse disease is a 90-98% pancreatectomy rather than a cure.
  subtype: Diffuse HI
  diagnostic: true
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diffuse disease accounts for about 60% of all CHI cases and affects all the b-cells of the pancreas. Morphology of the islets of Langerhans typically show the presence of b-cells with abnormally large nuclei"
    explanation: Describes the whole-pancreas involvement and nuclear enlargement that define diffuse histology.
- name: Focal adenomatous islet-cell hyperplasia
  description: >-
    A discrete, generally unencapsulated 2-10 mm nodule of nodular islet-cell
    hyperplasia including ductuloinsular complexes, with enlarged cytoplasm and
    irregular nuclei, surrounded by histologically normal pancreas. Loss of
    nuclear p57 (CDKN1C) staining within the lesion reflects the underlying
    maternal 11p15 loss and is used to confirm focal disease on frozen section.
  subtype: Focal HI
  diagnostic: true
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Focal pancreatic lesions are generally 2-10 mm in size and appear as small regions of islet adenomatosis (nodular hyperplasia of islet-like cell clusters, including ductuloinsular complexes"
    explanation: Describes the size and architecture of the focal lesion.
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Islet cells in the lesion have large cytoplasm with dispersed abnormal nuclei of irregular shape"
    explanation: Describes the cytological features of the focal lesion.
genetic:
- name: ABCC8 (SUR1) loss-of-function variants
  gene_term:
    preferred_term: ABCC8
    term:
      id: hgnc:59
      label: ABCC8
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    ABCC8 encodes SUR1, the regulatory subunit of the beta-cell K-ATP channel and
    the binding site for diazoxide. It is the most frequently identified gene in
    hyperinsulinism cohorts. Biallelic recessive variants give severe,
    diazoxide-unresponsive diffuse disease; monoallelic dominant variants give
    milder, often diazoxide-responsive disease; and a single paternally inherited
    recessive variant predicts a focal lesion.
  evidence:
  - reference: PMID:38963811
    reference_title: "Clinical and Genetic Characteristics of Congenital Hyperinsulinism in Norway: A Nationwide Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ABCC8 variants were most common (n= 40), and 5 novel variants were identified."
    explanation: Confirms ABCC8 as the most frequently identified causal gene in a nationwide cohort.
  - reference: PMID:38963811
    reference_title: "Clinical and Genetic Characteristics of Congenital Hyperinsulinism in Norway: A Nationwide Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although most ABCC8 variants caused immediate disease onset with severe hypoglycemia and were diazoxide-unresponsive, 8 probands had a heterozygous, apparently dominant variant with milder phenotype."
    explanation: Documents both the severe recessive and milder dominant ABCC8 phenotypes.
- name: KCNJ11 (Kir6.2) loss-of-function variants
  gene_term:
    preferred_term: KCNJ11
    term:
      id: hgnc:6257
      label: KCNJ11
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    KCNJ11 encodes Kir6.2, the pore-forming subunit of the beta-cell K-ATP
    channel. It is the second most common cause of medically unresponsive
    hyperinsulinism and, like ABCC8, sits at 11p15.1 — which is why a paternally
    inherited KCNJ11 variant can be unmasked focally by loss of the maternal
    11p15 allele.
  evidence:
  - reference: PMID:25733449
    reference_title: "Molecular mechanisms of congenital hyperinsulinism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive and dominant mutations in ABCC8/KCNJ11 are the commonest cause of medically unresponsive CHI."
    explanation: Confirms ABCC8/KCNJ11 as the commonest cause of diazoxide-unresponsive disease.
  - reference: PMID:39741883
    reference_title: "Congenital hyperinsulinism in the Ukraine: a 10-year national study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in the K-ATP channel genes were the only identified genetic cause of p-CHI (ABCC8 (n=17) and KCNJ11 (n=2))"
    explanation: Confirms KCNJ11 as a causal K-ATP gene in persistent disease in a national cohort.
- name: GLUD1 activating variants
  gene_term:
    preferred_term: GLUD1
    term:
      id: hgnc:4335
      label: GLUD1
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    Dominant activating GLUD1 variants impair GTP inhibition of glutamate
    dehydrogenase, producing leucine/protein-sensitive hyperinsulinism plus the
    persistent mild hyperammonemia of the HI/HA syndrome. Usually
    diazoxide-responsive; dietary protein management is genotype-specific.
  evidence:
  - reference: PMID:21130127
    reference_title: "Two genetic forms of hyperinsulinemic hypoglycemia caused by dysregulation of glutamate dehydrogenase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the hyperinsulinism/hyperammonemia syndrome caused by dominant activating mutations of GLUD1 which interfere with inhibitory regulation by GTP"
    explanation: >-
      Confirms the dominant activating GLUD1 mechanism; loss of GTP inhibition is
      an enzyme-kinetic property demonstrated in vitro, so tagged IN_VITRO.
- name: GCK activating variants
  gene_term:
    preferred_term: GCK
    term:
      id: hgnc:4195
      label: GCK
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    Glucokinase is the beta cell's glucose sensor. Activating variants — and,
    rarely, gene duplication — lower the glucose threshold for insulin secretion,
    resetting the whole system to defend an inappropriately low glucose. Unlike
    most hyperinsulinism, GCK disease can show a ketotic response on prolonged
    fasting, and it is often diazoxide-unresponsive.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "plays a critical role in acting as a gluco-sensor, providing a link between the extracellular plasma glucose concentration and the metabolism of glucose in b-cells"
    explanation: Establishes glucokinase as the beta-cell glucose sensor whose activation lowers the secretion set-point.
  - reference: PMID:39720245
    reference_title: "Case report: Duplication of the GCK gene is a novel cause of nesidioblastosis: evidence from a case with Silver-Russell syndrome-like phenotype related to chromosome 7."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "we found that the duplicated region contained the GCK gene, whose gain-of function variants could cause HH."
    explanation: >-
      A single case linking GCK copy-number gain to adult nesidioblastosis;
      recorded as partial support because the dosage mechanism remains a
      case-level, not established, association.
- name: HADH (SCHAD) loss-of-function variants
  gene_term:
    preferred_term: HADH
    term:
      id: hgnc:4799
      label: HADH
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    Recessive short-chain 3-hydroxyacyl-CoA dehydrogenase deficiency causes
    protein/leucine-sensitive hyperinsulinism through loss of an inhibitory
    SCHAD-glutamate-dehydrogenase interaction. Distinctively it leaves a
    metabolite trail — raised plasma hydroxybutyrylcarnitine and urinary
    3-hydroxyglutarate — so it can be picked up on acylcarnitine and organic-acid
    screening.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Raised plasma hydroxybutyrylcarnitine and urinary 3-hydroxyglutarate are diagnostic of a rare type of congenital HH"
    explanation: Provides the diagnostic metabolite signature of HADH deficiency.
- name: HNF4A loss-of-function variants
  gene_term:
    preferred_term: HNF4A
    term:
      id: hgnc:5024
      label: HNF4A
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    Heterozygous HNF4A loss of function produces a biphasic phenotype —
    macrosomia with diazoxide-responsive neonatal hyperinsulinism, then
    maturity-onset diabetes of the young decades later. A MODY family history is
    a specific clue, and these patients need lifelong diabetes surveillance.
    HNF4A disease has additionally been reported with a glycogenosis-like hepatic
    picture (raised erythrocyte glycogen, elevated transaminases).
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous loss-of-function mutations inHNF4AandHNF1Alead to HH in the newborn period and maturity onset-diabetes (type 1 and 3) later in life"
    explanation: Confirms the biphasic hyperinsulinism-then-MODY phenotype of HNF4A.
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHI due toHNF4Agene has been reported with increased levels of glycogen in erythrocytes, elevated liver transaminases and increased echogenicity on liver ultrasonography, suggesting a glycogenosis-like phenotype"
    explanation: Documents the HNF4A-specific glycogenosis-like hepatic phenotype.
- name: HNF1A loss-of-function variants
  gene_term:
    preferred_term: HNF1A
    term:
      id: hgnc:11621
      label: HNF1A
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    Heterozygous HNF1A loss of function causes the same biphasic
    hyperinsulinism-then-MODY course as HNF4A, with macrosomic birth and mild
    transient to severe diazoxide-responsive hyperinsulinism in the newborn
    period. HNF1A and HNF4A variants may together be a common cause of
    diazoxide-responsive disease.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous loss-of-function mutations inHNF4AandHNF1Alead to HH in the newborn period and maturity onset-diabetes (type 1 and 3) later in life"
    explanation: Confirms the biphasic hyperinsulinism-then-MODY phenotype of HNF1A.
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHI due to mutations in bothHNF1AandHNF4Aare characterized by macrosomic birth and mild transient to severe diazoxide-responsive HH"
    explanation: Confirms macrosomia and diazoxide-responsive hyperinsulinism in HNF1A-related disease.
- name: SLC16A1 (MCT1) promoter gain-of-function variants
  gene_term:
    preferred_term: SLC16A1
    term:
      id: hgnc:10922
      label: SLC16A1
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    SLC16A1 is normally silenced in beta cells precisely so that pyruvate and
    lactate cannot act as secretagogues. Dominant promoter variants de-silence
    MCT1, so exercise-generated monocarboxylates enter the beta cell and trigger
    insulin release — producing hypoglycemia specifically after anaerobic or
    strenuous exercise. Diagnosis uses an exercise or pyruvate load; management is
    largely trigger avoidance.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A pyruvate load or excercise test may precipitate HH and may be used for diagnostic purposes"
    explanation: Confirms the exercise/pyruvate-provoked mechanism of the SLC16A1 subtype.
- name: UCP2 inactivating variants
  gene_term:
    preferred_term: UCP2
    term:
      id: hgnc:12518
      label: UCP2
  association: Causative
  relationship_type: DISPUTED
  features: >-
    UCP2 normally leaks protons across the inner mitochondrial membrane, damping
    ATP generation and thereby restraining glucose-stimulated insulin secretion.
    Inactivating heterozygous variants remove that brake. The gene's role remains
    debated because some reported variants are common polymorphisms, and the
    source review concludes that the role of UCP2 in hyperinsulinism needs
    further investigation.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "mediates proton leak across the inner mitochondrial membrane, thereby inhibiting ATP generation through mitochondrial oxidative metabolism and negatively regulates glucose mediated insulin secretion"
    explanation: >-
      Supports the mitochondrial bioenergetic mechanism, which is established in
      vitro and restated here; recorded as partial because the same review notes
      that the role of UCP2 in hyperinsulinism needs further investigation.
- name: HK1 non-coding de-silencing variants
  gene_term:
    preferred_term: HK1
    term:
      id: hgnc:4922
      label: HK1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    HK1 is normally silenced in the beta cell; a dominant non-coding variant that
    fails to silence it installs a low-Km hexokinase that phosphorylates glucose —
    and therefore drives secretion — at plasma glucose concentrations far below
    the normal threshold. Practically important because a deep non-coding variant
    is invisible to standard exome and panel testing.
  evidence:
  - reference: PMID:38963811
    reference_title: "Clinical and Genetic Characteristics of Congenital Hyperinsulinism in Norway: A Nationwide Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "variants in HADH, HNF4A, KCNJ11, and HK1 were identified in 1 proband each, the latter being noncoding"
    explanation: >-
      Documents an HK1 variant in a nationwide hyperinsulinism cohort and states
      explicitly that it is noncoding, matching the de-silencing mechanism.
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "a report identified a dominant gain-of-function mutation in theHK1gene in a family with “idiopathic hypoglycaemia of infancy”"
    explanation: >-
      Supports the dominant gain-of-function nature of the HK1 lesion; the review
      does not itself specify that the variant is noncoding, so support is partial.
environmental:
- name: Maternal diabetes mellitus
  influences_mechanisms:
  - target: Perinatal Stress Lowering of the Beta-Cell Glucose Threshold
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      This node holds the acquired form of the disorder in which there is no
      germline lesion, and it names maternal diabetes in its own text as one
      of the stresses that resets the beta-cell threshold downward. Recorded
      as direct because the transplacental glucose load acts on the fetal
      islet itself.
    evidence:
    - reference: PMID:29280746
      reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "HH can be transient due to certain risk factors, such as birth asphyxia, intra-uterine growth retardation, maternal diabetes mellitus"
      explanation: >-
        Names maternal diabetes among the risk factors for the transient form,
        which is the acquired perinatal-stress route this node describes
        rather than a genetic one.
  description: >-
    Chronic transplacental glucose exposure over-stimulates the fetal islet, so
    the infant of a diabetic mother is born with an over-primed insulin-secretory
    apparatus that continues secreting once the maternal glucose supply is cut at
    delivery. This is a leading cause of neonatal hyperinsulinemic hypoglycemia
    overall and is usually transient.
  presence: PRESENT
  effect: RISK_FACTOR
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HH can be transient due to certain risk factors, such as birth asphyxia, intra-uterine growth retardation, maternal diabetes mellitus"
    explanation: Names maternal diabetes among the risk factors for transient hyperinsulinemic hypoglycemia.
- name: Perinatal asphyxia and intrauterine growth restriction
  influences_mechanisms:
  - target: Perinatal Stress Lowering of the Beta-Cell Glucose Threshold
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Named at this node alongside maternal diabetes and graded identically to
      it. The cited sentence carries a little more than a listing: it reports
      that these infants can have a severe and protracted form requiring
      diazoxide, which is a statement about the beta-cell state this node
      describes rather than only about risk.
    evidence:
    - reference: PMID:29280746
      reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Some newborns with IUGR and asphyxia have a severe and protracted form of HH which requires treatment with diazoxide"
      explanation: >-
        Reports a severe and protracted form of the disorder in newborns with
        growth restriction and asphyxia, requiring diazoxide. Severity and
        drug requirement speak to the secretory state this node holds.
  description: >-
    Perinatal hypoxic-ischaemic stress and IUGR appear to reset the beta-cell
    glucose threshold downward. Most cases resolve within days, but a protracted
    form requires weeks of diazoxide — and, because these infants are already at
    neurological risk from the asphyxia itself, the added hypoglycemia is
    particularly damaging.
  presence: PRESENT
  effect: RISK_FACTOR
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some newborns with IUGR and asphyxia have a severe and protracted form of HH which requires treatment with diazoxide"
    explanation: Documents IUGR and asphyxia as triggers of severe, protracted hyperinsulinism.
- name: Intrapartum maternal dextrose infusion
  influences_mechanisms:
  - target: Perinatal Stress Lowering of the Beta-Cell Glucose Threshold
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The third of the perinatal stresses named at this node, and the most
      clearly iatrogenic of them. Graded with the other two, since all three
      appear in the same risk-factor sentence and act by the same route of
      driving fetal insulin secretion before delivery.
    evidence:
    - reference: PMID:29280746
      reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the use of intravenous dextrose given during labour"
      explanation: >-
        Names intravenous dextrose given during labour among the risk factors
        for the transient form.
  description: >-
    High-rate maternal dextrose during labour transiently drives fetal insulin
    secretion and can produce neonatal hyperinsulinemic hypoglycemia in the hours
    after delivery.
  presence: PRESENT
  effect: RISK_FACTOR
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the use of intravenous dextrose given during labour"
    explanation: Names intrapartum intravenous dextrose among the transient-HH risk factors.
- name: Prolonged fasting
  exposure_term:
    preferred_term: fasting
    term:
      id: XCO:0000102
      label: fasting
  influences_mechanisms:
  - target: Dual Glucose and Ketone Substrate Deprivation of the Brain
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Fasting does not cause the secretory defect; it converts a defect that
      is always present into clinical harm, which is why this is the one
      exposure in this entry recorded as exacerbating rather than triggering.
      The intervening step is the suppression of both glucose output and
      ketogenesis that this entry models explicitly. The evidence runs in the
      opposite direction, reporting that frequent feeding reduces episodes,
      and it stops at hypoglycaemic episodes rather than reaching the brain
      substrate deprivation at this node, so it is graded partial on both
      counts.
    evidence:
    - reference: PMID:29280746
      reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Frequent feeding with high calorie carbohydrate feeds may reduce the frequency and severity of hypoglycaemic episodes."
      explanation: >-
        Frequent high-calorie carbohydrate feeding reduces the frequency and
        severity of hypoglycaemic episodes. Removing the exposure improves the
        outcome, which is the strongest design available here, but it measures
        episodes rather than this node.
  description: >-
    Fasting is the universal precipitant across every etiology of hyperinsulinemic
    hypoglycemia and is the one exposure that must be actively engineered out of a
    patient's life. GeneReviews states in its Agents/Circumstances to Avoid
    section that prolonged fasting of any sort should be avoided; this drives the
    frequent-feeding, continuous-dextrose and gastrostomy strategies used in
    management, and means that any incidental fast (illness, pre-operative
    starvation) is a hazard requiring a written emergency plan.
  presence: PRESENT
  effect: RISK_FACTOR
  notes: >-
    The "prolonged fasting of any sort should be avoided" wording is from the
    Agents/Circumstances to Avoid section of the GeneReviews chapter body
    (PMID:20301549), which is not reproduced in the cached PubMed abstract; it is
    therefore recorded as provenance rather than quoted as an evidence snippet.
  evidence:
  - reference: PMID:29280746
    reference_title: "Congenital Hyperinsulinism: Diagnosis and Treatment Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Frequent feeding with high calorie carbohydrate feeds may reduce the frequency and severity of hypoglycaemic episodes."
    explanation: >-
      Supports the corollary of fasting avoidance — that frequent feeding reduces
      hypoglycemic episodes.
computational_models:
- name: ABCC8 Loss-of-Function Glucose-Insulin Progression ODE
  description: >-
    Longitudinal ODE with four core states for fasting glucose, fasting insulin,
    beta-cell mass, and beta-cell secretory capacity. Control and heterozygous
    arms add an excess-free-fatty-acid state; the homozygous arm retains four
    states. It extends a Topp-style obesity-diabetes progression model with
    calcium-dependent secretory stress for ABCC8 loss of function. The
    heterozygous R1420H simulation reproduced the reported group-level earlier
    diabetes onset; a separate hypothetical homozygous simulation starts in a
    fasting hyperinsulinemic-hypoglycemic state and predicts subsequent loss of
    beta-cell function.
  model_type: KINETIC
  repository_url: https://doi.org/10.6084/m9.figshare.30117763.v3
  model_id: '57981556'
  base_model: Topp-style obesity-diabetes progression model
  model_software: MATLAB R2023b Update 7 (ode23s); Monolix 2023R1 for population fitting
  model_format: MATLAB .m/.mlx and Monolix .txt/.mmd files
  publication: PMID:41800787
  modeled_mechanisms:
  - target: K-ATP Channel Loss of Function
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      ABCC8 loss of function is imposed indirectly by changing the
      glucose-to-calcium response and calcium-toxicity parameters, thereby testing the
      downstream consequences of persistently elevated cytosolic calcium.
    limitations: >-
      The ODE has no K-ATP channel conductance, nucleotide-gating, membrane
      voltage, trafficking, or allele-specific channel state. The homozygous arm
      does not specify a biallelic variant, and its calcium-response parameters
      are phenomenological rather than fitted to channel measurements from
      infants with congenital hyperinsulinism.
    readouts:
    - name: Calculated cytosolic calcium concentration
      target: K-ATP Channel Loss of Function
      direction: INCREASED
      interpretation: >-
        Increased cytosolic calcium is the model's surrogate for severely
        impaired or nonfunctional K-ATP channels, not a channel-current readout.
      evidence:
      - reference: PMID:41800787
        reference_title: "Is high insulin protective or detrimental? Mathematical modeling reveals the base of the iceberg."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          We modeled the homozygous ABCC8 variant by increasing cytosolic calcium
          concentration and amplifying Ca2+-dependent downregulation
        explanation: >-
          States the parameter-level perturbation used to represent the
          homozygous loss-of-function condition.
    evidence:
    - reference: PMID:41800787
      reference_title: "Is high insulin protective or detrimental? Mathematical modeling reveals the base of the iceberg."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        We modeled the homozygous ABCC8 variant by increasing cytosolic calcium
        concentration and amplifying Ca2+-dependent downregulation
      explanation: >-
        Establishes that the disease perturbation acts through a modeled
        calcium-response surrogate.
  - target: Dysregulated Beta-Cell Insulin Secretion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The homozygous virtual subject begins with high fasting insulin and low
      fasting glucose, then the calcium-stress terms drive declining secretory
      capacity and beta-cell mass across the simulated trajectory.
    limitations: >-
      The infant hyperinsulinemic state is imposed through initial conditions
      selected to produce a near-steady starting state; it is not fitted to an
      infant time series or independently validated. The model resolves only
      fasting, years-scale dynamics and omits meals, incretins, glucagon,
      pulsatile secretion, focal disease, and acute fasting responses.
    readouts:
    - name: Fasting serum insulin concentration
      target: Dysregulated Beta-Cell Insulin Secretion
      direction: INCREASED
      interpretation: >-
        The hypothetical homozygous trajectory is initialized at 56.5 uU/mL;
        this supports a modeled hyperinsulinemic state but is not an independently
        predicted infant baseline.
      evidence:
      - reference: PMID:41800787
        reference_title: "Is high insulin protective or detrimental? Mathematical modeling reveals the base of the iceberg."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          As shown in Fig. 7a, b, this individual exhibits persistent
          hyperinsulinemic hypoglycemia in infancy.
        explanation: >-
          Reports the simulated early-life insulin/glucose state represented by
          this readout.
    - name: Beta-cell secretory capacity
      target: Dysregulated Beta-Cell Insulin Secretion
      direction: DECREASED
      interpretation: >-
        Declining maximal secretory capacity is a model prediction for the
        transition from early hypersecretion to later beta-cell failure.
      evidence:
      - reference: PMID:41800787
        reference_title: "Is high insulin protective or detrimental? Mathematical modeling reveals the base of the iceberg."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          To mitigate hypoglycemia, beta-cells downregulate both mass expansion
          and secretory capacity over time
        explanation: >-
          Identifies the two declining beta-cell states in the homozygous
          simulation.
    evidence:
    - reference: PMID:41800787
      reference_title: "Is high insulin protective or detrimental? Mathematical modeling reveals the base of the iceberg."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        As shown in Fig. 7a, b, this individual exhibits persistent
        hyperinsulinemic hypoglycemia in infancy.
      explanation: >-
        Supports treating the hypothetical homozygous simulation as a partial
        representation of dysregulated insulin secretion.
  - target: Insulin-Driven Glucose Disposal and Suppressed Hepatic Glucose Output
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The glucose equation includes insulin-dependent glucose uptake, dynamic
      hepatic glucose production, and an insulin-sensitivity term; together they
      produce the low fasting-glucose state in the homozygous simulation.
    limitations: >-
      Hepatic glucose production and glucose disposal are algebraic model fluxes,
      not measured infant readouts. The model does not resolve organ-specific
      glucose uptake, glycogen turnover, gluconeogenic substrates,
      counter-regulation, glucose-infusion requirements, or acute fasting dynamics.
    readouts:
    - name: Fasting plasma glucose concentration
      target: Insulin-Driven Glucose Disposal and Suppressed Hepatic Glucose Output
      direction: DECREASED
      interpretation: >-
        The homozygous virtual subject is initialized at 44.3 mg/dL and remains
        hypoglycemic early in the simulation; the initial value is imposed, not
        prospectively inferred from pediatric data.
      evidence:
      - reference: PMID:41800787
        reference_title: "Is high insulin protective or detrimental? Mathematical modeling reveals the base of the iceberg."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          As shown in Fig. 7a, b, this individual exhibits persistent
          hyperinsulinemic hypoglycemia in infancy.
        explanation: >-
          Reports the low-glucose state generated over the early-life portion of
          the homozygous trajectory.
    - name: Hepatic glucose production rate
      target: Insulin-Driven Glucose Disposal and Suppressed Hepatic Glucose Output
      interpretation: >-
        HGP is an explicit internal flux in the fasting-glucose equation; its
        direction relative to a congenital-hyperinsulinism comparator was not
        reported or validated against tracer measurements.
      evidence:
      - reference: PMID:41800787
        reference_title: "Is high insulin protective or detrimental? Mathematical modeling reveals the base of the iceberg."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: "In Eq. 1, HGP represents hepatic glucose production rate."
        explanation: Identifies HGP as an explicit quantity in the glucose equation.
    evidence:
    - reference: PMID:41800787
      reference_title: "Is high insulin protective or detrimental? Mathematical modeling reveals the base of the iceberg."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The term SGG denotes insulin-independent glucose uptake, while
        S(X,AGE,I)IG represents insulin-dependent glucose uptake.
      explanation: >-
        Establishes that the fasting-glucose equation explicitly includes an
        insulin-dependent disposal term.
  variables:
  - name: Fasting plasma glucose concentration
    dataset_identifier: G
    description: Longitudinal fasting-glucose state.
    unit: mg/dL
  - name: Fasting serum insulin concentration
    dataset_identifier: I
    description: Longitudinal fasting-insulin state.
    unit: uU/mL
  - name: Beta-cell mass
    dataset_identifier: beta
    description: Modeled pancreatic beta-cell mass.
    unit: mg
  - name: Beta-cell secretory capacity
    dataset_identifier: sigma
    description: Maximal insulin secretory capacity per unit beta-cell mass.
    unit: uU/mL/mg/day
  - name: Cytosolic calcium concentration
    dataset_identifier: Ca
    description: Algebraic calcium-response quantity mediating secretion and toxicity.
    unit: nM
  - name: Hepatic glucose production rate
    dataset_identifier: HGP
    description: Dynamic hepatic input in the fasting-glucose equation.
    unit: mg/dL/day
  - name: Excess free-fatty-acid burden
    dataset_identifier: X
    description: >-
      Fifth longitudinal state in the control and heterozygous arms; omitted
      from the homozygous simulation.
  findings:
  - statement: >-
      The heterozygous R1420H extension reproduced the reported group-level
      seven-year earlier onset of diabetes.
    evidence:
    - reference: PMID:41800787
      reference_title: "Is high insulin protective or detrimental? Mathematical modeling reveals the base of the iceberg."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "The model successfully reproduces the observed 7-year earlier diabetes onset"
      explanation: >-
        States the timing result used to evaluate the heterozygous extension.
  - statement: >-
      The hypothetical homozygous simulation begins with persistent infant
      hyperinsulinemic hypoglycemia and predicts later loss of beta-cell function.
    evidence:
    - reference: PMID:41800787
      reference_title: "Is high insulin protective or detrimental? Mathematical modeling reveals the base of the iceberg."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        As shown in Fig. 7a, b, this individual exhibits persistent
        hyperinsulinemic hypoglycemia in infancy.
      explanation: >-
        Supports the initialized early-life state; it is not evidence of
        pediatric calibration or prospective validation.
    - reference: PMID:41800787
      reference_title: "Is high insulin protective or detrimental? Mathematical modeling reveals the base of the iceberg."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        However, sustained intracellular Ca2+ levels (Fig. S4a) continue to
        impair β-cell function, eventually leading to insulin deficiency in the
        absence of insulin resistance.
      explanation: >-
        Supports the predicted later loss of beta-cell function in the
        homozygous simulation.
  - statement: >-
      Simulated benefit from calcium-reducing treatment depended on dose and
      treatment timing and was not intended to predict individual patient outcomes.
    evidence:
    - reference: PMID:41800787
      reference_title: "Is high insulin protective or detrimental? Mathematical modeling reveals the base of the iceberg."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The simulations also support Ca2+-reducing therapies, but their efficacy
        depends critically on both timing and dosage.
      explanation: >-
        States the conditional treatment result without treating it as validated
        therapeutic efficacy.
    - reference: PMID:41800787
      reference_title: "Is high insulin protective or detrimental? Mathematical modeling reveals the base of the iceberg."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        our simulations are not intended to predict individual patient outcomes
      explanation: >-
        Explicitly limits the treatment simulations to mechanistic, rather than
        patient-specific, prediction.
  evidence:
  - reference: PMID:41800787
    reference_title: "Is high insulin protective or detrimental? Mathematical modeling reveals the base of the iceberg."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      We extended the model to study a subset of the population carrying an
      ABCC8 loss-of-function variant linked to primary rather than compensatory
      hyperinsulinemia.
    explanation: >-
      Establishes the disease-relevant ABCC8 extension of the longitudinal ODE.
  notes: >-
    The reusable artifact is Figshare record 30117763 version 3 under CC BY 4.0;
    Supplemental Code File S4 is file 57981556 (33,204,094 bytes; MD5
    a978e3b86bc3ed537d2754dfc002d1e6). It contains MATLAB scripts and Live
    Scripts for the heterozygous, homozygous, and treatment simulations. Static
    curator inspection confirmed four core states plus an excess-FFA state in
    the control and heterozygous arms, with a four-state homozygous ode23s
    implementation. The code was not executed because neither MATLAB nor Octave
    was available. The base
    progression model was fitted to four-dimensional individualized longitudinal
    data from Southwest Native Americans and checked with modified data-partition
    validation; those results must not be transferred to the hypothetical
    homozygous infant arm. That arm was constrained by case literature but has no
    pediatric longitudinal calibration cohort, begins from selected hypoglycemic
    and hyperinsulinemic initial conditions, and is not a patient-specific digital
    twin. It covers only the ABCC8/K-ATP subtype and omits GLUD1, GCK, HADH,
    perinatal-stress and focal-disease mechanisms, ketones, lipolysis, brain injury,
    meal dynamics, and prospective outcome validation. The publication states
    that its treatment simulations are not intended to predict individual
    outcomes.
- name: KATP-HI Whole-Body Insulin and C-Peptide Kinetics Model
  description: >-
    Fitted kinetic model used in a crossover study of exendin-(9-39) in children
    with congenital hyperinsulinism. A one-compartment whole-body insulin model
    is coupled to a two-compartment C-peptide model to reconstruct minute-scale
    endogenous beta-cell secretion and estimate fractional insulin clearance
    and first-pass hepatic insulin survival.
  model_type: KINETIC
  base_model: Watanabe-Bergman insulin kinetics and two-compartment C-peptide kinetics
  model_software: Not reported for kinetic fitting; Stata 16MP for statistical analyses
  model_format: Differential equations in article; no executable model archive
  publication: PMID:35416981
  modeled_mechanisms:
  - target: Dysregulated Beta-Cell Insulin Secretion
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      C-peptide kinetics reconstruct the endogenous insulin secretion rate in
      children with KATP-HI during vehicle and exendin-(9-39) mixed-meal and
      protein challenges.
    limitations: >-
      The model is a post hoc kinetic reconstruction, not an ABCC8/KCNJ11
      electrophysiology model or prospective drug-response simulator. Only eight
      children completed the meal/protein crossover, small secretion changes may
      have been underpowered, and there was no healthy-child control group. The
      equations omit exendin pharmacokinetics, K-ATP current, glucagon dynamics,
      and endogenous glucose production.
    readouts:
    - name: Model-estimated insulin secretion rate
      target: Dysregulated Beta-Cell Insulin Secretion
      direction: UNCHANGED
      interpretation: >-
        Integrated secretion was not significantly different between
        exendin-(9-39) and vehicle during either modeled challenge, despite
        treatment-associated changes in circulating insulin kinetics.
      evidence:
      - reference: PMID:35416981
        reference_title: Exendin-(9-39) Effects on Glucose and Insulin in Children With Congenital Hyperinsulinism During Fasting and During a Meal and a Protein Challenge.
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          the model-estimated AUC insulin secretion rate, which was not
          significantly different during exendin-(9-39) compared with vehicle
          infusion
        explanation: >-
          Reports the direction of the model-derived secretion comparison.
    evidence:
    - reference: PMID:35416981
      reference_title: Exendin-(9-39) Effects on Glucose and Insulin in Children With Congenital Hyperinsulinism During Fasting and During a Meal and a Protein Challenge.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The model of whole-body insulin kinetics was well resolved for all
        subjects with both tests (MMTT and OPTT)
      explanation: >-
        Reports successful resolution of the fitted kinetic model in the two
        challenge protocols.
  variables:
  - name: Plasma insulin concentration
    dataset_identifier: I(t)
    description: Measured and fitted whole-body plasma insulin concentration.
    unit: pmol/L
  - name: Endogenous insulin secretion rate
    dataset_identifier: Ra(t)
    description: Minute-scale secretion reconstructed from C-peptide kinetics.
    unit: pmol/L/min
  - name: Fractional whole-body insulin clearance
    dataset_identifier: pI
    description: Subject-specific insulin fractional clearance-rate estimate.
    unit: 1/min
  - name: First-pass hepatic insulin survival
    dataset_identifier: pfp
    description: Fraction of secreted insulin surviving first-pass hepatic extraction.
    unit: fraction
  findings:
  - statement: >-
      Insulin kinetic parameters were uniquely estimated with standardized
      residuals centered near zero and within two standard deviations.
    evidence:
    - reference: PMID:35416981

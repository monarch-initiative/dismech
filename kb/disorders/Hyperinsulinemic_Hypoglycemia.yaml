- name: Focal Lesion Formation by Paternal K-ATP Variant and Somatic 11p15 Maternal Loss
  biological_scale: CELLULAR
  role: trigger
  description: >
    Focal hyperinsulinism is generated by two hits at the same locus. A
    paternally inherited recessive ABCC8 or KCNJ11 variant (both genes sit at
    11p15.1) is clinically silent while the maternal allele is present. In a
    single pancreatic progenitor a post-zygotic mitotic recombination event
    replaces the maternal 11p15 region with a second copy of the paternal one
    (segmental paternal isodisomy), rendering the K-ATP variant homozygous in
    that clone while parental heterozygosity is preserved everywhere else. The
    same event leaves the neighbouring 11p15 imprinted domain paternal-only —
    doubling active IGF2 and removing the growth-suppressing maternal H19 and
    CDKN1C (p57) contributions — so the
    affected clone also proliferates, producing a discrete nodule of
    hyperfunctional, hypersecreting beta cells embedded in a normal pancreas.
    Every clinically decisive feature of focal disease follows from this
    architecture: it is anatomically bounded, so 18F-DOPA PET can localise it and
    resecting it is curative; and it is sporadic in inheritance terms, because
    the somatic hit is not transmitted.

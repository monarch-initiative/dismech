- name: Dual Glucose and Ketone Substrate Deprivation of the Brain
  biological_scale: ORGANISM
  role: central_effector
  description: >
    The mechanistic keystone of the disorder, and the explicit reason
    hyperinsulinemic hypoglycemia injures the brain more than other hypoglycemias
    of equivalent glucose depth. The neonatal and infant brain has a
    disproportionately high obligate glucose requirement, and its physiological
    safeguard against a falling glucose is to switch to ketone bodies. In
    hyperinsulinemic hypoglycemia both fuels fail simultaneously and for the same
    reason: the excess insulin that lowers glucose also abolishes the ketone
    supply. Cerebral energy failure therefore begins earlier, deepens faster, and
    is less forgiving of diagnostic delay than in ketotic hypoglycemias, where a
    partial ketone rescue buffers the brain. This node is also the therapeutic
    rationale for the (still experimental) strategy of supplying exogenous
    beta-hydroxybutyrate, and the rationale for proposals to screen newborns by
    measuring ketones rather than glucose alone.

discussions:
- discussion_id: coq10_disease_modification_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired Coenzyme Q Biosynthesis
  prompt: >-
    Does coenzyme Q10 supplementation modify the optic neuropathy or neurological
    course of RTN4IP1-related disease, as opposed to the musculoskeletal
    improvement reported in a single case?
  rationale: >-
    RTN4IP1 deficiency impairs CoQ biosynthesis and CoQ rescues model-organism
    phenotypes, but the only human evidence (PMID:41609474) is a single case with
    musculoskeletal outcomes; whether CoQ10 crosses to the retina/CNS or alters
    visual or neurological progression is unknown.


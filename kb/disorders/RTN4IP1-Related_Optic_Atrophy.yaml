variants:
- name: RTN4IP1 c.475G>T (p.Val159Phe)
  description: >-
    Homozygous missense founder variant identified in two consanguineous
    northern-Saudi tribal families with intellectual disability, encephalopathy,
    ataxia, optic atrophy, and seizures. Val159 lies in the ADH-N domain; the
    substitution is predicted to destabilize the protein and render it prone to
    degradation.
  gene:
    preferred_term: RTN4IP1
    term:
      id: hgnc:18647
      label: RTN4IP1
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:36231115
    reference_title: "A Novel Homozygous Founder Variant of RTN4IP1 in Two Consanguineous Saudi Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe two unrelated consanguineous families from the northern region of Saudi Arabia harboring a missense variant (RTN4IP1:NM_032730.5; c.475G<T, p.Val159Phe) in the gene. Clinically affected individuals presented with intellectual disability, encephalopathy, ataxia, optic atrophy, and seizures."
    explanation: Reports the homozygous founder missense variant and its associated syndromic phenotype.

treatments:
- name: Coenzyme Q10 Supplementation
  description: >-
    Because RTN4IP1 deficiency impairs coenzyme Q biosynthesis, CoQ10
    supplementation is a mechanistically rational, experimental therapy. Evidence
    in RTN4IP1 disease is limited to a single case report of symptomatic
    (musculoskeletal) improvement, supported by rescue of the CoQ defect by CoQ
    supplementation in a Drosophila model; it is not an established
    disease-modifying treatment for the optic neuropathy.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Impaired Coenzyme Q Biosynthesis
    treatment_effect: RESTORES
    description: >-
      CoQ10 supplementation aims to bypass the defective RTN4IP1-dependent CoQ
      biosynthesis by supplying exogenous coenzyme Q.
    evidence:
    - reference: PMID:37884807
      reference_title: "Mitochondrial matrix RTN4IP1/OPA10 is an oxidoreductase for coenzyme Q synthesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "muscle-specific knockdown of dRtn4ip1 in flies resulted in impaired muscle function, which was reversed by dietary supplementation with soluble CoQ"
      explanation: Model-organism rescue by CoQ supplementation supports targeting the CoQ-biosynthesis defect.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: coenzyme Q10
      term:
        id: CHEBI:46245
        label: coenzyme Q10
  evidence:
  - reference: PMID:41609474
    reference_title: "RTN4IP1 mutation and endocrine failure: clinical features and possible benefits of coenzyme Q10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "after six months of daily 200 mg CoQ10, the patient showed marked reductions in pain (BPI 4 → 0.8; -80%) and muscle-damage markers (CPK 254 → 110 U/L) together with gains in grip strength (+49%) and lower-extremity function (LEFS 31 → 60; +94%)"
    explanation: Single-case evidence of symptomatic benefit from CoQ10 in an RTN4IP1 patient (musculoskeletal outcomes, not visual).
  - reference: PMID:37884807
    reference_title: "Mitochondrial matrix RTN4IP1/OPA10 is an oxidoreductase for coenzyme Q synthesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "muscle-specific knockdown of dRtn4ip1 in flies resulted in impaired muscle function, which was reversed by dietary supplementation with soluble CoQ"
    explanation: Model-organism rescue of the RTN4IP1 phenotype by CoQ supplementation provides the mechanistic rationale.

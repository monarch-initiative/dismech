prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare; no robust population prevalence or incidence has been
    established. Only isolated families and small cohorts have been reported
    (including 25 probands across 9 publications curated by ClinGen), with
    founder alleles described in Roma and northern Saudi tribal populations.
  evidence:
  - reference: CGGV:assertion_d7edeea3-e12a-470a-83d3-05f950ca74e5-2024-06-20T160000.000Z
    reference_title: "RTN4IP1 / optic atrophy 10 with or without ataxia, intellectual disability, and seizures (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This curation includes eighteen suspected disease-causing variants, including missense, nonsense, frameshift, splicing defect, and deletion variants, which have been reported in 25 probands in 9 publications"
    explanation: ClinGen's 2024 curation documents 25 probands across 9 publications, confirming literature-level ultra-rarity.
  - reference: PMID:29181510
    reference_title: "Neurologic Phenotypes Associated With Mutations in RTN4IP1 (OPA10) in Children and Young Adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study involved 12 individuals from 11 families with severe central nervous system diseases and optic atrophy."
    explanation: Reflects the small number of reported cases (literature-based rarity).

pathophysiology:
- name: RTN4IP1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    RTN4IP1 encodes a mitochondrial matrix protein — first identified as the
    Nogo/RTN4-interacting mitochondrial protein (NIMP) — with a NAD(P)H-dependent
    quinone oxidoreductase activity. Biallelic loss-of-function variants abolish
    or severely reduce this activity (often with loss of the protein itself),
    the primary molecular lesion in OPA10.
  gene:
    preferred_term: RTN4IP1
    term:
      id: hgnc:18647
      label: RTN4IP1
  genetic_context:
    genes:
    - preferred_term: RTN4IP1
      term:
        id: hgnc:18647
        label: RTN4IP1
    allele_type: biallelic missense, nonsense, frameshift, splice-site, and deletion alleles
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: NAD(P)H-dependent quinone oxidoreductase activity
    modifier: DECREASED
    term:
      id: GO:0016655
      label: oxidoreductase activity, acting on NAD(P)H, quinone or similar compound as acceptor
  cellular_components:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  downstream:
  - target: Impaired Coenzyme Q Biosynthesis
    causal_link_type: DIRECT
    description: >-
      Loss of the RTN4IP1 oxidoreductase impairs coenzyme Q biosynthesis
      (RTN4IP1 regulates the O-methyltransferase activity of COQ3).
    evidence:
    - reference: PMID:40859035
      reference_title: "RTN4IP1 is required for the final stages of mitochondrial complex I assembly and CoQ biosynthesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "RTN4IP1 patient fibroblasts also exhibited defective coenzyme Q biosynthesis, substantiating a second function of RTN4IP1."
      explanation: Patient fibroblasts lacking functional RTN4IP1 show defective CoQ biosynthesis.
  - target: Impaired Complex I Assembly and Respiratory-Chain Dysfunction
    causal_link_type: DIRECT
    description: >-
      RTN4IP1 is a bona fide late-stage complex I assembly factor; its loss
      causes a complex I assembly defect.
    evidence:
    - reference: PMID:40859035
      reference_title: "RTN4IP1 is required for the final stages of mitochondrial complex I assembly and CoQ biosynthesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "RTN4IP1 deficiency causes a CI assembly defect in both patient fibroblasts and knockout cells, and report that RTN4IP1 is a bona fide CI assembly factor."
      explanation: Establishes RTN4IP1 loss as the direct cause of the complex I assembly defect.
  evidence:
  - reference: PMID:26593267
    reference_title: "Recessive Mutations in RTN4IP1 Cause Isolated and Syndromic Optic Neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified mutations in RTN4IP1, which encodes a mitochondrial ubiquinol oxydo-reductase"
    explanation: Original gene-discovery paper identifying RTN4IP1 as the OPA10 disease gene and a mitochondrial oxidoreductase.
  - reference: PMID:37884807
    reference_title: "Mitochondrial matrix RTN4IP1/OPA10 is an oxidoreductase for coenzyme Q synthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "is enriched in the mitochondrial matrix of muscle tissues and is an NADPH oxidoreductase"
    explanation: Defines RTN4IP1/OPA10 biochemically as a mitochondrial matrix NADPH oxidoreductase.
  - reference: PMID:12067236
    reference_title: "Identification and characterization of a novel Nogo-interacting mitochondrial protein (NIMP)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We identified a novel mitochondrial protein designated Nogo-interacting mitochondrial protein (NIMP) in a screen of an adult human brain cDNA library."
    explanation: Original identification of the protein (NIMP/RTN4IP1) as a mitochondrial RTN4/Nogo-interacting protein.

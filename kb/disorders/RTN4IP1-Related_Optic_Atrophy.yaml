name: RTN4IP1-Related Optic Atrophy
creation_date: "2026-08-14T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: optic atrophy 10 with or without ataxia, intellectual disability, and seizures
  term:
    id: MONDO:0020737
    label: optic atrophy 10 with or without ataxia, intellectual disability, and seizures
description: >-
  RTN4IP1-related optic atrophy (optic atrophy 10, OPA10; OMIM 616732) is an
  autosomal recessive mitochondrial optic neuropathy caused by biallelic
  loss-of-function variants in RTN4IP1. RTN4IP1 encodes a mitochondrial matrix
  NAD(P)H-dependent oxidoreductase (originally identified as the
  Nogo/RTN4-interacting mitochondrial protein, NIMP) with dual roles in coenzyme Q
  (ubiquinone) biosynthesis and in the terminal stages of mitochondrial
  respiratory-chain complex I assembly. Deficiency impairs mitochondrial
  bioenergetics, causing selective degeneration of retinal ganglion cells and
  early-onset, bilateral optic atrophy with reduced visual acuity. The clinical
  spectrum ranges from isolated early-onset optic atrophy to a severe syndromic
  encephalopathy in which optic atrophy is accompanied by neurological "plus"
  features — intellectual disability, cerebellar ataxia, seizures (including
  epileptic encephalopathy), a movement disorder, deafness, and
  elevated lactate — the most severe cases being fatal in early childhood.
synonyms:
- OPA10
- RTN4IP1-related optic atrophy with or without neurological features

parents:
- Hereditary Optic Atrophy


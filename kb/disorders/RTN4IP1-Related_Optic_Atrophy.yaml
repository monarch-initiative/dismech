- name: Ophthalmologic multimodal imaging and full-field electroretinography
  description: >-
    Beyond fundoscopy (optic disc pallor) and visual acuity, widefield fundus
    autofluorescence and temporal macular SD-OCT scans detect the associated
    rod-cone dystrophy, and full-field electroretinography (ISCEV protocol)
    demonstrates reduced rod b-wave amplitudes in most patients. These are
    recommended in the work-up of RTN4IP1 optic neuropathy.
  diagnosis_term:
    preferred_term: Optical Coherence Tomography
    term:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical manifestations that have never been previously reported include morbid obesity, pancytopenia with severe infections, diabetes mellitus, cirrhosis, and renal failure, leading to deaths in their early 30s.
    explanation: The single-family report of the systemic features.
- kind: KNOWLEDGE_GAP
  discussion_id: acbd6_no_disease_specific_treatment
  prompt: Does any intervention change the course of ACBD6-related disease?
  rationale: Reported management is symptomatic. Levodopa was tried in two individuals with minimal response and no other antiparkinsonian or anti-dystonic drug had been tried. The authors raise dietary myristic acid supplementation as a possibility on the basis of the labelling data; it has not been tested in an animal model or in patients.
  attaches_to:
  - treatments#

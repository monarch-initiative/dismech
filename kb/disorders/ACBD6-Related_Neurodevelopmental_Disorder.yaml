  prompt: How much of the Xenopus tropicalis crispant phenotype reflects the human disease mechanism?
  rationale: The crispants die at gastrulation in large numbers, a phenotype with no human counterpart, and survivors are selected for high mosaicism. Their N-myristoylation labelling falls where that of zebrafish and patient fibroblasts rises, and the authors attribute this to confounding developmental failure.

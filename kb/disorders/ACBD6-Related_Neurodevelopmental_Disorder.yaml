- name: Dysregulated Protein N-Myristoylation
  description: Protein N-myristoylation is altered in ACBD6-deficient cells, but the two methods used disagree on direction. Radiolabelling in fibroblasts from two patients, and in a knockout cell line, showed reduced myristoylation and greater sensitivity to a myristoyl-CoA competitor. Chemical proteomics with the alkyne analogue YnMyr in fibroblasts from one patient showed higher labelling of 68 co-translationally and 18 post-translationally N-myristoylated proteins; zebrafish crispants also showed an overall increase with a reduced subset, and Xenopus crispants a marked reduction. The authors of the cohort study raise increased analogue uptake through lipid salvage as one explanation for higher labelling. Which substrates matter for the nervous system is not known, so this node has no downstream edge.

- name: ACBD6 Protein Deficiency
  description: Patient fibroblasts lack normal ACBD6 protein. ACBD6 is a cytosolic and nuclear acyl-CoA-binding protein whose ankyrin-repeat module interacts with N-myristoyltransferase and protects it from competing acyl-CoAs. ACBD6 is not peroxisomal, and patient fibroblasts show no peroxisomal abnormality, which separates this disease from ACBD5 deficiency.
  biological_scale: MOLECULAR
  node_class: PROTEIN_ABUNDANCE_LOSS

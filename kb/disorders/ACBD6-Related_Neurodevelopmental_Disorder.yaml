  presence: Biallelic variants, 18 of 20 predicted loss-of-function (nonsense, frameshift, splice-site, exon 7 deletion); one missense, p.(Asp201Gly), and one in-frame duplication, p.(Asn219dup)
  notes: ACBD6 has an N-terminal acyl-CoA-binding domain and C-terminal ankyrin repeats. Recurrent variants were seen across unrelated families, for example c.82dupG, p.(Val28GlyfsTer6), and c.484_488delATATT, p.(Ile162Ter). The missense variant p.(Asp201Gly) and the nonsense variant p.(Glu63Ter) both failed to rescue the zebrafish eye-size phenotype. No external gene-disease validity classification is recorded, because the committed ClinGen export has no ACBD6 row. The 2020 biochemical study predates the disease definition and describes the homozygous variants as not yet associated with a disease.
  evidence:
  - reference: PMID:37951597

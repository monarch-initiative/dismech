diagnosis:
- name: Exome sequencing
  description: The diagnosis is molecular. All 28 families in the defining cohort were diagnosed by whole-exome sequencing of the proband, which found biallelic ACBD6 variants, with Sanger sequencing of available relatives to confirm segregation. No biochemical test is established; the peroxisomal and N-myristoylation findings in patient fibroblasts are research observations.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: Biallelic ACBD6 variants, most of them loss-of-function.
  evidence:
  - reference: PMID:37951597
    reference_title: Bi-allelic ACBD6 variants lead to a neurodevelopmental syndrome with progressive and complex movement disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using genomic DNA from whole blood samples of the probands from the 28 unrelated families, whole-exome sequencing (WES) was performed at 10 different centres worldwide using methods specified in Supplementary Table 1.
    explanation: Exome sequencing of the proband was the diagnostic method in every family.
  - reference: PMID:37951597

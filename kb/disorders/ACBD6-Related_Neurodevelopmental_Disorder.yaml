pathophysiology:
- name: Biallelic ACBD6 Loss-of-Function Variant
  description: Both ACBD6 alleles carry a pathogenic variant. Of the 20 distinct variants in the cohort, 18 are predicted loss-of-function (nonsense, frameshift, splice-site, or a deletion removing exon 7), one is a missense change in the ankyrin-repeat region, p.(Asp201Gly), and one is an in-frame duplication, p.(Asn219dup). All affected individuals in the cohort were homozygous.

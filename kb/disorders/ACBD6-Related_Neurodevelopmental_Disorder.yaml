    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we identified 45 affected individuals from 28 unrelated families (consanguinity 93%) with bi-allelic pathogenic, predominantly loss-of-function (18/20) variants in ACBD6
    explanation: Defines the gene-disease relationship in 45 individuals from 28 families.
  - reference: PMID:36457943

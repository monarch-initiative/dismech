  - reference: PMID:37951597
    reference_title: Bi-allelic ACBD6 variants lead to a neurodevelopmental syndrome with progressive and complex movement disorders.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: suggesting exogenous myristic acid supplementation through dietary supplementation might have the potential to reduce the burden of ACBD6 deficiency
    explanation: The suggestion is drawn from the zebrafish labelling data and is untested.
    directness: INDIRECT

parents:
- Neurodevelopmental Disorder
description: "An autosomal recessive disorder caused by biallelic, mostly loss-of-function variants in ACBD6 (MONDO:0968976, OMIM 620785). It begins in infancy with moderate-to-severe global developmental delay and intellectual disability with very limited speech, and a complex movement disorder develops on top of it: dystonia, typically truncal with a stooped and laterally flexed posture, together with mild cerebellar ataxia, limb spasticity, jerky tremor of the arms and head, and, from the second decade, parkinsonism. Motor and cognitive abilities deteriorate with age. Facial dysmorphism without a recognizable gestalt, oculomotor and behavioural abnormalities, microcephaly and seizures are common, and brain MRI usually shows hypoplasia or agenesis of the corpus callosum and anterior commissure. ACBD6 is an acyl-CoA-binding protein that supports protein N-myristoylation by N-myristoyltransferases; patient cells lack the protein and show altered N-myristoylation, but how this leads to the neurological disease is not known. The disease was defined in a 2024 cohort of 45 individuals from 28 families. There is no disease-specific treatment."
notes: "Name. The MONDO label and OMIM title, \"neurodevelopmental disorder with progressive movement abnormalities\" (NEDPM), describe a phenotype that a patient could have without an ACBD6 variant, so the entry is named for the gene. The cohort paper (PMID:37951597) calls the condition \"ACBD6-related disease\" throughout, and the earlier case report (PMID:36457943) uses \"ACBD6-associated NDDs\" and \"ACBD6-Associated Syndrome\"; the entry name joins the gene to the phenotype word those sources use. The MONDO label, the abbreviation NEDPM (taken from the MedGen record 1861832 for this OMIM entry) and the literature forms are kept as synonyms. Lump or split. One gene, one MONDO term and one OMIM entry, with no reported subtypes; this is a single disease entry. GeneReviews. No GeneReviews chapter covers this disease or gene: just check-genereviews --online, run on 2026-11-21 against the Bookshelf index snapshot of 2026-09-10 with a live PubMed search, reports NO_CHAPTER. The phenotype baseline is the 45-patient cohort (PMID:37951597), read from the PMC full text, which is where every frequency in this entry comes from. Frequencies are given per feature with the denominators the paper reports, which differ between features because not every individual was assessed for each. Systemic features. Pancytopenia, type 2 diabetes, cirrhosis and end-stage renal disease come from a single family (PMID:36457943, Family 28 of the cohort) and are recorded without a frequency; whether they are part of the disease is an open question recorded under discussions. Mechanism. The pathophysiology stops short of a full chain on purpose. The sources establish the variant, the loss of protein, and altered N-myristoylation and lipid acylation in cells, and separately establish brain malformation and a progressive course in patients and animal models. They do not establish which molecular change produces the brain phenotype, so the cellular nodes are not wired to the tissue nodes. Seizures, ataxia, spasticity, tremor and the behavioural features have no mechanism node for the same reason. The committed ClinGen gene-validity export (cache/clingen/gene_validity.csv) has no ACBD6 row, so no validity tier is recorded."

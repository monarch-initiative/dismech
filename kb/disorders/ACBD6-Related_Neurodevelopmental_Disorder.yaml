  - target: Dysregulated Protein N-Myristoylation
    causal_link_type: DIRECT
    description: Without ACBD6, N-myristoyltransferase is unprotected from competing acyl-CoA species and protein N-myristoylation is altered.
    evidence:
    - reference: PMID:32108178
      reference_title: "Requirement of the acyl-CoA carrier ACBD6 in myristoylation of proteins: Activation by ligand binding and protein interaction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Skin-derived fibroblasts of two unrelated individuals with neurodevelopmental disorder and carrying loss of function mutations in the ACBD6 gene were deficient in protein N-myristoylation.
      explanation: ACBD6-deficient patient fibroblasts were deficient in protein N-myristoylation.
    - reference: PMID:36551154
      reference_title: Dual Role of ACBD6 in the Acylation Remodeling of Lipids and Proteins.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The absence of the ACBD6/NMT complex in ACBD6.KO cells increased the sensitivity of the cells to competitors and significantly reduced myristoylation of proteins.
      explanation: An engineered ACBD6 knockout cell line shows the same dependence.
  - target: Reduced Lysophospholipid Acylation
    causal_link_type: DIRECT
    description: ACBD6-bound acyl-CoAs are acyl donors for lysophospholipid acyltransferases, and their acylation reactions fall when ACBD6 is absent.
    evidence:
    - reference: PMID:36551154
      reference_title: Dual Role of ACBD6 in the Acylation Remodeling of Lipids and Proteins.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Whereas the formation of acyl-CoAs was not altered in ACBD6.KO cells, lipid acylation processes were significantly reduced.
      explanation: Lipid acylation was reduced in ACBD6 knockout cells although acyl-CoA formation was unchanged.
  - target: Abnormal Brain Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Loss of acbd6 in zebrafish and Xenopus tropicalis disturbs brain development. The molecular step between the protein and the malformation is not established.
    evidence:
    - reference: PMID:37951597
      reference_title: Bi-allelic ACBD6 variants lead to a neurodevelopmental syndrome with progressive and complex movement disorders.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The mutants also demonstrated increased mortality and severe developmental delay, with an overall reduction in brain size and disrupted muscular phenotype
      explanation: Zebrafish acbd6 mutants have reduced brain size and severe developmental delay.
    - reference: PMID:37951597
      reference_title: Bi-allelic ACBD6 variants lead to a neurodevelopmental syndrome with progressive and complex movement disorders.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These differences included microcephaly, reduced movement, eye abnormalities and brain structure differences, data that strengthen the link between ACBD6 variants and the pathology observed in the patient cohort.
      explanation: Xenopus tropicalis crispants have microcephaly and brain structure differences.
  - target: Presumed Progressive Neurodegeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Loss of acbd6 in zebrafish gives progressive loss of muscle with motor neuron abnormalities, and patients deteriorate with age. The intervening steps are not established.
    evidence:
    - reference: PMID:37951597
      reference_title: Bi-allelic ACBD6 variants lead to a neurodevelopmental syndrome with progressive and complex movement disorders.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: we observed motor neuron over-branching during development and progressive muscle loss, suggesting a combination of muscle and neuronal degeneration leading to movement abnormalities
      explanation: The authors interpret the zebrafish findings as combined muscle and neuronal degeneration leading to movement abnormalities.
      directness: INDIRECT

discussions:
- kind: KNOWLEDGE_GAP
  discussion_id: acbd6_nmyristoylation_direction_and_relevance
  prompt: Is protein N-myristoylation reduced, increased or redistributed in ACBD6-deficient human neurons, and does the change cause the neurological disease?
  rationale: Radiolabelling in patient fibroblasts and knockout cells shows reduced myristoylation, while chemical proteomics with a myristate analogue shows increased labelling in one patient line and in zebrafish, and reduced labelling in Xenopus. The analogue competes with myristoyl-CoA and its uptake may rise through lipid salvage when ACBD6 is missing, so the two methods may not measure the same thing. None of the measurements was made in a neural cell type, and no specific substrate has been tied to a clinical feature.
  attaches_to:
  - pathophysiology#Dysregulated Protein N-Myristoylation
  - pathophysiology#Abnormal Brain Development
  evidence:
  - reference: PMID:32108178
    reference_title: "Requirement of the acyl-CoA carrier ACBD6 in myristoylation of proteins: Activation by ligand binding and protein interaction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Skin-derived fibroblasts of two unrelated individuals with neurodevelopmental disorder and carrying loss of function mutations in the ACBD6 gene were deficient in protein N-myristoylation.
    explanation: Reduced by radiolabelling.
  - reference: PMID:37951597
    reference_title: Bi-allelic ACBD6 variants lead to a neurodevelopmental syndrome with progressive and complex movement disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: YnMyr incorporation was significantly higher in the ACBD6-deficient patient fibroblasts, spanning 68 known co- and 18 post-translationally N-myristoylated proteins.
    explanation: Increased by chemical proteomics.
  - reference: PMID:37951597
    reference_title: Bi-allelic ACBD6 variants lead to a neurodevelopmental syndrome with progressive and complex movement disorders.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the acbd6 X. tropicalis crispants show a prominent and significant reduction of YnMyr labelling
    explanation: Reduced in Xenopus.
  proposed_experiments:
  - experiment_id: acbd6_neuronal_myristoylome
    name: N-myristoylated proteome in ACBD6-deficient human neurons
    description: Quantify N-myristoylation of individual NMT substrates, by a method that does not depend on uptake of a competing analogue, in neurons derived from patient induced pluripotent stem cells and isogenic corrected controls.
    readouts:
    - name: Occupancy of N-terminal myristoylation on NMT substrates
      target: pathophysiology#Dysregulated Protein N-Myristoylation
      direction: ALTERED
      interpretation: Shows which substrates lose or gain the modification in the affected cell type.
    would_support:
    - pathophysiology#Dysregulated Protein N-Myristoylation
    supporting_outcome:
    - A defined set of substrates is under-myristoylated in patient neurons and restored by correction of the variant.
    refuting_outcome:
    - Myristoylation of NMT substrates is unchanged in patient neurons, which would point to a different function of ACBD6 as the cause.
- kind: KNOWLEDGE_GAP
  discussion_id: acbd6_neuropathology_absent
  prompt: Is there neuronal loss in ACBD6-related disease, and in which structures?
  rationale: Neurodegeneration is inferred from the clinical course. No post-mortem or biopsy neuropathology and no longitudinal imaging series has been reported, so it is not known whether the deterioration reflects cell loss, and the parkinsonism has no demonstrated anatomical basis.
  attaches_to:
  - pathophysiology#Presumed Progressive Neurodegeneration
  - phenotypes#Parkinsonism
  evidence:
  - reference: PMID:37951597
    reference_title: Bi-allelic ACBD6 variants lead to a neurodevelopmental syndrome with progressive and complex movement disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Further studies are warranted to delineate the clinical phenotype and understand the pathomorphological presentation and molecular mechanisms of the ACBD6-related disease.
    explanation: The authors call for study of the pathomorphological presentation.
- kind: KNOWLEDGE_GAP
  discussion_id: acbd6_systemic_features
  prompt: Are pancytopenia, diabetes, cirrhosis and renal failure part of ACBD6-related disease?
  rationale: These features were reported in one family with a homozygous frameshift variant, with detailed data for one of the two siblings, and were not described in the other 27 families of the cohort. A second cause in that family has not been excluded.
  attaches_to:
  - phenotypes#Pancytopenia
  - phenotypes#Type 2 Diabetes Mellitus
  - phenotypes#Liver Cirrhosis
  - phenotypes#End-Stage Renal Disease

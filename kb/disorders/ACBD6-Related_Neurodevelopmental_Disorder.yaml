- name: Abnormal Brain Development
  description: Brain development is abnormal. On MRI most patients have hypoplasia or agenesis of the corpus callosum and of the anterior commissure, and smaller numbers have a short midbrain and a small inferior cerebellar vermis; over a third are microcephalic. The authors read the commissural defects as pointing to a role for ACBD6 in axonal pathfinding. acbd6-deficient zebrafish and Xenopus have small brains, with midbrain defects in Xenopus.

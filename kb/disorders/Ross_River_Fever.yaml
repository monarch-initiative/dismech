agent_life_cycle:
  description: >-
    RRV is maintained in an enzootic cycle between mosquitoes and vertebrate
    reservoirs, with native macropods (kangaroos, wallabies) regarded as the
    principal reservoir hosts and a wide range of mosquito vectors; humans are
    generally considered spillover or dead-end hosts, though human-mosquito
    amplification may contribute in epidemics.
  hosts:
  - preferred_term: macropods (kangaroos and wallabies)
    term:
      id: NCBITaxon:9307
      label: Macropodidae
    role: reservoir host
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: spillover host
  - preferred_term: Ochlerotatus (Aedes) vigilax
    term:
      id: NCBITaxon:569589
      label: Ochlerotatus vigilax
    role: mosquito vector
  - preferred_term: Culex annulirostris
    term:
      id: NCBITaxon:162997
      label: Culex annulirostris
    role: mosquito vector
  vectors:
  - Ochlerotatus vigilax
  - Culex annulirostris
  - Aedes camptorhynchus
  - Aedes notoscriptus
  evidence:
  - reference: PMID:42240370
    reference_title: "Ross River virus transmission, infection, and disease: two and a half decades of research progress-an updated cross-disciplinary review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Transmission involves multiple mosquito vectors and vertebrate reservoir hosts, with patterns varying geographically across endemic regions"
    explanation: RRV cycles through mosquito vectors and vertebrate reservoir hosts.
  - reference: PMID:29554936
    reference_title: "The non-human reservoirs of Ross River virus: a systematic review of the evidence."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The long held dogma that marsupials are better reservoirs than placental mammals, which are better reservoirs than birds, deserves critical review."
    explanation: Macropod marsupials are the long-recognized principal reservoirs, though the review argues other hosts may contribute.
transmission:
- name: Mosquito vector transmission
  description: >-
    Humans are infected by the bite of an infected mosquito; many Aedes/
    Ochlerotatus and Culex species are competent vectors across different
    habitats. Blood transfusion is a rare additional route.
  evidence:
  - reference: PMID:26335937
    reference_title: "Ross River Virus: Many Vectors and Unusual Hosts Make for an Unpredictable Pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "With around 40 different mosquito species implicated as potential vectors, the environmental drivers of mosquito abundance will vary"
    explanation: RRV is a vector generalist transmitted by many mosquito species.

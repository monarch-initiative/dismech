name: Ross River Fever
creation_date: "2026-11-24T00:00:00Z"
category: Infectious
synonyms:
- Ross River virus disease
- Ross River virus infection
- Ross River disease
- epidemic polyarthritis
description: >-
  Ross River fever is an acute, often prolonged arthritogenic illness caused by
  Ross River virus (RRV), a mosquito-borne alphavirus (family Togaviridae)
  endemic to Australia and the Pacific, where it is the most commonly notified
  mosquito-borne disease. The virus is maintained in an enzootic
  mosquito-vertebrate cycle with native macropods as the principal reservoir;
  humans are generally spillover hosts. After an incubation of about a week,
  symptomatic patients (only a minority of those infected) develop
  polyarthralgia and arthritis of the peripheral joints, fatigue, myalgia,
  maculopapular rash and fever. Most recover over weeks to months, but a
  substantial minority have arthralgia persisting for many months.

  Much of the mechanism is inferred from a mouse model that only partially
  resembles human disease. RRV enters cells through the MXRA8 receptor,
  disseminates to musculoskeletal tissue, and recruits an inflammatory
  monocyte/macrophage infiltrate; downstream, mannose-binding-lectin-pathway
  complement activation triggered by viral envelope N-glycans drives the tissue
  destruction. There is no licensed vaccine or antiviral; management is
  symptomatic.
disease_term:
  preferred_term: Ross river fever
  term:
    id: MONDO:0000344
    label: Ross river fever
parents:
- Alphavirus Infection
- Arboviral Disease
notes: >-
  "Epidemic polyarthritis" historically denotes disease caused by either Ross
  River virus or Barmah Forest virus, so that synonym can conflate the two.
  The pathogenesis chain below is largely from the C57BL/6 mouse model and in
  vitro work; the review by Yuen & Bielefeldt-Ohmann (PMID:33802851) cautions
  that mechanistic knowledge is mainly inferred from a murine model that only
  partially resembles the human and equine disease. Host genetic susceptibility
  in humans is not established; MXRA8 is an entry receptor shown in cells and
  mice, not a human susceptibility allele. No GeneReviews chapter applies
  (this is an infectious disease). The entry is a member of, not a duplicate
  of, the Alphavirus/Togaviridae grouping concepts under curation in #17868
  and #18112.

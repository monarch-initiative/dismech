name: Ross River Fever
creation_date: "2026-11-24T00:00:00Z"
category: Infectious
synonyms:
- Ross River virus disease
- Ross River virus infection
- Ross River disease
- epidemic polyarthritis
description: >-
  Ross River fever is an acute, often prolonged arthritogenic illness caused by
  Ross River virus (RRV), a mosquito-borne alphavirus (family Togaviridae)
  endemic to Australia and the Pacific, where it is the most commonly notified
  mosquito-borne disease. The virus is maintained in an enzootic
  mosquito-vertebrate cycle with native macropods as the principal reservoir;
  humans are generally spillover hosts. After an incubation of about a week,
  symptomatic patients (only a minority of those infected) develop
  polyarthralgia and arthritis of the peripheral joints, fatigue, myalgia,
  maculopapular rash and fever. Most recover over weeks to months, but a
  substantial minority have arthralgia persisting for many months.

  Much of the mechanism is inferred from a mouse model that only partially
  resembles human disease. RRV enters cells through the MXRA8 receptor,
  disseminates to musculoskeletal tissue, and recruits an inflammatory
  monocyte/macrophage infiltrate; downstream, mannose-binding-lectin-pathway
  complement activation triggered by viral envelope N-glycans drives the tissue
  destruction. There is no licensed vaccine or antiviral; management is
  symptomatic.
disease_term:
  preferred_term: Ross river fever
  term:
    id: MONDO:0000344
    label: Ross river fever
parents:
- Alphavirus Infection
- Arboviral Disease
notes: >-
  "Epidemic polyarthritis" historically denotes disease caused by either Ross
  River virus or Barmah Forest virus, so that synonym can conflate the two.
  The pathogenesis chain below is largely from the C57BL/6 mouse model and in
  vitro work; the review by Yuen & Bielefeldt-Ohmann (PMID:33802851) cautions
  that mechanistic knowledge is mainly inferred from a murine model that only
  partially resembles the human and equine disease. Host genetic susceptibility
  in humans is not established; MXRA8 is an entry receptor shown in cells and
  mice, not a human susceptibility allele. No GeneReviews chapter applies
  (this is an infectious disease). The entry is a member of, not a duplicate
  of, the Alphavirus/Togaviridae grouping concepts under curation in #17868
  and #18112.
infectious_agent:
- name: Ross River virus
  infectious_agent_term:
    preferred_term: Ross River virus
    term:
      id: NCBITaxon:11029
      label: Ross River virus
  description: >-
    A positive-sense single-stranded RNA alphavirus of the family Togaviridae.
  evidence:
  - reference: PMID:42240370
    reference_title: "Ross River virus transmission, infection, and disease: two and a half decades of research progress-an updated cross-disciplinary review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ross River virus (RRV) is a mosquito-borne alphavirus of the family Togaviridae that causes the most commonly notified mosquito-borne disease in Australia"
    explanation: Identifies the causal agent and its family.
agent_life_cycle:
  description: >-
    RRV is maintained in an enzootic cycle between mosquitoes and vertebrate
    reservoirs, with native macropods (kangaroos, wallabies) regarded as the
    principal reservoir hosts and a wide range of mosquito vectors; humans are
    generally considered spillover or dead-end hosts, though human-mosquito
    amplification may contribute in epidemics.
  hosts:
  - preferred_term: macropods (kangaroos and wallabies)
    term:
      id: NCBITaxon:9307
      label: Macropodidae
    role: reservoir host
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: spillover host
  vectors:
  - Ochlerotatus (Aedes) vigilax (NCBITaxon:569589)
  - Culex annulirostris (NCBITaxon:162997)
  evidence:
  - reference: PMID:29554936
    reference_title: "The non-human reservoirs of Ross River virus: a systematic review of the evidence."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The long held dogma that marsupials are better reservoirs than placental mammals, which are better reservoirs than birds, deserves critical review."
    explanation: Macropod marsupials are the long-recognized principal reservoirs, though the review argues other hosts may contribute.
transmission:
- name: Mosquito vector transmission
  description: >-
    Humans are infected by the bite of an infected mosquito; many Aedes/
    Ochlerotatus and Culex species are competent vectors across different
    habitats. Blood transfusion is a rare additional route.
  evidence:
  - reference: PMID:26335937
    reference_title: "Ross River Virus: Many Vectors and Unusual Hosts Make for an Unpredictable Pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "With around 40 different mosquito species implicated as potential vectors, the environmental drivers of mosquito abundance will vary"
    explanation: RRV is a vector generalist transmitted by many mosquito species.
pathophysiology:
- name: Ross River Virus Cell Entry via MXRA8
  description: >-
    During a mosquito bite RRV is inoculated into skin and engages the cell
    entry mediator MXRA8, shared by several arthritogenic alphaviruses, leading
    to receptor-mediated internalization and cytoplasmic replication. Shown in
    cells and mice.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  downstream:
  - target: Dissemination to Musculoskeletal Tissue
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37036079
    reference_title: "Role of MXRA8 in Ross River Virus Disease Pathogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "MXRA8 was recently discovered as an entry receptor for multiple alphaviruses including CHIKV, RRV, Mayaro virus (MAYV), and O'nyong-nyong virus (ONNV)."
    explanation: MXRA8 is an entry receptor for RRV.
  - reference: PMID:37036079
    reference_title: "Role of MXRA8 in Ross River Virus Disease Pathogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "MXRA8 knockout (MXRA8-/-) mice generated on a C57BL/6J background, showed abrogated disease signs and reduced viral replication, which correlated with lower viral load, diminished proinflammatory cytokines, and limited cell infiltrates in inflamed tissues."
    explanation: Loss of the receptor abrogates disease in mice, placing entry upstream of inflammation.
- name: Dissemination to Musculoskeletal Tissue
  description: >-
    Viral replication and viremia carry RRV to skeletal muscle, joints and
    synovium, the tropism underlying arthritis and myositis. Shown mainly in
    the mouse model.
  biological_scale: ORGANISM
  downstream:
  - target: Monocyte and Macrophage Infiltration
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28754345
    reference_title: "Ross River virus disease clinical presentation, pathogenesis and current therapeutic strategies."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "RRV is an arthitogenic alphavirus capable of causing outbreaks of debilitating musculoskeletal inflammatory disease in humans."
    explanation: The musculoskeletal tropism defining the disease.
- name: Monocyte and Macrophage Infiltration
  description: >-
    Infected and activated cells recruit an inflammatory infiltrate dominated
    by monocytes and macrophages into muscle and joint tissue, with
    upregulation of proinflammatory chemokines. Interleukin-17-producing T
    cells and neutrophils also contribute. Shown in mice, with IL-17 raised in
    patient serum.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Complement Activation and Tissue Destruction
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35143591
    reference_title: "Interleukin-17 contributes to Ross River virus-induced arthritis and myositis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "IL-17-producing T cells and neutrophils contributed to the cellular infiltrate in the joint and muscle tissue during acute RRV disease in mice."
    explanation: Identifies the inflammatory infiltrate in affected tissue.
  - reference: PMID:35143591
    reference_title: "Interleukin-17 contributes to Ross River virus-induced arthritis and myositis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IL-17 expression was increased in musculoskeletal tissues and serum of RRV-infected mice and humans, respectively."
    explanation: Human corroboration of the inflammatory response.
- name: Complement Activation and Tissue Destruction
  description: >-
    Viral envelope E2 N-linked glycans on infected cells are recognized by
    mannose-binding lectin, activating the lectin complement pathway and C3,
    which acts in the effector phase to destroy skeletal muscle and joint
    tissue. C3-deficient mice develop much less severe tissue destruction
    despite similar infiltrates, placing complement downstream of cell
    recruitment; complement activation is also detected in patient synovial
    fluid.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: complement activation, lectin pathway
    modifier: INCREASED
    term:
      id: GO:0001867
      label: complement activation, lectin pathway
  downstream:
  - target: Arthritis
    causal_link_type: DIRECT
  - target: Arthralgia
    causal_link_type: DIRECT
  - target: Joint stiffness
    causal_link_type: DIRECT
  - target: Myalgia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17314163
    reference_title: "Complement contributes to inflammatory tissue destruction in a mouse model of Ross River virus-induced disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mice deficient in C3 (C3(-/-)), the central component of the complement system, developed much less severe disease signs than did wild-type mice."
    explanation: Complement C3 is required for full tissue destruction in the mouse model.
  - reference: PMID:29324290
    reference_title: "Ross River virus envelope glycans contribute to disease through activation of the host complement system."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the reduced disease induced by glycan-deficient viruses was linked to decreased MBL deposition and complement activation within"
    explanation: Viral E2 glycans drive MBL-pathway complement activation and disease.

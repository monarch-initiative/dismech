progression:
- phase: Incubation
  duration: 3 to 21 days (usually 7 to 9 days)
  notes: >-
    Interval between an infectious mosquito bite and symptom onset, usually
    about a week.
- phase: Acute illness
  duration: weeks
  notes: >-
    Abrupt onset of polyarthralgia/arthritis with fatigue, myalgia, rash and
    fever.
- phase: Convalescence
  duration: weeks to many months
  notes: >-
    Often relapsing-remitting arthralgia; most recover within 5 to 7 months,
    but about a quarter have rheumatic symptoms persisting at least 12 months.
  evidence:
  - reference: PMID:42240370
    reference_title: "Ross River virus transmission, infection, and disease: two and a half decades of research progress-an updated cross-disciplinary review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "a considerable burden of non-fatal, yet frequently prolonged rheumatic illness across the Australia-Pacific region"
    explanation: Frequently prolonged rheumatic illness during convalescence.
treatments:
- name: Symptomatic Pharmacotherapy
  description: >-
    No approved antiviral or disease-specific therapy exists; NSAIDs such as
    ibuprofen or naproxen and simple analgesics such as paracetamol are the
    mainstay for arthralgia and arthritis. DMARDs and corticosteroids are not
    proven effective.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ibuprofen
      term:
        id: CHEBI:5855
        label: ibuprofen
    - preferred_term: naproxen
      term:
        id: CHEBI:7476
        label: naproxen
    - preferred_term: paracetamol
      term:
        id: CHEBI:46195
        label: paracetamol
  target_mechanisms:
  - target: Arthritis
    description: Symptomatic anti-inflammatory and analgesic control of joint disease.
    evidence:
    - reference: PMID:33711991
      reference_title: "Pentosan polysulfate sodium for Ross River virus-induced arthralgia: a phase 2a, randomized, double-blind, placebo-controlled study."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "With no available vaccine or specific therapeutic for any alphaviral disease, and a growing economic and public health burden, there is a serious need for the development of specific therapies."
      explanation: No specific therapy exists, so management is symptomatic.
  evidence:
  - reference: PMID:33711991
    reference_title: "Pentosan polysulfate sodium for Ross River virus-induced arthralgia: a phase 2a, randomized, double-blind, placebo-controlled study."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "With no available vaccine or specific therapeutic for any alphaviral disease, and a growing economic and public health burden, there is a serious need for the development of specific therapies."
    explanation: Establishes the lack of a specific therapy.
- name: Physiotherapy and Graded Exercise
  description: >-
    Supportive physiotherapy and graded exercise support recovery of joint
    function during convalescence.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
clinical_trials:
- name: ACTRN12617000893303
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Phase 2a randomized, double-blind, placebo-controlled trial of pentosan
    polysulfate sodium for RRV-induced arthralgia (PARA-004, 20 subjects).
    Reported improved grip strength and pain scores and near-remission of joint
    symptoms in more PPS than placebo recipients; small and exploratory.
  target_phenotypes:
  - preferred_term: Arthralgia
    term:
      id: HP:0002829
      label: Arthralgia
  evidence:
  - reference: PMID:33711991
    reference_title: "Pentosan polysulfate sodium for Ross River virus-induced arthralgia: a phase 2a, randomized, double-blind, placebo-controlled study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty subjects were randomized 2:1 to subcutaneous PPS (2 mg/kg) or placebo (sodium chloride 0.9%) twice weekly for 6 weeks."
    explanation: The registered phase 2a trial of pentosan polysulfate sodium.
diagnosis:
- name: Serology and Molecular Testing
  description: >-
    Diagnosis is by RRV-specific serology (IgM/IgG seroconversion) and, in the
    viremic phase, RT-PCR.
  evidence:
  - reference: PMID:42240370
    reference_title: "Ross River virus transmission, infection, and disease: two and a half decades of research progress-an updated cross-disciplinary review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "the most mosquito-borne disease notifications in Australia and a considerable burden of non-fatal, yet frequently prolonged rheumatic illness"
    explanation: Case ascertainment is by notifiable-disease testing.
references:
- reference: PMID:42240370
  title: "Ross River virus transmission, infection, and disease: two and a half decades of research progress-an updated cross-disciplinary review."

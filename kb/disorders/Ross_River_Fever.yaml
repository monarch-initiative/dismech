    quote_role: BACKGROUND
    snippet: "Current treatments that address the symptoms of alphaviral infections, including RRV, include a multi-factorial approach including use of local analgesics, nonsteroidal anti-inflammatory drugs (NSAIDs) and/or analgesics such as paracetamol."
    explanation: NSAIDs and paracetamol are the symptomatic mainstay.
  - reference: PMID:33711991
    reference_title: "Pentosan polysulfate sodium for Ross River virus-induced arthralgia: a phase 2a, randomized, double-blind, placebo-controlled study."

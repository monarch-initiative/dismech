progression:
- phase: Incubation
  duration: 3 to 21 days (usually 7 to 9 days)
  notes: >-
    Interval between an infectious mosquito bite and symptom onset, usually
    about a week.
- phase: Acute illness
  duration: weeks
  notes: >-
    Abrupt onset of polyarthralgia/arthritis with fatigue, myalgia, rash and
    fever.
- phase: Convalescence
  duration: weeks to many months
  notes: >-
    Often relapsing-remitting arthralgia; most recover within 5 to 7 months,
    but about a quarter have rheumatic symptoms persisting at least 12 months.
  evidence:
  - reference: PMID:42240370
    reference_title: "Ross River virus transmission, infection, and disease: two and a half decades of research progress-an updated cross-disciplinary review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "a considerable burden of non-fatal, yet frequently prolonged rheumatic illness across the Australia-Pacific region"
    explanation: Frequently prolonged rheumatic illness during convalescence.
animal_models:
- name: MXRA8-knockout mouse
  species: Mouse
  genotype: Mxra8-/- (C57BL/6J)
  publication: PMID:37036079
  description: >-
    Knockout of the entry receptor abrogates RRV disease signs and reduces
    viral replication and inflammatory infiltrates.
  modeled_mechanisms:
  - target: Ross River Virus Cell Entry via MXRA8
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Removing the receptor abrogates disease, placing MXRA8 upstream.
    evidence:
    - reference: PMID:37036079
      reference_title: "Role of MXRA8 in Ross River Virus Disease Pathogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "MXRA8 knockout (MXRA8-/-) mice generated on a C57BL/6J background, showed abrogated disease signs and reduced viral replication, which correlated with lower viral load, diminished proinflammatory cytokines, and limited cell infiltrates in inflamed tissues."
      explanation: Receptor loss abrogates disease.
- name: C3-deficient mouse
  species: Mouse
  genotype: C3-/- (C57BL/6)
  publication: PMID:17314163
  description: >-
    Complement C3-deficient mice develop much less severe disease and far less
    skeletal-muscle destruction despite similar inflammatory infiltrates,
    placing complement in the effector phase.
  modeled_mechanisms:
  - target: Complement Activation and Tissue Destruction
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: TISSUE
    description: C3 loss uncouples infiltration from tissue destruction.
    limitations: >-
      Mice develop hindlimb musculoskeletal disease and the model is read out
      in hindlimb muscle; human disease is a peripheral polyarthritis without
      the paralysis or death seen in severe mouse infection.
    divergences:
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        The mouse model centres on hindlimb skeletal-muscle myositis, whereas
        the human disease is dominated by peripheral polyarthritis; severe mouse
        signs such as hindlimb paralysis have no human counterpart.
    evidence:
    - reference: PMID:17314163
      reference_title: "Complement contributes to inflammatory tissue destruction in a mouse model of Ross River virus-induced disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Despite similar inflammatory infiltrates, RRV-infected C3(-/-) mice exhibited far less severe destruction of skeletal muscle tissue."
      explanation: Complement acts downstream of cell recruitment to destroy tissue.
- name: Glycan-deficient RRV in mice
  species: Mouse
  genotype: Wild-type mice infected with E2 N-glycan-deficient RRV mutants
  publication: PMID:29324290
  description: >-
    Viruses lacking the E2 envelope N-glycans cause reduced disease and tissue
    damage with less MBL deposition and complement activation, despite similar
    viral load and infiltrates.
  modeled_mechanisms:
  - target: Complement Activation and Tissue Destruction
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: TISSUE
    description: Removing the glycan ligand reduces MBL-pathway complement and disease.
    evidence:
    - reference: PMID:29324290
      reference_title: "Ross River virus envelope glycans contribute to disease through activation of the host complement system."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the reduced disease induced by glycan-deficient viruses was linked to decreased MBL deposition and complement activation within"
      explanation: Viral E2 glycans drive the MBL-complement effector step.
- name: IL-17A/F blockade in mice
  species: Mouse
  genotype: RRV-infected wild-type mice with anti-IL-17A/F monoclonal antibody
  publication: PMID:35143591
  description: >-
    Blocking IL-17 reduces disease severity, inflammatory infiltrate and
    cartilage damage without changing viral titres.
  modeled_mechanisms:
  - target: Monocyte and Macrophage Infiltration
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: TISSUE
    description: IL-17 blockade dampens the inflammatory infiltrate.
    evidence:
    - reference: PMID:35143591
      reference_title: "Interleukin-17 contributes to Ross River virus-induced arthritis and myositis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Blockade of IL-17A/F using a monoclonal antibody (mAb) reduced disease severity in RRV-infected mice and led to decreased proinflammatory proteins, cellular infiltration in synovial tissues and cartilage damage, without affecting viral titers in inflamed tissues."
      explanation: IL-17 blockade modulates the leukocyte infiltrate.
treatments:
- name: Symptomatic Pharmacotherapy
  description: >-
    No approved antiviral or disease-specific therapy exists; NSAIDs such as
    ibuprofen or naproxen and simple analgesics such as paracetamol are the
    mainstay for arthralgia and arthritis. DMARDs and corticosteroids are not
    proven effective.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ibuprofen
      term:
        id: CHEBI:5855
        label: ibuprofen
    - preferred_term: naproxen
      term:
        id: CHEBI:7476
        label: naproxen
    - preferred_term: paracetamol
      term:
        id: CHEBI:46195
        label: paracetamol
  target_mechanisms:
  - target: Arthritis
    description: Symptomatic anti-inflammatory and analgesic control of joint disease.
    evidence:

diagnosis:
- name: Serology
  description: >-
    Diagnosis relies on RRV serology, but the brief viraemia and cross-reaction
    of antibodies with other alphaviruses (notably Barmah Forest virus) make
    definitive laboratory confirmation difficult.
  evidence:
  - reference: PMID:42240370
    reference_title: "Ross River virus transmission, infection, and disease: two and a half decades of research progress-an updated cross-disciplinary review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A brief viraemic period and reliance on serological testing, with antibodies cross-reacting with other alphaviruses, including Barmah Forest virus (BFV), similar clinically and in distribution, make it challenging to gain definitive laboratory evidence of infection"
    explanation: Serology is the mainstay but is complicated by alphavirus cross-reaction.

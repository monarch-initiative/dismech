- name: Obligatory Intracardiac Mixing and VSD-Dependent Streaming
  role: consequence
  biological_scale: ORGANISM
  description: >-
    All left ventricular output must traverse the ventricular septal defect into
    the right ventricle, so systemic and pulmonary venous returns mix obligatorily.
    The clinical expression depends on where the defect sits. With a subaortic
    defect, oxygenated left ventricular blood streams preferentially into the
    adjacent aorta and desaturated right ventricular blood into the pulmonary
    artery, giving a large-VSD physiology with only mild desaturation but marked
    pulmonary overcirculation. With a subpulmonary (Taussig-Bing) defect the
    streaming is reversed: oxygenated blood is directed into the pulmonary artery
    while desaturated systemic venous blood is ejected into the aorta, producing
    transposition-like physiology with early profound cyanosis. Any superimposed
    pulmonary stenosis restricts pulmonary blood flow and shifts even a subaortic
    defect toward cyanosis.

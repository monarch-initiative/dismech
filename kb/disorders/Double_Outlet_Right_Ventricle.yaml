  - reference: PMID:29468350
    reference_title: "A Novel MEF2C Loss-of-Function Mutation Associated with Congenital Double Outlet Right Ventricle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, the mutation significantly reduced the synergistic activation

      Consideration should be given to the urgent need for atrial septostomy in a
      patient who is desaturated and has evidence of a poor cardiac output state.
    explanation: >-
      Documents systemic desaturation as a clinical state requiring urgent
      intervention in DORV; the source describes desaturation rather than using
      the term hypoxemia, hence PARTIAL.
- category: Clinical
  name: Pulmonic stenosis
  description: >-
    Obstruction of the right ventricular outflow tract, most often from deviation
    of the muscular outlet septum into the subpulmonary infundibulum, but also
    valvar or supravalvar. It is the single most common associated lesion and
    converts an overcirculated DORV into a cyanotic one.

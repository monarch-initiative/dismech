- name: Failure of Outflow Tract Rotation and Alignment
  role: mediator
  biological_scale: TISSUE
  description: >-
    Normally the arterial pole rotates during looping so the aorta swings
    rightward and posteriorly over the left ventricle while the pulmonary trunk is
    displaced anteriorly and leftward. This rotation is driven in part by
    asymmetric addition of second-heart-field myocardium at the pulmonary side of
    the outflow tract, which pushes the pulmonary orifice into a higher, more
    frontal position relative to the aortic orifice (the "pulmonary push").
    Deficient or disorganised right ventricular outflow tract expansion leaves the
    rotation incomplete, so the aortic root is never transferred across the
    ventricular septum and remains supported by the right ventricle.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: outflow tract morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0003151
      label: outflow tract morphogenesis
  locations:
  - preferred_term: outflow tract
    term:
      id: UBERON:0004145
      label: outflow tract
  evidence:
  - reference: PMID:22826212
    reference_title: "Morphogenesis of outflow tract rotation during cardiac development: the pulmonary push concept."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We postulate that normally the pulmonary trunk and orifice are pushed in a
      higher and more frontal position relative to the aortic orifice by
      asymmetric addition of SHF-myocardium.
    explanation: >-
      Describes the second-heart-field-driven rotation mechanism whose failure is
      proposed here as the alignment defect underlying DORV.
  - reference: PMID:22826212
    reference_title: "Morphogenesis of outflow tract rotation during cardiac development: the pulmonary push concept."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Deficient or disorganized right ventricular OFT expansion might explain
      cardiac malformations with abnormal position of the great arteries, such as
      double outlet right ventricle.
    explanation: >-
      Proposes deficient outflow tract expansion and rotation as the explanation
      for DORV; PARTIAL because the source frames it as a postulate.
  - reference: PMID:38391276
    reference_title: "Double outlet right ventricle - the 50% rule has always been about the conus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      DORV is not a disease entity in itself, but rather a vast spectrum of
      disorders associated with maldevelopment of conal muscle and often abnormal
      expansion of one the great vessels.
    explanation: >-
      Frames DORV as the consequence of conal maldevelopment and abnormal
      great-vessel expansion rather than a discrete entity.
  downstream:
  - target: Persistence of the Subaortic Conus
    description: >-
      Incomplete rotation leaves the aortic root above persistent subaortic conal
      musculature rather than above the left ventricle.
    causal_link_type: DIRECT
  - target: Double Outlet Ventriculo-Arterial Connection
    description: >-
      Failure to transfer the aortic root across the ventricular septum leaves
      both arterial trunks supported by the right ventricle.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22826212
      reference_title: "Morphogenesis of outflow tract rotation during cardiac development: the pulmonary push concept."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Deficient or disorganized right ventricular OFT expansion might explain
        cardiac malformations with abnormal position of the great arteries, such
        as double outlet right ventricle.
      explanation: >-
        Proposes, on mouse embryo data, that failed outflow tract expansion and
        rotation explains DORV; PARTIAL because the authors frame this as a
        postulate rather than a demonstrated causal step.
- name: Persistence of the Subaortic Conus
  role: mediator
  biological_scale: TISSUE
  description: >-
    In the normal heart the subpulmonary conus persists while the subaortic conal
    free wall resorbs, allowing the aortic valve to descend into fibrous continuity
    with the mitral valve. In DORV the subaortic conus characteristically persists,
    producing bilateral (subaortic and subpulmonary) infundibula and abolishing
    aorto-mitral fibrous continuity, so the aortic root remains elevated on a
    muscular sleeve above the right ventricle. This is the conal basis of the
    classical "50% rule": what is really being measured is whether conal muscle
    still interposes between the arterial root and the left ventricle. The
    criterion is not absolute, because DORV also occurs with fibrous continuity
    between the arterial and atrioventricular valves, so bilateral conus is
    sufficient but not necessary for the diagnosis.
  biological_processes:
  - preferred_term: conus arteriosus morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0003239
      label: conus arteriosus morphogenesis
  - preferred_term: outflow tract septum morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0003148
      label: outflow tract septum morphogenesis
  locations:
  - preferred_term: conus arteriosus
    term:
      id: UBERON:0003983
      label: conus arteriosus
  - preferred_term: mitral valve
    term:
      id: UBERON:0002135

has_subtypes:
- name: Subaortic VSD
  subtype_term:
    preferred_term: double outlet right ventricle with subaortic or doubly committed ventricular septal defect
    term:
      id: MONDO:0018498
      label: double outlet right ventricle with subaortic or doubly committed ventricular septal defect
  display_name: DORV with subaortic ventricular septal defect (VSD type)
  review_notes: >-
    MONDO ontology limitation, not a curation error: MONDO:0018498 lumps the
    subaortic and doubly committed defects into a single class, so this subtype
    and the separately curated "Doubly committed VSD" subtype necessarily share
    the same disease_term. They are kept as distinct dismech subtypes because they
    differ in outlet-septum attachment, frequency (47% versus 4%) and surgical
    approach. A split request to MONDO would be needed to bind them separately.
  description: >-
    The most common form. The outlet septum attaches to the cranial (anterosuperior)
    limb of the septomarginal trabeculation, so the interventricular communication
    lies beneath the aortic root. Left ventricular blood streams preferentially to
    the aorta, giving a physiology resembling a large isolated ventricular septal
    defect: relatively well-saturated systemic flow with pulmonary overcirculation
    and congestive heart failure when pulmonary stenosis is absent. Repair is
    typically a straightforward intraventricular baffle tunnelling the left
    ventricle through the VSD to the aortic valve.
  evidence:
  - reference: PMID:27641710
    reference_title: "How should we diagnose and differentiate hearts with double-outlet right ventricle?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The defect is subaortic when the outlet septum is attached to the cranial
      limb of the trabeculation, subpulmonary when attached to the caudal limb,
      and doubly committed when attached to the inner heart curvature in the roof
      of the defect.
    explanation: >-
      Defines the subaortic subtype by the anatomic criterion used here, namely
      attachment of the outlet septum to the cranial limb of the septomarginal
      trabeculation.
  - reference: PMID:17903515
    reference_title: "Determinants of repair type, reintervention, and mortality in 393 children with double-outlet right ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Double-outlet right ventricle classification was as follows: subaortic
      ventricular septal defect with or without pulmonary stenosis in 47%,
      subpulmonic ventricular septal defect in 23%, noncommitted ventricular
      septal defect in 26%, and doubly committed ventricular septal defect in 4%.
    explanation: >-
      Quantifies the subaortic VSD subtype as the most frequent form (47%) in a
      large single-institution DORV cohort.
- name: DORV-Fallot
  subtype_term:
    preferred_term: double outlet right ventricle with subaortic or doubly committed ventricular septal defect with pulmonary stenosis
    term:
      id: MONDO:0020386
      label: double outlet right ventricle with subaortic or doubly committed ventricular septal defect with pulmonary stenosis
  display_name: DORV with subaortic or doubly committed VSD and pulmonary stenosis (Fallot type)
  description: >-
    A physiologic variant of the committed-VSD forms in which pulmonary stenosis
    accompanies a subaortic or doubly committed ventricular septal defect. Because
    the outlet septum is deviated anterosuperiorly into the subpulmonary outflow,
    the physiology and surgical logic mirror tetralogy of Fallot: cyanosis rather
    than overcirculation, hypercyanotic spells, and repair combining an
    intraventricular baffle to the aorta with relief of right ventricular outflow
    tract obstruction.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A subaortic VSD may mean that pulmonary stenosis and small branch pulmonary
      arteries are likely to develop.
    explanation: >-
      Links the subaortic VSD anatomy to the development of pulmonary stenosis,
      which is what converts a VSD-type DORV into the Fallot-type physiology.
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The surgical outcomes of DORV-Fallot are like those achieved in the TOF,
      with operative mortality between 0% and 5%.
    explanation: >-
      Confirms DORV-Fallot as a recognised surgical category whose outcomes track
      those of tetralogy of Fallot.
- name: Subpulmonary VSD
  subtype_term:
    preferred_term: double outlet right ventricle with subpulmonary ventricular septal defect
    term:
      id: MONDO:0020387
      label: double outlet right ventricle with subpulmonary ventricular septal defect
  display_name: DORV with subpulmonary VSD (Taussig-Bing anomaly, TGA type)
  description: >-
    The Taussig-Bing anomaly. The outlet septum attaches to the caudal
    (posteroinferior) limb of the septomarginal trabeculation, placing the
    interventricular communication beneath the pulmonary root, with the pulmonary
    valve overriding the crest of the ventricular septum by more than 50% and
    bilateral conus. Left ventricular blood streams preferentially into the
    pulmonary artery while systemic venous return is directed to the aorta, so the
    physiology is transposition-like with early severe cyanosis. Aortic arch
    obstruction (coarctation or interrupted arch) and coronary anomalies are
    frequent. Repair is an arterial switch operation combined with a
    VSD-to-pulmonary-root baffle, with concomitant arch repair when needed.
  evidence:
  - reference: PMID:27641710
    reference_title: "How should we diagnose and differentiate hearts with double-outlet right ventricle?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The defect is subaortic when the outlet septum is attached to the cranial
      limb of the trabeculation, subpulmonary when attached to the caudal limb,
      and doubly committed when attached to the inner heart curvature in the roof
      of the defect.
    explanation: >-
      Defines the subpulmonary subtype anatomically by attachment of the outlet
      septum to the caudal limb of the septomarginal trabeculation.
  - reference: PMID:32795522
    reference_title: "Anatomic Risk Factors for Reintervention After Arterial Switch Operation for Taussig-Bing Anomaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aortic arch obstruction and coronary anomalies were present in 64% and 41%
      of patients, respectively.
    explanation: >-
      Documents the high burden of aortic arch obstruction and coronary anomalies
      that distinguishes the Taussig-Bing subtype and complicates its repair.
- name: Doubly committed VSD
  subtype_term:
    preferred_term: double outlet right ventricle with subaortic or doubly committed ventricular septal defect
    term:
      id: MONDO:0018498
      label: double outlet right ventricle with subaortic or doubly committed ventricular septal defect
  display_name: DORV with doubly committed (juxta-arterial) ventricular septal defect
  review_notes: >-
    MONDO ontology limitation, not a curation error: MONDO:0018498 is a lumped
    class covering both subaortic and doubly committed defects, so this subtype
    shares its disease_term with the "Subaortic VSD" subtype above. See the note
    on that subtype.
  description: >-
    The rarest positional subtype. The outlet septum is deficient or fibrous and
    attaches to the inner heart curvature in the roof of the defect, so the
    interventricular communication lies immediately beneath both semilunar valves,
    which are in fibrous continuity with one another. An intraventricular tunnel is
    still feasible but usually requires a right ventriculotomy or transpulmonary
    approach because the baffle must be anchored to the fibrous tissue between the
    aortic and pulmonary annuli, with a risk of semilunar valve distortion.
  evidence:
  - reference: PMID:27641710
    reference_title: "How should we diagnose and differentiate hearts with double-outlet right ventricle?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The defect is subaortic when the outlet septum is attached to the cranial
      limb of the trabeculation, subpulmonary when attached to the caudal limb,
      and doubly committed when attached to the inner heart curvature in the roof
      of the defect.
    explanation: >-
      Defines the doubly committed subtype by attachment of the outlet septum to
      the inner heart curvature roofing the defect.
  - reference: PMID:17903515
    reference_title: "Determinants of repair type, reintervention, and mortality in 393 children with double-outlet right ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Double-outlet right ventricle classification was as follows: subaortic
      ventricular septal defect with or without pulmonary stenosis in 47%,
      subpulmonic ventricular septal defect in 23%, noncommitted ventricular
      septal defect in 26%, and doubly committed ventricular septal defect in 4%.
    explanation: >-
      Establishes the doubly committed VSD as the rarest positional subtype (4%)
      in a large clinical DORV series.
- name: Non-committed VSD
  subtype_term:
    preferred_term: double outlet right ventricle with non-committed subpulmonary ventricular septal defect
    term:
      id: MONDO:0020388
      label: double outlet right ventricle with non-committed subpulmonary ventricular septal defect
  display_name: DORV with non-committed (remote) ventricular septal defect
  review_notes: >-
    MONDO ontology limitation, not a curation error: the label of MONDO:0020388 is
    "double outlet right ventricle with non-committed subpulmonary ventricular
    septal defect", which reads oddly because a non-committed (remote) defect is
    by definition not subpulmonary. It is nevertheless the only MONDO class for
    the non-committed form, so it is used here; the dismech description carries
    the correct anatomic definition. Correcting the MONDO label would require an
    upstream ontology request.
  description: >-
    The interventricular communication lies outside the limbs of the septomarginal
    trabeculation, typically in the inlet or apical trabecular septum, and is
    therefore remote from both arterial roots. This is the most surgically
    difficult subtype: a baffle must traverse a long, tortuous course at risk of
    obstructing the tricuspid valve apparatus or the right ventricular outflow
    tract, so VSD enlargement, multiple patches, root translocation, or staged
    single-ventricle palliation are often required.
  evidence:
  - reference: PMID:27641710
    reference_title: "How should we diagnose and differentiate hearts with double-outlet right ventricle?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Non-committed defects are no longer positioned within the limbs of the
      septomarginal trabeculation.
    explanation: >-
      Provides the defining anatomic criterion for the non-committed/remote VSD
      subtype.
  - reference: PMID:38134423
    reference_title: "Multicentre study on late outcomes of biventricular repair of double outlet right ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      VSD enlargement was significantly more frequent in DORV-ncVSD at 42% (5/12)
      (P = 0.001).
    explanation: >-
      Documents the greater surgical complexity of the non-committed VSD subtype,
      which more often requires enlargement of the interventricular communication
      to construct an unobstructed baffle.
pathophysiology:
- name: Cardiac Neural Crest and Second Heart Field Disruption
  role: trigger
  biological_scale: CELLULAR
  description: >-
    DORV originates in the two extracardiac progenitor populations that build the
    cardiac outflow tract. Cardiac neural crest cells delaminate from the dorsal
    neural tube, migrate through the caudal pharyngeal arches into the distal
    outflow tract and condense to form the aorticopulmonary septum, while
    second-heart-field progenitors are added to the arterial pole and provide the
    myocardium that elongates and rotates the outflow tract. Genetic lesions
    (chromosomal, transcription-factor, planar-cell-polarity, ciliary) and
    teratogenic exposures that perturb neural crest migration or second-heart-field
    addition converge on this step. DORV and tetralogy of Fallot are the two
    conotruncal phenotypes that most directly report this disturbance.
  cell_types:
  - preferred_term: migratory cardiac neural crest cell
    term:
      id: CL:2000073
      label: migratory cardiac neural crest cell
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: cardiac neural crest cell migration involved in outflow tract morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0003253
      label: cardiac neural crest cell migration involved in outflow tract morphogenesis
  - preferred_term: cardiac neural crest cell development involved in outflow tract morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0061309
      label: cardiac neural crest cell development involved in outflow tract morphogenesis
  locations:
  - preferred_term: outflow tract
    term:
      id: UBERON:0004145
      label: outflow tract
  evidence:
  - reference: PMID:38884738
    reference_title: "Human Genetics of Tetralogy of Fallot and Double-Outlet Right Ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Tetralogy of Fallot (TOF) and double-outlet right ventricle (DORV) are
      conotruncal defects resulting from disturbances of the second heart field
      and the neural crest, which can occur as isolated malformations or as part
      of multiorgan syndromes.
    explanation: >-
      Directly identifies disturbance of the second heart field and the neural
      crest as the developmental origin of DORV.
  - reference: PMID:18456715
    reference_title: "Double outlet right ventricle: aetiologies and associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The large number of genes associated with DORV in both humans and animal
      models and the different anatomic subtypes seen in specific aetiologies
      indicate the likelihood of several distinct pathogenetic mechanisms for
      DORV, including impairment of neural crest derivative migration and
      impairment of normal cardiac situs and looping.
    explanation: >-
      Supports impaired neural crest derivative migration as one of the distinct
      pathogenetic mechanisms of DORV, alongside disturbed situs and looping.
  - reference: PMID:32511952
    reference_title: "SHROOM3 is downstream of the planar cell polarity pathway and loss-of-function results in congenital heart defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We demonstrate Shroom3 expression within cardiomyocytes of the ventricles
      and interventricular septum from E10.5 onward, as well as within cardiac
      neural crest cells and second heart field cells that populate the cardiac
      outflow tract.
    explanation: >-
      Localises a DORV-causing planar-cell-polarity effector to precisely the
      cardiac neural crest and second-heart-field populations that build the
      outflow tract.
  - reference: PMID:32511952
    reference_title: "SHROOM3 is downstream of the planar cell polarity pathway and loss-of-function results in congenital heart defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We demonstrate that Shroom3gt/gt mice exhibit variable penetrance of a
      spectrum of CHDs that include ventricular septal defects, double outlet
      right ventricle, and thin left ventricular myocardium.
    explanation: >-
      Shows experimentally that disrupting a planar-cell-polarity effector in
      these progenitor populations produces DORV.
  downstream:
  - target: Failure of Outflow Tract Rotation and Alignment
    description: >-
      Deficient or disorganised neural crest and second-heart-field contribution
      leaves the outflow tract unable to elongate and rotate normally.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38884738

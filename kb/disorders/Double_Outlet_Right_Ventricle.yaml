  - reference: PMID:38652290
    reference_title: "Recent advances in multimodal imaging in tetralogy of fallot and double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      this review highlights significant advancements in preoperative and
      postoperative imaging for Tetralogy of Fallot (TOF) and double outlet right
      ventricle (DORV)
    explanation: >-
      Establishes that pre- and postoperative multimodality imaging, including
      CMR, is the recognised imaging framework for DORV specifically.
  - reference: PMID:38652290
    reference_title: "Recent advances in multimodal imaging in tetralogy of fallot and double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The utilization of 4D flow techniques for postoperative hemodynamic
      assessment promises new insights into pressure mapping.
    explanation: >-
      Supports the 4D flow component of the postoperative CMR assessment in DORV.
  - reference: PMID:38652290
    reference_title: "Recent advances in multimodal imaging in tetralogy of fallot and double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the inclusion of cardiac magnetic resonance (CMR) parameters as risk score
      predictors for morbidity, and mortality and for timing of pulmonary valve
      replacement (PVR) indicates its significance in clinical management
    explanation: >-
      Documents the prognostic and reintervention-timing role of CMR parameters in
      the postoperative surveillance of DORV and tetralogy of Fallot.
  - reference: PMID:38391276
    reference_title: "Double outlet right ventricle - the 50% rule has always been about the conus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is a growing appreciation of the utility of cross-sectional imaging in
      complex DORV, and the generation of patient-specific 3D models with virtual
      reality simulations for surgical planning.
    explanation: >-
      Establishes cross-sectional imaging and patient-specific 3D modelling as
      current practice in the assessment of complex DORV.
  - reference: PMID:38391276
    reference_title: "Double outlet right ventricle - the 50% rule has always been about the conus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These models improve the prediction of candidacy for biventricular repair and
      allow the mapping of complex baffle pathways preoperatively.
    explanation: >-
      Links the imaging modality directly to the entry's central decision point,
      namely whether the VSD can be baffled to an arterial root or whether
      single-ventricle palliation is required.
- name: Cardiac catheterisation and angiography
  description: >-
    Diagnostic catheterisation is no longer routine and is reserved for questions
    that non-invasive imaging leaves open: branch pulmonary artery and aortic arch
    anatomy, coronary artery course, the precise location of the interventricular
    communication, and haemodynamic assessment of pulmonary vascular resistance
    before biventricular repair or cavopulmonary palliation. It is also the access
    route for interventional palliation, notably balloon atrial septostomy and
    ductal stenting.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The purpose of additional studies in addition to an echocardiogram would be
      to clarify the details of the anatomy such as branch pulmonary arteries,
      arch anatomies, and coronaries; it may also assist in clarifying the
      location of the VSD.
    explanation: >-
      States the residual anatomic questions that catheterisation and angiography
      are used to resolve after echocardiography in DORV.
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CT serves as a safer and high-quality alternative to diagnostic cardiac
      catheterization or MRI
    explanation: >-
      Positions diagnostic catheterisation as the invasive comparator that
      cross-sectional imaging has largely displaced.
- name: Chromosomal microarray and genomic testing
  description: >-
    Because more than 40 per cent of DORV patients carry a chromosomal abnormality,
    genetic evaluation is part of the diagnostic workup: karyotype or FISH when
    aneuploidy or 22q11.2 deletion is strongly suspected, chromosomal microarray as
    the non-targeted first-line test otherwise, and exome or genome sequencing when
    microarray is non-diagnostic.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      More than 40% of patients with DORV have associated chromosomal
      abnormalities
    explanation: >-
      Establishes the diagnostic yield that justifies routine cytogenomic testing
      in DORV.
differential_diagnoses:
- name: Tetralogy of Fallot
  description: >-
    Tetralogy of Fallot and DORV are not cleanly separable entities: they share a
    developmental origin in the second heart field and cardiac neural crest, and
    the boundary between "tetralogy with an overriding aorta" and "DORV with a
    subaortic or doubly committed VSD and pulmonary stenosis" is set by an
    arbitrary degree of aortic override rather than by a difference in mechanism.
    The DORV-Fallot subtype of this entry occupies exactly that overlap, and its
    physiology and repair (VSD-to-aorta baffle with relief of right ventricular
    outflow tract obstruction) are those of tetralogy. Overlap can be complete:
    tetralogy with pulmonary atresia and a single outlet from the right ventricle
    also satisfies the morphologic definition of DORV.
  disease_term:
    preferred_term: tetralogy of Fallot
    term:
      id: MONDO:0008542
      label: tetralogy of fallot
  distinguishing_features:
  - Degree of aortic override is the operative discriminator; commonly a 50 per cent threshold is applied, but the threshold is conventional rather than mechanistic and different groups apply it differently.
  - Aortic-to-mitral fibrous continuity is classically retained in tetralogy and classically lost in DORV, but this criterion is unreliable because DORV with preserved arterial-to-atrioventricular valvar continuity is the more common form of DORV.
  - Bilateral (subaortic and subpulmonary) infundibula favour DORV; a single subpulmonary infundibulum with a resorbed subaortic conus favours tetralogy.
  - The distinction does not change the operation when the VSD is subaortic and pulmonary stenosis is present, which is why DORV-Fallot outcomes track tetralogy outcomes.
  evidence:
  - reference: PMID:38884738
    reference_title: "Human Genetics of Tetralogy of Fallot and Double-Outlet Right Ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tetralogy of Fallot (TOF) and double-outlet right ventricle (DORV) are
      conotruncal defects resulting from disturbances of the second heart field
      and the neural crest, which can occur as isolated malformations or as part
      of multiorgan syndromes.
    explanation: >-
      Establishes that the two conditions on either side of this differential share
      a developmental mechanism, which is why the boundary between them is
      definitional rather than mechanistic.
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One example would be TOF with DORV and pulmonary atresia.
    explanation: >-
      Documents that a heart can simultaneously satisfy the tetralogy and the DORV
      definitions, demonstrating that the two categories overlap rather than
      exclude one another.
  notes: >-
    Because the boundary is conventional, the practical curation position taken in
    this entry is that VSD position and the presence of outflow tract obstruction,
    not the tetralogy-versus-DORV label, determine physiology and the surgical
    route.
- name: Dextro-looped transposition of the great arteries with ventricular septal defect
  description: >-
    d-TGA with a VSD is the principal differential for the subpulmonary
    (Taussig-Bing) subtype, because both produce transposition-like physiology in
    the newborn: the aorta receives desaturated right ventricular blood and the
    pulmonary artery receives the oxygenated left ventricular stream. The
    distinction is one of ventriculo-arterial connection. In d-TGA both
    connections are discordant, whereas in DORV the aorta is discordant but the
    pulmonary artery remains concordant with the right ventricle. Where the
    pulmonary valve overrides the septal crest, the assignment turns on how much
    of the valve sits over each ventricle, so the same heart may be called
    Taussig-Bing DORV or d-TGA with an overriding pulmonary artery depending on
    the override threshold used.
  disease_term:
    preferred_term: dextro-looped transposition of the great arteries
    term:
      id: MONDO:0019443
      label: dextro-looped transposition of the great arteries
  distinguishing_features:
  - In d-TGA both ventriculo-arterial connections are discordant; in DORV the aorta is discordant while the pulmonary artery is concordant.
  - When the pulmonary valve overrides, the lesion is called d-TGA if more than half the valve sits above the morphologic left ventricle, and Taussig-Bing DORV if more than half sits above the right ventricle.
  - Pulmonary-to-mitral fibrous continuity is present in d-TGA with a perimembranous VSD and an overriding pulmonary artery, and absent in the Taussig-Bing malformation.
  - Both are treated by an arterial switch, but the Taussig-Bing variant additionally requires a baffle routing the VSD to the pulmonary root and carries a high burden of aortic arch obstruction and coronary anomaly.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, in DORV, the aorta has a discordant connection while the PA has
      a concordant connection.
    explanation: >-
      States the connection-level criterion that separates DORV from transposition
      of the great arteries.
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If the majority, more than 50%, of the pulmonary valve sits above the
      morphologic LV, this would be considered a TGA because the pulmonary trunk
      has a discordant ventriculo-arterial connection.
    explanation: >-
      Shows that the DORV-versus-TGA assignment for an overriding pulmonary valve
      is decided by a proportional override threshold.
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In TGA with a perimembranous VSD and overriding PA, the pulmonary –mitral
      continuity is present, whereas in the Taussig –Bing malformation, the
      pulmonary–mitral continuity is absent.
    explanation: >-
      Gives the morphologic feature used at the bedside to separate Taussig-Bing
      DORV from transposition with an overriding pulmonary artery.
discussions:
- discussion_id: dorv_genotype_to_morphology_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - Cardiac Neural Crest and Second Heart Field Disruption
  - Outlet Septum Attachment Determines VSD Commitment
  prompt: >-
    By what mechanism does a given genetic lesion or teratogenic exposure convert
    normal outflow tract morphogenesis into the specific DORV subtype it produces,
    and what determines whether the resulting ventricular septal defect is
    subaortic, subpulmonary, doubly committed or non-committed?
  rationale: >-
    The pathophysiology modelled in this entry describes a coherent developmental
    chain from neural crest and second-heart-field disruption to the double-outlet
    connection, and the literature reliably associates particular aetiologies with
    particular anatomic subtypes (trisomy 13/18 versus 22q11.2 deletion produce
    different DORV subtypes). What is missing is the mechanistic bridge: no source
    explains how a specific lesion selects a specific outlet-septum attachment and
    therefore a specific VSD commitment. Because VSD position, not the DORV label,
    determines physiology and repair, this gap sits directly between the genetics
    and the clinically actionable anatomy.
  proposed_experiments:
  - experiment_id: dorv_allelic_series_oft_transcriptomics
    name: Lineage-resolved transcriptomics of the outflow tract across DORV alleles
    description: >-
      Single-cell and spatial transcriptomics of the murine outflow tract across a
      panel of DORV-producing alleles (Lrp1, Shroom3, Foxj1, Tbx1), staged through
      conal rotation, to test whether each lesion perturbs a distinct progenitor
      compartment rather than converging on one.
    decision_criterion: >-
      Allele-specific perturbation of distinct neural-crest versus
      second-heart-field compartments would show that the developmental route, not
      just the endpoint, differs by aetiology.
  - experiment_id: dorv_outlet_septum_morphometry
    name: Three-dimensional morphometry of outlet septum attachment
    description: >-
      Quantitative three-dimensional morphometry of outlet-septum attachment across
      the same allelic series, testing whether attachment site predicts the
      resulting ventricular septal defect commitment.
    decision_criterion: >-
      A reproducible mapping from allele to attachment site to VSD commitment would
      supply the missing mechanistic bridge between genotype and the clinically
      actionable anatomy.
  - experiment_id: dorv_genotype_subtype_cohort
    name: Genotype-to-subtype association in a uniformly classified DORV cohort
    description: >-
      Genotype-to-subtype association analysis in a large clinically phenotyped DORV
      cohort with uniform ISNPCHD anatomic classification and trio genome
      sequencing.
    decision_criterion: >-
      Significant association between specific genomic lesions and specific VSD
      positions would confirm in humans the genotype-to-morphology relationship
      suggested by the trisomy 13/18 versus 22q11.2 subtype difference.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      genetic anomalies or environmental exposures result in the development of
      DORV from normal structural cardiac anatomy are unknown
    explanation: >-
      The source states directly that the mechanisms by which specific genetic
      anomalies or environmental exposures produce DORV from normal structural
      cardiac anatomy are unknown, which is precisely the gap recorded here.
  - reference: PMID:18456715
    reference_title: "Double outlet right ventricle: aetiologies and associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      different anatomic subtypes of DORV were noted in trisomies 13 and 18 versus
      del 22q11
    explanation: >-
      Documents that aetiology and anatomic subtype are correlated, which is what
      makes the missing mechanistic bridge worth resolving.
clinical_trials:
- name: NCT00972608
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    Prospective observational study (n = 66, completed) registered for the
    condition "Double Outlet Right Ventricle", developing and validating an
    image-based virtual surgical planning protocol: patient MRI, 3D
    echocardiography and CT are reconstructed into 3D anatomy, candidate repairs
    are simulated on the model, and the chosen virtual plan is compared against
    the operation actually performed on postoperative imaging. It is the trial
    counterpart of the CMR-based baffle-planning workflow captured under
    diagnosis.
  target_phenotypes:
  - preferred_term: Double outlet right ventricle
    term:
      id: HP:0001719
      label: Double outlet right ventricle
  - preferred_term: Ventricular septal defect
    term:
      id: HP:0001629
      label: Ventricular septal defect
  evidence:
  - reference: clinicaltrials:NCT00972608
    reference_title: "Surgical Planning for Reconstruction of Complex Heart Defects"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      assess the feasibility of using surgical planning in the treatment of
      patients with complex cardiac defects
    explanation: >-
      States the objective of the trial, whose single registered condition on
      ClinicalTrials.gov is Double Outlet Right Ventricle.
  - reference: clinicaltrials:NCT00972608
    reference_title: "Surgical Planning for Reconstruction of Complex Heart Defects"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Use the developed protocol to prospectively plan and evaluate the possible
      surgical options for new patients.
    explanation: >-
      Documents the prospective surgical-planning aim that makes this trial
      relevant to the anatomy-driven repair decision in DORV.
  notes: >-
    Observational rather than an interventional therapeutic trial; included
    because image-based surgical planning is the active area of clinical
    innovation in DORV and this is the only registered DORV-specific study
    surfaced by the deep-research sweep.

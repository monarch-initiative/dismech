      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Tetralogy of Fallot (TOF) and double-outlet right ventricle (DORV) are
        conotruncal defects resulting from disturbances of the second heart field
        and the neural crest, which can occur as isolated malformations or as part
        of multiorgan syndromes.
      explanation: >-
        Places the second-heart-field and neural-crest disturbance causally
        upstream of the conotruncal alignment defect that produces DORV.
  - target: Persistence of the Subaortic Conus
    description: >-
      Perturbed conotruncal maturation prevents the normal resorption of the
      subaortic conal free wall.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - conotruncal maturation and conal remodelling
- name: Disturbed Left-Right Patterning and Cardiac Looping
  role: trigger
  biological_scale: TISSUE
  description: >-
    A distinct upstream route to DORV runs through the left-right organiser.
    Motile monocilia at the embryonic node generate leftward flow that establishes
    the NODAL laterality cascade; failure of this step randomises cardiac looping
    and the spatial relationship of the great arteries. This is the mechanism
    behind Van Praagh type III DORV, the form associated with heterotaxy and
    atrial isomerism, and explains why laterality genes (ZIC3, CFC1, FOXJ1,
    NODAL-pathway genes) recur in DORV cohorts. Because a randomised or abnormal
    loop misplaces the ventricles relative to the arterial poles, it produces the
    same double-outlet connection by a different developmental route than a
    primary neural-crest defect.
  biological_processes:
  - preferred_term: determination of left/right symmetry
    modifier: ABNORMAL
    term:
      id: GO:0007368
      label: determination of left/right symmetry
  - preferred_term: heart looping
    modifier: ABNORMAL
    term:
      id: GO:0001947
      label: heart looping
  - preferred_term: cilium movement
    modifier: DECREASED
    term:
      id: GO:0003341
      label: cilium movement
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Since Van Praagh type III DORV is associated with heterotaxy"
    explanation: >-
      Establishes the heterotaxy-associated (laterality) aetiologic class of DORV;
      PARTIAL because the source goes on to frame the specific laterality genes as
      predicted candidates rather than established causes.
  - reference: PMID:37158461
    reference_title: "Congenital heart defects caused by FOXJ1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Complex CHDs revealed by histological analysis include atrioventricular
      septal defects, DORV, single ventricle defects as well as abnormal position
      of the great arteries.
    explanation: >-
      Loss of the master motile-cilia transcription factor Foxj1 in mice produces
      DORV together with abnormal great-artery position, tying ciliary laterality
      failure to the double-outlet connection.
  - reference: PMID:37158461
    reference_title: "Congenital heart defects caused by FOXJ1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Finally, we characterize embryonic-stage CHD in Foxj1 loss-of-function mice,

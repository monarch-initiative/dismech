- name: ZIC3
  gene_term:
    preferred_term: ZIC3
    term:
      id: hgnc:12874
      label: ZIC3
  association: X-linked laterality defect with isolated DORV
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    ZIC3, the X-linked laterality gene classically causing heterotaxy with complex
    congenital heart disease, is also mutated in a small subset of patients with
    apparently isolated DORV, placing those cases within the laterality-defect
    spectrum. In a screen of 89 DORV probands a missense variant (c.49G>T,
    p.Gly17Cys) was identified in a female with isolated DORV. The authors describe
    the variants as potentially disease-related and performed functional validation
    only on the separate heterotaxy variant, so this locus is typed as a
    susceptibility rather than an established causative gene for DORV.
  evidence:
  - reference: PMID:23427188
    reference_title: "The phenotypic spectrum of ZIC3 mutations includes isolated d-transposition of the great arteries and double outlet right ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three potentially disease-related missense mutations were detected: c.49G >
      T (Gly17Cys) in a female with isolated DORV
    explanation: >-
      Reports a specific ZIC3 missense variant in a patient with isolated DORV.
  - reference: PMID:23427188
    reference_title: "The phenotypic spectrum of ZIC3 mutations includes isolated d-transposition of the great arteries and double outlet right ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ZIC3 mutations were rarely identified in isolated DORV and d-TGA suggesting
      that a subset of DORV and d-TGA may fall within the spectrum of laterality
      defects.
    explanation: >-
      Establishes both the rarity of ZIC3 variants in isolated DORV and their
      mechanistic significance as evidence for a laterality-defect route to DORV.
- name: CFC1
  gene_term:
    preferred_term: CFC1
    term:
      id: hgnc:18292
      label: CFC1
  association: Laterality-pathway (NODAL co-receptor) variants
  relationship_type: SUSCEPTIBILITY
  notes: >-
    CFC1 encodes CRYPTIC, an EGF-CFC co-receptor for NODAL signalling in the
    left-right patterning cascade. Together with NKX2-5 (historically CSX), CFC1
    was the most commonly reported monogenic locus associated with DORV in a
    systematic review of the human literature, consistent with the
    laterality-defect route to the double-outlet connection.
  evidence:
  - reference: PMID:18456715
    reference_title: "Double outlet right ventricle: aetiologies and associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations and non-synonymous sequence variants in the CFC1 and CSX genes
      were the most commonly reported monogenic loci associated with DORV in
      humans; numerous genes are reported in murine models of DORV.
    explanation: >-
      Identifies CFC1 as one of the two most frequently reported monogenic loci in
      human DORV.
- name: NKX2-5
  gene_term:
    preferred_term: NKX2-5
    term:
      id: hgnc:2488
      label: NKX2-5
  association: Cardiac transcription factor variants
  relationship_type: SUSCEPTIBILITY
  notes: >-
    NKX2-5 (formerly CSX) is a core cardiac transcription factor required for
    outflow tract and conduction system development. Together with CFC1 it was the
    most commonly reported monogenic locus associated with DORV in the human
    literature, and it is among the genes recurrently implicated in the cell
    lineages that build a mature and separated outflow tract.
  evidence:
  - reference: PMID:18456715
    reference_title: "Double outlet right ventricle: aetiologies and associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations and non-synonymous sequence variants in the CFC1 and CSX genes
      were the most commonly reported monogenic loci associated with DORV in
      humans; numerous genes are reported in murine models of DORV.
    explanation: >-
      Identifies CSX, the former name of NKX2-5, as one of the two most frequently
      reported monogenic loci in human DORV.
- name: GATA4
  gene_term:
    preferred_term: GATA4
    term:
      id: hgnc:4173
      label: GATA4
  association: Endocardial cushion developmental defect (Van Praagh type II DORV)
  relationship_type: SUSCEPTIBILITY
  notes: >-
    GATA4 is a zinc-finger cardiac transcription factor essential for endocardial
    cushion development and septation. Van Praagh type II DORV, the form combining

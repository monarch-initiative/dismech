    explanation: >-
      Documents the respiratory decompensation caused by pulmonary
      overcirculation in DORV, of which tachypnoea is the earliest sign; the
      source describes escalating respiratory support rather than naming
      tachypnoea, hence PARTIAL.
- category: Clinical
  name: Feeding difficulties
  description: >-
    Poor and prolonged feeding in infancy, driven by the tachypnoea and increased
    work of breathing that accompany pulmonary overcirculation. It is the proximate
    cause of the reduced caloric intake that, with the raised metabolic demand of
    heart failure, produces failure to thrive in the unrepaired overcirculated
    forms of DORV.
  phenotype_term:

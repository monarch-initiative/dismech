name: Double Outlet Right Ventricle
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Double outlet right ventricle (DORV) is a conotruncal ventriculo-arterial
  connection anomaly in which both great arteries arise entirely or
  predominantly from the morphologic right ventricle, so that a ventricular
  septal defect is the only outlet from the left ventricle. DORV is a purely
  morphologic descriptor rather than a single physiologic entity: it corrals a
  broad spectrum of phenotypes whose presentation, repair strategy and prognosis
  are determined not by the DORV label but by the position of the ventricular
  septal defect relative to the arterial roots (subaortic, subpulmonary, doubly
  committed, or non-committed/remote), the spatial relationship of the great
  arteries, and the presence and level of outflow tract obstruction.
  Developmentally DORV arises from disturbed cardiac neural crest migration and
  second-heart-field-driven outflow tract elongation and rotation, with failure
  of subaortic conal absorption so that aorto-mitral fibrous continuity is
  characteristically, though not obligately, absent and both arterial trunks
  remain committed to the right ventricle.
  The resulting obligatory intracardiac mixing expresses itself either as
  cyanosis (subpulmonary VSD, or any VSD with pulmonary stenosis) or as
  pulmonary overcirculation and heart failure (subaortic VSD without pulmonary
  stenosis). Management is anatomy-driven: intraventricular baffle repair for a
  committed VSD, arterial switch with a VSD-to-pulmonary-root baffle for the
  Taussig-Bing (subpulmonary VSD) form, Rastelli/REV or Nikaidoh root
  translocation when the pulmonary valve cannot support the systemic
  circulation, and staged single-ventricle palliation when a safe biventricular
  route cannot be constructed.
category: Complex
parents:
- Congenital heart defect
- Conotruncal defect
synonyms:
- DORV
- double-outlet right ventricle
- double outlet of right ventricle

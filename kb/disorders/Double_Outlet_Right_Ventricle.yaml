  - reference: PMID:18456715
    reference_title: "Double outlet right ventricle: aetiologies and associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The large number of genes associated with DORV in both humans and animal
      models and the different anatomic subtypes seen in specific aetiologies
      indicate the likelihood of several distinct pathogenetic mechanisms for
      DORV, including impairment of neural crest derivative migration and
      impairment of normal cardiac situs and looping.
    explanation: >-
      Names impairment of normal cardiac situs and looping as a pathogenetic
      mechanism of DORV distinct from the neural crest route.
  downstream:
  - target: Failure of Outflow Tract Rotation and Alignment
    description: >-
      Randomised or abnormal looping misplaces the ventricles relative to the
      arterial poles, so the outflow tract cannot align normally.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37158461
      reference_title: "Congenital heart defects caused by FOXJ1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Complex CHDs revealed by histological analysis include atrioventricular

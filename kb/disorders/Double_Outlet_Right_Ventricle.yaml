  biological_scale: TISSUE
  description: >-
    Because both arterial trunks are supported by the right ventricle, the outlet
    septum is itself a right ventricular structure, and the channel between the
    ventricles is roofed by the inner heart curvature. It is therefore the
    attachment of the outlet septum, muscular or fibrous, that determines to which
    subarterial outlet the interventricular communication is committed: the cranial

- category: Clinical
  name: Heterotaxy
  description: >-
    Abnormal left-right arrangement of the thoracic and abdominal viscera with
    atrial isomerism, present in the laterality-associated (Van Praagh type III)
    form of DORV. Its presence carries additional conduction, splenic and venous

    is the sole outlet from the left ventricle. Its position relative to the
    arterial roots defines the anatomic subtypes.
  frequency: VERY_FREQUENT
  diagnostic: true
  phenotype_term:
    preferred_term: Ventricular septal defect
    term:
      id: HP:0001629
      label: Ventricular septal defect
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each great artery should have 50% or greater of the valve diameter coming
      from the morphologic RV, and there is almost always an interventricular
      communication: ventricular septal defect (VSD) or atrioventricular septal
      defect (AVSD)
    explanation: >-
      Documents the near-universal presence of an interventricular communication
      in DORV and supports the VERY_FREQUENT frequency band.
- category: Clinical
  name: Cyanosis
  description: >-
    Central cyanosis, typically neonatal or early infantile. It is most severe in
    the Taussig-Bing (subpulmonary VSD) form, where desaturated systemic venous
    blood is streamed into the aorta, and in any DORV with significant pulmonary
    stenosis. Hypercyanotic spells resembling those of tetralogy of Fallot may
    occur.
  phenotype_term:
    preferred_term: Cyanosis
    term:
      id: HP:0000961
      label: Cyanosis
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These patients may develop increasing cyanosis over time and may even
      develop hyper-cyanotic spells like patients with TOF.
    explanation: >-
      Directly documents progressive cyanosis and hypercyanotic spells as clinical
      manifestations of DORV.
- category: Clinical
  name: Hypoxemia
  description: >-
    Reduced systemic arterial oxygen saturation resulting from obligatory

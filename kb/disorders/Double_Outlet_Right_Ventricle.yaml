    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypoplastic ventricles were present in 39%, pulmonary stenosis was present
      in 65%, and aortic arch obstruction was present in 24%.
    explanation: >-

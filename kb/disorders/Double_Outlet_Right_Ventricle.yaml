    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analyses of the pedigree of the proband revealed that in the family,
      the mutation co-segregated with DORV transmitted in an autosomal dominant
      pattern with complete penetrance.
    explanation: >-
      Establishes autosomal dominant segregation of the TBX20 variant with DORV in
      a family.
  - reference: PMID:25625280
    reference_title: "TBX20 loss-of-function mutation contributes to double outlet right ventricle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis revealed that mutant TBX20 had a significantly
      diminished transcriptional activity compared with its wild-type counterpart.
    explanation: >-
      Provides the loss-of-function evidence supporting pathogenicity of the TBX20
      variant.
- name: CHD7
  gene_term:
    preferred_term: CHD7
    term:
      id: hgnc:20626
      label: CHD7
  association: CHARGE syndrome (epigenetic regulator)
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    CHD7 encodes a chromodomain helicase DNA-binding protein whose mutation causes
    CHARGE syndrome through perturbation of H3K4 methylation. Congenital heart
    defects occur in 75 to 80 per cent of individuals with CHARGE and the spectrum
    includes DORV, making CHD7 the principal epigenetic-regulator route to a
    syndromic DORV. De novo enrichment of variants in histone-modifying enzymes has
    also been reported in severe congenital heart disease cohorts that included DORV
    patients.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      mutations in the CHD7 genes result in CHARGE association with the
      perturbation of the H3K4 methylation
    explanation: >-
      Identifies CHD7 mutation as the cause of CHARGE association and names the
      epigenetic mechanism involved.
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital heart defects occur in 75% –80% of the patients with CHARGE
      association including DORV
    explanation: >-
      Quantifies the congenital heart defect burden of CHARGE association and
      names DORV explicitly among the defects that occur in it.
- name: LRP1
  gene_term:
    preferred_term: LRP1
    term:
      id: hgnc:6692
      label: LRP1
  association: Cardiac neural crest lineage perturbation (mouse model of DORV)
  relationship_type: SUSCEPTIBILITY
  notes: >-
    LRP1 encodes the low-density lipoprotein receptor-related protein 1. A mouse
    Lrp1 mutant produces DORV through perturbation of the cardiac neural crest
    lineage, providing direct experimental support for the neural-crest route
    modelled in the pathophysiology section. The evidence is model-organism only,
    so the locus is typed as a mechanistic susceptibility.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      our group previously reported the evidence of the perturbance of cardiac
      neural crest lineage that resulted in DORV in a mouse model of Lrp1 mutation
    explanation: >-
      Reports an Lrp1 mouse model in which cardiac neural crest perturbation
      produces DORV.
- name: FOXJ1
  gene_term:
    preferred_term: FOXJ1
    term:
      id: hgnc:3816
      label: FOXJ1
  association: Motile ciliopathy gene causing isolated congenital heart defects
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    FOXJ1 is the master transcriptional regulator of motile ciliogenesis, including
    the cilia of the embryonic left-right organiser. A truncating FOXJ1 variant
    (c.784_799dup; p.Glu267Glyfs*12) was identified by clinical exome sequencing in
    a patient with isolated congenital heart defects comprising atrial and
    ventricular septal defects, DORV and transposition of the great arteries. The
    variant failed to induce ectopic cilia in vivo or to transactivate a downstream
    ciliary target, and Foxj1 loss-of-function mice show randomised heart looping
    with DORV. FOXJ1 variants are nevertheless an infrequent cause of heterotaxy or
    heterotaxy-related congenital heart disease. The relationship is typed
    CAUSATIVE for the reported proband, but rests on a single family with
    functional support rather than on an established gene-disease association for
    DORV as a whole.
  evidence:
  - reference: PMID:37158461
    reference_title: "Congenital heart defects caused by FOXJ1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a novel truncating FOXJ1 variant (c.784_799dup;
      p.Glu267Glyfs*12) identified by clinical exome sequencing from a patient
      with isolated congenital heart defects (CHD) which included atrial and
      ventricular septal defects, double outlet right ventricle (DORV) and
      transposition of the great arteries.
    explanation: >-
      Reports the specific FOXJ1 variant identified in a patient whose phenotype
      included DORV.
  - reference: PMID:37158461
    reference_title: "Congenital heart defects caused by FOXJ1."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variant analysis of patients with heterotaxy or heterotaxy-related CHD
      indicates that pathogenic variants in FOXJ1 are an infrequent cause of
      heterotaxy.
    explanation: >-
      Bounds the contribution of FOXJ1, supporting its classification as a rare
      rather than common cause of DORV.
- name: SHROOM3
  gene_term:
    preferred_term: SHROOM3
    term:
      id: hgnc:30422
      label: SHROOM3
  association: Planar cell polarity effector; DORV in mouse loss-of-function models
  relationship_type: SUSCEPTIBILITY
  notes: >-
    SHROOM3 is an actomyosin cytoskeletal effector acting downstream of
    Dishevelled 2 in the noncanonical Wnt planar cell polarity pathway. It is
    expressed in ventricular cardiomyocytes, cardiac neural crest cells and second
    heart field cells populating the outflow tract, and Shroom3 gene-trap mice show
    variably penetrant DORV. The human evidence is candidate-level, so this locus
    is recorded as a mechanistic susceptibility rather than an established DORV
    gene.
  evidence:
  - reference: PMID:32511952
    reference_title: "SHROOM3 is downstream of the planar cell polarity pathway and loss-of-function results in congenital heart defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We demonstrate that Shroom3gt/gt mice exhibit variable penetrance of a
      spectrum of CHDs that include ventricular septal defects, double outlet
      right ventricle, and thin left ventricular myocardium.
    explanation: >-
      Demonstrates that loss of Shroom3 produces DORV in a mouse model.
  - reference: PMID:32511952
    reference_title: "SHROOM3 is downstream of the planar cell polarity pathway and loss-of-function results in congenital heart defects."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We previously implicated a novel CHD candidate gene, SHROOM3, in a patient
      with CHD.
    explanation: >-
      Records the human evidence as candidate-level, which is why this entry is
      typed as a susceptibility rather than a causative locus.
environmental:
- name: Maternal diabetes mellitus
  influences_mechanisms:
  - target: Cardiac Neural Crest and Second Heart Field Disruption
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Maternal diabetes disturbs the neural crest and second heart field
      populations that build the outflow tract. Support is animal-derived, so
      this is recorded as a predisposing association pending human data.
    evidence:
    - reference: PMID:18456715
      reference_title: "Double outlet right ventricle: aetiologies and associations."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Animal studies implicate maternal diabetes and prenatal exposure to ethanol, retinoids, theophylline, and valproate in DORV teratogenesis."
      explanation: >-
        Animal studies implicate maternal diabetes in this malformation.
        Support is PARTIAL because the evidence is experimental animal work
        and the claim here concerns human development.
  description: >-
    Maternal diabetes is a recurrently reported non-genetic risk factor for DORV in
    both the human case literature and animal studies of DORV teratogenesis.
  effect: RISK
  evidence:
  - reference: PMID:18456715
    reference_title: "Double outlet right ventricle: aetiologies and associations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Animal studies implicate maternal diabetes and prenatal exposure to ethanol,
      retinoids, theophylline, and valproate in DORV teratogenesis.
    explanation: >-
      Names maternal diabetes among the exposures implicated in DORV
      teratogenesis; the supporting studies cited are animal studies, hence
      MODEL_ORGANISM.
- name: Prenatal teratogen exposure
  exposure_term:
    preferred_term: teratogen exposure
    term:
      id: XCO:0000512
      label: teratogen
  influences_mechanisms:
  - target: Cardiac Neural Crest and Second Heart Field Disruption
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Ethanol, retinoids, theophylline and valproate are implicated as a group
      acting on the same neural crest and second heart field populations,
      without a single shared mechanism being established.
    evidence:
    - reference: PMID:18456715
      reference_title: "Double outlet right ventricle: aetiologies and associations."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Animal studies implicate maternal diabetes and prenatal exposure to ethanol, retinoids, theophylline, and valproate in DORV teratogenesis."
      explanation: >-
        Animal studies implicate prenatal ethanol, retinoid, theophylline and
        valproate exposure in this malformation. Support is PARTIAL because
        the evidence is experimental animal work.
  description: >-
    Prenatal exposure to ethanol, retinoids, theophylline and valproate has been
    implicated in DORV teratogenesis in animal studies. Retinoic acid is
    particularly plausible mechanistically because tightly bounded retinoic acid
    signalling is required to maintain and differentiate the second-heart-field
    progenitors that elongate and septate the outflow tract, so both deficient and
    excessive signalling perturb the same morphogenetic step that DORV reports.
  effect: RISK
  chemicals:
  - ethanol
  - retinoids
  - theophylline
  - valproate
  evidence:
  - reference: PMID:18456715
    reference_title: "Double outlet right ventricle: aetiologies and associations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Animal studies implicate maternal diabetes and prenatal exposure to ethanol,
      retinoids, theophylline, and valproate in DORV teratogenesis.
    explanation: >-
      Directly names the teratogenic exposures implicated in DORV in animal
      studies.
treatments:
- name: Prostaglandin E1
  description: >-
    Intravenous prostaglandin E1 maintains ductal patency after birth, preserving
    pulmonary blood flow in DORV with severe pulmonary stenosis or atresia and
    systemic perfusion when there is aortic arch obstruction. It is a bridge to
    definitive repair rather than a treatment of the anatomy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prostaglandin E1
      term:
        id: CHEBI:15544
        label: prostaglandin E1
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      prostaglandin E1 infusion and/or atrial septostomy should be considered
    explanation: >-
      Identifies prostaglandin E1 as the pharmacologic intervention when pulmonary
      blood flow is inadequate in DORV.
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These patients will need their patent ductus arteriosus (PDA) to be kept
      patent, either with prostaglandin E1 administration or PDA stent placement
    explanation: >-
      Confirms maintenance of ductal patency with prostaglandin E1 (or a ductal
      stent) as standard preoperative management.
- name: Diuretic therapy for pulmonary overcirculation
  description: >-
    Aggressive diuresis is used to control the pulmonary overcirculation and
    congestive physiology of DORV with an unobstructed pulmonary outflow while
    awaiting repair; escalation to respiratory support and intubation may be
    required.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: furosemide
      term:
        id: CHEBI:47426
        label: furosemide
  target_mechanisms:
  - target: Pulmonary Overcirculation and Ventricular Volume Overload
    treatment_effect: INHIBITS
    description: >-
      Diuresis reduces the volume load and pulmonary congestion generated by the
      large left-to-right shunt without altering the underlying anatomy.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      patients with subaortic VSD or subpulmonary VSD can have pulmonary
      over-circulation requiring aggressive diuresis
    explanation: >-
      Directly documents diuresis as the medical management of pulmonary
      overcirculation in DORV.
- name: Palliative control of pulmonary blood flow
  description: >-
    Interim procedures used before definitive repair, or as the first stage of a
    single-ventricle pathway, to balance pulmonary and systemic flow: pulmonary
    artery banding when there is overcirculation, and a systemic-to-pulmonary
    (central) shunt or ductal stent when pulmonary blood flow is inadequate.
    Balloon atrial septostomy is used urgently when a desaturated infant has
    inadequate atrial-level mixing and a poor cardiac output state.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Cardiac Therapeutic Procedure
    term:
      id: NCIT:C80430
      label: Cardiac Therapeutic Procedure
  target_mechanisms:
  - target: Obligatory Intracardiac Mixing and VSD-Dependent Streaming
    treatment_effect: MODULATES
    description: >-
      Banding, shunting or septostomy rebalances the ratio of pulmonary to
      systemic flow without correcting the underlying connection.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Such palliative procedures include PA band placement for babies with
      pulmonary over-circulation, PDA stent, or operative central shunt creation
      for those with inadequate pulmonary blood
    explanation: >-
      Enumerates the palliative flow-control procedures used in DORV and the
      physiology each addresses.
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Consideration should be given to the urgent need for atrial septostomy in a
      patient who is desaturated and has evidence of a poor cardiac output state.
    explanation: >-
      Documents the indication for urgent balloon atrial septostomy in DORV.
- name: Kawashima procedure
  description: >-
    An intraventricular repair for DORV-TGA in which the ventricular septal defect
    is baffled to the aortic valve with patch enlargement of the ventriculotomy,
    after complete resection of the conus. It suits patients with side-by-side
    great arteries whose coronary anatomy precludes root translocation, and
    patients whose pulmonary valve is not of adequate size to support the systemic
    circulation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Cardiac Surgery
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  target_mechanisms:
  - target: Persistence of the Subaortic Conus
    treatment_effect: INHIBITS
    description: >-
      Complete resection of the conus removes the muscular sleeve that separates
      the left ventricle from the aortic valve, allowing the VSD to be rerouted to
      the aorta.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The Kawashima procedure: The VSD is baf
    explanation: >-
      Names the Kawashima procedure as one of the defined anatomic repairs for
      DORV-TGA.
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In this case, the conus should be resected completely to allow rerouting the
      VSD to the aortic valve
    explanation: >-
      Describes the conal resection that is the mechanistic core of the procedure.
- name: Intraventricular baffle repair
  description: >-
    The standard biventricular repair for a committed ventricular septal defect: a
    patch tunnel is constructed from the left ventricle through the VSD to the
    aortic valve, restoring a series circulation. For a perimembranous or subaortic
    defect the tunnel is relatively straight and can usually be built through the
    right atrium; for a doubly committed defect a right ventriculotomy or
    transpulmonary approach is generally required. A restrictive VSD is enlarged by
    resecting the ventriculo-infundibular fold and conal septum to prevent late
    subaortic obstruction. Repair is recommended within the first six months of
    life to limit the effects of pulmonary overcirculation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Cardiac Surgery
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  target_mechanisms:
  - target: Obligatory Intracardiac Mixing and VSD-Dependent Streaming
    treatment_effect: INHIBITS
    description: >-
      The baffle abolishes obligatory intracardiac mixing by giving the left
      ventricle a dedicated outlet to the aorta.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      When the VSD is perimembranous or subaortic, a relatively straight
      intraventricular tunnel can be created between the VSD and the aortic valve
    explanation: >-
      Describes the intraventricular baffle repair and the anatomy for which it is
      most straightforward.
  - reference: PMID:38134423
    reference_title: "Multicentre study on late outcomes of biventricular repair of double outlet right ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall survival at 10 years was 86%. This study shows a trend towards
      satisfactory early and late outcomes in BVR of simple DORV with committed
      VSD, compared to complex DORV with ncVSD.
    explanation: >-
      Provides late outcome data for biventricular repair and shows the advantage
      of a committed VSD over a non-committed one.
- name: Arterial switch operation with VSD-to-pulmonary-root baffle
  description: >-
    The preferred anatomic repair for the Taussig-Bing (subpulmonary VSD) form,
    and also used for selected non-committed VSDs. The ventricular septal defect is
    baffled to the pulmonary root, which then becomes the neo-aorta after the great
    arteries are transected and switched with coronary transfer, so the
    intraventricular tunnel is short and does not impinge on the tricuspid valve.
    Concomitant aortic arch repair is required in a large minority. In the largest
    reported single-centre series (225 children) early mortality was 12.9 per cent
    with 10-year survival of 85 per cent; a smaller 34-patient series reported 11
    per cent hospital mortality. Reintervention, most often for pulmonary stenosis,
    is common.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Cardiac Surgery
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  target_mechanisms:
  - target: Obligatory Intracardiac Mixing and VSD-Dependent Streaming
    treatment_effect: INHIBITS
    description: >-
      Switching the arterial trunks after baffling the VSD to the pulmonary root
      restores concordant ventriculo-arterial connections and abolishes the
      transposition-like streaming of the Taussig-Bing anomaly.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      this is the most common surgical repair when the pulmonary valve is suitable
      for systemic circulation
    explanation: >-
      Identifies the VSD-to-pulmonary-artery baffle plus arterial switch as the
      most common repair for the transposition-type DORV.
  - reference: PMID:35691468
    reference_title: "Mid-Term Outcomes of Primary Arterial Switch Operation for Taussig-Bing Anomaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early mortality was 12.9% (29/225) with a satisfactory long-term survival
      rate (10-year survival rate 85.0%).
    explanation: >-
      Provides early mortality and 10-year survival for primary arterial switch in
      the Taussig-Bing anomaly.
  - reference: PMID:35691468
    reference_title: "Mid-Term Outcomes of Primary Arterial Switch Operation for Taussig-Bing Anomaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      87 children (38.7%) received concomitant aortic arch repair.
    explanation: >-
      Quantifies the frequency of concomitant aortic arch repair, reflecting the
      arch obstruction characteristic of this subtype.
  - reference: PMID:32795522
    reference_title: "Anatomic Risk Factors for Reintervention After Arterial Switch Operation for Taussig-Bing Anomaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, 41% patients underwent 26 reinterventions for PS.
    explanation: >-
      Documents the high rate of reintervention for pulmonary stenosis after
      arterial switch in the Taussig-Bing anomaly.
- name: Rastelli-type repair with right ventricle to pulmonary artery conduit
  description: >-
    When pulmonary outflow obstruction is valvar and the pulmonary valve cannot
    support the systemic circulation, the ventricular septal defect is baffled to
    the aorta and right ventricle to pulmonary artery continuity is restored with a
    valved conduit (Rastelli) or, in the REV variant, by direct anastomosis of the
    pulmonary trunk to the infundibulum after a LeCompte manoeuvre. Somatic
    outgrowth and stenosis of the conduit make reoperation predictable, and
    Rastelli-type repair carries higher late mortality and reintervention risk than
    other pathways.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Cardiac Surgery
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  target_mechanisms:
  - target: Outlet Septum Malalignment and Outflow Tract Obstruction
    treatment_effect: BYPASSES
    description: >-
      A valved right ventricle to pulmonary artery conduit bypasses the obstructed
      native right ventricular outflow tract.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The Rastelli procedure: It is one that includes closing the VSD to the aorta
      and placing a valved RV to PA conduit for RVOT reconstruction.
    explanation: >-
      Defines the Rastelli procedure as used in DORV.
  - reference: PMID:17903515
    reference_title: "Determinants of repair type, reintervention, and mortality in 393 children with double-outlet right ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For complex double-outlet right ventricle, Rastelli-type repair increased
      early reintervention risk (P = .04) and late post-repair mortality (P = .02),
      whereas the arterial switch operation increased early post-repair mortality
      (P = .02) with a benefit of improved late post-repair survival.
    explanation: >-
      Quantifies the reintervention and late mortality penalty of Rastelli-type
      repair relative to the arterial switch in complex DORV.
- name: Nikaidoh procedure and root translocation
  description: >-
    Posterior translocation of the aortic root, or double root translocation,
    creates a straight left ventricular outflow tract when routing the VSD to the
    aorta is not possible or would require a long akinetic tunnel at risk of late
    subaortic stenosis. It is favoured for remote ventricular septal defects,
    straddling atrioventricular valves and significant right ventricular
    hypoplasia. A pulmonary annulus smaller than 5 mm and a coronary artery
    crossing the right ventricular outflow tract at the transection level are
    contraindications.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Cardiac Surgery
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  target_mechanisms:
  - target: Double Outlet Ventriculo-Arterial Connection
    treatment_effect: RESTORES
    description: >-
      Translocating the aortic root posteriorly re-establishes a direct left
      ventricle to aorta connection rather than tunnelling around the defect.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A Nikaidoh procedure may result in a more acceptable anatomic repair with
      better alignment between the LV and the aorta and preservation of the right
      ventricular volume
    explanation: >-
      States the anatomic rationale for the Nikaidoh root translocation in DORV.
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      we do not offer a Nikaidoh procedure to patients with a pulmonary annulus
      size of less than 5 mm
    explanation: >-
      Documents a specific anatomic contraindication to the procedure.
- name: Single-ventricle palliation
  description: >-
    When a safe biventricular route cannot be constructed, staged univentricular
    palliation is used: initial control of pulmonary blood flow with a
    systemic-to-pulmonary shunt, ductal stent or pulmonary artery band, then a
    bidirectional cavopulmonary connection, then total cavopulmonary (Fontan)
    completion at two to three years of age. Any restrictive ventricular septal
    defect should be enlarged at or before Fontan completion.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Cardiac Surgery
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  target_mechanisms:
  - target: Left Ventricular Hypoplasia and Loss of Biventricular Repair Substrate
    treatment_effect: BYPASSES
    description: >-
      Staged cavopulmonary palliation works around the inadequate left ventricle
      rather than attempting to recruit it into a biventricular circulation.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Contraindications to biventricular repair include severe ventricular
      hypoplasia, abnormal tricuspid chordae, multiple VSDs, and a straddling
      mitral valve.
    explanation: >-
      Defines the anatomic circumstances that select patients into the
      single-ventricle pathway.
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      a bidirectional cavopulmonary connection is created
    explanation: >-
      Documents the staged cavopulmonary sequence of the univentricular pathway in
      DORV.
- name: Genetic evaluation and counselling
  description: >-
    Because more than 40 per cent of DORV patients have a chromosomal abnormality
    and syndromic and laterality disorders are common, clinical genetics assessment
    with chromosomal microarray, and exome or genome sequencing when microarray is
    non-diagnostic, is part of standard care. It informs recurrence counselling,
    prognosis and extracardiac surveillance rather than altering the cardiac
    repair.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      More than 40% of patients with DORV have associated chromosomal
      abnormalities
    explanation: >-
      Establishes the high prior probability of a chromosomal diagnosis that
      justifies routine genetic evaluation in DORV.
inheritance:
- name: Multifactorial and sporadic
  description: >-
    Most DORV is sporadic and multifactorial, arising from a combination of rare
    and common variation, developmental stochasticity and maternal or environmental
    influences. More than 40 per cent of patients nevertheless carry a chromosomal
    abnormality, most commonly trisomy 13, trisomy 18 or a 22q11.2 deletion, and
    recurrence counselling should be based on the identified syndrome or gene when
    one is found.
  evidence:
  - reference: PMID:18456715
    reference_title: "Double outlet right ventricle: aetiologies and associations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chromosomal abnormalities were present in 61 of the 149 cases of DORV.
      Trisomies 13 and 18, and del 22q11 were the most commonly associated
      cytogenetic lesions; different anatomic subtypes of DORV were noted in
      trisomies 13 and 18 versus del 22q11.
    explanation: >-
      Documents the heterogeneous chromosomal contribution that underlies the
      multifactorial, largely sporadic inheritance pattern of DORV.
- name: Autosomal dominant (rare monogenic families)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: COMPLETE
  description: >-
    A minority of DORV is familial and segregates in an autosomal dominant pattern.
    Reported examples include a TBX20 p.R143W kindred and a MEF2C p.R15C pedigree,
    both with complete penetrance in the families described.
  evidence:
  - reference: PMID:25625280
    reference_title: "TBX20 loss-of-function mutation contributes to double outlet right ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analyses of the pedigree of the proband revealed that in the family,
      the mutation co-segregated with DORV transmitted in an autosomal dominant
      pattern with complete penetrance.
    explanation: >-
      Documents autosomal dominant transmission of DORV with complete penetrance in
      a TBX20 kindred.
- name: X-linked (ZIC3-associated laterality spectrum)
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    A small subset of DORV falls within the X-linked laterality spectrum associated
    with ZIC3, the gene classically causing heterotaxy with complex congenital heart
    disease in males, with affected and carrier females also reported.
  evidence:
  - reference: PMID:23427188
    reference_title: "The phenotypic spectrum of ZIC3 mutations includes isolated d-transposition of the great arteries and double outlet right ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease causing mutations for heterotaxy syndrome were first identified in the
      X-linked laterality gene, ZIC3.
    explanation: >-
      Establishes ZIC3 as an X-linked laterality gene, the inheritance mode relevant
      to the ZIC3-associated subset of DORV.
diagnosis:
- name: Fetal echocardiography
  description: >-
    Prenatal echocardiography can establish the DORV diagnosis with high accuracy
    and define the features that predict the surgical pathway, namely VSD position,
    great-artery relationship, ventricular size, outflow tract anatomy and coronary
    anatomy. In a consecutive single-centre series of 46 prenatally diagnosed cases,
    96 per cent were correctly diagnosed and every child received the repair type
    predicted before birth.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were 46 cases in all and 96% of them were correctly diagnosed.
    explanation: >-
      Quantifies the accuracy of prenatal echocardiographic diagnosis of DORV.
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      fetal echocardiography plays a crucial role in prenatal diagnosis
    explanation: >-
      Establishes fetal echocardiography as the primary prenatal diagnostic
      modality for DORV.
- name: Transthoracic echocardiography
  description: >-
    The postnatal diagnostic modality of choice. It delineates the intracardiac
    anatomy and associated haemodynamics, and in particular the position of the
    ventricular septal defect relative to the semilunar valves, the degree of aortic
    override, and whether atrioventricular valve chordal attachments straddle the
    defect, all of which govern surgical planning.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      transthoracic echocardiography remains the diagnostic modality of choice
    explanation: >-
      Identifies transthoracic echocardiography as the first-line postnatal
      diagnostic test in DORV.
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The location of the VSD relative to the semilunar valves is key to surgical
      planning and management.
    explanation: >-
      Explains what the echocardiogram must establish, namely the VSD position that
      defines the anatomic subtype and the repair.
- name: Cardiac computed tomography
  description: >-
    High-resolution cardiac CT is used for pre- and postoperative assessment when
    the acoustic window is limited or metallic implants are present. It defines
    coronary artery origins, branch pulmonary arteries and arch anatomy, and its
    three-dimensional reconstructions and printed models support planning of complex
    intraventricular baffle pathways.
  evidence:
  - reference: PMID:37818164
    reference_title: "Double outlet right ventricle."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CT serves as a safer and high-quality alternative to diagnostic cardiac
      catheterization or MRI
    explanation: >-
      Positions cardiac CT within the DORV diagnostic pathway relative to
      catheterisation and MRI.
- name: Cardiovascular magnetic resonance
  description: >-
    Cardiovascular magnetic resonance is the reference modality for the
    three-dimensional geometry that determines whether DORV can be repaired
    biventricularly. Preoperatively it resolves the spatial relationship between
    the ventricular septal defect and the two arterial roots, which is the
    information required to decide whether an unobstructed intraventricular baffle
    can be constructed and to plan its course; CMR datasets are the input to
    virtual, 3D-printed and virtual-reality baffle-planning models, which are used
    preoperatively to test whether an unobstructed baffle pathway can actually be
    constructed and therefore to predict candidacy for biventricular repair. It
    also supplies biventricular volumes and function and, with 2D and 4D flow,
    quantifies outflow tract dimensions and shunt haemodynamics, all without
    ionising radiation.
    Postoperatively it is used for surveillance of late structural and functional
    complications such as baffle obstruction, conduit and outflow tract disease and
    ventricular dysfunction. Its limitations in this population are long
    acquisition times, the need for breath-holding or anaesthesia in young
    children, and non-conditional implanted devices.
  evidence:
  - reference: PMID:33689734
    reference_title: "Modeling Tool for Rapid Virtual Planning of the Intracardiac Baffle in Double-Outlet Right Ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Preoperative imaging is a critical tool for assessing the feasibility of a
      biventricular repair and for envisioning the potential baffle pathway.
    explanation: >-
      States the preoperative imaging task in DORV that CMR is used to answer,
      namely feasibility of biventricular repair and the baffle pathway.
  - reference: PMID:33689734
    reference_title: "Modeling Tool for Rapid Virtual Planning of the Intracardiac Baffle in Double-Outlet Right Ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Segmentation and 3D printing of CMR based models has been demonstrated to
      inform the surgical planning process for DORV.
    explanation: >-
      Establishes CMR as the imaging substrate for DORV-specific surgical planning
      models.
  - reference: PMID:33689734
    reference_title: "Modeling Tool for Rapid Virtual Planning of the Intracardiac Baffle in Double-Outlet Right Ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Virtual modeling of the baffle pathway by using cardiac magnetic resonance,
      creation of physical templates for the baffle, and visualization in virtual
      reality are feasible and may be beneficial for preoperative planning of
      complex biventricular repairs in DORV.
    explanation: >-
      Documents CMR-based virtual baffle planning as feasible and potentially
      beneficial for preoperative planning of complex DORV repair.
  - reference: PMID:39062326
    reference_title: "Importance of Cardiovascular Magnetic Resonance Applied to Congenital Heart Diseases in Pediatric Age: A Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The application of cardiac magnetic resonance imaging (CMRI) in this
      population allows for obtaining detailed information on the defects without
      the necessity of ionizing radiations.
    explanation: >-
      Supports the radiation-free advantage of CMR in the paediatric congenital
      heart disease population to which DORV belongs.
  - reference: PMID:39062326
    reference_title: "Importance of Cardiovascular Magnetic Resonance Applied to Congenital Heart Diseases in Pediatric Age: A Narrative Review."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      giving essential information in the intervention planning and optimal

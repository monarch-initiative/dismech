  description: >-
    Interferon-gamma secreted by tumor-infiltrating CD8+ T cells induces PD-L1
    (CD274) expression on lung carcinoma cells via JAK/STAT1 signaling,
    engaging PD-1 on effector T cells to suppress cytotoxic antitumor immunity.
  evidence:
  - reference: PMID:31627272
    reference_title: "Programmed Death Ligand 1 Indicates Pre-Existing Adaptive Immune Response by Tumor-Infiltrating CD8(+) T Cells in Non-Small Cell Lung Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings demonstrate that PD-L1 expression indicates an adaptive immune resistance mechanism adopted by tumor cells in the aversion of immunogenic destruction by CD8+ TILs."
    explanation: Patient tumor IHC and TCGA analyses establish PD-L1 upregulation as an adaptive immune-evasion mechanism against CD8+ TILs in NSCLC.
  - reference: PMID:31627272

  diagnosis_term:
    preferred_term: Molecular Analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >-
    Sequencing and fusion testing of NSCLC tumor tissue for actionable driver
    alterations (including EGFR, ALK, ROS1, KRAS, BRAF, MET, and HER2) guides
    selection of targeted therapies.
  evidence:
  - reference: PMID:33435440
    reference_title: "Molecular Epidemiology of the Main Druggable Genetic Alterations in Non-Small Cell Lung Cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Testing the presence of driver mutations in specific genes in lung tumors has thus radically changed the clinical management and outcomes of the disease."
    explanation: Establishes molecular driver profiling as essential for guiding targeted therapy in lung carcinoma.

    Platinum-based systemic cytotoxic chemotherapy (such as cisplatin or
    carboplatin with etoposide in SCLC, or platinum doublets in NSCLC) targets
    rapidly dividing tumor cells by disrupting DNA replication and repair.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:

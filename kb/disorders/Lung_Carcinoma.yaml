      explanation: Supports concurrent thoracic radiotherapy for locally advanced intrathoracic disease.
  - target: Unrestrained Neuroendocrine Tumor Cell Proliferation in SCLC
    treatment_effect: INHIBITS
    description: >-
      Ionizing radiation damages DNA synthesis, replication, and repair in
      rapidly proliferating SCLC tumor cells.
    evidence:
    - reference: PMID:33446664
      reference_title: "Small-cell lung cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Most therapeutic agents commonly used in patients with SCLC, including DNA cross-linkers (such as cisplatin), topoisomerase inhibitors (such as etoposide or topotecan) or γ-radiation, directly or indirectly target DNA synthesis, replication and repair."
      explanation: Identifies ionizing radiation as targeting DNA replication and repair in rapidly dividing SCLC cells.
  evidence:
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "SCLC is initially exceptionally responsive to cytotoxic therapies — up to 25% of patients with early-stage SCLC achieve long-term control of disease with concurrent chemoradiotherapy (CRT) and response rates are consistently over 60%, even in patients with metastatic disease."
    explanation: Demonstrates long-term disease control with concurrent chemoradiotherapy in non-metastatic SCLC.
  - reference: PMID:30441934
    reference_title: "Lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Radiotherapy is an integral part of treatment of either type of lung cancer."
    explanation: Establishes radiation therapy as a core modality across both NSCLC and SCLC.
- name: Surgical Resection
  description: >-
    Anatomic surgical resection (lobectomy or segmentectomy with mediastinal
    lymph node evaluation) with curative intent for localized early-stage
    non-small cell lung carcinoma and selected clinical stage I-II SCLC.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
  target_mechanisms:
  - target: Intrathoracic Local Invasion and Airway Compression
    treatment_effect: INHIBITS
    description: Complete surgical resection removes the primary intrathoracic tumor mass in localized disease.
    evidence:
    - reference: PMID:19445746
      reference_title: "Lung cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "Adenocarcinoma is the main non-small cell pathology, and is treated initially with surgery."
      explanation: Supports primary surgical removal of localized NSCLC tumor burden.
  evidence:
  - reference: PMID:19445746
    reference_title: "Lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Adenocarcinoma is the main non-small cell pathology, and is treated
      initially with surgery."
    explanation: Notes surgery as initial treatment for localized lung adenocarcinoma.
- name: EGFR Tyrosine Kinase Inhibitor Therapy (Osimertinib)
  description: >-
    Osimertinib, an oral third-generation irreversible EGFR tyrosine kinase
    inhibitor active against sensitizing EGFR mutations (exon 19 deletion and
    L858R) and T790M resistance mutations, is first-line targeted therapy for
    EGFR-mutated advanced NSCLC.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: osimertinib
      term:
        id: CHEBI:90943
        label: osimertinib
  target_mechanisms:
  - target: EGFR Activating Mutations in NSCLC
    treatment_effect: INHIBITS
    description: >-
      Osimertinib irreversibly inhibits mutant EGFR tyrosine kinase signaling in
      EGFR-mutated NSCLC.
    evidence:
    - reference: PMID:29151359
      reference_title: "Osimertinib in Untreated EGFR-Mutated Advanced Non-Small-Cell Lung Cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Osimertinib is an oral, third-generation, irreversible epidermal growth factor receptor tyrosine kinase inhibitor (EGFR-TKI) that selectively inhibits both EGFR-TKI-sensitizing and EGFR T790M resistance mutations."
      explanation: Defines the direct mechanism of osimertinib against mutant EGFR kinase activity in NSCLC.
  evidence:
  - reference: PMID:29151359
    reference_title: "Osimertinib in Untreated EGFR-Mutated Advanced Non-Small-Cell Lung Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median progression-free survival was significantly longer with osimertinib than with standard EGFR-TKIs (18.9 months vs. 10.2 months; hazard ratio for disease progression or death, 0.46; 95% confidence interval [CI], 0.37 to 0.57; P<0.001)."
    explanation: Phase 3 FLAURA trial demonstrating superior progression-free survival with first-line osimertinib in EGFR-mutated advanced NSCLC.
- name: ALK Tyrosine Kinase Inhibitor Therapy (Alectinib)
  description: >-
    Alectinib, an oral CNS-penetrant selective ALK tyrosine kinase inhibitor, is
    standard first-line targeted therapy for ALK-rearranged advanced NSCLC,
    achieving superior progression-free survival and central nervous system
    disease control compared with crizotinib.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: alectinib
      term:
        id: CHEBI:90936
        label: alectinib
  target_mechanisms:
  - target: ALK Oncogenic Fusions in NSCLC
    treatment_effect: INHIBITS
    description: >-
      Alectinib selectively inhibits oncogenic ALK fusion tyrosine kinase
      signaling in systemic and CNS lesions of ALK-positive NSCLC.
    evidence:
    - reference: PMID:28586279
      reference_title: "Alectinib versus Crizotinib in Untreated ALK-Positive Non-Small-Cell Lung Cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Alectinib, a highly selective inhibitor of anaplastic lymphoma kinase (ALK), has shown systemic and central nervous system (CNS) efficacy in the treatment of ALK-positive non-small-cell lung cancer (NSCLC)."
      explanation: Establishes selective inhibition of oncogenic ALK kinase signaling as the mechanism of alectinib in ALK-positive NSCLC.
  evidence:
  - reference: PMID:28586279
    reference_title: "Alectinib versus Crizotinib in Untreated ALK-Positive Non-Small-Cell Lung Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As compared with crizotinib, alectinib showed superior efficacy and lower toxicity in primary treatment of ALK-positive NSCLC."
    explanation: Phase 3 ALEX trial establishing first-line superiority of alectinib in untreated ALK-positive advanced NSCLC.
- name: KRAS G12C Inhibitor Therapy (Sotorasib)
  description: >-
    Sotorasib covalently binds the mutant cysteine residue of GDP-bound KRAS
    p.G12C, locking the oncoprotein in an inactive conformation and producing
    durable responses in previously treated KRAS p.G12C-mutated advanced NSCLC.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: sotorasib
      term:
        id: CHEBI:178199
        label: sotorasib
  target_mechanisms:
  - target: KRAS Activating Mutations in NSCLC
    treatment_effect: INHIBITS
    description: >-
      Sotorasib selectively inhibits mutant KRAS p.G12C signaling in
      KRAS-mutated NSCLC.
    evidence:
    - reference: PMID:34096690
      reference_title: "Sotorasib for Lung Cancers with KRAS p.G12C Mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Sotorasib showed anticancer activity in patients with KRAS p.G12C-mutated advanced solid tumors in a phase 1 study, and particularly promising anticancer activity was observed in a subgroup of patients with non-small-cell lung cancer (NSCLC)."
      explanation: Links sotorasib antitumor activity to KRAS p.G12C-mutated NSCLC.
  evidence:
  - reference: PMID:34096690
    reference_title: "Sotorasib for Lung Cancers with KRAS p.G12C Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this phase 2 trial, sotorasib therapy led to a durable clinical benefit without new safety signals in patients with previously treated KRAS p.G12C-mutated NSCLC."
    explanation: Phase 2 CodeBreaK100 trial demonstrating durable clinical benefit (37.1% objective response rate) with sotorasib in previously treated KRAS p.G12C-mutated NSCLC.
- name: PD-L1 Checkpoint Blockade with Platinum-Etoposide in SCLC
  description: >-
    First-line addition of an anti-PD-L1 monoclonal antibody (atezolizumab or
    durvalumab) to platinum-etoposide chemotherapy followed by maintenance
    anti-PD-L1 immunotherapy improves progression-free and overall survival in
    newly diagnosed extensive-stage small cell lung cancer.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: atezolizumab
      term:
        id: NCIT:C106250
        label: Atezolizumab
    - preferred_term: durvalumab
      term:
        id: NCIT:C103194
        label: Durvalumab
  target_mechanisms:
  - target: PD-L1-Mediated Adaptive Immune Evasion
    treatment_effect: INHIBITS
    description: >-
      Anti-PD-L1 antibodies block PD-L1 checkpoint inhibition of T cell
      antitumor responses when combined with platinum-etoposide in SCLC.
    evidence:
    - reference: PMID:33446664
      reference_title: "Small-cell lung cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Immunotherapies that enhance the activity of T cells against cancer cells, such as blockade of CTLA4, PD1 or PDL1, have some beneficial effects in patients with SCLC117,118."
      explanation: Establishes blockade of PD-L1 checkpoint signaling to enhance antitumor T cell activity in SCLC.
  evidence:
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The addition of either of two anti-PDL1 monoclonal antibodies (atezolizumab or durvalumab) to a standard platinum–etoposide backbone, with continuation of immunotherapy as maintenance, improved both progression-free survival and overall survival137,138."
    explanation: Summarizes randomized phase III trial evidence (IMpower133 and CASPIAN) establishing first-line atezolizumab or durvalumab with platinum-etoposide in extensive-stage SCLC.
- name: PD-1 Immune Checkpoint Blockade (Pembrolizumab)
  description: >-
    Monoclonal antibodies blocking the PD-1/PD-L1 immune checkpoint restore
    antitumor T cell activity; in advanced NSCLC with PD-L1 expression on at
    least 50% of tumor cells and no sensitizing EGFR or ALK alteration,
    first-line pembrolizumab improves progression-free and overall survival
    compared with platinum-based chemotherapy.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: pembrolizumab
      term:
        id: NCIT:C106432
        label: Pembrolizumab
  target_mechanisms:
  - target: PD-L1-Mediated Adaptive Immune Evasion
    treatment_effect: INHIBITS
    description: >-
      Pembrolizumab blocks PD-1 engagement by tumor PD-L1, reversing adaptive
      suppression of antitumor T cells.
    evidence:
    - reference: PMID:27718847
      reference_title: "Pembrolizumab versus Chemotherapy for PD-L1-Positive Non-Small-Cell Lung Cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Pembrolizumab is a humanized monoclonal antibody against programmed death 1 (PD-1) that has antitumor activity in advanced non-small-cell lung cancer (NSCLC), with increased activity in tumors that express programmed death ligand 1 (PD-L1)."
      explanation: Establishes blockade of the PD-1/PD-L1 immune-evasion axis as the mechanism of pembrolizumab in NSCLC.
  evidence:
  - reference: PMID:27718847
    reference_title: "Pembrolizumab versus Chemotherapy for PD-L1-Positive Non-Small-Cell Lung Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with advanced NSCLC and PD-L1 expression on at least 50% of tumor cells, pembrolizumab was associated with significantly longer progression-free and overall survival and with fewer adverse events than was platinum-based chemotherapy."
    explanation: Phase 3 KEYNOTE-024 trial demonstrating superior progression-free and overall survival with first-line pembrolizumab in PD-L1-high advanced NSCLC.
- name: Iloprost (Prostacyclin-Analogue Chemoprevention)
  description: >-
    Oral iloprost, a stable prostacyclin (PGI2) analogue, is an investigational
    chemopreventive ("interception") agent for bronchial premalignancy. Prostacyclin
    signaling is low in the dysplastic airway, and its restoration reverses
    endobronchial dysplasia. In a phase II placebo-controlled trial, oral iloprost
    significantly improved endobronchial histology in former smokers (with no
    benefit in current smokers), supporting further study of lung-cancer
    interception in this high-risk population.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemoprevention
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: iloprost
      term:
        id: CHEBI:63916
        label: iloprost
  target_mechanisms:
  - target: Bronchial Squamous Dysplasia (Premalignant Field)
    treatment_effect: INHIBITS
    description: >-
      Iloprost restores prostacyclin signaling in the premalignant bronchial
      epithelium and reverses dysplasia, intercepting progression toward invasive
      squamous cell lung carcinoma; the histological benefit was confined to former
      (not current) smokers.
    evidence:
    - reference: PMID:21636546
      reference_title: "Oral iloprost improves endobronchial dysplasia in former smokers."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Oral iloprost significantly improves endobronchial histology in former smokers and deserves further study to determine if it can prevent the development of lung cancer."
      explanation: >-
        Randomized phase II evidence that iloprost reverses endobronchial dysplasia
        in former smokers, supporting the INHIBITS edge on the premalignant field.

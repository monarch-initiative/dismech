        id: CHEBI:27899
        label: cisplatin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
  target_mechanisms:
  - target: Unrestrained Neuroendocrine Tumor Cell Proliferation in SCLC
    treatment_effect: INHIBITS
    description: >-
      Cisplatin DNA cross-linking and etoposide topoisomerase II inhibition
      exploit the rapid DNA replication and checkpoint deficiency of
      proliferating SCLC neuroendocrine tumor cells.

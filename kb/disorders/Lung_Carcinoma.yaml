    treatment_effect: INHIBITS
    description: >-
      Thoracic radiation therapy (alone as stereotactic ablative radiotherapy in
      selected early-stage tumors or with concurrent chemotherapy in locally
      advanced disease) provides durable local control of intrathoracic tumor
      and mediastinal nodal burden.
    evidence:
    - reference: PMID:33446664
      reference_title: "Small-cell lung cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Local treatment options to control thoracic disease include surgery and radiotherapy."
      explanation: Establishes thoracic radiotherapy as a primary local modality for controlling intrathoracic lung cancer burden.
    - reference: PMID:33446664
      reference_title: "Small-cell lung cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS

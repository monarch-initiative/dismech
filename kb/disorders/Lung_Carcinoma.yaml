      id: CL:1000223
      label: pulmonary neuroendocrine cell
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  description: >-
    Concomitant biallelic somatic inactivation of TP53 and RB1 occurs in the
    vast majority of small cell lung carcinomas, eliminating p53 transcriptional
    checkpoint control and RB1 sequestration of E2F transcription factors to
    abrogate the G1-S cell-cycle checkpoint, cellular senescence, and
    DNA-damage-induced apoptosis.
  evidence:
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Concomitant inactivation of two tumour suppressors, p53 and RB (encoded by TP53 and RB1, respectively), is found in the vast majority of SCLC cases24."
    explanation: Establishes dual TP53 and RB1 inactivation as the hallmark initiating molecular event in SCLC.
  - reference: PMID:38473726
    reference_title: "P53 and Rb Aberrations in Small Cell Lung Cancer (SCLC): From Molecular Mechanisms to Therapeutic Modulation."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "With the loss of TP53 and RB1, their broad tumor suppressive functions are eliminated and a normal cell is able to proliferate indefinitely, escape entering into cellular senescence, and evade death, no matter the damage it has experienced."
    explanation: Explains how dual TP53 and RB1 loss eliminates cell-cycle arrest, senescence, and apoptotic checkpoints.
  downstream:
  - target: Unrestrained Neuroendocrine Tumor Cell Proliferation in SCLC
    causal_link_type: DIRECT
    description: Abrogation of the RB1-mediated G1-S checkpoint and p53-dependent arrest/apoptosis directly unleashes rapid neuroendocrine tumor cell cycling.
    evidence:
    - reference: PMID:38473726
      reference_title: "P53 and Rb Aberrations in Small Cell Lung Cancer (SCLC): From Molecular Mechanisms to Therapeutic Modulation."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "With the loss of TP53 and RB1, their broad tumor suppressive functions are eliminated and a normal cell is able to proliferate indefinitely, escape entering into cellular senescence, and evade death, no matter the damage it has experienced."
      explanation: Directly links dual TP53 and RB1 inactivation to indefinite tumor cell proliferation.
- name: Unrestrained Neuroendocrine Tumor Cell Proliferation in SCLC
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  cell_types:
  - preferred_term: pulmonary neuroendocrine cell
    term:
      id: CL:1000223
      label: pulmonary neuroendocrine cell
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  description: >-
    Freed from G1-S and DNA-damage checkpoints, SCLC neuroendocrine tumor cells
    exhibit an exceptionally high mitotic and Ki67 proliferation rate with
    selective dependence on DNA replication and repair machinery, fueling rapid
    central thoracic growth and early hematogenous dissemination while creating
    initial vulnerability to DNA-damaging chemotherapy and ionizing radiation.
  evidence:
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Small-cell lung cancer (SCLC) represents about 15% of all lung cancers and is marked by an exceptionally high proliferative rate, strong predilection for early metastasis and poor prognosis."
    explanation: Characterizes SCLC by its exceptionally rapid tumor cell proliferation rate and early metastatic behavior.
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The exceptionally rapid proliferative rate of SCLC cells suggests that they might be selectively dependent on the biosynthetic pathways required for cell replication."
    explanation: Explains how the rapid replication state of SCLC cells creates vulnerability to replication-targeting cytotoxic therapies.
  downstream:
  - target: Intrathoracic Local Invasion and Airway Compression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Rapid neuroendocrine tumor cell division produces bulky central airway and mediastinal masses.
  - target: Metastatic Dissemination
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Exceptionally rapid proliferation and circulating tumor cell shedding promote early systemic metastasis in SCLC.
- name: Bronchial Squamous Dysplasia (Premalignant Field)
  cell_types:
  - preferred_term: bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  locations:
  - preferred_term: bronchus
    term:
      id: UBERON:0002185
      label: bronchus
  biological_scale: TISSUE
  description: >-
    Chronic tobacco-carcinogen exposure produces a field of bronchial squamous
    metaplasia and dysplasia — the endobronchial precursor lesions of invasive
    squamous cell lung carcinoma. Reduced airway prostacyclin (PGI2) signaling
    characterizes this premalignant epithelium, and its pharmacologic restoration
    can reverse dysplasia, providing the rationale for prostacyclin-analogue
    interception before invasive transformation.
  evidence:
  - reference: PMID:21636546
    reference_title: "Oral iloprost improves endobronchial dysplasia in former smokers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We carried out a multicenter double-blind, randomized, phase II placebo-controlled trial of oral iloprost in current or former smokers with sputum cytologic atypia or endobronchial dysplasia."
    explanation: >-
      Establishes endobronchial dysplasia (with sputum atypia) in smokers as the
      premalignant bronchial field targeted for lung-cancer interception.
  - reference: PMID:21636546
    reference_title: "Oral iloprost improves endobronchial dysplasia in former smokers."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "For example, the development of squamous cell lung cancer starts with normal epithelium and progresses through hyperplasia, metaplasia, dysplasia (mild, moderate, and severe), and carcinoma in situ."
    explanation: Summarizes the stepwise endobronchial dysplasia-to-invasive squamous cell carcinoma progression sequence.
  downstream:
  - target: Intrathoracic Local Invasion and Airway Compression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Progression of severe bronchial dysplasia and carcinoma in situ to invasive squamous cell carcinoma produces endobronchial and intrathoracic mass lesions.

biochemical:
- name: Alveolar Type 2 and Respiratory Epithelial Plasma Proteomic Age Gap
  biomarker_term:
    preferred_term: alveolar type 2 and respiratory epithelial plasma proteomic aging clock (age gap)
    term:
      id: NCIT:C97139
      label: Proteomic Profile
  presence: Elevated
  context: >-
    Blood-based cell-type-specific aging clock. Plasma proteins are mapped to
    their putative cell of origin using Human Protein Atlas single-cell
    transcriptomic data, and a machine-learning model estimates the biological
    age of each cell type; the age gap is the difference between that estimate
    and chronological age. "Extreme" agers are those in the upper tail of the
    age-gap distribution.
  cell_types:
  - preferred_term: Alveolar type 2 cell
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  - preferred_term: Respiratory epithelial cell
    term:
      id: CL:0002368
      label: respiratory tract epithelial cell
  notes: >-
    The two signatures are strongest when concurrent (HR 8.39 for alveolar type 2
    and 8.47 for the respiratory epithelial lineage over 15 years of UK Biobank
    follow-up). Their practical claim is incremental value over smoking, the
    dominant established risk factor: current smokers with extreme aging in both
    compartments carried HR 15.33 versus HR 9.69 for current smoking alone, and
    the signatures stayed prognostic after adjustment for age, sex, smoking
    status and estimated pack-years. Alveolar type 2 extreme aging was also the
    most stable state measured, with 81% retention over a 10-year window, which
    matters for a marker proposed for surveillance rather than one-off testing.
  evidence:
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: concurrent extreme aging in alveolar type 2 cells and the broader respiratory epithelial lineage was most prognostic
    explanation: >-
      Establishes the two cell-type clocks as the leading prognostic signatures
      for incident lung cancer, and that the concurrent state is the strongest.
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In individuals who smoked, extreme respiratory epithelial cell aging was associated with a 58% higher lung cancer risk compared to smoking alone.
    explanation: >-
      Quantifies the incremental risk over smoking status, which is the claim
      that would justify the marker clinically.
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: alveolar type 2 cell and respiratory epithelial lineage aging signatures retained independent prognostic value for incident lung cancer after adjustment for age, sex, smoking status and estimated pack-years
    explanation: >-
      Addresses the obvious confounder: the signal is not simply a proxy for
      cumulative tobacco exposure.
  readouts:
  - target: EGFR Activating Mutations in NSCLC
    relationship: PREDICTS
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      An elevated alveolar type 2 age gap predicts incident lung cancer years
      before diagnosis. The link to the EGFR-mutated NSCLC transformation node
      rests on alveolar type 2 cells being the cell of origin for lung
      adenocarcinoma, so an aged alveolar stem-cell compartment is a plausible
      substrate for driver-mutation acquisition - but the study measures a
      plasma protein signature, and does not show that the age gap predicts any
      specific driver lesion over another.
    evidence:
    - reference: PMID:42297981
      reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The pronounced prognostic value of alveolar type 2 cells, which serve as stem cells for repair and regeneration of the alveolus, is consistent with alveolar type 2 cells as the cell of origin for lung adenocarcinoma, the most common form of lung cancer.
      explanation: >-
        The authors' own cell-of-origin rationale, which is what connects this
        prognostic marker to the transformation arm rather than leaving it as an
        unanchored risk score.
diagnosis:
- name: Tissue Biopsy and Histopathological Examination
  diagnosis_term:
    preferred_term: Biopsy Procedure
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  description: >-
    Definitive diagnosis requires histopathological and cytological examination
    of tumor tissue obtained by bronchoscopy (with or without endobronchial
    ultrasonography), transthoracic needle biopsy, mediastinoscopy, or biopsy of
    an accessible metastatic lesion, supplemented by immunohistochemistry to
    classify NSCLC versus SCLC.
  evidence:
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Owing to the usual central location of the tumour, biopsies are often obtained by bronchoscopy with or without endobronchial ultrasonography; alternatives include mediastinoscopy, transthoracic biopsies or thoracoscopy."
    explanation: Summarizes bronchoscopic and transthoracic biopsy routes for sampling suspected lung carcinoma.
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis is only confirmed by histopathological examination aided by cytology140."
    explanation: Confirms histopathology and cytology as the diagnostic gold standard.

      explanation: Explains how platinum-etoposide chemotherapy inhibits proliferating SCLC cells by targeting DNA replication and repair.
  evidence:
  - reference: PMID:19445746
    reference_title: "Lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Small cell lung cancer accounts for 20% of all cases, and is usually

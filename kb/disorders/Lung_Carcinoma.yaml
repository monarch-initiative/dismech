    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, we found that IFN-γ induced the upregulation of PD-L1 in NSCLC cells, mainly through the JAK/STAT1 signaling pathway."
    explanation: Identifies IFN-gamma/JAK/STAT1 signaling as the mechanism inducing PD-L1 in NSCLC cells.
  downstream:
  - target: Intrathoracic Local Invasion and Airway Compression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

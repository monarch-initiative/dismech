- name: Iloprost (Prostacyclin-Analogue Chemoprevention)
  description: >-
    Oral iloprost, a stable prostacyclin (PGI2) analogue, is an investigational
    chemopreventive ("interception") agent for bronchial premalignancy. Prostacyclin
    signaling is low in the dysplastic airway, and its restoration reverses
    endobronchial dysplasia. In a phase II placebo-controlled trial, oral iloprost
    significantly improved endobronchial histology in former smokers (with no
    benefit in current smokers), supporting further study of lung-cancer
    interception in this high-risk population.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemoprevention
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: iloprost
      term:
        id: CHEBI:63916
        label: iloprost
  target_mechanisms:
  - target: Bronchial Squamous Dysplasia (Premalignant Field)
    treatment_effect: INHIBITS
    description: >-
      Iloprost restores prostacyclin signaling in the premalignant bronchial
      epithelium and reverses dysplasia, intercepting progression toward invasive
      squamous cell lung carcinoma; the histological benefit was confined to former
      (not current) smokers.
    evidence:
    - reference: PMID:21636546
      reference_title: "Oral iloprost improves endobronchial dysplasia in former smokers."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Oral iloprost significantly improves endobronchial histology in former smokers and deserves further study to determine if it can prevent the development of lung cancer."
      explanation: >-
        Randomized phase II evidence that iloprost reverses endobronchial dysplasia
        in former smokers, supporting the INHIBITS edge on the premalignant field.

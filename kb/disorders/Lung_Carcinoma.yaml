    stages and reduces overall lung cancer mortality, although it does not shift
    stage distribution in SCLC.
  evidence:
  - reference: PMID:33446664
    reference_title: "Small-cell lung cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The NELSON screening trial involved over 15,000 individuals at risk of lung cancer and confirmed an overall reduction in lung cancer mortality with annual low-dose CT screening"
    explanation: Cites large randomized trial evidence that annual low-dose chest CT screening reduces overall lung cancer mortality.

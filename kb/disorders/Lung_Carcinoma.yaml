      label: Positron Emission Tomography and Computed Tomography Scan
  description: >-
    Contrast-enhanced computed tomography or 18F-FDG PET/CT of the chest,
    abdomen, and pelvis together with contrast-enhanced brain MRI defines
    anatomic TNM tumor, nodal, and distant metastatic extent before treatment
    selection.

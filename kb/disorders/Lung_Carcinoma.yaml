  description: >-
    Activating somatic missense mutations in KRAS (prominently p.G12C in smokers
    with lung adenocarcinoma) impair intrinsic and GAP-stimulated GTP hydrolysis,
    locking KRAS in its active GTP-bound state and driving constitutive MAPK
    pathway signaling in non-small cell lung carcinoma.
  evidence:
  - reference: PMID:33435440
    reference_title: "Molecular Epidemiology of the Main Druggable Genetic Alterations in Non-Small Cell Lung Cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In this review, we discuss the molecular epidemiology of the main druggable genetic alterations in non-small cell lung cancer, namely EGFR, KRAS, BRAF, MET, and HER2 mutations or amplification, as well as ALK and ROS1 fusions."
    explanation: Identifies somatic KRAS mutations among the principal druggable oncogenic driver alterations in NSCLC.
  - reference: PMID:34096690
    reference_title: "Sotorasib for Lung Cancers with KRAS p.G12C Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Sotorasib showed anticancer activity in patients with KRAS p.G12C-mutated advanced solid tumors in a phase 1 study, and particularly promising anticancer activity was observed in a subgroup of patients with non-small-cell lung cancer (NSCLC)."
    explanation: Establishes KRAS p.G12C as a targetable oncogenic driver lesion in NSCLC.
  downstream:
  - target: Intrathoracic Local Invasion and Airway Compression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Constitutive KRAS-MAPK signaling drives primary NSCLC tumor growth within the thorax.
  - target: Metastatic Dissemination
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Persistent oncogenic KRAS signaling promotes progression to advanced and metastatic NSCLC.

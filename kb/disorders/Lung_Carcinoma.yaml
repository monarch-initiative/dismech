disease_term:
  preferred_term: lung carcinoma
  term:
    id: MONDO:0005138
    label: lung carcinoma
description: >-
  Lung carcinoma is a malignant epithelial neoplasm of the bronchi and pulmonary
  parenchyma and the leading cause of cancer mortality worldwide, with 80-90% of
  cases caused by cigarette smoking. Clinically and pathologically it is divided
  into non-small cell lung carcinoma (NSCLC, including lung adenocarcinoma,
  squamous cell lung carcinoma, and large cell lung carcinoma) and small cell
  lung cancer (SCLC, a high-grade neuroendocrine carcinoma accounting for
  ~15-20% of cases). While SCLC is driven by near-universal somatic inactivation
  of TP53 and RB1, subsets of NSCLC harbor actionable somatic oncogenic
  alterations in EGFR, ALK, KRAS, and related kinases, and tumor cells
  frequently upregulate PD-L1 to evade CD8+ T cell immunity. Management
  integrates surgical resection or chemoradiotherapy for localized disease with
  molecularly targeted tyrosine kinase and KRAS G12C inhibitors, immune
  checkpoint blockade, radiation therapy, and cytotoxic chemotherapy.

  description: >-
    Activating somatic mutations in the EGFR tyrosine kinase domain — most
    commonly exon 19 deletions and L858R substitutions — drive ligand-independent
    receptor tyrosine kinase signaling and oncogene addiction in lung
    adenocarcinoma and related non-small cell lung carcinomas.
  evidence:
  - reference: PMID:22932130
    reference_title: "Targeted therapy for lung cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The discovery of activating mutations in the epidermal growth factor
      receptor and anaplastic lymphoma kinase positivity has made personalized treatment
      for NSCLC more feasible."
    explanation: Links activating EGFR mutations with molecularly defined NSCLC amenable to targeted inhibition.
  - reference: PMID:29151359
    reference_title: "Osimertinib in Untreated EGFR-Mutated Advanced Non-Small-Cell Lung Cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this double-blind, phase 3 trial, we randomly assigned 556 patients with previously untreated, EGFR mutation-positive (exon 19 deletion or L858R) advanced NSCLC in a 1:1 ratio to receive either osimertinib (at a dose of 80 mg once daily) or a standard EGFR-TKI"
    explanation: Establishes EGFR exon 19 deletions and L858R substitutions as canonical activating somatic drivers in advanced NSCLC.
  downstream:
  - target: Intrathoracic Local Invasion and Airway Compression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Constitutive EGFR kinase signaling fuels primary lung tumor expansion within the thorax.
  - target: Metastatic Dissemination
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Sustained EGFR receptor tyrosine kinase signaling promotes progression to metastatic NSCLC.

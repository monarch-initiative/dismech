    explanation: States that small cell lung cancer is usually treated with systemic chemotherapy.
- name: Radiation Therapy
  description: >-
    Thoracic external-beam or stereotactic ablative radiation therapy (commonly
    delivered concurrently with platinum-based chemotherapy in locally advanced
    NSCLC and limited-stage SCLC) and prophylactic cranial irradiation in
    treatment-responsive limited-stage SCLC provide local intrathoracic tumor
    control and reduce brain metastasis risk by inducing lethal DNA damage in
    rapidly dividing tumor cells.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  target_mechanisms:

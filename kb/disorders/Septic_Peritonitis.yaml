name: Septic Peritonitis
creation_date: "2026-11-04T00:00:00Z"
description: >-
  Septic peritonitis is an acquired intra-abdominal bacterial infection in
  which a gastrointestinal leak, biliary leak, postoperative dehiscence,
  or traumatic perforation contaminates the peritoneal cavity. Enteric aerobic
  and anaerobic organisms seed the mesothelial surface, activate resident
  sentinel cells, recruit neutrophils, and can progress from purulent local
  peritonitis to abdominal sepsis, septic shock, and multiple organ dysfunction
  unless surgical or percutaneous source control and antimicrobial therapy
  interrupt ongoing contamination.
category: Infectious Disease
disease_term:
  preferred_term: septic peritonitis
  term:
    id: MONDO:0005195
    label: septic peritonitis
parents:
- Infectious peritonitis
- Bacterial infectious disease
synonyms:
- Secondary septic peritonitis
notes: >-
  This entry models bacterial secondary septic peritonitis after hollow-viscus,
  biliary, postoperative, or traumatic contamination of the peritoneum.
  Spontaneous bacterial peritonitis, peritoneal dialysis-associated peritonitis,
  sterile chemical peritonitis, and recurrent tertiary peritonitis after source
  control are outside this entry's scope.
progression:
- phase: Visceral breach and peritoneal contamination
  notes: >-
    Secondary septic peritonitis begins when loss of gastrointestinal integrity
    or another intra-abdominal source exposes the peritoneum to enteric
    organisms and inflammatory luminal contents.
  evidence:
  - reference: PMID:39200076
    reference_title: Source Control and Antibiotics in Intra-Abdominal Infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Secondary (the most common ones): derived from loss of integrity of the
      gastrointestinal tract.
    explanation: >-
      This source-control review distinguishes secondary peritonitis from
      primary and tertiary infectious peritonitis by its origin in a
      gastrointestinal integrity defect.
- phase: Localized or diffuse purulent peritonitis
  notes: >-
    Enteric contamination can remain localized or extend through the peritoneal
    cavity as fibrinous, purulent, or stercoraceous secondary peritonitis.
  evidence:
  - reference: PMID:39200076
    reference_title: Source Control and Antibiotics in Intra-Abdominal Infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Intra-abdominal infections can be categorized as uncomplicated if they
      affect just one organ and do not spread to the peritoneum, or complicated
      if the infection spreads to the peritoneum, causing localized or diffuse
      peritonitis
    explanation: >-
      The review records localized and diffuse peritonitis as the peritoneal
      extension states of complicated intra-abdominal infection.
- phase: Intra-abdominal sepsis and septic shock
  notes: >-
    Ongoing abdominal infection can cross from local purulent inflammation into
    dysregulated systemic inflammation, organ dysfunction, and septic shock.
  evidence:
  - reference: PMID:39200076
    reference_title: Source Control and Antibiotics in Intra-Abdominal Infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinical manifestations are widely varied and IAS, especially if poorly
      managed, can cause immune response deregulation leading to septic shock.
    explanation: >-
      The review describes progression from intra-abdominal sepsis toward septic
      shock when the abdominal infection is not adequately managed.
- phase: Source-controlled resolution or persistent infection
  notes: >-
    Successful source control removes the leaking or infected focus; failure to
    eliminate the source can leave persistent abscesses, chronic inflammation,
    or recurrent tertiary peritonitis after apparently adequate surgery.
  evidence:
  - reference: PMID:8891619
    reference_title: Predictors of outcome in patients with postoperative intra-abdominal infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In 37 of the patients the source of infection was eliminated resulting in
      7 deaths (19%); all 11 of those in whom it was not eliminated died.
    explanation: >-
      This postoperative intra-abdominal infection cohort links source
      elimination to survival and identifies failure to eliminate the source as
      a terminally poor-prognosis course.
  - reference: PMID:39200076
    reference_title: Source Control and Antibiotics in Intra-Abdominal Infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tertiary: recurrent peritoneal infection which occurs more than 48 h after
      apparently successful and adequate surgical source control of secondary
      peritonitis
    explanation: >-
      This review defines tertiary peritonitis as a recurrent outcome after
      attempted source control of secondary peritonitis.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Complicated intra-abdominal infection that reaches the peritoneal cavity can
    become abdominal sepsis with substantial in-hospital mortality; adequate
    source control is a dominant determinant of survival.
  evidence:
  - reference: PMID:39200076
    reference_title: Source Control and Antibiotics in Intra-Abdominal Infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Intra-abdominal infections (IAIs) account for a major cause of morbidity
      and mortality, representing the second most common sepsis-related death
      with a hospital mortality of 23-38%.
    explanation: >-
      This 2024 review quantifies the clinical burden of intra-abdominal
      infection, the disease class that includes peritoneal spread with
      localized or diffuse peritonitis.
  - reference: PMID:8891619
    reference_title: Predictors of outcome in patients with postoperative intra-abdominal infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In 37 of the patients the source of infection was eliminated resulting in
      7 deaths (19%); all 11 of those in whom it was not eliminated died.
    explanation: >-
      A postoperative intra-abdominal infection cohort links elimination of the
      infectious source to survival, supporting the high burden of disease when
      source control fails.
infectious_agent:
- name: Escherichia coli
  description: >-
    Escherichia coli is an enteric aerobic Gram-negative bacterium recovered in
    polymicrobial purulent secondary peritonitis after gastrointestinal leakage.
  infectious_agent_term:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  evidence:
  - reference: PMID:41227298
    reference_title: A Focus on Inflammatory and Bacterial Biomarkers in Secondary Peritonitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In intra-abdominal infections, the peritoneal microbiome reflects the
      contaminating intestinal microbiome, with a predominance of enteric
      Gram-Negative bacteria (Escherichia coli, Klebsiella spp., Enterobacter
      spp.), anaerobes (Bacteroides fragilis, Clostridium spp.), and
      Gram-Positive bacteria (Enterococcus spp.).
    explanation: >-
      The secondary-peritonitis review lists E. coli and other aerobic
      Gram-negative taxa among the organisms in purulent secondary peritonitis.
- name: Bacteroides fragilis
  description: >-
    Bacteroides fragilis is an enteric anaerobe that contributes to the
    polymicrobial communities recovered in secondary peritonitis after fecal or
    lower-intestinal contamination.
  infectious_agent_term:
    preferred_term: Bacteroides fragilis
    term:
      id: NCBITaxon:817
      label: Bacteroides fragilis
  evidence:
  - reference: PMID:41227298
    reference_title: A Focus on Inflammatory and Bacterial Biomarkers in Secondary Peritonitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-

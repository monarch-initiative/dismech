transmission:
- name: Endogenous peritoneal inoculation
  description: >-
    Septic peritonitis is not spread as a person-to-person syndrome; it usually
    begins when a hollow-viscus leak, surgical dehiscence, biliary leak, or
    other intra-abdominal source inoculates the peritoneal cavity with organisms
    from the patient's own gastrointestinal tract or biliary tract.
  evidence:
  - reference: PMID:41227298
    reference_title: A Focus on Inflammatory and Bacterial Biomarkers in Secondary Peritonitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Secondary peritonitis is traditionally defined as inflammation of the
      peritoneal cavity secondary to the loss of integrity of a hollow viscus or
      a chemically irritating leakage of biological fluids onto the peritoneum.
    explanation: >-
      This definition identifies visceral or fluid leakage into the peritoneum
      as the usual initiating exposure for secondary septic peritonitis.
pathophysiology:
- name: Gastrointestinal Barrier Failure
  role: trigger
  biological_scale: TISSUE
  description: >-
    A full-thickness gastrointestinal defect, anastomotic leak, biliary leak,
    or penetrating injury breaches the normally sterile peritoneal compartment
    and delivers bacteria or inflammatory luminal contents onto the peritoneal
    surface.
  locations:
  - preferred_term: peritoneum
    term:
      id: UBERON:0002358
      label: peritoneum
  downstream:
  - target: Polymicrobial Peritoneal Seeding
    causal_link_type: DIRECT
    description: >-
      The barrier breach delivers enteric aerobic and anaerobic organisms into
      peritoneal fluid and onto mesothelial surfaces.
  evidence:
  - reference: PMID:41227298
    reference_title: A Focus on Inflammatory and Bacterial Biomarkers in Secondary Peritonitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Secondary peritonitis is traditionally defined as inflammation of the
      peritoneal cavity secondary to the loss of integrity of a hollow viscus or
      a chemically irritating leakage of biological fluids onto the peritoneum.
    explanation: >-
      The review identifies hollow-viscus disruption and leakage of biological
      fluid as sources for secondary peritoneal inflammation and infection.
- name: Polymicrobial Peritoneal Seeding
  biological_scale: TISSUE
  description: >-
    Feculent or purulent contamination introduces mixed aerobic and anaerobic
    communities, including Enterobacterales and Bacteroides, into the
    peritoneal space.
  locations:
  - preferred_term: peritoneal fluid
    term:
      id: UBERON:0001268
      label: peritoneal fluid
  downstream:
  - target: Mesothelial Innate Cytokine Release
    causal_link_type: DIRECT
    description: >-
      Bacterial products contact mesothelial and resident innate immune cells,
      which respond by releasing inflammatory mediators.
  evidence:
  - reference: PMID:41227298
    reference_title: A Focus on Inflammatory and Bacterial Biomarkers in Secondary Peritonitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In peritonitis, the peritoneal cavity hosts diverse, often polymicrobial
      communities, with complex interactions between aerobic and anaerobic
      bacteria, as well as fungi.
    explanation: >-
      The review summarizes the fecal-contamination variant of secondary
      peritonitis as an enteric polymicrobial process.
- name: Mesothelial Innate Cytokine Release
  biological_scale: CELLULAR
  description: >-
    Peritoneal mesothelial cells sense microbial products, release IL-6, IL-8,
    TNF, CXCL1, and CCL2, and start the chemokine gradient that recruits
    neutrophils into the infected peritoneum.
  cell_types:
  - preferred_term: mesothelial cell
    term:
      id: CL:0000077
      label: mesothelial cell
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Purulent Peritoneal Inflammation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - IL-8 and CXCL1 chemokine gradients
    description: >-
      Mesothelial cytokine and chemokine release promotes recruitment of
      neutrophils into the peritoneal cavity.
  - target: Abdominal Sepsis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Local cytokine spillover
    - Organ dysfunction
    description: >-
      Peritoneal innate immune activation can spread systemically as a
      dysregulated host response with organ dysfunction.
  evidence:
  - reference: PMID:41227298
    reference_title: A Focus on Inflammatory and Bacterial Biomarkers in Secondary Peritonitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mesothelial cells are front-line sentinels releasing IL-6, IL-8, tumor
      necrosis factor (TNF)-α, CXCL1 and CCL2 after exposure to microbial
      products
    explanation: >-
      The review directly connects microbial exposure at the peritoneum with
      mesothelial release of neutrophil-recruiting and proinflammatory
      mediators.
- name: Purulent Peritoneal Inflammation
  biological_scale: TISSUE
  description: >-
    Bowel-content contamination generates purulent peritoneal inflammation that
    produces local acute-abdomen signs and can progress systemically when source
    control and antimicrobial therapy do not interrupt it.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Fibrinous Loculation and Abscess Formation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Coagulation-fibrinolysis imbalance
    description: >-
      Peritonitis favors peritoneal coagulation and impaired fibrin clearance,
      promoting loculated abscess formation.
    evidence:
    - reference: PMID:12734857
      reference_title: Pathophysiology of intra-abdominal adhesion and abscess formation, and the effect of hyaluronan.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Both surgery and peritonitis disturb the equilibrium between coagulation
        and fibrinolysis in the abdominal cavity in favour of the coagulation
        system.
      explanation: >-
        This review identifies peritonitis-driven coagulation bias as an
        intermediate between abdominal inflammation and later fibrinous
        loculation.
  - target: Abdominal Sepsis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Uncontrolled local bacterial infection can spread into a systemic septic
      host response.
    evidence:
    - reference: PMID:39200076
      reference_title: Source Control and Antibiotics in Intra-Abdominal Infections.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Clinical manifestations are widely varied and IAS, especially if poorly
        managed, can cause immune response deregulation leading to septic shock.
      explanation: >-
        This source-control review connects poorly controlled intra-abdominal
        sepsis to systemic immune dysregulation and septic shock.
  - target: Abdominal pain
    causal_link_type: DIRECT
    description: >-
      Peritoneal irritation produces the abdominal pain and tenderness of an
      acute abdomen.
  - target: Hypoactive bowel sounds
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Ileus
    description: >-
      Purulent peritoneal inflammation impairs bowel motility and produces
      diminished or absent bowel sounds.
  - target: Abdominal guarding
    causal_link_type: DIRECT
    description: >-
      Peritoneal inflammation irritates the abdominal cavity and produces local
      guarding or rigidity.
  - target: Abdominal distention
    causal_link_type: DIRECT
    description: >-
      Peritoneal inflammation produces distention and diminished bowel sounds as
      acute-abdomen manifestations.
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Systemic inflammatory response
    description: >-
      Local peritoneal infection drives systemic inflammatory signs including
      fever.
  - target: Tachycardia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Systemic inflammatory response
    description: >-
      Local peritoneal infection can progress to systemic inflammation with
      tachycardia.
  - target: Dehydration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Third spacing and systemic inflammatory response
    description: >-
      Acute perforation peritonitis can present with dehydration during the
      systemic inflammatory acute-abdomen syndrome.
  evidence:
  - reference: PMID:41227298
    reference_title: A Focus on Inflammatory and Bacterial Biomarkers in Secondary Peritonitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This section groups the condition into five archetypal variants, namely
      fibrinous mainly related to peptic ulcer perforation (PUP), purulent
      either due to colonic or non-colonic perforation
    explanation: >-
      This review places purulent secondary peritonitis within the diffuse
      forms produced by visceral-barrier breach.
- name: Fibrinous Loculation and Abscess Formation
  biological_scale: TISSUE
  description: >-
    The inflamed abdominal cavity develops impaired fibrin degradation, walling
    off infection into adhesions and abscesses but also creating protected
    infectious foci.
  locations:
  - preferred_term: peritoneum
    term:
      id: UBERON:0002358
      label: peritoneum
  evidence:
  - reference: PMID:12734857
    reference_title: Pathophysiology of intra-abdominal adhesion and abscess formation, and the effect of hyaluronan.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Diminished fibrin degradation is a common pathway for the formation of
      adhesions and abscesses.
    explanation: >-
      This review connects impaired abdominal fibrin degradation to the adhesion
      and abscess formation that creates loculated infectious foci during
      peritonitis.
- name: Abdominal Sepsis
  biological_scale: ORGANISM
  description: >-
    Failure to control the intra-abdominal source allows inflammatory mediator
    spillover and bacterial products to drive life-threatening organ dysfunction
    as abdominal sepsis.
  downstream:
  - target: Sepsis
    causal_link_type: DIRECT
    description: >-
      Intra-abdominal infection can drive the dysregulated systemic host
      response and organ dysfunction that define sepsis.
  - target: Shock
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Immune-response dysregulation
    - Hemodynamic collapse
    description: >-
      Severe intra-abdominal sepsis can progress to septic shock.
    evidence:
    - reference: PMID:39200076
      reference_title: Source Control and Antibiotics in Intra-Abdominal Infections.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Clinical manifestations are widely varied and IAS, especially if poorly
        managed, can cause immune response deregulation leading to septic shock.
      explanation: >-
        This review connects intra-abdominal sepsis to downstream septic shock.
  evidence:
  - reference: PMID:30685836
    reference_title: "Intra-abdominal sepsis: new definitions and current clinical standards."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Sepsis-3 defines sepsis as a life-threatening organ dysfunction caused by
      a dysregulated host response to infection.
    explanation: >-
      This review applies the Sepsis-3 organ-dysfunction definition to
      intra-abdominal infection.

biochemical:
- name: Procalcitonin
  notes: >-
    Procalcitonin is a circulating inflammatory biomarker used with other
    markers for secondary-peritonitis diagnosis, prognostication, and monitoring.
  biomarker_term:
    preferred_term: Procalcitonin
    term:
      id: NCIT:C173465
      label: Procalcitonin
  evidence:
  - reference: PMID:41227298
    reference_title: A Focus on Inflammatory and Bacterial Biomarkers in Secondary Peritonitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Biomarkers such as procalcitonin (PCT), interleukin-6 (IL-6), high
      mobility group box 1 (HMGB1), C-reactive protein (CRP),
      lipopolysaccharide (LPS), neutrophil-to-lymphocyte ratio (NLR), and
      neutrophil gelatinase-associated lipocalin (NGAL) have emerged as tools
      for early diagnosis, subtype stratification, and monitoring of therapeutic
      response.
    explanation: >-
      The review identifies procalcitonin among the secondary-peritonitis
      biomarkers with diagnostic, stratification, and treatment-monitoring use.
- name: C-reactive protein
  notes: >-
    C-reactive protein is a circulating inflammatory biomarker used with other
    markers to support secondary-peritonitis diagnosis and monitoring.
  biomarker_term:
    preferred_term: C-Reactive Protein
    term:
      id: NCIT:C60651
      label: C-Reactive Protein
  evidence:
  - reference: PMID:41227298
    reference_title: A Focus on Inflammatory and Bacterial Biomarkers in Secondary Peritonitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Biomarkers such as procalcitonin (PCT), interleukin-6 (IL-6), high
      mobility group box 1 (HMGB1), C-reactive protein (CRP),
      lipopolysaccharide (LPS), neutrophil-to-lymphocyte ratio (NLR), and
      neutrophil gelatinase-associated lipocalin (NGAL) have emerged as tools
      for early diagnosis, subtype stratification, and monitoring of therapeutic
      response.
    explanation: >-
      The review identifies CRP among secondary-peritonitis biomarkers used for
      diagnosis, subtype stratification, and response monitoring.
diagnosis:
- name: Clinical and plain-film acute-abdomen assessment
  description: >-
    Perforation peritonitis is initially assessed from the acute history,
    physical examination, and erect abdominal X-ray evidence of
    pneumoperitoneum while the team triages the perforated or infected source.
  evidence:
  - reference: PMID:24392388
    reference_title: Spectrum of perforation peritonitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Initial diagnosis was made on the basis of detailed history, clinical
      examination and presence of pneumoperitoneum on erect abdominal X-ray.
    explanation: >-
      A 490-patient perforation-peritonitis cohort documents an initial
      diagnostic assessment combining history, examination, and erect abdominal
      radiography for pneumoperitoneum.
- name: Abdominal CT source localization
  description: >-
    Abdominal CT is used in the emergency workup to help diagnose severe
    intra-abdominal sepsis and localize the perforated or infected source for
    source-control planning.
  diagnosis_term:
    preferred_term: Computed Tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:39200076
    reference_title: Source Control and Antibiotics in Intra-Abdominal Infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A prompt diagnosis of severe IAS often requires an adequate clinical
      evaluation, laboratory tests, and imaging exams, such as abdominal
      ultrasound or Computed Tomography (CT), which are among the most used
      diagnostic procedures in emergency settings
    explanation: >-
      This source-control review identifies CT and ultrasound among emergency
      diagnostic procedures for severe intra-abdominal sepsis.
treatments:
- name: Surgical Source Control
  description: >-
    Surgical or percutaneous source control reduces microbial burden by
    repairing, resecting, draining, debriding, decompressing, or removing the
    anatomic source of peritoneal contamination.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical source control
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Gastrointestinal Barrier Failure
    treatment_effect: INHIBITS
    description: >-
      Source control closes or removes the leak that continues to seed the
      peritoneum.
  - target: Fibrinous Loculation and Abscess Formation
    treatment_effect: INHIBITS
    description: >-
      Drainage and debridement evacuate infected loculated collections and
      remove necrotic foci that preserve bacterial burden.
  evidence:
  - reference: PMID:39200076
    reference_title: Source Control and Antibiotics in Intra-Abdominal Infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The aim of source control is to reduce microbial load by removing the
      infection source and it is achievable by using a wide range of procedures,
      such as definitive surgical removal of anatomic infectious foci,
      percutaneous drainage and toilette of infected collections,
      decompression, and debridement of infected and necrotic tissue or device
      removal
    explanation: >-
      Defines source control across surgical removal, drainage, decompression,
      debridement, and device removal for intra-abdominal infection.
- name: Broad-Spectrum Antimicrobial Therapy
  description: >-
    Antimicrobial therapy suppresses enteric Gram-negative and anaerobic
    organisms seeded into the peritoneal cavity; regimen choice is guided by
    clinical status, local resistance epidemiology, and risks for
    multidrug-resistant bacteria or Candida.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Polymicrobial Peritoneal Seeding
    treatment_effect: INHIBITS
    description: >-
      Antimicrobial therapy inhibits or kills the organisms seeded into the
      peritoneal cavity while surgical source control removes the source.
  evidence:
  - reference: PMID:41227298
    reference_title: A Focus on Inflammatory and Bacterial Biomarkers in Secondary Peritonitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The treatment of secondary peritonitis relies on two fundamental
      principles: rapid surgical source control even with intraperitoneal
      negative-pressure therapy and effective antimicrobial therapy
    explanation: >-
      Summarizes antimicrobial therapy as one of the two fundamental treatment
      principles for secondary peritonitis.
  - reference: PMID:27670577
    reference_title: Patients with Risk Factors for Complications Do Not Require Longer Antimicrobial Therapy for Complicated Intra-Abdominal Infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A short course of antibiotics in complicated intra-abdominal infection
      with source control seems to have similar outcomes to a longer course in
      patients with diabetes, obesity, or increased severity of illness.
    explanation: >-
      A STOP-IT trial subgroup analysis supports limiting antibiotic duration
      after source control, including in high-risk complicated
      intra-abdominal infection.
  - reference: PMID:39200076
    reference_title: Source Control and Antibiotics in Intra-Abdominal Infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Antibiotic and antifungal regimens in patients with IAIs should be based
      on the resistance epidemiology, clinical conditions, and risk for
      multidrug resistance (MDR) and Candida spp. infections.
    explanation: >-
      Supports selecting antimicrobial regimens by resistance epidemiology,
      clinical status, and multidrug-resistance or Candida risk.
animal_models:
- name: Cecal ligation and puncture mouse
  species: Mouse
  description: >-
    Cecal ligation and puncture is a standard adult mouse model of
    polymicrobial intraperitoneal sepsis induced by surgical cecal injury, but
    the devitalized cecum leaves an uncorrected source that prevents the model
    from representing source-controlled clinical resolution.
  publication: PMID:34048005
  modeled_mechanisms:
  - target: Polymicrobial Peritoneal Seeding
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      CLP seeds cecal contents into the mouse peritoneum and produces
      polymicrobial intraperitoneal sepsis.
    limitations: >-
      The devitalized cecum remains in place, so CLP does not model an episode
      where surgical source control closes or removes the leaking focus.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Definitive source control is outside the CLP model boundary even though
        source repair or removal is central to the human secondary-peritonitis
        course and treatment strategy curated here.
    evidence:
    - reference: PMID:34048005
      reference_title: Cecal Slurry Injection in Neonatal and Adult Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Among the murine models of intraperitoneal sepsis, cecal ligation and
        puncture (CLP), is one of the most frequently used and generally
        accepted as the “gold standard”.
      explanation: >-
        This mouse-model review identifies CLP as a standard model of
        intraperitoneal sepsis.
    - reference: PMID:34048005
      reference_title: Cecal Slurry Injection in Neonatal and Adult Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Despite antibiotic treatment, the presence of a devitalized cecum
        assures failure of any antibiotic intervention to completely resolve the
        infection, and involves both abscess formation and chronic
        inflammation.
      explanation: >-
        The same model review explains that the ligated cecum leaves a
        devitalized infectious focus that prevents complete antimicrobial
        resolution.

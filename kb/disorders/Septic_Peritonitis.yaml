      contaminating intestinal microbiome, with a predominance of enteric
      Gram-Negative bacteria (Escherichia coli, Klebsiella spp., Enterobacter
      spp.), anaerobes (Bacteroides fragilis, Clostridium spp.), and
      Gram-Positive bacteria (Enterococcus spp.).
    explanation: >-
      The review identifies B. fragilis among anaerobes recovered from
      intra-abdominal infection.

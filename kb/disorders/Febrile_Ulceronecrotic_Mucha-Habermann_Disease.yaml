    explanation: The FUMHD review lists intravenous immunoglobulins among successful modalities.
- name: TNF-alpha inhibitor therapy
  description: >-
    TNF-alpha inhibitors (e.g., infliximab, often with IVIG) are reported for
    refractory FUMHD and are mechanistically rational given the elevated serum
    TNF-alpha at the PLEVA-to-FUMHD transition. Response is not uniform - at
    least one infant died despite a TNF-alpha inhibitor - so this remains a
    case-based option, not established therapy.

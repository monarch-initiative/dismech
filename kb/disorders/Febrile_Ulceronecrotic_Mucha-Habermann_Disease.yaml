      This report of infliximab plus IVIG in FUMHD supports TNF-alpha inhibition
      as an option in resistant disease, consistent with the TNF-alpha mechanism.
discussions:
- discussion_id: fumhd_escalation_driver
  prompt: What molecular driver determines why only a minority of PLEVA patients escalate to fulminant, systemic FUMHD?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Ulceronecrotic escalation and systemic hyperinflammation
  rationale: >-
    FUMHD shares the cytotoxic-T-cell PLEVA mechanism but adds fever, coalescing
    ulceronecrosis, and systemic/HLH-range hyperinflammation. The host or
    lesional factors that tip a minority of PLEVA patients into this severe,
    sometimes fatal branch are unknown, and no biomarker predicts escalation.
  evidence:
  - reference: PMID:38959922
    reference_title: "Febrile ulceronecrotic Mucha-Habermann disease - a case and treatment review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Febrile ulceronecrotic Mucha-Habermann disease is a rare and severe
      variant of pityriasis lichenoides, characterized by sudden onset of
      generalized ulceronecrotic papules that rapidly coalesce into ulcers
      associated with high fever.
    explanation: The severe-variant framing motivates the open question of what drives escalation.
- discussion_id: fumhd_optimal_treatment
  prompt: Which systemic therapy improves FUMHD survival, and how should immunosuppression be balanced against sepsis risk?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatment#Prompt systemic and supportive management for FUMHD
  - treatment#Methotrexate therapy
  - treatment#Intravenous immunoglobulin (IVIG)
  rationale: >-
    FUMHD management rests on heterogeneous single cases and small reviews with
    no controlled trials, so the optimal regimen is undefined and the tradeoff
    between immunosuppression and infectious mortality is unresolved.
  evidence:
  - reference: PMID:36483219
    reference_title: "Mortality risk factors in febrile ulceronecrotic Mucha- Habermann disease: A systematic review of therapeutic outcomes and complications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      FUMHD is a diagnostic and therapeutic challenge due to the lack of clearly
      defined diagnostic criteria and optimum treatment.
    explanation: This directly supports the absence of an established optimal FUMHD treatment.

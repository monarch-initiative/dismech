- name: Monoclonal T-cell clonality and CTCL continuum
  description: >-
    A subset of FUMHD cases harbors a monoclonal (clonal) T-cell receptor
    rearrangement in the lesional infiltrate, placing those cases on a continuum
    with cutaneous T-cell lymphoma (CTCL) and predicting a worse prognosis. This
    is a parallel modifier arm, not present in all cases, and whether it marks a
    distinct neoplastic subset or a transient reactive clone is unresolved.
  mechanism_confidence: PROVISIONAL

environmental:
- name: Infectious and antigenic triggers
  description: >-
    Like the broader pityriasis lichenoides spectrum, FUMHD is thought to be
    triggered in susceptible individuals by an infectious or antigenic stimulus;
    Epstein-Barr virus, Toxoplasma gondii, and HIV are the most frequently
    reported infectious triggers, with additional FUMHD-specific associations
    (e.g., herpes simplex virus type 2). No trigger is proven causal.
  evidence:
  - reference: PMID:12894107
    reference_title: "Infectious causes of pityriasis lichenoides: a case of fulminant infectious mononucleosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epstein-Barr virus, Toxoplasma gondii, and HIV are the most frequently
      reported infectious triggers of pityriasis lichenoides
    explanation: >-
      Supports the reported infectious-trigger associations of the pityriasis
      lichenoides spectrum that FUMHD belongs to; the association is temporal,
      not proven causal for FUMHD specifically.
progression:
- phase: Fulminant ulceronecrotic and systemic phase
  notes: >-
    FUMHD presents with the sudden onset of generalized ulceronecrotic papules
    coalescing into ulcers with high fever and systemic involvement, and can be
    fatal if diagnosis and appropriate treatment are delayed.
  evidence:
  - reference: PMID:36483219
    reference_title: "Mortality risk factors in febrile ulceronecrotic Mucha- Habermann disease: A systematic review of therapeutic outcomes and complications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although rare, the condition may progress to involve serious complications
      and even lead to fatal outcomes if diagnosis and appropriate treatment is
      delayed.
    explanation: This systematic review supports the fulminant, potentially fatal course.
- phase: Outcome and mortality
  notes: >-
    Mortality is concentrated in adults and driven by sepsis and systemic
    involvement; many patients nonetheless recover, sometimes without
    recurrence. Overall reported lethality is about 12 percent, higher in adults
    (about 20 percent) than children (about 2 percent).
  evidence:
  - reference: PMID:34287852
    reference_title: "Mucha-Habermann disease: a pediatric case report and proposal of a risk score."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Overall lethality was 14/119 (12%, CI 6-17%), and lethality in children
      was lower (1/54, 2%, CI 0-6%) compared to adults (13/65, 20%, CI 11-31%).
    explanation: This case-literature review quantifies FUMHD mortality and its strong age gradient.
diagnosis:
- name: Clinicopathologic diagnosis of severe ulceronecrotic PLEVA
  description: >-
    FUMHD is a clinicopathologic diagnosis based on the characteristic
    fulminant ulceronecrotic eruption with fever and systemic features, plus
    a skin biopsy showing PLEVA-type interface injury and a CD8/TIA-1-rich
    (sometimes atypical) infiltrate. There are no universally accepted
    diagnostic criteria, and the lymphomatoid differential must be considered.
  diagnosis_term:
    preferred_term: skin biopsy
    term:
      id: MAXO:0000423
      label: biopsy of skin
  results: >-

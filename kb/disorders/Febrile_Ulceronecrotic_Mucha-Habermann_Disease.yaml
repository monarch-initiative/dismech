  - reference: PMID:36483219
    reference_title: "Mortality risk factors in febrile ulceronecrotic Mucha- Habermann disease: A systematic review of therapeutic outcomes and complications."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Successful treatment modalities for FUMHD included antibiotics,
      antivirals, systemic steroids, Methotrexate (MTX), cyclophosphamide,
      Cyclosporine (CYA), Intravenous Immunoglobulins (IVIG), pentoxifylline,
      and ultraviolet B phototherapy.
    explanation: >-
      The FUMHD case-literature review includes methotrexate among successful
      regimens but cannot establish an optimal one.
- name: Intravenous immunoglobulin (IVIG)
  description: >-
    Intravenous immunoglobulin has produced rapid disease control in FUMHD,
    including in a child refractory to steroids, methotrexate, dapsone, and
    erythromycin; it is among the reported successful FUMHD modalities.

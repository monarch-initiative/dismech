name: Febrile Ulceronecrotic Mucha-Habermann Disease
creation_date: "2026-07-30T00:00:00Z"
description: >-
  Febrile ulceronecrotic Mucha-Habermann disease (FUMHD) is a rare, severe, and
  potentially fatal variant at the extreme pole of the pityriasis lichenoides
  spectrum, considered a severe form of pityriasis lichenoides et varioliformis
  acuta (PLEVA, Mucha-Habermann disease). It is distinguished from ordinary
  PLEVA by the sudden eruption of generalized ulceronecrotic papules that
  rapidly coalesce into large ulcers, high spiking fever, hemorrhagic bullae,
  and frequent systemic involvement (mucosal ulceration and pulmonary, cardiac,
  gastrointestinal, and central nervous system complications, with disseminated
  intravascular coagulation and, rarely, hemophagocytic lymphohistiocytosis). A
  CD8-positive, TIA-1-positive cytotoxic T-cell-rich (at times atypical,
  lymphomatoid) infiltrate with lymphocytic/angiocentric vascular injury and
  epidermal necrosis is characteristic. As in PLEVA, the etiology is unresolved:
  an antigen-triggered reactive process and a clonal or oligoclonal cutaneous
  T-cell dyscrasia are competing or superimposed models, and the molecular
  reason only a minority of PLEVA patients escalate to FUMHD is unknown.
  Elevated serum TNF-alpha at the PLEVA-to-FUMHD transition implicates a
  TNF-alpha amplification arm (and is the rationale for TNF-alpha inhibitors in
  refractory cases), while a monoclonal T-cell receptor rearrangement in a
  subset places those cases on a cutaneous T-cell lymphoma continuum with worse
  prognosis. FUMHD
  carries appreciable mortality that is concentrated in adults and driven by
  sepsis and systemic involvement, making it a dermatologic emergency.
category: Complex
disease_term:
  preferred_term: febrile ulceronecrotic Mucha-Habermann disease
  term:
    id: MONDO:0023134
    label: febrile ulceronecrotic Mucha-Habermann disease
parents:
- Acute lichenoid pityriasis
synonyms:
- FUMHD
- Febrile ulceronecrotic variant of pityriasis lichenoides et varioliformis acuta
- Ulceronecrotic Mucha-Habermann disease
notes: >-
  Modeled as a distinct entry rather than folded entirely into Acute Lichenoid
  Pityriasis (PLEVA) because FUMHD carries its own MONDO identity
  (MONDO:0023134, a subclass of MONDO:0024250 acute lichenoid pityriasis) and a
  distinct, life-threatening clinical gestalt (systemic involvement, defined
  mortality risk factors, and emergency management) that must not be generalized
  to uncomplicated PLEVA. The shared cytotoxic-T-cell PLEVA mechanism is
  curated in both entries; the Acute Lichenoid Pityriasis entry also retains
  FUMHD as a severity subtype for spectrum context.
prevalence:
- population: Reported case literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    FUMHD is very rare and described mainly in single cases and small
    case-literature reviews; one systematic case review aggregated 119 patients.
    No reliable population incidence or prevalence has been established. Reported
    cases show a clear male predominance (roughly three-quarters male).
  evidence:
  - reference: PMID:34287852
    reference_title: "Mucha-Habermann disease: a pediatric case report and proposal of a risk score."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Overall lethality was 14/119 (12%, CI 6-17%), and lethality in children
      was lower (1/54, 2%, CI 0-6%) compared to adults (13/65, 20%, CI 11-31%).
    explanation: >-
      The 119-case review defines the size of the reported FUMHD literature and
      is used here only to convey rarity, not a population rate.
  - reference: PMID:35950146
    reference_title: "Febrile Ulceronecrotic Mucha-Habermann Disease: A Case Report and a Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most of them were male (62/83, 74.7%), with high fever state (50/80, 62.5%
      had a high fever of 39°C or above)
    explanation: >-
      A pooled FUMHD systematic review quantifies the male predominance and the
      high-fever frequency across reported cases.

mechanistic_hypotheses:
- hypothesis_group_id: cytotoxic_t_cell_epidermal_injury_model
  hypothesis_label: Cytotoxic T-Cell Epidermal and Vascular Injury Model
  status: EMERGING
  description: >-
    CD8-positive, TIA-1-positive cytotoxic T cells accumulate in PLEVA/FUMHD
    lesions and may drive keratinocyte injury, interface damage, and the
    ulceronecrotic eruption. In severe FUMHD the lesional infiltrate can be
    atypical and lymphomatoid with angiocentric vascular injury. The cytotoxic
    effector function is inferred from the lesional immunophenotype rather than
    directly demonstrated.
  notes: >-
    PLEVA-specific and FUMHD case immunophenotyping support cytotoxic-cell
    enrichment and an inferred epidermal/vascular-damage role. The antigen,
    effector repertoire, and death pathway remain unresolved, so the model
    should not be expanded into unsupported molecular signaling claims.
  evidence:
  - reference: PMID:38973067
    reference_title: "Immunophenotyping and viral studies in pityriasis lichenoides et varioliformis acuta lesions."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The predominant T-cell infiltrate in PLEVA is dominated by CD8+ cells,
      and by increased numbers of TIA1+ cells, which may indicate a cytotoxic
      T-cell damage to the epidermis.
    explanation: >-
      PLEVA-specific immunophenotyping supports marker enrichment and an
      inferred damage role while retaining the authors' causal qualification.
- hypothesis_group_id: systemic_hyperinflammatory_escalation_model
  hypothesis_label: Systemic Hyperinflammatory Escalation Model
  status: EMERGING
  description: >-
    In FUMHD, the cutaneous cytotoxic process is accompanied by high fever and
    systemic inflammation, and in extreme cases can meet criteria for
    hemophagocytic lymphohistiocytosis (HLH), suggesting a hyperinflammatory
    escalation beyond ordinary PLEVA. Whether HLH is a driver or a downstream
    complication of severe FUMHD is unresolved.
  notes: >-
    Evidence is limited to case-level associations. The HLH association is a
    single-case observation and should be read as an illustrative severe-end
    phenotype, not an established obligatory mechanism.
  evidence:
  - reference: PMID:38457671
    reference_title: "Febrile Ulceronecrotic Mucha-Habermann Disease Associated With Hemophagocytic Lymphohistiocytosis: A Case Report and Review of the Literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient also met 7 of 9 HLH-2004 criteria, leading to a diagnosis of HLH."
    explanation: >-
      A single FUMHD case reaching HLH-2004 criteria illustrates the
      hyperinflammatory severe end, without establishing HLH as an obligatory
      FUMHD mechanism.
pathophysiology:
- name: CD8-positive cytotoxic T-cell-mediated epidermal and vascular injury
  description: >-
    FUMHD lesions, like PLEVA, contain increased CD8-positive and TIA-1-positive
    T cells; in severe cases the dermal and subcutaneous infiltrate can be
    atypical CD8-positive with features of lymphomatoid (angiocentric) vascular
    injury. The cytotoxic phenotype is proposed to drive keratinocyte injury and
    ulceronecrosis, though function is inferred from tissue immunophenotype.
  mechanism_confidence: PROVISIONAL
  biological_scale: CELLULAR

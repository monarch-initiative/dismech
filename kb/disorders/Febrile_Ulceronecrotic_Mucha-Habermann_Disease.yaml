      lymphocytes with loss of CD5 and reduction in CD7 expression, along with
      features of lymphomatoid vasculitis.
    explanation: >-
      A FUMHD case directly documents an atypical CD8-positive infiltrate with
      lymphomatoid vascular injury at the severe end of the spectrum.
  downstream:
  - target: Ulceronecrotic escalation and systemic hyperinflammation
    description: >-
      Intense cytotoxic epidermal and vascular injury is proposed to underlie

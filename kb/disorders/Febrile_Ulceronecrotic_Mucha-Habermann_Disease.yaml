    reference_title: "Immunophenotyping and viral studies in pityriasis lichenoides et varioliformis acuta lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The numbers of CD8+ T cells and T-cell intracellular antigen-1 (TIA-1)+
      cells were statistically significantly higher in PLEVA compared to the
      ID group.
    explanation: >-
      A PLEVA-specific comparison establishes enrichment of cytotoxic T-cell
      markers, the shared mechanism underlying the FUMHD severe variant.
  - reference: PMID:38457671
    reference_title: "Febrile Ulceronecrotic Mucha-Habermann Disease Associated With Hemophagocytic Lymphohistiocytosis: A Case Report and Review of the Literature."
    supports: PARTIAL

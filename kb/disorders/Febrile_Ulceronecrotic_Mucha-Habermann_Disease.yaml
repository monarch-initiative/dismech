differential_diagnoses:
- name: Cutaneous CD8-positive necrotizing angiocentric lymphoproliferative disease
  description: >-
    Severe FUMHD can mimic an aggressive CD8-positive angiocentric cutaneous
    T-cell lymphoproliferative disease, and the atypical lymphomatoid
    immunophenotype makes this the key differential.
  distinguishing_features:
  - FUMHD is self-limited/reactive and typically lacks a persistent monoclonal aggressive lymphoma course; clinicopathologic correlation and follow-up distinguish it.
  evidence:
  - reference: PMID:38457671
    reference_title: "Febrile Ulceronecrotic Mucha-Habermann Disease Associated With Hemophagocytic Lymphohistiocytosis: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FUMHD should be considered in the differential diagnosis for patients
      presenting with cutaneous CD8 + necrotizing angiocentric
      lymphoproliferative disease complicated by HLH.
    explanation: This FUMHD paper directly frames the aggressive angiocentric CTCL differential.
- name: Lymphomatoid papulosis
  disease_term:
    preferred_term: lymphomatoid papulosis
    term:
      id: MONDO:0020326
      label: lymphomatoid papulosis
  description: >-
    Lymphomatoid papulosis produces recurrent self-healing necrotic papules and
    can be confused with the papulonecrotic lesions of the Mucha-Habermann
    spectrum.
  distinguishing_features:
  - Waxing and waning papules or nodules with a CD30-positive atypical lymphoid infiltrate favor lymphomatoid papulosis rather than the CD8/TIA-1-rich PLEVA/FUMHD infiltrate.
  evidence:
  - reference: PMID:29851705
    reference_title: "Pityriasis Lichenoides, Atypical Pityriasis Lichenoides, and Related Conditions: A Study of 66 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lymphomatoid papulosis (waxing and waning lesions and positivity for CD30)"
    explanation: This study directly identifies the key clinical and immunophenotypic distinction from the pityriasis lichenoides spectrum.
treatments:
- name: Prompt systemic and supportive management for FUMHD
  description: >-
    FUMHD is a dermatologic emergency warranting prompt specialist evaluation,
    supportive care, and management of sepsis and systemic involvement. No
    optimal regimen is established, and immunosuppressive intensity must be
    balanced against infectious mortality.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  target_phenotypes:
  - preferred_term: Sepsis
    term:
      id: HP:0100806
      label: Sepsis
  - preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:36483219
    reference_title: "Mortality risk factors in febrile ulceronecrotic Mucha- Habermann disease: A systematic review of therapeutic outcomes and complications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although rare, the condition may progress to involve serious complications
      and even lead to fatal outcomes if diagnosis and appropriate treatment is
      delayed.
    explanation: This supports prompt assessment and treatment to reduce mortality.
  - reference: PMID:34287852
    reference_title: "Mucha-Habermann disease: a pediatric case report and proposal of a risk score."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In FUMHD, immune-suppressive treatment intensity should be balanced
      against the mortality risk, as infectious complications are a frequent
      cause of death.
    explanation: This supports risk-adapted rather than reflexively maximal immunosuppression.
- name: Systemic corticosteroid therapy
  description: >-
    Oral/systemic corticosteroids are a mainstay of FUMHD systemic
    anti-inflammatory management, typically combined with other agents.

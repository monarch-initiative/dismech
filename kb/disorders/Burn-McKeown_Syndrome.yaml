inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Autosomal recessive inheritance. Recurrence is 25% per pregnancy when both parents carry the relevant pathogenic
    alleles; parental testing establishes phase and permits genotype-specific counseling. Apparent homozygosity
    may require evaluation for a deletion or uniparental disomy. Prenatal and preimplantation testing are possible
    once the familial variants are identified.
  evidence:

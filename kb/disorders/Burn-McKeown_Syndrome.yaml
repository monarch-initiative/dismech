    reference_title: "TXNL4A-Related Craniofacial Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects of the lower eyelids that can result in corneal exposure require care by an ophthalmologist to reduce the risk of corneal scarring."

  rate_per_100000: 760.0
  notes: >-
    Allele frequency of the recurrent 34 bp TXNL4A core-promoter deletion is
    0.76%. This is the frequency of the common hypomorphic allele, not of the
    disease: BMKS requires this allele in trans with a very rare
    loss-of-function coding variant, which is why the syndrome remains
    ultra-rare despite the relatively common promoter deletion.
  evidence:

- name: Reduced TXNL4A Promoter Activity
  description: HEK293 reporter assays found type 1 and type 2 promoter activity reduced by 59% and 72%, respectively. A later deletion-mapping assay identified the repeated 22-bp motifs as important for promoter activity. Predicted transcription-factor motifs are not evidence that a particular factor binds the endogenous locus in neural crest cells.
  biological_scale: MOLECULAR
  evidence:

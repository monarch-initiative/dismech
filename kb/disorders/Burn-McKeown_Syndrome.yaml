name: Burn-McKeown Syndrome
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Burn-McKeown syndrome (BMKS; choanal atresia-hearing loss-cardiac
  defects-craniofacial dysmorphism syndrome; OMIM 608572) is an extremely rare
  autosomal recessive craniofacial malformation syndrome caused by biallelic
  variants in TXNL4A (18q23), which encodes the U5 snRNP core protein
  TXNL4A/Dib1. Affected individuals have bilateral choanal atresia or stenosis
  together with a distinctive facial gestalt - short palpebral fissures,
  coloboma of the lower eyelids, prominent nasal bridge with widely spaced eyes,
  short philtrum, thin upper lip vermilion and prominent ears - plus frequent
  hearing loss, and less commonly cardiac septal defects, cleft lip and/or
  palate, preauricular tags, short stature and renal anomalies. Intelligence is
  usually normal, which is a key discriminator from EFTUD2-related
  mandibulofacial dysostosis with microcephaly. Almost all reported probands carry a
  34-base-pair deletion in the TXNL4A promoter on at least one allele, in trans
  with a coding loss-of-function variant; the resulting reduction in TXNL4A
  expression disrupts U4/U6.U5 tri-snRNP function and impairs cranial neural
  crest cell formation and differentiation, which is why a lesion in a
  ubiquitously expressed spliceosome protein presents as a tissue-restricted
  craniofacial phenotype. TXNL4A variants also cause isolated choanal atresia
  and choanal atresia with minor anomalies, so BMKS is the severe end of a
  TXNL4A-related craniofacial spectrum.
category: Mendelian
parents:
- Craniofacial Malformation Syndrome
- Spliceosomopathy
notes: >-
  Scope and disambiguation. TXNL4A is frequently mentioned in the literature on
  the OTHER craniofacial spliceosomopathies - Nager syndrome (SF3B4),
  mandibulofacial dysostosis with microcephaly (EFTUD2), cerebrocostomandibular
  syndrome (SNRPB), Richieri-Costa-Pereira syndrome (EIF4A3) - as a member of the
  same mechanistic family. This entry is the TXNL4A disorder specifically. In
  particular, dismech's existing `Mandibulofacial_Dysostosis_with_Microcephaly`
  entry mentions TXNL4A but is the EFTUD2 disorder and is a distinct entity;
  the two are cross-referenced under `differential_diagnoses` without
  duplication. TXNL4A is separately reported as a hepatocellular-carcinoma
  biomarker; that oncology literature is unrelated to BMKS and was excluded.
  Module conformance. This entry declares `conforms_to` against the first two
  nodes of `pharyngeal_arch_patterning_serial_homology` - the cranial neural
  crest / arch-program perturbation node and the disrupted arch-patterning and
  neural-crest-skeletogenesis node - because BMKS is mechanistically parallel to
  Treacher Collins: a core biogenesis defect (spliceosome rather than ribosome)
  that depletes or mis-differentiates cranial neural crest, demonstrated directly
  for TXNL4A in Xenopus knockdown and in patient iPSC-derived neural crest.
  Conformance is deliberately NOT declared against the module's third node,
  `Serially Homologous Craniofacial Malformation Across Arch Derivatives`. That
  node asserts a symmetric multi-element bundle of zygomatic, maxillary and
  mandibular hypoplasia with ear anomalies and palatal clefting. BMKS does have
  the ear and clefting components, but it lacks the malar/mandibular hypoplasia
  bundle that defines mandibulofacial dysostosis, and its cardinal feature -
  bilateral choanal atresia, a failure of the bucconasal membrane to rupture - is
  not a pharyngeal-arch derivative at all. Declaring conformance at that node
  would assert a phenotype bundle BMKS does not have. Two caveats are recorded
  against that decision rather than suppressed: the literature does note that
  BMKS "has overlapping clinical features with Treacher Collins syndrome", and
  small mouth/small chin have been described in individual reports. Neither
  amounts to the symmetric zygoma-maxilla-mandible hypoplasia bundle the module
  node asserts, so the decline stands, but it is a judgement rather than a
  clear-cut exclusion and should be revisited if a systematic craniofacial
  morphometric series is published.

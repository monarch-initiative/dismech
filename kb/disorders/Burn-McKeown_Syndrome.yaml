    directness: DIRECT
    snippet: promoter activity of constructs containing the type 1 Δ (del1) and type 2 Δ (del2) was reduced by 59% and 72%, respectively, compared to the wild-type construct.
    explanation: Reporter output measures reduced promoter activity in HEK293 cells.

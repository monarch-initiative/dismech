name: Burn-McKeown Syndrome
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Burn-McKeown syndrome is a rare autosomal recessive craniofacial disorder caused by biallelic TXNL4A variants.
  Bilateral choanal atresia or stenosis occurs with a recognizable facial pattern, lower eyelid defects, hearing
  impairment, variable clefting and micrognathia, and occasional cardiac or other anomalies. Intellectual development
  is usually normal but exceptions occur. Most genotypes combine a hypomorphic 34-bp promoter deletion with
  a coding, splice or copy-number loss-of-function allele; homozygous promoter deletions also occur. Human-cell
  and experimental models support selective splicing defects and impaired neural crest development, with tissue
  specificity and individual downstream routes incompletely resolved. BMKS is the syndromic part of a broader
  TXNL4A spectrum that also includes isolated choanal atresia.
category: Mendelian
parents:
- Craniofacial Malformation Syndrome
- Spliceosomopathy
notes: >-
  This entry covers Burn-McKeown syndrome, not every TXNL4A-related choanal-atresia presentation. GeneReviews
  phenotype counts pool the wider TXNL4A spectrum and are identified as such below. TXNL4A is distinct from
  EFTUD2, SF3B4 and SNRPB craniofacial disorders. Conformance to the first two pharyngeal-arch/neural-crest
  module nodes reflects a shared developmental route; the third module node asserts a symmetric multi-element
  skeletal bundle not established across BMKS. This does not imply absence of micrognathia, maxillary hypoplasia
  or malar abnormalities in BMKS. Expression biomarkers in unrelated cancers do not establish a BMKS cancer
  predisposition.

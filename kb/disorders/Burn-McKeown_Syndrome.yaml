pathophysiology:
- name: Recurrent TXNL4A Promoter Deletion
  description: The recurrent type 1 and type 2 alleles are distinct, partially overlapping 34-bp deletions in the TXNL4A promoter. They disrupt a region containing two 22-bp repeats separated by a 12-bp spacer; there is no single 56-bp pathogenic deletion. These regulatory alterations are distinct from coding, splice-site and copy-number loss on the other allele. Most BMKS genotypes combine a type 1 deletion with a loss-of-function allele; homozygous promoter deletions also occur.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:25434003
    reference_title: Compound heterozygosity of low-frequency promoter deletions and rare loss-of-function mutations in TXNL4A causes Burn-McKeown syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In 8 families, affected individuals carried a rare loss-of-function mutation (nonsense, frameshift, or microdeletion) on one allele and a low-frequency 34 bp deletion (allele frequency 0.76%) in the core promoter region on the other allele.
    explanation: Defines the recurrent regulatory-plus-loss-of-function architecture, not a single dominant allele.

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    BMKS is autosomal recessive. Most affected individuals are compound
    heterozygotes for a low-frequency 34-bp TXNL4A promoter deletion and a rare
    coding loss-of-function variant on the other allele; homozygosity for a
    promoter deletion also occurs. Sibs of a proband have a 25% recurrence risk,
    and prenatal and preimplantation testing are possible once the familial
    variants are known.
  evidence:
  - reference: PMID:27413799
    reference_title: "TXNL4A-Related Craniofacial Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TXNL4A-related craniofacial disorders are inherited in an autosomal recessive manner. At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance inheriting neither of the familial TXNL4A pathogenic variants."
    explanation: GeneReviews states the mode of inheritance and the recurrence risk.
  - reference: PMID:32187816
    reference_title: "Burn-McKeown syndrome with biallelic promoter type 2 deletion in TXNL4A in two siblings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygosity or compound heterozygosity of promoter deletions and null variants in TXNL4A are known to cause most cases of BMKS."
    explanation: Documents both the compound-heterozygous and homozygous promoter-deletion genotypes.
pathophysiology:
- name: Reduced TXNL4A Expression from Biallelic Promoter and Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    The characteristic BMKS genotype is a 34-bp deletion in the TXNL4A promoter
    (type 1 or type 2) in trans with a coding or splice loss-of-function variant,
    or homozygosity for a promoter deletion. The deleted 56-bp promoter region
    contains a 22-bp repeated motif that is essential for TXNL4A expression, and
    the splice-site variants at the final intron cause skipping of the final
    exon. The net effect is a quantitative reduction in TXNL4A protein rather
    than its complete absence, which is why BMKS behaves as a hypomorphic dosage
    disorder.
  genes:
  - preferred_term: TXNL4A
    term:
      id: hgnc:30551
      label: TXNL4A
  downstream:
  - target: Impaired U5 snRNP and Tri-snRNP Spliceosome Function
    causal_link_type: DIRECT
    description: >-
      Reduced TXNL4A protein lowers the availability of a U5 snRNP core component
      needed for tri-snRNP assembly and catalytic spliceosome function.
  evidence:
  - reference: PMID:25434003
    reference_title: "Compound heterozygosity of low-frequency promoter deletions and rare loss-of-function mutations in TXNL4A causes Burn-McKeown syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results indicate that BMKS is an autosomal-recessive condition, which is frequently caused by compound heterozygosity of low-frequency promoter deletions in combination with very rare loss-of-function mutations."
    explanation: Establishes the defining compound-heterozygous promoter-deletion-plus-null genotype as the cause of BMKS.
  - reference: PMID:25434003
    reference_title: "Compound heterozygosity of low-frequency promoter deletions and rare loss-of-function mutations in TXNL4A causes Burn-McKeown syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Reporter gene and in vivo assays showed that the promoter deletions led to reduced expression of TXNL4A."
    explanation: Direct functional demonstration that the promoter deletions reduce TXNL4A expression, which is the dosage premise of this node.
  - reference: PMID:34713892
    reference_title: "Expanding the genotypic spectrum of TXNL4A variants in Burn-McKeown syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we identify putative transcription factor binding sites within the 56 bp of the TXNL4A promoter affected by the type 1 and type 2 Δ34 and use dual luciferase assays to identify a 22 bp repeated motif essential for TXNL4A expression within this promoter region"
    explanation: Luciferase assays localise the essential expression element within the deleted promoter region, explaining why the deletions reduce TXNL4A expression.
  - reference: PMID:34713892
    reference_title: "Expanding the genotypic spectrum of TXNL4A variants in Burn-McKeown syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show the c.258-3C>G variant and a previously reported c.258-2A>G variant, cause skipping of the final exon of TXNL4A in a minigene splicing assay."
    explanation: Minigene assays demonstrate the loss-of-function mechanism of the intronic splice-site alleles.
  - reference: PMID:32735620
    reference_title: "Modelling the developmental spliceosomal craniofacial disorder Burn-McKeown syndrome using induced pluripotent stem cells."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The majority of affected individuals with BMKS have a 34 base pair deletion in the promoter region of one allele of TXNL4A combined with a loss-of-function variant on the other allele, resulting in reduced TXNL4A expression."
    explanation: Background restatement of the human genetics in the introduction of an in vitro study; tagged OTHER because it is not that paper's own finding. It is retained because it states the dosage premise of this node in one sentence.
- name: Impaired U5 snRNP and Tri-snRNP Spliceosome Function
  biological_scale: MOLECULAR
  conforms_to: "pharyngeal_arch_patterning_serial_homology#Cranial Neural Crest and Pharyngeal Arch Program Perturbation"
  description: >-
    TXNL4A (Dib1) is a core protein of the U5 small nuclear ribonucleoprotein,
    which sits at the centre of the catalytic spliceosome and is a component of
    the U4/U6.U5 tri-snRNP. Reduced TXNL4A dosage therefore degrades general
    pre-mRNA splicing capacity. Crucially the consequence is not uniform: only a
    subset of transcripts is affected, and the mis-spliced genes share sequence
    properties (transcript length, branch-point-to-3'-splice-site distance,
    splice-site strength) that make them unusually sensitive to reduced TXNL4A.
    This selectivity is the current explanation for how a ubiquitously expressed
    housekeeping protein produces a tissue-restricted craniofacial phenotype.
  cell_types:
  - preferred_term: migratory cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: DECREASED
  - preferred_term: spliceosomal snRNP assembly
    term:
      id: GO:0000387
      label: spliceosomal snRNP assembly
    modifier: DECREASED
  downstream:
  - target: Defective Cranial Neural Crest Formation and Differentiation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Selective mis-splicing degrades transcripts required for neural crest
      specification, EMT and migration.
  - target: Dampened WNT Signalling via TCF7L2 Mis-Splicing
    causal_link_type: DIRECT
    description: >-
      Mis-splicing of TCF7L2 exon 4 is the identified candidate route from
      splicing failure to reduced WNT responsiveness.
  evidence:
  - reference: PMID:25434003
    reference_title: "Compound heterozygosity of low-frequency promoter deletions and rare loss-of-function mutations in TXNL4A causes Burn-McKeown syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Depletion of TXNL4A (Dib1) in yeast demonstrated reduced assembly of the tri-snRNP complex."
    explanation: Direct functional evidence that TXNL4A depletion reduces tri-snRNP assembly, the specific molecular claim this node makes and the basis for the DECREASED spliceosomal snRNP assembly annotation.
  - reference: PMID:40264708
    reference_title: "Addressing the tissue specificity of U5 snRNP spliceosomopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At the centre of the catalytic spliceosome is the U5 small nuclear ribonucleoprotein (snRNP). Pathogenic variants in U5 snRNP core proteins are associated with various diseases commonly known as spliceosomopathies."
    explanation: Establishes TXNL4A's U5 snRNP context and the spliceosomopathy disease class.
  - reference: PMID:32735620
    reference_title: "Modelling the developmental spliceosomal craniofacial disorder Burn-McKeown syndrome using induced pluripotent stem cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "mis-spliced genes shared common sequence properties such as length, branch point to 3' splice site (BPS-3'SS) distance and splice site strengths, suggesting that splicing of particular subsets of genes is particularly sensitive to changes in TXNL4A expression"
    explanation: Provides the mechanistic basis for transcript selectivity, which is how a housekeeping-protein defect becomes tissue-restricted.
  - reference: PMID:32735620
    reference_title: "Modelling the developmental spliceosomal craniofacial disorder Burn-McKeown syndrome using induced pluripotent stem cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RNA-Seq analysis revealed significant differences in gene expression and alternative splicing"
    explanation: Patient-derived iPSCs show measurable gene-expression and alternative-splicing changes, confirming the splicing lesion in patient cells.
- name: Defective Cranial Neural Crest Formation and Differentiation
  biological_scale: CELLULAR
  conforms_to: "pharyngeal_arch_patterning_serial_homology#Disrupted Pharyngeal-Arch Patterning and Neural-Crest Skeletogenesis"
  description: >-
    Cranial neural crest cells are the progenitors of the facial skeleton and are
    the cell type in which spliceosome dosage matters most. Txnl4a knockdown in
    Xenopus produces cranial neural crest formation defects, placing TXNL4A
    alongside Eftud2 and Snrpb in a common craniofacial spliceosomopathy
    aetiology. In patient-derived cells, BMKS iPSCs proliferate more slowly than
    control and show defective differentiation into induced neural crest cells,
    with a specific delay in undergoing the epithelial-to-mesenchymal transition
    that neural crest cells must complete in order to delaminate and migrate.
  cell_types:
  - preferred_term: migratory cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  biological_processes:
  - preferred_term: neural crest cell development
    term:
      id: GO:0014032
      label: neural crest cell development
    modifier: DECREASED
  - preferred_term: epithelial to mesenchymal transition
    term:
      id: GO:0001837
      label: epithelial to mesenchymal transition
    modifier: DECREASED
  downstream:
  - target: Craniofacial Neural-Crest-Derived Malformation
    causal_link_type: DIRECT
    description: >-
      Reduced or mis-differentiated cranial neural crest yields hypoplastic and
      malformed neural-crest-derived facial structures.
  evidence:
  - reference: PMID:35893124
    reference_title: "The Core Splicing Factors EFTUD2, SNRPB and TXNL4A Are Essential for Neural Crest and Craniofacial Development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results point to defects in cranial neural crest cell formation as the likely culprit for MFD associated with EFTUD2, SNRPB and TXNL4A haploinsufficiency, and suggest a commonality in the etiology of these craniofacial spliceosomopathies."
    explanation: Xenopus knockdown of Txnl4a produces cranial neural crest formation defects, establishing the neural crest as the affected cell population.
  - reference: PMID:32735620
    reference_title: "Modelling the developmental spliceosomal craniofacial disorder Burn-McKeown syndrome using induced pluripotent stem cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient iPSCs displayed defective differentiation into iNCCs compared to maternal and unrelated control iPSCs, in particular a delay in undergoing an epithelial-to-mesenchymal transition (EMT)."
    explanation: Patient-derived cells show the neural crest differentiation and EMT defect directly in human cells, with an isogenic-adjacent maternal control.
  - reference: PMID:32735620
    reference_title: "Modelling the developmental spliceosomal craniofacial disorder Burn-McKeown syndrome using induced pluripotent stem cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "BMKS patient-derived iPSCs proliferated more slowly than both mother- and unrelated control-derived iPSCs"
    explanation: Documents the proliferation deficit that accompanies the differentiation defect in patient cells.
- name: Dampened WNT Signalling via TCF7L2 Mis-Splicing
  biological_scale: MOLECULAR
  description: >-
    RNA-Seq of BMKS patient-derived induced neural crest cells showed widespread
    mis-splicing in genes relevant to craniofacial and embryonic development, with
    the dominant signature being a dampened response to WNT signalling - the key
    pathway activated during induced neural crest differentiation. Mis-splicing of
    exon 4 of TCF7L2, which encodes a core WNT-pathway transcription factor, was
    identified as a candidate cause of that reduced WNT response. This node is
    curated at provisional confidence: the TCF7L2 link is proposed by the authors
    as a potential cause rather than demonstrated by rescue.
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: DECREASED
  downstream:
  - target: Defective Cranial Neural Crest Formation and Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced WNT responsiveness impairs the neural crest differentiation program
      that WNT signalling drives.
  evidence:
  - reference: PMID:32735620
    reference_title: "Modelling the developmental spliceosomal craniofacial disorder Burn-McKeown syndrome using induced pluripotent stem cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RNA-Seq analysis of differentiated iNCCs revealed widespread gene expression changes and mis-splicing in genes relevant to craniofacial and embryonic development that highlight a dampened response to WNT signalling, the key pathway activated during iNCC differentiation."
    explanation: Establishes reduced WNT responsiveness as the dominant transcriptomic signature in patient neural crest cells.
  - reference: PMID:32735620
    reference_title: "Modelling the developmental spliceosomal craniofacial disorder Burn-McKeown syndrome using induced pluripotent stem cells."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "we identified the mis-splicing of TCF7L2 exon 4, a key gene in the WNT pathway, as a potential cause of the downregulated WNT response in patient cells"
    explanation: The TCF7L2 link is offered as a potential cause and is not established by rescue, which is why this node carries PROVISIONAL mechanism confidence and the evidence is curated as PARTIAL.
- name: Craniofacial Neural-Crest-Derived Malformation
  biological_scale: TISSUE
  description: >-
    The tissue-level outcome is a distinctive, recognisable craniofacial
    malformation pattern: bilateral choanal atresia or stenosis, short palpebral
    fissures with coloboma of the outer third of the lower eyelids, a prominent
    nasal bridge with widely spaced eyes, a short philtrum, a thin upper lip
    vermilion, and prominent ears, with cleft lip and/or palate and preauricular
    tags in a minority. Middle- and inner-ear involvement produces conductive and
    sensorineural hearing loss. The malar and mandibular hypoplasia that defines
    mandibulofacial dysostosis is not part of this pattern, and the choanal
    atresia arises from failure of the bucconasal membrane rather than from an
    arch derivative.
  biological_processes:
  - preferred_term: face morphogenesis
    term:
      id: GO:0060325
      label: face morphogenesis
    modifier: ABNORMAL
  downstream:
  - target: Choanal Atresia
    causal_link_type: DIRECT
    description: >-
      Failure of the bucconasal membrane to rupture produces bilateral choanal
      atresia or stenosis, the cardinal feature.
  - target: Lower Eyelid Coloboma
    causal_link_type: DIRECT
    description: Coloboma of the outer third of the lower eyelid.
  - target: Hearing Loss
    causal_link_type: DIRECT
    description: >-
      Middle- and inner-ear involvement produces conductive and sensorineural
      hearing loss.
  - target: Conductive Hearing Impairment
    causal_link_type: DIRECT
    description: >-
      Middle-ear (ossicular/tympanic) involvement of arch-derived structures
      produces the conductive component of the hearing loss.
  - target: Sensorineural Hearing Impairment
    causal_link_type: DIRECT
    description: >-
      Inner-ear involvement produces the sensorineural component of the hearing
      loss.
  - target: Prominent Ears
    causal_link_type: DIRECT
    description: Prominent/protruding ears are part of the facial gestalt.
  - target: Short Palpebral Fissures
    causal_link_type: DIRECT
    description: Short palpebral fissures are part of the periorbital component of the malformation pattern.
  - target: Hypertelorism
    causal_link_type: DIRECT
    description: Widely spaced eyes accompany the prominent nasal bridge in the midfacial component of the pattern.
  - target: Prominent Nasal Bridge
    causal_link_type: DIRECT
    description: A prominent nasal bridge is the midfacial element of the malformation pattern.
  - target: Short Philtrum
    causal_link_type: DIRECT
    description: A short philtrum arises from the same disturbance of frontonasal and maxillary prominence fusion.
  - target: Thin Upper Lip Vermilion
    causal_link_type: DIRECT
    description: A thin upper lip vermilion accompanies the short philtrum in the perioral component of the pattern.
  - target: Cleft Lip
    causal_link_type: DIRECT
    description: >-
      Failure of fusion of the medial nasal and maxillary prominences produces
      cleft lip in a minority.
  - target: Cleft Palate
    causal_link_type: DIRECT
    description: >-
      Failure of palatal shelf elevation and fusion produces cleft palate in a
      minority.
  - target: Preauricular Skin Tag
    causal_link_type: DIRECT
    description: >-
      Preauricular tags represent supernumerary first/second arch hillock
      derivatives.
  evidence:
  - reference: PMID:27413799
    reference_title: "TXNL4A-Related Craniofacial Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Burn-McKeown syndrome (BMKS), which is characterized by typical craniofacial features (bilateral choanal atresia/stenosis, short palpebral fissures, coloboma of the lower eyelids, prominent nasal bridge with widely spaced eyes, short philtrum, thin vermilion of the upper lip, and prominent ears)."
    explanation: GeneReviews defines the composite craniofacial malformation pattern that this node represents.
  - reference: PMID:14564154
    reference_title: "Two brothers with Burn-McKeown syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bilateral choanal atresia, and a characteristic pattern of facial dysmorphic features consisting of hypertelorism, lower lid coloboma, narrow palpebral fissures, prominent nasal bridge, small mouth with thin lips, and protruding ears"
    explanation: An independent family report documents the same recognisable facial pattern.

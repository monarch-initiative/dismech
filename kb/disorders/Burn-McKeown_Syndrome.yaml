genetic:
- name: TXNL4A
  gene_term:
    preferred_term: TXNL4A
    term:
      id: hgnc:30551
      label: TXNL4A
  association: Causal - biallelic loss-of-function and promoter-deletion variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Positive
  notes: >-
    TXNL4A is at 18q23 and encodes the U5 snRNP core protein TXNL4A/Dib1. The
    BMKS genotype is biallelic and hypomorphic rather than null. Almost every
    reported proband carries at least one copy of one of two partially
    overlapping 34-bp deletions in the TXNL4A promoter (type 1 or type 2), which
    remove part of a 22-bp repeated motif essential for TXNL4A expression. The
    second allele is usually a coding or splice loss-of-function variant
    (nonsense, frameshift, microdeletion, or an intronic variant at the final
    intron causing skipping of the final exon); homozygosity for a promoter
    deletion also occurs. Because copy-number loss is one of the second-allele
    classes, deletion/duplication analysis must be part of the testing strategy
    alongside promoter sequencing. The same
    gene causes a milder allelic spectrum - isolated choanal atresia and choanal
    atresia with minor anomalies - so BMKS is the severe end of a TXNL4A-related
    craniofacial spectrum rather than an isolated entity.
  evidence:
  - reference: PMID:27413799
    reference_title: "TXNL4A-Related Craniofacial Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of a TXNL4A-related craniofacial disorder is established in a proband with suggestive findings and biallelic pathogenic variants in TXNL4A identified by molecular genetic testing. All probands described to date have had at least one copy of one of the two partially overlapping 34-bp deletions in the TXNL4A promoter."
    explanation: GeneReviews states the biallelic requirement and the near-universal presence of a 34-bp promoter deletion allele.
  - reference: PMID:25434003
    reference_title: "Compound heterozygosity of low-frequency promoter deletions and rare loss-of-function mutations in TXNL4A causes Burn-McKeown syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a rare loss-of-function mutation (nonsense, frameshift, or microdeletion) on one allele"
    explanation: Enumerates the second-allele variant classes, including microdeletion, which is why copy-number analysis is required in addition to promoter sequencing.
  - reference: PMID:25434003
    reference_title: "Compound heterozygosity of low-frequency promoter deletions and rare loss-of-function mutations in TXNL4A causes Burn-McKeown syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations were found in 9 of 11 affected families."
    explanation: Quantifies the diagnostic yield of TXNL4A testing in a clinically ascertained BMKS cohort.
  - reference: PMID:28905882
    reference_title: "Identification of causative variants in TXNL4A in Burn-McKeown syndrome and isolated choanal atresia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hence, we identified causative recessive variants in TXNL4A in two individuals with BMKS as well as in three individuals (from two families) with isolated choanal atresia."
    explanation: Establishes the allelic spectrum in which the same gene causes both BMKS and isolated choanal atresia.
  - reference: PMID:34713892
    reference_title: "Expanding the genotypic spectrum of TXNL4A variants in Burn-McKeown syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients have a loss-of-function variant in trans with a 34-base pair (bp) deletion (type 1 Δ34) in the promoter region."
    explanation: Confirms the canonical compound-heterozygous architecture.
  - reference: PMID:34713892
    reference_title: "Expanding the genotypic spectrum of TXNL4A variants in Burn-McKeown syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, our data emphasises the need to analyse the non-coding sequence in individuals where a single likely pathogenic coding variant is identified in an autosomal recessive disorder consistent with the clinical presentation."
    explanation: States the diagnostic implication that the promoter (non-coding) allele will be missed unless specifically sought.
diagnosis:
- name: Molecular Genetic Testing for TXNL4A Including the Promoter Region
  description: >-
    The diagnosis is established by identifying biallelic pathogenic TXNL4A
    variants. Testing must explicitly interrogate the non-coding promoter region:
    because virtually every proband carries a 34-bp promoter deletion on at least
    one allele, standard exome or coding-only panel analysis will find only one
    variant and the diagnosis will be missed. When a single likely pathogenic
    coding TXNL4A variant is found in a clinically consistent individual, the
    promoter must be sequenced.
  presence: Biallelic pathogenic variants in affected individuals
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:27413799
    reference_title: "TXNL4A-Related Craniofacial Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All probands described to date have had at least one copy of one of the two partially overlapping 34-bp deletions in the TXNL4A promoter."
    explanation: Establishes that promoter analysis is effectively mandatory for molecular diagnosis.
  - reference: PMID:34713892
    reference_title: "Expanding the genotypic spectrum of TXNL4A variants in Burn-McKeown syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our data emphasises the need to analyse the non-coding sequence in individuals where a single likely pathogenic coding variant is identified"
    explanation: States the specific diagnostic protocol point that follows from the promoter-allele architecture.
differential_diagnoses:
- name: CHARGE Syndrome (CHD7)
  description: >-
    The principal clinical differential. CHARGE also features choanal atresia,
    coloboma, cardiac defects, ear anomalies and hearing loss, and the MONDO
    definition of BMKS notes that the features overlap considerably. CHD7
    testing distinguishes them.
- name: Treacher Collins Syndrome (TCOF1, POLR1C/POLR1D)
  description: >-
    Shares lower eyelid coloboma and ear anomalies and is the closest
    mechanistic analogue - a ribosome-biogenesis rather than spliceosome defect
    depleting cranial neural crest. Distinguished by the malar and mandibular
    hypoplasia that BMKS lacks.
- name: Mandibulofacial Dysostosis with Microcephaly (EFTUD2)
  description: >-
    The other U5 snRNP spliceosomopathy. Shares the core splicing-factor
    mechanism but differs clinically in having microcephaly, mandibulofacial
    dysostosis and intellectual disability, whereas BMKS intellect is usually
    normal. Curated separately in dismech as
    `Mandibulofacial_Dysostosis_with_Microcephaly`.
- name: Nager Syndrome (SF3B4)
  description: >-
    An acrofacial dysostosis caused by a different core splicing factor; shares
    the craniofacial spliceosomopathy mechanism but adds preaxial limb defects.
- name: Cerebrocostomandibular Syndrome (SNRPB)
  description: >-
    A further craniofacial spliceosomopathy, characterised by Robin sequence and
    rib defects.
- name: Isolated Choanal Atresia
  description: >-
    Allelic - homozygosity for a TXNL4A promoter deletion has been found in
    individuals with isolated choanal atresia, so isolated choanal atresia is both
    a differential and a milder point on the same TXNL4A spectrum.
treatments:
- name: Neonatal Airway Management and Choanal Atresia Repair
  description: >-
    Bilateral choanal atresia causes airway compromise at delivery because
    neonates are obligate nasal breathers. Immediate management may require
    intubation, followed by surgical correction of the choanal
    stenosis/atresia.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Choanal atresia
    term:
      id: HP:0000453
      label: Choanal atresia
  evidence:
  - reference: PMID:27413799
    reference_title: "TXNL4A-Related Craniofacial Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neonates with airway compromise at delivery may require intubation or surgical correction of choanal stenosis/atresia."
    explanation: GeneReviews states the acute airway management and definitive surgical treatment for the cardinal feature.
- name: Ophthalmological Care for Lower Eyelid Defects
  description: >-
    Lower eyelid defects can cause corneal exposure. Ophthalmological care is
    required to reduce the risk of corneal scarring, and monitoring by an
    ophthalmologist is part of recommended surveillance.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Lower eyelid coloboma
    term:
      id: HP:0000652
      label: Lower eyelid coloboma
  evidence:

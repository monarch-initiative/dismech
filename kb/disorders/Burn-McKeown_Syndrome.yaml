- name: TXNL4A Promoter and Second-Allele Testing
  description: Confirm biallelic pathogenic or likely pathogenic TXNL4A variants in a clinically consistent individual. Test recurrent promoter deletions explicitly, then coding/splice variants and exon or whole-gene copy-number loss as appropriate. Panels and genome analyses must include the noncoding promoter; exome coverage and standard genome filters can miss it. A pair of VUS, or one pathogenic variant plus a VUS, does not establish or rule out the diagnosis.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:

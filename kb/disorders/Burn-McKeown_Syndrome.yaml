animal_models:
- species: Xenopus laevis
  genotype: Txnl4a morpholino knockdown
  genes:
  - preferred_term: TXNL4A
    term:
      id: hgnc:30551
      label: TXNL4A
  associated_phenotypes:
  - Defective cranial neural crest formation
  description: >-
    Knockdown of Txnl4a in Xenopus embryos, assayed across successive stages of
    neural crest and craniofacial development alongside Eftud2 and Snrpb
    knockdown, produces cranial neural crest formation defects. The parallel
    design establishes that the three core splicing factors converge on the same
    neural crest aetiology.
  evidence:
  - reference: PMID:35893124
    reference_title: "The Core Splicing Factors EFTUD2, SNRPB and TXNL4A Are Essential for Neural Crest and Craniofacial Development."
    supports: SUPPORT

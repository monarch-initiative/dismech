  description: >-
    Bilateral choanal atresia or stenosis is the cardinal presenting feature in reported BMKS series and can
    cause life-threatening neonatal airway obstruction. The cited clinical studies do not establish a single
    embryologic mechanism for the obstruction.
  diagnostic: true
  phenotype_term:

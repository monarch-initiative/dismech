      snippet: rMATS identified 2991 differential splicing events in 2029 different genes
      explanation: Neural crest-stage result.
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
  - target: Delayed Neural Crest Epithelial-to-Mesenchymal Transition
    description: Transcript and isoform markers remain more epithelial after induction.

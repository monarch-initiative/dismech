  description: >-
    Unilateral translation-blocking morpholino injection at the two-cell stage reduces neural crest markers,
    increases dorsal ectodermal apoptosis at neurula stage 15, and produces cranial cartilage defects in 38%
    of stage-45 tadpoles. A resistant Txnl4a construct partly rescues sox10 expression. This transient knockdown
    does not reproduce the human promoter-plus-loss-of-function genotype and does not establish dominant inheritance
    or p53 dependence.

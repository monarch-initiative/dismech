discussions:
- discussion_id: bmks_spliceosome_tissue_specificity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does reduced dosage of TXNL4A, a ubiquitously expressed core spliceosome protein, produce a malformation
    restricted to craniofacial structures rather than a generalised phenotype?
  attaches_to:
  - pathophysiology#Selective Pre-mRNA Mis-Splicing
  rationale: >-
    Selective splicing changes, a candidate TCF7L2/WNT route, and an experimental Mdm2-p53/metabolic route
    offer partial explanations for tissue specificity. Txnl4a-specific stress-response evidence now exists
    in mouse embryonic stem cells, but patient neural crest validation is lacking. Patient cells did not show
    increased apoptosis, unlike the frog knockdown model. Perturbation strength, cell state, genetic background
    and developmental stage may all affect the phenotype.
  proposed_experiments:
  - experiment_id: bmks_p53_axis_in_patient_incc
    name: Test the P53/MDM2-MDM4 stress axis in BMKS patient iNCCs
    description: >-
      Assay MDM2 and MDM4 regulatory-exon skipping, p53 stabilization and apoptosis in multiple BMKS patient-derived
      neural crest lines with isogenic and unaffected controls, and test whether controlled p53 perturbation
      changes differentiation and EMT. The unaffected mother is a carrier control, not an isogenic comparator.
    decision_criterion: >-
      Concordant molecular changes and rescue across multiple patient lines with isogenic controls would strengthen
      a causal role. Absent rescue would limit that intervention under the tested conditions, not by itself
      exclude all p53-dependent or independent contributions.
  - experiment_id: bmks_tcf7l2_rescue
    name: TCF7L2 isoform rescue in BMKS neural crest
    description: >-
      Express the correctly spliced TCF7L2 isoform in BMKS patient iNCCs and test whether WNT responsiveness,
      EMT timing and differentiation are restored.
    decision_criterion: >-
      Isoform-specific rescue with appropriate expression and timing controls would strengthen mediation of
      the WNT/EMT defect. Failure could reflect incomplete rescue, timing or parallel pathways and would not
      alone prove that TCF7L2 is only a marker.
  evidence:
  - reference: PMID:32735620
    reference_title: "Modelling the developmental spliceosomal craniofacial disorder Burn-McKeown syndrome using induced pluripotent stem cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, it is unclear how reduced expression of this ubiquitously expressed spliceosome protein results in craniofacial defects during development."
    explanation: States the knowledge gap explicitly for TXNL4A/BMKS.
    quote_role: BACKGROUND
    directness: INDIRECT
  - reference: PMID:32315467
    reference_title: "Spliceosomopathies and neurocristopathies: Two sides of the same coin?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We speculate that mutations in a subset of core splicing factors lead to disrupted splicing in neural crest cells because these cells have increased sensitivity to inefficient splicing."
    explanation: The review explicitly proposes heightened neural crest sensitivity to splicing inefficiency. It does not establish a particular stress-response mechanism in BMKS patient neural crest cells.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:38426258
    reference_title: A common cellular response to broad splicing perturbations is characterized by metabolic transcript downregulation driven by the Mdm2-p53 axis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: specific KD of any the above splicing factors also resulted in increased presence of the Exon 3-skipping Mdm2 transcript
    explanation: Txnl4a-specific cell-culture evidence updates the earlier hypothesis; the patient neural crest question remains open.
- discussion_id: bmks-model-apoptosis-differences
  kind: INTERPRETATION
  status: OPEN
  prompt: Does increased apoptosis mediate all BMKS developmental defects?
  rationale: The Xenopus study found increased ectodermal TUNEL staining but incorrectly described the earlier patient-iPSC study as showing increased apoptosis. The original patient-cell data found no significant apoptosis difference in either iPSCs or induced neural crest cells. The frog paper also describes TXNL4A haploinsufficiency, which should not replace the established recessive human inheritance model.
  attaches_to:
  - pathophysiology#Increased Embryonic Ectodermal Apoptosis
  evidence:
  - reference: PMID:32735620
    reference_title: Modelling the developmental spliceosomal craniofacial disorder Burn-McKeown syndrome using induced pluripotent stem cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Annexin-V staining revealed no significant differences in apoptosis between the patient iNCCs and the mother and unrelated control iNCCs
    explanation: Primary human-cell result takes precedence over the later summary.
- discussion_id: bmks-atypical-finding-attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which uncommon findings belong to the TXNL4A phenotype?
  rationale: A reported infant with a dicentric X chromosome and homozygous TXNL4A promoter deletion had a blended diagnostic context. A separate autopsy case described an incidental hepatocellular adenoma in an infant with BMKS. These reports warrant careful phenotype attribution; they do not establish a recurrent cancer predisposition, justify tumor surveillance, or assign every additional finding to TXNL4A. Older TXNL4A-negative BMKS-like cases also should not define the molecularly confirmed phenotype.
  evidence:
  - reference: PMID:39695270
    reference_title: Ultra-rare monogenic disorders frequently detected among sex chromosome aneuploidy patients with atypical findings.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Whole exome sequencing was pursued at 3 months of life, revealing homozygosity for likely pathogenic variants in TXNL4A, causing Burn-McKeown syndrome.
    explanation: The full case also has a variant Turner-syndrome karyotype.
  - reference: PMID:36262073
    reference_title: "Hepatocellular Adenoma in an Infant With Burn-McKeown Syndrome: Report of a Case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Here we present an autopsy case of a 9-month-old girl with Burn-McKeown syndrome with an incidental liver nodule in the right lobe measuring 1.5 cm in greatest dimension.
    explanation: One incidental hepatocellular adenoma is an association, not evidence of a syndrome-wide predisposition.

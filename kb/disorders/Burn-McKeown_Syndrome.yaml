- name: BMKS patient-derived iPSC induced neural crest cells
  experimental_model_type: IPSC_DERIVED_MODEL
  cell_source: Blood mononuclear cells from one affected 11-year-old girl and her unaffected frameshift-carrier mother, with two unrelated male control donors
  culture_system: iPSC reprogramming followed by directed differentiation to induced neural crest cells (iNCCs)
  publication: PMID:32735620
  cell_types:
  - preferred_term: neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  description: >-
    Two patient and two maternal iPSC clones plus two unrelated control lines were examined. The patient carried
    type 1 promoter deletion in trans with c.131delT; the mother carried only the frameshift. Comparisons are
    not isogenic and include sex and genetic-background differences. The patient had atypical severe intellectual
    disability. MTT showed reduced iPSC proliferation, but neither iPSCs nor induced neural crest cells had
    significantly increased apoptosis. RNA-seq and differentiation findings require replication in additional
    families.

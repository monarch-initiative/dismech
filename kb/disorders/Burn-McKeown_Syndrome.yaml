    snippet: "Here we characterize the knockdown phenotype of Eftud2, Snrpb and Txnl4a in Xenopus embryos at different stages of neural crest and craniofacial development."
    explanation: Describes the Xenopus knockdown model used to establish the neural crest phenotype of Txnl4a loss.
experimental_models:
- name: BMKS patient-derived iPSC induced neural crest cells
  experimental_model_type: IPSC_DERIVED_MODEL
  cell_source: Peripheral blood mononuclear cells from a BMKS patient (TXNL4A compound heterozygote) and from her unaffected mother
  culture_system: iPSC reprogramming followed by directed differentiation to induced neural crest cells (iNCCs)
  publication: PMID:32735620
  cell_types:
  - preferred_term: migratory cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  description: >-
    The principal experimental system for BMKS mechanism. The unaffected mother's
    line provides a closely matched (though not isogenic) control. Limitation: the
    single patient donor is an atypical case, so findings should be replicated in
    additional lines before being generalised across the BMKS phenotypic spectrum.
  modeled_mechanisms:
  - target: Impaired U5 snRNP and Tri-snRNP Spliceosome Function
    description: >-
      RNA-Seq of patient iPSCs and iNCCs shows altered gene expression and
      alternative splicing relative to the maternal control.
  - target: Defective Cranial Neural Crest Formation and Differentiation
    description: >-
      Patient iPSCs differentiate defectively into induced neural crest cells with
      a delayed epithelial-to-mesenchymal transition.
  - target: Dampened WNT Signalling via TCF7L2 Mis-Splicing
    description: >-
      iNCC RNA-Seq shows a dampened WNT response, with TCF7L2 exon 4 mis-splicing
      proposed as the cause.
  findings:
  - statement: >-
      BMKS patient iPSCs proliferate more slowly than maternal and unrelated
      control lines and show significant differences in gene expression and
      alternative splicing.
    supporting_text: "BMKS patient-derived iPSCs proliferated more slowly than both mother- and unrelated control-derived iPSCs, and RNA-Seq analysis revealed significant differences in gene expression and alternative splicing."
  - statement: >-
      Differentiation to induced neural crest cells is defective, with a delay in
      undergoing the epithelial-to-mesenchymal transition.
    supporting_text: "Patient iPSCs displayed defective differentiation into iNCCs compared to maternal and unrelated control iPSCs, in particular a delay in undergoing an epithelial-to-mesenchymal transition (EMT)."
  evidence:
  - reference: PMID:32735620
    reference_title: "Modelling the developmental spliceosomal craniofacial disorder Burn-McKeown syndrome using induced pluripotent stem cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we reprogrammed peripheral mononuclear blood cells from a BMKS patient and her unaffected mother into induced pluripotent stem cells (iPSCs) and differentiated the iPSCs into induced neural crest cells (iNCCs), the key cell type required for correct craniofacial development."
    explanation: Describes the patient-derived cellular model and its maternal control, the principal experimental system for BMKS mechanism.
discussions:
- discussion_id: bmks_spliceosome_tissue_specificity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does reduced dosage of TXNL4A, a ubiquitously expressed core spliceosome
    protein, produce a malformation restricted to craniofacial structures rather
    than a generalised phenotype?
  attaches_to:
  - pathophysiology#Impaired U5 snRNP and Tri-snRNP Spliceosome Function
  rationale: >-
    This is the central unsolved problem of the craniofacial spliceosomopathies as
    a class, and it is stated as open in the primary literature. Two partial
    answers exist and are curated as separate nodes here: transcript-intrinsic
    sensitivity (mis-spliced genes share length, branch-point-to-3'-splice-site
    distance and splice-site-strength properties) and a downstream pathway effect
    (dampened WNT responsiveness via TCF7L2 exon 4 mis-splicing). A third
    proposal in the field, not curated as a node here because it has not been
    demonstrated for TXNL4A specifically, is that neural crest cells have an
    elevated sensitivity to inefficient splicing that triggers a P53-associated
    stress response through mis-splicing of MDM2/MDM4. Distinguishing these
    matters because they imply different therapeutic entry points. A limitation
    applying to all three: the human cellular evidence comes from a single patient
    donor line.
  proposed_experiments:
  - experiment_id: bmks_p53_axis_in_patient_incc
    name: Test the P53/MDM2-MDM4 stress axis in BMKS patient iNCCs
    description: >-
      Assay MDM2 and MDM4 regulatory-exon skipping, P53 stabilisation and
      apoptosis in BMKS patient-derived induced neural crest cells versus the
      maternal control, and test whether P53 inhibition rescues the
      differentiation and EMT delay.
    decision_criterion: >-
      Rescue by P53 inhibition would place BMKS in the same nucleolar/splicing
      stress-response mechanism proposed for the other craniofacial
      spliceosomopathies; absence of rescue would favour the transcript-selectivity
      and WNT explanations already curated.
  - experiment_id: bmks_tcf7l2_rescue
    name: TCF7L2 isoform rescue in BMKS neural crest
    description: >-
      Express the correctly spliced TCF7L2 isoform in BMKS patient iNCCs and test
      whether WNT responsiveness, EMT timing and differentiation are restored.
    decision_criterion: >-
      Restoration would upgrade the TCF7L2 node from PROVISIONAL to an established
      mechanism; failure would indicate TCF7L2 mis-splicing is a marker rather
      than a cause.
  evidence:
  - reference: PMID:32735620
    reference_title: "Modelling the developmental spliceosomal craniofacial disorder Burn-McKeown syndrome using induced pluripotent stem cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, it is unclear how reduced expression of this ubiquitously expressed spliceosome protein results in craniofacial defects during development."
    explanation: States the knowledge gap explicitly for TXNL4A/BMKS.
  - reference: PMID:32315467
    reference_title: "Spliceosomopathies and neurocristopathies: Two sides of the same coin?"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "We speculate that mutations in a subset of core splicing factors lead to disrupted splicing in neural crest cells because these cells have increased sensitivity to inefficient splicing."
    explanation: The P53/neural-crest-sensitivity proposal is explicitly framed by its authors as speculation, which is why it is curated in this discussion rather than as a pathophysiology node.

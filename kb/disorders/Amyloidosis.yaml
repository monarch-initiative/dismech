    aso_chemistry: TWO_PRIME_O_METHOXYETHYL
    conjugation: UNCONJUGATED
  description: >-
    2'-O-methoxyethyl-modified antisense oligonucleotide that triggers RNase
    H1-mediated degradation of TTR mRNA, lowering both wild-type and mutant
    transthyretin; licensed for hereditary ATTR polyneuropathy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: inotersen
      term:
        id: NCIT:C121667
        label: Inotersen
  target_mechanisms:
  - target: TTR Tetramer Destabilization and Monomer Release
    treatment_effect: INHIBITS
    description: RNase H1-mediated TTR mRNA degradation lowers the circulating precursor pool.
    evidence:
    - reference: DOI:10.1007/s40259-023-00577-7
      reference_title: "RNA Targeting and Gene Editing Strategies for Transthyretin Amyloidosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Inotersen is a 2´-O-methoxyethyl-modified ASO that binds to the 3´ untranslated portion of the complementary mRNA, promoting ribonuclease H1-mediated mRNA degradation."
      explanation: The review directly describes inotersen's TTR-directed RNase H1 degradation mechanism.
  evidence:
  - reference: DOI:10.1007/s40259-023-00577-7
    reference_title: "RNA Targeting and Gene Editing Strategies for Transthyretin Amyloidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "vutrisiran (siRNA) and inotersen (ASO) have all been licensed for treatment of ATTR-PN"
    explanation: Ioannou et al. document inotersen as a licensed antisense oligonucleotide gene silencer for ATTR polyneuropathy.

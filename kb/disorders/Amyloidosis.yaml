has_subtypes:
- name: AL
  display_name: AL (Immunoglobulin Light Chain) Amyloidosis
  description: >-
    Systemic amyloidosis caused by a clonal plasma cell dyscrasia in which
    misfolded monoclonal immunoglobulin light chains deposit as amyloid in
    multiple organs, most commonly the heart and kidneys.
  subtype_term:
    preferred_term: AL amyloidosis
    term:
      id: MONDO:0019438
      label: AL amyloidosis
  evidence:
  - reference: PMID:26858336
    reference_title: "First-in-Human Phase I/II Study of NEOD001 in Patients With Light Chain Amyloidosis and Persistent Organ Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Light chain (AL) amyloidosis is caused by the accumulation of misfolded proteins, which induces the dysfunction of vital organs."
    explanation: This trial publication explicitly defines AL amyloidosis as misfolded light chain accumulation causing organ dysfunction.
- name: ATTRv
  display_name: ATTRv (Hereditary Transthyretin) Amyloidosis
  description: >-
    Autosomal dominant amyloidosis caused by pathogenic variants in the TTR
    gene that destabilize the transthyretin tetramer, leading to monomer
    dissociation, misfolding, and amyloid fibril deposition predominantly in
    peripheral nerve and heart.
  evidence:
  - reference: PMID:25604431
    reference_title: "Transthyretin (ATTR) amyloidosis: clinical spectrum, molecular pathogenesis and disease-modifying treatments."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TTR protein destabilised by TTR gene mutation is prone to dissociate from its native tetramer to monomer, and to then misfold and aggregate into amyloid fibrils, resulting in autosomal dominant hereditary amyloidosis"
    explanation: Sekijima review describes the autosomal-dominant tetramer-dissociation mechanism of hereditary ATTR.
- name: ATTRwt
  display_name: ATTRwt (Wild-Type Transthyretin) Amyloidosis
  description: >-
    Age-related, non-hereditary amyloidosis in which native wild-type
    transthyretin progressively deposits as amyloid in the myocardium of older
    adults, causing restrictive cardiomyopathy (formerly senile systemic
    amyloidosis).
  subtype_term:
    preferred_term: wild type ATTR amyloidosis
    term:
      id: MONDO:0018018
      label: wild type ATTR amyloidosis
  evidence:
  - reference: PMID:26048914
    reference_title: "The transthyretin amyloidoses: advances in therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The non-hereditary form (ATTRwt) is caused by native or wild-type TTR and was previously referred to as senile systemic amyloidosis."
    explanation: Dubrey 2015 review defines wild-type ATTR as the non-hereditary, native TTR form previously called senile systemic amyloidosis.
  - reference: PMID:31731233
    reference_title: "Wild-type ATTR amyloidosis may be associated with unexpected death among the elderly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Wild-type ATTR amyloidosis (ATTR-wt) is characterized by the accumulation of amyloid in the heart, leading to fatal heart failure and arrhythmia."
    explanation: Shiozaki 2019 forensic autopsy series confirms cardiac-predominant amyloid in ATTRwt.
- name: AA
  display_name: AA (Serum Amyloid A) Amyloidosis
  description: >-
    Reactive systemic amyloidosis in which the acute-phase reactant serum
    amyloid A protein, chronically elevated in sustained inflammation
    (autoinflammatory syndromes, rheumatoid arthritis, chronic infection),
    is deposited as amyloid, typically targeting the kidneys.
  subtype_term:
    preferred_term: AA amyloidosis
    term:
      id: MONDO:0019439
      label: AA amyloidosis
  evidence:
  - reference: PMID:18514052
    reference_title: "[Amyloidosis AA]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A permanent acute phase response, ideally evaluated with serial measurement of serum protein SAA, the precursor of the AA protein deposited in tissues, seems to be a prerequisite to the development of inflammatory (AA) amyloidosis."
    explanation: Stankovic and Grateau identify chronic acute-phase elevation of SAA as the precursor mechanism for AA amyloidosis.
- name: Localized
  display_name: Localized Amyloidosis
  description: >-
    Amyloid deposition confined to one anatomic site rather than distributed
    systemically. Localized amyloid is etiologically heterogeneous, so this
    umbrella entry does not assume that every localized deposit is light-chain
    derived or produced by a local plasma-cell clone.
  evidence:
  - reference: PMID:33100054
    reference_title: "Amyloid nomenclature 2020: update and recommendations by the International Society of Amyloidosis (ISA) nomenclature committee."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "It was decided to include fibulin-like extracellular matrix protein 1 (amyloid protein: AEFEMP1), which appears as localised amyloid in portal veins."
    explanation: >-
      The ISA nomenclature update establishes that localized amyloid forms exist
      and gives AEFEMP1 portal-vein amyloid as one example; it does not imply a
      single precursor or clonal mechanism for all localized amyloidoses.
inheritance:
- name: Autosomal dominant inheritance of ATTRv amyloidosis
  description: >-
    Pathogenic TTR variants cause hereditary ATTR amyloidosis with autosomal
    dominant transmission and variable penetrance and age at onset.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:25604431
    reference_title: "Transthyretin (ATTR) amyloidosis: clinical spectrum, molecular pathogenesis and disease-modifying treatments."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TTR protein destabilised by TTR gene mutation is prone to dissociate from its native tetramer to monomer, and to then misfold and aggregate into amyloid fibrils, resulting in autosomal dominant hereditary amyloidosis"
    explanation: The review explicitly identifies the inherited ATTRv mechanism and autosomal dominant transmission.
pathophysiology:
- name: Clonal Immunoglobulin Light-Chain Precursor Excess
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "amyloidogenesis#Amyloidogenic Precursor Protein"
  description: >-
    In AL amyloidosis, a clonal CD38-positive plasma-cell population produces
    an amyloidogenic immunoglobulin light chain. This is an acquired clonal
    precursor-supply mechanism and is not the mechanism of ATTR or AA disease.
  cell_types:
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  downstream:
  - target: Protein Misfolding and Beta-Sheet Oligomerization
    causal_link_type: DIRECT
    description: Amyloidogenic light chains misfold and self-associate into aggregation-prone species.
    evidence:
    - reference: PMID:26858336
      reference_title: "First-in-Human Phase I/II Study of NEOD001 in Patients With Light Chain Amyloidosis and Persistent Organ Dysfunction."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Light chain (AL) amyloidosis is caused by the accumulation of misfolded proteins, which induces the dysfunction of vital organs."
      explanation: The trial report's background directly identifies misfolded protein accumulation in AL, but does not independently establish the self-association step.
  evidence:
  - reference: PMID:34192431
    reference_title: Daratumumab-Based Treatment for Immunoglobulin Light-Chain Amyloidosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Systemic immunoglobulin light-chain (AL) amyloidosis is characterized by deposition of amyloid fibrils of light chains produced by clonal CD38+ plasma cells."
    explanation: ANDROMEDA directly identifies the clonal plasma-cell source and light-chain precursor.
- name: TTR Tetramer Destabilization and Monomer Release
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "amyloidogenesis#Amyloidogenic Precursor Protein"
  gene:
    preferred_term: TTR
    term:
      id: hgnc:12405
      label: TTR
  description: >-
    In ATTRv, pathogenic TTR variants destabilize the circulating tetramer; in
    ATTRwt, age-associated destabilization occurs without a pathogenic coding
    variant. Tetramer dissociation releases monomers that can misfold.
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  downstream:
  - target: Protein Misfolding and Beta-Sheet Oligomerization
    causal_link_type: DIRECT
    description: Dissociated TTR monomers enter the misfolding and aggregation pathway.
    evidence:
    - reference: PMID:25604431
      reference_title: "Transthyretin (ATTR) amyloidosis: clinical spectrum, molecular pathogenesis and disease-modifying treatments."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "TTR protein destabilised by TTR gene mutation is prone to dissociate from its native tetramer to monomer, and to then misfold and aggregate into amyloid fibrils"
      explanation: The review directly states the causal sequence from tetramer destabilization through monomer misfolding and aggregation.
  evidence:
  - reference: PMID:25604431
    reference_title: "Transthyretin (ATTR) amyloidosis: clinical spectrum, molecular pathogenesis and disease-modifying treatments."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TTR protein destabilised by TTR gene mutation is prone to dissociate from its native tetramer to monomer, and to then misfold and aggregate into amyloid fibrils"
    explanation: The review directly supports the variant-TTR tetramer-dissociation sequence; the description separately bounds this evidence to ATTRv.
- name: Sustained Serum Amyloid A Precursor Production
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "amyloidogenesis#Amyloidogenic Precursor Protein"
  gene:
    preferred_term: SAA1
    term:
      id: hgnc:10513
      label: SAA1
  description: >-
    In AA amyloidosis, persistent inflammation maintains the hepatic acute-phase
    response and chronically elevates serum amyloid A, supplying the precursor
    from which AA fibrils are formed.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  downstream:
  - target: Protein Misfolding and Beta-Sheet Oligomerization
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - serum amyloid A cleavage and conformational conversion
    description: Sustained SAA supply permits cleavage, misfolding, and aggregation into AA amyloid.
    evidence:
    - reference: DOI:10.1007/s11926-024-01147-8
      reference_title: "AA Amyloidosis: A Contemporary View."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "serum AA (SAA) protein, through a long process including cleavage, misfolding, and aggregation into an insoluble beta-sheet form"
      explanation: The review directly supports the stated SAA cleavage, misfolding, and aggregation intermediates.
  evidence:
  - reference: PMID:18514052
    reference_title: "[Amyloidosis AA]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A permanent acute phase response, ideally evaluated with serial measurement of serum protein SAA, the precursor of the AA protein deposited in tissues, seems to be a prerequisite to the development of inflammatory (AA) amyloidosis."
    explanation: The review directly identifies persistent acute-phase SAA production as the AA precursor mechanism.
- name: Protein Misfolding and Beta-Sheet Oligomerization
  biological_scale: MOLECULAR
  role: amplifier
  conforms_to: "amyloidogenesis#Protein Misfolding and Beta-Sheet Oligomerization"
  description: >-
    Disease-specific precursors leave their native conformations and
    self-associate into beta-sheet-rich oligomeric and prefibrillar species.
    Soluble species can be proteotoxic, but the magnitude and organ specificity
    of that toxicity vary by precursor and are not assumed to be uniform.
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  downstream:
  - target: Amyloid Fibril Formation and Extracellular Deposition
    causal_link_type: DIRECT
    description: Beta-sheet-rich oligomers nucleate and elongate into insoluble extracellular amyloid fibrils.
    evidence:
    - reference: PMID:25604431
      reference_title: "Transthyretin (ATTR) amyloidosis: clinical spectrum, molecular pathogenesis and disease-modifying treatments."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "TTR protein destabilised by TTR gene mutation is prone to dissociate from its native tetramer to monomer, and to then misfold and aggregate into amyloid fibrils"
      explanation: The review directly supports progression from misfolding and aggregation to fibrils in ATTR; the generic oligomer-nucleation wording is a cross-precursor abstraction.
  evidence:
  - reference: PMID:25604431
    reference_title: "Transthyretin (ATTR) amyloidosis: clinical spectrum, molecular pathogenesis and disease-modifying treatments."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TTR protein destabilised by TTR gene mutation is prone to dissociate from its native tetramer to monomer, and to then misfold and aggregate into amyloid fibrils"
    explanation: Sekijima exemplifies the general precursor-destabilization-and-misfolding paradigm using transthyretin.
  - reference: PMID:26858336
    reference_title: "First-in-Human Phase I/II Study of NEOD001 in Patients With Light Chain Amyloidosis and Persistent Organ Dysfunction."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Light chain (AL) amyloidosis is caused by the accumulation of misfolded proteins, which induces the dysfunction of vital organs."
    explanation: The trial report's background supports the AL misfolding paradigm but is not primary mechanistic evidence for every oligomerization step.
- name: Amyloid Fibril Formation and Extracellular Deposition
  biological_scale: TISSUE
  role: central_effector
  conforms_to: "amyloidogenesis#Amyloid Fibril Formation and Extracellular Deposition"
  description: >-
    Misfolded precursors polymerize into cross-beta-sheet amyloid fibrils that
    accumulate extracellularly in precursor-specific target tissues. Progressive
    deposits disrupt tissue architecture; precursor-specific soluble species
    may add direct cellular toxicity. The downstream organ effects are therefore
    modeled separately and retain subtype-specific evidence.
  biological_processes:
  - preferred_term: amyloid fibril formation
    term:
      id: GO:1990000
      label: amyloid fibril formation
    modifier: INCREASED
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  evidence:
  - reference: PMID:40649158
    reference_title: "Transthyretin Amyloid Cardiomyopathy-2025 Update: Current Diagnostic Approaches and Emerging Therapeutic Options."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Transthyretin-related (ATTR) amyloidosis is a progressive, multisystem disease caused by the extracellular deposition of misfolded transthyretin (TTR) monomers as insoluble amyloid fibrils."
    explanation: This 2025 review explicitly states that extracellular deposition of misfolded monomers as insoluble amyloid fibrils causes progressive multisystem disease.
  - reference: DOI:10.1038/s41580-023-00647-2
    reference_title: "Mechanisms and pathology of protein misfolding and aggregation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Multiple lines of evidence suggest that small soluble species are responsible for the observed toxicity. These species have been associated with numerous detrimental effects, such as permeabilization of cellular membranes, impairment of degradation pathways, disruption of synaptic signalling and mitochondrial dysfunction"
    explanation: Louros et al. establish that soluble oligomeric species, not only mature fibrils, drive amyloid cytotoxicity via membrane permeabilization, impaired protein degradation, and mitochondrial dysfunction.
  - reference: DOI:10.1002/ana.26965
    reference_title: "Amyloid Neuropathy: From Pathophysiology to Treatment in Light-Chain Amyloidosis and Hereditary Transthyretin Amyloidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Amyloid fibrils deposit in the endoneurium of peripheral nerves, often extensive in the dorsal root ganglia and sympathetic ganglia, leading to atrophy of Schwann cells in proximity to amyloid fibrils"
    explanation: Chompoopong et al. localize amyloid fibril deposition to the endoneurium and dorsal root/sympathetic ganglia, causing Schwann cell atrophy, the substrate of amyloid neuropathy.
  downstream:
  - target: Amyloid Deposition
    causal_link_type: DIRECT
    description: >-
      Extracellular amyloid fibril deposition is the defining histopathologic
      phenotype of amyloidosis.
    evidence:
    - reference: PMID:40649158
      reference_title: "Transthyretin Amyloid Cardiomyopathy-2025 Update: Current Diagnostic Approaches and Emerging Therapeutic Options."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Transthyretin-related (ATTR) amyloidosis is a progressive, multisystem disease caused by the extracellular deposition of misfolded transthyretin (TTR) monomers as insoluble amyloid fibrils."
      explanation: >-
        The review supports extracellular amyloid fibril deposition as the
        disease-defining tissue phenotype.
  - target: Cardiomyopathy
    causal_link_type: DIRECT
    description: >-
      Myocardial amyloid accumulation can produce infiltrative cardiomyopathy.
    evidence:
    - reference: PMID:34518987
      reference_title: "The genetics of cardiac amyloidosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "It results from the accumulation of the misfolded protein transthyretin within the myocardium, resulting in amyloid transthyretin-associated cardiomyopathy (ATTR-CM)."
      explanation: >-
        Cardiac amyloidosis evidence directly links myocardial misfolded TTR
        accumulation to ATTR cardiomyopathy.
  - target: Peripheral Neuropathy
    causal_link_type: DIRECT
    description: >-
      Amyloid deposition in hereditary ATTR can produce length-dependent
      peripheral polyneuropathy.
    evidence:
    - reference: PMID:22094129
      reference_title: "Familial amyloid polyneuropathy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "TTR FAP typically causes a nerve length-dependent polyneuropathy that starts in the feet with loss of temperature and pain sensations, along with life-threatening autonomic dysfunction"
      explanation: >-
        Familial amyloid polyneuropathy evidence supports length-dependent
        peripheral neuropathy as a direct amyloidosis manifestation.
  - target: Nephrotic Syndrome
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - renal amyloid nephropathy with heavy proteinuria
    description: >-
      Renal amyloid deposition can progress through nephropathy and
      nephrotic-range proteinuria to nephrotic syndrome.
    evidence:
    - reference: PMID:18514052
      reference_title: "[Amyloidosis AA]."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Nephropathy is the main clinical manifestation of amyloidosis."
      explanation: >-
        AA amyloidosis evidence supports renal nephropathy as a major clinical
        manifestation.
  - target: Macroglossia
    causal_link_type: DIRECT
    description: >-
      Amyloid infiltration can produce tongue enlargement, especially in AL
      amyloidosis.
    evidence:
    - reference: PMID:8115892
      reference_title: "Gastrointestinal manifestations of amyloidosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Gastrointestinal symptoms included anorexia, macroglossia, intestinal"
      explanation: >-
        The clinical case series directly lists macroglossia among
        gastrointestinal manifestations of amyloidosis.
  - target: Autonomic Dysfunction
    causal_link_type: DIRECT
    description: >-
      Hereditary ATTR amyloid polyneuropathy can include life-threatening
      autonomic dysfunction.
    evidence:
    - reference: PMID:22094129
      reference_title: "Familial amyloid polyneuropathy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "TTR FAP typically causes a nerve length-dependent polyneuropathy that starts in the feet with loss of temperature and pain sensations, along with life-threatening autonomic dysfunction leading to cachexia and death"
      explanation: >-
        Familial amyloid polyneuropathy evidence supports autonomic dysfunction
        as a direct amyloidosis manifestation.
  - target: Carpal Tunnel Syndrome
    causal_link_type: DIRECT
    description: >-
      Tenosynovial amyloid deposition can produce median-nerve compression and
      carpal tunnel syndrome in hereditary ATTR amyloidosis.
    evidence:
    - reference: DOI:10.3389/fneur.2023.1242815
      reference_title: "Hereditary transthyretin amyloidosis: a comprehensive review with a focus on peripheral neuropathy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Sperry et al. found amyloid deposits on tenosynovial tissue biopsy in 10 out of 98 patients (median age 68 years) undergoing carpal tunnel surgery for idiopathic carpal tunnel syndrome, and two of them were diagnosed with ATTRv"
      explanation: >-
        The tissue-biopsy evidence connects tenosynovial amyloid with carpal
        tunnel syndrome, while the ATTRv diagnoses preserve the subtype scope.
  - target: Proteinuria
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - glomerular amyloid deposition
    description: >-
      Glomerular amyloid deposition disrupts filtration and produces
      nephrotic-range proteinuria in AA amyloidosis.
    evidence:
    - reference: DOI:10.1007/s11926-024-01147-8
      reference_title: "AA Amyloidosis: A Contemporary View."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Typically, the involvement of glomeruli precipitates nephrotic-range proteinuria and an accelerated decline in estimated glomerular filtration rate (eGFR)"
      explanation: >-
        The review explicitly links glomerular involvement to nephrotic-range
        proteinuria and declining filtration in AA amyloidosis.
phenotypes:
- name: Amyloid Deposition
  category: Histological
  description: >-
    Extracellular deposition of Congo-red-positive, apple-green-birefringent
    fibrillar amyloid in affected tissues is the defining histopathological
    hallmark of all amyloidoses.
  phenotype_term:
    preferred_term: Amyloid deposition
    term:
      id: HP:0011034
      label: Amyloid deposition
  evidence:
  - reference: PMID:33787019
    reference_title: "[Clinical Practice Guidelines for diagnosis of amyloidosis: Part 1/3 Year 2020]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Confirmation in the tissue by biopsy and Congo red staining with the characteristic green birefringence under polarized light is recommended."
    explanation: >-
      The diagnostic guideline identifies tissue Congo-red positivity with
      characteristic birefringence as confirmatory evidence of amyloid deposition.
- name: Cardiomyopathy
  category: Cardiovascular
  description: >-
    Infiltrative cardiomyopathy from amyloid deposition in the myocardium
    causes wall thickening, restrictive physiology, and progressive heart
    failure; prominent in AL and ATTR amyloidosis.
  phenotype_term:
    preferred_term: Restrictive cardiomyopathy
    term:
      id: HP:0001723
      label: Restrictive cardiomyopathy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:34518987
    reference_title: "The genetics of cardiac amyloidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It results from the accumulation of the misfolded protein transthyretin within the myocardium, resulting in amyloid transthyretin-associated cardiomyopathy (ATTR-CM)."
    explanation: This genetics-of-cardiac-amyloidosis review establishes myocardial misfolded TTR accumulation as the cause of ATTR cardiomyopathy.
  - reference: PMID:40649158
    reference_title: "Transthyretin Amyloid Cardiomyopathy-2025 Update: Current Diagnostic Approaches and Emerging Therapeutic Options."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical manifestations vary widely and may include cardiomyopathy (ATTR-CM), polyneuropathy (ATTR-PN), or mixed phenotypes."
    explanation: 2025 update confirms cardiomyopathy as a principal manifestation of ATTR amyloidosis.
- name: Peripheral Neuropathy
  category: Neurological
  description: >-
    Length-dependent sensorimotor and small-fiber peripheral neuropathy is a
    hallmark of hereditary ATTR amyloidosis and can also occur in AL disease.
  phenotype_term:
    preferred_term: Peripheral neuropathy
    term:
      id: HP:0009830
      label: Peripheral neuropathy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:22094129
    reference_title: "Familial amyloid polyneuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TTR FAP typically causes a nerve length-dependent polyneuropathy that starts in the feet with loss of temperature and pain sensations, along with life-threatening autonomic dysfunction"
    explanation: Planté-Bordeneuve and Said establish length-dependent peripheral polyneuropathy as the hallmark neurological manifestation of TTR-FAP.
- name: Nephrotic Syndrome
  category: Renal
  description: >-
    Glomerular amyloid deposition produces heavy proteinuria, hypoalbuminemia,
    edema, and nephrotic syndrome, typical of AL and AA amyloidosis.
  phenotype_term:
    preferred_term: Nephrotic syndrome
    term:
      id: HP:0000100
      label: Nephrotic syndrome
  evidence:
  - reference: PMID:18514052
    reference_title: "[Amyloidosis AA]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nephropathy is the main clinical manifestation of amyloidosis."
    explanation: Stankovic and Grateau identify nephropathy (with proteinuria progressing to nephrotic syndrome) as the dominant clinical manifestation of AA amyloidosis.
  - reference: PMID:23548761
    reference_title: "Renal involvement in AA amyloidosis: clinical outcomes and survival."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean serum creatinine and proteinuria at diagnosis were 4.65±4.89 mg/dl and 8.04±6.09 g/day"
    explanation: Yilmaz et al. document nephrotic-range proteinuria (mean 8 g/day) in a biopsy-proven AA amyloidosis cohort, supporting nephrotic syndrome as a typical phenotype.
- name: Macroglossia
  category: Head and Neck
  subtype: AL
  description: >-
    Tongue enlargement from amyloid infiltration is a relatively specific
    physical finding for AL amyloidosis.
  phenotype_term:
    preferred_term: Macroglossia
    term:
      id: HP:0000158
      label: Macroglossia
  evidence:
  - reference: PMID:8115892
    reference_title: "Gastrointestinal manifestations of amyloidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gastrointestinal symptoms included anorexia, macroglossia, intestinal"
    explanation: Lee et al. document macroglossia as a recognized manifestation of amyloidosis in a clinical case series.
- name: Autonomic Dysfunction
  category: Neurological
  description: >-
    Length-dependent autonomic neuropathy from amyloid deposition in autonomic
    fibers and ganglia produces orthostatic hypotension, gastrointestinal
    dysmotility, neurogenic bladder, and sexual dysfunction; a life-threatening
    hallmark of ATTRv amyloidosis.
  phenotype_term:
    preferred_term: Autonomic dysfunction
    term:
      id: HP:0012332
      label: Abnormal autonomic nervous system physiology
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:22094129
    reference_title: "Familial amyloid polyneuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TTR FAP typically causes a nerve length-dependent polyneuropathy that starts in the feet with loss of temperature and pain sensations, along with life-threatening autonomic dysfunction leading to cachexia and death"
    explanation: Planté-Bordeneuve and Said establish life-threatening autonomic dysfunction as a hallmark of TTR-FAP.
- name: Carpal Tunnel Syndrome
  category: Neurological
  subtype: ATTRv
  description: >-
    Bilateral carpal tunnel syndrome from amyloid deposition in the flexor
    retinaculum/tenosynovium is a common early and often presenting sign of
    ATTRv amyloidosis, frequently predating systemic diagnosis by years.
  phenotype_term:
    preferred_term: Carpal tunnel syndrome
    term:
      id: HP:0012185
      label: Constrictive median neuropathy
  frequency: FREQUENT
  evidence:
  - reference: DOI:10.3389/fneur.2023.1242815
    reference_title: "Hereditary transthyretin amyloidosis: a comprehensive review with a focus on peripheral neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CTS occurred in two-thirds of patients with ATTRv"
    explanation: Poli et al. (citing Karam 2019) report carpal tunnel syndrome in two-thirds of ATTRv patients, supporting both the association and a FREQUENT band.
- name: Proteinuria
  category: Renal
  subtype: AA
  description: >-
    Glomerular amyloid deposition in AA amyloidosis produces proteinuria and
    progressive decline in renal function, the dominant clinical presentation.
  phenotype_term:
    preferred_term: Proteinuria
    term:
      id: HP:0000093
      label: Proteinuria
  frequency: VERY_FREQUENT
  evidence:
  - reference: DOI:10.1007/s11926-024-01147-8
    reference_title: "AA Amyloidosis: A Contemporary View."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "emergence of proteinuria and gradual reduction in kidney function, apparent in over 90% of patients upon their initial presentation"
    explanation: Mirioglu et al. report proteinuria with declining renal function in over 90% of AA amyloidosis patients at presentation, supporting a VERY_FREQUENT band.
genetic:
- name: TTR
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: TTR
    term:
      id: hgnc:12405
      label: TTR
  association: Pathogenic Variants
  subtype: ATTRv
  notes: >-
    Primary amyloid precursor gene encoding transthyretin, a liver-derived
    homotetrameric transport protein for thyroxine and retinol. Pathogenic
    variants destabilize the native tetramer, predisposing to monomer
    dissociation, misfolding, and amyloid fibril formation. More than 100 TTR
    point mutations have been identified worldwide, with Val30Met being the most
    common.
  evidence:
  - reference: PMID:22094129
    reference_title: "Familial amyloid polyneuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The first identified cause of FAP-the TTR Val30Met mutation-is still the most common of more than 100 amyloidogenic point mutations identified worldwide."
    explanation: Planté-Bordeneuve and Said establish TTR Val30Met as the most common of >100 amyloidogenic TTR mutations causing familial amyloid polyneuropathy.
  - reference: PMID:34518987
    reference_title: "The genetics of cardiac amyloidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Over 150 different pathologic point mutations within the transthyretin gene have been identified, each carrying variable clinical phenotypes and penetrance."
    explanation: Arno and Cowger document the breadth and phenotypic heterogeneity of pathogenic TTR variants in cardiac amyloidosis.
  - reference: DOI:10.1001/jamacardio.2024.2190
    reference_title: "Prevalence, Cardiac Phenotype, and Outcomes of Transthyretin Variants in the UK Biobank Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall prevalence of LP/P variants was 0.02% (105 of 444 243) in participants with European ancestry and 4.3% (321 of 7533) in participants with African ancestry."
    explanation: Aung et al. quantify the strong ancestry skew of pathogenic TTR variants (driven by Val142Ile) in UK Biobank, 4.3% in African-ancestry participants versus 0.02% in European-ancestry.
- name: SAA1
  association: Susceptibility/Precursor
  subtype: AA
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: SAA1
    term:
      id: hgnc:10513
      label: SAA1
  notes: >-
    SAA1 encodes serum amyloid A1, the acute-phase apolipoprotein that is the
    fibril precursor in AA amyloidosis. Sustained inflammatory overproduction
    of SAA drives fibril deposition, and SAA1 genotype (e.g., SAA1.1
    homozygosity) modifies AA amyloidosis risk in some populations.
  evidence:
  - reference: DOI:10.1007/s11926-024-01147-8
    reference_title: "AA Amyloidosis: A Contemporary View."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "serum AA (SAA) protein, through a long process including cleavage, misfolding, and aggregation into an insoluble beta-sheet form"
    explanation: Mirioglu et al. identify serum amyloid A (SAA) protein as the acute-phase precursor that is cleaved, misfolds, and aggregates into AA amyloid fibrils.
treatments:
- name: Tafamidis
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Oral transthyretin tetramer stabilizer that binds the thyroxine-binding
    sites of TTR and prevents dissociation into amyloidogenic monomers. The
    pivotal ATTR-ACT trial established benefit in ATTR cardiomyopathy; regulatory
    indications for polyneuropathy vary by jurisdiction.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tafamidis
      term:
        id: CHEBI:78538
        label: tafamidis
  target_mechanisms:
  - target: TTR Tetramer Destabilization and Monomer Release
    treatment_effect: INHIBITS
    description: Kinetic tetramer stabilization reduces release of aggregation-prone TTR monomers.
    evidence:
    - reference: PMID:25604431
      reference_title: "Transthyretin (ATTR) amyloidosis: clinical spectrum, molecular pathogenesis and disease-modifying treatments."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "the clinical effects of TTR tetramer stabilisers, diflunisal and tafamidis, were demonstrated in randomised clinical trials"
      explanation: The review identifies tafamidis as a TTR tetramer stabilizer; the upstream node defines why stabilization inhibits monomer release.
  evidence:
  - reference: PMID:30145929
    reference_title: Tafamidis Treatment for Patients with Transthyretin Amyloid Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with transthyretin amyloid cardiomyopathy, tafamidis was associated with reductions in all-cause mortality and cardiovascular-related hospitalizations and reduced the decline in functional capacity and quality of life as compared with placebo."
    explanation: ATTR-ACT directly demonstrates clinical benefit in ATTR cardiomyopathy without extending the claim to other amyloid types.
- name: Patisiran
  therapeutic_modality: SIRNA
  description: >-
    Lipid-nanoparticle-formulated small interfering RNA that silences hepatic
    TTR mRNA, lowering circulating transthyretin and slowing hereditary ATTR
    polyneuropathy progression.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: patisiran
      term:
        id: NCIT:C116792
        label: Patisiran
  target_mechanisms:
  - target: TTR Tetramer Destabilization and Monomer Release
    treatment_effect: INHIBITS
    description: Hepatic TTR mRNA silencing lowers the circulating precursor pool upstream of tetramer dissociation.
    evidence:
    - reference: DOI:10.1007/s40259-023-00577-7
      reference_title: "RNA Targeting and Gene Editing Strategies for Transthyretin Amyloidosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Binding triggers activation of the Argonaute slicer protein, which degrades the mRNA, thereby inhibiting TTR synthesis"
      explanation: The review directly describes patisiran-mediated TTR mRNA degradation and synthesis inhibition in hepatocytes.
  evidence:
  - reference: PMID:29972753
    reference_title: Patisiran, an RNAi Therapeutic, for Hereditary Transthyretin Amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this trial, patisiran improved multiple clinical manifestations of hereditary transthyretin amyloidosis."
    explanation: The randomized APOLLO trial directly supports benefit in hereditary ATTR amyloidosis with polyneuropathy.
- name: Acoramidis
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Oral high-affinity transthyretin tetramer stabilizer, FDA-approved
    disease-modifying therapy for ATTR cardiomyopathy; binds TTR and prevents
    dissociation into amyloidogenic monomers.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acoramidis
      term:
        id: NCIT:C170791
        label: Acoramidis
  target_mechanisms:
  - target: TTR Tetramer Destabilization and Monomer Release
    treatment_effect: INHIBITS
    description: High-affinity tetramer stabilization reduces monomer dissociation.
    evidence:
    - reference: PMID:38197816
      reference_title: Efficacy and Safety of Acoramidis in Transthyretin Amyloid Cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "(also called AG10) is a novel TTR stabilizer that is designed to mimic the action of the T119M variant."
      explanation: In context, the pivotal trial report directly identifies acoramidis (AG10) as a rationally designed TTR stabilizer; the snippet begins after a PDF line-break artifact in the drug name.
  evidence:
  - reference: PMID:38197816
    reference_title: Efficacy and Safety of Acoramidis in Transthyretin Amyloid Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with transthyretin amyloid cardiomyopathy, the receipt of acoramidis resulted in a significantly better four-step primary hierarchical outcome containing components of mortality, morbidity, and function than placebo."
    explanation: ATTRibute-CM directly demonstrates clinical benefit in ATTR cardiomyopathy.
- name: Vutrisiran
  therapeutic_modality: SIRNA
  description: >-
    Subcutaneous GalNAc-conjugated small interfering RNA that silences hepatic
    TTR mRNA. It lowers variant and wild-type TTR and has randomized phase III
    outcome evidence in ATTR cardiomyopathy as well as an indication for
    hereditary ATTR polyneuropathy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vutrisiran
      term:
        id: NCIT:C152919
        label: Vutrisiran
  target_mechanisms:
  - target: TTR Tetramer Destabilization and Monomer Release
    treatment_effect: INHIBITS
    description: Hepatocyte-directed RNA interference lowers the circulating TTR precursor pool.
    evidence:
    - reference: DOI:10.1007/s40259-023-00577-7
      reference_title: "RNA Targeting and Gene Editing Strategies for Transthyretin Amyloidosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Vutrisiran achieved a dose-dependent TTR knockdown; a single 25 mg subcutaneous dose resulted in a maximum TTR reduction of 80%, which was sustained for 90 days"
      explanation: The review reports sustained, dose-dependent TTR lowering after vutrisiran.
  evidence:
  - reference: PMID:39213194
    reference_title: Vutrisiran in Patients with Transthyretin Amyloidosis with Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among patients with ATTR-CM, treatment with vutrisiran led to a lower risk of death from any cause and cardiovascular events than placebo and preserved functional capacity and quality of life."
    explanation: HELIOS-B directly demonstrates benefit in the ATTR-CM trial population.
- name: NTLA-2001 in vivo TTR gene editing
  action_category: THERAPEUTIC
  therapeutic_modality: GENE_EDITING
  description: >-
    NTLA-2001 (nexiguran ziclumeran) is an investigational, single-infusion
    lipid-nanoparticle CRISPR-Cas9 therapy designed to disrupt TTR in hepatocytes
    and durably lower circulating TTR. First-in-human evidence establishes
    target engagement in a very small cohort, not clinical efficacy.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
    therapeutic_agent:
    - preferred_term: NTLA-2001
      term:
        id: NCIT:C204942
        label: Lipid Nanoparticle Encapsulating mRNA Encoding Cas9 Protein and TTR-targeting Single Guide RNA NTLA-2001
  target_mechanisms:
  - target: TTR Tetramer Destabilization and Monomer Release
    treatment_effect: INHIBITS
    description: In vivo CRISPR-Cas9 knockout of hepatic TTR reduces the circulating precursor available for tetramer formation, misfolding, and deposition.
    evidence:
    - reference: PMID:34215024
      reference_title: CRISPR-Cas9 In Vivo Gene Editing for Transthyretin Amyloidosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "NTLA-2001 is an in vivo gene-editing therapeutic agent that is designed to treat ATTR amyloidosis by reducing the concentration of TTR in serum."
      explanation: The first-in-human report directly defines the therapeutic platform and TTR-lowering mechanism.
  evidence:
  - reference: PMID:34215024
    reference_title: CRISPR-Cas9 In Vivo Gene Editing for Transthyretin Amyloidosis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In a small group of patients with hereditary ATTR amyloidosis with polyneuropathy, administration of NTLA-2001 was associated with only mild adverse events and led to decreases in serum TTR protein concentrations through targeted knockout of TTR."
    explanation: The six-patient early-phase study demonstrates target engagement but not clinical benefit or long-term safety.
- name: Inotersen
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  aso_details:

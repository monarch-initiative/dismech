    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Four FDA-approved RNAi medications for ATTR polyneuropathy are patisiran, vutrisiran, inotersen, and eplontersen."
    explanation: Dave et al. list eplontersen among the four FDA-approved RNA-lowering medications for ATTR polyneuropathy.
- name: Daratumumab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Anti-CD38 monoclonal antibody added to
    bortezomib-cyclophosphamide-dexamethasone (Dara-CyBorD/D-VCd);
    standard-of-care induction for newly diagnosed AL amyloidosis that depletes
    the amyloidogenic clonal plasma cells (ANDROMEDA trial).
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: daratumumab
      term:
        id: NCIT:C74007
        label: Daratumumab
  target_mechanisms:
  - target: Clonal Immunoglobulin Light-Chain Precursor Excess
    treatment_effect: INHIBITS
    description: CD38-directed plasma-cell depletion suppresses production of amyloidogenic light chains.
    evidence:
    - reference: PMID:34192431
      reference_title: Daratumumab-Based Treatment for Immunoglobulin Light-Chain Amyloidosis.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Systemic immunoglobulin light-chain (AL) amyloidosis is characterized by deposition of amyloid fibrils of light chains produced by clonal CD38+ plasma cells. Daratumumab, a human CD38-targeting antibody, may improve outcomes for this disease."
      explanation: The trial report identifies both the CD38-positive clonal plasma-cell source and daratumumab's CD38 target; precursor suppression is the resulting therapeutic inference.
  evidence:
  - reference: PMID:34192431
    reference_title: Daratumumab-Based Treatment for Immunoglobulin Light-Chain Amyloidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The percentage of patients who had a hematologic complete response was significantly higher in the daratumumab group than in the control group (53.3% vs. 18.1%)"
    explanation: ANDROMEDA directly supports the response advantage of daratumumab-CyBorD in newly diagnosed systemic AL amyloidosis.
- name: Tocilizumab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Anti-interleukin-6 receptor monoclonal antibody used in AA amyloidosis to
    suppress the inflammatory drive of serum amyloid A production, lowering SAA
    and improving renal function.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tocilizumab
      term:
        id: NCIT:C84217
        label: Tocilizumab
  target_mechanisms:
  - target: Sustained Serum Amyloid A Precursor Production
    treatment_effect: INHIBITS
    description: IL-6 receptor blockade suppresses the inflammatory acute-phase drive and lowers SAA precursor concentrations.
    evidence:
    - reference: DOI:10.1007/s11926-024-01147-8
      reference_title: "AA Amyloidosis: A Contemporary View."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "tocilizumab was superior to anti-TNFs in terms of obtaining a decrease in SAA"
      explanation: The AA review directly reports reduction of the SAA precursor with tocilizumab.
  evidence:
  - reference: DOI:10.1007/s11926-024-01147-8
    reference_title: "AA Amyloidosis: A Contemporary View."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "tocilizumab was superior to anti-TNFs in terms of obtaining a decrease in SAA"
    explanation: Mirioglu et al. report that tocilizumab (anti-IL-6 receptor) reduced SAA in AA amyloidosis, superior to anti-TNF therapy.
diagnosis:
- name: Tissue Confirmation With Congo Red
  description: >-
    When tissue confirmation is required, biopsy demonstrates amyloid by Congo
    red staining with characteristic green birefringence under polarized light.
    A positive stain establishes amyloid deposition but does not identify the
    precursor protein.
  diagnosis_term:
    preferred_term: Histopathologic examination
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:33787019
    reference_title: "[Clinical Practice Guidelines for diagnosis of amyloidosis: Part 1/3 Year 2020]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Confirmation in the tissue by biopsy and Congo red staining with the characteristic green birefringence under polarized light is recommended."
    explanation: The guideline directly supports tissue confirmation and the defining optical finding.
- name: Proteomic Amyloid Typing
  description: >-
    Amyloid deposits should be biochemically typed because therapies are
    precursor-specific. Mass-spectrometry proteomics can identify established
    and uncommon amyloid types in a single assay and avoids inferring AL solely
    from an incidental monoclonal gammopathy.
  diagnosis_term:
    preferred_term: Mass spectrometry-based amyloid typing
  evidence:
  - reference: PMID:32861330
    reference_title: "Amyloid Typing by Mass Spectrometry in Clinical Practice: a Comprehensive Review of 16,175 Samples."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Amyloid typing by proteomics, which effectively recognizes all amyloid types in a single assay, optimally supports the diagnosis and treatment of amyloidosis patients in routine clinical practice."
    explanation: The 16,175-specimen clinical series supports proteomic typing across amyloid types.
- name: Monoclonal Protein Evaluation
  description: >-
    Serum free light chains plus serum and urine immunofixation evaluate a
    monoclonal plasma-cell process. This screen is essential before accepting a
    non-biopsy ATTR-CM diagnosis and does not by itself prove that a deposit is AL.
  diagnosis_term:
    preferred_term: Laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:33787019
    reference_title: "[Clinical Practice Guidelines for diagnosis of amyloidosis: Part 1/3 Year 2020]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Measurement of serum free light chains is recommended for evaluation of a monoclonal plasma cell proliferative disorder."
    explanation: The guideline supports serum free-light-chain testing for a monoclonal plasma-cell disorder.
- name: Cardiac Radionuclide Scintigraphy
  description: >-
    Bone-avid radionuclide (e.g., technetium-pyrophosphate/DPD/HMDP)
    scintigraphy enables accurate non-invasive diagnosis of transthyretin
    cardiac amyloidosis (ATTR-CM) in patients with a negative monoclonal
    protein screen, obviating endomyocardial biopsy.
  diagnosis_term:
    preferred_term: cardiac radionuclide scintigraphy
    term:
      id: NCIT:C62667
      label: Radionuclide Imaging
  evidence:
  - reference: PMID:41171219
    reference_title: "Transthyretin Cardiac Amyloidosis Evaluation and Management: 2025 ACC Concise Clinical Guidance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There have also been substantial advances in diagnosis, including the ability to perform accurate noninvasive diagnosis using radionuclide scintigraphy in individuals with a negative monoclonal protein screen."
    explanation: The 2025 ACC guidance establishes radionuclide scintigraphy as an accurate non-invasive diagnostic test for transthyretin cardiac amyloidosis when the monoclonal protein screen is negative.
- name: Early Diagnosis of AL Amyloidosis
  description: >-
    Prompt recognition of AL amyloidosis across haematology, cardiology,
    neurology, renal, and general clinics, because early-stage diagnosis before
    advanced organ involvement markedly improves survival with contemporary
    treatment.
  evidence:
  - reference: PMID:42099096
    reference_title: "Early diagnosis of AL amyloidosis in haematology, cardiology, neurology, renal and general clinics: A British Society for Haematology Guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients with early-stage disease can expect approximately 80% survival at 5 years with contemporary treatment, compared to less than 30% for those with advanced disease."
    explanation: The British Society for Haematology guideline motivates early cross-specialty AL amyloidosis diagnosis by quantifying the large survival advantage of early-stage detection.
prevalence:
- population: United States
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.61
  notes: >-
    ATTR amyloidosis point prevalence 6.1 per million in the US in a systematic
    review (range up to 232 per million in endemic Portugal).
  evidence:
  - reference: DOI:10.1186/s13023-025-03547-0
    reference_title: "Epidemiology of transthyretin (ATTR) amyloidosis: a systematic literature review."
    supports: SUPPORT

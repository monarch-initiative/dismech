review_notes: >-
  Publication-readiness review in 2026 retained this MONDO umbrella entry but
  explicitly bounded subtype claims, aligned the causal graph to the
  amyloidogenesis module, replaced review-only treatment claims with pivotal
  trial evidence where available, expanded diagnostic typing and differential
  diagnosis, and added clinical-trial and model-fidelity context. Dedicated AL
  and hereditary ATTR entries remain the home for subtype-level depth.
classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    notes: AL amyloidosis is a clonal plasma-cell disorder.
    evidence:
    - reference: PMID:34192431
      reference_title: Daratumumab-Based Treatment for Immunoglobulin Light-Chain Amyloidosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Systemic immunoglobulin light-chain (AL) amyloidosis is characterized by deposition of amyloid fibrils of light chains produced by clonal CD38+ plasma cells."
      explanation: The clonal plasma-cell origin supports hematology classification for AL amyloidosis.
  - classification_value: CARDIOVASCULAR
    notes: Cardiac amyloidosis is a major systemic presentation.
    evidence:
    - reference: PMID:34518987
      reference_title: "The genetics of cardiac amyloidosis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "It results from the accumulation of the misfolded protein transthyretin within the myocardium, resulting in amyloid transthyretin-associated cardiomyopathy (ATTR-CM)."
      explanation: Myocardial involvement and cardiomyopathy support cardiovascular classification.
  - classification_value: KIDNEY_URINARY_TRACT
    notes: Renal amyloid is central in AL and AA disease.
    evidence:
    - reference: PMID:18514052
      reference_title: "[Amyloidosis AA]."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Nephropathy is the main clinical manifestation of amyloidosis."
      explanation: The AA review supports kidney and urinary-tract classification.
  - classification_value: NEUROLOGIC
    notes: ATTRv and AL can cause peripheral and autonomic neuropathy.
    evidence:
    - reference: PMID:22094129
      reference_title: "Familial amyloid polyneuropathy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "TTR FAP typically causes a nerve length-dependent polyneuropathy that starts in the feet with loss of temperature and pain sensations, along with life-threatening autonomic dysfunction"
      explanation: Peripheral and autonomic neuropathy support neurologic classification.
  mechanistic_category:
  - classification_value: proteotoxic disease
    evidence:
    - reference: DOI:10.1038/s41580-023-00647-2
      reference_title: "Mechanisms and pathology of protein misfolding and aggregation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Multiple lines of evidence suggest that small soluble species are responsible for the observed toxicity."
      explanation: Evidence for toxicity from soluble misfolded species supports the proteotoxic-disease classification.

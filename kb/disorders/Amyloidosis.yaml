animal_models:
- species: Mus musculus
  genotype: Human mutant TTR Met30 transgene
  description: >-
    Transgenic mice expressing human mutant TTR Met30 develop age-progressive
    systemic amyloid in gastrointestinal, cardiovascular, renal, and other
    tissues. They reproduce fibril composition and much of the human systemic
    deposition pattern but fail to deposit amyloid in peripheral and autonomic
    nervous tissues, limiting their fidelity for the defining human neuropathy.
  genes:
  - preferred_term: TTR
    term:
      id: hgnc:12405
      label: TTR
  evidence:
  - reference: PMID:8086125
    reference_title: Systemic amyloidosis in transgenic mice carrying the human mutant transthyretin (Met 30) gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In these transgenic mice, amyloid deposition started in the gastrointestinal tract, cardiovascular system, and kidneys and extended to various other organs and tissues with advancing age."
    explanation: The study documents age-progressive systemic deposition in the transgenic model.
  - reference: PMID:8086125
    reference_title: Systemic amyloidosis in transgenic mice carrying the human mutant transthyretin (Met 30) gene.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "The most striking pathologic feature of the transgenic mice was the absence of amyloid deposition in the peripheral and autonomic nervous tissues."
    explanation: The negative model result establishes a major translational limitation for amyloid neuropathy.
discussions:
- discussion_id: amyloidosis_precursor_specificity_and_umbrella_scope
  prompt: >-
    How should precursor-specific epidemiology, organ tropism, and treatment
    effects be compared without treating amyloidosis as one homogeneous disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Amyloid Fibril Formation and Extracellular Deposition
  rationale: >-
    Amyloid fibril formation is shared, but AL, ATTRv, ATTRwt, AA, hereditary
    non-TTR, and localized forms differ in precursor supply, affected populations,
    organ distribution, prognosis, and therapy. This umbrella record therefore
    retains subtype qualifiers and defers subtype-level detail to dedicated entries.
  evidence:
  - reference: PMID:33100054
    reference_title: "Amyloid nomenclature 2020: update and recommendations by the International Society of Amyloidosis (ISA) nomenclature committee."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Possible novel human amyloid fibril proteins, appearing as 'classical' in vivo amyloid, were discussed. It was decided to include fibulin-like extracellular matrix protein 1 (amyloid protein: AEFEMP1), which appears as localised amyloid in portal veins. There are several possible amyloid proteins under investigation"
    explanation: The ISA update demonstrates precursor and localization heterogeneity and continuing candidate discovery, supporting the need to avoid a homogeneous umbrella interpretation.
- discussion_id: attr_mouse_neuropathy_model_mismatch
  prompt: >-
    Which model systems reproduce human peripheral and autonomic nerve deposition
    closely enough to test neuropathy-directed clearance and repair strategies?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Amyloid Fibril Formation and Extracellular Deposition
  rationale: >-
    The classic human TTR Met30 transgenic mouse develops systemic deposits but
    lacks deposition in the peripheral and autonomic nervous systems, so it
    cannot alone establish treatment effects on the defining human neuropathy.
  evidence:
  - reference: PMID:8086125
    reference_title: Systemic amyloidosis in transgenic mice carrying the human mutant transthyretin (Met 30) gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The most striking pathologic feature of the transgenic mice was the absence of amyloid deposition in the peripheral and autonomic nervous tissues."
    explanation: The model directly demonstrates the human-model mismatch.

- accession: ega:EGAS00001001418
  title: Exome Sequencing to Define the Landscape of Plasma Cells in Systemic Light chain Amyloidosis
  description: Systemic light chain amyloidosis (AL) is characterized by the deposition of immunoglobulin light chains as amyloid fibrils in different organs, where they form toxic protein aggregates. The underlying disease is a plasma cell disorder, but limited whole exome data are available. We report the findings of an exome sequencing study in AL to define a plasma cell signature and compare this to monoclonal gammopathy of undefined significance (MGUS) and myeloma (MM). Twenty-four samples from unselected newly diagnosed untreated AL patients were analysed. CD138+ cells were isolated from bone marrow cells using MACSorting (Miltenyi Biotech, Bisley, UK).
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Amyloidosis"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001002730
  title: Brain transcriptome of hereditary cerebral haemorrhage with amyloidosis–Dutch type (HCHWA-D)
  description: HCHWA-D is an early onset hereditary form of Cerebral Amyloid Angiopathy (CAA) caused by a point mutation resulting in an amino acid change (NP_000475.1:p.Glu693Gln) in the Amyloid Precursor Protein (APP). Post-mortem brain tissue (9 patients and 9 age-related controls; frontal and occipital cortex) was used for next generation sequencing of RNA (RNA-Seq with ribosomal RNA depletion).
  organism:

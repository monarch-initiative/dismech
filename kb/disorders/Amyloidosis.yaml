differential_diagnoses:
- name: Hypertrophic cardiomyopathy
  disease_term:
    preferred_term: hypertrophic cardiomyopathy
    term:
      id: MONDO:0005045
      label: hypertrophic cardiomyopathy
  description: >-
    Sarcomeric hypertrophic cardiomyopathy can resemble cardiac amyloidosis by
    producing increased ventricular wall thickness and heart failure symptoms.
  distinguishing_features:
  - Dynamic outflow-tract obstruction or systolic anterior motion favors sarcomeric hypertrophic cardiomyopathy.
  - Amyloid evaluation integrates monoclonal-protein testing, bone scintigraphy, cardiac imaging, and tissue typing when needed.
  evidence:
  - reference: PMID:41463072
    reference_title: "Hypertrophic Cardiomyopathy Phenocopies: Classification, Key Features, and Differential Diagnosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "numerous non-sarcomeric phenocopies exist, including amyloidosis, Fabry disease, glycogen storage disorders, RASopathies, and mitochondrial diseases."
    explanation: The review places amyloidosis among the major nonsarcomeric hypertrophic phenocopies that require differentiation from sarcomeric HCM.
- name: Fabry disease
  disease_term:
    preferred_term: Fabry disease
    term:
      id: MONDO:0010526
      label: Fabry disease
  description: >-
    Fabry cardiomyopathy is a metabolic phenocopy that can also present with
    ventricular wall thickening; correct identification matters because the
    amyloidosis and Fabry treatment pathways are different.
  distinguishing_features:
  - Fabry disease is evaluated with alpha-galactosidase A activity, GLA testing, and characteristic extracardiac findings rather than amyloid typing.
  evidence:
  - reference: PMID:41463072
    reference_title: "Hypertrophic Cardiomyopathy Phenocopies: Classification, Key Features, and Differential Diagnosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "numerous non-sarcomeric phenocopies exist, including amyloidosis, Fabry disease, glycogen storage disorders, RASopathies, and mitochondrial diseases."
    explanation: The review places amyloidosis and Fabry disease among the major nonsarcomeric hypertrophic phenocopies.

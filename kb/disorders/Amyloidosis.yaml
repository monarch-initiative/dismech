- accession: ega:EGAS00001004214
  title: Analysis of exonic somatic variants in light-chain amyloidosis (ALA) and ALA concomitant with multiple myeloma
  description: We aim to provide the very first insight into ALA+MM molecular profiles and compare the results with ALA and with MM. Our detailed study of ALA and ALA+MM represents an important step towards improved understanding of their genetic and transcriptomic background, which is a prerequisite for development of optimal treatment strategies in the future.

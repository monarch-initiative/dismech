name: Acute Opioid Poisoning
creation_date: "2026-10-04T04:30:00Z"
category: Toxic Exposure Disorder
synonyms:
- opioid toxidrome
- opioid overdose
- opioid intoxication
- acute opioid intoxication
- narcotic poisoning
disease_term:
  preferred_term: acute opioid poisoning
  term:
    id: MONDO:0018173
    label: acute opioid poisoning
description: >-
  Acute opioid poisoning is the toxidrome produced when an opioid agonist
  occupies central mu-opioid receptors in excess, whether the exposure is
  therapeutic, recreational, accidental (including pediatric ingestion), or
  iatrogenic. The classic toxidrome is the triad of depressed consciousness,
  respiratory depression, and miosis (pinpoint pupils), with reduced
  gastrointestinal motility, hypothermia, and non-cardiogenic pulmonary edema
  as further features. Respiratory depression is the sine qua non and the
  proximate cause of death. Naloxone, a competitive mu-opioid receptor
  antagonist, reverses the toxidrome and serves as both antidote and
  near-diagnostic test. This entry models the acute pharmacodynamic toxidrome
  and is deliberately distinct from the chronic neuroadaptive disease of opioid
  use disorder.
notes: >-
  Scope: this is the acute poisoning event (an exposure-driven pharmacodynamic
  toxidrome), not opioid use disorder (MONDO:0005530), which is curated
  separately as a psychiatric disease. The two overlap clinically because
  overdose is the terminal event of use disorder, but the mechanisms modeled
  here are the acute receptor-level cascade, not the neuroadaptation of
  dependence and tolerance.
pathophysiology:
- name: Systemic Opioid Exposure
  role: trigger
  description: >-
    An opioid agonist is absorbed and distributed systemically, crossing the
    blood-brain barrier to reach central mu-opioid receptors. The dose that
    produces the toxidrome depends on the agent's potency, the route, and the
    patient's tolerance; children who ingest opioids intended for adults are a
    recurring accidental source.
  downstream:
  - target: Central Mu-Opioid Receptor Overactivation
    description: Distributed agonist occupies central mu-opioid receptors in excess.
  evidence:
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "data indicate that the frequent prescription of opioid analgesics contributes to overdose-related mortality among children, who may find and ingest agents in the home that were intended for adults"
    explanation: Supports exogenous opioid exposure, including accidental pediatric ingestion, as the initiating event.
- name: Central Mu-Opioid Receptor Overactivation
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Excess agonism of the mu-opioid receptor, a Gi/Go-coupled G-protein-coupled
    receptor that inhibits adenylate cyclase, hyperpolarizes and silences neurons
    across brainstem respiratory centers, cortical and thalamic arousal pathways,
    the Edinger-Westphal nucleus, and enteric circuits. The mu receptor accounts
    for the preponderance of opioid clinical effects.
  molecular_functions:
  - preferred_term: mu-opioid receptor activity
    modifier: INCREASED
    term:
      id: GO:0004985
      label: G protein-coupled opioid receptor activity
  biological_processes:
  - preferred_term: adenylate cyclase-inhibiting opioid receptor signaling
    modifier: INCREASED
    term:
      id: GO:0031635
      label: adenylate cyclase-inhibiting opioid receptor signaling pathway
  cell_types:
  - preferred_term: central nervous system neuron
    term:
      id: CL:2000029
      label: central nervous system neuron
  downstream:
  - target: Brainstem Respiratory Center Suppression
    description: Mu-opioid agonism in brainstem respiratory centers blunts the ventilatory response to CO2 and hypoxia.
  - target: Cortical and Thalamic Arousal Suppression
    description: Mu-opioid agonism in arousal pathways depresses consciousness.
  - target: Parasympathetic Pupillary Constriction
    description: Mu-opioid action at the Edinger-Westphal nucleus drives pupillary constriction.
  - target: Reduced Gastrointestinal Motility
    description: Mu-opioid agonism on gastrointestinal receptors slows peristalsis.
  evidence:
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The mu opioid receptor is responsible for the preponderance of clinical effects caused by opioids."
    explanation: Supports the mu-opioid receptor as the central effector of the toxidrome.
- name: Brainstem Respiratory Center Suppression
  role: effector
  description: >-
    Agonism of mu-opioid receptors on brainstem respiratory neurons suppresses
    the ventilatory response to hypercarbia and hypoxia and the drive to
    breathe, producing hypoventilation.
  biological_processes:
  - preferred_term: nervous-system control of respiratory gas exchange
    modifier: DECREASED
    term:
      id: GO:0002087
      label: regulation of respiratory gaseous exchange by nervous system process
  locations:
  - preferred_term: brainstem
    term:
      id: UBERON:0002298
      label: brainstem
  downstream:
  - target: Respiratory depression
    description: Suppressed central respiratory drive manifests as hypoventilation.
  evidence:
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "brain-stem opioid receptors modulate respiratory responses to hypercarbia and hypoxemia"
    explanation: Supports mu-opioid suppression of the brainstem ventilatory response to hypercarbia and hypoxia.
  - reference: PMID:35965031
    reference_title: The pathophysiology of opioid-induced respiratory depression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "respiratory depression, which can lead to lethal overdose if not treated"
    explanation: Supports opioid suppression of respiration as the lethal mechanism.
- name: Cortical and Thalamic Arousal Suppression
  role: effector
  description: >-
    Mu-opioid agonism across cortical and thalamic arousal circuits depresses
    the level of consciousness, from somnolence to stupor to coma.
  cell_types:
  - preferred_term: central nervous system neuron
    term:
      id: CL:2000029
      label: central nervous system neuron
  downstream:
  - target: Depressed consciousness
    description: Suppressed arousal circuitry manifests as a depressed level of consciousness.
- name: Parasympathetic Pupillary Constriction
  role: effector
  biological_scale: TISSUE
  description: >-
    Mu-opioid action at the Edinger-Westphal nucleus increases parasympathetic
    outflow to the iris sphincter, constricting the pupil.
  locations:
  - preferred_term: iris sphincter muscle
    term:
      id: UBERON:0001607
      label: sphincter pupillae
  downstream:
  - target: Miosis
    description: Increased parasympathetic tone to the iris sphincter produces pinpoint pupils.
  evidence:
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "receptors in the Edinger-Westphal nucleus of the oculomotor nerve control pupillary constriction"
    explanation: Supports mu-opioid action at the Edinger-Westphal nucleus driving pupillary constriction.
- name: Reduced Gastrointestinal Motility
  role: effector
  biological_scale: TISSUE
  description: >-
    Agonism of enteric and central mu-opioid receptors slows peristalsis and
    reduces gut motility.
  biological_processes:
  - preferred_term: peristalsis
    modifier: DECREASED
    term:
      id: GO:0030432
      label: peristalsis
  cell_types:
  - preferred_term: enteric neuron
    term:
      id: CL:0007011
      label: enteric neuron
  downstream:
  - target: Gastrointestinal dysmotility
    description: Slowed peristalsis manifests as reduced bowel motility.
  evidence:
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Opioid agonists bind to receptors in the gastrointestinal tract to decrease gut motility."
    explanation: Supports mu-opioid agonism reducing gastrointestinal motility.
phenotypes:
- name: Respiratory depression
  description: >-
    Hypoventilation with a reduced respiratory rate and depth and a blunted
    chemoreceptor drive; the defining feature of opioid toxicity. A respiratory
    rate at or below 12 breaths per minute in a patient who is not asleep is
    strongly suggestive.
  phenotype_term:
    preferred_term: Respiratory depression
    term:
      id: HP:0002791
      label: Hypoventilation
  sequelae:
  - target: Respiratory arrest
    description: Progressive, unrelieved hypoventilation culminates in apnea and respiratory arrest.
  - target: Noncardiogenic pulmonary edema
    description: Failure of oxygenation later in the course is often due to pulmonary edema.
  evidence:
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The sine qua non of opioid intoxication is respiratory depression."
    explanation: States that respiratory depression is the defining feature of the toxidrome.
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A respiratory rate of 12 breaths per minute or less in a patient who is not in physiologic sleep strongly suggests acute opioid intoxication, particularly when accompanied by miosis or stupor."
    explanation: Gives the clinical threshold that defines the respiratory depression phenotype.
- name: Depressed consciousness
  description: Somnolence progressing through stupor to coma.
  phenotype_term:
    preferred_term: Depressed level of consciousness
    term:
      id: HP:0004372
      label: Reduced consciousness
  sequelae:
  - target: Hypothermia
    description: A persistently unresponsive patient in a cool environment loses heat.
  evidence:
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the classic toxidrome of apnea, stupor, and miosis suggests the diagnosis of opioid toxicity"
    explanation: Lists stupor (depressed consciousness) as a member of the classic triad.
- name: Miosis
  description: Bilateral pinpoint pupils. Characteristic but not sufficient alone for the diagnosis.
  phenotype_term:
    preferred_term: Miosis
    term:
      id: HP:0000616
      label: Miosis
  evidence:
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Miosis alone is insufficient to infer the diagnosis of opioid intoxication."
    explanation: Supports miosis as a toxidrome feature while noting it is not diagnostic alone.
- name: Gastrointestinal dysmotility
  description: >-
    Reduced bowel motility and hypoactive bowel sounds from opioid agonism on the
    gut; acutely a hypomotility rather than the chronic constipation of
    sustained opioid use.
  phenotype_term:
    preferred_term: Reduced gastrointestinal motility
    term:
      id: HP:0002579
      label: Gastrointestinal dysmotility
  evidence:
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Opioid agonists bind to receptors in the gastrointestinal tract to decrease gut motility."
    explanation: Supports the reduced-motility phenotype.
- name: Respiratory arrest
  description: Apnea from unrelieved hypoventilation; the terminal event of untreated poisoning.
  phenotype_term:
    preferred_term: Respiratory arrest
    term:
      id: HP:0005943
      label: Respiratory arrest
  evidence:
  - reference: PMID:35965031
    reference_title: The pathophysiology of opioid-induced respiratory depression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "respiratory depression, which can lead to lethal overdose if not treated"
    explanation: Supports the progression of respiratory depression to lethal respiratory failure.
- name: Noncardiogenic pulmonary edema
  description: >-
    Pulmonary edema appearing later in the clinical course, a major contributor
    to failure of oxygenation; one proposed mechanism is attempted inspiration
    against a closed glottis lowering intrathoracic pressure and causing fluid
    extravasation.
  phenotype_term:
    preferred_term: Noncardiogenic pulmonary edema
    term:
      id: HP:0100598
      label: Pulmonary edema
  evidence:
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "pulmonary edema is present in nearly all fatal cases of opioid overdose"
    explanation: Supports pulmonary edema as a frequent and serious feature of fatal poisoning.
  - reference: PMID:24144776
    reference_title: "The large spectrum of pulmonary complications following illicit drug use: features and mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Non-cardiogenic pulmonary edema has been attributed to heroin, despite debated mechanisms including attempted inspiration against a closed glottis"
    explanation: Independently attributes non-cardiogenic pulmonary edema to opioids and names the closed-glottis mechanism.
- name: Hypothermia
  description: Low body temperature, typically from a prolonged unresponsive state in a cool environment.
  phenotype_term:
    preferred_term: Hypothermia
    term:
      id: HP:0002045
      label: Hypothermia
  evidence:
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hypothermia may arise from a persistently unresponsive state in a cool environment"
    explanation: Supports hypothermia as a secondary consequence of the unresponsive state.
treatments:
- name: Naloxone
  description: >-
    Competitive mu-opioid receptor antagonist and the antidote; it reverses the
    respiratory depression and the full toxidrome. Its duration of action is
    shorter than that of many opioids, so re-sedation can occur and observation
    is required.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: naloxone
      term:
        id: CHEBI:7459
        label: naloxone
  target_mechanisms:
  - target: Central Mu-Opioid Receptor Overactivation
    description: Naloxone competitively antagonizes the mu-opioid receptor, reversing the toxidrome.
  evidence:
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Naloxone, the antidote for opioid overdose, is a competitive mu opioid-receptor antagonist that reverses all signs of opioid intoxication."
    explanation: States naloxone's mechanism and that it reverses the toxidrome.
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "its apparent duration of action is 20 to 90 minutes, a much shorter period than that of many opioids"
    explanation: Supports the re-sedation risk and the need for observation.
- name: Assisted ventilation and airway support
  description: >-
    Bag-valve-mask ventilation and airway positioning restore oxygenation in the
    apneic or severely hypoventilating patient and are first-line alongside or
    ahead of naloxone.
  treatment_term:
    preferred_term: assisted ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_mechanisms:
  - target: Respiratory depression
    description: Mechanical ventilation substitutes for the suppressed respiratory drive.
  evidence:
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients with apnea need a pharmacologic or mechanical stimulus in order to breathe."
    explanation: Supports mechanical ventilation as a core response to opioid-induced apnea.
diagnosis:
- name: Clinical toxidrome recognition
  description: >-
    The diagnosis is clinical, inferred from the triad of depressed
    consciousness, respiratory depression, and miosis together with the history
    and vital signs; the findings are not all consistently present.
  evidence:
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although the classic toxidrome of apnea, stupor, and miosis suggests the diagnosis of opioid toxicity, all of these findings are not consistently present."
    explanation: States the clinical triad and its inconsistency, the basis of diagnosis.
- name: Therapeutic response to naloxone
  description: >-
    Reversal of respiratory depression by naloxone supports the diagnosis;
    failure to respond to escalating doses up to 15 mg argues against opioid
    poisoning as the cause.
  evidence:
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "If there is no abatement in respiratory depression after the administration of 15 mg of naloxone, it is unlikely that the cause of the depression is opioid overdose."
    explanation: Supports the naloxone response as a near-diagnostic test.
differential_diagnoses:
- name: Clonidine and imidazoline toxicity
  description: >-
    The classic pharmacologic mimic of the opioid toxidrome. Central
    alpha-2-adrenergic agonism from clonidine (and imidazoline decongestants)
    produces CNS depression, miosis, and respiratory depression that look like
    opioid poisoning, and it may even partially respond to naloxone. It is a
    frequent cause of accidental pediatric exposure.
  distinguishing_features:
  - Prominent bradycardia and hypotension accompany the CNS depression and miosis in clonidine toxicity.
  - Reversal of CNS depression by naloxone, when it occurs in clonidine toxicity, typically requires higher-than-standard doses and is inconsistent.
  evidence:
  - reference: PMID:41292070
    reference_title: "Pediatric Clonidine Toxicity: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Clonidine toxicity mimics an opioid toxidrome, often presenting with CNS depression, miosis, bradycardia, and hypotension."
    explanation: States directly that clonidine toxicity mimics the opioid toxidrome and names the distinguishing autonomic features.
  - reference: PMID:41292070
    reference_title: "Pediatric Clonidine Toxicity: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "naloxone may be beneficial in reversing CNS depression, though higher-than-standard doses are often required"
    explanation: Supports the partial, high-dose naloxone response that distinguishes clonidine from opioid toxicity.
- name: Sedative-hypnotic toxidrome
  description: >-
    Overdose of benzodiazepines, barbiturates, ethanol, antipsychotics, or
    anticonvulsants depresses consciousness and can even cause miosis, but it
    lacks the respiratory depression that defines opioid toxicity. Benzodiazepines
    are also a common co-ingestant that worsens opioid overdose.
  distinguishing_features:
  - The respiratory depression that defines opioid toxicity is usually absent in sedative-hypnotic overdose.
  - Sedative-hypnotic overdose does not respond to naloxone.
  evidence:
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "overdose from antipsychotic drugs, anticonvulsant agents, ethanol, and other sedative hypnotic agents can cause miosis and coma, but the respiratory depression that defines opioid toxicity is usually absent"
    explanation: Gives the overlap (miosis and coma) and the key distinguishing feature (respiratory depression usually absent).
- name: Cholinergic toxidrome (organophosphate or carbamate poisoning)
  disease_term:
    preferred_term: organophosphate poisoning
    term:
      id: MONDO:0800386
      label: organophosphate poisoning
  description: >-
    Organophosphate and carbamate poisoning also produces miosis and depressed
    consciousness, but adds a cholinergic excess picture (bradycardia,
    hypersecretion, fasciculations, seizures) that opioid poisoning does not, and
    it does not respond to naloxone.
  distinguishing_features:
  - Cholinergic toxidrome adds bradycardia, muscle fasciculations, and seizures to the miosis, none of which belong to opioid poisoning.
  - It is treated with atropine and an oxime, not naloxone.
  evidence:
  - reference: PMID:32626615
    reference_title: "Organophosphate Poisoning: Demographics, Severity Scores and Outcomes From National Poisoning Control Centre, Karachi."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severe such as bradycardia, miosis, fasciculations, seizures and altered level of consciousness"
    explanation: Shows the cholinergic toxidrome shares miosis and depressed consciousness with opioid poisoning but adds bradycardia and fasciculations.
- name: Pontine hemorrhage
  description: >-
    A structural, non-toxicological mimic: pontine (brainstem) hemorrhage can
    produce pinpoint pupils and coma identical to opioid poisoning, but with
    focal neurological signs and no response to naloxone, and is diagnosed on
    imaging.
  distinguishing_features:
  - Pontine hemorrhage shows focal signs such as gaze deviation and hemiplegia, which opioid poisoning does not.
  - It does not respond to naloxone and is confirmed on CT or MRI.
  evidence:
  - reference: PMID:31246723
    reference_title: "Fatal Intracerebral Hemorrhage in Cerebral Autosomal Dominant Arteriopathy With Subcortical Infarcts and Leukoencephalopathy (CADASIL): A Case Report."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glasgow Coma Scale (GCS) of 7 (E2, V1, M4), left gaze deviation, pinpoint pupils, and left hemiplegia"
    explanation: A pontine hemorrhage presenting with pinpoint pupils and coma (mimicking opioid toxicity) but with focal signs that distinguish it.
prevalence:
- population: United States (2010, National Poison Data System)
  measure_type: UNKNOWN
  prevalence_class: COMMON
  notes: >-
    Surveillance count, not a population rate: the National Poison Data System
    recorded more than 107,000 opioid-analgesic exposures and more than 27,500
    related health-care admissions in 2010.
  evidence:
  - reference: PMID:22784117
    reference_title: Management of opioid analgesic overdose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "reported more than 107,000 exposures to opioid analgesics, which led to more than 27,500 admissions to health care facilities"
    explanation: Quantifies the scale of opioid-analgesic poisoning in US surveillance data.
datasets: []
